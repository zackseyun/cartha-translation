source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ רְאֵה֙ נָתַ֣תִּי בְ/יָֽדְ/ךָ֔ אֶת יְרִיח֖וֹ וְ/אֶת מַלְכָּ֑/הּ גִּבּוֹרֵ֖י הֶ/חָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Josua: „Sieh, ich habe Jericho samt seinem König und den tapferen Kriegern[a] in deine Hand gegeben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den kampfstarken Kriegern“ oder „den tüchtigen Kämpfern“. Der hebräische Ausdruck verbindet Stärke mit militärischer Tüchtigkeit und Tapferkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen JHWH in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Bewahrt die fortlaufende hebräische Erzählweise, ohne eine ausdrücklich zeitliche Abstufung hinzuzufügen.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ dient als nachdrücklicher Aufmerksamkeitsruf; „Sieh“ erhält seine direkte Form und ist zugleich verständlich.
- source_word: נָתַתִּי
  choice: ich habe … gegeben
  rationale: Bewahrt den perfektiven Ausdruck, mit dem Jahwe den noch bevorstehenden Sieg als feststehende Gabe bezeichnet.
- source_word: בְיָדְךָ
  choice: in deine Hand
  rationale: Erhält das verständliche hebräische Bild für die Übergabe in Josuas Gewalt oder Verfügungsmacht.
- source_word: יְרִיחוֹ
  choice: Jericho
  rationale: Verwendet die etablierte deutsche Form des Ortsnamens.
- source_word: מַלְכָּהּ
  choice: seinem König
  rationale: Das Suffix bezieht sich auf die Stadt Jericho; im Deutschen ist der maskuline Bezug wegen des Namens und des mitgedachten Ortes natürlich.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: die tapferen Krieger
  rationale: Gibt sowohl die militärische Stärke als auch die Tüchtigkeit beziehungsweise Tapferkeit der bezeichneten Männer in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Aussagekraft des Perfekts נָתַתִּי vor der Schlacht
  choice: „ich habe … gegeben“ als Erklärung eines feststehenden göttlichen Handelns
  alternative: „ich gebe“ oder „ich werde geben“
  rationale: Die Perfektform stellt die Übergabe aus der Perspektive des Sprechers als vollzogen beziehungsweise gewiss dar. Die Übersetzung wahrt diese Spannung, ohne die Aussage ausdrücklich in eine Zukunftsform umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der hebräische Erzählanschluss und das Bild „in deine Hand“ bleiben erhalten; schwerfällige Wendungen wie „Helden der Tapferkeit“ werden vermieden.
