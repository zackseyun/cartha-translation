  naturalness: Die revidierte Satzfolge ist modernes, verständliches Standarddeutsch. „Der Vernichtung verfallt“ ist idiomatischer als „der Vernichtung anheimfallt“ und bewahrt die resultative Deutung ohne unnötig gehobenes Vokabular.
  terminology: „Was der Vernichtung geweiht ist“ gibt den kollektiven Charakter von חֵרֶם angemessen wieder. Die Wiederholung wahrt die terminologische Kohärenz. Die Fußnote zum Bann erklärt den technischen Begriff sachgerecht, ohne eine konfessionelle Deutung einzutragen.
