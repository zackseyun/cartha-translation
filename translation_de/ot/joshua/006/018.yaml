source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: de
  text: Ihr aber hütet euch vor dem, was der Vernichtung geweiht ist[a], damit ihr nicht selbst der Vernichtung verfallt[b], etwas von dem nehmt, was der Vernichtung geweiht ist, das Lager Israels der Vernichtung preisgebt und es ins Unglück stürzt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ḥerem bezeichnet hier Personen oder Dinge, die Gott unwiderruflich übereignet und zur Vernichtung bestimmt sind; traditionell wird es auch mit „Bann“ oder „Gebanntes“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Näher am Hebräischen: „damit ihr euch nicht selbst der Vernichtung weiht“; traditionell: „damit ihr nicht selbst unter den Bann geratet“.'
    reason: alternative_reading
  - marker: c
    text: „Ins Unglück stürzen“ greift ein Wortspiel auf, das in Josua 7,25 bei Achan wiederkehrt; vgl. die Erzählung von Achans Vergehen in Josua 7,1.
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: Ihr aber
  rationale: Die Formulierung gibt den einschränkenden und kontrastierenden Nachdruck von וְרַק sowie das ausdrücklich gesetzte Pronomen אַתֶּם in natürlichem Deutsch wieder.
- source_word: שִׁמְרוּ מִן־הַחֵרֶם
  choice: hütet euch vor dem, was der Vernichtung geweiht ist
  rationale: שמר mit מן bezeichnet hier das Sich-Hüten vor etwas. Die Umschreibung von חֵרֶם wahrt den Gedanken unwiderruflicher Weihe zur Vernichtung, ohne den im Deutschen missverständlichen Ausdruck „Bann“ in den Haupttext zu setzen.
- source_word: פֶּן תַּחֲרִימוּ
  choice: damit ihr nicht selbst der Vernichtung anheimfallt
  rationale: פֶּן leitet die befürchtete Folge ein. Der Hifil von חרם ist formal mehrdeutig; im Zusammenhang bezeichnet er wahrscheinlich, dass die Israeliten durch ihr Handeln selbst den Status des חֵרֶם auf sich ziehen. „anheimfallt“ drückt diese resultierende Folge würdig und verständlich aus.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: wenn ihr etwas davon nehmt
  rationale: Die koordinierte hebräische Verbform beschreibt inhaltlich die Handlung, durch die die Warnfolge eintritt. Die konditionale Wiedergabe macht diesen Zusammenhang im Deutschen klar, ohne eine zusätzliche sachliche Aussage einzuführen.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: und so das Lager Israels der Vernichtung preisgebt
  rationale: שׂים mit לְחֵרֶם bezeichnet das Versetzen des Lagers in den Status des חֵרֶם. „preisgebt“ vermittelt die verursachte Gefährdung beziehungsweise Verurteilung natürlicher als eine schwerfällige Wiederholung von „weiht“.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: und es ins Unglück stürzt
  rationale: עכר bedeutet Unheil oder schwere Bedrängnis über jemanden zu bringen. Das Pronomen bezieht sich auf das Lager Israels.
theological_decisions:
- issue: Wiedergabe von חֵרֶם im Zusammenhang göttlichen Gerichts
  choice: was der Vernichtung geweiht ist
  alternative: der Bann; das Gebannte; was dem Untergang geweiht ist
  rationale: חֵרֶם bezeichnet hier etwas, das Gott unwiderruflich übereignet und in diesem Zusammenhang zur Vernichtung bestimmt ist. Die gewählte Formulierung bewahrt sowohl den Weihe- als auch den Gerichtsgedanken und vermeidet die mögliche Assoziation eines bloßen Fluchs.
- issue: Deutung von תַּחֲרִימוּ
  choice: ihr fallt selbst der Vernichtung anheim
  alternative: ihr weiht euch selbst der Vernichtung; ihr geratet selbst unter den Bann
  rationale: 'Die Verbform kann formal als verursachendes „der Vernichtung weihen“ verstanden werden. Im Kontext liegt die resultierende Bedeutung nahe: Wer vom חֵרֶם nimmt, zieht dessen gerichtlichen Status auf sich. Die Fußnote hält die engere formale Alternative offen.'
- issue: Kollektive Folge der individuellen Übertretung
  choice: das Lager Israels der Vernichtung preisgeben und ins Unglück stürzen
  alternative: das Lager Israels unter den Bann bringen und es in Bedrängnis bringen
  rationale: Der Text stellt ausdrücklich heraus, dass die Tat Einzelner Folgen für die gesamte Lagergemeinschaft hat. Die Übersetzung bewahrt diese Spannung, ohne eine weitergehende Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der imperativische Warncharakter bleibt knapp und eindringlich. Der technische Begriff חֵרֶם wird im Haupttext transparent umschrieben und in der Fußnote erläutert; die syntaktische Mehrdeutigkeit von תַּחֲרִימוּ wird nicht verschwiegen.
