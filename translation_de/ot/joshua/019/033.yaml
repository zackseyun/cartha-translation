base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: de
  text: Ihre Grenze verlief von Helef, von der Eiche bei Zaanannim[a], über Adami-Nekeb und Jabneel bis Lakkum; ihre Endpunkte lagen am Jordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Elon-Bezaanannim“. Der hebräische Ausdruck kann als Ortsname oder als „Eiche bei/in Zaanannim“ verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Seine Ausgänge waren der Jordan“; das hebräische Grenzidiom bezeichnet die Endpunkte oder äußersten Ausläufer der Grenze, die am Jordan lagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: ihre Grenze
  rationale: גְּבוּל bezeichnet hier die Grenzlinie des zuvor genannten Stammesgebiets; das Suffix der 3. Person Plural wird mit „ihre“ wiedergegeben.
- source_word: מֵחֵלֶף
  choice: von Helef
  rationale: Ortsname; in deutscher Umschrift wird das unbetonte Schluss-Pe als „f“ wiedergegeben.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: von der Eiche bei Zaanannim
  rationale: אֵלוֹן kann einen großen Baum, besonders eine Eiche oder Terebinthe, bezeichnen. Die Wiedergabe als Gattungswort passt zur Syntax; die mögliche Lesart als zusammengesetzter Ortsname bleibt in der Fußnote erhalten.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: über Adami-Nekeb
  rationale: In der Grenzbeschreibung wird die Wortgruppe am besten als zusammengesetzter Ortsname verstanden. „Über“ macht im Deutschen deutlich, dass die Grenzlinie an den genannten Orten entlangführt, ohne eine zusätzliche Zielaussage einzutragen.
- source_word: וְיַבְנְאֵל
  choice: und Jabneel
  rationale: Ortsname in üblicher deutscher Umschrift.
- source_word: עַד לַקּוּם
  choice: bis Lakkum
  rationale: עַד bezeichnet die räumliche Erstreckung bis zu einem Endpunkt.
- source_word: תֹצְאֹתָיו
  choice: sie endete
  rationale: Das Substantiv bezeichnet wörtlich die Ausgänge oder äußersten Punkte einer Grenze. Im Deutschen gibt „die Grenze endete“ die Funktion der Wendung natürlich und klar wieder.
- source_word: הַיַּרְדֵּן
  choice: am Jordan
  rationale: Der Jordan ist die bekannte geografische Bezeichnung; ein ergänzendes „Fluss“ ist nicht nötig.
