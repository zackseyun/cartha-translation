base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: de
  text: Ihre Grenze stieg westwärts nach Marala hinauf, berührte Dabbeschet und berührte den Bach, der gegenüber von Jokneam liegt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה גְבוּלָם לַיָּמָּה
  choice: Ihre Grenze stieg nach Westen hin … hinauf
  rationale: עָלָה bezeichnet den ansteigenden Verlauf der Grenzlinie; לַיָּמָּה ist die übliche Richtungsangabe „nach Westen“.
- source_word: וּפָגַע
  choice: berührte / stieß an
  rationale: פגע bezeichnet hier das Erreichen beziehungsweise Berühren eines Grenzpunktes. Die variierte deutsche Wiedergabe vermeidet unnatürliche Wiederholung, ohne den sachlichen Gehalt zu verändern.
- source_word: הַנַּחַל
  choice: das Bachtal
  rationale: נחל kann ein Fließgewässer oder dessen Talbett bezeichnen; im Zusammenhang einer Grenzbeschreibung ist „Bachtal“ präzise und lässt offen, ob ständig Wasser geführt wurde.
- source_word: אֲשֶׁר עַל פְּנֵי יָקְנְעָם
  choice: das gegenüber von Jokneam liegt
  rationale: עַל־פְּנֵי bezeichnet hier die räumliche Lage vor beziehungsweise gegenüber dem Ort.
