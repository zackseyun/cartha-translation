  naturalness: „Aus dem Gebiet ... stammte der Erbbesitz“ klingt im modernen Standarddeutsch unnatürlich, weil Erbbesitz nicht eigentlich aus einem Gebiet „stammt“. „Fiel ... zu“ gibt die im Hebräischen elliptische Zuteilungsaussage klar und würdig wieder.
