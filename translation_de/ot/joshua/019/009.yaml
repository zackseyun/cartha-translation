source:
  edition: WLC
  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: de
  text: Aus dem Gebiet der Nachkommen Judas fiel den Nachkommen Simeons ihr Erbbesitz zu, denn der Anteil der Nachkommen Judas war zu groß für sie. So erhielten die Nachkommen Simeons ihren Erbbesitz innerhalb des Erbbesitzes Judas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵחֶבֶל
  choice: aus dem Gebiet
  rationale: חֶבֶל bezeichnet bei der Landverteilung ein abgegrenztes oder vermessenes Landgebiet. „Gebiet“ ist im Deutschen natürlich und unterscheidet den Ausdruck zugleich von נַחֲלָה und חֵלֶק.
- source_word: נַחֲלַת / נַחֲלָתָם
  choice: Erbbesitz
  rationale: נַחֲלָה bezeichnet hier den durch Los zugewiesenen, bleibenden Landbesitz. „Erbbesitz“ bewahrt sowohl den Landbezug als auch den Erbcharakter.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: die Nachkommen Judas / die Nachkommen Simeons
  rationale: בְּנֵי ist wörtlich „Söhne“, fungiert hier jedoch als umfassende Stammesbezeichnung. „Nachkommen“ gibt diese Bedeutung im modernen Deutschen genau und ohne eine rein männliche Einschränkung wieder.
- source_word: חֵלֶק
  choice: Anteil
  rationale: חֵלֶק meint den Judah zugeteilten Anteil am Land. „Anteil“ wahrt die begriffliche Abgrenzung zu חֶבֶל und נַחֲלָה.
- source_word: רַב מֵהֶם
  choice: war zu groß für sie
  rationale: Die Wendung besagt im Zusammenhang, dass Judas Landanteil den eigenen Bedarf überstieg. Die deutsche Formulierung gibt den vergleichenden Sinn knapp und idiomatisch wieder.
- source_word: וַיִּנְחֲלוּ
  choice: erhielten ... ihren Erbbesitz
  rationale: Das Verb נחל beschreibt hier das Erlangen eines zugewiesenen Erbbesitzes; „erhielten“ passt zum Kontext der Landverteilung.
- source_word: בְּתוֹךְ
  choice: innerhalb
  rationale: בְּתוֹךְ bezeichnet die Lage des simeonitischen Gebiets im Inneren des judäischen Erbbesitzes.
theological_decisions:
- issue: Bezug des Suffixes in נַחֲלָתָם
  choice: innerhalb des Erbbesitzes Judas
  alternative: innerhalb ihres Erbbesitzes
  rationale: Das grammatisch pluralische Suffix verweist kontextuell auf die Nachkommen Judas. Die ausdrückliche Wiederaufnahme „Judas“ verhindert im Deutschen die mögliche Fehlzuordnung zu Simeon, ohne den Sinn zu verändern.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dreifache Landterminologie wird mit „Gebiet“, „Erbbesitz“ und „Anteil“ differenziert wiedergegeben. Der Satzbau bleibt nahe am Hebräischen, ist jedoch flüssig und allgemein verständlich.
