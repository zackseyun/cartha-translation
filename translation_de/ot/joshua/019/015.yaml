  text: וְ/קַטָּ֤ת וְ/נַֽהֲלָל֙ וְ/שִׁמְר֔וֹן וְ/יִדְאֲלָ֖ה וּ/בֵ֣ית לָ֑חֶם עָרִ֥ים שְׁתֵּים עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: de
  text: 'Kattat, Nahalal, Schimron, Jidala und Bethlehem: zwölf Städte mit ihren Dörfern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַטָּת
  choice: Kattat
  rationale: Ortsname; nach der hebräischen Form ins Deutsche übertragen, nicht übersetzt.
- source_word: נַהֲלָל
  choice: Nahalal
  rationale: Ortsname; die hebräische Lautgestalt wird in geläufiger deutscher Umschrift wiedergegeben.
- source_word: שִׁמְרוֹן
  choice: Schimron
  rationale: Ortsname; שׁ wird entsprechend deutscher Bibel- und Umschrifttradition mit „Sch“ wiedergegeben.
- source_word: יִדְאֲלָה
  choice: Jidala
  rationale: Ortsname; anlautendes י wird im Deutschen mit „J“ wiedergegeben, die übrige Form folgt der masoretischen Vokalisierung.
- source_word: בֵית לָחֶם
  choice: Bethlehem
  rationale: Etablierte deutsche Form des Ortsnamens; der Name wird nicht wörtlich als „Haus des Brotes“ übersetzt.
- source_word: עָרִים
  choice: Städte
  rationale: Konventionelle und kontextgerechte Wiedergabe für befestigte oder zentrale Siedlungen in Gebietslisten.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: zwölf
  rationale: Grundzahl, die sich auf „Städte“ bezieht.
- source_word: חַצְרֵיהֶן
  choice: ihren Dörfern
  rationale: Bezeichnet hier die zu den genannten Städten gehörenden kleineren, häufig unbefestigten Siedlungen.
theological_decisions: []
