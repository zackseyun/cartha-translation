  register: Knapper, listenartiger Stil entsprechend dem hebräischen Text; moderne deutsche Ortsnamenschreibung und natürliche Formulierung. Die Schlussangabe bleibt trotz der im überlieferten Vers ausdrücklich genannten fünf Orte unverändert als „zwölf Städte“ stehen, da sie sich auf die größere Liste im Kontext bezieht.
