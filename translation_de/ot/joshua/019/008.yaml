base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: de
  text: dazu alle Dörfer rings um diese Städte bis nach Baalat-Beer Ramat-Negev[a]. Das war der Erbbesitz des Stammes der Nachkommen Simeons, nach ihren Sippen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Beziehung zwischen Baalat-Beer und Ramat-Negev ist unsicher. Möglich ist: „Baalat-Beer, das heißt Ramat-Negev“, wobei der zweite Name den ersten näher bestimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: dazu alle Dörfer
  rationale: Die Wendung setzt die vorangehende Ortsliste additiv fort. חֲצֵרִים bezeichnet hier die zugehörigen kleineren, vermutlich unbefestigten Siedlungen; „Dörfer“ ist im Deutschen natürlich und sachgerecht.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: rings um diese Städte
  rationale: Die knappe Ortsangabe gibt die Lage der Dörfer im Umkreis der zuvor genannten Städte wieder und bewahrt mit „diese“ den proximalen Demonstrativbezug.
- source_word: עַד
  choice: bis nach
  rationale: Im geografischen Zusammenhang bezeichnet עַד die räumliche Ausdehnung bis zu einem Endpunkt; bei einem Ortsnamen ist „bis nach“ idiomatisches Deutsch.
- source_word: בַּעֲלַת בְּאֵר
  choice: Baalat-Beer
  rationale: Der Ortsname wird transliteriert statt übersetzt. „Baalat“ gibt die hebräische Form für deutsche Leser angemessen wieder.
- source_word: רָאמַת נֶגֶב
  choice: Ramat-Negev
  rationale: Die Transliteration bewahrt den Ortsnamen und legt nicht fest, ob er als Beiname beziehungsweise Identifikation von Baalat-Beer oder als weiterer Ort zu verstehen ist.
- source_word: נַחֲלַת
  choice: Erbbesitz
  rationale: נַחֲלָה bezeichnet im Kontext der Landverteilung den einer Stammesgruppe zugeteilten, dauerhaft vererbbaren Besitz. „Erbbesitz“ verbindet Zuteilung und Besitzcharakter.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: des Stammes der Nachkommen Simeons
  rationale: מַטֶּה meint hier den Stamm; בְנֵי שִׁמְעוֹן hat genealogische Prägung. „Nachkommen Simeons“ ist natürliches modernes Deutsch und bewahrt diesen Bezug.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet in der Stammesgliederung größere Familien- beziehungsweise Sippenverbände. „Sippen“ unterscheidet diese von modernen Kleinfamilien.
