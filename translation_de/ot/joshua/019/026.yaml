base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/026.yaml
  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: de
  text: und Alammelech, Amad und Mischal. Die Grenze erreichte den Karmel westwärts und Schihor-Libnat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: Alammelech
  rationale: Ortsname; eine dem Deutschen angepasste Transliteration. Die Verdopplung des Mem wird wiedergegeben, ohne einen im Hebräischen nicht vorhandenen anlautenden Doppelkonsonanten zu erzeugen.
- source_word: עַמְעָד
  choice: Amad
  rationale: Ortsname; die gebräuchliche vereinfachte Wiedergabe ist im Deutschen gut lesbar.
- source_word: מִשְׁאָל
  choice: Mischal
  rationale: Ortsname; שׁ wird nach deutscher Konvention mit „sch“ wiedergegeben.
- source_word: וּפָגַע
  choice: Dann verlief die Grenze bis
  rationale: In Grenzbeschreibungen bezeichnet פגע das Erreichen oder Zusammentreffen mit einem Grenzpunkt. Die ausdrückliche Ergänzung „die Grenze“ macht den im Kontext vorausgesetzten Bezug im Deutschen natürlich verständlich.
- source_word: בְּכַרְמֶל
  choice: zum Karmel
  rationale: Die Präposition bezeichnet hier den von der Grenze erreichten Geländepunkt.
- source_word: הַיָּמָּה
  choice: im Westen
  rationale: Wörtlich „meerwärts“; in der geografischen Orientierung bezeichnet der Ausdruck wegen des Mittelmeers die westliche Richtung. Die Formulierung lässt sich natürlich auf die Lage beziehungsweise den Grenzverlauf beim Karmel beziehen.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: und bis Schihor-Libnat
  rationale: Der wahrscheinlich zusammengesetzte Ortsname wird transliteriert und mit Bindestrich verbunden; „bis“ führt die Grenzbeschreibung fort.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Aufzählung der Orte bleibt knapp; für die Grenzformel wird das im Hebräischen kontextuell vorausgesetzte Subjekt „die Grenze“ ergänzt. Eigennamen folgen einer gut lesbaren deutschen Transliteration.
