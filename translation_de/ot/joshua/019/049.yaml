source:
  edition: WLC
  text: וַ/יְכַלּ֥וּ לִ/נְחֹל אֶת הָ/אָ֖רֶץ לִ/גְבֽוּלֹתֶ֑י/הָ וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל נַחֲלָ֛ה לִ/יהוֹשֻׁ֥עַ בִּן נ֖וּן בְּ/תוֹכָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: de
  text: Als sie die Verteilung des Landes nach seinen Gebieten[a] abgeschlossen hatten, gaben die Israeliten[b] Josua, dem Sohn Nuns, mitten unter ihnen einen Erbbesitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach seinen Grenzen«. Das hebräische Wort kann sowohl Grenzlinien als auch die dadurch bestimmten Gebiete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Söhne Israels«; gemeint sind die Israeliten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  choice: Als sie die Verteilung … abgeschlossen hatten
  rationale: Die Verbfolge bezeichnet den Abschluss der zuvor geschilderten Landzuteilung; die temporale Konstruktion verbindet ihn natürlich mit der anschließenden Gabe an Josua.
- source_word: הָאָרֶץ
  choice: des Landes
  rationale: Gemeint ist in diesem Zusammenhang das zur Verteilung stehende Land, nicht die Erde im allgemeinen Sinn.
- source_word: לִגְבוּלֹתֶיהָ
  choice: nach seinen Gebieten
  rationale: גְּבוּל kann sowohl Grenzlinien als auch abgegrenzte Gebiete bezeichnen. Im Kontext der Stammeszuteilungen steht die territoriale Gliederung im Vordergrund; die Grenzbedeutung bleibt in der Fußnote erhalten.
- source_word: וַיִּתְּנוּ
  choice: gaben
  rationale: Die Grundbedeutung von נתן wird beibehalten; der Gegenstand und der Zusammenhang machen die offizielle Zuteilung deutlich.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet hier die Angehörigen Israels insgesamt. Die natürliche moderne deutsche Wiedergabe vermeidet die mögliche Fehlvorstellung, nur männliche Nachkommen seien handelnd gemeint; die wörtliche Form wird in der Fußnote genannt.
- source_word: נַחֲלָה
  choice: einen Erbbesitz
  rationale: Erbbesitz bewahrt sowohl den rechtlichen Gedanken eines zugeteilten Besitzanteils als auch den für die Landverteilung wichtigen Erbcharakter.
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: Josua, dem Sohn Nuns
  rationale: Der Dativ entspricht der hebräischen Präposition לְ; die deutsche Patronymform ist eindeutig und idiomatisch.
- source_word: בְּתוֹכָם
  choice: mitten unter ihnen
  rationale: Die Formulierung macht deutlich, dass Josuas Anteil innerhalb der israelitischen Zuteilungen lag und nicht außerhalb davon.
theological_decisions:
- issue: Bedeutung von נחל bei der Landverteilung
  choice: die Verteilung … abgeschlossen
  alternative: das Land als Erbbesitz in Besitz genommen
  rationale: Der größere Zusammenhang von Josua 13–19 handelt von der Zuweisung des Landes an Stämme und Einzelne. Daher ist hier die distributive Bedeutung am wahrscheinlichsten, ohne das Erbmotiv zu verlieren, das anschließend durch נַחֲלָה ausdrücklich erscheint.
- issue: Wiedergabe von נַחֲלָה
  choice: Erbbesitz
  alternative: Erbteil
  rationale: Erbbesitz bezeichnet sowohl die Gabe als auch das dauerhaft zugeteilte Land. Damit bleibt die rechtlich-theologische Spannung zwischen geschenktem Erbe und konkretem Besitz erhalten.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung fungiert als nationale Sammelbezeichnung. „Israeliten“ ist im modernen Deutsch sachlich genau und natürlich; die formale hebräische Ausdrucksweise wird als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählablauf, klingt jedoch idiomatisch. „Erbbesitz“ hält den zentralen Land- und Erbwortschatz sichtbar; die Fußnoten bewahren die lexikalischen Alternativen.
