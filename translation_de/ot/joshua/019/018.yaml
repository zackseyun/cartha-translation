  text: Ihre Grenze verlief nach Jesreel[a], Kesullot und Schunem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Am Namen „Jesreel“ steht im Hebräischen eine Richtungsendung, die etwa „nach Jesreel hin“ bedeutet. In einer Grenzliste kann sie auch einfach als Teil der knappen Aufzählungsform verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: verlief
  rationale: Die Erzählform von היה führt die nächste Grenzangabe fort. Im Deutschen gibt „verlief“ den Sinn einer Grenzbeschreibung natürlicher wieder als das wörtliche „war“.
- source_word: גְּבוּלָם
  choice: ihre Grenze
  rationale: גְּבוּל bezeichnet hier die Grenze des zuvor genannten Stammesgebiets; das Suffix der 3. Person Plural wird mit „ihre“ wiedergegeben.
- source_word: יִזְרְעֶאלָה
  choice: in Richtung Jesreel
  rationale: Die direktionale Endung ה an dem Ortsnamen bezeichnet eine Ausrichtung auf Jesreel hin. „In Richtung Jesreel“ bewahrt diese Nuance, ohne Jesreel zwingend als erreichten Endpunkt festzulegen.
- source_word: הַכְּסוּלֹת
  choice: Kesullot
  rationale: Der Ortsname wird in einer für deutsche Leser gut aussprechbaren Form transkribiert. Der vorangestellte Artikel wird als Bestandteil beziehungsweise grammatische Begleitung des Toponyms nicht gesondert wiedergegeben.
- source_word: שׁוּנֵם
  choice: Schunem
  rationale: Der Ortsname wird nach gängiger deutscher Laut- und Schreibkonvention transkribiert.
