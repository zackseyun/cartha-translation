  rationale: Der hebräische Artikel wird bei diesem Ortsnamen nicht eigens wiedergegeben. „Rama“ ist die geläufige deutsche biblische Namensform.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Als Ortsname wird das Wort in der im Deutschen üblichen biblischen Form „Hazor“ wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet die Ortsnamen; im natürlichen deutschen Sprachgebrauch steht „und“ vor dem letzten Glied der Aufzählung.
