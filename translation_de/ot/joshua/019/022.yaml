  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: de
  text: Die Grenze berührte Tabor[a], Schachazuma und Bet-Schemesch und endete am Jordan[b] – sechzehn Städte mit ihren Dörfern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »reichte bis Tabor« beziehungsweise »traf bei Tabor zusammen«; das hebräische Verb beschreibt, wie eine Grenzlinie an einen Ort heranreicht oder ihn berührt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Die Ausgänge ihrer Grenze waren der Jordan«; die Grenzformel bezeichnet den Endpunkt oder die äußerste Erstreckung der Grenze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: Die Grenze stieß … auf
  rationale: פגע bezeichnet in Grenzbeschreibungen das Auftreffen oder Heranreichen einer Grenzlinie an einen Ort. Die deutsche Wendung bewahrt den räumlichen Sinn.
- source_word: בְּתָבוֹר
  choice: bei Tabor
  rationale: Der Ortsname wird in gebräuchlicher deutscher Form wiedergegeben; ב wird hier räumlich verstanden.
- source_word: וְשַׁחֲצוּמָה
  choice: Schahazuma
  rationale: Der Ortsname wird nach der masoretischen Lautung ins Deutsche übertragen.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Bet-Schemesch
  rationale: Der Eigenname wird transliteriert und nicht als »Sonnenhaus« übersetzt.
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: und endete am Jordan
  rationale: Die wörtlichen »Ausgänge« der Grenze bezeichnen in dieser Grenzformel ihren Endpunkt beziehungsweise ihre äußerste Erstreckung.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: sechzehn Städte
  rationale: Direkte Wiedergabe der Zahlwortkonstruktion.
- source_word: וְחַצְרֵיהֶן
  choice: mit ihren Dörfern
  rationale: חצר bezeichnet hier die zu den Städten gehörenden kleineren, häufig unbefestigten Siedlungen.
