  text: וַ/יֵּצֵא֙ הַ/גּוֹרָ֣ל הַֽ/חֲמִישִׁ֔י לְ/מַטֵּ֥ה בְנֵֽי אָשֵׁ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/024.yaml
  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: de
  text: Das fünfte Los fiel auf den Stamm der Nachkommen Aschers, nach ihren Sippen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: fiel
  rationale: Im Zusammenhang einer Losentscheidung gibt „fiel“ die feste deutsche Wendung „das Los fiel auf“ natürlich wieder. Sie entspricht dem wörtlichen Bild des Herauskommens, ohne den Vorgang genauer festzulegen.
- source_word: הַגּוֹרָל
  choice: das Los
  rationale: „Los“ bewahrt sowohl den konkreten Losentscheid als auch dessen Ergebnis und ist näher am Hebräischen als „Landanteil“ oder „Zuteilung“.
- source_word: הַחֲמִישִׁי
  choice: das fünfte
  rationale: Der Ordinalzahl-Ausdruck bestimmt „Los“ und wird direkt wiedergegeben.
- source_word: לְמַטֵּה
  choice: auf den Stamm
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang idiomatisch einen Stamm. Die Präposition wird passend zur deutschen Wendung „das Los fiel auf“ mit „auf“ wiedergegeben.
- source_word: בְנֵי אָשֵׁר
  choice: der Nachkommen Aschers
  rationale: Wörtlich steht „Söhne Aschers“. Als Stammesbezeichnung ist „Nachkommen Aschers“ im modernen Deutschen natürlich und schließt die gesamte genealogische Gemeinschaft ein.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet die größeren Familien- beziehungsweise Sippenverbände innerhalb des Stammes. „Nach ihren Sippen“ wahrt die Gliederungs- und Verteilungsfunktion der Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und im Kontext klare Wendung „das Los fiel auf“ bewahrt das Bild des hebräischen Ausdrucks; „Sippen“ bezeichnet die innertribalen Familienverbände präziser als das allgemeinere „Familien“.
