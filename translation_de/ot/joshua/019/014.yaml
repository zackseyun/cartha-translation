base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: de
  text: Dann wandte sich die Grenze nördlich von Hannaton um es herum[a], und ihre Endpunkte[b] lagen im Tal Jiftach-El.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Norden her bei Hannaton“. Die hebräische Wendung kann die Lage nördlich von Hannaton oder den Verlauf der Grenze von Norden her bei Hannaton näher bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihre Ausgänge“; ein Ausdruck für die äußersten oder abschließenden Punkte einer Grenze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Dann wandte sich … um … herum
  rationale: נָסַב bezeichnet in Grenzbeschreibungen ein Wenden oder Herumführen der Grenzlinie. Die deutsche Formulierung gibt sowohl die Richtungsänderung als auch die Bewegung um einen Bezugspunkt wieder.
- source_word: אֹתוֹ
  choice: es
  rationale: Das Pronomen nimmt einen zuvor genannten geografischen Bezugspunkt auf. Das sachliche Pronomen bewahrt diesen Rückverweis, ohne den nicht ausdrücklich genannten Ort zu ergänzen.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: גְּבוּל bezeichnet hier die Grenzlinie des zugeteilten Gebietes; „Grenze“ ist im Deutschen die natürliche und präzise Wiedergabe.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: nördlich … nach Hannaton
  rationale: Die Wendung wird im Haupttext als nördliche Verlaufsrichtung bis beziehungsweise nach Hannaton verstanden. Da die Präposition auch eine Lage nördlich von Hannaton bezeichnen kann, wird diese echte syntaktische Mehrdeutigkeit in einer Fußnote offengehalten.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: und ihre Endpunkte lagen
  rationale: תֹּצְאוֹת ist ein Grenzbegriff für die äußersten beziehungsweise abschließenden Punkte. Der Plural „Endpunkte“ erhält die hebräische Form und bleibt im Deutschen verständlich.
- source_word: גֵּי
  choice: Tal
  rationale: גֵּי bezeichnet ein Tal oder eine Schlucht. Hier gehört „Tal“ zur geografischen Bezeichnung.
- source_word: יִפְתַּח אֵל
  choice: Jiftach-El
  rationale: Der Ortsname wird gemäß üblicher deutscher Transliteration wiedergegeben und nicht inhaltlich übersetzt.
theological_decisions: []
