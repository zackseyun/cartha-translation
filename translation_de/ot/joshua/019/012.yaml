  variant: modern standard German
source:
  edition: WLC
  text: וְ/שָׁ֣ב מִ/שָּׂרִ֗יד קֵ֚דְמָ/ה מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ עַל גְּב֥וּל כִּסְלֹ֖ת תָּבֹ֑ר וְ/יָצָ֥א אֶל הַ/דָּֽבְרַ֖ת וְ/עָלָ֥ה יָפִֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: de
  text: Dann wandte sich die Grenze von Sarid nach Osten, zum Sonnenaufgang hin[a], bis an die Grenze von Kislot-Tabor. Von dort verlief sie weiter nach Daberat und hinauf nach Jafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ostwärts, zum Aufgang der Sonne«; auch möglich: »nach Osten, gegen Osten hin«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Dann wandte sich die Grenze
  rationale: In Grenzbeschreibungen bezeichnet שוב häufig einen Richtungswechsel im Verlauf der Grenzlinie. Das im Hebräischen nur implizite Subjekt wird zur Klarheit als »die Grenze« ausgedrückt.
- source_word: מִשָּׂרִיד
  choice: von Sarid
  rationale: Der Ortsname wird transliteriert; מן kennzeichnet den Ausgangspunkt dieses Grenzabschnitts.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: nach Osten, zum Sonnenaufgang hin
  rationale: Die Wiedergabe erhält sowohl die östliche Richtung als auch das konkrete Bild vom Aufgang der Sonne, ohne die hebräische Doppelung einzuebnen.
- source_word: עַל גְּבוּל
  choice: bis an die Grenze von
  rationale: Im geografischen Zusammenhang beschreibt עַל mit גְּבוּל das Erreichen eines Grenzgebiets; »bis an« gibt die Bewegung im Deutschen natürlich wieder.
- source_word: כִּסְלֹת תָּבֹר
  choice: Kislot-Tabor
  rationale: Transliteration des zusammengesetzten Ortsnamens; der Bindestrich macht die Zusammengehörigkeit deutlich.
- source_word: וְיָצָא
  choice: Von dort verlief sie weiter
  rationale: יצא bezeichnet in Grenzbeschreibungen das Ausgehen oder Weiterführen einer Grenzlinie. »verlief … weiter« ist im heutigen Deutschen idiomatisch und bewahrt den geografischen Sinn.
- source_word: אֶל הַדָּבְרַת
  choice: nach Daberat
  rationale: Der Ortsname wird ohne Artikel wiedergegeben, wie es bei deutschen Ortsnamen üblich ist.
- source_word: וְעָלָה
  choice: hinauf nach
  rationale: עלה weist hier wahrscheinlich auf einen topografischen Anstieg hin; »hinauf« bewahrt diese räumliche Nuance.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Transliteration des hebräischen Ortsnamens in einer für deutsche Leser transparenten Form.
theological_decisions: []
