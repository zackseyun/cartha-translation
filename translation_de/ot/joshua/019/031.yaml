base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/031.yaml
  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: de
  text: 'Das war der Erbbesitz des Stammes der Nachkommen Aschers nach ihren Sippen: diese Städte und ihre Siedlungen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das ist der Erbbesitz …« Das Hebräische enthält kein finites Verb; die Präsensform ist daher ebenfalls möglich. „Siedlungen“ kann auch mit „Dörfer“ wiedergegeben werden und bezeichnet kleinere, den Städten zugehörige Orte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Das war
  rationale: Der feminine Demonstrativausdruck verweist auf den zuvor beschriebenen Erbbesitz. Das Präteritum entspricht dem erzählenden Rückblick; formal ist auch Präsens möglich.
- source_word: נַחֲלַת
  choice: Erbbesitz
  rationale: Im Zusammenhang der Landverteilung bezeichnet נַחֲלָה einen als Erbe zugewiesenen territorialen Besitz und bewahrt sowohl den Erb- als auch den Besitzaspekt.
- source_word: מַטֵּה
  choice: Stamm
  rationale: Hier bezeichnet das Wort eindeutig die soziale Einheit eines israelitischen Stammes.
- source_word: בְנֵי אָשֵׁר
  choice: Nachkommen Aschers
  rationale: Die deutsche Wiedergabe bezeichnet die von Ascher abstammende Stammesgemeinschaft natürlich und verständlich; das wörtlichere »Söhne Aschers« könnte zu eng männlich verstanden werden.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederungen des Stammes; »nach« gibt die verteilende Zuordnung knapp wieder.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: diese Städte
  rationale: עָרִים ist die übliche Bezeichnung für befestigte oder städtische Siedlungsorte, auch wenn sie nach heutigen Maßstäben klein gewesen sein können.
- source_word: וְחַצְרֵיהֶן
  choice: mit den dazugehörigen Siedlungen
  rationale: חֲצֵרִים meint abhängige, oft unbefestigte ländliche Orte im Umfeld der genannten Städte. »Dazugehörig« macht die im Suffix ausgedrückte Zuordnung deutlich.
