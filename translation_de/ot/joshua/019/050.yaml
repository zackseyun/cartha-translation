source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: de
  text: 'Auf Befehl Jahwes gaben sie ihm die Stadt, um die er gebeten hatte: Timnat-Serach im Bergland Ephraims. Er baute[a] die Stadt und wohnte darin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet „bauen“. Da die Stadt bereits genannt ist, kann der Satz im Kontext auch einen Wiederaufbau oder eine bauliche Herrichtung meinen.
    reason: contextual_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: Auf Befehl Jahwes
  rationale: Die Wendung עַל־פִּי bezeichnet hier eine maßgebliche Anordnung. „Auf Befehl“ gibt das hebräische Idiom natürlich und präzise wieder; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: נָתְנוּ לוֹ
  choice: gaben sie ihm
  rationale: Die schlichte Bedeutung von נתן mit indirektem Objekt wird in natürlichem Deutsch bewahrt.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: die Stadt, um die er gebeten hatte
  rationale: שׁאל bedeutet hier „bitten/erbitten“. Das Plusquamperfekt verdeutlicht natürlich, dass Josuas Bitte der Zuteilung vorausging.
- source_word: תִּמְנַת סֶרַח
  choice: Timnat-Serach
  rationale: Der Ortsname wird in einer dem Hebräischen nahen, im Deutschen gut lesbaren Form transliteriert.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraim
  rationale: הַר bezeichnet hier die gebirgige Region Ephraims, nicht zwingend einen einzelnen Berg.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: Er baute die Stadt
  rationale: בנה bedeutet zunächst „bauen“. Da bereits von einer vorhandenen Stadt die Rede ist, kann kontextuell auch Wiederaufbau oder Ausbau gemeint sein; diese Möglichkeit wird in einer Fußnote offengehalten.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: und wohnte darin
  rationale: ישׁב bedeutet in diesem Zusammenhang „wohnen/sich niederlassen“. „Wohnte darin“ ist modern, klar und eng am Wortlaut.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen ausdrücklich. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Erzählfolge; der Doppelpunkt kennzeichnet Timnat-Serach eindeutig als die zuvor genannte Stadt. Die mögliche kontextuelle Bedeutung „wieder aufbauen“ wird nicht in den Haupttext eingetragen, sondern als echte lexikalisch-kontextuelle Alternative dokumentiert.
