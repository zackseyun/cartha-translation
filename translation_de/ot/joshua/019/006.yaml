lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: Bet-Lebaot
  rationale: Der Ortsname wird nach gängiger deutscher Bibelumschrift wiedergegeben; seine wörtliche Bedeutung („Haus der Löwinnen“) wird in dieser Ortsliste nicht interpretierend übersetzt.
- source_word: שָׁרוּחֶן
  choice: Scharuhen
  rationale: Der masoretische Text bietet hier diesen Ortsnamen; er wird in deutscher Umschrift wiedergegeben.
- source_word: עָרִים
  choice: Städte
  rationale: Die übliche Wiedergabe von עִיר in den Gebiets- und Ortslisten Josuas; sie bewahrt den formellen Charakter der Aufzählung.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: dreizehn
  rationale: Direkte und idiomatische Wiedergabe der Kardinalzahl.
- source_word: חַצְרֵיהֶן
  choice: ihren Dörfern
  rationale: Gemeint sind zu den genannten Städten gehörende kleinere, wohl unbefestigte Siedlungen; „Dörfer“ ist dafür eine klare moderne Entsprechung.
