  source_fidelity: 'Die Übersetzung gibt die hebräische Schlussformel vollständig und sachgerecht wieder: זֹאת als rückverweisendes „Das“, נַחֲלָה als „Erbbesitz“, die Stammesgliederung „nach ihren Sippen“ sowie die Zusammenfassung von Städten und ihren abhängigen Dörfern. Das im Hebräischen fehlende Kopulaverb wird mit dem im erzählenden Rückblick passenden „war“ idiomatisch ergänzt; die Fußnote hält die gleichfalls mögliche Gegenwartswiedergabe offen.'
  naturalness: '„Das war der Erbbesitz der Söhne Sebulons nach ihren Sippen: diese Städte und ihre Dörfer“ ist würdiges, modernes Standarddeutsch. Der Doppelpunkt bildet die resümierende, appositionelle Schlusswendung klar ab.'
