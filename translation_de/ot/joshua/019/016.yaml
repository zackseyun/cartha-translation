  text: זֹ֛את נַחֲלַ֥ת בְּנֵֽי זְבוּלֻ֖ן לְ/מִשְׁפְּחוֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/016.yaml
  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
translation:
  language: de
  text: 'Das war[a] der Erbbesitz der Söhne Sebulons nach ihren Sippen: diese Städte und ihre Dörfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist der Erbbesitz der Söhne Sebulons.“ Im Hebräischen steht ein Satz ohne ausdrückliches Verb; daher kann diese zusammenfassende Formel sowohl mit der Gegenwart als auch mit der Vergangenheit wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Das war
  rationale: Das feminine Demonstrativpronomen verweist rückblickend auf das zuvor beschriebene Gebiet. Da der hebräische Satz kein ausdrückliches Verb enthält, ergänzt die Übersetzung im erzählenden Rückblick natürlich „war“; „Das ist“ bleibt ebenfalls möglich.
- source_word: נַחֲלַת
  choice: der Erbbesitz
  rationale: נַחֲלָה bezeichnet hier den dem Stamm als bleibenden Besitz zugewiesenen Landanteil. „Erbbesitz“ bewahrt sowohl den rechtlichen als auch den bundestheologischen Bedeutungsgehalt.
- source_word: בְּנֵי זְבוּלֻן
  choice: der Söhne Sebulons
  rationale: Die Formulierung gibt den hebräischen Verwandtschaftsausdruck genau wieder und bezeichnet kollektiv die von Sebulon abstammende Stammesgemeinschaft.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: nach ihren Sippen
  rationale: Die Präposition לְ kennzeichnet hier die Gliederung der Landverteilung; מִשְׁפָּחוֹת meint die Unterverbände des Stammes.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: diese Städte
  rationale: Die bestimmte Wendung fasst die zuvor aufgezählten städtischen Orte zusammen.
- source_word: וְחַצְרֵיהֶן
  choice: und ihre Dörfer
  rationale: חָצֵר bezeichnet in den Gebietslisten die kleineren, von den Städten abhängigen ländlichen Siedlungen; „Dörfer“ ist dafür eine klare und natürliche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die erklärende Apposition „diese Städte und ihre Dörfer“ transparent, ohne dem Text einen zusätzlichen Gedanken hinzuzufügen.
