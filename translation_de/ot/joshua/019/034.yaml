  text: וְ/שָׁ֨ב הַ/גְּב֥וּל יָ֨מָּ/ה֙ אַזְנ֣וֹת תָּב֔וֹר וְ/יָצָ֥א מִ/שָּׁ֖ם חוּקֹ֑קָ/ה וּ/פָגַ֨ע בִּ/זְבֻל֜וּן מִ/נֶּ֗גֶב וּ/בְ/אָשֵׁר֙ פָּגַ֣ע מִ/יָּ֔ם וּ/בִ֣/יהוּדָ֔ה הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: de
  text: Dann wandte sich die Grenze nach Westen zu Asnot-Tabor und verlief von dort weiter nach Hukkok. Sie stieß im Süden an Sebulon, im Westen an Ascher und an Juda am Jordan, im Osten, wo die Sonne aufgeht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet: „und an Juda am Jordan, im Osten, wo die Sonne aufgeht“. Die geografische Angabe ist schwierig, weil Naftali nach dem üblichen Verständnis nicht unmittelbar an das Stammesgebiet Judas grenzte. Manche deuten die Formulierung anders oder vermuten ein Problem in der Textüberlieferung; hier wird der überlieferte hebräische Wortlaut wiedergegeben.'
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Dann wandte sich die Grenze
  rationale: שׁוב bezeichnet in Grenzbeschreibungen häufig einen Richtungswechsel. „Wandte sich“ ist im Deutschen natürlich und bewahrt den fortlaufenden Erzählgang.
- source_word: יָמָּה
  choice: nach Westen
  rationale: Wörtlich bedeutet der Ausdruck „zum Meer hin“; gemeint ist hier die westliche Himmelsrichtung.
- source_word: אַזְנוֹת תָּבוֹר
  choice: Asnot-Tabor
  rationale: Der Ortsname wird nach einer geläufigen deutschen Umschrift wiedergegeben.
- source_word: וְיָצָא מִשָּׁם
  choice: verlief von dort weiter
  rationale: יצא bezeichnet in Grenzformeln das weitere Ausgehen beziehungsweise Fortlaufen der Grenzlinie; die deutsche Formulierung gibt dies verständlich wieder.
- source_word: חוּקֹקָה
  choice: Hukkok
  rationale: Der Ortsname wird transliteriert; die Doppelkonsonanz bildet den hebräischen Lautbestand angemessen ab.
- source_word: וּפָגַע
  choice: stieß ... an
  rationale: פגע bezeichnet in territorialen Beschreibungen das Zusammentreffen der Grenze mit einem Gebiet oder Orientierungspunkt.
- source_word: בִּזְבֻלוּן מִנֶּגֶב
  choice: im Süden an Sebulon
  rationale: Die Formulierung bezeichnet Sebulon als südlichen Grenznachbarn.
- source_word: וּבְאָשֵׁר פָּגַע מִיָּם
  choice: im Westen an Ascher
  rationale: מִיָּם verweist in diesem geografischen Zusammenhang auf die Westseite, wörtlich die Meerseite.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן
  choice: und an Juda am Jordan
  rationale: Die schwierige masoretische Lesart wird ohne Konjektur oder geografische Harmonisierung im Haupttext bewahrt.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: im Osten, wo die Sonne aufgeht
  rationale: Die Wiedergabe nennt die Himmelsrichtung und bewahrt zugleich das anschauliche hebräische Bild vom Sonnenaufgang.
theological_decisions:
- issue: Geografisch schwierige Angabe „Juda am Jordan“
  choice: Der masoretische Wortlaut bleibt im Haupttext erhalten.
  alternative: Man kann „Juda“ als Textverderbnis ansehen, auf indirekt mit Juda verbundene Siedlungen beziehen oder die Formulierung geografisch glätten.
  rationale: Naftalis Gebiet grenzte nach dem üblichen geografischen Verständnis nicht unmittelbar an das Stammesgebiet Judas. Da der überlieferte hebräische Text dennoch eindeutig Juda nennt, wird die Spannung nicht stillschweigend aufgelöst, sondern in einer Fußnote erläutert.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Grenzformeln sind flüssig formuliert, ohne die Abfolge oder die schwierige geografische Aussage zu glätten. Orts- und Stammesnamen folgen gebräuchlichen deutschen Formen.
