base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: de
  text: Dann wandte sich die Grenze nach Rama und verlief weiter bis zur befestigten Stadt Tyrus. Danach wandte sie sich nach Hosa; ihre Endpunkte lagen zum Meer hin, vom Gebiet Achsib her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Gebiet von Achsib“. Die genaue syntaktische Beziehung dieser Angabe zu den Endpunkten der Grenze ist im Hebräischen nicht eindeutig.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Dann wandte sich die Grenze
  rationale: In Grenzbeschreibungen bezeichnet שׁוב häufig einen Richtungswechsel. „Sich wenden“ gibt dies in natürlichem deutschem Kartenstil wieder.
- source_word: הָרָמָה
  choice: nach Rama
  rationale: Der Ortsname Rama steht mit Richtungsendung und bezeichnet das Ziel des Grenzverlaufs.
- source_word: וְעַד עִיר מִבְצַר צֹר
  choice: und verlief weiter bis zur befestigten Stadt Tyrus
  rationale: עַד markiert den nächsten Zielpunkt; die Ergänzung „verlief weiter“ macht den elliptischen Grenzbericht im Deutschen verständlich. עִיר מִבְצַר beschreibt Tyrus als befestigte Stadt.
- source_word: חֹסָה
  choice: Hosa
  rationale: Wiedergabe des Ortsnamens in einer im Deutschen geläufigen Form.
- source_word: וִיהְיוּ תֹצְאֹתָיו
  choice: ihre Endpunkte lagen
  rationale: תֹצָאוֹת bezeichnet in Grenzformeln die Ausläufe oder Endpunkte einer Grenzlinie. „Endpunkte“ erhält den Plural und vermittelt den geografischen Sinn.
- source_word: הַיָּמָּה
  choice: am Meer
  rationale: Die Form mit Richtungsendung weist zum Meer hin; im Zusammenhang mit den Endpunkten der Grenze ist „am Meer“ idiomatisch und bezeichnet das Erreichen der Küste.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: beim Gebiet von Achsib
  rationale: חֶבֶל kann ein vermessenes Gebiet oder einen Landstrich bezeichnen. Die genaue syntaktische Beziehung der Präposition מִן zur Endformel ist unsicher und wird in einer Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Form einer antiken Grenzbeschreibung bleibt erhalten, wird aber durch „verlief weiter“ leicht geglättet. Ortsnamen folgen gebräuchlichen deutschen Formen.
