revisions:
- from: Dann wandte sich die Grenze nach Rama und verlief weiter bis zur befestigten Stadt Tyrus. Danach wandte sie sich nach Hosa; ihre Endpunkte lagen am Meer, beim Gebiet von Achsib.[a]
  to: Dann wandte sich die Grenze nach Rama und verlief weiter bis zur befestigten Stadt Tyrus. Danach wandte sie sich nach Hosa; ihre Endpunkte lagen zum Meer hin, vom Gebiet Achsib her.[a]
  rationale: Die Präpositionalphrase mit מִן wird als „vom … her“ wiedergegeben, statt ihre Bedeutung durch „bei“ zu verändern. Zugleich wird die Richtung zum Meer hin ausdrückbar gemacht und die unsichere syntaktische Anbindung in der Fußnote transparent belassen.
