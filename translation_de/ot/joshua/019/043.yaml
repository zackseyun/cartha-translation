  choice: Timna
  rationale: Ortsname mit der hebräischen Endung -ה, die hier als Richtungs- oder Ortsendung verstanden werden kann; im Deutschen ist die herkömmliche Namensform „Timna“ natürlich und eindeutig.
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Ortsname; direkte und im Deutschen etablierte Umschrift.
- source_word: וְ
  choice: und
  rationale: Das vor jedem Namen wiederholte Bindewort wird bewahrt, sodass die hebräische Reihung hörbar bleibt.
