  register: Knappes, würdiges Standarddeutsch für eine Ortsnamenliste. Die Namen werden in geläufiger deutscher Form wiedergegeben; die hebräische Reihung wird idiomatisch als deutsche Aufzählung gestaltet. Der Fußnotenmarker steht bei En-Hazor, auf das sich die Anmerkung inhaltlich bezieht.
