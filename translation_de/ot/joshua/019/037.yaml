lexical_decisions:
- source_word: קֶדֶשׁ
  choice: Kedesch
  rationale: Der Ortsname wird nach geläufiger deutscher Bibeltradition transliteriert, nicht übersetzt.
- source_word: אֶדְרֶעִי
  choice: Edreï
  rationale: Der Ortsname wird transliteriert; das Trema zeigt im Deutschen an, dass die Vokale getrennt gesprochen werden.
- source_word: עֵין חָצוֹר
  choice: En-Hazor
  rationale: Der zusammengesetzte Ortsname bleibt als Name erhalten. עֵין kann zwar »Quelle« bedeuten, wird in Ortsnamen aber häufig als »En« transliteriert.
- source_word: וְ
  choice: Kommas und abschließendes »und«
  rationale: Die wiederholte hebräische Verknüpfung wird in einer natürlichen deutschen Aufzählung durch Kommas und ein »und« vor dem letzten Namen wiedergegeben.
