  text: לְ/יִ֨שָּׂשכָ֔ר יָצָ֖א הַ/גּוֹרָ֣ל הָֽ/רְבִיעִ֑י לִ/בְנֵ֥י יִשָּׂשכָ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: de
  text: Für Issachar kam das vierte Los heraus, für die Söhne Issachars nach ihren Sippen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: Für Issachar
  rationale: Die Präposition לְ bezeichnet hier den Stamm, dem das Los zugeteilt wird. „Für Issachar“ ist im Deutschen natürlich und bewahrt den Verteilungssinn.
- source_word: יָצָא
  choice: kam ... heraus
  rationale: Die Grundbedeutung „hinausgehen/herauskommen“ passt zum Ziehen oder Werfen des Loses und erhält das Bild des hebräischen Ausdrucks.
- source_word: הַגּוֹרָל
  choice: das Los
  rationale: Der Ausdruck bezeichnet das Los im Verfahren der Landverteilung; „Los“ gibt das konkrete Verteilungsverfahren genauer wieder als das bereits zugewiesene Gebiet.
- source_word: הָרְבִיעִי
  choice: das vierte
  rationale: Die Ordinalzahl nennt die Reihenfolge der Zuteilung; der bestimmte Artikel wird im Deutschen entsprechend wiedergegeben.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: für die Söhne Issachars
  rationale: Die wörtliche Stammes- und Abstammungsbezeichnung „Söhne Issachars“ bleibt erhalten, ohne sie zu einer allgemeineren Bezeichnung aufzulösen.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet hier die Untergliederungen des Stammes. „Sippen“ trifft diese soziale und genealogische Einheit besser als das moderne, oft engere „Familien“.
