  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: de
  text: 'Das war der Erbbesitz des Stammes der Nachkommen Dans nach ihren Sippen: diese Städte mit den zugehörigen Dörfern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: Das war
  rationale: Die feminine Demonstrativform verweist zusammenfassend auf den zuvor aufgeführten Landanteil. Im deutschen Erzählzusammenhang ist das Präteritum natürlich; grundsätzlich wäre auch Präsens möglich.
- source_word: נַחֲלַת
  choice: der Erbbesitz
  rationale: Der Ausdruck bezeichnet hier den dem Stamm zugewiesenen, dauerhaft als Besitz übergebenen Landanteil. „Erbbesitz“ bewahrt sowohl den Zuteilungs- als auch den Vererbungsaspekt.
- source_word: מַטֵּה בְנֵי דָן
  choice: des Stammes der Nachkommen Dans
  rationale: מַטֶּה ist hier die übliche Bezeichnung für einen Stamm. „Nachkommen Dans“ gibt בְנֵי דָן natürlich wieder, ohne die genealogische Formulierung ganz einzuebnen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet in den Stammes- und Landlisten größere Verwandtschaftsverbände innerhalb eines Stammes, nicht bloß Kleinfamilien.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: diese Städte
  rationale: Die Wendung fasst die zuvor genannten Orte zusammen; „Städte“ ist die konventionelle und sachlich passende Wiedergabe.
- source_word: וְחַצְרֵיהֶן
  choice: mit den zugehörigen Dörfern
  rationale: חֲצֵרִים sind hier abhängige kleinere Siedlungen im Umfeld der Städte. „Zugehörig“ verdeutlicht das Verhältnis, das im hebräischen Possessivsuffix ausgedrückt ist.
theological_decisions: []
