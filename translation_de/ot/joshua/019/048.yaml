  source_fidelity: 'Die Übersetzung gibt alle Bestandteile der hebräischen Schlussformel zutreffend wieder: זֹאת mit rückblickendem Präteritum („Das war“), נַחֲלָה als „Erbbesitz“, מַטֵּה בְנֵי דָן als Stammesbezeichnung, לְמִשְׁפְּחֹתָם als Gliederung nach Sippen sowie die Städte und ihre abhängigen Siedlungen. „Zugehörigen Dörfern“ ist eine angemessene idiomatische Entfaltung des Possessivsuffixes bei חַצְרֵיהֶן.'
