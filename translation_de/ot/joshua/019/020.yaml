lexical_decisions:
- source_word: הָרַבִּית
  choice: Rabbith
  rationale: Ortsname in einer Städteliste; die im Deutschen gebräuchliche Umschrift lässt den anlautenden hebräischen Artikelklang unberücksichtigt. Die mechanischere Form »Harabbith« bleibt in der Fußnote erhalten.
- source_word: קִשְׁיוֹן
  choice: Kischjon
  rationale: Der Ortsname wird in einer an deutsche Laut- und Schreibgewohnheiten angepassten Form wiedergegeben; שׁ erscheint als »sch«, die Folge יוֹ als »jo«.
- source_word: אָבֶץ
  choice: Ebez
  rationale: Der Ortsname wird nach der masoretischen Vokalisierung und in anschlussfähiger deutscher Umschrift wiedergegeben.
- source_word: וְ / וָ
  choice: und
  rationale: Die wiederholte hebräische Konjunktion verbindet die Orte der Liste; ihre polysyndetische Struktur wird im Deutschen bewahrt.
