  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי יִשָּׂשכָ֖ר לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: de
  text: 'Das war der Erbbesitz des Stammes der Nachkommen Issachars, nach ihren Sippen: die Städte und die zugehörigen Dörfer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist der Erbbesitz …“ Der hebräische Satz enthält kein ausdrückliches Verb und kann in dieser zusammenfassenden Formel mit Gegenwart oder Vergangenheit wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Das war
  rationale: Das feminine Demonstrativpronomen weist rückblickend auf das zuvor beschriebene Gebiet. Da der hebräische Nominalsatz kein ausdrückliches Verb enthält, ergänzt die deutsche Erzählprosa idiomatisch das Präteritum.
- source_word: נַחֲלַת
  choice: der Erbbesitz
  rationale: נַחֲלָה bezeichnet hier das dem Stamm als Erbe zugewiesene Land. „Erbbesitz“ bewahrt sowohl den territorialen als auch den erbbezogenen Sinn.
- source_word: מַטֵּה בְנֵי יִשָּׂשכָר
  choice: des Stammes der Nachkommen Issachars
  rationale: מַטֶּה bedeutet im Zusammenhang der Landverteilung „Stamm“. בְנֵי bezeichnet die genealogisch verstandenen Angehörigen Issachars; „Nachkommen“ klingt im modernen Deutschen natürlicher als „Söhne“ und bewahrt diesen Sinn.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת sind hier die Untergliederungen des Stammes. Das לְ hat in der Verteilungsformel einen ordnenden beziehungsweise distributiven Sinn.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עָרִים bezeichnet die benannten Siedlungszentren; „Städte“ entspricht dem üblichen Sprachgebrauch in den Landlisten Josuas.
- source_word: וְחַצְרֵיהֶן
  choice: und die zugehörigen Dörfer
  rationale: חֲצֵרִים bezeichnet in dieser Formel kleinere, von den Städten abhängige ländliche Siedlungen. „Zugehörig“ macht die durch das Suffix ausgedrückte Beziehung im Deutschen eindeutig.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Erbbesitz“ erhält den landbezogenen und erbtheologischen Gehalt; „Nachkommen“ und „Sippen“ sind für heutige Leser verständlich, ohne die genealogische und stammesbezogene Struktur einzuebnen.
