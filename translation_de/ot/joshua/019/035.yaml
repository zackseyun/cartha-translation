lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: Und die befestigten Städte waren
  rationale: Die Verbindung bezeichnet im Deutschen natürlich »befestigte Städte«. Das Verb »waren« wird für einen vollständigen deutschen Aufzählungssatz sinngemäß ergänzt; וְ führt die fortlaufende Liste weiter.
- source_word: הַ/צִּדִּים
  choice: Ziddim
  rationale: Der Ortsname wird transliteriert; der hebräische Artikel wird bei einem Ortsnamen in einer deutschen Aufzählung nicht eigens wiedergegeben. Wegen der möglichen appellativischen Deutung wird eine Fußnote gesetzt.
- source_word: צֵר
  choice: Zer
  rationale: Schlichte Transliteration des Ortsnamens nach der hebräischen Konsonantenform.
- source_word: וְ/חַמַּת
  choice: Hammat
  rationale: Transliteration des Ortsnamens; die Verdoppelung des mittleren Konsonanten wird bewahrt.
- source_word: רַקַּת
  choice: Rakkat
  rationale: Transliteration des Ortsnamens unter Wahrung des verdoppelten mittleren Konsonanten.
- source_word: וְ/כִנָּרֶת
  choice: Kinneret
  rationale: Die im modernen Deutschen geläufige, eng an der hebräischen Form orientierte Wiedergabe des Ortsnamens.
