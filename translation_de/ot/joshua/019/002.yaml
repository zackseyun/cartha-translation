  language: en
  yaml_path: translation/ot/joshua/019/002.yaml
  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
translation:
  language: de
  text: Zu ihrem Erbbesitz gehörten Beerscheba[a], Scheba und Molada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Beerscheba und Scheba«. Manche verstehen dies als einen einzigen Ortsnamen (»Beerscheba«) und nehmen eine textliche oder stilistische Unregelmäßigkeit an statt zweier verschiedener Städte.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: Zu ihrem … gehörten
  rationale: Die hebräische Konstruktion mit היה und ל drückt hier im Rahmen der Gebietsliste Zugehörigkeit beziehungsweise Zuweisung aus. Die deutsche Formulierung ist natürlich und bewahrt den Sinn, dass diese Orte ihnen zugeteilt waren.
- source_word: בְּנַחֲלָתָם
  choice: Erbbesitz
  rationale: נחלה bezeichnet hier das einer Stammesgruppe zugeteilte, bleibende Landgebiet. „Erbbesitz“ gibt sowohl den Besitz- als auch den Zuweisungscharakter prägnant wieder.
- source_word: בְּאֵר שֶׁבַע
  choice: Beerscheba
  rationale: Der Ortsname wird in seiner im modernen Deutschen etablierten Form wiedergegeben.
- source_word: וְשֶׁבַע
  choice: Scheba
  rationale: Der masoretische Konsonantentext nennt nach Beerscheba einen weiteren Namen, „Scheba“. Wegen der textlichen beziehungsweise stilistischen Schwierigkeit wird die alternative Auffassung in einer Fußnote offengehalten.
- source_word: וּמוֹלָדָה
  choice: und Molada
  rationale: Der Ortsname wird transliteriert; die Konjunktion kennzeichnet den letzten Eintrag der Aufzählung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Besitzformel der hebräischen Gebietsliste wird idiomatisch wiedergegeben; die Ortsnamen bleiben als Eigennamen erkennbar. Die echte textliche Unsicherheit bei »Beerscheba und Scheba« wird nicht im Haupttext entschieden, sondern transparent in der Fußnote bewahrt.
