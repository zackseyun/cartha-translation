  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: de
  text: und die Wasser von Jarkon[a] und Rakkon, zusammen mit dem Gebiet[b] gegenüber von Joppe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische kann auch als Ortsname »Me-Jarkon« verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zusammen mit der Grenze gegenüber von Joppe« beziehungsweise »zusammen mit der Grenzlinie gegenüber von Joppe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵי הַיַּרְקוֹן
  choice: und die Wasser des Jarkon
  rationale: מֵי ist die Konstruktform von מַיִם („Wasser“) und bezeichnet hier am natürlichsten ein mit Jarkon verbundenes Gewässer. Die mögliche Auffassung als Ortsname bleibt in einer Fußnote erhalten.
- source_word: וְ/הָרַקּוֹן
  choice: und Rakkon
  rationale: Der Eigenname wird in einer dem Hebräischen nahen deutschen Umschrift wiedergegeben; der hebräische Artikel wird dabei nicht gesondert übersetzt.
- source_word: עִם
  choice: samt
  rationale: „Samt“ gibt die verbindende Bedeutung „mit, zusammen mit“ in dieser knappen Gebietsliste natürlich wieder.
- source_word: הַ/גְּבוּל
  choice: dem Gebiet
  rationale: גְּבוּל kann eine Grenze, einen Grenzbereich oder ein Gebiet bezeichnen. Im Zusammenhang der aufgezählten Orte ist „Gebiet“ eine natürliche Wiedergabe, ohne die mögliche Bedeutung „Grenze“ auszuschließen.
- source_word: מוּל
  choice: gegenüber von
  rationale: Die Präposition bezeichnet eine räumliche Lage gegenüber beziehungsweise vor einem Bezugspunkt.
- source_word: יָפוֹ
  choice: Jafo
  rationale: „Jafo“ ist eine direkte und im modernen Deutschen verständliche Wiedergabe des hebräischen Ortsnamens.
