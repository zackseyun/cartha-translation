  text: לִ/בְנֵ֣י נַפְתָּלִ֔י יָצָ֖א הַ/גּוֹרָ֣ל הַ/שִּׁשִּׁ֑י לִ/בְנֵ֥י נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: de
  text: Für die Nachkommen Naftalis kam das sechste Los heraus[a], für die Nachkommen Naftalis nach ihren Sippen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fiel. Das hebräische Verb bedeutet wörtlich „kam heraus“ oder „ging hinaus“ und bezieht sich hier auf das Ergebnis der Losziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: für die Nachkommen Naftalis
  rationale: Die Wendung bezeichnet hier die Angehörigen des Stammes Naftali. „Nachkommen“ gibt den genealogischen Stammesausdruck im heutigen Deutsch natürlicher wieder als das missverständliche „Söhne“.
- source_word: יָצָא
  choice: kam … heraus
  rationale: Das Verb bedeutet wörtlich „hinausgehen/herauskommen“ und bezeichnet hier das Ergebnis der Losziehung; die deutsche Wendung bewahrt sowohl das Bild als auch den Sinn.
- source_word: הַגּוֹרָל הַשִּׁשִּׁי
  choice: das sechste Los
  rationale: Der bestimmte Ordnungszahl-Ausdruck wird direkt wiedergegeben; „Los“ bezeichnet das zur Zuteilung gezogene Los.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת sind hier die verwandtschaftlichen Untergliederungen des Stammes. „Sippen“ ist präziser als das im modernen Deutsch meist engere „Familien“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „für die Nachkommen Naftalis“ bleibt erhalten, weil sie dem hebräischen Satzbau entspricht und die Zuteilung ausdrücklich hervorhebt.
