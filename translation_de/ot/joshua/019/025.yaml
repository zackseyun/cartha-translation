base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/025.yaml
  text: And their border was Helkath[a], Hali, Beten, and Akshaph.
translation:
  language: de
  text: 'Ihre Grenze war: Helkat, Hali, Beten und Achschaf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname wird auch „Akschaf“ geschrieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: war
  rationale: Die Wayyiqtol-Form von היה führt die Grenzliste im fortlaufenden Bericht weiter. Im Deutschen gibt die knappe Formulierung „Ihre Grenze war“ diesen Zusammenhang natürlich wieder; ein zusätzliches „Und“ ist für den deutschen Satzfluss nicht erforderlich.
- source_word: גְּבוּלָם
  choice: ihre Grenze
  rationale: גְּבוּל bezeichnet hier die Grenzlinie des zuvor genannten Stammesgebiets. „Grenze“ ist im Deutschen präziser als das weiter gefasste „Gebiet“.
- source_word: חֶלְקַת
  choice: Helkat
  rationale: Der Ortsname wird nach einer gebräuchlichen deutschen Umschrift wiedergegeben und nicht übersetzt.
- source_word: וַחֲלִי
  choice: Hali
  rationale: Der Ortsname wird in einer lesbaren deutschen Form wiedergegeben; die vorangestellte Konjunktion ist in der deutschen Aufzählung erst vor dem letzten Glied nötig.
- source_word: וָבֶטֶן
  choice: Beten
  rationale: Der Ortsname wird direkt in deutscher Umschrift wiedergegeben.
- source_word: וְאַכְשָׁף
  choice: Achschaf
  rationale: „Achschaf“ ist eine im Deutschen verständliche und traditionsnahe Wiedergabe des hebräischen Ortsnamens אַכְשָׁף. Die Schreibvariante „Akschaf“ wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Knappe, würdevolle Listenform in modernem Standarddeutsch. Der Doppelpunkt macht deutlich, dass die folgenden Ortsnamen die Grenze näher bestimmen, ohne die syntaktische Kürze des Hebräischen unnötig auszubauen. Die Fußnotenmarkierung steht beim tatsächlich erläuterten Namen.
