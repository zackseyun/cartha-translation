  naturalness: '„Ihre Grenze war: …“ ist in einer Grenz- und Ortsnamenliste verständliches, modernes Standarddeutsch. Der Doppelpunkt unterstützt die listenartige Konstruktion, ohne zusätzliche topographische Aussagen einzutragen.'
