- source_word: גִבְּתוֹן
  choice: Gibbeton
  rationale: Ortsname; die Verdoppelung des b gibt den durch Dagesch angezeigten verdoppelten Konsonanten wieder.
- source_word: בַעֲלָת
  choice: Baalat
  rationale: Der Ausdruck ist hier ein Ortsname und wird daher transliteriert, nicht seiner möglichen Wortbedeutung nach übersetzt. Das abschließende t gibt den hebräischen Schlusskonsonanten wieder.
- source_word: וְ / וּ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die Ortsnamen. Im natürlichen Deutschen steht sie ausdrücklich vor dem letzten Glied; die erste Verbindung wird in der Aufzählung durch ein Komma wiedergegeben.
