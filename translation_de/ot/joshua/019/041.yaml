lexical_decisions:
- source_word: וַיְהִי
  choice: umfasste
  rationale: Die hebräische Erzählverbindung leitet die Aussage über das zugeteilte Gebiet ein. Zusammen mit גְּבוּל gibt „Die Grenze … umfasste“ den Sinn im Deutschen natürlich wieder, ohne die hebräische Kopularkonstruktion hölzern nachzubilden.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Im Zusammenhang der Landverteilung bezeichnet das Wort die Grenze beziehungsweise den abgegrenzten Bereich des Stammesgebiets. „Grenze“ bewahrt die konkrete räumliche Bedeutung.
- source_word: נַחֲלָתָם
  choice: ihres Erbbesitzes
  rationale: נַחֲלָה bezeichnet hier das dem Stamm als Erbteil zugewiesene Land. „Erbbesitz“ verbindet den Gedanken des Erbes mit dem eines bleibenden Landbesitzes; das Suffix der 3. Person Plural wird mit „ihres“ wiedergegeben.
- source_word: צָרְעָה
  choice: Zora
  rationale: Gebräuchliche deutsche Wiedergabe des Ortsnamens.
- source_word: אֶשְׁתָּאוֹל
  choice: Eschtaol
  rationale: Gebräuchliche deutsche Transliteration des Ortsnamens.
- source_word: עִיר שָׁמֶשׁ
  choice: Ir-Schemesch
  rationale: Der zusammengesetzte Ortsname wird im Haupttext transliteriert; seine durchschaubare Bedeutung wird in einer Fußnote angegeben.
