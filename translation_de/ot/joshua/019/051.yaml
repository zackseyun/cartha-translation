  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: de
  text: Dies sind die Erbteile, die der Priester Eleasar, Josua, der Sohn Nuns, und die Familienoberhäupter der Stämme der Israeliten[a] durch das Los in Schilo vor Jahwe am Eingang des Zeltes der Begegnung zuteilten. So vollendeten sie die Aufteilung des Landes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Stämme der Söhne Israels“.'
    reason: Dokumentiert die formale hebräische Volksbezeichnung und ihre Zugehörigkeit zu den Familienoberhäuptern.
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: die Erbteile
  rationale: „Erbteile“ bezeichnet verständlich und prägnant die als bleibenden Erbbesitz zugewiesenen Landanteile; es bewahrt sowohl den rechtlichen als auch den heilsgeschichtlichen Gehalt von נַחֲלָה.
- source_word: נִחֲלוּ
  choice: zuteilten
  rationale: Im Zusammenhang der Landverteilung bezeichnet das Verb die Zuweisung der Erbteile. „Zuteilen“ ist im Deutschen natürlicher als eine etymologisch engere, aber missverständliche Wiedergabe mit „erben“.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Sippen
  rationale: Die Wendung meint die leitenden Vertreter der väterlich beziehungsweise genealogisch gegliederten Verbände. „Oberhäupter der Sippen“ gibt die soziale Funktion in verständlichem Gegenwartsdeutsch wieder.
- source_word: לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: den Stämmen der Israeliten
  rationale: Der Dativ gibt die Zielgruppe der Zuteilung wieder. „Israeliten“ ist die natürliche deutsche Bezeichnung; die wörtliche Form „Söhne Israels“ wird in der Fußnote dokumentiert.
- source_word: בְּגוֹרָל
  choice: durch das Los
  rationale: Die Formulierung bezeichnet die geregelte Zuweisung mittels Los und ist im Deutschen klar und idiomatisch.
- source_word: בְּשִׁלֹה
  choice: in Schilo
  rationale: Bei Ortsnamen ist „in Schilo“ im Deutschen die natürliche Wiedergabe.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ wahrt die räumliche und kultische Bedeutung der göttlichen Gegenwart; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: „Eingang“ gibt פֶּתַח präzise wieder. „Zelt der Begegnung“ vermittelt den Sinn von מוֹעֵד als festgesetzter Begegnung, ohne das Zelt lediglich als Versammlungsort zu deuten.
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: So vollendeten sie die Aufteilung des Landes
  rationale: Die Formulierung bewahrt den narrativen Abschluss und gibt die Konstruktion mit כלה und dem Infinitiv von חלק in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ macht den Eigennamen sichtbar, anstatt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten im Haupttext, mit wörtlicher Angabe in der Fußnote
  alternative: Söhne Israels
  rationale: Die feste hebräische Volksbezeichnung umfasst hier die zu den Stämmen Israels gehörende Gemeinschaft. „Israeliten“ ist in modernem Deutsch eindeutig und natürlich; die Fußnote erhält die sprachliche Form des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in drei Sätze gegliedert; die Reihenfolge der Beteiligten, der Ort, die kultische Gegenwart Jahwes und der abschließende Vollzug der Landverteilung bleiben erhalten.
