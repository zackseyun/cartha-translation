lexical_decisions:
- source_word: וִיהֻד
  choice: Jehud
  rationale: Eigenname einer Stadt in der Gebietsliste; nach gängiger deutscher Bibeltradition transkribiert, nicht übersetzt. Das vorangestellte וִ bedeutet hier „und“, wird im Deutschen am Beginn der Aufzählungsfortsetzung jedoch nicht eigens wiedergegeben.
- source_word: וּבְנֵי בְרַק
  choice: Bene-Berak
  rationale: Als zusammengesetzter Ortsname verstanden, nicht als gewöhnliche Wortgruppe „Söhne Beraks“. Der Bindestrich macht kenntlich, dass eine einzige Stadt gemeint ist.
- source_word: וְגַת רִמּוֹן
  choice: Gat-Rimmon
  rationale: Zusammengesetzter Ortsname; גַת wird nach deutscher Transkriptionskonvention als „Gat“ statt nach englischer Konvention als „Gath“ wiedergegeben. Der Bindestrich kennzeichnet den Namen als eine Einheit.
