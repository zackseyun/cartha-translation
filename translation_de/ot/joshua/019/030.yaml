  register: Moderne, knappe und würdevolle Listensprache. Der Doppelpunkt leitet wie im Hebräischen die abschließende Gesamtzahl ein; „samt“ gibt die Verbindung der Städte mit ihren abhängigen Dörfern idiomatisch wieder.
