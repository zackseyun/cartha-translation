  yaml_path: translation/ot/joshua/019/030.yaml
  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: de
  text: 'Umma, Afek und Rehob: zweiundzwanzig Städte mit ihren Dörfern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihren Siedlungen“ oder „mit ihren Weilern“; das hebräische Wort kann abhängige ländliche Orte bezeichnen, die den aufgeführten Städten zugeordnet waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  choice: Umma
  rationale: Ortsname in einer Städteliste; nach der hebräischen Konsonanten- und Vokalgestalt ins Deutsche transkribiert.
- source_word: אֲפֵק
  choice: Afek
  rationale: Ortsname; die deutsche Transkription gibt den hebräischen Buchstaben פ ohne Dagesch als „f“ wieder.
- source_word: רְחֹב
  choice: Rehob
  rationale: Ortsname; „Rehob“ ist eine verständliche deutsche Transkription, wobei „h“ den hebräischen Kehllaut ח vereinfacht wiedergibt.
- source_word: עָרִים
  choice: Städte
  rationale: Der Sammelbegriff bezeichnet die aufgezählten Orte; „Städte“ entspricht dem üblichen Sprachgebrauch in den Gebietslisten Josuas, ohne eine moderne Mindestgröße vorauszusetzen.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: zweiundzwanzig
  rationale: Die Kardinalzahl nennt die Gesamtzahl der Städte in diesem Abschnitt.
- source_word: חַצְרֵיהֶן
  choice: die zugehörigen Dörfer
  rationale: חָצֵר bezeichnet hier abhängige ländliche Siedlungen beziehungsweise unbefestigte Dörfer, die den genannten Städten zugeordnet waren; „zugehörigen“ macht die durch das Suffix ausgedrückte Beziehung natürlich verständlich.
