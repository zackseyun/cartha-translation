lexical_decisions:
- source_word: עֶבְרֹן
  choice: Ebron
  rationale: Der masoretische Konsonantentext wird als Ortsname direkt wiedergegeben; die abweichende Lesart »Abdon« wird in einer Fußnote dokumentiert.
- source_word: רְחֹב
  choice: Rehob
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Ortsnamens; sie bewahrt das anlautende r und gibt ח in der etablierten Namensform mit h wieder.
- source_word: חַמּוֹן
  choice: Hammon
  rationale: Der Ortsname wird in einer natürlichen deutschen Umschrift wiedergegeben; die Verdopplung des m entspricht der hebräischen Konsonantenverstärkung.
- source_word: קָנָה
  choice: Kana
  rationale: Deutsche Umschrift des Ortsnamens ohne das im Deutschen unübliche auslautende h; nicht mit dem bekannteren galiläischen Kana gleichzusetzen, doch gleich geschrieben.
- source_word: עַד
  choice: bis nach
  rationale: Kennzeichnet hier die räumliche Ausdehnung der Gebietsgrenze bis zu einer Stadt und klingt im Deutschen natürlich.
- source_word: צִידוֹן רַבָּה
  choice: Groß-Sidon
  rationale: Gibt die Verbindung von Ortsname und attributivem »groß« knapp und als unterscheidende geografische Bezeichnung wieder.
