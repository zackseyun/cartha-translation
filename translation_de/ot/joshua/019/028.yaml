  yaml_path: translation/ot/joshua/019/028.yaml
  text: Ebron[a], Rehob, Hammon, and Kanah, as far as Great Sidon.
translation:
  language: de
  text: und Ebron[a], Rehob, Hammon und Kana bis zum großen Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Ebron«; einige Textüberlieferungen und Übersetzungen lesen »Abdon«.'
