source:
  edition: WLC
  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: de
  text: Doch das Gebiet der Söhne Dans reichte über sie hinaus.[a] Da zogen die Söhne Dans hinauf und kämpften gegen Leschem. Sie nahmen die Stadt ein, schlugen sie mit der Schärfe des Schwertes, nahmen sie in Besitz und wohnten darin. Sie nannten Leschem Dan, nach dem Namen ihres Stammvaters Dan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch die Grenze der Söhne Dans erstreckte sich über sie hinaus.“ Manche Übersetzungen deuten den Satz im Zusammenhang als: „Das Gebiet der Söhne Dans war ihnen zu klein.“ Der hebräische Wortlaut ist jedoch eher räumlich formuliert und bleibt schwierig.'
    reason: alternative_reading
  - marker: b
    text: Leschem wird mit Lajisch in Richter 18,7; 14; 27; 29 in Verbindung gebracht.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: Doch das Gebiet der Söhne Dans reichte über sie hinaus
  rationale: גְבוּל bezeichnet hier im Zusammenhang der Landzuteilung am ehesten das Gebiet. Die schwierige Wendung מֵהֶם wird räumlich und möglichst nah am hebräischen Wortlaut wiedergegeben; die kontextuelle Deutung, das Gebiet sei ihnen zu klein gewesen, wird nicht in den Haupttext eingetragen.
- source_word: בְּנֵי דָן
  choice: die Söhne Dans
  rationale: Die wörtliche Stammes- und Verwandtschaftsbezeichnung bleibt sichtbar und ist im Deutschen verständlich.
- source_word: וַיַּעֲלוּ
  choice: zogen ... hinauf
  rationale: עלה bezeichnet das Hinaufziehen, hier wahrscheinlich zugleich eine geografische und militärische Bewegung.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: kämpften gegen Leschem
  rationale: Mit dem Städtenamen als Gegenüber gibt „gegen“ den Sinn der hebräischen Konstruktion idiomatisch wieder.
- source_word: לֶשֶׁם
  choice: Leschem
  rationale: Der masoretische Text hat hier Leschem; die Verbindung mit Lajisch wird in einer Fußnote genannt, nicht in den Haupttext übernommen.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: Sie nahmen die Stadt ein
  rationale: לכד bezeichnet im militärischen Kontext die Einnahme. „Die Stadt“ macht das feminine Pronomen im Deutschen natürlich verständlich, ohne einen neuen Sachinhalt hinzuzufügen.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: schlugen sie mit der Schärfe des Schwertes
  rationale: Die Wiedergabe bewahrt das hebräische Schwertbild, klingt dabei jedoch weniger unverständlich als die ganz wörtliche Form „mit dem Mund des Schwertes“.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: nahmen sie in Besitz
  rationale: ירשׁ bezeichnet hier die tatsächliche Besitzergreifung der eroberten Stadt.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: wohnten darin
  rationale: ישׁב bedeutet hier wohnen beziehungsweise sich dort niederlassen; „wohnten darin“ folgt dem Wortlaut ohne zusätzliche Erläuterung.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: Sie nannten Leschem Dan
  rationale: Die Formulierung gibt die Umbenennung knapp und nah an der hebräischen Konstruktion wieder.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: nach dem Namen ihres Stammvaters Dan
  rationale: אָב bezeichnet hier Dan als Ahnherrn des Stammes. „Stammvater“ macht diese im Hebräischen selbstverständliche genealogische Bedeutung im modernen Deutschen präzise deutlich.
