base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: de
  text: 'Das war das Erbteil des Stammes der Nachkommen Naftalis nach ihren Sippen: die Städte und ihre Dörfer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist das Erbteil …“ Der hebräische Nominalsatz kann im Deutschen mit Präsens oder Präteritum wiedergegeben werden; hier fasst das Präteritum die vorangegangene Zuteilung rückblickend zusammen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Das war
  rationale: Das feminine Demonstrativpronomen nimmt die zuvor beschriebene Zuteilung zusammenfassend auf. Im Deutschen passt in diesem rückblickenden Abschlusssatz das Präteritum; formal wäre auch Präsens möglich.
- source_word: נַחֲלַת
  choice: der Erbbesitz
  rationale: נַחֲלָה bezeichnet hier den als Erbe zugewiesenen Landanteil. „Erbbesitz“ bewahrt sowohl den territorialen als auch den erbbezogenen Sinn.
- source_word: מַטֵּה
  choice: des Stammes
  rationale: מַטֶּה ist in dieser Zuteilungsformel die übliche Bezeichnung für einen Stamm, nicht der wörtliche „Stab“.
- source_word: בְנֵי נַפְתָּלִי
  choice: der Nachkommen Naftalis
  rationale: Wörtlich steht „der Söhne Naftalis“. „Nachkommen Naftalis“ gibt die genealogische Stammesbezeichnung natürlich und inklusiv wieder, ohne ihren Abstammungsbezug aufzugeben.
- source_word: לְמִשְׁפְּחֹתָם
  choice: geordnet nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet in der Stammesgliederung eine Sippe. Das לְ drückt hier die Zuordnung beziehungsweise Verteilung nach diesen Sippen aus.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עִיר wird in den Landzuteilungslisten konventionell mit „Stadt“ wiedergegeben, auch wenn einzelne Orte klein gewesen sein mögen.
- source_word: וְחַצְרֵיהֶן
  choice: und die dazugehörigen Dörfer
  rationale: חָצֵר bezeichnet hier die abhängigen ländlichen Siedlungen im Umfeld der Städte. „Dazugehörig“ verdeutlicht den Bezug des femininen Suffixes auf die Städte.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbbesitz“ erhält den biblischen Land- und Erbgedanken; „Sippen“ entspricht der inneren Gliederung des Stammes. Die Satzstruktur bleibt knapp und formelhaft, wird aber durch „geordnet“ und „dazugehörig“ im Deutschen verständlich gemacht.
