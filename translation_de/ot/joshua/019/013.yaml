  text: וּ/מִ/שָּׁ֤ם עָבַר֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה גִּתָּ֥/ה חֵ֖פֶר עִתָּ֣ה קָצִ֑ין וְ/יָצָ֛א רִמּ֥וֹן הַ/מְּתֹאָ֖ר הַ/נֵּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: de
  text: Von dort verlief die Grenze ostwärts, zum Sonnenaufgang hin, nach Gat-Hefer und Et-Kazin und weiter nach Rimmon, das sich bis Nea erstreckt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut am Versende ist schwierig; wörtlich etwa: „Rimmon, das abgesteckte, Nea-wärts“. Möglich ist auch eine Deutung, nach der die Grenze bei Rimmon eine Wendung nach Nea machte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Von dort
  rationale: Gibt die Fortsetzung der Grenzbeschreibung im Deutschen natürlich wieder; das vorangestellte ו wird durch den Zusammenhang ausreichend ausgedrückt.
- source_word: עָבַר
  choice: verlief die Grenze
  rationale: Das grammatisch nicht ausdrücklich genannte Subjekt ist in dieser Grenzbeschreibung die Grenzlinie. „Verlief“ ist im Deutschen idiomatisch und bewahrt die räumliche Bewegung.
- source_word: קֵדְמָה מִזְרָחָה
  choice: ostwärts, zum Sonnenaufgang hin
  rationale: Bewahrt beide hebräischen Richtungsangaben und damit ihre wahrscheinlich verstärkende Wirkung.
- source_word: גִּתָּה חֵפֶר
  choice: Gat-Hefer
  rationale: Der zusammengesetzte Ortsname wird in einer im Deutschen geläufigen Form wiedergegeben.
- source_word: עִתָּה קָצִין
  choice: Et-Kazin
  rationale: Die masoretische Wortfolge wird als Ortsname verstanden; die Form bleibt wegen ihrer Unsicherheit eng am Hebräischen.
- source_word: וְיָצָא
  choice: und weiter
  rationale: Im Kontext einer Grenzbeschreibung bezeichnet das Verb das weitere Auslaufen beziehungsweise Fortführen der Grenzlinie; die knappe deutsche Form vermeidet eine unnatürliche wörtliche Wendung.
- source_word: רִמּוֹן
  choice: Rimmon
  rationale: Transliteration des Ortsnamens.
- source_word: הַמְּתֹאָר הַנֵּעָה
  choice: das sich bis Nea erstreckt
  rationale: Eine kontextuell plausible Deutung der schwierigen Wendung als Angabe über den Verlauf der Grenze von Rimmon bis Nea; die Unsicherheit wird in der Fußnote offengelegt.
