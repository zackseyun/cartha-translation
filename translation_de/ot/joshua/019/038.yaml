  register: Moderne, sachliche und würdevolle Standardsprache. Die Ortsnamen werden nach geläufigen deutschen Transliterationskonventionen wiedergegeben. Der einleitende Anschluss „und“ bleibt erhalten, da der Vers die vorangehende Ortsliste fortsetzt.
