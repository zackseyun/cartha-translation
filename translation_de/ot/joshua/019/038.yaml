  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: de
  text: 'und Jireon, Migdal-El[a], Horem, Bet-Anat[b] und Bet-Schemesch[c]: neunzehn Städte mit ihren Dörfern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname Migdal-El kann wörtlich als „Turm Els“ oder „Turm Gottes“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: Der Ortsname Bet-Anat bedeutet wörtlich „Haus der Anat“.
    reason: lexical_alternative
  - marker: c
    text: Der Ortsname Bet-Schemesch bedeutet wörtlich „Haus der Sonne“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוֹן
  choice: und Jiron
  rationale: Der Ortsname wird nach deutscher Laut- und Schreibkonvention transliteriert; das vorangestellte ו wird als „und“ wiedergegeben.
- source_word: וּמִגְדַּל אֵל
  choice: Migdal-El
  rationale: Der zusammengesetzte Ortsname wird transliteriert und nicht nach seiner wörtlichen Bedeutung übersetzt.
- source_word: חֳרֵם
  choice: Horem
  rationale: Der Ortsname wird in einer für deutsche Leser natürlichen Form transliteriert.
- source_word: וּבֵית עֲנָת
  choice: Bet-Anat
  rationale: Der zusammengesetzte Ortsname wird transliteriert; „Bet“ entspricht dem hebräischen Konstruktstatus von בַּיִת („Haus“).
- source_word: וּבֵית שָׁמֶשׁ
  choice: Bet-Schemesch
  rationale: Der Ortsname wird gemäß deutscher Transliterationskonvention wiedergegeben und nicht wörtlich übersetzt.
- source_word: עָרִים
  choice: Städte
  rationale: „Städte“ ist in den Gebietslisten die übliche Wiedergabe, ohne damit die moderne Größe einer Stadt vorauszusetzen.
- source_word: תְּשַׁע עֶשְׂרֵה
  choice: neunzehn
  rationale: Die hebräische Zahl wird idiomatisch und vollständig wiedergegeben.
- source_word: וְחַצְרֵיהֶן
  choice: mit ihren Dörfern
  rationale: חֲצֵרִים bezeichnet hier die zu den genannten Städten gehörenden kleineren beziehungsweise unbefestigten Siedlungen; die deutsche Zuordnungsformel „mit ihren Dörfern“ ist natürlich und präzise.
