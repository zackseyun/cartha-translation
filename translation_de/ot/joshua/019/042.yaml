lexical_decisions:
- source_word: וְ
  choice: und
  rationale: Die jedem Ortsnamen vorangestellte Konjunktion wird wiederholt mit „und“ wiedergegeben. So bleiben die hebräische Listenstruktur und ihr Rhythmus erhalten.
- source_word: שַׁעֲלַבִּין
  choice: Schaalabbin
  rationale: Der Ortsname wird nach modernen deutschen Umschriftgewohnheiten wiedergegeben. Die Form bildet die Konsonanten und die Verdopplung des b in diesem Vers möglichst genau ab.
- source_word: אַיָּלוֹן
  choice: Ajalon
  rationale: Diese im Deutschen geläufige Form gibt den hebräischen Ortsnamen verständlich und nahe am Ausgangstext wieder.
- source_word: יִתְלָה
  choice: Jitla
  rationale: Der Ortsname wird unmittelbar aus dem Hebräischen umgeschrieben; „Jitla“ entspricht der masoretischen Lautung besser als die traditionsbedingte Form „Jethla“.
