id: JOS.19.10
reference: Joshua 19:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֨עַל֙ הַ/גּוֹרָ֣ל הַ/שְּׁלִישִׁ֔י לִ/בְנֵ֥י זְבוּלֻ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֛י גְּב֥וּל נַחֲלָתָ֖/ם עַד שָׂרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: de
  text: Das dritte Los fiel auf die Söhne Sebulons[a], nach ihren Sippen. Die Grenze ihres Erbbesitzes reichte bis Sarid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Das dritte Los kam herauf für die Söhne Sebulons«; gemeint ist, dass es bei der Losziehung auf sie fiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: fiel auf
  rationale: Das Verb עלה bedeutet wörtlich »hinaufgehen/aufkommen«. Im Zusammenhang der Losziehung gibt »fiel auf« den Vorgang im Deutschen natürlich wieder; die hebräische Bildsprache wird in der Fußnote kenntlich gemacht.
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: das dritte Los
  rationale: Die bestimmte Nominalgruppe wird direkt und idiomatisch wiedergegeben.
- source_word: לִבְנֵי זְבוּלֻן
  choice: auf die Söhne Sebulons
  rationale: בני bezeichnet wörtlich die »Söhne« beziehungsweise Nachkommen Sebulons und dient hier als Stammesbezeichnung. Die Formulierung bewahrt den familiär-genealogischen Ausdruck des Hebräischen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: משפחה bezeichnet in der Stammesgliederung eine Sippe beziehungsweise einen größeren Familienverband; »nach« gibt die distributive Funktion der Präposition ל wieder.
- source_word: גְּבוּל נַחֲלָתָם
  choice: die Grenze ihres Erbbesitzes
  rationale: גבול ist die Grenzlinie, während נחלה das durch Zuteilung empfangene, vererbbare Land bezeichnet. »Erbbesitz« ist hier präziser und natürlicher als das abstraktere »Erbe«.
- source_word: עַד שָׂרִיד
  choice: bis Sarid
  rationale: עד bezeichnet in Grenzangaben die räumliche Erstreckung; Sarid ist ein Ortsname und wird transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Stammesformel »Söhne Sebulons« bleibt erhalten; »Sippen« verdeutlicht die Untergliederung des Stammes. Der lange hebräische Satz ist zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
