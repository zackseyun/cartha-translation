lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Hazar-Schual
  rationale: Der zusammengesetzte Ortsname wird nach der masoretischen Lautung ins Deutsche übertragen. „Sch“ gibt den hebräischen sch-Laut wieder; der Bindestrich macht die Zusammensetzung sichtbar, ohne den Eigennamen im Haupttext zu übersetzen.
- source_word: בָלָה
  choice: Bala
  rationale: Der Ortsname wird entsprechend der im WLC vorliegenden masoretischen Vokalisierung transliteriert. Die Form „Baala“ ist aus verwandten Namensformen und manchen Übersetzungstraditionen bekannt, entspricht hier aber nicht so unmittelbar der punktierten Form.
- source_word: עָצֶם
  choice: Azem
  rationale: Die Wiedergabe folgt der masoretischen Vokalisierung mit anlautendem a-Laut. „Ezem“ ist eine verbreitete alternative Namensform in Übersetzungstraditionen.
- source_word: וּ / וָ
  choice: und
  rationale: Die vorangestellte hebräische Konjunktion verbindet die Ortsnamen innerhalb der fortlaufenden Aufzählung. Im natürlichen Deutschen genügt „und“ vor dem letzten Glied; die übrige Gliederung wird durch Kommas ausgedrückt.
