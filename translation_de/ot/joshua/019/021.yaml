  language: de
  text: Remet[a], En-Gannim, En-Hadda und Bet-Pazzez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräische Ortsnamen: „En-Gannim“ bedeutet wahrscheinlich „Quelle der Gärten“, „En-Hadda“ beginnt mit „Quelle“ und „Bet-Pazzez“ mit „Haus von“. Im Haupttext werden sie als Ortsnamen transliteriert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: Remet
  rationale: Ortsname in einer Städteliste; nach dem Hebräischen transliteriert. Die deutsche Form gibt das auslautende ת als t wieder.
- source_word: עֵין גַּנִּים
  choice: En-Gannim
  rationale: Zusammengesetzter Ortsname aus עֵין („Quelle“) und גַּנִּים („Gärten“). Da er hier als Stadtname dient, wird er transliteriert statt übersetzt.
- source_word: עֵין חַדָּה
  choice: En-Hadda
  rationale: Ortsname mit עֵין („Quelle“) als erstem Bestandteil. Der zweite Bestandteil bleibt wegen unsicherer semantischer Deutung transliteriert.
- source_word: בֵית פַּצֵּץ
  choice: Bet-Pazzez
  rationale: Zusammengesetzter Ortsname mit בֵית („Haus von“). Die Transliteration ist in der Ortsliste natürlicher als eine Bedeutungsübersetzung.
- source_word: וְ
  choice: und
  rationale: Die wiederholte hebräische Konjunktion verbindet die Ortsnamen; im natürlichen Deutschen stehen Kommas und ein abschließendes „und“.
