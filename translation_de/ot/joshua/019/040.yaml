  yaml_path: translation/ot/joshua/019/040.yaml
  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: de
  text: Für den Stamm der Söhne Dans, nach ihren Sippen, kam das siebte Los heraus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: für den Stamm
  rationale: מַטֶּה bezeichnet im Zusammenhang der Landverteilung einen Stamm; die Präposition לְ kennzeichnet hier idiomatisch den Empfänger der Zuteilung.
- source_word: בְנֵי דָן
  choice: der Söhne Dans
  rationale: Die Wiedergabe bewahrt den hebräischen Verwandtschaftsausdruck und bleibt im Deutschen verständlich und würdig.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet hier die sozialen Untergliederungen des Stammes; „Sippen“ vermeidet die heute oft auf den engen Haushalt beschränkte Bedeutung von „Familien“.
- source_word: יָצָא
  choice: kam ... heraus
  rationale: Die Wendung bildet die Grundbedeutung des Verbs im Losverfahren transparent ab und ist im Deutschen natürlich.
- source_word: הַגּוֹרָל
  choice: das ... Los
  rationale: גוֹרָל ist der übliche Ausdruck für das Los bei der Landzuteilung.
- source_word: הַשְּׁבִיעִי
  choice: siebte
  rationale: Das Ordinalzahlwort bestimmt das Los und bezeichnet dessen Reihenfolge.
