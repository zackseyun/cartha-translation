base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: de
  text: 'Ain[a], Rimmon, Eter und Aschan: vier Städte mit ihren Dörfern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text nennt vier Ortsnamen: Ain, Rimmon, Eter und Aschan. Manche verstehen im Vergleich mit 1. Chronik 4,32 »Ain-Rimmon« als einen zusammengehörenden Ortsnamen, was sich auf die Zahl der Städte auswirkt.'
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  choice: Ajin
  rationale: Der Ausdruck bezeichnet hier in einer Ortsliste einen Ortsnamen und wird daher nicht mit seiner sonst möglichen Bedeutung »Quelle« oder »Auge« übersetzt. »Ajin« entspricht der im Deutschen üblichen biblischen Namensform.
- source_word: רִמּוֹן
  choice: Rimmon
  rationale: Hier liegt ein Ortsname vor; die lexikalische Bedeutung »Granatapfel« wird daher nicht wiedergegeben.
- source_word: וָעֶתֶר
  choice: Eter
  rationale: Der mit einer Konjunktion eingeleitete Ortsname wird in einer dem Hebräischen und deutschen Bibelgebrauch angemessenen Form wiedergegeben.
- source_word: וְעָשָׁן
  choice: und Aschan
  rationale: Der Ortsname wird transliteriert; die vorangestellte Konjunktion wird natürlich mit »und« wiedergegeben.
- source_word: עָרִים
  choice: Städte
  rationale: עִיר bezeichnet hier die in der Gebietsliste gezählten städtischen Orte; »Städte« entspricht der zusammenfassenden Formel.
- source_word: אַרְבַּע
  choice: vier
  rationale: Die Kardinalzahl wird direkt wiedergegeben und bezieht sich auf »Städte«.
- source_word: וְחַצְרֵיהֶן
  choice: mit ihren Dörfern
  rationale: חָצֵר bezeichnet in solchen Gebietsformeln die zugehörigen kleineren, ländlichen Siedlungen. »Mit ihren Dörfern« gibt das Verhältnis im heutigen Deutsch klar und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Listenform in modernem Standarddeutsch. Die Ortsnamen werden transliteriert, während die abschließende Verwaltungsformel natürlich formuliert ist. Der Gedankenstrich verdeutlicht den Übergang von der Aufzählung zur Zusammenfassung, ohne die Aussage inhaltlich festzulegen.
