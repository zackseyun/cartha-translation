base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: de
  text: Das zweite Los fiel auf Simeon[a], auf den Stamm der Söhne Simeons nach ihren Sippen[b]. Ihr Erbbesitz lag innerhalb des Erbbesitzes der Söhne Judas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Das zweite Los kam für Simeon heraus.« Gemeint ist das Ergebnis des Losverfahrens.'
    reason: lexical_alternative
  - marker: b
    text: »Söhne Simeons« und »Söhne Judas« sind hebräische Stammesbezeichnungen; gemeint sind die Nachkommen beziehungsweise Angehörigen dieser Stämme.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  choice: Das zweite Los fiel
  rationale: יצא bedeutet wörtlich »hinausgehen/herauskommen«; beim Losverfahren ist »das Los fiel« im Deutschen die natürliche feste Wendung und bezeichnet das Ergebnis, ohne Los und Erbteil gleichzusetzen.
- source_word: לְשִׁמְעוֹן
  choice: auf Simeon
  rationale: Die Präposition ל bezeichnet hier den Empfänger des Loses; zusammen mit »fiel« ist »auf Simeon« idiomatisches Deutsch.
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: auf den Stamm der Söhne Simeons
  rationale: מַטֶּה bezeichnet in diesem Verteilungskontext den Stamm. Die Wiederholung von ל wird als paralleles »auf« wiedergegeben; בְנֵי bleibt als genealogisch-stammesbezogene Bezeichnung sichtbar.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet hier größere verwandtschaftliche Untergruppen des Stammes; »Sippen« ist genauer als das modern oft auf den Haushalt bezogene »Familien«.
- source_word: נַחֲלָתָם
  choice: ihr Erbbesitz
  rationale: נַחֲלָה bezeichnet das durch Zuteilung erhaltene Land. »Erbbesitz« bewahrt den rechtlichen und generationenübergreifenden Gehalt und klingt im Deutschen natürlicher als die abstraktere »Erbschaft« für ein Gebiet.
- source_word: בְּתוֹךְ
  choice: innerhalb
  rationale: Das Wort bezeichnet die Lage im Inneren beziehungsweise innerhalb des judäischen Gebiets.
- source_word: נַחֲלַת בְּנֵי יְהוּדָה
  choice: des Erbbesitzes der Söhne Judas
  rationale: נַחֲלָה wird konsequent mit »Erbbesitz« wiedergegeben; die hebräische Stammesbezeichnung »Söhne Judas« bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Das Los fiel auf« entspricht natürlichem deutschem Sprachgebrauch; »Erbbesitz« erhält den territorialen und rechtlichen Sinn. Die traditionelle verwandtschaftliche Stammesbezeichnung wird im Text bewahrt und in einer Fußnote erläutert.
