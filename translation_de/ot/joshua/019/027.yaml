  terminology: Die Ortsnamensformen Bet-Dagon, Sebulon, Jiftach-El, Bet-Emek, Neïel und Kabul sind als deutsche, quellennah transliterierte Formen vertretbar. Die konkrete Angabe „von der linken Seite her“ bleibt im Text; die Anmerkung erläutert lediglich ihre mögliche geographische Konnotation.
