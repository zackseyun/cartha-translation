source:
  edition: WLC
  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: de
  text: Dann wandte sich die Grenze ostwärts, zum Sonnenaufgang hin, nach Bet-Dagon und stieß an Sebulon und an das Tal von Jiftach-El, nordwärts nach Bet-Emek und Neïel; dann lief sie von der linken Seite her nach Kabul[a] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von links“. In Grenzbeschreibungen kann „links“ bei einer Ausrichtung nach Osten die Nordseite bezeichnen.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: Dann wandte sich die Grenze
  rationale: שׁוב bezeichnet in Grenzbeschreibungen häufig einen Richtungswechsel. Das im Hebräischen nur mitgedachte Subjekt wird als „die Grenze“ aus dem Zusammenhang ergänzt, damit der deutsche Satz verständlich bleibt.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: von Osten, vom Sonnenaufgang her
  rationale: Die Präposition מִן bezeichnet hier den Ausgangspunkt („von“). „Vom Sonnenaufgang her“ bewahrt zugleich die wörtliche Bildsprache der hebräischen Richtungsangabe.
- source_word: בֵּית דָּגֹן
  choice: Bet-Dagon
  rationale: Der Ortsname wird in einer im Deutschen üblichen, quellennahen Form wiedergegeben und nicht als „Haus Dagons“ übersetzt.
- source_word: וּפָגַע בִּזְבֻלוּן
  choice: stieß an Sebulon
  rationale: פגע mit ב bezeichnet in Grenztexten das Zusammentreffen mit einem Gebiet oder einer Grenzlinie. „Stieß an“ gibt diesen geografischen Sinn knapp wieder.
- source_word: וּבְגֵי יִפְתַּח אֵל צָפוֹנָה
  choice: und nördlich an das Tal Jiftach-El
  rationale: צָפוֹנָה wird als Richtungs- beziehungsweise Lageangabe wiedergegeben. Die knappe hebräische Reihung lässt offen, wie eng „nördlich“ syntaktisch mit dem Talnamen verbunden ist; die deutsche Fassung bewahrt diese geografische Zuordnung ohne zusätzliche Präzisierung.
- source_word: בֵּית הָעֵמֶק וּנְעִיאֵל
  choice: Bet-Emek und Neïel
  rationale: Beide Ortsnamen werden transliteriert. Das Trema in „Neïel“ macht im Deutschen die getrennte Aussprache der Vokale kenntlich.
- source_word: וְיָצָא
  choice: schließlich lief sie … aus
  rationale: יצא beschreibt in Grenzformeln das weitere Auslaufen beziehungsweise Enden einer Grenzlinie. „Lief … aus“ ist dafür im Deutschen natürlich und anschaulich.
- source_word: אֶל כָּבוּל
  choice: von Kabul
  rationale: Die Verbindung mit מִשְּׂמֹאל wird räumlich als „links von Kabul“ verstanden. „Kabul“ transliteriert den antiken Ortsnamen; der Zusammenhang unterscheidet ihn von der modernen Stadt gleichen Namens.
- source_word: מִשְּׂמֹאל
  choice: links von Kabul
  rationale: Wörtlich bedeutet der Ausdruck „von links“. Die Hauptübersetzung erhält die konkrete Linksangabe und legt ihre mögliche geografische Bedeutung nicht stillschweigend fest.
theological_decisions: []
translation_notes:
  register: Moderne, sachlich-würdevolle Standardsprache. Die wiederholten Grenzformeln werden flüssig verbunden, ohne die knappe geografische Struktur des Hebräischen einzuebnen. Die Präposition in מִזְרַח wird gegenüber der englischen Konsultationsfassung ausdrücklich als „von“ wiedergegeben; der Fußnotenmarker steht beim Ausdruck מִשְּׂמֹאל, auf den die Anmerkung tatsächlich bezogen ist.
