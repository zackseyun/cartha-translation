revisions:
- from: Dann wandte sich die Grenze von Osten, vom Sonnenaufgang her, nach Bet-Dagon, stieß an Sebulon und nördlich an das Tal Jiftach-El, an Bet-Emek und Neïel; schließlich lief sie links von Kabul[a] aus.
  to: Dann wandte sich die Grenze ostwärts, zum Sonnenaufgang hin, nach Bet-Dagon und stieß an Sebulon und an das Tal von Jiftach-El, nordwärts nach Bet-Emek und Neïel; dann lief sie von der linken Seite her nach Kabul[a] aus.
  rationale: Die Richtungsangabe wurde entsprechend dem Hebräischen von einem Ausgangspunkt („von Osten“) zu einer Bewegungsrichtung („ostwärts, zum Sonnenaufgang hin“) berichtigt. Die abschließende Orts- und Seitenangabe wurde so umgestellt, dass sowohl „nach Kabul“ als auch das wörtliche „von links“ sichtbar bleiben. Die mögliche Orientierung nach Norden wird weiterhin nur in der Fußnote genannt.
