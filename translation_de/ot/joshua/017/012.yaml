base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: de
  text: Die Nachkommen Manasses konnten jedoch die Bewohner dieser Städte nicht vertreiben, und die Kanaaniter waren entschlossen, in diesem Land zu wohnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Kanaaniter wollte in diesem Land wohnen.« Das Hebräische verwendet „der Kanaaniter“ als kollektivische Einzahl; das Verb kann Willigkeit oder Entschlossenheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: konnten … nicht
  rationale: Gibt die fehlende Fähigkeit bzw. das Nichtvermögen des Verbs יכל unmittelbar und natürlich wieder.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: die Nachkommen Manasses
  rationale: Das wörtliche »Söhne Manasses« bezeichnet hier die Stammesangehörigen; »Nachkommen« ist im modernen Deutschen klar und bewahrt den genealogischen Bezug.
- source_word: לְהוֹרִישׁ אֶת הֶעָרִים הָאֵלֶּה
  choice: die Bewohner dieser Städte … vertreiben
  rationale: Der Hifil von ירש bezeichnet in diesem Landnahmekontext das Verdrängen bzw. Enteignen der bisherigen Bevölkerung. Da Städte nicht selbst vertrieben werden können, wird die im Hebräischen metonymisch ausgedrückte Bevölkerung im Deutschen ausdrücklich genannt.
- source_word: וַיּוֹאֶל
  choice: hielten … daran fest
  rationale: יאל kann Willigkeit oder Entschlossenheit ausdrücken. Im Zusammenhang bezeichnet die Form das beharrliche Festhalten der Kanaaniter an ihrem Wohnsitz, ohne den Sinn auf bloße Zustimmung zu verengen.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Der morphologische Singular wird kollektiv gebraucht; der deutsche Plural gibt die betreffende Volksgruppe natürlich wieder.
- source_word: לָשֶׁבֶת
  choice: wohnen zu bleiben
  rationale: Die Form bezeichnet das Wohnen bzw. Verbleiben im Gebiet; zusammen mit וַיּוֹאֶל bringt »wohnen zu bleiben« die beabsichtigte Fortdauer idiomatisch zum Ausdruck.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: אֶרֶץ bezeichnet hier das betreffende Gebiet; »Land« bewahrt den territorialen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Nachkommen« vermeidet das heute missverständliche wörtliche »Söhne« für den gesamten Stamm. Die metonymischen »Städte« werden als deren Bewohner entfaltet; die Fußnote bewahrt die Mehrdeutigkeit und die kollektiv gebrauchte Einzahl des zweiten Satzes.
