  to: 'Da wandten sich die Nachkommen Josefs an Josua und sagten: »Warum hast du mir als Erbbesitz ein Los und einen Landanteil[a] gegeben? Ich bin doch ein zahlreiches Volk, denn Jahwe hat mich bis heute gesegnet.«'
