base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: de
  text: 'Da wandten sich die Nachkommen Josefs an Josua und sagten: »Warum hast du mir als Erbbesitz ein Los und einen Landanteil[a] gegeben? Ich bin doch ein zahlreiches Volk, denn Jahwe hat mich bis heute gesegnet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein einziges Gebiet«. Das hebräische Wort bezeichnet einen abgemessenen Landanteil oder ein Gebiet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ בְּנֵי יוֹסֵף אֶת יְהוֹשֻׁעַ
  choice: Da wandten sich die Nachkommen Josefs an Josua
  rationale: דבר mit אֶת vor der angesprochenen Person wird im Deutschen natürlich mit „sich an jemanden wenden“ wiedergegeben. „Nachkommen Josefs“ bezeichnet die beiden josefitischen Stämme verständlicher als das wörtliche „Söhne Josefs“.
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: hast du mir … als Erbbesitz gegeben
  rationale: Die kollektive Einzahl „mir“ bleibt erhalten. נַחֲלָה bezeichnet hier das dauerhaft zugewiesene Erbland; „Erbbesitz“ ist im Landverteilungskontext präzise und natürlich.
- source_word: גּוֹרָל אֶחָד וְחֶבֶל אֶחָד
  choice: nur ein Los und nur einen Landanteil
  rationale: גּוֹרָל ist das durch Los zugewiesene Los beziehungsweise die Zuteilung; חֶבֶל bezeichnet einen vermessenen Gebietsanteil. Das im Hebräischen einmalige אֶחָד wird zur Verdeutlichung der Beschwerde bei beiden parallelen Gliedern mit „nur ein“ wiedergegeben.
- source_word: וַאֲנִי עַם רָב
  choice: Ich bin doch ein zahlreiches Volk
  rationale: Die korporative Rede in der ersten Person Singular wird bewahrt. עַם רָב meint hier aufgrund des Kontexts ein zahlenmäßig großes Volk; „doch“ bringt den kontrastierenden beziehungsweise begründenden Einwand natürlich zum Ausdruck.
- source_word: עַד אֲשֶׁר עַד כֹּה בֵּרְכַנִי
  choice: denn … hat mich bis heute gesegnet
  rationale: Die gedrängte Wendung wird kausal und zeitlich verstanden. „Bis heute“ gibt עַד כֹּה genauer wieder als eine rein intensive Übersetzung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen; „Jahwe“ bewahrt diese Funktion.
- issue: Korporative Einzahl der Josefstämme
  choice: mir / Ich / mich
  alternative: uns / wir / uns
  rationale: Obwohl mehrere Stammesgruppen sprechen, stellt der hebräische Wortlaut sie als kollektive Einheit in der Einzahl dar. Diese Spannung bleibt in der Übersetzung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert, während die auffällige korporative Einzahl des hebräischen Textes bewusst erhalten bleibt.
