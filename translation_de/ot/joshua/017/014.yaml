    rationale: Der hebräische Text bezeichnet beide Zuteilungselemente jeweils als „eins“, enthält aber kein eigenes Adverb, das die zweimalige deutsche Verstärkung „nur“ fordert. Die Beschwerde ergibt sich aus dem Kontext und bleibt auch mit „ein Los und einen Landanteil“ erhalten.
