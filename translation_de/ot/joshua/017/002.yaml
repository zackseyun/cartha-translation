  text: וַ֠/יְהִי לִ/בְנֵ֨י מְנַשֶּׁ֥ה הַ/נּוֹתָרִים֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/בְנֵ֨י אֲבִיעֶ֜זֶר וְ/לִ/בְנֵי חֵ֗לֶק וְ/לִ/בְנֵ֤י אַשְׂרִיאֵל֙ וְ/לִ/בְנֵי שֶׁ֔כֶם וְ/לִ/בְנֵי חֵ֖פֶר וְ/לִ/בְנֵ֣י שְׁמִידָ֑ע אֵ֠לֶּה בְּנֵ֨י מְנַשֶּׁ֧ה בֶּן יוֹסֵ֛ף הַ/זְּכָרִ֖ים לְ/מִשְׁפְּחֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: de
  text: 'Und den übrigen Söhnen Manasses wurde nach ihren Sippen zugeteilt: den Söhnen Abiësers, den Söhnen Heleks, den Söhnen Asriëls, den Söhnen Sichems, den Söhnen Hefers und den Söhnen Schemidas. Das waren die männlichen Söhne Manasses, des Sohnes Josefs, nach ihren Sippen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sippen“ gibt das hebräische mischpachot wieder, eine Verwandtschaftsgruppe innerhalb eines Stammes; auch „Familien“ ist möglich.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: Auch die übrigen Nachkommen Manasses erhielten ihren Anteil
  rationale: וַיְהִי eröffnet hier idiomatisch die Zuteilungsaussage; das aus dem Zusammenhang ergänzte „erhielten ihren Anteil“ gibt die Funktion der Präposition ל natürlich wieder. „Nachkommen“ erfasst בנים in der Aufzählung von Sippenlinien besser als das biologisch engere „Söhne“.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im Zusammenhang der Stammesgliederung eine größere Verwandtschaftsgruppe; „Sippe“ ist hier präziser als das moderne „Familie“.
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי שְׁמִידָע
  choice: die Nachkommen Abiesers … und Schemidas
  rationale: Die wiederholte Formel bezeichnet die von den Genannten abstammenden Sippenlinien. Die gestraffte deutsche Aufzählung bleibt inhaltlich vollständig und vermeidet schwerfällige Wiederholungen.
- source_word: הַזְּכָרִים
  choice: die männlichen Nachkommen
  rationale: Die ausdrückliche Geschlechtsangabe wird bewahrt; sie hebt diese Linien gegenüber den im Kontext genannten Töchtern Zelofhads ab.
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף
  choice: Nachkommen Manasses, des Sohnes Josefs
  rationale: Die Apposition macht im Deutschen eindeutig, dass Manasse der Sohn Josefs ist, und bewahrt die genealogische Angabe.
theological_decisions: []
