  text: וַ/יִּפְּל֥וּ חַבְלֵֽי מְנַשֶּׁ֖ה עֲשָׂרָ֑ה לְ/בַ֞ד מֵ/אֶ֤רֶץ הַ/גִּלְעָד֙ וְ/הַ/בָּשָׁ֔ן אֲשֶׁ֖ר מֵ/עֵ֥בֶר לַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/005.yaml
  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: de
  text: So fielen Manasse zehn Gebietsanteile[a] zu, außer dem Land Gilead und Baschan jenseits des Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So wurden Manasse zehn Landanteile zugeteilt« beziehungsweise: »So erhielt Manasse durch das Los zehn Anteile.« Im Hebräischen steht im Zusammenhang der Landverteilung wörtlich das Verb »fallen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: fielen … zu
  rationale: Die Wendung bewahrt das hebräische Bild des »Fallens« bei einer Landzuteilung und ist zugleich natürliches modernes Deutsch.
- source_word: חַבְלֵי
  choice: Gebietsanteile
  rationale: חבל bezeichnet hier abgegrenzte beziehungsweise zugemessene Landanteile; »Gebietsanteile« macht den territorialen Bezug deutlich, ohne das Verfahren übermäßig festzulegen.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Eingebürgerte deutsche Form des Stammes- und Personennamens.
- source_word: עֲשָׂרָה
  choice: zehn
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: לְבַד מֵאֶרֶץ
  choice: außer dem Land
  rationale: Die Verbindung grenzt Gilead und Baschan von den zehn westjordanischen Gebietsanteilen ab.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Gilead und Baschan
  rationale: Gebräuchliche deutsche Schreibweisen der Ortsnamen.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Knappe, idiomatische Ortsangabe; der Relativsatz des Hebräischen wird im Deutschen natürlich attributiv wiedergegeben.
