  terminology: Die Eigennamen »Manasse«, »Gilead«, »Baschan« und »Jordan« entsprechen dem üblichen deutschen Bibelgebrauch. »Gebietsanteile« gibt חַבְלֵי sachgerecht als territorial bestimmte Anteile wieder. Die Fußnote bietet zulässige Übersetzungsalternativen und erläutert das wörtliche Bild, ohne es als zwingende Aussage über das Losverfahren auszugeben.
