  source_fidelity: 'Der Entwurf gibt die hebräische Syntax und Aussage zuverlässig wieder: Zehn territoriale Anteile fielen Manasse zu, zusätzlich zu bzw. unter Ausklammerung des bereits ostjordanischen Gebiets Gilead und Baschan. »fielen … zu« wahrt das idiomatische נפל im Zuteilungskontext, ohne eine im Vers nicht ausdrücklich genannte konkrete Loshandlung zu behaupten. Die attributive Fassung »jenseits des Jordan« überträgt den Relativbezug auf Gilead und Baschan angemessen.'
