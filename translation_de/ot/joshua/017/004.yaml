revisions:
- from: 'Da traten sie vor den Priester Eleasar, vor Josua, den Sohn Nuns, und vor die führenden Männer und sagten: »Jahwe hat Mose geboten, uns mitten unter unseren Brüdern einen Erbbesitz zu geben.« Da gab er ihnen nach dem Befehl Jahwes[a] einen Erbbesitz mitten unter den Brüdern ihres Vaters[b].'
  to: 'Da traten sie vor den Priester Eleasar, vor Josua, den Sohn Nuns, und vor die Anführer und sagten: »Jahwe hat Mose geboten, uns unter unseren Brüdern einen Erbbesitz zu geben.« Da gab er ihnen nach dem Befehl Jahwes[a] einen Erbbesitz unter den Brüdern ihres Vaters[b].'
  rationale: Die Revision glättet zwei Formulierungen für modernes Standarddeutsch und korrigiert die grammatisch fehlerhafte Fußnote. Sie bewahrt dabei die Wiederholung von »vor«, die Geschlechtsspezifik der Brüder, den nicht aufgelösten Bezug von »er« sowie die konkrete Angabe »Brüder ihres Vaters«.
  reviewer_model: gpt-5.6-terra
