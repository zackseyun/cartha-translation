source:
  edition: WLC
  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: de
  text: 'Da traten sie vor den Priester Eleasar, vor Josua, den Sohn Nuns, und vor die Anführer und sagten: »Jahwe hat Mose geboten, uns unter unseren Brüdern einen Erbbesitz zu geben.« Da gab er ihnen nach dem Befehl Jahwes[a] einen Erbbesitz unter den Brüdern ihres Vaters[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach dem Mund Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die väterliche Verwandtschaftsgruppe, innerhalb deren Landanteile die Töchter ihren Erbbesitz erhielten.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: Da traten sie vor
  rationale: Das feminine Pluralverb bezieht sich auf die zuvor genannten Töchter. In Verbindung mit dem dreimaligen לִפְנֵי gibt »vor ... treten« den formellen Auftritt vor den zuständigen Autoritäten natürlich wieder.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die dreifache Wiederholung kennzeichnet das öffentliche Erscheinen vor den Amtsträgern; »vor« ist knapp und sachgerecht.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und genaue Wiedergabe der Amtsbezeichnung כֹּהֵן.
- source_word: הַנְּשִׂיאִים
  choice: die führenden Männer
  rationale: נְשִׂיאִים bezeichnet hier die leitenden Vertreter der Gemeinschaft beziehungsweise der Stämme. »Fürsten« könnte im heutigen Deutsch irreführend monarchisch klingen; die maskuline Form bleibt dem historischen Kontext entsprechend sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: uns einen Erbbesitz zu geben
  rationale: נַחֲלָה bezeichnet im Buch Josua den erblich zugeteilten Landbesitz. »Erbbesitz« ist hier präziser als das im Deutschen oft anders verstandene »Erbe«.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: mitten unter unseren Brüdern
  rationale: Die Formulierung bewahrt sowohl die räumlich-soziale Bedeutung von בְּתוֹךְ als auch die maskuline Verwandtschaftsbezeichnung des Ausgangstextes.
- source_word: וַיִּתֵּן
  choice: Da gab er ihnen
  rationale: Der hebräische Singular wird bewahrt. Sein naheliegender Bezug ist Josua als handelnde Autorität, ohne die im Text nicht ausdrücklich benannte Referenz im Haupttext aufzulösen.
- source_word: אֶל־פִּי יְהוָה
  choice: nach dem Befehl Jahwes
  rationale: Die Wendung bedeutet wörtlich »nach dem Mund Jahwes« und bezeichnet hier verbindliche göttliche Anweisung. Die idiomatische Wiedergabe erhält deren Autorität.
- source_word: אֲחֵי אֲבִיהֶן
  choice: die Brüder ihres Vaters
  rationale: Die konkrete Verwandtschaftsangabe wird gegenüber allgemeineren Wiedergaben wie »Verwandte« bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen. »Jahwe« wahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Verwandtschaftssprache in אַחֵינוּ
  choice: unsere Brüder
  alternative: unsere Verwandten
  rationale: Der Ausgangstext verwendet die maskuline Verwandtschaftsbezeichnung. Im Zusammenhang mit der Landzuteilung an die Töchter Zelofhads ist diese rechtliche und soziale Besonderheit bedeutsam.
- issue: Bezug des singularischen וַיִּתֵּן
  choice: er
  alternative: Josua
  rationale: Der hebräische Text nennt das Subjekt nicht erneut. Das Pronomen erhält diese formale Offenheit, obwohl Josua im Kontext am ehesten als handelnde Instanz gemeint ist.
- issue: Paternale Verwandtschaft in אֲחֵי אֲבִיהֶן
  choice: Brüder ihres Vaters
  alternative: Verwandte ihres Vaters
  rationale: Die ausdrückliche paternale Verwandtschaft soll nicht zu einer allgemeinen Clanbezeichnung verflacht werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der formelle Rechts- und Zuteilungskontext bleibt durch »vor ... treten«, »geboten«, »Erbbesitz« und »Befehl« erkennbar. Die Wiederholung von »vor« wurde entsprechend der hebräischen Struktur bewahrt; beim dritten Glied wurde sie aus Gründen natürlichen deutschen Satzbaus nicht noch einmal gesetzt.
