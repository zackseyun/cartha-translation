source:
  edition: WLC
  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: de
  text: Zelofhad, der Sohn Hefers, des Sohnes Gileads, des Sohnes Machirs, des Sohnes Manasses, hatte keine Söhne, sondern nur Töchter. Seine Töchter hießen Machla, Noa[a], Hogla, Milka und Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noa ist hier eine Tochter Zelofhads, nicht der aus der Genesis bekannte Mann Noah.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: Zelofhad
  rationale: Die Verbindung von ו und ל führt hier idiomatisch Zelofhads Fall ein; im Deutschen genügt die unmittelbare Nennung des Namens ohne einen künstlichen zeitlichen Ausdruck wie „nun“.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: der Sohn ... des Sohnes ... des Sohnes ... des Sohnes
  rationale: Die wiederholte Abstammungsformel wird bewahrt, da die genaue genealogische Linie für den Erbzusammenhang wichtig ist.
- source_word: לֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  choice: hatte keine Söhne, sondern nur Töchter
  rationale: Die natürliche deutsche Besitzkonstruktion wahrt den ausdrücklichen Gegensatz zwischen männlichen und weiblichen Nachkommen sowie die ausschließende Bedeutung von כִּי אִם.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Seine Töchter hießen
  rationale: Diese knappe, natürliche deutsche Namensformel gibt den Sinn vollständig wieder, ohne die hebräische Satzstruktur unnötig nachzubilden.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Machla, Noa, Hogla, Milka und Tirza
  rationale: Die Eigennamen werden in im Deutschen geläufigen bibelnahen Formen wiedergegeben.
