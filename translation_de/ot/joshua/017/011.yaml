  text: וַ/יְהִ֨י לִ/מְנַשֶּׁ֜ה בְּ/יִשָּׂשכָ֣ר וּ/בְ/אָשֵׁ֗ר בֵּית שְׁאָ֣ן וּ֠/בְנוֹתֶי/הָ וְ/יִבְלְעָ֨ם וּ/בְנוֹתֶ֜י/הָ וְֽ/אֶת יֹשְׁבֵ֧י דֹ֣אר וּ/בְנוֹתֶ֗י/הָ וְ/יֹשְׁבֵ֤י עֵֽין דֹּר֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֤י תַעְנַךְ֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֥י מְגִדּ֖וֹ וּ/בְנוֹתֶ֑י/הָ שְׁלֹ֖שֶׁת הַ/נָּֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: de
  text: Und in Issachar und Ascher gehörten Manasse Bet-Schean mit seinen Tochterorten[a], Jibleam mit seinen Tochterorten, die Einwohner von Dor mit seinen Tochterorten, die Einwohner von En-Dor mit seinen Tochterorten, die Einwohner von Taanach mit seinen Tochterorten und die Einwohner von Megiddo mit seinen Tochterorten – die drei Bezirke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihre Töchter«; gemeint sind kleinere, von der jeweiligen Stadt abhängige Ortschaften oder Siedlungen.'
    reason: cultural_note
  - marker: b
    text: 'Die hebräische Wendung ist schwierig; auch möglich: »die drei Gebiete« oder »die drei Höhenbezirke«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: Und Manasse gehörten
  rationale: Die hebräische Wendung ויהי ל bezeichnet hier Zugehörigkeit beziehungsweise Besitz innerhalb des Stammesgebiets. Die deutsche Formulierung ist natürlich und lässt den Zuteilungscharakter erkennen.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: in Issachar und Ascher
  rationale: ב bezeichnet die Lage innerhalb der Gebiete dieser beiden Stämme.
- source_word: בֵּית שְׁאָן
  choice: Bet-Schean
  rationale: Im Deutschen gebräuchliche, am Hebräischen orientierte Umschrift des Ortsnamens.
- source_word: בְנוֹתֶיהָ
  choice: seine Tochterorte
  rationale: Wörtlich steht „seine Töchter“. Gemeint sind kleinere, von der jeweiligen Hauptstadt abhängige Ortschaften; „Tochterorte“ bewahrt das hebräische Bild und bleibt verständlich.
- source_word: יִבְלְעָם
  choice: Jibleam
  rationale: Deutsche Umschrift des hebräischen Ortsnamens.
- source_word: אֶת יֹשְׁבֵי דֹאר
  choice: die Einwohner von Dor
  rationale: Die substantivierte Partizipialform bezeichnet die Bewohner beziehungsweise Einwohner des Ortes.
- source_word: עֵין דֹּר
  choice: En-Dor
  rationale: Die Bindestrichschreibung macht die Zusammensetzung des Ortsnamens sichtbar.
- source_word: תַעְנַךְ
  choice: Taanach
  rationale: Gängige deutsche Form des Ortsnamens.
- source_word: מְגִדּוֹ
  choice: Megiddo
  rationale: Gängige deutsche Form des Ortsnamens.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: die drei Bezirke
  rationale: Der seltene Ausdruck נפת bezeichnet hier wahrscheinlich eine geografische oder administrative Gebietseinheit. „Bezirke“ gibt diesen Sinn wieder, ohne eine rein topografische Deutung festzulegen.
