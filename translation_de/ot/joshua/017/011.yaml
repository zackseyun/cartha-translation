  register: 'Modernes, würdiges Standarddeutsch. Die ungewöhnliche Aufzählung des Hebräischen bleibt erhalten: Bet-Schean und Jibleam werden als Orte genannt, bei Dor, En-Dor, Taanach und Megiddo ausdrücklich deren Einwohner. Ortsnamen folgen geläufigen deutschen Umschriften.'
