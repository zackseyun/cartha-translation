source:
  edition: WLC
  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: de
  text: Dann verlief die Grenze zum Bach Kana[a] hinab, südlich des Baches. Diese Städte gehörten Ephraim und lagen innerhalb der Städte Manasses[b]. Die Grenze Manasses verlief nördlich des Baches und endete am Meer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kana-Wadi“. Das hebräische Wort kann einen Bach, ein saisonal trockenes Bachbett oder eine Talrinne bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Ephraim besaß Städte innerhalb des Manasse zugeteilten Gebiets.'
    reason: cultural_note
  - marker: c
    text: Mit dem „Meer“ ist hier das Mittelmeer gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Dann verlief die Grenze hinab
  rationale: ירד bezeichnet in Grenzbeschreibungen ein Hinabführen der Grenzlinie; „verlief ... hinab“ ist im Deutschen natürlich und bewahrt die räumliche Bewegung.
- source_word: נַחַל קָנָה
  choice: Kana-Bach
  rationale: נחל kann Bach, Wasserlauf, Talrinne oder saisonales Wadi bedeuten. „Kana-Bach“ ist gut verständlich; die größere Bedeutungsbreite wird in der Fußnote genannt.
- source_word: נֶגְבָּה לַנַּחַל
  choice: südlich des Baches
  rationale: Die Wendung lokalisiert den Grenzverlauf auf der Südseite des Wasserlaufs. Diese Wiedergabe vermeidet die missverständliche Deutung als Bewegung auf den Bach zu.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: Diese Städte gehörten Ephraim, obwohl sie mitten unter den Städten Manasses lagen
  rationale: Die verblosen Wendungen drücken Zugehörigkeit und räumliche Einlagerung aus. „Obwohl“ macht den im Hebräischen knappen Gegensatz verständlich, ohne die territoriale Aussage zu verändern.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: Die Grenze Manasses verlief nördlich des Baches
  rationale: מִצְּפוֹן bezeichnet hier die Nordseite des Wasserlaufs; die deutsche Formulierung ist präzise und idiomatisch.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: und endete am Meer
  rationale: תֹצְאֹתָיו bezeichnet in Grenzformeln den End- oder Austrittspunkt. „endete am Meer“ gibt die Funktion der Wendung natürlich wieder.
