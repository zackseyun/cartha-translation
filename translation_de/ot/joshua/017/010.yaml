  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: de
  text: Der Süden gehörte Ephraim, der Norden Manasse; das Meer bildete seine Grenze. Im Norden stießen sie an Ascher[a] und im Osten an Issachar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Im Norden grenzten sie an Ascher und im Osten an Issachar.“ Das hebräische Verb kann in Gebietsbeschreibungen „zusammentreffen“, „anstoßen“ oder „angrenzen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם וְצָפוֹנָה לִמְנַשֶּׁה
  choice: Nach Süden gehörte es Ephraim und nach Norden Manasse
  rationale: Die Richtungsformen bezeichnen die jeweilige Seite; die Präposition ל markiert hier die territoriale Zuordnung. Das im Hebräischen elliptische Prädikat wird zur Verständlichkeit einmal ergänzt.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: das Meer bildete seine Grenze
  rationale: Natürliche deutsche Wiedergabe der Aussage, dass das Meer die westliche Begrenzung des Gebietes war; das Possessivpronomen wahrt den maskulinen Singular des hebräischen Suffixes, ohne dessen Bezug ausdrücklich festzulegen.
- source_word: יִפְגְּעוּן
  choice: stießen sie an
  rationale: פגע bezeichnet in Grenzbeschreibungen das Zusammentreffen oder Angrenzen von Gebieten. „an etwas stoßen“ ist im Deutschen idiomatisch und bewahrt das Bild des hebräischen Verbs.
- source_word: מִצָּפוֹן ... מִמִּזְרָח
  choice: im Norden ... im Osten
  rationale: Die Präposition מִן kennzeichnet in dieser Grenzformel die Seite, an der die Gebiete aneinandergrenzen; die lokale Wiedergabe ist im Deutschen klar und natürlich.
- source_word: וּבְיִשָּׂשכָר
  choice: und im Osten an Issachar
  rationale: Das Verb aus dem vorangehenden Satzglied gilt elliptisch weiter und wird im Deutschen durch die gemeinsame Konstruktion „stießen sie … an“ verständlich.
