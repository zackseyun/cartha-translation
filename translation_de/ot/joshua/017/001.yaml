  naturalness: Die erste Aussage ist idiomatisch. Im zweiten Satz kollidiert der nominativische Name „Machir“ mit den folgenden Dativappositionen und mit „fielen ... zu“. Eine Satzperiode mit Doppelpunkt und „gehörten“ ist im modernen Standarddeutsch klar, würdevoll und nahe an der hebräischen Besitz-/Zuteilungsaussage.
  terminology: Manasse, Machir, Gilead und Baschan entsprechen den etablierten deutschen biblischen Namensformen. „Krieger“ ist gegenüber dem heute wenig geläufigen „Kriegsmann“ die natürlichere Wiedergabe von איש מלחמה, ohne den Sinn einzuengen. Die Fußnote bewahrt sachgerecht die semantische Weite von אָב.
