  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: de
  text: 'Das Los fiel dem Stamm Manasse zu, denn er war Josefs Erstgeborener: Machir, dem Erstgeborenen Manasses, dem Vater Gileads[a], gehörten Gilead und Baschan, denn er war ein Krieger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stammvater Gileads“ beziehungsweise „Gründer Gileads“. Das hebräische „Vater von“ kann einen Vorfahren oder Gründer bezeichnen, nicht nur den unmittelbaren leiblichen Vater.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: Das Los fiel … zu
  rationale: Die deutsche Wendung gibt in diesem Zusammenhang natürlich das Ergebnis der Losverteilung und damit die Gebietszuteilung wieder.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: dem Stamm Manasse
  rationale: מַטֶּה bezeichnet hier die Stammesgemeinschaft und nicht einen wörtlichen Stab.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: denn er war Josefs Erstgeborener
  rationale: כִּי ist begründend; das Pronomen bleibt wie im Hebräischen erhalten und bezieht sich auf Manasse.
- source_word: לְמָכִיר בְּכוֹר מְנַשֶּׁה
  choice: Machir, dem Erstgeborenen Manasses
  rationale: Der Dativ bewahrt den Zuteilungssinn von לְ und gibt die genealogische Bezeichnung knapp wieder.
- source_word: אֲבִי הַגִּלְעָד
  choice: Vater Gileads
  rationale: Die hebräische Vaterbezeichnung bleibt im Haupttext erhalten; ihr möglicher weiterer Sinn als Stammvater oder Gründer wird in der Fußnote erläutert.
- source_word: אִישׁ מִלְחָמָה
  choice: ein Kriegsmann
  rationale: Die formelle, aber verständliche Wendung bewahrt das hebräische Bild eines militärisch erfahrenen Mannes.
- source_word: וַיְהִי לוֹ הַגִּלְעָד וְהַבָּשָׁן
  choice: fielen Gilead und Baschan zu
  rationale: Die Formulierung drückt in idiomatischem Deutsch den durch die Verteilung begründeten Besitz aus.
theological_decisions:
- issue: Bezug des Pronomens in כִּי הוּא הָיָה אִישׁ מִלְחָמָה
  choice: „denn er war ein Kriegsmann“
  alternative: „denn Machir war ein Kriegsmann“
  rationale: Das Pronomen wird nicht durch einen Eigennamen ersetzt; so bleibt die Ausdrucksweise des hebräischen Textes und ihre syntaktische Spannung gewahrt, auch wenn Machir der naheliegende Bezug ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze entlastet die lange hebräische Satzperiode, ohne ihre Begründungsstruktur zu verändern. Eigennamen folgen den im Deutschen etablierten biblischen Formen Manasse, Machir, Gilead und Baschan.
