  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל בֵּ֣ית יוֹסֵ֔ף לְ/אֶפְרַ֥יִם וְ/לִ/מְנַשֶּׁ֖ה לֵ/אמֹ֑ר עַם רַ֣ב אַתָּ֗ה וְ/כֹ֤חַ גָּדוֹל֙ לָ֔/ךְ לֹֽא יִהְיֶ֥ה לְ/ךָ֖ גּוֹרָ֥ל אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: de
  text: 'Josua sagte zum Haus Josef – zu Efraim und Manasse: »Ihr seid ein zahlreiches Volk[a] und habt große Kraft. Ihr werdet nicht nur ein einziges Erbteil[b] haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein großes Volk«. Die hebräische Wendung kann sowohl zahlenmäßige Größe als auch allgemeine Größe bezeichnen; im Zusammenhang der Landzuteilung liegt »zahlreich« näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Los«. Gemeint ist hier ein Erbbesitz, der durch das Los zugeteilt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: Haus Josef
  rationale: Bewahrt die familiär-stammesbezogene hebräische Wendung; Efraim und Manasse erläutern unmittelbar, wer damit gemeint ist.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: zu Efraim und Manasse
  rationale: Gibt die beiden Adressaten ausdrücklich wieder und stellt sie durch den Gedankenstrich als nähere Bestimmung des Hauses Josef dar.
- source_word: עַם רַב
  choice: ein zahlreiches Volk
  rationale: Im Zusammenhang der Landzuteilung liegt der Schwerpunkt wahrscheinlich auf der großen Bevölkerungszahl; die mögliche Bedeutung »großes Volk« bleibt in einer Fußnote erhalten.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: und habt große Kraft
  rationale: Gibt sowohl den Besitzbezug von לָךְ als auch die beträchtliche Stärke beziehungsweise Leistungsfähigkeit des Hauses Josef knapp und natürlich wieder.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: Deshalb sollt ihr nicht nur ein einziges Erbteil haben
  rationale: גּוֹרָל bezeichnet hier den durch Los zugeteilten Erbbesitz. »Nicht nur ein einziges« verdeutlicht die im Kontext gemeinte Beschränkung; »deshalb« macht den folgernden Zusammenhang idiomatisch sichtbar.
- source_word: לֵאמֹר
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Redeeinleiter wird im Deutschen bereits durch »sagte« und die direkte Rede natürlich ausgedrückt; ein zusätzliches »folgendermaßen« wäre unnötig schwerfällig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Stammesbezeichnung »Haus Josef« bleibt erhalten. Die direkte Rede verwendet wegen des kollektiv angesprochenen Hauses Josef den Plural; »Erbteil« macht den Land- und Erbschaftskontext verständlich, während die Fußnote das konkrete Losverfahren bewahrt.
