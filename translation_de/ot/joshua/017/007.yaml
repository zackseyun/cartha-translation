source:
  edition: WLC
  text: וַ/יְהִ֤י גְבוּל מְנַשֶּׁה֙ מֵֽ/אָשֵׁ֔ר הַֽ/מִּכְמְתָ֔ת אֲשֶׁ֖ר עַל פְּנֵ֣י שְׁכֶ֑ם וְ/הָלַ֤ךְ הַ/גְּבוּל֙ אֶל הַ/יָּמִ֔ין אֶל יֹשְׁבֵ֖י עֵ֥ין תַּפּֽוּחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: de
  text: Die Grenze Manasses verlief von Ascher nach Michmetat, das gegenüber von Sichem liegt[a]. Dann führte die Grenze nach rechts[b] zu den Bewohnern von En-Tappuach[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das vor Sichem liegt« beziehungsweise »das Sichem gegenüberliegt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zur Rechten«; in Grenzbeschreibungen kann damit die südliche Richtung gemeint sein.'
    reason: lexical_alternative
  - marker: c
    text: En-Tappuach bedeutet »Quelle von Tappuach«.
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: Grenze
  rationale: Im Zusammenhang der Landzuteilung bezeichnet das Wort die Grenzlinie des Stammesgebiets; »Grenze« passt an beiden Stellen natürlich.
- source_word: מֵאָשֵׁר
  choice: von Ascher
  rationale: Die Präposition bezeichnet hier den Ausgangspunkt der Grenzbeschreibung; Ascher ist als geografischer Bezugspunkt zu verstehen.
- source_word: הַמִּכְמְתָת
  choice: Michmetat
  rationale: Der Ortsname wird nach deutscher Bibelnamenkonvention transkribiert und nicht übersetzt.
- source_word: אֲשֶׁר עַל פְּנֵי שְׁכֶם
  choice: das gegenüber von Sichem liegt
  rationale: Die Formulierung gibt die räumliche Beziehung wieder, ohne eine nicht ausdrücklich genannte Himmelsrichtung festzulegen.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: Dann führte die Grenze
  rationale: הלך beschreibt in Grenzangaben idiomatisch den Verlauf einer Grenzlinie; »führte« ist im Deutschen natürlich und sachgerecht.
- source_word: אֶל הַיָּמִין
  choice: nach rechts
  rationale: Die Übersetzung bewahrt die wörtliche Richtungsangabe des Hebräischen; eine mögliche Deutung als »nach Süden« wird in der Fußnote genannt.
- source_word: יֹשְׁבֵי
  choice: die Bewohner von
  rationale: Das substantivierte Partizip bezeichnet die an diesem Ort wohnenden Menschen; »Bewohner« ist klar und dem Register angemessen.
- source_word: עֵין תַּפּוּחַ
  choice: En-Tappuach
  rationale: Der zusammengesetzte Ortsname wird transkribiert; seine wörtliche Bedeutung wird in einer Fußnote erklärt.
theological_decisions: []
