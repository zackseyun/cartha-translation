source:
  edition: WLC
  text: לִ/מְנַשֶּׁ֕ה הָיְתָ֖ה אֶ֣רֶץ תַּפּ֑וּחַ וְ/תַפּ֛וּחַ אֶל גְּב֥וּל מְנַשֶּׁ֖ה לִ/בְנֵ֥י אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: de
  text: Das Land von Tappuach gehörte Manasse[a]; Tappuach an der Grenze Manasses aber gehörte den Söhnen Ephraims.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Für Manasse war das Land von Tappuach; Tappuach aber, an der Grenze Manasses, gehörte den Söhnen Ephraims.«'
    reason: Die Fußnote bewahrt die formalere Satzstruktur und weist darauf hin, dass „gehörte“ im ersten Satzteil die possessive Bedeutung der hebräischen Konstruktion natürlich wiedergibt.
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: gehörte Manasse
  rationale: Die Verbindung aus ל und היה drückt hier im Zusammenhang der Landverteilung Zugehörigkeit beziehungsweise Zuteilung aus. „Gehörte Manasse“ ist im Deutschen natürlicher als das formale „war für Manasse“.
- source_word: אֶרֶץ תַּפּוּחַ
  choice: das Land von Tappuach
  rationale: אֶרֶץ bezeichnet hier das zu Tappuach gehörende Umland beziehungsweise Gebiet. „Land von Tappuach“ wahrt die Unterscheidung zur anschließend genannten Ortschaft.
- source_word: תַּפּוּחַ
  choice: Tappuach
  rationale: Der Ortsname wird transliteriert; „Tappuach“ gibt die hebräische Lautgestalt in einer im Deutschen gut lesbaren Form wieder.
- source_word: וְתַפּוּחַ
  choice: die Stadt Tappuach … aber
  rationale: Das ו verbindet hier zwei kontrastierende Besitzangaben. „Aber“ macht diesen Gegensatz im Deutschen deutlich. „Stadt“ ist aus dem Gegensatz zwischen dem Land und Tappuach als bewohntem Ort erschlossen.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: an der Grenze Manasses
  rationale: אֶל hat in dieser Grenzbeschreibung lokale Bedeutung. „An der Grenze“ ist eine natürliche deutsche Wiedergabe.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: gehörte den Söhnen Ephraims
  rationale: Die possessive beziehungsweise zuteilende Kraft von ל wird mit „gehörte“ ausgedrückt. „Söhne Ephraims“ bewahrt die hebräische Verwandtschafts- und Stammesbezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ergänzte Bezeichnung „Stadt“ verdeutlicht den im Kontext vorausgesetzten Gegensatz zwischen dem Umland von Tappuach und dem Ort Tappuach; die Fußnote bietet eine formalere Wiedergabe ohne diese Ergänzung.
