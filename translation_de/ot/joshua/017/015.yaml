  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יְהוֹשֻׁ֗עַ אִם עַם רַ֤ב אַתָּה֙ עֲלֵ֣ה לְ/ךָ֣ הַ/יַּ֔עְרָ/ה וּ/בֵרֵאתָ֤ לְ/ךָ֙ שָׁ֔ם בְּ/אֶ֥רֶץ הַ/פְּרִזִּ֖י וְ/הָֽ/רְפָאִ֑ים כִּֽי אָ֥ץ לְ/ךָ֖ הַר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: de
  text: 'Josua sagte zu ihnen: „Wenn ihr ein zahlreiches Volk seid, dann zieht hinauf in das Waldgebiet und rodet euch dort Land, im Land der Perisiter und der Refaïm[a]; denn das Bergland Ephraims[b] ist zu eng für euch.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Refaïm“ ist die überlieferte Bezeichnung einer Bevölkerungsgruppe; sie wird hier nicht deutend übersetzt.
    reason: name_clarification
  - marker: b
    text: 'Auch möglich: „das Gebirge Ephraims“. Gemeint ist die Ephraim zugeteilte Bergregion, nicht unbedingt ein einzelner Berg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: ein zahlreiches Volk
  rationale: Die Wendung bezeichnet hier die zahlenmäßige Größe des Volkes. „Ein zahlreiches Volk“ gibt dies in natürlichem, modernem Deutsch wieder.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: zieht in den Wald hinauf
  rationale: עלה bezeichnet die Bewegung hinauf beziehungsweise in das höher gelegene Waldgebiet. Der Nutzen für die Angesprochenen wird im folgenden „euch“ ausgedrückt.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: rodet euch dort Land
  rationale: ברא bezeichnet im Piel das Roden bewaldeten Landes. „Land“ ist als im Hebräischen vorausgesetztes Objekt ergänzt und macht die Aussage idiomatisch verständlich.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: im Gebiet der Perisiter und der Refaïm
  rationale: „Gebiet“ entspricht dem territorialen Sinn von אֶרֶץ. Beide Gruppenbezeichnungen werden transliteriert; besonders רְפָאִים wird nicht durch eine deutende Bezeichnung ersetzt.
- source_word: כִּי אָץ לְךָ
  choice: denn ... ist zu eng für euch
  rationale: Die Formulierung drückt räumliche Enge oder Bedrängtheit aus. Im Zusammenhang ist das vorhandene Gebiet für die große Bevölkerung nicht ausreichend.
- source_word: הַר אֶפְרָיִם
  choice: das Bergland Ephraims
  rationale: הַר bezeichnet in territorialen Zusammenhängen häufig eine Berg- oder Hügellandschaft und nicht einen einzelnen Berg.
theological_decisions:
- issue: Wechsel zwischen pluralischem Adressaten und grammatischem Singular im Hebräischen
  choice: 'Pluralische Anrede: „ihr“, „zieht“, „euch“'
  alternative: 'Singularische Kollektivanrede: „du“, „zieh“, „dir“'
  rationale: Josua spricht zu mehreren Personen („zu ihnen“), während das Hebräische sie anschließend als das eine kollektive „Volk“ im Singular anredet. Im Deutschen wäre der unvermittelte Wechsel missverständlich; der Plural bewahrt den gemeinten Adressatenbezug, während „ein ... Volk“ die kollektive Vorstellung erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und knapp gehalten. Die hebräische kollektive Singularanrede wird wegen des pluralischen Gesprächspartners idiomatisch im Plural wiedergegeben; Eigennamen und ethnische Bezeichnungen bleiben erkennbar.
