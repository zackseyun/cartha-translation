revisions:
- from: 'Josua sagte zu ihnen: „Wenn ihr ein zahlreiches Volk seid, dann zieht in den Wald hinauf und rodet euch dort Land[a], im Gebiet der Perisiter und der Refaïm[b]; denn das Bergland Ephraims[c] ist zu eng für euch.“'
  to: 'Josua sagte zu ihnen: „Wenn ihr ein zahlreiches Volk seid, dann zieht hinauf in das Waldgebiet und rodet euch dort Land, im Land der Perisiter und der Refaïm[a]; denn das Bergland Ephraims[b] ist zu eng für euch.“'
  rationale: 'Die Übersetzung wird nur leicht geglättet: Die Ortsangabe wird syntaktisch enger mit dem Roden verbunden, und die problematische Fußnote zum impliziten Objekt wird entfernt. Die übrigen Fußnoten bleiben inhaltlich erhalten, wobei ihre Marker an die revidierte Textsetzung angepasst sind.'
