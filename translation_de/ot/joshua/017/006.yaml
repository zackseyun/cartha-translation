  text: כִּ֚י בְּנ֣וֹת מְנַשֶּׁ֔ה נָחֲל֥וּ נַחֲלָ֖ה בְּ/ת֣וֹךְ בָּנָ֑י/ו וְ/אֶ֨רֶץ֙ הַ/גִּלְעָ֔ד הָיְתָ֥ה לִ/בְנֵֽי מְנַשֶּׁ֖ה הַ/נּֽוֹתָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: de
  text: Denn die Töchter Manasses erhielten ein Erbteil unter seinen Söhnen,[a] und das Land Gilead gehörte den übrigen Söhnen Manasses.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »erbten ein Erbteil unter seinen Söhnen«; der hebräische Text stellt die Töchter ausdrücklich den Söhnen gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und das Land Gilead war für die übrigen Söhne Manasses bestimmt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung der vorausgehenden Landverteilung ein und gibt den hebräischen Zusammenhang natürlich wieder.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: die Töchter Manasses
  rationale: Gibt die Genitivverbindung direkt wieder; »Töchter« bleibt ausdrücklich stehen, weil der Vers sie den Söhnen gegenüberstellt.
- source_word: נָחֲלוּ נַחֲלָה
  choice: erhielten ein Erbteil
  rationale: Die verwandten Verb- und Substantivformen bezeichnen den Empfang erblichen Landbesitzes. Die deutsche Formulierung ist idiomatisch und bewahrt den rechtlichen Zuteilungssinn.
- source_word: בְּתוֹךְ בָּנָיו
  choice: unter seinen Söhnen
  rationale: Bewahrt sowohl die Bedeutung »unter/inmitten von« als auch die ausdrücklich maskuline Bezeichnung; das Pronomen bezieht sich am natürlichsten auf Manasse.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: und das Land Gilead
  rationale: Eine natürliche und im Deutschen übliche Wiedergabe des Gebietsnamens.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: gehörte den übrigen Söhnen Manasses
  rationale: Gibt die hebräische Besitz- beziehungsweise Zuteilungskonstruktion verständlich wieder; »übrigen« bezeichnet die anderen Erben im Gegensatz zu den zuvor genannten Töchtern.
theological_decisions: []
