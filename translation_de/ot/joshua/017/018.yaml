  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: de
  text: Doch das Bergland soll dir gehören[a]; denn es ist Waldland, und du sollst es roden. Auch seine äußersten Gebiete sollen dir gehören[b]. Denn du wirst die Kanaaniter vertreiben[c], auch wenn sie eiserne Streitwagen haben und stark sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Berg“. Das hebräische Wort kann einen einzelnen Berg oder ein Berg- beziehungsweise Hügelland bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine äußersten Grenzen“, „seine Ausläufer“ oder „seine Randgebiete“. Gemeint ist die gesamte Ausdehnung des bewaldeten Berglands bis in seine äußersten Teile.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht wörtlich der Singular „der Kanaaniter … er ist stark“, der hier kollektiv die Volksgruppe bezeichnet.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: das Bergland
  rationale: Im Zusammenhang der Landzuteilung bezeichnet הַר wahrscheinlich nicht einen einzelnen Berg, sondern die höher gelegene Landschaft.
- source_word: יִהְיֶה לָּךְ
  choice: soll dir gehören
  rationale: Die Verbindung היה + ל drückt Besitz oder Zuweisung aus; die deutsche Formulierung gibt beides natürlich wieder.
- source_word: יַעַר
  choice: Waldland
  rationale: Der Ausdruck bezeichnet bewaldetes Gelände; „Waldland“ passt hier zum territorialen Zusammenhang.
- source_word: וּבֵרֵאתוֹ
  choice: du sollst es roden
  rationale: Das Piel von ברא bezeichnet hier das Freimachen bewaldeten Landes. „Roden“ ist präzise und idiomatisch.
- source_word: תֹּצְאֹתָיו
  choice: seine äußersten Grenzen
  rationale: Das Wort kann die äußersten Teile, Ausläufer oder Grenzen eines Gebiets bezeichnen; die Übersetzung bewahrt den räumlichen Sinn.
- source_word: תוֹרִישׁ
  choice: du wirst ... vertreiben
  rationale: Das Hifil von ירש bedeutet, andere ihres Besitzes zu entheben beziehungsweise sie daraus zu vertreiben. Im militärischen Kontext ist „vertreiben“ klar und natürlich.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Der morphologische Singular wird kollektiv für die Volksgruppe gebraucht und daher im Deutschen idiomatisch als Plural wiedergegeben.
- source_word: רֶכֶב בַּרְזֶל
  choice: eiserne Streitwagen
  rationale: Die Wendung bezeichnet mit Eisen ausgestattete Wagen; „Streitwagen“ macht ihre militärische Funktion deutlich.
- source_word: חָזָק הוּא
  choice: sie ... stark sind
  rationale: Die Singularformen beziehen sich kollektiv auf die Kanaaniter; der deutsche Plural folgt diesem Bezug.
- source_word: כִּי
  choice: doch / denn / auch wenn
  rationale: Das mehrfach verwendete כִּי erfüllt je nach Zusammenhang unterschiedliche Funktionen. Die variierende Wiedergabe bildet den argumentativen Verlauf natürlich ab.
theological_decisions:
- issue: Kollektiver Singular bei der kanaanitischen Bevölkerung
  choice: 'Pluralisch: „die Kanaaniter … sie … sind“'
  alternative: 'Formal singularisch: „der Kanaaniter … er … ist“'
  rationale: Der hebräische Volksname im Singular ist kollektiv gemeint. Der deutsche Plural verdeutlicht den Bezug, ohne die Aussage theologisch zu verändern.
- issue: Verhältnis der eisernen Streitwagen zur Verheißung der Vertreibung
  choice: 'Konzessiv: „auch wenn sie eiserne Streitwagen haben und stark sind“'
  alternative: 'Kausal: „denn sie haben eiserne Streitwagen und sind stark“'
  rationale: Im Kontext sind Stärke und Bewaffnung der Kanaaniter ein Hindernis, das die zugesagte Vertreibung nicht verhindert. Die konzessive Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bergland“, „Waldland“ und „roden“ halten den territorialen und landwirtschaftlichen Zusammenhang klar. Die Satzgliederung vermeidet einen überladenen deutschen Satz und bewahrt zugleich die wiederholte Begründungs- und Gegensatzstruktur des Hebräischen.
