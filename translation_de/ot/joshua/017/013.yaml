  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: de
  text: Und es geschah, als die Israeliten[a] stark geworden waren, da zwangen sie die Kanaaniter zur Fronarbeit[b]; aber sie vertrieben sie nicht vollständig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unterwarfen die Kanaaniter einer Arbeitspflicht« beziehungsweise »legten den Kanaanitern Tribut auf«.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische verstärkt das Verb: Sie vertrieben sie nicht vollständig bzw. nicht völlig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Und es geschah, als
  rationale: Die hebräische Erzählungsform führt eine neue Entwicklung ein; die Verbindung mit כִּי bezeichnet hier den zeitlichen Umstand. Die Formulierung ist quellentreu, ohne altertümlich zu wirken.
- source_word: חָזְקוּ
  choice: stark geworden waren
  rationale: חזק bezeichnet hier das Erstarken beziehungsweise den Machtzuwachs Israels. Das Plusquamperfekt fügt sich natürlich in den deutschen Als-Satz ein.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht »die Söhne Israels«. Als feste Volksbezeichnung ist »die Israeliten« im modernen Deutschen natürlicher; die wörtliche Form wird in einer Fußnote bewahrt.
- source_word: וַיִּתְּנוּ אֶת הַכְּנַעֲנִי לָמַס
  choice: da zwangen sie die Kanaaniter zur Fronarbeit
  rationale: מַס bezeichnet in diesem Zusammenhang auferlegte Pflicht- oder Zwangsarbeit, möglicherweise einschließlich Abgaben. »Fronarbeit« gibt die institutionalisierte, erzwungene Dienstleistung knapp und verständlich wieder. Der kollektive Singular »der Kanaaniter« wird im Deutschen als Plural wiedergegeben.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: aber sie vertrieben sie keineswegs vollständig
  rationale: Der Infinitivus absolutus zusammen mit der finiten Verbform verstärkt die Aussage. ירש bedeutet in diesem Eroberungskontext »vertreiben« beziehungsweise »aus dem Besitz verdrängen«; das maskuline Singularsuffix bezieht sich auf das kanaanitische Kollektiv und wird daher pluralisch wiedergegeben.
theological_decisions:
- issue: Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist eine konventionelle Bezeichnung des Volkes. Die idiomatische Übersetzung vermeidet im modernen Deutschen den irreführenden Eindruck, ausschließlich unmittelbare männliche Nachkommen seien gemeint, während die Fußnote die formale Gestalt offenlegt.
- issue: Bedeutung von מַס
  choice: Fronarbeit
  alternative: Tribut / Abgabenpflicht
  rationale: Der Kontext schildert die Unterwerfung der verbliebenen kanaanitischen Bevölkerung. »Fronarbeit« wahrt den Zwangscharakter, ohne die mögliche weitere Bedeutung »Tribut« zu verschweigen.
- issue: Verstärkung in הוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: keineswegs vollständig vertrieben
  alternative: nicht vertrieben / nicht aus ihrem Besitz verdrängt
  rationale: Die hebräische Verbverdopplung ist emphatisch. Die Übersetzung bewahrt sowohl die Verneinung als auch die nachdrückliche Aussage, ohne daraus eine über den Satz hinausgehende theologische Folgerung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Erzählungsstil bleibt erkennbar, während »Israeliten« und »Fronarbeit« eine natürliche, allgemein verständliche Wiedergabe bieten. Das Semikolon verdeutlicht den Gegensatz zwischen Unterwerfung und ausbleibender vollständiger Vertreibung.
