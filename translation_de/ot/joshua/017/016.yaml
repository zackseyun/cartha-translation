  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die geografische Gegenüberstellung von Bergland und Talgebiet bleibt erhalten. Der Gedankenstrich verdeutlicht die nachfolgende Aufgliederung, ohne den Satzinhalt zu verändern.
