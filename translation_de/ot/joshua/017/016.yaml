base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: de
  text: 'Da sagten die Nachkommen Josefs: „Das Bergland reicht für uns nicht aus. Und alle Kanaaniter, die im Talgebiet wohnen, haben eiserne Streitwagen[a] – sowohl die in Bet-Schean und den dazugehörigen Ortschaften[b] als auch die im Tal Jesreel.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Streitwagen aus Eisen«; die genaue Art ihrer eisernen Ausführung wird nicht näher bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ihren Töchtern«; gemeint sind kleinere, von Bet-Schean abhängige Siedlungen.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: die Nachkommen Josefs
  rationale: Wörtlich »Söhne Josefs«; gemeint sind hier die zu Josef gehörenden Stämme. »Nachkommen Josefs« ist im Deutschen natürlich und schließt den kollektiven Sinn ein.
- source_word: הָהָר
  choice: das Bergland
  rationale: Der Ausdruck bezeichnet hier die höher gelegene Landschaft im Gegensatz zum folgenden Talgebiet, nicht lediglich einen einzelnen Berg.
- source_word: לֹא יִמָּצֵא לָנוּ
  choice: reicht für uns nicht aus
  rationale: Die wörtliche Formulierung »wird für uns nicht gefunden« bezeichnet im Kontext mangelnde Verfügbarkeit beziehungsweise unzureichenden Raum. Die Übersetzung gibt den kontextuellen Sinn wieder, ohne einen zusätzlichen Grund einzutragen.
- source_word: רֶכֶב בַּרְזֶל
  choice: eiserne Streitwagen
  rationale: Die hebräische Genitivverbindung lautet wörtlich »Wagen aus Eisen«. »Eiserne Streitwagen« ist eine natürliche deutsche Wiedergabe und lässt offen, in welchem Umfang die Wagen aus Eisen bestanden oder mit Eisen ausgestattet waren.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: alle Kanaaniter, die … wohnen
  rationale: Das morphologisch singularische Volkswort ist kollektiv gebraucht; daher ist im Deutschen der Plural angemessen.
- source_word: אֶרֶץ הָעֵמֶק
  choice: das Talgebiet
  rationale: Der Ausdruck bezeichnet das tiefer gelegene Land im Gegensatz zum Bergland. »Talgebiet« wahrt diese geografische Gegenüberstellung.
- source_word: בֵּית שְׁאָן
  choice: Bet-Schean
  rationale: Die Form folgt einer im Deutschen verständlichen, hebräisch nahen Umschrift des Ortsnamens.
- source_word: וּבְנוֹתֶיהָ
  choice: den dazugehörigen Ortschaften
  rationale: Wörtlich »ihren Töchtern«; damit sind abhängige kleinere Siedlungen im Umfeld der Stadt gemeint. Die Übersetzung gibt den idiomatischen Sinn unmittelbar wieder.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: das Tal Jesreel
  rationale: Die geografische Genitivverbindung wird knapp und verständlich wiedergegeben.
theological_decisions: []
