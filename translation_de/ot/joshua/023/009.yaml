  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: de
  text: Und Jahwe hat große und mächtige Völker vor euch vertrieben[a]. Euch hat bis zum heutigen Tag niemand standgehalten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat … enteignet“ oder „hat … aus eurem Gebiet verdrängt“. Das hebräische Verb kann hervorheben, dass Völker aus dem Land entfernt werden, damit Israel es in Besitz nimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Kein Mann stand vor euch.“ Gemeint ist, dass niemand euch widerstehen konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: hat … vertrieben
  rationale: Das Hifil von ירשׁ bezeichnet hier das Entfernen beziehungsweise Enteignen der Völker, sodass Israel ihr Land in Besitz nehmen kann. „Vertrieben“ ist im Deutschen natürlich und bewahrt den Zusammenhang von Landnahme und militärischer Verdrängung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die Präpositionalkonstruktion bezeichnet in diesem Eroberungskontext, dass die Völker aus Israels Weg beziehungsweise Gegenwart entfernt wurden. „Vor euch“ erhält das Bild des Ausgangstextes.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: große und mächtige Völker
  rationale: „Groß“ gibt Größe und Bedeutung wieder, „mächtig“ ihre erhebliche Stärke. Die Verbindung ist würdig und im modernen Deutsch gut verständlich.
- source_word: וְאַתֶּם
  choice: Ihr aber – euch
  rationale: Das ausdrücklich gesetzte Pronomen ist hervorgehoben und kontrastiert Israel mit den zuvor genannten Völkern. Die Wiederaufnahme durch „euch“ bildet diese Betonung im Deutschen ab.
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: euch konnte … niemand standhalten
  rationale: Wörtlich steht dort, dass kein Mann vor ihnen stand. Im militärischen Zusammenhang bedeutet die Wendung, dass niemand ihnen erfolgreich widerstehen konnte. „Standhalten“ gibt dieses Idiom natürlich wieder.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Die geläufige deutsche Wendung drückt aus, dass dieser Zustand bis zum Zeitpunkt der Rede fortbestand.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Namen. „Jahwe“ bewahrt diesen Eigennamecharakter, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hervorgehobene Gegenüberstellung durch וְאַתֶּם wird mit „Ihr aber – euch“ bewahrt; das hebräische Kampfidiom wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich erläutert.
