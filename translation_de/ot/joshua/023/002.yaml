  text: וַ/יִּקְרָ֤א יְהוֹשֻׁ֨עַ֙ לְ/כָל יִשְׂרָאֵ֔ל לִ/זְקֵנָי/ו֙ וּ/לְ/רָאשָׁ֔י/ו וּ/לְ/שֹׁפְטָ֖י/ו וּ/לְ/שֹֽׁטְרָ֑י/ו וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אֲנִ֣י זָקַ֔נְתִּי בָּ֖אתִי בַּ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: de
  text: 'Da rief Josua ganz Israel zusammen – die Ältesten, Oberhäupter, Richter und Amtleute Israels – und sagte zu ihnen: »Ich bin alt und in die Jahre gekommen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich bin alt geworden; ich bin in die Tage gekommen.« Die zweite Wendung ist ein hebräischer Ausdruck für fortgeschrittenes Alter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְכָל יִשְׂרָאֵל
  choice: Da rief Josua ganz Israel zusammen
  rationale: קרא mit לְ bezeichnet hier das Zusammenrufen beziehungsweise Einberufen. „Zusammenrufen“ gibt dies im Deutschen natürlich wieder und lässt „ganz Israel“ als ausdrückliche Kollektivbezeichnung stehen.
- source_word: לִזְקֵנָיו
  choice: seine Ältesten
  rationale: Das Suffix bezieht sich auf Israel als kollektive Größe. Im Deutschen ist „seine“ bei dem Eigennamen Israel grammatisch und idiomatisch angemessen.
- source_word: וּלְרָאשָׁיו
  choice: seine Oberhäupter
  rationale: „Oberhäupter“ bewahrt das Bild von רֹאשׁ und bezeichnet zugleich verständlich führende Männer, ohne diese Gruppe mit den übrigen Ämtern gleichzusetzen.
- source_word: וּלְשֹׁפְטָיו
  choice: seine Richter
  rationale: In dieser Aufzählung von Leitungsämtern bezeichnet שֹׁפְטִים am unmittelbarsten richterliche Amtsträger.
- source_word: וּלְשֹׁטְרָיו
  choice: seine Amtleute
  rationale: שֹׁטְרִים bezeichnet nachgeordnete Verwaltungsbeamte. „Amtleute“ hält sie von Richtern und Oberhäuptern unterscheidbar und passt zum würdevollen historischen Register.
- source_word: אֲנִי זָקַנְתִּי
  choice: Ich bin alt
  rationale: Das Perfekt beschreibt den erreichten Zustand des Altseins; die deutsche Zustandsform ist knapp und natürlich.
- source_word: בָּאתִי בַּיָּמִים
  choice: hochbetagt
  rationale: Die wörtliche Wendung „in die Tage gekommen“ ist ein hebräisches Altersidiom. „Hochbetagt“ gibt dessen Sinn prägnant wieder und ergänzt „Ich bin alt“ ohne schwerfällige Wiederholung.
theological_decisions:
- issue: Bezug von „ganz Israel“ angesichts der folgenden Liste von Amtsträgern
  choice: „ganz Israel“ bleibt stehen; die nachfolgende Liste benennt offenbar die repräsentativen Leitungsträger.
  alternative: Die Aussage zu „alle Führer Israels“ zusammenziehen.
  rationale: Der hebräische Text nennt ausdrücklich ganz Israel und anschließend dessen Älteste, Oberhäupter, Richter und Amtleute. Die Übersetzung bewahrt diese Spannung, statt die kollektive Bezeichnung interpretierend zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Gedankenstriche machen kenntlich, dass die aufgezählten Leitungsträger „ganz Israel“ näher bestimmen. „Amtleute“ ist bewusst etwas gehoben, aber verständlich und gegenüber dem unspezifischen „Beamte“ historisch passender.
