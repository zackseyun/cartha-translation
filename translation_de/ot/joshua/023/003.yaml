  text: וְ/אַתֶּ֣ם רְאִיתֶ֗ם אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לְ/כָל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: de
  text: Ihr selbst habt alles gesehen, was Jahwe, euer Gott, mit all diesen Völkern vor euch[a] getan hat. Denn Jahwe, euer Gott, ist es, der für euch gekämpft hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von eurem Angesicht weg“; gemeint ist, dass die Völker aus Israels Gegenwart vertrieben wurden.'
    reason: Die hebräische Wendung מִפְּנֵיכֶם enthält mit der Präposition מִן ausdrücklich die Vorstellung des Wegbewegens, die das flüssige „vor euch“ allein nicht vollständig erkennen lässt.
lexical_decisions:
- source_word: וְאַתֶּם רְאִיתֶם
  choice: Ihr selbst habt gesehen
  rationale: Das selbstständige Pronomen אַתֶּם trägt Nachdruck; „ihr selbst“ gibt ihn natürlich wieder. Das deutsche Perfekt bezeichnet die abgeschlossene, für die Angeredeten weiterhin bedeutsame Erfahrung. Das einleitende וְ wird im Deutschen nicht eigens wiedergegeben, da der Redezusammenhang auch ohne „und“ klar fortgeführt wird.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: was … getan hat
  rationale: „Was … getan hat“ gibt den umfassenden Gegenstand idiomatisch wieder; im Deutschen enthält das substantivisch gebrauchte „was“ hier bereits den Sinn von „alles, was“.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Jahwe, euer Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; der Ausdruck mit Pluralsuffix lautet „euer Gott“.
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: mit all diesen Völkern
  rationale: Die Präposition לְ bezeichnet hier die von Gottes Handeln betroffenen Völker. „Mit … getan“ ist im Deutschen natürlich und legt die Art des Handelns nicht stärker fest als der hebräische Text.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die knappe Wiedergabe bewahrt das räumliche Bild des hebräischen Ausdrucks; die mit מִן verbundene Vorstellung des Entfernens wird in einer Fußnote erläutert.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet die Begründung beziehungsweise Erklärung der vorhergehenden Aussage ein.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: ist es, der für euch gekämpft hat
  rationale: „Ist es, der“ wahrt die Hervorhebung durch הוּא und die substantivische Partizipialkonstruktion. „Für euch“ gibt den begünstigenden Sinn von לָכֶם wieder; das Perfekt passt zum rückblickenden Zusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ gibt ihn in der im heutigen Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Gottes Rolle im Kampf
  choice: Jahwe … ist es, der für euch gekämpft hat
  alternative: Jahwe … kämpft für euch
  rationale: Die Formulierung erhält sowohl die Hervorhebung Gottes als Handelnden als auch den rückblickenden Bezug der Rede. Sie sagt, dass Gott zugunsten Israels kämpfte, ohne über den Vers hinaus die menschliche Beteiligung am Kampf zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Satzteilung erhöht die Verständlichkeit, ohne den begründenden Zusammenhang zu lösen. Der Gottesname erscheint als „Jahwe“; die militärische Aussage bleibt eng am hebräischen Wortlaut.
