  variant: modern standard German
source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: de
  text: Ein einziger Mann von euch wird tausend verfolgen[a], denn Jahwe[b], euer Gott, ist es, der für euch kämpft, so wie er zu euch geredet hat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tausend nachjagen“.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text hat den Gottesnamen JHWH.
    reason: lexical_alternative
  - marker: c
    text: 'Sinngemäß auch: „so wie er es euch versprochen hat“; wörtlicher: „so wie er zu euch geredet hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: Ein einziger Mann
  rationale: Die maskuline Singularform wird entsprechend dem Hebräischen bewahrt; „ein einziger“ hebt zugleich den Gegensatz zu den tausend hervor.
- source_word: מִכֶּם
  choice: von euch
  rationale: 'Gibt den partitiven Sinn knapp und idiomatisch wieder: ein Mann aus der angesprochenen Gemeinschaft.'
- source_word: יִרְדָּף
  choice: wird … verfolgen
  rationale: רדף bezeichnet das Verfolgen oder Nachsetzen, hier im militärischen Zusammenhang. „Verfolgen“ ist präzise und natürlich.
- source_word: אָלֶף
  choice: tausend
  rationale: Die Zahl wird wörtlich beibehalten; die elliptische Form ohne ausdrücklich genanntes Bezugswort entspricht der pointierten Aussage des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und passt zum gehobenen, aber gegenwärtigen Bibelstil.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Direkte Wiedergabe der Constructusverbindung mit dem Suffix der zweiten Person Plural.
- source_word: הוּא
  choice: ist es, der
  rationale: Macht die Hervorhebung durch das selbstständige Pronomen im Deutschen hörbar, ohne ein zusätzliches „selbst“ einzutragen.
- source_word: הַנִּלְחָם לָכֶם
  choice: der für euch kämpft
  rationale: Das substantivierte Partizip beschreibt Jahwe als den, der zugunsten Israels kämpft; die präsentische Form bewahrt den charakterisierenden Aspekt.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Drückt die Entsprechung zwischen Gottes gegenwärtigem Handeln und seinem früheren Reden natürlich aus.
- source_word: דִּבֶּר לָכֶם
  choice: er zu euch geredet hat
  rationale: Bleibt nahe am gewöhnlichen Sinn von דבר und lässt die im Kontext mögliche Bedeutung einer Zusage offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ eine traditionelle Ersatzlesung darstellt.
- issue: Geschlechtsspezifische Repräsentativsprache in אִישׁ אֶחָד
  choice: Ein einziger Mann
  alternative: Ein Einziger / eine einzige Person
  rationale: Das Hebräische verwendet ausdrücklich das maskuline Substantiv אִישׁ. Die gewählte Fassung wahrt diese Form, ohne auszuschließen, dass der Mann repräsentativ für Israel steht.
- issue: Bedeutung von דִּבֶּר לָכֶם im Kontext einer göttlichen Zusage
  choice: zu euch geredet hat
  alternative: euch versprochen hat
  rationale: „Versprochen“ verdeutlicht den kontextuellen Sinn, legt aber eine Deutung fest, die über die lexikalisch allgemeinere Formulierung „geredet hat“ hinausgeht. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am hebräischen Begründungsgefüge; „ist es, der“ trägt die Hervorhebung von הוּא. Alle erläuterungsbedürftigen Alternativen werden in Fußnoten ausgewiesen, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
