base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: de
  text: Und Jahwe, euer Gott – er selbst – wird sie vor euch vertreiben und sie vor euch aus ihrem Besitz verdrängen; und ihr werdet ihr Land in Besitz nehmen[a], wie Jahwe, euer Gott, zu euch gesprochen hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ihr werdet ihr Land erben.“ Das hebräische Verb kann „erben“ oder „in Besitz nehmen“ bedeuten; hier entspricht „in Besitz nehmen“ dem Zusammenhang der Landnahme.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: „wie Jahwe, euer Gott, es euch versprochen hat“. Im Hebräischen steht wörtlich „wie Jahwe, euer Gott, zu euch gesprochen hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und bewahrt so den Bundesbezug des hebräischen Textes.
- source_word: הוּא
  choice: er selbst
  rationale: Das selbstständige Pronomen ist betont; „er selbst“ erhält den Nachdruck auf Gottes eigenem Handeln.
- source_word: יֶהְדֳּפֵם
  choice: wird sie ... vertreiben
  rationale: Das Verb bezeichnet ein gewaltsames Wegdrängen; „vertreiben“ ist im Zusammenhang der Landnahme natürlich und präzise.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: und sie ... enteignen
  rationale: Der Hifil von ירש bezeichnet hier, dass die bisherigen Bewohner ihren Besitz verlieren. „Enteignen“ wahrt den besitzrechtlichen Gegensatz zur anschließenden Besitznahme.
- source_word: וִירִשְׁתֶּם אֶת אַרְצָם
  choice: Dann werdet ihr ihr Land in Besitz nehmen
  rationale: Der Qal von ירש kann „erben“ oder „in Besitz nehmen“ bedeuten; im Landnahmekontext gibt „in Besitz nehmen“ den unmittelbaren Sinn am klarsten wieder.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: so wie ... geredet hat
  rationale: Bleibt beim Grundsinn „reden“ und lässt zugleich offen, dass das betreffende Reden Verheißungscharakter hatte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. Die Umschrift bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Die unterschiedlichen Bedeutungen von ירש in Hifil und Qal
  choice: „enteignen“ für Gottes Handeln und „in Besitz nehmen“ für Israels Handeln
  alternative: Beide Formen mit „vertreiben“ oder die zweite mit „erben“ wiedergeben
  rationale: Die differenzierte Wiedergabe erhält den Gegensatz zwischen dem Besitzverlust der Völker und Israels Besitzergreifung, ohne beide Aussagen sprachlich einzuebnen.
- issue: Verheißungscharakter von דִּבֶּר
  choice: „geredet hat“ im Haupttext
  alternative: „versprochen hat“
  rationale: „Gerِedet“ folgt der lexikalischen Form; dass die Rede zugleich eine Verheißung ist, bleibt aus dem Kontext erkennbar und wird nicht interpretierend festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „vor euch“ bewahrt die auffällige räumliche Parallelität des Hebräischen. Ein neuer Satz vor Israels Besitznahme verbessert die Lesbarkeit, ohne den inhaltlichen Zusammenhang aufzulösen.
