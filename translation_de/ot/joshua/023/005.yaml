revisions:
- from: Und Jahwe, euer Gott, er selbst wird sie vor euch vertreiben und sie vor euch enteignen. Dann werdet ihr ihr Land in Besitz nehmen[a], so wie Jahwe, euer Gott, zu euch geredet hat[b].
  to: Und Jahwe, euer Gott – er selbst – wird sie vor euch vertreiben und sie vor euch aus ihrem Besitz verdrängen; und ihr werdet ihr Land in Besitz nehmen[a], wie Jahwe, euer Gott, zu euch gesprochen hat[b].
  rationale: Die Revision ersetzt den anachronistisch-juristischen Ausdruck „enteignen“ durch eine idiomatische Wiedergabe des Besitzverlusts, entfernt die nicht im Ausgangstext ausgedrückte zeitliche Zuspitzung „Dann“ und erhält sowohl die Wiederholung von „vor euch“ als auch den emphatischen Charakter von הוּא. Die Fußnoten bleiben an den jeweiligen lexikalisch erläuterten Ausdrücken verankert.
