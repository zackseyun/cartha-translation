  variant: modern standard German
source:
  edition: WLC
  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: de
  text: Haltet vielmehr an Jahwe, eurem Gott, fest[a], so wie ihr es bis zum heutigen Tag getan habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hängt Jahwe, eurem Gott, fest an.“ Das hebräische Verb bezeichnet enge, beständige Verbundenheit und treue Bindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: vielmehr
  rationale: Die Partikelfolge bildet hier einen starken Gegensatz zur vorausgehenden Warnung. „Vielmehr“ gibt diesen korrigierenden, auffordernden Kontrast im Deutschen natürlich wieder.
- source_word: בַּיהוָה
  choice: an Jahwe
  rationale: Bei דבק bezeichnet ב das Gegenüber, an dem man festhält. Die deutsche Verbindung „an jemandem festhalten“ entspricht dieser Konstruktion idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Bundesname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Umschrift.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: אֱלֹהִים bezeichnet mit Bezug auf Jahwe den einen Gott; das Suffix der zweiten Person Plural macht die Bundesbeziehung ausdrücklich.
- source_word: תִּדְבָּקוּ
  choice: Haltet … fest
  rationale: דבק bezeichnet enge, beständige Verbundenheit und treue Bindung. „An … festhalten“ ist im modernen Deutschen natürlich und bewahrt sowohl die relationale als auch die bundestheologische Aussage.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Wendung leitet den Vergleich zwischen der geforderten Treue und dem bisherigen Verhalten Israels ein.
- source_word: עֲשִׂיתֶם
  choice: ihr es … getan habt
  rationale: Das Perfekt blickt auf das bis zum gegenwärtigen Zeitpunkt gezeigte Verhalten zurück; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die feste Zeitangabe bezeichnet die ununterbrochene Dauer bis zum Tag der Rede und wird im Deutschen klar und würdig wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutungsumfang von דבק im Bundeskontext
  choice: an … festhalten
  alternative: sich … anschließen / … anhängen
  rationale: „Festhalten“ wahrt die enge und beständige Bindung, ohne die Aussage auf eine bestimmte konfessionelle Deutung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Pluralimperativ richtet die Aufforderung unmittelbar an Israel. Die Stellung von „vielmehr“ macht den Gegensatz zum vorherigen Verbot deutlich; die Fußnote erhält das konkrete Bild und den bundestheologischen Bedeutungsumfang von דבק.
