  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: de
  text: Darum achtet sehr auf euch selbst, damit ihr Jahwe, euren Gott, liebt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: Darum achtet … darauf
  rationale: Das Verb bezeichnet wachsame Selbstaufmerksamkeit. Im Zusammenhang führt וְ die vorausgehende Begründung folgernd weiter; „Darum“ gibt diese Verbindung natürlich wieder.
- source_word: מְאֹד
  choice: sehr
  rationale: Das Adverb verstärkt die Aufforderung unmittelbar und wird im Deutschen idiomatisch mit „sehr darauf achten“ wiedergegeben.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: in „achtet … darauf“ reflexiv mitenthalten
  rationale: נֶפֶשׁ bezeichnet hier die ganze Person und verleiht der Aufforderung den Sinn sorgfältiger Selbstbewahrung. Eine gesonderte Wiedergabe als „für eure Seelen“ wäre missverständlich, während die deutsche Wendung den reflexiven Sinn natürlich einschließt.
- source_word: לְאַהֲבָה
  choice: zu lieben
  rationale: Der Infinitiv bezeichnet das Ziel beziehungsweise die Ausrichtung der gebotenen Wachsamkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euren Gott
  rationale: Die Verbindung mit dem Suffix der zweiten Person Plural bezeichnet die Bundesbeziehung zu Israels Gott.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in der Bundesmahnung
  choice: reflexiver Bezug auf die ganze Person, in der deutschen Aufforderung mitenthalten
  alternative: „eure Seelen“ oder „euer Leben“
  rationale: Die Wendung fordert Israel zu größter persönlicher Wachsamkeit auf, damit es Jahwe liebt. Sie trennt keine immaterielle „Seele“ vom übrigen Menschen ab; deshalb wird keine entsprechende anthropologische Aussage in den Text hineingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt knapp und eindringlich; „Jahwe“ bewahrt den persönlichen Gottesnamen. Keine Fußnote erforderlich.
