  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: de
  text: Denn wenn ihr euch wirklich abwendet und euch an den Rest dieser Völker klammert[a], an diese, die noch bei euch geblieben sind, und Heiratsverbindungen mit ihnen eingeht und mit ihnen Umgang habt und sie mit euch[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch an den Rest dieser Völker anschließt“ beziehungsweise „an ihm festhaltet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu ihnen hineingeht und sie zu euch“. Die hebräische Wendung kann auch den Umgang miteinander oder das Pflegen von Beziehungen bezeichnen und meint nicht notwendig nur körperliche Bewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Leitet im Zusammenhang eine bedingte Warnung ein und bewahrt zugleich die Verbindung zum vorausgehenden Vers.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: ihr euch tatsächlich abwendet
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Tatsächlich“ gibt diese Hervorhebung natürlich wieder; „abwendet“ bezeichnet im Kontext die Abkehr von der geforderten Bundestreue.
- source_word: וּדְבַקְתֶּם
  choice: euch … hängt
  rationale: דבק bezeichnet eine enge, beständige Bindung. Die Wendung „sich an jemanden hängen“ erhält die starke relationale Bedeutung und den Anklang an Bundessprache.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: an den Rest dieser Völker
  rationale: יֶתֶר bezeichnet das, was übrig ist. „Rest“ ist hier sachlich und vermeidet eine mögliche positive heilsgeschichtliche Nebenbedeutung von „Überrest“.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: an diese, die bei euch übrig geblieben sind
  rationale: Bewahrt die wiederholte demonstrative Präzisierung und gibt die fortdauernde Anwesenheit dieser Völker bei Israel wieder.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: wenn ihr euch mit ihnen verschwägert
  rationale: Der Hitpael von חתן bezeichnet das Eingehen wechselseitiger Heiratsverbindungen. „Sich verschwägern“ ist präzise und schließt nicht nur einzelne Eheschließende, sondern die entstehenden Familienverbindungen ein.
- source_word: וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: und mit ihnen Umgang habt und sie mit euch
  rationale: Die knappe wechselseitige Wendung mit בוא ב kann das Eintreten in soziale Beziehungen beziehungsweise den Umgang miteinander bezeichnen. Die Übersetzung wahrt die Gegenseitigkeit, ohne die Formulierung unnötig auf körperliche Bewegung oder Sexualität einzuengen.
theological_decisions:
- issue: Bundesbezogene Warnung in שׁוֹב תָּשׁוּבוּ
  choice: euch tatsächlich abwendet
  alternative: wieder umkehrt / zurückkehrt
  rationale: Im Kontext geht es nicht um eine neutrale Rückkehr, sondern um die Abkehr von der Treue zu JHWH durch Bindung an die verbliebenen Völker. „Abwendet“ macht die negative Richtung deutlich, ohne eine weitergehende Lehrdeutung einzutragen.
- issue: Mögliche theologische Überdeutung von יֶתֶר
  choice: Rest
  alternative: Überrest
  rationale: „Rest“ bezeichnet hier schlicht die noch verbliebenen Völker. So wird vermieden, den andernorts möglichen heilsgeschichtlichen Klang von „Überrest“ in diesen Vers hineinzutragen.
- issue: Mehrdeutigkeit der wechselseitigen Wendung בוא ב
  choice: miteinander Umgang haben
  alternative: zueinander hineingehen / untereinander verkehren
  rationale: Der Kontext nennt Heiratsverbindungen bereits ausdrücklich. Die breitere soziale Bedeutung bleibt deshalb im Haupttext erhalten; die wörtlichere räumliche Möglichkeit wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „an diese“ bildet die demonstrative Wiederaufnahme des Hebräischen ab. Der abschließende Beistrich bleibt stehen, weil der Bedingungssatz in Josua 23,13 fortgeführt wird.
