  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: de
  text: Wenn ihr den Bund Jahwes, eures Gottes, übertretet[a], den er euch geboten hat, und hingeht, anderen Göttern dient und euch vor ihnen niederwerft, wird der Zorn Jahwes gegen euch entbrennen, und ihr werdet rasch aus dem guten Land umkommen[b], das er euch gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Einleitung kann auch zeitlich verstanden werden: „Sobald ihr den Bund … übertretet.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „rasch von dem guten Land her umkommen“. Die Wendung verbindet ihren Untergang mit der Entfernung aus dem Land, das Jahwe ihnen gegeben hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: Wenn ihr … übertretet
  rationale: Die Konstruktion mit ב plus Infinitivus constructus kann zeitlich oder bedingend verstanden werden. Im warnenden Zusammenhang gibt „wenn“ die konditionale Aussage natürlich wieder; עבר ברית bedeutet idiomatisch, einen Bund zu übertreten.
- source_word: בְּרִית
  choice: Bund
  rationale: „Bund“ bewahrt das rechtliche und theologische Gewicht des hebräischen Standardbegriffs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: den er euch geboten hat
  rationale: Die knappe Relativkonstruktion wird ohne den nicht ausdrücklich genannten Zusatz „zu halten“ wiedergegeben.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: und hingeht, anderen Göttern dient
  rationale: „Hingehen und dienen“ gibt die Bewegung zum Götzendienst sowie den religiösen Dienst wieder, ohne ihn mit dem folgenden Niederwerfen gleichzusetzen.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: und euch vor ihnen niederwerft
  rationale: Die Wiedergabe erhält die konkrete körperliche Bedeutung des Verbs und unterscheidet sie vom vorhergehenden „dienen“.
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: wird der Zorn Jahwes gegen euch entbrennen
  rationale: Die deutsche Formulierung bewahrt das hebräische Bild vom entbrennenden Zorn und macht die Folgebeziehung klar.
- source_word: וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ
  choice: ihr werdet rasch aus dem guten Land verschwinden
  rationale: אבד kann „zugrunde gehen“ oder „verschwinden“ bedeuten. Mit מֵעַל הָאָרֶץ betont die Formulierung das Entferntwerden beziehungsweise Verschwinden aus dem Land, ohne die Art des Untergangs enger festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen unmittelbar; „Jahwe“ erhält dessen Charakter als Eigenname.
- issue: Sinn der einleitenden Konstruktion
  choice: 'Bedingte Warnung: „Wenn ihr …“'
  alternative: 'Zeitliche Aussage: „Wenn/sobald ihr …“ im Sinn von „wenn es geschieht“'
  rationale: Die hebräische Konstruktion lässt eine zeitliche oder bedingende Lesart zu. Der Mahnkontext legt eine konditionale Warnung nahe, doch die Mehrdeutigkeit wird in der Fußnote offengelegt.
- issue: Art der angekündigten Folge
  choice: „aus dem guten Land verschwinden“
  alternative: „rasch zugrunde gehen, weg von dem guten Land“
  rationale: Die Verbindung von אבד mit מֵעַל betont sowohl den Untergang als auch die Entfernung aus dem von Gott gegebenen Land. Die gewählte Formulierung hält diesen Bezug fest, ohne ausdrücklich nur Vertreibung oder nur Tod zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Übertretet“ und „Bund“ bewahren den rechtlich-theologischen Ton; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich. Die Anrede im Plural wird durchgehend mit „ihr/euch“ wiedergegeben.
