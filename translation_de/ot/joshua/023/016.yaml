  verdict: revise
  source_fidelity: Die Übersetzung gibt die bedingte Einleitung, den Bundesbruch, Dienst und Niederwerfen vor anderen Göttern sowie den entbrennenden Zorn Jahwes zutreffend wieder. „Verschwinden“ allein ist für וַאֲבַדְתֶּם jedoch zu abgeschwächt, da das Verb hier den Untergang bzw. das Umkommen einschließt; die Präpositionalphrase kennzeichnet zugleich den Verlust des Landes.
  naturalness: Der Satz ist gut lesbares, würdevolles modernes Standarddeutsch. „Aus dem guten Land umkommen“ ist in diesem prophetisch-warnenden Register verständlich und bewahrt die stärkere Aussage des Hebräischen. Die Fußnote zur Einleitung sollte die zeitliche Nuance mit „sobald“ verdeutlichen, da „wenn“ im Deutschen beide Möglichkeiten abdecken kann.
  terminology: „Bund“, „Jahwe“, „andere Götter“, „dienen“ und „sich vor ihnen niederwerfen“ sind sachgerecht und unterscheiden die beiden kultischen Verben. „Zorn Jahwes ... entbrennen“ bildet das hebräische Bild angemessen ab.
  issues:
  - severity: medium
    issue: „verschwinden“ schwächt וַאֲבַדְתֶּם ab.
    rationale: אבד bezeichnet im Warnzusammenhang nicht nur ein neutrales Verschwinden, sondern Untergang bzw. Umkommen. Der Ortsbezug „aus dem guten Land“ soll erhalten bleiben, ohne den Untergang auf bloße Vertreibung zu reduzieren.
  - severity: low
    issue: Fußnote a erläutert die zeitliche Lesart nicht eindeutig.
    rationale: Die Fußnote verwendet erneut „wenn“, das im Deutschen ebenfalls konditional oder temporal sein kann. „Sobald“ macht die alternative zeitliche Nuance klarer.
  - severity: low
    issue: Fußnote b bietet „verschwinden“ als wörtliche Annäherung an.
    rationale: Auch in der Anmerkung sollte die Bedeutung von אבד als „umkommen/zugrunde gehen“ nicht durch die bloße Entfernungsbedeutung ersetzt werden.
