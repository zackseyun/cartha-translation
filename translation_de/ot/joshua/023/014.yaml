  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: de
  text: 'Und siehe: Ich gehe heute den Weg alles Irdischen.[a] Ihr wisst mit eurem ganzen Herzen und mit eurer ganzen Seele, dass kein einziges Wort von all den guten Worten unerfüllt geblieben ist, die Jahwe, euer Gott, euch zugesagt hat. Sie alle sind euch zuteilgeworden; kein einziges Wort davon ist unerfüllt geblieben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Den Weg alles Irdischen gehen“ ist eine hebräische Redewendung für das allen Menschen bestimmte Geschick, besonders für das Sterben.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Kein einziges Wort ist gefallen.“ Das hebräische Bild meint, dass kein Wort ausgeblieben oder fehlgeschlagen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt die feierliche, Aufmerksamkeit weckende Diskursfunktion; eine Fußnote nennt die natürlichere Alternative „Nun seht“.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: den Weg aller Welt
  rationale: Bewahrt die hebräische Metapher für das allen Menschen bestimmte Sterben und klingt im Deutschen würdig und verständlich.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: mit eurem ganzen Herzen und mit eurer ganzen Seele
  rationale: Erhält das biblische Begriffspaar Herz und Seele, das hier die volle innere Gewissheit ausdrückt.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: kein einziges Wort … unerfüllt geblieben
  rationale: „Wort“ bewahrt die Verbindung zu „gesprochen“; „unerfüllt geblieben“ gibt die Bedeutung des hebräischen Bildes wörtlich „ist gefallen“ in natürlichem Deutsch wieder.
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: von all den guten Worten
  rationale: Bewahrt die lexikalische Wiederholung von דָּבָר und den Bezug auf Gottes vorausgehende Zusagen, ohne ausdrücklich „Verheißungen“ einzusetzen.
- source_word: עֲלֵיכֶם
  choice: über euch
  rationale: Gibt die Präposition עַל formal wieder und lässt offen, ob der Schwerpunkt auf „über euch“, „euch betreffend“ oder „für euch“ liegt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder.
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: Sie alle sind für euch eingetroffen
  rationale: Erhält das Bild des Eintreffens und macht zugleich deutlich, dass alle genannten guten Worte Wirklichkeit wurden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; „Jahwe“ bewahrt den Charakter als Eigenname.
- issue: Charakter der „guten Worte“
  choice: gute Worte
  alternative: gute Verheißungen
  rationale: „Verheißungen“ trifft den kontextuellen Sinn, würde die mehrdeutige Bedeutung von דָּבָר jedoch stärker festlegen; „Worte“ bewahrt außerdem die Verbindung zum Verb „sprechen“.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Ton. Die hebräische Sterbensmetapher bleibt erhalten; das schwer verständliche Bild vom „Fallen“ eines Wortes wird sinngemäß im Text und wörtlich in einer Fußnote wiedergegeben.
