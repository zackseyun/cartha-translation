revisions:
- from: Und siehe[a], ich gehe heute den Weg aller Welt. Ihr wisst mit eurem ganzen Herzen und mit eurer ganzen Seele, dass kein einziges Wort von all den guten Worten unerfüllt geblieben ist, die Jahwe, euer Gott, über euch gesprochen hat. Sie alle sind für euch eingetroffen; kein einziges Wort davon ist unerfüllt geblieben.
  to: 'Und siehe: Ich gehe heute den Weg alles Irdischen.[a] Ihr wisst mit eurem ganzen Herzen und mit eurer ganzen Seele, dass kein einziges Wort von all den guten Worten unerfüllt geblieben ist, die Jahwe, euer Gott, euch zugesagt hat. Sie alle sind euch zuteilgeworden; kein einziges Wort davon ist unerfüllt geblieben.[b]'
  rationale: Die Revision bewahrt die Satzfolge, die Wiederholung von „Wort“ und den feierlichen Ton des hebräischen Textes. Sie ersetzt eine im Deutschen missverständliche Präpositionsfügung durch „euch zugesagt“, wählt für die Sterbensmetapher eine geläufige deutsche Entsprechung und ordnet die beiden notwendigen Fußnoten an den inhaltlich passenden Stellen an.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:43:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Grundsinn wird weitgehend getroffen: Josua spricht von seinem bevorstehenden Gang „den Weg aller Erde“, die Adressaten wissen innerlich, dass kein einziges von Jahwes guten Worten ausgeblieben ist, sondern alle zu ihnen gekommen sind. „Über euch gesprochen“ ist jedoch im heutigen Deutsch missverständlich und klingt, als habe Gott lediglich über Israel geredet. Die Fußnoten des englischen Prüfpfads sind im Entwurf zudem nicht sachgerecht abgebildet.'
  naturalness: „Den Weg aller Welt“ ist verständlich, aber „den Weg alles Irdischen“ ist die im modernen gehobenen Deutsch geläufigere Wiedergabe der Sterbensmetapher. „Euch zuteilgeworden“ gibt „sind zu euch gekommen“ idiomatisch und ohne unnötige Umdeutung wieder. Die Wiederholung von „unerfüllt geblieben“ ist natürlich und verdeutlicht das hebräische Bild vom Nicht-„Fallen“ eines Wortes.
  terminology: „Jahwe“ gibt יְהוָה angemessen wieder. „Herz“ und „Seele“ bewahren das hebräische Begriffspaar. „Wort/Worte“ ist hier gegenüber „Ding“ oder „Verheißung“ vorzuziehen, da der Text ausdrücklich von dem spricht, was Jahwe gesagt hat. „Euch zugesagt“ macht die im Kontext positive, auf die Adressaten bezogene Bedeutung von עֲלֵיכֶם im Deutschen klar, ohne die Bezeichnung „Verheißungen“ einzutragen.
  issues:
  - severity: medium
    issue: Die Fußnote [a] erklärt nur eine Alternative zu „siehe“, während die im Prüfpfad erforderlichen Sachhinweise zur Sterbensmetapher und zur Idiomatik von „kein Wort ist gefallen“ fehlen.
    rationale: Der Entwurf behauptet in den Übersetzungsnotizen, das Bild vom „Fallen“ werde in einer Fußnote erläutert; tatsächlich existiert keine solche Fußnote. Außerdem sollte die kulturelle Erklärung an der Metapher „Weg alles Irdischen“ verankert werden, nicht an „siehe“.
  - severity: medium
    issue: „die Jahwe, euer Gott, über euch gesprochen hat“ ist im modernen Deutsch semantisch und stilistisch problematisch.
    rationale: Es kann bedeuten, Gott habe über die Israeliten gesprochen, während עֲלֵיכֶם hier die an bzw. für sie gerichteten guten Zusagen bezeichnet. „euch zugesagt hat“ gibt den Kontext präzise und natürlich wieder.
  - severity: low
    issue: „den Weg aller Welt“ ist weniger idiomatisch als „den Weg alles Irdischen“.
    rationale: Die revidierte Wendung bewahrt die Metapher und macht ihre traditionelle Bedeutung im Deutschen klarer.
