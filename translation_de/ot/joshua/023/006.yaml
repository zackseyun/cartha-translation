base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: de
  text: Darum seid sehr entschlossen, alles zu beachten und zu tun, was im Buch des Gesetzes des Mose[a] geschrieben steht, damit ihr davon weder nach rechts noch nach links abweicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Buch der Weisung des Mose“. Das hebräische Wort Tora kann sowohl „Weisung“ als auch „Gesetz“ bedeuten; hier bezeichnet es besonders den mit Mose verbundenen Gesetzes- und Weisungskorpus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: seid sehr entschlossen
  rationale: Das Verb חזק bezeichnet hier in einer an mehrere Personen gerichteten Ermahnung Festigkeit und Entschlossenheit. Die Wiedergabe bewahrt den nachdrücklichen Aufforderungscharakter, ohne den Ausdruck auf körperliche Stärke zu verengen; מְאֹד wird mit „sehr“ wiedergegeben.
- source_word: לִשְׁמֹר
  choice: zu beachten
  rationale: שׁמר meint im Zusammenhang mit Weisung und Bund das gewissenhafte Einhalten. „Beachten“ ist im heutigen Deutsch natürlich und verbindet sich gut mit einem geschriebenen Gesetzeskorpus.
- source_word: וְלַעֲשׂוֹת
  choice: und zu tun
  rationale: Die konkrete Bedeutung von עשה bleibt erhalten. Zusammen mit „beachten“ bringt die Formulierung sowohl die bindende Aufmerksamkeit als auch die praktische Ausführung zum Ausdruck.
- source_word: כָּל הַכָּתוּב
  choice: alles …, was … geschrieben steht
  rationale: Diese idiomatische deutsche Konstruktion gibt den umfassenden Bezug auf den gesamten schriftlich festgehaltenen Inhalt klar wieder.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: im Buch des Gesetzes des Mose
  rationale: סֵפֶר kann Buch oder Schriftrolle bezeichnen; „Buch“ ist hier die etablierte und allgemein verständliche Wiedergabe. תּוֹרָה bezeichnet in dieser Formel die mit Mose verbundene verbindliche Weisung beziehungsweise Gesetzessammlung.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: damit ihr davon … nicht abweicht
  rationale: Die Formulierung gibt die zweckbezogene Vermeidung des Abweichens wieder. Das singuläre „davon“ nimmt den geschriebenen Weisungs- beziehungsweise Gesetzeskorpus als Einheit auf.
- source_word: יָמִין וּשְׂמֹאול
  choice: weder nach rechts noch nach links
  rationale: Die feste Richtungsmetapher für jede Art von Abweichung wird in natürlichem Deutsch bewahrt.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im mosaischen Bundeskontext
  choice: Gesetz in „Buch des Gesetzes des Mose“
  alternative: Weisung in „Buch der Weisung des Mose“
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten, bezeichnet in dieser feststehenden Wendung jedoch den mit Mose verbundenen verbindlichen Gesetzes- und Weisungskorpus. „Gesetz“ macht diesen konkreten Bezug deutlich; die Fußnote bewahrt die weitere Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Richtungsmetapher und die Verbindung von Beachten und Tun bleiben erhalten; altertümliche oder konfessionell geprägte Formulierungen werden vermieden.
