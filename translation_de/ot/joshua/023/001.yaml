id: JOS.23.1
reference: Joshua 23:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: de
  text: 'Und es geschah nach langer Zeit[a], nachdem Jahwe Israel Ruhe vor allen seinen Feinden ringsum verschafft hatte: Josua war alt und hochbetagt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nach vielen Tagen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräische Redewendung; wörtlich: „in die Tage gekommen“.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die narrative wayyiqtol-Form von היה eröffnet einen neuen Abschnitt. Die Wiedergabe wahrt diese Erzählfunktion in würdigem, verständlichem Deutsch.
- source_word: מִיָּמִים רַבִּים
  choice: nach langer Zeit
  rationale: Die hebräische Wendung bezeichnet eine beträchtliche verstrichene Zeit. Natürliches Deutsch ist hier gegenüber dem wörtlicheren „nach vielen Tagen“ vorzuziehen; die Alternative wird in der Fußnote bewahrt.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: nachdem
  rationale: Die zusammengesetzte Zeitangabe leitet das Ereignis ein, an dem der zeitliche Abstand bemessen wird.
- source_word: הֵנִיחַ
  choice: Ruhe ... verschafft hatte
  rationale: Der Hifil von נוח bezeichnet hier, dass Jahwe Israel Ruhe beziehungsweise Entlastung von seinen Feinden gewährte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: לְיִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname des Volkes wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: vor allen seinen Feinden ringsum
  rationale: „Ringsum“ erhält die räumliche Betonung des hebräischen מִסָּבִיב und drückt umfassende Ruhe vor den umliegenden Feinden aus.
- source_word: וִיהוֹשֻׁעַ זָקֵן
  choice: Josua war alt
  rationale: Die schlichte prädikative Aussage wird direkt und natürlich wiedergegeben; der Doppelpunkt macht ihren Bezug auf die lange zeitliche Einleitung deutlich.
- source_word: בָּא בַּיָּמִים
  choice: hochbetagt
  rationale: Die wörtlich „in die Tage gekommen“ lautende hebräische Altersformel bezeichnet ein weit fortgeschrittenes Lebensalter. „Hochbetagt“ ist knapp, würdig und gegenwärtig verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange temporale Einleitung des Hebräischen bleibt erkennbar, wird aber durch einen Doppelpunkt übersichtlich gegliedert. Die Pronomen zu Israel stehen im Deutschen im grammatischen Singular.
