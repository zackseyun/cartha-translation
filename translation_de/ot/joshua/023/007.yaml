base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: de
  text: damit ihr euch nicht unter diese Völker begebt, die noch bei euch übrig geblieben sind, und den Namen ihrer Götter nicht erwähnt[a], niemanden bei ihren Göttern schwören lasst[b], ihnen nicht dient und euch nicht vor ihnen niederwerft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht anruft“. Das hebräische Verb kann „erwähnen“ und in diesem Zusammenhang auch „anrufen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nicht schwören lasst“. Die hebräische Verbform ist kausativ; gemeint sein kann, andere bei ihren Göttern einen Eid ablegen zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: damit ihr euch nicht unter diese Völker begebt
  rationale: לְבִלְתִּי mit Infinitiv bezeichnet hier die zu vermeidende Handlung. בוא mit בְּ beschreibt im Zusammenhang nicht nur ein geografisches Hineingehen, sondern das Sich-Begeben unter diese Völker und damit die Annäherung an sie.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: die noch bei euch übrig geblieben sind
  rationale: Das Partizip von שׁאר bezeichnet die verbliebenen Völker; אִתְּכֶם wird direkt mit „bei euch“ wiedergegeben.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: und den Namen ihrer Götter nicht erwähnt[a]
  rationale: Das Hifil von זכר kann „erwähnen“ oder im kultischen Zusammenhang „anrufen“ bedeuten. „Erwähnen“ wahrt den unmittelbaren Wortsinn; die mögliche kultische Bedeutung wird in der Fußnote offengehalten.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: niemanden bei ihnen schwören lasst[b]
  rationale: 'Das Hifil von שׁבע ist kausativ: jemanden schwören lassen. Das im Hebräischen unausgedrückte Objekt wird im Deutschen zur Verständlichkeit mit „niemanden“ ergänzt; „bei ihnen“ bezieht sich auf die fremden Götter.'
- source_word: וְלֹא תַעַבְדוּם
  choice: ihnen nicht dient
  rationale: עבד bedeutet „dienen“ und kann kultischen Dienst bezeichnen. Die Wiedergabe bewahrt den Unterschied zum anschließenden Niederwerfen.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: euch nicht vor ihnen niederwerft
  rationale: Die Form von שׁחה bezeichnet das Sich-Niederwerfen beziehungsweise die Proskynese. „Sich niederwerfen“ gibt die konkrete Handlung präzise und würdig wieder.
theological_decisions:
- issue: Konkrete Formen der Hinwendung zu fremden Göttern
  choice: Die einzelnen Verbote werden als Erwähnen beziehungsweise Anrufen, Schwörenlassen, Dienen und Niederwerfen getrennt wiedergegeben.
  alternative: Die Reihe zusammenfassend mit „sie nicht verehren“ wiedergeben.
  rationale: Der hebräische Text nennt mehrere unterscheidbare Handlungen. Ihre getrennte Wiedergabe bewahrt die konkrete Aussage und vermeidet eine theologisch glättende Verallgemeinerung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als abhängiger Zweck- beziehungsweise Vermeidungssatz erhalten, weil der Vers syntaktisch an die vorausgehende Ermahnung anschließt. Konkrete kultische Handlungen werden nicht unter dem allgemeinen Begriff „verehren“ zusammengezogen.
