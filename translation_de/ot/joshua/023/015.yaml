revisions:
- from: 'Und es wird geschehen: So, wie jedes gute Wort, das Jahwe, euer Gott, zu euch geredet hat, über euch gekommen ist, so wird Jahwe jedes böse Wort[a] über euch bringen, bis er euch aus diesem guten Land vernichtet hat, das Jahwe, euer Gott, euch gegeben hat.'
  to: 'Und es wird geschehen: Wie jedes gute Wort, das Jahwe, euer Gott, zu euch geredet hat, über euch gekommen ist, so wird Jahwe alles Unheil[a] über euch bringen, bis er euch von diesem guten Land vertilgt hat, das Jahwe, euer Gott, euch gegeben hat.'
  rationale: Die Revision ersetzt die im Deutschen missverständliche Formulierung „böses Wort“ durch das kontextgerecht natürliche „Unheil“, ohne die hebräische Mehrdeutigkeit oder die Wortparallele aufzugeben; beides wird in der Fußnote erhalten. Zugleich wird die Ortsrelation von מֵעַל eindeutig und idiomatisch mit „von diesem guten Land vertilgt“ wiedergegeben.
