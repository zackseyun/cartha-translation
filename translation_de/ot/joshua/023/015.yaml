source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: de
  text: 'Und es wird geschehen: Wie jedes gute Wort, das Jahwe, euer Gott, zu euch geredet hat, über euch gekommen ist, so wird Jahwe alles Unheil[a] über euch bringen, bis er euch von diesem guten Land vertilgt hat, das Jahwe, euer Gott, euch gegeben hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede schlimme Sache“. Wörtlich: „jedes böse Wort / jede böse Sache“, parallel zu „jedes gute Wort“ am Anfang des Verses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt den feierlichen, zukunftsbezogenen Diskursauftakt, ohne unnötig altertümlich zu klingen.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: So, wie ... so
  rationale: Gibt die ausdrückliche Vergleichsstruktur zwischen erfülltem Gut und angekündigtem Gericht wieder.
- source_word: בָּא עֲלֵיכֶם
  choice: über euch gekommen ist
  rationale: Das Perfekt bezeichnet die bereits eingetretene Erfüllung; „über euch“ wahrt zudem die Präposition und die Parallele zum folgenden Gericht.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: jedes gute Wort
  rationale: Bewahrt die bewusste lexikalische Entsprechung zu כָּל הַדָּבָר הָרָע. „Verheißung“ wäre hier stärker auslegend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: wird ... über euch bringen
  rationale: Gibt die kausative Form von בוא und die wiederholte Präposition עַל erkennbar wieder.
- source_word: כָּל הַדָּבָר הָרָע
  choice: jedes böse Wort
  rationale: Erhält die pointierte Wort-für-Wort-Parallele zu „jedes gute Wort“. Die Fußnote nennt sachbezogene Alternativen, da רָע hier Unheil bzw. Gericht bezeichnen kann.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: bis er euch ... vernichtet hat
  rationale: Drückt den erreichten Endpunkt des angekündigten Gerichtshandelns aus.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: aus diesem guten Land
  rationale: Natürliches modernes Deutsch; „Land“ passt hier zum gegebenen Siedlungsgebiet, während eine mechanische Wiedergabe von מֵעַל im Deutschen schwerfällig wäre.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich; die Umschrift bewahrt seinen Charakter als Gottesname.
- issue: Bedeutung von רָע beim von Gott gebrachten Bundesgericht
  choice: böses Wort, mit Fußnote
  alternative: Unheil / schlimme Ankündigung
  rationale: „Böses Wort“ bewahrt die formale Antithese zu „gutem Wort“, darf aber nicht so verstanden werden, als werde Gott moralisches Böses zugeschrieben. Die Fußnote erhält deshalb die sachliche Bedeutungsbreite von רָע und דָּבָר.
- issue: Reichweite von הַשְׁמִידוֹ אֹתְכֶם
  choice: bis er euch ... vernichtet hat
  alternative: bis er euch ... vertilgt hat
  rationale: Die starke Gerichtsaussage wird nicht abgeschwächt; „vernichten“ ist gegenwärtig und würdevoll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Parallelstruktur wurde sichtbar gehalten. „Jahwe, euer Gott“ bewahrt die wiederkehrende Bundesformel; die Anrede steht durchgehend im Plural.
