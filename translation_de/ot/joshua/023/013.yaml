  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: de
  text: 'Dann sollt ihr mit Gewissheit wissen: Jahwe, euer Gott, wird diese Völker nicht länger vor euch vertreiben. Sie werden euch vielmehr zu Falle und Schlinge werden, zur Geißel an euren Seiten[a] und zu Dornen in euren Augen, bis ihr aus diesem guten Land verschwunden seid, das Jahwe, euer Gott, euch gegeben hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das zugrunde liegende hebräische Wort ist selten und in seiner Bedeutung unsicher; möglich ist auch: »zur Peitsche an euren Seiten« oder allgemeiner: »zur Qual für eure Seiten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: sollt ihr mit Gewissheit wissen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; die deutsche Formulierung gibt diesen Nachdruck natürlich wieder.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: wird ... nicht länger ... vertreiben
  rationale: יסף mit Infinitiv bezeichnet hier das Aufhören weiteren Handelns; ירש im Hiphil meint in diesem Eroberungszusammenhang das Vertreiben beziehungsweise Enteignen der Völker.
- source_word: מִלִּפְנֵיכֶם
  choice: vor euch
  rationale: Die räumliche Wendung bleibt erhalten, ohne im Deutschen unnatürlich zu wirken.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: zu Falle und Schlinge
  rationale: Die beiden nah verwandten Fangbilder werden lexikalisch unterschieden und in ihrer rhetorischen Paarung bewahrt.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: zur Geißel an euren Seiten
  rationale: Das seltene und schwierige שֹׁטֵט bezeichnet wahrscheinlich ein schlagendes oder schmerzhaft quälendes Mittel. »Geißel« bewahrt das Körper- und Leidensbild; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: zu Dornen in euren Augen
  rationale: Die konkrete Metapher scharfer, quälender Fremdkörper wird eng am Hebräischen wiedergegeben.
- source_word: עַד אֲבָדְכֶם מֵעַל הָאֲדָמָה
  choice: bis ihr aus diesem guten Land verschwunden seid
  rationale: אבד kann hier den Untergang beziehungsweise das Verschwinden aus dem Land bezeichnen. Die Übersetzung wahrt den drohenden Ernst, ohne eindeutig festzulegen, ob ausschließlich Tod oder auch Vertreibung gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Art der angekündigten Folge
  choice: Jahwe stellt das weitere Vertreiben der Völker ein; diese werden Israel zur anhaltenden Bedrängnis, bis Israel aus dem gegebenen Land verschwindet.
  alternative: Die Aussage als bloße militärische Prognose oder ausschließlich als Ankündigung völliger Vernichtung zu deuten.
  rationale: Der Vers verbindet Gottes eingestelltes Handeln, die Bedrängnis durch die Völker und den Verlust des geschenkten Landes. Die Übersetzung erhält diesen Bundes- und Gerichtszusammenhang, ohne ihn erklärend auszubauen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen. Seine Wiedergabe als »Jahwe« erhält den Eigenname-Charakter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Nachdruck, die Fang- und Körpermetaphern sowie die Spannung zwischen Untergang und Verlust des Landes bleiben erhalten.
