source:
  edition: WLC
  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: de
  text: 'Seht, ich habe euch diese Völker, die noch übrig sind, zusammen mit allen Völkern, die ich ausgerottet habe, als Erbbesitz für eure Stämme zugelost: vom Jordan bis zum Großen Meer im Westen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum Untergang der Sonne“, das heißt: im Westen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Seht
  rationale: Der Imperativ Plural lenkt die Aufmerksamkeit nachdrücklich auf Josuas Aussage; „Seht“ bewahrt diese Funktion in würdigem, verständlichem Deutsch.
- source_word: הִפַּלְתִּי
  choice: ich habe ... zugelost
  rationale: Der Hifil von נפל bezeichnet hier idiomatisch die Zuteilung durch das Los. „Zugelost“ macht sowohl den Verteilungsvorgang als auch den Loscharakter deutlich.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: diese Völker, die noch übrig sind
  rationale: Die partizipiale Aussage wird verbal wiedergegeben und bezeichnet die weiterhin im Land verbliebenen Völker.
- source_word: בְּנַחֲלָה
  choice: als Erbbesitz
  rationale: נחלה bezeichnet im Josuabuch den erblich zugewiesenen Landbesitz; „Erbbesitz“ wahrt diesen territorialen und bundestheologischen Klang.
- source_word: לְשִׁבְטֵיכֶם
  choice: für eure Stämme
  rationale: Die Präposition kennzeichnet die Stämme als Empfänger beziehungsweise Nutznießer der Zuteilung.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: zusammen mit allen Völkern, die ich ausgerottet habe
  rationale: כרת bedeutet hier im Zusammenhang der Landnahme vernichten oder ausrotten. „Ausgerottet“ gibt die tatsächliche Gerichtsaussage klarer wieder als das im Deutschen missverständliche „abgeschnitten“.
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: vom Jordan bis zum Großen Meer
  rationale: Trotz des hebräischen ו vor „Großes Meer“ beschreibt die Wendung den räumlichen Umfang des zugeteilten Gebiets; die deutsche Von-bis-Konstruktion gibt diesen Sinn natürlich wieder.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: im Westen
  rationale: Die wörtliche Wendung „(zum) Eingang der Sonne“ ist eine Richtungsangabe für den Sonnenuntergang beziehungsweise Westen. Die Bildform wird in der Fußnote dokumentiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Zuteilung, Empfänger, Umfang und Grenzen klar zusammen. „Großes Meer“ bewahrt die biblische Bezeichnung für das Mittelmeer; die hebräische Richtungsmetapher wird zur Verständlichkeit im Text als „im Westen“ wiedergegeben und in der Fußnote offengelegt.
