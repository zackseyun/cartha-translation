base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: de
  text: 'Dies ist das Land, das noch übrig ist: alle Gebiete der Philister und alle Geschuriter[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „und alle der Geschuriter“; die singularische Volksbezeichnung ist kollektiv gemeint und wird im Deutschen mit „alle Geschuriter“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: Dies ist das Land, das noch übrig ist
  rationale: Die Kopula wird im Deutschen ergänzt; das attributive Nifal-Partizip von שׁאר wird als natürlicher Relativsatz wiedergegeben. „noch übrig“ bezeichnet das bislang nicht eingenommene Land.
- source_word: כָּל גְּלִילוֹת
  choice: alle Gebiete
  rationale: גְּלִילוֹת bezeichnet hier territoriale Bezirke oder Regionen. „Gebiete“ ist im modernen Deutschen natürlich und geografisch hinreichend präzise.
- source_word: הַפְּלִשְׁתִּים
  choice: der Philister
  rationale: Der hebräische Text nennt das Volk; der deutsche Genitiv bewahrt die Zugehörigkeitsbeziehung zu dessen Gebieten.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: und das ganze Gebiet der Geschuriter
  rationale: Das singularische Gentiliz הַגְּשׁוּרִי wird kollektiv gebraucht. Im Zusammenhang einer Aufzählung verbleibender Landesteile bezeichnet die Wendung sinnvoll das gesamte Gebiet der betreffenden Volksgruppe; „Gebiet“ wird zur natürlichen deutschen Verdeutlichung ergänzt.
