  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: de
  text: 'Und im Tal: Bet-Haram, Bet-Nimra, Sukkot und Zafon – der Rest des Königreichs Sihons, des Königs von Heschbon –, mit dem Jordan als Grenze bis ans Ende des Sees Kinneret[a], jenseits des Jordan im Osten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Rand“ oder „bis zum äußersten Ende des Sees Kinneret“.'
    reason: קְצֵה kann sowohl „Ende“ als auch „Rand/äußerster Punkt“ bezeichnen; die Fußnote bewahrt diese lexikalische Offenheit.
lexical_decisions:
- source_word: וּבָעֵמֶק
  choice: und im Tal
  rationale: עֵמֶק bezeichnet ein Tal oder Tiefland; hier führt das Wort die Landschaft ein, in der die folgenden Orte liegen.
- source_word: בֵּית הָרָם ... בֵית נִמְרָה ... סֻכּוֹת ... צָפוֹן
  choice: Bet-Haram, Bet-Nimra, Sukkot und Zafon
  rationale: Die Ortsnamen werden in einer im Deutschen gut lesbaren, quellenahen Umschrift wiedergegeben; צָפוֹן ist hier ein Ortsname und nicht die Richtungsangabe „Norden“.
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: der Rest des Königreichs Sihons, des Königs von Heschbon
  rationale: יֶתֶר bedeutet „Rest“ oder „übriger Teil“; die Apposition macht Sihons Königstitel ohne interpretative Ergänzung deutlich.
- source_word: הַיַּרְדֵּן וּגְבֻל
  choice: mit dem Jordan als Grenze
  rationale: Die knappe hebräische Fügung wird idiomatisch als Grenzangabe wiedergegeben, ohne eine zusätzliche Grenze neben dem Jordan anzunehmen.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: bis zum unteren Ende des Sees Kinneret
  rationale: קְצֵה bezeichnet Ende, äußersten Rand oder äußerstes Ende. „Unteres Ende“ gibt im geografischen Zusammenhang wahrscheinlich den südlichen Abschluss des Sees wieder; die allgemeinere lexikalische Möglichkeit wird in der Fußnote bewahrt.
- source_word: עֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: jenseits des Jordan im Osten
  rationale: Die Wendung bezeichnet die östliche Seite des Jordan; „jenseits“ bewahrt dabei die räumliche Perspektive von עֵבֶר.
