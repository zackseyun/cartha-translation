  naturalness: Die Aufspaltung nach „regiert hatte“ in einen neuen Satz unterbricht die syntaktische Verbindung des hebräischen Satzes unnötig. Ein Semikolon erhält den aufzählenden, versfortsetzenden Charakter und ist im modernen Standarddeutsch natürlich. „Er war von dem Rest … übrig geblieben“ ist verständlich und bewahrt die im Hebräischen enthaltene Überlebensaussage ohne „allein“ hinzuzufügen.
  terminology: „Refaïter“ ist als etablierte deutsche Gruppenbezeichnung vertretbar; die Fußnote wahrt die lexikalische Alternative „Riesen“, ohne sie dem Haupttext aufzuzwingen. Die Namen Baschan, Aschtarot und Edrei sind geläufige deutsche Bibelformen.
