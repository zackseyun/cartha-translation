base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: de
  text: das ganze Königreich Ogs im Baschan, der in Aschtarot und Edrei herrschte; er war von dem Rest der Refaïter[a] übrig geblieben. Mose schlug sie und nahm ihnen ihren Besitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Riesen“. Hebräisch: „Refaïter“, wahrscheinlich der Name einer alten Volksgruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: das ganze Königreich Ogs im Baschan
  rationale: כָּל bei dem singularischen מַמְלְכוּת bezeichnet Ogs gesamtes Herrschaftsgebiet; בַּבָּשָׁן wird räumlich mit „im Baschan“ wiedergegeben.
- source_word: אֲשֶׁר מָלַךְ בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: der in Aschtarot und Edreï regiert hatte
  rationale: Das Relativpronomen bezieht sich auf Og. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass seine Herrschaft vor der beschriebenen Eroberung lag.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: Er war vom Rest der Refaïter übrig geblieben
  rationale: Die Formulierung bewahrt die Aussage des Nifal von שׁאר, ohne „allein“ hinzuzufügen. רְפָאִים bleibt als Bezeichnung einer alten Volksgruppe erhalten.
- source_word: וַיַּכֵּם מֹשֶׁה
  choice: Mose schlug sie
  rationale: נכה hat hier militärischen Sinn; „schlug sie“ bewahrt Bild und Härte des hebräischen Verbs sowie das pluralische Objekt.
- source_word: וַיֹּרִשֵׁם
  choice: und nahm ihnen ihr Land
  rationale: Der Hifil von ירשׁ bezeichnet hier das Entziehen des Besitzes. Die idiomatische deutsche Wendung bringt die Enteignung im Eroberungskontext klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von רְפָאִים
  choice: Refaïter
  alternative: Riesen
  rationale: Der hebräische Ausdruck kann als Name einer alten Volksgruppe verstanden werden. Die Transliteration hält diese Deutung offen und vermeidet, ihre Natur im Haupttext festzulegen; die traditionelle Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der versübergreifende Aufzählungscharakter des Anfangs bleibt durch die kleingeschriebene Fortsetzung „das ganze Königreich“ erhalten. Orts- und Personennamen werden in geläufiger deutscher Form wiedergegeben.
