  text: וְ/עַתָּ֗ה חַלֵּ֞ק אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את בְּ/נַחֲלָ֖ה לְ/תִשְׁעַ֣ת הַ/שְּׁבָטִ֑ים וַ/חֲצִ֖י הַ/שֵּׁ֥בֶט הַֽ/מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: de
  text: Nun teile dieses Land den neun Stämmen und dem halben Stamm Manasse als Erbbesitz zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und nun verteile dieses Land als Erbbesitz an die neun Stämme und die Hälfte des Stammes Manasse.“'
    reason: 'Lexikalische und syntaktische Alternative: וְעַתָּה kann ausdrücklich mit „Und nun“ wiedergegeben werden; außerdem lässt sich die Konstruktion mit בְּנַחֲלָה enger als „als Erbbesitz verteilen“ formulieren.'
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Leitet den nächsten Befehl in der Abfolge ein; „Nun“ ist im modernen Deutschen natürlich und bewahrt den Übergang.
- source_word: חַלֵּק
  choice: teile … zu
  rationale: Der Imperativ fordert Josua auf, das Land unter den Empfängern aufzuteilen; die trennbare Fügung „zuteilen“ gibt dies im Deutschen idiomatisch wieder.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: dieses Land
  rationale: Gibt das direkte Objekt schlicht und kontextgerecht wieder.
- source_word: בְּנַחֲלָה
  choice: als Erbbesitz
  rationale: Bewahrt den Gedanken eines rechtmäßig zugeteilten, bleibenden Erbanteils und die heilsgeschichtliche Resonanz des Ausdrucks.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: den neun Stämmen
  rationale: Der Dativ bezeichnet im Deutschen natürlich die Empfänger der Zuteilung.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: und dem halben Stamm
  rationale: Bezeichnet die anerkannte Hälfte des Stammes; diese Formulierung ist klarer und natürlicher als „der Hälfte des Stammes“.
- source_word: הַמְנַשֶּׁה
  choice: Manasse
  rationale: Der Personen- und Stammesname wird in seiner etablierten deutschen Form wiedergegeben.
