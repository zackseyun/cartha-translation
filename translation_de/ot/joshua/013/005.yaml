source:
  edition: WLC
  text: וְ/הָ/אָ֣רֶץ הַ/גִּבְלִ֗י וְ/כָל הַ/לְּבָנוֹן֙ מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ מִ/בַּ֣עַל גָּ֔ד תַּ֖חַת הַר חֶרְמ֑וֹן עַ֖ד לְב֥וֹא חֲמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: de
  text: und das Land der Gebaliter und den ganzen Libanon nach Osten hin, von Baal-Gad unterhalb des Berges Hermon bis Lebo-Hamat[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bis zum Zugang nach Hamat. Der hebräische Ausdruck kann statt als fester Ortsname auch als beschreibende Grenzangabe verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: das Land der Gebaliter
  rationale: Die Verbindung bezeichnet das Gebiet der mit Gebal verbundenen Bevölkerungsgruppe. „Land der Gebaliter“ ist im Deutschen verständlich und bewahrt den Bezug zum Ortsnamen.
- source_word: כָל הַלְּבָנוֹן
  choice: den ganzen Libanon
  rationale: Gibt die umfassende Bedeutung von כָל natürlich wieder; der Akkusativ fügt sich in die fortlaufende Aufzählung des Kontextes ein.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: nach Osten hin
  rationale: Die Wendung bezeichnet wörtlich die Richtung des Sonnenaufgangs. „Nach Osten hin“ gibt die geografische Orientierung in natürlichem modernem Deutsch wieder.
- source_word: מִבַּעַל גָּד
  choice: von Baal-Gad
  rationale: Der Ortsname wird transliteriert und die Ausgangsgrenze mit „von“ wiedergegeben.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: unterhalb des Berges Hermon
  rationale: תַּחַת beschreibt hier die niedrigere geografische Lage im Verhältnis zum Hermon, ohne die genaue Topografie näher festzulegen.
- source_word: עַד לְבוֹא חֲמָת
  choice: bis Lebo-Hamat
  rationale: Die Form kann als Grenzort verstanden werden und wird daher im Haupttext als Eigenname wiedergegeben; die ebenso mögliche beschreibende Lesart steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Richtungsangabe wird idiomatisch wiedergegeben; Orts- und Volksnamen bleiben erkennbar. Die im Hebräischen vorhandene Mehrdeutigkeit von לְבוֹא חֲמָת wird nicht aufgelöst, sondern durch eine Fußnote bewahrt.
