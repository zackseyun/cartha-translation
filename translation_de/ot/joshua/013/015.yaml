  language: de
  text: Und Mose gab dem Stamm der Söhne Rubens nach ihren Sippen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Stamm der Rubeniter“. Wörtlich steht im Hebräischen: „der Söhne Rubens“.'
