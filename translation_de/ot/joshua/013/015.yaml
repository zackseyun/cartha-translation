lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Und … gab
  rationale: Das Wayyiqtol von נתן führt die Erzählung fort; „Und … gab“ gibt die schlichte Abfolge wieder, ohne den Diskurswert zu überdeuten.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: לְמַטֵּה
  choice: dem Stamm
  rationale: מַטֶּה bezeichnet im Zusammenhang der Landzuteilung einen Stamm; das Präfix לְ markiert hier den Empfänger.
- source_word: בְנֵי רְאוּבֵן
  choice: der Söhne Rubens
  rationale: Die Formulierung bildet den hebräischen Verwandtschaftsausdruck wörtlich und im Deutschen verständlich ab; idiomatisch wäre auch „der Rubeniter“ möglich.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederungen des Stammes; „nach“ gibt die verteilende beziehungsweise ordnende Funktion von לְ in dieser Zuteilungsformel wieder.
