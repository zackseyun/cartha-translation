lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: Kirjatajim
  rationale: Ortsname; in einer im Deutschen gut lesbaren, quellennahen Form transliteriert.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Ortsname; שׂ wird mit deutschem s wiedergegeben, die Endung ohne zusätzliches h.
- source_word: צֶרֶת הַשַּׁחַר
  choice: Zeret-Schachar
  rationale: In der Ortsliste als zusammengesetzter Ortsname verstanden und daher transliteriert statt semantisch aufgelöst.
- source_word: בְּהַר הָעֵמֶק
  choice: auf dem Berg im Tal
  rationale: ב wird lokal mit „auf“ wiedergegeben; הַר bedeutet „Berg“ oder „Höhe“. Die Wiedergabe „im Tal“ bewahrt eine mögliche räumliche Deutung der knappen hebräischen Fügung und klingt im Deutschen natürlich.
