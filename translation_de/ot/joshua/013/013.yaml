  text: וְ/לֹ֤א הוֹרִ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/גְּשׁוּרִ֖י וְ/אֶת הַ/מַּעֲכָתִ֑י וַ/יֵּ֨שֶׁב גְּשׁ֤וּר וּ/מַֽעֲכָת֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/013.yaml
  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: de
  text: Doch die Israeliten vertrieben weder die Geschuriter noch die Maachatiter, und Geschur und Maachat wohnten bis zum heutigen Tag mitten unter Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt den kollektiven Ausdruck „Söhne Israels“ sachgerecht wieder.
- source_word: הוֹרִישׁוּ
  choice: vertrieben
  rationale: Im Hifil bezeichnet ירשׁ hier das Vertreiben beziehungsweise Enteignen der bisherigen Bewohner; „vertrieben“ passt zum Landnahme-Kontext.
- source_word: הַגְּשׁוּרִי ... הַמַּעֲכָתִי
  choice: die Geschuriter ... die Maachatiter
  rationale: Die gentilizischen Formen bezeichnen die Angehörigen der beiden Bevölkerungsgruppen.
- source_word: וַיֵּשֶׁב
  choice: blieben ... wohnen
  rationale: Das Singularverb steht bei den beiden zusammengefassten Kollektiven; „blieben ... wohnen“ drückt im Deutschen sowohl den fortdauernden Aufenthalt als auch den Gegensatz zur unterlassenen Vertreibung aus.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: mitten unter Israel
  rationale: Bewahrt das räumlich-soziale Bild von בקרב natürlicher als ein bloßes „bei Israel“.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Konventionelle, würdige Wiedergabe der zeitlichen Formel aus der Perspektive des Erzählers.
theological_decisions: []
