  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die kollektiv verwendeten Gebietsnamen Geschur und Maachat bleiben als Subjekte erhalten; der Satz löst die unterlassene Vertreibung nicht wertend oder theologisch weiter auf.
