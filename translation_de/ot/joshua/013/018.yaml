lexical_decisions:
- source_word: וְיַהְצָה
  choice: und Jahaz
  rationale: Ortsname in einer Städteliste; die Form „Jahaz“ entspricht einer gebräuchlichen modernen deutschen Namensform und gibt den Namen wieder, statt ihn zu deuten.
- source_word: וּקְדֵמֹת
  choice: Kedemot
  rationale: Der Ausdruck ist hier ein Ortsname. Er wird transliteriert und trotz möglicher Bezüge der Wortwurzel zu „Osten“ oder „Vorzeit“ nicht semantisch übersetzt.
- source_word: וּמֵפָעַת
  choice: und Mefaat
  rationale: Ortsname; „Mefaat“ ist eine klare, an moderne deutsche Umschrift angepasste Wiedergabe. Die traditionelle Schreibweise mit „ph“ wird in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Listenregister. Das erste hebräische Bindewort wird als Anschluss an den vorausgehenden Versbestandteil mit „und“ wiedergegeben; innerhalb der deutschen Aufzählung werden die weiteren Bindewörter idiomatisch reduziert, wobei vor dem letzten Namen „und“ steht.
