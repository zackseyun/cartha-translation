source:
  edition: WLC
  text: רַ֚ק לְ/שֵׁ֣בֶט הַ/לֵּוִ֔י לֹ֥א נָתַ֖ן נַחֲלָ֑ה אִשֵּׁ֨י יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: de
  text: Nur dem Stamm Levi gab er keinen Erbbesitz; die Feueropfer für Jahwe, den Gott Israels, sind sein Erbbesitz[a], wie er zu ihm geredet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere verstehen den Satz so: »Jahwe, der Gott Israels, ist sein Erbbesitz.«'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet Levi als Ausnahme von der vorausgehenden Landverteilung und bewahrt die einschränkende Funktion knapp und natürlich.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: dem Stamm Levi
  rationale: Der Dativ gibt לְ im Zusammenhang mit נָתַן idiomatisch wieder.
- source_word: לֹא נָתַן נַחֲלָה
  choice: gab er keinen Erbbesitz
  rationale: „Erbbesitz“ bezeichnet im Kontext präzise den zugeteilten Landanteil und ist verständlicher als das abstraktere „Erbteil“.
- source_word: אִשֵּׁי יְהוָה
  choice: die Feueropfer für Jahwe
  rationale: Bewahrt den Bezug von אִשֵּׁי auf durch Feuer dargebrachte Opfer; „für Jahwe“ gibt die Zugehörigkeit beziehungsweise Ausrichtung wieder, ohne sie vorschnell als Besitz Jahwes auszulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in gebräuchlicher deutscher Form wieder.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Natürliche Wiedergabe der Constructusverbindung als Apposition zu „Jahwe“.
- source_word: הוּא נַחֲלָתוֹ
  choice: sind sein Erbbesitz
  rationale: Bezieht das Prädikat gemäß der unmittelbaren Syntax auf die zuvor genannten Opfer; der deutsche Plural folgt dem Bezugswort. Die alternative Beziehung auf Jahwe wird in der Fußnote bewahrt.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: wie er zu ihm geredet hatte
  rationale: Bewahrt das Verb „reden“ statt des deutenderen „versprechen“; das Plusquamperfekt macht den Rückbezug im deutschen Erzählzusammenhang deutlich. Das Singularpronomen bleibt erhalten.
theological_decisions:
- issue: Worin Levis Erbbesitz besteht
  choice: Die Feueropfer für Jahwe sind sein Erbbesitz.
  alternative: Jahwe, der Gott Israels, ist sein Erbbesitz.
  rationale: Die unmittelbare Wortfolge legt als Hauptlesart den Rückbezug auf die Feueropfer nahe. Wegen des singularischen הוּא und verwandter Aussagen im Kontext ist die Beziehung auf Jahwe jedoch ernst zu nehmen und wird deshalb als echte Auslegungsalternative in einer Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbbesitz“ hält den Bezug zur Landzuteilung fest; „Feueropfer“ ist lexikalisch nah am Hebräischen. Die syntaktisch und theologisch bedeutsame Alternativlesart wird nicht stillschweigend aufgelöst.
