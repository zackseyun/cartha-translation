- from: Alle Bewohner des Berglands vom Libanon bis Misrefot-Majim[a], alle Sidonier – ich selbst werde sie vor den Israeliten vertreiben.[b] Du aber sollst das Land Israel als Erbbesitz zuteilen,[c] wie ich dir geboten habe.
  to: Alle Bewohner des Berglands vom Libanon bis Misrefot-Majim[a], alle Sidonier – ich selbst werde sie vor den Israeliten vertreiben.[b] Teile es Israel aber als Erbbesitz zu,[c] wie ich dir geboten habe.
  rationale: Die Revision beseitigt die Mehrdeutigkeit von „das Land Israel“, indem sie das im Hebräischen enthaltene Objekt mit „es“ aufnimmt und Israel eindeutig als Empfänger der Zuteilung bezeichnet. Die Stellung von „aber“ lässt die durch רַק markierte Einschränkung erkennen, ohne den deutschen Satz unnatürlich zu machen. Die Fußnoten werden sprachlich präzisiert; die Unsicherheit der Ortsnamensdeutung bleibt ausdrücklich gewahrt.
