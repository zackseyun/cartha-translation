  naturalness: 'Der Satz „Du aber sollst das Land Israel als Erbbesitz zuteilen“ ist syntaktisch mehrdeutig: „das Land Israel“ kann als Bezeichnung für das Land Israels gelesen werden, während das hebräische Suffix „es“ meint. „Teile es Israel aber als Erbbesitz zu“ ist klarer und idiomatisch. Die alternative Fußnote mit „enteignen“ wirkt im Deutschen juristisch-modern und weniger natürlich.'
  terminology: „Bergland“, „Sidonier“, „Israeliten“ und „Erbbesitz“ sind hier angemessen. Die Transliteration Misrefot-Majim kann beibehalten werden. Die Namensdeutung in Fußnote a sollte nicht mit dem unidiomatischen Kompositum „Wasserverbrennungen“ formuliert werden.
