id: JOS.13.6
reference: Joshua 13:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: de
  text: Alle Bewohner des Berglands vom Libanon bis Misrefot-Majim[a], alle Sidonier – ich selbst werde sie vor den Israeliten vertreiben.[b] Teile es Israel aber als Erbbesitz zu,[c] wie ich dir geboten habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrefot-Majim ist ein Ortsname. Der Name könnte etwa „Verbrennungsstätten am Wasser“ bedeuten; seine genaue Bedeutung ist jedoch unsicher.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ich selbst werde sie vor den Israeliten aus ihrem Besitz vertreiben.“'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb gehört zur Ausdrucksweise der Landzuteilung, die häufig durch das Los erfolgte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: Bewohner des Berglands
  rationale: Der Ausdruck bezeichnet in diesem geografischen Zusammenhang die Bevölkerung einer Bergregion, nicht die Bewohner eines einzelnen Berges.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: vom Libanon bis Misrefot-Majim
  rationale: Beide Ausdrücke sind geografische Namen. Misrefot-Majim wird transliteriert, da die mögliche Namensbedeutung unsicher ist.
- source_word: כָּל צִידֹנִים
  choice: alle Sidonier
  rationale: Die Form bezeichnet kollektiv die sidonische Bevölkerung und bewahrt mit „alle“ die Kraft von כָּל.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: ich selbst werde sie … vertreiben
  rationale: Das selbstständige Pronomen אָנֹכִי ist betont; der Hifil von ירשׁ bedeutet hier, die Bewohner aus ihrem Land zu vertreiben beziehungsweise zu enteignen.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: Die wörtliche Wendung „vor den Söhnen Israels“ beschreibt ihre vorrückende Gegenwart. „Israeliten“ gibt den etablierten Volksnamen im Deutschen natürlich und präzise wieder.
- source_word: רַק
  choice: Du aber
  rationale: רַק setzt die göttliche Zusage begrenzend der Aufgabe Josuas gegenüber. Im Deutschen vermittelt „aber“ diesen Übergang natürlich; „du“ macht den im Verb enthaltenen Adressaten sichtbar.
- source_word: הַפִּלֶהָ
  choice: sollst das Land … zuteilen
  rationale: Der Hifil-Imperativ von נפל gehört zur Los- und Landverteilungsidiomatik. Das feminine Suffix bezieht sich auf das Land; „zuteilen“ gibt den Sinn verständlich wieder, ohne das Losverfahren im Haupttext zwingend festzulegen.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: Israel als Erbbesitz
  rationale: נַחֲלָה bezeichnet hier das dauerhaft zugewiesene Land. „Erbbesitz“ bewahrt sowohl den rechtlichen Besitz- als auch den Erbcharakter.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: wie ich dir geboten habe
  rationale: Das Perfekt verweist auf einen bereits erteilten und weiterhin maßgeblichen Befehl.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische Wendung ist ein konventioneller Volksname. „Israeliten“ ist im modernen Deutschen sachlich deckungsgleich, natürlich und bezeichnet das gesamte Volk, ohne die historische Abstammungsbezeichnung umzudeuten.
- issue: Wiedergabe von נַחֲלָה im Kontext der Landverteilung
  choice: Erbbesitz
  alternative: Erbe; Besitz
  rationale: „Erbbesitz“ bewahrt die rechtliche und generationenübergreifende Dimension des von Gott zugeteilten Landes, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
- issue: Verhältnis zwischen göttlicher Vertreibung und Josuas Zuteilungsauftrag
  choice: Gottes Zusage und Josuas Auftrag bleiben nebeneinander stehen
  alternative: Die Vertreibung als bereits vollständig vollzogen darstellen
  rationale: Der Vers verbindet Gottes zukünftiges Handeln mit dem gegenwärtigen Auftrag zur Landzuteilung. Diese Spannung wird nicht zeitlich oder theologisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die emphatische göttliche Zusage hervor. „Bergland“, „Israeliten“, „Erbbesitz“ und „zuteilen“ sind allgemein verständlich und zugleich sachlich präzise. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
