  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: de
  text: und Bet-Peor, die Abhänge[a] des Pisga und Bet-Jeschimot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Quellen« beziehungsweise »die Vorberge des Pisga«. Das hebräische Wort lässt mehrere topografische Deutungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: Bet-Peor
  rationale: Ein Ortsname; die im Deutschen eingebürgerte Transliteration wahrt den Namenscharakter, statt die Bestandteile wörtlich als »Haus Peors« wiederzugeben.
- source_word: אַשְׁדּוֹת
  choice: Abhänge
  rationale: In dieser geografischen Aufzählung bezeichnet das Wort wahrscheinlich die abfallenden Hänge des Pisga. »Abhänge« ist verständlich und lässt den topografischen Bezug klar erkennen; andere Deutungen werden in der Fußnote genannt.
- source_word: הַפִּסְגָּה
  choice: des Pisga
  rationale: Das Wort wird hier als geografischer Eigenname verstanden. Der hebräische Artikel muss bei einem deutschen Eigennamen nicht eigens wiedergegeben werden.
- source_word: בֵית הַיְשִׁמוֹת
  choice: Bet-Jeschimot
  rationale: Ein Ortsname; die Transliteration entspricht üblicher deutscher Bibelnamenschreibung und vermeidet eine irreführende wörtliche Übersetzung.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch für eine fortlaufende Ortsliste. Die wiederholten hebräischen Konjunktionen werden in natürlichem Deutsch durch Kommas und ein abschließendes »und« wiedergegeben. Der Fußnotenmarker steht bei »Abhänge des Pisga«, da sich die lexikalische Alternative auf אַשְׁדּוֹת bezieht.
