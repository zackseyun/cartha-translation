  yaml_path: translation/ot/joshua/013/028.yaml
  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: de
  text: 'Das war der Erbbesitz der Nachkommen Gads nach ihren Sippen: die Städte und ihre Dörfer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist der Erbbesitz der Nachkommen Gads nach ihren Sippen: die Städte und ihre Dörfer.“ Die hebräische Zusammenfassungsformel kann im Deutschen mit Gegenwarts- oder Vergangenheitsbezug wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Das war
  rationale: Das feminine Demonstrativpronomen verweist zusammenfassend auf den zuvor beschriebenen Landanteil. Im deutschen Erzählzusammenhang ist das Präteritum natürlich; das Hebräische lässt jedoch auch eine präsentische Wiedergabe zu.
- source_word: נַחֲלַת
  choice: der Erbbesitz
  rationale: נַחֲלָה bezeichnet hier den als bleibenden Besitz zugeteilten Landanteil. „Erbbesitz“ bewahrt sowohl den Gedanken der Zuteilung als auch den des vererbbaren Besitzes.
- source_word: בְּנֵי גָד
  choice: der Nachkommen Gads
  rationale: Die wörtliche Wendung „Söhne Gads“ ist eine genealogische Stammesbezeichnung. „Nachkommen Gads“ gibt ihre Bedeutung im modernen Deutsch klar und würdig wieder.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: Das Präfix לְ kennzeichnet hier die Gliederung beziehungsweise Verteilung; מִשְׁפָּחוֹת sind größere Familienverbände innerhalb des Stammes. „Nach ihren Sippen“ ist knapp und präzise.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עָרִים ist in den Gebietslisten die übliche Bezeichnung für befestigte oder größere bewohnte Orte; „Städte“ entspricht dem konventionellen deutschen Ausdruck.
- source_word: וְחַצְרֵיהֶם
  choice: mit den zugehörigen Dörfern
  rationale: חֲצֵרִים bezeichnet in dieser Gebietsformel kleinere, von den Städten abhängige ländliche Siedlungen. „Zugehörige Dörfer“ macht diese Beziehung im Deutschen deutlich; „mit“ gibt das koordinierende וְ idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Nachkommen“ vermeidet den heute missverständlichen Eindruck, es seien nur unmittelbare Söhne gemeint; „Sippen“ bewahrt die stammesgeschichtliche Gliederung. Der Doppelpunkt bildet die zusammenfassende Apposition des Hebräischen ab.
