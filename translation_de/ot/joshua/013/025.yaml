source:
  edition: WLC
  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: de
  text: Ihr Gebiet umfasste Jaser, alle Städte Gileads und die Hälfte des Landes der Ammoniter bis nach Aroër, das Rabba gegenüberliegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Rabba zugewandt liegt“. Wörtlich: „das vor Rabba liegt“.'
    reason: Die hebräische räumliche Wendung עַל־פְּנֵי lässt mehrere eng verwandte Wiedergaben zu; eine bestimmte Himmelsrichtung wird nicht genannt.
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Ihr Gebiet umfasste
  rationale: גְּבוּל kann eine Grenze oder das von ihr umschlossene Gebiet bezeichnen. Da anschließend die zum Erbteil gehörenden Orte und Landstriche aufgezählt werden, gibt „Gebiet“ den Zusammenhang natürlich wieder; „umfasste“ bildet die aufzählende Konstruktion idiomatisch ab.
- source_word: יַעְזֵר
  choice: Jaser
  rationale: Im Deutschen gebräuchliche Wiedergabe des Ortsnamens.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: alle Städte Gileads
  rationale: עָרֵי bezeichnet Städte oder Ortschaften. „Städte“ entspricht dem gehobenen Register einer territorialen Aufzählung; der Genitiv „Gileads“ ist knapp und natürlich.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: und die Hälfte des Landes der Ammoniter
  rationale: בְּנֵי עַמּוֹן ist die übliche ethnische Bezeichnung für die Ammoniter; אֶרֶץ meint hier ihr Land beziehungsweise Gebiet.
- source_word: עַד עֲרוֹעֵר
  choice: bis nach Aroër
  rationale: עַד kennzeichnet die räumliche Ausdehnungsgrenze. Bei einem Ortsnamen ist „bis nach“ im modernen Deutschen idiomatisch.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: das Rabba gegenüberliegt
  rationale: Die räumliche Wendung עַל־פְּנֵי kann „vor“, „gegenüber“ oder „zugewandt“ bedeuten. „Gegenüberliegt“ wahrt die räumliche Beziehung, ohne eine im Hebräischen nicht ausdrücklich genannte Himmelsrichtung einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, klare Standardsprache mit würdigem Ton. Die territoriale Listenform bleibt erkennbar, während „Ihr Gebiet umfasste“ gegenüber einer wörtlichen Grenzformel im Deutschen natürlicher klingt. Die Ortsnamen folgen gebräuchlichen deutschen Bibelformen.
