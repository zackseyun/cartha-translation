  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: de
  text: 'dazu alle Städte der Hochebene[a] und das ganze Königreich Sihons, des Königs der Amoriter, der in Heschbon regierte, den Mose besiegte[b] – ihn und die Oberhäupter Midians: Ewi, Rekem, Zur, Hur und Reba, die Fürsten Sihons[c], die im Land wohnten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Städte der Ebene“ beziehungsweise „Städte des Tafellandes“. Gemeint ist das ebene Hochland östlich des Jordan.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „schlug“. Im militärischen Zusammenhang kann dies eine entscheidende Niederlage bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen stehen zwei verschiedene Rangbezeichnungen: „Oberhäupter Midians“ (נְשִׂיאֵי) und „Fürsten Sihons“ (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: Städte der Hochebene
  rationale: מִישׁוֹר bezeichnet hier das ebene Hochland beziehungsweise die Hochebene im Ostjordanland. „Hochebene“ gibt sowohl die ebene Beschaffenheit als auch die regionale Topografie natürlich wieder.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: Königreich Sihons
  rationale: מַמְלְכוּת bezeichnet das Königreich oder Herrschaftsgebiet; „Königreich“ ist die direkte und geläufige Wiedergabe.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: König der Amoriter
  rationale: Die Konstruktion wird formal und idiomatisch als Zugehörigkeitsbezeichnung wiedergegeben.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: der in Heschbon regiert hatte
  rationale: מָלַךְ bedeutet als König herrschen oder regieren. Das Plusquamperfekt verdeutlicht im Deutschen, dass diese Herrschaft der anschließend berichteten Niederlage vorausging.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: Ihn hatte Mose besiegt
  rationale: נכה kann wörtlich „schlagen“ bedeuten, bezeichnet im militärischen Zusammenhang aber eine entscheidende Niederlage. Die Voranstellung von „Ihn“ nimmt das hebräische Bezugspronomen sichtbar auf.
- source_word: נְשִׂיאֵי מִדְיָן
  choice: Stammesoberhäupter von Midian
  rationale: נָשִׂיא bezeichnet einen führenden Repräsentanten oder Häuptling. „Stammesoberhäupter“ ist im Kontext Midians verständlich und hält den Ausdruck vom folgenden נְסִיכֵי auseinander.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: Ewi, Rekem, Zur, Hur und Reba
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltransliteration wiedergegeben.
- source_word: נְסִיכֵי סִיחוֹן
  choice: Sihon unterstellte Fürsten
  rationale: נְסִיכִים bezeichnet Fürsten beziehungsweise Herrscher. Die knappe Genitivverbindung kann Zugehörigkeit oder Unterordnung ausdrücken; die Formulierung macht die politische Zuordnung verständlich, ohne sie mit den zuvor genannten Stammesoberhäuptern gleichzusetzen.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: lebten in diesem Land
  rationale: Das Partizip von ישׁב bezeichnet ansässiges Wohnen. „lebten“ ist modernes Deutsch; „diesem“ nimmt idiomatisch auf das soeben beschriebene Gebiet Bezug.
