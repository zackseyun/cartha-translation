source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מִ/מַּחֲנַ֨יִם כָּֽל הַ/בָּשָׁ֜ן כָּֽל מַמְלְכ֣וּת ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן וְ/כָל חַוֺּ֥ת יָאִ֛יר אֲשֶׁ֥ר בַּ/בָּשָׁ֖ן שִׁשִּׁ֥ים עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: de
  text: Ihr Gebiet umfasste von Mahanajim aus ganz Baschan, das ganze Königreich Ogs, des Königs von Baschan, und alle Dörfer Jairs[a] in Baschan – sechzig Städte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als überlieferter Ortsname: „Hawwot-Jair“; wörtlich etwa „Zeltdörfer Jairs“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die knappe hebräische Satzfügung lässt sich auch formnäher wiedergeben: „Ihr Gebiet war von Mahanajim aus: ganz Baschan …“'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: גְבוּלָם
  choice: ihr Gebiet
  rationale: גְּבוּל kann eine Grenzlinie oder das dadurch bestimmte Gebiet bezeichnen. Im Zusammenhang der Landzuteilung ist „Gebiet“ im Deutschen am treffendsten.
- source_word: מִמַּחֲנַיִם
  choice: von Mahanajim aus
  rationale: מִן bezeichnet hier den Ausgangspunkt der Gebietsbeschreibung. Der Ortsname wird in einer im Deutschen geläufigen Umschrift wiedergegeben.
- source_word: כָּל הַבָּשָׁן
  choice: ganz Baschan
  rationale: Die Wiedergabe bewahrt die umfassende Bedeutung von כָּל und klingt als geografische Angabe natürlich.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: das ganze Königreich Ogs, des Königs von Baschan
  rationale: מַמְלְכוּת bezeichnet das Königreich beziehungsweise Herrschaftsgebiet; die Apposition zu Og wird im Deutschen ausdrücklich markiert.
- source_word: חַוּוֹת יָאִיר
  choice: die Dörfer Jairs
  rationale: חַוּוֹת bezeichnet hier kleinere Siedlungen beziehungsweise Zeltdörfer. „Dörfer Jairs“ ist klar und idiomatisch; die traditionelle Umschrift wird in der Fußnote genannt.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: in Baschan
  rationale: Die knappe deutsche Ortsangabe gibt den Sinn des Relativsatzes natürlich wieder, ohne zusätzliche zeitliche Festlegung.
- source_word: שִׁשִּׁים עִיר
  choice: sechzig Städte
  rationale: עִיר kann Stadt oder Ortschaft bedeuten. „Städte“ entspricht der üblichen Wiedergabe in Gebietslisten, ohne zwingend moderne Großstädte zu bezeichnen.
theological_decisions:
- issue: Syntaktisches Verhältnis von „von Mahanajim aus“ zu „ganz Baschan“
  choice: „umfasste von Mahanajim aus ganz Baschan“
  alternative: '„war von Mahanajim aus: ganz Baschan“'
  rationale: Die hebräische Reihung ist knapp und lässt das genaue Verhältnis des Ausgangspunkts zur anschließenden Gebietsaufzählung offen. Die Hauptfassung ist verständliches Deutsch; die formnähere Möglichkeit bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geografische Aufzählung bleibt kompakt; der Gedankenstrich hebt die abschließende Gesamtzahl hervor.
