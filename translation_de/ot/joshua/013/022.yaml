  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: de
  text: Auch Bileam, den Sohn Beors, den Wahrsager, töteten die Israeliten mit dem Schwert, zusammen mit ihren Erschlagenen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schlusswendung ist ungewöhnlich. Möglich sind auch: „unter ihren Erschlagenen“ oder „bei ihren Erschlagenen“; sie ordnet Bileams Tod den von Israel Erschlagenen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Auch
  rationale: וְ führt Bileam als weiteres Opfer in der Aufzählung ein; אֶת kennzeichnet nur das direkte Objekt und wird im Deutschen nicht eigens wiedergegeben.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Bileam, den Sohn Beors
  rationale: Der Personenname und das hebräische Patronym werden nach üblicher deutscher Konvention wiedergegeben; der Akkusativ folgt der Satzkonstruktion.
- source_word: הַקּוֹסֵם
  choice: den Wahrsager
  rationale: קֹסֵם bezeichnet einen Menschen, der Wahrsagung beziehungsweise Divination betreibt. »Wahrsager« ist im heutigen Deutsch verständlich und bewahrt die im Kontext negative Bezeichnung.
- source_word: הָרְגוּ בְנֵי יִשְׂרָאֵל
  choice: töteten die Israeliten
  rationale: הרג bedeutet hier schlicht »töten«. בְנֵי יִשְׂרָאֵל bezeichnet in diesem erzählerischen Zusammenhang das Volk beziehungsweise seine kämpfenden Angehörigen; »die Israeliten« ist natürliches Standarddeutsch.
- source_word: בַּחֶרֶב
  choice: mit dem Schwert
  rationale: Der instrumentale Gebrauch von ב wird direkt und idiomatisch mit »mit« wiedergegeben.
- source_word: אֶל חַלְלֵיהֶם
  choice: zusammen mit den anderen, die sie erschlagen hatten
  rationale: Die ungewöhnliche Verbindung mit אֶל bezeichnet hier offenbar Zuordnung beziehungsweise Begleitung zu den von Israel Erschlagenen. Die Formulierung macht den Bezug des Suffixes verständlich, ohne eine ungesicherte zeitliche oder räumliche Präzisierung einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung behält Bileam als hervorgehobenes Objekt bei. »Israeliten« ist gegenüber dem im Deutschen unnatürlichen »Söhne Israels« bevorzugt; die ungewöhnliche Schlusswendung wird im Text verständlich formuliert und in der Fußnote formal näher ausgewiesen.
