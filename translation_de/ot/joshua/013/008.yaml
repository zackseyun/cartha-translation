id: JOS.13.8
reference: Joshua 13:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: de
  text: Zusammen mit ihm[a] hatten die Rubeniter und die Gaditer ihren Erbbesitz erhalten, den Mose ihnen jenseits des Jordan im Osten gegeben hatte, so wie Mose, der Diener Jahwes, ihn ihnen gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ihm“ bezieht sich wahrscheinlich auf den zuvor genannten halben Stamm Manasse.
    reason: Mehrdeutiger Rückbezug des hebräischen Pronomens; der unmittelbare Kontext legt den halben Stamm Manasse nahe.
lexical_decisions:
- source_word: עִמּוֹ
  choice: Zusammen mit ihm
  rationale: Das maskuline Suffix verweist im Zusammenhang am ehesten auf den zuvor genannten halben Stamm Manasse. Die Formulierung bewahrt diesen Personen- bzw. Stammesbezug.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: die Rubeniter und die Gaditer
  rationale: Die morphologisch singularischen Stammesbezeichnungen werden kollektiv gebraucht; im Deutschen ist der Stammesplural natürlich.
- source_word: לָקְחוּ
  choice: hatten … erhalten
  rationale: Das Verb kann „nehmen“ oder „empfangen/erhalten“ bedeuten. Beim Erbbesitz ist „erhalten“ natürlich und macht deutlich, dass das Land zugeteilt wurde; das Plusquamperfekt bildet die zeitliche Vorordnung zum gegenwärtigen Erzählabschnitt ab.
- source_word: נַחֲלָתָם
  choice: ihren Erbbesitz
  rationale: „Erbbesitz“ bezeichnet knapp und verständlich den als bleibendes Erbteil zugewiesenen Landbesitz.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: jenseits des Jordan im Osten
  rationale: Die traditionelle Wendung „jenseits des Jordan“ bleibt erhalten; „im Osten“ klärt ausdrücklich, dass die Ostseite gemeint ist.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: „Diener“ gibt den Ehrentitel Moses natürlich wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von עִמּוֹ
  choice: mit ihm, bezogen auf den zuvor genannten halben Stamm Manasse
  alternative: mit ihm/ihm zusammen ohne eindeutige Auflösung oder „mit diesem“
  rationale: Das maskuline Suffix legt diesen Rückbezug im Kontext nahe, auch wenn der knappe Versanfang ohne den vorhergehenden Vers mehrdeutig wirken kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Plusquamperfekt verdeutlicht, dass die Landzuteilung östlich des Jordan bereits durch Mose erfolgt war. Die Wiederholung von „gegeben hatte“ entspricht der auffälligen Wiederholung im Hebräischen und wurde nicht geglättet.
