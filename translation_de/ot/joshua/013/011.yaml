  text: וְ/הַ/גִּלְעָ֞ד וּ/גְב֧וּל הַ/גְּשׁוּרִ֣י וְ/הַ/מַּעֲכָתִ֗י וְ/כֹ֨ל הַ֥ר חֶרְמ֛וֹן וְ/כָל הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: de
  text: und Gilead, das Gebiet der Geschuriter und Maachatiter, das ganze Hermongebirge[a] und ganz Baschan bis Salcha –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „den ganzen Berg Hermon“; gemeint sein kann das gesamte Hermonmassiv oder Bergland, nicht nur ein einzelner Gipfel.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Der bestimmte Artikel wird bei dem etablierten deutschen Gebietsnamen idiomatisch nicht wiedergegeben.
- source_word: גְבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: das Gebiet der Geschuriter und Maachatiter
  rationale: גְּבוּל kann eine Grenzlinie oder ein abgegrenztes Gebiet bezeichnen. In dieser Aufzählung eroberter beziehungsweise zugeteilter Landschaften passt die territoriale Bedeutung am besten; die singularischen Gentilizia werden im Deutschen natürlich kollektiv im Plural wiedergegeben.
- source_word: כֹל הַר חֶרְמוֹן
  choice: das ganze Hermongebirge
  rationale: הַר kann sowohl einen einzelnen Berg als auch Bergland beziehungsweise ein Gebirge bezeichnen. Zusammen mit כֹל bezeichnet es hier wahrscheinlich das gesamte Hermonmassiv; „Hermongebirge“ gibt diesen räumlichen Umfang natürlich wieder.
- source_word: כָל הַבָּשָׁן
  choice: ganz Baschan
  rationale: Der etablierte Gebietsname steht im Deutschen ohne Artikel; „ganz“ bewahrt die umfassende Aussage von כָּל.
- source_word: עַד סַלְכָה
  choice: bis Salcha
  rationale: עַד kennzeichnet die räumliche Grenze; „bis“ ist dafür die knappe und natürliche deutsche Entsprechung.
