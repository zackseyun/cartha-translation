base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: de
  text: vom Süden her[a] das ganze Land der Kanaaniter, dazu Meara[b], das den Sidoniern gehört, bis nach Afek, bis an die Grenze der Amoriter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Teman“. Das hebräische Wort kann den Süden bezeichnen oder als Ortsname verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Höhle, die den Sidoniern gehört“, wenn מְעָרָה als Gattungswort und nicht als Ortsname verstanden wird.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen stehen „Kanaaniter“ und „Amoriter“ jeweils im Singular, sind hier aber kollektiv gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: vom Süden her
  rationale: תֵּימָן bezeichnet häufig den Süden beziehungsweise das Südland. In dieser Gebietsbeschreibung ist die geografische Richtungsangabe am wahrscheinlichsten; die mögliche Auffassung als Ortsname bleibt in einer Fußnote erhalten.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: das ganze Land der Kanaaniter
  rationale: Der hebräische Singular der Volksbezeichnung hat hier kollektive Bedeutung. Der deutsche Plural gibt diesen Sinn natürlich wieder, ohne die Wendung zum weniger genauen „Land Kanaan“ umzudeuten.
- source_word: וּמְעָרָה
  choice: dazu Meara
  rationale: Die Form wird im Zusammenhang der Gebietsaufzählung am ehesten als Ortsname verstanden. „Dazu“ verbindet den weiteren Gebietspunkt idiomatisch; die mögliche Bedeutung als Gattungswort „Höhle“ wird in einer Fußnote genannt.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: das den Sidoniern gehört
  rationale: Die Konstruktion mit ל drückt hier Zugehörigkeit oder Besitz aus. Die Formulierung ist modern und bewahrt diese Aussage.
- source_word: עַד אֲפֵקָה
  choice: bis nach Afek
  rationale: עַד bezeichnet die räumliche Erstreckung bis zu einem Zielpunkt; die Richtungsendung am Ortsnamen wird durch „nach“ angemessen wiedergegeben.
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: bis an die Grenze der Amoriter
  rationale: גְּבוּל bezeichnet in der Gebietsbeschreibung eine Grenze. Der hebräische Singular der Volksbezeichnung wird seinem kollektiven Sinn entsprechend als deutscher Plural wiedergegeben.
