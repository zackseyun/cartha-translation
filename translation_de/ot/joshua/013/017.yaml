source:
  edition: WLC
  text: חֶשְׁבּ֥וֹן וְ/כָל עָרֶ֖י/הָ אֲשֶׁ֣ר בַּ/מִּישֹׁ֑ר דִּיבוֹן֙ וּ/בָמ֣וֹת בַּ֔עַל וּ/בֵ֖ית בַּ֥עַל מְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: de
  text: 'Heschbon und alle seine Städte, die auf der Hochebene[a] liegen: Dibon, Bamot-Baal und Bet-Baal-Meon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »in der Ebene« beziehungsweise »im Tafelland«. Das hebräische Wort bezeichnet hier die ebene Hochlandregion östlich des Jordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Heschbon
  rationale: Der Ortsname wird in einer im Deutschen gebräuchlichen, dem Hebräischen angenäherten Form wiedergegeben.
- source_word: וְכָל עָרֶיהָ
  choice: und alle seine Städte
  rationale: Das feminine Suffix bezieht sich auf Heschbon als Stadt; im Deutschen ist beim Ortsnamen das Possessivpronomen „seine“ idiomatisch.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: die auf der Hochebene liegen
  rationale: מִישׁוֹר bezeichnet hier die ebene, hoch gelegene Landschaft im Ostjordanland und nicht zwingend eine tiefliegende Ebene.
- source_word: דִּיבוֹן
  choice: Dibon
  rationale: Der Ortsname wird transliteriert.
- source_word: וּבָמוֹת בַּעַל
  choice: Bamot-Baal
  rationale: Im Kontext handelt es sich um einen zusammengesetzten Ortsnamen, nicht um die zu übersetzende Sachbezeichnung „Höhen des Baal“.
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: und Bet-Baal-Meon
  rationale: Der zusammengesetzte Ortsname wird transliteriert; בֵּית bleibt als Namensbestandteil „Bet“ erhalten und wird nicht mit „Haus“ übersetzt.
theological_decisions: []
