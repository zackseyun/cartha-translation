    issue: Mehrdeutiger und grammatisch unpassender Rückbezug in „Er fiel … zu“
    rationale: Das eingefügte Wort „Anteil“ ist maskulin; daher kann „Er“ zwar formal darauf zielen, steht aber zugleich nach „Mose“ und „Stammes Manasse“ und lässt den Satz unnötig mehrdeutig. Die hebräische Formel bezieht sich auf die allotierte Sache, nicht auf Mose.
  revised_text: 'Mose gab der Hälfte des Stammes Manasse ein Erbteil; es war für die Hälfte des Stammes der Söhne Manasses[a] bestimmt, nach ihren Sippen:'
