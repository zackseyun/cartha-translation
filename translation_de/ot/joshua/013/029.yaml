  text: וַ/יִּתֵּ֣ן מֹשֶׁ֔ה לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ/יְהִ֗י לַ/חֲצִ֛י מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: de
  text: 'Mose gab der Hälfte des Stammes Manasse ein Erbteil; es war für die Hälfte des Stammes der Söhne Manasses[a] bestimmt, nach ihren Sippen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Söhne Manasses“; die hebräische Verwandtschaftsbezeichnung meint hier die Stammesnachkommen Manasses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: נתן bedeutet im Zusammenhang der Landverteilung schlicht „geben“; das im Hebräischen nicht genannte Objekt wird aus dem Kontext als „Anteil“ ergänzt.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: der Hälfte des Stammes Manasse
  rationale: חֲצִי bezeichnet die Hälfte, שֵׁבֶט hier die Stammesgemeinschaft. Diese Formulierung ist im Deutschen klarer als das mögliche Kompositum „Halbstamm“.
- source_word: וַיְהִי
  choice: Er fiel … zu
  rationale: Die Wendung hat in diesem Verteilungskontext eine zuweisende Bedeutung. Das Pronomen nimmt den aus dem Zusammenhang erschlossenen Anteil auf, ohne die knappe hebräische Aussage unnötig auszubauen.
- source_word: מַטֵּה
  choice: Stamm
  rationale: מַטֶּה bezeichnet hier nicht einen Stab, sondern wie שֵׁבֶט eine Stammesgemeinschaft.
- source_word: בְנֵי מְנַשֶּׁה
  choice: Söhne Manasses
  rationale: Die hebräische Verwandtschaftsbezeichnung wird formal bewahrt; gemeint sind im Zusammenhang die Stammesnachkommen Manasses.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet die Sippen als Untergliederungen des Stammes; לְ hat hier verteilende bzw. ordnende Funktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Verteilungsformel wird durch „ihren Anteil“ und den Rückbezug „Er fiel … zu“ verständlich gemacht; der abschließende Doppelpunkt bleibt erhalten, weil der folgende Vers den zugewiesenen Bereich beschreibt.
