  source_fidelity: 'Der Entwurf gibt die hebräische Zuteilungsformel vollständig wieder: וַיִּתֵּן als „gab“, לְמַטֵּה גָד als „dem Stamm Gad“, die wiederholende Apposition לִבְנֵי גָד als „den Nachkommen Gads“ und den distributiven Bezug לְמִשְׁפְּחֹתָם als „ihren Sippen entsprechend“. Der im Hebräischen nicht ausgedrückte Gegenstand des Gebens wird zutreffend nicht ergänzt.'
