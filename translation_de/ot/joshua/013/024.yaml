  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: de
  text: Und Mose gab dem Stamm Gad, den Nachkommen Gads, ihren Sippen entsprechend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Das Waw-Konsekutiv von נתן bezeichnet im Zusammenhang der Landverteilung das Geben beziehungsweise Zuweisen; „gab“ bildet die hebräische Formulierung direkt ab, deren Gegenstand unausgesprochen bleibt.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Namensform.
- source_word: לְמַטֵּה גָד
  choice: dem Stamm Gad
  rationale: מַטֶּה bedeutet hier im Zusammenhang der Stammesgebiete eindeutig „Stamm“, nicht wörtlich „Stab“.
- source_word: לִבְנֵי גָד
  choice: den Nachkommen Gads
  rationale: בְּנֵי bedeutet wörtlich „Söhne“, bezeichnet in dieser stammesgenealogischen Formel jedoch die Angehörigen beziehungsweise Nachkommen Gads. „Nachkommen“ gibt den gemeinten Gruppenbezug im heutigen Deutsch natürlich wieder.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ihren Sippen entsprechend
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederungen des Stammes; die Präposition לְ hat in der Verteilungsformel distributiven Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „dem Stamm Gad, den Nachkommen Gads“ bleibt erhalten, weil sie zur hebräischen Zuteilungsformel gehört. „Sippen“ ist in diesem stammesgeschichtlichen Kontext präziser als das enger wirkende „Familien“.
