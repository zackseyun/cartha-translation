  text: וַ/חֲצִ֤י הַ/גִּלְעָד֙ וְ/עַשְׁתָּר֣וֹת וְ/אֶדְרֶ֔עִי עָרֵ֛י מַמְלְכ֥וּת ע֖וֹג בַּ/בָּשָׁ֑ן לִ/בְנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה לַ/חֲצִ֥י בְנֵֽי מָכִ֖יר לְ/מִשְׁפְּחוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: de
  text: und die Hälfte von Gilead sowie Aschtarot und Edreï, die Städte des Königreichs Ogs in Baschan. Dies fiel den Söhnen Machirs, des Sohnes Manasses, zu, und zwar der Hälfte der Söhne Machirs[a], nach ihren Sippen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Söhnen Machirs« können im weiteren Sinn auch Machirs Nachkommen gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: und die Hälfte von Gilead
  rationale: Die Konjunktion führt die Aufzählung des vorigen Verses fort; der Ortsname wird im Deutschen ohne Artikel wiedergegeben.
- source_word: עַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: Aschtarot und Edreï
  rationale: Gebräuchliche, am Hebräischen orientierte deutsche Umschriften der Ortsnamen; der Trema-Hinweis in Edreï verdeutlicht die getrennte Aussprache der Vokale.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: die Städte des Königreichs Ogs in Baschan
  rationale: Die hebräische Genitivverbindung bleibt erhalten, ohne die Orte enger als königliche Residenzstädte zu bestimmen.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Dies fiel den Söhnen Machirs, des Sohnes Manasses, zu
  rationale: Das präpositionale, verblose Hebräisch bezeichnet hier die Zuteilung eines Gebietes; „fiel … zu“ ist im Deutschen idiomatisch und bewahrt diesen Sinn.
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: und zwar der Hälfte der Söhne Machirs
  rationale: Die erläuternde Wendung präzisiert die zuvor genannten Empfänger. „Söhne“ hält die familiäre Ausdrucksweise des Hebräischen fest, ohne das nicht vorhandene Wort „Stamm“ einzufügen.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: nach ihren Sippen
  rationale: In Landverteilungstexten bezeichnet מִשְׁפָּחוֹת genealogisch-administrative Untergruppen; „Sippen“ ist hier genauer als das moderne „Familien“.
