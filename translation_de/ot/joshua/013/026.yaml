  text: וּ/מֵ/חֶשְׁבּ֛וֹן עַד רָמַ֥ת הַ/מִּצְפֶּ֖ה וּ/בְטֹנִ֑ים וּ/מִֽ/מַּחֲנַ֖יִם עַד גְּב֥וּל לִדְבִֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: de
  text: Und von Heschbon bis Ramat-Mizpe und Betonim, und von Mahanajim bis an die Grenze von Debir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis an die Grenze in Richtung Debir“. Das hebräische ל kann hier Zugehörigkeit oder Richtung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵחֶשְׁבּוֹן
  choice: und von Heschbon
  rationale: Die Verbindung aus ו und מִן bezeichnet den Ausgangspunkt; der Ortsname wird in geläufiger deutscher Bibelschreibung wiedergegeben.
- source_word: עַד
  choice: bis
  rationale: In Grenz- und Gebietsangaben markiert עַד die räumliche Erstreckung; „bis“ ist im Deutschen knapp und natürlich.
- source_word: רָמַת הַמִּצְפֶּה
  choice: Ramat-Mizpe
  rationale: Die Wortgruppe fungiert hier als Ortsname und wird daher transliteriert, statt als „Höhe der Warte“ übersetzt zu werden.
- source_word: וּבְטֹנִים
  choice: und Betonim
  rationale: Der Eigenname wird mit der vorangestellten Konjunktion wiedergegeben.
- source_word: וּמִמַּחֲנַיִם
  choice: und von Mahanajim
  rationale: Konjunktion und Präposition kennzeichnen einen weiteren Ausgangspunkt; der Ortsname wird transliteriert.
- source_word: גְּבוּל
  choice: die Grenze
  rationale: Im Zusammenhang der Landzuteilung bezeichnet גְּבוּל eine territoriale Grenzlinie; „Grenze“ ist hier idiomatisch.
- source_word: לִדְבִר
  choice: von Debir
  rationale: Das ל nach גְּבוּל kann die Zuordnung der Grenze zu Debir ausdrücken; die deutsche Genitivumschreibung ist im territorialen Kontext natürlich.
