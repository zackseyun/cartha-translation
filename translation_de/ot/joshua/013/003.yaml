source:
  edition: WLC
  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: de
  text: 'vom Schihor, der östlich von Ägypten liegt, bis zur Grenze von Ekron im Norden – dieses Gebiet wird den Kanaanitern zugerechnet –: die fünf Herrscher der Philister, nämlich der von Gaza, der von Aschdod, der von Aschkelon, der von Gat und der von Ekron, sowie die Awiter.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Ausdruck, „die Awiter“, kann syntaktisch auch mit dem folgenden Vers verbunden werden: „die Awiter im Süden“.'
    reason: Der masoretische Versschluss und der fortlaufende Satzbau erlauben unterschiedliche Zuordnungen.
lexical_decisions:
- source_word: הַשִּׁיחוֹר
  choice: der Schihor
  rationale: Der Eigenname wird transliteriert; eine sichere Identifizierung des Gewässers wird nicht in den Text eingetragen.
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: östlich von Ägypten
  rationale: Die Wendung bezeichnet hier am natürlichsten die Lage vor beziehungsweise an der Ostseite Ägyptens; die Richtungsangabe macht den geografischen Verlauf verständlich.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: Herrscher der Philister
  rationale: סֶרֶן ist der besondere Titel der fünf philistäischen Stadtherrscher; „Herrscher“ ist verständlich und vermeidet die ungenaue Gleichsetzung mit Königen oder Fürsten.
- source_word: הָעַוִּים
  choice: die Awiter
  rationale: Der Volksname wird als gebräuchliche deutsche Form wiedergegeben.
theological_decisions:
- issue: Zuordnung des Gebiets zu Kanaan
  choice: dieses Gebiet wird den Kanaanitern zugerechnet
  alternative: es gilt als kanaanitisch
  rationale: Die passive Form von תחשב bleibt erhalten und vermeidet eine weitergehende historische oder ethnische Deutung.
- issue: Syntaktische Zuordnung der Awiter
  choice: sowie die Awiter, mit Fußnote zur möglichen Verbindung mit dem Folgevers
  alternative: die Awiter unmittelbar als sechste Gruppe derselben Aufzählung lesen
  rationale: Der masoretische Versschluss setzt die Awiter in Vers 3, doch der Satzbau lässt ihre geografische Einordnung zusammen mit Vers 4 verstehen; die Ambiguität wird nicht verschwiegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die geografische Aufzählung bleibt eng am Hebräischen, wird aber durch „nämlich“ lesbar gegliedert. Der Gedankenstrich markiert den parenthetischen Hinweis zur kanaanitischen Zuordnung.
