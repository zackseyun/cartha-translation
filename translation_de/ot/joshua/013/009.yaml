  text: from Aroer, which is on the edge of the Arnon Valley, and the city that is in the middle of the valley, and all the tableland from Medeba to Dibon,
translation:
  language: de
  text: von Aroër, das am Rand des Arnontals liegt, und der Stadt mitten im Tal sowie die ganze Hochebene von Medeba bis Dibon,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: am Rand des Arnontals
  rationale: שׂפה bezeichnet wörtlich den Rand oder die Kante; נחל kann das Tal beziehungsweise die Schlucht samt Wasserlauf bezeichnen. „Rand des Arnontals“ bewahrt die topografische Aussage und entspricht dem Kontext.
- source_word: בְּתוֹךְ הַנַּחַל
  choice: mitten im Tal
  rationale: בְּתוֹךְ bedeutet „inmitten“ oder „mitten in“. Die Wiederaufnahme von נחל mit „Tal“ sorgt für natürliche Kohärenz.
- source_word: הַמִּישֹׁר
  choice: die ganze Hochebene
  rationale: מִישׁוֹר bezeichnet in diesem geografischen Zusammenhang das ebene Hochland beziehungsweise Plateau östlich des Jordan; „Hochebene“ ist im Deutschen präzise und verständlich.
