  source_fidelity: 'Die Übersetzung gibt die Zusammenfassungsaussage und die Kausativbedeutung von נחל sachgerecht wieder: Mose teilte Land als Erbbesitz zu. „in den Ebenen Moabs“ entspricht בְּעַרְבוֹת מוֹאָב, und „jenseits des Jordan, östlich von Jericho“ bewahrt die geografische Einordnung ohne eine zusätzliche Perspektive in den Text einzutragen.'
