source:
  edition: WLC
  text: אֵ֕לֶּה אֲשֶׁר נִחַ֥ל מֹשֶׁ֖ה בְּ/עַֽרְב֣וֹת מוֹאָ֑ב מֵ/עֵ֛בֶר לְ/יַרְדֵּ֥ן יְרִיח֖וֹ מִזְרָֽחָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: de
  text: Das sind die Gebiete, die Mose in den Ebenen Moabs als Erbbesitz zuteilte, jenseits des Jordan, östlich von Jericho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der anderen Seite des Jordan, im Osten von Jericho“. Die hebräische geografische Wendung kann je nach Bezugsperspektive unterschiedlich gegliedert und wiedergegeben werden.'
    reason: geographical_ambiguity
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Das sind die Gebiete, die
  rationale: Die Verbindung eröffnet einen zusammenfassenden Rückverweis. „Gebiete“ ergänzt im Deutschen den aus dem Kontext erschließbaren Bezug auf die Landanteile und ergibt einen natürlichen Satz.
- source_word: נִחַל
  choice: als Erbbesitz zuteilte
  rationale: Die Kausativform von נחל bezeichnet hier die Zuteilung von Land als erblichen Besitz; die Wiedergabe bewahrt sowohl den Verteilungsakt als auch den Erbgedanken.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: in den Ebenen Moabs
  rationale: עֲרָבוֹת bezeichnet die Ebenen beziehungsweise Steppengebiete; „Ebenen Moabs“ ist die geläufige und geografisch passende Wiedergabe.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: jenseits des Jordan
  rationale: Die feste geografische Wendung bleibt erhalten, ohne den Standpunkt stärker festzulegen, als es der Ausdruck selbst tut.
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: östlich von Jericho
  rationale: Die Richtungsangabe lokalisiert das betreffende Gebiet knapp und idiomatisch aus der Perspektive Jerichos.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbbesitz“ erhält das für die Landverteilung zentrale Erbmotiv; „zuteilte“ ist verständlich und sachlich. Die ergänzte Bezeichnung „Gebiete“ macht den im Hebräischen kontextuell vorausgesetzten Bezug im Deutschen deutlich.
