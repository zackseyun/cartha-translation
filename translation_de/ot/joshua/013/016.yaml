  naturalness: Die Konstruktion „reichte von … einschließlich … über … bis“ ist im Deutschen syntaktisch und semantisch uneinheitlich. „Ihre Grenze verlief von … und von der Stadt … über … bis …“ ist klar, idiomatisch und behält die aufzählende Struktur bei.
  terminology: „Aroër“, „Tal des Arnon“, „Hochebene“ und „Medeba“ sind angemessene moderne deutsche Wiedergaben. „Hochebene“ gibt מִישׁוֹר in diesem transjordanischen Kontext gut wieder; die lexikalischen Alternativen bleiben in der Fußnote dokumentiert.
