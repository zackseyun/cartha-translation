  text: וַ/יְהִ֨י לָ/הֶ֜ם הַ/גְּב֗וּל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/הָ/עִ֨יר אֲשֶׁ֧ר בְּ/תוֹךְ הַ/נַּ֛חַל וְ/כָל הַ/מִּישֹׁ֖ר עַל מֵידְבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: de
  text: Ihre Grenze verlief von Aroër, das am Rand des Tals des Arnon[a] liegt, und von der Stadt mitten im Tal über die ganze Hochebene[b] bis Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „am Ufer des Arnon-Wadis“. Das hebräische Wort נַחַל kann einen Bachlauf, ein Wadi oder ein Schluchttal bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „die ganze Hochebene“ beziehungsweise „die ganze Ebene“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Ihr Gebiet reichte
  rationale: Die Formulierung gibt die territoriale Ausdehnung im Deutschen natürlich wieder. הַגְּבוּל kann hier die Grenze beziehungsweise das abgegrenzte Gebiet bezeichnen.
- source_word: מֵעֲרוֹעֵר
  choice: von Aroër
  rationale: מִן kennzeichnet den Ausgangspunkt; der Ortsname wird in üblicher deutscher Form wiedergegeben.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: das am Rand des Arnontals liegt
  rationale: שְׂפַת bezeichnet wörtlich den Rand oder das Ufer. נַחַל kann Tal, Schlucht, Bachlauf oder Wadi meinen; „Arnontal“ ist im geografischen Zusammenhang verständlich und bewahrt die Geländebedeutung.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: einschließlich der Stadt mitten im Tal
  rationale: בְּתוֹךְ bezeichnet das Innere beziehungsweise die Mitte. „Einschließlich“ macht im Deutschen deutlich, dass die koordinierte Stadt zum beschriebenen Gebiet gehört, ohne sie näher zu identifizieren.
- source_word: וְכָל הַמִּישֹׁר
  choice: über das ganze Hochland
  rationale: מִישׁוֹר bezeichnet hier das ebene, erhöhte Land östlich des Jordan. „Hochland“ ist natürlich und geografisch weniger missverständlich als „Ebene“.
- source_word: עַל מֵידְבָא
  choice: bis Medeba
  rationale: עַל bezeichnet in dieser Grenzbeschreibung die Erstreckung bis zu beziehungsweise in Richtung auf Medeba; „bis“ gibt den räumlichen Endpunkt knapp wieder.
