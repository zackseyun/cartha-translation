source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: de
  text: 'Josua war alt und hochbetagt, und Jahwe sagte zu ihm: »Du bist alt und hochbetagt, und noch sehr viel von dem Land bleibt in Besitz zu nehmen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als Erbe in Besitz zu nehmen«. Das hebräische Verb kann die Inbesitznahme von Land als Erbbesitz bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: זָקֵן
  choice: war alt
  rationale: Die prädikative Form beschreibt Josuas Lebensalter beziehungsweise Zustand schlicht und unmittelbar.
- source_word: בָּא בַּיָּמִים
  choice: hochbetagt
  rationale: Die hebräische Wendung bedeutet wörtlich, dass jemand »in die Tage gekommen« ist. »Hochbetagt« gibt den idiomatischen Sinn würdig und in knappem, heutigem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen etablierte Form.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: »Das Land« bewahrt den für das Josuabuch wichtigen geografischen und verheißungsgeschichtlichen Bezug.
- source_word: נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: von dem Land ist noch sehr viel übrig
  rationale: Diese Formulierung gibt sowohl das Verbleiben als auch die starke Mengenangabe הַרְבֵּה מְאֹד natürlich und nachdrücklich wieder.
- source_word: לְרִשְׁתָּהּ
  choice: das in Besitz genommen werden muss
  rationale: ירשׁ bezeichnet hier die noch ausstehende Besitzergreifung des Landes. Die Konstruktion fügt sich natürlich an »übrig« an, ohne die ebenfalls mögliche Erbvorstellung in den Haupttext einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ירשׁ im Zusammenhang mit dem Land
  choice: in Besitz nehmen
  alternative: als Erbe in Besitz nehmen
  rationale: Der unmittelbare Zusammenhang betont die noch ausstehende Besitzergreifung. Da das Verb zugleich einen Erb- beziehungsweise Besitzaspekt tragen kann, wird diese Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der Altersbeschreibung in der Rede Jahwes bleibt zur Wahrung des hebräischen Nachdrucks erhalten. Der eröffnende hebräische Anschluss wird ohne ein unbelegtes temporales »Nun« durch den natürlichen Erzählfortgang und »Da sagte« wiedergegeben.
