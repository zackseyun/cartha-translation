revisions:
- from: 'Josua war alt und hochbetagt. Da sagte Jahwe zu ihm: »Du bist alt und hochbetagt, und von dem Land ist noch sehr viel übrig, das in Besitz genommen werden muss.[a]«'
  to: 'Josua war alt und hochbetagt, und Jahwe sagte zu ihm: »Du bist alt und hochbetagt, und noch sehr viel von dem Land bleibt in Besitz zu nehmen.[a]«'
  rationale: Die Revision entfernt die nicht ausdrücklich im hebräischen Text enthaltene Modalität »muss«, glättet den deutschen Schlusssatz und bewahrt die mögliche Erbnuance in der Fußnote. Die Wiederholung der Altersbeschreibung sowie die Wiedergabe des Gottesnamens bleiben erhalten.
