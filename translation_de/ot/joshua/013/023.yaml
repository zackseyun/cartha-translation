  text: וַ/יְהִ֗י גְּבוּל֙ בְּנֵ֣י רְאוּבֵ֔ן הַ/יַּרְדֵּ֖ן וּ/גְב֑וּל זֹ֣את נַחֲלַ֤ת בְּנֵֽי רְאוּבֵן֙ לְ/מִשְׁפְּחֹתָ֔/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: de
  text: 'Die Grenze der Nachkommen Rubens war der Jordan mit seinem Gebiet.[a] Das war der Erbbesitz der Nachkommen Rubens nach ihren Sippen: die Städte und die zugehörigen Dörfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Jordan als Grenze«. Die hebräische Formulierung »der Jordan und Grenze« ist knapp und kann den Jordan selbst als Grenzlinie bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: war
  rationale: In dieser Grenzformel bezeichnet die Form idiomatisch den bestehenden Verlauf der Grenze, nicht ausdrücklich ein Werden.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Der geografische Kontext beschreibt die Begrenzung des Stammesgebiets; »Grenze« ist dafür im modernen Deutschen präzise und natürlich.
- source_word: בְּנֵי רְאוּבֵן
  choice: die Nachkommen Rubens
  rationale: Die hebräische genealogische Wendung bezeichnet hier den Stamm; »Nachkommen Rubens« bewahrt diesen Bezug und klingt natürlicher als »Söhne Rubens«.
- source_word: הַיַּרְדֵּן וּגְבוּל
  choice: der Jordan und sein Ufer
  rationale: Die knappe hebräische Verbindung ist ungewöhnlich. »Ufer« gibt die am Jordan verlaufende Grenzlinie beziehungsweise den Randbereich verständlich wieder, ohne die alternative Deutung »der Jordan als Grenze« zu verschweigen.
- source_word: נַחֲלַת
  choice: Erbbesitz
  rationale: Das Wort bezeichnet den dem Stamm zugeteilten, bleibenden Landbesitz; »Erbbesitz« vermittelt sowohl Zuteilung als auch Besitzrecht.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: Im Zusammenhang der Stammesaufteilung sind Untergliederungen des Stammes gemeint; »Sippen« ist genauer als das allgemeinere »Familien«.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: Dies ist die übliche Entsprechung in den Orts- und Zuteilungslisten, unabhängig von der modernen Größe solcher Orte.
- source_word: וְחַצְרֵיהֶן
  choice: und die zugehörigen Dörfer
  rationale: Gemeint sind kleinere, den Städten zugeordnete und häufig unbefestigte Siedlungen; »zugehörigen Dörfer« macht die Beziehung klar.
theological_decisions: []
