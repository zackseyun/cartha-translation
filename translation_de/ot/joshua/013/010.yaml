id: JOS.13.10
reference: Joshua 13:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כֹ֗ל עָרֵי֙ סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן עַד גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: de
  text: und alle Städte Sihons, des Königs der Amoriter, der in Heschbon regierte, bis zur Grenze der Söhne Ammons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ammoniter“. Wörtlich: „Söhne Ammons“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: und alle
  rationale: Das וְ verbindet den Vers mit der vorangehenden Gebietsbeschreibung; כֹל bezeichnet die Gesamtheit.
- source_word: עָרֵי סִיחוֹן
  choice: Städte Sihons
  rationale: Der hebräische Status constructus wird im Deutschen natürlich durch eine Genitivverbindung wiedergegeben.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: König der Amoriter
  rationale: Der singularische Volksname bezeichnet hier das Volk der Amoriter; die Genitivform gibt die Beziehung klar und idiomatisch wieder.
- source_word: אֲשֶׁר מָלַךְ
  choice: der … regierte
  rationale: מָלַךְ bezeichnet das Herrschen als König; „regierte“ bewahrt diesen königlichen Sinn.
- source_word: בְּ/חֶשְׁבּוֹן
  choice: in Heschbon
  rationale: Die Präposition בְ bezeichnet hier den Ort, von dem aus Sihon regierte; „Heschbon“ ist die etablierte deutsche Namensform.
- source_word: עַד גְּבוּל
  choice: bis zur Grenze
  rationale: עַד kennzeichnet die räumliche Ausdehnung bis zu einem Grenzpunkt.
- source_word: בְּנֵי עַמּוֹן
  choice: Söhne Ammons
  rationale: Die wörtliche Wiedergabe bewahrt die im Hebräischen verwendete Abstammungsbezeichnung; die geläufige ethnische Entsprechung steht in der Fußnote.
theological_decisions: []
