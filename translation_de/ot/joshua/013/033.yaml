  terminology: „Jahwe“ ist eine etablierte deutsche Umschrift des Tetragramms und folgt der vorgegebenen Namenspolitik. „Erbbesitz“ gibt נַחֲלָה im Kontext einer territorialen Zuteilung präzise wieder und bleibt in der metaphorischen zweiten Verwendung absichtlich konsistent. „Der Gott Israels“ ist idiomatisch und quellennah.
