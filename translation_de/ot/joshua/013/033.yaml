  source_fidelity: 'Der Entwurf gibt den hebräischen Text vollständig und zutreffend wieder: Der Kontrast zur Landzuteilung wird mit „aber“ angemessen erfasst; Mose gab Levi keine נַחֲלָה, und JHWH, der Gott Israels, ist selbst ihr נַחֲלָה. „wie er zu ihnen gesagt hatte“ entspricht כַּאֲשֶׁר דִּבֶּר לָהֶם ohne die zusätzliche Deutung „versprochen“.'
