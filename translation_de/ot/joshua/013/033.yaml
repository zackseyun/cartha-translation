source:
  edition: WLC
  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: de
  text: Dem Stamm Levi aber gab Mose keinen Erbbesitz[a]. Jahwe, der Gott Israels, ist ihr Erbbesitz, wie er zu ihnen gesagt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: keinen Erbteil. Entsprechend im zweiten Satz: ihr Erbteil.'
    reason: Lexikalische Alternative für beide Vorkommen von נַחֲלָה.
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: Dem Stamm Levi aber
  rationale: Die Voranstellung mit »aber« gibt sowohl die hebräische Satzstruktur als auch den Gegensatz zu den zuvor genannten Landzuteilungen natürlich wieder. הַלֵּוִי bezeichnet hier zusammen mit שֵׁבֶט den Stamm Levi.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: gab Mose keinen Erbbesitz
  rationale: Die Formulierung gibt die schlichte vergangene Handlung wieder. »Erbbesitz« bewahrt den territorialen und bundestheologischen Sinn von נַחֲלָה.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die deutsche Genitivverbindung gibt die hebräische Status-constructus-Verbindung klar und idiomatisch wieder.
- source_word: הוּא נַחֲלָתָם
  choice: ist ihr Erbbesitz
  rationale: Die Aussage, dass Jahwe selbst Levis Erbbesitz ist, bleibt uneingeschränkt erhalten; zugleich wird נַחֲלָה in beiden Vershälften einheitlich übersetzt.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: wie er zu ihnen gesagt hatte
  rationale: »Gesagt hatte« gibt דבר im Kontext natürlich wieder und kennzeichnet die vorzeitige göttliche Aussage, ohne die stärkere Deutung »versprochen« einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Umschrift »Jahwe« bewahrt den persönlichen Gottesnamen.
- issue: Art von Levis Erbbesitz
  choice: Jahwe selbst ist ihr Erbbesitz
  alternative: Jahwe ist ihr Anteil
  rationale: Der Text setzt Jahwe unmittelbar mit dem Erbbesitz des Stammes gleich. Diese theologisch gespannte Aussage wird nicht auf Land, Versorgung oder priesterliche Vorrechte reduziert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält den Kontrast zum vorausgehenden Kontext fest; unnötige kirchliche Fachsprache und konfessionelle Zusätze werden vermieden.
