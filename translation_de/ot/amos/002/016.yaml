source:
  edition: WLC
  text: וְ/אַמִּ֥יץ לִבּ֖/וֹ בַּ/גִּבּוֹרִ֑ים עָר֛וֹם יָנ֥וּס בַּ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/016.yaml
  text: Even the stouthearted among the warriors will flee naked on that day,” declares Yahweh[a].
translation:
  language: de
  text: „Selbst der Tapfere unter den Kriegern wird an jenem Tag nackt fliehen“, erklärt Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Selbst der Mutige unter den Helden wird an jenem Tag nackt fliehen.«'
    reason: Lexikalische Alternative für אַמִּיץ לִבּוֹ und גִּבּוֹרִים; der hebräische Ausdruck kann mit »der Mutige« wiedergegeben werden, und גִּבּוֹרִים allgemeiner als »Helden«.
lexical_decisions:
- source_word: אַמִּיץ לִבּוֹ
  choice: der Beherzteste
  rationale: Die Verbindung bedeutet wörtlich etwa »stark/mutig an seinem Herzen« und bezeichnet den besonders Mutigen oder Entschlossenen. Der deutsche Superlativ gibt die hervorgehobene Stellung innerhalb der Krieger idiomatisch wieder.
- source_word: בַּגִּבּוֹרִים
  choice: unter den Kriegern
  rationale: גִּבּוֹרִים bezeichnet hier kampfstarke Männer; »Krieger« bewahrt den militärischen Zusammenhang in natürlichem modernem Deutsch.
- source_word: עָרוֹם
  choice: nackt
  rationale: Die direkte Bedeutung ist »nackt«. Das Wort vermittelt die Schutzlosigkeit, Panik und Schande der Flucht, ohne wie »entkleidet« einen vorausgehenden Vorgang einzutragen.
- source_word: יָנוּס
  choice: wird … fliehen
  rationale: Das Verb bezeichnet die Flucht vor Gefahr; das Futur entspricht der prophetischen Ankündigung.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist eine natürliche deutsche Wiedergabe der prophetischen Zeitformel.
- source_word: נְאֻם יְהוָה
  choice: erklärt Jahwe
  rationale: נְאֻם ist eine feierliche prophetische Botenformel. »Erklärt« ist verständlich und würdevoll; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der Hervorhebung durch וְאַמִּיץ לִבּוֹ בַּגִּבּוֹרִים
  choice: Selbst der Beherzteste unter den Kriegern
  alternative: Auch der Beherzte unter den Kriegern
  rationale: Der Zusammenhang steigert die Reihe der kampffähigen Männer bis zum besonders Mutigen. Die Formulierung bewahrt zugleich, dass auch dieser der angekündigten Flucht nicht entgeht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe und drastische Bildsprache des hebräischen Gerichtsworts bleibt erhalten; »nackt« wird nicht abgeschwächt.
