id: AMO.2.6
reference: Amos 2:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יִשְׂרָאֵ֔ל וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל מִכְרָ֤/ם בַּ/כֶּ֨סֶף֙ צַדִּ֔יק וְ/אֶבְי֖וֹן בַּ/עֲב֥וּר נַעֲלָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Israel[a], and for four, I will not revoke the punishment, because they sell the righteous for silver, and the needy for a pair of sandals.”'
translation:
  language: de
  text: 'So spricht Jahwe: »Wegen drei Vergehen Israels, ja, wegen vier werde ich es nicht zurücknehmen[a]: weil sie den Gerechten für Silber verkaufen und den Bedürftigen für ein Paar Sandalen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werde ich es nicht rückgängig machen«; gemeint ist wahrscheinlich, dass Jahwe das angekündigte Gericht nicht zurücknimmt.'
    reason: Das Bezugswort des hebräischen Pronomens bleibt unausgesprochen; die Fußnote wahrt die Mehrdeutigkeit und erläutert die wahrscheinliche Bedeutung.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Gibt die feste prophetische Botenformel würdig und im Deutschen geläufig wieder; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי יִשְׂרָאֵל וְעַל אַרְבָּעָה
  choice: Wegen drei Vergehen Israels, ja, wegen vier
  rationale: Bewahrt die steigernde Zahlenformel. »Vergehen« vermittelt den moralisch-bundestheologischen Ernst von פֶּשַׁע, ohne unnötig juristisch zu verengen; »ja« macht die Steigerung im natürlichen Deutsch hörbar.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: werde ich es nicht zurücknehmen
  rationale: Bewahrt das im Hebräischen nicht ausdrücklich benannte maskuline Objekt und vermeidet eine stillschweigende Festlegung auf »Strafe« oder »Gericht«.
- source_word: עַל מִכְרָם
  choice: weil sie ... verkaufen
  rationale: Gibt den Infinitiv mit Suffix als natürliche deutsche Kausalkonstruktion wieder.
- source_word: בַּכֶּסֶף
  choice: für Silber
  rationale: Bewahrt die konkrete Bedeutung »Silber« statt sie zum allgemeineren »Geld« zu verflachen.
- source_word: צַדִּיק
  choice: den Gerechten
  rationale: Erhält den Bezug zum Wortfeld der Gerechtigkeit; im sozialen und rechtlichen Zusammenhang kann damit zugleich der im Recht Befindliche gemeint sein.
- source_word: אֶבְיוֹן
  choice: den Bedürftigen
  rationale: Bezeichnet genauer den mittellosen, auf Hilfe angewiesenen Menschen als das allgemeinere »Armen«.
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: für ein Paar Sandalen
  rationale: Gibt den Dual von »Sandalen« idiomatisch wieder und lässt den beschämend geringen Gegenwert hervortreten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: »Jahwe« kennzeichnet den persönlichen Gottesnamen und folgt der für die Vorlage ausgewiesenen Projektentscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von לֹא אֲשִׁיבֶנּוּ im Amos-Refrain
  choice: werde ich es nicht zurücknehmen
  alternative: werde ich die Strafe nicht zurücknehmen
  rationale: Das hebräische Suffix hat ein elliptisches Bezugswort. Der Haupttext erhält diese Offenheit; die Fußnote erläutert die im Zusammenhang wahrscheinliche Beziehung auf das angekündigte Gericht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Sprachklang. Die Zahlensteigerung bleibt erkennbar, der elliptische Gerichtsrefrain wird nicht dogmatisch vereindeutigt, und sozialrechtliche Schlüsselbegriffe werden konkret gehalten.
