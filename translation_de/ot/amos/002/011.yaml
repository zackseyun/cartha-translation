source:
  edition: WLC
  text: וָ/אָקִ֤ים מִ/בְּנֵי/כֶם֙ לִ/נְבִיאִ֔ים וּ/מִ/בַּחוּרֵי/כֶ֖ם לִ/נְזִרִ֑ים הַ/אַ֥ף אֵֽין זֹ֛את בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/011.yaml
  text: And I raised up some of your sons to be prophets[a], and some of your young men to be Nazirites. Is this not so[b], O sons of Israel? declares Yahweh.
translation:
  language: de
  text: Und ich erweckte aus euren Söhnen Propheten und aus euren jungen Männern Nasiräer.[a] Ist es nicht so, ihr Söhne Israels?[b] – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nasiräer waren Männer, die in besonderer Weise Gott geweiht waren; auch: „Geweihte“.'
    reason: Kulturelle und lexikalische Erläuterung des Fachbegriffs נְזִרִים, ohne ein im Vers nicht ausdrücklich genanntes Gelübde zwingend vorauszusetzen.
  - marker: b
    text: 'Wörtlich: „Söhne Israels“; gemeint sind die Angehörigen des Volkes Israel.'
    reason: Erläuterung der wörtlichen, männlich markierten Bundes- und Volksbezeichnung.
lexical_decisions:
- source_word: וָאָקִים
  choice: ich ließ … hervorgehen
  rationale: Der Hifil von קום bezeichnet hier, dass Jahwe Menschen aus Israel auftreten beziehungsweise entstehen ließ. Die Formulierung gibt den kausativen Sinn in natürlichem Deutsch wieder, ohne eine bestimmte Art der Berufung ausdrücklich hinzuzufügen.
- source_word: מִבְּנֵיכֶם
  choice: aus euren Söhnen
  rationale: 'Die Präposition מן hat partitive Bedeutung: Die Propheten kamen aus der Mitte ihrer Söhne. Die männliche Bezeichnung wird entsprechend dem hebräischen Wortlaut beibehalten.'
- source_word: לִנְבִיאִים
  choice: Propheten
  rationale: 'Das ל kennzeichnet die Rolle beziehungsweise das Ergebnis: Diese Söhne traten als Propheten hervor.'
- source_word: וּמִבַּחוּרֵיכֶם
  choice: und aus euren jungen Männern
  rationale: בָּחוּר bezeichnet hier junge Männer im kräftigen Lebensalter; die parallele Konstruktion mit מן wird durch „aus“ bewahrt.
- source_word: לִנְזִרִים
  choice: Nasiräer
  rationale: נָזִיר bezeichnet den besonderen, durch ein Gelübde geweihten Status in Israel. Der etablierte deutsche Fachbegriff bewahrt diese institutionelle Bedeutung.
- source_word: הַאַף אֵין זֹאת
  choice: Ist es etwa nicht so
  rationale: Die Wendung bildet eine rhetorische Frage, die Zustimmung erwartet. „Etwa“ bringt diese Erwartung im Deutschen zum Ausdruck, ohne die Aussage zu verstärken.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ihr Söhne Israels
  rationale: Der direkte Anruf ist wörtlich männlich formuliert und bezeichnet die Angehörigen des Volkes Israel. „Ihr“ macht den Vokativ in modernem Deutsch natürlich kenntlich.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: נְאֻם ist eine feste prophetische Ausspruchsformel. Der Eigenname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Technischer oder beschreibender Ausdruck für נְזִרִים
  choice: Nasiräer
  alternative: Gott Geweihte
  rationale: Der technische Ausdruck wahrt den besonderen israelitischen Status und vermeidet, ihn zu einer allgemeinen Aussage über Weihe zu verflachen; die Fußnote erläutert ihn.
- issue: Männlich markierte Anrede בְּנֵי יִשְׂרָאֵל
  choice: ihr Söhne Israels
  alternative: ihr Israeliten
  rationale: Die gewählte Form bewahrt sowohl das Bild der Abstammung von Israel als auch die grammatisch männliche Gestalt des Ausgangstextes. Die Alternative ist idiomatischer, aber weniger formal transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten. „Spruch Jahwes“ bewahrt den knappen Charakter der prophetischen Formel; der Gedankenstrich hebt sie als abschließende Autorisierung ab.
