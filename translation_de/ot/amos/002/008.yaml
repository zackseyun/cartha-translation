source:
  edition: WLC
  text: וְ/עַל בְּגָדִ֤ים חֲבֻלִים֙ יַטּ֔וּ אֵ֖צֶל כָּל מִזְבֵּ֑חַ וְ/יֵ֤ין עֲנוּשִׁים֙ יִשְׁתּ֔וּ בֵּ֖ית אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/008.yaml
  text: And on garments taken in pledge they stretch themselves out beside every altar[c][b][a], and in the house of their God they drink the wine of those they have fined.
translation:
  language: de
  text: Auf Kleidern, die als Pfand genommen wurden,[a] strecken sie sich neben jedem Altar aus.[b] Und im Haus ihres Gottes[d] trinken sie Wein aus eingetriebenen Geldbußen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mosaische Recht verlangte, ein als Pfand genommenes Obergewand vor Sonnenuntergang zurückzugeben; siehe 2. Mose 22,25–26 und 5. Mose 24,12–13.
    reason: historical_context
  - marker: b
    text: 'Oder: „lagern sie sich neben jedem Altar“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „den Wein der mit einer Strafe Belegten“ oder „den Wein der Bestraften“. Gemeint sein kann Wein, der durch eingetriebene Geldbußen erlangt wurde.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „ihrer Götter“. Die hebräische Form ist formal pluralisch, kann aber auch den einen Gott bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגָדִים חֲבֻלִים
  choice: auf Kleidern, die als Pfand genommen wurden
  rationale: Die Wendung bezeichnet Kleidungsstücke, die als Sicherheit genommen wurden. Die Formulierung wahrt den rechtlich-sozialen Hintergrund, ohne eine bestimmte Art von Kleidungsstück vorauszusetzen.
- source_word: יַטּוּ
  choice: strecken sie sich aus
  rationale: Die Hifil-Form vermittelt das körperliche Bild des Sich-Ausstreckens oder Lagerns und unterstreicht den anklagenden Ton stärker als ein bloßes „liegen“.
- source_word: אֵצֶל כָּל מִזְבֵּחַ
  choice: neben jedem Altar
  rationale: „Neben“ gibt die räumliche Präposition genau wieder; „jedem Altar“ bewahrt die distributive Aussage von כָּל mit dem Singular.
- source_word: יֵין עֲנוּשִׁים
  choice: Wein aus eingetriebenen Geldbußen
  rationale: עֲנוּשִׁים hängt mit auferlegten Strafen, besonders Geldbußen, zusammen. Die Wiedergabe macht den wirtschaftlichen Zusammenhang verständlich, während eine Fußnote die wörtlichere und mehrdeutige Konstruktion festhält.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: im Haus ihres Gottes
  rationale: אֱלֹהִים ist formal pluralisch, bezeichnet im Hebräischen jedoch häufig den einen Gott und steht hier mit einem singularischen „Haus“. Da der Zusammenhang die von Israel beanspruchte Gottesverehrung anklagt, ist „ihres Gottes“ im Haupttext angemessen; die mögliche pluralische Deutung bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Singularische oder pluralische Wiedergabe von אֱלֹהֵיהֶם
  choice: ihres Gottes
  alternative: ihrer Götter
  rationale: Die hebräische Form ist der Gestalt nach pluralisch, kann aber regulär den einen Gott mit Possessivsuffix bezeichnen. Der Text lässt im Kontext der vielen Altäre eine polemische pluralische Deutung zu, erzwingt sie jedoch grammatisch nicht. Der Haupttext folgt der wahrscheinlicheren singularischen Bedeutung, die Fußnote bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem prophetischen Parallelismus. Rechtliche und kultische Begriffe werden verständlich wiedergegeben; echte lexikalische und theologische Mehrdeutigkeiten bleiben in den Fußnoten sichtbar.
