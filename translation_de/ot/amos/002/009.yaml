base_translation:
  language: en
  yaml_path: translation/ot/amos/002/009.yaml
  text: Yet I destroyed the Amorite before them[a], whose height was like the height of cedars, and he was strong like the oaks[b]; I destroyed his fruit above and his roots beneath.
translation:
  language: de
  text: Und doch habe ich den Amoriter[a] vor ihnen vernichtet, dessen Höhe der Höhe von Zedern glich und der stark war wie Eichen. Ich habe seine Frucht oben und seine Wurzeln unten vernichtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text verwendet „der Amoriter“ im Singular als Sammelbezeichnung für das amoritische Volk.
    reason: lexical_alternative
  - marker: b
    text: „Frucht“ und „Wurzeln“ führen das Bild eines Baumes fort und deuten auf vollständige Vernichtung von oben bis unten hin.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Und doch habe ich
  rationale: Die Verbindung aus Konjunktion und betontem Personalpronomen hebt Gottes Handeln kontrastierend hervor. „Und doch“ gibt diese Kraft im Zusammenhang natürlich wieder.
- source_word: הִשְׁמַדְתִּי / וָאַשְׁמִיד
  choice: habe ... vernichtet / vernichtete
  rationale: Das Hifil von שׁמד bezeichnet das Herbeiführen vollständiger Zerstörung. Die Wiederholung von „vernichten“ bewahrt die rhetorische Wiederaufnahme des hebräischen Verbs.
- source_word: הָאֱמֹרִי
  choice: den Amoriter
  rationale: Der hebräische kollektive Singular wird beibehalten und stellt das Volk bildhaft als eine einzelne mächtige Gestalt beziehungsweise einen Baum dar.
- source_word: מִפְּנֵיהֶם
  choice: vor ihnen
  rationale: Die räumliche Wendung bezeichnet die Beseitigung aus der Gegenwart beziehungsweise vom Weg Israels; „vor ihnen“ wahrt das knappe Bild des Ausgangstextes.
- source_word: אֲשֶׁר כְּגֹבַהּ אֲרָזִים גָּבְהוֹ
  choice: dessen Höhe der Höhe von Zedern glich
  rationale: Die Formulierung erhält die ausdrückliche Wiederholung des Höhenbegriffs und das Bild der außerordentlichen Größe.
- source_word: וְחָסֹן הוּא כָּאַלּוֹנִים
  choice: und der stark war wie Eichen
  rationale: חָסֹן bezeichnet Stärke beziehungsweise Robustheit. „Eichen“ ist hier eine gut verständliche und wahrscheinliche Wiedergabe von אַלּוֹנִים.
- source_word: פִּרְיוֹ מִמַּעַל וְשָׁרָשָׁיו מִתָּחַת
  choice: seine Frucht oben und seine Wurzeln unten
  rationale: Die konkrete Baummetaphorik wird nicht vorschnell als „Nachkommen“ oder ähnlich ausgedeutet. „Oben“ und „unten“ erhalten die umfassende räumliche Gegenüberstellung.
theological_decisions:
- issue: Kollektiver Singular für den Amoriter
  choice: 'Singularformen beibehalten: „den Amoriter ... dessen ... der ... seine“'
  alternative: 'Durchgehend pluralisieren: „die Amoriter ... ihre“'
  rationale: Der hebräische Text personifiziert das amoritische Volk im Singular. Diese Form trägt zugleich das Bild eines einzigen hochgewachsenen, vollständig vernichteten Baumes und sollte daher nicht eingeebnet werden.
- issue: Bedeutung von Frucht und Wurzeln
  choice: Die Baumbilder im Haupttext wörtlich bewahren
  alternative: „Frucht“ ausdrücklich als Nachkommen und „Wurzeln“ als Vorfahren oder verbliebene Grundlage deuten
  rationale: Der Vers selbst erklärt die einzelnen Bildelemente nicht. Die wörtliche Wiedergabe wahrt die poetische Spannung, während die Fußnote lediglich auf die Aussage umfassender Vernichtung hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Satzfügung wahrt die prophetische Bildsprache; die Wiederholung von „vernichten“ und die kollektiven Singularformen folgen bewusst der hebräischen Rhetorik.
