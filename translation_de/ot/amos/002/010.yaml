source:
  edition: WLC
  text: וְ/אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אוֹלֵ֨ךְ אֶתְ/כֶ֤ם בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה לָ/רֶ֖שֶׁת אֶת אֶ֥רֶץ הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/010.yaml
  text: Yet I brought you up from the land of Egypt[a], and I led you in the wilderness forty years, to take possession of the land of the Amorites.
translation:
  language: de
  text: Doch ich war es, der euch aus dem Land Ägypten heraufführte und euch vierzig Jahre lang durch die Wüste führte, damit ihr das Land der Amoriter[a] in Besitz nahmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Land des Amoriters“. Das Hebräische gebraucht die Einzahl hier als Sammelbezeichnung.'
    reason: Die Fußnote bewahrt die formale Einzahl der hebräischen Wendung, während der Haupttext ihren kollektiven Sinn in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Doch ich war es
  rationale: Die Verbindung aus Konjunktion und selbstständigem Pronomen hebt Gottes Handeln im Kontrast zu Israels Verhalten nachdrücklich hervor. Die Formulierung gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: הֶעֱלֵיתִי
  choice: heraufführte
  rationale: Der Hifil von עלה bezeichnet hier das Hinaufführen Israels aus Ägypten. „Heraufführen“ bewahrt die Richtungsnuance und den vertrauten Exodusbezug.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Übersetzung gibt das ausdrücklich vorhandene אֶרֶץ wieder und bleibt im Deutschen verständlich und würdevoll.
- source_word: וָאוֹלֵךְ
  choice: führte
  rationale: Der Hifil von הלך mit direktem Objekt bedeutet, jemanden gehen zu lassen beziehungsweise zu führen. „Führte“ ist hier die natürliche deutsche Entsprechung.
- source_word: בַּמִּדְבָּר
  choice: durch die Wüste
  rationale: Obwohl die Präposition ב grundsätzlich „in“ bedeuten kann, bezeichnet die Wendung hier die langjährige Führung auf dem Weg durch die Wüste. „Durch“ ist im Deutschen idiomatischer und macht die Bewegung nicht stärker, als der Kontext sie bereits voraussetzt.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: „Lang“ kennzeichnet die Zeitdauer im Deutschen idiomatisch.
- source_word: לָרֶשֶׁת
  choice: damit ihr … in Besitz nehmt
  rationale: Der Infinitiv von ירשׁ drückt hier das Ziel der Wüstenführung aus. „In Besitz nehmen“ bewahrt den aktiven Sinn, ohne vorschnell eine speziell erbrechtliche Deutung einzutragen.
- source_word: אֶרֶץ הָאֱמֹרִי
  choice: das Land der Amoriter
  rationale: Das hebräische „Amoriter“ steht formal im Singular, wird hier jedoch kollektiv gebraucht. Der deutsche Plural gibt den kollektiven Bezug natürlich wieder; die Ausgangsform wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Kollektivischer Singular bei הָאֱמֹרִי
  choice: Im Haupttext „das Land der Amoriter“
  alternative: „das Land des Amoriters“
  rationale: Der Singular bezeichnet kollektiv die amoritische Bevölkerung. Der deutsche Plural vermittelt diesen Sinn ohne konfessionelle oder zusätzliche theologische Festlegung; die formale Einzahl des Hebräischen bleibt durch die Fußnote transparent.
- issue: Ziel oder Ergebnis bei לָרֶשֶׁת
  choice: 'Zielangabe: „damit ihr … in Besitz nehmt“'
  alternative: 'Ergebnisangabe: „sodass ihr … in Besitz nahmt“'
  rationale: Die Präposition ל mit Infinitiv weist am unmittelbarsten auf das Ziel des göttlichen Führens. Die Übersetzung hält dabei offen, wie sich Absicht und geschichtliche Verwirklichung zueinander verhalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Der emphatische Gegensatz wird mit „Doch ich war es“ wiedergegeben; unnötig altertümliche oder konfessionell geprägte Sprache wird vermieden.
