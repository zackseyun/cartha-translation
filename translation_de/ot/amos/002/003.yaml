source:
  edition: WLC
  text: וְ/הִכְרַתִּ֥י שׁוֹפֵ֖ט מִ/קִּרְבָּ֑/הּ וְ/כָל שָׂרֶ֛י/הָ אֶהֱר֥וֹג עִמּ֖/וֹ אָמַ֥ר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/003.yaml
  text: And I will cut off the judge from her midst[a], and I will kill all her officials with him,” says Yahweh.
translation:
  language: de
  text: Und ich werde den Richter aus ihrer Mitte beseitigen[a] und alle ihre Obersten zusammen mit ihm töten, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Herrscher“; das hebräische Wort kann einen Richter, hier aber auch allgemeiner einen regierenden Machthaber bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Und ich werde … ausrotten
  rationale: Das Hifil von כרת bezeichnet ein entschiedenes Beseitigen oder Vernichten. „Ausrotten“ gibt hier die Härte des angekündigten Gerichts natürlicher wieder als das im Deutschen missverständliche wörtliche „abschneiden“.
- source_word: שׁוֹפֵט
  choice: den Richter
  rationale: שׁוֹפֵט bedeutet zunächst „Richter“, kann jedoch auch einen regierenden Machthaber bezeichnen. Die formnahe Wiedergabe bewahrt diese mögliche politische Bedeutung durch eine Fußnote.
- source_word: מִקִּרְבָּהּ
  choice: aus ihrer Mitte
  rationale: Das feminine Suffix nimmt Moab als personifiziertes Gemeinwesen auf; „aus ihrer Mitte“ bewahrt sowohl diese Personifikation als auch die räumlich-soziale Aussage.
- source_word: וְכָל שָׂרֶיהָ
  choice: alle ihre Obersten
  rationale: שָׂרִים bezeichnet führende Amtsträger oder Machthaber. „Oberste“ ist würdig und breit genug, ohne zwingend Erbprinzen oder moderne Verwaltungsbeamte zu meinen.
- source_word: אֶהֱרֹג
  choice: töten
  rationale: הרג bedeutet direkt „töten“; die schlichte Wiedergabe wahrt die ungemilderte Gerichtsaussage.
- source_word: עִמּוֹ
  choice: zusammen mit ihm
  rationale: Das maskuline Singularsuffix bezieht sich am natürlichsten auf den zuvor genannten Richter; „zusammen mit ihm“ macht den gemeinsamen Untergang deutlich.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die prophetische Botenformel wird im Deutschen idiomatisch mit „spricht“ wiedergegeben; der Gottesname wird als „Jahwe“ übertragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Amt und Funktion des שׁוֹפֵט
  choice: Richter
  alternative: Herrscher
  rationale: Die Grundbedeutung wird im Haupttext erhalten, während die kontextuell mögliche Bedeutung eines regierenden Machthabers in der Fußnote offengelegt wird; so wird die Ambiguität nicht vorschnell aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gerichtssprache. Die feminine Personifikation Moabs bleibt in „ihrer Mitte“ und „ihre Obersten“ erhalten.
