  rationale: Eine kleine stilistisch-semantische Anpassung ersetzt „ausrotten“ durch „beseitigen“. Dadurch wird כרת als entschiedene Entfernung beziehungsweise Ausschaltung aus Moabs Mitte idiomatisch wiedergegeben, ohne die im Deutschen mögliche Zusatzvorstellung einer vollständigen Ausrottung einzutragen. Die Ambiguität von שׁוֹפֵט bleibt durch Haupttext und Fußnote erhalten.
