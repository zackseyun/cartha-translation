  terminology: „Richter“ bewahrt die Grundbedeutung von שׁוֹפֵט; die Fußnote hält die kontextuell naheliegende politische Lesart „Herrscher“ offen. „Oberste“ gibt שָׂרִים angemessen wieder. „Jahwe“ entspricht der festgelegten Wiedergabe des Gottesnamens.
