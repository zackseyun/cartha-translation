  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י מוֹאָ֔ב וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל שָׂרְפ֛/וֹ עַצְמ֥וֹת מֶֽלֶךְ אֱד֖וֹם לַ/שִּֽׂיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/001.yaml
  text: 'Thus says Yahweh: “For three transgressions of Moab[a], and for four, I will not revoke it[b], because he burned the bones of the king of Edom to lime.”'
translation:
  language: de
  text: 'So spricht Jahwe: »Wegen drei Vergehen Moabs, ja wegen vier, nehme ich es nicht zurück[a], weil Moab die Knochen des Königs von Edom zu Kalk verbrannt hat[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich werde es nicht zurückwenden.« Gemeint ist wahrscheinlich, dass Jahwe das angekündigte Gericht nicht rückgängig macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort kann »Kalk« oder »Kalkputz« bedeuten. Hier bezeichnet es wohl das Ergebnis der Verbrennung: Die Knochen wurden zu Kalk reduziert.'
    reason: lexical_clarification
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt כֹּה אָמַר natürlich und würdig wieder; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי מוֹאָב וְעַל אַרְבָּעָה
  choice: Wegen drei Vergehen Moabs, ja wegen vier
  rationale: »Vergehen« bewahrt den Gedanken schuldhafter Auflehnung in פֶּשַׁע. »Ja wegen vier« gibt die steigernde Zahlenformel verständlich wieder, ohne sie als genaue Aufzählung aufzulösen.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: nehme ich es nicht zurück
  rationale: Die Formulierung bleibt nahe beim hebräischen Bild des Zurückwendens und bewahrt mit »es« das im Ausgangstext nicht ausdrücklich benannte Objekt.
- source_word: עַל שָׂרְפוֹ
  choice: weil Moab … verbrannt hat
  rationale: עַל bezeichnet hier den Grund des Gerichts. Der Singularsuffix stellt Moab als handelnde kollektive Größe dar; die Wiederholung des Namens klingt im Deutschen klarer als ein sachliches Pronomen.
- source_word: עַצְמוֹת מֶלֶךְ אֱדוֹם
  choice: die Gebeine des Königs von Edom
  rationale: »Gebeine« bezeichnet menschliche Knochen in einem würdigen historischen Kontext und bildet die hebräische Genitivverbindung genau ab.
- source_word: לַשִּׂיד
  choice: zu Kalk
  rationale: שִׂיד bedeutet Kalk beziehungsweise Kalkmaterial; die Wendung beschreibt eine Verbrennung, durch die die Gebeine zu Kalk wurden, nicht bloß zu Asche.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Nicht ausdrücklich genanntes Objekt in לֹא אֲשִׁיבֶנּוּ
  choice: es nicht zurücknehmen
  alternative: das angekündigte Gericht nicht zurücknehmen
  rationale: Das Pronomen wird beibehalten, damit die im Hebräischen vorhandene Offenheit nicht durch eine theologische Deutung des Bezugsobjekts beseitigt wird; die wahrscheinliche Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusster Nähe zur prophetischen Gerichtsformel. Die ungewöhnliche Zahlensteigerung und das unbestimmte Pronomen »es« bleiben erhalten; erklärungsbedürftige Einzelheiten werden knapp in Fußnoten erläutert.
