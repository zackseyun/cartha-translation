  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מוֹאָ֔ב וְ/אָכְלָ֖ה אַרְמְנ֣וֹת הַ/קְּרִיּ֑וֹת וּ/מֵ֤ת בְּ/שָׁאוֹן֙ מוֹאָ֔ב בִּ/תְרוּעָ֖ה בְּ/ק֥וֹל שׁוֹפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/002.yaml
  text: So I will send fire upon Moab[a], and it will consume the citadels of Kerioth; and Moab will die amid tumult, amid shouting[c][b], amid the sound of a trumpet.
translation:
  language: de
  text: Ich werde Feuer gegen Moab senden, und es wird die Paläste[a] von Kerijot[b] verzehren. Moab wird in Getöse sterben, unter Geschrei[c] und beim Schall des Schofars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Festungen“ beziehungsweise „Zitadellen“.'
    reason: lexical_alternative
  - marker: b
    text: Kerijot kann auch als „die Städte“ verstanden werden; wahrscheinlich ist hier jedoch ein Ortsname gemeint.
    reason: alternative_reading
  - marker: c
    text: Das hebräische Wort kann auch „Alarmruf“, „Kriegsgeschrei“ oder „Trompetenstoß“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Darum werde ich … senden
  rationale: Die erste Person Singular und das zukünftige Gerichtshandeln bleiben ausdrücklich erhalten. „Darum“ gibt den Zusammenhang mit der vorausgehenden Urteilsbegründung natürlich wieder.
- source_word: אֵשׁ בְּמוֹאָב
  choice: Feuer gegen Moab
  rationale: „Feuer“ bewahrt das prophetische Gerichtsbild; „gegen“ bringt bei שׁלח mit ב die feindliche Zielrichtung im Deutschen klar zum Ausdruck.
- source_word: וְאָכְלָה
  choice: und es wird … verzehren
  rationale: Das feminine Verb bezieht sich auf das Feuer. „Verzehren“ ist für die Wirkung des Feuers zugleich anschaulich und quellennah.
- source_word: אַרְמְנוֹת
  choice: die Zitadellen
  rationale: Das Wort bezeichnet herrschaftliche, häufig befestigte Bauten. „Zitadellen“ hält den repräsentativen und wehrhaften Sinn zusammen; „Paläste“ und „Festungen“ bleiben mögliche Alternativen.
- source_word: הַקְּרִיּוֹת
  choice: von Kerijot
  rationale: Die Form wird hier wahrscheinlich als Name eines moabitischen Ortes verstanden. Die ebenfalls mögliche Auffassung als Gattungsbegriff „die Städte“ wird in einer Fußnote bewahrt.
- source_word: וּמֵת מוֹאָב
  choice: Moab wird … sterben
  rationale: Der prophetische Perfekt wird futurisch wiedergegeben. „Sterben“ erhält die im Hebräischen markante Personifikation des Volkes beziehungsweise Landes.
- source_word: בְּשָׁאוֹן
  choice: im Getöse
  rationale: שָׁאוֹן bezeichnet lärmenden Aufruhr oder Schlachtengetümmel. „Getöse“ ist knapp, konkret und lässt die genaue Art des Lärms offen.
- source_word: בִּתְרוּעָה
  choice: unter Kriegsgeschrei
  rationale: תְּרוּעָה kann Jubelruf, Alarmsignal, Kriegsgeschrei oder Trompetenstoß bedeuten. Im Gerichtszusammenhang und neben dem ausdrücklich genannten Schofar liegt „Kriegsgeschrei“ nahe, ohne die Bedeutungsbreite zu verschweigen.
- source_word: בְּקוֹל שׁוֹפָר
  choice: beim Schall des Schofars
  rationale: Die Wiedergabe behält das konkrete antike Signalhorn bei und folgt der Konstruktion „Stimme/Klang des Schofars“ in natürlichem Deutsch.
theological_decisions:
- issue: Tod Moabs als kollektive Personifikation
  choice: „Moab wird … sterben“
  alternative: „Moab wird untergehen“
  rationale: Die wörtlichere Form bewahrt die starke Personifikation und vermeidet, die Aussage zu einer allgemeineren Untergangsformel abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Die Satzfolge bleibt eng am Hebräischen, während „Darum“, „gegen“ und die Präpositionswahl idiomatisches Deutsch schaffen. „Schofar“ bewahrt den historischen Gegenstand; der Kontext macht seine Funktion als Signalhorn verständlich.
