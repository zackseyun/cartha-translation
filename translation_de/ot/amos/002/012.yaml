  text: וַ/תַּשְׁק֥וּ אֶת הַ/נְּזִרִ֖ים יָ֑יִן וְ/עַל הַ/נְּבִיאִים֙ צִוִּיתֶ֣ם לֵ/אמֹ֔ר לֹ֖א תִּנָּבְאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/012.yaml
  text: But you made the Nazirites drink wine[a], and you commanded the prophets, saying[b], ‘Do not prophesy.’
translation:
  language: de
  text: 'Doch ihr habt den Nasiräern Wein zu trinken gegeben[a] und den Propheten befohlen: »Prophezeit nicht!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr habt die Gott Geweihten Wein trinken lassen“. Nasiräer standen unter einem besonderen Weihegelübde, zu dem der Verzicht auf Wein gehörte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihr sollt nicht prophetisch reden!“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּשְׁקוּ
  choice: ihr habt … zu trinken gegeben
  rationale: Der Hifil von שׁקה bezeichnet das Tränken beziehungsweise das Geben eines Getränks. Die Formulierung gibt die Veranlassung natürlich wieder, ohne stärker als der hebräische Ausdruck eine gewaltsame Nötigung zu behaupten.
- source_word: הַנְּזִרִים
  choice: den Nasiräern
  rationale: „Nasiräer“ bewahrt die besondere, durch ein Gelübde gekennzeichnete Gruppe der Gott Geweihten und vermeidet eine Verallgemeinerung.
- source_word: יָיִן
  choice: Wein
  rationale: Dies ist die direkte Standardbedeutung; Wein ist hier wegen der vorgeschriebenen Enthaltsamkeit der Nasiräer von besonderem Gewicht.
- source_word: וְעַל הַנְּבִיאִים צִוִּיתֶם
  choice: und den Propheten befohlen
  rationale: Bei צוה bezeichnet עַל hier die Personen, denen das Gebot auferlegt wird. Der deutsche Dativ gibt diese Beziehung idiomatisch wieder.
- source_word: לֹא תִּנָּבְאוּ
  choice: Ihr sollt nicht prophetisch reden!
  rationale: Die negierte Verbform gibt das von den Israeliten auferlegte Verbot wieder. „Prophetisch reden“ ist verständlich und bildet das hebräische Verb נבא genauer ab als eine Umschreibung mit bloßem Vorhersagen.
theological_decisions:
- issue: Wiedergabe der נזירים als besondere, Gott geweihte Gruppe
  choice: Nasiräer
  alternative: Gott Geweihte
  rationale: 'Der Fachbegriff erhält die konkrete religiöse Institution und damit die Schwere des Vergehens: Israel verleitete gerade diejenigen zum Wein, deren Weihe Enthaltsamkeit einschloss.'
- issue: Form des Verbots an die Propheten
  choice: Ihr sollt nicht prophetisch reden!
  alternative: Redet nicht prophetisch!
  rationale: Die gewählte Fassung bewahrt den Charakter eines auferlegten Verbots und zugleich die mögliche modale Nuance der hebräischen Imperfektform, ohne die Aussage konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ stellt den anklagenden Gegensatz zum vorausgehenden göttlichen Handeln heraus. Der Fachbegriff „Nasiräer“ bleibt erhalten und wird in der Fußnote erklärt; die direkte Rede ist klar und gegenwärtig formuliert.
