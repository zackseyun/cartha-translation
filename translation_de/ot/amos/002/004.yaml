  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יְהוּדָ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל מָאֳסָ֞/ם אֶת תּוֹרַ֣ת יְהוָ֗ה וְ/חֻקָּי/ו֙ לֹ֣א שָׁמָ֔רוּ וַ/יַּתְעוּ/ם֙ כִּזְבֵי/הֶ֔ם אֲשֶׁר הָלְכ֥וּ אֲבוֹתָ֖/ם אַחֲרֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/004.yaml
  text: 'Thus says Yahweh: “For three transgressions of Judah[a], and for four, I will not turn it back, because they have rejected the law of Yahweh and have not kept his statutes; and their lies have led them astray[c][b], after which their fathers walked.”'
translation:
  language: de
  text: 'So spricht Jahwe: »Wegen drei Vergehen Judas, ja wegen vier, nehme ich es nicht zurück[a]: weil sie Jahwes Weisung[b] verworfen und seine Satzungen nicht gehalten haben. Ihre Lügen[c] führten sie in die Irre – jene, denen schon ihre Vorfahren nachliefen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »widerrufe ich es nicht«. Gemeint ist wahrscheinlich das angekündigte Gericht oder die Strafe.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: »Jahwes Gesetz«. Das hebräische Wort kann auch »Unterweisung« bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: Mit »ihren Lügen« können hier insbesondere falsche Götter oder Götzen gemeint sein – trügerische Gegenstände der Verehrung, denen ihre Vorfahren folgten.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: פִּשְׁעֵי
  choice: Vergehen
  rationale: Bezeichnet schwere schuldhafte Übertretungen und bleibt in der wiederkehrenden Amos-Formel natürlich verständlich, ohne ausschließlich politische Auflehnung auszudrücken.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: nehme ich es nicht zurück
  rationale: Bewahrt das unausgesprochene Objekt der knappen hebräischen Wendung; gemeint ist wahrscheinlich das angekündigte Gericht oder Strafurteil.
- source_word: מָאֳסָם
  choice: sie ... verworfen
  rationale: Gibt die entschiedene Zurückweisung der göttlichen Weisung in natürlichem, würdigem Deutsch wieder.
- source_word: תּוֹרַת יְהוָה
  choice: Jahwes Weisung
  rationale: תּוֹרָה bezeichnet grundlegend Weisung oder Unterweisung und ist hier nicht zwingend auf ein Gesetzeskorpus einzuengen; die traditionelle Alternative wird in einer Fußnote genannt.
- source_word: חֻקָּיו
  choice: seine Satzungen
  rationale: Eine sachgerechte, verständliche Wiedergabe für verbindliche göttliche Festsetzungen im Bundeszusammenhang.
- source_word: שָׁמָרוּ
  choice: nicht gehalten
  rationale: Entspricht dem üblichen Sinn von שמר beim Befolgen verbindlicher Gebote.
- source_word: וַיַּתְעוּם
  choice: führten sie in die Irre
  rationale: Gibt die kausative Bedeutung des Verbs und seine religiös-moralische Aussage natürlich wieder.
- source_word: כִּזְבֵיהֶם
  choice: ihre Lügen
  rationale: Bewahrt die Grundbedeutung des hebräischen Ausdrucks, ohne die mögliche Anspielung auf falsche Götter oder Götzenbilder im Haupttext festzuschreiben.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶם
  choice: jene, denen schon ihre Vorfahren nachliefen
  rationale: Bezieht den Relativsatz natürlich auf die Lügen und erhält das Bild des Hinterhergehens beziehungsweise kultischen Folgens.
theological_decisions:
- issue: Bedeutung der Gerichtsformel לֹא אֲשִׁיבֶנּוּ
  choice: Das implizite Objekt bleibt mit „es“ unbestimmt.
  alternative: „Ich widerrufe die Strafe nicht“ oder „ich lasse nicht davon ab“.
  rationale: Der hebräische Text nennt das Bezugswort des Pronomens nicht ausdrücklich. Die wahrscheinlich gemeinte Gerichtsankündigung wird daher nicht erläuternd in den Haupttext eingesetzt.
- issue: Referent von כִּזְבֵיהֶם
  choice: Wörtliche Wiedergabe als „ihre Lügen“.
  alternative: „ihre falschen Götter“ oder „ihre Götzen“.
  rationale: Im prophetischen Sprachgebrauch kann der Ausdruck kultische Trugbilder und falsche Götter bezeichnen; der hebräische Wortlaut bleibt jedoch weiter und sollte nicht konfessionell oder exegetisch verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste prophetische Einleitung bleibt knapp; „ja wegen vier“ bildet die steigernde Zahlenformel idiomatisch ab. Der Gedankenstrich macht den Rückbezug des Relativsatzes auf „Lügen“ lesbar, ohne die mögliche kultische Bedeutung im Haupttext festzulegen.
