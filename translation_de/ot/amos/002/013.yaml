  naturalness: „Seht, ich drücke unter euch nieder“ ist kein natürlicher moderner deutscher Satz; insbesondere fehlt ein verständlicher Bezug dafür, was oder wen Gott „unter euch“ niederdrückt. „Ich drücke euch nieder“ ist klar, würdig und bewahrt die knappe, eindringliche Bildsprache. Die Ellipse beim Wagen ist im Deutschen mit „wie ein ... Wagen niederdrückt“ weiterhin möglich, aber „wie ein Wagen ... alles unter sich niederdrückt“ wäre stärker ergänzend und daher nicht vorzuziehen.
  terminology: „Seht“, „niederdrücken“, „Wagen“ und „Garben“ passen zum prophetischen Register und zur landwirtschaftlichen Metapher. Die Fußnote soll die umstrittene syntaktisch-bildliche Auslegung benennen, ohne eine Deutung wie „den Boden schwanken lassen“ als Textsinn festzuschreiben.
