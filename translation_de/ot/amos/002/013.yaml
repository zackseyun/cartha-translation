base_translation:
  language: en
  yaml_path: translation/ot/amos/002/013.yaml
  text: Look[a], I am pressing down beneath you[b], as a cart presses down when it is full of sheaves.
translation:
  language: de
  text: Seht, ich drücke euch nieder[a], wie ein Wagen niederdrückt, wenn er mit Garben beladen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ich drücke unter euch nieder“. Die räumliche Wendung ist im Hebräischen bildlich und syntaktisch schwierig; sie kann die Betroffenheit Israels oder den Druck an seinem Ort ausdrücken. Auch möglich: „ich belaste euch schwer“ oder, mit Zukunftssinn, „ich werde euch niederdrücken“. Manche deuten das Verb weiter als „schwanken lassen“.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Leitet eine nachdrückliche Ankündigung ein. „Seht“ bewahrt den hinweisenden und aufmerksamkeitslenkenden Charakter in gegenwärtigem, würdigem Deutsch.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen hebt den Sprecher hervor. Die Stellung unmittelbar nach „Seht“ trägt diese Betonung ausreichend; „ich selbst“ wäre möglich, aber unnötig schwer.
- source_word: מֵעִיק
  choice: drücke … nieder
  rationale: Die Hifil-Form bezeichnet hier Druck beziehungsweise Belastung. „Niederdrücken“ greift das Bild des schwer beladenen Wagens auf und lässt den präsentisch-anschaulichen Sinn des Partizips erkennen.
- source_word: תַּחְתֵּיכֶם
  choice: unter euch
  rationale: Gibt die räumliche Grundbedeutung von תַּחַת wieder, ohne die schwierige Bildaussage durch eine freie Ergänzung wie „an eurem Ort“ festzulegen.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet den Vergleich knapp und idiomatisch ein.
- source_word: תָּעִיק
  choice: niederdrückt
  rationale: Wiederholt dasselbe deutsche Verb wie im ersten Satzteil und bildet damit die Wiederholung des hebräischen Verbs ab.
- source_word: הָעֲגָלָה
  choice: ein Wagen
  rationale: Im allgemeinen Vergleich ist der unbestimmte Artikel im Deutschen natürlich, obwohl im Hebräischen der Artikel steht.
- source_word: הַמְלֵאָה לָהּ
  choice: wenn er … beladen ist
  rationale: Gibt den Zustand des gefüllten Wagens idiomatisch wieder; das ethische beziehungsweise possessive לָהּ muss im Deutschen nicht eigens ausgedrückt werden.
- source_word: עָמִיר
  choice: Garben
  rationale: Bezeichnet gesammelte beziehungsweise gebündelte Getreidehalme; „Garben“ ist die präzise und im landwirtschaftlichen Bild geläufige Wiedergabe.
theological_decisions:
- issue: Art und Zeitpunkt des angekündigten Gerichts
  choice: 'Präsentische, anschauliche Gerichtsankündigung: „ich drücke“'
  alternative: 'Zukünftig: „ich werde … niederdrücken“'
  rationale: Das Partizip kann eine gegenwärtig-vivid formulierte oder unmittelbar bevorstehende Handlung bezeichnen. Der Haupttext bewahrt die Anschaulichkeit, während die Fußnote die Zukunftsnuance offenhält.
- issue: Verhältnis von Gottes Druck zum Wagenbild
  choice: Die ungewöhnliche räumliche Formulierung „unter euch“ bleibt erhalten
  alternative: 'Explizite Deutung: „Ich drücke euch an eurem Ort nieder“ oder „ich lasse den Boden unter euch schwanken“'
  rationale: Der hebräische Satz ist syntaktisch und bildlich schwierig. Eine explizite Ergänzung eines Objekts oder des „Bodens“ würde eine umstrittene Deutung festschreiben. Die Übersetzung lässt die Spannung stehen und erläutert die wichtigsten Möglichkeiten in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das markierte „Seht“ wahrt den prophetischen Nachdruck. Die leicht ungewöhnliche Wendung „unter euch niederdrücken“ spiegelt bewusst die Schwierigkeit des hebräischen Bildes; die Fußnote bietet verständliche Alternativen, ohne die Mehrdeutigkeit im Haupttext dogmatisch aufzulösen.
