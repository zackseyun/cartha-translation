base_translation:
  language: en
  yaml_path: translation/ot/amos/002/005.yaml
  text: So I will send fire upon Judah[a], and it will devour the citadels of Jerusalem.
translation:
  language: de
  text: Darum werde ich Feuer gegen Juda senden, und es wird die Paläste[a] Jerusalems verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Festungen“ oder „Zitadellen“. Das hebräische Wort kann befestigte palastartige Gebäude bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Darum werde ich … senden
  rationale: Das Hifil von שׁלח bedeutet hier „senden“. Das vorangestellte וְ verbindet die Gerichtsankündigung mit dem vorausgehenden Urteil; „Darum“ gibt diesen folgernden Zusammenhang in natürlichem Deutsch wieder, ohne die Zukunftsaussage abzuschwächen.
- source_word: אֵשׁ
  choice: Feuer
  rationale: אֵשׁ bedeutet unmittelbar „Feuer“. Ob damit ein buchstäblicher Brand, ein Bild des Gerichts oder durch Krieg herbeigeführte Zerstörung gemeint ist, wird nicht festgelegt.
- source_word: בִּיהוּדָה
  choice: gegen Juda
  rationale: Die Präposition בְּ kann je nach Zusammenhang unter anderem örtlich oder feindlich-gerichtet verstanden werden. Bei der Formel „Feuer senden“ gibt „gegen“ die Gerichtsrichtung im Deutschen natürlich wieder, ohne den Vollzug näher zu bestimmen.
- source_word: וְאָכְלָה
  choice: und es wird … verzehren
  rationale: אכל bedeutet wörtlich „essen“, bezeichnet mit Feuer als Subjekt aber idiomatisch das Verzehren oder Vernichten. „Verzehren“ bewahrt das kraftvolle Bild.
- source_word: אַרְמְנוֹת
  choice: Palastburgen
  rationale: אַרְמְנוֹת kann befestigte, palastartige Bauten sowie Paläste oder Festungen bezeichnen. „Palastburgen“ hält sowohl den herrschaftlichen als auch den befestigten Aspekt fest; geläufigere Alternativen werden in der Fußnote genannt.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
theological_decisions:
- issue: Art des angekündigten Feuers
  choice: Die Aussage bleibt eine unmittelbare göttliche Gerichtsankündigung, ohne festzulegen, ob das Feuer buchstäblich, bildhaft oder durch einen militärischen Angriff vermittelt ist.
  alternative: Das Feuer ausdrücklich als tatsächlichen Stadtbrand oder ausschließlich als Metapher für eine Invasion deuten.
  rationale: Der prophetische Wortlaut sagt, dass Gott Feuer senden und dieses Jerusalems Bauten verzehren wird. Der Mechanismus des Gerichts wird im Vers selbst nicht näher bestimmt; diese Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt bildkräftig und verständlich; das weniger alltägliche „Palastburgen“ bildet die Bedeutungsbreite des hebräischen Ausdrucks ab und wird durch die Fußnote erläutert.
