source:
  edition: WLC
  text: וְ/אָבַ֤ד מָנוֹס֙ מִ/קָּ֔ל וְ/חָזָ֖ק לֹא יְאַמֵּ֣ץ כֹּח֑/וֹ וְ/גִבּ֖וֹר לֹא יְמַלֵּ֥ט נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/014.yaml
  text: Flight will perish from the swift[a], and the strong will not strengthen his power[d][c][b], and the warrior will not save his life.
translation:
  language: de
  text: Der Schnelle wird keine Möglichkeit zur Flucht mehr haben[a], der Starke wird seine Kraft nicht aufbieten können[b], und der Krieger wird sein Leben nicht retten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Näher am hebräischen Satzbau: „Dem Schnellen wird die Flucht schwinden.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Der Starke wird seine Kraft nicht stärken.“ Gemeint sein kann auch: Er wird seine Kraft nicht mobilisieren oder wirksam einsetzen können.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht hier „sein נַפְשׁוֹ“. Das hebräische Wort meint in diesem Zusammenhang sein Leben oder ihn selbst, nicht speziell seine „Seele“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד
  choice: wird … nicht mehr haben
  rationale: Das Qal-Perfekt mit וְ hat im Zusammenhang der angekündigten Gerichtsfolge futurische Bedeutung. Zusammen mit מָנוֹס wird der vollständige Verlust der Fluchtmöglichkeit im Deutschen natürlich als „keine Möglichkeit … mehr haben“ wiedergegeben.
- source_word: מָנוֹס
  choice: Möglichkeit zur Flucht
  rationale: Das Substantiv bezeichnet hier die Möglichkeit oder das Mittel des Entkommens. „Möglichkeit zur Flucht“ bewahrt diesen abstrakten Sinn; „Zuflucht“ wäre in diesem Zusammenhang zu statisch.
- source_word: מִקָּל
  choice: der Schnelle
  rationale: קַל ist substantivisch gebraucht. Die Präposition מִן bezeichnet, wem die Fluchtmöglichkeit abhandenkommt; die deutsche Satzstruktur gibt dies idiomatisch mit dem Schnellen als Subjekt wieder.
- source_word: חָזָק
  choice: der Starke
  rationale: Das Adjektiv steht substantivisch für einen kräftigen Menschen. „Der Starke“ ist knapp und unterscheidet sich vom folgenden militärischen גִּבּוֹר.
- source_word: יְאַמֵּץ
  choice: wird … nicht aufbieten können
  rationale: Das Piel von אמץ bedeutet „stark/fest machen“. In Verbindung mit der eigenen Kraft bezeichnet es hier, dass der Starke seine Kraft nicht wirksam einsetzen oder mobilisieren kann. „Aufbieten“ ist im Deutschen natürlicher als das tautologische „seine Kraft stärken“.
- source_word: כֹּחוֹ
  choice: seine Kraft
  rationale: כֹּחַ bezeichnet körperliche Kraft, Stärke oder Leistungsfähigkeit. „Seine Kraft“ ist die natürliche deutsche Entsprechung in der Wendung „Kraft aufbieten“.
- source_word: גִּבּוֹר
  choice: der Krieger
  rationale: Im Zusammenhang militärischer Ohnmacht bezeichnet גִּבּוֹר einen kampferprobten, mächtigen Kämpfer. „Krieger“ passt besser als das allgemeinere „Held“.
- source_word: יְמַלֵּט
  choice: wird … nicht retten
  rationale: Das Piel von מלט bedeutet „entrinnen lassen, retten“. Mit נַפְשׁוֹ als Objekt ist „sein Leben retten“ im Deutschen sachgerecht und idiomatisch.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נֶפֶשׁ bezeichnet hier die bedrohte Person beziehungsweise ihr Leben, nicht speziell eine vom Körper unterschiedene Seele.
theological_decisions: []
