  register: Modernes, würdevolles Standarddeutsch. Die drei parallelen Aussagen bleiben erhalten. Die modale Wiedergabe mit „können“ verdeutlicht die im Gericht angekündigte Unfähigkeit, ohne den Sinn konfessionell oder theologisch weiter auszudeuten.
