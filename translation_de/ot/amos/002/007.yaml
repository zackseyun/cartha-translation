source:
  edition: WLC
  text: הַ/שֹּׁאֲפִ֤ים עַל עֲפַר אֶ֨רֶץ֙ בְּ/רֹ֣אשׁ דַּלִּ֔ים וְ/דֶ֥רֶךְ עֲנָוִ֖ים יַטּ֑וּ וְ/אִ֣ישׁ וְ/אָבִ֗י/ו יֵֽלְכוּ֙ אֶל הַֽ/נַּעֲרָ֔ה לְמַ֥עַן חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/007.yaml
  text: those who trample the head of the poor into the dust of the earth[a], and turn aside the way of the humble; and a man and his father go in to the same girl[d][c][b], so as to profane my holy name.
translation:
  language: de
  text: Sie treten den Kopf der Armen in den Staub der Erde[a] und drängen die Demütigen von ihrem Weg ab[b]. Ein Mann und sein Vater gehen zu derselben jungen Frau[c], um so meinen heiligen Namen zu entweihen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Sie lechzen nach dem Staub der Erde auf dem Kopf der Armen.“ Das hebräische Verb kann heftiges Verlangen oder Hecheln bezeichnen; im Zusammenhang geht es wahrscheinlich um brutale Unterdrückung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie bringen die Bedrängten von ihrem Weg ab.“ Das hebräische Wort kann sowohl „demütig“ als auch „bedrängt“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „gehen zu der jungen Frau“. Im Zusammenhang ist dies eine verhüllende Bezeichnung für Geschlechtsverkehr. Das Hebräische kann auch mit „Mädchen“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: d
    text: Der Vers bezeichnet die junge Frau nicht ausdrücklich als Kultprostituierte, Sklavin oder Dienerin, obwohl manche Auslegungen an eine solche Form der Ausbeutung denken.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁאֲפִים עַל עֲפַר אֶרֶץ בְּרֹאשׁ דַּלִּים
  choice: Sie treten den Kopf der Armen in den Staub der Erde
  rationale: שׁאף kann wörtlich ein heftiges Verlangen oder Hecheln bezeichnen; in diesem Zusammenhang beschreibt die Wendung jedoch rücksichtslose Unterdrückung. Die idiomatische Wiedergabe bewahrt das anschauliche Bild von Kopf und Erdenstaub, während die wörtlichere Alternative in einer Fußnote erhalten bleibt.
- source_word: וְדֶרֶךְ עֲנָוִים יַטּוּ
  choice: und drängen die Demütigen von ihrem Weg ab
  rationale: נטה im Hifil bezeichnet hier ein Abbringen oder Abdrängen. עֲנָוִים kann Demütige, Gebeugte oder Bedrängte meinen; „Demütige“ hält soziale Erniedrigung und innere Niedrigkeit zusammen.
- source_word: וְאִישׁ וְאָבִיו
  choice: Ein Mann und sein Vater
  rationale: Die beiden Singularformen werden direkt wiedergegeben. Ein Zusatz wie „gemeinsam“ würde den zeitlichen Ablauf unnötig festlegen.
- source_word: יֵלְכוּ אֶל הַנַּעֲרָה
  choice: gehen zu derselben jungen Frau
  rationale: Die Wendung ist im Kontext ein sexueller Euphemismus. „zu … gehen“ wahrt dessen verhüllte Ausdrucksweise; „derselben“ verdeutlicht, dass beide zu der mit dem Artikel bezeichneten Frau gehen. נַעֲרָה wird natürlich als „junge Frau“ wiedergegeben.
- source_word: לְמַעַן חַלֵּל
  choice: um so … zu entweihen
  rationale: Die Formulierung lässt die im Hebräischen mögliche Zweck- und Ergebnisbeziehung bestehen und verbindet die Handlung unmittelbar mit der Entweihung.
- source_word: אֶת שֵׁם קָדְשִׁי
  choice: meinen heiligen Namen
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Genitivverbindung und bewahrt ihre theologische Aussagekraft.
theological_decisions:
- issue: Art des sexuellen Vergehens in וְאִישׁ וְאָבִיו יֵלְכוּ אֶל הַנַּעֲרָה
  choice: Der Text beschreibt verhüllt, dass ein Mann und sein Vater sexuelle Beziehungen zu derselben jungen Frau haben, und verbindet dies mit der Entweihung von Gottes heiligem Namen.
  alternative: Möglich sind Deutungen auf kultische Prostitution, den Missbrauch einer Sklavin oder Dienerin oder eine inzestähnliche Entehrung.
  rationale: Prostitution, Sklaverei und ein kultischer Rahmen werden im hebräischen Wortlaut nicht ausdrücklich genannt. Daher werden sie nicht in den Haupttext aufgenommen; die sexuelle Bedeutung und die verbleibende Unbestimmtheit werden in einer Fußnote erläutert.
- issue: Zweck oder Folge bei לְמַעַן חַלֵּל
  choice: „um so … zu entweihen“ lässt Zweck und bewirkte Folge anklingen.
  alternative: „sodass sie … entweihen“ würde die Aussage stärker als reine Folge bestimmen.
  rationale: לְמַעַן mit Infinitiv kann eine Zweckbeziehung ausdrücken, doch im prophetischen Vorwurf ist auch die bewirkte Entweihung im Blick. Die gewählte Form vermeidet eine unnötig enge Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Bildsprache. Die syntaktisch schwierige erste Zeile wird verständlich wiedergegeben, ohne die wörtlichere Lesart zu unterdrücken. Der sexuelle Euphemismus bleibt im Haupttext zurückhaltend; seine Bedeutung wird in der Fußnote erläutert. Alle Fußnotenmarker stehen an der jeweils einschlägigen Textstelle.
