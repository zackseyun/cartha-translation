id: AMO.2.15
reference: Amos 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/תֹפֵ֤שׂ הַ/קֶּ֨שֶׁת֙ לֹ֣א יַעֲמֹ֔ד וְ/קַ֥ל בְּ/רַגְלָ֖י/ו לֹ֣א יְמַלֵּ֑ט וְ/רֹכֵ֣ב הַ/סּ֔וּס לֹ֥א יְמַלֵּ֖ט נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/015.yaml
  text: And the one who grasps the bow will not stand[a], and the swift of foot will not escape[c][b], and the rider of the horse will not save his life.
translation:
  language: de
  text: Wer den Bogen führt, wird nicht standhalten[a]. Wer schnell auf den Beinen ist, wird nicht entkommen, und wer auf dem Pferd reitet, wird sein Leben nicht retten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird nicht stehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird nicht mit dem Leben davonkommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹפֵשׂ הַקֶּשֶׁת
  choice: Wer den Bogen führt
  rationale: Die Wendung bezeichnet wörtlich jemanden, der den Bogen ergreift bzw. handhabt, also einen Bogenschützen. Die gewählte Form bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: לֹא יַעֲמֹד
  choice: wird nicht standhalten
  rationale: עמד bedeutet grundsätzlich „stehen“. Im militärischen Gerichtskontext meint es, dass der Kämpfer seine Stellung nicht behaupten kann; „standhalten“ gibt diese kontextuelle Bedeutung prägnant wieder.
- source_word: קַל בְּרַגְלָיו
  choice: Wer schnell auf den Beinen ist
  rationale: Die hebräische Wendung beschreibt einen Menschen, der zu Fuß schnell ist. Diese Form ist in modernem Deutsch verständlich und bewahrt den Bezug auf die Beine.
- source_word: לֹא יְמַלֵּט
  choice: wird nicht entkommen
  rationale: Das Verb bezeichnet hier das Entrinnen aus einer Gefahr. „Entkommen“ ist die natürliche deutsche Entsprechung ohne ein im Hebräischen nicht genanntes Objekt einzuführen.
- source_word: רֹכֵב הַסּוּס
  choice: wer auf dem Pferd reitet
  rationale: Die singularische hebräische Partizipialfügung wird transparent wiedergegeben. „Reiter“ wäre ebenfalls möglich, doch die verbale Form hält die Bildsprache der parallelen Satzglieder aufrecht.
- source_word: לֹא יְמַלֵּט נַפְשׁוֹ
  choice: wird sein Leben nicht retten
  rationale: נפש bezeichnet in diesem Zusammenhang das eigene Leben. Die deutsche Wendung gibt den Sinn klar wieder und unterscheidet die ausdrückliche Objektangabe von der vorherigen Verwendung desselben Verbs ohne Objekt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Parallelstruktur und der Wechsel vom bloßen Entkommen zum Retten des eigenen Lebens bleiben erhalten; unnötig altertümliche Bezeichnungen wie „der Schnellfüßige“ wurden vermieden.
