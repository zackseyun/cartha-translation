source:
  edition: WLC
  text: בֹּ֤אוּ בֵֽית אֵל֙ וּ/פִשְׁע֔וּ הַ/גִּלְגָּ֖ל הַרְבּ֣וּ לִ/פְשֹׁ֑עַ וְ/הָבִ֤יאוּ לַ/בֹּ֨קֶר֙ זִבְחֵי/כֶ֔ם לִ/שְׁלֹ֥שֶׁת יָמִ֖ים מַעְשְׂרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/004.yaml
  text: Come to Bethel—and transgress; to Gilgal—and multiply transgression. Bring your sacrifices every morning[a], your tithes every three days,
translation:
  language: de
  text: Kommt nach Bethel und sündigt; geht nach Gilgal und häuft Vergehen an. Bringt jeden Morgen eure Schlachtopfer und alle drei Tage[a] eure Zehnten!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am dritten Tag“ oder „nach drei Tagen“.'
    reason: Die hebräische Zeitangabe לִשְׁלֹשֶׁת יָמִים lässt mehrere zeitliche Deutungen zu.
lexical_decisions:
- source_word: בֹּאוּ
  choice: Kommt
  rationale: Der Imperativ Plural wird als lebendiger prophetischer Aufruf wiedergegeben; das Bewegungsziel folgt mit „nach Bethel“.
- source_word: בֵית אֵל
  choice: Bethel
  rationale: Der Ortsname wird in seiner im Deutschen etablierten Form übernommen und nicht als „Haus Gottes“ übersetzt.
- source_word: וּפִשְׁעוּ
  choice: und brecht mit Gott
  rationale: פשע bezeichnet hier nicht bloß allgemeines Sündigen, sondern rebellisches, treuloses Übertreten. „Mit Gott brechen“ macht den im Kontext vorausgesetzten Beziehungsbezug verständlich, ohne eine bestimmte Einzelübertretung einzutragen.
- source_word: הַגִּלְגָּל
  choice: Geht nach Gilgal
  rationale: Die vom Parallelismus übernommene Bewegung zum Kultort wird im Deutschen ausdrücklich und natürlich formuliert.
- source_word: הַרְבּוּ לִפְשֹׁעַ
  choice: und brecht noch mehr mit ihm
  rationale: Hifil-Imperativ und Infinitiv drücken eine Steigerung aus. „Noch mehr“ gibt diese idiomatisch wieder; „mit ihm“ nimmt den Gottesbezug auf, ohne das ironische Befehlsgefüge aufzulösen.
- source_word: וְהָבִיאוּ
  choice: Bringt
  rationale: Der weitere Imperativ der ironischen Aufforderung bleibt direkt erhalten.
- source_word: לַבֹּקֶר
  choice: jeden Morgen
  rationale: Im Kontext liegt eine distributive Zeitangabe nahe, die die demonstrative Häufigkeit der Kulthandlungen hervorhebt.
- source_word: זִבְחֵיכֶם
  choice: eure Schlachtopfer
  rationale: זבח bezeichnet kultische Opfer, bei denen Tiere geschlachtet werden. „Schlachtopfer“ ist präziser als das allgemeinere „Opfer“ und im biblischen Register verständlich.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: alle drei Tage
  rationale: Diese Wiedergabe passt zur wahrscheinlich gemeinten wiederkehrenden Häufigkeit, während die grammatisch möglichen zeitlichen Alternativen in der Fußnote erhalten bleiben.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: eure Zehnten
  rationale: „Zehnten“ ist die etablierte deutsche Bezeichnung für kultische Abgaben des zehnten Teils.
theological_decisions:
- issue: Prophetische Ironie der Imperative
  choice: Die Aufforderungen werden als echte Imperative formuliert, sodass die beißende Ironie aus dem Widerspruch zwischen Kult und Treuebruch hervorgeht.
  alternative: Die Ironie ausdrücklich markieren, etwa mit „Nur zu“ oder „Macht ruhig weiter“.
  rationale: Der hebräische Text kennzeichnet die Ironie nicht durch eine eigene Partikel. Eine ausdrückliche Markierung würde die rhetorische Deutung stärker festlegen als die Vorlage.
- issue: Bedeutung von פשע
  choice: „mit Gott brechen“
  alternative: „sündigen“, „freveln“ oder „sich auflehnen“
  rationale: Das Verb kann Übertretung und Rebellion ausdrücken. Der gewählte Ausdruck bewahrt den Ernst des Treuebruchs und bleibt in natürlichem modernem Deutsch verständlich.
- issue: Zeitangabe לִשְׁלֹשֶׁת יָמִים
  choice: „alle drei Tage“ im Haupttext
  alternative: „am dritten Tag“ oder „nach drei Tagen“
  rationale: Die Formulierung ist tatsächlich mehrdeutig. Im Kontext der satirisch gesteigerten Kulthäufigkeit ist „alle drei Tage“ plausibel; die anderen Möglichkeiten werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Schärfe. Der Haupttext bewahrt die imperativische Ironie, ohne sie durch Zusätze wie „Nur zu“ ausdrücklich auszudeuten. Die Ausrufezeichen unterstützen den scharfen mündlichen Ton; die einzige echte zeitliche Mehrdeutigkeit wird in einer Fußnote dokumentiert.
