source:
  edition: WLC
  text: הִכֵּ֣יתִי אֶתְ/כֶם֮ בַּ/שִּׁדָּפ֣וֹן וּ/בַ/יֵּרָקוֹן֒ הַרְבּ֨וֹת גַּנּוֹתֵי/כֶ֧ם וְ/כַרְמֵי/כֶ֛ם וּ/תְאֵנֵי/כֶ֥ם וְ/זֵיתֵי/כֶ֖ם יֹאכַ֣ל הַ/גָּזָ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/009.yaml
  text: I struck you with blight and mildew; your many gardens and your vineyards[a], your fig trees and your olive trees, the locust devoured; yet you did not return to me, declares Yahweh.
translation:
  language: de
  text: Ich schlug euch mit Brand und Vergilben. Die Heuschrecke fraß eure vielen Gärten und Weinberge, eure Feigen- und Olivenbäume. Doch ihr seid nicht zu mir zurückgekehrt – Ausspruch Yahwehs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: Ich schlug
  rationale: Die Hifil-Form von נכה bezeichnet hier Gottes aktives Schlagen durch landwirtschaftliche Plagen. „Ich schlug“ ist direkt und bewahrt die Gerichtssprache.
- source_word: בַּשִּׁדָּפוֹן
  choice: mit Getreidebrand
  rationale: שִׁדָּפוֹן bezeichnet eine durch Hitze oder versengenden Wind hervorgerufene Schädigung der Feldfrucht. „Getreidebrand“ ist im Deutschen eine verständliche traditionelle Bezeichnung für eine solche Pflanzenplage.
- source_word: וּבַיֵּרָקוֹן
  choice: und Vergilben
  rationale: יֵרָקוֹן bezeichnet im landwirtschaftlichen Zusammenhang ein krankhaftes Gelb- oder Blasswerden der Pflanzen. „Vergilben“ gibt die Bildlichkeit unmittelbarer wieder als die mögliche, aber enger deutende Wiedergabe „Mehltau“.
- source_word: הַרְבּוֹת
  choice: vielen
  rationale: Die Form drückt hier die große Menge der nachfolgend genannten Anpflanzungen aus.
- source_word: גַּנּוֹתֵיכֶם וְכַרְמֵיכֶם
  choice: eure vielen Gärten und Weinberge
  rationale: גַּנָּה und כֶּרֶם werden direkt und idiomatisch mit „Gärten“ beziehungsweise „Weinberge“ wiedergegeben.
- source_word: תְאֵנֵיכֶם וְזֵיתֵיכֶם
  choice: eure Feigen- und Olivenbäume
  rationale: Im Zusammenhang sind die kultivierten Bäume gemeint; die knappe deutsche Zusammensetzung vermeidet unnötige Wiederholung.
- source_word: יֹאכַל הַגָּזָם
  choice: fraß die Heuschrecke
  rationale: Das singularische הַגָּזָם ist kollektiv gebraucht und bezeichnet ein erntevernichtendes Insekt, traditionell eine Heuschreckenart. Das Präteritum passt zur rückblickenden Reihe göttlicher Gerichte.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Doch ihr seid nicht zu mir zurückgekehrt
  rationale: שׁוּב mit עַד bezeichnet die umfassende Umkehr und Rückkehr zu Gott. „Zurückgekehrt“ bewahrt die relationale und bundestheologische Weite, ohne sie auf innere Reue zu verengen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Yahwehs
  rationale: „Ausspruch“ wahrt den feierlichen Charakter der prophetischen Formel; der Gottesname wird als „Yahweh“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Yahweh“ gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von שַׁבְתֶּם עָדַי im prophetischen Kontext
  choice: ihr seid nicht zu mir zurückgekehrt
  alternative: ihr habt euch nicht zu mir bekehrt; ihr habt nicht zu mir umgekehrt
  rationale: Die gewählte Formulierung umfasst Reue, Abkehr vom bisherigen Weg und erneuerte Hinwendung zu Gott, ohne eine einzelne dogmatische Teilbedeutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellten direkten Objekte in Satz zwei spiegeln die hebräische Hervorhebung, bleiben aber im Deutschen gut verständlich. Der Gedankenstrich vor der Schlussformel markiert deren feierlichen, formelhaften Charakter.
