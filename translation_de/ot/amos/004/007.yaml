source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִי֩ מָנַ֨עְתִּי מִ/כֶּ֜ם אֶת הַ/גֶּ֗שֶׁם בְּ/ע֨וֹד שְׁלֹשָׁ֤ה חֳדָשִׁים֙ לַ/קָּצִ֔יר וְ/הִמְטַרְתִּי֙ עַל עִ֣יר אֶחָ֔ת וְ/עַל עִ֥יר אַחַ֖ת לֹ֣א אַמְטִ֑יר חֶלְקָ֤ה אַחַת֙ תִּמָּטֵ֔ר וְ/חֶלְקָ֛ה אֲשֶֽׁר לֹֽא תַמְטִ֥יר עָלֶ֖י/הָ תִּיבָֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/007.yaml
  text: And I also withheld the rain from you when there were still three months until the harvest; and I caused it to rain on one city[a], but on another city I did not cause it to rain. One field received rain, but the field on which it did not rain dried up.
translation:
  language: de
  text: Auch ich habe euch den Regen vorenthalten, als noch drei Monate bis zur Ernte übrig waren. Ich ließ es auf die eine Stadt regnen, auf die andere Stadt aber ließ ich es nicht regnen. Das eine Stück Land[a] wurde beregnet; das Stück Land aber, auf das kein Regen fiel, vertrocknete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Feld; Grundstück.'
    reason: חֶלְקָה kann je nach Kontext ein Stück Land, ein Feld oder ein Grundstück bezeichnen.
lexical_decisions:
- source_word: וְגַם אָנֹכִי
  choice: Auch ich
  rationale: Bewahrt sowohl den additiven Anschluss durch גַם als auch die Betonung des ausdrücklich gesetzten Personalpronomens אָנֹכִי, ohne im Deutschen unnötig schwer zu wirken.
- source_word: מָנַעְתִּי מִכֶּם אֶת הַגֶּשֶׁם
  choice: habe euch den Regen vorenthalten
  rationale: Gibt מנע mit מן idiomatisch wieder und erhält Gottes unmittelbare Urheberschaft am Ausbleiben des Regens.
- source_word: בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר
  choice: als es noch drei Monate bis zur Ernte waren
  rationale: Drückt die noch verbleibende Zeit bis zur Ernte klar aus und bewahrt damit die landwirtschaftliche Dringlichkeit.
- source_word: וְהִמְטַרְתִּי ... לֹא אַמְטִיר
  choice: Ich ließ es ... regnen ... ließ ich es nicht regnen
  rationale: Das deutsche Kausativgefüge gibt den Hifil von מטר natürlich wieder und hält die absichtliche göttliche Steuerung des Regens ausdrücklich fest.
- source_word: עַל עִיר אֶחָת ... וְעַל עִיר אַחַת
  choice: auf die eine Stadt ... auf die andere Stadt
  rationale: Bewahrt die parallele Gegenüberstellung und wiederholt wie der hebräische Text das Wort „Stadt“.
- source_word: חֶלְקָה
  choice: Stück Land
  rationale: חֶלְקָה bezeichnet hier eine abgegrenzte Landfläche. „Stück Land“ bleibt weiter als „Feld“ und vermeidet eine unnötige Präzisierung.
- source_word: תִּמָּטֵר
  choice: wurde beregnet
  rationale: Gibt die passive Verbform knapp wieder und unterscheidet sie von den vorausgehenden aktiven Aussagen Gottes.
- source_word: וְחֶלְקָה אֲשֶׁר לֹא תַמְטִיר עָלֶיהָ
  choice: das Stück Land aber, auf das kein Regen fiel
  rationale: Gibt den Sinn der grammatisch auffälligen Relativkonstruktion in natürlichem Deutsch wieder, ohne die göttliche Urheberschaft der vorangehenden Sätze aufzuheben.
- source_word: תִּיבָשׁ
  choice: vertrocknete
  rationale: Bezeichnet treffend das Austrocknen von Land beziehungsweise Bewuchs infolge fehlenden Regens.
theological_decisions:
- issue: Göttliche Urheberschaft bei Dürre und örtlich begrenztem Regen
  choice: 'Die ersten Verben werden mit ausdrücklichem göttlichem Handeln wiedergegeben: „ich habe ... vorenthalten“ und „ich ließ es ... regnen“ beziehungsweise „nicht regnen“.'
  alternative: Unpersönliche Formulierungen wie „der Regen blieb aus“ oder „es regnete“ verwenden.
  rationale: Der hebräische Text hebt durch die erste Person und die kausativen Verbformen Gottes unmittelbares Handeln hervor. Diese theologische Spannung darf nicht zu einer bloßen Wetterbeschreibung abgeschwächt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Struktur und die wiederholte göttliche Ich-Rede bleiben erhalten; unnötig technische Agrarsprache wird vermieden.
