revisions:
- from: Ich stürzte einige von euch ins Verderben[a], wie Gott Sodom und Gomorra ins Verderben stürzte[b]. Da wart ihr wie ein Holzscheit, das aus dem Brand gerissen wurde[c]. Trotzdem seid ihr nicht zu mir zurückgekehrt – Ausspruch Jahwes.
  to: Ich zerstörte einige von euch[a], wie Gott Sodom und Gomorra zerstörte[b]. Ihr wurdet wie ein Holzscheit, das dem Feuer entrissen wurde[c]. Doch ihr seid nicht zu mir zurückgekehrt – Ausspruch Jahwes.
  rationale: Die Revision ersetzt die etwas indirekte Wendung „ins Verderben stürzen“ durch „zerstören“, das den Gerichtssinn von הפך und die Sodom-und-Gomorra-Anspielung klar und natürlich wiedergibt. „Ihr wurdet“ verdeutlicht den resultativen Sinn von וַתִּהְיוּ; „dem Feuer entrissen“ bewahrt das Rettungsbild von מֻצָּל מִשְּׂרֵפָה. Die vorhandenen Fußnoten bleiben sachlich passend und korrekt verankert.
