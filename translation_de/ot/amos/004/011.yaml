id: AMO.4.11
reference: Amos 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָפַ֣כְתִּי בָ/כֶ֗ם כְּ/מַהְפֵּכַ֤ת אֱלֹהִים֙ אֶת סְדֹ֣ם וְ/אֶת עֲמֹרָ֔ה וַ/תִּהְי֕וּ כְּ/א֖וּד מֻצָּ֣ל מִ/שְׂרֵפָ֑ה וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/011.yaml
  text: I overthrew some among you as God overthrew Sodom and Gomorrah[a], and you became like a brand snatched from the burning; yet you did not return to me[c][b], declares Yahweh.
translation:
  language: de
  text: Ich zerstörte einige von euch[a], wie Gott Sodom und Gomorra zerstörte[b]. Ihr wurdet wie ein Holzscheit, das dem Feuer entrissen wurde[c]. Doch ihr seid nicht zu mir zurückgekehrt – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter euch“. Die hebräische Präposition muss nicht ausdrücklich partitiv als „einige von euch“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie die Umstürzung Gottes von Sodom und Gomorra“, das heißt: wie die Umstürzung, die Gott über Sodom und Gomorra brachte.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie ein aus der Feuersbrunst gerettetes Stück Holz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַכְתִּי
  choice: Ich stürzte … ins Verderben
  rationale: הפך bezeichnet im Gerichtskontext das verheerende Umstürzen beziehungsweise die Zerstörung; die deutsche Wendung ist natürlich und bewahrt zugleich das Bild eines gewaltsamen Untergangs.
- source_word: בָכֶם
  choice: einige von euch
  rationale: 'Die Präposition ב mit dem pluralischen Suffix kann hier partitiv verstanden werden: Das Gericht traf Menschen innerhalb Israels. Diese Deutung wird im Text wiedergegeben, während die formal offenere Möglichkeit in Fußnote [a] erhalten bleibt.'
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: wie Gott … ins Verderben stürzte
  rationale: Die hebräische Nominalfügung wird für natürliches Deutsch verbal wiedergegeben. אֱלֹהִים bleibt ausdrücklich „Gott“ und wird nicht als bloßer Superlativ aufgefasst.
- source_word: סְדֹם וְאֶת עֲמֹרָה
  choice: Sodom und Gomorra
  rationale: Dies sind die im Deutschen üblichen Formen der Ortsnamen.
- source_word: וַתִּהְיוּ
  choice: Da wart ihr
  rationale: Die Form bezeichnet den aus dem Gericht hervorgegangenen Zustand. „Da wart ihr“ bringt diese Folge im Deutschen knapp und idiomatisch zum Ausdruck.
- source_word: כְּאוּד
  choice: wie ein Holzscheit
  rationale: אוּד ist ein Stück Holz, das im Feuer liegt oder daraus herausgezogen wird. „Holzscheit“ macht das Bild im heutigen Deutsch unmittelbar verständlich.
- source_word: מֻצָּל מִשְּׂרֵפָה
  choice: das aus dem Brand gerissen wurde
  rationale: Das passive מֻצָּל bezeichnet Rettung aus unmittelbarer Gefahr; „gerissen“ vermittelt die Dringlichkeit, während „Brand“ die Bedeutung der Feuersbrunst wahrt.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Trotzdem seid ihr nicht zu mir zurückgekehrt
  rationale: שׁוב mit עַד bezeichnet die umfassende Umkehr und relationale Rückkehr zu Gott. „Zurückgekehrt“ bewahrt diese Breite besser als das engere „bereut“.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die gewichtige prophetische Botenformel wird nah an ihrer nominalen Gestalt wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe von יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text stehende Eigenname Gottes wird in seiner im modernen Deutschen geläufigen Form wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutungsweite von שׁוב im prophetischen Bundeskontext
  choice: zu mir zurückgekehrt
  alternative: zu mir umgekehrt; Buße getan
  rationale: Die Formulierung bewahrt sowohl die konkrete Bewegung des Zurückkehrens als auch den prophetischen Sinn einer erneuerten Hinwendung zu Gott, ohne ihn auf innere Reue zu verengen.
- issue: Funktion von אֱלֹהִים in כְּמַהְפֵּכַת אֱלֹהִים
  choice: Gott als Urheber der Zerstörung
  alternative: eine gewaltige Zerstörung als superlativischer Gebrauch des Gottesnamens
  rationale: Die anschließende Nennung Sodoms und Gomorras spricht am natürlichsten für die bekannte, von Gott bewirkte Zerstörung; die sprachlich ungewöhnliche Nominalkonstruktion wird in Fußnote [b] offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Bildsprache. Die Wiederholung „ins Verderben stürzte“ verbindet das Verb הָפַכְתִּי mit dem verwandten Substantiv מַהְפֵּכָה, ohne die im Deutschen schwer verständliche wörtliche Nominalfügung in den Haupttext zu zwingen. Der Gedankenstrich vor der prophetischen Schlussformel verleiht ihr das angemessene Gewicht.
