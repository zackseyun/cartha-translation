source:
  edition: WLC
  text: שִׁלַּ֨חְתִּי בָ/כֶ֥ם דֶּ֨בֶר֙ בְּ/דֶ֣רֶךְ מִצְרַ֔יִם הָרַ֤גְתִּי בַ/חֶ֨רֶב֙ בַּח֣וּרֵי/כֶ֔ם עִ֖ם שְׁבִ֣י סֽוּסֵי/כֶ֑ם וָ/אַעֲלֶ֞ה בְּאֹ֤שׁ מַחֲנֵי/כֶם֙ וּֽ/בְ/אַפְּ/כֶ֔ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/010.yaml
  text: I sent among you a plague in the manner of Egypt[a]; I killed your young men with the sword, along with your captured horses, and I made the stench of your camps rise even into your nostrils; yet you did not return to me[b], declares Yahweh.
translation:
  language: de
  text: Ich sandte eine Seuche unter euch wie in Ägypten[a]. Ich tötete eure jungen Männer mit dem Schwert, während eure Pferde in Gefangenschaft gerieten[b]. Ich ließ den Gestank eurer Lager euch in die Nase steigen. Doch ihr seid nicht zu mir zurückgekehrt – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung bedeutet wahrscheinlich „in der Weise Ägyptens“ und spielt wohl auf die über Ägypten gekommenen Plagen an. Möglich ist auch eine räumliche Deutung: „auf dem Weg nach Ägypten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „zusammen mit der Gefangenschaft eurer Pferde“. Die knappe Formulierung beschreibt wahrscheinlich eine militärische Niederlage, bei der die jungen Männer getötet und die Pferde weggeführt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁלַּחְתִּי בָכֶם דֶּבֶר
  choice: Ich sandte eine Seuche unter euch
  rationale: Die Wendung gibt das Senden einer tödlichen epidemischen Heimsuchung wieder. „Unter euch“ entspricht der lokalen Bedeutung von בָכֶם, ohne die im Gerichtskontext vorhandene feindliche Ausrichtung unnötig zu verstärken.
- source_word: בְּדֶרֶךְ מִצְרַיִם
  choice: wie in Ägypten
  rationale: Die knappe deutsche Formulierung bewahrt den wahrscheinlichen Verweis auf die ägyptischen Plagen. Die weniger wahrscheinliche räumliche Deutung wird in der Fußnote genannt.
- source_word: הָרַגְתִּי בַחֶרֶב בַּחוּרֵיכֶם
  choice: Ich tötete eure jungen Männer mit dem Schwert
  rationale: „Junge Männer“ bewahrt den gewöhnlichen Sinn von בַּחוּרִים, während der Zusammenhang erkennen lässt, dass es sich um Kriegstote handelt. „Mit dem Schwert“ bildet die hebräische Kriegsformel direkt ab.
- source_word: עִם שְׁבִי סוּסֵיכֶם
  choice: und eure Pferde wurden erbeutet
  rationale: Die hebräische Nominalfügung ist stark verdichtet und lautet wörtlich etwa „mit der Gefangenschaft eurer Pferde“. Die gewählte Fassung gibt den wahrscheinlichen parallelen Verlust im Krieg verständlich wieder, ohne zu behaupten, die Pferde seien zusammen mit den Männern getötet worden.
- source_word: וָאַעֲלֶה בְּאֹשׁ מַחֲנֵיכֶם וּבְאַפְּכֶם
  choice: Ich ließ den Gestank eurer Lager bis in eure Nasen aufsteigen
  rationale: Die Kausativbedeutung von עלה und das konkrete אַף im Zusammenhang mit Geruch werden anschaulich erhalten. „Gestank“ entspricht der drastischen Bildsprache des Gerichts.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Dennoch seid ihr nicht zu mir zurückgekehrt
  rationale: שׁוב bezeichnet hier die Bundesumkehr zu Gott. „Zurückgekehrt“ wahrt das Bild des hebräischen Verbs, ohne es durch den theologischen Fachausdruck „Buße tun“ auszudeuten.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: „Ausspruch“ gibt die prophetische Botenformel נְאֻם wieder; der Gottesname יהוה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bundestheologische Bedeutung von שׁוב
  choice: zu mir zurückgekehrt
  alternative: zu mir umgekehrt / Buße getan
  rationale: Die Übersetzung bewahrt sowohl die räumliche Grundmetapher als auch ihre im Kontext erkennbare geistliche Bedeutung, ohne eine explizitere Lehrformel in den Text einzutragen.
- issue: Art des Ägyptenbezugs
  choice: wie in Ägypten
  alternative: auf dem Weg nach Ägypten
  rationale: Im Gerichtszusammenhang liegt eine Anspielung auf die ägyptischen Plagen näher; da die hebräische Wendung formal auch räumlich verstanden werden kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Härte. Die Satzfolge bleibt nah an den hebräischen Gerichtsaussagen; verdichtete oder mehrdeutige Wendungen werden lesbar formuliert und durch Fußnoten offengehalten.
