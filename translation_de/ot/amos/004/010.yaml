  - severity: low
    issue: „bis in eure Nasen aufsteigen“ ist im Deutschen weniger idiomatisch.
    rationale: Das Hebräische zielt auf den unerträglichen Geruch, der die Betroffenen erreicht. „euch in die Nase steigen“ vermittelt dies natürlich und prägnant.
