review_pass:
  verdict: revise
  source_fidelity: Der Singularimperativ von וְקַטֵּר und die folgenden Pluralimperative werden beibehalten. Die Fassung „genau das liebt ihr“ verschiebt jedoch כֵּן („so/auf diese Weise“) zu einem Objekt; „so habt ihr es gern“ gibt die idiomatische, anklagende Aussage genauer wieder. „aus Gesäuertem“ legt zudem eine stoffliche Beziehung stärker fest als der hebräische Ausdruck. Die Gottesformel ist mit einer natürlichen deutschen Apposition zu fassen.
  naturalness: „Kündigt freiwillige Opfergaben an, macht sie bekannt!“ ist im modernen Standarddeutsch klarer als „Ruft freiwillige Gaben aus“. „Ausspruch Jahwes, des Herrn“ ist als prophetische Schlussformel natürlicher und vermeidet die missverständliche Reihung „des Herrn Jahwe“.
  terminology: „Dankopfer“, „Gesäuertes“ und „freiwillige Opfergaben“ bewahren den kultischen Wortschatz. „Jahwe“ gibt den Gottesnamen wieder; „des Herrn“ entspricht dem vorangestellten Titel אֲדֹנָי.
  issues:
  - severity: medium
    issue: Die Wendung „Denn genau das liebt ihr“ gibt כִּי כֵן אֲהַבְתֶּם nicht präzise wieder.
    rationale: כֵּן bedeutet hier „so/auf diese Weise“ und qualifiziert die beschriebene Praxis. Die deutsche Fassung macht daraus ein demonstratives Objekt und verändert damit die Aussage leicht.
  - severity: medium
    issue: „aus Gesäuertem“ verengt die Beziehung von מֵחָמֵץ zum Dankopfer.
    rationale: Die Präposition lässt die genaue kultische Beziehung offen. „mit Gesäuertem“ ist im Haupttext weniger einengend; die Fußnote hält weitere Möglichkeiten fest.
  - severity: low
    issue: „Ruft freiwillige Gaben aus“ ist terminologisch und stilistisch weniger präzise.
    rationale: נְדָבוֹת sind freiwillige Opfergaben. „Kündigt … an“ ist für die öffentliche Bekanntmachung im Deutschen idiomatischer.
  - severity: low
    issue: „Ausspruch des Herrn Jahwe“ ist im Deutschen keine klare Wiedergabe der zusammengesetzten Gottesbezeichnung.
    rationale: Die appositionelle Formel „Ausspruch Jahwes, des Herrn“ macht sowohl den Namen als auch den Titel verständlich und behält beide bei.
