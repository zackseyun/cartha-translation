  text: וְ/קַטֵּ֤ר מֵֽ/חָמֵץ֙ תּוֹדָ֔ה וְ/קִרְא֥וּ נְדָב֖וֹת הַשְׁמִ֑יעוּ כִּ֣י כֵ֤ן אֲהַבְתֶּם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/005.yaml
  text: And burn a thank offering from leavened bread[a], and proclaim freewill offerings—announce them! For this is what you have loved, O sons of Israel[b], declares the Lord GOD.
translation:
  language: de
  text: Und verbrenne ein Dankopfer mit Gesäuertem[a]! Kündigt freiwillige Opfergaben an, macht sie bekannt! Denn so habt ihr es gern, ihr Israeliten[b] – Ausspruch Jahwes, des Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „aus Gesäuertem“ oder „aus gesäuertem Brot“. Der hebräische Ausdruck verbindet Gesäuertes mit dem Dankopfer, lässt die genaue Beziehung aber offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַטֵּר
  choice: Und lass … in Rauch aufgehen
  rationale: Das Piel bezeichnet das Verbrennen einer Opfergabe, sodass sie als Rauch aufsteigt. Die Form ist ein Imperativ im Singular; dieser Numeruswechsel gegenüber den folgenden pluralischen Imperativen bleibt erhalten.
- source_word: מֵחָמֵץ תּוֹדָה
  choice: ein Dankopfer aus Gesäuertem
  rationale: תּוֹדָה ist hier die kultische Dankopfergabe. מֵחָמֵץ verbindet sie mit gesäuertem Material, ohne eindeutig festzulegen, ob dieses Bestandteil, Begleitung oder das verbrannte Material ist; die Fußnote bewahrt diese Mehrdeutigkeit.
- source_word: וְקִרְאוּ נְדָבוֹת הַשְׁמִיעוּ
  choice: Ruft freiwillige Gaben aus, macht sie bekannt!
  rationale: נְדָבוֹת bezeichnet freiwillig dargebrachte Opfergaben. Die beiden Imperative betonen ihre öffentliche Ankündigung; im Deutschen gibt „macht sie bekannt“ den kausativen Sinn von הַשְׁמִיעוּ natürlich wieder.
- source_word: כִּי כֵן אֲהַבְתֶּם
  choice: Denn genau das liebt ihr
  rationale: Die Wendung hat im Kontext anklagend-ironische Kraft und beschreibt eine eingewurzelte Vorliebe. Das deutsche Präsens gibt diese fortdauernde Haltung natürlicher wieder als ein Perfekt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ihr Israeliten
  rationale: Die direkte Anrede wird im heutigen Deutsch klar und würdig wiedergegeben; die wörtliche Form steht in der Fußnote.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: נְאֻם wird als prophetische Botenformel wiedergegeben. אֲדֹנָי bleibt „Herr“, während der Eigenname יהוה als „Jahwe“ sichtbar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: des Herrn Jahwe
  alternative: Gottes, des HERRN
  rationale: Die gewählte Fassung unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und vermeidet, den Namen durch einen zweiten Titel zu ersetzen.
- issue: Ironischer Charakter der kultischen Aufforderungen
  choice: Die Imperative werden ohne erklärenden Zusatz direkt wiedergegeben.
  alternative: Eine ausdrückliche Kennzeichnung wie „Nur zu“
  rationale: Der Zusammenhang trägt die prophetische Ironie; ein hinzugefügtes Signal würde eine Deutung in den Haupttext eintragen, die im hebräischen Wortlaut nicht ausdrücklich markiert ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Schärfe. Der ungewöhnliche Wechsel vom singularischen Imperativ zu pluralischen Imperativen wird nicht eingeebnet. Die Ausrufezeichen verdeutlichen die gedrängte Folge der Aufforderungen, ohne die Ironie ausdrücklich auszudeuten.
