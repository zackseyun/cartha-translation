revisions:
- from: Und lass ein Dankopfer aus Gesäuertem in Rauch aufgehen[a]! Ruft freiwillige Gaben aus, macht sie bekannt! Denn genau das liebt ihr, ihr Israeliten[b] – Ausspruch des Herrn Jahwe.
  to: Und verbrenne ein Dankopfer mit Gesäuertem[a]! Kündigt freiwillige Opfergaben an, macht sie bekannt! Denn so habt ihr es gern, ihr Israeliten[b] – Ausspruch Jahwes, des Herrn.
  rationale: Die Revision wahrt den rhetorischen Imperativwechsel und die kultische Terminologie, gibt die adverbiale Bedeutung von כֵּן genauer wieder und vermeidet bei מֵחָמֵץ eine zu starke Festlegung. Die Schlussformel wird in eine natürliche deutsche Form gebracht, ohne Titel oder Gottesnamen auszulassen.
  reviewer_model: gpt-5.6-terra
