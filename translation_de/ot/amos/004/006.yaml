source:
  edition: WLC
  text: וְ/גַם אֲנִי֩ נָתַ֨תִּי לָ/כֶ֜ם נִקְי֤וֹן שִׁנַּ֨יִם֙ בְּ/כָל עָ֣רֵי/כֶ֔ם וְ/חֹ֣סֶר לֶ֔חֶם בְּ/כֹ֖ל מְקוֹמֹֽתֵי/כֶ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/006.yaml
  text: And I also gave you cleanness of teeth in all your cities[a], and lack of bread in all your places; yet you did not return to me, declares Yahweh.
translation:
  language: de
  text: »Auch ich habe euch in allen euren Städten saubere Zähne gegeben[a] und Brotmangel an all euren Orten. Doch ihr seid nicht zu mir umgekehrt«, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier das Bild von „sauberen Zähnen“: Weil es nichts zu essen gab, blieben die Zähne sauber.'
    reason: Erläuterung einer hebräischen Redewendung
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Auch ich
  rationale: Bewahrt die additive und durch das ausdrückliche Pronomen verstärkte Aussage in natürlicher deutscher Wortstellung.
- source_word: נָתַתִּי לָכֶם
  choice: habe euch … gegeben
  rationale: Das Perfekt gibt den rückblickenden Hinweis auf bereits vollzogene Strafmaßnahmen im modernen Deutsch natürlich wieder und wahrt zugleich das direkte Bild des Gebens.
- source_word: נִקְיוֹן שִׁנַּיִם
  choice: saubere Zähne
  rationale: Die anschauliche hebräische Wendung bleibt erhalten; der parallele Brotmangel und die Fußnote erschließen ihren Sinn als Folge fehlender Nahrung.
- source_word: בְּכָל עָרֵיכֶם
  choice: in allen euren Städten
  rationale: Gibt die Ortsangabe und die übliche Bedeutung von עָרִים direkt wieder.
- source_word: וְחֹסֶר לֶחֶם
  choice: und Brotmangel
  rationale: Bewahrt die konkreten Bestandteile der hebräischen Formulierung, ohne sie vorschnell mit dem umfassenderen Begriff „Hungersnot“ gleichzusetzen.
- source_word: בְּכֹל מְקוֹמֹתֵיכֶם
  choice: an all euren Orten
  rationale: Erhält die gegenüber „Städten“ allgemeinere Bedeutung von מְקוֹמוֹת und wahrt so den Parallelismus, ohne nur Siedlungen oder Wohnorte anzunehmen.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Doch ihr seid nicht zu mir umgekehrt
  rationale: „Umkehren zu“ bewahrt sowohl die räumliche Bildhaftigkeit als auch den theologischen Sinn einer erneuten Hinwendung zu Gott; „doch“ macht den Gegensatz im Deutschen klar.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Eine geläufige, würdige Wiedergabe der prophetischen Botenformel; der Gottesname wird als Jahwe wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung der Wendung נִקְיוֹן שִׁנַּיִם
  choice: Das wörtliche Bild „saubere Zähne“ im Haupttext bewahren
  alternative: Hunger / nichts zu essen
  rationale: Das Bild bezeichnet Nahrungsmangel, doch die konkrete Metapher trägt zur prophetischen Schärfe bei. Der parallele „Brotmangel“ und die Fußnote erläutern sie, ohne sie im Haupttext aufzulösen.
- issue: Bedeutungsumfang von שׁוּב עַד
  choice: zu mir umkehren
  alternative: Buße tun
  rationale: „Umkehren“ lässt die umfassende Bundesbewegung zurück zu Gott offen und verengt sie nicht auf einen einzelnen inneren oder rituellen Vorgang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist typografisch kenntlich gemacht. Das ungewöhnliche Bild „saubere Zähne“ bleibt bewusst stehen; „Brotmangel“ sichert die unmittelbare Verständlichkeit.
