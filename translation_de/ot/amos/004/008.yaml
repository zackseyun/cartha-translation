source:
  edition: WLC
  text: וְ/נָע֡וּ שְׁתַּיִם֩ שָׁלֹ֨שׁ עָרִ֜ים אֶל עִ֥יר אַחַ֛ת לִ/שְׁתּ֥וֹת מַ֖יִם וְ/לֹ֣א יִשְׂבָּ֑עוּ וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/008.yaml
  text: So two or three cities staggered to one city to drink water[a], but they were not satisfied; yet you did not return to me[b], declares Yahweh.
translation:
  language: de
  text: Da zogen zwei oder drei Städte zu einer Stadt umher, um Wasser zu trinken[a]; doch sie bekamen nicht genug. Trotzdem seid ihr nicht zu mir zurückgekehrt[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wankten« oder »taumelten«. Das hebräische Verb bezeichnet eine unstete Bewegung, hier auf der Suche nach Wasser.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seid ihr nicht zu mir umgekehrt«. Das hebräische Wort kann hier auch die Umkehr zu Gott im Sinn einer erneuerten Hinwendung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: So wankten
  rationale: Das Verb נוע bezeichnet eine schwankende oder unstete Bewegung. „Wankten“ bringt hier die vom Wassermangel verursachte verzweifelte Bewegung zum Ausdruck, ohne sie zu einem bloßen Gehen abzuschwächen.
- source_word: שְׁתַּיִם שָׁלֹשׁ עָרִים
  choice: zwei oder drei Städte
  rationale: Die hebräische Zahlenverbindung bezeichnet eine unbestimmte kleine Zahl. „Städte“ bleibt als Metonymie für ihre Einwohner erhalten.
- source_word: אֶל עִיר אַחַת
  choice: zu einer einzigen Stadt
  rationale: Die Richtungsangabe beschreibt, wie mehrere Städte an einem Ort zusammenkommen; „einer einzigen“ hebt den Kontrast zum vorausgehenden Plural natürlich hervor.
- source_word: לִשְׁתּוֹת מַיִם
  choice: um Wasser zu trinken
  rationale: Der Infinitiv bezeichnet den Zweck der Bewegung und wird direkt wiedergegeben.
- source_word: וְלֹא יִשְׂבָּעוּ
  choice: doch sie bekamen nicht genug
  rationale: שׂבע bedeutet, gesättigt zu werden oder genug zu haben. Die Formulierung bleibt auf Wasser bezogen natürlich und bewahrt den Gedanken unzureichender Versorgung.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: Trotzdem seid ihr nicht zu mir zurückgekehrt
  rationale: שׁוב kann sowohl Rückkehr als auch Umkehr zu Gott bezeichnen. „Zurückgekehrt“ erhält beide Ebenen, ohne die Aussage ausdrücklich als „Buße tun“ auszulegen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird würdevoll und quellenah wiedergegeben; der Gottesname erscheint als „Jahwe“ in üblicher deutscher Form.
theological_decisions:
- issue: Bedeutungsumfang von שׁוב bei der Rückkehr zu Gott
  choice: seid ihr nicht zu mir zurückgekehrt
  alternative: seid ihr nicht zu mir umgekehrt
  rationale: „Zurückgekehrt“ bewahrt die Bildlichkeit einer Rückkehr und lässt zugleich den prophetischen Ruf zur Umkehr anklingen. „Umgekehrt“ würde den Bußaspekt im Deutschen stärker festlegen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Städte bleiben wie im Hebräischen als handelnde Größen stehen, obwohl ihre Einwohner gemeint sind. Der Wechsel von der dritten Person („sie“) zur direkten Anrede („ihr“) wird bewahrt.
