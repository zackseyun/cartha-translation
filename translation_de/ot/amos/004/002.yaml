  text: נִשְׁבַּ֨ע אֲדֹנָ֤/י יְהוִה֙ בְּ/קָדְשׁ֔/וֹ כִּ֛י הִנֵּ֥ה יָמִ֖ים בָּאִ֣ים עֲלֵי/כֶ֑ם וְ/נִשָּׂ֤א אֶתְ/כֶם֙ בְּ/צִנּ֔וֹת וְ/אַחֲרִיתְ/כֶ֖ן בְּ/סִיר֥וֹת דּוּגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/002.yaml
  text: 'The Lord GOD has sworn by his holiness: For behold[a], days are coming upon you when they will lift you away with hooks[b], and your posterity with fishhooks.'
translation:
  language: de
  text: 'Der Herr Jahwe hat bei seiner Heiligkeit geschworen: Seht, es kommen Tage über euch, da wird man euch mit Haken fortschleppen und die Letzten von euch mit Angelhaken.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Ausdrücke für „Haken“ und „Angelhaken“ sind unsicher. Gemeint sein können allgemein scharfe Geräte, mit denen Menschen wie gefangene Fische fortgeschleppt werden. „Die Letzten von euch“ kann auch „euren Rest“, „euer Ende“ oder „eure Nachkommenschaft“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: Gibt den zusammengesetzten Gottestitel in geläufiger deutscher Bibelsprache wieder, ohne die unschöne Verdoppelung „Herr HERR“.
- source_word: נִשְׁבַּע
  choice: hat ... geschworen
  rationale: Das Perfekt bezeichnet den feierlich vollzogenen Schwur mit fortdauernder Geltung.
- source_word: בְּקָדְשׁוֹ
  choice: bei seiner Heiligkeit
  rationale: קדשׁ bezeichnet hier am ehesten Gottes Heiligkeit als Bekräftigung des Schwurs, nicht sein Heiligtum.
- source_word: כִּי הִנֵּה
  choice: Seht
  rationale: Eine natürliche, gegenwärtige Wiedergabe des prophetischen Aufmerksamkeitssignals; der Doppelpunkt trägt den einleitenden Zusammenhang.
- source_word: יָמִים בָּאִים עֲלֵיכֶם
  choice: es kommen Tage über euch
  rationale: Bewahrt die prophetische Ankündigungsformel und den bedrohlichen Sinn von עַל.
- source_word: וְנִשָּׂא אֶתְכֶם
  choice: da wird man euch ... fortschleppen
  rationale: Die morphologische 3. Person Singular wird kontextgemäß unpersönlich verstanden. „Fortschleppen“ vermittelt gewaltsame Wegführung und das konkrete Hakenbild.
- source_word: בְּצִנּוֹת
  choice: mit Haken
  rationale: Die schwierige Bezeichnung wird aufgrund des Parallelismus mit Fischfanggerät als Haken beziehungsweise Widerhaken verstanden.
- source_word: וְאַחֲרִיתְכֶן
  choice: selbst die Letzten von euch
  rationale: אַחֲרִית kann Ende, Nachkommenschaft oder die Übrigbleibenden bezeichnen. Im Bild vollständiger Wegführung passt „die Letzten von euch“ und vermeidet eine vorschnelle Festlegung auf Nachkommen.
- source_word: בְּסִירוֹת דּוּגָה
  choice: mit Angelhaken
  rationale: Die schwierige Wendung wird parallel zu צִנּוֹת als Gerät des Fischfangs verstanden; „Angelhaken“ erhält die Bildsprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: Herr Jahwe
  rationale: Die traditionelle deutsche Ersatzlesung bewahrt die Unterscheidung beider Bestandteile durch die feste Formulierung „Gott, der HERR“. Der hebräische Text enthält jedoch ausdrücklich den Gottesnamen, weshalb „Herr Jahwe“ als sachlich mögliche Alternative bestehen bleibt.
- issue: Bezug von וְאַחֲרִיתְכֶן
  choice: selbst die Letzten von euch
  alternative: eure Nachkommenschaft / euren Rest
  rationale: Der Kontext droht den angesprochenen Frauen mit vollständiger Wegführung. Die Formulierung wahrt den kollektiven End- beziehungsweise Restbezug, ohne die lexikalische Mehrdeutigkeit dogmatisch auf eine Nachkommenschaft festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ vermeidet das altertümliche „Siehe“. Die angesprochenen Personen sind im Hebräischen weiblich plural; im Zusammenhang sind die Frauen Samarias gemeint. Der Vers selbst bleibt ohne ergänzende Anrede verständlich.
