reference: Amos 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֞וּ הַ/דָּבָ֣ר הַ/זֶּ֗ה פָּר֤וֹת הַ/בָּשָׁן֙ אֲשֶׁר֙ בְּ/הַ֣ר שֹֽׁמְר֔וֹן הָ/עֹשְׁק֣וֹת דַּלִּ֔ים הָ/רֹצְצ֖וֹת אֶבְיוֹנִ֑ים הָ/אֹמְרֹ֥ת לַ/אֲדֹֽנֵי/הֶ֖ם הָבִ֥יאָ/ה וְ/נִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/001.yaml
  text: Hear this word[a], you cows of Bashan, who are on the mountain of Samaria, who oppress the poor, who crush the needy, who say to their masters, “Bring[b], that we may drink.”
translation:
  language: de
  text: 'Hört dieses Wort, ihr Kühe von Baschan[a], die ihr auf dem Berg Samarias wohnt, die ihr die Armen unterdrückt und die Bedürftigen zermalmt, die ihr zu euren Herren[b] sagt: »Bring her, damit wir trinken!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baschan war eine fruchtbare Gegend östlich des Jordan, die für ihr wohlgenährtes Vieh bekannt war. Das Bild ist eine beißende Beleidigung für Menschen, die im Luxus leben und andere unterdrücken.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Ehemännern“. Das hebräische Wort kann je nach Zusammenhang Herren, Gebieter oder Ehemänner bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Imperativ Plural eröffnet den prophetischen Aufruf unmittelbar und kraftvoll.
- source_word: הַדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: „Wort“ bewahrt den formalen Klang einer prophetischen Botschaft, ohne דָּבָר unnötig auszudeuten.
- source_word: פָּרוֹת הַבָּשָׁן
  choice: Kühe von Baschan
  rationale: פָּרוֹת bezeichnet weibliche Rinder. Die direkte, bewusst scharfe Metapher bleibt ungemildert erhalten.
- source_word: בְּהַר שֹׁמְרוֹן
  choice: auf dem Berg von Samaria
  rationale: Die Formulierung gibt den singularischen Ortsausdruck verständlich und quellennah wieder.
- source_word: הָעֹשְׁקוֹת דַּלִּים
  choice: die ihr die Armen unterdrückt
  rationale: עשׁק bezeichnet soziale oder wirtschaftliche Unterdrückung; „unterdrückt“ wahrt die Breite des Ausdrucks.
- source_word: הָרֹצְצוֹת אֶבְיוֹנִים
  choice: die Bedürftigen zermalmt
  rationale: „Zermalmt“ bewahrt die gewaltsame Metaphorik von רצץ; „Bedürftige“ unterscheidet אֶבְיוֹנִים leicht von דַּלִּים.
- source_word: הָאֹמְרֹת לַאֲדֹנֵיהֶם
  choice: die ihr zu euren Herren sagt
  rationale: אֲדֹנִים kann Herren, Gebieter oder im gegebenen Zusammenhang Ehemänner bezeichnen. „Herren“ hält die allgemeinere lexikalische Bedeutung im Haupttext fest; die mögliche eheliche Bedeutung steht in der Fußnote.
- source_word: הָבִיאָה
  choice: Bring her
  rationale: Der transitive Imperativ lässt wie im Hebräischen das Objekt unausgesprochen. Der Singular passt zur direkten, jeweils an einen einzelnen Herrn gerichteten Rede.
- source_word: וְנִשְׁתֶּה
  choice: damit wir trinken
  rationale: „Damit“ gibt die im Zusammenhang naheliegende Zweckbeziehung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Adressatinnen der Metapher „Kühe von Baschan“
  choice: Die femininen Pluralformen werden als direkte Anrede an wohlhabende Frauen Samarias wiedergegeben.
  alternative: Die Metapher könnte allgemeiner die luxuriöse Oberschicht Samarias meinen.
  rationale: Die durchgehend femininen Formen sprechen deutlich für Frauen als unmittelbare Adressatinnen. Die Übersetzung lässt die beißende prophetische Metapher stehen, ohne sie im Haupttext zu erklären oder abzuschwächen.
- issue: Bedeutung von לַאֲדֹנֵיהֶם
  choice: euren Herren
  alternative: euren Ehemännern
  rationale: Der hebräische Ausdruck legt die konkrete Beziehung nicht eindeutig fest. Der Haupttext wahrt die weitere Bedeutung, während die Fußnote die im Kontext plausible eheliche Deutung nennt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Anrede und die harte Bildsprache bleiben erhalten. Die Relativsätze werden mit „die ihr“ persönlich und rhetorisch klar geführt; ein verbindendes „und“ verhindert unnötige Schwerfälligkeit.
