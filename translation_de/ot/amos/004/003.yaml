base_translation:
  language: en
  yaml_path: translation/ot/amos/004/003.yaml
  text: And through the breaches you will go out[a], each woman straight ahead of her[b], and you will be cast out toward Harmon,” declares Yahweh.
translation:
  language: de
  text: Und durch die Breschen werdet ihr hinausgehen, jede Frau geradewegs vor sich hin[a], und ihr werdet nach Harmon geworfen werden[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „jede Frau vor ihr“ oder „jede Frau ihr gegenüber“. Die Wendung kann hier bedeuten, dass jede Frau geradeaus vor sich hin hinausgeht.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Verbform ist grammatisch schwer zu deuten und kann formal auch aktiv verstanden werden: „und ihr werdet [sie] werfen“. Auch הַהַרְמוֹנָה ist dunkel; möglich sind unter anderem „nach Harmon“, „zur Festung“ oder „zum Hermon“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפְרָצִים
  choice: durch die Breschen
  rationale: פְרָצִים bezeichnet Durchbrüche oder Breschen, hier wohl in der Stadtmauer. Die Präposition „durch“ gibt die im Zusammenhang vorausgesetzte Bewegung durch diese Öffnungen natürlich wieder.
- source_word: תֵּצֶאנָה
  choice: werdet ihr hinausgehen
  rationale: Der Qal-Imperfekt 2. Person feminin Plural von יצא hat regulär aktive Bedeutung. Das erzwungene Exil ergibt sich aus dem Kontext, ohne dass das Verb selbst passiv wiedergegeben werden muss.
- source_word: אִשָּׁה נֶגְדָּהּ
  choice: jede Frau geradewegs vor sich hin
  rationale: אִשָּׁה ist hier distributiv gebraucht. נֶגְדָּהּ bedeutet wörtlich etwa „vor ihr“ oder „ihr gegenüber“; im Bild der Flucht durch unmittelbar vorausliegende Breschen bezeichnet es wahrscheinlich die geradlinige Bewegung nach vorn.
- source_word: וְהִשְׁלַכְתֶּנָה
  choice: und ihr werdet … geworfen werden
  rationale: Die Form ist schwierig und formal eher aktiv-kausativ, doch die Syntax und der Zusammenhang legen eine unpersönliche beziehungsweise passive Aussage über die Vertreibung der angeredeten Frauen nahe. Die Fußnote hält die grammatische Schwierigkeit offen.
- source_word: הַהַרְמוֹנָה
  choice: nach Harmon
  rationale: Das Wort ist dunkel und könnte ein Ortsname sein. Die Transliteration „Harmon“ vermeidet es, die unsichere Referenz vorschnell als „Festung“ oder „Hermon“ festzulegen; die Endung wird als Richtungsangabe wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und würdevoll wiedergegeben; der Gottesname erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im modernen Standarddeutsch unmittelbar und in der geläufigen deutschen Form wieder.
- issue: Art der angekündigten Wegführung
  choice: 'Passivische Wiedergabe: „ihr werdet … geworfen werden“'
  alternative: 'Aktive Wiedergabe: „ihr werdet [sie] … werfen“'
  rationale: Die passive Wiedergabe entspricht dem Gerichtskontext und der wahrscheinlich gemeinten Vertreibung, ohne einen menschlichen oder göttlichen Handelnden ausdrücklich einzusetzen. Wegen der schwierigen Verbform wird die aktive Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im femininen Plural. „Breschen“ bewahrt das konkrete Bild der aufgebrochenen Stadtmauer. Die ungewöhnliche Schlusswendung wird nicht geglättet; ihre grammatische und geografische Unsicherheit ist in der Fußnote ausgewiesen.
