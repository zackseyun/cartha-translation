source:
  edition: WLC
  text: כִּ֡י הִנֵּה֩ יוֹצֵ֨ר הָרִ֜ים וּ/בֹרֵ֣א ר֗וּחַ וּ/מַגִּ֤יד לְ/אָדָם֙ מַה שֵּׂח֔/וֹ עֹשֵׂ֥ה שַׁ֨חַר֙ עֵיפָ֔ה וְ/דֹרֵ֖ךְ עַל בָּ֣מֳתֵי אָ֑רֶץ יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/013.yaml
  text: For behold[a], the one who forms the mountains and creates the wind, and declares to man what his thought is, who makes the dawn darkness and treads on the heights of the earth—Yahweh, the God of hosts[c][b], is his name.
translation:
  language: de
  text: 'Denn siehe: Er formt die Berge und erschafft den Wind[a]; er teilt dem Menschen mit, was sein Gedanke ist[b]; er macht die Morgenröte zur Finsternis und schreitet auf den Höhen der Erde – Yahweh, der Gott der Heerscharen, ist sein Name.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Geist“ beziehungsweise „den Atem“. Das hebräische Wort רוּחַ kann Wind, Atem oder Geist bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „sein Gedanke“ kann sich grammatisch auf den Menschen oder auf Gott beziehen. Das zugrunde liegende hebräische Wort kann auch „Sinnen“, „Äußerung“ oder „Klage“ bedeuten.
    reason: ambiguity
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn sieh
  rationale: כִּי begründet die vorangehende Warnung; הִנֵּה vergegenwärtigt die folgende Aussage nachdrücklich. „Denn sieh“ bewahrt beide Funktionen in natürlichem, feierlichem Deutsch.
- source_word: יוֹצֵר הָרִים
  choice: Er formt die Berge
  rationale: Das Partizip von יצר bezeichnet bewusstes Formen oder Gestalten. „formt“ erhält das handwerklich-konkrete Schöpfungsbild.
- source_word: וּבֹרֵא רוּחַ
  choice: und erschafft den Wind
  rationale: רוח kann Wind, Atem oder Geist bedeuten. Im Zusammenhang mit Bergen, Morgenröte und Erdhöhen liegt die kosmische Bedeutung „Wind“ nahe; die echte Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: וּמַגִּיד לְאָדָם
  choice: er lässt den Menschen wissen
  rationale: מגיד bedeutet bekanntmachen, mitteilen oder verkünden. Der bestimmte Singular „den Menschen“ gibt אדם als repräsentativen Einzelbegriff wieder und ist im Deutschen zugleich generisch verständlich.
- source_word: מַה שֵּׂחוֹ
  choice: was sein Gedanke ist
  rationale: שׂיח kann Gedanke, inneres Sinnen, Äußerung oder Klage bezeichnen. „Gedanke“ wahrt die naheliegende innere Bedeutung, ohne die mehrdeutige Zuordnung des Pronomens aufzulösen.
- source_word: עֹשֵׂה שַׁחַר עֵיפָה
  choice: Er macht die Morgenröte zur Finsternis
  rationale: עיפה bezeichnet Dunkelheit oder Finsternis. Die Formulierung gibt die wahrscheinlich gemeinte Verwandlung der Morgenröte in Finsternis klar und bildkräftig wieder.
- source_word: וְדֹרֵךְ עַל בָּמֳתֵי אָרֶץ
  choice: und schreitet über die Höhen der Erde
  rationale: דרך על bezeichnet Treten oder Schreiten auf beziehungsweise über etwas. „Höhen“ versteht במות hier topografisch und bewahrt das Bild göttlicher Erhabenheit und Herrschaft.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: „Heerscharen“ erhält die militärisch-kosmische Bildwelt von צבאות und ist als feierlicher biblischer Ausdruck im Deutschen verständlich.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die deutsche Kopula vervollständigt den hebräischen Nominalsatz natürlich und bewahrt die abschließende Namensformel.
theological_decisions:
- issue: Bedeutung von רוּחַ
  choice: Wind
  alternative: Geist oder Atem
  rationale: Die umgebenden Aussagen beschreiben Gottes Macht über die geschaffene Welt, weshalb „Wind“ im Haupttext am ehesten passt. Die semantische und mögliche theologische Weite des Wortes wird jedoch nicht ausgeschlossen.
- issue: Bezug des Suffixes in שֵּׂחוֹ
  choice: „sein“ bleibt im Haupttext bezugsoffen
  alternative: „was der Mensch denkt“ oder „was Gottes Gedanke ist“
  rationale: Das maskuline Suffix kann im unmittelbaren Satz unterschiedlich bezogen werden. Die Übersetzung bewahrt diese Spannung, statt den Bezug stillschweigend festzulegen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich. Die Transliteration bewahrt den persönlichen Gottesnamen, während die traditionelle Ersetzung durch einen Titel vermieden wird.
- issue: Verständnis von בָּמֳתֵי אָרֶץ
  choice: Höhen der Erde
  alternative: Kultstätten der Erde
  rationale: Im kosmischen Kontext sind geografische Höhen gemeint; die sonst mögliche kultische Bedeutung von במות passt hier weniger gut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-prophetischem Klang. Die Partizipialreihe des Hebräischen wird durch kurze Hauptsätze gegliedert, ohne ihre feierliche Steigerung zu verlieren. Der traditionelle Ausdruck „Heerscharen“ bleibt wegen seiner Bildkraft erhalten.
