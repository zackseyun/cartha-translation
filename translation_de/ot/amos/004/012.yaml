  text: לָ/כֵ֕ן כֹּ֥ה אֶעֱשֶׂה לְּ/ךָ֖ יִשְׂרָאֵ֑ל עֵ֚קֶב כִּֽי זֹ֣את אֶֽעֱשֶׂה לָּ֔/ךְ הִכּ֥וֹן לִ/קְרַאת אֱלֹהֶ֖י/ךָ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/012.yaml
  text: Therefore[a], thus I will do to you, Israel; because I will do this to you, prepare to meet your God, Israel.
translation:
  language: de
  text: Darum werde ich so mit dir verfahren, Israel. Weil ich dies an dir tun werde, mach dich bereit, deinem Gott zu begegnen[a], Israel!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinem Gott entgegenzutreten“. Im Zusammenhang ist eine furchterregende Konfrontation nach der Ankündigung des Gerichts gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus den zuvor geschilderten Gerichten und klingt im modernen prophetischen Deutsch natürlich.
- source_word: כֹּה אֶעֱשֶׂה לְּךָ
  choice: werde ich so mit dir verfahren
  rationale: Bewahrt die hinweisende Bedeutung von כֹּה und den gegen Israel gerichteten Sinn von עשה mit ל, ohne die noch nicht näher bezeichnete Handlung auszudeuten. „Mit dir verfahren“ ist idiomatischer als das wörtliche „dir tun“.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname und die direkte Anrede werden unverändert beibehalten.
- source_word: עֵקֶב כִּי
  choice: Weil
  rationale: Gibt die begründende Verknüpfung idiomatisch wieder; die ungewöhnliche Wiederholung des angekündigten Handelns bleibt erhalten.
- source_word: זֹאת אֶעֱשֶׂה לָּךְ
  choice: ich dies mit dir tun werde
  rationale: „Dies“ entspricht dem Demonstrativpronomen זֹאת. Die Formulierung hält sich eng an das breite Verb עשה und lässt Art und Ausmaß des angekündigten Handelns offen.
- source_word: הִכּוֹן
  choice: mach dich bereit
  rationale: Gibt den singularischen Imperativ unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: לִקְרַאת אֱלֹהֶיךָ
  choice: deinem Gott zu begegnen
  rationale: Bezeichnet das bevorstehende Zusammentreffen mit Gott. „Begegnen“ bewahrt, für sich genommen, die Offenheit der Wendung.
theological_decisions:
- issue: Ton der Aufforderung, Gott zu begegnen
  choice: Eine bedrohliche Aufforderung, sich auf die Begegnung mit Gott im Gericht einzustellen
  alternative: Ein neutraler oder hoffnungsvoller Aufruf zu Gottesdienst oder Umkehr
  rationale: Der unmittelbare Zusammenhang zählt bereits vollzogene Gerichte auf und kündigt weiteres göttliches Handeln an. Dennoch wird der Gerichtssinn nicht in den Haupttext eingefügt, weil die Wendung selbst die genaue Art der Begegnung nicht ausdrücklich nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Direktheit. Die auffällige Wiederholung von Gottes angekündigtem Handeln und die zweimalige Anrede „Israel“ bleiben erhalten; das Ausrufezeichen unterstreicht die dringliche Schlussaufforderung, ohne zusätzliche Inhalte einzutragen.
