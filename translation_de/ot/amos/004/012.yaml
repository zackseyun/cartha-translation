    issue: „ich dies mit dir tun werde“
    rationale: Im modernen Deutsch legt „etwas mit jemandem tun“ häufig gemeinsames oder begleitendes Handeln nahe. Der hebräische Ausdruck עשה לְ enthält hier angesichts des Kontextes eine auf Israel gerichtete, nicht kooperative Handlung. „An dir tun“ ist idiomatisch und vermeidet diese Bedeutungsverschiebung.
