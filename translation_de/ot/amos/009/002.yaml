id: AMO.9.2
reference: Amos 9:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם יַחְתְּר֣וּ בִ/שְׁא֔וֹל מִ/שָּׁ֖ם יָדִ֣/י תִקָּחֵ֑/ם וְ/אִֽם יַעֲלוּ֙ הַ/שָּׁמַ֔יִם מִ/שָּׁ֖ם אוֹרִידֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/002.yaml
  text: Though they dig into Sheol[a], from there my hand will take them; and though they climb up to the heavens, from there I will bring them down.
translation:
  language: de
  text: Selbst wenn sie sich in den Scheol[a] hineingraben, wird meine Hand sie von dort holen; und selbst wenn sie zum Himmel hinaufsteigen, werde ich sie von dort herabbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Scheol bezeichnet das Totenreich oder die Unterwelt; auch mit „Grab“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתְּרוּ
  choice: sich hineingraben
  rationale: Das Verb חתר bezeichnet ein Graben oder Durchbrechen. „Sich hineingraben“ bewahrt das konkrete Bild eines verzweifelten Fluchtversuchs und klingt im Deutschen natürlich.
- source_word: בִשְׁאוֹל
  choice: in den Scheol
  rationale: „Scheol“ bewahrt den hebräischen Begriff für das Totenreich beziehungsweise die Unterwelt, ohne ihn auf das einzelne Grab zu verengen oder mit späteren Vorstellungen gleichzusetzen.
- source_word: יָדִי
  choice: meine Hand
  rationale: Die wörtliche Wiedergabe erhält das anschauliche Bild von Gottes Reichweite und Macht.
- source_word: תִקָּחֵם
  choice: wird sie holen
  rationale: לקח kann „nehmen“, „ergreifen“ oder „holen“ bedeuten. In Verbindung mit „meine Hand“ drückt „holen“ die unausweichliche Erfassung natürlich aus, ohne die Gewalt stärker zu betonen als der Ausgangstext.
- source_word: יַעֲלוּ
  choice: hinaufsteigen
  rationale: Die Richtungsangabe wird ausdrücklich wiedergegeben und bildet einen klaren Gegensatz zum Hineingraben in den Scheol.
- source_word: הַשָּׁמַיִם
  choice: zum Himmel
  rationale: Obwohl das hebräische Wort formal im Plural steht, ist „Himmel“ im modernen Deutschen die natürliche Bezeichnung für den oberen kosmischen Gegenpol zum Scheol.
- source_word: אוֹרִידֵם
  choice: werde ich sie herabbringen
  rationale: Die kausative Form von ירד bedeutet, jemanden hinabgehen zu lassen beziehungsweise hinabzubringen. „Herabbringen“ gibt dies direkt wieder.
- source_word: אִם ... וְאִם
  choice: Selbst wenn ... und selbst wenn
  rationale: 'Die Bedingungssätze haben hier konzessive Kraft: Auch die äußersten Fluchtversuche wären erfolglos. „Selbst wenn“ macht diese Aussage im Deutschen deutlich.'
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Unterwelt; Grab
  rationale: Der Vers stellt Scheol und Himmel als kosmische Extreme gegenüber, um auszudrücken, dass niemand Gottes Gericht entkommen kann. Die Transliteration bewahrt die Eigenart und Bedeutungsbreite des hebräischen Begriffs; die Fußnote erschließt ihn für heutige Leser.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die räumlichen Richtungsangaben bewahren die eindringliche poetische Bildsprache des Hebräischen.
