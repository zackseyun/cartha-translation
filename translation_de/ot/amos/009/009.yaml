  source_fidelity: Die Zukunftsform וַהֲנִעוֹתִי bezeichnet Gottes angekündigtes Handeln und sollte im Deutschen als Zukunft wiedergegeben werden. Das Bild von der Bewegung im Sieb und der nicht zu Boden fallende צְרוֹר bleiben in der Revision erhalten.
  naturalness: „Ich werde … schütteln“ ist idiomatischer und zeitlich genauer als das präsentische „ich schüttle“. „wie man mit einem Sieb schüttelt“ ist im Deutschen eine natürliche Wiedergabe des Siebbildes; die Vorlage legt das geschüttelte Material nicht ausdrücklich fest.
  terminology: „Haus Israel“, „Völker“, „Sieb“ und „Kiesel“ sind sachgerecht. „Kiesel“ gibt צְרוֹר als kleinen festen Stein wieder, ohne daraus ein Getreidekorn zu machen.
