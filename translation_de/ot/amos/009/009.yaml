source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה אָֽנֹכִי֙ מְצַוֶּ֔ה וַ/הֲנִע֥וֹתִי בְ/כָֽל הַ/גּוֹיִ֖ם אֶת בֵּ֣ית יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֤ר יִנּ֨וֹעַ֙ בַּ/כְּבָרָ֔ה וְ/לֹֽא יִפּ֥וֹל צְר֖וֹר אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/009.yaml
  text: For look, I am commanding, and I will shake the house of Israel among all the nations, as one shakes with a sieve, yet not a pebble will fall to the ground.
translation:
  language: de
  text: 'Denn siehe: Ich gebe den Befehl und werde das Haus Israel unter allen Völkern schütteln, wie man mit einem Sieb schüttelt; doch kein Kiesel wird zur Erde fallen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: seht
  rationale: Gibt den aufmerksamkeitslenkenden Diskurspartikel knapp und in natürlichem, würdigem Deutsch wieder.
- source_word: מְצַוֶּה
  choice: gebe den Befehl
  rationale: Bewahrt den präsentischen Charakter und lässt, wie im Hebräischen, den Inhalt beziehungsweise die Ausführung des Befehls im folgenden Satz entfaltet werden.
- source_word: וַהֲנִעוֹתִי / יִנּוֹעַ
  choice: schüttle / schüttelt
  rationale: Die wiederholte Wurzel נוע wird im Deutschen möglichst durch dasselbe Verb wiedergegeben; im Bild des Siebes ist „schütteln“ idiomatisch.
- source_word: בְכָל הַגּוֹיִם
  choice: unter allen Völkern
  rationale: „Unter“ bildet Israels Zerstreuung beziehungsweise Bewegung inmitten der Völker natürlich ab, ohne eine überpräzise räumliche Deutung aufzuzwingen.
- source_word: כְּבָרָה
  choice: Sieb
  rationale: Bezeichnet ein Sieb- oder Sichtgerät; „Sieb“ ist die klare moderne Entsprechung.
- source_word: צְרוֹר
  choice: Steinchen
  rationale: Das Wort kann ein kleines festes Teilchen, Klümpchen oder Steinchen bezeichnen. „Steinchen“ passt zum Siebbild und bewahrt, dass nichts Festes verloren geht.
theological_decisions:
- issue: Verhältnis von Gericht und Bewahrung im Siebbild
  choice: „doch kein Steinchen fällt zur Erde“
  alternative: „doch kein Korn fällt zur Erde“
  rationale: 'Der Text nennt nicht ausdrücklich ein Getreidekorn, sondern צְרוֹר. Die Übersetzung wahrt deshalb die Spannung: Israel wird heftig gesiebt, zugleich geht das bezeichnete feste Teilchen nicht verloren. Sie legt nicht fest, ob dies ausschließlich Bewahrung oder auch die Aussonderung der Schuldigen meint.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „seht“ markiert den präsentierenden Charakter von הִנֵּה. Die Satzstruktur bleibt eng am hebräischen Bild und vermeidet konfessionelle Ausdeutung.
