id: AMO.9.15
reference: Amos 9:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/נְטַעְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹ֨א יִנָּתְשׁ֜וּ ע֗וֹד מֵ/עַ֤ל אַדְמָתָ/ם֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם אָמַ֖ר יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/015.yaml
  text: I will plant them on their land[a], and they will never again be uprooted from the land that I have given them, says Yahweh your God.
translation:
  language: de
  text: Ich werde sie in ihrem Land pflanzen, und nie wieder werden sie aus ihrem Land herausgerissen, das ich ihnen gegeben habe, spricht Jahwe, dein Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „dein Gott“ im Singular. Damit kann Israel als ein Volk angesprochen sein; „ihr Gott“ wäre eine glättende Wiedergabe.
    reason: Der auffällige Wechsel von den Pluralformen „sie/ihnen“ zur singularischen Anrede soll für Leserinnen und Leser erkennbar bleiben.
lexical_decisions:
- source_word: וּנְטַעְתִּים
  choice: Ich werde sie pflanzen
  rationale: Das Verb נטע bedeutet wörtlich „pflanzen“. Die Wiedergabe bewahrt das Bild, das durch das spätere „herausgerissen“ weitergeführt wird.
- source_word: עַל אַדְמָתָם
  choice: in ihrem Land
  rationale: אֲדָמָה kann „Erdboden“, „Boden“ oder „Land“ bezeichnen. Im Zusammenhang der Wiederherstellung bezeichnet „Land“ den Lebensraum des Volkes; die deutsche Verbindung „in ihrem Land pflanzen“ ist idiomatisch.
- source_word: וְלֹא יִנָּתְשׁוּ עוֹד
  choice: und nie wieder werden sie … herausgerissen
  rationale: Der Nifal von נתש bezeichnet das Herausreißen beziehungsweise Entwurzeln. „Herausgerissen“ erhält das Pflanzbild und vermittelt zugleich die gewaltsame Vertreibung aus dem Land.
- source_word: מֵעַל אַדְמָתָם
  choice: aus ihrem Land
  rationale: מֵעַל bedeutet wörtlich „von … herab/weg“. In diesem Zusammenhang ist „aus ihrem Land“ natürliches Deutsch und bringt die Entfernung aus dem Land klar zum Ausdruck.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: das ich ihnen gegeben habe
  rationale: Das Perfekt bezeichnet die vollzogene Gabe. Das deutsche Perfekt hebt hervor, dass das Land weiterhin als Gottes Gabe gilt.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die traditionelle deutsche Prophetenformel „spricht“ gibt die autoritative göttliche Aussage würdig und knapp wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Der masoretische Text hat ein Suffix der zweiten Person maskulin Singular. Dieser auffällige Wechsel gegenüber den vorherigen Pluralformen wird nicht geglättet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Numeruswechsel in אֱלֹהֶיךָ
  choice: dein Gott
  alternative: ihr Gott
  rationale: Der überlieferte hebräische Text liest Singular und kann Israel als kollektives Gegenüber anreden. „Ihr Gott“ wäre im Satz glatter, besitzt hier aber keine entsprechende masoretische Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das durchgehende Bild von Pflanzen und Herausreißen bleibt erhalten. Der unerwartete Wechsel zur singularischen Anrede wird im Haupttext bewahrt und in der Fußnote erläutert.
