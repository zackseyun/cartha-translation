reference: Amos 9:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/ל֣וֹא כִ/בְנֵי֩ כֻשִׁיִּ֨ים אַתֶּ֥ם לִ֛/י בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֶת יִשְׂרָאֵ֗ל הֶעֱלֵ֨יתִי֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/פְלִשְׁתִּיִּ֥ים מִ/כַּפְתּ֖וֹר וַ/אֲרָ֥ם מִ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/007.yaml
  text: Are you not like the Cushites to me[a], O sons of Israel? declares Yahweh. Did I not bring up Israel from the land of Egypt, and the Philistines from Caphtor[c][b], and Aram from Kir?
translation:
  language: de
  text: Seid ihr mir nicht wie die Kuschiten[a], ihr Söhne Israels? – Ausspruch Jahwes. Habe ich nicht Israel aus dem Land Ägypten heraufgeführt, die Philister aus Kaftor[b] und Aram[c] aus Kir?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die Äthiopier“. Im Hebräischen steht „Kuschiten“, also Angehörige von Kusch.'
    reason: lexical_alternative
  - marker: b
    text: Kaftor ist ein Ortsname, der traditionell häufig mit Kreta in Verbindung gebracht wird; die genaue Identifizierung ist jedoch umstritten.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Aramäer“. Das hebräische „Aram“ kann das Land oder dessen Bevölkerung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Seid ihr nicht / Habe ich nicht
  rationale: Die rhetorische Frage erwartet jeweils Zustimmung. Die deutsche Negativfrage bewahrt sowohl diese Erwartung als auch die Parallelität der beiden Satzhälften.
- source_word: כִבְנֵי כֻשִׁיִּים
  choice: wie die Kuschiten
  rationale: כְּ bezeichnet den Vergleich; בְּנֵי steht hier idiomatisch für die Angehörigen eines Volkes. „Kuschiten“ gibt den hebräischen ethnogeografischen Namen wieder, ohne ihn vorschnell mit einem späteren geografischen Begriff gleichzusetzen.
- source_word: אַתֶּם לִי
  choice: ihr mir
  rationale: Das לִי bezeichnet die Beziehung aus Jahwes Perspektive. Die knappe Formulierung „mir“ bewahrt die Direktheit und vermeidet eine erklärende Festlegung wie „in meinen Augen“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ihr Söhne Israels
  rationale: Die Anrede und die grammatisch maskuline Form bleiben erhalten. Das vorangestellte „ihr“ macht den Vokativ in modernem Deutsch natürlich verständlich.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feierliche prophetische Formel wird knapp und quellenah wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftsnahe Wiedergabe des Gottesnamens wahrt dessen Eigennamencharakter.
- source_word: הֶעֱלֵיתִי
  choice: heraufgeführt
  rationale: Der Hifil von עלה bezeichnet ein Heraufführen. Die Wiedergabe funktioniert für alle drei parallelen Herkunftsaussagen und beschränkt den Gedanken nicht allein auf Israels Auszug.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Das ausdrücklich genannte אֶרֶץ wird beibehalten.
- source_word: פְלִשְׁתִּיִּים
  choice: die Philister
  rationale: Dies ist die etablierte deutsche Volksbezeichnung.
- source_word: כַּפְתּוֹר
  choice: Kaftor
  rationale: Der Eigenname wird transliteriert, weil die genaue geografische Identifizierung umstritten ist.
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische Ausdruck kann Land oder Volk bezeichnen. Der Eigenname wahrt diese Offenheit besser als „Syrien“; eine mögliche kollektive Wiedergabe wird in der Fußnote genannt.
- source_word: קִיר
  choice: Kir
  rationale: Der Ortsname wird transliteriert.
theological_decisions:
- issue: Bedeutung des Vergleichs Israels mit den Kuschiten
  choice: Der unmittelbare Vergleich bleibt ungemildert stehen und wird durch die parallelen Wanderungen anderer Völker ergänzt.
  alternative: Den Vergleich ausschließlich als Aussage über geografische Wanderungen zu erklären oder Israels Sonderstellung bereits in der Übersetzung ausdrücklich zu verneinen.
  rationale: Die rhetorische Frage relativiert Israels Berufung auf ethnische Zugehörigkeit und Exodusgeschichte, während der folgende Satz Gottes Handeln auch in der Geschichte anderer Völker erkennen lässt. Die Übersetzung bewahrt diese Spannung, ohne sie lehrmäßig auszudeuten.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: ihr Söhne Israels
  alternative: ihr Israeliten / ihr Kinder Israels / Volk Israel
  rationale: Die Form wahrt die konkrete hebräische Bezeichnung und den Charakter der direkten Anrede, ohne sie zu einem neutralen Kollektiv umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellenaher Satzstruktur. Die rhetorischen Fragen und die dreigliedrige Parallelität bleiben erhalten. „Ausspruch Jahwes“ trägt den feierlichen prophetischen Ton; Eigennamen werden nicht durch unsichere moderne Identifizierungen ersetzt.
