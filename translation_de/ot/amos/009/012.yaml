  text: לְמַ֨עַן יִֽירְשׁ֜וּ אֶת שְׁאֵרִ֤ית אֱדוֹם֙ וְ/כָל הַ/גּוֹיִ֔ם אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עֲלֵי/הֶ֑ם נְאֻם יְהוָ֖ה עֹ֥שֶׂה זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/012.yaml
  text: so that they may possess the remnant of Edom and all the nations who are called by my name,” declares Yahweh[b][a], who does this.
translation:
  language: de
  text: damit sie den Rest Edoms und alle Nationen, die meinen Namen tragen[a], in Besitz nehmen“, spricht Jahwe, der dies tut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „über denen mein Name genannt worden ist“. Diese hebräische Wendung bezeichnet Menschen, die Jahwe gehören oder von ihm beansprucht werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Fassung dieses Verses, die in Apostelgeschichte 15,17 angeführt wird, weicht deutlich ab. Sinngemäß lautet sie: „damit die übrigen Menschen den Herrn suchen, dazu alle Nationen, über denen mein Name genannt worden ist“.'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt den Zweck beziehungsweise die Folge der im vorausgehenden Zusammenhang verheißenen Wiederherstellung knapp und natürlich wieder.
- source_word: יִירְשׁוּ
  choice: in Besitz nehmen
  rationale: Bewahrt den Grundsinn von ירשׁ, ohne die Aussage durch das im Deutschen stärker erbrechtlich klingende „erben“ einzuengen.
- source_word: שְׁאֵרִית אֱדוֹם
  choice: den Rest Edoms
  rationale: „Rest“ erhält den prophetischen Begriff für das nach dem Gericht Verbliebene; „Edom“ ist die übliche Namensform.
- source_word: וְכָל הַגּוֹיִם
  choice: und alle Nationen
  rationale: גּוֹיִם bezeichnet hier die Völker außerhalb Israels; „Nationen“ ist breit verständlich und weniger traditionsgebunden als „Heiden“.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: die meinen Namen tragen
  rationale: Gibt die hebräische Zugehörigkeitsformel in natürlichem Deutsch wieder. Die wörtlichere Ausdrucksweise und ihre Bedeutung werden in Fußnote [a] erläutert.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Natürliche und würdige Wiedergabe der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֹשֶׂה זֹּאת
  choice: der dies tut
  rationale: Der Partizipialsatz bezeichnet Jahwe als den, der die verheißene Tat vollbringt, ohne den Zeitaspekt unnötig auf Gegenwart oder Zukunft festzulegen.
theological_decisions:
- issue: Israels Verhältnis zu Edom und den Nationen im Wiederherstellungswort
  choice: Die masoretische Aussage, dass sie den Rest Edoms und die Nationen in Besitz nehmen, bleibt im Haupttext unverändert erhalten.
  alternative: Den Haupttext nach der griechischen Überlieferung und Apostelgeschichte 15,17 auf die Suche der übrigen Menschen nach dem Herrn auszurichten.
  rationale: Der vorliegende hebräische Text spricht ausdrücklich vom Inbesitznehmen Edoms und der Nationen. Die deutlich abweichende griechische Textgestalt wird dokumentiert, aber nicht in den hebräischen Haupttext eingetragen.
- issue: Bedeutung der Namensformel
  choice: „die meinen Namen tragen“ als Zugehörigkeitsaussage
  alternative: Die rein formale Wiedergabe „über denen mein Name ausgerufen worden ist“
  rationale: Die idiomatische Übersetzung macht die beanspruchte Zugehörigkeit verständlich, während die Fußnote die konkrete hebräische Bildform bewahrt und keine bestimmte konfessionelle Deutung hinzufügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Besitz nehmen“ wahrt die konkrete Aussage des hebräischen Textes; „die meinen Namen tragen“ vermittelt die Zugehörigkeitsformel idiomatisch. Die Satzstellung schließt unmittelbar an den vorausgehenden Vers an, wie es das einleitende לְמַעַן verlangt.
