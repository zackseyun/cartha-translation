id: AMO.9.4
reference: Amos 9:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם יֵלְכ֤וּ בַ/שְּׁבִי֙ לִ/פְנֵ֣י אֹֽיבֵי/הֶ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/חֶ֖רֶב וַ/הֲרָגָ֑תַ/ם וְ/שַׂמְתִּ֨י עֵינִ֧/י עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֥א לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/004.yaml
  text: And if they go into captivity before their enemies[a], from there I will command the sword, and it will kill them; and I will set my eyes on them for harm and not for good.
translation:
  language: de
  text: Und wenn sie vor ihren Feinden in die Gefangenschaft ziehen, werde ich von dort aus dem Schwert befehlen, und es wird sie töten. Ich werde mein Auge auf sie richten – zum Unheil[a] und nicht zum Guten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »zum Bösen« oder »zum Schaden«. Das hebräische Wort bezeichnet hier Unheil beziehungsweise strafendes Gericht, nicht moralische Bosheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorausgehenden Zusammenhang als auch die konditionale Bedeutung.
- source_word: יֵלְכוּ בַשְּׁבִי
  choice: sie in die Gefangenschaft ziehen
  rationale: Gibt das aktive Bewegungsverb הלך und den Übergang in den Zustand der Gefangenschaft wieder, ohne durch eine passive Formulierung mehr Zwang auszudrücken, als im Verb selbst steht.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: vor ihren Feinden
  rationale: Entspricht der hebräischen Wendung knapp und natürlich; gemeint ist die Gefangenschaft in Gegenwart beziehungsweise unter der Gewalt ihrer Feinde.
- source_word: מִשָּׁם
  choice: von dort aus
  rationale: Unterstreicht, dass selbst der Ort der Gefangenschaft dem angekündigten Gericht nicht entzogen ist.
- source_word: אֲצַוֶּה אֶת־הַחֶרֶב
  choice: werde ich von dort aus dem Schwert befehlen
  rationale: Erhält die Personifikation des Schwertes als eines handelnden Werkzeugs unter Gottes Befehl.
- source_word: וַהֲרָגָתַם
  choice: und es wird sie töten
  rationale: Das feminine Singularverb bezieht sich auf das Schwert und führt dessen Personifikation ausdrücklich fort.
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: Ich werde mein Auge auf sie richten
  rationale: Bewahrt das im Hebräischen singularische Bild vom gezielt auf Menschen gerichteten göttlichen Auge; der folgende Zusatz bestimmt diese Aufmerksamkeit als Gericht.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: zum Unheil und nicht zum Guten
  rationale: רָעָה bezeichnet hier schädigendes Gericht beziehungsweise Unheil, nicht notwendig moralische Bosheit. Die Formulierung erhält zugleich den Gegensatz zu טוֹבָה.
theological_decisions:
- issue: Bedeutung von רָעָה als Ziel göttlicher Zuwendung
  choice: zum Unheil
  alternative: zum Bösen; zum Schaden
  rationale: Der Zusammenhang spricht von strafendem Gericht. „Zum Unheil“ gibt diese Bedeutung wieder, ohne Gottes Handeln als moralisch böse zu kennzeichnen; die Fußnote bewahrt die wörtlichere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eindringliche Personifikation des Schwertes und das hebräische Bild vom singularischen göttlichen Auge bleiben erhalten; ein Gedankenstrich hebt den abschließenden Gegensatz hervor.
