source:
  edition: WLC
  text: וְ/אִם יֵחָֽבְאוּ֙ בְּ/רֹ֣אשׁ הַ/כַּרְמֶ֔ל מִ/שָּׁ֥ם אֲחַפֵּ֖שׂ וּ/לְקַחְתִּ֑י/ם וְ/אִם יִסָּ֨תְר֜וּ מִ/נֶּ֤גֶד עֵינַ/י֙ בְּ/קַרְקַ֣ע הַ/יָּ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/נָּחָ֖שׁ וּ/נְשָׁכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/003.yaml
  text: And if they hide themselves on the summit of Carmel[a], from there I will search them out and take them; and if they conceal themselves from before my eyes on the floor of the sea, from there I will command the serpent[b], and it will bite them.
translation:
  language: de
  text: Und wenn sie sich auf dem Gipfel des Karmel verstecken, werde ich sie dort aufspüren und holen. Und wenn sie sich vor meinen Augen auf dem Meeresboden[a] verbergen, werde ich dort der Schlange befehlen, und sie wird sie beißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Grund des Meeres“.'
    reason: Lexikalisch und idiomatisch mögliche Wiedergabe von בְּקַרְקַע הַיָּם.
lexical_decisions:
- source_word: יֵחָבְאוּ
  choice: sich verstecken
  rationale: Das Nifal bezeichnet hier ein beabsichtigtes Sichverbergen; die reflexive deutsche Form gibt dies natürlich wieder.
- source_word: בְּרֹאשׁ הַכַּרְמֶל
  choice: auf dem Gipfel des Karmel
  rationale: רֹאשׁ bezeichnet hier den höchsten Punkt. „Gipfel“ bewahrt das räumliche Bild, ohne den Ortsnamen durch einen Zusatz zu erweitern.
- source_word: אֲחַפֵּשׂ
  choice: aufspüren
  rationale: Das Piel von חפשׂ bezeichnet ein gründliches Suchen. „Aufspüren“ vermittelt die zielgerichtete, unausweichliche Suche idiomatisch.
- source_word: וּלְקַחְתִּים
  choice: und ergreifen
  rationale: לקח bedeutet grundsätzlich „nehmen“. Im Gerichtszusammenhang bringt „ergreifen“ die gemeinte Festnahme natürlich zum Ausdruck, ohne eine konkrete Tötung oder andere Folge hinzuzufügen.
- source_word: יִסָּתְרוּ
  choice: sich verbergen
  rationale: Die Wiedergabe unterscheidet dieses Verb sprachlich vom vorherigen יֵחָבְאוּ, ohne einen nicht vorhandenen Bedeutungsunterschied zu überzeichnen.
- source_word: מִנֶּגֶד עֵינַי
  choice: vor meinen Augen
  rationale: Die konkrete anthropomorphe Redeweise des Hebräischen bleibt erhalten; zusammen mit „sich … verbergen“ drückt sie den Versuch aus, sich dem göttlichen Blick zu entziehen.
- source_word: בְּקַרְקַע הַיָּם
  choice: auf dem Boden des Meeres
  rationale: קַרְקַע bezeichnet den Boden oder Grund. Die Formulierung bewahrt das konkrete räumliche Bild des Ausgangstextes.
- source_word: אֲצַוֶּה
  choice: werde ich … befehlen
  rationale: צוה bezeichnet ein Befehlen und unterstreicht im Zusammenhang die uneingeschränkte Verfügungsgewalt des redenden Gottes.
- source_word: הַנָּחָשׁ
  choice: die Schlange
  rationale: נָחָשׁ bezeichnet eine Schlange. Das natürliche deutsche Wort vermeidet sowohl eine Abschwächung als auch eine unbelegte mythologische Festlegung.
- source_word: וּנְשָׁכָם
  choice: und sie wird sie beißen
  rationale: Das Verb נשׁך bedeutet „beißen“; das erste „sie“ nimmt die singularische Schlange auf, das zweite die Verborgenen.
theological_decisions:
- issue: Gottes alles erreichendes Gericht in anthropomorpher Sprache
  choice: Die konkrete Wendung „vor meinen Augen“ bleibt erhalten.
  alternative: „meinem Blick entzogen“ oder „außerhalb meiner Sicht“
  rationale: Der Vers erklärt jede Flucht vor Gottes suchender und richtender Gegenwart für unmöglich. Die bildhafte Redeweise wird bewahrt, ohne sie in eine abstrakte Lehrformel aufzulösen.
- issue: Fortgesetzte Gottesrede ohne ausdrückliche Nennung des Gottesnamens
  choice: Die erste Person („ich“) wird ohne ergänztes Subjekt wiedergegeben.
  alternative: Zur Verdeutlichung „der HERR“ in den Vers einfügen
  rationale: Der hebräische Vers setzt die Gottesrede des Zusammenhangs fort. Eine ausdrückliche Nennung des Gottesnamens wäre eine nicht im Vers stehende Ergänzung.
- issue: Vorstellung der Schlange
  choice: Das Tier wird schlicht als „die Schlange“ bezeichnet.
  alternative: „der Serpent“ oder eine ausdrücklich mythologische Deutung
  rationale: Der Text stellt die Schlange als dem göttlichen Befehl unterworfen dar, legt aber an dieser Stelle keine weitergehende Identität oder Symbolik ausdrücklich fest.
translation_notes:
  register: Moderne, würdige prophetische Sprache. Die parallele Satzstruktur und die räumlichen Gegensätze bleiben deutlich. „Aufspüren“ und „ergreifen“ sind verständlich und kräftig, ohne den Gerichtsvollzug über den Wortlaut hinaus auszumalen.
