source:
  edition: WLC
  text: וְ/שַׁבְתִּי֮ אֶת שְׁב֣וּת עַמִּ֣/י יִשְׂרָאֵל֒ וּ/בָנ֞וּ עָרִ֤ים נְשַׁמּוֹת֙ וְ/יָשָׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/שָׁת֖וּ אֶת יֵינָ֑/ם וְ/עָשׂ֣וּ גַנּ֔וֹת וְ/אָכְל֖וּ אֶת פְּרִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/014.yaml
  text: I will restore the fortunes of my people Israel[a], and they will rebuild ruined cities and inhabit them; they will plant vineyards and drink their wine; they will make gardens and eat their fruit.
translation:
  language: de
  text: Ich werde das Geschick meines Volkes Israel wenden[a]. Sie werden die verwüsteten Städte wieder aufbauen und darin wohnen. Sie werden Weinberge pflanzen und deren Wein trinken; sie werden Gärten anlegen und deren Früchte essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde die Gefangenen meines Volkes Israel zurückbringen“; auch möglich: „Ich werde die Gefangenschaft meines Volkes Israel wenden.“ Die hebräische Wiederherstellungsformel kann sowohl die Rückkehr aus der Gefangenschaft als auch eine umfassendere Umkehr der Not bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: Ich werde das Geschick … wenden
  rationale: Die feste hebräische Wendung bezeichnet die Umkehr einer Notlage und kann zugleich die Rückkehr aus der Gefangenschaft anklingen lassen. „Das Geschick wenden“ ist eine geläufige, würdevolle deutsche Entsprechung, ohne die Bedeutung auf materielle Verhältnisse einzuengen.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: meines Volkes Israel
  rationale: Bewahrt die Bundesbezeichnung und die appositionelle Verbindung von „mein Volk“ und „Israel“.
- source_word: וּבָנוּ עָרִים נְשַׁמּוֹת
  choice: Sie werden die verwüsteten Städte wieder aufbauen
  rationale: בנה bedeutet an sich „bauen“; bei bereits verwüsteten Städten gibt „wieder aufbauen“ den aus dem Zusammenhang klaren Wiederherstellungsaspekt natürlich wieder. נְשַׁמּוֹת wird mit „verwüstet“ präzise und idiomatisch übersetzt.
- source_word: וְיָשָׁבוּ
  choice: und darin wohnen
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise Sich-Niederlassen; „darin wohnen“ ist modernes, klares Deutsch und nimmt auf die Städte Bezug.
- source_word: וְנָטְעוּ כְרָמִים
  choice: Sie werden Weinberge pflanzen
  rationale: Direkte und im Deutschen natürliche Wiedergabe des landwirtschaftlichen Bildes.
- source_word: וְשָׁתוּ אֶת יֵינָם
  choice: und deren Wein trinken
  rationale: Das Suffix bezieht sich sinngemäß auf die Weinberge. „Deren Wein“ macht diesen Bezug im Deutschen eindeutig, ohne einen zusätzlichen Gedanken einzuführen.
- source_word: וְעָשׂוּ גַנּוֹת
  choice: sie werden Gärten anlegen
  rationale: עשה heißt wörtlich „machen“; in Verbindung mit Gärten ist „anlegen“ die natürliche deutsche Kollokation.
- source_word: וְאָכְלוּ אֶת פְּרִיהֶם
  choice: und deren Früchte essen
  rationale: Das Suffix verweist auf die Gärten; der Plural „Früchte“ entspricht hier natürlichem Deutsch und kann deren Ertrag umfassend bezeichnen.
theological_decisions:
- issue: Wiedergabe der Wiederherstellungsformel שׁוּב שְׁבוּת
  choice: das Geschick meines Volkes Israel wenden
  alternative: die Gefangenen meines Volkes Israel zurückbringen / die Gefangenschaft meines Volkes Israel wenden
  rationale: Die Formel kann sowohl die Rückkehr aus Gefangenschaft als auch eine umfassendere Umkehr der Not bezeichnen. Die folgenden Aussagen über Städte, Weinberge und Gärten stützen den breiteren Wiederherstellungssinn; die mögliche Exilbedeutung bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bewahren den feierlichen Rhythmus der Verheißung; „Geschick wenden“, „verwüstete Städte“ und „Gärten anlegen“ sind verständlich und zugleich bibelsprachlich angemessen.
