source:
  edition: WLC
  text: הַ/בּוֹנֶ֤ה בַ/שָּׁמַ֨יִם֙ מעלות/ו וַ/אֲגֻדָּת֖/וֹ עַל אֶ֣רֶץ יְסָדָ֑/הּ הַ/קֹּרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/006.yaml
  text: He who builds his upper chambers in the heavens[a], and has founded his vault upon the earth[b], who calls for the waters of the sea and pours them out upon the face of the earth—Yahweh is his name.
translation:
  language: de
  text: Er baut seine Obergemächer im Himmel[a] und hat sein Gewölbe auf der Erde gegründet[b]. Er ruft das Wasser des Meeres herbei und gießt es über die Erdoberfläche aus – Jahwe ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Aufgänge“, „seine Stufen“ oder „seine oberen Stockwerke“. Das hebräische Wort kann Höhen, Treppen beziehungsweise Aufgänge oder hoch gelegene Räume bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen Verbund“, „sein Gefüge“ oder „seine Kuppel“. Das hebräische Wort bezeichnet etwas Zusammengebundenes; hier gehört es zur kosmischen Bau-Bildsprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנֶה
  choice: Er baut
  rationale: Das substantivierte Qal-Partizip beschreibt Jahwe durch sein kennzeichnendes Handeln. Die finite deutsche Form gibt dies natürlich und prägnant wieder.
- source_word: מַעֲלוֹתָיו
  choice: seine Obergemächer
  rationale: Das Wort kann Aufgänge, Stufen oder hoch gelegene Räume bezeichnen. Im kosmisch-architektonischen Zusammenhang sind „Obergemächer“ eine naheliegende, bildhafte Wiedergabe, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: וַאֲגֻדָּתוֹ
  choice: sein Gewölbe
  rationale: Das Substantiv bezeichnet grundsätzlich etwas Zusammengebundenes beziehungsweise einen Verbund. Hier legt der kosmische Bauzusammenhang eine tragende oder überwölbende Struktur nahe; „Gewölbe“ ist verständlich, bleibt aber als kontextuelle Deutung gekennzeichnet.
- source_word: יְסָדָהּ
  choice: hat ... gegründet
  rationale: Das Verb יסד bezeichnet das Gründen oder feste Errichten. Das Perfekt stellt die vollendete Schöpfungstat neben das fortdauernd kennzeichnende Bauen.
- source_word: הַקֹּרֵא לְמֵי הַיָּם
  choice: Er ruft das Wasser des Meeres herbei
  rationale: קרא mit לְ stellt das Wasser als von Gott herbeigerufen beziehungsweise aufgeboten dar. „Herbeirufen“ vermittelt seine souveräne Verfügung über das Meer natürlich.
- source_word: וַיִּשְׁפְּכֵם
  choice: und gießt es ... aus
  rationale: שפך bedeutet „ausgießen“. Das singularische deutsche Sammelwort „Wasser“ verlangt das Pronomen „es“, während der hebräische Plural auf die Wasser Bezug nimmt.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: über die Erdoberfläche
  rationale: Die hebräische Wendung bedeutet wörtlich „über/auf das Angesicht der Erde“. „Über die Erdoberfläche“ bewahrt das räumliche Bild in natürlichem modernem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die nominale Schlussklausel bildet den feierlichen Höhepunkt und wird in ihrer knappen Aussageform bewahrt.
theological_decisions:
- issue: Kosmologische Bildsprache in מַעֲלוֹתָיו und אֲגֻדָּתוֹ
  choice: Architektonische Wiedergabe als „Obergemächer“ und „Gewölbe“
  alternative: Wörtlicher „Aufgänge/Stufen“ und „Verbund/Bund“
  rationale: Der Vers preist Gott als Schöpfer und Herrscher mit kosmischer Bau-Bildsprache. Die Übersetzung macht das Bild verständlich, ohne daraus eine moderne naturwissenschaftliche Aussage zu formen; die tatsächliche lexikalische Unsicherheit bleibt in den Fußnoten sichtbar.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR; JHWH; Jehova
  rationale: Im Ausgangstext steht der persönliche Gottesname. Die Form „Jahwe“ bewahrt den Eigenname-Charakter und entspricht üblichem modernem Deutsch.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-poetischem Klang. Die knappe Abfolge göttlicher Taten und die abschließende Namensformel bleiben erhalten. „Obergemächer“ ist bewusst leicht gehoben und wird durch die Fußnote erläutert.
