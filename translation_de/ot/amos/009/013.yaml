id: AMO.9.13
reference: Amos 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/נִגַּ֤שׁ חוֹרֵשׁ֙ בַּ/קֹּצֵ֔ר וְ/דֹרֵ֥ךְ עֲנָבִ֖ים בְּ/מֹשֵׁ֣ךְ הַ/זָּ֑רַע וְ/הִטִּ֤יפוּ הֶֽ/הָרִים֙ עָסִ֔יס וְ/כָל הַ/גְּבָע֖וֹת תִּתְמוֹגַֽגְנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/013.yaml
  text: Behold[a], days are coming, declares Yahweh, when the plowman will overtake the reaper, and the one who treads grapes the one who sows the seed; the mountains will drip sweet wine[c][b], and all the hills will melt.
translation:
  language: de
  text: Siehe, Tage kommen – Ausspruch Jahwes –, da wird der Pflüger den Schnitter einholen und der Keltertreter den, der den Samen aussät[a]. Die Berge werden von Most[b] triefen, und alle Hügel werden zerfließen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »den, der den Samen zieht«. Gemeint ist wahrscheinlich das Aussäen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »junger Wein« beziehungsweise »süßer Wein«.'
    reason: lexical_alternative
  - marker: c
    text: Das Bild beschreibt eine solche Fülle, dass die Arbeit einer Erntezeit noch andauert, wenn die Arbeit der nächsten schon beginnt; selbst Berge und Hügel erscheinen von Wein überströmend.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt den prophetischen Aufmerksamkeitsruf in einer würdigen, im biblischen Sprachgebrauch weiterhin verständlichen Form.
- source_word: יָמִים בָּאִים
  choice: Tage kommen
  rationale: Gibt die anarthrische prophetische Zukunftsformel knapp und quellennah wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den feierlichen, substantivischen Charakter der prophetischen Formel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: וְנִגַּשׁ
  choice: wird … einholen
  rationale: Im Bild überreicher Ernten rückt die folgende Feldarbeit so nahe an die vorherige heran, dass sie sie einholt.
- source_word: חוֹרֵשׁ / קֹצֵר
  choice: Pflüger / Schnitter
  rationale: Konkrete und prägnante deutsche Bezeichnungen für die beiden landwirtschaftlichen Tätigkeiten.
- source_word: דֹרֵךְ עֲנָבִים
  choice: Keltertreter
  rationale: Gibt das Treten der Trauben anschaulich und idiomatisch wieder.
- source_word: מֹשֵׁךְ הַזָּרַע
  choice: der den Samen aussät
  rationale: Die wörtliche Vorstellung des Ziehens beziehungsweise Ausstreuens des Saatguts bezeichnet im Zusammenhang den Säenden; die Fußnote wahrt die auffällige hebräische Formulierung.
- source_word: עָסִיס
  choice: Most
  rationale: Bezeichnet frisch gepressten beziehungsweise jungen, süßen Wein und passt natürlich zum Bild der überreichen Weinernte.
- source_word: תִּתְמוֹגַגְנָה
  choice: werden zerfließen
  rationale: Bewahrt das starke poetische Bild des Schmelzens oder Sich-Auflösens und verbindet es im Deutschen plausibel mit überströmender Fülle.
theological_decisions:
- issue: Prophetische Wiederherstellungsbilder
  choice: Die konkrete Sprache überreicher landwirtschaftlicher Fruchtbarkeit bleibt als poetisches Zukunftsbild stehen.
  alternative: Das Bild ausschließlich als wörtliche Agrarprognose oder ausschließlich als geistlichen Segen auszudeuten.
  rationale: Der hebräische Text legt die genaue Art und Reichweite der Erfüllung nicht fest; die Übersetzung soll diese Auslegungsfrage offenlassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst prophetischem Ton. »Siehe« und »Ausspruch Jahwes« tragen die feierliche Redeform; ansonsten bleibt die Syntax klar und unmittelbar. Die ungewöhnlichen Bilder werden nicht geglättet oder konfessionell gedeutet.
