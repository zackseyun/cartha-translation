source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא אָקִ֛ים אֶת סֻכַּ֥ת דָּוִ֖יד הַ/נֹּפֶ֑לֶת וְ/גָדַרְתִּ֣י אֶת פִּרְצֵי/הֶ֗ן וַ/הֲרִֽסֹתָי/ו֙ אָקִ֔ים וּ/בְנִיתִ֖י/הָ כִּ/ימֵ֥י עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/011.yaml
  text: In that day I will raise up the fallen shelter of David[a], and I will wall up its breaches[c][b], and I will raise up its ruins and rebuild it as in the days of old.
translation:
  language: de
  text: An jenem Tag werde ich die eingestürzte Hütte Davids[a] wieder aufrichten. Ich werde ihre Breschen vermauern[b], was von ihr in Trümmern liegt, wieder aufrichten und sie wieder aufbauen wie in den Tagen der Vorzeit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die verfallene Laubhütte Davids“; traditionell auch „die Hütte Davids“. Das hebräische Wort bezeichnet eine einfache, vorläufige Schutz- oder Laubhütte und kann hier bildhaft für das zusammengebrochene davidische Königshaus stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Lücken schließen“ beziehungsweise „ihre Risse ausbessern“.'
    reason: lexical_alternative
  - marker: c
    text: „In den Tagen der Vorzeit“ meint frühere, längst vergangene Zeiten, nicht notwendigerweise Ewigkeit im abstrakten Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Bewahrt die geläufige prophetische Zeitformel, ohne ihren Zeitpunkt näher festzulegen.
- source_word: אָקִים
  choice: werde ich … wieder aufrichten
  rationale: Das Hifil von קום bezeichnet das Aufrichten oder Aufstellen. „Wieder“ ergibt sich natürlich aus dem Zusammenhang des Einsturzes und der Wiederherstellung und bewahrt zugleich das konkrete Bau-Bild.
- source_word: סֻכַּת דָּוִיד
  choice: die Hütte Davids
  rationale: סֻכָּה bezeichnet eine einfache, vorläufige Hütte oder Schutzlaube. „Hütte“ hält das Bild eines fragilen Bauwerks fest und ersetzt es nicht deutend durch „Haus“ oder „Dynastie“.
- source_word: הַנֹּפֶלֶת
  choice: eingestürzte
  rationale: Das Partizip bedeutet wörtlich „fallend“. Im Zusammenhang der anschließenden Wiederherstellung beschreibt es idiomatisch den eingestürzten Zustand; „eingestürzt“ erhält das konkrete Gebäudebild.
- source_word: וְגָדַרְתִּי אֶת פִּרְצֵיהֶן
  choice: Ich werde ihre Breschen zumauern
  rationale: גדר bedeutet ummauern, einzäunen oder verschließen. Mit פֶּרֶץ, einer Bresche oder Lücke, gibt „zumauern“ die konkrete Reparaturarbeit prägnant wieder.
- source_word: וַהֲרִסֹתָיו
  choice: ihre Trümmer
  rationale: Das Wort bezeichnet zerstörte oder niedergerissene Teile. „Trümmer“ ist im Deutschen anschaulich und passt zur Wiedererrichtung des Bauwerks.
- source_word: וּבְנִיתִיהָ
  choice: und sie wieder aufbauen
  rationale: Das Grundverb bedeutet „bauen“; nach Einsturz und Zerstörung ist „wieder aufbauen“ im Deutschen die natürliche kontextuelle Wiedergabe. Das feminine Pronomen bezieht sich auf die Hütte.
- source_word: כִּימֵי עוֹלָם
  choice: wie in den Tagen der Vorzeit
  rationale: עוֹלָם bezeichnet hier weit zurückliegende Zeit beziehungsweise Altertum, nicht zwingend abstrakte Ewigkeit. „Vorzeit“ wahrt den rückblickenden Vergleich in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Bezug der „Hütte Davids“
  choice: Das konkrete Bild der eingestürzten Hütte bleibt im Haupttext stehen und kann metaphorisch auf das erniedrigte davidische Königtum beziehungsweise die Dynastie weisen.
  alternative: Eine buchstäbliche davidische Kultstätte oder eine ausdrückliche Paraphrase als „Dynastie Davids“.
  rationale: Der hebräische Text verbindet den Namen David mit einem auffällig fragilen Bauwerk. Eine Ersetzung durch „Königshaus“, „Reich“ oder eine ausdrücklich messianische Formulierung würde die Metapher und ihre theologische Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Die Wiederholung von „wieder aufrichten“ bildet die Wiederholung von אָקִים ab; die Hütte wird nicht im Haupttext zu „Dynastie“ oder „Königshaus“ entmetaphorisiert.
