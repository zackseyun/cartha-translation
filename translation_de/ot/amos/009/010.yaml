source:
  edition: WLC
  text: בַּ/חֶ֣רֶב יָמ֔וּתוּ כֹּ֖ל חַטָּאֵ֣י עַמִּ֑/י הָ/אֹמְרִ֗ים לֹֽא תַגִּ֧ישׁ וְ/תַקְדִּ֛ים בַּעֲדֵ֖י/נוּ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/010.yaml
  text: By the sword all the sinners of my people will die—those who say, ‘The disaster will not overtake us or come against us.’
translation:
  language: de
  text: 'Durch das Schwert werden alle Sünder meines Volkes sterben – sie, die sagen: »Das Unheil wird uns weder einholen noch gegen uns herankommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: Durch das Schwert
  rationale: Gibt das instrumentale בְּ klar und die konkrete Todesart wörtlich wieder.
- source_word: כֹּל חַטָּאֵי עַמִּי
  choice: alle Sünder meines Volkes
  rationale: Bewahrt die Zugehörigkeit zum Volk und die umfassende Aussage des hebräischen Textes.
- source_word: תַגִּישׁ
  choice: erreichen
  rationale: Das Verb נגש bezeichnet hier das Herannahen beziehungsweise Herankommen des Unheils; »erreichen« ist im Deutschen natürlich und wahrt das Bild.
- source_word: תַקְדִּים בַּעֲדֵינוּ
  choice: uns zuvorkommen
  rationale: קדמ bedeutet grundsätzlich »zuvorkommen/entgegentreten«. Die ungewöhnliche Verbindung mit בַּעֲדֵינוּ wird bewusst nicht zu einer bloßen Wiederholung von »erreichen« eingeebnet.
- source_word: הָרָעָה
  choice: das Unheil
  rationale: Im prophetischen Gerichtskontext bezeichnet רָעָה eine hereinbrechende Katastrophe beziehungsweise ein Unheil, nicht moralische Bosheit.
theological_decisions:
- issue: Umfang des angekündigten Gerichts
  choice: »alle Sünder meines Volkes« ohne Einschränkung
  alternative: eine Abschwächung wie »die Schuldigen unter meinem Volk«
  rationale: Die Formulierung bewahrt sowohl Gottes Anspruch auf das Volk als auch die scharfe Gerichtsaussage über dessen Sünder.
- issue: Selbstsicherheit der Sprecher
  choice: Zwei Verben werden als »erreichen« und »zuvorkommen« wiedergegeben
  alternative: Zusammenfassend »uns nicht treffen«
  rationale: Die doppelte Verneinung und die zwei unterschiedlichen hebräischen Verben zeigen die vermessene Gewissheit, dem angekündigten Unheil entgehen zu können.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bindet den Relativsatz klar an »alle Sünder meines Volkes«; die direkte Rede bleibt knapp und eindringlich.
