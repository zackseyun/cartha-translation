revisions:
- from: Und der Herr, JHWH der Heerscharen, berührt die Erde, sodass sie zerschmilzt; alle, die auf ihr wohnen, trauern. Sie steigt als Ganzes empor wie der Nil und sinkt wieder wie der Nil Ägyptens.
  to: Und der Herr, Jahwe der Heerscharen, berührt die Erde, und sie zerschmilzt; und alle, die auf ihr wohnen, trauern. Die ganze Erde steigt empor wie der Nil und sinkt wie der Nil Ägyptens.
  rationale: Die Namensform wird zu natürlichem modernen Deutsch vereinheitlicht. Die hebräische parataktische Verknüpfung bleibt erhalten, ohne die Wirkung als bloß logische Folgerung auszuformulieren oder mit „wieder“ einen Zusatz einzutragen. „Die ganze Erde“ gibt כֻּלָּהּ klar und idiomatisch wieder.
