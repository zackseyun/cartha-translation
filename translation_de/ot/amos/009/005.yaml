id: AMO.9.5
reference: Amos 9:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אדֹנָ֨/י יְהוִ֜ה הַ/צְּבָא֗וֹת הַ/נּוֹגֵ֤עַ בָּ/אָ֨רֶץ֙ וַ/תָּמ֔וֹג וְ/אָבְל֖וּ כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/עָלְתָ֤ה כַ/יְאֹר֙ כֻּלָּ֔/הּ וְ/שָׁקְעָ֖ה כִּ/יאֹ֥ר מִצְרָֽיִם־
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/005.yaml
  text: And the Lord GOD of hosts is the one who touches the earth[a], and it melts, and all who dwell in it mourn; and all of it rises like the Nile and sinks like the Nile of Egypt.
translation:
  language: de
  text: Und der Herr, Jahwe der Heerscharen, berührt die Erde, und sie zerschmilzt; und alle, die auf ihr wohnen, trauern. Die ganze Erde steigt empor wie der Nil und sinkt wie der Nil Ägyptens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה
  choice: der Herr, JHWH
  rationale: 'Die Verbindung aus אֲדֹנָי und dem Gottesnamen wird unterscheidbar wiedergegeben: אֲדֹנָי als „der Herr“, das Tetragramm als „JHWH“. So bleibt der Eigenname sichtbar, ohne eine unsichere Vokalisierung festzulegen.'
- source_word: הַצְּבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionsreiche deutsche Wiedergabe bewahrt die mögliche Breite himmlischer und irdischer Streitkräfte und vermeidet eine unnötige Eingrenzung.
- source_word: הַנּוֹגֵעַ בָּאָרֶץ
  choice: berührt die Erde
  rationale: Das Partizip beschreibt Gott charakteristisch als den, der die Erde berührt. „Berührt“ gibt נגע schlicht wieder; die verheerende Wirkung folgt erst im nächsten Verb.
- source_word: וַתָּמוֹג
  choice: sodass sie zerschmilzt
  rationale: מוג bezeichnet ein Schmelzen, Auflösen oder Zusammenbrechen. „Zerschmilzt“ erhält das kräftige theophanische Bild; „sodass“ macht im Deutschen die Wirkung des göttlichen Berührens natürlich verständlich.
- source_word: וְאָבְלוּ כָּל יֹשְׁבֵי בָהּ
  choice: alle, die auf ihr wohnen, trauern
  rationale: Die substantivierte Partizipialform wird verbal und allgemeinverständlich wiedergegeben; אבל bezeichnet Trauer angesichts des Unheils.
- source_word: וְעָלְתָה כַיְאֹר כֻּלָּהּ
  choice: Sie steigt als Ganzes empor wie der Nil
  rationale: Das feminine Pronomen bezieht sich auf die Erde. כֻּלָּהּ wird mit „als Ganzes“ ausdrücklich bewahrt, und יְאֹר bezeichnet hier den Nil mit seinem Anschwellen.
- source_word: וְשָׁקְעָה כִּיאֹר מִצְרָיִם
  choice: und sinkt wieder wie der Nil Ägyptens
  rationale: שקע kann „sinken“ oder „sich senken“ bedeuten. „Wieder“ verdeutlicht die Gegenbewegung nach dem Emporsteigen, ohne das Bild in das speziellere „abschwillt“ aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יהוה
  choice: der Herr, JHWH
  alternative: Gott, der HERR; der Herr Jahwe
  rationale: Die Wiedergabe unterscheidet Titel und Eigenname und vermeidet sowohl die missverständliche Doppelung „Herr HERR“ als auch die Festlegung auf die rekonstruierte Aussprache „Jahwe“. Sie bewahrt zugleich die Spannung des hebräischen Doppeltitels.
- issue: Reichweite von אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: Der Zusammenhang mit allen Bewohnern und dem umfassenden theophanischen Bild spricht für die kosmische Bedeutung „Erde“, obwohl „Land“ lexikalisch möglich bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildkraft. Der parataktische Rhythmus des Hebräischen bleibt weitgehend erhalten; der resultative Zusammenhang zwischen Berühren und Zerschmelzen wird idiomatisch mit „sodass“ ausgedrückt.
