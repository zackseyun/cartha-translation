    issue: „JHWH“ als Textform des Gottesnamens
    rationale: Die reine Konsonantenschreibung ist in einem modernen deutschen Lesetext unnötig technisch und weniger natürlich. „Jahwe“ ist die etablierte deutsche Wiedergabe und entspricht der im Audit vermerkten Entscheidung, den Gottesnamen sichtbar wiederzugeben.
  - severity: low
    issue: Explizite Kausalität und „wieder“
    rationale: Das Hebräische reiht die Handlungen mit וְ aneinander. „sodass“ macht daraus eine explizite Folgerung, und „wieder“ ergänzt die Vorstellung eines Rückgangs. Beides ist naheliegend, aber für optimale Äquivalenz nicht erforderlich.
