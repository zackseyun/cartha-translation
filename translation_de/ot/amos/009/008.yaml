  terminology: „Jahwe“ gibt יהוה konsistent wieder; „Herr“ entspricht אֲדֹנָי. „Haus Jakob“ bewahrt die traditionelle, im Kontext nationale-korporative Bezeichnung, ohne sie interpretierend einzuengen. „Vertilgen“ und „vernichten“ unterscheiden die beiden hebräischen Verbformen nicht künstlich, geben aber die Schärfe des Gerichtsworts angemessen wieder.
