source:
  edition: WLC
  text: הִנֵּ֞ה עֵינֵ֣י אֲדֹנָ֣/י יְהוִ֗ה בַּ/מַּמְלָכָה֙ הַֽ/חַטָּאָ֔ה וְ/הִשְׁמַדְתִּ֣י אֹתָ֔/הּ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה אֶ֗פֶס כִּ֠י לֹ֣א הַשְׁמֵ֥יד אַשְׁמִ֛יד אֶת בֵּ֥ית יַעֲקֹ֖ב נְאֻם יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/008.yaml
  text: Look[a], the eyes of the Lord GOD are on the sinful kingdom, and I will destroy it from the face of the earth. Yet I will not utterly destroy the house of Jacob," declares Yahweh.
translation:
  language: de
  text: Siehe, die Augen des Herrn Jahwe sind auf das sündige Königreich gerichtet. Ich werde es vom Erdboden vertilgen. Doch das Haus Jakob werde ich nicht vollständig vernichten[a] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Doch das Haus Jakob werde ich gewiss nicht vernichten.“ Das Hebräische verstärkt das Verb durch die Verbindung eines Infinitivus absolutus mit der finiten Verbform; im verneinten Satz kann die Verstärkung als Verneinung vollständiger Vernichtung oder als nachdrückliche Verneinung verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die deiktische Partikel leitet feierlich eine Gerichtsankündigung ein. „Siehe“ bewahrt ihren aufmerksamkeitslenkenden Charakter und entspricht dem würdevollen prophetischen Register.
- source_word: עֵינֵי אֲדֹנָי יְהוִה
  choice: die Augen des Herrn Jahwe
  rationale: Der konkrete hebräische Ausdruck „die Augen“ bleibt erhalten und bezeichnet hier Jahwes gezielt auf das Gericht gerichtete Aufmerksamkeit. אֲדֹנָי wird mit „Herr“, der Gottesname יהוה mit „Jahwe“ wiedergegeben.
- source_word: בַּמַּמְלָכָה הַחַטָּאָה
  choice: auf das sündige Königreich gerichtet
  rationale: Die Präposition bezeichnet zusammen mit „Augen“ die Ausrichtung des göttlichen Blicks; „gerichtet“ macht das deutsche Idiom vollständig, ohne die im Kontext erkennbare Gerichtsabsicht schon mit „gegen“ festzulegen.
- source_word: וְהִשְׁמַדְתִּי אֹתָהּ
  choice: Ich werde es … vertilgen
  rationale: Der Hifil von שׁמד bezeichnet eine umfassende Beseitigung oder Vernichtung. „Vertilgen“ gibt die Härte der Gerichtsankündigung in würdigem, verständlichem Deutsch wieder.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: vom Erdboden
  rationale: Die geläufige deutsche Wendung gibt das hebräische Bild von der Oberfläche des Bodens knapp und natürlich wieder.
- source_word: אֶפֶס כִּי
  choice: Doch
  rationale: Die Verbindung leitet eine starke Einschränkung der vorausgehenden Vernichtungsankündigung ein.
- source_word: לֹא הַשְׁמֵיד אַשְׁמִיד
  choice: werde ich nicht vollständig vernichten
  rationale: Die Verbindung von Infinitivus absolutus und finiter Verbform verstärkt den Verbalgedanken. Im negierten Satz gibt „nicht vollständig vernichten“ die Verneinung einer totalen Auslöschung wieder; die mögliche alternative Zuordnung der Verstärkung wird in der Fußnote genannt.
- source_word: אֶת בֵּית יַעֲקֹב
  choice: das Haus Jakob
  rationale: Die traditionelle nationale und bundesgeschichtliche Bezeichnung für die Nachkommen Jakobs bleibt wegen ihrer intertextuellen Bedeutung erhalten.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und würdevoll wiedergegeben; zugleich bleibt der Charakter eines göttlichen Orakels erkennbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יְהוִה und in der Schlussformel
  choice: „Herr Jahwe“ und „Jahwe“
  alternative: „GOTT, der Herr“ beziehungsweise „der HERR“
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und macht den im Hebräischen ausdrücklich verwendeten Gottesnamen sichtbar, ohne beide Elemente zu „Herr HERR“ zusammenfallen zu lassen.
- issue: Verhältnis zwischen dem Gericht am sündigen Königreich und der Bewahrung des Hauses Jakob
  choice: Das Königreich wird vertilgt, das Haus Jakob jedoch nicht vollständig vernichtet.
  alternative: Die zweite Aussage lediglich als allgemein abgeschwächtes Gericht wiederzugeben.
  rationale: Der hebräische Text stellt die umfassende Gerichtsankündigung und die ausdrückliche Verneinung einer vollständigen Vernichtung nebeneinander. Die Übersetzung bewahrt diese Spannung, ohne sie systematisch aufzulösen.
translation_notes:
  register: Modernes, würdiges prophetisches Deutsch. „Siehe“ und „Ausspruch Jahwes“ markieren das feierliche Register; die übrige Syntax bleibt klar und für heutige Leser gut verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der von der sprachlichen Mehrdeutigkeit betroffenen Wendung.
