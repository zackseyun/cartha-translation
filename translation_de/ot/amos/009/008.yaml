  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des hebräischen Textes zuverlässig wieder: die aufmerksamkeitslenkende Eröffnung, die auf das sündige Königreich gerichteten Augen, dessen Entfernung „vom Erdboden“, die starke Einschränkung durch אֶפֶס כִּי sowie die ausdrückliche Verneinung einer vollständigen Vernichtung des Hauses Jakob. Die Wiedergabe der emphatischen Infinitivus-abs.-Konstruktion als „nicht vollständig vernichten“ ist sachgerecht; die Fußnote wahrt die mögliche Deutung der Negation mit Nachdruck.'
