source:
  edition: WLC
  text: רָאִ֨יתִי אֶת אֲדֹנָ֜/י נִצָּ֣ב עַֽל הַ/מִּזְבֵּ֗חַ וַ/יֹּאמֶר֩ הַ֨ךְ הַ/כַּפְתּ֜וֹר וְ/יִרְעֲשׁ֣וּ הַ/סִּפִּ֗ים וּ/בְצַ֨עַ/ם֙ בְּ/רֹ֣אשׁ כֻּלָּ֔/ם וְ/אַחֲרִיתָ֖/ם בַּ/חֶ֣רֶב אֶהֱרֹ֑ג לֹֽא יָנ֤וּס לָ/הֶם֙ נָ֔ס וְ/לֹֽא יִמָּלֵ֥ט לָ/הֶ֖ם פָּלִֽיט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/001.yaml
  text: 'I saw the Lord standing beside the altar[a], and he said: Strike the capital, so that the thresholds may shake; shatter them on the heads of all of them. And I will kill their survivors with the sword; not one who flees among them will get away[d][c][b], and not one who escapes among them will be delivered.'
translation:
  language: de
  text: 'Ich sah den Herrn auf dem Altar stehen[a]. Er sagte: »Schlag das Kapitell[b], sodass die Schwellen beben! Zerschmettere sie auf den Köpfen von ihnen allen[c]! Ihre Überlebenden[d] werde ich mit dem Schwert töten. Kein Flüchtender unter ihnen wird entkommen, und kein Entkommener unter ihnen wird sich retten können.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „am“ oder „beim Altar stehen“. Die hebräische Präposition bedeutet gewöhnlich „auf“, kann in diesem Zusammenhang aber auch eine Stellung am Altar bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Säulenknauf“ oder „oberer Abschluss“. Das hebräische Wort bezeichnet hier wahrscheinlich ein Bauteil am oberen Ende des Heiligtums.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Wortlaut ist schwierig: „Zerbrich sie auf dem Kopf von ihnen allen.“ Wahrscheinlich ist gemeint, dass die zerbrochenen Bauteile auf alle Anwesenden herabfallen.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich auch: „ihren Rest“. Im Zusammenhang sind die nach der ersten Zerstörung noch Lebenden gemeint, nicht ein Rest mit positiver Zukunftshoffnung.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Gibt den göttlichen Hoheitstitel wieder; hier steht nicht das Tetragramm, daher nicht die dafür vorbehaltene Wiedergabe.
- source_word: נִצָּב עַל־הַמִּזְבֵּחַ
  choice: am Altar stehen
  rationale: Das Partizip bezeichnet festes Stehen oder Stellungnehmen. „Am Altar“ gibt die räumliche Nähe natürlich wieder, ohne die mögliche Bedeutung „auf dem Altar“ auszuschließen; diese wird in der Fußnote genannt.
- source_word: הַךְ
  choice: Schlag
  rationale: Der Imperativ verlangt eine kräftige, unmittelbare Handlung; „schlagen“ ist modern und vermeidet altertümliches „zerschlagen/schmettern“ an dieser Stelle.
- source_word: הַכַּפְתּוֹר
  choice: das Kapitell
  rationale: Bezeichnet hier wahrscheinlich das obere architektonische Abschlusselement. „Kapitell“ ist im Deutschen die präziseste übliche Architekturbezeichnung.
- source_word: הַסִּפִּים
  choice: die Schwellen
  rationale: Der Ausdruck kann Schwellen, Sockel oder Türpfosten bezeichnen. „Schwellen“ wahrt die konkrete Bauwerksmetaphorik und entspricht der wahrscheinlichsten Grundbedeutung.
- source_word: וְיִרְעֲשׁוּ
  choice: sodass die Schwellen beben
  rationale: Der Satzanschluss nach dem Imperativ wird als beabsichtigte beziehungsweise eintretende Folge wiedergegeben.
- source_word: וּבְצַעַם
  choice: Zerschmettere sie
  rationale: Die schwierige Verbform bezeichnet im Kontext wohl das Abbrechen oder Zerschlagen der Bauteile; „zerschmettern“ vermittelt den anschließenden tödlichen Einsturz.
- source_word: בְּרֹאשׁ כֻּלָּם
  choice: über den Köpfen von ihnen allen
  rationale: Bewahrt das konkrete Bild, dass die zerstörten Bauteile auf die versammelten Menschen herabstürzen.
- source_word: וְאַחֲרִיתָם
  choice: ihre Überlebenden
  rationale: Im Gerichtskontext sind die nach dem Einsturz noch Übriggebliebenen gemeint, nicht ein hoffnungsvoller „Rest“.
- source_word: בַּחֶרֶב אֶהֱרֹג
  choice: werde ich mit dem Schwert töten
  rationale: Direkte und gegenwärtig verständliche Wiedergabe der göttlichen Gerichtsankündigung.
- source_word: לֹא יָנוּס לָהֶם נָס
  choice: Kein Flüchtender unter ihnen wird entkommen
  rationale: Gibt die emphatische Verneinung der Flucht idiomatisch wieder, auch wenn das hebräische Wortspiel mit verwandten Wörtern nicht vollständig nachgebildet werden kann.
- source_word: וְלֹא יִמָּלֵט לָהֶם פָּלִיט
  choice: kein Entkommener unter ihnen wird gerettet werden
  rationale: 'Bewahrt die parallele Aussage und ihre Spannung: Selbst wer zunächst entkommt, findet letztlich keine Rettung.'
theological_decisions:
- issue: Göttlicher Titel in der prophetischen Vision
  choice: der Herr
  alternative: der Gebieter
  rationale: אֲדֹנָי bezeichnet Gott als souveränen Herrn und Richter. „Der Herr“ ist die natürliche deutsche Wiedergabe des Titels, ohne ihn mit dem Gottesnamen JHWH gleichzusetzen.
- issue: Umfang und Endgültigkeit des Gerichts
  choice: Kein Flüchtender entkommt; kein Entkommener wird gerettet
  alternative: Die beiden parallelen Sätze zu einer allgemeinen Aussage über ausbleibende Flucht zusammenziehen
  rationale: Die zweifache hebräische Verneinung wird bewahrt, damit die rhetorische Steigerung und die Spannung zwischen anfänglichem Entkommen und endgültiger Rettung nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Bildsprache. Die Befehle bleiben scharf und knapp; altertümliche Wörter wie „erschlagen“ oder „entrinnen“ werden vermieden. Die schwierige Architekturterminologie und die Mehrdeutigkeit der Ortsangabe werden nicht stillschweigend harmonisiert, sondern in Fußnoten ausgewiesen.
