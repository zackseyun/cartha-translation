base_translation:
  language: en
  yaml_path: translation/ot/amos/006/006.yaml
  text: who drink wine from bowls and anoint themselves with the finest oils[b][a], but are not grieved over the ruin of Joseph—
translation:
  language: de
  text: die Wein aus Schalen trinken und sich mit den erlesensten Ölen[a] salben, doch über den Zusammenbruch Josefs[b] nicht betrübt[c] sind—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den besten Ölen“; wörtlich: „mit dem Ersten der Öle“.'
    reason: lexical_alternative
  - marker: b
    text: „Josef“ bezeichnet hier poetisch das Volk Israel, besonders das Nordreich.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort kann auch bedeuten, krank oder schwach zu werden; gemeint ist hier wohl schmerzliche Anteilnahme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁתִים
  choice: die … trinken
  rationale: Der mit Artikel versehene Partizipialausdruck setzt die Beschreibung aus dem vorigen Vers fort. Die Relativkonstruktion bewahrt diesen syntaktischen Anschluss.
- source_word: בְּמִזְרְקֵי יַיִן
  choice: Wein aus Schalen
  rationale: מִזְרָק bezeichnet eine Schale oder ein Becken, häufig auch in kultischen Zusammenhängen. „Aus Schalen“ erhält das Bild eines üppigen Trinkens aus ungewöhnlich großen Gefäßen, ohne eine kultische Verwendung festzulegen.
- source_word: וְרֵאשִׁית שְׁמָנִים
  choice: mit den erlesensten Ölen
  rationale: רֵאשִׁית bedeutet wörtlich „Anfang/Erstes“ und bezeichnet hier wohl den vorzüglichsten Anteil. „Erlesenste Öle“ gibt den Luxus idiomatisch wieder; die wörtlichere Ausdrucksweise wird in der Fußnote genannt.
- source_word: יִמְשָׁחוּ
  choice: sich … salben
  rationale: משׁח bedeutet „salben“. Hier geht es um die verschwenderische Körperpflege mit Öl, nicht notwendig um eine rituelle Salbung; das reflexive „sich salben“ macht den Gebrauch im Deutschen deutlich.
- source_word: וְלֹא נֶחְלוּ
  choice: doch … nicht betrübt sind
  rationale: Das Nifal von חלה kann „krank/schwach werden“ bedeuten und hier übertragen tiefe schmerzliche Anteilnahme ausdrücken. „Nicht betrübt sind“ gibt die moralisch-emotionale Aussage natürlich wieder, während die körperliche Bildkomponente in einer Fußnote erhalten bleibt.
- source_word: עַל שֵׁבֶר יוֹסֵף
  choice: über den Zusammenbruch Josefs
  rationale: שֵׁבֶר bezeichnet einen Bruch und übertragen eine Katastrophe oder einen Zusammenbruch. „Zusammenbruch“ bewahrt sowohl das Bild des Zerbrechens als auch den politischen und gesellschaftlichen Untergang.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Der Eigenname bleibt als poetische Bezeichnung erhalten, statt ihn deutend durch „Israel“ zu ersetzen. Eine Fußnote erläutert den Bezug.
theological_decisions:
- issue: Metonymischer Gebrauch von „Josef“
  choice: „Josef“ bleibt im Haupttext als poetische Bezeichnung für das Volk Israel, besonders das Nordreich, stehen.
  alternative: Deutend mit „Israel“ oder „Haus Josef“ übersetzen.
  rationale: Die Beibehaltung des Namens wahrt die prophetische Bildsprache sowie die stammes- und bundesgeschichtlichen Bezüge, ohne die Metonymie im Haupttext aufzulösen.
- issue: Bedeutung von נֶחְלוּ
  choice: Die übertragene Bedeutung „betrübt sein“ steht im Haupttext.
  alternative: Wörtlicher „krank werden“ oder „vor Schmerz schwach werden“.
  rationale: Im Zusammenhang tadelt der Prophet die fehlende Anteilnahme am Unglück des Volkes. Da das Verb zugleich körperliches Krank- oder Schwachwerden bezeichnen kann, wird diese Spannung in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortlaufende Relativkonstruktion schließt an den vorherigen Kontext an. „Schalen“, „salben“ und „Zusammenbruch Josefs“ erhalten die konkrete prophetische Bildsprache; Fußnoten erläutern lexikalische Mehrdeutigkeiten, ohne sie im Haupttext vorschnell aufzulösen.
