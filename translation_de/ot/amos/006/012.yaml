  naturalness: Modernes, klares und würdiges Standarddeutsch. Die knappen Fragen („Rennen Pferde …? Pflügt man …?“) wirken idiomatisch und bewahren die prophetische Zuspitzung. Die Satzverbindung mit „Doch“ ist im Deutschen natürlich.
