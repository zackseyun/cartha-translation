id: AMO.6.12
reference: Amos 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/יְרֻצ֤וּ/ן בַּ/סֶּ֨לַע֙ סוּסִ֔ים אִֽם יַחֲר֖וֹשׁ בַּ/בְּקָרִ֑ים כִּֽי הֲפַכְתֶּ֤ם לְ/רֹאשׁ֙ מִשְׁפָּ֔ט וּ/פְרִ֥י צְדָקָ֖ה לְ/לַעֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/012.yaml
  text: Do horses run on rock? Does one plow there with oxen? Yet you have turned justice into poison[c][b][a], and the fruit of righteousness into wormwood.
translation:
  language: de
  text: Rennen Pferde über Felsen? Pflügt man dort mit Ochsen? Doch ihr habt das Recht in Gift[a] verwandelt und die Frucht der Gerechtigkeit[c] in Wermut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Galle“. Das hebräische Wort רֹאשׁ kann eine bittere oder giftige Substanz beziehungsweise Pflanze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wermut ist eine sehr bittere Pflanze und steht hier bildlich für moralische Verderbnis und deren bittere Folgen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Frucht des Rechts“. Das hebräische Wort צְדָקָה kann je nach Zusammenhang sowohl moralische Gerechtigkeit als auch rechtliches Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְרֻצוּן
  choice: Rennen ...?
  rationale: Das hebräische Imperfekt steht in einer rhetorischen Frage über etwas Widersinniges; das deutsche Präsens gibt den sprichwortartigen Charakter natürlich wieder.
- source_word: בַּסֶּלַע
  choice: über Felsen
  rationale: סֶלַע bezeichnet Fels oder felsigen Grund. Der artikellose deutsche Plural macht die allgemeine, bildhafte Aussage verständlich, ohne einen bestimmten Felsen vorauszusetzen.
- source_word: אִם יַחֲרוֹשׁ בַּבְּקָרִים
  choice: Pflügt man dort mit Ochsen?
  rationale: אִם leitet hier die parallele rhetorische Frage ein. Das im Hebräischen unausgesprochene Pflugfeld wird durch „dort“ knapp auf den zuvor genannten felsigen Grund bezogen; בָּקָר meint im Pflugzusammenhang Ochsen.
- source_word: כִּי
  choice: Doch
  rationale: Die Partikel führt hier die anklagende Gegenüberstellung zu den absurden Fragen ein. „Doch“ bewahrt deren zugespitzte adversative Wirkung besser als ein kausales „denn“.
- source_word: הֲפַכְתֶּם
  choice: ihr habt ... verwandelt
  rationale: Das Perfekt der 2. Person Plural bezeichnet die vollzogene Handlung mit fortwirkender Folge und richtet die Anklage unmittelbar an die Angesprochenen.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Im sozial-gerichtlichen Kontext bezeichnet מִשְׁפָּט die gerechte Rechtsordnung und Rechtspraxis. „Das Recht“ ist im Deutschen konkreter und idiomatischer als das abstraktere „Gerechtigkeit“.
- source_word: לְרֹאשׁ
  choice: in Gift
  rationale: רֹאשׁ kann eine giftige oder stark bittere Pflanze beziehungsweise einen giftigen Stoff bezeichnen. „Gift“ vermittelt die zerstörerische Metapher unmittelbar; die botanisch-bittere Alternative wird in einer Fußnote bewahrt.
- source_word: וּפְרִי צְדָקָה
  choice: und die Frucht der Gerechtigkeit
  rationale: Die Konstruktverbindung wird im Deutschen natürlich wiedergegeben. צְדָקָה umfasst ethisch richtiges und gemeinschaftsgerechtes Handeln; „Gerechtigkeit“ hält diese Breite offen.
- source_word: לְלַעֲנָה
  choice: in Wermut
  rationale: לַעֲנָה ist eine für ihre Bitterkeit bekannte Pflanze und dient prophetisch als Bild für Verderbnis und bittere Folgen. Das konkrete Bild bleibt im Haupttext erhalten.
theological_decisions:
- issue: Verhältnis von מִשְׁפָּט und צְדָקָה
  choice: מִשְׁפָּט als „Recht“ und צְדָקָה als „Gerechtigkeit“
  alternative: Beide Begriffe könnten mit „Gerechtigkeit“ beziehungsweise צְדָקָה mit „Recht“ wiedergegeben werden.
  rationale: 'Die unterschiedliche Wiedergabe bewahrt die verwandten, aber nicht völlig deckungsgleichen Begriffe: מִשְׁפָּט hebt hier stärker Rechtsprechung und öffentliche Rechtsordnung hervor, צְדָקָה das rechte Handeln und den daraus erwarteten Ertrag. Die mögliche rechtliche Nuance von צְדָקָה wird in der Fußnote genannt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden kurzen rhetorischen Fragen bewahren die prophetische Schärfe. „Dort“ macht den im Hebräischen impliziten Bezug des Pflügens auf den felsigen Untergrund verständlich, ohne ein zusätzliches konkretes Objekt einzuführen. Die Pflanzenbilder werden nicht verallgemeinert, sondern im Text und durch knappe Fußnoten zugänglich gemacht.
