  text: For behold[a], Yahweh commands, and the great house will be struck into fragments, and the small house into pieces.
translation:
  language: de
  text: Denn siehe, Jahwe gebietet, und er wird das große Haus in Trümmer schlagen und das kleine Haus in Stücke[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann man auch übersetzen: „und er wird das große Haus zu Splittern schlagen und das kleine Haus zu Rissen oder Spalten“. Die beiden seltenen hebräischen Begriffe bezeichnen unterschiedliche Formen des Zerbrechens; besonders der zweite kann Risse, Spalten oder zerbrochene Stücke meinen.'
    reason: Bewahrt die aktive Singularform und erläutert die lexikalische Spannweite von רְסִיסִים und בְּקִעִים, ohne einen vom Kontext nahegelegten Bezug auf Jahwe als offen auszugeben.
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn sieh
  rationale: כִּי begründet die vorausgehende Aussage; הִנֵּה lenkt mit prophetischer Eindringlichkeit die Aufmerksamkeit auf das Folgende. „Denn sieh“ ist verständlich und bewahrt beide Funktionen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: מְצַוֶּה
  choice: befiehlt
  rationale: Das Partizip bezeichnet hier Jahwes unmittelbar wirksamen, autoritativen Befehl; das Präsens ist im Deutschen knapp und natürlich.
- source_word: וְהִכָּה
  choice: und man wird … schlagen
  rationale: Die Verbform ist aktiv, 3. Person Singular, doch der ausführende Handelnde wird nicht ausdrücklich genannt. Das unpersönliche „man“ bewahrt diese Unbestimmtheit besser als ein Passiv oder die ausdrückliche Zuschreibung an Jahwe.
- source_word: הַבַּיִת הַגָּדוֹל
  choice: das große Haus
  rationale: Bewahrt das konkrete Bild und die mögliche Doppelbedeutung von räumlicher Größe und gesellschaftlicher Bedeutung, ohne „Palast“ einzutragen.
- source_word: רְסִיסִים
  choice: in Trümmer
  rationale: Bezeichnet zerschlagene Fragmente; „in Trümmer schlagen“ ist im modernen Deutsch idiomatisch und vermittelt die Gewalt des Gerichts.
- source_word: הַבַּיִת הַקָּטֹן
  choice: das kleine Haus
  rationale: Erhält den deutlichen Parallelismus und Kontrast zum großen Haus.
- source_word: בְּקִעִים
  choice: in Stücke
  rationale: Das seltene Wort kann Spalten, Risse oder abgebrochene Stücke bezeichnen. „Stücke“ passt zum Zerstörungskontext, während die lexikalische Spannweite in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext und wird als solcher wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Handelnder bei וְהִכָּה
  choice: unpersönliches „man“ bei aktivem Verb
  alternative: „es wird … zerschlagen werden“ oder „er wird … schlagen“
  rationale: Der hebräische Satz nennt nach Jahwes Befehl keinen eigenen Ausführenden. Die aktive unpersönliche Form bewahrt sowohl die grammatische Aktivform als auch die offene Frage, wer den Schlag unmittelbar ausführt; der Zusammenhang stellt das Geschehen dennoch unter Jahwes Befehl.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht prophetisch-gehobenem „sieh“. Der Parallelismus „großes Haus/kleines Haus“ bleibt erhalten; unnötige konfessionelle oder soziale Präzisierungen werden vermieden.
