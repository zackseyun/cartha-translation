  terminology: „Zehn Männer“, „in einem Haus“, „übrig bleiben“ und „sterben“ sind präzise und registergerecht. Die Fußnote sollte die passive Nuance des Nifal klar als mögliche Alternative benennen, ohne einen konkreten Ablauf über das Versmaß hinaus zu behaupten.
