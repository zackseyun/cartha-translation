  yaml_path: translation/ot/amos/006/009.yaml
  text: And it will happen that if ten men remain in one house[a], they will die.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn zehn Männer in einem Haus übrig bleiben[a], werden sie sterben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurückgelassen werden“. Das hebräische Verb kann „übrig bleiben“ oder „zurückgelassen werden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Die Verbindung aus waw und der Verbform von היה führt eine künftige Situation ein. Die Wiedergabe ist würdevoll, verständlich und bildet die Diskursfunktion ab.
- source_word: אִם
  choice: wenn
  rationale: Die Partikel leitet hier eine Bedingung ein. Im Deutschen kann „wenn“ eine offene Bedingung natürlich ausdrücken, ohne sie als sicher eintretend festzulegen.
- source_word: יִוָּתְרוּ
  choice: übrig bleiben
  rationale: Der Nifal von יתר bezeichnet das Übrigbleiben, nachdem andere nicht mehr da sind. „Übrig bleiben“ wahrt diese Bedeutung; „überleben“ wäre stärker interpretierend.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: zehn Männer
  rationale: Das Hebräische verwendet ausdrücklich die maskuline Personenbezeichnung; „zehn Männer“ gibt dies präzise wieder.
- source_word: בְּבַיִת אֶחָד
  choice: in einem einzigen Haus
  rationale: Die Formulierung bleibt räumlich und konkret. „Einem einzigen“ macht deutlich, dass alle zehn in demselben Haus sind, ohne zu „Haushalt“ umzudeuten.
- source_word: וָמֵתוּ
  choice: werden auch sie sterben
  rationale: Die Verbform bezeichnet das künftige Ergebnis. „Auch sie“ verdeutlicht im Deutschen knapp, dass selbst die Übriggebliebenen sterben werden; der Bezug ergibt sich aus dem Kontext und der Satzfolge.
