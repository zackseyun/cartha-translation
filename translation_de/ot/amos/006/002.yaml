source:
  edition: WLC
  text: עִבְר֤וּ כַֽלְנֵה֙ וּ/רְא֔וּ וּ/לְכ֥וּ מִ/שָּׁ֖ם חֲמַ֣ת רַבָּ֑ה וּ/רְד֣וּ גַת פְּלִשְׁתּ֗ים הֲ/טוֹבִים֙ מִן הַ/מַּמְלָכ֣וֹת הָ/אֵ֔לֶּה אִם רַ֥ב גְּבוּלָ֖/ם מִ/גְּבֻלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/002.yaml
  text: Cross over to Calneh and see[a]; and from there go to Hamath the great; then go down to Gath of the Philistines[b]. Are they better than these kingdoms? Or is their territory greater than your territory?
translation:
  language: de
  text: Zieht hinüber nach Kalne[b] und seht; geht von dort weiter nach Hamat, der großen Stadt; dann zieht hinab nach Gat der Philister. Sind sie besser als diese Königreiche?[a] Oder ist ihr Gebiet größer als euer Gebiet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid ihr besser als diese Königreiche?“ Das hebräische Wort für „besser“ hat kein ausdrücklich genanntes Subjekt. Gemeint sein können entweder die genannten Städte beziehungsweise Reiche oder die Angeredeten.'
    reason: alternative_reading
  - marker: b
    text: Kalne ist ein Ortsname. Manche setzen den Ort mit einer Stadt im Norden Syriens oder in Mesopotamien gleich; seine genaue Lage ist jedoch unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: Zieht hinüber
  rationale: Der Qal-Imperativ Plural von עבר bezeichnet eine Bewegung hinüber oder über eine Grenze hinweg. „Zieht hinüber“ bewahrt die Richtungsangabe und passt zum Aufsuchen einer Stadt.
- source_word: כַּלְנֵה
  choice: Kalne
  rationale: Der Ortsname wird in einer im Deutschen naheliegenden Transliteration wiedergegeben und nicht übersetzt.
- source_word: וּרְאוּ
  choice: und seht
  rationale: Die knappe Wiedergabe des Imperativs von ראה erhält die rhetorische Aufforderung, den genannten Ort in Augenschein zu nehmen, ohne ein nicht ausdrücklich genanntes Objekt hinzuzufügen.
- source_word: וּלְכוּ מִשָּׁם
  choice: geht von dort weiter
  rationale: „Geht von dort“ bildet Verb und Herkunftsangabe direkt ab; „weiter“ macht die Abfolge der Reiseziele im Deutschen natürlich deutlich.
- source_word: חֲמַת רַבָּה
  choice: zum großen Hamat
  rationale: רַבָּה bedeutet „groß“ und kennzeichnet hier Hamat. Die deutsche Fügung ist natürlich und bewahrt die Bedeutung des Beinamens.
- source_word: וּרְדוּ
  choice: dann zieht hinab
  rationale: Der Imperativ von ירד bezeichnet das geografische Hinabziehen. „Dann“ verdeutlicht die Abfolge, die im Hebräischen durch die Reihe der Imperative ausgedrückt wird.
- source_word: גַּת פְּלִשְׁתִּים
  choice: Gat der Philister
  rationale: Die Status-constructus-Verbindung bezeichnet Gat durch die zugehörige Volksgruppe; „Gat der Philister“ gibt dies knapp und formal nah wieder.
- source_word: הֲטוֹבִים מִן הַמַּמְלָכוֹת הָאֵלֶּה
  choice: Sind sie besser als diese Königreiche?
  rationale: Das maskuline Pluraladjektiv „besser“ hat kein ausdrücklich genanntes Subjekt. „Sie“ nimmt im Haupttext die unmittelbar zuvor genannten Städte beziehungsweise Herrschaftsgebiete auf; die mögliche Beziehung auf die Angeredeten wird in der Fußnote bewahrt.
- source_word: אִם
  choice: Oder
  rationale: אִם leitet hier die zweite Alternative eines rhetorischen Fragenpaares ein und wird daher idiomatisch mit „Oder“ wiedergegeben.
- source_word: רַב גְּבוּלָם מִגְּבֻלְכֶם
  choice: ist ihr Gebiet größer als euer Gebiet
  rationale: גְּבוּל kann Grenze oder Gebiet bedeuten. Beim Vergleich politischer Größen bezeichnet „Gebiet“ am klarsten die räumliche Ausdehnung, ohne lediglich an eine Grenzlinie denken zu lassen.
theological_decisions:
- issue: Nicht genanntes Subjekt von הֲטוֹבִים („besser“)
  choice: Im Haupttext bezieht sich „sie“ auf die genannten Städte beziehungsweise Reiche.
  alternative: „Seid ihr besser als diese Königreiche?“ mit Bezug auf die Angeredeten.
  rationale: Der hebräische Text nennt kein Subjekt. Die nächstliegenden Bezugsgrößen sind die zuvor genannten Orte, doch auch die Angeredeten können gemeint sein. Da die Syntax keine eindeutige Entscheidung erzwingt, wird die Alternative ausdrücklich vermerkt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappen, parallel gebauten Aufforderungen. „Zieht“ wahrt den Charakter einer Reise zwischen Städten; „Gebiet“ ist für den politischen Größenvergleich verständlicher als das wörtlich mögliche „Grenze“. Die echte syntaktische Mehrdeutigkeit der Vergleichsfrage wird nicht im Haupttext geglättet, sondern in Fußnote [a] offengelegt.
