id: AMO.6.10
reference: Amos 6:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/נְשָׂא֞/וֹ דּוֹד֣/וֹ וּ/מְסָרְפ֗/וֹ לְ/הוֹצִ֣יא עֲצָמִים֮ מִן הַ/בַּיִת֒ וְ/אָמַ֞ר לַ/אֲשֶׁ֨ר בְּ/יַרְכְּתֵ֥י הַ/בַּ֛יִת הַ/ע֥וֹד עִמָּ֖/ךְ וְ/אָמַ֣ר אָ֑פֶס וְ/אָמַ֣ר הָ֔ס כִּ֛י לֹ֥א לְ/הַזְכִּ֖יר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/010.yaml
  text: Then his uncle[a], the one who burns him, will carry him out to bring the bones out of the house, and he will say to the one who is in the innermost part of the house, “Is there still anyone with you?” And he will say, “No one.” Then he will say[c][b], “Hush! For we must not mention the name of Yahweh.”
translation:
  language: de
  text: 'Dann wird ihn sein Onkel[a], der ihn verbrennt[b], forttragen, um die Gebeine aus dem Haus hinauszuschaffen. Er wird zu dem, der sich im hintersten Winkel des Hauses befindet, sagen: »Ist noch jemand bei dir?« Der wird antworten: »Niemand.« Dann wird er sagen: »Still! Denn den Namen Jahwes dürfen wir nicht erwähnen.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Verwandter«. Das hebräische Wort kann einen nahen männlichen Verwandten bezeichnen; »Onkel« ist hier wahrscheinlich, aber nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der ihn verbrennt«. Die Wendung ist ungewöhnlich und kann sich auf ein Verbrennen im Zusammenhang mit der Beseitigung der Toten während des Gerichts beziehen.'
    reason: cultural_note
  - marker: c
    text: 'Die knappe hebräische Formulierung kann auch als direkte Aufforderung verstanden werden: »Still! Denn erwähne den Namen Jahwes nicht.«'
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: sein Onkel
  rationale: דּוֹד bezeichnet hier im Zusammenhang mit der Beseitigung eines Leichnams am ehesten einen nahen männlichen Verwandten, wahrscheinlich den Onkel. Die mögliche allgemeinere Bedeutung wird in einer Fußnote bewahrt.
- source_word: וּמְסָרְפוֹ
  choice: der ihn verbrennt
  rationale: Das Partizip gehört zur Wurzel שׂרף, »verbrennen«. Die ungewöhnliche, möglicherweise auf Leichenbeseitigung in der Gerichtskatastrophe bezogene Formulierung wird nicht zu »bestatten« geglättet.
- source_word: לְהוֹצִיא עֲצָמִים
  choice: um die Gebeine aus dem Haus hinauszuschaffen
  rationale: עֲצָמִים bedeutet konkret »Knochen/Gebeine«. »Hinausschaffen« gibt die Kausativform von יצא in natürlichem Deutsch wieder und erhält das drastische Bild.
- source_word: בְּיַרְכְּתֵי הַבַּיִת
  choice: im hintersten Winkel des Hauses
  rationale: יַרְכָּה bezeichnet den abgelegenen, innersten Bereich. »Hinterster Winkel« ist verständlich und räumlich anschaulich.
- source_word: הַעוֹד עִמָּךְ
  choice: Ist noch jemand bei dir?
  rationale: Das im Hebräischen elliptische »noch bei dir?« verlangt im Deutschen eine sinngemäße Ergänzung; »jemand« passt zur Suche nach weiteren Überlebenden oder Toten.
- source_word: אָפֶס
  choice: Niemand
  rationale: Das Wort dient hier als knappe verneinende Antwort darauf, ob noch jemand vorhanden ist.
- source_word: הָס
  choice: Still!
  rationale: Die kurze Interjektion fordert abrupt zum Schweigen auf und bewahrt den von Furcht geprägten Ton.
- source_word: לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: den Namen Jahwes dürfen wir nicht erwähnen
  rationale: Die knappe Infinitivkonstruktion kann Notwendigkeit beziehungsweise Verbot ausdrücken. »Dürfen wir nicht« erhält diese Spannung, ohne einen im Text nicht genannten Grund hinzuzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen etablierte Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe »Jahwe« bewahrt den Eigennamen und vermeidet die Ersetzung durch einen Titel.
- issue: Kraft von כִּי לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: Denn den Namen Jahwes dürfen wir nicht erwähnen.
  alternative: Erwähne den Namen Jahwes nicht. / Der Name Jahwes darf nicht angerufen werden.
  rationale: Die hebräische Formulierung ist elliptisch und lässt sich als gemeinschaftlich geltende Notwendigkeit oder als unmittelbares Verbot verstehen. Die Hauptfassung wahrt den Verbotscharakter, während die Fußnote die alternative direkte Lesart nennt, ohne den theologischen Grund des Schweigens festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, bedrückender Dialogführung. Die drastischen Wörter »verbrennt« und »Gebeine« bleiben bewusst erhalten; die ungewöhnliche Szene und die Mehrdeutigkeit des abschließenden Verbots werden nicht geglättet.
