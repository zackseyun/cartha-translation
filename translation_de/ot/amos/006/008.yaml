reference: Amos 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נִשְׁבַּע֩ אֲדֹנָ֨/י יְהוִ֜ה בְּ/נַפְשׁ֗/וֹ נְאֻם יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת מְתָאֵ֤ב אָֽנֹכִי֙ אֶת גְּא֣וֹן יַֽעֲקֹ֔ב וְ/אַרְמְנֹתָ֖י/ו שָׂנֵ֑אתִי וְ/הִסְגַּרְתִּ֖י עִ֥יר וּ/מְלֹאָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/008.yaml
  text: 'The Lord GOD has sworn by himself—oracle of Yahweh[a], the God of Armies: I abhor the pride of Jacob, and I hate his citadels[c][b]; and I will hand over the city and all that fills it.'
translation:
  language: de
  text: 'Der Herr Yahweh hat bei sich selbst geschworen – Ausspruch Yahwehs, des Gottes der Heerscharen[a]: »Ich verabscheue den Hochmut Jakobs[b] und hasse seine Paläste[c]; ich werde die Stadt und alles, was in ihr ist, ausliefern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Gott der Heere«; traditionell: »Gott Zebaoth«. Das hebräische Wort kann Heere beziehungsweise himmlische Heerscharen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Hoheit Jakobs«. Das hebräische Wort kann sowohl Hoheit als auch überheblichen Stolz bezeichnen; der Gerichtszusammenhang legt hier »Hochmut« nahe.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »seine Zitadellen«. Das hebräische Wort bezeichnet Paläste, häufig als befestigte herrschaftliche Anlagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: 'Das zusammengesetzte Gottesprädikat wird transparent wiedergegeben: אֲדֹנָי als »Herr« und das Tetragramm als »Yahweh«.'
- source_word: נִשְׁבַּע ... בְּנַפְשׁוֹ
  choice: hat bei sich selbst geschworen
  rationale: Die hebräische Wendung lautet wörtlich »bei seinem Leben/seiner Person« und bezeichnet einen feierlichen Eid Gottes bei sich selbst.
- source_word: נְאֻם יְהוָה אֱלֹהֵי צְבָאוֹת
  choice: Ausspruch Yahwehs, des Gottes der Heerscharen
  rationale: »Ausspruch« bewahrt den Charakter der prophetischen Formel; »Heerscharen« umfasst die militärische Bildwelt von צְבָאוֹת, ohne sie auf menschliche Armeen zu verengen.
- source_word: מְתָאֵב
  choice: ich verabscheue
  rationale: Das Partizip drückt starke, gegenwärtige Abscheu aus; »verabscheuen« ist kraftvoll und in modernem Deutsch natürlich.
- source_word: גְּאוֹן יַעֲקֹב
  choice: den Hochmut Jakobs
  rationale: Im Gerichtskontext liegt die negative Bedeutung »Hochmut« nahe; die mögliche Bedeutung »Hoheit« wird in einer Fußnote erhalten.
- source_word: אַרְמְנֹתָיו
  choice: seine Paläste
  rationale: אַרְמוֹן bezeichnet besonders einen Palast beziehungsweise einen befestigten herrschaftlichen Bau. »Paläste« ist die unmittelbare, verständliche Wiedergabe; »Zitadellen« bleibt als Alternative vermerkt.
- source_word: שָׂנֵאתִי
  choice: hasse
  rationale: Das Perfekt beschreibt hier Yahwehs feste Haltung; das deutsche Präsens gibt die unmittelbare Kraft der Rede wieder.
- source_word: וְהִסְגַּרְתִּי
  choice: ich werde ... ausliefern
  rationale: Der Hifil von סגר bedeutet in diesem Gerichtszusammenhang, etwas der Gewalt eines anderen preiszugeben. Das einfache ו wird ohne zusätzliche Kausalität wiedergegeben.
- source_word: עִיר וּמְלֹאָהּ
  choice: die Stadt und alles, was sie erfüllt
  rationale: Die Formulierung bleibt nahe am hebräischen Sammelbegriff und lässt offen, ob vor allem Bewohner, Besitz oder beides gemeint sind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als »Yahweh« wiedergegeben, während אֲדֹנָי eigenständig mit »Herr« übersetzt wird; so bleibt die Unterscheidung im zusammengesetzten Titel sichtbar.
- issue: Bedeutung von גְּאוֹן יַעֲקֹב
  choice: Hochmut Jakobs
  alternative: Hoheit Jakobs
  rationale: Die Verbindung mit Verabscheuung und Gericht spricht für die negative Bedeutung. Da das Wort auch positive Hoheit bezeichnen kann, wird diese echte lexikalische Mehrdeutigkeit in der Fußnote bewahrt.
- issue: Referenzumfang von וּמְלֹאָהּ
  choice: alles, was sie erfüllt
  alternative: alles, was in ihr ist
  rationale: Die quellennähere Formulierung vermeidet eine unbegründete Festlegung darauf, ob Menschen, Güter oder die gesamte Fülle der Stadt gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Feierlichkeit. Der Gedankenstrich markiert die eingeschobene Ausspruchsformel; die direkte Gottesrede wird durch deutsche Anführungszeichen kenntlich gemacht. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
