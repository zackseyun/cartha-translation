id: AMO.6.14
reference: Amos 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֡י הִנְ/נִי֩ מֵקִ֨ים עֲלֵי/כֶ֜ם בֵּ֣ית יִשְׂרָאֵ֗ל נְאֻם יְהוָ֛ה אֱלֹהֵ֥י הַ/צְּבָא֖וֹת גּ֑וֹי וְ/לָחֲצ֥וּ אֶתְ/כֶ֛ם מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל הָ/עֲרָבָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/014.yaml
  text: For behold[a], I am raising up against you a nation, O house of Israel, declares Yahweh, the God of hosts[b], and they will oppress you from Lebo-hamath to the Wadi of the Arabah.
translation:
  language: de
  text: 'Denn seht: Ich lasse gegen euch, Haus Israel, ein Volk aufstehen – Ausspruch Jahwes, des Gottes der Heerscharen –, und sie werden euch bedrängen, von Lebo-Hamat[a] bis zum Wadi der Araba[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Zugang nach Hamat“. Der hebräische Ausdruck kann als Ortsname Lebo-Hamat oder als beschreibende Grenzangabe verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „bis zum Bach der Araba“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Gerichtsaussage ein und wahrt den Zusammenhang.
- source_word: הִנְנִי
  choice: 'seht: Ich'
  rationale: Gibt die aufmerksamkeitsfordernde prophetische Ankündigung in natürlichem modernem Deutsch wieder; der Plural „seht“ richtet sich an das Haus Israel.
- source_word: מֵקִים
  choice: lasse … aufstehen
  rationale: Bewahrt beim Hifil von קום die göttliche Verursachung und bezeichnet das Auftreten eines Volkes als Werkzeug des Gerichts.
- source_word: עֲלֵיכֶם
  choice: gegen euch
  rationale: Die Präposition hat im militärischen und gerichtlichen Zusammenhang adversative Bedeutung.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die direkte Anrede bleibt erhalten; ein zusätzliches „o“ wäre im heutigen Deutsch unnötig altertümlich.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Gibt die feierliche prophetische Formel knapp und quellennah wieder.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: Gott der Heerscharen
  rationale: Bewahrt die militärische und kosmische Weite von צבאות, ohne sie ausschließlich auf irdische oder himmlische Heere zu beschränken.
- source_word: גּוֹי
  choice: ein Volk
  rationale: Bezeichnet hier eine fremde politische und militärische Macht; „Volk“ ist im Deutschen natürlich und lässt die kollektive Bedeutung erkennen.
- source_word: וְלָחֲצוּ
  choice: und sie werden euch bedrängen
  rationale: Das Verb bezeichnet drückende Bedrängnis beziehungsweise Unterwerfung. Der Plural des hebräischen Verbs bleibt trotz des vorausgehenden kollektiven Singulars „Volk“ sichtbar.
- source_word: מִלְּבוֹא חֲמָת
  choice: von Lebo-Hamat
  rationale: Behandelt den Ausdruck als bekannten geografischen Namen, ohne seine mögliche Deutung als Grenzbeschreibung zu verschweigen.
- source_word: נַחַל הָעֲרָבָה
  choice: bis zum Wadi der Araba
  rationale: „Wadi“ bezeichnet einen oft nur zeitweise wasserführenden Lauf geografisch genauer als „Bach“; „Araba“ bleibt als Regionsname erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift macht den im Ausgangstext stehenden Eigennamen sichtbar und folgt der vorgegebenen Projektentscheidung, ohne eine konfessionelle Sonderdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. „Seht“ ist verständlicher als das altertümliche „siehe“; „Ausspruch Jahwes“ und „Heerscharen“ bewahren den feierlichen Charakter. Die Pluralform „sie werden“ erhält die auffällige Numerusspannung zwischen dem einen Volk und seinen Angehörigen.
