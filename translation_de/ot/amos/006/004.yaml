base_translation:
  language: en
  yaml_path: translation/ot/amos/006/004.yaml
  text: those who lie on beds of ivory and sprawl on their couches[b][a], and eat lambs from the flock and calves from the stall—
translation:
  language: de
  text: die auf Elfenbeinbetten liegen, sich auf ihren Polstern räkeln[a] und Lämmer aus der Herde sowie Kälber aus dem Maststall[b] essen —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sich auf ihren Lagern ausstrecken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: aus dem Stall.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁכְבִים
  choice: die … liegen
  rationale: Das substantivisch gebrauchte Partizip setzt die Beschreibung der in Vers 1 Angesprochenen fort und bezeichnet ihr gewohntes Verhalten.
- source_word: מִטּוֹת שֵׁן
  choice: Elfenbeinbetten
  rationale: Die knappe Wiedergabe bewahrt das Bild luxuriöser, wahrscheinlich mit Elfenbein verzierter Betten, ohne diese wahrscheinliche Ausgestaltung in den Haupttext einzutragen.
- source_word: וּסְרֻחִים
  choice: und sich … räkeln
  rationale: Das Verb beschreibt ein ausgestrecktes, behaglich-selbstgefälliges Lagern. „Sich räkeln“ gibt diese Haltung natürlich und anschaulich wieder; die neutralere Alternative wird in der Fußnote bewahrt.
- source_word: עַל עַרְשׂוֹתָם
  choice: auf ihren Ruhepolstern
  rationale: עֶרֶשׂ kann ein Bett oder eine Liegestatt bezeichnen. „Ruhepolster“ vermeidet die unmittelbare Wiederholung von „Betten“ und passt zum Bild luxuriösen Lagerns.
- source_word: וְאֹכְלִים
  choice: essen
  rationale: Das Partizip gehört zur Reihe gewohnheitsmäßiger Handlungen und wird im Deutschen idiomatisch mit dem Präsens wiedergegeben.
- source_word: כָּרִים
  choice: Lämmer
  rationale: Das Wort bezeichnet junge Schafe, hier als ausgewählte Speisetiere; „Lämmer“ ist die klare und übliche deutsche Entsprechung.
- source_word: מִצֹּאן
  choice: aus der Herde
  rationale: Die Wendung bewahrt das Bild, dass die Tiere unmittelbar aus dem Herdenbestand ausgewählt werden.
- source_word: וַעֲגָלִים
  choice: und Kälber
  rationale: Dies ist die direkte und natürliche Entsprechung für die jungen Rinder, deren Fleisch als luxuriöse Speise dient.
- source_word: מִתּוֹךְ מַרְבֵּק
  choice: aus dem Maststall
  rationale: מַרְבֵּק bezeichnet einen Stall oder Pferch, in dem Tiere gehalten und wohl auch gemästet werden. „Maststall“ bringt die für das Luxusmahl relevante Nuance knapp zum Ausdruck; die allgemeinere Wiedergabe steht in der Fußnote.
