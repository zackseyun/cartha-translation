  text: הַ/שְּׂמֵחִ֖ים לְ/לֹ֣א דָבָ֑ר הָ/אֹ֣מְרִ֔ים הֲ/ל֣וֹא בְ/חָזְקֵ֔/נוּ לָקַ֥חְנוּ לָ֖/נוּ קַרְנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/013.yaml
  text: you who rejoice over nothing[a], who say[b], “Have we not by our own strength taken horns for ourselves?”
translation:
  language: de
  text: 'Ihr, die ihr euch über nichts freut[a] und sagt: »Haben wir uns nicht aus eigener Kraft Hörner verschafft?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische »über nichts« kann zugleich auf den Ortsnamen Lo-Debar anspielen. So entstünde ein Wortspiel: Sie freuen sich über die Eroberung einer Stadt, deren Name wie »kein Ding« oder »nichts« klingt.'
    reason: lexical_alternative
  - marker: b
    text: 'Möglicherweise auch: »Haben wir uns nicht aus eigener Kraft Karnaim verschafft?« Das hebräische Wort für »Hörner« kann zugleich den Ortsnamen Karnaim anklingen lassen und so militärische Macht mit einer Eroberung verbinden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: ihr, die ihr euch freut
  rationale: Das pluralische Partizip setzt die direkte prophetische Anrede aus dem Zusammenhang fort. Die Relativkonstruktion klingt im modernen Deutsch natürlich und bewahrt den anklagenden Ton.
- source_word: לְלֹא דָבָר
  choice: über nichts
  rationale: Die Wendung bedeutet wörtlich etwa »über kein Ding« und bezeichnet im unmittelbaren Sinn etwas Nichtiges oder Wertloses. Zugleich kann sie auf den Ortsnamen Lo-Debar anspielen; diese Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: הָאֹמְרִים
  choice: und sagt
  rationale: Das zweite pluralische Partizip steht parallel zum ersten. Im Deutschen führt »und sagt« die direkte Anrede flüssig weiter.
- source_word: הֲלוֹא
  choice: Haben wir nicht
  rationale: Die Partikel leitet eine rhetorische Frage ein, die selbstzufriedene Gewissheit ausdrückt.
- source_word: בְחָזְקֵנוּ
  choice: aus eigener Kraft
  rationale: Die Form bezeichnet »durch/mit unserer Kraft«. »Eigener« macht den prahlerischen Selbstbezug idiomatisch deutlich, ohne einen fremden Gedanken einzuführen.
- source_word: לָקַחְנוּ לָנוּ
  choice: haben wir uns … verschafft
  rationale: Die Verbindung bedeutet wörtlich »haben wir für uns genommen«. »Uns … verschafft« bewahrt den Erwerbssinn und passt sowohl zur metaphorischen als auch zur möglichen geografischen Lesart.
- source_word: קַרְנָיִם
  choice: Hörner
  rationale: Die Dualform bedeutet wörtlich »zwei Hörner/Hörner«; das Horn ist ein Bild für Macht. Zugleich kann Karnaim als Ortsname anklingen. Die Hauptübersetzung erhält das Bild, die Fußnote die mögliche Ortsanspielung.
