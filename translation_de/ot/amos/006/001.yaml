source:
  edition: WLC
  text: ה֚וֹי הַ/שַּׁאֲנַנִּ֣ים בְּ/צִיּ֔וֹן וְ/הַ/בֹּטְחִ֖ים בְּ/הַ֣ר שֹׁמְר֑וֹן נְקֻבֵי֙ רֵאשִׁ֣ית הַ/גּוֹיִ֔ם וּ/בָ֥אוּ לָ/הֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/001.yaml
  text: Woe to those who are at ease in Zion[a], and to those who feel secure on the mountain of Samaria, the distinguished men of the foremost of the nations[c][b], to whom the house of Israel comes.
translation:
  language: de
  text: Wehe denen, die in Zion sorglos sind, und denen, die sich auf dem Berg Samarias sicher fühlen – den namhaften Männern[a] der ersten unter den Nationen[b], zu denen das Haus Israel kommt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den Bezeichneten“ oder „den Genannten“; gemeint sind offenbar hervorgehobene oder angesehene Personen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „der führenden Nationen“ oder „des vornehmsten unter den Völkern“. Der hebräische Ausdruck kann zeitlichen oder rangmäßigen Vorrang bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Satz ist knapp und lautet wörtlich: „Und zu ihnen kommt das Haus Israel.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Interjektion verbindet Klage mit Gerichtsankündigung; „Wehe“ bewahrt beide Aspekte in einer geläufigen biblischen Ausdrucksweise.
- source_word: הַשַּׁאֲנַנִּים
  choice: denen, die … sorglos leben
  rationale: Das Partizip bezeichnet ein Leben in Ruhe und selbstzufriedener Sicherheit. „Sorglos leben“ gibt hier sowohl die äußere Bequemlichkeit als auch den kritischen Unterton wieder.
- source_word: בְּצִיּוֹן
  choice: auf Zion
  rationale: Die Präposition ist örtlich gebraucht. Im Deutschen ist bei der als Berg beziehungsweise Stadtbereich verstandenen Bezeichnung „auf Zion“ natürlich und quellennah.
- source_word: וְהַבֹּטְחִים
  choice: denen, die sich … sicher fühlen
  rationale: בטח kann Vertrauen oder ein Empfinden von Sicherheit bezeichnen. Der Zusammenhang kritisiert selbstgewisse Sicherheit; die Formulierung vermeidet daher den möglichen positiven Klang von „vertrauen“.
- source_word: בְּהַר שֹׁמְרוֹן
  choice: auf dem Berg Samaria
  rationale: Die Wiedergabe hält die geografische Konstruktion offen und macht aus ihr nicht unnötig einen feststehenden Eigennamen wie „Berg Samaria“.
- source_word: נְקֻבֵי
  choice: den namhaften Männern
  rationale: Das Wort bedeutet wörtlich „die Bezeichneten/Genannten“ und bezeichnet im Zusammenhang hervorgehobene, angesehene Personen. „Namhafte Männer“ bewahrt das Wortspiel mit dem Genanntsein eher als „führende Männer“; die wörtlicheren Möglichkeiten stehen in der Fußnote.
- source_word: רֵאשִׁית הַגּוֹיִם
  choice: der ersten unter den Nationen
  rationale: רֵאשִׁית kann zeitlichen Vorrang oder höchsten Rang ausdrücken. Die nahe Wiedergabe „der ersten“ lässt diese Mehrdeutigkeit bestehen; „unter den Nationen“ gibt die Beziehung des hebräischen Genitivs verständlich wieder.
- source_word: וּבָאוּ לָהֶם
  choice: zu denen … kommt
  rationale: Der knappe hebräische Satz wird als Relativsatz angeschlossen, damit seine Beziehung zu den zuvor genannten Personen im Deutschen erkennbar ist, ohne die Art oder den Zweck des Kommens auszudeuten.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die traditionelle national-korporative Wendung wird beibehalten und nicht vereinfachend durch „Israel“ oder „das Volk Israel“ ersetzt.
theological_decisions:
- issue: Adressaten in Zion und Samaria
  choice: Die Übersetzung nennt sorglose Menschen in Zion und selbstsichere Menschen auf dem Berg Samaria als parallele Adressaten.
  alternative: Der gesamte Vers könnte ausschließlich gegen die Führung des Nordreichs gerichtet sein, während Zion nur rhetorisch einbezogen oder textkritisch infrage gestellt wird.
  rationale: Der masoretische Text stellt beide Ortsangaben parallel nebeneinander. Die Übersetzung bewahrt diese Struktur, ohne die genaue Reichweite der Anrede dogmatisch festzulegen.
- issue: Bezug von „der ersten unter den Nationen“
  choice: Die Wendung bleibt grammatisch bei den „namhaften Männern“ und wird nicht ausdrücklich mit Israel, Zion oder Samaria identifiziert.
  alternative: Die Wendung kann die führende Nation beziehungsweise die führenden Nationen bezeichnen, zu deren Elite die Angesprochenen gehören; auch ein ironischer Anspruch auf Vorrang ist möglich.
  rationale: Der hebräische Ausdruck ist knapp und lässt sowohl den genauen Bezug als auch einen möglichen ironischen Unterton offen. Eine erklärende Festlegung im Haupttext würde diese Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Schärfe. Der Gedankenstrich kennzeichnet die appositionelle Zuspitzung auf die führenden Männer. Die Formulierungen vermeiden konfessionelle Deutungen und bewahren die syntaktische und semantische Mehrdeutigkeit des letzten Versdrittels.
