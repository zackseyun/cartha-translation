  text: Therefore now they will go into exile at the head of the exiles[a], and the revelry of those who sprawl will pass away.
translation:
  language: de
  text: Darum werden sie jetzt als Erste der Verbannten in die Verbannung ziehen, und das Gelage derer, die ausgestreckt liegen,[a] wird ein Ende haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann verschwindet das Gelage der ausgestreckt Liegenden“ oder „das Gelage derer, die sich ausstrecken“. Der hebräische Ausdruck ist knapp und spielt wahrscheinlich auf das ausgestreckte Liegen auf Ruhebetten im vorherigen Vers an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorhergehenden Anklage klar und natürlich.
- source_word: עַתָּה
  choice: jetzt
  rationale: Bewahrt die zeitliche Unmittelbarkeit des angekündigten Gerichts.
- source_word: יִגְלוּ
  choice: müssen sie … in die Verbannung ziehen
  rationale: Gibt גלה idiomatisch als Gang ins Exil wieder; „müssen“ bringt im Deutschen den angekündigten Zwang zur Deportation zum Ausdruck, ohne das Verb passiv zu machen.
- source_word: בְּרֹאשׁ גֹּלִים
  choice: als Erste in die Verbannung
  rationale: Vermittelt die führende beziehungsweise erste Stellung der zuvor privilegierten Männer unter den Deportierten und erhält die prophetische Ironie, ohne eine schwerfällige wörtliche Formulierung.
- source_word: וְסָר
  choice: wird ein Ende haben
  rationale: Drückt das Aufhören beziehungsweise Verschwinden der ausschweifenden Feier natürlich aus.
- source_word: מִרְזַח
  choice: das Gelage
  rationale: Bezeichnet hier eine festliche, offenbar ausschweifende Trink- und Feiergemeinschaft; „Gelage“ passt zum tadelnden Kontext.
- source_word: סְרוּחִים
  choice: derer, die sich ausstrecken
  rationale: Bewahrt das körperliche Bild des hingestreckten Liegens und den Rückbezug auf die Ruhebetten im vorherigen Vers; die genaue Nuance des seltenen Ausdrucks bleibt offen.
