  naturalness: „Die auf der Harfe spielen“ ist modernes, idiomatisches Deutsch und bewahrt den Anschlusscharakter des Partizipialsatzes. „Ersinnen“ ist in diesem prophetisch-literarischen Register natürlich; der Gedankenstrich bleibt als Satzfortführung erhalten.
  terminology: „Harfe“ ist für נֵבֶל eine vertretbare traditionelle Sammelbezeichnung, ohne eine zu präzise Rekonstruktion des antiken Instruments zu behaupten. „Musikinstrumente“ trifft כְּלֵי־שִׁיר. Der Vergleich „wie David“ bleibt bewusst knapp und deutet weder Zustimmung noch eine bestimmte Deutung des Vergleichs an.
