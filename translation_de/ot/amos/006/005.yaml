  text: הַ/פֹּרְטִ֖ים עַל פִּ֣י הַ/נָּ֑בֶל כְּ/דָוִ֕יד חָשְׁב֥וּ לָ/הֶ֖ם כְּלֵי שִֽׁיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/005.yaml
  text: who strum on the mouth of the harp, and like David invent for themselves instruments of song—
translation:
  language: de
  text: die auf der Harfe spielen und sich wie David Musikinstrumente ersinnen —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֹּרְטִים
  choice: die ... klimpern
  rationale: Das Partizip bezeichnet hier das Zupfen bzw. Klimpern auf einem Saiteninstrument; „klimpern“ gibt im Deutschen sowohl die Spielweise als auch den wahrscheinlich kritischen Ton des Zusammenhangs wieder.
- source_word: עַל־פִּי הַנָּבֶל
  choice: zur Harfe
  rationale: Wörtlich etwa „am Mund/auf der Öffnung der Leier“. Natürliches Deutsch bezeichnet das Spielen beziehungsweise Singen zur Begleitung des Instruments mit „zur Harfe“; נבל meint ein harfen- oder leierartiges Saiteninstrument.
- source_word: חָשְׁבוּ
  choice: ausdenken
  rationale: Das Verb bedeutet hier „ersinnen, ausdenken, erfinden“. „Ausdenken“ bewahrt den kreativen Sinn, ohne zwingend eine technische Neuerfindung zu behaupten.
- source_word: כְּלֵי שִׁיר
  choice: Musikinstrumente
  rationale: Wörtlich „Geräte des Liedes/Gesangs“; idiomatisch sind Instrumente zum Musizieren gemeint.
theological_decisions:
- issue: Vergleich mit David
  choice: wie David
  alternative: nach dem Vorbild Davids
  rationale: Der knappe Vergleich des Hebräischen bleibt erhalten. Der Text lässt offen, ob die Angesprochenen sich selbst mit David vergleichen oder ob Amos die Ähnlichkeit ironisch beziehungsweise kritisch formuliert.
translation_notes:
  register: Modernes, verständliches und zugleich prophetisch-kritisches Deutsch. Der Gedankenstrich zeigt, dass der Satz im folgenden Vers weitergeführt wird.
source_grounding:
