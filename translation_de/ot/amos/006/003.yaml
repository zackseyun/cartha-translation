  text: you who put far away the evil day and bring near the seat of violence[a][b].
translation:
  language: de
  text: Ihr, die ihr den Tag des Unheils von euch weist[a] und den Sitz der Gewalt heranrückt[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »die ihr den Tag des Unheils hinausschiebt«; wörtlich: »den bösen Tag«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »den Thron der Gewalt« oder »die Herrschaft der Gewalt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְנַדִּים
  choice: die ihr … von euch weist
  rationale: Das Partizip spricht die Angeredeten an und bezeichnet ein aktives Fernhalten oder Wegschieben. „Von euch weist“ bewahrt sowohl das räumliche Bild als auch den anklagenden Ton.
- source_word: לְיוֹם רָע
  choice: den Tag des Unheils
  rationale: Die Wendung bezeichnet einen kommenden Tag des Unglücks oder Gerichts. „Tag des Unheils“ ist im heutigen Deutsch natürlich und lässt den prophetischen Gerichtssinn unausgedeutet.
- source_word: וַתַּגִּישׁוּן
  choice: und … nahebringt
  rationale: Die Kausativform von נגשׁ bedeutet „nahebringen“. Die Wiedergabe erhält den ironischen Gegensatz zwischen dem vermeintlich ferngehaltenen Unheilstag und der nahegebrachten Gewalt.
- source_word: שֶׁבֶת
  choice: den Sitz
  rationale: שֶׁבֶת kann hier den Sitz, das Thronen oder die Herrschaft bezeichnen. „Sitz“ bewahrt das konkrete, zugleich mehrdeutige Bild, ohne vorschnell eine königliche Institution festzulegen.
- source_word: חָמָס
  choice: der Gewalt
  rationale: חָמָס bezeichnet gewaltsames, rücksichtsloses Unrecht. „Gewalt“ ist die direkte und im sozialen Gerichtskontext des Amos passende Wiedergabe.
theological_decisions:
- issue: Ironischer Zusammenhang zwischen dem Tag des Unheils und dem Sitz der Gewalt
  choice: Die Angeredeten weisen den kommenden Unheilstag gedanklich von sich, während sie zugleich die Gewalt nahebringen oder etablieren.
  alternative: Sie glauben, das Gericht aufzuschieben, bringen aber gerade dadurch einen Tag der Gewalt näher; oder sie setzen unabhängig davon eine Gewaltherrschaft ein.
  rationale: Der hebräische Parallelismus ist knapp und bestimmt nicht eindeutig, ob „Sitz der Gewalt“ vor allem gesellschaftliche Unterdrückung, deren Herrschaft oder das dadurch herbeigeführte Gericht meint. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Moderne, würdige prophetische Anrede. Der Ausruf macht den anklagenden Charakter des isolierten Verses deutlich. Die konkrete Gegenüberstellung von fern und nah sowie die Mehrdeutigkeit von „Sitz“ bleiben erhalten.
