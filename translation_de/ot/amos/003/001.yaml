id: AMO.3.1
reference: Amos 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל עַ֚ל כָּל הַ/מִּשְׁפָּחָ֔ה אֲשֶׁ֧ר הֶעֱלֵ֛יתִי מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/001.yaml
  text: 'Hear this word that Yahweh has spoken against you[a], sons of Israel, against the whole family that I brought up from the land of Egypt, saying:'
translation:
  language: de
  text: 'Hört dieses Wort, das Jahwe gegen euch gesprochen hat, ihr Söhne Israels[a], gegen die ganze Familie, die ich aus dem Land Ägypten heraufgeführt habe:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Kinder Israels“ oder „Volk Israel“. Wörtlich steht hier „Söhne Israels“; die familiäre Bundesbezeichnung meint in diesem Zusammenhang das Volk als Ganzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Pluralimperativ bewahrt den nachdrücklichen prophetischen Aufruf und klingt im Deutschen würdig und unmittelbar.
- source_word: הַדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: „Wort“ bildet דָּבָר im Zusammenhang einer göttlichen prophetischen Aussage transparent ab; „Botschaft“ wäre idiomatischer, aber stärker deutend.
- source_word: דִּבֶּר יְהוָה
  choice: das Jahwe … gesprochen hat
  rationale: Das deutsche Perfekt gibt die vollendete, weiterhin maßgebliche Redehandlung natürlich wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עֲלֵיכֶם
  choice: gegen euch
  rationale: Im Gerichtskontext trägt עַל eine gegen die Angeredeten gerichtete Bedeutung; „über euch“ wäre ebenfalls möglich, schwächte aber den konfrontativen Ton ab.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Die formnahe Wiedergabe erhält die familiäre Bundesbezeichnung des Hebräischen; eine Fußnote erläutert, dass die korporative Bezeichnung das Volk Israel meint.
- source_word: עַל כָּל הַמִּשְׁפָּחָה
  choice: gegen die ganze Familie
  rationale: „Familie“ bewahrt das Bild der durch Abstammung und Bund verbundenen Gemeinschaft; die Wiederholung von „gegen“ erhält den gerichtlichen Nachdruck.
- source_word: הֶעֱלֵיתִי
  choice: ich … heraufgeführt habe
  rationale: „Heraufführen“ bildet den Hifil von עלה und die traditionelle Exodus-Richtungsvorstellung genauer ab als das allgemeinere „herausführen“.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Diese Formulierung gibt die Herkunftsangabe direkt und in natürlichem modernem Deutsch wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Da die angekündigte Rede im folgenden Vers weitergeht, übernimmt der Doppelpunkt idiomatisch die Funktion der hebräischen Redeeinleitungsformel, ohne ein schwerfälliges „indem er sagte“ einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Korporative und zugleich grammatisch maskuline Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Kinder Israels; Volk Israel
  rationale: Die Übersetzung erhält die ausdrücklich familiäre Form des Ausgangstextes. Die Fußnote macht deutlich, dass die Bezeichnung hier korporativ das ganze Volk umfasst.
- issue: Wechsel von der Rede über Jahwe zur ersten Person in אֲשֶׁר הֶעֱלֵיתִי
  choice: den unvermittelten Wechsel mit „die ich … heraufgeführt habe“ bewahren
  alternative: glätten zu „die er … heraufgeführt hat“
  rationale: Der masoretische Text wechselt innerhalb des Satzes zur göttlichen Ich-Rede. Die Übersetzung bewahrt diese auffällige Spannung, statt sie stillschweigend zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Nachdruck. Die Wiederholung von „gegen“ und der auffällige Wechsel zur göttlichen ersten Person bleiben bewusst erhalten. Der Doppelpunkt gibt die abschließende hebräische Redeeinleitungsformel knapp wieder.
