base_translation:
  language: en
  yaml_path: translation/ot/amos/003/011.yaml
  text: 'Therefore[a], thus says the Lord GOD: An adversary shall surround the land, and he shall bring down your strength from you[b], and your citadels shall be plundered.'
translation:
  language: de
  text: 'Darum spricht der Herr Jahwe: Ein Feind[a] wird das Land umzingeln. Er wird dir deine Macht nehmen, und deine Paläste[b] werden geplündert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Bedränger« beziehungsweise »Ein Widersacher«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deine Zitadellen«. Das hebräische Wort kann Paläste oder befestigte Herrschaftssitze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Gerichtswort knapp und natürlich wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Bewahrt sowohl den Herrschaftstitel אֲדֹנָי als auch den in יְהוִה überlieferten Gottesnamen, ohne die beiden Bestandteile zusammenfallen zu lassen.
- source_word: צַר וּסְבִיב הָאָרֶץ
  choice: Ein Feind wird das Land ringsum einschließen
  rationale: Der hebräische Ausdruck ist knapp und elliptisch. Die verbale Wiedergabe macht die angedrohte feindliche Umzingelung im Deutschen verständlich, ohne den Angreifer näher zu bestimmen.
- source_word: וְהוֹרִיד מִמֵּךְ עֻזֵּךְ
  choice: Er wird dir deine Macht nehmen
  rationale: עֹז bezeichnet hier die politische oder militärische Stärke. Die idiomatische deutsche Formulierung gibt das Herabsetzen beziehungsweise Entziehen dieser Macht wieder.
- source_word: וְנָבֹזּוּ
  choice: werden geplündert
  rationale: Das Nifal bezeichnet das Erleiden von Plünderung im Zusammenhang eines feindlichen Angriffs.
- source_word: אַרְמְנוֹתָיִךְ
  choice: deine Paläste
  rationale: אַרְמוֹן kann einen Palast oder eine befestigte, repräsentative Anlage bezeichnen. »Paläste« ist im Zusammenhang der reichen Oberschicht Samarias natürlich; die Bedeutung »Zitadellen« bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form erhält den persönlichen Gottesnamen und zugleich den vorangestellten Herrschaftstitel. Sie vermeidet, den Namen durch einen zweiten Titel zu ersetzen.
- issue: Bestimmung des angekündigten Angreifers
  choice: unbestimmt als »ein Feind«
  alternative: Benennung Assyriens
  rationale: Der Vers selbst nennt die feindliche Macht nicht. Die Übersetzung bewahrt diese Unbestimmtheit und trägt keine spätere historische Identifikation in den Wortlaut ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Sätze bewahren den eindringlichen Ton des Gerichtsworts. Die elliptische hebräische Wendung zur Umzingelung wird für gewöhnliche Leser maßvoll expliziert; sachliche Mehrdeutigkeiten werden in den Fußnoten erhalten.
