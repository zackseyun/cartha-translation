base_translation:
  language: en
  yaml_path: translation/ot/amos/003/013.yaml
  text: Hear and testify against the house of Jacob[a], declares the Lord GOD[b], the God of hosts.
translation:
  language: de
  text: Hört und legt Zeugnis ab gegen das Haus Jakobs[a] – Ausspruch des Herrn Yahweh[b], des Gottes der Heerscharen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „legt im Haus Jakobs Zeugnis ab“. Die hebräische Präposition kann hier unterschiedlich verstanden werden; der Gerichtszusammenhang spricht für „gegen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: Adonaj JHWH, eine Verbindung des Titels „Herr“ mit dem Gottesnamen Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Imperativ Plural bewahrt den feierlichen prophetischen Aufruf und entspricht dem gerichtlichen Zusammenhang.
- source_word: וְהָעִידוּ
  choice: legt Zeugnis ab gegen
  rationale: Der Hifil-Imperativ von עוד bezeichnet hier wahrscheinlich ein Auftreten als Zeugen. Die Formulierung wahrt den forensischen Sinn, ohne den möglichen Inhalt des Zeugnisses näher festzulegen.
- source_word: בְּבֵית יַעֲקֹב
  choice: gegen das Haus Jakob
  rationale: Die Präposition ב kann mehrere Beziehungen ausdrücken. Im Gerichtskontext von Amos 3 liegt die adversative Bedeutung „gegen“ nahe; „Haus Jakob“ bleibt als Bezeichnung für Israel erhalten.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Substantiv bezeichnet eine autoritative göttliche Äußerung. „Ausspruch“ bildet die feste prophetische Formel knapp und würdevoll ab.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr JHWH
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי („Herr“) vom unmittelbar folgenden Gottesnamen und vermeidet, beide Elemente zu einem einzigen Titel zu verschmelzen.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: der Gott der Heerscharen
  rationale: „Heerscharen“ bewahrt die Breite von צְבָאוֹת, ohne ausschließlich irdische oder himmlische Heere anzunehmen, und ist als biblischer Hoheitstitel im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr JHWH
  alternative: GOTT, der Herr; der Herr, Jahwe
  rationale: Die Konsonantenform „JHWH“ macht den Eigennamen sichtbar und bewahrt zugleich die Ungewissheit seiner historischen Aussprache. Die Fußnote erklärt die ungewöhnliche Verbindung von Herrentitel und Gottesnamen.
- issue: Referenz der „Heerscharen“
  choice: nicht näher bestimmt
  alternative: himmlische Heere; irdische Armeen
  rationale: Der hebräische Titel legt an dieser Stelle nicht ausdrücklich fest, ob himmlische oder irdische Heere gemeint sind; die Übersetzung lässt diese Weite bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Legt Zeugnis ab“ hält den gerichtlichen Ton aufrecht; „Ausspruch“ und „Heerscharen“ sind gehoben, aber im prophetischen Kontext verständlich. Der Gedankenstrich gliedert die Redeeinleitung, ohne dem Ausgangstext zusätzliche Aussageinhalte hinzuzufügen.
