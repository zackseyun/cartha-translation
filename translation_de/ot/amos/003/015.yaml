  text: וְ/הִכֵּיתִ֥י בֵית הַ/חֹ֖רֶף עַל בֵּ֣ית הַ/קָּ֑יִץ וְ/אָבְד֞וּ בָּתֵּ֣י הַ/שֵּׁ֗ן וְ/סָפ֛וּ בָּתִּ֥ים רַבִּ֖ים נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/015.yaml
  text: And I will strike the winter house along with the summer house[a], and the houses of ivory will perish, and many houses will come to an end," declares Yahweh.
translation:
  language: de
  text: Und ich werde das Winterhaus mitsamt dem Sommerhaus schlagen; die Elfenbeinhäuser[a] werden zugrunde gehen, und viele Häuser werden ein Ende finden«, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Häuser aus Elfenbein“; wahrscheinlich sind luxuriöse Häuser gemeint, die mit Elfenbein verziert oder ausgelegt waren, nicht Häuser, die buchstäblich aus Elfenbein bestanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: Und ich werde … schlagen
  rationale: נכה bezeichnet hier Gottes strafendes Schlagen. „Schlagen“ bewahrt die Bildkraft, ohne die vollständige Zerstörung bereits in diesem ersten Verb vorwegzunehmen.
- source_word: בֵית הַחֹרֶף עַל בֵית הַקָּיִץ
  choice: das Winterhaus mitsamt dem Sommerhaus
  rationale: Die beiden Konstruktionen bezeichnen saisonal genutzte Wohnsitze. „Mitsamt“ gibt עַל hier als Verbindung beider vom Gericht betroffenen Häuser natürlich und prägnant wieder.
- source_word: וְאָבְדוּ
  choice: werden zugrunde gehen
  rationale: אבד hat hier den intransitiven Sinn „verloren gehen, zugrunde gehen“. Die Wiedergabe wahrt diesen Aspekt und die Aussage des Gerichts.
- source_word: בָּתֵּי הַשֵּׁן
  choice: die Elfenbeinhäuser
  rationale: Die knappe hebräische Metapher bleibt erhalten. Gemeint sind wahrscheinlich luxuriöse, mit Elfenbein verzierte Häuser; diese Erläuterung steht in der Fußnote.
- source_word: וְסָפוּ
  choice: werden ein Ende finden
  rationale: סוף bezeichnet hier das Zu-Ende-Kommen. Die Formulierung bleibt offen hinsichtlich der konkreten Art ihrer Vernichtung.
- source_word: בָּתִּים רַבִּים
  choice: viele Häuser
  rationale: רַבִּים wird seinem gewöhnlichen quantitativen Sinn entsprechend mit „viele“ wiedergegeben; „große Häuser“ wäre eine kontextuelle Deutung.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in würdigem, geläufigem Deutsch wiedergegeben; der Gottesname erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ gibt diesen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בָּתִּים רַבִּים
  choice: viele Häuser
  alternative: große Häuser
  rationale: Das Adjektiv bedeutet zunächst „viele“. Obwohl der Luxuskontext an bedeutende oder prächtige Häuser denken lässt, wird diese mögliche Folgerung nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Bezeichnungen „Winterhaus“ und „Sommerhaus“ sowie die markante Metapher „Elfenbeinhäuser“ bleiben erhalten; das Semikolon bildet die Folge der hebräischen Satzglieder übersichtlich ab.
