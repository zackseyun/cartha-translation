id: AMO.3.6
reference: Amos 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם יִתָּקַ֤ע שׁוֹפָר֙ בְּ/עִ֔יר וְ/עָ֖ם לֹ֣א יֶחֱרָ֑דוּ אִם תִּהְיֶ֤ה רָעָה֙ בְּ/עִ֔יר וַ/יהוָ֖ה לֹ֥א עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/006.yaml
  text: If a trumpet is blown in a city[a], do not the people tremble? If disaster happens in a city, has not Yahweh done it?
translation:
  language: de
  text: Wird in einer Stadt das Horn geblasen, ohne dass das Volk erschrickt? Geschieht in einer Stadt ein Unglück[a], ohne dass der HERR es getan hat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Unheil“. Das hebräische Wort kann auch „Böses“ bedeuten; hier bezeichnet es jedoch Unglück beziehungsweise Gericht, nicht moralische Bosheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתָּקַע שׁוֹפָר
  choice: das Horn geblasen
  rationale: שׁוֹפָר bezeichnet ein als Signal- oder Alarmgeber verwendetes Horn. „Horn“ ist im Deutschen knapp und quellennah; „geblasen“ gibt die Form des hebräischen Verbs natürlich wieder.
- source_word: בְּעִיר
  choice: in einer Stadt
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft. Der unbestimmte Ausdruck entspricht dem allgemeinen Beispielcharakter beider Fragen.
- source_word: וְעָם
  choice: das Volk
  rationale: Gemeint ist hier die Bevölkerung der genannten Stadt. „Das Volk“ bewahrt die knappe kollektive Ausdrucksweise des Hebräischen.
- source_word: יֶחֱרָדוּ
  choice: erschrickt
  rationale: חרד beschreibt angstvolle Unruhe, Aufschrecken oder Zittern. Beim Erklingen eines Alarmsignals ist „erschrickt“ im modernen Deutschen natürlich und bewahrt die Reaktion von Furcht und Bestürzung.
- source_word: רָעָה
  choice: Unglück
  rationale: רָעָה kann Böses, Unheil oder eine Katastrophe bezeichnen. Im Zusammenhang geht es um ein die Stadt treffendes Gerichtsgeschehen, nicht um moralische Bosheit.
- source_word: תִּהְיֶה
  choice: geschieht
  rationale: Das Verb היה bedeutet grundsätzlich „sein/werden“; zusammen mit רָעָה bezeichnet es hier das Eintreten eines Unglücks. „Geschieht“ ist knapp und idiomatisch.
- source_word: וַיהוָה
  choice: der HERR
  rationale: Der Gottesname יהוה wird nach der etablierten ehrfürchtigen deutschen Konvention als „der HERR“ wiedergegeben.
- source_word: עָשָׂה
  choice: es getan hat
  rationale: עשה ist das breite Verb „tun/machen“. Die bewusst direkte Wiedergabe „es getan hat“ bewahrt die scharfe Aussage über Gottes Handeln und schwächt sie nicht zu bloßer Zulassung ab.
theological_decisions:
- issue: Bedeutung von רָעָה im Zusammenhang mit dem Handeln des HERRN
  choice: „Unglück“ statt „Böses“
  alternative: „Unheil“, „Böses“
  rationale: Der Alarmvergleich und der Gerichtskontext weisen auf ein schädigendes Ereignis beziehungsweise Gericht hin, nicht auf moralische Bosheit. Die Übersetzung vermeidet daher eine irreführende moralische Aussage, ohne Gottes Gerichtshandeln abzuschwächen.
- issue: Göttliche Urheberschaft in der zweiten Frage
  choice: „ohne dass der HERR es getan hat?“
  alternative: „hat es dann nicht der HERR bewirkt?“ oder „ohne dass der HERR es herbeigeführt hat?“
  rationale: Der hebräische Text schreibt das Unglück unmittelbar dem Handeln des HERRN zu. Die knappe Formulierung erhält diese theologische Spannung und deutet sie weder als bloße Zulassung um noch erklärt sie über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen werden parallel mit „ohne dass“ formuliert; dadurch klingt der Vers natürlich, während die zwingende Folgerung des Hebräischen erhalten bleibt. „Horn“ hält das historische Bild fest, ohne durch eine ausführliche Sachbezeichnung den Satz zu beschweren.
