source:
  edition: WLC
  text: כִּ֣י לֹ֧א יַעֲשֶׂ֛ה אֲדֹנָ֥/י יְהוִ֖ה דָּבָ֑ר כִּ֚י אִם גָּלָ֣ה סוֹד֔/וֹ אֶל עֲבָדָ֖י/ו הַ/נְּבִיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/007.yaml
  text: For the Lord GOD does nothing unless he reveals his secret to his servants the prophets[a].
translation:
  language: de
  text: Denn der Herr Jahwe tut nichts, ohne sein Geheimnis seinen Dienern, den Propheten, zu offenbaren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen vertraulichen Ratschluss“ oder „seinen geheimen Plan“. Das hebräische Wort kann eine vertrauliche Beratung, einen geheimen Ratschluss oder eine geheime Angelegenheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet hier die vorausgehende Aussage; „Denn“ bildet diesen Zusammenhang im Deutschen natürlich ab.
- source_word: לֹא ... כִּי אִם
  choice: tut nichts, ohne ... zu
  rationale: Die Verbindung bezeichnet eine Ausnahme. Die deutsche Konstruktion bewahrt die Aussage, dass Gottes Handeln nicht ohne die genannte Offenbarung geschieht.
- source_word: יַעֲשֶׂה ... דָּבָר
  choice: tut nichts
  rationale: Wörtlich steht „tut eine Sache“ innerhalb einer Negativkonstruktion; „tut nichts“ ist die natürliche und genaue deutsche Wiedergabe.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  rationale: Die Wiedergabe bildet beide Bestandteile des zusammengesetzten Gottesnamens ab und lässt den Eigennamen JHWH als „Jahwe“ erkennbar.
- source_word: גָּלָה
  choice: offenbaren
  rationale: Das Verb bedeutet „aufdecken, enthüllen, offenbaren“; im Zusammenhang prophetischer Mitteilung ist „offenbaren“ angemessen.
- source_word: סוֹדוֹ
  choice: seinen vertraulichen Ratschluss
  rationale: סוֹד kann eine vertrauliche Beratung, einen geheimen Ratschluss oder eine geheime Angelegenheit bezeichnen. Die Formulierung wahrt die deliberative und vertrauliche Nuance, ohne sie auf einen systematisch-theologischen Begriff zu verengen.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: Im prophetischen Kontext bezeichnet עבד Menschen in Gottes beauftragtem Dienst; „Diener“ ist daher treffender als „Sklaven“.
- source_word: הַנְּבִיאִים
  choice: den Propheten
  rationale: Der bestimmte Plural wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die gewählte Form bewahrt sowohl den Titel אֲדֹנָי als auch den persönlichen Gottesnamen JHWH und vermeidet die im Deutschen schwer verständliche Verdoppelung „Herr HERR“.
- issue: Bedeutungsumfang von סוֹד
  choice: vertraulicher Ratschluss
  alternative: Geheimnis; geheimer Plan
  rationale: Die Übersetzung hält Vertraulichkeit und Beratung beziehungsweise Beschluss zusammen, ohne die Aussage vorschnell als umfassendes deterministisches Dekret auszulegen.
- issue: Zeitliches Verhältnis zwischen Handeln und Offenbarung
  choice: ohne ... zu offenbaren
  alternative: wenn er nicht zuvor ... offenbart hat
  rationale: Der hebräische Text drückt die Ausnahme deutlich aus, markiert „zuvor“ aber nicht ausdrücklich. Daher wird keine zusätzliche zeitliche Präzisierung in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Apposition „seinen Dienern, den Propheten“ folgt der hebräischen Struktur und bleibt gut verständlich; der Gottesname wird ausdrücklich wiedergegeben.
