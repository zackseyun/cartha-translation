source:
  edition: WLC
  text: הֲ/יִשְׁאַ֤ג אַרְיֵה֙ בַּ/יַּ֔עַר וְ/טֶ֖רֶף אֵ֣ין ל֑/וֹ הֲ/יִתֵּ֨ן כְּפִ֤יר קוֹל/וֹ֙ מִ/מְּעֹ֣נָת֔/וֹ בִּלְתִּ֖י אִם לָכָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/004.yaml
  text: Does a lion roar in the forest when it has no prey? Does a young lion raise its voice from its den unless it has caught something?[a][b]
translation:
  language: de
  text: Brüllt ein Löwe im Wald, wenn er keine Beute hat? Lässt ein junger Löwe aus seinem Versteck[a] seine Stimme hören, wenn er nichts gefangen hat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus seinem Lager“ beziehungsweise „aus seiner Höhle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wenn er nicht gefangen hat“. Das Objekt ist aus dem Zusammenhang zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁאַג
  choice: brüllt
  rationale: Das Verb bezeichnet den lauten Ruf eines Löwen; „brüllen“ ist dafür die natürliche deutsche Entsprechung.
- source_word: אַרְיֵה
  choice: Löwe
  rationale: Die direkte und kontextgerechte Wiedergabe der Tierbezeichnung.
- source_word: בַּיַּעַר
  choice: im Wald
  rationale: יַעַר bezeichnet gewöhnlich Wald oder Waldland; „im Wald“ ist klar und idiomatisch.
- source_word: טֶרֶף
  choice: Beute
  rationale: Das Substantiv bezeichnet Jagdbeute beziehungsweise erbeutete Nahrung; „Beute“ passt zur Löwenmetaphorik.
- source_word: אֵין לוֹ
  choice: wenn er keine ... hat
  rationale: Die hebräische Existenzkonstruktion drückt hier idiomatisch das Fehlen von Beute aus.
- source_word: כְּפִיר
  choice: junger Löwe
  rationale: Das Wort bezeichnet einen jungen, bereits kräftigen Löwen, nicht notwendig ein kleines Löwenjunges.
- source_word: יִתֵּן קוֹלוֹ
  choice: lässt ... seine Stimme hören
  rationale: Die Wendung bedeutet wörtlich „seine Stimme geben“ und bezeichnet das Ertönenlassen der Stimme; die gewählte Form bleibt bildnah und ist im Deutschen verständlich.
- source_word: מִמְּעֹנָתוֹ
  choice: aus seinem Versteck
  rationale: מְעוֹנָה bezeichnet hier den Aufenthalts- oder Zufluchtsort des Tieres. „Versteck“ ist natürlich; „Lager“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: בִּלְתִּי אִם
  choice: wenn ... nicht
  rationale: Die Verbindung führt eine ausschließende Bedingung ein; im deutschen Fragesatz ist „wenn ... nicht“ idiomatisch und entspricht funktional „es sei denn“.
- source_word: לָכָד
  choice: nichts gefangen hat
  rationale: Das Verb bedeutet „fangen/ergreifen“. Das im Hebräischen ausgelassene Objekt wird aus dem Beutekontext als unbestimmtes „etwas“ verstanden; in der negierten deutschen Frage ergibt sich idiomatisch „nichts“.
