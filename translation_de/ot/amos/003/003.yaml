  text: הֲ/יֵלְכ֥וּ שְׁנַ֖יִם יַחְדָּ֑ו בִּלְתִּ֖י אִם נוֹעָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/003.yaml
  text: Do two walk together unless they have agreed to meet?[a]
translation:
  language: de
  text: Gehen zwei miteinander, ohne dass sie sich verabredet haben?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne dass sie ein Treffen vereinbart haben“. Das hebräische Verb bezeichnet eine vorherige Verabredung oder Vereinbarung zu einem Zusammentreffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵלְכוּ
  choice: Gehen …?
  rationale: Das interrogative הֲ mit dem Imperfekt von הלך bildet hier eine rhetorische Frage mit allgemeingültigem, sprichwortartigem Sinn. Das deutsche Präsens gibt diesen Sinn natürlich wieder.
- source_word: שְׁנַיִם
  choice: zwei
  rationale: Die Kardinalzahl bezeichnet schlicht zwei Personen; eine nähere Bestimmung ist im Deutschen nicht nötig.
- source_word: יַחְדָּו
  choice: miteinander
  rationale: Das Adverb bedeutet „zusammen, gemeinsam“. In Verbindung mit „gehen“ klingt „miteinander“ im Deutschen natürlich und knapp.
- source_word: בִּלְתִּי אִם
  choice: ohne dass
  rationale: Die Wortverbindung bezeichnet eine ausschließende Bedingung. In der deutschen rhetorischen Frage gibt „ohne dass“ das idiomatisch und klar wieder.
- source_word: נוֹעָדוּ
  choice: sie sich verabredet haben
  rationale: Die Niphal-Form von יעד kann eine gegenseitige Verabredung beziehungsweise ein vereinbartes Zusammentreffen bezeichnen. „Sich verabreden“ bewahrt diese reziproke Bedeutung, ohne den Anlass näher festzulegen.
