source:
  edition: WLC
  text: כִּ֗י בְּ/י֛וֹם פָּקְדִ֥/י פִשְׁעֵֽי יִשְׂרָאֵ֖ל עָלָ֑י/ו וּ/פָֽקַדְתִּי֙ עַל מִזְבְּח֣וֹת בֵּֽית אֵ֔ל וְ/נִגְדְּעוּ֙ קַרְנ֣וֹת הַ/מִּזְבֵּ֔חַ וְ/נָפְל֖וּ לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/014.yaml
  text: For on the day when I punish Israel for his transgressions[a], I will also punish the altars of Bethel[b]; the horns of the altar will be cut off and fall to the ground.
translation:
  language: de
  text: Denn an dem Tag, an dem ich Israel für seine Vergehen zur Rechenschaft ziehe[a], werde ich auch die Altäre von Bethel bestrafen. Die Hörner des Altars[b] werden abgeschlagen und fallen zu Boden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ich Israel wegen seiner Auflehnungen heimsuche“. Das hebräische Verb kann „aufsuchen“ beziehungsweise „sich jemandem zuwenden“ bedeuten und bezeichnet hier ein Eingreifen, durch das Gott zur Rechenschaft zieht oder bestraft.'
    reason: lexical_alternative
  - marker: b
    text: Die „Hörner“ waren hornartige Vorsprünge an den Ecken des Altars und mit seiner Heiligkeit und seinem gottesdienstlichen Gebrauch verbunden.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Gerichtsankündigung ein.
- source_word: בְּיוֹם
  choice: an dem Tag, an dem
  rationale: Bewahrt die hebräische Zeitangabe und führt den folgenden Infinitivsatz in natürlichem Deutsch ein.
- source_word: פָּקְדִי / וּפָקַדְתִּי עַל
  choice: zur Rechenschaft ziehe / zur Rechenschaft ziehen
  rationale: פקד bezeichnet hier ein zur Verantwortung ziehendes Eingreifen Gottes. Die Wiederholung derselben deutschen Wendung erhält die bewusste Verknüpfung zwischen dem Gericht über Israel und dem über die Altäre.
- source_word: פִשְׁעֵי
  choice: Vergehen
  rationale: Gibt schuldhafte Übertretungen und Auflehnung gegen rechtmäßige Autorität wieder, ohne den Ausdruck unnötig konfessionell einzuengen.
- source_word: יִשְׂרָאֵל עָלָיו
  choice: Israel für seine Vergehen
  rationale: Die Präposition mit singularischem Suffix bezeichnet Israel als den vom Gericht Betroffenen. Das Pronomen „seine“ wahrt die personale Darstellung des als Einheit aufgefassten Volkes.
- source_word: מִזְבְּחוֹת בֵּית אֵל
  choice: die Altäre von Bethel
  rationale: Gibt die Constructusverbindung direkt und in heutigem Deutsch verständlich wieder.
- source_word: וְנִגְדְּעוּ
  choice: werden abgeschlagen
  rationale: גדע bezeichnet ein gewaltsames Abtrennen oder Abhauen. „Abgeschlagen“ passt zu den festen, hornartigen Vorsprüngen des Altars.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: die Hörner des Altars
  rationale: Bewahrt die konkrete kultische Bezeichnung, statt sie durch eine erklärende Umschreibung zu verflachen.
- source_word: וְנָפְלוּ לָאָרֶץ
  choice: und fallen zu Boden
  rationale: Natürliche deutsche Wiedergabe der räumlichen Folge des Abschlagens.
theological_decisions:
- issue: Singularische Bezugnahme auf das Volk Israel
  choice: Israel für seine Vergehen
  alternative: Israel für dessen Vergehen
  rationale: Das Hebräische behandelt „Israel“ als singularische, personale Größe. „Seine“ bewahrt diese prophetisch-bundestheologische Personalisierung, ohne über den Wortlaut hinauszugehen.
- issue: Wiedergabe des kultischen Bildes
  choice: die Hörner des Altars
  alternative: die hornartigen Vorsprünge des Altars
  rationale: Die Hörner sind konkrete Bestandteile des Altars und tragen zugleich kultische Bedeutung. Die wörtliche Wiedergabe wahrt das Bild; die Fußnote erklärt die Sachkultur.
- issue: Bedeutungsumfang von פקד im Gerichtskontext
  choice: zur Rechenschaft ziehen
  alternative: heimsuchen / bestrafen
  rationale: Die gewählte Formulierung macht den gerichtlichen Sinn verständlich, lässt aber den Grundgedanken des prüfenden Eingreifens stärker erkennen als das enger festgelegte „bestrafen“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Verwendung von פקד wird durch die Wiederholung von „zur Rechenschaft ziehen“ sichtbar gehalten. Die kultische Fachbezeichnung „Hörner des Altars“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
