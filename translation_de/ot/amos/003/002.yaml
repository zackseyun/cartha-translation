  source_fidelity: Der Haupttext gibt die Exklusivität von רַק, die relationale Grundbedeutung von ידע und die gerichtliche Aussage von פקד angemessen wieder. »Von allen« ist jedoch weniger präzise als die vergleichende/aussondernde Wendung »unter allen« bzw. »aus allen«; »unter allen Familien« bildet מִכֹּל מִשְׁפְּחוֹת klarer ab.
  naturalness: »Sippen« ist verständlich, wirkt im modernen Standarddeutsch aber unnötig archaisierend und kann enger als die hier gemeinten gesellschaftlich-ethnischen Gruppen verstanden werden. »Familien« ist die naheliegende, quellennähere und im biblischen Register natürliche Entsprechung. Die Revision bleibt würdevoll und gut lesbar.
  terminology: »gekannt« bewahrt die absichtlich nicht weiter spezifizierte hebräische Formulierung; die Fußnote erläutert die mögliche bundesbezogene Nuance, ohne sie dem Haupttext aufzuzwingen. »Vergehen« und »zur Rechenschaft ziehen« vermitteln die gerichtliche Dimension von עָוֹן und פקד angemessen. Die Fußnote zu פקד wird als tatsächlich wörtliche Alternative formuliert und trennt diese von der im Haupttext ausgedrückten Folgerung.
