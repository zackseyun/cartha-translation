source:
  edition: WLC
  text: רַ֚ק אֶתְ/כֶ֣ם יָדַ֔עְתִּי מִ/כֹּ֖ל מִשְׁפְּח֣וֹת הָ/אֲדָמָ֑ה עַל כֵּן֙ אֶפְקֹ֣ד עֲלֵי/כֶ֔ם אֵ֖ת כָּל עֲוֺנֹֽתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/002.yaml
  text: You only have I known from among all the families of the earth[b][a]; therefore I will punish you for all your iniquities.
translation:
  language: de
  text: Nur euch habe ich unter allen Familien der Erde gekannt.[a] Darum werde ich euch für all eure Vergehen zur Rechenschaft ziehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nur euch habe ich unter allen Familien der Erde erwählt/anerkannt.« Das hebräische Wort für »kennen« kann hier eine besondere bundesbezogene Beziehung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ich werde an euch alle eure Vergehen heimsuchen«, das heißt: Ich werde euch dafür zur Rechenschaft ziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: nur
  rationale: Das vorangestellte »nur« gibt die betonte Ausschließlichkeit des hebräischen Ausdrucks knapp und natürlich wieder.
- source_word: יָדַעְתִּי
  choice: habe ich … gekannt
  rationale: Die Grundbedeutung »kennen« bleibt erhalten. Im Zusammenhang bezeichnet das Verb eine besondere, von Beziehung und Bund geprägte Anerkennung; diese Bedeutung wird nicht vorschnell durch »erwählt« festgelegt.
- source_word: מִכֹּל מִשְׁפְּחוֹת הָאֲדָמָה
  choice: von allen Sippen der Erde
  rationale: »Sippen« bezeichnet hier größere verwandtschaftlich und ethnisch verbundene Gruppen. »Erde« ist im Kontext umfassender und passender als das örtlich begrenzte »Land«.
- source_word: עַל־כֵּן
  choice: darum
  rationale: »Darum« stellt in natürlichem Deutsch den folgerichtigen Zusammenhang zwischen Israels besonderer Beziehung zu Gott und seiner Verantwortung im Gericht her.
- source_word: אֶפְקֹד עֲלֵיכֶם
  choice: werde ich euch … zur Rechenschaft ziehen
  rationale: Im Gerichtszusammenhang bedeutet פקד, jemanden wegen seiner Taten zur Verantwortung zu ziehen. Die Formulierung ist verständlich, gegenwärtig und bewahrt den gerichtlichen Nachdruck.
- source_word: עֲוֺנֹתֵיכֶם
  choice: all eure Vergehen
  rationale: »Vergehen« bringt den moralischen und rechtlichen Gehalt von עָוֹן zum Ausdruck, ohne unnötig altertümlich zu wirken; »all« entspricht ausdrücklich dem hebräischen כָּל.
theological_decisions:
- issue: Bundesbezogene Bedeutung von יָדַע
  choice: Im Haupttext bleibt die Grundbedeutung »kennen« stehen; die besondere bundesbezogene Anerkennung wird in einer Fußnote erläutert.
  alternative: »Nur euch habe ich erwählt« oder »nur euch habe ich anerkannt«
  rationale: Der Vers spricht von Israels einzigartiger Beziehung zu Gott, verwendet aber das Verb »kennen«. Die gewählte Fassung bewahrt die sprachliche und theologische Spannung, ohne die Bedeutung auf einen einzelnen dogmatischen Begriff einzuengen.
- issue: Gerichtliche Bedeutung von פקד
  choice: »zur Rechenschaft ziehen«
  alternative: »heimsuchen« oder »bestrafen«
  rationale: Im Zusammenhang kündigt der Ausdruck Gericht wegen der Vergehen an. »Zur Rechenschaft ziehen« macht sowohl die Verantwortlichkeit als auch die drohende gerichtliche Folge deutlich; die wörtlichere Wendung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Aussage »nur euch … gekannt« bleibt bewusst erhalten, damit die Mehrdeutigkeit des hebräischen Verbs sichtbar bleibt; die Fußnote erschließt den beziehungs- und bundesbezogenen Sinn. »Zur Rechenschaft ziehen« vermeidet das heute altertümlich wirkende »heimsuchen«, ohne den Gerichtscharakter abzuschwächen.
