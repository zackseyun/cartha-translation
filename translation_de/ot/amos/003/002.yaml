revisions:
- from: Nur euch habe ich von allen Sippen der Erde gekannt.[a] Darum werde ich euch für all eure Vergehen zur Rechenschaft ziehen.[b]
  to: Nur euch habe ich unter allen Familien der Erde gekannt.[a] Darum werde ich euch für all eure Vergehen zur Rechenschaft ziehen.[b]
  rationale: Die Revision ersetzt die leicht weniger genaue und etwas altertümliche Verbindung »von allen Sippen« durch »unter allen Familien«. Damit bleibt die Exklusivität der Erwählungsbeziehung ebenso erhalten wie die offene, relationale Bedeutung von »gekannt«. Die Fußnote zu פקד wurde zu einer klar abgegrenzten, quellengetreuen wörtlichen Alternative bereinigt. Bedeutung, Register und die vorhandenen Fußnotenanker bleiben erhalten.
