source:
  edition: WLC
  text: הַשְׁמִ֨יעוּ֙ עַל אַרְמְנ֣וֹת בְּ/אַשְׁדּ֔וֹד וְ/עַֽל אַרְמְנ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אִמְר֗וּ הֵאָֽסְפוּ֙ עַל הָרֵ֣י שֹׁמְר֔וֹן וּ/רְא֞וּ מְהוּמֹ֤ת רַבּוֹת֙ בְּ/תוֹכָ֔/הּ וַ/עֲשׁוּקִ֖ים בְּ/קִרְבָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/009.yaml
  text: Proclaim to the citadels of Ashdod and to the citadels in the land of Egypt[a], and say, “Assemble on the mountains of Samaria, and see the many tumults within her[d][c][b], and the oppressed in her midst.”
translation:
  language: de
  text: 'Verkündet es auf den Palästen in Aschdod[a] und auf den Palästen im Land Ägypten und sagt: »Versammelt euch auf den Bergen Samarias[b] und seht die vielen Unruhen in ihrer Mitte[c] und die Unterdrückten in ihrem Inneren[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zitadellen« oder »befestigten Herrschaftssitzen«. Das hebräische Wort kann große, repräsentative und befestigte Gebäude bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf den Hügeln Samarias«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »die vielen Wirren« oder »die vielen Tumulte«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »die Unterdrückungstaten«. Die hebräische Form wird hier als Bezeichnung unterdrückter Menschen verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  choice: Ruft es … aus
  rationale: Der Hifil-Imperativ bezeichnet hier eine öffentliche Bekanntmachung. Die deutsche Wendung wahrt Aufforderungscharakter und prophetischen Ton.
- source_word: אַרְמְנוֹת
  choice: Paläste
  rationale: Das Wort bezeichnet große, repräsentative und oft befestigte Herrschaftssitze. „Paläste“ ist im Deutschen natürlich; die mögliche Bedeutung „Zitadellen“ wird in einer Fußnote erhalten.
- source_word: בְּאַשְׁדּוֹד
  choice: über den Palästen in Aschdod
  rationale: Die Präposition ב ist örtlich zu verstehen. Mit הַשְׁמִיעוּ und עַל gibt „über … ausrufen“ die öffentliche Verkündigung an den dortigen Herrschaftssitzen wieder.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die volle hebräische Wendung bleibt erhalten und trägt zum feierlich-prophetischen Rhythmus bei.
- source_word: הֵאָסְפוּ
  choice: Versammelt euch
  rationale: Der Nifal-Imperativ ruft die angesprochenen Beobachter dazu auf, sich an einem Ort einzufinden.
- source_word: הָרֵי שֹׁמְרוֹן
  choice: den Bergen Samarias
  rationale: הַר kann je nach Gelände Berg oder Hügel bezeichnen. „Berge“ ist die direkte Wiedergabe; „Hügel“ bleibt als Alternative vermerkt.
- source_word: מְהוּמֹת רַבּוֹת
  choice: die große Unruhe
  rationale: מְהוּמָה bezeichnet Aufruhr, Verwirrung oder Unruhe. Das pluralische רַבּוֹת kann idiomatisch die große Fülle bzw. Intensität des Zustands ausdrücken; eine pluralische Alternative wird dokumentiert.
- source_word: בְּתוֹכָהּ
  choice: in seiner Mitte
  rationale: Das Suffix bezieht sich auf die Stadt Samaria. Da Städtenamen im heutigen Deutschen gewöhnlich sächlich behandelt werden, steht „seiner“ statt einer künstlichen weiblichen Personifizierung.
- source_word: עֲשׁוּקִים
  choice: die Unterdrückten
  rationale: Die Form lässt sich am natürlichsten als substantiviertes passives Partizip verstehen und bezeichnet damit unterdrückte Menschen. Die abstrakte Deutung als Unterdrückungstaten bleibt in einer Fußnote sichtbar.
- source_word: בְּקִרְבָּהּ
  choice: in seinem Inneren
  rationale: Die Wendung bezeichnet erneut den Innenraum der Stadt; die leicht variierte Formulierung bildet die Variation gegenüber בְּתוֹכָהּ ab.
theological_decisions:
- issue: Was in Samaria zu sehen ist
  choice: Soziale Unruhe und unterdrückte Menschen
  alternative: Unruhe und Unterdrückungstaten als abstrakte Zustände oder Handlungen
  rationale: עֲשׁוּקִים ist formal am ehesten substantivisch als Bezeichnung betroffener Menschen zu lesen. Dadurch werden die Opfer des Unrechts sichtbar, ohne die grammatisch mögliche abstraktere Deutung zu verschweigen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem prophetischem Ton. Der parallele Satzbau und die räumlichen Wendungen des Hebräischen bleiben erkennbar, ohne im Deutschen hölzern zu wirken.
