source:
  edition: WLC
  text: וְ/לֹֽא יָדְע֥וּ עֲשׂוֹת נְכֹחָ֖ה נְאֻם יְהוָ֑ה הָ/אֽוֹצְרִ֛ים חָמָ֥ס וָ/שֹׁ֖ד בְּ/אַרְמְנֽוֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/010.yaml
  text: They do not know how to do what is right—oracle of Yahweh—those who store up violence and destruction in their citadels[a][b].
translation:
  language: de
  text: Sie wissen nicht, das Rechte zu tun – Spruch Jahwes –, sie, die Gewalt und Verwüstung in ihren Palästen anhäufen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Raub“ statt „Verwüstung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Festungen“ statt „Palästen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדְעוּ
  choice: sie wissen nicht
  rationale: ידע bezeichnet Wissen oder Verstehen; zusammen mit dem Infinitiv עֲשׂוֹת wird hier ihre eingeübte moralische Unfähigkeit beziehungsweise Unkenntnis angeklagt.
- source_word: עֲשׂוֹת נְכֹחָה
  choice: wie man tut, was recht ist
  rationale: נְכֹחָה bezeichnet Geradheit, Aufrichtigkeit und rechtes Handeln. Die Formulierung ist im Deutschen verständlich und bewahrt den Bezug des Infinitivs auf praktisches Tun.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine formelhafte prophetische Kennzeichnung göttlicher Rede; „Ausspruch“ erhält ihren feierlichen und formalen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: הָאֹצְרִים
  choice: die … anhäufen
  rationale: Das Partizip von אצר bezeichnet fortgesetztes Sammeln oder Aufspeichern. „anhäufen“ passt natürlich zu den durch Unrecht angesammelten Gütern beziehungsweise Zuständen.
- source_word: חָמָס
  choice: Gewalt
  rationale: חָמָס bezeichnet gewaltsames Unrecht, Unterdrückung oder Gewalt; „Gewalt“ ist hier die direkte prophetische Anklage.
- source_word: שֹׁד
  choice: Verwüstung
  rationale: שֹׁד kann Verwüstung, Zerstörung oder Raub bezeichnen. „Verwüstung“ erhält den zerstörerischen Sinn, während „Raub“ als plausible Alternative ausgewiesen wird.
- source_word: בְּאַרְמְנוֹתֵיהֶם
  choice: in ihren Festungen
  rationale: אַרְמוֹן kann Palast, befestigten Herrschersitz oder Zitadelle bezeichnen. „Festungen“ betont hier die gesicherten Machtzentren; „Paläste“ bleibt eine plausible Alternative.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen. Die Transliteration bewahrt diesen, statt ihn stillschweigend durch einen Titel zu ersetzen.
- issue: Moralische Unfähigkeit oder bloße Unkenntnis
  choice: Sie wissen nicht, wie man tut, was recht ist
  alternative: Sie wissen nicht, was recht ist
  rationale: Die Verbindung von ידע mit עֲשׂוֹת richtet den Vorwurf auf rechtes Handeln, nicht nur auf fehlendes Wissen. Die gewählte Fassung bewahrt diese ethische Spannung, ohne eine umfassende Lehre moralischer Unfähigkeit in den Satz hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-formalem Einschub. Die markierte Wiederaufnahme „sie, die …“ bildet die hebräische partizipiale Apposition ab. Beide Fußnotenmarker stehen im Haupttext.
