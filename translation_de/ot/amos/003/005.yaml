base_translation:
  language: en
  yaml_path: translation/ot/amos/003/005.yaml
  text: Does a bird fall into a trap on the ground when there is no snare for it? Does a trap spring up from the ground when it has caught nothing at all?[a][b]
translation:
  language: de
  text: Fällt ein Vogel in eine Falle auf dem Boden, wenn kein Köder für ihn da ist?[a] Schnellt eine Falle vom Boden hoch, ohne etwas zu fangen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn kein Fangmittel oder Auslöser für ihn da ist«. Das mit »Köder« wiedergegebene hebräische Wort kann auch das Fangmittel oder den Mechanismus bezeichnen, der die Falle auslöst.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und zu fangen fängt sie nicht«. Die hebräische Konstruktion ist nachdrücklich und bedeutet: »ohne irgendetwas zu fangen« oder »ohne wirklich etwas zu fangen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִפֹּל
  choice: fällt … in
  rationale: Das Verb נפל bedeutet grundsätzlich »fallen«. In Verbindung mit einer Falle gibt »in eine Falle fallen« das Bild im Deutschen natürlich wieder, ohne es zum bloßen »gefangen werden« umzudeuten.
- source_word: צִפּוֹר
  choice: Vogel
  rationale: Das Wort bezeichnet hier allgemein einen Vogel, nicht nachweisbar eine bestimmte Vogelart.
- source_word: פַּח
  choice: Falle
  rationale: פַּח bezeichnet eine Fangvorrichtung für Vögel oder andere Tiere. »Falle« ist im heutigen Deutsch klar und passt zu beiden Vorkommen.
- source_word: הָאָרֶץ
  choice: am Boden
  rationale: Im konkreten Jagdbild ist der Erdboden gemeint; »am Boden« klingt natürlicher als »auf der Erde«.
- source_word: מוֹקֵשׁ
  choice: Fangmittel
  rationale: Der Ausdruck kann die zum Fangen dienende Vorrichtung, den Köder oder den Auslöser bezeichnen. »Fangmittel« hält diese Bedeutungsbreite offen und unterscheidet das Wort von פַּח (»Falle«).
- source_word: אֵין לָהּ
  choice: wenn kein Fangmittel für ihn da ist
  rationale: Die Formulierung gibt die verneinte Existenz und das feminine Suffix wieder, das sich sinngemäß auf den Vogel bezieht; im Deutschen ist »Vogel« maskulin.
- source_word: יַעֲלֶה
  choice: schnellt … hoch
  rationale: עלה bedeutet »hinaufgehen, aufsteigen«. Bei einer ausgelösten Falle vermittelt »hochschnellen« die konkrete Bewegung anschaulich und idiomatisch.
- source_word: הָאֲדָמָה
  choice: vom Boden
  rationale: אֲדָמָה bezeichnet hier den Erdboden, von dem die Falle hochschnellt.
- source_word: וְלָכוֹד לֹא יִלְכּוֹד
  choice: ohne auch nur irgendetwas zu fangen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb hebt das Fangen beziehungsweise dessen Ausbleiben nachdrücklich hervor. Die deutsche Wendung bewahrt diesen emphatischen Sinn.
