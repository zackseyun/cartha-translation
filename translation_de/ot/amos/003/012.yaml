source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ כַּ/אֲשֶׁר֩ יַצִּ֨יל הָ/רֹעֶ֜ה מִ/פִּ֧י הָ/אֲרִ֛י שְׁתֵּ֥י כְרָעַ֖יִם א֣וֹ בְדַל אֹ֑זֶן כֵּ֣ן יִנָּצְל֞וּ בְּנֵ֣י יִשְׂרָאֵ֗ל הַ/יֹּֽשְׁבִים֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/פְאַ֥ת מִטָּ֖ה וּ/בִ/דְמֶ֥שֶׁק עָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/012.yaml
  text: 'Thus says Yahweh: As the shepherd rescues from the mouth of the lion two legs or a piece of an ear[b][a], so will the sons of Israel who dwell in Samaria be rescued—with the corner of a bed and the cover of a couch.'
translation:
  language: de
  text: 'So spricht Jahwe: Wie der Hirte aus dem Rachen des Löwen zwei Beine oder ein Stück von einem Ohr rettet, so werden die Israeliten[a], die in Samaria wohnen, gerettet – mit der Ecke eines Bettes und mit dem Diwan von Damaskus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung ist schwer verständlich. Wörtlich steht im Hebräischen etwa: »mit der Ecke eines Bettes und mit dem Diwan von Damaskus«. Möglich sind auch Deutungen wie »mit dem Bezug eines Diwans«, »mit einem damaszenischen Diwan« oder »auf einem Diwan in Damaskus«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Wie ... so
  rationale: Bewahrt die ausdrückliche Vergleichsstruktur des Hebräischen in natürlichem Deutsch.
- source_word: יַצִּיל / יִנָּצְלוּ
  choice: rettet / werden ... gerettet werden
  rationale: Erhält die lexikalische Verbindung beider Formen von נצל und den prophetischen Zukunftsbezug.
- source_word: מִפִּי הָאֲרִי
  choice: aus dem Rachen des Löwen
  rationale: Der wörtliche Ausdruck »aus dem Mund« bezeichnet im Bild den Rachen; diese Wiedergabe ist anschaulich und idiomatisch.
- source_word: שְׁתֵּי כְרָעַיִם
  choice: zwei Unterschenkel
  rationale: כְרָעַיִם bezeichnet hier die unteren Teile der Tierbeine; »Unterschenkel« macht die dürftigen Überreste präziser sichtbar als das allgemeinere »Beine«.
- source_word: בְדַל אֹזֶן
  choice: ein Stück von einem Ohr
  rationale: בְדַל bezeichnet ein abgetrenntes Stück oder Fragment; die Formulierung bewahrt das drastische Bild.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Gibt die feste hebräische Volksbezeichnung im modernen Deutschen natürlich und sachlich wieder; die formale Alternative wird in einer Fußnote genannt.
- source_word: הַיֹּשְׁבִים בְּשֹׁמְרוֹן
  choice: die in Samaria wohnen
  rationale: Entspricht dem Partizip und wahrt einen würdigen prophetischen Ton.
- source_word: בִּפְאַת מִטָּה
  choice: mit der Ecke eines Bettes
  rationale: Bleibt eng am schwierigen hebräischen Wortlaut und vermeidet eine unbelegte Auflösung der Präposition oder des Bildes.
- source_word: וּבִדְמֶשֶׁק עָרֶשׂ
  choice: und mit dem Diwan von Damaskus
  rationale: Bewahrt die masoretische Lesung דמשק als »Damaskus« und unterscheidet עָרֶשׂ als Ruhe- beziehungsweise Luxusmöbel vom zuvor genannten Bett. Die Unsicherheit wird offengelegt.
theological_decisions:
- issue: Umfang der angekündigten Rettung
  choice: Das Bild einer äußerst dürftigen Rettung bleibt unverändert stehen.
  alternative: Die Aussage allgemein als Verheißung eines überlebenden Restes glätten.
  rationale: Die vom Löwen zurückgeholten Körperteile sind kaum mehr als Beweisstücke des Verlusts. Der Gerichtston und die Spannung zwischen »Rettung« und nahezu vollständiger Vernichtung dürfen nicht abgeschwächt werden.
- issue: Deutung der dunklen Schlusswendung
  choice: Die masoretische Lesung wird im Haupttext möglichst formal bewahrt; plausible Deutungen stehen in der Fußnote.
  alternative: Im Haupttext eindeutig »mit dem Bezug eines Diwans«, »auf einem damaszenischen Diwan« oder »auf einem Diwan in Damaskus« schreiben.
  rationale: Der hebräische Wortlaut ist syntaktisch und lexikalisch unsicher. Keine der vorgeschlagenen Auflösungen sollte ohne Kennzeichnung als sicher präsentiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an die Bildsprache und Satzstruktur des Hebräischen. Der Gottesname erscheint als »Jahwe«. Die schwer verständliche Schlusswendung wird nicht stillschweigend geglättet; der Haupttext folgt dem masoretischen Wortlaut, die wichtigsten Alternativen werden transparent in der Fußnote genannt.
