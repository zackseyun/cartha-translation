  text: אַרְיֵ֥ה שָׁאָ֖ג מִ֣י לֹ֣א יִירָ֑א אֲדֹנָ֤/י יְהוִה֙ דִּבֶּ֔ר מִ֖י לֹ֥א יִנָּבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/008.yaml
  text: A lion has roared—who will not fear? The Lord GOD has spoken—who will not prophesy?[a][b]
translation:
  language: de
  text: Ein Löwe hat gebrüllt – wer sollte sich nicht fürchten? Der Herr, Jahwe, hat gesprochen[a] – wer sollte nicht prophetisch reden?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Adonaj JHWH“ („Herr Jahwe“).'
    reason: alternative_reading
  - marker: b
    text: 'Sinngemäß auch: „Wer kann anders, als prophetisch zu reden?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: ein Löwe
  rationale: Die gewöhnliche Bezeichnung für einen Löwen; der im Hebräischen nicht markierte unbestimmte Sinn wird im Deutschen natürlich mit dem unbestimmten Artikel wiedergegeben.
- source_word: שָׁאָג
  choice: hat gebrüllt
  rationale: Das Qal-Perfekt bezeichnet das bereits erfolgte Brüllen. Das deutsche Perfekt bewahrt dessen unmittelbare Wirkung auf die folgende Reaktion.
- source_word: מִי לֹא יִירָא
  choice: wer sollte sich nicht fürchten?
  rationale: Die rhetorische Frage erwartet, dass jeder sich fürchtet. „Sollte“ gibt die modale Kraft des Imperfekts idiomatisch wieder, ohne die Aussage auf eine bloß zukünftige Reaktion festzulegen.
- source_word: אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  rationale: Die im Deutschen geläufige Wiedergabe des zusammengesetzten Gottesnamens vermeidet das missverständliche „Herr HERR“. Die Großschreibung von GOTT signalisiert, dass hier der Gottesname JHWH wiedergegeben wird; eine Fußnote nennt die hebräische Form.
- source_word: דִּבֶּר
  choice: hat gesprochen
  rationale: Das Piel-Perfekt wird parallel zu „hat gebrüllt“ als deutsches Perfekt wiedergegeben und erhält so die enge Analogie zwischen Löwenbrüllen und Gottesrede.
- source_word: מִי לֹא יִנָּבֵא
  choice: wer sollte nicht als Prophet reden?
  rationale: Die Form von נבא bezeichnet prophetisches Reden. „Als Prophet reden“ ist im heutigen Deutsch klarer als „weissagen“, das leicht nur als Zukunftsvorhersage verstanden wird, und bewahrt die rhetorische Parallelität.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in אֲדֹנָי יְהוִה
  choice: GOTT, der Herr
  alternative: der Herr Jahwe
  rationale: Die Hauptfassung folgt einer etablierten deutschen Konvention für den zusammengesetzten Titel und kennzeichnet durch GOTT den zugrunde liegenden Gottesnamen. Die alternative, lautnahe Wiedergabe bleibt in der Fußnote sichtbar, sodass der Eigenname nicht verschleiert wird.
- issue: Zwangsläufigkeit des prophetischen Redens nach Gottes Wort
  choice: 'rhetorische Frage: „wer sollte nicht als Prophet reden?“'
  alternative: „wer kann anders, als prophetisch zu reden?“
  rationale: Die Hauptfassung bewahrt die Form und Spannung der hebräischen rhetorischen Frage. Die Alternative verdeutlicht den implizierten unausweichlichen Zusammenhang stärker, fügt aber eine modale Aussage hinzu und wird deshalb nur in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Perfektsätze und rhetorischen Fragen bilden die knappe Ursache-Wirkungs-Struktur des Hebräischen nach. „Als Prophet reden“ vermeidet die mögliche Verengung von „weissagen“ auf Zukunftsvorhersagen.
