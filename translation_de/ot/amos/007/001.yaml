  to: 'Dies zeigte mir der Herr Yahweh: Siehe, er war dabei, Heuschrecken zu bilden, als der Spätwuchs[a] gerade aufzugehen begann. Und siehe: Da war der Spätwuchs nach dem Mähen des Königs[b].'
  rationale: 'Die Überarbeitung beschränkt sich auf zwei sichere Verbesserungen: Der fortdauernde Charakter des hebräischen Partizips wird ausdrücklich wiedergegeben, und die zweite Präsentationsformel wird im Deutschen idiomatischer gefasst. Die problematische, semantisch engere Fußnotenalternative „Spätfrucht“ wird entfernt. Die Deutung der königlichen Schnitte bleibt weiterhin als wahrscheinlich gekennzeichnet.'
