  naturalness: Der Text ist weitgehend modernes, würdiges Standarddeutsch. „Er war dabei, Heuschrecken zu bilden“ gibt den Verlaufsaspekt verständlich wieder. „Als der Spätwuchs gerade aufzugehen begann“ ist natürlich und bezeichnet den Anfang des Wachstums. „Da war der Spätwuchs“ ist nach dem zweiten „Siehe“ weniger steif als „es war der Spätwuchs“.
  terminology: „Der Herr Yahweh“ bildet den Titel אֲדֹנָי יְהוִה mit „Herr“ und „Yahweh“ transparent ab und stimmt mit der vorgegebenen Namensentscheidung überein. „Heuschrecken“ und „Spätwuchs“ sind angemessen. Die Fußnoten bewahren die lexikalische beziehungsweise kulturgeschichtliche Unsicherheit; „Spätfrucht“ ist als Alternative allerdings weniger treffend, weil לקש hier Bewuchs/Aufwuchs, nicht ausdrücklich Frucht, bezeichnet.
