source:
  edition: WLC
  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּה֙ יוֹצֵ֣ר גֹּבַ֔י בִּ/תְחִלַּ֖ת עֲל֣וֹת הַ/לָּ֑קֶשׁ וְ/הִ֨נֵּה לֶ֔קֶשׁ אַחַ֖ר גִּזֵּ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], he was forming locusts at the beginning of the spring crop''s coming up, and behold[b], it was the spring crop after the king''s mowings.'
translation:
  language: de
  text: 'Dies zeigte mir der Herr Yahweh: Siehe, er war dabei, Heuschrecken zu bilden, als der Spätwuchs[a] gerade aufzugehen begann. Und siehe: Da war der Spätwuchs nach dem Mähen des Königs[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „später Nachwuchs“ oder „zweiter Aufwuchs“. Das hebräische Wort bezeichnet den späteren Bewuchs nach einem früheren Schnitt.
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Mähen des Königs“ ist wahrscheinlich ein erster Schnitt von Gras oder Futterpflanzen gemeint, der dem König als Abgabe zustand; danach wuchs der hier genannte Spätwuchs heran.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: Dies zeigte mir
  rationale: Die Formulierung gibt die demonstrative Einleitung der Vision und den kausativen Sinn von ראה in natürlichem, heutigem Deutsch wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: 'Die Wiedergabe bewahrt beide Bestandteile des zusammengesetzten Gottestitels: אֲדֹנָי als „Herr“ und den Gottesnamen יְהוִה als „Yahweh“.'
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: „Siehe“ erhält die eindringliche, visionäre Präsentationsform und passt zum würdevollen prophetischen Register.
- source_word: יוֹצֵר
  choice: er formte
  rationale: Das Partizip beschreibt die im Visionsbild vor sich gehende Tätigkeit. Das deutsche Präteritum ist hier idiomatisch; der Verlauf wird durch den Zusammenhang erkennbar.
- source_word: גֹּבַי
  choice: Heuschrecken
  rationale: Der Ausdruck bezeichnet hier pflanzenfressende Heuschrecken als landwirtschaftliche Bedrohung; der Plural vermeidet die zusätzliche Festlegung auf einen ausdrücklich genannten Schwarm.
- source_word: בִּתְחִלַּת עֲלוֹת
  choice: als … gerade aufzugehen begann
  rationale: Die Formulierung gibt sowohl den Anfangszeitpunkt als auch das Aufgehen beziehungsweise Emporwachsen der Vegetation natürlich wieder.
- source_word: הַלָּקֶשׁ / לֶקֶשׁ
  choice: der Spätwuchs / der Spätwuchs
  rationale: לקש bezeichnet den späteren Nachwuchs nach einem vorausgehenden Schnitt. „Spätwuchs“ ist knapp, wahrt die landwirtschaftliche Bedeutung und wird wegen der möglichen Alternativen in einer Fußnote erläutert.
- source_word: גִּזֵּי הַמֶּלֶךְ
  choice: das Mähen des Königs
  rationale: Die Formulierung bewahrt die knappe Genitivverbindung des Hebräischen und legt nicht im Haupttext fest, ob damit ein königlicher Anspruch, eine Abgabe oder königliches Mähen gemeint ist.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr, HERR
  rationale: „Der Herr Yahweh“ lässt sowohl den Titel אֲדֹנָי als auch den ausdrücklich gesetzten Bundesnamen יְהוִה sichtbar und vermeidet eine Verdoppelung von „Herr“.
- issue: Handelndes Subjekt bei יוֹצֵר
  choice: er formte
  alternative: es bildeten sich
  rationale: Das maskuline Partizip schließt am natürlichsten an den zuvor genannten Herrn Yahweh als Handelnden an. Die Übersetzung macht diese grammatische Verbindung sichtbar, ohne die symbolische Bedeutung der Heuschrecken weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem prophetischem „Siehe“. Die Wiederholung von „Spätwuchs“ spiegelt die hebräische Wiederaufnahme desselben Wortes; die kulturell und lexikalisch unsicheren Einzelheiten werden nicht im Haupttext vereindeutigt.
