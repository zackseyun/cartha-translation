  text: נִחַ֥ם יְהוָ֖ה עַל זֹ֑את גַּם הִיא֙ לֹ֣א תִֽהְיֶ֔ה אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/006.yaml
  text: 'Yahweh relented concerning this also: “It too shall not happen,” said the Lord GOD[a].'
translation:
  language: de
  text: Da änderte Jahwe in dieser Sache seinen Entschluss. »Auch das wird nicht geschehen«, sprach der Herr Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחַם
  choice: änderte … seinen Entschluss
  rationale: Das Nifal von נחם bezeichnet hier, als Reaktion auf Amos’ Fürbitte, ein Abstandnehmen vom angekündigten Handeln beziehungsweise eine Änderung des Entschlusses. Die Formulierung ist gegenwärtiges Deutsch und bewahrt die menschlich-relationale Redeweise des Hebräischen, ohne einen moralischen Fehler Gottes zu unterstellen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: עַל זֹאת
  choice: in dieser Sache
  rationale: 'Die Präposition עַל bezeichnet mit זֹאת den Gegenstand, um den es geht: das in der Vision angekündigte Gericht. „In dieser Sache“ fügt sich natürlich in die deutsche Wendung „seinen Entschluss ändern“ ein.'
- source_word: גַּם הִיא
  choice: Auch das
  rationale: Das feminine Pronomen verweist auf das angekündigte Geschehen beziehungsweise Unheil. Da dieses Bezugswort im unmittelbaren deutschen Satz nicht ausdrücklich feminin benannt ist, gibt „auch das“ den rückverweisenden und additiven Sinn idiomatisch wieder.
- source_word: לֹא תִהְיֶה
  choice: wird nicht geschehen
  rationale: Wörtlich steht „wird nicht sein“. Im Zusammenhang ist das Eintreten des angekündigten Gerichts gemeint; „wird nicht geschehen“ gibt diesen idiomatischen Sinn klar wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die Wiedergabe bewahrt sowohl den Titel אֲדֹנָי als auch den persönlichen Gottesnamen יְהוָה und unterscheidet die Verbindung vom zuvor allein stehenden Gottesnamen.
theological_decisions:
- issue: Menschlich-relationale Rede über Gott in נִחַם
  choice: Die Aussage wird als „änderte … seinen Entschluss“ unmittelbar beibehalten.
  alternative: „nahm davon Abstand“, „ließ sich umstimmen“ oder „hatte Erbarmen“
  rationale: Der hebräische Text schildert Jahwe als auf die Fürbitte des Propheten reagierend. Die Übersetzung soll diese theologische Spannung weder durch eine abstrakte Umschreibung beseitigen noch durch eine dogmatische Erklärung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich. „Jahwe“ gibt den Gottesnamen wieder; „der Herr Jahwe“ bildet die hebräische Verbindung aus Titel und Gottesnamen transparent ab.
