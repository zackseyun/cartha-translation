  source_fidelity: Die Grundbedeutung von נִחַם im Nifal ist mit „änderte ... seinen Entschluss“ vertretbar wiedergegeben; auch „wird nicht geschehen“ trifft die kontextuelle Bedeutung von לֹא תִהְיֶה. Der Gottesname und die Titelformel sind angemessen unterschieden. Allerdings steht גַּם bei הִיא in der anschließenden Aussage („Auch das wird nicht geschehen“), nicht bei „in dieser Sache“.
