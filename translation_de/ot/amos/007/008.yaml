base_translation:
  language: en
  yaml_path: translation/ot/amos/007/008.yaml
  text: And Yahweh said to me[a], “What do you see, Amos?” And I said, “A plumb line.” Then the Lord said, “Look, I am setting a plumb line in the midst of my people Israel[b]; I will not again pass by them.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Was siehst du, Amos?« Ich antwortete: »Ein Lot[a].« Da sagte der Herr: »Sieh, ich stelle ein Lot mitten in mein Volk Israel. Ich werde nicht noch einmal an ihm vorübergehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Zinn“, „Blei“ oder „Senkblei“. Das hebräische Wort bezeichnet wahrscheinlich ein Messgerät oder ein Material, das mit einem Lot verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: '„Ich werde nicht noch einmal an ihm vorübergehen“ bedeutet hier wahrscheinlich: „Ich werde dieses Volk nicht länger verschonen“ oder „Ich werde seine Schuld nicht länger übersehen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt die Unterscheidung zum Titel אֲדֹנָי.
- source_word: מָה אַתָּה רֹאֶה
  choice: Was siehst du
  rationale: Die natürliche deutsche Gegenwartsfrage gibt das Partizip im unmittelbaren Visionsgeschehen angemessen wieder.
- source_word: אֲנָךְ
  choice: Lot
  rationale: Im Zusammenhang von Amos 7,7–8 bezeichnet das Wort wahrscheinlich ein Messgerät zur Prüfung der Senkrechten. „Lot“ ist im Deutschen knapp und sachlich; die lexikalische Unsicherheit wird in einer Fußnote offengehalten.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Der göttliche Titel wird vom zuvor stehenden persönlichen Namen Jahwe unterschieden.
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: „Sieh“ bewahrt die aufmerksamkeitslenkende und deiktische Funktion, ohne die stärker altertümliche Form „Siehe“ zu verwenden.
- source_word: שָׂם
  choice: lege
  rationale: Das Präsens gibt die partizipiale, anschauliche Darstellung der Vision wieder.
- source_word: בְּקֶרֶב
  choice: mitten in
  rationale: Die räumliche Aussage wird bewahrt, ohne sie deutend zu „anlegen an“ oder „prüfen“ auszuweiten.
- source_word: לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: Ich werde nicht noch einmal an ihm vorübergehen
  rationale: Die hebräische Bildsprache bleibt im Haupttext erhalten. Das singularische Pronomen bezieht sich kollektiv auf „mein Volk Israel“ und wird daher als „ihm“ wiedergegeben; der gemeinte Verzicht auf weitere Schonung wird in der Fußnote erläutert.
theological_decisions:
- issue: Unterscheidung zwischen Gottesname und Gottestitel
  choice: יְהוָה wird als „Jahwe“, אֲדֹנָי als „der Herr“ wiedergegeben.
  alternative: Beide Ausdrücke könnten traditionell mit „der HERR/Herr“ wiedergegeben werden.
  rationale: Die unterschiedliche Benennung im hebräischen Text ist bedeutungstragend und soll sichtbar bleiben, ohne darüber hinausgehende konfessionelle Aussagen einzutragen.
- issue: Gerichtsidiom לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: Das Bild „nicht noch einmal an ihm vorübergehen“ bleibt im Haupttext erhalten.
  alternative: 'Deutender wäre: „Ich werde es nicht länger verschonen“ oder „Ich werde seine Schuld nicht länger übersehen“.'
  rationale: Der Kontext weist auf bevorstehendes Gericht, doch eine rein deutende Wiedergabe würde die echte Bildhaftigkeit und Spannung des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Rede. Die Satzfolge folgt der hebräischen Erzählbewegung, vermeidet jedoch unnötig altertümliche Wendungen. Die Mehrdeutigkeit von אֲנָךְ und die Bildsprache des abschließenden Gerichtsidioms bleiben ausdrücklich erhalten.
