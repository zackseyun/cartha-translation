  text: וַ/יִּשְׁלַ֗ח אֲמַצְיָה֙ כֹּהֵ֣ן בֵּֽית אֵ֔ל אֶל יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר קָשַׁ֨ר עָלֶ֜י/ךָ עָמ֗וֹס בְּ/קֶ֨רֶב֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹא תוּכַ֣ל הָ/אָ֔רֶץ לְ/הָכִ֖יל אֶת כָּל דְּבָרָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/010.yaml
  text: Then Amaziah[a], the priest of Bethel, sent word to Jeroboam king of Israel, saying, “Amos has conspired against you in the midst of the house of Israel[c][b]; the land is not able to bear all his words.”
translation:
  language: de
  text: 'Da sandte Amazja, der Priester von Bethel, Jerobeam, dem König von Israel, eine Botschaft: „Amos hat sich gegen dich verschworen[a], inmitten des Hauses Israel[b]. Das Land kann all seine Worte nicht ertragen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat gegen dich ein Komplott geschmiedet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Haus Israel“ beziehungsweise „innerhalb des Hauses Israel“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „kann all seine Worte nicht fassen“ beziehungsweise „nicht aushalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: sandte ... eine Botschaft
  rationale: Das hebräische Verb bedeutet „senden“; ein ausdrückliches Objekt fehlt, doch לֵאמֹר führt die übermittelte Rede ein. „Eine Botschaft senden“ gibt den kommunikativen Vorgang im Deutschen natürlich wieder.
- source_word: כֹּהֵן בֵּית אֵל
  choice: der Priester von Bethel
  rationale: Die Status-constructus-Verbindung bezeichnet Amazjas priesterliches Amt und seine Zuordnung zum Heiligtum von Bethel. „Von Bethel“ bewahrt diese institutionelle Verbindung.
- source_word: קָשַׁר עָלֶיךָ
  choice: hat sich gegen dich verschworen
  rationale: קָשַׁר bezeichnet besonders im politischen Zusammenhang eine Verschwörung oder ein Komplott; עַל kennzeichnet das Ziel der behaupteten Verschwörung.
- source_word: בְּקֶרֶב בֵּית יִשְׂרָאֵל
  choice: mitten im Haus Israel
  rationale: „Mitten in“ wahrt den räumlich-sozialen Sinn von בְּקֶרֶב; „Haus Israel“ erhält die prophetisch und national geprägte hebräische Wendung.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang ist das Land beziehungsweise Staatsgebiet Israel gemeint, nicht die gesamte Erde.
- source_word: לְהָכִיל אֶת כָּל דְּבָרָיו
  choice: all seine Worte ... ertragen
  rationale: Das Verb כול bezeichnet hier die Fähigkeit, etwas aufzunehmen oder auszuhalten. „Ertragen“ gibt die rhetorische Klage idiomatisch wieder, während „all seine Worte“ Zahl und umfassenden Anspruch des Hebräischen bewahrt.
theological_decisions:
- issue: Art von Amazjas Anschuldigung gegen Amos
  choice: „Amos hat sich gegen dich verschworen“ als politische Anklage Amazjas
  alternative: „Amos hat gegen dich ein Komplott geschmiedet“
  rationale: Der Vers berichtet Amazjas feindselige Darstellung gegenüber dem König. Die Formulierung gibt die Schwere des Vorwurfs wieder, ohne ihn als Urteil des Erzählers über Amos zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Bezeichnung „Haus Israel“ bleibt erhalten; Satzbau und Botenformel sind für heutige Leser behutsam geglättet.
