source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר עָמ֔וֹס בַּ/חֶ֖רֶב יָמ֣וּת יָרָבְעָ֑ם וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/011.yaml
  text: 'For this is what Amos has said: ‘Jeroboam will die by the sword[a], and Israel will surely go into exile from its land.’'
translation:
  language: de
  text: 'Denn so hat Amos gesagt: »Jerobeam wird durchs Schwert sterben, und Israel wird ganz gewiss aus seinem Land ins Exil gehen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird mit Sicherheit ins Exil geführt werden“ beziehungsweise „wird ganz gewiss in die Verbannung weggeführt werden“. Im Hebräischen steht zur Verstärkung ein Infinitivus absolutus neben dem finiten Verb.'
    reason: 'Lexikalische und grammatische Alternative: Die emphatische hebräische Konstruktion lässt sich im Deutschen sowohl aktiv als auch passiv wiedergeben.'
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet Amazjas Begründung beziehungsweise seinen Bericht über die Anklage ein und knüpft natürlich an den vorhergehenden Vers an.
- source_word: כֹה אָמַר
  choice: so hat … gesagt
  rationale: Bewahrt die geläufige Aussageformel und gibt in natürlichem Deutsch wieder, dass Amazja eine bereits geäußerte Botschaft des Amos zitiert.
- source_word: בַּחֶרֶב יָמוּת
  choice: wird durch das Schwert sterben
  rationale: Gibt sowohl den Zukunftsbezug als auch den instrumentalen Sinn des hebräischen Ausdrucks wieder, ohne die Art des gewaltsamen Todes näher festzulegen.
- source_word: גָּלֹה יִגְלֶה
  choice: wird ganz gewiss … in die Verbannung gehen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Ganz gewiss“ macht diese emphatische Funktion im Deutschen deutlich; „in die Verbannung gehen“ wahrt den Exilgedanken und die aktive Form.
- source_word: מֵעַל אַדְמָתוֹ
  choice: aus seinem Land
  rationale: „Land“ passt hier zum nationalen Exil; das maskuline Singularsuffix bezieht sich auf Israel als kollektive politische Größe. „Aus“ ist eine natürliche deutsche Wiedergabe der Trennung vom eigenen Land.
theological_decisions:
- issue: Bezug von „Israel“ und dem Possessivsuffix in „seinem Land“
  choice: Israel als kollektive nationale Größe; daher „seinem Land“
  alternative: das Volk Israel … aus ihrem Land
  rationale: Der hebräische Text behandelt Israel grammatisch als maskulinen Singular. Die Wiedergabe bewahrt diesen kollektiven und politischen Sinn, ohne ihn zu individualisieren.
- issue: Stärke der Exilaussage
  choice: „ganz gewiss“ als ausdrückliche Verstärkung
  alternative: schlicht „wird … in die Verbannung gehen“ oder passiv „wird gewiss weggeführt werden“
  rationale: Die hebräische Konstruktion גָּלֹה יִגְלֶה ist emphatisch. Die Übersetzung erhält diese Gewissheit, legt aber nicht unnötig fest, ob das Verb aktiv als Gang ins Exil oder passiv als Wegführung zu verstehen ist; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Rede bleibt knapp und direkt; „durch das Schwert“ und „in die Verbannung“ bewahren den biblischen Bild- und Themenwortschatz, ohne altertümlich zu wirken.
