  source_fidelity: 'Die Übersetzung gibt Sprecher, Adressat, die Anrede »Seher«, die Folge der Imperative und das Ziel »Land Juda« zutreffend wieder. »tritt dort als Prophet auf« ist jedoch keine hinreichend genaue Wiedergabe von תִּנָּבֵא: Es kann den Vorgang des prophetischen Redens durch ein Auftreten ersetzen und legt dabei einen performativen bzw. abwertenden Akzent nahe, der nicht ausdrücklich im Verb selbst liegt.'
  naturalness: Der Text ist insgesamt knapp, verständlich und modernes Standarddeutsch. »Iss dort Brot« ist im Deutschen natürlich genug und bewahrt den hebräischen Ausdruck genauer als »Iss dort dein Brot«, dessen Possessivpronomen nicht im Ausgangstext steht und die Deutung als Broterwerb stärker in den Haupttext zieht.
  terminology: »Seher« bewahrt sinnvoll die besondere Anrede חֹזֶה gegenüber dem folgenden Verb נבא. »weissage« ist eine etablierte, würdevolle und verständliche deutsche Wiedergabe von תִּנָּבֵא; sie erhält zudem die verbale Entsprechung, ohne »Seher« mit »Prophet« zu nivellieren. »Land Juda« und »Amazja« sind angemessen.
