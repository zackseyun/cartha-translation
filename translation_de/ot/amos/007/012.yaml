    rationale: Die Formulierung bezeichnet eher öffentliches Auftreten als prophetisches Reden/Weissagen. Sie ist interpretativer als das hebräische Verb und kann einen zusätzlichen Anschein von Selbstdarstellung oder berufsmäßiger Tätigkeit erzeugen.
  - severity: low
    issue: »dein« in »Iss dort dein Brot«
    rationale: Das hebräische לֶחֶם steht ohne Possessivsuffix. Das deutsche Possessivpronomen ist zwar idiomatisch möglich, verstärkt aber die im Fußnotentext erläuterte Erwerbsdeutung unnötig im Haupttext.
