  text: וַ/יֹּ֤אמֶר אֲמַצְיָה֙ אֶל עָמ֔וֹס חֹזֶ֕ה לֵ֥ךְ בְּרַח לְ/ךָ֖ אֶל אֶ֣רֶץ יְהוּדָ֑ה וֶ/אֱכָל שָׁ֣ם לֶ֔חֶם וְ/שָׁ֖ם תִּנָּבֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/012.yaml
  text: Then Amaziah said to Amos[a], “Seer, go, flee away to the land of Judah, and eat bread there, and prophesy there.”
translation:
  language: de
  text: 'Da sagte Amazja zu Amos: »Seher, geh, flieh ins Land Juda! Iss dort Brot[a] und weissage dort!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verdiene dort dein Brot« beziehungsweise »Bestreite dort deinen Lebensunterhalt«; die Wendung »Brot essen« meint hier wahrscheinlich, dort seinen Lebensunterhalt zu verdienen.'
    reason: lexikalische Alternative und wahrscheinlicher idiomatischer Sinn
lexical_decisions:
- source_word: חֹזֶה
  choice: Seher
  rationale: Bewahrt die besondere Bezeichnung für jemanden, der Visionen schaut, statt sie mit dem allgemeineren Wort »Prophet« gleichzusetzen.
- source_word: לֵךְ בְּרַח לְךָ
  choice: geh, flieh
  rationale: Gibt die beiden Imperative wieder; das ethische לְךָ verstärkt idiomatisch die Aufforderung zur persönlichen Entfernung, ohne eine unnatürliche wörtliche Wiedergabe zu erzwingen.
- source_word: אֶרֶץ יְהוּדָה
  choice: Land Juda
  rationale: Bewahrt die geografisch-politische Bedeutung von אֶרֶץ in natürlichem, bibelfestem Deutsch.
- source_word: וֶאֱכָל שָׁם לֶחֶם
  choice: Iss dort dein Brot
  rationale: Hält am konkreten Bild des hebräischen Ausdrucks fest; das Possessivpronomen macht die Wendung im Deutschen natürlich, während die mögliche Bedeutung des Lebensunterhalts in der Fußnote erscheint.
- source_word: תִּנָּבֵא
  choice: tritt dort als Prophet auf
  rationale: Gibt die Tätigkeit des prophetischen Redens in idiomatischem Deutsch wieder und wahrt zugleich den möglichen abwertenden Unterton Amazjas.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt die fortschreitende Erzählfolge des Wayyiqtol natürlich wieder.
theological_decisions:
- issue: Ob Amazjas Unterstellung, Amos verdiene seinen Lebensunterhalt mit Prophetie, ausdrücklich gemacht werden soll
  choice: Das konkrete Bild »Iss dort dein Brot« bleibt im Haupttext erhalten.
  alternative: »Verdiene dort dein Brot« oder »Bestreite dort deinen Lebensunterhalt«
  rationale: Der Zusammenhang legt einen spöttischen Hinweis auf den Lebensunterhalt nahe, doch der hebräische Text sagt ausdrücklich »Brot essen«. Haupttext und Fußnote bewahren daher sowohl den Wortlaut als auch den wahrscheinlichen idiomatischen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und scharf. »Seher« wahrt den spezifischen prophetischen Titel; die Imperativfolge vermittelt Amazjas Dringlichkeit und Abweisung.
