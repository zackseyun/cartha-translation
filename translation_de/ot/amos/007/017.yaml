source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר יְהוָ֗ה אִשְׁתְּ/ךָ֞ בָּ/עִ֤יר תִּזְנֶה֙ וּ/בָנֶ֤י/ךָ וּ/בְנֹתֶ֨י/ךָ֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/אַדְמָתְ/ךָ֖ בַּ/חֶ֣בֶל תְּחֻלָּ֑ק וְ/אַתָּ֗ה עַל אֲדָמָ֤ה טְמֵאָה֙ תָּמ֔וּת וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/017.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘Your wife will prostitute herself in the city, and your sons and your daughters will fall by the sword, and your land will be divided by measuring line; and you yourself will die on unclean land[c][b], and Israel will surely go into exile from its land.’'
translation:
  language: de
  text: 'Darum spricht Yahweh: »Deine Frau wird sich in der Stadt prostituieren[a], deine Söhne und deine Töchter werden durch das Schwert fallen, und dein Land wird mit der Messschnur aufgeteilt werden[b]. Du selbst wirst auf unreinem Land sterben, und Israel wird ganz gewiss aus seinem Land in die Verbannung gehen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wird Unzucht treiben“. Das hebräische Verb bezeichnet hier Prostitution.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wird mit der Schnur aufgeteilt“; gemeint ist die Messschnur, mit der Land vermessen und zugeteilt wurde.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Verbindung eines Infinitivs mit dem finiten Verb verstärkt die Aussage und drückt hier Nachdruck oder Gewissheit aus.
    reason: source_form
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Einleitung des angekündigten Gerichts knapp und natürlich wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Yahweh
  rationale: Bewahrt die geläufige prophetische Botenformel und gibt den Gottesnamen als Yahweh wieder.
- source_word: תִּזְנֶה
  choice: wird sich prostituieren
  rationale: Gibt die konkrete sexuelle Bedeutung des Verbs זנה klar, direkt und in heutigem Deutsch wieder, ohne die Härte der Aussage abzuschwächen.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: deine Söhne und deine Töchter
  rationale: Bewahrt die ausdrücklich genannte Paarung, statt sie zum allgemeineren Ausdruck „deine Kinder“ zusammenzufassen.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: werden durch das Schwert fallen
  rationale: Erhält die feierlich-ernste hebräische Wendung für den gewaltsamen Tod.
- source_word: וְאַדְמָתְךָ בַּחֶבֶל תְּחֻלָּק
  choice: dein Land wird mit der Messschnur aufgeteilt werden
  rationale: Versteht חֶבֶל als Messschnur zur Vermessung und Zuteilung eroberten Grundbesitzes; die passive Form bleibt erhalten.
- source_word: וְאַתָּה
  choice: du selbst
  rationale: Spiegelt die Betonung durch das ausdrücklich gesetzte Personalpronomen.
- source_word: עַל אֲדָמָה טְמֵאָה
  choice: auf unreinem Boden
  rationale: Bleibt nahe an der räumlichen Formulierung und wahrt zugleich die mögliche kultisch-bundestheologische Bedeutung eines fremden Landes.
- source_word: גָּלֹה יִגְלֶה
  choice: wird ganz gewiss … in die Verbannung gehen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb wird durch „ganz gewiss“ als nachdrückliche beziehungsweise sichere Aussage wiedergegeben.
- source_word: מֵעַל אַדְמָתוֹ
  choice: aus seinem Land
  rationale: Gibt die Trennung von Israels eigenem Land knapp und quellennah wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Eigenname bleibt als Eigenname erkennbar und wird nicht durch einen Titel ersetzt.
- issue: Bedeutung von „unreinem Boden“
  choice: Die knappe Quellenaussage bleibt im Haupttext erhalten.
  alternative: ausdrückliche Deutung als fremdes Land außerhalb Israels
  rationale: Der Zusammenhang mit der Verbannung legt fremdes, aus israelitischer Bundes- und Kultperspektive unreines Land nahe; eine erklärende Erweiterung würde diese Deutung jedoch stärker festlegen als der Wortlaut selbst.
- issue: Nachdruck der Exilsankündigung
  choice: ganz gewiss
  alternative: muss in die Verbannung gehen; wird unweigerlich verbannt werden
  rationale: Gibt den Nachdruck der hebräischen Infinitivus-absolutus-Konstruktion wieder, ohne sie als äußeren Zwang oder als ausdrücklich passives Verschlepptwerden umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Direktheit. Die drastische Gerichtssprache wird weder archaisiert noch beschönigt. Die Satzfolge des Hebräischen bleibt weitgehend erkennbar, wird aber durch zeitgemäße Zeichensetzung lesbar gegliedert.
