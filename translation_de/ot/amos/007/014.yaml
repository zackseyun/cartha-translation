  text: וַ/יַּ֤עַן עָמוֹס֙ וַ/יֹּ֣אמֶר אֶל אֲמַצְיָ֔ה לֹא נָבִ֣יא אָנֹ֔כִי וְ/לֹ֥א בֶן נָבִ֖יא אָנֹ֑כִי כִּֽי בוֹקֵ֥ר אָנֹ֖כִי וּ/בוֹלֵ֥ס שִׁקְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/014.yaml
  text: Then Amos answered and said to Amaziah[a], “I am not a prophet, nor am I a son of a prophet; rather[b], I am a herdsman and a dresser of sycamore figs.”
translation:
  language: de
  text: 'Da antwortete Amos und sagte zu Amazja: »Ich bin kein Prophet und auch kein Prophetensohn[a], sondern ich bin ein Rinderhirte und bearbeite Maulbeerfeigen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Prophetensohn“ kann im Hebräischen statt eines leiblichen Sohnes auch ein Mitglied einer Prophetengemeinschaft bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ritze Maulbeerfeigen“ oder „pflege Maulbeerfeigen“. Das hebräische Wort bezeichnet wahrscheinlich das Anritzen oder eine andere Behandlung der Früchte, die ihre Reifung förderte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete ... und sagte
  rationale: Bewahrt die hebräische Erzählformel und ihren zweigliedrigen Rhythmus in verständlichem Deutsch.
- source_word: לֹא נָבִיא אָנֹכִי
  choice: Ich bin kein Prophet
  rationale: Gibt die prädikative Aussage direkt wieder und lässt die Spannung zu Amos’ tatsächlichem prophetischem Reden bestehen.
- source_word: וְלֹא בֶן נָבִיא אָנֹכִי
  choice: und auch kein Prophetensohn
  rationale: Bewahrt das hebräische Idiom, ohne es im Haupttext auf leibliche Abstammung oder die Zugehörigkeit zu einer Prophetengemeinschaft festzulegen.
- source_word: כִּי
  choice: sondern
  rationale: Markiert hier natürlich den Gegensatz zwischen den beiden Verneinungen und Amos’ eigener Berufsangabe.
- source_word: בוֹקֵר
  choice: Rinderhirte
  rationale: Das Wort bezeichnet einen mit Rindern beziehungsweise Herden befassten Mann; ‚Rinderhirte‘ ist genauer als das leicht auf Schafe bezogene ‚Hirte‘.
- source_word: וּבוֹלֵס שִׁקְמִים
  choice: ritze Maulbeerfeigen
  rationale: בולס bezeichnet wahrscheinlich das Anritzen oder anderweitige Bearbeiten der Früchte; die konkrete Wiedergabe bleibt durch eine Fußnote als nicht völlig sicher gekennzeichnet.
- source_word: שִׁקְמִים
  choice: Maulbeerfeigen
  rationale: Gemeint sind Früchte der Maulbeerfeige (Ficus sycomorus), nicht die im heutigen Deutschen häufig mit ‚Sykomore‘ oder ‚Platane‘ verbundenen anderen Bäume.
theological_decisions:
- issue: Ob Amos grundsätzlich bestreitet, Prophet zu sein, oder nur eine berufliche beziehungsweise institutionelle Stellung verneint
  choice: 'Die wörtliche Spannung bleibt stehen: „Ich bin kein Prophet und auch kein Prophetensohn“.'
  alternative: „Ich war kein Prophet“ oder „Ich bin kein Berufsprophet“.
  rationale: Der hebräische Nominalsatz legt die Zeitstufe nicht ausdrücklich fest, und der Zusammenhang zeigt zugleich Amos’ göttlichen Auftrag. Eine erklärende Paraphrase würde diese Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante hebräische Antwortformel wird beibehalten; seltene Sachbegriffe werden knapp in Fußnoten erläutert.
