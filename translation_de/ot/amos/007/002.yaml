source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם כִּלָּה֙ לֶֽ/אֱכוֹל֙ אֶת עֵ֣שֶׂב הָ/אָ֔רֶץ וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ סְֽלַֽח נָ֔א מִ֥י יָק֖וּם יַֽעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/002.yaml
  text: And when it had finished eating the vegetation of the land[a], I said, “Lord GOD, please forgive! How can Jacob stand? For he is small.”
translation:
  language: de
  text: 'Und als es das Grün des Landes vollständig aufgefressen hatte, sagte ich: »Herr Yahweh, vergib doch! Wie soll Jakob bestehen?[a] Denn er ist klein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer wird Jakob aufrichten?«'
    reason: Der hebräische Wortlaut מִי יָקוּם יַעֲקֹב ist syntaktisch mehrdeutig und kann neben Jakobs Bestehen auch ein Aufrichten Jakobs bezeichnen.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Und als
  rationale: Die Verbindung leitet im Zusammenhang den nächsten Vorgang der Vision zeitlich ein; „als“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: כִּלָּה לֶאֱכוֹל
  choice: es … vollständig aufgefressen hatte
  rationale: כלה mit Infinitiv bezeichnet den Abschluss einer Handlung. „Vollständig aufgefressen“ vermittelt zugleich die Vollendung und die vernichtende Wirkung des Fraßes.
- source_word: עֵשֶׂב הָאָרֶץ
  choice: das Grün des Landes
  rationale: עֵשֶׂב bezeichnet Gras, Kraut oder Pflanzenwuchs allgemein. „Das Grün“ ist umfassend und natürlich; הָאָרֶץ meint hier im nationalen Zusammenhang das Land, nicht die gesamte Erde.
- source_word: וָאֹמַר
  choice: sagte ich
  rationale: Schlichte und natürliche Wiedergabe der fortschreitenden Erzählform.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: Die Wiedergabe bewahrt sowohl den Herrentitel אֲדֹנָי als auch den persönlichen Gottesnamen יהוה, ohne die unnatürliche Doppelung „Herr HERR“.
- source_word: סְלַח נָא
  choice: vergib doch
  rationale: „Doch“ gibt die flehentliche, dringliche Kraft der Partikel נָא in idiomatischem modernem Deutsch wieder.
- source_word: מִי יָקוּם יַעֲקֹב
  choice: Wie soll Jakob bestehen?
  rationale: Die formal schwierige Wendung ist im Kontext am ehesten eine rhetorische Frage nach Jakobs Fähigkeit, das Gericht zu überstehen. Die mögliche restaurative Deutung wird in der Fußnote bewahrt.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der im Hebräischen verwendete Bundesname bleibt erhalten und wird nicht deutend durch „Israel“ ersetzt.
- source_word: כִּי קָטֹן הוּא
  choice: Denn er ist klein
  rationale: '„Klein“ erhält die Bildbreite von קָטֹן: Gemeint sein können zahlenmäßige, politische oder existentielle Schwäche und Geringheit.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Herr, der HERR
  rationale: „Yahweh“ macht den im Ausgangstext stehenden Bundesnamen sichtbar; „Herr“ gibt daneben אֲדֹנָי wieder.
- issue: Sinn von מִי יָקוּם יַעֲקֹב
  choice: Wie soll Jakob bestehen?
  alternative: Wer wird Jakob wieder aufrichten?
  rationale: Im unmittelbaren Zusammenhang bittet Amos angesichts der Verwüstung darum, dass Jakob das Gericht überstehen kann. Da קום jedoch auch als Aufrichten beziehungsweise Wiederherstellen verstanden werden kann, bleibt diese Möglichkeit ausdrücklich in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Dringlichkeit. Das unpersönliche „es“ nimmt das im vorigen Vers geschaute fraßverursachende Geschehen kollektiv auf, ohne im vorliegenden Vers ein ausdrücklich genanntes Subjekt zu ergänzen.
