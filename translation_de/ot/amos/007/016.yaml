id: AMO.7.16
reference: Amos 7:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע דְּבַר יְהוָ֑ה אַתָּ֣ה אֹמֵ֗ר לֹ֤א תִנָּבֵא֙ עַל יִשְׂרָאֵ֔ל וְ/לֹ֥א תַטִּ֖יף עַל בֵּ֥ית יִשְׂחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/016.yaml
  text: 'And now[a], hear the word of Yahweh: You say, ‘Do not prophesy against Israel, and do not preach against the house of Isaac.’'
translation:
  language: de
  text: 'Und nun höre das Wort Jahwes! Du sagst: »Prophezeie nicht gegen Israel und rede nicht gegen das Haus Isaak.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Träufle nicht gegen das Haus Isaak.« Das hebräische Verb bedeutet eigentlich »träufeln« und wird bildhaft für prophetisches Reden gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den unmittelbaren zeitlichen Übergang in natürlichem Deutsch.
- source_word: שְׁמַע
  choice: höre
  rationale: Der Imperativ Singular richtet sich unmittelbar an Amazja; »höre« entspricht dem würdevollen prophetischen Sprachgebrauch.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die feste prophetische Formel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: אַתָּה אֹמֵר
  choice: Du sagst
  rationale: Das ausdrücklich gesetzte Pronomen hebt Amazja als Angeredeten hervor; das Präsens gibt seine erklärte Anweisung knapp wieder.
- source_word: לֹא תִנָּבֵא עַל יִשְׂרָאֵל
  choice: Weissage nicht gegen Israel
  rationale: Die Verneinung mit der Verbform hat hier den Sinn eines Verbots; »gegen« gibt im Kontext die feindlich aufgefasste Stoßrichtung der Botschaft wieder.
- source_word: וְלֹא תַטִּיף
  choice: und verkünde nicht
  rationale: Das Hifil von נטף bedeutet wörtlich »tropfen lassen«, dient hier aber idiomatisch für prophetisches Reden. »Verkünde« ist verständlich und unterscheidet sich zugleich vom vorherigen »weissage«.
- source_word: עַל בֵּית יִשְׂחָק
  choice: gegen das Haus Isaak
  rationale: »Haus Isaak« bleibt als poetisch-bundestheologische Bezeichnung erhalten; »gegen« wahrt den Parallelismus und die konfrontative Aussage im Kontext.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. »Jahwe« gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Ausrichtung der prophetischen Rede, angezeigt durch עַל
  choice: gegen Israel / gegen das Haus Isaak
  alternative: zu Israel / über Israel beziehungsweise das Haus Isaak
  rationale: Amazja untersagt in diesem Zusammenhang die als anklagend und bedrohlich verstandene Prophetie. »Gegen« erhält diese konfrontative Kraft, ohne den Inhalt weiter auszudeuten.
- issue: Bildhafte Bedeutung von נטף
  choice: verkünde
  alternative: lass Worte strömen; weissage
  rationale: Die idiomatische Bedeutung prophetischen Redens steht im Haupttext; die Fußnote bewahrt das konkrete Bild des Tropfens beziehungsweise Träufelns und damit die sprachliche Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Rede. »Weissage« und »verkünde« sind allgemein verständlich und bewahren die Unterscheidung der beiden hebräischen Verben. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die lexikalische Erläuterung bezieht.
