source:
  edition: WLC
  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּ֥ה קֹרֵ֛א לָ/רִ֥ב בָּ/אֵ֖שׁ אֲדֹנָ֣/י יְהוִ֑ה וַ/תֹּ֨אכַל֙ אֶת תְּה֣וֹם רַבָּ֔ה וְ/אָכְלָ֖ה אֶת הַ/חֵֽלֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/004.yaml
  text: 'This is what the Lord GOD showed me: behold[a], the Lord GOD was calling for a judgment by fire[b], and it consumed the great deep and was consuming the land.'
translation:
  language: de
  text: 'So ließ mich der Herr Yahweh sehen: Siehe, der Herr Yahweh rief dazu auf, durch Feuer Gericht zu halten[a]. Und es verzehrte die große Tiefe und begann, den Anteil zu verzehren[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Feuer einen Rechtsstreit zu führen“. Das hebräische Wort kann einen Streit, besonders einen Rechtsstreit, bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Land“ beziehungsweise „das zugeteilte Gebiet“. Wörtlich steht hier „der Anteil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: So ließ mich … sehen
  rationale: Gibt die Visionseinleitung und den kausativen Hifil von ראה eng am Hebräischen wieder, bleibt aber in gehobenem modernem Deutsch verständlich.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Bewahrt sowohl den Titel אֲדֹנָי als auch den offenbarten Eigennamen יהוה, ohne die beiden Elemente zu einem doppelten „Herr“ zu verschmelzen.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Erhält die deiktische Lebendigkeit und den prophetischen Ton des Visionstextes.
- source_word: קֹרֵא
  choice: rief
  rationale: Das Partizip schildert die visionär wahrgenommene Handlung; das deutsche Präteritum fügt sie natürlich in die Erzählung ein.
- source_word: לָרִב
  choice: zum Rechtsstreit
  rationale: Bewahrt die gerichtlichen und streitenden Konnotationen von ריב, ohne sie vorschnell auf das abstraktere „Gericht“ festzulegen.
- source_word: בָּאֵשׁ
  choice: durch Feuer
  rationale: Drückt das Feuer als Mittel des Rechtsstreits beziehungsweise Gerichts aus.
- source_word: וַתֹּאכַל
  choice: Da verzehrte es
  rationale: Das Pronomen greift das Feuer als sachliches Bezugswort auf; „verzehren“ entspricht dem Bild des hebräischen אכל.
- source_word: תְּהוֹם רַבָּה
  choice: die große Tiefe
  rationale: Bewahrt die biblische Bezeichnung für die gewaltigen Ur- oder Tiefenwasser, ohne „Abgrund“ spekulativ aufzuladen.
- source_word: וְאָכְלָה
  choice: war dabei, … zu verzehren
  rationale: Gibt gegenüber dem vorangehenden abgeschlossenen Verb den fortschreitenden beziehungsweise einsetzenden Charakter der Handlung wieder.
- source_word: הַחֵלֶק
  choice: den Anteil
  rationale: Entspricht der Grundbedeutung „Anteil, zugewiesener Teil“ und vermeidet die nicht ausdrücklich im Wort enthaltene Festlegung auf „Land“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  alternative: Gott, der HERR; der Herr HERR
  rationale: Die Übersetzung erhält Titel und Eigenname getrennt und macht den im Ausgangstext verwendeten Gottesnamen sichtbar.
- issue: Gerichtliche Bedeutung von לָרִב
  choice: zum Rechtsstreit
  alternative: zum Gericht; um durch Feuer zu streiten
  rationale: „Rechtsstreit“ hält die juristische Dimension fest, ohne den mehrdeutigen Ausdruck vollständig mit einem vollstreckten Urteil gleichzusetzen.
- issue: Referenz von הַחֵלֶק
  choice: den Anteil
  alternative: das Land; das Gebiet
  rationale: Der Vers benennt den Referenten nicht ausdrücklich. Die formalere Wiedergabe bewahrt diese Offenheit; eine Fußnote nennt die wahrscheinliche territoriale Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischer Visionseinleitung. „Rechtsstreit“ und „Anteil“ bewahren die echte lexikalische Offenheit des Hebräischen; die Fußnoten erläutern idiomatischere Deutungen.
