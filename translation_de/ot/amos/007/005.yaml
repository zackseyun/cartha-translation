base_translation:
  language: en
  yaml_path: translation/ot/amos/007/005.yaml
  text: Then I said[a], “Lord GOD, please cease[b]. How can Jacob stand? For he is small.”
translation:
  language: de
  text: 'Da sagte ich: »Herr Yahweh[a], hör doch auf! Wie kann Jakob bestehen?[b] Denn er ist klein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Herr Yahweh“ (אֲדֹנָי יְהוִה), ein zusammengesetzter Titel mit dem Gottesnamen יהוה.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist knapp und kann auch verstanden werden als: „Wer wird Jakob aufrichten?“; wörtlicher lautet sie etwa: „Wer wird Jakob aufstehen?“'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte ich“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: 'Die Wiedergabe bewahrt beide Bestandteile des zusammengesetzten Gottestitels: אֲדֹנָי als „Herr“ und den Gottesnamen יהוה als „Yahweh“.'
- source_word: חֲדַל נָא
  choice: hör doch auf
  rationale: Der Imperativ חֲדַל bedeutet „aufhören, ablassen“; נָא kennzeichnet hier die dringende Bitte. „Doch“ vermittelt die flehentliche Nuance in natürlichem Deutsch.
- source_word: מִי יָקוּם יַעֲקֹב
  choice: Wie soll Jakob bestehen?
  rationale: Wörtlich steht eine knappe und syntaktisch schwierige Frage mit „wer“ und „aufstehen/bestehen“. Im Gerichtskontext fragt Amos, wie Jakob die Bedrohung überstehen soll. Die Fußnote bewahrt die formnäheren Deutungsmöglichkeiten.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Eigenname wird beibehalten; er bezeichnet hier das Volk Israel als personifizierte Einheit.
- source_word: כִּי קָטֹן הוּא
  choice: Denn er ist klein
  rationale: כִּי leitet die Begründung der Bitte ein. „Klein“ bewahrt das Bild und das maskuline Singularpronomen, das sich auf den personifizierten Jakob bezieht; „schwach“ wäre stärker deutend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה im Titel אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Gott, der HERR; Herr HERR
  rationale: „Herr Yahweh“ macht den im Hebräischen ausdrücklich stehenden Gottesnamen sichtbar und vermeidet zugleich die missverständliche Doppelung „Herr HERR“.
- issue: Deutung der Frage מִי יָקוּם יַעֲקֹב
  choice: Wie soll Jakob bestehen?
  alternative: Wer wird Jakob aufrichten?; Wer kann bestehen, Jakob?
  rationale: Der Zusammenhang legt eine Fürbitte angesichts von Jakobs Unvermögen nahe, lässt die knappe hebräische Formulierung jedoch mehrdeutig. Deshalb steht die kontextuell natürliche Deutung im Text, während die Alternativen in der Fußnote erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hör doch auf“ ist als dringende Fürbitte natürlich und klar; „bestehen“ und „Denn er ist klein“ bewahren den gehobenen biblischen Ton, ohne altertümlich zu wirken.
