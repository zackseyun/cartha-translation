source:
  edition: WLC
  text: וְ/נָשַׁ֨מּוּ֙ בָּמ֣וֹת יִשְׂחָ֔ק וּ/מִקְדְּשֵׁ֥י יִשְׂרָאֵ֖ל יֶחֱרָ֑בוּ וְ/קַמְתִּ֛י עַל בֵּ֥ית יָרָבְעָ֖ם בֶּ/חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/009.yaml
  text: The high places of Isaac will be made desolate[a], and the sanctuaries of Israel will be laid waste[c][b]; and I will rise against the house of Jeroboam with the sword.
translation:
  language: de
  text: Die Kulthöhen Isaaks werden veröden, und die Heiligtümer Israels werden verwüstet; ich werde mich mit dem Schwert gegen das Haus Jerobeams erheben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: werden veröden
  rationale: Das Nifal von שׁמם bezeichnet den Zustand beziehungsweise das Eintreten der Verödung. „Werden veröden“ gibt dies im Deutschen natürlich wieder, ohne unnötig eine ausdrücklich verursachende Passivform einzutragen.
- source_word: בָּמוֹת
  choice: Kulthöhen
  rationale: בָּמוֹת bezeichnet erhöhte Kultstätten. „Kulthöhen“ ist präziser als das missverständliche bloße „Höhen“ und knapper als „Kultstätten auf den Höhen“.
- source_word: יִשְׂחָק
  choice: Isaak
  rationale: Der Eigenname wird bewahrt. Er dient hier poetisch als Bezeichnung für das Nordreich beziehungsweise dessen Volk; eine Ersetzung durch „Israel“ würde die bewusste Wortwahl des hebräischen Textes einebnen.
- source_word: וּמִקְדְּשֵׁי
  choice: und die Heiligtümer
  rationale: מִקְדָּשׁ bezeichnet einen geheiligten Ort oder ein Heiligtum. „Heiligtümer“ bewahrt den kultischen Sinn und passt zum parallelen Ausdruck „Kulthöhen“.
- source_word: יִשְׂרָאֵל
  choice: Israels
  rationale: Der Eigenname wird direkt wiedergegeben; im Zusammenhang ist das Nordreich gemeint, doch diese Präzisierung gehört nicht in den Haupttext.
- source_word: יֶחֱרָבוּ
  choice: werden verwüstet werden
  rationale: Das Verb חרב bezeichnet das Verwüstet- oder Ruiniertwerden. Die Passivform vermittelt hier das Gerichtsgeschehen deutlich und wahrt zugleich die semantische Nähe zur Verödung im ersten Satzglied.
- source_word: וְקַמְתִּי עַל
  choice: Dann werde ich … gegen … vorgehen
  rationale: קום mit עַל drückt hier feindliches Auftreten gegen jemanden aus. „Gegen … vorgehen“ ist heutiges, würdevolles Deutsch und bewahrt die aktive göttliche Gegnerschaft; „Dann“ gibt das fortführende וְ im Zusammenhang natürlich wieder.
- source_word: בֵּית יָרָבְעָם
  choice: das Haus Jerobeams
  rationale: „Haus“ bewahrt die familiär-dynastische Bildsprache von בֵּית; die eindeutigere Wiedergabe „Dynastie“ wäre bereits interpretierender.
- source_word: בֶּחָרֶב
  choice: mit dem Schwert
  rationale: Die Wendung bezeichnet gewaltsames Gericht durch Krieg oder Tötung. „Mit dem Schwert“ entspricht der instrumentalen Formulierung des Hebräischen.
theological_decisions:
- issue: Bezug von „Isaak“
  choice: „Isaak“ bleibt als poetische beziehungsweise bundesgeschichtliche Bezeichnung im Haupttext stehen.
  alternative: Zur Verdeutlichung „Israel“ oder „das Volk Israel“ einsetzen.
  rationale: Der hebräische Text nennt ausdrücklich Isaak. Eine Ersetzung würde die literarische Spannung zwischen „Isaak“ und „Israel“ beseitigen und Interpretation an die Stelle der Übersetzung setzen.
- issue: Art des göttlichen Handelns in וְקַמְתִּי עַל
  choice: Die Aussage wird als unmittelbares, feindliches Vorgehen Gottes gegen Jerobeams Haus wiedergegeben.
  alternative: Abschwächend „ich werde gegen das Haus Jerobeams handeln“.
  rationale: Die hebräische Wendung trägt gerichtliche und militärische Kraft. Eine allgemeinere Formulierung würde die direkte göttliche Gegnerschaft abschwächen.
translation_notes:
  register: 'Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „Kulthöhen“ vermeidet die Unklarheit von „Höhen“, während „Haus Jerobeams“ die hebräische dynastische Metapher bewahrt. Die parallelen Verben werden nicht künstlich angeglichen: „veröden“ beschreibt den eintretenden Zustand, „verwüstet werden“ das Ergebnis des Gerichts.'
