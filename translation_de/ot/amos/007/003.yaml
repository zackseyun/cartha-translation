  text: 'Yahweh relented concerning this: “It will not happen,” said Yahweh[a].'
translation:
  language: de
  text: Jahwe nahm davon Abstand[a]. »Es wird nicht geschehen«, sagte Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe änderte seine Absicht in dieser Sache“ oder „Jahwe bedauerte dies“. Das hebräische Verb kann je nach Zusammenhang ausdrücken, dass jemand von einem beabsichtigten Handeln ablässt, etwas bedauert oder seine Absicht ändert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: nahm … Abstand
  rationale: Das Nifal von נחם bezeichnet hier, dass Jahwe das angekündigte Gericht nicht ausführt. „Davon Abstand nehmen“ gibt diese Änderung des beabsichtigten Handelns in natürlichem modernem Deutsch wieder, ohne Reue über moralisches Fehlverhalten auszudrücken. Die weitergehenden Bedeutungsnuancen werden in der Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Umschrift des Tetragramms.
- source_word: עַל זֹאת
  choice: davon
  rationale: Die Wendung verweist auf das unmittelbar zuvor geschilderte Gericht. Das deutsche Pronomen stellt diesen Rückbezug knapp und idiomatisch her.
- source_word: לֹא תִהְיֶה
  choice: Es wird nicht geschehen
  rationale: Die feminine Singularform bezieht sich auf das angedrohte Geschehen. Die Formulierung ist klar, gegenwärtig und bewahrt die ausdrückliche Verneinung seiner Verwirklichung.
- source_word: אָמַר יְהוָה
  choice: sagte Jahwe
  rationale: Das einfache Qatal von אמר wird ohne Verstärkung als Redeeinleitung wiedergegeben; „sagte“ entspricht dem Hebräischen genauer als das formelhaftere „spricht“ oder „erklärt“.
theological_decisions:
- issue: Menschlich gefasste Aussage über Gottes Reaktion in נִחַם יְהוָה
  choice: Jahwe nahm davon Abstand
  alternative: Jahwe änderte darüber seine Absicht; Jahwe bedauerte dies; es gereute Jahwe
  rationale: Die Übersetzung bewahrt die erzählte Rücknahme des angekündigten Gerichts als Reaktion auf die Fürbitte, ohne die Spannung durch eine dogmatische Erklärung aufzulösen oder Gott moralische Schuld zuzuschreiben. Die mögliche Bedeutung von Bedauern beziehungsweise einer Änderung der Absicht bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur des Hebräischen bleibt erhalten. „Jahwe“ bewahrt den Gottesnamen; die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
