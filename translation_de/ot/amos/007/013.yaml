base_translation:
  language: en
  yaml_path: translation/ot/amos/007/013.yaml
  text: But at Bethel you must not prophesy any longer[a], for it is the king’s sanctuary[b], and it is a royal house.
translation:
  language: de
  text: Aber in Bethel sollst du nicht länger weissagen[a]; denn es ist das Heiligtum des Königs und ein Haus des Königreichs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollst du nicht wieder weissagen“; auch möglich: „wirst du nicht länger weissagen“. Wörtlich: „füge nicht weiter hinzu zu weissagen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine königliche Einrichtung“. Wörtlich: „ein Haus des Königreichs“; gemeint ist vermutlich Bethel als Institution der Königsherrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֵית אֵל
  choice: Aber in Bethel
  rationale: Das ו führt Amazjas Rede fort und wirkt nach seiner Aufforderung, nach Juda zu fliehen, hier sinngemäß gegensätzlich. בֵּית אֵל wird als Ortsname verstanden; die Ortsangabe wird im Deutschen idiomatisch mit „in“ wiedergegeben.
- source_word: לֹא תוֹסִיף עוֹד לְהִנָּבֵא
  choice: sollst du nicht länger weissagen
  rationale: Die Verbindung von יסף im Hifil, עוֹד und Infinitiv bezeichnet Fortsetzung oder Wiederholung. „nicht länger weissagen“ gibt das Verbot knapp und natürlich wieder, ohne sich ausschließlich auf ein einmaliges erneutes Weissagen festzulegen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet Amazjas Begründung für das Verbot ein.
- source_word: מִקְדַּשׁ מֶלֶךְ
  choice: das Heiligtum des Königs
  rationale: מִקְדָּשׁ bezeichnet einen heiligen Ort beziehungsweise ein Heiligtum. Die Status-constructus-Verbindung mit „König“ wird formal transparent wiedergegeben und bezeichnet ein dem König zugeordnetes oder von ihm kontrolliertes Heiligtum.
- source_word: וּ/בֵית מַמְלָכָה
  choice: und ein Haus des Königreichs
  rationale: Die Wiedergabe bewahrt das Bild und die ungewöhnliche Status-constructus-Verbindung des Hebräischen. Sie lässt offen, ob vor allem eine königliche Einrichtung, ein staatliches Heiligtum oder ein institutionelles Zentrum der Monarchie gemeint ist.
- source_word: הוּא ... הוּא
  choice: es ist ... und [es ist]
  rationale: Das erste „es ist“ wird ausdrücklich wiedergegeben; beim zweiten Prädikat kann die Kopula im natürlichen Deutschen mitverstanden werden. Die parallele Aussage bleibt durch „und ein Haus des Königreichs“ erhalten.
theological_decisions:
- issue: Bezeichnung Bethels in Amazjas Rede
  choice: Die politisch-religiöse Zuordnung wird als „Heiligtum des Königs“ und „Haus des Königreichs“ beschrieben.
  alternative: „königliches Heiligtum“ und „staatlicher Tempel“
  rationale: Der Vers berichtet Amazjas Begründung, ohne die Legitimität des Kultes in Bethel theologisch zu bestätigen. Die gewählte Formulierung wahrt sowohl die institutionelle und politische Aussage als auch die Bildsprache des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Weissagen“ wahrt den prophetischen Fachbegriff, während Satzbau und Wortwahl für heutige Leser verständlich bleiben. Die ungewöhnliche Wendung „Haus des Königreichs“ wird wegen ihrer inhaltlichen Offenheit im Haupttext bewahrt und in der Fußnote erläutert.
