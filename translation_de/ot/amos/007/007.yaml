source:
  edition: WLC
  text: כֹּ֣ה הִרְאַ֔/נִי וְ/הִנֵּ֧ה אֲדֹנָ֛/י נִצָּ֖ב עַל חוֹמַ֣ת אֲנָ֑ךְ וּ/בְ/יָד֖/וֹ אֲנָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/007.yaml
  text: 'This is what he showed me: behold[a], the Lord was standing by a wall made with a plumb line, with a plumb line in his hand.'
translation:
  language: de
  text: 'Dies zeigte er mir: Siehe, der Herr stand an einer mit dem Lot errichteten Mauer[a], und in seiner Hand war ein Lot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf einer Lotmauer“. Die hebräische Wendung ist schwierig. Das seltene Wort אֲנָךְ bezeichnet wahrscheinlich ein Lot oder Senkblei; vorgeschlagen wurden auch die Materialien „Blei“ oder „Zinn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Dies
  rationale: Leitet den Visionsbericht mit demonstrativer Kraft ein; zusammen mit „zeigte er mir“ ergibt sich natürliches modernes Deutsch.
- source_word: הִרְאַנִי
  choice: zeigte er mir
  rationale: Der Hifil von ראה hat hier die kausative Bedeutung „zeigen“ und bezeichnet, was Amos in der Vision sehen durfte.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Bewahrt die deiktische Kraft und die feierliche Unmittelbarkeit der plötzlich vor Augen gestellten Szene.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Gibt den göttlichen Titel wieder, ohne ihn mit dem Gottesnamen gleichzusetzen.
- source_word: נִצָּב
  choice: stand
  rationale: Das Partizip schildert den Herrn als in der Vision dastehend; das deutsche Präteritum ist in einem erzählten Visionsbericht natürlich.
- source_word: עַל
  choice: an
  rationale: עַל kann „auf“, „an“ oder „bei“ bedeuten. „An“ ergibt in Verbindung mit der Mauer ein natürliches räumliches Bild, ohne die schwierige Wendung unnötig festzulegen.
- source_word: חוֹמַת אֲנָךְ
  choice: einer mit dem Lot errichteten Mauer
  rationale: Die schwierige Konstruktverbindung wird als Mauer verstanden, die mithilfe eines Lots lotrecht errichtet wurde; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: אֲנָךְ
  choice: Lot
  rationale: Im Zusammenhang mit Mauer und Hand bezeichnet das seltene Wort wahrscheinlich ein Lot beziehungsweise Senkblei zur Prüfung der senkrechten Ausrichtung.
- source_word: וּבְיָדוֹ אֲנָךְ
  choice: und in seiner Hand war ein Lot
  rationale: Gibt die hebräische Nominalwendung anschaulich und in natürlicher deutscher Satzfolge wieder.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels אֲדֹנָי
  choice: der Herr
  alternative: Herr
  rationale: Der hebräische Text verwendet den göttlichen Titel Adonaj, nicht das Tetragramm. „Der Herr“ ist hier die natürliche deutsche Wiedergabe und bewahrt den Unterschied zwischen Titel und Name.
- issue: Funktion des Lots in der Vision
  choice: Keine Deutung im Vers ergänzt
  alternative: Das Lot ausdrücklich als Instrument des göttlichen Gerichts oder der Prüfung bezeichnen
  rationale: Der Vers zeigt zunächst nur das visionäre Bild. Seine theologische Bedeutung wird erst im folgenden Kontext erläutert und soll hier nicht vorweggenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ bewahrt den feierlichen Visionsstil; „Lot“ ist knapp, geläufig und sachlich präzise. Die schwierige hebräische Verbindung und die mögliche räumliche Alternative werden nicht dogmatisch aufgelöst.
