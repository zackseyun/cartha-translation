id: AMO.7.15
reference: Amos 7:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקָּחֵ֣/נִי יְהוָ֔ה מֵ/אַחֲרֵ֖י הַ/צֹּ֑אן וַ/יֹּ֤אמֶר אֵלַ/י֙ יְהוָ֔ה לֵ֥ךְ הִנָּבֵ֖א אֶל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/015.yaml
  text: But Yahweh took me from following the flock[a], and Yahweh said to me, “Go[b], prophesy to my people Israel.”
translation:
  language: de
  text: 'Doch Jahwe holte mich von der Herde weg[a], und Jahwe sagte zu mir: »Geh, prophezeie meinem Volk Israel[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »von hinter der Herde weg«.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht »zu meinem Volk Israel«, nicht ausdrücklich »gegen mein Volk Israel«. Der Zusammenhang umfasst zwar Gerichtsworte, doch dieser Vers selbst legt die feindliche Richtung nicht fest.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵנִי
  choice: holte mich … weg
  rationale: לקח bedeutet grundsätzlich »nehmen«. In Verbindung mit מֵאַחֲרֵי bezeichnet es hier, dass Jahwe Amos aus seiner bisherigen Tätigkeit herausnahm. »Holte mich … weg« gibt dies im Deutschen natürlich und ohne die stärkere Vorstellung eines gewaltsamen Ergreifens wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben, der im modernen Deutschen üblichen Form des persönlichen Namens, statt ihn durch einen Titel zu ersetzen.
- source_word: מֵאַחֲרֵי הַצֹּאן
  choice: von der Herde weg
  rationale: Die Wendung bedeutet wörtlich »von hinter der Herde«. Die Hauptfassung formuliert die Herausnahme aus der Arbeit bei der Herde natürlich; die räumliche Bildhaftigkeit des hebräischen Ausdrucks bleibt in der Fußnote sichtbar.
- source_word: הַצֹּאן
  choice: die Herde
  rationale: צאן bezeichnet kollektiv Kleinvieh, meist Schafe und Ziegen. »Herde« wahrt den Sammelbegriff, ohne die Tierart unnötig einzuengen.
- source_word: וַיֹּאמֶר אֵלַי
  choice: sagte zu mir
  rationale: Dies ist eine direkte und registergerechte Wiedergabe von אמר mit אל.
- source_word: לֵךְ
  choice: Geh
  rationale: Der knappe Imperativ bewahrt die unmittelbare Kraft der Beauftragung.
- source_word: הִנָּבֵא
  choice: prophezeie
  rationale: Der Nifal-Imperativ von נבא bezeichnet das Reden als Prophet. »Prophezeie« ist präzise und im Deutschen verständlich.
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: meinem Volk Israel
  rationale: Der Dativ ist im Deutschen die natürliche Ergänzung zu »prophezeien« und gibt die Zielrichtung von אֶל wieder. Die Formulierung bewahrt zugleich Gottes Bundesbezeichnung »mein Volk« und fügt kein ausdrücklich gegen Israel gerichtetes Moment hinzu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im Ausgangstext steht der persönliche Gottesname. »Jahwe« erhält diesen als Namen und entspricht der üblichen deutschen Transliteration, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Richtung des prophetischen Auftrags an Israel
  choice: meinem Volk Israel prophezeien
  alternative: gegen mein Volk Israel prophezeien
  rationale: אֶל bezeichnet hier am natürlichsten die Ausrichtung der Rede auf Israel. Obwohl der Zusammenhang Gerichtsworte umfasst, sagt dieser Vers nicht ausdrücklich »gegen«; diese Spannung wird daher nicht aufgelöst oder verstärkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Doch« nimmt den Kontrast zum vorausgehenden Einspruch des Amos auf. Die direkte Rede bleibt knapp und befehlend; die Wiederholung von »Jahwe« folgt dem hebräischen Text.
