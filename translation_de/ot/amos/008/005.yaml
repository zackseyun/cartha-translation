base_translation:
  language: en
  yaml_path: translation/ot/amos/008/005.yaml
  text: saying[a], “When will the new moon be over, so that we may sell grain, and the Sabbath, so that we may offer wheat for sale—making the ephah small and the shekel large[b], and distorting deceitful scales?”
translation:
  language: de
  text: 'sie sagen[a]: »Wann ist der Neumond vorüber, damit wir Getreide verkaufen können, und wann der Sabbat, damit wir Getreide zum Verkauf anbieten können? Dann machen wir das Efa kleiner und den Schekel größer[b] und manipulieren betrügerische Waagen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Monat« statt »der Neumond«; der Zusammenhang spricht hier eher für die Neumondfeier als für den Kalendermonat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das Efa klein und den Schekel groß machen« – also weniger Ware geben und dafür eine höhere Zahlung verlangen.'
    reason: cultural_note
lexical_decisions:
- source_word: לֵאמֹר
  choice: sie sagen
  rationale: Der Infinitiv leitet den Inhalt der zuvor beschriebenen Haltung bzw. Rede ein; im Deutschen stellt das finite Präsens den Anschluss natürlich her.
- source_word: הַחֹדֶשׁ
  choice: der Neumond
  rationale: Im Zusammenhang mit der Handelsruhe bezeichnet חֹדֶשׁ am ehesten die Neumondfeier, nicht lediglich den Kalendermonat.
- source_word: וְנַשְׁבִּירָה שֶּׁבֶר
  choice: sodass wir Getreide verkaufen können
  rationale: Der Hifil von שׁבר bezeichnet hier den Verkauf von Getreide oder Vorräten; die Wiedergabe ist im Deutschen klar und idiomatisch.
- source_word: וְנִפְתְּחָה בָּר
  choice: sodass wir Weizen zum Verkauf anbieten können
  rationale: פתח mit בָּר beschreibt das Öffnen der Vorräte für den Verkauf. »Weizen« gibt die wahrscheinlich konkrete Ware wieder und wahrt eine gewisse Unterscheidung von שֶׁבֶר.
- source_word: לְהַקְטִין אֵיפָה
  choice: das Efa kleiner machen
  rationale: Die konkrete antike Maßeinheit und das Bild des betrügerisch verkleinerten Hohlmaßes bleiben erhalten.
- source_word: וּלְהַגְדִּיל שֶׁקֶל
  choice: den Schekel größer machen
  rationale: Die Formulierung bewahrt den hebräischen Parallelismus; gemeint ist ein überhöhtes Zahlungsgewicht und damit eine höhere Forderung.
- source_word: וּלְעַוֵּת מֹאזְנֵי מִרְמָה
  choice: die Waage zum Betrug verfälschen
  rationale: עוה trägt den Sinn von Verbiegen oder Verfälschen. Die deutsche Formulierung ist natürlich und bewahrt sowohl das manipulierte Messinstrument als auch die betrügerische Absicht.
theological_decisions:
- issue: Heilige Zeiten innerhalb der Anklage gegen wirtschaftliche Gier
  choice: Neumond und Sabbat als religiöse Fest- bzw. Ruhetage wiedergeben
  alternative: חֹדֶשׁ rein kalendarisch als »Monat« verstehen
  rationale: Die Händler sehnen das Ende der heiligen Unterbrechungen herbei, um wieder Geschäfte zu machen. Die kultische Bedeutung trägt die prophetische Kritik und sollte nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt scharf und verständlich; Efa und Schekel werden zur Wahrung des antiken Betrugsbildes beibehalten und in der Fußnote erklärt.
