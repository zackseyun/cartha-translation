id: AMO.8.10
reference: Amos 8:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָפַכְתִּ֨י חַגֵּי/כֶ֜ם לְ/אֵ֗בֶל וְ/כָל שִֽׁירֵי/כֶם֙ לְ/קִינָ֔ה וְ/הַעֲלֵיתִ֤י עַל כָּל מָתְנַ֨יִם֙ שָׂ֔ק וְ/עַל כָּל רֹ֖אשׁ קָרְחָ֑ה וְ/שַׂמְתִּ֨י/הָ֙ כְּ/אֵ֣בֶל יָחִ֔יד וְ/אַחֲרִיתָ֖/הּ כְּ/י֥וֹם מָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/010.yaml
  text: I will turn your feasts into mourning[a], and all your songs into lamentation; I will bring sackcloth on every waist and baldness on every head; I will make it like mourning for an only son[d][c][b], and its end like a bitter day.
translation:
  language: de
  text: Ich werde eure Feste[a] in Trauer verwandeln und all eure Lieder in Totenklage[b]. Ich werde jedem Sacktuch um die Hüften legen und jeden Kopf kahl machen. Ich werde es machen wie die Trauer um einen einzigen Sohn[c] und sein Ende wie einen bitteren Tag[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Festfeiern“; חַג kann besonders religiöse Feste bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Klagelied“. Das hebräische Wort bezeichnet eine förmliche, oft bei einem Todesfall angestimmte Klage.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „wie die Trauer um einen Einzigen“; gemeint ist wahrscheinlich die Trauer um einen einzigen Sohn, möglicherweise allgemeiner um ein einziges Kind.'
    reason: lexical_ambiguity
  - marker: d
    text: 'Oder: „wie ein Tag der Bitterkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: Ich werde … verwandeln
  rationale: הפך bezeichnet hier die Umwandlung eines Zustands in sein Gegenteil; „verwandeln“ gibt den Übergang von Festfreude zu Trauer natürlich wieder.
- source_word: חַגֵּיכֶם
  choice: eure Feste
  rationale: חַג bezeichnet gemeinschaftliche, oft religiöse Festfeiern. „Feste“ ist im modernen Deutsch knapp und verständlich.
- source_word: לְאֵבֶל
  choice: in Trauer
  rationale: אֵבֶל bezeichnet besonders die Trauer um Verstorbene und trägt sowohl emotionale als auch rituelle Bedeutung.
- source_word: שִׁירֵיכֶם
  choice: all eure Lieder
  rationale: Die direkte Wiedergabe bewahrt den umfassenden Parallelismus mit den Festen.
- source_word: לְקִינָה
  choice: in Totenklage
  rationale: קִינָה ist eine förmliche, häufig auf einen Todesfall bezogene Klage. „Totenklage“ erhält diese konkrete und feierlich-düstere Färbung.
- source_word: וְהַעֲלֵיתִי עַל כָּל מָתְנַיִם שָׂק
  choice: Ich werde allen Sacktuch um die Hüften legen
  rationale: Die idiomatische deutsche Formulierung bewahrt das Sacktuch an der Hüfte als öffentliches Trauerzeichen und die göttliche Verursachung.
- source_word: וְעַל כָּל רֹאשׁ קָרְחָה
  choice: und jeden Kopf kahl machen
  rationale: Die Ellipse setzt das verursachende Verb fort. „Kahl machen“ vermittelt das sichtbare Trauerzeichen natürlicher als das abstrakte „Kahlheit auf jeden Kopf“.
- source_word: וְשַׂמְתִּיהָ
  choice: Ich werde das Ganze … machen
  rationale: Der feminine Suffixbezug ist nicht eindeutig. „Das Ganze“ verweist auf die angekündigte Gesamtlage, ohne Land, Stadt oder Fest ausdrücklich zum alleinigen Bezug zu erklären.
- source_word: כְּאֵבֶל יָחִיד
  choice: zu einer Trauer … wie um einen einzigen Sohn
  rationale: יָחִיד bedeutet wörtlich „ein Einziger/einziges Kind“; in dieser Trauerformel ist gewöhnlich der einzige Sohn gemeint. Die Fußnote hält die lexikalische Offenheit fest.
- source_word: וְאַחֲרִיתָהּ
  choice: sein Ende
  rationale: אַחֲרִית bezeichnet Ende oder Ausgang. Das Pronomen greift die Gesamtlage auf, ohne einen bestimmten femininen Referenten festzulegen.
- source_word: כְּיוֹם מָר
  choice: zu einem bitteren Tag
  rationale: Die knappe Metapher „bitterer Tag“ bewahrt die emotionale Härte des Hebräischen.
theological_decisions:
- issue: Bezug der femininen Suffixe in וְשַׂמְתִּיהָ und וְאַחֲרִיתָהּ
  choice: „das Ganze“ und „sein Ende“ als Verweis auf die angekündigte Gesamtlage des Gerichts und der Trauer
  alternative: „sie/ihr“ mit ausdrücklichem Bezug auf das Land oder „es“ mit engem Bezug auf das Fest
  rationale: Das Hebräische lässt einen impliziten femininen kollektiven Bezug offen. Die deutsche Formulierung vermeidet es, Land, Stadt oder Fest als eindeutigen Bezug festzuschreiben.
- issue: Bedeutung von יָחִיד in der Trauerformel
  choice: „ein einziger Sohn“ im Haupttext
  alternative: „ein einziges Kind“ oder wörtlich „ein Einziger“
  rationale: Die feste prophetische Trauervorstellung zielt wahrscheinlich auf den Verlust des einzigen Sohnes; da יָחִיד selbst das Geschlecht hier nicht ausdrücklich bezeichnet, wird die weitere Möglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Der Parallelismus bleibt hörbar; rituelle Trauerzeichen werden ohne erklärende Zusätze im Haupttext wiedergegeben. Die etwas offene Referenz der hebräischen Suffixe wird nicht konfessionell oder dogmatisch vereindeutigt.
