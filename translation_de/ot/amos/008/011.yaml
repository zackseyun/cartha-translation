source:
  edition: WLC
  text: הִנֵּ֣ה יָמִ֣ים בָּאִ֗ים נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִשְׁלַחְתִּ֥י רָעָ֖ב בָּ/אָ֑רֶץ לֹֽא רָעָ֤ב לַ/לֶּ֨חֶם֙ וְ/לֹֽא צָמָ֣א לַ/מַּ֔יִם כִּ֣י אִם לִ/שְׁמֹ֔עַ אֵ֖ת דִּבְרֵ֥י יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/011.yaml
  text: Behold[a], days are coming, declares the Lord GOD, when I will send a famine on the land—not a famine for bread, nor a thirst for water, but for hearing the words of Yahweh.
translation:
  language: de
  text: 'Siehe, Tage kommen – Ausspruch des Herrn Jahwe –, da werde ich eine Hungersnot über das Land bringen: nicht Hunger nach Brot und nicht Durst nach Wasser, sondern danach, die Worte Jahwes zu hören.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sondern zum Hören der Worte Jahwes“. Der hebräische Infinitiv bezeichnet, worauf sich die bildliche Hungersnot bezieht; ob der fehlende Zugang zu Gottes Worten oder ihr tatsächliches Hören betont wird, bleibt offen.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Leitet eine feierliche prophetische Ankündigung ein und bewahrt deren aufmerksamkeitsheischende Kraft in würdigem, allgemein verständlichem Deutsch.
- source_word: יָמִים בָּאִים
  choice: Tage kommen
  rationale: Gibt die prophetische Zukunftsformel knapp und nahe am artikellosen Hebräisch wieder.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn JAHWE
  rationale: „Ausspruch“ bildet die prophetische Formel נְאֻם als Nennsatz ab; אֲדֹנָי wird mit „Herr“ und der Gottesname ausdrücklich mit „JAHWE“ wiedergegeben.
- source_word: וְהִשְׁלַחְתִּי
  choice: da werde ich … bringen
  rationale: Das einleitende „da“ verbindet die kommenden Tage idiomatisch mit Gottes angekündigtem Handeln; „bringen“ ist im Deutschen bei einer Hungersnot natürlicher als das wörtlichere „senden“.
- source_word: רָעָב
  choice: eine Hungersnot
  rationale: Bezeichnet hier eine das Land treffende Notlage, nicht bloß das Hungergefühl eines Einzelnen.
- source_word: בָּאָרֶץ
  choice: über das Land
  rationale: אֶרֶץ meint im Gerichtskontext am ehesten das betroffene Land; zusammen mit „bringen“ entspricht „über das Land“ natürlichem Deutsch.
- source_word: לֹא רָעָב לַלֶּחֶם
  choice: nicht eine Hungersnot nach Brot
  rationale: Bewahrt sowohl die Wiederholung von רָעָב als auch das konkrete Bild des Brotes, obwohl die Formulierung im Deutschen bewusst ungewöhnlich bleibt.
- source_word: וְלֹא צָמָא לַמַּיִם
  choice: und keinen Durst nach Wasser
  rationale: Erhält die parallele Verneinung und das konkrete Gegenbild zum Brot.
- source_word: כִּי אִם
  choice: sondern
  rationale: Markiert den ausschließenden Gegensatz zwischen leiblicher Not und dem tatsächlich angekündigten Mangel.
- source_word: לִשְׁמֹעַ
  choice: danach, … zu hören
  rationale: Gibt den Infinitiv eng wieder und lässt offen, ob vor allem der Zugang zu Gottes Worten oder ihr tatsächliches Vernehmen im Blick steht.
- source_word: דִּבְרֵי יְהוָה
  choice: die Worte JAHWES
  rationale: Bewahrt den hebräischen Plural „Worte“ und gibt den Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: 'JAHWE; in אֲדֹנָי יְהוִה: der Herr JAHWE'
  alternative: der HERR; der Herr, HERR
  rationale: Der Eigenname wird erkennbar und vom Titel אֲדֹנָי unterschieden; die Großschreibung macht die traditionelle besondere Behandlung des Tetragramms sichtbar, ohne den Namen durch einen Titel zu ersetzen.
- issue: Art der angekündigten Hungersnot
  choice: Eine ausdrücklich nicht auf Brot oder Wasser bezogene Hungersnot, sondern ein Mangel hinsichtlich des Hörens der Worte JAHWES
  alternative: Eine buchstäbliche Hungersnot, die zusätzlich geistliche Not mit sich bringt
  rationale: Der hebräische Gegensatz verneint Hunger nach Brot und Durst nach Wasser ausdrücklich. Die Übersetzung erklärt jedoch nicht über den Text hinaus, worin der Mangel des Hörens konkret besteht.
- issue: Bedeutungsumfang von לִשְׁמֹעַ
  choice: zu hören
  alternative: auf die Worte JAHWES zu hören / ihnen zu gehorchen
  rationale: Das hebräische Verb kann je nach Zusammenhang auch aufmerksames oder gehorsames Hören einschließen. Das einfache „hören“ bewahrt diese Spannung, ohne Gehorsam ausdrücklich in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles prophetisches Deutsch. „Siehe“ und „Ausspruch“ halten den feierlichen Ton; die Satzführung bleibt trotz der bewusst nah am Hebräischen gehaltenen Wiederholung von „Hungersnot“ verständlich.
