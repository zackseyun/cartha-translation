  text: שִׁמְעוּ זֹ֕את הַ/שֹּׁאֲפִ֖ים אֶבְי֑וֹן וְ/לַ/שְׁבִּ֖ית ענוי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/004.yaml
  text: Hear this[a], you who trample the needy and bring the poor of the land to an end,
translation:
  language: de
  text: Hört dies, ihr, die ihr die Bedürftigen niedertretet[a] und die Armen im Land verschwinden lasst!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr nach den Bedürftigen hechelt“ oder „die ihr die Bedürftigen verschlingt“. Das hebräische Partizip zeichnet ein eindringliches Bild gieriger Unterdrückung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Hört dies
  rationale: Der pluralische Imperativ mit Demonstrativpronomen bildet einen direkten prophetischen Aufruf. „Hört dies“ bewahrt seinen feierlichen und dringlichen Ton.
- source_word: הַשֹּׁאֲפִים
  choice: die ihr … niedertretet
  rationale: Das Partizip von שאף kann ein gieriges Hecheln, Schnappen oder Verschlingen bezeichnen und beschreibt hier bildhaft ausbeuterische Unterdrückung. „Niedertreten“ gibt im Deutschen die soziale Gewalt natürlich wieder; die enger am Bild liegenden Möglichkeiten stehen in der Fußnote.
- source_word: אֶבְיוֹן
  choice: die Bedürftigen
  rationale: אביון bezeichnet Menschen in wirtschaftlicher Not. „Bedürftige“ unterscheidet den Ausdruck von der folgenden Bezeichnung der Armen.
- source_word: וְלַשְׁבִּית
  choice: und … beseitigen wollt
  rationale: Der Hifil-Infinitiv von שבת bezeichnet das Veranlassen eines Aufhörens oder Verschwindens. In Verbindung mit ל kann er Ziel oder Absicht ausdrücken; „beseitigen wollt“ ist natürliches Deutsch und wahrt die auf Vernichtung zielende Absicht der Unterdrücker.
- source_word: ענוי אָרֶץ
  choice: die Armen des Landes
  rationale: Der Ausdruck bezeichnet im sozialen Zusammenhang des Amos die armen beziehungsweise bedrängten Menschen im Land. Der Genitiv „des Landes“ entspricht der hebräischen Fügung knapp und idiomatisch.
