  yaml_path: translation/ot/amos/008/006.yaml
  text: to buy the poor for silver[a], and the needy for a pair of sandals, and sell the sweepings of the grain.
translation:
  language: de
  text: um die Armen für Silber und den Bedürftigen für ein Paar Sandalen zu kaufen und den Abfall des Korns[a] zu verkaufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kornreste“, „den Kehricht des Getreides“ oder „das abgefallene Korn“. Das seltene hebräische Wort bezeichnet wahrscheinlich minderwertige Reste, die als Ware verkauft wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְנוֹת
  choice: zu kaufen
  rationale: Der Qal-Infinitiv von קנה führt die Absicht der Händler aus dem vorausgehenden Zusammenhang fort. „Kaufen“ gibt den wirtschaftlichen Sinn direkt wieder und lässt die Anspielung auf Schuldknechtschaft bestehen.
- source_word: בַּכֶּסֶף
  choice: für Silber
  rationale: בְּ bezeichnet hier den Kaufpreis. „Silber“ bewahrt das konkrete hebräische Wort und den prophetischen Sprachklang.
- source_word: דַּלִּים
  choice: die Armen
  rationale: דַּלִּים bezeichnet hier wirtschaftlich und gesellschaftlich Schwache; „die Armen“ ist in diesem Kontext natürlich und präzise.
- source_word: וְאֶבְיוֹן
  choice: und den Bedürftigen
  rationale: אֶבְיוֹן steht parallel zu דַּל, ohne völlig bedeutungsgleich zu sein. „Bedürftigen“ erhält diese Abstufung; der Singular des hebräischen Textes bleibt gewahrt.
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: für ein Paar Sandalen
  rationale: Die Wendung nennt den geringfügigen Preis, für den ein Bedürftiger ausgebeutet wird. Die duale Form נַעֲלַיִם wird idiomatisch als „ein Paar Sandalen“ wiedergegeben.
- source_word: וּמַפַּל בַּר
  choice: und den Abfall des Korns
  rationale: Das seltene מַפַּל bezeichnet vermutlich Abgefallenes, Reste oder Kehricht; בַּר bedeutet hier „Korn/Getreide“. „Abfall des Korns“ wahrt die Bildlichkeit und die lexikalische Unsicherheit, die in der Fußnote erläutert wird.
- source_word: נַשְׁבִּיר
  choice: zu verkaufen
  rationale: Der Hiphil von שׁבר bedeutet im Getreidehandel „verkaufen“. Der deutsche Infinitiv führt die von לִקְנוֹת eröffnete Absichtskonstruktion natürlich fort.
theological_decisions:
- issue: Art der Ausbeutung beim „Kaufen“ von Armen
  choice: Die konkrete Kaufsprache bleibt unaufgelöst stehen.
  alternative: Explizit als Versklavung wegen Schulden oder als wirtschaftliche Unterwerfung umschreiben.
  rationale: Der Zusammenhang legt Schuldknechtschaft beziehungsweise rücksichtslose wirtschaftliche Ausbeutung nahe, doch der Vers benennt den Mechanismus nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als abhängige Zweckangabe mit „um“ gestaltet, weil der Vers den Gedanken aus Amos 8,5 fortsetzt. Der Gedankenstrich hebt den abschließenden zusätzlichen Betrug hervor, ohne eine im Hebräischen nicht vorhandene Erklärung einzufügen.
