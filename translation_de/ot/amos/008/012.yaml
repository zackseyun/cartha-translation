id: AMO.8.12
reference: Amos 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָעוּ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/צָּפ֖וֹן וְ/עַד מִזְרָ֑ח יְשֽׁוֹטְט֛וּ לְ/בַקֵּ֥שׁ אֶת דְּבַר יְהוָ֖ה וְ/לֹ֥א יִמְצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/012.yaml
  text: They will wander from sea to sea[a], and from north to east; they will roam about seeking the word of Yahweh[b], but they will not find it.
translation:
  language: de
  text: Sie werden von Meer zu Meer und vom Norden bis zum Osten umherirren. Sie werden umherstreifen[a], um das Wort Jahwes[b] zu suchen, doch sie werden es nicht finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Sie werden hin und her laufen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „das Wort Jahwes“; gemeint ist eine göttliche Botschaft oder Offenbarung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: sie werden umherirren
  rationale: נוּעַ kann ein unstetes Wandern, Schwanken oder Taumeln bezeichnen. Im Zusammenhang der verzweifelten, weiträumigen Suche gibt „umherirren“ die Bewegung wieder, ohne ausdrücklich ein Taumeln etwa durch Trunkenheit einzutragen.
- source_word: מִיָּם עַד יָם
  choice: von Meer zu Meer
  rationale: Die geografische Wendung wird direkt und idiomatisch wiedergegeben, ohne die genannten Meere näher zu bestimmen.
- source_word: וּמִצָּפוֹן וְעַד מִזְרָח
  choice: und vom Norden bis zum Osten
  rationale: מִזְרָח bezeichnet den Osten beziehungsweise die Richtung des Sonnenaufgangs. Die Richtungsangaben bleiben in ihrer auffälligen, nicht symmetrisch ergänzten Form erhalten.
- source_word: יְשֹׁטְטוּ
  choice: sie werden umherstreifen
  rationale: Das Verb bezeichnet ein Hin-und-her-Ziehen beziehungsweise rastloses Durchstreifen; „umherstreifen“ ist im modernen Deutsch natürlich und bewahrt das Motiv der ruhelosen Suche.
- source_word: לְבַקֵּשׁ
  choice: um … zu suchen
  rationale: Die deutsche Infinitivkonstruktion bringt den Zweck der Bewegung klar zum Ausdruck.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die traditionelle prophetische Formulierung und die Bedeutungsweite von דָּבָר; im Kontext ist eine von Gott kommende Botschaft oder Offenbarung gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Form „Jahwe“ gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְלֹא יִמְצָאוּ
  choice: doch sie werden es nicht finden
  rationale: Das im Deutschen nötige Pronomen „es“ nimmt „das Wort Jahwes“ auf. „Doch“ verdeutlicht den im Zusammenhang liegenden Gegensatz, ohne den Sinn zu verändern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt diesen Eigennamen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bedeutung von דְּבַר יְהוָה
  choice: das Wort Jahwes
  alternative: die Botschaft Jahwes
  rationale: Die wörtlichere Wiedergabe lässt die im Ausdruck liegende Bedeutungsweite bestehen; eine Fußnote erläutert, dass im prophetischen Zusammenhang eine göttliche Botschaft oder Offenbarung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung zweier Verben der unsteten Bewegung wird bewahrt. Die ungewöhnliche geografische Folge „von Meer zu Meer … vom Norden bis zum Osten“ wird nicht harmonisiert oder erklärend erweitert.
