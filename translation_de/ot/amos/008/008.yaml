source:
  edition: WLC
  text: הַ֤/עַל זֹאת֙ לֹֽא תִרְגַּ֣ז הָ/אָ֔רֶץ וְ/אָבַ֖ל כָּל יוֹשֵׁ֣ב בָּ֑/הּ וְ/עָלְתָ֤ה כָ/אֹר֙ כֻּלָּ֔/הּ וְ/נִגְרְשָׁ֥ה ו/נשקה כִּ/יא֥וֹר מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/008.yaml
  text: Because of this[a], will not the land tremble, and every one who dwells in it mourn? All of it will rise like the Nile[b]; it will be driven along and sink like the Nile of Egypt.
translation:
  language: de
  text: Wird nicht deshalb das Land[a] erbeben und jeder, der darin wohnt, trauern? Es wird sich ganz wie der Nil[b] heben, fortgerissen werden und wie der Nil Ägyptens absinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erde“. Das hebräische אֶרֶץ kann beides bedeuten; hier ist wegen des betroffenen Gebiets und seiner Bewohner „das Land“ gewählt.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht zweimal der Vergleich mit dem Nil, zuletzt ausdrücklich mit dem „Nil Ägyptens“. Sein Anschwellen und anschließendes Absinken dient als Bild einer überwältigenden Erschütterung.
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל זֹאת
  choice: Sollte deswegen nicht
  rationale: Die Präposition עַל mit dem Demonstrativ bezeichnet den Anlass des angekündigten Gerichts. Zusammen mit הֲ und לֹא entsteht eine rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: תִרְגַּז
  choice: erbeben
  rationale: רגז kann Zittern, Beben oder heftige Erregung bezeichnen. Beim Land als Subjekt gibt „erbeben“ die konkrete Erschütterung und den Schrecken des Gerichts wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Zusammenhang mit seinen Bewohnern legt hier das vom Gericht betroffene Land nahe, ohne die weitere Bedeutung sprachlich auszuschließen.
- source_word: וְאָבַל
  choice: trauern
  rationale: אבל bezeichnet Trauer und Klage. „trauern“ ist im Deutschen natürlich und bewahrt den engen Zusammenhang zwischen der Erschütterung des Landes und dem Leid seiner Bewohner.
- source_word: כָל יוֹשֵׁב בָּהּ
  choice: jeder, der darin wohnt
  rationale: Die Formulierung gibt den distributiven Sinn von כָּל und den partizipialen Ausdruck יוֹשֵׁב in natürlichem Deutsch wieder.
- source_word: וְעָלְתָה כָאֹר כֻּלָּהּ
  choice: Es wird sich als Ganzes wie der Nil heben
  rationale: Das feminine Pronomen bezieht sich auf das ganze Land. אֹר bezeichnet hier angesichts des ausdrücklichen Ägyptenbezugs den Nil; das Bild ist sein Anschwellen.
- source_word: וְנִגְרְשָׁה
  choice: aufgewühlt werden
  rationale: Der Nifal von גרשׁ kann ein Getrieben- oder Fortgerissenwerden ausdrücken. Im Flussbild vermittelt „aufgewühlt werden“ die heftige, bewegte Flut, ohne eine wörtliche Vertreibung von Menschen einzutragen.
- source_word: וְנשקה
  choice: wieder absinken
  rationale: Im Parallelismus mit dem Sichheben des Nils bezeichnet das Verb das anschließende Sinken oder Zurückgehen. „wieder“ verdeutlicht die Abfolge, ohne einen zusätzlichen theologischen Gehalt einzuführen.
- source_word: כִּיאוֹר מִצְרָיִם
  choice: wie der Nil Ägyptens
  rationale: Die Wiedergabe benennt den gemeinten Strom ausdrücklich und folgt zugleich eng der hebräischen Genitivverbindung.
theological_decisions:
- issue: Rhetorische Frage über das kommende Gericht
  choice: Als Frage mit „Sollte … nicht“ wiedergegeben
  alternative: 'Als direkte Aussage formulieren: „Deswegen wird das Land erbeben“'
  rationale: Die hebräische Frageform erwartet zwar Zustimmung, stellt die Aussage aber bewusst als rhetorische Frage dar. Diese Spannung wird beibehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und das Bild vom steigenden und sinkenden Nil bleiben erhalten; erklärungsbedürftige Mehrdeutigkeit und kultureller Hintergrund werden knapp in Fußnoten ausgewiesen.
