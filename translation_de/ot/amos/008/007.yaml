source:
  edition: WLC
  text: נִשְׁבַּ֥ע יְהוָ֖ה בִּ/גְא֣וֹן יַעֲקֹ֑ב אִם אֶשְׁכַּ֥ח לָ/נֶ֖צַח כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/007.yaml
  text: 'Yahweh has sworn by the pride of Jacob: Surely I will never forget any of their deeds[a][b].'
translation:
  language: de
  text: 'Jahwe hat beim Stolz Jakobs geschworen: »Niemals werde ich auch nur eine ihrer Taten vergessen!«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei der Herrlichkeit Jakobs« oder »bei der Hoheit Jakobs«. Der hebräische Ausdruck kann ironisch das bezeichnen, worauf Jakob stolz ist, möglicherweise aber auch Gott als Jakobs wahre Herrlichkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Wenn ich auf ewig irgendeine ihrer Taten vergesse …« Das ist eine Schwurformel mit dem Sinn: »Niemals werde ich auch nur eine ihrer Taten vergessen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: hat geschworen
  rationale: Das Nifal von שׁבע bezeichnet hier das Ablegen eines Eides. Das Perfekt gibt die feierliche, als vollzogen dargestellte Schwurhandlung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: בִּגְאוֹן
  choice: beim Stolz
  rationale: גָּאוֹן kann Stolz, Hoheit, Herrlichkeit oder Erhabenheit bezeichnen. »Stolz« ist lexikalisch direkt und lässt die ironische oder doppeldeutige Aussage bestehen.
- source_word: יַעֲקֹב
  choice: Jakobs
  rationale: Der Eigenname wird beibehalten; hier bezeichnet »Jakob« zugleich das Bundesvolk.
- source_word: אִם אֶשְׁכַּח לָנֶצַח
  choice: Niemals werde ich … vergessen
  rationale: אִם eröffnet nach der Schwurformel einen verkürzten Selbstverwünschungssatz. Die idiomatische deutsche Wiedergabe drückt dessen nachdrücklich verneinende Kraft aus.
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: auch nur eine ihrer Taten
  rationale: Unter der Verneinung gibt »auch nur eine« den umfassenden, distributiven Sinn von כָּל idiomatisch wieder. »Taten« passt zum Gerichtskontext und vermeidet unnötige dogmatische Nebenbedeutungen.
theological_decisions:
- issue: Bedeutung von »Stolz Jakobs« in der Schwurformel
  choice: Die mehrdeutige Formulierung »beim Stolz Jakobs« bleibt im Haupttext erhalten.
  alternative: »bei der Herrlichkeit/Hoheit Jakobs«; oder Verständnis als Gottesbezeichnung für Jakob/Israel
  rationale: Der hebräische Ausdruck kann ironisch auf das verweisen, worauf Israel stolz ist, oder möglicherweise Gott als Jakobs wahre Herrlichkeit bezeichnen. Der Haupttext entscheidet diese Spannung nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Gottesrede steht in deutschen Anführungszeichen; »auch nur eine« verstärkt idiomatisch die ausnahmslose Aussage, ohne den Sinn zu erweitern.
