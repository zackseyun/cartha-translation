id: AMO.8.14
reference: Amos 8:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/נִּשְׁבָּעִים֙ בְּ/אַשְׁמַ֣ת שֹֽׁמְר֔וֹן וְ/אָמְר֗וּ חֵ֤י אֱלֹהֶ֨י/ךָ֙ דָּ֔ן וְ/חֵ֖י דֶּ֣רֶךְ בְּאֵֽר שָׁ֑בַע וְ/נָפְל֖וּ וְ/לֹא יָק֥וּמוּ עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/014.yaml
  text: Those who swear by the guilt of Samaria and say[a], ‘As your god, Dan, lives,’ and[c][b], ‘As the way of Beer-sheba lives,’ will fall and never rise again.
translation:
  language: de
  text: 'Die bei der Schuld Samarias[a] schwören und sagen: »So wahr dein Gott lebt, Dan!«[b] und: »So wahr der Weg von Beerscheba lebt!«[c], werden fallen und nicht wieder aufstehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei der Sünde Samarias«; manche verstehen den Ausdruck als Bezeichnung eines Götzen oder einer Gottheit, die mit Samaria verbunden war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »So wahr der Gott von Dan lebt!«'
    reason: lexical_alternative
  - marker: c
    text: Der »Weg von Beerscheba« kann den Pilgerweg nach Beerscheba oder die dortige Kultpraxis bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנִּשְׁבָּעִים
  choice: Die ... schwören
  rationale: Das substantivisch gebrauchte Partizip bezeichnet die Gruppe, die dem Gericht verfällt; ein deutscher Relativsatz gibt dies natürlich wieder.
- source_word: בְּאַשְׁמַת שֹׁמְרוֹן
  choice: bei der Schuld Samarias
  rationale: אַשְׁמָה bezeichnet gewöhnlich Schuld oder Verschuldung. Im kultischen Zusammenhang kann der Ausdruck metonymisch auf Samarias schuldbeladenen Kult oder Kultgegenstand weisen, ohne dass die Übersetzung dies vorschnell festlegt.
- source_word: חֵי
  choice: So wahr ... lebt
  rationale: Die feste hebräische Schwurformel wird durch die entsprechende natürliche deutsche Eidesformel wiedergegeben.
- source_word: אֱלֹהֶיךָ דָּן
  choice: dein Gott lebt, Dan
  rationale: Die knappe Syntax wird so bewahrt, dass Dan als angeredeter Ort verstanden werden kann; die ebenfalls mögliche Zuordnung des Gottes zu Dan wird in einer Fußnote genannt.
- source_word: דֶּרֶךְ בְּאֵר שָׁבַע
  choice: der Weg von Beerscheba
  rationale: דֶּרֶךְ bedeutet wörtlich Weg. Die ungewöhnliche kultische Wendung bleibt im Haupttext erhalten, während mögliche Deutungen als Pilgerweg oder Kultpraxis in der Fußnote stehen.
- source_word: וְנָפְלוּ
  choice: werden fallen
  rationale: Die prophetische Gerichtsankündigung wird mit deutschem Futur klar und unmittelbar wiedergegeben.
- source_word: וְלֹא יָקוּמוּ עוֹד
  choice: und nicht wieder aufstehen
  rationale: Die Formulierung bewahrt die Endgültigkeit des hebräischen לֹא ... עוֹד in natürlichem Deutsch.
theological_decisions:
- issue: Wesen der »Schuld Samarias«
  choice: Metonymischer Hinweis auf Samarias schuldhaften beziehungsweise götzendienerischen Kult, im Text als »Schuld Samarias« wiedergegeben
  alternative: »Sünde Samarias« oder ein Eigenname einer mit Samaria verbundenen Gottheit, »Aschima Samarias«
  rationale: Die gewöhnliche Bedeutung von אַשְׁמָה bleibt erhalten, ohne den kultischen Bezug auf eine bestimmte Gottheit festzulegen.
- issue: Bezug von דָּן in der Schwurformel
  choice: 'Dan als angeredeter Ort: »dein Gott ..., Dan«'
  alternative: »der Gott von Dan«
  rationale: Das Suffix der zweiten Person und die Wortstellung erlauben die Anrede Dans; da die knappe hebräische Konstruktion auch anders verstanden werden kann, wird die Alternative ausdrücklich vermerkt.
- issue: Bedeutung des »Weges von Beerscheba«
  choice: Die wörtliche, spannungsvolle Wendung bleibt im Haupttext stehen
  alternative: Pilgerweg nach Beerscheba oder Kult beziehungsweise Kultpraxis von Beerscheba
  rationale: Der hebräische Ausdruck ist im kultischen Zusammenhang mehrdeutig. Die Übersetzung löst diese Mehrdeutigkeit nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformeln sind idiomatisch deutsch gefasst, während die ungewöhnlichen und theologisch bedeutsamen Ausdrücke »Schuld Samarias« und »Weg von Beerscheba« bewusst nicht vereindeutigt werden.
