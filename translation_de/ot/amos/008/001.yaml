id: AMO.8.1
reference: Amos 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֥ה הִרְאַ֖/נִי אֲדֹנָ֣/י יְהוִ֑ה וְ/הִנֵּ֖ה כְּל֥וּב קָֽיִץ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], a basket of summer fruit.'
translation:
  language: de
  text: 'Dies zeigte mir der Herr Jahwe: Siehe, ein Korb mit Sommerfrüchten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Korb mit reifen Früchten“. Wörtlich steht im Hebräischen „Sommerfrüchte“; diese Formulierung bereitet das Klangspiel mit „Ende“ im nächsten Vers vor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Dies
  rationale: Gibt die demonstrative Einleitung der Visionsformel knapp und in natürlichem modernem Deutsch wieder.
- source_word: הִרְאַנִי
  choice: zeigte mir
  rationale: Die Hifil-Form von ראה bedeutet „sehen lassen, zeigen“; in einem Visionsbericht ist „zeigte mir“ klar und idiomatisch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Bewahrt sowohl den Titel אֲדֹנָי („Herr“) als auch den im Text stehenden Gottesnamen יהוה, in der im Deutschen üblichen Form „Jahwe“.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Erhält die lebhafte, hinweisende Funktion des Ausdrucks bei der plötzlichen Präsentation des Visionsgegenstands; das verbindende ו ist nach dem Doppelpunkt im Deutschen nicht eigens wiederzugeben.
- source_word: כְּלוּב
  choice: Korb
  rationale: Der Zusammenhang mit Früchten legt hier einen Korb und nicht die andernorts mögliche Bedeutung „Käfig“ nahe.
- source_word: קָיִץ
  choice: Sommerfrüchte
  rationale: Bezeichnet im Sommer geerntete, reife Früchte und bewahrt soweit möglich die Grundlage des hebräischen Klangspiels mit קֵץ („Ende“) im folgenden Vers.
theological_decisions:
- issue: Wiedergabe der zusammengesetzten Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Fassung unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und gibt beide Bestandteile wieder, ohne den Namen durch einen weiteren Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Siehe“ ist bewusst als gehobenes prophetisches Signal beibehalten; Satzbau und Wortwahl bleiben ansonsten unmittelbar verständlich.
