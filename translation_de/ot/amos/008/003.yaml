  to: An jenem Tag werden die Lieder des Palastes[a] zu Klagegeschrei werden – Ausspruch des Herrn Jahwe. Zahlreich sind die Leichen; überall wird man sie hinwerfen. Still![b]
  rationale: Die Revision glättet zwei deutsche Formulierungen, ohne den Sinn oder die bewusst erhaltene Mehrdeutigkeit von הֵיכָל zu verändern. Sie bewahrt die knappe, schockierende Syntax des Verses, den unbestimmten Handelnden bei der Beseitigung der Leichen und den scharfen Schlussruf.
