source:
  edition: WLC
  text: וְ/הֵילִ֜ילוּ שִׁיר֤וֹת הֵיכָל֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה רַ֣ב הַ/פֶּ֔גֶר בְּ/כָל מָק֖וֹם הִשְׁלִ֥יךְ הָֽס־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/003.yaml
  text: And the songs of the palace will become wailing in that day[a], declares the Lord GOD. Many will be the corpses[b]; in every place they will throw them out—silence!
translation:
  language: de
  text: An jenem Tag werden die Lieder des Palastes[a] zu Klagegeschrei werden – Ausspruch des Herrn Jahwe. Zahlreich sind die Leichen; überall wird man sie hinwerfen. Still![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Tempels“. Das hebräische Wort הֵיכָל kann sowohl „Palast“ als auch „Tempel“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Ruhe!“ oder „Schweigt!“. Der hebräische Ruf הָס fordert scharf zum Schweigen auf und kann Entsetzen oder erschrockene Stille ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵילִילוּ
  choice: Dann werden … zu Klagegeheul werden
  rationale: Die Form bezeichnet hier das Umschlagen der Lieder in lautes Klagen. Die deutsche Wendung bewahrt sowohl die Verwandlung als auch die Eindringlichkeit des hebräischen Verbs.
- source_word: שִׁירוֹת
  choice: die Lieder
  rationale: Der konkrete Plural wird direkt und natürlich wiedergegeben.
- source_word: הֵיכָל
  choice: des Palastes
  rationale: הֵיכָל kann Palast oder Tempel bezeichnen. Im Gerichtskontext des Amosbuches ist „Palast“ gut begründbar; die echte lexikalische Alternative bleibt in einer Fußnote erhalten.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitformel.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: „Ausspruch“ bewahrt den nominalen Charakter von נְאֻם und den feierlichen prophetischen Ton. „Herr Jahwe“ gibt beide Bestandteile des Gottesnamens wieder, ohne sie miteinander zu verschmelzen.
- source_word: רַב הַפֶּגֶר
  choice: Zahlreich sind die Leichen
  rationale: רַב wird quantitativ verstanden, während der singularische Ausdruck für den Leichnam im Deutschen kontextgemäß als kollektiver Plural erscheint.
- source_word: בְּכָל מָקוֹם
  choice: überall
  rationale: Das idiomatische deutsche „überall“ gibt die distributive Bedeutung „an jedem Ort“ knapp wieder.
- source_word: הִשְׁלִיךְ
  choice: wirft man sie hin
  rationale: Die morphologisch singularische Verbform wird als unpersönliche Handlung verstanden. „Man“ bewahrt diese Unbestimmtheit; „sie“ nimmt die zuvor genannten Leichen als im Hebräischen unausgesprochenes Objekt auf.
- source_word: הָס
  choice: Still!
  rationale: Der abrupte Schweigeruf wird mit einem ebenso knappen und scharfen deutschen Zuruf wiedergegeben.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: GOTT, der Herr
  rationale: Die gewählte Form macht sowohl den Titel אֲדֹנָי als auch den Eigennamen יהוה sichtbar und vermeidet die doppelte Wiedergabe als „Herr“. Die traditionelle Ersatzform „GOTT, der Herr“ ist möglich, verdeckt jedoch den Eigennamen.
- issue: Bezug von הֵיכָל
  choice: Palast
  alternative: Tempel
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Palast“ passt zum sozialen und politischen Gerichtskontext, doch der mögliche Bezug auf den Tempel wird ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Wucht. Kurze Hauptsätze und der abschließende Einwortsatz erhalten die erschütternde, abgehackte Wirkung des Hebräischen.
