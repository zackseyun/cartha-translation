    rationale: „zu Klagegeheul werden werden“ ist zwar verständlich, aber im modernen Standarddeutsch stilistisch unnötig schwerfällig.
  - severity: low
    issue: Uneinheitlicher Zeitbezug
    rationale: Das präsentische „wirft man sie hin“ folgt auf eine Zukunftsaussage. Das Hebräische kann prophetisch formuliert sein; im deutschen Zieltext stellt „wird man sie hinwerfen“ den erwarteten Gerichtsvollzug klar und einheitlich dar.
  - severity: low
    issue: Überdehnte Erläuterung zu הָס
    rationale: „Ehrfürchtige Scheu“ ist in diesem Kontext keine gleichwertig naheliegende Deutung. Die Notiz sollte bei der schockierten oder entsetzten Stille bleiben.
