  source_fidelity: 'Die Grundstruktur und die wichtigsten Bilder sind zutreffend wiedergegeben: die Lieder, das mögliche Verständnis von הֵיכָל als Palast, der Gerichtstag, die vielen Leichen, das unpersönliche Wegwerfen und der abrupte Schlussruf. Die Übersetzung sollte jedoch den Zukunftsbezug bei der Entsorgung der Leichen einheitlich ausdrücken und die Wendung für das Umschlagen der Lieder idiomatischer formulieren.'
  naturalness: „werden … zu Klagegeheul werden“ ist wegen der Wiederholung von „werden“ schwerfällig. „zu Klagegeschrei werden“ ist klarer und bewahrt das Bild der in Wehklage verwandelten Lieder. Nach dem futurischen ersten Satz ist „wird man sie hinwerfen“ im Deutschen konsistenter als das präsentische „wirft man sie hin“.
  terminology: „Herr Jahwe“ gibt אֲדֹנָי יְהוִה nachvollziehbar als Titel plus Eigenname wieder. „Palast“ ist als Haupttext angesichts der echten lexikalischen Mehrdeutigkeit von הֵיכָל vertretbar, sofern „Tempel“ als Alternative vermerkt bleibt. Der abschließende Ruf wird treffend knapp mit „Still!“ wiedergegeben; die Fußnote sollte „ehrfürchtige Scheu“ nicht als naheliegende Bedeutung behaupten, da hier vor allem erschrockene bzw. entsetzte Stille im Blick steht.
  issues:
