source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הֵבֵאתִ֥י הַ/שֶּׁ֖מֶשׁ בַּֽ/צָּהֳרָ֑יִם וְ/הַחֲשַׁכְתִּ֥י לָ/אָ֖רֶץ בְּ/י֥וֹם אֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/009.yaml
  text: And it shall happen in that day[a], declares the Lord GOD, that I will make the sun go down at noon, and I will darken the earth in broad daylight.
translation:
  language: de
  text: 'Und an jenem Tag wird es geschehen – Ausspruch des Herrn Jahwe –: Ich lasse die Sonne am Mittag untergehen und verfinstere die Erde[a] am helllichten Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Land. Das hebräische Wort אֶרֶץ kann sowohl die Erde insgesamt als auch ein bestimmtes Land bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird es geschehen
  rationale: Die prophetische Zukunftsformel wird in natürlichem, zugleich feierlichem Deutsch wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Bewahrt die typische prophetische Zeitangabe, ohne unnötig altertümlich zu klingen.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn Jahwe
  rationale: נְאֻם kennzeichnet einen göttlichen Ausspruch; אֲדֹנָי wird als Titel „Herr“ und der Gottesname יהוה als „Jahwe“ wiedergegeben.
- source_word: וְהֵבֵאתִי הַשֶּׁמֶשׁ
  choice: Ich lasse die Sonne … untergehen
  rationale: Der Hifil von בוא bezeichnet hier das Veranlassen des Sonnenuntergangs; die Formulierung wahrt Gottes unmittelbare Urheberschaft.
- source_word: בַּצָּהֳרָיִם
  choice: am Mittag
  rationale: Klare und genaue Wiedergabe der ungewöhnlichen Zeit des angekündigten Sonnenuntergangs.
- source_word: וְהַחֲשַׁכְתִּי
  choice: und verfinstere
  rationale: Das kausative Verb wird knapp und idiomatisch wiedergegeben.
- source_word: לָאָרֶץ
  choice: die Erde
  rationale: Die kosmische Bildsprache legt „Erde“ nahe; die ebenso mögliche örtliche Bedeutung „Land“ bleibt in einer Fußnote erhalten.
- source_word: בְּיוֹם אוֹר
  choice: am helllichten Tag
  rationale: Die deutsche Wendung bringt den betonten Gegensatz zwischen Licht und der angekündigten Finsternis natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe der Verbindung אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: GOTT, der Herr; Herr, der HERR
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und vermeidet die missverständliche Doppelung „Herr HERR“.
- issue: Reichweite der angekündigten Verfinsterung
  choice: Erde
  alternative: Land
  rationale: Das Bild von der am Mittag untergehenden Sonne kann kosmisch verstanden werden, doch אָרֶץ lässt auch eine auf das Land bezogene Lesart zu; diese Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Der Gedankenstrich hebt die Botenformel ab; „am helllichten Tag“ gibt die pointierte Umkehrung des hebräischen Ausdrucks idiomatisch wieder.
