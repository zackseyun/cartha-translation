  text: וַ/יֹּ֗אמֶר מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר כְּל֣וּב קָ֑יִץ וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בָּ֤א הַ/קֵּץ֙ אֶל עַמִּ֣/י יִשְׂרָאֵ֔ל לֹא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/002.yaml
  text: And he said[a], “What do you see, Amos?” And I said, “A basket of summer fruit.” Then Yahweh said to me, “The end has come upon my people Israel[b]; I will not again pass by them.”
translation:
  language: de
  text: 'Und er sagte: „Was siehst du, Amos?“ Ich sagte: „Einen Korb mit Sommerfrüchten[a].“ Da sagte Jahwe zu mir: „Das Ende ist über mein Volk Israel gekommen. Ich werde nicht mehr an ihm vorübergehen.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Wörter für „Sommerfrüchte“ und „das Ende“ klingen ähnlich. Dieses Wortspiel verbindet die Vision mit der folgenden Gerichtsankündigung.
    reason: cultural_note
  - marker: b
    text: 'Oder sinngemäß: „Ich werde es nicht mehr verschonen“ beziehungsweise „Ich werde nicht mehr darüber hinwegsehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Das narrative Wayyiqtol von אמר wird schlicht wiedergegeben; das nicht ausdrücklich genannte Subjekt bleibt wie im Hebräischen unbestimmt und wird nicht interpretierend ergänzt.
- source_word: מָה אַתָּה רֹאֶה
  choice: Was siehst du
  rationale: Die deutsche Präsensform gibt das Partizip רֹאֶה in der unmittelbaren Frage einer Vision natürlich wieder.
- source_word: כְּלוּב קָיִץ
  choice: einen Korb mit Sommerfrüchten
  rationale: כְּלוּב bezeichnet hier einen Korb oder Behälter, קָיִץ Sommerfrüchte. Die konkrete Wiedergabe bewahrt die Grundlage des hebräischen Wortspiels mit קֵץ.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: בָּא הַקֵּץ
  choice: Das Ende ist … gekommen
  rationale: Das Perfekt בָּא bezeichnet die bereits eingetretene Ankunft des bestimmten Endes und erhält den Nachdruck der prophetischen Ankündigung.
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: über mein Volk Israel
  rationale: Im Gerichtszusammenhang gibt „über“ mit „gekommen“ die gegen das Volk gerichtete Ankunft idiomatisch wieder, ohne das Gericht zusätzlich auszudeuten.
- source_word: לֹא אוֹסִיף עוֹד
  choice: Ich werde nicht noch einmal
  rationale: Die Verbindung bezeichnet das Ende einer bisher wiederholten oder fortgesetzten Handlung.
- source_word: עֲבוֹר לוֹ
  choice: an ihm vorübergehen
  rationale: Die Formulierung bewahrt das Bild von עבר. Das singularische Pronomen bezieht sich grammatisch auf das kollektiv verstandene „Volk“; die mögliche Bedeutung „verschonen“ wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als Eigenname wahrt diese Unterscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Gerichtsbedeutung von עֲבוֹר לוֹ
  choice: Ich werde nicht noch einmal an ihm vorübergehen
  alternative: Ich werde es nicht noch einmal verschonen
  rationale: Die Hauptfassung erhält das konkrete und theologisch spannungsvolle Bild des hebräischen Verbs. Die im Zusammenhang wahrscheinliche Bedeutung des Endes göttlicher Schonung wird als mögliche Lesart in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der hebräische Erzählfluss bleibt erkennbar; ungenannte Bezüge und die Bildsprache werden nicht unnötig aufgelöst. Das hebräische Wortspiel ist im Deutschen nicht nachbildbar und wird deshalb erläutert.
