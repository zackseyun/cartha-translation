  text: בַּ/יּ֨וֹם הַ/ה֜וּא תִּ֠תְעַלַּפְנָה הַ/בְּתוּלֹ֧ת הַ/יָּפ֛וֹת וְ/הַ/בַּחוּרִ֖ים בַּ/צָּמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/013.yaml
  text: In that day the beautiful virgins and the young men will faint from thirst[a].
translation:
  language: de
  text: An jenem Tag werden die schönen Jungfrauen und die jungen Männer vor Durst in Ohnmacht sinken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden vor Durst verschmachten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Gibt die prophetische Zeitformel und den demonstrativen Nachdruck des Hebräischen natürlich und präzise wieder.
- source_word: תִּתְעַלַּפְנָה
  choice: werden … ohnmächtig werden
  rationale: Der Hitpael von עלף bezeichnet das Schwach- oder Ohnmächtigwerden; die Formulierung ist im modernen Deutsch klar und bewahrt die körperliche Wirkung des Durstes.
- source_word: הַבְּתוּלֹת
  choice: die jungen Frauen
  rationale: בְּתוּלָה kann eine Jungfrau beziehungsweise eine junge unverheiratete Frau bezeichnen. Im Deutschen ist „junge Frauen“ hier natürlich und vermeidet eine unnötige Hervorhebung des sexuellen Status; die engere Wiedergabe wird in der Fußnote genannt.
- source_word: הַיָּפוֹת
  choice: die schönen
  rationale: Gibt das attributive Adjektiv יָפָה direkt und in gegenwärtigem Standarddeutsch wieder.
- source_word: וְהַבַּחוּרִים
  choice: und die jungen Männer
  rationale: בָּחוּר bezeichnet gewöhnlich junge Männer in der Blüte ihrer Kraft; diese Wiedergabe ist präzise und idiomatisch.
- source_word: בַּצָּמָא
  choice: vor Durst
  rationale: Das בְּ bezeichnet hier Ursache beziehungsweise Zustand. „Vor Durst“ ist die natürliche deutsche Verbindung mit „ohnmächtig werden“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt den Kontrast, dass selbst schöne junge Frauen und kräftige junge Männer der Not erliegen.
