source:
  edition: WLC
  text: וּ/נְשָׂאתֶ֗ם אֵ֚ת סִכּ֣וּת מַלְכְּ/כֶ֔ם וְ/אֵ֖ת כִּיּ֣וּן צַלְמֵי/כֶ֑ם כּוֹכַב֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר עֲשִׂיתֶ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/026.yaml
  text: And you carried Sikkuth your king[a], and Kiyyun your images, the star of your god[c][b], which you made for yourselves.
translation:
  language: de
  text: Und ihr habt Sikkut, euren König[a], getragen und Kijun[b], eure Bilder, den Stern eures Gottes[c], den ihr euch gemacht habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euren Molech“. Im Hebräischen steht „euren König“; viele Ausleger verstehen dies jedoch als Hinweis auf die Gottheit Molech/Moloch. Diese Deutung spiegelt sich auch in Apostelgeschichte 7,43 wider.'
    reason: alternative_reading
  - marker: b
    text: Sikkut und Kijun sind seltene Namen, die wahrscheinlich mit Sternkult verbunden sind; ihre genaue Identität ist unsicher.
    reason: cultural_note
  - marker: c
    text: 'Oder möglicherweise: „den Stern eurer Götter“. Die hebräische Form kann sowohl den Singular „eures Gottes“ als auch den Plural „eurer Götter“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשָׂאתֶם
  choice: Und ihr habt … getragen
  rationale: Das Qal Perfekt 2. Person Plural von נשׂא mit ו wird als Fortführung des Vorwurfs wiedergegeben. „Getragen“ bezeichnet hier natürlich das Mitführen von Kultgegenständen.
- source_word: סִכּוּת
  choice: Sikkut
  rationale: Das seltene und unsicher zu deutende Wort wird wegen seiner wahrscheinlichen Funktion als Eigenname transliteriert, statt durch eine spekulative Deutung ersetzt zu werden.
- source_word: מַלְכְּכֶם
  choice: euren König
  rationale: Der masoretisch punktierte Text bedeutet unmittelbar „euren König“. Eine mögliche Deutung als Gottesname Molech/Moloch wird in der Fußnote genannt.
- source_word: כִּיּוּן
  choice: Kijun
  rationale: Der seltene, vermutlich mit Astralkult verbundene Eigenname wird in einer für deutsche Leser geeigneten Form transliteriert.
- source_word: צַלְמֵיכֶם
  choice: eure Bilder
  rationale: „Bilder“ gibt צֶלֶם breit und textnah wieder, ohne durch „Götzenbilder“ die im Zusammenhang naheliegende Wertung ausdrücklich in das Substantiv einzutragen.
- source_word: כּוֹכַב אֱלֹהֵיכֶם
  choice: den Stern eures Gottes
  rationale: Die masoretische Punktierung stützt den Singular „eures Gottes“. Die appositionelle Beziehung zu den vorher genannten Kultgegenständen bleibt erhalten.
- source_word: אֲשֶׁר עֲשִׂיתֶם לָכֶם
  choice: den ihr euch gemacht habt
  rationale: Der Relativsatz wird im Deutschen auf „Stern“ bezogen und bewahrt mit „euch“ die reflexive Bedeutung von לָכֶם.
theological_decisions:
- issue: Ist מַלְכְּכֶם als gewöhnliches Substantiv oder als Name Molech/Moloch zu verstehen?
  choice: euren König
  alternative: euren Molech; Moloch, euren König
  rationale: Der masoretische Text liest unmittelbar „euren König“ und schreibt hier nicht eindeutig den Gottesnamen Molech. Die traditionsreiche alternative Deutung, die auch mit Apostelgeschichte 7,43 verbunden ist, bleibt in einer Fußnote sichtbar.
- issue: Sollen סִכּוּת und כִּיּוּן gedeutet oder als Namen transliteriert werden?
  choice: Sikkut und Kijun
  alternative: Sikkut als „Heiligtum“ wiedergeben oder beide Namen unmittelbar mit bestimmten Astralgottheiten identifizieren
  rationale: Beide Ausdrücke sind selten und in ihrer genauen Identifikation unsicher. Die Transliteration bewahrt diese Unsicherheit und vermeidet eine übermäßig bestimmte kultgeschichtliche Deutung.
- issue: Steht אֱלֹהֵיכֶם hier im Singular oder im Plural?
  choice: eures Gottes
  alternative: eurer Götter
  rationale: Die masoretische Punktierung unterstützt den Singular. Die grammatisch mögliche beziehungsweise textgeschichtlich erwogene Pluraldeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche appositionelle Reihung des Hebräischen wird weitgehend bewahrt, damit die Beziehungen zwischen den Kultnamen, Bildern und dem Stern nicht stärker als im Ausgangstext festgelegt werden.
