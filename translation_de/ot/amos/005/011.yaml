  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֠/כֵן יַ֣עַן בּוֹשַׁסְ/כֶ֞ם עַל דָּ֗ל וּ/מַשְׂאַת בַּר֙ תִּקְח֣וּ מִמֶּ֔/נּוּ בָּתֵּ֥י גָזִ֛ית בְּנִיתֶ֖ם וְ/לֹא תֵ֣שְׁבוּ בָ֑/ם כַּרְמֵי חֶ֣מֶד נְטַעְתֶּ֔ם וְ/לֹ֥א תִשְׁתּ֖וּ אֶת יֵינָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/011.yaml
  text: Therefore[a], because you trample on the poor and take a grain tax from him, you have built houses of cut stone, but you will not live in them; you have planted delightful vineyards[c][b], but you will not drink their wine.
translation:
  language: de
  text: 'Darum, weil ihr die Armen niedertretet und von ihnen eine Getreideabgabe nehmt[a]: Häuser aus behauenen Steinen[b] habt ihr gebaut, doch ihr werdet nicht darin wohnen; prächtige Weinberge[c] habt ihr gepflanzt, doch ihren Wein werdet ihr nicht trinken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihnen Getreide als Abgabe auferlegt“. Der hebräische Ausdruck bezeichnet eine Last oder Abgabe, die aus Getreide besteht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Häuser aus zugerichtetem Stein“ oder „Häuser aus behauenem Stein“. Gemeint sind sorgfältig bearbeitete Bausteine.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „begehrenswerte“, „kostbare“ oder „liebliche Weinberge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן יַעַן
  choice: 'Darum: Weil'
  rationale: Die Kombination bewahrt sowohl die Folgerung des Gerichtswortes als auch die anschließende Begründung. Der Doppelpunkt gibt die hebräische Satzführung im Deutschen klar wieder.
- source_word: בּוֹשַׁסְכֶם עַל דָּל
  choice: ihr die Armen niedertretet
  rationale: „Niedertreten“ erhält das drastische Bild gewaltsamer Unterdrückung; „die Armen“ gibt דָּל kollektiv und im Deutschen idiomatisch wieder.
- source_word: וּמַשְׂאַת בַּר תִּקְחוּ מִמֶּנּוּ
  choice: und von ihnen eine Getreideabgabe nehmt
  rationale: מַשְׂאַת בַּר bezeichnet eine auferlegte Last beziehungsweise Abgabe aus Getreide. Die Formulierung bleibt verständlich, ohne die genaue rechtliche Art der Abgabe festzulegen.
- source_word: בָּתֵּי גָזִית
  choice: Häuser aus behauenen Steinen
  rationale: גָזִית bezeichnet zugerichtete, behauene Bausteine und deutet kostspieliges Bauen an, ohne ausdrücklich „Paläste“ oder „Villen“ zu sagen.
- source_word: וְלֹא תֵשְׁבוּ בָם
  choice: doch ihr werdet nicht darin wohnen
  rationale: „Wohnen“ ist die natürliche moderne Entsprechung von יָשַׁב im Zusammenhang mit Häusern; „doch“ hebt die angekündigte Umkehr hervor.
- source_word: כַּרְמֵי חֶמֶד
  choice: prächtige Weinberge
  rationale: חֶמֶד beschreibt etwas Begehrenswertes, Ansprechendes oder Kostbares. „Prächtig“ vermittelt die besondere Güte und Attraktivität idiomatisch.
- source_word: וְלֹא תִשְׁתּוּ אֶת יֵינָם
  choice: doch ihren Wein werdet ihr nicht trinken
  rationale: 'Die Voranstellung von „ihren Wein“ bewahrt die pointierte Ironie: Den erwarteten Ertrag der selbst gepflanzten Weinberge werden sie nicht genießen.'
theological_decisions:
- issue: Charakter der Gerichtsankündigung
  choice: 'Konkrete prophetische Ankündigung einer Umkehrung: Ausbeuterisch erworbener Wohlstand wird seinen Besitzern nicht zugutekommen.'
  alternative: Allgemeine moralische Lebensregel über die Folgen von Ungerechtigkeit.
  rationale: Die direkte Anrede und die bestimmten Futurformen kennzeichnen ein angekündigtes Gericht, nicht bloß eine zeitlose Beobachtung.
- issue: Bezug des Singulars דָּל und מִמֶּנּוּ
  choice: Kollektivisch als „die Armen“ und „von ihnen“ wiedergegeben.
  alternative: 'Formal singularisch: „den Armen“ und „von ihm“.'
  rationale: Der hebräische Singular kann die gesellschaftliche Gruppe typisierend bezeichnen. Der deutsche Plural klingt natürlich und wahrt den kollektiven Sinn, ohne die persönliche Dimension der Ausbeutung aufzuheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Schärfe. Die konkrete Metapher des Niedertretens und der Gegensatz zwischen luxuriösem Bauen beziehungsweise Pflanzen und versagtem Genuss bleiben erhalten. Die Satzstruktur ist klar, ohne den Parallelismus zu glätten.
