reference: Amos 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֹשֵׂ֨ה כִימָ֜ה וּ/כְסִ֗יל וְ/הֹפֵ֤ךְ לַ/בֹּ֨קֶר֙ צַלְמָ֔וֶת וְ/י֖וֹם לַ֣יְלָה הֶחְשִׁ֑יךְ הַ/קּוֹרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/008.yaml
  text: He who made the Pleiades and Orion[a], and turns deep darkness into morning, and darkens day into night[b], who calls for the waters of the sea and pours them out over the face of the earth—Yahweh is his name.
translation:
  language: de
  text: Er, der das Siebengestirn und den Orion macht, der tiefe Finsternis in Morgen verwandelt und den Tag zur Nacht verfinstert, der die Wasser des Meeres herbeiruft und sie über die Erde ausgießt – Jahwe[a] ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, gewöhnlich als „Jahwe“ wiedergegeben.
    reason: divine_name
lexical_decisions:
- source_word: עֹשֵׂה
  choice: Er, der … geschaffen hat
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet Gott durch sein schöpferisches Handeln. Im Deutschen gibt ein Relativsatz dies natürlich und würdig wieder; das Perfekt stellt die Erschaffung der Gestirne als vollzogene Tat dar.
- source_word: כִימָה
  choice: das Siebengestirn
  rationale: כִימָה wird traditionell und plausibel mit den Plejaden identifiziert. „Siebengestirn“ ist die geläufige deutsche Bezeichnung und passt zum gehobenen poetischen Register.
- source_word: כְסִיל
  choice: den Orion
  rationale: In der astronomischen Verbindung mit כִימָה bezeichnet das Wort am ehesten das Sternbild Orion; die Grundbedeutung „Tor“ ist hier nicht gemeint.
- source_word: וְהֹפֵךְ
  choice: der … verwandelt
  rationale: Das Partizip beschreibt fortdauerndes göttliches Wirken. „Verwandelt“ bildet die kosmische Umkehrung klar ab.
- source_word: צַלְמָוֶת
  choice: tiefe Finsternis
  rationale: Das Wort bezeichnet dichtes, bedrohliches Dunkel und kann traditionell auch als „Todesschatten“ verstanden werden. Im Zusammenhang des Wechsels von Morgen, Tag und Nacht ist „tiefe Finsternis“ unmittelbar verständlich.
- source_word: וְיוֹם לַיְלָה הֶחְשִׁיךְ
  choice: und den Tag zur Nacht verfinstert
  rationale: „Verfinstert“ bewahrt den kausativen Sinn des Hifil von חשׁך; „zur Nacht“ gibt das Ziel der Verwandlung wieder.
- source_word: הַקּוֹרֵא לְמֵי הַיָּם
  choice: der die Wasser des Meeres herbeiruft
  rationale: „Herbeiruft“ drückt das machtvolle Aufbieten der Meereswasser aus und führt die Kette substantivischer Partizipien fort.
- source_word: וַיִּשְׁפְּכֵם
  choice: und sie … ausgießt
  rationale: Das Suffix bezieht sich auf die Wasser. Das Präsens entspricht im poetischen Zusammenhang der fortlaufenden Beschreibung göttlichen Handelns.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: über die Erde
  rationale: Die wörtliche Wendung „über das Angesicht der Erde“ wäre im heutigen Deutsch unnötig schwerfällig; „über die Erde“ bewahrt den räumlichen Sinn klar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Eigenname Gottes wird als „Jahwe“ wiedergegeben, statt durch einen Titel ersetzt zu werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm als Gottes persönlichen Namen. Die Umschrift „Jahwe“ macht dies für deutschsprachige Leser sichtbar, ohne einen Titel einzusetzen.
- issue: Bedeutung von צַלְמָוֶת
  choice: tiefe Finsternis
  alternative: Todesschatten
  rationale: Beide Deutungen sind lexikalisch möglich. Der kosmische Gegensatz von Morgen, Tag und Nacht legt hier eine Bezeichnung tiefen Dunkels nahe; die traditionelle Alternative bleibt als echte Bedeutungsnuance anerkannt.
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischem Rhythmus. Die wiederholten Relativsätze bilden die hebräische Partizipienkette ab. „Siebengestirn“ und „Orion“ sind allgemein verständliche astronomische Bezeichnungen; der Gedankenstrich hebt die abschließende Namensproklamation hervor.
