id: AMO.5.10
reference: Amos 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָׂנְא֥וּ בַ/שַּׁ֖עַר מוֹכִ֑יחַ וְ/דֹבֵ֥ר תָּמִ֖ים יְתָעֵֽבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/010.yaml
  text: They hate the one who reproves in the gate[b][a], and they abhor the one who speaks with integrity.
translation:
  language: de
  text: Sie hassen den, der im Stadttor[a] zurechtweist, und verabscheuen den, der aufrichtig redet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Stadttor war der übliche Ort für Gerichtsverhandlungen und öffentliche Entscheidungen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „der Untadeliges redet“ beziehungsweise „der lauter redet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנְאוּ
  choice: Sie hassen
  rationale: Das Qal Perfekt 3. Person Plural beschreibt hier ein kennzeichnendes, fortdauerndes Verhalten; das deutsche Präsens gibt diesen gegenwärtigen gesellschaftlichen Zustand natürlich wieder.
- source_word: בַשַּׁעַר
  choice: im Stadttor
  rationale: Das Stadttor war der übliche Ort öffentlicher Rechtsprechung und Beratung. „Im Stadttor“ bewahrt das Bild und macht den gemeinten städtischen Ort im Deutschen eindeutig.
- source_word: מוֹכִיחַ
  choice: den, der … zurechtweist
  rationale: Das Partizip von יכח bezeichnet jemanden, der korrigiert, tadelt oder im rechtlichen Rahmen Einwände erhebt. „Zurechtweist“ ist verständlich und lässt den durch den Kontext angedeuteten gerichtlichen Bezug offen.
- source_word: וְדֹבֵר
  choice: den, der … redet
  rationale: Die partizipiale Form wird parallel zum ersten Satzglied wiedergegeben und bewahrt so die Struktur des Hebräischen.
- source_word: תָּמִים
  choice: aufrichtig
  rationale: תמים kann Ganzheit, Lauterkeit oder Untadeligkeit bezeichnen. Adverbial verstanden beschreibt es hier integres, lauteres Reden, ohne den Sinn vorschnell auf eine bestimmte Aussage einzuengen.
- source_word: יְתָעֵבוּ
  choice: verabscheuen
  rationale: Das Piel Imperfekt von תעב drückt starke Abscheu aus. „Verabscheuen“ bewahrt die Intensität und unterscheidet sich passend vom ersten „hassen“.
theological_decisions:
- issue: Bezug von תָּמִים
  choice: 'adverbial: „aufrichtig redet“'
  alternative: 'objektbezogen: „Untadeliges/Wahrhaftiges redet“'
  rationale: Die knappe hebräische Verbindung lässt sowohl eine Beschreibung der Art des Redens als auch seines Inhalts zu. Der Haupttext verwendet die natürliche adverbiale Lesart; die Fußnote bewahrt die sachliche Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Personenbezeichnungen und die Steigerung von „hassen“ zu „verabscheuen“ bleiben erhalten; die kulturelle Bedeutung des Stadttors wird knapp erläutert.
