  text: וְ/יִגַּ֥ל כַּ/מַּ֖יִם מִשְׁפָּ֑ט וּ/צְדָקָ֖ה כְּ/נַ֥חַל אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/024.yaml
  text: But let justice roll down like waters[b][a], and righteousness like an ever-flowing stream.
translation:
  language: de
  text: Doch das Recht ströme wie Wasser[a] und Gerechtigkeit wie ein Bach, der nie versiegt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet hier die Pluralform „Wasser“, die Fülle oder Bewegung hervorheben kann.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein beständig fließender Bach“. Gemeint ist ein dauerhaft wasserführender Bach, der nicht austrocknet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגַּל
  choice: Doch … ströme
  rationale: Die Verbform hat hier auffordernden bzw. wünschenden Sinn. „Ströme“ gibt die kraftvolle Wasserbewegung idiomatisch und würdig wieder; „doch“ markiert im Zusammenhang den Gegensatz zu dem zuvor verworfenen Gottesdienst.
- source_word: כַּמַּיִם
  choice: wie Wasser
  rationale: Das hebräische מַיִם steht formal im Plural, wird im Deutschen jedoch idiomatisch als Stoffbezeichnung im Singular wiedergegeben. Die Vorstellung von Fülle und Bewegung bleibt durch das Verb erhalten.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Im prophetischen Zusammenhang bezeichnet מִשְׁפָּט eine gerechte gesellschaftliche und rechtliche Ordnung. „Das Recht“ ist im Deutschen prägnant und lässt den öffentlichen wie ethischen Bezug erkennen.
- source_word: וּצְדָקָה
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt gegenüber „Recht“ die Unterscheidung der beiden hebräischen Begriffe und umfasst moralisch richtiges, gemeinschaftstreues Handeln.
- source_word: כְּנַחַל
  choice: wie ein Bach
  rationale: נַחַל kann einen Bach, einen Wasserlauf oder ein Wadi bezeichnen. „Bach“ ist allgemein verständlich und passt zur Aussage, dass dieser Wasserlauf nicht versiegt.
- source_word: אֵיתָן
  choice: der nie versiegt
  rationale: In Verbindung mit נַחַל bezeichnet אֵיתָן einen beständigen, dauerhaft wasserführenden Bach. Der Relativsatz drückt diesen Sinn im modernen Deutschen klarer aus als das fachsprachliche „perennierend“.
theological_decisions:
- issue: Wiedergabe des ethischen Begriffspaars מִשְׁפָּט / צְדָקָה
  choice: das Recht … Gerechtigkeit
  alternative: Rechtsprechung … Rechtschaffenheit
  rationale: Die gewählte Fassung erhält die begriffliche Unterscheidung und zugleich die enge Verbindung zwischen gerechter öffentlicher Ordnung und moralisch richtigem Handeln, ohne den Text auf ein bestimmtes Lehrsystem festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Konjunktiv „ströme“ bewahrt den auffordernden Charakter; die parallele Satzstruktur folgt der hebräischen Bildsprache.
