  text: נָֽפְלָה֙ לֹֽא תוֹסִ֣יף ק֔וּם בְּתוּלַ֖ת יִשְׂרָאֵ֑ל נִטְּשָׁ֥ה עַל אַדְמָתָ֖/הּ אֵ֥ין מְקִימָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/002.yaml
  text: Fallen[a], virgin Israel will not rise again; abandoned on her own land[b], she has no one to raise her up.
translation:
  language: de
  text: Gefallen ist sie und wird nicht wieder aufstehen[a], die Jungfrau Israel[b]. Verlassen liegt sie auf ihrem Land; niemand richtet sie auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird nicht mehr aufstehen“. Wörtlich lautet die hebräische Wendung: „sie wird nicht nochmals aufstehen“.'
    reason: lexical_alternative
  - marker: b
    text: „Die Jungfrau Israel“ ist eine poetische Personifikation des Volkes, keine Aussage über einen buchstäblichen sexuellen Status.
    reason: cultural_note
lexical_decisions:
- source_word: נָפְלָה
  choice: Gefallen ist sie
  rationale: Das Qal Perfekt 3. Person feminin Singular bezeichnet den eingetretenen Fall mit fortdauerndem Ergebnis. Die Voranstellung bewahrt den abrupten Klang des hebräischen Totenlieds.
- source_word: לֹא תוֹסִיף קוּם
  choice: steht nicht wieder auf
  rationale: Die Verbindung von יסף im Hifil mit dem Infinitiv קום bedeutet hier, etwas nicht noch einmal zu tun. Die Formulierung gibt die Endgültigkeit wieder und lässt sich zugleich mit dem späteren „richtet sie auf“ verbinden.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: die Jungfrau Israel
  rationale: בְּתוּלָה bezeichnet eine Jungfrau beziehungsweise junge unverheiratete Frau und dient hier als poetische Personifikation des Volkes. Die direkte Wiedergabe erhält das prophetische Bild.
- source_word: נִטְּשָׁה
  choice: Verlassen
  rationale: Das Nifal Perfekt von נטש beschreibt Israel als preisgegeben beziehungsweise verlassen. „Verlassen“ ist klar, würdevoll und vermeidet die zusätzliche Vorstellung eines gewaltsamen Niederwerfens.
- source_word: עַל אַדְמָתָהּ
  choice: auf ihrem eigenen Land
  rationale: אֲדָמָה kann Boden, Erde oder Land bezeichnen. Der Possessivsuffix und der nationale Zusammenhang stützen „ihr eigenes Land“; zugleich bleibt durch „liegt“ das Bild der am Boden liegenden Frau erkennbar.
- source_word: אֵין מְקִימָהּ
  choice: niemand richtet sie auf
  rationale: אֵין mit dem Hifil-Partizip von קום und Objektsuffix besagt, dass keiner da ist, der sie aufrichtet. „Richtet sie auf“ bewahrt die persönliche Hilflosigkeit und den Wortklangzusammenhang mit „steht … auf“.
theological_decisions:
- issue: Die metaphorische Bezeichnung Israels als Jungfrau in einem Gerichtswort
  choice: Das Bild wird unmittelbar als „die Jungfrau Israel“ beibehalten.
  alternative: „die junge Frau Israel“ oder eine deutende Umschreibung
  rationale: Der Vers personifiziert das Volk in der Sprache eines Totenlieds. Die direkte Wiedergabe erhält Verletzlichkeit, Würde und tragischen Sturz des Bildes, ohne daraus eine Aussage über den buchstäblichen sexuellen Status abzuleiten.
- issue: Die Endgültigkeit des Gerichts in לֹא תוֹסִיף קוּם
  choice: „steht nicht wieder auf“
  alternative: „steht nicht mehr auf“
  rationale: Die hebräische Wendung bezeichnet in diesem Gerichtswort einen endgültigen Zusammenbruch. Die gewählte Fassung bewahrt die Wiederholungsbedeutung von יסף und vermeidet eine über den Vers hinausgehende theologische Erklärung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, klageliedartiger Satzführung. Die Voranstellung „Gefallen ist sie“ erhält den Nachdruck des Hebräischen; die Wiederholung von „aufstehen/aufrichten“ spiegelt das Wortspiel mit קום.
