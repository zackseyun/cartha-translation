source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָ/עִ֛יר הַ/יֹּצֵ֥את אֶ֖לֶף תַּשְׁאִ֣יר מֵאָ֑ה וְ/הַ/יּוֹצֵ֥את מֵאָ֛ה תַּשְׁאִ֥יר עֲשָׂרָ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/003.yaml
  text: 'For thus says the Lord GOD: The city that marches out a thousand will have a hundred left[a], and the one that marches out a hundred will have ten left, for the house of Israel.'
translation:
  language: de
  text: 'Denn so spricht der Herr Jahwe: Die Stadt, die mit tausend Mann auszieht[a], wird hundert übrig lassen; und die mit hundert auszieht, wird zehn übrig lassen – für das Haus Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die mit tausend hinausgeht … die mit hundert hinausgeht“. Gemeint ist wahrscheinlich das Ausziehen einer Truppe zum Kampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Denn so spricht
  rationale: Bewahrt sowohl die Verknüpfung durch כִּי als auch die geläufige prophetische Botenformel in natürlichem, gehobenem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: 'Gibt beide Bestandteile des zusammengesetzten Gottestitels wieder: אֲדֹנָי als „Herr“ und den Eigennamen יהוה als „Jahwe“, ohne sie zu einem einzigen Titel zu verschmelzen.'
- source_word: הָעִיר
  choice: Die Stadt
  rationale: Der bestimmte Artikel wird beibehalten; „Stadt“ entspricht dem kommunalen Bezug des hebräischen Nomens.
- source_word: הַיֹּצֵאת
  choice: die … auszieht
  rationale: „Ausziehen“ bewahrt die Grundbedeutung „hinausgehen“ und kann im Deutschen zugleich den durch die Truppenzahlen nahegelegten militärischen Sinn tragen.
- source_word: אֶלֶף / מֵאָה / עֲשָׂרָה
  choice: tausend / hundert / zehn
  rationale: Die Zahlen werden direkt wiedergegeben. „Mann“ wird bei der ausziehenden Tausendschaft einmal zur natürlichen Kennzeichnung der gezählten Truppe ergänzt.
- source_word: תַּשְׁאִיר
  choice: wird … übrig behalten
  rationale: Die Form ist Hifil und bezeichnet das Zurück- beziehungsweise Übriglassen. „Übrig behalten“ erhält den resultativen und kausativen Zug bei natürlichem deutschen Satzbau.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: für das Haus Israel
  rationale: „Für“ gibt den Bezugsbereich der Präposition לְ wieder; „Haus Israel“ bleibt als korporative und heilsgeschichtliche Bezeichnung erhalten.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR / der Herr GOTT
  rationale: Die gewählte Form macht sowohl den Herrschaftstitel als auch den im Ausgangstext stehenden Gottesnamen erkennbar. Die konventionellen Ersatzformen sind möglich, würden den Eigennamen jedoch verdecken.
- issue: Bezug der Zahlen auf militärische Verluste
  choice: „mit tausend Mann auszieht“ und „mit hundert auszieht“
  alternative: „mit tausend hinausgeht“ und „mit hundert hinausgeht“
  rationale: Der Kontext legt eine zum Kampf ausziehende Streitmacht nahe. Die Übersetzung macht diesen Sinn behutsam verständlich, während die Fußnote die wörtlichere Möglichkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer prophetischer Formel. Die parallele Satzstruktur und die drastische Reduktion auf ein Zehntel bleiben deutlich; der Gedankenstrich hebt den abschließenden Bezug auf das Haus Israel hervor.
