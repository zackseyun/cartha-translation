    issue: Zusatz „nur“
    rationale: „Nur“ steht nicht ausdrücklich im hebräischen Text. Die drastische Reduktion von tausend auf hundert bzw. von hundert auf zehn vermittelt die Einschränkung bereits ausreichend.
  - severity: low
    issue: „übrig behalten“ für תַּשְׁאִיר
    rationale: Das Hifil von שׁאר bezeichnet hier eher „übrig lassen“ als ein Behalten durch die Stadt. „Übrig lassen“ ist semantisch genauer und zugleich natürlich.
