  to: 'Denn so spricht der Herr Jahwe: Die Stadt, die mit tausend Mann auszieht[a], wird hundert übrig lassen; und die mit hundert auszieht, wird zehn übrig lassen – für das Haus Israel.'
  rationale: Die Revision entfernt die nicht ausdrücklich belegte Verstärkung „nur“ und ersetzt „übrig behalten“ durch das dem hebräischen Kausativ präziser entsprechende „übrig lassen“. Die militärische, jedoch nicht übermäßig explizierte Wiedergabe von „ausziehen“ samt erläuternder Fußnote bleibt erhalten.
