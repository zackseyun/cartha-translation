review_pass:
  verdict: revise
  source_fidelity: Die militärisch naheliegende Bedeutung von הַיֹּצֵאת wird mit „auszieht“ angemessen wiedergegeben, und die Zahlenverhältnisse sowie die parallele Struktur sind erhalten. Das nicht im Hebräischen ausgedrückte „nur“ sollte jedoch nicht ergänzt werden. Für תַּשְׁאִיר ist „übrig lassen“ die direktere deutsche Entsprechung des kausativen „übrig lassen/verbleiben lassen“ als „übrig behalten“.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Die Stadt ... wird hundert übrig lassen“ bewahrt die hebräische Subjektführung und ist in diesem prophetischen Kontext idiomatisch. Der abschließende Bezug „für das Haus Israel“ bleibt bewusst nah am knappen und etwas markierten Hebräisch.
  terminology: „der Herr Jahwe“ gibt אַדֹנָי יהוה mit Titel und Gottesnamen wieder; „Haus Israel“ wahrt die korporative Bezeichnung. „Mann“ ist als kontextuell motivierte Ergänzung bei der ersten Zahl vertretbar; die Fußnote erläutert die wörtlichere Konstruktion.
  issues:
