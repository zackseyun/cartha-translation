base_translation:
  language: en
  yaml_path: translation/ot/amos/005/007.yaml
  text: you who turn justice into wormwood and cast righteousness down to the earth:[a][b]
translation:
  language: de
  text: Ihr, die ihr das Recht in Wermut verwandelt[a] und die Gerechtigkeit zu Boden werft![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Bitterkeit“; das Hebräische nennt eine bittere Pflanze und gebraucht sie hier bildlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und das Recht zu Boden legt“; das mit „Gerechtigkeit“ übersetzte hebräische Wort überschneidet sich in seiner Bedeutung mit „Recht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַהֹפְכִים
  choice: Ihr, die ihr … verwandelt
  rationale: Der bestimmte Partizipialausdruck wird im prophetischen Zusammenhang als direkte Anrede wiedergegeben. Das erhält die anklagende Schärfe besser als eine distanzierte Formulierung mit „diejenigen, die“.
- source_word: לַעֲנָה
  choice: in Wermut
  rationale: Das hebräische Wort bezeichnet eine sprichwörtlich bittere Pflanze. „Wermut“ bewahrt das konkrete Bild, während die übertragene Bedeutung der Bitterkeit im Zusammenhang verständlich bleibt.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Im sozialethischen Zusammenhang bezeichnet מִשְׁפָּט die gerechte Rechtsordnung und Rechtsprechung. „Das Recht“ ist im Deutschen natürlich und lässt sich zugleich von „Gerechtigkeit“ unterscheiden.
- source_word: וּצְדָקָה
  choice: die Gerechtigkeit
  rationale: צְדָקָה bezeichnet normgerechtes, gemeinschaftstreues Handeln und überschneidet sich mit dem Bedeutungsfeld von „Recht“. „Gerechtigkeit“ bewahrt im Wortpaar einen verwandten, aber nicht identischen Begriff.
- source_word: לָאָרֶץ
  choice: zu Boden
  rationale: Die Wendung beschreibt eine räumliche Erniedrigung. „Zu Boden“ gibt dieses Bild in natürlichem modernem Deutsch wieder.
- source_word: הִנִּיחוּ
  choice: werft
  rationale: Die Hifil-Form von נוח bedeutet hier, etwas niederzulegen oder zu Boden zu bringen. „Zu Boden werft“ bringt die feindselige Abwertung im Kontext idiomatisch zum Ausdruck, ohne das räumliche Bild aufzugeben.
theological_decisions:
- issue: Wiedergabe von צְדָקָה im prophetisch-ethischen Zusammenhang
  choice: Gerechtigkeit
  alternative: Recht; das Rechte
  rationale: צְדָקָה und מִשְׁפָּט haben überlappende Bedeutungsfelder. Die Übersetzung erhält mit „Recht“ und „Gerechtigkeit“ die zwei miteinander verbundenen Begriffe, statt sie zu einem einzigen Begriff einzuebnen; die mögliche Überschneidung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdevolle prophetische Anklage mit direkter Anrede. „Wermut“ erhält das markante Pflanzenbild; „Recht“ und „Gerechtigkeit“ bilden ein verständliches, semantisch differenziertes Wortpaar. Das Ausrufezeichen kennzeichnet die rhetorisch zugespitzte Anrede, ohne zusätzliche Aussage einzuführen.
