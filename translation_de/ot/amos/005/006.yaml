source:
  edition: WLC
  text: דִּרְשׁ֥וּ אֶת יְהוָ֖ה וִֽ/חְי֑וּ פֶּן יִצְלַ֤ח כָּ/אֵשׁ֙ בֵּ֣ית יוֹסֵ֔ף וְ/אָכְלָ֥ה וְ/אֵין מְכַבֶּ֖ה לְ/בֵֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/006.yaml
  text: Seek Yahweh and live[a], lest he break out like fire in the house of Joseph, and it consume[b], with no one to quench it for Bethel.
translation:
  language: de
  text: Sucht Jahwe und lebt[a], damit er nicht wie Feuer im Haus Josef hervorbricht und das Feuer es verzehrt; für Bethel gibt es niemanden, der es löscht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sucht Jahwe, damit ihr lebt.“ Die knappe hebräische Verbindung kann Aufforderung und Folge ausdrücken. Auch das Subjekt von „hervorbricht“ ist im Hebräischen nicht ausdrücklich genannt; möglich ist: „damit es wie Feuer hervorbricht“.'
    reason: alternative_reading
  - marker: b
    text: 'Das Hebräische lässt sich sehr wörtlich wiedergeben: „und für Bethel gibt es keinen, der löscht“. Bethel war ein bedeutendes Heiligtum im Nordreich.'
    reason: cultural_note
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Sucht
  rationale: Der pluralische Imperativ von דרשׁ bezeichnet hier die entschiedene Hinwendung zu Gott, nicht bloß eine Erkundigung nach ihm.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וִחְיוּ
  choice: und lebt
  rationale: Die knappe Verbindung zweier Imperative bewahrt sowohl den hebräischen Ausdruck als auch den Sinn einer daraus folgenden Lebenszusage.
- source_word: פֶּן
  choice: damit nicht
  rationale: Leitet die Warnung vor einer unerwünschten Folge ein; diese Formulierung ist im modernen Deutschen natürlicher als „auf dass nicht“.
- source_word: יִצְלַח
  choice: er ... hervorbricht
  rationale: Im Bild des Feuers bedeutet צלח hier hervorbrechen oder sich machtvoll Bahn brechen. Das implizite Subjekt wird wahrscheinlich aus „Jahwe“ im vorangehenden Satz ergänzt.
- source_word: כָּאֵשׁ
  choice: wie Feuer
  rationale: Direkte und natürliche Wiedergabe des Vergleichs.
- source_word: בֵּית יוֹסֵף
  choice: im Haus Josef
  rationale: Bewahrt die traditionelle Bezeichnung für das Nordreich und gibt die Präposition ב als „in“ wieder, passend zum Bild eines im Haus ausbrechenden Feuers.
- source_word: וְאָכְלָה
  choice: und es verzehrt
  rationale: Das feminine Verb greift das Feuer als gedankliches Subjekt auf; das Objekt, das Haus Josef, wird im Deutschen durch „es“ verdeutlicht.
- source_word: וְאֵין מְכַבֶּה
  choice: dann gibt es ... niemanden, der es löscht
  rationale: Gibt idiomatisch wieder, dass niemand vorhanden ist, der den Brand löschen kann.
- source_word: לְבֵית אֵל
  choice: für Bethel
  rationale: Bethel ist hier der Ortsname des bedeutenden Heiligtums im Nordreich. „Für“ bewahrt die ungewöhnliche und auslegungsbedürftige Präposition ל möglichst eng.
theological_decisions:
- issue: Implizites Subjekt von יִצְלַח („hervorbricht“)
  choice: 'Jahwe ist das implizite Subjekt: „damit er nicht ... hervorbricht“.'
  alternative: 'Das Feuer ist unpersönliches Subjekt: „damit es nicht wie Feuer hervorbricht“.'
  rationale: Jahwe ist der nächstliegende Bezug im vorausgehenden Satz, und prophetische Gerichtssprache kann sein Hervorbrechen wie Feuer schildern. Da das Hebräische das Subjekt nicht ausdrücklich nennt, wird die Alternative in einer Fußnote bewahrt.
- issue: Bedeutung von בֵּית אֵל
  choice: Bethel als Ortsname und Kultzentrum des Nordreichs.
  alternative: Wörtliche Deutung als „Haus Gottes“.
  rationale: Im Amosbuch bezeichnet Bethel den historisch-geografischen Ort und das dortige Heiligtum; eine Übersetzung als Gattungsbegriff würde diesen Kontext verschleiern.
- issue: Bezug des femininen וְאָכְלָה
  choice: Das Feuer verzehrt das Haus Josef.
  alternative: Elliptische Wiedergabe ohne ausdrücklich genanntes Objekt.
  rationale: Die feminine Verbform stimmt mit אֵשׁ („Feuer“, feminin) überein. Das deutsche Pronomen „es“ macht das im Kontext vorausgesetzte Objekt verständlich, ohne ein neues Referenzobjekt einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper prophetischer Eindringlichkeit. Der Eigenname „Jahwe“ und die historische Bezeichnung „Haus Josef“ bleiben erhalten. Die schwer verständliche Wendung „für Bethel“ wird im Text bewusst nicht geglättet, sondern durch die Fußnote erläutert.
