source:
  edition: WLC
  text: וּ/בְ/כָל כְּרָמִ֖ים מִסְפֵּ֑ד כִּֽי אֶעֱבֹ֥ר בְּ/קִרְבְּ/ךָ֖ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/017.yaml
  text: And in all the vineyards there will be wailing[b][a], for I will pass through your midst," says Yahweh.
translation:
  language: de
  text: Und in allen Weinbergen wird Wehklage sein[a]; denn ich werde durch deine Mitte ziehen[b], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Trauerklage“ beziehungsweise „Totenklage“. Das hebräische Wort bezeichnet öffentlich geäußerte Trauer, die oft hörbar zum Ausdruck kommt.'
    reason: lexical_alternative
  - marker: b
    text: „Ich werde durch deine Mitte ziehen“ kann an frühere biblische Sprache vom göttlichen Durchschreiten zum Gericht erinnern; vergleiche 2. Mose 12,12. Der Vers selbst kennzeichnet dies nicht ausdrücklich als Anspielung.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל
  choice: Und in allen
  rationale: Die Verbindung aus Konjunktion, Präposition und Quantor führt einen weiteren Ort der Klage an. „In allen“ bewahrt die ausdrückliche Gesamtheit.
- source_word: כְּרָמִים
  choice: Weinbergen
  rationale: Der Plural bezeichnet Weinberge beziehungsweise Weinbauflächen; „Weinberge“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: מִסְפֵּד
  choice: Wehklage
  rationale: Das Substantiv bezeichnet öffentliches, häufig hörbar geäußertes Trauern und Klagen. „Wehklage“ gibt sowohl den Trauercharakter als auch die hörbare Äußerung wieder. „wird … sein“ ergänzt die im Hebräischen fehlende Kopula zurückhaltend.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung für die Wehklage ein.
- source_word: אֶעֱבֹר
  choice: ich werde … ziehen
  rationale: עבר bezeichnet hier eine Bewegung durch einen Bereich. Zusammen mit בְּקִרְבְּךָ bringt „durch deine Mitte ziehen“ dies zum Ausdruck und lässt einen möglichen Anklang an göttliches Durchschreiten zum Gericht bestehen.
- source_word: בְּקִרְבְּךָ
  choice: durch deine Mitte
  rationale: Die Form trägt ein Suffix der zweiten Person Singular und redet Israel kollektiv an. Die räumliche Bildlichkeit von „deiner Mitte“ bleibt erhalten.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht“ entspricht der geläufigen deutschen Form der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Gottes Bewegung inmitten des Volkes
  choice: ich werde durch deine Mitte ziehen
  alternative: ich werde mitten unter dir hindurchgehen; ich werde unter euch einhergehen
  rationale: Die direkte räumliche Aussage bleibt als Gerichtswort stehen. Ein möglicher Anklang an Exodus 12 wird weder zur ausdrücklichen Anspielung erhoben noch durch eine neutralisierende Umschreibung beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und das kollektive Singular „deine“ bewahren die Dichte des hebräischen Gerichtsworts; „Wehklage“ ist verständlich, zugleich feierlich und dem öffentlichen Trauerritus angemessen.
