  source_fidelity: 'Der Text gibt die hebräische Ortsangabe und den nominalen Klagesatz angemessen wieder: „Und in allen Weinbergen wird Wehklage sein“. „Denn“ gibt כִּי plausibel begründend wieder. „Ich werde durch deine Mitte ziehen“ bildet אֶעֱבֹר בְּקִרְבְּךָ mit dem kollektiven Singular sorgfältig ab und bewahrt die mögliche, aber im Vers nicht explizierte Gerichtskonnotation.'
  naturalness: Modernes, würdiges Standarddeutsch. „Wehklage“ und die knappe Botenformel „spricht Jahwe“ sind natürlich und dem prophetischen Register angemessen. Die Satzstellung ist klar und die Wiederaufnahme von „deine“ als kollektive Anrede verständlich.
  terminology: „Jahwe“ gibt יְהוָה konsistent als Gottesnamen wieder. „Wehklage“ ist für מִסְפֵּד treffend; die Fußnote bietet geeignete lexikalische Alternativen. Der Hinweis auf 2. Mose 12,12 formuliert eine mögliche Resonanz ausdrücklich zurückhaltend und legt keine Auslegung fest.
