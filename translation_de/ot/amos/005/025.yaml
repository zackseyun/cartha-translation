  yaml_path: translation/ot/amos/005/025.yaml
  text: Did you bring me sacrifices and offerings in the wilderness for forty years[a], O house of Israel?
translation:
  language: de
  text: Habt ihr mir in der Wüste vierzig Jahre lang Schlachtopfer und Speiseopfer dargebracht, Haus Israel?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזְּבָחִים
  choice: Schlachtopfer
  rationale: זֶבַח bezeichnet ein Opfer, bei dem ein Tier geschlachtet wird. „Schlachtopfer“ gibt den kultischen Sinn präzise wieder und bildet mit „Speisopfer“ ein natürliches Begriffspaar.
- source_word: וּמִנְחָה
  choice: und Speisopfer
  rationale: מִנְחָה kann allgemein Gabe oder Tribut bedeuten, bezeichnet im kultischen Zusammenhang jedoch häufig das unblutige Speis- beziehungsweise Getreideopfer. In der Verbindung mit זְבָחִים ist die spezifisch kultische Wiedergabe am naheliegendsten.
- source_word: הִגַּשְׁתֶּם
  choice: Habt ihr … dargebracht
  rationale: Der Hifil von נגשׁ bezeichnet hier das Heranbringen beziehungsweise Darbringen von Opfergaben. „darbringen“ ist im Deutschen idiomatisch und wahrt den kultischen Bezug.
- source_word: לִי
  choice: mir
  rationale: Der hebräische Dativ wird im Deutschen natürlich mit „mir“ wiedergegeben und bewahrt die Betonung des Empfängers.
- source_word: בַמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet hier die Wüste beziehungsweise Wildnis der Wanderungszeit Israels. „in der Wüste“ ist die geläufige und kontextuell klare deutsche Formulierung.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: Die Ergänzung „lang“ macht die zeitliche Dauer im modernen Deutschen eindeutig, ohne den Inhalt zu erweitern.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle prophetische Anrede „Haus Israel“ bewahrt sowohl das Bild des hebräischen Ausdrucks als auch seinen feierlichen, kollektiven Klang.
theological_decisions:
- issue: Rhetorische Kraft der Frage
  choice: Als direkte Frage wiedergeben, deren herausfordernder Charakter aus dem Zusammenhang hervorgeht
  alternative: 'Die erwartete Verneinung ausdrücklich ergänzen, etwa: „Ihr habt mir doch nicht …“'
  rationale: Die hebräische Frage stellt Israels Wüstenverehrung scharf infrage, formuliert die erwartete Antwort aber nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung und vermeidet eine interpretierende Auflösung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch präzisem Wortschatz. Die knappe prophetische Anrede „Haus Israel“ bleibt ohne zusätzliches „o“ stehen, da dies im heutigen Deutschen natürlicher klingt und die Feierlichkeit dennoch wahrt.
