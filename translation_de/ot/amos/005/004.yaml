  source_fidelity: 'Der Text gibt alle Bestandteile des Hebräischen angemessen wieder: כִּי als begründendes „Denn“, die Botenformel als „so spricht“, den Gottesnamen als „Yahweh“, לְבֵית יִשְׂרָאֵל als korporatives „zum Haus Israel“ sowie die beiden Pluralimperative „Sucht mich und lebt“. Die knappe Verbindung der Imperative bleibt erhalten und wird nicht einseitig als bloßer Zweck oder bloße Zukunftsaussage festgelegt.'
  naturalness: '„Denn so spricht Yahweh zum Haus Israel: »Sucht mich und lebt.«“ ist knapp, würdevoll und in modernem Standarddeutsch verständlich. „Haus Israel“ ist bewusst formelhaft-prophetisch, aber weder unnatürlich noch erklärungsbedürftig.'
  terminology: „Yahweh“ folgt der vorgegebenen Namenspraxis. „Haus Israel“ bewahrt die korporative Terminologie. „Sucht mich“ trifft die im Kontext gemeinte Hinwendung zu Yahweh, ohne דרש auf ein bloßes Befragen zu reduzieren. „lebt“ lässt den Imperativ und die semantische Offenheit von וִחְיוּ stehen.
