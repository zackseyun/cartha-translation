source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה לְ/בֵ֣ית יִשְׂרָאֵ֑ל דִּרְשׁ֖וּ/נִי וִֽ/חְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/004.yaml
  text: 'For thus says Yahweh to the house of Israel: Seek me and live[a].'
translation:
  language: de
  text: 'Denn so spricht Yahweh zum Haus Israel: »Sucht mich und lebt[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sucht mich, damit ihr lebt«, oder: »Sucht mich, dann werdet ihr leben.« Das Hebräische kann als dringender Aufruf mit einer verheißenen Folge verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Klage- und Gerichtsbotschaft; »Denn« bewahrt diesen Zusammenhang im Deutschen.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen idiomatisch und würdevoll mit dem performativen Präsens »so spricht« wiedergegeben.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: zum Haus Israel
  rationale: »Haus Israel« bewahrt die korporative und bundesbezogene Ausdrucksweise; »zum« gibt die Anredebeziehung der Präposition לְ natürlich wieder.
- source_word: דִּרְשׁוּנִי
  choice: Sucht mich
  rationale: דרש bezeichnet hier die entschlossene Hinwendung zu Yahweh und nicht nur das Einholen einer Auskunft. Der Pluralimperativ wird direkt beibehalten.
- source_word: וִחְיוּ
  choice: und lebt
  rationale: Die Verbindung aus waw und einem zweiten Pluralimperativ bleibt formal erhalten, ohne das Verhältnis vorschnell ausschließlich als Zweck oder Verheißung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Seine Wiedergabe als »Yahweh« bewahrt den Charakter eines persönlichen Namens, statt ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft von »Sucht mich und lebt«
  choice: Direkter Aufruf, bei dem das Leben als gebotene Antwort und zugleich als mögliche Folge beziehungsweise Verheißung offenbleibt
  alternative: »Sucht mich, damit ihr lebt«; »Sucht mich, dann werdet ihr leben«
  rationale: Die Folge zweier Imperative kann einen dringlichen Doppelaufruf ausdrücken, zugleich aber auch eine beabsichtigte oder verheißene Folge nahelegen. Die Hauptfassung bewahrt diese Spannung und legt zudem nicht fest, ob »Leben« ausschließlich körperlich oder geistlich zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel »so spricht« und die korporative Bezeichnung »Haus Israel« bleiben erhalten; der kurze Imperativ wahrt die Eindringlichkeit des Hebräischen.
