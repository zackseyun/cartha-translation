id: AMO.5.18
reference: Amos 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֥וֹי הַ/מִּתְאַוִּ֖ים אֶת י֣וֹם יְהוָ֑ה לָ/מָּה זֶּ֥ה לָ/כֶ֛ם י֥וֹם יְהוָ֖ה הוּא חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/018.yaml
  text: Woe to those who long for the day of Yahweh! Why would you have the day of Yahweh? It is darkness[a], and not light.
translation:
  language: de
  text: Wehe denen, die sich nach dem Tag Jahwes sehnen! Was wollt ihr denn mit dem Tag Jahwes?[a] Er ist Finsternis und nicht Licht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Warum wollt ihr den Tag Jahwes?“ Die hebräische Formulierung ist knapp, idiomatisch und rhetorisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Leitet einen prophetischen Weheruf ein und bewahrt sowohl den Klage- als auch den Gerichtscharakter.
- source_word: הַמִּתְאַוִּים
  choice: die sich … sehnen
  rationale: Das Hitpael-Partizip bezeichnet Menschen, die von einem starken, anhaltenden Verlangen geprägt sind; „sich sehnen“ gibt dies im Deutschen natürlich wieder.
- source_word: יוֹם יְהוָה
  choice: Tag Jahwes
  rationale: Bewahrt die feststehende prophetische Wendung und gibt den Gottesnamen ausdrücklich wieder.
- source_word: לָמָּה זֶּה לָכֶם
  choice: Was soll euch denn …?
  rationale: Die hebräische Wendung ist elliptisch und rhetorisch. Die Formulierung fragt zugespitzt, welchen vermeintlichen Nutzen dieser Tag für die Angesprochenen haben sollte.
- source_word: הוּא חֹשֶׁךְ וְלֹא אוֹר
  choice: Er ist Finsternis und nicht Licht
  rationale: „Er“ greift den Tag auf; die wörtlichen Bilder „Finsternis“ und „Licht“ bewahren den schroffen prophetischen Gegensatz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm ausdrücklich. „Jahwe“ ist die im Deutschen geläufige Form des Namens und bewahrt den unmittelbaren Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Erwartung des Tages Jahwes
  choice: Die rhetorische Frage bleibt offen und wird unmittelbar durch „Finsternis und nicht Licht“ beantwortet.
  alternative: Den Tag ausdrücklich als Gericht nur über Israels Feinde erklären
  rationale: Der Vers kehrt die positive Erwartung der Angesprochenen ironisch um, benennt hier aber noch nicht alle theologischen Voraussetzungen ihrer Erwartung. Die Übersetzung fügt daher keine Erklärung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Weheruf und die scharfe rhetorische Umkehrung bleiben erhalten; „Finsternis“ und „Licht“ werden als zentrale prophetische Bilder nicht aufgelöst.
