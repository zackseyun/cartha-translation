base_translation:
  language: en
  yaml_path: translation/ot/amos/005/019.yaml
  text: It will be as when a man flees from before the lion[a], and the bear meets him; then he enters the house and leans his hand on the wall[b], and the snake bites him.
translation:
  language: de
  text: Es ist, wie wenn ein Mann vor dem Löwen flieht und ihm der Bär begegnet[a]; er kommt ins Haus, stützt seine Hand an die Wand, und die Schlange[b] beißt ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und der Bär auf ihn losgeht«; das hebräische Verb kann je nach Zusammenhang ein Begegnen, Zusammentreffen oder feindliches Anfallen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Natter« oder »die Schlange« im Sinn von »die Schlange/der Serpent«; das hebräische Wort bezeichnet allgemein eine Schlange.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: wie wenn
  rationale: Leitet den Vergleich mit dem im vorausgehenden Vers beschriebenen Tag des HERRN ein und klingt im modernen Deutschen natürlich.
- source_word: יָנוּס
  choice: flieht
  rationale: Gibt die von Angst und Gefahr bestimmte Flucht knapp und eindringlich wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Entspricht der grammatisch maskulinen Einzahl und ihrer beispielhaften Funktion.
- source_word: מִפְּנֵי הָאֲרִי
  choice: vor dem Löwen
  rationale: Natürliches Deutsch für die räumlich-bedrohliche Bedeutung von מִפְּנֵי in diesem Zusammenhang.
- source_word: וּפְגָעוֹ הַדֹּב
  choice: und ihm der Bär begegnet
  rationale: פגע kann ein Begegnen, Zusammentreffen oder feindliches Anfallen bezeichnen. »Begegnet« bewahrt die lexikalische Offenheit; die Gefahr ergibt sich aus dem Kontext.
- source_word: וּבָא הַבַּיִת
  choice: er kommt ins Haus
  rationale: בוא bezeichnet hier das Hineinkommen in ein Haus. Die parataktische Fortführung wahrt den raschen Ablauf der hebräischen Schilderung.
- source_word: וְסָמַךְ יָדוֹ עַל הַקִּיר
  choice: stützt seine Hand an die Wand
  rationale: Bewahrt die konkrete Körperbewegung und drückt im Deutschen idiomatisch das vermeintlich sichere Abstützen aus.
- source_word: וּנְשָׁכוֹ הַנָּחָשׁ
  choice: und die Schlange beißt ihn
  rationale: Gibt Verb, Objekt und ausdrücklich genannten Täter in natürlicher deutscher Wortstellung wieder; der bestimmte Artikel entspricht dem Hebräischen.
- source_word: הַנָּחָשׁ
  choice: die Schlange
  rationale: Ist die gewöhnliche, allgemein verständliche Bezeichnung für נָחָשׁ in diesem konkreten Gefahrenbild.
theological_decisions:
- issue: Bezug des Vergleichs
  choice: Die Formulierung bleibt ein unaufgelöster Vergleich, dessen Bezug sich aus Amos 5,18 ergibt.
  alternative: Den »Tag des HERRN« im Vers ausdrücklich wiederholen.
  rationale: Der hebräische Text von Vers 19 nennt den Bezug nicht erneut. Eine Ergänzung würde zwar den Zusammenhang verdeutlichen, aber über den vorliegenden Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, bildhafter Satzfolge. Die wiederholte Reihung mit »und« spiegelt die unerbittliche Abfolge der Gefahren. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
