  - severity: low
    issue: Die Wortstellung „weg von mir“ ist leicht weniger idiomatisch.
    rationale: 'Bei „wegschaffen“ steht die Bezugsergänzung im Deutschen natürlicher vor der abgetrennten Partikel: „von mir weg“.'
  - severity: low
    issue: Die Fußnotenalternative „Lauten“ ist als Benennung von נבל weniger naheliegend.
    rationale: „Leiern“ gibt die traditionelle lexikalische Alternative zu „Harfen“ besser wieder; die anschließende Unsicherheitsangabe verhindert eine übergenaue Identifikation.
