  text: הָסֵ֥ר מֵ/עָלַ֖/י הֲמ֣וֹן שִׁרֶ֑י/ךָ וְ/זִמְרַ֥ת נְבָלֶ֖י/ךָ לֹ֥א אֶשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/023.yaml
  text: Take away from me the noise of your songs[a], and I will not listen to the melody of your harps.
translation:
  language: de
  text: Schaff den Lärm deiner Lieder von mir weg! Das Spiel deiner Harfen[a] will ich nicht hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Leiern. Das hebräische Wort bezeichnet ein antikes Saiteninstrument; die genaue moderne Entsprechung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Schaff … weg
  rationale: Der Imperativ fordert nachdrücklich dazu auf, etwas aus der Gegenwart des Sprechers zu entfernen. „Schaff … weg“ ist natürliches, kräftiges Deutsch.
- source_word: מֵעָלַי
  choice: von mir
  rationale: Wörtlich etwa „von über/bei mir weg“; „von mir“ gibt die persönliche Zurückweisung idiomatisch wieder.
- source_word: הֲמוֹן
  choice: Lärm
  rationale: Im Zusammenhang der verworfenen Gottesdienstmusik bezeichnet das Wort ein lautes, störendes Getöse und trägt hier eine deutlich abwertende Färbung.
- source_word: שִׁרֶיךָ
  choice: deiner Lieder
  rationale: Die Pluralform wird direkt und natürlich wiedergegeben.
- source_word: וְזִמְרַת
  choice: Den Klang
  rationale: Das Wort bezeichnet Gesang oder Musik. „Klang“ passt zur instrumentalen Ergänzung und vermeidet eine unnötige Wiederholung von „Lieder“.
- source_word: נְבָלֶיךָ
  choice: deiner Harfen
  rationale: נבל bezeichnet ein antikes Saiteninstrument. „Harfen“ ist verständlich und traditionsnah; wegen der unsicheren genauen Entsprechung wird eine Fußnote gesetzt.
- source_word: לֹא אֶשְׁמָע
  choice: will ich nicht hören
  rationale: Die verneinte Imperfektform drückt hier eine bewusste Weigerung aus. Die vorangestellte Objektphrase und „will ich nicht“ bewahren den nachdrücklichen Ton.
theological_decisions:
- issue: Ton der göttlichen Zurückweisung des Gottesdienstes
  choice: Direkte, scharfe Zurückweisung durch „Lärm“ und „will ich nicht hören“
  alternative: Neutraleres „Geräusch“ beziehungsweise „ich höre nicht“
  rationale: Der Kontext von Amos 5 verwirft einen Gottesdienst, der von Recht und Gerechtigkeit getrennt ist. Die kräftige Sprache wahrt die prophetische Schärfe, ohne die Begründung in den Vers hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem prophetischem Nachdruck. Die parallele Struktur der beiden Vershälften bleibt erhalten; das Ausrufezeichen macht die Befehlsform deutlich.
