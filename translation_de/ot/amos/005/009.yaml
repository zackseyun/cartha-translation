  text: הַ/מַּבְלִ֥יג שֹׁ֖ד עַל עָ֑ז וְ/שֹׁ֖ד עַל מִבְצָ֥ר יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/009.yaml
  text: He who brings sudden destruction upon the strong[b][a], so that destruction comes upon the fortress.
translation:
  language: de
  text: Er lässt Verwüstung über den Starken hereinbrechen[a], und Verwüstung kommt über die Festung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er lässt Verheerung über den Mächtigen hervorbrechen.“ Das hebräische Verb ist selten und in seiner Bedeutung unsicher; es wird auch anders verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den befestigten Ort“ beziehungsweise „die Wehrburg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבְלִיג
  choice: Er lässt … hereinbrechen
  rationale: Der bestimmte Hifil-Partizip bezeichnet substantivisch den Handelnden und bezieht sich im Zusammenhang auf Gott. Das seltene, schwierige Verb beschreibt hier am ehesten das plötzliche Hervorbrechenlassen der Verwüstung. Die deutsche Wendung ist natürlich und bewahrt die kraftvolle Bildsprache.
- source_word: שֹׁד
  choice: Verwüstung
  rationale: Das Substantiv bezeichnet gewaltsame Zerstörung, Verheerung oder Plünderung. „Verwüstung“ erfasst hier die zerstörerische Wirkung und lässt sich in beiden parallelen Satzteilen beibehalten.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet jeweils das Ziel, das von der Verwüstung getroffen wird. „Über … hereinbrechen“ und „über … kommen“ geben das im Deutschen idiomatisch wieder.
- source_word: עָז
  choice: den Starken
  rationale: Das substantivierte Adjektiv steht im Singular. „Den Starken“ wahrt diese Form und legt nicht unnötig fest, ob eine mächtige Einzelperson oder eine starke Macht gemeint ist.
- source_word: וְשֹׁד
  choice: und Verwüstung
  rationale: Die einfache Beiordnung des Hebräischen bleibt erhalten. Anders als eine resultative Wiedergabe mit „sodass“ deutet „und“ das genaue Verhältnis der beiden Aussagen nicht zusätzlich aus.
- source_word: מִבְצָר
  choice: die Festung
  rationale: Das Wort bezeichnet einen befestigten Ort oder eine Zuflucht. „Festung“ ist prägnant, gegenwärtig verständlich und bewahrt das militärische Bild.
- source_word: יָבֹוא
  choice: kommt
  rationale: Die Grundbedeutung ist „kommen“. Zusammen mit „über“ ergibt sich eine natürliche deutsche Formulierung, ohne das Verb stärker als nötig auszudeuten.
theological_decisions:
- issue: Bestimmung des Subjekts
  choice: Das Pronomen „Er“ bezieht sich im Zusammenhang auf den HERRN.
  alternative: Eine unpersönliche Macht bringt die Verwüstung.
  rationale: Amos 5,8–9 gehört zu einer Beschreibung des machtvollen Handelns des HERRN. Das hebräische Partizip setzt diesen Bezug fort, ohne den Gottesnamen in diesem Vers ausdrücklich zu wiederholen.
- issue: Verhältnis der beiden Satzteile
  choice: Die beiden Aussagen werden mit „und“ beigeordnet.
  alternative: Der zweite Satzteil wird mit „sodass“ als ausdrückliche Folge des ersten verstanden.
  rationale: Das hebräische וְ kann einen Folgezusammenhang zulassen, markiert ihn hier aber nicht eindeutig. Die einfache Beiordnung bewahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper prophetischer Bildkraft. Die Wiederholung von „Verwüstung“ bildet den hebräischen Parallelismus ab; die Unsicherheit des seltenen Verbs wird in der Fußnote offengelegt.
