id: AMO.5.15
reference: Amos 5:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׂנְאוּ רָע֙ וְ/אֶ֣הֱבוּ ט֔וֹב וְ/הַצִּ֥יגוּ בַ/שַּׁ֖עַר מִשְׁפָּ֑ט אוּלַ֗י יֶֽחֱנַ֛ן יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁאֵרִ֥ית יוֹסֵֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/015.yaml
  text: Hate evil[a], and love good, and establish justice in the gate; perhaps Yahweh, the God of hosts[c][b], will be gracious to the remnant of Joseph.
translation:
  language: de
  text: Hasst das Böse und liebt das Gute! Bringt im Stadttor[a][b] das Recht zur Geltung! Vielleicht wird Yahweh, der Gott der Heerscharen, dem Rest Josefs[c] gnädig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Stadttor war der öffentliche Ort, an dem Älteste und Amtsträger Rechtsfälle verhandelten und Recht sprachen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »Stellt im Tor das Recht auf.« Gemeint ist, dem Recht am Ort der öffentlichen Rechtsprechung Geltung zu verschaffen.'
    reason: lexical_alternative
  - marker: c
    text: »Josef« steht hier für die von Josef abstammenden Stämme, besonders für das Nordreich Israel. Der »Rest Josefs« sind diejenigen, die nach dem Gericht übrig bleiben.
    reason: cross_reference
lexical_decisions:
- source_word: שִׂנְאוּ רָע
  choice: Hasst das Böse
  rationale: Der starke Imperativ שׂנא und das substantivisch gebrauchte רָע werden direkt wiedergegeben; so bleibt der ethische Gegensatz zum Guten erhalten.
- source_word: וְאֶהֱבוּ טוֹב
  choice: und liebt das Gute
  rationale: Die direkte Wiedergabe bewahrt sowohl den Imperativ als auch die antithetische Parallelität »hasst … liebt«.
- source_word: וְהַצִּיגוּ … מִשְׁפָּט
  choice: Bringt … das Recht zur Geltung
  rationale: Die Formulierung gibt den kausativen Sinn wieder, dass das Recht im öffentlichen Gerichtswesen festen Bestand und Wirksamkeit erhalten soll, und klingt zugleich natürlich im modernen Deutschen.
- source_word: בַשַּׁעַר
  choice: im Stadttor
  rationale: »Stadttor« macht den kulturellen Bezug auf den Ort öffentlicher Rechtsprechung verständlicher als das isolierte »Tor«, ohne die konkrete Bildsprache aufzulösen.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Bewahrt die ausdrücklich offene Hoffnung des hebräischen Textes und vermeidet jede Zusicherung des Ausgangs.
- source_word: יֶחֱנַן
  choice: wird … gnädig sein
  rationale: Gibt חנן als Erweisung gnädiger Zuwendung wieder, ohne den Sinn unnötig auf Mitleid oder Vergebung zu verengen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: Bewahrt den feststehenden Gottestitel und lässt die mögliche Breite von צְבָאוֹת bestehen, statt ihn ausschließlich auf irdische Armeen oder himmlische Wesen festzulegen.
- source_word: שְׁאֵרִית יוֹסֵף
  choice: dem Rest Josefs
  rationale: »Rest« erhält den prophetischen Schlüsselbegriff für die nach dem Gericht Übriggebliebenen; »Josef« bezeichnet hier kollektiv dessen Nachkommen, besonders das Nordreich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Transliteration wahrt seinen Charakter als Eigenname, ohne einen ersetzenden Titel einzuführen.
- issue: Offenheit von אוּלַי in Verbindung mit יֶחֱנַן
  choice: Vielleicht wird … gnädig sein
  alternative: … damit … gnädig sei; gewiss wird … gnädig sein
  rationale: Die Aussage lässt Gottes gnädige Zuwendung erhoffen, garantiert sie aber nicht als automatische Folge menschlicher Umkehr. Diese Spannung bleibt ausdrücklich erhalten.
- issue: Bezug von »Josef«
  choice: Josef als kollektive Bezeichnung für seine Nachkommen
  alternative: Josef als Einzelperson
  rationale: Im prophetischen Kontext bezeichnet »der Rest Josefs« die nach dem Gericht verbleibenden Angehörigen des Volkes, besonders des Nordreichs, nicht den Patriarchen als Einzelperson.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftigen Imperative und die knappe prophetische Gegenüberstellung bleiben erhalten. »Das Recht zur Geltung bringen« vermeidet eine unnatürlich wörtliche Wendung, ohne die konkrete Rechtspraxis am Stadttor zu verallgemeinern.
