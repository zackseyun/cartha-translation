source:
  edition: WLC
  text: וְ/הִגְלֵיתִ֥י אֶתְ/כֶ֖ם מֵ/הָ֣לְאָה לְ/דַמָּ֑שֶׂק אָמַ֛ר יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/027.yaml
  text: Therefore I will send you into exile beyond Damascus,” says Yahweh[a], whose name is the God of hosts.
translation:
  language: de
  text: »Darum werde ich euch über Damaskus hinaus in die Verbannung führen[a]«, spricht Jahwe; Gott der Heerscharen ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Darum werde ich euch über Damaskus hinaus verbannen.«'
    reason: Lexikalische Alternative für den Hifil von גלה; »verbannen« ist knapper, während »in die Verbannung führen« den kausativen Zug deutlicher ausdrückt.
lexical_decisions:
- source_word: וְהִגְלֵיתִי
  choice: Darum werde ich … in die Verbannung führen
  rationale: Der Hifil von גלה bezeichnet das Verursachen des Exils. Die Formulierung ist im modernen Deutsch idiomatisch und bewahrt die kausative Bedeutung. Das vorangestellte וְ wird im Zusammenhang mit dem vorhergehenden Gerichtswort folgernd als »Darum« wiedergegeben.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Die Akkusativpartikel mit dem Suffix der 2. Person maskulin Plural bezeichnet die angeredete Gemeinschaft; im Deutschen ist »euch« die natürliche Entsprechung.
- source_word: מֵהָלְאָה לְדַמָּשֶׂק
  choice: über Damaskus hinaus
  rationale: Die Wendung bezeichnet eine Bewegung an Damaskus vorbei beziehungsweise weiter als bis Damaskus. »Über Damaskus hinaus« gibt diese räumliche Bedeutung knapp und natürlich wieder.
- source_word: אָמַר
  choice: spricht
  rationale: In der prophetischen Botenformel gibt das präsentische »spricht« den performativen und gegenwärtigen Charakter der Aussage angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Gott der Heerscharen
  rationale: »Heerscharen« bewahrt die Bedeutungsbreite von צְבָאוֹת und vermeidet eine nicht ausdrücklich festgelegte Eingrenzung auf irdische oder himmlische Heere.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die ausdrückliche hebräische Nominalaussage bleibt erhalten; »Name« wird nicht durch eine theologisch motivierte Großschreibung hervorgehoben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von צְבָאוֹת im Gottestitel
  choice: Heerscharen
  alternative: Heere
  rationale: »Heerscharen« lässt offen, ob irdische, himmlische oder umfassend alle göttlichen Streitkräfte gemeint sind, und bewahrt so die Mehrdeutigkeit des Hebräischen.
- issue: Syntaktische Zuordnung von אֱלֹהֵי צְבָאוֹת שְׁמוֹ
  choice: Gott der Heerscharen ist sein Name
  alternative: dessen Name Gott der Heerscharen ist
  rationale: Die Hauptsatzform folgt der knappen hebräischen Nominalkonstruktion und erhält deren Nachdruck, ohne die Aussage durch eine Relativkonstruktion enger an »Jahwe« anzubinden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Gerichtsankündigung bleibt knapp und direkt; die traditionelle, aber verständliche Bezeichnung »Heerscharen« erhält die Weite des hebräischen Gottestitels.
