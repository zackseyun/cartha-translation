id: AMO.5.5
reference: Amos 5:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַֽל תִּדְרְשׁוּ֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּל֙ לֹ֣א תָבֹ֔אוּ וּ/בְאֵ֥ר שֶׁ֖בַע לֹ֣א תַעֲבֹ֑רוּ כִּ֤י הַ/גִּלְגָּל֙ גָּלֹ֣ה יִגְלֶ֔ה וּ/בֵֽית אֵ֖ל יִהְיֶ֥ה לְ/אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/005.yaml
  text: But do not seek Bethel[a], and do not enter Gilgal, and do not cross over to Beersheba; for Gilgal will surely go into exile, and Bethel will become nothingness.
translation:
  language: de
  text: Doch sucht Bethel nicht auf, geht nicht nach Gilgal und zieht nicht hinüber nach Beerscheba; denn Gilgal wird gewiss in die Verbannung ziehen, und Bethel wird zu nichts werden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise auch: „Bethel wird zu Bet-Awen werden.“ Darin liegt ein hebräisches Wortspiel: Bethel bedeutet „Haus Gottes“, während awen „Nichtigkeit“, „Bosheit“ oder „Unheil“ bedeuten kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְרְשׁוּ
  choice: sucht … auf
  rationale: דרשׁ bezeichnet hier das religiös motivierte Aufsuchen eines Heiligtums. „aufsuchen“ bewahrt diesen örtlichen Bezug und zugleich den Anklang an die Aufforderung, den HERRN zu suchen.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Ortsname; die im Deutschen geläufige Form wird beibehalten. Die Namensbedeutung „Haus Gottes“ ist für das Wortspiel bedeutsam, wird aber nicht anstelle des Ortsnamens eingesetzt.
- source_word: תָבֹאוּ
  choice: geht … nach
  rationale: בוא bedeutet grundsätzlich „kommen/eintreten“. Bei einem genannten Reiseziel ist „nach Gilgal gehen“ im Deutschen natürlich und bringt das Aufsuchen des Kultortes klar zum Ausdruck.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Der Ortsname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: תַעֲבֹרוּ
  choice: zieht … hinüber nach
  rationale: עבר hat die konkrete Bedeutung „hinübergehen/überschreiten“. „hinüberziehen“ bewahrt diese Bewegungsnuance und passt zu einer längeren Reise nach Beerscheba.
- source_word: בְאֵר שֶׁבַע
  choice: Beerscheba
  rationale: Geläufige deutsche Form des Ortsnamens.
- source_word: גָּלֹה יִגְלֶה
  choice: wird ganz gewiss in die Verbannung gehen
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Gewissheit. Die Formulierung erhält sowohl diese Betonung als auch das Motiv der Verbannung.
- source_word: יְהִיֶה לְאָוֶן
  choice: wird zu Nichtigkeit werden
  rationale: אָוֶן kann Nichtigkeit, Unheil oder Bosheit bezeichnen. „Nichtigkeit“ passt zum Gericht über das Heiligtum und lässt die weiteren Bedeutungsnuancen sowie das mögliche Wortspiel offen.
theological_decisions:
- issue: Wiedergabe von Bethels Schicksal in לְאָוֶן
  choice: Bethel wird zu Nichtigkeit werden
  alternative: Bethel wird zu Unheil/Bosheit beziehungsweise zu Bet-Awen werden
  rationale: Der hebräische Ausdruck kann sowohl Nichtigkeit als auch Unheil oder Bosheit bezeichnen und wahrscheinlich polemisch auf „Bet-Awen“ anspielen. Der Haupttext bleibt verständlich, ohne die Mehrdeutigkeit dogmatisch festzulegen; die Fußnote bewahrt das Wortspiel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Warnung wird mit natürlichen deutschen Bewegungsverben wiedergegeben; der Nachdruck der hebräischen Verbkonstruktion bleibt durch „ganz gewiss“ erhalten.
