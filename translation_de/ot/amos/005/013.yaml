id: AMO.5.13
reference: Amos 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן הַ/מַּשְׂכִּ֛יל בָּ/עֵ֥ת הַ/הִ֖יא יִדֹּ֑ם כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/013.yaml
  text: Therefore the prudent man keeps silent at that time[a], for it is an evil time.
translation:
  language: de
  text: Darum schweigt der Einsichtige[a] in jener Zeit, denn es ist eine böse Zeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der Verständige“, „der Kluge“ oder „wer Einsicht hat“. Im Hebräischen steht eine maskuline Singularform, die hier repräsentativ gebraucht sein kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Anklage und klingt im modernen Deutschen natürlich.
- source_word: הַמַּשְׂכִּיל
  choice: der Einsichtige
  rationale: Das Hifil-Partizip von שכל bezeichnet einen Menschen, der Einsicht besitzt und entsprechend verständig handelt. „Der Einsichtige“ bewahrt die substantivische, maskuline Singularform und lässt sowohl Erkenntnis als auch kluges Verhalten anklingen.
- source_word: בָּעֵת הַהִיא
  choice: in jener Zeit
  rationale: Gibt den Rückverweis auf die bestimmte, im Zusammenhang beschriebene Zeit präzise und idiomatisch wieder.
- source_word: יִדֹּם
  choice: schweigt
  rationale: דמם bezeichnet hier das Still- oder Schweigsamsein. Das deutsche Präsens gibt die festgestellte beziehungsweise typische Reaktion knapp wieder, ohne ein freiwilliges oder erzwungenes Schweigen festzulegen.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für das Schweigen ein und erhält den argumentativen Zusammenhang.
- source_word: עֵת רָעָה
  choice: eine böse Zeit
  rationale: Bewahrt die moralische und bedrängende Tragweite von רָעָה, statt die Aussage zu einem bloß ungünstigen Zeitpunkt abzuschwächen.
- source_word: הִיא
  choice: es ist
  rationale: Das feminine Pronomen bezieht sich auf עֵת; im Deutschen wird dieser Rückbezug idiomatisch mit „es ist“ ausgedrückt.
theological_decisions:
- issue: Geschlecht und repräsentative Bedeutung von הַמַּשְׂכִּיל
  choice: der Einsichtige
  alternative: ein einsichtiger Mensch / wer Einsicht hat
  rationale: Die hebräische Form ist maskuliner Singular und kann einen repräsentativen Typus bezeichnen. Der Haupttext erhält die Form, während die Fußnote klarstellt, dass die Aussage nicht zwingend auf einen bestimmten Mann beschränkt ist.
- issue: Charakter des Schweigens
  choice: schweigt
  alternative: hält sich still / muss schweigen
  rationale: Der hebräische Text nennt das Schweigen, legt aber weder ausdrücklich freiwillige Klugheit noch erzwungene Unterdrückung fest. Die knappe Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und folgerichtig. „Böse Zeit“ bewahrt bewusst sowohl die moralische als auch die leidvolle Dimension des hebräischen Ausdrucks.
