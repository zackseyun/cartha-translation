id: AMO.5.16
reference: Amos 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֲדֹנָ֔/י בְּ/כָל רְחֹב֣וֹת מִסְפֵּ֔ד וּ/בְ/כָל חוּצ֖וֹת יֹאמְר֣וּ הוֹ ה֑וֹ וְ/קָרְא֤וּ אִכָּר֙ אֶל אֵ֔בֶל וּ/מִסְפֵּ֖ד אֶל י֥וֹדְעֵי נֶֽהִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/016.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the Lord: In all the squares there will be wailing, and in all the streets they will say, “Alas! Alas!” They will call the farmer to mourning[b], and those who know lamentation to wailing.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe, der Gott der Heerscharen, der Herr: Auf allen Plätzen wird Wehklage sein, und in allen Straßen wird man rufen: »Ach! Ach!«[a] Man wird den Bauern zur Trauer herbeirufen und die im Klagen Erfahrenen[b] zur Wehklage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Wehe! Wehe!« Der hebräische Ruf הוֹ הוֹ ist hier ein Klageruf; »Ach! Ach!« hebt die Trauer stärker hervor als ein gegen jemanden gerichteter Weheruf.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »diejenigen, die Klage kennen«. Gemeint sein können Menschen, die im Klagen geübt sind, möglicherweise auch berufsmäßige Klageleute.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Anklage und Warnung; im heutigen Deutsch klarer und natürlicher als „Daher“ in dieser Satzstellung.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die traditionelle prophetische Botenformel in knapper, würdiger und allgemein verständlicher Form.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: Bewahrt die Bedeutungsbreite von צְבָאוֹת, ohne ausschließlich irdische oder himmlische Heere festzulegen.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Gibt den hier appositionell gebrauchten göttlichen Titel natürlich wieder.
- source_word: בְּכָל רְחֹבוֹת
  choice: Auf allen Plätzen
  rationale: רְחֹבוֹת bezeichnet breite öffentliche Räume einer Stadt; „Plätze“ bildet den Gegensatz zu den folgenden Gassen verständlich ab.
- source_word: מִסְפֵּד
  choice: Totenklage / Klagegesang
  rationale: Das Wort bezeichnet eine hörbare, öffentliche Trauerklage. Die kontextabhängigen deutschen Wiedergaben vermeiden eine abstrakte Verengung auf bloße innere Trauer.
- source_word: בְכָל חוּצוֹת
  choice: in allen Gassen
  rationale: חוּצוֹת meint hier die Straßen beziehungsweise öffentlichen Wege des Ortes; „Gassen“ passt zum antiken Stadtbild und bildet eine klare Parallele zu „Plätzen“.
- source_word: הוֹ הוֹ
  choice: Ach! Ach!
  rationale: Gibt den doppelten Klageruf als Ausdruck des Schmerzes wieder, ohne ihn zu einem Gerichtsausspruch umzudeuten.
- source_word: אִכָּר
  choice: den Bauern
  rationale: Bezeichnet einen Menschen, der den Boden bearbeitet; der hebräische Singular bleibt als generischer Singular erhalten.
- source_word: יֹדְעֵי נֶהִי
  choice: die Klagekundigen
  rationale: Bewahrt zunächst die wörtliche Vorstellung von Menschen, die sich auf Klagegesänge verstehen, ohne im Haupttext zwingend professionelle Klageleute daraus zu machen.
theological_decisions:
- issue: Wiedergabe der Titelfolge יְהוָה אֱלֹהֵי צְבָאוֹת אֲדֹנָי
  choice: Jahwe, der Gott der Heerscharen, der Herr
  alternative: der HERR, der Gott der Heerscharen, der Herr
  rationale: Der Eigenname יְהוָה wird als „Jahwe“ wiedergegeben; die beiden folgenden Bezeichnungen bleiben als eigenständige, appositionelle Titel erhalten.
- issue: Bezug der angekündigten Klage
  choice: Totenklage
  alternative: Klage
  rationale: Der Zusammenhang kündigt ein umfassendes öffentliches Trauerritual an. „Totenklage“ macht diesen situativen Sinn deutlich, ohne die Ursache der Todesfälle näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Formelsprache. „Klagekundige“ ist bewusst leicht gehoben, aber verständlich, und erhält die Unbestimmtheit des Hebräischen. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
