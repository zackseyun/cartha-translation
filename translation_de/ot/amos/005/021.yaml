  text: שָׂנֵ֥אתִי מָאַ֖סְתִּי חַגֵּי/כֶ֑ם וְ/לֹ֥א אָרִ֖יחַ בְּ/עַצְּרֹֽתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/021.yaml
  text: I hate[a], I reject your festivals, and I will not delight in your solemn assemblies.
translation:
  language: de
  text: Ich hasse, ich verwerfe eure Feste, und an euren Festversammlungen werde ich keinen Gefallen haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich werde bei euren Festversammlungen nicht riechen“ – das heißt: Ich werde sie nicht annehmen und keinen Gefallen an ihnen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Ich hasse
  rationale: Das Qal-Perfekt in prophetischer Rede bezeichnet hier Gottes entschiedene gegenwärtige Abscheu. Das deutsche Präsens gibt die unmittelbare Wucht der Erklärung natürlich wieder.
- source_word: מָאַסְתִּי
  choice: ich verwerfe
  rationale: מָאַס bezeichnet die bewusste Zurückweisung von etwas als unannehmbar. „Verwerfe“ wahrt diesen Willensaspekt, ohne die bereits durch „hasse“ ausgedrückte emotionale Schärfe unnötig zu verdoppeln.
- source_word: חַגֵּיכֶם
  choice: eure Feste
  rationale: חַג bezeichnet religiöse Feste, häufig Wallfahrtsfeste. „Feste“ ist im Deutschen knapp, geläufig und umfasst den kultischen Zusammenhang.
- source_word: וְלֹא
  choice: und … keinen
  rationale: Die Verbindung aus Konjunktion und Verneinung führt die Zurückweisung fort. Die deutsche Konstruktion mit „keinen Gefallen“ gibt die Negation idiomatisch wieder.
- source_word: אָרִיחַ
  choice: habe ich keinen Gefallen
  rationale: Das Verb bedeutet wörtlich „riechen“ und kann im Opfer- und Kultzusammenhang das wohlgefällige Annehmen bezeichnen. Da hier Festversammlungen genannt werden, vermittelt „keinen Gefallen haben“ den Sinn natürlich; das konkrete Geruchsbild bleibt in der Fußnote sichtbar.
- source_word: בְּעַצְּרֹתֵיכֶם
  choice: an euren Festversammlungen
  rationale: עֲצָרָה bezeichnet eine feierliche, kultische Versammlung. „Festversammlungen“ erhält sowohl den religiösen Anlass als auch den formellen Charakter.
theological_decisions:
- issue: Anthropomorphe kultische Rede vom göttlichen Annehmen
  choice: Das Geruchsbild im Haupttext idiomatisch mit „keinen Gefallen haben“ wiedergeben
  alternative: 'Wörtlicher: „Ich werde eure Festversammlungen nicht riechen“'
  rationale: Das Hebräische verwendet die Sprache des Riechens, die im Opferkult Wohlgefallen und Annahme ausdrücken kann. Eine rein wörtliche deutsche Fassung wäre bei „Festversammlungen“ missverständlich oder unnatürlich. Die idiomatische Bedeutung steht daher im Haupttext, während die Fußnote das ursprüngliche Bild bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Ich-Aussage „Ich hasse, ich verwerfe“ erhält die schroffe Parallelität und Nachdrücklichkeit des Hebräischen. Der Fachausdruck „Festversammlungen“ macht den kultischen Rahmen deutlich, bleibt aber allgemein verständlich.
