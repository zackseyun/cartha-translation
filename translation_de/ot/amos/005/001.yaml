id: AMO.5.1
reference: Amos 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר אָנֹכִ֜י נֹשֵׂ֧א עֲלֵי/כֶ֛ם קִינָ֖ה בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/001.yaml
  text: 'Hear this word that I am taking up over you as a lament[a], O house of Israel:'
translation:
  language: de
  text: Hört dieses Wort, das ich als Totenklage über euch anstimme, Haus Israel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das ich über euch als Totenklage erhebe“; auch möglich: „das ich euch betreffend als Klagelied vortrage“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der pluralische Imperativ wird knapp und mit dem für prophetische Aufrufe passenden Aufforderungscharakter wiedergegeben.
- source_word: הַדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: Bewahrt die prophetische Wortformel und gibt דָּבָר in seiner naheliegenden Bedeutung wieder.
- source_word: אֲשֶׁר אָנֹכִי נֹשֵׂא
  choice: das ich … anstimme
  rationale: נשׂא bezeichnet wörtlich ein Aufnehmen oder Erheben; zusammen mit קִינָה ist im Deutschen „eine Totenklage anstimmen“ die natürliche idiomatische Entsprechung.
- source_word: עֲלֵיכֶם
  choice: über euch
  rationale: Bewahrt die Bildrichtung der Präposition עַל und den Klang einer über jemanden erhobenen Klage, ohne vorschnell das stärker deutende „gegen euch“ zu wählen.
- source_word: קִינָה
  choice: als Totenklage
  rationale: קִינָה bezeichnet eine Klage, besonders ein Trauer- oder Totenlied. „Totenklage“ macht hier die erschütternde Vorwegnahme von Israels Untergang deutlich, ohne das Bild inhaltlich auszuweiten.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle und verständliche Wiedergabe erhält das kollektive Bild des Hauses; die Stellung am Satzende trägt die direkte Anrede auch ohne das im heutigen Deutsch unnatürliche „o“.
theological_decisions:
- issue: Ist die Klage lediglich über Israel oder ausdrücklich gegen Israel gerichtet?
  choice: über euch
  alternative: gegen euch
  rationale: Die Präposition עַל kann im Zusammenhang eine feindliche Stoßrichtung haben, doch „über“ wahrt sowohl den Wortlaut als auch die eigentliche Klagebildlichkeit und lässt die Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Prägnanz. „Anstimmen“ gibt die hebräische Verbindung idiomatisch wieder; „Totenklage“ bewahrt ihren ernsten, nahezu vorwegnehmenden Bestattungscharakter. Der Fußnotenmarker steht unmittelbar vor dem abschließenden Satzzeichen.
