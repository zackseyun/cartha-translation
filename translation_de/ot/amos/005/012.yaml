id: AMO.5.12
reference: Amos 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י יָדַ֨עְתִּי֙ רַבִּ֣ים פִּשְׁעֵי/כֶ֔ם וַ/עֲצֻמִ֖ים חַטֹּֽאתֵי/כֶ֑ם צֹרְרֵ֤י צַדִּיק֙ לֹ֣קְחֵי כֹ֔פֶר וְ/אֶבְיוֹנִ֖ים בַּ/שַּׁ֥עַר הִטּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/012.yaml
  text: For I know how many your transgressions are, and how great your sins are—oppressors of the righteous[a], takers of a bribe[b], and those who turn aside the needy in the gate.
translation:
  language: de
  text: 'Denn ich weiß, wie zahlreich eure Vergehen sind und wie groß eure Sünden: Ihr bedrängt den Gerechten, nehmt Bestechungsgeld an und weist die Bedürftigen am Tor[a] ab.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Tor“ ist das Stadttor gemeint, an dem gewöhnlich Rechtsfälle verhandelt und öffentliche Entscheidungen getroffen wurden.
    reason: cultural_note
  - marker: b
    text: 'Oder: „beugt das Recht der Bedürftigen am Tor“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung ein und bewahrt den erklärenden Zusammenhang.
- source_word: יָדַעְתִּי
  choice: ich weiß
  rationale: Das hebräische Perfekt bezeichnet hier Gottes feststehendes Wissen; das deutsche Präsens gibt dies natürlich wieder.
- source_word: רַבִּים פִּשְׁעֵיכֶם
  choice: wie zahlreich eure Vergehen
  rationale: Bewahrt die vorangestellte Größenangabe und gibt פשׁע als bewusste Übertretung wieder, ohne den Ausdruck unnötig auf politische Rebellion zu verengen.
- source_word: וַעֲצֻמִים חַטֹּאתֵיכֶם
  choice: wie schwer eure Sünden sind
  rationale: עֲצֻמִים bezeichnet hier Gewicht oder Ausmaß; „schwer“ vermittelt eher die Schwere als lediglich die Anzahl der Sünden.
- source_word: צֹרְרֵי צַדִּיק
  choice: Ihr bedrängt den Gerechten
  rationale: צרר beschreibt feindseliges Bedrängen. Der generische Singular von צַדִּיק bleibt erhalten; die finite Wendung ist im Deutschen klar und natürlich.
- source_word: לֹקְחֵי כֹפֶר
  choice: nehmt Bestechungsgeld an
  rationale: כֹפֶר kann Lösegeld oder Ausgleichszahlung bedeuten, bezeichnet im Zusammenhang korrupter Rechtsprechung aber plausibel Bestechungsgeld.
- source_word: וְאֶבְיוֹנִים
  choice: die Bedürftigen
  rationale: אֶבְיוֹן bezeichnet wirtschaftlich und gesellschaftlich schutzbedürftige Menschen; „Bedürftige“ erhält diesen sozialen Akzent.
- source_word: בַּשַּׁעַר
  choice: am Tor
  rationale: Das Stadttor war der übliche Ort öffentlicher Verhandlungen und gerichtlicher Entscheidungen; die knappe Ortsangabe bleibt im Text erhalten und wird in der Fußnote erläutert.
- source_word: הִטּוּ
  choice: weist ... ab
  rationale: Der Hifil von נטה bedeutet hier, jemanden vom ordentlichen Rechtsweg beziehungsweise von seinem Anspruch abzudrängen. „Abweisen“ bewahrt das Bild, ohne die rechtliche Folgerung vollständig in den Haupttext einzubauen.
theological_decisions:
- issue: Bedeutung von צַדִּיק im sozialethischen und gerichtlichen Zusammenhang
  choice: der Gerechte
  alternative: der Unschuldige / der im Recht Befindliche
  rationale: „Der Gerechte“ bewahrt die breitere moralisch-rechtliche Bedeutung und verengt das Wort nicht ausschließlich auf die Unschuld in einem Gerichtsverfahren.
- issue: Rechtliche Tragweite von וְאֶבְיוֹנִים בַּשַּׁעַר הִטּוּ
  choice: weist die Bedürftigen am Tor ab
  alternative: beugt das Recht der Bedürftigen am Tor
  rationale: Die gewählte Fassung bleibt näher am Bild des hebräischen Verbs „abbiegen/abweisen“, während die Fußnote die im Kontext naheliegende gerichtliche Deutung ausdrücklich nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eröffnende Parallelismus und die Schwere der prophetischen Anklage bleiben erhalten; die hebräischen substantivischen Partizipien werden zugunsten natürlicher deutscher Syntax als parallele Verbalaussagen wiedergegeben.
