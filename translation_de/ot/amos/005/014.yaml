  text: דִּרְשׁוּ ט֥וֹב וְ/אַל רָ֖ע לְמַ֣עַן תִּֽחְי֑וּ וִ/יהִי כֵ֞ן יְהוָ֧ה אֱלֹהֵֽי צְבָא֛וֹת אִתְּ/כֶ֖ם כַּ/אֲשֶׁ֥ר אֲמַרְתֶּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/014.yaml
  text: Seek good and not evil[a], so that you may live; and so Yahweh, the God of hosts, will be with you, as you have said.
translation:
  language: de
  text: Sucht das Gute und nicht das Böse, damit ihr lebt! So wird Jahwe, der Gott der Heerscharen, mit euch sein, wie ihr gesagt habt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ihr sagt“. Das hebräische Perfekt kann sich auf einen früher erhobenen Anspruch beziehen; im Deutschen ist je nach Akzent auch eine gegenwartsbezogene Wiedergabe möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Sucht
  rationale: דרשׁ bezeichnet hier das entschlossene Suchen bzw. Streben nach etwas. „Sucht“ wahrt den knappen prophetischen Imperativ und lässt dessen moralische und bundestheologische Tragweite offen.
- source_word: טוֹב וְאַל רָע
  choice: das Gute und nicht das Böse
  rationale: Die substantivisch gebrauchten Adjektive bilden einen prägnanten moralischen Gegensatz. Die Artikel sind im Deutschen für diese substantivische Verwendung natürlich.
- source_word: לְמַעַן תִּחְיוּ
  choice: damit ihr lebt
  rationale: למען drückt Zweck oder Folge aus. „Damit ihr lebt“ bleibt nahe am Wortlaut und legt nicht fest, ob vor allem Überleben, Wohlergehen oder Leben in umfassenderem Sinn gemeint ist.
- source_word: וִיהִי כֵן
  choice: Dann wird … sein
  rationale: Die Form mit כֵן bezeichnet hier die aus der Umkehr folgende bzw. erhoffte Wirklichkeit. „Dann wird“ macht diesen Zusammenhang in natürlichem Deutsch deutlich, ohne die Aussage als gegenwärtig und bedingungslos wiederzugeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: „Heerscharen“ bewahrt die Weite von צבאות, das himmlische wie irdische Mächte bezeichnen kann, ohne den Bezug vorschnell einzuengen.
- source_word: אִתְּכֶם
  choice: mit euch
  rationale: Die Präposition bezeichnet hier Jahwes Gegenwart und Beistand bei den Angeredeten; „mit euch“ ist die direkte und idiomatische Wiedergabe.
- source_word: כַּאֲשֶׁר אֲמַרְתֶּם
  choice: wie ihr gesagt habt
  rationale: Das Perfekt verweist am ehesten auf eine bereits geäußerte Behauptung der Angeredeten. Die mögliche gegenwartsbezogene Wiedergabe wird in der Fußnote erhalten.
theological_decisions:
- issue: Ist Jahwes Gegenwart eine bedingungslose Feststellung oder eine Folge des Suchens nach dem Guten?
  choice: 'Die Aussage wird als Folge der geforderten Umkehr formuliert: „Dann wird Jahwe … mit euch sein“.'
  alternative: „So ist/sei Jahwe … mit euch.“
  rationale: Der Zusammenhang verknüpft Leben und göttliche Gegenwart mit der Aufforderung, das Gute zu suchen. Zugleich bleibt durch „wie ihr gesagt habt“ die Spannung zu Israels bisherigem Anspruch auf Gottes Gegenwart bestehen.
- issue: Umfang der mit „leben“ bezeichneten Verheißung
  choice: Die knappe Formulierung „damit ihr lebt“ bleibt erhalten.
  alternative: „damit ihr am Leben bleibt“ oder „damit es euch gut geht“
  rationale: Im Kontext kann das Verb sowohl das Überleben angesichts des Gerichts als auch umfassenderes Leben vor Gott einschließen. Eine erläuternde Ausweitung würde diese Mehrdeutigkeit unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Eindringlichkeit prophetischer Mahnrede. Der Gottesname wird als „Jahwe“ und der traditionelle, semantisch weite Titel als „Gott der Heerscharen“ wiedergegeben. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
