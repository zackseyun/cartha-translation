source:
  edition: WLC
  text: הֲ/לֹא חֹ֛שֶׁךְ י֥וֹם יְהוָ֖ה וְ/לֹא א֑וֹר וְ/אָפֵ֖ל וְ/לֹא נֹ֥גַֽהּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/020.yaml
  text: Is not the day of Yahweh darkness[a], and not light, and gloom with no brightness in it?
translation:
  language: de
  text: Ist der Tag Jahwes nicht Finsternis und nicht Licht, Dunkelheit, ohne jeden Glanz in ihm?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und Dunkelheit und kein Glanz für ihn«.'
    reason: Macht die parataktische Form des Hebräischen und die wörtliche Beziehung von לוֹ auf den »Tag« sichtbar; der Haupttext formuliert sie idiomatischer als »ohne jeden Glanz in ihm«.
lexical_decisions:
- source_word: הֲלֹא
  choice: Ist … nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet, statt sie zu einer ausdrücklichen Behauptung umzuformen.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Gibt das Substantiv prägnant wieder und bildet den deutlichen Gegensatz zu »Licht«.
- source_word: יוֹם יְהוָה
  choice: der Tag Jahwes
  rationale: Bewahrt die prophetische Wendung und gibt den Gottesnamen als Eigennamen wieder.
- source_word: וְלֹא אוֹר
  choice: und nicht Licht
  rationale: Erhält die wiederholte Verneinung und den parallelen Gegensatz des Hebräischen.
- source_word: וְאָפֵל
  choice: Dunkelheit
  rationale: Gibt die verdichtete, düstere Steigerung wieder, ohne einen zusätzlichen Verstärker in den Text einzutragen.
- source_word: וְלֹא נֹגַהּ לוֹ
  choice: ohne jeden Glanz in ihm
  rationale: נֹגַהּ bezeichnet Lichtglanz oder Helligkeit; לוֹ bezieht sich auf den Tag. Die Formulierung ist im Deutschen natürlich und bewahrt das Bild eines Tages ohne jeglichen Lichtschein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottesnamen. »Jahwe« bewahrt dessen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Frage, die wiederholte Verneinung und der scharfe Gegensatz zwischen Finsternis und Licht bleiben erhalten; die abschließende Wendung ist behutsam idiomatisiert.
