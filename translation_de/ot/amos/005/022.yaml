source:
  edition: WLC
  text: כִּ֣י אִם תַּעֲלוּ לִ֥/י עֹל֛וֹת וּ/מִנְחֹתֵי/כֶ֖ם לֹ֣א אֶרְצֶ֑ה וְ/שֶׁ֥לֶם מְרִיאֵי/כֶ֖ם לֹ֥א אַבִּֽיט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/022.yaml
  text: For even if you offer up to me burnt offerings and your grain offerings[a], I will not accept them; and I will not look upon the peace offerings of your fattened animals.
translation:
  language: de
  text: Denn selbst wenn ihr mir Brandopfer und eure Speisopfer darbringt, werde ich sie nicht annehmen; und die Friedensopfer[a] von eurem Mastvieh werde ich nicht ansehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinschaftsopfer“. Das hebräische Wort bezeichnet eine bestimmte Opferart, die mit Wohlergehen und gemeinschaftlicher Teilhabe verbunden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn selbst wenn
  rationale: „Denn“ bewahrt die Verknüpfung mit der vorausgehenden Anklage; „selbst wenn“ gibt den im Kontext naheliegenden konzessiven Sinn wieder.
- source_word: תַּעֲלוּ לִי
  choice: ihr mir … darbringt
  rationale: Der Hifil von עלה bezeichnet bei Opfergaben das Hinaufbringen beziehungsweise Darbringen auf dem Altar. „Darbringen“ ist im Deutschen klar kultisch und zugleich natürlich.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Dies ist die geläufige deutsche Bezeichnung für die Opferart, die auf dem Altar vollständig verbrannt wurde.
- source_word: וּמִנְחֹתֵיכֶם
  choice: und eure Speisopfer
  rationale: מִנְחָה bezeichnet im Opferkontext gewöhnlich eine aus pflanzlichen Erzeugnissen bestehende Opfergabe. „Speisopfer“ erhält die kultische Kategorie, ohne sie zu einer bloß allgemeinen Gabe zu verflachen.
- source_word: לֹא אֶרְצֶה
  choice: werde ich sie nicht annehmen
  rationale: רצה bezeichnet hier die wohlwollende Annahme eines Opfers. Das ergänzte Pronomen „sie“ macht den deutschen Satz flüssig und bezieht sich eindeutig auf die zuvor genannten Opfer.
- source_word: וְשֶׁלֶם
  choice: und die Friedensopfer
  rationale: שֶׁלֶם bezeichnet eine bestimmte Opferart, die mit Wohlergehen und gemeinschaftlicher Teilhabe verbunden ist. „Friedensopfer“ wahrt die traditionelle lexikalische Verbindung zu שָׁלוֹם; die mögliche Wiedergabe „Gemeinschaftsopfer“ wird in einer Fußnote genannt.
- source_word: מְרִיאֵיכֶם
  choice: von eurem Mastvieh
  rationale: Das Wort bezeichnet gemästete beziehungsweise wohlgenährte Opfertiere. „Mastvieh“ ist prägnant, verständlich und nicht archaisch.
- source_word: לֹא אַבִּיט
  choice: werde ich nicht ansehen
  rationale: Die Wiedergabe erhält das Bild des Hinsehens und lässt zugleich den kontextuellen Sinn der verweigerten Beachtung erkennen.
theological_decisions:
- issue: Bewahrung der kultischen Eigenart der verschiedenen Opferbegriffe
  choice: Die einzelnen Kategorien werden als „Brandopfer“, „Speisopfer“ und „Friedensopfer“ wiedergegeben.
  alternative: Eine verallgemeinernde Wiedergabe wie „Opfer“ oder „Opfergaben“.
  rationale: 'Der hebräische Text nennt konkrete Opferarten. Ihre Unterscheidung erhält die Schärfe der prophetischen Kritik: Nicht ein abstraktes religiöses Handeln, sondern Israels konkrete kultische Gaben werden wegen des größeren Zusammenhangs zurückgewiesen.'
- issue: Deutung von שֶׁלֶם
  choice: „Friedensopfer“ im Haupttext, mit „Gemeinschaftsopfer“ als Fußnotenalternative.
  alternative: „Gemeinschaftsopfer“ im Haupttext.
  rationale: Beide Benennungen erfassen Aspekte dieser Opferkategorie. „Friedensopfer“ hält die sprachliche Beziehung zum Wortfeld von Frieden und Wohlergehen sichtbar; die Fußnote bewahrt den Gemeinschaftsaspekt, ohne die Mehrschichtigkeit einseitig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung im zweiten Halbvers hebt „die Friedensopfer“ hervor und bewahrt den parallelen Aufbau. Die traditionellen Opferbezeichnungen bleiben erhalten, werden aber ohne altertümliche Verbformen formuliert.
