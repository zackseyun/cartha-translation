base_translation:
  language: en
  yaml_path: translation/ot/amos/001/010.yaml
  text: So I will send fire upon the wall of Tyre[a], and it will consume her citadels.
translation:
  language: de
  text: Und ich werde Feuer gegen die Mauer von Tyrus senden, und es wird ihre Paläste[a] verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zitadellen“ oder „Festungen“. Das hebräische Wort kann Paläste oder befestigte Herrschafts- beziehungsweise Verteidigungsbauten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: So werde ich … senden
  rationale: Die erste Person Singular mit vorangestelltem וְ führt die Gerichtsankündigung fort. „So“ gibt den folgernden Zusammenhang mit der vorausgehenden Anklage in natürlichem Deutsch wieder; „und“ oder „dann“ wären ebenfalls möglich.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Die direkte Entsprechung bewahrt das prophetische Bild zerstörerischen Gerichts, ohne dessen konkrete Verwirklichung näher festzulegen.
- source_word: בְּחוֹמַת
  choice: gegen die Mauer
  rationale: Die Präposition בְּ bezeichnet hier das Ziel, gegen das sich das angekündigte Feuer richtet. „Gegen die Mauer“ ist im Deutschen klarer und natürlicher als „auf die Mauer“.
- source_word: צֹר
  choice: Tyrus
  rationale: Gebräuchliche deutsche Form des Ortsnamens צור.
- source_word: וְאָכְלָה
  choice: und es wird … verzehren
  rationale: Das Verb bedeutet wörtlich „essen“, wird bei Feuer jedoch idiomatisch für vollständiges Verbrauchen gebraucht. „Verzehren“ bewahrt das kräftige Bild in würdigem, verständlichem Deutsch.
- source_word: אַרְמְנֹתֶיהָ
  choice: ihre Zitadellen
  rationale: אַרְמוֹן kann sowohl einen Palast als auch einen befestigten Herrschafts- oder Verteidigungsbau bezeichnen. Im Zusammenhang mit der Stadtmauer bringt „Zitadellen“ den befestigten Charakter gut zum Ausdruck, ohne die mögliche Bedeutung „Paläste“ zu verschweigen.
theological_decisions:
- issue: Art des Feuers im prophetischen Gericht
  choice: Das Feuer bleibt als Bild beziehungsweise Mittel des von Gott angekündigten Gerichts unbestimmt.
  alternative: Eine ausdrücklich wörtliche Feuersbrunst oder eine ausdrückliche Metapher für einen militärischen Angriff.
  rationale: Der hebräische Text sagt, dass Gott Feuer sendet und dieses die Zitadellen verzehrt, legt aber nicht fest, ob die Aussage wörtlich, militärisch vermittelt oder bildhaft zu verstehen ist. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Gerichtsformel und die Wiederholung der einfachen Satzverknüpfung bleiben erhalten; altertümliche Formen werden vermieden.
