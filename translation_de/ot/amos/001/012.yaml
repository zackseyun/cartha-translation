  source_fidelity: 'Die Übersetzung gibt die hebräische Gerichtsankündigung sachgerecht wieder: שׁלח im Hifil als „schicken“, אֵשׁ konkret als „Feuer“ und אכל mit Feuer als Subjekt idiomatisch als „verzehren“. „Gegen Teman“ ist für die Zielrichtung von בְּ in dieser Gerichtsformel eine gut vertretbare, natürliche deutsche Wiedergabe. Die Genitivverbindung „die Paläste von Bozra“ entspricht dem hebräischen Konstrukt.'
  naturalness: „Darum werde ich Feuer gegen Teman schicken, und es wird die Paläste von Bozra verzehren“ ist modernes, würdevolles Standarddeutsch und bewahrt den knappen, kraftvollen Stil des prophetischen Spruchs. Die anaphorische Bezugnahme von „es“ auf „Feuer“ ist klar.
  terminology: Die Ortsnamen Teman und Bozra sind angemessen wiedergegeben. „Paläste“ ist für אַרְמְנוֹת eine mögliche Hauptwiedergabe; die Fußnote hält die relevante alternative Nuance als befestigte Anlage bzw. „Zitadellen“ fest, ohne den Text unnötig zu überladen. Die Gerichts- und Feuerbildsprache wird nicht dogmatisch gedeutet oder abgeschwächt.
