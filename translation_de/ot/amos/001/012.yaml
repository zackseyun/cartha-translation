id: AMO.1.12
reference: Amos 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/תֵימָ֑ן וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בָּצְרָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/012.yaml
  text: So I will send fire upon Teman[a], and it will consume the citadels of Bozrah.
translation:
  language: de
  text: Darum werde ich Feuer gegen Teman schicken, und es wird die Paläste[a] von Bozra verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Zitadellen; das hebräische Wort kann Palastbauten oder befestigte Herrschaftssitze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שִׁלַּחְתִּי
  choice: Darum werde ich … schicken
  rationale: Das ו verbindet den Gerichtsspruch mit der vorausgehenden Anklage und hat hier folgernde Kraft. „Darum“ gibt diesen Zusammenhang im Deutschen natürlich wieder; der Hifil von שׁלח bedeutet „schicken/senden“.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Die konkrete Feuerbildlichkeit der prophetischen Gerichtsformel wird ohne metaphorische Auflösung bewahrt.
- source_word: בְּ/תֵימָן
  choice: gegen Teman
  rationale: Bei dem gesandten Feuer bezeichnet ב das Ziel des Gerichts. „Gegen“ ist im modernen Deutschen idiomatisch und erhält die gerichtete Bedeutung.
- source_word: וְ/אָכְלָה
  choice: und es wird … verzehren
  rationale: אכל bedeutet wörtlich „essen“, bezeichnet mit Feuer als Subjekt aber idiomatisch ein vollständiges Verzehren.
- source_word: אַרְמְנוֹת
  choice: Paläste
  rationale: אַרְמְנוֹת bezeichnet große, repräsentative und häufig befestigte Herrschaftsbauten. „Paläste“ ist die natürliche deutsche Wiedergabe; die mögliche Betonung als befestigte Anlagen wird in der Fußnote festgehalten.
- source_word: בָּצְרָה
  choice: von Bozra
  rationale: Der Ortsname wird in geläufiger deutscher Form wiedergegeben. Die Genitivverbindung entspricht der hebräischen Zuordnung der Paläste zu Bozra.
theological_decisions:
- issue: Prophetische Gerichtsformel
  choice: Die Ankündigung als unmittelbares göttliches Gericht mit konkreter Feuerbildlichkeit wiedergeben.
  alternative: „Feuer“ deutend zu allgemeiner Zerstörung abstrahieren.
  rationale: Der hebräische Text stellt Gott als den Handelnden dar, der Feuer schickt. Die Übersetzung mildert diese Aussage nicht und entscheidet zugleich nicht, ob das Feuer ausschließlich wörtlich oder auch bildhaft zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darum“ stellt den Folgezusammenhang zum vorausgehenden Urteil her; „verzehren“ bewahrt die kraftvolle prophetische Bildsprache. Der Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Ausdruck.
