source:
  edition: WLC
  text: וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מֵֽ/אַשְׁדּ֔וֹד וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מֵֽ/אַשְׁקְל֑וֹן וַ/הֲשִׁיב֨וֹתִי יָדִ֜/י עַל עֶקְר֗וֹן וְ/אָֽבְדוּ֙ שְׁאֵרִ֣ית פְּלִשְׁתִּ֔ים אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/008.yaml
  text: And I will cut off the inhabitant from Ashdod[a], and the one who holds the scepter from Ashkelon; I will turn my hand against Ekron[b], and the remnant of the Philistines shall perish,” says the Lord GOD.
translation:
  language: de
  text: »Ich werde den Bewohner von Aschdod ausrotten und den, der in Aschkelon das Zepter hält.[a] Ich werde meine Hand gegen Ekron wenden,[b] und der Rest der Philister wird zugrunde gehen«, spricht der Herr Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Herrscher von Aschkelon; wörtlich: den, der das Zepter hält.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: Ich werde meine Hand erneut gegen Ekron richten. Die hebräische Wendung bezeichnet eine gezielte Gerichtshandlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Ich werde … ausrotten
  rationale: Das Hifil von כרת bezeichnet hier das Beseitigen beziehungsweise Vernichten. »Ausrotten« gibt die Schärfe des Gerichts in natürlichem Deutsch wieder; das wörtlichere »abschneiden« wäre in diesem Zusammenhang missverständlich.
- source_word: יוֹשֵׁב
  choice: den Bewohner
  rationale: Das substantivierte Partizip bedeutet wörtlich »der Wohnende/Bewohner« und kann stellvertretend oder kollektiv gebraucht sein. Die Übersetzung bewahrt den Singular und legt die Person nicht vorschnell als Herrscher aus.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: den, der … das Zepter hält
  rationale: תמך bedeutet »halten, festhalten«, שֵׁבֶט hier den Herrscherstab beziehungsweise das Zepter. Die Bildsprache bleibt erhalten, während die gemeinte Herrschaftsausübung verständlich ist.
- source_word: וַהֲשִׁיבוֹתִי יָדִי עַל
  choice: Ich werde meine Hand gegen … wenden
  rationale: Die hebräische Wendung beschreibt eine gezielt gegen jemanden gerichtete, möglicherweise erneute Gerichtshandlung. »Meine Hand gegen … wenden« bewahrt das Bild, ohne die nicht im Text stehende Wendung »meine Hand ausstrecken« einzuführen.
- source_word: וְאָבְדוּ
  choice: wird zugrunde gehen
  rationale: אבד ist intransitiv und bezeichnet Untergang oder Vernichtung. »Zugrunde gehen« erhält diese Ergebnisrichtung und den ernsten prophetischen Ton.
- source_word: שְׁאֵרִית פְּלִשְׁתִּים
  choice: der Rest der Philister
  rationale: שְׁאֵרִית bezeichnet das, was übrig geblieben ist. »Der Rest« klingt im heutigen Deutsch natürlicher als »der Überrest« und bewahrt hier den negativen Sinn vollständig.
- source_word: אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  rationale: 'Die im Deutschen etablierte Wiedergabe des zusammengesetzten Gottestitels vermeidet das schwer verständliche »Herr HERR«: אֲדֹנָי wird als »Gott« und der Gottesname durch »der HERR« kenntlich gemacht.'
theological_decisions:
- issue: Bedeutung von יוֹשֵׁב im Gerichtsorakel
  choice: Bewohner
  alternative: Herrscher
  rationale: Obwohl der Parallelismus mit dem Zepterträger eine führende Person nahelegen kann, bedeutet das Wort zunächst »Bewohner«. Die Übersetzung bewahrt diese echte lexikalische Offenheit.
- issue: Wiedergabe des Gottesnamens im Titel אֲדֹנָי יְהוִה
  choice: Gott, der HERR
  alternative: der Herr Jahwe
  rationale: Die gewählte Form entspricht verständlichem, würdigem Standarddeutsch und kennzeichnet den Gottesnamen typografisch, ohne eine bestimmte Rekonstruktion seiner Aussprache in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Gerichtssprache. Die Ortsnamen folgen den gebräuchlichen deutschen Formen Aschdod, Aschkelon und Ekron. Der repräsentative Singular »Bewohner« sowie die Bildausdrücke »das Zepter hält« und »meine Hand … wenden« wurden bewahrt; weniger natürliche Wörtlichkeit wurde nur dort vermieden, wo sie im Deutschen irreführen würde.
