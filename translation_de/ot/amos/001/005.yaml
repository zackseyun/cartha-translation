source:
  edition: WLC
  text: וְ/שָֽׁבַרְתִּי֙ בְּרִ֣יחַ דַּמֶּ֔שֶׂק וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מִ/בִּקְעַת אָ֔וֶן וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מִ/בֵּ֣ית עֶ֑דֶן וְ/גָל֧וּ עַם אֲרָ֛ם קִ֖ירָ/ה אָמַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/005.yaml
  text: I will break the gate-bar of Damascus[a], and I will cut off the inhabitant from the Valley of Aven and the one who holds the scepter from Beth-eden[b]; and the people of Aram will go into exile to Kir,” says Yahweh.
translation:
  language: de
  text: »Ich werde den Torriegel von Damaskus zerbrechen und die Bewohner des Tals Awen[a] ausrotten, ebenso den, der das Zepter hält, aus Bet-Eden[b]. Das Volk von Aram wird nach Kir in die Verbannung ziehen«, sagt Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name »Awen« kann an ein hebräisches Wort für »Unheil«, »Frevel« oder »Nichtigkeit« anklingen; vermutlich liegt hier ein Ortsname mit möglichem prophetischem Wortspiel vor.
    reason: lexical_alternative
  - marker: b
    text: »Bet-Eden« kann wörtlich auch »Haus Edens« bedeuten; historisch wird der Ort teilweise mit Bit-Adini gleichgesetzt.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Ich werde … zerbrechen
  rationale: Das Qal-Perfekt mit Waw führt im prophetischen Gerichtswort die zukünftige Ankündigung fort; »zerbrechen« bewahrt das konkrete Bild der zerstörten Befestigung.
- source_word: בְּרִיחַ דַּמֶּשֶׂק
  choice: den Torriegel von Damaskus
  rationale: בְּרִיחַ bezeichnet den Riegel, mit dem ein Tor gesichert wird. »Torriegel« ist im Deutschen knapp und macht das Befestigungsbild deutlich.
- source_word: וְהִכְרַתִּי יוֹשֵׁב
  choice: den Bewohner … ausrotten
  rationale: כרת bezeichnet ein entschiedenes Beseitigen und kann im Gerichtskontext Vernichtung einschließen. Der singularische Partizip יוֹשֵׁב bleibt repräsentativ und wird nicht unbegründet zu »Herrscher« umgedeutet.
- source_word: מִבִּקְעַת אָוֶן
  choice: aus dem Tal Awen
  rationale: בִּקְעָה bedeutet Tal oder Ebene; אָוֶן wird hier als Ortsname bewahrt, ohne ein mögliches Wortspiel mit »Unheil/Frevel« im Haupttext aufzulösen.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: den, der das Zepter hält
  rationale: Die konkrete Wendung aus »halten/stützen« und »Stab/Zepter« bezeichnet wahrscheinlich einen Machthaber, doch die Übersetzung bewahrt das Bild und legt die Referenz nicht enger fest.
- source_word: מִבֵּית עֶדֶן
  choice: aus Bet-Eden
  rationale: Die Form wird als Ortsname wiedergegeben. Die wörtliche Deutung und die mögliche historische Identifizierung werden in einer Fußnote offengehalten.
- source_word: וְגָלוּ עַם אֲרָם קִירָה
  choice: Das Volk von Aram wird nach Kir in die Verbannung ziehen
  rationale: גלה bezeichnet hier den Gang ins Exil; die aktive Form vermeidet, einen im Satz nicht ausdrücklich genannten Deportierenden einzuführen. Das Richtungssuffix an קִיר wird mit »nach« wiedergegeben.
- source_word: אָמַר יְהוָה
  choice: sagt Jahwe
  rationale: Das prophetische Botenwort wird im Deutschen idiomatisch im Präsens formuliert; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält das Tetragramm ausdrücklich. »Jahwe« gibt den Eigennamen in der im modernen Deutschen geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Identität von יוֹשֵׁב und תוֹמֵךְ שֵׁבֶט
  choice: konkrete Bilder »Bewohner« und »der, der das Zepter hält« bewahren
  alternative: beide Ausdrücke ausdrücklich als Herrscher beziehungsweise politische Führung deuten
  rationale: Der zweite Ausdruck legt Herrschaft nahe, während der erste grammatisch auch kollektiv oder repräsentativ den Bewohner bezeichnen kann. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Bildsprache. Ortsnamen werden transliteriert; mögliche Wortspiele und historische Identifizierungen stehen in den Fußnoten. Die Satzstruktur bleibt nah am parallelen Aufbau des Hebräischen, ohne unnatürliche deutsche Syntax.
