base_translation:
  language: en
  yaml_path: translation/ot/amos/001/014.yaml
  text: I will kindle a fire in the wall of Rabbah[a], and it will consume her citadels, with a battle cry on the day of war[c][b], with a storm on the day of tempest.
translation:
  language: de
  text: Ich werde Feuer in der Mauer von Rabba entzünden, und es wird ihre Paläste[a] verzehren, unter Kriegsgeschrei[b] am Tag des Krieges, mit einem Sturm am Tag des Unwetters.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Festungen“ beziehungsweise „ihre befestigten Herrschaftssitze“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch einen lauten Alarmruf oder ein Signal bezeichnen, das mit Trompetenschall verbunden sein kann.
    reason: lexical_alternative
  - marker: c
    text: Die Sturmbilder können an das Gericht des HERRN als göttlichen Krieger erinnern. Sie lassen jedoch offen, ob der Sturm als wörtliches Geschehen, als Bild oder als theophanische Anspielung zu verstehen ist.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִצַּתִּי אֵשׁ
  choice: Ich werde Feuer … entzünden
  rationale: Das Hifil-Perfekt hat im prophetischen Gerichtswort zukünftige Bedeutung. „Feuer entzünden“ bewahrt sowohl den verursachenden Sinn des Verbs als auch das Feuer als ausdrücklich genanntes Gerichtsmittel.
- source_word: בְּחוֹמַת רַבָּה
  choice: an der Mauer von Rabba
  rationale: Die Präposition ב kann hier örtlich als „an“ wiedergegeben werden. Diese Formulierung ist im Deutschen natürlicher als „in der Mauer“, ohne die Mauer selbst ausdrücklich zum direkten Objekt des Verbrennens zu machen. Der Ortsname wird als „Rabba“ transliteriert.
- source_word: וְאָכְלָה
  choice: und es wird … verzehren
  rationale: Das Feuer ist das sinngemäße Subjekt. „Verzehren“ erhält das kräftige Bild des hebräischen Verbs und ist im Zusammenhang mit Feuer idiomatisch.
- source_word: אַרְמְנוֹתֶיהָ
  choice: ihre Zitadellen
  rationale: אַרְמוֹן kann Palast oder befestigten Herrschaftssitz bezeichnen. „Zitadellen“ passt zum militärischen Zusammenhang und lässt die Bedeutung befestigter Repräsentationsbauten offen; das feminine Suffix bleibt als „ihre“ erhalten.
- source_word: בִּתְרוּעָה
  choice: unter Kriegsgeschrei
  rationale: תְּרוּעָה bezeichnet einen lauten Ruf oder ein Alarmsignal und kann auch mit Trompetenschall verbunden sein. „Kriegsgeschrei“ gibt im unmittelbaren Zusammenhang den martialischen Lärm wieder, ohne die Art des Signals enger festzulegen.
- source_word: בְּיוֹם מִלְחָמָה
  choice: am Tag des Krieges
  rationale: Die Wendung wird formal und verständlich wiedergegeben. „Krieg“ bewahrt den weiteren Bedeutungsumfang von מִלְחָמָה gegenüber dem engeren „Schlacht“.
- source_word: בְּסַעַר בְּיוֹם סוּפָה
  choice: im Sturm am Tag des Unwetters
  rationale: סַעַר und סוּפָה gehören beide zum Wortfeld heftigen Sturmgeschehens. „Sturm“ und „Unwetter“ erhalten die poetische Steigerung, ohne beide Wörter künstlich gleichzusetzen.
theological_decisions:
- issue: Charakter der Gerichts- und Sturmmetaphorik
  choice: Militärische Zerstörung und Sturmgeschehen bleiben als miteinander verbundene Bilder stehen.
  alternative: Die Sturmworte könnten ausdrücklich und ausschließlich als Erscheinung des HERRN als göttlicher Krieger gedeutet werden.
  rationale: Der hebräische Text verbindet Kriegsgeschrei und Kriegstag mit Sturm und Unwetter. Die Übersetzung legt nicht fest, ob das Sturmgeschehen wörtlich, metaphorisch, providenziell oder theophanisch zu verstehen ist.
- issue: Bezug des femininen Suffixes in אַרְמְנוֹתֶיהָ
  choice: „ihre“ bezieht sich auf die als weiblich personifizierte Stadt Rabba.
  alternative: Eine unpersönliche Wiedergabe wie „deren Zitadellen“ oder „die Zitadellen der Stadt“.
  rationale: Die feminine Personifikation von Städten ist im Hebräischen üblich. „Ihre“ bewahrt diese sprachliche Gestalt, ohne zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Die parallele Satzstruktur und die Wiederholung „am Tag“ bleiben erhalten; erklärungsbedürftige Bedeutungsbreiten werden in Fußnoten ausgewiesen.
