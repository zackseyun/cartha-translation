source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י בְנֵֽי עַמּ֔וֹן וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל בִּקְעָ/ם֙ הָר֣וֹת הַ/גִּלְעָ֔ד לְמַ֖עַן הַרְחִ֥יב אֶת גְּבוּלָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/013.yaml
  text: 'Thus says Yahweh: “For three transgressions of the sons of Ammon[a], and for four, I will not revoke it[b], because they ripped open the pregnant women of Gilead in order to enlarge their border.”'
translation:
  language: de
  text: 'So spricht Jahwe: »Wegen drei Verbrechen der Ammoniter[a], ja wegen vier werde ich es nicht zurücknehmen[b]: weil sie die Schwangeren Gileads aufgeschlitzt haben, um ihr Gebiet zu erweitern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Söhne Ammons«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werde ich es nicht abwenden«; gemeint ist wohl das angekündigte Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  choice: Wegen drei Verbrechen ... ja wegen vier
  rationale: Bewahrt die steigernde Zahlenformel. »Verbrechen« gibt hier die schwere, rebellische Schuld von פֶּשַׁע im Zusammenhang mit einem Kriegsgräuel natürlich wieder.
- source_word: בְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die hebräische Wendung »Söhne Ammons« ist eine Volksbezeichnung; »Ammoniter« ist im modernen Deutsch eindeutig und natürlich.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: werde ich es nicht zurücknehmen
  rationale: Bleibt nahe am unbestimmten pronominalen Objekt des Hebräischen, ohne ausdrücklich »Strafe« oder »Urteil« einzufügen.
- source_word: בִּקְעָם הָרוֹת הַגִּלְעָד
  choice: weil sie die Schwangeren Gileads aufgeschlitzt haben
  rationale: »Aufschlitzen« vermittelt die brutale Bedeutung von בקע; »die Schwangeren« gibt das substantivierte Adjektiv wieder, und »Gileads« lässt die Zugehörigkeit der Opfer erkennen.
- source_word: לְמַעַן הַרְחִיב אֶת גְּבוּלָם
  choice: um ihr Gebiet zu erweitern
  rationale: Gibt den Zweck natürlich wieder. גְּבוּל kann die Grenze oder das dadurch bezeichnete Gebiet meinen; im Deutschen ist »Gebiet erweitern« idiomatischer als »Grenze erweitern«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: »Jahwe« macht den im Ausgangstext stehenden Eigennamen sichtbar und folgt der vorgegebenen Projektentscheidung.
- issue: Unbestimmter Bezug von לֹא אֲשִׁיבֶנּוּ
  choice: ich werde es nicht zurücknehmen
  alternative: ich werde die Strafe nicht zurücknehmen
  rationale: Das Hebräische nennt den Bezug des Pronomens nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit; die Fußnote erläutert den wahrscheinlich gemeinten Gerichtsbeschluss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die harte Gewaltschilderung wird ohne Abschwächung wiedergegeben; die formelhafte Zahlsteigerung und die Unbestimmtheit des pronominalen Objekts bleiben erhalten.
