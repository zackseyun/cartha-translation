source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י אֱד֔וֹם וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל רָדְפ֨/וֹ בַ/חֶ֤רֶב אָחִי/ו֙ וְ/שִׁחֵ֣ת רַחֲמָ֔י/ו וַ/יִּטְרֹ֤ף לָ/עַד֙ אַפּ֔/וֹ וְ/עֶבְרָת֖/וֹ שְׁמָ֥רָ/ה נֶֽצַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/011.yaml
  text: 'Thus says Yahweh: “For three transgressions of Edom[a], and for four, I will not revoke its punishment, because he pursued his brother with the sword and destroyed his compassion; his anger tore continually[c][b], and he kept his wrath forever.”'
translation:
  language: de
  text: 'So spricht Jahwe: »Wegen drei Vergehen Edoms, ja wegen vier nehme ich die Strafe nicht zurück[a]: weil es seinen Bruder[b] mit dem Schwert verfolgte und sein Erbarmen erstickte; sein Zorn wütete unaufhörlich[c], und seinen Grimm hielt es für immer fest.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich wende es nicht zurück«, das heißt: Ich nehme das angekündigte Gericht nicht zurück.'
    reason: lexical_alternative
  - marker: b
    text: »Sein Bruder« erinnert wahrscheinlich an die Verwandtschaft Edoms mit Israel durch Esau und Jakob.
    reason: cross_reference
  - marker: c
    text: 'Oder, näher am hebräischen Bild: »Sein Zorn zerriss unaufhörlich.« Das Hebräische gebraucht ein Verb für das Zerreißen durch ein Raubtier; die Satzbeziehung ist ungewöhnlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: פִּשְׁעֵי
  choice: Vergehen
  rationale: Bezeichnet schwere schuldhafte Übertretungen und klingt in der prophetischen Anklage natürlich, ohne sie auf eine rein juristische Kategorie festzulegen.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: nehme ich die Strafe nicht zurück
  rationale: Gibt die idiomatische Bedeutung wieder, dass Jahwe das angekündigte Strafgericht nicht zurücknimmt; das im Hebräischen nur pronominal bezeichnete Objekt wird zur Verständlichkeit expliziert.
- source_word: רָדְפוֹ בַחֶרֶב אָחִיו
  choice: weil es seinen Bruder mit dem Schwert verfolgte
  rationale: Bewahrt das singularische, personifizierte Edom sowie die familiäre Bezeichnung »Bruder« und die Schwertmetapher.
- source_word: שִׁחֵת רַחֲמָיו
  choice: sein Erbarmen erstickte
  rationale: Natürliches Deutsch für die gewaltsame Unterdrückung des eigenen Mitgefühls; »vernichtete sein Erbarmen« wäre formaler, aber weniger idiomatisch.
- source_word: וַיִּטְרֹף לָעַד אַפּוֹ
  choice: sein Zorn zerriss unaufhörlich
  rationale: Erhält das ungewöhnliche, lebhafte Bild des Zerreißens wie durch ein Raubtier und lässt die syntaktische Spannung des Hebräischen bestehen.
- source_word: וְעֶבְרָתוֹ שְׁמָרָה נֶצַח
  choice: und seinen Grimm bewahrte es für immer
  rationale: Bewahrt die parallele Aussage vom dauerhaft festgehaltenen Grimm sowie das personifizierte nationale Subjekt.
theological_decisions:
- issue: Personifizierung Edoms und singularische Pronomen
  choice: Edom wird mit dem sächlichen deutschen Pronomen »es« personifiziert.
  alternative: Maskulines »er« oder pluralisches »sie« für die Edomiter.
  rationale: Das Hebräische behandelt Edom singularisch. Im Deutschen verlangt der Ländername ohne ergänzendes Maskulinum normalerweise »es«; so bleibt der Numerus erhalten, ohne unnatürliches Deutsch zu erzeugen.
- issue: Die Bezeichnung Israels als Edoms Bruder
  choice: »seinen Bruder« bleibt wörtlich im Haupttext stehen.
  alternative: »sein Brudervolk« oder »seinen Verwandten«.
  rationale: Die familiäre Sprache trägt die theologische und geschichtliche Anklage, wahrscheinlich vor dem Hintergrund von Esau und Jakob; eine erklärende Umschreibung würde diese Mehrdeutigkeit verengen.
- issue: Objekt von לֹא אֲשִׁיבֶנּוּ
  choice: Das angekündigte Gericht wird als »die Strafe« expliziert.
  alternative: 'Formal: »ich wende es nicht zurück« oder allgemeiner: »ich nehme es nicht zurück«.'
  rationale: Der Kontext der festen Amos-Formel stützt den Bezug auf das Strafgericht. Eine Fußnote bewahrt die formale Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Rhythmus. »Wegen drei … ja wegen vier« bildet die Steigerungsformel verständlich ab. Die seltene Raubtiermetapher im Schlussglied wird bewusst nicht zu »wütete« geglättet. Alle Fußnotenmarker stehen unmittelbar an den einschlägigen Textstellen.
