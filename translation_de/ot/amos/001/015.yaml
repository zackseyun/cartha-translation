  text: וְ/הָלַ֥ךְ מַלְכָּ֖/ם בַּ/גּוֹלָ֑ה ה֧וּא וְ/שָׂרָ֛י/ו יַחְדָּ֖ו אָמַ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/015.yaml
  text: And their king shall go into exile[a], he and his officials together, says Yahweh.
translation:
  language: de
  text: Und ihr König wird ins Exil gehen[a], er und seine führenden Männer gemeinsam, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Milkom“. Manche verstehen die Aussage so, dass der Gott der Ammoniter zusammen mit seinen Priestern oder Amtsträgern ins Exil geht.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלַךְ
  choice: wird gehen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat in der prophetischen Gerichtsankündigung Zukunftsbezug. „Wird gehen“ ist im modernen Deutschen natürlich und bewahrt den ankündigenden Charakter.
- source_word: מַלְכָּם
  choice: ihr König
  rationale: Die masoretische Vokalisierung und das Suffix ergeben unmittelbar „ihr König“; dies passt syntaktisch zu „seine führenden Männer“. Die ebenfalls mögliche Deutung als Göttername Milkom wird wegen der echten Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: בַּגּוֹלָה
  choice: in die Verbannung
  rationale: Die Verbindung bezeichnet die Deportation als Folge der Eroberung. „In die Verbannung gehen“ gibt die durch בְּ markierte Bewegung idiomatisch wieder.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen nimmt den König nachdrücklich wieder auf. Die appositionelle Form „er und …“ bildet dies knapp ab.
- source_word: וְשָׂרָיו
  choice: und seine führenden Männer
  rationale: שָׂרִים bezeichnet hochgestellte Amtsträger, Fürsten oder politische Führer. „Führende Männer“ ist verständlich, würdevoll und lässt offen, ob Hofbeamte, Fürsten oder andere Machthaber gemeint sind.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb betont, dass König und Führungsschicht dasselbe Schicksal erleiden.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die traditionelle deutsche Prophetenformel „spricht“ gibt das hebräische אָמַר im Kontext natürlich wieder. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Bezeichnet מַלְכָּם einen menschlichen König oder den ammonitischen Gott Milkom?
  choice: 'menschlicher Herrscher: „ihr König“'
  alternative: „Milkom“; dann ginge der Gott der Ammoniter zusammen mit seinen Priestern oder Amtsträgern in die Verbannung.
  rationale: Die masoretische Lesung und der anschließende Singular „seine“ stützen „ihr König“. Da der unvokalisierte Konsonantentext zugleich als Milkom verstanden werden kann und der Zusammenhang Ammon betrifft, wird diese theologisch bedeutsame Alternative nicht beseitigt, sondern in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wahrt die knappe prophetische Gerichtsankündigung; „führende Männer“ vermeidet das heute leicht missverständliche oder altertümliche „Fürsten“. Sämtliche Fußnotenmarker erscheinen im Haupttext.
