source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י דַמֶּ֔שֶׂק וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל דּוּשָׁ֛/ם בַּ/חֲרֻצ֥וֹת הַ/בַּרְזֶ֖ל אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/003.yaml
  text: 'Thus says Yahweh: “For three transgressions of Damascus[a], and for four, I will not revoke it, because they threshed Gilead with threshing sledges of iron.”'
translation:
  language: de
  text: 'So spricht Jahwe:


    »Wegen drei Vergehen von Damaskus,


    und wegen vier,


    nehme ich es nicht zurück[a]:


    Denn sie haben Gilead


    mit eisernen Dreschschlitten gedroschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich wende es nicht zurück.« Gemeint sein kann, dass Jahwe das angekündigte Urteil nicht rückgängig macht.'
    reason: Die hebräische Wendung lässt den Bezug von »es« unausgesprochen und erlaubt eine wörtlich-räumliche wie eine gerichtliche Deutung.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי דַמֶּשֶׂק וְעַל אַרְבָּעָה
  choice: Wegen drei Vergehen von Damaskus, ja, wegen vier
  rationale: Erhält die für Amos charakteristische steigernde Zahlenformel. »Vergehen« gibt פֶּשַׁע als schuldhafte Übertretung wieder, ohne die Aussage unnötig einzuengen; »ja« macht die Steigerung im Deutschen natürlich verständlich.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: nehme ich es nicht zurück
  rationale: Folgt der knappen hebräischen Wendung und bewahrt das pronominale Objekt, ohne ausdrücklich »Strafe« oder »Urteil« in den Haupttext einzutragen.
- source_word: עַל דּוּשָׁם
  choice: Denn sie haben … gedroschen
  rationale: Das zweite עַל nennt den Grund des Urteils; »denn« gibt diesen kausalen Zusammenhang idiomatisch wieder. דושׁ wird mit seinem konkreten Bild des Dreschens übersetzt.
- source_word: בַּחֲרֻצוֹת הַבַּרְזֶל
  choice: mit eisernen Dreschschlitten
  rationale: Bezeichnet eiserne Dreschgeräte beziehungsweise Dreschschlitten und bewahrt das gewaltsame Bild des hebräischen Textes.
- source_word: אֶת הַגִּלְעָד
  choice: Gilead
  rationale: Der überlieferte Regionsname bleibt stehen; die Region kann dabei zugleich für ihre Bevölkerung stehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname des Gottes Israels wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bezug von לֹא אֲשִׁיבֶנּוּ
  choice: nehme ich es nicht zurück
  alternative: ich wende es nicht ab; ich nehme die Strafe nicht zurück; ich lasse mich nicht umstimmen
  rationale: Das Hebräische nennt den Bezug des Suffixes nicht ausdrücklich. Die Übersetzung erhält diese Ellipse und vermeidet, Urteil, Strafe oder emotionale Umkehr als alleinige Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. Die Zahlensteigerung und das drastische Dreschbild bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung, auf die sich die Anmerkung bezieht.
