id: AMO.1.9
reference: Amos 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵי צֹ֔ר וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל הַסְגִּירָ֞/ם גָּל֤וּת שְׁלֵמָה֙ לֶ/אֱד֔וֹם וְ/לֹ֥א זָכְר֖וּ בְּרִ֥ית אַחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/009.yaml
  text: 'Thus says Yahweh: “For three transgressions of Tyre[a], and for four, I will not revoke its punishment[c][b], because they delivered up an entire population of exiles to Edom and did not remember a covenant of brotherhood.”'
translation:
  language: de
  text: 'So spricht Jahwe: »Wegen drei Vergehen von Tyrus, ja, wegen vier werde ich es nicht zurücknehmen[a]: weil sie eine ganze Gemeinschaft von Verschleppten an Edom ausgeliefert und sich nicht an einen Bruderbund[b] erinnert haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »werde ich es nicht zurückwenden«. Was zurückgenommen beziehungsweise abgewendet wird, bleibt im Hebräischen unausgesprochen; gemeint ist im Zusammenhang das angekündigte Strafgericht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Bund von Brüdern«; gemeint sein kann ein Bund, der auf Verwandtschaft oder brüderlicher Verbundenheit beruht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel wahrt den feierlichen Botenstil; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי צֹר וְעַל אַרְבָּעָה
  choice: Wegen drei Vergehen von Tyrus, ja, wegen vier
  rationale: Bewahrt die charakteristische steigernde Zahlenformel des Amos. »Vergehen« trägt den moralisch-rechtlichen Sinn von פֶּשַׁע in natürlichem Deutsch.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: werde ich es nicht zurücknehmen
  rationale: Hält die im Hebräischen nicht ausdrücklich bezeichnete Bezugsgröße offen und bewahrt damit die genuine Mehrdeutigkeit; im Zusammenhang ist das angekündigte Strafgericht gemeint.
- source_word: הַסְגִּירָם
  choice: sie ... ausgeliefert
  rationale: Der Hifil von סגר bezeichnet hier die Übergabe von Menschen an eine andere Macht; »ausliefern« gibt den schweren Vorwurf prägnant wieder.
- source_word: גָּלוּת שְׁלֵמָה
  choice: eine ganze Gemeinschaft von Verschleppten
  rationale: Gibt sowohl den kollektiven Sinn von גָּלוּת als auch die Vollständigkeit durch שְׁלֵמָה wieder, ohne den Ausdruck auf einzelne Gefangene zu verengen.
- source_word: לֶאֱדוֹם
  choice: an Edom
  rationale: Entspricht dem Empfänger beziehungsweise Ziel der Auslieferung.
- source_word: וְלֹא זָכְרוּ
  choice: und sich nicht ... erinnert haben
  rationale: Bewahrt den Wortsinn von זכר; der Kontext lässt erkennen, dass dieses Nichterinnern zugleich Missachtung bedeutet.
- source_word: בְּרִית אַחִים
  choice: einen Bruderbund
  rationale: Der knappe deutsche Ausdruck bewahrt sowohl בְּרִית »Bund« als auch die wörtliche Brüderbeziehung von אַחִים und kann einen auf Verwandtschaft oder brüderlicher Verbundenheit beruhenden Bund bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname des Gottes Israels wird als Name sichtbar gemacht, statt durch einen Titel ersetzt zu werden.
- issue: Unausgesprochenes Bezugswort in לֹא אֲשִׁיבֶנּוּ
  choice: »werde ich es nicht zurücknehmen« mit offenem Pronomen
  alternative: »werde ich seine Strafe nicht zurücknehmen«
  rationale: Das Hebräische nennt »Strafe« oder »Gericht« nicht ausdrücklich. Die gewählte Fassung erhält diese formale Offenheit, während der Zusammenhang das angekündigte Gericht nahelegt.
- issue: Bedeutung von בְּרִית אַחִים
  choice: Bruderbund
  alternative: Bund der Brüder / brüderlicher Bund
  rationale: Die Formulierung lässt offen, ob eine politische Allianz, eine historisch verstandene Verwandtschaftsbeziehung oder beides gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Ton. Die Zahlensteigerung und die Offenheit des hebräischen Pronomens bleiben erhalten; ungebräuchliche Wörtlichkeit wird nur in den Fußnoten erläutert.
