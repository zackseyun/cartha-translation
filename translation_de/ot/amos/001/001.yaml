source:
  edition: WLC
  text: דִּבְרֵ֣י עָמ֔וֹס אֲשֶׁר הָיָ֥ה בַ/נֹּקְדִ֖ים מִ/תְּק֑וֹעַ אֲשֶׁר֩ חָזָ֨ה עַל יִשְׂרָאֵ֜ל בִּ/ימֵ֣י עֻזִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה וּ/בִ/ימֵ֞י יָרָבְעָ֤ם בֶּן יוֹאָשׁ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל שְׁנָתַ֖יִם לִ/פְנֵ֥י הָ/רָֽעַשׁ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/001.yaml
  text: The words of Amos[a], who was among the shepherds from Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah and in the days of Jeroboam son of Joash, king of Israel[b], two years before the earthquake.
translation:
  language: de
  text: Die Worte des Amos, der zu den Schafzüchtern aus Tekoa gehörte, die er über Israel sah in den Tagen Usijas, des Königs von Juda, und in den Tagen Jerobeams, des Sohnes des Joasch, des Königs von Israel – zwei Jahre vor dem Erdbeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Die Worte
  rationale: Die Konstruktform eröffnet die prophetische Buchüberschrift; „die Worte“ ist quellennah, würdevoll und im Deutschen geläufig.
- source_word: בַנֹּקְדִים
  choice: zu den Schafzüchtern gehörte
  rationale: נֹקֵד bezeichnet wahrscheinlich spezifischer einen Züchter beziehungsweise Halter von Schafen als allgemein einen Hirten. Die Formulierung gibt zugleich die Präposition בְ im Sinn der Zugehörigkeit wieder.
- source_word: מִתְּקוֹעַ
  choice: aus Tekoa
  rationale: מן bezeichnet die Herkunft; der Ortsname wird als Tekoa wiedergegeben.
- source_word: חָזָה
  choice: schaute
  rationale: Das Verb bezeichnet prophetisches Schauen. „Schaute“ bewahrt die Bildlichkeit, ohne erklärend „in einer Vision empfing“ einzufügen.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: „Über“ erhält die mögliche Spannweite der Präposition עַל zwischen „über/betreffend“ und einer gegen Israel gerichteten Botschaft besser als eine eindeutig wertende Formulierung.
- source_word: בִּימֵי ... וּבִימֵי
  choice: in den Tagen ... und in den Tagen
  rationale: Die traditionelle Zeitformel wird formal und zugleich verständlich wiedergegeben.
- source_word: שְׁנָתַיִם לִפְנֵי הָרָעַשׁ
  choice: zwei Jahre vor dem Erdbeben
  rationale: Direkte Wiedergabe der Zeitangabe; der bestimmte Artikel verweist auf ein bekanntes Erdbeben.
theological_decisions:
- issue: Bezug von אֲשֶׁר חָזָה auf „die Worte“
  choice: 'Der ungewöhnliche Bezug bleibt erhalten: „Er schaute sie“.'
  alternative: Glättung zu „die Vision, die er sah“ oder „die Botschaft, die er empfing“
  rationale: Im Hebräischen sind es formal die „Worte“, die Amos schaute. Die Wiedergabe bewahrt die Verbindung von Wort und prophetischer Schau, ohne sie interpretierend aufzulösen.
- issue: Bedeutung von עַל יִשְׂרָאֵל
  choice: über Israel
  alternative: gegen Israel
  rationale: Die Präposition kann in prophetischem Zusammenhang sowohl das Thema als auch eine gegnerische Ausrichtung anzeigen. „Über“ bewahrt diese Spannung im Haupttext; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Überschrift wurde nach „Tekoa gehörte“ in zwei Sätze gegliedert, während der semantisch auffällige Bezug des prophetischen Schauens auf die „Worte“ durch das Pronomen „sie“ erhalten bleibt.
