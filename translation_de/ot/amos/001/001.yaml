revisions:
- from: Die Worte des Amos, der zu den Schafzüchtern aus Tekoa gehörte. Er schaute sie über Israel[a] in den Tagen Usijas, des Königs von Juda, und in den Tagen Jerobeams, des Sohnes des Joasch, des Königs von Israel – zwei Jahre vor dem Erdbeben.
  to: Die Worte des Amos, der zu den Schafzüchtern aus Tekoa gehörte, die er über Israel sah in den Tagen Usijas, des Königs von Juda, und in den Tagen Jerobeams, des Sohnes des Joasch, des Königs von Israel – zwei Jahre vor dem Erdbeben.
  rationale: Die zwei deutschen Sätze werden zu einer relativen Überschrift verbunden. Damit bleibt die im Hebräischen auffällige Verknüpfung von „Worten“ und „sehen“ erhalten, während die unnatürliche Formulierung „Er schaute sie“ vermieden wird. Die Fußnote wird unverändert beibehalten.
