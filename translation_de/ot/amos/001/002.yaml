  text: וַ/יֹּאמַ֓ר יְהוָה֙ מִ/צִיּ֣וֹן יִשְׁאָ֔ג וּ/מִ/ירוּשָׁלִַ֖ם יִתֵּ֣ן קוֹל֑/וֹ וְ/אָֽבְלוּ֙ נְא֣וֹת הָ/רֹעִ֔ים וְ/יָבֵ֖שׁ רֹ֥אשׁ הַ/כַּרְמֶֽל׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/002.yaml
  text: 'And he said: Yahweh roars from Zion and gives his voice from Jerusalem[a]; the pastures of the shepherds mourn[c][b], and the summit of Carmel dries up.'
translation:
  language: de
  text: 'Und er sagte:


    Jahwe brüllt vom Zion,


    aus Jerusalem lässt er seine Stimme erschallen[a].


    Die Weideplätze der Hirten trauern[b],


    und der Gipfel des Karmel verdorrt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gibt er seine Stimme«; auch: »erhebt er seine Stimme«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Die Weideplätze der Hirten vertrocknen« oder »verdorren«. Das Hebräische personifiziert die Weideplätze als Trauernde; zugleich kann die Form ihr Veröden ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname folgt dem unmittelbar bezeugten Tetragramm und ist im modernen Deutschen geläufig.
- source_word: יִשְׁאָג
  choice: brüllt
  rationale: Das Verb bezeichnet besonders das Brüllen eines Löwen und bewahrt so das eindringliche prophetische Bild.
- source_word: יִתֵּן קוֹלוֹ
  choice: lässt er seine Stimme erschallen
  rationale: Diese natürliche deutsche Wendung bildet den hebräischen Ausdruck »seine Stimme geben« ab, ohne ihn vorschnell als Donner zu deuten.
- source_word: נְאוֹת הָרֹעִים
  choice: die Weideplätze der Hirten
  rationale: Im Zusammenhang bezeichnet נְאוֹת die Weide- oder Auenplätze, die den Hirten beziehungsweise ihren Herden dienen.
- source_word: וְאָבְלוּ
  choice: Da vertrocknen
  rationale: Bei unbelebtem Land kann das Verb dessen Veröden oder Vertrocknen bezeichnen. Im Parallelismus mit »verdorrt« ist die physische Auswirkung hier natürlich; die mögliche Personifikation »trauern« bleibt in der Fußnote erhalten.
- source_word: רֹאשׁ הַכַּרְמֶל
  choice: der Gipfel des Karmel
  rationale: Wörtlich steht »der Kopf des Karmel«; »Gipfel« gibt den geografischen Sinn in natürlichem Deutsch wieder.
- source_word: וַיֹּאמַר
  choice: Und er sagte
  rationale: Die einleitende Erzählform und ihre Anknüpfung an den vorausgehenden Kontext werden knapp und formal bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den persönlichen Gottesnamen, ohne die traditionelle Ersatzlesung in den Haupttext einzutragen.
- issue: Bildhafte Reaktion der Weideplätze
  choice: vertrocknen
  alternative: trauern
  rationale: Das hebräische אָבַל kann sowohl Trauer als auch das Veröden beziehungsweise Vertrocknen des Landes ausdrücken. Der Haupttext hebt im Parallelismus die konkrete Dürre hervor; die personifizierende Lesart wird nicht ausgeschlossen, sondern als Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilengliederung. Das kräftige »brüllt« erhält das Löwenbild; die übrige Sprache bleibt klar und ohne konfessionelle Sonderprägung.
