source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י עַזָּ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל הַגְלוֹתָ֛/ם גָּל֥וּת שְׁלֵמָ֖ה לְ/הַסְגִּ֥יר לֶ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Gaza[a], and for four, I will not revoke its punishment[b], because they carried away an entire population into exile to hand them over to Edom.”'
translation:
  language: de
  text: 'So spricht Jahwe: »Wegen drei Vergehen Gazas und wegen vier nehme ich die Strafe nicht zurück[a], weil sie eine ganze Bevölkerung[b] verschleppten, um sie an Edom auszuliefern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich werde es nicht zurückwenden.« In dieser Gerichtsformel ist gemeint, dass Jahwe die angekündigte Strafe nicht zurücknimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »eine vollständige Schar von Gefangenen«. Die hebräische Wendung betont die Vollständigkeit der Verschleppung, ohne genauer festzulegen, welche Bevölkerungsgruppe betroffen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in der im Deutschen etablierten wissenschaftlichen Form wieder.
- source_word: פִּשְׁעֵי
  choice: Vergehen
  rationale: Bewahrt den moralischen und schuldhaften Sinn von פשע, ohne ihn auf politische Rebellion oder eine enge juristische Kategorie festzulegen.
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  choice: Wegen drei ... und wegen vier
  rationale: Erhält die charakteristische hebräische Steigerungsformel, die das übervolle Maß der Schuld ausdrückt und nicht bloß zum Nachzählen auffordert.
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: nehme ich die Strafe nicht zurück
  rationale: Das Hebräische lautet wörtlich etwa »ich werde es nicht zurückwenden« und lässt den Gegenstand unausgesprochen; im Gerichtsspruch ist die angekündigte Strafe gemeint. Die Ergänzung macht den Sinn in natürlichem Deutsch verständlich und wird in einer Fußnote offengelegt.
- source_word: הַגְלוֹתָם גָּלוּת שְׁלֵמָה
  choice: weil sie ein ganzes Volk verschleppt ... haben
  rationale: Gibt sowohl die gewaltsame Deportation als auch deren umfassenden Charakter knapp und idiomatisch wieder; »Volk« bezeichnet hier die vollständig betroffene Bevölkerungsgruppe.
- source_word: לְהַסְגִּיר
  choice: ausgeliefert
  rationale: Bezeichnet treffend die Übergabe der Verschleppten in die Gewalt Edoms und bewahrt das moralische Gewicht der Handlung.
- source_word: לֶאֱדוֹם
  choice: an Edom
  rationale: Verwendet die übliche deutsche Namensform des Volkes beziehungsweise Landes.
theological_decisions:
- issue: Unausgesprochener Gegenstand bei לֹא אֲשִׁיבֶנּוּ
  choice: Die Strafe wird als im Kontext gemeinter Gegenstand ausdrücklich genannt.
  alternative: »Ich nehme es nicht zurück« oder »ich wende es nicht ab«
  rationale: Die Gerichtsformel in Amos kündigt ein nicht zurückgenommenes Strafgericht an. Da das hebräische Pronomen den Gegenstand nicht ausdrücklich benennt, weist die Fußnote auf die wörtlichere, offenere Form hin.
- issue: Umfang von גָּלוּת שְׁלֵמָה
  choice: »ein ganzes Volk« bezeichnet eine vollständig verschleppte Bevölkerung oder Gruppe.
  alternative: »eine vollständige Schar von Verschleppten« oder »alle Gefangenen«
  rationale: Die Wendung betont die umfassende Deportation. Die Übersetzung wahrt diese Totalität, ohne genauer festzulegen, ob eine gesamte Stadtbevölkerung oder eine vollständige Gruppe von Gefangenen gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Steigerungsformel. Die Satzstruktur bleibt quellennah, während »verschleppt« und »ausgeliefert« die Handlung klar und natürlich ausdrücken. Sämtliche Fußnotenmarker stehen im Haupttext.
