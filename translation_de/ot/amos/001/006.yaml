  to: 'So spricht Jahwe: »Wegen drei Vergehen Gazas und wegen vier nehme ich die Strafe nicht zurück[a], weil sie eine ganze Bevölkerung[b] verschleppten, um sie an Edom auszuliefern.«'
  rationale: Die Revision macht die im Hebräischen durch לְהַסְגִּיר ausgedrückte Absicht der Verschleppung explizit, setzt den lexikalischen Fußnotenanker an die einschlägige Wendung und präzisiert die wörtliche Erläuterung zur Gerichtsformel. Der Sinn und die bewusst nicht weiter spezifizierte Reichweite der vollständigen Deportation bleiben erhalten.
