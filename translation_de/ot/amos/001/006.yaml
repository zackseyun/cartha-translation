  source_fidelity: Die Übersetzung gibt die Gerichtsformel, die nicht zurückgenommene Strafe und die umfassende Verschleppung grundsätzlich zutreffend wieder. Die hebräische Präposition לְהַסְגִּיר bezeichnet jedoch den Zweck der Verschleppung ausdrücklich; dieser sollte im Deutschen durch „um sie ... auszuliefern“ sichtbar bleiben.
  naturalness: Der vorliegende Satz ist verständlich, doch „verschleppt und an Edom ausgeliefert haben“ lässt die Zweckbeziehung und das Objekt des Auslieferns etwas weniger klar erkennen. Die revidierte Fassung ist modernes, würdiges Standarddeutsch und syntaktisch eindeutig.
  terminology: „Jahwe“, „Vergehen“, „Strafe“, „verschleppen“ und „an Edom ausliefern“ sind sachgerecht. „Eine ganze Bevölkerung“ wahrt die Totalität von גָּלוּת שְׁלֵמָה, ohne „Volk“ im engeren ethnisch-nationalen Sinn nahezulegen.
