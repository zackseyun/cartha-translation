    rationale: Das hebräische Infinitivkonstrukt bedeutet „um sie an Edom auszuliefern“. Die koordinierte Formulierung „verschleppt und ... ausgeliefert“ ist nicht falsch, schwächt aber die im Ausgangstext markierte Zielrichtung der Handlung.
