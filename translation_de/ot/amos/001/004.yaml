  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/בֵ֣ית חֲזָאֵ֑ל וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בֶּן הֲדָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/004.yaml
  text: So I will send fire upon the house of Hazael[a], and it will consume the citadels of Ben-hadad.
translation:
  language: de
  text: Darum werde ich Feuer gegen das Haus Hasaëls senden, und es wird die Paläste[a] Ben-Hadads verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Zitadellen; das hebräische Wort kann palastartige Gebäude oder befestigte Herrschaftssitze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Darum werde ich … senden
  rationale: Das Präfix וְ verbindet den Satz mit der vorausgehenden Anklage. „Darum“ gibt hier die Folgerung im Gerichtswort natürlich wieder; שׁלח im Piel bedeutet „senden“.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Das konkrete Bild des Feuers wird beibehalten, statt es als Krieg oder Gericht auszudeuten.
- source_word: בְּבֵית חֲזָאֵל
  choice: über das Haus Hasaëls
  rationale: בְּ bezeichnet nach „Feuer senden“ das Ziel des Gerichts. „Haus“ bewahrt sowohl den möglichen Bezug auf ein Gebäude als auch auf das Königshaus beziehungsweise die Dynastie.
- source_word: חֲזָאֵל
  choice: Hasaël
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וְאָכְלָה
  choice: und es wird … verzehren
  rationale: אכל bedeutet wörtlich „essen“, bezeichnet mit Feuer als Subjekt jedoch idiomatisch das Verzehren.
- source_word: אַרְמְנוֹת
  choice: Zitadellen
  rationale: Das Wort kann Paläste oder befestigte herrschaftliche Bauten bezeichnen. „Zitadellen“ bringt den wehrhaften Aspekt zum Ausdruck; die lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: בֶּן הֲדָד
  choice: Ben-Hadad
  rationale: Der königliche Personen- beziehungsweise Dynastiename wird nach üblicher deutscher Konvention transliteriert.
theological_decisions:
- issue: Bedeutung von „Haus Hasaëls“
  choice: Die offene Formulierung „Haus Hasaëls“ bleibt erhalten.
  alternative: Eindeutige Festlegung auf Hasaëls Palast oder seine Dynastie.
  rationale: Im prophetischen Gerichtswort kann „Haus“ sowohl den Herrschaftssitz als auch das Königshaus bezeichnen. Der deutsche Text engt diese Mehrdeutigkeit nicht ein.
- issue: Bedeutung des Feuers
  choice: Das konkrete Bild „Feuer“ wird beibehalten.
  alternative: Paraphrase als militärische Zerstörung oder göttliches Gericht.
  rationale: Die Bildsprache des hebräischen Textes soll stehen bleiben, ohne ihre geschichtliche oder theologische Umsetzung vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Gerichtssprache. „Darum“ stellt den Folgerungszusammenhang her; „verzehren“ bewahrt das kräftige Feuerbild. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck, auf den sich die Anmerkung bezieht.
