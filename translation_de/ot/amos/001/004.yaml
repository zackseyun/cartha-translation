  naturalness: „Darum werde ich“ und „verzehren“ passen zu einem modernen, würdevollen prophetischen Register. „Feuer gegen das Haus Hasaëls senden“ ist im Deutschen deutlich natürlicher als „Feuer über das Haus Hasaëls senden“.
