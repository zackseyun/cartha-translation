  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/חוֹמַ֣ת עַזָּ֑ה וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/007.yaml
  text: So I will send fire upon the wall of Gaza[a], and it will consume her citadels.
translation:
  language: de
  text: Ich werde Feuer gegen die Mauer von Gaza senden, und es wird ihre Paläste[a] verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Zitadellen. Das hebräische Wort bezeichnet palastartige, häufig befestigte herrschaftliche Gebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: Darum werde ich … senden
  rationale: Das Piel von שׁלח bezeichnet hier Gottes unmittelbares Senden. Das einleitende וְ führt im Zusammenhang die angekündigte Folge des Gerichtsgrundes ein; „Darum“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Die wörtliche Bedeutung passt unverändert zum prophetischen Gerichtsbild.
- source_word: בְּחוֹמַת
  choice: gegen die Mauer
  rationale: Die Präposition ב bezeichnet in Verbindung mit dem gesandten Feuer dessen Ziel beziehungsweise Auftreffen. „Gegen“ formuliert den feindlichen Angriff im Deutschen klar, ohne die Bildsprache auszuweiten.
- source_word: עַזָּה
  choice: Gaza
  rationale: Gängige deutsche Form des Ortsnamens.
- source_word: וְאָכְלָה
  choice: und es wird … verzehren
  rationale: Das feminine Verb bezieht sich auf אֵשׁ („Feuer“) und beschreibt dessen zerstörerische Wirkung. Trotz der Perfektform ist wegen der prophetischen Ankündigung eine deutsche Zukunftsform angemessen.
- source_word: אַרְמְנֹתֶיהָ
  choice: ihre Zitadellen
  rationale: אַרְמוֹן kann einen Palast, besonders aber einen repräsentativen befestigten Bau oder eine Zitadelle bezeichnen. Im Zusammenhang des Gerichts über eine Stadt bewahrt „Zitadellen“ die befestigte und herrschaftliche Nuance; die mögliche Wiedergabe „Paläste“ wird in der Fußnote genannt.
theological_decisions:
- issue: Femininisches Suffix mit Bezug auf Gaza
  choice: ihre Zitadellen
  alternative: die Zitadellen der Stadt
  rationale: Das feminine Singularsuffix personifiziert Gaza als Stadt. „Ihre“ erhält diesen Zug des hebräischen Textes, ohne darüber hinausgehende theologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe zweiteilige Gerichtsformel und das Bild des verzehrenden Feuers bleiben erhalten; die echte Bedeutungsbreite von אַרְמוֹן wird durch die Fußnote offengehalten.
