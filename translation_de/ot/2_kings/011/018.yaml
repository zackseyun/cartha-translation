  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: de
  text: Da ging das ganze Volk des Landes in das Haus des Baal[a] und riss es nieder. Seine Altäre und seine Götterbilder[b] zerschlugen sie gründlich, und Mattan, den Priester des Baal, töteten sie vor den Altären. Dann setzte der Priester Aufseher[c] über das Haus Jahwes[d] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Tempel des Baal«. Wörtlich: »in das Haus des Baal«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine Standbilder« beziehungsweise »seine Bildnisse«.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch die eingesetzte Aufsicht, Ämter oder Ordnungen bezeichnen.
    reason: ambiguity
  - marker: d
    text: Jahwe gibt den hebräischen Gottesnamen JHWH wieder, der traditionell auch mit »der HERR« übersetzt wird.
    reason: divine_name
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Bewahrt die in den Königsbüchern gebräuchliche politisch-soziale Wendung, ohne sie enger als »einfaches Volk« zu deuten.
- source_word: בֵּית הַבַּעַל
  choice: Haus des Baal
  rationale: Gibt בֵּית wörtlich wieder und erhält die bewusste Entsprechung zum später genannten Haus Jahwes; gemeint ist der Baalstempel.
- source_word: וַיִּתְּצֻהוּ
  choice: riss es nieder
  rationale: Bezeichnet das Niederreißen eines Bauwerks und ist im Deutschen anschaulich und natürlich.
- source_word: מִזְבְּחֹתָיו
  choice: seine Altäre
  rationale: Der maskuline Singularsuffix bezieht sich am natürlichsten auf Baal; die personale Form des Hebräischen bleibt erhalten.
- source_word: צְלָמָיו
  choice: seine Götterbilder
  rationale: Bezeichnet kultische Bilder oder Standbilder. »Götterbilder« macht den kultischen Zusammenhang verständlich, ohne eine bestimmte Herstellungsweise vorauszusetzen.
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: zerschlugen sie gründlich
  rationale: Das Adverb הֵיטֵב verstärkt das Zerschlagen und bezeichnet hier dessen gründliche beziehungsweise vollständige Ausführung.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: Mattan, den Priester des Baal
  rationale: Gibt Name und Amt unmittelbar wieder; der Akkusativ wird durch die deutsche Satzstellung kenntlich gemacht.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: vor den Altären
  rationale: Bewahrt die gewöhnliche räumliche Bedeutung von לִפְנֵי, ohne den Ort näher festzulegen.
- source_word: וַיָּשֶׂם הַכֹּהֵן פְּקֻדּוֹת
  choice: Dann setzte der Priester Aufseher ein
  rationale: Im administrativen Zusammenhang kann פְּקֻדּוֹת die eingesetzten Aufsichtspersonen bezeichnen. Die mögliche abstrakte Bedeutung »Aufsicht/Ordnungen« wird in einer Fußnote offengehalten.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: »Haus« erhält den Gegensatz zum Haus des Baal; der Gottesname יהוה wird in seiner im Deutschen üblichen Form »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« gibt ihn ausdrücklich wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Suffixe in מִזְבְּחֹתָיו und צְלָמָיו
  choice: seine Altäre und seine Götterbilder, auf Baal bezogen
  alternative: die Altäre und Götterbilder des Baalhauses
  rationale: Die maskulinen Singularsuffixe verweisen grammatisch am ehesten auf Baal, können sachlich aber die Kultausstattung seines Hauses bezeichnen. Die personale Form wahrt die hebräische Ausdrucksweise.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählbewegung. Die Wiederholung von »Haus« erhält den im Hebräischen hervorgehobenen Gegensatz zwischen dem Baalsheiligtum und dem Haus Jahwes. Die Voranstellung von »Mattan, den Priester des Baal« bewahrt den Nachdruck des hebräischen Satzes.
