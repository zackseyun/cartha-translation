  text: וַ/יִּכְרֹ֨ת יְהוֹיָדָ֜ע אֶֽת הַ/בְּרִ֗ית בֵּ֤ין יְהוָה֙ וּ/בֵ֤ין הַ/מֶּ֨לֶךְ֙ וּ/בֵ֣ין הָ/עָ֔ם לִ/הְי֥וֹת לְ/עָ֖ם לַֽ/יהוָ֑ה וּ/בֵ֥ין הַ/מֶּ֖לֶךְ וּ/בֵ֥ין הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: de
  text: Dann schloss Jojada den Bund[a] zwischen Jahwe, dem König und dem Volk, dass sie Jahwes Volk sein sollten[b], und auch zwischen dem König und dem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schnitt den Bund“; dies ist eine feste hebräische Wendung für das Schließen eines Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dass sie ein Volk für Jahwe sein sollten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: schloss
  rationale: Die Verbindung כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes. Das deutsche „einen Bund schließen“ gibt ihre Bedeutung natürlich wieder, ohne das wörtliche Bild „schneiden“ in den Haupttext zu übernehmen.
- source_word: הַבְּרִית
  choice: den Bund
  rationale: Der bestimmte Artikel wird bewahrt. „Bund“ erhält das feierliche und verpflichtende Gewicht von ברית besser als das allgemeinere „Vereinbarung“.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: zwischen Jahwe, dem König und dem Volk
  rationale: Die Formulierung gibt die drei ausdrücklich genannten Bundesparteien in natürlichem Deutsch wieder; die wiederholte Präposition בין wird nicht unnötig hölzern nachgebildet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: damit sie ein Volk für Jahwe wären
  rationale: Die Formulierung wahrt sowohl die Zweck- beziehungsweise Ergebnisbedeutung des Infinitivs als auch die relationale Ausdrucksweise mit ל, ohne sie im Haupttext vollständig in ein Besitzverhältnis umzudeuten.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: und auch zwischen dem König und dem Volk
  rationale: „Auch“ macht verständlich, dass zusätzlich die Beziehung zwischen König und Volk durch einen Bund geordnet wird, ohne einen neuen Sachgehalt einzuführen.
- source_word: הָעָם
  choice: das Volk
  rationale: „Das Volk“ ist die klare und übliche Wiedergabe für die als Gemeinschaft betrachtete Bevölkerung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt den persönlichen und bundesbezogenen Charakter des Tetragramms.
- issue: Bedeutung der Bundesformel לִהְיוֹת לְעָם לַיהוָה
  choice: ein Volk für Jahwe
  alternative: Jahwes Volk
  rationale: Die gewählte Fassung bleibt näher an der relationalen hebräischen Konstruktion. Die ebenfalls sachlich mögliche possessive Wiedergabe wird in einer Fußnote genannt, ohne die Ausdrucksweise des Ausgangstextes stillschweigend zu vereindeutigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch geläufige deutsche Bundes- und Zweckformulierungen verständlich wiedergegeben.
