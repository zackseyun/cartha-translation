base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: de
  text: 'Und er befahl ihnen: „Folgendes sollt ihr tun: Ein Drittel von euch, das am Sabbat zum Dienst kommt, soll beim Haus des Königs[a] Wache halten,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beim Königspalast“. Wörtlich: „beim Haus des Königs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם
  choice: Und er befahl ihnen
  rationale: Das Piel von צוה bezeichnet ein verbindliches Befehlen; die Pronomenreferenz wird wie im Hebräischen beibehalten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird im natürlichen modernen Deutsch idiomatisch durch einen Doppelpunkt wiedergegeben.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: Folgendes sollt ihr tun
  rationale: Gibt Demonstrativkonstruktion und direktiven Imperfekt prägnant und mit angemessener Verbindlichkeit wieder.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: Ein Drittel von euch
  rationale: Natürliche deutsche Wiedergabe des hebräischen Bruchausdrucks.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: das am Sabbat zum Dienst kommt
  rationale: Der Ausdruck bezeichnet im Kontext die am Sabbat antretende Abteilung; „zum Dienst“ macht den Wachwechsel verständlich, ohne eine bestimmte Uhrzeit einzutragen.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: soll … Wache halten
  rationale: Gibt die Wachpflicht idiomatisch wieder und verbindet sie syntaktisch mit dem vorausgehenden Drittel.
- source_word: בֵּית הַמֶּלֶךְ
  choice: beim Haus des Königs
  rationale: Bewahrt die wörtliche Bildsprache; „bei“ entspricht der Wachstellung am beziehungsweise beim königlichen Gebäude, ohne dessen genaue räumliche Ausdehnung festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Folgendes sollt ihr tun“ ersetzt eine im Deutschen schwerfällige wörtliche Nachbildung. Der Singular „das“ bezieht sich grammatisch auf das Kollektiv „ein Drittel“.
