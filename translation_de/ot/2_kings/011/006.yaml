base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/006.yaml
  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: de
  text: Ein weiteres Drittel soll am Sur-Tor stehen und ein Drittel am Tor hinter den Läufern[a]. Und ihr sollt über das Haus Wache halten, um das Eindringen zu verhindern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Läufer“; gemeint sein können die königlichen Wachen oder die Leibgarde.
    reason: lexical_alternative
  - marker: b
    text: Die Bedeutung des seltenen hebräischen Ausdrucks ist unsicher; möglich sind auch „als Absperrung“ oder „zur Abwehr“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: ein weiteres Drittel
  rationale: Die substantivisch gebrauchte feminine Ordinalzahl bezeichnet im Zusammenhang jeweils eine von drei Abteilungen. „Ein weiteres Drittel“ gibt die fortlaufende Aufteilung im Deutschen natürlich wieder.
- source_word: בְּשַׁעַר סוּר
  choice: am Sur-Tor
  rationale: שַׁעַר bedeutet „Tor“; סוּר wird hier am ehesten als Eigenname verstanden und daher als „Sur“ transliteriert.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: am Tor hinter den Läufern
  rationale: אַחַר bedeutet hier am natürlichsten „hinter“. Die Formulierung bewahrt die räumliche Unbestimmtheit des Hebräischen.
- source_word: הָרָצִים
  choice: den Läufern
  rationale: Das substantivierte Partizip von רוץ bedeutet wörtlich „Läufer“. Im königlichen Umfeld kann damit eine Leibwache oder Gardetruppe gemeint sein; die wörtliche Bezeichnung bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: So sollt ihr … Wache halten
  rationale: Die Verbindung des Verbs שמר mit dem verwandten Substantiv משמרת betont den Wachdienst. „Wache halten“ gibt die Wendung idiomatisch und prägnant wieder.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: בַּיִת heißt wörtlich „Haus“. Da die Bezeichnung hier nicht ausdrücklich zwischen Tempel, Palast und Gebäudekomplex unterscheidet, wird die Offenheit des Ausgangstextes bewahrt.
- source_word: מַסָּח
  choice: um den Zugang zu sperren
  rationale: Das seltene und unsichere Wort bezeichnet im Zusammenhang wahrscheinlich eine absperrende oder abwehrende Funktion der Wache. Die gewählte Formulierung ist verständlich, ohne die lexikalische Unsicherheit zu verschweigen.
