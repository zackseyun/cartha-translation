  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׂמַ֥ח כָּל עַם הָ/אָ֖רֶץ וְ/הָ/עִ֣יר שָׁקָ֑טָה וְ/אֶת עֲתַלְיָ֛הוּ הֵמִ֥יתוּ בַ/חֶ֖רֶב בֵּ֥ית מלך־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: de
  text: Da freute sich das ganze Volk des Landes, und die Stadt kam zur Ruhe. Atalja aber töteten sie mit dem Schwert beim Haus des Königs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „im Haus des Königs“ oder sinngemäß „beim Königspalast“. Die hebräische Ortsangabe ist knapp formuliert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: da freute sich
  rationale: Das Verb שׂמח bezeichnet Freude. „Freute sich“ gibt die kollektive Freude natürlich wieder; „da“ nimmt die erzählerische Folge des וַ auf.
- source_word: כָּל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Die Formulierung bewahrt die feste hebräische Wendung und lässt ihren möglichen gesellschaftlich-politischen Sinn offen, statt sie pauschal zu „alle Einwohner“ zu verengen.
- source_word: וְהָעִיר שָׁקָטָה
  choice: und die Stadt kam zur Ruhe
  rationale: שׁקט bezeichnet Ruhe und das Ende von Unruhen. „Kam zur Ruhe“ klingt im Deutschen natürlich und gibt den erzählerischen Übergang treffend wieder.
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: Atalja aber
  rationale: Die Voranstellung des durch אֵת markierten Objekts hebt Atalja als neues Thema hervor. „Aber“ bildet diesen Themenwechsel idiomatisch ab, ohne einen starken sachlichen Gegensatz einzuführen.
- source_word: הֵמִיתוּ
  choice: töteten sie
  rationale: Der Hifil von מות bedeutet „sterben lassen/töten“. „Töteten sie“ ist knapp, würdig und vermeidet die nicht ausdrücklich festgelegte juristische Präzisierung „hinrichten“.
- source_word: בַחֶרֶב
  choice: mit dem Schwert
  rationale: Das ב ist instrumental; „mit dem Schwert“ gibt Mittel und konkretes Bild unmittelbar wieder.
- source_word: בֵּית מלך
  choice: beim Haus des Königs
  rationale: Die kompakte, präpositionslose Ortsangabe bedeutet wörtlich „Haus des Königs“. „Beim“ wahrt die mögliche Lage am bzw. beim Königshaus, ohne sie sicher ins Innere des Gebäudes zu verlegen.
