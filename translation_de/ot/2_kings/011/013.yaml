source:
  edition: WLC
  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֔ה אֶת ק֥וֹל הָֽ/רָצִ֖ין הָ/עָ֑ם וַ/תָּבֹ֥א אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: de
  text: Als Atalja den Lärm[b] der Leibwache[a] und des Volkes hörte, kam sie zum Volk in das Haus Jahwes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Läufer«; gemeint ist wahrscheinlich die königliche Leibwache.'
    reason: lexical_alternative
  - marker: b
    text: Für »Lärm« steht ein hebräisches Wort, das auch »Schall« oder »Stimme« bedeuten kann.
    reason: lexical_alternative
  - marker: c
    text: Das »Haus Jahwes« ist hier der Tempel beziehungsweise sein Bereich.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: hörte
  rationale: שׁמע bezeichnet hier in der fortlaufenden Erzählung schlicht die akustische Wahrnehmung.
- source_word: עֲתַלְיָה
  choice: Atalja
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition wiedergegeben.
- source_word: קוֹל
  choice: Lärm
  rationale: קוֹל kann Stimme, Schall oder Geräusch bedeuten; bei Leibwache und versammeltem Volk passt hier das hörbare öffentliche Getöse am besten.
- source_word: הָרָצִין
  choice: die Leibwache
  rationale: Wörtlich sind es die »Läufer«; im königlichen Zusammenhang bezeichnet der Ausdruck wahrscheinlich das Wach- oder Leibwächterkorps.
- source_word: הָעָם
  choice: das Volk
  rationale: Die übliche Entsprechung für עָם wahrt den kollektiven Bezug, ohne die versammelte Gruppe näher zu bestimmen.
- source_word: וַתָּבֹא אֶל
  choice: kam sie zu
  rationale: בוא mit אֶל bezeichnet die Bewegung zu einer Personengruppe oder einem Ort hin; »kam zu« ist im deutschen Erzählzusammenhang natürlich.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild »Haus« und gibt den Gottesnamen יהוה als »Jahwe« wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen; die in deutscher Schreibung übliche Form mit J wird verwendet.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die funktionale Wiedergabe »Leibwache« macht den königlichen Kontext verständlich; die wörtliche Alternative bleibt in der Fußnote erhalten. Die ungewöhnliche Bewegung »zum Volk in das Haus Jahwes« wird bewusst nahe an der syntaktisch knappen Vorlage belassen.
