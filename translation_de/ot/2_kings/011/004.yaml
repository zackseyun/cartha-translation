source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: de
  text: Im siebten Jahr sandte Jojada nach den Befehlshabern über Hundert, den Karitern[a] und den Läufern[b] und ließ sie zu sich in das Haus Jahwes bringen. Dort schloss er mit ihnen einen Bund und nahm sie im Haus Jahwes unter Eid. Dann zeigte er ihnen den Sohn des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kreter“. Der hebräische Ausdruck bezeichnet wahrscheinlich eine königliche Gardeeinheit; ihre genaue Identität ist unsicher.'
    reason: alternative_reading
  - marker: b
    text: Mit den „Läufern“ sind wahrscheinlich königliche Leibwächter oder Kuriere gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: Im siebten Jahr
  rationale: Die Zeitangabe eröffnet den neuen Handlungsschritt. Das einleitende ו wird im Deutschen nicht eigens wiedergegeben, da der narrative Anschluss aus dem Zusammenhang deutlich ist.
- source_word: שָׁלַח ... וַיִּקַּח
  choice: sandte ... nach ... und ließ sie ... bringen
  rationale: Die knappe hebräische Abfolge bezeichnet das Aussenden nach den genannten Männern und ihre Herbeiholung. Die deutsche Formulierung bewahrt beide Verben, ohne den ungenannten Boten zum ausdrücklichen Satzglied zu machen.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: Obersten über Hundert
  rationale: Die Wendung bezeichnet militärische Führer von Hundertschaften. Diese Wiedergabe ist verständlich und vermeidet den an das römische Heer gebundenen Ausdruck „Zenturionen“.
- source_word: לַכָּרִי
  choice: den Karitern
  rationale: כָּרִי wird als Bezeichnung einer königlichen Gardeeinheit beziehungsweise Gruppe transliteriert, da ihre genaue Identität unsicher ist. Eine mögliche alternative Zuordnung wird in der Fußnote genannt.
- source_word: וְלָרָצִים
  choice: und den Läufern
  rationale: Die wörtliche Gruppenbezeichnung „Läufer“ bleibt erhalten; im damaligen höfischen Zusammenhang waren damit wahrscheinlich königliche Kuriere oder Leibwächter gemeint.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Bezeichnung „Haus“ wird beibehalten, und der Gottesname יהוה wird im modernen deutschen Bibelregister als „Jahwe“ wiedergegeben.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: schloss er mit ihnen einen Bund
  rationale: כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes; „Bund“ bewahrt das politische und feierliche Gewicht des Vorgangs.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: nahm sie ... unter Eid
  rationale: Die Kausativform besagt, dass Jojada sie schwören ließ. „Unter Eid nehmen“ gibt dies in natürlichem, feierlichem Deutsch wieder.
- source_word: וַיַּרְא אֹתָם אֶת בֶּן הַמֶּלֶךְ
  choice: zeigte er ihnen den Sohn des Königs
  rationale: Die Konstruktion bezeichnet das Vorzeigen beziehungsweise Offenbaren des Königssohns und wird direkt wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottes Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בְּרִית im politischen Geschehen
  choice: Bund
  alternative: Vereinbarung
  rationale: „Bund“ erhält die feierliche und bindende Tragweite des hebräischen Begriffs, ohne den genauen Inhalt oder die beteiligten Verpflichtungen näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärischen und höfischen Gruppenbezeichnungen bleiben möglichst quellennah; kurze Fußnoten erläutern ihre unsichere beziehungsweise kulturgeschichtliche Bedeutung.
