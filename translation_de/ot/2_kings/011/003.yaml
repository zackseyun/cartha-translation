  text: וַ/יְהִ֤י אִתָּ/הּ֙ בֵּ֣ית יְהוָ֔ה מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֑ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/003.yaml
  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: de
  text: Er blieb sechs Jahre lang bei ihr im Haus des HERRN verborgen, während Atalja über das Land herrschte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אִתָּהּ
  choice: Er blieb bei ihr
  rationale: Die Konstruktion bedeutet wörtlich »er war bei ihr«; im Zusammenhang eines sechsjährigen Aufenthalts gibt »blieb« den fortdauernden Zustand natürlich und präzise wieder.
- source_word: בֵּית יְהוָה
  choice: im Haus des HERRN
  rationale: Bezeichnet den Tempel; »Haus des HERRN« wahrt die hebräische Ausdrucksweise und gibt den Gottesnamen nach verbreiteter deutscher Bibelkonvention als HERR wieder.
- source_word: מִתְחַבֵּא
  choice: verborgen
  rationale: Das Partizip bezeichnet seinen fortdauernden Zustand im Versteck. »Verborgen« ist im Deutschen idiomatisch und lässt offen, wie aktiv oder passiv sein Verbergen war.
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: über das Land herrschte
  rationale: Gibt Ataljas fortdauernde königliche Herrschaft wieder; »Land« bewahrt den möglichen Bezug auf das Staatsgebiet, ohne vorschnell »Juda« einzusetzen.
theological_decisions:
- issue: Wiedergabe des Tetragramms יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle Kennzeichnung durch Kapitälchen entspricht der deutschen Bibelkonvention, ohne eine unsichere Aussprache in den Haupttext einzutragen.
- issue: Art von Joaschs Verborgenheit
  choice: verborgen
  alternative: sich versteckend
  rationale: Die reflexive hebräische Form kann einen fortdauernden Zustand des Verstecktseins bzw. Sichverbergens ausdrücken. Im Kontext eines kleinen Kindes vermeidet »verborgen« die unnötige Festlegung auf eigenständiges aktives Handeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzfluss stellt die sechsjährige Verborgenheit in den Vordergrund und wahrt mit »während« den zeitlichen Gegensatz zu Ataljas Herrschaft.
