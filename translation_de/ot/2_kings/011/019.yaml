source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: de
  text: Dann nahm er die Hundertschaftsführer, die Kariter[a], die Läufer[b] und das ganze Volk des Landes mit sich. Gemeinsam führten sie den König vom Haus Jahwes hinab und gelangten durch das Läufertor zum Haus des Königs. Dort setzte er sich auf den Thron der Könige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Keretiter“ beziehungsweise „die Leibwache“. Die Bedeutung des hebräischen Ausdrucks ist unsicher.'
    reason: alternative_reading
  - marker: b
    text: Mit den „Läufern“ ist hier wahrscheinlich ein Korps königlicher Wachen oder Kuriere gemeint; entsprechend ist auch das „Läufertor“ benannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm er … mit sich
  rationale: Das Verb steht im Singular und bezieht sich am natürlichsten auf Jojada. Die trennbare Formulierung gibt im Deutschen den kontextuellen Sinn des Zusammenrufens beziehungsweise Mitnehmens wieder.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: Hundertschaftsführer
  rationale: Die militärische Gliederung nach Hundertschaften bleibt sichtbar, ohne den römisch geprägten Ausdruck „Zenturionen“ einzuführen.
- source_word: הַכָּרִי
  choice: die Kariter
  rationale: Der unsichere hebräische Ausdruck wird lautnah wiedergegeben, statt seine ethnische Zugehörigkeit oder Funktion festzulegen.
- source_word: הָרָצִים
  choice: die Läufer
  rationale: Die konkrete Bedeutung des hebräischen Ausdrucks bleibt im Haupttext erhalten; im königlichen Zusammenhang kann damit eine Leibwache oder ein Kurierkorps gemeint sein.
- source_word: כָּל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Die etablierte Wendung wahrt die mögliche kollektive beziehungsweise gesellschaftliche Bedeutung, ohne sie auf eine bestimmte Bevölkerungsschicht einzuengen.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: Gemeinsam führten sie den König … hinab
  rationale: Der Wechsel zum Plural macht die versammelte Gruppe zum Handlungsträger; „hinab“ bewahrt die räumliche Richtung vom Tempelbezirk zum Palast.
- source_word: מִבֵּית יְהוָה
  choice: vom Haus Jahwes
  rationale: „Haus“ bewahrt die hebräische Ausdrucksweise und die Parallele zum Haus des Königs; der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben.
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: durch das Läufertor
  rationale: Die kompakte deutsche Zusammensetzung gibt den Weg durch das nach den „Läufern“ benannte Tor natürlich wieder.
- source_word: בֵּית הַמֶּלֶךְ
  choice: zum Haus des Königs
  rationale: Die wörtliche Form bewahrt die bewusste Parallele zum „Haus Jahwes“, auch wenn „Königspalast“ idiomatischer möglich wäre.
- source_word: וַיֵּשֶׁב
  choice: Dort setzte er sich
  rationale: Das Singularverb bezieht sich wieder auf den König. „Setzte er sich“ drückt den Vorgang der Thronbesteigung im Deutschen natürlicher aus als bloßes „saß“.
- source_word: עַל כִּסֵּא הַמְּלָכִים
  choice: auf den Thron der Könige
  rationale: Der auffällige Plural bleibt erhalten und lässt den Bezug auf den dynastischen Thron der früheren Könige offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כִּסֵּא הַמְּלָכִים
  choice: Thron der Könige
  alternative: Königsthron
  rationale: Die Pluralform des Ausgangstextes wird nicht geglättet; dadurch bleibt der mögliche dynastische Akzent erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Haus“ und die ungewöhnlichen Ausdrücke „Läufer“ sowie „Thron der Könige“ bewahren bewusst die Bildsprache und Mehrdeutigkeit des Hebräischen; kurze Satzgliederung sorgt dennoch für gute Verständlichkeit.
