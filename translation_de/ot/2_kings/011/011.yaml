  text: וַ/יַּעַמְד֨וּ הָ/רָצִ֜ים אִ֣ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֗/וֹ מִ/כֶּ֨תֶף הַ/בַּ֤יִת הַ/יְמָנִית֙ עַד כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/שְּׂמָאלִ֔ית לַ/מִּזְבֵּ֖חַ וְ/לַ/בָּ֑יִת עַל הַ/מֶּ֖לֶךְ סָבִֽיב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: de
  text: Die Wachen[a] stellten sich auf, jeder mit seinen Waffen in der Hand, von der rechten Seite des Hauses bis zur linken Seite des Hauses[b], beim Altar und beim Haus[c], rings um den König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Läufer«; gemeint ist die königliche Garde.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »von der rechten Seite des Hauses bis zur linken Seite des Hauses«; entsprechend der Ausrichtung kann auch »von der Südseite … bis zur Nordseite« gemeint sein.'
    reason: alternative_reading
  - marker: c
    text: Mit dem »Haus« ist hier der Tempel beziehungsweise der Tempelbereich gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: die Leibwächter
  rationale: Das Partizip bedeutet wörtlich »die Läufer«, bezeichnet in diesem königlich-militärischen Zusammenhang jedoch die bewaffnete königliche Garde. »Leibwächter« gibt die Funktion natürlich und präzise wieder; die wörtliche Möglichkeit bleibt in der Fußnote erhalten.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: jeder mit seinen Waffen in der Hand
  rationale: אִישׁ ist distributiv gebraucht. כְּלִי kann Gerät oder Waffe bezeichnen; im Zusammenhang der bewaffneten Garde ist »Waffen« sachgemäß. »In der Hand« bewahrt das anschauliche Bild unmittelbarer Einsatzbereitschaft.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: von der rechten Seite ... bis zur linken Seite
  rationale: כֶּתֶף bedeutet wörtlich »Schulter«, wird bei Gebäuden aber räumlich im Sinn von »Seite« oder »Flanke« gebraucht.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die Übersetzung bewahrt die Bezeichnung des hebräischen Textes. Im Kontext ist damit der Tempel beziehungsweise sein Gebäudebereich gemeint; dies wird in einer Fußnote erläutert.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: rechts ... links
  rationale: Die Adjektive bezeichnen unmittelbar rechts und links. Bei altorientalischer Ausrichtung können sie auch Süden und Norden entsprechen; diese mögliche räumliche Deutung wird in der Fußnote genannt.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: beim Altar und beim Haus
  rationale: Die Präposition ל beschreibt in dieser knappen räumlichen Angabe wahrscheinlich die Position, kann jedoch auch eine Richtung anzeigen. »Beim« ist im Deutschen natürlich und legt die genaue räumliche Beziehung nicht unnötig fest.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: rings um den König
  rationale: Die Wendung beschreibt die schützende Aufstellung auf allen Seiten des Königs. »Rings um« gibt diesen Sinn knapp und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der räumlichen Bewegung des Hebräischen, ohne im Deutschen steif zu wirken. »Haus« bleibt als quellennaher Ausdruck erhalten und wird erläutert; »Leibwächter« vermeidet das im Deutschen irreführende wörtliche »Läufer«.
