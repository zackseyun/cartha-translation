base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: de
  text: 'Dann führte er den Sohn des Königs heraus, setzte ihm die Krone auf und übergab ihm das Zeugnis[a]. Sie machten ihn zum König und salbten ihn. Dann klatschten sie in die Hände und riefen: »Es lebe der König!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Bundesurkunde« oder »die Vorschrift«. Im Hebräischen steht »das Zeugnis«; wahrscheinlich ist ein schriftliches Dokument gemeint, das mit der Herrschaft und den Pflichten des Königs verbunden war.'
    reason: lexikalische Alternative und Bewahrung der sachlichen Mehrdeutigkeit
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: führte ... heraus
  rationale: Der Hifil von יצא bezeichnet das Herausführen oder Herausbringen. »Führte ... heraus« ist im Deutschen natürlich und bewahrt den kausativen Sinn.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: den Sohn des Königs
  rationale: Die hebräische Status-constructus-Verbindung wird direkt und in modernem Standarddeutsch idiomatisch wiedergegeben.
- source_word: הַנֵּזֶר
  choice: die Krone
  rationale: נֵזֶר bezeichnet hier das königliche Herrschaftszeichen. »Krone« ist allgemein verständlicher als »Diadem«.
- source_word: הָעֵדוּת
  choice: das Zeugnis
  rationale: Die Grundbedeutung »Zeugnis« bewahrt die Offenheit des Hebräischen; im Krönungskontext kann ein schriftliches Dokument mit den Verpflichtungen des Königs gemeint sein.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: Sie machten ihn zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen. Die Formulierung vermeidet eine Gleichsetzung mit dem bereits erwähnten Aufsetzen der Krone.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: salbten ihn
  rationale: Dies ist die übliche und sachlich genaue Wiedergabe von משׁח bei der königlichen Einsetzung.
- source_word: וַיַּכּוּ כָף
  choice: klatschten sie in die Hände
  rationale: Die wörtliche Wendung vom Schlagen der Handfläche bezeichnet hier den öffentlichen Beifall; die deutsche Formulierung gibt das Idiom natürlich wieder.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Es lebe der König!
  rationale: Die feste deutsche Akklamationsformel gibt den hebräischen Jussiv natürlich und mit seiner öffentlichen Segens- und Huldigungsfunktion wieder.
theological_decisions:
- issue: Bedeutung von הָעֵדוּת in der Krönungsszene
  choice: Im Haupttext steht »das Zeugnis«.
  alternative: »die Bundesurkunde« oder »die Vorschrift«
  rationale: Das Wort kann ein schriftliches Zeugnis über die Bundespflichten, möglicherweise das dem König übergebene Gesetz, bezeichnen. Da der hebräische Text dies nicht ausdrücklich festlegt, bleibt die allgemeinere Wiedergabe im Haupttext stehen; mögliche Konkretisierungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bewahren den zügigen Ablauf der Krönungsszene; die direkte Rede verwendet die geläufige königliche Akklamationsformel.
