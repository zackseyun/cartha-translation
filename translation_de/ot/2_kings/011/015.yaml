  text: וַ/יְצַו֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י ה/מיאות פְּקֻדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הוֹצִ֤יאוּ אֹתָ/הּ֙ אֶל מִ/בֵּ֣ית לַ/שְּׂדֵרֹ֔ת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ הָמֵ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן אַל תּוּמַ֖ת בֵּ֥ית יְהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: de
  text: 'Da befahl der Priester Jojada den Anführern der Hundertschaften, die über das Heer eingesetzt waren: »Führt sie zwischen den Reihen hinaus[a]! Wer ihr folgt, den tötet mit dem Schwert!« Denn der Priester hatte gesagt: »Sie darf nicht im Haus Jahwes getötet werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwierig. Möglich sind auch: »außerhalb der Reihen« oder »in den Bereich zwischen den Reihen«. Gemeint ist wahrscheinlich, dass sie durch die geordneten Reihen der Wachen hinausgeführt werden soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: Anführer der Hundertschaften
  rationale: Gibt den judäischen militärischen Rang verständlich und ohne den anachronistischen römischen Titel »Zenturionen« wieder.
- source_word: פְּקֻדֵי הַחַיִל
  choice: die über das Heer eingesetzt waren
  rationale: 'Bewahrt den passiv-administrativen Sinn von פקד: Diese Männer waren mit der Aufsicht über die Streitmacht betraut.'
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: Führt sie … hinaus
  rationale: Der Kausativ von יצא fordert dazu auf, Atalja hinauszubringen; »führt« passt natürlich zu einer bewachten Abführung.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: zwischen den Reihen hinaus
  rationale: Die schwierige hebräische Wendung bezeichnet im Zusammenhang wahrscheinlich das Hinausführen durch beziehungsweise in die geordneten Reihen der Wachen; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: Wer ihr folgt
  rationale: Das substantivierte Partizip im Singular wird generisch wiedergegeben und lässt offen, ob räumliches Nachgehen oder parteiliches Folgen gemeint ist.
- source_word: הָמֵת בֶּחָרֶב
  choice: den tötet mit dem Schwert
  rationale: Gibt die nachdrückliche Befehlsform direkt und würdig wieder.
- source_word: אַל תּוּמַת
  choice: Sie darf nicht … getötet werden
  rationale: Die verneinte passive Jussivform drückt ein klares Verbot aus; das aus dem Zusammenhang erkennbare Subjekt wird ausdrücklich genannt.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Bewahrt das hebräische Bild »Haus« für den Tempel und gibt zugleich den Gottesnamen als Eigennamen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Form »Jahwe« gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm. »Jahwe« wahrt dessen Charakter als Eigenname; die traditionelle Titelersetzung »der HERR« wird nicht in den Text eingetragen.
- issue: Bedeutung von וְהַבָּא אַחֲרֶיהָ
  choice: Wer ihr folgt
  alternative: Wer hinter ihr herkommt
  rationale: Die Formulierung kann ein tatsächliches Nachgehen und im Zusammenhang möglicherweise auch Unterstützung für Atalja bezeichnen. Die knappe deutsche Wendung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Militärische Titel werden verständlich, aber ohne römischen Anachronismus wiedergegeben. Die direkte Rede bleibt knapp und befehlend; die Unsicherheit der Ortsangabe wird nicht im Haupttext übererklärt, sondern in der Fußnote kenntlich gemacht.
