base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: de
  text: Dann gab der Priester den Befehlshabern der Hundertschaften die Speere[a] und die Schilde, die König David gehörten und sich im Haus Jahwes[b] befanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „den Speer“; der Singular kann hier kollektiv gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Tempel Jahwes“. Wörtlich: „im Haus Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Dann gab
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Direkte Wiedergabe des bestimmten Singulars.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: den Obersten über Hundert
  rationale: Die Wendung bezeichnet Befehlshaber militärischer Hundertschaften. Die knappe Form bleibt nahe an der hebräischen Amtsbezeichnung.
- source_word: הַחֲנִית
  choice: die Speere
  rationale: Die Form ist grammatisch singularisch, wird hier aber wegen der Verteilung an mehrere Befehlshaber und der Verbindung mit den pluralischen Schilden wahrscheinlich kollektiv gebraucht.
- source_word: הַשְּׁלָטִים
  choice: die Schilde
  rationale: Im Zusammenhang mit den im Tempel aufbewahrten königlichen Waffen ist „Schilde“ die am besten gestützte Bedeutung.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: die König David gehört hatten
  rationale: Die hebräische Besitzkonstruktion wird natürlich wiedergegeben; das Plusquamperfekt verdeutlicht, dass es sich um Davids aufbewahrte Waffen handelte.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: „Haus“ bewahrt das hebräische Bild, während „Jahwe“ den im Ausgangstext stehenden Gottesnamen wiedergibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder; die traditionelle Ersatzlesung „der HERR“ wird nicht in den Haupttext eingesetzt.
- issue: Singular oder kollektiver Sinn von הַחֲנִית
  choice: die Speere
  alternative: den Speer
  rationale: Der Singular kann kollektiv verstanden werden. Der Zusammenhang mit mehreren Empfängern und den pluralischen Schilden spricht hier für den kollektiven Sinn, ohne die Form des Hebräischen in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Amtsbezeichnung bleibt bewusst quellennah; „Haus Jahwes“ bewahrt die konkrete hebräische Ausdrucksweise.
