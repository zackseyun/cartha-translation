base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: de
  text: 'Da handelten die Obersten über Hundert ganz so, wie der Priester Jojada befohlen hatte. Jeder nahm seine Männer mit: diejenigen, die am Sabbat ihren Dienst antraten, zusammen mit denen, die am Sabbat ihren Dienst beendeten.[a] Und sie kamen zum Priester Jojada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die am Sabbat Kommenden zusammen mit den am Sabbat Gehenden“. Im Zusammenhang sind wahrscheinlich die antretende und die abtretende Dienstgruppe gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: die Obersten über Hundert
  rationale: Die Wendung bezeichnet Befehlshaber von Hundertschaften. „Oberste über Hundert“ bewahrt die militärische Gliederung und klingt würdevoll, ohne den Rang moderner Streitkräfte zu präzisieren.
- source_word: כְּכֹל אֲשֶׁר
  choice: genauso, wie
  rationale: Die Formulierung bringt die vollständige Übereinstimmung mit Jojadas Anweisung natürlich zum Ausdruck.
- source_word: צִוָּה
  choice: befohlen hatte
  rationale: Das Verb bezeichnet eine verbindliche Anordnung; das Plusquamperfekt verdeutlicht im Deutschen, dass der Befehl dem Handeln vorausging.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: Jeder nahm seine Männer mit
  rationale: אִישׁ ist hier distributiv auf die einzelnen Befehlshaber bezogen. „Seine Männer“ gibt die ihnen jeweils unterstellten Männer knapp und natürlich wieder.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: diejenigen, die am Sabbat ihren Dienst antraten
  rationale: Wörtlich sind es die am Sabbat „Kommenden/Eintretenden“. Im Zusammenhang mit den Wachabteilungen bezeichnet dies wahrscheinlich die antretende Dienstgruppe.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: die am Sabbat ihren Dienst beendeten
  rationale: Die parallel gebildete Wendung bezeichnet wahrscheinlich die abtretende Dienstgruppe. Die funktionale Wiedergabe ist im Deutschen klar; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: עִם
  choice: zusammen mit
  rationale: Die Wiedergabe macht deutlich, dass beide Dienstgruppen gemeinsam herangezogen wurden.
- source_word: וַיָּבֹאוּ אֶל
  choice: und sie kamen zu
  rationale: Dies ist eine direkte und natürliche Wiedergabe des üblichen Bewegungsverbs mit אֶל.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der bestimmte Titel wird sachlich und unmittelbar wiedergegeben.
