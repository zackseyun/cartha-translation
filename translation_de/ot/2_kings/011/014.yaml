  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עֹמֵ֨ד עַֽל הָ/עַמּ֜וּד כַּ/מִּשְׁפָּ֗ט וְ/הַ/שָּׂרִ֤ים וְ/הַ/חֲצֹֽצְרוֹת֙ אֶל הַ/מֶּ֔לֶךְ וְ/כָל עַ֤ם הָ/אָ֨רֶץ֙ שָׂמֵ֔חַ וְ/תֹקֵ֖עַ בַּ/חֲצֹֽצְר֑וֹת וַ/תִּקְרַ֤ע עֲתַלְיָה֙ אֶת בְּגָדֶ֔י/הָ וַ/תִּקְרָ֖א קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: de
  text: 'Als sie hinsah, stand der König, wie es Brauch war, bei der Säule[a]. Die Obersten und die Trompeter standen beim König, und das ganze Volk des Landes freute sich und blies die Trompeten. Da zerriss Atalja ihre Kleider und rief: »Verschwörung! Verschwörung!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an der Säule« oder »auf der Säule«. Die hebräische Ortsangabe kann hier unterschiedlich verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Hochverrat! Hochverrat!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Als sie hinsah, stand …
  rationale: Die Wendung eröffnet die plötzlich wahrgenommene Szene. Natürliches modernes Deutsch gibt die deiktische Wirkung von הִנֵּה hier durch den unmittelbaren Szenenwechsel wieder, ohne das altertümliche „siehe“ zu erzwingen.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: stand der König
  rationale: Das Partizip zeichnet die bereits andauernde Haltung des Königs; im deutschen Erzählstil drückt das Präteritum dies natürlich aus.
- source_word: עַל הָעַמּוּד
  choice: auf dem üblichen Platz bei der Säule
  rationale: עַל kann hier „bei/an“ oder enger „auf“ bedeuten. Zusammen mit כַּמִּשְׁפָּט bezeichnet die Formulierung wahrscheinlich den herkömmlichen zeremoniellen Standort des Königs; die Übersetzung bewahrt den Bezug zur Säule, ohne eine unnatürliche Stellung auf der Säule zu behaupten.
- source_word: כַּמִּשְׁפָּט
  choice: auf dem üblichen Platz
  rationale: מִשְׁפָּט bezeichnet hier die feststehende Ordnung beziehungsweise den Brauch, nicht ein Gerichtsurteil. Im Deutschen lässt sich dies im Zusammenhang idiomatisch als der übliche zeremonielle Platz ausdrücken.
- source_word: וְהַשָּׂרִים
  choice: die Obersten
  rationale: שָׂרִים bezeichnet ranghohe Amtsträger oder Befehlshaber. „Oberste“ bleibt gegenüber einer rein militärischen oder höfischen Festlegung offen und passt zum historischen Register.
- source_word: וְהַחֲצֹצְרוֹת אֶל הַמֶּלֶךְ
  choice: die Trompeter standen beim König
  rationale: Wörtlich nennt der Hebräische Text „die Trompeten“, doch in der Aufzählung von beim König stehenden Personen ist metonymisch an die Trompeter zu denken. Die handelnden Trompeter passen zudem zum folgenden Blasen der Instrumente.
- source_word: כָל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Die feste hebräische Bezeichnung wird nah am Wortlaut wiedergegeben und nicht vorschnell auf eine bestimmte soziale oder politische Gruppe eingeengt.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: freute sich und blies die Trompeten
  rationale: Die singularischen Prädikate behandeln das Volk kollektiv. „Die Trompeten blasen“ gibt תקע idiomatisch und konkret wieder.
- source_word: וַתִּקְרַע עֲתַלְיָה אֶת בְּגָדֶיהָ
  choice: Da zerriss Atalja ihre Kleider
  rationale: Die Formulierung bewahrt die traditionelle Geste heftiger Bestürzung und den abrupten Fortgang der Erzählung.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Verschwörung! Verschwörung!
  rationale: קֶשֶׁר bezeichnet eine gegen die Herrschaft gerichtete Verschwörung beziehungsweise einen Aufruhr. Die zweimalige Ausrufung bleibt zur Wahrung der Dramatik erhalten.
theological_decisions:
- issue: Charakterisierung der Ereignisse durch Ataljas Ruf קֶשֶׁר
  choice: „Verschwörung!“ als Ataljas eigener Ausruf
  alternative: „Hochverrat!“
  rationale: Der Erzähler lässt Atalja die Krönung als Verschwörung bezeichnen, ohne ihre Wertung ausdrücklich zu bestätigen. Die Übersetzung bewahrt diese erzählerische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit zügigem Erzählrhythmus. „Atalja“ folgt der im Deutschen gebräuchlichen biblischen Namensform. Das altertümliche „siehe“ wurde nicht mechanisch übernommen; seine dramatische Funktion erscheint im unmittelbaren Szenenaufbau.
