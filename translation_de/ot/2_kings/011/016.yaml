  text: וַ/יָּשִׂ֤מוּ לָ/הּ֙ יָדַ֔יִם וַ/תָּב֛וֹא דֶּֽרֶךְ מְב֥וֹא הַ/סּוּסִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/תּוּמַ֖ת שָֽׁם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: de
  text: Da machten sie ihr Platz[a], und sie ging zum Pferdeeingang am Königspalast[b]; dort wurde sie getötet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da ergriffen sie sie.« Die hebräische Wendung kann als Ergreifen verstanden werden; im Zusammenhang wird sie jedoch auch als »sie machten ihr Platz« gedeutet.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Weg des Eingangs der Pferde, Haus des Königs«. Gemeint ist wahrscheinlich der Zugang beim Palastbereich, durch den Pferde geführt wurden.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: Da legten sie Hand an sie
  rationale: Die konkrete hebräische Wendung wird im Deutschen idiomatisch wiedergegeben. Im Zusammenhang bezeichnet sie das Ergreifen oder Festnehmen Ataljas, ohne die weniger wahrscheinliche Deutung »sie machten ihr Platz« in den Haupttext zu übernehmen.
- source_word: וַתָּבֹא
  choice: Sie ging
  rationale: Das aktive Verb בוא kann je nach Erzählperspektive »kommen« oder »gehen« bedeuten. Hier beschreibt es die Bewegung vom Tempelbereich zum Palast; eine passive Wiedergabe wie »sie wurde geführt« wäre stärker auslegend.
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: durch den Pferdezugang
  rationale: Die Wiedergabe fasst den Weg über beziehungsweise durch den für Pferde bestimmten Zugang natürlich zusammen. מְבוֹא bezeichnet einen Eingang oder Zugang, nicht zwingend ein baulich genau bestimmtes Tor.
- source_word: בֵּית הַמֶּלֶךְ
  choice: in den Königspalast
  rationale: Wörtlich steht »Haus des Königs«. Im Kontext ist der königliche Palastkomplex gemeint; »Königspalast« ist im modernen Deutschen eindeutig und natürlich.
- source_word: וַתּוּמַת
  choice: wurde sie getötet
  rationale: Die Hofal-Form von מות ist kausativ-passiv und besagt, dass man ihren Tod herbeiführte. »Wurde getötet« bildet dies präziser ab als das bloße »starb«.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb kennzeichnet den Ort ihrer Tötung.
