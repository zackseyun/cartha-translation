- from: Da legten sie Hand an sie[a]. Sie ging durch den Pferdezugang in den Königspalast[b], und dort wurde sie getötet.
  to: Da machten sie ihr Platz[a], und sie ging zum Pferdeeingang am Königspalast[b]; dort wurde sie getötet.
