review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von וַיָּשִׂימוּ לָהּ יָדַיִם als »legten sie Hand an sie« entscheidet sich für eine mögliche, aber umstrittene Deutung und klingt im Deutschen zudem nach einem tätlichen Angriff. Der erzählerische Fortgang, dass Atalja anschließend selbst weitergeht, lässt die ebenfalls gut belegte Deutung »sie machten ihr Platz / gaben ihr den Weg frei« besonders naheliegen. Diese sollte im Haupttext stehen, während die Alternative in der Anmerkung erhalten bleibt. Der Weg über den Pferdeeingang wird mit einer weniger räumlich überbestimmten Formulierung wiedergegeben.
  naturalness: »Da legten sie Hand an sie« ist im heutigen Standarddeutsch unidiomatisch bzw. missverständlich; üblich wäre allenfalls »Hand an sie legen«, was hier leicht Gewalt impliziert. »Da machten sie ihr Platz« ist knapp, natürlich und bewahrt den Erzählfluss. »Zum Pferdeeingang am Königspalast« ist natürlicher als »durch den Pferdezugang in den Königspalast« und legt nicht zusätzlich fest, dass sie durch ihn in das Gebäude hineinging.
  terminology: »Königspalast« ist als kontextuelle Bezeichnung für בֵּית הַמֶּלֶךְ angemessen. »Wurde sie getötet« gibt die passive kausative Verbform וַתּוּמַת sachgerecht wieder, ohne über die Aussage des Textes hinauszugehen. Die Fußnote zur ersten Wendung muss die alternative Deutung als echte Möglichkeit kenntlich machen, nicht nur als weniger wahrscheinliche Übersetzungsvariante.
  issues:
  - severity: medium
    issue: Die Formulierung »Da legten sie Hand an sie« ist semantisch und idiomatisch problematisch.
    rationale: Sie kann im Deutschen einen gewaltsamen Übergriff bedeuten und legt damit die umstrittene Bedeutung »sie ergriffen sie« fest. Die hebräische Wendung wird in diesem Kontext auch plausibel als »sie machten ihr Platz« verstanden; der nachfolgende Bewegungsablauf stützt diese Lesart.
  - severity: low
    issue: »durch den Pferdezugang in den Königspalast« ist stärker festgelegt als der hebräische Ausdruck.
    rationale: Der Text nennt den Weg des Pferdeeingangs beim Haus des Königs, bestimmt aber nicht ausdrücklich, dass Atalja durch einen Zugang in das Gebäude hineinging. Eine Richtungsangabe zum Eingang bewahrt die räumliche Aussage offener.
  revised_text: Da machten sie ihr Platz[a], und sie ging zum Pferdeeingang am Königspalast[b]; dort wurde sie getötet.
