revisions:
- from: Doch Joscheba, die Tochter König Jorams und Schwester Ahasjas, nahm Joasch, den Sohn Ahasjas, und stahl ihn aus den Reihen der Königssöhne weg, die gerade getötet wurden. Sie brachte ihn zusammen mit seiner Amme[b] in die Schlafkammer[a]. Dort versteckten sie[c] ihn vor Atalja, sodass er nicht getötet wurde.
  to: Doch Joscheba, die Tochter König Jorams und Schwester Ahasjas, nahm Joasch, den Sohn Ahasjas, und stahl ihn zusammen mit seiner Amme[b] aus der Mitte der Königssöhne fort, die getötet werden sollten, und brachte sie in die Schlafkammer[a]. Dort versteckten sie[c] ihn vor Atalja, sodass er nicht getötet wurde.
  rationale: Die Revision vermeidet eine zu starke Festlegung auf den zeitlichen Vollzug der Tötungen und verbindet Joasch und seine Amme wieder unmittelbar mit dem heimlichen Fortnehmen. „Sie“ in „brachte sie“ bezieht sich auf Joasch und seine Amme; das folgende pluralische „versteckten sie“ bleibt, wie im Hebräischen, hinsichtlich der handelnden Gruppe offen. Fußnotenanker und Fußnotentexte bleiben vollständig und sachgerecht.
