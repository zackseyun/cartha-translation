  - severity: low
    issue: Anbindung der Amme an die Rettung
    rationale: Die getrennte Wiedergabe „Sie brachte ihn zusammen mit seiner Amme“ ist verständlich, doch das Hebräische verbindet Joasch und seine Amme enger mit dem heimlichen Fortnehmen und Unterbringen. Eine integrierte Formulierung bildet den Satzfluss und die Ereignisverknüpfung besser ab.
