source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: de
  text: Doch Joscheba, die Tochter König Jorams und Schwester Ahasjas, nahm Joasch, den Sohn Ahasjas, und stahl ihn zusammen mit seiner Amme[b] aus der Mitte der Königssöhne fort, die getötet werden sollten, und brachte sie in die Schlafkammer[a]. Dort versteckten sie[c] ihn vor Atalja, sodass er nicht getötet wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Raum der Betten“; auch: „im Schlafgemach“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die Frau, die ihn stillte.
    reason: lexical_clarification
  - marker: c
    text: 'Das hebräische Verb steht im Plural: „sie versteckten ihn“.'
    reason: source_form
lexical_decisions:
- source_word: וַתִּקַּח
  choice: nahm
  rationale: Das häufige narrative Verb לקח wird schlicht und ohne zusätzliche Deutung mit „nahm“ wiedergegeben.
- source_word: יְהוֹשֶׁבַע
  choice: Joscheba
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, hebräischen Lautung folgenden Form wiedergegeben; die abweichende Namensform in der Chronik wird nicht eingetragen.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: die Tochter König Jorams
  rationale: Die Konstruktverbindung bezeichnet Joscheba als Tochter des Königs Joram; die Formulierung ist natürlich und bewahrt den Königstitel.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: Schwester Ahasjas
  rationale: אחות bezeichnet hier seinem gewöhnlichen Wortsinn nach eine Schwester; genealogische Harmonisierungen werden nicht in die Übersetzung eingetragen.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: stahl ihn … weg
  rationale: גנב bedeutet wörtlich „stehlen“. „stahl ihn weg“ bewahrt sowohl die lexikalische Kraft als auch den heimlichen Charakter der Rettung.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: aus den Reihen der Königssöhne
  rationale: Die Wendung gibt „aus der Mitte der Söhne des Königs“ natürlich wieder, ohne das deutendere Wort „Prinzen“ einzusetzen.
- source_word: הַמּוּמָתִים
  choice: die gerade getötet wurden
  rationale: Das Hoph'al-Partizip beschreibt Menschen, die zu Tode gebracht werden; „gerade“ verdeutlicht den im Kontext laufenden Vorgang.
- source_word: מֵינִקְתּוֹ
  choice: seine Amme
  rationale: Das Substantiv bezeichnet die Frau, die das Kind stillt. „Amme“ ist im Deutschen präziser als das allgemeinere „Pflegerin“.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: in die Schlafkammer
  rationale: Die wörtliche Wendung „im Raum der Betten“ bezeichnet einen Schlafraum. „Schlafkammer“ ist verständlich und behält einen würdigen erzählerischen Ton; die konkrete Formulierung steht in der Fußnote.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: sie versteckten ihn
  rationale: Die masoretische Verbform steht im Plural und wird nicht zu einem Singular geglättet.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: vor Atalja
  rationale: מִפְּנֵי bezeichnet hier das Verbergen vor ihrer Wahrnehmung und Bedrohung; „vor Atalja“ ist die natürliche deutsche Entsprechung.
- source_word: וְלֹא הוּמָת
  choice: sodass er nicht getötet wurde
  rationale: Die Passivform von מות wird bewahrt; „sodass“ macht die im Zusammenhang erkennbare Folge des Versteckens deutlich.
theological_decisions:
- issue: Mögliche Harmonisierung des Verwandtschaftsverhältnisses
  choice: „Schwester Ahasjas“ entsprechend dem gewöhnlichen Sinn des hebräischen Ausdrucks
  alternative: Eine allgemeinere Wiedergabe wie „Verwandte Ahasjas“
  rationale: Der Vers verwendet das normale hebräische Wort für „Schwester“. Eine genealogische Harmonisierung wäre eine dem Text nicht abverlangte Auslegung.
- issue: Subjekt von „versteckten“
  choice: Die pluralische Form „sie versteckten ihn“
  alternative: Kontextuelle Glättung zum Singular „sie versteckte ihn“
  rationale: Der masoretische Text hat ausdrücklich ein Verb in der 3. Person Plural. Die mögliche Bezugsgruppe wird nicht enger bestimmt, als es der Text erlaubt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Die kurzen Hauptsätze entlasten die lange hebräische Satzfolge, ohne Ereignisse oder Beteiligte hinzuzufügen. „stahl ihn weg“ bewahrt bewusst die auffällige Bildkraft des hebräischen Verbs; „Schlafkammer“ vermeidet sowohl das altertümliche „Schlafgemach“ im Haupttext als auch das heute missverständliche „Schlafzimmer“ für einen Raum innerhalb des Palastes.
