base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: de
  text: Umringt den König von allen Seiten, jeder mit seinen Waffen in der Hand. Wer in die Reihen kommt, soll getötet werden.[a] Bleibt beim König, wenn er hinausgeht und wenn er hereinkommt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer zwischen die Reihen kommt“. Das hebräische Wort bezeichnet wahrscheinlich die geordneten Reihen der Wache.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „bei seinem Hinausgehen und bei seinem Hereinkommen“; gemeint ist, dass sie ihn auf all seinen Wegen begleiten und bewachen sollen.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: Umringt den König von allen Seiten
  rationale: Der Hifil-Ausdruck mit סָבִיב bezeichnet ein schützendes Einschließen rings um den König. Der deutsche Imperativ gibt die im Zusammenhang fortgesetzte Befehlsfolge natürlich wieder.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: jeder mit seinen Waffen in der Hand
  rationale: אִישׁ ist distributiv gebraucht. כְּלִי bezeichnet hier im militärischen Zusammenhang Waffen; der Plural des hebräischen Ausdrucks wird bewahrt.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: Wer in die Reihen eindringt
  rationale: Der substantivierte Partizipialsatz gilt allgemein. שְׂדֵרוֹת meint wahrscheinlich die geordneten Reihen der Wache; „eindringt“ macht das unbefugte Betreten im gegebenen Schutzbefehl deutlich, ohne die räumliche Vorstellung aufzugeben.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Die Hofal-Form ist passiv und bezeichnet die angeordnete Tötung. „Soll getötet werden“ bewahrt sowohl Passiv als auch Befehlscharakter.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Bleibt beim König
  rationale: היה mit אֶת drückt hier Begleitung aus; die Form setzt die Befehlsfolge fort. „Bleibt beim König“ gibt den Schutzauftrag idiomatisch wieder.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: wenn er hinausgeht und wenn er hereinkommt
  rationale: Die Infinitivkonstruktionen bezeichnen die Bewegungen des Königs. Die temporale Wiedergabe ist natürliches Deutsch und bewahrt das hebräische Begriffspaar.
