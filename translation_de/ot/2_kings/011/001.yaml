  source_fidelity: Die Personenbezeichnungen und die dynastische Aussage sind zutreffend wiedergegeben. „Machte sie sich daran, ... umzubringen“ schwächt jedoch die abgeschlossene Handlung von וַתָּקָם וַתְּאַבֵּד ab, indem es vor allem einen Handlungsbeginn ausdrückt.
  naturalness: Die deutsche Fassung ist überwiegend modern und verständlich. Eine direkte Wiedergabe der aufeinanderfolgenden Verben ist zugleich natürlicher und präziser als die Umschreibung „machte sie sich daran“.
  terminology: „Atalja“, „Ahasja“ und „Nachkommen des Königshauses“ sind im modernen deutschen Bibelregister passend. Die Fußnote sollte den hebräischen Kollektivbegriff im Deutschen idiomatischer und syntaktisch korrekt erläutern.
