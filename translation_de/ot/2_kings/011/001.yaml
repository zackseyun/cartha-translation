  text: וַֽ/עֲתַלְיָה֙ אֵ֣ם אֲחַזְיָ֔הוּ ו/ראתה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֨קָם֙ וַ/תְּאַבֵּ֔ד אֵ֖ת כָּל זֶ֥רַע הַ/מַּמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: de
  text: Atalja, die Mutter Ahasjas, sah, dass ihr Sohn tot war. Da erhob sie sich und brachte alle Nachkommen des Königshauses[a] um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den gesamten Samen des Königtums“, das heißt die königliche Linie oder die königlichen Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה אֵם אֲחַזְיָהוּ
  choice: Als Atalja, die Mutter Ahasjas,
  rationale: Der Eigenname wird nach gängiger deutscher Bibeltradition als „Atalja“ wiedergegeben; die Apposition bewahrt die ausdrückliche Verwandtschaftsangabe. Das einleitende Waw wird nicht mit einem eigenständigen Zeitwort überübersetzt, sondern natürlich in den Satzanschluss integriert.
- source_word: וַתֵּרֶא כִּי מֵת בְּנָהּ
  choice: sah, dass ihr Sohn tot war
  rationale: Die Wahrnehmungskonstruktion ראה כי wird direkt wiedergegeben; „tot war“ bewahrt den resultativen beziehungsweise stativen Sinn von מת.
- source_word: וַתָּקָם וַתְּאַבֵּד
  choice: machte sie sich daran, … umzubringen
  rationale: קום markiert hier den entschlossenen Beginn der folgenden Handlung und muss nicht als körperliches Aufstehen verstanden werden. Das kausative Piel von אבד bezeichnet im Kontext die tödliche Beseitigung; „umbringen“ ist im heutigen Deutsch klar und natürlich.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: alle Nachkommen des Königshauses
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier jedoch dynastische Nachkommenschaft. הַמַּמְלָכָה wird kontextgemäß als das Königshaus beziehungsweise die königliche Linie verstanden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Machte sie sich daran“ gibt den hebräischen Handlungsbeginn idiomatisch wieder; „umbringen“ vermeidet das im Deutschen möglicherweise nichttödlich verstandene „vernichten“ und macht die im Kontext gemeinte Tötung deutlich.
