  - severity: low
    issue: Fußnotenformulierung „allen Samen des Königtums“
    rationale: Als wörtliche Erklärung ist die Form unidiomatisch und syntaktisch nicht passend. „den gesamten Samen des Königtums“ gibt die hebräische Wendung verständlicher wieder, ohne die dynastische Bedeutung festzulegen.
