base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: de
  text: Und die beiden Abteilungen unter euch[a] – alle, die am Sabbat vom Dienst abtreten[b] – sollen am Haus Jahwes Wache halten, um den König zu schützen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die beiden Hände unter euch«; gemeint sind wahrscheinlich zwei Abteilungen oder Gruppen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »alle, die am Sabbat hinausgehen«. Im Zusammenhang ist vermutlich der Wachwechsel gemeint, bei dem sie vom Dienst abtreten.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: »sollen die Wache des Hauses Jahwes zum König hin/für den König halten«. Die hebräische Präposition ist hier schwer eindeutig wiederzugeben; dem Zusammenhang nach dient die Wache dem Schutz des Königs.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת בָּכֶם
  choice: die beiden Abteilungen von euch
  rationale: Wörtlich steht »die beiden Hände unter/von euch«. יָד kann in einem organisatorisch-militärischen Zusammenhang eine Seite, Gruppe oder Abteilung bezeichnen. »Abteilungen« gibt den kontextuellen Sinn verständlich wieder; »von euch« bezeichnet die Zugehörigkeit zur angeredeten Wachmannschaft.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: alle, die am Sabbat vom Dienst abtreten
  rationale: Wörtlich »alle am Sabbat Hinausgehenden«. Im Zusammenhang des Wachwechsels sind diejenigen gemeint, deren Dienst am Sabbat endet. Die Formulierung macht diesen Kontext deutlich, ohne das bloße »Hinausgehen« als sicher einzige Bedeutung auszugeben.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: sollen … Wache halten
  rationale: Die Verbindung aus שׁמר und dem verwandten Substantiv מִשְׁמֶרֶת bezeichnet das Wahrnehmen eines Wachdienstes. »Wache halten« ist im Deutschen natürlich und bewahrt den verpflichtenden Charakter.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: בַּיִת bedeutet wörtlich »Haus« und bezeichnet hier den Tempel. Die Wiedergabe »Haus« bleibt quellennah; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: אֶל הַמֶּלֶךְ
  choice: um den König zu schützen
  rationale: Die Präposition אֶל ist hier schwierig. Der Kontext legt nahe, dass die Bewachung des Hauses Jahwes dem Schutz des Königs dient. Die Fußnote bewahrt die formale Mehrdeutigkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« gibt ihn im modernen Standarddeutsch als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von אֶל הַמֶּלֶךְ
  choice: Die Wache am Haus Jahwes dient dem Schutz des Königs
  alternative: Wache am Haus Jahwes zum/gegen den König hin halten
  rationale: Die Präposition erlaubt keine völlig sichere idiomatische Auflösung. Der Erzählzusammenhang spricht für Zweck beziehungsweise Nutzen zugunsten des Königs; die alternative, formalere Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Militärische Dienstsprache wird knapp und verständlich formuliert. Gedankenstriche gliedern die eingeschobene Bestimmung der beiden Abteilungen; echte lexikalische und syntaktische Unsicherheiten bleiben durch Fußnoten sichtbar.
