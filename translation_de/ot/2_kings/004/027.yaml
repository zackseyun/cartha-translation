source:
  edition: WLC
  text: וַ/תָּבֹ֞א אֶל אִ֤ישׁ הָֽ/אֱלֹהִים֙ אֶל הָ/הָ֔ר וַֽ/תַּחֲזֵ֖ק בְּ/רַגְלָ֑י/ו וַ/יִּגַּ֨שׁ גֵּֽיחֲזִ֜י לְ/הָדְפָ֗/הּ וַ/יֹּאמֶר֩ אִ֨ישׁ הָ/אֱלֹהִ֤ים הַרְפֵּֽה לָ/הּ֙ כִּֽי נַפְשָׁ֣/הּ מָֽרָה לָ֔/הּ וַֽ/יהוָה֙ הֶעְלִ֣ים מִמֶּ֔/נִּי וְ/לֹ֥א הִגִּ֖יד לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: de
  text: 'Als sie zu dem Gottesmann am Berg[a] kam, hielt sie seine Füße fest. Gehasi trat heran, um sie wegzustoßen. Doch der Gottesmann sagte: »Lass sie! Denn ihre Seele ist von Bitterkeit erfüllt[b]. Jahwe hat es vor mir verborgen und mir nicht mitgeteilt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »auf dem Berg« oder »zum Berg«.'
    reason: Die Präposition אֶל bezeichnet hier Annäherung beziehungsweise Zielrichtung; die genaue räumliche Beziehung zum Berg bleibt offen.
  - marker: b
    text: 'Wörtlich: »Ihre Seele ist ihr bitter«; gemeint ist tiefe innere Qual.'
    reason: Die Fußnote macht das hebräische Bild und die idiomatische Bedeutung transparent.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: Gottesmann
  rationale: Die wörtliche und im Deutschen verständliche Wiedergabe bewahrt den hebräischen Prophetentitel, ohne ihn durch die auslegende Bezeichnung »Prophet« zu ersetzen.
- source_word: אֶל הָהָר
  choice: am Berg
  rationale: Im Zusammenhang bezeichnet die Wendung den Ort, an dem sie zu Elisa gelangt. »Am Berg« klingt natürlich und legt nicht unnötig fest, ob er auf dem Berg oder unmittelbar bei ihm war.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: hielt sie seine Füße fest
  rationale: חזק mit ב bezeichnet ein festes Ergreifen. Die Formulierung gibt Dringlichkeit und Körperlichkeit natürlich wieder, ohne die Handlung als gewaltsamer darzustellen, als der Kontext verlangt.
- source_word: וַיִּגַּשׁ
  choice: trat heran
  rationale: Eine natürliche deutsche Wiedergabe des Verbs für die Annäherung an eine Person.
- source_word: לְהָדְפָהּ
  choice: um sie wegzustoßen
  rationale: הדף bezeichnet ein kraftvolles Zurück- oder Wegstoßen; die Übersetzung erhält diesen körperlichen Nachdruck.
- source_word: הַרְפֵּה לָהּ
  choice: Lass sie!
  rationale: Der Imperativ fordert Gehasi auf, von seinem Eingreifen abzulassen. Die knappe Form passt zur unmittelbaren Situation.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: ihre Seele ist in bitterer Not
  rationale: Die Wiedergabe bewahrt נֶפֶשׁ als »Seele« und zugleich das Bild der Bitterkeit, macht aber die idiomatisch bezeichnete tiefe innere Qual in heutigem Deutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הֶעְלִים מִמֶּנִּי
  choice: hat mir die Sache verborgen
  rationale: Das Hifil von עלם bedeutet »verbergen«. »Die Sache« nimmt den aus dem Zusammenhang erschließbaren Grund ihrer Not auf, ohne ihn näher zu bestimmen.
- source_word: וְלֹא הִגִּיד לִי
  choice: und sie mir nicht mitgeteilt
  rationale: Die parallele Aussage verdeutlicht, dass Gott Elisa diese Angelegenheit nicht offenbart hat; das feminine Pronomen bezieht sich im Deutschen auf »die Sache«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Eigennamen verwendet, bleibt er als Eigenname erhalten. »Jahwe« ist die geläufige deutsche Form.
- issue: Anthropologische und emotionale Bedeutung von נֶפֶשׁ in נַפְשָׁהּ מָרָה לָהּ
  choice: ihre Seele ist in bitterer Not
  alternative: ihr ist bitter zumute
  rationale: Die gewählte Fassung erhält sowohl den ausdrücklichen Bezug auf die Seele als auch die Bitterkeitsmetapher, ohne die hebräische Wendung unverständlich wörtlich nachzubilden.
- issue: Elisas begrenztes Wissen
  choice: Jahwe hat mir die Sache verborgen und sie mir nicht mitgeteilt
  alternative: Jahwe hat es vor mir verborgen und mir nichts gesagt
  rationale: 'Die Übersetzung lässt die Spannung des Textes bestehen: Der Gottesmann erkennt die Not der Frau, kennt aber ihren Anlass nicht, weil Gott ihn ihm nicht offenbart hat.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, klare Erzählsätze bewahren das Tempo der hebräischen Darstellung. »Gottesmann« und »Seele« erhalten markante Begriffe des Ausgangstextes; die Fußnoten weisen auf räumliche und idiomatische Mehrdeutigkeit hin.
