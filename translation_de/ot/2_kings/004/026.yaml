base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: de
  text: 'Lauf ihr jetzt bitte entgegen und sag zu ihr: »Geht es dir gut[a]? Geht es deinem Mann gut? Geht es dem Kind[b] gut?« Sie antwortete: »Gut.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort schalom kommt in diesem Vers viermal vor. Es kann Frieden, Unversehrtheit oder Wohlergehen bezeichnen; hier wird damit nach dem Ergehen gefragt und darauf geantwortet.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dem Jungen«. Das hebräische Wort kann »Kind« oder »Junge« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: jetzt
  rationale: Das temporale Adverb leitet die dringliche Anweisung ein; »jetzt« gibt den unmittelbaren Zeitbezug knapp und natürlich wieder.
- source_word: רוּץ נָא
  choice: lauf … bitte
  rationale: Der Imperativ רוץ verlangt rasches Handeln; נָא verleiht der Aufforderung je nach Kontext eine bittende oder nachdrückliche Nuance, die hier durch »bitte« gewahrt wird.
- source_word: לִקְרָאתָהּ
  choice: ihr … entgegen
  rationale: Die Verbindung לקראת bezeichnet die Bewegung auf jemanden zu, um die Person zu treffen; »ihr entgegenlaufen« ist die natürliche deutsche Entsprechung.
- source_word: וֶאֱמָר לָהּ
  choice: und sag zu ihr
  rationale: אמר bedeutet grundlegend »sagen«. Die wörtlich nahe Formulierung leitet die folgenden direkten Fragen klar ein.
- source_word: הֲשָׁלוֹם לָךְ / לְאִישֵׁךְ / לַיָּלֶד
  choice: Geht es dir / deinem Mann / dem Kind gut?
  rationale: שָׁלוֹם fragt hier nach Wohlergehen und unversehrtem Zustand. Die wiederholte deutsche Satzform bewahrt die dreifache Parallelstruktur.
- source_word: יֶלֶד
  choice: Kind
  rationale: יֶלֶד kann »Kind« oder »Junge« bedeuten. »Kind« vermeidet eine unnötige Festlegung im Vers, obwohl aus dem Erzählzusammenhang bekannt ist, dass es sich um ihren Sohn handelt.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: 'Sie antwortete: »Gut.«'
  rationale: Die knappe Einwortantwort שָׁלוֹם greift die vorausgehenden Fragen nach dem Wohlergehen auf. »Gut« erhält diese Kürze und lässt offen, wie ihre Antwort angesichts der Lage zu verstehen ist.
theological_decisions:
- issue: Bedeutung der knappen Antwort der Frau trotz des Todes ihres Kindes
  choice: Die Einwortantwort wird als »Gut« wiedergegeben, ohne ihre Absicht zu erklären.
  alternative: »Alles ist gut« oder eine erläuternde Wiedergabe wie »Es ist alles in Ordnung«
  rationale: Der hebräische Text bietet nur שָׁלוֹם und lässt Motivation sowie genaue Aussageabsicht unausgesprochen. Die Übersetzung soll diese erzählerische und theologische Spannung nicht auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Erzählweise. Die wiederholten Fragen bilden die hebräische Parallelstruktur ab; die ungewöhnlich kurze Schlussantwort bleibt bewusst knapp und mehrdeutig.
