  text: וַ/יַּ֜עַל וַ/יִּשְׁכַּ֣ב עַל הַ/יֶּ֗לֶד וַ/יָּשֶׂם֩ פִּ֨י/ו עַל פִּ֜י/ו וְ/עֵינָ֤י/ו עַל עֵינָי/ו֙ וְ/כַפָּ֣י/ו עַל כפ/ו וַ/יִּגְהַ֖ר עָלָ֑י/ו וַ/יָּ֖חָם בְּשַׂ֥ר הַ/יָּֽלֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: de
  text: Dann stieg er hinauf und legte sich auf den Jungen. Er legte seinen Mund auf dessen Mund, seine Augen auf dessen Augen und seine Handflächen auf dessen Handflächen. Dann beugte er sich über ihn[a], und das Fleisch des Jungen wurde warm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und streckte sich über ihn“. Das hebräische Verb ist selten und kann ein Beugen oder Ausstrecken über dem Kind bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Dann stieg er hinauf
  rationale: Die räumliche Bedeutung von עלה („hinaufsteigen“) bleibt erhalten; das im Zusammenhang erkennbare Ziel, das Obergemach, wird nicht ergänzt.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: und legte sich auf den Jungen
  rationale: Gibt die konkrete körperliche Handlung direkt und in natürlichem modernem Deutsch wieder.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: Er legte seinen Mund auf dessen Mund
  rationale: „Dessen“ löst die im Deutschen sonst störende Mehrdeutigkeit der wiederholten Pronomen, ohne den Bezug zu verändern.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: seine Augen auf dessen Augen
  rationale: Bewahrt die symmetrische Zuordnung der Körperteile und hängt syntaktisch am Verb „legte“.
- source_word: וְכַפָּיו עַל כפיו
  choice: seine Handflächen auf dessen Handflächen
  rationale: כַּף bezeichnet hier genauer die Handfläche; diese körperliche Präzision wird bewahrt.
- source_word: וַיִּגְהַר עָלָיו
  choice: So beugte er sich über ihn
  rationale: Das seltene גהר beschreibt wahrscheinlich ein Sichbeugen oder Sichstrecken über jemanden. „Beugte sich“ ist im Deutschen anschaulich und vermeidet eine überpräzise Festlegung.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: und der Körper des Jungen wurde warm
  rationale: בָּשָׂר bedeutet wörtlich „Fleisch“, bezeichnet hier aber den leiblichen Körper. „Körper“ ist in diesem Kontext natürliches, nicht euphemistisches Deutsch.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: der Junge
  rationale: יֶלֶד kann „Kind“ oder „Junge“ bedeuten; der Zusammenhang identifiziert das Kind als Sohn, sodass „Junge“ passend ist.
theological_decisions:
- issue: Art von Elisas Handlung an dem toten Jungen
  choice: Die körperlichen Handlungen werden konkret wiedergegeben, ohne ihren Mechanismus zu erklären.
  alternative: Die Handlung als Mund-zu-Mund-Beatmung deuten oder durch verhüllende Sprache abschwächen.
  rationale: Der hebräische Text schildert eine prophetische körperliche Handlung im Zusammenhang mit der Wiederbelebung, erklärt sie aber weder medizinisch noch sakramental.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Abfolge der körperlichen Berührungen und die syntaktische Symmetrie des Hebräischen bleiben erhalten; missverständliche deutsche Pronomen werden durch „dessen“ geklärt.
