base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/004.yaml
  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: de
  text: Dann geh hinein und schließ die Tür hinter dir und deinen Söhnen. Gieß in all diese Gefäße[a] und stell das jeweils volle Gefäß beiseite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Behälter“. Das hebräische Wort ist weit gefasst und kann unterschiedliche Arten von Gefäßen oder Behältern bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und das volle [Gefäß] stell beiseite“. Der hebräische Ausdruck steht im Singular und kann hier allgemein das jeweils gefüllte Gefäß bezeichnen.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וּבָאת
  choice: Dann geh hinein
  rationale: בוא bezeichnet hier das Hineingehen in das Haus. „Dann“ gibt die Handlungsfolge natürlich wieder.
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  choice: und schließ die Tür
  rationale: סגר bedeutet „schließen, zumachen“; „die Tür schließen“ ist im modernen Standarddeutsch natürlich und präzise.
- source_word: בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: hinter dir und deinen Söhnen
  rationale: בעד bezeichnet bei einer geschlossenen Tür hier die Personen, hinter denen sie geschlossen wird. Die Formulierung bewahrt den räumlichen Sinn, ohne im Deutschen unnötig die Präposition zu wiederholen.
- source_word: וְיָצַקְתְּ עַל
  choice: Gieß in
  rationale: יצק bedeutet „gießen“. Obwohl עַל wörtlich häufig „auf/über“ heißt, verlangt das Befüllen von Gefäßen im Deutschen idiomatisch „in“.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: all diese Gefäße
  rationale: כְּלִים ist ein weiter Begriff für Geräte, Behälter oder Gefäße. Im Zusammenhang mit dem Öl ist „Gefäße“ zugleich sachgerecht, verständlich und stilistisch würdig.
- source_word: וְהַמָּלֵא
  choice: das jeweils volle Gefäß
  rationale: Das substantivierte Adjektiv im Singular bedeutet wörtlich „das volle [Gefäß]“. „Jeweils“ verdeutlicht den im Ablauf naheliegenden generischen Sinn, ohne daraus ausdrücklich einen Plural zu machen.
- source_word: תַּסִּיעִי
  choice: stell … beiseite
  rationale: Der Hifil von נסע bezeichnet hier das Wegbewegen eines gefüllten Gefäßes. „Beiseitestellen“ beschreibt die konkrete Handlung natürlich.
