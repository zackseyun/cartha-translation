source:
  edition: WLC
  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: de
  text: 'Gehasi ging ihnen voraus und legte den Stab auf das Gesicht des Jungen. Doch es war kein Laut und keine Reaktion[a]. Da kehrte er um, ging ihm entgegen und berichtete ihm: »Der Junge ist nicht aufgewacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Es war keine Stimme und kein Aufmerken/Hören.«'
    reason: Die Wiedergabe „keine Reaktion“ erschließt die kontextuelle Aussage von קָשֶׁב; die Fußnote bewahrt die ungewöhnliche wörtliche Form und ihre Bedeutungsbreite.
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: ging ihnen voraus
  rationale: Die Wendung bezeichnet, dass Gehasi vor Elischa und der Frau herging; die deutsche Formulierung gibt Richtung und Verhältnis natürlich wieder.
- source_word: הַמִּשְׁעֶנֶת
  choice: den Stab
  rationale: „Stab“ ist im Erzählzusammenhang die klare und geläufige Bezeichnung für Elischas Gegenstand; „Stock“ wäre umgangssprachlicher, „Rute“ sachlich irreführend.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: auf das Gesicht des Jungen
  rationale: פָּנִים bezeichnet hier konkret das Gesicht. „Junge“ gibt נַעַר im Zusammenhang natürlich und ohne altertümlichen Klang wieder.
- source_word: וְאֵין קוֹל
  choice: es war kein Laut
  rationale: קוֹל kann „Stimme“ oder „Laut“ bedeuten. „Kein Laut“ passt zur ausbleibenden Lebensäußerung, ohne diese ausdrücklich auszudeuten.
- source_word: וְאֵין קָשֶׁב
  choice: keine Reaktion
  rationale: קָשֶׁב bezeichnet Aufmerksamkeit beziehungsweise reagierendes Hören. „Keine Reaktion“ ist im Deutschen kontextgerecht; die ungewöhnlichere wörtliche Bedeutung bleibt in der Fußnote sichtbar.
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: Da kehrte er um, ging ihm entgegen
  rationale: Die Formulierung bewahrt sowohl die Umkehr beziehungsweise Rückkehr als auch die zielgerichtete Bewegung auf Elischa zu, ohne den im Hebräischen pronominal bezeichneten Bezug im Haupttext auszuschreiben.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: und berichtete ihm
  rationale: Die hebräische Redeformel wird in natürlichem Deutsch knapp wiedergegeben; der Doppelung „berichtete ihm und sagte“ bedarf es vor der direkten Rede nicht.
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: Der Junge ist nicht aufgewacht
  rationale: Das Perfekt berichtet das Ergebnis des erfolglosen Versuchs. Das deutsche Perfekt bringt diesen erreichten Zustand natürlich zum Ausdruck.
