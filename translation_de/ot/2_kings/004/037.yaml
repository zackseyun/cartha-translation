  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: de
  text: Da kam sie, fiel ihm zu Füßen und warf sich zu Boden nieder.[a] Dann hob sie ihren Sohn hoch und ging hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verneigte sich bis zur Erde“. Das hebräische Verb kann in anderen Zusammenhängen auch „anbeten“ bedeuten; hier bezeichnet es wahrscheinlich eine Geste tiefer Ehrerbietung vor Elisa.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Da kam sie
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da kam sie“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: fiel ihm zu Füßen
  rationale: Die deutsche Wendung gibt die körperliche Unterwerfung beziehungsweise tiefe Ehrerbietung idiomatisch wieder, ohne das hebräische עַל unnatürlich mit „auf“ abzubilden.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: verneigte sich bis zur Erde
  rationale: Die Formulierung bewahrt die körperliche Geste tiefster Ehrerbietung und legt nicht fest, dass hier Anbetung im engeren religiösen Sinn gemeint ist.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: nahm sie ihren Sohn
  rationale: נשא kann „heben“, „tragen“ oder „nehmen“ bedeuten. „Nahm sie ihren Sohn“ ist im Zusammenhang natürlich und lässt offen, ob das Hochheben besonders betont werden soll.
- source_word: וַתֵּצֵא
  choice: ging hinaus
  rationale: Die schlichte Bewegungsangabe entspricht der Grundbedeutung von יצא und erhält den knappen Erzählstil.
theological_decisions:
- issue: Bedeutung von וַתִּשְׁתַּחוּ gegenüber Elisa
  choice: Als tiefe Verneigung beziehungsweise Niederwerfung vor Elisa wiedergegeben
  alternative: „betete an“ oder „warf sich zur Erde nieder“
  rationale: Das hebräische Verb kann je nach Kontext Anbetung oder ehrerbietige Niederwerfung bezeichnen. Da die Handlung hier Elisa gilt, bewahrt „verneigte sich bis zur Erde“ die sichtbare Geste und die Bedeutungsbreite, ohne ausdrücklich göttliche Anbetung zu behaupten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die wiederholten hebräischen Satzanschlüsse werden natürlich variiert, ohne die Handlungsfolge zu verändern.
