base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: de
  text: 'Dann kam sie zum Mann Gottes und berichtete ihm davon. Er sagte: »Geh, verkaufe das Öl und bezahle deine Schulden.[a] Du und deine Söhne könnt von dem leben, was übrig bleibt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bezahle deinen Gläubiger«; die hebräische Form kann auf die geschuldete Summe oder auf die Person bezogen werden, der sie geschuldet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Du und deine Söhne werdet von dem Übriggebliebenen leben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: Dann kam sie … und berichtete ihm davon
  rationale: Die Wayyiqtol-Formen führen die Erzählung fort. »Dann« gibt die Abfolge natürlich wieder; das im Deutschen ergänzte »ihm davon« macht die mit לְאִישׁ הָאֱלֹהִים bezeichnete Mitteilung idiomatisch verständlich.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: zum Mann Gottes
  rationale: Der feste hebräische Prophetentitel wird transparent und ohne interpretierende Ersetzung wiedergegeben.
- source_word: לְכִי מִכְרִי אֶת הַשֶּׁמֶן
  choice: Geh, verkaufe das Öl
  rationale: Die beiden femininen Imperative werden direkt wiedergegeben. »Öl« bewahrt die fehlende nähere Bestimmung der Ölsorte.
- source_word: וְשַׁלְּמִי אֶת נִשְׁיֵךְ
  choice: und bezahle deine Schulden
  rationale: שלם bezeichnet im finanziellen Zusammenhang das Begleichen einer Verpflichtung. Die Form נִשְׁיֵךְ wird hier sachbezogen als das Geschuldete verstanden; die personenbezogene Deutung »Gläubiger« bleibt in der Fußnote erhalten.
- source_word: וְאַתְּ וּבָנַיִךְ
  choice: mit deinen Söhnen
  rationale: בָּנַיִךְ bezeichnet ausdrücklich ihre Söhne. Die deutsche Formulierung verbindet sie idiomatisch mit der Frau als den gemeinsam vom Rest Lebenden.
- source_word: תִּחְיִי בַּנּוֹתָר
  choice: Von dem, was übrig bleibt, kannst du … leben
  rationale: Der Imperfekt bezeichnet hier die durch den verbleibenden Erlös eröffnete Lebensmöglichkeit. Die substantivische Form נוֹתָר wird natürlich als »was übrig bleibt« wiedergegeben.
