base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: de
  text: 'So ging sie hin und kam zu dem Mann Gottes auf den Berg Karmel. Als der Mann Gottes sie von Weitem[a] sah, sagte er zu seinem Diener Gehasi: »Sieh, dort ist die Schunemiterin!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus der Ferne«. Der hebräische Ausdruck zeigt, dass er sie sah, als sie noch ein Stück entfernt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: So ging sie hin und kam
  rationale: Die beiden Wayyiqtol-Formen führen die Erzählung in zeitlicher Folge weiter. Die Wiedergabe erhält beide Bewegungsverben, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Der feststehende hebräische Titel wird unmittelbar wiedergegeben und nicht deutend durch »Prophet« ersetzt.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: auf den Berg Karmel
  rationale: אֶל bezeichnet hier die Bewegung zum Aufenthaltsort Elisas. »Auf den Berg Karmel« ist im Deutschen natürlich und bewahrt die Zielrichtung.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Als ... sah
  rationale: Die Konstruktion leitet einen temporalen Nebensatz ein; die idiomatische deutsche Wiedergabe verzichtet auf das schwerfällige »Und es geschah, als«.
- source_word: מִנֶּגֶד
  choice: von Weitem
  rationale: Der Ausdruck besagt im Zusammenhang, dass Elisa sie erblickte, solange sie noch in einiger Entfernung war. Die mögliche Nuance »aus der Ferne« wird in der Fußnote genannt.
- source_word: נַעֲרוֹ
  choice: seinem Diener
  rationale: Wörtlich bedeutet das Wort »sein junger Mann«, bezeichnet hier aber Gehasis Funktion als persönlicher Diener beziehungsweise Begleiter Elisas.
- source_word: הִנֵּה
  choice: Sieh, dort ist
  rationale: הִנֵּה lenkt unmittelbar die Aufmerksamkeit auf die herankommende Frau. »Sieh, dort ist« gibt sowohl den Hinweischarakter als auch die räumliche Deixis natürlich wieder.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: die Schunemiterin
  rationale: Die Herkunftsbezeichnung wird als geläufige deutsche Einwohnerbezeichnung wiedergegeben; die hinweisende Kraft von הַלָּז erscheint zusammen mit הִנֵּה in »dort ist«.
