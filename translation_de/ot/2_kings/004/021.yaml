  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: de
  text: Dann ging sie hinauf, legte ihn auf das Bett des Mannes Gottes, schloss die Tür hinter ihm zu[a] und ging hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schloss die Tür über ihm zu“, das heißt: Sie schloss die Tür, sodass er im Raum blieb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: Dann ging sie hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „Dann“ gibt die fortschreitende hebräische Erzählweise im Deutschen natürlich wieder; der Kontext deutet auf das obere Zimmer.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: legte ihn
  rationale: Die Kausativform von שׁכב bedeutet, jemanden hinzulegen. Die knappe Formulierung ist im Deutschen natürlich und bewahrt die konkrete Handlung.
- source_word: עַל מִטַּת
  choice: auf das Bett
  rationale: עַל bezeichnet hier die Lage auf etwas; מִטָּה ist in diesem Zusammenhang ein Bett beziehungsweise eine Schlafstätte.
- source_word: אִישׁ הָאֱלֹהִים
  choice: des Mannes Gottes
  rationale: Die traditionelle und zugleich verständliche direkte Wiedergabe des hebräischen Titels bewahrt dessen Form, ohne ihn deutend durch „Prophet“ zu ersetzen.
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: schloss hinter ihm die Tür
  rationale: Bei סגר bezeichnet בְּעַד das Schließen hinter beziehungsweise um jemanden, sodass dieser im Raum bleibt. Das im Hebräischen nur mitgedachte Objekt „Tür“ wird im Deutschen zur natürlichen Verständlichkeit ergänzt.
- source_word: וַתֵּצֵא
  choice: und ging hinaus
  rationale: יצא bedeutet konkret „hinausgehen“. Die Übersetzung bewahrt die räumliche Bewegung und fügt kein Ziel hinzu.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die kurzen aufeinanderfolgenden Handlungen spiegeln den knappen hebräischen Erzählstil; der feste Titel „Mann Gottes“ bleibt erhalten.
