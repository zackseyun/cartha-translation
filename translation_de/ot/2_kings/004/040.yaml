base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: de
  text: 'Da schöpften sie den Männern zum Essen aus. Doch als sie von dem Eintopf aßen, schrien sie auf und sagten: »Der Tod ist im Topf[a], Mann Gottes!« Und sie konnten nicht essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die bildhafte Aussage bedeutet wahrscheinlich, dass der Eintopf tödlich oder giftig war.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: Da schöpften sie … aus
  rationale: יצק bezeichnet wörtlich das Ausgießen. Bei einem Eintopf gibt »ausschöpfen« die konkrete Handlung natürlich und anschaulich wieder.
- source_word: לַאֲנָשִׁים
  choice: den Männern
  rationale: אֲנָשִׁים bezeichnet hier die versammelten Männer; die geschlechtsspezifische Aussage des Hebräischen bleibt erhalten.
- source_word: כְּאָכְלָם מֵהַנָּזִיד
  choice: als sie von dem Eintopf aßen
  rationale: Die Wendung beschreibt die gleichzeitig einsetzende Entdeckung während des Essens; נָזִיד ist ein gekochtes Gericht beziehungsweise ein Eintopf.
- source_word: צָעָקוּ
  choice: schrien sie auf
  rationale: צעק bezeichnet einen lauten, dringlichen Aufschrei und bringt hier den Schrecken der Männer zum Ausdruck.
- source_word: מָוֶת בַּסִּיר
  choice: Der Tod ist im Topf
  rationale: Die bildhafte, knappe Formulierung des Hebräischen wird bewahrt, ohne sie im Haupttext auf »Gift« festzulegen.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Dies ist die übliche Bezeichnung Elisas und funktioniert hier als direkte Anrede.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: Und sie konnten nicht essen
  rationale: Die objektlose Formulierung folgt dem Hebräischen eng und ist im Deutschen aus dem Zusammenhang verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die drastische hebräische Wendung »Der Tod ist im Topf« bleibt im Haupttext erhalten; ihre wahrscheinliche Bedeutung wird in der Fußnote erläutert.
