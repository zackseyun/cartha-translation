base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: de
  text: Da setzte er es ihnen vor. Sie aßen und ließen noch etwas übrig, nach dem Wort Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: Da setzte er es ihnen vor
  rationale: נתן bedeutet grundsätzlich „geben/setzen“; zusammen mit לִפְנֵיהֶם bezeichnet es hier idiomatisch das Vorsetzen der zuvor erwähnten Speise. Das im Hebräischen unausgesprochene Objekt wird aus dem Kontext mit „es“ aufgenommen.
- source_word: וַיֹּאכְלוּ
  choice: Sie aßen
  rationale: Direkte, natürliche Wiedergabe der fortlaufenden Erzählform von אכל.
- source_word: וַיּוֹתִרוּ
  choice: und ließen noch etwas übrig
  rationale: Die Hifil-Form von יתר bezeichnet, dass nach dem Essen etwas übrig gelassen wurde. „Noch etwas“ gibt den verbleibenden Überschuss idiomatisch wieder, ohne dessen Menge näher festzulegen.
- source_word: כִּדְבַר
  choice: nach dem Wort
  rationale: Die formale Wendung bewahrt den ausdrücklichen Bezug auf das zuvor ergangene göttliche Wort und klingt zugleich in gehobenem modernem Deutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ wahrt den Charakter als persönlicher Gottesname.
- issue: Bezug der Erfüllungsaussage
  choice: nach dem Wort Jahwes
  alternative: wie Jahwe gesagt hatte
  rationale: Die nominale Formulierung entspricht כִּדְבַר enger und lässt den feierlichen Zusammenhang zwischen prophetischer Zusage und ihrer Erfüllung bestehen.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die kurzen Hauptsätze folgen dem hebräischen Handlungsablauf; „nach dem Wort Jahwes“ bewahrt die formale und theologische Prägung des Schlusses.
