- from: 'Und sie sagte zu ihrem Mann: „Sieh doch, ich weiß, dass der Mann Gottes, der regelmäßig[a] bei uns vorbeikommt, heilig ist.“'
  to: 'Und sie sagte zu ihrem Mann: „Sieh doch, ich weiß, dass dieser Mann Gottes heilig ist und immer wieder[a] bei uns vorbeikommt.“'
  rationale: Die Revision entflechtet den Satz und gibt die hebräische Aussage „ein heiliger Mann Gottes ist er“ als klare deutsche Prädikation wieder. „Immer wieder“ vermittelt die im Kontext gewohnheitsmäßige Wiederkehr von תָּמִיד; die Fußnote bietet „regelmäßig“ als gleichwertige idiomatische Alternative.
