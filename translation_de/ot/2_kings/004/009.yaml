  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: de
  text: 'Und sie sagte zu ihrem Mann: „Sieh doch, ich weiß, dass dieser Mann Gottes heilig ist und immer wieder[a] bei uns vorbeikommt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „regelmäßig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Und sie sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Und sie sagte“ gibt die schlichte narrative Abfolge wieder.
- source_word: אֶל אִישָׁהּ
  choice: zu ihrem Mann
  rationale: אִישׁ mit Suffix der 3. Person Feminin Singular bezeichnet in diesem häuslichen Zusammenhang idiomatisch ihren Ehemann.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: Die Wendung lenkt die Aufmerksamkeit des Angesprochenen auf die folgende Feststellung; „doch“ gibt die abmildernde beziehungsweise nachdrückliche Nuance von נָא natürlich wieder.
- source_word: יָדַעְתִּי
  choice: ich weiß
  rationale: Das Perfekt bezeichnet hier eine durch wiederholte Beobachtung gewonnene, nun feststehende Erkenntnis.
- source_word: אִישׁ אֱלֹהִים
  choice: Mann Gottes
  rationale: Die feste Bezeichnung für einen Propheten oder göttlich Beauftragten bleibt in ihrer biblischen und literarischen Prägung erhalten.
- source_word: קָדוֹשׁ הוּא
  choice: heilig ist
  rationale: Die prädikative Formulierung bewahrt die Aussage, dass der betreffende Mann Gottes heilig beziehungsweise ausgesondert ist, ohne sie weiter auszudeuten.
- source_word: עֹבֵר עָלֵינוּ
  choice: bei uns vorbeikommt
  rationale: Im Reisekontext bezeichnet die Wendung das Vorübergehen am Wohnort; „bei uns vorbeikommt“ ist im Deutschen natürlich.
- source_word: תָּמִיד
  choice: regelmäßig
  rationale: Im Kontext ist eine wiederkehrende Gewohnheit gemeint, nicht notwendig eine ununterbrochene Handlung. „Regelmäßig“ bringt dies klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe der Bezeichnung אִישׁ אֱלֹהִים
  choice: Mann Gottes
  alternative: gottesfürchtiger Mann; ein Gott gehörender Mann
  rationale: „Mann Gottes“ bewahrt den im Alten Testament gebräuchlichen Titel und seine theologische wie literarische Aussagekraft, ohne zusätzliche Lehrannahmen einzutragen.
- issue: Syntaktische Zuordnung von קָדוֹשׁ
  choice: Der Mann Gottes ist heilig
  alternative: Er ist ein heiliger Mann Gottes
  rationale: Die prädikative Wiedergabe folgt der hebräischen Wortfolge und bewahrt die Aussage der Heiligkeit, während die alternative attributive Fassung sachlich ebenfalls möglich ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh doch“ ist verständlich und bewahrt den aufmerksamkeitslenkenden Charakter von הִנֵּה נָא. Die Relativsatzstellung sorgt trotz der hebräischen Nachtragsstruktur für einen natürlichen deutschen Satz.
