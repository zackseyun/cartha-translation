review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: Die Frau richtet sich an ihren Mann, erkennt den wiederholt vorbeikommenden Mann als „Mann Gottes“ und bezeichnet ihn als heilig. Die Stellung des Relativsatzes im Entwurf ist jedoch syntaktisch schwerfällig und verschiebt die hebräische prädikative Aussage unnötig in eine verschachtelte deutsche Konstruktion. „Immer wieder“ gibt תָּמִיד im erzählerischen Kontext idiomatisch als wiederholtes Geschehen wieder.'
  naturalness: „Sieh doch“ ist modernes, angemessen würdiges Standarddeutsch. Die Umstellung zu „dass dieser Mann Gottes heilig ist und immer wieder bei uns vorbeikommt“ ist klarer und natürlicher als die verschachtelte Relativsatzkonstruktion. Das Demonstrativum „dieser“ ist hier als auf den wiederholt gesehenen Mann weisender Bezug natürlich.
  terminology: „Mann Gottes“ bewahrt den etablierten biblischen Titel אִישׁ אֱלֹהִים. „Heilig“ entspricht קָדוֹשׁ und vermeidet eine interpretierende Umschreibung. Die Fußnotenalternative „ständig“ ist im Deutschen leicht als ununterbrochen zu verstehen und daher für den hier gemeinten wiederholten Vorgang weniger geeignet als „regelmäßig“.
  issues:
  - severity: medium
    issue: Verschachtelte Relativsatzstellung
    rationale: „dass der Mann Gottes, der regelmäßig bei uns vorbeikommt, heilig ist“ ist zwar verständlich, aber unnötig schwerfällig und lässt die knappe prädikative Aussage des Hebräischen weniger klar hervortreten.
  - severity: low
    issue: Fußnotenalternative „ständig“
    rationale: „Ständig“ legt im modernen Deutschen oft eine ununterbrochene oder übermäßig häufige Handlung nahe. Als Alternative zu „regelmäßig“ ist es daher weniger präzise; „immer wieder“ wahrt die kontextuelle Wiederholung.
  revised_text: 'Und sie sagte zu ihrem Mann: „Sieh doch, ich weiß, dass dieser Mann Gottes heilig ist und immer wieder[a] bei uns vorbeikommt.“'
  revised_footnotes:
  - marker: a
    text: 'Oder: „regelmäßig“.'
    reason: lexical_alternative
  revision_rationale: Die Revision entflechtet den Satz und gibt die hebräische Aussage „ein heiliger Mann Gottes ist er“ als klare deutsche Prädikation wieder. „Immer wieder“ vermittelt die im Kontext gewohnheitsmäßige Wiederkehr von תָּמִיד; die Fußnote bietet „regelmäßig“ als gleichwertige idiomatische Alternative.
