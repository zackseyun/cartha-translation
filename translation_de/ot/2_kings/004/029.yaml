  text: וַ/יֹּ֨אמֶר לְ/גֵיחֲזִ֜י חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ/קַ֨ח מִשְׁעַנְתִּ֣/י בְ/יָדְ/ךָ֮ וָ/לֵךְ֒ כִּֽי תִמְצָ֥א אִישׁ֙ לֹ֣א תְבָרְכֶ֔/נּוּ וְ/כִֽי יְבָרֶכְ/ךָ֥ אִ֖ישׁ לֹ֣א תַעֲנֶ/נּ֑וּ וְ/שַׂמְתָּ֥ מִשְׁעַנְתִּ֖/י עַל פְּנֵ֥י הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: de
  text: 'Da sagte er zu Gehasi: »Binde dein Gewand hoch[a], nimm meinen Stab in die Hand und geh! Wenn du jemandem begegnest, grüße ihn nicht; und wenn dich jemand grüßt[b], antworte ihm nicht. Lege meinen Stab auf das Gesicht des Jungen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gürte deine Hüften«; gemeint ist, das lange Gewand zum schnellen Aufbruch hochzubinden.'
    reason: idiom_explanation
  - marker: b
    text: 'Oder wörtlicher: »segne ihn nicht; und wenn dich jemand segnet«. Das hebräische Verb bezeichnet hier wahrscheinlich den Austausch von Grüßen unterwegs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Gürte deine Hüften
  rationale: Die hebräische Wendung bezeichnet das Zusammenraffen und Festbinden des Gewandes, um sich rasch zum Handeln oder Aufbruch bereit zu machen. Die bildhafte Form bleibt im Text erhalten und wird in einer Fußnote erklärt.
- source_word: מִשְׁעַנְתִּי
  choice: mein Stab
  rationale: Das Substantiv bezeichnet einen Stab, der als Stütze dienen kann. »Stab« ist im Deutschen natürlich und passt zu dem Gegenstand, den Gehasi tragen und auf den Jungen legen soll.
- source_word: וָלֵךְ
  choice: und geh!
  rationale: Der knappe Imperativ bewahrt die direkte Befehlsfolge und die Dringlichkeit der Anweisung.
- source_word: כִּי תִמְצָא אִישׁ
  choice: Wenn du jemandem begegnest
  rationale: אִישׁ bedeutet formal »Mann«, hat hier aber generische Bedeutung für jede Person, der Gehasi unterwegs begegnen könnte.
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: grüße ihn nicht / wenn dich jemand grüßt
  rationale: ברך bedeutet grundsätzlich »segnen«, kann aber bei Begegnungen den Austausch eines Grußes bezeichnen. Im Reisekontext ist »grüßen« die natürliche Wiedergabe; die wörtliche Möglichkeit wird in der Fußnote vermerkt.
- source_word: לֹא תַעֲנֶנּוּ
  choice: antworte ihm nicht
  rationale: ענה bezeichnet hier das Antworten auf den Gruß. Die knappe deutsche Form entspricht der Dringlichkeit des Hebräischen.
- source_word: וְשַׂמְתָּ מִשְׁעַנְתִּי עַל פְּנֵי הַנָּעַר
  choice: Lege meinen Stab auf das Gesicht des Jungen
  rationale: Die konkrete Handlung und das wörtliche »Gesicht« werden bewahrt. נַעַר bezeichnet hier den Sohn der Schunemiterin und wird kontextgerecht mit »Junge« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Reihe von Befehlen und damit die Dringlichkeit der Szene bleiben erhalten. Das traditionelle Bild »Gürte deine Hüften« wird wegen seiner Anschaulichkeit im Haupttext bewahrt und unmittelbar erläutert.
