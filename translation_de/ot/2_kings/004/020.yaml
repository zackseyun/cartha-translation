  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: de
  text: Er trug ihn und brachte ihn zu seiner Mutter. Der Junge saß bis zum Mittag auf ihrem Schoß[a]; dann starb er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: auf ihren Knien.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise, während der Haupttext mit »auf ihrem Schoß« die natürliche deutsche Entsprechung verwendet.
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: Er hob ihn auf
  rationale: נשׂא kann »heben«, »tragen« oder »forttragen« bedeuten. Hier bezeichnet es zunächst das Aufnehmen des erkrankten Jungen; die anschließende Bewegung wird durch »brachte ihn« ausgedrückt.
- source_word: וַיְבִיאֵהוּ
  choice: und brachte ihn
  rationale: Die Hifil-Form von בוא bedeutet regelmäßig »bringen« und bewahrt die Bewegungsrichtung zur Mutter.
- source_word: אֶל אִמּוֹ
  choice: zu seiner Mutter
  rationale: Die schlichte Verwandtschaftsbezeichnung entspricht dem würdigen Erzählregister.
- source_word: וַיֵּשֶׁב
  choice: Der Junge saß
  rationale: ישׁב bezeichnet hier aufgrund der konkreten Körperhaltung zunächst »sitzen«. Das Subjekt wird im Deutschen zur Klarheit erneut als »der Junge« benannt.
- source_word: עַל בִּרְכֶּיהָ
  choice: auf ihrem Schoß
  rationale: Wörtlich steht im Hebräischen »auf ihren Knien«. Im Deutschen bezeichnet »auf ihrem Schoß« dieselbe natürliche Haltung eines Kindes und vermeidet das mögliche Missverständnis, es habe auf den Kniescheiben gesessen; die wörtliche Form wird in der Fußnote erhalten.
- source_word: עַד הַצָּהֳרַיִם
  choice: bis zum Mittag
  rationale: צָהֳרַיִם bezeichnet die Mittagszeit; »bis zum Mittag« ist natürliches modernes Deutsch.
- source_word: וַיָּמֹת
  choice: dann starb er
  rationale: Die fortschreitende Erzählfolge des Waw-Konsekutivs wird idiomatisch mit »dann« wiedergegeben.
