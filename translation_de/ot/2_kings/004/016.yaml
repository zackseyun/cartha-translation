base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: de
  text: 'Da sagte er: »Zu dieser festgesetzten Zeit im nächsten Jahr[a] wirst du einen Sohn im Arm halten.« Sie aber sagte: »Ach, mein Herr, du Mann Gottes, täusche deine Dienerin nicht!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »zu dieser festgesetzten Zeit, um die Zeit des Lebens«; die hebräische Wendung bezeichnet hier dieselbe Zeit im nächsten Jahr.'
    reason: Die Formel כָּעֵת חַיָּה ist idiomatisch und ihre genaue wörtliche Deutung ist umstritten. Die Fußnote dokumentiert ihre formnähere Gestalt, ohne die missverständliche Paraphrase „wenn die Zeit wieder auflebt“ als eindeutigen Wortlaut darzustellen.
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: um diese festgesetzte Zeit
  rationale: מוֹעֵד bezeichnet einen bestimmten oder festgesetzten Zeitpunkt. Die Formulierung bewahrt diesen Sinn und klingt im Deutschen natürlich.
- source_word: כָּעֵת חַיָּה
  choice: übers Jahr
  rationale: Die idiomatische Wendung verweist hier auf dieselbe Zeit im folgenden Jahr. »Übers Jahr« gibt dies knapp und idiomatisch wieder; die wörtlichere Ausdrucksweise wird in der Fußnote genannt.
- source_word: אתי
  choice: du
  rationale: Das selbstständige Pronomen hebt die Angesprochene hervor. Im Deutschen trägt das ausdrücklich gesetzte »du« diese Betonung ausreichend.
- source_word: חֹבֶקֶת
  choice: in den Armen halten
  rationale: Das Partizip bezeichnet das Umfangen oder Halten in den Armen. Die gewählte Formulierung ist anschaulich und im Zusammenhang mit einem Kind natürlich.
- source_word: בֵּן
  choice: einen Sohn
  rationale: Der hebräische Text bezeichnet ausdrücklich einen Sohn, nicht allgemein ein Kind.
- source_word: אַל
  choice: Ach nein
  rationale: Das erste אַל ist hier ein emotionaler Ausruf der Abwehr oder des erschrockenen Unglaubens, nicht unmittelbar ein Verbot.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die respektvolle Anrede gilt Elischa. »Mein Herr« bewahrt die Ehrerbietung, ohne die Anrede auf Gott zu beziehen.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Dies ist die geläufige und genaue Wiedergabe der hebräischen Bezeichnung für einen von Gott beauftragten Propheten.
- source_word: תְּכַזֵּב
  choice: täusche ... nicht
  rationale: Das Verb kann lügen, täuschen oder sich als falsch erweisen bedeuten. Hier bittet die Frau darum, keine Hoffnung zu wecken, die sich als trügerisch erweisen könnte.
- source_word: בְּשִׁפְחָתֶךָ
  choice: deine Dienerin
  rationale: Das hebräische Substantiv ist ausdrücklich feminin und dient als demütige Selbstbezeichnung. »Deine Dienerin« bewahrt beides in natürlichem Deutsch.
theological_decisions:
- issue: Ehrerbietige menschliche Anrede אֲדֹנִי
  choice: mein Herr
  alternative: mein Gebieter; Herr
  rationale: Die Anrede richtet sich an Elischa und nicht an Gott. »Mein Herr« gibt den sozialen Ehrentitel wieder, ohne ihm göttliche Bedeutung beizulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt emotional und respektvoll. »Übers Jahr« ist idiomatisch, während die Fußnote die ungewöhnliche Bildsprache des Hebräischen sichtbar hält.
