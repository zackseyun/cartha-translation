  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מַ֠דּוּעַ אתי הלכתי אֵלָי/ו֙ הַ/יּ֔וֹם לֹֽא חֹ֖דֶשׁ וְ/לֹ֣א שַׁבָּ֑ת וַ/תֹּ֖אמֶר שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: de
  text: 'Er fragte: „Warum gehst du heute zu ihm? Es ist doch weder Neumond noch Sabbat.“ Sie antwortete: „Alles ist in Ordnung.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Frieden.“ Auch möglich: „Es ist gut.“'
    reason: Die knappe hebräische Antwort שָׁלוֹם kann sowohl wörtlich als Friedensgruß als auch idiomatisch als Versicherung verstanden werden, dass alles in Ordnung sei.
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Die Frage zielt auf den Grund ihres unerwarteten Aufbruchs; „Warum“ ist die natürliche moderne Entsprechung.
- source_word: אתי הלכתי
  choice: gehst du
  rationale: Die masoretisch überlieferte, ungewöhnliche Form wird als Anrede an eine einzelne Frau verstanden. Das deutsche Präsens passt zur unmittelbar bevorstehenden beziehungsweise bereits eingeleiteten Handlung.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das Pronomen bezieht sich im Zusammenhang auf Elisa; die Übersetzung bewahrt die pronominale Form des hebräischen Textes.
- source_word: הַיּוֹם
  choice: heute
  rationale: Natürliche deutsche Wiedergabe der Zeitangabe.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: Es ist doch weder Neumond noch Sabbat
  rationale: „Weder … noch“ gibt die doppelte Verneinung idiomatisch wieder. „Doch“ macht den begründenden, verwunderten Einwand im Deutschen natürlich hörbar, ohne eine neue Sachinformation einzuführen.
- source_word: חֹדֶשׁ
  choice: Neumond
  rationale: Im kultisch-kalendarischen Zusammenhang bezeichnet das Wort den Neumondtag beziehungsweise die Neumondfeier, nicht einfach einen Monat.
- source_word: שַׁבָּת
  choice: Sabbat
  rationale: Der etablierte deutsche Begriff bezeichnet den israelitischen Ruhetag präzise.
- source_word: שָׁלוֹם
  choice: Alles ist in Ordnung
  rationale: Die knappe Antwort mit dem Substantiv „Frieden/Wohlergehen“ dient hier idiomatisch als beschwichtigende Versicherung. Die wörtliche Ausdrucksweise bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. „Er fragte“ und „Sie antwortete“ geben die jeweilige Redefunktion im Deutschen natürlicher wieder als ein zweimaliges „sagte“. Die knappe und möglicherweise ausweichende Antwort der Frau bleibt erhalten.
