lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sie sagte
  rationale: Das narrative Waw mit אמר führt ihre Rede fort; im natürlichen modernen Deutsch kann die Konjunktion unausgedrückt bleiben.
- source_word: הֲשָׁאַלְתִּי
  choice: Habe ich … gebeten?
  rationale: Die Fragepartikel kennzeichnet eine rhetorische Frage. Das Perfekt gibt den Rückblick auf ihre frühere Haltung im Deutschen natürlich wieder.
- source_word: בֵן
  choice: einen Sohn
  rationale: בֵן bezeichnet hier ausdrücklich einen Sohn und sollte nicht zum allgemeineren „Kind“ verflacht werden.
- source_word: מֵאֵת אֲדֹנִי
  choice: meinen Herrn
  rationale: Bei „jemanden um etwas bitten“ wird die hebräische Präposition im Deutschen idiomatisch durch den Akkusativ der Person wiedergegeben. „Mein Herr“ ist eine respektvolle Anrede für Elisa, kein Gottestitel.
- source_word: הֲלֹא אָמַרְתִּי
  choice: Habe ich nicht gesagt?
  rationale: Die Form leitet eine zweite rhetorische Frage ein und erinnert an ihren früheren Einwand; „gesagt“ bleibt nah an אמר.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: Wecke in mir keine falsche Hoffnung
  rationale: Der Hifil von שלה bezeichnet Irreführen oder Täuschen. Im Zusammenhang mit dem verheißenen und nun gestorbenen Sohn bringt diese idiomatische Formulierung die Gefahr einer Hoffnung zum Ausdruck, die sich als leer erweist, ohne die lexikalischen Alternativen auszuschließen.
