base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/036.yaml
  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: de
  text: 'Dann rief er Gehasi und sagte: »Ruf diese Schunemiterin.« Er rief sie, und sie kam zu ihm. Da sagte er: »Nimm deinen Sohn.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: Dann rief er Gehasi
  rationale: Die narrative Folgeform wird im Deutschen natürlich mit »Dann« wiedergegeben; קרא אל bezeichnet hier das Rufen einer Person. Der Name wird in der im Deutschen geläufigen biblischen Form »Gehasi« wiedergegeben.
- source_word: קְרָא אֶל
  choice: Ruf
  rationale: Der Imperativ von קרא mit אֶל wird direkt und idiomatisch mit »Ruf« übersetzt; »Lass … rufen« oder »Hol« wären freier.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: diese Schunemiterin
  rationale: Das feminine Gentiliz bezeichnet die Frau aus Schunem. »Schunemiterin« bewahrt sowohl die Herkunftsbezeichnung als auch das grammatische Geschlecht; הַזֹּאת wird mit »diese« erhalten.
- source_word: וַיִּקְרָאֶהָ
  choice: Er rief sie
  rationale: Die ausdrückliche Wiederholung von קרא wird beibehalten und schildert Gehasis Ausführung des Auftrags.
- source_word: וַתָּבֹא אֵלָיו
  choice: und sie kam zu ihm
  rationale: בוא mit אֶל bezeichnet die Bewegung zu einer Person. Der hebräische Text verlangt nicht ausdrücklich, dass sie in einen Raum eintrat.
- source_word: שְׂאִי
  choice: Nimm
  rationale: Der feminine Singularimperativ von נשׂא kann »heben«, »aufnehmen« oder »nehmen« bedeuten. Im Kontext fordert Elisa die Mutter auf, ihren wieder lebenden Sohn zu sich zu nehmen; das natürliche deutsche »Nimm« bewahrt den knappen Befehl.
- source_word: בְנֵךְ
  choice: deinen Sohn
  rationale: בֵּן mit dem Suffix der 2. Person feminin Singular bedeutet spezifisch »deinen Sohn«.
