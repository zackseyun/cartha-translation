  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: de
  text: 'Da sagte die Mutter des Jungen: »So wahr Jahwe lebt und so wahr du lebst[a], ich werde dich nicht verlassen.« Da stand er auf und folgte ihr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schwurformel lautet wörtlich: »So wahr Jahwe lebt und so wahr deine Seele lebt«; gemeint ist: »So gewiss Jahwe lebt und du lebst.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: die Mutter des Jungen
  rationale: Die deutsche Genitivkonstruktion gibt den hebräischen Status constructus genau und natürlich wieder.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: So wahr Jahwe lebt und so wahr du lebst
  rationale: Die geläufige deutsche Schwurformel vermittelt den Sinn beider hebräischen Wendungen natürlich; נַפְשְׁךָ bezeichnet hier idiomatisch die Person beziehungsweise ihr Leben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: Ich werde dich nicht verlassen
  rationale: אִם dient nach der Schwurformel als nachdrückliche Verneinung; eine wörtlich konditionale Wiedergabe wäre im Deutschen missverständlich.
- source_word: וַיָּקָם
  choice: Da stand er auf
  rationale: Gibt קום in der hebräischen Erzählfolge idiomatisch und präzise wieder.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: und folgte ihr
  rationale: Die Wendung bedeutet in diesem Zusammenhang, dass Elischa hinter ihr herging; »folgte ihr« ist im modernen Deutschen klar und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der Schwurformel
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Schwurformel mit אִם
  choice: 'nachdrückliche Verneinung: »Ich werde dich nicht verlassen«'
  alternative: 'formal konditional: »Wenn ich dich verlasse«'
  rationale: Im Anschluss an den Schwur markiert אִם eine Selbstverwünschungsformel mit ausgelassener Folge und bedeutet sinngemäß »gewiss nicht«; die direkte Verneinung wahrt die Aussage, ohne eine im Deutschen unvollständige Bedingung zu erzeugen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählfolge bleibt knapp; die altertümlich wirkende wörtliche Form »deine Seele lebt« wird im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
