translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die botanische Unsicherheit wird im Haupttext nicht unnötig aufgelöst; technische Benennungen stehen nur in der Fußnote. Die Wiederholung von „Feld“ im Hebräischen wird teilweise idiomatisch durch „wild“ wiedergegeben.
