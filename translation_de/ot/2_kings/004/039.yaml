base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: de
  text: Da ging einer hinaus aufs Feld, um essbare Pflanzen[a] zu sammeln. Er fand eine wild wachsende Schlingpflanze und pflückte davon wilde Kürbisfrüchte[b], so viel sein Gewand fassen konnte. Dann kam er zurück und schnitt sie in den Topf mit dem Eintopf; denn sie wussten nicht, was es war.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Grünzeug“ beziehungsweise „Kräuter“. Das hebräische Wort bezeichnet allgemein essbare Pflanzen, die auf dem Feld gesammelt wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „eine Ranke des Feldes“ und „Kürbisfrüchte des Feldes“. Wahrscheinlich sind Koloquinten gemeint, doch die genaue Pflanzenart bleibt unsicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „obwohl sie nicht wussten, was es war“. Das hebräische Bindewort kann hier erklärend („denn/weil“) oder im Erzählzusammenhang einräumend verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: einer
  rationale: Das Zahlwort bezeichnet substantivisch einen einzelnen Mann aus der Gruppe; „einer“ ist im Deutschen natürlich und wahrt die unbestimmte Einzelreferenz.
- source_word: לְלַקֵּט אֹרֹת
  choice: um essbare Pflanzen zu sammeln
  rationale: אֹרֹת bezeichnet allgemein zum Essen gesammelte Feldpflanzen beziehungsweise Grünzeug. Die Wiedergabe vermeidet die mögliche Verengung von „Kräuter“.
- source_word: גֶּפֶן שָׂדֶה
  choice: eine wilde Ranke
  rationale: Wörtlich steht „eine Ranke des Feldes“. Im Zusammenhang ist eine wild wachsende rankende Pflanze gemeint; „Ranke“ vermeidet die im Deutschen naheliegende Festlegung auf eine Weinrebe.
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: wilde Kürbisfrüchte
  rationale: Die Bezeichnung meint Früchte einer wilden rankenden Pflanze, wahrscheinlich Koloquinten. „Kürbisfrüchte“ ist verständlich, ohne die Art im Haupttext übergenau zu bestimmen.
- source_word: מְלֹא בִגְדוֹ
  choice: so viel sein Gewand fassen konnte
  rationale: Die hebräische Mengenangabe bedeutet wörtlich „sein Gewand voll“ und zeichnet das Gewand als behelfsmäßigen Sammelbehälter.
- source_word: וַיְפַלַּח
  choice: schnitt sie
  rationale: Das Verb bezeichnet Spalten oder Aufschneiden. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch „sie“ natürlich aufgenommen.
- source_word: סִיר הַנָּזִיד
  choice: den Topf mit dem Eintopf
  rationale: נָזִיד bezeichnet ein gekochtes Gericht beziehungsweise einen Eintopf; die Formulierung ist modern und erhält sowohl Gefäß als auch Inhalt.
- source_word: כִּי לֹא יָדָעוּ
  choice: denn sie wussten nicht, was es war
  rationale: כִּי wird hier erklärend wiedergegeben. Der im Hebräischen implizite Gegenstand ihres Nichtwissens wird idiomatisch ergänzt, ohne festzulegen, ob die Unkenntnis die Pflanze, die Früchte oder deren Gefährlichkeit betraf.
