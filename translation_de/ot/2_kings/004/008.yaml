base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: de
  text: Eines Tages zog Elisa durch Schunem. Dort lebte eine angesehene Frau[a]. Sie drängte ihn, bei ihr eine Mahlzeit einzunehmen[b]. Und sooft er vorbeikam, kehrte er dort ein, um eine Mahlzeit einzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eine große Frau«; gemeint ist wahrscheinlich eine gesellschaftlich angesehene oder wohlhabende Frau.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Brot zu essen«; die Wendung kann allgemein das Einnehmen einer Mahlzeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Eines Tages
  rationale: Gibt die hebräische narrative Zeitformel natürlich und knapp wieder.
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: kam Elisa durch Schunem
  rationale: עָבַר bezeichnet hier Elisas Reise durch beziehungsweise an den Ort; die Formulierung bereitet zugleich das wiederholte Vorbeikommen vor.
- source_word: אִשָּׁה גְדוֹלָה
  choice: eine angesehene Frau
  rationale: גְדוֹלָה weist hier wahrscheinlich auf gesellschaftliches Ansehen oder Wohlstand, nicht auf Körpergröße oder moralische Größe.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: Sie drängte ihn
  rationale: Die Wendung bezeichnet nachdrückliches Zureden und bewahrt dessen Stärke in natürlichem Deutsch.
- source_word: לֶאֱכָל לָחֶם
  choice: eine Mahlzeit einzunehmen / zum Essen
  rationale: Wörtlich steht »Brot essen«; die hebräische Wendung bezeichnet idiomatisch das Einnehmen einer Mahlzeit.
- source_word: מִדֵּי עָבְרוֹ
  choice: jedes Mal, wenn er dort vorbeikam
  rationale: Die Konstruktion drückt eine wiederholte Gelegenheit aus.
- source_word: יָסֻר שָׁמָּה
  choice: kehrte er bei ihr ein
  rationale: סוּר bezeichnet hier das Abbiegen beziehungsweise Einkehren auf dem Reiseweg.
theological_decisions: []
