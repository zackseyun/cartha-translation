  register: Modernes, würdiges Standarddeutsch. Die idiomatische Bedeutung von »Brot essen« steht im Haupttext, während die konkrete hebräische Form in einer Fußnote erhalten bleibt. Der Übergang »Seitdem« verdeutlicht die aus der einmaligen Einladung hervorgehende wiederholte Gewohnheit, ohne den Sinn auszubauen.
