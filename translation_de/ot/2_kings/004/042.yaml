reference: 2 Kings 4:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֨ישׁ בָּ֜א מִ/בַּ֣עַל שָׁלִ֗שָׁה וַ/יָּבֵא֩ לְ/אִ֨ישׁ הָ/אֱלֹהִ֜ים לֶ֤חֶם בִּכּוּרִים֙ עֶשְׂרִֽים לֶ֣חֶם שְׂעֹרִ֔ים וְ/כַרְמֶ֖ל בְּ/צִקְלֹנ֑/וֹ וַ/יֹּ֕אמֶר תֵּ֥ן לָ/עָ֖ם וְ/יֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: de
  text: 'Ein Mann kam aus Baal-Schalischa und brachte dem Mann Gottes Brot von den Erstlingsfrüchten: zwanzig Gerstenbrote und frisches Korn[a] in seinem Beutel[b]. Da sagte er: »Gib es den Leuten, damit sie essen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geröstetes Korn«. Das hebräische Wort kann Getreide bezeichnen, das bereits zum Essen zubereitet ist, nicht nur frisches Korn.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »Beutel« wiedergegebene hebräische Wort ist selten und in seiner Bedeutung unsicher. Gemeint sein könnte auch eine Tasche, eine Umhüllung oder möglicherweise das Korn in seinen Hülsen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die gewöhnliche Bedeutung bezeichnet hier eine männliche Einzelperson; die Wiedergabe ist direkt und natürlich.
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: aus Baal-Schalischa
  rationale: Der Ortsname wird nach deutscher Schreibkonvention transliteriert und nicht übersetzt.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feste hebräische Bezeichnung wird wörtlich bewahrt, statt sie deutend mit »Prophet« wiederzugeben.
- source_word: לֶחֶם בִּכּוּרִים
  choice: Brot von den Erstlingsfrüchten
  rationale: Die Formulierung gibt die Zugehörigkeit zu den Erstlingsfrüchten verständlich wieder, ohne die kultische Funktion näher festzulegen.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: zwanzig Gerstenbrote
  rationale: Beim Zählen bezeichnet לֶחֶם einzelne Brote; »Gerstenbrote« ist im Deutschen knapp und idiomatisch.
- source_word: כַרְמֶל
  choice: frisches Korn
  rationale: Das Wort bezeichnet hier Getreide in frischem oder zum Verzehr zubereitetem Zustand. Die konkrete Zubereitungsart bleibt unsicher und wird in einer Fußnote kenntlich gemacht.
- source_word: בְּצִקְלֹנוֹ
  choice: in seinem Beutel
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich einen Behälter oder eine Umhüllung; »Beutel« ist im Kontext plausibel, während die Unsicherheit durch eine Fußnote erhalten bleibt.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: Gib es den Leuten, damit sie essen
  rationale: Der Imperativ mit anschließendem Präfixverb drückt hier Zweck oder beabsichtigte Folge aus. »Den Leuten« bezeichnet natürlich die anwesende Gruppe, nicht ein Volk als Nation.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht deutlich, dass die zwanzig Gerstenbrote und das Korn den zuvor genannten Ertrag der Erstlingsfrüchte näher beschreiben. »Da sagte er« bewahrt die im einzelnen Vers nicht ausdrücklich benannte Identität des Sprechers.
