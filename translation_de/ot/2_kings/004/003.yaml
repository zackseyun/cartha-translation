source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לְכִ֨י שַׁאֲלִי לָ֤/ךְ כֵּלִים֙ מִן הַ/ח֔וּץ מֵ/אֵ֖ת כָּל שכנ/כי כֵּלִ֥ים רֵקִ֖ים אַל תַּמְעִֽיטִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: de
  text: 'Da sagte er: »Geh hinaus und leih dir bei all deinen Nachbarn Gefäße aus, leere Gefäße. Nimm nicht zu wenige!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכִי
  choice: Geh
  rationale: Der feminine Singular des Imperativs von הלך fordert die Frau auf, tätig zu werden; »Geh« ist im Deutschen natürlich und präzise.
- source_word: שַׁאֲלִי לָךְ
  choice: leih dir … aus
  rationale: שאל kann allgemein »bitten/erbitten« bedeuten, bezeichnet im Zusammenhang mit den Nachbarn und der vorübergehenden Verwendung der Gefäße aber am ehesten das Ausleihen. »dir« gibt die benefaktive Nuance von לָךְ wieder.
- source_word: כֵּלִים
  choice: Gefäße
  rationale: כְּלִי ist ein weiter Begriff für Geräte, Gegenstände oder Behältnisse. Da sie Öl aufnehmen sollen, ist »Gefäße« treffend, ohne Material oder Form festzulegen.
- source_word: מִן הַחוּץ
  choice: draußen
  rationale: Wörtlich »von draußen«; im Zusammenhang weist die Wendung aus ihrem Haus hinaus zu den Nachbarn. »draußen« ist knapp und idiomatisch.
- source_word: מֵאֵת כָּל שכנכי
  choice: bei all deinen Nachbarn
  rationale: Beim deutschen Verb »ausleihen« wird die Person, von der etwas entliehen wird, idiomatisch mit »bei« bezeichnet. »all deinen Nachbarn« bewahrt den umfassenden Sinn.
- source_word: כֵּלִים רֵקִים
  choice: leere Gefäße
  rationale: Die Wiederholung von »Gefäße« folgt der hebräischen Hervorhebung und macht klar, dass die entliehenen Gefäße leer sein müssen.
- source_word: אַל תַּמְעִיטִי
  choice: Nimm nicht zu wenige!
  rationale: Die Hifil-Form von מעט mit אַל untersagt, die Zahl gering zu halten. Die Formulierung ist im Deutschen natürlich und bewahrt den nachdrücklichen, mengenbezogenen Sinn.
theological_decisions: []
