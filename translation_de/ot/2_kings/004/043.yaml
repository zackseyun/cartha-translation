base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: de
  text: 'Doch sein Diener sagte[a]: »Wie soll ich das hundert Männern vorsetzen?« Er erwiderte: »Gib es den Leuten, damit sie essen, denn so spricht Jahwe: ›Sie werden essen, und es wird noch etwas übrig bleiben[b].‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wie kann ich das hundert Männern geben?« Wörtlich lautet das Hebräische ungefähr: »Was soll ich dies vor hundert Männern vorsetzen?«'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch knapp: »essen und übrig lassen«; gemeint ist, dass nach dem Essen noch etwas übrig sein wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: sein Diener
  rationale: מְשָׁרֵת bezeichnet jemanden, der einer Person in dienender Funktion zur Seite steht. »Diener« ist im Erzählzusammenhang natürlich und wahrt das Unterordnungsverhältnis zu Elisa.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: Wie soll ich das hundert Männern vorsetzen?
  rationale: Die kontextuelle Bedeutung ist, die Speise einer Gruppe zum Essen vorzusetzen. »Wie soll ich« gibt den zweifelnden Einwand wieder, ohne die im Hebräischen implizierte Unmöglichkeit übermäßig zu verstärken.
- source_word: אִישׁ
  choice: Männern
  rationale: Das maskuline אִישׁ steht nach der Zahl distributiv; »hundert Männern« entspricht Form und wahrscheinlichem Bezug genauer als eine geschlechtsneutrale Wiedergabe.
- source_word: תֵּן לָעָם
  choice: Gib es den Leuten
  rationale: עָם bezeichnet hier die versammelte Gruppe kollektiv. »Leute« gibt den Wechsel vom zuvor verwendeten אִישׁ wieder und klingt im Deutschen idiomatisch.
- source_word: וְיֹאכֵלוּ
  choice: damit sie essen
  rationale: Das Präfixverb im Anschluss an den Imperativ bezeichnet den beabsichtigten beziehungsweise folgenden Vorgang. »Damit sie essen« verbindet Gebot und Zweck in natürlichem Deutsch.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: Denn so spricht Jahwe
  rationale: Die feste prophetische Botenformel wird erkennbar bewahrt. Das präsentische »spricht« ist die herkömmliche und würdige deutsche Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als Name wiedergegeben; »Jahwe« ist die im modernen Deutschen geläufige Form der wissenschaftlich üblichen Vokalisierung.
- source_word: אָכֹל וְהוֹתֵר
  choice: Sie werden essen, und es wird noch etwas übrig bleiben
  rationale: Die knappe hebräische Verbindung sichert Essen und verbleibenden Überschuss zu. Die deutsche Formulierung macht das implizite Subjekt und das Ergebnis deutlich, ohne die Zusage darüber hinaus auszulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Tetragrammname ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Gewissheit der prophetischen Zusage
  choice: Sie werden essen, und es wird noch etwas übrig bleiben
  alternative: Sie sollen essen und etwas übrig lassen
  rationale: Im Kontext kündigt die Formulierung den von Jahwe zugesicherten Ausgang an, nicht ein weiteres Gebot an die Essenden. Die Zukunftsform wahrt diesen Verheißungscharakter.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die prophetische Formel bleibt bewusst formelhaft; ansonsten werden unnötige Archaismen vermieden.
