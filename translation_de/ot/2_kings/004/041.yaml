  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: de
  text: 'Dann sagte er: „Holt Mehl!“ Er warf es in den Topf und sagte: „Schöpf für die Leute aus, damit sie essen können!“ Und es war nichts Schädliches im Topf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte er
  rationale: Das narrative וַ führt die Handlung weiter; „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: וּקְחוּ
  choice: Holt
  rationale: Der Imperativ Plural von לקח fordert die Angesprochenen hier dazu auf, Mehl herbeizubringen. „Holt“ ist kontextgerecht und natürlich.
- source_word: קֶמַח
  choice: Mehl
  rationale: קֶמַח bezeichnet Mehl beziehungsweise feines Mahlgut; „Mehl“ ist die klare, allgemein verständliche deutsche Entsprechung.
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: Er warf es in den Topf
  rationale: שלך bedeutet „werfen“ oder „hineinwerfen“; das Pronomen „es“ nimmt das zuvor genannte Mehl idiomatisch auf.
- source_word: צַק לָעָם
  choice: Schöpft für die Leute aus
  rationale: יצק bedeutet wörtlich „gießen/ausgießen“. Bei einer Speise im Topf bezeichnet es hier das Austeilen; „ausschöpfen“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: וְיֹאכֵלוּ
  choice: damit sie essen können
  rationale: Das mit וְ verbundene Imperfekt drückt nach dem Imperativ Zweck beziehungsweise beabsichtigte Folge aus.
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: Und es war nichts Schädliches im Topf
  rationale: דָבָר רָע heißt wörtlich „eine böse/schlechte Sache“, bezeichnet im Zusammenhang mit dem gefährlichen Gericht jedoch etwas Schädliches, nicht moralisches Böses.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählweise des Hebräischen bleibt erhalten; konkrete Verben werden bevorzugt, während missverständliches moralisches „Böse“ im Lebensmittelkontext als „Schädliches“ wiedergegeben wird.
