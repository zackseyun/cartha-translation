base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/018.yaml
  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: de
  text: Der Junge wuchs heran, und eines Tages ging er hinaus zu seinem Vater, zu den Schnittern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: wuchs heran
  rationale: Das Verb גדל bezeichnet hier das körperliche Heranwachsen des Kindes. »Wuchs heran« ist natürliches Deutsch und vermeidet die möglicherweise zu weit gehende Aussage, er sei bereits erwachsen geworden.
- source_word: הַיָּלֶד
  choice: der Junge
  rationale: יֶלֶד kann »Kind« oder »Junge« bedeuten. Da das Geschlecht im Kontext eindeutig ist und er zu seinem Vater aufs Feld hinausgeht, ist »Junge« im Deutschen passend.
- source_word: וַיְהִי הַיּוֹם
  choice: eines Tages
  rationale: Die hebräische Erzählformel führt einen bestimmten Anlass ein. »Eines Tages« gibt ihre Funktion in klarem, natürlichem Deutsch wieder.
- source_word: וַיֵּצֵא
  choice: ging er hinaus
  rationale: יצא bezeichnet eine Bewegung nach draußen. »Ging hinaus« bewahrt diese Richtungsnuance.
- source_word: אֶל אָבִיו
  choice: zu seinem Vater
  rationale: אֶל bezeichnet hier die Bewegung auf den Vater zu.
- source_word: אֶל הַקֹּצְרִים
  choice: zu den Schnittern
  rationale: קֹצְרִים sind Menschen, die Getreide schneiden. »Schnitter« ist präzise, knapp und in einer würdigen modernen Bibelübersetzung verständlich; die Wiederholung von »zu« erhält die hebräische Satzstruktur.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die Wiederholung »zu seinem Vater, zu den Schnittern« wurde beibehalten, weil sie die hebräische Struktur wiedergibt und erkennen lässt, dass der Vater sich bei den Schnittern befand.
