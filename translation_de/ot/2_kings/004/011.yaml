  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: de
  text: Eines Tages kam er dorthin, ging in das obere Zimmer und legte sich dort hin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und schlief dort“. Das hebräische Verb kann sowohl das Hinlegen als auch das Schlafen bezeichnen; der Zusammenhang legt die speziellere Bedeutung nicht eindeutig fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Eines Tages
  rationale: Die hebräische Wendung führt einen bestimmten Erzählanlass ein. „Eines Tages“ gibt dies in natürlichem modernem Deutsch wieder, ohne die Erzählformel unnötig wörtlich abzubilden.
- source_word: וַיָּבֹא שָׁמָּה
  choice: kam er wieder dorthin
  rationale: בוא bedeutet hier „kommen“, שָׁמָּה „dorthin“. Das aus dem Zusammenhang erschlossene „wieder“ macht deutlich, dass Elisa erneut nach Schunem kommt; es ist jedoch nicht ausdrücklich lexikalisch markiert.
- source_word: וַיָּסַר
  choice: zog sich … zurück
  rationale: סור bezeichnet hier das Abbiegen beziehungsweise Sich-Zurückziehen vom üblichen Weg in den für ihn bestimmten Raum. Die Formulierung ist im Deutschen natürlich und wahrt die gerichtete Bewegung.
- source_word: אֶל הָעֲלִיָּה
  choice: in das Obergemach
  rationale: עֲלִיָּה bezeichnet einen Raum im Obergeschoss beziehungsweise einen aufgebauten oberen Raum. „Obergemach“ bewahrt die architektonische Bedeutung in würdigem, bibelgeeignetem Deutsch.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: und legte sich dort hin
  rationale: שׁכב kann „sich hinlegen“, „liegen“ oder kontextabhängig „schlafen“ bedeuten. „Legte sich … hin“ bewahrt die konkrete Handlung, ohne Schlaf als sicher vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Obergemach“ ist leicht gehoben, aber präzise und im biblischen Zusammenhang geläufig. Die mögliche Bedeutung „schlafen“ wird wegen der lexikalischen Mehrdeutigkeit in einer Fußnote bewahrt.
