  text: וֶ/אֱלִישָׁ֞ע שָׁ֤ב הַ/גִּלְגָּ֨לָ/ה֙ וְ/הָ/רָעָ֣ב בָּ/אָ֔רֶץ וּ/בְנֵי֙ הַ/נְּבִיאִ֔ים יֹשְׁבִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמֶר לְ/נַעֲר֗/וֹ שְׁפֹת֙ הַ/סִּ֣יר הַ/גְּדוֹלָ֔ה וּ/בַשֵּׁ֥ל נָזִ֖יד לִ/בְנֵ֥י הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: de
  text: 'Elisa kehrte nach Gilgal zurück. Damals herrschte eine Hungersnot im Land. Die Prophetenschüler[a] saßen vor ihm. Da sagte er zu seinem Diener: »Setz den großen Topf auf und koche einen Eintopf für die Prophetenschüler.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Söhne der Propheten«; gemeint sind Angehörige einer prophetischen Gemeinschaft.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: kehrte ... zurück
  rationale: Das Qal-Perfekt von שׁוב bezeichnet hier die Rückkehr an einen früheren Aufenthaltsort.
- source_word: הַגִּלְגָּלָה
  choice: nach Gilgal
  rationale: Das direktionale He bezeichnet die Bewegung auf den Ortsnamen zu; im Deutschen natürlich mit »nach« wiedergegeben.
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: Damals herrschte eine Hungersnot im Land
  rationale: Die verbloser Hintergrundsatz beschreibt die damalige Lage. »herrschte« ergibt im modernen Deutschen eine natürliche, erzählerische Formulierung.
- source_word: בְנֵי הַנְּבִיאִים
  choice: Prophetenschüler
  rationale: Wörtlich »Söhne der Propheten«; gemeint sind Angehörige einer prophetischen Gemeinschaft, die hier wie Schüler vor Elisa sitzen. »Prophetenschüler« vermittelt die gemeinte soziale Beziehung klar, während die wörtliche Form in der Fußnote erhalten bleibt.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: saßen vor ihm
  rationale: Das Partizip zeichnet die fortdauernde Szene; »vor ihm« bewahrt sowohl die räumliche als auch die Lehrer-Schüler-Konnotation.
- source_word: לְנַעֲרוֹ
  choice: zu seinem Diener
  rationale: נַעַר kann einen jungen Mann, Diener oder Gehilfen bezeichnen. Die ihm aufgetragene Arbeit spricht hier für »Diener«.
- source_word: שְׁפֹת
  choice: Setz ... auf
  rationale: Das Verb bezeichnet in diesem Kochkontext das Aufsetzen eines Topfes, sinngemäß auf die Feuerstelle.
- source_word: הַסִּיר הַגְּדוֹלָה
  choice: den großen Topf
  rationale: סִיר ist ein Kochgefäß; »großer Topf« ist eine klare und gegenwärtige Wiedergabe.
- source_word: וּבַשֵּׁל
  choice: und koche
  rationale: Das Piel kann »kochen« beziehungsweise »sieden« bedeuten. Mit dem ausdrücklich genannten Gericht ist »koche« im Deutschen idiomatischer als »siede«.
- source_word: נָזִיד
  choice: ein Eintopfgericht
  rationale: נָזִיד bezeichnet eine gekochte Speise beziehungsweise einen Eintopf; »Eintopfgericht« ist eindeutig und modern.
theological_decisions:
- issue: Wiedergabe der Wendung בְנֵי הַנְּבִיאִים
  choice: Prophetenschüler
  alternative: Söhne der Propheten; Angehörige einer Prophetengemeinschaft
  rationale: Die wörtliche hebräische Verwandtschaftsbezeichnung ist im Deutschen leicht als leibliche Abstammung misszuverstehen. Der Kontext des Sitzens vor Elisa stützt die funktionale Wiedergabe »Prophetenschüler«. Die Fußnote bewahrt die Ausgangsform und die weitere institutionelle Bedeutung, ohne die genaue Struktur der Gruppe dogmatisch festzulegen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Kurze Hauptsätze machen den Szenenwechsel und die Hintergrundangabe klar. »Eintopfgericht« vermeidet das altertümliche »Mus«; »Prophetenschüler« verhindert ein naheliegendes Missverständnis der hebräischen Redewendung.
