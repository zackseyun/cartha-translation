base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: de
  text: Lass uns bitte ein kleines Oberzimmer an der Mauer[a] bauen und ihm dort ein Bett, einen Tisch, einen Stuhl und einen Leuchter hinstellen. Wenn er dann zu uns kommt, kann er dort einkehren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein kleines Oberzimmer mit einer Mauer“ oder einfach: „ein kleines Oberzimmer“. Die hebräische Wortverbindung ist knapp und lässt die genaue bauliche Anordnung offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „dort abbiegen“ oder „sich dorthin wenden“. Im Reisekontext kann das Verb „einkehren“ oder „Halt machen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: Lass uns bitte … bauen
  rationale: Der Kohortativ in der ersten Person Plural mit נָא formuliert einen höflichen Vorschlag; die deutsche Wendung gibt sowohl den Aufforderungscharakter als auch die Höflichkeit natürlich wieder.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: ein kleines Obergemach an der Mauer
  rationale: עֲלִיָּה bezeichnet ein oberes Zimmer oder Obergemach, קִיר eine Mauer beziehungsweise Wand. Die kompakte hebräische Verbindung bleibt räumlich konkret, ohne ihre genaue bauliche Bedeutung festzulegen.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: und ihm dort … hinstellen
  rationale: שִׂים bedeutet setzen, stellen oder platzieren. Im Zusammenhang mit der Einrichtung eines Zimmers ist „hinstellen“ natürlich; „ihm dort“ bewahrt Ortsangabe und indirektes Objekt.
- source_word: מִטָּה
  choice: ein Bett
  rationale: Im Zusammenhang einer Unterkunft bezeichnet das Wort am naheliegendsten eine Schlafstätte beziehungsweise ein Bett.
- source_word: שֻׁלְחָן
  choice: einen Tisch
  rationale: Die übliche und eindeutige deutsche Entsprechung.
- source_word: כִסֵּא
  choice: einen Stuhl
  rationale: Im häuslichen Einrichtungskontext ist „Stuhl“ konkreter und natürlicher als das allgemeinere „Sitz“.
- source_word: מְנוֹרָה
  choice: einen Leuchter
  rationale: מְנוֹרָה bezeichnet eine Vorrichtung, die eine Lampe trägt. „Leuchter“ bewahrt diese Spezifik besser als das allgemeinere „Lampe“ und klingt in diesem historischen Kontext würdig.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: Wenn er dann zu uns kommt
  rationale: Die Konstruktion führt die künftige beziehungsweise wiederkehrende Situation ein. „Wenn … dann“ gibt den Zusammenhang in natürlichem Deutsch wieder.
- source_word: יָסוּר שָׁמָּה
  choice: kann er dort einkehren
  rationale: סוּר bedeutet wörtlich „sich abwenden/abbiegen“ und kann im Reisekontext das Einkehren oder Haltmachen bezeichnen. „Einkehren“ bewahrt diese Nuance und passt zur angebotenen Unterkunft.
