  text: וַ/יְהִ֣י כִּ/מְלֹ֣את הַ/כֵּלִ֗ים וַ/תֹּ֤אמֶר אֶל בְּנָ/הּ֙ הַגִּ֨ישָׁ/ה אֵלַ֥/י עוֹד֙ כֶּ֔לִי וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אֵ֥ין ע֖וֹד כֶּ֑לִי וַֽ/יַּעֲמֹ֖ד הַ/שָּֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: de
  text: 'Als die Gefäße voll waren, sagte sie zu ihrem Sohn: »Bring mir noch ein Gefäß.« Er aber sagte zu ihr: »Es ist kein Gefäß mehr da.« Da hörte das Öl auf zu fließen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Da blieb das Öl stehen.« Gemeint ist, dass es nicht weiterfloss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת הַכֵּלִים
  choice: Als die Gefäße voll waren
  rationale: Die mit כְּ gebildete Infinitivkonstruktion bezeichnet hier den Zeitpunkt. Die Formulierung ist im Deutschen natürlich und gibt den erreichten Füllzustand wieder.
- source_word: הַכֵּלִים / כֶּלִי
  choice: Gefäße / Gefäß
  rationale: כְּלִי ist eine breite Bezeichnung für einen Gegenstand beziehungsweise Behälter. »Gefäß« bleibt ausreichend unspezifisch und passt zum Aufbewahren von Öl, ohne ein bestimmtes Material oder eine bestimmte Form vorauszusetzen.
- source_word: הַגִּישָׁה
  choice: Bring
  rationale: Der Hifil-Imperativ von נגשׁ bedeutet, etwas heranzubringen oder zu reichen. »Bring« gibt die Handlung in diesem Zusammenhang knapp und natürlich wieder.
- source_word: עוֹד כֶּלִי
  choice: noch ein Gefäß
  rationale: עוֹד bezeichnet hier ein zusätzliches Gefäß. »Noch ein Gefäß« ist die natürliche deutsche Entsprechung.
- source_word: אֵין עוֹד כֶּלִי
  choice: Es ist kein Gefäß mehr da
  rationale: אֵין drückt Nichtvorhandensein aus; עוֹד zeigt, dass kein weiteres Gefäß verfügbar ist. Die gewählte Formulierung ist idiomatisch und bleibt nahe am Sinn des Hebräischen.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: Da hörte das Öl auf zu fließen
  rationale: עמד bedeutet wörtlich »stehen« beziehungsweise »stillstehen«. Im Zusammenhang endet der zuvor fortdauernde Ölfluss; die explizite Wiedergabe mit »auf zu fließen« vermittelt diesen Sinn klar.
theological_decisions: []
