  text: וַ/תִּקְרָא֮ אֶל אִישָׁ/הּ֒ וַ/תֹּ֗אמֶר שִׁלְחָ֨/ה נָ֥א לִ/י֙ אֶחָ֣ד מִן הַ/נְּעָרִ֔ים וְ/אַחַ֖ת הָ/אֲתֹנ֑וֹת וְ/אָר֛וּצָה עַד אִ֥ישׁ הָ/אֱלֹהִ֖ים וְ/אָשֽׁוּבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: de
  text: 'Da rief sie ihren Mann und sagte: „Schick mir bitte einen von den jungen Männern und eine der Eselinnen, damit ich zum Mann Gottes eilen und zurückkehren kann.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: Da rief sie ihren Mann
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; „Da“ gibt die Abfolge im Deutschen natürlich wieder. אִישׁ mit Suffix bezeichnet in diesem häuslichen Zusammenhang ihren Ehemann.
- source_word: שִׁלְחָה נָא לִי
  choice: Schick mir bitte
  rationale: Der Imperativ mit נָא formuliert eine höfliche, zugleich dringliche Bitte.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: einen von den jungen Männern
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Die Wiedergabe bewahrt die lexikalische Offenheit, ohne einen Dienerstatus ausdrücklich festzulegen.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: und eine von den Eselinnen
  rationale: אָתוֹן bezeichnet ausdrücklich eine weibliche Eselin; diese Spezifizierung bleibt erhalten.
- source_word: וְאָרוּצָה
  choice: damit ich schnell … gehen … kann
  rationale: Der Kohortativ drückt hier die beabsichtigte, dringliche Handlung als Zweck der Bitte aus. Das wörtliche „laufen“ wäre im Zusammenhang einer Reise auf einer Eselin im modernen Deutschen missverständlich; „schnell gehen“ bewahrt die Dringlichkeit.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: zum Mann Gottes
  rationale: עַד bezeichnet bei einer Bewegung das Ziel. Der feste hebräische Prophetentitel אִישׁ הָאֱלֹהִים wird formal als „Mann Gottes“ wiedergegeben.
- source_word: וְאָשׁוּבָה
  choice: und wieder zurückkommen kann
  rationale: Der zweite Kohortativ setzt die beabsichtigte Handlung fort; „wieder zurückkommen“ ist in direkter Rede natürlich und klar.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache in natürlicher direkter Rede. Die höfliche Bitte und die Dringlichkeit werden bewahrt; die Bezeichnung „Mann Gottes“ bleibt entsprechend dem hebräischen Titel unverändert.
