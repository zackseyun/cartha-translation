  naturalness: „Da rief sie ihren Mann und sagte“ und die direkte Bitte sind modernes, natürliches Standarddeutsch. „eine der Eselinnen“ ist die reguläre, flüssigere Form. „zum Mann Gottes eilen“ vermittelt die Dringlichkeit idiomatisch, ohne die im Deutschen bei einer Reise mit Eselin mögliche Fehlvorstellung eines wörtlichen Laufens zu erzwingen.
  terminology: „Mann Gottes“ bewahrt den hebräischen Titel איש האלהים angemessen. „junge Männer“ lässt die mögliche Bedeutung von נער als junger Begleiter offen. „Eselinnen“ erhält die im Hebräischen ausdrücklich feminine Form.
