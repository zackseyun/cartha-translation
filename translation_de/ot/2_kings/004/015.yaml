base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/015.yaml
  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: de
  text: 'Da sagte er: „Ruf sie!“ Er rief sie, und sie stellte sich in die Türöffnung.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den Eingang“. Das hebräische Wort kann die Türöffnung oder den Eingangsbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählfolge ein; „Da sagte er“ klingt im Deutschen natürlich und bewahrt den konsekutiven Sinn.
- source_word: קְרָא לָהּ
  choice: Ruf sie!
  rationale: Der Imperativ von קרא mit dem Pronomen לָהּ bezeichnet hier die direkte Aufforderung an den männlichen Angesprochenen, die Frau zu rufen.
- source_word: וַיִּקְרָא לָהּ
  choice: Er rief sie
  rationale: Die Form setzt die Erzählung fort und beschreibt die unmittelbare Ausführung des Befehls. Ein zusätzliches „also“ ist im Deutschen nicht nötig.
- source_word: וַתַּעֲמֹד
  choice: und sie stellte sich
  rationale: עמד kann „stehen“ oder „sich hinstellen/seinen Platz einnehmen“ bedeuten. „Sie stellte sich“ gibt die hier beschriebene Einnahme einer Position natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Kommen hinzuzufügen.
- source_word: בַּפָּתַח
  choice: in den Eingang
  rationale: פתח bezeichnet die Öffnung beziehungsweise den Eingangsbereich. Wegen der mit „sich stellen“ verbundenen Richtungsangabe ist „in den Eingang“ idiomatisch; die mögliche räumliche Wiedergabe „am Eingang“ bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die knappe Abfolge des Hebräischen bleibt erhalten; weder ein ausdrückliches Herankommen der Frau noch eine genauere Position an der Schwelle wird ergänzt.
