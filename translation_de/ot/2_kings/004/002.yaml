base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: de
  text: 'Und Elisa sagte zu ihr: „Was soll ich für dich tun? Sag mir: Was hast du im Haus?“ Sie sagte: „Deine Dienerin hat überhaupt nichts im Haus außer einem Gefäß mit Öl[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Fläschchen Öl“ oder „ein kleiner Krug Öl“. Das seltene hebräische Wort אָסוּךְ bezeichnet ein Gefäß für Öl, wahrscheinlich ein kleineres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: Was soll ich für dich tun?
  rationale: Die Formulierung bewahrt den erwägenden Sinn des hebräischen Imperfekts und gibt die Frage natürlich wieder.
- source_word: הַגִּידִי לִי
  choice: Sag mir
  rationale: Der Imperativ wird direkt und idiomatisch wiedergegeben; ein höfliches „bitte“ steht nicht ausdrücklich im Hebräischen.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: Was hast du im Haus?
  rationale: Die hebräische Existenzkonstruktion mit ל wird im Deutschen natürlich als Besitz ausgedrückt; „im Haus“ wahrt den konkreten häuslichen Bezug.
- source_word: לְשִׁפְחָתְךָ
  choice: Deine Dienerin
  rationale: שִׁפְחָה bezeichnet ausdrücklich eine weibliche Dienerin und dient hier zugleich als ehrerbietige Selbstbezeichnung.
- source_word: אֵין ... כֹל
  choice: hat überhaupt nichts
  rationale: „Überhaupt nichts“ bringt die durch כֹל verstärkte Verneinung im Deutschen klar und natürlich zum Ausdruck.
- source_word: כִּי אִם
  choice: außer
  rationale: Die Wendung führt hier die einzige Ausnahme von der vorangehenden Verneinung ein.
- source_word: אָסוּךְ שָׁמֶן
  choice: einen kleinen Krug Öl
  rationale: Das seltene Wort אָסוּךְ bezeichnet offenbar ein kleineres Ölgefäß. „Kleiner Krug“ ist anschaulich, ohne Form oder kultische Verwendung unnötig festzulegen.
