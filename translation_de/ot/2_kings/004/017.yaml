    issue: Die Fußnote lässt in ihrer wörtlichen Wiedergabe die Vergleichspartikel כְּ aus.
    rationale: כָּעֵת חַיָּה lautet wörtlich etwa „wie die Zeit des Lebens“, nicht einfach „die Zeit des Lebens“. Da die Wendung idiomatisch und in ihrer genauen Herleitung schwierig ist, sollte die Fußnote das transparent wiedergeben.
  - severity: low
    issue: „Zu eben jener“ entfernt sich geringfügig vom hebräischen „dieser“.
    rationale: Ein rückblickendes „jener“ ist im Deutschen möglich, doch „dieser“ bewahrt den Wortlaut und passt weiterhin zum erzählerischen Rückblick.
