  yaml_path: translation/ot/2_kings/004/017.yaml
  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: de
  text: Die Frau wurde schwanger und gebar einen Sohn zur festgesetzten Zeit[a], um diese Zeit im nächsten Jahr, wie Elisa zu ihr gesagt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu dieser festgesetzten Zeit, wie die Zeit des Lebens«; die hebräische Wendung meint ungefähr dieselbe Zeit im nächsten Jahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Das Qal von הרה bezeichnet hier den Eintritt der Schwangerschaft; die Wendung ist im modernen Deutsch natürlich und eindeutig.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten; hier verweist es auf die bereits eingeführte Schunemiterin.
- source_word: וַתֵּלֶד בֵּן
  choice: gebar einen Sohn
  rationale: Die knappe, würdige Formulierung entspricht der üblichen hebräischen Geburtswendung.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: zu eben jener festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet einen bestimmten beziehungsweise festgesetzten Zeitpunkt; »eben jener« verweist im rückblickenden Erzählzusammenhang auf den zuvor angekündigten Termin.
- source_word: כָּעֵת חַיָּה
  choice: um diese Zeit im nächsten Jahr
  rationale: Die idiomatische Wendung bezeichnet in diesem Zusammenhang ungefähr dieselbe Jahreszeit im folgenden Jahr; die unklare wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  choice: wie Elisa zu ihr gesagt hatte
  rationale: Der Relativsatz stellt die Geburt als genaue Erfüllung von Elisas vorherigem Wort dar; das Plusquamperfekt bildet die zeitliche Abfolge natürlich ab.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Der Personenname folgt der im deutschen Bibelgebrauch etablierten Form.
