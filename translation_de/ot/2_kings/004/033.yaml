  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: de
  text: Er ging hinein, schloss die Tür hinter ihnen beiden[a] und betete zu Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Er schloss sich mit dem Kind allein im Raum ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Er ging hinein
  rationale: Das Wayyiqtol von בוא führt die Handlung fort und bezeichnet hier das Hineingehen in den Raum; „ging hinein“ ist natürlich und kontextgerecht.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: schloss die Tür
  rationale: סגר bezeichnet das Schließen oder Zuschließen; mit דלת ist „die Tür schließen“ die natürliche deutsche Wiedergabe.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: hinter ihnen beiden
  rationale: בְּעַד kann beim Schließen einer Tür ausdrücken, dass diese hinter beziehungsweise über den Eingeschlossenen geschlossen wird. Die Formulierung bewahrt den Bezug auf Elisa und das Kind, ohne die räumliche Wendung unnötig auszudeuten.
- source_word: וַיִּתְפַּלֵּל
  choice: und betete
  rationale: Der Hitpael von פלל bedeutet hier „beten“; die fortlaufende deutsche Erzählung kann das Subjekt unausgesprochen lassen.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל wird bei „beten“ idiomatisch mit „zu“ wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wer sich im geschlossenen Raum befindet
  choice: ihnen beiden
  alternative: schloss die Tür hinter sich und dem Kind
  rationale: Der hebräische Text nennt nur „die beiden“. Aus dem Kontext sind Elisa und das Kind gemeint; die Übersetzung belässt jedoch die pronominale Ausdrucksweise des Verses und erläutert sie in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählstruktur. „Hinter ihnen beiden“ klingt natürlich, während die Fußnote die konkretere räumliche Bedeutung und die mögliche wörtlichere Wiedergabe von בְּעַד festhält.
