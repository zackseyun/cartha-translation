  source_fidelity: Der Haupttext gibt die Handlung und die Dringlichkeit der hebräischen Imperative zutreffend wieder. „Eselin“ bewahrt die feminine Bezeichnung אָתוֹן angemessen. „Halte mich beim Reiten nicht auf“ ist eine natürliche deutsche Wiedergabe der in ihrer genauen Konstruktion schwierigen Wendung אַל־תַּעֲצָר לִי לִרְכֹּב und legt sich nicht unnötig auf bloßes Verlangsamen oder bloßes Anhalten fest.
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. „Treib sie an und geh weiter!“ klingt als Anweisung an den begleitenden Diener etwas flüssiger als „Treib sie an und geh los!“, ohne den Sinn zu verändern.
  terminology: „Diener“ ist für נַעַר im Kontext passend. Der Fußnotentext sollte jedoch nicht als wörtliche Übersetzung formuliert sein, weil „Halte für mich das Reiten nicht zurück“ weder idiomatisches Deutsch noch eine verlässliche Abbildung der hebräischen Konstruktion ist.
