  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: de
  text: 'Dann sattelte sie die Eselin und sagte zu ihrem Diener: „Treib sie an und geh weiter! Halte mich beim Reiten nicht auf[a], es sei denn, ich sage es dir.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist schwer wörtlich wiederzugeben; sie kann bedeuten, ihren Ritt nicht zurückzuhalten, zu verlangsamen oder anzuhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: Dann sattelte sie die Eselin
  rationale: חבש bezeichnet hier das Zurichten eines Reittiers, idiomatisch das Satteln. אָתוֹן ist ausdrücklich eine weibliche Eselin; diese Angabe lässt sich im Deutschen natürlich bewahren.
- source_word: נַעֲרָהּ
  choice: ihrem Diener
  rationale: נַעַר bezeichnet in diesem Zusammenhang einen jungen männlichen Diener oder Begleiter. „Diener“ gibt seine Funktion knapp und natürlich wieder.
- source_word: נְהַג וָלֵךְ
  choice: Treib sie an und geh los!
  rationale: נהג meint das Antreiben oder Führen eines Tieres; zusammen mit הלך drückt die Wendung den dringenden Aufbruch und das zügige Weitergehen aus. Das Objekt „sie“ bezieht sich auf die Eselin und ist im Deutschen zur Verständlichkeit ergänzt.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: Halte mich beim Reiten nicht auf
  rationale: עצר kann „zurückhalten“, „aufhalten“ oder „anhalten“ bedeuten. Die Formulierung bewahrt den Sinn, dass der Diener ihren Ritt nicht hemmen soll, ohne vorschnell nur zwischen Verlangsamen und Anhalten zu entscheiden.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: es sei denn, ich sage es dir
  rationale: כִּי אִם führt nach einer Verneinung die Ausnahme ein. „Es sei denn“ entspricht dieser Funktion im natürlichen Deutschen.
