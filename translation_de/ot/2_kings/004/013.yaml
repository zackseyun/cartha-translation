base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Sag ihr bitte: Sieh, du hast dir unseretwegen all diese Mühe gemacht.[a] Was kann für dich getan werden? Gibt es etwas, das wir für dich beim König oder beim Heerführer vorbringen sollen?[b]“ Sie antwortete: „Ich lebe inmitten meines Volkes.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du bist unseretwegen in all diese Unruhe geraten.“ Die hebräische Wendung beschreibt hier wahrscheinlich ihre große Fürsorge und all die Mühe, die sie für die beiden auf sich genommen hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Gibt es etwas, für dich zum König oder zum Heerführer zu sagen?“ Gemeint ist, bei ihnen für sie vorzusprechen.'
    reason: lexical_alternative
  - marker: c
    text: Ihre Antwort bedeutet wahrscheinlich, dass sie sicher in ihre Gemeinschaft eingebunden ist und keine besondere Begünstigung durch den König oder das Militär benötigt.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: du hast dir unseretwegen all diese Mühe gemacht
  rationale: Die figura etymologica bezeichnet wörtlich ein Erzittern beziehungsweise große Unruhe oder Sorge. Im Zusammenhang ihrer aufmerksamen Gastfreundschaft meint sie ihren außerordentlichen Einsatz; die deutsche Wendung gibt das idiomatisch und natürlich wieder.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Das Wort lenkt die Aufmerksamkeit auf die folgende Feststellung. „Sieh“ ist knapp, würdig und im heutigen Deutsch verständlich.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: Was können wir für dich tun?
  rationale: Die Infinitivkonstruktion fragt danach, was zu ihren Gunsten getan werden kann. Der Plural ergibt sich im Deutschen natürlich aus dem vorangehenden „unseretwegen“, während der hebräische Wortlaut den Handelnden offenlässt.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: Sollen wir für dich … ein Wort einlegen?
  rationale: Gemeint ist ein Sprechen zu ihren Gunsten, also Fürsprache oder die Vermittlung eines Anliegens. „Ein Wort einlegen“ ist dafür eine natürliche deutsche Wendung; die fragende Konstruktion bewahrt den Angebotscharakter.
- source_word: שַׂר הַצָּבָא
  choice: Heerführer
  rationale: שַׂר bezeichnet hier den ranghöchsten militärischen Befehlshaber. „Heerführer“ ist präzise, knapp und dem historischen Erzählregister angemessen.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: Ich lebe inmitten meines Volkes
  rationale: Die Übersetzung bleibt nahe am Hebräischen und wahrt, dass der Satz zunächst ihre Einbindung in das eigene Volk bezeichnet; die wahrscheinlich mitgemeinte Sicherheit und Genügsamkeit wird nicht in den Haupttext hineinerklärt.
- source_word: נָא
  choice: bitte
  rationale: Die Partikel mildert den Imperativ höflich ab; „bitte“ ist die natürliche moderne Entsprechung.
