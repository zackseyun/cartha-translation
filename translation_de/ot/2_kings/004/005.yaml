  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: de
  text: Da ging sie von ihm weg und schloss die Tür hinter sich und hinter ihren Söhnen. Ihre Söhne reichten ihr die Gefäße[a], während sie eingoss.
  philosophy: optimal-equivalence
