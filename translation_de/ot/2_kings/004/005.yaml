lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Da ging sie von ihm weg
  rationale: Die Erzählform führt die Handlung fort; מֵאִתּוֹ bezeichnet hier das Weggehen von Elischa. Die Formulierung ist natürlich und bewahrt die räumliche Bewegung.
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: und schloss die Tür hinter sich und ihren Söhnen
  rationale: בְּעַד mit dem Schließen einer Tür bedeutet, dass die Genannten nach dem Schließen drinnen sind. „Hinter sich und ihren Söhnen“ gibt die wiederholte hebräische Konstruktion knapp und idiomatisch wieder.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: Sie reichten ihr die Gefäße
  rationale: Das Partizip beschreibt die fortlaufende Tätigkeit der Söhne. Ein ausdrückliches Objekt fehlt im Hebräischen; „die Gefäße“ wird zur Klarheit aus dem unmittelbaren Zusammenhang ergänzt und in einer Fußnote ausgewiesen.
- source_word: וְהִיא מיצקת
  choice: und sie goss ein
  rationale: Das Partizip bezeichnet die gleichzeitig fortlaufende Tätigkeit der Frau. „Eingießen“ ist im Deutschen für das Umfüllen des Öls in die bereitgestellten Gefäße idiomatisch.
