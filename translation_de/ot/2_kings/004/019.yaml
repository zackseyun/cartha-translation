source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֶל אָבִ֖י/ו רֹאשִׁ֣/י רֹאשִׁ֑/י וַ/יֹּ֨אמֶר֙ אֶל הַ/נַּ֔עַר שָׂאֵ֖/הוּ אֶל אִמּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: de
  text: 'Er sagte zu seinem Vater: „Mein Kopf, mein Kopf!“ Da sagte sein Vater zu dem jungen Mann[a]: „Trag ihn zu seiner Mutter.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dem Diener“. Das hebräische Wort נַעַר kann je nach Zusammenhang einen Jungen, jungen Mann, Begleiter oder Diener bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: Er sagte zu seinem Vater
  rationale: אמר ist das gewöhnliche Verb für »sagen«; die Dringlichkeit wird durch den wiederholten Ausruf ausgedrückt, ohne ein stärkeres Verb wie »schreien« einzutragen.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: Mein Kopf, mein Kopf!
  rationale: Die knappe Wiederholung mit Suffix der ersten Person bringt den akuten Schmerz unmittelbar zum Ausdruck, ohne das im Hebräischen nicht ausdrücklich stehende »tut weh« zu ergänzen.
- source_word: וַיֹּאמֶר
  choice: Da sagte sein Vater
  rationale: »Da« bildet den erzählerischen Fortgang natürlich ab. Das explizite »sein Vater« klärt im Deutschen den im Hebräischen durch den Zusammenhang bestimmten Sprecher.
- source_word: אֶל הַנַּעַר
  choice: zu dem jungen Mann
  rationale: נַעַר kann einen Jungen, jungen Mann, Diener oder Begleiter bezeichnen. »Junger Mann« wahrt die Alters- und Geschlechtsangabe, ohne den sozialen Status vorschnell festzulegen.
- source_word: שָׂאֵהוּ
  choice: Trag ihn
  rationale: Der Imperativ von נשׂא bezeichnet hier das körperliche Tragen des Kindes und wird im Deutschen knapp und direkt wiedergegeben.
- source_word: אֶל אִמּוֹ
  choice: zu seiner Mutter
  rationale: Die einfache Verwandtschaftsbezeichnung wird in einem natürlichen, würdigen Erzählregister wiedergegeben.
