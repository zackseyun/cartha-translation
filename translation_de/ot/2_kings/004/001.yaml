id: 2KI.4.1
reference: 2 Kings 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: de
  text: 'Eine Frau aus dem Kreis der Frauen der Prophetenschüler rief zu Elisa: »Dein Diener, mein Mann, ist gestorben. Du weißt, dass dein Diener Jahwe fürchtete. Nun ist der Gläubiger gekommen, um meine beiden Kinder[a] als Sklaven für sich zu nehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meine beiden Söhne. Das hebräische Wort bedeutet wörtlich „Kinder“; der Zusammenhang kann hier insbesondere Söhne meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: Eine Frau
  rationale: Leitet eine neue Begebenheit mit einer unbestimmten Person ein. Das deutsche „Eine Frau“ ist natürlich und bewahrt die Unbestimmtheit; das anlautende וְ verlangt hier kein ausdrückliches „und“ oder „nun“.
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: aus dem Kreis der Frauen der Prophetenschüler
  rationale: בְנֵי הַנְּבִיאִים bezeichnet keine leiblichen Prophetensöhne, sondern Angehörige einer prophetischen Gemeinschaft. „Prophetenschüler“ gibt diese soziale Bezeichnung im Deutschen verständlich wieder, während „aus dem Kreis der Frauen“ die Gruppenzugehörigkeit wahrt, ohne vorzeitig „Witwe“ einzusetzen.
- source_word: צָעֲקָה אֶל
  choice: rief zu
  rationale: „Rief zu“ bewahrt die Dringlichkeit des Hilferufs und gibt zugleich die Zielrichtung zu Elisa wieder.
- source_word: עַבְדְּךָ אִישִׁי
  choice: Dein Diener, mein Mann
  rationale: 'Beide Beziehungen bleiben in der hebräischen Reihenfolge ausdrücklich erhalten: der Verstorbene gehörte zu Elisas prophetischem Umfeld und war der Ehemann der Sprecherin.'
- source_word: מֵת
  choice: ist gestorben
  rationale: Das Perfekt bezeichnet das abgeschlossene Sterben mit fortdauernden Folgen und klingt in deutscher direkter Rede natürlich.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: Jahwe fürchtete
  rationale: „Jahwe fürchten“ bewahrt die gewichtige biblische Wendung, die ehrfürchtige Gottesbindung bezeichnet, ohne sie auf bloße Angst oder allgemeinere Verehrung zu reduzieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַנֹּשֶׁה
  choice: der Gläubiger
  rationale: Bezeichnet unmittelbar denjenigen, dem die Schuld zusteht; „Gläubiger“ ist im Deutschen der sachlich passende und allgemein verständliche Ausdruck.
- source_word: בָּא לָקַחַת
  choice: ist gekommen, um … zu nehmen
  rationale: Gibt das vollendete Kommen und dessen gegenwärtig bedrohlichen Zweck wieder.
- source_word: שְׁנֵי יְלָדַי
  choice: meine beiden Kinder
  rationale: יְלָדַי bezeichnet hier wörtlich die Kinder der Frau, ohne ihr Geschlecht ausdrücklich festzulegen. „Kinder“ erhält diese Offenheit.
- source_word: לוֹ לַעֲבָדִים
  choice: als Sklaven für sich
  rationale: Der Ausdruck bezeichnet die Aneignung zu persönlicher Schuldsklaverei. „Sklaven“ bildet die rechtliche und soziale Härte deutlicher ab als das im heutigen Deutsch möglicherweise zu milde „Diener“; „für sich“ gibt לוֹ wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ wahrt den persönlichen Gottesnamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von „Jahwe fürchten“
  choice: die traditionelle Wendung unverändert bewahren
  alternative: Jahwe verehren
  rationale: Die hebräische Formulierung kann Ehrfurcht, Gehorsam und Gottesbindung einschließen. „Fürchten“ hält diese theologische Spannweite offen, während „verehren“ sie verengen könnte.
- issue: Status der Kinder beim Gläubiger
  choice: Sklaven
  alternative: Diener
  rationale: עֲבָדִים kann Diener oder Sklaven bezeichnen. Im Zusammenhang einer zwangsweisen Inbesitznahme wegen Schulden ist „Sklaven“ sachlich näher und lässt die Härte der drohenden Schuldsklaverei sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und gut verständlich. „Prophetenschüler“ vermeidet das im Deutschen leicht missverständliche wörtliche „Söhne der Propheten“; „Sklaven“ macht die erzwungene Schuldabhängigkeit deutlich.
