  terminology: „Elisa“, „Jahwe“, „Gläubiger“ und „Jahwe fürchten“ sind konsequent und sachgerecht wiedergegeben. „Prophetenschüler“ vermittelt verständlich, dass בני הנביאים eine prophetische Gemeinschaft und nicht biologische Söhne einzelner Propheten bezeichnet. Die Fußnote zu „Kinder/Söhne“ ist korrekt verankert und wahrt die lexikalische Alternative.
