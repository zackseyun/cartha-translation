  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und die wesentlichen Bedeutungen zuverlässig wieder: eine unbestimmte Frau aus dem sozialen Umfeld der בני הנביאים, ihr Hilferuf an Elisa, der Tod ihres Mannes, dessen Gottesfurcht sowie das Kommen des Gläubigers zur Inanspruchnahme der Kinder. „Kinder“ bewahrt die im hebräischen ילד enthaltene geschlechtliche Offenheit. „Sklaven“ ist im Kontext der zwangsweisen Schuldabhängigkeit für לעבדים vertretbar, ohne über den Text hinausgehende Einzelheiten zu behaupten.'
