source:
  edition: WLC
  text: וַ/יָּ֜שָׁב וַ/יֵּ֣לֶךְ בַּ/בַּ֗יִת אַחַ֥ת הֵ֨נָּה֙ וְ/אַחַ֣ת הֵ֔נָּה וַ/יַּ֖עַל וַ/יִּגְהַ֣ר עָלָ֑י/ו וַ/יְזוֹרֵ֤ר הַ/נַּ֨עַר֙ עַד שֶׁ֣בַע פְּעָמִ֔ים וַ/יִּפְקַ֥ח הַ/נַּ֖עַר אֶת עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: de
  text: Dann kehrte er zurück und ging im Haus hin und her[a]. Danach ging er hinauf und beugte sich über ihn[b]. Der Junge nieste siebenmal und öffnete die Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einmal hierhin und einmal dorthin“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „streckte sich über ihm aus“. Das hebräische Verb bezeichnet ein Sich-Beugen oder Sich-Neigen über jemanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Dann kehrte er zurück
  rationale: שׁוּב bezeichnet hier die Rückkehr Elisas; „Dann“ gibt die fortschreitende Erzählfolge des Wayyiqtol im modernen Deutschen natürlich wieder.
- source_word: וַיֵּלֶךְ בַּבַּיִת אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: ging im Haus hin und her
  rationale: Die Wendung beschreibt Bewegung innerhalb des Hauses in die eine und die andere Richtung. „Hin und her“ ist die natürliche deutsche Entsprechung; die konkrete hebräische Ausdrucksweise bleibt in der Fußnote sichtbar.
- source_word: וַיַּעַל
  choice: Danach ging er hinauf
  rationale: עלה bewahrt die räumliche Bewegung nach oben, wahrscheinlich zu dem Raum beziehungsweise Lager, in dem der Junge lag, ohne dieses Ziel ausdrücklich in den Text einzutragen.
- source_word: וַיִּגְהַר עָלָיו
  choice: beugte sich über ihn
  rationale: גהר bezeichnet ein Sich-Beugen oder Sich-Neigen über jemanden. Diese Wiedergabe ist quellenah und vermeidet die stärkere kontextuelle Deutung, Elisa habe sich vollständig über dem Jungen ausgestreckt.
- source_word: וַיְזוֹרֵר
  choice: nieste
  rationale: Das seltene Verb wird traditionell und lexikalisch als „niesen“ verstanden; die Angabe der sieben Wiederholungen stützt diese Bedeutung.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר bezeichnet hier den Sohn der Schunemiterin. „Der Junge“ ist im Kontext eindeutig und im modernen Deutsch natürlich.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Obwohl עַד grundsätzlich „bis (zu)“ bedeuten kann, bezeichnet die Verbindung hier die vollendete Zahl der Vorgänge.
- source_word: וַיִּפְקַח הַנַּעַר אֶת עֵינָיו
  choice: öffnete die Augen
  rationale: פקח עיניים ist die übliche Wendung für das Öffnen der Augen; die deutsche Formulierung ist idiomatisch und vollständig.
theological_decisions:
- issue: Art von Elisas körperlicher Handlung über dem Jungen
  choice: Die Handlung wird beschreibend als „beugte sich über ihn“ wiedergegeben.
  alternative: „streckte sich über ihm aus“ beziehungsweise kontextuell „legte sich wieder auf ihn“
  rationale: Der hebräische Text berichtet Elisas Körperhaltung, erklärt aber nicht, wie sie mit der Wiederbelebung zusammenhängt. Die Übersetzung vermeidet daher sowohl eine magische oder sakramentale Deutung als auch eine über den Wortlaut hinausgehende Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die idiomatische Wendung „hin und her“ erleichtert das Verständnis; die wörtlichere hebräische Bildsprache wird in der Fußnote bewahrt. Kurze Hauptsätze entsprechen dem knappen Erzählstil des Ausgangstextes.
