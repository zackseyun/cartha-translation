  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: de
  text: Als Elisa ins Haus kam, lag der Junge tot auf seinem Bett.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lag hingelegt auf seinem Bett“; das hebräische Partizip kann den Zustand eines dort hingelegten oder ausgestreckt liegenden Kindes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam … ins
  rationale: Das Wayyiqtol führt die Erzählung mit einfachem Vergangenheitsbezug fort; zusammen mit dem direktionalen ה an הַבָּיְתָה gibt „kam … ins Haus“ die Bewegung in das Gebäude natürlich wieder.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Im Deutschen geläufige biblische Namensform.
- source_word: הַבָּיְתָה
  choice: ins Haus
  rationale: Das direktionale ה bezeichnet die Bewegung zum beziehungsweise in das Haus; „ins Haus“ bildet dies knapp und idiomatisch ab.
- source_word: וְהִנֵּה
  choice: 'sah er:'
  rationale: הִנֵּה lenkt die Aufmerksamkeit lebhaft auf die nun wahrgenommene Szene. Im modernen deutschen Erzählstil vermittelt „sah er:“ diese präsentierende Funktion natürlicher als das altertümliche „siehe“.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר bezeichnet hier den Sohn der Schunemiterin; „Junge“ ist kontextgerecht und allgemein verständlich.
- source_word: מֵת
  choice: war tot
  rationale: Die Form beschreibt den Zustand des Jungen bei Elisas Ankunft, nicht vorrangig den vorausgegangenen Vorgang des Sterbens.
- source_word: מֻשְׁכָּב
  choice: lag
  rationale: Das passive Partizip bezeichnet den Jungen als hingelegt beziehungsweise daliegend. „lag“ ist im Deutschen natürlich, lässt aber die passive Ergebnisnuance weniger ausdrücklich erkennen; diese wird in der Fußnote bewahrt.
- source_word: עַל מִטָּתוֹ
  choice: auf seinem Bett
  rationale: Direkte und idiomatische Wiedergabe der Präpositionalverbindung mit Possessivsuffix.
