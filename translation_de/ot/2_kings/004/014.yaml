base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/014.yaml
  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: de
  text: 'Da sagte er: »Was soll man nun für sie tun?[a]« Gehasi sagte: »Nun, sie hat keinen Sohn[b], und ihr Mann ist alt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was ist nun für sie zu tun?«'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »Für sie gibt es keinen Sohn.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte er“ gibt die zeitlich-folgernde Verbindung im Deutschen natürlich wieder.
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  choice: Was soll man nun für sie tun?
  rationale: Die Verbindung aus Fragewort und Infinitiv fragt danach, was zu ihren Gunsten getan werden soll. Das unpersönliche „man“ ist im Deutschen natürlich; „nun“ nimmt den fortschreitenden Gesprächsgang auf.
- source_word: גֵּיחֲזִי
  choice: Gehasi
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֲבָל
  choice: Nun
  rationale: Die Partikel leitet hier Gehasis bedachte Feststellung ein und bezeichnet keinen scharfen Gegensatz; „Nun“ bewahrt den gesprächsnahen Ton.
- source_word: בֵּן אֵין לָהּ
  choice: sie hat keinen Sohn
  rationale: Die hebräische Existenzkonstruktion wird als natürliche deutsche Besitzkonstruktion wiedergegeben; בֵּן bezeichnet ausdrücklich einen Sohn.
- source_word: וְאִישָׁהּ זָקֵן
  choice: und ihr Mann ist alt
  rationale: אִישׁ mit dem Suffix bezeichnet in diesem Zusammenhang ihren Ehemann; זָקֵן beschreibt direkt sein hohes Alter.
