  text: וַ/יֹּ֨אמֶר֙ אֶל גֵּחֲזִ֣י נַעֲר֔/וֹ קְרָ֖א לַ/שּׁוּנַמִּ֣ית הַ/זֹּ֑את וַ/יִּקְרָא לָ֔/הּ וַֽ/תַּעֲמֹ֖ד לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: de
  text: 'Dann sagte er zu seinem Diener Gehasi: „Ruf diese Schunemiterin.“ Da rief er sie, und sie stand vor ihm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte er
  rationale: Das narrative Waw führt die Handlung weiter; „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: גֵּחֲזִי נַעֲרוֹ
  choice: zu seinem Diener Gehasi
  rationale: נַעַר kann einen jungen Mann oder einen Diener beziehungsweise Begleiter bezeichnen. Hier steht Gehasis Dienstfunktion gegenüber Elisa im Vordergrund.
- source_word: קְרָא
  choice: Ruf
  rationale: קרא bezeichnet hier das Herbeirufen einer Person. „Ruf“ ist direkt und bewahrt die Wiederholung des Verbs im folgenden Satz.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: diese Schunemiterin
  rationale: Die substantivierte Herkunftsbezeichnung benennt die Frau als aus Schunem stammend; „diese“ bildet הַזֹּאת unmittelbar ab.
- source_word: וַיִּקְרָא לָהּ
  choice: Da rief er sie
  rationale: Die Wiedergabe wiederholt wie das Hebräische dasselbe Verb und führt die Erzählung als Reaktion auf den Auftrag weiter.
- source_word: וַתַּעֲמֹד לְפָנָיו
  choice: und sie trat vor ihn
  rationale: עמד bedeutet wörtlich „stehen“ oder „sich hinstellen“. In Verbindung mit לְפָנָיו bezeichnet die Wendung hier natürlich das Sich-vor-jemanden-Stellen; „trat vor ihn“ ist im Deutschen idiomatisch, ohne einen darüber hinausgehenden Vorgang einzuführen.
