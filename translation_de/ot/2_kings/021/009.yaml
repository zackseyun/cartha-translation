  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּתְעֵ֤/ם מְנַשֶּׁה֙ לַ/עֲשׂ֣וֹת אֶת הָ/רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: de
  text: Doch sie hörten nicht darauf, und Manasse führte sie in die Irre, sodass sie mehr Böses taten als die Völker[a], die Jahwe vor den Israeliten[b] vernichtet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „Böses zu tun, mehr als die Völker.“ Der hebräische Vergleich wird mit „von/als die Völker“ ausgedrückt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: hörten nicht darauf
  rationale: שׁמע umfasst hier nicht nur das akustische Hören, sondern auch die ausbleibende willige Reaktion. „Darauf hören“ bewahrt im Deutschen beide Aspekte, ohne ausdrücklich „gehorchen“ festzulegen.
- source_word: וַיַּתְעֵם
  choice: führte sie in die Irre
  rationale: Die Kausativform von תעה bezeichnet, dass Manasse das Volk moralisch und geistlich auf einen Irrweg brachte.
- source_word: לַעֲשׂוֹת אֶת הָרָע מִן הַגּוֹיִם
  choice: sodass sie mehr Böses taten als die Völker
  rationale: Das לְ mit Infinitiv drückt hier die Folge beziehungsweise das bewirkte Handeln aus. Das folgende מִן ist komparativ; im natürlichen Deutschen muss der Vergleich durch „mehr … als“ verdeutlicht werden.
- source_word: הִשְׁמִיד
  choice: vernichtet hatte
  rationale: Das Verb bezeichnet eine vollständige oder weitreichende Zerstörung. Das Plusquamperfekt macht deutlich, dass dieses Handeln Jahwes zeitlich vor der Herrschaft Manasses lag.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in seiner gebräuchlichen deutschen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִפְּנֵי
  choice: vor
  rationale: In diesem Zusammenhang bezeichnet die Wendung, dass Jahwe die Völker vor Israel beziehungsweise aus dessen Weg beseitigte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet wörtlich „Söhne Israels“, wird im modernen Deutschen aber natürlich und sachlich genau mit „Israeliten“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Reichweite des Vergleichs mit den Völkern
  choice: mehr Böses taten als die Völker
  alternative: Böses taten, mehr als die Völker
  rationale: Die hebräische Konstruktion ist knapp und setzt „das Böse tun“ durch מִן in Vergleich zu den Völkern. Die gewählte Fassung gibt den naheliegenden Gradvergleich wieder; die Fußnote bewahrt die formnähere Alternative, ohne die Spannung aufzulösen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die Wendung bezeichnet das gesamte Bundesvolk und nicht ausschließlich männliche Einzelpersonen. Die idiomatische Volksbezeichnung vermeidet im Deutschen ein mögliches Missverständnis; die wörtliche Form wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darauf hören“ hält die Bedeutung zwischen Hören und Gehorchen offen; „führte sie in die Irre“ gibt die aktive Verführung durch Manasse idiomatisch wieder. Die Vergleichskonstruktion ist im Haupttext verständlich entfaltet und in der Fußnote formnäher dokumentiert.
