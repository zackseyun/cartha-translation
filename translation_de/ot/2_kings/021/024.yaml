source:
  edition: WLC
  text: וַ/יַּךְ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: de
  text: Doch das Volk des Landes erschlug alle, die sich gegen König Amon verschworen hatten, und das Volk des Landes machte seinen Sohn Josia an seiner Stelle zum König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: erschlug
  rationale: נכה bezeichnet hier angesichts der Vergeltung an den Verschwörern ein tödliches Niederschlagen. „Erschlug“ ist prägnant und gibt die gewaltsame Handlung wieder.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die relativ formale Wiedergabe bewahrt den hebräischen Ausdruck für eine gesellschaftlich-politische Gruppe; seine Wiederholung bleibt wie im Ausgangstext erhalten.
- source_word: כָּל הַקֹּשְׁרִים
  choice: alle, die sich … verschworen hatten
  rationale: Das Partizip von קשר bezeichnet die an der Verschwörung beteiligten Personen. Die verbale Formulierung ist im Deutschen natürlich und stellt den vorausgegangenen Vorgang klar dar.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: gegen König Amon
  rationale: עַל bezeichnet zusammen mit קשר die feindliche Ausrichtung der Verschwörung gegen Amon.
- source_word: וַיַּמְלִיכוּ
  choice: machte … zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen. Die gewählte Form vermeidet die im Hebräischen nicht ausdrücklich genannte Vorstellung einer Krönungszeremonie.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: seinen Sohn Josia
  rationale: Die deutsche Wortfolge benennt das Verwandtschaftsverhältnis eindeutig und idiomatisch; das Possessivpronomen bezieht sich auf Amon.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Der Ausdruck bezeichnet Josias Nachfolge in Amons königlicher Stellung.
- source_word: וַ
  choice: Doch
  rationale: Das einleitende Waw führt die Reaktion des Volkes als Kontrast zur im vorherigen Vers berichteten Ermordung Amons durch seine Diener ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Der wiederholte Ausdruck „das Volk des Landes“ bleibt bewusst erhalten; „Doch“ macht den erzählerischen Gegensatz zum vorausgehenden Vers sichtbar.
