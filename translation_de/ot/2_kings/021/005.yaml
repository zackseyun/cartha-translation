source:
  edition: WLC
  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: de
  text: Er baute Altäre für das ganze Heer des Himmels in den beiden Vorhöfen des Hauses Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das gesamte Himmelsheer“. Die hebräische Wendung „Heer des Himmels“ bezeichnet die himmlische Schar und meint in diesem Zusammenhang wahrscheinlich Himmelskörper oder Mächte, die in der Gestirnsverehrung verehrt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Das Qal-Wayyiqtol von בנה bezeichnet in der fortlaufenden Erzählung schlicht den Bau; die einleitende Konjunktion bleibt für natürliches modernes Deutsch unausgedrückt.
- source_word: מִזְבְּחוֹת
  choice: Altäre
  rationale: Die gewöhnliche Pluralbedeutung wird direkt und ohne Erweiterung wiedergegeben.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: für das ganze Heer des Himmels
  rationale: Die Wiedergabe bewahrt die hebräische Wendung und ihre mögliche Bezugnahme auf Himmelskörper oder himmlische Mächte, ohne sie vorschnell auf Sterne zu verengen.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: in den beiden Vorhöfen
  rationale: שְׁתֵּי nennt ausdrücklich zwei; „Vorhöfe“ ist im Tempelzusammenhang eine natürliche und konkrete Wiedergabe von חצרות.
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: „Haus“ bewahrt die hebräische Tempelbezeichnung, während der Gottesname יְהוָה als „Jahwe“ wiedergegeben wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Deutung von צְבָא הַשָּׁמַיִם
  choice: Heer des Himmels
  alternative: Himmelskörper / Sterne des Himmels
  rationale: Die idiomnahe Formulierung erhält die Bedeutungsbreite zwischen Gestirnen und vorgestellten himmlischen Mächten im Zusammenhang astraler Verehrung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; nah am hebräischen Satzbau, aber idiomatisch. „Vorhöfe“ verdeutlicht den Tempelkontext, und „Heer des Himmels“ bewahrt die sachlich-theologische Mehrdeutigkeit.
