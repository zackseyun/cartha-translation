base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: de
  text: weil sie getan haben, was in meinen Augen böse ist, und mich immer wieder zum Zorn gereizt haben von dem Tag an, als ihre Väter[a] aus Ägypten auszogen, bis zu diesem Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Vorfahren«. Im Hebräischen steht »ihre Väter«, ein maskuliner Verwandtschaftsausdruck für frühere Generationen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet den Grund für das zuvor angekündigte Gericht ein; „weil“ ist im modernen Deutschen der natürliche kausale Anschluss.
- source_word: עָשׂוּ אֶת־הָרַע
  choice: sie getan haben, was böse ist
  rationale: Die idiomatische Wendung bezeichnet ein Tun, das als böse bewertet wird. Der Nebensatz gibt sie natürlich wieder und bewahrt den Bezug zur fortdauernden Begründung.
- source_word: בְּעֵינַי
  choice: in meinen Augen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild und kennzeichnet Gottes Bewertung.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: und mich immer wieder zum Zorn gereizt haben
  rationale: היה mit Partizip beschreibt hier ein fortdauerndes beziehungsweise wiederholtes Verhalten. „Immer wieder“ macht diesen durativen Zug deutlich; „zum Zorn reizen“ gibt den kausativen Sinn von כעס wieder.
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: von dem Tag an, als
  rationale: Die Formulierung markiert den Ausgangspunkt eines bis in die Gegenwart reichenden Verhaltens.
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: ihre Väter aus Ägypten auszogen
  rationale: „Ausziehen“ ist die im Deutschen etablierte Wiedergabe des Exodusverbs יצא; „ihre Väter“ wahrt den maskulinen Verwandtschaftsausdruck des Hebräischen.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: bis zu diesem Tag
  rationale: Die Formulierung erhält den zeitlichen Endpunkt und den Gedanken eines bis in die Gegenwart anhaltenden Musters.
theological_decisions:
- issue: Korporative geschichtliche Kontinuität der Schuld Israels seit der Exodusgeneration
  choice: Der geschichtlich-korporative Rahmen bleibt erhalten und wird nicht auf das Fehlverhalten einzelner jüngerer Könige eingeengt.
  alternative: Die Aussage lediglich als rhetorische Zusammenfassung der Sünden der jüngsten Generationen verstehen.
  rationale: Der Vers führt die fortgesetzte Provokation ausdrücklich bis zum Auszug der früheren Generationen zurück und beschreibt damit eine geschichtliche Kontinuität der Auflehnung, ohne diese weiter dogmatisch auszudeuten.
- issue: Wiedergabe von אֲבוֹתָם
  choice: ihre Väter
  alternative: ihre Vorfahren
  rationale: Der hebräische Ausdruck ist ein maskuliner Verwandtschaftsbegriff für frühere Generationen. Der Haupttext bewahrt diese Form; eine Fußnote nennt die im Kontext mögliche umfassendere Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als kausaler Anschluss an den vorangehenden Urteilsspruch formuliert. Die Wiederholung beziehungsweise Dauer des Provozierens wird idiomatisch mit „immer wieder“ ausgedrückt; das Exodusmotiv bleibt durch „aus Ägypten auszogen“ deutlich.
