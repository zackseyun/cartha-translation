  source_fidelity: 'Die Übersetzung gibt den hebräischen Satz zuverlässig wieder: וַיִּקְשְׁרוּ ist mit „verschworen sich“ in seinem politischen Sinn treffend erfasst; „gegen ihn“ entspricht עָלָיו. „Amons Diener“ bewahrt die Bezeichnung עַבְדֵי אָמוֹן ohne über die soziale Stellung zu entscheiden. „töteten den König“ gibt den Hifil von מות angemessen wieder, und „in seinem Haus“ entspricht בְּבֵיתוֹ ohne eine im Hebräischen nicht ausdrücklich vorhandene Verstärkung wie „eigenen“ hinzuzufügen.'
