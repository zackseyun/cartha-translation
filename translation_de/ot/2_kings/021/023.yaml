  text: וַ/יִּקְשְׁר֥וּ עַבְדֵֽי אָמ֖וֹן עָלָ֑י/ו וַ/יָּמִ֥יתוּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/023.yaml
  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: de
  text: Amons Diener verschworen sich gegen ihn und töteten den König in seinem Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schmiedeten eine Verschwörung gegen ihn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: verschworen sich
  rationale: קשר bezeichnet im politischen Zusammenhang das Bilden einer Verschwörung. Das reflexive „sich verschwören“ ist im Deutschen präzise und idiomatisch.
- source_word: עַבְדֵי אָמוֹן
  choice: Amons Diener
  rationale: עֲבָדִים bezeichnet hier Angehörige des königlichen Dienstes oder Hofes. „Diener“ bewahrt die Grundbedeutung, ohne sie stärker deutend als „Beamte“ oder „Hofleute“ festzulegen.
- source_word: עָלָיו
  choice: gegen ihn
  rationale: Bei einer Verschwörung bezeichnet עַל die Person, gegen die sie gerichtet ist; das Pronomen verweist eindeutig auf Amon.
- source_word: וַיָּמִיתוּ
  choice: töteten
  rationale: Der Hifil von מות bedeutet „zu Tode bringen“. „Töteten“ gibt die kausative Bedeutung im Deutschen knapp und natürlich wieder.
- source_word: אֶת־הַמֶּלֶךְ
  choice: den König
  rationale: Der hebräische Text verwendet den Titel und nicht erneut den Namen; dies wird formal bewahrt.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: 'Die Präposition בְּ mit בֵּית und dem Suffix der dritten Person Singular bezeichnet den Ort: „in seinem Haus“. Ein verstärkendes „eigenen“ steht nicht ausdrücklich im Hebräischen.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise des Hebräischen und die Wiederaufnahme Amons durch den Titel „der König“ bleiben erhalten.
