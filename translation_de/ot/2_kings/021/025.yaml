source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Die übrigen Taten Amons, die er getan hat – sind sie nicht im Buch[b] der Chronik der Könige von Juda aufgezeichnet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Mit »Buch« ist ein antikes Schriftstück gemeint, wahrscheinlich eine Schriftrolle. Die ganze Bezeichnung kann auch mit »die Annalen der Könige von Juda« wiedergegeben werden.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Die übrigen
  rationale: יֶתֶר bezeichnet den Rest beziehungsweise das Übrige. Das vorangestellte וְ hat hier verbindende und formelhafte Funktion; ein zusätzliches zeitliches »Nun« wäre nicht ausdrücklich im Ausgangstext verankert.
- source_word: דִּבְרֵי
  choice: Taten
  rationale: דְּבָרִים bedeutet wörtlich »Worte«, »Dinge« oder »Angelegenheiten«; in dieser königlichen Schlussformel bezeichnet es die überlieferten Taten beziehungsweise Regierungsvorgänge des Königs.
- source_word: אָמ֖וֹן
  choice: Amon
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֲשֶׁר עָשָׂה
  choice: alles, was er getan hat
  rationale: Die Relativkonstruktion erläutert den Inhalt der genannten Taten. »Alles« macht im Deutschen den zusammenfassenden Bezug natürlich, ohne eine bestimmte einzelne Tat hervorzuheben.
- source_word: הֲלֹא
  choice: sind sie nicht
  rationale: Die Verbindung aus Fragepartikel und Verneinung bildet eine rhetorische Frage, die eine bejahende Antwort erwartet. Die Frageform bleibt erhalten.
- source_word: הֵם כְּתוּבִים
  choice: sind sie ... aufgeschrieben
  rationale: Das passive Partizip bedeutet »geschrieben«. »Aufgeschrieben« ist im Zusammenhang eines historischen Verzeichnisses natürlich und bewahrt den konkreten Schreibbezug.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Wörtlich steht »auf einem Buch/einer Schriftrolle«; für den Inhalt eines Schriftwerks ist im Deutschen »im Buch« idiomatisch.
- source_word: דִּבְרֵי הַיָּמִים
  choice: der Chronik
  rationale: Die Wendung bedeutet wörtlich etwa »Begebenheiten der Tage« und bezeichnet hier eine annalistische Chronik. Der Singular »Chronik« ergibt mit »Buch« einen natürlichen deutschen Titel.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Das לְ drückt in diesem Werktitel Zugehörigkeit beziehungsweise Bezug aus; »der Könige von Juda« ist die idiomatische deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte rhetorische Frage und die erläuternde Wiederaufnahme »alles, was er getan hat« bleiben erhalten; der Gedankenstrich macht die Satzstruktur für heutige Leser verständlich.
