  terminology: „Jahwe“ ist konsequent und korrekt für יְהוָה. „Haus Jahwes“ bewahrt die Quellsprache; „Tempel Jahwes“ ist passend als Fußnotenalternative. Die Fußnote zum Namen-Idioms erläutert ihn, ohne Gottes Gegenwart oder eine bestimmte theologische Deutung in den Haupttext einzutragen.
