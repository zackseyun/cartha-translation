  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: de
  text: 'Er baute Altäre im Haus Jahwes[a], über das Jahwe gesagt hatte: „In Jerusalem werde ich meinen Namen setzen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel Jahwes“. Wörtlich: „im Haus Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „meinen Namen setzen“ bezeichnet Jerusalem als den von Jahwe erwählten Ort, mit dem er seinen Namen verbindet.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָה
  choice: Er baute
  rationale: Das Qal-Verb in der Erzählfolge bezeichnet Manasses nächste Handlung. Im Deutschen ist die Wiedergabe ohne einleitendes „Und“ natürlich und inhaltlich vollständig.
- source_word: מִזְבְּחֹת
  choice: Altäre
  rationale: Der Plural von מִזְבֵּחַ ist die übliche Bezeichnung für Opferaltäre.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die Formulierung bewahrt das hebräische Bild „Haus Jahwes“; gemeint ist der Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: von dem Jahwe gesagt hatte
  rationale: Der Relativsatz bezieht sich grammatisch auf das Haus Jahwes. Das Plusquamperfekt macht deutlich, dass die göttliche Aussage der beschriebenen Handlung vorausging.
- source_word: בִּירוּשָׁלִַם
  choice: In Jerusalem
  rationale: Die Präposition bezeichnet den Ort; die Voranstellung entspricht der Hervorhebung im Hebräischen.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: will ich meinen Namen wohnen lassen
  rationale: שׂים bedeutet wörtlich „setzen/stellen/legen“. In Verbindung mit Gottes Namen und dem Tempel drückt die Wendung aus, dass Gott seinen Namen dort verankert beziehungsweise wohnen lässt. Die idiomatische Wiedergabe wahrt die kultisch-theologische Bedeutung, ohne sie mit „Gegenwart“ gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigenname, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Tempeltheologie in אָשִׂים אֶת שְׁמִי
  choice: meinen Namen wohnen lassen
  alternative: meinen Namen setzen
  rationale: Die gewählte Formulierung gibt die besondere Verbindung des Namens mit dem erwählten Ort verständlich wieder, ohne daraus ausdrücklich eine Gleichsetzung mit Gottes Gegenwart oder eine umfassende Wohnaussage über Gott selbst zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus Jahwes“ bewahrt das zentrale hebräische Bild; die Fußnote erläutert die geläufige sachliche Wiedergabe „Tempel“. Die Satzstruktur bleibt klar und erzählerisch knapp.
