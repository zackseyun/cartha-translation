  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הָ/אֲשֵׁרָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה בַּ/בַּ֗יִת אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ אֶל דָּוִד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: de
  text: 'Er stellte das Schnitzbild der Aschera[a], das er angefertigt hatte, in das Haus, von dem Jahwe zu David und zu dessen Sohn Salomo gesagt hatte: „In diesem Haus und in Jerusalem, das ich aus allen Stämmen Israels erwählt habe, werde ich meinen Namen für immer dort niederlegen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ascherabild“. Das Hebräische verbindet „Schnitzbild“ mit „Aschera“ und bezeichnet damit ein Bild, das Aschera darstellte oder ihr zugeordnet war. „Ascherapfahl“ ist hier weniger genau, weil ausdrücklich von einem Schnitzbild die Rede ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Er stellte
  rationale: שׂים bezeichnet hier das Aufstellen beziehungsweise Platzieren des Kultbildes. „Stellte“ ist im Deutschen natürlich und konkret.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: das Schnitzbild der Aschera
  rationale: פֶּסֶל bezeichnet ein geschnitztes oder gemeißeltes Bild; zusammen mit אֲשֵׁרָה ist ein Bild gemeint, das Aschera darstellt oder ihr zugeordnet ist. Die Wiedergabe vermeidet die hier zu enge Festlegung auf einen bloßen Kultpfahl.
- source_word: אֲשֶׁר עָשָׂה
  choice: das er angefertigt hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass die Herstellung dem Aufstellen vorausging.
- source_word: בַּבַּיִת / בַּבַּיִת הַזֶּה
  choice: in das Haus / in diesem Haus
  rationale: „Haus“ bewahrt die Wiederholung des hebräischen בַּיִת und die traditionelle Bezeichnung des Heiligtums als Gottes Haus, ohne im ersten Vorkommen die Zielrichtung des deutschen Verbs zu vernachlässigen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als „Jahwe“ macht den im Hebräischen stehenden persönlichen Gottesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- source_word: וְאֶל שְׁלֹמֹה בְנוֹ
  choice: und zu dessen Sohn Salomo
  rationale: „Dessen“ verdeutlicht, dass Salomo als Sohn Davids bezeichnet wird, und vermeidet eine mögliche falsche Zuordnung des Pronomens.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: das ich aus allen Stämmen Israels erwählt habe
  rationale: Die Formulierung gibt die Auswahl aus der Gesamtheit der Stämme wieder und bewahrt den Bezug des Relativsatzes auf Jerusalem.
- source_word: אָשִׂים אֶת שְׁמִי לְעוֹלָם
  choice: werde ich meinen Namen für immer wohnen lassen
  rationale: Wörtlich steht „werde ich meinen Namen setzen“. „Meinen Namen wohnen lassen“ gibt die feste, dauerhafte Gegenwart des Namens im Heiligtum in natürlichem Deutsch wieder, ohne sie mit Gottes räumlicher Begrenzung gleichzusetzen.
theological_decisions:
- issue: Art des mit Aschera verbundenen Kultgegenstands
  choice: Schnitzbild der Aschera
  alternative: Ascherapfahl
  rationale: Da der Vers ausdrücklich פֶּסֶל („Schnitzbild“) verwendet, sollte die Übersetzung nicht ohne Weiteres einen Pfahl voraussetzen. Der Genitiv lässt offen, ob das Bild Aschera darstellte oder ihr kultisch zugeordnet war.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält einen Eigennamen. „Jahwe“ bewahrt diese Funktion; die traditionelle deutsche Ersatzlesung „der HERR“ bleibt eine mögliche Konvention, wird hier aber nicht in den Text eingesetzt.
- issue: Bedeutung der Formel „meinen Namen setzen“
  choice: meinen Namen wohnen lassen
  alternative: meinen Namen setzen
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet Gottes dauerhafte, offenbarte Gegenwart am erwählten Ort. Sie behauptet nicht, dass Gott selbst räumlich auf Tempel oder Stadt begrenzt sei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus“ erhält die bewusste hebräische Wiederholung für den Tempel; „dessen Sohn Salomo“ verhindert eine unklare Pronomenzuordnung. Der Gottesname wird als „Jahwe“ wiedergegeben.
