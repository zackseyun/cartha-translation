source:
  edition: WLC
  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: de
  text: Und ich werde Israels Fuß nicht wieder aus dem Land fortwandern lassen, das ich seinen Vätern[a] gegeben habe – vorausgesetzt, sie achten darauf, nach allem zu handeln, was ich ihnen geboten habe, und nach der ganzen Weisung[b], die mein Diener Mose ihnen geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Vorfahren“. „Väter“ ist hier die bundesgeschichtliche Bezeichnung für Israels Vorfahren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem ganzen Gesetz“. Das hebräische Wort Tora bedeutet „Weisung“ und bezeichnet hier die durch Mose übermittelte Tora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: nicht wieder
  rationale: Die Verbindung von לֹא mit יסף bezeichnet hier das Ausbleiben einer erneuten Handlung; „nicht wieder“ gibt den hebräischen Ausdruck natürlich wieder.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: Israels Fuß … fortwandern lassen
  rationale: Die singularische Körperteilmetapher wird bewahrt; „fortwandern lassen“ macht zugleich den Zusammenhang der Vertreibung aus dem Land verständlich.
- source_word: הָאֲדָמָה
  choice: das Land
  rationale: Im Zusammenhang der den Vorfahren gegebenen Heimat ist die territoriale Bedeutung gemeint, nicht bloß Erdboden.
- source_word: נָתַתִּי לַאֲבוֹתָם
  choice: das ich seinen Vätern gegeben habe
  rationale: „Väter“ bewahrt die traditionelle bundesgeschichtliche Bezeichnung; das singularische Possessivpronomen nimmt das Kollektiv „Israel“ auf.
- source_word: רַק אִם
  choice: vorausgesetzt
  rationale: Die Formulierung gibt die ausschließende und reale Bedingung klar und idiomatisch wieder.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: sie achten darauf, … zu handeln
  rationale: שמר mit Infinitiv bezeichnet sorgfältiges Beachten mit dem Ziel des Tuns; die Übersetzung erhält sowohl Aufmerksamkeit als auch Gehorsam.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִם
  choice: nach allem zu handeln, was ich ihnen geboten habe
  rationale: „Nach“ bildet das Präfix כ als Maßstab der Übereinstimmung ab; „allem“ erhält den umfassenden Anspruch.
- source_word: וּלְכָל הַתּוֹרָה
  choice: und nach der ganzen Weisung
  rationale: תּוֹרָה bezeichnet hier die durch Mose vermittelte göttliche Weisung. „Weisung“ wahrt die lexikalische Breite, ohne den mosaischen Rechtsbezug auszublenden.
- source_word: עַבְדִּי מֹשֶׁה
  choice: mein Diener Mose
  rationale: Die Formulierung gibt die Ehrenbezeichnung unmittelbar und in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedingtheit von Israels ungestörtem Verbleib im Land
  choice: Die Zusage, Israel nicht erneut aus dem Land fortwandern zu lassen, steht unter der ausdrücklich formulierten Bedingung des Gehorsams.
  alternative: Die Bedingung als bloß rhetorisch abschwächen oder zugunsten einer vorbehaltlosen Landzusage auflösen.
  rationale: רַק אִם leitet eindeutig eine einschränkende Bedingung ein. Die Übersetzung bewahrt die Spannung zwischen Landzusage und gefordertem Bundesgehorsam.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Metapher „Israels Fuß … fortwandern lassen“ wurde wegen ihrer Anschaulichkeit und Quellennähe erhalten; eine Fußnote ist dafür nicht nötig, da der Satzkontext die gemeinte Vertreibung erkennen lässt. Der Gedankenstrich gliedert die lange Bedingung klar.
