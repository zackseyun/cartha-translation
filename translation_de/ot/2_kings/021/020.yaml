id: 2KI.21.20
reference: 2 Kings 21:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֥ה אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: de
  text: Er tat, was böse war in den Augen Jahwes,[a] genau wie sein Vater Manasse es getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »in den Augen Jahwes«; gemeint ist: nach Jahwes Urteil.'
    reason: Erläuterung der hebräischen Bewertungsformel
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Waw-Konsekutiv führt die Erzählung fort. Im natürlichen Deutschen kann das einleitende »und« entfallen; das Präteritum gibt die Erzählform angemessen wieder.
- source_word: הָרַע
  choice: was böse war
  rationale: Die Wendung עשה הרע bedeutet idiomatisch, das zu tun, was böse ist. Die Formulierung ist verständlich und berücksichtigt den bestimmten Artikel.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: 'Die hebräische Bewertungsformel wird bildgetreu und zugleich im Deutschen verständlich wiedergegeben: Gemeint ist, was nach Jahwes Urteil böse war.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Formulierung bringt den ausdrücklichen Vergleich mit dem Verhalten des Vaters natürlich zum Ausdruck.
- source_word: עָשָׂה
  choice: es getan hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Manasses Handeln dem erzählten Handeln seines Sohnes vorausging, ohne den Sinn zu erweitern.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: אָבִיו
  choice: sein Vater
  rationale: Dies entspricht unmittelbar dem Substantiv mit Suffix der dritten Person Singular.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt diesen als persönlichen Namen, während »der HERR« ihn durch einen traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und erzählerisch; die hebräische Bildsprache »in den Augen« wird bewahrt und in der Fußnote erläutert.
