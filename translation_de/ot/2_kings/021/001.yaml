base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: de
  text: Manasse war zwölf Jahre alt, als er König wurde, und regierte 55 Jahre lang in Jerusalem. Seine Mutter hieß Hefziba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hefziba bedeutet etwa: »An ihr habe ich Gefallen.«'
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: war zwölf Jahre alt
  rationale: Die hebräische Altersangabe wird in natürlichem modernem Deutsch wiedergegeben; die wörtliche Form „ein Sohn von zwölf Jahren“ wäre unidiomatisch.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet den Zeitpunkt seines Regierungsantritts. Diese Wiedergabe ist im Deutschen natürlicher als „als er zu regieren begann“ und bewahrt den Sinn der Königsformel.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: 55 Jahre lang
  rationale: Die koordinierte hebräische Zahlform wird als moderne deutsche Zahl wiedergegeben; „lang“ macht die Zeitdauer idiomatisch deutlich.
- source_word: מָלַךְ
  choice: regierte
  rationale: Im Kontext der Königsannalen bezeichnet das Verb die Ausübung der Königsherrschaft während des genannten Zeitraums.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Natürliche moderne deutsche Entsprechung der hebräischen Namensformel „Der Name seiner Mutter war“.
- source_word: חֶפְצִי בָהּ
  choice: Hefzi-Bah
  rationale: Der Eigenname wird nach verbreiteter deutscher Bibeltradition transliteriert; seine erkennbare hebräische Bedeutung wird in einer Fußnote erläutert.
