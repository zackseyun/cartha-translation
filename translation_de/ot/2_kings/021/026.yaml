base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/026.yaml
  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: de
  text: Man begrub ihn in seinem Grab im Garten Ussas, und sein Sohn Josia wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: Man begrub
  rationale: Die Verbform ist formal 3. Person Singular („er begrub“), doch ohne genannten Handlungsträger. Das unpersönliche deutsche „man“ gibt den kontextuell gemeinten Bestattungsvorgang natürlich wieder, ohne einen bestimmten Einzelnen einzuführen.
- source_word: קְבֻרָתוֹ
  choice: seinem Grab
  rationale: Das Substantiv bezeichnet hier die konkrete Grab- oder Begräbnisstätte. „Grab“ ist im Deutschen knapp, natürlich und sachlich passend.
- source_word: גַן עֻזָּא
  choice: im Garten Ussas
  rationale: Die hebräische Genitivverbindung wird idiomatisch und zugleich eng am Ausgangstext wiedergegeben. „Ussa“ folgt der im Deutschen gebräuchlichen Namensform.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: In der Thronfolgeformel bezeichnet das Verb den Regierungsantritt. „Wurde König“ drückt diesen Vorgang präziser aus als das auf die gesamte Regierungszeit deutende „regierte“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die Nachfolge beziehungsweise das Eintreten in die Stellung des Vorgängers und wird im Deutschen idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die unpersönliche Konstruktion „Man begrub ihn“ bewahrt, dass der hebräische Text keinen ausdrücklich benannten Bestattenden nennt, und klingt im Deutschen natürlicher als ein unbegründetes „er“.
