source:
  edition: WLC
  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: de
  text: Er ließ seinen Sohn durchs Feuer gehen[a], übte Wahrsagerei und deutete Vorzeichen[b]; auch befasste er sich mit Medien und Geisterbeschwörern[c]. Er tat sehr viel Böses in den Augen Jahwes und reizte ihn damit zum Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, ausdrücklicher: „Er opferte seinen Sohn im Feuer.“ Wörtlich lautet die hebräische Wendung: „Er ließ seinen Sohn durchs Feuer gehen.“'
    reason: alternative_reading
  - marker: b
    text: Das mit „deutete Vorzeichen“ wiedergegebene Verb kann allgemeiner auch „übte Wahrsagerei“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Wendung ist schwierig. Sie kann auch bedeuten: „Er zog Medien und Geisterbeschwörer zurate“ oder „Er setzte sie ein“. Die zugrunde liegenden Wörter können zudem die beschworenen Geister statt ihrer menschlichen Vermittler bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: Er ließ seinen Sohn durchs Feuer gehen
  rationale: Die hebräische Kausativform bedeutet wörtlich, dass er seinen Sohn durch das Feuer gehen ließ. Die Formulierung bezeichnet im Kontext einen Kindopferbrauch, ohne dessen genauen Vollzug ausdrücklich zu beschreiben; deshalb bleibt das Bild im Haupttext erhalten.
- source_word: וְעוֹנֵן
  choice: trieb Wahrsagerei
  rationale: Das Verb bezeichnet eine verbotene Form okkulter Zukunfts- oder Zeichendeutung. „Wahrsagerei treiben“ ist im modernen Deutschen verständlich und vermeidet eine unsichere etymologische Festlegung.
- source_word: וְנִחֵשׁ
  choice: deutete Vorzeichen
  rationale: נחש bezeichnet hier Wahrsagung, besonders anhand von Vorzeichen. Die konkrete Wiedergabe unterscheidet diese Tätigkeit von dem vorausgehenden עונן, ohne den Bedeutungsbereich zu verengen.
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: ließ sich mit Totenbeschwörern und Geisterkundigen ein
  rationale: Die Verbindung mit עשה ist ungewöhnlich und kann allgemein den Umgang mit, die Inanspruchnahme oder die Einsetzung solcher okkulten Personen bezeichnen. „ließ sich mit … ein“ bewahrt diese Breite. „Totenbeschwörer“ und „Geisterkundige“ geben die beiden schwer abzugrenzenden Begriffe verständlich wieder.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: Er tat sehr viel
  rationale: Die Verbindung von רבה im Hifil mit dem Infinitiv bezeichnet ein gesteigertes oder reichliches Tun. „tat sehr viel“ gibt diese Intensivierung natürlich wieder, ohne die im Deutschen unidiomatische Wendung „vermehrte zu tun“ nachzubilden.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: Böses in den Augen Jahwes
  rationale: Die substantivierte Form הָרַע wird als „Böses“ wiedergegeben; „in den Augen“ bewahrt die transparente hebräische Bewertungsmetapher. Der Gottesname יְהוָה erscheint gemäß Projektvorgabe als „Jahwe“.
- source_word: לְהַכְעִיס
  choice: und reizte ihn damit zum Zorn
  rationale: Der kausative Infinitiv kann Zweck oder Folge ausdrücken. Die koordinierte deutsche Fassung lässt die enge sachliche Folge erkennen, ohne einen ausschließlich beabsichtigten Zweck festzuschreiben.
theological_decisions:
- issue: Grad der Explizitheit beim Kindopferbrauch
  choice: Die hebräische Wendung „ließ seinen Sohn durchs Feuer gehen“ bleibt im Haupttext erhalten.
  alternative: „opferte seinen Sohn im Feuer“ oder „verbrannte seinen Sohn im Feuer“
  rationale: Der Zusammenhang weist stark auf ein Kindopfer hin, doch der hebräische Wortlaut beschreibt den Vorgang idiomatisch. Die Übersetzung bewahrt diese Spannung; die wahrscheinlich gemeinte Praxis wird in der Fußnote erklärt.
- issue: Deutung von אוֹב und יִדְּעֹנִים
  choice: 'Personenbezeichnungen: „Totenbeschwörer und Geisterkundige“'
  alternative: Geister beziehungsweise Totengeister oder „Medien und Spiritisten“
  rationale: Die Wörter können mit beschworenen Geistern oder mit den sie befragenden beziehungsweise beschwörenden Personen verbunden werden. Im vorliegenden Satz ist die personenbezogene Deutung gut möglich, aber die lexikalische Unsicherheit wird ausdrücklich vermerkt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration „Jahwe“ folgt der Projektentscheidung für das Tetragramm und macht den Eigennamen im deutschen Text sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt gut lesbar, während zentrale hebräische Bilder und Mehrdeutigkeiten erhalten bleiben. „Geisterkundige“ ist bewusst etwas gehoben, aber transparenter und weniger missverständlich als das im heutigen Deutsch mehrdeutige „Medien“.
