  text: וַ/יֵּ֕לֶךְ בְּ/כָל הַ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֣ךְ אָבִ֑י/ו וַֽ/יַּעֲבֹ֗ד אֶת הַ/גִּלֻּלִים֙ אֲשֶׁ֣ר עָבַ֣ד אָבִ֔י/ו וַ/יִּשְׁתַּ֖חוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: de
  text: Er folgte ganz dem Weg, den sein Vater gegangen war, und diente den Götzen[a], denen sein Vater gedient hatte, und warf sich vor ihnen nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist eine verächtliche Bezeichnung für Götzen; möglicherweise klingt darin „Mistgötzen“ an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: Er folgte ganz dem Weg, den sein Vater gegangen war
  rationale: Die Verbindung von הלך mit דרך beschreibt hier den Lebenswandel. „Dem Weg folgen“ bewahrt das Wegbild und klingt im modernen Deutschen natürlicher als „auf dem ganzen Weg gehen“.
- source_word: וַיַּעֲבֹד
  choice: und diente
  rationale: עבד bedeutet „dienen“ und bezeichnet hier kultische Verehrung. „Diente“ wahrt den Unterschied zum anschließenden Niederwerfen.
- source_word: הַגִּלֻּלִים
  choice: den Götzen
  rationale: גִּלֻּלִים ist eine verächtliche Bezeichnung für Götzenbilder. „Götzen“ gibt den Bezug und eine abwertende Färbung klar wieder; die besonders derbe mögliche Wortnuance wird in der Fußnote genannt.
- source_word: אֲשֶׁר עָבַד אָבִיו
  choice: denen sein Vater gedient hatte
  rationale: Die Wiederholung von „sein Vater“ und „dienen“ entspricht der betonten Wiederholung im Hebräischen.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: und warf sich vor ihnen nieder
  rationale: Die Form bezeichnet ehrfürchtiges Niederwerfen. Diese Wiedergabe bewahrt den körperlichen Vorgang und verschmilzt ihn nicht mit dem vorherigen „dienen“.
theological_decisions:
- issue: Wiedergabe der abwertenden Götzenbezeichnung גִּלֻּלִים
  choice: Götzen
  alternative: Mistgötzen; widerwärtige Götzen
  rationale: „Götzen“ ist eine klare, geläufige und bereits negativ gefärbte Wiedergabe. Die mögliche derbe Wortspielnuance des Hebräischen lässt sich im Haupttext nicht sicher und natürlich abbilden und wird daher in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Wegbild des Hebräischen sowie die lexikalische Unterscheidung zwischen kultischem Dienen und körperlichem Niederwerfen bleiben erhalten.
