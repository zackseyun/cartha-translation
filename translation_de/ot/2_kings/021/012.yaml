source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe, der Gott Israels: Siehe, ich bringe Unheil[a] über Jerusalem und Juda, sodass jedem, der davon hört, beide Ohren klingeln werden[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unglück“ beziehungsweise „Katastrophe“. Das hebräische Wort bezeichnet hier das Unheil des Gerichts, nicht moralisch Böses.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seine beiden Ohren werden klingeln“; ein hebräisches Bild für Schock und Entsetzen über eine Nachricht.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die folgende Ankündigung als Folge des zuvor geschilderten Handelns Manasses und gibt den schlussfolgernden Sinn knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen als im Deutschen gebräuchliche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כֹּה אָמַר
  choice: spricht
  rationale: Die geläufige deutsche Prophetenformel „so spricht“ wird hier zusammen mit „Darum“ zu „Darum spricht“ gestrafft, ohne ihren Charakter als göttliche Botschaftsformel zu verlieren.
- source_word: הִנְנִי מֵבִיא
  choice: Seht, ich bringe
  rationale: „Seht“ bewahrt den aufmerksamkeitslenkenden und nachdrücklichen Gehalt von הִנְנִי; das Präsens mit „ich bringe“ gibt die unmittelbar bevorstehende Handlung des hebräischen Partizips anschaulich wieder.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Zusammenhang des göttlichen Gerichts bezeichnet das Wort eine verheerende Heimsuchung und nicht moralische Bosheit. „Unheil“ ist im Deutschen prägnant und kontextgemäß.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: über Jerusalem und Juda
  rationale: „Unheil über jemanden bringen“ ist eine natürliche deutsche Verbindung und gibt עַל in diesem Gerichtskontext angemessen wieder.
- source_word: אֲשֶׁר
  choice: sodass
  rationale: Leitet hier die erschütternde Folge des angekündigten Unheils ein.
- source_word: כָּל שֹׁמְעָיו
  choice: jedem, der davon hört
  rationale: Der Singular „jedem“ entspricht dem singularischen Possessivsuffix des folgenden Ausdrucks; „davon“ bezieht sich natürlich auf das angekündigte Unheil beziehungsweise die Nachricht darüber.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: beide Ohren gellen werden
  rationale: Bewahrt das anschauliche hebräische Idiom, das den Schock und das Entsetzen über die Nachricht ausdrückt; „die Ohren gellen“ ist eine verständliche deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung von רָעָה beim göttlichen Gericht
  choice: Unheil
  alternative: Böses
  rationale: Der unmittelbare Zusammenhang beschreibt eine von Gott angekündigte Gerichtskatastrophe, nicht moralisches Böses. „Unheil“ erhält den Gerichtssinn, ohne eine darüber hinausgehende dogmatische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der vertrauten prophetischen Sprechweise. „Seht“ erhält den Nachdruck des hebräischen Hinweissignals; „die Ohren gellen“ bewahrt das eindringliche Bild, während die Fußnote dessen idiomatische Bedeutung erläutert.
