  text: וְ/נָטַשְׁתִּ֗י אֵ֚ת שְׁאֵרִ֣ית נַחֲלָתִ֔/י וּ/נְתַתִּ֖י/ם בְּ/יַ֣ד אֹֽיְבֵי/הֶ֑ם וְ/הָי֥וּ לְ/בַ֛ז וְ/לִ/מְשִׁסָּ֖ה לְ/כָל אֹיְבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: de
  text: Und ich werde den Rest meines Erbbesitzes[a] verlassen[b] und ihn in die Hand seiner Feinde geben. Er wird allen seinen Feinden zur Beute und zum Raub werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meines Erbteils“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aufgeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: Und ich werde … verlassen
  rationale: נטשׁ bezeichnet hier das Verlassen beziehungsweise Aufgeben. „Verlassen“ bewahrt die gerichtliche und relationale Schärfe, ohne unnötig altertümlich zu klingen.
- source_word: שְׁאֵרִית נַחֲלָתִי
  choice: den Rest meines Erbbesitzes
  rationale: שְׁאֵרִית meint das nach dem Gericht Verbliebene. נַחֲלָה bezeichnet den zugeteilten Besitz beziehungsweise das Erbteil; „Erbbesitz“ erhält die Bundes- und Besitzsprache und passt zum gemeinten Volk als kollektivem Anteil Gottes.
- source_word: וּנְתַתִּים בְּיַד אֹיְבֵיהֶם
  choice: und ihn in die Hand seiner Feinde geben
  rationale: Die hebräische Wendung „in die Hand geben“ wird formal bewahrt und bezeichnet die Übergabe in fremde Gewalt. Die deutschen Singularpronomen nehmen den kollektiven „Rest“ auf; im Hebräischen stehen pluralische Suffixe, weil die zugehörigen Menschen im Blick sind.
- source_word: וְהָיוּ לְבַז וְלִמְשִׁסָּה
  choice: Er wird … zur Beute und zum Raub werden
  rationale: Die beiden nah verwandten Begriffe werden als rhetorische Doppelung erhalten. „Beute“ und „Raub“ sind verständlich und geben das Ausgeliefertsein an feindliche Plünderung wieder.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: allen seinen Feinden
  rationale: 'Das ל markiert die Beziehung beziehungsweise das Ergebnis: Der Rest wird für sämtliche Feinde zu etwas, das erbeutet und geraubt wird.'
theological_decisions:
- issue: Bundestheologische Bedeutung von נַחֲלָתִי
  choice: „meines Erbbesitzes“ lässt den Rest als Gottes eigenen Anteil beziehungsweise Besitz erkennen, ohne ihn im Wortlaut enger zu bestimmen.
  alternative: „meines Erbteils“ oder „meines Eigentums“
  rationale: Die Formulierung wahrt die im Hebräischen angelegte Bundes- und Besitzbeziehung, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Hand-Metapher und die Doppelung „Beute und Raub“ bleiben erhalten. Wegen des kollektiven Singulars „Rest“ stehen im Deutschen Singularpronomen, obwohl das Hebräische bei den Rückbezügen den Plural verwendet.
