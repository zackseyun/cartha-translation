source:
  edition: WLC
  text: וַ/יַּעֲזֹ֕ב אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑י/ו וְ/לֹ֥א הָלַ֖ךְ בְּ/דֶ֥רֶךְ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: de
  text: Er verließ Jahwe[a], den Gott seiner Väter[b], und ging nicht auf dem Weg Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wandte sich von Jahwe ab«; wörtlich: »verließ Jahwe«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seiner Vorfahren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: Er verließ
  rationale: עזב bedeutet »verlassen«, »aufgeben« oder »im Stich lassen«. »Verließ« gibt den hebräischen Ausdruck knapp und verständlich wieder; im Zusammenhang bezeichnet er die Abkehr von Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben. »Jahwe« ist die im modernen Deutschen übliche Form der wissenschaftlich begründeten Lesung.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: den Gott seiner Väter
  rationale: Die konstruktgebundene Wendung bedeutet wörtlich »den Gott seiner Väter«. Die Übersetzung bewahrt die familiäre und bundestheologische Ausdrucksweise des Hebräischen.
- source_word: וְלֹא הָלַךְ
  choice: und ging nicht
  rationale: הלך wird hier bildlich für die Lebensführung gebraucht. »Ging nicht« erhält diese im Deutschen verständliche biblische Wegmetapher.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: auf dem Weg Jahwes
  rationale: דרך bezeichnet hier den von Jahwe bestimmten Lebensweg. Im Deutschen verlangt die räumliche Wegmetapher natürlich die Präposition »auf« statt einer formalen Nachbildung des hebräischen בְּ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als »Jahwe« bewahrt den Unterschied zwischen Name und Titel, statt ihn durch »der HERR« zu ersetzen.
- issue: Geschlechtsspezifische Ahnenbezeichnung אֲבֹתָיו
  choice: seiner Väter
  alternative: seiner Vorfahren
  rationale: אָבוֹת ist die maskuline Pluralform von »Vater«. »Väter« wahrt die konkrete hebräische Formulierung und ihre familiär-bundestheologische Prägung; »Vorfahren« ist eine mögliche allgemeinere Wiedergabe.
- issue: Wegmetapher für die Lebensführung
  choice: ging nicht auf dem Weg Jahwes
  alternative: lebte nicht nach dem Willen Jahwes
  rationale: Die Übersetzung bewahrt die absichtlich bildhafte Sprache des Hebräischen und löst sie nicht in eine theologische Erklärung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am knappen hebräischen Bericht; die Wegmetapher und die zweimalige Nennung des Gottesnamens werden bewahrt.
