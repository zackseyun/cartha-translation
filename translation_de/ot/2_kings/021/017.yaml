translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle rhetorische Abschlussfrage der Königsberichte bleibt erhalten; die Formulierung vermeidet zugleich den Eindruck, die genannte Quelle müsse mit dem kanonischen Buch der Chronik identisch sein.
