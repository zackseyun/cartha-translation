base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Die übrigen Taten Manasses, alles, was er tat, und seine Sünde, die er beging – sind sie nicht im Buch der Chronik der Könige von Juda[a] aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Buch der Annalen der Könige von Juda«. Der hebräische Ausdruck bezeichnet eine königliche Chronik beziehungsweise eine Sammlung amtlicher Aufzeichnungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Was es sonst noch über Manasse zu berichten gibt
  rationale: Die feste Königsformel bezeichnet die übrigen Taten beziehungsweise Angelegenheiten der Regierung Manasses. Die deutsche Fassung gibt den idiomatischen Sinn natürlich wieder, ohne דִּבְרֵי auf bloße Worte zu verengen.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: alles, was er tat
  rationale: Formnah und zugleich idiomatisches modernes Deutsch.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: und die Sünde, die er beging
  rationale: חַטָּאתוֹ trägt den Possessivbezug zu Manasse; im Deutschen ist dieser durch Subjekt und Kontext eindeutig. Die verwandten Substantiv- und Verbformen werden mit der natürlichen Verbindung „Sünde begehen“ wiedergegeben.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ist das nicht … aufgeschrieben?
  rationale: Die rhetorische Frage, die eine bejahende Antwort erwartet, bleibt erhalten. Das zusammenfassende Singularpronomen „das“ bezieht sich natürlich auf die zuvor aufgezählten Inhalte.
- source_word: עַל סֵפֶר
  choice: im Buch … aufgeschrieben
  rationale: Obwohl עַל wörtlich „auf/über“ heißen kann, verlangt die deutsche Wendung bei schriftlichen Quellen „im Buch“.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Buch der Chronik der Könige von Juda
  rationale: דִּבְרֵי הַיָּמִים bezeichnet hier eine chronikalische königliche Quelle. Der Singular „Chronik“ liest sich als Quellentitel natürlich; die Fußnote nennt die sachlich mögliche Wiedergabe „Annalen“.
