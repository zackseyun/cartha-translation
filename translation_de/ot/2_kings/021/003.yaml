  text: וַ/יָּ֗שָׁב וַ/יִּ֨בֶן֙ אֶת הַ/בָּמ֔וֹת אֲשֶׁ֥ר אִבַּ֖ד חִזְקִיָּ֣הוּ אָבִ֑י/ו וַ/יָּ֨קֶם מִזְבְּחֹ֜ת לַ/בַּ֗עַל וַ/יַּ֤עַשׂ אֲשֵׁרָה֙ כַּ/אֲשֶׁ֣ר עָשָׂ֗ה אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יִּשְׁתַּ֨חוּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַֽ/יַּעֲבֹ֖ד אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: de
  text: Er baute die Höhenheiligtümer wieder auf, die sein Vater Hiskia zerstört hatte. Er errichtete Altäre für den Baal und machte einen Aschera-Kultgegenstand, wie es Ahab, der König von Israel, getan hatte. Er warf sich vor dem ganzen Heer des Himmels nieder und diente ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und diente ihnen“; „Heer“ ist im Hebräischen eine kollektive Einzahl, auf die sich ein Pronomen im Plural bezieht.'
    reason: Erklärt die grammatische Spannung, die in idiomatischem Deutsch sonst nicht sichtbar ist.
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: die Höhenheiligtümer
  rationale: Bezeichnet kultische Anlagen beziehungsweise Heiligtümer auf Höhen; die Wiedergabe ist verständlicher und genauer als das bloße „Höhen“.
- source_word: לַבַּעַל
  choice: für den Baal
  rationale: Der Artikel kennzeichnet hier die kanaanäische Gottheit; „Altäre für“ gibt die Bestimmung der Altäre natürlich wieder.
- source_word: אֲשֵׁרָה
  choice: ein Aschera-Kultbild
  rationale: Im Kontext bezeichnet das Wort wahrscheinlich einen der Göttin Aschera zugeordneten Kultgegenstand; „Kultbild“ lässt dessen genaue materielle Gestalt offen.
- source_word: כָל־צְבָא הַשָּׁמַיִם
  choice: das ganze Heer des Himmels
  rationale: Bewahrt das biblische Bild und bezeichnet die Gesamtheit der Himmelskörper beziehungsweise als göttlich verehrten Himmelsmächte.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: und diente ihm
  rationale: Das hebräische Pronomen ist grammatisch plural („ihnen“), nimmt aber auf das kollektiv-singularische „Heer“ Bezug; im natürlichen Deutschen steht daher der Singular.
theological_decisions:
- issue: Art der Aschera
  choice: Aschera-Kultbild
  alternative: Aschera-Pfahl / Aschera
  rationale: Die genaue Gestalt des Kultgegenstands ist nicht sicher. „Kultbild“ vermeidet die zu enge Festlegung auf einen Pfahl und macht zugleich deutlich, dass hier ein hergestellter Kultgegenstand gemeint ist.
- issue: Heer des Himmels
  choice: bildhafte Formulierung beibehalten
  alternative: alle Himmelskörper / alle Gestirne
  rationale: Die wörtlichere Wendung erhält die mögliche Spannung zwischen sichtbaren Gestirnen und als Mächte verehrten Wesen, ohne sie einseitig aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die langen hebräischen Satzketten wurden zur besseren Verständlichkeit in drei Sätze gegliedert; die wiederholte Abfolge seiner kultischen Handlungen bleibt erhalten.
