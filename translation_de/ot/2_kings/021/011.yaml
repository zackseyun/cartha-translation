source:
  edition: WLC
  text: יַעַן֩ אֲשֶׁ֨ר עָשָׂ֜ה מְנַשֶּׁ֤ה מֶֽלֶךְ יְהוּדָה֙ הַ/תֹּעֵב֣וֹת הָ/אֵ֔לֶּה הֵרַ֕ע מִ/כֹּ֛ל אֲשֶׁר עָשׂ֥וּ הָ/אֱמֹרִ֖י אֲשֶׁ֣ר לְ/פָנָ֑י/ו וַ/יַּחֲטִ֥א גַֽם אֶת יְהוּדָ֖ה בְּ/גִלּוּלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: de
  text: Weil Manasse, der König von Juda, diese Gräueltaten begangen hat, schlimmer gehandelt hat als alles, was die Amoriter vor ihm getan hatten, und auch Juda durch seine Götzen[a] zur Sünde verführt hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort, das hier mit »Götzen« wiedergegeben wird, ist eine verächtliche Bezeichnung; als drastischere Wiedergabe kommt etwa »Mistgötzen« in Betracht.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Leitet den Grund für die im folgenden Vers angekündigte Gerichtsfolge ein; die unterordnende Konstruktion bleibt wie im Hebräischen offen.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: diese Gräueltaten
  rationale: Gibt den starken prophetischen Abscheu des Ausdrucks wieder und bezeichnet hier verwerfliche Handlungen, nicht nur Gegenstände.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: schlimmer gehandelt hat als alles, was … getan hatten
  rationale: Bewahrt die Steigerung und gibt das verbale הֵרַע idiomatisch als böses beziehungsweise schlimmes Handeln wieder.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Der morphologische Singular ist hier kollektiv gebraucht; im Deutschen ist der Plural die natürliche Wiedergabe.
- source_word: אֲשֶׁר לְפָנָיו
  choice: vor ihm
  rationale: Bewahrt die knappe zeitliche Aussage, ohne den nicht ausdrücklich genannten Zusatz „im Land“ einzufügen.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: weil er auch Juda … zur Sünde verführt hat
  rationale: 'Gibt den kausativen Hifil-Stamm wieder: Manasse sündigte nicht nur selbst, sondern brachte Juda zum Sündigen.'
- source_word: בְּגִלּוּלָיו
  choice: durch seine Götzen
  rationale: „Durch“ bezeichnet die Götzen als Mittel seines verführerischen Einflusses; die verächtliche Färbung des hebräischen Wortes wird in der Fußnote erläutert.
theological_decisions:
- issue: Verächtliche Bedeutung von גִּלּוּלִים
  choice: Götzen
  alternative: Mistgötzen; abscheuliche Götzen
  rationale: „Götzen“ ist im Haupttext klar, würdig und bereits negativ geprägt. Die drastische, verächtliche Konnotation des hebräischen Ausdrucks wird nicht verschwiegen, sondern in einer Fußnote kenntlich gemacht.
- issue: Kausative Bedeutung von וַיַּחֲטִא
  choice: zur Sünde verführt hat
  alternative: zum Sündigen gebracht hat
  rationale: Die Form schreibt Manasse eine verursachende beziehungsweise verleitende Rolle zu. „Zur Sünde verführt“ bewahrt diese Verantwortung in natürlichem Deutsch, ohne Judas eigene Verantwortung näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Weil-Konstruktion und das abschließende Komma zeigen, dass der Satz in Vers 12 fortgeführt wird. Der Königstitel steht als natürliche Apposition; die Wiederholung von „weil“ gliedert die lange Begründung verständlich.
