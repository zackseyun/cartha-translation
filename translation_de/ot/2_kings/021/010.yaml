  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה בְּ/יַד עֲבָדָ֥י/ו הַ/נְּבִיאִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/010.yaml
  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: de
  text: 'Und Jahwe redete durch seine Diener, die Propheten, und sprach:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Piel von דבר bedeutet hier „reden/sprechen“. „Redete“ bewahrt den erzählerischen Charakter und lässt sich natürlich mit der anschließenden Redeeinleitung verbinden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: בְּיַד
  choice: durch
  rationale: Die hebräische Wendung bedeutet wörtlich „durch die Hand von“, bezeichnet hier aber die Vermittlung beziehungsweise Beauftragung. Im modernen Deutschen gibt „durch“ diese Funktion klar und natürlich wieder.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Im Zusammenhang mit den Propheten bezeichnet עבד Menschen im beauftragten Dienst Gottes; „Diener“ ist daher treffender als „Sklaven“.
- source_word: הַנְּבִיאִים
  choice: die Propheten
  rationale: Die bestimmte Pluralform benennt appositionell, welche Diener gemeint sind.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. „Und sagte:“ ist im Deutschen eine natürliche narrative Überleitung, auch wenn das Subjekt gegenüber der hebräischen Konstruktion ausdrücklich aufgenommen wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der Text verwendet den Eigennamen Gottes. „Jahwe“ gibt ihn in der heute üblichen wissenschaftlichen Form wieder und ersetzt ihn nicht durch den Titel „HERR“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Agenturformel בְּיַד wird nicht wörtlich als „durch die Hand“ übernommen, weil dies im Deutschen unnötig fremd wirkt; ihr Sinn bleibt mit „durch“ erhalten. Der Doppelpunkt weist auf die in Vers 11 folgende Gottesrede voraus.
