base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: de
  text: Und Manasse legte sich zu seinen Vätern[a] und wurde im Garten seines Hauses, im Garten Ussas, begraben. Sein Sohn Amon wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entschlief zu seinen Vätern«; dies gibt die herkömmliche hebräische Todesformel wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Die Wiedergabe bewahrt die feste hebräische Todesformel und lässt den Zusammenhang den Tod anzeigen, statt sie auf das schlichte »starb« zu reduzieren.
- source_word: וַיִּקָּבֵר
  choice: wurde ... begraben
  rationale: Natürliche und genaue passive Wiedergabe des Nifal von קבר.
- source_word: בְּגַן בֵּיתוֹ
  choice: im Garten seines Hauses
  rationale: Entspricht dem Wortlaut; »Palast« wäre im königlichen Kontext möglich, ist im Hebräischen aber nicht ausdrücklich bezeichnet.
- source_word: בְּגַן עֻזָּא
  choice: im Garten Ussas
  rationale: Die wiederholte Ortsangabe wird appositionell beibehalten; der Eigenname עֻזָּא wird in üblicher deutscher Bibelnamensform als »Ussa« wiedergegeben.
- source_word: וַיִּמְלֹךְ
  choice: wurde ... König
  rationale: In der Thronfolgeformel bezeichnet מלך hier den Regierungsantritt, nicht bloß den Verlauf der Herrschaft.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Gibt die Übernahme der königlichen Stellung durch den Nachfolger präzise und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung der königlichen Todesformel
  choice: legte sich zu seinen Vätern
  alternative: starb / entschlief zu seinen Vätern
  rationale: Die traditionelle Formel wird bewahrt, ohne sie als Aussage über einen bestimmten Zustand nach dem Tod auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische königliche Todes- und Thronfolgeformel bleibt erkennbar; die Satzstellung im letzten Satz ist für natürliches Deutsch angepasst.
