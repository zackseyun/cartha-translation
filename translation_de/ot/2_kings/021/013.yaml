source:
  edition: WLC
  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: de
  text: 'Und ich werde über Jerusalem die Messschnur Samarias und das Senkblei des Hauses Ahab spannen[a] und Jerusalem auswischen, wie man eine Schüssel auswischt[b]: Man wischt sie aus und dreht sie um.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich stehen hier die Messschnur Samarias und das Senkblei des Hauses Ahab. Das Bild besagt, dass Jerusalem nach demselben Maßstab gerichtet wird wie sie.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Schale“ beziehungsweise „einen Teller“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: Und ich werde … spannen
  rationale: נטה bezeichnet hier zusammen mit קו das Ausspannen einer Messschnur. Die konkrete Metapher bleibt erhalten.
- source_word: קָו
  choice: Messschnur
  rationale: Das Wort bezeichnet eine Schnur zum Messen beziehungsweise Ausrichten; „Messschnur“ ist im Deutschen anschaulich und passt zum Gerichtsbild.
- source_word: מִשְׁקֹלֶת
  choice: Senkblei
  rationale: Gemeint ist ein beschwertes Messgerät zum Prüfen der lotrechten Ausrichtung. „Senkblei“ bewahrt das Bau- und Messbild.
- source_word: בֵּית אַחְאָב
  choice: Haus Ahab
  rationale: Die wörtliche dynastische Wendung ist im biblischen Deutsch verständlich und bezeichnet Ahabs Königshaus.
- source_word: וּמָחִיתִי
  choice: Ich werde … auswischen
  rationale: Die nachfolgende Schüsselmetapher bestimmt die konkrete Bedeutung. „Auswischen“ erhält zugleich den im Kontext liegenden vernichtenden Sinn.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: wie man eine Schüssel auswischt
  rationale: Die unbestimmte maskuline Singularform wird idiomatisch mit dem allgemeinen „man“ wiedergegeben. צלחת kann Schüssel, Schale oder Teller bedeuten.
- source_word: מָחָה
  choice: Man wischt sie aus
  rationale: Die Wiederholung des Verbs wird bewahrt und macht das vollständige Leeren beziehungsweise Säubern des Gefäßes anschaulich.
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: und kehrt sie um
  rationale: Wörtlich wird das Gefäß „auf sein Gesicht“ gedreht. „Umkehren“ gibt dies natürlich wieder, ohne die Bildsprache unnötig auszudeuten.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
theological_decisions:
- issue: Bedeutung des Messbildes von Samaria und dem Haus Ahab
  choice: Jerusalem wird demselben Maßstab des Gerichts unterworfen, der an Samaria und Ahabs Haus angelegt wurde.
  alternative: Messschnur und Senkblei können in anderen Zusammenhängen den Wiederaufbau bezeichnen.
  rationale: Der unmittelbare Gerichtskontext und das anschließende Bild der ausgewischten und umgekehrten Schüssel weisen hier eindeutig auf Vernichtung, ohne dass die Messmetapher selbst paraphrasierend aufgelöst wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Mess- und Gefäßmetaphorik bleibt erhalten; „man“ gibt den unbestimmten Handelnden natürlich wieder. Die Wiederholung von מחה wurde bewusst bewahrt.
