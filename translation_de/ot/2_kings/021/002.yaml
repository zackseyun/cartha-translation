source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war, nach dem Vorbild der abscheulichen Praktiken[a] der Völker, die Jahwe vor den Israeliten vertrieben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach den Gräueln der Völker“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was … böse war
  rationale: Die feste hebräische Bewertungsformel wird in natürlichem Deutsch wiedergegeben; das eröffnende וַ wird im fortlaufenden deutschen Erzählstil nicht eigens mit „und“ übersetzt.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Metapher der göttlichen Beurteilung bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: כְּתוֹעֲבֹת
  choice: Er folgte den abscheulichen Praktiken
  rationale: תּוֹעֵבָה bezeichnet hier verabscheuungswürdige, besonders religiöse Praktiken; die Konstruktion mit כְּ drückt aus, dass Manasse sich nach ihnen richtete beziehungsweise sie nachahmte.
- source_word: הַגּוֹיִם
  choice: der Völker
  rationale: Gemeint sind die nichtisraelitischen Völker des Landes; „Völker“ ist im historischen Zusammenhang präzise und neutral.
- source_word: הוֹרִישׁ
  choice: vertrieben hatte
  rationale: Der Hifil von ירש bezeichnet hier das Vertreiben beziehungsweise Enteignen der Völker; das Plusquamperfekt verdeutlicht die zeitliche Vorordnung.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: מִפְּנֵי wird nach „vertreiben“ idiomatisch mit „vor“ wiedergegeben. בְּנֵי יִשְׂרָאֵל ist eine feste Volksbezeichnung und bedeutet im Kontext die Israeliten insgesamt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den Charakter als persönlichen Gottesnamen.
- issue: Bedeutungsumfang von תּוֹעֵבָה
  choice: abscheuliche Praktiken
  alternative: Gräuel
  rationale: Im Zusammenhang bezeichnet der Plural nicht nur abstrakt Abscheuliches, sondern die verwerflichen Handlungen und religiösen Bräuche der Völker. Die Alternative wird in der Fußnote bewahrt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die hebräische Wendung ist hier die konventionelle Bezeichnung des gesamten Volkes. „Israeliten“ gibt ihre referenzielle Bedeutung in modernem Deutsch wieder, ohne den Personenkreis auf männliche Nachkommen einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle biblische Wendung „in den Augen Jahwes“ bleibt erhalten; ansonsten werden schwer verständliche substantivische Formulierungen zugunsten einer klaren verbalen Aussage vermieden.
