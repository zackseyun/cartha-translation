  to: Darüber hinaus vergoss Manasse sehr viel unschuldiges Blut, bis er Jerusalem von einem Ende bis zum anderen[a] mit unschuldigem Blut gefüllt hatte, zusätzlich zu seiner Sünde, durch die er Juda dazu brachte, zu sündigen und zu tun, was in den Augen Jahwes böse war.
