id: 2KI.21.16
reference: 2 Kings 21:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַם֩ דָּ֨ם נָקִ֜י שָׁפַ֤ךְ מְנַשֶּׁה֙ הַרְבֵּ֣ה מְאֹ֔ד עַ֛ד אֲשֶׁר מִלֵּ֥א אֶת יְרוּשָׁלִַ֖ם פֶּ֣ה לָ/פֶ֑ה לְ/בַ֤ד מֵֽ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יְהוּדָ֔ה לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: de
  text: Darüber hinaus vergoss Manasse sehr viel unschuldiges Blut, bis er Jerusalem von einem Ende bis zum anderen[a] mit unschuldigem Blut gefüllt hatte, zusätzlich zu seiner Sünde, durch die er Juda dazu brachte, zu sündigen und zu tun, was in den Augen Jahwes böse war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „von Mund zu Mund“; gemeint ist die ganze Stadt, von einem Ende bis zum anderen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Darüber hinaus
  rationale: 'Gibt die additive und zugleich verstärkende Funktion natürlich wieder: Der Blutvergießen-Vorwurf kommt zu den zuvor genannten Vergehen hinzu.'
- source_word: דָּם נָקִי
  choice: unschuldiges Blut
  rationale: Bewahrt die feste rechtlich-moralische Wendung für das Blut von Menschen, die keine den Tod rechtfertigende Schuld tragen.
- source_word: שָׁפַךְ
  choice: vergoss
  rationale: „Blut vergießen“ ist auch im Deutschen die geläufige Entsprechung des hebräischen Ausdrucks für gewaltsames Töten.
- source_word: הַרְבֵּה מְאֹד
  choice: sehr viel
  rationale: Die doppelte Verstärkung wird direkt und in verständlichem Deutsch wiedergegeben.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: bis er Jerusalem damit von einem Ende bis zum anderen angefüllt hatte
  rationale: Die bildhafte hebräische Wendung „Mund zu Mund“ bezeichnet die ganze Ausdehnung der Stadt. „Damit“ verdeutlicht, dass sich das Füllen auf das zuvor genannte Blut bezieht.
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: Das kam noch zu seiner Sünde hinzu
  rationale: Gibt den zusätzlichen Vorwurf klar wieder und bewahrt den Singular „Sünde“, der Manasses schuldhaftes Handeln zusammenfassend bezeichnen kann.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: durch die er Juda dazu brachte zu sündigen
  rationale: 'Bewahrt die kausative Bedeutung des Hifil: Manasse spielte eine aktive ursächliche Rolle bei Judas Sünde.'
- source_word: לַעֲשׂוֹת הָרַע
  choice: und zu tun, was … böse war
  rationale: Schließt die Infinitivkonstruktion eng an das kausative Verb an und bezeichnet den Inhalt der Sünde.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Bewahrt die transparente hebräische Bewertungsmetapher.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen; „Jahwe“ ist die geläufige deutsche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm ausdrücklich. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Namen und folgt der für modernes Deutsch üblichen Schreibweise.
- issue: Stärke der Verursachung in הֶחֱטִיא
  choice: brachte Juda dazu zu sündigen
  alternative: verleitete Juda zur Sünde
  rationale: Die gewählte Formulierung erhält die deutliche kausative Aussage des Hifil, ohne über den syntaktischen Befund hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei Sätze vermeiden eine überladene Satzstruktur, ohne die additive Logik des Hebräischen aufzulösen. Der Fußnotenmarker steht unmittelbar bei der idiomatischen Wendung, die er erläutert.
