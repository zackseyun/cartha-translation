- from: 'Da sagten sie zum König von Assyrien: „Die Völker, die du deportiert und in den Städten Samarias angesiedelt hast, kennen die Ordnung[b] der Gottheit dieses Landes[a] nicht. Deshalb hat sie Löwen unter sie geschickt, und nun töten diese sie, weil sie die Ordnung der Gottheit dieses Landes nicht kennen.“'
  to: 'Sie sagten zum König von Assyrien: „Die Völker, die du deportiert und in den Städten Samarias angesiedelt hast, kennen die Ordnung[b] des Gottes dieses Landes[a] nicht. Deshalb hat der Gott dieses Landes Löwen unter sie geschickt; siehe, die Löwen töten sie, weil sie die Ordnung des Gottes dieses Landes nicht kennen.“'
  rationale: Die Revision stellt die direkte Benennung „Gott des Landes“ wieder her, beseitigt die schwer verständliche Pronomenhäufung und gibt וְהִנֵּה mit „siehe“ wieder. „Ordnung“ und die zugehörige Anmerkung bleiben bestehen, da sie die semantische Reichweite von מִשְׁפָּט angemessen offenhalten.
