id: 2KI.17.26
reference: 2 Kings 17:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: de
  text: 'Sie sagten zum König von Assyrien: „Die Völker, die du deportiert und in den Städten Samarias angesiedelt hast, kennen die Ordnung[b] des Gottes dieses Landes[a] nicht. Deshalb hat der Gott dieses Landes Löwen unter sie geschickt; siehe, die Löwen töten sie, weil sie die Ordnung des Gottes dieses Landes nicht kennen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „des Gottes des Landes“. Die Bezeichnung gibt die territorial geprägte Sicht der Sprecher wieder; im Erzählzusammenhang ist der Gott Israels gemeint.'
    reason: alternative_reading
  - marker: b
    text: „Ordnung“ kann hier auch mit „Gesetz“, „Vorschrift“ oder „Brauch“ wiedergegeben werden. Gemeint ist die für die Verehrung des Gottes des Landes geltende Norm oder Praxis.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Bezeichnet hier mehrere von Assyrien umgesiedelte ethnische Bevölkerungsgruppen; „Völker“ wahrt den kollektiven Sinn ohne die späteren Assoziationen von „Heiden“.
- source_word: הִגְלִיתָ
  choice: du deportiert hast
  rationale: Der Hifil von גלה bezeichnet die erzwungene Wegführung. „Deportiert“ gibt den politischen Zwang in heutigem Deutsch präzise wieder.
- source_word: וַתּוֹשֶׁב
  choice: und … angesiedelt hast
  rationale: 'Gibt den kausativen Sinn von ישׁב natürlich wieder: Der assyrische König ließ die Bevölkerungsgruppen an einem neuen Ort wohnen.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: in den Städten Samarias
  rationale: Bewahrt die Konstruktverbindung und bezeichnet die Städte des Gebiets Samaria, nicht nur die Hauptstadt.
- source_word: מִשְׁפַּט
  choice: Ordnung
  rationale: מִשְׁפַּט meint hier die für die Gottheit des Landes geltende Vorschrift beziehungsweise gebotene Weise ihrer Verehrung. „Ordnung“ bewahrt die kultische und normative Bedeutungsbreite besser als das engere „Gesetz“ oder das unverbindlichere „Brauch“.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: die Gottheit dieses Landes
  rationale: Die Formulierung gibt die territorial geprägte Vorstellung der Sprecher wieder, ohne durch die im Deutschen zwingende Großschreibung von „Gott“ ihre Sicht mit der Erzählperspektive gleichzusetzen. Das Singularverb in וַיְשַׁלַּח wird durch den Singular „Gottheit“ gewahrt.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: Deshalb hat sie Löwen unter sie geschickt
  rationale: „Deshalb“ macht den im Bericht vorausgesetzten Ursachenzusammenhang deutlich; „unter sie“ entspricht בָּם, und das Perfekt passt zum gegenwärtigen Ergebnis der berichteten Handlung.
- source_word: וְהִנָּם מְמִיתִים אוֹתָם
  choice: und nun töten diese sie
  rationale: „Nun“ gibt die aufmerksamkeitslenkende und vergegenwärtigende Funktion von הִנֵּה wieder. Das Demonstrativpronomen „diese“ verdeutlicht, dass die Löwen Subjekt des partizipial ausgedrückten fortdauernden Tötens sind.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: weil sie … nicht kennen
  rationale: כַּאֲשֶׁר hat hier kausale Funktion. „Kennen“ passt zur fehlenden Vertrautheit mit der vorgeschriebenen religiösen Ordnung.
theological_decisions:
- issue: Wiedergabe von אֱלֹהֵי הָאָרֶץ als Bezeichnung für Israels Gott aus der territorial-religiösen Sicht der Sprecher
  choice: die Gottheit dieses Landes
  alternative: der Gott dieses Landes
  rationale: „Gottheit“ wahrt die berichtete pagane Perspektive, während die Fußnote offenhält, dass im Erzählzusammenhang der Gott Israels gemeint ist. So wird die theologische Spannung nicht durch deutsche Großschreibung stillschweigend aufgelöst.
- issue: Bedeutung von מִשְׁפַּט im kultischen Zusammenhang
  choice: Ordnung
  alternative: Gesetz; Vorschrift; Brauch
  rationale: Der Ausdruck umfasst hier die für die Verehrung der Landesgottheit geltende Norm. „Ordnung“ lässt offen, ob eine einzelne Vorschrift, ein Gesetz oder eine überlieferte Kultpraxis gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Deportiert“ benennt die assyrische Zwangsumsiedlung klar; „angesiedelt“ bildet den anschließenden kausativen Vorgang ab. Die Pronomenfolge in „hat sie Löwen unter sie geschickt“ ist grammatisch eindeutig, da das erste „sie“ auf die feminine Singularform „Gottheit“ und das zweite auf die Völker verweist; „diese“ bezeichnet anschließend ausdrücklich die Löwen.
