base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: de
  text: Im zwölften Regierungsjahr des Ahas, des Königs von Juda, wurde Hoschea, der Sohn Elas, in Samaria König über Israel. Er regierte neun Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: wurde … König / regierte
  rationale: Das hebräische Verb bezeichnet je nach Zusammenhang den Beginn beziehungsweise die Ausübung der Königsherrschaft. Die erste Verwendung wird im Deutschen idiomatisch mit „wurde … König“ wiedergegeben, die zweite mit „regierte“.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לְאָחָז
  choice: Im zwölften Regierungsjahr des Ahas
  rationale: Die übliche Datierungsformel meint das zwölfte Jahr der Herrschaft des genannten Königs; „Regierungsjahr“ macht dies im modernen Deutsch klar.
- source_word: בְשֹׁמְרוֹן עַל יִשְׂרָאֵל
  choice: in Samaria … über Israel
  rationale: Die Orts- und Herrschaftsangaben werden nahe an der hebräischen Formulierung bewahrt.
