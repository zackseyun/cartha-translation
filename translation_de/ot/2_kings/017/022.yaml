  text: וַ/יֵּֽלְכוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/כָל חַטֹּ֥אות יָרָבְעָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה לֹא סָ֖רוּ מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: de
  text: Die Israeliten lebten in allen Sünden, die Jerobeam begangen hatte; sie wandten sich nicht davon ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihr“; die feminine Singularform bezieht sich wahrscheinlich zusammenfassend auf die eben beschriebene sündige Lebensweise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: lebten weiter in
  rationale: הלך mit ב bezeichnet hier bildlich das Befolgen einer Lebensweise. „Lebten … in“ gibt den ethischen Sinn in natürlichem modernem Deutsch wieder; „weiter“ verdeutlicht im Zusammenhang ihr beharrliches Verhalten.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung ist klar und gibt die nationale Bedeutung des hebräischen Ausdrucks ohne das heute missverständliche „Kinder Israel“ wieder.
- source_word: בְּכָל חַטֹּאות
  choice: in all den Sünden
  rationale: Die Formulierung bewahrt sowohl die Präposition als auch die Gesamtheit der genannten sündigen Praktiken.
- source_word: יָרָבְעָם אֲשֶׁר עָשָׂה
  choice: die Jerobeam begangen hatte
  rationale: עשה bedeutet grundsätzlich „tun/machen“; in Verbindung mit „Sünden“ ist „begehen“ die natürliche deutsche Kollokation. Das Plusquamperfekt macht die zeitliche Vorordnung verständlich.
- source_word: לֹא סָרוּ
  choice: sie wandten sich nicht … ab
  rationale: סור bezeichnet das Abweichen oder Sich-Abwenden; die deutsche Wendung gibt ihre fortgesetzte Bindung an diese Sünden wieder.
- source_word: מִמֶּנָּה
  choice: davon
  rationale: „Davon“ bewahrt die formale Numerusoffenheit des deutschen Pronominaladverbs und lässt den hebräischen femininen Singular als kollektiven Rückbezug auf die zuvor beschriebene sündige Lebensweise erkennen.
theological_decisions:
- issue: Bezugswort des femininen Singularsuffixes in מִמֶּנָּה nach dem pluralischen „Sünden“
  choice: „davon“ mit Fußnote, als kollektiver Rückbezug auf die sündige Lebensweise
  alternative: „von ihnen“, unmittelbar auf die pluralischen Sünden bezogen
  rationale: Der hebräische Text hat ausdrücklich ein feminines Singularsuffix. „Davon“ ist im Deutschen natürlich, vermeidet eine unnötige Festlegung auf einen pluralischen Rückbezug und bewahrt die mögliche kollektive Vorstellung der ganzen von Jerobeam geprägten sündigen Lebensweise.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ethische Wegmetapher wird sinngemäß und natürlich wiedergegeben; die auffällige Einzahl des Schlusspronomens bleibt durch „davon“ und die Fußnote sichtbar.
