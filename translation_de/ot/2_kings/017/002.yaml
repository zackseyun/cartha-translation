id: 2KI.17.2
reference: 2 Kings 17:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: de
  text: Er tat, was böse war in den Augen Jahwes, doch nicht wie die Könige Israels, die vor ihm gewesen waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Wayyiqtol führt die erzählte Handlung fort. Im natürlichen deutschen Erzählstil muss das einleitende וַ nicht eigens mit »und« wiedergegeben werden.
- source_word: הָרַע
  choice: was böse war
  rationale: Das mit Artikel gebrauchte Adjektiv ist substantiviert und bezeichnet »das Böse« beziehungsweise das, was böse war; die gewählte Formulierung klingt im Deutschen natürlich.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild und bezeichnet die Bewertung aus Jahwes Sicht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im modernen Deutschen übliche Form der wissenschaftlichen Umschrift.
- source_word: רַק
  choice: allerdings
  rationale: Die Partikel schränkt das vorausgehende negative Urteil ein. »Allerdings« gibt diese adversativ-qualifizierende Funktion idiomatisch wieder, während die wörtlichere Bedeutung »nur« in der Fußnote erhalten bleibt.
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: nicht wie die Könige Israels
  rationale: Die Verneinung mit vergleichendem כ wird direkt und verständlich wiedergegeben.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: die vor ihm gewesen waren
  rationale: Die Formulierung bewahrt die zeitliche Perspektive des hebräischen Ausdrucks und verweist auf seine königlichen Vorgänger.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Gottesname selbst und kein Titel. Deshalb wird er als Eigenname in seiner üblichen deutschen Form wiedergegeben.
- issue: Reichweite der Einschränkung durch רַק
  choice: Das negative Urteil wird durch einen Vergleich mit den früheren Königen Israels eingeschränkt.
  alternative: Die Partikel rein wörtlich mit »nur« wiederzugeben.
  rationale: 'רַק leitet hier eine qualifizierende Gegenüberstellung ein, ohne das vorausgehende Urteil aufzuheben. »Allerdings nicht wie« bewahrt diese theologische Spannung: Der König handelt böse, aber nicht auf dieselbe Weise beziehungsweise nicht in demselben Maß wie seine Vorgänger.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle königliche Bewertungsformel bleibt bildhaft erkennbar, ohne unnötig altertümliche Satzstellung.
