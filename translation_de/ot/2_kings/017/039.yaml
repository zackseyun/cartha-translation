id: 2KI.17.39
reference: 2 Kings 17:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: de
  text: Vielmehr sollt ihr Jahwe, euren Gott, fürchten, und er wird euch aus der Hand all eurer Feinde[a] retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung „aus der Hand aller eurer Feinde“ bedeutet: aus ihrer Macht oder Gewalt.'
    reason: Erläuterung eines hebräischen Bildausdrucks
lexical_decisions:
- source_word: כִּי אִם
  choice: Vielmehr
  rationale: Die Wortverbindung setzt die alleinige Gottesfurcht in deutlichen Gegensatz zum Verbot aus Vers 38, anderen Göttern zu dienen. „Vielmehr“ gibt diesen adversativ-korrigierenden Sinn im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form der wissenschaftlichen Umschrift.
- source_word: אֱלֹהֵיכֶם
  choice: euren Gott
  rationale: Obwohl אֱלֹהִים formal pluralisch aussehen kann, bezeichnet das Wort in Verbindung mit Jahwe eindeutig den einen Gott Israels; das Suffix ist an die angeredete Mehrzahl gerichtet.
- source_word: תִּירָאוּ
  choice: sollt ihr fürchten
  rationale: ירא bezeichnet hier ehrfürchtige, gehorsame Gottesfurcht. Die Konstruktion mit „sollt“ bewahrt die verpflichtende Kraft der hebräischen Verbform, ohne sie als bloße Zukunftsaussage zu missverstehen.
- source_word: וְהוּא
  choice: und er
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten, ohne durch „er selbst“ eine stärkere Betonung einzutragen, als der Kontext verlangt.
- source_word: יַצִּיל
  choice: wird … retten
  rationale: Der Hifil von נצל bezeichnet das Herausreißen oder Retten aus Gefahr beziehungsweise feindlicher Gewalt. „Retten“ ist im modernen Deutschen klar und trägt hier den passenden Zusagecharakter.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Wendung bezeichnet bildhaft die Macht oder Gewalt, in der sich jemand befindet. Das deutsche Bild ist verständlich und bewahrt die Ausdrucksweise des Ausgangstextes.
- source_word: כָּל אֹיְבֵיכֶם
  choice: all eurer Feinde
  rationale: Die Formulierung gibt sowohl den umfassenden Quantor כָּל als auch das an die angeredete Mehrzahl gerichtete Possessivsuffix vollständig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamecharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ירא gegenüber Gott
  choice: fürchten
  alternative: verehren
  rationale: „Fürchten“ lässt die im Hebräischen vorhandene Spannung zwischen Ehrfurcht, Loyalität und wirklicher Gottesfurcht bestehen. „Verehren“ würde den Bedeutungsumfang zu stark auf kultische Ehrerbietung verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vielmehr“ stellt den Bezug zum vorausgehenden Verbot her. Die Wortstellung hebt Jahwe als den allein zu fürchtenden Gott hervor; die traditionelle hebräische Bildsprache „aus der Hand“ bleibt erhalten und wird in der Fußnote erläutert.
