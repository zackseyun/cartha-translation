base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: de
  text: Sie ließen ihre Söhne und Töchter durchs Feuer gehen[a], betrieben Wahrsagerei und deuteten Vorzeichen; sie verkauften sich, um zu tun, was in den Augen Jahwes böse war, und ihn zum Zorn zu reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutlicher: „opferten ihre Söhne und Töchter im Feuer“. Wörtlich lautet das hebräische Idiom: „ließen … durchs Feuer gehen“.'
    reason: lexikalische Alternative und Erläuterung des wahrscheinlich gemeinten Ritus
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: ließen ... durchs Feuer gehen
  rationale: Die Wiedergabe bewahrt die wörtliche Gestalt des hebräischen Idioms und seine Bezüge zu anderen Textstellen, ohne die genaue Form des Feuerritus im Haupttext stärker festzulegen als der Wortlaut.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: ihre Söhne und Töchter
  rationale: Der hebräische Text nennt ausdrücklich beide Gruppen; dies bewahrt Nachdruck und Schrecken der Handlung.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: betrieben Wahrsagerei
  rationale: Die idiomatische deutsche Form gibt die figura etymologica natürlich wieder und bezeichnet klar eine mantische Praxis.
- source_word: וַיְנַחֵשׁוּ
  choice: deuteten Vorzeichen
  rationale: Das Verb bezeichnet die Deutung von Zeichen oder Omina. Diese Formulierung ist verständlich und unterscheidet die Handlung von der zuvor genannten Wahrsagerei.
- source_word: וַיִּתְמַכְּרוּ
  choice: verkauften sich
  rationale: Die bildhafte Hitpael-Form wird beibehalten; sie vermittelt freiwillige Selbstpreisgabe und Bindung an das Böse.
- source_word: לַעֲשׂוֹת הָרַע
  choice: zu tun, was ... böse war
  rationale: Die Formulierung gibt die substantivierte Wendung idiomatisch wieder und verbindet sie natürlich mit dem folgenden Bewertungsmaßstab.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Metapher göttlicher Beurteilung bleibt im Deutschen verständlich und bildhaft erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: לְהַכְעִיסוֹ
  choice: reizten ihn damit zum Zorn
  rationale: 'Die Formulierung bewahrt die kausative Bedeutung: Ihr böses Handeln erregte Jahwes Zorn. „Damit“ stellt den syntaktischen Bezug zum vorausgehenden Tun klar her.'
theological_decisions:
- issue: Art des Feuerritus an den Kindern
  choice: Das Idiom „ließen ihre Söhne und Töchter durchs Feuer gehen“ bleibt im Haupttext erhalten.
  alternative: „opferten/verbrannten ihre Söhne und Töchter im Feuer“
  rationale: Der Zusammenhang weist stark auf ein verurteiltes Kinderopfer oder einen verwandten Feuerritus hin. Der hebräische Wortlaut benennt die genaue rituelle Form jedoch nicht ausdrücklich; eine Fußnote erläutert daher den wahrscheinlichen Sinn, ohne die verbleibende Unschärfe im Haupttext aufzulösen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname bewahrt den persönlichen Gottesnamen und entspricht einer im modernen Deutschen geläufigen Transkription.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge oder kausale Verknüpfung des hebräischen Textes zu verändern. Das markante Bild „verkauften sich“ und die Augen-Metapher wurden bewusst bewahrt.
