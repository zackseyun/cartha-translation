base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: de
  text: Die Leute aus Awa[a] machten Nibhas und Tartak. Die Leute aus Sefarwajim verbrannten ihre Söhne im Feuer[b] für Adrammelech und Anammelech, die Götter von Sefarwajim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Awiter.'
    reason: lexical_alternative
  - marker: b
    text: Das heißt, sie opferten diesen Göttern ihre Söhne durch Verbrennen.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: die Leute aus Awa
  rationale: Die Form ist eine gentilizische Pluralbezeichnung. Eine Herkunftsumschreibung ist im modernen Deutschen natürlicher als eine künstliche deutsche Volksbezeichnung; die alternative Wiedergabe „Awiter“ wird in der Fußnote genannt.
- source_word: עָשׂוּ
  choice: machten
  rationale: Das gewöhnliche Verb bezeichnet hier im kultischen Zusammenhang die Herstellung der benannten Gottheiten beziehungsweise ihrer Darstellungen, ohne dass der hebräische Text ausdrücklich „Bilder“ oder „Götzen“ sagt.
- source_word: נִבְחַז וְאֶת תַּרְתָּק
  choice: Nibhas und Tartak
  rationale: Beide Götternamen werden nach ihrer hebräischen Form ins Deutsche transkribiert.
- source_word: הַסְפַרְוִים
  choice: die Leute aus Sefarwajim
  rationale: Die gentilizische Pluralform bezeichnet die Bewohner Sefarwajims; die Herkunftsumschreibung ist klar und idiomatisch.
- source_word: שֹׂרְפִים
  choice: verbrannten
  rationale: Das Partizip kann eine gewohnheitsmäßige Praxis bezeichnen. Im deutschen Erzählzusammenhang drückt das Präteritum diese wiederholte Kultpraxis natürlich aus.
- source_word: אֶת בְּנֵיהֶם בָּאֵשׁ
  choice: ihre Söhne im Feuer
  rationale: בנים wird entsprechend der geschlechtsspezifischen Ausgangsform mit „Söhne“ wiedergegeben; בָאֵשׁ bedeutet in diesem Opferkontext „im Feuer“.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: für Adrammelech und Anammelech
  rationale: Die Präposition ל bezeichnet hier die Empfänger beziehungsweise die Widmung des Opfers; „für“ ist im Deutschen natürlicher als „zu“.
- source_word: אלה ספרים
  choice: die Götter von Sefarwajim
  rationale: Die Konstruktverbindung identifiziert Adrammelech und Anammelech als die mit dem Ort Sefarwajim verbundenen Götter.
theological_decisions:
- issue: Ob Nibhas und Tartak ausdrücklich als Götzen oder Götterbilder bezeichnet werden sollen
  choice: Die wörtliche Formulierung „machten Nibhas und Tartak“ bleibt erhalten.
  alternative: „machten Götzenbilder von Nibhas und Tartak“
  rationale: Der kultische Zusammenhang legt hergestellte Darstellungen nahe, doch der hebräische Text nennt weder „Götzen“ noch „Bilder“ ausdrücklich. Die offene Formulierung vermeidet eine unnötige Festlegung.
- issue: Ob בְּנֵיהֶם verallgemeinernd mit „Kinder“ wiedergegeben werden soll
  choice: „ihre Söhne“
  alternative: „ihre Kinder“
  rationale: Der Ausgangstext verwendet das geschlechtsspezifische Wort für Söhne; diese Genauigkeit wird bewahrt.
- issue: Ob das Verb שֹׂרְפִים als einmaliges oder als übliches Handeln erscheinen soll
  choice: „verbrannten“ im Kontext einer beschriebenen Kultpraxis
  alternative: „pflegten … zu verbrennen“ oder „verbrannten immer wieder“
  rationale: Das hebräische Partizip kann fortdauerndes oder gewohnheitsmäßiges Handeln ausdrücken. Das schlichte deutsche Präteritum bleibt würdig und natürlich, während die Fußnote den Opfercharakter erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Herkunftsbezeichnungen werden zur besseren Verständlichkeit mit „Leute aus …“ wiedergegeben. Die Satzteilung entlastet die lange Aufzählung, ohne die Beziehungen des hebräischen Textes zu verändern.
