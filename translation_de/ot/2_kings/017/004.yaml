  text: וַ/יִּמְצָא֩ מֶֽלֶךְ אַשּׁ֨וּר בְּ/הוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח מַלְאָכִים֙ אֶל ס֣וֹא מֶֽלֶךְ מִצְרַ֔יִם וְ/לֹא הֶעֱלָ֥ה מִנְחָ֛ה לְ/מֶ֥לֶךְ אַשּׁ֖וּר כְּ/שָׁנָ֣ה בְ/שָׁנָ֑ה וַֽ/יַּעַצְרֵ֨/הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּאַסְרֵ֖/הוּ בֵּ֥ית כֶּֽלֶא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: de
  text: Da entdeckte der König von Assyrien, dass Hoschea eine Verschwörung plante:[a] Er hatte Boten zu So, dem König von Ägypten,[b] gesandt und dem König von Assyrien den jährlichen Tribut nicht entrichtet.[c] Deshalb nahm der König von Assyrien ihn fest und legte ihn im Gefängnis in Fesseln.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „fand in Hoschea eine Verschwörung“; gemeint ist, dass er bei Hoschea verräterische Pläne aufdeckte.'
    reason: lexical_alternative
  - marker: b
    text: „So“ gibt den hebräischen Namen wieder. Welcher ägyptische Herrscher historisch gemeint ist, ist unsicher.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „brachte den Tribut nicht hinauf“. Gemeint ist, dass Hoschea den regelmäßig jährlich zu entrichtenden Tribut nicht zahlte.'
    reason: lexical_alternative
  - marker: d
    text: 'Das Hebräische unterscheidet zwei Handlungen: Der König von Assyrien nahm Hoschea zunächst fest und legte ihn dann im Gefängnis in Fesseln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... בְּהוֹשֵׁעַ קֶשֶׁר
  choice: entdeckte ..., dass Hoschea eine Verschwörung plante
  rationale: Die hebräische Wendung lautet wörtlich etwa „fand in Hoschea eine Verschwörung“. Die gewählte Form gibt den idiomatischen Sinn auf natürlichem Deutsch wieder, ohne die politische Konspiration als bereits vollendeten Aufstand darzustellen.
- source_word: שָׁלַח מַלְאָכִים
  choice: hatte Boten ... gesandt
  rationale: מַלְאָכִים bezeichnet hier im diplomatischen Zusammenhang Boten oder Gesandte. „Boten“ bleibt lexikalisch breit und gut verständlich.
- source_word: סוֹא
  choice: So
  rationale: Der hebräische Name wird transliteriert; die historische Identität des ägyptischen Herrschers ist unsicher.
- source_word: מִנְחָה
  choice: Tribut
  rationale: Im Verhältnis eines Vasallenkönigs zum assyrischen Oberherrn bezeichnet das Wort hier eine Tributzahlung, nicht allgemein ein Geschenk oder eine Opfergabe.
- source_word: הֶעֱלָה
  choice: entrichtet
  rationale: Das Verb bedeutet wörtlich „hinaufbringen“. In Verbindung mit Tribut ist „entrichten“ im Deutschen natürlich und bezeichnet die politische Zahlung präzise.
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: wie Jahr für Jahr
  rationale: Die hebräische Wendung drückt die regelmäßige jährliche Leistung aus. Die knappe Form bewahrt den elliptischen Charakter, bleibt im Deutschen jedoch verständlich.
- source_word: וַיַּעַצְרֵהוּ
  choice: nahm ... ihn fest
  rationale: Das Verb kann „zurückhalten“, „festnehmen“ oder „einschließen“ bedeuten. Hier bezeichnet es die erste Handlung vor dem anschließenden Fesseln und Einkerkern.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: legte ihn im Gefängnis in Fesseln
  rationale: אָסַר bedeutet grundsätzlich „binden/fesseln“, während בֵּית כֶּלֶא den Ort als Gefängnis bezeichnet. So bleiben beide Aussagebestandteile und die Abfolge erhalten.
