revisions:
- from: Da entdeckte der König von Assyrien, dass Hoschea eine Verschwörung plante:[a] Er hatte Boten zu So, dem König von Ägypten,[b] gesandt und dem König von Assyrien nicht wie Jahr für Jahr Tribut entrichtet.[c] Deshalb nahm der König von Assyrien ihn fest und legte ihn im Gefängnis in Fesseln.[d]
  to: Da entdeckte der König von Assyrien, dass Hoschea eine Verschwörung plante:[a] Er hatte Boten zu So, dem König von Ägypten,[b] gesandt und dem König von Assyrien den jährlichen Tribut nicht entrichtet.[c] Deshalb nahm der König von Assyrien ihn fest und legte ihn im Gefängnis in Fesseln.[d]
  rationale: Eine sichere sprachliche Korrektur ist erforderlich, weil „nicht wie Jahr für Jahr Tribut entrichtet“ im modernen Standarddeutsch nicht idiomatisch konstruiert ist. Die Änderung zu „den jährlichen Tribut nicht entrichtete“ erhält den Sinn von כְּשָׁנָה בְשָׁנָה als regelmäßig jährlich geschuldete Tributzahlung, ohne über den Text hinausgehende Deutung hinzuzufügen. Die Fußnote zu [c] wurde entsprechend präzisiert.
