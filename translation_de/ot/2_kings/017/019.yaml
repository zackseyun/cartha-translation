- from: Auch Juda hielt die Gebote Jahwes, ihres Gottes, nicht, sondern sie lebten nach den Satzungen Israels, die dieses eingeführt hatte.[a]
  to: Auch Juda hielt die Gebote Jahwes, seines Gottes, nicht, sondern lebte nach den Satzungen Israels, die Israel eingeführt hatte.[a]
  rationale: Die Überarbeitung glättet die deutsche Personenreferenz, behält den kollektiven Sinn von Juda bei und ersetzt das schwerfällige „dieses“ durch eine klare Wiederaufnahme von „Israel“. Die Fußnote beschreibt die reale lexikalische und syntaktische Offenheit von עָשׂוּ, ohne eine umstrittene Deutung als Haupttext auszugeben.
