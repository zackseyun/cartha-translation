source:
  edition: WLC
  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: de
  text: Auch Juda hielt die Gebote Jahwes, seines Gottes, nicht, sondern lebte nach den Satzungen Israels, die Israel eingeführt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… sondern sie folgten den Satzungen Israels, die sie praktizierten.“ Wörtlich: „… und sie gingen in den Satzungen Israels, die sie gemacht hatten.“ Das hebräische Verb kann hier sowohl „einführen“ als auch „praktizieren/befolgen“ bedeuten; „Satzungen“ kann auch „Bräuche“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Das vorangestellte גַּם bezieht Juda ausdrücklich in die zuvor festgestellte Schuld Israels ein. „Auch“ ist im Deutschen natürlich und kann kontextuell den Sinn „selbst Juda“ tragen.
- source_word: שָׁמַר אֶת מִצְוֺת
  choice: hielt die Gebote
  rationale: שׁמר bezeichnet in rechtlich-bundestheologischem Zusammenhang das Halten oder Befolgen von Geboten; „die Gebote halten“ ist präzise und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihres Gottes
  rationale: Das hebräische Suffix steht im maskulinen Plural und nimmt Juda als Volksgemeinschaft auf. Das deutsche „ihres“ bewahrt diesen kollektiven Bezug.
- source_word: וַיֵּלְכוּ בְּחֻקּוֹת
  choice: sondern sie lebten nach den Satzungen
  rationale: הלך ב bezeichnet bildhaft die Lebensführung nach bestimmten Ordnungen. „Sie lebten nach“ gibt die Metapher verständlich wieder; „sondern“ macht den sachlichen Gegensatz zum Nichtbefolgen von Jahwes Geboten deutlich.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Im Kontext ist das Nordreich gemeint; der Eigenname bleibt unverändert.
- source_word: אֲשֶׁר עָשׂוּ
  choice: die dieses eingeführt hatte
  rationale: עשה kann bei Satzungen das Hervorbringen, Einführen oder Praktizieren bezeichnen. „Eingeführt“ passt zum institutionellen Sinn, während die Fußnote die mögliche Deutung „befolgt/praktiziert“ offenhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt ihn als solchen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Subjekt und Sinn von אֲשֶׁר עָשׂוּ
  choice: Israel als kollektives Subjekt; „eingeführt hatte“
  alternative: „die sie befolgt hatten“ beziehungsweise „nach den Bräuchen Israels, die sie praktizierten“
  rationale: Das pluralische Verb kann sich auf Israel als Kollektiv beziehen, doch עשה kann hier sowohl das Einführen als auch das Praktizieren der Satzungen meinen. Der Haupttext wählt eine plausible Lesart, die Fußnote bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Satzungen“ bewahrt den rechtlich-religiösen Ton. Der Wechsel vom kollektiven Singular „Juda“ zum pluralischen „sie“ folgt dem hebräischen Sinn, da das Volk Judas gemeint ist.
