  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: de
  text: So verwarf Jahwe alle Nachkommen Israels[a], ließ sie leiden und gab sie in die Hand von Plünderern[b], bis er sie aus seiner Gegenwart verstieß[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ganze Nachkommenschaft Israels«; wörtlich: »allen Samen Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »lieferte sie Plünderern aus«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »von seinem Angesicht weg«.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: verwarf
  rationale: Das Verb מָאַס bezeichnet hier eine entschiedene Zurückweisung. »Verwarf« bewahrt den gerichtlichen und bundestheologischen Ernst, ohne vor allem emotionale Verachtung auszudrücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: alle Nachkommen Israels
  rationale: זֶרַע bedeutet wörtlich »Same« und kollektiv »Nachkommenschaft«. »Alle Nachkommen Israels« ist im heutigen Deutsch natürlich und bewahrt die umfassende Formulierung, ohne ihren kontextuellen Umfang näher festzulegen.
- source_word: וַיְעַנֵּם
  choice: ließ sie leiden
  rationale: Das Piel von ענה kann »bedrängen«, »demütigen« oder »leiden lassen« bedeuten. »Ließ sie leiden« hält die Art des Leids offen und passt zur Abfolge göttlichen Gerichts.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: gab sie in die Hand von
  rationale: Die hebräische Wendung bezeichnet die Auslieferung in die Gewalt anderer. Die deutsche Form bewahrt das Bild der Hand und bleibt verständlich.
- source_word: שֹׁסִים
  choice: Plünderern
  rationale: Das Partizip bezeichnet Menschen, die andere berauben und ausplündern. »Plünderer« gibt den gewaltsamen, räuberischen Sinn präzise wieder.
- source_word: עַד אֲשֶׁר
  choice: bis
  rationale: Die Verbindung bezeichnet den Endpunkt der vorausgehenden Handlung; »bis« ist knapp und idiomatisch.
- source_word: הִשְׁלִיכָם מִפָּנָיו
  choice: sie aus seiner Gegenwart verstieß
  rationale: השליך bedeutet wörtlich »werfen« oder »schleudern«; mit מִפָּנָיו beschreibt es hier die Entfernung aus Gottes Gegenwart. »Verstieß« vermittelt die entschiedene Ausstoßung in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt diese Form, statt sie durch einen Titel zu ersetzen.
- issue: Umfang von »alle Nachkommen Israels«
  choice: Die umfassende Formulierung bleibt ohne einschränkende Deutung erhalten.
  alternative: Die Aussage ausdrücklich auf das Nordreich beschränken.
  rationale: Der historische Zusammenhang betrifft Israel, doch der hebräische Wortlaut sagt umfassend »alle Nachkommen Israels«. Die Übersetzung soll die mögliche Spannung nicht stillschweigend auflösen.
- issue: Art des durch וַיְעַנֵּם bezeichneten Gerichts
  choice: ließ sie leiden
  alternative: demütigte sie / unterdrückte sie
  rationale: Das Verb umfasst mehrere Formen der Bedrängnis. Die gewählte Wiedergabe vermeidet eine unnötige Festlegung auf soziale Unterdrückung oder innere Demütigung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der Abfolge des Hebräischen, während »ließ sie leiden« und »aus seiner Gegenwart verstieß« idiomatisches Deutsch bieten. Sämtliche Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
