id: 2KI.17.36
reference: 2 Kings 17:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: de
  text: Sondern Jahwe[a], der euch mit großer Kraft und ausgestrecktem Arm aus dem Land Ägypten heraufgeführt hat – ihn sollt ihr fürchten[b], vor ihm sollt ihr euch niederwerfen und ihm sollt ihr Opfer darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vielmehr sollt ihr Jahwe … fürchten.“ Der hebräische Satzanfang stellt Jahwe betont den anderen Göttern gegenüber.'
    reason: alternative_reading
  - marker: b
    text: „Fürchten“ umfasst hier ehrfürchtige Scheu und treue Hinwendung zu Gott, nicht nur Angst.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sondern
  rationale: 'Die Wendung bildet nach dem Verbot, andere Götter zu fürchten, den betonten positiven Gegensatz: nicht sie, sondern Jahwe.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֶעֱלָה אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: der euch … aus dem Land Ägypten heraufgeführt hat
  rationale: „Heraufführen“ bewahrt das Bild des Hifil von עלה und die ausführliche Exodusformel; im Deutschen bleibt die Formulierung verständlich.
- source_word: בְּכֹחַ גָּדוֹל וּבִזְרוֹעַ נְטוּיָה
  choice: mit großer Kraft und ausgestrecktem Arm
  rationale: Die instrumentale Präposition und das traditionelle Exodusbild werden nah am Hebräischen wiedergegeben.
- source_word: אֹתוֹ תִירָאוּ
  choice: ihn sollt ihr fürchten
  rationale: Die Voranstellung von „ihn“ erhält die Betonung; „fürchten“ bewahrt die Bedeutungsbreite zwischen Furcht, Ehrfurcht und loyaler Gottesverehrung.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: vor ihm sollt ihr euch niederwerfen
  rationale: Die Formulierung bewahrt die konkrete körperliche Bedeutung des Sich-Niederwerfens, statt sie lediglich als „anbeten“ auszudeuten.
- source_word: וְלוֹ תִזְבָּחוּ
  choice: ihm sollt ihr Opfer darbringen
  rationale: Dies gibt die kultische Bedeutung von זבח natürlich wieder und erhält durch „ihm“ die wiederholte Ausrichtung allein auf Jahwe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration wahrt seinen Charakter als Eigenname.
- issue: Bedeutung von ירא im Zusammenhang der Bundesverehrung
  choice: fürchten
  alternative: verehren
  rationale: „Fürchten“ erhält die theologische Spannung und Bedeutungsbreite des hebräischen Verbs; eine Fußnote verdeutlicht, dass mehr als bloße Angst gemeint ist.
- issue: Konkrete oder abstrahierende Wiedergabe von שׁחה
  choice: euch niederwerfen
  alternative: anbeten
  rationale: Die konkrete Gebärde wird im Haupttext bewahrt, ohne ihre gottesdienstliche Bedeutung auf einen abstrakten Begriff zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Hervorhebung des alleinigen Adressaten („ihn … vor ihm … ihm“) folgt der hebräischen Struktur; der Gedankenstrich kennzeichnet den Übergang vom Relativsatz zu den Aufforderungen.
