source:
  edition: WLC
  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: de
  text: Dort verbrannten sie auf allen Kulthöhen Räucherwerk wie die Völker, die Jahwe vor ihnen vertrieben hatte[a]. Und sie taten Böses, um Jahwe zum Zorn zu reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Jahwe vor ihnen weggeführt hatte“. Das hebräische Verb kann auch ein Wegführen oder Verschleppen bezeichnen; hier geht es um die Entfernung der früheren Bewohner aus dem Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: sie verbrannten Räucherwerk
  rationale: Das Piel von קטר bezeichnet das Aufsteigenlassen von Opferrauch und häufig konkret das Verbrennen von Räucherwerk. Im Zusammenhang des unerlaubten Kultes auf den Kulthöhen ist diese Wiedergabe natürlich und sachgerecht.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist schlicht auf die im Zusammenhang genannten Kultstätten.
- source_word: בְּכָל בָּמוֹת
  choice: auf allen Kulthöhen
  rationale: במות sind erhöhte beziehungsweise als solche bezeichnete Kultstätten. „Kulthöhen“ bewahrt den religionsgeschichtlichen Fachsinn und ist im Deutschen verständlicher als das bloße „Höhen“.
- source_word: כַּגּוֹיִם
  choice: wie die Völker
  rationale: גוים bezeichnet hier die zuvor im Land ansässigen Völker; „Völker“ vermeidet den später geprägten Gegensatzbegriff „Heiden“.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: die Jahwe vor ihnen vertrieben hatte
  rationale: Die Formulierung beschreibt die Entfernung der früheren Bewohner vor Israel. „Vertrieben“ gibt diesen Zusammenhang idiomatisch wieder; die mögliche Bedeutung des Verbs als Wegführen oder Deportieren bleibt in der Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: sie taten Böses
  rationale: Die knappe deutsche Wendung entspricht der allgemeinen moralischen Anklage des Hebräischen, ohne sie auf bestimmte Taten einzuengen.
- source_word: לְהַכְעִיס
  choice: um Jahwe zum Zorn zu reizen
  rationale: Das Hifil von כעס bedeutet, jemanden zu erzürnen beziehungsweise zum Zorn zu reizen. Die explizite deutsche Formulierung gibt Zielrichtung und Wirkung klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung von הֶגְלָה im Zusammenhang der Landnahme
  choice: vertrieben hatte
  alternative: weggeführt beziehungsweise verschleppt hatte
  rationale: Der Zusammenhang spricht von der Entfernung der zuvor ansässigen Völker. Die Hauptfassung bringt die Enteignung des Landes natürlich zum Ausdruck, während die Fußnote die stärkere Bedeutung des hebräischen Verbs als Wegführung oder Deportation offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kulthöhen“ dient als verständlicher Fachbegriff; der kurze Hauptsatz „sie taten Böses“ bewahrt die Schlichtheit und Schärfe des hebräischen Urteils.
