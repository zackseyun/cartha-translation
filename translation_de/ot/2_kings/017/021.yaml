  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: de
  text: Denn er riss Israel vom Haus Davids los, und sie setzten Jerobeam, den Sohn Nebats, als König ein. Jerobeam brachte Israel davon ab, Jahwe zu folgen,[a] und brachte sie dazu, eine große Sünde zu begehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jerobeam trieb Israel von der Nachfolge Jahwes weg.“ Das hebräische Verb kann sowohl Wegtreiben als auch Irreführen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע
  choice: hatte sich … losgerissen
  rationale: Das Verb bezeichnet wörtlich ein Zerreißen oder Losreißen und beschreibt hier anschaulich die politische Abspaltung Israels von der davidischen Dynastie. Das Plusquamperfekt stellt den vorausliegenden Vorgang im deutschen Erzählzusammenhang klar dar.
- source_word: מֵעַל בֵּית דָּוִד
  choice: vom Haus Davids
  rationale: Die Wortverbindung bezeichnet die Trennung von der Herrschaft des davidischen Königshauses; „Haus Davids“ bewahrt die dynastische Ausdrucksweise des Hebräischen.
- source_word: וַיַּמְלִיכוּ
  choice: zum König gemacht
  rationale: Der Hifil von מלך bedeutet hier, jemanden als König einzusetzen beziehungsweise zum König zu machen.
- source_word: וַיַּדַּח
  choice: brachte … davon ab
  rationale: נדח kann ein gewaltsames Wegtreiben oder ein Irreführen bezeichnen. Die gewählte Formulierung ist natürliches Deutsch und lässt beide Aspekte anklingen; die Alternative wird in der Fußnote genannt.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: Jahwe zu folgen
  rationale: Die hebräische Wendung „hinter Jahwe her“ bezeichnet treue Nachfolge. Zusammen mit dem trennenden Verb ergibt sich idiomatisch „davon abbringen, Jahwe zu folgen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהֶחֱטֵיאָם חֲטָאָה גְדוֹלָה
  choice: verleitete sie zu einer großen Sünde
  rationale: Der Hifil von חטא ist kausativ. „Zu einer großen Sünde verleiten“ bewahrt die Verursachung und vermeidet im Deutschen die schwerfällige Wiederholung „ließ sie eine große Sünde sündigen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als persönlicher Gottesname.
- issue: Verantwortung Jerobeams für Israels Abfall
  choice: brachte Israel davon ab … und verleitete sie
  alternative: trieb Israel davon weg … und ließ sie sündigen
  rationale: Die kausative Verantwortung Jerobeams bleibt deutlich, ohne festzulegen, ob וַיַּדַּח vor allem Zwang oder Irreführung bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metapher des Losreißens und der dynastische Ausdruck „Haus Davids“ bleiben erhalten; die Satzglieder werden für natürliche deutsche Lesbarkeit gegliedert.
