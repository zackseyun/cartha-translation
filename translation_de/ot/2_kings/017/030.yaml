  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: de
  text: Die Männer von Babel machten Sukkot-Benot[a], die Männer von Kuta machten Nergal und die Männer von Hamat machten Aschima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sukkot-Benot ist wahrscheinlich der Name einer fremden Gottheit oder eines Kultgegenstands. Die Bedeutung des Namens ist unsicher; deshalb wird er nicht übersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: die Männer von
  rationale: Die konstruktusförmige Mehrzahl von אִישׁ bezeichnet hier die einer Stadt zugehörigen Männer beziehungsweise Einwohner. „Die Männer von“ gibt die ausdrücklich maskuline Form direkt wieder; kollektiv wäre auch „die Leute aus“ möglich.
- source_word: עָשׂוּ
  choice: machten
  rationale: Das gewöhnliche Verb עשה bedeutet „machen/tun“. „Machten“ bleibt auch im Zusammenhang mit Kultbildern oder Gottheiten bewusst unspezifisch und fügt weder „stellten auf“ noch „verehrten“ hinzu.
- source_word: סֻכּוֹת בְּנוֹת
  choice: Sukkot-Benot
  rationale: Die Wortgruppe fungiert offenbar als Eigenname einer fremden Gottheit oder eines Kultgegenstands. Wegen der unsicheren Bedeutung wird sie transliteriert und nicht etymologisch übersetzt.
- source_word: כּוּת
  choice: Kuta
  rationale: Der Ortsname wird in einer im Deutschen gebräuchlichen Form wiedergegeben.
- source_word: נֵרְגַל
  choice: Nergal
  rationale: Der Eigenname der mesopotamischen Gottheit wird transliteriert.
- source_word: חֲמָת
  choice: Hamat
  rationale: Der Ortsname wird in der üblichen deutschen Form wiedergegeben.
- source_word: אֲשִׁימָא
  choice: Aschima
  rationale: Der Eigenname einer fremden Gottheit wird nach deutscher Lautkonvention transliteriert, ohne eine unsichere Deutung einzutragen.
theological_decisions:
- issue: Ob die Objekte von עָשׂוּ im Haupttext ausdrücklich als Götter oder Götzen bezeichnet werden sollen
  choice: Die Eigennamen ohne ergänzendes „Gott“, „Götze“ oder „Götterbild“ beibehalten.
  alternative: „Die Männer von Babel machten den Götzen Sukkot-Benot …“ beziehungsweise „… machten Sukkot-Benot zu ihrem Gott …“
  rationale: Der hebräische Text nennt nach „machten“ nur die Eigennamen. Der Zusammenhang weist auf fremde Gottheiten oder Kultgegenstände, lässt deren genaue materielle beziehungsweise kultische Gestalt hier aber unausgesprochen. Die knappe Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Die dreifache Formel „die Männer von … machten …“ bleibt erhalten. Namen werden nach deutschen Transliterationsgewohnheiten wiedergegeben.
