id: 2KI.17.28
reference: 2 Kings 17:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹ֞א אֶחָ֣ד מֵ/הַ/כֹּהֲנִ֗ים אֲשֶׁ֤ר הִגְלוּ֙ מִ/שֹּׁ֣מְר֔וֹן וַ/יֵּ֖שֶׁב בְּ/בֵֽית אֵ֑ל וַֽ/יְהִי֙ מוֹרֶ֣ה אֹתָ֔/ם אֵ֖יךְ יִֽירְא֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: de
  text: Da kam einer von den Priestern, die man aus Samaria in die Verbannung geführt hatte. Er ließ sich in Bethel nieder und lehrte die Menschen dort, wie sie Jahwe fürchten sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Folge im modernen deutschen Erzählstil natürlich wieder.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: einer von den Priestern
  rationale: Die Wendung bezeichnet einen Einzelnen aus der zuvor genannten Gruppe von Priestern.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: die man aus Samaria in die Verbannung geführt hatte
  rationale: Der Hifil von גלה bedeutet hier „deportieren/in die Verbannung führen“. Das unbestimmte Subjekt der dritten Person Plural wird idiomatisch mit „man“ bewahrt.
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: Er ließ sich in Bethel nieder
  rationale: ישׁב bezeichnet hier die Aufnahme eines Wohnsitzes; „sich niederlassen“ ist präziser als das bloße „wohnen“ und natürliches modernes Deutsch.
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: und lehrte die Menschen dort
  rationale: היה mit Partizip beschreibt eine fortdauernde beziehungsweise charakteristische Tätigkeit. Das Pronomen „sie“ bezieht sich auf die zuvor im Kontext genannten Menschen; die explizite Wiedergabe vermeidet im Deutschen einen möglichen falschen Bezug auf die Priester.
- source_word: אֵיךְ יִירְאוּ
  choice: wie sie … fürchten sollten
  rationale: Die Formulierung bewahrt sowohl den Gedanken der Unterweisung in der Art und Weise als auch den normativen Ton von „sollten“.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich gebrauchte Eigenname sichtbar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname; „der HERR“ ist die traditionelle Ersatzlesung, würde diese Unterscheidung jedoch weniger unmittelbar erkennen lassen.
- issue: Bedeutung von „Jahwe fürchten“
  choice: die Formulierung wörtlich und offen beibehalten
  alternative: Jahwe verehren / Jahwe gehorchen
  rationale: ירא kann hier Ehrfurcht, kultische Verehrung und gehorsame Gottesfurcht umfassen. „Fürchten“ bewahrt diese theologische Spannweite, ohne sie auf nur einen Aspekt festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde zur besseren Verständlichkeit geteilt. „Die Menschen dort“ klärt den pronominalen Bezug anhand des Kontextes, ohne eine neue Personengruppe einzuführen.
