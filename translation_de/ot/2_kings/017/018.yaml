  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: de
  text: Da wurde Jahwe sehr zornig über Israel und entfernte sie von seinem Angesicht[a]. Niemand blieb übrig außer dem Stamm Juda allein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus seiner Gegenwart“. Wörtlich: „von/weg von seinem Angesicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: Da wurde Jahwe sehr zornig
  rationale: Das Hitpael von אנף bezeichnet hier heftig aufkommenden Zorn; מְאֹד wird mit „sehr“ ausdrücklich wiedergegeben. Die Formulierung ist gegenwärtiges, würdevolles Deutsch und bewahrt die Stärke der Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: בְּיִשְׂרָאֵל
  choice: über Israel
  rationale: Bei einem Verb des Zorns bezeichnet ב den Gegenstand, gegen den sich der Zorn richtet. „zornig über Israel“ ist im Deutschen idiomatisch und weniger missverständlich als „auf Israel“.
- source_word: וַיְסִרֵם
  choice: entfernte sie
  rationale: Die Hifil-Form von סור bedeutet, jemanden wegzunehmen bzw. zu entfernen. Die Wiedergabe lässt den im Kontext erkennbaren Bezug auf die Verbannung stehen, ohne ihn in das Verb hineinzuschreiben.
- source_word: מֵעַל פָּנָיו
  choice: aus seinem Angesicht
  rationale: Die konkrete Wendung mit „Angesicht“ wird bewahrt. Das deutsche „aus seinem Angesicht“ gibt die Entfernung aus dem Bereich vor Gottes Angesicht natürlich wieder; die abstraktere Alternative steht in der Fußnote.
- source_word: לֹא נִשְׁאַר
  choice: Niemand blieb übrig
  rationale: Das Nifal von שׁאר bezeichnet das Verbleiben. Wegen des anschließenden Stammes Juda ist die personenbezogene Formulierung im Deutschen klar und natürlich.
- source_word: רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: außer dem Stamm Juda allein
  rationale: Nach der Verneinung markiert רַק eine Ausnahme; לְבַדּוֹ verstärkt die Aussage zusätzlich. „allein“ bewahrt diese hebräische Hervorhebung trotz der leichten semantischen Überschneidung mit „außer“.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Gegenwart in מֵעַל פָּנָיו
  choice: aus seinem Angesicht
  alternative: aus seiner Gegenwart
  rationale: Die Übersetzung bewahrt das konkrete Bild des hebräischen Textes und damit dessen theologische und bundestheologische Spannung, statt es vollständig zu abstrahieren. Die idiomatischere Deutung wird als Alternative vermerkt.
- issue: Bedeutung von „Israel“ im Kontext
  choice: Der Name bleibt unkommentiert und bezeichnet im unmittelbaren Zusammenhang das Nordreich beziehungsweise dessen Bevölkerung.
  alternative: Israel als das gesamte Bundesvolk in einem weiteren repräsentativen Sinn
  rationale: 2. Könige 17 handelt unmittelbar vom Untergang und von der Verschleppung des Nordreichs. Der Vers wird nicht durch eine weitergehende theologische Präzisierung ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am hebräischen Erzählstil; das konkrete Bild „Angesicht“ wird im Haupttext erhalten und durch eine verständlichere Alternative in der Fußnote erläutert.
