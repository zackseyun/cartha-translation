base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: de
  text: Sie fürchteten Jahwe, dienten aber[a] ihren Göttern – nach dem Brauch der Völker, aus denen man sie verschleppt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und“. Die hebräische Konjunktion kann hier auch rein verbindend verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen verwendete Eigenname erhalten bleibt.
- source_word: הָיוּ יְרֵאִים
  choice: sie fürchteten
  rationale: Die Verbindung von היה mit dem Partizip bezeichnet hier ein fortdauerndes beziehungsweise übliches Verhalten; „sie fürchteten“ ist im Deutschen idiomatisch und bewahrt die Bedeutung ehrfürchtiger Gottesfurcht.
- source_word: אֱלֹהֵיהֶם
  choice: ihren eigenen Göttern
  rationale: Das Possessivsuffix wird mit „ihren“ wiedergegeben; „eigenen“ macht den im Kontext liegenden Gegensatz zu Jahwe deutlich, ohne einen neuen Referenten einzuführen.
- source_word: הָיוּ עֹבְדִים
  choice: dienten
  rationale: עבד bezeichnet im Zusammenhang mit Gottheiten kultischen Dienst oder Verehrung. „Dienten“ bleibt nah am hebräischen Ausdruck und erhält die Parallele zu „fürchteten“.
- source_word: כְּמִשְׁפַּט
  choice: nach dem Brauch
  rationale: מִשְׁפָּט bezeichnet hier die herkömmliche religiöse Praxis und nicht ein Gerichtsurteil oder eine einzelne Rechtsbestimmung.
- source_word: הַגּוֹיִם
  choice: der Völker
  rationale: גּוֹיִם meint hier die verschiedenen Herkunftsvölker der umgesiedelten Menschen.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: aus deren Gebieten man sie verschleppt hatte
  rationale: Die unbestimmte handelnde Instanz wird im Deutschen mit „man“ ausgedrückt. „Aus deren Gebieten“ gibt das lokale מִשָּׁם natürlich wieder, und „verschleppt“ bezeichnet die erzwungene Umsiedlung.
theological_decisions:
- issue: Verhältnis zwischen der Furcht Jahwes und dem Dienst an anderen Göttern
  choice: Die Satzteile werden mit „aber“ verbunden, um den kontextuellen Gegensatz und die synkretistische Spannung verständlich auszudrücken.
  alternative: Das hebräische וְ formal mit „und“ wiedergeben.
  rationale: Die Konjunktion ist formal additiv, kann im Zusammenhang jedoch adversativ verstanden werden. Die Fußnote wahrt die formale Alternative, während der Haupttext die im Kontext erkennbare Spannung natürlich wiedergibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem historischem Ton. Der Gedankenstrich gliedert die nähere Bestimmung der fortdauernden religiösen Praxis.
