id: 2KI.17.8
reference: 2 Kings 17:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּֽלְכוּ֙ בְּ/חֻקּ֣וֹת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/מַלְכֵ֥י יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: de
  text: Sie lebten nach den Ordnungen der Völker, die Jahwe vor den Israeliten vertrieben hatte, und nach den Ordnungen, die die Könige Israels eingeführt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann der Schluss lauten: „und nach dem, was die Könige Israels getan hatten“. Der hebräische Ausdruck ist verkürzt.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: sie lebten nach
  rationale: הלך bedeutet wörtlich „gehen“, bezeichnet hier aber bildhaft die Lebensführung. „Sie lebten nach“ gibt die ethische Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: בְּחֻקּוֹת
  choice: nach den Ordnungen
  rationale: חֻקּוֹת kann festgesetzte Ordnungen, Satzungen oder überlieferte Bräuche bezeichnen. „Ordnungen“ bewahrt den verbindlichen Charakter, ohne in diesem Zusammenhang unnatürlich gesetzessprachlich zu klingen.
- source_word: הַגּוֹיִם
  choice: der Völker
  rationale: גּוֹיִם bezeichnet hier die nichtisraelitischen Völker des Landes. „Völker“ ist sachlich und vermeidet eine unnötige religiöse Engführung.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: die Jahwe vor … vertrieben hatte
  rationale: Das Hifil von ירש kann „enteignen, aus dem Besitz verdrängen“ oder „vertreiben“ bedeuten. „Vertrieben“ ist im Deutschen natürlich und erfasst die Entfernung der Völker aus dem Land; „vor“ gibt מִפְּנֵי wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Wörtlich steht „Söhne Israels“, doch die feste ethnische Bezeichnung meint hier das Volk Israel. „Israeliten“ ist präzise, inklusiv und idiomatisch.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: und nach den Ordnungen, die die Könige Israels eingeführt hatten
  rationale: Die hebräische Formulierung ist elliptisch. Die Ergänzung „nach den Ordnungen“ führt die Satzkonstruktion verständlich fort; „eingeführt hatten“ gibt עָשׂוּ kontextgemäß als das Schaffen beziehungsweise Etablieren solcher Praktiken wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Elliptische Schlusswendung über die Könige Israels
  choice: die von den Königen eingeführten Ordnungen
  alternative: was die Könige Israels getan hatten
  rationale: Der Kontext setzt das Leben nach bestimmten Ordnungen fort. Die gewählte Fassung macht diese Ellipse verständlich, während die Fußnote die formal näherliegende und weniger bestimmte Wiedergabe offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sie lebten nach“ vermeidet das heute altertümliche „sie wandelten in“, bewahrt aber den Gedanken einer an bestimmten Ordnungen ausgerichteten Lebensführung.
