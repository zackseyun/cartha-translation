base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: de
  text: 'Da befahl der König von Assyrien: »Bringt einen der Priester dorthin, die ihr von dort in die Verbannung geführt habt. Er soll hingehen und dort wohnen[a] und sie die Ordnung des Gottes dieses Landes[b][c] lehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen »hingehen« und »wohnen« im Plural, obwohl zuvor von »einem der Priester« die Rede ist und das folgende Verb »lehren« im Singular steht.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: »das Recht« oder »die Vorschrift des Gottes dieses Landes«; möglich ist auch: »den Brauch des Gottes dieses Landes«.'
    reason: lexical_alternative
  - marker: c
    text: »Der Gott dieses Landes« gibt die Sicht des assyrischen Königs wieder, der von einer für das Land zuständigen Gottheit ausgeht; möglich ist auch die Wiedergabe »die Gottheit dieses Landes«.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: Da befahl
  rationale: צוה bezeichnet hier einen königlichen Befehl; »befahl« ist präzise, würdig und im Deutschen natürlich.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: Bringt ... dorthin
  rationale: Der Hifil von הלך kann »hinbringen«, »hinschicken« oder »hinführen« bedeuten. »Bringt ... dorthin« wahrt die verursachende Bedeutung, ohne den Vorgang unnötig zu spezifizieren.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: einen der Priester
  rationale: Natürliche Wiedergabe der partitiven Konstruktion.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: die ihr von dort in die Verbannung geführt habt
  rationale: Der Hifil von גלה bezeichnet Deportation beziehungsweise Verbannung. Die Formulierung ist verständlich und erhält den Bezug auf das Exil.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: Er soll hingehen und dort wohnen
  rationale: Der masoretische Text hat hier Pluralformen, doch »einen der Priester« und das folgende singularische וְיֹרֵם zeigen einen singularischen Sinn. Die deutsche Hauptübersetzung folgt diesem Zusammenhang; die formale Auffälligkeit wird in einer Fußnote dokumentiert.
- source_word: וְיֹרֵם
  choice: und sie lehren
  rationale: Der Hifil von ירה bedeutet hier »lehren« oder »unterweisen«; das Suffix bezeichnet die zu unterweisenden Bewohner.
- source_word: מִשְׁפַּט
  choice: was ... fordert
  rationale: מִשְׁפַּט bezeichnet hier die vorgeschriebene religiöse Ordnung, das Recht oder die gebotene Verehrungsweise. Die verbale Wiedergabe klingt natürlich und bewahrt den verpflichtenden Sinn.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: der Gott dieses Landes
  rationale: Die Formulierung gibt die Vorstellung des assyrischen Königs von einer landesgebundenen Gottheit wieder. Im Deutschen werden Bezeichnungen für Gottheiten als Substantive grundsätzlich großgeschrieben; die Perspektive wird daher durch »dieses Landes« und eine Fußnote kenntlich gemacht, nicht durch unübliche Kleinschreibung.
theological_decisions:
- issue: Perspektive in אֱלֹהֵי הָאָרֶץ
  choice: der Gott dieses Landes
  alternative: der Gott des Landes / die Gottheit des Landes
  rationale: Die Wendung bleibt innerhalb der Rede des assyrischen Königs und trägt dessen Vorstellung einer territorial zuständigen Gottheit. »Gott« kann zugleich den tatsächlichen Bezug auf den Gott Israels offenhalten, ohne die Sicht des Sprechers ausdrücklich zu bestätigen.
- issue: Numeruswechsel bei וְיֵלְכוּ / וְיֵשְׁבוּ und וְיֹרֵם
  choice: singularischer Sinn im Haupttext
  alternative: 'formale Wiedergabe im Plural: »Sie sollen hingehen und dort wohnen«'
  rationale: Der unmittelbare Bezugspunkt ist »einen der Priester«, und das abschließende Verb ist Singular. Eine singularische deutsche Wiedergabe vermittelt den erkennbaren Sinn; die Pluralformen des Hebräischen bleiben durch Fußnote [a] transparent.
- issue: Bedeutungsumfang von מִשְׁפַּט
  choice: was ... fordert
  alternative: das Recht / die Vorschrift / den Brauch des Gottes dieses Landes
  rationale: Die Formulierung lässt offen, ob vor allem kultische Sitte, verbindliche Vorschrift oder zustehende Verehrung gemeint ist, und vermeidet eine vorschnelle Gleichsetzung mit einem kodifizierten Gesetz.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird knapp und königlich bestimmt formuliert. Ungebräuchliche Kleinschreibung von »Gott« wird vermieden; die fremdreligiöse Sprecherperspektive wird semantisch und in der Fußnote erläutert.
