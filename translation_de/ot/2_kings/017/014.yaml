base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: de
  text: Doch sie hörten nicht, sondern verhärteten ihren Nacken wie den ihrer Vorfahren, die nicht auf Jahwe, ihren Gott, vertrauten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die nicht an Jahwe, ihren Gott, glaubten“. Das hebräische Verb kann sowohl Glauben als auch vertrauendes Sich-Verlassen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  choice: Doch sie hörten nicht
  rationale: שׁמע bedeutet zunächst „hören/auf jemanden hören“ und kann im Bundeskontext Gehorsam einschließen. Die schlichte deutsche Form bewahrt diese Bedeutungsbreite; „doch“ gibt den Gegensatz zum vorausgehenden Ruf Gottes wieder.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: sondern verhärteten ihren Nacken
  rationale: Die Wendung bezeichnet eigensinnigen Widerstand. „Den Nacken verhärten“ erhält das konkrete hebräische Bild und ist im Deutschen verständlich und würdevoll.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: wie den Nacken ihrer Vorfahren
  rationale: Der hebräische Text vergleicht ausdrücklich ihren Nacken mit dem Nacken der Vorfahren. Die konkrete Vergleichsstruktur bleibt daher erhalten; „Vorfahren“ ist im heutigen Deutsch natürlicher als „Väter“ und bezeichnet hier frühere Generationen.
- source_word: הֶאֱמִינוּ בַּיהוָה
  choice: auf Jahwe … vertrauten
  rationale: Der Hifil von אמן mit ב kann Glauben beziehungsweise vertrauendes Sich-Verlassen bezeichnen. „Auf … vertrauen“ klingt im Deutschen natürlich und bringt den relationalen Bundeskontext zum Ausdruck, ohne die Alternative „glauben“ auszuschließen.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Gott
  rationale: Die Zugehörigkeitsbezeichnung wird ausdrücklich beibehalten, weil sie Jahwes Bundesverhältnis zu ihnen hervorhebt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Ausgangstext ausdrücklich gebrauchte Bundesname sichtbar bleibt.
- issue: Bedeutung von הֶאֱמִינוּ בְּ
  choice: auf … vertrauten
  alternative: an … glaubten
  rationale: Beide Wiedergaben sind lexikalisch möglich. Der Haupttext verwendet das im Deutschen relationale und bundestheologisch passende „vertrauen“; die Fußnote bewahrt die echte Alternative „glauben“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das hebräische Nackenbild und der ausdrückliche Vergleich mit den Vorfahren bleiben erhalten; unnötig konfessionell geprägte Formulierungen werden vermieden.
