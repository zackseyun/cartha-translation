source:
  edition: WLC
  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: de
  text: 'Doch Jahwe warnte Israel und Juda durch jeden seiner Propheten und jeden Seher[a]: »Kehrt von euren bösen Wegen um und haltet meine Gebote und meine Satzungen gemäß der ganzen Weisung, die ich euren Vorfahren geboten habe und die ich euch durch meine Diener, die Propheten, gesandt habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe legte durch jeden seiner Propheten und jeden Seher feierlich Zeugnis gegen Israel und Juda ab.«'
    reason: Das hebräische Verb kann sowohl eindringliches Warnen als auch feierliches Zeugnisablegen gegen jemanden ausdrücken.
lexical_decisions:
- source_word: וַיָּעַד
  choice: warnte
  rationale: Das Hifil von עוּד bezeichnet hier ein eindringliches Warnen oder Bezeugen. Der folgende Umkehrruf und der Gerichtskontext sprechen für das natürliche deutsche »warnte«; die mögliche forensische Nuance wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד כָּל נביאו כָל חֹזֶה
  choice: durch jeden seiner Propheten und jeden Seher
  rationale: בְּיַד ist eine instrumentale Wendung und wird idiomatisch mit »durch« wiedergegeben. Die wiederholte distributive Bedeutung von כָּל sowie die Unterscheidung zwischen Prophet und Seher bleiben erhalten.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: Kehrt um von euren bösen Wegen
  rationale: שׁוּב bedeutet umkehren oder zurückkehren. Mit der Ergänzung »von euren bösen Wegen« gibt »Kehrt um« sowohl die räumliche Metapher als auch den moralischen Sinn wieder.
- source_word: וְשִׁמְרוּ מִצְוֺתַי חֻקּוֹתַי
  choice: und haltet meine Gebote und meine Satzungen
  rationale: שׁמר bedeutet im rechtlich-bundestheologischen Zusammenhang »halten/befolgen«. Die beiden unterschiedlichen Rechtsbegriffe werden als »Gebote« und »Satzungen« bewahrt.
- source_word: כְּכָל הַתּוֹרָה
  choice: nach der ganzen Weisung
  rationale: תּוֹרָה bezeichnet grundlegend Weisung und kann im Kontext auch Gesetz bedeuten. »Die ganze Weisung« wahrt den umfassenden Charakter von כָּל und vermeidet eine unnötige Verengung auf einen modernen Gesetzesbegriff.
- source_word: אֲבֹתֵיכֶם
  choice: eure Vorfahren
  rationale: אָבוֹת bezeichnet hier die früheren Generationen Israels. »Vorfahren« ist im heutigen Deutsch natürlich und umfasst den genealogisch-bundeshistorischen Sinn.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: und euch durch meine Diener, die Propheten, übermittelt habe
  rationale: Wörtlich steht »gesandt habe«. Da sich das Relativpronomen am ehesten auf die Weisung bezieht, gibt »übermittelt« den Sinn natürlichen Deutschs wieder; »durch« bildet erneut die instrumentale Wendung בְּיַד ab. Die Formulierung lässt zugleich den weiteren Bezug auf die prophetische Botschaft offen.
theological_decisions:
- issue: Bezug von »die ich ... übermittelt habe«
  choice: Die Relativsätze werden grammatisch an »die ganze Weisung« angeschlossen.
  alternative: Der zweite Relativsatz kann weiter gefasst auf die prophetische Botschaft oder auf die vorausgehende Aufforderung bezogen werden.
  rationale: Die unmittelbare Syntax legt »Weisung« als Bezugswort nahe. Die Formulierung erklärt jedoch nicht näher, was genau durch die Propheten übermittelt wurde, und bewahrt so die im Hebräischen verbleibende Spannung.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: Im Zusammenhang mit Geboten und Satzungen ist »Gesetz« möglich. »Weisung« bildet jedoch den weiteren hebräischen Bedeutungsumfang ab, ohne den verbindlichen Charakter abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und eindringlich formuliert. »Satzungen« und »Seher« bewahren die unterscheidbaren historischen Begriffe; »Weisung« bleibt verständlich und bildet den Bedeutungsumfang von Tora angemessen ab.
