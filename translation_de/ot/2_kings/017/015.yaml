source:
  edition: WLC
  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: de
  text: Sie verwarfen seine Ordnungen und seinen Bund, den er mit ihren Vätern geschlossen hatte, und seine Mahnungen, mit denen er sie gewarnt hatte.[a] Sie liefen dem Nichts nach und wurden selbst nichtig und folgten den Völkern rings um sie her, obwohl Jahwe ihnen geboten hatte, es ihnen nicht gleichzutun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Zeugnisse, durch die er gegen sie Zeugnis abgelegt hatte“. Das Hebräische kann sowohl feierliches Bezeugen als auch eindringliches Warnen bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Das Hebräische verwendet verwandte Wörter: Sie liefen dem Nichts nach und wurden selbst nichtig. „Das Nichts“ kann hier auf Götzen anspielen; gemeint ist etwas Leeres, Wertloses und ohne Bestand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Sie verwarfen
  rationale: מָאַס bezeichnet das Zurückweisen oder Verschmähen; „verwarfen“ gibt die bewusste Ablehnung im Bundeskontext prägnant wieder.
- source_word: חֻקָּיו
  choice: seine Ordnungen
  rationale: חֻקִּים sind verbindliche göttliche Festsetzungen. „Ordnungen“ ist im Deutschen verständlich und bewahrt den rechtlich-bundestheologischen Sinn.
- source_word: בְּרִיתוֹ ... כָּרַת
  choice: seinen Bund, den er ... geschlossen hatte
  rationale: „Einen Bund schließen“ ist die natürliche deutsche Entsprechung der hebräischen Wendung „einen Bund schneiden“.
- source_word: אֲבוֹתָם
  choice: ihren Vätern
  rationale: Gibt den ausdrücklich männlichen Plural und die feste biblische Bundesformel genau wieder.
- source_word: עֵדְוֹתָיו ... הֵעִיד בָּם
  choice: seine Mahnungen, mit denen er sie gewarnt hatte
  rationale: Das Wortfeld kann Zeugnisse oder feierliche Warnungen bezeichnen. Im Zusammenhang mit הֵעִיד vermittelt „Mahnungen“ die Funktion natürlich; die alternative formale Wiedergabe wird in einer Fußnote bewahrt.
- source_word: הַהֶבֶל ... וַיֶּהְבָּלוּ
  choice: dem Nichts ... wurden selbst nichtig
  rationale: Die Wiedergabe erhält das absichtliche Wortspiel zwischen dem nichtigen Gegenstand ihrer Verehrung und dem, was aus ihnen selbst wurde. „Nichtig“ bedeutet hier leer, wertlos und ohne Bestand, nicht bloß eitel im Sinn von selbstgefällig.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: den Völkern rings um sie
  rationale: גּוֹיִם bezeichnet hier die umliegenden Völker; die knappe Form entspricht der hebräischen Aussage.
- source_word: צִוָּה יְהוָה אֹתָם לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: obwohl Jahwe ihnen geboten hatte, es ihnen nicht gleichzutun
  rationale: „Jahwe“ gibt den Gottesnamen wieder. „Es ihnen nicht gleichzutun“ ist natürliches Deutsch und bleibt dem knappen כָּהֶם nahe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Bundesnamen.
- issue: Bezug von הֶבֶל im Zusammenhang mit fremden Völkern und deren Kult
  choice: das Nichts / nichtig
  alternative: Götzen / wurden wertlos
  rationale: Der Text kann im Kontext auf Götzen zielen, nennt sie aber mit einem Begriff für Hauch, Leere oder Nichtigkeit. Die Übersetzung wahrt diese Bildsprache und die theologische Spannung, ohne die Implikation ausdrücklich zum Haupttext zu machen.
- issue: Bedeutung von עֵדְוֹתָיו und הֵעִיד בָּם
  choice: Mahnungen, mit denen er sie gewarnt hatte
  alternative: Zeugnisse, durch die er gegen sie Zeugnis abgelegt hatte
  rationale: Die Wortfamilie erlaubt sowohl den Zeugnis- als auch den Warnaspekt. Der Haupttext gibt die kontextuelle Warnfunktion wieder; die Fußnote hält die formalere Möglichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde behutsam gegliedert, ohne die Gedankenfolge zu verändern. Das hebräische Wortspiel wurde mit „Nichts/nichtig“ bewahrt; erklärungsbedürftige Bedeutungsnuancen stehen in Fußnoten. Alle Fußnotenmarker erscheinen im Haupttext.
