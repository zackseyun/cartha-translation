id: 2KI.17.38
reference: 2 Kings 17:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/בְּרִ֛ית אֲשֶׁר כָּרַ֥תִּי אִתְּ/כֶ֖ם לֹ֣א תִשְׁכָּ֑חוּ וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: de
  text: Und den Bund, den ich mit euch geschlossen habe[a], sollt ihr nicht vergessen[b], und ihr sollt keine anderen Götter fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Bund, den ich mit euch geschnitten habe“. „Einen Bund schließen“ gibt die hebräische Redewendung im Deutschen natürlich wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Vergesst … nicht … und fürchtet keine anderen Götter.“ Die hebräischen Formen können hier als Verbot oder als bindende Anweisung wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: den Bund
  rationale: „Bund“ bewahrt den formalen und theologischen Sinn einer von Gott begründeten, bindenden Beziehung.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: den ich mit euch geschlossen habe
  rationale: Das Hebräische sagt wörtlich, einen Bund zu „schneiden“. Im Deutschen ist „einen Bund schließen“ die natürliche und zugleich bildnahe Entsprechung.
- source_word: לֹא תִשְׁכָּחוּ
  choice: sollt ihr nicht vergessen
  rationale: Die Form mit לֹא hat hier verbietenden beziehungsweise anweisenden Sinn; „sollt ihr nicht“ erhält den feierlichen Bundeston.
- source_word: וְלֹא תִירְאוּ
  choice: und ihr sollt keine … fürchten
  rationale: יָרֵא kann sowohl Furcht als auch ehrfürchtige Verehrung bezeichnen. „Fürchten“ bewahrt diese im Bundeskontext wichtige Bedeutungsbreite.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Die direkte Wiedergabe bezeichnet Götter neben dem Gott Israels und bewahrt die geläufige biblische Bundesformel.
theological_decisions:
- issue: Bundessprache und Ton der Verbote
  choice: „Den Bund … sollt ihr nicht vergessen, und ihr sollt keine anderen Götter fürchten.“
  alternative: 'Imperativisch: „Vergesst den Bund nicht … und fürchtet keine anderen Götter“; oder ירא deutender mit „verehren“ wiedergeben.'
  rationale: Die gewählte Fassung bewahrt sowohl den anweisenden Bundeston als auch die Bedeutungsbreite von „fürchten“, die emotionale Furcht und religiöse Ehrerbietung beziehungsweise Loyalität umfassen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung des Bundesgegenstands folgt der hebräischen Hervorhebung; „einen Bund schließen“ ist idiomatisches Deutsch, während „fürchten“ die theologische Spannung zwischen Angst und kultischer Ehrfurcht offenhält.
