  rationale: Die Revision präzisiert die Zugehörigkeitsbeziehung in „Priester der Kulthöhen“, gibt בית mit dem weniger spezifizierenden „Kultgebäuden“ wieder und strafft die kulturelle Anmerkung auf Informationen, die für den Begriff selbst erforderlich sind. Die umstrittene Nuance von מִקְצוֹתָם bleibt in der Anmerkung offen; weder eine Auswahl aus den Niedrigsten noch eine andere soziale Einschränkung wird in den Text eingetragen.
