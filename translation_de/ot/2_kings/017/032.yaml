  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: de
  text: Sie fürchteten Jahwe und bestellten sich aus ihren Reihen[a] Priester der Kulthöhen[b]. Diese verrichteten für sie den Dienst in den Kultgebäuden der Kulthöhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „von ihren Enden her“. Die hebräische Wendung kann eine Auswahl aus der Bevölkerung insgesamt bezeichnen; auch „aus allen ihren Gruppen“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: Kulthöhen waren örtliche Kultstätten; mit ihnen konnten Altäre und eigene Kultgebäude verbunden sein.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: sie fürchteten Jahwe
  rationale: Die Formulierung bewahrt die Grundbedeutung von ירא und damit die Spannung zwischen ihrer Furcht vor Jahwe und ihrem zugleich unrechtmäßigen Kult. „Sie verehrten Jahwe“ wäre stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִקְצוֹתָם
  choice: aus ihren eigenen Reihen
  rationale: Die idiomatische Wendung bezeichnet eine Auswahl aus der eigenen Bevölkerung. Die Übersetzung bleibt verständlich, ohne die umstrittene Deutung „aus den Niedrigsten“ festzuschreiben.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: sie bestellten sich
  rationale: עשה bezeichnet hier im Zusammenhang mit einem Amt das Einsetzen oder Bestellen von Personen; לָהֶם wird reflexiv mit „sich“ wiedergegeben.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: Priester für die Kulthöhen
  rationale: „Kulthöhen“ ist eine verständliche Wiedergabe des kultischen Fachbegriffs במות für örtliche Heiligtumsstätten.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: diese verrichteten für sie den Dienst
  rationale: Das Subjekt sind die eben eingesetzten Priester. Die periphrastische Konstruktion bezeichnet ihre fortdauernde Tätigkeit, ohne nicht ausdrücklich genannte Rituale zu ergänzen.
- source_word: בְּבֵית הַבָּמוֹת
  choice: in den Heiligtümern der Kulthöhen
  rationale: בית bezeichnet hier die zu den Kulthöhen gehörenden Kultgebäude und kann trotz seiner singularischen Form kollektiv verstanden werden. „Heiligtümer“ ist im Deutschen natürlicher als die wörtliche Form „Häuser“.
theological_decisions:
- issue: Spannung zwischen der Furcht vor Jahwe und dem Kult an den Kulthöhen
  choice: Die beiden Handlungen werden mit „und“ nebeneinandergestellt, ohne die Spannung aufzulösen.
  alternative: „Sie verehrten Jahwe, bestellten sich aber …“ oder „Sie behaupteten, Jahwe zu fürchten …“
  rationale: Der hebräische Text verbindet die Aussagen schlicht mit ו. Die Übersetzung bewahrt den auffälligen Widerspruch, ohne durch „aber“, „nur scheinbar“ oder eine andere Erklärung die Haltung der Menschen abschließend zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jahwe“ bewahrt den Gottesnamen; „Kulthöhen“ hält den kultischen Fachbegriff erkennbar. Der zweite Satz klärt auf natürliche Weise, dass die eingesetzten Priester das Subjekt der abschließenden Handlung sind.
