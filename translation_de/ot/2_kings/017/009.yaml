  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: de
  text: Die Israeliten taten heimlich Dinge, die gegen Jahwe, ihren Gott, nicht recht waren.[a] In allen ihren Städten bauten sie sich Kulthöhen[b] – vom Wachturm bis zur befestigten Stadt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Israeliten verdeckten Dinge, die in Bezug auf Jahwe, ihren Gott, nicht recht waren.« Das seltene hebräische Verb kann das Verbergen oder ein heimliches Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Kulthöhen« waren örtliche Kultstätten, die häufig mit unerlaubter Gottesverehrung verbunden waren.
    reason: cultural_note
  - marker: c
    text: 'Die Wendung »vom Wachturm bis zur befestigten Stadt« bezeichnet das ganze Land: vom kleinsten Außenposten bis zur stark befestigten Stadt.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: taten heimlich
  rationale: Das seltene Verb חפא kann ein heimliches Tun oder ein Verbergen bezeichnen. »Taten heimlich« passt syntaktisch zum folgenden Objekt דְּבָרִים und bewahrt den Aspekt des Verdeckten, ohne die seltene Form zu stark festzulegen.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: Dinge, die nicht recht waren
  rationale: Die idiomatische Wendung enthält eine moralische Wertung. Diese Wiedergabe ist verständlich und legt die Art der Verfehlungen nicht genauer fest, als es der hebräische Text tut.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: gegen Jahwe, ihren Gott
  rationale: Im Zusammenhang des Abfalls hat עַל adversative Kraft. »Gegen« gibt die Ausrichtung der Handlungen wieder; »Jahwe« steht für den Gottesnamen יהוה.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: bauten sie sich Kulthöhen
  rationale: בָּמוֹת bezeichnet örtliche Kultstätten. »Kulthöhen« bewahrt den traditionsreichen kultischen Begriff, während »sich« das selbstbezogene לָהֶם wiedergibt.
- source_word: בְּכָל עָרֵיהֶם
  choice: in allen ihren Städten
  rationale: Direkte und natürliche Wiedergabe der umfassenden Ortsangabe.
- source_word: מִמִּגְדַּל נוֹצְרִים עַד עִיר מִבְצָר
  choice: vom Wachturm bis zur befestigten Stadt
  rationale: Die beiden Pole bilden eine Merismusformel für das ganze besiedelte Land, vom kleinen bewachten Außenposten bis zum befestigten städtischen Zentrum.
theological_decisions:
- issue: Bedeutung der verborgenen Handlungen Israels
  choice: Konkrete, heimlich begangene Verfehlungen gegen Jahwe
  alternative: Das Verdecken unrichtiger Dinge in Bezug auf Jahwe oder falsche Aussagen über ihn
  rationale: Das seltene Verb lässt sowohl heimliches Handeln als auch Verbergen zu. Das Objekt »Dinge« und der anschließende Bau von Kulthöhen sprechen im Kontext für konkrete Handlungen; die Fußnote hält die lexikalische Alternative offen.
- issue: Charakter der בָּמוֹת
  choice: Kulthöhen als örtliche Kultstätten
  alternative: Allgemein »Höhen« oder interpretierend »Heiligtümer«
  rationale: »Kulthöhen« kennzeichnet die kultische Funktion, ohne eine bestimmte Bauform oder eine über den Kontext hinausgehende konfessionelle Bewertung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Israeliten« ist natürlicher als das formale »Söhne Israels«. Die seltene Verbform wird im Haupttext verständlich wiedergegeben, während die echte lexikalische Unsicherheit in Fußnote [a] erhalten bleibt. Der Gedankenstrich markiert die zusammenfassende Spannweite der abschließenden Merismusformel.
