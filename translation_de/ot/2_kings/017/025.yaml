source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: de
  text: 'Es geschah: Als sie dort zu wohnen begannen, fürchteten sie Jahwe nicht[a]. Da schickte Jahwe Löwen unter sie, die einige von ihnen töteten.


    [a] Oder: »brachten Jahwe keine Ehrfurcht entgegen«. Das hebräische Wort für »fürchten« umfasst hier auch Ehrfurcht und Bundestreue gegenüber Jahwe, nicht nur Angst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brachten Jahwe keine Ehrfurcht entgegen«. Das hebräische Wort für »fürchten« umfasst hier auch Ehrfurcht und Bundestreue gegenüber Jahwe, nicht nur Angst.'
    reason: Lexikalische Alternative und Erläuterung des Bedeutungsumfangs von ירא.
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: Als sie anfingen, dort zu wohnen
  rationale: Die Wiedergabe drückt die Anfangsphase ihres Wohnens beziehungsweise ihrer Ansiedlung natürlich aus und bewahrt sowohl den zeitlichen Sinn von בִּתְחִלַּת als auch den verbalen Gehalt von ישׁב.
- source_word: לֹא יָרְאוּ אֶת־יְהוָה
  choice: fürchteten sie Jahwe nicht
  rationale: »Jahwe fürchten« bewahrt die transparente, theologisch spannungsreiche Ausdrucksweise des Hebräischen. Gemeint ist mehr als bloße Angst; der Ausdruck schließt Ehrfurcht und Anerkennung ein, ohne ihn auf »anbeten« zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form »Jahwe« gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיְשַׁלַּח יְהוָה בָּהֶם אֶת הָאֲרָיוֹת
  choice: Da schickte Jahwe Löwen unter sie
  rationale: »Unter sie« gibt die räumliche beziehungsweise feindliche Wirkung der Präposition ב im Kontext idiomatisch wieder, ohne sie unnötig zu präzisieren.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: und diese töteten einige von ihnen
  rationale: Das Demonstrativpronomen macht den Bezug auf die Löwen im Deutschen eindeutig. »Einige von ihnen« gibt die partitive Wirkung von בָּהֶם wieder und vermeidet den falschen Eindruck, alle seien getötet worden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen direkt. »Jahwe« bewahrt diesen als persönlichen Namen; die deutsche Schreibweise ist gegenüber der englischen Form »Yahweh« zielsprachlich angemessen.
- issue: Bedeutungsumfang von ירא in Bezug auf Jahwe
  choice: Jahwe fürchten
  alternative: Jahwe Ehrfurcht entgegenbringen
  rationale: Die wörtlichere Form bewahrt die biblische Ausdrucksweise und ihre Spannung zwischen Furcht, Ehrfurcht und religiöser Anerkennung. Die Fußnote erläutert den weiteren Bedeutungsumfang, ohne ihn im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die leicht traditionelle Wendung »Jahwe fürchten« bleibt wegen ihrer textlichen und theologischen Prägnanz erhalten und wird durch eine knappe Fußnote erschlossen.
