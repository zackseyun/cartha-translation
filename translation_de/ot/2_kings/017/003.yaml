source:
  edition: WLC
  text: עָלָ֣י/ו עָלָ֔ה שַׁלְמַנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַֽ/יְהִי ל֤/וֹ הוֹשֵׁ֨עַ֙ עֶ֔בֶד וַ/יָּ֥שֶׁב ל֖/וֹ מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: de
  text: Salmanassar, der König von Assyrien, zog gegen ihn herauf, und Hoschea wurde sein Vasall[a] und zahlte ihm Tribut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wurde sein Diener«. Gemeint ist politische Unterordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: zog gegen ihn herauf
  rationale: Die militärische Wendung bezeichnet ein Vorrücken gegen jemanden. Die Formulierung bewahrt das hebräische Bewegungsbild, ohne bereits einen vollständigen Angriff ausdrücklich zu behaupten.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Salmanassar
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die Apposition bezeichnet Salmanassars Titel und Herrschaftsgebiet; mit Artikel klingt sie im modernen Deutschen natürlich.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: wurde sein Vasall
  rationale: Die Konstruktion bezeichnet einen Wechsel in politische Unterordnung. »Vasall« gibt in diesem zwischenstaatlichen Zusammenhang die Funktion von עֶבֶד genauer wieder als »Sklave« oder das missverständliche »Diener«.
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: zahlte ihm Tribut
  rationale: Im politischen Zusammenhang bezeichnet מִנְחָה die Abgabe eines untergeordneten Herrschers; »Tribut zahlen« ist dafür die natürliche moderne deutsche Wendung.
- source_word: מִנְחָה
  choice: Tribut
  rationale: Der geopolitische Kontext legt die Bedeutung einer verpflichtenden Abgabe nahe, nicht die sonst ebenfalls möglichen Bedeutungen »Geschenk« oder »Opfergabe«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bewegungsformulierung bleibt nah am Hebräischen; der politisch präzise Begriff »Vasall« vermeidet im Haupttext das im Deutschen missverständliche »Diener«.
