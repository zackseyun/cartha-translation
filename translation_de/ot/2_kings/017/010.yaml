  text: וַ/יַּצִּ֧בוּ לָ/הֶ֛ם מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: de
  text: Sie errichteten sich Kultsteine und Aschera-Pfähle[a] auf jedem hohen Hügel und unter jedem grünen Baum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ascherim«; der hebräische Ausdruck bezeichnet Kultgegenstände, die mit der Göttin Aschera verbunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: sie stellten … auf
  rationale: Das Hifil von נצב bezeichnet hier das Aufstellen beziehungsweise Errichten kultischer Gegenstände; „aufstellen“ ist natürlich und sachlich.
- source_word: לָהֶם
  choice: sich
  rationale: Der Dativ bezeichnet, dass sie die Gegenstände für den eigenen Gebrauch aufstellten; das reflexive „sich“ gibt dies idiomatisch wieder.
- source_word: מַצֵּבוֹת
  choice: Kultsteine
  rationale: Gemeint sind aufgerichtete Steine mit kultischer Funktion. „Kultsteine“ macht diese Funktion deutlich, ohne die Form unnötig festzulegen.
- source_word: וַאֲשֵׁרִים
  choice: Aschera-Pfähle
  rationale: Der Plural bezeichnet Kultgegenstände, die mit Aschera verbunden waren. „Aschera-Pfähle“ ist verständlich, wahrt den Eigennamen und wird durch eine Fußnote gegen eine zu enge Bestimmung abgesichert.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: auf jedem hohen Hügel
  rationale: Die räumliche Wendung wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: und unter jedem grünen Baum
  rationale: רַעֲנָן beschreibt frisches, üppiges Grün. „Grün“ bewahrt die vertraute Bildsprache und bleibt nah am Hebräischen.
theological_decisions:
- issue: Wiedergabe von אֲשֵׁרִים
  choice: Aschera-Pfähle
  alternative: Ascherim; Aschera-Kultbilder
  rationale: Der Ausdruck meint wahrscheinlich mit Aschera verbundene Kultobjekte, deren genaue Gestalt nicht sicher ist. Die gewählte Form bleibt verständlich; die Fußnote bewahrt die sachliche Unsicherheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „auf“ ist grammatisch erforderlich, wirkt jedoch durch die Distanz zwischen Verbzusatz und Ortsangabe natürlich. Kultische Begriffe werden präzise, aber allgemein verständlich wiedergegeben.
