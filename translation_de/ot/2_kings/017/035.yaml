source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: de
  text: 'Und Yahweh schloss mit ihnen einen Bund und gebot ihnen: „Ihr sollt keine anderen Götter fürchten, euch nicht vor ihnen niederwerfen, ihnen nicht dienen und ihnen keine Opfer darbringen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: schloss ... einen Bund
  rationale: Die hebräische Wendung כרת ברית bedeutet idiomatisch, einen Bund zu schließen. Die deutsche Formulierung ist natürlich und bewahrt den feierlichen Charakter.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: gebot ihnen
  rationale: צוה bezeichnet ein verbindliches Gebot. Das formelhafte לֵאמֹר muss vor direkter Rede im Deutschen nicht eigens mit „indem er sprach“ wiedergegeben werden.
- source_word: לֹא תִירְאוּ
  choice: Ihr sollt ... nicht fürchten
  rationale: „Fürchten“ bewahrt die konkrete Bedeutung des Verbs und unterscheidet sie von den anschließend genannten kultischen Handlungen. „Ihr sollt nicht“ entspricht dem feierlichen Bundesgebot.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: keine anderen Götter
  rationale: אֲחֵרִים bedeutet hier „andere“. Die Verbindung mit „keine“ ist im Deutschen die natürliche Form des Verbots.
- source_word: תִשְׁתַּחֲווּ
  choice: euch ... niederwerfen
  rationale: Das Verb bezeichnet das körperliche Niederwerfen beziehungsweise Sichverbeugen und wird nicht allgemein zu „anbeten“ verflacht.
- source_word: תַעַבְדוּם
  choice: ihnen ... dienen
  rationale: „Dienen“ gibt עבד direkt wieder und hält diese Handlung vom Niederwerfen und Opfern unterschieden.
- source_word: תִזְבְּחוּ לָהֶם
  choice: ihnen keine Opfer darbringen
  rationale: זבח bezeichnet das Opfern. „Opfer darbringen“ ist im modernen, würdigen Deutsch idiomatischer als „ihnen opfern“ und wahrt den kultischen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ירא gegenüber den folgenden Kultverben
  choice: fürchten
  alternative: verehren
  rationale: Die konkrete Bedeutung „fürchten“ bleibt bestehen; eine Wiedergabe mit „verehren“ würde die Spannung zum religiösen Gebrauch des Verbs auflösen und die folgenden Handlungen semantisch vorwegnehmen.
- issue: Kraft der Verbote im Bundeskontext
  choice: Ihr sollt ... nicht
  alternative: Fürchtet nicht ...
  rationale: Die Soll-Formulierung vermittelt im Deutschen den feierlichen und verbindlichen Charakter der innerhalb des Bundes erteilten Gebote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Bundeston. Die Aufzählung bleibt knapp und parallel; „niederwerfen“, „dienen“ und „Opfer darbringen“ werden als unterschiedliche Handlungen erhalten.
