  to: bis Jahwe Israel aus seiner Gegenwart entfernte[a], genau wie er durch alle seine Diener, die Propheten,[b] geredet hatte. So wurde Israel aus seinem Land nach Assyrien verschleppt, bis zum heutigen Tag.
