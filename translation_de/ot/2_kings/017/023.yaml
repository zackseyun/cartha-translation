  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: de
  text: bis Jahwe Israel aus seiner Gegenwart entfernte[a], genau wie er durch alle seine Diener, die Propheten,[b] geredet hatte. So wurde Israel aus seinem Land nach Assyrien verschleppt, bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „von vor seinem Angesicht weg“; gemeint ist die Entfernung aus Jahwes Gegenwart.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „durch die Hand aller seiner Diener, der Propheten“, das heißt: durch ihre Vermittlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: entfernte
  rationale: Der Hifil von סור bezeichnet hier das Veranlassen des Fortgehens. „Entfernte“ bewahrt die kausative Bedeutung, ohne über den Wortlaut hinaus eine bestimmte Form der Verbannung festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im modernen Deutschen übliche Wiedergabe des Gottesnamens JHWH.
- source_word: מֵעַל פָּנָיו
  choice: aus seiner Gegenwart
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „von vor seinem Angesicht weg“. „Aus seiner Gegenwart“ gibt das räumlich-personale Bild in natürlichem Deutsch wieder; die wörtlichere Ausdrucksweise wird in der Fußnote genannt.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: genau wie er es … angekündigt hatte
  rationale: כַּאֲשֶׁר drückt die Entsprechung aus. Im Zusammenhang prophetischer Warnungen vermittelt „angekündigt hatte“ den Sinn von דִּבֶּר natürlicher als das allgemeinere „gesprochen hatte“.
- source_word: בְּיַד
  choice: durch
  rationale: Die wörtliche Wendung „durch die Hand“ ist ein hebräisches Mittel zur Bezeichnung von Vermittlung oder Urheberschaft. Das deutsche „durch“ gibt ihre Funktion klar wieder.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: alle seine Diener, die Propheten
  rationale: Die Apposition bezeichnet die Propheten als Jahwes Diener und bleibt durch die Kommas im Deutschen eindeutig.
- source_word: וַיִּגֶל
  choice: wurde … verschleppt
  rationale: גלה bezeichnet in diesem geschichtlichen Zusammenhang die erzwungene Deportation. „Wurde verschleppt“ macht diesen Vorgang deutlicher als das abstraktere „ging ins Exil“.
- source_word: מֵעַל אַדְמָתוֹ
  choice: aus seinem Land
  rationale: אַדָמָה bezeichnet hier das eigene Territorium Israels. Das grammatische Maskulinum des kollektiven Namens „Israel“ wird im Deutschen mit „seinem“ beibehalten.
- source_word: אַשּׁוּרָה
  choice: nach Assyrien
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf Assyrien zu; „nach Assyrien“ ist dafür die natürliche deutsche Form.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Dies ist die geläufige deutsche Wiedergabe der hebräischen Zeitformel und lässt ihren Bezug auf die fortdauernde Exilssituation offen.
theological_decisions:
- issue: Die Entfernung Israels מֵעַל פָּנָיו als Ausdruck göttlichen Gerichts
  choice: aus seiner Gegenwart
  alternative: vor seinem Angesicht weg
  rationale: Die Formulierung bewahrt den personalen und gerichtlichen Charakter des Geschehens, ohne näher zu bestimmen, in welchem theologischen Sinn Israel außerhalb von Gottes Gegenwart sein könne. Die Fußnote hält das konkrete hebräische Bild fest.
- issue: Bezug der Zeitangabe „bis zum heutigen Tag“
  choice: Die Zeitangabe bleibt am Ende des Exilsatzes stehen.
  alternative: Explizite Ergänzung wie „und blieb dort“
  rationale: Der hebräische Wortlaut nennt keine eigene Form von „bleiben“. Die knappe Endstellung erhält die mögliche Beziehung zur fortdauernden Verschleppung beziehungsweise Exilslage, ohne eine erklärende Aussage hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nahe am hebräischen Gedankengang, während schwer verständliche hebräische Idiome im Haupttext natürlich wiedergegeben und in den Fußnoten dokumentiert werden. Der Gedankenstrich vor der abschließenden Zeitangabe wahrt deren Nachdruck und knappen Anschluss.
