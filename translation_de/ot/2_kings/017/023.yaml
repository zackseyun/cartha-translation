  naturalness: Der Text ist modernes, würdiges Standarddeutsch. „wie er es durch alle seine Diener, die Propheten, angekündigt hatte“ ist verständlich, doch „wie er durch alle seine Diener, die Propheten, geredet hatte“ ist quellennäher und stilistisch idiomatisch. Der Gedankenstrich vor der Zeitformel ist möglich, aber ein Komma fügt sich unauffälliger in den Satz.
  terminology: „Jahwe“, „Diener, die Propheten“, „verschleppt“, „Land“ und „Assyrien“ sind angemessen. Die Fußnote zu בְּיַד muss an der Wiedergabe von „durch“ beziehungsweise bei „Propheten“ stehen, nicht am Verb der Redehandlung.
