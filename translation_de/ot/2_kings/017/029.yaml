source:
  edition: WLC
  text: וַ/יִּהְי֣וּ עֹשִׂ֔ים גּ֥וֹי גּ֖וֹי אֱלֹהָ֑י/ו וַ/יַּנִּ֣יחוּ בְּ/בֵ֣ית הַ/בָּמ֗וֹת אֲשֶׁ֤ר עָשׂוּ֙ הַ/שֹּׁ֣מְרֹנִ֔ים גּ֥וֹי גּוֹי֙ בְּ/עָ֣רֵי/הֶ֔ם אֲשֶׁ֛ר הֵ֥ם יֹשְׁבִ֖ים שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: de
  text: Doch jedes Volk machte sich weiterhin seine eigenen Götter und stellte sie in den Höhenheiligtümern auf, welche die Einwohner Samarias[a] errichtet hatten – jedes Volk in den Städten, in denen es wohnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Samaritaner“.'
    reason: Alternative Wiedergabe der regionalen Bezeichnung הַשֹּׁמְרֹנִים.
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: machte sich weiterhin
  rationale: Die Verbindung von היה mit Partizip bezeichnet hier eine fortdauernde oder gewohnheitsmäßige Handlung in der Vergangenheit. „Machte sich weiterhin“ gibt diesen Verlauf natürlich wieder.
- source_word: גּוֹי גּוֹי
  choice: jedes Volk
  rationale: 'Die Wiederholung hat distributive Bedeutung: Jedes einzelne Volk handelte für sich.'
- source_word: אֱלֹהָיו
  choice: seine eigenen Götter
  rationale: Das Suffix bezieht sich distributiv auf גּוֹי. „Eigene“ verdeutlicht, dass die verschiedenen Völker jeweils ihre besonderen Gottheiten herstellten.
- source_word: וַיַּנִּיחוּ
  choice: stellte sie … auf
  rationale: Das Verb bedeutet hier „hinstellen, platzieren“. Im Zusammenhang mit Kultbildern ist „aufstellen“ im Deutschen idiomatisch.
- source_word: בְּבֵית הַבָּמוֹת
  choice: in den Höhenheiligtümern
  rationale: Der wörtliche Ausdruck „Haus der Höhen“ bezeichnet ein Heiligtumsgebäude an einer Kulthöhe. „Höhenheiligtümer“ ist präzise und in modernem Bibeldeutsch verständlich.
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: welche die Einwohner Samarias errichtet hatten
  rationale: „Einwohner Samarias“ gibt die regionale Bezeichnung wieder, ohne vorschnell die später bekannte religiöse Gemeinschaft der Samaritaner anzunehmen. Das Plusquamperfekt macht die zeitliche Vorordnung im Deutschen deutlich.
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: in den Städten, in denen es wohnte
  rationale: Die singularische Form „es“ nimmt das distributive „jedes Volk“ wieder auf. Dadurch bleiben Besitz- und Ortsbezug ohne schwerfällige Wiederholung erkennbar.
theological_decisions:
- issue: Wiedergabe von הַשֹּׁמְרֹנִים
  choice: die Einwohner Samarias
  alternative: die Samaritaner
  rationale: Im historischen Kontext kann die Bezeichnung schlicht die Bewohner Samarias meinen. Die Hauptübersetzung vermeidet daher mögliche spätere konfessionelle Assoziationen; die direktere traditionelle Wiedergabe bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die nachgestellte distributive Präzisierung des Hebräischen lesbar ab. „Höhenheiligtümer“ wahrt den kultischen Sachbezug, ohne die hebräische Wendung unnatürlich wörtlich wiederzugeben.
