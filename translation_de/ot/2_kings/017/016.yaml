  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: de
  text: 'Sie verließen alle Gebote Yahwehs, ihres Gottes, und machten sich ein gegossenes Bild: zwei Kälber. Sie machten eine Aschera[a], warfen sich vor dem ganzen Heer des Himmels nieder und dienten dem Baal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Aschera-Pfahl“. Das hebräische Wort kann die kanaanäische Göttin Aschera oder einen ihr zugeordneten Kultgegenstand bezeichnen.'
    reason: Lexikalische Mehrdeutigkeit zwischen Gottheit und Kultgegenstand.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: sie verließen
  rationale: עזב bezeichnet hier die entschiedene Abkehr von den Bundesgeboten. „Verließen“ ist im Deutschen natürlich und gewinnt im Kontext die nötige Stärke.
- source_word: כָּל מִצְוֺת
  choice: alle Gebote
  rationale: Bewahrt sowohl die Gesamtheit als auch den bundesbezogenen Sinn von מִצְוֺת.
- source_word: יְהוָה אֱלֹהֵיהֶם
  choice: Yahwehs, ihres Gottes
  rationale: Der Gottesname wird als „Yahweh“ wiedergegeben; das Possessivsuffix in אֱלֹהֵיהֶם bleibt durch „ihres Gottes“ ausdrücklich erhalten.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: sie machten sich
  rationale: Das Dativpronomen bezeichnet die Herstellung für den eigenen kultischen Gebrauch; die deutsche Wendung „sich machen“ gibt dies knapp wieder.
- source_word: מַסֵּכָה שנים עֲגָלִים
  choice: gegossene Bilder, nämlich zwei Kälber
  rationale: מַסֵּכָה bezeichnet ein durch Gießen hergestelltes Bild. Die erläuternde Formulierung identifiziert die Bilder als zwei Kälber und gibt den sachlichen Pluralsinn natürlich wieder, ohne den konkreten Herstellungsbezug zu verlieren.
- source_word: אֲשֵׁירָה
  choice: eine Aschera
  rationale: Die Bezeichnung bleibt transliteriert, weil sie sowohl die kanaanäische Göttin als auch ihren Kultgegenstand meinen kann. Das Verb „machen“ legt den Kultgegenstand nahe, entscheidet die lexikalische Mehrdeutigkeit aber nicht vollständig.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: warfen sich … nieder
  rationale: Gibt die körperliche Handlung des Sich-Niederwerfens wieder und unterscheidet sie vom folgenden kultischen Dienen.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: vor dem ganzen Heer des Himmels
  rationale: Die feste Wendung bezeichnet die Gesamtheit der Himmelskörper beziehungsweise himmlischen Mächte. „Heer des Himmels“ bewahrt das Bild des Ausgangstextes.
- source_word: וַיַּעַבְדוּ אֶת הַבָּעַל
  choice: dienten dem Baal
  rationale: עבד bezeichnet hier kultischen Dienst. Der Artikel wird im Deutschen mit „dem Baal“ idiomatisch und quellennah wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Deutung von אֲשֵׁירָה
  choice: eine Aschera
  alternative: ein Aschera-Pfahl; die Göttin Aschera
  rationale: Da das hebräische Wort die Göttin oder ihren Kultgegenstand bezeichnen kann, bleibt die Bezeichnung im Haupttext offen; eine Fußnote erläutert die Mehrdeutigkeit.
- issue: Numerus und Verhältnis von מַסֵּכָה zu שנים עֲגָלִים
  choice: gegossene Bilder, nämlich zwei Kälber
  alternative: ein gegossenes Bild – zwei Kälber
  rationale: Die hebräische Form מַסֵּכָה ist formal Singular, wird aber unmittelbar durch „zwei Kälber“ erläutert. Die gewählte Form gibt den erkennbaren sachlichen Plural verständlich wieder, ohne eine zusätzliche theologische Deutung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am hebräischen Berichtsstil, wird aber durch einen Satzpunkt gegliedert. „Sich niederwerfen“ und „dienen“ bewahren die Unterscheidung der beiden kultischen Handlungen.
