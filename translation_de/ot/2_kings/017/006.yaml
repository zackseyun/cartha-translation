  text: בִּ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/הוֹשֵׁ֗עַ לָכַ֤ד מֶֽלֶךְ אַשּׁוּר֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֶּ֥גֶל אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יֹּ֨שֶׁב אֹתָ֜/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: de
  text: Im neunten Regierungsjahr Hoscheas[a] nahm der König von Assyrien Samaria ein, verschleppte Israel nach Assyrien und siedelte sie in Halah an, am Habor, dem Fluss von Gosan[b], sowie in den Städten Mediens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Im neunten Jahr Hoscheas“, das heißt im neunten Jahr seiner Herrschaft.'
    reason: implicit_context
  - marker: b
    text: 'Oder: „und beim Habor, dem Fluss von Gosan“. Die hebräische Formulierung kann eine Ansiedlung entlang des Habor in der Gegend von Gosan bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: Im neunten Regierungsjahr Hoscheas
  rationale: Die Wendung bezeichnet das neunte Jahr der Herrschaft Hoscheas. „Regierungsjahr“ macht den im Kontext klaren Bezug im Deutschen natürlich und präzise sichtbar.
- source_word: לָכַד
  choice: nahm … ein
  rationale: Bei einer Stadt bezeichnet das Verb ihre militärische Eroberung; „eine Stadt einnehmen“ ist die geläufige deutsche Wiedergabe.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Gibt die hebräische Status-constructus-Verbindung klar und idiomatisch wieder.
- source_word: וַיֶּגֶל אֶת יִשְׂרָאֵל אַשּׁוּרָה
  choice: verschleppte Israel nach Assyrien
  rationale: Das Hifil von גלה bezeichnet hier die erzwungene Wegführung ins Exil. „Verschleppte“ bringt den Zwang deutlicher zum Ausdruck als das neutralere „führte weg“, ohne moderne Verwaltungssprache zu verwenden.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Bewahrt die kollektive Bezeichnung des Volkes beziehungsweise Reiches, statt sie erläuternd in „die Israeliten“ aufzulösen.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: und siedelte sie … an
  rationale: Das Hifil von ישׁב bedeutet, jemanden wohnen zu lassen beziehungsweise anzusiedeln. „Ansiedeln“ passt natürlich zum Zusammenhang der Deportation.
- source_word: בַּחְלַח
  choice: in Halach
  rationale: Übliche deutsche Umschrift des Ortsnamens mit der vom Präfix ausgedrückten Ortsangabe.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: am Habor, dem Fluss von Gosan
  rationale: Da Habor durch die folgende Apposition als Fluss bestimmt wird, ist „am Habor“ im Deutschen idiomatisch. „Dem Fluss von Gosan“ wahrt die hebräische Zuordnung, ohne sie geografisch enger festzulegen.
- source_word: וְעָרֵי מָדָי
  choice: sowie in den Städten Mediens
  rationale: „Mediens“ ist die natürliche deutsche Gebietsbezeichnung im Genitiv; „sowie“ gliedert die abschließende Ortsangabe lesbar, ohne ihren gleichgeordneten Charakter zu verändern.
