  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: die Völker stehen in religiöser Beziehung zu Jahwe und leisten zugleich ihren geschnitzten Kultbildern Dienst; die Praxis setzt sich über Generationen fort. „So lebten ... in Ehrfurcht“ ist jedoch weniger unmittelbar als die hebräische Prädikation, und „schon“ fügt eine im Ausgangstext nicht ausgedrückte Hervorhebung hinzu.'
  naturalness: Der Entwurf ist gut verständliches modernes Standarddeutsch. Eine leicht gestraffte Formulierung mit „hatten Ehrfurcht vor“ und „dienten aber“ ist idiomatischer und macht die vom Text präsentierte Spannung klar, ohne ihren Charakter theologisch zu deuten.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Schnitzbildern“ ist eine präzise Wiedergabe von פסילים; die Fußnote bietet mit „Götzenbildern“ eine hilfreiche, aber weniger spezifische Alternative. „Väter“ sollte statt des verallgemeinernden „Vorfahren“ stehen, da dies die konkrete hebräische Verwandtschaftsbezeichnung bewahrt.
