base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: de
  text: So hatten diese Völker Ehrfurcht vor Jahwe, dienten aber ihren Schnitzbildern.[a] Auch ihre Kinder und Kindeskinder tun bis zum heutigen Tag, wie ihre Väter es taten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihren Götzenbildern. Das hebräische Wort bezeichnet ausdrücklich Bilder, die geschnitzt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: So lebten
  rationale: Die Form führt die Erzählung zu einem zusammenfassenden Ergebnis. Zusammen mit den Partizipien bezeichnet sie den fortdauernden Zustand bzw. die beständige Praxis.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: diese Völker
  rationale: Gemeint sind die verschiedenen fremden Volksgruppen, die in Samaria angesiedelt worden waren.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: in Ehrfurcht vor Jahwe
  rationale: Die Wendung bezeichnet religiöse Furcht bzw. Verehrung. Diese Formulierung ist im heutigen Deutsch verständlich und lässt den genauen Charakter ihrer Gottesfurcht offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als Jahwe wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאֶת פְּסִילֵיהֶם הָיוּ עֹבְדִים
  choice: und dienten zugleich ihren Schnitzbildern
  rationale: פְּסִילִים bezeichnet speziell geschnitzte Kultbilder; עבד beschreibt hier den dauerhaften kultischen Dienst. „Zugleich“ verdeutlicht die im Nebeneinander liegende Spannung, ohne sie zu erklären.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: Auch ihre Kinder und Kindeskinder
  rationale: Die genealogische Formel bezeichnet die nachfolgenden Generationen; „Kindeskinder“ wahrt das hebräische Bild und klingt würdevoll.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם הֵם עֹשִׂים
  choice: tun …, was schon ihre Vorfahren taten
  rationale: Die deutsche Satzstellung gibt den Vergleich natürlich wieder; das Präsens bewahrt den fortdauernden Charakter des Partizips עֹשִׂים.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Natürliche deutsche Wiedergabe der festen hebräischen Zeitformel.
theological_decisions:
- issue: Nebeneinander von Jahwefurcht und Bilderdienst
  choice: „in Ehrfurcht vor Jahwe und dienten zugleich ihren Schnitzbildern“
  alternative: „verehrten Jahwe, dienten aber ihren Götzen“ oder eine Deutung ihrer Ehrfurcht als bloßen Schein
  rationale: Der hebräische Text stellt beides nebeneinander, ohne die Ehrfurcht ausdrücklich als aufrichtig, unecht oder rein äußerlich zu bewerten. Die Übersetzung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In Ehrfurcht vor“ ist natürlicher als das potenziell missverständliche „fürchteten“, während „Schnitzbilder“ den konkreten Charakter des hebräischen Ausdrucks erhält.
