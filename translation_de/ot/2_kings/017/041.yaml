  to: So hatten diese Völker Ehrfurcht vor Jahwe, dienten aber ihren Schnitzbildern.[a] Auch ihre Kinder und Kindeskinder tun bis zum heutigen Tag, wie ihre Väter es taten.
  rationale: Die Revision bildet die unmittelbare Aussage über die Ehrfurcht vor Jahwe genauer ab, erhält durch „aber“ die im Nebeneinander der beiden kultischen Handlungen liegende Spannung und gibt den generationsbezogenen Vergleich ohne zusätzliche zeitliche Akzentuierung wieder.
