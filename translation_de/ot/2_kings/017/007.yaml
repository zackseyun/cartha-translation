  terminology: „Yahweh“, „ihren Gott“, „gesündigt“, „heraufgeführt“ und „andere Götter gefürchtet“ sind quellennahe und terminologisch konsistent. Die Fußnote zu „gefürchtet“ wahrt den weiteren Bedeutungsumfang von ירא, ohne die Hauptübersetzung zu verengen.
