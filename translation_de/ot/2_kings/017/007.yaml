  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: de
  text: Und dies geschah, weil die Israeliten gegen Yahweh, ihren Gott, gesündigt hatten, der sie aus dem Land Ägypten, aus der Gewalt des Pharaos, des Königs von Ägypten[a], heraufgeführt hatte, und weil sie andere Götter gefürchtet hatten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter der Hand des Pharaos“. Gemeint ist seine Herrschaft oder Macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „andere Götter verehrt“. Das hebräische Verb bedeutet „fürchten“ und kann auch ehrfürchtige, gottesdienstliche Verehrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Und dies geschah, weil
  rationale: Die Wendung leitet eine rückblickende Begründung ein. Diese Wiedergabe wahrt die kausale Funktion von כִּי und klingt in modernem Deutsch natürlich.
- source_word: חָטְאוּ ... לַיהוָה
  choice: gegen Yahweh ... gesündigt hatten
  rationale: חטא mit ל bezeichnet hier ein Sündigen gegen jemanden. Das Plusquamperfekt entspricht der rückblickenden Erklärung des Geschehens.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich heißt die Wendung „die Söhne/Kinder Israels“; als Volksbezeichnung ist „die Israeliten“ im heutigen Deutsch klarer und natürlicher, ohne den Sinn zu verändern.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Gott
  rationale: Die Possessivform wird direkt wiedergegeben und bewahrt den im Vers betonten Bundesbezug.
- source_word: הַמַּעֲלֶה אֹתָם
  choice: der sie ... heraufgeführt hatte
  rationale: Das substantivisch gebrauchte Partizip beschreibt Yahweh durch sein rettendes Handeln. „Heraufführen“ bewahrt die Bewegungsrichtung des hebräischen Verbs עלה.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Dies ist eine genaue und idiomatische Wiedergabe der geografischen Herkunftsangabe.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: aus der Gewalt des Pharaos
  rationale: Das hebräische Bild „unter der Hand“ bezeichnet Herrschaft oder Macht. „Aus der Gewalt“ gibt die Bedeutung im Deutschen natürlich wieder; das Bild wird in einer Fußnote dokumentiert.
- source_word: וַיִּירְאוּ
  choice: sie ... gefürchtet hatten
  rationale: ירא bedeutet im Kern „fürchten“ und kann gegenüber Göttern ehrfürchtige, kultische Verehrung einschließen. Die Hauptübersetzung wahrt die lexikalische Breite.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Die schlichte Wiedergabe entspricht dem hebräischen Ausdruck und seiner bundesbezogenen Sprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text stehende Bundesname wird als „Yahweh“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von וַיִּירְאוּ אֱלֹהִים אֲחֵרִים
  choice: andere Götter gefürchtet
  alternative: andere Götter verehrt / angebetet
  rationale: Der Kontext schließt kultische Verehrung ein, doch das hebräische Verb lautet „fürchten“. Die Übersetzung bewahrt diese weitere Ausdrucksweise und nennt die interpretierende Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Israeliten“ vermeidet die im Deutschen weniger natürliche Volksbezeichnung „Kinder Israels“. Die Satzstruktur bleibt der begründenden Einheit des hebräischen Verses nahe; idiomatische Glättung erfolgt besonders bei „unter der Hand“.
