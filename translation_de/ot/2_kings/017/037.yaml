  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: de
  text: Und die Satzungen, die Rechtsbestimmungen, die Weisung und das Gebot, die er für euch aufgeschrieben hat,[a] sollt ihr allezeit beachten und tun.[b] Andere Götter aber sollt ihr nicht fürchten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Verordnungen, die Rechtsentscheide, das Gesetz und den Befehl“. Das Hebräische reiht vier einander überschneidende Begriffe für verbindliche Weisung und Recht aneinander.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sollt ihr bewahren, um zu tun, alle Tage“. Die hebräische Verbindung bezeichnet sorgfältiges Beachten, das sich im Tun verwirklicht.'
    reason: lexical_alternative
  - marker: c
    text: „Fürchten“ kann hier ehrfürchtige Loyalität und kultische Verehrung einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: „Satzungen“ gibt den Charakter festgesetzter Ordnungen wieder und hält den Begriff von den folgenden Rechtsbezeichnungen unterscheidbar.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet rechtliche Entscheidungen beziehungsweise verbindliche Rechtsnormen; „Rechtsbestimmungen“ wahrt den juristischen Ton und klingt im heutigen Deutsch natürlich.
- source_word: הַתּוֹרָה
  choice: die Weisung
  rationale: תּוֹרָה bedeutet grundlegend „Weisung/Unterweisung“. In dieser Reihe bewahrt „Weisung“ den eigenständigen Sinn, ohne den Begriff vorschnell auf ein modernes Gesetzeskonzept zu verengen.
- source_word: הַמִּצְוָה
  choice: das Gebot
  rationale: Der hebräische Begriff steht im Singular. „Gebot“ ist die natürliche, würdige und formgetreue deutsche Entsprechung.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: die er für euch aufgeschrieben hat
  rationale: Das maskuline Singularsubjekt bleibt entsprechend dem Hebräischen als „er“ stehen; der Kontext identifiziert es, ohne dass im Vers ausdrücklich „der HERR“ ergänzt werden muss. Das Relativpronomen bezieht sich im Deutschen auf die gesamte Aufzählung.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: sollt ihr gewissenhaft befolgen
  rationale: Die Verbindung von „bewahren/beachten“ und „tun“ bezeichnet sorgfältige Beachtung, die praktisch ausgeführt wird. „Gewissenhaft befolgen“ bringt beide Komponenten in natürlichem Deutsch zusammen.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Die wörtliche Wendung „alle Tage“ hat durative Bedeutung. „Allezeit“ gibt diese ohne einen im Hebräischen nicht ausdrücklich vorhandenen Possessivzusatz idiomatisch wieder.
- source_word: תִירְאוּ
  choice: fürchten
  rationale: „Fürchten“ wahrt die Bedeutungsbreite von ירא zwischen Furcht und ehrfürchtiger, kultischer Loyalität; der Kontext macht deutlich, dass es um die Haltung gegenüber anderen Göttern geht.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Dies ist die direkte und herkömmliche Wiedergabe der hebräischen Bezeichnung für Gottheiten neben dem HERRN.
theological_decisions:
- issue: Wiedergabe der vierfachen bundestheologischen Rechtsbegriff-Reihe
  choice: 'Vier unterschiedliche Begriffe beibehalten: „Satzungen, Rechtsbestimmungen, Weisung und Gebot“'
  alternative: Die Reihe zu „Gesetze und Gebote“ zusammenziehen
  rationale: Die bewusste Häufung im Hebräischen verleiht der umfassenden Verpflichtung rhetorisches Gewicht. Eine Zusammenfassung würde diese Wirkung und die begrifflichen Unterschiede einebnen.
- issue: Subjekt von „die er für euch aufgeschrieben hat“
  choice: Das Pronomen „er“ im Haupttext beibehalten
  alternative: „die der HERR für euch aufgeschrieben hat“
  rationale: Aus dem Zusammenhang ist der HERR als Subjekt erkennbar, doch der vorliegende Vers nennt ihn an dieser Stelle nicht ausdrücklich. Die Übersetzung vermeidet daher eine erklärende Ergänzung.
- issue: Bedeutung von „fürchten“ gegenüber anderen Göttern
  choice: Den offenen Ausdruck „fürchten“ bewahren und in einer Fußnote erläutern
  alternative: Im Haupttext eindeutig mit „verehren“ oder „anbeten“ wiedergeben
  rationale: Das hebräische Verb umfasst sowohl Furcht als auch ehrfürchtige Verehrung und Loyalität. Die direkte Wiedergabe bewahrt diese theologisch bedeutsame Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die viergliedrige Rechtswortreihe bleibt erhalten, wird aber mit heute verständlichen Begriffen formuliert. „Allezeit gewissenhaft befolgen“ vermeidet die unnatürliche wörtliche Syntax, ohne den Aspekt des Bewahrens und Tuns aufzugeben. Der adversative Anschluss mit „aber“ macht den hebräischen Kontrast im Deutschen deutlich.
