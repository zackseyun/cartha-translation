  text: וַ/יַּ֥עַל מֶֽלֶךְ אַשּׁ֖וּר בְּ/כָל הָ/אָ֑רֶץ וַ/יַּ֨עַל֙ שֹׁמְר֔וֹן וַ/יָּ֥צַר עָלֶ֖י/הָ שָׁלֹ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: de
  text: Da zog der König von Assyrien durch das ganze Land. Er zog gegen Samaria und belagerte die Stadt drei Jahre lang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog
  rationale: עלה bezeichnet wörtlich ein Hinaufziehen, wird in militärischen Erzählungen aber häufig für das Vorrücken eines Heeres gebraucht. „zog“ gibt dies im Deutschen natürlich wieder, ohne die Handlung unnötig als Angriff auszudeuten.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die Status-constructus-Verbindung wird idiomatisch wiedergegeben; der bestimmte Artikel entspricht dem im Zusammenhang bekannten Herrscher.
- source_word: בְּכָל הָאָרֶץ
  choice: durch das ganze Land
  rationale: Die Präposition ב bezeichnet hier am ehesten die Bewegung durch beziehungsweise über das gesamte Gebiet. Die Formulierung wahrt den räumlichen Umfang, ohne die genaue Art des militärischen Vorgehens festzulegen.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: Er zog gegen Samaria
  rationale: עלה mit einer Stadt im militärischen Zusammenhang kann das Vorrücken gegen sie bezeichnen. Der folgende Belagerungssatz stützt die feindliche Bedeutung von „gegen“.
- source_word: וַיָּצַר עָלֶיהָ
  choice: belagerte die Stadt
  rationale: צור bezeichnet hier das Belagern einer befestigten Stadt. „die Stadt“ stellt im Deutschen den Bezug auf Samaria klar und vermeidet ein potenziell missverständliches feminines Pronomen.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: drei Jahre lang
  rationale: Die deutsche Zeitangabe „drei Jahre lang“ gibt die Dauer idiomatisch und präzise wieder.
