  text: וַ/יַּֽעַבְד֖וּ הַ/גִּלֻּלִ֑ים אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם לֹ֥א תַעֲשׂ֖וּ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: de
  text: 'Sie dienten den Götzen[a], von denen Jahwe ihnen gesagt hatte: »Das sollt ihr nicht tun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist eine verächtliche Bezeichnung für Götzen und kann sinngemäß etwa »Mistgötzen« oder »abscheuliche Götzen« bedeuten.
    reason: Die stark abwertende Färbung von גִּלֻּלִים lässt sich mit dem natürlichen deutschen Wort »Götzen« allein nicht vollständig wiedergeben.
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: Sie dienten
  rationale: עבד bedeutet grundsätzlich »dienen« und bezeichnet hier den kultischen Dienst an fremden Göttern. »Dienten« bewahrt zugleich die im Hebräischen wichtige Verbindung zwischen Dienst und Gottesverehrung.
- source_word: הַגִּלֻּלִים
  choice: den Götzen
  rationale: גִּלֻּלִים ist eine stark abwertende Bezeichnung für Götzenbilder. »Götzen« ist im deutschen Haupttext klar und idiomatisch; die noch gröbere Färbung des hebräischen Ausdrucks wird in einer Fußnote erläutert.
- source_word: אֲשֶׁר
  choice: von denen
  rationale: Das Relativwort bezieht sich hier auf die Götzen beziehungsweise den mit ihnen verbundenen Götzendienst. »Von denen … gesagt hatte« gibt diesen Bezug im Deutschen natürlich wieder, ohne einen nicht ausdrücklich vorhandenen Gegensatz einzuführen.
- source_word: אָמַר יְהוָה לָהֶם
  choice: Jahwe zu ihnen gesagt hatte
  rationale: Das Perfekt bezeichnet gegenüber der erzählten Handlung eine vorausgegangene göttliche Weisung und wird daher mit dem Plusquamperfekt wiedergegeben. Der Gottesname יהוה erscheint als »Jahwe«.
- source_word: לֹא תַעֲשׂוּ
  choice: Ihr sollt … nicht tun
  rationale: Die negative Imperfektform hat hier die Kraft eines ausdrücklichen Verbots. »Ihr sollt … nicht tun« wahrt den gebietenden Charakter und bleibt zugleich modernes, verständliches Deutsch.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: das
  rationale: Wörtlich steht »diese Sache/dieses Ding«. Im Deutschen nimmt »das« den unmittelbar genannten Götzendienst natürlich auf, ohne den Ausdruck unnötig zu vergegenständlichen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עבד im Zusammenhang mit Götzen
  choice: dienen
  alternative: anbeten; verehren
  rationale: Der Kontext schließt kultische Verehrung ein, doch »dienen« bewahrt das breitere hebräische Bedeutungsfeld und die theologische Spannung zwischen dem Dienst für Jahwe und dem Dienst für Götzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Satzstruktur, vermeidet jedoch das im Deutschen schwerfällige »diese Sache«. Der Plural »ihr« entspricht der an das Volk gerichteten Verbform.
