source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ כִּ֛י אִֽם כְּ/מִשְׁפָּטָ֥/ם הָֽ/רִאשׁ֖וֹן הֵ֥ם עֹשִֽׂים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/040.yaml
  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: de
  text: Aber sie hörten nicht darauf, sondern hielten weiter an ihrem früheren Brauch fest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sondern handelten weiter nach ihrer früheren Ordnung“. Das hebräische Wort מִשְׁפָּט kann eine Ordnung, Vorschrift oder übliche Praxis bezeichnen; hier geht es um ihre bisherige Art der Gottesverehrung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Aber … nicht
  rationale: Die Verbindung setzt die Erzählung mit einem milden Gegensatz zur vorausgehenden Weisung fort; „aber“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: שָׁמֵעוּ
  choice: hörten nicht darauf
  rationale: שׁמע kann „hören“, „zuhören“ oder „gehorchen“ bedeuten. „Darauf hören“ bewahrt sowohl den Vorgang des Hörens als auch das Nichtbefolgen, ohne vorschnell nur „gehorchen“ zu setzen.
- source_word: כִּי אִם
  choice: sondern
  rationale: Die Wendung markiert den Gegensatz „nicht X, sondern Y“.
- source_word: כְּמִשְׁפָּטָם
  choice: an ihrem … Brauch
  rationale: מִשְׁפָּט kann Rechtssatz, Ordnung oder übliche Praxis bezeichnen. Im Zusammenhang bezeichnet es ihre etablierte religiöse Verhaltensweise; „Brauch“ ist dafür verständlich und wahrt den Gewohnheitsaspekt.
- source_word: הָרִאשׁוֹן
  choice: früheren
  rationale: Das Adjektiv verweist hier auf die zuvor bestehende Art ihres Handelns beziehungsweise ihrer Gottesverehrung.
- source_word: הֵם עֹשִׂים
  choice: hielten weiter … fest
  rationale: Die Partizipialkonstruktion beschreibt fortdauerndes oder gewohnheitsmäßiges Handeln. Die idiomatische deutsche Wendung bringt dieses beharrliche Fortsetzen zum Ausdruck.
theological_decisions: []
