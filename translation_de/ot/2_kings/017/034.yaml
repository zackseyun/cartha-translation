source:
  edition: WLC
  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: de
  text: Bis zum heutigen Tag handeln sie nach den früheren Bräuchen[a]. Sie fürchten[b] Jahwe nicht und handeln weder nach ihren Satzungen und ihren Rechtsbestimmungen noch nach der Weisung und dem Gebot, die Jahwe den Söhnen Jakobs[c] gebot – Jakob, dem er den Namen Israel gab[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach den früheren Bestimmungen“ beziehungsweise „nach den früheren Gepflogenheiten“.'
    reason: lexical_alternative
  - marker: b
    text: „Jahwe fürchten“ kann auch „Jahwe ehrfürchtig achten“ bedeuten; der hebräische Ausdruck verbindet Furcht mit ehrfürchtiger Treue.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „den Söhnen Jakobs“; gemeint ist kollektiv das von Jakob abstammende Volk.'
    reason: clarification
  - marker: d
    text: Gemeint ist Jakob; siehe 1. Mose 32,29 und 35,10.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: nach den früheren Bräuchen
  rationale: מִשְׁפָּט bezeichnet je nach Zusammenhang Recht, Bestimmung oder übliche Praxis. Hier verweist der Ausdruck auf die zuvor beschriebenen überkommenen religiösen Praktiken; „Bräuche“ gibt diesen Sinn natürlich wieder.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: sie fürchten Jahwe
  rationale: Das hebräische Idiom umfasst sowohl Furcht als auch ehrfürchtige, bundestreue Hinwendung. „fürchten“ bewahrt diese Spannung und die vertraute biblische Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Umschrift.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: nach ihren Satzungen und ihren Rechtsbestimmungen
  rationale: Die beiden mit Suffix versehenen Rechtsbegriffe werden als Paar wiedergegeben. Das wiederholte „ihren“ erhält die pronominale Form des Hebräischen, ohne den möglichen Bezug der Pronomen im Text festzulegen.
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: noch nach der Weisung und dem Gebot
  rationale: תּוֹרָה kann „Weisung“ oder „Gesetz“ bedeuten. „Weisung“ bewahrt den breiteren Sinn; מִצְוָה bleibt entsprechend dem Hebräischen im Singular. „weder … noch“ bildet die Reichweite der Verneinung idiomatisch ab.
- source_word: בְּנֵי יַעֲקֹב
  choice: den Söhnen Jakobs
  rationale: Die formnahe Wiedergabe erhält den maskulinen Plural, der hier kollektiv die von Jakob abstammende Gemeinschaft bezeichnet.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: Jakob, dem er den Namen Israel gab
  rationale: Die Apposition macht im Deutschen verständlich, dass sich die singularische Aussage auf Jakob bezieht, und gibt die Namensverleihung idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den persönlichen Gottesnamen. Die Umschrift bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von „ihren Satzungen und ihren Rechtsbestimmungen“
  choice: Den pronominalen Bezug im Haupttext offenlassen
  alternative: Die Wendung ausdrücklich entweder auf die beschriebenen Völker oder auf Israels Satzungen beziehen
  rationale: Die hebräischen Formen tragen lediglich ein Suffix der dritten Person Plural. Eine ausdrückliche Identifizierung des Besitzers würde eine im Wortlaut nicht völlig aufgelöste Bezugsspannung entscheiden; daher bleibt „ihren“ stehen.
- issue: Bedeutungsumfang von ירא in Bezug auf Jahwe
  choice: fürchten
  alternative: verehren
  rationale: „Fürchten“ bewahrt neben Ehrfurcht auch den ernsten Aspekt des Idioms und reduziert es nicht auf kultische Verehrung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtlich-bundestheologische Wortgruppe bleibt erkennbar, ohne schwerfällige Archaismen. „Bis auf den heutigen Tag“ wahrt den erzählerischen Ton; „handeln“ verbindet beide Vorkommen von עשה natürlich. Der Gedankenstrich klärt den Rückbezug auf Jakob, ohne den Satz unnötig umzubauen.
