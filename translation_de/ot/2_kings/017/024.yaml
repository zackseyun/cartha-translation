id: 2KI.17.24
reference: 2 Kings 17:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: de
  text: Dann ließ der König von Assyrien Menschen aus Babel, Kuta, Awa[a], Hamat und Sefarwajim kommen und siedelte sie anstelle der Israeliten[b] in den Städten Samarias an. Sie nahmen Samaria in Besitz und wohnten in seinen Städten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname kann auch „Awwa“ geschrieben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „anstelle der Söhne Israels“; gemeint ist das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: ließ … Menschen … kommen
  rationale: Der Hifil von בוא bezeichnet ein Veranlassen des Kommens beziehungsweise ein Herbringen. Die Umschreibung gibt die königliche Veranlassung natürlich wieder; „Menschen“ ist als im Zusammenhang vorausgesetztes Objekt ergänzt.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: aus Babel, Kuta, Awa, Hamat und Sefarwajim
  rationale: Die Ortsnamen werden in etablierten deutschen biblischen Formen wiedergegeben. Bei עַוָּא wird die mögliche Umschrift „Awwa“ in einer Fußnote bewahrt.
- source_word: וַיֹּשֶׁב
  choice: siedelte sie … an
  rationale: 'Der Hifil von ישׁב ist kausativ: Der König veranlasste, dass die hergebrachten Menschen dort wohnten. „ansiedeln“ bewahrt diese Bedeutung idiomatisch.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: in den Städten Samarias
  rationale: Der Plural „Städte“ bleibt erhalten. Samaria bezeichnet hier angesichts mehrerer Städte das Gebiet, nicht nur die gleichnamige Hauptstadt.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: anstelle der Israeliten
  rationale: תַּחַת bedeutet hier „anstelle von“. בְּנֵי יִשְׂרָאֵל ist wörtlich „Söhne Israels“, fungiert jedoch als ethnische Gesamtbezeichnung; „Israeliten“ ist im modernen Deutsch präzise und natürlich.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: Sie nahmen Samaria in Besitz
  rationale: ירשׁ bedeutet im Zusammenhang von Eroberung und Besiedlung „in Besitz nehmen“; „erben“ wäre hier missverständlich.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: und wohnten in seinen Städten
  rationale: Der Qal von ישׁב bedeutet hier schlicht „wohnen“. Das Suffix bezieht sich auf Samaria; wegen des im Deutschen sächlichen Namens steht „seinen“.
theological_decisions:
- issue: Geschlechtlich markierte ethnische Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / das Volk Israel
  rationale: Die wörtlich männliche Form dient im Hebräischen als umfassende ethnische Bezeichnung. „Israeliten“ gibt den tatsächlichen Referenzumfang wieder, ohne Männer allein zu bezeichnen oder eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem historischem Erzählton. Die Satzfolge und die wiederholte Nennung der Städte bleiben eng am Hebräischen; unnötig altertümliche Formen wie „wohnten darinnen“ werden vermieden.
