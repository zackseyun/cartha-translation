base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: de
  text: und auch wegen des unschuldigen Blutes, das er vergossen hatte[a], denn er hatte Jerusalem mit unschuldigem Blut erfüllt; und Jahwe war nicht bereit zu vergeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Blut der Unschuldigen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und Jahwe wollte nicht vergeben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: und auch wegen
  rationale: Die Wendung führt einen weiteren Grund für das zuvor angekündigte Gericht an. Das im Deutschen ergänzte „wegen“ macht den syntaktischen Anschluss an den Kontext verständlich.
- source_word: דַּם הַנָּקִי
  choice: des unschuldigen Blutes
  rationale: Die Formulierung bewahrt die Bestimmtheit des hebräischen Ausdrucks und bezeichnet die durch ungerechtes Töten entstandene Blutschuld.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: das er vergossen hatte
  rationale: „Blut vergießen“ ist die entsprechende deutsche Redewendung; das Plusquamperfekt kennzeichnet die Tat als vorausliegenden Grund des Gerichts.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: Er hatte Jerusalem mit unschuldigem Blut erfüllt
  rationale: Die Ergänzung „mit“ ist im Deutschen erforderlich. Ein neuer Satz gibt die erklärende Fortführung natürlich und würdevoll wieder, ohne den hebräischen Zusammenhang aufzulösen.
- source_word: וְלֹא אָבָה
  choice: und ... war nicht bereit
  rationale: אָבָה bezeichnet Bereitschaft oder Einwilligung. „War nicht bereit“ bildet diese Willenskomponente transparent ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִסְלֹחַ
  choice: zu vergeben
  rationale: „Vergeben“ ist die klare und geläufige deutsche Entsprechung für göttliche Vergebung beziehungsweise Begnadigung.
theological_decisions:
- issue: Gottes Weigerung, angesichts von Manasses Blutschuld zu vergeben
  choice: Der Vers sagt, dass Jahwe wegen des Jerusalem erfüllenden unschuldigen Blutes nicht bereit war zu vergeben.
  alternative: „Jahwe vergab nicht“ oder „Jahwe wollte nicht vergeben.“
  rationale: Die Übersetzung bewahrt sowohl die ausdrückliche Willenskomponente von אָבָה als auch die theologische Härte der Aussage, ohne ihren zeitlichen oder heilsgeschichtlichen Umfang über den Kontext hinaus festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „unschuldigem Blut“ wird als bewusstes Stilmittel des hebräischen Textes beibehalten. Der Vers beginnt als syntaktische Fortsetzung des vorhergehenden Zusammenhangs.
