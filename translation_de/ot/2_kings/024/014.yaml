source:
  edition: WLC
  text: וְ/הִגְלָ֣ה אֶת כָּל יְ֠רוּשָׁלִַם וְֽ/אֶת כָּל הַ/שָּׂרִ֞ים וְ/אֵ֣ת כָּל גִּבּוֹרֵ֣י הַ/חַ֗יִל עשרה אֲלָפִים֙ גּוֹלֶ֔ה וְ/כָל הֶ/חָרָ֖שׁ וְ/הַ/מַּסְגֵּ֑ר לֹ֣א נִשְׁאַ֔ר זוּלַ֖ת דַּלַּ֥ת עַם הָ/אָֽרֶץ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: de
  text: 'Und er führte ganz Jerusalem in die Verbannung: alle führenden Männer und alle tapferen Krieger, zehntausend Verschleppte, sowie alle Handwerker und Schmiede[a]. Niemand blieb zurück außer den Ärmsten der Bevölkerung des Landes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Metallarbeiter“. Das traditionell mit „Schmiede“ wiedergegebene hebräische Wort kann allgemein Facharbeiter der Metallverarbeitung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: führte … in die Verbannung
  rationale: Der Hifil von גלה bezeichnet hier die erzwungene Wegführung ins Exil. Die Formulierung ist im Deutschen klar und bewahrt den Verbannungsaspekt.
- source_word: כָּל יְרוּשָׁלִַם
  choice: ganz Jerusalem
  rationale: Die Stadt steht metonymisch für ihre Bevölkerung. Die knappe hebräische Ausdrucksweise und ihre Spannung zur später genannten Ausnahme bleiben erhalten.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שׂרים bezeichnet hier die politische und gesellschaftliche Führungsschicht; die Wiedergabe vermeidet die engere Bedeutung „Fürsten“.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: die kampfstarken Männer
  rationale: Die Wendung bezeichnet wehrfähige, kampferprobte Männer. Diese Wiedergabe ist verständlich und bewahrt die militärische Bedeutung.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: insgesamt zehntausend Verbannte
  rationale: גולה ist kollektiv gebraucht und bezeichnet die deportierte Bevölkerung; „Verbannte“ hält den Bezug zur erzwungenen Exilierung fest. „Insgesamt“ gibt die Zahl als zusammenfassende Angabe wieder.
- source_word: הֶחָרָשׁ
  choice: die Handwerker
  rationale: חרש ist eine allgemeine Bezeichnung für ausgebildete Handwerker oder Kunsthandwerker.
- source_word: הַמַּסְגֵּר
  choice: die Schmiede
  rationale: Die traditionelle Wiedergabe passt zum handwerklichen Kontext; da die genaue Spezialisierung unsicher ist und der Ausdruck breiter Metallarbeiter bezeichnen kann, wird dies in einer Fußnote vermerkt.
- source_word: לֹא נִשְׁאַר
  choice: Niemand blieb zurück
  rationale: Der Nifal bezeichnet, dass von den genannten Bevölkerungsgruppen niemand im Land zurückblieb.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: außer den Ärmsten aus der Bevölkerung des Landes
  rationale: דלת bezeichnet die arme beziehungsweise sozial schwache Bevölkerungsschicht; die partitive Bedeutung wird im Deutschen ausdrücklich wiedergegeben.
theological_decisions:
- issue: Umfang der Aussage „ganz Jerusalem“
  choice: Die umfassende Formulierung wird beibehalten und durch die ausdrückliche Ausnahme am Versende begrenzt.
  alternative: Explizit „die Bevölkerung Jerusalems“ oder „fast ganz Jerusalem“ schreiben.
  rationale: Der hebräische Text verwendet eine rhetorisch umfassende Aussage und nennt anschließend selbst die Ausnahme. Eine vorweggenommene Abschwächung würde diese Spannung glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer historischer Erzählweise. Der Doppelpunkt entfaltet das metonymische „ganz Jerusalem“; Gedankenstriche kennzeichnen die zusammenfassende Zahlenangabe. Die männlichen Gruppenbezeichnungen entsprechen den im Kontext bezeichneten Führungs- und Wehrgruppen.
