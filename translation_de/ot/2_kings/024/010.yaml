  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: de
  text: Zu jener Zeit zogen die Diener Nebukadnezars, des Königs von Babel, gegen Jerusalem herauf[a], und die Stadt geriet unter Belagerung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zogen nach Jerusalem hinauf“; das hebräische „hinaufziehen“ kann sowohl die Höhenlage Jerusalems als auch einen militärischen Vorstoß bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher etwa: „und die Stadt kam in die Belagerung“. Dies kann besonders den Beginn des Belagerungszustands hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die zeitliche Wendung ordnet das Ereignis in den vorausgehenden Geschichtsverlauf ein; „zu jener Zeit“ ist natürlich, würdig und bewahrt den rückverweisenden Charakter.
- source_word: עָלָה
  choice: zogen ... gegen Jerusalem herauf
  rationale: Das Verb bezeichnet wörtlich das Hinaufziehen und kann im militärischen Zusammenhang den Zug gegen eine Stadt ausdrücken. Die Formulierung bewahrt sowohl die topografische als auch die feindliche Bewegungsrichtung.
- source_word: עַבְדֵי
  choice: Diener
  rationale: Das hebräische Wort bezeichnet Personen im Dienst und unter der Autorität des Königs. Obwohl hier wohl militärische Kräfte gemeint sind, vermeidet „Diener“ eine im Ausgangstext nicht ausdrücklich vorgenommene Präzisierung.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Verwendet wird die im modernen deutschen Bibel- und Allgemeingebrauch etablierte Namensform.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babel
  rationale: Die hebräische Genitivverbindung wird unmittelbar wiedergegeben; „Babel“ ist die eingebürgerte deutsche biblische Bezeichnung.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: und die Stadt wurde belagert
  rationale: Der hebräische Ausdruck lautet wörtlicher, dass die Stadt „in die Belagerung kam“. Die deutsche Passivform gibt den Sachverhalt klar wieder; eine Fußnote hält die mögliche Betonung des Beginns der Belagerung fest.
- source_word: מָצוֹר
  choice: belagert
  rationale: Das Substantiv bezeichnet eine Belagerung beziehungsweise einen Belagerungszustand; im natürlichen deutschen Satz wird es verbal wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Stellung „Nebukadnezars, des Königs von Babel“ hält die königliche Apposition klar. Die Übersetzung vermeidet die Überpräzisierung „Truppen“, bewahrt aber durch „gegen Jerusalem“ den militärischen Kontext.
