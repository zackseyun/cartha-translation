id: 2KI.24.1
reference: 2 Kings 24:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/יָמָ֣י/ו עָלָ֔ה נְבֻכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יְהִי ל֨/וֹ יְהוֹיָקִ֥ים עֶ֨בֶד֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יָּ֖שָׁב וַ/יִּמְרָד בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: de
  text: Zu seiner Zeit zog Nebukadnezar, der König von Babel, herauf. Jojakim wurde ihm für drei Jahre untertan[a]. Dann wandte er sich von ihm ab und lehnte sich gegen ihn auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wurde ihm zum Diener«. Gemeint ist die politische Unterordnung unter einen Oberherrn; auch: »wurde sein Vasall«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Dann kehrte er um und lehnte sich gegen ihn auf.« Das erste Verb kann die Kehrtwende in Jojakims Loyalität eigens hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Zu seiner Zeit
  rationale: Die hebräische Zeitangabe bezeichnet die Regierungszeit des zuvor genannten Königs; die gewählte Form ist im modernen Deutschen natürlich.
- source_word: עָלָה
  choice: zog ... herauf
  rationale: עלה bezeichnet hier im militärisch-politischen Zusammenhang das Heranziehen des babylonischen Königs, ohne das im Hebräischen nicht ausdrücklich genannte Angriffsziel zu ergänzen.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Dies ist die im Deutschen geläufige Form des Königsnamens.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Die hebräische Status- und Herkunftsbezeichnung wird klar und idiomatisch wiedergegeben; »Babel« ist die traditionelle deutsche Wiedergabe des Orts- und Reichsnamens.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: Jojakim wurde ihm ... untertan
  rationale: Die Konstruktion bezeichnet den Eintritt in ein politisches Abhängigkeitsverhältnis. »Untertan« gibt dies verständlicher und kontextgerechter wieder als das missverständliche »Diener«.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: für drei Jahre
  rationale: Die Zeitdauer wird im Deutschen idiomatisch mit »für« ausgedrückt.
- source_word: וַיָּשָׁב
  choice: Dann wandte er sich von ihm ab
  rationale: שוב bezeichnet eine Umkehr oder Kehrtwende; im Zusammenhang ist die Abkehr von der bisherigen Loyalität gemeint. Die Formulierung bewahrt diesen eigenen Bedeutungsschritt vor der offenen Rebellion.
- source_word: וַיִּמְרָד בּוֹ
  choice: lehnte sich gegen ihn auf
  rationale: מרד mit ב bezeichnet die Rebellion gegen einen übergeordneten Herrscher; die deutsche Wendung ist klar und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die politische Bedeutung von עֶבֶד wird im Haupttext verständlich ausgedrückt, während die wörtlichere Form und »Vasall« in der Fußnote erhalten bleiben. Die zwei aufeinanderfolgenden Verben der Abkehr und Rebellion werden nicht zusammengezogen.
