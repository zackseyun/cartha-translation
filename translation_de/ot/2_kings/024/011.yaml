id: 2KI.24.11
reference: 2 Kings 24:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹ֛א נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַל הָ/עִ֑יר וַ/עֲבָדָ֖י/ו צָרִ֥ים עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/011.yaml
  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: de
  text: Nebukadnezar, der König von Babylon, kam gegen die Stadt, während seine Diener sie belagerten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »während seine Diener sie mit einer Belagerung einschlossen«.'
    reason: lexical_alternative
  - marker: b
    text: »Diener« kann hier Amtsträger, Beauftragte oder Truppen im königlichen Dienst bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das narrative Verb בוא bezeichnet hier Nebukadnezars Kommen; zusammen mit עַל und im militärischen Zusammenhang wird die feindliche Bewegung durch »kam gegen« ausgedrückt.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Die Namensform folgt der im modernen Deutschen geläufigen biblischen Schreibweise.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet unmittelbar Amt und Herrschaftsgebiet Nebukadnezars.
- source_word: עַל הָעִיר
  choice: gegen die Stadt
  rationale: עַל bezeichnet im Kontext der Belagerung die feindliche Bewegung gegen die Stadt, nicht nur eine neutrale Ankunft bei ihr.
- source_word: וַעֲבָדָיו
  choice: seine Diener
  rationale: »Diener« bewahrt die lexikalische Breite von עֲבָדִים; im königlichen Zusammenhang können damit Amtsträger, Beauftragte oder Truppen im Dienst des Königs gemeint sein.
- source_word: צָרִים
  choice: belagerten
  rationale: Das Partizip von צור beschreibt hier eine andauernde Belagerung, die beim Eintreffen Nebukadnezars bereits im Gang war.
- source_word: עָלֶיהָ
  choice: sie
  rationale: Das feminine Pronomen bezieht sich auf »die Stadt«; nach »belagern« verlangt natürliches Deutsch ein direktes Objekt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfügung macht die Gleichzeitigkeit von Nebukadnezars Kommen und der bereits laufenden Belagerung deutlich, ohne die mögliche Identität der »Diener« enger festzulegen, als es der hebräische Text erlaubt.
