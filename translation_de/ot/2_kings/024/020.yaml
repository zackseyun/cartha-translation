  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: de
  text: Denn wegen des Zorns Jahwes geschah es in Jerusalem und Juda, bis er sie aus seiner Gegenwart verstieß.[a] Und Zedekia lehnte sich gegen den König von Babylon auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn der Zorn Jahwes war gegen Jerusalem und Juda, bis er sie aus seiner Gegenwart verstieß.« Der erste Satzteil ist im Hebräischen stark verdichtet; die genaue Satzbeziehung ist nicht eindeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung ein und stellt zugleich den Zusammenhang mit dem vorausgehenden Vers her.
- source_word: עַל אַף יְהוָה
  choice: wegen des Zorns Jahwes
  rationale: Die Wendung bezeichnet den göttlichen Zorn als Ursache; der Gottesname יְהוָה wird mit „Jahwe“ wiedergegeben.
- source_word: הָיְתָה
  choice: kam es … so weit
  rationale: Das feminine Verb steht ohne ausdrückliches Subjekt. Die idiomatische Wiedergabe macht den im Kontext erkennbaren Verlauf bis zur Verstoßung verständlich, ohne ein zusätzliches Ereignis einzuführen.
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: in Jerusalem und Juda
  rationale: Die Präposition ב wird zunächst in ihrem naheliegenden lokalen Sinn wiedergegeben.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: so weit, dass er sie … verstieß
  rationale: עַד mit Infinitiv bezeichnet hier den Endpunkt beziehungsweise Ausgang der Lage. Die deutsche Konstruktion gibt diesen Verlauf natürlich wieder.
- source_word: מֵעַל פָּנָיו
  choice: aus seiner Gegenwart
  rationale: Die wörtliche Vorstellung „von seinem Angesicht hinweg“ ist eine idiomatische Bezeichnung für die Entfernung aus Gottes Gegenwart.
- source_word: וַיִּמְרֹד
  choice: Und … lehnte sich … auf
  rationale: מרד bezeichnet die Rebellion gegen einen Herrscher; „sich gegen jemanden auflehnen“ ist eine natürliche und würdige deutsche Entsprechung.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Gebräuchliche deutsche Form des hebräischen Eigennamens.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: gegen den König von Babylon
  rationale: Nach מרד hat ב adversative Bedeutung und bezeichnet den Herrscher, gegen den sich die Rebellion richtet.
theological_decisions:
- issue: Verhältnis von Jahwes Zorn, der Lage in Jerusalem und Juda und der Verstoßung
  choice: Der Zorn Jahwes führte die Lage bis zu dem Punkt, an dem er die Menschen aus seiner Gegenwart verstieß.
  alternative: Jahwes Zorn war gegen Jerusalem und Juda gerichtet, bis er sie von sich verstieß.
  rationale: Die hebräische Syntax ist stark verdichtet. Die Hauptfassung wahrt sowohl die kausale Aussage als auch den durch עַד bezeichneten Endpunkt; die Fußnote dokumentiert die formal mögliche relationale Deutung.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe „Jahwe“ macht den im Ausgangstext ausdrücklich stehenden Gottesnamen sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die verdichtete hebräische Kausal- und Verlaufskonstruktion wird im Haupttext natürlich entfaltet; eine formal näherliegende alternative Lesart bleibt in der Fußnote erhalten.
