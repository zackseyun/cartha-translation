source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: de
  text: Und er tat, was böse war in den Augen Jahwes, ganz so, wie sein Vater es getan hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er tat
  rationale: Das Qal-Wayyiqtol von עשה führt die Erzählung mit einer einfachen Vergangenheitsform fort; „Und er tat“ bewahrt den hebräischen Erzählungsanschluss.
- source_word: הָרַע
  choice: was böse war
  rationale: Das mit Artikel versehene Adjektiv ist substantivisch gebraucht. Die deutsche Wendung gibt die feste Bewertungsformel natürlich wieder.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die verbreitete hebräische Wendung bezeichnet die Beurteilung aus Jahwes Sicht und lässt sich im Deutschen verständlich und bildnah wiedergeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: כְּ mit כֹּל drückt eine umfassende Übereinstimmung aus. „Ganz so, wie“ bewahrt diese Totalität in natürlichem Deutsch.
- source_word: עָשָׂה
  choice: getan hatte
  rationale: Das Qatal bezeichnet hier die gegenüber dem Handeln des Sohnes vorausliegende Tätigkeit des Vaters; das Plusquamperfekt macht dieses Verhältnis deutlich.
- source_word: אָבִיו
  choice: sein Vater
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der dritten Person Singular maskulin.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Seine Wiedergabe als Eigenname bewahrt diese Unterscheidung, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Königsbuchformel bleibt bildnah erhalten, während „ganz so, wie“ die umfassende Vergleichsaussage idiomatisch ausdrückt.
