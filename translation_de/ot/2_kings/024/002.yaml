source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: de
  text: Da sandte Jahwe Streifscharen[a] der Chaldäer, der Aramäer[b], der Moabiter und der Ammoniter gegen ihn. Er sandte sie nach Juda, um es zu vernichten[c] – gemäß dem Wort Jahwes, das er durch seine Diener, die Propheten, gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Trupps.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Aram“; traditionell auch „Syrer“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „um ihn zu vernichten“, nämlich Jojakim.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: sandte
  rationale: Die übliche und natürliche Wiedergabe von שלח im erzählenden Kontext; die Wiederholung des Verbs im Hebräischen bleibt auch im Deutschen erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gebräuchliche deutsche Wiedergabe des göttlichen Eigennamens, die den Namen im Ausgangstext sichtbar bewahrt.
- source_word: בּוֹ
  choice: gegen ihn
  rationale: Im Zusammenhang feindlicher Entsendung bezeichnet die Präposition die gegen Jojakim gerichtete Handlung.
- source_word: גְּדוּדֵי
  choice: Streifscharen
  rationale: גדוד bezeichnet hier wahrscheinlich kleinere, plündernd oder überfallartig operierende militärische Verbände und nicht vollständige Heere.
- source_word: כַשְׂדִּים
  choice: der Chaldäer
  rationale: Bewahrt die konkrete Volksbezeichnung des hebräischen Textes, statt sie verallgemeinernd durch „Babylonier“ zu ersetzen.
- source_word: אֲרָם
  choice: der Aramäer
  rationale: Gibt den hebräischen Namen Aram als Volksbezeichnung idiomatisch wieder; „Syrer“ ist die traditionelle Alternative.
- source_word: מוֹאָב
  choice: der Moabiter
  rationale: Natürliche deutsche Volksbezeichnung für Moab.
- source_word: בְנֵי עַמּוֹן
  choice: der Ammoniter
  rationale: Idiomatiche deutsche Wiedergabe der wörtlichen Wendung „Söhne Ammons“ als Volksbezeichnung.
- source_word: בִּיהוּדָה
  choice: gegen Juda
  rationale: Der militärisch-feindliche Zusammenhang und die anschließende Zweckangabe legen im Deutschen „gegen Juda“ nahe, auch wenn ב grundsätzlich „in“ oder „nach … hinein“ bedeuten kann.
- source_word: לְהַאֲבִידוֹ
  choice: um es zu vernichten
  rationale: Das Suffix wird im Haupttext auf Juda als Reich beziehungsweise Land bezogen; der grammatisch mögliche Bezug auf Jojakim wird in der Fußnote bewahrt.
- source_word: כִּדְבַר יְהוָה
  choice: gemäß dem Wort Jahwes
  rationale: Bewahrt die formelhafte prophetische Ausdrucksweise in würdigem, verständlichem Deutsch.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: durch seine Diener, die Propheten
  rationale: „Durch“ gibt die instrumentale Bedeutung von „durch die Hand“ idiomatisch wieder, ohne die Prophetenformel inhaltlich abzuschwächen.
theological_decisions:
- issue: Bezugswort des Suffixes in לְהַאֲבִידוֹ
  choice: '„um es zu vernichten“: Bezug auf Juda'
  alternative: '„um ihn zu vernichten“: Bezug auf Jojakim'
  rationale: Juda steht unmittelbar zuvor als Ziel der feindlichen Sendung und bildet im weiteren Zusammenhang den Gegenstand des angekündigten Gerichts. Da das maskuline Singularsuffix grammatisch jedoch auch auf Jojakim bezogen werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Aufzählung und die Wiederholung von „sandte“ folgen der Struktur des Hebräischen. „Streifscharen“ verdeutlicht den wahrscheinlichen Charakter der militärischen Verbände, während die Fußnote die neutralere Alternative nennt. Die echte grammatische Mehrdeutigkeit beim Ziel der Vernichtung wird nicht stillschweigend beseitigt, sondern ausdrücklich dokumentiert.
