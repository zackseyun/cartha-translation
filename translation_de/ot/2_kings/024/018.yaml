source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: de
  text: Zedekia war einundzwanzig Jahre alt, als er König wurde, und er regierte elf Jahre in Jerusalem. Seine Mutter hieß Hamutal; sie war eine Tochter Jeremias aus Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: war einundzwanzig Jahre alt
  rationale: Die wörtliche hebräische Wendung »ein Sohn von einundzwanzig Jahren« ist eine Altersangabe; die gewählte Form ist im modernen Deutschen natürlich und bedeutungsgleich.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Der Infinitiv mit ב bezeichnet hier den Zeitpunkt des Regierungsantritts.
- source_word: מָלַךְ
  choice: er regierte
  rationale: Das Verb bezeichnet die Ausübung der Königsherrschaft und wird direkt und idiomatisch wiedergegeben.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ב wird hier lokal gebraucht.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Natürliche moderne Wiedergabe der hebräischen Königsformel »und der Name seiner Mutter war«.
- source_word: חמיטל
  choice: Hamutal
  rationale: Der Personenname wird gemäß seiner masoretischen Lesung transliteriert.
- source_word: בַּת יִרְמְיָהוּ
  choice: eine Tochter Jeremias
  rationale: Die genealogische Angabe wird in natürlichem Deutsch wiedergegeben; »Jeremias« ist die im Deutschen etablierte Form des Namens.
- source_word: מִלִּבְנָה
  choice: aus Libna
  rationale: Die Präposition מ bezeichnet Herkunft; syntaktisch kann die Herkunftsangabe zur Tochter beziehungsweise zu Jeremia gehören.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Königsformel bleibt erhalten, wird aber idiomatisch formuliert. Die Herkunftsangabe steht am Ende wie im Hebräischen, sodass ihre syntaktische Zuordnung nicht unnötig festgelegt wird.
