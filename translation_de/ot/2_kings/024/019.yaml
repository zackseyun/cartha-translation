  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war, ganz so, wie Jojakim es getan hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Waw-Konsekutiv führt die nächste Erzählhandlung ein. Im natürlichen Deutschen ist ein einleitendes „Und“ hier entbehrlich.
- source_word: הָרַע
  choice: was … böse war
  rationale: Die feste Wendung עשה הרע bezeichnet idiomatisch das Tun dessen, was als böse gilt; die Relativkonstruktion ist im Deutschen natürlich und bewahrt die moralische Wertung.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die Formulierung bewahrt das hebräische Bild für eine Beurteilung aus Jahwes Perspektive.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: „Ganz“ bringt die umfassende Kraft von כֹּל zum Ausdruck, während „so, wie“ den vollständigen Vergleich idiomatisch wiedergibt.
- source_word: עָשָׂה
  choice: getan hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Jojakims Handeln dem hier beschriebenen Verhalten vorausging.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn in der heute weithin gebräuchlichen deutschen Form wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Wendung „in den Augen Jahwes“ bleibt erhalten; Satzbau und Tempusfolge sind zugleich natürlich deutsch.
