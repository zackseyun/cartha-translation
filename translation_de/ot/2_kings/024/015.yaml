  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die zweifache Aussage des hebräischen Satzes sachgerecht wieder: Jojachin wird nach Babylon in die Verbannung geführt, ebenso die anschließend genannten Personen aus Jerusalem nach Babylon. „Mutter des Königs“, „Frauen des Königs“, „Hofbeamte“ und „führende Männer des Landes“ sind im Kontext tragfähige Wiedergaben. Die mit סָרִיס und אֵילֵי הָאָרֶץ verbundenen lexikalischen Spielräume werden angemessen durch Fußnoten kenntlich gemacht.'
  naturalness: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die Satzteilung ist natürlich; die Wiederaufnahme von „führte … in die Verbannung“ bewahrt den Nachdruck der hebräischen Formulierung, ohne im Deutschen unverständlich zu wirken.
  terminology: „Hofbeamte“ vermeidet eine unbegründete Festlegung auf „Eunuchen“ und wird korrekt erläutert. „Führende Männer des Landes“ ist eine natürliche, sozialgeschichtlich angemessene Wiedergabe; die Alternativen „mächtige Männer“ und „Vornehme“ decken die mögliche stärkere Nuancierung ab. „Mutter des Königs“ wahrt die wörtliche Ausdrucksweise, ohne den institutionellen Titel Königinmutter aufzuzwingen.
