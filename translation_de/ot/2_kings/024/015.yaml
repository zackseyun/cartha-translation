id: 2KI.24.15
reference: 2 Kings 24:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֶּ֥גֶל אֶת יְהוֹיָכִ֖ין בָּבֶ֑לָ/ה וְ/אֶת אֵ֣ם הַ֠/מֶּלֶךְ וְ/אֶת נְשֵׁ֨י הַ/מֶּ֜לֶךְ וְ/אֶת סָרִיסָ֗י/ו וְ/אֵת֙ אולי הָ/אָ֔רֶץ הוֹלִ֛יךְ גּוֹלָ֥ה מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: de
  text: Er führte Jojachin nach Babylon in die Verbannung. Auch die Mutter des Königs[c], die Frauen des Königs, seine Hofbeamten[a] und die führenden Männer des Landes[b] führte er aus Jerusalem nach Babylon in die Verbannung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Eunuchen“. Das hebräische Wort kann entweder Eunuchen im engeren Sinn oder allgemeiner königliche beziehungsweise höfische Amtsträger bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die mächtigen Männer des Landes“ beziehungsweise „die Vornehmen des Landes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die Mutter des Königs“; gemeint sein kann auch die Königinmutter als Stellung am Königshof.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: führte … in die Verbannung
  rationale: Die Kausativform von גלה bezeichnet das Wegführen ins Exil. Die gewählte Formulierung gibt sowohl die Bewegung als auch die Verbannung ausdrücklich wieder.
- source_word: בָּבֶלָה
  choice: nach Babylon
  rationale: Das direktionale He bezeichnet die Bewegung auf Babylon zu; „nach Babylon“ ist die natürliche deutsche Wiedergabe.
- source_word: אֵם הַמֶּלֶךְ
  choice: die Mutter des Königs
  rationale: Dies entspricht unmittelbar dem hebräischen Verwandtschaftsausdruck und legt nicht unnötig den formellen Hoftitel „Königinmutter“ fest.
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: die Frauen des Königs
  rationale: Der Plural im Status constructus bezeichnet die Ehefrauen des Königs. Die Wiederholung von „des Königs“ bewahrt die Struktur des Hebräischen.
- source_word: סָרִיסָיו
  choice: seine Hofbeamten
  rationale: סָרִיס kann einen Eunuchen oder allgemeiner einen königlichen Amtsträger bezeichnen. Im Hofkontext gibt „Hofbeamte“ die Funktion wieder, ohne einen körperlichen Status festzulegen.
- source_word: אולי הָאָרֶץ
  choice: die führenden Männer des Landes
  rationale: Der Ausdruck bezeichnet mächtige beziehungsweise gesellschaftlich herausragende Männer des Landes. „Führende Männer“ vermittelt diese soziale Stellung in natürlichem Deutsch.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: führte … in die Verbannung
  rationale: Die Verbindung bezeichnet das Veranlassen, als Verbannte fortzugehen; die deutsche Formulierung hält das Verbannungsmotiv ausdrücklich fest.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: aus Jerusalem nach Babylon
  rationale: Die Präposition und das direktionale He markieren klar Ausgangspunkt und Ziel der Deportation.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweifache Aussage des Wegführens nach Babylon bleibt erhalten, da sie die hebräische Satzgestaltung und den Nachdruck auf die Verbannung widerspiegelt. Die Fußnoten stehen jeweils unmittelbar bei dem Ausdruck, auf den sie sich beziehen.
