    rationale: Das hebräische Prädikat ist eine zusammenfassende Nominalapposition. Eine appositionale deutsche Formulierung bewahrt Struktur und Nachdruck besser; „kampfkräftig“ ist im militärischen Kontext präziser als das allgemeine „stark“.
