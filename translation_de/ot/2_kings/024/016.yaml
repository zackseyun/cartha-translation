  text: וְ/אֵת֩ כָּל אַנְשֵׁ֨י הַ/חַ֜יִל שִׁבְעַ֣ת אֲלָפִ֗ים וְ/הֶ/חָרָ֤שׁ וְ/הַ/מַּסְגֵּר֙ אֶ֔לֶף הַ/כֹּ֕ל גִּבּוֹרִ֖ים עֹשֵׂ֣י מִלְחָמָ֑ה וַ/יְבִיאֵ֧/ם מֶֽלֶךְ בָּבֶ֛ל גּוֹלָ֖ה בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: de
  text: Auch alle wehrfähigen Männer, siebentausend, sowie die Handwerker und Schmiede[a], tausend – allesamt kampfkräftige Männer, die Krieg führen konnten – führte der König von Babylon in die Verbannung nach Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Metallhandwerker. Die genaue Bedeutung des hebräischen Wortes ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: wehrfähigen Männer
  rationale: Die Wendung bezeichnet tüchtige, kräftige und militärisch einsetzbare Männer. „Wehrfähig“ gibt den militärischen Bezug im Zusammenhang prägnant und in natürlichem Deutsch wieder.
- source_word: שִׁבְעַת אֲלָפִים
  choice: siebentausend
  rationale: Direkte Wiedergabe der hebräischen Kardinalzahl.
- source_word: הֶחָרָשׁ
  choice: die Handwerker
  rationale: חָרָשׁ bezeichnet allgemein einen ausgebildeten Handwerker oder Kunsthandwerker, ohne hier ein bestimmtes Material festzulegen.
- source_word: הַמַּסְגֵּר
  choice: Schmiede
  rationale: Das seltene Wort bezeichnet wahrscheinlich Metallhandwerker beziehungsweise Schmiede; die genaue Spezialisierung bleibt unsicher und wird in einer Fußnote kenntlich gemacht.
- source_word: אֶלֶף
  choice: eintausend
  rationale: Direkte Wiedergabe der Zahlenangabe für die Handwerker und Schmiede zusammen.
- source_word: הַכֹּל
  choice: sie alle
  rationale: Der Ausdruck fasst die zuvor genannten Gruppen zusammen. Das Pronomen macht diesen Rückbezug im Deutschen deutlich.
- source_word: גִּבּוֹרִים
  choice: starke Männer
  rationale: Das Wort bezeichnet starke, tüchtige Männer und kann besonders im militärischen Zusammenhang Krieger meinen. Die Wiedergabe bewahrt die Grundbedeutung, ohne den folgenden Ausdruck vorwegzunehmen.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: die Krieg führen konnten
  rationale: Wörtlich „Krieg Führende/Tuende“. Im Zusammenhang bezeichnet die Wendung Männer, die zum militärischen Einsatz fähig waren; die deutsche Formulierung gibt diese Fähigkeit natürlich wieder.
- source_word: וַיְבִיאֵם
  choice: führte … sie
  rationale: Das Verb bedeutet „bringen/führen“ und enthält das Objekt „sie“. In Verbindung mit „in die Verbannung“ bezeichnet es ihre Deportation.
- source_word: גּוֹלָה
  choice: in die Verbannung
  rationale: Das Substantiv wird adverbial gebraucht und bezeichnet den Zustand beziehungsweise das Ergebnis der Wegführung.
- source_word: בָּבֶלָה
  choice: nach Babylon
  rationale: Das Richtungs-He bezeichnet eine Bewegung auf Babylon zu und wird im Deutschen mit „nach“ ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Satzstruktur bleibt durch Gedankenstriche erkennbar, wird aber so gegliedert, dass Zahlen und Gruppen eindeutig zugeordnet werden. „Wehrfähig“ und „Krieg führen konnten“ vermeiden altertümliche Militärsprache.
