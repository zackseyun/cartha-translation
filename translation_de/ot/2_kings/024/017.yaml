base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: de
  text: Der König von Babel setzte Mattanja, Jojachins Onkel, an Jojachins Stelle als König ein und änderte Mattanjas Namen in Zedekia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: setzte … als König ein
  rationale: 'Der Hifil von מלך ist hier kausativ: Der babylonische König installierte Mattanja als Herrscher. Die deutsche Formulierung gibt diesen Sinn natürlich und eindeutig wieder.'
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Die Status-constructus-Verbindung bezeichnet eindeutig das Subjekt. „Babel“ entspricht der in deutschen Bibeln etablierten Form des Orts- und Reichsnamens.
- source_word: מַתַּנְיָה
  choice: Mattanja
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transkribiert.
- source_word: דֹדוֹ
  choice: Jojachins Onkel
  rationale: דּוֹד bezeichnet hier den Onkel. Das ausgeschriebene Bezugswort „Jojachins“ macht das im hebräischen Possessivsuffix enthaltene Antezedens im Deutschen eindeutig.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Im Zusammenhang einer Thronfolge bezeichnet תַּחַת Stellvertretung beziehungsweise Nachfolge.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: änderte seinen Namen
  rationale: סבב bedeutet wörtlich „wenden“, bezeichnet mit „Name“ jedoch idiomatisch eine Namensänderung.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Der Personenname wird in seiner etablierten deutschen Bibelform wiedergegeben.
