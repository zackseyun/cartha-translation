  register: Modernes, würdiges Standarddeutsch. Die kausative Einsetzung zum König wird ausdrücklich wiedergegeben; der pronominale Bezug von „sein“ wird zur Vermeidung deutscher Mehrdeutigkeit als „Jojachins“ entfaltet.
