base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: 'Die übrigen Taten Jojakims und alles, was er tat: Sind sie nicht im Buch der Geschichte der Könige von Juda[a] aufgeschrieben?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Annalen der Könige von Juda“. Der hebräische Titel bezeichnet eine königliche Schriftquelle, auf die in den Königebüchern wiederholt verwiesen wird; gemeint ist nicht unbedingt das kanonische Buch der Chronik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: die übrigen Taten Jojakims
  rationale: יֶתֶר bezeichnet das Übrige oder Verbleibende; דִּבְרֵי meint in der königlichen Schlussformel die berichteten Angelegenheiten bzw. Taten des Königs. Die gewählte Formulierung ist quellennah und im Deutschen verständlich.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die breite Aussage des hebräischen Relativsatzes bleibt ohne nähere Deutung erhalten.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: Ist das nicht … aufgeschrieben?
  rationale: Die rhetorische Frage bleibt erhalten. Das zusammenfassende deutsche Singularpronomen „das“ nimmt die zuvor genannten Angaben als Gesamtinhalt auf und klingt natürlicher als eine erzwungene pluralische Konstruktion.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Wörtlich steht „auf dem Buch/Schriftstück“; für den Inhalt eines schriftlichen Werkes ist „im Buch“ die natürliche deutsche Entsprechung.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Buch der Geschichte der Könige von Juda
  rationale: Die Formulierung bezeichnet die in den Königebüchern wiederholt angeführte königliche Schriftquelle. „Geschichte“ gibt דִּבְרֵי הַיָּמִים im Sinn einer fortlaufenden historischen Aufzeichnung verständlich wieder; die Fußnote nennt „Annalen“ als präzisere archivalische Alternative.
theological_decisions:
- issue: Identität der genannten Schriftquelle
  choice: Der Haupttext verwendet einen allgemeinen historischen Buchtitel; die Fußnote erläutert den archivalischen Sinn.
  alternative: Den Titel unmittelbar mit „Annalen der Könige von Juda“ wiedergeben oder ihn mit dem kanonischen Buch der Chronik gleichsetzen.
  rationale: Der hebräische Ausdruck verweist auf eine königliche Aufzeichnungsquelle, erlaubt aber keine sichere Gleichsetzung mit dem kanonischen Chronikbuch. Die Übersetzung vermeidet daher eine konfessionelle oder historische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gliedert die lange königliche Schlussformel und lässt die rhetorische Frage klar hervortreten. Der Fußnotenmarker steht unmittelbar beim Titel, auf den sich die Anmerkung bezieht.
