  text: בֶּן שְׁמֹנֶ֨ה עֶשְׂרֵ֤ה שָׁנָה֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֣ה חֳדָשִׁ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ נְחֻשְׁתָּ֥א בַת אֶלְנָתָ֖ן מִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: de
  text: Jojachin war achtzehn Jahre alt, als er König wurde, und er regierte drei Monate in Jerusalem. Seine Mutter hieß Nechuschta; sie war eine Tochter Elnatans aus Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: war achtzehn Jahre alt
  rationale: Die hebräische Altersformel wird im modernen Deutschen idiomatisch und vollständig wiedergegeben.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet den Zeitpunkt seiner Thronbesteigung; diese Formulierung ist natürlich und entspricht dem hebräischen Sinn.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: und er regierte drei Monate
  rationale: Die deutsche Wortfolge gibt die Dauer seiner Herrschaft klar wieder und bewahrt die verbale Aussage von מָלַךְ.
- source_word: בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Die Präposition bezeichnet hier eindeutig den Ort der Herrschaft.
- source_word: וְשֵׁם אִמּוֹ נְחֻשְׁתָּא
  choice: Seine Mutter hieß Nechuschta
  rationale: Dies ist die natürliche moderne deutsche Entsprechung der hebräischen Namensformel.
- source_word: בַת אֶלְנָתָן
  choice: eine Tochter Elnatans
  rationale: Der hebräische Status constructus bezeichnet die Abstammung; der deutsche Genitiv gibt sie knapp und eindeutig wieder.
- source_word: מִירוּשָׁלָם
  choice: aus Jerusalem
  rationale: מִן bezeichnet Herkunft. Die Stellung am Satzende legt nahe, die Herkunftsangabe auf Elnatan zu beziehen, wobei eine weiter gefasste Zuordnung zur Familie sprachlich möglich bleibt.
