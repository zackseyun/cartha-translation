source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: de
  text: Gewiss, auf Befehl Jahwes kam dies über Juda, um es wegen der Sünden Manasses, entsprechend allem, was er getan hatte, von seinem Angesicht zu entfernen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus seiner Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel bekräftigt hier die erklärende Aussage. „Ja“ gibt diese emphatische Funktion natürlich wieder, ohne sie fälschlich als Einschränkung („nur“) zu verstehen.
- source_word: עַל פִּי
  choice: auf Befehl
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund“ und bezeichnet hier ein Geschehen gemäß Jahwes Befehl oder Ausspruch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָיְתָה בִּיהוּדָה
  choice: kam dies über Juda
  rationale: Die hebräische Formulierung ist elliptisch und verweist im Zusammenhang auf das zuvor geschilderte Strafgericht. „Dies“ macht den vorausgesetzten Vorgang im Deutschen verständlich.
- source_word: לְהָסִיר
  choice: um ... zu entfernen
  rationale: Der Hifil-Infinitiv von סור drückt ein verursachtes Entfernen aus und bezeichnet hier den Zweck des Gerichts.
- source_word: מֵעַל פָּנָיו
  choice: aus seinem Angesicht
  rationale: Die konkrete hebräische Bildsprache wird bewahrt. Gemeint ist die Entfernung aus Jahwes Gegenwart; diese glattere Wiedergabe steht in der Fußnote.
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: wegen der Sünden Manasses
  rationale: Die Präposition bezeichnet den Grund; „Sünden“ gibt die Gesamtheit der schuldhaften Taten Manasses im Deutschen klar wieder.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: entsprechend allem, was er getan hatte
  rationale: Die Wiedergabe erhält den Gedanken der Entsprechung beziehungsweise des Maßstabs, der durch כְּכֹל ausgedrückt wird.
theological_decisions:
- issue: Unausgesprochenes Objekt des Entfernens
  choice: Das Pronomen „es“ bezieht sich auf Juda als Land und Volk.
  alternative: Das Objekt könnte unausgesprochen bleiben oder ausdrücklich mit „sie“ auf die Bewohner Judas bezogen werden.
  rationale: Im Hebräischen fehlt ein ausdrückliches Objekt, doch der Zusammenhang bezeichnet Juda beziehungsweise seine Bevölkerung als vom Gericht betroffen. Das sächliche Pronomen nimmt das grammatisch sächliche „Juda“ auf und macht den deutschen Satz lesbar, ohne die Ellipse unnötig stark auszudeuten.
- issue: Bildsprache der göttlichen Gegenwart
  choice: „aus seinem Angesicht“ bleibt im Haupttext erhalten.
  alternative: „aus seiner Gegenwart“
  rationale: Die konkrete, anthropomorphe Redeweise des Hebräischen bleibt so sichtbar. Die Fußnote bietet die idiomatischere Bedeutungsangabe, ohne die Bildsprache im Haupttext einzuebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Gerichtsformel wird behutsam verdeutlicht; die markante hebräische Bildsprache bleibt erhalten.
