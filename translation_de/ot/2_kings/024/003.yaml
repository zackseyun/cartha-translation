revisions:
- from: Ja, auf Befehl Jahwes kam dies über Juda, um es aus seinem Angesicht zu entfernen[a] – wegen der Sünden Manasses, entsprechend allem, was er getan hatte.
  to: Gewiss, auf Befehl Jahwes kam dies über Juda, um es wegen der Sünden Manasses, entsprechend allem, was er getan hatte, von seinem Angesicht zu entfernen[a].
  rationale: Die Revision korrigiert ausschließlich die im Deutschen unübliche Verbindung „aus seinem Angesicht“ zu „von seinem Angesicht“ und setzt die bekräftigende Partikel registergerecht mit „Gewiss“ um. Die hebräische Ellipse, die Bildsprache und die syntaktisch offene Bezugnahme auf Juda bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:41:21Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft das elliptisch vorausgesetzte Gericht („dies kam über Juda“), die göttliche Veranlassung, den Zweck des Entfernens sowie die Begründung in Manasses Schuld insgesamt zutreffend. Das sächliche Objekt kann sich, wie im Hebräischen kontextuell nahegelegt, auf Juda als Gemeinwesen beziehen. Die Partikel אַךְ kann hier bekräftigend wiedergegeben werden.
  naturalness: „Aus seinem Angesicht entfernen“ ist im modernen Deutschen keine natürliche Verbindung und kann zudem räumlich-körperlich missverstanden werden. Die wörtlichere und idiomatisch tragfähige Formulierung lautet „von seinem Angesicht entfernen“; die Bedeutungsumschreibung „aus seiner Gegenwart“ gehört sinnvoll in die Fußnote. „Gewiss“ ist als bekräftigender Satzanschluss würdevoller und weniger gesprächssprachlich als „Ja“.
  terminology: „Jahwe“, „Juda“, „Manasse“ und „Sünden“ sind angemessen. „Von seinem Angesicht“ bewahrt die anthropomorphe hebräische Bildsprache, ohne sie durch eine unübliche deutsche Präposition zu verfremden.
  issues:
  - severity: medium
    issue: Unnatürliche Präposition in „aus seinem Angesicht zu entfernen“
    rationale: Für Entfernung aus der Nähe bzw. dem Blickbereich einer Person verwendet das Deutsche „von jemandes Angesicht entfernen“ bzw. die idiomatische Deutung „aus jemandes Gegenwart“. „Aus seinem Angesicht“ ist keine geläufige deutsche Entsprechung und beeinträchtigt Verständlichkeit und Register.
  - severity: low
    issue: „Ja“ als Wiedergabe von אַךְ
    rationale: Die bekräftigende Funktion ist richtig erkannt, doch „Ja“ wirkt hier unnötig dialogisch. „Gewiss“ gibt die emphatische Assertion in einem schriftsprachlich-würdigen Bibelregister natürlicher wieder.
  revised_text: Gewiss, auf Befehl Jahwes kam dies über Juda, um es wegen der Sünden Manasses, entsprechend allem, was er getan hatte, von seinem Angesicht zu entfernen[a].
  revised_footnotes:
  - marker: a
    text: 'Oder: „aus seiner Gegenwart“.'
    reason: lexical_alternative
  revision_rationale: Die Revision korrigiert ausschließlich die im Deutschen unübliche Verbindung „aus seinem Angesicht“ zu „von seinem Angesicht“ und setzt die bekräftigende Partikel registergerecht mit „Gewiss“ um. Die hebräische Ellipse, die Bildsprache und die syntaktisch offene Bezugnahme auf Juda bleiben erhalten.
