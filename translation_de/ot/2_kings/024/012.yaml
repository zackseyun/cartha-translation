source:
  edition: WLC
  text: וַ/יֵּצֵ֞א יְהוֹיָכִ֤ין מֶֽלֶךְ יְהוּדָה֙ עַל מֶ֣לֶךְ בָּבֶ֔ל ה֣וּא וְ/אִמּ֔/וֹ וַ/עֲבָדָ֖י/ו וְ/שָׂרָ֣י/ו וְ/סָֽרִיסָ֑י/ו וַ/יִּקַּ֤ח אֹת/וֹ֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַ֥ת שְׁמֹנֶ֖ה לְ/מָלְכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: de
  text: Da ging Jojachin, der König von Juda, zum König von Babylon hinaus, er und seine Mutter, seine Diener, seine führenden Beamten und seine Hofbeamten[a]. Und der König von Babylon nahm ihn im achten Jahr seiner Herrschaft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Eunuchen. Das hebräische Wort kann sowohl Eunuchen als auch allgemein königliche Hofbeamte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Seiner Herrschaft“ bezieht sich wohl auf die Herrschaft des Königs von Babylon.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיֵּצֵא ... עַל מֶלֶךְ בָּבֶל
  choice: ging ... zum König von Babylon hinaus
  rationale: Bewahrt die konkrete Bewegungsformulierung von יצא, während „zu“ die Richtung von עַל in diesem Zusammenhang natürlich wiedergibt; „ergab sich“ wäre kontextuell möglich, würde die Handlung jedoch stärker ausdeuten als der hebräische Wortlaut.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Die breite Grundbedeutung von עבד bleibt erhalten, ohne die Personen unnötig auf Hofbedienstete oder Amtsträger festzulegen.
- source_word: שָׂרָיו
  choice: seine führenden Männer
  rationale: שׂרים bezeichnet hochrangige Verantwortungsträger. Diese Wiedergabe ist verständlich, würdevoll und unterscheidet sie von den unmittelbar folgenden סריסים, ohne sie enger als Fürsten, Minister oder Heerführer festzulegen.
- source_word: סָרִיסָיו
  choice: seine Hofbeamten
  rationale: סריס kann einen Eunuchen oder allgemeiner einen hohen Hofbeamten bezeichnen. Im Haupttext wird die funktionale, nicht körperlich festlegende Bedeutung gewählt; die andere Möglichkeit steht in der Fußnote.
- source_word: וַיִּקַּח אֹתוֹ
  choice: nahm ihn ... gefangen
  rationale: לקח bedeutet grundsätzlich „nehmen“. Im Belagerungs- und Unterwerfungskontext bezeichnet die Wendung seine Überführung in babylonische Gewalt; „gefangen nahm“ macht dies im Deutschen natürlich deutlich, ohne zusätzliche Einzelheiten einzutragen.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: im achten Jahr seiner Herrschaft
  rationale: Entspricht der hebräischen Zeitangabe. Das Pronomen bezieht sich syntaktisch und historisch am ehesten auf den König von Babylon.
theological_decisions:
- issue: Bezug von „seiner Herrschaft“
  choice: Herrschaft des Königs von Babylon
  alternative: Herrschaft Jojachins
  rationale: Der König von Babylon ist der nächste grammatische Bezugspunkt; zudem entspricht diese Lesart dem chronologischen Rahmen des Kapitels. Die Formulierung des Haupttexts bewahrt das Pronomen, während die Fußnote den Bezug klärt.
- issue: Bedeutung von סָרִיסָיו
  choice: Hofbeamte
  alternative: Eunuchen
  rationale: Das hebräische Wort kann sowohl körperlich kastrierte Hofdiener als auch Hofbeamte bezeichnen. Die Übersetzung soll keine der lexikalisch möglichen körperlichen Aussagen stillschweigend als sicher behaupten; deshalb wird die Alternative ausdrücklich vermerkt.
translation_notes:
  register: Modernes Standarddeutsch mit erzählerisch-würdigem Ton. Die Satzfolge bleibt nahe am Hebräischen, wird aber durch deutsche Zeichensetzung geglättet. „Zum König ... hinausgehen“ bewahrt die Bildlichkeit und vermeidet die interpretierende Übersetzung „sich ergeben“.
