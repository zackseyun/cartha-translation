  text: וְ/לֹֽא הֹסִ֥יף עוֹד֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ/צֵ֖את מֵֽ/אַרְצ֑/וֹ כִּֽי לָקַ֞ח מֶ֣לֶךְ בָּבֶ֗ל מִ/נַּ֤חַל מִצְרַ֨יִם֙ עַד נְהַר פְּרָ֔ת כֹּ֛ל אֲשֶׁ֥ר הָיְתָ֖ה לְ/מֶ֥לֶךְ מִצְרָֽיִם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: de
  text: Und der König von Ägypten zog nicht mehr aus seinem Land hinaus; denn der König von Babel hatte vom Bach Ägyptens[a] bis zum Euphrat alles eingenommen, was dem König von Ägypten gehört hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Wadi Ägyptens“. Das hebräische Wort bezeichnet häufig einen nur zeitweise Wasser führenden Bachlauf; der Nil ist hier wahrscheinlich nicht gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: zog nicht mehr ... hinaus
  rationale: Die Verbindung von הוסיף mit Infinitiv und עוד unter der Verneinung bezeichnet das Aufhören einer Handlung. „Zog nicht mehr … hinaus“ gibt die königlich-militärische Situation natürlich wieder, ohne ausdrücklich „in den Krieg ziehen“ einzutragen.
- source_word: מֵאַרְצוֹ
  choice: aus seinem Land
  rationale: Die räumliche Grundbedeutung bleibt erhalten; „Land“ ist im Zusammenhang eines Königs natürlicher als „Erde“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung dafür ein, dass der ägyptische König nicht mehr auszog. „Denn“ wahrt den erzählenden, würdigen Ton.
- source_word: לָקַח
  choice: hatte ... eingenommen
  rationale: Im Zusammenhang mit dem Verlust eines beherrschten Gebietes bezeichnet לקח die vorherige Inbesitznahme durch Babel. Das Plusquamperfekt verdeutlicht die zeitliche Vorordnung; „eingenommen“ ist kontextgemäß, ohne die Aussage auf einzelne Beutestücke zu verengen.
- source_word: מִנַּחַל מִצְרַיִם
  choice: vom Bach Ägyptens
  rationale: נחל bezeichnet häufig einen Bachlauf oder ein Wadi, nicht einen großen Strom. „Bach Ägyptens“ ist verständlich und vermeidet eine Verwechslung mit dem Nil; die topografisch präzisere Alternative steht in der Fußnote.
- source_word: עַד נְהַר פְּרָת
  choice: bis zum Euphrat
  rationale: נהר פרת ist der Euphrat. Im Deutschen genügt der etablierte Eigenname, ohne den Gattungsbegriff „Strom“ eigens wiederzugeben.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: alles ..., was dem König von Ägypten gehört hatte
  rationale: Die breite Besitz- bzw. Herrschaftsaussage des Hebräischen bleibt erhalten. Das Plusquamperfekt macht deutlich, dass diese Gebiete zuvor zum Machtbereich des ägyptischen Königs gehört hatten, ohne den Ausdruck ausdrücklich nur auf Land zu beschränken.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. „Babel“ folgt der in deutschen Bibelübersetzungen geläufigen Benennung des Reiches; „zog ... hinaus“ lässt den militärischen Zusammenhang erkennen, ohne ihn überdeutlich auszulegen.
