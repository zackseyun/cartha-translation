source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב יְהוֹיָקִ֖ים עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: de
  text: Und Jojakim legte sich zu seinen Vorfahren[a]. Sein Sohn Jojachin wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „starb“. Wörtlich steht im Hebräischen: „legte sich zu seinen Vorfahren“, eine übliche Formel für den Tod eines Königs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Die Verbindung mit עִם אֲבֹתָיו ist eine feste königliche Todesformel. „Legte sich“ bewahrt das hebräische Bild, ohne die Aussage auf das deutende „starb“ zu reduzieren.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vorfahren
  rationale: „Vorfahren“ gibt אָבוֹת in dieser Todesformel in natürlichem modernem Deutsch wieder. Die Präposition „zu“ entspricht dem etablierten deutschen Ausdruck „sich zu seinen Vorfahren legen“.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Das Verb bezeichnet hier den Regierungsantritt. „Wurde König“ bringt den Thronwechsel deutlicher zum Ausdruck als „regierte“.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Direkte Wiedergabe der familiären Bezeichnung.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet im Zusammenhang die Nachfolge auf dem Thron und wahrt zugleich das Ersetzungsmoment des hebräischen Ausdrucks.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: Jojakim / Jojachin
  rationale: Die Personennamen folgen den im Deutschen üblichen biblischen Namensformen.
theological_decisions:
- issue: Wiedergabe der königlichen Todesformel ohne zusätzliche Aussage über die Bestattung
  choice: Das Bild „legte sich zu seinen Vorfahren“ bleibt im Haupttext erhalten.
  alternative: „starb“ oder „starb und wurde bei seinen Vorfahren begraben“
  rationale: Der hebräische Text verwendet eine übliche Todesformel, erwähnt in diesem Vers aber keine Bestattung. Die bildhafte Wiedergabe bewahrt den Wortlaut und fügt keine historisch oder theologisch weitergehende Einzelheit hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Todesformel bleibt verständlich und bildhaft erhalten; die Satzteilung sorgt für einen natürlichen deutschen Rhythmus.
