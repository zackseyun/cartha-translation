  source_fidelity: 'Der Entwurf gibt die beiden hebräischen Aussagen vollständig und zutreffend wieder: Jojakims königliche Todesformel (וַיִּשְׁכַּב עִם־אֲבֹתָיו) sowie Jojachins Thronantritt als seines Sohnes und Nachfolgers (וַיִּמְלֹךְ ... תַּחְתָּיו). Die Wiedergabe vermeidet zu Recht eine nicht im Vers genannte Bestattungsaussage.'
  naturalness: „Legte sich zu seinen Vorfahren“ ist als bewusst bildhafte, in deutscher Bibelsprache verständliche Wiedergabe der Todesformel angemessen. Die Aufteilung in zwei Sätze ist im modernen Standarddeutsch flüssig; „wurde an seiner Stelle König“ bezeichnet den Regierungsantritt klar.
  terminology: Die deutschen Namensformen „Jojakim“ und „Jojachin“ sind üblich. „Vorfahren“ ist eine natürliche moderne Entsprechung zu „Vätern“ in dieser idiomatischen Formel, ohne eine engere biologische Vaterschaft zu behaupten. Die Fußnote erläutert die idiomatische Bedeutung sachgerecht und wahrt den Unterschied zwischen Haupttext und interpretierender Alternative.
