source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: de
  text: Und er brachte von dort alle Schätze aus dem Haus Yahwehs und die Schätze aus dem Haus des Königs heraus[a]. Er zerstückelte alle goldenen Geräte, die Salomo, der König von Israel, im Tempel Yahwehs gemacht hatte[b] – ganz wie Yahweh es gesagt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führte von dort … weg“ oder „nahm von dort … heraus“.'
    reason: lexical_alternative
  - marker: b
    text: Im ersten Satzteil steht „Haus Yahwehs“; hier verwendet der hebräische Text ein anderes Wort, das genauer den Tempelbau oder das Heiligtum bezeichnen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: er führte von dort … weg
  rationale: Der Hifil von יצא bezeichnet hier das Herausbringen beziehungsweise Entfernen der Schätze. „Wegführen“ ist im Plünderungskontext natürlich und bewahrt den konkreten Bewegungssinn.
- source_word: אוֹצְרוֹת
  choice: Schätze
  rationale: Gemeint sind in diesem Zusammenhang die weggebrachten Wertgegenstände, nicht in erster Linie die Schatzkammern.
- source_word: בֵּית יְהוָה
  choice: Haus Yahwehs
  rationale: Die konkrete Wendung „Haus Yahwehs“ gibt בֵּית יְהוָה transparent wieder und bewahrt den Unterschied zu הֵיכַל im späteren Satzteil.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Haus des Königs
  rationale: Die formnahe Wiedergabe erhält die Parallelität zum „Haus Yahwehs“; im Kontext ist der Königspalast gemeint.
- source_word: וַיְקַצֵּץ
  choice: er zerstückelte
  rationale: Der Piel von קצץ bezeichnet das Zerschneiden beziehungsweise Zerteilen. „Zerstückelte“ gibt die gewaltsame Zerlegung wieder, ohne sie bloß als allgemeine Zerstörung zu umschreiben.
- source_word: כְּלֵי הַזָּהָב
  choice: goldene Geräte
  rationale: כְּלִי ist ein weiter Begriff für Gegenstände oder Geräte; „goldene Geräte“ ist für den Tempelkontext verständlich und angemessen.
- source_word: עָשָׂה
  choice: hatte anfertigen lassen
  rationale: Bei königlichen Tempelarbeiten kann עשה idiomatisch ausdrücken, dass Salomo die Geräte herstellen ließ. Das Plusquamperfekt markiert, dass dies lange vor ihrer Zerstückelung geschah.
- source_word: בְּהֵיכַל יְהוָה
  choice: im Tempel Yahwehs
  rationale: הֵיכַל bezeichnet hier den Tempel beziehungsweise das Heiligtum. „Tempel“ unterscheidet das Wort sinnvoll vom vorherigen בֵּית.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ganz wie Yahweh es gesagt hatte
  rationale: Die Formulierung bewahrt den Rückbezug auf ein zuvor ergangenes Wort Yahwehs und dessen Erfüllung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Yahweh“ macht diesen Namen unmittelbar sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Erfüllung in כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ganz wie Yahweh es gesagt hatte
  alternative: wie Yahweh angekündigt hatte
  rationale: „Gesagt hatte“ bleibt näher an דִּבֶּר und lässt offen, auf welches frühere göttliche Wort der Erzähler genau verweist, während „angekündigt“ den prophetischen Charakter stärker auslegen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Haus … Haus“ bildet die hebräische Parallelität ab; „Tempel“ im zweiten Satz wahrt den dortigen Wortwechsel. Der Gedankenstrich hebt die abschließende Erfüllungsformel hervor, ohne zusätzliche Deutung einzutragen.
