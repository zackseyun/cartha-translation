revisions:
- from: Und er führte von dort alle Schätze aus dem Haus Yahwehs und die Schätze aus dem Haus des Königs weg[a]. Er zerstückelte alle goldenen Geräte, die Salomo, der König von Israel, im Tempel Yahwehs hatte anfertigen lassen[b] – ganz wie Yahweh es gesagt hatte.
  to: Und er brachte von dort alle Schätze aus dem Haus Yahwehs und die Schätze aus dem Haus des Königs heraus[a]. Er zerstückelte alle goldenen Geräte, die Salomo, der König von Israel, im Tempel Yahwehs gemacht hatte[b] – ganz wie Yahweh es gesagt hatte.
  rationale: 'Die Übersetzung wird ausschließlich dort geändert, wo die deutsche Fassung eine nicht im Ausgangstext enthaltene Kausativbedeutung einträgt: „hatte anfertigen lassen“ wird zu „gemacht hatte“. Die Herausbringung, die Zerstückelung, die Bezeichnung Yahwehs und die Unterscheidung zwischen „Haus“ und „Tempel“ bleiben erhalten. Fußnote a wird zu einer genauen lexikalischen Alternative für וַיּוֹצֵא מִשָּׁם gestrafft.'
