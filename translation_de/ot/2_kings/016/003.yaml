  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: de
  text: Er folgte dem Weg der Könige Israels und ließ sogar seinen Sohn durchs Feuer gehen[a], nach den abscheulichen Bräuchen der Völker, die Jahwe vor den Israeliten vertrieben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „opferte seinen Sohn im Feuer“. Wörtlich heißt es: „ließ seinen Sohn durchs Feuer gehen“; die Wendung bezeichnet einen verurteilten heidnischen Ritus.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Er folgte dem Weg
  rationale: Die Verbindung von הלך mit דרך bezeichnet bildhaft die Lebensführung. „Dem Weg folgen“ bewahrt das Bild und klingt im modernen Deutschen natürlich.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Die Genitivverbindung verweist auf die Herrscher des Nordreichs als negatives Vorbild.
- source_word: וְגַם
  choice: und … sogar
  rationale: גם steigert die Aussage und hebt die folgende Tat als weitere, besonders schwere Verfehlung hervor.
- source_word: אֶת־בְּנוֹ
  choice: seinen Sohn
  rationale: Der hebräische Ausdruck steht ausdrücklich im Singular.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: ließ … durchs Feuer gehen
  rationale: Die Wiedergabe erhält die hebräische Wendung, ohne die genaue Durchführung des verurteilten Ritus über den Wortlaut hinaus festzulegen.
- source_word: כְּתֹעֲבוֹת הַגּוֹיִם
  choice: ganz nach den abscheulichen Bräuchen der Völker
  rationale: כְּ bezeichnet hier die Übereinstimmung mit den verwerflichen Praktiken der Völker. „Abs​​cheuliche Bräuche“ gibt den kultisch-moralischen Sinn von תועבות in verständlichem Deutsch wieder.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: die … vertrieben hatte
  rationale: הורישׁ bedeutet in diesem Zusammenhang, die bisherigen Bewohner aus dem Land zu vertreiben beziehungsweise zu enteignen; das Plusquamperfekt macht den zeitlichen Rückbezug deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: Die Wendung bezeichnet die Vertreibung der Völker angesichts beziehungsweise zugunsten Israels. „Israeliten“ ist im Deutschen die natürliche Bezeichnung für die בני ישראל als Volk.
theological_decisions:
- issue: Ob הֶעֱבִיר בָּאֵשׁ ausdrücklich als vollzogenes Kinderopfer wiederzugeben ist
  choice: Die bildhafte Wendung „ließ seinen Sohn durchs Feuer gehen“ bleibt im Haupttext erhalten.
  alternative: „opferte seinen Sohn im Feuer“
  rationale: Der Zusammenhang verurteilt eindeutig einen heidnischen Ritus; die hebräische Formulierung allein beschreibt dessen genaue Durchführung jedoch nicht vollständig. Die Übersetzung bewahrt diese Unbestimmtheit, während die Fußnote die verbreitete Deutung nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Weg-Metapher und die bewusst nicht vollständig aufgelöste Bezeichnung des Feuerritus bleiben erhalten; schwer verständliche wörtliche Syntax wird zugleich idiomatisch geglättet.
