base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: de
  text: Und Ahas legte sich zu seinen Vätern[a] und wurde mit seinen Vätern in der Stadt Davids begraben; und sein Sohn Hiskia wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „sich zu seinen Vätern legen“ ist eine feste königliche Todesformel und bedeutet, dass Ahas starb.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Bewahrt die formelhafte hebräische Umschreibung des Todes in königlichen Schlussnotizen, ohne sie interpretierend durch „starb“ zu ersetzen.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Das Nifal wird natürlich als deutsches Passiv wiedergegeben.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Entspricht der üblichen deutschen Form der Ortsbezeichnung und bildet die hebräische Genitivverbindung klar ab.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Verb hier den Herrschaftsantritt; „wurde König“ ist im heutigen Deutsch natürlicher und präziser als das rückblickend klingende „regierte“.
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: Verwendet die im Deutschen etablierte Form des Personennamens.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Gibt die ausdrückliche Sohnesbezeichnung des hebräischen Textes wieder.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Bewahrt den Gedanken der Ablösung beziehungsweise königlichen Nachfolge.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Todesformel wird bewusst erhalten und in der Fußnote erläutert; „Väter“ wahrt ihren dynastischen Klang. Der Fußnotenmarker steht nach dem vollständigen Vers, damit deutlich ist, dass die Anmerkung die Todesformel und nicht die Stadt Davids erklärt.
