  text: בָּ/עֵ֣ת הַ/הִ֗יא הֵ֠שִׁיב רְצִ֨ין מֶֽלֶךְ אֲרָ֤ם אֶת אֵילַת֙ לַֽ/אֲרָ֔ם וַ/יְנַשֵּׁ֥ל אֶת הַ/יְהוּדִ֖ים מֵֽ/אֵיל֑וֹת ו/ארמים בָּ֣אוּ אֵילַ֔ת וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: de
  text: Zu jener Zeit brachte Rezin, der König von Aram, Elat wieder unter die Herrschaft Arams und vertrieb die Judäer aus Elat[b]; und die Aramäer[a] kamen nach Elat und wohnen dort bis heute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Aramäer«. Einige Ausleger und alte Textzeugen bevorzugen jedoch »Edomiter«, wohl weil diese Lesart besser zum weiteren Zusammenhang und zum Parallelbericht in 2. Chronik 28,17 passt.'
    reason: textual_variant
  - marker: b
    text: Der Ortsname Elat erscheint an dieser Stelle im Hebräischen auch in der abweichenden Form »Elot«.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: brachte … wieder unter die Herrschaft
  rationale: Der Hifil von שוב bezeichnet hier, dass Elat erneut in den Machtbereich Arams gelangte. Die Formulierung gibt den politischen Zusammenhang natürlich und präzise wieder.
- source_word: אֵילַת / אֵילוֹת
  choice: Elat
  rationale: Der Ortsname erscheint im Vers in zwei Schreibformen. »Elat« ist die geläufige deutsche Wiedergabe; die abweichende Form wird in einer Fußnote kenntlich gemacht.
- source_word: לַאֲרָם
  choice: unter die Herrschaft Arams
  rationale: Die Präposition bezeichnet hier die Übertragung von Besitz oder Kontrolle. »Aram« bewahrt den hebräischen Eigennamen und vermeidet die spätere Bezeichnung »Syrien«.
- source_word: וַיְנַשֵּׁל
  choice: vertrieb … aus
  rationale: Das Verb bezeichnet das gewaltsame Entfernen aus einem Besitz- oder Siedlungsgebiet. »Vertrieb« ist im Deutschen anschaulich und idiomatisch.
- source_word: הַיְהוּדִים
  choice: die Judäer
  rationale: Im monarchischen Zusammenhang sind die Bewohner beziehungsweise Angehörigen Judas gemeint. »Judäer« wahrt diesen historischen Bezug besser als das stärker religiös geprägte »Juden«.
- source_word: ו/ארמים
  choice: die Aramäer
  rationale: Der masoretische Konsonantentext liest »Aramäer«. Die textkritisch erwogene Lesart »Edomiter« wird nicht stillschweigend übernommen, sondern in der Fußnote dokumentiert.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: wohnen dort bis zum heutigen Tag
  rationale: Die hebräische Wendung beschreibt einen vom erzählten Ereignis bis zur Gegenwart des Erzählers fortdauernden Zustand. Das deutsche Präsens bringt diese Fortdauer natürlich zum Ausdruck.
theological_decisions:
- issue: Textkritische Schwierigkeit beim Volksnamen im letzten Satz
  choice: Darauf kamen die Aramäer nach Elat
  alternative: Darauf kamen die Edomiter nach Elat
  rationale: Der masoretische Text bietet »Aramäer« und bestimmt daher den Haupttext. Die alternative Lesart »Edomiter« passt nach Ansicht vieler besser zum historischen Zusammenhang und zu 2. Chronik 28,17; sie wird deshalb transparent in der Fußnote bewahrt, ohne die Spannung im Text aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die politische Bedeutung von הֵשִׁיב wird explizit, aber knapp wiedergegeben. Historisch präzise Ethnonyme (Aramäer, Judäer) werden beibehalten; die textkritische Spannung zwischen Aramäern und Edomitern bleibt in der Fußnote sichtbar.
