  text: וַ/יְקַצֵּץ֩ הַ/מֶּ֨לֶךְ אָחָ֜ז אֶת הַ/מִּסְגְּר֣וֹת הַ/מְּכֹנ֗וֹת וַ/יָּ֤סַר מֵֽ/עֲלֵי/הֶם֙ ו/את הַ/כִּיֹּ֔ר וְ/אֶת הַ/יָּ֣ם הוֹרִ֔ד מֵ/עַ֛ל הַ/בָּקָ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁ֣ר תַּחְתֶּ֑י/הָ וַ/יִּתֵּ֣ן אֹת֔/וֹ עַ֖ל מַרְצֶ֥פֶת אֲבָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: de
  text: Darauf schnitt König Ahas die Einfassungen der Gestelle ab und nahm das Becken[a] von ihnen herunter. Das »Meer«[b] holte er von den bronzenen Rindern[c] herunter, die sich darunter befanden, und stellte es auf ein Steinpflaster.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Waschbecken«. Gemeint ist ein Becken, das im Tempeldienst verwendet wurde.'
    reason: lexical_alternative
  - marker: b
    text: Das »Meer« war das große Becken im salomonischen Tempel (siehe 1. Könige 7,23–26).
    reason: cross_reference
  - marker: c
    text: 'Oder: »bronzenen Stieren«. Das hebräische Wort bezeichnet allgemein Rinder beziehungsweise Großvieh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: schnitt … ab
  rationale: Das Verb קצץ bezeichnet das Ab- oder Wegschneiden. Die deutsche Wendung gibt den Abbau der Teile direkt und natürlich wieder.
- source_word: הַמִּסְגְּרוֹת
  choice: die Einfassungen
  rationale: מִסְגְּרוֹת bezeichnet gerahmte, begrenzende Konstruktionsteile. »Einfassungen« bleibt gegenüber »Platten« oder »Leisten« ausreichend offen.
- source_word: הַמְּכֹנוֹת
  choice: der Gestelle
  rationale: Im Zusammenhang der Tempelausstattung sind מְכֹנוֹת die fahrbaren Untergestelle beziehungsweise Sockel der Becken. »Gestelle« ist verständlich und konkret.
- source_word: הַכִּיּוֹר
  choice: das Becken
  rationale: כִּיּוֹר ist ein für Waschungen im Tempeldienst bestimmtes Becken. »Becken« ist im heutigen Deutsch verständlicher als das traditionelle »Waschgefäß« und vermeidet eine nicht ausdrücklich genannte Funktion im Haupttext.
- source_word: הַיָּם
  choice: das »Meer«
  rationale: »Meer« bewahrt die überlieferte Bezeichnung des großen Tempelbeckens. Anführungszeichen kennzeichnen es für heutige Leser als Namen eines Gegenstands und nicht als natürliches Gewässer.
- source_word: הוֹרִד
  choice: holte … herunter
  rationale: Der Hifil von ירד bezeichnet hier das Herunternehmen des großen Beckens von seinen Trägerfiguren. Die Formulierung ist natürlich und bildet die Abwärtsbewegung ab.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: die bronzenen Rinder
  rationale: בָּקָר kann Rinder beziehungsweise Großvieh bezeichnen. »Rinder« wahrt diese lexikalische Breite besser als das spezifischere »Stiere«; נְחֹשֶׁת wird bei Tempelgeräten sachgerecht mit »Bronze« wiedergegeben.
- source_word: אֲשֶׁר תַּחְתֶּיהָ
  choice: die sich darunter befanden
  rationale: Der feminine Singularsuffix bezieht sich auf das grammatisch feminine יָם. Die deutsche Formulierung macht klar, dass die Rinderfiguren unter dem »Meer« waren, ohne zusätzliche Einzelheiten einzutragen.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: stellte es
  rationale: נתן bezeichnet hier das Platzieren des Beckens. »Stellte« passt zu einem großen Gefäß und klingt im Deutschen natürlicher als das allgemeinere »legte«.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: auf ein Steinpflaster
  rationale: מַרְצֶפֶת אֲבָנִים bezeichnet eine mit Steinen befestigte oder gepflasterte Fläche. »Steinpflaster« ist knapp und vermeidet die unbelegte Vorstellung eines erhöhten Sockels.
