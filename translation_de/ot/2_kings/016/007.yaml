source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: de
  text: 'Da sandte Ahas Boten zu Tiglat-Pileser, dem König von Assyrien, und ließ ihm sagen: »Ich bin dein Diener und dein Sohn.[a] Zieh herauf und rette mich aus der Hand[b] des Königs von Aram[c] und aus der Hand des Königs von Israel, die sich gegen mich erheben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Diplomatische Sprache der Unterordnung; sinngemäß auch: »Ich bin dein Vasall und dein Sohn.«'
    reason: lexical_alternative
  - marker: b
    text: '»Aus der Hand« bedeutet hier: aus der Gewalt oder Macht.'
    reason: idiom_explanation
  - marker: c
    text: Aram wird traditionell auch mit »Syrien« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Der narrative Wayyiqtol wird mit einer natürlichen deutschen Erzählungsfortsetzung wiedergegeben.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im politischen Zusammenhang bezeichnet das Wort menschliche Abgesandte; »Boten« ist verständlich und quellennah.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: Tiglat-Pileser
  rationale: Gebräuchliche deutsche Umschrift des assyrischen Königsnamens.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: dem König von Assyrien
  rationale: Die Apposition bezeichnet Titel und Herrschaftsgebiet eindeutig und idiomatisch.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Die deutsche Botenformel gibt idiomatisch wieder, dass Ahas die folgende Botschaft durch Gesandte übermitteln ließ.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: dein Diener und dein Sohn
  rationale: Die wörtliche Wiedergabe bewahrt die diplomatische Sprache der Unterordnung und das auffällige Nebeneinander von Dienst- und Sohnschaftsbezeichnung.
- source_word: עֲלֵה
  choice: Zieh herauf
  rationale: Bewahrt die Bewegungsrichtung von עלה und lässt im politischen Kontext den militärischen Aufbruch erkennen, ohne ihn ausdrücklich hinzuzufügen.
- source_word: וְהוֹשִׁיעֵנִי
  choice: rette mich
  rationale: Gibt den Hifil von ישׁע direkt wieder; der Kontext bestimmt die Rettung als militärisch-politisch.
- source_word: מִכַּף
  choice: aus der Hand
  rationale: Bewahrt das konkrete hebräische Bild; eine Fußnote erläutert die Bedeutung »aus der Gewalt/Macht«.
- source_word: אֲרָם
  choice: Aram
  rationale: Die quellennähere historische Bezeichnung vermeidet die mögliche Gleichsetzung mit dem modernen Syrien.
- source_word: הַקּוֹמִים עָלָי
  choice: die sich gegen mich erheben
  rationale: Das Partizip bezeichnet eine andauernde feindliche Handlung; die deutsche Form bewahrt Bild und Aspekt.
theological_decisions:
- issue: Diplomatische Selbsterniedrigung des Ahas
  choice: »dein Diener und dein Sohn«
  alternative: »dein Vasall und dein Sohn«
  rationale: Der politische Unterwerfungscharakter ist vorhanden, doch der hebräische Text verwendet Dienst- und Verwandtschaftssprache. Die Hauptübersetzung bewahrt diese rhetorische Spannung.
- issue: Bedeutungsumfang von ישׁע im politischen Kontext
  choice: »rette mich«
  alternative: »befreie mich« oder »hilf mir«
  rationale: »Rette mich« erhält die lexikalische Verbindung zum weiteren biblischen Sprachgebrauch, ohne hier eine geistliche Rettung zu unterstellen; der Zusammenhang ist klar militärisch-politisch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. Historische Eigennamen folgen gebräuchlichen deutschen Formen; konkrete hebräische Bilder werden nach Möglichkeit im Haupttext bewahrt und knapp erläutert.
