  text: ו/יצו/הו הַ/מֶּֽלֶךְ אָ֠חָז אֶת אוּרִיָּ֨ה הַ/כֹּהֵ֜ן לֵ/אמֹ֗ר עַ֣ל הַ/מִּזְבֵּ֣חַ הַ/גָּד֡וֹל הַקְטֵ֣ר אֶת עֹֽלַת הַ/בֹּקֶר֩ וְ/אֶת מִנְחַ֨ת הָ/עֶ֜רֶב וְֽ/אֶת עֹלַ֧ת הַ/מֶּ֣לֶךְ וְ/אֶת מִנְחָת֗/וֹ וְ֠/אֵת עֹלַ֞ת כָּל עַ֤ם הָ/אָ֨רֶץ֙ וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֔ם וְ/כָל דַּ֥ם עֹלָ֛ה וְ/כָל דַּם זֶ֖בַח עָלָ֣י/ו תִּזְרֹ֑ק וּ/מִזְבַּ֧ח הַ/נְּחֹ֛שֶׁת יִֽהְיֶה לִּ֖/י לְ/בַקֵּֽר־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: de
  text: 'Dann befahl König Ahas dem Priester Uria: »Auf dem großen Altar sollst du das Morgenbrandopfer und das abendliche Speiseopfer in Rauch aufgehen lassen, ebenso das Brandopfer des Königs und sein Speiseopfer sowie das Brandopfer des ganzen Volkes des Landes, ihre Speiseopfer und ihre Trankopfer. Alles Blut des Brandopfers und alles Blut des Schlachtopfers sollst du auf ihn sprengen. Der bronzene Altar aber soll mir zur Prüfung dienen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur Besichtigung«, »zur Erwägung« oder möglicherweise »zur Befragung«. Der hebräische Ausdruck ist schwierig; welche genaue Funktion Ahas dem bronzenen Altar zuweist, bleibt unklar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז אֶת אוּרִיָּה הַכֹּהֵן
  choice: Dann befahl König Ahas dem Priester Uria
  rationale: Die deutsche Wortstellung ist natürlich und bewahrt sowohl die königliche Autorität von צוה als auch Titel und Namen.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: Auf dem großen Altar
  rationale: Die räumliche Präposition und das Adjektiv bleiben erhalten; gemeint ist offenbar der neu errichtete, vom bronzenen Altar unterschiedene Altar.
- source_word: הַקְטֵר
  choice: in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet hier das Verbrennen eines Opfers auf dem Altar; die Formulierung bildet den Rauchaufstieg genauer ab als das allgemeinere „darbringen“.
- source_word: עֹלַת הַבֹּקֶר ... מִנְחַת הָעֶרֶב
  choice: das Morgenbrandopfer und das abendliche Speiseopfer
  rationale: „Brandopfer“ und „Speiseopfer“ sind verständliche, etablierte Bezeichnungen der beiden Opferarten; die zeitlichen Zuordnungen werden bewahrt.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: das Brandopfer des ganzen Volkes des Landes
  rationale: Die kollektive und sozial-politische Wendung עַם הָאָרֶץ wird möglichst wörtlich wiedergegeben, ohne sie verengend als „einfache Leute“ zu deuten.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: ihre Speiseopfer und ihre Trankopfer
  rationale: Die Pluralformen und der distributive Bezug auf das Volk werden im Deutschen ausdrücklich erhalten.
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: alles Blut der Brandopfer und alles Blut der Schlachtopfer
  rationale: Die hebräische Parallelstruktur bleibt erhalten; זֶבַח wird als „Schlachtopfer“ von עֹלָה, dem Brandopfer, unterschieden.
- source_word: עָלָיו תִּזְרֹק
  choice: sollst du an ihn sprengen
  rationale: זרק bezeichnet den kräftigen rituellen Auftrag des Blutes, nicht ein leichtes Besprengen; „ihn“ bezieht sich auf den großen Altar.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת יִהְיֶה לִּי לְבַקֵּר
  choice: Der bronzene Altar aber soll mir zur Prüfung dienen
  rationale: „Zur Prüfung“ gibt die Grundbedeutung von בקר wieder, ohne die schwierige Wendung vorschnell als eine bestimmte Form kultischer Befragung festzulegen.
theological_decisions:
- issue: Funktion des bronzenen Altars in לְבַקֵּר
  choice: zur Prüfung dienen
  alternative: für mich zur Befragung dienen / damit ich darüber nachdenke / zur Besichtigung
  rationale: Die Wendung ist in diesem Zusammenhang unsicher. Der Haupttext folgt einer möglichen Grundbedeutung von בקר; die Fußnote hält die konsultative oder kultische Deutung ausdrücklich offen und vermeidet eine unbelegte Festlegung auf Wahrsagung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher kultischer Fachsprache. Die Aufzählungsstruktur des Hebräischen wird bewahrt, aber durch Satzteilung lesbarer gestaltet. Der Fußnotenmarker [a] steht unmittelbar nach der strittigen Aussage.
