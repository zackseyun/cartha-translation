source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּעַל֩ מֶ֨לֶךְ אַשּׁ֤וּר אֶל דַּמֶּ֨שֶׂק֙ וַֽ/יִּתְפְּשֶׂ֔/הָ וַ/יַּגְלֶ֖/הָ קִ֑ירָ/ה וְ/אֶת רְצִ֖ין הֵמִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: de
  text: Da hörte der König von Assyrien auf ihn[a]. Der König von Assyrien zog gegen Damaskus, nahm die Stadt ein, verschleppte ihre Einwohner nach Kir[b] und ließ Rezin töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beachtete ihn“. Das hebräische Verb kann ein Hören bezeichnen, auf das eine entsprechende Handlung folgt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „verschleppte sie nach Kir“; dabei steht die Stadt für ihre Einwohner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: hörte ... auf ihn
  rationale: שׁמע mit אֶל bezeichnet hier ein Hören, das eine entsprechende Reaktion einschließt. Die deutsche Wendung lässt die konkrete Reaktion durch die folgenden Handlungen entfalten.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die direkte Wiedergabe der Status-constructus-Verbindung wird bei beiden Vorkommen wiederholt und bewahrt so den erzählerischen Nachdruck des Hebräischen.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: zog gegen Damaskus
  rationale: עלה mit אֶל hat im militärischen Zusammenhang die Bedeutung eines Vorrückens gegen eine Stadt. „Zog gegen“ ist im Deutschen natürlich und eindeutig.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: nahm die Stadt ein
  rationale: תפשׂ bezeichnet hier die militärische Einnahme von Damaskus. Das Bezugswort „die Stadt“ vermeidet ein missverständliches Pronomen.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: verschleppte ihre Einwohner nach Kir
  rationale: Das feminine Suffix bezieht sich formal auf Damaskus, wobei die Stadt metonymisch für ihre Bevölkerung steht. Die Wiedergabe macht diese im Deutschen erforderliche Auflösung transparent.
- source_word: קִירָה
  choice: Kir
  rationale: Der Ortsname wird transliteriert; die hebräische Richtungsendung wird mit „nach“ wiedergegeben.
- source_word: וְאֶת רְצִין הֵמִית
  choice: und ließ Rezin töten
  rationale: Der Hifil von מות bedeutet „zu Tode bringen“. „Ließ ... töten“ gibt die kausative Form präzise und im königlichen Handlungskontext idiomatisch wieder, ohne die Art der Hinrichtung näher festzulegen.
