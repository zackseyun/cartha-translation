  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: de
  text: Ahas war zwanzig Jahre alt, als er König wurde, und regierte sechzehn Jahre in Jerusalem. Er tat nicht, was in den Augen Jahwes, seines Gottes, recht war, wie es sein Vater David getan hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Vater“ ist hier David als Vorfahr und dynastischer Ahnherr von Ahas gemeint, nicht sein unmittelbarer Vater.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: war zwanzig Jahre alt
  rationale: Die hebräische Altersformel wird mit ihrer natürlichen deutschen Entsprechung wiedergegeben.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet hier den Zeitpunkt von Ahas’ Regierungsantritt; diese Formulierung ist im modernen Deutsch klar und idiomatisch.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet die Ausübung der Königsherrschaft und wird im deutschen Königsformular natürlich mit „regierte“ wiedergegeben.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: tat nicht, was … recht war
  rationale: Die Formulierung bewahrt die moralische Bewertung des hebräischen Textes und klingt zugleich natürlich.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Das transparente hebräische Bild für die Beurteilung aus Gottes Sicht lässt sich im Deutschen unmittelbar beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die geläufige deutsche Form.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: Das Possessivsuffix bezieht sich auf Ahas; die deutsche Apposition bewahrt die persönliche und bundesbezogene Formulierung.
- source_word: כְּדָוִד אָבִיו
  choice: wie sein Vater David
  rationale: Die knappe Vergleichsform und das hebräische Verwandtschaftswort werden im Haupttext bewahrt; der dynastische Sinn von „Vater“ wird in einer Fußnote erklärt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname Gottes. Seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „sein Vater David“
  choice: Die Vater-Bezeichnung im Haupttext beibehalten
  alternative: sein Vorfahr David
  rationale: אָב kann im königlichen und dynastischen Zusammenhang einen Vorfahren bezeichnen. Der Haupttext bleibt formal nah am Hebräischen, während die Fußnote ein mögliches Missverständnis ausschließt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle biblische Bild „in den Augen“ bleibt erhalten; Satzbau und Königsformular sind zugleich für heutige Leser unmittelbar verständlich.
