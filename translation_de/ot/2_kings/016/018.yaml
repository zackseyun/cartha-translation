  rationale: Die Revision vermeidet die nicht abgesicherte Vorstellung eines „Gangs“ und ersetzt die missverständliche Wendung „am Haus Jahwes verlegen“ durch eine idiomatische Formulierung, welche die Abwendung vom Haus Jahwes deutlich macht. Die Reihenfolge der Satzglieder und die offene Bedeutung von הֵסֵב sowie מִפְּנֵי bleiben gewahrt. In den Begleitentscheidungen ist „Ahab“ zu „Ahaz“ zu berichtigen.
