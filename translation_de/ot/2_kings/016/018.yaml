base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: de
  text: Die Überdachung für den Sabbat, die man im Haus gebaut hatte,[a] und den äußeren Eingang des Königs[b] verlegte er wegen des Königs von Assyrien[d] vom Haus Jahwes weg.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den überdachten Bau für den Sabbat«, »den Sabbatpavillon« oder »die Sabbatvorhalle«. Die genaue Bedeutung des seltenen hebräischen Architekturbegriffs ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den äußeren Königseingang« beziehungsweise »den äußeren Zugangsweg für den König«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »wandte er vom Haus Jahwes ab«, »änderte er am Haus Jahwes« oder »entfernte er vom Haus Jahwes«. Das hebräische Verb kann ein Abwenden, Verlegen oder Umgestalten bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »aus Furcht vor dem König von Assyrien«.'
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: der überdachte Sabbatgang
  rationale: מיסך ist ein seltenes, in seiner genauen architektonischen Bedeutung unsicheres Wort für eine überdachte Anlage. „Überdachter Sabbatgang“ ist im Deutschen verständlich und wahrt den möglichen Bezug zu einem Zugang oder Umgang; Alternativen stehen in der Fußnote.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: den man im Haus gebaut hatte
  rationale: Das unbestimmte Subjekt der 3. Person Plural wird im natürlichen Deutschen mit „man“ wiedergegeben. „Haus“ bewahrt die hebräische Bezeichnung des Tempels.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: den äußeren Eingang des Königs
  rationale: מְבוֹא bezeichnet einen Eingang oder Zugangsweg. Die Zuordnung von הַחִיצוֹנָה wird als „äußeren“ wiedergegeben, ohne die genaue bauliche Funktion festzulegen.
- source_word: הֵסֵב
  choice: ließ er … verlegen
  rationale: Das Hifil von סבב bezeichnet hier ein Abwenden, Umlenken oder Verändern der Lage. „Verlegen lassen“ passt zum architektonischen Zusammenhang und vermeidet die stärkere, nicht zwingende Aussage einer völligen Entfernung.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die hebräische Wendung wird formal bewahrt; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: wegen des Königs von Assyrien
  rationale: „Wegen“ gibt die Ursache oder Motivation offen wieder, ohne ausdrücklich Angst als Beweggrund festzulegen.
theological_decisions:
- issue: Motiv Ahabs für die bauliche Änderung unter assyrischem Druck
  choice: wegen des Königs von Assyrien
  alternative: aus Furcht vor dem König von Assyrien
  rationale: מִפְּנֵי lässt einen ursächlichen oder durch die Gegenwart beziehungsweise Macht einer Person ausgelösten Beweggrund zu. Der Haupttext wahrt diese Offenheit.
- issue: Art der Veränderung am Tempel
  choice: ließ er … verlegen
  alternative: entfernte er; ließ er abändern; lenkte er weg
  rationale: הֵסֵב verlangt nicht eindeutig eine vollständige Beseitigung. Die Übersetzung wahrt die räumliche Grundbedeutung und die historische Ungewissheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellten Objekte spiegeln die markierte hebräische Satzstellung, während „ließ … verlegen“ den Satz idiomatisch zusammenhält. Die seltenen Architekturbegriffe und Ahabs Beweggrund werden nicht überpräzisiert.
