source:
  edition: WLC
  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: de
  text: Den Bronzealtar[a] aber, der vor Jahwe stand, rückte er von vor dem Haus weg, von der Stelle zwischen dem Altar und dem Haus Jahwes[b], und stellte ihn an die Nordseite des Altars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kupferaltar“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Haus Jahwes“; gemeint ist der Tempel.'
    reason: clarification
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: den Bronzealtar
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Im Zusammenhang mit Tempelgeräten ist „Bronze“ die herkömmliche und wahrscheinlichere Wiedergabe; die materielle Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: der vor Jahwe stand
  rationale: לִפְנֵי bezeichnet hier die räumliche Lage „vor“ Jahwe. Das ergänzte „stand“ ergibt im Deutschen einen natürlichen Relativsatz, ohne die Ortsangabe umzudeuten.
- source_word: וַיַּקְרֵב מֵאֵת פְּנֵי הַבַּיִת
  choice: rückte er von der Vorderseite des Hauses weg
  rationale: קרב bedeutet grundsätzlich „nahebringen“, doch die mit מֵאֵת bezeichnete Ausgangslage und der folgende neue Standort beschreiben eine Versetzung. „rückte … weg“ gibt diese Bewegung in natürlichem Deutsch wieder.
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: von der Stelle zwischen dem Altar und dem Haus Jahwes
  rationale: Das wiederholte מִבֵּין kennzeichnet den bisherigen Standort. „von der Stelle“ macht die deutsche Konstruktion verständlich, während „Haus Jahwes“ die hebräische Tempelbezeichnung bewahrt.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: und stellte ihn
  rationale: נתן kann „geben“, „setzen“ oder „stellen“ bedeuten. Bei der Platzierung eines Altars ist „stellte“ sachlich und idiomatisch.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: an die Nordseite des Altars
  rationale: יֶרֶךְ bezeichnet die Seite oder Flanke, צָפוֹנָה die Richtung nach Norden. „an die Nordseite“ gibt Ziel und Lage knapp wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Yahweh; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen Form der wissenschaftlich begründeten Aussprache, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Altar“ und die Bezeichnung „Haus Jahwes“ bleiben nahe am Hebräischen; leichte syntaktische Ergänzungen sorgen für natürliche Verständlichkeit.
