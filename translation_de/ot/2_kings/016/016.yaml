  text: וַ/יַּ֖עַשׂ אוּרִיָּ֣ה הַ/כֹּהֵ֑ן כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֥לֶךְ אָחָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/016.yaml
  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: de
  text: Und der Priester Uria tat alles so, wie König Ahas es befohlen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עָשָׂה bedeutet allgemein »tun/machen«. In Verbindung mit כְּכֹל אֲשֶׁר bezeichnet es hier die Ausführung gemäß einer Vorgabe; »tat« gibt den schlichten Erzählsinn natürlich wieder.
- source_word: אוּרִיָּה
  choice: Uria
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form »Uria« wiedergegeben.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der bestimmte Ausdruck bezeichnet Urias Amt; »der Priester« entspricht dem hebräischen Wortlaut und ist idiomatisch.
- source_word: כְּכֹל אֲשֶׁר
  choice: alles so, wie
  rationale: Die Wendung drückt vollständige Übereinstimmung mit dem nachfolgenden Befehl aus. »alles so, wie« ist modernes, natürliches Deutsch und bewahrt den umfassenden Sinn von כֹּל.
- source_word: צִוָּה
  choice: befohlen hatte
  rationale: צוה bedeutet »befehlen«. Das Plusquamperfekt macht im Deutschen deutlich, dass der Befehl der Ausführung vorausging.
- source_word: הַמֶּלֶךְ אָחָז
  choice: König Ahas
  rationale: Im Deutschen steht der Herrschertitel idiomatisch ohne Artikel vor dem Eigennamen; »Ahas« ist die etablierte deutsche Namensform.
theological_decisions:
- issue: Erzählerische Bewertung von Urias Gehorsam
  choice: Die Ausführung wird rein beschreibend wiedergegeben, ohne ausdrückliche moralische Wertung.
  alternative: Eine Formulierung, die Urias Handeln ausdrücklich billigt oder verurteilt.
  rationale: Der hebräische Vers berichtet lediglich, dass Uria vollständig nach dem Befehl des Königs handelte. Eine negative Bewertung mag sich aus dem Kontext ergeben, wird hier aber nicht ausdrücklich formuliert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig und zugleich nahe an der knappen hebräischen Erzählweise; das einleitende »Und« bildet das narrative וַ־ ab.
