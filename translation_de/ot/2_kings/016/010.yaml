base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: de
  text: Dann zog König Ahas nach Damaskus, um Tiglat-Pileser, dem König von Assyrien, zu begegnen. Dort sah er den Altar in Damaskus. König Ahas schickte dem Priester Urija ein Abbild des Altars und dessen Bauplan mit allen Einzelheiten seiner Ausführung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: um … zu begegnen
  rationale: Gibt die Zielrichtung der Bewegung und die Begegnung mit Tiglat-Pileser natürlich wieder.
- source_word: דְּמוּת
  choice: Abbild
  rationale: Bezeichnet hier eine bildliche beziehungsweise maßgetreue Wiedergabe der Gestalt des Altars, ohne zwingend ein dreidimensionales Modell vorauszusetzen.
- source_word: תַּבְנִיתוֹ
  choice: Bauplan
  rationale: Im handwerklichen Zusammenhang ist eine Darstellung der Konstruktion beziehungsweise Form gemeint; „Bauplan“ ist im Deutschen klar und idiomatisch.
- source_word: לְכָל־מַעֲשֵׂהוּ
  choice: der dessen gesamte Ausführung zeigte
  rationale: Gibt den Bezug auf alle Einzelheiten der handwerklichen Ausführung verständlich wieder, ohne zusätzliche Details einzutragen.
