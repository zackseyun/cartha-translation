base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: de
  text: Im siebzehnten Regierungsjahr Pekachs, des Sohnes Remaljas, wurde Ahas, der Sohn Jotams, König von Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: Im siebzehnten Regierungsjahr
  rationale: Die Datierungsformel bezeichnet das siebzehnte Jahr einer Königsherrschaft. „Regierungsjahr“ macht den im Kontext vorausgesetzten Bezug im Deutschen klar und natürlich.
- source_word: לְפֶקַח בֶּן רְמַלְיָהוּ
  choice: Pekachs, des Sohnes Remaljas
  rationale: Das ל kennzeichnet den Herrscher, nach dessen Regierungsjahren datiert wird. Der Genitiv fügt sich natürlich an „Regierungsjahr“ an; das Patronym bleibt ausdrücklich erhalten.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: In dieser Thronbesteigungsformel bezeichnet das qatal von מלך den Beginn der Herrschaft. „Wurde König“ gibt diesen punktuellen Sinn idiomatisch wieder, ohne eine Regierungsdauer auszudrücken.
- source_word: אָחָז בֶּן יוֹתָם
  choice: Ahas, der Sohn Jotams
  rationale: Die gebräuchlichen deutschen Namensformen werden verwendet; das hebräische Patronym wird vollständig und verständlich wiedergegeben.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Die Herrschaftsbezeichnung wird als deutsches Prädikatsnomen natürlich wiedergegeben.
