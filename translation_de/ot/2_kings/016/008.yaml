source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אָחָ֜ז אֶת הַ/כֶּ֣סֶף וְ/אֶת הַ/זָּהָ֗ב הַ/נִּמְצָא֙ בֵּ֣ית יְהוָ֔ה וּ/בְ/אֹֽצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֥ח לְ/מֶֽלֶךְ אַשּׁ֖וּר שֹֽׁחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: de
  text: Ahas nahm das Silber und das Gold, die im Haus Jahwes und in den Schatzkammern des Königshauses vorhanden waren, und sandte sie dem König von Assyrien als Bestechungsgabe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tribut“ oder „Geschenk“. Das hebräische Wort bezeichnet gewöhnlich eine Bestechungsgabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Die schlichte Erzählform von לקח wird im Deutschen natürlich mit dem Präteritum „nahm“ wiedergegeben.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: das Silber und Gold
  rationale: Die konkreten Bezeichnungen der beiden Edelmetalle bleiben erhalten; der gemeinsame Artikelgebrauch ist im Deutschen flüssig und fasst beide als vorhandene Wertbestände zusammen.
- source_word: הַנִּמְצָא
  choice: das … vorhanden war
  rationale: Das passive Partizip bezeichnet hier die Bestände, die sich an den genannten Orten vorfanden beziehungsweise verfügbar waren. „Vorhanden war“ klingt im Deutschen natürlicher als eine wörtliche Passivform.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete Ausdrucksweise des Hebräischen; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: und in den Schatzkammern des Königshauses
  rationale: אֹצָרוֹת sind Aufbewahrungsorte für Wertbestände. „Königshaus“ gibt בֵּית הַמֶּלֶךְ verständlich wieder und lässt den räumlichen Bezug zu dessen Schatzkammern erkennen.
- source_word: וַיִּשְׁלַח לְמֶלֶךְ אַשּׁוּר
  choice: und sandte es dem König von Assyrien
  rationale: „Es“ nimmt Silber und Gold als eine zusammengefasste Zahlung auf. Der Dativ ist im Deutschen idiomatisch und entspricht dem hebräischen Empfängeranschluss.
- source_word: שֹׁחַד
  choice: als Bestechungsgabe
  rationale: Das Wort bezeichnet gewöhnlich eine Gabe, mit der jemand beeinflusst oder gewonnen werden soll. „Bestechungsgabe“ wahrt diesen negativen Beiklang, während die Fußnote die im politischen Kontext möglichen neutraleren Wiedergaben nennt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Moralische Färbung von שֹׁחַד
  choice: Bestechungsgabe
  alternative: Tribut oder Geschenk
  rationale: Die übliche Bedeutung trägt einen negativen Beiklang. Da im diplomatisch-politischen Zusammenhang auch Tribut oder Geschenk gemeint sein kann, wird diese Bedeutungsbreite in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur folgt dem hebräischen Erzählgang, vermeidet jedoch unnatürliche Wörtlichkeit. „Haus Jahwes“ bewahrt die biblische Bildsprache; „Schatzkammern des Königshauses“ ist im Deutschen klar und idiomatisch.
