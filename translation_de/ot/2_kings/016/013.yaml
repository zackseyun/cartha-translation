  text: וַ/יַּקְטֵ֤ר אֶת עֹֽלָת/וֹ֙ וְ/אֶת מִנְחָת֔/וֹ וַ/יַּסֵּ֖ךְ אֶת נִסְכּ֑/וֹ וַ/יִּזְרֹ֛ק אֶת דַּֽם הַ/שְּׁלָמִ֥ים אֲשֶׁר ל֖/וֹ עַל הַ/מִּזְבֵּֽחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: de
  text: Und er ließ sein Brandopfer und sein Speisopfer in Rauch aufgehen, goss sein Trankopfer aus und sprengte das Blut seiner Heilsopfer[a] an den Altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Friedensopfer“ oder „Gemeinschaftsopfer“. Das hebräische Wort bezeichnet eine bestimmte Opferart (שְׁלָמִים).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: ließ … in Rauch aufgehen
  rationale: Die Hifil-Form von קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar, sodass der Rauch aufsteigt. Die Formulierung gibt diesen kultischen Vorgang genauer wieder als das allgemeinere „verbrannte“.
- source_word: עֹלָתוֹ
  choice: sein Brandopfer
  rationale: עֹלָה ist die feste Bezeichnung für das vollständig auf dem Altar verbrannte Opfer; „Brandopfer“ ist im Deutschen etabliert und verständlich.
- source_word: מִנְחָתוֹ
  choice: sein Speisopfer
  rationale: מִנְחָה bezeichnet hier die aus pflanzlichen Erzeugnissen bestehende Opfergabe. „Speisopfer“ ist die geläufige deutsche Bezeichnung für diese Opferart.
- source_word: וַיַּסֵּךְ
  choice: goss … aus
  rationale: נסך bezeichnet im Opferdienst das Ausgießen einer Flüssigkeit als Opferhandlung.
- source_word: נִסְכּוֹ
  choice: sein Trankopfer
  rationale: נֶסֶךְ bezeichnet das begleitende Flüssigkeitsopfer; „Trankopfer“ ist präzise und im biblischen Sprachgebrauch verständlich.
- source_word: וַיִּזְרֹק
  choice: sprengte
  rationale: זרק bezeichnet beim Opferritus das Werfen beziehungsweise Sprengen des Blutes an den Altar, nicht bloß ein feines Besprengen.
- source_word: דַּם הַשְּׁלָמִים
  choice: das Blut seiner Heilsopfer
  rationale: שְׁלָמִים bezeichnet eine bestimmte Opferkategorie. „Heilsopfer“ ist eine etablierte deutsche Wiedergabe; andere sachlich mögliche Benennungen werden in der Fußnote genannt.
- source_word: אֲשֶׁר לוֹ
  choice: seiner Heilsopfer
  rationale: Die Zugehörigkeitsangabe „die ihm gehörten“ wird im Deutschen natürlich durch das Possessivpronomen „seiner“ ausgedrückt.
- source_word: עַל הַמִּזְבֵּחַ
  choice: an den Altar
  rationale: 'In Verbindung mit זרק bezeichnet עַל hier das Ziel der Bewegung: Das Blut wird an beziehungsweise gegen den Altar gesprengt.'
theological_decisions:
- issue: Wiedergabe der Opferkategorie שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Der hebräische Fachausdruck umfasst eine kultische Opferkategorie, deren Bedeutung nicht vollständig durch ein einzelnes deutsches Wort wiedergegeben wird. „Heilsopfer“ bleibt knapp und etabliert, während die Fußnote echte lexikalische Alternativen bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit etablierten deutschen Opferbegriffen. Die Satzfolge bleibt eng am hebräischen Ritualablauf; das wiederholte „und“ wird für einen natürlichen deutschen Satzbau teilweise reduziert.
