base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: de
  text: So baute der Priester Uria den Altar ganz nach allem, was König Ahas aus Damaskus gesandt hatte. So verfuhr der Priester Uria, bis König Ahas aus Damaskus kam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: Das Verb בנה bezeichnet gewöhnlich das Bauen oder Errichten; »baute« ist hier direkt und natürlich.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: כהן bedeutet »Priester«. Die zweimalige Beifügung zu Uria bleibt erhalten, da die Wiederholung im Hebräischen hervorgehoben ist.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: מזבח ist die übliche Bezeichnung für einen Altar; der bestimmte Artikel wird wiedergegeben.
- source_word: כְּכֹל אֲשֶׁר
  choice: nach allem, was
  rationale: Die Wendung bezeichnet vollständige Übereinstimmung mit dem, was Ahas übermittelt hatte.
- source_word: שָׁלַח
  choice: gesandt hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass Ahas die Vorlage oder Anweisungen bereits vor dem Bau übermittelt hatte.
- source_word: מִדַּמֶּשֶׂק
  choice: aus Damaskus
  rationale: Die Präposition מִן bezeichnet hier Herkunft beziehungsweise Ausgangsort. Beim zweiten Vorkommen ergänzt »zurückkam« im Deutschen natürlich die Rückkehr zum Ausgangsort der Erzählung.
- source_word: כֵּן עָשָׂה
  choice: Genauso machte es
  rationale: Die Wendung betont, dass Uria genau entsprechend der übermittelten Vorgabe handelte.
- source_word: עַד בּוֹא
  choice: noch bevor ... zurückkam
  rationale: 'Im Kontext bezeichnet עַד mit dem Infinitiv בוא den zeitlichen Endpunkt: Uria stellte den Altar bis zur Ankunft des Königs fertig. Die idiomatische deutsche Formulierung bringt zum Ausdruck, dass dies bereits vor dessen Rückkehr geschah.'
- source_word: הַמֶּלֶךְ אָחָז
  choice: König Ahas
  rationale: Dies ist die natürliche deutsche Wiedergabe von Titel und Eigenname.
theological_decisions: []
