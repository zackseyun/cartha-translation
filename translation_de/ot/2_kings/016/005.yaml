  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: de
  text: Damals zogen Rezin, König von Aram, und Pekach, Sohn Remaljas, König von Israel, zum Krieg gegen Jerusalem hinauf. Sie belagerten Ahas, doch konnten sie nicht kämpfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische nennt nach „kämpfen“ kein Bezugswort. Gemeint sein kann ein Kampf gegen Ahas oder gegen Jerusalem; wörtlich: „Sie konnten nicht kämpfen.“'
    reason: Bewahrt die im hebräischen Infinitiv ohne ausgedrücktes Objekt vorhandene Mehrdeutigkeit, ohne die Bedeutung durch „bezwingen“ oder ein ergänztes Pronomen festzulegen.
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Kennzeichnet den Zeitpunkt beziehungsweise den nächsten Schritt der Erzählung in natürlichem Deutsch.
- source_word: יַעֲלֶה
  choice: zogen … hinauf
  rationale: עלה bezeichnet hier den militärischen Zug nach Jerusalem; „hinaufziehen“ bewahrt die für Jerusalem übliche Richtungsangabe.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezin, der König von Aram
  rationale: Der Eigenname wird transliteriert; „Aram“ gibt die hebräische geografisch-ethnische Bezeichnung unmittelbar wieder.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: und Pekach, der Sohn Remaljas, der König von Israel
  rationale: Bewahrt sowohl das Patronym als auch den königlichen Titel in klarer deutscher Apposition.
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: zum Krieg gegen Jerusalem
  rationale: Verbindet Ziel und militärischen Zweck idiomatisch, ohne ein zusätzliches Handlungselement einzuführen.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: Sie belagerten Ahas
  rationale: צור mit על bezeichnet im militärischen Zusammenhang eine Belagerung; das Deutsche verwendet dafür ein direktes Objekt.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: konnten ihn aber im Kampf nicht bezwingen
  rationale: Gibt die erfolglose militärische Auseinandersetzung in verständlichem Deutsch wieder. Da das Hebräische nach „kämpfen“ kein Objekt nennt, wird die Mehrdeutigkeit in einer Fußnote offengelegt.
theological_decisions:
- issue: Nicht genanntes Bezugswort bei לְהִלָּחֵם
  choice: „ihn“ auf Ahas bezogen
  alternative: „es“ auf Jerusalem bezogen; oder formal „konnten nicht kämpfen“
  rationale: Ahas ist das unmittelbar zuvor genannte Objekt. Der hebräische Text wiederholt das Bezugswort jedoch nicht, sodass auch Jerusalem gemeint sein kann; diese echte syntaktische Unbestimmtheit wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namen folgen einer im Deutschen geläufigen Transliteration; „Aram“ bleibt als historische Bezeichnung erhalten. Die Wiederholung der königlichen Titel bildet die hebräische Satzstruktur ab, ohne altertümlich zu wirken.
