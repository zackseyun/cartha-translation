  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: de
  text: Er brachte auf den Höhen, auf den Hügeln und unter jedem grünen Baum Opfer dar und verbrannte Räucherwerk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter jedem belaubten Baum“ beziehungsweise „unter jedem üppig grünen Baum“. Das hebräische Adjektiv kann etwas Grünes, Frisches oder Üppiges bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Er brachte … Opfer dar
  rationale: זבח bezeichnet das Darbringen von Schlachtopfern. Die deutsche Wendung ist natürlich und gibt die kultische Handlung präzise wieder.
- source_word: וַיְקַטֵּר
  choice: und verbrannte Räucherwerk
  rationale: Das Piel von קטר bezeichnet im kultischen Zusammenhang häufig das Verbrennen von Räucherwerk beziehungsweise das Aufsteigenlassen von Opferrauch. Die gewählte Formulierung entspricht hier der wiederkehrenden deuteronomistischen Wendung.
- source_word: בַּבָּמוֹת
  choice: auf den Höhen
  rationale: במות sind örtliche Kultstätten, oft an erhöhten Orten. „Höhen“ ist die etablierte deutsche Wiedergabe und lässt den kultischen Charakter im Kontext erkennbar.
- source_word: וְעַל הַגְּבָעוֹת
  choice: auf den Hügeln
  rationale: גבעות bezeichnet topografische Hügel. Die gesonderte Wiedergabe bewahrt den Unterschied zu den zuvor genannten Kultstätten.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: und unter jedem grünenden Baum
  rationale: רענן kann grün, frisch, belaubt oder üppig bedeuten. „Grünend“ bewahrt das konkrete Bild und klingt im modernen Deutschen natürlicher als „grüner Baum“.
theological_decisions:
- issue: Wiedergabe der Formel für unerlaubte Kulthandlungen
  choice: Die konkreten Handlungen und Orte werden ohne zusätzliche Wertung genannt.
  alternative: 'Eine deutende Fassung wie: „Er betrieb heidnischen Kult an Heiligtümern auf Hügeln und unter jedem belaubten Baum.“'
  rationale: Der hebräische Vers nennt Opferhandlungen und Orte, bezeichnet sie hier aber nicht ausdrücklich als „heidnisch“. Die negative Beurteilung ergibt sich aus dem Zusammenhang und sollte nicht in den Wortlaut hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle kultische Bezeichnung „Höhen“ bleibt erhalten; „grünend“ vermittelt das hebräische Bild verständlich und ohne zusätzliche Deutung.
