base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: de
  text: Als der König aus Damaskus kam, sah er den Altar. Er trat an den Altar heran und stieg auf ihn hinauf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »opferte darauf«. Die Wendung kann im Zusammenhang als Beginn einer Opferhandlung verstanden werden; wörtlich beschreibt sie ein Hinaufsteigen auf den Altar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא ... מִדַּמֶּשֶׂק
  choice: Als der König aus Damaskus kam
  rationale: בוא bezeichnet im Erzählzusammenhang das Kommen beziehungsweise Eintreffen; מִן gibt den Ausgangsort an. Die schlichte Formulierung wahrt die Bewegungsrichtung des Hebräischen, ohne ein im Text nicht ausdrücklich genanntes „Zurückkehren“ einzutragen.
- source_word: וַיַּרְא ... אֶת הַמִּזְבֵּחַ
  choice: sah er den Altar
  rationale: ראה bezeichnet hier die unmittelbare visuelle Wahrnehmung; מִזְבֵּחַ wird mit dem etablierten und präzisen Begriff „Altar“ wiedergegeben.
- source_word: וַיִּקְרַב ... עַל הַמִּזְבֵּחַ
  choice: Er trat an den Altar heran
  rationale: קרב bedeutet sich nähern oder herantreten. In Verbindung mit עַל ist „an den Altar heran“ im Deutschen natürlich und bewahrt die gerichtete Bewegung.
- source_word: וַיַּעַל עָלָיו
  choice: und opferte darauf
  rationale: עלה kann in kultischem Zusammenhang das Hinaufbringen beziehungsweise Darbringen eines Opfers bezeichnen; עָלָיו nennt den Altar als Ort der Handlung. Diese Wiedergabe ergibt im unmittelbaren Opferkontext natürliches Deutsch, während die mögliche räumlich-wörtliche Deutung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Ob וַיַּעַל עָלָיו eine Opferhandlung oder ein körperliches Hinaufsteigen bezeichnet
  choice: „opferte darauf“
  alternative: „stieg auf ihn hinauf“ beziehungsweise „ging zu ihm hinauf“
  rationale: Die hebräische Form kann im kultischen Kontext vom Darbringen eines Opfers verstanden werden, und der folgende Vers entfaltet diese Handlung. Da die Formulierung zugleich räumlich als Hinaufsteigen gelesen werden kann, wird diese echte Mehrdeutigkeit nicht beseitigt, sondern ausdrücklich angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von „der König“ im Hebräischen wird nach der ersten Nennung durch Pronomen aufgenommen, damit der Satz im Deutschen natürlich bleibt; die durchgehende persönliche Handlung des Königs bleibt klar.
