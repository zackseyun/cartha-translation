source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָחָ֖ז אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Die übrigen Taten des Ahas, die er getan hat, sind sie nicht im Buch der Chronik der Könige von Juda[a] aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Buch der Annalen der Könige von Juda“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: יֶתֶר bezeichnet den Rest bzw. das Übrige; דִּבְרֵי meint in der üblichen Königsformel die Taten oder Angelegenheiten eines Herrschers. Die einleitende Konjunktion וְ wird durch den Zusammenhang hinreichend wiedergegeben, ohne ein nicht ausdrücklich vorhandenes zeitliches „Nun“ einzuführen.
- source_word: אָחָז
  choice: Ahas
  rationale: Der Königsname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er vollbrachte
  rationale: Die Relativkonstruktion wird ausdrücklich bewahrt; „vollbrachte“ vermeidet im Deutschen die schwerfällige Wendung „Taten, die er tat“.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht ... aufgeschrieben?
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. Die passive Bedeutung von כְּתוּבִים bleibt mit „aufgeschrieben“ erhalten.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl עַל wörtlich „auf“ heißen kann, ist bei einem schriftlichen Quellenverweis im Deutschen „im Buch“ idiomatisch.
- source_word: דִּבְרֵי הַיָּמִים
  choice: der Chronik
  rationale: Die Wendung bezeichnet hier eine annalistische Aufzeichnung. „Chronik“ wahrt die traditionelle, allgemein verständliche Bezeichnung; „Annalen“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Das לְ bezeichnet hier die Zuordnung der Chronik zu den Königen Judas; der Genitiv ist im Deutschen die natürliche Titelform.
