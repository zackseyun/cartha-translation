base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: de
  text: 'Da geriet der König von Aram über diese Sache in heftige Unruhe. Er rief seine Diener und sagte zu ihnen: »Könnt ihr mir nicht sagen, wer von uns zum König von Israel hält?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסָּעֵר לֵב
  choice: geriet … in heftige Unruhe
  rationale: Das Verb bezeichnet heftige innere Erregung oder Aufgewühltheit; zusammen mit לֵב ist im Deutschen eine Wiedergabe des inneren Zustands natürlicher als die wörtliche Formulierung „sein Herz wurde aufgewühlt“. Sie legt die Nuance nicht einseitig auf Zorn fest.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: über diese Sache
  rationale: דָּבָר bezeichnet hier den beunruhigenden Vorgang beziehungsweise Sachverhalt; „Sache“ wahrt die knappe und kontextuell offene Ausdrucksweise.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Im königlichen Umfeld kann עֶבֶד Hofbedienstete oder Amtsträger bezeichnen. „Diener“ bleibt lexikalisch nah, ohne ihre genaue Funktion festzulegen.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: Könnt ihr mir nicht sagen
  rationale: Die verneinte Frage drückt hier eine nachdrückliche Aufforderung aus. Die deutsche Form erhält den Fragecharakter und klingt zugleich natürlich.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: wer von uns
  rationale: Die Formulierung fragt nach einer Person aus der eigenen Gruppe und wird im Deutschen knapp und idiomatisch wiedergegeben.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: zum König von Israel hält
  rationale: Die knappe Präpositionalverbindung bezeichnet im Kontext Zugehörigkeit, Parteinahme oder Kollusion. „Zu jemandem halten“ gibt diese vermutete Loyalität verständlich wieder, ohne eine konkrete Art des Verrats hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emotionale Heftigkeit wird bewahrt, ohne sie ausschließlich als Zorn zu deuten; die höfische Bezeichnung und der Verdacht auf Parteinahme bleiben bewusst allgemein.
