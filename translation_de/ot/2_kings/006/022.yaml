  text: וַ/יֹּ֨אמֶר֙ לֹ֣א תַכֶּ֔ה הַ/אֲשֶׁ֥ר שָׁבִ֛יתָ בְּ/חַרְבְּ/ךָ֥ וּֽ/בְ/קַשְׁתְּ/ךָ֖ אַתָּ֣ה מַכֶּ֑ה שִׂים֩ לֶ֨חֶם וָ/מַ֜יִם לִ/פְנֵי/הֶ֗ם וְ/יֹֽאכְלוּ֙ וְ/יִשְׁתּ֔וּ וְ/יֵלְכ֖וּ אֶל אֲדֹנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: de
  text: 'Er sagte: »Du sollst sie nicht erschlagen. Würdest du etwa die erschlagen, die du mit deinem Schwert und deinem Bogen gefangen genommen hast?[a] Setz ihnen Brot und Wasser vor[b], damit sie essen und trinken und zu ihren Herren gehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Erschlägst du die, die du mit deinem Schwert und deinem Bogen gefangen genommen hast?« Der hebräische Wortlaut ist rhetorisch und bekräftigt das Verbot, die Gefangenen zu töten.'
    reason: alternative_reading
  - marker: b
    text: »Brot und Wasser« kann allgemein für die nötige Verpflegung stehen; im Hebräischen werden jedoch beide ausdrücklich genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: erschlagen
  rationale: נכה bezeichnet hier angesichts der Frage nach dem Töten der Gefangenen einen tödlichen Schlag. »Erschlagen« bewahrt sowohl die konkrete Gewaltvorstellung als auch den wahrscheinlichen Tötungssinn.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: die du … gefangen genommen hast
  rationale: שבה meint im militärischen Zusammenhang, Menschen gefangen zu nehmen; die Formulierung erhält zugleich den Bezug auf die angeblich eigene Gefangennahme durch den König.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: mit deinem Schwert und deinem Bogen
  rationale: 'Die beiden ausdrücklich genannten Waffen gehören zum Argument: Der König hat diese Männer nicht durch seinen eigenen militärischen Sieg in seine Gewalt gebracht.'
- source_word: שִׂים לֶחֶם וָמַיִם לִפְנֵיהֶם
  choice: Setz ihnen Brot und Wasser vor
  rationale: Die direkte Aufforderung und die konkreten Lebensmittel werden beibehalten; »jemandem etwas vorsetzen« ist dafür eine natürliche deutsche Wendung.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: damit sie essen und trinken und dann … zurückkehren können
  rationale: Die waw-Abfolge bezeichnet hier das beabsichtigte Ergebnis der Bewirtung. »Dann« macht die zeitliche Folge natürlich deutlich, während »zurückkehren« im Kontext den Sinn des Gehens zu ihrem Herrn wiedergibt.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: zu ihrem Herrn
  rationale: Die formal plurale Form אֲדֹנֵיהֶם kann sich idiomatisch auf den einen Gebieter der Männer beziehen; im Erzählzusammenhang ist damit am ehesten der König von Aram gemeint. »Herr« wahrt den Autoritätsbezug ohne die moderne wirtschaftliche Färbung von »Arbeitgeber«.
theological_decisions:
- issue: Funktion der Frage nach den mit Schwert und Bogen Gefangengenommenen
  choice: Als rhetorische Frage wiedergegeben, die das Verbot des Tötens bekräftigt
  alternative: Als schlichte Aussage oder als eng begrenzte Regel nur über eigenhändig im Kampf gemachte Gefangene
  rationale: Wortlaut und Zusammenhang legen eine rhetorische Frage nahe. Sie unterstreicht, dass der König diese Gefangenen nicht töten soll, zumal sie ihm nicht durch einen eigenen militärischen Sieg in die Hände gefallen sind, ohne daraus eine umfassende Lehre über alle Kriegsgefangenen abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und bestimmt. »Etwa« kennzeichnet die rhetorische Erwartung, ohne den hebräischen Satz in eine erklärende Aussage umzudeuten; »zurückkehren« ergibt sich natürlich aus der Rücksendung zu ihrem Herrn.
