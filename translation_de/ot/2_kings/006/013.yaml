base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: de
  text: 'Da sagte er: „Geht und seht nach, wo er ist, damit ich nach ihm schicken und ihn ergreifen kann.“[a] Da wurde ihm berichtet: „Sieh, er ist in Dotan.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und ich werde schicken und ihn ergreifen“. Die hebräische Satzfolge kann auch als Absicht oder Folge verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Dotan war eine Stadt nördlich von Samaria. Der Ort wird auch in der Josefgeschichte erwähnt (1. Mose 37,17).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das narrative Wayyiqtol wird mit einer natürlichen deutschen Erzählverknüpfung wiedergegeben, ohne eine stärkere zeitliche Aussage einzutragen.
- source_word: לְכוּ וּרְאוּ
  choice: Geht und seht nach
  rationale: Die beiden pluralischen Imperative bleiben erhalten; „nachsehen“ gibt im Zusammenhang die beauftragte Erkundung natürlich wieder, ohne sie ausdrücklich als Suche auszudeuten.
- source_word: אֵיכֹה הוּא
  choice: wo er ist
  rationale: Die Ortsfrage wird schlicht und idiomatisch wiedergegeben.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: damit ich Leute hinschicken und ihn festnehmen lassen kann
  rationale: Im feindlichen königlichen Zusammenhang meint לקח die Ergreifung des Mannes. Die deutsche Formulierung macht natürlich deutlich, dass der König Beauftragte entsendet und durch sie die Festnahme veranlasst; die formalere Koordination bleibt in der Fußnote sichtbar.
- source_word: וַיֻּגַּד לוֹ
  choice: Da wurde ihm berichtet
  rationale: Die passive Form von נגד und der Charakter einer Meldung an den König werden bewahrt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die direkte Rede im modernen Deutschen natürlicher ein als das formelhafte „mit den Worten“.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die aufmerksamkeitslenkende Funktion der Partikel wird bewahrt; „Siehe“ wäre im modernen Standarddeutsch unnötig altertümlich.
- source_word: בְדֹתָן
  choice: in Dotan
  rationale: Die Präposition ist lokativ; der Ortsname wird in der im Deutschen üblichen Form „Dotan“ wiedergegeben.
