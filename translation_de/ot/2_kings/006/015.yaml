  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: de
  text: 'Als der Diener des Mannes Gottes früh aufstand und hinausging, sah er ein Heer mit Pferden und Streitwagen, das die Stadt umzingelte. Der junge Diener[a] sagte zu ihm: »Ach, mein Herr! Was sollen wir nur tun?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Diener« oder »sein junger Mann«. Das hebräische Wort kann einen jungen Mann, einen Diener oder beides bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: früh aufstand
  rationale: Die Verbindung bezeichnet das frühe Aufstehen. Die knappe deutsche Form gibt die zeitliche Nuance natürlich wieder, ohne den hebräischen Infinitiv künstlich zu verdoppeln.
- source_word: מְשָׁרֵת
  choice: Diener
  rationale: Das Partizip bezeichnet hier jemanden, der dem Mann Gottes persönlich dient. »Diener« ist im Erzählzusammenhang klar und würdig.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Die wörtliche Wiedergabe bewahrt den im Alten Testament feststehenden prophetischen Titel und seine Bezüge zu anderen Stellen.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: Die Formulierung markiert die überraschende Wahrnehmung und erhält die Lebendigkeit des hebräischen Erzählstils in verständlichem Deutsch.
- source_word: חַיִל
  choice: ein Heer
  rationale: Im militärischen Zusammenhang bezeichnet das Wort eine bewaffnete Streitmacht; »Heer« passt zudem zu Pferden und Streitwagen.
- source_word: סוֹבֵב
  choice: umgab
  rationale: Das Partizip beschreibt die beim Hinausgehen vorgefundene Lage. »Umgab« gibt die räumliche Einschließung der Stadt idiomatisch wieder.
- source_word: וְסוּס וָרָכֶב
  choice: mit Pferden und Streitwagen
  rationale: Die hebräischen Kollektivbegriffe benennen die militärische Ausstattung des Heeres; im Deutschen sind die Pluralformen natürlich.
- source_word: נַעֲרוֹ
  choice: sein junger Diener
  rationale: נַעַר kann sowohl das junge Alter als auch eine dienende Stellung bezeichnen. »Junger Diener« bewahrt beide Bedeutungsanteile und bezeichnet dieselbe zuvor genannte Person.
- source_word: אֲהָהּ
  choice: Ach
  rationale: Die Interjektion drückt Bestürzung aus. »Ach« ist in modernem, würdigem Deutsch natürlicher als das altertümlichere »Wehe«.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Es handelt sich um die respektvolle Anrede des Dieners an seinen menschlichen Vorgesetzten, nicht um einen Gottesnamen.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: Was sollen wir nur tun?
  rationale: Die idiomatische deutsche Frage gibt die ratlose und bestürzte Bedeutung des wörtlichen »Wie sollen wir handeln?« wieder; »nur« trägt den Ton der Verzweiflung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der traditionelle Titel »Mann Gottes« bleibt erhalten; »siehe, da« bewahrt die plötzliche Wahrnehmung, ohne den Satz unnötig zu archaisieren.
