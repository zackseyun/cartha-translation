  to: 'Als der Diener des Mannes Gottes früh aufstand und hinausging, sah er ein Heer mit Pferden und Streitwagen, das die Stadt umzingelte. Der junge Diener[a] sagte zu ihm: »Ach, mein Herr! Was sollen wir nur tun?«'
  rationale: Die Revision ersetzt die unnatürliche Verdopplung »siehe, da« durch eine deutsche Wahrnehmungskonstruktion und klärt die Personenbezüge. »Umzingelte« gibt die räumliche und im Partizip ausgedrückte andauernde Einschließung angemessen wieder, ohne eine weitergehende zeitliche Aussage einzuführen.
