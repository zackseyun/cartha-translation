  source_fidelity: 'Der Entwurf gibt die wesentlichen hebräischen Elemente zutreffend wieder: das frühe Aufstehen, den Titel »Mann Gottes«, die militärische Einschließung der Stadt und den bestürzten Ausruf. Für סוֹבֵב ist »umzingelte« eine präzisere und idiomatischere Wiedergabe als das im Entwurf verwendete einfache »umgab«.'
  naturalness: »Siehe, da« wirkt im modernen Standarddeutsch doppelt markiert und weniger natürlich. Außerdem ist »Sein junger Diener« nach dem unmittelbar vorhergehenden »Heer« unnötig mehrdeutig. Die Revision stellt die Wahrnehmung klarer dar und bezeichnet den bereits eingeführten Diener eindeutig.
  terminology: »Diener«, »Mann Gottes«, »Heer«, »Streitwagen«, »Ach« und »mein Herr« sind sachgerecht. »Junger Diener« ist als Auslegung von נַעַר möglich; die Fußnote bewahrt die lexikalische Spannweite.
