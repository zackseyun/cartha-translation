id: 2KI.6.21
reference: 2 Kings 6:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל אֱלִישָׁ֔ע כִּ/רְאֹת֖/וֹ אוֹתָ֑/ם הַ/אַכֶּ֥ה אַכֶּ֖ה אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: de
  text: 'Als der König von Israel sie sah, sagte er zu Elisa: »Soll ich sie erschlagen? Soll ich sie erschlagen[a], mein Vater[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verstärkt die Frage durch die Wiederholung des Verbs.
    reason: lexical_alternative
  - marker: b
    text: »Mein Vater« ist hier eine respektvolle Anrede für Elisa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte er
  rationale: Die Erzählform führt die Handlung weiter. Im Deutschen ergibt die Verbindung mit dem vorangestellten Temporalsatz eine natürliche und zugleich quellennah bleibende Satzfolge.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen sachgerecht mit einer Genitivumschreibung durch »von« wiedergegeben.
- source_word: אֶל אֱלִישָׁע
  choice: zu Elisa
  rationale: אֶל kennzeichnet hier den Adressaten der Rede. Eine Bezeichnung wie »der Prophet« wird nicht ergänzt, da sie in diesem Vers nicht steht.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: Als … sie sah
  rationale: Die Infinitivkonstruktion mit כְּ ist temporal. Das Suffix bezeichnet den König als Subjekt des Sehens; »als … sie sah« ist im Deutschen klar und idiomatisch.
- source_word: הַאַכֶּה אַכֶּה
  choice: Soll ich sie erschlagen? Soll ich sie erschlagen?
  rationale: Die Verbindung aus Fragepartikel, Infinitivus absolutus und finitem Verb verleiht der Frage Nachdruck. Die Wiederholung der ganzen Frage bildet diese Intensivierung im Deutschen hörbar ab; »erschlagen« gibt den tödlichen militärischen Sinn des Kontexts wieder.
- source_word: אָבִי
  choice: mein Vater
  rationale: Die wörtliche Anrede wird bewahrt. Sie bezeichnet hier keinen leiblichen Vater, sondern drückt Achtung gegenüber Elisa aus.
theological_decisions:
- issue: Ehrenvolle Anrede Elisas
  choice: »mein Vater«
  alternative: »mein Herr« oder »verehrter Lehrer«
  rationale: Das Hebräische verwendet ausdrücklich die familiäre Bezeichnung אָבִי. Die wörtliche Wiedergabe bewahrt die Beziehungssprache und vermeidet eine konfessionell oder hierarchisch stärker festgelegte Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Frage klingt bewusst eindringlich; die ungewöhnliche Anrede »mein Vater« bleibt im Haupttext stehen und wird knapp erläutert.
