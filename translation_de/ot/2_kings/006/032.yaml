  text: וֶ/אֱלִישָׁע֙ יֹשֵׁ֣ב בְּ/בֵית֔/וֹ וְ/הַ/זְּקֵנִ֖ים יֹשְׁבִ֣ים אִתּ֑/וֹ וַ/יִּשְׁלַ֨ח אִ֜ישׁ מִ/לְּ/פָנָ֗י/ו בְּ/טֶ֣רֶם יָבֹא֩ הַ/מַּלְאָ֨ךְ אֵלָ֜י/ו וְ/ה֣וּא אָמַ֣ר אֶל הַ/זְּקֵנִ֗ים הַ/רְּאִיתֶם֙ כִּֽי שָׁלַ֞ח בֶּן הַֽ/מְרַצֵּ֤חַ הַ/זֶּה֙ לְ/הָסִ֣יר אֶת רֹאשִׁ֔/י רְא֣וּ כְּ/בֹ֣א הַ/מַּלְאָ֗ךְ סִגְר֤וּ הַ/דֶּ֨לֶת֙ וּ/לְחַצְתֶּ֤ם אֹת/וֹ֙ בַּ/דֶּ֔לֶת הֲ/ל֗וֹא ק֛וֹל רַגְלֵ֥י אֲדֹנָ֖י/ו אַחֲרָֽי/ו׀־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: de
  text: 'Elischa saß in seinem Haus, und die Ältesten saßen bei ihm. Der König hatte einen Mann vorausgeschickt. Doch bevor der Bote zu Elischa kam, sagte dieser zu den Ältesten: »Seht ihr, dass dieser Mördersohn jemanden geschickt hat, um mir den Kopf abzuschlagen[a]? Gebt acht! Wenn der Bote kommt, schließt die Tür und drängt ihn an der Tür zurück. Ist nicht das Geräusch der Schritte seines Herrn[b] hinter ihm zu hören?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »um meinen Kopf wegzunehmen«; gemeint ist die Hinrichtung durch Enthauptung.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Herrn« des Boten ist der König gemeint, der offenbar unmittelbar hinter seinem Abgesandten herkam.
    reason: referent_clarification
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: saß / saßen
  rationale: Die Partizipien schildern eine andauernde Szene. Im natürlichen deutschen Erzählstil gibt das Präteritum diesen Hintergrund angemessen wieder.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: Der König hatte einen Mann vorausgeschickt
  rationale: Der König ist aus dem Kontext als unausgesprochenes Subjekt erkennbar. Das Plusquamperfekt macht deutlich, dass das Aussenden vor Elischas Warnung geschah; »vorausgeschickt« gibt מִלְּפָנָיו idiomatisch wieder.
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: Im königlichen Erzählzusammenhang bezeichnet das Wort einen menschlichen Abgesandten, nicht einen Engel.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: dieser Mördersohn
  rationale: Die kompakte deutsche Bezeichnung bewahrt die beleidigende Schärfe und die Abstammungsformulierung des Hebräischen, ohne die historische Anspielung ausdrücklich festzulegen.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: um mir den Kopf abzuschlagen
  rationale: Wörtlich steht »meinen Kopf wegzunehmen«; gemeint ist hier eindeutig die Hinrichtung durch Enthauptung. Die deutsche Wiedergabe macht das Idiom verständlich.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: drängt ihn an der Tür zurück
  rationale: לחץ bezeichnet hier das Drücken beziehungsweise Zurückhalten des Boten im Türbereich, damit er nicht eintreten kann.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: Ist nicht schon der Schritt seines Herrn hinter ihm zu hören?
  rationale: Die rhetorische Frage bewahrt das Bild vom Geräusch der Füße und bringt in natürlichem Deutsch zum Ausdruck, dass der Herr des Boten unmittelbar folgt.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וַיִּשְׁלַח
  choice: Der König
  alternative: er
  rationale: Der vorausgehende Kontext weist auf den König von Israel. Die ausdrückliche Benennung verhindert im Deutschen eine falsche Zuordnung zu Elischa.
- issue: Bezug von »sein Herr«
  choice: der Herr des Boten, also der König
  alternative: eine unbestimmte Autoritätsperson
  rationale: Die Possessivform bezieht sich grammatisch und erzählerisch auf den Boten. Der Vers selbst nennt den König an dieser Stelle jedoch nicht nochmals, daher bleibt im Haupttext »sein Herr« stehen.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Kurze Aufforderungen erhalten die Dringlichkeit der Szene. »Mördersohn« bewahrt die schroffe Beschimpfung; »Bote« vermeidet im Kontext die irreführende Bedeutung »Engel«.
