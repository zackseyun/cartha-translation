base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/004.yaml
  text: So he went with them[a], and they came to the Jordan and cut down the trees.
translation:
  language: de
  text: Da ging er mit ihnen, und sie kamen an den Jordan und fällten die Bäume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie schlugen Holz“. Das hebräische Wort kann sowohl Bäume als auch Holz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging er
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter. „Da ging er“ gibt die Folgerung aus der vorangehenden Aufforderung in natürlichem deutschem Erzählstil wieder.
- source_word: אִתָּם
  choice: mit ihnen
  rationale: Die Präposition mit dem Suffix der 3. Person Plural bezeichnet schlicht die Begleitung.
- source_word: וַיָּבֹאוּ
  choice: Sie kamen
  rationale: בוא bezeichnet hier das Gelangen an den genannten Ort; „kamen“ bewahrt die Bewegungsrichtung ohne unnötige Ausdeutung.
- source_word: הַיַּרְדֵּנָה
  choice: an den Jordan
  rationale: Das Richtungs-He bezeichnet eine Bewegung zum Jordan hin. Im Deutschen ist „an den Jordan“ idiomatisch und entspricht dem gemeinten Erreichen des Flusses.
- source_word: וַיִּגְזְרוּ
  choice: fällten
  rationale: גזר bedeutet grundsätzlich „schneiden/abtrennen“; bei Bäumen bezeichnet „fällen“ die Handlung im Kontext präzise und knapp.
- source_word: הָעֵצִים
  choice: die Bäume
  rationale: עֵץ kann sowohl einen Baum als auch Holz bezeichnen. Da hier Bauholz beschafft wird und die Handlung als Fällen verstanden werden kann, ist „die Bäume“ im Haupttext die anschaulichere Kontextbedeutung; die lexikalische Alternative bleibt in der Fußnote erhalten.
