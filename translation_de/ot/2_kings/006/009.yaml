  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: de
  text: 'Da ließ der Mann Gottes dem König von Israel sagen: »Hüte dich davor, an diesem Ort vorbeizuziehen; denn dort ziehen die Aramäer hinab[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kommen die Aramäer herunter«.'
    reason: Das hebräische Partizip bezeichnet eine abwärts gerichtete Bewegung, legt aber die deutsche Perspektive »hinabziehen« oder »herunterkommen« nicht eindeutig fest.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ließ … sagen
  rationale: Das hebräische Verb bedeutet wörtlich „sandte“. Da kein ausdrückliches Objekt genannt wird und der Kontext die Übermittlung einer Botschaft meint, gibt „ließ … sagen“ den Sinn im Deutschen natürlich wieder.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Der feste hebräische Titel wird bewahrt und nicht deutend durch „der Prophet“ oder den Namen Elisa ersetzt.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Direkte und idiomatische Wiedergabe des Königstitels und des Landesnamens.
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: Hüte dich, … vorbeizuziehen
  rationale: Der Imperativ mit מִן spricht eine Warnung aus und rät vom Durch- oder Vorbeiziehen an diesem Ort ab. Die Formulierung wahrt den Warncharakter, ohne ihn zu einem ausdrücklichen Verbot zu verschärfen.
- source_word: הַמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Natürliche deutsche Wiedergabe der demonstrativen Ortsangabe.
- source_word: כִּי שָׁם
  choice: denn dort
  rationale: כִּי begründet die Warnung, während שָׁם den Ort der aramäischen Bewegung bezeichnet.
- source_word: אֲרָם
  choice: die Aramäer
  rationale: Im militärischen Zusammenhang bezeichnet der Länder- beziehungsweise Volksname die aramäischen Truppen. „Aramäer“ ist historisch und sprachlich genauer als „Syrer“.
- source_word: נְחִתִּים
  choice: ziehen … hinab
  rationale: Das Partizip bezeichnet ein Hinabziehen oder Herabkommen. Die Hauptfassung bleibt räumlich neutral und bewahrt den fortdauernden beziehungsweise bevorstehenden Charakter der Bewegung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit „Da ließ … sagen“ entspricht erzählendem Bibelstil, ohne altertümlich zu wirken. Die direkte Warnung bleibt knapp und militärisch verständlich.
