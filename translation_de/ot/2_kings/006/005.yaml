  - severity: low
    issue: „doch“ in „Es war doch geliehen!“
    rationale: Die Partikel verstärkt die Klage zwar plausibel, ist aber im hebräischen Text nicht eigens signalisiert. Ohne „doch“ bleibt die Aussage näher an der knappen Vorlage.
