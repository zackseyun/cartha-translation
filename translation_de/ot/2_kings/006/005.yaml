  source_fidelity: 'Der hebräische Text wird im Wesentlichen treffend wiedergegeben: מַפִּיל bezeichnet hier das Fällen, הַבַּרְזֶל bleibt angemessen als Metonymie „das Eisen“ erhalten, und שָׁאוּל bedeutet „geliehen“. „Baumstamm fällen“ ist jedoch sachsprachlich ungenau, weil ein Baumstamm gewöhnlich bereits vom Baum getrennt ist. „Einen Stamm fällen“ ist idiomatisch und wahrt den Spielraum von קוֹרָה („Stamm/Bauholz/Balken“) besser. Das additive וְ vor „es war geliehen“ rechtfertigt kein betontes „doch“.'
