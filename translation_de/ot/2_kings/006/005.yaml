base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: de
  text: 'Als nun einer einen Stamm fällte, fiel das Eisen[a] ins Wasser. Da schrie er auf: »Ach, mein Herr! Es war geliehen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Eisen«; gemeint ist der eiserne Kopf des Werkzeugs, also der Axtkopf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל
  choice: fällte
  rationale: Das Hifil-Partizip von נפל bezeichnet hier im Zusammenhang des Holzhauens das Zu-Fall-Bringen; »fällte« gibt dies im Deutschen idiomatisch wieder.
- source_word: הַקּוֹרָה
  choice: einen Baumstamm
  rationale: קוֹרָה kann einen Balken, Stamm oder ein Stück Bauholz bezeichnen. Beim Fällen ist »Baumstamm« im Deutschen natürlicher als »Balken« und passt zum Holzbeschaffen für den Bau.
- source_word: הַבַּרְזֶל
  choice: das Eisen
  rationale: Der hebräische Text sagt wörtlich »das Eisen« und bezeichnet damit metonymisch den eisernen Kopf des Werkzeugs. Die knappe Ausdrucksweise bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: וַיִּצְעַק
  choice: Da schrie er auf
  rationale: Die Form beschreibt einen unmittelbaren, von Bestürzung ausgelösten Aufschrei.
- source_word: אֲהָהּ אֲדֹנִי
  choice: Ach, mein Herr!
  rationale: »Ach« wahrt den Ausdruck des Entsetzens; »mein Herr« gibt die respektvolle Anrede Elisas wieder, ohne sie unnötig zu erhöhen.
- source_word: וְהוּא שָׁאוּל
  choice: Es war doch geliehen!
  rationale: שָׁאוּל bezeichnet hier etwas Geliehenes. »doch« macht im Deutschen die durch וְ hervorgehobene Bestürzung darüber verständlich, dass das verlorene Werkzeug nicht dem Sprecher gehörte.
