  terminology: „Das Eisen“ bewahrt die hebräische Ausdrucksweise; die Fußnote erläutert zutreffend die kontextuell gemeinte Werkzeugkomponente. „Mein Herr“ gibt die respektvolle Anrede אֲדֹנִי angemessen wieder, ohne eine weitergehende theologische oder soziale Deutung festzulegen.
