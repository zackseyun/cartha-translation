  text: וַ/יִּשְׁלַ֞ח מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֶֽל הַ/מָּק֞וֹם אֲשֶׁ֨ר אָֽמַר ל֧/וֹ אִישׁ הָ/אֱלֹהִ֛ים ו/הזהיר/ה וְ/נִשְׁמַ֣ר שָׁ֑ם לֹ֥א אַחַ֖ת וְ/לֹ֥א שְׁתָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: de
  text: Da sandte der König von Israel Leute an den Ort, von dem der Mann Gottes zu ihm gesprochen und vor dem er ihn gewarnt hatte. Dort nahm er sich in Acht – nicht nur ein- oder zweimal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht eins und nicht zwei“; eine Redewendung dafür, dass es wiederholt geschah.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte ... Leute
  rationale: Das Verb bedeutet wörtlich „sandte“; ein ausdrückliches Objekt fehlt. Im militärischen Zusammenhang ist am ehesten gemeint, dass der König Leute zu dem gefährdeten Ort schickte. Die Ergänzung macht den deutschen Satz verständlich, ohne eine bestimmte Personengruppe festzulegen.
- source_word: הַמָּקוֹם
  choice: den Ort
  rationale: Direkte, natürliche Wiedergabe des bestimmten Substantivs מָקוֹם.
- source_word: אֲשֶׁר אָמַר לוֹ
  choice: von dem ... zu ihm gesprochen ... hatte
  rationale: Die Relativkonstruktion bezieht die vorherige Mitteilung des Gottesmannes auf den Ort und wahrt den Vorzeitigkeitsbezug.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die traditionelle und quellennah wiedergegebene Bezeichnung bleibt erhalten, statt sie enger als „Prophet“ auszulegen.
- source_word: וְהִזְהִירֹה
  choice: und vor dem er ihn gewarnt hatte
  rationale: Der Hifil-Stamm von זהר bezeichnet hier das Warnen. Im Deutschen wird der gefährliche Ort natürlich mit „vor“ angeschlossen; „ihn“ bezieht sich auf den König.
- source_word: וְנִשְׁמַר שָׁם
  choice: So war er dort auf der Hut
  rationale: 'Der Nifal von שמר hat hier reflexiven Sinn: Der König nahm sich dort in Acht beziehungsweise traf Vorsichtsmaßnahmen. Die Formulierung bewahrt diese Bedeutungsbreite.'
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: nicht nur ein- oder zweimal
  rationale: Die hebräische Wendung bezeichnet eine wiederholte Handlung. Die deutsche idiomatische Wiedergabe erhält zugleich die bildhafte Zählform.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Das fehlende Objekt von „sandte“ wird für verständliches Deutsch zurückhaltend mit „Leute“ ergänzt; die Unbestimmtheit der entsandten Personen bleibt bestehen. Der Gedankenstrich hebt die abschließende Wiederholungsformel hervor.
