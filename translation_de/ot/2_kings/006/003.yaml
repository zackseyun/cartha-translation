  source_fidelity: 'Die Übersetzung gibt die Sinnrichtung des Hebräischen zutreffend wieder: Ein Angehöriger der Gruppe bittet Elisa höflich, sie zu begleiten, und Elisa sagt zu. „Einer von ihnen“ verdeutlicht die im Kontext erschließbare Zugehörigkeit; „komm ... mit“ ist eine idiomatische deutsche Wiedergabe der Bitte, mit den als „deine Diener“ bezeichneten Männern zu gehen. Die Antwort „Ich komme mit“ entspricht der Zusage אֲנִי אֵלֵךְ im gegebenen Bewegungs- und Begleitkontext angemessen.'
