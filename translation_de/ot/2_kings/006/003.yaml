source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הָֽ/אֶחָ֔ד ה֥וֹאֶל נָ֖א וְ/לֵ֣ךְ אֶת עֲבָדֶ֑י/ךָ וַ/יֹּ֖אמֶר אֲנִ֥י אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/003.yaml
  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: de
  text: 'Da sagte einer von ihnen: „Bitte komm doch mit deinen Dienern.“ Er antwortete: „Ich komme mit.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֶחָד
  choice: einer von ihnen
  rationale: Die Wendung bedeutet wörtlich „der eine“, bezeichnet hier aber idiomatisch ein Mitglied der zuvor genannten Gruppe. „Einer von ihnen“ ist im Deutschen eindeutig und natürlich.
- source_word: הוֹאֶל נָא
  choice: bitte … doch
  rationale: הוֹאֶל drückt die Bereitschaft beziehungsweise Zustimmung zu einer höflichen Bitte aus, während נָא diese Bitte höflich markiert. Im Deutschen gibt „bitte … doch“ den höflich-werbenden Ton natürlich wieder, ohne eine schwerfällige Formulierung wie „Sei bitte bereit“ zu erzwingen.
- source_word: וְלֵךְ
  choice: komm … mit
  rationale: Im Zusammenhang bittet der Sprecher Elisa, die Gruppe zu begleiten. Das idiomatische deutsche „mitkommen“ gibt den Bewegungs- und Begleitsinn natürlicher wieder als das formal nähere „gehen“.
- source_word: אֶת עֲבָדֶיךָ
  choice: mit deinen Dienern
  rationale: אֶת bezeichnet hier bei einem Bewegungsverb die Begleitung. עֲבָדֶיךָ ist die ehrerbietige Selbstbezeichnung der Prophetenschüler gegenüber Elisa; „Diener“ bewahrt diese Beziehungssprache, ohne einen rechtlichen Sklavenstatus zu behaupten.
- source_word: אֲנִי אֵלֵךְ
  choice: Ich komme mit
  rationale: Das ausdrückliche אֲנִי verleiht der Zusage etwas Nachdruck. Im Deutschen ist „Ich komme mit“ eine natürliche, klare Zusage und nimmt den im Kontext gemeinten Begleitsinn auf.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der höfliche Ton der Bitte bleibt durch „bitte … doch“ erhalten; „mitkommen“ macht die gemeinte Begleitung im Deutschen unmittelbar verständlich.
