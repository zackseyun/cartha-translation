source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַל יוֹשִׁעֵ֣/ךְ יְהוָ֔ה מֵ/אַ֖יִן אֽוֹשִׁיעֵ֑/ךְ הֲ/מִן הַ/גֹּ֖רֶן א֥וֹ מִן הַ/יָּֽקֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: de
  text: 'Da sagte er: »Wenn Jahwe dir nicht hilft, woher sollte ich dir helfen? Etwa von der Tenne oder von der Kelter?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn Jahwe dich nicht rettet, woher sollte ich dich retten?« Das in beiden Satzteilen verwendete hebräische Verb kann »helfen«, »retten« oder »befreien« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Waw-Konsekutiv führt die Erzählung fort; „Da“ gibt den natürlichen deutschen Erzählfluss wieder.
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: Wenn Jahwe dir nicht hilft
  rationale: אַל wird hier im Zusammenhang am besten als verneinte Bedingung beziehungsweise rhetorische Voraussetzung verstanden. ישׁע bezeichnet hier praktische Hilfe oder Rettung in der Hungersnot; „hilft“ klingt im Deutschen natürlich und bewahrt die Parallele zum folgenden Satz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֵאַיִן אֹשִׁיעֵךְ
  choice: woher sollte ich dir helfen?
  rationale: מֵאַיִן fragt nach der Quelle der Hilfe. Der Konjunktiv „sollte“ vermittelt die rhetorische Unmöglichkeit idiomatisch.
- source_word: הֲמִן הַגֹּרֶן
  choice: Etwa von der Tenne
  rationale: Die Fragepartikel הֲ wird mit „etwa“ ausgedrückt. Die Tenne ist der konkrete Ort, von dem Getreide zu erwarten wäre.
- source_word: מִן הַיָּקֶב
  choice: oder von der Kelter
  rationale: יֶקֶב bezeichnet eine Wein- beziehungsweise Traubenkelter; „Kelter“ ist die knappe, traditionelle und weiterhin verständliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ישׁע in beiden Satzteilen
  choice: helfen
  alternative: retten
  rationale: Beide Bedeutungen sind sprachlich möglich. Wegen der akuten materiellen Not ist „helfen“ im Haupttext natürlich; die mögliche Bedeutung „retten“ wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Verzweiflung des Königs bleibt erhalten; „Tenne“ und „Kelter“ bewahren die konkreten agrarischen Bilder des Ausgangstextes.
