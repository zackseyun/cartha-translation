  text: וַ/יֹּ֥אמֶר אִישׁ הָ/אֱלֹהִ֖ים אָ֣נָה נָפָ֑ל וַ/יַּרְאֵ֨/הוּ֙ אֶת הַ/מָּק֔וֹם וַ/יִּקְצָב עֵץ֙ וַ/יַּשְׁלֶךְ שָׁ֔מָּ/ה וַ/יָּ֖צֶף הַ/בַּרְזֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: de
  text: 'Da sagte der Mann Gottes: „Wohin ist es gefallen?“ Der Mann, dem der Axtkopf gehörte, zeigte ihm die Stelle. Dann schnitt der Mann Gottes ein Stück Holz ab, warf es dorthin, und das Eisen[a] schwamm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „das Eisen“. Gemeint ist der eiserne Axtkopf aus dem vorherigen Vers.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die direkte und im Deutschen geläufige Wiedergabe des hebräischen Prophetentitels bewahrt das ursprüngliche Bild, ohne es erklärend zu „Prophet Gottes“ zu erweitern.
- source_word: אָנָה נָפָל
  choice: Wohin ist es gefallen?
  rationale: אָנָה fragt nach der Richtung beziehungsweise dem Zielort. Das deutsche „Wohin“ gibt diese Nuance präzise und idiomatisch wieder; das Perfekt bezeichnet das soeben geschehene Fallen.
- source_word: וַיַּרְאֵהוּ אֶת הַמָּקוֹם
  choice: Der Mann zeigte ihm die Stelle.
  rationale: Der Hifil von ראה bedeutet „sehen lassen/zeigen“. Das ausdrücklich wiederholte Subjekt verhindert im Deutschen eine mögliche Verwechslung der handelnden Personen; „Stelle“ bezeichnet hier natürlich den konkreten Ort.
- source_word: וַיִּקְצָב עֵץ
  choice: Da schnitt er ein Stück Holz ab
  rationale: קצב bezeichnet hier das Ab- oder Zuschneiden; עֵץ kann Baum, Holz oder ein hölzernes Stück meinen. „Ein Stück Holz“ bleibt näher an der lexikalischen Breite als „Stock“.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: warf es dorthin
  rationale: Die Formulierung gibt sowohl das Werfen als auch die gerichtete Ortsangabe שָׁמָּה knapp und natürlich wieder.
- source_word: וַיָּצֶף הַבַּרְזֶל
  choice: das Eisen schwamm
  rationale: Der hebräische Text stellt „das Eisen“ als Subjekt des intransitiven Verbs „schwimmen/treiben“ dar. Die knappe Wiedergabe bewahrt die wunderhafte Aussage, ohne sie auszuschmücken oder zu naturalisieren.
theological_decisions:
- issue: Wunderhaftes Geschehen
  choice: das Eisen schwamm
  alternative: das Eisen kam an die Oberfläche
  rationale: Die Erzählung schildert das Geschehen unmittelbar als Wunder. Die Übersetzung gibt dies ebenso unmittelbar wieder und vermeidet eine erklärende Umformulierung.
- issue: Identität des „Eisens“
  choice: Im Haupttext steht wörtlich „das Eisen“; die kontextuelle Bedeutung wird in einer Fußnote erklärt.
  alternative: den Axtkopf bereits im Haupttext ausdrücklich nennen
  rationale: So bleibt die knappe Ausdrucksweise des hebräischen Verses erhalten, während der Bezug auf den eisernen Axtkopf aus Vers 5 für heutige Leser deutlich gemacht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Da“ nimmt die fortschreitende hebräische Erzählstruktur auf, ohne jede Verbform schematisch mit „und“ wiederzugeben.
