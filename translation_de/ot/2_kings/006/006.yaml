    rationale: Im Kontext zeigt der Besitzer des verlorenen Werkzeugs dem Mann Gottes die Stelle; danach schneidet der Mann Gottes Holz ab. Die deutsche Wiederholung „Der Mann“ verweist gewöhnlich auf „der Mann Gottes“, sodass der Satz diese Abfolge umkehrt. Die Revision macht die beiden Handelnden ausdrücklich unterscheidbar.
