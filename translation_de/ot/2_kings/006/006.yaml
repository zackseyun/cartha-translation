  to: 'Da sagte der Mann Gottes: „Wohin ist es gefallen?“ Der Mann, dem der Axtkopf gehörte, zeigte ihm die Stelle. Dann schnitt der Mann Gottes ein Stück Holz ab, warf es dorthin, und das Eisen[a] schwamm.'
