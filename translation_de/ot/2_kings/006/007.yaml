  verdict: revise
  source_fidelity: Die Imperativform הָרֶם verlangt „heb auf/hoch“; לָךְ kennzeichnet den persönlichen Bezug zum Angesprochenen. „Hol es dir herauf“ fügt eine stärker gerichtete Bewegung („her“) ein und ist im modernen Standarddeutsch weniger idiomatisch. „Heb es selbst auf“ gibt den Handlungsbezug natürlich wieder, ohne den Gegenstand oder die Situation weiter auszudeuten. Der zweite Satz entspricht וַיִּשְׁלַח יָדוֹ וַיִּקָּחֵהוּ präzise.
  naturalness: „Hol es dir herauf“ wirkt in dieser Aufforderung ungewöhnlich und kann eine Bewegung zum Sprecher hin nahelegen. „Heb es selbst auf“ ist klare, natürliche Erzählsprache. „Da streckte er seine Hand aus und nahm es“ ist ebenfalls idiomatisch und angemessen schlicht.
  terminology: Keine theologisch oder namensbezogen problematische Terminologie. Die Fußnote wird auf eine sprachlich korrekte, eng am Hebräischen bleibende wörtliche Wiedergabe angepasst.
  issues:
  - severity: medium
    issue: „Hol es dir herauf“ ist eine unnötig spezifizierende und im Deutschen etwas unnatürliche Wiedergabe von הָרֶם לָךְ.
    rationale: Das hebräische Verb bedeutet hier „heben/aufheben“ und enthält kein ausdrückliches Richtungsadverb „her“. Die Dativnuance lässt sich natürlich durch „selbst“ wiedergeben.
  - severity: low
    issue: Die Fußnote „Heb es für dich hoch“ ist im Deutschen stilistisch ungeschickt.
    rationale: Als wörtliche Erläuterung ist „Erhebe es dir“ näher an der hebräischen Form und vermeidet die missverständliche Verbindung „für dich aufheben“.
