lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Gibt die fortlaufende hebräische Erzählform schlicht und ohne zusätzliche Deutung wieder.
- source_word: הָרֶם
  choice: Hol es … herauf
  rationale: Das Verb bezeichnet das Hochheben. Im Zusammenhang mit dem im Wasser befindlichen Eisenteil ist »heraufholen« im modernen Deutschen natürlich und präzise.
- source_word: לָךְ
  choice: dir
  rationale: Der Dativ mit Suffix bezeichnet die persönliche Beteiligung beziehungsweise den Bezug zum Handelnden; »dir« bewahrt diese Nuance idiomatisch.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: Da streckte er seine Hand aus
  rationale: Entspricht der hebräischen Wendung für das Ausstrecken der Hand, um etwas zu ergreifen.
- source_word: וַיִּקָּחֵהוּ
  choice: und nahm es
  rationale: Gibt die Grundbedeutung von לקח wieder und vermeidet eine unnötige Wiederholung von »heraufholen«.
