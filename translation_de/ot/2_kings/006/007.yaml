translation_notes:
  register: Moderne, schlichte und würdige Erzählsprache. »Heraufholen« vermeidet die im Deutschen mögliche Fehlbedeutung von »für dich aufheben« im Sinn von »aufbewahren« und wahrt zugleich die Bewegung nach oben.
