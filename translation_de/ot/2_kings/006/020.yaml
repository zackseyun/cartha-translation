  text: וַ/יְהִי֮ כְּ/בֹאָ֣/ם שֹׁמְרוֹן֒ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע יְהוָ֕ה פְּקַ֥ח אֶת עֵינֵֽי אֵ֖לֶּה וְ/יִרְא֑וּ וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵ֣ינֵי/הֶ֔ם וַ/יִּרְא֕וּ וְ/הִנֵּ֖ה בְּ/ת֥וֹךְ שֹׁמְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: de
  text: 'Als sie nach Samaria kamen, sagte Elisa: »Jahwe, öffne diesen Männern[a] die Augen, damit sie sehen!« Da öffnete Jahwe ihnen die Augen, und sie sahen: Siehe, sie waren mitten in Samaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »diesen«; »Männern« ist zur Verdeutlichung ergänzt und bezieht sich auf die aramäischen Soldaten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: Als sie … gekommen waren
  rationale: Die hebräische Erzählungsform mit temporalem Infinitiv leitet das nächste Ereignis ein. Die deutsche Wiedergabe wahrt das zeitliche Verhältnis natürlich, ohne das formelhafte וַיְהִי eigens mit »und es geschah« wiederzugeben.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Der Ortsname bezeichnet hier die Stadt Samaria; die übliche deutsche Namensform ist »Samaria«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: פְּקַח אֶת עֵינֵי
  choice: öffne … die Augen
  rationale: Die wörtliche hebräische Wendung passt auch im Deutschen und bewahrt den Bezug zur von Gott bewirkten Aufhebung ihrer eingeschränkten Wahrnehmung.
- source_word: אֵלֶּה
  choice: diesen Männern
  rationale: Wörtlich steht nur das Demonstrativpronomen »diesen«. »Männern« wird zur natürlichen und eindeutigen deutschen Formulierung ergänzt und bezieht sich auf die aramäischen Soldaten.
- source_word: וְיִרְאוּ
  choice: damit sie sehen
  rationale: Der Verbanschluss an den Imperativ drückt hier den Zweck beziehungsweise das beabsichtigte Ergebnis der Bitte aus.
- source_word: וַיִּפְקַח יְהוָה אֶת עֵינֵיהֶם
  choice: Da öffnete Jahwe ihnen die Augen
  rationale: »Da« kennzeichnet im Deutschen natürlich die erzählerische Folge und die unmittelbare Erfüllung von Elisas Bitte.
- source_word: וַיִּרְאוּ
  choice: und sie sahen
  rationale: Die konkrete Wahrnehmung bleibt ausdrücklich erhalten und wird nicht deutend mit »sie erkannten« paraphrasiert.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: Das Aufmerksamkeitssignal hebt die überraschende Wahrnehmung hervor. Das leicht gehobene »siehe« bewahrt diese Funktion und passt zum würdigen biblischen Erzählton.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: mitten in Samaria
  rationale: Die Formulierung gibt die räumliche Bedeutung von בְּתוֹךְ knapp wieder und unterstreicht die dramatische Lage innerhalb der Stadt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt eng am Hebräischen; »siehe« erhält bewusst den markierenden und überraschenden Charakter von וְהִנֵּה.
