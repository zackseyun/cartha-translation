  source_fidelity: Der Text gibt die zeitliche Einleitung, das Zerreißen der Kleider, den begleitenden Gang auf der Mauer, das Wahrnehmen durch das Volk sowie das unter der äußeren Kleidung getragene Sacktuch zuverlässig wieder. „Auf der bloßen Haut“ ist eine idiomatische und kontextgerechte Wiedergabe von עַל־בְּשָׂרוֹ; die Fußnote dokumentiert die wörtliche Wendung מִבָּיִת und die daraus folgende räumliche Einordnung.
