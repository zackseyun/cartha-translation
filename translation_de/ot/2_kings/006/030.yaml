  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דִּבְרֵ֤י הָֽ/אִשָּׁה֙ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֔י/ו וְ/ה֖וּא עֹבֵ֣ר עַל הַ/חֹמָ֑ה וַ/יַּ֣רְא הָ/עָ֔ם וְ/הִנֵּ֥ה הַ/שַּׂ֛ק עַל בְּשָׂר֖/וֹ מִ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: de
  text: 'Als der König die Worte der Frau hörte, zerriss er seine Kleider, während er oben auf der Mauer entlangging. Da sah das Volk: Unter seinen Kleidern trug er Sacktuch auf der bloßen Haut.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „von innen“; gemeint ist offenbar, dass er das Sacktuch unter seinen äußeren Kleidern trug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: Als ... hörte
  rationale: Die Verbindung von כ mit dem Infinitivus constructus leitet einen temporalen Nebensatz ein; „Als ... hörte“ gibt die zeitliche Abfolge natürlich wieder.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: die Worte der Frau
  rationale: דְּבָרִים kann Worte, Sache oder Bericht bezeichnen; hier sind die unmittelbar zuvor wiedergegebenen Worte der Frau gemeint.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: zerriss er seine Kleider
  rationale: Die Wendung bezeichnet die sichtbare Handlung, die in diesem Zusammenhang Entsetzen und Trauer ausdrückt; „Kleider“ ist gegenwärtiges, würdevolles Standarddeutsch.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: während er oben auf der Mauer entlangging
  rationale: Die Partizipialkonstruktion schildert den Begleitumstand. „Oben auf ... entlangging“ verdeutlicht ohne wesentlichen Zusatz, dass sich der König auf der Stadtmauer bewegte.
- source_word: וַיַּרְא הָעָם וְהִנֵּה
  choice: 'Da sah das Volk:'
  rationale: ראה bedeutet hier „sehen/bemerken“, und הִנֵּה lenkt die Aufmerksamkeit auf den überraschenden Anblick. Der Doppelpunkt bildet diese deiktische Funktion in natürlichem Deutsch ab.
- source_word: הַשַּׂק
  choice: Sacktuch
  rationale: Das Wort bezeichnet groben Stoff beziehungsweise ein daraus gefertigtes Trauergewand; „Sacktuch“ ist die etablierte deutsche Wiedergabe.
- source_word: עַל־בְּשָׂרוֹ
  choice: auf der bloßen Haut
  rationale: בָּשָׂר bedeutet wörtlich „Fleisch“, bezeichnet hier aber den Körper beziehungsweise die Haut, auf der das Sacktuch getragen wurde. „Bloße Haut“ macht den Gegensatz zu den äußeren Kleidern verständlich.
- source_word: מִבָּיִת
  choice: unter seinen Kleidern
  rationale: Wörtlich bedeutet der Ausdruck „von innen/innerhalb“. Im Zusammenhang erklärt er, dass das Sacktuch unter der äußeren Kleidung verborgen getragen wurde.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das Aufmerksamkeitssignal וְהִנֵּה wird nicht archaisierend mit „siehe“ wiedergegeben, sondern durch Satzbau und Doppelpunkt ausgedrückt. Der Fußnotenmarker steht unmittelbar nach der interpretierend verdeutlichten Wendung.
