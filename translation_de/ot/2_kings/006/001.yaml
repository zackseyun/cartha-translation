  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: de
  text: 'Die Angehörigen der Prophetengemeinschaft[a] sagten zu Elisa: „Sieh doch: Der Ort, an dem wir in deiner Gegenwart wohnen[b], ist zu eng für uns.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne der Propheten“. Die Bezeichnung kann Angehörige einer prophetischen Gemeinschaft meinen, möglicherweise auch Schüler unter prophetischer Anleitung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor dir“. Das kann räumliche Nähe oder ein Leben in Elisas Gegenwart und unter seiner Aufsicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: Prophetenschüler
  rationale: Die hebräische Wendung lautet wörtlich „Söhne der Propheten“, bezeichnet hier aber wahrscheinlich die Angehörigen einer prophetischen Gemeinschaft. „Prophetenschüler“ gibt den gemeinten Personenkreis in verständlichem, modernem Deutsch wieder, ohne eine leibliche Abstammung nahezulegen.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf den folgenden Sachverhalt, während נָא die Äußerung höflich oder eindringlich abtönt. „Sieh doch“ verbindet beide Funktionen natürlich.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: an dem wir bei dir wohnen
  rationale: יָשַׁב bezeichnet hier das Wohnen oder Sich-Aufhalten. Das im Deutschen entbehrliche שָׁם wird durch den Relativanschluss „an dem“ inhaltlich aufgenommen. „Bei dir“ gibt לְפָנֶיךָ idiomatisch wieder und lässt sowohl räumliche Nähe als auch Elisas leitende Gegenwart zu.
- source_word: צַר מִמֶּנּוּ
  choice: ist zu eng für uns
  rationale: צַר bedeutet räumlich „eng“ oder „beengt“. Die Konstruktion mit מִן drückt hier aus, dass der vorhandene Ort für die Gruppe nicht ausreicht.
- source_word: וַיֹּאמְרוּ
  choice: sagten
  rationale: Das narrative Waw führt die Handlung fort. Im modernen Deutschen ist dafür kein ausdrücklich vorangestelltes „Und“ oder „Nun“ erforderlich.
theological_decisions:
- issue: Art der Beziehung zwischen Elisa und der prophetischen Gemeinschaft
  choice: Die Übersetzung legt weder ein leibliches Abstammungsverhältnis noch eine streng institutionalisierte Schule fest.
  alternative: „Prophetensöhne“ beziehungsweise „Jünger der Propheten“
  rationale: Der Ausdruck bezeichnet offenbar eine prophetische Gemeinschaft in Elisas Umfeld, doch der Vers bestimmt ihre genaue Organisations- und Lehrbeziehung nicht. Haupttext und Fußnoten bewahren diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Prophetenschüler“ vermeidet den im Deutschen missverständlichen wörtlichen Hebraismus im Haupttext; „Sieh doch“ bewahrt den höflich-auffordernden Ton. Die Satzstellung ist flüssig, ohne ein im Hebräischen nicht eigens ausgedrücktes deutsches „Nun“ einzuführen.
