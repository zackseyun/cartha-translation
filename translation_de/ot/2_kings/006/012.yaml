  source_fidelity: 'Der Entwurf gibt die hebräische Gegenüberstellung לֹא ... כִּי treffend wieder: Die Beteiligung eines Dieners wird verneint und Elisa als derjenige genannt, der dem König Israels die gesprochenen Worte mitteilt. Die Bezüge „in Israel“, „dem König von Israel“ und der private Ort חֲדַר מִשְׁכָּבֶךָ sind vollständig erhalten. Die Formulierung behauptet keine im Vers nicht ausdrücklich erklärte Art der Kenntniserlangung.'
