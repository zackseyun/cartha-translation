  text: וַ/יֹּ֨אמֶר֙ אַחַ֣ד מֵֽ/עֲבָדָ֔י/ו ל֖וֹא אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ כִּֽי אֱלִישָׁ֤ע הַ/נָּבִיא֙ אֲשֶׁ֣ר בְּ/יִשְׂרָאֵ֔ל יַגִּיד֙ לְ/מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר בַּ/חֲדַ֥ר מִשְׁכָּבֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: de
  text: 'Doch einer seiner Diener sagte: »Nein, mein Herr und König! Vielmehr ist es der Prophet Elisa in Israel, der dem König von Israel die Worte mitteilt, die du in deinem Schlafzimmer sprichst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹוא ... כִּי
  choice: Nein ... Vielmehr
  rationale: Die Verbindung weist die Vermutung des Königs zurück und stellt ihr die eigentliche Erklärung gegenüber.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Gibt die ehrerbietige königliche Anrede natürlich und ohne Verwechslung mit einem Gottesnamen wieder.
- source_word: יַגִּיד
  choice: mitteilt
  rationale: Das Verb bedeutet hier, dass Elisa dem König Israels die geheim gesprochenen Worte bekannt macht.
- source_word: חֲדַר מִשְׁכָּבֶךָ
  choice: deinem Schlafzimmer
  rationale: Bezeichnet wörtlich die Schlafkammer und betont den streng privaten Ort der Gespräche.
theological_decisions:
- issue: Wie Elisa von den geheimen Worten erfährt
  choice: Der Vers sagt nur, dass Elisa sie dem König von Israel mitteilt.
  alternative: Ausdrücklich ergänzen, Gott offenbare Elisa die Worte.
  rationale: Der unmittelbare Vers nennt die göttliche Offenbarung nicht ausdrücklich; sie sollte daher trotz des prophetischen Kontextes nicht in den Text eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bewahrt die entschiedene Zurückweisung und die Gegenüberstellung des hebräischen לֹוא ... כִּי.
