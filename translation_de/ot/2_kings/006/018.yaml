  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: de
  text: 'Als sie zu ihm hinabkamen, betete Elisa zu Jahwe und sagte: »Schlag doch dieses Volk mit Blindheit[a]!« Da schlug er sie mit Blindheit, wie Elisa gesagt hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit blendender Verwirrung«. Das hebräische Wort kann eine von Gott bewirkte Beeinträchtigung des Sehens und Erkennens bezeichnen, nicht unbedingt vollständige oder dauerhafte Blindheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: Als sie zu ihm hinabkamen
  rationale: ירד bezeichnet das Hinabgehen bzw. Herabkommen; אֶלָיו gibt die Bewegung auf Elisa zu an. Der feindliche Zusammenhang bleibt im Kontext erkennbar, ohne ihn über die Präposition hinaus festzuschreiben.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: betete Elisa zu Jahwe
  rationale: התפלל ist das gewöhnliche Verb für »beten«; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: הַךְ נָא
  choice: Schlag doch
  rationale: נכה bedeutet hier »schlagen«; נָא mildert die Aufforderung als bittende Partikel, was im natürlichen Deutschen durch »doch« ausgedrückt wird.
- source_word: הַגּוֹי הַזֶּה
  choice: dieses Volk
  rationale: גוי kann »Volk« oder »Nation« bedeuten. Hier bezeichnet es konkret die heranrückende aramäische Gruppe; »Volk« klingt im Deutschen natürlicher und vermeidet die Vorstellung, das gesamte Staatswesen sei vor Ort.
- source_word: בַּסַּנְוֵרִים
  choice: mit Blindheit
  rationale: Das seltene Wort סַנְוֵרִים bezeichnet eine von Gott bewirkte Beeinträchtigung des Sehens oder Wahrnehmens. »Blindheit« ist die klare Hauptwiedergabe; die mögliche Nuance einer blendenden Verwirrung wird in der Fußnote bewahrt.
- source_word: וַיַּכֵּם
  choice: Da schlug er sie
  rationale: Das nicht ausdrücklich genannte Subjekt ist aus dem Gebet heraus Jahwe. »Da« gibt die anschließende göttliche Reaktion im deutschen Erzählfluss wieder.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: wie Elisa gesagt hatte
  rationale: Wörtlich steht »gemäß dem Wort Elisas«. Die gewählte Form vermittelt denselben Bezug auf Elisas ausgesprochenes Gebet in natürlichem modernem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. »Jahwe« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der durch סַנְוֵרִים bezeichneten Beeinträchtigung
  choice: Blindheit mit erläuternder Fußnote
  alternative: blendende Verwirrung
  rationale: Der Erzählverlauf zeigt, dass die Betroffenen Elisa weiterhin sehen bzw. ihm folgen können, ihn aber nicht richtig erkennen. Deshalb bleibt die traditionelle lexikalische Wiedergabe im Text stehen, während die Fußnote vor einer unnötigen Festlegung auf vollständige oder dauerhafte Erblindung schützt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bewegungsangabe wird ohne zusätzliche militärische Deutung wiedergegeben; »Schlag doch« bewahrt zugleich die Kraft des Imperativs und den bittenden Ton von נָא.
