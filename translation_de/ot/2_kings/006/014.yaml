  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: de
  text: Er schickte Pferde, Streitwagen und ein großes Heer[a] dorthin. Sie kamen nachts und umzingelten die Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine schwere Streitmacht“; gemeint ist eine beträchtliche militärische Streitmacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickte er
  rationale: Das Wayyiqtol führt die Erzählung fort. „Da schickte er“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: שָׁמָּה
  choice: dorthin
  rationale: Der Richtungsadverb bezeichnet ein Ziel, das aus dem vorherigen Vers hervorgeht; „dorthin“ bildet diese Zielrichtung präzise ab.
- source_word: סוּסִים
  choice: Pferde
  rationale: Das Substantiv bezeichnet wörtlich Pferde. Die konkrete militärische Bildsprache bleibt erhalten, ohne daraus ausdrücklich Reiter zu machen.
- source_word: וְרֶכֶב
  choice: und Streitwagen
  rationale: רֶכֶב kann Streitwagen oder eine Streitwagenabteilung bezeichnen. „Streitwagen“ ist im Zusammenhang anschaulich und allgemein verständlich.
- source_word: וְחַיִל כָּבֵד
  choice: dazu eine starke Truppe
  rationale: חַיִל bezeichnet hier eine militärische Streitmacht; כָּבֵד bedeutet wörtlich „schwer“, idiomatisch jedoch beträchtlich oder stark. „Starke Truppe“ gibt den Sinn wieder, ohne zwingend ein vollständiges Heer anzunehmen.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: Sie kamen bei Nacht
  rationale: Die Wendung bezeichnet das Eintreffen in der Nacht. „Bei Nacht“ ist knapp, würdig und erhält die erzählerische Wirkung.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: und umzingelten die Stadt
  rationale: Im militärischen Zusammenhang bezeichnet נקף mit עַל das Einschließen beziehungsweise Umringen der Stadt. „Umzingelten“ ist hier idiomatisch und präzise.
