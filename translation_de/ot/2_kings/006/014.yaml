  terminology: „Pferde“ und „Streitwagen“ sind sachgerecht und konkret. „Großes Heer“ gibt חַיִל כָּבֵד im militärischen Kontext idiomatisch wieder, ohne die wörtliche Metapher „schwer“ in den Haupttext zu übertragen. Die Fußnote soll an diesem Ausdruck stehen, nicht bei „dorthin“.
