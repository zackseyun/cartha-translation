base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: de
  text: Da bereitete er ihnen ein großes Festmahl[a], und sie aßen und tranken. Danach ließ er sie ziehen, und sie gingen zu ihrem Herrn[b]. Die Streifscharen Arams kamen nicht wieder in das Land Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein großes Mahl“. Im Hebräischen steht eine Verb-Substantiv-Verbindung, die das Zubereiten einer reichlichen Mahlzeit bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu ihrem Gebieter“. Gemeint ist wahrscheinlich der König von Aram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: bereitete er ... ein großes Festmahl
  rationale: Die Verbindung aus כרה und dem verwandten Substantiv כֵּרָה ist eine idiomatische Verb-Substantiv-Fügung für das Bereiten einer reichlichen Mahlzeit. „Ein großes Festmahl bereiten“ gibt Idiom und Nachdruck natürlich wieder.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das Pronomen bezieht sich auf die gefangenen Aramäer; die knappe Wiedergabe ist im Deutschen eindeutig.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: sie aßen und tranken
  rationale: Direkte und natürliche Wiedergabe der beiden aufeinanderfolgenden Verben.
- source_word: וַיְשַׁלְּחֵם
  choice: ließ er sie ziehen
  rationale: Im Kontext bezeichnet שׁלח ihre Freilassung und Entsendung; „ließ sie ziehen“ drückt beides idiomatisch aus.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: zu ihrem Herrn
  rationale: Die morphologisch auffällige Form bezeichnet hier aufgrund des Kontextes wahrscheinlich den König von Aram als ihren Gebieter. „Herrn“ bewahrt den Rangtitel, ohne den Referenten ausdrücklich in den Haupttext einzutragen.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: seitdem ... nicht mehr
  rationale: יסף mit עוד und dem Infinitiv bezeichnet das Ausbleiben einer weiteren Wiederholung. „Seitdem ... nicht mehr“ stellt den erzählerischen Folgecharakter idiomatisch dar.
- source_word: גְּדוּדֵי אֲרָם
  choice: die Streifscharen Arams
  rationale: גְּדוּדֵי bezeichnet hier kleinere bewaffnete Gruppen, die zu Raub- oder Streifzügen eindringen, nicht notwendig ein reguläres Heer. „Streifscharen“ ist präzise und knapp.
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: in das Land Israel
  rationale: Bei בוא bezeichnet ב die Bewegung in ein Gebiet hinein. Die Formulierung bewahrt sowohl die Bewegungsrichtung als auch אֶרֶץ יִשְׂרָאֵל.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Festmahl“ bildet die Größe und den besonderen Charakter der Mahlzeit ab; „Streifscharen“ unterscheidet die betreffenden Gruppen von einem regulären Heer. Der Eigenname „Aram“ wird statt des älteren „Syrien“ verwendet.
