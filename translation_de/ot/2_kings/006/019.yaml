  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם אֱלִישָׁ֗ע לֹ֣א זֶ֣ה הַ/דֶּרֶךְ֮ וְ/לֹ֣א זֹ֣ה הָ/עִיר֒ לְכ֣וּ אַחֲרַ֔/י וְ/אוֹלִ֣יכָה אֶתְ/כֶ֔ם אֶל הָ/אִ֖ישׁ אֲשֶׁ֣ר תְּבַקֵּשׁ֑וּ/ן וַ/יֹּ֥לֶךְ אוֹתָ֖/ם שֹׁמְרֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: de
  text: 'Und Elisa sagte zu ihnen: „Das ist nicht der Weg, und das ist nicht die Stadt. Folgt mir[a], und ich will euch zu dem Mann führen, den ihr sucht.“ Und er führte sie nach Samaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Geht hinter mir her.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: der Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg, eine Straße oder einen Pfad. „Der Weg“ bewahrt die bestimmte, situationsbezogene Aussage, ohne eine bestimmte Art von Verkehrsweg festzulegen.
- source_word: הָעִיר
  choice: die Stadt
  rationale: עִיר ist die übliche Bezeichnung für eine Stadt. Der bestimmte Artikel und der unmittelbare Hinweis „dies“ bleiben erhalten.
- source_word: לְכוּ אַחֲרַי
  choice: Folgt mir
  rationale: Wörtlich etwa „Geht hinter mir her“. „Folgt mir“ gibt den Imperativ und die gemeinte Bewegung im modernen Deutschen natürlich wieder.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: dann führe ich euch
  rationale: 'Die Hifil-Form von הלך hat hier kausative Bedeutung: jemanden gehen lassen beziehungsweise führen. Im Anschluss an den Imperativ drückt „dann führe ich euch“ die zugesagte Folge idiomatisch aus.'
- source_word: הָאִישׁ
  choice: dem Mann
  rationale: אִישׁ bedeutet gewöhnlich „Mann“. Die Wiedergabe wahrt Elisas indirekten Selbstbezug und die erzählerische Ironie.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: den ihr sucht
  rationale: בקשׁ bedeutet „suchen“. Die schlichte Präsensform ist im Deutschen natürlich und bewahrt den persönlichen Bezug.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: Und er führte sie
  rationale: Erneut steht die kausative Form von הלך. „Führte“ wahrt die lexikalische Verbindung zur vorausgehenden Zusage.
- source_word: שֹׁמְרוֹנָה
  choice: nach Samaria
  rationale: Das direktionale He bezeichnet eine Bewegung auf Samaria zu; bei Städtenamen ist „nach Samaria“ die idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Elisas irreführende Aussage gegenüber den Aramäern
  choice: 'Die Aussage wird ohne Abschwächung oder moralische Kommentierung direkt wiedergegeben: „Dies ist nicht der Weg, und dies ist nicht die Stadt.“'
  alternative: Eine erklärende Paraphrase, die Elisas Worte ausdrücklich als Täuschung oder als Teilwahrheit deutet.
  rationale: Der hebräische Erzähltext formuliert die Aussage schlicht. Ihre ethische und theologische Bewertung soll nicht durch die Übersetzung vorweggenommen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Dies“ erhält die pointierte deiktische Gegenüberstellung des Hebräischen; „Folgt mir“ vermeidet eine im Deutschen schwerfällige wörtliche Formulierung.
