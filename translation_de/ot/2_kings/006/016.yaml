  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: de
  text: 'Er sagte: „Fürchte dich nicht, denn die bei uns sind, sind zahlreicher als die bei ihnen sind.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn zahlreich sind die, die bei uns sind, mehr als die, die bei ihnen sind.“'
    reason: Bewahrt die vorangestellte prädikative Struktur von רַבִּים und die explizite Vergleichsform, ohne die im Haupttext offen gelassene Identität der Gruppen zu deuten.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das narrative Wayyiqtol führt die Handlung weiter. „Da sagte er“ gibt diesen Fortgang im modernen Deutschen natürlich wieder, ohne ein schwerfälliges „Und er sagte“ zu verlangen.
- source_word: אַל־תִּירָא
  choice: Fürchte dich nicht
  rationale: אַל mit der folgenden Verbform drückt ein Verbot aus. „Fürchte dich nicht“ ist prägnant, würdevoll und idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Aufforderung ein; „denn“ bewahrt den erklärenden Zusammenhang der direkten Rede.
- source_word: רַבִּים
  choice: sind zahlreicher
  rationale: רַבִּים steht hier in einer Vergleichskonstruktion mit מֵאֲשֶׁר. „Sind zahlreicher“ macht den komparativen Sinn im Deutschen klar.
- source_word: אֲשֶׁר אִתָּנוּ
  choice: die, die bei uns sind
  rationale: Die Relativpartikel mit der Präpositionalfügung wird substantivisch gebraucht. Die Wiedergabe wahrt die Struktur und lässt die Identität dieser Gruppe offen.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: als die, die bei ihnen sind
  rationale: מִן leitet den Vergleichsmaßstab ein. Obwohl אוֹתָם formal „sie“ lautet, ist im parallelen Vergleich „bei ihnen“ sinngemäß ergänzt.
theological_decisions:
- issue: Identität der größeren Gruppe „bei uns“
  choice: Im Vers selbst nicht näher bestimmt
  alternative: Aus dem folgenden Kontext ausdrücklich als himmlisches Heer oder Engel bezeichnet
  rationale: Der hebräische Wortlaut benennt die unsichtbare Macht in diesem Vers nicht. Die Übersetzung bewahrt diese Zurückhaltung und nimmt die spätere Enthüllung nicht vorweg.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; die im Hebräischen offene Identität der Beteiligten wird nicht ausgedeutet.
