source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֔ם הָיָ֥ה נִלְחָ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יִּוָּעַץ֙ אֶל עֲבָדָ֣י/ו לֵ/אמֹ֗ר אֶל מְק֛וֹם פְּלֹנִ֥י אַלְמֹנִ֖י תַּחֲנֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: de
  text: 'Der König von Aram führte Krieg gegen Israel. Er beriet sich mit seinen Dienern und sagte: »An dem und dem Ort soll mein Lager sein.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »An dem und dem Ort ist mein Lager.« Das Hebräische gebraucht eine Wendung für einen nicht näher genannten Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Der König von Aram
  rationale: Der Name אֲרָם wird als »Aram« wiedergegeben, nicht mit dem traditionellen »Syrien« ersetzt. Das einleitende וּ wird im Deutschen durch den narrativen Zusammenhang ausreichend getragen und muss nicht eigens mit »und« übersetzt werden.
- source_word: הָיָה נִלְחָם בְּיִשְׂרָאֵל
  choice: führte Krieg gegen Israel
  rationale: Die Verbindung von היה mit dem Partizip bezeichnet eine andauernde oder wiederholte Handlung in der Vergangenheit. »führte Krieg« ist im Deutschen natürlich und bewahrt diesen durativen Sinn; בְּ bezeichnet bei נלחם den Gegner.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: Er beriet sich mit seinen Dienern
  rationale: Das Verb bezeichnet das Beraten beziehungsweise Einholen von Rat. »sich mit … beraten« ist idiomatisches Deutsch. עֲבָדָיו bleibt als das breitere »seine Diener« erhalten, statt es kontextuell auf »Offiziere« einzuengen.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der hebräische Zitatintroduktor wird in flüssigem modernem Deutsch als finite Redeeinleitung wiedergegeben.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: An dem und dem Ort
  rationale: Die Wortverbindung ist eine feste Wendung für einen nicht näher genannten Ort. »an dem und dem Ort« erhält diese idiomatische Unbestimmtheit.
- source_word: תַּחֲנֹתִי
  choice: soll mein Lager sein
  rationale: Das Substantiv bezeichnet Lager beziehungsweise Lagerplatz. Im Zusammenhang einer militärischen Planung gibt »soll … sein« die beabsichtigte künftige Position natürlich wieder, ohne das knappe Hebräisch zu überdeuten.
