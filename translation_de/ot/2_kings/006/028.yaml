  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: de
  text: 'Da sagte der König zu ihr: „Was hast du?“ Sie antwortete: „Diese Frau hat zu mir gesagt: ‚Gib deinen Sohn her, damit wir ihn heute essen; morgen essen wir dann meinen Sohn.‘“'
