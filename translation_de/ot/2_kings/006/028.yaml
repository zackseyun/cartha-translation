lexical_decisions:
- source_word: מַה לָךְ
  choice: Was hast du?
  rationale: Die knappe deutsche Frage gibt die idiomatische hebräische Wendung natürlich und unmittelbar wieder, ohne sie unnötig auszudeuten.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: Gib deinen Sohn her
  rationale: „Hergeben“ macht in natürlichem Deutsch deutlich, dass der Sohn der anderen Frau überlassen werden soll.
- source_word: וְנֹאכְלֶנּוּ / נֹאכַל
  choice: damit wir ihn heute essen; morgen essen wir dann
  rationale: Der erste Kohortativ drückt den beabsichtigten Zweck aus; die zweite Verbform bezeichnet die für den nächsten Tag vereinbarte Handlung. „Dann“ bildet die zeitliche Abfolge natürlich ab.
