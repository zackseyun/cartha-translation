    text: 'Oder: „Taubenkot“. Manche verstehen den Ausdruck wörtlich; andere halten ihn für die Bezeichnung eines billigen Nahrungsmittels oder Pflanzenprodukts, das während der Hungersnot verkauft wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: Da herrschte eine schwere Hungersnot
  rationale: Die narrative Eröffnung wird in natürlichem Deutsch wiedergegeben; גָּדוֹל bezeichnet hier die außergewöhnliche Schwere der Hungersnot.
- source_word: וְהִנֵּה צָרִים עָלֶיהָ
  choice: Die Stadt wurde nämlich belagert
  rationale: Der Partizip drückt die andauernde Belagerung aus. הִנֵּה lenkt die Aufmerksamkeit auf diesen erklärenden Umstand; „nämlich“ gibt seine Funktion hier natürlicher wieder als das altertümliche „siehe“.
- source_word: עַד הֱיוֹת
  choice: sodass … kostete
  rationale: Die Konstruktion bezeichnet hier das extreme Ergebnis beziehungsweise Ausmaß der Belagerung und Hungersnot.
- source_word: רֹאשׁ חֲמוֹר
  choice: ein Eselskopf
  rationale: Die knappe deutsche Zusammensetzung bewahrt das drastische Bild des hebräischen Konstruktausdrucks.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: achtzig Silberstücke
  rationale: Im Hebräischen ist keine konkrete Gewichtseinheit ausdrücklich genannt; „Silberstücke“ vermeidet daher die Präzisierung zu Schekeln.
- source_word: רֹבַע הַקַּב
  choice: ein Viertel Kab
  rationale: Kab bleibt als antikes Trockenmaß erhalten, da eine exakte moderne Umrechnung unsicher ist.
- source_word: חרי יונים
  choice: Taubenmist
  rationale: Der unmittelbarste Wortsinn ist „Taubenmist“; mögliche Bezeichnungen für ein billiges Nahrungs- oder Pflanzenprodukt werden wegen der lexikalischen Unsicherheit in der Fußnote genannt.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: fünf Silberstücke
  rationale: Wie bei der ersten Preisangabe nennt der hebräische Text Silber, aber keine ausdrückliche Einheit; das aus dem ersten Satzglied fortwirkende „kostete“ ergibt klares Deutsch.
