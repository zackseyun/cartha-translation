base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: de
  text: '„Lasst uns doch an den Jordan gehen, von dort jeder einen Balken holen und uns dort einen Ort zum Wohnen schaffen.“ Er sagte: „Geht!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: Lasst uns doch ... gehen
  rationale: Der Kohortativ der ersten Person Plural mit נָא drückt eine höfliche Bitte oder einen Vorschlag aus. „Lasst uns doch“ gibt beides in natürlichem Deutsch wieder.
- source_word: עַד הַיַּרְדֵּן
  choice: an den Jordan
  rationale: עַד bezeichnet hier das Ziel der Bewegung („bis zu/an“). Im Deutschen ist „an den Jordan“ für den Fluss idiomatisch.
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: Dort soll jeder von uns einen Balken holen
  rationale: 'אִישׁ ... אֶחָת ist distributiv: Jeder Beteiligte nimmt genau ein Bauholz. „Holen“ verbindet das Nehmen mit dem Transport zum vorgesehenen Bauplatz; „Balken“ passt zum Bauzusammenhang.'
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: wir wollen uns dort einen Ort bauen
  rationale: עשה bedeutet grundsätzlich „machen“, bezeichnet im Zusammenhang mit den Balken aber das Errichten. „Einen Ort bauen“ bleibt offen, um welche Art Gebäude oder Anlage es sich handelt.
- source_word: לָשֶׁבֶת שָׁם
  choice: an dem wir wohnen können
  rationale: ישב kann „sitzen“, „bleiben“ oder „wohnen“ bedeuten. Hier bezeichnet es den dauerhaften Gebrauch des geplanten Ortes; die Formulierung vermeidet im Deutschen die schwerfällige Wiederholung von „dort“.
- source_word: וַיֹּאמֶר לֵכוּ
  choice: 'Er sagte: „Geht!“'
  rationale: Die knappe Antwort erteilt die erbetene Zustimmung. Der Imperativ Plural wird direkt wiedergegeben.
