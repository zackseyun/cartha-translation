  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יִּקְבֹּ֛ץ בֶּן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם אֶת כָּל מַחֲנֵ֑/הוּ וַ/יַּ֕עַל וַ/יָּ֖צַר עַל שֹׁמְרֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: de
  text: 'Danach geschah Folgendes: Ben-Hadad, der König von Aram, versammelte sein ganzes Heer[a], zog hinauf und belagerte Samaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine gesamten Streitkräfte“; das hebräische Wort kann „Lager“, „Heerlager“ oder „Heer“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach geschah Folgendes
  rationale: Bewahrt die hebräische Erzählformel und die zeitliche Abfolge in natürlichem, modernem Deutsch, ohne sie zum unbestimmteren „Einige Zeit später“ abzuschwächen.
- source_word: וַיִּקְבֹּץ
  choice: versammelte
  rationale: Gibt das Sammeln beziehungsweise Zusammenziehen unmittelbar wieder; der militärische Zusammenhang macht die Bedeutung klar, ohne das technischere „musterte“ einzutragen.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Übliche deutsche Umschrift des Personennamens.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: Folgt dem hebräischen Ortsnamen אֲרָם unmittelbar und vermeidet die traditionelle, aber interpretierende Wiedergabe „Syrien“.
- source_word: כָּל מַחֲנֵהוּ
  choice: sein ganzes Heer
  rationale: מַחֲנֶה kann Lager, Heerlager oder Heer bezeichnen. Im Zusammenhang des Feldzugs ist „Heer“ die klare und natürliche deutsche Wiedergabe.
- source_word: וַיַּעַל
  choice: zog hinauf
  rationale: Erhält die Bewegungsrichtung des hebräischen Verbs und klingt im Zusammenhang eines militärischen Feldzugs natürlich.
- source_word: וַיָּצַר עַל
  choice: belagerte
  rationale: Die Verbindung bezeichnet das Einschließen beziehungsweise Belagern einer Stadt; „belagerte“ ist präzise und knapp.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
