source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר כֹּֽה יַעֲשֶׂה לִּ֥/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף אִֽם יַעֲמֹ֞ד רֹ֣אשׁ אֱלִישָׁ֧ע בֶּן שָׁפָ֛ט עָלָ֖י/ו הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: de
  text: 'Er sagte: »Gott soll mir dies und noch mehr antun, wenn der Kopf Elisas, des Sohnes Schafats, heute auf ihm bleibt!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wenn der Kopf Elisas, des Sohnes Schafats, heute auf ihm stehen bleibt« – gemeint ist: wenn Elisas Kopf heute noch auf seinem Körper bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: Gott soll mir dies und noch mehr antun
  rationale: Die feste hebräische Selbstverfluchungsformel wird in verständlichem, würdigem Deutsch als Eid wiedergegeben. Das unbestimmte »dies« und die steigernde Fortsetzung bleiben erhalten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet das Wort in dieser Eidformel den einen Gott; auch die Verbformen sind singularisch.
- source_word: אִם
  choice: wenn
  rationale: In einer Schwurformel kann אִם einen unausgesprochenen negativen Eid einleiten. »Wenn« bewahrt die hebräische Satzform, während die vorangehende Selbstverfluchung die Drohung erkennen lässt.
- source_word: יַעֲמֹד
  choice: bleibt
  rationale: Das Verb bedeutet grundsätzlich »stehen«, bezeichnet hier aber, dass Elisas Kopf weiterhin auf ihm beziehungsweise auf seinem Körper bleibt.
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: der Kopf Elisas, des Sohnes Schafats
  rationale: Die Formulierung folgt der hebräischen Genitivverbindung und bewahrt die schroffe Bildlichkeit der Hinrichtungsdrohung.
- source_word: עָלָיו
  choice: auf ihm
  rationale: Die knappe und ungewöhnliche Formulierung des Hebräischen wird bewahrt, ohne »auf seinem Körper« oder »auf seinen Schultern« bereits in den Haupttext einzutragen.
- source_word: הַיּוֹם
  choice: heute
  rationale: »Heute« ist die natürliche moderne Wiedergabe und erhält die zeitliche Dringlichkeit des Eides.
theological_decisions:
- issue: Bezug und Kraft der Schwurformel
  choice: 'Selbstverfluchender Eid vor Gott: Der Sprecher ruft Strafe auf sich herab, falls Elisa an diesem Tag nicht enthauptet wird.'
  alternative: Bloßer zorniger Ausruf ohne vollen Eidcharakter.
  rationale: Die Formel ist im Hebräischen eine feste Eid- und Selbstverfluchungsformel. Ihre Schärfe darf nicht zu einer allgemeinen Äußerung des Zorns abgeschwächt werden.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die eigentümlich knappe Körpermetapher des Hebräischen bleibt im Haupttext sichtbar und wird in der Fußnote erläutert.
