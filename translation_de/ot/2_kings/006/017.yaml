source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֤ל אֱלִישָׁע֙ וַ/יֹּאמַ֔ר יְהוָ֕ה פְּקַח נָ֥א אֶת עֵינָ֖י/ו וְ/יִרְאֶ֑ה וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵינֵ֣י הַ/נַּ֔עַר וַ/יַּ֗רְא וְ/הִנֵּ֨ה הָ/הָ֜ר מָלֵ֨א סוּסִ֥ים וְ/רֶ֛כֶב אֵ֖שׁ סְבִיבֹ֥ת אֱלִישָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: de
  text: 'Da betete Elisa und sagte: „Jahwe[a], öffne ihm doch die Augen, damit er sieht!“ Da öffnete Jahwe dem jungen Mann[b] die Augen, und er sah: Siehe, der Berg war rings um Elisa voller Pferde und Streitwagen aus Feuer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat den Gottesnamen JHWH, hier „Jahwe“; traditionell wird er auch mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „dem Diener“. Das hebräische Wort naʿar kann je nach Zusammenhang einen jungen Menschen oder einen Diener beziehungsweise Begleiter bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: betete
  rationale: Das Hitpael von פלל bezeichnet hier ein an Gott gerichtetes Gebet; „betete“ ist im deutschen Erzählstil natürlich und präzise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: פְּקַח נָא
  choice: öffne ... doch
  rationale: פקח bedeutet hier „öffnen“; נא kennzeichnet eine eindringliche, höfliche Bitte. Das deutsche Modalwort „doch“ gibt diesen bittenden Ton natürlich wieder.
- source_word: וְיִרְאֶה
  choice: damit er sieht
  rationale: Die Verbform drückt nach der Aufforderung zweck- beziehungsweise folgebezogen aus, dass der Betreffende sehen soll.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נער kann einen Jungen, jungen Mann oder Diener bezeichnen. „Junger Mann“ bewahrt den primären lexikalischen Sinn; die kontextuell mögliche Bedeutung „Diener“ wird in einer Fußnote genannt.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: הנה lenkt die Aufmerksamkeit lebhaft auf den überraschenden Anblick. „Siehe“ wahrt diese erzählerische Signalwirkung in würdigem Deutsch.
- source_word: הָהָר מָלֵא
  choice: der Berg war ... voller
  rationale: Die prädikative Wendung wird direkt und idiomatisch wiedergegeben.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: Pferde und Streitwagen aus Feuer
  rationale: רכב bezeichnet hier kollektiv Streitwagen beziehungsweise Wagenmacht; אש steht unmittelbar bei רכב. „Streitwagen aus Feuer“ bewahrt das eindrückliche Bild und vermeidet die mögliche moderne Nebenbedeutung von „Feuerwagen“.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: rings um Elisa
  rationale: סביבות bezeichnet ein umfassendes Umgeben; „rings um“ gibt dies knapp und anschaulich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. Die Transliteration „Jahwe“ erhält den Charakter als persönlicher Name; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
- issue: Art des eröffneten Sehens
  choice: Die Aussage bleibt bei dem von Gott ermöglichten Sehen der Pferde und Streitwagen aus Feuer.
  alternative: Ausdrückliche Deutung als buchstäbliches Engelheer oder als rein symbolische Vision
  rationale: Der Vers bestimmt nicht näher, ob der Anblick ontologisch als sichtbar gewordene himmlische Wirklichkeit, als Vision oder in anderer Weise zu verstehen ist. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit naher Bindung an die hebräische Erzählstruktur. „Doch“ vermittelt den bittenden Wert von נא, ohne ihn zeitlich als „jetzt“ misszuverstehen. „Siehe“ ist bewusst als gehobenes, aber verständliches Aufmerksamkeitssignal erhalten.
