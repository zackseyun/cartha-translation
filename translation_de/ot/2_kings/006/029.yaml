base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: de
  text: 'Und wir kochten meinen Sohn und aßen ihn.[a] Am nächsten Tag sagte ich zu ihr: »Gib deinen Sohn her, damit wir ihn essen.«[b] Doch sie versteckte ihren Sohn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und wir siedeten meinen Sohn und aßen ihn.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gib deinen Sohn her, und wir werden ihn essen.« Die hebräische Verbform kann auch schlicht als Zukunft verstanden werden; im Zusammenhang liegt jedoch eine Zweck- oder Folgeangabe nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: kochten
  rationale: בשׁל bezeichnet hier das Kochen beziehungsweise Sieden. »Kochen« ist im modernen Deutschen natürlich und wahrt die sachlich-grausame Direktheit; die engere Alternative »sieden« ist möglich, klingt aber weniger gegenwärtig.
- source_word: בְּנִי
  choice: meinen Sohn
  rationale: בן bezeichnet ausdrücklich den Sohn; das Possessivsuffix der ersten Person Singular wird beibehalten.
- source_word: וַנֹּאכְלֵהוּ
  choice: und aßen ihn
  rationale: אכל bedeutet schlicht »essen«; das hebräische Objektsuffix wird durch »ihn« ausdrücklich wiedergegeben.
- source_word: וָאֹמַר אֵלֶיהָ
  choice: sagte ich zu ihr
  rationale: Die Erzählform führt die Handlung weiter; zusammen mit »Am nächsten Tag« ergibt sich im Deutschen eine natürliche zeitliche Abfolge.
- source_word: בַּיּוֹם הָאַחֵר
  choice: Am nächsten Tag
  rationale: Die Wendung bezeichnet den darauffolgenden Tag und wird idiomatisch wiedergegeben.
- source_word: תְּנִי
  choice: Gib … her
  rationale: נתן heißt grundsätzlich »geben«. Die Verbklammer »Gib deinen Sohn her« klingt in diesem Zusammenhang natürlicher und unmittelbarer als das isolierte »Gib deinen Sohn«.
- source_word: בְּנֵךְ
  choice: deinen Sohn
  rationale: בן mit femininem Singularsuffix der zweiten Person bedeutet ausdrücklich »deinen Sohn«.
- source_word: וְנֹאכְלֶנּוּ
  choice: damit wir ihn essen
  rationale: Der mit וְ angeschlossene Imperfekt kann nach dem Imperativ als Zweck oder beabsichtigte Folge verstanden werden. »Damit« gibt diese im Kontext naheliegende Beziehung wieder, ohne die mögliche schlichte Zukunft zu verschweigen.
- source_word: וַתַּחְבִּא
  choice: Doch sie versteckte
  rationale: 'Das Waw führt die Erzählung fort, hat im Kontext aber klar kontrastierende Wirkung: Die Frau kommt der Aufforderung nicht nach. »Doch« macht diesen Gegensatz im Deutschen natürlich sichtbar.'
- source_word: בְּנָהּ
  choice: ihren Sohn
  rationale: בן mit Possessivsuffix der dritten Person feminin Singular wird konkret als »ihren Sohn« wiedergegeben.
