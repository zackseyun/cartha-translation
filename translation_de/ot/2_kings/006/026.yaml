  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: de
  text: 'Als nun der König von Israel auf der Mauer entlangging, schrie eine Frau ihm zu: »Hilf, mein Herr und König!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rette, mein Herr und König!« Das hebräische Verb bedeutet wörtlich »rette«, dient hier aber als dringender Hilferuf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: Als nun ... entlangging
  rationale: Die Verbindung aus וַיְהִי und Partizip zeichnet eine gleichzeitig ablaufende Hintergrundhandlung. „Als nun ... entlangging“ gibt diese zeitliche und fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die Constructusverbindung bezeichnet den israelitischen König; der bestimmte Artikel ergibt sich aus dem Erzählzusammenhang.
- source_word: עַל הַחֹמָה
  choice: auf der Mauer
  rationale: עַל bezeichnet hier den Ort der Bewegung. Im Belagerungskontext ist die Stadtmauer beziehungsweise ihr begehbarer Wehrgang gemeint.
- source_word: וְאִשָּׁה צָעֲקָה אֵלָיו
  choice: schrie eine Frau ihm zu
  rationale: צעק bezeichnet einen lauten, dringlichen Ruf. Die deutsche Wortstellung und „ihm zu“ geben den Adressaten idiomatisch wieder.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt wiedergegeben
  rationale: Der übliche hebräische Zitateinleiter muss vor direkter Rede im Deutschen nicht eigens mit „und sagte“ übersetzt werden.
- source_word: הוֹשִׁיעָה
  choice: Hilf mir
  rationale: Der Imperativ von ישׁע bedeutet wörtlich „rette“. In der Bitte an den König verlangt die Frau dringendes Eingreifen; „Hilf mir“ ist im Deutschen kontextgemäß, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: אֲדֹנִי ist eine ehrerbietige Anrede, und הַמֶּלֶךְ benennt den Angeredeten näher. „Mein Herr und König“ bewahrt beide Elemente in einer natürlichen deutschen Anrede.
