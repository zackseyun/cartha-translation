source:
  edition: WLC
  text: עוֹדֶ֨/נּוּ֙ מְדַבֵּ֣ר עִמָּ֔/ם וְ/הִנֵּ֥ה הַ/מַּלְאָ֖ךְ יֹרֵ֣ד אֵלָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּֽה זֹ֤את הָֽ/רָעָה֙ מֵ/אֵ֣ת יְהוָ֔ה מָֽה אוֹחִ֥יל לַ/יהוָ֖ה עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: de
  text: 'Während er noch mit ihnen redete, kam der Bote zu ihm herab und sagte: »Sieh, dieses Unheil kommt von Jahwe. Warum sollte ich noch länger auf Jahwe warten?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was sollte ich noch von Jahwe erhoffen?« Das hebräische Verb kann sowohl »warten« als auch »hoffen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Während er noch mit ihnen redete
  rationale: Die Konstruktion bezeichnet eine noch andauernde Handlung; die deutsche Nebensatzform gibt den zeitlichen Verlauf natürlich wieder.
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: Im unmittelbaren Erzählzusammenhang ist der Abgesandte des Königs gemeint, kein himmlisches Wesen.
- source_word: יֹרֵד אֵלָיו
  choice: kam zu ihm herab
  rationale: Gibt die abwärts gerichtete Bewegung des Partizips wieder und klingt im deutschen Erzählstil natürlich.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt in der direkten Rede die hinweisende und nachdrückliche Funktion der Interjektion in verständlichem modernem Deutsch. Das erste הִנֵּה wird im Erzählfluss idiomatisch durch das unmittelbare 'kam' ausgedrückt, statt mit einem schwerfälligen zweiten Signalwort wiederholt zu werden.
- source_word: זֹאת הָרָעָה
  choice: dieses Unheil
  rationale: רָעָה bezeichnet hier die gegenwärtige Katastrophe; 'Unheil' bewahrt zugleich die negative Wertung und vermeidet die im Deutschen missverständliche abstrakt-moralische Bedeutung von 'dieses Böse'.
- source_word: מֵאֵת יְהוָה
  choice: kommt von Jahwe
  rationale: Kennzeichnet Jahwe als Ursprung beziehungsweise Urheber des gegenwärtigen Unheils; das ergänzte Verb 'kommt' ist im Deutschen erforderlich.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: Warum sollte ich noch länger auf Jahwe warten?
  rationale: Die rhetorische Frage drückt die Weigerung aus, weiter auf Jahwes Eingreifen zu warten. Die ebenfalls mögliche Bedeutung 'hoffen' bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; 'Jahwe' gibt den offenbarten Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von יחל in der Klage
  choice: auf Jahwe warten
  alternative: noch auf Jahwe hoffen / noch etwas von Jahwe erhoffen
  rationale: Das Verb umfasst Warten und Hoffen. Im Zusammenhang ist das weitere Warten auf göttliches Eingreifen vordergründig; die Hoffnungskomponente wird wegen der echten Mehrdeutigkeit nicht verworfen, sondern in der Fußnote genannt.
- issue: Zuschreibung des Unheils an Jahwe
  choice: dieses Unheil kommt von Jahwe
  alternative: dieses Unheil ist von Jahwe
  rationale: Die Aussage des Sprechers wird ohne Abschwächung oder dogmatische Erklärung wiedergegeben; sie schreibt das gegenwärtige Unheil Jahwe als Ursprung zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. 'Sieh' erhält den rhetorischen Nachdruck der direkten Rede, während 'Bote' den menschlichen Abgesandten im Kontext klar bezeichnet. Die Satzstellung bleibt flüssig und erzählerisch.
