  text: וַ/יֵּצֵא֙ אֶל מוֹצָ֣א הַ/מַּ֔יִם וַ/יַּשְׁלֶךְ שָׁ֖ם מֶ֑לַח וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה רִפִּ֨אתִי֙ לַ/מַּ֣יִם הָ/אֵ֔לֶּה לֹֽא יִהְיֶ֥ה מִ/שָּׁ֛ם ע֖וֹד מָ֥וֶת וּ/מְשַׁכָּֽלֶת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: de
  text: 'Dann ging er hinaus zur Quelle des Wassers[a], warf dort Salz hinein und sagte: »So spricht Jahwe: Ich habe dieses Wasser geheilt. Von dort wird künftig weder Tod noch Fehlgeburt[b] ausgehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur Austrittsstelle des Wassers« beziehungsweise »zum Quellort«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann den Verlust von Nachwuchs, das Verursachen von Fehlgeburten oder allgemeiner Unfruchtbarkeit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: Quelle des Wassers
  rationale: מוֹצָא bezeichnet hier den Ort, an dem das Wasser hervortritt. »Quelle« ist im Zusammenhang mit der Wasserversorgung der Stadt natürlich; die weitere Bedeutung »Austrittsstelle« wird in der Fußnote bewahrt.
- source_word: וַיַּשְׁלֶךְ שָׁם מֶלַח
  choice: warf dort Salz hinein
  rationale: »Hinein« gibt im Deutschen idiomatisch wieder, dass das Salz an der Quelle in das Wasser geworfen wurde, ohne dem Vorgang eine nicht ausdrücklich genannte symbolische Deutung beizulegen.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Botenformel wahrt den feierlichen prophetischen Charakter; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: Ich habe dieses Wasser geheilt
  rationale: Die wörtliche Heilungsmetapher des Verbs רפא bleibt erhalten. Das formal plurale מַיִם wird entsprechend dem natürlichen deutschen Sprachgebrauch als Massennomen im Singular wiedergegeben.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: Von dort werden künftig … nicht mehr kommen
  rationale: Die Formulierung bewahrt sowohl den Ausgangspunkt מִשָּׁם als auch die Beendigung des bisherigen Zustands durch עוֹד; mit »weder … noch« wird sie im Satz idiomatisch gefasst.
- source_word: מָוֶת
  choice: Tod
  rationale: Direkte Entsprechung; die Übersetzung legt nicht näher fest, auf welche Weise das schlechte Wasser den Tod verursachte.
- source_word: מְשַׁכָּלֶת
  choice: Fehlgeburt
  rationale: Das Wort bezeichnet Verlust von Nachwuchs beziehungsweise das Verursachen solchen Verlusts. »Fehlgeburt« gibt die konkrete Hauptbedeutung knapp wieder; die weiter reichende Bedeutungsbreite wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt im Deutschen den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen dem Salz und der Heilung des Wassers
  choice: Keine eigenständige Wirkkraft des Salzes erläutern
  alternative: Das Salz ausdrücklich als Mittel oder Symbol der Heilung bezeichnen
  rationale: Der Erzähltext berichtet zwar, dass Elisa Salz hineinwarf, schreibt die Heilung in der anschließenden Gottesrede jedoch Jahwe zu. Die Übersetzung bewahrt diese Abfolge, ohne eine nicht ausgesprochene sakramentale, magische oder rein natürliche Erklärung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt bewusst feierlich; ansonsten ist der Satz klar und ohne altertümliche Wortstellung formuliert. Die Bildrede vom »Heilen« des Wassers sowie die Bedeutungsbreite von מְשַׁכָּלֶת bleiben erhalten.
