base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: de
  text: 'Als sie hinübergegangen waren, sagte Elia zu Elisa: »Sag mir, was ich für dich tun soll, bevor ich von dir weggenommen werde.« Elisa antwortete: »Möge mir doch ein doppelter Anteil an deinem Geist zuteilwerden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Mögen zwei Anteile an deinem Geist zu mir kommen.« Die hebräische Wendung meint einen doppelten Anteil und spielt wahrscheinlich auf das Erbteil des Erstgeborenen an. Sie muss nicht bedeuten, dass Elisa um doppelt so viel prophetische Kraft wie Elia bittet.'
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: כְעָבְרָם
  choice: Als sie hinübergegangen waren
  rationale: Die Präposition כְּ mit Infinitiv und Subjektsuffix bezeichnet hier den Zeitpunkt; der deutsche vorzeitige Ausdruck bildet die Abfolge natürlich ab.
- source_word: שְׁאַל מָה אֶעֱשֶׂה לָּךְ
  choice: Bitte mich um etwas, das ich für dich tun soll
  rationale: Der Imperativ שְׁאַל eröffnet ein Angebot. Die Formulierung gibt die elliptische hebräische Frage in natürlichem Deutsch wieder, ohne eine sichere Erfüllung vorwegzunehmen.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: bevor ich von dir weggenommen werde
  rationale: Die Nifalform ist passiv; »von dir« bewahrt den Gedanken der bevorstehenden Trennung.
- source_word: וִיהִי נָא
  choice: Möge mir doch … zuteilwerden
  rationale: Der Jussiv zusammen mit נָא drückt eine höfliche, nachdrückliche Bitte aus; »doch« wahrt diesen Ton in würdigem modernem Deutsch.
- source_word: פִּי שְׁנַיִם
  choice: ein doppelter Anteil
  rationale: Die Wendung bezeichnet wörtlich zwei Anteile beziehungsweise einen Doppelanteil und erinnert wahrscheinlich an das Erbteil des Erstgeborenen.
- source_word: בְּרוּחֲךָ
  choice: an deinem Geist
  rationale: Der Possessivbezug zu Elia bleibt ausdrücklich erhalten. Die Großschreibung wird vermieden, damit der Text nicht vorschnell als technische Bezeichnung des Heiligen Geistes festgelegt wird.
- source_word: אֵלָי
  choice: mir … zuteilwerden
  rationale: Das wörtliche »zu mir« wird idiomatisch mit dem erbetenen Anteil verbunden; dies vermeidet die zusätzliche räumliche Deutung »auf mir«.
theological_decisions:
- issue: Bedeutung von פִּי שְׁנַיִם בְּרוּחֲךָ
  choice: Elisa bittet um einen doppelten Anteil an Elias Geist, wahrscheinlich mit Anklang an das Erbrecht des Erstgeborenen.
  alternative: Elisa bittet darum, doppelt so viel prophetische Kraft wie Elia zu besitzen.
  rationale: »Doppelter Anteil« bewahrt das Erbteilbild und legt nicht fest, dass Elisa Elias Kraft quantitativ verdoppeln möchte.
- issue: Bezug von »deinem Geist«
  choice: Gemeint ist Elias Geist beziehungsweise die mit seinem prophetischen Dienst verbundene geistliche Befähigung.
  alternative: Die Wendung bezeichnet unmittelbar und technisch die Person des Heiligen Geistes.
  rationale: Das hebräische Possessivsuffix stellt den Bezug zu Elia her. Die Übersetzung wahrt diese Offenheit, ohne eine trinitarische oder andere dogmatische Präzisierung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; die Bitte Elisas bleibt höflich und theologisch offen.
