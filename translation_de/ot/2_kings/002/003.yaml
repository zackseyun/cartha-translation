- from: 'Da kamen die Prophetenschüler, die in Bethel waren, zu Elisa heraus und sagten zu ihm: »Weißt du, dass Yahweh heute deinen Lehrer von dir wegnehmen wird[a]?« Er antwortete: »Auch ich weiß es. Schweigt!«'
  to: 'Da kamen die Prophetenschüler, die in Bethel waren, zu Elisa hinaus und sagten zu ihm: »Weißt du, dass Yahweh heute deinen Meister von dir wegnehmen wird[a]?« Er antwortete: »Auch ich weiß es. Schweigt!«'
  rationale: Die Revision glättet lediglich die Bewegungsformulierung im Deutschen und ersetzt »Lehrer« durch das quellentreuere »Meister«. Aussagegehalt, zeitliche Perspektive, Bildsprache und die bewusste Nichtfestlegung über die Art von Elias Wegnahme bleiben unverändert.
