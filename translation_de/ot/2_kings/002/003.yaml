  source_fidelity: 'Die Übersetzung gibt die wesentlichen hebräischen Aussagen zuverlässig wieder: die prophetische Gruppe in Bethel, die gegenwärtige Wissensfrage, den Gottesnamen Yahweh, die bevorstehende Wegnahme Elias, Elisas ausdrückliches Mitwissen und den pluralischen Schweigebefehl. »Lehrer« ist im Kontext vertretbar, doch »Meister« bildet אֲדֹנֶיךָ als persönliche übergeordnete Bezugsperson genauer ab. Die Fußnote erhält zutreffend die hebräische Metapher.'
  naturalness: »Da kamen … zu Elisa heraus« ist im modernen Standarddeutsch syntaktisch möglich, wirkt jedoch wegen der Stellung von »heraus« etwas schwerfällig. »… zu Elisa hinaus« ist in diesem erzählerischen Zusammenhang flüssiger und bewahrt, dass die Gruppe zu ihm heraustrat.
  terminology: »Prophetenschüler« ist eine sachgerechte, etablierte Wiedergabe von בְנֵי הַנְּבִיאִים. »Yahweh« entspricht der vorgegebenen Namenswiedergabe. »Meister« wahrt bei אֲדֹנֶיךָ besser als »Lehrer« sowohl die Lehrer-Schüler-Beziehung als auch die Stellung Elias über Elisa, ohne eine göttliche Anrede nahezulegen.
