    rationale: Das hebräische Wort bezeichnet hier Elisas menschlichen Herrn bzw. übergeordneten Meister. »Meister« bewahrt die Autoritätsdimension, die auch das Bild »über deinem Kopf« trägt, besser als das rein pädagogische »Lehrer«.
