  text: וַ/יֵּצְא֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בֵּֽית אֵל֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: de
  text: 'Da kamen die Prophetenschüler, die in Bethel waren, zu Elisa hinaus und sagten zu ihm: »Weißt du, dass Yahweh heute deinen Meister von dir wegnehmen wird[a]?« Er antwortete: »Auch ich weiß es. Schweigt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deinen Meister von über deinem Kopf wegnehmen«; das Bild bezeichnet die Entfernung dessen, der über Elisa steht.'
    reason: Die Fußnote bewahrt die konkrete hebräische Bildsprache und erklärt zugleich das darin ausgedrückte Autoritäts- beziehungsweise Schülerverhältnis.
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: Prophetenschüler
  rationale: Die hebräische Wendung bezeichnet hier wahrscheinlich Angehörige einer prophetischen Gemeinschaft beziehungsweise Schüler eines Propheten. Das im Deutschen missverständliche wörtliche »Söhne der Propheten« wird daher sinngemäß und knapp wiedergegeben.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: die in Bethel waren
  rationale: Der Relativsatz ordnet die Prophetenschüler ihrem Aufenthaltsort Bethel zu, ohne zwingend Herkunft oder dauerhafte Zugehörigkeit auszudrücken.
- source_word: הֲיָדַעְתָּ
  choice: Weißt du
  rationale: Das hebräische Perfekt bezeichnet hier einen gegenwärtigen Wissensstand; die natürliche deutsche Frage lautet »Weißt du …?«.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹקֵחַ
  choice: wegnehmen wird
  rationale: Das Partizip bezeichnet eine für diesen Tag unmittelbar bevorstehende Handlung. Im deutschen Satz gibt das Futur diese zeitliche Perspektive natürlich wieder.
- source_word: אֲדֹנֶיךָ
  choice: deinen Lehrer
  rationale: Gemeint ist Elia in seiner übergeordneten Beziehung zu Elisa. »Lehrer« erfasst hier das prophetische Schülerverhältnis und vermeidet die mögliche Verwechslung von »Herr« mit einer Gottesbezeichnung.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: von dir
  rationale: Wörtlich steht »von über deinem Kopf«. Die Wendung bezeichnet die Entfernung dessen, der über Elisa steht; »von dir wegnehmen« gibt den Sinn natürlich wieder, während die Bildsprache in der Fußnote erhalten bleibt.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Auch ich weiß es
  rationale: Die ausdrückliche Partikel גַּם und das Pronomen אֲנִי betonen, dass Elisa dieses Wissen mit den Prophetenschülern teilt.
- source_word: הֶחֱשׁוּ
  choice: Schweigt!
  rationale: Der pluralische Imperativ richtet sich an die Gruppe und verlangt nachdrücklich Stille.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als persönlichen Gottesnamen. Die Transliteration bewahrt diesen Eigenname-Charakter.
- issue: Art der Wegnahme Elias
  choice: nicht näher bestimmt
  alternative: ausdrücklich als Entrückung oder Tod bezeichnet
  rationale: לֹקֵחַ sagt an dieser Stelle lediglich, dass Yahweh Elia wegnehmen wird. Die Übersetzung greift der nachfolgenden Erzählung nicht erklärend vor.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Prophetenschüler« ist für heutige Leser klarer als das wörtliche »Söhne der Propheten«. Direkte Rede und knapper Imperativ bewahren den feierlich-angespannten Erzählton.
