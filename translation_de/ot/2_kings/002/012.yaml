base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: de
  text: 'Elisa sah zu und rief: »Mein Vater, mein Vater! Israels Streitwagen und seine Reiter!«[a] Dann sah er ihn nicht mehr. Da ergriff er seine Kleider und riss sie in zwei Stücke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausruf »Israels Streitwagen und seine Reiter« kann Elia als Israels eigentliche Stärke und Verteidigung bezeichnen; er kann sich aber auch auf die himmlische Wagen-und-Pferde-Erscheinung beziehen, die Elisa sieht.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאֶה
  choice: sah es
  rationale: Das Partizip stellt Elisa als Augenzeugen des Geschehens dar. Im natürlichen deutschen Erzählstil gibt das Präteritum den Vorgang angemessen wieder; das Objekt »es« bleibt allgemein und legt nicht fest, worauf genau sein Blick gerichtet war.
- source_word: מְצַעֵק
  choice: rief
  rationale: Das Partizip bezeichnet den begleitenden, eindringlichen Ausruf. »Rief« ist im deutschen Erzählstil natürlich und bewahrt die emotionale Kraft, ohne unnötig »schreien« zu unterstellen.
- source_word: אָבִי אָבִי
  choice: Mein Vater, mein Vater!
  rationale: Die Wiederholung und das Suffix der ersten Person Singular bleiben erhalten. Die Anrede bezeichnet hier die enge Beziehung zwischen Prophet und Schüler, nicht notwendig biologische Vaterschaft.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Israels Streitwagen und seine Reiter
  rationale: Die singularische Form »Streitwagen« und die pluralischen »Reiter« werden bewahrt. Die exklamatorische Metapher bleibt ungedeutet; »seine« gibt das maskuline Suffix wieder, dessen Bezug im Deutschen ebenfalls offenbleiben kann.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: Dann sah er ihn nicht mehr
  rationale: Die Wendung gibt das Ende des Sehens idiomatisch wieder und lässt den männlichen Objektbezug auf Elia klar hervortreten.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: Da packte er seine Kleider
  rationale: »Packte« vermittelt das entschlossene Ergreifen der eigenen Kleidung. Das Possessivpronomen entspricht dem hebräischen Suffix, ohne eine zusätzliche reflexive Betonung einzuführen.
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: und riss sie in zwei Stücke
  rationale: Die resultative Formulierung wird klar und idiomatisch wiedergegeben und bewahrt die Trauergeste des Zerreißens der Kleider.
theological_decisions:
- issue: Bedeutung des Ausrufs »Mein Vater, mein Vater! Israels Streitwagen und seine Reiter!«
  choice: Der Ausruf wird im Haupttext als unaufgelöste Metapher wiedergegeben.
  alternative: Er kann Elia als Israels eigentliche Stärke und Verteidigung bezeichnen oder auf den himmlischen Streitwagen samt Pferden beziehungsweise Reitern verweisen, den Elisa sieht.
  rationale: Der hebräische Wortlaut erlaubt beide Deutungsrichtungen. Der Haupttext legt sich daher nicht fest; die Fußnote nennt die echte Auslegungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die knappen, emotionalen Sätze und die Wiederholung der Anrede bleiben erhalten. Die Mehrdeutigkeit des prophetischen Ausrufs wird nicht im Haupttext aufgelöst.
