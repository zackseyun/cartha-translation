base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: de
  text: Und während sie weitergingen und miteinander redeten, siehe, da trennten ein Wagen aus Feuer und Pferde aus Feuer die beiden voneinander[b], und Elia stieg durch den Sturmwind[a] in den Himmel hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Sturmwind“ beziehungsweise „mit dem Sturmwind“. Die hebräische Präposition kann das Mittel, die Begleitung oder den Ort des Geschehens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Nach dem Wortlaut trennten der Wagen aus Feuer und die Pferde aus Feuer Elia und Elisa voneinander; Elia stieg durch beziehungsweise im Sturmwind hinauf. Der Text sagt nicht ausdrücklich, dass Elia im Wagen fuhr.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  choice: Und während sie weitergingen und miteinander redeten
  rationale: Die Konstruktion schildert zwei andauernde, gleichzeitige Handlungen. „Weitergingen“ gibt die durative Verstärkung von הֹלְכִים הָלוֹךְ in natürlichem Deutsch wieder; „miteinander redeten“ macht den im Zusammenhang erkennbaren wechselseitigen Vorgang idiomatisch deutlich.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: „Siehe“ bewahrt den aufmerksamkeitslenkenden, dramatischen Erzählton von הִנֵּה; das ergänzende „da“ bindet die Erscheinung natürlich in den deutschen Satz ein, ohne bloß „plötzlich“ hineinzudeuten.
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: ein Wagen aus Feuer und Pferde aus Feuer
  rationale: Die Wiedergabe mit „aus Feuer“ hält die hebräischen Genitivverbindungen parallel und lässt offen, ob Feuer Material, Erscheinungsform oder übernatürliche Eigenschaft bezeichnet.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: trennten die beiden voneinander
  rationale: Der Plural bezieht sich natürlich auf Wagen und Pferde zusammen. „Die beiden“ bewahrt die ausdrückliche Zweizahl von שְׁנֵיהֶם und bezeichnet im Kontext Elia und Elisa.
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: Elia stieg … hinauf
  rationale: „Stieg hinauf“ gibt die Aufwärtsbewegung von עלה wieder, ohne anzudeuten, Elia sei im Feuerwagen gefahren.
- source_word: בַּסְעָרָה
  choice: durch den Sturmwind
  rationale: „Durch“ gibt die mögliche instrumentale Bedeutung der Präposition ב wieder; „Sturmwind“ wahrt das stürmische Windgeschehen, ohne es unnötig auf einen modernen meteorologischen Fachbegriff festzulegen.
- source_word: הַשָּׁמָיִם
  choice: zum Himmel
  rationale: „Himmel“ ist hier die natürliche deutsche Entsprechung; „zum“ verbindet sich idiomatisch mit „hinaufsteigen“ und gibt die Zielrichtung der Bewegung wieder.
theological_decisions:
- issue: Ob der Feuerwagen Elia trug oder lediglich Elia und Elisa voneinander trennte
  choice: Der Wagen aus Feuer und die Pferde aus Feuer trennen die beiden; Elia steigt durch den Sturmwind hinauf.
  alternative: Elia fährt im Feuerwagen zum Himmel.
  rationale: Der hebräische Text verbindet Wagen und Pferde ausdrücklich mit der Trennung der beiden Männer, den Aufstieg Elias dagegen mit dem Sturmwind. Die verbreitete Vorstellung einer Fahrt Elias im Feuerwagen wird daher nicht in den Text eingetragen.
- issue: Funktion der Präposition ב in בַּסְעָרָה
  choice: durch den Sturmwind
  alternative: im Sturmwind / mit dem Sturmwind
  rationale: Die Präposition kann Mittel, Begleitung oder räumliche Einbettung bezeichnen. Der Haupttext wählt eine natürliche instrumentale Wiedergabe; die echte Mehrdeutigkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ wurde wegen der dramatischen Hinweisfunktion des hebräischen הִנֵּה beibehalten; ansonsten vermeidet die Fassung altertümliche Erzählformeln. Die konkrete Feuerbildsprache und die Mehrdeutigkeit beim Sturmwind bleiben erhalten.
