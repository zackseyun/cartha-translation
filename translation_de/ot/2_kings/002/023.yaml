base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: de
  text: 'Dann zog er von dort nach Bet-El hinauf. Während er den Weg hinaufging, kamen junge Burschen[a] aus der Stadt. Sie verspotteten ihn und riefen ihm zu: »Geh hinauf, Glatzkopf! Geh hinauf[b], Glatzkopf!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kleine Jungen«, »Knaben« oder »Jugendliche«. Die hebräische Wortgruppe kann junge männliche Personen unterschiedlichen Alters bezeichnen, nicht nur kleine Kinder.'
    reason: lexical_alternative
  - marker: b
    text: Das wiederholte »Geh hinauf« kann einfach ein höhnischer Zuruf sein; möglicherweise spielt es aber auch darauf an, dass Elia hinaufgenommen worden war.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם בֵּית אֵל
  choice: Dann zog er von dort nach Bet-El hinauf
  rationale: Die Erzählfolge des Wayyiqtol wird mit „Dann“ natürlich wiedergegeben. „hinaufziehen“ bewahrt die Bewegungsrichtung von עלה und stellt den Wortklang zur späteren Schmähung her; Bet-El ist die geläufige deutsche Umschrift des Ortsnamens.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: Während er den Weg hinaufging
  rationale: Pronomen und Partizip bezeichnen eine andauernde, gleichzeitig stattfindende Handlung. Die Formulierung ist im Deutschen natürlich und erhält die Wiederholung von עלה.
- source_word: נְעָרִים קְטַנִּים
  choice: junge Burschen
  rationale: נַעַר kann einen Jungen, Heranwachsenden oder jungen Mann bezeichnen; קָטֹן grenzt die Gruppe als jung beziehungsweise klein ein. „junge Burschen“ lässt das Alter offener als „kleine Kinder“, während die Fußnote die Spannweite ausdrücklich nennt.
- source_word: יָצְאוּ מִן הָעִיר
  choice: kamen ... aus der Stadt
  rationale: יצא bezeichnet das Herausgehen beziehungsweise Herauskommen. Aus der Perspektive der Begegnung ist „kamen ... aus der Stadt“ idiomatisches Deutsch.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: Sie verspotteten ihn
  rationale: Der Hitpael von קלס drückt Hohn und Verächtlichmachung aus. „verspotten“ ist präzise, würdig und gegenwärtig verständlich.
- source_word: עֲלֵה
  choice: Geh hinauf
  rationale: Der Imperativ von עלה wird wörtlich wiedergegeben. Dadurch bleiben sowohl die Verbindung zu Elisas Hinaufgehen als auch eine mögliche Anspielung auf Elias Entrückung erhalten.
- source_word: קֵרֵחַ
  choice: Glatzkopf
  rationale: Das substantivisch gebrauchte Adjektiv bedeutet „kahl“ beziehungsweise „Kahlköpfiger“. „Glatzkopf“ gibt den höhnischen Charakter der Anrede in natürlichem Deutsch wieder.
theological_decisions:
- issue: Mögliche Anspielung des wiederholten עֲלֵה auf Elias Entrückung
  choice: Die wörtliche Aufforderung „Geh hinauf“ bleibt im Haupttext stehen; die mögliche Anspielung wird nur in der Fußnote genannt.
  alternative: Die Schmähung deutend als „Verschwinde!“ oder ausdrücklich als „Fahr auch zum Himmel auf!“ wiedergeben.
  rationale: Der hebräische Wortlaut bezeichnet eindeutig ein Hinaufgehen, doch die genaue Absicht der Spötter ist umstritten. Eine deutende Übersetzung würde die vorhandene Mehrdeutigkeit voreilig auflösen.
- issue: Alter und Verantwortlichkeit der נְעָרִים קְטַנִּים
  choice: „junge Burschen“ im Haupttext mit einer Fußnote zur möglichen Altersbandbreite
  alternative: „kleine Jungen“, „Knaben“, „Jugendliche“ oder „junge Männer“
  rationale: Die Wortgruppe bezeichnet junge männliche Personen, legt aber nach hebräischem Sprachgebrauch kein eindeutiges Alter fest. Die Übersetzung soll weder sehr kleine Kinder noch erwachsene Männer als sicher voraussetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede darf als Schmähung schärfer klingen. „Bet-El“ folgt einer im heutigen deutschen Bibelgebrauch verbreiteten Umschrift. Sämtliche Fußnotenmarker stehen an den jeweils erklärten Ausdrücken im Haupttext.
