base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: de
  text: 'Er sagte: „Du hast um etwas Schweres gebeten. Wenn du siehst, wie ich von dir weggenommen werde[a], wird es dir so zuteilwerden; wenn aber nicht, wird es nicht geschehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn du mich siehst, während ich von dir weggenommen werde.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: Du hast um etwas Schweres gebeten
  rationale: Die Verbindung aus dem Hifil von קשׁה und dem Infinitiv שׁאל bezeichnet idiomatisch eine schwer zu erfüllende Bitte. Die deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne zu unterstellen, die Bitte sei ungehörig.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: Wenn du siehst, wie ich von dir weggenommen werde
  rationale: לֻקָּח ist eine passive Form von לקח. „Wie ich … weggenommen werde“ bewahrt sowohl den Vorgangscharakter als auch die nicht ausdrücklich genannte handelnde Instanz.
- source_word: יְהִי לְךָ כֵן
  choice: soll es dir so geschehen
  rationale: Die Wendung bestätigt, dass das Erbetene unter der genannten Bedingung eintreten wird. „Soll es dir so geschehen“ bleibt nah am Hebräischen und klingt zugleich würdevoll und verständlich.
- source_word: וְאִם אַיִן
  choice: wenn aber nicht
  rationale: אַיִן ist hier elliptisch und bezieht sich darauf, dass Elisa die Wegnahme nicht sieht. „Aber“ macht den Gegensatz im Deutschen deutlich.
- source_word: לֹא יִהְיֶה
  choice: wird es nicht geschehen
  rationale: Das unausgesprochene Subjekt ist die Erfüllung der Bitte. Die Formulierung macht diesen Bezug verständlich, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Bedingung für die Erfüllung von Elisas Bitte
  choice: 'Die Aussage bleibt als Bedingung formuliert: Elisa muss Elias Wegnahme sehen.'
  alternative: Die Sichtbarkeit lediglich als bestätigendes Zeichen einer bereits feststehenden Gewährung deuten.
  rationale: Der hebräische Text erklärt nicht ausdrücklich, ob das Sehen Ursache, Voraussetzung oder bestätigendes Zeichen ist. Die Übersetzung bewahrt diese Spannung und fügt keine theologische Erklärung hinzu.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Erzählstil. Die passive Form lässt den Handelnden wie im hebräischen Text unausgesprochen; die Fußnote bewahrt eine mögliche syntaktische Wiedergabe der Konstruktion.
