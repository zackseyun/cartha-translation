id: 2KI.2.4
reference: 2 Kings 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: de
  text: 'Elia sagte zu ihm: »Elisa, bleib doch hier, denn Jahwe hat mich nach Jericho gesandt.« Doch Elisa erwiderte: »So wahr Jahwe lebt und so wahr du lebst: Ich werde dich nicht verlassen.« So kamen sie nach Jericho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: bleib doch
  rationale: ישׁב kann je nach Zusammenhang »sitzen«, »bleiben« oder »verweilen« bedeuten. Hier bittet Elia Elisa, nicht mit ihm weiterzugehen; daher ist »bleib« sachgerecht. Das höflich-bittende נָא wird natürlich mit »doch« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben und damit als Eigenname bewahrt, statt durch einen Titel ersetzt zu werden.
- source_word: שְׁלָחַנִי
  choice: hat mich … gesandt
  rationale: Das Perfekt bezeichnet den bereits erteilten Auftrag, der für Elias gegenwärtigen Weg maßgeblich ist. »Hat … gesandt« gibt diesen Zusammenhang idiomatisch wieder.
- source_word: יְרִיחוֹ
  choice: Jericho
  rationale: Dies ist die im modernen Standarddeutsch übliche Form des Ortsnamens.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Die feste Schwurformel wird im Deutschen mit der geläufigen feierlichen Wendung »So wahr … lebt« wiedergegeben.
- source_word: וְחֵי נַפְשְׁךָ
  choice: und so wahr du lebst
  rationale: נפשׁ bezeichnet in dieser Schwurformel die Person beziehungsweise ihr Leben, nicht eigens eine immaterielle Seele. Die Wiedergabe wahrt den Parallelismus und klingt natürlich.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: Ich werde dich nicht verlassen
  rationale: 'אִם steht in einer verkürzten Schwurformel und drückt sinngemäß eine nachdrückliche Verneinung aus: »Wenn ich dich verlasse …« bedeutet »Ich werde dich gewiss nicht verlassen.« Die deutsche Fassung macht die implizite Verneinung verständlich.'
- source_word: וַיָּבֹאוּ
  choice: So kamen sie
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter und bezeichnet die Folge ihres Entschlusses. »So« stellt diesen Zusammenhang knapp und natürlich her.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. »Jahwe« bewahrt ihn als persönlichen Namen und ersetzt ihn nicht durch den Titel »der HERR«.
- issue: Bedeutung von נפשׁ in der Schwurformel
  choice: so wahr du lebst
  alternative: so wahr deine Seele lebt
  rationale: Im vorliegenden idiomatischen Zusammenhang bezieht sich נפשׁ auf das Leben beziehungsweise die ganze Person. Die Übersetzung vermeidet eine unnötige anthropologische Festlegung auf eine vom Körper getrennte Seele.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die wörtliche Schwurstruktur bleibt erkennbar, wird aber idiomatisch formuliert. »Doch« gibt in beiden Redeeinleitungen die Spannung zwischen Elias Aufforderung und Elisas entschiedener Antwort wieder.
