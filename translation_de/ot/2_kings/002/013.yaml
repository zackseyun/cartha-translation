base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/013.yaml
  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: de
  text: Er hob Elijas Mantel[a] auf, der von ihm herabgefallen war, kehrte zurück und stand am Ufer des Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Umhang“. Das hebräische Wort bezeichnet ein auffälliges Obergewand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: hob … auf
  rationale: רום bezeichnet ein Heben oder Aufnehmen; bei einem am Boden liegenden Kleidungsstück ist „aufheben“ im Deutschen natürlich und konkret.
- source_word: אַדֶּרֶת
  choice: Mantel
  rationale: אַדֶּרֶת bezeichnet hier ein markantes Obergewand. „Mantel“ ist allgemein verständlich und bewahrt die konkrete Bedeutung; „Umhang“ ist ebenfalls möglich.
- source_word: אֵלִיָּהוּ
  choice: Elija
  rationale: Der Personenname wird nach gängiger moderner deutscher Bibelkonvention wiedergegeben.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: der von ihm herabgefallen war
  rationale: Das Plusquamperfekt macht natürlich deutlich, dass der Mantel zuvor von Elija gefallen war; „von ihm herab“ gibt מֵעָלָיו anschaulich wieder.
- source_word: וַיָּשָׁב
  choice: Dann kehrte er zurück
  rationale: שׁוב bedeutet zurückkehren oder umkehren. „Dann“ verdeutlicht im Deutschen die hebräische Erzählfolge, ohne zusätzliche Sachinformation einzuführen.
- source_word: וַיַּעֲמֹד
  choice: trat … ans
  rationale: Wörtlich bedeutet das Verb „stand/stellte sich hin“. Im Zusammenhang ist „trat ans Ufer“ eine natürliche deutsche Wiedergabe des Erreichens und Einnehmens der Position.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: ans Ufer des Jordan
  rationale: שׂפה bezeichnet den Rand beziehungsweise das Ufer. „Ufer des Jordan“ ist idiomatisches Standarddeutsch.
