  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: de
  text: So wurde das Wasser geheilt und ist es bis zum heutigen Tag geblieben, entsprechend dem Wort, das Elisa gesprochen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wiederhergestellt“ oder „wieder genießbar geworden“. Das hebräische Verb ist das gewöhnliche Wort für „heilen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: blieb … geheilt
  rationale: Das Verb רפא bedeutet gewöhnlich „heilen“. In Verbindung mit Wasser bezeichnet es dessen Wiederherstellung zu einem gesunden, brauchbaren Zustand. „Geheilt“ bewahrt das hebräische Bild; „blieb“ gibt im Deutschen zusammen mit „bis zum heutigen Tag“ natürlich den fortdauernden Zustand wieder.
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: מַיִם hat im Hebräischen eine grammatisch plurale Form, wird im modernen Standarddeutsch jedoch idiomatisch als singularisches Massennomen „Wasser“ wiedergegeben.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die feste Wendung bezeichnet das Fortbestehen des Zustands bis in die Gegenwart des Erzählers.
- source_word: כִּדְבַר
  choice: entsprechend dem Wort
  rationale: דבר verweist konkret auf Elisas vorausgehenden Ausspruch. „Wort“ erhält die enge Verbindung zwischen prophetischer Rede und ihrem Eintreffen.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Gebräuchliche deutsche Namensform.
- source_word: אֲשֶׁר דִּבֵּר
  choice: das Elisa gesprochen hatte
  rationale: Der Relativsatz bestimmt den vorausgehenden prophetischen Ausspruch. Das Plusquamperfekt verdeutlicht im Deutschen natürlich, dass Elisa zuvor gesprochen hatte.
theological_decisions:
- issue: Heilungssprache für das Wasser
  choice: 'Das Heilungsbild bleibt im Haupttext erhalten: „das Wasser … geheilt“.'
  alternative: „Das Wasser wurde wiederhergestellt“ oder „wurde wieder genießbar“.
  rationale: Das Hebräische verwendet das gewöhnliche Verb für „heilen“. Die bildhafte Formulierung wird bewahrt, ohne die Art der Wiederherstellung näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig und bewahrt zugleich das hebräische Heilungsbild sowie den ausdrücklichen Bezug auf Elisas Wort.
