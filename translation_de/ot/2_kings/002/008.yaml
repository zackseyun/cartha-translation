  terminology: „Mantel“ ist für אַדֶּרֶת eine sachgerechte und verständliche Wahl; die Fußnote bietet „Obergewand“ als passende Alternative. „Trockenem Boden“ trifft בֶּחָרָבָה im Kontext der Durchquerung präzise. Die Fußnote zu הֵנָּה וָהֵנָּה wahrt die wörtlichere räumliche Ausdrucksweise, während der Haupttext deren Sinn klar vermittelt.
