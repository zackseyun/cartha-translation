source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֵלִיָּ֨הוּ אֶת אַדַּרְתּ֤/וֹ וַ/יִּגְלֹם֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֵּחָצ֖וּ הֵ֣נָּה וָ/הֵ֑נָּה וַ/יַּעַבְר֥וּ שְׁנֵי/הֶ֖ם בֶּ/חָרָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: de
  text: Da nahm Elia seinen Mantel[a], rollte ihn zusammen und schlug damit auf das Wasser. Da teilte es sich nach beiden Seiten[b], sodass die beiden auf trockenem Boden hinübergingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Obergewand“. Das hebräische Wort bezeichnet Elias äußeres Kleidungsstück.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „hierhin und dorthin“, das heißt, nach entgegengesetzten Seiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: seinen Mantel
  rationale: אַדֶּרֶת bezeichnet hier Elias markantes Obergewand. „Mantel“ ist im modernen Deutschen natürlich, würdevoll und passt zu der beschriebenen Handlung.
- source_word: וַיִּגְלֹם
  choice: rollte ihn zusammen
  rationale: Das Verb beschreibt hier das Zusammenrollen oder Zusammenwickeln des Mantels. „Rollte ihn zusammen“ gibt die körperliche Handlung klar wieder.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: schlug damit auf das Wasser
  rationale: נכה bedeutet „schlagen“. Das ergänzte „damit“ macht den im Kontext eindeutigen instrumentalen Bezug auf den Mantel im Deutschen natürlich, ohne die Handlung auszudeuten.
- source_word: וַיֵּחָצוּ
  choice: da teilte es sich
  rationale: Die hebräische Pluralform bezieht sich auf das Wasser beziehungsweise die Wassermassen. Im Deutschen ist der Singular „das Wasser“ idiomatisch; die reflexive Form bewahrt den beschriebenen Vorgang, ohne seine Wunderhaftigkeit abzuschwächen.
- source_word: הֵנָּה וָהֵנָּה
  choice: nach beiden Seiten
  rationale: Die Wendung bezeichnet die Trennung in entgegengesetzte Richtungen. „Nach beiden Seiten“ ist klarer als das im Deutschen räumlich unbestimmte „hierhin und dorthin“.
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: die beiden ... hinübergingen
  rationale: „Die beiden“ bewahrt die ausdrückliche Betonung von שְׁנֵיהֶם und ergibt zusammen mit „hinübergingen“ einen natürlichen deutschen Satz.
- source_word: בֶּחָרָבָה
  choice: auf trockenem Boden
  rationale: חָרָבָה bezeichnet in diesem Zusammenhang den trockenen Grund, der nach der Teilung des Wassers begehbar ist. Die Formulierung ist klar und stellt zugleich den Bezug zu biblischen Durchzugserzählungen nicht künstlich heraus.
- source_word: וַיִּקַּח
  choice: Da nahm Elia
  rationale: Das narrative וַ führt die Handlung fort. „Da“ vermittelt die zeitliche Abfolge in einem natürlichen, zugleich erzählerisch-würdigen Deutsch.
theological_decisions:
- issue: Wunderbare Teilung des Wassers
  choice: Das Geschehen wird ohne Naturalisierung als tatsächliche Teilung des Wassers erzählt.
  alternative: Eine abschwächende oder rein bildhafte Wiedergabe der Szene.
  rationale: Der hebräische Text beschreibt unmittelbar, dass Elia auf das Wasser schlägt, es sich teilt und beide auf trockenem Boden hinübergehen. Die Übersetzung bewahrt diese Aussage, ohne zusätzliche theologische Deutung oder Ausschmückung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Hauptsätze folgen dem Fortgang des hebräischen Berichts. Die Fußnoten bewahren sowohl die lexikalische Alternative bei אַדֶּרֶת als auch die bildhafte Raumangabe הֵנָּה וָהֵנָּה.
