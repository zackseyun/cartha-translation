source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: de
  text: 'Dann nahm er den Mantel Elijas, der Elija entfallen war, schlug auf das Wasser und sagte: »Wo ist Jahwe, der Gott Elijas?« Auch er[a] schlug auf das Wasser. Da teilte es sich nach beiden Seiten, und Elisa ging hindurch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe hebräische Wendung kann auch noch zur vorausgehenden Frage gehören. Ihr genauer Sinn ist umstritten; sie kann die Frage nach Jahwes Gegenwart oder Handeln nachdrücklich zuspitzen.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: Mantel
  rationale: Das Wort bezeichnet Elijas markantes Obergewand. »Mantel« ist im heutigen Deutsch konkret, verständlich und weniger altertümlich als »Prophetenmantel«; eine Deutung als besonderes Amtszeichen wird nicht in den Text eingetragen.
- source_word: נָפְלָה מֵעָלָיו
  choice: der Elija entfallen war
  rationale: Der Relativsatz blickt auf den zuvor von Elija herabgefallenen Mantel zurück. Die Wiederholung des Namens vermeidet im Deutschen eine unklare Zuordnung des Pronomens.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: schlug auf das Wasser
  rationale: Die Wendung gibt נכה in der konkreten Handlung natürlich wieder. Das im Hebräischen formal plurale מַיִם wird nach deutschem Sprachgebrauch als Singular »Wasser« wiedergegeben.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Die direkte Frage nach Ort beziehungsweise Gegenwart bleibt erhalten, ohne sie als Bitte um ein Wunder auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: der Gott Elijas
  rationale: Die hebräische Genitivverbindung wird transparent und in natürlichem Deutsch wiedergegeben.
- source_word: אַף הוּא
  choice: Auch er
  rationale: Die knappe emphatische Wendung wird entsprechend der masoretischen Satzgliederung mit der folgenden Handlung verbunden. Ihre mögliche Zuordnung zum vorausgehenden Ruf wird in einer Fußnote bewahrt.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: Da teilte es sich nach beiden Seiten
  rationale: Die Richtungsformel beschreibt das Auseinanderweichen des Wassers. Die deutsche Singularform stimmt mit »Wasser« überein und gibt das Ergebnis anschaulich wieder.
- source_word: וַיַּעֲבֹר
  choice: ging hindurch
  rationale: Im Kontext des geteilten Wassers bezeichnet das Verb Elisas Überquerung; »ging hindurch« ist klar und vermeidet das missverständliche »ging hinüber« ohne genanntes Ziel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als Eigenname wahrt diese Form, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Zuordnung der knappen Wendung אַף הוּא
  choice: Als »Auch er« mit Elisas erneutem Schlagen verbunden
  alternative: 'Mit Elisas Frage verbunden: »Wo ist Jahwe, der Gott Elijas — ja, er?« beziehungsweise sinngemäß »Wo ist er nun?«'
  rationale: Die masoretische Gliederung setzt nach »Elija« einen starken Einschnitt und begünstigt die Verbindung mit der folgenden Handlung. Da die hebräische Formulierung ungewöhnlich knapp und umstritten ist, nennt die Fußnote die andere mögliche Zuordnung, ohne die theologische Spannung über Gottes Gegenwart aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die Wiederholung »schlug auf das Wasser« folgt bewusst dem hebräischen Text. Der Gottesname erscheint als »Jahwe«. Die schwer verständliche Wendung אַף הוּא bleibt im Haupttext knapp; ihre syntaktische und inhaltliche Mehrdeutigkeit wird in der Fußnote offengehalten.
