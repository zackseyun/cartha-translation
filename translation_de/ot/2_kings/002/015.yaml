  edition: WLC
  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: de
  text: 'Als die Prophetenschüler, die in Jericho waren, ihn von gegenüber sahen, sagten sie: »Der Geist Elijas ruht auf Elisa.« Dann gingen sie ihm entgegen und warfen sich vor ihm bis zur Erde nieder.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Niederwerfen ist hier eine Geste der Ehrerbietung und Unterordnung; es muss nicht Anbetung bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: Prophetenschüler
  rationale: Die hebräische Wendung bezeichnet hier eine Gemeinschaft von Männern, die zu einem Prophetenkreis gehören; die wörtliche Form »Prophetensöhne« wäre im heutigen Deutsch leicht als leibliche Abstammung missverständlich.
- source_word: מִנֶּגֶד
  choice: von gegenüber
  rationale: Bewahrt den räumlichen Sinn einer gegenüberliegenden, sichtbaren Position; bloß »aus der Ferne« würde die Gegenüberstellung abschwächen.
- source_word: נָחָה רוּחַ אֵלִיָּהוּ עַל אֱלִישָׁע
  choice: Der Geist Elijas ruht auf Elisa
  rationale: Gibt Konstruktion, Aspekt und Bild des Hebräischen eng wieder, ohne die genaue Art des Geistes im Haupttext festzulegen.
- source_word: לִקְרָאתוֹ
  choice: gingen sie ihm entgegen
  rationale: Die deutsche Wendung bildet die zielgerichtete Bewegung zum Zusammentreffen natürlich ab.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: warfen sich vor ihm bis zur Erde nieder
  rationale: Gibt die körperlich intensive Geste einschließlich der Richtungsangabe אָרְצָה wieder, ohne sie ausdrücklich als Anbetung zu deuten.
theological_decisions:
- issue: Bedeutung von »der Geist Elijas«
  choice: Die Formulierung bleibt wörtlich als »der Geist Elijas« stehen und bezeichnet im Kontext Elijas prophetische Befähigung bzw. Wirksamkeit auf Elisa.
  alternative: Übertragung von Elijas persönlicher Seele oder Identität auf Elisa.
  rationale: Der Zusammenhang mit 2 Könige 2,9 und der Anerkennung Elisas als Nachfolger spricht für prophetische Befähigung; die Übersetzung selbst wahrt jedoch die knappe Formulierung des Hebräischen.
- issue: Bedeutung des Niederwerfens vor Elisa
  choice: Eine leibliche Ehren- und Unterordnungsgeste gegenüber Elisa als anerkanntem prophetischem Nachfolger.
  alternative: Göttliche Anbetung Elisas.
  rationale: Das hebräische Verb kann je nach Gegenstand Ehrbezeugung oder Anbetung bezeichnen. Da die Geste hier einem Menschen gilt, darf die Übersetzung nicht ohne Weiteres göttliche Verehrung hineinlesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Prophetenschüler« vermeidet das im Deutschen missverständliche »Prophetensöhne«. »Von gegenüber« erhält die räumliche Nuance von מִנֶּגֶד. Die Namen folgen den geläufigen deutschen Formen Elija und Elisa.
