source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: de
  text: 'Da sagte Elia zu ihm: »Bleib doch hier, denn Jahwe hat mich an den Jordan gesandt.[a]« Doch Elisa sagte: »So wahr Jahwe lebt und so wahr du lebst:[b] Ich werde dich nicht verlassen!« So gingen die beiden weiter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Jordan« beziehungsweise »zum Jordanfluss«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich lautet die hebräische Schwurformel: »So wahr Jahwe lebt und deine Seele lebt: Wenn ich dich verlasse …« Der unausgesprochene Strafsatz verleiht der Aussage den Sinn: »Ich werde dich ganz gewiss nicht verlassen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: Bleib doch
  rationale: ישׁב bezeichnet hier nicht das Sitzen, sondern das Zurückbleiben an einem Ort. נָא verleiht der Aufforderung einen bittenden Ton, den „doch“ im Deutschen natürlich wiedergibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שְׁלָחַנִי
  choice: hat mich … gesandt
  rationale: Das Perfekt bezeichnet den bereits erteilten Auftrag mit fortdauernder Geltung; das deutsche Perfekt gibt dies im direkten Gespräch natürlich wieder.
- source_word: הַיַּרְדֵּנָה
  choice: an den Jordan
  rationale: Das direktionale ה bezeichnet eine Bewegung zum Jordan hin. „An den Jordan“ ist idiomatisches Deutsch und lässt offen, ob der Fluss oder die Gegend am Fluss im Blick ist.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: So wahr Jahwe lebt und so wahr du lebst
  rationale: Die feste Schwurformel wird in einer verständlichen deutschen Entsprechung bewahrt. נֶפֶשׁ bezeichnet hier die Person beziehungsweise ihr Leben, nicht eine vom Körper getrennte Seele.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: Ich werde dich nicht verlassen!
  rationale: אִם eröffnet in der Schwurformel eine verkürzte Selbstverwünschung. Ihr tatsächlicher Sinn ist eine nachdrückliche Verneinung.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: So gingen die beiden weiter
  rationale: „Die beiden“ bewahrt die ausdrückliche Betonung ihres gemeinsamen Weitergehens; „weiter“ entspricht dem Reiseverlauf im Kontext.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Umschrift „Jahwe“ bewahrt diesen, statt ihn durch den Titel „HERR“ zu ersetzen.
- issue: Verständnis der verkürzten Schwurformel אִם אֶעֶזְבֶךָּ
  choice: 'als nachdrückliche Verneinung: „Ich werde dich nicht verlassen!“'
  alternative: 'wörtlich-formal: „wenn ich dich verlasse …“'
  rationale: Die Bedingung ist eine elliptische Selbstverwünschung, deren Strafsatz unausgesprochen bleibt. Eine unkommentierte wörtliche Wiedergabe würde im Deutschen den gemeinten Schwur verdunkeln; die Fußnote erhält die formale Gestalt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; „Bleib doch“ klingt bittend, ohne altertümlich zu wirken. Der Gottesname wird durchgehend als „Jahwe“ wiedergegeben.
