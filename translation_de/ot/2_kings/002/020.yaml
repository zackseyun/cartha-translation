  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: de
  text: 'Er sagte: „Bringt mir ein neues Gefäß[a] und tut Salz hinein.“ Da brachten sie es ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „eine neue Schale“, „einen neuen Krug“ oder „eine neue Flasche“; das hebräische Wort bezeichnet allgemein ein kleines Behältnis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er sagte
  rationale: Die Wayyiqtol-Form führt Elisas Rede in fortlaufender Erzählung ein. Im natürlichen Deutschen muss die verbindende Konjunktion nicht ausdrücklich wiedergegeben werden.
- source_word: קְחוּ לִי
  choice: Bringt mir
  rationale: לקח bedeutet grundsätzlich „nehmen“, bezeichnet mit לִי in dieser Aufforderung aber idiomatisch das Herbeibringen für den Sprecher.
- source_word: צְלֹחִית
  choice: Gefäß
  rationale: Das seltene Substantiv bezeichnet allgemein ein kleines Behältnis; „Gefäß“ wahrt die im Hebräischen nicht näher festgelegte Form besser als „Schale“, „Krug“ oder „Flasche“.
- source_word: חֲדָשָׁה
  choice: neues
  rationale: Das Adjektiv bedeutet eindeutig „neu“ und stimmt im Deutschen grammatisch mit „Gefäß“ überein.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: und tut Salz hinein
  rationale: שׂים heißt „setzen/legen/tun“, und שָׁם („dort“) verweist hier auf das zuvor genannte Gefäß. „hinein“ gibt diesen Bezug natürlich wieder.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: Da brachten sie es ihm
  rationale: לקח bezeichnet hier kontextuell die Ausführung der Aufforderung, also das Herbeibringen des Gefäßes. Das im Hebräischen implizite Objekt wird im Deutschen als „es“ ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. „Gefäß“ erhält die lexikalische Unbestimmtheit des seltenen hebräischen Behälterwortes; „tut … hinein“ ist verständlich und entspricht dem knappen Imperativstil.
