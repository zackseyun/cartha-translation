base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: de
  text: 'Als sie zu ihm zurückkehrten[a], hielt er sich in Jericho auf. Da sagte er zu ihnen: »Habe ich euch nicht gesagt: ›Geht nicht!‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler: »Und sie kehrten zu ihm zurück; er hielt sich in Jericho auf.«'
    reason: Die hebräische Satzverknüpfung beginnt formal mit „und“; die Hauptfassung gibt das zeitliche Verhältnis im Deutschen flüssiger mit „als“ wieder.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: Als sie zu ihm zurückkehrten
  rationale: שׁוב bedeutet hier „zurückkehren“. Das einleitende וַ wird zusammen mit dem folgenden Umstandssatz als zeitliche Verknüpfung wiedergegeben; der männliche Singular in „ihm“ verweist im Kontext auf Elisa.
- source_word: וְהוּא יֹשֵׁב בִּירִיחוֹ
  choice: hielt er sich in Jericho auf
  rationale: Das Partizip von ישׁב kann „sitzen“, „bleiben“, „wohnen“ oder „sich aufhalten“ bedeuten. Hier hebt der Satz hervor, dass Elisa während ihrer Suche weiterhin in Jericho war; „hielt er sich … auf“ ist dafür natürlich und bewahrt die situationsbezogene Bedeutung.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Da sagte er zu ihnen
  rationale: אמר ist das gewöhnliche Verb für „sagen“. „Da“ führt die nächste Handlung der Erzählung idiomatisch fort.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: Habe ich euch nicht gesagt
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet und hier einen zurechtweisenden Unterton trägt. Die deutsche Formulierung gibt dies unmittelbar wieder.
- source_word: אַל תֵּלֵכוּ
  choice: Geht nicht!
  rationale: אַל mit der Präfixkonjugation drückt ein Verbot aus. Der verneinte Imperativ ist im Deutschen knapp, klar und der direkten Rede angemessen.
