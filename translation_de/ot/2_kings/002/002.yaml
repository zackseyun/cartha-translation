base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: de
  text: 'Und Elia sagte zu Elisa: „Bleib bitte hier, denn Jahwe hat mich bis nach Bethel gesandt.“[a] Doch Elisa sagte: „So wahr Jahwe lebt und so wahr du lebst: Ich werde dich nicht verlassen.“[b] Da gingen sie nach Bethel hinab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „bis nach Bethel“; gemeint sein kann auch schlicht: „nach Bethel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Eidesformel lautet wörtlich: „So wahr Jahwe lebt und so wahr dein Leben lebt: Wenn ich dich verlasse …!“ Damit wird nachdrücklich zugesichert: „Ich werde dich nicht verlassen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: Bleib bitte hier
  rationale: ישׁב kann „sitzen“, „bleiben“ oder „sich aufhalten“ bedeuten. Im Zusammenhang bittet Elia Elisa, ihn nicht weiter zu begleiten; „Bleib bitte hier“ gibt daher Sinn und Höflichkeitspartikel נָא natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Charakter des Tetragramms als Namen statt es durch einen Titel zu ersetzen.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: hat mich bis nach Bethel gesandt
  rationale: עַד bezeichnet häufig den erreichten Endpunkt („bis zu/bis nach“). Die Formulierung bewahrt diese Wegnuance und ist im Deutschen idiomatisch.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: So wahr Jahwe lebt und so wahr du lebst
  rationale: Die geläufige deutsche Eidesformel gibt die feierliche Bekräftigung wieder. נֶפֶשׁ bezeichnet hier die lebende Person und nicht ausdrücklich eine vom Körper getrennte „Seele“.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: Ich werde dich nicht verlassen
  rationale: 'Nach einer Eidesformel leitet אִם eine verkürzte Selbstverwünschung ein: wörtlich „wenn ich dich verlasse …“, sinngemäß eine nachdrückliche Verneinung.'
- source_word: וַיֵּרְדוּ
  choice: Da gingen sie … hinab
  rationale: Die Wiedergabe erhält die Richtungsbedeutung von ירד („hinabgehen“); „da“ führt knapp die erzählerische Folge fort.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt im modernen Deutschen den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung von נֶפֶשׁ in der Eidesformel
  choice: so wahr du lebst
  alternative: so wahr deine Seele lebt
  rationale: In dieser festen Wendung steht נֶפֶשׁ für das Leben beziehungsweise die Person des Angeredeten. Die Übersetzung vermeidet eine hier nicht geforderte anthropologische Festlegung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede bleibt natürlich und feierlich; „gesandt“ trägt den biblisch-gehobenen Ton, ohne altertümlich zu wirken. Die Ortsbewegung und die bewusst verkürzte hebräische Eidesformel werden im Haupttext verständlich wiedergegeben und in den Fußnoten transparent gemacht.
