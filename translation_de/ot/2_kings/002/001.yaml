id: 2KI.2.1
reference: 2 Kings 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: de
  text: Als Jahwe im Begriff war, Elia in einem Sturmwind[a] zum Himmel[b] hinaufzunehmen, gingen Elia und Elisa von Gilgal weiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einem Wirbelsturm“; auch: „durch einen Sturmwind“.'
    reason: Das hebräische סְעָרָה kann Sturm, Sturmwind oder Wirbelsturm bedeuten; außerdem lässt die Präposition sowohl eine räumlich-begleitende als auch eine instrumentale Wiedergabe zu.
  - marker: b
    text: 'Wörtlich: „zu den Himmeln“.'
    reason: Das hebräische הַשָּׁמָיִם ist formal pluralisch, wird in diesem Zusammenhang im Deutschen jedoch natürlich mit „Himmel“ wiedergegeben.
lexical_decisions:
- source_word: וַיְהִי
  choice: Als …,
  rationale: Die hebräische Eröffnungsformel führt zusammen mit dem folgenden Infinitivsatz den zeitlichen Rahmen der neuen Szene ein. Im modernen Deutschen wird diese Funktion natürlich durch den vorangestellten Als-Satz wiedergegeben, ohne die altertümliche Formel „Und es geschah“.
- source_word: בְּהַעֲלוֹת
  choice: hinaufnehmen wollte
  rationale: Der Infinitiv von עלה mit בְּ bezeichnet den zeitlichen Umstand. „Hinaufnehmen“ bewahrt die ausdrücklich genannte Aufwärtsbewegung; „wollte“ gibt hier im Zusammenhang die unmittelbar bevorstehende, von Jahwe beabsichtigte Handlung idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen etablierten Form wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: בַּסְעָרָה
  choice: in einem Sturmwind
  rationale: סְעָרָה bezeichnet einen Sturm, Sturmwind oder Wirbelsturm. „Sturmwind“ lässt die Art des Geschehens offen, ohne stärker als der hebräische Ausdruck ein eng umrissenes meteorologisches Bild festzulegen.
- source_word: הַשָּׁמָיִם
  choice: zum Himmel
  rationale: Die formal plurale hebräische Bezeichnung meint hier das himmelwärts gerichtete Ziel. Der Singular „Himmel“ ist in diesem Zusammenhang natürliches Deutsch; die formale Mehrzahl wird in einer Fußnote kenntlich gemacht.
- source_word: וַיֵּלֶךְ
  choice: zogen … weiter
  rationale: הלך bezeichnet hier die Fortsetzung einer Reise. „Weiterziehen“ gibt diese Bewegung im erzählerischen Zusammenhang natürlicher wieder als das bloße „gehen“.
- source_word: מִן הַגִּלְגָּל
  choice: von Gilgal
  rationale: מִן kennzeichnet den Ausgangspunkt; „von Gilgal“ ist die direkte und idiomatische Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הַשָּׁמַיִם
  choice: zum Himmel
  alternative: zu den Himmeln
  rationale: Der hebräische Ausdruck steht formal im Plural, kann aber Himmel beziehungsweise Himmelsraum bezeichnen. Der deutsche Singular ist hier idiomatisch und entscheidet keine kosmologische oder lehrmäßige Frage.
- issue: Zeitlicher beziehungsweise prospektiver Sinn von בְּהַעֲלוֹת
  choice: hinaufnehmen wollte
  alternative: hinaufnahm; im Begriff war, hinaufzunehmen
  rationale: Der Vers eröffnet die Erzählung vor dem Vollzug der Aufnahme. Die gewählte Formulierung bringt die bevorstehende, beabsichtigte Handlung natürlich zum Ausdruck, ohne zu behaupten, sie sei in diesem Satz bereits abgeschlossen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Szeneneröffnungsformel ist in einen natürlichen deutschen Temporalsatz überführt. Die Eigennamen folgen den gebräuchlichen deutschen Formen Elia, Elisa und Gilgal; der Gottesname erscheint als Jahwe.
