source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל אֱלִישָׁ֔ע הִנֵּה נָ֞א מוֹשַׁ֤ב הָ/עִיר֙ ט֔וֹב כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י רֹאֶ֑ה וְ/הַ/מַּ֥יִם רָעִ֖ים וְ/הָ/אָ֥רֶץ מְשַׁכָּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: de
  text: 'Da sagten die Männer der Stadt zu Elisa: »Sieh doch, die Lage der Stadt ist gut, wie mein Herr sieht. Aber das Wasser ist schlecht, und das Land verursacht Fehlgeburten[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und das Land ist unfruchtbar.« Das hebräische Wort kann den Verlust von Nachwuchs bezeichnen und sich in diesem Zusammenhang möglicherweise auch auf landwirtschaftliche Unfruchtbarkeit beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das narrative Wayyiqtol führt die Handlung fort; »Da« gibt die zeitlich-fortschreitende Erzählbewegung natürlich wieder.
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: Die ausdrücklich maskuline Konstruktverbindung wird genau wiedergegeben, ohne sie zu »Einwohner« oder »Leute« zu neutralisieren.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: »Sieh« bewahrt die hinweisende Aufforderung, während »doch« die höflich-mildernde Funktion von נָא in natürlichem Deutsch ausdrückt.
- source_word: מוֹשַׁב הָעִיר
  choice: die Lage der Stadt
  rationale: מוֹשָׁב bezeichnet hier den Standort beziehungsweise die örtliche Lage der Stadt; »Lage« ist knapp, gegenwärtig und kontextgerecht.
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: wie mein Herr selbst sieht
  rationale: »Mein Herr« wahrt die respektvolle soziale Anrede an Elisa; »selbst« macht den Bezug auf seine eigene Wahrnehmung im Deutschen natürlich deutlich, ohne den Sinn zu erweitern.
- source_word: וְהַמַּיִם רָעִים
  choice: Aber das Wasser ist schlecht
  rationale: Das Waw ist wegen des Gegensatzes zur guten Lage adversativ wiedergegeben. Der deutsche Singular »Wasser« bezeichnet idiomatisch die Wasserversorgung.
- source_word: וְהָאָרֶץ מְשַׁכָּלֶת
  choice: und das Land verursacht Fehlgeburten
  rationale: Die Piel-Form von שׁכל hat eine verursachende Bedeutung und bezeichnet den Verlust von Nachwuchs. Die konkrete Wiedergabe wahrt diese auffällige Aussage; eine mögliche Ausweitung auf Unfruchtbarkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von אֲדֹנִי als Anrede an Elisa
  choice: mein Herr
  alternative: mein Gebieter / mein Meister
  rationale: Hier liegt eine respektvolle menschliche Anrede vor, kein Gottesname oder göttlicher Titel. »Mein Herr« bewahrt den sozialen Rang und die Höflichkeit.
- issue: Reichweite von מְשַׁכָּלֶת
  choice: verursacht Fehlgeburten
  alternative: ist unfruchtbar
  rationale: Die konkrete kausative Bedeutung soll nicht vorschnell in allgemeine landwirtschaftliche Unfruchtbarkeit aufgelöst werden. Da der Kontext eine weitere Reichweite zulassen kann, bleibt diese in der Fußnote offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich, ohne altertümliches »siehe«; »mein Herr« bewahrt die respektvolle Anrede.
