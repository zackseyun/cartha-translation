base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: de
  text: Er wandte sich um, sah sie an und verfluchte sie im Namen des HERRN. Da kamen zwei Bärinnen aus dem Wald und rissen zweiundvierzig von den Kindern auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text sagt nicht ausdrücklich, dass die zweiundvierzig Kinder starben.
    reason: Die Anmerkung bewahrt die im Ausgangstext bestehende Unbestimmtheit über die Todesfolge, während der Haupttext die gewaltsame Bedeutung des Verbs direkt wiedergibt.
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: verfluchte sie
  rationale: Das Verb קלל bezeichnet hier ausdrücklich das Aussprechen eines Fluches; die Wendung bewahrt die Härte und den theologischen Ernst des Ausgangstextes.
- source_word: דֻבִּים
  choice: Bärinnen
  rationale: Die feminine Pluralform bezeichnet zwei weibliche Bären.
- source_word: וַתְבַקַּעְנָה
  choice: verletzten … schwer
  rationale: בקע bedeutet wörtlich „aufspalten/aufreißen“. Im Kontext bezeichnet es einen gewaltsamen Angriff mit schweren Verletzungen, ohne ausdrücklich zu sagen, dass alle Betroffenen starben.
- source_word: יְלָדִים
  choice: Kinder
  rationale: ילדים ist altersmäßig nicht völlig präzise und kann Kinder beziehungsweise junge Menschen bezeichnen. Der unmittelbare Kontext verwendet jedoch eine Bezeichnung für kleine/junge Knaben; „Kinder“ gibt dies natürlich wieder.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen des HERRN
  rationale: Die traditionelle deutsche Wiedergabe „HERR“ kennzeichnet den Gottesnamen JHWH und bewahrt zugleich die feste biblische Ausdrucksweise.
theological_decisions:
- issue: Charakter und Wirkung des Fluches
  choice: „verfluchte sie im Namen des HERRN“
  alternative: „sprach im Namen des HERRN einen Fluch über sie aus“
  rationale: Die knappe Form folgt der Syntax des Hebräischen und lässt offen, wie genau der Fluch und der anschließende Angriff kausal zueinander stehen.
- issue: Schicksal der zweiundvierzig Betroffenen
  choice: schwer verletzt, nicht ausdrücklich getötet
  alternative: „zerrissen“ oder „töteten“
  rationale: Der Text nennt eine gewaltsame Verwundung beziehungsweise ein Aufreißen, behauptet aber nicht ausdrücklich den Tod aller zweiundvierzig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am hebräischen Erzählstil; „HERR“ steht in Kapitälchenkonvention für den Gottesnamen JHWH.
