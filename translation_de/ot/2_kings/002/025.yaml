  text: Von dort ging er zum Berg Karmel, und von dort kehrte er nach Samaria zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging er
  rationale: Das Wayyiqtol führt die Erzählung mit einer einfachen Vergangenheitsform fort; das deutsche Präteritum ist hier natürlich.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die Wendung bezeichnet die Bewegung weg vom zuvor genannten Ort und wird im Deutschen klar und quellennah wiedergegeben.
- source_word: אֶל
  choice: zum
  rationale: Die Präposition bezeichnet die Richtung auf ein Ziel; zusammen mit dem bestimmten Ortsnamen ist „zum“ idiomatisch.
- source_word: הַר הַכַּרְמֶל
  choice: Karmelberg
  rationale: Die Verbindung bezeichnet den Berg Karmel. „Karmelberg“ ist eine gebräuchliche und eindeutige deutsche Wiedergabe des geografischen Namens.
- source_word: וּמִשָּׁם
  choice: und von dort
  rationale: Die Wiedergabe bewahrt sowohl die fortführende Konjunktion als auch die bewusste Wiederholung des Ortsadverbs.
- source_word: שָׁב
  choice: kehrte er … zurück
  rationale: שׁוב bezeichnet in diesem Reisebericht die Rückkehr; „zurückkehren“ ist präzise und in gehobener moderner Erzählsprache natürlich.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: „Samaria“ ist die etablierte deutsche Namensform. Im Kontext ist die Stadt gemeint.
