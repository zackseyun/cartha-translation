  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: de
  text: 'Da traten die Prophetensöhne[a], die in Jericho waren, an Elisa heran und sagten zu ihm: »Weißt du, dass Jahwe dir heute deinen Herrn von über deinem Kopf wegnehmen wird[b]?« Er antwortete: »Auch ich weiß es. Schweigt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Söhne der Propheten«; gemeint sind wahrscheinlich Angehörige einer Prophetengemeinschaft oder Prophetenjünger.
    reason: Erläuterung einer hebräischen Gruppenbezeichnung, die im Deutschen leicht als leibliche Abstammung missverstanden werden kann.
  - marker: b
    text: 'Oder: »ihn aus seiner Stellung über dir wegnehmen«. Wörtlich steht im Hebräischen »von über deinem Kopf«; das Bild kann die Entfernung eines Menschen bezeichnen, der über einem anderen steht.'
    reason: Bewahrt die konkrete hebräische Formulierung und nennt zugleich ihre wahrscheinliche idiomatische Bedeutung, ohne diese im Haupttext festzuschreiben.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: traten … heran
  rationale: נגשׁ bezeichnet das Herantreten oder Sichnähern. „An Elisa herantreten“ ist im Deutschen natürlich und bewahrt die gerichtete Bewegung.
- source_word: בְנֵי הַנְּבִיאִים
  choice: Prophetensöhne
  rationale: Die wörtlich-nahe Wiedergabe bewahrt die hebräische Gruppenbezeichnung, ohne sie im Haupttext eindeutig als Schule, Zunft oder leibliche Abstammung auszulegen. Eine Fußnote erläutert den wahrscheinlichen Sinn.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: die in Jericho waren
  rationale: Der Relativsatz kennzeichnet die in Jericho befindliche Prophetengruppe.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: הֲיָדַעְתָּ
  choice: Weißt du
  rationale: Das hebräische Perfekt fragt hier nach gegenwärtigem Wissen; das deutsche Präsens gibt dies idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹקֵחַ
  choice: wegnehmen wird
  rationale: Das Partizip bezeichnet im Zusammenhang eine unmittelbar bevorstehende Handlung. Die deutsche Futurform macht diese zeitliche Nähe zusammen mit „heute“ klar.
- source_word: אֲדֹנֶיךָ
  choice: deinen Herrn
  rationale: אָדוֹן bezeichnet hier Elia als den Elisal übergeordneten Herrn. „Herr“ entspricht dem Beziehungsbegriff, ohne ihn auf die Rolle eines Lehrers einzuengen.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: von über deinem Kopf
  rationale: Die konkrete und ungewöhnliche Bildsprache des Hebräischen bleibt erhalten. Der wahrscheinlich gemeinte Entzug einer übergeordneten Autorität wird in der Fußnote erläutert, nicht in den Haupttext eingetragen.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Auch ich weiß es
  rationale: Die Formulierung bewahrt sowohl die additive Partikel גַּם als auch das betonte Pronomen אֲנִי in natürlichem Deutsch.
- source_word: הֶחֱשׁוּ
  choice: Schweigt!
  rationale: Der knappe Imperativ Plural fordert die ganze Gruppe zum Schweigen auf und erhält die Schärfe der Antwort.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Transliteration „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von מֵעַל רֹאשֶׁךָ
  choice: Das konkrete Bild „von über deinem Kopf“ im Haupttext bewahren
  alternative: aus seiner Stellung über dir; von dir weg
  rationale: Die Wendung deutet wahrscheinlich auf die Entfernung Elias als einer Autorität über Elisa, doch der hebräische Wortlaut lässt seine konkrete Bildsprache stehen. Der Haupttext löst diese Spannung daher nicht stillschweigend auf.
- issue: Identität der בְנֵי הַנְּבִיאִים
  choice: Prophetensöhne
  alternative: Prophetenjünger; Angehörige einer Prophetengemeinschaft
  rationale: Die Gruppe dürfte aus prophetischen Schülern oder Gemeinschaftsmitgliedern bestanden haben. Die formnahe Bezeichnung vermeidet jedoch, eine bestimmte institutionelle Struktur als ausdrücklich genannt auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. Ungewöhnliche hebräische Wendungen werden dort bewahrt, wo ihre vorschnelle Glättung Bedeutungsnuancen oder theologische Spannung beseitigen würde; Fußnoten sichern die Verständlichkeit.
