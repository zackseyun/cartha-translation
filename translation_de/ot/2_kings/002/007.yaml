  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: de
  text: Fünfzig Männer von den Söhnen der Propheten[a] gingen und stellten sich ihnen gegenüber in einiger Entfernung[b] auf. Die beiden standen am Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Bezeichnung für eine mit dem prophetischen Dienst verbundene Gruppe.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »von ferne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: Fünfzig Männer
  rationale: Die Verbindung aus Zahlwort und אִישׁ bezeichnet fünfzig Männer; die Wiedergabe ist geschlechtsgenau und im Deutschen natürlich.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: von den Prophetensöhnen
  rationale: Die traditionelle und knappe Bezeichnung bewahrt das hebräische Bild „Söhne der Propheten“ und bezeichnet eine anerkannte Gemeinschaft von Männern im prophetischen Dienst, ohne sie vorschnell als Schüler oder Gilde zu deuten.
- source_word: הָלְכוּ
  choice: gingen mit
  rationale: הלך bedeutet hier „gehen“. Das im Deutschen idiomatische „gingen mit“ ergibt sich aus dem Erzählzusammenhang, in dem die Gruppe Elia und Elisa bis in die Nähe des Jordan folgt.
- source_word: וַיַּעַמְדוּ
  choice: stellten sich ... auf
  rationale: עמד bezeichnet das Einnehmen beziehungsweise Halten eines Standorts. „Stellten sich auf“ klingt hier natürlicher als ein zweites unmittelbar folgendes „standen“ und fügt keine wesentliche Betonung hinzu.
- source_word: מִנֶּגֶד
  choice: ihnen gegenüber
  rationale: מִנֶּגֶד beschreibt eine Position gegenüber beziehungsweise angesichts der beiden Männer; das deutsche Pronomen macht den im Hebräischen kontextuell erschlossenen Bezug deutlich.
- source_word: מֵרָחוֹק
  choice: in einiger Entfernung
  rationale: Die Wendung bezeichnet räumlichen Abstand. „In einiger Entfernung“ ist modernes, natürliches Deutsch und vermeidet das altertümlichere „von ferne“.
- source_word: וּשְׁנֵיהֶם
  choice: Die beiden aber
  rationale: Der Ausdruck verweist ausdrücklich auf Elia und Elisa als Paar. „Aber“ gibt den szenischen Kontrast zwischen den fünfzig Beobachtern und den beiden Männern natürlich wieder.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: standen am Jordan
  rationale: עַל bezeichnet bei einem Gewässer hier den Standort an dessen Ufer, nicht auf der Wasserfläche. „Am Jordan“ ist die idiomatische deutsche Wiedergabe und lässt die genaue Uferposition offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der traditionelle Ausdruck „Prophetensöhne“ bewahrt die Bildsprache des Hebräischen; die übrige Syntax ist für heutige Leser geglättet. Die Wiederholung von עמד wird durch „stellten sich ... auf“ und „standen“ stilistisch natürlich wiedergegeben.
