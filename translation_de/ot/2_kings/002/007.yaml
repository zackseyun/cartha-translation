revisions:
- from: Fünfzig Männer von den Prophetensöhnen[a] gingen mit und stellten sich ihnen gegenüber in einiger Entfernung[b] auf. Die beiden aber standen am Jordan.
  to: Fünfzig Männer von den Söhnen der Propheten[a] gingen und stellten sich ihnen gegenüber in einiger Entfernung[b] auf. Die beiden standen am Jordan.
  rationale: Die Revision entfernt die nicht ausdrücklich im Hebräischen enthaltene Ergänzung »mit«, macht die Gruppenbezeichnung wörtlich und verständlich und verzichtet auf eine unnötig adversative Nuance. Die räumliche Gegenüberstellung, die Distanz und der Standort der beiden am Jordan bleiben erhalten.
