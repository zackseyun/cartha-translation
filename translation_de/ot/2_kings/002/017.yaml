  text: וַ/יִּפְצְרוּ ב֥/וֹ עַד בֹּ֖שׁ וַ/יֹּ֣אמֶר שְׁלָ֑חוּ וַֽ/יִּשְׁלְחוּ֙ חֲמִשִּׁ֣ים אִ֔ישׁ וַ/יְבַקְשׁ֥וּ שְׁלֹשָֽׁה יָמִ֖ים וְ/לֹ֥א מְצָאֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: de
  text: 'Doch sie bedrängten ihn so lange, bis es ihm peinlich wurde[a]. Da sagte er: »Schickt sie los!« So schickten sie fünfzig Männer los. Drei Tage lang suchten sie, fanden ihn aber nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bis er sich schämte«; gemeint sein kann auch: »bis es ihm unangenehm wurde«. Das Hebräische beschreibt den sozialen Druck, den ihr beharrliches Drängen ausübte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: sie bedrängten ihn
  rationale: פצר bezeichnet hartnäckiges Drängen. »Bedrängten« gibt die wiederholte, auf Elisa ausgeübte Einwirkung prägnant und natürlich wieder.
- source_word: עַד בֹּשׁ
  choice: bis es ihm peinlich wurde
  rationale: בוש kann Scham oder Verlegenheit bezeichnen. Im Zusammenhang beschreibt die Wendung den durch ihr beharrliches Drängen erzeugten sozialen Druck, ohne eine moralische Schuld Elisas nahezulegen.
- source_word: שְׁלָחוּ
  choice: Schickt sie los!
  rationale: Der maskuline Pluralimperativ von שלח erlaubt ein im Kontext erschlossenes Objekt. »Sie« bezeichnet die zuvor vorgeschlagenen Männer; »losschicken« ist im Deutschen idiomatisch.
- source_word: חֲמִשִּׁים אִישׁ
  choice: fünfzig Männer
  rationale: Der hebräische Vers nennt schlicht fünfzig Männer. Ihre nähere Zugehörigkeit ergibt sich aus dem Kontext und wird nicht ergänzt.
- source_word: וַיְבַקְשׁוּ
  choice: sie suchten
  rationale: בקש bedeutet hier, nach jemandem zu suchen. Das Objekt wird durch den Kontext und das folgende Pronomen deutlich.
- source_word: שְׁלֹשָׁה יָמִים
  choice: drei Tage lang
  rationale: Die Zeitangabe wird als Dauer der Suche in natürlichem Deutsch wiedergegeben.
- source_word: וְלֹא מְצָאֻהוּ
  choice: fanden ihn aber nicht
  rationale: מצא bedeutet »finden«. »Aber« gibt den im Zusammenhang adversativen Ausgang der erfolglosen Suche wieder.
