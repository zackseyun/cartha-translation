source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: de
  text: 'Da sagten sie zu ihm: „Sieh doch, unter deinen Dienern sind fünfzig tüchtige Männer. Lass sie gehen und deinen Herrn suchen. Vielleicht hat der Geist Jahwes[a] ihn fortgetragen und auf einen der Berge oder in eines der Täler geworfen.“ Er aber sagte: „Schickt sie nicht!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Wind Jahwes“. Das hebräische Wort kann sowohl „Geist“ als auch „Wind“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: Die Verbindung dient als höflicher Aufmerksamkeitsruf; „doch“ gibt die bittende Nuance von נָא im Deutschen natürlich wieder.
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: unter deinen Dienern sind
  rationale: Die Existenzkonstruktion bezeichnet Männer, die sich unter Elisas Dienern befinden; diese Wiedergabe wahrt die Beziehung klar und idiomatisch.
- source_word: בְּנֵי חַיִל
  choice: tüchtige Männer
  rationale: Die Wendung bezeichnet hier fähige, einsatzkräftige Männer für die Suche, ohne zwingend eine militärische Bedeutung zu tragen.
- source_word: יֵלְכוּ נָא
  choice: Lass sie gehen
  rationale: Der Jussiv mit נָא formuliert eine höfliche Bitte um Elisas Erlaubnis.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: und deinen Herrn suchen
  rationale: בקשׁ bedeutet hier „suchen“; אֲדֹנֶיךָ bezeichnet Elia als den Herrn beziehungsweise Meister Elisas.
- source_word: פֶּן
  choice: Vielleicht
  rationale: Die Partikel leitet hier eine unsichere Erklärung für Elias Verschwinden ein, nicht einen zu verhindernden Ausgang.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: der Geist Jahwes hat ihn fortgetragen
  rationale: Der Zusammenhang legt göttliches Wirken nahe; die ebenfalls mögliche Bedeutung „Wind“ bleibt in der Fußnote erhalten.
- source_word: וַיַּשְׁלִכֵהוּ
  choice: und ... geworfen
  rationale: Das Verb bezeichnet ein Werfen oder Schleudern; „geworfen“ ist unmittelbar verständlich und bewahrt die kräftige Bildsprache.
- source_word: בְּאַחַד הֶהָרִים ... בְּאַחַת הַגֵּאָיוֹת
  choice: auf einen der Berge oder in eines der Täler
  rationale: Die deutschen Richtungsangaben passen zur Bewegung des Werfens; גיא wird allgemeinverständlich mit „Tal“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von רוּחַ יְהוָה
  choice: der Geist Jahwes
  alternative: der Wind Jahwes
  rationale: Die außergewöhnliche Entrückung Elias und das als handelnd vorgestellte göttliche Wirken sprechen im Kontext für „Geist“. Da רוּחַ auch „Wind“ bedeuten kann, wird diese echte lexikalische Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und lebendig; „tüchtige Männer“ vermeidet eine unnötig militärische Zuspitzung. Der Gottesname wird als „Jahwe“ wiedergegeben.
