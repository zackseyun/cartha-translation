source:
  edition: WLC
  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: de
  text: 'Wieder schickte er einen dritten Hauptmann mit seinen fünfzig Männern. Dieser stieg hinauf und kam zu Elia. Der dritte Hauptmann ging vor Elia auf die Knie, flehte ihn an und sagte zu ihm: »Mann Gottes, lass doch mein Leben[a] und das Leben dieser fünfzig Diener von dir in deinen Augen kostbar sein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Seele«. Das hebräische Wort nefesch kann je nach Zusammenhang »Leben«, »Person/Selbst« oder »Seele« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: Wieder schickte er
  rationale: וַיָּשָׁב kennzeichnet hier die Wiederholung der Handlung; die idiomatische deutsche Wiedergabe „wieder“ trifft diese Erzählfunktion besser als das wörtliche „er kehrte zurück und schickte“.
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: einen dritten Hauptmann mit seinen fünfzig Männern
  rationale: Die Formulierung bezeichnet den dritten Befehlshaber einer Fünfzigerschaft samt seiner Einheit. „Hauptmann mit seinen fünfzig Männern“ ist im modernen Deutsch verständlich und bewahrt Rang, Reihenfolge und Gruppengröße.
- source_word: וַיַּעַל וַיָּבֹא
  choice: Dieser stieg hinauf und kam zu Elia
  rationale: Beide Bewegungsverben werden wiedergegeben. Das im Hebräischen nicht ausdrücklich stehende Ziel „zu Elia“ ergibt sich unmittelbar aus dem folgenden Satz und macht den deutschen Satz vollständig.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו לְנֶגֶד אֵלִיָּהוּ
  choice: ging vor Elia auf die Knie
  rationale: Die natürliche deutsche Wendung gibt die konkrete Körperhaltung und die demütige Stellung vor Elia wieder, ohne ein gewaltsames Niederfallen zu unterstellen.
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: flehte ihn an
  rationale: Die reflexive Verbform von חנן bezeichnet ein eindringliches, demütiges Bitten; „anflehen“ trifft die Dringlichkeit des Zusammenhangs.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Die feste prophetische Bezeichnung wird direkt und traditionsverständlich wiedergegeben, ohne zusätzliche Deutung.
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: lass doch ... in deinen Augen kostbar sein
  rationale: Die Bitte und das Bild des Kostbarseins werden bewahrt. Eine bloße Wiedergabe mit „verschone“ würde zwar die praktische Absicht ausdrücken, aber die hebräische Metapher einebnen.
- source_word: נַפְשִׁי וְנֶפֶשׁ עֲבָדֶיךָ
  choice: mein Leben und das Leben ... deiner Diener
  rationale: נֶפֶשׁ bezeichnet angesichts der drohenden Tötung hier das konkrete Leben der Betroffenen. Das deutsche „Leben“ vermeidet eine unangebrachte Festlegung auf eine vom Körper getrennte Seele.
- source_word: עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  choice: diese fünfzig Diener von dir
  rationale: „Diener“ wahrt die relationale Bezeichnung gegenüber Elia; „Soldaten“ wäre kontextuell naheliegend, aber stärker interpretierend. „Von dir“ ist modernes, verständliches Deutsch für die Zugehörigkeitsbeziehung.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in einer lebensbedrohlichen Situation
  choice: Leben
  alternative: Seele
  rationale: Der Hauptmann bittet darum, dass er und seine Männer nicht sterben. „Leben“ entspricht daher dem unmittelbaren Kontext und vermeidet, eine bestimmte anthropologische Lehre in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Wiederholung von „der dritte Hauptmann“ folgt der hebräischen Hervorhebung. Die Bitte behält das Bild „in deinen Augen kostbar“ bei; die militärische Funktion wird verständlich ausgedrückt, ohne den Text unnötig zu technisieren.
