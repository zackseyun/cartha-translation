base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: de
  text: 'Sieh doch: Feuer ist vom Himmel herabgekommen und hat die beiden ersten Befehlshaber über je fünfzig Mann und ihre Abteilungen[a] verzehrt. Doch nun möge mein Leben in deinen Augen kostbar sein.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Fünfzigschaften“, das heißt die jeweils fünfzig Mann unter ihrem Befehl.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „meine Seele“; das hebräische Wort bezeichnet hier das Leben des Sprechers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die Wendung lenkt nachdrücklich die Aufmerksamkeit auf das zuvor Geschehene. „Sieh doch“ gibt diese deiktische und emphatische Funktion in natürlichem modernem Deutsch wieder.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: Feuer ist vom Himmel herabgekommen
  rationale: Die Formulierung bildet Bewegung und Ausgangspunkt des hebräischen Ausdrucks idiomatisch und zugleich anschaulich ab.
- source_word: וַתֹּאכַל
  choice: hat … verzehrt
  rationale: אכל bedeutet wörtlich „essen“; bei Feuer bezeichnet „verzehren“ im Deutschen natürlich und präzise die zerstörende Wirkung.
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים
  choice: die ersten beiden Hauptleute über fünfzig Mann
  rationale: שַׂר bezeichnet hier einen militärischen Befehlshaber. „Hauptmann über fünfzig Mann“ macht sowohl Rang als auch Größe der befehligten Einheit verständlich.
- source_word: הָרִאשֹׁנִים
  choice: die ersten
  rationale: Das Adjektiv verweist auf die beiden zuvor in der Erzählung aufgetretenen Befehlshaber und wahrt die Abfolge.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: samt ihren Fünfzigschaften
  rationale: Der Ausdruck bezeichnet wörtlich die ihnen zugeordneten Fünfzigergruppen. „Fünfzigschaften“ bewahrt die militärische Gliederung, wird aber wegen seiner Seltenheit erläutert.
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Die Wendung leitet den Gegensatz zwischen dem früheren Gericht und der gegenwärtigen Bitte ein.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: möge mein Leben in deinen Augen kostbar sein
  rationale: יקר drückt Kostbarkeit oder hohen Wert aus; נֶפֶשׁ bezeichnet hier konkret das bedrohte Leben. Die Wendung „in deinen Augen“ erhält das hebräische Bild.
theological_decisions:
- issue: Wiedergabe von נֶפֶשׁ in der Bitte um Verschonung
  choice: Leben
  alternative: Seele
  rationale: Der Sprecher bittet darum, nicht wie die vorigen Abteilungen getötet zu werden. „Leben“ entspricht daher dem konkreten Sinn, ohne eine vom Kontext nicht geforderte Trennung von Seele und Körper einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh doch“ erhält den Nachdruck des hebräischen הִנֵּה; „Fünfzigschaften“ bewahrt die konkrete militärische Einteilung und wird in einer Fußnote erklärt. Die abschließende Bitte hält mit „in deinen Augen kostbar“ bewusst das Bild und den eindringlichen Ton des Ausgangstextes fest.
