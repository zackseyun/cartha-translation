source:
  edition: WLC
  text: וַ/יַּ֣עַן אֵלִיָּה֮ וַ/יְדַבֵּ֣ר אֲלֵי/הֶם֒ אִם אִ֤ישׁ הָֽ/אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ אֱלֹהִים֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: de
  text: 'Elia antwortete ihnen: »Wenn ich ein Mann Gottes bin[a], dann soll Feuer vom Himmel herabkommen und dich und deine fünfzig Männer[b] verzehren!« Da kam Gottes Feuer[c] vom Himmel herab und verzehrte ihn und seine fünfzig Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wenn ich der Mann Gottes bin.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »deine Fünfzig«; gemeint ist die dem Hauptmann unterstellte Abteilung von fünfzig Männern.'
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »Feuer von Gott« oder »göttliches Feuer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: Elia antwortete ihnen
  rationale: Die beiden hebräischen Redeeinleitungsformeln werden im modernen Deutschen natürlich zusammengezogen; der Antwortcharakter bleibt erhalten.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: Wenn ich ein Mann Gottes bin
  rationale: Die prädikative Wendung bezeichnet Elias prophetischen Status. „Mann Gottes“ bewahrt den hebräischen Titel, ohne ihn auszudeuten.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: dann soll Feuer vom Himmel herabkommen
  rationale: '„Soll“ gibt hier den jussivisch-imprekatorischen Sinn wieder: Elia ruft das Feuer herab, statt lediglich ein Ereignis vorherzusagen.'
- source_word: וְתֹאכַל
  choice: und … verzehren
  rationale: „Verzehren“ ist bei Feuer idiomatisch, bewahrt das kräftige Bild von אכל und wird in beiden Satzhälften einheitlich verwendet.
- source_word: אֹתְךָ וְאֶת חֲמִשֶּׁיךָ
  choice: dich und deine fünfzig Männer
  rationale: Das Singularpronomen richtet sich an den Hauptmann; „deine fünfzig Männer“ macht den elliptischen militärischen Ausdruck im Deutschen verständlich.
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: Da kam Gottes Feuer vom Himmel herab
  rationale: Die Verbindung אֵשׁ אֱלֹהִים ordnet das Feuer ausdrücklich Gott zu. „Gottes Feuer“ bildet diese knappe Verbindung ab, ohne den Vorgang näher zu erklären.
- source_word: וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  choice: und verzehrte ihn und seine fünfzig Männer
  rationale: Die Formulierung unterscheidet wie der Ausgangstext den Hauptmann im Singular von seiner Abteilung und wiederholt bewusst dasselbe Verb.
theological_decisions:
- issue: Wiedergabe des prophetischen Titels אִישׁ הָאֱלֹהִים
  choice: ein Mann Gottes
  alternative: der Mann Gottes
  rationale: Die Wendung steht prädikativ und bezeichnet den Anspruch auf prophetischen Status. Die gewählte Fassung bewahrt den Titel, ohne eine exklusive oder später dogmatisch geprägte Bedeutung hinzuzufügen.
- issue: Zuordnung des Feuers in אֵשׁ אֱלֹהִים
  choice: Gottes Feuer
  alternative: Feuer von Gott
  rationale: Die Übersetzung hält die ausdrückliche Zuordnung zu Gott fest, lässt aber offen, ob die Genitivverbindung vor allem Herkunft, Zugehörigkeit oder Qualität bezeichnet.
- issue: Kraft der Verbform תֵּרֶד
  choice: dann soll Feuer … herabkommen
  alternative: dann wird Feuer … herabkommen
  rationale: Der Kontext legt einen herabrufenden beziehungsweise imprekatorischen Sinn näher als eine rein sachliche Vorhersage; die Formulierung erklärt jedoch nicht weiter, wie Elias Ausspruch und Gottes Handeln zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Redeeinleitung ist gegenüber der hebräischen Doppelung leicht gestrafft. „Herabkommen“ und „verzehren“ erhalten den feierlich-ernsten Erzählton, ohne unnötig altertümlich zu wirken. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
