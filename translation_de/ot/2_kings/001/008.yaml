base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: de
  text: 'Sie sagten zu ihm: „Er war ein behaarter Mann[a] mit einem Ledergürtel um die Taille.“ Da sagte er: „Das ist Elia, der Tischbiter.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er war ein Mann mit einem Haargewand.“ Wörtlich lautet der hebräische Ausdruck etwa „ein Mann, ein Besitzer von Haar“; er kann entweder einen behaarten Mann oder Kleidung aus Haar beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בַּעַל שֵׂעָר
  choice: ein stark behaarter Mann
  rationale: Die Wendung bedeutet wörtlich etwa „ein Mann, ein Besitzer von Haar“. Sie kann die starke Körperbehaarung des Mannes beschreiben; „stark behaart“ gibt dies in natürlichem Deutsch wieder. Da auch ein Gewand aus Haarstoff gemeint sein könnte, wird diese Möglichkeit in einer Fußnote bewahrt.
- source_word: וְאֵזוֹר עוֹר אָזוּר
  choice: und trug einen Ledergürtel
  rationale: אֵזוֹר עוֹר bezeichnet einen Gürtel aus Leder beziehungsweise Tierhaut. Das passive Partizip אָזוּר besagt, dass er damit gegürtet war; im modernen Deutschen ist „trug“ die natürliche Formulierung.
- source_word: בְּמָתְנָיו
  choice: um die Hüften
  rationale: מָתְנַיִם bezeichnet die Lenden- oder Hüftgegend. „Um die Hüften“ ist gegenwärtig, verständlich und vermeidet das altertümliche „um seine Lenden“.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Elia, der Tischbiter
  rationale: Der Personenname wird in seiner etablierten deutschen Form „Elia“ wiedergegeben; das Gentilizium הַתִּשְׁבִּי erscheint entsprechend der üblichen deutschen Bibelsprache als „der Tischbiter“.
- source_word: הוּא
  choice: Das ist
  rationale: Bei der Identifizierung einer Person anhand einer Beschreibung entspricht „Das ist Elia“ natürlichem modernem Deutsch und gibt die Funktion des hervorgehobenen Pronomens treffend wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die mehrdeutige Beschreibung בַּעַל שֵׂעָר wird im Haupttext als Körperbehaarung verstanden, ohne die mögliche Deutung als Haargewand zu verschweigen.
