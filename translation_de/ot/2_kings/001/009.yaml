  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֣עַל אֵלָ֗י/ו וְ/הִנֵּה֙ יֹשֵׁב֙ עַל רֹ֣אשׁ הָ/הָ֔ר וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים הַ/מֶּ֥לֶךְ דִּבֶּ֖ר רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: de
  text: 'Da schickte er einen Hauptmann mit seinen fünfzig Männern zu ihm. Der stieg zu ihm hinauf, und siehe, er saß oben auf dem Berg[a]. Der Hauptmann sagte zu ihm: »Mann Gottes, der König sagt[b]: ›Komm herunter!‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »oben auf dem Hügel«. Das hebräische Wort הַר kann je nach Zusammenhang einen Berg oder einen Hügel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Der König hat gesprochen: Komm herunter!« Die hebräische Botenformel verwendet »hat gesprochen«; hier wird sie idiomatisch mit »sagt« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickte er
  rationale: Das Wayyiqtol führt die Erzählung weiter. »Da« gibt die zeitliche Abfolge im Deutschen natürlich wieder, ohne eine stärkere logische Verknüpfung einzutragen.
- source_word: שַׂר חֲמִשִּׁים
  choice: einen Hauptmann
  rationale: Die Wendung bezeichnet einen militärischen Befehlshaber über eine Einheit von fünfzig Mann. »Hauptmann« ist im Deutschen verständlich und bewahrt den militärischen Rangcharakter; die Größe seiner Einheit wird durch den folgenden Ausdruck deutlich.
- source_word: וַחֲמִשָּׁיו
  choice: mit seinen fünfzig Männern
  rationale: Das Suffix ordnet die fünfzig Männer dem Hauptmann zu. »Männern« wird ergänzt, weil das substantivierte Zahlwort im Deutschen sonst unnatürlich und missverständlich wäre.
- source_word: וַיַּעַל אֵלָיו
  choice: Der stieg zu ihm hinauf
  rationale: עלה bezeichnet hier die Aufwärtsbewegung zu Elia an seinem erhöhten Aufenthaltsort. »hinaufsteigen« erhält diese räumliche Nuance.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die Partikel macht die Szene anschaulich und lenkt die Aufmerksamkeit auf Elias Haltung und Standort. Das würdige, geläufige biblische »siehe« bewahrt diese Funktion.
- source_word: יֹשֵׁב
  choice: er saß
  rationale: Das Partizip beschreibt Elias andauernde Haltung in diesem Augenblick. Im deutschen Erzählstil gibt das Präteritum diesen Zustand natürlich wieder.
- source_word: עַל רֹאשׁ הָהָר
  choice: oben auf dem Berg
  rationale: רֹאשׁ bezeichnet die Spitze beziehungsweise den oberen Teil. הַר kann je nach Gelände einen Berg oder Hügel meinen; »Berg« gibt die übliche Grundbedeutung wieder, während die Alternative in der Fußnote erhalten bleibt.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Der Hauptmann sagte zu ihm
  rationale: Das ausdrücklich genannte Subjekt beseitigt im Deutschen eine mögliche Unklarheit des Pronomens. »sagte« ist die natürliche Einleitung direkter Rede und gibt דבר in diesem Kontext angemessen wieder.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Die feste Bezeichnung kennzeichnet Elia als prophetischen Gottesmann, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: der König sagt
  rationale: Wörtlich steht »der König hat gesprochen«. Als Botenformel wird dies im heutigen Deutsch idiomatisch mit »der König sagt« wiedergegeben; »befiehlt« würde den Wortlaut stärker auslegen.
- source_word: רֵדָה
  choice: Komm herunter!
  rationale: Der Imperativ fordert Elia auf, von seinem erhöhten Standort zum unten stehenden Sprecher zu kommen. »Komm herunter« gibt sowohl die Richtung als auch die Perspektive des Sprechers natürlich wieder.
