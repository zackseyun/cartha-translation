  text: וַ/יָּשׁ֥וּבוּ הַ/מַּלְאָכִ֖ים אֵלָ֑י/ו וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מַה זֶּ֥ה שַׁבְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: de
  text: 'Die Boten kehrten zu ihm zurück, und er sagte zu ihnen: »Warum seid ihr zurückgekehrt?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Was ist das – ihr seid zurückgekehrt?« Gemeint ist: »Warum seid ihr zurückgekehrt?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: kehrten … zurück
  rationale: Das Verb שוב bezeichnet hier in der Erzählfolge die Rückkehr der ausgesandten Männer zu dem, der sie gesandt hatte. Die deutsche Wendung ist natürlich und bewahrt die Bewegungsrichtung.
- source_word: הַמַּלְאָכִים
  choice: die Boten
  rationale: מַלְאָכִים bezeichnet in diesem Zusammenhang menschliche Abgesandte des Königs, nicht himmlische Wesen. »Boten« ist im Deutschen präzise und geläufig.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition bezeichnet die Richtung auf den König hin. Zusammen mit »zurückkehren« wird die Rückkehr zu ihm klar ausgedrückt.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: und er sagte zu ihnen
  rationale: Die Übersetzung bewahrt das gewöhnliche hebräische Erzählverb אמר, obwohl die folgende Äußerung eine Frage ist.
- source_word: מַה זֶּה
  choice: Warum
  rationale: Wörtlich lautet die Wendung »Was ist das?«, doch hier fragt sie idiomatisch nach dem Grund ihrer unerwarteten Rückkehr. »Warum« gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: שַׁבְתֶּם
  choice: seid ihr zurückgekehrt
  rationale: Die Form ist zweite Person maskulin Plural von שוב. Das deutsche Perfekt passt zur unmittelbar vollzogenen und nun festgestellten Rückkehr.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der schlichte hebräische Erzählstil bleibt durch »sagte zu ihnen« erhalten; die idiomatische Frage wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich dokumentiert.
