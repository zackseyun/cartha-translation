source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: de
  text: 'Sie antworteten ihm: „Ein Mann kam uns entgegen und sagte zu uns: ‚Geht zurück zu dem König, der euch gesandt hat, und sagt ihm: So spricht Jahwe: Ist es etwa, weil es in Israel keinen Gott gibt, dass du Boten aussendest, um Baal-Sebub, den Gott von Ekron, zu befragen? Darum wirst du von dem Bett, auf das du gestiegen bist, nicht mehr herunterkommen, sondern ganz gewiss sterben.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Bewahrt die männliche Singularform und die Erzählperspektive der Boten, die Elia noch nicht namentlich nennen.
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: kam uns entgegen
  rationale: Gibt die Bewegung auf die Sprecher zu in natürlichem Deutsch wieder; die im Hebräischen enthaltene Aufwärtsbewegung ist hier kontextuell nicht sicher genug, um das unidiomatische „kam herauf“ zu erzwingen.
- source_word: לְכוּ שׁוּבוּ
  choice: Geht zurück
  rationale: Die beiden Imperative bilden zusammen eine natürliche Aufforderung zur Rückkehr; im Deutschen wäre „Geht, kehrt zurück“ unnötig schwerfällig.
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: und sagt ihm
  rationale: Im Kontext leitet דבר eine auszurichtende Botschaft ein; „sagt ihm“ ist dafür die natürliche deutsche Formulierung.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: הַמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Ist es etwa, weil es in Israel keinen Gott gibt
  rationale: Erhält die rhetorische, vorwurfsvolle Frage; „etwa“ macht ihren ungläubigen Ton im Deutschen hörbar, ohne sie in eine Aussage umzudeuten.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: dass du Boten aussendest, um … zu befragen
  rationale: Das nicht ausdrücklich genannte Objekt des Sendens ergibt sich aus dem Kontext als die Boten; „befragen“ trifft die Suche nach göttlicher Auskunft.
- source_word: בַּעַל זְבוּב
  choice: Baal-Sebub
  rationale: Der Eigenname der Gottheit wird in geläufiger deutscher Umschrift wiedergegeben und nicht übersetzt.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: den Gott von Ekron
  rationale: Gibt die Zugehörigkeit der Gottheit zur Stadt in natürlichem Deutsch wieder.
- source_word: הַמִּטָּה
  choice: das Bett
  rationale: Im Zusammenhang mit Krankheit und bevorstehendem Tod ist „Bett“ die naheliegende Bedeutung von מִטָּה.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: auf das du gestiegen bist
  rationale: Bewahrt das Verb „hinaufsteigen“ und bezieht die semitische Konstruktion mit resumptivem שׁם idiomatisch auf das Bett.
- source_word: מוֹת תָּמוּת
  choice: ganz gewiss sterben
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Gewissheit des angekündigten Todes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Rhetorische Frage nach Gottes Gegenwart in Israel
  choice: Ist es etwa, weil es in Israel keinen Gott gibt …?
  alternative: Gibt es denn keinen Gott in Israel, sodass …?
  rationale: Die gewählte Fassung lässt offen, ob die Formulierung als ironisch angenommener Grund oder als zugespitzte Frage gehört wird, und bewahrt den vorwurfsvollen Ton.
- issue: Bezeichnung Baal-Sebubs als אֱלֹהֵי עֶקְרוֹן
  choice: den Gott von Ekron
  alternative: die Gottheit von Ekron
  rationale: „Gott“ entspricht der grammatischen und lexikalischen Form, ohne damit die Wahrheit seines göttlichen Anspruchs zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt feierlich, während Rede und Satzbau für heutige Leser natürlich bleiben. Die Verschachtelung der direkten Rede wird klar erhalten.
