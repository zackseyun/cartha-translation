    rationale: Der Relativsatz bezieht sich grammatisch auf „das Bett“. Das resumptive שָׁם ist zwar im Deutschen nicht wörtlich nachzubilden, liefert aber keinen eigenständigen Bezug auf einen Raum. Die Fußnote führt daher eine nicht vom Wortlaut getragene Deutungsmöglichkeit ein und sollte entfernt werden.
