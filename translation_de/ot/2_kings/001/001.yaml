lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: sagte sich … los
  rationale: Das Verb פשע bezeichnet hier im politischen Zusammenhang den Aufstand eines unterworfenen Volkes gegen seine Oberherrschaft. Die deutsche Wendung „sich von jemandem lossagen“ gibt diesen geopolitischen Sinn natürlich und präzise wieder.
- source_word: מוֹאָב
  choice: Moab
  rationale: Eingebürgerte deutsche Form des Landes- und Volksnamens.
- source_word: בְּיִשְׂרָאֵל
  choice: von Israel
  rationale: Die Präposition בְּ bezeichnet in Verbindung mit פשע die Macht, gegen die sich die Rebellion richtet. In der gewählten deutschen Wendung wird dieses Verhältnis idiomatisch mit „von“ ausgedrückt.
- source_word: אַחֲרֵי מוֹת
  choice: Nach … Tod
  rationale: Natürliche und zugleich formnahe Wiedergabe der temporalen Fügung mit dem Infinitiv-Konstrukt von מות.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Eingebürgerte deutsche Schreibweise des Personennamens.
