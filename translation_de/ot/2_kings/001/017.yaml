base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: de
  text: Da starb er[a] nach dem Wort Jahwes, das Elia gesprochen hatte. Und Joram wurde an seiner Stelle König im zweiten Jahr Jorams, des Sohnes Joschafats, des Königs von Juda, denn er hatte keinen Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und er starb … Und Joram regierte an seiner Stelle.“ Die hebräischen Verben sind einfache Erzählformen; „wurde König“ hebt den Regierungsantritt hervor, während „regierte“ eine formellere Alternative ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: So starb er
  rationale: Die narrative Verbform führt die Handlung weiter. „So“ stellt zugleich den Zusammenhang mit der zuvor angekündigten Folge her, ohne dem Verb mehr als die Grundbedeutung „sterben“ beizulegen.
- source_word: כִּדְבַר יְהוָה
  choice: wie es dem Wort Jahwes entsprach
  rationale: Die Präposition כְּ bezeichnet hier die Übereinstimmung des Geschehens mit dem zuvor gesprochenen Wort. Die Formulierung ist im Deutschen natürlich und bewahrt diesen Bezug.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: das Elia gesprochen hatte
  rationale: Der Relativsatz bezieht sich am natürlichsten auf das Wort. Das Plusquamperfekt kennzeichnet, dass Elias Reden dem Tod vorausging, ohne „durch Elia“ in die Syntax einzutragen.
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: Und Joram wurde an seiner Stelle König
  rationale: מלך bezeichnet in diesem Zusammenhang den Regierungsantritt. „Wurde König“ gibt diesen punktuellen Sinn idiomatisch wieder; תַּחְתָּיו wird mit „an seiner Stelle“ abgebildet.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: im zweiten Jahr Jorams
  rationale: Die Wendung ist eine übliche Regierungsdatierung und wird im Deutschen entsprechend wiedergegeben.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: des Sohnes Joschafats, des Königs von Juda
  rationale: Die Apposition unterscheidet diesen Joram vom gleichnamigen neuen König Israels und bewahrt die Zuordnung Joschafats als König von Juda.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: denn er hatte keinen Sohn
  rationale: כִּי begründet, weshalb kein Sohn die Nachfolge antrat. „Denn“ bewahrt die erklärende, kausale Verbindung und das hebräische Pronomen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt den Eigennamen im modernen Standarddeutsch wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Sprecher des Wortes Jahwes
  choice: das Elia gesprochen hatte
  alternative: das Jahwe durch Elia gesprochen hatte
  rationale: Grammatisch ist Elia das Subjekt von דִּבֶּר. Die gewählte Fassung wahrt sowohl die Herkunft als „Wort Jahwes“ als auch Elias tatsächliches Sprechen, ohne die syntaktisch nicht ausdrücklich vorhandene Mittlerformel einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am hebräischen Erzählfluss, wird aber durch „und zwar“ bei der Regierungsdatierung idiomatisch gegliedert. Die Namen werden in den im Deutschen üblichen biblischen Formen Elia, Joram und Joschafat wiedergegeben.
