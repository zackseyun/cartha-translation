  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם מֶ֚ה מִשְׁפַּ֣ט הָ/אִ֔ישׁ אֲשֶׁ֥ר עָלָ֖ה לִ/קְרַאתְ/כֶ֑ם וַ/יְדַבֵּ֣ר אֲלֵי/כֶ֔ם אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: de
  text: 'Da fragte er sie: „Wie sah der Mann aus, der euch entgegenkam und diese Worte zu euch sagte?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was für ein Mann war es?“ Wörtlich: „Was war die Art/Beschaffenheit des Mannes …?“ Das hebräische Wort מִשְׁפָּט kann hier seine Art, Beschreibung oder Erscheinung bezeichnen. Im Zusammenhang geht es wahrscheinlich um Merkmale, an denen der Mann zu erkennen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט הָאִישׁ
  choice: Wie sah der Mann aus
  rationale: Die ungewöhnliche Verbindung fragt hier nach den kennzeichnenden Merkmalen des Mannes, wie die Beschreibung seiner äußeren Erscheinung in Vers 8 zeigt. Die deutsche Formulierung ist natürlich und wahrt den Zusammenhang.
- source_word: עָלָה
  choice: entgegenkam
  rationale: Das Verb bedeutet wörtlich „heraufkommen/hinaufgehen“. Zusammen mit לִקְרַאתְכֶם bezeichnet es hier das Herankommen zur Begegnung; im Deutschen lässt sich die Richtung natürlich im Gesamtverb ausdrücken.
- source_word: לִקְרַאתְכֶם
  choice: euch entgegenkam
  rationale: Die Wendung bezeichnet eine Bewegung auf die Angesprochenen zu, um ihnen zu begegnen.
- source_word: וַיְדַבֵּר אֲלֵיכֶם
  choice: zu euch sagte
  rationale: Mit dem folgenden direkten Objekt „diese Worte“ ist „diese Worte zu euch sagte“ im Deutschen idiomatisch und gibt den Sinn von דבר genau wieder.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Nahe, natürliche Wiedergabe der hebräischen Nominalphrase; sie bewahrt den Bezug auf die zuvor übermittelte Rede.
