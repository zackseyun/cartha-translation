source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: de
  text: 'Doch der Engel Jahwes sprach zu Elija, dem Tischbiter: „Steh auf, geh hinauf, um den Boten des Königs von Samaria entgegenzugehen, und sag ihnen: ›Geht ihr etwa hin, weil es in Israel keinen Gott gibt, um Baal-Sebub, den Gott von Ekron, zu befragen?[a]‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geht ihr etwa aus Mangel an einem Gott in Israel hin, um Baal-Sebub, den Gott von Ekron, zu befragen?“'
    reason: Lexikalisch-syntaktische Alternative für הֲמִבְּלִי אֵין. Die hebräische Wendung kann die Frage nach dem vermeintlichen Fehlen eines Gottes in Israel auch mit „aus Mangel an“ ausdrücken.
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Doch der Engel Jahwes
  rationale: Das einleitende וּ wird angesichts des Gegensatzes zum Handeln des Königs im vorherigen Vers mit „Doch“ wiedergegeben. מַלְאָךְ bezeichnet hier am natürlichsten einen himmlischen „Engel“; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: דִּבֶּר אֶל
  choice: sprach zu
  rationale: Die feste Verbindung bedeutet „zu jemandem sprechen“; die Formulierung ist im Deutschen natürlich und würdevoll.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Elija, dem Tischbiter
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form „Elija“ wiedergegeben; das Gentiliz הַתִּשְׁבִּי wird konventionell mit „der Tischbiter“ übersetzt und nach „zu“ in den Dativ gesetzt.
- source_word: קוּם עֲלֵה
  choice: Steh auf, geh hinauf
  rationale: Beide Imperative bleiben unterscheidbar. „Geh hinauf“ bewahrt die Richtungsangabe von עלה.
- source_word: לִקְרַאת
  choice: entgegen
  rationale: Die Wendung bezeichnet das Hingehen zu einer Begegnung; „entgegen“ gibt dies knapp wieder, ohne eine feindselige Konfrontation in den Text hineinzulesen.
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: den Boten des Königs von Samaria
  rationale: מַלְאָךְ bezeichnet hier eindeutig menschliche Beauftragte und wird deshalb mit „Boten“ wiedergegeben. „König von Samaria“ bewahrt die hebräische Bezeichnung.
- source_word: וְדַבֵּר אֲלֵהֶם
  choice: und sag ihnen
  rationale: Vor direkter Rede ist „sag ihnen“ im heutigen Deutsch natürlicher als die wörtlichere Wiederholung „sprich zu ihnen“.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Gibt es denn keinen Gott in Israel, dass …?
  rationale: Die rhetorische Frage drückt einen scharfen Vorwurf aus. „denn“ vermittelt diese Kraft, während die Konstruktion mit „dass“ den Zusammenhang mit dem folgenden Gang zur Befragung bewahrt.
- source_word: אַתֶּם הֹלְכִים
  choice: ihr hingeht
  rationale: Die partizipiale Form beschreibt das beabsichtigte beziehungsweise bereits eingeleitete Handeln. „hingeht“ ist in diesem Fragesatz idiomatisch.
- source_word: לִדְרֹשׁ
  choice: zu befragen
  rationale: דרש bezeichnet in diesem Orakelkontext das Einholen einer Auskunft bei einer Gottheit. „befragen“ ist präzise und allgemein verständlich.
- source_word: בַּעַל זְבוּב
  choice: Baal-Sebub
  rationale: Der Eigenname wird in der etablierten deutschen Form transliteriert; der Bindestrich macht den zusammengesetzten Namen erkennbar.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: den Gott von Ekron
  rationale: Die Status-constructus-Verbindung bezeichnet Baal-Sebub als die mit Ekron verbundene Gottheit; der bestimmte Ausdruck ist im Kontext sachgerecht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Identität von מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: „Engel“ ist in diesem Erzählzusammenhang die naheliegende Bedeutung. Die Übersetzung legt darüber hinaus nicht fest, wie die Gestalt theologisch oder christologisch zu bestimmen ist.
- issue: Rhetorische Frage über Gottes Gegenwart in Israel
  choice: Gibt es denn keinen Gott in Israel, dass ihr …?
  alternative: Geht ihr etwa aus Mangel an einem Gott in Israel …?
  rationale: Die Hauptfassung bewahrt den Vorwurfscharakter und die Aussageform des Hebräischen, ohne die Frage in eine dogmatische Behauptung umzuwandeln. Die idiomatisch mögliche Lesart „aus Mangel an“ wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gedankengang, wird jedoch durch deutsche Zeichensetzung und idiomatische Wortstellung lesbar gemacht. „Elija“, „Tischbiter“, „Baal-Sebub“ und „Ekron“ entsprechen geläufigen deutschen Bibelnamen.
