source:
  edition: WLC
  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: de
  text: 'Ahasja fiel durch das Gitter seines oberen Zimmers in Samaria und wurde krank. Da sandte er Boten aus und sagte zu ihnen: »Geht und befragt Baal-Sebub[a], den Gott von Ekron, ob ich von dieser Krankheit genesen werde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Sebub entspricht der hebräischen Namensform; die spätere Form Beelzebub ist aus dem Griechischen und der deutschen Bibeltradition bekannt.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: durch das Gitter
  rationale: Die Wendung bezeichnet die Bewegung durch eine vergitterte beziehungsweise gitterartige Öffnung. „Durch das Gitter“ gibt das konkrete Bild knapp und natürlich wieder.
- source_word: עֲלִיָּתוֹ
  choice: seines Obergemachs
  rationale: עֲלִיָּה bezeichnet einen Raum im oberen Teil eines Hauses. „Obergemach“ ist im Deutschen würdevoll und präzise, ohne eine bestimmte moderne Bauform vorauszusetzen.
- source_word: וַיָּחַל
  choice: wurde krank
  rationale: Das Verb bezeichnet hier, nach dem Sturz, das Eintreten eines krankhaften Zustands. „Wurde krank“ folgt dem hebräischen Wortlaut enger als „wurde verletzt“ und passt zur anschließenden Bezeichnung als חֳלִי, „Krankheit“.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im Erzählzusammenhang sind menschliche Abgesandte des Königs gemeint.
- source_word: דִרְשׁוּ
  choice: befragt
  rationale: דרשׁ bezeichnet hier das Einholen göttlicher Auskunft. „Befragt“ wahrt diesen Orakel- beziehungsweise Konsultationssinn.
- source_word: בַּעַל זְבוּב
  choice: Baal-Sebub
  rationale: Der Eigenname wird entsprechend seiner hebräischen Form wiedergegeben; die in späterer Überlieferung geläufige Form wird in der Fußnote genannt.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: den Gott von Ekron
  rationale: Die Genitivverbindung bezeichnet Baal-Sebub als die in Ekron verehrte Gottheit.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: ob ich von dieser Krankheit genesen werde
  rationale: Wörtlich steht „ob ich von dieser Krankheit leben werde“. Die deutsche Wendung „genesen werde“ gibt den gemeinten Ausgang der Krankheit idiomatisch wieder und bewahrt die offene Zukunftsfrage.
- source_word: וַיִּפֹּל
  choice: fiel
  rationale: Das einfache Erzählverb wird direkt wiedergegeben.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Dies ist die gebräuchliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Wiedergabe des Namens der fremden Gottheit
  choice: Baal-Sebub
  alternative: Beelzebub
  rationale: Der masoretische hebräische Text bietet בַּעַל זְבוּב. Daher steht die hebräische Namensform im Haupttext; die später verbreitete Form „Beelzebub“ wird als Überlieferungsvariante in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah an der knappen hebräischen Erzählweise. „Obergemach“ bewahrt die historische Unbestimmtheit des Raumes; „wurde krank“ vermeidet es, die im Hebräischen nicht ausdrücklich bezeichnete Art der Sturzverletzung festzulegen.
