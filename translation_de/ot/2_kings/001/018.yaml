  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֲחַזְיָ֖הוּ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten Ahasjas, alles, was er tat – sind sie nicht im Buch der Chronik der Könige Israels[b] niedergeschrieben[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufgezeichnet«. Wörtlich steht im Hebräischen »niedergeschrieben«; die Formulierung gehört zu einer üblichen königlichen Archivformel.'
    reason: lexical_alternative
  - marker: b
    text: Das »Buch der Chronik der Könige Israels« bezeichnet eine in den Königsbüchern angeführte annalistische Quelle und nicht notwendigerweise die biblischen Bücher der Chronik.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: Die Wendung gehört zur üblichen Schlussformel der Königsberichte. »Taten« gibt דִּבְרֵי hier im Sinn von Angelegenheiten beziehungsweise Handlungen eines Königs wieder; das vorangestellte וְ wird nicht unnötig mit »und« übersetzt.
- source_word: אֲחַזְיָהוּ
  choice: Ahasja
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: אֲשֶׁר עָשָׂה
  choice: alles, was er vollbrachte
  rationale: Die Relativkonstruktion erläutert die Taten Ahasjas. »Vollbrachte« vermeidet eine schwerfällige wörtliche Wiederholung und bewahrt den Bezug auf sein Handeln.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: sind sie nicht … niedergeschrieben?
  rationale: Die rhetorische Frage erwartet Zustimmung. »Niedergeschrieben« bewahrt die konkrete Bedeutung von כְתוּבִים und klingt in der archivalischen Formel natürlich.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl עַל grundlegend »auf/über« bedeutet und סֵפֶר auch eine Schriftrolle bezeichnen kann, verlangt die deutsche Buch- und Archivsprache hier idiomatisch »im Buch«.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: der Chronik der Könige von Israel
  rationale: דִּבְרֵי הַיָּמִים bezeichnet in dieser Quellenformel annalistische Aufzeichnungen; der Singular »Chronik« passt zum vorausgehenden סֵפֶר und vermeidet eine unnötige Gleichsetzung mit dem kanonischen Buch der Chronik.
theological_decisions: []
