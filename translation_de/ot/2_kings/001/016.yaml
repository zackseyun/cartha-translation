reference: 2 Kings 1:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: de
  text: 'Und er sprach zu ihm: »So spricht Jahwe: Weil du Boten ausgesandt hast, um Baal-Sebub, den Gott von Ekron, zu befragen – etwa weil es in Israel keinen Gott gibt, bei dem du nach seinem Wort fragen könntest?[a] Darum: Von dem Bett, auf das du gestiegen bist,[b] wirst du nicht herunterkommen, denn du wirst ganz gewiss sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „um nach seinem Wort zu fragen“; gemeint ist wohl, von Gott eine Botschaft oder Auskunft zu erbitten.'
    reason: Die hebräische Wendung bewahrt das Wort דָּבָר („Wort, Ausspruch, Botschaft“) und ist im Deutschen erklärungsbedürftig.
  - marker: b
    text: Das hebräische Verb bedeutet wörtlich „hinaufsteigen“. Gemeint sein kann das Besteigen des Bettes oder das Hinaufgehen zu dem Bett, möglicherweise in einem oberen Raum.
    reason: Die konkrete räumliche Ausdrucksweise des Hebräischen lässt mehr als eine genaue Vorstellung zu und soll nicht vorschnell auf „sich hinlegen“ reduziert werden.
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Und er sprach zu ihm
  rationale: דבר bezeichnet hier das Sprechen und leitet die direkte prophetische Botschaft an den König ein. „Sprach“ wahrt den würdigen Erzählton und unterscheidet sich von אָמַר in der folgenden Botenformel.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Dies ist die feste prophetische Botenformel. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: du Boten ausgesandt hast
  rationale: מַלְאָכִים meint hier menschliche Boten. Das Perfekt wird durch das deutsche Perfekt wiedergegeben.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: um Baal-Sebub … zu befragen
  rationale: דרש mit der Präposition ב bezeichnet hier das Einholen göttlicher Auskunft beziehungsweise eines Orakels. „Befragen“ gibt diesen kultischen Beratungsvorgang knapp wieder.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: den Gott von Ekron
  rationale: Die Status-constructus-Verbindung bezeichnet Baal-Sebub als die in Ekron verehrte Gottheit.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: etwa weil es in Israel keinen Gott gibt
  rationale: Die rhetorische Frage tadelt den König. „Etwa weil“ bewahrt ihren vorwurfsvollen Charakter und die kausale Verknüpfung.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: bei dem man sein Wort erfragen könnte
  rationale: Die Wiedergabe behält דָּבָר („Wort“, auch „Botschaft/Ausspruch“) ausdrücklich bei, ohne es auf eine bestimmte Art von Offenbarung festzulegen.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: Von dem Bett, auf das du gestiegen bist, wirst du nicht mehr herunterkommen
  rationale: „Hinaufsteigen“ und „herunterkommen“ bilden im Hebräischen ein bewusstes Gegensatzpaar. Die Voranstellung des Bettes wird in natürlichem Deutsch weitgehend bewahrt; שָׁם ist im relativen Satz resumptiv und muss nicht zusätzlich mit „dort“ wiedergegeben werden.
- source_word: כִּי מוֹת תָּמוּת
  choice: sondern du wirst ganz gewiss sterben
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Gewissheit des Todesurteils. „Ganz gewiss“ gibt diese Emphase wieder; „sondern“ verdeutlicht den im Zusammenhang liegenden Gegensatz zum Herunterkommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Sinn von בִּדְבָרוֹ
  choice: sein Wort erfragen
  alternative: ihn befragen / seinen Rat suchen
  rationale: Der Text nennt ausdrücklich Gottes „Wort“ beziehungsweise seinen Ausspruch. Die Übersetzung bewahrt diese Formulierung und lässt offen, ob ein Orakel, eine prophetische Botschaft oder allgemein göttliche Auskunft gemeint ist.
- issue: Bezeichnung Baal-Sebub
  choice: Baal-Sebub
  alternative: Baal-Sebul
  rationale: „Baal-Sebub“ entspricht der masoretischen Form des vorliegenden hebräischen Textes. Die verwandte spätere Form „Baal-Sebul“ wird nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Botenformel. Die rhetorische Frage, die Voranstellung des Bettes und die emphatische Todesankündigung bleiben erhalten. Archaische Formen werden vermieden, außer dem im heutigen Bibeldeutsch weiterhin verständlichen „sprach“.
