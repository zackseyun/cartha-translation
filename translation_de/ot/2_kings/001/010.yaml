  text: וַ/יַּעֲנֶ֣ה אֵלִיָּ֗הוּ וַ/יְדַבֵּר֮ אֶל שַׂ֣ר הַ/חֲמִשִּׁים֒ וְ/אִם אִ֤ישׁ אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: de
  text: 'Elia antwortete dem Hauptmann über fünfzig: »Wenn ich aber ein Mann Gottes bin, soll Feuer vom Himmel herabkommen und dich und deine fünfzig Männer verzehren!« Da kam Feuer vom Himmel herab und verzehrte ihn und seine fünfzig Männer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: Hauptmann über fünfzig
  rationale: Gibt die militärische Führungsfunktion und die ausdrücklich genannte Einheitengröße wieder, ohne einen modernen exakten Dienstgrad aufzuzwingen.
- source_word: וְאִם
  choice: Wenn ... aber
  rationale: Bewahrt sowohl die konditionale Bedeutung von אִם als auch die kontrastive Nuance des vorangestellten וְ im Zusammenhang.
- source_word: תֵּרֶד אֵשׁ מִן־הַשָּׁמַיִם
  choice: soll Feuer vom Himmel herabkommen
  rationale: Das deutsche »soll« bildet hier den jussivischen Sinn der Verbform natürlich ab.
- source_word: וְתֹאכַל
  choice: und ... verzehren
  rationale: »Verzehren« ist eine natürliche und würdige Wiedergabe des Bildes, dass das Feuer Menschen vollständig aufzehrt.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: deine / seine fünfzig Männer
  rationale: Im Hebräischen bezeichnet die Zahl metonymisch die Fünfzigerschaft; »Männer« macht den deutschen Bezug verständlich, ohne neue inhaltliche Bestimmung hinzuzufügen.
theological_decisions:
- issue: Bedingung und göttliche Bestätigung von Elias Stellung
  choice: »Wenn ich aber ein Mann Gottes bin«
  alternative: »Weil ich ein Mann Gottes bin«
  rationale: Der hebräische Text formuliert ausdrücklich eine Bedingung. Sie wird nicht kausal umgedeutet, sodass die rhetorische Spannung und die anschließende Bestätigung durch das Feuer erhalten bleiben.
- issue: Charakter des Ausspruchs über das Feuer
  choice: »soll Feuer ... herabkommen«
  alternative: »Feuer wird ... herabkommen«
  rationale: Die Verbform wird als jussivischer Ausspruch bzw. Anruf wiedergegeben, nicht bloß als neutrale Zukunftsvorhersage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die im Hebräischen formelhafte Doppelung »antwortete und sprach« wird natürlich mit »antwortete« wiedergegeben; die Wiederholung des vom Himmel herabkommenden Feuers bleibt erhalten.
