  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und Aussage zuverlässig wieder: Elia erwidert dem Anführer einer Fünfzigerschaft, formuliert die Bedingung »Wenn ich aber ein Mann Gottes bin«, spricht den jussivischen Wunsch/Ausspruch über herabkommendes Feuer aus, und der Erzähler berichtet dessen Eintreten. »deine/seine fünfzig Männer« macht die im Hebräischen metonymisch verwendete Zahl verständlich, ohne den Sinn zu verändern.'
  naturalness: Modernes, würdiges und flüssiges Standarddeutsch. »Hauptmann über fünfzig« ist leicht traditionssprachlich, aber verständlich und für die militärische Funktion präziser als ein moderner Dienstgrad. Die Auslassung der formelhaften Doppelung »antwortete und sprach« zugunsten von »antwortete« ist idiomatisch vertretbar.
  terminology: »Mann Gottes«, »Feuer vom Himmel« und »verzehren« sind sachgerecht, registerangemessen und theologisch nicht überdeutet. »Wenn ich aber« bewahrt die Konditionalität von אִם und die anschließende/kontrastierende Nuance von וְ, entsprechend dem englischen Audit trail »But if«.
