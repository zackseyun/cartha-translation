base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: de
  text: 'Da schickte er erneut einen weiteren Hauptmann über fünfzig Mann mit seinen fünfzig Männern zu ihm. Er antwortete ihm und sagte: „Mann Gottes, so spricht der König: Komm schnell herunter![a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geh schnell hinunter!“ Das hebräische Verb bedeutet allgemein „hinabsteigen, hinuntergehen“. „Komm herunter“ gibt die Aufforderung aus der Perspektive des unten stehenden Boten an Elia wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: erneut
  rationale: Die Verbindung mit dem folgenden Verb kennzeichnet hier die Wiederholung der Handlung, nicht eine körperliche Rückkehr.
- source_word: שַׂר חֲמִשִּׁים
  choice: Hauptmann über fünfzig Mann
  rationale: Der Ausdruck bezeichnet einen militärischen Befehlshaber über eine Einheit von fünfzig Männern; die Ergänzung „Mann“ macht die Funktion im heutigen Deutsch klar.
- source_word: אַחֵר
  choice: einen anderen
  rationale: Gemeint ist ein weiterer Befehlshaber, der den zuvor gesandten ersetzt.
- source_word: וַחֲמִשָּׁיו
  choice: mit seinen fünfzig Männern
  rationale: Das hebräische „und seine fünfzig“ bezeichnet idiomatisch die begleitende Truppe; im Deutschen ist „mit“ natürlich und eindeutig.
- source_word: וַיַּעַן וַיְדַבֵּר
  choice: Dieser ergriff das Wort und sagte
  rationale: Die häufige hebräische Redeeinleitung wird würdig und natürlich wiedergegeben. „Dieser“ macht den Hauptmann als Sprecher deutlich.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Der etablierte Titel für Elia bleibt erhalten und fungiert hier als direkte Anrede.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: so spricht der König
  rationale: Diese Formulierung bewahrt den formellen und autoritativen Charakter der Botenformel.
- source_word: מְהֵרָה
  choice: schnell
  rationale: Das Adverb bringt die Dringlichkeit des königlichen Befehls klar zum Ausdruck.
- source_word: רֵדָה
  choice: Komm herunter
  rationale: Der hebräische Imperativ bedeutet allgemein „hinabsteigen/heruntergehen“. Da der Hauptmann von unten zu Elia spricht, ist „komm herunter“ im Deutschen perspektivisch natürlich.
