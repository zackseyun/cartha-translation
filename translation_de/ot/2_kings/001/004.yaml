base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: de
  text: 'Darum spricht Jahwe: »Von dem Bett, auf das du hinaufgestiegen bist, wirst du nicht herunterkommen; denn du wirst ganz gewiss sterben.« Dann ging Elia fort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Zurechtweisung und klingt im modernen Deutschen natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: sagt Jahwe
  rationale: Gibt die prophetische Botenformel knapp und gegenwartsnah wieder; der Gottesname wird ausdrücklich als Jahwe wiedergegeben.
- source_word: הַמִּטָּה
  choice: das Bett
  rationale: Die Grundbedeutung ist Bett oder Liege; »Bett« ist im Zusammenhang natürlich, ohne durch »Krankenbett« zusätzliche Deutung einzutragen.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: auf das du hinaufgestiegen bist
  rationale: Bewahrt den auffälligen Gegensatz von Hinaufsteigen und Herunterkommen. Das resumptive שׁם wird im Deutschen nicht eigens wiederholt, da dies unnatürlich wäre.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: wirst du nicht mehr herunterkommen
  rationale: Bewahrt die räumliche Gegenüberstellung zu עלה; »mehr« macht im Deutschen idiomatisch deutlich, dass er das Bett nicht lebend verlassen wird.
- source_word: כִּי מוֹת תָּמוּת
  choice: denn du wirst ganz gewiss sterben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Gewissheit des Todes.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: Dann ging Elia fort
  rationale: Das narrative וַ führt die Handlung weiter; »ging fort« gibt הלך im Zusammenhang natürlicher wieder als das unvollständige »ging«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Tragweite der Todesankündigung
  choice: ganz gewiss sterben
  alternative: des Todes sterben
  rationale: Die hebräische Verstärkung bezeichnet die sichere Erfüllung der Ankündigung und wird nicht als Aussage über eine besondere Art des Todes überinterpretiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante hebräische Antithese zwischen עלה (hinaufsteigen) und ירד (herunterkommen) bleibt erhalten; unnötig hebraisierende Syntax wird vermieden.
