source:
  edition: WLC
  text: וַ/יְדַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶל אֵ֣לִיָּ֔הוּ רֵ֣ד אוֹת֔/וֹ אַל תִּירָ֖א מִ/פָּנָ֑י/ו וַ/יָּ֛קָם וַ/יֵּ֥רֶד אוֹת֖/וֹ אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: de
  text: 'Da sprach der Engel Jahwes zu Elia: „Geh mit ihm hinab. Fürchte dich nicht vor ihm.“ Da stand Elia auf und ging mit ihm zum König hinab.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten; im Zusammenhang einer göttlichen Weisung ist »Engel« die natürliche Wiedergabe. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: רֵד אוֹתוֹ
  choice: Geh mit ihm hinab
  rationale: Das Objektpronomen bei ירד bezeichnet hier idiomatisch die Begleitung; »mit ihm« gibt den Sinn im Deutschen klar wieder.
- source_word: אַל תִּירָא מִפָּנָיו
  choice: Fürchte dich nicht vor ihm
  rationale: Die Wendung mit מן und פנים bezeichnet hier die Person, vor der Elia keine Angst haben soll. »Sich vor jemandem fürchten« ist zugleich idiomatisch und nahe an der hebräischen Formulierung.
- source_word: וַיָּקָם
  choice: Da stand Elia auf
  rationale: Das Verb bezeichnet das Aufstehen als unmittelbare Reaktion. Der Name wird zur eindeutigen Bezugnahme ergänzt, ohne neue Information einzuführen.
- source_word: וַיֵּרֶד אוֹתוֹ אֶל הַמֶּלֶךְ
  choice: und ging mit ihm zum König hinab
  rationale: Die Übersetzung bewahrt Begleitung, Bewegungsrichtung und Ziel; die deutsche Wortstellung ist natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Identität von מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Die Übersetzung folgt dem im Erzählzusammenhang naheliegenden Sinn »Engel«, legt aber keine weitergehende dogmatische Identifikation dieser Gestalt fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bewegung »hinab« und die knappe hebräische Erzählfolge bleiben erhalten. Da »Fürchte dich nicht vor ihm« sowohl natürlich als auch formnah ist, ist keine Fußnote erforderlich.
