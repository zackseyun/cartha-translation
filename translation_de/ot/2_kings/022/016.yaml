  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: de
  text: 'So spricht Jahwe: Siehe, ich bringe Unheil[a] über diesen Ort und über seine Bewohner: alle Worte des Buches, das der König von Juda gelesen hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Unglück“ oder „Katastrophe“. Das hebräische Wort bezeichnet hier das Unheil des Gerichts, nicht moralisch Böses.'
    reason: lexikalische Alternative und Vermeidung eines möglichen theologischen Missverständnisses
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die prophetische Botenformel in einer geläufigen, würdevollen deutschen Form; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Kennzeichnet die feierliche Unmittelbarkeit der göttlichen Ankündigung. „Siehe“ erhält den prophetischen Ton, ohne dem Satz zusätzlichen Inhalt zu geben.
- source_word: מֵבִיא
  choice: ich bringe
  rationale: Das Partizip bezeichnet eine unmittelbar bevorstehende beziehungsweise bereits entschiedene Handlung; das deutsche Präsens bewahrt diese Eindringlichkeit.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Zusammenhang bezeichnet das Wort eine hereinbrechende Gerichtskatastrophe, nicht moralische Bosheit. „Unheil“ ist im Deutschen klar, idiomatisch und dem prophetischen Register angemessen.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: über diesen Ort
  rationale: Bei angekündigtem Gericht gibt „über“ die Zielrichtung des hebräischen Ausdrucks natürlich wieder.
- source_word: וְעַל יֹשְׁבָיו
  choice: und über seine Bewohner
  rationale: Gibt die substantivierte Wendung „die in ihm Wohnenden“ knapp und formal passend wieder.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: alle Worte des Buches
  rationale: Bewahrt die konkrete Formulierung „Worte“ und damit den Bezug auf die im Buch ausgesprochenen Gerichtsankündigungen, statt sie erklärend zu umschreiben.
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: das der König von Juda gelesen hat
  rationale: Die Relativkonstruktion bleibt erhalten; das Perfekt bezeichnet im natürlichen Deutschen die vorausgegangene, für die Gegenwart relevante Handlung.
theological_decisions:
- issue: Bedeutung von רָעָה als Gegenstand göttlichen Handelns
  choice: Unheil
  alternative: Böses; Unglück; Katastrophe
  rationale: Der Kontext handelt von angekündigtem Bundesgericht. „Unheil“ bezeichnet die verhängte Not, ohne den missverständlichen Eindruck zu erwecken, Gott tue moralisch Böses.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname macht den im hebräischen Text ausdrücklich stehenden Bundesnamen sichtbar.
- issue: Verhältnis von „Unheil“ zu „allen Worten des Buches“
  choice: Die knappe appositionelle Fügung wird beibehalten
  alternative: nämlich alles, was in dem Buch angekündigt ist
  rationale: Der hebräische Satz ist syntaktisch gedrängt. Die Übersetzung bewahrt diese Form und löst nicht ausdrücklich auf, ob die „Worte“ als Inhalt beziehungsweise Erfüllung des angekündigten Unheils zu verstehen sind.
translation_notes:
  register: Modernes Standarddeutsch mit feierlich-prophetischem Ton. „Siehe“ ist bewusst gehoben, aber in diesem festen Verkündigungszusammenhang verständlich. Die gedrängte Schlussfügung folgt der hebräischen Syntax und bewahrt deren Spannung.
