id: 2KI.22.7
reference: 2 Kings 22:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַ֚ךְ לֹא יֵחָשֵׁ֣ב אִתָּ֔/ם הַ/כֶּ֖סֶף הַ/נִּתָּ֣ן עַל יָדָ֑/ם כִּ֥י בֶ/אֱמוּנָ֖ה הֵ֥ם עֹשִֽׂים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: de
  text: Doch über das Geld[a], das ihnen anvertraut wird, soll keine Abrechnung von ihnen verlangt werden[b], denn sie handeln zuverlässig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: das Silber. Silber diente als Zahlungsmittel und bezeichnet hier Geld.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: Das Geld soll bei ihnen nicht nachgerechnet werden. Gemeint ist, dass von den Männern, die mit den Mitteln umgingen, keine Abrechnung verlangt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Leitet gegenüber der vorherigen Anweisung eine Ausnahme beziehungsweise Einschränkung ein und gibt die adversative Kraft natürlich wieder.
- source_word: יֵחָשֵׁב אִתָּם
  choice: soll keine Abrechnung von ihnen verlangt werden
  rationale: Das Niphal von חשׁב bezeichnet hier im finanziellen Zusammenhang das Abrechnen oder Rechenschaftfordern. Die Formulierung gibt den kontextuellen Sinn im heutigen Deutsch klar wieder.
- source_word: הַכֶּסֶף
  choice: das Geld
  rationale: כֶּסֶף bedeutet wörtlich „Silber“, bezeichnet in finanziellen Zusammenhängen aber gewöhnlich Geld. Im Deutschen ist „Geld“ hier natürlich und eindeutig.
- source_word: הַנִּתָּן עַל יָדָם
  choice: das ihnen anvertraut wird
  rationale: Die Wendung lautet bildlich „das in/auf ihre Hand gegeben wird“. „Anvertraut“ macht sowohl die Übergabe als auch die Verantwortung deutlich, ohne den Sinn zu erweitern.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung dafür ein, weshalb keine Abrechnung verlangt wird.
- source_word: בֶאֱמוּנָה
  choice: zuverlässig
  rationale: אֱמוּנָה bezeichnet hier Vertrauenswürdigkeit und gewissenhaftes Verhalten, nicht Glauben im lehrmäßigen Sinn.
- source_word: הֵם עֹשִׂים
  choice: sie handeln
  rationale: Das wörtliche „sie tun“ bezeichnet hier ihre Verhaltensweise bei der Verwaltung der Mittel; „handeln“ ist knapp und idiomatisch.
