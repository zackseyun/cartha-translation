source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes recht war, und ging in allem den Weg seines Vaters David[a]; er wich weder nach rechts noch nach links ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vater“ bezeichnet hier im weiteren Sinn einen Vorfahren beziehungsweise den Stammvater der Königsdynastie.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Er tat, was ... recht war
  rationale: Das substantivierte Adjektiv הַיָּשָׁר bezeichnet das, was als richtig gilt; die Formulierung ist im Deutschen natürlich und bewahrt die moralische Wertung.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige deutsche Wendung erhält das hebräische Bild einer Beurteilung aus Gottes Sicht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: und ging ganz auf dem Weg
  rationale: „Gehen“ und „Weg“ bewahren das hebräische Bild für die Lebensführung. „Ganz“ gibt כָל in Verbindung mit dem singularischen דֶּרֶךְ idiomatisch als vollständige Übereinstimmung wieder.
- source_word: דָּוִד אָבִיו
  choice: seines Vaters David
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten; „Vater“ wird hier dynastisch im weiteren Sinn für einen Vorfahren gebraucht und deshalb in einer Fußnote erläutert.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: Er wich weder nach rechts noch nach links ab
  rationale: Die deutsche weder-noch-Konstruktion gibt die Verneinung beider Richtungen klar wieder und erhält zugleich das Wegbild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Umschrift „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung Davids als Josias Vater
  choice: seines Vaters David mit Fußnote
  alternative: seines Vorfahren David
  rationale: אָב kann auch einen Vorfahren oder dynastischen Stammvater bezeichnen. Die Übersetzung bewahrt die konkrete hebräische Ausdrucksweise, während die Fußnote ein mögliches modernes Missverständnis verhindert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wegmetaphorik des Hebräischen bleibt durch „ging“, „Weg“ und „wich ... ab“ zusammenhängend erhalten; die beiden hebräischen Satzglieder werden zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
