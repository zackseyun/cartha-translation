source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֣ה הַ/כֹּהֵ֡ן וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַכְבּ֨וֹר בֶּן מִיכָיָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סֹּפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: de
  text: 'Dann befahl der König dem Priester Hilkija[a], Ahikam, dem Sohn Schafans, Achbor, dem Sohn Michajas, dem Schreiber Schafan[b], und Asaja, dem Diener des Königs[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier „der Priester“, nicht ausdrücklich „der Hohe Priester“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Sekretär Schafan“. Das hebräische Wort kann einen Schreiber oder einen Verwaltungssekretär bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Asaja, dem Beamten des Königs“. Wörtlich steht „Diener“; am Königshof kann damit ein Amtsträger im Dienst des Königs gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl
  rationale: Die waw-konsekutive Verbform erzählt eine vergangene Handlung; „befahl“ gibt die Autorität des königlichen Auftrags natürlich und präzise wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Wörtliche und im Deutschen natürliche Wiedergabe des bestimmten Substantivs als Satzsubjekt.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: dem Priester Hilkija
  rationale: Der hebräische Text nennt Hilkija hier „den Priester“, nicht ausdrücklich „den Hohen Priester“. Die deutsche Wortstellung ist idiomatisch und bewahrt den Titel.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikam, dem Sohn Schafans
  rationale: „Sohn“ gibt בֶּן unmittelbar wieder; der deutsche Genitiv kennzeichnet die Abstammung natürlich.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: Achbor, dem Sohn Michajas
  rationale: Die Namen folgen geläufigen deutschen Bibelnamensformen; die Abstammungsangabe wird transparent wiedergegeben.
- source_word: שָׁפָן הַסֹּפֵר
  choice: dem Schreiber Schafan
  rationale: סֹפֵר kann im königlichen Verwaltungszusammenhang einen Schreiber oder Sekretär bezeichnen. „Schreiber“ wahrt die Grundbedeutung; die Alternative wird in einer Fußnote genannt.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaja, dem Diener des Königs
  rationale: עֶבֶד bedeutet wörtlich „Diener“, kann am Königshof jedoch auch einen Amtsträger bezeichnen. Die direkte Wiedergabe bleibt im Haupttext, die kontextuelle Alternative in der Fußnote.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den Inhalt des Befehls im folgenden Vers ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als die formelhafte Wiedergabe „indem er sagte“.
theological_decisions:
- issue: Amtstitel Hilkijas
  choice: Priester
  alternative: Hoher Priester
  rationale: הַכֹּהֵן bezeichnet ihn in diesem Vers lediglich als „den Priester“. Ein höherer Amtstitel soll nicht aus dem Kontext in den Wortlaut eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung wird durch Kommas und Appositionen klar gegliedert. Der Doppelpunkt stellt die Verbindung zum Inhalt des Befehls im folgenden Vers her. Alle sachlich relevanten Bedeutungsalternativen des hebräischen Textes werden in Fußnoten bewahrt.
