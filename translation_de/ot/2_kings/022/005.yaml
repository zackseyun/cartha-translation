base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: de
  text: Er soll es den Werkleuten anvertrauen,[a] die im Haus Jahwes eingesetzt sind, und sie sollen es den Werkleuten geben, die im Haus Jahwes sind, damit sie die Schäden am Haus ausbessern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er soll es in die Hand der Werkleute geben.“ Die hebräische Wendung meint, dass es ihnen zur Verwaltung übergeben wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um den Schaden des Hauses zu stärken“. Gemeint ist, die Schäden am Gebäude zu beheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתנה עַל יַד
  choice: Er soll es … anvertrauen
  rationale: נתן bedeutet grundsätzlich „geben“; zusammen mit עַל יַד bezeichnet die Wendung jedoch die Übergabe in die Verfügungsgewalt oder Obhut anderer. „Anvertrauen“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: Werkleute
  rationale: Wörtlich „die Ausführenden der Arbeit“. „Werkleute“ ist knapp, würdevoll und bezeichnet hier die an den Tempelarbeiten Beteiligten.
- source_word: הַמֻּפְקָדִים
  choice: die … eingesetzt sind
  rationale: Die passive Form von פקד bezeichnet Personen, die eingesetzt oder mit Verantwortung betraut worden sind, ohne ihren genauen Rang festzulegen.
- source_word: בבית יהוה
  choice: im Haus Jahwes
  rationale: בית wird als „Haus“ wiedergegeben, und der Gottesname יהוה erscheint als „Jahwe“. So bleibt die konkrete hebräische Ausdrucksweise erhalten.
- source_word: וְיִתְּנוּ אֹתוֹ
  choice: Diese sollen es … geben
  rationale: Die pluralische Verbform setzt die Anweisung fort und beschreibt die nächste Stufe der Weitergabe.
- source_word: אֲשֶׁר בְּבֵית יהוה
  choice: die im Haus Jahwes arbeiten
  rationale: Die relative Bestimmung nennt die Werkleute im Haus Jahwes. Das Verb „arbeiten“ nimmt die bereits ausdrücklich genannte Bezeichnung als Ausführende der Arbeit natürlich auf.
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: damit sie die Schäden am Haus ausbessern
  rationale: Wörtlich geht es darum, die Schadstellen oder Brüche des Hauses zu „stärken“. Im baulichen Zusammenhang bezeichnet dies das Ausbessern vorhandener Schäden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzfolge wahrt die Übergabekette des hebräischen Textes; „Haus Jahwes“ bewahrt die wiederholte Bildsprache, während „ausbessern“ den baulichen Kontext idiomatisch ausdrückt.
