  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: de
  text: „Darum, siehe, ich werde dich zu deinen Vätern versammeln, und du wirst in Frieden[a] in deinen Gräbern beigesetzt werden. Deine Augen werden all das Unheil nicht sehen, das ich über diesen Ort bringen werde.“ Sie erstatteten dem König Bericht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Frieden“. Gemeint sein kann, dass Josia sterben würde, bevor das angekündigte Gericht eintraf; die Wendung muss nicht die genaue Art seines Todes beschreiben.'
    reason: Bewahrt die lexikalische Alternative und die Spannung zum Bericht über Josias späteren Tod im Kampf.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus Josias Demut und Reaktion im vorangehenden Zusammenhang; im heutigen Deutsch ist „Darum“ klar und würdevoll.
- source_word: הִנְנִי
  choice: siehe
  rationale: Bewahrt den feierlichen, hinweisenden Nachdruck der göttlichen Ankündigung, ohne ihn paraphrasierend aufzulösen.
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  choice: ich werde dich … versammeln / du wirst … versammelt werden
  rationale: Die Wiederholung desselben deutschen Wortstamms bildet die hebräische Wiederaufnahme von אסף nach und erhält zugleich die Todesformel.
- source_word: עַל אֲבֹתֶיךָ
  choice: zu deinen Vätern
  rationale: Gibt die traditionelle hebräische Wendung für die Vereinigung mit den verstorbenen Vorfahren knapp wieder; „Väter“ bewahrt dabei den familiären Ausdruck.
- source_word: קִבְרֹתֶיךָ
  choice: zu deinen Gräbern
  rationale: Bewahrt den im Hebräischen stehenden Plural, auch wenn die Wendung im Deutschen ungewöhnlicher klingt.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Gibt das Substantiv שָׁלוֹם wörtlich wieder und lässt offen, ob die Aussage die Todesart oder vor allem das Verschontbleiben vom kommenden Gericht bezeichnet.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Deine Augen werden … nicht sehen
  rationale: Erhält die ausdrückliche und anschauliche Nennung der Augen als Subjekt.
- source_word: הָרָעָה
  choice: das Unheil
  rationale: Im Gerichtskontext bezeichnet רָעָה eine kommende Katastrophe und nicht sittliche Bosheit; „Unheil“ ist dafür im Deutschen natürlich und angemessen.
- source_word: מֵבִיא עַל
  choice: über … bringen werde
  rationale: Gibt das unmittelbar bevorstehende göttliche Handeln als Zukunft wieder und entspricht einer natürlichen deutschen Verbindung mit „Unheil“.
- source_word: הַמָּקוֹם הַזֶּה
  choice: diesen Ort
  rationale: Eine direkte, bewusst umfassende Wiedergabe, die den kontextuellen Bezug auf Jerusalem beziehungsweise den betroffenen Bereich nicht enger festlegt als der Ausgangstext.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: Da überbrachten sie dem König die Antwort
  rationale: Gibt die hebräische Berichtsformel in natürlichem modernem Deutsch wieder und bewahrt den Gedanken der zurückgebrachten Botschaft.
theological_decisions:
- issue: Bedeutung von „in Frieden“ angesichts von Josias späterem Tod im Kampf (2. Könige 23,29)
  choice: Die Formulierung „in Frieden“ bleibt stehen und wird nicht harmonisierend erklärt.
  alternative: „friedlich“ als eindeutige Beschreibung der Art seines Todes oder eine ausdeutende Formulierung wie „bevor das Unheil kommt“
  rationale: Der hebräische Wortlaut sagt „in Frieden“. Der folgende Satz kann dies im Sinn des Verschontbleibens vom angekündigten Unheil erläutern, legt aber die genaue Todesart nicht ausdrücklich fest. Die Spannung zum späteren Bericht soll deshalb erhalten bleiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Das feierliche „siehe“ und die parallele Formulierung „versammeln/versammelt werden“ bewahren zentrale Merkmale des Hebräischen; ungewöhnliche Wendungen werden nur dort beibehalten, wo sie inhaltlich oder literarisch bedeutsam sind.
