base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: de
  text: 'Im achtzehnten Regierungsjahr des Königs Josia schickte der König den Schreiber Schafan, den Sohn Azaljas, des Sohnes Meschullams, zum Haus Jahwes[a] mit dem Auftrag:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Tempel Jahwes“. Wörtlich: „zum Haus Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: Im achtzehnten Regierungsjahr König Josias
  rationale: Die hebräische Erzählungsformel leitet eine neue Szene ein; im Deutschen gibt die schlichte Zeitangabe den Anschluss natürlich wieder. „Regierungsjahr“ verdeutlicht die übliche Königsdatierung.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: schickte der König
  rationale: Die Wiederholung von „der König“ nach der Datierung wird entsprechend dem Hebräischen beibehalten.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: Schafan, einen Sohn Azaljas und Enkel Meschullams
  rationale: Die Abstammungsfolge wird in natürlichem Deutsch eindeutig wiedergegeben.
- source_word: הַסֹּפֵר
  choice: den Schreiber
  rationale: „Schreiber“ ist die transparente Grundbedeutung; je nach historischem Amt wären auch „Sekretär“ oder „Staatsschreiber“ denkbar.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Bewahrt das Bild des hebräischen Ausdrucks „Haus JHWHs“; gemeint ist der Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵאמֹר
  choice: 'und ließ ihm sagen:'
  rationale: Leitet den in den folgenden Versen wiedergegebenen Auftrag in idiomatischem Deutsch ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt erzählerisch klar; die Amtsbezeichnung „Schreiber“ und das konkrete Bild „Haus Jahwes“ halten sich eng an den hebräischen Wortlaut.
