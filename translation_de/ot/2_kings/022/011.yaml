  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֶת דִּבְרֵ֖י סֵ֣פֶר הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: de
  text: Als der König die Worte des Gesetzbuches[a] hörte, zerriss er seine Kleider.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gesetzesrolle“. Das hebräische Wort סֵפֶר kann eine Schriftrolle, ein Buch oder allgemein ein schriftliches Dokument bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als … hörte
  rationale: Die Erzählungsfortsetzung mit וַיְהִי und die durch כ mit Infinitiv ausgedrückte Zeitangabe werden im Deutschen natürlich durch einen temporalen Nebensatz wiedergegeben.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: דִּבְרֵי
  choice: die Worte des
  rationale: Die Form bezeichnet hier die verlesenen Worte beziehungsweise den Wortlaut des aufgefundenen Dokuments; die formale Verbindung zum Hebräischen bleibt erhalten.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Gesetzbuch
  rationale: סֵפֶר bezeichnet ein schriftliches Dokument, historisch wohl eine Schriftrolle; תּוֹרָה meint hier die maßgebliche Weisung beziehungsweise das Gesetz. „Gesetzbuch“ ist im Deutschen klar und idiomatisch, ohne die mögliche materielle Form zu leugnen.
- source_word: וַיִּקְרַע
  choice: zerriss
  rationale: קרע bezeichnet das Zerreißen als Ausdruck von Erschütterung, Trauer oder Bestürzung; „zerriss“ ist die geläufige, würdige deutsche Wiedergabe.
- source_word: בְּגָדָיו
  choice: seine Kleider
  rationale: Bewahrt Numerus und Possessivbezug und entspricht dem traditionellen Trauergestus, ohne ihn im Haupttext auszudeuten.
