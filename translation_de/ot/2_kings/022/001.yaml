source:
  edition: WLC
  text: בֶּן שְׁמֹנֶ֤ה שָׁנָה֙ יֹאשִׁיָּ֣הוּ בְ/מָלְכ֔/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְדִידָ֥ה בַת עֲדָ֖יָה מִ/בָּצְקַֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: de
  text: Josia war acht Jahre alt, als er König wurde, und regierte einunddreißig Jahre in Jerusalem. Seine Mutter hieß Jedida; sie war eine Tochter Adajas aus Bozkat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: war acht Jahre alt
  rationale: Die wörtliche hebräische Wendung »ein Sohn von acht Jahren« ist eine feste Altersangabe und wird im modernen Deutschen natürlich wiedergegeben.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet den Zeitpunkt seines Regierungsantritts; diese Formulierung ist im Deutschen klar und idiomatisch.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה מָלַךְ
  choice: regierte einunddreißig Jahre
  rationale: מָלַךְ bezeichnet das Ausüben der Königsherrschaft; die hebräische Zahlform wird in üblicher deutscher Wortstellung wiedergegeben.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Direkte Ortsangabe zum Sitz seiner Regierung.
- source_word: וְשֵׁם אִמּוֹ יְדִידָה
  choice: Seine Mutter hieß Jedida
  rationale: Die genealogische Namensformel wird in natürlichem modernem Deutsch wiedergegeben; der Personenname wird transliteriert.
- source_word: בַת עֲדָיָה
  choice: eine Tochter Adajas
  rationale: Die Abstammungsangabe wird idiomatisch wiedergegeben; der Genitiv kennzeichnet Adaja als Vater.
- source_word: מִבָּצְקַת
  choice: aus Bozkat
  rationale: Die Präposition מִן bezeichnet hier die Herkunft; »aus« gibt dies im Deutschen präzise wieder.
