source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: de
  text: Geht und befragt Jahwe[a] für mich, für das Volk und für ganz Juda über die Worte dieses Buches, das gefunden worden ist. Denn groß ist Jahwes Zorn, der gegen uns entbrannt ist, weil unsere Väter[b] nicht auf die Worte dieses Buches gehört haben, um nach allem zu handeln, was über uns[c] geschrieben steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sucht Jahwe“ beziehungsweise „holt bei Jahwe Auskunft ein“. Das hebräische Verb kann allgemein die Suche nach Gott oder, wie wahrscheinlich hier, eine förmliche Anfrage an ihn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unsere Vorfahren“. Wörtlich steht im Hebräischen „unsere Väter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „für uns“ beziehungsweise „was uns betrifft“. Die hebräische Formulierung lässt den genauen Bezug offen.'
    reason: ambiguity
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: befragt Jahwe
  rationale: דרשׁ bezeichnet mit Gott als Objekt hier die förmliche Einholung göttlicher Auskunft angesichts des gefundenen Buches. „Befragt“ gibt diesen Zusammenhang natürlicher und genauer wieder als das allgemeinere „sucht“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: für mich, für das Volk und für ganz Juda
  rationale: בעד bezeichnet hier stellvertretendes Handeln beziehungsweise eine Anfrage zugunsten der Genannten. Das dreifache „für“ bewahrt die Reihung des Hebräischen.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: wegen der Worte dieses Buches, das gefunden worden ist
  rationale: „Wegen“ bezeichnet den Anlass der Anfrage; „Worte“ bewahrt den konkreten Textbezug von דברי. Der Relativsatz gibt das Partizip הנמצא in natürlichem Deutsch wieder.
- source_word: חֲמַת יְהוָה
  choice: Jahwes Zorn
  rationale: חֵמָה bezeichnet heftigen, brennenden Zorn und hat hier gerichtlichen Ernst. „Zorn“ ist würdig und idiomatisch.
- source_word: נִצְּתָה בָנוּ
  choice: gegen uns entbrannt ist
  rationale: Das Verb beschreibt das Entzünden oder Entbrennen. „Gegen uns“ bringt im Kontext die feindliche Ausrichtung des Zorns zum Ausdruck.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: unsere Väter nicht ... gehört haben
  rationale: שׁמע umfasst Hören mit der Erwartung des Gehorsams. „Gehört“ wahrt den Grundsinn, während der folgende Zwecksatz die praktische Befolgung ausdrückt. „Väter“ entspricht der ausdrücklich maskulinen Form.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: um nach allem zu handeln, was ... geschrieben steht
  rationale: Der Infinitiv bezeichnet das Handeln, auf das das Hören zielen sollte. „Nach allem handeln“ bewahrt sowohl die Vergleichspräposition כְּ als auch die umfassende Bedeutung von כל.
- source_word: עָלֵינוּ
  choice: über uns
  rationale: Die knappe Präposition kann bezeichnen, dass das Geschriebene die Gemeinschaft betrifft oder für sie gilt. „Über uns“ hält diese Mehrdeutigkeit offen, ohne den Inhalt ausschließlich als Gebot oder Gericht festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Bezeichnung אֲבֹתֵינוּ
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die hebräische Form ist ausdrücklich maskulin und bezeichnet die Väter beziehungsweise Vorväter der Nation. Die Hauptübersetzung erhält diese Form; die mögliche allgemeinere Bedeutung wird in einer Fußnote genannt.
- issue: Bezug von עָלֵינוּ
  choice: was über uns geschrieben steht
  alternative: was für uns geschrieben steht / was uns betrifft
  rationale: Die Präposition lässt offen, ob das Geschriebene die gegenwärtige Gemeinschaft betrifft, für sie gilt oder sich gegen sie richtet. Die Übersetzung vermeidet eine vorschnelle theologische Eingrenzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit quellennaher Satzführung. Die feierliche Wiederholung „für mich, für das Volk und für ganz Juda“ bleibt erhalten. „Befragt“ und „entbrannt“ entsprechen dem ernsten königlichen und gerichtlichen Kontext, ohne altertümlich zu wirken.
