  to: Geht und befragt Jahwe[a] für mich, für das Volk und für ganz Juda über die Worte dieses Buches, das gefunden worden ist. Denn groß ist Jahwes Zorn, der gegen uns entbrannt ist, weil unsere Väter[b] nicht auf die Worte dieses Buches gehört haben, um nach allem zu handeln, was über uns[c] geschrieben steht.
