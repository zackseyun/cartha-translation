  text: וַ/יַּגֵּ֞ד שָׁפָ֤ן הַ/סֹּפֵר֙ לַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר סֵ֚פֶר נָ֣תַן לִ֔/י חִלְקִיָּ֖ה הַ/כֹּהֵ֑ן וַ/יִּקְרָאֵ֥/הוּ שָׁפָ֖ן לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: de
  text: 'Dann berichtete der Schreiber Schafan dem König: »Der Priester Hilkija hat mir ein Buch[a] gegeben.« Und Schafan las es dem König vor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Schriftrolle«. Das hebräische Wort kann allgemein ein Schriftstück bezeichnen und legt dessen materielle Form nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: berichtete
  rationale: Das Hifil von נגד bedeutet hier, etwas mitzuteilen oder zu berichten. »Berichtete« passt natürlich zur höfischen Erzählsituation, ohne übermäßige Förmlichkeit einzutragen.
- source_word: הַסֹּפֵר
  choice: der Schreiber
  rationale: סֹפֵר kann einen Schreiber beziehungsweise königlichen Sekretär bezeichnen. »Schreiber« bewahrt die historische Amtsbezeichnung und ist im Deutschen verständlich.
- source_word: סֵפֶר
  choice: ein Buch
  rationale: סֵפֶר bezeichnet allgemein ein Schriftstück oder Buch und legt die materielle Form nicht fest. Der unbestimmte Artikel entspricht dem artikellosen Hebräisch; die mögliche Wiedergabe »Schriftrolle« wird in der Fußnote genannt.
- source_word: נָתַן לִי
  choice: hat mir ... gegeben
  rationale: Das hebräische Perfekt bezeichnet eine abgeschlossene Handlung mit gegenwärtiger Relevanz. Das deutsche Perfekt ist in direkter Rede natürlich.
- source_word: וַיִּקְרָאֵהוּ
  choice: las es ... vor
  rationale: קרא mit einem schriftlichen Gegenstand bedeutet hier, hörbar zu lesen. »Vorlesen« gibt dies im Deutschen präzise und idiomatisch wieder.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: dem König vor
  rationale: Die Konstruktion bezeichnet das Lesen in Gegenwart des Königs. Zusammen mit »vorlesen« ist die deutsche Dativkonstruktion natürlicher als das wörtlichere »vor dem König«.
- source_word: חִלְקִיָּה
  choice: Hilkija
  rationale: Der Personenname wird in einer im deutschen Bibelgebrauch etablierten Form wiedergegeben.
- source_word: שָׁפָן
  choice: Schafan
  rationale: Der Personenname wird in einer dem Hebräischen angenäherten und im Deutschen gut lesbaren Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp; »dem König vorlesen« gibt die hörbare Lesung in seiner Gegenwart natürlich wieder.
