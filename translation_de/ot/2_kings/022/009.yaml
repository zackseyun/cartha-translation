  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: de
  text: 'Dann kam der Schreiber Schafan zum König, erstattete ihm Bericht und sagte: »Deine Diener haben das Silber, das im Haus gefunden wurde,[a] ausgeschüttet[b] und es den Arbeitern übergeben, die über das Haus Jahwes eingesetzt sind.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist der Tempel; wörtlich: »im Haus«.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »geleert«. Das hebräische Verb bedeutet hier wahrscheinlich, das Silber aus einem Behälter auszuschütten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »es auf die Hand derjenigen gegeben, die die Arbeit verrichten, die über das Haus Jahwes eingesetzt sind«; die Wendung bezeichnet die Übergabe in ihre Verantwortung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: der Schreiber
  rationale: סֹפֵר bezeichnet hier einen königlichen Schriftkundigen bzw. Sekretär. „Schreiber“ bewahrt die Grundbedeutung und ist im höfischen Zusammenhang verständlich.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: erstattete ihm Bericht
  rationale: Die hebräische Wendung bezeichnet das Zurückbringen einer Nachricht bzw. eine Berichterstattung. Die deutsche Verwaltungswendung gibt den Sinn natürlich wieder.
- source_word: הִתִּיכוּ
  choice: haben ... ausgeschüttet
  rationale: Im Zusammenhang mit gesammeltem Silber bedeutet das Verb wahrscheinlich, den Inhalt eines Behälters auszuschütten bzw. zu leeren, nicht Metall zu schmelzen. „Ausgeschüttet“ bewahrt das konkrete Bild.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: כֶּסֶף kann Silber oder Geld bezeichnen. „Silber“ erhält hier die konkrete hebräische Bezeichnung der Tempelmittel.
- source_word: הַנִּמְצָא בַבַּיִת
  choice: das sich im Haus befand
  rationale: Das Partizip von מצא kann hier das vorhandene bzw. vorgefundene Silber bezeichnen. „Haus“ bewahrt die hebräische Bezeichnung; gemeint ist der Tempel.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: haben es ... übergeben
  rationale: Die Wendung bedeutet wörtlich, etwas auf/in die Hand einer Person zu geben, und idiomatisch, es ihrer Verfügung oder Verantwortung zu übergeben.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: den Werkführern
  rationale: Gemeint sind die mit den Bau- bzw. Ausbesserungsarbeiten befassten Personen. Zusammen mit הַמֻּפְקָדִים legt der Kontext eine verantwortliche Funktion nahe.
- source_word: הַמֻּפְקָדִים
  choice: die ... eingesetzt sind
  rationale: Das passive Partizip bezeichnet Personen, die bestellt bzw. mit Verantwortung betraut worden sind.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Bezeichnung bleibt erhalten; im Kontext ist damit der Tempel gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben, sodass der Eigenname erkennbar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des Heiligtums als בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: „Haus Jahwes“ erhält die Bildsprache und formale Bezeichnung des Hebräischen; eine Fußnote erklärt die kontextuelle Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erstattete Bericht“ gibt die höfisch-administrative Szene natürlich wieder. Die konkrete Bildsprache bei „ausgeschüttet“ und die Bezeichnung „Haus Jahwes“ bleiben erhalten; Fußnoten sichern die idiomatischen und kulturellen Nuancen.
