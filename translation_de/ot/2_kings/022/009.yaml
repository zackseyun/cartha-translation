    rationale: Das Partizip von מצא bezeichnet das im Haus Gefundene bzw. Vorgefundene. Die Formulierung „befand sich“ schwächt dieses Element zu einer bloßen Ortsangabe ab.
  - severity: medium
    issue: „Werkführern“ ist für עֹשֵׂי הַמְּלָאכָה zu eng.
    rationale: Die Wendung bedeutet „die Arbeit Tuenden/Arbeiter“. Eine Aufsichtsfunktion ergibt sich gegebenenfalls aus הַמֻּפְקָדִים („eingesetzt/bestellt“), sollte aber nicht schon durch „Werkführer“ in den ersten Ausdruck hineingelesen werden.
