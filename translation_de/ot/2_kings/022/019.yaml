  to: Weil dein Herz weich war und du dich vor Jahwe gedemütigt hast, als du hörtest, was ich über diesen Ort und seine Bewohner gesagt habe – dass sie zu einer Verwüstung und zum Fluch werden sollten[a] –, und weil du deine Kleider zerrissen und vor mir geweint hast, darum habe auch ich gehört, spricht Jahwe.
