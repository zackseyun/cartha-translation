  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: de
  text: Weil dein Herz weich war und du dich vor Jahwe gedemütigt hast, als du hörtest, was ich über diesen Ort und seine Bewohner gesagt habe – dass sie zu einer Verwüstung und zum Fluch werden sollten[a] –, und weil du deine Kleider zerrissen und vor mir geweint hast, darum habe auch ich gehört, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dass sie zum Entsetzen und zum Fluch werden sollten. Das hebräische Wort שַׁמָּה kann in Gerichtsaussagen Verwüstung, Entsetzen oder etwas bezeichnen, dessen Anblick Bestürzung hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Weil … darum
  rationale: Die vorangestellte Begründung ist im Hebräischen lang. Die deutsche Korrespondenz „Weil … darum“ macht den kausalen Zusammenhang bis zum Hauptsatz klar, ohne seinen Sinn zu verändern.
- source_word: רַךְ לְבָבְךָ
  choice: dein Herz weich war
  rationale: Die Wendung bezeichnet innere Empfänglichkeit und Zerknirschung. „Weich“ bewahrt das hebräische Bild und vermeidet eine ausdeutende Wiedergabe wie „reuig“.
- source_word: וַתִּכָּנַע
  choice: du dich … gedemütigt hast
  rationale: Die reflexive Form beschreibt Josias freiwillige Demütigung beziehungsweise Unterordnung vor Gott.
- source_word: מִפְּנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ gibt die geläufige Gegenwarts- und Beziehungsformel natürlich wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בְּשָׁמְעֲךָ
  choice: als du hörtest
  rationale: Die Präposition mit Infinitiv bezeichnet hier den zeitlichen Umstand.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: was ich … gesagt habe
  rationale: Die Formulierung bezieht sich auf den Inhalt des göttlichen Gerichtswortes und klingt im modernen Deutschen natürlich.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: über diesen Ort und seine Bewohner
  rationale: עַל kann hier sowohl „über“ als auch im Gerichtszusammenhang „gegen“ bedeuten. „Über“ bewahrt die syntaktische Offenheit; der folgende Inhalt macht den drohenden Charakter deutlich.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: dass sie verwüstet und zum Fluch werden sollten
  rationale: Die verbale Wiedergabe von שַׁמָּה ergibt zusammen mit dem zusammengesetzten Bezug auf Ort und Bewohner verständliches Deutsch. Die mögliche Bedeutung „Entsetzen“ wird in der Fußnote bewahrt.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: du deine Kleider zerrissen
  rationale: „Die Kleider zerreißen“ ist auch im Deutschen eine verständliche Bezeichnung der sichtbaren Trauer- und Reuehandlung.
- source_word: וַתִּבְכֶּה לְפָנָי
  choice: vor mir geweint
  rationale: Die persönliche Ausrichtung der Klage auf Gott bleibt durch „vor mir“ erhalten.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: habe auch ich dich erhört
  rationale: Das betonte „auch ich“ entspricht גַם אָנֹכִי. „Erhört“ gibt in diesem Gebets- und Antwortzusammenhang das implizite Objekt und die wirksame göttliche Reaktion idiomatisch wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Dies ist eine geläufige, würdevolle deutsche Wiedergabe der prophetischen Botenformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt den offenbarten Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Reaktion in וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: habe auch ich dich erhört
  alternative: habe auch ich gehört
  rationale: Das Hebräische nennt kein ausdrückliches Objekt. Der Zusammenhang legt Josias Weinen beziehungsweise sein an Gott gerichtetes Handeln als Gegenstand nahe; „erhört“ drückt die positive göttliche Reaktion aus, ohne eine konkrete, hier noch nicht genannte Bitte einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange hebräische Kausalsatz wird durch „Weil … darum“ übersichtlich gegliedert. Die Gedankenstriche kennzeichnen den Inhalt des angekündigten Gerichtswortes; das Bild vom weichen Herzen bleibt erhalten.
