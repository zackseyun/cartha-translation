  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: de
  text: für die Handwerker, die Bauleute und die Maurer[a] sowie zum Kauf von Bauholz und Steinen aus Steinbrüchen[b], um das Haus[c] instand zu setzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: diejenigen, die Mauern oder Einfriedungen errichten beziehungsweise ausbessern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: behauenen Steinen; gemeint sind Steine aus dem Steinbruch.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist hier das Haus des HERRN, also der Tempel.
    reason: cross_reference
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: für die Handwerker
  rationale: חָרָשִׁים bezeichnet allgemein Fachhandwerker und ist nicht auf Zimmerleute beschränkt; „Handwerker“ wahrt diesen weiteren Sinn.
- source_word: וְלַבֹּנִים
  choice: die Bauleute
  rationale: Das substantivierte Partizip von בנה bezeichnet die am Bauen Beteiligten; „Bauleute“ ist im Deutschen natürlich und vermeidet die unmittelbare Wiederholung der Präposition.
- source_word: וְלַגֹּדְרִים
  choice: die Maurer
  rationale: גדר meint das Errichten oder Ausbessern von Mauern beziehungsweise Einfriedungen; im Zusammenhang von Bauarbeiten gibt „Maurer“ das Gewerbe idiomatisch wieder, während eine Fußnote den engeren Wortsinn nennt.
- source_word: וְלִקְנוֹת
  choice: sowie zum Kauf
  rationale: Der Infinitiv mit ל setzt die Angabe zur Verwendung der Gelder fort; „zum Kauf“ bildet diese Zweckangabe knapp und natürlich ab.
- source_word: עֵצִים
  choice: Bauholz
  rationale: Im Baustoffkontext bezeichnet עֵצִים Holz als Baumaterial; „Bauholz“ ist eindeutiger als das allgemeinere „Holz“.
- source_word: וְאַבְנֵי מַחְצֵב
  choice: und Bruchsteinen
  rationale: Die Wortverbindung bezeichnet aus dem Steinbruch gewonnenen Stein. „Bruchsteine“ ist eine geläufige deutsche Baustoffbezeichnung; „behauene Steine“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: לְחַזֵּק
  choice: um … instand zu setzen
  rationale: חזק bedeutet grundlegend „stark machen, festigen“; bei einem beschädigten Gebäude bezeichnet es kontextuell dessen bauliche Wiederherstellung. „Instand setzen“ ist im modernen Deutschen natürlich, ohne die Vorstellung des Festigens auszuschließen.
- source_word: אֶת־הַבָּיִת
  choice: das Haus
  rationale: בַּיִת heißt wörtlich „Haus“. Der Haupttext bewahrt diese Formulierung; eine Fußnote erläutert, dass hier der Tempel gemeint ist.
