  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: de
  text: Da gingen der Priester Hilkija, Ahikam, Achbor, Schafan und Asaja zu der Prophetin Hulda. Sie war die Frau Schallums, eines Sohnes Tikwas, eines Sohnes Harhas, des Hüters der Kleider[a]. Hulda wohnte in Jerusalem im zweiten Stadtviertel[b]. Sie sprachen mit ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hüter der Kleider“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im zweiten Bezirk“. Das hebräische Wort bezeichnet wahrscheinlich ein bestimmtes Viertel Jerusalems; dessen genaue Bezeichnung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da gingen
  rationale: Der Narrativsatz führt die Handlung weiter. Der hebräische Singular steht vor einer Reihe von Personen; im natürlichen Deutschen richtet sich das Verb nach dem mehrgliedrigen Subjekt.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der Vers bezeichnet Hilkija ausdrücklich als Priester, nicht als Hohen Priester.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: zur Prophetin Hulda
  rationale: Die feminine hebräische Bezeichnung wird mit der geläufigen, geschlechtsgenauen deutschen Form „Prophetin“ wiedergegeben.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: Sie war die Frau Schallums
  rationale: Die eheliche Beziehung wird klar ausgedrückt; ein neuer Satz verhindert eine schwer verständliche Kette von Genitiven.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: ein Sohn Tikwas und Enkel Harhas’
  rationale: „Enkel“ gibt die zweite Stufe der Abstammung im Deutschen eindeutig und natürlich wieder.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: der die Kleiderkammer verwaltete
  rationale: Die Wendung bezeichnet wahrscheinlich ein höfisches Amt. Die funktionale Wiedergabe ist verständlich; die wörtliche Bedeutung wird in einer Fußnote bewahrt.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: Hulda wohnte
  rationale: יָשַׁב bezeichnet hier den Wohnort. Die Wiederholung des Namens schafft nach dem eingeschobenen Abstammungshinweis Klarheit.
- source_word: בַּמִּשְׁנֶה
  choice: im zweiten Stadtviertel
  rationale: Die Form bezeichnet wahrscheinlich einen bestimmten Jerusalemer Stadtbezirk; die genaue Bedeutung bleibt jedoch unsicher und wird in der Fußnote kenntlich gemacht.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: Sie sprachen mit ihr
  rationale: Die Formulierung gibt die anschließende persönliche Befragung idiomatisch wieder, ohne den nicht ausgesprochenen Inhalt vorwegzunehmen.
theological_decisions:
- issue: Amtsbezeichnung Hilkijas
  choice: der Priester
  alternative: der Hohe Priester
  rationale: Obwohl Hilkija aus dem weiteren Zusammenhang als Hoher Priester bekannt ist, enthält dieser Vers nur die Bezeichnung „der Priester“.
- issue: Weibliche prophetische Amtsbezeichnung
  choice: Prophetin
  alternative: Prophet
  rationale: Das hebräische Substantiv ist ausdrücklich feminin; die deutsche Form wahrt diese Aussage ohne zusätzliche Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung löst die im Deutschen schwer lesbare Kette aus Ehebezeichnung, Abstammung und Amt auf. Die Eigennamen folgen geläufigen deutschen Bibelformen; echte lexikalische Unsicherheiten werden in den Fußnoten erhalten.
