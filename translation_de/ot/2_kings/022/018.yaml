  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: de
  text: 'Doch dem König von Juda, der euch gesandt hat, um Jahwe zu befragen, sollt ihr Folgendes sagen: So spricht Jahwe, der Gott Israels: Was die Worte betrifft, die du gehört hast—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Satz bleibt hier in der Schwebe und wird im folgenden Vers fortgesetzt.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְאֶל
  choice: Doch zum
  rationale: Die Verbindung leitet gegenüber der vorangehenden Anrede einen Adressatenwechsel ein; „Doch“ gibt diesen Diskurskontrast natürlich wieder, während „zum“ die Richtung wahrt.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Natürliche und genaue Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: der euch gesandt hat
  rationale: Das attributive Partizip bezeichnet den König durch seine Handlung; im Kontext ist das deutsche Perfekt idiomatisch.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: um Jahwe zu befragen
  rationale: דרשׁ bezeichnet hier das Einholen göttlicher Auskunft im Rahmen einer prophetischen Befragung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Umschrift bewahrt den im hebräischen Text stehenden Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: sollt ihr so sagen
  rationale: Bewahrt die Weisungsform und die Botenformel in natürlichem, würdigem Deutsch; das Zielpronomen wird wegen des unmittelbar genannten Königs nicht eigens wiederholt.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Etablierte deutsche Wiedergabe der prophetischen Botenformel mit gegenwärtiger Aussagekraft.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte, natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Was die Worte betrifft, die du gehört hast—
  rationale: Die Formulierung erhält die syntaktisch schwebende Themenangabe, deren Fortsetzung erst im folgenden Vers kommt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Eigennamen. „Jahwe“ wahrt diesen Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Syntaktisch unvollständiger Schluss
  choice: offener Gedankenstrich mit Fußnote
  alternative: syntaktische Ergänzung aus Vers 19
  rationale: Der hebräische Satz bleibt an dieser Stelle bewusst in der Schwebe und wird erst im nächsten Vers fortgeführt; die Übersetzung soll diese Spannung nicht vorzeitig auflösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. Die zweimalige Formel mit כֹּה wird jeweils durch „so“ sichtbar gehalten; der offene Schluss des Verses bleibt bewahrt.
