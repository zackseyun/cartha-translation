  variant: modern standard German
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: de
  text: weil sie mich verlassen und anderen Göttern Opfer dargebracht haben[a], um mich durch alle Werke ihrer Hände zum Zorn zu reizen. Darum ist mein Zorn gegen diesen Ort entbrannt und wird nicht erlöschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, genauer: anderen Göttern Räucheropfer dargebracht haben.'
    reason: Das Verb קטר kann sich besonders auf das Verbrennen von Räucherwerk beziehen, bezeichnet jedoch allgemeiner kultisches Darbringen durch Verbrennen.
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: weil
  rationale: Die Wendung nennt den Grund für das angekündigte Gericht; „weil“ gibt diese kausale Funktion im Deutschen knapp und natürlich wieder.
- source_word: עֲזָבוּנִי
  choice: sie mich verlassen
  rationale: „Verlassen“ bewahrt das relationale und bundestheologische Gewicht von עזב, ohne altertümlich zu wirken.
- source_word: וַיְקַטְּרוּ
  choice: Opfer dargebracht haben
  rationale: Das Piel von קטר bezeichnet kultisches Darbringen durch Verbrennen und kann besonders das Räuchern meinen. Die Hauptübersetzung vermeidet eine unnötige Einengung; die spezifischere Möglichkeit steht in der Fußnote.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Die direkte deutsche Entsprechung bezeichnet Gottheiten außer JHWH, ohne zusätzlich den Gedanken ethnischer Fremdheit einzutragen.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: um mich … zum Zorn zu reizen
  rationale: Die Formulierung bewahrt die Zweck- beziehungsweise Ergebnisnuance von לְמַעַן sowie die ausdrückliche Sprache des Hervorrufens göttlichen Zorns.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: durch all das Werk ihrer Hände
  rationale: Die hebräische Wendung und ihre polemische Resonanz bleiben erhalten; zugleich wird nicht vorschnell entschieden, ob vor allem Götzenbilder oder sämtliche entsprechenden Taten gemeint sind.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: Darum ist mein Zorn … entbrannt
  rationale: „Entbrannt“ erhält das Feuerbild des hebräischen Verbs. Das im Zusammenhang folgernde „Darum“ macht den Übergang von der Begründung zur Gerichtsaussage im Deutschen deutlich.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: gegen diesen Ort
  rationale: Obwohl ב örtlich verstanden werden kann, bezeichnet es hier im Zusammenhang den Zielpunkt des Zorns; „gegen“ ist dafür natürliches Deutsch.
- source_word: וְלֹא תִכְבֶּה
  choice: und wird nicht erlöschen
  rationale: Die Wiedergabe führt das Feuerbild des entbrannten Zorns fort und bewahrt die feierlich-endgültige Aussage.
theological_decisions:
- issue: Menschlich-affektive Rede vom Zorn Gottes
  choice: Die Aussagen, dass Gott zum Zorn gereizt wird und sein Zorn entbrennt, werden beibehalten.
  alternative: Die Formulierung zu einer unpersönlichen Aussage über sicheres Gericht abschwächen.
  rationale: Der hebräische Text verwendet ausdrücklich relationale und affektive Sprache. Eine Abstraktion würde seine theologische Spannung vermindern.
- issue: Feuerbild des göttlichen Gerichts
  choice: Das zusammengehörige Bild von entbrennendem und nicht erlöschendem Zorn bleibt erhalten.
  alternative: Das Bild als bloße Aussage über die Gewissheit der Strafe auslegen.
  rationale: Die Bildsprache gehört zur Aussageform des Verses und soll nicht durch eine erklärende Deutung ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz beginnt entsprechend seinem Zusammenhang als begründender Nebensatz. Die traditionellen Bildfelder „Werk ihrer Hände“, „Zorn entbrannt“ und „nicht erlöschen“ bleiben verständlich und eng mit dem hebräischen Ausdruck verbunden.
