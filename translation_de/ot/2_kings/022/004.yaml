  - severity: low
    issue: Satztrennung nach „Hohen Priester“
    rationale: Die Satztrennung ist nicht falsch, schwächt aber die direkte Abfolge der beiden hebräischen Aufforderungen ab. „… und lass ihn …“ gibt die Konstruktion klarer wieder.
