  to: Geh hinauf zu Hilkija, dem Hohen Priester, und lass ihn das Silber zusammenrechnen, das in das Haus Jahwes gebracht worden ist und das die Hüter der Schwelle[a] vom Volk eingesammelt haben.
  rationale: Die Revision ersetzt das mehrdeutige „abrechnen“ durch „zusammenrechnen“ und stellt die beiden Aufforderungen wieder in einer dem Hebräischen entsprechenden Satzverbindung dar. Alle übrigen Entscheidungen, einschließlich der Wiedergabe des Gottesnamens als „Jahwe“ und der Fußnotenverankerung bei „Hüter der Schwelle“, bleiben erhalten.
