base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: de
  text: Geh hinauf zu Hilkija, dem Hohen Priester, und lass ihn das Silber zusammenrechnen, das in das Haus Jahwes gebracht worden ist und das die Hüter der Schwelle[a] vom Volk eingesammelt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Torhüter; wörtlich: die Hüter der Schwelle.'
    reason: Lexikalische Alternative und Erläuterung der Funktionsbezeichnung.
lexical_decisions:
- source_word: עֲלֵה
  choice: Geh hinauf
  rationale: Der Qal-Imperativ bewahrt die Richtungsangabe des hebräischen Verbs und klingt im Deutschen natürlich.
- source_word: חִלְקִיָּהוּ
  choice: Hilkija
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamensform wiedergegeben.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: der Hohe Priester
  rationale: Dies ist die etablierte deutsche Amtsbezeichnung und entspricht der Bedeutung der hebräischen Wortverbindung.
- source_word: וְיַתֵּם
  choice: Er soll ... abrechnen
  rationale: Der Hifil von תמם bezeichnet hier im Zusammenhang mit Tempelgeldern das abschließende Erfassen beziehungsweise Berechnen des Silberbestands.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: Die konkrete Quellbezeichnung bleibt erhalten; Silber dient hier zugleich als Zahlungsmittel.
- source_word: הַמּוּבָא
  choice: das ... gebracht worden ist
  rationale: Die passive Partizipialform wird als bereits erfolgter Vorgang wiedergegeben.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Tempelbezeichnung 'Haus' wird bewahrt und der Gottesname als Eigenname wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Transkription des Tetragramms bewahrt den Charakter als Gottesname statt ihn durch einen Titel zu ersetzen.
- source_word: אָסְפוּ
  choice: eingesammelt haben
  rationale: Das Verb bezeichnet das Sammeln der Gelder vom Volk; 'einsammeln' ist in diesem Verwaltungskontext idiomatisch.
- source_word: שֹׁמְרֵי הַסַּף
  choice: die Hüter der Schwelle
  rationale: Die bildhafte, wörtliche Bezeichnung bleibt im Haupttext erhalten; die funktionale Bedeutung wird in der Fußnote genannt.
- source_word: מֵאֵת הָעָם
  choice: vom Volk
  rationale: Dies gibt Herkunft und kollektiven Bezug knapp und genau wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; 'Jahwe' wahrt diesen, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der kurze Hauptsatz nach der Anrede vermeidet eine schwerfällige deutsche Satzverbindung. 'Haus Jahwes' und 'Hüter der Schwelle' erhalten zentrale Bilder des hebräischen Textes.
