base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: de
  text: 'Da sagte der Hohepriester Hilkija zu Schafan, dem Schreiber: »Ich habe im Haus Jahwes das Buch des Gesetzes[a] gefunden.« Hilkija gab Schafan das Buch, und er las es[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Schriftrolle des Gesetzes«. Das hebräische Wort סֵפֶר kann ein Buchdokument beziehungsweise eine Schriftrolle bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, weniger wahrscheinlich: »und er las daraus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: der Hohe Priester
  rationale: Dies ist die etablierte deutsche Bezeichnung für das oberste priesterliche Amt und entspricht der kontextuellen Bedeutung.
- source_word: הַסֹּפֵר
  choice: der Schreiber
  rationale: סֹפֵר bezeichnet hier einen königlichen beziehungsweise administrativen Schreiber. „Schreiber“ bewahrt die historische Amtsbezeichnung, ohne sie enger als „Sekretär“ auszulegen.
- source_word: סֵפֶר הַתּוֹרָה
  choice: das Buch des Gesetzes
  rationale: סֵפֶר bezeichnet ein schriftliches Dokument, damals gewöhnlich eine Rolle; תּוֹרָה hat in diesem bundesrechtlichen Zusammenhang den Sinn „Gesetz“, ohne dass die mögliche Bedeutung „Weisung“ grundsätzlich ausgeschlossen wird.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bleibt erhalten; im Zusammenhang ist damit der Tempel gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר
  choice: gab ... das Buch
  rationale: Die schlichte deutsche Form entspricht der gewöhnlichen Bedeutung von נתן und dem direkten Objekt.
- source_word: וַיִּקְרָאֵהוּ
  choice: und dieser las es
  rationale: Das Pronomen „dieser“ macht die naheliegende Subjektzuordnung zu Schafan verständlich; das Objektsuffix wird direkt mit „es“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Gesetz
  alternative: Weisung
  rationale: Der Fund bezeichnet in diesem Zusammenhang eine maßgebliche Bundes- und Gesetzesschrift. „Gesetz“ ist daher passend, während die Fußnote die dokumentarische Form von סֵפֶר erläutert; die weitere Grundbedeutung „Weisung“ wird nicht zur alleinigen Deutung erhoben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Amtsbezeichnungen bleiben historisch erkennbar. „Haus Jahwes“ bewahrt das hebräische Bild, obwohl der Tempel gemeint ist. Durch „dieser“ wird Schafan als naheliegendes Subjekt des Lesens kenntlich gemacht; die Fußnote erhält die lexikalische Alternative beim Leseverb.
