base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: de
  text: 'Und sie sagte zu ihnen: »So spricht Jahwe, der Gott Israels: Sagt zu dem Mann, der euch zu mir gesandt hat:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: Und sie sagte zu ihnen
  rationale: Das Wayyiqtol führt Huldas Antwort in der fortlaufenden Erzählung ein; Präposition und Pronominalsuffix werden ausdrücklich wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in ihrer geläufigen und würdevollen deutschen Form wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: אִמְרוּ לָאִישׁ
  choice: Sagt zu dem Mann
  rationale: Der Pluralimperativ richtet sich an die Abordnung; אִישׁ bezeichnet hier einen bestimmten Mann.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: der euch zu mir gesandt hat
  rationale: Der Relativsatz wird natürlich wiedergegeben; das Perfekt bezeichnet die vorausgegangene Entsendung zu Hulda.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; »Jahwe« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: der Mann
  alternative: die Person
  rationale: Das maskuline Singularnomen verweist im Kontext auf den männlichen Auftraggeber, König Josia; daher wird die Geschlechtsangabe beibehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel »So spricht« bleibt erhalten. Der abschließende Doppelpunkt zeigt, dass die angekündigte Botschaft im folgenden Vers weitergeht; deshalb wird das eröffnete Anführungszeichen hier noch nicht geschlossen.
