source:
  edition: WLC
  text: וְ/שִׁנָּ֕א אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם תָּמִ֛יד לְ/פָנָ֖י/ו כָּל יְמֵ֥י חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: de
  text: Und er wechselte seine Gefängniskleider und aß alle Tage seines Lebens beständig vor ihm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seiner Gegenwart«; die Wendung kann auch bedeuten, dass er am Tisch des Königs aß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: Und er wechselte
  rationale: Das Piel von שׁנה bedeutet hier »ändern/wechseln«. In Verbindung mit Kleidern ist »wechselte« im Deutschen natürlich und bleibt nahe am hebräischen Ausdruck.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: seine Gefängniskleider
  rationale: Die Genitivverbindung bezeichnet die Kleidung seiner Gefangenschaft. »Gefängniskleider« ist knapp, verständlich und quellennah.
- source_word: וְאָכַל לֶחֶם
  choice: und aß
  rationale: »Brot essen« ist im Hebräischen eine übliche Wendung für das Einnehmen einer Mahlzeit. Im Deutschen würde »aß Brot« unnötig nach einer Aussage über die konkrete Speise klingen; »aß« gibt die idiomatische Bedeutung natürlich wieder.
- source_word: תָּמִיד
  choice: beständig
  rationale: תמיד bezeichnet fortdauernde oder regelmäßige Kontinuität. »Beständig« bewahrt diesen Sinn und passt zum anschließenden Ausdruck lebenslanger Dauer.
- source_word: לְפָנָיו
  choice: vor ihm[a]
  rationale: Die Wiedergabe bleibt bei der räumlich-relationalen Offenheit des Hebräischen. Der Kontext kann die Gegenwart des Königs oder das Essen an seiner Tafel meinen, ohne dass der Haupttext dies ausdrücklich festlegt.
- source_word: כָּל יְמֵי חַיָּיו
  choice: alle Tage seines Lebens
  rationale: Die traditionelle, weiterhin verständliche deutsche Wendung entspricht der hebräischen Zeitangabe eng und bezeichnet die gesamte verbleibende Lebenszeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit quellennaher Satzstruktur. Das idiomatische hebräische »Brot essen« wird im Haupttext natürlich mit »aß« wiedergegeben; die Mehrdeutigkeit von לְפָנָיו bleibt erhalten und wird in der Fußnote erläutert.
