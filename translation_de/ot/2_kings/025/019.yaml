source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: de
  text: Und aus der Stadt nahm er einen Hofbeamten[a] mit, der über die Soldaten eingesetzt war, fünf Männer von denen, die Zugang zum König hatten[b] und in der Stadt gefunden wurden, den Schreiber des Heerführers, der das Volk des Landes zum Kriegsdienst aufbot[c], und sechzig Männer aus dem Volk des Landes, die in der Stadt gefunden wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Eunuchen«. Das hebräische Wort kann sowohl einen tatsächlichen Eunuchen als auch einen hohen Beamten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die das Angesicht des Königs sahen«; gemeint sind vermutlich Höflinge oder königliche Vertraute mit unmittelbarem Zugang zum König.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »zum Kriegsdienst musterte« beziehungsweise »einzog«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: Hofbeamter
  rationale: Der Ausdruck kann einen Eunuchen oder allgemein einen hohen Beamten bezeichnen. »Hofbeamter« passt zum amtlichen Zusammenhang, ohne eine körperliche Eigenschaft festzulegen; die Alternative wird in einer Fußnote genannt.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: der den Befehl über die Kriegsleute hatte
  rationale: פָקִיד bezeichnet hier einen eingesetzten Verantwortlichen. Die Formulierung gibt seine militärische Leitungsfunktion verständlich wieder und bewahrt mit »Kriegsleute« den Ausdruck des Hebräischen.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: aus dem Kreis derer, die Zugang zum König hatten
  rationale: Die wörtliche Wendung »das Angesicht des Königs sehen« bezeichnet Personen mit unmittelbarem Zutritt zum König. Die sinngemäße Wiedergabe vermittelt diese höfische Bedeutung natürlich.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: den Schreiber des Heerführers
  rationale: Die knappe hebräische Verbindung lässt sich als Schreiber beziehungsweise Sekretär des Heerführers verstehen. Diese Wiedergabe entspricht der Parallele in Jeremia 52,25 und vermeidet die sachlich schwierige Gleichsetzung des Schreibers mit dem Heerführer.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: der das Volk des Landes zum Kriegsdienst einberief
  rationale: Das Hiphil-Partizip von צבא bezeichnet hier das Aufbieten oder Einziehen zum militärischen Dienst. »Zum Kriegsdienst einberief« macht Zweck und amtliche Funktion deutlich, ohne ausdrücklich Zwang zu behaupten.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die formnahe Wiedergabe bewahrt die mögliche soziale und politische Bedeutung des festen Ausdrucks, ohne ihn vorschnell auf »einfache Leute« einzuengen.
- source_word: נִמְצְאוּ / הַנִּמְצָאִים
  choice: gefunden wurden
  rationale: Die passive Form von מצא wird direkt wiedergegeben und lässt den erzählerischen Sinn bestehen, dass diese Personen nach der Einnahme in der Stadt angetroffen wurden.
- source_word: לָקַח
  choice: nahm … mit
  rationale: לקח bedeutet grundsätzlich »nehmen«. Im Zusammenhang der Abführung von Gefangenen drückt »mitnehmen« die Bewegung aus der Stadt natürlich aus, ohne die stärkere Bedeutung »ergreifen« ausdrücklich einzutragen.
