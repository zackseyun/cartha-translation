revisions:
- from: Und aus der Stadt nahm er einen Hofbeamten[a] mit, der den Befehl über die Kriegsleute hatte, außerdem fünf Männer aus dem Kreis derer, die Zugang zum König hatten[b] und in der Stadt gefunden wurden, den Schreiber des Heerführers, der das Volk des Landes zum Kriegsdienst einberief[c], und sechzig Männer aus dem Volk des Landes, die in der Stadt gefunden wurden.
  to: Und aus der Stadt nahm er einen Hofbeamten[a] mit, der über die Soldaten eingesetzt war, fünf Männer von denen, die Zugang zum König hatten[b] und in der Stadt gefunden wurden, den Schreiber des Heerführers, der das Volk des Landes zum Kriegsdienst aufbot[c], und sechzig Männer aus dem Volk des Landes, die in der Stadt gefunden wurden.
  rationale: Die Revision modernisiert einzelne militärische Ausdrücke, stellt die durch פָּקִיד bezeichnete Einsetzung deutlicher heraus und klärt den Bezug der ersten Relativkonstruktion. Die textlich vertretbare, in Jeremia 52,25 gestützte Verbindung »Schreiber des Heerführers« sowie alle Fußnotenanker bleiben erhalten.
