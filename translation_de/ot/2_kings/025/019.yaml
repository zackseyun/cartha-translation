  naturalness: Der Satz ist insgesamt verständlich, doch »Kriegsleute« wirkt im heutigen Standarddeutsch unnötig archaisch. Zudem kann die Relativkonstruktion nach »aus dem Kreis derer« den Bezug von »in der Stadt gefunden wurden« verwischen. Eine geringe Umstellung macht die Aufzählung klarer und natürlicher.
  terminology: »Hofbeamter« ist als kontextuelle Wiedergabe von סָרִיס mit der Fußnotenalternative »Eunuch« vertretbar. »Soldaten« und »zum Kriegsdienst aufbot« sind modernes Standarddeutsch und geben die militärisch-administrative Funktion wieder, ohne eine gewaltsame Einziehung zu behaupten.
