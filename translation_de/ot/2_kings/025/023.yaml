revisions:
- from: 'Als alle Befehlshaber der Truppen, sie und ihre Männer, hörten, dass der König von Babel Gedalja eingesetzt hatte[a], kamen sie zu Gedalja nach Mizpa: Ismael, der Sohn Netanjas, Johanan, der Sohn Kareachs, Seraja, der Sohn Tanhumets, der Netofatiter, und Jaasanja, der Sohn des Maachatiters – sie und ihre Männer.'
  to: 'Als alle Befehlshaber der Truppen – sie und ihre Männer – hörten, dass der König von Babel Gedalja mit der Aufsicht betraut hatte[a], kamen sie zu Gedalja nach Mizpa: Ismael, der Sohn Netanjas, Johanan, der Sohn Kareachs, Seraja, der Sohn Tanhumets, des Netofatiters, und Jaasanja, der Sohn des Maachatiters – sie und ihre Männer.'
  rationale: Die Revision klärt die Zugehörigkeit von „des Netofatiters“ zu Tanhumet und ersetzt die im Deutschen elliptische Wendung „Gedalja eingesetzt hatte“ durch eine idiomatische, semantisch breite Wiedergabe. Die Fußnote erhält die alternative, ebenfalls mögliche Einsetzungsformulierung. Der nicht ausdrücklich genannte Amtstitel wird weiterhin nicht ergänzt.
