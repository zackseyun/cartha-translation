source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: de
  text: 'Als alle Befehlshaber der Truppen – sie und ihre Männer – hörten, dass der König von Babel Gedalja mit der Aufsicht betraut hatte[a], kamen sie zu Gedalja nach Mizpa: Ismael, der Sohn Netanjas, Johanan, der Sohn Kareachs, Seraja, der Sohn Tanhumets, des Netofatiters, und Jaasanja, der Sohn des Maachatiters – sie und ihre Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gedalja eingesetzt hatte«; das hebräische Verb kann das Einsetzen oder Betrauen mit einer Aufsichts- oder Verwaltungsaufgabe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: Befehlshaber der Truppen
  rationale: שָׂרִים bezeichnet hier militärische Führer, während חַיִל im Kontext die Truppen meint. Die Wiedergabe ist modern und legt keinen bestimmten militärischen Rang fest.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: sie und ihre Männer
  rationale: Die hervorgehobene, wiederaufnehmende Konstruktion unterscheidet die Befehlshaber von den ihnen zugehörigen Männern. Das possessive Verhältnis ist im Deutschen kontextgemäß.
- source_word: הִפְקִיד
  choice: eingesetzt hatte
  rationale: Das Verb bezeichnet das Einsetzen oder Betrauen mit Aufsicht beziehungsweise Verwaltung. »Eingesetzt« bleibt bewusst weiter als die interpretierende Amtsbezeichnung »zum Statthalter gemacht«.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: zu Gedalja nach Mizpa
  rationale: מִצְפָּה gibt den Ziel- beziehungsweise Aufenthaltsort an. Nach dem Bewegungsverb ist »nach Mizpa« natürliches Deutsch.
- source_word: הַנְּטֹפָתִי
  choice: der Netofatiter
  rationale: Das Gentilizium wird als geografische Herkunftsbezeichnung in einer im Deutschen verständlichen Form bewahrt.
- source_word: הַמַּעֲכָתִי
  choice: der Maachatiter
  rationale: Das Gentilizium wird bewahrt, ohne es durch eine paraphrasierende Herkunftsangabe zu verengen.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן ...
  choice: 'kamen sie ...: Ismael ... Johanan ... Seraja ... und Jaasanja'
  rationale: Der Doppelpunkt macht deutlich, dass die folgenden Namen die zuvor genannten Befehlshaber näher bestimmen, und erhält zugleich die Satzfolge des Hebräischen.
- source_word: וְאַנְשֵׁיהֶם
  choice: sie und ihre Männer
  rationale: Die Schlussformulierung nimmt die Befehlshaber samt ihren Männern wieder auf. Der Gedankenstrich bildet die nachgestellte hebräische Wendung in lesbarem Deutsch ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärischen Bezeichnungen bleiben allgemein, und Gedaljas konkreter Amtstitel wird nicht über den hebräischen Wortlaut hinaus festgelegt. Die wiederaufnehmenden Formulierungen des Ausgangstextes werden trotz ihrer leichten Sperrigkeit erkennbar bewahrt.
