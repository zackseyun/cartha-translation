  text: שְׁמֹנֶה֩ עֶשְׂרֵ֨ה אַמָּ֜ה קוֹמַ֣ת הָ/עַמּ֣וּד הָ/אֶחָ֗ד וְ/כֹתֶ֨רֶת עָלָ֥י/ו נְחֹשֶׁת֮ וְ/קוֹמַ֣ת הַ/כֹּתֶרֶת֮ שָׁלֹ֣שׁ אמה וּ/שְׂבָכָ֨ה וְ/רִמֹּנִ֧ים עַֽל הַ/כֹּתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י עַל הַ/שְּׂבָכָֽה׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: de
  text: Die eine Säule war achtzehn Ellen hoch. Auf ihr befand sich ein Kapitell aus Bronze; das Kapitell war drei Ellen hoch. Rings um das Kapitell waren Gitterwerk[a] und Granatäpfel angebracht, alles aus Bronze. Ebenso war es bei der zweiten Säule mit dem Gitterwerk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Netzwerk“; gemeint ist eine netzartige Zierkonstruktion am Kapitell.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Schlusssatz ist im Hebräischen verkürzt; wörtlich etwa: „Und dergleichen war an der zweiten Säule auf dem Gitterwerk.“ Gemeint ist offenbar, dass die zweite Säule entsprechend gestaltet war.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: Die eine Säule war … hoch
  rationale: Die konstruktive Wendung bezeichnet die Höhe der Säule. Die verbale deutsche Form ist natürlich und gibt die Maßangabe genau wieder.
- source_word: עַמּוּד
  choice: Säule
  rationale: Im Zusammenhang der Tempelarchitektur ist „Säule“ der geläufige und präzise deutsche Ausdruck.
- source_word: כֹתֶרֶת
  choice: Kapitell
  rationale: Gemeint ist der verzierte obere Abschluss einer Säule; „Kapitell“ ist dafür der genaue architektonische Fachausdruck.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Bei den Tempelgeräten und Bauteilen bezeichnet das Wort üblicherweise Bronze beziehungsweise eine Kupferlegierung. „Bronze“ ist hier sachlich und traditionsgemäß passend.
- source_word: שְׂבָכָה
  choice: Gitterwerk
  rationale: Das Wort bezeichnet eine netz- oder gitterartige Verzierung am Kapitell. „Gitterwerk“ ist im modernen Deutsch anschaulich und verständlich.
- source_word: רִמֹּנִים
  choice: Granatäpfel
  rationale: Das Wort bezeichnet hier granatapfelförmige Schmuckelemente; die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: סָבִיב
  choice: rings um
  rationale: Die Formulierung gibt die umlaufende Anordnung der Verzierungen knapp und idiomatisch wieder.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: alles aus Bronze
  rationale: Die zusammenfassende Materialangabe wird klar auf die genannten Schmuckelemente bezogen.
- source_word: וְכָאֵלֶּה לָעַמּוּד הַשֵּׁנִי עַל הַשְּׂבָכָה
  choice: Ebenso war es bei der zweiten Säule mit dem Gitterwerk
  rationale: Der hebräische Schlusssatz ist elliptisch. Die Wiedergabe bleibt zurückhaltend, verweist auf die entsprechende Gestaltung der zweiten Säule und kennzeichnet die syntaktische Schwierigkeit in einer Fußnote.
