  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: de
  text: So lag die Stadt bis zum elften Regierungsjahr König Zedekias unter Belagerung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Stadt kam in die Belagerung.« Die hebräische Wendung bedeutet idiomatisch, dass die Stadt unter Belagerung geriet beziehungsweise sich im Zustand der Belagerung befand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: blieb
  rationale: Das Verb בוא bedeutet wörtlich »kommen/hineinkommen«. In der Wendung mit מָצוֹר beschreibt es hier jedoch den fortdauernden Zustand der Stadt während der Belagerung; »blieb« gibt diesen Zusammenhang natürlich wieder.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Direkte Wiedergabe des Substantivs עִיר mit bestimmtem Artikel.
- source_word: בַּמָּצוֹר
  choice: belagert
  rationale: מָצוֹר bezeichnet eine Belagerung oder Belagerungsmaßnahmen. Zusammen mit בוא ist die deutsche Zustandsformulierung »belagert« idiomatisch und prägnant.
- source_word: עַד
  choice: bis
  rationale: Die Präposition bezeichnet den zeitlichen Endpunkt des genannten Zustands.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: zum elften Regierungsjahr
  rationale: Die hebräische Kardinalzahl wird in einer Königsdatierung im Deutschen idiomatisch als Ordinalzahl wiedergegeben. »Regierungsjahr« macht die Funktion der Datierungsformel deutlich.
- source_word: לַמֶּלֶךְ
  choice: König
  rationale: ל kennzeichnet in der Regierungsformel die Zuordnung des Jahres zur Herrschaft des Königs; im Deutschen wird dies durch »Regierungsjahr König …« ausgedrückt.
- source_word: צִדְקִיָּהוּ
  choice: Zedekias
  rationale: Eingebürgerte deutsche Namensform für צִדְקִיָּהוּ.
