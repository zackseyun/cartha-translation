  text: וַ/יִּשָּׁבַ֨ע לָ/הֶ֤ם גְּדַלְיָ֨הוּ֙ וּ/לְ/אַנְשֵׁי/הֶ֔ם וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַל תִּֽירְא֖וּ מֵ/עַבְדֵ֣י הַ/כַּשְׂדִּ֑ים שְׁב֣וּ בָ/אָ֗רֶץ וְ/עִבְד֛וּ אֶת מֶ֥לֶךְ בָּבֶ֖ל וְ/יִטַ֥ב לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: de
  text: 'Gedalja schwor ihnen und ihren Männern[a] und sagte zu ihnen: »Habt keine Angst vor den Dienern der Chaldäer[b]. Bleibt im Land und dient dem König von Babylon; dann wird es euch gut gehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind vermutlich die Gefolgsleute oder Truppen der zuvor genannten Heerführer.
    reason: lexical_alternative
  - marker: b
    text: »Chaldäer« ist die hebräische Bezeichnung; hier sind die Babylonier gemeint. Ihre »Diener« können auch Beauftragte oder Amtsträger gewesen sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Das Nifal von שׁבע bedeutet hier »schwören« bzw. »einen Eid leisten«. Die knappe Formulierung ist im Deutschen natürlich und gibt die feierliche Zusicherung wieder.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: und ihren Männern
  rationale: אַנְשֵׁי bezeichnet wörtlich die »Männer« der zuvor genannten Anführer. Gemeint sein können ihre Gefolgsleute oder Truppen; die Übersetzung lässt diese nähere Bestimmung bewusst offen.
- source_word: אַל תִּירְאוּ
  choice: Habt keine Angst
  rationale: Die negative Aufforderung mit ירא wird in gegenwärtigem Standarddeutsch natürlich wiedergegeben, ohne ihre eindringliche Kraft abzuschwächen.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: vor den Dienern der Chaldäer
  rationale: עֲבָדִים bedeutet grundsätzlich »Diener«; im politischen Zusammenhang können Beauftragte oder Amtsträger der babylonischen Macht gemeint sein. מִן nach ירא bezeichnet hier das, wovor man sich fürchtet.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Der hebräische Volksname wird formal bewahrt. In diesem Zusammenhang bezeichnet er die babylonische Herrschaftsmacht.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Bleibt im Land
  rationale: ישׁב kann »wohnen«, »sich niederlassen« oder »bleiben« bedeuten. Nach Flucht, Krieg und Machtwechsel passt hier die Aufforderung, weiterhin im Land zu leben; »Bleibt« ist natürlich und wahrt den Kontext.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: und dient dem König von Babylon
  rationale: עבד mit einer Person als Objekt bedeutet »dienen« und schließt hier politische Unterordnung ein, ohne dass diese Deutung an die Stelle des Grundbegriffs gesetzt wird.
- source_word: וְיִטַב לָכֶם
  choice: dann wird es euch gut gehen
  rationale: Die hebräische Wendung beschreibt einen günstigen Ausgang für die Angesprochenen. »Dann« macht den im Satz angelegten Zusammenhang mit der vorherigen Aufforderung im Deutschen idiomatisch deutlich.
