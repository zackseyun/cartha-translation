  source_fidelity: 'Der Entwurf gibt die syntaktische Abfolge und Aussage des Hebräischen zuverlässig wieder: die in Juda verbliebene beziehungsweise zurückgelassene Bevölkerung, Nebukadnezar als Handelnder und die Einsetzung Gedaljas über sie. Die Vorvergangenheit ist im erzählerischen deutschen Kontext angemessen. „Dort“ verweist eindeutig auf das zuvor genannte Land Juda und fügt keine Sachinformation hinzu.'
