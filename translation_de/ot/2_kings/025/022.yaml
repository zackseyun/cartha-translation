  text: וְ/הָ/עָ֗ם הַ/נִּשְׁאָר֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה אֲשֶׁ֣ר הִשְׁאִ֔יר נְבֽוּכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יַּפְקֵ֣ד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: de
  text: 'Was das Volk betrifft, das im Land Juda übrig geblieben war[a] und das Nebukadnezar, der König von Babylon, dort zurückgelassen hatte: Über sie setzte er Gedalja ein, den Sohn Ahikams, des Sohnes Schafans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das im Land Juda zurückgelassen worden war“. Das hebräische Partizip kann sowohl das Verbleiben als auch das Zurückgelassenwerden hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: das Volk
  rationale: Die kollektive Bezeichnung meint hier die Bevölkerung Judas; „das Volk“ ist die natürliche und sachlich passende Wiedergabe.
- source_word: הַנִּשְׁאָר
  choice: das ... übrig geblieben war
  rationale: Das Nifal-Partizip von שׁאר bezeichnet die nach den Wegführungen verbliebene Bevölkerung, ohne dass der theologisch stärker geprägte Begriff „Rest“ nötig ist.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: im Land Juda
  rationale: Bewahrt die territoriale Bedeutung von אֶרֶץ und entspricht dem etablierten deutschen geografischen Ausdruck.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: das ... dort zurückgelassen hatte
  rationale: Das Hifil von שׁאר drückt aus, dass Nebukadnezar diese Menschen im Land zurückließ; „dort“ verdeutlicht im Deutschen den Ortsbezug, ohne neue Sachinformation einzuführen.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, der König von Babylon
  rationale: Der Name folgt der geläufigen deutschen Form; der Königstitel bleibt als Apposition erhalten.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: Über sie setzte er ... ein
  rationale: פקד mit עַל bezeichnet hier eine amtliche Einsetzung in eine Leitungsfunktion. Die Formulierung ist im Deutschen natürlich und erhält den Verwaltungssinn.
- source_word: גְּדַלְיָהוּ
  choice: Gedalja
  rationale: Geläufige deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: den Sohn Ahikams, des Sohnes Schafans
  rationale: Die Abstammungsfolge bleibt vollständig erhalten und wird durch den deutschen Genitiv eindeutig wiedergegeben.
- source_word: וְ
  choice: Was ... betrifft
  rationale: Die einleitende Konjunktion markiert hier einen Themenwechsel zur verbliebenen Bevölkerung; die deutsche Wendung bildet diesen Übergang natürlich ab.
theological_decisions: []
