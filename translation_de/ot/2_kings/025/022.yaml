  terminology: Die Namensformen Nebukadnezar, Gedalja, Ahikam und Schafan sind im Deutschen etabliert. „Land Juda“, „Volk“ und „einsetzen“ sind sachlich passend. Der Entwurf vermeidet zu Recht die potenziell theologisch aufgeladene Wiedergabe „Rest“.
