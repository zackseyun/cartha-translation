  text: וְ/אֶת הַ/מַּחְתּוֹת֙ וְ/אֶת הַ/מִּזְרָק֗וֹת אֲשֶׁ֤ר זָהָב֙ זָהָ֔ב וַ/אֲשֶׁר כֶּ֖סֶף כָּ֑סֶף לָקַ֖ח רַב טַבָּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/015.yaml
  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: de
  text: Auch die Kohlenpfannen[a] und die Schalen[b] nahm der Oberste der Leibwache[c] mit, sowohl die aus Gold[d] als auch die aus Silber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Räucherpfannen« beziehungsweise »Räuchergefäße«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Becken«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »der Oberste der Scharfrichter« beziehungsweise »der Befehlshaber der Leibgarde«.'
    reason: lexical_alternative
  - marker: d
    text: 'Das Hebräische wiederholt die Materialbezeichnungen: »was Gold war, Gold, und was Silber war, Silber«. Damit werden die Gegenstände nach ihrem Material eingeordnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: die Kohlenpfannen
  rationale: מַחְתָּה bezeichnet ein Gerät zum Tragen glühender Kohlen, auch im Zusammenhang mit Räucherwerk. »Kohlenpfannen« ist verständlich und legt die konkrete Verwendung nicht unnötig auf Räucherwerk fest.
- source_word: הַמִּזְרָקוֹת
  choice: die Schalen
  rationale: מִזְרָק bezeichnet ein kultisches Gefäß, etwa zum Auffangen oder Versprengen von Flüssigkeit. »Schalen« ist im Deutschen natürlich; »Becken« bleibt als mögliche Alternative erhalten.
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: was aus Gold war, als Gold, und was aus Silber war, als Silber
  rationale: Die Formulierung bewahrt die auffällige Wiederholung der Materialbezeichnungen als Einteilung nach Werkstoff, ohne im Deutschen unverständlich zu wirken.
- source_word: לָקַח
  choice: nahm ... mit
  rationale: Das Verb bedeutet grundsätzlich »nehmen«. »Nahm ... mit« klingt im Kontext einer Wegführung natürlich und bleibt zurückhaltender als das deutlicher wertende »raubte«.
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Die feste babylonische Amtsbezeichnung kann wörtlicher mit Hinrichtern beziehungsweise Schlächtern verbunden werden, bezeichnet hier aber einen hohen Befehlshaber. »Oberster der Leibwache« gibt den Titel verständlich wieder.
