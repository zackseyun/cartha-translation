base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: de
  text: Am neunten Tag des Monats[a] verschärfte sich die Hungersnot in der Stadt, und für das Volk des Landes gab es kein Brot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Monat wird im hebräischen Wortlaut dieses Verses nicht genannt; Jeremia 39,2 nennt in der Parallelüberlieferung den vierten Monat.
    reason: contextual_clarification
  - marker: b
    text: „Brot“ kann hier umfassender für Nahrung stehen. „Volk des Landes“ kann je nach Zusammenhang auch die einfache oder einheimische Bevölkerung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: Am neunten Tag des Monats
  rationale: Das Hebräische lautet wörtlich „am Neunten des Monats“; „Tag“ wird für klares, natürliches Deutsch ergänzt.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: wurde die Hungersnot ... immer schlimmer
  rationale: חזק bezeichnet hier das Zunehmen der Stärke beziehungsweise Heftigkeit. Mit „Hungersnot“ als Subjekt gibt diese Formulierung die fortschreitende Verschärfung idiomatisch wieder.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Schlichte und natürliche Wiedergabe der Ortsangabe; im Zusammenhang ist Jerusalem gemeint, wird im Vers selbst aber nicht erneut genannt.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: gab es kein Brot
  rationale: לֶחֶם bedeutet konkret „Brot“, kann aber auch Nahrung allgemein bezeichnen. Der Haupttext bewahrt das konkrete Bild.
- source_word: לְעַם הָאָרֶץ
  choice: für das Volk des Landes
  rationale: Die formal nahe Wiedergabe erhält die mögliche Spannweite der Wendung, die je nach Kontext auch die einfache Bevölkerung beziehungsweise die einheimische Bevölkerung bezeichnen kann.
