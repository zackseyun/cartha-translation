source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבֻכַדְנֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֧וּא וְ/כָל חֵיל֛/וֹ עַל יְרוּשָׁלִַ֖ם וַ/יִּ֣חַן עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֖י/הָ דָּיֵ֥ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: de
  text: 'Und es geschah im neunten Jahr seiner Herrschaft, im zehnten Monat, am zehnten Tag des Monats: Nebukadnezar, der König von Babylon, zog mit seinem ganzen Heer gegen Jerusalem. Er schlug vor der Stadt sein Lager auf, und sie errichteten rings um sie einen Belagerungswall[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch allgemeiner mit „Belagerungsanlagen“ oder „Belagerungswerke“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische Erzählungsformel leitet das historische Geschehen ein. Die Wiedergabe bewahrt den feierlichen Erzählton, ohne altertümliche Syntax zu erzwingen.
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: im neunten Jahr seiner Herrschaft
  rationale: Dies ist die übliche deutsche Wiedergabe der Formel zur Angabe eines Regierungsjahres; das nicht ausdrücklich genannte Bezugswort bleibt wie im Kontext vorausgesetzt.
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: im zehnten Monat, am zehnten Tag des Monats
  rationale: Die kalenderbezogene Angabe wird vollständig bewahrt, ohne einen modernen Monatsnamen einzutragen, den der hebräische Text nicht nennt.
- source_word: בָּא ... עַל יְרוּשָׁלַםִ
  choice: zog ... gegen Jerusalem
  rationale: בוא bezeichnet die Bewegung zum Ziel; עַל erhält im militärischen Zusammenhang eindeutig die feindliche Ausrichtung. „Zog gegen“ klingt im Deutschen natürlicher als das wörtliche „kam gegen“.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Dies ist die im modernen Deutschen geläufige Form des Königsnamens und entspricht der Namensform des vorliegenden hebräischen Textes.
- source_word: הוּא וְכָל חֵילוֹ
  choice: mit seinem ganzen Heer
  rationale: Die Begleitung durch die gesamte Streitmacht wird idiomatisch wiedergegeben. Dass der König selbst beteiligt war, ist durch das ausdrückliche Subjekt „Nebukadnezar“ erhalten.
- source_word: וַיִּחַן עָלֶיהָ
  choice: Er schlug vor der Stadt sein Lager auf
  rationale: חנה bezeichnet das Lagern eines Heeres. „Vor der Stadt“ macht den Bezug des weiblichen Pronomens auf Jerusalem verständlich und entspricht der Belagerungssituation.
- source_word: וַיִּבְנוּ עָלֶיהָ דָּיֵק סָבִיב
  choice: sie errichteten rings um sie einen Belagerungswall
  rationale: Der Wechsel zum Plural wird bewahrt und bezieht sich natürlich auf die Truppen. דָּיֵק bezeichnet eine gegen eine Stadt angelegte Belagerungsanlage; „Belagerungswall“ ist konkret und gut verständlich, während die genauere Bauart unsicher bleibt.
