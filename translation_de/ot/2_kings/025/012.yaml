translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt zunächst die verschonte Bevölkerungsgruppe hervor und bewahrt damit den Kontrast des hebräischen Textes. Die seltene Berufsbezeichnung wird im Haupttext verständlich wiedergegeben, während die lexikalische Unsicherheit in der Fußnote erhalten bleibt.
