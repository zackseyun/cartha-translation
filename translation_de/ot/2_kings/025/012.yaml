  text: וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ הִשְׁאִ֖יר רַב טַבָּחִ֑ים לְ/כֹֽרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: de
  text: Doch einige von den Ärmsten der Landbevölkerung ließ der Befehlshaber der Leibwache[a] als Weingärtner und Feldarbeiter[b] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa »Oberster der Schlachter« beziehungsweise »der Hinrichter«; hier ist damit der babylonische Befehlshaber der Leibwache gemeint.
    reason: lexical_alternative
  - marker: b
    text: Oder »Ackerbauern« beziehungsweise »Pflüger«. Das seltene hebräische Wort bezeichnet wahrscheinlich allgemein Arbeiter, die den Boden bestellten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלַּת הָאָרֶץ
  choice: Doch einige von den Ärmsten der Landbevölkerung
  rationale: Die Präposition מִן hat partitiven Sinn; דַּלַּת bezeichnet hier kollektiv die sozial Schwächsten beziehungsweise Ärmsten. „Einige“ ist im Deutschen als implizites Objekt sinnvoll zu ergänzen. „Doch“ verdeutlicht den Gegensatz zur vorausgehenden Wegführung.
- source_word: הִשְׁאִיר
  choice: ließ … zurück
  rationale: Der Hifil von שׁאר bezeichnet das Zurücklassen. Die deutsche Verbklammer gibt die Aussage natürlich und genau wieder.
- source_word: רַב טַבָּחִים
  choice: Befehlshaber der Leibwache
  rationale: Der Ausdruck ist wörtlich mit Schlächtern beziehungsweise Hinrichtern verbunden, fungiert hier jedoch als babylonischer Amts- und Militärtitel. Die gewählte Wiedergabe vermittelt diese kontextuelle Bedeutung verständlich.
- source_word: לְכֹרְמִים
  choice: als Weingärtner
  rationale: Das Wort bezeichnet Arbeiter, die Weinberge beziehungsweise Weinstöcke pflegen. „Weingärtner“ ist präzise, geläufig und dem historischen Kontext angemessen.
- source_word: וּלְיֹגְבִים
  choice: und Feldarbeiter
  rationale: Die seltene Bezeichnung meint landwirtschaftliche Arbeiter, die den Boden bearbeiten. „Feldarbeiter“ bewahrt die begriffliche Weite, ohne die Tätigkeit vorschnell auf Pflügen zu beschränken.
