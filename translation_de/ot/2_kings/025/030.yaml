source:
  edition: WLC
  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַ֨ת תָּמִ֧יד נִתְּנָה לּ֛/וֹ מֵ/אֵ֥ת הַ/מֶּ֖לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽ/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: de
  text: 'Und seine Versorgung[a], eine ständige Versorgung, wurde ihm vom König gewährt: die tägliche Zuteilung, Tag für Tag[b], alle Tage seines Lebens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zuteilung«, »Ration« oder »Unterhalt«. Das hebräische Wort bezeichnet eine ihm zugeteilte Versorgung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Angelegenheit eines Tages an seinem Tag«. Die Wendung bezeichnet die jeweils für den einzelnen Tag bestimmte Zuteilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: Versorgung
  rationale: Das Substantiv bezeichnet hier die Jojachin zugeteilte materielle Versorgung. »Versorgung« ist im Deutschen natürlich und weit genug, um eine fortlaufend gewährte Zuteilung zu bezeichnen.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort beschreibt die Versorgung als fortdauernd und regelmäßig; »beständig« bewahrt diesen zeitlichen Nachdruck.
- source_word: נִתְּנָה
  choice: wurde gewährt
  rationale: Das Passiv von נתן bedeutet wörtlich »wurde gegeben«. Im Zusammenhang einer königlichen Zuteilung klingt »wurde gewährt« natürlich, ohne den Sinn wesentlich zu erweitern.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: vom König
  rationale: Die Wendung kennzeichnet den König als Ursprung beziehungsweise Geber der Versorgung.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: der Bedarf für jeden Tag an seinem Tag
  rationale: Die Wiedergabe bleibt nahe an der distributiven hebräischen Wendung und bringt zum Ausdruck, dass die Versorgung jeweils für den betreffenden Tag bereitgestellt wurde.
- source_word: כֹּל יְמֵי חַיָּו
  choice: alle Tage seines Lebens
  rationale: Dies entspricht der hebräischen Zeitformel und bezeichnet die gesamte verbleibende Lebenszeit.
theological_decisions: []
