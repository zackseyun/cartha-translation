  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: de
  text: Die Chaldäer[b] zerbrachen die bronzenen Säulen, die im Haus Jahwes standen, die Gestelle[a] und das bronzene Meer, das sich im Haus Jahwes befand, und brachten deren Bronze nach Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Untergestelle“ beziehungsweise „Sockel“. Gemeint sind die tragenden Konstruktionen der Tempelbecken.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Chaldäern“ sind hier die babylonischen Truppen gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: die bronzenen Säulen
  rationale: עַמּוּדִים bezeichnet Säulen; נְחֹשֶׁת wird im Zusammenhang mit den Tempelgeräten sachgerecht mit „Bronze“ wiedergegeben.
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: die im Haus Jahwes standen
  rationale: Der hebräische Relativsatz ist ohne ausdrückliches Verb und ohne Ortspräposition formuliert. Der Kontext legt eine Ortsangabe nahe; „standen“ ist bei Säulen im Deutschen natürlich.
- source_word: הַמְּכֹנוֹת
  choice: die Gestelle
  rationale: מְכֹנוֹת bezeichnet die tragenden Konstruktionen für die Tempelbecken. „Gestelle“ ist konkret und allgemein verständlich; „Untergestelle“ oder „Sockel“ bleiben mögliche Alternativen.
- source_word: יָם הַנְּחֹשֶׁת
  choice: das bronzene Meer
  rationale: Die wörtliche Bezeichnung „Meer“ wird als Eigenbezeichnung des großen Tempelbeckens bewahrt, statt sie deutend durch „Becken“ zu ersetzen.
- source_word: שִׁבְּרוּ
  choice: zerbrachen
  rationale: Das Verb beschreibt hier das Zerlegen großer Bronzegegenstände, offenbar um das Metall abtransportieren zu können.
- source_word: כַשְׂדִּים
  choice: die Chaldäer
  rationale: Dies gibt die konkrete hebräische Volks- beziehungsweise Gruppenbezeichnung wieder; im Kontext sind damit die babylonischen Truppen gemeint.
- source_word: וַיִּשְׂאוּ
  choice: Dann brachten sie
  rationale: נשא bezeichnet hier das Wegtragen der Bronze; zusammen mit dem Ziel Babylon ist „brachten“ im Deutschen idiomatisch.
- source_word: נְחֻשְׁתָּם
  choice: deren Bronze
  rationale: Das Suffix der dritten Person Plural verweist gesammelt auf die zuvor genannten Bronzegegenstände. „Deren Bronze“ macht diesen Rückbezug deutlich.
- source_word: בָּבֶלָה
  choice: nach Babylon
  rationale: Die Richtungsendung bezeichnet die Bewegung auf Babylon zu; „nach Babylon“ ist die natürliche deutsche Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der göttliche Eigenname wird im Deutschen in der etablierten Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen; „der HERR“ wäre eine traditionelle Ersatzlesung, die im hebräischen Konsonantentext nicht selbst steht.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzfolge wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert. Die Ortsangaben ergänzen die im Hebräischen unausgesprochenen Verben kontextgemäß; die traditionelle Bezeichnung „bronzenes Meer“ bleibt erhalten.
