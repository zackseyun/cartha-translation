revisions:
- from: Nebusaradan, der Befehlshaber der königlichen Leibwache[a], nahm sie und brachte sie nach Ribla zum König von Babylon.[b]
  to: Nebusaradan, der Oberste der Leibwache[a], nahm sie und führte sie zum König von Babylon in Ribla.[b]
  rationale: Die Revision stellt Ribla eindeutig als Ort der Begegnung mit dem König dar, vermeidet eine im hebräischen Titel nicht ausdrücklich enthaltene Ergänzung und bewahrt die mögliche Nuance einer Vorführung vor dem König in einer Fußnote.
