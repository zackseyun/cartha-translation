source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: de
  text: Nebusaradan, der Oberste der Leibwache[a], nahm sie und führte sie zum König von Babylon in Ribla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Oberste der Schlächter“; wahrscheinlich ein babylonischer Amts- und Militärtitel für den Befehlshaber einer Garde oder Leibwache.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „führte sie in Ribla vor den König von Babylon“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das schlichte „nahm“ gibt לקח wieder, ohne die im Verb nicht ausdrücklich enthaltene Gewaltkomponente von „ergriff“ oder „nahm gefangen“ hinzuzufügen.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Der Personenname wird in einer im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: רַב טַבָּחִים
  choice: Befehlshaber der königlichen Leibwache
  rationale: Der wörtlich ungewöhnliche Titel bezeichnet im neubabylonischen Hof- und Militärwesen wahrscheinlich einen hohen Sicherheits- oder Gardeoffizier. Die Wiedergabe ist verständlich und lässt die wörtliche Bedeutung in der Fußnote sichtbar.
- source_word: וַיֹּלֶךְ
  choice: brachte
  rationale: Die kausative Verbform bedeutet hier, dass Nebusaradan die Gefangenen an einen bestimmten Ort beziehungsweise zu einer Person führen ließ oder führte; „brachte“ ist dafür natürliches modernes Deutsch.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: zum König von Babylon
  rationale: עַל bezeichnet mit dem Bewegungsverb hier die Bewegung in die Gegenwart des Königs. „Zum“ ist idiomatisch; „vor den König“ bleibt als präzisierende Alternative erhalten.
- source_word: רִבְלָתָה
  choice: nach Ribla
  rationale: Die Richtungsendung -ָה kennzeichnet Ribla als Ziel der Bewegung. Im Satz kann die Wendung zugleich so verstanden werden, dass der König sich dort befand.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der historische Amtstitel wird funktional verständlich wiedergegeben, während seine wörtliche Form in der Fußnote erhalten bleibt. Die mögliche Nuance einer Vorführung vor den König wird nicht stillschweigend ausgeschlossen.
