base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: de
  text: Da machten sich das ganze Volk, vom Geringsten bis zum Größten, und die Befehlshaber der Truppen[a] auf und zogen nach Ägypten; denn sie fürchteten sich vor den Chaldäern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Heerführer“ oder „die Hauptleute der Truppen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: brachen … auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet hier die entschlossene Einleitung des Aufbruchs. „Aufbrechen“ gibt die Handlung im Deutschen natürlich wieder, ohne sie auf ein bloßes Aufstehen zu beschränken.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: Die kollektive Wendung wird umfassend und zugleich idiomatisch wiedergegeben.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: vom Geringsten bis zum Größten
  rationale: Die hebräische Formel bezeichnet umfassende soziale Stellung oder Bedeutung und nicht zwingend das Lebensalter.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: und die Befehlshaber der Truppen
  rationale: שָׂרֵי bezeichnet leitende Personen, während חֲיָלִים hier militärische Einheiten meint. Die Formulierung ist präzise und in modernem Deutsch verständlich.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: und zogen nach Ägypten
  rationale: Obwohl בוא grundsätzlich „kommen“ bedeuten kann, verlangt die deutsche Erzählperspektive hier natürlich „nach Ägypten ziehen“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die Flucht ein. „Denn“ bewahrt den erzählerischen Satzfluss und gibt die kausale Beziehung klar wieder.
- source_word: יָרְאוּ
  choice: sie fürchteten sich
  rationale: ירא bezeichnet hier Furcht; die reflexive Formulierung ist natürliches, würdevolles Standarddeutsch.
- source_word: מִפְּנֵי כַשְׂדִּים
  choice: vor den Chaldäern
  rationale: In Verbindung mit ירא bezeichnet מִפְּנֵי den Gegenstand der Furcht. „Chaldäer“ bewahrt die übliche historische Volksbezeichnung.
