base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: de
  text: Er verbrannte das Haus Jahwes[a], das Haus des Königs und alle Häuser Jerusalems; jedes große Haus verbrannte er mit Feuer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Tempel Jahwes“. Wörtlich: „das Haus Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jedes stattliche Haus“ beziehungsweise „jedes bedeutende Haus“. Der hebräische Ausdruck kann sich auf Größe oder gesellschaftliche Bedeutung beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Er verbrannte
  rationale: Das Qal-Wayyiqtol von שׂרף bezeichnet die fortschreitende Erzählhandlung. „Er verbrannte“ gibt Verb und Subjekt direkt und in natürlichem Deutsch wieder.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bewahrt das hebräische Bild; „Tempel Jahwes“ ist die kontextuell eindeutige, aber stärker deutende Alternative.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, entsprechend dem hebräischen Tetragramm und ohne ihn durch einen Titel zu ersetzen.
- source_word: בֵּית הַמֶּלֶךְ
  choice: das Haus des Königs
  rationale: Die Wiedergabe wahrt die Parallele zu „Haus Jahwes“. „Königspalast“ wäre idiomatischer, legt die funktionale Bedeutung jedoch stärker aus.
- source_word: כָּל בָּתֵּי יְרוּשָׁלַםִ
  choice: alle Häuser Jerusalems
  rationale: Die Genitivkonstruktion bildet die hebräische Status-constructus-Verbindung knapp und verständlich ab.
- source_word: כָּל בֵּית גָּדוֹל
  choice: jedes große Haus
  rationale: Der Singular nach כָּל wird distributiv wiedergegeben. „Groß“ erhält die mögliche Bedeutung sowohl räumlicher Größe als auch gesellschaftlicher Bedeutung.
- source_word: שָׂרַף בָּאֵשׁ
  choice: verbrannte er mit Feuer
  rationale: Die Wiederholung des Verbs samt Instrumentalangabe bewahrt die nachdrückliche Schlussformulierung des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt ihn als Eigennamen; die traditionelle Ersetzung durch „der HERR“ bleibt eine mögliche Übersetzungskonvention, steht hier aber nicht im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme von „verbrannte er mit Feuer“ ist bewusst etwas feierlich und erhält die emphatische hebräische Satzstruktur. Das Semikolon macht die Wiederholung im Deutschen gut lesbar.
