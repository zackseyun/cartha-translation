  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: de
  text: Dann nahmen sie den König gefangen und brachten ihn hinauf zum König von Babylon nach Ribla. Dort fällten sie ein Urteil über ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Sie redeten mit ihm ein Urteil“; die hebräische Wendung bezeichnet das Aussprechen eines gerichtlichen Urteils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: nahmen sie … gefangen
  rationale: תפשׂ bezeichnet hier das Ergreifen des fliehenden Königs. „Gefangen nehmen“ gibt den Vorgang im modernen Deutschen klar und natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: den König
  rationale: Der bestimmte Ausdruck verweist auf den bereits genannten König Zedekia; der hebräische Text wiederholt seinen Namen hier nicht.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: brachten ihn hinauf
  rationale: Die Wiedergabe bewahrt die Richtungsbedeutung von עלה, ohne die Handlung als freiwilliges Hinaufgehen erscheinen zu lassen.
- source_word: אֶל מֶלֶךְ בָּבֶל רִבְלָתָה
  choice: nach Ribla zum König von Babylon
  rationale: Die Zielendung an רִבְלָתָה bezeichnet die Bewegung nach Ribla; אֶל gibt das Ziel beim König von Babylon an. Die deutsche Wortstellung macht beide Bezüge eindeutig.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: sprachen sie das Urteil über ihn
  rationale: Die Wendung hat gerichtlichen Sinn. Diese Formulierung bleibt näher am Bild des hebräischen Verbs „sprechen“ als „verurteilten ihn“ und ist zugleich verständliches, würdiges Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hinauf“ bewahrt die Richtungsnuance des hebräischen Verbs; „sprachen das Urteil über ihn“ erhält die Rechtsidiomatik, ohne sie konfessionell oder interpretierend auszubauen.
