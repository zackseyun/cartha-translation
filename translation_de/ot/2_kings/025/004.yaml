  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֨י הַ/מִּלְחָמָ֤ה הַ/לַּ֨יְלָה֙ דֶּ֜רֶךְ שַׁ֣עַר בֵּ֣ין הַ/חֹמֹתַ֗יִם אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּ֖לֶךְ דֶּ֥רֶךְ הָ/עֲרָבָֽה־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: de
  text: Da wurde die Stadt durchbrochen, und alle Kriegsleute flohen[a] bei Nacht durch das Tor zwischen den beiden Mauern beim Garten des Königs, während die Chaldäer[b] die Stadt ringsum eingeschlossen hatten. Der König[c] zog auf dem Weg zur Araba[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb »flohen« steht nicht ausdrücklich im Hebräischen, sondern ist aus dem Zusammenhang ergänzt.
    reason: textual_clarity
  - marker: b
    text: 'Oder: »die Babylonier«. Im Hebräischen steht ausdrücklich »die Chaldäer«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »er zog«. Das Subjekt bleibt im Hebräischen unausgesprochen; der Zusammenhang weist auf den König.'
    reason: lexical_alternative
  - marker: d
    text: Die Araba ist die Jordangraben-Region, die sich vom Jordantal nach Süden erstreckt; traditionell wird der Name auch mit »die Ebene« wiedergegeben.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: Da wurde die Stadt durchbrochen
  rationale: Die Nifalform von בקע bezeichnet im Belagerungszusammenhang das gewaltsame Durchbrechen der Stadt beziehungsweise ihrer Befestigung. Die Formulierung bleibt nahe am hebräischen Ausdruck, ohne ausdrücklich eine im Text nicht genannte Mauer einzusetzen.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: alle Kriegsleute
  rationale: Die Wendung gibt das wörtliche »Männer des Krieges« in einer verständlichen, würdevollen militärischen Bezeichnung wieder und bewahrt den ausdrücklich männlichen Bezug.
- source_word: הַלַּיְלָה
  choice: bei Nacht
  rationale: Das Substantiv wird hier adverbial gebraucht; »bei Nacht« ist knapp und erzählerisch natürlich.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: durch das Tor zwischen den beiden Mauern
  rationale: »Durch das Tor« gibt die Wegangabe im Deutschen idiomatisch wieder; der Dual חֹמֹתַיִם wird ausdrücklich mit »den beiden Mauern« abgebildet.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: beim Garten des Königs
  rationale: עַל bezeichnet hier die räumliche Nähe des Tores zum königlichen Garten; »beim« ist dafür eine natürliche deutsche Wiedergabe.
- source_word: וְכַשְׂדִּים
  choice: die Chaldäer
  rationale: Der hebräische Text nennt ausdrücklich die Chaldäer. Der historisch erklärende Ausdruck »Babylonier« wird daher nicht in den Haupttext gesetzt.
- source_word: עַל הָעִיר סָבִיב
  choice: die Stadt ringsum eingeschlossen hatten
  rationale: Die Formulierung macht die vollständige Umzingelung deutlich. Das Plusquamperfekt gibt im Deutschen natürlich den bereits bestehenden Belagerungszustand wieder, während die Kriegsleute entkamen.
- source_word: וַיֵּלֶךְ
  choice: Der König zog
  rationale: Das hebräische Verb hat ein unausgedrücktes Subjekt. Der Erzählzusammenhang identifiziert es als den König; eine Fußnote weist auf die grammatische Offenheit hin.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: in Richtung der Araba
  rationale: דֶּרֶךְ bezeichnet hier die eingeschlagene Route. »Araba« bleibt als geografischer Eigenname erhalten, statt deutend mit »Ebene« übersetzt zu werden.
theological_decisions:
- issue: Unausgedrücktes Fluchtverb bei den Kriegsleuten
  choice: »flohen« wird im Haupttext zur Vervollständigung des deutschen Satzes ergänzt und durch eine Fußnote gekennzeichnet.
  alternative: Den elliptischen hebräischen Wortlaut ohne Verb nachbilden.
  rationale: Der hebräische Text setzt nach »alle Kriegsleute« unmittelbar mit Zeit- und Wegangaben fort. Der Zusammenhang und die Parallelüberlieferung zeigen eine Flucht; im Deutschen wäre ein Satz ohne Verb unverständlich. Die Kennzeichnung bewahrt zugleich die textliche Transparenz.
- issue: Unausgedrücktes Subjekt von וַיֵּלֶךְ
  choice: »Der König« wird aus dem Kontext ergänzt und mit einer Fußnote markiert.
  alternative: »Er zog«
  rationale: Die explizite Nennung verhindert im Deutschen, dass die Einzahl fälschlich auf einen der Kriegsleute bezogen wird, während die Fußnote die grammatische Mehrdeutigkeit des Hebräischen offenlegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Historische und geografische Bezeichnungen werden beibehalten; notwendige Ergänzungen gegenüber der knappen hebräischen Syntax sind transparent durch Fußnoten markiert.
