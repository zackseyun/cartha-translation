  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחַ֣ר הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥גוּ אֹת֖/וֹ בְּ/עַרְב֣וֹת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: de
  text: Doch das Heer der Chaldäer[a] verfolgte den König und holte ihn in den Steppen von Jericho[b] ein. Sein ganzes Heer aber zerstreute sich von ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Heer der Babylonier«. Im Hebräischen steht »Chaldäer«, die in diesem Zusammenhang verwendete Bezeichnung für die babylonischen Truppen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in den Ebenen von Jericho«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: das Heer der Chaldäer
  rationale: חֵיל bezeichnet hier eine militärische Streitmacht; כַּשְׂדִּים wird entsprechend der hebräischen ethnisch-politischen Bezeichnung mit »Chaldäer« wiedergegeben.
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  choice: verfolgte den König
  rationale: Das deutsche Verb »verfolgen« gibt רדף mit אַחַר idiomatisch und präzise wieder; das kollektive Singularsubjekt »Heer« verlangt im Deutschen den Singular.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: holte ihn … ein
  rationale: נשׂג bezeichnet in diesem Verfolgungszusammenhang das Einholen des Flüchtenden.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: in den Steppen von Jericho
  rationale: עֲרָבוֹת bezeichnet offene, trockene Steppen- oder Ebenengebiete. »Steppen« bewahrt diesen landschaftlichen Gehalt genauer als das allgemeinere »Ebenen«.
- source_word: וְכָל חֵילוֹ
  choice: sein ganzes Heer
  rationale: חֵיל bezeichnet erneut die Streitmacht; כָל wird im natürlichen Deutschen mit »ganzes« ausgedrückt.
- source_word: נָפֹצוּ מֵעָלָיו
  choice: zerstreute sich und verließ ihn
  rationale: נפץ beschreibt das Auseinandergetriebenwerden beziehungsweise Sichzerstreuen. מֵעָלָיו bezeichnet die Trennung vom König; »und verließ ihn« macht diese im Deutschen sonst schwerfällige Beziehung klar, ohne einen zusätzlichen Vorgang zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. »Chaldäer« bewahrt die historische Bezeichnung des Ausgangstextes; die verständlichere Identifikation als Babylonier steht in der Fußnote. Die Satzteilung vermeidet einen überladenen deutschen Satz.
