  source_fidelity: Der Entwurf gibt Verfolgung, Einholen und den Ort in den Steppen von Jericho zutreffend wieder. Die Wiedergabe „zerstreute sich und verließ ihn“ fügt jedoch mit „verließ ihn“ einen eigenständigen, im Hebräischen nicht ausdrücklich formulierten Vorgang hinzu. מֵעָלָיו bezeichnet die Trennung bzw. das Zerstreuen weg von dem König und sollte unmittelbar an das Zerstreuen gebunden bleiben.
