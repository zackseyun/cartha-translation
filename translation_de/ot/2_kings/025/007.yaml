source:
  edition: WLC
  text: וְ/אֶת בְּנֵי֙ צִדְקִיָּ֔הוּ שָׁחֲט֖וּ לְ/עֵינָ֑י/ו וְ/אֶת עֵינֵ֤י צִדְקִיָּ֨הוּ֙ עִוֵּ֔ר וַ/יַּאַסְרֵ֨/הוּ֙ בַֽ/נְחֻשְׁתַּ֔יִם וַ/יְבִאֵ֖/הוּ בָּבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: de
  text: Sie schlachteten Zedekias Söhne vor seinen Augen. Dann blendete er Zedekia[a], fesselte ihn mit bronzenen Fesseln und brachte ihn nach Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »machte Zedekias Augen blind«; möglicherweise ist gemeint, dass er ihm die Augen ausstach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: schlachteten
  rationale: Das Verb bezeichnet gewaltsames Schlachten oder Töten. »Schlachteten« bewahrt die Härte der Szene deutlicher als das allgemeinere »töteten«.
- source_word: לְעֵינָיו
  choice: vor seinen Augen
  rationale: Die hebräische Wendung bezeichnet ein Geschehen in jemandes unmittelbarer Sicht und wird im Deutschen natürlich und anschaulich so wiedergegeben.
- source_word: עִוֵּר
  choice: blendete
  rationale: Das Verb bedeutet »blind machen«. Die knappe Wiedergabe wahrt die hebräische Aussage, ohne eine bestimmte Art der Verstümmelung ausdrücklich festzulegen.
- source_word: וַיַּאַסְרֵהוּ
  choice: fesselte ihn
  rationale: Das Verb bedeutet hier »binden/fesseln«; die folgende Angabe der metallenen Fesseln macht diese Bedeutung eindeutig.
- source_word: בַנְחֻשְׁתַּיִם
  choice: mit bronzenen Fesseln
  rationale: Die Form bezeichnet metallene Zwangsmittel, wahrscheinlich paarige Fesseln. »Bronzene Fesseln« ist präzise und im modernen Deutsch verständlich.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: brachte ihn nach Babel
  rationale: Die gewöhnliche Bedeutung von בוא im Hifil ist »bringen«; »Babel« ist die etablierte deutsche Bezeichnung der Stadt im alttestamentlichen Kontext.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: Zedekias Söhne
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung natürlich und vollständig wieder.
theological_decisions:
- issue: Wechsel vom pluralischen zum singularischen Handelnden
  choice: »Sie schlachteten … Dann blendete er …«
  alternative: Den gesamten Satz mit einem pluralischen Subjekt wiedergeben oder das singularische Subjekt ausdrücklich als den König von Babel benennen
  rationale: Der hebräische Text wechselt bewusst von der 3. Person Plural bei der Tötung der Söhne zur 3. Person Singular bei Blendung, Fesselung und Wegführung. Die Übersetzung bewahrt diesen Wechsel, ohne den im Vers nicht genannten Handelnden ergänzend zu identifizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst nüchterner, aber eindringlicher Gewaltdarstellung. Der Wechsel von »sie« zu »er« folgt dem Hebräischen; der neue Satz macht ihn im Deutschen leichter erfassbar. Die Fußnote erhält die Spannung zwischen der lexikalischen Grundbedeutung »blind machen« und der wahrscheinlich gemeinten konkreten Verstümmelung.
