source:
  edition: WLC
  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: de
  text: Die beiden Säulen, das eine Meer und die Gestelle, die Salomo für das Haus Jahwes angefertigt hatte – die Bronze all dieser Geräte wurde nicht gewogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für die Bronze all dieser Geräte wurde kein Gewicht angegeben.“ Die Bronze wurde wegen ihrer gewaltigen Menge nicht gewogen.'
    reason: Lexikalische Alternative zu מִשְׁקָל und Erläuterung der idiomatischen Aussage.
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: die beiden Säulen
  rationale: עַמּוּדִים bezeichnet die beiden bekannten Tempelsäulen. »Säulen« ist im Deutschen der natürliche und im Tempelkontext geläufige Ausdruck.
- source_word: הַיָּם הָאֶחָד
  choice: das eine »Meer«
  rationale: יָם ist hier die Bezeichnung des großen bronzenen Wasserbeckens im Tempel. Die Anführungszeichen kennzeichnen »Meer« als Namen beziehungsweise kultischen Fachausdruck, ohne ihn paraphrasierend aufzulösen.
- source_word: וְהַמְּכֹנוֹת
  choice: und die Gestelle
  rationale: מְכֹנוֹת bezeichnet die fahrbaren Untergestelle der Becken. »Gestelle« ist konkret und in modernem Deutsch verständlich.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: die Salomo … angefertigt hatte
  rationale: Das Plusquamperfekt entspricht dem rückblickenden Erzählzusammenhang; »angefertigt« passt zu den genannten Metallgegenständen.
- source_word: לְבֵית יְהוָה
  choice: für das Haus Jahwes
  rationale: »Haus« bewahrt die hebräische Wendung בֵית, während »Jahwe« die im Deutschen geläufige Wiedergabe des Gottesnamens יהוה ist.
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֹשֶׁת
  choice: die Bronze … war nicht zu wiegen
  rationale: Die Formulierung gibt die idiomatische Aussage wieder, dass wegen der gewaltigen Menge keine Gewichtsangabe erfolgte, ohne die lexikalische Alternative »es gab kein Gewicht« auszuschließen.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: all dieser Geräte
  rationale: כֵּלִים ist ein weiter Begriff für Gegenstände oder Geräte. »Geräte« schließt die verschiedenartigen Tempelausstattungen natürlich zusammen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den persönlichen Bundesnamen in seiner im Deutschen üblichen Form, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die hervorgehobene Aufzählung des Hebräischen natürlich ab. »Meer« bleibt als technische Bezeichnung des großen Tempelbeckens erhalten.
