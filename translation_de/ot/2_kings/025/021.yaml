  text: וַ/יַּ֣ךְ אֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִיתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: de
  text: Der König von Babylon schlug sie nieder und tötete sie in Ribla im Land Hamat.[a] So wurde Juda aus seinem Land in die Verbannung geführt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „schlug sie und tötete sie“. Das Hebräische verwendet nacheinander zwei Verben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „So ging Juda aus seinem Land in die Verbannung.“ Das hebräische Verb kann hier aktiv oder dem Sinn nach passiv wiedergegeben werden; die passive Formulierung hebt die erzwungene Wegführung hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: schlug sie nieder
  rationale: נכה bedeutet gewöhnlich „schlagen“. „Schlug sie nieder“ bewahrt die Gewalthandlung und nimmt dem folgenden ausdrücklichen „tötete sie“ nicht seine eigene Aussage.
- source_word: וַיְמִיתֵם
  choice: tötete sie
  rationale: Die Hifil-Form von מות bezeichnet das Verursachen des Todes. „Tötete sie“ ist im Deutschen klar und weniger deutend als „ließ sie hinrichten“.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Natürliche und genaue Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: בְּרִבְלָה
  choice: in Ribla
  rationale: Bei Ortsnamen ist „in Ribla“ im Deutschen idiomatisch.
- source_word: בְּאֶרֶץ חֲמָת
  choice: im Land Hamat
  rationale: Genaue, knappe und im Deutschen gut verständliche Wiedergabe der geografischen Bezeichnung.
- source_word: וַיִּגֶל
  choice: wurde … in die Verbannung geführt
  rationale: Im Exilkontext bezeichnet גלה die Wegführung. Die passive Formulierung macht den erzwungenen Charakter der Deportation deutlich, ohne den im Hebräischen nicht genannten Handelnden einzusetzen.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Eigenname bleibt wie im Hebräischen metonymisch offen und kann das Königreich beziehungsweise seine Bevölkerung bezeichnen.
- source_word: מֵעַל אַדְמָתוֹ
  choice: aus seinem Land
  rationale: אדמה kann „Erdboden“ oder „Land“ bedeuten; im Zusammenhang der nationalen Verbannung ist „Land“ die natürliche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden aufeinanderfolgenden Tötungsverben werden erhalten, und die knappe metonymische Bezeichnung „Juda“ wird nicht erklärend aufgelöst.
