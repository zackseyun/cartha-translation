source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֞א נְבוּזַרְאֲדָ֧ן רַב טַבָּחִ֛ים עֶ֥בֶד מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: de
  text: Im fünften Monat, am siebten Tag des Monats – es war das neunzehnte Regierungsjahr König Nebukadnezars, des Königs von Babylon – kam Nebusaradan, der Oberste der Leibwache[a], ein Diener des Königs von Babylon, nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Oberster der Schlachter“; der Titel bezeichnet wahrscheinlich den Befehlshaber der königlichen Leibwache oder der Scharfrichter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: Im fünften Monat
  rationale: Die deutsche Erzählprosa benötigt hier kein einleitendes „Und“. Die kalendarische Angabe wird formal und klar wiedergegeben.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: am siebten Tag des Monats
  rationale: „Tag“ ist im Hebräischen vorausgesetzt und wird für eine natürliche, eindeutige deutsche Datumsangabe ergänzt.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: es war das neunzehnte Regierungsjahr König Nebukadnezars
  rationale: Die parenthetische Zeitbestimmung wird idiomatisch wiedergegeben. „Regierungsjahr“ verdeutlicht, dass die Jahreszählung auf die Herrschaft des Königs bezogen ist.
- source_word: מֶלֶךְ בָּבֶל
  choice: König von Babylon
  rationale: Die hebräische Status- und Herkunftsbezeichnung wird direkt und in geläufigem Deutsch wiedergegeben.
- source_word: בָּא
  choice: kam
  rationale: Die übliche narrative Bedeutung des Verbs בוא wird knapp und direkt wiedergegeben.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Die Namensform folgt der im Deutschen etablierten biblischen Umschrift.
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Der Titel bezeichnet im höfischen Zusammenhang wahrscheinlich den Befehlshaber der königlichen Wache beziehungsweise der mit Hinrichtungen beauftragten Männer. Die Übersetzung gibt die Funktion verständlich wieder; die wörtlichere Bedeutung wird in einer Fußnote bewahrt.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: ein Diener des Königs von Babylon
  rationale: עֶבֶד kann Diener, Untergebener oder Amtsträger bezeichnen. „Diener“ wahrt die soziale Unterordnung, ohne ungesichert Sklavenstatus oder ein bestimmtes Hofamt festzulegen.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Verwendet wird die geläufige deutsche Form des Ortsnamens.
