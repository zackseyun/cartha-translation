  text: וְ/אֶת הַ/סִּירֹ֨ת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַֽ/מְזַמְּר֣וֹת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר יְשָֽׁרְתוּ בָ֖/ם לָקָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: de
  text: Auch die Töpfe, die Schaufeln, die Lichtscheren[a], die Schalen und alle Geräte aus Bronze, mit denen man den Tempeldienst verrichtete, nahmen sie mit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Messer beziehungsweise Winzermesser. Das hebräische Wort kann ein Schneidwerkzeug bezeichnen; in dieser Liste von Tempelgeräten wird es häufig als Gerät zum Kürzen der Lampendochte verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: die Töpfe
  rationale: סִירוֹת bezeichnet gewöhnlich Töpfe oder Behälter; „Töpfe“ ist in diesem Inventartext natürlich und hinreichend offen.
- source_word: הַיָּעִים
  choice: die Schaufeln
  rationale: יָעִים sind Geräte zum Entfernen von Asche oder zum Bewegen von Kohlen; „Schaufeln“ entspricht dem kultischen Zusammenhang.
- source_word: הַמְזַמְּרוֹת
  choice: die Lichtscheren
  rationale: Das Wort kann Schneidwerkzeuge bezeichnen, wird in Listen von Tempelgeräten jedoch häufig als Werkzeug zum Kürzen der Lampendochte verstanden. Die Fußnote bewahrt die lexikalische Unsicherheit.
- source_word: הַכַּפּוֹת
  choice: die Schalen
  rationale: כַּפּוֹת kann kleine Gefäße, Schalen oder löffelartige Behälter bezeichnen; „Schalen“ ist verständlich, ohne die genaue Form zu stark festzulegen.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: alle Geräte aus Bronze
  rationale: כְּלִים ist ein weiter Begriff für Geräte, Gefäße oder Gegenstände. „Geräte“ passt zu der gemischten Aufzählung; נְחֹשֶׁת wird in diesem Kontext sachgerecht mit „Bronze“ wiedergegeben.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: mit denen man den Tempeldienst verrichtete
  rationale: שרת bezeichnet hier den kultischen Dienst. Das unpersönliche „man“ gibt das nicht ausdrücklich genannte Subjekt natürlich wieder; „Tempeldienst“ macht den aus dem Kontext eindeutigen Dienstbereich verständlich.
- source_word: לָקָחוּ
  choice: nahmen sie mit
  rationale: לקח bedeutet grundsätzlich „nehmen“; im Plünderungskontext bringt „mitnehmen“ die Entfernung der Gegenstände idiomatisch zum Ausdruck.
