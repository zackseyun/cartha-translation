  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖הוּ כֹּהֵ֣ן מִשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: de
  text: Der Befehlshaber der Leibwache nahm Seraja, den obersten Priester[a], Zefanja, den Priester zweiten Ranges, und die drei Hüter der Schwelle[b] fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „den Hohepriester“. Wörtlich: „den Priester, das Oberhaupt“ beziehungsweise „den obersten Priester“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „die Torhüter“ oder „die Wächter des Tempeleingangs“. Wörtlich: „die Hüter der Schwelle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: der Befehlshaber der Leibwache
  rationale: Der Titel bezeichnet hier den babylonischen Amtsträger Nebusaradan. Seine wörtlichen Bestandteile verweisen auf einen Obersten und auf Schlächter beziehungsweise Hinrichter; im königlich-militärischen Zusammenhang ist jedoch der Befehlshaber der königlichen Leibwache gemeint.
- source_word: וַיִּקַּח
  choice: nahm … fest
  rationale: לקח bedeutet grundsätzlich „nehmen“. Im unmittelbaren Zusammenhang werden die genannten Amtsträger in Gewahrsam genommen und anschließend weggeführt; „festnehmen“ gibt diesen kontextuell erkennbaren Zwang in natürlichem Deutsch wieder.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: den obersten Priester
  rationale: Die Wendung bedeutet wörtlich „den Priester, das Oberhaupt/den Obersten“ und bezeichnet den ranghöchsten Priester. „Oberster Priester“ bleibt näher an der hebräischen Formulierung als der ebenfalls mögliche traditionelle Titel „Hohepriester“.
- source_word: כֹּהֵן מִשְׁנֶה
  choice: den Priester zweiten Ranges
  rationale: מִשְׁנֶה bezeichnet eine nachgeordnete oder stellvertretende Rangstellung. Die Formulierung macht die Hierarchie klar, ohne genauer festzulegen, welche Amtsbefugnisse damit verbunden waren.
- source_word: שֹׁמְרֵי הַסַּף
  choice: Hüter der Schwelle
  rationale: Dies bildet das konkrete hebräische Bild wörtlich ab. Gemeint sind vermutlich Torhüter oder Wächter am Eingang des Tempels; diese Deutung wird in der Fußnote genannt.
- source_word: שְׁלֹשֶׁת
  choice: die drei
  rationale: Die Zahl steht in Verbindung mit der bestimmten folgenden Wortgruppe und bezeichnet drei Angehörige einer bekannten Amtsgruppe.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, dem Hebräischen entsprechenden Form wiedergegeben.
- source_word: צְפַנְיָהוּ
  choice: Zefanja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, dem Hebräischen entsprechenden Form wiedergegeben.
theological_decisions:
- issue: Bezeichnung des ranghöchsten Priesters
  choice: oberster Priester
  alternative: Hohepriester
  rationale: Der hebräische Ausdruck bezeichnet eindeutig den leitenden Priester, verwendet hier aber nicht die sonst mögliche Form mit dem Adjektiv „groß“. Die Übersetzung bewahrt diese sprachliche Eigenart, während die traditionelle Alternative in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Amtsbezeichnungen werden verständlich wiedergegeben, ohne die konkrete Bildsprache oder die Rangabstufungen des Hebräischen unnötig einzuebnen. Die Fußnotenmarker wurden den jeweils tatsächlich erläuterten Ausdrücken zugeordnet.
