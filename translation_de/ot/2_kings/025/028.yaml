  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: de
  text: Er sprach freundlich zu ihm und setzte seinen Thron höher als die Throne der Könige, die mit ihm in Babylon waren.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Er sprach Gutes mit ihm«; die Wendung bedeutet, dass er freundlich oder wohlwollend zu ihm sprach.'
    reason: lexical_alternative
  - marker: b
    text: »Thron« kann hier auch konkret »Sitz« bedeuten. Gemeint ist, dass Jojachin in Babylon einen höheren Rang als die anderen Könige erhielt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: Er redete freundlich mit ihm
  rationale: Die hebräische Wendung »Gutes mit jemandem reden« bezeichnet hier wohlwollendes oder freundliches Reden. Die gewählte Formulierung gibt den idiomatischen Sinn in natürlichem Deutsch wieder.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ מֵעַל
  choice: gab seinem Thron einen höheren Rang als
  rationale: נתן mit כִּסֵּא und מֵעַל beschreibt hier die Zuweisung einer höheren Stellung. Diese Wiedergabe macht den Rangvergleich verständlich, ohne den Thron lediglich als geschenkten Gegenstand aufzufassen.
- source_word: כִּסְאוֹ
  choice: seinem Thron
  rationale: »Thron« bewahrt sowohl das konkrete Bild eines Ehrensitzes als auch die damit verbundene königliche Rangstellung.
- source_word: כִּסֵּא הַמְּלָכִים
  choice: den Thronen der Könige
  rationale: Das Hebräische verwendet formal den Singular in einer Genitivverbindung. Im Deutschen bringt der distributive Plural natürlicher zum Ausdruck, dass Jojachins Stellung über derjenigen der anderen Könige lag.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: der Könige, die bei ihm waren
  rationale: Die relative Wendung wird eng am Hebräischen wiedergegeben; »bei ihm« bezeichnet die Könige in seinem Umfeld beziehungsweise an seinem Hof.
- source_word: בְּבָבֶל
  choice: in Babylon
  rationale: Standardmäßige lokale Wiedergabe des Ortsnamens.
