  yaml_path: translation/ot/2_kings/025/010.yaml
  text: And all the army of the Chaldeans who were with the captain of the guard tore down the walls of Jerusalem all around[a].
translation:
  language: de
  text: Und das ganze Heer der Chaldäer, das zum Obersten der Leibwache gehörte, riss die Mauern rings um Jerusalem nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Amtstitel rab-tabbachim kann auch mit »Oberster der Scharfrichter« oder »Befehlshaber der Leibgarde« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת
  choice: Mauern
  rationale: Der Plural von חוֹמָה bezeichnet hier die Stadtmauern beziehungsweise Befestigungsanlagen Jerusalems; »Mauern« ist im Deutschen natürlich und kontextgerecht.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: סָבִיב
  choice: rings um
  rationale: Die adverbiale Wendung bezeichnet den gesamten Umfang; »rings um Jerusalem« gibt dies knapp und idiomatisch wieder.
- source_word: נָתְצוּ
  choice: riss … nieder
  rationale: נתץ bezeichnet das gewaltsame Niederreißen oder Zerstören eines Bauwerks; »niederreißen« bewahrt die konkrete Bildlichkeit.
- source_word: כָּל חֵיל
  choice: das ganze Heer
  rationale: חֵיל bezeichnet in diesem militärischen Zusammenhang die Streitmacht als Kollektiv; כָּל hebt ihre Gesamtheit hervor.
- source_word: כַּשְׂדִּים
  choice: der Chaldäer
  rationale: Dies gibt das hebräische Ethnonym direkt wieder, statt es kontextuell zu »Babylonier« zu vereinheitlichen.
- source_word: אֲשֶׁר
  choice: das … war
  rationale: Das Relativpronomen verbindet das Heer elliptisch mit dem nachfolgenden Amtsträger. Die Ergänzung »beim … war« macht die Beziehung im Deutschen verständlich, ohne eine ausdrücklich nicht genannte Befehlsstruktur festzulegen.
- source_word: רַב טַבָּחִים
  choice: Oberster der Leibwache
  rationale: Der Amtstitel bezeichnet im königlichen Kontext einen hochrangigen Befehlshaber der Wache, der auch Hinrichtungen beaufsichtigen konnte. Die gewählte Form ist würdig und idiomatisch; wörtlichere Möglichkeiten werden in der Fußnote bewahrt.
