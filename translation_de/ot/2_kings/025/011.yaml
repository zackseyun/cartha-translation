  verdict: approve
  source_fidelity: Der Entwurf gibt die drei im Hebräischen genannten Gruppen vollständig wieder und ordnet die abschließende Aussage über die Deportation korrekt Nebusaradan zu. »Überläufer, die zum König von Babylon übergelaufen waren« trifft die militärisch-politische Bedeutung von נפל על. »führte ... in die Verbannung« gibt das Hifil von גלה angemessen als erzwungene Wegführung wieder.
  naturalness: Der Satz ist klares, modernes und zugleich würdiges Standarddeutsch. Die Bezugnahme im Relativsatz »der in der Stadt geblieben war« ist trotz des kollektivischen Singulars von »Rest des Volkes« verständlich und idiomatisch.
  terminology: »Nebusaradan« entspricht üblicher deutscher Bibelumschrift. »Oberste der Leibwache« ist eine sachgerechte funktionale Wiedergabe von רב טבחים; die Fußnote legt die wörtliche hebräische Bezeichnung transparent offen. »Verbannung« und »Überläufer« passen zum historischen Kontext, ohne ihn unnötig auszudeuten.
