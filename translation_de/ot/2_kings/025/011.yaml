id: 2KI.25.11
reference: 2 Kings 25:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: de
  text: Den Rest des Volkes, der in der Stadt geblieben war, die Überläufer, die zum König von Babylon übergelaufen waren,[a] und den Rest der Bevölkerung führte Nebusaradan, der Oberste der Leibwache,[b] in die Verbannung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Fallenden, die zum König von Babylon gefallen waren«; gemeint sind Menschen, die auf die babylonische Seite übergegangen waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Oberster der Schlächter«; wahrscheinlich ein Amtstitel für den Befehlshaber der königlichen Leibwache.'
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: den Rest des Volkes
  rationale: Gibt die verbliebene Bevölkerung nach Belagerung, Tötungen und früheren Wegführungen knapp und idiomatisch wieder.
- source_word: הַנִּשְׁאָרִים בָּעִיר
  choice: der in der Stadt geblieben war
  rationale: Das substantivierte Nifal-Partizip bezeichnet diejenigen, die in der Stadt übrig geblieben waren; der Singular richtet sich im Deutschen nach dem Kollektivausdruck »Rest des Volkes«.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל
  choice: die Überläufer, die ... übergelaufen waren
  rationale: נפל על ist hier ein militärisch-politischer Ausdruck für den Seitenwechsel zu einem Herrscher; die Wiederholung des hebräischen Wortstamms wird im Deutschen durch »Überläufer/übergelaufen« bewahrt.
- source_word: הַמֶּלֶךְ בָּבֶל
  choice: zum König von Babylon
  rationale: Natürliche Wiedergabe der Zugehörigkeitsverbindung und des Ziels des Überlaufens.
- source_word: יֶתֶר הֶהָמוֹן
  choice: den Rest der Bevölkerung
  rationale: הָמוֹן bezeichnet hier wahrscheinlich die übrige Menschenmenge bzw. Bevölkerung. »Bevölkerung« ist in diesem Deportationskontext natürlicher als »Menge«, ohne eine bestimmte soziale Gruppe festzulegen.
- source_word: הֶגְלָה
  choice: führte ... in die Verbannung
  rationale: Das Hifil von גלה bezeichnet die erzwungene Wegführung ins Exil; die Formulierung ist würdig und allgemein verständlich.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Im modernen deutschen Bibelgebrauch etablierte Umschrift des Eigennamens.
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Der wörtlich etwa »Oberster der Schlächter« lautende Ausdruck ist ein Amtstitel. Die funktionale Wiedergabe vermeidet die irreführende Vorstellung eines gewöhnlichen Schlächters oder Henkers.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt der hebräischen Aufzählung und setzt das Verb mit dem handelnden Amtsträger ans Ende; die idiomatische Bedeutung des Überlaufens wird im Haupttext klar ausgedrückt, während die auffällige wörtliche Bildsprache in der Fußnote erhalten bleibt.
