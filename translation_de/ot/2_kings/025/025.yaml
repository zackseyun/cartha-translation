  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: de
  text: Im siebten Monat kam Ismael, Sohn Netanjas, Sohn Elischamas, ein Nachkomme des Königshauses,[a] mit zehn Männern. Sie schlugen Gedalja nieder, und er starb; ebenso erschlugen sie die Judäer und die Chaldäer,[b] die bei ihm in Mizpa waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Samen des Königtums“; gemeint ist die Abstammung aus dem Königshaus.'
    reason: lexical_alternative
  - marker: b
    text: „Chaldäer“ kann in diesem Zusammenhang auch mit „Babylonier“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: Im siebten Monat
  rationale: Die hebräische Eröffnungsformel führt das nächste Ereignis der Erzählung ein. Im Deutschen genügt hier die natürliche Zeitangabe; ein zusätzliches „Und es geschah“ wäre schwerfällig.
- source_word: בָּא
  choice: kam
  rationale: Gibt das einfache Bewegungsverb eng und idiomatisch wieder.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: ein Nachkomme des Königshauses
  rationale: Bewahrt den Gedanken dynastischer Abstammung, ohne die im modernen Deutschen missverständliche wörtliche Formulierung „vom königlichen Samen“ zu verwenden.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: mit zehn Männern
  rationale: Natürliche deutsche Wiedergabe der Begleitung beim Kommen.
- source_word: וַיַּכּוּ ... וַיָּמֹת
  choice: Sie erschlugen Gedalja, sodass er starb
  rationale: „Erschlugen“ gibt die gewaltsame, tödliche Handlung wieder; „sodass er starb“ hält zugleich die ausdrücklich folgende singuläre Aussage über Gedaljas Tod fest.
- source_word: הַיְּהוּדִים
  choice: die Judäer
  rationale: Im historischen Zusammenhang bezeichnet das Wort die Menschen aus Juda; „Judäer“ vermeidet eine unnötige Verlagerung in späteren Sprachgebrauch.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Entspricht dem hebräischen Ethnonym; im Kontext sind damit babylonische Angehörige der Besatzungsmacht gemeint.
- source_word: בַּמִּצְפָּה
  choice: in Mizpa
  rationale: Die Ortsangabe wird im Deutschen bei einer Siedlung natürlich mit „in“ wiedergegeben.
