  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: de
  text: 'Im siebenunddreißigsten Jahr der Verbannung Jojachins, des Königs von Juda, im zwölften Monat, am siebenundzwanzigsten Tag des Monats, geschah es: Ewil-Merodach[b], der König von Babylon, erhob im Jahr seiner Herrschaft[c] das Haupt Jojachins, des Königs von Juda,[a] aus dem Gefängnis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „das Haupt erheben“ bedeutet hier, Jojachins Stellung zu erhöhen oder ihm Gunst zu erweisen; dies begann mit seiner Freilassung aus dem Gefängnis.
    reason: lexical_alternative
  - marker: b
    text: Ewil-Merodach ist historisch auch unter dem Namen Amel-Marduk bekannt.
    reason: cultural_note
  - marker: c
    text: '„Im Jahr seiner Herrschaft“ kann bedeuten: „im ersten Jahr seiner Herrschaft“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: geschah es
  rationale: Die deutsche Erzählformel gibt den episodenöffnenden hebräischen Wayyiqtol natürlich und ohne archaische Wendung wieder.
- source_word: לְגָלוּת
  choice: der Verbannung
  rationale: גָּלוּת bezeichnet die durch Deportation entstandene Verbannung; „Verbannung“ ist hier präzise und allgemein verständlich.
- source_word: יְהוֹיָכִין
  choice: Jojachin
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: im zwölften Monat
  rationale: Natürliche deutsche Wiedergabe der hebräischen Datumsformel.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: am siebenundzwanzigsten Tag des Monats
  rationale: Die leichte Explizierung durch „Tag“ macht die Datumsangabe im Deutschen eindeutig.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Ewil-Merodach
  rationale: Traditionelle deutsche Bibelform des babylonischen Königsnamens; die historisch erschlossene akkadische Form steht in der Fußnote.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: im Jahr seiner Herrschaft
  rationale: Diese Wiedergabe bleibt nahe am Wortlaut und legt nicht ohne Kennzeichnung fest, ob ausdrücklich das erste Regierungsjahr gemeint ist.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: erhob ... das Haupt
  rationale: Die bildhafte hebräische Redewendung bleibt im Haupttext erhalten; ihre kontextuelle Bedeutung wird in der Fußnote erläutert.
- source_word: מִבֵּית כֶּלֶא
  choice: holte ihn aus dem Gefängnis
  rationale: Das ergänzte Pronomen und Verb machen im Deutschen klar, dass die Erhöhung seiner Stellung mit der Herausführung aus der Haft verbunden war, ohne den Inhalt des Satzes zu verändern.
