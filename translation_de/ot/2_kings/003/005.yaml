base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/005.yaml
  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: de
  text: Als Ahab gestorben war,[a] lehnte sich der König von Moab gegen den König von Israel auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nach Ahabs Tod“. Der hebräische Zeitausdruck lässt beide Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמוֹת
  choice: Als ... gestorben war
  rationale: Die Verbindung aus וַיְהִי und כְּמוֹת führt das nächste Geschehen ein und bestimmt es zeitlich. Im Deutschen gibt ein temporaler Nebensatz die hebräische Erzählbewegung natürlich wieder; das Plusquamperfekt macht deutlich, dass Ahabs Tod dem Aufstand vorausging.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וַיִּפְשַׁע
  choice: lehnte sich ... auf
  rationale: פשע bezeichnet hier den politischen Aufstand eines Vasallen gegen seinen Oberherrn. „Sich auflehnen gegen“ ist eine klare, gegenwärtige und würdige deutsche Wiedergabe.
- source_word: מֶלֶךְ מוֹאָב
  choice: der König von Moab
  rationale: Die hebräische Genitivverbindung wird in der üblichen deutschen Form wiedergegeben.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: gegen den König von Israel
  rationale: Bei פשע bezeichnet ב die Person, gegen deren Herrschaft sich der Aufstand richtet; im Deutschen entspricht dem die Präposition „gegen“.
