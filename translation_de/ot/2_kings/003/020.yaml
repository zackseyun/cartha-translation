- from: Und am Morgen, als das Speisopfer dargebracht wurde,[a] da kam auf einmal Wasser aus der Richtung von Edom,[b] und das Land füllte sich mit Wasser.
  to: Und am Morgen, als das Speisopfer dargebracht wurde,[a] da kam Wasser aus Richtung Edom,[b] und das Land füllte sich mit Wasser.
  rationale: Die Revision entfernt die nicht ausdrücklich im Hebräischen enthaltene Bedeutung „auf einmal“ und glättet die Richtungsangabe. Die knappe Wendung „da kam Wasser“ bewahrt den narrativen Hinweischarakter von וְהִנֵּה und lässt zugleich die im Partizip angelegte Anschaulichkeit ohne unnatürliche Konstruktion erkennen.
