  naturalness: „Aus Richtung Edom“ ist im modernen Standarddeutsch idiomatischer als „aus der Richtung von Edom“. Die Erzählwendung „und da kam Wasser“ ist natürlich und vermittelt die aufmerksamkeitslenkende Funktion von וְהִנֵּה ohne zusätzliche Behauptung.
  terminology: „Speisopfer“ ist als etablierter kultischer Fachausdruck für מִנְחָה vertretbar. Die Fußnote erklärt die wörtliche Bildsprache angemessen, ohne den Haupttext zu überladen.
