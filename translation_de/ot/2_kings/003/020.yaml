base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: de
  text: Und am Morgen, als das Speisopfer dargebracht wurde,[a] da kam Wasser aus Richtung Edom,[b] und das Land füllte sich mit Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „beim Aufsteigen des Speisopfers“; gemeint ist seine Darbringung auf dem Altar.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf dem Weg von Edom her“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Und am Morgen
  rationale: Die fortlaufende hebräische Erzählungsform wird im Deutschen natürlich mit „Und“ wiedergegeben; die Zeitangabe ist unmittelbar.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: als das Speisopfer dargebracht wurde
  rationale: Wörtlich steht „beim Aufsteigen des Speisopfers“. Im Opferkontext bezeichnet עלה dessen Darbringung; „Speisopfer“ ist die übliche sachgerechte Wiedergabe von מִנְחָה.
- source_word: וְהִנֵּה
  choice: da … auf einmal
  rationale: Die Konstruktion lenkt den Blick auf das überraschend eintretende Geschehen. Die deutsche Wendung bewahrt diese Lebendigkeit natürlicher als das heute gehobene „siehe“.
- source_word: מַיִם בָּאִים
  choice: kam … Wasser
  rationale: Obwohl das Partizip das herankommende Wasser anschaulich vor Augen stellt, trägt das deutsche Präteritum den narrativen Ablauf natürlicher; „Wasser“ wird als Stoffbezeichnung im Singular konstruiert.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: aus der Richtung von Edom
  rationale: דֶּרֶךְ bezeichnet hier den Weg beziehungsweise die Richtung, aus der das Wasser kam.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: das Land füllte sich mit Wasser
  rationale: Die resultative Aussage wird idiomatisch reflexiv wiedergegeben. הָאָרֶץ meint hier das Gelände beziehungsweise Land der Szene, nicht die ganze Erde; der im Deutschen unnötige Artikel vor „Wasser“ entfällt.
