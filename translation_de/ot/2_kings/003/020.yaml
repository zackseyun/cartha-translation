translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die überraschende Wahrnehmung, die וְהִנֵּה ausdrückt, wird mit „da … auf einmal“ vermittelt; die kultische Sprache bleibt durch „Speisopfer“ und „dargebracht“ erhalten.
