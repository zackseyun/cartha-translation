  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe des Gottesnamens. „Musiker“ bleibt mit der Anmerkung angemessen allgemein; die Fußnote zur „Hand Jahwes“ erläutert die Bildrede, ohne sie im Haupttext auf eine einzige Wirkungsweise festzulegen.
