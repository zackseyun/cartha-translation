source:
  edition: WLC
  text: וְ/עַתָּ֖ה קְחוּ לִ֣/י מְנַגֵּ֑ן וְ/הָיָה֙ כְּ/נַגֵּ֣ן הַֽ/מְנַגֵּ֔ן וַ/תְּהִ֥י עָלָ֖י/ו יַד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: de
  text: Nun aber holt mir einen Musiker.[a] Und als der Musiker spielte, kam die Hand Jahwes über Elisa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist jemand, der ein Musikinstrument spielt; welches Instrument es war, sagt der hebräische Text nicht.
    reason: lexical_alternative
  - marker: b
    text: „Die Hand Jahwes“ ist eine hebräische Bildrede für Gottes wirksame Macht oder prophetische Einwirkung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun aber
  rationale: Die Wendung leitet einen unmittelbaren Übergang und zugleich eine Abwendung vom zuvor Gesagten ein. „Nun aber“ gibt beides in natürlichem Deutsch wieder.
- source_word: קְחוּ לִי
  choice: holt mir
  rationale: Der Imperativ im Plural mit לִי fordert die Angesprochenen idiomatisch dazu auf, jemanden für den Sprecher herbeizuholen.
- source_word: מְנַגֵּן
  choice: einen Musiker
  rationale: Das Partizip von נגן bezeichnet hier allgemein jemanden, der ein Musikinstrument spielt; die Art des Instruments wird nicht genannt.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: Und als der Musiker spielte
  rationale: Die Konstruktion bezeichnet den zeitlichen Begleitumstand des folgenden Geschehens. Die Formulierung bewahrt den erzählerischen Anschluss, ohne die hebräische Wendung hölzern nachzubilden.
- source_word: וַתְּהִי עָלָיו
  choice: kam … über ihn
  rationale: Die ereignishafte Form beschreibt, dass die Hand Jahwes in diesem Augenblick auf Elisa wirksam wurde. „Kam über ihn“ ist idiomatisch und wahrt das Bild.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Die wörtliche Wiedergabe erhält das hebräische Bild für göttliche Macht oder prophetische Einwirkung, ohne dessen genaue Wirkungsweise festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottesnamen. Die Wiedergabe „Jahwe“ bewahrt den Eigennamen in einer geläufigen deutschen Form.
- issue: Deutung der Wendung יַד יְהוָה
  choice: die Hand Jahwes kam über ihn
  alternative: die Kraft Jahwes erfüllte ihn; Jahwe gab ihm prophetische Vollmacht
  rationale: Im Zusammenhang weist die Wendung wahrscheinlich auf göttliche beziehungsweise prophetische Einwirkung hin. Das hebräische Bild bleibt jedoch stehen, damit die Übersetzung die genaue Art dieser Einwirkung nicht enger bestimmt als der Ausgangstext.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Plural des Imperativs wird bewahrt. Das Bild „die Hand Jahwes“ bleibt erhalten; die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
