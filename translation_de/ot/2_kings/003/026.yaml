id: 2KI.3.26
reference: 2 Kings 3:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: de
  text: Als der König von Moab sah, dass der Kampf zu stark für ihn war, nahm er siebenhundert Männer mit sich, die das Schwert zogen, um zum König von Edom[a] durchzubrechen. Doch es gelang ihnen nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen den König von Edom«. Die hebräische Präposition kann hier sowohl richtungsbezogen (»zu/auf … zu«) als auch feindlich (»gegen«) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: der Kampf zu stark für ihn war
  rationale: Die Wendung mit חזק und מן besagt, dass der Kampf den König von Moab überforderte beziehungsweise ihn zu überwältigen drohte. Die deutsche Formulierung gibt das idiomatisch und ohne zusätzliche Deutung wieder.
- source_word: אֹתוֹ
  choice: mit sich
  rationale: Nach וַיִּקַּח bezeichnet die Form hier das Mitnehmen einer Streitmacht. »Mit sich« ist im Deutschen verständlich und gibt den begleitenden Sinn wieder.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: siebenhundert Männer
  rationale: אִישׁ dient hier als Zählwort für männliche Personen in einem militärischen Zusammenhang. »Männer« ist direkter als das deutendere »Soldaten«.
- source_word: שֹׁלֵף חֶרֶב
  choice: die das Schwert zogen
  rationale: Die wörtliche Wendung »das Schwert ziehen« bezeichnet kampfbereite Männer. Die Übersetzung bewahrt das hebräische Bild.
- source_word: לְהַבְקִיעַ
  choice: durchzubrechen
  rationale: Der Hifil von בקע bezeichnet hier das gewaltsame Durchbrechen feindlicher Linien. »Durchbrechen« ist im Deutschen militärisch natürlich und präzise.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: zum König von Edom
  rationale: אֶל kann eine Bewegung »zu/auf … zu« oder in diesem militärischen Zusammenhang auch ein Vorgehen »gegen« jemanden bezeichnen. Der Haupttext wahrt die direktionale Grundbedeutung; die feindliche Lesart wird in der Fußnote genannt.
- source_word: וְלֹא יָכֹלוּ
  choice: Doch es gelang ihnen nicht
  rationale: Der Plural bezieht den König und seine Männer gemeinsam ein. Die Formulierung gibt ihr Scheitern beim versuchten Durchbruch in natürlichem Deutsch wieder.
theological_decisions: []
