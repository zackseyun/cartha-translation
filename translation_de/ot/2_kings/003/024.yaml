base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: de
  text: Als sie zum Lager Israels kamen, erhob sich Israel und schlug Moab, und die Moabiter flohen vor ihnen. Dann gingen sie hinein[a] und schlugen Moab weiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gingen sie in es hinein«. Das feminine Fürwort bezieht sich wahrscheinlich auf das Land oder Gebiet Moabs; möglich ist auch: »drangen sie weiter nach Moab vor«.'
    reason: Der Bezug des femininen Suffixes בָהּ ist im knappen hebräischen Ausdruck nicht ausdrücklich genannt und bleibt daher in gewissem Maß offen.
lexical_decisions:
- source_word: מַחֲנֵה
  choice: Lager
  rationale: Im militärischen Erzählzusammenhang bezeichnet das Substantiv das Heerlager; »Lager« ist die natürliche moderne deutsche Entsprechung.
- source_word: וַיָּקֻמוּ
  choice: erhob sich
  rationale: קום leitet hier das entschlossene Handeln Israels im Kampf ein. »Erhob sich« bewahrt die anschauliche Erzählfolge, ohne bereits »griff an« einzutragen.
- source_word: וַיַּכּוּ / וְהַכּוֹת
  choice: schlug / schlugen … weiter
  rationale: נכה bezeichnet das Schlagen im militärischen Sinn. Die Infinitivkonstruktion am Versende legt fortgesetztes Handeln nahe, was »schlugen … weiter« natürlich wiedergibt.
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: sodass die Moabiter vor ihnen flohen
  rationale: Die deutsche Wendung »vor ihnen flohen« bewahrt das hebräische Bild der Flucht vor dem Gegner; »die Moabiter« verdeutlicht den kollektiven Bezug des pluralischen Verbs auf Moab.
- source_word: וַיָּבֹאוּ בָהּ
  choice: drangen sie in das Land ein
  rationale: בוא mit ב bezeichnet das Hineingehen. Im militärischen Zusammenhang gibt »eindringen« den Vorstoß natürlich wieder; das feminine Suffix בָהּ bezieht sich wahrscheinlich auf das vorausgesetzte Land bzw. Gebiet.
- source_word: מוֹאָב
  choice: Moab
  rationale: Der Eigenname bleibt dort erhalten, wo der hebräische Text das Land bzw. Volk als kollektive Größe bezeichnet.
