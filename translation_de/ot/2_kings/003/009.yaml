base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: de
  text: So zog der König von Israel zusammen mit dem König von Juda und dem König von Edom los. Sie zogen sieben Tage lang auf einem Umweg; doch es gab kein Wasser für das Lager und für die Tiere in ihrem Gefolge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die bei ihren Füßen waren“; gemeint sind die Tiere, die sie begleiteten.'
    reason: Die Fußnote bewahrt das konkrete hebräische Bild hinter der idiomatischen Übersetzung.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: zog ... los
  rationale: Das erzählende Verb הלך bezeichnet hier den Aufbruch des Königs zum Feldzug. „zog ... los“ ist im militärischen Zusammenhang natürlich, ohne die Bedeutung unnötig zu spezifizieren.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: der König von Israel ... der König von Juda ... der König von Edom
  rationale: Die dreifache Wiederholung des Königstitels bewahrt die hebräische Reihung und macht die drei Bündnispartner ausdrücklich kenntlich.
- source_word: וַיָּסֹבּוּ דֶּרֶךְ שִׁבְעַת יָמִים
  choice: Sie zogen sieben Tage lang auf einem Umweg
  rationale: סבב bezeichnet hier eine ausholende beziehungsweise indirekte Bewegung; דֶּרֶךְ שִׁבְעַת יָמִים gibt die Dauer oder Ausdehnung des Weges an. Die Formulierung gibt beides in natürlichem Deutsch wieder, ohne eine genaue Streckenlänge festzulegen.
- source_word: וְלֹא הָיָה מַיִם
  choice: doch es gab kein Wasser
  rationale: Die hebräische Existenzkonstruktion wird direkt und idiomatisch wiedergegeben; „doch“ bildet den sachlichen Gegensatz zum vorausgehenden Zug ab.
- source_word: לַמַּחֲנֶה
  choice: für das Lager
  rationale: מַחֲנֶה kann sowohl das Lager als auch die dort versammelte Streitmacht bezeichnen. „Lager“ wahrt diese Bedeutungsbreite.
- source_word: וְלַבְּהֵמָה
  choice: für die Tiere
  rationale: Das kollektive בְּהֵמָה bezeichnet die mitgeführten Haus-, Last- oder Nutztiere. „Tiere“ ist umfassend und legt die genaue Tierart nicht fest.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: in ihrem Gefolge
  rationale: Wörtlich stehen die Tiere „zu ihren Füßen“. Im Kontext bezeichnet die Wendung die Tiere, die den Heereszug begleiteten; „in ihrem Gefolge“ gibt dies knapp und natürlich wieder.
