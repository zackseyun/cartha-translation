  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: de
  text: Sie rissen die Städte nieder. Auf jedes gute Stück Land[a] warf jeder seinen Stein, sodass sie es mit Steinen füllten. Jede Wasserquelle verstopften sie, und jeden guten Baum[b] fällten sie. Sie verwüsteten das Land, bis nur noch ihre Steine in Kir-Hareset übrig blieben[c]. Dann umzingelten die Schleuderer die Stadt und griffen sie an[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jedes gute Feld“. Das hebräische Wort bezeichnet ein Grundstück oder einen abgegrenzten Landanteil.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeden guten Baum“; gemeint sein können besonders wertvolle oder ertragreiche Bäume.'
    reason: lexical_alternative
  - marker: c
    text: 'Kir-Hareset ist ein Ortsname, wahrscheinlich die hier gemeinte wichtigste befestigte Stadt Moabs. Wörtlicher lässt sich der Satzteil wiedergeben: „bis nur ihre Steine in Kir-Hareset übrig waren“; die hebräische Verbform steht dabei im Singular.'
    reason: cultural_and_textual_note
  - marker: d
    text: 'Oder: „schlugen sie“. Das hebräische Verb bedeutet wörtlich „schlagen“ und bezeichnet hier einen militärischen Angriff auf die Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: Sie rissen die Städte nieder
  rationale: הרס bezeichnet das Niederreißen oder Abbrechen. „Rissen … nieder“ bewahrt den konkreten Sinn und passt zu Städten beziehungsweise ihren Befestigungen.
- source_word: חֶלְקָה טוֹבָה
  choice: gutes Stück Land
  rationale: חֶלְקָה bezeichnet einen abgegrenzten Anteil oder ein Grundstück. Im Zusammenhang ist produktiv nutzbares Land gemeint, ohne dass der hebräische Ausdruck ausdrücklich „Feld“ sagt.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: warf jeder seinen Stein, sodass sie es mit Steinen füllten
  rationale: Die distributive Form „jeder seinen Stein“ wird erhalten. „Sodass“ macht die Folge des wiederholten Steinwerfens verständlich; „mit Steinen“ ist im Deutschen zur Verdeutlichung des unausgesprochenen Inhalts ergänzt.
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: Jede Wasserquelle verstopften sie
  rationale: מַעְיַן ist eine Quelle, und סתם bezeichnet hier ihr Blockieren beziehungsweise Verstopfen.
- source_word: עֵץ טוֹב יַפִּילוּ
  choice: jeden guten Baum fällten sie
  rationale: „Guter Baum“ hält die offene Formulierung des Hebräischen fest; יַפִּילוּ bedeutet in diesem Zusammenhang, einen Baum zu Fall zu bringen.
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: Schließlich ließen sie nur Kir-Hareset mit seinen Steinen stehen
  rationale: Die Formulierung gibt das Ergebnis der Verwüstung wieder und bewahrt den Bezug der femininen Suffixform auf die Stadt. „Mit seinen Steinen“ bleibt bewusst näher am offenen hebräischen Ausdruck, statt ausdrücklich Mauern einzusetzen.
- source_word: הַקַּלָּעִים
  choice: die Schleuderer
  rationale: Das Substantiv bezeichnet mit Schleudern bewaffnete Kämpfer; „Schleuderer“ ist die präzise militärische Bezeichnung.
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: umzingelten die Stadt und griffen sie an
  rationale: סבב bezeichnet hier das Umringen der Stadt. נכה heißt wörtlich schlagen oder treffen, bezeichnet im militärischen Zusammenhang aber den Angriff; die Fußnote hält die wörtlichere Möglichkeit offen.
