  naturalness: Modernes Standarddeutsch und der erzählende Register sind gelungen. Mit „bis nur noch ihre Steine in Kir-Hareset übrig blieben“ wird die kritische Stelle zugleich idiomatischer und genauer. „Dann“ ist als schlichte Weiterführung der Ereignisse angemessener als „Doch“.
