  text: וַ/יֹּ֕אמֶר אֵי זֶ֥ה הַ/דֶּ֖רֶךְ נַעֲלֶ֑ה וַ/יֹּ֕אמֶר דֶּ֖רֶךְ מִדְבַּ֥ר אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: de
  text: 'Er fragte: „Welchen Weg sollen wir hinaufziehen?“ Er antwortete: „Den Weg durch die Wüste von Edom.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er fragte / Der andere antwortete
  rationale: Das Verb אמר bedeutet grundsätzlich „sagen“. Im ersten Satz zeigt die direkte Rede eine Frage, im zweiten eine Antwort; die kontextgerechten deutschen Redeeinleitungen geben die jeweilige Funktion natürlich wieder. „Der andere“ macht den Sprecherwechsel sichtbar, ohne einen Namen einzutragen.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Welchen Weg
  rationale: Die Verbindung אֵי זֶה fragt hier idiomatisch nach der auszuwählenden Route. „Welchen Weg“ ist im Deutschen natürlich und bewahrt die Offenheit zwischen Weg und Route.
- source_word: נַעֲלֶה
  choice: sollen wir hinaufziehen
  rationale: עלה bezeichnet „hinaufgehen“ oder „hinaufziehen“. Im Zusammenhang eines königlichen Feldzugs ist „hinaufziehen“ angemessen, ohne das ausdrücklichere „angreifen“ einzutragen.
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: Den Weg durch die Wüste von Edom
  rationale: Die verblos formulierte Antwort nennt die Route. „Durch“ gibt die idiomatische Bedeutung der Wegangabe wieder; „Wüste von Edom“ bewahrt die hebräische Genitivverbindung.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Der herkömmliche deutsche Name des Landes wird beibehalten.
