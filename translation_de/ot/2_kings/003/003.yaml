reference: 2 Kings 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: de
  text: Doch er hielt an den Sünden Jerobeams, des Sohnes Nebats, fest, durch die er Israel zum Sündigen gebracht hatte[a]; er wandte sich nicht von ihnen ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit denen er Israel zum Sündigen gebracht hatte“. Das hebräische Verb steht in einer kausativen Form und besagt, dass Jerobeam Israel zum Sündigen brachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Kennzeichnet hier die Einschränkung zur vorausgehenden positiven Beurteilung des Königs; „Doch“ gibt diesen Gegensatz im modernen Deutschen natürlich wieder.
- source_word: בְּחַטֹּאות
  choice: an den Sünden
  rationale: Bei דבק wird die Präposition im Deutschen idiomatisch mit „an etwas festhalten“ wiedergegeben.
- source_word: חַטֹּאות
  choice: Sünden
  rationale: Bewahrt die ausdrücklich moralisch-religiöse Wertung des hebräischen Textes, ohne die konkreten Verfehlungen näher festzulegen.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeams, des Sohnes Nebats
  rationale: Entspricht der üblichen deutschen Namensform und gibt die hebräische Abstammungsangabe klar wieder.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: durch die dieser Israel zum Sündigen verführt hatte
  rationale: Das Hifil von חטא ist kausativ. „Dieser“ weist eindeutig auf Jerobeam zurück; „durch die“ verbindet seine Sünden beziehungsweise Praktiken mit ihrer Wirkung auf Israel.
- source_word: דָּבֵק
  choice: er hielt … fest
  rationale: Gibt die beharrliche Bindung des Qal-Partizips von דבק in natürlichem Deutsch wieder.
- source_word: לֹא סָר
  choice: er wandte sich nicht … ab
  rationale: Entspricht der geläufigen Wendung für das Nichtaufgeben eines eingeschlagenen sündigen Weges.
- source_word: מִמֶּנָּה
  choice: von ihnen
  rationale: Obwohl das hebräische Suffix formal feminin Singular ist, verweist es sinngemäß auf die zuvor genannten Sünden; im Deutschen ist der Plural natürlich und eindeutig.
theological_decisions:
- issue: Theologische Beurteilung von Jerobeams Vorbild und seiner Fortsetzung
  choice: Die ausdrückliche Sprache von „Sünden“ und „Sündigen“ bleibt erhalten.
  alternative: Neutralisierende Wiedergaben wie „Praktiken“, „Abweichungen“ oder „Fehlverhalten“.
  rationale: Der hebräische Text fällt ausdrücklich ein moralisch-theologisches Urteil und beschreibt Jerobeams Einfluss mit einem kausativen Verb. Diese Wertung darf nicht auf eine bloß politische oder kultische Differenz reduziert werden.
- issue: Bezug des Relativsatzes
  choice: 'Jerobeam ist der Handelnde, seine Sünden sind das Mittel: „durch die dieser Israel zum Sündigen verführt hatte“.'
  alternative: 'Unmittelbarer Personenbezug: „Jerobeam, der Israel zum Sündigen verführt hatte“.'
  rationale: Die Formulierung bewahrt sowohl den grammatisch möglichen Bezug auf Jerobeams Sünden als auch Jerobeams persönliche Verantwortung als Subjekt des kausativen Verbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Festhalten an“ bringt die beharrliche Bindung idiomatisch zum Ausdruck; „zum Sündigen verführen“ bewahrt die kausative Aussage und die theologische Wertung.
