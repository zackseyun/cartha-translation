  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הַ/שֶּׁ֖מֶשׁ זָרְחָ֣ה עַל הַ/מָּ֑יִם וַ/יִּרְא֨וּ מוֹאָ֥ב מִ/נֶּ֛גֶד אֶת הַ/מַּ֖יִם אֲדֻמִּ֥ים כַּ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: de
  text: Sie standen früh am Morgen auf, und die Sonne schien auf das Wasser. Da sahen die Moabiter das Wasser ihnen gegenüber[a], rot wie Blut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Wasser auf der anderen Seite«. Im Hebräischen steht »Moab« kollektiv für die Moabiter; der räumliche Ausdruck kann »ihnen gegenüber« oder »auf der anderen Seite« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Sie standen früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet frühes Aufstehen oder Aufbrechen; im Zusammenhang ist „standen früh am Morgen auf“ natürlich und bewahrt die zeitliche Betonung.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: und die Sonne schien auf das Wasser
  rationale: זרח kann das Aufgehen oder Scheinen der Sonne bezeichnen. Hier steht die Lichtwirkung auf dem Wasser im Vordergrund, daher passt „schien“ am besten.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: Da sahen die Moabiter
  rationale: „Moab“ bezeichnet hier kollektiv das Volk. Im modernen Deutschen ist „die Moabiter“ verständlicher als das metonymische „Moab“.
- source_word: מִנֶּגֶד
  choice: ihnen gegenüber
  rationale: Der Ausdruck bezeichnet eine räumliche Lage gegenüber beziehungsweise auf der anderen Seite; „ihnen gegenüber“ bewahrt diese Relation knapp und idiomatisch.
- source_word: אֶת הַמַּיִם אֲדֻמִּים כַּדָּם
  choice: das Wasser … rot wie Blut
  rationale: Die Wiedergabe erhält die prädikative Farbangabe und den unmittelbaren, bildhaften Vergleich mit Blut.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Das kollektive „Moab“ wurde zugunsten des idiomatischen „die Moabiter“ aufgelöst; die räumliche Mehrdeutigkeit von מִנֶּגֶד bleibt mit „ihnen gegenüber“ weitgehend erhalten.
