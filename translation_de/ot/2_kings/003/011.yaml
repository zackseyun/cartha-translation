source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: de
  text: 'Und Joschafat sagte: »Gibt es hier keinen Propheten Jahwes, durch den wir Jahwe befragen können?« Da antwortete einer von den Dienern des Königs von Israel: »Elisa, der Sohn Schafats, ist hier. Er goss Elia Wasser über die Hände[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wassergießen über die Hände bezeichnet wahrscheinlich Elisas persönlichen Dienst für Elia, etwa beim Händewaschen.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: Gibt es hier keinen
  rationale: Gibt die verneinte Frage im heutigen Standarddeutsch natürlich und mit ihrer suchenden Dringlichkeit wieder.
- source_word: נָבִיא לַיהוָה
  choice: einen Propheten Jahwes
  rationale: Das Lamed bezeichnet hier die Zugehörigkeit beziehungsweise Beziehung zu Jahwe; der Genitiv ist im Deutschen klar und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: durch den wir Jahwe befragen können
  rationale: Bewahrt sowohl das Befragen Jahwes als auch die vermittelnde Rolle des Propheten in natürlichem Deutsch.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: einer von den Dienern des Königs von Israel
  rationale: Diener passt zum königlichen Umfeld, ohne den Ausdruck unnötig auf Amtsträger oder Sklaven einzuengen.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: Er goss Elia Wasser über die Hände
  rationale: Bewahrt das konkrete hebräische Bild und folgt der unmarkierten Vergangenheitsform, ohne ausdrücklich eine gewohnheitsmäßige Handlung hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Rolle des Propheten bei der Befragung Jahwes
  choice: durch den wir Jahwe befragen können
  alternative: von dem wir Jahwe suchen können
  rationale: Die Formulierung macht die im Hebräischen angelegte Vermittlung verständlich, ohne den Propheten zur Quelle der Antwort zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig gestaltet; das konkrete Bild des Wassergießens bleibt erhalten. Der Marker [a] steht unmittelbar bei der Aussage, die kulturell erläutert wird.
