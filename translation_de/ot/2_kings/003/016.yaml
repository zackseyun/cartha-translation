  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
translation:
  language: de
  text: 'Und er sagte: „So spricht Jahwe[a]: Macht dieses Bachbett[b] zu lauter Gruben![c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: „der HERR“. Im Hebräischen steht der Gottesname JHWH.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch „Trockental“, „Wadi“, „Flusstal“ oder „Bach“ bezeichnen; gemeint ist hier das Bett eines zeitweise wasserführenden Gewässers.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Macht dieses Bachbett zu Gruben, Gruben.“ Die Wiederholung betont die Vielzahl beziehungsweise Verteilung der Gruben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Die Wayyiqtol-Form führt in der fortlaufenden Erzählung die direkte Rede ein; die schlichte Wiedergabe wahrt die hebräische Abfolge.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die traditionelle deutsche Prophetenformel bewahrt den feierlichen Botenstil; das hebräische Perfekt wird in dieser festen Formel idiomatisch mit dem Präsens wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עָשֹׂה
  choice: Hebt … aus
  rationale: Das Infinitivus absolutus von עשה dient hier als Aufforderung. Im Zusammenhang mit Gruben ist „ausheben“ natürlich und macht die verlangte Handlung verständlich, ohne ihre genaue Ausführung weiter festzulegen.
- source_word: הַנַּחַל הַזֶּה
  choice: in diesem Bachbett
  rationale: נחל bezeichnet hier den Lauf beziehungsweise das Bett eines zeitweise wasserführenden Gewässers. „Bachbett“ ist im Deutschen verständlicher als das Lehnwort „Wadi“ und passt zum erwarteten Wasserzufluss.
- source_word: גֵּבִים גֵּבִים
  choice: überall Gruben
  rationale: Die Wiederholung des Plurals wirkt distributiv beziehungsweise verstärkend und bezeichnet zahlreiche, über das Bachbett verteilte Gruben. Eine Fußnote bewahrt die auffällige hebräische Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen YHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen; die traditionelle Ersetzung durch den Titel „der HERR“ bleibt als bekannte Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Prophetenformel bleibt bewusst feierlich. „Bachbett“ und „überall Gruben ausheben“ vermitteln die Geländesituation natürlich; die ungewöhnliche hebräische Wiederholung wird in der Fußnote offengelegt.
