base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: de
  text: Ihr werdet jede befestigte Stadt und jede auserlesene Stadt[a] schlagen, jeden guten Baum fällen, alle Wasserquellen verstopfen und jedes gute Stück Land mit Steinen verwüsten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede ausgewählte Stadt“ beziehungsweise „jede vorzügliche Stadt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „mit Steinen schmerzhaft machen“. Gemeint ist, nutzbares Land zu ruinieren, indem man Steine darauf wirft oder verteilt.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: ihr werdet … schlagen
  rationale: Das Hifil von נכה bezeichnet häufig ein Schlagen oder militärisches Angreifen. „Schlagen“ bewahrt die Direktheit und lässt offen, ob Eroberung oder Zerstörung im Vordergrund steht.
- source_word: עִיר מִבְצָר
  choice: befestigte Stadt
  rationale: מִבְצָר bezeichnet eine Befestigung oder einen befestigten Ort; „befestigte Stadt“ ist im Deutschen natürlich und sachlich genau.
- source_word: עִיר מִבְחוֹר
  choice: erlesene Stadt
  rationale: מִבְחוֹר bezeichnet etwas Ausgewähltes oder Vorzügliches. „Erlesen“ bewahrt diese Wertung, ohne sie auf Größe, Reichtum oder militärische Bedeutung festzulegen.
- source_word: תַּפִּילוּ
  choice: fällen
  rationale: Das Hifil von נפל bedeutet hier, die Bäume zu Fall zu bringen. „Fällen“ ist dafür die präzise deutsche Bezeichnung.
- source_word: כָּל עֵץ טוֹב
  choice: jeden guten Baum
  rationale: טוֹב bedeutet allgemein „gut“. Die Wiedergabe vermeidet die kontextuell plausible, aber engere Festlegung auf Fruchtbäume oder besonders wertvolle Bäume.
- source_word: מַעְיְנֵי מַיִם
  choice: Wasserquellen
  rationale: Die Wortverbindung bezeichnet natürliche Wasserquellen; das deutsche Kompositum ist klar und idiomatisch.
- source_word: תִּסְתֹּמוּ
  choice: verstopfen
  rationale: Das Verb bedeutet verschließen oder zustopfen, besonders bei Brunnen und Quellen. „Verstopfen“ beschreibt das Unbrauchbarmachen der Quellen natürlich.
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: jedes gute Stück Land
  rationale: חֶלְקָה ist ein abgegrenztes Stück oder eine Parzelle Land. Diese Wiedergabe bleibt weiter als „Acker“ oder „fruchtbares Feld“ und bewahrt טוֹב als „gut“.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: mit Steinen verwüsten
  rationale: Das ungewöhnliche Hifil von כאב bedeutet wörtlich etwa „Schmerz zufügen“. Im Zusammenhang ist die Schädigung nutzbaren Landes durch darauf geworfene Steine gemeint; „verwüsten“ gibt die Wirkung verständlich wieder, während die Fußnote die auffällige Bildsprache erhält.
