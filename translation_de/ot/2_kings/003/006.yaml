  text: וַ/יֵּצֵ֞א הַ/מֶּ֧לֶךְ יְהוֹרָ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא מִ/שֹּׁמְר֑וֹן וַ/יִּפְקֹ֖ד אֶת כָּל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/006.yaml
  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: de
  text: So zog König Joram an jenem Tag von Samaria aus und musterte ganz Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zählte ganz Israel“ beziehungsweise „überprüfte ganz Israel“. Das hebräische Verb kann eine Zählung oder eine militärische Musterung bezeichnen; hier spricht der Zusammenhang für den militärischen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … aus
  rationale: יצא bezeichnet hier das Hinaus- bzw. Ausziehen. „zog … aus“ klingt in der Erzählung natürlich und lässt den militärischen Zusammenhang erkennen, ohne bereits eine Marschbewegung ausdrücklich festzulegen.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: König Joram
  rationale: Die Verbindung aus Titel und Eigenname wird im Deutschen idiomatisch als „König Joram“ wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies gibt die zeitliche Bestimmung wörtlich und zugleich in natürlichem modernem Deutsch wieder.
- source_word: מִשֹּׁמְרוֹן
  choice: von Samaria aus
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt; „von Samaria aus“ fügt sich natürlich in die deutsche Verbklammer „zog … aus“ ein.
- source_word: וַיִּפְקֹד
  choice: musterte
  rationale: פקד kann unter anderem zählen, überprüfen oder militärisch mustern bedeuten. Der unmittelbar folgende Feldzug spricht hier für die militärische Bedeutung, ohne die mögliche Zählungs- oder Überprüfungskomponente auszuschließen.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die Formulierung bewahrt die kollektive und politische Bezeichnung des hebräischen Textes; im Zusammenhang kann sie besonders die aufgebotenen Kräfte Israels meinen.
theological_decisions: []
