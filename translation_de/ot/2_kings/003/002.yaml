id: 2KI.3.2
reference: 2 Kings 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֤ה הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֥א כְ/אָבִ֖י/ו וּ/כְ/אִמּ֑/וֹ וַ/יָּ֨סַר֙ אֶת מַצְּבַ֣ת הַ/בַּ֔עַל אֲשֶׁ֥ר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war, jedoch nicht wie sein Vater und seine Mutter.[a] Denn er beseitigte die Kultsäule des Baal,[b] die sein Vater errichtet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „nur nicht in demselben Maß wie sein Vater und seine Mutter“. Die hebräische Partikel schränkt das Urteil über ihn ein, legt aber nicht ausdrücklich fest, ob sich sein Handeln der Art oder dem Ausmaß nach unterschied.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die heilige Säule des Baal“ oder „den aufgerichteten Stein des Baal“. Das hebräische Wort bezeichnet einen aufgerichteten Stein oder eine Säule mit kultischer Bedeutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Er tat, was … böse war
  rationale: Die hebräische Wendung עשה + הרע bezeichnet böses Handeln. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt zugleich den ausdrücklichen Wertungscharakter.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Bildsprache wird verständlich und nahezu formal bewahrt; gemeint ist Jahwes Beurteilung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Hebräischen ausdrücklich stehende Gottesbezeichnung ist der Eigenname JHWH. Die im Deutschen gebräuchliche Form „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: רַק
  choice: jedoch
  rationale: 'Die Partikel schränkt das vorangehende negative Urteil ein: Sein Verhalten war böse, entsprach aber nicht völlig dem seiner Eltern.'
- source_word: לֹא כְאָבִיו וּכְאִמּוֹ
  choice: nicht wie sein Vater und seine Mutter
  rationale: Die direkte Vergleichsformulierung bewahrt den Bezug auf beide Eltern, ohne genauer festzulegen, worin oder in welchem Ausmaß sein Verhalten von ihrem abwich.
- source_word: וַיָּסַר
  choice: Denn er beseitigte
  rationale: Das Verb bedeutet „entfernen, wegschaffen“. „Denn“ gibt den im Zusammenhang naheliegenden begründenden Bezug zur vorherigen Einschränkung wieder.
- source_word: מַצְּבַת הַבַּעַל
  choice: die Kultsäule des Baal
  rationale: מַצֵּבָה bezeichnet hier einen aufgerichteten Stein beziehungsweise eine Säule mit kultischer Funktion. „Kultsäule“ ist präzise und vermeidet die unbestimmtere Wiedergabe „Bild“.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: die sein Vater errichtet hatte
  rationale: Bei einer Säule ist „errichten“ idiomatisches Deutsch für עשה. Das Plusquamperfekt verdeutlicht, dass die Errichtung vor ihrer Beseitigung lag.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. „Jahwe“ bewahrt diesen Namenscharakter; „der HERR“ wäre die traditionelle ersetzende Lesung.
- issue: Ausmaß der Abgrenzung vom Verhalten seiner Eltern
  choice: jedoch nicht wie sein Vater und seine Mutter
  alternative: nur nicht in demselben Maß wie sein Vater und seine Mutter
  rationale: Der hebräische Vergleich lässt offen, ob vor allem die Art oder das Ausmaß seines bösen Handelns gemeint ist. Die Hauptfassung erhält diese Unbestimmtheit, während die Alternative stärker deutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am hebräischen Erzählstil, während „Denn“ den sachlichen Zusammenhang natürlich ausdrückt. „Kultsäule“ ist für heutige Leser klarer als das missverständliche bloße „Säule“.
