  terminology: »Elisa«, »Jahwe«, »Propheten«, »Könige« und »Moab« sind konsistent und sachgerecht. Der Gottesname wird entsprechend der Vorgabe als Eigenname wiedergegeben. Es werden keine konfessionell einengenden Deutungen eingeführt.
