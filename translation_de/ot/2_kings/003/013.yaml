source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: de
  text: 'Und Elisa sagte zum König von Israel: »Was habe ich mit dir zu schaffen?[a] Geh zu den Propheten deines Vaters und zu den Propheten deiner Mutter!« Doch der König von Israel sagte zu ihm: »Nein,[b] denn Jahwe hat diese drei Könige zusammengerufen, um sie in die Hand Moabs zu geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Was ist mir und dir?« Die hebräische Redewendung drückt Distanz oder Zurückweisung aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Bitte nicht, denn Jahwe hat diese drei Könige zusammengerufen …« Die hebräische Wendung ist schwierig und kann statt als schroffer Einwand auch als Bitte verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Was habe ich mit dir zu schaffen?
  rationale: Die hebräische Wendung ist eine Abgrenzungs- oder Zurückweisungsformel. Die gewählte deutsche Formulierung ist geläufig, würdevoll und bewahrt die Schärfe der Frage.
- source_word: לֵךְ
  choice: Geh
  rationale: Der einfache Imperativ wird ohne unnötige Erweiterung direkt wiedergegeben.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: die Propheten deines Vaters ... die Propheten deiner Mutter
  rationale: Die enge Wiedergabe erhält die betonte Bezugnahme auf beide Elternteile und deren jeweilige Propheten.
- source_word: אַל כִּי
  choice: Nein, denn
  rationale: Die schwierige, knappe Verbindung wird im Kontext als Einwand des Königs verstanden. Eine mögliche bittende Lesart wird in der Fußnote offengehalten.
- source_word: קָרָא
  choice: hat ... zusammengerufen
  rationale: Im Zusammenhang bezeichnet das Verb das Zusammenrufen beziehungsweise Zusammenführen der drei Könige. Diese Wiedergabe macht den situativen Sinn deutlicher als das im Deutschen missverständliche bloße „gerufen“.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: diese drei Könige
  rationale: Die natürliche deutsche Wortstellung bewahrt Zahl, Demonstrativ und Herrschertitel.
- source_word: לָתֵת אוֹתָם
  choice: um sie ... zu geben
  rationale: Die Infinitivkonstruktion wird als Zweck beziehungsweise beabsichtigtes Ergebnis wiedergegeben, ohne diese Spannung weiter festzulegen.
- source_word: בְּיַד מוֹאָב
  choice: in die Hand Moabs
  rationale: Das hebräische Bild der Hand als Macht- und Verfügungsbereich bleibt erhalten und ist im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm; die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen.
- issue: Bedeutung von אַל כִּי in der Antwort des Königs
  choice: 'Einwand: „Nein, denn …“'
  alternative: 'Bitte: „Bitte nicht, denn …“'
  rationale: Der unmittelbare Zusammenhang legt einen Protest gegen Elisas Zurückweisung nahe. Da die hebräische Formulierung schwierig und knapp ist, wird die bittende Deutung in einer Fußnote genannt.
- issue: Zweck oder Ergebnis bei לָתֵת
  choice: „um sie ... zu geben“
  alternative: „sodass er sie ... gibt“
  rationale: Die Infinitivkonstruktion kann Zweck oder intendiertes Ergebnis ausdrücken. Die gewählte Fassung folgt der Form des Hebräischen, ohne eine weitergehende dogmatische Aussage über Gottes Absicht abzuleiten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede bleibt knapp und pointiert; die hebräischen Bilder werden bewahrt, wo sie im Deutschen verständlich sind. Alle Fußnotenmarker stehen an den jeweils betroffenen Formulierungen.
