source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: de
  text: 'Denn so spricht Jahwe: Ihr werdet weder Wind noch Regen sehen. Dennoch wird sich jenes Wadi[a] mit Wasser füllen, und ihr werdet trinken – ihr, euer Vieh und eure Tiere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jenes Tal“ beziehungsweise „jenes Bachbett“. Das hebräische Wort נַחַל bezeichnet häufig ein Wadi, also einen nur zeitweise wasserführenden Lauf samt Talbett.'
    reason: Lexikalische und geografische Bedeutungsbreite von נַחַל.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי כֹה אָמַר
  choice: Denn so spricht
  rationale: Die Formulierung bewahrt sowohl die begründende Funktion von כִּי als auch die feierliche Botenformel כֹה אָמַר.
- source_word: לֹא תִרְאוּ רוּחַ וְלֹא תִרְאוּ גֶשֶׁם
  choice: Ihr werdet weder Wind noch Regen sehen
  rationale: Die Imperfektformen bezeichnen hier Zukünftiges; רוּחַ ist im meteorologischen Parallelismus mit גֶשֶׁם als „Wind“ zu verstehen. Die deutsche weder-noch-Konstruktion gibt die doppelte Verneinung natürlich wieder.
- source_word: הַנַּחַל הַהוּא
  choice: jenes Wadi
  rationale: נַחַל bezeichnet in dieser trockenen Landschaft einen zeitweise wasserführenden Lauf beziehungsweise dessen Talbett. „Wadi“ bewahrt diese geografische Bedeutung genauer als „Bach“.
- source_word: יִמָּלֵא מָיִם
  choice: wird sich ... mit Wasser füllen
  rationale: Die resultative Bedeutung des Nifal wird im Deutschen idiomatisch durch die reflexive Wendung wiedergegeben.
- source_word: מִקְנֵיכֶם וּבְהֶמְתְּכֶם
  choice: euer Vieh und eure Tiere
  rationale: Die zwei hebräischen Bezeichnungen werden unterschieden wiedergegeben, ohne ihre in diesem Kontext nicht sicher abgrenzbaren Tiergruppen genauer festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen יהוה. „Jahwe“ gibt ihn in geläufiger deutscher Form wieder und ersetzt ihn nicht durch einen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel „Denn so spricht Jahwe“ bleibt erhalten; „Wadi“ wird wegen seiner geografischen Genauigkeit verwendet und in der Fußnote erklärt.
