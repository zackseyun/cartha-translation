source:
  edition: WLC
  text: וְ/נָקַ֥ל זֹ֖את בְּ/עֵינֵ֣י יְהוָ֑ה וְ/נָתַ֥ן אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: de
  text: Und das ist in Jahwes Augen nur eine Kleinigkeit[a]; er wird auch Moab in eure Hand geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und das ist leicht in den Augen Jahwes.«'
    reason: Die zugrunde liegende Wendung kann sowohl eine geringe Bedeutung als auch die Leichtigkeit der Ausführung ausdrücken.
lexical_decisions:
- source_word: וְנָקַל זֹאת
  choice: Doch das ist … nur eine Kleinigkeit
  rationale: Die Wendung bezeichnet die zuvor angekündigte Wasserversorgung als geringfügig beziehungsweise mühelos. „Doch“ gibt hier den fortführenden und steigernden Zusammenhang natürlich wieder; „nur eine Kleinigkeit“ bewahrt den wertenden Sinn.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die geläufige hebräische Metapher für Einschätzung oder Beurteilung bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְנָתַן
  choice: er wird auch … geben
  rationale: Im prophetischen Zusammenhang bezeichnet die Form ein künftig gewiss eintretendes Handeln. „Auch“ macht deutlich, dass zur Wasserversorgung noch die Übergabe Moabs hinzukommt.
- source_word: אֶת מוֹאָב
  choice: Moab
  rationale: Der hebräische Text nennt das Land beziehungsweise Volk kollektiv als „Moab“.
- source_word: בְּיֶדְכֶם
  choice: in eure Hand
  rationale: Die bildhafte Wendung bedeutet, jemanden der Macht oder Kontrolle eines anderen auszuliefern; das deutsche biblische Idiom ist klar verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Gewissheit der prophetischen Aussage וְנָתַן
  choice: er wird … geben
  alternative: und er gab
  rationale: Obwohl die hebräische Form formal perfektiv ist, verlangt die prophetische Rede über das bevorstehende Geschehen eine futurische Wiedergabe; die Aussage wird dabei nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildrede „in den Augen“ und „in eure Hand geben“ bleibt erhalten; der Satzbau ist zugleich natürlich und gut verständlich.
