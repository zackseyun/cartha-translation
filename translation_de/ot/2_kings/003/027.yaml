base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: de
  text: Da nahm er seinen erstgeborenen Sohn, der an seiner Stelle König werden sollte, und brachte ihn auf der Mauer als Brandopfer dar. Da kam großer Zorn gegen Israel.[a] Dann zogen sie von ihm ab und kehrten in ihr Land zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text sagt nicht, wessen Zorn dies war. Gemeint sein könnte Gottes Zorn, der Grimm der Moabiter oder die Bestürzung und Demoralisierung Israels nach dem Opfer.
    reason: Bewahrung einer bedeutenden Mehrdeutigkeit des Ausgangstextes.
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: seinen erstgeborenen Sohn
  rationale: בְּכוֹר bezeichnet den Erstgeborenen und hebt hier zugleich seine Bedeutung als Thronfolger hervor.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: der an seiner Stelle König werden sollte
  rationale: Die Formulierung gibt die vorgesehene Thronfolge wieder und bewahrt zugleich die Wendung תַּחְתָּיו, »an seiner Stelle«.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: brachte ihn … als Brandopfer dar
  rationale: Die Verbindung des Hifil von עלה mit עֹלָה ist kultische Opfersprache. »Als Brandopfer darbringen« benennt die Handlung klar und ohne beschönigende Umschreibung.
- source_word: עַל הַחֹמָה
  choice: auf der Mauer
  rationale: Die knappe Wiedergabe entspricht dem Hebräischen; im Zusammenhang ist die Stadtmauer gemeint, ohne dass »Stadt« ergänzt werden muss.
- source_word: קֶצֶף גָּדוֹל עַל יִשְׂרָאֵל
  choice: großer Zorn gegen Israel
  rationale: קֶצֶף bezeichnet heftigen Zorn beziehungsweise Grimm. »Gegen Israel« bewahrt die feindliche Ausrichtung von עַל, ohne den nicht genannten Urheber zu bestimmen.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: zogen sie von ihm ab
  rationale: נסע kann das Aufbrechen eines Lagers bezeichnen. Im militärischen Zusammenhang drückt »abziehen« aus, dass die verbündeten Truppen den Angriff auf den König von Moab beendeten.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: kehrten in ihr Land zurück
  rationale: Die Formulierung folgt dem Kontext, in dem die angreifenden Truppen in ihr eigenes Gebiet zurückkehren.
theological_decisions:
- issue: Ursprung und Bedeutung des »großen Zorns gegen Israel«
  choice: Die mehrdeutige Aussage bleibt im Haupttext ohne nähere Bestimmung des Urhebers stehen.
  alternative: Gottes Zorn gegen Israel; der Grimm Moabs gegen Israel; Bestürzung oder Demoralisierung im Heer Israels
  rationale: Der hebräische Text nennt nicht, wessen Zorn gemeint ist. Eine ausdrückliche Zuordnung würde eine umstrittene Deutung in den Text eintragen und die theologische Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die grausame Opferhandlung wird sachlich und unbeschönigt benannt. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung »großer Zorn gegen Israel«.
