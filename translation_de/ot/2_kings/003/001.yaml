  text: וִ/יהוֹרָ֣ם בֶּן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: de
  text: Joram[a], der Sohn Ahabs, wurde in Samaria im achtzehnten Regierungsjahr Joschafats, des Königs von Juda, König über Israel und regierte zwölf Jahre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und Joram, der Sohn Ahabs, wurde …“ Das hebräische Bindewort führt die Erzählung weiter und kann mit „und“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹרָם
  choice: Joram
  rationale: Die im Deutschen etablierte biblische Namensform gibt יהורם wieder. Das vorangestellte ו setzt die Erzählung fort, muss im natürlichen deutschen Satz jedoch nicht eigens mit „und“ wiedergegeben werden.
- source_word: בֶּן אַחְאָב
  choice: der Sohn Ahabs
  rationale: Die natürliche deutsche Fügung kennzeichnet die Abstammung klar; der Name steht idiomatisch im Genitiv.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: wurde … König über Israel
  rationale: Das erste מלך bezeichnet hier den Regierungsantritt. „Wurde König“ unterscheidet ihn vom späteren Verb, das die Regierungsdauer nennt.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition bezeichnet den Ort; Samaria ist hier die Hauptstadt und der Regierungssitz.
- source_word: בִּשְׁנַת שְׁמֹנֶה עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: im achtzehnten Regierungsjahr Joschafats
  rationale: Die deutsche Königsjahrformel macht ausdrücklich, dass das achtzehnte Jahr seiner Herrschaft gemeint ist.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Apposition identifiziert Joschafat als König von Juda und wird im Deutschen zur Klarheit durch Kommas abgesetzt.
- source_word: וַיִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: und regierte zwölf Jahre
  rationale: Hier bezeichnet מלך die Dauer der Herrschaft; „regierte“ ist dafür die klare, übliche deutsche Wiedergabe.
