base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: de
  text: 'Und Elisa sagte: »So wahr Jahwe der Heerscharen lebt, vor dem ich stehe: Wenn ich nicht auf Joschafat, den König von Juda, Rücksicht nähme[a], würde ich dich weder ansehen noch sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine Wendung mit »das Gesicht erheben«; sie bedeutet, jemandem Gunst zu erweisen oder ihn zu berücksichtigen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: So wahr Jahwe der Heerscharen lebt
  rationale: Gibt die hebräische Schwurformel würdig und im Deutschen idiomatisch wieder; der Gottesname bleibt als Eigenname erhalten.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: vor dem ich stehe
  rationale: Bewahrt das Bild des Stehens vor Gott und lässt zugleich die Bedeutung des prophetischen Dienstes mitschwingen.
- source_word: פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: auf Joschafat, den König von Juda, Rücksicht nähme
  rationale: נשׂא פנים ist eine feste Wendung für das Erweisen von Gunst oder Beachtung. „Rücksicht nehmen“ gibt den Sinn natürlich wieder, ohne das im Deutschen missverständliche wörtliche Bild „das Gesicht erheben“ in den Haupttext zu übernehmen.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: würde ich dich weder ansehen noch beachten
  rationale: Die Schwurform mit אִם trägt hier eine implizite Verneinung. Zwei deutsche Verben erhalten die steigernde Parallelität, während „beachten“ beim zweiten Verb den gemeinten Sinn natürlicher ausdrückt als ein redundantes „sehen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; „Jahwe“ bewahrt diesen statt ihn durch einen Titel zu ersetzen.
- issue: Elisas Stellung vor Gott
  choice: vor dem ich stehe
  alternative: dem ich diene
  rationale: Die bildhafte Formulierung des Hebräischen bleibt erhalten, ohne die mögliche dienstliche Bedeutung zur alleinigen Deutung zu machen.
- issue: Elisas Berücksichtigung Joschafats
  choice: auf Joschafat ... Rücksicht nähme
  alternative: Joschafats Angesicht erhöbe
  rationale: Die idiomatische Bedeutung ist Gunst beziehungsweise Berücksichtigung; eine wörtliche Wiedergabe wäre im modernen Deutschen unverständlich oder irreführend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformel und das Bild vom Stehen vor Gott bleiben formal nah am Hebräischen; schwer verständliche hebräische Idiome werden sinngemäß wiedergegeben. Die Namen folgen gebräuchlichen deutschen Bibelformen.
