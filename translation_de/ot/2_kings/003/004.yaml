base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: de
  text: Mescha, der König von Moab, war ein Schafzüchter und entrichtete dem König von Israel als Tribut hunderttausend Lämmer und die Wolle von hunderttausend Widdern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hunderttausend Widder, Wolle“. Die hebräische Wendung ist verkürzt und kann „hunderttausend Widder mit Wolle“ oder, im Zusammenhang wahrscheinlicher, „die Wolle von hunderttausend Widdern“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: Schafzüchter
  rationale: Die Bezeichnung meint jemanden, der Schafe hält beziehungsweise züchtet. „Schafzüchter“ ist im heutigen Deutsch klar und passt zum wirtschaftlichen Zusammenhang.
- source_word: וְהֵשִׁיב
  choice: musste … als Tribut … liefern
  rationale: Der Hifil von שוב bezeichnet hier das Entrichten einer Abgabe. Die Formulierung gibt im Kontext sowohl die bestehende Verpflichtung als auch den wiederkehrenden Charakter idiomatisch wieder.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: hunderttausend Lämmer
  rationale: כָּרִים bezeichnet Lämmer beziehungsweise junge männliche Schafe; „Lämmer“ ist in einer Tributliste die natürliche deutsche Wiedergabe.
- source_word: אֵילִים צָמֶר
  choice: die Wolle von hunderttausend Widdern
  rationale: Die hebräische Wortfolge ist elliptisch („hunderttausend Widder, Wolle“). Im wirtschaftlichen Kontext liegt nahe, dass Wolle von Widdern abgeliefert wurde; die Fußnote wahrt die formale Mehrdeutigkeit.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: König von Moab / König von Israel
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindungen.
