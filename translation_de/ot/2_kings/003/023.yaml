base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: de
  text: 'Und sie sagten: »Das ist Blut! Die Könige haben sich gegenseitig völlig aufgerieben[a] und einander erschlagen. Nun also, Moab[b], auf zur Beute!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Die Könige sind völlig vernichtet worden.« Das Hebräische verstärkt das Verb für »verwüstet/vernichtet werden«; im Zusammenhang mit dem folgenden Satz verstehen die Moabiter es offenbar als gegenseitige Gewalt der Könige.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ihr Moabiter, auf zur Beute!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: Das ist Blut!
  rationale: Die verblos formulierte Feststellung wird als erregter Ausruf wiedergegeben; das Demonstrativpronomen זֶה bleibt ausdrücklich erhalten.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: haben sich gegenseitig völlig aufgerieben
  rationale: Infinitivus absolutus und finite Form von חרב verstärken die Aussage. „Völlig aufgerieben“ gibt den Gedanken der Vernichtung wieder; „gegenseitig“ erschließt sich aus dem unmittelbar folgenden Satz über das wechselseitige Erschlagen, ohne die lexikalische Spannung zu verbergen.
- source_word: הַמְּלָכִים
  choice: die Könige
  rationale: Der bestimmte Plural bezeichnet die zuvor genannten Herrscher des Bündnisses.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: und einer hat den anderen erschlagen
  rationale: Die distributiv-reziproke hebräische Wendung wird in natürlichem Deutsch wiedergegeben. Im militärischen Zusammenhang bezeichnet נכה hier tödliches Niederschlagen.
- source_word: וְעַתָּה
  choice: Nun also
  rationale: Die Formulierung markiert den erregten Übergang von der vermeintlichen Beobachtung zum Handlungsaufruf.
- source_word: לַשָּׁלָל
  choice: auf zur Beute
  rationale: Die knappe deutsche Aufforderung bewahrt die Richtung und Dringlichkeit des Schlachtrufs.
- source_word: מוֹאָב
  choice: Moab
  rationale: Der Landes- beziehungsweise Volksname steht als direkte Anrede; die hebräische Form und die Prägnanz des Rufes bleiben erhalten.
