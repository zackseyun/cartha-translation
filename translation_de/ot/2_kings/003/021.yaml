base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: de
  text: Ganz Moab hörte, dass die Könige heraufgezogen waren, um gegen sie zu kämpfen. Darauf wurden alle aufgeboten[a], vom Gürtelträger an aufwärts[b]. Sie bezogen an der Grenze Stellung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden zusammengerufen“ beziehungsweise „wurden gemustert“. Das hebräische Verb bezeichnet hier wahrscheinlich die Mobilmachung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von jedem, der einen Gürtel umbindet, an aufwärts“; gemeint sind offenbar Männer im wehrfähigen Alter und die Älteren.'
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: Ganz Moab
  rationale: Der Eigenname bezeichnet hier kollektiv das ganze Volk bzw. Land. „Ganz Moab“ bewahrt diese hebräische Ausdrucksweise, ohne ein nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: שָׁמְעוּ
  choice: hörte
  rationale: שׁמע bedeutet hier, von einem Ereignis zu hören bzw. davon zu erfahren. Das kollektive Subjekt „Moab“ verlangt im Deutschen den Singular.
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: dass die Könige heraufgezogen waren
  rationale: עלה bezeichnet das Hinauf- bzw. Heranziehen und kann im militärischen Zusammenhang einen Feldzug ausdrücken. Das Plusquamperfekt stellt das Heranziehen als Inhalt der bereits eingetroffenen Nachricht dar.
- source_word: לְהִלָּחֶם בָּם
  choice: um gegen sie zu kämpfen
  rationale: Die Wendung mit לחם und ב bezeichnet den Kampf gegen jemanden. Die deutsche Zweckkonstruktion gibt den Infinitiv mit לְ klar wieder.
- source_word: וַיִּצָּעֲקוּ
  choice: Darauf wurden alle aufgeboten
  rationale: Im Zusammenhang einer drohenden Schlacht bezeichnet das Verb das Zusammenrufen bzw. Mobilisieren. „Aufgeboten“ bewahrt den passivischen Sinn und die militärische Situation, ohne bloßes Schreien anzunehmen.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: die alt genug waren, einen Gürtel umzubinden, und auch alle Älteren
  rationale: Die konkrete Gürtelmetapher bleibt erhalten, während „und auch alle Älteren“ das mit וָמַעְלָה bezeichnete Aufwärtsgehen durch die Altersstufen in verständlichem Deutsch ausdrückt.
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: Sie bezogen an der Grenze Stellung
  rationale: עמד על bezeichnet hier im militärischen Zusammenhang nicht nur physisches Stehen, sondern das Einnehmen einer Position an der Landesgrenze.
