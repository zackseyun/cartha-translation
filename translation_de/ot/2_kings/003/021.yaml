  terminology: „Aufgeboten“ und „an der Grenze Stellung beziehen“ passen zum militärischen Kontext. „Gürtelträger“ bewahrt das Bild des hebräischen Ausdrucks, ohne dessen umstrittene genaue Altersgrenze im Haupttext zu eng festzulegen.
