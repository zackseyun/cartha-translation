  source_fidelity: 'Der Text gibt sämtliche wesentlichen Elemente des Hebräischen angemessen wieder: die erzählende Fortschreibung, die unbenannte Amtsbezeichnung, den Ausruf des Entsetzens, den Gottesnamen, die bestimmte Dreizahl der Könige sowie die final ausgedrückte Auslieferung an Moab. Das unübersetzte כִּי ist nach »Ach!« im Deutschen idiomatisch; der begründend-inhaltliche Zusammenhang bleibt klar.'
