id: 2KI.3.10
reference: 2 Kings 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: de
  text: 'Da sagte der König von Israel: »Ach! Jahwe hat diese drei Könige gerufen[a], um sie in die Hand Moabs zu geben[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zusammengerufen«; das hebräische Verb bedeutet wörtlich »gerufen«.'
    reason: lexical_alternative
  - marker: b
    text: '»In die Hand Moabs« ist eine hebräische Wendung und bedeutet: »in die Gewalt Moabs«.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da sagte« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die ausdrückliche Amtsbezeichnung bleibt erhalten, da der König in diesem Vers nicht namentlich genannt wird.
- source_word: אֲהָהּ
  choice: Ach!
  rationale: Die Interjektion drückt Bestürzung und Klage aus; »Ach!« ist gegenwärtiges, würdevolles Standarddeutsch.
- source_word: כִּי
  choice: ohne gesonderte Wiedergabe
  rationale: Nach der Interjektion leitet כִּי hier die begründende beziehungsweise inhaltliche Aussage ein. Im natürlichen Deutschen ist dafür keine eigene Konjunktion nötig.
- source_word: קָרָא
  choice: hat ... gerufen
  rationale: Die Grundbedeutung »rufen« bleibt erhalten; eine Deutung als bloß militärisches Zusammenrufen wird nicht in den Haupttext eingetragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: diese drei Könige
  rationale: Numerus und Demonstrativpronomen bezeichnen die drei bereits im Zusammenhang genannten Könige.
- source_word: לָתֵת אֹתָם
  choice: um sie ... zu geben
  rationale: Die Infinitivkonstruktion wird als Zweckangabe wiedergegeben und bleibt formal nahe am Hebräischen.
- source_word: בְּיַד מוֹאָב
  choice: in die Hand Moabs
  rationale: Das hebräische Macht- und Auslieferungsidiom bleibt wegen seiner Verständlichkeit und biblischen Bildkraft erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; »Jahwe« bewahrt ihn als solchen.
- issue: Bedeutungsumfang von קָרָא
  choice: hat ... gerufen
  alternative: hat ... zusammengerufen
  rationale: »Gerufen« hält die lexikalische Offenheit fest; »zusammengerufen« würde das Zusammenführen der Könige deutlicher auslegen, als das Verb allein verlangt.
- issue: Aussage über das göttliche Handeln
  choice: direkte Wiedergabe der bestürzten Deutung des Königs
  alternative: abschwächende oder erklärende Formulierung
  rationale: Der Vers berichtet die Aussage des Königs. Die Übersetzung soll seine pessimistische Deutung weder bestätigen noch korrigierend abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und emotional; das traditionelle Machtbild »in die Hand« wird beibehalten und in einer Fußnote erläutert.
