  text: וַ/יֵּ֡לֶךְ וַ/יִּשְׁלַח֩ אֶל יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֜ה לֵ/אמֹ֗ר מֶ֤לֶךְ מוֹאָב֙ פָּשַׁ֣ע בִּ֔/י הֲ/תֵלֵ֥ךְ אִתִּ֛/י אֶל מוֹאָ֖ב לַ/מִּלְחָמָ֑ה וַ/יֹּ֣אמֶר אֶעֱלֶ֔ה כָּמ֧וֹ/נִי כָמ֛וֹ/ךָ כְּ/עַמִּ֥/י כְ/עַמֶּ֖/ךָ כְּ/סוּסַ֥/י כְּ/סוּסֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: de
  text: 'Da machte er sich auf und sandte eine Botschaft an Joschafat, den König von Juda: »Der König von Moab hat sich gegen mich aufgelehnt. Ziehst du mit mir gegen Moab in den Krieg?« Er antwortete: »Ich ziehe mit. Ich bin wie du, mein Volk ist wie dein Volk, meine Pferde sind wie deine Pferde.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da machte er sich auf
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; die Wendung gibt sowohl die Fortbewegung als auch den neuen Handlungsschritt natürlich wieder.
- source_word: וַיִּשְׁלַח אֶל
  choice: und sandte eine Botschaft an
  rationale: Mit anschließender direkter Rede bezeichnet das Verb idiomatisch das Übermitteln einer Nachricht.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Joschafat, den König von Juda
  rationale: Der Personenname folgt der geläufigen deutschen Bibelschreibung; der Königstitel wird als Apposition wiedergegeben.
- source_word: פָּשַׁע בִּי
  choice: hat sich gegen mich aufgelehnt
  rationale: Im politischen Zusammenhang bezeichnet פשע den Aufstand beziehungsweise den Bruch der Vasallentreue. Die Formulierung wahrt diesen Sinn ohne unnötig technische Sprache.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Ziehst du mit mir
  rationale: הלך bedeutet grundsätzlich gehen; im militärischen Zusammenhang ist »mit jemandem ziehen« im Deutschen natürlich und präzise.
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: gegen Moab in den Krieg
  rationale: Die Präpositionalverbindungen bezeichnen das Ziel Moab und den kriegerischen Zweck; die deutsche Wendung bildet beides knapp ab.
- source_word: אֶעֱלֶה
  choice: Ich ziehe mit
  rationale: עלה heißt wörtlich »hinaufziehen« und kann einen militärischen Aufbruch bezeichnen. Im Zusammenhang antwortet Joschafat mit seiner Zusage, am Feldzug teilzunehmen.
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: Ich bin wie du, mein Volk ist wie dein Volk, meine Pferde sind wie deine Pferde
  rationale: Die elliptische hebräische Solidaritätsformel wird durch sparsame Ergänzung der Kopula in natürliches Deutsch übertragen und behält ihre dreigliedrige Parallelstruktur.
