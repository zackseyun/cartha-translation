source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט יֵ֥שׁ אוֹת֖/וֹ דְּבַר יְהוָ֑ה וַ/יֵּרְד֣וּ אֵלָ֗י/ו מֶ֧לֶךְ יִשְׂרָאֵ֛ל וִ/יהוֹשָׁפָ֖ט וּ/מֶ֥לֶךְ אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: de
  text: 'Joschafat sagte[a]: »Bei ihm ist das Wort Jahwes.« Da gingen der König von Israel, Joschafat und der König von Edom zu ihm hinab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er hat ein Wort von Jahwe.«'
    reason: Lexikalische Alternative für יֵשׁ אֹתוֹ דְּבַר יְהוָה; die Konstruktion kann auch idiomatisch Besitz einer Botschaft ausdrücken.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die gewöhnliche deutsche Wiedergabe des narrativen Wayyiqtol von אמר; sie leitet die direkte Rede natürlich ein.
- source_word: יֵשׁ אֹתוֹ
  choice: bei ihm ist
  rationale: Die Konstruktion mit יֵשׁ und אֹתוֹ kann Gegenwart beziehungsweise Besitz ausdrücken. »Bei ihm ist« bewahrt den hebräischen Ausdruck und deutet nicht eindeutiger als der Ausgangstext auf Besitz.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die geläufige prophetische Wendung und lässt offen, ob eine konkrete Botschaft oder allgemein verlässliche Offenbarung gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֵּרְדוּ
  choice: gingen … hinab
  rationale: Gibt die Richtungsangabe von ירד wieder; sie kann topografisch oder relativ zum Aufenthaltsort des Propheten gemeint sein.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Entspricht der Bewegungsrichtung auf die zuvor genannte Person zu.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Natürliche und formnahe Wiedergabe des Herrschertitels.
- source_word: וִיהוֹשָׁפָט
  choice: Joschafat
  rationale: Im modernen deutschen Bibelgebrauch etablierte Form des Personennamens.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: und der König von Edom
  rationale: Bewahrt die koordinierte Aufzählung und den Herrschertitel.
theological_decisions:
- issue: Bedeutung der prophetischen Wendung דְּבַר יְהוָה in Bezug auf Elisa
  choice: »Bei ihm ist das Wort Jahwes«
  alternative: »Er hat ein Wort von Jahwe«
  rationale: Die Hauptfassung bewahrt die Mehrdeutigkeit zwischen der Gegenwart beziehungsweise Verfügbarkeit göttlicher Offenbarung und dem Besitz einer konkreten prophetischen Botschaft. Die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt bewusst bibelsprachlich; Satzbau und Namensformen sind für heutige Leser klar gehalten.
