  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: de
  text: Doch sie wandten sich nicht von den Sünden des Hauses Jerobeam ab, durch die er Israel zum Sündigen brachte, sondern gingen weiterhin diesen Weg. Auch die Aschera[a] stand weiterhin in Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck kann die kanaanäische Göttin Aschera oder einen mit ihrer Verehrung verbundenen Kultgegenstand bezeichnen; hier ist wahrscheinlich der Kultgegenstand gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet den adversativ-konzessiven Gegensatz zur zuvor berichteten Rettung.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: sie wandten sich nicht von den Sünden ... ab
  rationale: סור mit מן bezeichnet das Abwenden bzw. Ablassen von einer Sache; der Plural חטאות meint hier sündige Praktiken.
- source_word: בֵּית יָרָבְעָם
  choice: das Haus Jerobeam
  rationale: Bewahrt die formale Wendung und umfasst zugleich Jerobeams dynastisches und kultisches Erbe.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: durch die er Israel zur Sünde verführt hatte
  rationale: Der Hifil von חטא bedeutet, jemanden zum Sündigen zu bringen; das Plusquamperfekt macht im Deutschen das zeitliche Verhältnis zum fortgesetzten Verhalten deutlich.
- source_word: בָּהּ הָלָךְ
  choice: darin lebte man weiter
  rationale: הלך mit ב beschreibt einen Lebenswandel bzw. das Festhalten an einer Praxis. Der unpersönliche Ausdruck wahrt die im masoretischen Text auffällige Numerusspannung zwischen dem vorherigen Plural und dem singularischen Verb, ohne den Bezug willkürlich auf eine bestimmte Person festzulegen.
- source_word: וְגַם
  choice: Auch
  rationale: Fügt die fortdauernde Existenz der Aschera als weiteren, hervorgehobenen Beleg hinzu.
- source_word: הָאֲשֵׁרָה
  choice: die Aschera
  rationale: Übernimmt den hebräischen Ausdruck, da er sowohl die Göttin als auch den mit ihrem Kult verbundenen Gegenstand bezeichnen kann.
- source_word: עָמְדָה בְּשֹׁמְרוֹן
  choice: blieb in Samaria stehen
  rationale: Verbindet das wörtliche Bild des Stehens mit dem kontextuellen Gedanken des Fortbestehens.
theological_decisions:
- issue: Bezug und Bedeutung von הָאֲשֵׁרָה
  choice: Aschera im Haupttext, wahrscheinlich als Kultgegenstand verstanden
  alternative: Ascherapfahl; die Göttin Aschera
  rationale: Dass sie in Samaria „stehen blieb“, spricht für einen aufgestellten Kultgegenstand. Da der hebräische Ausdruck dies jedoch nicht ausdrücklich festlegt, bleibt die Hauptübersetzung bewusst offen und die Fußnote erläutert die Möglichkeiten.
- issue: Subjekt von בָּהּ הָלָךְ
  choice: 'unpersönlich: „darin lebte man weiter“'
  alternative: „darin lebte er weiter“; „darin lebten sie weiter“
  rationale: Der masoretische Text hat nach dem pluralischen „sie wandten sich nicht ab“ ein singularisches Verb. Die unpersönliche deutsche Form erhält den Sinn des fortgesetzten sündigen Wandels, ohne die grammatische Spannung durch eine nicht gesicherte Identifikation des Subjekts aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Jerobeam“ bewahrt die biblisch-historische Ausdrucksweise; „darin lebte man weiter“ gibt den idiomatischen Sinn von „gehen/wandeln in“ natürlich wieder und wahrt zugleich die grammatische Mehrdeutigkeit des Ausgangstextes.
