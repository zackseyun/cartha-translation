base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: de
  text: Joahas legte sich zu seinen Vorfahren zur Ruhe, und man begrub ihn in Samaria. Sein Sohn Joasch wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב … עִם אֲבֹתָיו
  choice: legte sich zu seinen Vorfahren zur Ruhe
  rationale: Die königliche Todesformel wird nicht auf das bloße „starb“ verkürzt. Die Wiedergabe bewahrt das hebräische Ruhebild, vermeidet aber die im heutigen Deutsch missverständliche oder unnatürliche Formulierung „schlief bei seinen Vätern“.
- source_word: אֲבֹתָיו
  choice: seinen Vorfahren
  rationale: Im Zusammenhang der Todesformel bezeichnet „Väter“ die vorausgegangenen Generationen. „Vorfahren“ gibt dies im modernen Standarddeutsch klar und natürlich wieder.
- source_word: וַיִּקְבְּרֻהוּ
  choice: man begrub ihn
  rationale: Die unbestimmte dritte Person Plural wird als unpersönliches „man“ wiedergegeben; dadurch bleibt die aktive Verbform erhalten, ohne nicht genannte Handelnde einzuführen.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition bezeichnet hier den Ort der Bestattung; „in Samaria“ ist die natürliche deutsche Entsprechung.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: In dieser Thronfolgenotiz bezeichnet das Verb den Herrschaftsantritt. „Wurde König“ bringt den punktuellen Nachfolgeaspekt im Deutschen deutlicher zum Ausdruck als „regierte“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die dynastische Nachfolge und den Ersatz des bisherigen Königs.
- source_word: יְהוֹאָחָז
  choice: Joahas
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
- source_word: יוֹאָשׁ
  choice: Joasch
  rationale: Die Wiedergabe folgt der im Deutschen gebräuchlichen Form des hier stehenden hebräischen Namens יוֹאָשׁ.
