  source_fidelity: 'Der deutsche Text gibt alle Elemente des Hebräischen zuverlässig wieder: Hasaëls Tod, seinen Titel als König von Aram, Ben-Hadad als seinen Sohn sowie dessen Thronfolge an Hasaëls Stelle. „wurde … König“ trifft den im Kontext gemeinten Herrschaftsantritt von וַיִּמְלֹךְ angemessen.'
