base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: de
  text: Dann starb Hasaël, der König von Aram, und sein Sohn Ben-Hadad wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Dann starb
  rationale: Das Qal-Wayyiqtol von מות bezeichnet im Erzählzusammenhang schlicht den Tod; „Dann“ gibt die zeitliche Abfolge natürlich wieder.
- source_word: חֲזָאֵל
  choice: Hasaël
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: אֲרָם ist der Eigenname des historischen Reiches; „Aram“ ist genauer als die traditionelle Wiedergabe „Syrien“.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: Im Zusammenhang der Thronfolge bezeichnet מלך den Herrschaftsantritt; diese Formulierung ist im Deutschen natürlich und präzise.
- source_word: בֶּן־הֲדַד
  choice: Ben-Hadad
  rationale: Der Personen- beziehungsweise Dynastiename wird in einer geläufigen deutschen Schreibweise mit Bindestrich wiedergegeben.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Das Suffix verweist auf Hasaël; das ausdrücklich genannte Verwandtschaftsverhältnis bleibt erhalten.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת mit Suffix bezeichnet in dieser Thronfolgeformel die Nachfolge beziehungsweise Ablösung.
