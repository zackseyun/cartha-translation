  terminology: Die Namen „Hasaël“ und „Ben-Hadad“ sind im Deutschen gebräuchlich. „Aram“ bewahrt den hebräischen historischen Eigennamen und ist gegenüber „Syrien“ vorzuziehen. Es ist keine Fußnote erforderlich; die englische lexikalische Alternativnote ist zudem dort nicht sinnvoll am Wort „died“ verankert und muss nicht in die deutsche Fassung übernommen werden.
