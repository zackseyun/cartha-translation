id: 2KI.13.4
reference: 2 Kings 13:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: de
  text: Da suchte Joahas die Gunst Jahwes[a], und Jahwe schenkte ihm Gehör; denn er sah die Bedrängnis Israels, weil der König von Aram[b] sie bedrängte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »flehte Jahwe an«; wörtlich etwa: »besänftigte das Angesicht Jahwes«. Die hebräische Wendung bezeichnet das inständige Suchen nach Wohlwollen.'
    reason: lexical_alternative
  - marker: b
    text: Aram ist der hebräische Name des Gebietes, das in älteren Übersetzungen häufig »Syrien« genannt wird.
    reason: historical_name
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: suchte die Gunst Jahwes
  rationale: Die Wendung bedeutet idiomatisch, jemanden inständig um Wohlwollen zu bitten. Die Übersetzung gibt den Sinn natürlich wieder, ohne das hebräische Bild vom »Angesicht« unverständlich wörtlich zu übertragen.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: schenkte ihm Gehör
  rationale: שׁמע mit אֶל bezeichnet hier aufmerksames beziehungsweise erhörendes Hören. »Schenkte ihm Gehör« vermeidet das im Deutschen missverständliche »hörte auf ihn« und behauptet nicht mehr als der Ausgangstext.
- source_word: לַחַץ / לָחַץ
  choice: Bedrängnis / bedrängte
  rationale: Die verwandten deutschen Wörter bilden wie im Hebräischen die Verbindung zwischen dem Nomen und dem Verb ab und passen zum politischen und militärischen Druck auf Israel.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: Der hebräische Landesname wird als Aram wiedergegeben und nicht durch die spätere Bezeichnung Syrien ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: suchte die Gunst Jahwes
  alternative: flehte Jahwe an
  rationale: Die gewählte Formulierung bewahrt den Gedanken des inständigen Werbens um Gottes Wohlwollen, ohne eine bestimmte Art oder ein bestimmtes Ergebnis der Bitte zusätzlich einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung »Bedrängnis … bedrängte« bewahrt bewusst das hebräische Wortspiel; das Semikolon macht den Begründungszusammenhang übersichtlich.
