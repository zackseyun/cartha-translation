base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war. Er wandte sich von keiner der Sünden Jerobeams, des Sohnes Nebats, der Israel zum Sündigen verführte, ab; darin wandelte er.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht ein weibliches Pronomen im Singular: „in ihr“. Es kann sich zusammenfassend auf die zuvor genannten Sünden beziehen.'
    reason: Die Form בָּהּ ist feminin Singular, obwohl „Sünden“ im Plural steht. Die Übersetzung bewahrt die Singularform mit „darin“; die Anmerkung erläutert den möglichen kollektiven Bezug.
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Er tat, was … böse war
  rationale: Die feste Bewertungsformel in den Königsbüchern wird natürlich wiedergegeben, ohne ihr moralisches Urteil abzuschwächen.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Metapher der göttlichen Beurteilung bleibt im Deutschen erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Er wandte sich von keiner der Sünden … ab
  rationale: Im verneinten Satz bezeichnet מִכָּל vollständiges Ausbleiben einer Abkehr; „von keiner“ drückt dies im modernen Deutsch präzise aus.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeams, des Sohnes Nebats
  rationale: Die eingebürgerte deutsche Form der Namen und eine natürliche Wiedergabe des Patronymikons werden verwendet.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: der Israel zur Sünde verführt hatte
  rationale: Das Hifil von חטא bezeichnet hier das Veranlassen zum Sündigen. Der Relativsatz wird am naheliegendsten auf Jerobeam bezogen, ohne den Inhalt seiner Verführung näher auszugestalten.
- source_word: בָּהּ הָלָךְ
  choice: darin ging er seinen Weg
  rationale: „Darin“ bewahrt den formal singularischen Rückbezug, während „ging er seinen Weg“ die hebräische Metapher für die Lebensführung verständlich erhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
- issue: Bezug des Relativsatzes אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: Jerobeam als derjenige, der Israel zur Sünde verführte
  alternative: die Sünden als Mittel, durch die Israel zum Sündigen gebracht wurde
  rationale: Das singularische Relativpronomen und das traditionelle Erzählmuster legen Jerobeam als handelnde Person nahe; die alternative instrumentale Deutung ist semantisch möglich, ändert aber nicht die im Vers ausgesprochene Verantwortung Jerobeams.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Weg-Metapher bleibt erhalten; unnötig altertümliche Formulierungen werden vermieden.
