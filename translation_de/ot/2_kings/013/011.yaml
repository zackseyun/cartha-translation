  naturalness: „Darin ging er seinen Weg“ ist im heutigen Standarddeutsch keine natürliche Wiedergabe von בָּהּ הָלָךְ und kann eher ein zielgerichtetes Verfolgen eines Vorhabens als eine fortgesetzte Lebensführung ausdrücken. „Darin wandelte er“ ist klar, würdevoll und bewahrt die Metapher.
