reference: 2 Kings 13:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: de
  text: Doch Jahwe war ihnen gnädig, hatte Erbarmen mit ihnen und wandte sich ihnen zu wegen seines Bundes mit Abraham, Isaak und Jakob.[a] Er wollte sie nicht vernichten und verstieß sie bis zu diesem Zeitpunkt nicht aus seiner Gegenwart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um seines Bundes mit Abraham, Isaak und Jakob willen“.'
    reason: Die hebräische Präposition לְמַעַן kann hier sowohl mit „wegen“ als auch mit „um … willen“ wiedergegeben werden.
lexical_decisions:
- source_word: וַיָּחָן
  choice: war ihnen gnädig
  rationale: Das Verb חנן bezeichnet gnädige Zuwendung oder erwiesene Gunst. „War ihnen gnädig“ ist im Deutschen natürlich und bewahrt die theologische Aussage, ohne sie auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: וַיְרַחֲמֵם
  choice: hatte Erbarmen mit ihnen
  rationale: רחם bezeichnet tiefes Mitgefühl und Erbarmen. Diese Formulierung gibt sowohl die innere Anteilnahme als auch die barmherzige Zuwendung wieder.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: wandte sich ihnen zu
  rationale: Die Wendung bewahrt das Bild des Sich-Zuwendens und lässt offen, in welcher konkreten Hilfe sich diese günstige Hinwendung zeigte.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: wegen seines Bundes
  rationale: למען bezeichnet hier den Beweggrund beziehungsweise die Grundlage von Jahwes Handeln. „Wegen“ ist klar und idiomatisch; die alternative Zweck- oder Interessenformulierung wird in der Fußnote genannt.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: mit Abraham, Isaak und Jakob
  rationale: Das kompakte Hebräisch bezeichnet den Bund in seiner Beziehung zu den Erzvätern. „Mit“ ist dafür die natürliche deutsche Verbindung.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: Er wollte sie nicht vernichten
  rationale: אבה drückt Willen oder Einwilligung aus. Die Übersetzung erhält diesen volitionalen Akzent und reduziert die Aussage nicht auf ein bloßes Nicht-Handeln.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: verstieß sie nicht aus seiner Gegenwart
  rationale: Wörtlich geht es um ein Wegwerfen beziehungsweise Fortstoßen von vor seinem Angesicht. „Aus seiner Gegenwart verstoßen“ bewahrt das Beziehungsbild in verständlichem Deutsch.
- source_word: עַד עָתָּה
  choice: bis zu diesem Zeitpunkt
  rationale: Die Wendung reicht den beschriebenen Zustand bis an den zeitlichen Standort des Erzählers heran. Die Formulierung vermeidet, den Bezug fälschlich auf die heutige Leserzeit zu übertragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den persönlichen Gottesnamen verwendet, wird dieser als Eigenname wiedergegeben. So bleibt der Bundesbezug des Verses sichtbar, ohne einen Titel an seine Stelle zu setzen.
- issue: Bund als Beweggrund der göttlichen Zuwendung
  choice: wegen seines Bundes mit Abraham, Isaak und Jakob
  alternative: um seines Bundes mit Abraham, Isaak und Jakob willen
  rationale: Die Übersetzung hält fest, dass Jahwes gnädige Zuwendung und sein Verzicht auf Vernichtung im Bund begründet sind. Sie ergänzt keine weitergehende dogmatische Erklärung.
- issue: Göttlicher Wille zur Nichtvernichtung
  choice: Er wollte sie nicht vernichten
  alternative: Er vernichtete sie nicht
  rationale: Die gewählte Fassung bewahrt den ausdrücklichen Willensaspekt von אבה und lässt die Spannung zwischen verdientem Gericht und gnädiger Zurückhaltung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Die bildhafte Wendung „wandte sich ihnen zu“ und der Ausdruck „aus seiner Gegenwart“ bleiben erhalten; unnötige kirchliche Fachsprache wird vermieden.
