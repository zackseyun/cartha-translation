  - severity: low
    issue: „stellte sich auf seine Füße“ ist unidiomatisch.
    rationale: Die Formulierung ist verständlich, klingt aber im heutigen Deutsch gekünstelt. „richtete sich auf“ gibt das Aufstehen angemessen wieder.
  - severity: low
    issue: „Räuberbande“ ist leicht anachronistisch und enger als der Quellbegriff.
    rationale: הַגְּדוּד bezeichnet eine bewaffnete Streif- bzw. Überfallgruppe; „Streifschar“ wahrt den historischen Erzählton.
