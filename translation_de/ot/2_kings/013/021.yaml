base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: de
  text: Als einige Männer gerade einen Mann begruben, bemerkten sie eine Streifschar. Da warfen sie den Mann in Elisas Grab. Der Mann gelangte an Elisas Gebeine und berührte sie[a]. Da wurde er wieder lebendig und richtete sich auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da ging der Mann und berührte Elisas Gebeine.“ Der genaue Sinn von „ging“ in diesem Zusammenhang ist nicht eindeutig.'
    reason: Das hebräische וַיֵּלֶךְ steht im überlieferten Text, ist in dieser Abfolge jedoch ungewöhnlich. Die Fußnote bewahrt die formale Lesart und ihre Unklarheit.
lexical_decisions:
- source_word: הַגְּדוּד
  choice: die Räuberbande
  rationale: Bezeichnet hier eine umherziehende bewaffnete Schar, die Überfälle verübt; „Räuberbande“ gibt den Kontext verständlich wieder.
- source_word: וַיֵּלֶךְ וַיִּגַּע
  choice: gelangte an … und berührte sie
  rationale: Bewahrt beide Verben des masoretischen Textes, ohne das im Deutschen missverständliche wörtliche „ging und berührte“ zu verwenden.
- source_word: וַיְחִי
  choice: wurde wieder lebendig
  rationale: Im Zusammenhang ist die Wiederbelebung des zuvor verstorbenen Mannes gemeint.
- source_word: וַיָּקָם עַל־רַגְלָיו
  choice: stellte sich auf seine Füße
  rationale: Gibt das konkrete Aufstehen des wieder lebendig gewordenen Mannes nahe am hebräischen Ausdruck wieder.
theological_decisions:
- issue: Ursache der Wiederbelebung
  choice: Der Text berichtet nur die Berührung mit Elisas Gebeinen und die anschließende Wiederbelebung.
  alternative: Eine ausdrückliche Erklärung, dass Elisa, seine Gebeine oder Gott den Mann auferweckte.
  rationale: Der Vers nennt den Ablauf, benennt aber hier nicht ausdrücklich den Handelnden oder die Wirkweise; diese Offenheit wird bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das einleitende ויהי wird natürlich als zeitlicher Erzähleinstieg wiedergegeben; „plötzlich“ entspricht der aufmerksamkeitslenkenden Funktion von והנה.
