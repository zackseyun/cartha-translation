revisions:
- from: Als einige Männer gerade einen Mann begruben, sahen sie plötzlich die Räuberbande. Da warfen sie den Mann in Elisas Grab. Der Mann gelangte an Elisas Gebeine und berührte sie[a]. Da wurde er wieder lebendig und stellte sich auf seine Füße.
  to: Als einige Männer gerade einen Mann begruben, bemerkten sie eine Streifschar. Da warfen sie den Mann in Elisas Grab. Der Mann gelangte an Elisas Gebeine und berührte sie[a]. Da wurde er wieder lebendig und richtete sich auf.
  rationale: Die Revision vermeidet eine nicht erforderliche zeitliche Verstärkung, verwendet für die bewaffnete Überfallgruppe einen historisch passenderen Ausdruck und glättet die abschließende deutsche Formulierung. Die ungewöhnliche hebräische Aussage, dass der Tote „ging und“ die Gebeine berührte, bleibt durch „gelangte an ... und berührte“ sowie die Fußnote transparent, ohne eine textlich nicht begründete Erklärung einzutragen.
