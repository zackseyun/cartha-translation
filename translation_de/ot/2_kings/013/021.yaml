  naturalness: „Stellte sich auf seine Füße“ ist im modernen Standarddeutsch weniger idiomatisch. „Richtete sich auf“ ist natürlich und beschreibt im gegebenen Kontext eindeutig das Wiederaufstehen. „Da bemerkten sie“ bildet den erzählerischen Einschnitt flüssiger ab als „sahen sie plötzlich“.
  terminology: '„Streifschar“ ist für הַגְּדוּד im historischen Erzählkontext präziser als „Räuberbande“: Gemeint ist eine umherziehende bewaffnete Überfallgruppe, nicht notwendig eine moderne kriminelle Bande. „Elisas Gebeine“ ist passend und registergerecht.'
