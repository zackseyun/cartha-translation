  register: Modernes, würdevolles Standarddeutsch. Die traditionelle königliche Schlussformel bleibt als rhetorische Frage erkennbar. Die Wiederholung zwischen „Taten“ und „alles, was er tat“ wurde als Merkmal der hebräischen Aufzählung beibehalten. Die Fußnotenmarker wurden an die jeweils erläuterten Ausdrücke gesetzt.
