  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹאָחָ֛ז וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבוּרָת֑/וֹ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten des Joahas, alles, was er tat, und seine Macht[a] – sind sie nicht im Buch der Chronik der Könige von Israel[b] aufgezeichnet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Tapferkeit; oder: seine Machttaten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: im Buch der Annalen der Könige von Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: Die übrigen Taten des Joahas
  rationale: Im Zusammenhang der Königsnotizen bezeichnet דִּבְרֵי die überlieferten Angelegenheiten oder Taten des Königs, nicht nur seine Worte. „Die übrigen Taten“ gibt die feste Zusammenfassungsformel knapp und natürlich wieder.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: alles, was er tat
  rationale: Die breite Bedeutung der hebräischen Relativkonstruktion bleibt ohne unnötige Präzisierung erhalten.
- source_word: וּגְבוּרָתוֹ
  choice: und seine Macht
  rationale: גְּבוּרָה kann Macht, Stärke, Tapferkeit oder Machttaten bezeichnen. „Macht“ bewahrt im Haupttext die knappe und offene Formulierung; weitere mögliche Bedeutungen stehen in der Fußnote.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgezeichnet?
  rationale: Die rhetorische Frage und die pluralische Form des Hebräischen werden bewahrt. „Aufgezeichnet“ ist im Zusammenhang eines königlichen Archivs idiomatischer als das ebenfalls mögliche „geschrieben“.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Chronik
  rationale: עַל wird in dieser Archivformel idiomatisch mit „im“ wiedergegeben. דִּבְרֵי הַיָּמִים bezeichnet eine chronikalische beziehungsweise annalistische Aufzeichnung.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: Das לְ kennzeichnet hier die Zuordnung des Quellenwerks zu den Königen Israels und wird in einem deutschen Werktitel natürlich mit „der … von“ wiedergegeben.
