base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: de
  text: 'Dann sagte er: „Öffne das Fenster nach Osten!“ Und er öffnete es. Elisa sagte: „Schieß!“ Und er schoss. Da sagte er: „Jahwes Siegespfeil[a], der Siegespfeil gegen Aram! Du wirst Aram bei Afek schlagen, bis du es vernichtet hast.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein Pfeil der Rettung von Jahwe, ein Pfeil der Rettung gegen Aram“. Das hebräische Wort kann „Sieg“, „Rettung“ oder „Befreiung“ bedeuten; auch die genaue Beziehung zu Jahwe ist knapp ausgedrückt.'
    reason: Bewahrt die Bedeutungsbreite von תְּשׁוּעָה und die mögliche Quellen- bzw. Zuordnungsfunktion von לַיהוָה.
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: Öffne das Fenster nach Osten
  rationale: Der Imperativ פְּתַח bedeutet hier schlicht „öffnen“; קֵדְמָה gibt die Richtung „nach Osten“ an.
- source_word: יְרֵה
  choice: Schieß
  rationale: Der knappe Imperativ bezeichnet im Bogenschützenkontext das Abschießen des Pfeils; ein ausdrückliches Objekt steht im Hebräischen nicht.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: Jahwes Siegespfeil
  rationale: תְּשׁוּעָה bezeichnet hier im militärischen Zeichenakt konkret den von Jahwe gewährten Sieg; die knappe deutsche Nominalfügung gibt die Zuordnung durch לַיהוָה natürlich wieder.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: der Siegespfeil gegen Aram
  rationale: Die zweite Wendung erläutert die erste appositionell; בַאֲרָם hat im militärischen Zusammenhang gegnerischen Sinn.
- source_word: וְהִכִּיתָ אֶת אֲרָם
  choice: Du wirst Aram … schlagen
  rationale: נכה wird bildnah mit „schlagen“ wiedergegeben; die Form kündigt die durch das Zeichen bezeichnete künftige Handlung an.
- source_word: בַּאֲפֵק
  choice: bei Afek
  rationale: Bei einer Schlacht bezeichnet ב mit dem Ortsnamen den Schauplatz; „bei Afek“ ist idiomatisches Deutsch.
- source_word: עַד כַּלֵּה
  choice: bis du es vernichtet hast
  rationale: Die Wendung bezeichnet das vollständige Zu-Ende-Bringen der militärischen Niederlage; das deutsche Pronomen nimmt Aram als gegnerische Macht wieder auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ gibt den Eigennamen erkennbar wieder und folgt der im konsultierten Projekttext verwendeten Entscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תְּשׁוּעָה im militärischen Orakel
  choice: Sieg
  alternative: Rettung oder Befreiung
  rationale: Der unmittelbare Zusammenhang ist ein symbolischer Pfeilschuss und die angekündigte Niederlage Arams. „Sieg“ trifft diesen konkreten Sinn; die weitere Bedeutungsbreite bleibt in der Fußnote sichtbar.
- issue: Verhältnis der beiden Pfeil-Aussagen
  choice: 'appositionelle Erläuterung: „Jahwes Siegespfeil, der Siegespfeil gegen Aram“'
  alternative: 'koordinierend: „und ein Siegespfeil gegen Aram“'
  rationale: Die zweite Nominalphrase präzisiert im Kontext am natürlichsten, worin Jahwes Sieg besteht; das hebräische וְ lässt jedoch auch eine koordinierende Wiedergabe zu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knappen Befehlen und würdigem Erzählton. Die Wiederholung von „Siegespfeil“ bewahrt die rhetorische Gestalt des Hebräischen; „Aram“ und „Afek“ bleiben als historische Namen erhalten.
