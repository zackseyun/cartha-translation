source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: de
  text: Da entbrannte Jahwes Zorn gegen Israel, und er gab sie in die Hand Hasaëls, des Königs von Aram, und in die Hand Ben-Hadads, des Sohnes Hasaëls – während dieser ganzen Zeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alle Tage«; gemeint ist: während jener ganzen Zeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte … Zorn
  rationale: Bewahrt das anschauliche hebräische Bild vom entbrennenden Zorn und klingt zugleich natürlich und würdevoll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: בְּיִשְׂרָאֵל
  choice: gegen Israel
  rationale: Die Präposition bezeichnet bei einem Verb des Zorns dessen Zielrichtung.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: er gab sie in die Hand
  rationale: Bewahrt das hebräische Bild für die Auslieferung unter fremde Macht; der deutsche Ausdruck ist verständlich und bibelsprachlich vertraut.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hasaël, des Königs von Aram
  rationale: Transliteriert den Personennamen in geläufiger deutscher Form und erhält den hebräischen Gebietsnamen Aram.
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: Ben-Hadads, des Sohnes Hasaëls
  rationale: Gibt Eigenname und Abstammungsangabe ausdrücklich wieder.
- source_word: כָּל הַיָּמִים
  choice: während dieser ganzen Zeit
  rationale: Gibt den durativen Sinn im Erzählzusammenhang natürlich wieder, ohne festzulegen, auf wessen Regierungs- oder Lebenszeit sich die Wendung genau bezieht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt seinen Charakter als Eigenname.
- issue: Göttliches Gericht durch politische Unterwerfung
  choice: er gab sie in die Hand
  alternative: er ließ sie in die Gewalt geraten
  rationale: Die aktive Form des Hebräischen bleibt erhalten und schwächt Gottes handelnde Rolle im Gericht nicht ab; zugleich wird keine über den Text hinausgehende Erklärung gegeben.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Die anschaulichen hebräischen Wendungen »Zorn entbrannte« und »in die Hand geben« bleiben erhalten. Der Gedankenstrich markiert die abschließende Zeitangabe, ohne ihren Bezug übermäßig festzulegen.
