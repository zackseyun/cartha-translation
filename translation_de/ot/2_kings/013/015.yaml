  yaml_path: translation/ot/2_kings/013/015.yaml
  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: de
  text: 'Da sagte Elisa zu ihm: »Nimm einen Bogen und Pfeile!« Da nahm er einen Bogen und Pfeile und brachte sie zu ihm[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Da nahm er sich einen Bogen und Pfeile.« Das Hebräische lautet wörtlich eher »zu ihm« und bezieht sich dann wahrscheinlich auf Elisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: לּוֹ
  choice: zu ihm
  rationale: Die Präposition ל mit Suffix der 3. Person maskulin Singular bezeichnet hier den Adressaten von Elisas Worten.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Verwendet die im Deutschen gebräuchliche biblische Namensform.
- source_word: קַח
  choice: Nimm
  rationale: Direkte und idiomatische Wiedergabe des Imperativs von לקח.
- source_word: קֶשֶׁת וְחִצִּים
  choice: einen Bogen und Pfeile
  rationale: Gibt die beiden ausdrücklich genannten Waffen sachgerecht wieder; der unbestimmte Artikel ist im Deutschen erforderlich.
- source_word: וַיִּקַּח אֵלָיו
  choice: Da brachte er ihm
  rationale: לקח bezeichnet das Nehmen, während אֵלָיו die Bewegung beziehungsweise Ausrichtung „zu ihm“ ausdrückt. „Brachte er ihm“ gibt diese Verbindung in natürlichem Deutsch wieder, ohne das Pronomen auszulassen.
- source_word: קֶשֶׁת וְחִצִּים
  choice: einen Bogen und Pfeile
  rationale: Die im Hebräischen ausdrücklich wiederholte Objektgruppe bleibt auch in der Übersetzung erhalten.
