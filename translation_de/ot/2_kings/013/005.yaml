revisions:
- from: Und der HERR gab Israel einen Retter[a]. So kamen sie unter der Hand Arams hervor[b], und die Söhne Israels wohnten wieder wie früher in ihren Zelten[c].
  to: Und der HERR gab Israel einen Retter[a], und sie entkamen der Gewalt Arams[b]; die Söhne Israels wohnten wie früher in ihren Zelten[c].
  rationale: Die Revision ersetzt die im Deutschen missverständliche Bildübertragung durch eine natürliche, sinngetreue Wiedergabe und sichert die konkrete hebräische Metapher in der Fußnote. Sie entfernt zudem das nicht ausdrücklich ausgedrückte »wieder« und glättet die Satzverbindung, ohne die Erzählfolge oder die Offenheit hinsichtlich des ungenannten Retters zu verändern.
