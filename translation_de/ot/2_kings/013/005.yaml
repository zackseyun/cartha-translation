  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: de
  text: Und der HERR gab Israel einen Retter[a], und sie entkamen der Gewalt Arams[b]; die Söhne Israels wohnten wie früher in ihren Zelten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Befreier«. Gemeint ist jemand, der Rettung bringt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von unter der Hand Arams«. Die hebräische Wendung bezeichnet die Befreiung aus Arams Macht oder Herrschaft.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »wie gestern, vorgestern«; eine hebräische Wendung für frühere Zeiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die in deutschen Bibeln etablierte Wiedergabe des Gottesnamens mit »der HERR« ist würdig, verständlich und zeigt an, dass im Hebräischen der Eigenname JHWH steht.
- source_word: מוֹשִׁיעַ
  choice: einen Retter
  rationale: Das substantivisch gebrauchte Partizip bezeichnet jemanden, der Rettung bringt. »Retter« bewahrt die lexikalische Breite und lässt offen, um wen es sich handelt.
- source_word: מִתַּחַת יַד אֲרָם
  choice: unter der Hand Arams hervor
  rationale: Die konkrete hebräische Metapher für Arams Macht beziehungsweise Herrschaft bleibt erhalten; »hervorkommen« gibt וַיֵּצְאוּ wieder.
- source_word: אֲרָם
  choice: Aram
  rationale: Der historische Name des Reiches wird beibehalten und nicht durch die spätere geografische Bezeichnung »Syrien« ersetzt.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die familiäre und grammatisch maskuline Bezeichnung des hebräischen Textes wird genau bewahrt.
- source_word: בְּאָהֳלֵיהֶם
  choice: in ihren Zelten
  rationale: Die konkrete Bedeutung von אֹהֶל bleibt erhalten, statt sie verallgemeinernd als Häuser oder Wohnungen wiederzugeben.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: wieder wie früher
  rationale: Die hebräische Zeitwendung meint den früheren, normalen Zustand. »Wieder wie früher« gibt in diesem Zusammenhang sowohl die Rückkehr als auch den idiomatischen Sinn natürlich wieder.
- source_word: וַיֵּשְׁבוּ
  choice: wohnten
  rationale: Im Zusammenhang mit Zelten bedeutet ישׁב hier »wohnen«; das ist im modernen Deutschen natürlich und näher am Bild als »lebten«.
theological_decisions:
- issue: Wiedergabe von מוֹשִׁיעַ
  choice: Retter
  alternative: Befreier
  rationale: »Retter« entspricht dem gewöhnlichen Bedeutungsumfang und bewahrt eine mögliche theologische Resonanz, ohne den ungenannten Retter messianisch zu identifizieren. »Befreier« würde den politischen Kontext stärker festlegen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: der HERR
  alternative: Jahwe
  rationale: »der HERR« folgt einer fest verankerten deutschen Bibelkonvention und vermeidet eine unsichere Vokalisierung; die Fußnote macht den zugrunde liegenden Eigennamen transparent.
- issue: Bezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die formale Wiedergabe erhält das familiäre Bundesvokabular des Textes, auch wenn die Wendung kollektiv das Volk bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt erzählerisch knapp. Die ungewöhnliche, aber verständliche Metapher »unter der Hand Arams« und die familiäre Bezeichnung »Söhne Israels« werden zur Wahrung der hebräischen Bild- und Begriffswelt beibehalten; Fußnoten erläutern sie.
