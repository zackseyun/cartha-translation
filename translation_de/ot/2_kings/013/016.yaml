base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: de
  text: 'Dann sagte er zum König von Israel: »Lege deine Hand auf den Bogen.« Da legte der König seine Hand darauf, und Elisa legte seine Hände auf die Hände des Königs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְכֵּב
  choice: Lege
  rationale: Der Hifil-Imperativ von רכב bezeichnet hier, dass der König seine Hand auf den Bogen bringen soll. »Lege« gibt die konkrete Handlung in natürlichem modernem Deutsch wieder, ohne das im Deutschen irreführende Bild des Reitens zu übernehmen.
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: deine Hand auf den Bogen
  rationale: Die räumliche Beziehung mit עַל wird direkt und verständlich mit »auf« wiedergegeben.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: Da legte der König seine Hand darauf
  rationale: Das Hebräische wiederholt das Bezugswort »Bogen« nicht. »darauf« macht den Bezug im Deutschen klar; »der König« beseitigt eine mögliche Mehrdeutigkeit des Pronomens, ohne neue Information einzuführen.
- source_word: וַיָּשֶׂם
  choice: legte
  rationale: »legte seine Hände auf« ist eine schlichte, natürliche Wiedergabe der beschriebenen körperlichen Handlung.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: seine Hände auf die Hände des Königs
  rationale: Beide Pluralformen werden bewahrt, sodass das konkrete Bild von Elisas Händen auf denen des Königs erhalten bleibt.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: Dann sagte er zum König von Israel
  rationale: »Dann« bildet den Fortgang der hebräischen Erzählung in flüssigem modernem Deutsch ab.
theological_decisions:
- issue: Bedeutung davon, dass Elisa seine Hände auf die Hände des Königs legt
  choice: Die Handlung wird ohne symbolische Deutung wiedergegeben.
  alternative: Die Geste ausdrücklich als prophetische Bevollmächtigung oder als göttliche Führung im Kampf deuten.
  rationale: Der Vers beschreibt die symbolische Handlung, erklärt ihre Bedeutung aber nicht ausdrücklich. Eine Deutung soll daher nicht in den Wortlaut hineingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise und das konkrete Bild der übereinandergelegten Hände bleiben erhalten.
