base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: de
  text: Er tat, was böse war in den Augen Jahwes, und folgte den Sünden Jerobeams, des Sohnes Nebats, der Israel zur Sünde gebracht hatte. Er wandte sich nicht davon ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Er wich nicht von ihr ab.« Das Hebräische hat ein feminines Singularsuffix und meint wahrscheinlich zusammenfassend Jerobeams Sünde beziehungsweise sein Sündenmuster.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das narrative Wayyiqtol wird im Deutschen natürlich mit dem Präteritum wiedergegeben; das einleitende ו wird nicht eigens übersetzt.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: was böse war in den Augen Jahwes
  rationale: Die feste Bewertungsformel des Königebuchs bleibt bildhaft und zugleich in modernem Deutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: וַיֵּלֶךְ אַחַר
  choice: folgte
  rationale: Das hebräische Bild »hinter etwas hergehen« bezeichnet hier das Befolgen eines sündigen Vorbilds; »folgte« gibt den idiomatischen Sinn natürlich wieder.
- source_word: חַטֹּאת
  choice: den Sünden
  rationale: Die Pluralform wird formal bewahrt und bezeichnet Jerobeams sündige Praktiken beziehungsweise sein Sündenmuster.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeams, des Sohnes Nebats
  rationale: Die Namen werden in ihren etablierten deutschen Bibelformen wiedergegeben; das Patronym bleibt ausdrücklich erhalten.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: der Israel zur Sünde verführt hatte
  rationale: Der Hifil von חטא hat kausative Bedeutung. »Zur Sünde verführen« ist im Deutschen natürlicher als »sündigen machen«; das Plusquamperfekt verdeutlicht die zeitliche Vorordnung.
- source_word: לֹא סָר מִמֶּנָּה
  choice: Er wandte sich nicht davon ab
  rationale: סור bezeichnet das Abweichen oder Sich-Abwenden. Das singularische »davon« bewahrt die Form des femininen Singularsuffixes, ohne den kollektiv verstandenen Bezug vorschnell aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe als »Jahwe« bewahrt ihn als persönlichen Namen, während »der HERR« ihn durch einen Titel ersetzt.
- issue: Bezugswort des femininen Singularsuffixes in מִמֶּנָּה
  choice: davon
  alternative: von ihnen
  rationale: Das Hebräische hat ein feminines Singularsuffix, das wahrscheinlich kollektiv auf Jerobeams Sünde beziehungsweise Sündenmuster zurückweist. »Davon« erhält diese grammatische und semantische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Formel »in den Augen Jahwes« bleibt erhalten; unnötig altertümliche Wendungen werden vermieden.
