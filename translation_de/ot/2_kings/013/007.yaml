base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: de
  text: Denn der König von Aram ließ Joahas keine Truppen übrig außer fünfzig Reitern, zehn Streitwagen und zehntausend Fußsoldaten; er hatte sie vernichtet und sie zu Staub gemacht, der beim Dreschen zertreten wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und machte sie wie Staub zum Zertreten«. Das hebräische Verb bezeichnet Dreschen und kann dabei die Vorstellung des Zertretens oder Zermalmens hervorrufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: übrig gelassen
  rationale: Der Hifil von שׁאר bezeichnet hier das Verbleibenlassen eines Restes; die deutsche Wendung gibt Ergebnis und Kausativsinn natürlich wieder.
- source_word: עָם
  choice: Truppen
  rationale: עָם kann allgemein »Volk« bedeuten, bezeichnet hier aber aufgrund der anschließenden Aufzählung von Reitern, Streitwagen und Fußsoldaten eindeutig die Streitkräfte.
- source_word: כִּי אִם
  choice: außer
  rationale: Nach der Verneinung führt die Wendung den allein verbliebenen Rest ein.
- source_word: פָּרָשִׁים
  choice: Reiter
  rationale: Das Wort bezeichnet berittene Kämpfer; »Reiter« ist im militärischen Kontext klar und knapp.
- source_word: רֶכֶב
  choice: Streitwagen
  rationale: Obwohl die Form kollektiv gebraucht werden kann, bezeichnet sie zusammen mit der Zahl zehn einzelne militärische Streitwagen.
- source_word: רַגְלִי
  choice: Fußsoldaten
  rationale: Gemeint sind Soldaten, die zu Fuß kämpfen; diese Wiedergabe ist modern und allgemein verständlich.
- source_word: אִבְּדָם
  choice: hatte sie vernichtet
  rationale: Der Piel von אבד drückt hier eine weitgehende Zerstörung der Truppen aus; das Plusquamperfekt verdeutlicht den vorausliegenden Grund ihres geringen Restbestands.
- source_word: וַיְשִׂמֵם
  choice: hatte sie … gemacht
  rationale: שׂים mit einer vergleichenden Ergänzung bedeutet hier, jemanden in einen bestimmten Zustand zu versetzen beziehungsweise ihn etwas gleichzumachen.
- source_word: כֶּעָפָר
  choice: wie Staub
  rationale: Die Vergleichspartikel und עָפָר bilden das Bild völliger Zermalmung und Machtlosigkeit.
- source_word: לָדוּשׁ
  choice: beim Dreschen
  rationale: Der Infinitiv von דושׁ ruft den Vorgang des Dreschens durch Zertreten oder Zermalmen hervor; »beim Dreschen« bewahrt das landwirtschaftliche Bild und lässt dessen genaue syntaktische Färbung offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Truppen« macht den militärischen Kontext von עָם deutlich, ohne den allgemeineren Wortsinn »Volk« in den Text zu zwingen. Die Bildsprache des Dreschens bleibt erhalten; die mögliche Nuance des Zertretens wird in der Fußnote genannt.
