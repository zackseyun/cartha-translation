  naturalness: Der Entwurf ist überwiegend natürlich, doch „sie wie Staub beim Dreschen gemacht“ ist im Deutschen syntaktisch und bildlich holprig. Außerdem bleibt das einleitende „er“ zunächst unnötig unbestimmt, obwohl der König von Aram im Vers ausdrücklich genannt wird.
