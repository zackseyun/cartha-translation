base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: de
  text: Im siebenunddreißigsten Regierungsjahr Joaschs, des Königs von Juda,[a] wurde Joasch, der Sohn Joahas, König über Israel; er regierte sechzehn Jahre in Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen sind die Namen des judäischen Königs (יוֹאָשׁ, Joasch) und des israelitischen Königs (יְהוֹאָשׁ, Jehoasch) unterschiedlich geschrieben; in deutschen Bibeln werden beide traditionell meist Joasch genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֶׁבַע שָׁנָה
  choice: Im siebenunddreißigsten Regierungsjahr
  rationale: Die hebräische Datierungsformel bezeichnet ein bestimmtes Jahr innerhalb der Herrschaft; „Regierungsjahr“ macht den Bezug im Deutschen unmittelbar klar.
- source_word: לְיוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: des Joasch, des Königs von Juda
  rationale: לְ markiert hier den Bezugspunkt der Regierungssynchronisierung. Die Apposition wird in natürlichem Deutsch durch „des Königs von Juda“ wiedergegeben.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: Das Qal-Perfekt von מלך hat in dieser Königsformel ingressiven Sinn und bezeichnet den Herrschaftsantritt; die anschließende Angabe nennt gesondert die Regierungsdauer.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: Joasch, der Sohn des Joahas
  rationale: Die im Deutschen gebräuchlichen biblischen Namensformen sind Joasch und Joahas. Eine Fußnote weist auf die unterschiedliche hebräische Schreibung der beiden gleichlautend wiedergegebenen Königsnamen hin.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet in Verbindung mit מלך den Herrschaftsbereich.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: בְּ bezeichnet den Ort; Samaria ist hier die königliche Residenz und Hauptstadt des Nordreichs.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Er regierte sechzehn Jahre
  rationale: Die Nominalangabe bezeichnet die Dauer der Herrschaft. Ein eigener deutscher Satz gibt die Königsnotiz klar und idiomatisch wieder.
