  text: וַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם לָחַ֖ץ אֶת יִשְׂרָאֵ֑ל כֹּ֖ל יְמֵ֥י יְהוֹאָחָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/022.yaml
  text: Hazael king of Aram oppressed Israel all the days of Jehoahaz[a].
translation:
  language: de
  text: Hasaël, der König von Aram, unterdrückte Israel, solange Joahas lebte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: Hasaël
  rationale: Das vorangestellte Waw führt die Erzählung weiter, erfordert im Deutschen hier aber kein eigenes Bindewort. Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: Die Status-constructus-Verbindung wird natürlich als Titel wiedergegeben. »Aram« entspricht dem hebräischen Eigennamen und ist gegenüber dem traditionellen »Syrien« vorzuziehen.
- source_word: לָחַץ
  choice: unterdrückte
  rationale: Das Verb bezeichnet bedrängen, hart zusetzen oder unterdrücken. Im Zusammenhang anhaltender aramäischer Vorherrschaft gibt »unterdrückte« die politische und militärische Bedrängnis treffend wieder.
- source_word: אֶת־יִשְׂרָאֵל
  choice: Israel
  rationale: Der Akkusativmarker bleibt unübersetzt; der Volks- und Reichsname bezeichnet hier das Nordreich.
- source_word: כֹּל יְמֵי יְהוֹאָחָז
  choice: solange Joahas lebte
  rationale: Die Wendung bedeutet wörtlich »alle Tage des Joahas« und bezeichnet hier idiomatisch seine gesamte Lebenszeit. Die natürliche deutsche Form wahrt den Umfang der Aussage, ohne sie ausdrücklich auf seine Regierungszeit einzuengen.
theological_decisions:
- issue: Bezug von כֹּל יְמֵי יְהוֹאָחָז
  choice: gesamte Lebenszeit des Joahas
  alternative: gesamte Regierungszeit des Joahas
  rationale: Der hebräische Wortlaut sagt »alle Tage des Joahas« und nennt nicht ausdrücklich seine Regierungszeit. Daher wird die lebenszeitliche Formulierung beibehalten, auch wenn der Kontext besonders seine Herrschaft im Blick haben kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich und knapp; »Hasaël«, »Aram« und »Joahas« folgen geläufigen deutschen Bibelnamensformen. Kein Fußnotenmarker ist nötig, da »Aram« unmittelbar im Haupttext steht und keine deutsche Traditionsalternative erläutert werden muss.
