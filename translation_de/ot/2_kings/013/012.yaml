  text: וְ/יֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְב֣וּרָת֔/וֹ אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten des Joasch, alles, was er tat, und seine Macht, mit der er gegen Amazja, den König von Juda, kämpfte[a] – sind sie nicht im Buch der Chronik der Könige von Israel[b] aufgezeichnet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht für „gegen“ die Präposition „mit“; im militärischen Zusammenhang bezeichnet sie hier den Kampf gegen einen Gegner.
    reason: lexical_alternative
  - marker: b
    text: Dieses „Buch der Chronik der Könige von Israel“ ist ein in den Königsbüchern angeführtes königliches Annalenwerk, nicht das biblische Buch der Chronik.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Die übrigen Taten des Joasch
  rationale: יֶתֶר bezeichnet in der festen Königsformel das Übrige; דִּבְרֵי meint hier idiomatisch die Taten beziehungsweise Geschehnisse der Regierungszeit, nicht bloß „Worte“.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: alles, was er tat
  rationale: Die umfassende Aussage von כָל und der breite Bedeutungsumfang von עָשָׂה werden direkt und natürlich wiedergegeben.
- source_word: וּגְבוּרָתוֹ
  choice: und seine Macht
  rationale: גְּבוּרָה kann Stärke, Heldenmut oder Machttaten bezeichnen. „Macht“ bewahrt hier den abstrakten Singular und lässt den anschließenden Relativsatz dessen Ausdruck im Kampf erläutern.
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: mit der er gegen … kämpfte
  rationale: Der Relativsatz wird eng auf „seine Macht“ bezogen. עִם bedeutet wörtlich „mit“, bezeichnet im militärischen Zusammenhang jedoch die feindliche Auseinandersetzung und wird deshalb mit „gegen“ wiedergegeben.
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: Amazja, den König von Juda
  rationale: Der Eigenname wird in geläufiger deutscher Form wiedergegeben; der Königstitel steht als erklärende Apposition.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ist das nicht … aufgezeichnet?
  rationale: Die rhetorische Frage bleibt erhalten. Das zusammenfassende deutsche Singularpronomen „das“ bezieht sich natürlich auf die zuvor aufgezählten Inhalte; „aufgezeichnet“ entspricht dem Sinn schriftlicher Annalen.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: im Buch der Chronik der Könige von Israel
  rationale: עַל wird bei einem Schriftwerk idiomatisch mit „im“ wiedergegeben. Der Ausdruck bezeichnet ein annalistisches Quellenwerk über die Könige Israels.
