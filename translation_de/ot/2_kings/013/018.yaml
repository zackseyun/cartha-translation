  text: וַ/יֹּ֛אמֶר קַ֥ח הַ/חִצִּ֖ים וַ/יִּקָּ֑ח וַ/יֹּ֤אמֶר לְ/מֶֽלֶךְ יִשְׂרָאֵל֙ הַךְ אַ֔רְצָ/ה וַ/יַּ֥ךְ שָֽׁלֹשׁ פְּעָמִ֖ים וַֽ/יַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/018.yaml
  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: de
  text: 'Dann sagte er: „Nimm die Pfeile!“ Er nahm sie. Darauf sagte er zum König von Israel: „Schlag auf den Boden!“ Da schlug er dreimal darauf und hörte auf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „blieb stehen“. Das hebräische Verb bedeutet wörtlich „stand“, bezeichnet hier aber wahrscheinlich, dass er nach drei Schlägen aufhörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Nimm
  rationale: Der Imperativ von לקח wird unmittelbar und natürlich mit „Nimm“ wiedergegeben.
- source_word: הַחִצִּים
  choice: die Pfeile
  rationale: Der bestimmte Plural wird entsprechend dem Hebräischen mit Artikel übersetzt.
- source_word: וַיִּקָּח
  choice: Er nahm sie
  rationale: Das im Deutschen nötige Pronomen greift die zuvor genannten Pfeile auf.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: zum König von Israel
  rationale: Eine klare, würdevolle und quellennah formulierte Wiedergabe der indirekten Ergänzung.
- source_word: הַךְ
  choice: Schlag
  rationale: Der Imperativ von נכה bezeichnet hier eine kräftige Schlaghandlung. „Schieß“ wäre zu deutend, weil der Boden als Ziel der Handlung genannt wird.
- source_word: אַרְצָה
  choice: auf den Boden
  rationale: Die Richtungsform bezeichnet hier die nach unten auf den Erdboden gerichtete Handlung; „auf den Boden“ ist im Deutschen idiomatisch.
- source_word: וַיַּךְ
  choice: Da schlug er ... darauf
  rationale: „Darauf“ nimmt den Boden als im Deutschen erforderliche Ergänzung wieder auf und bewahrt die Verbindung zum vorausgehenden Befehl.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: dreimal
  rationale: Natürliche deutsche Wiedergabe der Zahl mit פְּעָמִים.
- source_word: וַיַּעֲמֹד
  choice: hörte auf
  rationale: Das Verb bedeutet wörtlich „stand“, bezeichnet hier im Zusammenhang aber idiomatisch das Beenden der wiederholten Schläge.
