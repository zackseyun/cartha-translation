base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: de
  text: 'Elischa war an einer Krankheit erkrankt, an der er sterben würde. Da ging Joasch, der König von Israel, zu ihm hinab, weinte über ihn[a] und sagte: »Mein Vater, mein Vater![b] Israels Streitwagen und seine Reiter!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »weinte über seinem Gesicht«.'
    reason: lexical_alternative
  - marker: b
    text: Dieser Ruf greift 2. Könige 2,12 auf, wo Elischa dieselben Worte an Elia richtet.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: war an der Krankheit erkrankt
  rationale: Die Verbindung von Verb und stammverwandtem Substantiv wird beibehalten. Das Plusquamperfekt gibt den gegenüber Joaschs Besuch vorausliegenden Zustand natürlich wieder.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: an der er sterben sollte
  rationale: Die Formulierung bewahrt die aus der Erzählperspektive vorausweisende Aussage, ohne den Tod als bereits eingetreten darzustellen.
- source_word: וַיֵּרֶד אֵלָיו
  choice: kam ... zu ihm hinab
  rationale: „Hinab“ erhält die Richtungsangabe von ירד; „kam“ ist im Deutschen aus der Perspektive Elischas natürlich.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: weinte über ihm
  rationale: Die idiomatische Wiedergabe bezeichnet das Weinen über dem Kranken. Die wörtliche Körperteilformulierung wird in der Fußnote dokumentiert.
- source_word: אָבִי אָבִי
  choice: Mein Vater, mein Vater!
  rationale: Die Possessivsuffixe und die emotionale, ehrerbietige Anrede werden direkt bewahrt.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Israels Streitwagen und seine Reiter
  rationale: Die bildhafte Ausrufung bleibt ohne deutende Paraphrase stehen. Der hebräische Singular רֶכֶב kann kollektiv verstanden werden; „Streitwagen“ ist dafür im Deutschen natürlich.
theological_decisions:
- issue: Bildhafte Bedeutung von „Israels Streitwagen und seine Reiter“
  choice: Als unmittelbarer Ausruf an Elischa unverändert bildhaft wiedergegeben
  alternative: Deutend als Aussage, Elischa sei Israels eigentliche Stärke oder Verteidigung, paraphrasieren
  rationale: Der Wortlaut erinnert an 2. Könige 2,12 und hebt Elischas Bedeutung hervor, lässt aber die genaue Beziehung zwischen Prophet und militärischem Bild offen. Diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Krankheitsformel und das militärische Bild bleiben quellentreu erkennbar; syntaktisch wird der Vers für heutige Leser natürlich gegliedert.
