  verdict: approve
  source_fidelity: Der Text gibt die narrative Abfolge ("Dann"), den Tod und die Bestattung Elisas sowie die wiederkehrenden moabitischen Einfälle zutreffend wieder. "pflegten ... einzufallen" bildet den hier naheliegenden habituellen Imperfekt sinnvoll ab. Die Zeitangabe bleibt im Haupttext bewusst nicht auf das Frühjahr festgelegt; die Fußnote wahrt die semantische Offenheit der hebräischen Wendung.
  naturalness: Modernes, gut lesbares und angemessen würdiges Standarddeutsch. "Moabitische Streifscharen" und "pflegten" sind leicht gehoben, aber im biblisch-narrativen Register idiomatisch und verständlich.
  terminology: '"Elisa" ist die etablierte deutsche Namensform. "moabitische Streifscharen" trifft den Charakter von גְּדוּדֵי מוֹאָב als nicht notwendig reguläre, raubende Kampfgruppen. Die Fußnote erläutert "beim Anbruch des Jahres" ohne die umstrittene bzw. kontextuell wahrscheinliche Deutung "Frühjahr" zur alleinigen Übersetzung zu machen.'
