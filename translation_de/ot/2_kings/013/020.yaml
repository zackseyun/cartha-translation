source:
  edition: WLC
  text: וַ/יָּ֥מָת אֱלִישָׁ֖ע וַֽ/יִּקְבְּרֻ֑/הוּ וּ/גְדוּדֵ֥י מוֹאָ֛ב יָבֹ֥אוּ בָ/אָ֖רֶץ בָּ֥א שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: de
  text: Dann starb Elisa, und man begrub ihn. Moabitische Streifscharen pflegten beim Anbruch des Jahres[a] ins Land einzufallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »beim Kommen des Jahres«; gemeint sein kann der Jahresbeginn beziehungsweise das Frühjahr, mit dem gewöhnlich die Zeit militärischer Feldzüge begann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Dann starb
  rationale: Das Waw-Consecutivum führt die Erzählung weiter; »Dann« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Die im Deutschen gebräuchliche Form des hebräischen Personennamens.
- source_word: וַיִּקְבְּרֻהוּ
  choice: und man begrub ihn
  rationale: Die aktive Verbform im Plural mit unbestimmtem Subjekt wird im Deutschen natürlich durch »man« wiedergegeben; der Bezug des Objekts auf Elisa bleibt ausdrücklich erhalten.
- source_word: גְדוּדֵי מוֹאָב
  choice: moabitische Streifscharen
  rationale: גְדוּד bezeichnet hier wahrscheinlich keine reguläre Armee, sondern bewaffnete Gruppen, die Raubzüge unternahmen. Die adjektivische Form ist im Deutschen natürlicher als »Streifscharen Moabs«.
- source_word: יָבֹאוּ
  choice: pflegten ... einzufallen
  rationale: Der Imperfekt bezeichnet im Zusammenhang ein wiederholtes, übliches Geschehen. »Pflegten« bewahrt diesen habituellen Sinn; »einfallen« gibt zusammen mit בָאָרֶץ den feindlichen Eintritt ins Land treffend wieder.
- source_word: בָאָרֶץ
  choice: ins Land
  rationale: Bei einem Verb des Kommens oder Eindringens bezeichnet die Präposition hier die Bewegung in das Land hinein.
- source_word: בָּא שָׁנָה
  choice: beim Anbruch des Jahres
  rationale: Die Wendung lautet wörtlich »beim Kommen des Jahres«. »Beim Anbruch des Jahres« bewahrt das Bild in verständlichem, würdigem Deutsch, ohne die mögliche Deutung als Frühjahr im Haupttext festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Pflegten« ist leicht gehoben, aber allgemein verständlich und drückt die wiederholte Handlung präzise aus. Die ungewöhnliche Zeitangabe bleibt im Haupttext erkennbar und wird in der Fußnote erläutert.
