    issue: Die Fußnote zur Namensvariation stimmt nicht mit dem Haupttext überein.
    rationale: Der Text hat an beiden Stellen „Joasch“, während die Fußnote erklärt, zunächst stehe „Jehoasch“ und später „Joasch“. Da die Variation als relevante lexikalische Information annotiert ist, sollte sie entweder im Text umgesetzt oder die Fußnote als reine Information über die Quellsprache umformuliert werden. Die Umsetzung im Text ist hier sicher und quellentreu.
