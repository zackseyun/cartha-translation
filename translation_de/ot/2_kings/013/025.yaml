base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: de
  text: Jehoasch, der Sohn des Joahas, nahm die Städte aus der Hand Ben-Hadads, des Sohnes Hasaëls, wieder ein[a]. Ben-Hadad hatte sie Joahas, dem Vater Jehoaschs, im Krieg abgenommen. Dreimal schlug Joasch ihn[b] und gewann die Städte Israels zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen in diesem Vers zwei Formen desselben Königsnamens: zunächst „Jehoasch“, später „Joasch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „besiegte ihn“. Das hebräische Verb bedeutet wörtlich „schlagen“ und kann im militärischen Zusammenhang eine Niederlage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּקַּח
  choice: eroberte ... wieder
  rationale: Die Verbindung von שוב und לקח bezeichnet hier die militärische Rückgewinnung zuvor verlorener Städte. „Eroberte ... wieder“ gibt beide Aspekte natürlich und ohne unnötige Doppelung wieder.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: Übliche und kontextgerechte Wiedergabe für befestigte Siedlungen.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Bewahrt das hebräische Macht- und Besitzidiom, das auch im Deutschen verständlich ist.
- source_word: בֶּן־הֲדַד
  choice: Ben-Hadad
  rationale: Gebräuchliche deutsche Umschrift des Königsnamens.
- source_word: אֲשֶׁר לָקַח
  choice: Dieser hatte sie ... aus der Hand genommen
  rationale: Der Plusquamperfekt verdeutlicht, dass Ben-Hadads Einnahme der Städte der Rückeroberung vorausging; ein neuer Satz beseitigt den möglichen unklaren Bezug des Relativpronomens.
- source_word: בַּמִּלְחָמָה
  choice: im Krieg
  rationale: Knapp und idiomatisch; bezeichnet den militärischen Zusammenhang des früheren Verlustes.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: Dreimal
  rationale: Natürliche moderne Wiedergabe der hebräischen Zahlenwendung.
- source_word: הִכָּהוּ
  choice: schlug ... ihn
  rationale: Bewahrt die Grundbedeutung von נכה und lässt zugleich den im Kontext naheliegenden Sinn militärischer Niederlagen zu.
- source_word: יְהוֹאָשׁ / יוֹאָשׁ
  choice: Joasch / Joasch
  rationale: Beide hebräischen Namensformen bezeichnen denselben König. Eine einheitliche deutsche Namensform verhindert den falschen Eindruck zweier Personen; die Formvariation wird in einer Fußnote dokumentiert.
- source_word: וַיָּשֶׁב
  choice: brachte ... zurück
  rationale: Das Hifil mit den Städten als Objekt bezeichnet ihre Rückführung unter israelitische Herrschaft, ohne abstrakter als der Ausgangstext zu formulieren.
theological_decisions: []
translation_notes:
  register: Moderne, würdige historische Erzählprosa. Die Namensformen folgen gängigen deutschen Bibelkonventionen; die hebräische Variation wird transparent in der Fußnote erhalten. Das zweimalige Bild „aus der Hand“ bleibt wegen seiner rhetorischen Entsprechung und Verständlichkeit stehen.
