  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: de
  text: Und Joasch legte sich zu seinen Vätern[a], und Jerobeam setzte sich auf seinen Thron. Joasch wurde in Samaria bei den Königen Israels begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung lautet wörtlich: „legte sich mit seinen Vätern“; sie ist eine übliche Formel für den Tod eines Königs.'
