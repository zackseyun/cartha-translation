lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Die traditionelle deutsche Wendung bewahrt die hebräische königliche Todesformel und lässt deren Bildsprache stehen, ohne sie auf „starb“ zu reduzieren.
- source_word: וְיָרָבְעָם יָשַׁב עַל כִּסְאוֹ
  choice: und Jerobeam setzte sich auf seinen Thron
  rationale: Das Deutsche gibt das Bild des hebräischen Thronbesteigungs- beziehungsweise Nachfolgeausdrucks natürlich wieder.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Die passive Form entspricht dem hebräischen Narrativ und ergänzt kein ungenanntes handelndes Subjekt.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition ist hier örtlich zu verstehen; „in Samaria“ ist im Deutschen die natürliche Ortsangabe.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: bei den Königen Israels
  rationale: „Bei“ bezeichnet im Deutschen idiomatisch die Bestattung an der Seite beziehungsweise in der Grablege der früheren Könige, ohne eine unnatürliche Formulierung zu erzwingen.
