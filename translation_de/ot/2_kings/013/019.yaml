base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: de
  text: 'Da wurde der Mann Gottes zornig auf ihn und sagte: »Du hättest fünf- oder sechsmal auf den Boden schlagen sollen[a]; dann hättest du Aram ein Ende gemacht[b]. Nun aber wirst du Aram nur dreimal schlagen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nur: »schlagen«; »auf den Boden« ist aus der unmittelbar vorausgehenden Handlung in Vers 18 ergänzt.'
    reason: cross_reference
  - marker: b
    text: 'Oder: »bis Aram völlig vernichtet gewesen wäre«. Das Hebräische bezeichnet ein vollständiges Zu-Ende-Bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף עָלָיו
  choice: Da wurde ... zornig auf ihn
  rationale: קצף bezeichnet Zorn bzw. heftigen Unwillen. Die Formulierung ist im modernen Deutschen natürlich und gibt den Eintritt der Reaktion im Erzählverlauf wieder.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feste hebräische Bezeichnung wird bewahrt und nicht interpretierend durch „Prophet“ ersetzt.
- source_word: לְהַכּוֹת
  choice: auf den Boden schlagen
  rationale: Der hebräische Infinitiv nennt hier kein Objekt; „den Boden“ wird aus der unmittelbar vorausgehenden Zeichenhandlung in Vers 18 ergänzt. Die Präposition „auf“ ergibt im Deutschen eine natürliche Wendung.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: fünf- oder sechsmal
  rationale: Die Zahlenangabe wird direkt und idiomatisch wiedergegeben.
- source_word: אָז הִכִּיתָ אֶת אֲרָם
  choice: dann hättest du Aram ... geschlagen
  rationale: Der irreale Folgesatz wird im Deutschen mit Konjunktiv II ausgedrückt. „Schlagen“ bewahrt die Wortverbindung zwischen Zeichenhandlung und militärischem Erfolg.
- source_word: עַד כַּלֵּה
  choice: bis zur völligen Vernichtung
  rationale: כלה bezeichnet hier das vollständige Zu-Ende-Bringen Arams als militärischer Macht. Die nominale Wendung lässt offen, wie dieses Ende konkret beschaffen wäre, bringt aber die Totalität deutlich zum Ausdruck.
- source_word: וְעַתָּה
  choice: Nun aber
  rationale: Die Wendung markiert den Kontrast zwischen der versäumten Möglichkeit und dem nun angekündigten begrenzten Ausgang.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: wirst du Aram nur dreimal schlagen
  rationale: Das Imperfekt ist voraussagend. „Nur“ verdeutlicht die durch den Gegensatz ausgedrückte Begrenzung.
theological_decisions:
- issue: Verbindung zwischen dem Schlagen des Bodens und dem Schlagen Arams
  choice: Für beide Handlungen wird das Verb „schlagen“ verwendet; bei der ersten wird „auf den Boden“ aus Vers 18 ergänzt.
  alternative: Die erste Handlung mit „auf den Boden hauen“ und den militärischen Erfolg mit „Aram besiegen“ wiedergeben.
  rationale: Die Wiederholung desselben Verbs trägt die prophetische Zeichenhandlung. Die gewählte Fassung macht diese Verbindung sichtbar, ohne sie theologisch auszudeuten.
- issue: Tragweite von עַד כַּלֵּה
  choice: „bis zur völligen Vernichtung“
  alternative: „bis du Aram ein Ende gemacht hättest“ oder „bis es ganz aufgerieben gewesen wäre“
  rationale: Der Ausdruck bezeichnet ein vollständiges Ende, doch der Text legt die konkrete Art dieses Endes nicht näher fest. Die Übersetzung wahrt diese Spannung und vermeidet eine zusätzliche Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich. „Mann Gottes“ bewahrt die traditionelle biblische Bezeichnung, während Satzbau und Verbformen gegenwärtigem Sprachgebrauch entsprechen.
