  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וְ/שָׁלֹשׁ֙ שָׁנָ֔ה לְ/יוֹאָ֥שׁ בֶּן אֲחַזְיָ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ יְהוֹאָחָ֨ז בֶּן יֵה֤וּא עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן שְׁבַ֥ע עֶשְׂרֵ֖ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: de
  text: Im dreiundzwanzigsten Regierungsjahr Joaschs, des Sohnes Ahasjas, des Königs von Juda, wurde Joahas, der Sohn Jehus, in Samaria König über Israel und regierte siebzehn Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: wurde … König … und regierte
  rationale: Das zweimalige Vorkommen desselben Verbs bezeichnet zunächst den Regierungsantritt und danach die Dauer der Herrschaft. Die idiomatische deutsche Wiedergabe erhält beide Aspekte, ohne eine im Hebräischen nicht ausdrücklich vorhandene Formulierung wie „begann zu regieren“ zu erzwingen.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: Im dreiundzwanzigsten Regierungsjahr
  rationale: Die hebräische Datierungsformel meint das gezählte Jahr der Herrschaft Joaschs; „Regierungsjahr“ macht diesen Bezug im Deutschen klar.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: Die Präposition עַל bezeichnet hier den Herrschaftsbereich und wird natürlich mit „über“ wiedergegeben.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Bezeichnet den Regierungssitz des israelitischen Königs.
theological_decisions: []
