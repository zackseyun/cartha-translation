revisions:
- from: Die Altäre auf dem Dach des Obergemachs des Ahas[a], welche die Könige von Juda errichtet hatten, und die Altäre, die Manasse in den beiden Vorhöfen des Hauses Jahwes errichtet hatte, riss der König nieder. Dann lief er von dort weg[b] und warf ihren Staub ins Kidrontal.[c]
  to: Die Altäre auf dem Dach des Obergemachs des Ahas[a], welche die Könige von Juda errichtet hatten, und die Altäre, die Manasse in den beiden Vorhöfen des Hauses Jahwes errichtet hatte, riss der König nieder, zertrümmerte sie dort und warf ihren Staub ins Kidrontal.[b]
  rationale: 'Die notwendige Korrektur betrifft allein den Verbalabschnitt וַיָּרָץ מִשָּׁם: Der König zertrümmert die bereits niedergerissenen Altäre und wirft deren Staub anschließend in das Kidrontal. Die Fußnoten werden entsprechend neu geordnet; die irreführende Fußnote zur Lesung „lief“ entfällt. Die übrigen Entscheidungen bleiben quellengetreu und idiomatisch.'
