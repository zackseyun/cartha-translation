source:
  edition: WLC
  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: de
  text: Die Altäre auf dem Dach des Obergemachs des Ahas[a], welche die Könige von Juda errichtet hatten, und die Altäre, die Manasse in den beiden Vorhöfen des Hauses Jahwes errichtet hatte, riss der König nieder, zertrümmerte sie dort und warf ihren Staub ins Kidrontal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „des oberen Raumes des Ahas“. Das hebräische עֲלִיָּה kann einen oberen Raum oder ein Obergemach bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „in den Kidronbach“ oder „in das Kidronwadi“. Das hebräische נַחַל kann einen Bach, ein Bachtal oder eine Schlucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: die Altäre
  rationale: מִזְבֵּחַ bezeichnet einen Altar; der Plural wird an beiden Stellen beibehalten.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: auf dem Dach des Obergemachs des Ahas
  rationale: עֲלִיָּה bezeichnet hier einen erhöht gelegenen Raum beziehungsweise ein Obergemach. Die Formulierung bewahrt den architektonischen Bezug, ohne ihn genauer festzulegen.
- source_word: אֲשֶׁר עָשׂוּ מַלְכֵי יְהוּדָה
  choice: welche die Könige von Juda errichtet hatten
  rationale: Bei Altären gibt „errichten“ den Sinn von עָשָׂה natürlich wieder; das Plusquamperfekt verdeutlicht, dass dies vor den Maßnahmen des Königs geschehen war.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: in den beiden Vorhöfen des Hauses Jahwes
  rationale: חָצֵר bedeutet Hof oder Vorhof. „Haus Jahwes“ bewahrt die hebräische Bezeichnung, statt sie interpretierend durch „Tempel“ zu ersetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נָתַץ
  choice: riss ... nieder
  rationale: נָתַץ bezeichnet das Niederreißen oder Zerstören eines Bauwerks und passt unmittelbar zu den Altären.
- source_word: וַיָּרָץ מִשָּׁם
  choice: Dann lief er von dort weg
  rationale: Die masoretische Punktierung versteht die Form als Verb von רוץ, „laufen“. Die im Kontext verbreitete Deutung „zertrümmerte sie dort“ wird wegen der Schwierigkeit der Stelle in einer Fußnote genannt, aber nicht stillschweigend in den Haupttext übernommen.
- source_word: עֲפָרָם
  choice: ihren Staub
  rationale: עָפָר bedeutet „Staub“ oder „lose Erde“. Die wörtliche Bildsprache der zerkleinerten Überreste bleibt erhalten.
- source_word: נַחַל קִדְרוֹן
  choice: Kidrontal
  rationale: נַחַל kann ein Bachtal, Wadi oder einen zeitweise wasserführenden Bach bezeichnen. „Kidrontal“ ist im Deutschen eine klare geografische Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Deutung von וַיָּרָץ מִשָּׁם
  choice: Dann lief er von dort weg
  alternative: und zertrümmerte sie dort
  rationale: Die gewählte Fassung folgt der masoretischen Punktierung; die alternative, kontextuell gut passende Deutung wird ausdrücklich offengehalten, damit die schwierige Textstelle nicht unbemerkt harmonisiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die langen vorangestellten Satzglieder des Hebräischen bleiben erkennbar, werden aber durch die Teilung in zwei Sätze lesbarer. „Obergemach“, „Vorhöfe“ und „Haus Jahwes“ bewahren den biblisch-architektonischen Charakter, ohne unnötig altertümlich zu wirken.
