source:
  edition: WLC
  text: בְּ/יָמָ֡י/ו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם עַל מֶ֥לֶךְ אַשּׁ֖וּר עַל נְהַר פְּרָ֑ת וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִ/קְרָאת֔/וֹ וַ/יְמִיתֵ֨/הוּ֙ בִּ/מְגִדּ֔וֹ כִּ/רְאֹת֖/וֹ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: de
  text: Zu seiner Zeit zog Pharao Necho, der König von Ägypten, gegen den König von Assyrien zum Euphrat. König Josia zog ihm entgegen[a], und er tötete ihn bei Megiddo, als er ihn sah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Siehe auch 2. Chronik 35,20–24 zum Tod Josias.
    reason: cross_reference
  - marker: b
    text: 'Die hebräischen Pronomen sind mehrdeutig. Gemeint sein kann: „Pharao Necho tötete Josia bei Megiddo, als Josia ihm entgegentrat.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Zu seiner Zeit
  rationale: Die hebräische Zeitangabe bezeichnet die Zeit der Herrschaft Josias; diese Wiedergabe ist nah am Wortlaut und im heutigen Deutsch natürlich.
- source_word: עָלָה ... עַל מֶלֶךְ אַשּׁוּר
  choice: zog ... gegen den König von Assyrien
  rationale: עלה bezeichnet hier ein militärisches Hinauf- oder Ausziehen; עַל wird in diesem Zusammenhang am natürlichsten mit „gegen“ wiedergegeben, ohne die historisch diskutierte Zielrichtung umzudeuten.
- source_word: פַרְעֹה נְכֹה
  choice: Pharao Necho
  rationale: „Necho“ ist die im Deutschen eingebürgerte Namensform.
- source_word: עַל נְהַר פְּרָת
  choice: zum Euphrat
  rationale: Die zweite Präposition עַל bezeichnet hier das Ziel des Zuges; „zum Euphrat“ ist prägnant und idiomatisch.
- source_word: לִקְרָאתוֹ
  choice: zog ihm entgegen
  rationale: לקראת bezeichnet das Entgegengehen oder Entgegenziehen und lässt offen, ob die Begegnung neutral oder feindlich gemeint ist; der militärische Kontext wird nicht stärker ausgedeutet als nötig.
- source_word: וַיְמִיתֵהוּ
  choice: er tötete ihn
  rationale: Der Hifil von מות bedeutet „sterben lassen, töten“. Die direkte deutsche Form ist natürlich und bewahrt zusammen mit den Pronomen die Verdichtung des Hebräischen.
- source_word: בִּמְגִדּוֹ
  choice: bei Megiddo
  rationale: „Bei Megiddo“ bezeichnet Megiddo idiomatisch als Ort des Geschehens.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: als er ihn sah
  rationale: Die wörtliche Wiedergabe erhält die im Hebräischen nicht ausdrücklich aufgelösten männlichen Pronomen.
theological_decisions:
- issue: Mehrdeutige Pronomen in וַיְמִיתֵהוּ und כִּרְאֹתוֹ אֹתוֹ
  choice: Die Folge „er tötete ihn … als er ihn sah“ bleibt im Haupttext mehrdeutig.
  alternative: Pharao Necho tötete Josia bei Megiddo, als Josia ihm entgegentrat.
  rationale: Das Hebräische nennt in den Schlussklauseln weder Subjekt noch Objekt erneut, sondern verwendet ausschließlich Pronomen der dritten Person Singular. Eine ausdrückliche Zuordnung würde die grammatische Verdichtung interpretierend auflösen; die Fußnote erläutert die naheliegende Lesart und verweist auf den Parallelbericht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah an der knappen hebräischen Erzählweise; die genuine Pronomenmehrdeutigkeit wird nicht stillschweigend aufgelöst.
