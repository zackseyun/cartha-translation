  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: de
  text: 'Und der HERR sagte: »Auch Juda werde ich aus meiner Gegenwart entfernen, so wie ich Israel entfernt habe; diese Stadt, die ich erwählt habe – Jerusalem –, und das Haus[a], von dem ich gesagt habe: ›Dort wird mein Name sein‹, werde ich verwerfen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Tempel«. Wörtlich steht im Hebräischen »das Haus«; gemeint ist der Tempel in Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Diese Stadt, die ich erwählt habe – Jerusalem –, und das Haus, von dem ich gesagt habe: ›Dort wird mein Name sein‹, habe ich verworfen.« Die hebräische Verbform kann eine bereits vollendete Handlung bezeichnen; hier ist sie entsprechend der umgebenden Gerichtsankündigung zukunftsbezogen wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Wiedergabe des Gottesnamens wahrt dessen besondere Funktion; die Schreibung in Kapitälchen wird hier durch Großbuchstaben angenähert.
- source_word: אָסִיר / הֲסִרֹתִי (סור im Hifil)
  choice: entfernen / entfernt habe
  rationale: Gibt das verursachende Wegtun wieder und bewahrt die ausdrückliche Parallele zwischen Juda und Israel.
- source_word: מֵעַל פָּנַי
  choice: aus meiner Gegenwart
  rationale: Natürliches Deutsch für die hebräische Wendung »von vor meinem Angesicht«; die relationale Aussage bleibt erhalten, ohne die Körpermetapher unnatürlich nachzubilden.
- source_word: גַּם
  choice: auch
  rationale: Kennzeichnet, dass Juda dasselbe Gericht wie Israel treffen wird.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Stellt den ausdrücklichen Vergleich mit der bereits erfolgten Entfernung Israels her.
- source_word: וּמָאַסְתִּי
  choice: Ich werde ... verwerfen
  rationale: Das Qatal wird im Zusammenhang der angekündigten Gerichtsfolge zukunftsbezogen verstanden. »Verwerfen« bringt die entschiedene Zurückweisung treffend zum Ausdruck.
- source_word: הָעִיר הַזֹּאת אֲשֶׁר בָּחַרְתִּי אֶת יְרוּשָׁלִַם
  choice: diese Stadt, die ich erwählt habe – Jerusalem –
  rationale: Bewahrt die Apposition, mit der Jerusalem als die gemeinte Stadt identifiziert wird, und gibt בחר mit dem theologisch wie sprachlich passenden »erwählen« wieder.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die wörtliche Bezeichnung bleibt im Haupttext erhalten; gemeint ist der Jerusalemer Tempel, was eine Fußnote verdeutlicht.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: Dort wird mein Name sein
  rationale: Bewahrt die Aussage über Gottes Namen und stellt mit natürlicher deutscher Wortfolge den Ortsbezug heraus.
theological_decisions:
- issue: Zeitlicher Aussagewert von וּמָאַסְתִּי in der Gerichtsankündigung
  choice: 'zukunftsbezogen: »Ich werde ... verwerfen«'
  alternative: 'vergangenheitsbezogen: »Ich habe ... verworfen«'
  rationale: Obwohl die Form als vollendete Handlung gelesen werden kann, spricht der Zusammenhang für die Fortsetzung der angekündigten zukünftigen Entfernung Judas. Die alternative Lesart wird offengelegt, damit die grammatische Spannung erhalten bleibt.
- issue: Wiedergabe von הַבַּיִת
  choice: »das Haus« im Haupttext
  alternative: »der Tempel«
  rationale: »Haus« entspricht unmittelbar dem Hebräischen und bewahrt dessen tempeltheologische Resonanz; »Tempel« benennt den gemeinten Referenten deutlicher und erscheint daher in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Gerichtsrede, wird aber durch zwei Hauptsätze lesbar gegliedert. Die Apposition »Jerusalem« ist mit Gedankenstrichen markiert. Beide Fußnotenmarker stehen im Haupttext; Fußnote b folgt dem gesamten Satz, auf dessen alternative Zeitdeutung sie sich bezieht.
