  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: de
  text: Und er tat, was böse war in den Augen Jahwes, ganz wie es seine Väter[a] getan hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Vorfahren“ beziehungsweise „seine Ahnen“. Wörtlich: „seine Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er tat
  rationale: Das Waw mit der narrativen Verbform führt die Erzählung weiter; „Und er tat“ bewahrt diesen Zusammenhang in natürlichem Deutsch.
- source_word: הָרַע
  choice: was böse war
  rationale: Die feste Wendung עשה הרע wird im Deutschen idiomatisch mit „tun, was böse war“ wiedergegeben, statt wörtlich und unbeholfen „das Böse tun“ zu formulieren.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die deutsche Wendung bewahrt das hebräische Bild und bezeichnet Jahwes Beurteilung des Handelns.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz wie
  rationale: Die Formulierung drückt vollständige Übereinstimmung mit dem früheren Verhalten aus; „ganz wie“ ist prägnant und natürlich.
- source_word: עָשׂוּ
  choice: getan hatten
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass das Handeln der Väter dem hier beurteilten Handeln vorausging.
- source_word: אֲבֹתָיו
  choice: seine Väter
  rationale: Die Wiedergabe bewahrt den konkreten Wortlaut; im königlichen Kontext kann der Ausdruck weiter gefasst die Vorfahren oder Vorgänger bezeichnen, was die Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, statt ihn durch den traditionellen Ersatztitel zu ersetzen.
- issue: Bezug von אֲבֹתָיו im königlichen Kontext
  choice: seine Väter
  alternative: seine Vorfahren
  rationale: „Väter“ wahrt die Bildsprache und mögliche Spannung des Originals; die weitere Bedeutung „Vorfahren“ wird nicht stillschweigend festgelegt, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle biblische Bewertungsformel bleibt erkennbar, ohne unnötig altertümliche Syntax. Der Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Ausdruck.
