base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: de
  text: Joahas war dreiundzwanzig Jahre alt, als er König wurde, und regierte drei Monate in Jerusalem. Seine Mutter hieß Hamutal; sie war eine Tochter Jeremias aus Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: war dreiundzwanzig Jahre alt
  rationale: Die hebräische Altersangabe wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die mit ב gebildete Zeitangabe bezeichnet hier den Zeitpunkt des Regierungsantritts.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: und regierte drei Monate
  rationale: Der finite Ausdruck bezeichnet die Dauer seiner Herrschaft; der temporale Akkusativ lässt sich im Deutschen ohne zusätzliche Präposition natürlich wiedergeben.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Ortsangabe wird unmittelbar und idiomatisch übersetzt.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Dies gibt die feste hebräische Namensformel knapp und natürlich wieder.
- source_word: חֲמוּטַל
  choice: Hamutal
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form transliteriert.
- source_word: בַּת יִרְמְיָהוּ
  choice: eine Tochter Jeremias
  rationale: בַּת bezeichnet die Abstammungsbeziehung; der Genitiv ist im Deutschen in dieser genealogischen Formel natürlich.
- source_word: מִלִּבְנָה
  choice: aus Libna
  rationale: מן bezeichnet hier die Herkunft bzw. örtliche Zuordnung Jeremias; „aus“ bildet diese Bedeutung genauer ab als ein bloßer Genitiv.
