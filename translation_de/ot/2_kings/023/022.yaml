source:
  edition: WLC
  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: de
  text: Denn ein Passafest wie dieses war seit den Tagen der Richter, die Israel richteten, und während der ganzen Zeit der Könige Israels und Judas nicht gefeiert worden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie dieses Passa“.'
    reason: Die Vergleichskonstruktion כַּפֶּסַח הַזֶּה bezeichnet ein Passa, das diesem vergleichbar ist; sie behauptet nicht, dass zuvor überhaupt kein Passa gefeiert wurde.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorhergehende Aussage über Josias Passafest ein und bewahrt die erklärend-kausale Funktion.
- source_word: לֹא נַעֲשָׂה
  choice: war … nicht gefeiert worden
  rationale: Das passive נַעֲשָׂה bedeutet wörtlich „war nicht gemacht worden“; bei einem Fest gibt „war nicht gefeiert worden“ den idiomatischen Sinn im Deutschen wieder.
- source_word: כַּפֶּסַח הַזֶּה
  choice: kein solches Passafest
  rationale: 'Das Präfix כְּ bezeichnet den Vergleich: Gemeint ist nicht, dass überhaupt kein Passa gefeiert wurde, sondern dass keines diesem Passa gleichkam.'
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: seit der Zeit der Richter
  rationale: מִן mit יְמֵי markiert den zeitlichen Ausgangspunkt; „seit der Zeit“ ist natürliches modernes Deutsch.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: die Israel richteten
  rationale: Bewahrt die Wortverbindung zwischen שֹׁפְטִים („Richter“) und שָׁפְטוּ („richteten“), ohne die historische Amtsfunktion durch „regierten“ festzulegen.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: auch nicht während der ganzen Zeit der Könige von Israel und der Könige von Juda
  rationale: Die Fortführung der Verneinung wird im Deutschen ausdrücklich wiedergegeben; die Wiederholung von „der Könige von“ wahrt die hebräische Gliederung und unterscheidet beide Königreiche.
theological_decisions:
- issue: Reichweite des historischen Vergleichs
  choice: Kein Passafest, das dem unter Josia vergleichbar war, wurde seit der Richterzeit und während der Zeit beider Königreiche gefeiert.
  alternative: Seit der Richterzeit wurde überhaupt kein Passafest gefeiert.
  rationale: כַּפֶּסַח הַזֶּה ist eine Vergleichsformel („wie dieses Passa“). Der Vers bestreitet daher nicht ausdrücklich jede frühere Passafeier, sondern eine Feier von dieser Art; ob die Aussage rhetorisch überhöht ist, wird nicht entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Passafest“ ist für heutige Leser klarer als das isolierte „Passa“; „richteten“ erhält bewusst den hebräischen Wortklang zwischen Richter und richten.
