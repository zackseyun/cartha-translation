  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: 'Die übrigen Taten Josias und alles, was er getan hat: Sind sie nicht im »Buch der Geschichte der Könige von Juda«[b] aufgeschrieben[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verzeichnet«. Das hebräische passive Partizip bedeutet wörtlich »geschrieben«; in diesem Zusammenhang kann es auch das Eintragen in ein geschichtliches Verzeichnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das »Buch der Geschichte der Könige von Juda« ist eine in den Königebüchern angeführte königliche Quelle; es ist nicht notwendigerweise mit den biblischen Büchern 1–2 Chronik in ihrer endgültigen Form identisch.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: die übrigen Taten Josias
  rationale: יֶתֶר bezeichnet das Übrige oder Verbleibende; דִּבְרֵי meint in dieser königlichen Schlussformel die Taten beziehungsweise Angelegenheiten des Königs. Die Formulierung ist quellennah und zugleich natürlich.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er getan hat
  rationale: Die breite Bedeutung von עשה wird mit dem geläufigen »getan hat« bewahrt, ohne die Art seiner Leistungen näher festzulegen.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgeschrieben?
  rationale: Die rhetorische Frage erwartet Zustimmung. »Aufgeschrieben« gibt das passive Partizip כְּתוּבִים wieder und passt zum schriftlichen Quellenverweis.
- source_word: עַל סֵפֶר
  choice: im … Buch
  rationale: Obwohl עַל grundsätzlich »auf/über« bedeuten kann, ist im Deutschen bei einem schriftlichen Eintrag die idiomatische Wiedergabe »im Buch aufgeschrieben« angemessen.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Buch der Geschichte der Könige von Juda
  rationale: Die traditionelle, verständliche Quellenbezeichnung gibt דִּבְרֵי הַיָּמִים als fortlaufenden Geschichtsbericht beziehungsweise Annalen wieder. Sie bezeichnet hier die in Könige zitierte königliche Quelle.
theological_decisions:
- issue: Identität des genannten Buches
  choice: Die Übersetzung lässt die Bezeichnung als historischen Quellentitel stehen und erläutert sie in einer Fußnote.
  alternative: Die Bezeichnung ausdrücklich mit den kanonischen Chronikbüchern gleichsetzen.
  rationale: Der hebräische Text nennt eine königliche Aufzeichnung, erlaubt aber keine sichere Gleichsetzung mit der Endgestalt der biblischen Chronikbücher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich markiert den Übergang von der langen Nominalgruppe zur rhetorischen Frage. Die königliche Schlussformel bleibt erkennbar, ohne altertümliche Satzstellung.
