source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: de
  text: Dann befahl der König dem Hohepriester Hilkija, den Priestern des zweiten Ranges und den Hütern der Schwelle, alle Geräte aus dem Tempel Jahwes hinauszubringen, die für den Baal, für die Aschera[a] und für das ganze Heer des Himmels angefertigt worden waren. Er verbrannte sie außerhalb Jerusalems auf den Feldern am Kidron und brachte ihren Staub nach Bet-El.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Aschera-Pfahl“ beziehungsweise „für das Aschera-Kultbild“. Das hebräische Wort kann sowohl die Göttin Aschera als auch einen mit ihr verbundenen Kultgegenstand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Dann befahl der König
  rationale: Bewahrt die autoritative Bedeutung von צוה und den fortlaufenden Erzählstil, ohne anstelle des hebräischen Titels einen Eigennamen einzusetzen.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: dem Hohen Priester Hilkija
  rationale: „Hoher Priester“ ist die etablierte deutsche Amtsbezeichnung; die deutsche Wortstellung ist natürlicher als eine streng formale Nachbildung.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: den Priestern des zweiten Ranges
  rationale: מִשְׁנֶה bezeichnet hier eine nachgeordnete Rangstufe; die Formulierung bleibt institutionell zurückhaltend und verständlich.
- source_word: שֹׁמְרֵי הַסַּף
  choice: den Hütern der Schwelle
  rationale: Gibt das konkrete Bild und die amtliche Funktion enger wieder als das interpretierendere „Torhütern“.
- source_word: מֵהֵיכַל יְהוָה
  choice: aus dem Tempel Jahwes
  rationale: הֵיכָל meint im kultischen Zusammenhang eindeutig den Tempel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כָּל הַכֵּלִים
  choice: alle Geräte
  rationale: „Geräte“ ist im Deutschen ein natürlicher, hinreichend weiter Ausdruck für kultische Gegenstände; „Gefäße“ wäre zu eng.
- source_word: לַבַּעַל
  choice: für den Baal
  rationale: Der hebräische Text hat den Artikel; „der Baal“ bewahrt ihn und kann den konkret verehrten Baal bezeichnen.
- source_word: לָאֲשֵׁרָה
  choice: für die Aschera
  rationale: Die Wiedergabe erhält die mögliche Beziehung zur Göttin beziehungsweise zu ihrem Kultsymbol, ohne den Referenten im Haupttext festzulegen.
- source_word: כֹל צְבָא הַשָּׁמָיִם
  choice: das ganze Heer des Himmels
  rationale: Die traditionelle, bildhafte Wendung wahrt die kollektive Bezeichnung der Himmelsmächte beziehungsweise Himmelskörper.
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: auf den Feldern am Kidron
  rationale: שַׁדְמוֹת bezeichnet Felder beziehungsweise Fluren; „am Kidron“ ist im Deutschen eine natürliche Ortsangabe, ohne den Namen unnötig zu präzisieren.
- source_word: וְנָשָׂא אֶת עֲפָרָם
  choice: und ließ ihren Staub ... bringen
  rationale: עָפָר bedeutet hier wörtlich „Staub“ und wohl den pulverisierten Verbrennungsrückstand. Das singularische Verb kann sich auf den König als Veranlasser beziehen; „ließ ... bringen“ macht diesen Kausativsinn idiomatisch deutlich.
- source_word: בֵּית אֵל
  choice: Bet-El
  rationale: Transliteriert den Ortsnamen transparent als „Haus Gottes“ und entspricht einer gebräuchlichen deutschen Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Form und vermeidet die Ersetzung durch einen Titel.
- issue: Referent von אֲשֵׁרָה
  choice: die Aschera, mit erklärender Fußnote
  alternative: die Göttin Aschera / der Aschera-Pfahl / das Aschera-Kultbild
  rationale: Das hebräische Wort kann die Gottheit oder ein mit ihr verbundenes Kultobjekt bezeichnen. Der Haupttext bewahrt diese Spannung, die Fußnote nennt die sachliche Alternative.
- issue: Bedeutung des Heeres des Himmels
  choice: wörtliche Bildsprache beibehalten
  alternative: alle Himmelskörper / alle Gestirne
  rationale: Die wörtliche Wendung lässt offen, ob primär Gestirne oder als Mächte gedachte himmlische Wesen im Blick sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zum Hebräischen. Amts- und Kultbegriffe bleiben erkennbar, während Wortstellung und Satzbau natürlich deutsch gestaltet sind. Die echte Mehrdeutigkeit von אֲשֵׁרָה wird nicht im Haupttext aufgelöst.
