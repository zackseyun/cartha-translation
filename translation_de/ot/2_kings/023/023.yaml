  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: de
  text: Sondern erst im achtzehnten Regierungsjahr des Königs Josia wurde dieses Passafest für Jahwe in Jerusalem gefeiert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wurde gemacht“; gemeint ist: „wurde gefeiert“ oder „wurde begangen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: sondern erst
  rationale: Die adversativ-einschränkende Wendung knüpft an die Aussage des vorigen Verses an, dass zuvor kein solches Passafest gefeiert worden war. Im Zusammenhang einer Zeitangabe gibt „sondern erst“ den Kontrast im Deutschen natürlich wieder.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: im achtzehnten Regierungsjahr König Josias
  rationale: Das lamed bezeichnet hier die Zuordnung der Jahresangabe zur Regierungszeit des Königs. „Regierungsjahr“ macht diesen im Hebräischen knappen Bezug idiomatisch deutlich.
- source_word: נַעֲשָׂה
  choice: wurde … gefeiert
  rationale: Das Verb bedeutet wörtlich „wurde gemacht/getan“. Mit dem Passa als Subjekt bezeichnet es idiomatisch dessen Feier; die passive Form bleibt erhalten.
- source_word: הַפֶּסַח הַזֶּה
  choice: dieses Passafest
  rationale: „Passafest“ ist im modernen Deutschen klarer und natürlicher als das alleinstehende „Passa“ und macht deutlich, dass die Feier gemeint ist.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das lamed bezeichnet die Ausrichtung beziehungsweise Widmung der Feier. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen in der im Deutschen üblichen wissenschaftlichen Form wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sondern erst“ wahrt den engen Kontrast zum vorangehenden Vers; „Regierungsjahr“ verdeutlicht den sachlich gemeinten Bezug der hebräischen lamed-Konstruktion.
