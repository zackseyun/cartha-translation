source:
  edition: WLC
  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: de
  text: Und Pharao Necho machte Eljakim, den Sohn Josias, anstelle seines Vaters Josia zum König und änderte seinen Namen in Jojakim.[a] Joahas aber nahm er mit; dieser kam nach Ägypten[b] und starb dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Pharao Necho gab Eljakim den Namen Jojakim.'
    reason: cultural_note
  - marker: b
    text: 'Oder: ging nach Ägypten. Im Hebräischen steht „kam nach Ägypten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: machte … zum König
  rationale: 'Die Hifil-Form von מלך ist hier kausativ: Pharao Necho setzt Eljakim als König ein. Die gewählte Formulierung gibt diese Bedeutung natürlich und deutlich wieder.'
- source_word: תַּחַת
  choice: anstelle
  rationale: Im Zusammenhang der Thronfolge bezeichnet תַּחַת den Ersatz beziehungsweise die Nachfolge.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: änderte seinen Namen
  rationale: Die hebräische Wendung bezeichnet eine Namensänderung; die Übersetzung bleibt nah am Wortlaut und ist zugleich idiomatisch.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: Joahas aber nahm er mit
  rationale: לקח ist das allgemeine Verb für „nehmen“. Der Zusammenhang kann Gefangennahme oder Wegführung nahelegen, doch „nahm … mit“ vermeidet eine stärkere Festlegung als der hebräische Wortlaut.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: dieser kam nach Ägypten
  rationale: Das hebräische Verb bedeutet wörtlich „kam“. Das Demonstrativpronomen verdeutlicht im Deutschen, dass Joahas das Subjekt ist, ohne die Perspektive des Ausgangstextes zu glätten.
- source_word: וַיָּמָת שָׁם
  choice: und starb dort
  rationale: Schlichte Wiedergabe des knappen erzählerischen Abschlusses.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit den im Deutschen üblichen biblischen Namensformen. Die knappe Erzählweise des Hebräischen bleibt erhalten; zugleich wird der wechselnde Bezug des Pronomens durch „dieser“ verständlich gemacht.
