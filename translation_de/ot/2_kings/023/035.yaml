base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: de
  text: Jojakim gab dem Pharao das Silber und das Gold. Doch er besteuerte[a] das Land, um das Silber nach dem Befehl des Pharaos[b] aufzubringen. Von der Bevölkerung des Landes trieb er das Silber und das Gold ein, von jedem entsprechend seiner Steuerveranlagung[c], um sie dem Pharao Necho zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „veranlagte das Land“ beziehungsweise „legte dem Land eine Abgabe auf“. Das hebräische Verb bezeichnet hier das Festsetzen einer zu entrichtenden Leistung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach dem Mund des Pharaos“, das heißt nach seinem Befehl.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „entsprechend dem für ihn festgesetzten Betrag“; sinngemäß auch: „nach seinen Mitteln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: besteuerte
  rationale: Im Hifil bezeichnet das Verb hier angesichts des Landes als Objekt und der anschließenden Zahlung eine auferlegte fiskalische Veranlagung. „Besteuerte“ gibt diese Funktion in natürlichem Deutsch wieder; die engere Bedeutung „veranschlagte“ bleibt in der Fußnote sichtbar.
- source_word: עַל־פִּי פַרְעֹה
  choice: nach dem Befehl des Pharaos
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund des Pharaos“, idiomatisch jedoch „nach seinem Befehl“ oder „auf seine Anordnung hin“.
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: von jedem entsprechend seiner Veranlagung
  rationale: Die Formulierung bezeichnet eine individuell bemessene Abgabe. „Veranlagung“ wahrt den Zusammenhang mit dem zuvor verwendeten Verbstamm und vermeidet die weitergehende Deutung „nach seinen Mitteln“.
- source_word: נָגַשׂ
  choice: trieb … ein
  rationale: Das Verb trägt den Gedanken nachdrücklichen oder zwangsweisen Einforderns. „Eintreiben“ bewahrt diesen Unterton besser als das neutrale „einsammeln“.
- source_word: עַם הָאָרֶץ
  choice: Bevölkerung des Landes
  rationale: Die natürliche deutsche Wiedergabe lässt offen, ob der Ausdruck hier allgemein die Landesbevölkerung oder eine besondere gesellschaftlich-politische Gruppe bezeichnet.
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: das Silber und das Gold
  rationale: Die konkreten Edelmetalle und ihr Parallelismus bleiben erhalten; obwohl Silber zugleich Zahlungsmittel sein kann, wäre „Geld“ weniger quellennah.
- source_word: פַרְעֹה נְכֹה
  choice: Pharao Necho
  rationale: „Necho“ ist eine im Deutschen etablierte Schreibweise des Namens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Verständlichkeit, ohne die Abfolge des Hebräischen zu verändern. Fiskalische Begriffe wie „besteuern“, „Veranlagung“ und „eintreiben“ geben den Zwangscharakter der Tributeinhebung wieder, ohne die nicht ausdrücklich genannte soziale Stellung der Betroffenen festzulegen.
