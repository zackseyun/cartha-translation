  text: וַ/יֹּ֕אמֶר מָ֚ה הַ/צִּיּ֣וּן הַלָּ֔ז אֲשֶׁ֖ר אֲנִ֣י רֹאֶ֑ה וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אַנְשֵׁ֣י הָ/עִ֗יר הַ/קֶּ֤בֶר אִישׁ הָֽ/אֱלֹהִים֙ אֲשֶׁר בָּ֣א מִֽ/יהוּדָ֔ה וַ/יִּקְרָ֗א אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר עָשִׂ֔יתָ עַ֖ל הַ/מִּזְבַּ֥ח בֵּֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: de
  text: 'Da fragte er: „Was ist das dort für ein Denkmal[a], das ich sehe?“ Die Männer der Stadt antworteten ihm: „Das ist das Grab des Mannes Gottes, der aus Juda kam und diese Dinge verkündete[b], die du gegen den Altar von Bethel getan hast.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kennzeichen“, „Gedenkstein“ oder „Grabstein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ausrief“ oder „ankündigte“; gemeint ist der prophetische Ausspruch des Mannes Gottes gegen den Altar (vgl. 1 Könige 13,1–2).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: Denkmal
  rationale: Das Substantiv bezeichnet ein sichtbares Kennzeichen oder Erinnerungsmal. „Denkmal“ bleibt hinreichend weit und passt zum anschließenden Hinweis auf das Grab, ohne den Gegenstand vorschnell als Grabstein festzulegen.
- source_word: הַלָּז
  choice: dort
  rationale: Die deiktische Form weist auf den sichtbaren Gegenstand hin. Die idiomatische Frage „Was ist das dort für …?“ gibt diese räumliche Zeigefunktion natürlich wieder.
- source_word: אֲנִי רֹאֶה
  choice: das ich sehe
  rationale: Das Präsens gibt die hebräische Partizipialkonstruktion in der unmittelbaren Wahrnehmung natürlich wieder.
- source_word: הַקֶּבֶר
  choice: das Grab
  rationale: „Grab“ ist die geläufige und kontextgerechte Bezeichnung für die gekennzeichnete Begräbnisstätte.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feststehende hebräische Bezeichnung wird transparent wiedergegeben und nicht enger als „Prophet“ ausgelegt.
- source_word: מִיהוּדָה
  choice: aus Juda
  rationale: Dies ist die natürliche deutsche Wiedergabe der Herkunftsangabe.
- source_word: וַיִּקְרָא
  choice: ankündigte
  rationale: Im Rückbezug auf 1 Könige 13 bezeichnet das Verb den öffentlichen prophetischen Ausspruch über das spätere Geschehen am Altar. „Ankündigte“ macht den zukunftsgerichteten Sinn im Deutschen verständlich, ohne zusätzliche Einzelheiten einzutragen.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: all das
  rationale: Die Wendung kann Worte, Angelegenheiten oder Geschehnisse bezeichnen. „All das“ wahrt diese Bedeutungsbreite und verbindet den Ausspruch idiomatisch mit seiner Erfüllung.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: was du … getan hast
  rationale: Das deutsche Perfekt verbindet Josias soeben vollzogene Handlung natürlich mit ihrer gegenwärtigen Bedeutung.
- source_word: עַל הַמִּזְבֵּחַ
  choice: am Altar
  rationale: Die Präposition kann hier den Ort beziehungsweise den Gegenstand der Handlung bezeichnen. „Am Altar“ passt unmittelbar zu Josias Handlungen; die feindliche Ausrichtung ergibt sich aus dem Kontext, ohne in die Präposition hineingelesen zu werden.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens.
theological_decisions:
- issue: Wiedergabe des früheren prophetischen Ausspruchs
  choice: „ankündigte“ kennzeichnet den Ausspruch als prophetische Ankündigung, ohne seinen Inhalt über den Vers hinaus auszubauen.
  alternative: „ausrief“ oder „verkündete“
  rationale: Der Vers verweist auf die Weissagung gegen den Altar in 1 Könige 13,1–2. Die gewählte Formulierung macht den Zusammenhang von Ausspruch und Erfüllung verständlich, ohne weitere theologische Deutung einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; „Was ist das dort für …?“ bildet die hebräische Zeigefunktion idiomatisch ab. Die Formulierung vermeidet konfessionelle Sonderbegriffe.
