  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: de
  text: Er ließ alle Priester aus den Städten Judas kommen und entweihte die Kulthöhen von Geba bis Beerscheba, auf denen die Priester Rauchopfer dargebracht hatten. Auch riss er die Kulthöhen an den Toren[a] nieder, die sich am Eingang des Tores Josuas, des Stadtobersten, befanden, links von einem Mann am Stadttor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Kulthöhen der Tore«; wahrscheinlich sind Kultstätten an den Toren gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Formulierung ist schwierig; wörtlich etwa: »die auf der Linken eines Mannes am Stadttor waren«. Gemeint sein kann die linke Seite beim Hineingehen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּבֵא אֶת כָּל הַכֹּהֲנִים
  choice: Er ließ alle Priester … kommen
  rationale: Der Hifil von בוא bedeutet „bringen“ beziehungsweise „kommen lassen“. Die deutsche Kausativform gibt Josias veranlasstes Herbeiholen natürlich wieder.
- source_word: מֵעָרֵי יְהוּדָה
  choice: aus den Städten Judas
  rationale: עָרִים bezeichnet städtische Ortschaften; „Städte“ ist hier die übliche und ausreichend breite Wiedergabe.
- source_word: וַיְטַמֵּא
  choice: entweihte
  rationale: Der Piel von טמא bedeutet, etwas unrein zu machen. Bei Kultstätten bezeichnet „entweihen“ prägnant deren kultische Unbrauchbarmachung.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: בָּמוֹת bezeichnet örtliche Kultstätten, häufig auf Anhöhen. „Kulthöhen“ ist im Deutschen verständlicher und genauer als das rein räumliche „Höhen“.
- source_word: קִטְּרוּ שָׁמָּה
  choice: Rauchopfer dargebracht hatten
  rationale: קטר kann das Verbrennen von Räucherwerk oder allgemeiner das Erzeugen von Opferrauch bezeichnen. „Rauchopfer darbringen“ bewahrt diese Bedeutungsbreite besser als die engere Festlegung auf Weihrauch.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: von Geba bis Beerscheba
  rationale: Die Ortsangaben markieren die Nord-Süd-Ausdehnung des judäischen Gebiets; die Namen werden in ihrer üblichen deutschen Form wiedergegeben.
- source_word: וְנָתַץ
  choice: Auch riss er … nieder
  rationale: נתץ bedeutet niederreißen oder zerstören. „Auch“ verdeutlicht die fortführende Funktion des ו, ohne eine zusätzliche inhaltliche Aussage einzuführen.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: die Kulthöhen an den Toren
  rationale: Wörtlich steht eine Genitivverbindung, „Kulthöhen der Tore“. Die lokale Wiedergabe „an den Toren“ ist im Deutschen verständlich, bleibt aber wegen der komprimierten hebräischen Formulierung in einer Fußnote ausgewiesen.
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: am Eingang zum Tor Josuas
  rationale: פֶּתַח bezeichnet Eingang oder Öffnung. Die deutsche Form gibt die Konstruktverbindung natürlich wieder.
- source_word: שַׂר הָעִיר
  choice: des Stadtobersten
  rationale: שַׂר bezeichnet einen führenden Amtsträger. „Stadtoberster“ gibt die kommunale Leitungsfunktion wieder, ohne ein genaueres, im Text nicht genanntes Amt vorauszusetzen.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: und zwar links, wenn man zum Stadttor hineinging
  rationale: Die hebräische Wendung ist elliptisch und lautet annähernd „das auf der Linken eines Mannes am Stadttor“. Die Wiedergabe folgt dem wahrscheinlichen räumlichen Sinn und kennzeichnet die Unsicherheit in einer Fußnote.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Kulthöhen“ bewahrt den etablierten kultischen Sinn von בָּמוֹת; „Rauchopfer“ vermeidet eine unnötige Verengung auf Weihrauch. Die schwer verständliche Schlusswendung wird im Haupttext behutsam erschlossen und in der Fußnote transparent gemacht.
