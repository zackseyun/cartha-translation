source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: de
  text: Er entfernte die Pferde, die die Könige von Juda der Sonne geweiht hatten, aus dem Bereich zwischen dem Eingang des Hauses Jahwes und der Kammer des Hofbeamten[a] Netan-Melech, die in den äußeren Bezirken[b] lag. Die Sonnenwagen aber verbrannte er im Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Eunuchen“. Das hebräische Wort kann sowohl einen Eunuchen als auch einen königlichen oder höfischen Amtsträger bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete hebräische Wort ist selten und seine genaue Bedeutung unsicher. Es bezeichnet wahrscheinlich einen äußeren oder abgelegenen Bereich des Tempelkomplexes; möglich sind auch Wiedergaben wie „Randbereiche“, „Vorstadtbereiche“ oder „Säulengänge“.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: Er entfernte
  rationale: Der Hifil von שׁבת bedeutet hier, etwas außer Gebrauch zu setzen oder zu beseitigen. „Entfernte“ passt natürlich zu den Pferden und zu Josias Reformmaßnahmen.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: welche die Könige von Juda der Sonne geweiht hatten
  rationale: נתן heißt wörtlich „geben“; im kultischen Zusammenhang bezeichnet es hier die Bestimmung oder Weihung der Pferde für den Sonnenkult.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: aus dem Bereich vom Eingang des Hauses Jahwes bis zur Kammer
  rationale: Die Konstruktion mit מִן … אֶל wird als räumliche Erstreckung wiedergegeben. „Aus dem Bereich“ macht im Deutschen deutlich, dass die Pferde entfernt wurden, ohne die knappe hebräische Ortsangabe als Bewegung der Pferde zur Kammer misszuverstehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: נְתַן מֶלֶךְ
  choice: Netan-Melech
  rationale: Der Personenname wird nach seiner masoretischen Vokalisierung in einer deutsch lesbaren Form transliteriert.
- source_word: הַסָּרִיס
  choice: Hofbeamten
  rationale: סָרִיס kann sowohl einen Eunuchen als auch einen königlichen beziehungsweise höfischen Amtsträger bezeichnen. Im Haupttext wird die funktionale Bedeutung gewählt; die andere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: בַּפַּרְוָרִים
  choice: in den äußeren Bezirken
  rationale: Das seltene Wort bezeichnet wahrscheinlich einen Rand- oder Außenbereich des Tempelkomplexes. Die Übersetzung bleibt bewusst allgemein.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: die Sonnenwagen
  rationale: Die kompakte deutsche Zusammensetzung bewahrt das kultische Bild der mit der Sonne verbundenen Wagen.
- source_word: שָׂרַף בָּאֵשׁ
  choice: verbrannte er im Feuer
  rationale: Die ausdrückliche Nennung des Feuers im Hebräischen wird beibehalten, auch wenn „verbrannte“ allein im Deutschen genügen würde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die deutsche Form „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Kultische Bestimmung der Pferde
  choice: der Sonne geweiht
  alternative: der Sonne gegeben
  rationale: Die Formulierung verdeutlicht den kultischen Zusammenhang, identifiziert „die Sonne“ aber nicht über den Wortlaut hinaus ausdrücklich als eine bestimmte Gottheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Reihung. „Haus Jahwes“ bewahrt die biblische Tempelbezeichnung; „Sonnenwagen“ ist knapp und verständlich. Die ungewöhnliche räumliche Konstruktion wird lesbar gemacht, ohne ihre mögliche Ausdehnung vom Eingang bis zur Kammer auf einen einzigen Punkt zu verengen.
