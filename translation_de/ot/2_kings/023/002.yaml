id: 2KI.23.2
reference: 2 Kings 23:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: de
  text: Da ging der König zum Haus Jahwes[a] hinauf, zusammen mit allen Männern Judas[b] und allen Einwohnern Jerusalems, den Priestern und den Propheten und dem ganzen Volk, vom Geringen bis zum Großen[c]. Er las ihnen alle Worte des Bundesbuches vor, das im Haus Jahwes gefunden worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Tempel Jahwes«. Wörtlich: »zum Haus Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »alle Männer Judas«. Die Wendung kann repräsentativ für die Bevölkerung gebraucht sein; die maskuline Formulierung des Ausgangstextes bleibt in der Übersetzung erhalten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »vom Kleinsten bis zum Größten«. Gemeint ist die gesamte Spannweite des Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ging … hinauf
  rationale: Bewahrt die Richtungsbedeutung von עלה und klingt im Zusammenhang mit dem Gang zum Heiligtum natürlich.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Gibt die hebräische Wendung formal genau wieder; »Tempel Jahwes« wäre eine mögliche kontextuelle Verdeutlichung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder; »Jahwe« ist die geläufige deutsche Form.
- source_word: כָל אִישׁ יְהוּדָה
  choice: alle Männer Judas
  rationale: Bewahrt die maskuline kollektive Formulierung des Hebräischen, ohne sie stillschweigend zu »das ganze Volk Judas« zu verallgemeinern.
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: alle Einwohner Jerusalems
  rationale: Natürliche und genaue Wiedergabe der substantivierten Partizipialform für die dort Wohnenden.
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: die Priester und die Propheten
  rationale: Entspricht den üblichen Bezeichnungen für die kultischen Amtsträger und prophetischen Sprecher.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: Gibt den kollektiven Ausdruck idiomatisch und umfassend wieder.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: vom Geringen bis zum Großen
  rationale: Bewahrt die soziale beziehungsweise rangbezogene Weite des Idioms; eine rein altersbezogene Wiedergabe wäre zu eng.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: Er las ihnen … vor
  rationale: Da der Gegenstand ein Buch ist, bezeichnet קרא hier das öffentliche Vorlesen; »ihnen vorlesen« gibt zugleich den Sinn von »vor ihren Ohren« natürlich wieder.
- source_word: סֵפֶר הַבְּרִית
  choice: Bundesbuch
  rationale: Knappe, im Deutschen verständliche Wiedergabe der hebräischen Genitivverbindung »Buch des Bundes«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. Seine Wiedergabe als »Jahwe« macht den Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von כָל אִישׁ יְהוּדָה
  choice: alle Männer Judas
  alternative: alle Menschen aus Juda
  rationale: Die Übersetzung erhält die ausdrücklich maskuline Form des Ausgangstextes. Ob die Männer dabei repräsentativ für die gesamte Bevölkerung stehen, bleibt als mögliche pragmatische Reichweite offen.
- issue: Bedeutung von לְמִקָּטֹן וְעַד גָּדוֹל
  choice: vom Geringen bis zum Großen
  alternative: vom Kleinsten bis zum Größten
  rationale: Die Formulierung soll die umfassende soziale Spannweite ausdrücken, ohne sie unbegründet auf Alter, Macht oder Frömmigkeit festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für flüssiges öffentliches Lesen leicht gegliedert; die Aufzählung und die umfassende soziale Spannweite des hebräischen Textes bleiben erhalten. »Vorlesen« ist idiomatischer als die wörtliche Wendung »in ihren Ohren lesen«.
