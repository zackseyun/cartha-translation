source:
  edition: WLC
  text: וְ/גַ֨ם אֶת הַ/מִּזְבֵּ֜חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֗ל הַ/בָּמָה֙ אֲשֶׁ֨ר עָשָׂ֜ה יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל גַּ֣ם אֶת הַ/מִּזְבֵּ֧חַ הַ/ה֛וּא וְ/אֶת הַ/בָּמָ֖ה נָתָ֑ץ וַ/יִּשְׂרֹ֧ף אֶת הַ/בָּמָ֛ה הֵדַ֥ק לְ/עָפָ֖ר וְ/שָׂרַ֥ף אֲשֵׁרָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: de
  text: Auch den Altar in Bethel – das Höhenheiligtum, das Jerobeam, der Sohn Nebats, errichtet hatte, der Israel zur Sünde verleitete –, ja, diesen Altar und das Höhenheiligtum riss er nieder. Er verbrannte das Höhenheiligtum, zermalmte es zu Staub und verbrannte die Aschera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Aschera-Pfahl; der hebräische Ausdruck kann ein mit der Verehrung der Göttin Aschera verbundenes Kultobjekt bezeichnen.'
    reason: Die Fußnote nennt die in diesem Zerstörungskontext wahrscheinliche kultobjektbezogene Lesart, während „Aschera“ im Haupttext die hebräische Mehrdeutigkeit bewahrt.
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: Die übliche und genaue deutsche Wiedergabe von מִזְבֵּחַ; eine Erweiterung zu „Opferaltar“ ist nicht erforderlich.
- source_word: בְּבֵית אֵל
  choice: in Bet-El
  rationale: Gibt die Ortsangabe mit der Präposition בְּ natürlich wieder; die Schreibweise macht die Bedeutung des Ortsnamens transparent.
- source_word: הַבָּמָה
  choice: das Höhenheiligtum
  rationale: Bezeichnet eine kultische Anlage oder Kultstätte. „Höhenheiligtum“ bewahrt den religiösen Fachsinn und ist im heutigen Deutsch verständlicher als das missverständliche „Höhe“.
- source_word: עָשָׂה
  choice: errichtet hatte
  rationale: Im Zusammenhang mit einer Kultstätte ist „errichten“ idiomatisch; das Plusquamperfekt kennzeichnet die gegenüber Josias Handeln vorausliegende Handlung, ohne den allgemeineren Sinn von עשה unnötig auszuweiten.
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: durch das er Israel zur Sünde verleitete
  rationale: Bewahrt die kausative Bedeutung des Hifil. Der Bezug auf das errichtete Heiligtum ist im Deutschen syntaktisch klar; „verleitete“ gibt die bewirkte Hinwendung zur Sünde natürlich wieder.
- source_word: גַּם אֶת הַמִּזְבֵּחַ הַהוּא
  choice: ja, diesen Altar
  rationale: Das wiederholte גַּם und das Demonstrativum setzen einen emphatischen Fokus, den „ja, diesen“ im Deutschen angemessen ausdrückt.
- source_word: נָתָץ
  choice: riss er nieder
  rationale: Bezeichnet das Niederreißen oder Zerstören eines Bauwerks und ist zugleich anschaulich und gegenwartsnah.
- source_word: וַיִּשְׂרֹף אֶת־הַבָּמָה
  choice: Er verbrannte das Höhenheiligtum
  rationale: Die ungewöhnliche Aussage des Hebräischen wird nicht geglättet. Die Wiederholung von „Höhenheiligtum“ wahrt die lexikalische Entsprechung.
- source_word: הֵדַק לְעָפָר
  choice: zermalmte es zu Staub
  rationale: Gibt sowohl das Pulverisieren als auch das Ergebnis לְעָפָר prägnant wieder; das im Hebräischen unausgesprochene Objekt wird im Deutschen durch „es“ aufgenommen.
- source_word: אֲשֵׁרָה
  choice: die Aschera
  rationale: Die Transliteration bewahrt die mögliche Bezugnahme auf Aschera beziehungsweise auf das mit ihrem Kult verbundene Kultobjekt, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
theological_decisions:
- issue: Bezug von אֲשֵׁרָה
  choice: die Aschera
  alternative: das Aschera-Kultobjekt / der Aschera-Pfahl
  rationale: Im Zusammenhang des Verbrennens ist wahrscheinlich ein hölzernes Kultobjekt gemeint. Der hebräische Ausdruck kann jedoch auch den Namen der Göttin tragen; deshalb bleibt die Hauptübersetzung bewusst offen und die sachlich wahrscheinlichere Konkretisierung steht in der Fußnote.
- issue: Kausative Aussage über Jerobeam
  choice: durch das er Israel zur Sünde verleitete
  alternative: der Israel zur Sünde verleitete
  rationale: Der hebräische Relativsatz beschreibt Jerobeam als den, der Israel sündigen ließ. Die deutsche Formulierung bewahrt seine ursächliche Verantwortung und verbindet sie im Satzfluss mit dem von ihm errichteten Heiligtum, ohne die Aussage abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche erhalten die verschachtelte appositionelle Struktur des Hebräischen, während „ja, diesen“ dessen emphatische Wiederaufnahme hörbar macht. Fachbegriffe werden nur dort verwendet, wo sie den kultischen Sinn präzise und allgemein verständlich wiedergeben.
