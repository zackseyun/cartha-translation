source:
  edition: WLC
  text: וַ/יַּאַסְרֵ/הוּ֩ פַרְעֹ֨ה נְכֹ֤ה בְ/רִבְלָה֙ בְּ/אֶ֣רֶץ חֲמָ֔ת ב/מלך בִּ/ירוּשָׁלִָ֑ם וַ/יִּתֶּן עֹ֨נֶשׁ֙ עַל הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: de
  text: Pharao Necho nahm ihn in Ribla im Land Hamat gefangen[a] und hinderte ihn daran, in Jerusalem zu regieren[b]. Dann legte er dem Land eine Abgabe[c] von hundert Talenten Silber und einem Talent Gold auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fesselte ihn; oder: setzte ihn fest.'
    reason: lexical_alternative
  - marker: b
    text: Die knappe hebräische Wendung kann auch mit „sodass er nicht in Jerusalem regierte“, „vom Regieren in Jerusalem“ oder zeitlich mit „als er in Jerusalem regierte“ wiedergegeben werden.
    reason: alternative_reading
  - marker: c
    text: 'Oder: eine Strafe; oder: eine Geldbuße.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: nahm ihn ... gefangen
  rationale: אסר bezeichnet das Binden oder Gefangensetzen. Im königlich-politischen Zusammenhang gibt „nahm ihn gefangen“ die praktische Bedeutung natürlich wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: פַרְעֹה נְכֹה
  choice: Pharao Necho
  rationale: Titel und Eigenname werden in ihrer im Deutschen üblichen Form wiedergegeben.
- source_word: בְרִבְלָה
  choice: in Ribla
  rationale: Die Ortsangabe wird mit der im Deutschen üblichen Namensform und einer natürlichen lokalen Präposition wiedergegeben.
- source_word: בְּאֶרֶץ חֲמָת
  choice: im Land Hamat
  rationale: אֶרֶץ bezeichnet hier das Gebiet von Hamat; „Land Hamat“ ist knapp, verständlich und traditionsgemäß.
- source_word: במלך בִּירוּשָׁלָם
  choice: und hinderte ihn daran, in Jerusalem zu regieren
  rationale: Die Infinitivkonstruktion wird im Erzählzusammenhang am besten als Verhinderung des weiteren Regierens verstanden. Da die knappe hebräische Form auch anders gefasst werden kann, hält eine Fußnote die sprachliche Mehrdeutigkeit offen.
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: Dann legte er ... eine Abgabe ... auf
  rationale: עֹנֶשׁ kann Strafe, Geldbuße oder eine auferlegte Zahlung bezeichnen. Die festgesetzten Mengen an Edelmetall und der politische Kontext sprechen für „Abgabe“, ohne den Strafcharakter auszuschließen.
- source_word: עַל הָאָרֶץ
  choice: dem Land
  rationale: Gemeint ist Juda als das mit der Zahlung belastete Land; die Formulierung bleibt nahe am Hebräischen.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: hundert Talenten Silber
  rationale: כִּכָּר ist ein antikes Gewichtsmaß und wird traditionsgemäß mit „Talent“ wiedergegeben, statt eine unsichere moderne Umrechnung in den Text einzutragen.
- source_word: וְכִכַּר זָהָב
  choice: einem Talent Gold
  rationale: Der Singular und das antike Gewichtsmaß werden bewahrt.
