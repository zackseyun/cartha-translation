  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: de
  text: 'Da stellte sich der König an die Säule und schloss vor Yahweh den Bund: Er wollte Yahweh nachfolgen und seine Gebote, seine Zeugnisse und seine Satzungen von ganzem Herzen und mit ganzer Seele halten und die Worte dieses Bundes erfüllen, die in diesem Buch[a] niedergeschrieben waren. Und das ganze Volk trat in den Bund ein[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dieser Schriftrolle“. Das hebräische Wort kann ein Buch, eine Schrift beziehungsweise Urkunde oder eine Schriftrolle bezeichnen.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Und das ganze Volk stand im Bund.“ Die Wendung bezeichnet hier seine Zustimmung und Verpflichtung auf den Bund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: stellte sich ... an die Säule
  rationale: עָמַד bezeichnet das Stehen beziehungsweise Sich-Hinstellen; עַל kann hier die Position an oder bei der für den König vorgesehenen Säule bezeichnen. Die deutsche Formulierung vermeidet die unwahrscheinliche Vorstellung, der König habe auf der Säule gestanden.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: schloss ... den Bund
  rationale: כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes. „Einen Bund schneiden“ wäre formal näher, im heutigen Deutsch jedoch missverständlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: לִפְנֵי bedeutet hier „vor“ beziehungsweise „in der Gegenwart von“ und trägt zum feierlichen Charakter des Bundesschlusses bei.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: Yahweh nachfolgen
  rationale: Die wörtliche Wendung „hinter Yahweh hergehen“ bezeichnet loyale Nachfolge. „Nachfolgen“ bewahrt das Bewegungsbild in natürlichem modernem Deutsch.
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: seine Gebote, seine Zeugnisse und seine Satzungen
  rationale: Die drei unterschiedlichen Begriffe für verbindliche Weisungen werden auch im Deutschen unterschieden. „Zeugnisse“ ist weniger alltäglich, bewahrt aber die eigenständige Rechts- und Bundeskategorie von עֵדוֹת.
- source_word: בְּכָל־לֵב וּבְכָל־נֶפֶשׁ
  choice: von ganzem Herzen und mit ganzer Seele
  rationale: Die vertraute Bundesformel bleibt erhalten; sie bezeichnet die ungeteilte innere und persönliche Hingabe.
- source_word: לְהָקִים אֶת דִּבְרֵי הַבְּרִית
  choice: die Worte dieses Bundes erfüllen
  rationale: הקים bedeutet in diesem Zusammenhang, die niedergeschriebenen Bundesworte wirksam zu machen beziehungsweise auszuführen. „Erfüllen“ verbindet Texttreue mit natürlichem Deutsch.
- source_word: הַסֵּפֶר
  choice: Buch
  rationale: סֵפֶר kann ein Buch, eine Schrift oder eine Schriftrolle bezeichnen. „Buch“ ist im Haupttext verständlich; die historische Form bleibt in der Fußnote sichtbar.
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: das ganze Volk trat in den Bund ein
  rationale: Die wörtliche Formulierung „stand im Bund“ ist im Deutschen dunkel. Die gewählte Wiedergabe drückt die gemeinsame Annahme und Bekräftigung des Bundes aus, während die Fußnote den hebräischen Wortlaut erkennen lässt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Bundesnamen. „Yahweh“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen königlichem Bundesschluss und Zustimmung des Volkes
  choice: Der König schließt den Bund; das ganze Volk tritt in ihn ein.
  alternative: Der König schließt allein einen Bund, während das Volk lediglich dabeisteht.
  rationale: Die Schlussformel בַּבְּרִית beschreibt das Volk in bewusster Beziehung zum Bund. Die Übersetzung macht seine gemeinschaftliche Verpflichtung deutlich, ohne die genaue idiomatische Nuance als völlig eindeutig auszugeben.
- issue: Reichweite der Verpflichtung
  choice: Er wollte nachfolgen, halten und erfüllen.
  alternative: Der Bund selbst gebietet abstrakt diese Handlungen, ohne den König als handelndes Subjekt hervorzuheben.
  rationale: Die Infinitive schließen an den Bundesschluss des Königs an und beschreiben seine Verpflichtung. Die Formulierung wahrt zugleich den programmatischen Charakter der Bundesbestimmungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Bundessprache bleibt durch „Bund“, „Gebote“, „Zeugnisse“ und „Satzungen“ erkennbar; schwer verständliche hebräische Idiome werden behutsam idiomatisch wiedergegeben und, wo inhaltlich bedeutsam, in Fußnoten dokumentiert.
