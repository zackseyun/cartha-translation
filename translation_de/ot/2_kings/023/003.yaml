  terminology: „Yahweh“ entspricht dem hebräischen Gottesnamen. „Bund“, „Gebote“, „Zeugnisse“ und „Satzungen“ bewahren die bewusst differenzierte Rechtsterminologie und den biblisch-feierlichen Registerton. Die Fußnote zu „Buch“ erläutert סֵפֶר treffend; die zweite Fußnote erläutert die idiomatische Schlussformel, ohne eine umstrittene Nuance als zwingend auszugeben.
