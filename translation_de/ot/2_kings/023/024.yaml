  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: de
  text: Auch die Totenbeschwörer und Wahrsager, die Hausgötter, die Götzen und alle abscheulichen Dinge, die im Land Juda und in Jerusalem zu sehen waren, beseitigte Josia, um die Worte der Weisung in Kraft zu setzen, die in dem Buch[a] geschrieben standen, das der Priester Hilkija im Haus Jahwes gefunden hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Schriftrolle“. Das hebräische Wort bezeichnet ein Schriftstück, das gewöhnlich die Form einer Rolle hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Bewahrt die anknüpfende und hinzufügende Funktion im Zusammenhang mit den vorausgehenden Reformmaßnahmen.
- source_word: הָאֹבוֹת
  choice: die Totenbeschwörer
  rationale: Im Kontext bezeichnet der Ausdruck Personen, die zur Befragung der Toten beziehungsweise Totengeister herangezogen wurden; die Wiedergabe ist im heutigen Deutsch verständlich.
- source_word: הַיִּדְּעֹנִים
  choice: die Wahrsager
  rationale: Der Ausdruck steht häufig neben אֹבוֹת und bezeichnet okkulte Auskunftspersonen. „Wahrsager“ ist natürliches Deutsch, ohne die genaue Art ihrer Praxis stärker festzulegen, als der Kontext erlaubt.
- source_word: הַתְּרָפִים
  choice: die Hausgötter
  rationale: Bezeichnet wahrscheinlich häusliche Kultbilder oder Hausgottheiten; die funktionale Wiedergabe ist verständlicher als eine Transliteration.
- source_word: הַגִּלֻּלִים
  choice: die Götzen
  rationale: Gibt den abwertenden Ausdruck für Kultbilder idiomatisch wieder, auch wenn dessen derbe verächtliche Färbung im Deutschen nicht vollständig abgebildet wird.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: alle abscheulichen Dinge
  rationale: Bewahrt die breite moralisch-kultische Wertung, ohne den Ausdruck unzulässig auf Götzenbilder zu verengen.
- source_word: נִרְאוּ
  choice: zu sehen waren
  rationale: Entspricht der passiven Bedeutung und bezeichnet, dass diese Dinge in Juda und Jerusalem sichtbar beziehungsweise vorhanden waren.
- source_word: בִּעֵר
  choice: beseitigte
  rationale: Der Ausdruck kann Ausrotten, Wegschaffen oder Wegbrennen bezeichnen. Da Menschen und Gegenstände gemeinsam aufgezählt werden, vermeidet „beseitigte“ eine unberechtigte Festlegung auf eine einzige Methode.
- source_word: לְמַעַן הָקִים
  choice: So setzte er … in Kraft
  rationale: Gibt den Zweck beziehungsweise das Ziel wieder, die Weisung verbindlich zur Geltung zu bringen; „erfüllen“ könnte hier missverständlich prophetisch klingen.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: die Worte der Weisung
  rationale: תּוֹרָה bezeichnet hier die im gefundenen Dokument enthaltene verbindliche göttliche Unterweisung. „Weisung“ bewahrt den weiteren Sinn gegenüber dem engeren deutschen Wort „Gesetz“.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: die in dem Buch geschrieben standen
  rationale: Natürliches Deutsch für den hebräischen Ausdruck; die mögliche konkrete Bedeutung „Schriftrolle“ wird in einer Fußnote erhalten.
- source_word: בֵּית יְהוָה
  choice: im Haus Jahwes
  rationale: Bewahrt die wörtliche Bezeichnung „Haus“ und gibt den Eigennamen יהוה als Jahwe wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bildet ihn im Deutschen transparent ab; „der HERR“ wäre die traditionelle ersetzende Lesung.
- issue: Bedeutung von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ wahrt die inhaltliche Breite des hebräischen Begriffs, während der Kontext zugleich seine verbindliche, gesetzliche Funktion erkennen lässt.
- issue: Ziel der Reform in לְמַעַן הָקִים
  choice: die Worte … in Kraft setzen
  alternative: die Worte … erfüllen
  rationale: Die Formulierung betont die praktische Durchsetzung und Geltung der geschriebenen Weisung, ohne einen möglichen Anklang an prophetische Erfüllung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt klar und rhythmisch; „abscheuliche Dinge“ wahrt die Breite des Originals. Der zweite Satz vermeidet eine schwerfällige finale Konstruktion und macht den Zweckzusammenhang dennoch deutlich.
