base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: de
  text: Jojakim war fünfundzwanzig Jahre alt, als er König wurde,[a] und regierte elf Jahre in Jerusalem. Seine Mutter hieß Sebida[b], eine Tochter Pedajas aus Ruma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jojakim war ein Sohn von fünfundzwanzig Jahren bei seinem Königwerden.“'
    reason: lexical_alternative
  - marker: b
    text: Der Name wird auch „Sebuda“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: war fünfundzwanzig Jahre alt
  rationale: Die geläufige hebräische Altersangabe wird in natürlichem modernem Deutsch idiomatisch wiedergegeben.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die mit ב eingeleitete Form bezeichnet hier den Zeitpunkt des Regierungsantritts; diese Wiedergabe ist präzise und natürlich.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet die Ausübung der Königsherrschaft und wird im Deutschen im Kontext einer Regierungsdauer am natürlichsten mit „regieren“ wiedergegeben.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Ortsangabe bezeichnet den Sitz seiner Herrschaft.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Die feste genealogische Formel wird knapp und idiomatisch wiedergegeben.
- source_word: זבידה
  choice: Sebida
  rationale: Der Personenname wird nach geläufigen deutschen Bibelnamenskonventionen transliteriert; die hebräische Konsonantenfolge stützt Sebida.
- source_word: בַת פְּדָיָה
  choice: eine Tochter Pedajas
  rationale: Die Abstammungsangabe wird direkt wiedergegeben; die eingedeutschte Genitivform ist natürlich.
- source_word: מִן רוּמָה
  choice: aus Ruma
  rationale: מִן bezeichnet hier am ehesten Herkunft oder Heimatort; „aus“ ist dafür die klare deutsche Entsprechung.
