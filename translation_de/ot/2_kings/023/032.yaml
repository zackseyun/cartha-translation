source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/032.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: de
  text: Und er tat, was in den Augen Jahwes böse war, ganz wie seine Väter[a] es getan hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »seine Väter«; gemeint sein können seine Vorfahren oder seine Vorgänger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Und er tat, was … böse war
  rationale: Die etablierte hebräische Wendung wird im Deutschen idiomatisch als »tun, was böse war« wiedergegeben; das einleitende וַ führt die Erzählung fort.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Bewahrt die verständliche hebräische Bewertungsmetapher.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen; »Jahwe« ist die im Deutschen übliche Form.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz wie
  rationale: Gibt den vergleichenden und umfassenden Sinn natürlich wieder, ohne das Deutsche durch ein wörtliches »gemäß allem, was« zu belasten.
- source_word: עָשׂוּ
  choice: es getan hatten
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass das Handeln der Väter dem Handeln des Königs vorausging.
- source_word: אֲבֹתָיו
  choice: seine Väter
  rationale: Bewahrt die konkrete Ausdrucksweise des Hebräischen; eine Fußnote erläutert die mögliche weitere Bedeutung im königlichen Zusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration bewahrt ihn als Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Bezugsbereich von אֲבֹתָיו
  choice: seine Väter
  alternative: seine Vorfahren oder Vorgänger
  rationale: Die Übersetzung wahrt die wörtliche Form und lässt offen, ob im königlichen Kontext besonders leibliche Vorfahren, frühere Könige oder beide Gruppen gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache »in den Augen« bleibt erhalten; die Satzführung ist zugleich natürlich und gut verständlich.
