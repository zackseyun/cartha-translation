source:
  edition: WLC
  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: de
  text: Er schlachtete alle Priester der Höhen, die dort waren, auf den Altären[a] und verbrannte Menschenknochen darauf. Dann kehrte er nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er opferte alle Priester der Höhen.“ Das hebräische Verb kann eine Opferhandlung bezeichnen; hier hebt es wahrscheinlich das gewaltsame Schlachten im Zuge der Beseitigung unerlaubter Kultstätten hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Er schlachtete
  rationale: זבח kann sowohl „schlachten“ als auch „opfern“ bedeuten. „Schlachtete“ bewahrt hier die gewaltsame und kultisch gefärbte Handlung, ohne sie ausdrücklich als rechtmäßiges Opfer darzustellen.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: die Priester der Höhen
  rationale: „Höhen“ ist die etablierte, sachlich passende Bezeichnung für die lokalen Kultstätten, die im Königebuch als unerlaubte Gottesdienstorte erscheinen.
- source_word: אֲשֶׁר שָׁם
  choice: die dort waren
  rationale: Die knappe Relativkonstruktion gibt die Ortsangabe des Hebräischen natürlich wieder.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: auf den Altären
  rationale: עַל bezeichnet hier unmittelbar die Altäre als Ort der Tötung; die folgende Verbrennung der Knochen auf ihnen unterstreicht die Entweihung.
- source_word: עַצְמוֹת אָדָם
  choice: Menschenknochen
  rationale: אָדָם bezeichnet hier Menschen allgemein, nicht eigens Männer. „Menschenknochen“ ist präzise und idiomatisch.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: Dann kehrte er nach Jerusalem zurück
  rationale: „Dann“ gibt die fortschreitende Erzählfolge des Waw-Konsekutivs in natürlichem Deutsch wieder.
theological_decisions:
- issue: Möglicher Opferklang von וַיִּזְבַּח bei der Tötung der Höhenpriester
  choice: „schlachtete“ im Haupttext
  alternative: „opferte“
  rationale: Das Verb kann eine Opferhandlung bezeichnen. „Opferte“ könnte hier jedoch stärker als im Hebräischen den Eindruck eines rechtmäßigen Opfers für den HERRN erwecken. „Schlachtete“ erhält sowohl die Härte als auch einen möglichen kultischen Unterton; die Fußnote weist die echte lexikalische Alternative aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Erzählstruktur. „Priester der Höhen“ wahrt den historischen Kultbegriff; die Gewalt des Textes wird weder abgeschwächt noch zusätzlich gedeutet.
