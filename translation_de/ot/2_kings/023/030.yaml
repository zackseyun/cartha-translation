  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: de
  text: Seine Diener brachten ihn tot aus Megiddo[a] nach Jerusalem und begruben ihn in seinem Grab. Dann nahm das Volk des Landes[b] Joahas, den Sohn Josias, salbte ihn und machte ihn anstelle seines Vaters zum König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ließen ihn fahren“; gemeint ist hier, dass sie den Leichnam Josias transportierten.'
    reason: lexical_alternative
  - marker: b
    text: „Das Volk des Landes“ ist eine feste hebräische Bezeichnung für die einheimische Bevölkerung, die hier als politisch handelnde Gruppe auftritt.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: brachten ihn
  rationale: Der Hifil von רכב bedeutet wörtlich „ihn fahren/reiten lassen“. Im Zusammenhang mit מֵת bezeichnet er den Transport des Leichnams; „brachten ihn“ ist natürlich und wird durch die Fußnote näher erläutert.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד kann Diener, Gefolgsleute oder königliche Beamte bezeichnen. „Diener“ wahrt die direkte Bedeutung, ohne die Funktion genauer festzulegen.
- source_word: מֵת
  choice: tot
  rationale: Das Wort bezeichnet Josias Zustand beim Transport und macht deutlich, dass sein Leichnam aus Megiddo zurückgebracht wurde.
- source_word: וַיְבִאֻהוּ יְרוּשָׁלַם
  choice: nach Jerusalem
  rationale: בוא mit Zielangabe wird im Deutschen idiomatisch als „nach Jerusalem bringen“ wiedergegeben.
- source_word: בִּקְבֻרָתוֹ
  choice: in seinem Grab
  rationale: קְבֻרָה bezeichnet hier seine Grabstätte. „Grab“ ist im modernen Deutsch klar und würdig.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die formelhafte Wiedergabe bewahrt den sozialpolitischen Ausdruck, ohne ihn vorschnell als „einfaches Volk“ oder als eine bestimmte Institution zu deuten.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Die Grundbedeutung von לקח wird bewahrt; im Kontext leitet das Nehmen die Einsetzung Joahas’ ein.
- source_word: יְהוֹאָחָז
  choice: Joahas
  rationale: Verwendet die im deutschen Bibelgebrauch etablierte Namensform.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: den Sohn Josias
  rationale: Natürliche deutsche Wiedergabe der Abstammungsangabe.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: salbte ihn zum König
  rationale: משׁח bezeichnet ausdrücklich die Salbung. Der Zusatz „zum König“ macht im Deutschen die durch den Kontext bestimmte Funktion der Salbung deutlich.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: machte ihn anstelle seines Vaters zum König
  rationale: Die kausative Form von מלך bezeichnet die Königseinsetzung; תַּחַת אָבִיו bedeutet, dass er die Stellung seines Vaters übernahm.
theological_decisions:
- issue: Königliche Salbung
  choice: salbte ihn zum König
  alternative: setzte ihn ein
  rationale: Der hebräische Text nennt ausdrücklich die Salbung und anschließend die Erhebung zum König. Die zeremonielle und politische Bedeutung wird daher nicht auf eine allgemeine Einsetzung reduziert.
- issue: Identität des „Volkes des Landes“
  choice: das Volk des Landes
  alternative: die Bevölkerung des Landes / das einfache Volk
  rationale: Der Ausdruck kann eine politisch handelnde Bevölkerungsgruppe bezeichnen, legt ihre genaue gesellschaftliche Zusammensetzung aber nicht eindeutig fest. Die formnahe Wiedergabe bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt dem hebräischen Erzählstil, wird aber durch natürliche deutsche Syntax geglättet. Der formelhafte Ausdruck „Volk des Landes“ bleibt erhalten; die königliche Salbung wird ausdrücklich wiedergegeben.
