  naturalness: Der Text ist im Wesentlichen modernes, verständliches Standarddeutsch. Mit der getrennten Wiedergabe von Salbung und Königseinsetzung liest der zweite Satz klarer und vermeidet die doppelte Königstitulierung.
  terminology: „Diener“, „Volk des Landes“, „Joahas“, „Josias“ und „salbte“ sind sachgerecht. „Volk des Landes“ erhält die formelhafte und sozialgeschichtlich offene hebräische Bezeichnung. Die Fußnotenanker müssen an den jeweiligen Bezugsstellen stehen.
