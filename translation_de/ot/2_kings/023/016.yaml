  to: Dann wandte sich Josia um und sah die Gräber, die dort auf dem Berg waren.[a] Er ließ die Gebeine aus den Gräbern holen und verbrannte sie auf dem Altar. So machte er ihn unrein, gemäß dem Wort Jahwes, das der Mann Gottes verkündet hatte, der diese Dinge verkündet hatte.[b]
