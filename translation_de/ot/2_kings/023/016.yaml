source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: de
  text: Dann wandte sich Josia um und sah die Gräber, die dort auf dem Berg waren.[a] Er ließ die Gebeine aus den Gräbern holen und verbrannte sie auf dem Altar. So machte er ihn unrein, gemäß dem Wort Jahwes, das der Mann Gottes verkündet hatte, der diese Dinge verkündet hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Anhöhe“. Das hebräische Wort kann je nach Gelände einen Berg oder eine Anhöhe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ausgerufen hatte“. Das hebräische Verb kann ein lautes, öffentliches Ausrufen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: wandte sich um
  rationale: פנה bezeichnet hier Josias körperliche Wendung, auf die sein Sehen folgt.
- source_word: הַקְּבָרִים
  choice: die Gräber
  rationale: קבר kann Grab oder Grabstätte bezeichnen; „Gräber“ ist natürlich und legt keine besondere Bauform fest.
- source_word: בָּהָר
  choice: am Berg
  rationale: הר kann je nach Gelände Berg oder Anhöhe bedeuten; „am Berg“ bewahrt die topografische Angabe und ist im Deutschen idiomatisch.
- source_word: הָעֲצָמוֹת
  choice: die Gebeine
  rationale: עצמות meint konkret menschliche Knochen; „Gebeine“ ist in diesem Bestattungskontext würdig und präzise.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: verbrannte sie auf dem Altar
  rationale: Das direkte Objekt sind die Gebeine; על bezeichnet hier den Ort des Verbrennens auf dem Altar.
- source_word: וַיְטַמְּאֵהוּ
  choice: So machte er ihn unrein
  rationale: טמא bezeichnet kultische Verunreinigung; das Suffix bezieht sich am natürlichsten auf den unmittelbar zuvor genannten Altar.
- source_word: כִּדְבַר יְהוָה
  choice: gemäß dem Wort Jahwes
  rationale: Die Formel kennzeichnet die Handlung als Erfüllung eines zuvor ergangenen göttlichen Wortes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen deutschen Schriftbild als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feste hebräische Bezeichnung wird wörtlich und ohne erklärende Einengung auf „Prophet“ übertragen.
- source_word: קָרָא
  choice: ausgerufen / angekündigt
  rationale: קרא kann rufen, ausrufen oder öffentlich verkünden bedeuten. Die beiden unterschiedlichen deutschen Verben vermeiden eine schwerfällige Wiederholung, ohne den Sinnunterschied zu vergrößern.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Dinge
  rationale: דברים kann Worte, Angelegenheiten oder Geschehnisse bezeichnen; hier verweist es auf den Inhalt der vorausgegangenen Ankündigung.
theological_decisions:
- issue: Erfüllungsformel und prophetische Vermittlung
  choice: Josias Handlung geschieht „gemäß dem Wort Jahwes“, das durch den Mann Gottes öffentlich ausgerufen wurde.
  alternative: „gemäß dem Wort Jahwes, das der Mann Gottes verkündet hatte“ oder eine andere Anbindung des Relativsatzes
  rationale: Die Übersetzung wahrt die Verbindung zwischen dem göttlichen Wort und seiner Vermittlung durch den Mann Gottes, ohne zusätzliche Deutung einzutragen.
- issue: Bezug des Objektsuffixes in וַיְטַמְּאֵהוּ
  choice: „ihn“ bezieht sich auf den Altar.
  alternative: Ein weniger bestimmter Bezug auf den Kultort
  rationale: Der Altar ist der nächste grammatisch passende Bezug und seine Verunreinigung ist das Ziel der Verbrennung menschlicher Gebeine.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt die Unterscheidung zwischen dem Gottesnamen und einem Titel.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Gebeine“ wahrt den konkreten Bezug auf menschliche Knochen, ohne unnötig nüchtern zu klingen. Die parataktische hebräische Folge wird moderat geglättet; die Erfüllungsformel und die wiederholte prophetische Verkündigung bleiben erhalten.
