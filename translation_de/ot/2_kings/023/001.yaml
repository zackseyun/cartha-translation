lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte aus
  rationale: Das Verb שׁלח bezeichnet hier das Aussenden, wahrscheinlich von Boten oder einer Aufforderung. „Sandte aus“ wahrt den fehlenden ausdrücklichen Gegenstand; „ließ rufen“ wäre im Deutschen natürlicher, aber deutender.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird entsprechend dem Hebräischen wiedergegeben; Josias Name wird nicht ergänzt.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: versammelten sich bei ihm
  rationale: Die aktive Pluralform wird als reflexive Versammlung der Ältesten wiedergegeben. אֵלָיו bezeichnet die Bewegung beziehungsweise Zusammenkunft zu ihm hin; idiomatisches Deutsch verwendet hier „bei ihm“.
- source_word: כָּל זִקְנֵי
  choice: alle Ältesten
  rationale: כָּל betont die Gesamtheit; זִקְנֵי bezeichnet in diesem politischen Zusammenhang anerkannte Älteste beziehungsweise führende Vertreter, nicht bloß alte Männer.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: von Juda und Jerusalem
  rationale: Die Eigennamen werden in ihrer üblichen deutschen Form wiedergegeben; „von“ macht die Zugehörigkeit der Ältesten zu Juda und Jerusalem natürlich verständlich.
