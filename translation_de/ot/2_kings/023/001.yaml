  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: de
  text: Da ließ der König alle Ältesten von Juda und Jerusalem zu sich versammeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapper: „Da sandte der König aus, und alle Ältesten von Juda und Jerusalem wurden zu ihm versammelt.“'
