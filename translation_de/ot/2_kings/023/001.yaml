  verdict: revise
  source_fidelity: Der Entwurf gibt König, die Gesamtheit der Ältesten sowie Juda und Jerusalem zutreffend wieder. „sandte aus“ bleibt jedoch im Deutschen ohne Objekt auffällig und kann eher das Entsenden von Personen als eine Einberufung bezeichnen. Die hebräische Formulierung verbindet das Aussenden des Königs mit dem Zusammenkommen der Ältesten; eine deutsche kausative Formulierung gibt diesen Zusammenhang idiomatisch wieder.
  naturalness: „Da sandte der König aus“ ist im modernen Standarddeutsch ohne genanntes Objekt unvollständig bzw. missverständlich. „ließ ... zu sich versammeln“ ist flüssig, würdevoll und dem erzählten Vorgang angemessen.
  terminology: „König“, „Älteste“, „Juda“ und „Jerusalem“ sind korrekt und registergerecht. „zu sich“ bildet אֵלָיו präziser ab als das eher statische „bei ihm“.
  issues:
  - severity: medium
    issue: Die Wendung „sandte der König aus“ hat kein explizites oder im Deutschen problemlos erschließbares Objekt.
    rationale: Das Hebräische kann שׁלח hier absolut verwenden; im Deutschen wirkt „aussenden“ gewöhnlich transitiv und verschiebt ohne Objekt den Sinn. Die Fußnote kann die wörtlichere, elliptische Ausdrucksweise kenntlich machen, während der Haupttext die implizite Einberufung idiomatisch formuliert.
  - severity: low
    issue: „bei ihm“ schwächt die Zielrichtung von אֵלָיו ab.
    rationale: „Zu sich“ drückt die Bewegung beziehungsweise Einberufung zum König hin natürlicher und genauer aus.
