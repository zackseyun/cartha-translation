  text: וְ/כָמֹ/הוּ֩ לֹֽא הָיָ֨ה לְ/פָנָ֜י/ו מֶ֗לֶךְ אֲשֶׁר שָׁ֤ב אֶל יְהוָה֙ בְּ/כָל לְבָב֤/וֹ וּ/בְ/כָל נַפְשׁ/וֹ֙ וּ/בְ/כָל מְאֹד֔/וֹ כְּ/כֹ֖ל תּוֹרַ֣ת מֹשֶׁ֑ה וְ/אַחֲרָ֖י/ו לֹֽא קָ֥ם כָּמֹֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: de
  text: Vor ihm hatte es keinen König wie ihn gegeben, der mit ganzem Herzen, mit ganzer Seele und mit ganzer Kraft[a][c] zu Jahwe umkehrte[b], ganz nach dem Gesetz des Mose. Nach ihm erhob sich keiner wie er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier ein Ausdruck, der „mit seiner ganzen Kraft“, aber auch „mit seinem ganzen Vermögen“ beziehungsweise „mit allem, was ihm zur Verfügung stand“ bedeuten kann.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sich Jahwe zuwandte“ beziehungsweise „zu Jahwe zurückkehrte“. Das hebräische Verb kann Umkehr in Reue und erneuerte Bundestreue bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung „mit ganzem Herzen, mit ganzer Seele und mit ganzer Kraft“ greift 5. Mose 6,5 auf.
    reason: cross_reference
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: Vor ihm hatte es keinen König wie ihn gegeben
  rationale: Gibt die vorangestellte Vergleichsformel und den zeitlichen Sinn von לְפָנָיו in natürlichem Deutsch wieder.
- source_word: שָׁב אֶל יְהוָה
  choice: zu Jahwe umkehrte
  rationale: שׁוּב אֶל bezeichnet die Hin- beziehungsweise Rückwendung zu Gott in Reue und Bundestreue; „umkehren“ bewahrt diese Bedeutungsbreite.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben, in der im Deutschen üblichen Form „Jahwe“.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: mit ganzem Herzen, mit ganzer Seele und mit ganzer Kraft
  rationale: Bewahrt die dreigliedrige deuteronomische Formel; „Kraft“ gibt מְאֹד hier idiomatisch als gesamte Tatkraft beziehungsweise Fähigkeit wieder.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: ganz nach dem Gesetz des Mose
  rationale: תּוֹרָה kann „Weisung“ heißen, bezeichnet hier aber im königlichen Bewertungszusammenhang das mosaische Gesetz; „ganz nach“ gibt כְּכֹל knapp und natürlich wieder.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: Auch nach ihm trat keiner auf wie er
  rationale: קָם meint hier das Auftreten eines späteren vergleichbaren Königs; die Formulierung ist idiomatisch und erhält den absoluten Vergleich.
theological_decisions:
- issue: Anklang an 5. Mose 6,5
  choice: Die Dreiheit „Herz … Seele … Kraft“ bleibt im Haupttext erhalten.
  alternative: „Herz … Leben … Vermögen“ oder eine zusammenfassende Umschreibung
  rationale: Die erkennbare Bundesformel soll hörbar bleiben, ohne die anthropologischen Begriffe dogmatisch zu verengen.
- issue: Bedeutung von שָׁב אֶל יְהוָה
  choice: „zu Jahwe umkehrte“
  alternative: „sich Jahwe zuwandte“ oder „zu Jahwe zurückkehrte“
  rationale: „Umkehrte“ trägt sowohl die konkrete Rückwendung als auch den Beiklang von Reue und erneuerter Bundestreue, ohne nur einen dieser Aspekte festzuschreiben.
- issue: Gottesname יְהוָה
  choice: „Jahwe“
  alternative: „der HERR“
  rationale: Der hebräische Text enthält den Eigennamen; seine Wiedergabe als „Jahwe“ bewahrt diesen Unterschied gegenüber einem Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Hervorhebung, wird aber für flüssiges Deutsch geordnet. „Jahwe“ gibt den Gottesnamen wieder; „umkehren“ und die Fußnote bewahren die echte lexikalische Spannweite.
