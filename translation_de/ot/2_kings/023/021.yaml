source:
  edition: WLC
  text: וַ/יְצַ֤ו הַ/מֶּ֨לֶךְ֙ אֶת כָּל הָ/עָ֣ם לֵ/אמֹ֔ר עֲשׂ֣וּ פֶ֔סַח לַֽ/יהוָ֖ה אֱלֹֽהֵי/כֶ֑ם כַּ/כָּת֕וּב עַ֛ל סֵ֥פֶר הַ/בְּרִ֖ית הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: de
  text: 'Darauf befahl der König dem ganzen Volk: „Feiert das Passah[a] für Jahwe, euren Gott, wie es in diesem Buch des Bundes geschrieben steht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Macht/tut Passah.“ Gemeint ist: „Begeht“ oder „haltet das Passah.“'
    reason: Die hebräische Wendung עשׂה פסח ist idiomatisch und lässt sich im Deutschen sowohl mit „das Passah feiern“ als auch mit „das Passah halten/begehen“ wiedergeben.
lexical_decisions:
- source_word: וַיְצַו
  choice: Darauf befahl
  rationale: Das Verb צוה bezeichnet das Erteilen eines Befehls. „Darauf“ gibt die fortschreitende Erzählung durch וַ־ im Deutschen natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck bezieht sich im Kontext auf König Josia.
- source_word: אֶת כָּל הָעָם
  choice: dem ganzen Volk
  rationale: עם bezeichnet hier die Bevölkerung als Gesamtheit; nach „befehlen“ verlangt das Deutsche den Dativ.
- source_word: עֲשׂוּ פֶסַח
  choice: Feiert das Passah
  rationale: Wörtlich steht „macht/tut Passah“; gemeint ist die Begehung des Passahfestes. „Feiert“ ist im modernen Deutsch klar und idiomatisch.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet hier Ausrichtung beziehungsweise Widmung. „Für Jahwe“ bewahrt diese Beziehung, ohne sie stärker als „zu Ehren“ auszudeuten.
- source_word: אֱלֹהֵיכֶם
  choice: euren Gott
  rationale: Die Anrede in der zweiten Person Plural wird ausdrücklich bewahrt und unterstreicht die Bundesbeziehung.
- source_word: כַּכָּתוּב
  choice: wie es ... geschrieben steht
  rationale: Dies ist die natürliche deutsche Entsprechung der Formel, mit der die Übereinstimmung mit einer schriftlichen Weisung ausgedrückt wird.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: in diesem Buch des Bundes
  rationale: Bei Geschriebenem wird עַל im Deutschen idiomatisch mit „in“ wiedergegeben. Der Demonstrativbezug und die Bezeichnung des Dokuments als Bundesbuch bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder und vermeidet, ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. „Passah“ wahrt den eingebürgerten biblischen Begriff; die direkte Rede bleibt knapp und verbindlich.
