source:
  edition: WLC
  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: de
  text: Doch Jahwe wandte sich nicht ab von der Glut seines großen Zorns[a], der in Juda entbrannt war[b], wegen all der Provokationen, durch die Manasse ihn zum Zorn gereizt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische spricht wörtlich von der »Glut seines großen Zorns« und verwendet dabei ein körperhaftes Bild für heftigen Zorn.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gegen Juda«. Die hebräische Präposition lautet wörtlich »in«; sie kann hier sowohl den Bereich als auch das Ziel des entbrannten Zorns bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Markiert nach Josias Reformen den starken Gegensatz des Verses in natürlichem Deutsch.
- source_word: שָׁב ... מֵ
  choice: wandte sich nicht ab von
  rationale: Bewahrt die Bewegungsmetapher des hebräischen Verbs »umkehren/sich abwenden«, ohne sie bereits als »sich erbarmen« oder »nachgeben« auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen JHWH in seiner im Deutschen geläufigen Form wieder.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: von der Glut seines großen Zorns
  rationale: »Glut des Zorns« gibt das hebräische Körper- und Hitzeidiom verständlich wieder; הַגָּדוֹל wird attributiv auf den Zorn bezogen.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: mit der sein Zorn ... entbrannt war
  rationale: Erhält die auffällige Wiederholung von Zorn und brennender Hitze im Hebräischen.
- source_word: בִּיהוּדָה
  choice: gegen Juda
  rationale: Die Präposition bedeutet formal »in«, bezeichnet hier jedoch idiomatisch das Ziel des entbrannten Zorns; »gegen« ist im Deutschen verständlicher.
- source_word: עַל כָּל הַכְּעָסִים
  choice: wegen all der Kränkungen
  rationale: Das Substantiv bezeichnet hier Handlungen, die Zorn und Unwillen hervorrufen. »Kränkungen« ist natürliches, würdiges Deutsch und vermeidet das Fremdwort »Provokationen«.
- source_word: הִכְעִיסוֹ
  choice: durch die ... ihn zum Zorn gereizt hatte
  rationale: Gibt die kausative Bedeutung des Hifil wieder und stellt den Zusammenhang mit Gottes Zorn ausdrücklich her.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Übliche deutsche Form des Personennamens.
theological_decisions:
- issue: Anthropopathische Rede von Gottes Zorn
  choice: Die Bildsprache von der Glut und dem Entbrennen des Zorns bleibt erhalten.
  alternative: »Jahwe ließ sich von seinem großen Zorn nicht abbringen«
  rationale: Der hebräische Text verwendet ausdrücklich körperlich-konkrete Hitze- und Zornbilder. Die Übersetzung mildert sie weder zu bloßem Missfallen ab noch erklärt sie dogmatisch.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname יְהוָה wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die hebräische Wiederholung von Zorn und brennender Hitze wurde bewusst bewahrt; ungebräuchliche Wendungen wie »Zornesglut seiner Nase« wurden vermieden.
