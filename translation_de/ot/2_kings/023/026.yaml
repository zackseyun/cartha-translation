revisions:
- from: Doch Jahwe wandte sich nicht ab von der Glut seines großen Zorns[a], mit der sein Zorn gegen Juda entbrannt war[b], wegen all der Kränkungen, durch die Manasse ihn zum Zorn gereizt hatte.
  to: Doch Jahwe wandte sich nicht ab von der Glut seines großen Zorns[a], der in Juda entbrannt war[b], wegen all der Provokationen, durch die Manasse ihn zum Zorn gereizt hatte.
  rationale: Die Revision wahrt die hebräische Bildsprache und Satzstruktur, glättet den deutschen Relativsatz und gibt die Präposition בְּ in der Hauptzeile nicht stärker ausdeutend wieder. »Provokationen« stellt zudem den Zusammenhang zwischen den zornerregenden Taten und dem anschließenden »zum Zorn gereizt« klar heraus.
