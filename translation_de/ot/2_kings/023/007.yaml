  text: וַ/יִּתֹּץ֙ אֶת בָּתֵּ֣י הַ/קְּדֵשִׁ֔ים אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁ֣ר הַ/נָּשִׁ֗ים אֹרְג֥וֹת שָׁ֛ם בָּתִּ֖ים לָ/אֲשֵׁרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: de
  text: Er riss die Unterkünfte der männlichen Kultdiener[a] nieder, die sich im Haus Jahwes befanden, wo Frauen Behänge[b] für die Aschera[c] webten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Geweihten“. Gemeint sind männliche Personen in einem nichtjahwistischen Kultdienst; traditionell werden sie als männliche Kultprostituierte verstanden.
    reason: lexical_alternative
  - marker: b
    text: Oder „gewebte Hüllen“; wörtlich steht hier das ungewöhnliche Wort „Häuser“. Vermutlich sind textile Behänge, Hüllen oder zeltartige Kultgebilde gemeint.
    reason: alternative_reading
  - marker: c
    text: „Die Aschera“ kann die Göttin Aschera oder den mit ihr verbundenen Kultgegenstand bezeichnen, der oft „Aschera-Pfahl“ genannt wird.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: Er riss … nieder
  rationale: Das Verb נתץ bezeichnet das Niederreißen oder Zerstören eines Bauwerks. „Niederreißen“ gibt die konkrete Handlung natürlich und kraftvoll wieder.
- source_word: בָּתֵּי
  choice: die Unterkünfte
  rationale: בָּתֵּי bedeutet wörtlich „Häuser von“. Im Tempelbereich sind hier wahrscheinlich Räume oder Quartiere gemeint; „Unterkünfte“ ist im Deutschen verständlich, ohne eine selbstständige Häusergruppe vorauszusetzen.
- source_word: הַקְּדֵשִׁים
  choice: der männlichen Kultprostituierten
  rationale: Die maskuline Pluralform קְדֵשִׁים bezeichnet hier Männer in einem verbotenen kultischen Dienst, der traditionell mit kultischer Prostitution verbunden wird. „Männlichen“ macht die grammatisch und kontextuell naheliegende Geschlechtsangabe sichtbar; die wörtlichere und weniger festlegende Deutung wird in der Fußnote bewahrt.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: „Haus Jahwes“ bildet die hebräische Wendung transparent ab und bezeichnet hier den Tempel. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: wo die Frauen … webten
  rationale: Das Partizip beschreibt ihre dort ausgeübte Tätigkeit. Das lokale „wo“ nimmt שָׁם („dort“) idiomatisch auf und vermeidet eine schwerfällige Wiederholung.
- source_word: בָּתִּים
  choice: Behänge
  rationale: Das Wort bedeutet gewöhnlich „Häuser“, bezeichnet hier jedoch etwas, das gewebt wurde. „Behänge“ gibt eine verbreitete kontextuelle Deutung wieder, ohne Material oder genaue Gestalt näher zu bestimmen; die ungewöhnliche wörtliche Lesart bleibt in der Fußnote erhalten.
- source_word: לָאֲשֵׁרָה
  choice: für die Aschera
  rationale: Die Form kann die Göttin Aschera oder den mit ihr verbundenen Kultgegenstand bezeichnen. „Die Aschera“ lässt diese Mehrdeutigkeit im Haupttext bestehen.
theological_decisions:
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֲשֵׁרָה
  choice: die Aschera
  alternative: Aschera / der Aschera-Pfahl
  rationale: Der hebräische Ausdruck kann sowohl auf die Göttin als auch auf ihren Kultgegenstand verweisen. Der Haupttext entscheidet diese sachlich und theologisch bedeutsame Mehrdeutigkeit nicht.
- issue: Funktion der קְדֵשִׁים
  choice: männliche Kultprostituierte
  alternative: männliche Kultdiener / Geweihte
  rationale: Die traditionelle kontextuelle Deutung wird im Haupttext verwendet, doch die Bezeichnung selbst bedeutet nicht ausdrücklich „Prostituierte“. Die Fußnote macht diese lexikalische Spannung sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Erzählfluss, wird aber idiomatisch gegliedert. Fachlich umstrittene Bezeichnungen werden im Haupttext verständlich wiedergegeben und in den Fußnoten transparent offengehalten.
