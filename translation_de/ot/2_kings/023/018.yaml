source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַנִּ֣יחוּ ל֔/וֹ אִ֖ישׁ אַל יָנַ֣ע עַצְמֹתָ֑י/ו וַֽ/יְמַלְּטוּ֙ עַצְמֹתָ֔י/ו אֵ֚ת עַצְמ֣וֹת הַ/נָּבִ֔יא אֲשֶׁר בָּ֖א מִ/שֹּׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: de
  text: 'Da sagte er: »Lasst ihn in Ruhe! Niemand soll seine Gebeine bewegen.« So verschonten sie seine Gebeine[a] zusammen mit den Gebeinen des Propheten, der aus Samaria gekommen war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: So ließen sie seine Gebeine unangetastet.'
    reason: Das Verb מלט kann hier das Verschonen oder Bewahren der Gebeine bezeichnen; im Zusammenhang ist auch eine ergebnisbezogene Wiedergabe als „unangetastet lassen“ möglich.
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: Lasst ihn in Ruhe
  rationale: Die idiomatische Aufforderung verlangt, von jedem weiteren Vorgehen gegen den Toten beziehungsweise seine Gebeine abzusehen. Die deutsche Wendung ist natürlich und bewahrt den Bezug auf die Person.
- source_word: אִישׁ אַל יָנַע עַצְמֹתָיו
  choice: Niemand soll seine Gebeine bewegen
  rationale: אִישׁ hat im verneinten Verbot generische Bedeutung. „Bewegen“ gibt נוע konkret wieder, ohne die Art des Eingriffs über den hebräischen Wortlaut hinaus festzulegen.
- source_word: עַצְמֹתָיו
  choice: seine Gebeine
  rationale: Der hebräische Text nennt ausdrücklich die Knochen. „Gebeine“ ist im Bestattungskontext würdevoll und verständlich und erhält die Wiederholung des Ausgangstextes.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: So verschonten sie seine Gebeine
  rationale: Die Piel-Form von מלט bezeichnet hier das Bewahren beziehungsweise Verschonen vor dem vorgesehenen Zugriff. „Verschonten“ ist knapp, idiomatisch und lässt die konkrete Art der Bewahrung offen.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: zusammen mit den Gebeinen des Propheten
  rationale: Die weitere Akkusativgruppe bezeichnet die ebenfalls verschonten Gebeine des Propheten; „zusammen mit“ macht diese syntaktische Zuordnung im Deutschen klar.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: der aus Samaria gekommen war
  rationale: Das Plusquamperfekt verdeutlicht, dass das Kommen des Propheten zeitlich vor der erzählten Handlung lag; „Samaria“ ist die übliche deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gebeine“ entspricht dem konkreten Bestattungskontext und vermeidet das allgemeinere „Überreste“. Die direkte Rede bleibt knapp und bestimmt.
