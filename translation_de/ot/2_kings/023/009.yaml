base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: de
  text: Allerdings stiegen die Priester der Kulthöhen[a] nicht zum Altar Jahwes[b] in Jerusalem hinauf, sondern sie aßen ungesäuertes Brot unter ihren Brüdern.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Priester der Höhen“; gemeint sind örtliche Kultstätten.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Gottesname lautet JHWH; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: c
    text: Mit „ihren Brüdern“ sind im Zusammenhang wahrscheinlich ihre Priesterbrüder oder ihre priesterlichen Verwandten gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Allerdings
  rationale: Die Partikel schränkt die zuvor geschilderten Reformmaßnahmen ein und leitet eine Ausnahme beziehungsweise Begrenzung ein.
- source_word: יַעֲלוּ
  choice: stiegen … hinauf
  rationale: עלה bedeutet „hinaufsteigen“; bei Jerusalem und dem Altar ist die räumliche und kultische Aufwärtsbewegung im Deutschen natürlich wiederzugeben.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: die Priester der Kulthöhen
  rationale: Die Konstruktverbindung bezeichnet Priester der örtlichen Kultstätten. „Kulthöhen“ ist verständlicher und genauer als das isolierte „Höhen“.
- source_word: מִזְבַּח יְהוָה
  choice: Altar Jahwes
  rationale: Die Genitivverbindung bildet das hebräische Besitzverhältnis knapp und natürlich ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form „Jahwe“ gibt den Gottesnamen YHWH als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי אִם
  choice: vielmehr
  rationale: Die Verbindung stellt dem verneinten Hinaufsteigen den tatsächlichen Sachverhalt gegenüber. „Vielmehr“ gibt diesen Kontrast idiomatisch wieder.
- source_word: אָכְלוּ מַצּוֹת
  choice: aßen sie ungesäuertes Brot
  rationale: מַצּוֹת bezeichnet ungesäuertes Brot; die Übersetzung ist klar und passt zum kultischen Zusammenhang.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: unter ihren Brüdern
  rationale: Die Formulierung bewahrt das konkrete maskuline Verwandtschaftswort des Hebräischen, ohne die im Kontext naheliegende priesterliche Beziehung in den Haupttext einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt diesen Befund; die traditionelle Ersetzung durch „der HERR“ wird in einer Fußnote genannt.
- issue: Bezug von אֲחֵיהֶם
  choice: ihren Brüdern
  alternative: ihren Priesterbrüdern
  rationale: Im Kontext sind sehr wahrscheinlich andere Priester oder Angehörige der priesterlichen Verwandtschaft gemeint. Da das Hebräische jedoch nur „ihre Brüder“ sagt, bleibt diese Offenheit im Haupttext erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während „Allerdings“ und „vielmehr“ die Einschränkung und den Kontrast natürlich ausdrücken. Die kultische Fachsprache wird verständlich gehalten.
