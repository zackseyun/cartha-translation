id: 2KI.23.13
reference: 2 Kings 23:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: de
  text: Und der König entweihte die Kulthöhen vor Jerusalem[a], rechts vom Berg des Verderbens[b], die Salomo, der König Israels, für Astarte, dem Gräuel der Sidonier, für Kemosch, dem Gräuel Moabs, und für Milkom[c], dem Gräuel der Ammoniter, errichtet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „vor Jerusalem“; gemeint sein kann auch „östlich von Jerusalem“.
    reason: lexical_alternative
  - marker: b
    text: „Rechts“ kann, wenn Osten als Blickrichtung vorausgesetzt wird, „südlich“ bedeuten. Der „Berg des Verderbens“ wird möglicherweise mit dem Ölberg gleichgesetzt.
    reason: topographical_ambiguity
  - marker: c
    text: Der hebräische Text lautet „Milkom“; diese Gottheit wird bisweilen mit Moloch in Verbindung gebracht.
    reason: alternative_identification
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: Der Ausdruck bezeichnet erhöhte beziehungsweise lokale Kultstätten. „Kulthöhen“ ist im Deutschen verständlicher und präziser als das bloße „Höhen“.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: die Jerusalem gegenüberlagen
  rationale: Die Wendung bezeichnet hier eine Lage vor beziehungsweise gegenüber Jerusalem. Diese Wiedergabe bewahrt die räumliche Aussage, ohne die im Hebräischen nicht ausdrücklich genannte Himmelsrichtung „östlich“ in den Haupttext einzutragen.
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: rechts vom Berg des Verderbens
  rationale: מִימִין bedeutet wörtlich „zur Rechten/rechts“. Eine mögliche topografische Deutung als „südlich“ wird in der Fußnote erhalten.
- source_word: הַר הַמַּשְׁחִית
  choice: Berg des Verderbens
  rationale: Die polemische hebräische Bezeichnung wird übersetzt und nicht stillschweigend durch „Ölberg“ ersetzt.
- source_word: לְעַשְׁתֹּרֶת
  choice: für Astarte
  rationale: Astarte ist die im modernen Deutschen geläufige Form des Namens der westsemitischen Göttin.
- source_word: שִׁקֻּץ צִידֹנִים
  choice: den abscheulichen Götzen der Sidonier
  rationale: שִׁקּוּץ ist eine scharf abwertende kultische Bezeichnung. „Abscheulicher Götze“ bewahrt sowohl den polemischen Ton als auch den konkreten Bezug auf die verehrte Gottheit.
- source_word: לִכְמוֹשׁ
  choice: für Kemosch
  rationale: Der Eigenname wird in seiner üblichen deutschen biblischen Form wiedergegeben.
- source_word: שִׁקֻּץ מוֹאָב
  choice: den abscheulichen Götzen Moabs
  rationale: Die Wiedergabe entspricht dem gleichlautenden polemischen Ausdruck beim sidonischen Kult und wahrt die Parallelität.
- source_word: לְמִלְכֹּם
  choice: für Milkom
  rationale: Der masoretische Text nennt Milkom. Eine Gleichsetzung mit Moloch wird im Haupttext nicht vorgenommen, aber in einer Fußnote erwähnt.
- source_word: תּוֹעֲבַת בְּנֵי עַמּוֹן
  choice: den abscheulichen Götzen der Ammoniter
  rationale: תּוֹעֵבָה drückt starke kultische Verabscheuung aus; „abscheulicher Götze“ gibt dies natürlich wieder. „Ammoniter“ entspricht idiomatisch „Söhne Ammons“.
- source_word: טִמֵּא
  choice: entweihte
  rationale: Das Piel bezeichnet hier die kultische Verunreinigung beziehungsweise Unbrauchbarmachung der unerlaubten Heiligtümer. „Entweihte“ ist dafür im Deutschen prägnant und kontextgerecht.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Wie der hebräische Vers bleibt die Übersetzung beim Titel; aus dem Kontext ist Josia gemeint.
theological_decisions:
- issue: Polemische Bezeichnungen für fremde Gottheiten
  choice: „abscheulicher Götze“ für שִׁקּוּץ und תּוֹעֵבָה
  alternative: „Scheusal“, „Gräuel“ oder „Abscheulichkeit“
  rationale: Der Ausgangstext spricht bewusst verurteilend. Die gewählte Formulierung bewahrt diese theologische Wertung und macht zugleich deutlich, dass die jeweilige Kultgottheit gemeint ist.
- issue: Topografische Identifizierung von הַר הַמַּשְׁחִית
  choice: „Berg des Verderbens“
  alternative: „Berg des Unheils“, „Berg der Zerstörung“ oder „Ölberg“
  rationale: Die hebräische polemische Bezeichnung wird übersetzt, statt sie durch eine mögliche spätere geografische Identifizierung zu ersetzen.
- issue: Identität von Milkom und Moloch
  choice: Milkom im Haupttext beibehalten
  alternative: Moloch
  rationale: Der Konsonantentext liest Milkom. Eine mögliche religionsgeschichtliche Verbindung zu Moloch rechtfertigt keine Angleichung des Haupttextes und wird daher nur als Hinweis vermerkt.
translation_notes:
  register: Moderne, würdige Standardsprache. Kultische Fachbegriffe werden verständlich, aber nicht verharmlosend wiedergegeben. Die Satzstruktur ist gegenüber dem langen hebräischen Satz maßvoll gegliedert; die Relationen und die dreifache polemische Parallelität bleiben erhalten.
