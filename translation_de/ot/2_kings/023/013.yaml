  naturalness: „Kulthöhen“, „entweihte“, „Berg des Verderbens“, Astarte, Kemosch und Milkom sind verständlich und dem würdigen modernen Register angemessen. Die revidierte Fassung stellt die Satzbezüge klar und verwendet kasusgerechte, idiomatische Appositionen.
  terminology: „Gräuel“ gibt die polemischen kultischen Bezeichnungen שִׁקּוּץ und תּוֹעֵבָה präzise und in etabliertem biblisch-theologischem Deutsch wieder, ohne die Gottheiten zu neutralisieren oder eine bestimmte Identifikation vorzuschreiben. „Milkom“ bleibt entsprechend dem masoretischen Text stehen.
