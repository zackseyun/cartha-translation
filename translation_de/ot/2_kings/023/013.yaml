revisions:
- from: Und der König entweihte die Kulthöhen, die Jerusalem gegenüberlagen[a], rechts vom Berg des Verderbens[b]. Salomo, der König von Israel, hatte sie für Astarte, den abscheulichen Götzen der Sidonier, für Kemosch, den abscheulichen Götzen Moabs, und für Milkom[c], den abscheulichen Götzen der Ammoniter, errichtet.
  to: Und der König entweihte die Kulthöhen vor Jerusalem[a], rechts vom Berg des Verderbens[b], die Salomo, der König Israels, für Astarte, dem Gräuel der Sidonier, für Kemosch, dem Gräuel Moabs, und für Milkom[c], dem Gräuel der Ammoniter, errichtet hatte.
  rationale: 'Die Revision korrigiert die deutschen Kasusbeziehungen und stellt die im Ausgangstext bestehende Zuordnung wieder her: Salomo errichtete die genannten Kulthöhen. Die räumliche Mehrdeutigkeit von עַל־פְּנֵי ירושלים und מִימִין bleibt im Haupttext beziehungsweise in den Anmerkungen erhalten. Die wertenden hebräischen Kultbezeichnungen werden mit „Gräuel“ beibehalten, ohne zusätzliche Aussagen über Kultbilder oder religionsgeschichtliche Gleichsetzungen einzutragen.'
