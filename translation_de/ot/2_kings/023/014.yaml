base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/014.yaml
  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: de
  text: Er zertrümmerte die Kultsteine, hieb die Ascheren[a] um und füllte ihre Stätten mit Menschenknochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aschera-Pfähle“. Das hebräische Wort bezeichnet Kultgegenstände, die mit Aschera verbunden waren; ihre genaue Gestalt geht aus dem Begriff allein nicht hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: zertrümmerte
  rationale: Das Verb bezeichnet ein gewaltsames Zerbrechen; „zertrümmerte“ gibt die Zerstörung in Stücke natürlich und anschaulich wieder.
- source_word: הַמַּצֵּבוֹת
  choice: die Steinmale
  rationale: מַצֵּבָה bezeichnet hier aufgerichtete kultische Steine. „Steinmale“ macht Material und Funktion verständlich, ohne durch „heilig“ eine Wertung einzutragen.
- source_word: וַיִּכְרֹת
  choice: hieb … um
  rationale: כרת bedeutet abschneiden oder fällen. Bei den mit Aschera verbundenen Kultgegenständen ist „umhauen“ die natürliche deutsche Entsprechung.
- source_word: הָאֲשֵׁרִים
  choice: die Ascheren
  rationale: Die eingedeutschte Pluralform bewahrt den spezifischen hebräischen Begriff und legt nicht fest, ob Pfähle, Bäume oder anders gestaltete Kultgegenstände gemeint waren; die Fußnote erläutert die Sachfrage.
- source_word: וַיְמַלֵּא
  choice: füllte
  rationale: Dies entspricht der Grundbedeutung des Verbs und gibt das Auffüllen der betreffenden Stätten mit Knochen direkt wieder.
- source_word: מְקוֹמָם
  choice: ihre Stätten
  rationale: Das Suffix verweist auf die zuvor genannten Kultgegenstände. „Stätten“ bezeichnet idiomatisch die Orte, an denen sie gestanden hatten, ohne den Text unnötig auszuweiten.
- source_word: עַצְמוֹת אָדָם
  choice: Menschenknochen
  rationale: אָדָם ist hier generisch und bezeichnet Menschen, nicht eigens Männer. „Menschenknochen“ ist präzises, natürliches Deutsch.
theological_decisions:
- issue: Wiedergabe von אָדָם
  choice: „Menschen-“ in „Menschenknochen“
  alternative: „Knochen eines Menschen“ oder wörtlicher „Menschenknochen“ ohne generische Erläuterung
  rationale: אָדָם bezeichnet in diesem Zusammenhang den Menschen allgemein und ist nicht geschlechtsspezifisch; die gewählte Form wahrt diesen Sinn.
- issue: Gestalt der אֲשֵׁרִים
  choice: Transliteration als „Ascheren“ mit erläuternder Fußnote
  alternative: „Aschera-Pfähle“
  rationale: Der Ausdruck bezeichnet mit Aschera verbundene Kultgegenstände, legt deren genaue äußere Form aber für sich allein nicht fest. Die Übersetzung bewahrt diese sachliche Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählender Satzfolge. „Steinmale“ und „Ascheren“ erhalten den kultgeschichtlichen Charakter; die mögliche Unvertrautheit von „Ascheren“ wird durch die Fußnote aufgefangen.
