  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: de
  text: Er brachte die Aschera[a] aus dem Haus Jahwes hinaus zum Kidrontal außerhalb Jerusalems. Dort im Kidrontal verbrannte er sie, zermalmte sie zu Staub und warf ihren Staub auf die Gräber der einfachen Leute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Aschera-Pfahl“ oder „das Aschera-Bild“. Das hebräische Wort kann die kanaanäische Göttin Aschera oder den mit ihrer Verehrung verbundenen Kultgegenstand bezeichnen; hier ist der Gegenstand gemeint, der aus dem Tempel entfernt und zerstört wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: die Aschera
  rationale: Der hebräische Ausdruck kann die kanaanäische Göttin oder den mit ihrer Verehrung verbundenen Kultgegenstand bezeichnen. Hier ist wegen des Hinausbringens, Verbrennens und Zermalmens der Kultgegenstand gemeint; die Bezeichnung „Aschera“ bewahrt die Offenheit hinsichtlich seiner genauen Gestalt.
- source_word: מִבֵּית יְהוָה
  choice: aus dem Haus Jahwes
  rationale: „Haus Jahwes“ gibt die hebräische Wendung formal und zugleich verständlich wieder; gemeint ist der Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִחוּץ לִירוּשָׁלַם
  choice: aus Jerusalem hinaus
  rationale: Die Formulierung bezeichnet die Bewegung an einen Ort außerhalb der Stadt und fügt sich natürlich in den deutschen Bewegungssatz ein.
- source_word: נַחַל קִדְרוֹן
  choice: Kidrontal
  rationale: נחל kann ein Tal beziehungsweise ein Wadi mit zeitweiligem Wasserlauf bezeichnen. „Kidrontal“ ist im Deutschen eine klare geografische Wiedergabe.
- source_word: וַיִּשְׂרֹף אֹתָהּ
  choice: verbrannte er sie
  rationale: Das feminine Pronomen entspricht im Deutschen dem grammatischen Geschlecht von „Aschera“ und bezeichnet hier den Kultgegenstand, ohne über dessen genaue Form zu entscheiden.
- source_word: וַיָּדֶק לְעָפָר
  choice: zermalmte sie zu Staub
  rationale: Das Verb beschreibt das Zerkleinern beziehungsweise Pulverisieren; „zu Staub zermalmen“ gibt Handlung und Ergebnis anschaulich wieder.
- source_word: עֲפָרָהּ
  choice: ihren Staub
  rationale: עפר bedeutet hier „Staub“ und sollte nicht enger als „Asche“ wiedergegeben werden, da der Gegenstand sowohl verbrannt als auch zermalmt wurde.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: auf die Gräber der einfachen Leute
  rationale: Die Wendung bezeichnet wahrscheinlich gewöhnliche Angehörige des Volkes im Unterschied zu gesellschaftlich Höhergestellten. Der kollektive Singular קֶבֶר wird im Deutschen sinngemäß als Plural wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Kultbegriffs אֲשֵׁרָה
  choice: die Aschera
  alternative: der Aschera-Pfahl / das Aschera-Bild
  rationale: Die Transliteration vermeidet eine über den hebräischen Text hinausgehende Festlegung auf die konkrete Form des zerstörten Kultgegenstands und bewahrt dennoch dessen eindeutigen Bezug zur Aschera-Verehrung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gereihte hebräische Erzählweise wird durch zwei Sätze leicht gegliedert; Wiederholung und Handlungsfolge bleiben erhalten. „Haus Jahwes“ bewahrt die biblische Ausdrucksweise, während „Kidrontal“ und „einfache Leute“ allgemein verständlich sind.
