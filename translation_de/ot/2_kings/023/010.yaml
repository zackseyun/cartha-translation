base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: de
  text: Und er verunreinigte das Tofet, das im Tal Ben-Hinnom[a] liegt, damit niemand seinen Sohn oder seine Tochter für den Moloch[c] durchs Feuer gehen ließ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann der Ortsname auch „Tal der Söhne Hinnoms“ wiedergegeben werden; häufig heißt es verkürzt „Tal Hinnom“.
    reason: lexical_alternative
  - marker: b
    text: „Seinen Sohn oder seine Tochter durchs Feuer gehen lassen“ ist eine kultische Wendung für die Darbringung von Kindern in einem mit Moloch verbundenen Ritus, wahrscheinlich als Kinderopfer.
    reason: cultural_note
  - marker: c
    text: 'Oder: „für den König“. Im kultischen Zusammenhang ist „für den Moloch“ wahrscheinlicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  choice: Und er machte … unrein
  rationale: Das Piel von טמא bedeutet „unrein machen“. Die Formulierung gibt wieder, dass Josia die Kultstätte unbrauchbar machte, ohne mit „entweihen“ ihre Heiligkeit anzuerkennen.
- source_word: הַתֹּפֶת
  choice: das Tofet
  rationale: Der Ortsname wird in geläufiger deutscher Umschrift wiedergegeben; der hebräische Artikel bleibt als „das“ erhalten.
- source_word: בְּגֵי בני הִנֹּם
  choice: im Tal Ben-Hinnom
  rationale: גֵי bedeutet „Tal“; Ben-Hinnom wird als überlieferter Ortsname bewahrt. Die wörtlichere Deutung wird in einer Fußnote genannt.
- source_word: לְבִלְתִּי
  choice: damit niemand mehr
  rationale: Die Konstruktion bezeichnet den Zweck beziehungsweise die beabsichtigte Verhinderung. „Mehr“ ergibt sich natürlich aus Josias Maßnahme, ohne den Aussagegehalt zu verändern.
- source_word: לְהַעֲבִיר
  choice: durchs Feuer gehen ließ
  rationale: 'Der Hifil von עבר ist kausativ: „hindurchgehen lassen“. Die kultische Wendung bleibt im Haupttext erhalten und wird in der Fußnote erläutert.'
- source_word: אִישׁ
  choice: niemand
  rationale: Das maskuline Singularwort אִישׁ wird hier generisch gebraucht. Im heutigen Deutschen gibt „niemand“ diesen allgemeinen Geltungsbereich natürlicher wieder als „kein Mann“.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: seinen Sohn oder seine Tochter
  rationale: Nach einer Verneinung gibt deutsches „oder“ den distributiven Sinn der hebräischen Verbindung idiomatisch wieder.
- source_word: בָּאֵשׁ
  choice: durchs Feuer
  rationale: In Verbindung mit dem kausativen Verb ist „durchs Feuer gehen lassen“ die natürliche deutsche Wiedergabe der hebräischen Kultformel.
- source_word: לַמֹּלֶךְ
  choice: für den Moloch
  rationale: Im kultischen Zusammenhang ist die Deutung als Name beziehungsweise Bezeichnung der Gottheit am wahrscheinlichsten. „Moloch“ ist die etablierte deutsche Namensform; der Artikel entspricht dem hebräischen Ausdruck.
theological_decisions:
- issue: Wiedergabe der kultischen Wendung zum Kinderopfer
  choice: Die hebräische Wendung „durchs Feuer gehen ließ“ bleibt im Haupttext erhalten.
  alternative: „als Opfer im Feuer verbrannte“
  rationale: Der Zusammenhang weist auf einen mit Moloch verbundenen Ritus hin, wahrscheinlich auf Kinderopfer. Da der hebräische Wortlaut den Vorgang jedoch idiomatisch und nicht vollständig ausdrücklich bezeichnet, wird die Spannung bewahrt und in einer Fußnote erklärt.
- issue: Generischer Gebrauch von אִישׁ
  choice: niemand
  alternative: kein Mann
  rationale: אִישׁ steht zwar formal im maskulinen Singular, hat hier aber generische Bedeutung. „Niemand“ verhindert im modernen Deutschen das Missverständnis, das Verbot betreffe ausschließlich Männer.
- issue: Deutung von לַמֹּלֶךְ
  choice: für den Moloch
  alternative: für den König
  rationale: Der Kultzusammenhang und der überlieferte masoretische Vokalismus sprechen für Moloch; die formal mögliche Deutung „König“ wird nicht verschwiegen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, während „niemand“ und „damit … mehr“ den Zweck der Maßnahme natürlich ausdrücken. Die kultische Wendung wird nicht vorschnell durch eine explizite Opferterminologie ersetzt.
