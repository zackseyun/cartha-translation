source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: de
  text: Er schaffte die Götzenpriester[a] ab, die die Könige von Juda dafür eingesetzt hatten, auf den Kulthöhen in den Städten Judas und rings um Jerusalem Räucheropfer darzubringen, und auch diejenigen, die dem Baal, der Sonne, dem Mond, den Sternbildern[b] und dem ganzen Heer des Himmels[c] Räucheropfer darbrachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bezeichnet Priester, die einem unerlaubten oder götzendienerischen Kult dienten; auch: „Kultpriester“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Tierkreiszeichen“. Welche astronomischen Gruppierungen genau gemeint sind, ist nicht sicher.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist hier die Gesamtheit der Himmelskörper, die in astralen Kulten verehrt wurden.
    reason: clarification
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: Er setzte … ab
  rationale: Der Hifil von שׁבת bedeutet hier, jemanden zum Aufhören zu bringen beziehungsweise seine Tätigkeit zu beenden. „Setzte … ab“ gibt dies im Zusammenhang eingesetzter Priester natürlich wieder, ohne eine Tötung zu behaupten.
- source_word: הַכְּמָרִים
  choice: die Götzenpriester
  rationale: כְּמָרִים bezeichnet im biblischen Sprachgebrauch Priester eines unerlaubten beziehungsweise götzendienerischen Kultes und unterscheidet sie von den rechtmäßigen Priestern des HERRN. Eine Fußnote weist auf die wertungsärmere Alternative hin.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: die die Könige von Juda eingesetzt hatten
  rationale: נתן hat in dieser Verbindung den Sinn „einsetzen/bestellen“. Das Plusquamperfekt verdeutlicht im Deutschen, dass die Einsetzung vor Josias Maßnahme lag.
- source_word: וַיְקַטֵּר
  choice: damit sie … Räucheropfer darbrachten
  rationale: קטר bezeichnet das Verbrennen von Räucherwerk oder Rauchopfern. Die deutsche Pluralform bezieht die Tätigkeit natürlich auf die zuvor genannten Priester; „Räucheropfer darbringen“ hält den möglichen Opfercharakter offen.
- source_word: בַּבָּמוֹת
  choice: auf den Kulthöhen
  rationale: במות sind örtliche Kultstätten, häufig auf Anhöhen. „Kulthöhen“ ist im Deutschen prägnant und vermeidet das missverständliche rein topografische „Höhen“.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: in den Städten Judas und rings um Jerusalem
  rationale: מְסִבֵּי bezeichnet die Umgebung beziehungsweise das Gebiet rings um Jerusalem.
- source_word: וְאֶת הַמְקַטְּרִים
  choice: Ebenso … diejenigen …, die … Räucheropfer darbrachten
  rationale: Das Partizip bezeichnet eine weitere Gruppe nach ihrer kultischen Tätigkeit. Die Wiederaufnahme von „setzte … ab“ macht den Satzbezug im Deutschen eindeutig.
- source_word: לַבַּעַל
  choice: dem Baal
  rationale: בעל ist hier der Name beziehungsweise Titel der verehrten Gottheit; die übliche deutsche Form lautet „Baal“.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: der Sonne, dem Mond
  rationale: Die einzelnen Himmelskörper werden als Empfänger der kultischen Handlung aufgeführt.
- source_word: וְלַמַּזָּלוֹת
  choice: den Sternbildern
  rationale: מַזָּלוֹת meint wahrscheinlich Konstellationen oder Tierkreiszeichen. „Sternbilder“ ist verständlich und vermeidet eine nicht völlig gesicherte Eingrenzung auf den Tierkreis.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: dem ganzen Heer des Himmels
  rationale: Die feste Wendung bezeichnet die Gesamtheit der Himmelskörper als geordnete Schar. Die bildhafte Ausdrucksweise des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Soll כְּמָרִים neutral als „Priester“ oder als Priester eines unerlaubten Kultes wiedergegeben werden?
  choice: Götzenpriester
  alternative: Priester; Kultpriester
  rationale: Das seltene Wort bezeichnet im Alten Testament Priester, die mit unerlaubtem oder nichtjüdischem Kult verbunden sind. „Götzenpriester“ verhindert eine Verwechslung mit den rechtmäßigen Priestern des HERRN; die Fußnote macht den lexikalischen Charakter der Bezeichnung transparent.
- issue: Bezeichnet צְבָא הַשָּׁמָיִם Engelwesen oder verehrte Himmelskörper?
  choice: Die Bildformulierung „Heer des Himmels“ wird im Text bewahrt und im Kontext als Gesamtheit der Himmelskörper verstanden.
  alternative: alle Himmelskörper
  rationale: Die vorangehende Aufzählung von Sonne, Mond und Sternbildern legt hier astrale Kultobjekte nahe. Die wörtlichere Bildform vermeidet dennoch, die mehrdeutige feste Wendung im Haupttext vollständig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Räucheropfer darbringen“ ist gegenüber „räuchern“ idiomatischer und lässt offen, ob ausschließlich Weihrauch oder allgemeiner ein Rauchopfer gemeint ist. Die Wiederholung „setzte … ab“ klärt die syntaktische Zuordnung, ohne den Inhalt zu erweitern.
