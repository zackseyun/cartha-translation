revisions:
- from: Josia beseitigte auch sämtliche Höhenheiligtümer, die die Könige Israels in den Städten Samarias errichtet hatten, um zum Zorn zu reizen[a]. Er tat mit ihnen all das, was er in Bethel getan hatte.
  to: Auch sämtliche Gebäude der Höhenheiligtümer, die sich in den Städten Samarias befanden und die die Könige Israels errichtet hatten, um zum Zorn zu reizen[a], beseitigte Josia. Er tat mit ihnen alles, was er in Bethel getan hatte.
  rationale: 'Die Revision stellt die hebräische Satzstruktur wieder her: Josia beseitigt die Gebäude der Höhenheiligtümer; sowohl ihre Lage in den Städten Samarias als auch ihre Errichtung durch die Könige Israels werden eindeutig diesen Gebäuden zugeordnet. Das implizite Objekt von „zum Zorn reizen“ bleibt wie im Hebräischen im Haupttext unausgesprochen. Die abschließende Vergleichsaussage bleibt bewusst allgemein und verweist auf Josias Handeln in Bethel.'
