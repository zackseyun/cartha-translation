  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: de
  text: Auch sämtliche Gebäude der Höhenheiligtümer, die sich in den Städten Samarias befanden und die die Könige Israels errichtet hatten, um zum Zorn zu reizen[a], beseitigte Josia. Er tat mit ihnen alles, was er in Bethel getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist dem Zusammenhang nach: um den HERRN zum Zorn zu reizen. Im Hebräischen bleibt das Objekt unausgesprochen.'
    reason: Erläuterung des im Hebräischen impliziten Objekts
lexical_decisions:
- source_word: וְגַם
  choice: auch
  rationale: Gibt die additive Verknüpfung mit Josias zuvor geschilderten Maßnahmen knapp und natürlich wieder.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: Höhenheiligtümer
  rationale: Die wörtliche Wendung lautet »Häuser der Höhen«. »Höhenheiligtümer« bezeichnet im Deutschen verständlich und sachgerecht die Kultgebäude an solchen Kultstätten, ohne sie als bloße Wohnhäuser erscheinen zu lassen.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: in den Städten Samarias
  rationale: Gibt die Zugehörigkeit der Städte zum Gebiet des früheren Nordreichs klar wieder.
- source_word: אֲשֶׁר עָשׂוּ
  choice: die … errichtet hatten
  rationale: Bei Kultgebäuden ist »errichten« die natürliche konkrete Wiedergabe von עשה; das Plusquamperfekt macht deutlich, dass ihre Errichtung Josias Beseitigung vorausging.
- source_word: לְהַכְעִיס
  choice: um zum Zorn zu reizen
  rationale: Bewahrt die im Hebräischen unausgesprochene Ergänzung und gibt zugleich die Zweckangabe wieder.
- source_word: הֵסִיר
  choice: beseitigte
  rationale: Passt zum Kontext einer Kultreform und bezeichnet klar die Entfernung beziehungsweise Abschaffung der Heiligtümer.
- source_word: וַיַּעַשׂ לָהֶם כְּכָל הַמַּעֲשִׂים
  choice: Er tat mit ihnen all das
  rationale: Bewahrt die direkte, bewusst allgemein gehaltene Ausdrucksweise des Hebräischen, deren konkrete Maßnahmen aus dem vorherigen Bericht hervorgehen.
- source_word: בְּבֵית אֵל
  choice: in Bethel
  rationale: Natürliche deutsche Ortsangabe; sie verweist auf Josias unmittelbar zuvor berichtetes Vorgehen dort.
theological_decisions:
- issue: Unausgesprochenes Objekt bei לְהַכְעִיס
  choice: 'Im Haupttext bleibt das Objekt unausgesprochen: »um zum Zorn zu reizen«.'
  alternative: »um den HERRN zum Zorn zu reizen«
  rationale: Der Zusammenhang identifiziert den HERRN als denjenigen, der zum Zorn gereizt wird; im hebräischen Satz selbst steht dieses Objekt jedoch nicht. Die Fußnote erläutert den Bezug, ohne ihn stillschweigend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Höhenheiligtümer« vermeidet die im Deutschen missverständliche wörtliche Form »Häuser der Höhen«. Die Satzstellung ordnet die beiden Relativangaben eindeutig den Heiligtümern zu; der zweite Satz wahrt die knappe Rückverweisung auf Josias Vorgehen in Bethel.
