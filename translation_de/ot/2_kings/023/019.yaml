    rationale: „Sämtliche Höhenheiligtümer“ lässt das lexikalische Element „Häuser/Gebäude“ aus. Eine Wiedergabe als „sämtliche Gebäude der Höhenheiligtümer“ wahrt die hebräische Konstruktion und bleibt idiomatisch.
  - severity: medium
    issue: Die Relativsatzbezüge sind gegenüber dem Hebräischen umgeordnet.
    rationale: Im Hebräischen befanden sich die Gebäude in den Städten Samarias, und die Könige Israels hatten sie errichtet. Die Entwurfsformulierung kann nahelegen, die Könige hätten die Höhenheiligtümer in diesen Städten errichtet, statt beide Angaben auf die Gebäude zu beziehen.
  - severity: low
    issue: Die Vergleichsformel im zweiten Satz ist zu wenig explizit.
    rationale: „all das“ ist möglich, doch die Wiederholung von „alles, was er in Bethel getan hatte“ bildet כְּכָל הַמַּעֲשִׂים klarer ab.
