base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: de
  text: Im siebten Jahr Jehus wurde Joasch König, und er regierte vierzig Jahre in Jerusalem. Seine Mutter hieß Zibja; sie stammte aus Beerscheba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: Im siebten Jahr Jehus
  rationale: Die übliche Formel zur Datierung nach Regierungsjahren wird im Deutschen natürlich und chronologisch eindeutig wiedergegeben.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: wurde Joasch König
  rationale: In der Thronbesteigungsformel hat מָלַךְ ingressiven Sinn und bezeichnet den Beginn der Herrschaft.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: und er regierte vierzig Jahre
  rationale: Hier bezeichnet מָלַךְ die Dauer der Herrschaft; »regierte« ist im Deutschen idiomatisch und präzise.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Ortsangabe mit בְּ wird direkt wiedergegeben.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Die natürliche deutsche Namensformel bewahrt den Inhalt der hebräischen Wendung ohne unnötige Schwerfälligkeit.
- source_word: צִבְיָה
  choice: Zibja
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamenkonvention transliteriert.
- source_word: מִבְּאֵר שָׁבַע
  choice: sie stammte aus Beerscheba
  rationale: מִן bezeichnet hier die Herkunft. Die ausdrückliche Formulierung macht im Deutschen klar, dass Beerscheba der Herkunftsort der Mutter ist.
