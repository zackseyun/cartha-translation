  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: de
  text: Da nahm Joasch, der König von Juda, alle heiligen Gaben, die Joschafat, Joram und Ahasja, seine Vorfahren, die Könige von Juda, geweiht hatten, dazu seine eigenen heiligen Gaben und alles Gold, das sich in den Schatzkammern des Hauses Jahwes und des Hauses des Königs befand. Er sandte es Hasaël, dem König von Aram. Dann zog Hasaël von Jerusalem ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und er zog von Jerusalem hinauf/weg.“ Gemeint ist, dass Hasaël sein Vorgehen gegen die Stadt abbrach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm
  rationale: לקח bedeutet hier schlicht „nehmen“. Das einleitende „Da“ gibt die fortlaufende Erzählung wieder, ohne Gewalt oder Einsammeln hineinzulesen.
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  choice: die heiligen Gaben / seine eigenen heiligen Gaben
  rationale: Die Ausdrücke bezeichnen für den heiligen Gebrauch ausgesonderte Gegenstände oder Werte. „Heilige Gaben“ ist verständlicher als das substantivierte „Heilige“ und bewahrt den kultischen Sinn sowie die lexikalische Verbindung beider Vorkommen.
- source_word: הִקְדִּישׁוּ
  choice: geweiht hatten
  rationale: Der Hifil von קדש bezeichnet das Bestimmen oder Weih(en) für den heiligen Gebrauch; das Plusquamperfekt macht die Vorzeitigkeit im Deutschen deutlich.
- source_word: אֲבֹתָיו
  choice: seine Vorfahren
  rationale: אָבוֹת bedeutet wörtlich „Väter“, bezeichnet im königlichen Zusammenhang jedoch frühere Angehörige der Dynastie beziehungsweise Vorfahren. „Vorfahren“ ist im modernen Deutsch eindeutig und wird durch „die Könige von Juda“ näher bestimmt.
- source_word: הַנִּמְצָא
  choice: das sich … befand
  rationale: Das Partizip von מצא beschreibt hier das in den Schatzkammern vorhandene Gold. Die Wendung ist natürliches Deutsch und bleibt näher am Sachverhalt als „verfügbar“.
- source_word: בְּאֹצְרוֹת
  choice: in den Schatzkammern
  rationale: אֹצָרוֹת bezeichnet Räume oder Vorrichtungen zur Aufbewahrung von Wertgegenständen; „Schatzkammern“ passt sowohl zum Heiligtum als auch zum Königshaus.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: בֵּית יְהוָה lautet wörtlich „Haus Jahwes“ und meint den Tempel. Die Übersetzung bewahrt den hebräischen Ausdruck und gibt den Gottesnamen als Eigennamen wieder.
- source_word: בֵּית הַמֶּלֶךְ
  choice: das Königshaus
  rationale: Der Ausdruck lautet wörtlich „Haus des Königs“ und bezeichnet hier den Palast samt Schatzkammern. „Königshaus“ wahrt die Parallele zu „Haus Jahwes“, ohne die Bedeutung unnötig zu verengen.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: Er sandte es Hasaël
  rationale: Das singularische „es“ fasst die zuvor genannten Gaben und das Gold als gesamte Sendung zusammen. Der Empfänger steht im Deutschen natürlich im Dativ.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: Daraufhin zog Hasaël von Jerusalem ab
  rationale: Die Verbindung von עלה mit מֵעַל bezeichnet im Kontext das Aufgeben des Vorgehens gegen Jerusalem. Die ausdrückliche Nennung Hasaëls beseitigt eine im Deutschen störende Pronomenmehrdeutigkeit; „daraufhin“ gibt den erzählerischen Zusammenhang wieder, ohne eine stärkere Kausalität zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der an Jahwe geweihten Werte
  choice: heilige Gaben
  alternative: geweihte Gegenstände
  rationale: Der Text benennt weder Form noch Material aller קֳדָשִׁים. „Heilige Gaben“ bewahrt diese Offenheit und vermeidet eine engere Bestimmung.
- issue: Verhältnis der Tributzahlung zu Hasaëls Abzug
  choice: Daraufhin
  alternative: deshalb
  rationale: Das narrative וַ zeigt eine zeitliche Folge; ein ausdrücklich kausales „deshalb“ würde den grammatischen Zusammenhang stärker festlegen, als der hebräische Text es tut.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Eigennamen folgen geläufigen deutschen Bibelformen: Joasch, Joschafat, Joram, Ahasja, Hasaël und Aram. Der Satz wurde zur besseren Verständlichkeit in drei Sätze gegliedert. Der einzige Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Abzugsformel.'
