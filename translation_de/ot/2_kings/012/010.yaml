  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: de
  text: Da nahm der Priester Jojada eine Truhe, bohrte ein Loch in ihren Deckel[a] und stellte sie neben den Altar, rechts, wenn man in das Haus Jahwes hineingeht. Die Priester, die an der Schwelle Wache hielten, legten dort alles Silber[b] hinein, das in das Haus Jahwes gebracht wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seine Tür“. Gemeint ist hier wahrscheinlich der Deckel oder Verschluss der Truhe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alles Geld“. Das hebräische Wort bezeichnet Silber und kann auch für Geld stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: Truhe
  rationale: Im Zusammenhang mit den Tempelabgaben bezeichnet das Wort einen Behälter für Geld; „Truhe“ ist natürlich und vermeidet die besonderen Assoziationen von „Lade“.
- source_word: וַיִּקֹּב חֹר
  choice: bohrte ein Loch
  rationale: Die Verbindung bezeichnet das Herstellen einer Öffnung; „bohrte ein Loch“ gibt die konkrete Handlung klar wieder.
- source_word: בְּדַלְתּוֹ
  choice: in ihren Deckel
  rationale: דלת bedeutet gewöhnlich „Tür“, bezeichnet hier bei einer Truhe aber wahrscheinlich den beweglichen Verschluss beziehungsweise Deckel.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: neben den Altar
  rationale: אצל bezeichnet räumliche Nähe; die Formulierung ist knapp und eindeutig.
- source_word: בימין בְּבוֹא אִישׁ
  choice: rechts, wenn man … hineingeht
  rationale: Die Wendung gibt die Lage aus der Perspektive einer eintretenden Person an. Das generische deutsche „man“ bildet diese Orientierungsangabe idiomatisch ab.
- source_word: שֹׁמְרֵי הַסַּף
  choice: die an der Schwelle Wache hielten
  rationale: Dies bewahrt sowohl das Bewachen als auch den ausdrücklich genannten Schwellenbereich und klingt im Deutschen natürlich.
- source_word: כָּל הַכֶּסֶף
  choice: alles Silber
  rationale: כֶּסֶף bedeutet wörtlich „Silber“ und kann auch Geld bezeichnen; die konkrete Bezeichnung bleibt im Haupttext erhalten.
- source_word: הַמּוּבָא
  choice: das … gebracht wurde
  rationale: Das Hophal-Partizip von בוא wird als passive Relativkonstruktion natürlich wiedergegeben.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ ist verständlich und bewahrt die Bildsprache des Ausgangstextes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt seinen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Generischer Singular אִישׁ in der räumlichen Orientierung
  choice: wenn man … hineingeht
  alternative: wenn ein Mann … hineingeht
  rationale: אִישׁ steht hier nicht zur Kennzeichnung eines bestimmten männlichen Menschen, sondern bezeichnet generisch die eintretende Person. Das deutsche „man“ gibt diese Funktion natürlich wieder, ohne den räumlichen Bezug zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem hebräischen Handlungsablauf, wird aber für gute Lesbarkeit gegliedert. „Haus Jahwes“ bewahrt die Ausgangsmetapher; „Truhe“ und „an der Schwelle Wache hielten“ sind gegenwärtig und anschaulich.
