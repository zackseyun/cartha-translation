lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: war sieben Jahre alt
  rationale: Die hebräische Altersformel aus בֶּן, Zahlwort und שָׁנִים wird im modernen Deutschen idiomatisch mit „war sieben Jahre alt“ wiedergegeben.
- source_word: יְהוֹאָשׁ
  choice: Joasch
  rationale: „Joasch“ ist die im Deutschen geläufige Namensform; die genauere Wiedergabe der hier vorliegenden hebräischen Langform „Jehoasch“ wird in der Fußnote genannt.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Präposition בְּ mit dem Infinitiv von מלך und Suffix bildet hier eine temporale Wendung. „Als er König wurde“ ist natürliches modernes Deutsch und bewahrt den Beginn seiner Königsherrschaft.
