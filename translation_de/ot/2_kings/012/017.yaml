id: 2KI.12.17
reference: 2 Kings 12:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: de
  text: Das Geld[a] von einem Schuldopfer und das Geld von Sündopfern sollte nicht in das Haus Jahwes[b] gebracht werden; es stand den Priestern zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Silber“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: in den Tempel.'
    reason: clarification
lexical_decisions:
- source_word: כֶּסֶף
  choice: Geld
  rationale: כֶּסֶף bedeutet wörtlich „Silber“, bezeichnet hier im Zusammenhang mit Tempelfinanzen jedoch Geld beziehungsweise Zahlungen.
- source_word: אָשָׁם
  choice: Schuldopfer
  rationale: Im kultischen Zusammenhang bezeichnet אָשָׁם das Schuld- beziehungsweise Wiedergutmachungsopfer; „Schuldopfer“ ist die geläufige deutsche Bezeichnung.
- source_word: חַטָּאוֹת
  choice: Sündopfer
  rationale: Der Plural bezeichnet hier Opfer einer bestimmten kultischen Kategorie und nicht abstrakte Sünden. „Sündopfer“ wahrt die herkömmliche Terminologie; „Reinigungsopfer“ wäre ebenfalls möglich.
- source_word: לֹא יוּבָא
  choice: sollte nicht … gebracht werden
  rationale: Die verneinte passive Form beschreibt im erzählerischen Zusammenhang die geltende Regel für diese Gelder. Die deutsche Formulierung gibt diesen normativen Sinn natürlich wieder.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bleibt erhalten; gemeint ist der Tempel. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: es stand den Priestern zu
  rationale: Die Klausel bezeichnet Zuweisung beziehungsweise Besitz. Das singularische „es“ nimmt das im Deutschen als Sammelbegriff verwendete „Geld“ auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. „Jahwe“ gibt den Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von חַטָּאוֹת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Beide Bezeichnungen erfassen Aspekte der Opferkategorie. „Sündopfer“ ist im Deutschen geläufiger und passt zum finanzadministrativen Zusammenhang, ohne die mögliche reinigende Funktion zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „es stand den Priestern zu“ die Zuweisung idiomatisch ausdrückt.
