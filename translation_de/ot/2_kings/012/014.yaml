id: 2KI.12.14
reference: 2 Kings 12:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: de
  text: Doch von dem Geld, das in das Haus Jahwes gebracht wurde, fertigte man für das Haus Jahwes keine silbernen Schalen[a], Dochtscheren[b], Sprengschalen[c] oder Trompeten an, ebenso keinerlei Gerät aus Gold oder Silber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: silberne Becken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Lampenscheren. Gemeint ist wahrscheinlich ein Werkzeug zur Pflege der Lampendochte.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder einfach: Schalen. Die Übersetzung »Sprengschalen« verdeutlicht ihre wahrscheinliche kultische Verwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zum vorhergehenden Vers knapp und natürlich.
- source_word: יֵעָשֶׂה
  choice: fertigte man … an
  rationale: Das unpersönliche deutsche Aktiv gibt das hebräische Passiv idiomatisch wieder, ohne einen bestimmten Handelnden einzuführen.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Bewahrt die formale Tempelbezeichnung und gibt den Gottesnamen als Eigennamen wieder.
- source_word: סִפּוֹת כֶּסֶף
  choice: silberne Schalen
  rationale: סִפּוֹת bezeichnet Gefäße beziehungsweise Schalen; die Wiedergabe unterscheidet sie von den nachfolgend genannten מִזְרָקוֹת.
- source_word: מְזַמְּרוֹת
  choice: Dochtscheren
  rationale: Im Zusammenhang mit Tempelgerät sind wahrscheinlich Werkzeuge zum Pflegen und Kürzen von Lampendochten gemeint.
- source_word: מִזְרָקוֹת
  choice: Sprengschalen
  rationale: Bezeichnet kultische Schalen, die unter anderem beim Versprengen beziehungsweise Ausschütten von Blut verwendet wurden.
- source_word: חֲצֹצְרוֹת
  choice: Trompeten
  rationale: Geläufige Bezeichnung der kultischen Metalltrompeten.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: keinerlei Gerät aus Gold oder Silber
  rationale: Gerät deckt die breite Bedeutung von כְּלִי ab; keinerlei gibt den umfassenden negativen Sinn natürlich wieder.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: von dem Geld, das … gebracht wurde
  rationale: כֶּסֶף bezeichnet hier die eingebrachten Geldmittel, nicht lediglich das Material Silber.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt entsprechend dem Hebräischen die Herkunft der Mittel voran. Fachwörter werden nur dort verwendet, wo sie unterschiedliche Tempelgeräte erkennbar auseinanderhalten; die zugehörigen Fußnoten bewahren die lexikalische Unsicherheit.
