id: 2KI.12.12
reference: 2 Kings 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: de
  text: Dann übergaben sie das abgewogene Silber[a] den Arbeitern[b], die als Aufseher über das Haus Jahwes[c] eingesetzt waren. Diese zahlten es an die Zimmerleute und die Bauleute aus, die am Haus Jahwes arbeiteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „das abgemessene Silber“ oder „das gezählte Geld“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gaben sie das Silber in die Hand der Arbeiter“.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht der Gottesname JHWH, hier mit „Jahwe“ wiedergegeben; traditionell wird er als „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: das abgewogene Silber
  rationale: מְתֻכָּן bezeichnet hier eine der Menge nach bestimmte, wahrscheinlich abgewogene Summe. „Silber“ bewahrt die konkrete Bezeichnung des Zahlungsmittels; eine Fußnote nennt weitere mögliche Wiedergaben.
- source_word: עַל יַד
  choice: übergaben … den Arbeitern
  rationale: Die Wendung bedeutet wörtlich „in die Hand geben“, bezeichnet aber idiomatisch das Anvertrauen an die Verfügungsgewalt einer Person. „Übergeben“ gibt dies in natürlichem Deutsch wieder.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: die Arbeiter
  rationale: Die Form bezeichnet diejenigen, die das Werk beziehungsweise die Arbeit ausführten. „Arbeiter“ ist knapp, gegenwärtig und kontextgerecht.
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  choice: die als Aufseher über das Haus Jahwes eingesetzt waren
  rationale: Das passive Partizip bezeichnet Beauftragte beziehungsweise Eingesetzte. Im Zusammenhang verwalten sie die Arbeiten und Gelder, sodass „als Aufseher … eingesetzt“ ihre beauftragte Verantwortung ausdrückt.
- source_word: וַיּוֹצִיאֻהוּ
  choice: Diese zahlten es … aus
  rationale: Das Verb bedeutet grundsätzlich „hinausbringen“, bezeichnet hier im finanziellen Zusammenhang jedoch das Auszahlen beziehungsweise Ausgeben der anvertrauten Mittel.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: an die Zimmerleute
  rationale: Wörtlich sind Handwerker gemeint, die Holz bearbeiten. Im Bauzusammenhang ist „Zimmerleute“ eine natürliche und präzise deutsche Bezeichnung.
- source_word: וְלַבֹּנִים
  choice: und die Bauleute
  rationale: בֹּנִים bezeichnet allgemein Bauende. „Bauleute“ bleibt weiter als das nicht ausdrücklich geforderte „Maurer“.
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: die am Haus Jahwes arbeiteten
  rationale: Die Konstruktion bezeichnet die am Tempel ausgeführte Arbeit. „Arbeiteten“ bleibt nahe am Wortlaut, ohne die Tätigkeit durch „ausbesserten“ unnötig einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den Namen im deutschen Haupttext sichtbar; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote erläutert.
- issue: Bezug des Subjekts in וַיּוֹצִיאֻהוּ
  choice: „Diese“ bezieht sich auf die eingesetzten Aufseher beziehungsweise Arbeiter
  alternative: Das ungenannte Subjekt allgemein mit „man“ oder erneut mit „sie“ wiedergeben
  rationale: Die nächstliegenden Handelnden sind die Personen, denen das Silber anvertraut wurde. „Diese“ macht den natürlichen Fortgang verständlich, ohne eine zusätzliche Personengruppe einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, und „Diese“ verdeutlicht den naheliegenden Subjektbezug. Fachsprachlich schwere Wörter wie „disbur­sieren“ oder altertümliche Berufsbezeichnungen werden vermieden.
