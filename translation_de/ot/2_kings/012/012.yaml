  source_fidelity: 'Der deutsche Text gibt die wesentlichen hebräischen Elemente sachgerecht wieder: das quantitativ bestimmte Silber als „abgewogenes Silber“, die Übergabe an die eingesetzten Arbeitsverantwortlichen, die Auszahlung an Holzhandwerker und Bauleute sowie die fortdauernde Arbeit am Haus Jahwes. „Diese“ hat einen nachvollziehbaren Bezug auf die zuvor genannten eingesetzten Arbeiter/Aufseher und führt kein neues Subjekt ein.'
