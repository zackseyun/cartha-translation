  terminology: „Jahwe“ ist eine im Deutschen etablierte Wiedergabe des Tetragramms und stimmt in der Sache mit der englischen Audit-Entscheidung „Yahweh“ überein. „Aufseher … eingesetzt“ gibt die partizipiale Beauftragung angemessen wieder, ohne die genaue Verwaltungsstruktur übermäßig festzulegen. Die Fußnoten sind korrekt verankert und erläutern die relevanten Varianten.
