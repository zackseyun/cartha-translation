  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: de
  text: Da erklärten sich die Priester damit einverstanden, kein Geld vom Volk anzunehmen und die Schäden am Haus[a] nicht auszubessern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ ist das Haus des HERRN, also der Tempel, gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: erklärten sich ... einverstanden
  rationale: Das Verb אבה bezeichnet hier Zustimmung beziehungsweise Bereitschaft. Die gewählte Formulierung gibt die Zustimmung zu den beiden folgenden verneinten Infinitivkonstruktionen natürlich wieder.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Standardentsprechung im Zusammenhang der Verwaltung des Tempels.
- source_word: לְבִלְתִּי קְחַת
  choice: kein Geld mehr ... anzunehmen
  rationale: לְבִלְתִּי mit Infinitiv bezeichnet hier das, was künftig unterlassen werden soll. Im Kontext einer bis dahin bestehenden Praxis macht „kein ... mehr“ die zeitliche Folgerung natürlich deutlich; „anzunehmen“ passt zu den von der Bevölkerung übergebenen Geldern.
- source_word: כֶּסֶף
  choice: Geld
  rationale: כֶּסֶף kann wörtlich „Silber“ bedeuten, bezeichnet im Verwaltungs- und Zahlungskontext aber Geld.
- source_word: מֵאֵת הָעָם
  choice: vom Volk
  rationale: Direkte und idiomatische Wiedergabe der Herkunftsangabe.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: nicht selbst auszubessern
  rationale: חזק bedeutet grundsätzlich „stärken“, bezeichnet zusammen mit בֶּדֶק הַבַּיִת jedoch das Beheben von Bauschäden. „Ausbessern“ gibt dieses Idiom verständlich wieder. „Selbst“ verdeutlicht im Kontext die Zuständigkeit der Priester, ohne eine neue Handlung einzuführen.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: die Schäden am Haus
  rationale: בֶּדֶק bezeichnet Risse, schadhafte Stellen oder sonstige reparaturbedürftige Schäden. „Haus“ bewahrt die hebräische Bezeichnung; eine Fußnote identifiziert es als Tempel.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Verbindung „die Schäden ... ausbessern“ übersetzt das wörtliche „die Schäden des Hauses stärken“. Nur die für heutige Leser nötige Identifikation des Hauses als Tempel wird in einer Fußnote erläutert.
