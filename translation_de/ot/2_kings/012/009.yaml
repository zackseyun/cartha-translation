- from: Da erklärten sich die Priester damit einverstanden, kein Geld mehr vom Volk anzunehmen und die Schäden am Haus[a] nicht selbst auszubessern.
  to: Da erklärten sich die Priester damit einverstanden, kein Geld vom Volk anzunehmen und die Schäden am Haus[a] nicht auszubessern.
  rationale: Die ungestützten Ergänzungen „selbst“ und „mehr“ wurden entfernt. Dadurch bleibt die Aussage bei der im Hebräischen genannten Zustimmung der Priester, weder Geld vom Volk anzunehmen noch die Schäden am Haus auszubessern. Die notwendige Tempelreferenz wird weiterhin durch die Fußnote erläutert.
