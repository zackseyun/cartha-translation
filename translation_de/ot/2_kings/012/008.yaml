source:
  edition: WLC
  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: de
  text: 'Da rief König Joasch den Priester Jojada und die Priester zu sich und sagte zu ihnen: »Warum bessert ihr die Schäden[b] am Haus[a] nicht aus? Nehmt von nun an kein Geld mehr von euren Bekannten[c], sondern gebt es zur Ausbesserung des Hauses.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ ist hier der Tempel des HERRN gemeint.
    reason: cultural_note
  - marker: b
    text: Das hebräische Wort kann Schäden, Risse oder auszuführende Reparaturen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort bedeutet wörtlich etwa „eure Bekannten“. Im Zusammenhang könnten damit die Personen gemeint sein, von denen die Priester Beiträge oder Spenden erhielten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … zu sich
  rationale: קרא bezeichnet hier das Herbeirufen. Die deutsche Wendung ist natürlich und gibt den erzählerischen Sinn präzise wieder.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: König Joasch
  rationale: Der Königstitel steht im Deutschen idiomatisch vor dem Namen; Joasch entspricht der etablierten deutschen Namensform.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: den Priester Jojada und die Priester
  rationale: Beide ausdrücklich genannten Elemente bleiben erhalten. „Andere“ wird nicht ergänzt, da es im Hebräischen nicht steht.
- source_word: אֵינְכֶם מְחַזְּקִים
  choice: bessert ihr … nicht aus
  rationale: חזק bedeutet grundsätzlich „stärken“, bezeichnet zusammen mit בדק הבית jedoch das Beheben baulicher Schäden. „ausbessern“ ist in diesem Zusammenhang idiomatisch.
- source_word: בֶּדֶק הַבָּיִת
  choice: die Schäden am Haus / die Ausbesserung der Schäden am Haus
  rationale: בדק kann eine Schadstelle, einen Riss oder den entsprechenden Reparaturbedarf bezeichnen. Die Wiedergabe hält Schaden und Ausbesserung sprachlich zusammen, ohne die Wendung unnötig zu verengen.
- source_word: וְעַתָּה
  choice: von nun an
  rationale: Die Wendung markiert hier den Übergang von der Frage zu einer neuen Anordnung und hat zugleich zeitliche Kraft.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: Nehmt … kein Geld mehr
  rationale: כסף meint in diesem Verwaltungskontext Geld, nicht lediglich das Material Silber. Das Verbot wird als direkte Aufforderung wiedergegeben.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: von euren Bekannten
  rationale: מַכָּר bezeichnet am ehesten einen Bekannten beziehungsweise eine bekannte Person. Da die genaue Funktion dieser Personen im Finanzierungsvorgang unsicher ist, wird die relationale Grundbedeutung im Haupttext bewahrt und die kontextuelle Alternative in einer Fußnote genannt.
- source_word: כִּי
  choice: sondern
  rationale: כִּי leitet hier nach dem Verbot die korrigierende Gegenanweisung ein; im Deutschen bringt „sondern“ diesen Gegensatz klar zum Ausdruck.
- source_word: תִּתְּנֻהוּ
  choice: gebt es
  rationale: Das pronominale Suffix verweist auf das Geld zurück. Die knappe Wiedergabe bewahrt die direkte Anweisung und lässt den im Hebräischen nicht genannten Empfänger offen.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die traditionellen deutschen Namensformen Joasch und Jojada werden verwendet. Die schwierige Bezeichnung מַכָּרֵיכֶם wird im Haupttext nicht vorschnell funktional als „Spender“ festgelegt; die mögliche finanzielle Funktion wird in der Fußnote erläutert.
