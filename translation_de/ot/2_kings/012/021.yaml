  source_fidelity: 'Der Text gibt die hebräische Abfolge und Aussage zuverlässig wieder: Die Diener erheben sich, zetteln eine Verschwörung an und schlagen Joasch bei Bet-Millo nieder. „Niederschlagen“ wahrt die allgemeinere Bedeutung von נכה, ohne die im unmittelbaren Wortlaut nicht eigens ausgesprochene Tötung vorwegzunehmen. Die Ortsangabe und ihre syntaktisch-topografische Offenheit werden angemessen behandelt.'
  naturalness: „Da erhoben sich seine Diener und zettelten eine Verschwörung an“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die Aufteilung in zwei Sätze ist natürlich und beeinträchtigt weder Zusammenhang noch Nachdruck. „Am Abstieg nach Silla“ ist knapp, verständlich und stilistisch passend.
  terminology: „Diener“ ist für עֲבָדָיו eine angemessen zurückhaltende Wiedergabe im höfischen Kontext. „Verschwörung anzetteln“ gibt die hebräische Verbindung von Verb und gleichstämmigem Substantiv idiomatisch wieder. Joasch, Bet-Millo und Silla sind konsistent und als Namen erkennbar transliteriert.
