  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּקֻ֥מוּ עֲבָדָ֖י/ו וַ/יִּקְשְׁרֽוּ קָ֑שֶׁר וַ/יַּכּוּ֙ אֶת יוֹאָ֔שׁ בֵּ֥ית מִלֹּ֖א הַ/יּוֹרֵ֥ד סִלָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: de
  text: Da erhoben sich seine Diener und zettelten eine Verschwörung an. Sie schlugen Joasch in Bet-Millo nieder, am Abstieg nach Silla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei dem Weg, der nach Silla hinabführt“.'
    reason: Die hebräische Wendung kann sowohl knapp als Bezeichnung des Abstiegs als auch als nähere Beschreibung eines hinabführenden Weges verstanden werden.
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עֶבֶד bezeichnet hier die dem König unterstellten Männer. „Diener“ wahrt die übliche Bedeutung, ohne ihre konkrete Amtsstellung genauer festzulegen, als es der hebräische Text tut.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: zettelten eine Verschwörung an
  rationale: Die Verbindung des Verbs קשׁר mit dem stammverwandten Substantiv קֶשֶׁר ist eine hebräische Ausdrucksweise für das Schmieden einer Verschwörung. Die gewählte Formulierung gibt dies in natürlichem Deutsch wieder, ohne die im Deutschen schwerfällige Wortwiederholung nachzuahmen.
- source_word: וַיַּכּוּ
  choice: schlugen … nieder
  rationale: נכה bedeutet grundsätzlich „schlagen“; im Zusammenhang ist der Angriff tödlich. „niederschlagen“ bewahrt den konkreten Gewaltaspekt und legt die allgemeinere Verbform nicht unnötig auf „töten“ fest.
- source_word: בֵּית מִלֹּא
  choice: Bet-Millo
  rationale: Die Wortverbindung wird als Ortsname verstanden und nach gängiger deutscher Konvention transliteriert.
- source_word: הַיּוֹרֵד סִלָּא
  choice: am Abstieg nach Silla
  rationale: Das substantivierte beziehungsweise attributive Partizip יֹרֵד bezeichnet hier den abwärtsführenden Zugang oder Weg in Richtung Silla. Die knappe Wiedergabe erhält den topografischen Sinn; die mögliche syntaktische Entfaltung wird in der Fußnote genannt.
- source_word: סִלָּא
  choice: Silla
  rationale: Der Ortsname wird transliteriert.
theological_decisions: []
