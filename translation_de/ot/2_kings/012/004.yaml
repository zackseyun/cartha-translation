source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: de
  text: Doch die Höhenheiligtümer[a] wurden nicht beseitigt; das Volk brachte dort weiterhin Schlachtopfer dar und räucherte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Höhen«; gemeint sind örtliche Kultstätten, die häufig auf Anhöhen lagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Leitet eine Einschränkung der vorausgehenden positiven Beurteilung ein und gibt die adversative Kraft knapp und natürlich wieder.
- source_word: הַבָּמוֹת
  choice: die Höhenheiligtümer
  rationale: Bezeichnet örtliche Kultstätten, häufig auf Anhöhen. »Höhenheiligtümer« bewahrt sowohl den kultischen als auch den topografischen Bezug und ist im heutigen Deutsch verständlicher als das bloße »Höhen«.
- source_word: לֹא סָרוּ
  choice: wurden nicht beseitigt
  rationale: Bei den Kultstätten als Subjekt bezeichnet סור hier ihr Fortbestehen; die deutsche Passivform gibt den praktischen Sinn des hebräischen Ausdrucks idiomatisch wieder.
- source_word: עוֹד
  choice: weiterhin
  rationale: Kennzeichnet die fortdauernde, gewohnheitsmäßige Praxis.
- source_word: הָעָם
  choice: das Volk
  rationale: Direkte und natürliche Wiedergabe des Kollektivbegriffs.
- source_word: מְזַבְּחִים
  choice: brachte Schlachtopfer dar
  rationale: Der Partizipialgebrauch beschreibt eine fortdauernde Praxis. »Schlachtopfer darbringen« unterscheidet diese Opferhandlung präzise vom folgenden Verb קטר.
- source_word: וּמְקַטְּרִים
  choice: und ließ Rauchopfer aufsteigen
  rationale: קטר bezeichnet im Kult das Verbrennen beziehungsweise Aufsteigenlassen einer Opfergabe als Rauch. Die Formulierung bewahrt die mögliche weitere Bedeutung gegenüber der engeren Festlegung auf Weihrauch.
- source_word: בַּבָּמוֹת
  choice: dort
  rationale: Der deutsche Rückverweis vermeidet eine schwerfällige Wiederholung, während der Ort eindeutig bleibt.
theological_decisions:
- issue: Bewertung des Gottesdienstes an den Höhenheiligtümern
  choice: Die örtlichen Kultstätten werden historisch beschreibend benannt, ohne die vorausgesetzte Kritik im Haupttext auszudeuten.
  alternative: Die unerlaubten Heiligtümer wurden nicht beseitigt.
  rationale: Der Vers berichtet ihr Fortbestehen und ihre Nutzung, bezeichnet sie hier aber nicht ausdrücklich als »unerlaubt«. Eine solche Ergänzung würde die implizite deuteronomistische Bewertung explizit machen.
- issue: Bedeutungsumfang von וּמְקַטְּרִים
  choice: Rauchopfer aufsteigen lassen
  alternative: Weihrauch verbrennen
  rationale: Die gewählte Formulierung erhält die kultische Bildhaftigkeit und vermeidet eine unnötige Verengung auf Weihrauch, da קטר auch das Verbrennen anderer Opfergaben bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Übersetzung folgt der knappen adversativen Struktur des Hebräischen, macht die fortdauernde Opferpraxis idiomatisch deutlich und erklärt den historisch-kultischen Fachbegriff nur in der Fußnote.
