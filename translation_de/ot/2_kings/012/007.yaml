source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁנַ֨ת עֶשְׂרִ֧ים וְ/שָׁלֹ֛שׁ שָׁנָ֖ה לַ/מֶּ֣לֶךְ יְהוֹאָ֑שׁ לֹֽא חִזְּק֥וּ הַ/כֹּהֲנִ֖ים אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/007.yaml
  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: de
  text: Im dreiundzwanzigsten Regierungsjahr des Königs Joasch hatten die Priester die Schäden am Haus[a] noch nicht ausgebessert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Tempel; wörtlich kann der Ausdruck auch „die Risse/Bruchstellen des Hauses“ bedeuten.
    reason: Der Kontext bestimmt „Haus“ als Tempel, während בֶּדֶק konkreter Risse oder Bruchstellen bezeichnen kann.
lexical_decisions:
- source_word: וַיְהִי
  choice: Im … Regierungsjahr …
  rationale: Die hebräische Erzählungsform leitet eine neue Phase des Berichts ein. Im Deutschen wird diese Funktion natürlich durch die vorangestellte Zeitangabe getragen; ein zusätzliches „Und es geschah“ wäre unnötig schwerfällig.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: Im dreiundzwanzigsten Regierungsjahr des Königs Joasch
  rationale: Die Königsjahrformel wird in idiomatischem Deutsch als „Regierungsjahr“ wiedergegeben. Der Name יְהוֹאָשׁ erscheint in der im Deutschen geläufigen biblischen Form „Joasch“.
- source_word: לֹא חִזְּקוּ
  choice: hatten … noch nicht ausgebessert
  rationale: חזק bedeutet grundsätzlich „stärken“, bezeichnet mit בֶּדֶק הַבַּיִת jedoch die bauliche Instandsetzung. Das Plusquamperfekt kennzeichnet den bis zu diesem Zeitpunkt fortbestehenden Mangel; „noch“ macht diesen zeitlichen Bezug natürlich deutlich.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte und sachgemäße Wiedergabe des Subjekts.
- source_word: בֶּדֶק הַבָּיִת
  choice: die Schäden am Haus
  rationale: בֶּדֶק bezeichnet Risse, Bruchstellen oder sonstige Bauschäden. „Haus“ bewahrt die Ausdrucksweise des Hebräischen; aus dem Zusammenhang ist der Tempel gemeint.
theological_decisions:
- issue: Bezeichnung des Heiligtums als הַבָּיִת („das Haus“)
  choice: Haus im Haupttext beibehalten und den Tempelbezug in einer Fußnote erläutern
  alternative: Tempel unmittelbar im Haupttext
  rationale: Die wörtliche Metapher des Ausgangstextes bleibt erhalten, ohne heutigen Lesern den sachlichen Bezug vorzuenthalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem Hebräischen geglättet, ohne den Zeitbezug oder den baulichen Sinn der Formulierung aufzulösen.
