base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: de
  text: und für die Maurer[a] und die Steinmetze sowie zum Kauf von Bauholz und Steinen aus dem Steinbruch[b], um die Schäden am Haus Jahwes auszubessern[c], und für alle Ausgaben für das Haus, um es instand zu setzen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bauleute“ beziehungsweise „Mauerbauer“. Das hebräische Wort kann allgemeiner Arbeiter bezeichnen, die Mauern errichten oder ausbessern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „behauene Steine“ beziehungsweise „Bruchsteine“. Wörtlich: „Steine aus dem Steinbruch“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „um den Schaden am Haus Jahwes zu stärken“; gemeint ist, die schadhaften Stellen baulich zu festigen und auszubessern.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „für alles, was für das Haus hinausgeht“; gemeint sind sämtliche Aufwendungen, um es instand zu setzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּדְרִים
  choice: Maurer
  rationale: Das Partizip bezeichnet hier Arbeiter, die Mauern errichten oder ausbessern. „Maurer“ passt zum baulichen Zusammenhang; die mögliche weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: Steinmetze
  rationale: Die Wendung bezeichnet Arbeiter, die Steine brechen oder behauen. „Steinmetze“ ist im modernen Deutschen eine natürliche Berufsbezeichnung.
- source_word: לִקְנוֹת עֵצִים
  choice: zum Kauf von Bauholz
  rationale: עֵצִים meint im Zusammenhang der Tempelreparatur Holz als Baumaterial; „Bauholz“ macht diese Funktion deutlich.
- source_word: אַבְנֵי מַחְצֵב
  choice: Bruchsteine
  rationale: Die Verbindung bezeichnet aus einem Steinbruch gewonnenen beziehungsweise zugerichteten Stein. „Bruchsteine“ ist im deutschen Baukontext knapp und verständlich; Alternativen werden in der Fußnote genannt.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: die Schäden auszubessern
  rationale: Wörtlich steht eine Verbindung aus „stärken“ und „Schaden/Riss“. Idiomatisches Deutsch verlangt hier eine Reparaturformulierung; „ausbessern“ bewahrt den baulichen Sinn, ohne das Ergebnis zu überzeichnen.
- source_word: בֶּדֶק
  choice: Schäden
  rationale: Das Substantiv bezeichnet schadhafte Stellen, Risse oder Breschen, die repariert werden müssen. Der Plural „Schäden“ ist im Deutschen kontextgerecht.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus“ erhält die hebräische Bezeichnung für den Tempel, und „Jahwe“ gibt den Gottesnamen יהוה als Eigennamen wieder.
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: und für alle Ausgaben am Haus
  rationale: Die wörtliche Wendung „alles, was für das Haus hinausgeht“ bezeichnet die dafür anfallenden Aufwendungen. „Ausgaben“ gibt das Idiom klar wieder.
- source_word: לְחָזְקָה
  choice: die seiner Instandsetzung dienten
  rationale: 'Der Infinitiv bezeichnet den Zweck der Aufwendungen: das Gebäude zu stärken beziehungsweise instand zu setzen. Die Formulierung vermeidet im Deutschen eine unnötige Wiederholung von „ausbessern“.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ erhält ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wahrt den Charakter als Fortsetzung einer Aufzählung. Fachwörter bleiben allgemein verständlich; die schwer übertragbaren hebräischen Bau- und Ausgabenformulierungen werden durch Fußnoten transparent gemacht.
