base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/016.yaml
  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: de
  text: Doch von den Männern, denen man das Geld anvertraute, um es den Arbeitern zu geben, verlangte man keine Abrechnung[a]; denn sie gingen gewissenhaft vor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Man rechnete nicht mit den Männern ab.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „treu“; auch „redlich“ oder „zuverlässig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: verlangte man keine Abrechnung
  rationale: Das Piel bezeichnet hier das Abrechnen beziehungsweise die Forderung nach Rechenschaft über die anvertrauten Gelder. Die deutsche Formulierung gibt den Sinn natürlich und präzise wieder.
- source_word: הָאֲנָשִׁים
  choice: den Männern
  rationale: Der maskuline Plural bezeichnet in diesem Zusammenhang die mit der Geldverwaltung betrauten Männer.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: denen man das Geld anvertraute
  rationale: Die hebräische Wendung bedeutet wörtlich, etwas in jemandes Hand zu geben, und bezeichnet hier die Übergabe in dessen Obhut beziehungsweise Verantwortung.
- source_word: הַכֶּסֶף
  choice: das Geld
  rationale: Obwohl כֶּסֶף auch „Silber“ bedeuten kann, sind hier die für die Tempelarbeiten bestimmten Geldmittel gemeint.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: damit sie es den Arbeitern gaben
  rationale: Die substantivierte Partizipialform bezeichnet diejenigen, die die Bau- beziehungsweise Ausbesserungsarbeiten ausführten.
- source_word: בֶאֱמֻנָה
  choice: zuverlässig
  rationale: Im Zusammenhang mit der Verwaltung von Geld bezeichnet אֱמוּנָה vertrauenswürdiges, redliches und treues Handeln.
- source_word: הֵם עֹשִׂים
  choice: sie handelten
  rationale: Die idiomatische deutsche Wiedergabe fasst die Art und Weise zusammen, in der die Männer ihre Aufgabe erfüllten.
