base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: de
  text: Immer wenn sie sahen, dass viel Silber in der Truhe war, kamen der Schreiber des Königs und der Hohepriester herauf. Sie verschnürten und zählten das Silber, das sich im Haus des HERRN befand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִרְאוֹתָם ... כִּי רַב הַכֶּסֶף
  choice: Sooft sie sahen, dass viel Silber ... war
  rationale: Die Konstruktion beschreibt im Zusammenhang einen wiederkehrenden Vorgang; „sooft“ gibt diesen iterativen Sinn natürlich wieder.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: der Schreiber des Königs
  rationale: „Schreiber“ bezeichnet hier einen königlichen Amtsträger und bleibt näher am hebräischen Titel als eine stärker deutende Amtsbezeichnung.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: der Hohe Priester
  rationale: Dies ist die geläufige deutsche Wiedergabe des wörtlich „großen Priesters“ bezeichneten Amtes.
- source_word: וַיָּצֻרוּ
  choice: Sie verschnürten
  rationale: Das Verb bezeichnet hier wahrscheinlich das Zusammenbinden beziehungsweise Verpacken des eingesammelten Silbers; „verschnürten“ bewahrt die konkrete Handlung, ohne nicht ausdrücklich erwähnte Beutel einzuführen.
- source_word: בֵּית יְהוָה
  choice: im Haus des HERRN
  rationale: „Haus“ wahrt die Tempelbezeichnung des Hebräischen; „HERR“ folgt der etablierten deutschen Wiedergabe des Gottesnamens in dieser Ausgabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle Kennzeichnung durch Kapitälchen wahrt die Unterscheidung zum gewöhnlichen Titel „Herr“, ohne eine bestimmte Aussprache des Namens festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Truhe“ ist im Kontext einer Sammeltruhe natürlich; „verschnürten“ erhält die ungewöhnlich konkrete Formulierung des Ausgangstextes.
