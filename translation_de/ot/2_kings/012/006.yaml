base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: de
  text: Die Priester sollen das Geld für sich[a] entgegennehmen, jeder von einem seiner Bekannten, und sie sollen die Schäden am Haus[b] ausbessern, überall dort, wo sich ein Schaden findet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für sich nehmen«. Das Objekt »das Geld« ist aus dem Zusammenhang ergänzt.'
    reason: implicit_object
  - marker: b
    text: Mit dem »Haus« ist hier der Tempel gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם
  choice: sollen das Geld selbst entgegennehmen
  rationale: Der Imperfekt hat im Zusammenhang anweisende Kraft. Das im unmittelbaren Kontext vorausgesetzte Geld wird zur Verständlichkeit ergänzt; לָהֶם bezeichnet, dass die Priester es selbst in Empfang nehmen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und kontextgerechte Wiedergabe im Rahmen der Tempelverwaltung.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ wird distributiv gebraucht und bezieht sich jeweils auf einen der Priester.
- source_word: מֵאֵת מַכָּרוֹ
  choice: von einem seiner Bekannten
  rationale: מַכָּר bezeichnet am unmittelbarsten einen Bekannten beziehungsweise jemanden, mit dem man Umgang oder geschäftliche Beziehungen hat. Anders als die konsultierte englische Fassung wird die mögliche Rolle als Spender nicht in den Haupttext eingetragen.
- source_word: וְהֵם יְחַזְּקוּ
  choice: und sie sollen ... ausbessern
  rationale: Das betonte Pronomen weist den Priestern selbst die Verantwortung zu. חזק bedeutet im baulichen Zusammenhang, etwas wieder fest beziehungsweise instand zu machen.
- source_word: בֶּדֶק הַבַּיִת
  choice: die Schäden am Haus
  rationale: בֶּדֶק bezeichnet eine schadhafte Stelle, einen Riss oder sonstigen baulichen Schaden. הַבַּיִת bleibt als »das Haus« erhalten.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: wo immer dort ein Schaden festgestellt wird
  rationale: Die Formulierung gibt den umfassenden Geltungsbereich der Reparaturen wieder und bewahrt die erneute Nennung von בֶּדֶק.
