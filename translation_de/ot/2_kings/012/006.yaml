- from: Die Priester sollen das Geld selbst entgegennehmen[a], jeder von einem seiner Bekannten, und sie sollen die Schäden am Haus[b] ausbessern, wo immer dort ein Schaden festgestellt wird.
  to: Die Priester sollen das Geld für sich[a] entgegennehmen, jeder von einem seiner Bekannten, und sie sollen die Schäden am Haus[b] ausbessern, überall dort, wo sich ein Schaden findet.
  rationale: Die Revision beseitigt die Mehrdeutigkeit von »das Geld selbst«, glättet die unidiomatische Schlussformulierung und begrenzt die Fußnote zur impliziten Objektangabe auf das, was der Text und sein Kontext tragen. Die lexikalische Offenheit von מַכָּר bleibt mit »Bekannter« erhalten.
