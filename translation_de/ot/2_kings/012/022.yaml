source:
  edition: WLC
  text: וְ/יוֹזָבָ֣ד בֶּן שִׁ֠מְעָת וִ/יהוֹזָבָ֨ד בֶּן שֹׁמֵ֤ר עֲבָדָי/ו֙ הִכֻּ֣/הוּ וַ/יָּמֹ֔ת וַ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: de
  text: Jozabad, der Sohn Schimeats, und Josabad, der Sohn Schomers, seine Diener[a], schlugen ihn nieder, und er starb. Man begrub ihn bei seinen Vorfahren in der Stadt Davids. Sein Sohn Amazja wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Hofbeamten. Das hebräische Wort kann Diener oder königliche Bedienstete beziehungsweise Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד
  choice: Jozabad
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition wiedergegeben; das einleitende וְ wird im Deutschen nicht eigens mit „und“ übersetzt, da der Satz als Fortsetzung bereits natürlich anschließt.
- source_word: בֶּן שִׁמְעָת
  choice: der Sohn Schimeats
  rationale: Die hebräische Abstammungsangabe wird in natürlichem, würdigem Deutsch wiedergegeben; der Eigenname bleibt transliteriert.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: und Josabad, der Sohn Schomers
  rationale: Die Namensform Josabad entspricht einer etablierten deutschen Wiedergabe von יְהוֹזָבָד; die koordinierende Konjunktion wird beibehalten.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עֶבֶד kann Diener, Sklave oder königlicher Bediensteter beziehungsweise Hofbeamter bedeuten. „Diener“ wahrt die lexikalische Breite; die kontextuell mögliche Amtsbedeutung wird in einer Fußnote genannt.
- source_word: הִכֻּהוּ
  choice: schlugen ihn nieder
  rationale: נכה bezeichnet das Schlagen oder Niederschlagen. Diese Wiedergabe bewahrt die Gewalt des Vorgangs, ohne die folgende Aussage „und er starb“ vorwegzunehmen.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: Die einfache hebräische Erzählfolge wird direkt bewahrt.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Man begrub ihn
  rationale: Das unbestimmte deutsche „man“ gibt den nicht weiter hervorgehobenen pluralischen Handlungsträger idiomatisch wieder und vermeidet, die zuvor genannten Attentäter ohne zwingenden Grund auch als Bestattende festzulegen.
- source_word: עִם אֲבֹתָיו
  choice: bei seinen Vorfahren
  rationale: Die Wendung bezeichnet die Bestattung im Zusammenhang mit den dynastischen Vorfahren. „Bei“ passt im Deutschen zur räumlichen Bestattungsaussage; „Vorfahren“ vermittelt den Sinn des hebräischen Idioms klarer als das missverständliche wörtliche „Väter“.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Dies ist die etablierte deutsche Form des Ortsnamens und wahrt die hebräische Genitivverbindung.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: Sein Sohn Amazja wurde an seiner Stelle König
  rationale: Im Thronfolgekontext hat מלך ingressiven Sinn. „Wurde König“ ist im modernen Deutsch natürlicher als „regierte“ und macht den Herrschaftsantritt deutlich.
