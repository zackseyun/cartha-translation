id: 2KI.12.20
reference: 2 Kings 12:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Die übrigen Taten Joaschs und alles, was er getan hat – sind sie nicht im Buch der Chronik der Könige von Juda[a] aufgezeichnet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Buch der Annalen der Könige von Juda«. Der hebräische Ausdruck kann eine amtliche königliche Aufzeichnung oder Chronik bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Die übrigen Taten Joaschs
  rationale: יֶתֶר bezeichnet das Übrige oder Verbleibende. דִּבְרֵי bedeutet wörtlich »Worte/Angelegenheiten«, bezeichnet in dieser königlichen Schlussformel aber die überlieferten Taten beziehungsweise Regierungsvorgänge des Königs. »Joasch« ist die im Deutschen gebräuchliche Namensform.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er getan hat
  rationale: Die Wiedergabe bewahrt sowohl die umfassende Bedeutung von כָל als auch die hebräische Relativsatzkonstruktion.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgezeichnet?
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. »Aufgezeichnet« gibt den passiven Schreib- und Archivierungsvorgang in natürlichem Deutsch wieder.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl die Präposition wörtlich »auf« bedeuten kann, ist bei einer schriftlichen Quelle im Deutschen »im Buch« idiomatisch. סֵפֶר kann Buch, Schriftstück oder Schriftrolle bezeichnen.
- source_word: דִּבְרֵי הַיָּמִים
  choice: der Chronik
  rationale: Die Wendung bedeutet wörtlich etwa »Begebenheiten der Tage« und bezeichnet hier eine fortlaufende geschichtliche beziehungsweise amtliche Aufzeichnung. »Chronik« ist eine knappe, etablierte Wiedergabe.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Das לְ bezeichnet in dieser Quellenangabe die Zuordnung der Chronik zu den Königen Judas; der deutsche Genitiv gibt diese Beziehung natürlich wieder.
