  text: כִּֽי לְ/עֹשֵׂ֥י הַ/מְּלָאכָ֖ה יִתְּנֻ֑/הוּ וְ/חִזְּקוּ ב֖/וֹ אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/015.yaml
  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: de
  text: Denn sie gaben es denen, die die Arbeit verrichteten, und sie besserten damit das Haus Jahwes[a] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Haus Jahwes“ ist der Tempel Jahwes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet, weshalb nach dem vorangehenden Vers keine Abrechnung verlangt wurde.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: denen, die die Arbeiten ausführten
  rationale: Die Wiedergabe bewahrt den partizipialen Sinn ‚den Ausführenden der Arbeit‘ und klingt zugleich natürlich und inklusiv.
- source_word: יִתְּנֻהוּ
  choice: sie gaben es
  rationale: Das Imperfekt bezeichnet im erzählenden Zusammenhang eine wiederholte beziehungsweise übliche Handlung in der Vergangenheit.
- source_word: וְחִזְּקוּ
  choice: sie besserten … aus
  rationale: Das Verb bedeutet wörtlich ‚stärken, fest machen‘, bezeichnet bei einem Gebäude aber dessen bauliche Ausbesserung oder Instandsetzung.
- source_word: בּוֹ
  choice: damit
  rationale: Das Pronomen verweist knapp und natürlich auf das zuvor erwähnte Geld beziehungsweise Silber.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die Formulierung bewahrt das hebräische Bild ‚Haus‘ und gibt den Gottesnamen als Jahwe wieder; gemeint ist der Tempel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. ‚Jahwe‘ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „sie“ wahrt die knappe hebräische Satzführung und legt den Bezug des zweiten pluralischen Verbs nicht stärker fest als der Ausgangstext.
