base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: de
  text: Dann zog Hasaël, der König von Aram,[a] gegen Gat hinauf, kämpfte gegen die Stadt und nahm sie ein. Daraufhin fasste Hasaël den Entschluss, gegen Jerusalem hinaufzuziehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Aram“ ist die hebräische Bezeichnung für ein historisches Gebiet bzw. Reich, das in traditionellen Übersetzungen oft „Syrien“ genannt wird.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Hasaël richtete sein Angesicht darauf, gegen Jerusalem hinaufzuziehen.“ Die Wendung bezeichnet einen festen Entschluss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Der zeitliche Erzählmarker leitet das nächste Geschehen in der Abfolge ein; „Dann“ ist knapp und natürlich.
- source_word: יַעֲלֶה
  choice: zog … hinauf
  rationale: עלה bezeichnet das Hinaufziehen und kann im militärischen Zusammenhang den Vormarsch gegen einen Ort ausdrücken. Die Übersetzung bewahrt sowohl die Bewegung als auch den militärischen Kontext.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hasaël, der König von Aram
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben; „Aram“ entspricht unmittelbar der hebräischen ethnogeografischen Bezeichnung.
- source_word: וַיִּלָּחֶם עַל גַּת
  choice: kämpfte gegen die Stadt
  rationale: לחם mit עַל bezeichnet hier den Kampf gegen Gat. „Die Stadt“ nimmt Gat eindeutig wieder auf und vermeidet im Deutschen eine schwerfällige Wiederholung.
- source_word: וַיִּלְכְּדָהּ
  choice: nahm sie ein
  rationale: לכד bezeichnet im Zusammenhang mit einer Stadt deren Eroberung; „einnehmen“ ist dafür die natürliche deutsche Wendung.
- source_word: וַיָּשֶׂם חֲזָאֵל פָּנָיו
  choice: richtete Hasaël seinen Sinn darauf
  rationale: Die hebräische Wendung bedeutet, sich zielgerichtet beziehungsweise entschlossen einem Vorhaben zuzuwenden. „Seinen Sinn darauf richten“ bewahrt etwas vom Bild, bleibt aber verständlich.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: gegen Jerusalem hinaufzuziehen
  rationale: Die Formulierung bewahrt das wiederholte עלה und die feindliche Richtung von עַל, ohne bereits ausdrücklich zu behaupten, dass der Angriff ausgeführt wurde.
