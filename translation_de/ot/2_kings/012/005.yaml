source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: de
  text: 'Und Joasch sagte zu den Priestern: „Alles Geld der heiligen Gaben, das in das Haus Jahwes gebracht wird – das Geld eines jeden, der gezählt wird[a], das Geld aus der Schätzung von Personen[b] und alles Geld, das jemand aus eigenem Antrieb[c] in das Haus Jahwes bringen will –“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Geld eines jeden, der hinübergeht“. Gemeint ist wahrscheinlich die Abgabe der bei einer Musterung Gezählten; vergleiche 2. Mose 30,13–16.'
    reason: lexical_alternative
  - marker: b
    text: Wahrscheinlich sind Zahlungen aufgrund der Schätzung von Personen gemeint, etwa im Zusammenhang mit den in 3. Mose 27,2–8 geregelten Schätzwerten.
    reason: cross_reference
  - marker: c
    text: 'Wörtlich: „das auf das Herz eines Mannes heraufkommt“; das hebräische Idiom bezeichnet hier den freiwilligen Entschluss zu einer Gabe.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: alles Geld der heiligen Gaben
  rationale: Die Wendung bezeichnet Geld, das mit geheiligten beziehungsweise geweihten Dingen verbunden ist. „Heilige Gaben“ klingt im Deutschen natürlich und lässt die nachfolgende Aufzählung der Einnahmearten zu.
- source_word: יוּבָא בֵית יְהוָה
  choice: das in das Haus Jahwes gebracht wird
  rationale: Das Passiv gibt den Hofal von בוא wieder; „Haus Jahwes“ bezeichnet hier den Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: das Geld eines jeden, der zu den Gemusterten hinübergeht
  rationale: Die Übersetzung bewahrt das konkrete Verb „hinübergehen“ und macht zugleich den wahrscheinlich gemeinten Musterungs- beziehungsweise Zählungskontext erkennbar.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: das Geld aus der Schätzung von Personen
  rationale: Die gedrängte kultisch-rechtliche Formulierung verweist wahrscheinlich auf festgesetzte Geldwerte für Personen, ohne dass „Gelübde“ im hebräischen Wortlaut ausdrücklich genannt wird.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: alles Geld, das jemand aus eigenem Antrieb ... bringen will
  rationale: Die deutsche Formulierung gibt die Bedeutung des hebräischen Herz-Idioms als freiwilligen inneren Entschluss natürlich wieder; die Bildlichkeit wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; „Jahwe“ bewahrt diese Funktion, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bezug von כֶּסֶף עוֹבֵר אִישׁ
  choice: Musterungs- bzw. Zählungskontext bei Bewahrung des Verbs „hinübergehen“
  alternative: das Geld eines jeden, der gezählt wird
  rationale: Der mögliche Bezug auf die Abgabe der Gemusterten in Exodus 30 ist wahrscheinlich, aber die ungewöhnliche Ausdrucksweise des hebräischen Textes soll nicht vollständig geglättet werden.
- issue: Bezug der Personenschätzung
  choice: allgemein als Geld aus der Schätzung von Personen
  alternative: Geld für gelobte Schätzwerte
  rationale: Levitikus 27 bietet einen wahrscheinlichen Hintergrund, doch der Vers selbst nennt ein Gelübde nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Joasch“ folgt der im Deutschen üblichen Namensform. Der Satz bleibt wie im hebräischen Kontext syntaktisch offen und endet mit einem Gedankenstrich, da die Anweisung im folgenden Vers fortgesetzt wird.
