  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: de
  text: Joasch tat, was in den Augen Jahwes recht war, solange der Priester Jojada ihn unterwies.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Joasch tat, was in den Augen Jahwes recht war, all die Tage, in denen der Priester Jojada ihn unterwies.“'
    reason: Die Fußnote macht die an „all die Tage“ angelehnte hebräische Satzfügung sichtbar. Sie erläutert die zeitliche Zuordnung, ohne eine im Wortlaut nicht ausdrücklich markierte Kausalbeziehung einzutragen.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: tat, was … recht war
  rationale: Die substantivierte Wendung bezeichnet Joaschs Verhalten; diese Formulierung ist im Deutschen natürlich und bewahrt die königliche Bewertungsformel.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Bewertungsmetapher bleibt transparent erhalten; der Gottesname wird als Jahwe wiedergegeben.
- source_word: כָּל יָמָיו אֲשֶׁר
  choice: solange
  rationale: Die Verbindung bezeichnet hier am natürlichsten die gesamte Zeitspanne, während der Jojada Joasch unterwies. Die wörtliche Struktur bleibt in der Fußnote sichtbar.
- source_word: הוֹרָהוּ
  choice: ihn unterwies
  rationale: Der Hifil von ירה bedeutet lehren, anweisen oder unterweisen; „unterwies“ passt zu Jojadas leitender Rolle, ohne sie näher festzulegen.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: der Priester Jojada
  rationale: Die im Deutschen natürliche Titel-Namen-Folge gibt die hebräische Apposition sachgerecht wieder.
theological_decisions:
- issue: Zeitliche Reichweite von Joaschs rechtem Handeln
  choice: Die Aussage wird auf die Zeit von Jojadas Unterweisung bezogen.
  alternative: „Joasch tat sein Leben lang, was in den Augen Jahwes recht war, weil der Priester Jojada ihn unterwies.“
  rationale: Die Stellung des Relativsatzes nach כָּל יָמָיו lässt eine zeitliche Begrenzung naheliegen. „Solange“ bewahrt die erzählerische Spannung und vermeidet die stärkere Behauptung lebenslanger Treue; die syntaktische Mehrdeutigkeit wird durch die Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Joasch“ und „Jojada“ entsprechen den geläufigen deutschen Namensformen; „Jahwe“ gibt das Tetragramm als Eigennamen wieder. Die Hauptzeile ist knapp und verständlich, während die Fußnote die echte syntaktische Mehrdeutigkeit dokumentiert.
