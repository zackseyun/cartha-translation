  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: de
  text: Die übrigen Taten Pekachs und alles, was er getan hat – siehe, sie sind im Buch der Chronik[a] der Könige Israels aufgeschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Buch der Annalen der Könige Israels«.'
    reason: Lexikalische Alternative für דִּבְרֵי הַיָּמִים innerhalb des Titels der genannten Quelle.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פֶקַח
  choice: Die übrigen Taten Pekachs
  rationale: יֶתֶר bezeichnet den Rest oder das Übrige; דִּבְרֵי meint in dieser Königsformel nicht bloß »Worte«, sondern die Taten beziehungsweise Angelegenheiten des Königs. Der Anschluss וְ wird im Deutschen durch den formelhaften Satzbeginn ausreichend wiedergegeben.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er getan hat
  rationale: Die Wiedergabe bewahrt den umfassenden Sinn von כָל und den schlichten verbalen Sinn von עָשָׂה.
- source_word: הִנָּם
  choice: sieh, sie sind
  rationale: Das präsentierende und hervorhebende הִנֵּה mit Suffix wird nicht zu einer bloßen Kopula eingeebnet. »Sieh« ist im heutigen Deutsch verständlich und bewahrt den formelhaften Nachdruck.
- source_word: כְּתוּבִים
  choice: aufgeschrieben
  rationale: Das passive Partizip bezeichnet konkret schriftlich Festgehaltenes. »Aufgeschrieben« klingt im Deutschen natürlicher als ein isoliertes »geschrieben«.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl עַל wörtlich »auf« heißen kann, ist bei einem schriftlichen Dokument im Deutschen »im Buch« idiomatisch.
- source_word: דִּבְרֵי הַיָּמִים
  choice: der Chronik
  rationale: Die Wendung bezeichnet hier eine annalistische Geschichtsaufzeichnung. »Chronik« gibt den etablierten dokumentarischen Sinn knapp und natürlich wieder.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: Das לְ bezeichnet in diesem Werktitel die Zuordnung; der deutsche Genitiv gibt den Sinn idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederkehrende königliche Schlussformel bleibt erkennbar; das präsentierende »sieh« bewahrt den Nachdruck des Hebräischen. Der Fußnotenmarker steht unmittelbar beim mehrdeutig wiedergebbaren Werktitel.
