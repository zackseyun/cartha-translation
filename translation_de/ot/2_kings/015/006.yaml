source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י עֲזַרְיָ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Sind die übrigen Taten Asarjas und alles, was er getan hat, nicht im »Buch der Chronik der Könige von Juda«[a] aufgeschrieben[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das »Buch der Chronik der Könige von Juda« bezeichnet eine königliche Chronik oder Annalensammlung, auf die in den Königsbüchern wiederholt verwiesen wird.
    reason: cultural_note
  - marker: b
    text: 'Oder: verzeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: die übrigen Taten
  rationale: Die feste Schlussformel der Königsbücher verweist auf weitere, hier nicht erzählte Vorgänge und Leistungen des Königs. »Taten« gibt דִּבְרֵי in diesem historiografischen Zusammenhang natürlicher wieder als das wörtliche »Worte«.
- source_word: עֲזַרְיָהוּ
  choice: Asarja
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Form des hebräischen Personennamens wird verwendet.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er getan hat
  rationale: Die umfassende relative Aussage wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgeschrieben?
  rationale: Die rhetorische Frage des Hebräischen bleibt erhalten. »Aufgeschrieben« bildet den konkreten Sinn von כְּתוּבִים ab und passt zum genannten Schriftwerk.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Wörtlich steht eine Verbindung mit »auf«, doch bei einem schriftlichen Werk ist »im Buch« im Deutschen die idiomatische Entsprechung.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Chronik
  rationale: Der Ausdruck bezeichnet hier eine annalistische Aufzeichnung. »Chronik« bewahrt die etablierte archivalische Bedeutung, ohne das Werk mit dem biblischen Buch der Chronik gleichzusetzen.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Das לְ bezeichnet in der Quellenüberschrift die Zuordnung; die deutsche Genitivkonstruktion gibt diese Titelfunktion natürlich wieder.
