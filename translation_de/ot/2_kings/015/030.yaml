base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: de
  text: Dann zettelte Hoschea, der Sohn Elas, eine Verschwörung gegen Pekach, den Sohn Remaljas, an[a]. Er schlug ihn nieder, tötete ihn und wurde an seiner Stelle König – im zwanzigsten Jahr Jotams, des Sohnes Usijas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht eine nachdrückliche Verbindung aus einem Verb und einem stammverwandten Substantiv, sinngemäß: „Er schmiedete eine Verschwörung.“'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text lautet: „im zwanzigsten Jahr Jotams, des Sohnes Usijas“. Diese Angabe führt innerhalb der Regierungsdaten zu einer chronologischen Schwierigkeit. Manche versuchen, sie mit der Regierungszeit des Ahas in Einklang zu bringen; die Übersetzung folgt jedoch dem überlieferten hebräischen Wortlaut.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: zettelte … eine Verschwörung … an
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet nachdrücklich das Schmieden einer Verschwörung. Die deutsche idiomatische Verbindung „eine Verschwörung anzetteln“ bewahrt beide Ausdruckselemente, ohne eine unnatürliche Wortwiederholung zu erzwingen.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: Hoschea, der Sohn Elas
  rationale: Die Eigennamen folgen geläufigen deutschen Bibelschreibungen; die Abstammungsangabe bleibt zur historischen Identifizierung erhalten.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: gegen Pekach, den Sohn Remaljas
  rationale: עַל bezeichnet in diesem Zusammenhang das feindliche Ziel der Verschwörung und wird daher mit „gegen“ wiedergegeben.
- source_word: וַיַּכֵּהוּ
  choice: Er schlug ihn nieder
  rationale: נכה bezeichnet den gewaltsamen Schlag beziehungsweise das Niederschlagen. Die anschließende ausdrückliche Tötung bleibt als eigener Handlungsschritt erhalten.
- source_word: וַיְמִיתֵהוּ
  choice: tötete ihn
  rationale: Der Hifil von מות hat hier kausative Bedeutung. „Tötete ihn“ gibt dies im modernen Deutschen klar und knapp wieder.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: wurde an seiner Stelle König
  rationale: מלך mit תַּחְתָּיו beschreibt die Thronfolge. Diese Wiedergabe ist natürlich und macht deutlich, dass Hoschea Pekachs Königtum übernahm.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: im zwanzigsten Jahr Jotams, des Sohnes Usijas
  rationale: Die masoretische Regierungsjahrformel wird unmittelbar wiedergegeben und trotz der chronologischen Schwierigkeit weder harmonisiert noch emendiert.
theological_decisions:
- issue: Chronologische Spannung in der Datierungsformel
  choice: Die masoretische Lesart „im zwanzigsten Jahr Jotams“ wird unverändert übersetzt.
  alternative: Die Angabe mit der Regierungszeit des Ahas harmonisieren oder den Text emendieren.
  rationale: Jotams Regierungszeit wird andernorts kürzer angegeben. Die Übersetzung wahrt diese Spannung des überlieferten hebräischen Textes und weist in einer Fußnote darauf hin, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt erzählerisch knapp; geläufige deutsche Namensformen und klare Verwandtschaftsangaben erleichtern das Verständnis. Der Gedankenstrich hebt die chronologisch auffällige Datierung hervor, ohne sie umzudeuten.
