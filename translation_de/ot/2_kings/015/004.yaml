  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: de
  text: Nur die Kulthöhen wurden nicht beseitigt; das Volk brachte weiterhin auf den Kulthöhen Schlachtopfer dar und ließ Opfer in Rauch aufsteigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und verbrannte Räucherwerk auf den Kulthöhen.“ Das hebräische Verb kann speziell das Verbrennen von Räucherwerk oder allgemeiner das Aufsteigenlassen eines Opfers in Rauch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet knapp die Ausnahme von der vorausgehenden positiven Beurteilung des Königs.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: Bezeichnet örtliche Kultstätten, häufig auf Anhöhen; „Kulthöhen“ ist im Deutschen verständlicher und präziser als das bloße „Höhen“.
- source_word: לֹא סָרוּ
  choice: wurden nicht beseitigt
  rationale: Bei den Kulthöhen als Subjekt bedeutet die Wendung, dass diese Kultstätten bestehen blieben.
- source_word: עוֹד
  choice: weiterhin
  rationale: Drückt die Fortdauer der kultischen Handlungen aus.
- source_word: הָעָם
  choice: das Volk
  rationale: Gibt die kollektive Bezeichnung schlicht und idiomatisch wieder.
- source_word: מְזַבְּחִים
  choice: brachte Schlachtopfer dar
  rationale: זבח bezeichnet das Darbringen von Schlachtopfern; die deutsche Wendung bewahrt den kultischen Sinn.
- source_word: וּמְקַטְּרִים
  choice: ließ Opfer in Rauch aufgehen
  rationale: Bewahrt die mögliche weitere Bedeutung des Verbs, ohne es auf das Verbrennen von Räucherwerk zu verengen.
- source_word: בַּבָּמוֹת
  choice: dort
  rationale: Nimmt die unmittelbar zuvor genannten Kulthöhen natürlich wieder auf und vermeidet eine schwerfällige Wiederholung.
theological_decisions:
- issue: Art der Kulthandlungen auf den Kulthöhen
  choice: Der Text berichtet von fortgesetzten Opfern an örtlichen Kultstätten, ohne die dort verehrte Gottheit zu benennen.
  alternative: Die Handlungen ausdrücklich als Götzendienst oder ausschließlich als unerlaubte Verehrung des HERRN bezeichnen.
  rationale: Der hebräische Vers nennt Opferhandlungen und Kulthöhen, legt aber in diesem Satz nicht fest, wem die Opfer galten. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kulthöhen“ macht den historischen Kultbezug deutlich; die zweite Satzhälfte ist zur Vermeidung einer unnatürlichen Wiederholung mit „dort“ formuliert.
