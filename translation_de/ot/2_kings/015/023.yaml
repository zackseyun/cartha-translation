base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: de
  text: Im fünfzigsten Regierungsjahr Asarjas, des Königs von Juda, wurde Pekachja, der Sohn Menahems, in Samaria König über Israel und regierte zwei Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמִשִּׁים שָׁנָה
  choice: Im fünfzigsten Regierungsjahr
  rationale: Die hebräische Datierungsformel bezeichnet das fünfzigste Jahr der Herrschaft Asarjas. „Regierungsjahr“ macht den Bezug im Deutschen klar und idiomatisch.
- source_word: לַ/עֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: Asarjas, des Königs von Juda
  rationale: Das Präfix ל bezeichnet hier den Herrscher, nach dessen Regierungszeit datiert wird; die Apposition gibt Amt und Herrschaftsgebiet an.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: In der Königsnotiz bezeichnet das Verb hier den Regierungsantritt; die anschließende Zeitangabe nennt gesondert die Dauer der Herrschaft.
- source_word: פְּקַחְיָה בֶן מְנַחֵם
  choice: Pekachja, der Sohn Menahems
  rationale: Die Namen werden nach geläufiger deutscher Bibeltradition wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet in Verbindung mit מלך den Herrschaftsbereich.
- source_word: בְּ/שֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition בְּ ist lokal; Samaria ist der Sitz seiner Herrschaft.
- source_word: שְׁנָתָיִם
  choice: zwei Jahre
  rationale: Die Dualform bedeutet „zwei Jahre“; „regierte“ wird für einen vollständigen, natürlichen deutschen Satz ergänzt.
