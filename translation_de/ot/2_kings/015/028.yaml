source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war. Er wandte sich nicht von den Sünden ab, zu denen Jerobeam, der Sohn Nebats, Israel veranlasst hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was … böse war
  rationale: Die geläufige Königsbeurteilungsformel wird in natürlichem Deutsch wiedergegeben; das narrative וַ bleibt ohne eigenes „und“, da der Satz auf Deutsch so flüssiger einsetzt.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die transparente hebräische Metapher der göttlichen Beurteilung bleibt erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לֹא סָר מִן
  choice: er wandte sich nicht von … ab
  rationale: סור mit מן bezeichnet hier das Abwenden beziehungsweise Ablassen von einer sündigen Praxis; die deutsche Wendung bildet dies idiomatisch ab.
- source_word: חַטֹּאות
  choice: Sünden
  rationale: Der Plural wird direkt und im Kontext der wiederkehrenden Königsformel angemessen wiedergegeben.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeam, des Sohnes Nebats
  rationale: Die Namen folgen ihrer etablierten deutschen Bibelform; der Patronym wird in die Genitivfügung des Satzes eingebunden.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: der Israel zur Sünde verführt hatte
  rationale: Der Hifil von חטא ist kausativ. „Zur Sünde verführen“ drückt aus, dass Jerobeam Israel zum Sündigen brachte; das Plusquamperfekt verdeutlicht das zeitlich vorausliegende Wirken.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der ausdrücklich stehende Gottesname wird als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Jerobeams Verantwortung für Israels Sünde
  choice: der Israel zur Sünde verführt hatte
  alternative: der Israel sündigen ließ
  rationale: Die kausative Verbform wird gewahrt, ohne Israels eigene Beteiligung und Verantwortung auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Königsformel bleibt erkennbar, klingt aber nicht unnötig wörtlich. Keine Fußnoten erforderlich.
