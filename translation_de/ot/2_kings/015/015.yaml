  verdict: revise
  source_fidelity: Die Grundbedeutung wird getroffen, doch „Was sonst noch über Schallum … zu berichten ist“ gibt die Formel „die übrigen Taten/Begebenheiten Schallums“ weniger unmittelbar wieder. Außerdem bezeichnet das hebräische Suffix ausdrücklich Schallums eigene Verschwörung. Das pluralische הִנָּם כְּתֻבִים verweist auf die zuvor genannten Gegenstände und sollte im Deutschen als Plural erhalten bleiben.
  naturalness: Die vorgeschlagene Fassung ist verständlich, klingt jedoch durch die Umschreibung mit „zu berichten ist“ und das nachfolgende singuläre „es ist“ etwas schwerfällig. „Die übrigen Taten … siehe, sie sind … verzeichnet“ ist zugleich quellentreuer und in einem würdigen modernen Bibelregister natürlich.
  terminology: „Schallum“, „Verschwörung“ und „Buch der Chronik der Könige von Israel“ sind angemessen. „Verzeichnet“ passt als moderne archivische Entsprechung zu „geschrieben“; „siehe“ bildet die deiktische Formel הִנָּם ohne unnötige Archaisierung ab.
  issues:
  - severity: medium
    issue: Die regnalformelhafte Aussage über Schallums „übrige Taten/Angelegenheiten“ wird zu einer allgemeinen Umschreibung mit „Was sonst noch über Schallum … zu berichten ist“ umgestaltet.
    rationale: יַתֶר דִּבְרֵי bezeichnet hier die übrigen berichteten Taten beziehungsweise Angelegenheiten. Die Umschreibung ist nicht falsch, verdeckt aber die koordinierte Struktur mit der anschließenden Verschwörung.
  - severity: medium
    issue: Das pluralische „siehe, sie sind geschrieben“ wird durch singuläres „es ist … niedergeschrieben“ ersetzt.
    rationale: הִנָּם כְּתֻבִים nimmt pluralisch auf die Taten und die Verschwörung Bezug. Die deutsche Pluralform bewahrt diesen Bezug und die demonstrative Partikel besser.
  - severity: low
    issue: Fußnote a nennt „die Verschwörung, die er verschwörte“ als wörtliche Wiedergabe.
    rationale: Diese deutsche Form ist nicht idiomatisch und kann den Eindruck einer tatsächlich möglichen Wortverbindung erwecken. Besser ist eine Erklärung der hebräischen Substantiv-Verb-Wiederholung ohne eine irreführende pseudo-wörtliche deutsche Form.
  revised_text: Die übrigen Taten Schallums und seine Verschwörung, die er anzettelte[a] – siehe, sie sind im Buch der Chronik der Könige von Israel verzeichnet.[b]
