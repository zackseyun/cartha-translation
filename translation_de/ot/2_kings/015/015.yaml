base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: de
  text: Die übrigen Taten Schallums und seine Verschwörung, die er anzettelte[a] – siehe, sie sind im Buch der Chronik der Könige von Israel verzeichnet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verbindet hier das Wort für „Verschwörung“ mit einem stammverwandten Verb („seine Verschwörung, die er verschworen hat“) und betont die Aussage dadurch.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist eine königliche Chronik beziehungsweise Quellenschrift, auf die in den Königsbüchern wiederholt verwiesen wird.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: Was sonst noch über Schallum … zu berichten ist
  rationale: Die wiederkehrende Königsformel bezeichnet die übrigen Taten beziehungsweise Angelegenheiten eines Herrschers. Diese deutsche Formulierung gibt den idiomatischen Sinn natürlich wieder, ohne דִּבְרֵי auf bloße Worte zu verengen.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: und über die Verschwörung, die er anzettelte
  rationale: קֶשֶׁר bezeichnet hier eine politische Verschwörung. Die Verbindung von Substantiv und stammverwandtem Verb wird im Deutschen sinngemäß wiedergegeben; eine wörtliche Form wie „die Verschwörung, die er verschwörte“ wäre unverständlich.
- source_word: הִנָּם כְּתֻבִים
  choice: es ist … niedergeschrieben
  rationale: הִנָּם verweist formelhaft auf die genannten Inhalte. Im modernen Deutschen trägt die hervorgehobene Satzkonstruktion diese Zeigefunktion natürlicher als das archaische „siehe“.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: im Buch der Chronik der Könige von Israel
  rationale: Die Wendung bezeichnet die in den Königsbüchern wiederholt angeführte königliche Quellenschrift. „Chronik“ gibt דִּבְרֵי הַיָּמִים idiomatisch wieder; „der Könige von Israel“ bezeichnet ihre Zuordnung.
