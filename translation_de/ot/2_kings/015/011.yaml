source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י זְכַרְיָ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/011.yaml
  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: de
  text: Die übrigen Taten Sacharjas – siehe, sie sind im Buch der Chronik[a] der Könige Israels niedergeschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Jahrbüchern der Könige Israels«.'
    reason: Lexikalische Alternative für דִּבְרֵי הַיָּמִים und die gesamte Titelwendung.
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Die übrigen
  rationale: Die Wendung eröffnet die wiederkehrende königliche Schlussformel. »Die übrigen« gibt den verbleibenden Teil natürlich wieder; das וְ wird im Deutschen nicht eigens mit »und« ausgedrückt, da der Zusammenhang die Verknüpfung trägt.
- source_word: דִּבְרֵי
  choice: Taten
  rationale: In der königlichen Zusammenfassungsformel bezeichnet דִּבְרֵי die Angelegenheiten beziehungsweise Taten einer Regierung und nicht nur gesprochene Worte.
- source_word: זְכַרְיָה
  choice: Sacharja
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: הִנָּם
  choice: siehe, sie sind
  rationale: Die deiktische Partikel lenkt ausdrücklich die Aufmerksamkeit auf den vorhandenen schriftlichen Bericht. Das markierte »siehe« bewahrt diese formelhafte Hervorhebung.
- source_word: כְּתוּבִים
  choice: niedergeschrieben
  rationale: Das passive Partizip bezeichnet einen schriftlich festgehaltenen Inhalt; »niedergeschrieben« ist im Deutschen natürlich und wahrt den Bezug zum Schreiben.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl עַל wörtlich »auf« bedeuten kann, bezeichnet die Formel hier idiomatisch den Ort innerhalb eines Schriftwerks.
- source_word: דִּבְרֵי הַיָּמִים
  choice: der Chronik
  rationale: Die Wendung bezeichnet ein annalistisches Geschichtswerk. »Chronik« ist eine knappe, verständliche und titelartige Wiedergabe; »Jahrbücher« bleibt als Alternative in der Fußnote erhalten.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Das לְ kennzeichnet hier die Zuordnung des annalistischen Werkes zu den Königen Israels; der deutsche Genitiv gibt diese Titelbeziehung natürlich wieder.
