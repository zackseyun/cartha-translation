base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: de
  text: Und die übrigen Taten Pekachjas und alles, was er tat – siehe, sie sind im Buch der Chronik der Könige Israels niedergeschrieben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Buch der Annalen der Könige Israels“.'
    reason: „Chronik“ gibt die etablierte, titelartige Bezeichnung des annalistischen Werkes wieder; „Annalen“ ist eine mögliche sachliche Alternative für דִּבְרֵי הַיָּמִים.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: In der königlichen Schlussformel bezeichnet דִּבְרֵי nicht nur Worte, sondern die Angelegenheiten und Taten des Königs; die einleitende Konjunktion muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: פְקַחְיָה
  choice: Pekachja
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die breite Bedeutung von עשה bleibt ohne nähere Spezifizierung erhalten.
- source_word: הִנָּם כְּתוּבִים
  choice: sind … niedergeschrieben
  rationale: Die deutsche Aussage gibt den präsentischen Zustand des Geschriebenseins natürlich wieder; der aufmerksamkeitslenkende Charakter von הִנָּם kann alternativ ausdrücklich mit »siehe« markiert werden.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Geschichte
  rationale: עַל סֵפֶר wird in dieser Archivformel idiomatisch mit »im Buch« wiedergegeben. דִּבְרֵי הַיָּמִים bezeichnet hier eine annalistische Geschichtsaufzeichnung.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Das לְ wird in der titelartigen Wendung idiomatisch als Zugehörigkeitsbezeichnung wiedergegeben.
