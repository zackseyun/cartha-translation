id: 2KI.15.12
reference: 2 Kings 15:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: de
  text: 'Dies war das Wort Jahwes, das er zu Jehu gesprochen hatte: »Deine Söhne werden bis zur vierten Generation auf dem Thron Israels sitzen.« Und so geschah es.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא
  choice: Dies war
  rationale: Das Pronomen weist rückblickend auf das zuvor berichtete Ereignis als Erfüllung der göttlichen Zusage.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דָּבָר bezeichnet hier eine göttliche Aussage beziehungsweise Zusage; die feste biblische Wendung bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner gebräuchlichen wissenschaftlichen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא
  choice: das er zu Jehu gesprochen hatte
  rationale: Das Plusquamperfekt verdeutlicht im natürlichen Deutschen, dass diese Aussage zeitlich vor ihrer nun festgestellten Erfüllung ergangen war.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Zitateinleiter wird idiomatisch durch einen Doppelpunkt ausgedrückt; ein zusätzliches »indem er sagte« wäre im modernen Deutsch schwerfällig.
- source_word: בְּנֵי רְבִיעִים
  choice: Deine Söhne … bis zur vierten Generation
  rationale: Die Übersetzung bewahrt die konkrete Sohnesbezeichnung und macht zugleich deutlich, dass vier aufeinanderfolgende Generationen der Linie Jehus gemeint sind.
- source_word: יֵשְׁבוּ לְךָ
  choice: werden … sitzen
  rationale: Das Sitzen auf dem Thron wird als konkrete Herrschaftsmetapher bewahrt; לְךָ ist in der deutschen Possessivbeziehung »deine Söhne« bereits natürlich mitgetragen.
- source_word: עַל כִּסֵּא יִשְׂרָאֵל
  choice: auf dem Thron Israels
  rationale: Die königliche Bildsprache des Ausgangstextes wird direkt und verständlich wiedergegeben.
- source_word: וַיְהִי כֵן
  choice: Und so geschah es
  rationale: Die knappe Erfüllungsformel wird in natürlichem modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. »Jahwe« bewahrt diesen als Namen und vermeidet die Ersetzung durch den Titel »der HERR«.
- issue: Charakter des göttlichen Wortes
  choice: Wort
  alternative: Verheißung
  rationale: »Wort« wahrt die lexikalische Breite von דָּבָר; der Zusammenhang zeigt zwar den Charakter einer Zusage, doch diese Deutung muss nicht in den Haupttext aufgenommen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, wird aber durch Plusquamperfekt und Doppelpunkt idiomatisch gestaltet. Keine Fußnoten sind erforderlich.
