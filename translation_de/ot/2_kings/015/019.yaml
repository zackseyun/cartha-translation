source:
  edition: WLC
  text: בָּ֣א פ֤וּל מֶֽלֶךְ אַשּׁוּר֙ עַל הָ/אָ֔רֶץ וַ/יִּתֵּ֤ן מְנַחֵם֙ לְ/פ֔וּל אֶ֖לֶף כִּכַּר כָּ֑סֶף לִ/הְי֤וֹת יָדָי/ו֙ אִתּ֔/וֹ לְ/הַחֲזִ֥יק הַ/מַּמְלָכָ֖ה בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: de
  text: Pul, der König von Assyrien, zog gegen das Land[a]. Da gab Menahem Pul tausend Talente Silber, damit dieser ihn dabei unterstützte, die Königsherrschaft fest in seiner Hand zu halten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „das Land“ ist wahrscheinlich das Land Israel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „damit seine Hand mit ihm sei, um die Königsherrschaft in seiner Hand zu festigen“. Gemeint ist Pults Unterstützung beziehungsweise sein Rückhalt für Menahem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: zog
  rationale: Beim militärischen Vorgehen gegen ein Land bezeichnet בוא hier das Heranziehen beziehungsweise Einrücken; „zog gegen“ gibt die Verbindung mit עַל natürlich und präzise wieder.
- source_word: פ֤וּל
  choice: Pul
  rationale: Der Personenname wird transliteriert.
- source_word: מֶֽלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: עַל הָאָרֶץ
  choice: gegen das Land
  rationale: עַל bezeichnet nach einem Verb militärischer Bewegung den feindlichen Vorstoß; „das Land“ bewahrt die knappe, im Zusammenhang auf Israel bezogene Bezeichnung.
- source_word: וַיִּתֵּן
  choice: Da gab
  rationale: נתן bedeutet grundlegend „geben“; „Da“ bildet den erzählerischen Anschluss des Wayyiqtol ab, ohne die Zahlung ausdrücklich als Tribut oder Bestechung festzulegen.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: tausend Talente Silber
  rationale: „Talent“ ist die geläufige deutsche Bezeichnung der antiken Gewichtseinheit ככר; Silber bezeichnet das gewogene Zahlungsmittel.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: damit dieser ihn dabei unterstützte
  rationale: Die hebräische Wendung „damit seine Hand mit ihm sei“ ist ein Idiom für Beistand oder politische Unterstützung. Die Pronomen werden im Deutschen zur Vermeidung von Unklarheit expliziert.
- source_word: לְהַחֲזִיק
  choice: fest ... zu halten
  rationale: Der Hifil von חזק bedeutet hier, Menahems Herrschaft zu festigen beziehungsweise zu sichern; zusammen mit בְּיָדוֹ lässt sich die hebräische Bildsprache natürlich als „fest in seiner Hand halten“ wiedergeben.
- source_word: הַמַּמְלָכָה
  choice: die Königsherrschaft
  rationale: ממלכה kann sowohl das Reich als auch die Ausübung des Königtums bezeichnen. Hier geht es um die Sicherung von Menahems eigener Herrschaft, daher ist „Königsherrschaft“ kontextuell genauer als „Königreich“.
- source_word: בְּיָדוֹ
  choice: in seiner Hand
  rationale: Die Wendung bezeichnet Menahems Verfügungsgewalt; das deutsche Idiom bewahrt zugleich das Bild des hebräischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die schwer verständliche doppelte Hand-Metapher wird im Haupttext teilweise idiomatisch aufgelöst, in der Fußnote jedoch wörtlich dokumentiert. „Königsherrschaft“ verdeutlicht, dass Menahem seine Herrschaft sichern wollte, ohne den politischen Vorgang konfessionell oder theologisch auszudeuten.
