  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: de
  text: Im zweiundfünfzigsten Regierungsjahr Asarjas, des Königs von Juda, wurde Pekach, der Sohn Remaljas, in Samaria König über Israel und regierte zwanzig Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: Im zweiundfünfzigsten Regierungsjahr
  rationale: Die hebräische Datierungsformel bezeichnet das gezählte Jahr einer Herrschaft. „Regierungsjahr“ macht diesen Bezug im Deutschen klar und idiomatisch.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: Asarjas, des Königs von Juda
  rationale: Der Dativ mit לְ ordnet das Regierungsjahr Asarja zu; die Apposition gibt seinen Königstitel ausdrücklich wieder.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: In der Königsnotiz bezeichnet das Verb hier den Regierungsantritt. Diese Wiedergabe unterscheidet ihn von der anschließenden Angabe der Regierungsdauer.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: Pekach, der Sohn Remaljas
  rationale: Die Namensformen folgen einer geläufigen deutschen Transliteration; das Patronym wird transparent als Sohnschaft ausgedrückt.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bei מלך bezeichnet den Herrschaftsbereich und wird direkt mit „über“ wiedergegeben.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition bezeichnet den Ort beziehungsweise Regierungssitz.
- source_word: עֶשְׂרִים שָׁנָה
  choice: zwanzig Jahre
  rationale: Direkte und natürliche Wiedergabe der angegebenen Regierungsdauer.
