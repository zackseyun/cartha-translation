base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: de
  text: Im achtunddreißigsten Regierungsjahr Asarjas, des Königs von Juda, wurde Secharja, der Sohn Jerobeams, König über Israel. Er regierte in Samaria sechs Monate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: Im achtunddreißigsten Regierungsjahr
  rationale: Die hebräische Kardinalzahl hat in der Datierungsformel ordinale Funktion. „Regierungsjahr“ macht im Deutschen den Bezug auf die Herrschaftszeit natürlich und eindeutig.
- source_word: לַעֲזַרְיָהוּ מֶלֶךְ יְהוּדָה
  choice: Asarjas, des Königs von Juda
  rationale: Das Präfix ל bezeichnet hier das Bezugsjahr der Regierung Asarjas; die Apposition gibt Amt und Herrschaftsgebiet wieder.
- source_word: מָלַךְ
  choice: wurde … König; er regierte
  rationale: Das Verb bezeichnet hier sowohl den Herrschaftsantritt als auch, zusammen mit der Zeitangabe, die Dauer der Regierung. Die deutsche Zweiteilung gibt beide Funktionen klar wieder.
- source_word: זְכַרְיָהוּ
  choice: Secharja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בֶן יָרָבְעָם
  choice: der Sohn Jerobeams
  rationale: Natürliche deutsche Wiedergabe der Abstammungsangabe.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet mit מלך den Herrschaftsbereich.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition bezeichnet den Ort beziehungsweise Regierungssitz.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: sechs Monate
  rationale: Der adverbiale Akkusativ gibt die Dauer seiner Regierung an.
