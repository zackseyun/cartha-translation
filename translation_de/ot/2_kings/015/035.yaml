source:
  edition: WLC
  text: רַ֤ק הַ/בָּמוֹת֙ לֹ֣א סָ֔רוּ ע֗וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמ֑וֹת ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: de
  text: Nur die Kulthöhen wurden nicht beseitigt; das Volk brachte weiterhin auf den Kulthöhen Schlachtopfer dar und ließ Opferrauch aufsteigen.[a] Er baute das obere Tor des Hauses Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verbrannte Räucherwerk“. Das hebräische Verb kann speziell das Verbrennen von Räucherwerk oder allgemeiner das Aufsteigenlassen von Opferrauch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Markiert die Ausnahme von der vorausgehenden positiven Beurteilung knapp und natürlich.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: die Kulthöhen / auf den Kulthöhen
  rationale: Bezeichnet örtliche Kultstätten und vermeidet das Missverständnis rein geografischer Höhen.
- source_word: לֹא סָרוּ
  choice: wurden nicht beseitigt
  rationale: 'Gibt die kontextuelle Bedeutung der hebräischen Wendung idiomatisch wieder: Die Kultstätten blieben bestehen.'
- source_word: עוֹד
  choice: weiterhin
  rationale: Kennzeichnet die fortdauernde kultische Praxis.
- source_word: מְזַבְּחִים
  choice: brachte ... Schlachtopfer dar
  rationale: Das Partizip beschreibt eine anhaltende Gewohnheit; זבח bezeichnet hier das Darbringen von Schlachtopfern.
- source_word: וּמְקַטְּרִים
  choice: ließ Opferrauch aufsteigen
  rationale: Bewahrt die mögliche weitere Bedeutung von קטר, ohne den Vorgang ausschließlich auf das Verbrennen von Räucherwerk festzulegen.
- source_word: הוּא בָּנָה
  choice: Er baute
  rationale: Gibt Verb und Subjektpronomen schlicht wieder; eine stärkere Hervorhebung ist im Deutschen nicht nötig.
- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: das obere Tor am Haus Jahwes
  rationale: הָעֶלְיוֹן kennzeichnet die Lage des Tores; „am Haus“ macht die Zugehörigkeit im Deutschen natürlich verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt dessen Charakter als Gottesname.
- issue: Art des mit קטר bezeichneten Opferhandelns
  choice: ließ Opferrauch aufsteigen
  alternative: verbrannte Räucherwerk
  rationale: Das Verb kann Räucherwerk im engeren Sinn oder das Aufsteigenlassen von Opferrauch allgemeiner bezeichnen; die Hauptfassung lässt diese Bedeutungsbreite bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kulthöhen“ ist für heutige Leser eindeutiger als das missverständliche „Höhen“. Die koordinierte Dauerhandlung des hebräischen Satzes wird mit „weiterhin“ wiedergegeben.
