  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: de
  text: Und Asarja legte sich zu seinen Vätern[a], und man begrub ihn bei seinen Vätern in der Stadt Davids. Sein Sohn Jotam wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »legte sich zu seinen Vorfahren«. Die hebräische Wendung »sich zu seinen Vätern legen« ist eine feste Umschreibung für Tod und Begräbnis bei den vorausgegangenen Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Bewahrt im Zusammenhang mit »zu seinen Vätern« den hebräischen Euphemismus für den Tod, ohne ihn unmittelbar zu »starb« zu verflachen.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern / bei seinen Vätern
  rationale: Die traditionelle Wendung »sich zu seinen Vätern legen« gibt die Sterbeformel natürlich wieder; beim Begräbnis ist »bei seinen Vätern« im Deutschen räumlich klarer. »Vorfahren« bleibt als verständliche Alternative in der Fußnote erhalten.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: man begrub ihn
  rationale: Das unbestimmte deutsche »man« entspricht dem aktiven hebräischen Plural mit nicht genanntem Subjekt natürlicher als ein wörtliches »sie«.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Gibt die feste Ortsbezeichnung klar und in geläufiger deutscher Bibelsprache wieder.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang der Thronfolge bringt die deutsche ingressiv formulierte Wendung den Beginn der Königsherrschaft natürlich zum Ausdruck.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Bezeichnet präzise die Nachfolge im königlichen Amt und vermeidet die rein zeitliche Abschwächung »nach ihm«.
