base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: de
  text: Da verschwor sich Schallum, der Sohn des Jabesch, gegen ihn und schlug ihn vor dem Volk[a] nieder, tötete ihn und wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in aller Öffentlichkeit“ oder „vor der Versammlung“. Die hebräische Wendung קָבָל־עָם ist schwierig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: verschwor sich gegen ihn
  rationale: קשר bezeichnet im Zusammenhang eines Thronwechsels eine Verschwörung gegen den König. Die reflexive deutsche Wendung ist natürlich und bewahrt den politischen Sinn.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: Schallum, der Sohn des Jabesch
  rationale: Die Eigennamen folgen der im Deutschen üblichen biblischen Form; בן wird mit der genealogischen Wendung „der Sohn des“ wiedergegeben.
- source_word: וַיַּכֵּהוּ
  choice: schlug ihn … nieder
  rationale: נכה bezeichnet hier den gewaltsamen Angriff. „Niederschlagen“ wahrt die Abfolge, da erst das folgende Verb ausdrücklich das Töten bezeichnet.
- source_word: קָבָל־עָם
  choice: vor den Augen des Volkes
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich ein Geschehen in Gegenwart des Volkes beziehungsweise in aller Öffentlichkeit. Diese Wiedergabe ist verständlich und bleibt nahe am vermuteten Sinn.
- source_word: וַיְמִיתֵהוּ
  choice: tötete ihn
  rationale: Der Hifil von מות bedeutet „töten“ beziehungsweise „zu Tode bringen“. Das eigene Verb bewahrt die ausdrückliche Aussage des hebräischen Textes nach dem Niederschlagen.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: wurde an seiner Stelle König
  rationale: מלך mit תחתיו bezeichnet die Thronnachfolge. Die Formulierung ist im heutigen Deutsch natürlicher als „regierte an seiner Stelle“ und macht den Herrschaftsantritt deutlich.
