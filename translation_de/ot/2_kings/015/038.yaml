source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹתָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ אָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: de
  text: Und Jotam legte sich zu seinen Vätern[a] und wurde bei seinen Vätern in der Stadt Davids, seines Vaters[b], begraben. Sein Sohn Ahas wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu seinen Vorfahren«. Wörtlich steht im Hebräischen »zu seinen Vätern«, eine feste königliche Todesformel.'
    reason: lexical_alternative
  - marker: b
    text: »Seines Vaters« bezeichnet David hier als Vorfahren und dynastischen Stammvater, nicht als Jotams unmittelbaren leiblichen Vater.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Die Verbindung mit »zu seinen Vätern« ist eine feste königliche Todesformel. »Legte sich« bewahrt das hebräische Bild; die anschließende Bestattung macht deutlich, dass Jotams Tod gemeint ist.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die traditionelle deutsche Wendung gibt die hebräische königliche Todesformel knapp und formal entsprechend wieder. Gemeint sind die Vorfahren.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Die passive Form entspricht dem Hebräischen und klingt im Deutschen natürlich.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: in der Stadt Davids, seines Vaters
  rationale: Die Formulierung bleibt eng am Hebräischen und bewahrt dessen Verwandtschaftsbezeichnung; »Vater« bezeichnet hier den dynastischen Stammvater David.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im deutschen Thronfolgekontext drückt »wurde König« den Beginn der Herrschaft natürlicher aus als das isolierte »regierte«.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung gibt den Gedanken der Nachfolge beziehungsweise Ablösung genau und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von »seines Vaters« bei David
  choice: David als dynastischer Vater beziehungsweise Vorfahr
  alternative: David als unmittelbarer leiblicher Vater
  rationale: Jotams unmittelbarer Vater war Usija beziehungsweise Asarja. Daher bezeichnet אָבִיו David hier als Stammvater der davidischen Königslinie. Die Hauptübersetzung bewahrt dennoch die konkrete hebräische Verwandtschaftsbezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusster Bewahrung der hebräischen Todesformel. Die Satzteilung vor der Thronfolgenotiz verbessert die Verständlichkeit, ohne die Ereignisfolge zu verändern.
