  text: שַׁלּ֤וּם בֶּן יָבֵישׁ֙ מָלַ֔ךְ בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לְ/עֻזִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ יֶֽרַח יָמִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: de
  text: Schallum, der Sohn Jabeschs, wurde im neununddreißigsten Regierungsjahr Usijas, des Königs von Juda, König. Er regierte einen Monat lang[a] in Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Monat von Tagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלַךְ
  choice: wurde … König
  rationale: Das Qatal bezeichnet hier im Rahmen der Regierungsjahrformel Schallums Thronbesteigung, nicht allgemein die Dauer seiner Herrschaft.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: im neununddreißigsten Regierungsjahr
  rationale: Die Ergänzung „Regierungs-“ macht die hebräische Synchronismusformel im Deutschen eindeutig und idiomatisch.
- source_word: לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: Usijas, des Königs von Juda
  rationale: Das ל bezeichnet hier das Regierungsjahr, das nach Usijas Herrschaft gezählt wird; die Apposition wird in natürlichem Deutsch wiedergegeben.
- source_word: וַיִּמְלֹךְ
  choice: Er regierte
  rationale: Das Wayyiqtol führt von der Thronbesteigung zur Dauer der Herrschaft weiter.
- source_word: יֶרַח יָמִים
  choice: einen Monat lang
  rationale: Dies gibt die Bedeutung der hebräischen Zeitangabe in natürlichem modernem Deutsch wieder; die ungewöhnliche wörtliche Form bleibt in der Fußnote sichtbar.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die lokale Präposition ב wird direkt mit „in“ wiedergegeben; Samaria bezeichnet den Ort seiner Herrschaft.
