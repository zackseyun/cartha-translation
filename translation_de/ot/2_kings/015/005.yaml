base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: de
  text: Und Jahwe schlug den König, und er war bis zum Tag seines Todes aussätzig[a]. Er wohnte in einem abgesonderten Haus[b]. Jotam aber, der Sohn des Königs, stand dem Palast vor und sprach dem Volk des Landes Recht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck bezeichnet eine schwere, kultisch verunreinigende Hauterkrankung, aber nicht notwendigerweise die heute als Lepra bekannte Hansen-Krankheit.
    reason: lexical_alternative
  - marker: b
    text: Die Bedeutung der hebräischen Wendung ist unsicher; im Zusammenhang ist wahrscheinlich ein abgesonderter oder isolierter Wohnsitz gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als gebräuchliche deutsche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיְנַגַּע
  choice: schlug
  rationale: Bezeichnet hier eine von Gott verursachte Heimsuchung; „schlug“ bewahrt die göttliche Urheberschaft, ohne die Art des Geschehens näher festzulegen.
- source_word: מְצֹרָע
  choice: aussätzig
  rationale: Bewahrt den traditionellen, kompakten Ausdruck; eine Fußnote macht deutlich, dass der hebräische Begriff nicht zwingend die moderne Hansen-Krankheit bezeichnet.
- source_word: עַד יוֹם מֹתוֹ
  choice: bis zum Tag seines Todes
  rationale: Erhält die feierliche hebräische Zeitangabe in natürlichem Deutsch.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: in einem abgesonderten Haus
  rationale: Die schwierige Wendung bezeichnet im Zusammenhang wahrscheinlich einen getrennten Wohnsitz; diese Wiedergabe vermeidet den irreführenden Wortsinn „Haus der Freiheit“.
- source_word: עַל הַבַּיִת
  choice: stand dem Palast vor
  rationale: Die Wendung bezeichnet hier am ehesten die Leitung des königlichen Hauses beziehungsweise Palastes; die deutsche Formulierung macht die administrative Funktion deutlich.
- source_word: שֹׁפֵט
  choice: sprach ... Recht
  rationale: Gibt die fortlaufende richterliche beziehungsweise regierende Tätigkeit idiomatisch wieder, ohne sie auf moderne Regierungsverwaltung zu reduzieren.
- source_word: עַם הָאָרֶץ
  choice: Volk des Landes
  rationale: Bewahrt den hebräischen Ausdruck und seine mögliche soziale beziehungsweise politische Färbung.
theological_decisions:
- issue: Art der mit מְצֹרָע bezeichneten Erkrankung
  choice: Im Haupttext steht der traditionelle Ausdruck „aussätzig“.
  alternative: „mit einer schweren Hautkrankheit behaftet“
  rationale: Der Text erlaubt keine sichere moderne Diagnose. Der bekannte Ausdruck bleibt erhalten, während die Fußnote die medizinische Unbestimmtheit wahrt.
- issue: Verhältnis von Gottes Handeln und der Erkrankung
  choice: „Jahwe schlug den König, sodass er ... aussätzig war“
  alternative: „Jahwe suchte den König heim, und er wurde ... aussätzig“
  rationale: Die Formulierung bewahrt die ausdrückliche göttliche Urheberschaft des hebräischen Textes, ohne einen Grund für die Heimsuchung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung mit „während“ verdeutlicht Jotams gleichzeitige Amtsführung. „Dem Palast vorstehen“ ist natürlicher als die wörtliche Wendung „über dem Haus sein“, und „Recht sprechen“ erhält die richterliche Dimension von שׁפט.
