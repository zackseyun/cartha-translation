  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: de
  text: 'Da zog Menahem das Geld von Israel ein, und zwar von allen vermögenden Männern[a], um es dem König von Assyrien zu geben: von jedem einzelnen Mann fünfzig Schekel Silber. Daraufhin kehrte der König von Assyrien um und blieb nicht dort im Land.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von allen angesehenen Männern“ oder „von allen tapferen Männern“. Die hebräische Wendung kann Männer von militärischer Stärke, gesellschaftlichem Ansehen oder Vermögen bezeichnen; im Zusammenhang dieser Abgabe liegt „vermögende Männer“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא ... אֶת הַכֶּסֶף עַל יִשְׂרָאֵל
  choice: zog ... das Geld von Israel ein
  rationale: Das Hifil von יצא bedeutet wörtlich „herausbringen“, bezeichnet hier mit כסף und עַל jedoch die Erhebung beziehungsweise Einziehung der auferlegten Geldsumme. „einziehen“ gibt den fiskalischen und verpflichtenden Sinn natürlich wieder.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: und zwar von allen vermögenden Männern
  rationale: Die Wendung kann militärische Stärke, gesellschaftliches Ansehen oder wirtschaftliche Leistungsfähigkeit bezeichnen. Da von jedem Angehörigen dieser Gruppe eine hohe Geldabgabe erhoben wird, ist hier der Vermögensaspekt wahrscheinlich; die Fußnote bewahrt die anderen möglichen Bedeutungen.
- source_word: לָתֵת לְמֶלֶךְ אַשּׁוּר
  choice: um es dem König von Assyrien zu geben
  rationale: Die finale Infinitivkonstruktion wird direkt und im Deutschen natürlich als Zweckangabe wiedergegeben; das Pronomen „es“ nimmt das Geld auf.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד
  choice: von jedem Einzelnen fünfzig Schekel Silber
  rationale: Die Gewichts- und Metallangabe bleibt formal erhalten. Im Kontext bezeichnet לְאִישׁ אֶחָד den auf jeden Mann entfallenden beziehungsweise von ihm erhobenen Betrag.
- source_word: וַיָּשָׁב מֶלֶךְ אַשּׁוּר
  choice: Daraufhin zog der König von Assyrien wieder ab
  rationale: שׁוב bedeutet zurückkehren oder umkehren. „wieder abziehen“ macht in Verbindung mit dem folgenden Satz natürlich deutlich, dass der assyrische König das Land verließ.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: und blieb nicht dort im Land
  rationale: עמד heißt wörtlich „stehen“, hat hier aber idiomatisch den Sinn „bleiben, sich weiter aufhalten“.
