translation_notes:
  register: Moderne, würdige Standardsprache. „Schekel“ bleibt als historische Gewichts- und Geldeinheit unübersetzt. Die Satzgliederung verdeutlicht den pro Person erhobenen Betrag, ohne zusätzliche Sachinformationen einzuführen.
