source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: de
  text: Da verschwor sich Pekach, der Sohn Remaljas, sein Offizier[a], gegen ihn. Er schlug ihn in Samaria nieder, in der Burg des Königshauses[b], mit Argob und Arje[c]; bei ihm waren fünfzig Männer aus den Reihen der Gileaditer[d]. So tötete er ihn und wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Hauptmann“. Das hebräische Wort bezeichnet einen hochrangigen Amtsträger, vermutlich einen Offizier; der genaue Rang ist ungewiss.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Palast des Königshauses“. Das hebräische Wort kann einen Palast oder eine befestigte königliche Residenz bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Arje ist hier wahrscheinlich ein Personenname; das hebräische Wort bedeutet sonst „Löwe“. Die hebräische Satzfügung kann auch so verstanden werden, dass Argob und Arje zusammen mit dem König niedergeschlagen wurden.
    reason: lexical_and_syntactic_ambiguity
  - marker: d
    text: 'Wörtlich: „fünfzig Männer von den Gileaditern“. Gemeint sind Männer aus den Reihen der Gileaditer.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: verschwor sich gegen ihn
  rationale: קשר bezeichnet im politischen Zusammenhang der Königebücher eine Verschwörung gegen den Herrscher. Die reflexive deutsche Wendung ist natürlich und bewahrt den Gedanken des Hochverrats.
- source_word: שָׁלִישׁוֹ
  choice: sein Offizier
  rationale: שָׁלִישׁ bezeichnet einen hochrangigen, wohl militärischen Amtsträger; da der genaue Rang unsicher ist, vermeidet „Offizier“ eine unbelegte Präzisierung.
- source_word: וַיַּכֵּהוּ
  choice: Er schlug ihn … nieder
  rationale: נכה bedeutet schlagen oder niederschlagen. Die Wiedergabe unterscheidet diese Handlung von dem später ausdrücklich genannten Töten.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: in der Festung des Königshauses
  rationale: אַרְמוֹן kann einen Palast oder eine befestigte Residenz bezeichnen. „Festung des Königshauses“ gibt den möglichen Befestigungscharakter wieder und vermeidet die schwerfällige Doppelung „Palast des Königspalastes“.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: mit Argob und Arje
  rationale: Die beiden Ausdrücke werden im Erzählzusammenhang am ehesten als Personennamen verstanden. אֵת kann hier komitativ „mit“ verstanden werden; die syntaktisch mögliche Auffassung als weitere Getötete wird in der Fußnote offengehalten.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: bei ihm waren fünfzig Männer aus den Reihen der Gileaditer
  rationale: Die verblose Begleitumstandsangabe bezeichnet die Männer, die Pekach bei sich hatte. „Aus den Reihen“ wahrt den partitiven Sinn von מִן in gut verständlichem Deutsch.
- source_word: וַיְמִיתֵהוּ
  choice: So tötete er ihn
  rationale: Die Hifil-Form von מות bedeutet „zu Tode bringen“. Das direkte deutsche Verb ist natürlich und bleibt vom vorherigen „niederschlagen“ unterschieden.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: und wurde an seiner Stelle König
  rationale: Die übliche Nachfolgeformel wird im Deutschen idiomatisch als Übernahme des Königtums wiedergegeben.
