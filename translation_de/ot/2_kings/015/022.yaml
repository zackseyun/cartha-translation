base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/022.yaml
  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: de
  text: Und Menahem legte sich zu seinen Vätern[a]. Sein Sohn Pekachja wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schlief bei seinen Vätern“. Die hebräische Wendung ist eine feste Formel für den Tod eines Königs und die anschließende Thronfolge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Bewahrt das Bild des hebräischen Verbs שׁכב innerhalb der festen Todesformel, ohne die Bedeutung lediglich mit „starb“ wiederzugeben.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die im Deutschen vertraute biblische Wendung erhält den formelhaften und dynastischen Charakter des hebräischen Ausdrucks.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang der Thronfolge bezeichnet מלך hier den Regierungsantritt; „wurde König“ ist im modernen Deutsch natürlicher als „regierte“ und macht die Sukzession deutlich.
- source_word: פְּקַחְיָה
  choice: Pekachja
  rationale: Der Personenname wird nach üblicher deutscher Bibeltradition transliteriert.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Die ausdrückliche Sohnesbezeichnung des hebräischen Textes bleibt erhalten.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Gibt die Ablösung und Thronfolge präzise und idiomatisch wieder.
