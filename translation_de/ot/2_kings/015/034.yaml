source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes richtig war, ganz so, wie es sein Vater Usija[a] getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser König wird an anderen Stellen auch Asarja genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Waw-Konsekutiv führt die Erzählung fort; im eigenständig zitierten Vers wird der einfache deutsche Erzählstil ohne einleitendes „Und“ verwendet.
- source_word: הַיָּשָׁר
  choice: was … richtig war
  rationale: Die Wendung עשה הישר bedeutet idiomatisch, das zu tun, was richtig beziehungsweise recht ist. Die gewählte Formulierung ist natürlich und bewahrt die wertende Aussage.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die deutsche Wiedergabe erhält das hebräische Bild der Beurteilung aus Gottes Sicht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: Die Formulierung drückt die umfassende Übereinstimmung mit dem Vorbild des Vaters in natürlichem Deutsch aus.
- source_word: עֻזִיָּהוּ
  choice: Usija
  rationale: Der masoretische Text nennt hier ausdrücklich Usija; die Wiedergabe wird nicht an die andernorts belegte Namensform Asarja angeglichen.
- source_word: אָבִיו
  choice: sein Vater
  rationale: Hier ist der unmittelbare genealogische Sinn gemeint.
- source_word: עָשָׂה
  choice: getan hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass die Taten Usijas zeitlich vorausliegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt dessen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Name des Vaters
  choice: Usija
  alternative: Asarja
  rationale: Die Hauptübersetzung folgt der in diesem Vers überlieferten Form עֻזִּיָּהוּ; die andere biblisch belegte Namensform wird in einer Fußnote genannt, ohne den Text zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bewertungsformel wird bildnah wiedergegeben; der Satzbau bleibt zugleich flüssig und allgemein verständlich.
