id: 2KI.15.24
reference: 2 Kings 15:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war. Er wandte sich nicht von den Sünden Jerobeams, des Sohnes Nebats, ab, der Israel zum Sündigen gebracht hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was … böse war
  rationale: Die feste Königsbeurteilungsformel wird im Deutschen natürlich wiedergegeben; das eröffnende Waw muss nicht eigens mit „und“ übersetzt werden.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Wendung bezeichnet Gottes Beurteilung. „In den Augen“ wahrt das Bild und ist im Deutschen verständlich; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לֹא סָר מֵחַטֹּאות
  choice: Er wandte sich nicht von den Sünden … ab
  rationale: סור bezeichnet hier das Abkehren von einer sündigen Handlungsweise. Die Formulierung ist quellennah und zugleich gegenwärtiges Standarddeutsch.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeams, des Sohnes Nebats
  rationale: Der Genitiv bindet die Sünden eindeutig an Jerobeam; die Apposition gibt das hebräische Patronym vollständig wieder.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: der Israel zum Sündigen gebracht hatte
  rationale: Die Formulierung bildet den kausativen Hifil von חטא ausdrücklich ab, ohne die konkrete Art der Einflussnahme näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im modernen Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verantwortung Jerobeams für Israels Sünde
  choice: der Israel zum Sündigen gebracht hatte
  alternative: der Israel zur Sünde verführt hatte
  rationale: Die gewählte Fassung bewahrt die kausative Aussage des Hifil, ohne durch „verführt“ eine spezifischere Art der Einwirkung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle regnal-theologische Formel bleibt erkennbar, wird aber ohne unnötig altertümliche Syntax formuliert.
