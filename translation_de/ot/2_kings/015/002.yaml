  variant: modern standard German
source:
  edition: WLC
  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: de
  text: Er war sechzehn Jahre alt, als er König wurde, und regierte zweiundfünfzig Jahre in Jerusalem. Seine Mutter hieß Jekolja und stammte aus Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Er war sechzehn Jahre alt
  rationale: Die wörtliche hebräische Wendung »ein Sohn von sechzehn Jahren« ist eine übliche Altersangabe; die gewählte Form ist natürliches modernes Deutsch und bewahrt die genaue Altersangabe.
- source_word: הָיָה בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet sein Alter bei der Thronbesteigung. Diese Wiedergabe ist klar und entspricht dem zeitlichen Sinn.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: zweiundfünfzig Jahre
  rationale: Natürliche deutsche Wiedergabe der hebräischen Zahlform.
- source_word: מָלַךְ
  choice: regierte
  rationale: Im Rahmen der Königsformel bezeichnet das Verb die Dauer seiner Königsherrschaft; »regierte« ist im Deutschen präzise und geläufig.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition בְּ kennzeichnet hier den Ort der Regierung.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Idiomatiche, knappe deutsche Wiedergabe der festen Formel »und der Name seiner Mutter war«.
- source_word: יְכָלְיָהוּ
  choice: Jekolja
  rationale: Eine gut lesbare deutsche Umschrift des hebräischen Personennamens, die dessen überlieferter Form nahebleibt.
- source_word: מִירוּשָׁלִָם
  choice: stammte aus Jerusalem
  rationale: מִן bezeichnet hier die Herkunft der Mutter. »Stammte aus Jerusalem« gibt diesen Sinn im Deutschen eindeutiger und natürlicher wieder als ein bloßes »von Jerusalem«.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe Königsformel des Hebräischen bleibt erhalten, wird jedoch in natürliche deutsche Syntax überführt. Die im englischen Beratungstext gesetzte Fußnote wurde nicht übernommen, da ihre Markierung offenbar irrtümlich bei der Thronbesteigungsformel steht und die Herkunftsangabe im Deutschen ohne Bedeutungsverlust direkt als »stammte aus Jerusalem« wiedergegeben werden kann.
