  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Sind die übrigen Taten Menahems und alles, was er getan hat, nicht im Buch der Chroniken der Könige von Israel[a] aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Buch der Annalen der Könige von Israel“.'
    reason: Lexikalische Alternative für סֵפֶר דִּבְרֵי הַיָּמִים; die Wendung bezeichnet ein königliches annalistisches Aufzeichnungswerk.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: יֶתֶר bezeichnet den Rest beziehungsweise das Übrige; דִּבְרֵי meint in dieser Königsformel die berichteten Angelegenheiten oder Taten des Herrschers, nicht nur seine Worte. Das anknüpfende וְ wird im Deutschen durch den formelhaften Satzanschluss ausreichend wiedergegeben.
- source_word: מְנַחֵם
  choice: Menahems
  rationale: Der Personenname wird in seiner im Deutschen eingebürgerten biblischen Form wiedergegeben und dem deutschen Genitiv angepasst.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die Wiederholung gegenüber „Taten“ entspricht der formelhaften Ausdrucksweise des Hebräischen und bleibt bewusst erhalten.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgeschrieben?
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. „Aufgeschrieben“ gibt das passive Partizip כְּתוּבִים natürlich und zugleich quellentreu wieder.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl עַל wörtlich „auf“ heißen kann, verlangt die deutsche Wendung bei einem schriftlichen Werk „im Buch“.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Buch der Geschichte
  rationale: Die Wendung bezeichnet eine annalistische Aufzeichnung. „Geschichte“ ist im Haupttext verständlich und würdevoll; „Jahrbücher“ wird als präzisierende Alternative in der Fußnote genannt.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: לְ kennzeichnet hier die Zuordnung im Titel der Quelle. „Der Könige von Israel“ ist im Deutschen die natürliche Wiedergabe.
