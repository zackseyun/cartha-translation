revisions:
- from: Die übrigen Taten Jotams, die er vollbrachte – sind sie nicht im Buch der Chronik der Könige von Juda aufgezeichnet?[a]
  to: Sind die übrigen Taten Jotams, die er vollbrachte, nicht im Buch der Chronik der Könige von Juda geschrieben?[a]
  rationale: Die Umstellung zu einer regulären rhetorischen Frage beseitigt den syntaktisch störenden Gedankenstrich. „Geschrieben“ gibt כְּתוּבִים unmittelbar wieder; die Fußnote erläutert zurückhaltend den annalistischen Charakter der genannten Quelle und präzisiert den Bezug auf die biblischen Chronikbücher.
