source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹתָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Sind die übrigen Taten Jotams, die er vollbrachte, nicht im Buch der Chronik der Könige von Juda geschrieben?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Buch der Chronik der Könige von Juda“ bezeichnet eine königliche annalistische Quelle und ist nicht unbedingt mit den biblischen Chronikbüchern gleichzusetzen.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Die übrigen Taten Jotams
  rationale: יֶתֶר bezeichnet den Rest bzw. das Übrige; דִּבְרֵי meint in dieser Königsformel die berichteten Angelegenheiten oder Taten des Königs. „Taten“ ist im Deutschen natürlich und sachgerecht.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er vollbrachte
  rationale: Die Relativkonstruktion bleibt erhalten. „Vollbrachte“ vermeidet die im Deutschen schwerfällige Verbindung „Taten, die er tat“.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgezeichnet?
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. כְּתוּבִים bedeutet wörtlich „geschrieben“, bezeichnet hier aber idiomatisch die Aufnahme in ein schriftliches Verzeichnis.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Chronik
  rationale: עַל wird bei der Angabe eines schriftlichen Fundorts idiomatisch mit „im“ wiedergegeben. דִּבְרֵי הַיָּמִים bezeichnet hier eine annalistische Aufzeichnung; „Chronik“ wahrt die traditionelle Benennung, ohne sie mit dem biblischen Chronikbuch gleichzusetzen.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Das לְ kennzeichnet in der Titelkonstruktion die Zuordnung des Werkes zu den Königen von Juda.
theological_decisions:
- issue: Identität des genannten Chronikbuches
  choice: Die Formulierung wird als Titel einer königlichen Quelle wiedergegeben und in einer Fußnote erläutert.
  alternative: Gleichsetzung mit dem biblischen Buch der Chronik
  rationale: Der hebräische Ausdruck verweist in dieser Abschlussformel auf königliche Annalen; der Text selbst identifiziert diese Quelle nicht mit dem kanonischen Chronikbuch.
translation_notes:
  register: Moderne, würdige Standardsprache. Die traditionelle rhetorische Frage der königlichen Schlussformel bleibt erhalten; „aufgezeichnet“ gibt den archivalischen Sinn des wörtlichen „geschrieben“ natürlich wieder.
