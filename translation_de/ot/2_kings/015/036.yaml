    rationale: Die Formulierung „das biblische Buch der Chronik“ ist missverständlich, da die kanonische Überlieferung zwei Chronikbücher kennt. Zudem sollte die Fußnote die nicht gesicherte Gleichsetzung lediglich verneinen, ohne die außerbiblische Quelle näher zu bestimmen als der Vers selbst.
