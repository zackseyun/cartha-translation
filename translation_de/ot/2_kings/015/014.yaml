base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: de
  text: Da zog Menahem, der Sohn Gadis, von Tirza hinauf und kam nach Samaria. In Samaria schlug er Schallum, den Sohn des Jabesch, nieder und tötete ihn. Dann wurde er an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog ... hinauf
  rationale: עלה bezeichnet grundsätzlich das Hinaufgehen oder Hinaufziehen. „Zog hinauf“ bewahrt die räumliche Vorstellung und passt zum berichtenden Zusammenhang, ohne ausdrücklich einen militärischen Feldzug vorauszusetzen.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahem, der Sohn Gadis
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition wiedergegeben; die Abstammungsangabe bleibt erhalten.
- source_word: מִתִּרְצָה
  choice: von Tirza
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: kam nach Samaria
  rationale: בוא mit Ortsangabe bezeichnet hier das Kommen beziehungsweise Gelangen an den Ort; „nach Samaria“ ist im Deutschen natürlich.
- source_word: וַיַּךְ אֶת
  choice: erschlug
  rationale: נכה bezeichnet in diesem Zusammenhang den tödlichen Schlag gegen den König. „Erschlug“ gibt die Gewalttat prägnant wieder; die folgende ausdrückliche Tötungsaussage bleibt dennoch erhalten.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: Schallum, den Sohn des Jabesch
  rationale: Die Namen folgen geläufigen deutschen Formen; die Apposition wird in natürlichem Deutsch mit Artikel wiedergegeben.
- source_word: בְּשֹׁמְרוֹן
  choice: Dort
  rationale: „Dort“ verweist eindeutig auf das unmittelbar zuvor genannte Samaria und vermeidet im Deutschen eine schwerfällige Wiederholung, gibt aber die Ortsangabe funktional wieder.
- source_word: וַיְמִיתֵהוּ
  choice: und tötete ihn
  rationale: Der Hifil von מות ist kausativ und bedeutet, jemanden sterben zu lassen beziehungsweise zu töten. Die direkte deutsche Formulierung ist klar und wahrt die im Hebräischen ausdrücklich nachfolgende Tötungsaussage.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: Dann wurde er an seiner Stelle König
  rationale: מלך kann „König sein/regieren“ oder „König werden“ ausdrücken. Im Zusammenhang der gewaltsamen Nachfolge gibt „wurde ... König“ den Eintritt in die Herrschaft natürlich wieder; תחתיו bezeichnet die Nachfolge an Schallums Stelle.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die hebräische Handlungskette wird in klaren deutschen Sätzen wiedergegeben. Die doppelte Aussage „erschlug ... und tötete“ bleibt erhalten, weil beide Verben im Ausgangstext stehen; das zweite Samaria wird idiomatisch durch „dort“ aufgenommen.
