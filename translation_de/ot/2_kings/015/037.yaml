  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֗ה לְ/הַשְׁלִ֨יחַ֙ בִּֽ/יהוּדָ֔ה רְצִ֖ין מֶ֣לֶךְ אֲרָ֑ם וְ/אֵ֖ת פֶּ֥קַח בֶּן רְמַלְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: de
  text: In jenen Tagen begann Jahwe, Rezin, den König von Aram, und Pekach, den Sohn Remaljas, gegen Juda zu senden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Juda hinein zu senden“. Die hebräische Präposition kann örtlich verstanden werden; der Zusammenhang legt jedoch die feindliche Bedeutung „gegen Juda“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Die geläufige Zeitangabe bezeichnet einen geschichtlichen Zeitraum und bewahrt die hebräische Ausdrucksweise in natürlichem Deutsch.
- source_word: הֵחֵל
  choice: begann
  rationale: Die Hifil-Form bezeichnet hier den Beginn eines Handelns; „begann“ ist präzise und stilistisch angemessen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Form.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: gegen Juda zu senden
  rationale: שלח bedeutet „senden“. Die Präposition ב kann örtlich „nach/in“ bedeuten, trägt hier wegen des feindlichen Zusammenhangs aber wahrscheinlich die Bedeutung „gegen“.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezin, den König von Aram
  rationale: Die Namen werden transliteriert; „Aram“ gibt die hebräische ethnogeografische Bezeichnung unmittelbarer wieder als das traditionelle „Syrien“.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: und Pekach, den Sohn Remaljas
  rationale: Die Akkusativpartikel kennzeichnet Pekach als zweites Objekt von „senden“; die Abstammungsangabe wird idiomatisch und genau wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Göttliches Handeln durch feindliche Herrscher
  choice: Jahwe begann, Rezin und Pekach gegen Juda zu senden
  alternative: Jahwe ließ Rezin und Pekach Juda angreifen
  rationale: Die direkte Aussage des hebräischen Textes über Jahwes Handeln bleibt erhalten; die abgeschwächte kausative Umschreibung „ließ ... angreifen“ würde die theologische Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die beiden Herrscher als gemeinsame Objekte von „senden“ zusammen. „Aram“ wird gegenüber dem traditionellen „Syrien“ bevorzugt; eine zusätzliche Fußnote dazu ist nicht nötig, da der Ausdruck im deutschen Bibelregister verständlich und quellennah ist.
