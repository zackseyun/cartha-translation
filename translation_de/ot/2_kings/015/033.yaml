base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: de
  text: Er war fünfundzwanzig Jahre alt, als er König wurde, und regierte sechzehn Jahre in Jerusalem. Seine Mutter hieß Jeruscha; sie war eine Tochter Zadoks.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Er war fünfundzwanzig Jahre alt
  rationale: Die hebräische Wendung ist eine übliche Altersangabe. Die sinngemäße deutsche Formulierung ist natürlich und gibt den Inhalt vollständig wieder.
- source_word: הָיָה בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion gehört zur israelitischen Königsformel und bezeichnet das Alter beim Regierungsantritt. Diese Wiedergabe ist im modernen Deutsch klar und idiomatisch.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם
  choice: und regierte sechzehn Jahre in Jerusalem
  rationale: Die schlichte Regierungsangabe wird mit natürlicher deutscher Wortstellung wiedergegeben.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Dies ist die idiomatische deutsche Entsprechung der wörtlichen Formel »und der Name seiner Mutter war«.
- source_word: יְרוּשָׁא
  choice: Jeruscha
  rationale: Die Form folgt einer im Deutschen geläufigen Wiedergabe des hebräischen Personennamens.
- source_word: בַּת צָדוֹק
  choice: sie war eine Tochter Zadoks
  rationale: Die Verwandtschaftsangabe wird genau bewahrt und durch einen neuen Teilsatz im Deutschen flüssig angeschlossen.
