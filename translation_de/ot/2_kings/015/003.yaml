id: 2KI.15.3
reference: 2 Kings 15:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes recht war, ganz so, wie sein Vater Amazja es getan hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Waw-Consecutiv führt die nächste Erzählhandlung ein. Im natürlichen modernen Deutsch kann das einleitende וַ ohne ein ausdrückliches „Und“ wiedergegeben werden.
- source_word: הַיָּשָׁר
  choice: was … recht war
  rationale: Das bestimmte Adjektiv יָשָׁר wird substantivisch gebraucht. Die deutsche Formulierung „was recht war“ gibt dies in der königlichen Beurteilungsformel idiomatisch wieder.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die Wendung bezeichnet Jahwes Beurteilung und bewahrt zugleich das hebräische Bild, das auch im Deutschen verständlich ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Transkription.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: Die Wendung drückt vollständige Übereinstimmung mit dem Handeln Amazjas aus. „Ganz so, wie“ ist natürliches Deutsch und erhält die umfassende Kraft von כֹּל.
- source_word: עָשָׂה
  choice: es getan hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass das Handeln des Vaters dem beschriebenen Handeln vorausging; „es“ nimmt „was … recht war“ idiomatisch auf.
- source_word: אֲמַצְיָהוּ
  choice: Amazja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: אָבִיו
  choice: sein Vater
  rationale: Der unmittelbare genealogische Zusammenhang bezeichnet den leiblichen Vater, nicht allgemein einen Vorfahren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle königliche Beurteilungsformel bleibt bildhaft erhalten, ohne steif zu wirken.
