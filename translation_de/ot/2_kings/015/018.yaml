source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war. Sein Leben lang wandte er sich nicht von den Sünden Jerobeams, des Sohnes Nebats,[a] ab, durch die er Israel zum Sündigen brachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Sünden Jerobeams, des Sohnes Nebats, der Israel zum Sündigen brachte.“ Der hebräische Relativsatz kann sich statt auf die Sünden auch auf Jerobeam beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was böse war
  rationale: Die feste Königebuchformel wird in natürlichem Deutsch wiedergegeben; der wertende Objektsinn von הָרַע bleibt erhalten.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Bewahrt die transparente hebräische Metapher der göttlichen Beurteilung und gibt den Gottesnamen als Jahwe wieder.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: wandte er sich nicht von den Sünden … ab
  rationale: סור bezeichnet hier das Abgehen beziehungsweise Sichabwenden von einem sündigen Weg; die deutsche Verbklammer ist idiomatisch.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeams, des Sohnes Nebats
  rationale: Die traditionellen deutschen Namensformen werden verwendet und die Abstammungsangabe klar appositionell ausgedrückt.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: mit denen dieser Israel zur Sünde verführt hatte
  rationale: Das Relativpronomen bezieht sich in der Hauptfassung auf die Sünden; dieser macht Jerobeam als Verursacher deutlich, und der Kausativ von חטא wird natürlich wiedergegeben.
- source_word: כָּל יָמָיו
  choice: sein Leben lang
  rationale: Gibt die hebräische Zeitangabe verständlich und idiomatisch wieder, ohne ihre umfassende Bedeutung abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird direkt in der im Deutschen üblichen Form Jahwe wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Relativsatzes אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Bezug auf die Sünden: „mit denen dieser Israel zur Sünde verführt hatte“'
  alternative: 'Bezug auf Jerobeam: „Jerobeam …, der Israel zur Sünde verführt hatte“'
  rationale: Der hebräische Relativsatz lässt beide syntaktischen Zuordnungen zu. Die Hauptfassung verbindet ihn mit den Sünden, während die Fußnote die ebenso mögliche Zuordnung zu Jerobeam bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Erzählformel bleibt erkennbar; „sein Leben lang“ wird für einen natürlichen Satzbau vorangestellt. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen mögliche syntaktische Lesart er sich bezieht.
