  naturalness: „Er tat, was böse war in den Augen Jahwes“ ist verständlich, aber „Er tat, was in den Augen Jahwes böse war“ entspricht dem modernen deutschen Satzbau besser. Die revidierte Fassung bleibt würdig und natürlich.
  terminology: „Jahwe“, „Jerobeam“ und „Nebat“ sind angemessen. „Israel zum Sündigen brachte“ gibt die kausative Bedeutung wieder, ohne den Sinn durch „verführen“ einzuengen.
