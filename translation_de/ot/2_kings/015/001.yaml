base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: de
  text: Im siebenundzwanzigsten Regierungsjahr Jerobeams, des Königs von Israel, wurde Asarja, der Sohn Amazjas, König von Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: Im siebenundzwanzigsten Regierungsjahr
  rationale: Die hebräische Datierungsformel nennt das gezählte Herrschaftsjahr. „Regierungsjahr“ macht den Bezug im Deutschen natürlich und eindeutig.
- source_word: לְיָרָבְעָם
  choice: Jerobeams
  rationale: Das Präfix ל bezeichnet hier den Herrscher, nach dessen Regierungsjahren datiert wird; der deutsche Genitiv gibt dies knapp wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Die Apposition bezeichnet Jerobeams Amt und Reich.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: In dieser Thronbesteigungsnotiz bezeichnet das Verb den Beginn der Herrschaft. „Wurde König“ ist eine natürliche, präzise deutsche Wiedergabe.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶן אֲמַצְיָה
  choice: der Sohn Amazjas
  rationale: Die hebräische Abstammungsangabe wird als natürliche deutsche Apposition wiedergegeben.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Die Wendung benennt Asarjas königliches Amt und Herrschaftsgebiet.
