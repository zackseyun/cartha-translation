source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war, genau wie seine Väter es getan hatten. Er wandte sich nicht von den Sünden Jerobeams, des Sohnes Nebats, ab, durch die er Israel zur Sünde verführt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jerobeams, des Sohnes Nebats, der Israel zur Sünde verführt hatte.“ Das hebräische Relativwort kann sich entweder unmittelbar auf Jerobeam oder auf die mit ihm verbundenen Sünden beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das erzählende Wayyiqtol wird im Deutschen natürlich mit dem Präteritum wiedergegeben.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: was in den Augen Jahwes böse war
  rationale: Bewahrt die deuteronomistische Bewertungsformel und das hebräische Bild, bleibt aber in modernem Deutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: genau wie seine Väter es getan hatten
  rationale: „Genau wie“ gibt die vergleichende Kraft wieder; „Väter“ erhält den männlichen dynastischen Bezug des hebräischen Ausdrucks.
- source_word: לֹא סָר
  choice: Er wandte sich nicht … ab
  rationale: סור bezeichnet hier das Abgehen von einem religiös-moralischen Weg; „sich abwenden“ ist idiomatisches heutiges Deutsch.
- source_word: מֵחַטֹּאות
  choice: von den Sünden
  rationale: Die Pluralform bleibt erhalten und bezeichnet die mit Jerobeam verbundene sündige Praxis.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeams, des Sohnes Nebats
  rationale: Entspricht den etablierten deutschen Namensformen und gibt die Abstammungsangabe ausdrücklich wieder.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: durch die er Israel zur Sünde verführt hatte
  rationale: „Durch die“ bezieht den Relativsatz auf die Sünden als Mittel beziehungsweise Zusammenhang; „er“ bezeichnet Jerobeam als den Handelnden. Die im Hebräischen mögliche unmittelbare Zuordnung des Relativsatzes zu Jerobeam wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als solcher wiedergegeben; „Jahwe“ ist die geläufige deutsche Form.
- issue: Bezug des Relativsatzes אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: Die Sünden werden als das genannt, durch das Jerobeam Israel zur Sünde verführte.
  alternative: 'Der Relativsatz kann unmittelbar Jerobeam bezeichnen: „der Israel zur Sünde verführt hatte“.'
  rationale: Das unveränderliche hebräische Relativwort אֲשֶׁר lässt den grammatischen Bezug offen. Der Haupttext hält Sünden und Jerobeams Verführung eng zusammen, ohne die mögliche personenbezogene Lesart zu verschweigen.
- issue: Wiedergabe von אֲבֹתָיו
  choice: seine Väter
  alternative: seine Vorfahren
  rationale: Im königlichen Zusammenhang hat der ausdrücklich männliche Ausdruck einen dynastischen Bezug; „Väter“ wahrt diese Form und Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Bewertungsformel „in den Augen Jahwes“ bleibt erhalten; Satzbau und Verbwahl sind zugleich für heutige Leser klar.
