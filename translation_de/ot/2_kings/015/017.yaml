base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: de
  text: Im neununddreißigsten Regierungsjahr Asarjas, des Königs von Juda, wurde Menahem, der Sohn Gadis, König über Israel. Er regierte zehn Jahre lang in Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: Im neununddreißigsten Regierungsjahr
  rationale: Die Formel bezeichnet ein bestimmtes Jahr innerhalb der Regierungszeit. Das ergänzte „Regierungs-“ macht den Bezug im Deutschen unmittelbar verständlich.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: Asarjas, des Königs von Juda
  rationale: Das ל kennzeichnet hier den Herrscher, dessen Regierungsjahr zur Datierung dient; die Apposition gibt seinen Titel natürlich und genau wieder.
- source_word: מָלַךְ
  choice: wurde ... König
  rationale: In dieser Synchronismusformel bezeichnet das Verb den Regierungsantritt; die anschließende Zeitangabe nennt gesondert die Dauer der Herrschaft.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahem, der Sohn Gadis
  rationale: Die Namen werden in geläufiger deutscher Form wiedergegeben; בן bezeichnet die Abstammung beziehungsweise Identifikation.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל mit מלך bezeichnet den Herrschaftsbereich.
- source_word: עֶשֶׂר שָׁנִים
  choice: zehn Jahre lang
  rationale: Die Wendung gibt die Dauer seiner Regierung an; „lang“ ist im Deutschen idiomatisch.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition bezeichnet den Ort beziehungsweise Regierungssitz.
