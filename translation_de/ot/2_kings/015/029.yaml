  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: de
  text: Zur Zeit Pekachs, des Königs von Israel, kam Tiglat-Pileser, der König von Assyrien. Er eroberte Ijon, Abel-Bet-Maacha, Janoach, Kedesch, Hazor, Gilead und Galiläa – das ganze Land Naftali – und verschleppte deren Bewohner[a] nach Assyrien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und er verschleppte sie nach Assyrien«; gemeint sind die Bewohner der eroberten Orte und Gebiete.'
    reason: Das hebräische Pronomen steht im maskulinen Plural, während mehrere der unmittelbar vorausgehenden Gebietsnamen grammatisch feminin oder singularisch sind. Die Übersetzung macht den sinngemäßen Personenbezug deutlich und dokumentiert den Wortlaut.
lexical_decisions:
- source_word: בִּימֵי
  choice: Zur Zeit
  rationale: Die hebräische Zeitformel wird in natürlichem modernem Deutsch wiedergegeben, ohne sie enger als ausdrücklichen Regierungszeitraum zu bestimmen.
- source_word: בָּא
  choice: kam
  rationale: Bewahrt die schlichte Bedeutung des Verbs; der militärische Zusammenhang wird durch das folgende »eroberte« deutlich.
- source_word: וַיִּקַּח
  choice: eroberte
  rationale: Im militärischen Kontext bezeichnet »nehmen« die Einnahme von Städten und Gebieten; »eroberte« ist im Deutschen eindeutig und idiomatisch.
- source_word: עִיּוֹן
  choice: Ijon
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Bet-Maacha
  rationale: Der zusammengesetzte Ortsname wird als Einheit kenntlich gemacht und in einer im Deutschen geläufigen Transliteration wiedergegeben.
- source_word: יָנוֹחַ
  choice: Janoach
  rationale: Quellennah transliterierte deutsche Namensform.
- source_word: קֶדֶשׁ
  choice: Kedesch
  rationale: Gebräuchliche deutsche Wiedergabe des Ortsnamens.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Gebräuchliche deutsche Wiedergabe des Ortsnamens.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Der geografische Eigenname steht im Deutschen natürlich ohne Artikel.
- source_word: הַגָּלִילָה
  choice: Galiläa
  rationale: Gebräuchliche deutsche Bezeichnung der Region.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: das ganze Land Naftali
  rationale: Gibt die zusammenfassende Apposition eng und zugleich idiomatisch wieder.
- source_word: וַיַּגְלֵם
  choice: verschleppte deren Bewohner
  rationale: Der Hifil von גלה bezeichnet die gewaltsame Wegführung ins Exil. Das maskuline Pluralsuffix bezieht sich sinngemäß auf die Bevölkerung der genannten Orte und Gebiete; diese Ergänzung vermeidet im Deutschen den missverständlichen Eindruck, die Orte selbst seien weggeführt worden.
- source_word: אַשּׁוּרָה
  choice: nach Assyrien
  rationale: Die Richtungsendung wird idiomatisch mit »nach« wiedergegeben.
