  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/פֶ֥קַח בֶּן רְמַלְיָ֖הוּ מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ יוֹתָ֥ם בֶּן עֻזִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: de
  text: Im zweiten Regierungsjahr Pekachs, des Sohnes Remaljas, des Königs von Israel, wurde Jotam, der Sohn Usijas[b], König von Juda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »begann zu regieren«. Das hebräische Verb kann sowohl die Thronbesteigung als auch den Beginn einer Herrschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Usija wird an anderen Stellen auch Asarja genannt.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: Im zweiten Regierungsjahr
  rationale: Die hebräische Datierungsformel bezeichnet das zweite Jahr einer Herrschaft; »Regierungsjahr« macht den Bezug im Deutschen eindeutig.
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: Pekachs, des Sohnes Remaljas
  rationale: Das ל markiert hier den Herrscher, nach dessen Regierungsjahr datiert wird; das Patronym wird historisch genau beibehalten.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Königs von Israel
  rationale: Der Königstitel und das zugehörige Reich werden ausdrücklich wiedergegeben.
- source_word: מָלַךְ
  choice: wurde ... König
  rationale: Im Zusammenhang einer Thronbesteigungsnotiz bezeichnet das Verb den Herrschaftsantritt; die deutsche Formulierung bewahrt zugleich die Nähe zur Grundbedeutung »König sein/werden«.
- source_word: יוֹתָם בֶּן עֻזִיָּהוּ
  choice: Jotam, der Sohn Usijas
  rationale: Die Namen folgen gängigen deutschen Bibelnamensformen; die Sohnbezeichnung bleibt erhalten.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Der appositionelle Titel wird ausdrücklich Jotam zugeordnet und nicht ausgelassen.
theological_decisions:
- issue: Bedeutungsumfang von מָלַךְ
  choice: wurde ... König
  alternative: begann zu regieren
  rationale: Beide Wiedergaben sind sprachlich möglich; der Haupttext formuliert den Regierungsantritt als Königwerden, während die Fußnote die Alternative nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Apposition ordnet die Königstitel eindeutig den jeweiligen Personen zu; die im Hebräischen vorhandene Wiederholung von »König« bleibt erhalten.
