revisions:
- from: Dann griff Menahem von Tirza aus Tifsach an, alle, die darin waren, und sein ganzes Gebiet. Weil man ihm die Stadt nicht geöffnet hatte,[a] schlug er sie nieder und schlitzte allen Schwangeren dort den Leib auf.[b]
  to: Dann schlug Menahem Tifsach und alles, was darin war, sowie sein Gebiet von Tirza an, weil die Stadt ihm nicht geöffnet hatte.[a] Er schlug die Stadt und riss allen ihren schwangeren Frauen den Leib auf.[b]
  rationale: Die Revision glättet die deutsche Satzfügung, stellt die wiederholte Handlung und ihre Bezüge klar und bindet „von Tirza an“ eng an das im Hebräischen unmittelbar vorausgehende „Gebiet“. Damit bleibt die schwierige räumliche Angabe ohne weitergehende historische Festlegung wiedergegeben. Die Fußnotenmarker stehen direkt bei den jeweils erläuterten Wendungen.
