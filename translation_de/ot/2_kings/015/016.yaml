  terminology: „Menahem“, „Tifsach“ und „Tirza“ sind als Namen angemessen. „schwangeren Frauen“ ist präzise und modern. „den Leib aufreißen“ gibt die Bedeutung von בקע als gewaltsames Aufreißen wieder, ohne den Bericht zu euphemisieren oder zu kommentieren.
