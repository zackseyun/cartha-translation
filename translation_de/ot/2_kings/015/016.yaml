base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: de
  text: Dann schlug Menahem Tifsach und alles, was darin war, sowie sein Gebiet von Tirza an, weil die Stadt ihm nicht geöffnet hatte.[a] Er schlug die Stadt und riss allen ihren schwangeren Frauen den Leib auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Öffnen“ bedeutet hier, Menahem die Stadt zu öffnen, ihn also einzulassen beziehungsweise sich ihm zu ergeben.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „spaltete alle ihre schwangeren Frauen auf“. Das hebräische Verb bezeichnet ein gewaltsames Aufreißen oder Aufspalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Der zeitlich-fortführende Erzählanschluss wird im modernen deutschen Erzählstil natürlich mit „Dann“ wiedergegeben.
- source_word: יַכֶּה / וַיַּךְ
  choice: griff … an / schlug … nieder
  rationale: נכה bezeichnet hier gewaltsames Angreifen und Schlagen. Die kontextgerechte Variation macht den militärischen Angriff und die anschließende Verwüstung im Deutschen klar, ohne die Härte abzuschwächen.
- source_word: תִּפְסַח
  choice: Tifsach
  rationale: Der Ortsname wird nach der hebräischen Form transliteriert und nicht mit einer textkritisch vermuteten anderen Stadt gleichgesetzt.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: alle, die darin waren
  rationale: Die formal breite Wendung „alles/alle, was darin war“ bezieht sich im Zusammenhang des Stadtangriffs besonders auf die Bewohner; „alle, die“ ist im Deutschen natürlich, ohne weitere Gruppen auszuschließen.
- source_word: גְּבוּלֶיהָ
  choice: sein ganzes Gebiet
  rationale: גְּבוּל bezeichnet hier eher den zu Tifsach gehörenden territorialen Bereich als bloß seine Grenzlinie.
- source_word: מִתִּרְצָה
  choice: von Tirza aus
  rationale: Die Präposition מן markiert am natürlichsten den Ausgangspunkt von Menahems Vorgehen. Die deutsche Stellung macht diese räumliche Beziehung verständlich.
- source_word: כִּי לֹא פָתַח
  choice: Weil man ihm die Stadt nicht geöffnet hatte
  rationale: „Öffnen“ meint im Belagerungskontext, die Stadt beziehungsweise ihre Tore zu öffnen und ihn einzulassen. Die unpersönliche Form wahrt, dass das hebräische Subjekt nicht ausdrücklich als bestimmte Personengruppe genannt wird.
- source_word: הֶהָרוֹתֶיהָ
  choice: allen Schwangeren dort
  rationale: Das substantivierte Adjektiv bezeichnet unmittelbar die schwangeren Frauen der Stadt; die Übersetzung benennt die Opfer klar und ohne Euphemismus.
- source_word: בִּקֵּעַ
  choice: schlitzte … den Leib auf
  rationale: Das Piel von בקע bezeichnet gewaltsames Aufspalten oder Aufreißen. Die Formulierung ist im Deutschen eindeutig und gibt die Brutalität des Berichts unverhüllt wieder.
theological_decisions:
- issue: Darstellung extremer Kriegsgewalt
  choice: Die Tat wird direkt als Handlung Menahems berichtet und weder gerechtfertigt noch ausdrücklich kommentiert.
  alternative: Die Formulierung könnte durch Passiv, Umschreibung oder moralische Wertung abgemildert beziehungsweise erläutert werden.
  rationale: Der hebräische Text schildert die Gewalttat knapp und schonungslos, ohne sie Gott zuzuschreiben oder an dieser Stelle theologisch zu bewerten. Diese Spannung bleibt erhalten.
translation_notes:
  register: Moderne, würdige Erzählsprache mit unverhüllter Wiedergabe der im Ausgangstext geschilderten Gewalt. „Tifsach“ folgt der masoretischen Ortsnamensform; die räumliche Wendung „von Tirza aus“ wird verständlich auf den Angriff bezogen. Alle Fußnotenmarker stehen unmittelbar an den erklärten Textstellen.
