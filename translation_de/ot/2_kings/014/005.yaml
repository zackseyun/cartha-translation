id: 2KI.14.5
reference: 2 Kings 14:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר חָזְקָ֥ה הַ/מַּמְלָכָ֖ה בְּ/יָד֑/וֹ וַ/יַּךְ֙ אֶת עֲבָדָ֔י/ו הַ/מַּכִּ֖ים אֶת הַ/מֶּ֥לֶךְ אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: de
  text: Als die Königsherrschaft fest in seiner Hand war,[a] erschlug er seine Diener, die seinen Vater, den König, erschlagen hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als die Königsherrschaft in seiner Hand erstarkt war.“ Die hebräische Wendung bedeutet, dass seine Herrschaft sicher gefestigt war.'
    reason: lexical_alternative
  - marker: b
    text: 'Für Amazjas Tat und für die Tat seiner Diener steht im Hebräischen derselbe Verbstamm: Er „erschlug“ diejenigen, die seinen Vater „erschlagen“ hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsform leitet das nächste Ereignis ein; zusammen mit כַּאֲשֶׁר ergibt sich hier im Deutschen natürlich ein temporaler Nebensatz. Ein zusätzliches „Und es geschah“ wäre möglich, aber schwerfälliger.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: die Königsherrschaft fest in seiner Hand war
  rationale: חזק bezeichnet hier die gefestigte Herrschaft. „In seiner Hand“ bewahrt das verständliche hebräische Bild für sichere Kontrolle; „Königsherrschaft“ gibt הַמַּמְלָכָה in diesem Zusammenhang präziser wieder als ein bloß territoriales „Königreich“.
- source_word: וַיַּךְ
  choice: erschlug er
  rationale: נכה bezeichnet hier ein Töten durch gewaltsames Niederschlagen. „Erschlug“ ist knapp, würdevoll und ermöglicht, die Wiederholung desselben hebräischen Verbstamms wiederzugeben.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד bedeutet grundsätzlich „Diener“; im königlichen Umfeld können damit auch Hofbeamte oder Gefolgsleute gemeint sein. Die Übersetzung wahrt diese mögliche Bedeutungsbreite.
- source_word: הַמַּכִּים
  choice: die … erschlagen hatten
  rationale: Das Partizip bezeichnet die Diener anhand ihrer vorausgegangenen Tat. Die Wiederaufnahme von „erschlagen“ bewahrt die auffällige lexikalische Entsprechung zum Handeln Amazjas.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: seinen Vater, den König
  rationale: Die Apposition wird in natürlicher deutscher Wortstellung wiedergegeben und identifiziert den getöteten Vater ausdrücklich als König.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung ist knapp und erzählerisch; das hebräische Bild „in seiner Hand“ sowie die bewusste Wiederholung von „erschlagen“ bleiben erhalten.
