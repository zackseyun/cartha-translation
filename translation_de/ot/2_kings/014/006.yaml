source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: de
  text: 'Doch die Söhne derer, die ihn erschlagen hatten, ließ er nicht töten[a], wie es im Buch des Gesetzes Mose geschrieben steht, so wie Jahwe es geboten hatte: »Väter sollen nicht wegen ihrer Söhne getötet werden, und Söhne sollen nicht wegen ihrer Väter getötet werden; vielmehr soll jeder für seine eigene Sünde sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne der Schlagenden«. Im Zusammenhang sind die Männer gemeint, die seinen Vater getötet hatten.'
    reason: lexical_alternative_and_context
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: die Söhne der Mörder
  rationale: בְּנֵי bezeichnet ausdrücklich die Söhne; הַמַּכִּים meint hier im Kontext die Männer, die den König getötet hatten. »Mörder« ist im Deutschen prägnant und kontextgerecht.
- source_word: לֹא הֵמִית
  choice: ließ er nicht töten
  rationale: Der Hifil von מות bedeutet »zu Tode bringen«. Die Formulierung gibt sowohl den kausativen Sinn als auch den gerichtlichen Zusammenhang natürlich wieder.
- source_word: כַּכָּתוּב בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: wie es im Buch des Gesetzes des Mose geschrieben steht
  rationale: Die geläufige Schriftformel bewahrt den Bezug auf die schriftlich festgehaltene Weisung und gibt סֵפֶר תּוֹרַת מֹשֶׁה transparent wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא יוּמְתוּ
  choice: sollen nicht ... getötet werden
  rationale: Die kausativ-passive Form bezeichnet im rechtlichen Zusammenhang die Vollstreckung der Todesstrafe, nicht bloß das Sterben.
- source_word: אָבוֹת ... בָּנִים
  choice: Väter ... Söhne
  rationale: Die konkreten maskulinen Verwandtschaftsbezeichnungen des Hebräischen bleiben erhalten.
- source_word: עַל
  choice: wegen
  rationale: עַל bezeichnet hier den Grund beziehungsweise die zugerechnete Schuld, aufgrund deren jemand bestraft würde.
- source_word: כִּי אִם
  choice: vielmehr
  rationale: Die Wendung führt den positiven Gegensatz zu den beiden Verboten ein.
- source_word: אִישׁ בְּחֶטְאוֹ
  choice: jeder für seine eigene Sünde
  rationale: אִישׁ hat hier distributiven Sinn. »Jeder« ist im Deutschen natürlich; »eigene« verdeutlicht das Possessivsuffix und den Gegensatz zur Bestrafung für fremde Schuld.
- source_word: יָמוּת
  choice: soll ... sterben
  rationale: Der Qal bedeutet »sterben« und unterscheidet sich formal von den vorherigen kausativ-passiven Formen; dieser Wechsel bleibt erhalten.
theological_decisions:
- issue: Individuelle oder familiäre Haftung im Bundesrecht
  choice: Die Aussage wird als rechtliches Verbot verstanden, Väter für die Schuld ihrer Söhne oder Söhne für die Schuld ihrer Väter hinzurichten.
  alternative: Eine umfassende Verneinung aller gemeinschaftlichen oder generationenübergreifenden Folgen von Sünde.
  rationale: Wortlaut und Kontext betreffen gerichtliche Tötung und persönliche Schuld. Die Übersetzung weitet dies nicht zu einer Aussage aus, dass Sünde niemals Folgen für andere haben könne.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gesetzeszitation ist gehoben, aber gut verständlich formuliert. Die maskulinen Verwandtschaftsbezeichnungen und der Wechsel zwischen »getötet werden« und »sterben« entsprechen den unterschiedlichen hebräischen Formen.
