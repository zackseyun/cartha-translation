revisions:
- from: 'Doch die Söhne der Mörder ließ er nicht töten[a], wie es im Buch des Gesetzes des Mose geschrieben steht, in dem Jahwe geboten hatte: »Väter sollen nicht wegen ihrer Söhne getötet werden, und Söhne sollen nicht wegen ihrer Väter getötet werden; vielmehr soll jeder für seine eigene Sünde sterben.«'
  to: 'Doch die Söhne derer, die ihn erschlagen hatten, ließ er nicht töten[a], wie es im Buch des Gesetzes Mose geschrieben steht, so wie Jahwe es geboten hatte: »Väter sollen nicht wegen ihrer Söhne getötet werden, und Söhne sollen nicht wegen ihrer Väter getötet werden; vielmehr soll jeder für seine eigene Sünde sterben.«'
  rationale: Die Revision vermeidet mit „diejenigen, die ihn erschlagen hatten“ eine überpräzise rechtliche Deutung von „Mörder“, bewahrt aber den durch den Kontext gegebenen Bezug auf die Täter am Vater. Die Schriftformel wird so umgestellt, dass Jahwes Gebot eindeutig die Weisung betrifft. Die rechtliche Aussage und der hebräische Wechsel von „getötet werden“ zu „sterben“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:38:52Z'
review_pass:
  verdict: revise
  source_fidelity: Die Aussage über die Nicht-Hinrichtung der Söhne sowie die Unterscheidung zwischen den passiv-kausativen Formen („getötet werden“) und dem abschließenden Qal („sterben“) sind im Kern zutreffend. Eine Revision ist angezeigt, weil „Mörder“ den hebräischen Partizipialausdruck הַמַּכִּים („die Schlagenden/diejenigen, die erschlagen hatten“) unnötig rechtstechnisch und enger festlegt. Zudem lässt „in dem Jahwe geboten hatte“ Jahwes Gebot innerhalb des Buches erfolgen, während das Relativum im Hebräischen die Weisung betrifft.
  naturalness: Die revidierte Fassung verwendet modernes, würdiges Standarddeutsch. „Die Söhne derer, die ihn erschlagen hatten“ ist im unmittelbaren Erzählkontext natürlich und vermeidet die missverständliche juristische Konnotation von „Mörder“. Die Umformung der Schriftformel ist syntaktisch klar.
  terminology: „Jahwe“, „Buch des Gesetzes Mose“, „Väter“ und „Söhne“ sind angemessen. „Erschlagen“ bildet im Kontext die Bedeutung von נכה ab, ohne über die hebräische Form hinaus eine strafrechtliche Qualifikation zu behaupten. Die Fußnote hält die wörtliche Partizipialform und den Kontext auseinander.
  issues:
  - severity: medium
    issue: „Mörder“ ist für הַמַּכִּים zu eng und rechtstechnisch.
    rationale: Das hebräische Partizip bezeichnet wörtlich „die Schlagenden“; im Kontext sind die Männer gemeint, die den Vater des Königs getötet hatten. „Mörder“ kann im Deutschen eine spezifische rechtliche und motivbezogene Einordnung nahelegen, die der Wortlaut nicht ausdrücklich trifft.
  - severity: medium
    issue: „in dem Jahwe geboten hatte“ ordnet das Gebieten syntaktisch dem Buch zu.
    rationale: אֲשֶׁר צִוָּה יְהוָה bezieht sich auf die Weisung/das Gesetz, nicht auf einen Vorgang innerhalb des Buches. Die deutsche Formulierung sollte diese Beziehung klarer wiedergeben.
