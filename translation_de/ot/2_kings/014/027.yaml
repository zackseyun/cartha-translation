id: 2KI.14.27
reference: 2 Kings 14:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹא דִבֶּ֣ר יְהוָ֔ה לִ/מְחוֹת֙ אֶת שֵׁ֣ם יִשְׂרָאֵ֔ל מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וַ/יּ֣וֹשִׁיעֵ֔/ם בְּ/יַ֖ד יָרָבְעָ֥ם בֶּן יוֹאָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: de
  text: Doch Jahwe hatte nicht gesagt, dass er den Namen Israels unter dem Himmel auslöschen[a] werde. Darum rettete er sie durch die Hand[b] Jerobeams, des Sohnes Joaschs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegwischen“ beziehungsweise „tilgen“. Gemeint ist die vollständige Beseitigung des Namens Israels.'
    reason: lexical_alternative
  - marker: b
    text: „Durch die Hand“ ist eine hebräische Wendung und bedeutet hier „durch“ oder „mithilfe von“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: דִבֶּר
  choice: hatte nicht gesagt
  rationale: Das Plusquamperfekt macht deutlich, dass die nicht ergangene Aussage der anschließend berichteten Rettung vorausliegt.
- source_word: לִמְחוֹת
  choice: auslöschen
  rationale: Das Verb bezeichnet hier die vollständige Beseitigung; „auslöschen“ passt natürlich zum Ausdruck „den Namen Israels“ und bewahrt dessen bildhafte Kraft.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: den Namen Israels
  rationale: Die enge Wiedergabe erhält die hebräische Redeweise, in der der Name für Israels fortdauernde Existenz und Identität steht.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: unter dem Himmel
  rationale: Bewahrt die hebräische Wendung für den Bereich menschlicher Existenz, ohne sie ausdeutend durch „von der Erde“ zu ersetzen.
- source_word: וַיּוֹשִׁיעֵם
  choice: Darum rettete er sie
  rationale: „rettete“ entspricht dem Hifil von ישע. „Darum“ gibt den naheliegenden Folgezusammenhang wieder, ohne die Art der Rettung näher festzulegen.
- source_word: בְּיַד
  choice: durch die Hand
  rationale: Bewahrt das hebräische Bild für menschliche Vermittlung beziehungsweise Beauftragung; eine Fußnote erklärt die Bedeutung.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: Jerobeams, des Sohnes Joaschs
  rationale: Verwendet die im Deutschen üblichen biblischen Namensformen und gibt die Abstammungsangabe eindeutig wieder.
theological_decisions:
- issue: Göttliche Absicht und Gottes Handeln zur Bewahrung Israels
  choice: Jahwe hatte Israels Auslöschung nicht angekündigt; darum rettete er Israel durch Jerobeam als menschlichen Vermittler.
  alternative: Beide Aussagen könnten lediglich mit „und“ aneinandergereiht werden, ohne den Folgezusammenhang ausdrücklich zu kennzeichnen.
  rationale: Die Abfolge der hebräischen Aussagen legt einen Zusammenhang zwischen der nicht angekündigten Vernichtung und der Rettung nahe. Zugleich bleibt die Spannung bestehen, dass Gott durch Jerobeam handelt, ohne dass der Vers dessen Person oder Herrschaft hier theologisch bewertet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhaften Wendungen „den Namen Israels auslöschen“ und „durch die Hand“ bleiben erhalten; die zweite wird zur Verständlichkeit erläutert.
