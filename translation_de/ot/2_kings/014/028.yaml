source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten Jerobeams und alles, was er tat, seine Macht, mit der er Krieg führte, und wie er Damaskus und Hamat für Juda in Israel zurückgewann[a] – ist das nicht im Buch der Geschichte der Könige Israels aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für Juda in Israel“. Die hebräische Wendung ist schwer verständlich. Gemeint sein könnte Gebiet, das für Israel zurückgewonnen wurde und früher zu Juda gehört hatte; möglicherweise ist auch eine ältere geopolitische Bezeichnung erhalten. Der Haupttext lässt die Mehrdeutigkeit bestehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: Die übrigen Taten Jerobeams
  rationale: Die feste Königsbuchformel bezeichnet die sonstigen Taten beziehungsweise Regierungsvorgänge; „Taten“ gibt den historiografischen Sinn von דִּבְרֵי idiomatisch wieder.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die breite Bedeutung von עשה bleibt ohne unnötige Präzisierung erhalten.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר נִלְחָם
  choice: seine Macht, mit der er Krieg führte
  rationale: גְּבוּרָה bezeichnet hier angesichts des folgenden Relativsatzes vor allem militärische Stärke. Die Formulierung bewahrt den Zusammenhang zwischen seiner Macht und seiner Kriegführung.
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: und wie er … zurückgewann
  rationale: Das Hifil von שׁוב bedeutet zurückbringen oder wiederherstellen; bei Städten beziehungsweise Herrschaftsgebieten ist „zurückgewinnen“ im Deutschen natürlich.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: Damaskus und Hamat
  rationale: Die Ortsnamen folgen den gebräuchlichen deutschen Formen.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: für Juda in Israel
  rationale: Die schwer verständliche und gedrängte hebräische Wendung wird eng am Wortlaut wiedergegeben, ohne ihre historische oder geopolitische Beziehung aufzulösen.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ist das nicht … aufgeschrieben?
  rationale: Die rhetorische Abschlussformel wird in natürlichem Deutsch wiedergegeben. Das zusammenfassende „das“ nimmt den gesamten zuvor genannten Stoff auf.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: im Buch der Geschichte der Könige Israels
  rationale: Die archivalische Quellenbezeichnung wird verständlich und würdig wiedergegeben; „Geschichte“ bezeichnet hier die aufgezeichneten Ereignisse beziehungsweise Annalen.
theological_decisions:
- issue: Beziehung von Damaskus und Hamat zu Juda und Israel
  choice: Die schwierige Wendung „für Juda in Israel“ bleibt im Haupttext stehen.
  alternative: „für Israel zurückgewann, was einst Juda gehört hatte“ oder „Juda wieder Israel zuführte“
  rationale: Der hebräische Text ist syntaktisch beziehungsweise historisch schwer zu deuten. Eine harmonisierende Auslegung würde mehr festlegen, als der Wortlaut sicher erkennen lässt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem historiografischem Ton. Die lange Aufzählung und die rhetorische Schlussfrage orientieren sich an der königlichen Berichtsformel des Hebräischen; die schwierige Orts- und Herrschaftsangabe wird nicht geglättet.
