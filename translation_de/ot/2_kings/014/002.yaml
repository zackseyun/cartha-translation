base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: de
  text: Er war fünfundzwanzig Jahre alt, als er König wurde, und regierte neunundzwanzig Jahre in Jerusalem. Seine Mutter hieß Jehoaddin[a] und stammte aus Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der Name häufig als »Jehoaddan« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: fünfundzwanzig Jahre alt
  rationale: Die natürliche deutsche Wiedergabe der hebräischen Altersangabe bewahrt den Sinn ohne den im Deutschen unüblichen Ausdruck »ein Sohn von fünfundzwanzig Jahren«.
- source_word: הָיָה בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die hebräische Thronbesteigungsformel wird im modernen Deutsch klar und idiomatisch wiedergegeben.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: regierte neunundzwanzig Jahre
  rationale: »Regierte« gibt מלך in der Formel zur Dauer der Königsherrschaft präzise und natürlich wieder.
- source_word: בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Direkte Wiedergabe der Ortsangabe.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Natürliche moderne deutsche Entsprechung der wiederkehrenden Namensformel.
- source_word: יהועדין
  choice: Jehoaddin
  rationale: Die Transliteration folgt der im WLC überlieferten vokalisierten Namensform; die verbreitete deutsche Traditionsform wird in einer Fußnote genannt.
- source_word: מִן יְרוּשָׁלָם
  choice: stammte aus Jerusalem
  rationale: מן bezeichnet hier die Herkunft; »stammte aus« macht diese Beziehung im Deutschen eindeutig und idiomatisch.
