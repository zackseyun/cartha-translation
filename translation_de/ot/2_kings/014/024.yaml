  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war. Er wandte sich von keiner der Sünden Jerobeams, des Sohnes Nebats, ab, der Israel zum Sündigen gebracht hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von keiner der Sünden Jerobeams, des Sohnes Nebats, durch die er Israel zum Sündigen gebracht hatte.“ Der hebräische Relativsatz bezieht sich grammatisch auf Jerobeam; im Sinnzusammenhang kann er auch auf seine Sünden beziehungsweise Praktiken bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was böse war
  rationale: Die geläufige hebräische Wertungsformel wird nah am Wortlaut und zugleich idiomatisch auf Deutsch wiedergegeben.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die transparente hebräische Wendung für göttliche Beurteilung bleibt erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Er wandte sich von keiner der Sünden … ab
  rationale: Bei verneintem Verb gibt „von keiner“ die umfassende Aussage von מִכָּל im natürlichen Deutschen präzise wieder.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeams, des Sohnes Nebats
  rationale: Die Genitivkonstruktion und die Abstammungsangabe werden in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: der Israel zur Sünde verführt hatte
  rationale: Der Hifil von חטא hat kausative Bedeutung. „Zur Sünde verführen“ drückt im Deutschen natürlich aus, dass Jerobeam Israel zum Sündigen brachte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ bewahrt dessen Charakter als Gottesname.
- issue: Bezugswort von אֲשֶׁר
  choice: 'Relativsatz unmittelbar auf Jerobeam bezogen: „der Israel zur Sünde verführt hatte“'
  alternative: 'Instrumentaler Bezug auf die Sünden: „durch die er Israel zur Sünde verführt hatte“'
  rationale: Das maskuline Singularpronomen im impliziten Subjekt und die feste deuteronomistische Formel sprechen für Jerobeam als direkten Bezug. Da die knappe hebräische Syntax auch einen instrumentalen Sinnzusammenhang zulässt, wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Königsformel bleibt erkennbar, ohne unnötig altertümliche Sprache zu verwenden.
