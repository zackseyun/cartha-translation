source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes richtig war, jedoch[a] nicht wie David, sein Vater[b]; in allem handelte er so, wie sein Vater Joasch[c] gehandelt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nur war er nicht wie David, sein Vater.« Das hebräische Wort kann die Einschränkung auch mit »nur« einleiten.'
    reason: lexical_alternative
  - marker: b
    text: »Vater« bezeichnet David hier als dynastischen Vorfahren, nicht als unmittelbaren leiblichen Vater.
    reason: cultural_note
  - marker: c
    text: Der Name Joasch wird auch als Joas oder Jehoasch wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das narrative Wayyiqtol wird im Deutschen natürlich ohne einleitendes »und« wiedergegeben.
- source_word: הַיָּשָׁר
  choice: was … richtig war
  rationale: Gibt das substantivierte Adjektiv in der königlichen Beurteilungsformel idiomatisch und verständlich wieder.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Bewahrt das hebräische Bild für Gottes Beurteilung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder.
- source_word: רַק
  choice: jedoch
  rationale: Kennzeichnet die Einschränkung der zuvor positiven Beurteilung; die wörtlichere Möglichkeit »nur« bleibt in einer Fußnote erhalten.
- source_word: לֹא כְּדָוִד אָבִיו
  choice: nicht wie sein Vater David
  rationale: Bewahrt den knappen Vergleich und die dynastische Vaterbezeichnung des Hebräischen.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: alles so, wie … es getan hatte
  rationale: Bringt die umfassende Übereinstimmung natürlich zum Ausdruck, ohne die Aussage abzuschwächen.
- source_word: יוֹאָשׁ אָבִיו
  choice: sein Vater Joasch
  rationale: Entspricht der hebräischen Namensform יוֹאָשׁ und bezeichnet hier den unmittelbaren Vater Amazjas.
- source_word: עָשָׂה
  choice: es getan hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Joaschs Handeln demjenigen Amazjas vorausging.
theological_decisions:
- issue: Königliche Beurteilungsformel zwischen Anerkennung und Einschränkung
  choice: Amazjas Handeln wird wirklich als richtig anerkannt, zugleich aber durch den Vergleich mit David eingeschränkt und am Vorbild Joaschs eingeordnet.
  alternative: Die Anerkennung könnte auf Kosten der Einschränkung verstärkt oder die Einschränkung so betont werden, dass die einleitende Anerkennung nur noch formelhaft erscheint.
  rationale: Die hebräische Satzstruktur hält positive Beurteilung und deutliche Einschränkung nebeneinander; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Wendung »in den Augen Jahwes« bleibt wegen ihrer Anschaulichkeit erhalten. Der Satzbau ist leicht geglättet, bewahrt aber die positive Wertung und ihre anschließende Einschränkung.
