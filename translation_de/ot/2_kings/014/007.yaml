base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: de
  text: Er schlug im Salztal zehntausend Edomiter, eroberte Sela[a] im Kampf und nannte es Jokteël; so heißt es bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sela kann auch seiner Wortbedeutung nach als „der Fels“ oder „die Felsenklippe“ verstanden werden; hier ist wahrscheinlich der Ortsname Sela gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה אֶת אֱדוֹם ... עֲשֶׂרֶת אֲלָפִים
  choice: schlug ... zehntausend Edomiter
  rationale: נכה bezeichnet hier militärisches, im Zusammenhang mit der Zahl der Betroffenen offenbar tödliches Schlagen. „Edom“ steht kollektiv für die Edomiter; die deutsche Wiedergabe macht diesen Personenbezug natürlich verständlich.
- source_word: בְּגֵיא הַמֶּלַח
  choice: im Salztal
  rationale: Natürliche und etablierte deutsche Wiedergabe der geografischen Konstruktverbindung „Tal des Salzes“.
- source_word: וְתָפַשׂ
  choice: und eroberte
  rationale: תפשׂ bezeichnet im militärischen Zusammenhang die gewaltsame Einnahme eines Ortes.
- source_word: הַסֶּלַע
  choice: Sela
  rationale: Im Kontext ist wahrscheinlich der Ortsname Sela gemeint. Die mögliche lexikalische Bedeutung „der Fels“ wird in der Fußnote bewahrt.
- source_word: בַּמִּלְחָמָה
  choice: im Kampf
  rationale: Gibt den militärischen Umstand knapp und idiomatisch wieder.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ יָקְתְאֵל
  choice: Er gab der Stadt den Namen Jokteël
  rationale: Natürliche deutsche Wiedergabe der hebräischen Benennungsformel; „der Stadt“ verdeutlicht den femininen Rückbezug von שְׁמָהּ auf den eingenommenen Ort.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: den sie bis zum heutigen Tag trägt
  rationale: Idiomat ische Wiedergabe der Formel, die aussagt, dass der vergebene Name zur Zeit des Erzählers fortbestand.
