id: 2KI.14.4
reference: 2 Kings 14:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: de
  text: Doch die Kulthöhen[a] wurden nicht beseitigt; das Volk brachte weiterhin Opfer dar und verbrannte Räucherwerk[b] auf den Kulthöhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet örtliche Kultstätten, die häufig auf Anhöhen lagen.
    reason: lexical_clarification
  - marker: b
    text: 'Oder: ließ Opfergaben in Rauch aufgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: רַק schränkt die vorausgehende positive Beurteilung des Königs ein. „Doch“ gibt diesen adversativen Sinn im Deutschen knapp und natürlich wieder.
- source_word: הַבָּמוֹת
  choice: die Kulthöhen
  rationale: בָּמוֹת bezeichnet örtliche Kultstätten, häufig auf erhöhtem Gelände. „Kulthöhen“ ist präziser als das missverständliche bloße „Höhen“ und vermeidet eine wertende Erweiterung.
- source_word: לֹא סָרוּ
  choice: wurden nicht beseitigt
  rationale: Bei den Kulthöhen als Subjekt bezeichnet סור hier ihr Fortbestehen beziehungsweise ihre nicht erfolgte Abschaffung. Die passive Formulierung gibt den kontextuellen Sinn idiomatisch wieder.
- source_word: עוֹד
  choice: weiterhin
  rationale: עוֹד kennzeichnet die fortdauernde, gewohnheitsmäßige Kultpraxis.
- source_word: הָעָם
  choice: das Volk
  rationale: Direkte und im historischen Kontext natürliche Wiedergabe des Kollektivbegriffs.
- source_word: מְזַבְּחִים
  choice: brachte Opfer dar
  rationale: Das Partizip beschreibt eine fortgesetzte beziehungsweise gewohnheitsmäßige Handlung. „Opfer darbringen“ ist eine natürliche kultische Formulierung im Deutschen.
- source_word: וּמְקַטְּרִים
  choice: und verbrannte Räucherwerk
  rationale: קטר bezeichnet im Kultzusammenhang häufig das Verbrennen von Räucherwerk, kann aber auch allgemeiner das In-Rauch-Aufgehenlassen einer Opfergabe meinen; die wahrscheinlichste Wiedergabe steht im Text, die weitere Möglichkeit in der Fußnote.
- source_word: בַּבָּמוֹת
  choice: auf den Kulthöhen
  rationale: Die Präposition בְּ ist hier lokal. „Auf den Kulthöhen“ entspricht dem räumlichen Bild und dem etablierten deutschen Sprachgebrauch.
theological_decisions:
- issue: Bewertung des Kultes auf den Kulthöhen
  choice: Die historisch-beschreibende Bezeichnung „Kulthöhen“ bleibt ohne wertende Ergänzung im Haupttext.
  alternative: „unerlaubte Kultstätten“ oder „heidnische Heiligtümer“
  rationale: Der größere Erzählzusammenhang bewertet das Fortbestehen dieser Kultstätten negativ; der Vers selbst nennt sie jedoch lediglich und berichtet von der dort fortgesetzten Opferpraxis. Eine ausdrücklich konfessionelle oder moralische Deutung wird daher nicht in die Übersetzung eingefügt.
- issue: Bedeutungsumfang von קטר
  choice: „Räucherwerk verbrennen“ im Haupttext, mit Hinweis auf die weitere kultische Bedeutung in der Fußnote.
  alternative: „Opfergaben in Rauch aufgehen lassen“
  rationale: Die wahrscheinlichste kultische Bedeutung wird lesbar wiedergegeben, ohne die echte lexikalische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortdauernde Gewohnheit der beiden hebräischen Partizipien wird durch „weiterhin“ ausgedrückt. Die Wiederholung von „Kulthöhen“ bleibt erhalten, da sie auch im Hebräischen steht.
