  terminology: Die kultischen Begriffe sind konsistent und sachlich. „Kulthöhen“ vermeidet sowohl eine zu vage Wiedergabe als auch eine im Haupttext überzogene interpretative Wertung. Die Fußnote zu „Räucherwerk“ markiert sinnvoll, dass קטר in diesem Kontext auch weiter als das In-Rauch-Aufgehenlassen von Opfergaben verstanden werden kann.
