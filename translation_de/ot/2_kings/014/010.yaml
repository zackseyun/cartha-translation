  text: הַכֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּֽ/נְשָׂאֲ/ךָ֖ לִבֶּ֑/ךָ הִכָּבֵד֙ וְ/שֵׁ֣ב בְּ/בֵיתֶ֔/ךָ וְ/לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ה אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: de
  text: Du hast Edom tatsächlich geschlagen, und dein Herz hat dich stolz gemacht.[a] Genieße deinen Ruhm und bleib zu Hause! Warum willst du das Unglück herausfordern, sodass du zu Fall kommst – du und Juda mit dir?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dein Herz hat dich emporgehoben“; die Wendung bezeichnet Stolz oder Selbsterhebung nach dem Sieg.'
    reason: Bewahrt das hebräische Bild und erläutert die idiomatische Bedeutung, ohne sie stärker als der Ausgangstext einzuengen.
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: Du hast … tatsächlich geschlagen
  rationale: Der Infinitivus absolutus zusammen mit dem finiten Verb verstärkt die Aussage. „Tatsächlich“ gibt diese Betonung wieder, während „geschlagen“ nahe bei נכה bleibt.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: dein Herz hat dich überheblich gemacht
  rationale: Die Wendung lautet bildlich, dass das Herz den König emporgehoben hat, und bezeichnet hier Stolz oder Selbstüberhebung. Die deutsche Fassung bewahrt das Herz als Subjekt, macht aber den idiomatischen Sinn verständlich.
- source_word: הִכָּבֵד
  choice: Genieße deinen Ruhm
  rationale: Der Niphal-Imperativ kann hier dazu auffordern, sich mit der durch den Sieg gewonnenen Ehre zufriedenzugeben. Die Übersetzung passt zum anschließenden Rat, zu Hause zu bleiben, ohne den Ausdruck unnötig als scharfes „Prahle“ zu deuten.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: und bleib zu Hause
  rationale: Die natürliche deutsche Wendung gibt die Aufforderung wieder, keinen weiteren Krieg zu suchen.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: willst du das Unglück herausfordern
  rationale: Das Hitpael von גרה bezeichnet das Sich-Einlassen auf beziehungsweise Herausfordern von Streit; רעה meint im Kontext drohendes Unheil oder Unglück, nicht notwendig moralisches Böses.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: sodass du zu Fall kommst – du und Juda mit dir
  rationale: Die Formulierung bewahrt die Folgerelation und die nachdrückliche Aussage, dass der König auch Juda in seinen Fall hineinziehen würde.
