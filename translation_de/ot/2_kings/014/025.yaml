id: 2KI.14.25
reference: 2 Kings 14:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: de
  text: Er stellte die Grenze Israels wieder her, von Lebo-Hamat[a] bis zum Meer der Araba[b], entsprechend dem Wort Jahwes, des Gottes Israels, das er durch seinen Diener Jona, den Sohn Amittais, den Propheten aus Gat-Hefer, gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „vom Zugang nach Hamat“ beziehungsweise „vom Eingang Hamats“.'
    reason: lexical_alternative
  - marker: b
    text: Damit ist wahrscheinlich das Tote Meer gemeint.
    reason: geographical_identification
lexical_decisions:
- source_word: הֵשִׁיב
  choice: stellte … wieder her
  rationale: Der Hifil von שׁוב bezeichnet hier die Wiederherstellung der territorialen Grenze Israels; die deutsche Wendung gibt den politisch-geografischen Sinn natürlich wieder.
- source_word: גְּבוּל
  choice: Grenze
  rationale: Das Substantiv bezeichnet hier die territoriale Grenzlinie; „Grenze“ ist im Deutschen klarer und quellennäher als „Gebiet“.
- source_word: מִלְּבוֹא חֲמָת
  choice: von Lebo-Hamat
  rationale: Die Wortgruppe kann als feste geografische Bezeichnung beziehungsweise Ortsname verstanden werden. Die wörtlichere Deutung wird in der Fußnote bewahrt.
- source_word: יָם הָעֲרָבָה
  choice: Meer der Araba
  rationale: Dies bildet die hebräische geografische Bezeichnung direkt ab, ohne die wahrscheinliche Identifizierung mit dem Toten Meer in den Haupttext einzutragen.
- source_word: כִּדְבַר
  choice: entsprechend dem Wort
  rationale: Die Formulierung bezeichnet die Übereinstimmung mit einem zuvor ergangenen göttlichen Ausspruch und klingt zugleich natürlich auf Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen gebräuchliche Umschrift bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּיַד
  choice: durch
  rationale: Die hebräische Wendung bezeichnet Vermittlung oder Werkzeug. „Durch“ gibt diese Funktion im heutigen Deutsch klar wieder, ohne den fremdartigen Semitismus „durch die Hand“ zu erzwingen.
- source_word: עַבְדּוֹ
  choice: seinen Diener
  rationale: Im Kontext prophetischer Beauftragung bezeichnet עבד den zu Gott gehörenden und von ihm beauftragten Diener.
- source_word: הַנָּבִיא
  choice: den Propheten
  rationale: Die Apposition kennzeichnet Jonas Rolle und wird in natürlicher deutscher Satzfügung beibehalten.
- source_word: מִגַּת הַחֵפֶר
  choice: aus Gat-Hefer
  rationale: Die Präposition מן bezeichnet die Herkunft; „aus“ gibt dies idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Name wird in der deutschen Standardform bewahrt und nicht durch einen Titel ersetzt.
- issue: Identifizierung von יָם הָעֲרָבָה
  choice: Meer der Araba
  alternative: Totes Meer
  rationale: Der Haupttext bewahrt die Formulierung des Hebräischen; die wahrscheinliche geografische Identifizierung erscheint in einer Fußnote, damit keine über den Wortlaut hinausgehende Festlegung stillschweigend erfolgt.
- issue: Vermittlungsformel בְּיַד עַבְדּוֹ
  choice: durch seinen Diener
  alternative: durch die Hand seines Dieners
  rationale: Die Bedeutung der prophetischen Vermittlung bleibt erhalten, während ein im modernen Deutsch unnötig fremdartiger Ausdruck vermieden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geografischen Namen werden in geläufiger deutscher Umschrift wiedergegeben. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken; damit wird die in der englischen Konsultationsfassung offenbar vertauschte Zuordnung berichtigt.
