source:
  edition: WLC
  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: de
  text: Amazja, der Sohn des Joasch und König von Juda, lebte nach dem Tod des Joas, des Sohnes des Joahas und Königs von Israel, noch fünfzehn Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte … noch
  rationale: Das Verb חיה bezeichnet hier das Weiterleben während einer bestimmten Zeit nach dem Tod eines anderen Königs. „lebte … noch“ gibt diesen chronologischen Sinn im Deutschen natürlich wieder, ohne das stärker deutende „überlebte“ zu verwenden.
- source_word: אֲמַצְיָהוּ
  choice: Amazja
  rationale: Eingebürgerte deutsche Namensform.
- source_word: בֶן יוֹאָשׁ
  choice: Sohn des Joasch
  rationale: Die Status-constructus-Verbindung bezeichnet die direkte Abstammung; „Joasch“ ist die übliche deutsche Wiedergabe der hier verwendeten kürzeren Namensform יוֹאָשׁ.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Natürliche deutsche Wiedergabe der Amts- und Reichsbezeichnung.
- source_word: אַחֲרֵי מוֹת
  choice: nach dem Tod
  rationale: Bewahrt die nominale Ausdrucksweise des Hebräischen und ist im Deutschen idiomatisch.
- source_word: יְהוֹאָשׁ
  choice: Joasch
  rationale: Im Deutschen ist „Joasch“ auch für die längere hebräische Form יְהוֹאָשׁ üblich; die Identität wird durch die unterschiedlichen Vaters- und Reichsangaben eindeutig.
- source_word: בֶן יְהוֹאָחָז
  choice: Sohn des Joahas
  rationale: Direkte Wiedergabe der Abstammungsangabe mit der geläufigen deutschen Namensform Joahas.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: König von Israel
  rationale: Natürliche deutsche Wiedergabe der Amts- und Reichsbezeichnung.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: fünfzehn Jahre
  rationale: Direkte und idiomatische Wiedergabe der Zeitdauer.
