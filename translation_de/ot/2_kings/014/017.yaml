  naturalness: Die Formulierung ist klar, idiomatisch und dem würdigen Register angemessen. „lebte … noch fünfzehn Jahre“ gibt den Fortdauer-Sinn von וַיְחִי nach אַחֲרֵי מוֹת natürlich wieder.
  terminology: Amazja, Joasch, Joahas, Juda und Israel sind passende deutsche Bibelnamens- und Sachformen. Für den israelitischen König ist „Joas“ die im Deutschen geläufige unterscheidende Form und entspricht zugleich der längeren hebräischen Namensform in diesem Vers.
