    rationale: Diese pauschale Aussage ist nicht belastbar und steht einer naheliegenden, in deutschen Bibelübersetzungen verbreiteten Unterscheidung als „Joasch“ und „Joas“ entgegen. Nach der Textrevision ist die Fußnote entbehrlich.
