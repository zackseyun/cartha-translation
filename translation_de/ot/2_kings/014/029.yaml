base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: de
  text: Und Jerobeam legte sich zu seinen Vorfahren[a], zu den Königen Israels[b]. Sein Sohn Sacharja wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „legte sich zu seinen Vätern“; dies ist eine übliche hebräische Formel für den Tod eines Königs.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei den Königen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: legte sich zu seinen Vorfahren
  rationale: Die traditionelle königliche Todesformel bleibt als Bild erhalten. „Vorfahren“ gibt אָבוֹת im heutigen Deutsch verständlicher wieder als das missverständliche „Väter“; „legte sich“ bewahrt den hebräischen Wortlaut besser als die deutende Wiedergabe „starb“.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: zu den Königen Israels
  rationale: Das wiederholte עִם wird parallel wiedergegeben. „Zu“ fügt sich natürlich in die deutsche Todesformel ein, ohne festzulegen, ob ausdrücklich eine gemeinsame Grabstätte gemeint ist.
- source_word: וַיִּמְלֹךְ
  choice: wurde ... König
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Verb den Regierungsantritt. Diese Formulierung ist im modernen Deutsch natürlicher als „regierte an seiner Stelle“ und vermeidet den möglichen Eindruck, der Vers berichte über die gesamte Regierungszeit.
- source_word: זְכַרְיָה
  choice: Secharja
  rationale: Gängige deutsche Bibelform des hebräischen Personennamens.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Direkte und eindeutige Wiedergabe der verwandtschaftlichen Bezeichnung.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Gibt im Kontext einer königlichen Nachfolge präzise wieder, dass Secharja Jerobeams Stellung übernahm.
theological_decisions:
- issue: Bedeutung der königlichen Todesformel
  choice: Die bildhafte Formel wird im Haupttext beibehalten und in der Fußnote erklärt.
  alternative: „Jerobeam starb“
  rationale: Der hebräische Text verwendet eine konventionelle, aber bildhafte Formel. Eine unmittelbare Auflösung zu „starb“ wäre verständlich, würde jedoch die literarische Gestalt des Ausgangstextes beseitigen.
- issue: Bezug von „zu den Königen Israels“
  choice: Die syntaktische Parallelität und mögliche Mehrdeutigkeit bleiben erhalten.
  alternative: „und wurde bei den Königen Israels begraben“
  rationale: Der Text nennt hier weder ausdrücklich ein Begräbnis noch eine Grabstätte. Eine solche Präzisierung würde über den hebräischen Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Todesformel wird erkennbar bewahrt, zugleich wird das heute natürlichere „Vorfahren“ verwendet. Der zweite Satz ist für flüssiges Deutsch eigenständig formuliert.
