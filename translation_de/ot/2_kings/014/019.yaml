  text: וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַֽחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִתֻ֖/הוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: de
  text: Sie verschworen sich in Jerusalem gegen ihn, und er floh nach Lachisch; sie sandten ihm nach Lachisch nach[a] und töteten ihn dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie sandten hinter ihm her“. Das Hebräische nennt nicht, wen oder was sie aussandten; möglich ist auch: „sie ließen ihn bis nach Lachisch verfolgen“.'
    reason: Bewahrt die im Hebräischen nicht näher bestimmte Sendung und erläutert die idiomatische, elliptische Formulierung.
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: Sie verschworen sich gegen ihn
  rationale: Die Verbindung des Verbs קשׁר mit dem stammverwandten Substantiv קֶשֶׁר bezeichnet idiomatisch eine feindliche, politische Verschwörung. Die deutsche reflexive Form gibt dies natürlich und knapp wieder.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Die Präposition בְּ wird hier schlicht lokal gebraucht.
- source_word: וַיָּנָס
  choice: Er floh
  rationale: נוס bezeichnet im Erzählzusammenhang direkt das Fliehen vor einer Gefahr.
- source_word: לָכִישָׁה
  choice: nach Lachisch
  rationale: Das direktionale ה zeigt eine Bewegung auf die Stadt zu an; im Deutschen ist dafür „nach Lachisch“ idiomatisch.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: sie sandten ihm Leute hinterher
  rationale: Wörtlich steht „sie sandten hinter ihm her“. Da das ausgesandte Objekt im Hebräischen unausgesprochen bleibt, ergänzt die Übersetzung das im Deutschen benötigte allgemeine „Leute“, ohne deren genauere Rolle festzulegen; die Fußnote bewahrt die knappe hebräische Formulierung.
- source_word: וַיְמִתֻהוּ
  choice: töteten ihn
  rationale: Die Kausativform von מות bedeutet „zu Tode bringen, töten“. „Töteten ihn“ ist im Deutschen direkt und bewahrt den absichtlichen Charakter der Handlung.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf Lachisch zurück.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die wiederholte Nennung Lachischs und die parataktische Abfolge des Hebräischen bleiben erhalten; das allgemeine „Leute“ macht die elliptische Wendung im Deutschen verständlich, ohne die Ausgesandten näher zu bestimmen.
