  yaml_path: translation/ot/2_kings/014/012.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: de
  text: Und Juda wurde von Israel besiegt, und jeder floh zu seinem Zelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder floh nach Hause“. Wörtlich heißt es: „jeder zu seinem Zelt“; dies ist eine geläufige Wendung für die Rückkehr in die eigene Unterkunft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: wurde … besiegt
  rationale: Das Nifal von נָגַף bezeichnet hier im militärischen Zusammenhang eine Niederlage; die passive Wiedergabe ist klar und entspricht der hebräischen Form.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Etablierte deutsche Namensform für das Südreich.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: von Israel
  rationale: Die hebräische Wendung bedeutet im Kampfzusammenhang, vor einem Gegner zu unterliegen. Natürliches modernes Deutsch verwendet dafür beim Passiv die Urheberangabe mit „von“.
- source_word: וַיָּנֻסוּ
  choice: floh
  rationale: נוּס bedeutet fliehen. Der deutsche distributive Singular „jeder floh“ gibt die Verbindung mit אִישׁ natürlich wieder.
- source_word: אִישׁ
  choice: jeder
  rationale: Der distributiv gebrauchte Singular bezeichnet, dass die Angehörigen des Heeres jeweils einzeln die Flucht ergriffen; „jeder“ ist im Deutschen knapp und idiomatisch.
- source_word: לְאָהֳלוֹ
  choice: zu seinem Zelt
  rationale: Die wörtliche Bildsprache bleibt erhalten. Zugleich kann die Wendung idiomatisch die Rückkehr in die eigene Unterkunft oder nach Hause bezeichnen, was die Fußnote ausweist.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählprosa. Die militärische Aussage wird natürlich wiedergegeben, während das konkrete hebräische Bild „zu seinem Zelt“ im Haupttext erhalten bleibt.
