  text: אָ֣ז שָׁלַ֤ח אֲמַצְיָה֙ מַלְאָכִ֔ים אֶל יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לְכָ֖/ה נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: de
  text: 'Da sandte Amazja Boten zu Joasch[a], dem Sohn des Joahas und Enkel Jehus, dem König von Israel. Er ließ ihm sagen: »Komm, wir wollen einander von Angesicht zu Angesicht begegnen![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Name wird auch mit „Jehoasch“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „Wir wollen einander ins Gesicht sehen.“ Im Zusammenhang ist dies eine Aufforderung zur direkten Begegnung, wahrscheinlich zur militärischen Auseinandersetzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Leitet in deutscher Erzählprosa natürlich das nächste Ereignis ein und gibt den zeitlich-fortschreitenden Sinn wieder.
- source_word: שָׁלַח ... מַלְאָכִים
  choice: sandte ... Boten
  rationale: Bezeichnet hier menschliche Überbringer einer königlichen Botschaft; „Boten“ ist klar und idiomatisch.
- source_word: יְהוֹאָשׁ
  choice: Joasch
  rationale: Joasch ist die im Deutschen geläufige Namensform; die vollständigere Wiedergabe „Jehoasch“ wird in einer Fußnote genannt.
- source_word: בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: dem Sohn des Joahas und Enkel Jehus
  rationale: Gibt die genealogische Abfolge im natürlichen Deutschen eindeutig wieder, ohne Joahas fälschlich als Sohn Jehus erscheinen zu lassen.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Direkte und natürliche Wiedergabe des Königstitels.
- source_word: לֵאמֹר
  choice: Er ließ ihm sagen
  rationale: Überträgt die hebräische Zitatseinleitung in geläufige deutsche Erzählprosa.
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ formuliert eine direkte, im Kontext herausfordernde Aufforderung.
- source_word: נִתְרָאֶה פָנִים
  choice: wir wollen einander von Angesicht zu Angesicht begegnen
  rationale: Bewahrt das Bild des hebräischen Ausdrucks und klingt zugleich natürlich; der Zusammenhang einer militärischen Herausforderung wird in der Fußnote erläutert, statt im Haupttext festgeschrieben zu werden.
