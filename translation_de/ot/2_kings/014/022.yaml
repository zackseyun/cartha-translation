base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/022.yaml
  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: de
  text: Er baute Elat wieder auf und gab es Juda zurück, nachdem der König sich zu seinen Vätern gelegt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: baute … wieder auf
  rationale: Das Verb bedeutet grundsätzlich „bauen“. Im Zusammenhang mit der bereits bestehenden Stadt Elat bezeichnet es hier plausibel ihre Wiederherstellung bzw. ihren Wiederaufbau; dies entspricht auch der konsultierten englischen Fassung.
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: brachte es an Juda zurück
  rationale: Die Hifil-Form von שׁוב drückt ein Zurückbringen bzw. Wiederherstellen aus. „An Juda“ bewahrt die politische Zugehörigkeit, ohne genauer festzulegen, auf welche Weise sie wiederhergestellt wurde.
- source_word: שְׁכַב ... עִם אֲבֹתָיו
  choice: sich zu seinen Vorfahren gelegt hatte
  rationale: Die traditionelle Todesformel wird in würdigem, verständlichem Deutsch relativ formal wiedergegeben und nicht auf das bloße „sterben“ verkürzt.
theological_decisions:
- issue: Identität des nicht ausdrücklich genannten Königs
  choice: der König
  alternative: sein Vater, der König / König Amazja
  rationale: Der hebräische Text nennt nur „der König“. Die Übersetzung lässt diesen Bezug unverdeutlicht und importiert keine kontextuelle Identifizierung in den Vers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählweise und die traditionelle Todesformel des hebräischen Textes bleiben erhalten.
