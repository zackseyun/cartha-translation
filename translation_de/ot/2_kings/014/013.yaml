  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: de
  text: Joasch, der König von Israel, nahm Amazja, den König von Juda, den Sohn Joaschs, des Sohnes Ahasjas, bei Bet-Schemesch gefangen. Dann kam Joasch nach Jerusalem[a] und riss die Jerusalemer Stadtmauer vom Ephraimtor bis zum Ecktor auf einer Länge von vierhundert Ellen nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Konsonantentext (Ketiv) lautet „und sie kamen nach Jerusalem“. Die masoretische Lesung (Qere) und das folgende Verb im Singular stützen jedoch den Sinn „und er kam nach Jerusalem“, bezogen auf Joasch.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: nahm … gefangen
  rationale: Das Verb bezeichnet hier im militärischen Zusammenhang die Gefangennahme des besiegten Königs.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: bei Bet-Schemesch
  rationale: Die Präposition ב bezeichnet hier den Ort der Gefangennahme; „bei“ ist im Deutschen bei einem Schauplatz natürlich.
- source_word: ו/יבאו
  choice: Dann zog Joasch … hinauf
  rationale: Der Konsonantentext ist pluralisch („und sie kamen“), während der masoretische Lesesinn und das folgende singularische Verb Joasch als handelnde Person nahelegen. „Hinaufziehen“ ist für den Weg nach Jerusalem idiomatisch, ohne eine zusätzliche theologische Aussage einzutragen.
- source_word: וַיִּפְרֹץ
  choice: riss … nieder
  rationale: Mit der Stadtmauer als Objekt bezeichnet das Verb das gewaltsame Öffnen beziehungsweise Niederreißen eines Mauerabschnitts.
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: die Jerusalemer Stadtmauer
  rationale: Diese Wiedergabe bezeichnet das konkrete Verteidigungsbauwerk natürlich und präzise.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: vom Ephraimtor bis zum Ecktor
  rationale: Die Formulierung gibt die räumliche Ausdehnung des niedergerissenen Abschnitts klar wieder.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: auf einer Länge von vierhundert Ellen
  rationale: Die antike Maßeinheit bleibt erhalten; „auf einer Länge von“ verdeutlicht die im Hebräischen knappe Maßangabe.
- source_word: בֶּן יְהוֹאָשׁ בֶּן אֲחַזְיָהוּ
  choice: Sohn des Joasch und Enkel Ahasjas
  rationale: Das zweite בֶּן kennzeichnet in dieser genealogischen Folge die nächste Generation; „Enkel“ vermeidet im modernen Deutsch den missverständlichen Eindruck zweier unmittelbarer Väter.
