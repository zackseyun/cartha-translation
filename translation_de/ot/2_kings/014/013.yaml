  - severity: low
    issue: „Dann zog Joasch nach Jerusalem hinauf“ ergänzt „hinauf“.
    rationale: Der hebräische Text sagt lediglich, dass er nach Jerusalem kam. Die geographisch naheliegende Aufwärtsbewegung muss nicht ergänzt werden.
  - severity: medium
    issue: Die Fußnote schreibt der „masoretischen Lesetradition“ allgemein den Singular zu, ohne das Qere ausdrücklich zu benennen.
    rationale: Der Konsonantentext (Ketiv) ist pluralisch; die masoretische Qere-Lesung ist singularisch. Diese Unterscheidung ist für die dokumentierte Textvariante erforderlich.
