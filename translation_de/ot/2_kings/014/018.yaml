source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י אֲמַצְיָ֑הוּ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Die übrigen Taten Amazjas – sind sie nicht im Buch der Chronik der Könige von Juda niedergeschrieben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: יֶתֶר bezeichnet den verbleibenden Teil; דִּבְרֵי meint in dieser königlichen Schlussformel die Taten und Angelegenheiten des Königs, nicht nur seine Worte. Das vorangestellte וְ wird im Deutschen durch den formelhaften Anschluss ohne ein zusätzliches zeitliches »nun« angemessen wiedergegeben.
- source_word: אֲמַצְיָהוּ
  choice: Amazjas
  rationale: Der Königsname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht … niedergeschrieben?
  rationale: Die rhetorische Frage erwartet Zustimmung. Der passive Partizipialausdruck wird präsentisch und nahe am hebräischen Wortlaut wiedergegeben.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl עַל wörtlich »auf« heißen kann, bezeichnet die feste Archivformel idiomatisch einen Eintrag in einem Buch beziehungsweise Schriftstück.
- source_word: דִּבְרֵי הַיָּמִים
  choice: der Chronik
  rationale: Die Wendung bezeichnet hier eine annalistische Aufzeichnung. »Chronik« ist im Deutschen natürlich und wahrt den traditionellen Bezug, ohne sie mit dem kanonischen Buch der Chronik gleichzusetzen.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Das לְ kennzeichnet hier die Zuordnung der annalistischen Quelle zu den Königen von Juda; der deutsche Genitiv gibt diese Titelbeziehung idiomatisch wieder.
theological_decisions: []
