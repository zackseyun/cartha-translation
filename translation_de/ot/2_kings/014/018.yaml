  source_fidelity: 'Die Übersetzung gibt die regnalzeitliche Schlussformel genau wieder: »übrigen Taten« entspricht וְיֶתֶר דִּבְרֵי, die rhetorische Frage wahrt הֲלֹא הֵם כְּתוּבִים, und »im Buch der Chronik der Könige von Juda« bildet die archivalische Quellenangabe angemessen ab. Die Gegenwartsform von »sind … niedergeschrieben« entspricht dem hebräischen passiven Partizip.'
