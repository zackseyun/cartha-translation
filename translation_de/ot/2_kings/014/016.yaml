base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: de
  text: Joasch starb und wurde in Samaria bei den Königen Israels begraben. Sein Sohn Jerobeam wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vorfahren
  rationale: Die hebräische königliche Sterbeformel wird erkennbar bewahrt. „Vorfahren“ gibt אָבוֹת in diesem Zusammenhang im heutigen Deutsch natürlicher und eindeutiger wieder als „Väter“.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Die passive Form entspricht dem hebräischen Nifal und ist idiomatisches Deutsch.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition בְּ bezeichnet hier den Ort der Bestattung.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: bei den Königen Israels
  rationale: Im deutschen Bestattungskontext drückt „bei“ die durch עִם bezeichnete räumliche und gemeinschaftliche Zuordnung natürlicher aus als „mit“.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der Thronfolgeformel bezeichnet מָלַךְ hier den Regierungsantritt; „wurde König“ ist im modernen Deutsch natürlicher als das rückblickend klingende „regierte“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bewahrt den Gedanken der Nachfolge und Ersetzung, statt sie lediglich zeitlich mit „nach ihm“ wiederzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Sprache des Königsbuchs bleibt sichtbar, ohne durch das heute missverständliche „bei seinen Vätern schlafen“ unnötig altertümlich zu wirken. Der parataktische hebräische Ablauf wird für einen natürlichen deutschen Satzrhythmus leicht gegliedert.
