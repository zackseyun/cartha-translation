base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: de
  text: Im fünfzehnten Regierungsjahr Amazjas, des Sohnes Joaschs, des Königs von Juda, wurde Jerobeam, der Sohn Joaschs, in Samaria König von Israel und regierte einundvierzig Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: Im fünfzehnten Regierungsjahr
  rationale: Die hebräische Datierungsformel verwendet eine Kardinalzahl mit שָׁנָה in ordinaler Funktion. „Regierungsjahr“ macht den gemeinten Bezug auf die Herrschaft Amazjas im Deutschen klar.
- source_word: לַאֲמַצְיָהוּ
  choice: Amazjas
  rationale: ל markiert in dieser Königsformel den Herrscher, nach dessen Regierungsjahr datiert wird; der deutsche Genitiv wird durch „Amazjas“ nach „Regierungsjahr“ natürlich ausgedrückt.
- source_word: בֶן יוֹאָשׁ
  choice: des Sohnes Joaschs / der Sohn Joaschs
  rationale: Die patronymische Verbindung wird direkt wiedergegeben; die Kasusformen richten sich nach dem deutschen Satzbau.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Status- und Gebietsangabe zu Amazja wird als Apposition wiedergegeben.
- source_word: מָלַךְ
  choice: wurde … König und regierte
  rationale: Dasselbe Verb trägt hier sowohl die Angabe des Herrschaftsantritts als auch zusammen mit der Zeitdauer die Bedeutung „regieren“. Die deutsche Formulierung bildet beide Aspekte verständlich ab.
- source_word: יָרָבְעָם
  choice: Jerobeam
  rationale: Gebräuchliche deutsche Namensform.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: König von Israel
  rationale: Die Verbindung bezeichnet Amt und Herrschaftsgebiet Jerobeams.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition ב ist lokal; Samaria ist hier die königliche Residenz beziehungsweise Hauptstadt.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: einundvierzig Jahre
  rationale: Natürliche moderne deutsche Wiedergabe der hebräischen Zeitdauer.
