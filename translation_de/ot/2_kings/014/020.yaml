base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/020.yaml
  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: de
  text: Sie brachten ihn auf Pferden[a], und er wurde in Jerusalem bei seinen Vätern[b] in der Stadt Davids begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den Pferden“. Gemeint sein kann auch ein von Pferden gezogenes Transportmittel.'
    reason: lexical_alternative
  - marker: b
    text: „Bei seinen Vätern“ ist eine traditionelle Bestattungsformel und meint hier die Beisetzung bei seinen königlichen Vorfahren.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: Sie brachten ihn … fort
  rationale: נשׂא bezeichnet hier das Tragen beziehungsweise Befördern. Die Verbklammer „brachten … fort“ ist im modernen Deutschen natürlich und passt zum Transport des Leichnams, ohne die Art des Transports genauer festzulegen.
- source_word: עַל הַסּוּסִים
  choice: auf Pferden
  rationale: Die Wiedergabe folgt der konkreten hebräischen Formulierung mit עַל („auf“). Der bestimmte Artikel wird im Deutschen idiomatisch nicht wiedergegeben; ob die Pferde unmittelbar oder als Teil eines pferdegetragenen Transportmittels gemeint sind, bleibt offen.
- source_word: וַיִּקָּבֵר
  choice: und er wurde … begraben
  rationale: Die passive Form des Hebräischen wird auch im Deutschen passiv wiedergegeben.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Übliche lokale Wiedergabe des Ortsnamens.
- source_word: עִם אֲבֹתָיו
  choice: bei seinen Vätern
  rationale: „Bei“ ist in einer deutschen Bestattungsformel natürlicher als das rein wörtliche „mit“ und bewahrt zugleich das Bild der Beisetzung bei den dynastischen Vorfahren.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Gängige deutsche Wiedergabe des Ortsnamens; die Wendung präzisiert den Bestattungsort innerhalb Jerusalems.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die konkrete, aber sachlich nicht völlig eindeutige Transportangabe bleibt im Haupttext erhalten; die traditionelle dynastische Bestattungsformel wird nicht zu „Vorfahren“ aufgelöst.
