base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: de
  text: Doch Amazja hörte nicht darauf[a]. Da zog Joasch, der König von Israel, hinauf, und er und Amazja, der König von Juda, trafen bei Bet-Schemesch, das zu Juda gehört, aufeinander[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beachtete es nicht“ beziehungsweise „gehorchte nicht“. Das hebräische Verb kann ein Hören bezeichnen, auf das eine entsprechende Reaktion folgt, nicht nur das bloße Wahrnehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie sahen einander ins Angesicht“; eine Wendung für eine unmittelbare Begegnung oder Konfrontation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hörte nicht darauf
  rationale: Das Verb bezeichnet hier nicht bloß akustisches Hören, sondern das Beachten einer Warnung. Die Formulierung ist im modernen Deutschen natürlich und bewahrt diesen Handlungssinn, ohne ein Gehorsamsverhältnis vorauszusetzen.
- source_word: וַיַּעַל
  choice: zog ... hinauf
  rationale: עלה bedeutet grundsätzlich „hinaufgehen“. „Hinaufziehen“ passt zum militärischen Zusammenhang, ohne den knappen hebräischen Ausdruck unnötig auszubauen.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: traten einander ... von Angesicht zu Angesicht gegenüber
  rationale: Die Formulierung gibt sowohl das Bild der „Gesichter“ als auch den im Kontext gemeinten direkten, feindlichen Zusammenstoß wieder.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Schemesch
  rationale: Der Ortsname wird nach üblicher deutscher Bibelnamenform transliteriert und nicht als „Haus der Sonne“ übersetzt.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: das zu Juda gehört
  rationale: Die Wendung drückt territoriale Zugehörigkeit aus; sie bezeichnet mehr als lediglich die geografische Lage.
- source_word: וְלֹא
  choice: Doch
  rationale: Das Waw hat hier im Anschluss an die vorausgehende Warnung eine klar kontrastierende Diskursfunktion.
theological_decisions: []
