source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהוֹאָ֜שׁ אֲשֶׁ֤ר עָשָׂה֙ וּ/גְב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten Joaschs und alles, was er tat, und seine Macht und wie er gegen[a] Amazja, den König von Juda, kämpfte – ist das nicht im Buch der Chronik[b] der Könige Israels aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „mit Amazja“. In diesem militärischen Zusammenhang kann die hebräische Präposition den Gegner bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Buch der Annalen der Könige Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: Die feste Königsbuchformel bezeichnet die noch nicht berichteten Handlungen und Ereignisse einer Herrschaft; „Taten“ gibt דִּבְרֵי hier natürlicher wieder als das wörtliche „Worte“ oder „Angelegenheiten“.
- source_word: יְהוֹאָשׁ
  choice: Joasch
  rationale: „Joasch“ ist die etablierte deutsche Namensform für יְהוֹאָשׁ und unterscheidet sich im Deutschen nicht künstlich durch eine englisch geprägte Umschrift.
- source_word: אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die Relativkonstruktion wird ausdrücklich wiedergegeben, damit dieser Bestandteil des Hebräischen neben den „übrigen Taten“ nicht verloren geht.
- source_word: וּגְבוּרָתוֹ
  choice: seine Macht
  rationale: גְּבוּרָה kann Stärke, Heldenmut oder machtvolle Taten bezeichnen. „Macht“ wahrt die semantische Breite und passt zur königlichen, besonders militärischen Leistungsfähigkeit.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: und wie er gegen … kämpfte
  rationale: עִם bedeutet grundsätzlich „mit“, bezeichnet bei נלחם jedoch den Gegner. Das deutsche „gegen“ macht die im militärischen Zusammenhang gemeinte feindliche Auseinandersetzung natürlich verständlich; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: אֲמַצְיָהוּ מֶלֶךְ יְהוּדָה
  choice: Amazja, den König von Juda
  rationale: Die geläufigen deutschen Namensformen und die Apposition geben Name und Königstitel klar wieder.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ist das nicht … aufgeschrieben?
  rationale: Die rhetorische Frage bleibt erhalten. Das zusammenfassende deutsche Singularpronomen „das“ nimmt die zuvor aufgezählten Sachverhalte idiomatisch als Gesamtheit auf.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Chronik
  rationale: Die Wendung bezeichnet ein schriftliches annalistisches Werk. „Buch der Chronik“ ist quellenah und verständlich; „Buch der Annalen“ bleibt als sachlich passende Alternative in der Fußnote erhalten.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Das לְ kennzeichnet hier die Zuordnung beziehungsweise den Titel des königlichen Quellenwerks; der deutsche Genitiv ist dafür idiomatisch.
