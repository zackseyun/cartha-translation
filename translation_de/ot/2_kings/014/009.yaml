base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: de
  text: 'Da sandte Joasch, der König von Israel, Amazja, dem König von Juda, folgende Botschaft: „Der Dornstrauch auf dem Libanon sandte der Zeder auf dem Libanon die Botschaft: ‚Gib deine Tochter meinem Sohn zur Frau.‘ Und ein wildes Tier auf dem Libanon zog vorbei und zertrat den Dornstrauch.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Folge in natürlichem, gehobenem Deutsch wieder.
- source_word: לֵאמֹר
  choice: folgende Botschaft / ließ ... sagen
  rationale: Beim ersten Vorkommen vermeidet „folgende Botschaft“ eine schwerfällige Konstruktion, beim zweiten bildet „ließ ... sagen“ die indirekte Übermittlung idiomatisch ab.
- source_word: הַחוֹחַ
  choice: der Dornstrauch
  rationale: חוֹחַ bezeichnet eine dornige Pflanze; „Dornstrauch“ bewahrt den Kontrast zur stattlichen Zeder, ohne die Pflanzenart zu eng festzulegen.
- source_word: הָאֶרֶז
  choice: die Zeder
  rationale: Direkte und bildkräftige Entsprechung, die den Größen- und Rangkontrast des Gleichnisses erhält.
- source_word: בַּלְּבָנוֹן
  choice: auf dem Libanon
  rationale: Im Deutschen ist für das Gebirge „auf dem Libanon“ idiomatisch; die Wiederholung des Ortsnamens bleibt entsprechend dem Hebräischen erhalten.
- source_word: תְּנָה אֶת בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Gib deinem Sohn meine Tochter zur Frau
  rationale: Die Satzglieder werden entsprechend der hebräischen Rollenverteilung als Bitte um eine Heiratsverbindung wiedergegeben.
- source_word: חַיַּת הַשָּׂדֶה
  choice: ein wildes Tier
  rationale: Die hebräische Wendung bedeutet wörtlich „ein Tier des Feldes“ und bezeichnet hier allgemein ein frei lebendes, wildes Tier.
- source_word: וַתַּעֲבֹר
  choice: kam ... vorbei
  rationale: Natürliche deutsche Wiedergabe der beiläufigen Vorüberbewegung, die zur Pointe des Bildwortes beiträgt.
- source_word: וַתִּרְמֹס
  choice: zertrat
  rationale: „Zertrat“ gibt das Niedertrampeln prägnant und anschaulich wieder.
