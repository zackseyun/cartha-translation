  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: de
  text: Denn Jahwe sah das überaus bittere Elend Israels[a]; es gab weder einen Eingeschlossenen noch einen Verlassenen[b], und Israel hatte keinen Helfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort, das hier mit „bitter“ wiedergegeben wird, ist schwer zu deuten. Auch möglich: „überaus schwer“ oder „äußerst bedrückend“. Es verstärkt jedenfalls die Beschreibung von Israels Not.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „kein Eingeschlossener und kein Verlassener“. Die hebräische Paarformel ist schwer zu deuten; sie wird oft als Ausdruck dafür verstanden, dass es überhaupt niemanden gab oder dass jede Möglichkeit menschlicher Hilfe fehlte.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den persönlichen Gottesnamen wieder und bewahrt den Bundesbezug des hebräischen Textes.
- source_word: עֳנִי
  choice: Elend
  rationale: Bezeichnet hier Israels umfassende Notlage und ist im Deutschen natürlicher und weiter gefasst als das engere „Armut“.
- source_word: מֹרֶה מְאֹד
  choice: überaus bitter
  rationale: Der Ausdruck ist textlich beziehungsweise lexikalisch schwierig; im Zusammenhang verstärkt er jedoch eindeutig die Schwere von Israels Not. „Überaus bitter“ bewahrt das naheliegende Bild, ohne die Unsicherheit zu verschweigen.
- source_word: אֶפֶס
  choice: weder … noch … mehr da waren
  rationale: Die zweimalige Negation bezeichnet das völlige Fehlen der beiden genannten Gruppen. „Mehr da waren“ macht den existenziellen Sinn im Deutschen idiomatisch deutlich.
- source_word: עָצוּר
  choice: Gebundene
  rationale: Hält sich an den konkreten Sinn „festgehalten, gebunden“ und bewahrt zusammen mit dem Gegenbegriff die schwierige hebräische Paarformel.
- source_word: עָזוּב
  choice: Freie
  rationale: Gibt im Gegensatz zu „Gebundene“ den Sinn „losgelassen, freigelassen“ kompakt wieder, ohne die umstrittene Wendung vorschnell auf eine bestimmte gesellschaftliche Schicht festzulegen.
- source_word: עֹזֵר
  choice: Helfer
  rationale: Entspricht dem substantivisch gebrauchten Partizip und bezeichnet jemanden, der Israel beisteht.
theological_decisions:
- issue: Die schwierige Paarformel עָצוּר וְעָזוּב
  choice: weder Gebundene noch Freie mehr da waren
  alternative: niemand mehr übrig war / weder Festgehaltene noch Freigelassene da waren
  rationale: Die wörtlich gehaltene Paarung wahrt die Mehrdeutigkeit des Hebräischen; der Zusatz „mehr da waren“ vermittelt ihre wahrscheinliche Aussage, dass niemand aus irgendeiner Gruppe übrig war, ohne daraus eine besondere soziale oder theologische Lehre abzuleiten.
- issue: Der schwierige Ausdruck מֹרֶה מְאֹד
  choice: überaus bitter war
  alternative: überaus schwer war / äußerst bedrückend war
  rationale: Im Kontext beschreibt der Ausdruck die äußerste Not Israels. Die bildhafte Wiedergabe „bitter“ liegt nahe, doch die lexikalische Unsicherheit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten dass-Sätze bilden den hebräischen Satzfluss klar ab. „Jahwe“ wahrt den Eigennamen; die beiden textlich schwierigen Wendungen bleiben im Haupttext erkennbar und werden nicht stillschweigend vereindeutigt.
