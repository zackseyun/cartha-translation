base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: de
  text: Im zweiten Regierungsjahr des Joasch, des Sohnes Joahas, des Königs von Israel, wurde Amazja, der Sohn Joaschs, König von Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתַּיִם
  choice: Im zweiten Regierungsjahr
  rationale: Die Verbindung bezeichnet in der Datierungsformel das zweite Jahr einer Königsherrschaft. „Regierungsjahr“ macht den Bezug im Deutschen eindeutig und idiomatisch.
- source_word: לְיוֹאָשׁ
  choice: Joaschs
  rationale: Das ל kennzeichnet hier den König, nach dessen Regierungsjahren datiert wird; der deutsche Genitiv gibt diese Beziehung natürlich wieder.
- source_word: בֶּן יוֹאָחָז
  choice: des Sohnes Joahaschs
  rationale: Das Patronym wird in einer deutschen Apposition wiedergegeben; die Namensform „Joahasch“ folgt einer quellennahen deutschen Transliteration.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Die Konstruktverbindung nennt Titel und Herrschaftsgebiet und wird als Apposition zu Joasch erhalten.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: In dieser Thronbesteigungsformel bezeichnet das Verb den Beginn der Königsherrschaft. „Wurde König“ ist klar und natürlich, ohne eine zusätzliche Nuance einzutragen.
- source_word: אֲמַצְיָהוּ
  choice: Amazja
  rationale: Gebräuchliche deutsche, am Hebräischen orientierte Namensform.
- source_word: בֶן יוֹאָשׁ
  choice: der Sohn Joaschs
  rationale: Das Patronym identifiziert Amazja und wird natürlich als Apposition formuliert.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Titel und Herrschaftsgebiet werden idiomatisch in die Aussage über Amazjas Thronbesteigung einbezogen.
