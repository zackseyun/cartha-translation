  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der aufzählenden Bewegung des Hebräischen, ohne im Deutschen unnötig schwerfällig zu wirken. Die sachlich schwierige Bezeichnung der Geiseln wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
