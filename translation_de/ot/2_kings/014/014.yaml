source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת כָּל הַ/זָּהָב וְ֠/הַ/כֶּסֶף וְ/אֵ֨ת כָּל הַ/כֵּלִ֜ים הַ/נִּמְצְאִ֣ים בֵּית יְהוָ֗ה וּ/בְ/אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֵ֖ת בְּנֵ֣י הַ/תַּֽעֲרֻב֑וֹת וַ/יָּ֖שָׁב שֹׁמְרֽוֹנָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: de
  text: Er nahm alles Gold und Silber, alle Geräte, die sich im Haus Jahwes und in den Schatzkammern des Königspalastes befanden, und die Geiseln[a] und kehrte nach Samaria zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »die Söhne der Bürgschaften« oder »die Söhne der Bürgen«; wahrscheinlich sind Menschen gemeint, die als Sicherheit festgehalten wurden, also Geiseln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Er nahm
  rationale: Die Verbform führt die hebräische Erzählfolge fort; im natürlichen deutschen Erzählstil genügt das Präteritum ohne einleitendes »Und«.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: alles Gold und Silber
  rationale: Gibt die Gesamtheit der beschlagnahmten Edelmetalle knapp und idiomatisch wieder.
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  choice: alle Geräte, die sich … befanden
  rationale: כְּלִים ist eine breite Bezeichnung für Geräte beziehungsweise Gegenstände; der Relativsatz gibt das attributive Partizip im Deutschen natürlich wieder.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Bewahrt die konkrete hebräische Wendung »Haus JHWHs« und gibt den Gottesnamen als Jahwe wieder; gemeint ist der Tempel.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: und in den Schatzkammern des Königspalastes
  rationale: אֹצְרוֹת bezeichnet Schatz- oder Vorratskammern; »Königspalast« vermittelt die Bedeutung von »Haus des Königs« in gegenwärtigem Deutsch.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: die Geiseln
  rationale: Die schwierige Wendung bedeutet wörtlich etwa »Söhne der Bürgschaften/Bürgen« und bezeichnet im Zusammenhang am ehesten Menschen, die als Sicherheit festgehalten wurden. Die wörtliche Unschärfe bleibt in der Fußnote sichtbar.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: und kehrte nach Samaria zurück
  rationale: שׁוב mit der Richtungsendung bezeichnet die Rückkehr nach Samaria; die deutsche Formulierung ist präzise und geläufig.
theological_decisions: []
