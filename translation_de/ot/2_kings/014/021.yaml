source:
  edition: WLC
  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֲזַרְיָ֔ה וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣כוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: de
  text: Da nahm das ganze Volk von Juda Asarja – er war sechzehn Jahre alt – und machte ihn anstelle seines Vaters Amazja[a] zum König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asarja wird an anderen Stellen auch Usija genannt; im hebräischen Text steht hier Asarja.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: nahm
  rationale: Das Verb לקח bedeutet wörtlich „nehmen“. Im Zusammenhang der Thronbesteigung leitet es die Handlung des Volkes ein, das Asarja zum König einsetzt; „wählte“ wäre stärker deutend.
- source_word: כָּל עַם יְהוּדָה
  choice: das ganze Volk von Juda
  rationale: Die ausdrückliche Wendung bezeichnet das gesamte Volk Judas und hebt dessen gemeinschaftliches politisches Handeln hervor.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Der hebräische Text dieses Verses hat die Namensform Asarja. Die andernorts verwendete Form Usija wird in der Fußnote genannt.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: er war sechzehn Jahre alt
  rationale: Die idiomatische deutsche Altersangabe bewahrt den erläuternden Einschub des Hebräischen.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: machte ihn … zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum Herrscher beziehungsweise König zu machen. „Krönte“ würde eine nicht ausdrücklich erwähnte Zeremonie hinzufügen.
- source_word: תַּחַת אָבִיו
  choice: anstelle seines Vaters
  rationale: 'תחת bezeichnet hier die Nachfolge im Amt: Asarja tritt an die Stelle seines Vaters. Die Formulierung ist genauer als das möglicherweise nur zeitlich verstandene „nach seinem Vater“.'
- source_word: אֲמַצְיָהוּ
  choice: Amazja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Eigennamens.
theological_decisions: []
