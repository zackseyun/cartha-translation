  source_fidelity: 'Der Entwurf gibt die hebräische Ereignisfolge und alle wesentlichen Elemente genau wieder: das Hören Hiskias, das Zerreißen seiner Kleider, das Sichhüllen in Sacktuch sowie das Hineingehen in das Haus Jahwes. Die durch „das“ aufgenommene, im Hebräischen kontextuell vorausgesetzte Nachricht ist im Deutschen natürlich und fügt keinen Sachinhalt hinzu.'
