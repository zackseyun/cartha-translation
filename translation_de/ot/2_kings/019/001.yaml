source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: de
  text: Als König Hiskia das hörte, zerriss er seine Kleider, hüllte sich in Sacktuch und ging in das Haus Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als … hörte
  rationale: Die hebräische Erzählungsformel leitet das nächste Geschehen ein. Im heutigen Deutsch gibt der temporale Nebensatz die Abfolge natürlich wieder, ohne das formelhafte וַיְהִי hölzern als „und es geschah“ auszudrücken.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: König Hiskia
  rationale: Die Verbindung von Titel und Eigenname wird im Deutschen idiomatisch ohne Artikel wiedergegeben.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: zerriss er seine Kleider
  rationale: Die Formulierung bildet die konkrete Trauer- und Erschütterungsgeste unmittelbar und in geläufigem Deutsch ab.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: hüllte sich in Sacktuch
  rationale: Die reflexive Verbform wird bewahrt. „Sacktuch“ bezeichnet präzise den groben Stoff, der als Zeichen von Trauer und Demütigung getragen wurde.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: ging in das Haus Jahwes
  rationale: בוא mit dem Ortsausdruck bezeichnet hier das Hineingehen. „Haus Jahwes“ erhält die konkrete Tempelbezeichnung des Hebräischen, statt sie zu „Tempel“ zu verallgemeinern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den im hebräischen Text stehenden Namen, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den Gottesnamen in gebräuchlicher deutscher Form wieder und vermeidet die Ersetzung durch den Titel „der HERR“.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Abfolge der drei Reaktionen Hiskias bleibt erhalten; „Haus Jahwes“ und „Sacktuch“ bewahren die konkrete Bildwelt des hebräischen Textes.
