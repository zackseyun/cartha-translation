base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: de
  text: Sieh, ich gebe ihm einen Geist[a]. Er wird eine Nachricht[b] hören und in sein Land zurückkehren; ich werde ihn in seinem eigenen Land mit dem Schwert zu Fall bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Gesinnung« oder »einen Impuls«; das hebräische Wort kann auch »Wind« oder »Atem« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine Meldung« oder »ein Gerücht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Sieh
  rationale: Bewahrt die aufmerksamkeitslenkende Kraft der göttlichen Ankündigung in knapper, heutiger Sprache.
- source_word: נֹתֵן
  choice: ich lege
  rationale: Das Partizip nach הִנְנִי bezeichnet die unmittelbar bevorstehende bzw. einsetzende Handlung; das Präsens erhält diese Anschaulichkeit.
- source_word: רוּחַ
  choice: einen Geist
  rationale: Die Wiedergabe bleibt nahe am breiten Bedeutungsspektrum des hebräischen Wortes und legt weder die Art der Einwirkung noch ihre Vermittlung vorschnell fest.
- source_word: שְׁמוּעָה
  choice: eine Nachricht
  rationale: Der Ausdruck kann Nachricht, Meldung oder Gerücht bezeichnen; »Nachricht« ist neutral und im Zusammenhang natürlich.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: und in sein Land zurückkehren
  rationale: Gibt die Rückbewegung und den Possessivsuffix klar und idiomatisch wieder.
- source_word: וְהִפַּלְתִּיו
  choice: dann werde ich ihn … zu Fall bringen
  rationale: Bewahrt die kausative Form von נפל; »dann« macht den Fortgang der angekündigten Ereignisse im Deutschen deutlich.
- source_word: בַּחֶרֶב
  choice: durch das Schwert
  rationale: Erhält das instrumentale Bild für einen gewaltsamen Tod, ohne es auszudeuten.
- source_word: בְּאַרְצוֹ
  choice: in seinem eigenen Land
  rationale: Die ausdrückliche Wiedergabe mit »eigenen« hebt beim zweiten Vorkommen die Pointe hervor, dass sein Untergang in seiner Heimat erfolgt.
theological_decisions:
- issue: Bedeutung von רוּחַ im göttlichen Gerichtswort
  choice: einen Geist
  alternative: eine Gesinnung / einen Impuls / einen Wind
  rationale: '»Geist« wahrt die lexikalische und theologische Offenheit des Hebräischen: Gott bewirkt die folgende Wendung, doch der genaue Mechanismus bleibt unbestimmt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, wird aber durch Punkt und Semikolon lesbar gegliedert. Die Wiederholung von »Land« und der kausative Ausdruck »zu Fall bringen« bleiben erhalten.
