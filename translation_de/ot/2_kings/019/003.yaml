source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: de
  text: 'Sie sagten zu ihm: „So spricht Hiskia: Dieser Tag ist ein Tag der Bedrängnis, der Zurechtweisung und der Verachtung[a]. Denn die Kinder sind bis zum Geburtsstuhl gekommen[b], aber es fehlt die Kraft zum Gebären.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schmähung“; möglicherweise auch „Gotteslästerung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort מַשְׁבֵּר ist schwierig. Es kann den Ort oder den entscheidenden Zeitpunkt der Entbindung bezeichnen. Oder: „bis zum entscheidenden Augenblick der Geburt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird im Deutschen natürlich und würdevoll mit „So spricht“ wiedergegeben; das Präsens entspricht ihrer konventionellen Funktion.
- source_word: יוֹם צָרָה
  choice: ein Tag der Bedrängnis
  rationale: צָרָה bezeichnet schwere Not und Bedrückung. „Bedrängnis“ wahrt die Intensität und den gehobenen Ton.
- source_word: וְתוֹכֵחָה
  choice: der Zurechtweisung
  rationale: Das Substantiv kann Zurechtweisung, Rüge oder Ahndung bezeichnen. „Zurechtweisung“ lässt offen, ob menschliche Schmähung oder göttliche Strafreaktion im Blick ist.
- source_word: וּנְאָצָה
  choice: der Verachtung
  rationale: נְאָצָה bezeichnet Verachtung beziehungsweise Schmähung. „Verachtung“ gibt den Grundsinn wieder, ohne vorschnell auf „Gotteslästerung“ oder bloße öffentliche Schande einzuengen.
- source_word: הַיּוֹם הַזֶּה
  choice: Dieser Tag
  rationale: Die demonstrative Hervorhebung des Hebräischen bleibt erhalten und klingt im königlichen Bericht angemessen.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: die Kinder sind bis zum Durchbruch bei der Geburt gekommen
  rationale: Die schwierige Wendung beschreibt den entscheidenden Augenblick der Entbindung. „Durchbruch bei der Geburt“ bewahrt das Bild und die mögliche Grundbedeutung von מַשְׁבֵּר, ohne einen bestimmten Geburtsgegenstand vorauszusetzen.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: aber es fehlt die Kraft zum Gebären
  rationale: 'Die adversative Wiedergabe macht den Gegensatz deutlich: Der Geburtsvorgang hat seinen entscheidenden Punkt erreicht, doch die nötige Kraft fehlt.'
- source_word: בָנִים
  choice: Kinder
  rationale: Obwohl die Form grammatisch maskulin ist, meint das Geburtsbild Nachkommen allgemein; „Kinder“ ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bezug von תּוֹכֵחָה
  choice: Zurechtweisung
  alternative: Strafe / Rüge
  rationale: Der Text nennt den Handelnden nicht ausdrücklich. Die Übersetzung wahrt daher die Offenheit zwischen göttlicher Ahndung und erfahrener Rüge.
- issue: Bedeutung von נְאָצָה
  choice: Verachtung
  alternative: Schmähung / Gotteslästerung / Schande
  rationale: Der hebräische Ausdruck kann verächtliche Schmähung einschließen, legt aber hier weder ausschließlich Gotteslästerung noch lediglich nationale Schande fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Nominalfolge und das eindringliche Geburtsbild des Hebräischen bleiben erhalten; schwierige Begriffe werden nicht konfessionell oder theologisch vereindeutigt.
