  text: וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת אָכ֤וֹל הַ/שָּׁנָה֙ סָפִ֔יחַ וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית סָחִ֑ישׁ וּ/בַ/שָּׁנָ֣ה הַ/שְּׁלִישִׁ֗ית זִרְע֧וּ וְ/קִצְר֛וּ וְ/נִטְע֥וּ כְרָמִ֖ים וְ/אִכְל֥וּ פִרְיָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: de
  text: 'Und dies soll das Zeichen für dich sein: In diesem Jahr esst, was von selbst wächst[a], und im zweiten Jahr, was daraus nachwächst[b]. Im dritten Jahr sät und erntet, pflanzt Weinberge und esst ihre Früchte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Ertrag, der ohne Aussaat von selbst aufgeht.
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort ist selten und kann „zweiter Nachwuchs“ bedeuten: Ertrag, der im zweiten Jahr aus dem ungesäten Bewuchs des Vorjahres hervorgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: das Zeichen
  rationale: אוֹת bezeichnet hier ein bestätigendes Zeichen innerhalb einer prophetischen Zusage; „Zeichen“ ist die natürliche und sachlich genaue deutsche Wiedergabe.
- source_word: אָכוֹל
  choice: esst
  rationale: Der Infinitivus absolutus hat hier imperativischen beziehungsweise voraussagenden Aussagewert. Der deutsche Imperativ fügt sich in die anschließende Reihe von Handlungen ein.
- source_word: סָפִיחַ
  choice: was von selbst wächst
  rationale: Das Substantiv bezeichnet Ertrag, der ohne neue Aussaat von selbst aufgeht. Die Umschreibung ist allgemein verständlich und vermeidet unnötige Fachsprache.
- source_word: סָחִישׁ
  choice: was daraus nachwächst
  rationale: Das seltene Wort meint wahrscheinlich den im zweiten Jahr aus dem vorherigen ungesäten Bewuchs hervorgehenden Ertrag. „Was daraus nachwächst“ bewahrt den Zusammenhang, ohne die unsichere Einzelbedeutung zu überpräzisieren.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: sät und erntet
  rationale: Die beiden pluralischen Imperative werden direkt und idiomatisch wiedergegeben; „ernten“ ist im heutigen Deutsch natürlicher als „schneiden“ oder das gehobenere „erntet ein“.
- source_word: וְנִטְעוּ כְרָמִים
  choice: pflanzt Weinberge
  rationale: Die Wendung ist wörtlich und zugleich im Deutschen natürlich.
- source_word: וְאִכְלוּ פִרְיָם
  choice: esst ihre Früchte
  rationale: Das pluralische Suffix bezieht sich am natürlichsten auf die Weinberge; die wörtliche Wiedergabe vermeidet die zusätzliche Nuance von „genießt“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede wechselt entsprechend dem Hebräischen vom singularischen „für dich“ — an Hiskija gerichtet — zu pluralischen Aufforderungen an die Bevölkerung. „Aber“ markiert im Deutschen den sachlichen Übergang zur wieder möglichen regulären Landwirtschaft; das hebräische וְ ist jedoch lediglich koordinierend, sodass auch eine Wiedergabe mit „und“ möglich ist.
