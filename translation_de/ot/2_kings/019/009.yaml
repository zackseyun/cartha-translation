  text: וַ/יִּשְׁמַ֗ע אֶל תִּרְהָ֤קָה מֶֽלֶך כּוּשׁ֙ לֵ/אמֹ֔ר הִנֵּ֥ה יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יָּ֨שָׁב֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: de
  text: 'Als er über Tirhaka, den König von Kusch[a], hörte: »Sieh, er ist ausgezogen, um gegen dich zu kämpfen«, kehrte er um und sandte Boten zu Hiskia mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »König von Äthiopien«. Im Hebräischen steht »Kusch«, die Bezeichnung für ein antikes Gebiet südlich von Ägypten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: Als er über … hörte
  rationale: Die Konstruktion bezeichnet den Inhalt der Nachricht; der temporale Nebensatz gibt den erzählerischen Fortgang im Deutschen natürlich wieder.
- source_word: תִּרְהָקָה
  choice: Tirhaka
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: מֶלֶךְ כּוּשׁ
  choice: König von Kusch
  rationale: Kusch bewahrt die hebräische Gebietsbezeichnung und vermeidet die mögliche Gleichsetzung mit dem heutigen Äthiopien.
- source_word: לֵאמֹר … הִנֵּה
  choice: 'hörte: »Sieh, …«'
  rationale: Das erste לֵאמֹר führt den Wortlaut der Meldung ein; הִנֵּה wird als gegenwärtiger, aufmerksamkeitslenkender Ausdruck wiedergegeben.
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: er ist ausgezogen, um gegen dich zu kämpfen
  rationale: Die Wiedergabe bewahrt sowohl die militärische Bewegung als auch die feindliche Bedeutung von אִתָּךְ in diesem Zusammenhang.
- source_word: וַיָּשָׁב
  choice: kehrte er um
  rationale: Die Form bezeichnet eine Rück- oder Umkehrbewegung, ohne deren genaue militärische Ausgestaltung näher festzulegen.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: und sandte Boten
  rationale: מַלְאָכִים meint hier eindeutig menschliche Überbringer einer Botschaft.
- source_word: אֶל חִזְקִיָּהוּ לֵאמֹר
  choice: zu Hiskia mit den Worten
  rationale: Die Formulierung führt idiomatisch die im folgenden Vers einsetzende direkte Rede ein.
