source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: de
  text: 'Und Hiskia betete vor Yahweh und sagte: »Yahweh, Gott Israels, der du über den Cherubim thronst[a], du allein bist Gott über alle Königreiche der Erde. Du hast den Himmel und die Erde gemacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »der du auf den Cherubim thronst«. Das Hebräische lautet wörtlich etwa: »der bei den Cherubim Sitzende/Thronende«; es verwendet keine ausdrücklich genannte räumliche Präposition. Gemeint ist das königlich-kultische Bild Yahwehs in Verbindung mit den Cherubim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: betete
  rationale: Die Grundbedeutung ist „beten“; im Erzählzusammenhang ist dies die direkte und natürliche deutsche Wiedergabe.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: Bewahrt die räumlich-relationale Bedeutung „vor/in der Gegenwart von“ knapp und idiomatisch.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im Hebräischen stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Direkte und im Gebetsanruf natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: der du über den Cherubim thronst
  rationale: Im königlich-kultischen Zusammenhang bezeichnet יֹשֵׁב das Thronen. „Über“ entspricht dem Bild der Cherubim am Gnadenthron, ohne das im Hebräischen nicht ausdrücklich stehende „zwischen“ einzutragen.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: du allein bist Gott
  rationale: Gibt die hervorgehobene Ausschließlichkeit der hebräischen Formulierung in natürlichem Deutsch wieder.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: über alle Königreiche der Erde
  rationale: Bringt die universale Souveränität Gottes zum Ausdruck; „über“ ist kontextuell treffend, auch wenn die hebräische Präposition einen weiteren Bedeutungsumfang besitzt.
- source_word: עָשִׂיתָ
  choice: hast ... gemacht
  rationale: Entspricht unmittelbar dem üblichen Sinn von עשה und vermeidet es, das speziellere Verb „erschaffen“ einzutragen.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: den Himmel und die Erde
  rationale: „Himmel und Erde“ ist die natürliche deutsche Wiedergabe der hebräischen Schöpfungsformel; der formal plurale hebräische Ausdruck שׁמים wird im Deutschen üblicherweise singularisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. Die Transliteration bewahrt dies, ohne einen Titel einzusetzen.
- issue: Ausschließlichkeit und universale Herrschaft Gottes
  choice: du allein bist Gott über alle Königreiche der Erde
  alternative: du bist Gott, du allein, für alle Königreiche der Erde
  rationale: Die Fassung wahrt sowohl die exklusive Aussage von לְבַדְּךָ als auch den Bezug auf sämtliche irdischen Königreiche, ohne eine spätere dogmatische Formel hinzuzufügen.
- issue: Königlich-kultisches Bild der Cherubim
  choice: der du über den Cherubim thronst
  alternative: der du zwischen den Cherubim wohnst
  rationale: „Thronen“ macht den königlichen Bildgehalt sichtbar. Die Fußnote hält die räumliche Mehrdeutigkeit des knappen hebräischen Ausdrucks offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Der Satzbau bleibt nahe am Hebräischen, wird aber durch die Anrede „der du … thronst“ natürlich deutsch gestaltet. Das traditionelle und idiomatische „Himmel und Erde“ vermeidet die im Deutschen missverständliche Form „die Himmel“.
