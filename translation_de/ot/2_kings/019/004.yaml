source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: de
  text: Vielleicht hört Jahwe, dein Gott, all die Worte des Rabschake[a], den sein Herr, der König von Assyrien, gesandt hat, um den lebendigen Gott zu verhöhnen[b], und weist ihn wegen der Worte zurecht, die Jahwe, dein Gott, gehört hat. Erhebe deshalb ein Gebet[c] für den Rest, der noch übrig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Rabschake“ ist wahrscheinlich ein assyrischer Amtstitel; als mögliche Bedeutung wird auch „Obermundschenk“ vorgeschlagen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „zu schmähen“, „herauszufordern“ oder „zu verspotten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein Gebet darzubringen“ beziehungsweise einfach „zu beten“. Wörtlich lautet die hebräische Wendung: „ein Gebet erheben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Vielleicht hört
  rationale: Gibt die erhoffte Möglichkeit wieder, ohne Gewissheit auszudrücken; im Deutschen ist das Präsens nach „vielleicht“ natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als die im Deutschen geläufige wissenschaftliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Bewahrt den wahrscheinlich assyrischen Amtstitel in eingedeutschter Umschrift, ohne seine genaue Funktion vorschnell festzulegen.
- source_word: לְחָרֵף
  choice: zu verhöhnen
  rationale: Bringt die verächtliche, herausfordernde Schmähung Gottes kräftig und idiomatisch zum Ausdruck.
- source_word: אֱלֹהִים חַי
  choice: den lebendigen Gott
  rationale: Entspricht der hebräischen Wendung und bewahrt ihren Kontrast zu leblosen Götzen.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: und weist ihn wegen der Worte zurecht
  rationale: Versteht die Präposition kausal und gibt das Verb als göttliches Zurechtweisen wieder. Das im Hebräischen nicht ausdrücklich genannte Objekt wird für natürliches Deutsch aus dem Kontext ergänzt.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: Erhebe deshalb ein Gebet
  rationale: Bewahrt das hebräische Bild des Emporhebens eines Gebets; „deshalb“ macht den aus dem Zusammenhang hervorgehenden Folgerungscharakter deutlich.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: den Rest, der noch übrig ist
  rationale: Erhält den Schlüsselbegriff „Rest“ und gibt zugleich verständlich wieder, dass es um die noch Verbliebenen geht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen; die Umschrift wahrt diesen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung von הַשְּׁאֵרִית
  choice: der Rest
  alternative: die Überlebenden
  rationale: „Rest“ bewahrt die wiederkehrende biblische Begrifflichkeit, ohne mehr über die Identität oder den geistlichen Zustand der Betroffenen auszusagen als der Vers selbst.
- issue: Nicht ausdrücklich genanntes Objekt bei וְהוֹכִיחַ
  choice: weist ihn ... zurecht
  alternative: weist die Worte zurück
  rationale: Der Kontext legt den assyrischen Abgesandten als Ziel des Zurechtweisens nahe. Da die hebräische Konstruktion offen bleibt, wird diese Ergänzung als sprachlich notwendige Kontextdeutung verstanden, nicht als Ausschluss anderer syntaktischer Auffassungen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Satzbau und Schlüsselbegriffe bleiben quellennah, während unnatürliche Hebraismen nur dort geglättet werden, wo es die deutsche Lesbarkeit verlangt.
