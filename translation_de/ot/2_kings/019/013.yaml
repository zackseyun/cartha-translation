  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: de
  text: Wo ist der König von Hamat, der König von Arpad und der König der Stadt Sefarwajim, Hena und Awa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die grammatische Zuordnung von »Hena und Awa« ist im Hebräischen nicht eindeutig. Sie können weitere Ortsnamen in der Aufzählung sein, zu denen »König« elliptisch zu ergänzen ist.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אַיּוֹ
  choice: Wo ist
  rationale: Das Fragewort mit Suffix fragt in diesem spöttischen Zusammenhang nach dem gegenwärtigen Verbleib beziehungsweise Schicksal des Königs.
- source_word: מֶלֶךְ
  choice: König
  rationale: Die übliche Entsprechung; die dreifache Wiederholung des hebräischen Wortes wird wegen ihrer rhetorischen Wirkung beibehalten.
- source_word: חֲמָת
  choice: Hamat
  rationale: Eingebürgerte deutsche Umschrift des Ortsnamens.
- source_word: אַרְפָּד
  choice: Arpad
  rationale: Eingebürgerte deutsche Umschrift des Ortsnamens.
- source_word: לָעִיר סְפַרְוָיִם
  choice: der Stadt Sefarwajim
  rationale: Gibt die ungewöhnliche Verbindung mit »Stadt« möglichst knapp und quellennah wieder.
- source_word: הֵנַע
  choice: Hena
  rationale: Nahe Umschrift des Ortsnamens nach der masoretischen Form.
- source_word: וְעִוָּה
  choice: und Awa
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition wiedergegeben; die Konjunktion wird bewahrt.
