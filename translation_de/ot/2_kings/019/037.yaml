base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: de
  text: 'Und es geschah, als er sich im Haus Nisroks[a], seines Gottes, niederwarf: Adrammelech und Sarezer erschlugen ihn mit dem Schwert und entkamen ins Land Ararat. Und Asarhaddon, sein Sohn, wurde an seiner Stelle König.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Nisrok“; traditionell auch „Nisroch“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah, als
  rationale: Die narrative Form von היה leitet das Ereignis ein. Die Verbindung mit „als“ gibt die folgende partizipiale Begleithandlung im Deutschen natürlich wieder.
- source_word: מִשְׁתַּחֲוֶה
  choice: sich … niederwarf
  rationale: Das Hitpael von שׁחה bezeichnet im kultischen Zusammenhang eine anbetende Niederwerfung. Die Formulierung bewahrt sowohl die körperliche Handlung als auch ihre religiöse Bedeutung.
- source_word: בֵּית
  choice: im Haus
  rationale: Entspricht dem wörtlichen Ausdruck „Haus“ und bezeichnet hier das Heiligtum der Gottheit, ohne die Bildsprache durch „Tempel“ zu ersetzen.
- source_word: נִסְרֹךְ
  choice: Nisrok
  rationale: Direkte Umschrift des punktierten hebräischen Namens; die geläufige traditionelle Form „Nisroch“ wird in der Fußnote genannt.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: Der Singular mit Suffix der dritten Person maskulin bezieht sich auf den Gott Sanheribs; die Apposition bildet den hebräischen Zusammenhang knapp und klar ab.
- source_word: הִכֻּהוּ
  choice: erschlugen ihn
  rationale: נכה bedeutet „schlagen“; im vorliegenden Zusammenhang ist die Tötung eindeutig. „Erschlugen“ verbindet Handlung und tödliches Ergebnis natürlich mit „mit dem Schwert“.
- source_word: בַּחֶרֶב
  choice: mit dem Schwert
  rationale: Der instrumentale Gebrauch der Präposition ב wird im Deutschen idiomatisch mit „mit“ wiedergegeben.
- source_word: נִמְלְטוּ
  choice: entkamen
  rationale: Das Nifal von מלט bezeichnet hier die erfolgreiche Flucht der Attentäter.
- source_word: אֶרֶץ אֲרָרָט
  choice: ins Land Ararat
  rationale: Die Wendung bezeichnet das geografische Ziel. „Land Ararat“ gibt die hebräische Konstruktverbindung transparent wieder.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: מלך bezeichnet in diesem Nachfolgekontext den Regierungsantritt; die deutsche Formulierung ist natürlicher als ein isoliertes „regierte“.
- source_word: אֵסַר חַדֹּן
  choice: Asar-Haddon
  rationale: Der Königsname wird in einer im Deutschen etablierten, gut lesbaren Form mit Bindestrich wiedergegeben.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die idiomatische Wendung bezeichnet die dynastische Nachfolge, ohne mehr auszusagen als der hebräische Text.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die kultische Handlung wird mit „sich niederwerfen“ konkret wiedergegeben; der Kontext „seines Gottes“ macht den Anbetungscharakter deutlich. Der Doppelpunkt markiert natürlich den Übergang von der Begleithandlung zum Attentat. Der Fußnotenmarker steht unmittelbar beim Namen, auf den sich die Anmerkung bezieht.
