  variant: modern standard German
source:
  edition: WLC
  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: de
  text: Neige dein Ohr, Jahwe, und höre! Öffne deine Augen, Jahwe, und sieh! Höre die Worte Sanheribs, die er gesandt hat, um den lebendigen Gott zu schmähen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den lebendigen Gott herauszufordern“ oder „zu verhöhnen“. Das hebräische Verb kann ein verächtliches Beschimpfen, Verspotten oder trotziges Herausfordern bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Neige dein Ohr
  rationale: Die wörtlich bewahrte hebräische Wendung bezeichnet aufmerksames Hören und passt zum feierlichen Ton des Gebets, ohne im Deutschen unverständlich zu wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Gottesnamens bewahrt das Tetragramm als Eigennamen, statt es durch einen Titel zu ersetzen.
- source_word: וּשֲׁמָע
  choice: und höre / Höre
  rationale: Die Wiederholung von שמע wird beibehalten; beim zweiten Vorkommen beginnt im Deutschen zur klaren Gliederung ein neuer Aufforderungssatz.
- source_word: פְּקַח ... עֵינֶיךָ
  choice: Öffne deine Augen
  rationale: Direkte und natürliche Wiedergabe der hebräischen Aufforderung.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Bewahrt den Parallelismus der Aufforderungen zum Hören und Sehen.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: die Worte Sanheribs
  rationale: דִּבְרֵי wird konkret als „Worte“ wiedergegeben; „Sanherib“ ist die im Deutschen etablierte Namensform.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: die er gesandt hat
  rationale: Die Formulierung folgt der hebräischen Sendeterminologie, ohne den im Deutschen schwer ausdrücklich abzubildenden Objektsuffix übermäßig auszudeuten.
- source_word: לְחָרֵף
  choice: um ... zu schmähen
  rationale: „Schmähen“ erfasst das verächtliche Beschimpfen und Verhöhnen, lässt aber die ebenfalls mögliche Nuance des trotzigen Herausforderns offen.
- source_word: אֱלֹהִים חָי
  choice: den lebendigen Gott
  rationale: Die feste biblische Bezeichnung wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration wahrt seinen Charakter als Eigenname und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutungsbreite von לְחָרֵף gegenüber Gott
  choice: den lebendigen Gott zu schmähen
  alternative: den lebendigen Gott herauszufordern / zu verhöhnen
  rationale: „Schmähen“ stellt die beleidigende, verächtliche Rede in den Vordergrund; die Fußnote bewahrt die mögliche konfrontative Nuance des hebräischen Verbs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Imperative und die Wiederholung von „höre“ bleiben erhalten. Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
