  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת הַ/גּוֹיִ֖ם וְ/אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: de
  text: Es ist wahr[a], Jahwe, die Könige von Assyrien haben die Völker und ihre Länder[b] verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ja“ oder „Gewiss“. Das einleitende Wort bekräftigt die Wahrheit der Aussage und kann zugleich einräumend wirken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihr Land“. Der Singular ist wahrscheinlich kollektiv beziehungsweise distributiv gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: Es ist wahr
  rationale: Die einleitende Bekräftigung bestätigt die Wahrheit der zuvor genannten Behauptung. „Es ist wahr“ gibt die emphatische, möglicherweise einräumende Kraft in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֶחֱרִיבוּ
  choice: haben … verwüstet
  rationale: Der Hifil von חרב bezeichnet hier das Verursachen von Verwüstung; „verwüstet“ passt zum militärischen Zusammenhang.
- source_word: מַלְכֵי אַשּׁוּר
  choice: die Könige von Assyrien
  rationale: Transparente und idiomatische Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Im geopolitischen Zusammenhang sind die von Assyrien unterworfenen Völker beziehungsweise Nationen gemeint; „Völker“ ist hier natürlich und präzise.
- source_word: אַרְצָם
  choice: ihre Länder
  rationale: Die hebräische Form steht formal im Singular („ihr Land“), kann bei dem pluralischen Bezugswort jedoch kollektiv beziehungsweise distributiv verstanden werden. Der deutsche Plural macht diesen Sinn natürlich verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet die direkte Anrede natürlich ab und leitet die bekräftigte Aussage ein; die knappe Gebetssprache des Hebräischen bleibt erhalten.
