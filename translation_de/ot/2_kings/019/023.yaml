  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: de
  text: 'Durch deine Boten hast du den Herrn verhöhnt und gesagt: »Mit der Menge meiner Streitwagen bin ich selbst auf die Höhen der Berge hinaufgezogen, bis in die entlegensten Winkel des Libanon. Ich werde seine hochgewachsenen Zedern fällen, seine erlesensten Zypressen[a] und in seinen fernsten Rastplatz, seinen üppigen Wald, eindringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine erlesensten Tannen«; welche Nadelbaumart das hebräische Wort genau bezeichnet, ist nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: Durch deine Boten
  rationale: Die Wendung בְּיַד bezeichnet hier die handelnde Vermittlung. Im modernen Deutschen gibt »durch« den Sinn natürlich wieder; מַלְאָכִים sind in diesem politischen Zusammenhang menschliche Boten, nicht Engel.
- source_word: חֵרַפְתָּ
  choice: hast du … verhöhnt
  rationale: חרף bezeichnet spöttische, verächtliche Herausforderung. »Verhöhnt« bewahrt die Schärfe des Vorwurfs und ist im Deutschen idiomatisch.
- source_word: אֲדֹנָי
  choice: den Herrn
  rationale: Der Konsonantentext bietet אֲדֹנָי und nicht das Tetragramm. »der Herr« wahrt diese Unterscheidung.
- source_word: בְּרֹב רִכְבִּי
  choice: Mit der Menge meiner Streitwagen
  rationale: Die Formulierung erhält die Betonung der großen militärischen Streitmacht und klingt zugleich würdevoll und verständlich.
- source_word: אֲנִי עָלִיתִי
  choice: bin ich selbst … hinaufgezogen
  rationale: Das selbstständige Pronomen אֲנִי hebt den prahlerischen Anspruch des Sprechers hervor; »ich selbst« bildet diese Betonung ab.
- source_word: מְרוֹם הָרִים
  choice: auf die Höhen der Berge
  rationale: Die konkrete räumliche Bildsprache des hebräischen Genitivgefüges bleibt erhalten.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: bis in die entlegensten Winkel des Libanon
  rationale: יַרְכְּתֵי bezeichnet abgelegene, äußerste Bereiche oder Winkel. Die Übersetzung vermittelt das Eindringen bis tief in den Libanon.
- source_word: קוֹמַת אֲרָזָיו
  choice: seine hochgewachsenen Zedern
  rationale: קוֹמָה bezeichnet Höhe oder Wuchs. »hochgewachsen« gibt die majestätische Statur der Zedern konkret wieder.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: seine erlesensten Zypressen
  rationale: מִבְחוֹר meint das Ausgewählte oder Beste. Die genaue von בְּרוֹשׁ bezeichnete Nadelbaumart ist unsicher; »Zypresse« ist eine verbreitete, plausible Wiedergabe, während die Unsicherheit in der Fußnote genannt wird.
- source_word: מְלוֹן קִצֹּה
  choice: seinem fernsten Rastplatz
  rationale: מָלוֹן bezeichnet einen Ort des Übernachtens oder Rastens, קִצּוֹ dessen äußerstes Ende. »fernster Rastplatz« wahrt das ungewöhnliche Bild, ohne es spekulativ aufzulösen.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: seinen üppigen Wald
  rationale: יַעַר bedeutet »Wald«; כַּרְמֶל kann fruchtbares, dicht bewachsenes Land bezeichnen. »üppiger Wald« vermittelt das Bild eines besonders reichen Waldbestands natürlich.
theological_decisions:
- issue: אֲדֹנָי von JHWH unterscheiden
  choice: der Herr
  alternative: der HERR
  rationale: Da hier אֲדֹנָי steht und nicht יהוה, wird der Titel regulär als »der Herr« wiedergegeben und nicht mit der für den Gottesnamen vorgesehenen besonderen Schreibweise.
- issue: Zeitliche Gestalt der assyrischen Prahlrede
  choice: vollendeter Aufstieg, anschließend angekündigte Handlungen
  alternative: alle Handlungen als bereits vollzogen wiedergeben
  rationale: Der hebräische Text wechselt von עָלִיתִי im Perfekt zu den Formen וְאֶכְרֹת und וְאָבוֹאָה, die hier die prahlerische Absicht ausdrücken. Die Übersetzung bewahrt diese Spannung zwischen behauptetem Erfolg und angekündigtem weiteren Vorgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede behält den hochmütigen, militärisch-prahlerischen Ton. Ungewöhnliche Bilder wie der »fernste Rastplatz« werden nicht stillschweigend geglättet; zugleich werden schwer verständliche Hebraismen dort idiomatisch wiedergegeben, wo ihr Sinn eindeutig ist.
