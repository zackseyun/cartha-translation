  to: 'Durch deine Boten hast du den Herrn verhöhnt und gesagt: »Mit der Menge meiner Streitwagen bin ich selbst auf die Höhen der Berge hinaufgezogen, bis in die entlegensten Winkel des Libanon. Ich werde seine hochgewachsenen Zedern fällen, seine erlesensten Zypressen[a] und in seinen fernsten Rastplatz, seinen üppigen Wald, eindringen.«'
