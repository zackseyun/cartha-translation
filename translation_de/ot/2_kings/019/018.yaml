source:
  edition: WLC
  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: de
  text: und ihre Götter ins Feuer geworfen[a]. Denn sie waren keine Götter, sondern von Menschenhand gemachte Werke aus Holz und Stein; und so vernichteten sie sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ins Feuer gelegt«. Das hebräische Verb bedeutet wörtlich »geben, setzen, legen« und bezeichnet hier das Hineinwerfen oder Hineinlegen ins Feuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: und … geworfen
  rationale: נתן bedeutet grundsätzlich »geben/setzen/legen«; in Verbindung mit »ins Feuer« bezeichnet es hier idiomatisch das Werfen beziehungsweise Hineinlegen zum Verbrennen. »geworfen« ist im modernen Deutschen natürlich und entspricht dem zerstörerischen Zusammenhang.
- source_word: אֱלֹהֵיהֶם
  choice: ihre Götter
  rationale: Die wörtliche Bezeichnung »ihre Götter« bewahrt die rhetorische Spannung, da der folgende Satz diesen Gegenständen gerade abspricht, wirklich Götter zu sein. »Götzen« würde diese Spannung vorwegnehmen.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: Denn sie waren keine Götter
  rationale: כִּי begründet, weshalb diese sogenannten Götter vernichtet werden konnten. Die Vergangenheitsform fügt sich in den erzählenden Rückblick ein, ohne die grundsätzliche Aussage über ihre fehlende Göttlichkeit abzuschwächen.
- source_word: כִּי אִם
  choice: sondern
  rationale: 'Nach der Verneinung führt כִּי אִם den starken Gegensatz ein: nicht Götter, sondern menschliche Erzeugnisse.'
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: von Menschenhand gemachte Werke
  rationale: Die Formulierung gibt die menschliche Herstellung deutlich wieder. אָדָם bezeichnet hier Menschen allgemein, nicht einen bestimmten Mann.
- source_word: עֵץ וָאֶבֶן
  choice: aus Holz und Stein
  rationale: Die Präposition »aus« macht im Deutschen natürlich verständlich, dass Holz und Stein die Materialien der hergestellten Götterbilder sind.
- source_word: וַיְאַבְּדוּם
  choice: deshalb konnten sie sie vernichten
  rationale: 'Die Form wird transitiv verstanden: Die Eroberer vernichteten die Götterbilder. »deshalb« gibt den Folgezusammenhang wieder; »konnten« verdeutlicht, dass ihre Vernichtbarkeit daraus folgt, dass sie lediglich menschliche Werke aus Holz und Stein waren.'
theological_decisions:
- issue: Bezeichnung der fremden Kultbilder
  choice: ihre Götter
  alternative: ihre Götzen
  rationale: Der Text nennt sie zunächst aus der Perspektive ihrer Verehrer »Götter« und verneint anschließend ausdrücklich ihre wirkliche Göttlichkeit. Diese theologische Spannung bleibt so erhalten.
- issue: Generische Bedeutung von אָדָם
  choice: von Menschenhand
  alternative: von Menschenhänden / von der Hand des Menschen
  rationale: אָדָם bezeichnet hier die Menschheit beziehungsweise menschliche Urheber allgemein. »Menschenhand« ist idiomatisch, geschlechtsübergreifend und betont den Gegensatz zwischen dem lebendigen Gott und menschengemachten Kultbildern.
- issue: Logischer Bezug des letzten Satzteils
  choice: deshalb konnten sie sie vernichten
  alternative: und sie vernichteten sie
  rationale: Der Zusammenhang stellt der wirklichen Gottheit die bloße Materialität der Kultbilder gegenüber. Die gewählte Fassung macht diese Folgerung sichtbar, ohne den handelnden Personen eine zusätzliche Absicht zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge beginnt entsprechend dem hebräischen Anschluss mit »und«; »Menschenhand« ist eine geläufige, allgemein verständliche Wendung. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Formulierung.
