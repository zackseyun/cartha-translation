source:
  edition: WLC
  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר יָבֹ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָבֹ֖א נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: de
  text: Auf dem Weg, auf dem er gekommen ist, wird er zurückkehren, und in diese Stadt wird er nicht kommen – Ausspruch Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: Auf dem Weg, auf dem er gekommen ist
  rationale: Die Formulierung gibt sowohl דֶּרֶךְ als »Weg« als auch den ausdrücklichen Rückbezug durch בָּהּ wieder. Das hebräische Imperfekt יָבֹא bezeichnet hier im Zusammenhang den bereits erfolgten Anmarsch und wird daher idiomatisch mit deutschem Perfekt wiedergegeben.
- source_word: יָשׁוּב
  choice: wird er zurückkehren
  rationale: שׁוּב bezeichnet hier die Rückkehr auf demselben Weg; das Futur bringt die angekündigte Gewissheit natürlich zum Ausdruck.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: und in diese Stadt wird er nicht kommen
  rationale: Die Voranstellung von »in diese Stadt« bewahrt die Hervorhebung des hebräischen Satzes. »Kommen« gibt בוא genau wieder, ohne die stärkere Bedeutung »eindringen« einzutragen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feierliche prophetische Botenformel. »Ausspruch« bewahrt ihren nominalen Charakter; »Jahwe« ist die im Deutschen übliche Wiedergabe des Gottesnamens יהוה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. »Jahwe« gibt ihn in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »Auf dem Weg, auf dem …« ist im Deutschen natürlich und bildet den ausdrücklichen Rückbezug des Hebräischen ab; daher ist keine erläuternde Fußnote nötig.
