id: 2KI.19.19
reference: 2 Kings 19:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: de
  text: Und nun, Jahwe, unser Gott, rette uns doch aus seiner Hand[a], damit alle Königreiche der Erde[b] erkennen, dass du, Jahwe, allein Gott bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus seiner Hand“; ein hebräisches Bild für die Befreiung aus seiner Gewalt oder Macht.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „alle Königreiche des Landes“; im internationalen Zusammenhang ist hier „der Erde“ wahrscheinlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Funktion von וְ als auch den zeitlich-diskursiven Übergang zur abschließenden Bitte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Konstruktform mit dem Suffix der ersten Person Plural wird direkt und natürlich wiedergegeben.
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: rette uns doch
  rationale: „Rette uns“ entspricht dem Hifil-Imperativ von ישׁע; „doch“ gibt die bittende, dringliche Nuance von נָא in natürlichem Deutsch wieder.
- source_word: מִיָּדוֹ
  choice: aus seiner Hand
  rationale: Bewahrt das hebräische Bild für die Befreiung aus der Gewalt oder Herrschaft eines anderen.
- source_word: וְיֵדְעוּ
  choice: damit … erkennen
  rationale: Der Kontext legt nach dem Imperativ eine Zweck- beziehungsweise Folgesatzfunktion nahe; „damit“ formuliert diese Beziehung idiomatisch.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: alle Königreiche der Erde
  rationale: Der internationale Zusammenhang spricht hier für „Erde“; „Land“ bleibt lexikalisch möglich.
- source_word: כִּי
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was die Königreiche erkennen sollen.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: dass du, Jahwe, allein Gott bist
  rationale: Gibt die Identifikation Jahwes als des alleinigen Gottes klar wieder, ohne die beiden Gottesbezeichnungen zu einem zusammengesetzten Titel zu verschmelzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen direkt; die Transliteration bewahrt diesen Charakter.
- issue: Bezug von לְבַדֶּךָ
  choice: du, Jahwe, allein Gott bist
  alternative: du Jahwe, Gott, du allein bist
  rationale: „Allein“ bringt die Exklusivität der Aussage in natürlichem Deutsch zum Ausdruck. Die Satzstellung vermeidet zugleich, „Jahwe Gott“ als festen Doppeltitel zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rette uns doch“ lässt die Bitte eindringlich klingen, ohne altertümlich zu wirken. Die Anrede und die abschließende Bekenntnisaussage bleiben nah an der hebräischen Syntax, sind aber flüssig formuliert.
