  text: כִּ֤י מִ/ירוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: de
  text: Denn von Jerusalem wird ein Rest ausgehen, und vom Berg Zion werden Entkommene ausgehen. Der Eifer Jahwes[a] wird dies tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Eifersucht Jahwes“. Das hebräische Substantiv kann sowohl „Eifer“ als auch „Eifersucht“ bedeuten; hier bezeichnet es Jahwes leidenschaftliche Entschlossenheit, Jerusalems Rettung herbeizuführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: כִּי begründet beziehungsweise bekräftigt die vorausgehende Verheißung; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: von Jerusalem wird ein Rest ausgehen
  rationale: מִן bezeichnet den Ausgangspunkt, שְׁאֵרִית das nach der Krise Verbliebene, und יצא bewahrt das Bild des Herausgehens.
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: und vom Berg Zion werden Entkommene kommen
  rationale: פְלֵיטָה bezeichnet kollektiv diejenigen, die entkommen sind. Das ergänzte „werden … kommen“ macht die im Hebräischen elliptische Parallelzeile in modernem Deutsch verständlich, ohne ihren Sinn zu verändern.
- source_word: קִנְאַת
  choice: Der Eifer
  rationale: קִנְאָה kann Eifer oder Eifersucht bezeichnen. Im Zusammenhang steht Jahwes leidenschaftlicher Einsatz für die angekündigte Rettung im Vordergrund; die mögliche Alternative bleibt in der Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה; „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: wird dies tun
  rationale: Die direkte Formulierung entspricht dem Verb עשה mit dem Demonstrativpronomen זאת und vermeidet eine unnötig erklärende Paraphrase.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transkription wahrt den Eigennamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutungsbreite von קִנְאַת יְהוָה
  choice: Der Eifer Jahwes
  alternative: Die Eifersucht Jahwes
  rationale: „Eifer“ passt hier zur leidenschaftlichen Entschlossenheit Jahwes, Jerusalems Rettung herbeizuführen. Da das Substantiv auch „Eifersucht“ bedeuten kann, wird diese echte lexikalische Alternative nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rest“ bewahrt den prophetischen Leitbegriff; „Entkommene“ gibt den kollektiven Sinn von פְלֵיטָה wieder. Die verbale Ergänzung im zweiten Parallelglied dient der natürlichen deutschen Syntax.
