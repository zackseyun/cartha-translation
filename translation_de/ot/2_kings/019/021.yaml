id: 2KI.19.21
reference: 2 Kings 19:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: de
  text: 'Dies ist das Wort, das Jahwe über ihn gesprochen hat: »Die jungfräuliche Tochter Zion verachtet dich, sie verspottet dich. Hinter dir schüttelt die Tochter Jerusalem den Kopf.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Kopfschütteln ist hier eine Gebärde des Spotts und der Verachtung.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: das Wort
  rationale: In der prophetischen Einleitungsformel bezeichnet דָּבָר eine göttliche Äußerung; „das Wort“ ist im Deutschen natürlich und formnah.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: das Jahwe über ihn gesprochen hat
  rationale: עַל bezeichnet hier den Gegenstand des Ausspruchs („über ihn“), ohne die im Kontext vorhandene feindliche Stoßrichtung ausdrücklich in die Präposition einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּזָה
  choice: verachtet
  rationale: Das Verb bezeichnet geringschätzige Verachtung; das Präsens entspricht der lebendigen poetischen Rede.
- source_word: לָעֲגָה
  choice: verspottet
  rationale: Das Verb bedeutet „spotten, verhöhnen“; „verspottet“ ist klar, gegenwärtig und würdevoll.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: die jungfräuliche Tochter Zion
  rationale: Die Wiedergabe bewahrt sowohl בְּתוּלָה als auch die poetische Stadtpersonifikation „Tochter Zion“, ohne die ungewöhnliche Bildsprache einzuebnen.
- source_word: אַחֲרֶיךָ
  choice: hinter dir
  rationale: Die räumliche Formulierung zeichnet den Spott nach dem Abzug des Angeredeten anschaulich nach.
- source_word: רֹאשׁ הֵנִיעָה
  choice: schüttelt den Kopf
  rationale: Die deutsche Wendung gibt die sichtbare Gebärde wieder; eine Fußnote erläutert ihre spöttische Bedeutung.
- source_word: בַּת יְרוּשָׁלִָם
  choice: die Tochter Jerusalem
  rationale: Die knappe appositionelle Form bewahrt die parallele Personifikation der Stadt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Richtung von עַל in דִּבֶּר יְהוָה עָלָיו
  choice: über ihn
  alternative: gegen ihn
  rationale: Obwohl der Ausspruch inhaltlich gegen den assyrischen König gerichtet ist, bezeichnet עַל hier zunächst das Thema beziehungsweise den Betroffenen. „Über ihn“ erhält diese sprachliche Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter prophetischer und poetischer Bildsprache. Die Stadtpersonifikationen „Tochter Zion“ und „Tochter Jerusalem“ bleiben bewusst erhalten; das Tempus der Verben wird als lebendiges poetisches Präsens wiedergegeben.
