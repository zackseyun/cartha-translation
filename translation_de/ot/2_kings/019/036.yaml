lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: brach … auf, zog fort und kehrte zurück
  rationale: Die drei aufeinanderfolgenden Verben werden bewahrt. „Aufbrechen“ gibt נסע idiomatisch wieder, „fortziehen“ entspricht הלך im Kontext, und „zurückkehren“ bildet שוב ab.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישב kann „sitzen“, „wohnen“, „sich niederlassen“ oder „bleiben“ bedeuten. Nach der Rückkehr bezeichnet es hier natürlich den anschließenden Aufenthalt in Ninive, ohne mehr Dauerhaftigkeit zu behaupten, als der Kontext verlangt.
- source_word: בְּנִינְוֵה
  choice: in Ninive
  rationale: Übliche moderne deutsche Form des Ortsnamens; die Präposition wird direkt wiedergegeben.
