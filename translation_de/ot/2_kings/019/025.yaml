  text: הֲ/לֹֽא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אֹתָ֣/הּ עָשִׂ֔יתִי לְ/מִ֥/ימֵי קֶ֖דֶם וִֽ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵיאתִ֗י/הָ וּ/תְהִ֗י לַ/הְשׁ֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: de
  text: Hast du nicht gehört? Vor langer Zeit[a] habe ich es gemacht; in ferner Vorzeit habe ich es geformt. Nun habe ich es herbeigeführt, dass du befestigte Städte zu Trümmerhaufen machst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Ferne“. Der hebräische Ausdruck kann räumlich verstanden werden, bezeichnet hier neben „in ferner Vorzeit“ jedoch wahrscheinlich eine weit zurückliegende Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „zu Haufen, zu Trümmern“. Die hebräische Wortgruppe ist schwierig und kann auch im Sinn von „aufragenden Haufen“ verstanden werden.'
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: Hast du es nicht gehört?
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet; das ergänzte „es“ ist im Deutschen idiomatisch und verweist auf Gottes längst bestehenden Plan.
- source_word: לְמֵרָחוֹק
  choice: Vor langer Zeit
  rationale: Der Ausdruck kann räumlich „aus der Ferne“ bedeuten, ist hier jedoch durch „seit den Tagen der Vorzeit“ wahrscheinlich zeitlich bestimmt.
- source_word: אֹתָהּ עָשִׂיתִי
  choice: habe ich es vollbracht
  rationale: Das feminine Pronomen verweist auf das geplante Geschehen. „Vollbracht“ gibt עשה im Kontext eines lange zuvor bestimmten Vorhabens natürlich wieder, ohne ein ausdrückliches Bezugswort einzuführen.
- source_word: לְמִימֵי קֶדֶם
  choice: seit den Tagen der Vorzeit
  rationale: Gibt die zeitliche Ferne und den gehobenen Parallelismus des Hebräischen verständlich wieder.
- source_word: וִיצַרְתִּיהָ
  choice: habe ich es geformt
  rationale: Bewahrt das Bild des Formens bzw. Gestaltens; „geplant“ wäre verständlicher, aber stärker deutend.
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: Jetzt habe ich es herbeigeführt
  rationale: Drückt die gegenwärtige Verwirklichung dessen aus, was Gott seit alter Zeit gestaltet hat.
- source_word: וּתְהִי לַהְשׁוֹת
  choice: Du solltest … verwüsten
  rationale: Gibt die Folge bzw. den Zweck in Bezug auf den angesprochenen assyrischen König wieder und wahrt den kausativen Sinn von השׁה.
- source_word: גַּלִּים נִצִּים
  choice: Trümmerhaufen
  rationale: Die schwierige Wortgruppe bezeichnet im Zusammenhang die nach der Zerstörung zurückbleibenden Haufen oder Ruinen; „Trümmerhaufen“ ist anschaulich und idiomatisch.
- source_word: עָרִים בְּצֻרוֹת
  choice: befestigte Städte
  rationale: Direkte und geläufige Wiedergabe von Städten, die durch Befestigungsanlagen geschützt sind.
theological_decisions:
- issue: Gottes Souveränität über die Eroberungen Assyriens
  choice: Gottes lange zuvor gestalteter Ratschluss und sein gegenwärtiges Herbeiführen des Geschehens werden ausdrücklich bewahrt.
  alternative: Die Aussage lediglich als Gottes Vorherwissen oder als nachträgliche Zulassung wiederzugeben.
  rationale: Die Verben „vollbringen“, „formen“ und „herbeiführen“ schreiben Gott eine aktive Bestimmung und Verwirklichung zu. Der Text sagt dabei nicht, dass Gott die Gewalttaten Assyriens moralisch billigt.
- issue: Zweck oder Folge der assyrischen Verwüstung
  choice: „Du solltest“ lässt im Deutschen sowohl eine vom Vorhergehenden bestimmte Folge als auch einen Zweck anklingen.
  alternative: „damit du“ würde den Zweck stärker festlegen; „sodass du“ die Folge stärker hervorheben.
  rationale: וּתְהִי mit Infinitiv kann hier zweck- oder folgebezogen verstanden werden; die Übersetzung soll diese Spannung nicht unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus zwischen dem lange zuvor gefassten bzw. gestalteten Plan und seiner jetzigen Verwirklichung bleibt erhalten. Die Formulierung vermeidet konfessionelle Zusätze und lässt die Zweck-Folge-Beziehung bewusst offen.
