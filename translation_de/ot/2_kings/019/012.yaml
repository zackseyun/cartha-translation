source:
  edition: WLC
  text: הַ/הִצִּ֨ילוּ אֹתָ֜/ם אֱלֹהֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר שִׁחֲת֣וּ אֲבוֹתַ֔/י אֶת גּוֹזָ֖ן וְ/אֶת חָרָ֑ן וְ/רֶ֥צֶף וּ/בְנֵי עֶ֖דֶן אֲשֶׁ֥ר בִּ/תְלַאשָּֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: de
  text: 'Haben etwa die Götter der Völker diejenigen gerettet, die meine Vorfahren vernichtet haben: Gosan, Haran, Rezef und die Bewohner von Eden[a], die in Telassar waren?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Edens«. Dies kann die Menschen beziehungsweise Bewohner von Eden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Haben etwa ... gerettet
  rationale: Das Hifil Perfekt von נצל steht in einer rhetorischen Frage. Das deutsche Perfekt klingt in direkter Rede natürlich; „etwa“ macht den erwarteten verneinenden Sinn kenntlich, ohne ihn als Aussage wiederzugeben.
- source_word: אֹתָם
  choice: sie
  rationale: Das Akkusativpronomen bezieht sich vorausweisend auf die anschließend genannten Orte beziehungsweise Bevölkerungen.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: die Götter der Völker
  rationale: Die Status-constructus-Verbindung bezeichnet die von den jeweiligen Völkern verehrten Gottheiten und lässt sich im Deutschen direkt wiedergeben.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: die meine Vorfahren vernichtet haben
  rationale: שׁחת im Piel bezeichnet hier im militärischen Zusammenhang das Vernichten oder Zugrunderichten. „Vorfahren“ gibt אבותי in Bezug auf frühere assyrische Herrscher im heutigen Deutsch verständlicher wieder als das wörtliche „Väter“.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Gosan, Haran, Rezef
  rationale: Die Ortsnamen werden in gebräuchlicher deutscher Transliteration wiedergegeben.
- source_word: וּבְנֵי עֶדֶן
  choice: die Bewohner von Eden
  rationale: בני bedeutet wörtlich „Söhne von“, bezeichnet hier aber wahrscheinlich die zu Eden gehörende Bevölkerung. Die wörtliche Möglichkeit bleibt in der Fußnote erhalten.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: in Telassar
  rationale: Die Relativbestimmung lokalisiert die Bewohner Edens. Im Deutschen kann sie knapp als nachgestellte Ortsangabe wiedergegeben werden.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage bleibt erhalten. „Vorfahren“ vermeidet das im heutigen Deutsch missverständliche wörtliche „Väter“, während die Bildsprache bei „Söhne Edens“ durch eine Fußnote transparent gemacht wird.
