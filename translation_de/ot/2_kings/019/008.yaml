source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ רַב שָׁקֵ֔ה וַ/יִּמְצָא֙ אֶת מֶ֣לֶךְ אַשּׁ֔וּר נִלְחָ֖ם עַל לִבְנָ֑ה כִּ֣י שָׁמַ֔ע כִּ֥י נָסַ֖ע מִ/לָּכִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/008.yaml
  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: de
  text: Da kehrte der Rabschake zurück und fand den König von Assyrien im Kampf gegen Libna; denn er hatte gehört, dass dieser von Lachisch aufgebrochen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass dieser von Lachisch abgezogen war«. Das hebräische Verb kann besonders im militärischen Zusammenhang das Aufbrechen, den Abmarsch oder das Weiterziehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte ... zurück
  rationale: שׁוּב bezeichnet hier die Rückkehr zu einer Person oder einem früheren Aufenthaltsort; die deutsche Verbklammer ist natürlich und nah am hebräischen Ausdruck.
- source_word: רַב שָׁקֵה
  choice: der Rabschake
  rationale: Die assyrische Amtsbezeichnung wird wie im Erzählzusammenhang als namensähnlicher Titel beibehalten; eine Funktionsübersetzung wie »Obermundschenk« könnte die Rolle missverständlich verengen.
- source_word: וַיִּמְצָא אֶת
  choice: fand
  rationale: מָצָא mit direktem Objekt bedeutet hier schlicht »finden«; dies wahrt die Formulierung des Hebräischen besser als »traf«.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: den König von Assyrien
  rationale: Direkte und im Deutschen natürliche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: נִלְחָם עַל
  choice: im Kampf gegen
  rationale: Das Partizip bezeichnet eine andauernde Kampfhandlung; עַל markiert die Stadt als Ziel des feindlichen Vorgehens.
- source_word: לִבְנָה
  choice: Libna
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: כִּי שָׁמַע
  choice: denn er hatte gehört
  rationale: Die Klausel begründet die zuvor geschilderte Lage; das Plusquamperfekt macht die zeitliche Vorordnung im Deutschen deutlich.
- source_word: כִּי נָסַע
  choice: dass dieser ... aufgebrochen war
  rationale: נָסַע bezeichnet besonders im militärischen Zusammenhang das Aufbrechen beziehungsweise den Abmarsch eines Lagers. »Dieser« kennzeichnet den König von Assyrien als natürliches Subjekt, ohne die im Hebräischen nur kontextuell bestimmte Referenz völlig einzuebnen.
- source_word: מִלָּכִישׁ
  choice: von Lachisch
  rationale: Etablierte deutsche Form des Ortsnamens mit unmittelbarer Wiedergabe der Präposition מִן.
