  source_fidelity: 'Der Entwurf gibt die hebräische Syntax und die Referenten zuverlässig wieder: Jesaja spricht zu mehreren Boten, die Botschaft ist an ihren Herrn Hiskia gerichtet, und die Singularformen „Fürchte dich“/„du gehört hast“ beziehen sich folgerichtig auf ihn. „Vor den Worten“ gibt מִפְּנֵי הַדְּבָרִים angemessen als Anlass der Furcht wieder. Das explizite „mich“ bewahrt den Bezug der Schmähung auf Jahwe. „Gelästert haben“ trifft die Schwere von גדף in diesem Kontext, ohne sie unnötig auszudeuten.'
