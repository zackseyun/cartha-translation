  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Diener des Königs von Assyrien“ ist als kontextuelle Wiedergabe von נַעֲרֵי tragfähig; die Fußnote wahrt die lexikalische Spannweite („junge Männer“, „Begleiter“, königliche Diener oder Amtsträger). Der Fußnotenanker steht unmittelbar bei „Diener“ und ist korrekt zugeordnet.
