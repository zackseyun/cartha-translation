  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: de
  text: 'Jesaja sagte zu ihnen: „So sollt ihr zu eurem Herrn sagen: So spricht Jahwe: ‚Fürchte dich nicht vor den Worten, die du gehört hast und mit denen mich die Diener[a] des Königs von Assyrien gelästert haben.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die jungen Männer“ beziehungsweise „die Begleiter des Königs von Assyrien“. Das hebräische Wort kann junge Männer bezeichnen, hier aber auch königliche Diener oder Amtsträger.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das einfache Präteritum entspricht der hebräischen Erzählform und klingt im deutschen Erzählstil natürlich.
- source_word: אֲדֹנֵיכֶם
  choice: eurem Herrn
  rationale: Gemeint ist Hiskia als der Herr der Gesandten; die Wiedergabe wahrt das Verhältnis der Unterordnung, ohne einen göttlichen Titel einzusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die Form gibt das göttliche Verbot beziehungsweise die Zusage knapp, würdig und idiomatisch wieder.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: vor den Worten
  rationale: Die Präposition bezeichnet hier den Anlass der Furcht; „Worte“ passt zum Zusammenhang der gehörten Drohungen.
- source_word: שָׁמַעְתָּ
  choice: die du gehört hast
  rationale: Das Perfekt bezeichnet ein abgeschlossenes Hören mit unmittelbarer Bedeutung für die gegenwärtige Lage.
- source_word: גִּדְּפוּ
  choice: gelästert haben
  rationale: Das Verb bezeichnet eine schwere, gegen Gott gerichtete Schmähung. „Lästern“ bewahrt dieses religiöse Gewicht.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: die Diener des Königs von Assyrien
  rationale: נַעַר kann einen jungen Mann bezeichnen, in einem königlichen Zusammenhang aber auch einen Diener, Begleiter oder Amtsträger. Hier steht ihre Funktion als Abgesandte im Vordergrund.
- source_word: אֹתִי
  choice: mich
  rationale: Das ausdrückliche Objekt macht deutlich, dass Jahwe selbst Ziel der Schmähung ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; „Jahwe“ bewahrt den Charakter als Eigenname.
- issue: Stärke von גִּדְּפוּ bei einer Äußerung gegen Gott
  choice: mich gelästert haben
  alternative: mich verhöhnt haben
  rationale: „Gelästert“ erhält die besondere Schwere der gegen Gott gerichteten Rede, ohne den Text auszudeuten oder zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ineinander geschachtelte direkte Rede bleibt sichtbar; zugleich wird der Satzbau so gehalten, dass der Vers mündlich gut verständlich ist.
