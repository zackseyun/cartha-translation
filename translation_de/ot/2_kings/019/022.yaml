source:
  edition: WLC
  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: de
  text: Wen hast du verhöhnt und gelästert? Gegen wen hast du deine Stimme erhoben und deine Augen zur Höhe erhoben? Gegen den Heiligen Israels.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geschmäht und verhöhnt«. Die beiden hebräischen Verben bezeichnen ähnliche Formen verächtlicher und beleidigender Rede; das zweite kann besonders Lästerung gegen Gott meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »deine Augen zur Höhe erhoben«; eine bildhafte Wendung für Hochmut und überhebliche Selbsterhöhung.'
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: verhöhnt
  rationale: Das Verb bezeichnet eine verächtliche, beleidigende Äußerung. »Verhöhnt« ist im modernen Deutschen natürlich, würdevoll und passt zur Parallelstellung mit dem stärkeren »gelästert«.
- source_word: גִדַּפְתָּ
  choice: gelästert
  rationale: גדף kann besonders frevelhafte Schmährede gegen Gott bezeichnen. »Gelästert« bewahrt hier das theologische Gewicht, ohne mehr auszusagen als der Kontext trägt.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: deine Stimme erhoben
  rationale: Die geläufige deutsche Wendung gibt das hebräische Idiom genau und verständlich wieder und lässt den herausfordernden Ton erkennen.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: deine Augen hochmütig erhoben
  rationale: Die wörtliche Höhenvorstellung bezeichnet in diesem Zusammenhang arrogante Selbstüberhebung. Die Wiedergabe bewahrt das Bild des Erhebens und macht seine idiomatische Bedeutung verständlich.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Dies ist ein feststehender Gottesname, der unmittelbar und traditionsgemäß wiedergegeben werden sollte.
- source_word: עַל
  choice: gegen
  rationale: Die Präposition bezeichnet hier in beiden Fällen die feindselige Ausrichtung der Rede und Haltung.
theological_decisions:
- issue: Das Gewicht der gegen Gott gerichteten Schmährede
  choice: גדף mit »gelästert« wiedergeben und die abschließende Identifizierung »gegen den Heiligen Israels« beibehalten.
  alternative: »geschmäht« oder »beleidigt«
  rationale: Der Vers tadelt nicht nur politische Überheblichkeit, sondern frevelhafte Rede gegen Israels Gott. »Gelästert« bringt dies zur Geltung, ohne eine zusätzliche konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, rhetorisch zugespitztem Ton. Die wiederholte Frage und die klimaktische Antwort bleiben erhalten; die idiomatische Höhenangabe wird im Haupttext verständlich erschlossen und in der Fußnote wörtlich dokumentiert.
