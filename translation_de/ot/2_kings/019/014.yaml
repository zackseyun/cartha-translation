base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: de
  text: Dann nahm Hiskija die Schreiben[a] aus der Hand der Boten und las sie. Darauf ging er zum Haus Jahwes hinauf und breitete es[b] vor Jahwe aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schriftstücke“ beziehungsweise „Dokumente“. Das hebräische Wort ist weiter gefasst als „Briefe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „es“. Obwohl zuvor mehrere Schreiben genannt werden, fasst die singularische Form sie möglicherweise als ein Schreiben oder eine Botschaft zusammen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: die Schreiben
  rationale: Das hebräische Wort bezeichnet allgemein schriftliche Dokumente. Im Erzählzusammenhang handelt es sich um die von den Boten überbrachte schriftliche Botschaft; „Schreiben“ ist im Deutschen natürlich und lässt den genauen Dokumenttyp offen.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: aus der Hand der Boten
  rationale: Die konkrete hebräische Wendung wird bewahrt. מַלְאָכִים bezeichnet hier eindeutig menschliche Boten, nicht Engel.
- source_word: וַיַּעַל
  choice: ging er hinauf
  rationale: Die Übersetzung erhält die im Verb ausgedrückte Aufwärtsbewegung zum Tempel.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Bezeichnung „Haus Jahwes“ bleibt erhalten; gemeint ist der Tempel.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: breitete es aus
  rationale: Das Verb beschreibt das Ausbreiten oder Auslegen des Schriftstücks. Das singularische Suffix wird trotz des vorhergehenden Plurals sichtbar wiedergegeben und vermutlich auf die schriftliche Botschaft als Einheit bezogen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Unterschied zwischen dem Tetragramm und einem bloßen Titel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Numeruswechsel beim ausgebreiteten Schriftstück
  choice: „es“ entsprechend dem singularischen hebräischen Suffix
  alternative: „sie“ entsprechend dem vorausgehenden Plural „die Schreiben“
  rationale: Der hebräische Text wechselt vom Plural beim Lesen zum Singular beim Ausbreiten. Die Übersetzung glättet diesen Wechsel nicht, sondern erklärt ihn als mögliche Zusammenfassung der Schreiben zu einer Botschaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die konkrete Wendung „aus der Hand der Boten“ und die Bezeichnung „Haus Jahwes“ bewahren die Bildsprache des Hebräischen. Der auffällige Numeruswechsel des Ausgangstextes bleibt erhalten und wird in einer Fußnote erläutert.
