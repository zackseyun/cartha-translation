  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: de
  text: Er sandte Eljakim, den Palastvorsteher[a], den Schreiber Schebna und die Ältesten der Priester, alle in Sacktuch gekleidet[b], zum Propheten Jesaja, dem Sohn des Amoz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der über dem Haus war“. Gemeint ist ein hoher königlicher Beamter, der für den Palast oder den königlichen Haushalt verantwortlich war.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „alle, die sich mit Sacktuch bedeckten“. Das hebräische Partizip kann den Vorgang oder den daraus entstandenen Zustand hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Er sandte
  rationale: Das Wayyiqtol führt die Erzählung weiter. Im Deutschen gibt die einfache Vergangenheitsform den Fortgang natürlich wieder; das im Hebräischen enthaltene verbindende ו muss nicht eigens mit „und“ ausgedrückt werden.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: den Palastvorsteher
  rationale: Die Wendung bezeichnet einen hohen königlichen Beamten, der dem Palast beziehungsweise dem königlichen Haushalt vorstand. „Palastvorsteher“ ist im modernen Deutschen klarer als eine wörtliche, aber missverständliche Formulierung wie „der über dem Haus war“.
- source_word: הַסֹּפֵר
  choice: den Schreiber
  rationale: סֹפֵר kann einen Schreiber oder königlichen Sekretär bezeichnen. „Schreiber“ bewahrt die lexikalische Breite, ohne das konkrete Hofamt stärker festzulegen, als es der hebräische Text tut.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: die Ältesten der Priester
  rationale: Die Konstruktion wird direkt wiedergegeben und unterscheidet weiterhin zwischen dem Ältestenstatus und der Zugehörigkeit zur Priesterschaft.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: die in Sacktuch gekleidet waren
  rationale: Das Partizip kann den Vorgang des Sichbedeckens oder den daraus entstandenen Zustand hervorheben. Im Satzfluss liegt die Zustandsbeschreibung nahe; „Sacktuch“ bewahrt das Bild von Trauer und Demütigung.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: zum Propheten Jesaja
  rationale: Die appositionelle Amtsbezeichnung wird natürlich ins Deutsche gestellt, ohne ihre Aussage zu erweitern.
- source_word: בֶּן אָמוֹץ
  choice: dem Sohn des Amoz
  rationale: Die Abstammungsangabe identifiziert Jesaja unmittelbar und wird in idiomatischer deutscher Apposition wiedergegeben.
theological_decisions: []
