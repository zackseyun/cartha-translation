  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/030.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: de
  text: Der übrig gebliebene Rest des Hauses Juda wird wieder nach unten Wurzeln schlagen und nach oben Frucht tragen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Die Entronnenen des Hauses Juda, die übrig geblieben sind.'
    reason: 'Lexikalische Alternative: פְּלֵיטָה kann konkret die Entronnenen bezeichnen, während הַנִּשְׁאָרָה das Übrigbleiben zusätzlich hervorhebt.'
lexical_decisions:
- source_word: וְיָסְפָה
  choice: wird wieder
  rationale: יסף bezeichnet hier zusammen mit dem folgenden Bild eine erneute beziehungsweise fortgesetzte Entwicklung. „Wird wieder“ bringt im Zusammenhang die Wiederherstellung nach der Not natürlich zum Ausdruck.
- source_word: פְּלֵיטַת … הַנִּשְׁאָרָה
  choice: der übrig gebliebene Rest
  rationale: פְּלֵיטָה bezeichnet Entronnene beziehungsweise einen entkommenen Rest; הַנִּשְׁאָרָה unterstreicht, dass dieser übrig geblieben ist. Die Hauptfassung gibt die kollektive Bedeutung knapp und idiomatisch wieder; die Fußnote bewahrt die konkretere Lesart.
- source_word: בֵּית יְהוּדָה
  choice: des Hauses Juda
  rationale: Die ausdrückliche Wendung „Haus Juda“ bleibt als geschichtlich-kollektive Bezeichnung erhalten und wird nicht auf „Juda“ verkürzt.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: nach unten Wurzeln schlagen
  rationale: Das Hebräische verwendet „Wurzel“ in Verbindung mit יסף. Die deutsche verbale Wendung bewahrt das landwirtschaftliche Bild und den Richtungskontrast.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: und nach oben Frucht tragen
  rationale: עשה פרי bedeutet idiomatisch „Frucht tragen/hervorbringen“. „Nach oben“ bildet den poetischen Gegenpol zu „nach unten“.
theological_decisions:
- issue: Die Sprache vom Rest in einer Verheißung der Wiederherstellung
  choice: der übrig gebliebene Rest
  alternative: die Entronnenen des Hauses Juda, die übrig geblieben sind
  rationale: Die Fassung bewahrt das biblische Motiv eines nach dem Gericht erhaltenen Restes, ohne dessen spätere theologische Bedeutung näher festzulegen. Die Fußnote hält zugleich den konkreten Aspekt des Entrinnens offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ausgewogene Bildsprache „nach unten … nach oben“ und „Wurzeln … Frucht“ bleibt erhalten; die leichte Wiederholung des hebräischen Überlebensmotivs wird in der Hauptfassung geglättet und in der Fußnote sichtbar gemacht.
