  to: 'So sollt ihr zu Hiskia, dem König von Juda, sagen: »Lass dich nicht von deinem Gott, auf den du vertraust, täuschen, indem er sagt: ›Jerusalem wird nicht in die Hand des Königs von Assyrien gegeben werden.‹«'
  rationale: Die Verbindung der behaupteten Täuschung mit der folgenden Gottesrede wurde von der missverständlichen konditionalen Formulierung zu „indem er sagt“ präzisiert. Die nicht auf das Deutsche übertragbare und daher irreführende Fußnote zur Groß- und Kleinschreibung wurde mitsamt ihrem Anker entfernt. Im Übrigen bleibt die Übersetzung quellennahe und bewahrt die rhetorische Perspektive des assyrischen Sprechers.
