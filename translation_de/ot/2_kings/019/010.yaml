  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: de
  text: 'So sollt ihr zu Hiskia, dem König von Juda, sagen: »Lass dich nicht von deinem Gott, auf den du vertraust, täuschen, indem er sagt: ›Jerusalem wird nicht in die Hand des Königs von Assyrien gegeben werden.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה
  choice: So
  rationale: Leitet als deiktisches Adverb die auszurichtende Botschaft ein; „So sollt ihr … sagen“ bewahrt den formelhaften Ton und ist im heutigen Deutsch natürlich.
- source_word: תֹאמְרוּן
  choice: sollt ihr … sagen
  rationale: Der Imperfekt der 2. Person maskulin Plural hat hier anweisende Kraft. „Sollt ihr sagen“ gibt diese direkt wieder.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Hiskia, dem König von Juda
  rationale: Verwendet die im Deutschen übliche Namensform und fasst den Königstitel als Apposition auf.
- source_word: אַל יַשִּׁאֲךָ
  choice: Lass dich nicht … täuschen
  rationale: נשׁא bezeichnet hier das Täuschen oder Irreführen. Die deutsche Konstruktion wahrt das Verbot und klingt mit Gott als handelndem Subjekt idiomatisch.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Der Singular mit Possessivsuffix wird direkt wiedergegeben; der Bezug gilt dem Gott Hiskias.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: auf den du vertraust
  rationale: בטח mit ב bezeichnet das Vertrauen auf jemanden; „auf den du vertraust“ ist präzises, natürliches Deutsch.
- source_word: לֵאמֹר
  choice: wenn er sagt
  rationale: Das zweite לֵאמֹר führt den Inhalt der angeblichen Täuschung ein. „Wenn er sagt“ erhält den Bezug auf Gottes Zusage, ohne die syntaktische Beziehung im Deutschen unnötig zu verunklaren.
- source_word: לֹא תִנָּתֵן
  choice: wird nicht … gegeben werden
  rationale: Gibt den Nifal von נתן formal als Passiv wieder und vermeidet die stärker deutende Alternative „ausgeliefert werden“.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: in die Hand des Königs von Assyrien
  rationale: Bewahrt das verständliche hebräische Bild für die Übergabe in die Gewalt oder Kontrolle eines Herrschers.
theological_decisions:
- issue: Schreibung von אֱלֹהֶיךָ im Mund des assyrischen Königs
  choice: deinem Gott
  alternative: deinem gott / deiner Gottheit
  rationale: Die hebräische Schrift unterscheidet keine Groß- und Kleinschreibung. Da Hiskias Gott gemeint ist, steht im Haupttext die übliche deutsche Großschreibung; der spöttische oder geringschätzige Ton des assyrischen Sprechers wird als mögliche Nuance in der Fußnote offengehalten.
- issue: Bezug des zweiten לֵאמֹר
  choice: wenn er sagt
  alternative: indem er sagt / mit der Aussage
  rationale: Die Formulierung lässt die Aussage als Mittel beziehungsweise Anlass der behaupteten Täuschung erkennen, ohne die Lästerung des assyrischen Sprechers abzuschwächen oder als Erzählerurteil auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht formelhaftem Ton. Die Wendung „in die Hand … gegeben“ bewahrt bewusst das biblische Bild, bleibt aber allgemein verständlich. Die ineinander gesetzten Zitate werden mit deutschen Anführungszeichen klar gegliedert.
