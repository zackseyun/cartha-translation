  naturalness: Die Syntax ist klar und der leicht formelhafte Ton angemessen. „Indem er sagt“ stellt die Beziehung der Gottesrede zur behaupteten Täuschung idiomatisch und präzise her. Das Passiv „wird nicht in die Hand ... gegeben werden“ bewahrt das Quellbild und ist trotz seiner Formhaftigkeit gut verständlich.
