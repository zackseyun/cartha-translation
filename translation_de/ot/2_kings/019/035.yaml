  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: de
  text: In jener Nacht zog der Engel Jahwes aus und erschlug im Lager Assyriens 185.000. Als man früh am Morgen aufstand,[a] siehe, da waren sie alle tot – lauter Leichen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und sie standen früh am Morgen auf.“ Das Hebräische verwendet ein unbestimmtes Subjekt in der 3. Person Plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Leichen, tot“; eine nachdrückliche Bezeichnung der Erschlagenen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: In jener Nacht
  rationale: Die hebräische Erzählformel kann im modernen Deutschen idiomatisch verkürzt werden; die zeitliche Verknüpfung bleibt erhalten.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ bezeichnet hier einen übernatürlichen Boten; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וַיֵּצֵא
  choice: zog ... aus
  rationale: „Ausziehen“ gibt יצא natürlich wieder und passt zum militärisch geprägten Erzählzusammenhang.
- source_word: וַיַּךְ
  choice: erschlug
  rationale: נכה bezeichnet hier einen Schlag mit tödlichem Ergebnis; „erschlug“ bringt beides knapp zum Ausdruck.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: im Lager Assyriens
  rationale: Nahe Wiedergabe des hebräischen Ausdrucks; „Assyrien“ steht für das assyrische Heer.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 185.000 Mann
  rationale: Die Zahl wird direkt wiedergegeben; „Mann“ verdeutlicht im Deutschen idiomatisch die gezählten Angehörigen des Heeres.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Als man früh am Morgen aufstand
  rationale: Das unbestimmte Subjekt der dritten Person Plural wird durch das deutsche unpersönliche „man“ bewahrt, ohne einen bestimmten Personenkreis einzutragen.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: Der Aufmerksamkeitsmarker wird beibehalten, um den überraschenden Anblick rhetorisch hervorzuheben.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: da waren sie alle tot—lauter Leichen
  rationale: Die Formulierung bewahrt sowohl die Gesamtheit als auch die emphatische hebräische Verbindung von „Leichen“ und „tot“, ohne im Deutschen unbeholfen zu wirken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Identität des מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: ein Engel Jahwes; der Bote Jahwes
  rationale: Die traditionelle und kontextuell passende Wiedergabe bezeichnet den übernatürlichen Vollstrecker, ohne seine genaue theologische Identität näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählung bleibt knapp und eindringlich; „siehe“ bewahrt bewusst den rhetorischen Hinweischarakter des hebräischen וְהִנֵּה.
