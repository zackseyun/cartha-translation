source:
  edition: WLC
  text: וְ/גַנּוֹתִ֛י אֶל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: de
  text: Denn ich werde diese Stadt beschützen, um sie zu retten[a] – um meinetwillen und um meines Dieners David willen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie befreien«. Das hebräische Verb kann bei einer Rettung aus Gefahr sowohl »retten« als auch »befreien« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: ich werde … beschützen
  rationale: Das Verb גנן bezeichnet hier schützendes Eingreifen. „Beschützen“ ist im modernen Deutschen natürlich und passt zur militärischen Bedrohung Jerusalems.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Bei גנן bezeichnet אֶל das Ziel der Schutzhandlung. Im Deutschen wird dies idiomatisch als direktes Objekt wiedergegeben.
- source_word: לְהוֹשִׁיעָהּ
  choice: und sie retten
  rationale: Der Infinitiv von ישׁע drückt das Ziel des Schutzes aus. „Retten“ gibt die Befreiung aus unmittelbarer Gefahr klar wieder; die koordinierte Formulierung ist im Deutschen natürlicher als „um sie zu retten“ nach „beschützen“.
- source_word: לְמַעֲנִי
  choice: um meinetwillen
  rationale: Die traditionelle, weiterhin verständliche Wendung gibt den Beweggrund prägnant wieder und bewahrt die ausdrückliche Selbstbezüglichkeit der Aussage.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: und um meines Dieners David willen
  rationale: Die Formulierung bewahrt den zweiten ausdrücklich genannten Beweggrund sowie Davids Bezeichnung als Gottes Diener.
theological_decisions:
- issue: Gottes Beweggründe für die Rettung Jerusalems
  choice: 'Beide im Hebräischen genannten Gründe bleiben nebeneinander stehen: Gottes eigenes Anliegen und sein Bezug zu seinem Diener David.'
  alternative: Den Hinweis auf David ausdrücklich als Verweis auf den davidischen Bund oder allein auf frühere Verheißungen auszudeuten.
  rationale: Der Vers nennt durch die zweimalige Wendung לְמַעַן zwei Beweggründe, erläutert aber ihr genaues theologisches Verhältnis nicht. Die Übersetzung bewahrt diese Spannung ohne dogmatische Erweiterung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Um meinetwillen“ und „um … willen“ sind leicht gehoben, entsprechen aber dem feierlichen Gotteswort und bilden die parallelen hebräischen Begründungen klar ab.
