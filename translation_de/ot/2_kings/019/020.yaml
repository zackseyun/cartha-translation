base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: de
  text: 'Da ließ Jesaja, der Sohn des Amoz, Hiskia ausrichten: »So spricht der HERR, der Gott Israels: Was du wegen Sanherib, des Königs von Assyrien, zu mir gebetet hast, habe ich gehört.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: ließ ... ausrichten
  rationale: Gibt die hebräische Botenformel natürlich und prägnant wieder, ohne anzudeuten, Jesaja sei selbst zu Hiskia gegangen.
- source_word: יְהוָה
  choice: der HERR
  rationale: Entspricht der etablierten deutschen Wiedergabetradition des Gottesnamens und dem konsultierten POB-Text.
- source_word: אֶל סַנְחֵרִב
  choice: wegen Sanherib
  rationale: אֶל bezeichnet hier den Gegenstand bzw. Anlass des Gebets; „wegen“ ist im Deutschen natürlich und lässt offen, ob um Hilfe gegen ihn oder allgemeiner in seiner Angelegenheit gebetet wurde.
- source_word: שָׁמָעְתִּי
  choice: habe ich gehört
  rationale: Bewahrt die knappe göttliche Zusage des hebräischen Perfekts.
theological_decisions:
- issue: Funktion von אֲשֶׁר vor הִתְפַּלַּלְתָּ
  choice: Was du ... gebetet hast, habe ich gehört
  alternative: Weil du ... gebetet hast, habe ich gehört
  rationale: Die hebräische Relativkonstruktion bezeichnet am unmittelbarsten den Inhalt bzw. das Gebet, das Gott gehört hat. Eine kausale Deutung ist möglich, wird aber nicht unnötig festgeschrieben.
- issue: Bedeutung von Gottes Hören
  choice: wörtlich „habe ich gehört“
  alternative: „habe ich erhört“
  rationale: „Erhört“ würde bereits die positive Antwort ausdrücklich machen; „gehört“ bewahrt die Formulierung und Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die klassische prophetische Formel „So spricht der HERR“ bleibt erhalten; Satzbau und Botenformel sind für heutige Leser natürlich gestaltet.
