source:
  edition: WLC
  text: וְ/שִׁבְתְּ/ךָ֛ וְ/צֵאתְ/ךָ֥ וּ/בֹאֲ/ךָ֖ יָדָ֑עְתִּי וְ/אֵ֖ת הִֽתְרַגֶּזְ/ךָ֥ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/027.yaml
  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: de
  text: Doch ich kenne dein Sitzen[a], dein Hinausgehen und dein Hereinkommen und dein Toben gegen mich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung »dein Sitzen, dein Hinausgehen und dein Hereinkommen« umfasst den gesamten Aufenthalt, alle Bewegungen und das Verhalten eines Menschen.
    reason: cultural_note
  - marker: b
    text: 'Oder: »deine Erregung gegen mich« beziehungsweise »deine Wut auf mich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: dein Sitzen
  rationale: Die konkrete Ausdrucksweise von ישׁב bleibt erhalten. Zusammen mit »Hinausgehen« und »Hereinkommen« bezeichnet sie umfassend Aufenthalt, Bewegungen und Verhalten.
- source_word: וְצֵאתְךָ
  choice: dein Hinausgehen
  rationale: Gibt יצא natürlich und quellennah wieder und bildet mit »Hereinkommen« die idiomatische Paarung.
- source_word: וּבֹאֲךָ
  choice: dein Hereinkommen
  rationale: Bewahrt die räumliche Bildsprache von בוא und ergänzt die Wendung »Hinausgehen und Hereinkommen«.
- source_word: יָדָעְתִּי
  choice: ich kenne
  rationale: Das hebräische Perfekt bezeichnet hier Gottes feststehende, umfassende Kenntnis; im deutschen direkten Redekontext ist das Präsens angemessen.
- source_word: הִתְרַגֶּזְךָ
  choice: dein Toben
  rationale: Der Hitpael-Ausdruck bezeichnet heftige Erregung beziehungsweise Wut. »Toben« vermittelt die feindselige Intensität, ohne sie als Überheblichkeit auszudeuten.
- source_word: אֵלָי
  choice: gegen mich
  rationale: Obwohl אֶל grundsätzlich »zu/auf … hin« bedeutet, verlangt die Verbindung mit feindseligem Toben im Deutschen eine adversative Wiedergabe.
- source_word: וְאֵת
  choice: und
  rationale: Die Konjunktion mit Objektmarker führt ein weiteres Objekt von »ich kenne« ein; der nicht übersetzbare Objektmarker wird nicht eigens wiedergegeben.
