lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das Wayyiqtol von בוא führt das nächste Ereignis der Erzählung ein. „Da kamen“ gibt die zeitliche Abfolge im Deutschen natürlich wieder, ohne einen stärkeren Kausalzusammenhang auszudrücken.
- source_word: עַבְדֵי
  choice: die Diener
  rationale: Der Status constructus im Plural kann Diener, Bedienstete oder königliche Amtsträger bezeichnen. „Diener“ bewahrt die lexikalische Breite und passt in den höfischen Zusammenhang, ohne die Funktion genauer festzulegen als der hebräische Text.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: König Hiskijas
  rationale: Die Verbindung bezeichnet Hiskia mit seinem Königstitel. Die deutsche Form „König Hiskia“ ist idiomatisch; der Genitiv „König Hiskijas“ ergibt sich aus der Zugehörigkeitsbeziehung zu den Dienern.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet die auf eine Person gerichtete Bewegung; „zu“ ist hier die übliche deutsche Entsprechung.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Verwendet die im Deutschen etablierte Namensform des Propheten.
