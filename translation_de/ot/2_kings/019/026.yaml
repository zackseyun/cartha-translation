base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: de
  text: Darum waren ihre Bewohner kraftlos[a]; sie waren bestürzt und wurden beschämt. Sie waren wie das Gras auf dem Feld und wie frisches Grün, wie Gras auf den Dächern und wie versengte Saat, ehe sie aufschießt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kurz an Hand“; eine hebräische Redewendung für fehlende Kraft oder Macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „und Versengung vor dem stehenden Getreide“. Die knappe hebräische Wendung kann auch als „wie vom Glutwind versengtes Getreide, bevor es als Halm steht“ oder als „wie Brand vor dem stehenden Getreide“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: ihre Bewohner
  rationale: Das Suffix verweist im Zusammenhang auf die zuvor genannten Orte. „Bewohner“ gibt den konkreten Sinn natürlich und knapp wieder.
- source_word: קִצְרֵי יָד
  choice: kraftlos
  rationale: Die wörtliche Wendung „kurz an Hand“ ist ein Idiom für fehlende Macht oder Handlungsfähigkeit. „Kraftlos“ vermittelt diesen Sinn in klarem Deutsch; die Bildform wird in einer Fußnote genannt.
- source_word: חַתּוּ
  choice: sie waren bestürzt
  rationale: Das Verb kann ein Gebrochensein, Erschrecken oder Verzagen bezeichnen. „Bestürzt“ wahrt den Zustand völliger Einschüchterung, ohne eine rein körperliche Zerschmetterung nahezulegen.
- source_word: וַיֵּבֹשׁוּ
  choice: wurden zuschanden
  rationale: Die Form bezeichnet das Eintreten von Schande oder Beschämung. „Wurden zuschanden“ bewahrt den resultativen Nachdruck und den würdigen poetischen Ton.
- source_word: הָיוּ
  choice: sie waren wie
  rationale: Das Verb leitet hier eine Reihe poetischer Vergleiche ein. Die stative Wiedergabe bleibt eng am Hebräischen und vermeidet die unnötige Festlegung auf „sie wurden“.
- source_word: עֵשֶׂב שָׂדֶה
  choice: das Gras auf dem Feld
  rationale: Die Wendung bezeichnet gewöhnliches Feldgras und eröffnet das Bild vergänglicher Vegetation.
- source_word: וִירַק דֶּשֶׁא
  choice: frisches Grün
  rationale: Die Wortgruppe bezeichnet grüne, junge Vegetation. „Frisches Grün“ ist anschaulich, natürlich und nicht altertümlich.
- source_word: חֲצִיר גַּגּוֹת
  choice: Gras auf den Dächern
  rationale: Die Übersetzung bewahrt das konkrete Bild des flach wurzelnden und rasch verdorrenden Dachgrases.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: wie Versengtes, bevor es aufschießt
  rationale: Die hebräische Schlusswendung ist knapp und landwirtschaftlich mehrdeutig. Die Wiedergabe erhält das Bild von versengtem Wachstum, ohne „Getreide“ ausdrücklich zu ergänzen; eine Fußnote nennt die möglichen Deutungen.
