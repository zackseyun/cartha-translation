source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: de
  text: Sieh, du hast gehört, was die Könige von Assyrien allen Ländern angetan haben, indem sie sie der Vernichtung weihten[a]. Und du wirst gerettet werden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem sie sie völlig vernichteten“. Das hebräische Wort bezeichnet, dass etwas dem Bann und damit der Vernichtung übergeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird als knapper, gegenwärtig verständlicher Hinweis wiedergegeben und behält ihre nachdrückliche Funktion.
- source_word: שָׁמַעְתָּ
  choice: du hast gehört
  rationale: Das Perfekt der zweiten Person Singular bezeichnet bereits erhaltene Kenntnis, die für die gegenwärtige Drohung maßgeblich ist.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: was ... angetan haben
  rationale: Die Formulierung gibt die Objekt- und Relativkonstruktion natürlich wieder; „angetan“ passt zum feindlichen Vorgehen gegen die Länder.
- source_word: מַלְכֵי אַשּׁוּר
  choice: die Könige von Assyrien
  rationale: Dies ist eine klare und idiomatische Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: לְכָל הָאֲרָצוֹת
  choice: allen Ländern
  rationale: Der Plural bezeichnet hier politische Gebiete beziehungsweise Reiche und nicht die gesamte Erde.
- source_word: לְהַחֲרִימָם
  choice: indem sie sie der Vernichtung weihten
  rationale: 'Die Wiedergabe bewahrt den besonderen Sinn von חרם: etwas unwiderruflich dem Untergang preiszugeben beziehungsweise zur Vernichtung zu bestimmen. Die Konstruktion mit „indem“ drückt aus, worin das Vorgehen gegen die Länder bestand.'
- source_word: וְאַתָּה תִּנָּצֵל
  choice: Und du solltest gerettet werden?
  rationale: Das selbstständige Pronomen setzt „du“ nachdrücklich von den vernichteten Ländern ab. Die Frageform bewahrt den höhnischen rhetorischen Sinn; das Passiv entspricht dem Nifal von נצל.
theological_decisions:
- issue: Wiedergabe der חרם-Terminologie im militärischen Gerichtskontext
  choice: der Vernichtung weihen
  alternative: völlig vernichten; dem Bann unterwerfen
  rationale: „Der Vernichtung weihen“ lässt den kultisch-rechtlichen Beiklang erkennen, ohne ein unverständliches Fachwort zu verwenden oder über den hebräischen Text hinaus eine bestimmte Lehrdeutung festzulegen.
- issue: Rhetorische Form der Schlussaussage
  choice: Und du solltest gerettet werden?
  alternative: Und wirst du gerettet werden?; Und du wirst entkommen?
  rationale: Der hebräische Wortlaut kann formal als Aussage gelesen werden, funktioniert im Zusammenhang jedoch als höhnische rhetorische Frage. „Solltest“ vermittelt die spöttische Ungläubigkeit, ohne die Möglichkeit der Rettung dogmatisch zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eröffnende Imperativ bleibt knapp und nachdrücklich; die Schlussfrage erhält den drohenden, spöttischen Ton. Die Fußnote erklärt den besonderen Bedeutungsumfang von חרם, ohne den Haupttext mit Fachsprache zu belasten.
