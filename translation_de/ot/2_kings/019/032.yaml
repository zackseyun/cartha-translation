  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: de
  text: 'Darum spricht Jahwe Folgendes über den König von Assyrien: Er wird nicht in diese Stadt hineinkommen und dort keinen Pfeil abschießen. Er wird nicht mit einem Schild gegen sie vorrücken[a] und keinen Belagerungswall gegen sie aufschütten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird ihr nicht mit einem Schild entgegentreten.“ Das Hebräische kann das Herannahen an die Stadt mit einem Schild im Belagerungskampf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „keine Belagerungsrampe gegen sie aufschütten“. Das hebräische Wort bezeichnet ein aufgeworfenes Erdwerk zur Belagerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Funktion des hebräischen Ausdrucks knapp und natürlich wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Bewahrt die geläufige prophetische Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: über den König von Assyrien
  rationale: אֶל bezeichnet hier angesichts des folgenden Inhalts am ehesten denjenigen, über den der Ausspruch ergeht, nicht den unmittelbaren Adressaten.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: Er wird nicht in diese Stadt hineinkommen
  rationale: Das Futur mit Verneinung ist eine göttliche Vorhersage; „hineinkommen“ wahrt die auf das Innere der Stadt gerichtete Bewegung.
- source_word: וְלֹא יוֹרֶה שָׁם חֵץ
  choice: und dort keinen Pfeil abschießen
  rationale: Die Hifil-Form von ירה bezeichnet hier das Abschießen eines Geschosses; die Satzverbindung bleibt im Deutschen flüssig.
- source_word: וְלֹא יְקַדְּמֶנָּה מָגֵן
  choice: Er wird ihr nicht mit einem Schild entgegentreten
  rationale: קדמ im Piel kann „entgegentreten“, „zuvorkommen“ oder „sich nähern“ bedeuten. Die Wiedergabe bewahrt das ungewöhnliche Bild, ohne eine bestimmte Belagerungstechnik in den Haupttext einzutragen.
- source_word: וְלֹא יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: und keinen Belagerungswall gegen sie aufschütten
  rationale: Die feste militärische Verbindung meint das Aufwerfen eines Erdwerks gegen eine befestigte Stadt; „Belagerungswall“ ist im modernen Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im Deutschen erkennbar als Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Gewissheitsgrad der Verneinungen
  choice: Er wird nicht …
  alternative: Er soll nicht …
  rationale: Die Formen stehen in einem göttlichen Orakel als sichere Vorhersage, nicht als an den assyrischen König gerichtetes Verbot.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt knapp; die vier verneinten Angriffshandlungen werden in zwei gut lesbare Sätze gegliedert. Die mehrdeutige Schildformulierung wird im Haupttext bildhaft bewahrt und in der Fußnote erläutert.
