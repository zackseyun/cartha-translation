base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: de
  text: Weil dein Wüten gegen mich und deine selbstsichere Ruhe mir zu Ohren gekommen sind[a], werde ich meinen Haken in deine Nase legen und meinen Zaum in deine Lippen. Ich werde dich auf dem Weg zurückführen, auf dem du gekommen bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Überheblichkeit«, »deine Selbstsicherheit« oder »deine Sorglosigkeit«. Das hebräische Wort bezeichnet unbesorgte Ruhe oder ein Gefühl der Sicherheit, hier in einem feindseligen Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Weil
  rationale: Leitet den Grund für das folgende Gericht ein und gibt die kausale Funktion im modernen Deutschen natürlich wieder.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: dein Wüten gegen mich
  rationale: Das Hitpael von רָגַז bezeichnet hier feindselige Erregung beziehungsweise Wut; „Wüten“ bewahrt die starke, gegen Gott gerichtete Aussage.
- source_word: שַׁאֲנַנְךָ
  choice: deine selbstsichere Ruhe
  rationale: Das Wort bezeichnet Ruhe oder unbesorgte Sicherheit, die im feindseligen Kontext als vermessene Selbstsicherheit erscheint. Die Formulierung bewahrt sowohl den Grundsinn als auch den negativen Kontext.
- source_word: עָלָה בְאָזְנָי
  choice: mir zu Ohren gekommen sind
  rationale: Gibt die hebräische Wendung verständlich wieder und bewahrt durch „Ohren“ ihr anschauliches, anthropomorphes Bild.
- source_word: חַחִי בְּאַפֶּךָ
  choice: meinen Haken in deine Nase
  rationale: Bezeichnet einen Haken oder Ring, mit dem ein Tier oder Gefangener geführt wurde. „Haken“ und „Nase“ erhalten das drastische Bild der Unterwerfung.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: meinen Zaum an deine Lippen
  rationale: מֶתֶג bezeichnet ein Zaumzeug beziehungsweise dessen Gebiss. „Zaum“ ist im Deutschen klar und erhält zusammen mit „Lippen“ die konkrete Parallelität des Bildes.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: Ich werde dich … zurückführen
  rationale: Der Hifil von שׁוב ist kausativ und stellt Gottes wirksames Zurückschicken des Königs heraus.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: auf dem Weg …, auf dem du gekommen bist
  rationale: Bewahrt die formale Wiederholung und das Gerichtsmotiv, dass der Angreifer auf seiner eigenen Anmarschroute zurückgeschickt wird.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Hören und seinem Bezwingen des assyrischen Königs
  choice: Die Bilder von Gottes Ohren, Haken und Zaum bleiben im Text erhalten.
  alternative: Die Bilder zu abstrakten Aussagen wie „Ich habe es gehört“ und „Ich werde dich beherrschen“ verflachen.
  rationale: Die körpernahen Bilder vermitteln Gottes Kenntnis und souveräne Demütigung des überheblichen Königs. Ihre Bewahrung erhält die Kraft des prophetischen Gerichtsworts, ohne Aussagen über Gottes Wesen hinzuzufügen.
- issue: Bedeutung von שַׁאֲנַנְךָ
  choice: „deine selbstsichere Ruhe“ im Haupttext
  alternative: „deine Überheblichkeit“, „deine Selbstsicherheit“ oder „deine Sorglosigkeit“
  rationale: Der Ausdruck bezeichnet grundsätzlich Ruhe und sichere Unbekümmertheit, trägt hier aber durch den Kontext einen vorwurfsvollen Sinn. Die gewählte Formulierung erhält diese Spannung; stärkere Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastischen Herrschaftsbilder und die Wiederholung von „Weg“ bleiben erhalten; unnötig altertümliche Wortstellung wird vermieden.
