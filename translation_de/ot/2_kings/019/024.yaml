id: 2KI.19.24
reference: 2 Kings 19:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲנִ֣י קַ֔רְתִּי וְ/שָׁתִ֖יתִי מַ֣יִם זָרִ֑ים וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: de
  text: Ich selbst habe gegraben und fremde Wasser getrunken; mit meinen Fußsohlen trockne ich alle Wasserläufe Ägyptens aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Nilkanäle Mazors“. Das mit „Wasserläufe“ wiedergegebene hebräische Wort bezeichnet häufig Arme oder Kanäle des Nils; „Mazor“ ist hier wahrscheinlich ein poetischer Name für Ägypten.'
    reason: Bewahrt sowohl die speziellere Bedeutung von יְאֹרֵי als auch die Namensform und Mehrdeutigkeit von מָצוֹר.
lexical_decisions:
- source_word: אֲנִי
  choice: Ich selbst
  rationale: Das ausdrücklich gesetzte Pronomen hebt die selbstherrliche Behauptung des Sprechers hervor.
- source_word: קַרְתִּי
  choice: habe gegraben
  rationale: Das Verb bezeichnet hier das Graben nach Wasser, wohl das Anlegen von Brunnen; der knappe Wortlaut nennt einen Brunnen jedoch nicht ausdrücklich.
- source_word: מַיִם זָרִים
  choice: fremde Wasser
  rationale: Die ungewöhnliche, aber verständliche Formulierung bewahrt das Bild von Wasserquellen in eroberten fremden Gebieten, ohne diese Deutung in den Text einzufügen.
- source_word: וְאַחְרִב
  choice: trockne ich … aus
  rationale: Der Hifil-Stamm von חרב bedeutet bei Wasserläufen „austrocknen“. Das deutsche Präsens gibt den fortdauernden, prahlerischen Anspruch wieder; auch eine futurische Auffassung ist grammatisch möglich.
- source_word: בְּכַף פְּעָמַי
  choice: mit meinen Fußsohlen
  rationale: כף bezeichnet in Verbindung mit Füßen deren Sohle. Das konkrete Bild stellt das Austrocknen als mühelose Folge des Auftretens dar.
- source_word: יְאֹרֵי
  choice: Wasserläufe
  rationale: יְאֹר kann allgemein einen Wasserlauf, häufig aber speziell einen Nilarm oder Nilkanal bezeichnen. „Wasserläufe“ ist im Haupttext natürlich und lässt die genauere geografische Nuance für die Fußnote offen.
- source_word: מָצוֹר
  choice: Ägyptens
  rationale: In Verbindung mit יְאֹרֵי ist מָצוֹר am wahrscheinlichsten als poetische Bezeichnung für Ägypten zu verstehen; die Fußnote weist auf die Namensform und die verbleibende lexikalische Unsicherheit hin.
theological_decisions:
- issue: Bezug und rhetorische Wirkung der Ich-Rede
  choice: Die Aussage bleibt als unkommentierte, überhebliche Königsrede in der ersten Person stehen.
  alternative: Den assyrischen König im Vers ausdrücklich als Sprecher nennen oder die Aussage als bloße militärische Propaganda kennzeichnen.
  rationale: Der Zusammenhang identifiziert den Sprecher. Eine erklärende Erweiterung würde die unmittelbare Wucht der Selbstüberhebung abschwächen und Auslegung in den Haupttext eintragen.
- issue: Zeitwert von וְאַחְרִב
  choice: 'Prahlerisches Präsens: „trockne ich … aus“.'
  alternative: 'Futurisch: „werde ich … austrocknen“.'
  rationale: Die Präfixform kann hier futurisch verstanden werden, doch im Zusammenhang einer umfassenden Selbstdarstellung gibt das deutsche Präsens den allgemeinen Machtanspruch natürlich wieder, ohne ihn auf ein einzelnes zukünftiges Ereignis festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „fremde Wasser“ erhält das knappe poetische Bild; Satzbau und Verben bleiben zugleich für heutige Leser unmittelbar verständlich.
