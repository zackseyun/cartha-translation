source:
  edition: WLC
  text: וַ/יֵּלְכ֣וּ אַחֲרֵי/הֶם֮ עַד הַ/יַּרְדֵּן֒ וְ/הִנֵּ֣ה כָל הַ/דֶּ֗רֶךְ מְלֵאָ֤ה בְגָדִים֙ וְ/כֵלִ֔ים אֲשֶׁר הִשְׁלִ֥יכוּ אֲרָ֖ם ב/החפז/ם וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יַּגִּ֖דוּ לַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: de
  text: 'Da zogen sie ihnen bis an den Jordan nach. Und sieh da: Der ganze Weg war voller Kleider und Ausrüstungsgegenstände[a], die die Aramäer[b] in ihrer Eile weggeworfen hatten. Dann kehrten die Boten[c] zurück und berichteten dem König.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geräte“, „Gegenstände“ oder „Vorräte“. Das hebräische Wort ist eine weite Bezeichnung für Gegenstände und Gerätschaften.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Aram“. Der Ländername steht hier kollektiv für die Aramäer.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Kundschafter“. Das hebräische Wort bedeutet wörtlich „Boten“; gemeint sind hier die Männer, die zur Erkundung ausgesandt worden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: Da zogen sie ihnen … nach
  rationale: Die deutsche Nachstellung „ihnen nachziehen“ gibt sowohl die erzählerische Abfolge des Wayyiqtol als auch das Verfolgen beziehungsweise Folgen natürlich wieder.
- source_word: עַד הַיַּרְדֵּן
  choice: bis an den Jordan
  rationale: עַד bezeichnet die erreichte Grenze oder Ausdehnung; „bis an den Jordan“ ist im Deutschen idiomatisch und präzise.
- source_word: וְהִנֵּה
  choice: Und sieh da
  rationale: Die Wendung bewahrt die aufmerksamkeitslenkende und anschauliche Funktion von הִנֵּה, ohne altertümlich zu wirken.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: Auf dem ganzen Weg lagen überall
  rationale: Die räumliche Aussage „der ganze Weg war voll“ wird in natürliches Deutsch übertragen, ohne ihren Umfang abzuschwächen.
- source_word: בְגָדִים
  choice: Kleider
  rationale: Das gebräuchliche deutsche Wort bezeichnet hier die zurückgelassenen Kleidungsstücke klar und würdig.
- source_word: וְכֵלִים
  choice: Ausrüstungsgegenstände
  rationale: כֵלִים ist ein weiter Begriff für Gegenstände, Geräte oder Ausrüstung. Im Zusammenhang mit einem fliehenden Heer ist „Ausrüstungsgegenstände“ treffend, ohne die Art der Dinge unnötig festzulegen.
- source_word: אֲשֶׁר הִשְׁלִיכוּ
  choice: welche … weggeworfen hatten
  rationale: Das Plusquamperfekt macht deutlich, dass das Wegwerfen der späteren Entdeckung vorausging; „wegwerfen“ gibt das Zurücklassen in der Flucht angemessen wieder.
- source_word: אֲרָם
  choice: die Aramäer
  rationale: Der Ländername „Aram“ steht im Hebräischen kollektiv für dessen Leute. Im Deutschen macht „die Aramäer“ den pluralischen Bezug von „ihrer“ verständlich; eine Fußnote dokumentiert die wörtliche Form.
- source_word: בְחָפְזָם
  choice: in ihrer Eile
  rationale: Die Form bezeichnet hastiges Handeln unter Druck. „In ihrer Eile“ ist direkt und vermeidet die stärkere Deutung „in Panik“.
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: Dann kehrten die Boten zurück
  rationale: מַלְאָכִים bedeutet grundsätzlich „Boten“. Der Kontext lässt auch „Kundschafter“ zu, doch „Boten“ bewahrt die lexikalische Offenheit.
- source_word: וַיַּגִּדוּ לַמֶּלֶךְ
  choice: und berichteten dem König
  rationale: „Berichten“ gibt hier das Übermitteln der Erkundungsergebnisse idiomatisch wieder.
