  - severity: low
    issue: „dem Königshaus melden“ kann im Deutschen primär die Königsfamilie oder Dynastie meinen.
    rationale: בֵּית הַמֶּלֶךְ bezeichnet hier das königliche Haus als Hof- beziehungsweise Palastinstitution. „dem königlichen Hof melden“ ist als Empfängerangabe klarer; die Fußnote bewahrt die weiteren möglichen Bezugsnuancen.
