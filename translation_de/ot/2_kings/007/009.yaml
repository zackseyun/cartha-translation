    issue: Die Formulierung „wird uns Schuld treffen“ ist im modernen Deutsch unidiomatisch und verwischt die Bildsprache von עָוֹן „finden/einholen“.
    rationale: Schuld kann jemanden belasten oder einholen, aber gewöhnlich nicht „treffen“. „Schuld wird uns einholen“ bleibt bildhaft und lässt, zusammen mit der Fußnote, sowohl Schuld als auch eine mögliche Folge offen.
  - severity: low
    issue: „Heute ist ein Tag guter Nachricht“ klingt im modernen Standarddeutsch ungewöhnlich.
