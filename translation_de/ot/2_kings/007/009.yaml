  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: de
  text: 'Dann sagten sie zueinander: „Was wir tun, ist nicht richtig. Heute ist ein Tag mit guten Nachrichten, und wir schweigen. Wenn wir bis zum Morgenlicht warten, wird uns Schuld einholen.[a] Darum kommt jetzt, lasst uns gehen und es dem königlichen Hof melden.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schuld/Frevel wird uns finden“; möglich ist auch: „Strafe wird uns treffen“ oder „wir werden Schuld auf uns laden“.'
    reason: lexical_alternative
  - marker: b
    text: „Der königliche Hof“ kann auch den Haushalt des Königs, das Königshaus oder den Königspalast bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: Was wir tun, ist nicht richtig
  rationale: 'Die idiomatische Wendung bedeutet wörtlich etwa: »Nicht so handeln wir.« Die gewählte Formulierung gibt die moralische Bewertung in natürlichem, modernem Deutsch wieder.'
- source_word: יוֹם בְּשֹׂרָה
  choice: ein Tag guter Nachricht
  rationale: בְּשֹׂרָה bezeichnet eine gute Nachricht, besonders die Nachricht von Sieg oder Rettung. Der singularische Ausdruck bleibt erhalten.
- source_word: מַחְשִׁים
  choice: wir schweigen
  rationale: Das Partizip im Hifil bezeichnet hier ein fortgesetztes beziehungsweise bewusstes Stillschweigen.
- source_word: וְחִכִּינוּ עַד א֥וֹר הַבֹּקֶר
  choice: Wenn wir bis zum Morgenlicht warten
  rationale: Die Verbform ist im Zusammenhang konditional zu verstehen. »Morgenlicht« bildet אוֹר הַבֹּקֶר anschaulich und knapp ab.
- source_word: וּמְצָאנוּ עָוֹן
  choice: wird uns Schuld treffen
  rationale: 'Wörtlich heißt es: »Schuld/Frevel wird uns finden.« »Schuld treffen« bewahrt das Bild und lässt offen, ob primär Schuldhaftigkeit oder die daraus folgende Strafe gemeint ist.'
- source_word: לְכוּ וְנָבֹאָה
  choice: kommt jetzt, lasst uns gehen
  rationale: Die Verbindung aus Imperativ und Kohortativ drückt eine dringende gemeinsame Aufforderung aus. »Gehen« ist hier natürlicher als das räumlich engere »hineingehen«.
- source_word: וְנַגִּידָה
  choice: und es … melden
  rationale: Das Hifil von נגד bedeutet mitteilen, berichten oder bekannt geben. »Melden« passt zu der dringenden Nachricht an eine königliche Stelle.
- source_word: בֵּית הַמֶּלֶךְ
  choice: dem Königshaus
  rationale: Der Ausdruck bedeutet wörtlich »Haus des Königs« und kann sowohl den königlichen Haushalt beziehungsweise Hof als auch den Palast bezeichnen. »Königshaus« bewahrt diese Breite weitgehend.
theological_decisions:
- issue: Bedeutung von עָוֹן im Zusammenhang
  choice: Schuld
  alternative: Strafe
  rationale: עָוֹן kann Schuld, Vergehen oder die daraus erwachsende Strafe bezeichnen. Im Haupttext steht die lexikalisch unmittelbare Bedeutung; die mögliche konsekutive Bedeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählsyntax. Die ungewöhnliche Wendung »Tag guter Nachricht« bewahrt die Bildhaftigkeit des Hebräischen; die Mehrdeutigkeit von עָוֹן und בֵּית הַמֶּלֶךְ wird nicht vorschnell aufgelöst.
