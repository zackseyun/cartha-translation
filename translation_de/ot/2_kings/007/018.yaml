base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: de
  text: 'Und es geschah, wie der Mann Gottes zum König gesagt hatte: „Zwei Sea Gerste werden für einen Schekel zu haben sein und ein Sea Feinmehl für einen Schekel[a] – morgen um diese Zeit am Tor von Samaria[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Sea war ein altes Hohlmaß für trockene Güter; ein Schekel war hier eine Gewichtseinheit für Silber.
    reason: cultural_note
  - marker: b
    text: Das Stadttor war ein öffentlicher Ort des Handels und der Rechtsprechung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Und es geschah genau so, wie … gesagt hatte
  rationale: Die Formulierung leitet die Erfüllung ein und bezeichnet die Übereinstimmung des Geschehens mit der zuvor ausgesprochenen Ankündigung. Das Plusquamperfekt macht den Rückbezug im Deutschen deutlich.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Der feste hebräische Titel wird unmittelbar wiedergegeben und nicht deutend durch „Prophet“ ersetzt.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der hebräische Zitateinleiter wird im natürlichen modernen Deutsch durch einen Doppelpunkt ausgedrückt.
- source_word: סָאתַיִם שְׂעֹרִים
  choice: zwei Sea Gerste
  rationale: Die Dualform und die historische Maßeinheit bleiben erhalten; „Gerste“ gibt die Getreideart präzise wieder.
- source_word: בְּשֶׁקֶל
  choice: für einen Schekel zu haben sein
  rationale: Die Präposition bezeichnet in dieser Preisangabe den Kaufpreis. Die deutsche Wendung macht die elliptische Aussage über die künftigen Marktpreise verständlich.
- source_word: וּסְאָה סֹלֶת
  choice: und ein Sea Feinmehl
  rationale: Der Singular wird gegenüber den zwei Sea ausdrücklich gewahrt; „Feinmehl“ erhält die Unterscheidung von gewöhnlichem Mehl.
- source_word: כָּעֵת מָחָר
  choice: morgen um diese Zeit
  rationale: Natürliche deutsche Wiedergabe der zeitlichen Wendung; das כ bezeichnet hier die entsprechende Zeit am folgenden Tag.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: am Tor von Samaria
  rationale: „Am Tor“ ist im Deutschen idiomatisch und bezeichnet den öffentlichen Handels- und Rechtsraum im Bereich des Stadttores.
