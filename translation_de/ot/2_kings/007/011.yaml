translation:
  language: de
  text: Da riefen die Torwächter und meldeten es ins Königshaus hinein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meldeten es dem königlichen Haushalt“. Wörtlich: „dem Haus des Königs nach innen“; die Formulierung kann das Innere der königlichen Residenz oder den königlichen Haushalt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: riefen … aus
  rationale: Das Verb קרא steht hier formal im Singular vor dem pluralischen Subjekt, das im Deutschen natürlich im Plural wiedergegeben wird. „Ausrufen“ vermittelt die hörbare Weitergabe der Nachricht.
- source_word: הַשֹּׁעֲרִים
  choice: die Torwächter
  rationale: שֹׁעֲרִים bezeichnet die am Tor eingesetzten Wächter; „Torwächter“ ist direkt, gegenwärtig und verständlich.
- source_word: וַיַּגִּידוּ
  choice: meldeten es
  rationale: נגד bezeichnet hier das Bekanntmachen beziehungsweise Weitermelden einer Nachricht. Das im Hebräischen unausgesprochene Objekt wird aus dem Zusammenhang mit „es“ ergänzt.
- source_word: בֵּית הַמֶּלֶךְ
  choice: im Haus des Königs
  rationale: Die Wiedergabe bewahrt den hebräischen Ausdruck „Haus des Königs“, ohne ihn eindeutig als Palastgebäude oder königlichen Haushalt festzulegen.
- source_word: פְּנִימָה
  choice: drinnen
  rationale: Das Richtungsadverb bezeichnet die Weitergabe nach innen. „Drinnen“ ist idiomatisch und lässt offen, ob der räumliche Innenbereich oder die Menschen im königlichen Haus gemeint sind.
theological_decisions: []
