  source_fidelity: 'Die Grundwiedergabe trifft die Abfolge und die wesentlichen Begriffe: Die Torwächter rufen aus und machen die Nachricht bekannt. Die Formulierung „drinnen im Haus des Königs“ verschiebt jedoch die Richtungsangabe פְּנִימָה zu einer bloßen Ortsangabe und kann nahelegen, die Torwächter hätten sich bereits dort befunden.'
