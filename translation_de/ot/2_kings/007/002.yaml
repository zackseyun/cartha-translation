base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: de
  text: 'Da entgegnete der Offizier, auf dessen Arm sich der König stützte, dem Mann Gottes: „Sieh doch: Selbst wenn Jahwe Fenster am Himmel machte – könnte so etwas geschehen?“ Der Mann Gottes erwiderte: „Sieh, du wirst es mit eigenen Augen sehen, aber nichts davon essen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: der Offizier
  rationale: Das Wort bezeichnet hier einen hochrangigen militärischen oder königlichen Amtsträger; „Offizier“ ist verständlich, ohne einen nicht eindeutig bestimmbaren Rang festzulegen.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: auf dessen Arm sich der König stützte
  rationale: Die anschauliche Wendung wird in natürlichem Deutsch bewahrt; „Arm“ passt hier idiomatisch besser als das wörtliche „Hand“.
- source_word: אִישׁ הָאֱלֹהִים
  choice: dem Mann Gottes
  rationale: Der feste hebräische Prophetentitel bleibt transparent und wird nicht erläuternd zu „Prophet“ umgedeutet.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die aufmerksamkeitslenkende Partikel trägt hier zum spöttisch-ungläubigen Ton des Offiziers bei.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: Fenster am Himmel machte
  rationale: Die konkrete Metapher der himmlischen Öffnungen bleibt erhalten; „Schleusen öffnete“ wäre eine stärker deutende, wenn auch geläufige Wiedergabe.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: könnte so etwas geschehen?
  rationale: Die Frage drückt skeptischen Zweifel an der Möglichkeit der angekündigten Wendung aus.
- source_word: הִנְּכָה רֹאֶה בְּעֵינֶיךָ
  choice: Du wirst es mit eigenen Augen sehen
  rationale: Die emphatische direkte Anrede und das hebräische Sehen mit den Augen werden in einer natürlichen deutschen Wendung wiedergegeben.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: aber nichts davon essen
  rationale: מִשָּׁם verweist im Zusammenhang auf die angekündigte Versorgung; „nichts davon“ bringt den Ausschluss vom Anteilhaben idiomatisch zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. „Jahwe“ bewahrt diesen als Namen, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Charakter der Erwiderung des Offiziers
  choice: skeptische Bedingung mit „Selbst wenn …“
  alternative: neutrale Bedingung mit „Wenn …“
  rationale: Der Zusammenhang und die rhetorische Frage zeigen offenkundigen Unglauben. „Selbst wenn“ macht diesen Ton verständlich, ohne die bildhafte Aussage sachlich aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt pointiert und kontrastiert den Spott des königlichen Offiziers mit der knappen Gerichtsankündigung des Mannes Gottes. Keine Fußnoten erforderlich.
