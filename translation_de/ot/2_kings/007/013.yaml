revisions:
- from: 'Da antwortete einer seiner Diener: »Man soll doch fünf von den Pferden nehmen, die noch übrig sind, die in ihr[a] übrig geblieben sind. Siehe, sie sind wie die ganze Menge Israels, die in ihr übrig geblieben ist; siehe, sie sind wie die ganze Menge Israels, die umgekommen ist.[b] Dann wollen wir sie aussenden und sehen.«'
  to: 'Da antwortete einer seiner Diener: »Man nehme doch fünf von den Pferden, die noch übrig sind, die in ihr[a] übrig geblieben sind. Siehe, sie sind wie die ganze Menge Israels, die in ihr übrig geblieben ist; siehe, sie sind wie die ganze Menge Israels, die umgekommen ist.[b] Dann wollen wir aussenden und sehen.«'
  rationale: Die Revision ersetzt die im Deutschen zu stark verpflichtend klingende Umschreibung »Man soll doch« durch den vorschlagenden Jussiv »Man nehme doch«. Außerdem wird das am Versende im Hebräischen nicht explizierte Objekt nicht ergänzt. Der schwierige Vergleich, die Wiederholung von »übrig« und der nicht näher bestimmte Bezug von »ihr« bleiben erhalten; die bestehenden Fußnoten sind weiterhin korrekt verankert und ausreichend.
