  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wiederholung und der schwer verständliche Vergleich des hebräischen Textes bleiben bewusst sichtbar; nicht ausdrücklich genannte Personen oder die Stadt Samaria werden im Haupttext nicht ergänzt.
