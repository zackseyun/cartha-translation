base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: de
  text: 'Da antwortete einer seiner Diener: »Man nehme doch fünf von den Pferden, die noch übrig sind, die in ihr[a] übrig geblieben sind. Siehe, sie sind wie die ganze Menge Israels, die in ihr übrig geblieben ist; siehe, sie sind wie die ganze Menge Israels, die umgekommen ist.[b] Dann wollen wir aussenden und sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das feminine Pronomen »ihr« bezieht sich wahrscheinlich auf die Stadt Samaria; das Wort »Stadt« wird in diesem Vers jedoch nicht wiederholt.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut enthält einen schwierigen, wiederholten Vergleich: »Sie sind wie die ganze Menge Israels, die in ihr übrig geblieben ist … wie die ganze Menge Israels, die umgekommen ist.« Die Übersetzung bewahrt diese Wiederholung, statt sie erklärend zu glätten.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: Da antwortete einer seiner Diener
  rationale: Die übliche hebräische Redeeinleitung wird in natürlichem deutschem Erzählstil wiedergegeben; »Diener« lässt den genauen Status am Königshof offen.
- source_word: וְיִקְחוּ נָא
  choice: Man soll doch … nehmen
  rationale: Die unbestimmte dritte Person und die höflich-auffordernde Partikel נָא werden durch »man soll doch« wiedergegeben, ohne ausdrücklich handelnde Personen hinzuzufügen.
- source_word: חֲמִשָּׁה מִן הַסּוּסִים
  choice: fünf von den Pferden
  rationale: Gibt das partitive מִן direkt und idiomatisch wieder.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: die noch übrig sind, die in ihr übrig geblieben sind
  rationale: Die auffällige Wiederholung der Wurzel שׁאר bleibt erhalten; das feminine Pronomen wird nicht stillschweigend durch »Stadt« ersetzt.
- source_word: הִנָּם
  choice: Siehe, sie sind
  rationale: »Siehe« bewahrt den hervorhebenden, gehobenen Ton der zweimal gesetzten deiktischen Form; »sie sind« lässt den schwierigen Bezug und Vergleich bestehen.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: wie die ganze Menge Israels
  rationale: »Menge« gibt den kollektiven Sinn von הָמוֹן verständlich wieder, während die Vergleichsform mit כְּ erhalten bleibt.
- source_word: אֲשֶׁר תָּמּוּ
  choice: die umgekommen ist
  rationale: Im Zusammenhang von Belagerung und Hungersnot bezeichnet תּמם hier das Zugrundegehen; die deutsche Einzahl folgt dem Kollektiv »Menge«.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: Dann wollen wir sie aussenden und sehen
  rationale: Die beiden Kohortative werden als gemeinsamer Vorschlag wiedergegeben. Das Objekt von »aussenden« bleibt entsprechend dem Hebräischen nur aus dem Zusammenhang erschließbar.
