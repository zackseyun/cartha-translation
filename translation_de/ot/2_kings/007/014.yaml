base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/014.yaml
  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: de
  text: 'Da nahmen sie zwei Streitwagen mit Pferden[a], und der König sandte sie dem Heerlager Arams hinterher und sagte: »Geht und seht nach!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwei Streitwagen von Pferden«; die knappe hebräische Wendung meint wahrscheinlich zwei von Pferden gezogene Streitwagen oder zwei Streitwagengespanne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Da nahmen sie
  rationale: Das Wayyiqtol führt die Erzählung weiter; »Da« gibt die folgerichtige narrative Abfolge im Deutschen natürlich wieder.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: zwei Streitwagen mit Pferden
  rationale: Die hebräische Wendung ist knapp und elliptisch. Die Wiedergabe wahrt das konkrete Bild, ohne sich auf die stärker deutende Bedeutung »zwei Gespanne« festzulegen.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: und der König sandte sie
  rationale: Das im Hebräischen nicht ausdrücklich genannte Objekt wird aus dem unmittelbaren Zusammenhang ergänzt; gemeint sind die mit den Wagen ausgesandten Kundschafter.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: hinter dem Heerlager Arams her
  rationale: אַחֲרֵי bezeichnet hier die Richtung beziehungsweise das Folgen hinter dem abgezogenen Lager; »Heerlager« macht den militärischen Zusammenhang deutlich.
- source_word: אֲרָם
  choice: Aram
  rationale: Der historische Eigenname wird beibehalten; »Syrien« könnte eine spätere geografische Vorstellung eintragen.
- source_word: לֵאמֹר
  choice: Er sagte
  rationale: Die hebräische Redeeinleitung wird in natürlichem deutschem Erzählstil als eigener Satz wiedergegeben.
- source_word: לְכוּ וּרְאוּ
  choice: Geht und seht nach!
  rationale: Die beiden Imperative bleiben knapp und direkt; »nachsehen« entspricht im Kontext dem Auftrag, die Lage zu erkunden.
