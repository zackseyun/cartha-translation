  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: de
  text: Da zog das Volk hinaus und plünderte das Lager Arams.[a] Ein Sea Feinmehl kostete nun einen Schekel und zwei Sea Gerste einen Schekel,[b] nach dem Wort Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das aramäische Lager“.'
    reason: lexical_alternative
  - marker: b
    text: Ein Sea war ein altes Trockenmaß.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: Da zog das Volk hinaus
  rationale: Die Erzählfolge des Waw-Konsekutivs wird mit „Da“ natürlich wiedergegeben; „zog … hinaus“ passt zum Aufbruch aus der Stadt.
- source_word: וַיָּבֹזּוּ
  choice: plünderte
  rationale: בזז bezeichnet das Erbeuten von Besitz aus einem feindlichen Lager; „plündern“ bewahrt den militärischen Sinn.
- source_word: מַחֲנֵה אֲרָם
  choice: das Lager Arams
  rationale: Die hebräische Genitivverbindung wird eng am Ausgangstext wiedergegeben; „Aram“ bleibt als historischer Eigenname erhalten.
- source_word: וַיְהִי ... בְּשֶׁקֶל
  choice: kostete nun … einen Schekel
  rationale: In der Preisangabe bezeichnet וַיְהִי das Eintreten des angekündigten Marktpreises. „Nun“ macht den erzählerischen Ergebnischarakter deutlich, ohne zusätzliche Ursache einzutragen.
- source_word: סְאָה / סָאתַיִם
  choice: ein Sea / zwei Sea
  rationale: Die konkrete antike Maßeinheit bleibt erhalten; der Dual סָאתַיִם wird ausdrücklich als „zwei Sea“ wiedergegeben.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת bezeichnet feines beziehungsweise hochwertig ausgesiebtes Mehl; „Feinmehl“ ist knapp und präzise.
- source_word: שְׂעֹרִים
  choice: Gerste
  rationale: Die pluralische hebräische Warenbezeichnung wird im Deutschen idiomatisch als Stoffname „Gerste“ wiedergegeben.
- source_word: כִּדְבַר יְהוָה
  choice: wie es dem Wort Jahwes entsprach
  rationale: Die Wendung bezeichnet die Übereinstimmung des Geschehens mit der zuvor ergangenen göttlichen Ankündigung und wahrt zugleich das Substantiv דְבַר.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Erfüllungsformel כִּדְבַר יְהוָה
  choice: wie es dem Wort Jahwes entsprach
  alternative: wie Jahwe gesagt hatte
  rationale: Die gewählte Fassung hält die Formulierung mit „Wort“ fest und kennzeichnet die Erfüllung, ohne die Aussage stärker zu paraphrasieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die antiken Bezeichnungen „Sea“ und „Schekel“ bleiben stehen; die weniger geläufige Maßeinheit Sea wird erläutert. Die in der englischen Vorlage offenbar vertauschten Fußnotenbezüge wurden entsprechend ihrem Inhalt richtig zugeordnet.
