id: 2KI.7.5
reference: 2 Kings 7:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: de
  text: Da machten sie sich in der Abenddämmerung auf, um zum Lager der Aramäer zu gehen. Als sie an den Rand des Lagers der Aramäer kamen, siehe, da war niemand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da machten sie sich … auf
  rationale: Das Wayyiqtol führt die Erzählung weiter; die idiomatische deutsche Wendung gibt hier sowohl das Aufstehen als auch den Aufbruch wieder.
- source_word: בַנֶּשֶׁף
  choice: in der Abenddämmerung
  rationale: נֶשֶׁף kann Dämmerung bezeichnen; im Kontext des Aufbruchs zum feindlichen Lager ist die Abenddämmerung gemeint.
- source_word: לָבוֹא אֶל
  choice: um … zu gehen
  rationale: Der Infinitiv bezeichnet den Zweck des Aufbruchs. Deutsch verwendet bei der Bewegung zu einem entfernten Ziel natürlich „gehen“.
- source_word: מַחֲנֵה אֲרָם
  choice: Lager der Aramäer
  rationale: אֲרָם bezeichnet hier im politischen und militärischen Zusammenhang die Aramäer; diese Form ist im Deutschen natürlicher als „Lager Arams“.
- source_word: עַד קְצֵה
  choice: an den Rand
  rationale: Die Wendung bezeichnet das Erreichen der äußeren Grenze des Lagers.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: „Siehe“ bewahrt das Aufmerksamkeitssignal und hebt die überraschende Entdeckung hervor.
- source_word: אֵין שָׁם אִישׁ
  choice: da war niemand
  rationale: Obwohl אִישׁ formal maskulin Singular ist, bedeutet die negierte Existenzformel idiomatisch, dass überhaupt keine Person anwesend war. „Niemand“ gibt dies im Deutschen präzise und natürlich wieder.
theological_decisions:
- issue: Generische Bedeutung des maskulinen Singulars אִישׁ in einer negierten Existenzformel
  choice: da war niemand
  alternative: da war kein Mann
  rationale: Im Kontext verneint אֵין שָׁם אִישׁ die Anwesenheit irgendeines Menschen, nicht nur männlicher Personen. „Niemand“ wahrt den gemeinten Umfang, ohne eine unbeabsichtigte geschlechtliche Einschränkung einzuführen.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Da machten sie sich auf“ bildet den narrativen Fortgang natürlich ab; „siehe“ erhält bewusst den markierten Überraschungseffekt des Hebräischen.
