  text: וְ/הַ/מֶּלֶךְ֩ הִפְקִ֨יד אֶת הַ/שָּׁלִ֜ישׁ אֲשֶׁר נִשְׁעָ֤ן עַל יָד/וֹ֙ עַל הַ/שַּׁ֔עַר וַ/יִּרְמְסֻ֧/הוּ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/רֶ֥דֶת הַ/מֶּ֖לֶךְ אֵלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: de
  text: Der König hatte den Offizier[a], auf dessen Hand er sich stützte, mit der Aufsicht über das Tor beauftragt. Doch das Volk zertrat ihn im Tor, und er starb, genau wie der Mann Gottes gesagt hatte, als der König zu ihm herabkam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Hauptmann« beziehungsweise »den königlichen Adjutanten«. Das hebräische Wort bezeichnet einen hochrangigen Offizier im engen Umfeld des Königs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִפְקִיד ... עַל הַשַּׁעַר
  choice: hatte ... mit der Aufsicht über das Tor beauftragt
  rationale: Das Hifil von פקד bezeichnet hier die Übertragung von Verantwortung; עַל kennzeichnet den Zuständigkeitsbereich. Das Plusquamperfekt macht den narrativen Rückbezug natürlich deutlich.
- source_word: הַשָּׁלִישׁ
  choice: den Offizier
  rationale: שָׁלִישׁ bezeichnet hier einen hochrangigen, dem König nahestehenden Amts- oder Militärangehörigen. »Offizier« vermeidet eine nicht sicher bestimmbare konkrete Rangbezeichnung.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: auf dessen Hand er sich stützte
  rationale: Die hebräische Körpermetapher mit יָד (Hand) bleibt erhalten; zugleich identifiziert die Wendung den engen königlichen Begleiter.
- source_word: וַיִּרְמְסֻהוּ הָעָם בַּשַּׁעַר
  choice: Doch das Volk zertrat ihn im Tor
  rationale: רמס bedeutet zertreten oder niedertrampeln. »Das Volk« entspricht הָעָם; »im Tor« bewahrt die räumliche Wiederholung von הַשַּׁעַר.
- source_word: וַיָּמֹת
  choice: sodass er starb
  rationale: Die koordinierte hebräische Folge wird im Deutschen als natürliche Konsequenz wiedergegeben, ohne eine über den Zusammenhang hinausgehende Ursache einzuführen.
- source_word: כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים
  choice: genau wie der Mann Gottes es vorausgesagt hatte
  rationale: Die Formulierung hebt die Erfüllung des zuvor gesprochenen Gotteswortes hervor. »Mann Gottes« bewahrt den feststehenden hebräischen Titel.
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: als der König zu ihm herabkam
  rationale: ב mit dem Infinitiv constructus bezeichnet den Zeitpunkt. »Herabkam« erhält die im Verb ירד ausgedrückte Abwärtsbewegung.
theological_decisions:
- issue: Prophetische Erfüllungsformel
  choice: »genau wie der Mann Gottes es vorausgesagt hatte« stellt den Tod als Erfüllung des früher gesprochenen Wortes dar.
  alternative: »wie der Mann Gottes gesagt hatte« wäre formaler und ließe den Zukunftsbezug nur aus dem Kontext hervorgehen.
  rationale: כַּאֲשֶׁר דִּבֶּר verknüpft das Ereignis ausdrücklich mit der früheren Ankündigung. »Vorausgesagt« macht diesen im Kontext eindeutigen Bezug verständlich, ohne weitere theologische Aussagen hinzuzufügen.
- issue: Bezug des Relativsatzes אֲשֶׁר דִּבֶּר
  choice: 'Der Satz wird auf das vorausgesagte Geschehen bezogen: Der Mann Gottes sprach es, als der König zu ihm herabkam.'
  alternative: Formal könnte die Wiederholung als »wie der Mann Gottes gesprochen hatte, der gesprochen hatte, als ...« nachgebildet werden.
  rationale: Die natürliche deutsche Fassung vermeidet die schwerfällige Wiederholung von דִּבֶּר, bewahrt aber sowohl den Erfüllungsbezug als auch den genannten Zeitpunkt der Rede.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die ungewöhnliche Wendung »auf dessen Hand er sich stützte« bleibt als bewusstes hebräisches Bild im Haupttext erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Amtsbezeichnung.
