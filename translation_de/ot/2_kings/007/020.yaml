id: 2KI.7.20
reference: 2 Kings 7:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִי ל֖/וֹ כֵּ֑ן וַ/יִּרְמְס֨וּ אֹת֥/וֹ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/020.yaml
  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: de
  text: 'Und genau so erging es ihm: Das Volk zertrat ihn im Tor[a], und er starb.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Tor“ oder „im Torbereich“. Das hebräische Wort kann das Stadttor oder die gesamte Toranlage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: Und genau so erging es ihm
  rationale: Die idiomatische Verbindung von היה, לֹו und כֵּן besagt, dass es für ihn genau so eintraf, wie zuvor angekündigt. Die Formulierung ist natürliches Deutsch und bewahrt den Erfüllungscharakter, ohne ihn theologisch auszudeuten.
- source_word: וַיִּרְמְסוּ
  choice: zertrat
  rationale: רמס bezeichnet das Treten beziehungsweise Zertreten unter den Füßen. „Zertrat“ gibt hier sowohl die Handlung als auch deren tödliche Wucht knapp und idiomatisch wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם bedeutet gewöhnlich „Volk“. Obwohl im Zusammenhang eine drängende Menschenmenge gemeint ist, bleibt „das Volk“ näher an der hebräischen Bezeichnung.
- source_word: בַּשַּׁעַר
  choice: im Tor
  rationale: שַׁעַר kann das Stadttor samt Toranlage bezeichnen. „Im Tor“ folgt der Präposition und lässt die genaue räumliche Ausdehnung offen.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: Die einfache narrative Verbform wird direkt wiedergegeben. Der ursächliche Zusammenhang mit dem Zertreten ergibt sich aus dem Satz, ohne dass „sodass“ ergänzt werden muss.
theological_decisions:
- issue: Formulierung der Erfüllung des angekündigten Gerichts
  choice: Die Wendung „genau so erging es ihm“ zeigt, dass sein Schicksal wie zuvor angekündigt eintrat, ohne im Haupttext eine ausdrückliche theologische Deutung hinzuzufügen.
  alternative: „So kam das Gericht über ihn“ würde das Geschehen ausdrücklich als göttliches Gericht auslegen.
  rationale: Der Zusammenhang kennzeichnet das Ereignis als Erfüllung des prophetischen Wortes; der Vers selbst berichtet es jedoch in narrativer Form. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe narrative Satzstruktur des Hebräischen bleibt erhalten; „genau so“ verdeutlicht idiomatisch den Rückbezug auf die vorherige Ankündigung.
