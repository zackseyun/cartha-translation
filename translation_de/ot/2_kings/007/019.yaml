base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: de
  text: 'Da entgegnete der Offizier dem Mann Gottes: „Wenn Jahwe Fenster am Himmel machte[a], könnte so etwas geschehen?“ Er aber sagte: „Du wirst es mit eigenen Augen sehen, doch davon wirst du nicht essen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schleusen am Himmel“. Das hebräische Wort bedeutet wörtlich „Fenster“ oder „Öffnungen“ und kann das Bild himmlischer Schleusen aufrufen, durch die Segen oder Gericht kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: der Offizier
  rationale: Das Wort bezeichnet hier einen hochrangigen militärischen oder königlichen Amtsträger. „Offizier“ ist im modernen Deutschen verständlich, ohne einen nicht eindeutig bestimmten Rang festzulegen.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feststehende prophetische Ehrenbezeichnung wird nah am Hebräischen und in vertrauter deutscher Form wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: Fenster am Himmel machte
  rationale: „Fenster“ bewahrt das konkrete Bild von אֲרֻבּוֹת. „Am Himmel“ klingt im Deutschen natürlicher als „in den Himmeln“, ohne das Bild auf eine bestimmte Art himmlischer Öffnungen einzuengen.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: könnte so etwas geschehen?
  rationale: Die Formulierung gibt die skeptische rhetorische Frage idiomatisch wieder.
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: Du wirst es mit eigenen Augen sehen
  rationale: Das Partizip hat im Zusammenhang voraussagende Kraft; „mit eigenen Augen“ erhält die emphatische Aussage.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: doch davon wirst du nicht essen
  rationale: Das wörtliche „von dort“ verweist auf die angekündigte Versorgung. „Davon“ stellt diesen Bezug im Deutschen klar und natürlich her.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext verwendet das Tetragramm als Gottesnamen. „Jahwe“ bewahrt den Eigenamen, statt ihn durch einen Titel zu ersetzen.
- issue: Irrealer beziehungsweise hypothetischer Sinn der Aussage über die Himmelsfenster
  choice: Selbst wenn Jahwe Fenster am Himmel machte
  alternative: Wenn Jahwe Fenster am Himmel macht
  rationale: Der Offizier weist die angekündigte Erfüllung skeptisch als selbst unter einer außergewöhnlichen Voraussetzung kaum möglich zurück. „Selbst wenn“ bringt diese im Kontext erkennbare concessive Spitze im Deutschen klar zum Ausdruck, ohne festzulegen, ob er Gottes Macht grundsätzlich leugnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; traditionelle, heute aber schwer verständliche Rangbezeichnungen und altertümliche Signalwörter werden vermieden.
