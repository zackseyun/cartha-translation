source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: de
  text: 'Denn der Herr hatte das Heerlager der Aramäer den Lärm von Streitwagen, den Lärm von Pferden und den Lärm eines großen Heeres hören lassen. Da sagten sie zueinander: »Seht! Der König von Israel hat die Könige der Hethiter und die Könige Ägyptens gegen uns angeworben, damit sie gegen uns ziehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי
  choice: der Herr
  rationale: אֲדֹנָי ist hier der göttliche Titel und bezeichnet Israels Gott. „Der Herr“ gibt den Titel wieder, ohne ihn mit dem Gottesnamen JHWH gleichzusetzen.
- source_word: הִשְׁמִיעַ
  choice: hatte … hören lassen
  rationale: Der Hifil von שׁמע ist kausativ. Das Plusquamperfekt kennzeichnet den Satz als nachgereichte Erklärung für die Flucht der Aramäer.
- source_word: מַחֲנֵה אֲרָם
  choice: das Heerlager der Aramäer
  rationale: „Heerlager“ passt zum militärischen Zusammenhang; „der Aramäer“ bezeichnet natürlich die im Lager befindliche Streitmacht und vermeidet die moderne geopolitische Bezeichnung „Syrien“.
- source_word: קוֹל רֶכֶב … קוֹל סוּס … קוֹל חַיִל גָּדוֹל
  choice: den Lärm von Streitwagen, den Lärm von Pferden und den Lärm eines großen Heeres
  rationale: „Lärm“ vermittelt die bedrohliche akustische Wahrnehmung. Die dreifache Wiederholung wird wie im Hebräischen bewahrt; סוּס wird kollektiv als „Pferde“ und חַיִל im Kontext als „Heer“ verstanden.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Da sagten sie zueinander
  rationale: Die wörtliche Wendung „ein Mann zu seinem Bruder“ ist eine reziproke hebräische Ausdrucksweise; „zueinander“ gibt ihren Sinn in natürlichem Deutsch wieder.
- source_word: הִנֵּה
  choice: Seht!
  rationale: Der Ausruf lenkt nachdrücklich die Aufmerksamkeit auf die vermeintliche Erklärung der Geräusche. „Seht!“ ist gegenwärtig und würdevoll, ohne das altertümliche „Siehe“ zu benötigen.
- source_word: שָׂכַר עָלֵינוּ
  choice: hat … angeworben
  rationale: שׂכר bedeutet „mieten/anwerben“. Der feindliche Bezug von עָלֵינוּ wird zusammen mit לָבוֹא עָלֵינוּ in „damit sie gegen uns ziehen“ natürlich ausgedrückt, ohne ein nicht genanntes Objekt wie „Söldner“ einzufügen.
- source_word: מַלְכֵי הַחִתִּים וְאֶת־מַלְכֵי מִצְרַיִם
  choice: die Könige der Hetiter und die Könige Ägyptens
  rationale: Beide im Hebräischen stehenden Pluralformen werden beibehalten, auch wenn besonders „die Könige Ägyptens“ historisch oder sachlich unerwartet wirken kann.
- source_word: לָבוֹא עָלֵינוּ
  choice: damit sie gegen uns ziehen
  rationale: Die finale Konstruktion und die feindliche Bewegung werden klar wiedergegeben. „Gegen uns ziehen“ wahrt das militärische Bild, ohne das allgemeinere Verb בוא übermäßig als „angreifen“ festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: der Herr
  alternative: der Gebieter
  rationale: Im Erzählzusammenhang ist Israels Gott gemeint. „Der Herr“ ist die etablierte deutsche Wiedergabe des göttlichen Titels; sie wahrt zugleich den Unterschied zum an dieser Stelle nicht geschriebenen Tetragramm.
- issue: Göttliche Verursachung der Wahrnehmung
  choice: hatte … hören lassen
  alternative: hatte … hören lassen können / sie hörten
  rationale: Die kausative Verbform schreibt das Geschehen ausdrücklich dem Herrn zu. Die Übersetzung schwächt diese Aussage nicht zu bloßer Zulassung oder selbstständiger Wahrnehmung ab, legt aber nicht fest, auf welche Weise der Lärm hervorgerufen wurde.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die markante dreifache Wiederholung von „den Lärm von“ bleibt als rhetorisches Merkmal des hebräischen Textes erhalten. Die direkte Rede ist lebendig, ohne umgangssprachlich zu werden.
