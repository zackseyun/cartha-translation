source:
  edition: WLC
  text: וַ/יָּקוּמוּ֮ וַ/יָּנ֣וּסוּ בַ/נֶּשֶׁף֒ וַ/יַּעַזְב֣וּ אֶת אָהֳלֵי/הֶ֗ם וְ/אֶת סֽוּסֵי/הֶם֙ וְ/אֶת חֲמֹ֣רֵי/הֶ֔ם הַֽ/מַּחֲנֶ֖ה כַּ/אֲשֶׁר הִ֑יא וַ/יָּנֻ֖סוּ אֶל נַפְשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: de
  text: Da standen sie auf und flohen in der Dämmerung[a]. Sie ließen ihre Zelte, ihre Pferde und ihre Esel zurück – das Lager, wie es war[b] – und flohen um ihr Leben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei Einbruch der Dunkelheit“; wörtlich allgemeiner: „in der Dämmerung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Lager, wie es war“, also in seinem bisherigen Zustand.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „sie flohen zu ihrem Leben“; eine Wendung für die Flucht zur Rettung des eigenen Lebens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: in der Dämmerung
  rationale: נֶשֶׁף bezeichnet die Dämmerung beziehungsweise das Zwielicht. Die deutsche Wiedergabe bewahrt die mögliche Unbestimmtheit zwischen Abend- und Morgendämmerung, auch wenn der Erzählzusammenhang auf den Abend weist.
- source_word: וַיַּעַזְבוּ
  choice: sie ließen … zurück
  rationale: עזב bedeutet hier, etwas bei der hastigen Flucht zurückzulassen oder aufzugeben. „zurücklassen“ ist im Deutschen natürlich und bringt die Situation klar zum Ausdruck.
- source_word: אָהֳלֵיהֶם
  choice: ihre Zelte
  rationale: Direkte und im Zusammenhang eines Heerlagers natürliche Entsprechung.
- source_word: סוּסֵיהֶם
  choice: ihre Pferde
  rationale: Direkte lexikalische Entsprechung.
- source_word: חֲמֹרֵיהֶם
  choice: ihre Esel
  rationale: Direkte, gegenwärtig übliche Bezeichnung der genannten Lasttiere.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: das Lager, wie es war
  rationale: Die formal nahe Wiedergabe betont, dass das Lager in seinem bisherigen Zustand zurückblieb, ohne deutend „unversehrt“ oder „unangetastet“ einzusetzen.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: flohen um ihr Leben
  rationale: Die hebräische Wendung bezeichnet eine Flucht zur Rettung des eigenen Lebens. „um ihr Leben fliehen“ ist die entsprechende natürliche deutsche Redewendung.
- source_word: וַיָּקוּמוּ
  choice: da standen sie auf
  rationale: קום eröffnet hier die unverzügliche Handlung. „Da standen sie auf“ wahrt die erzählerische Abfolge in natürlichem Deutsch.
- source_word: וַיָּנֻסוּ … וַיָּנֻסוּ
  choice: flohen … flohen
  rationale: Die Wiederholung desselben hebräischen Verbs wird bewahrt und unterstreicht die überstürzte Flucht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „flohen … flohen“ bildet die Dringlichkeit und Wiederholung des Hebräischen ab. Gedankenstriche heben die nachgetragene Feststellung über den unveränderten Zustand des Lagers hervor.
