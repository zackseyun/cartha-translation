  text: וַ/יָּבֹ֗אוּ וַֽ/יִּקְרְאוּ֮ אֶל שֹׁעֵ֣ר הָ/עִיר֒ וַ/יַּגִּ֤ידוּ לָ/הֶם֙ לֵ/אמֹ֔ר בָּ֚אנוּ אֶל מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֛ם אִ֖ישׁ וְ/ק֣וֹל אָדָ֑ם כִּ֣י אִם הַ/סּ֤וּס אָסוּר֙ וְ/הַ/חֲמ֣וֹר אָס֔וּר וְ/אֹהָלִ֖ים כַּ/אֲשֶׁר הֵֽמָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: de
  text: 'Da gingen sie hin und riefen den Torwächtern der Stadt zu. Sie berichteten ihnen: »Wir sind zum Lager der Aramäer gekommen. Doch dort war niemand, und kein menschlicher Laut war zu hören[a]. Nur die Pferde und die Esel waren angebunden, und die Zelte standen unverändert da.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »keine menschliche Stimme«. Das hebräische Wort kann eine Stimme oder allgemeiner einen hörbaren Laut bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: den Torwächtern der Stadt
  rationale: Das Substantiv steht formal im Singular, wird aber durch die pluralischen Bezüge im Satz kollektiv verstanden. Der Plural ist im modernen Deutsch natürlich und kontextgerecht.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: Sie berichteten ihnen
  rationale: Die Hifil-Form von נגד bezeichnet hier das Übermitteln einer Nachricht. Die deutsche direkte Rede macht eine zusätzliche Wiedergabe von לֵאמֹר als »folgendermaßen« unnötig.
- source_word: מַחֲנֵה אֲרָם
  choice: zum Lager der Aramäer
  rationale: Aram wird als historischer Eigenname bewahrt; die Bewohner bzw. das Heer werden im Deutschen idiomatisch als Aramäer bezeichnet, statt mit dem späteren Namen »Syrer« gleichgesetzt zu werden.
- source_word: וְהִנֵּה
  choice: Doch
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die überraschend vorgefundene Lage. »Doch« gibt hier den narrativen Überraschungs- und Gegensatzwert natürlich wieder, ohne das altertümliche »siehe«.
- source_word: אֵין שָׁם אִישׁ
  choice: dort war niemand
  rationale: אִישׁ bezeichnet in diesem Zusammenhang allgemein eine Person, nicht ausdrücklich einen Mann.
- source_word: וְקוֹל אָדָם
  choice: kein menschlicher Laut war zu hören
  rationale: קוֹל kann sowohl »Stimme« als auch allgemeiner »Laut/Geräusch« bedeuten. Die Übersetzung bewahrt die breitere Bedeutung und gibt אָדָם generisch wieder.
- source_word: כִּי אִם
  choice: Nur
  rationale: Die Wendung führt die einzigen Ausnahmen von der zuvor beschriebenen völligen Abwesenheit ein.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: die Pferde und die Esel standen angebunden da
  rationale: Die singularischen Tierbezeichnungen sind kollektiv zu verstehen. אָסוּר bedeutet hier, dass die Tiere festgebunden zurückgelassen worden waren.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: die Zelte waren, wie sie gewesen waren
  rationale: Die Formulierung bleibt nahe am Hebräischen und vermittelt, dass die Zelte unverändert zurückgeblieben waren, ohne genauer zu erklären, was der Text offenlässt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Erzählführung. Der historische Name Aram bleibt erhalten. Die kollektiv gebrauchten Singularformen für Torwächter und Tiere werden im Deutschen als Plural wiedergegeben. Die echte Bedeutungsbreite von קוֹל wird in einer Fußnote kenntlich gemacht.
