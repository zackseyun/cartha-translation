revisions:
- from: 'Da gingen sie hin und riefen den Torwächtern der Stadt zu. Sie berichteten ihnen: »Wir sind zum Lager der Aramäer gekommen. Doch dort war niemand, und kein menschlicher Laut war zu hören[a]. Nur die Pferde und die Esel standen angebunden da, und die Zelte waren, wie sie gewesen waren.«'
  to: 'Da gingen sie hin und riefen den Torwächtern der Stadt zu. Sie berichteten ihnen: »Wir sind zum Lager der Aramäer gekommen. Doch dort war niemand, und kein menschlicher Laut war zu hören[a]. Nur die Pferde und die Esel waren angebunden, und die Zelte standen unverändert da.«'
  rationale: Die Revision beschränkt sich auf die abschließende Zustandsbeschreibung. „Waren angebunden“ gibt die partizipiale Konstruktion präzise wieder; „die Zelte standen unverändert da“ ist idiomatisch und vermittelt, dass sie so vorgefunden wurden, ohne einen nicht ausgedrückten früheren Vergleichszeitpunkt einzuführen. Die übrige Formulierung kann bleiben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T12:37:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen treffend wieder: die kollektiven Torwächter, das Lager der Aramäer, die völlige Abwesenheit von Menschen bzw. menschlichem Laut, die angebundenen Tiere und die unverändert zurückgelassenen Zelte. Die Hinzufügung von „standen ... da“ und besonders die Vergangenheitsform „wie sie gewesen waren“ ist jedoch stärker interpretierend als nötig. כַּאֲשֶׁר הֵמָּה bedeutet „wie sie [waren/sind]“ und beschreibt den vorgefundenen Zustand; eine Plusquamperfekt-Deutung legt unnötig einen Vergleich mit einem früheren Zustand nahe.'
  naturalness: Der Text ist überwiegend flüssiges modernes Standarddeutsch. „Doch dort war niemand“ kann den präsentativen Wert von וְהִנֵּה nur eingeschränkt wiedergeben, ist aber nicht sinnentstellend. „Die Zelte waren, wie sie gewesen waren“ klingt dagegen im Deutschen schwerfällig und unidiomatisch. „Die Zelte standen unverändert da“ ist natürlich und bewahrt den narrativen Befund ohne zusätzliche Erklärung.
  terminology: „Torwächter“, „Aramäer“, „menschlicher Laut“, „angebunden“ und „Zelte“ sind sachgerecht und registerangemessen. Die Fußnote ist korrekt am mehrdeutigen Ausdruck „menschlicher Laut“ verankert. Der englische Audit-Trail enthält offenbar eine fehlplatzierte Fußnote b zum Ausdruck „tied“; dies betrifft den deutschen Entwurf nicht und erfordert keine Übernahme.
  issues:
  - severity: medium
    issue: „die Zelte waren, wie sie gewesen waren“
    rationale: Die Wendung ist stilistisch holprig und die Plusquamperfektform („gewesen waren“) geht über כַּאֲשֶׁר הֵמָּה hinaus. Der hebräische Text stellt den vorgefundenen Zustand fest, ohne ausdrücklich einen früheren Referenzzeitpunkt zu markieren.
