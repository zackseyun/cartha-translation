    rationale: Das Hebräische hat ein implizites Objekt, das auf Silber, Gold und Kleider zurückweist. „Alles“ kann darüber hinaus den gesamten Inhalt des Zeltes meinen. „Sie“ bindet sich genauer an die genannten Gegenstände.
  - severity: low
    issue: Formulierung der Fußnote
    rationale: Der bisherige Satz lässt den Eindruck entstehen, das Personenwort selbst bezeichne eine Hautkrankheit. Eine Umformulierung stellt das Verhältnis zwischen den Betroffenen und צָרַעַת klarer dar.
