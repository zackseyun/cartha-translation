source:
  edition: WLC
  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: de
  text: Als diese Aussätzigen[a] an den Rand des Lagers kamen, gingen sie in ein Zelt, aßen und tranken. Dann nahmen sie von dort Silber, Gold und Kleider mit, gingen weg und versteckten sie. Danach kehrten sie zurück, gingen in ein anderes Zelt, nahmen auch von dort etwas mit, gingen weg und versteckten es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck bezeichnet Personen mit einer Hauterkrankung, die als צָרַעַת (Zaraat) bezeichnet wird. Sie kann ein breiteres Spektrum von Erkrankungen umfassen als die heute medizinisch als Lepra bezeichnete Hansen-Krankheit.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: diese Aussätzigen
  rationale: Die traditionelle, im biblischen Erzählkontext verständliche Bezeichnung wird beibehalten; eine Fußnote stellt klar, dass צָרַעַת nicht auf die moderne Hansen-Krankheit begrenzt ist.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: den Rand des Lagers
  rationale: Gibt die räumliche Bedeutung von קָצֶה präzise und in natürlichem Deutsch wieder.
- source_word: אֹהֶל אֶחָד
  choice: ein Zelt
  rationale: Im Deutschen vermittelt der unbestimmte Artikel die hier gemeinte einzelne, zunächst nicht näher bestimmte Unterkunft natürlich; die Abfolge mit »ein anderes Zelt« bleibt klar.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: aßen und tranken
  rationale: Entspricht der schlichten narrativen Abfolge der hebräischen Wayyiqtol-Formen ohne zusätzliche Aspektbedeutung.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: nahmen sie von dort … mit
  rationale: נשא bezeichnet hier das Wegnehmen beziehungsweise Forttragen von Gegenständen; »mitnehmen« ist im modernen Deutschen natürlich und kontextgerecht.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: Silber, Gold und Kleider
  rationale: Die drei Bezeichnungen werden klar und gegenwartssprachlich wiedergegeben; »Kleider« ist im Erzählkontext natürlicher als das gehobenere »Gewänder«.
- source_word: וַיַּטְמִנוּ
  choice: versteckten alles / versteckten es
  rationale: Das Verb bedeutet verbergen oder verstecken. Die ergänzten Pronomen machen die im Hebräischen ausgelassenen Objekte im Deutschen verständlich, ohne die Art des Versteckens als Vergraben festzulegen.
- source_word: וַיָּשֻׁבוּ
  choice: Danach kehrten sie zurück
  rationale: Gibt die fortschreitende Erzählsequenz idiomatisch wieder.
- source_word: אֹהֶל אַחֵר
  choice: ein anderes Zelt
  rationale: Entspricht direkt und natürlich der Bedeutung von אַחֵר.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: nahmen auch von dort etwas mit
  rationale: Beim zweiten Vorkommen bleibt das Objekt im Hebräischen unausgesprochen. »etwas« bewahrt diese Unbestimmtheit und ergibt einen vollständigen deutschen Satz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählfolge. Die parataktische Struktur des Hebräischen wird teilweise durch Satzgliederung und zeitliche Übergänge geglättet, ohne inhaltliche Ergänzungen; die medizinische Spannweite des traditionellen Begriffs »Aussätzige« wird in der Fußnote erläutert.
