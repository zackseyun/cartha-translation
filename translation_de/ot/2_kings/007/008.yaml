  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Elemente des Hebräischen zuverlässig wieder: Ankunft am Rand des Lagers, Betreten eines Zeltes, Essen und Trinken, Mitnahme von Silber, Gold und Kleidern, Verstecken, Rückkehr und Wiederholung in einem anderen Zelt. Die Objektellipse bei der zweiten Mitnahme wird angemessen mit „etwas“ wiedergegeben. Im ersten Durchgang ist „alles“ jedoch weiter als das Hebräische: Es kann im Deutschen nahelegen, sie hätten den gesamten Zeltinhalt versteckt, statt die zuvor genannten Gegenstände.'
  naturalness: Flüssiges, modernes Standarddeutsch mit angemessen erzählendem Register. Die zeitlichen Verknüpfungen sind idiomatisch. „Aussätzige“ ist traditionell und im biblischen Kontext verständlich, benötigt aber die vorhandene Erläuterung, die sprachlich präzisiert werden sollte.
  terminology: „Rand des Lagers“, „Zelt“, „Silber, Gold und Kleider“ sowie „verstecken“ treffen den Sinn der hebräischen Ausdrücke gut. Die Fußnote sollte klarer sagen, dass der Ausdruck Personen mit einer als צָרַעַת bezeichneten Hauterkrankung meint; die Erkrankung ist nicht ohne Weiteres mit moderner Hansen-Krankheit gleichzusetzen.
