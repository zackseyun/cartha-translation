revisions:
- from: Als diese Aussätzigen[a] an den Rand des Lagers kamen, gingen sie in ein Zelt, aßen und tranken. Dann nahmen sie von dort Silber, Gold und Kleider mit, gingen weg und versteckten alles. Danach kehrten sie zurück, gingen in ein anderes Zelt, nahmen auch von dort etwas mit, gingen weg und versteckten es.
  to: Als diese Aussätzigen[a] an den Rand des Lagers kamen, gingen sie in ein Zelt, aßen und tranken. Dann nahmen sie von dort Silber, Gold und Kleider mit, gingen weg und versteckten sie. Danach kehrten sie zurück, gingen in ein anderes Zelt, nahmen auch von dort etwas mit, gingen weg und versteckten es.
  rationale: Die Revision beschränkt sich auf eine Präzisierung des impliziten Objekts im ersten Versteckvorgang und auf eine klarere Erläuterung des traditionellen Begriffs „Aussätzige“ in der Fußnote. Bedeutung, Erzählabfolge und die beim zweiten Mitnahmevorgang bestehende Unbestimmtheit bleiben erhalten.
