  to: 'Da sagte Elisa: »Hört das Wort Jahwes! So spricht Jahwe: Morgen etwa um diese Zeit kostet am Tor von Samaria ein Sea[a] Feinmehl einen Schekel und zwei Sea Gerste einen Schekel.«'
