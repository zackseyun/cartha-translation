  terminology: „Elisa“, „Jahwe“, „Wort Jahwes“, „So spricht Jahwe“, „Feinmehl“, „Schekel“ und „Samaria“ sind sachgerecht. „Sea“ kann als beibehaltene antike Trockenmaßeinheit verwendet werden; die Fußnote sollte ohne die nicht belegbare Wertung „bewusst“ formuliert werden.
