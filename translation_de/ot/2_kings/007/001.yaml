  source_fidelity: 'Die Wiedergabe trifft den hebräischen Text insgesamt zuverlässig: Elisa leitet eine prophetische Ankündigung ein; die Preisrelationen, die beiden Mengen und der Handelsort am Stadttor Samarias bleiben erhalten. Die vorangestellte Ortsangabe ist syntaktisch möglich. Die Nuance von כָּעֵת („etwa/um diese Zeit“) sollte jedoch ausdrücklich erscheinen.'
