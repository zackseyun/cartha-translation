source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: de
  text: 'Da sagte Elisa: »Hört das Wort Jahwes! So spricht Jahwe: Morgen etwa um diese Zeit kostet am Tor von Samaria ein Sea[a] Feinmehl einen Schekel und zwei Sea Gerste einen Schekel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Sea war ein Hohlmaß für trockene Waren; der hebräische Text verwendet diese konkrete Maßeinheit statt eines allgemeinen »Maßes«.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die waw-konsekutive Form führt die Erzählung weiter; »Da sagte« gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Imperativ steht im Plural und bildet den feierlichen Aufruf zu einer prophetischen Verkündigung.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: »Wort« bewahrt die feste prophetische Ausdrucksweise; der Gottesname wird als Eigenname wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Form »Jahwe« gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Dies ist die herkömmliche und zugleich verständliche deutsche Wiedergabe der prophetischen Botenformel.
- source_word: כָּעֵת מָחָר
  choice: Morgen um diese Zeit
  rationale: Die Formulierung gibt den ungefähren entsprechenden Zeitpunkt am folgenden Tag natürlich wieder; die Wendung selbst lässt eine gewisse zeitliche Näherung zu.
- source_word: סְאָה / סָאתַיִם
  choice: ein Sea / zwei Sea
  rationale: Das konkrete antike Trockenmaß bleibt erhalten; die Mengenunterscheidung zwischen Singular und Dual wird ausdrücklich wiedergegeben.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der Ausdruck bezeichnet feines beziehungsweise hochwertiges Mehl und nicht bloß Mehl im Allgemeinen.
- source_word: בְּשֶׁקֶל
  choice: für einen Schekel
  rationale: Die Präposition bezeichnet in diesem Marktzusammenhang den Preis.
- source_word: שְׂעֹרִים
  choice: Gerste
  rationale: Dies ist die übliche Bezeichnung der genannten Getreideart.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: am Tor von Samaria
  rationale: Das Stadttor war ein Ort des Handels und öffentlichen Lebens; »am Tor« ist im Deutschen natürlich und sachlich passend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als Eigennamen und vermeidet die Ersetzung durch einen Titel.
translation_notes:
  register: Moderne, würdige Standardsprache mit erkennbar prophetischem Klang. Die direkte Rede ist klar gegliedert; antike Maß- und Währungseinheiten bleiben zur Wahrung der konkreten wirtschaftlichen Aussage erhalten.
