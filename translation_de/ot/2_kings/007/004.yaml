source:
  edition: WLC
  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: de
  text: 'Wenn wir sagen: »Lasst uns in die Stadt gehen«, ist in der Stadt Hungersnot, und wir werden dort sterben. Wenn wir aber hier sitzen bleiben, werden wir sterben. Und nun, kommt, lasst uns zum Lager Arams[a] gehen[b]. Wenn sie uns am Leben lassen, werden wir leben; wenn sie uns aber töten, werden wir sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram ist die hebräische Bezeichnung für das Gebiet und die Bevölkerung, die häufig als Syrien beziehungsweise Syrer wiedergegeben werden. Gemeint ist hier das militärische Lager der Aramäer.
    reason: cultural_note
  - marker: b
    text: 'Oder: »lasst uns uns dem Lager Arams ergeben« oder »lasst uns zum Lager Arams überlaufen«. Das hebräische נפל אל bedeutet wörtlich etwa »zu jemandem hin fallen« und kann im militärischen Zusammenhang das Übergehen zur anderen Seite oder die Ergebung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹא
  choice: wir wollen … gehen
  rationale: Der Imperfekt in der angeführten Überlegung bezeichnet einen vorgeschlagenen Entschluss. „Wir wollen … gehen“ gibt dies im heutigen Deutsch natürlicher wieder als ein bloßes Futur.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Die Stadt ist im Zusammenhang Samaria; da der hebräische Text hier jedoch den Gattungsbegriff verwendet, bleibt die Übersetzung bei „die Stadt“.
- source_word: הָרָעָב
  choice: Hungersnot
  rationale: רָעָב bezeichnet in der Belagerungslage eine allgemeine Hungersnot, nicht nur persönlichen Hunger.
- source_word: יָשַׁבְנוּ פֹה
  choice: hier sitzen bleiben
  rationale: Die Wendung bewahrt das konkrete Bild von ישׁב und drückt zugleich das Verharren an diesem Ort idiomatisch aus.
- source_word: וְעַתָּה לְכוּ
  choice: Darum kommt jetzt
  rationale: וְעַתָּה leitet die Folgerung aus den zuvor erwogenen Möglichkeiten ein; לְכוּ dient als auffordernder Auftakt zur gemeinsamen Handlung.
- source_word: וְנִפְּלָה אֶל
  choice: lasst uns … überlaufen
  rationale: נפל אל kann im militärischen Zusammenhang bedeuten, sich zur Gegenseite zu begeben oder sich ihr auszuliefern. „Überlaufen“ ist im Deutschen klar und natürlich; die wörtliche Bildsprache wird in einer Fußnote genannt.
- source_word: מַחֲנֵה אֲרָם
  choice: das Lager Arams
  rationale: Der Eigenname אֲרָם wird als „Aram“ wiedergegeben; מַחֲנֶה bezeichnet hier das militärische Lager.
- source_word: יְחַיֻּנוּ
  choice: sie uns am Leben lassen
  rationale: Das Piel von חיה mit Objektsuffix bedeutet, jemanden am Leben zu erhalten beziehungsweise leben zu lassen.
- source_word: נִחְיֶה
  choice: wir werden leben
  rationale: Die direkte Wiedergabe erhält die betonte Wiederholung von „leben“ gegenüber dem vorhergehenden Verb.
- source_word: יְמִיתֻנוּ
  choice: sie uns töten
  rationale: Das Hiphil von מות bedeutet „den Tod verursachen, töten“. Das einfache deutsche Verb ist natürlich und gibt den Sinn vollständig wieder.
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: wir werden sterben
  rationale: In den Bedingungsfolgen bezeichnen die Formen das jeweils erwartete Ergebnis; das deutsche Futur bringt dies klar zum Ausdruck.
