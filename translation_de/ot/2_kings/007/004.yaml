translation_notes:
  register: Moderne, würdevolle Standardsprache. Die kurze, nüchterne Satzfolge bewahrt die Dringlichkeit der verzweifelten Abwägung. „Überlaufen“ vermeidet die im Deutschen missverständliche wörtliche Formulierung „in das Lager fallen“, während die Fußnote die hebräische Bildsprache und Bedeutungsbreite offenlegt.
