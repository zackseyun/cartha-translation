  naturalness: Die überarbeitete Fassung ist modernes, würdiges Deutsch. „ist in der Stadt Hungersnot“ entspricht dem hebräischen Nominalsatz und klingt hier natürlicher als „herrscht in der Stadt Hungersnot“.
  terminology: „Aram“ bleibt als Eigenname erhalten. „Hungersnot“, „am Leben lassen“, „leben“ und „töten“ geben die entscheidenden Begriffe angemessen wieder. Die Fußnote erläutert die militärische Mehrdeutigkeit von נפל אל, ohne eine konfessionelle oder historische Deutung vorzuschreiben.
