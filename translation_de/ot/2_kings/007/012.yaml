source:
  edition: WLC
  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: de
  text: 'Da stand der König nachts auf und sagte zu seinen Dienern: „Ich will euch nun sagen, was Aram[a] uns angetan hat. Sie wissen, dass wir Hunger leiden; deshalb haben sie das Lager verlassen, um sich auf dem Feld zu verstecken, mit dem Gedanken: ‚Wenn sie aus der Stadt herauskommen, werden wir sie lebendig gefangen nehmen und in die Stadt eindringen.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Aram“ sind hier die Aramäer beziehungsweise ihr Heer gemeint.
    reason: Das Hebräische verwendet den Landes- und Volksnamen metonymisch für die handelnden Menschen beziehungsweise Streitkräfte.
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ לַיְלָה
  choice: Da stand der König in der Nacht auf
  rationale: קום bezeichnet hier im nächtlichen Erzählzusammenhang das Aufstehen, wahrscheinlich vom Schlaf oder Lager; die deutsche Formulierung ist natürlich und bewahrt die Zeitangabe.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עבד bezeichnet im königlichen Umfeld Diener, Bedienstete oder Amtsträger. „Diener“ ist die breite, transparente Wiedergabe, ohne den Rang genauer festzulegen als der Kontext.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: Ich will euch sagen
  rationale: Der Kohortativ mit נָא drückt eine nachdrückliche Einleitung aus. „Ich will euch sagen“ gibt den volitionalen Sinn in würdigem, natürlichem Deutsch wieder; ein zusätzliches „bitte“ wäre hier unidiomatisch.
- source_word: אֵת אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: was Aram uns angetan hat
  rationale: Aram steht metonymisch für das aramäische Volk oder Heer. „Angetan“ entspricht im Deutschen der feindseligen Bedeutung von עשה ל in diesem Kontext.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: Sie wissen, dass wir Hunger leiden
  rationale: Das Perfekt wird innerhalb der direkten Rede als gegenwärtiges Wissen der Gegner verstanden. „Hunger leiden“ bildet die durch die Belagerung verursachte Not treffender ab als das alltagssprachlich schwächere „hungrig sein“.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: Darum haben sie das Lager verlassen
  rationale: Das Perfekt bezeichnet eine kürzlich abgeschlossene Handlung mit gegenwärtiger Relevanz. „Darum“ macht den im Zusammenhang vorausgesetzten Folgeschluss idiomatisch deutlich.
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: sich draußen auf dem Feld versteckt
  rationale: Die Form von חבא bezeichnet das Sichverbergen. „Draußen“ verdeutlicht knapp den Gegensatz zu Lager und Stadt; שדה bleibt mit „Feld“ konkret wiedergegeben.
- source_word: לֵאמֹר
  choice: Sie sagen sich
  rationale: לֵאמֹר führt den Inhalt des angenommenen Plans ein. Da der König die Überlegung der Gegner rekonstruiert, ist „Sie sagen sich“ im Deutschen natürlicher als ein isoliertes Partizip „sagend“.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: Wenn sie aus der Stadt herauskommen
  rationale: כִּי leitet hier die erwartete Bedingung beziehungsweise Gelegenheit für den Hinterhalt ein; „wenn“ bewahrt diese kontextuelle Funktion.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: nehmen wir sie lebendig gefangen
  rationale: תפשׂ bezeichnet Ergreifen oder Gefangennehmen; חַיִּים ist prädikativ beziehungsweise adverbial gebraucht. Die deutsche Wendung ist präzise und idiomatisch.
- source_word: וְאֶל הָעִיר נָבֹא
  choice: und dringen in die Stadt ein
  rationale: Wörtlich steht „und wir werden in die Stadt kommen“. Im Zusammenhang eines militärischen Plans gibt „in die Stadt eindringen“ die Zielrichtung natürlich wieder, ohne einen zusätzlichen Eroberungserfolg auszudrücken.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die direkte Rede bleibt lebendig; „Aram“ wird als Eigenname beibehalten und durch eine Fußnote erklärt. Der vermutete Hinterhalt wird als Schlussfolgerung des Königs dargestellt, ohne ihn als tatsächliches Geschehen zu bestätigen.
