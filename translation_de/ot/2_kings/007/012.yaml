revisions:
- from: 'Da stand der König in der Nacht auf und sagte zu seinen Dienern: „Ich will euch sagen, was Aram[a] uns angetan hat. Sie wissen, dass wir Hunger leiden. Darum haben sie das Lager verlassen und sich draußen auf dem Feld versteckt. Sie sagen sich: ‚Wenn sie aus der Stadt herauskommen, nehmen wir sie lebendig gefangen und dringen in die Stadt ein.‘“'
  to: 'Da stand der König nachts auf und sagte zu seinen Dienern: „Ich will euch nun sagen, was Aram[a] uns angetan hat. Sie wissen, dass wir Hunger leiden; deshalb haben sie das Lager verlassen, um sich auf dem Feld zu verstecken, mit dem Gedanken: ‚Wenn sie aus der Stadt herauskommen, werden wir sie lebendig gefangen nehmen und in die Stadt eindringen.‘“'
  rationale: Die Revision entfernt eine nicht ausdrücklich belegte Ortsnuance, macht die mit לֵאמֹר eingeleitete Planrede im Deutschen flüssiger und gibt die Nuance von נָא dezent durch „nun“ wieder. Die Aussage bleibt ausdrücklich als Einschätzung des Königs formuliert und behauptet den Hinterhalt nicht als erwiesene Tatsache.
