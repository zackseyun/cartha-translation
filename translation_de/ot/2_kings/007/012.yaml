  source_fidelity: Die Übersetzung gibt Handlungsfolge, vermuteten Hinterhalt, Gefangennahme „lebendig“ und das anschließende Eindringen in die Stadt im Wesentlichen zuverlässig wieder. Das zusätzliche „draußen“ ist jedoch im Hebräischen nicht eigens ausgedrückt. Außerdem sollte die mit לֵאמֹר eingeleitete, vom König rekonstruierte Absicht klarer als gedachte Planung formuliert werden.
  naturalness: Der Text ist überwiegend modernes Standarddeutsch. „Sie sagen sich“ nach den Perfektformen „haben ... verlassen“ und „versteckt“ wirkt jedoch zeitlich und stilistisch weniger glatt. Eine Formulierung wie „mit dem Gedanken“ bildet die Planrede idiomatisch ab.
  terminology: „Aram“ ist korrekt als Eigenname beibehalten; die Fußnote erklärt die Metonymie angemessen. „Dienern“, „Hunger leiden“ und „lebendig gefangen nehmen“ sind passend. „In die Stadt eindringen“ ist als kontextuelle Wiedergabe von „in die Stadt kommen“ vertretbar.
  issues:
