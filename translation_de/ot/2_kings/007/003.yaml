source:
  edition: WLC
  text: וְ/אַרְבָּעָ֧ה אֲנָשִׁ֛ים הָי֥וּ מְצֹרָעִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מָ֗ה אֲנַ֛חְנוּ יֹשְׁבִ֥ים פֹּ֖ה עַד מָֽתְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: de
  text: 'Am Eingang des Tores hielten sich vier Männer mit einer Hautkrankheit[a] auf. Sie sagten zueinander: »Warum bleiben wir hier sitzen, bis wir sterben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »Aussätzige«. Das hebräische Wort bezeichnet Menschen mit einer als צָרַעַת bezeichneten Hauterkrankung, die nicht unbedingt mit der heutigen Lepra (Hansen-Krankheit) identisch ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: Am Eingang des Tores hielten sich vier Männer … auf
  rationale: Die Konstruktion führt vier männliche Handlungsträger in die neue Szene ein. Die deutsche Satzstellung mit vorangestellter Ortsangabe ist natürlich; das Waw wird durch den Szenenanschluss getragen und nicht mit einem unbelegten zeitlichen »Nun« wiedergegeben.
- source_word: מְצֹרָעִים
  choice: mit einer Hautkrankheit
  rationale: Der Ausdruck bezeichnet Menschen mit der als צָרַעַת bezeichneten Erkrankung, die nicht ohne Weiteres mit der heutigen Hansen-Krankheit gleichgesetzt werden darf. Die traditionelle Wiedergabe wird in der Fußnote genannt.
- source_word: פֶּתַח הַשָּׁעַר
  choice: am Eingang des Tores
  rationale: Die Constructusverbindung bedeutet wörtlich »Öffnung/Eingang des Tores«; die gewählte Form ist klares, natürliches Deutsch.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: Sie sagten zueinander
  rationale: Die distributive Singularwendung bezeichnet ein wechselseitiges Gespräch innerhalb der Gruppe.
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: Warum bleiben wir hier sitzen
  rationale: מָה hat in der rhetorischen Frage die Funktion »warum«. Das Partizip bezeichnet die andauernde Lage; »bleiben … sitzen« gibt zugleich Körperhaltung und Untätigkeit idiomatisch wieder.
- source_word: עַד מָתְנוּ
  choice: bis wir sterben
  rationale: Die Wendung bezeichnet den tödlichen Endpunkt ihres Verharrens und wird im Deutschen direkt und verständlich wiedergegeben.
