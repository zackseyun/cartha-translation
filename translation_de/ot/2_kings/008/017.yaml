lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: Er war zweiunddreißig Jahre alt
  rationale: Die hebräische Altersformel בֶּן + Zahl + שָׁנָה wird im modernen Deutschen idiomatisch mit „… Jahre alt sein“ wiedergegeben.
- source_word: הָיָה בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Wendung bezeichnet sein Alter beim Regierungsantritt; „als er König wurde“ gibt dies natürlich und präzise wieder.
- source_word: וּשְׁמֹנֶה שנה
  choice: acht Jahre
  rationale: Die Zeitangabe bezeichnet unmittelbar die Dauer seiner Herrschaft.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet die Ausübung der Königsherrschaft; „regierte“ ist im Deutschen knapp und kontextgerecht.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition markiert den Ort seiner Regierung.
