base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: de
  text: 'Der König sprach gerade mit Gehasi, dem Diener[a] des Mannes Gottes: »Bitte erzähl mir von all den großen Taten, die Elisa vollbracht hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Begleiter« beziehungsweise »junger Mann«; das hebräische Wort נַעַר kann je nach Zusammenhang einen Diener, Begleiter oder jungen Mann bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ מְדַבֵּר
  choice: Der König sprach gerade
  rationale: Das Partizip מְדַבֵּר zeichnet eine im Hintergrund bereits ablaufende Handlung. »Sprach gerade« gibt diesen Verlaufscharakter in natürlichem Deutsch wieder; das anknüpfende וְ muss hier nicht eigens mit »und« oder »nun« wiedergegeben werden.
- source_word: גֵּחֲזִי
  choice: Gehasi
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: נַעַר
  choice: Diener
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. In der Verbindung mit »Mann Gottes« bezeichnet es hier am ehesten Gehasis dienende Funktion, ohne dass sein Alter im Vordergrund stehen muss.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Die feste hebräische Bezeichnung wird wörtlich und als geläufiger biblischer Titel bewahrt, statt sie enger als »Prophet« auszulegen.
- source_word: סַפְּרָה נָּא לִי
  choice: Erzähl mir doch
  rationale: Der Imperativ von ספר verlangt ein Erzählen oder Berichten; נָא mildert die Aufforderung höflich ab. Das deutsche »doch« gibt diese Nuance natürlich wieder.
- source_word: אֵת כָּל הַגְּדֹלוֹת
  choice: von all den großen Taten
  rationale: Das substantivierte feminine Pluraladjektiv bezeichnet die großen oder außerordentlichen Dinge, die Elisa getan hat. »Große Taten« ist im Deutschen idiomatisch und passt zum folgenden עשה.
- source_word: עָשָׂה
  choice: vollbracht hat
  rationale: Das Perfekt bezeichnet abgeschlossene Taten, die für das gegenwärtige Gespräch bedeutsam sind. »Vollbracht hat« verbindet diese Zeitperspektive mit dem Ausdruck »große Taten«.
