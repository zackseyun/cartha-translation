  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: de
  text: 'Elisa sagte zu ihm: „Geh und sag ihm: ‚Du wirst ganz bestimmt wieder gesund werden.‘[a] Doch Jahwe hat mir gezeigt, dass er ganz bestimmt sterben wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Konsonantentext hat hier wörtlich: „Du wirst ganz bestimmt nicht am Leben bleiben.“ Die masoretische Randlesung lautet jedoch „ihm“ und ergibt: „Sag ihm: Du wirst ganz bestimmt wieder gesund werden.“ Die Stelle ist schwierig; der Haupttext folgt dem Sinn im Zusammenhang, wonach der König von seiner Krankheit genesen könnte, dennoch aber sterben wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: Elisa sagte zu ihm
  rationale: Das ausdrücklich genannte Subjekt אֱלִישָׁע wird im Deutschen natürlich an den Satzanfang gestellt; die Erzählfolge bleibt durch das Präteritum gewahrt.
- source_word: לֵךְ אֱמָר
  choice: Geh und sag ihm
  rationale: Die beiden aufeinanderfolgenden Imperative werden in natürlichem modernem Deutsch wiedergegeben. „Sag ihm“ bleibt nahe an אמר.
- source_word: לא חָיֹה תִחְיֶה
  choice: Du wirst ganz bestimmt wieder gesund werden
  rationale: Der Kontext betrifft die Genesung von einer Krankheit; deshalb gibt „wieder gesund werden“ חיה hier idiomatisch wieder. Die Konstruktion Infinitivus absolutus plus finites Verb wird durch „ganz bestimmt“ verstärkt. Der masoretisch vokalisierte Wortlaut mit לא ist schwierig und wird in der Fußnote offengelegt.
- source_word: וְהִרְאַנִי יְהוָה
  choice: Doch Jahwe hat mir gezeigt
  rationale: וְ wird wegen des deutlichen Gegensatzes adversativ mit „doch“ wiedergegeben. Das Tetragramm erscheint entsprechend der Projektvorgabe als „Jahwe“.
- source_word: כִּי מוֹת יָמוּת
  choice: dass er ganz bestimmt sterben wird
  rationale: כִּי leitet hier den Inhalt der Offenbarung ein. Die emphatische Verbindung von Infinitivus absolutus und finitem Verb wird durch „ganz bestimmt“ bewahrt.
theological_decisions:
- issue: Wiedergabe der schwierigen Klausel לא חיה תחיה
  choice: Im Haupttext als Auftrag wiedergeben, dem König sichere Genesung anzukündigen.
  alternative: „Du wirst ganz bestimmt nicht am Leben bleiben“ beziehungsweise „Du wirst ganz bestimmt nicht genesen“, wenn לא als Negation gelesen wird.
  rationale: Die masoretische Vokalisierung ergibt wörtlich eine negative Aussage, die jedoch schwer mit dem anschließenden Gegensatz und dem Erzählzusammenhang zu vereinbaren ist. Der Haupttext gibt daher den im Kontext wahrscheinlich beabsichtigten Sinn wieder, während die echte textliche und auslegerische Spannung in einer Fußnote erhalten bleibt.
- issue: Gottesname יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname macht den hebräischen Gottesnamen transparent und folgt der für diese Vorlage angegebenen Projektentscheidung, ohne zusätzliche konfessionelle Deutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die emphatischen hebräischen Konstruktionen werden jeweils mit „ganz bestimmt“ wiedergegeben. Die Fußnotenmarke steht nach dem gesamten Vers, da sie die textlich schwierige direkte Rede erläutert.
