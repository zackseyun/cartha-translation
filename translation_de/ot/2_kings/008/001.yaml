  source_fidelity: 'Die Grundstruktur und die wesentlichen Bedeutungen sind zutreffend wiedergegeben: Elisas vorausgehende Rede, die Frau samt ihrem Haushalt, der befristete Aufenthalt und Jahwes Veranlassung der Hungersnot. Die deutsche Wiedergabe von וְגַם בָּא als „sie kommt für sieben Jahre über das Land“ ist jedoch syntaktisch und idiomatisch nicht ganz gelungen; insbesondere sollte die Dauer klar die Hungersnot bestimmen. Die präsentische Form kann die als sicher dargestellte Aussage des hebräischen Perfekts angemessen wiedergeben, ohne die zeitliche Nuance übermäßig festzulegen.'
  naturalness: „Hausgemeinschaft“ klingt im modernen Deutsch verwaltungssprachlich und ist in einer direkten, dringlichen Rede weniger natürlich als „Haushalt“. Die Stellung von „für sieben Jahre“ in der vorliegenden Fassung wirkt zudem holprig. Die übrige Sprache ist würdig, verständlich und dem erzählerischen Register angemessen.
  terminology: „Elisa“, „Jahwe“, „Hungersnot“ und „wieder zum Leben erweckt“ sind passend. „Haushalt“ gibt בֵּיתֵךְ hier idiomatisch als die zum Haus gehörenden Personen wieder. Die Fußnote zu גור ist sachlich und korrekt; „als Fremde“ verdeutlicht die in diesem Kontext relevante Nuance besser als „Ortsfremde“.
