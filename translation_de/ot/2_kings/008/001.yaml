  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: de
  text: 'Elisa hatte zu der Frau, deren Sohn er wieder zum Leben erweckt hatte, gesagt: »Mach dich auf und geh fort, du und dein Haushalt. Lebe vorübergehend dort, wo du unterkommen kannst.[a] Denn Jahwe hat eine Hungersnot herbeigerufen, und sie kommt auch über das Land – sieben Jahre lang.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende hebräische Verb גור bezeichnet häufig das zeitweilige Leben als Fremde beziehungsweise außerhalb der eigenen Heimat.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: hatte … gesagt
  rationale: Das hebräische Perfekt bezeichnet hier ein Gespräch, das den im weiteren Zusammenhang berichteten Ereignissen vorausging; das deutsche Plusquamperfekt macht diesen Rückblick deutlich.
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: deren Sohn er wieder zum Leben erweckt hatte
  rationale: Die Hifil-Form von חיה bezeichnet die Wiederherstellung des Lebens. Die Formulierung ist präzise, natürlich und wahrt den Rückbezug auf Elisas früheres Handeln.
- source_word: קוּמִי וּלְכִי
  choice: Mach dich auf und geh fort
  rationale: קוּמִי leitet idiomatisch zu entschlossenem Handeln an; zusammen mit וּלְכִי fordert die Wendung die Frau auf, ihren bisherigen Wohnort zu verlassen.
- source_word: אַתִּי וּבֵיתֵךְ
  choice: du und deine Hausgemeinschaft
  rationale: בַּיִת meint hier nicht nur das Gebäude, sondern die zum Haushalt gehörenden Menschen. „Hausgemeinschaft“ bewahrt diesen sozialen Sinn, ohne ihn auf die Kernfamilie zu verengen.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: Lebe vorübergehend dort, wo du unterkommen kannst
  rationale: Die Wiederholung von גור beschreibt den Aufenthalt außerhalb der Heimat als zeitweiliges Wohnen. Die deutsche Fassung gibt sowohl die Vorläufigkeit als auch die praktische Suche nach einer Unterkunft natürlich wieder.
- source_word: קָרָא יְהוָה לָרָעָב
  choice: Jahwe hat eine Hungersnot herbeigerufen
  rationale: קרא mit ל stellt die Hungersnot als von Jahwe aufgerufen beziehungsweise herbeigerufen dar und betont seine Verfügung über das Geschehen.
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: und sie kommt für sieben Jahre über das Land
  rationale: Das hebräische Perfekt kann das angekündigte Geschehen als feststehend darstellen. Das deutsche Präsens wahrt hier den Übergang von der bereits ergangenen göttlichen Verfügung zu ihrem sicheren Eintreten, ohne den Beginn der Hungersnot genauer festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug von וְגַם בָּא
  choice: und sie kommt
  alternative: und sie ist gekommen / und sie wird kommen
  rationale: Die Perfektform kann im prophetischen Ausspruch ein sicher bevorstehendes Ereignis als bereits feststehend ausdrücken. Das Präsens lässt diese Spannung bestehen und vermeidet eine unbegründet genaue zeitliche Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mach dich auf“ erhält den nachdrücklichen biblischen Erzählton, während „unterkommen“ die praktische Aussage der Anweisung allgemein verständlich wiedergibt. Die direkte Rede bleibt knapp und dringlich.
