  to: 'Elisa hatte zu der Frau, deren Sohn er wieder zum Leben erweckt hatte, gesagt: »Mach dich auf und geh fort, du und dein Haushalt. Lebe vorübergehend dort, wo du unterkommen kannst.[a] Denn Jahwe hat eine Hungersnot herbeigerufen, und sie kommt auch über das Land – sieben Jahre lang.«'
  rationale: Die Revision ersetzt das bürokratisch wirkende „Hausgemeinschaft“ durch das idiomatische „Haushalt“ und ordnet die Dauerangabe so, dass eindeutig die siebenjährige Hungersnot gemeint ist. Die präsentische Form „kommt“ bleibt erhalten, da sie die sichere Ankündigung des hebräischen Perfekts in natürlichem Deutsch abbilden kann, ohne dessen zeitliche Einordnung unnötig zu entscheiden. Die Fußnote bleibt am Ausdruck „vorübergehend“ verankert und erläutert die sojourner-Nuance von גור präziser.
