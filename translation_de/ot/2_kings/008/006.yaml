base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: de
  text: 'Der König fragte die Frau, und sie erzählte es ihm. Darauf stellte ihr der König einen Hofbeamten[a] zur Seite und befahl ihm: »Gib ihr alles zurück, was ihr gehört, ebenso alle Erträge des Feldes von dem Tag an, an dem sie das Land verlassen hat, bis jetzt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Eunuchen«. Der Ausdruck kann einen tatsächlichen Eunuchen oder allgemeiner einen königlichen Hofbeamten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: Der König fragte die Frau
  rationale: Das Verb mit ל kann hier natürlich mit »jemanden fragen« wiedergegeben werden. אִשָּׁה bezeichnet im Zusammenhang die bereits erwähnte Frau, nicht eigens ihre Stellung als Ehefrau.
- source_word: וַתְּסַפֶּר לוֹ
  choice: und sie erzählte es ihm
  rationale: Das Piel von ספר bedeutet hier »erzählen/berichten«. Das im Deutschen nötige Objekt »es« verweist auf den erfragten Sachverhalt.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: Darauf stellte ihr der König einen Hofbeamten zur Seite
  rationale: Die Wendung bezeichnet die Zuweisung eines einzelnen königlichen Funktionsträgers, der die Rückgabe veranlassen soll. »Hofbeamter« passt zum administrativen Zusammenhang; die mögliche Bedeutung »Eunuch« bleibt in der Fußnote erhalten.
- source_word: לֵאמֹר
  choice: und befahl ihm
  rationale: לֵאמֹר leitet direkte Rede ein. Da der folgende Imperativ einen königlichen Auftrag ausdrückt, ist »befahl ihm« im Deutschen natürlich und macht den Adressaten klar.
- source_word: הָשֵׁיב
  choice: Gib ihr ... zurück
  rationale: Der Hifil-Imperativ von שוב verlangt, dass der Besitz zurückgegeben wird. »Zurückgeben« ist modern und idiomatisch.
- source_word: אֶת כָּל אֲשֶׁר לָהּ
  choice: alles, was ihr gehört
  rationale: Die umfassende Formulierung bezeichnet ihren gesamten Besitz bzw. Anspruch, ohne ihn enger festzulegen.
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: den gesamten Ertrag des Feldes
  rationale: תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag oder die Ernte. »Ertrag« schließt die über den Zeitraum angefallenen Erzeugnisse beziehungsweise ihren Wert ein.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: von dem Tag an, an dem sie das Land verlassen hat, bis heute
  rationale: Die Wiedergabe bewahrt den zeitlichen Ausgangspunkt und Endpunkt sowie die offene Bedeutung von אֶרֶץ als »Land«.
