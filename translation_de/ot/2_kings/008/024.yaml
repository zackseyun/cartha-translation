base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: de
  text: Und Joram legte sich zu seinen Vätern[a] und wurde bei seinen Vätern in der Stadt Davids begraben. Sein Sohn Ahasja wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „legte sich mit seinen Vätern nieder“. Dies ist eine herkömmliche königliche Todesformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Bewahrt das hebräische Bild der königlichen Todesformel, ohne es stillschweigend zum schlichten „starb“ aufzulösen.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern / bei seinen Vätern
  rationale: Die traditionelle dynastische Formel bleibt erkennbar; beim Begräbnis ist „bei seinen Vätern“ im Deutschen natürlich.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Gibt die passive Bedeutung des Nifal direkt und idiomatisch wieder.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Die etablierte deutsche Bezeichnung des Ortes entspricht der hebräischen Wendung.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der Thronfolgeformel bezeichnet das Verb hier den Regierungsantritt; die deutsche Formulierung ist natürlicher als „regierte an seiner Stelle“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Gibt die Bedeutung der königlichen Nachfolge präzise wieder.
- source_word: יוֹרָם
  choice: Joram
  rationale: Entspricht der hebräischen Kurzform und der geläufigen deutschen Namensform.
- source_word: אֲחַזְיָהוּ
  choice: Ahasja
  rationale: Geläufige deutsche Wiedergabe des hebräischen Personennamens.
theological_decisions:
- issue: Bedeutung der königlichen Todesformel
  choice: Das Bild „legte sich zu seinen Vätern“ bleibt im Text erhalten.
  alternative: „starb“ oder „entschlief“
  rationale: Die bildhafte und konventionelle Ausdrucksweise des Hebräischen soll weder verflacht noch durch eine stärker theologisch gefärbte deutsche Formulierung vereindeutigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Todesformel wird quellenah bewahrt; der Thronfolgehinweis wird idiomatisch als „wurde König“ formuliert.
