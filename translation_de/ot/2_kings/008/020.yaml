  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥כוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: de
  text: Zu seiner Zeit lehnte sich Edom gegen die Herrschaft Judas auf und setzte einen eigenen König ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie setzten einen König über sich ein“.'
    reason: Die Fußnote bewahrt die konkrete hebräische Formulierung; der Haupttext gibt ihren politischen Sinn in natürlichem Deutsch wieder.
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Zu seiner Zeit
  rationale: Die hebräische Zeitangabe bezeichnet die Regierungs- bzw. Lebenszeit des zuvor genannten Königs; die deutsche Wendung ist natürlich und klar.
- source_word: פָּשַׁע
  choice: lehnte sich … auf
  rationale: Das Verb bezeichnet hier im politischen Zusammenhang einen Aufstand bzw. die Lossagung von einer Oberherrschaft, nicht eine sittliche Verfehlung.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Eingebürgerte deutsche Namensform für Land und Volk.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: gegen die Herrschaft Judas
  rationale: Die wörtliche Wendung „unter der Hand Judas“ bezeichnet politische Gewalt oder Kontrolle. Die dynamische Wiedergabe vermittelt die Bedeutung idiomatisch; der Wortlaut wird in der Fußnote dokumentiert.
- source_word: וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ
  choice: setzte einen eigenen König ein
  rationale: Der Hifil von מלך bedeutet hier, jemanden zum König zu machen bzw. als König einzusetzen. „einen eigenen König“ macht die wiedergewonnene politische Eigenständigkeit deutlich, die im Pronomen „über sie“ angelegt ist.
