  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: de
  text: Er folgte dem Weg der Könige von Israel, wie das Haus Ahabs getan hatte, denn Ahabs Tochter war seine Frau; und er tat, was in den Augen Jahwes böse war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Er lebte nach dem Vorbild
  rationale: Die Verbindung »gehen auf dem Weg« bezeichnet hier die Lebensführung. Die Wiedergabe vermittelt den idiomatischen Sinn in natürlichem modernem Deutsch, während »Vorbild« die Nachahmung der israelitischen Könige ausdrückt.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: Die Genitivverbindung bezeichnet die Herrscher des Nordreichs als moralisches Muster.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: wie es das Haus Ahabs getan hatte
  rationale: »Haus« bezeichnet im königlichen Zusammenhang Ahabs Dynastie beziehungsweise Familie; die traditionelle Metapher bleibt verständlich erhalten.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für seine Orientierung am Haus Ahab ein.
- source_word: בַּת אַחְאָב הָיְתָה לּוֹ לְאִשָּׁה
  choice: Ahabs Tochter war seine Frau
  rationale: Die hebräische Wendung bezeichnet hier den bestehenden Ehestand und wird idiomatisch und knapp wiedergegeben.
- source_word: וַיַּעַשׂ הָרַע
  choice: So tat er, was böse war
  rationale: Die geläufige Bewertungsformel wird so wiedergegeben, dass der substantivierte Ausdruck הָרַע erkennbar bleibt; »So« bindet die abschließende Aussage natürlich an die Begründung an.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Metapher der göttlichen Beurteilung bleibt erhalten; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Gottesnamen in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Weg-Metapher wird zugunsten einer unmittelbar verständlichen Aussage über die Lebensführung idiomatisch wiedergegeben; »Haus Ahabs« und »in den Augen Jahwes« bewahren zentrale Bildsprache des Ausgangstextes.
