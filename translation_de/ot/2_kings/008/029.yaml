base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: de
  text: Da kehrte König Joram nach Jesreel zurück, um sich von den Wunden zu erholen, die ihm die Aramäer bei Rama zugefügt hatten, als er gegen Hasaël, den König von Aram, kämpfte. Und Ahasja, der Sohn Jehorams, des Königs von Juda, zog hinab, um Joram, den Sohn Ahabs, in Jesreel zu besuchen[a], denn er war krank.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um Joram zu sehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte ... zurück
  rationale: שׁוב bezeichnet in der fortlaufenden Erzählung Jorams Rückkehr vom Kampf nach Jesreel.
- source_word: לְהִתְרַפֵּא
  choice: um sich ... zu erholen
  rationale: Der Hitpael von רפא bezeichnet hier die Genesung von erlittenen Verwundungen; die deutsche Wendung ist natürlich, ohne eine eigenmächtige Selbstheilung anzudeuten.
- source_word: מִן הַמַּכִּים
  choice: von den Wunden
  rationale: מַכִּים meint wörtlich Schläge, bezeichnet im militärisch-medizinischen Zusammenhang jedoch die dadurch entstandenen Wunden.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: die ihm die Aramäer ... zugefügt hatten
  rationale: Die Formulierung gibt natürlich wieder, dass die Aramäer ihm die zuvor genannten Wunden beigebracht hatten.
- source_word: בָּרָמָה
  choice: bei Rama
  rationale: Die Präposition ב bezeichnet hier den Ort des Kampfes; „bei Rama“ ist im Deutschen eine natürliche Ortsangabe.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: als er gegen Hasaël ... kämpfte
  rationale: Der Infinitiv mit ב bezeichnet den zeitlichen Begleitumstand; bei נלחם gibt „gegen“ den gegnerischen Bezug idiomatisch wieder.
- source_word: וַאֲחַזְיָהוּ ... יָרַד
  choice: Und Ahasja ... zog hinab
  rationale: „Zog hinab“ bewahrt die Richtungsangabe von ירד und passt zum erhöht gelegenen Ausgangsgebiet Juda/Jerusalem.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: um Joram ... zu besuchen
  rationale: Wörtlich steht „um Joram zu sehen“; im Zusammenhang mit seiner Krankheit bezeichnet dies idiomatisch einen Krankenbesuch.
- source_word: כִּי חֹלֶה הוּא
  choice: denn er war krank
  rationale: חֹלֶה beschreibt Jorams gegenwärtigen Zustand als krank beziehungsweise leidend, auch wenn die Ursache seine Verwundungen waren.
