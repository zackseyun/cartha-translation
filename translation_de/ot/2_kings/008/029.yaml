translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Erzählsyntax. Die antiken Volks- und Landesbezeichnungen werden als „Aramäer“ und „Aram“ wiedergegeben. Die Namensform „Joram“ wird für beide im Hebräischen unterschiedlich geschriebene Varianten (יוֹרָם / יְהוֹרָם) verwendet, wie im deutschen Bibelgebrauch üblich; die Abstammungsangaben verhindern Verwechslungen.
