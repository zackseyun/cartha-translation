  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: de
  text: 'Da ging Hasaël ihm entgegen und nahm ein Geschenk mit, nämlich alles, was Damaskus an Kostbarem zu bieten hatte – eine Last, die vierzig Kamele tragen konnten. Er kam, trat vor ihn und sagte: »Dein Sohn[a] Ben-Hadad, der König von Aram, hat mich zu dir gesandt mit der Frage: ›Werde ich von dieser Krankheit genesen?‹[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dein Sohn“ ist eine ehrerbietige, demütige Selbstbezeichnung gegenüber einem Höhergestellten und bezeichnet nicht unbedingt ein tatsächliches Sohnverhältnis.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Werde ich von dieser Krankheit leben?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: ihm entgegen
  rationale: Die Verbindung bezeichnet das Hingehen, um jemandem zu begegnen; »ihm entgegengehen« bewahrt Richtung und Erzählbewegung.
- source_word: מִנְחָה
  choice: ein Geschenk
  rationale: Im diplomatischen Zusammenhang ist ein Ehrengeschenk gemeint, kein kultisches Opfer; »Tribut« würde politische Unterordnung zu stark festlegen.
- source_word: בְיָדוֹ
  choice: mit
  rationale: Wörtlich »in seiner Hand« ist hier eine hebräische Wendung für das Mitführen. Natürliches Deutsch verlangt keine Vorstellung, Hasaël habe die Last eigenhändig getragen.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: nämlich das Beste, was Damaskus zu bieten hatte
  rationale: טוּב bezeichnet hier die guten beziehungsweise erlesenen Erzeugnisse oder Waren aus Damaskus. »Nämlich« gibt die erläuternde, appositionelle Funktion natürlich wieder.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: eine Last für vierzig Kamele
  rationale: Die Wendung beschreibt eine Warenmenge, die vierzig Kamele tragen konnten, ohne zu behaupten, jedes Tier habe nur einen einzelnen Gegenstand getragen.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: trat vor ihn
  rationale: Die übliche Audienzformel wird in natürlichem Deutsch als formelles Vortreten vor Elisa wiedergegeben.
- source_word: בִּנְךָ
  choice: Dein Sohn
  rationale: Die wörtliche Verwandtschaftsmetapher wird bewahrt; im Kontext ist sie eine ehrerbietige Selbstbezeichnung beziehungsweise Anrede gegenüber einem Höhergestellten.
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: hat mich zu dir gesandt und lässt fragen
  rationale: Die formelhafte Einleitung direkter Rede wird idiomatisch wiedergegeben, während Auftrag und Frage klar erhalten bleiben.
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: Werde ich von dieser Krankheit genesen?
  rationale: Das Verb bedeutet wörtlich »leben«, fragt in Verbindung mit der Krankheit jedoch danach, ob der König sie überleben beziehungsweise von ihr genesen wird.
- source_word: אֲרָם
  choice: Aram
  rationale: Der historische Landesname wird beibehalten und nicht durch die spätere geografische Bezeichnung »Syrien« ersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Erzählsyntax. Die ungewöhnliche Größenangabe und die ehrerbietige Bezeichnung »Dein Sohn« bleiben im Haupttext erhalten. Der Marker steht unmittelbar nach der betreffenden Frage.
