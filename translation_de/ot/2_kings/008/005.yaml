  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: de
  text: 'Während Gehasi dem König gerade erzählte, wie Elisa den Toten wieder zum Leben erweckt hatte,[a] siehe, da rief die Frau, deren Sohn er wieder zum Leben erweckt hatte, den König wegen ihres Hauses und ihres Feldes eindringlich an.[b] Da sagte Gehasi: »Mein Herr und König, das ist die Frau, und das ist ihr Sohn, den Elisa wieder zum Leben erweckt hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wie er den Toten lebendig gemacht hatte“. Das hebräische Verb ist die kausative Form von „leben“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische „Siehe!“ hebt hervor, dass die Frau überraschend genau in diesem Augenblick beim König vorstellig wurde.
    reason: discourse_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: Während Gehasi dem König gerade erzählte
  rationale: Die Konstruktion mit היה und Partizip bildet eine laufende Begleithandlung ab. „Während … gerade“ gibt den zeitlichen Rahmen natürlich wieder; der Name Gehasi wird aus dem unmittelbaren Kontext als eindeutiges Subjekt eingesetzt.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: wie Elisa den Toten wieder zum Leben erweckt hatte
  rationale: Das Hifil von חיה bedeutet „leben lassen, wieder zum Leben bringen“. „Wieder zum Leben erwecken“ bewahrt die kausative Bedeutung; „den Toten“ folgt der singularischen Form des Hebräischen. Elisa wird zur Vermeidung eines im Deutschen missverständlichen Pronomens ausdrücklich genannt.
- source_word: וְהִנֵּה
  choice: kam genau da
  rationale: הנה hebt das überraschende zeitliche Zusammentreffen lebhaft hervor. „Genau da“ vermittelt diese narrative Wirkung in natürlichem modernem Deutsch.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: die Frau, deren Sohn er wieder zum Leben erweckt hatte
  rationale: Die hebräische Relativkonstruktion wird idiomatisch mit „deren Sohn“ wiedergegeben, ohne ihren Sinn zu verändern.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: flehte den König … um Hilfe an
  rationale: צעק bezeichnet hier den dringlichen Hilferuf beziehungsweise Rechtsappell an den König. Die Formulierung wahrt die Dringlichkeit und ist im Deutschen natürlicher als ein wörtliches „schrie zum König“.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: wegen ihres Hauses und ihres Feldes
  rationale: עַל bezeichnet den Gegenstand ihres Hilferufs. שדה wird konkret als „Feld“ übersetzt, nicht verallgemeinernd als „Land“.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mein Herr und König
  rationale: Die respektvolle höfische Anrede wird würdig und verständlich wiedergegeben. Das „und“ macht die Anrede im modernen Deutschen flüssig, ohne einen zusätzlichen Titel einzuführen.
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: das ist die Frau, und das ist ihr Sohn
  rationale: Die Demonstrativpronomen identifizieren unmittelbar die anwesenden Personen; die Wiederholung entspricht dem Nachdruck des Hebräischen.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: den Elisa wieder zum Leben erweckt hat
  rationale: Die Wendung gibt dasselbe Verb konsistent wieder. Im direkten Hinweis auf die Anwesenden ist das deutsche Perfekt natürlich.
