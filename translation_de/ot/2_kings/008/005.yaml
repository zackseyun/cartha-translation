  to: 'Während Gehasi dem König gerade erzählte, wie Elisa den Toten wieder zum Leben erweckt hatte,[a] siehe, da rief die Frau, deren Sohn er wieder zum Leben erweckt hatte, den König wegen ihres Hauses und ihres Feldes eindringlich an.[b] Da sagte Gehasi: »Mein Herr und König, das ist die Frau, und das ist ihr Sohn, den Elisa wieder zum Leben erweckt hat.«'
