  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: de
  text: Und im fünften Regierungsjahr Jorams, des Sohnes Ahabs, des Königs von Israel, als Joschafat König von Juda war[a], begann Jehoram[b], der Sohn Joschafats, als König von Juda zu regieren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und Joschafat, der König von Juda“. Die hebräische Satzfügung ist knapp; manche verstehen sie als Hinweis auf eine Zeit der Mitregentschaft.'
    reason: alternative_reading
  - marker: b
    text: 'Im Hebräischen stehen zwei eng verwandte, aber verschieden geschriebene Namensformen: „Joram“ für den König von Israel und „Jehoram“ für den Sohn Joschafats, den König von Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: Und im fünften Regierungsjahr
  rationale: Die Wendung leitet eine chronologische Königsnotiz ein. „Regierungsjahr“ verdeutlicht im Deutschen knapp, dass das Jahr nach der Herrschaft eines Königs gezählt wird; „Und“ bewahrt die narrative Verknüpfung.
- source_word: לְ/יוֹרָם בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: Jorams, des Sohnes Ahabs, des Königs von Israel
  rationale: Der Dativpräfix bezeichnet hier das nach Joram berechnete Regierungsjahr. Patronym und Königstitel werden vollständig und eindeutig wiedergegeben.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: als Joschafat König von Juda war
  rationale: Die hebräische Nominalklausel ist stark verdichtet. Die temporale Wiedergabe ist im Deutschen verständlich, ohne eine Mitregentschaft ausdrücklich zu behaupten.
- source_word: מָלַךְ
  choice: begann … zu regieren
  rationale: In der Königsnotiz bezeichnet das Verb den Regierungsantritt, nicht lediglich den gesamten Verlauf der Herrschaft.
- source_word: יְהוֹרָם
  choice: Jehoram
  rationale: Die Form „Jehoram“ unterscheidet diesen judäischen König sichtbar von „Joram“ (יוֹרָם), dem zuvor genannten König Israels.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: der Sohn Joschafats, als König von Juda
  rationale: Abstammung und Herrschaftsgebiet bleiben erhalten; die Einbindung mit „als“ ergibt im Deutschen einen natürlichen Satz und bezieht den Königstitel eindeutig auf Jehorams Regierungsantritt.
theological_decisions:
- issue: Verdichtete chronologische Aussage über Joschafats Herrschaft und Jehorams Regierungsantritt
  choice: Die Nominalklausel wird temporal mit „als Joschafat König von Juda war“ wiedergegeben.
  alternative: 'Wörtlicher: „und Joschafat, der König von Juda“; deutender: ausdrücklicher Hinweis auf eine Mitregentschaft.'
  rationale: Der hebräische Text nennt keine Mitregentschaft ausdrücklich. Die zeitliche Wiedergabe macht den naheliegenden Satzbezug verständlich, ohne die chronologische Spannung durch eine zusätzliche historische Annahme aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle deutsche Namensform „Joschafat“ wird verwendet; „Joram“ und „Jehoram“ werden zur Abbildung der unterschiedlichen hebräischen Formen bewusst unterschieden. Die Wiederholung der Königstitel bleibt sachlich erhalten, wird aber syntaktisch natürlich eingebunden.
