  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: de
  text: Doch der HERR wollte Juda nicht vernichten, um Davids, seines Dieners, willen, wie er ihm zugesagt hatte, ihm und seinen Söhnen allezeit eine Leuchte zu geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Leuchte ist hier ein Bild für den Fortbestand der davidischen Königslinie.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Doch ... wollte ... nicht
  rationale: Die Verbindung ist im Zusammenhang adversativ; אָבָה bezeichnet Wollen bzw. Bereitsein und nicht bloß eine zukünftige Weigerung.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms als hervorgehobener Titel ist würdig, geläufig und macht die besondere hebräische Gottesbezeichnung kenntlich.
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: Juda ... vernichten
  rationale: Der Hifil-Infinitiv von שׁחת bezeichnet hier vernichtendes göttliches Gericht über Juda.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: um seines Dieners David willen
  rationale: Die Formulierung gibt den Beweggrund aus Rücksicht auf David wieder und bewahrt dessen Bezeichnung als Gottes Diener.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: wie er ihm zugesagt hatte
  rationale: אָמַר bedeutet wörtlich „sagen“; im Rückblick auf die bindende Davidverheißung drückt „zusagen“ die kontextuelle Funktion im natürlichen Deutschen aus.
- source_word: נִיר
  choice: eine Leuchte
  rationale: Das konkrete Bild wird bewahrt; im königlichen Zusammenhang steht es für das Fortbestehen des davidischen Hauses.
- source_word: לְבָנָיו
  choice: unter seinen Nachkommen
  rationale: Wörtlich steht „für seine Söhne“. Im Kontext der Thronfolge bezeichnet der Ausdruck Davids fortgesetzte Nachkommenschaft; „unter“ vermeidet die missverständliche Vorstellung, die Leuchte sei lediglich zu deren Nutzen gegeben.
- source_word: כָּל־הַיָּמִים
  choice: für alle Zeit
  rationale: Die idiomatische Wendung bedeutet eine ununterbrochene, bleibende Dauer; die deutsche Formulierung ist natürlich, ohne das Bild unnötig wörtlich abzubilden.
theological_decisions:
- issue: Das dynastische Bild נִיר
  choice: eine Leuchte
  alternative: ein Licht; ein fortbestehendes Königshaus
  rationale: Die Metapher bleibt im Text erhalten, damit der Bezug zur davidischen Verheißung nicht durch eine erklärende Paraphrase ersetzt wird.
- issue: Bezug von לְבָנָיו
  choice: unter seinen Nachkommen
  alternative: für seine Söhne
  rationale: Die Übersetzung macht den dynastischen Zusammenhang verständlich, während die Fußnote die engere Form des Hebräischen dokumentiert.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH; Jahwe
  rationale: Die konventionelle deutsche Wiedergabe wahrt die besondere Kennzeichnung des Gottesnamens und bleibt für gewöhnliche Leser vertraut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „um ... willen“ passt zum biblischen Erzählregister; „Leuchte“ bewahrt das königliche Bild, während die Fußnote dessen Bedeutung erklärt.
