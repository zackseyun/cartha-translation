- from: Doch der HERR wollte Juda nicht vernichten, um seines Dieners David willen, wie er ihm zugesagt hatte, ihm für alle Zeit eine Leuchte unter seinen Nachkommen zu geben.[a]
  to: Doch der HERR wollte Juda nicht vernichten, um Davids, seines Dieners, willen, wie er ihm zugesagt hatte, ihm und seinen Söhnen allezeit eine Leuchte zu geben.[a]
  rationale: Die Revision ersetzt die interpretierende Wendung „unter seinen Nachkommen“ durch eine dem Hebräischen nähere, im Deutschen natürliche Wiedergabe. Das Bild der Leuchte bleibt im Haupttext erhalten; seine dynastische Funktion wird ausschließlich in der Fußnote erklärt. Die Satzstruktur mit „zugesagt hatte“ ist im Kontext der Davidverheißung idiomatisch und wahrt den Zusagecharakter, ohne eine zusätzliche theologische Deutung einzutragen.
