base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: de
  text: Er zog mit Joram, dem Sohn Ahabs, in den Krieg gegen Hasaël, den König von Aram, bei Ramot-Gilead. Die Aramäer verwundeten Joram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Aramäer schlugen Joram.« Das hebräische Verb kann allgemein »schlagen« bedeuten; der weitere Zusammenhang und der Parallelbericht sprechen hier für eine Verwundung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אֶת יוֹרָם
  choice: Er zog mit Joram
  rationale: הלך bezeichnet hier das Ziehen in den Krieg; אֵת markiert nach dem Bewegungsverb die Begleitung. „zog“ klingt im militärischen Zusammenhang natürlicher als das allgemeinere „ging“.
- source_word: לַמִּלְחָמָה עִם חֲזָהאֵל
  choice: in den Krieg gegen Hasaël
  rationale: Die Wendung bezeichnet den Kriegszug; עִם hat im Kampfzusammenhang adversative Bedeutung und wird daher mit „gegen“ wiedergegeben.
- source_word: מֶלֶךְ אֲרָם
  choice: König von Aram
  rationale: „Aram“ gibt die hebräische ethnogeografische Bezeichnung unmittelbar wieder; das traditionelle „Syrien“ wäre weniger quellennah.
- source_word: בְּרָמֹת גִּלְעָד
  choice: bei Ramot-Gilead
  rationale: Die Präposition bezeichnet hier den Ort des Kampfes; „bei“ ist für einen Kriegsschauplatz idiomatisch.
- source_word: וַיַּכּוּ אֲרַמִּים אֶת יוֹרָם
  choice: Dort verwundeten die Aramäer Joram
  rationale: נכה kann allgemein „schlagen“ bedeuten; der Fortgang der Erzählung zeigt, dass Joram verletzt wurde und nicht fiel. „Dort“ stellt im Deutschen den Bezug zum genannten Schlachtort klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Eigennamen werden quellennah als Hasaël, Aram, Ramot-Gilead und Joram wiedergegeben. Die Satzteilung erhöht die Verständlichkeit, ohne einen neuen inhaltlichen Zusammenhang einzuführen.
