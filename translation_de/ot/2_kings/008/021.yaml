base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: de
  text: Da zog Joram mit allen Streitwagen nach Zair[a]. In der Nacht stand er auf und schlug die Edomiter, die ihn umzingelten, und die Befehlshaber der Streitwagen. Doch das Volk floh zu seinen Zelten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vielleicht ist „nach Seïr“ zu lesen. Der hebräische Ortsname ist an dieser Stelle unsicher; möglicherweise handelt es sich nicht um einen eigenen Ort namens Zair, sondern um eine Form, die mit Seïr beziehungsweise Edom zusammenhängt.
    reason: alternative_reading
  - marker: b
    text: „Zu seinen Zelten fliehen“ ist eine hebräische Wendung dafür, dass sich die Beteiligten zerstreuten und nach Hause zurückkehrten.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: zog ... nach
  rationale: עבר bezeichnet hier die militärische Bewegung zu einem Ort. Im Deutschen ist „zog nach“ natürlicher als das räumlich unbestimmte „ging hinüber“, ohne eine bestimmte Route vorauszusetzen.
- source_word: צָעִירָה
  choice: nach Zair
  rationale: Die masoretische Punktierung legt einen Ortsnamen mit direktionalem ה nahe. Die schwierige mögliche Beziehung zu Seïr wird in einer Fußnote bewahrt.
- source_word: כָל הָרֶכֶב
  choice: alle Streitwagen
  rationale: רכב kann die Streitwagen oder kollektiv die Streitwagentruppe bezeichnen. „Alle Streitwagen“ bleibt nahe am Wortlaut und ist im militärischen Zusammenhang verständlich.
- source_word: קָם לַיְלָה
  choice: In der Nacht stand er auf
  rationale: Die Formulierung wahrt die nächtliche Handlung und die Erzählfolge, ohne das Verb zu „brach auf“ oder „griff an“ auszudeuten.
- source_word: וַיַּכֶּה
  choice: schlug
  rationale: נכה bezeichnet allgemein ein Schlagen oder Niederschlagen. „Schlug“ behauptet keinen vollständigen Sieg.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: die Edomiter, die ihn umzingelt hatten
  rationale: Das kollektive „Edom“ meint hier die edomitischen Streitkräfte; der substantivierte Ausdruck הַסֹּבֵיב beschreibt ihre Umzingelung Jorams.
- source_word: שָׂרֵי הָרֶכֶב
  choice: die Befehlshaber der Streitwagen
  rationale: שׂרים bezeichnet hier militärische Führer; die Konstruktion wird transparent wiedergegeben.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: das Kriegsvolk floh zu seinen Zelten
  rationale: העם bezeichnet im militärischen Kontext das aufgebotene Volk beziehungsweise die Truppen. Das kollektive Singularpronomen des Hebräischen bleibt als „seinen“ erhalten; das Zeltbild wird nicht durch „nach Hause“ ersetzt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die knappe militärische Abfolge des Hebräischen bleibt erhalten; „Kriegsvolk“ macht den kontextuellen Bezug von העם deutlich, ohne es eng mit „Soldaten“ gleichzusetzen.
