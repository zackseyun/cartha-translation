revisions:
- from: Da zog Joram mit allen Streitwagen nach Zair[a]. In der Nacht stand er auf und schlug die Edomiter, die ihn umzingelt hatten, und die Befehlshaber der Streitwagen. Doch das Kriegsvolk floh zu seinen Zelten.[b]
  to: Da zog Joram mit allen Streitwagen nach Zair[a]. In der Nacht stand er auf und schlug die Edomiter, die ihn umzingelten, und die Befehlshaber der Streitwagen. Doch das Volk floh zu seinen Zelten.[b]
  rationale: Die Revision beseitigt eine nicht vom hebräischen Partizip geforderte Vorzeitigkeit, ersetzt das unnatürlich markierte „Kriegsvolk“ durch das quellennähere „Volk“ und neutralisiert die Erklärung der idiomatischen Wendung. Ortsnamen, militärische Terminologie und die textkritische Ambiguität von Zair/Seïr bleiben erhalten.
