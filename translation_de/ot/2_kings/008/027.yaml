id: 2KI.8.27
reference: 2 Kings 8:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ בֵּ֣ית אַחְאָ֔ב וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּ֛י חֲתַ֥ן בֵּית אַחְאָ֖ב הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: de
  text: Er lebte nach der Art des Hauses Ahabs und tat, was böse war in den Augen Jahwes, wie das Haus Ahabs; denn er war mit dem Haus Ahabs verschwägert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Schwiegersohn des Hauses Ahabs«. Das hebräische Wort kann einen Schwiegersohn oder allgemeiner einen durch Heirat verbundenen Mann bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Er lebte nach der Art
  rationale: Die Verbindung »auf einem Weg gehen« beschreibt hier die Lebensführung. Die Wiedergabe wahrt den Verhaltensbezug in natürlichem modernem Deutsch.
- source_word: בֵּית אַחְאָב
  choice: das Haus Ahabs
  rationale: בַּיִת bezeichnet hier die Familie beziehungsweise Dynastie Ahabs; die biblische Wendung »Haus Ahabs« lässt beide Aspekte offen.
- source_word: וַיַּעַשׂ הָרַע
  choice: und tat, was böse war
  rationale: Dies gibt die feste Bewertungsformel der Königsbücher idiomatisch wieder, ohne ihre moralische Aussage abzuschwächen.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die Formulierung bewahrt das hebräische Bild göttlicher Beurteilung; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: כְּבֵית אַחְאָב
  choice: wie das Haus Ahabs
  rationale: Die knappe Vergleichsform bleibt erhalten und bezieht seine Lebensführung und sein böses Handeln auf Ahabs Haus.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Bewertung ein.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: mit dem Haus Ahabs verschwägert
  rationale: חֲתַן kann einen Schwiegersohn oder allgemeiner eine durch Heirat begründete Verwandtschaft bezeichnen. »Verschwägert« bewahrt diese lexikalische Weite; der genauere Bezug wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. »Jahwe« gibt den persönlichen Gottesnamen in geläufiger deutscher Form wieder.
- issue: Beziehung zum Haus Ahabs
  choice: mit dem Haus Ahabs verschwägert
  alternative: ein Schwiegersohn des Hauses Ahabs
  rationale: Der Kontext legt eine Heiratsverbindung nahe, während חֲתַן sprachlich sowohl den Schwiegersohn als auch eine weiter gefasste Heiratsverwandtschaft bezeichnen kann. Die Hauptfassung erhält diese Ambiguität.
translation_notes:
  register: Moderne, würdige Erzählsprache. »Haus Ahabs« und »in den Augen Jahwes« bewahren zentrale hebräische Bilder; »lebte nach der Art« vermittelt den idiomatischen Sinn von »ging auf dem Weg« verständlich.
