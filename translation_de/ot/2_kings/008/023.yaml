  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Die übrigen Taten Jorams und alles, was er tat – sind sie nicht im Buch der Chroniken der Könige von Juda[a] aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Buch der Annalen der Könige von Juda“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Die übrigen Taten
  rationale: יֶתֶר bezeichnet den Rest oder das Übrige; דִּבְרֵי meint in dieser königlichen Schlussformel die berichteten Taten beziehungsweise Angelegenheiten des Königs. Die deutsche Formulierung ist knapp und idiomatisch.
- source_word: יוֹרָם
  choice: Jorams
  rationale: „Joram“ ist die im Deutschen übliche Wiedergabe des hebräischen Namens יוֹרָם und bewahrt dessen Lautgestalt.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die Formulierung gibt die umfassende Relativkonstruktion direkt und in natürlichem Deutsch wieder.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgeschrieben?
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. Das Pluralpronomen הֵם wird durch „sie“ aufgenommen; „aufgeschrieben“ entspricht כְּתוּבִים.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Wörtlich steht „auf dem Buch/der Schriftrolle“; bei einem Verweis auf den Inhalt eines Schriftwerks ist „im Buch“ im Deutschen idiomatisch.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Buch der Chronik der Könige von Juda
  rationale: Die Wendung bezeichnet das königliche Geschichtswerk beziehungsweise die Annalen, die sich auf die Könige von Juda beziehen. „Chronik“ erhält die traditionelle historiografische Bezeichnung, ohne das Werk mit dem späteren kanonischen Buch gleichzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die formelhafte Sprache des hebräischen Königsberichts bleiben erhalten. Der einleitende Konnektor וְ wird nicht eigens mit „und“ wiedergegeben, da dies am Versanfang im Deutschen schwerfällig wäre und seine verbindende Funktion durch den Kontext getragen wird.
