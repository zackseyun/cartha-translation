base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: de
  text: Am nächsten Tag nahm er die Decke[a], tauchte sie ins Wasser und breitete sie über sein Gesicht, und er starb.[b] Und Hasaël wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bettdecke«, »Überwurf« oder »Geflecht«. Das hebräische Wort ist selten; welche Art von Decke oder Gewebe gemeint ist, bleibt ungewiss.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen wird nicht ausdrücklich gesagt, wer die vorausgehenden Handlungen ausführt. Im Zusammenhang wird meist Hasaël als Subjekt verstanden; namentlich genannt wird er jedoch erst im letzten Satzteil.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Am nächsten Tag
  rationale: Die Zeitangabe bezeichnet den auf die vorherigen Ereignisse folgenden Tag; die Formulierung ist natürlich und wahrt die Erzählfolge.
- source_word: הַמַּכְבֵּר
  choice: die Decke
  rationale: Das seltene Substantiv bezeichnet offenbar ein zum Bedecken dienendes Gewebe. »Decke« ist verständlich, ohne die genaue, unsichere Beschaffenheit festzulegen; Alternativen stehen in der Fußnote.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: tauchte sie ins Wasser
  rationale: Das Verb bezeichnet das Eintauchen; die Formulierung gibt Handlung und Medium unmittelbar wieder.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: breitete sie über sein Gesicht
  rationale: Das Verb bedeutet ausbreiten oder darüberlegen. Die Wiedergabe erhält die konkrete Handlung und lässt die pronominale Mehrdeutigkeit bestehen.
- source_word: וַיָּמֹת
  choice: da starb er
  rationale: Die Form führt die Erzählung fort. »Da« drückt die unmittelbare zeitliche Folge aus, ohne ausdrücklich einen Zweck oder eine über den Kontext hinausgehende Kausalbeziehung zu behaupten.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: Und Hasaël wurde an seiner Stelle König
  rationale: Die Wendung bezeichnet Hasaëls Thronbesteigung und Nachfolge; modernes Deutsch gibt sie idiomatisch mit »wurde König« wieder.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt der Verben »nahm«, »tauchte« und »breitete«
  choice: Im Haupttext steht nur das Pronomen »er«; Hasaël wird nicht vorzeitig als Handelnder benannt.
  alternative: Das Subjekt ausdrücklich als Hasaël identifizieren oder einen ungenannten Diener annehmen.
  rationale: Die hebräischen Verbformen enthalten lediglich ein maskulines Singularsubjekt, dessen Name erst im abschließenden Satz genannt wird. Der Zusammenhang legt für viele Hasaël nahe, doch die sprachliche Offenheit des Verses soll erhalten bleiben.
- issue: Verhältnis zwischen dem Auflegen der nassen Decke und dem Tod
  choice: »da starb er« als unmittelbare Erzählfolge
  alternative: »sodass er starb« als ausdrücklich kausale oder resultative Wiedergabe; alternativ schlicht »und er starb«
  rationale: Das hebräische וַ führt zunächst die Handlungskette weiter und markiert nicht eigens Zweck oder Folge. »Da« klingt im Deutschen flüssig, ohne die grammatische Verbindung stärker festzulegen als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählweise. Die seltene Sachbezeichnung wird verständlich wiedergegeben und erläutert; die im Hebräischen bestehende Unklarheit über den Handelnden bleibt im Haupttext gewahrt.
