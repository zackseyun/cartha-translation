  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: de
  text: Er richtete sein Gesicht fest und hielt es so, bis er sich schämte[a], und der Mann Gottes weinte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis Hasaël sich schämte“. Im Hebräischen ist weniger eindeutig als im Deutschen, wer sich schämte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: Er hielt sein Gesicht unbewegt
  rationale: Die Hifil-Form von עמד mit „sein Gesicht“ als Objekt beschreibt hier ein Festhalten beziehungsweise Unbeweglichhalten des Gesichts. Die Wiedergabe bewahrt das hebräische Bild, ohne die im Deutschen unnatürliche Formulierung „ließ sein Gesicht stehen“ zu verwenden.
- source_word: וַיָּשֶׂם
  choice: und verharrte so
  rationale: שׂים bedeutet grundsätzlich „setzen/stellen/legen“. Ohne ausdrückliches Objekt führt das Verb hier wahrscheinlich den Gedanken der unbewegten Haltung fort. „Verharrte so“ gibt den Zusammenhang natürlich wieder, ohne ein nicht genanntes Objekt einzuführen.
- source_word: עַד־בֹּשׁ
  choice: bis er sich schämte
  rationale: בוש bezeichnet Scham oder Beschämung. Das Pronomen „er“ bewahrt die im Hebräischen nicht eindeutig aufgelöste Frage, wer die Scham empfand.
- source_word: וַיֵּבְךְּ
  choice: weinte
  rationale: בכה bedeutet „weinen“. Die schlichte Form entspricht dem ernsten Ton der Szene.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Der feste hebräische Titel wird wörtlich und traditionsgemäß wiedergegeben, statt ihn deutend durch „der Prophet“ zu ersetzen.
theological_decisions:
- issue: Wer in עַד־בֹּשׁ Scham empfindet
  choice: Die Mehrdeutigkeit bleibt durch „bis er sich schämte“ erhalten.
  alternative: „bis Hasaël sich schämte“ oder ausdrücklich „bis Elisa sich schämte“
  rationale: Der hebräische Text nennt an dieser Stelle kein ausdrückliches Subjekt, das die Deutung zweifelsfrei festlegt. Eine namentliche Festlegung würde eine mögliche Lesart in den Haupttext eintragen und die erzählerische Spannung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sein Gesicht unbewegt halten“ bewahrt die konkrete hebräische Bildsprache; „verharrte so“ vermeidet eine hölzerne Wiederholung. Der kurze Schlusssatz hebt den Gefühlsumschwung hervor.
