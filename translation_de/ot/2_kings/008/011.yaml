  source_fidelity: Der Entwurf gibt die Abfolge aus dem Festhalten/Ausrichten des Gesichts, dem anschließenden Verharren bis zur Beschämung und dem Weinen des Mannes Gottes im Wesentlichen wieder. „Da“ legt jedoch einen zeitlich-folgernden Zusammenhang stärker nahe als die einfache hebräische Reihung mit וְ.
  naturalness: „Sein Gesicht unbewegt halten“ ist verständlich, klingt im modernen Deutschen aber etwas mechanisch. „Sein Gesicht fest richten“ bewahrt das konkrete Bild und ist idiomatischer. Die Wiederaufnahme „und hielt es so“ macht die elliptische Fortführung des hebräischen Ausdrucks nachvollziehbar, ohne ein neues Objekt einzuführen.
