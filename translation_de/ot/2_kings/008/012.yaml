id: 2KI.8.12
reference: 2 Kings 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: de
  text: 'Hasaël fragte: „Warum weint mein Herr?“ Er antwortete: „Weil ich weiß, was für Böses du den Israeliten[a] antun wirst: Ihre Festungen wirst du in Brand stecken[b], ihre jungen Männer mit dem Schwert töten, ihre kleinen Kinder zerschmettern und ihre schwangeren Frauen aufschlitzen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“; gemeint sind die Israeliten beziehungsweise das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Ihre Festungen wirst du ins Feuer schicken“; auch: „ihre befestigten Orte niederbrennen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Respektvolle Anrede Hasaëls an Elisa, nicht Gottesbezeichnung; „mein Herr“ bewahrt die soziale Ehrerbietung in natürlichem Deutsch.
- source_word: בֹכֶה
  choice: weint
  rationale: Das Partizip bezeichnet den andauernden Vorgang; im Deutschen ist das Präsens in der direkten Frage idiomatisch.
- source_word: כִּי יָדַעְתִּי
  choice: Weil ich weiß
  rationale: כִּי leitet die Begründung ein; das Perfekt יָדַעְתִּי hat hier gegenwärtige Relevanz und wird natürlich mit Präsens wiedergegeben.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: was für Böses du ... antun wirst
  rationale: Die deutsche Formulierung verbindet רָעָה sinnvoll mit dem Relativsatz und bewahrt sowohl den moralischen Ernst als auch die Zielrichtung לִבְנֵי יִשְׂרָאֵל.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die hebräische Wendung lautet formal „den Söhnen Israels“, bezeichnet hier aber kollektiv das Volk Israel; „den Israeliten“ ist präzise und modernes, natürliches Deutsch.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: Ihre Festungen wirst du in Brand stecken
  rationale: Die wörtliche Wendung „ins Feuer schicken“ ist im Deutschen unidiomatisch; „in Brand stecken“ gibt die konkrete Handlung und den militärischen Sinn von מִבְצָר klar wieder.
- source_word: וּבַחֻרֵיהֶם
  choice: ihre jungen Männer
  rationale: Das Substantiv bezeichnet junge Männer in ihrer Kraft, häufig im wehrfähigen Alter, ohne sie ausdrücklich nur als Krieger festzulegen.
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: mit dem Schwert töten
  rationale: Direkte, moderne Wiedergabe, die das Instrument und die Härte der Aussage bewahrt.
- source_word: עֹלְלֵיהֶם
  choice: ihre kleinen Kinder
  rationale: Der Ausdruck bezeichnet Kleinkinder beziehungsweise sehr junge Kinder; „kleine Kinder“ vermeidet eine unbelegte Verengung auf Säuglinge.
- source_word: תְּרַטֵּשׁ
  choice: zerschmettern
  rationale: Das Verb beschreibt brutales Zerschlagen oder Zerschmettern im Krieg; die knappe Wiedergabe erhält die erschütternde Bildhaftigkeit.
- source_word: הָרֹתֵיהֶם תְּבַקֵּעַ
  choice: ihre schwangeren Frauen aufschlitzen
  rationale: Die Wendung bezeichnet das gewaltsame Aufschneiden schwangerer Frauen. „Aufschlitzen“ ist im Deutschen konkret und bewahrt die bewusst drastische Aussage.
theological_decisions:
- issue: Wiedergabe von לִבְנֵי יִשְׂרָאֵל
  choice: den Israeliten
  alternative: den Söhnen Israels / dem Volk Israel
  rationale: Die grammatisch maskuline hebräische Idiomatik bezeichnet das Bundesvolk kollektiv. „Israeliten“ gibt den gemeinten Personenkreis ohne Missverständnis natürlich wieder; die formale Ausdrucksweise wird in der Fußnote offengelegt.
- issue: Explizite Gewaltdarstellung in der prophetischen Rede
  choice: Die einzelnen Gräueltaten unverhüllt und konkret wiedergeben
  alternative: Durch allgemeinere Ausdrücke wie „Schaden zufügen“ oder „angreifen“ abschwächen
  rationale: Der hebräische Text formuliert absichtlich drastisch. Eine Abschwächung würde den moralischen Ernst und den erschütternden Charakter von Elisas Vorhersage verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Dialogform bleibt knapp und unmittelbar. Die Gewalttaten werden entsprechend dem hebräischen Ausgangstext ohne beschönigende Umschreibung wiedergegeben; die Satzstellung in der Aufzählung unterstützt den ernsten prophetischen Ton.
