  verdict: revise
  source_fidelity: Die Zeitangabe, die Rückkehr aus dem Land der Philister sowie die beiden konkret genannten Besitztümer sind zutreffend wiedergegeben. Die Zielrichtung der Bitte an den König bleibt erhalten. Für צעק ist eine deutlich als dringlich erkennbare Bitte angemessener als das relativ abgeschwächte „sich hilfesuchend ... zu wenden“.
  naturalness: „Sie ging hin“ wirkt im modernen Standarddeutsch ohne ausdrücklich genanntes Ziel etwas unbestimmt. „Sie ging zum König“ ist idiomatischer und bündelt die erzählerische Bewegung mit ihrem Ziel. „Um Hilfe zu rufen“ ist als dringliche, aber nicht konfessionell oder rechtlich überbestimmte Petition natürlich.
  terminology: „Land der Philister“, „Haus“ und „Feld“ sind quellennah und sachgerecht. Die Fußnote sollte nicht eine erweiterte, syntaktisch umgestellte Umschreibung als „wörtlich“ ausgeben; die wörtliche Alternative kann auf die Verbverbindung beschränkt werden.
