base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: de
  text: Nach Ablauf der sieben Jahre kehrte die Frau aus dem Land der Philister zurück. Sie ging zum König, um wegen ihres Hauses und ihres Feldes um Hilfe zu rufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum König zu schreien“; auch: „beim König Klage zu erheben“ oder „den König um Hilfe anzuflehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: Nach Ablauf der sieben Jahre
  rationale: Die Verbindung bezeichnet idiomatisch das Ende des genannten Zeitraums. „Nach Ablauf“ gibt den zeitlichen Sinn in natürlichem Deutsch wieder.
- source_word: וַתָּשָׁב
  choice: kehrte … zurück
  rationale: שׁוּב bezeichnet hier die Rückkehr vom zuvor genannten Aufenthaltsort.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: das Land der Philister
  rationale: Die Formulierung folgt der konkreten hebräischen Bezeichnung und ist transparenter als der geografische Eigenname „Philistäa“.
- source_word: וַתֵּצֵא
  choice: Sie ging hin
  rationale: יָצָא bezeichnet ein Hinausgehen; „ging hin“ bewahrt die eigenständige Bewegung im Erzählablauf, ohne im Deutschen unnötig räumliche Einzelheiten zu behaupten.
- source_word: לִצְעֹק אֶל־הַמֶּלֶךְ
  choice: um sich … hilfesuchend an den König zu wenden
  rationale: צָעַק bedeutet wörtlich „schreien/rufen“, kann gegenüber einem Herrscher aber eine dringliche Bitte um Abhilfe oder Recht bezeichnen. Die Wiedergabe hält Dringlichkeit und Bittcharakter zusammen; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: בֵּיתָהּ
  choice: ihres Hauses
  rationale: בַּיִת bezeichnet hier neben dem Feld wahrscheinlich den konkreten Immobilienbesitz, nicht den Haushalt.
- source_word: שָׂדָהּ
  choice: ihres Feldes
  rationale: שָׂדֶה wird konkret als „Feld“ wiedergegeben und nicht zum allgemeineren „Land“ erweitert.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der erste Satz gibt die hebräische Zeitangabe idiomatisch wieder. Im zweiten Satz bleibt das Ziel des Hilferufs offen; eine ausdrückliche Forderung nach Rückgabe wird nicht ergänzt, da sie in diesem Vers nur aus dem Zusammenhang erschlossen werden kann.
