  - severity: medium
    issue: Die Fußnote kennzeichnet keine streng wörtliche Wiedergabe.
    rationale: Die als „Wörtlich“ eingeführte Formulierung fügt „wegen“ ein und ordnet die Satzglieder für das Deutsche um. Eine Fußnote sollte die wörtliche Alternative auf „zum König zu schreien“ beschränken und die idiomatischen Deutungen getrennt nennen.
