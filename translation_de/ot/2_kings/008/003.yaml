  to: Nach Ablauf der sieben Jahre kehrte die Frau aus dem Land der Philister zurück. Sie ging zum König, um wegen ihres Hauses und ihres Feldes um Hilfe zu rufen.[a]
  rationale: Die Revision macht die Bewegung zum König im Deutschen klarer und gibt der dringlichen Nuance von צעק mit „um Hilfe zu rufen“ stärker Rechnung. Die Besitzgegenstände und der Gegenstand der Bitte werden nicht erweitert. Die Fußnote bietet eine tatsächlich quellennähere wörtliche Verb-Alternative sowie idiomatische mögliche Deutungen.
