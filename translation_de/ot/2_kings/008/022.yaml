translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Herrschaftsbeziehung wird idiomatisch statt mit der im Deutschen ungebräuchlichen hebräischen Hand-Metapher wiedergegeben. »ist bis heute unabhängig« macht den fortdauernden Zustand deutlich, den die hebräische Zeitformel im Kontext voraussetzt.
