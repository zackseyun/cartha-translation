  text: וַ/יִּפְשַׁ֣ע אֱד֗וֹם מִ/תַּ֨חַת֙ יַד יְהוּדָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה אָ֛ז תִּפְשַׁ֥ע לִבְנָ֖ה בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/022.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: de
  text: So fiel Edom von der Herrschaft Judas ab[a]; das gilt bis heute. Auch Libna fiel damals ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »empörte sich gegen Juda« oder »brach von Judas Herrschaft los«. Das hebräische Verb bezeichnet hier politischen Aufstand beziehungsweise Abfall von einer Oberherrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: löste sich … aus der Herrschaft
  rationale: Das Verb פשע bezeichnet hier den politischen Aufstand beziehungsweise das Lossagen von einer bestehenden Oberherrschaft. Die Formulierung gibt den politischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: aus der Herrschaft Judas
  rationale: Die hebräische Wendung »unter der Hand Judas« bezeichnet Unterordnung unter Judas Macht. Im Deutschen vermittelt »aus der Herrschaft Judas« den idiomatischen Sinn klar, ohne eine unnatürliche Wendung mit »Hand« zu erzwingen.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis heute
  rationale: Die feste Zeitformel besagt, dass der entstandene Zustand aus Sicht des Erzählers fortbestand.
- source_word: אָז
  choice: Damals
  rationale: אָז verbindet den folgenden Vorgang zeitlich mit dem zuvor berichteten Geschehen; zusammen mit בָּעֵת הַהִיא ist »Damals« im Deutschen knapp und natürlich.
- source_word: תִּפְשַׁע
  choice: löste sich … von Juda
  rationale: Dasselbe Verb wie im ersten Satz bezeichnet auch hier politisches Lossagen. Die Ergänzung »von Juda« macht die im Kontext vorausgesetzte Herrschaftsbeziehung verständlich.
- source_word: לִבְנָה
  choice: Libna
  rationale: Der Ortsname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: בָּעֵת הַהִיא
  choice: Damals
  rationale: Die Zeitangabe bezeichnet denselben geschichtlichen Zeitpunkt. Im Zusammenspiel mit אָז vermeidet »Damals« die schwerfällige Doppelung »Dann … zu jener Zeit«.
