base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: de
  text: Im zwölften Jahr Jorams[a], des Sohnes Ahabs, des Königs von Israel, wurde Ahazja, der Sohn Jehorams, des Königs von Juda, König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen heißt der König von Israel „Joram“, der König von Juda dagegen „Jehoram“. Die beiden verwandten Namensformen werden in deutschen Übersetzungen mitunter beide als „Joram“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Im zwölften Jahr
  rationale: Die wörtlich ungewöhnliche hebräische Jahresformel bezeichnet idiomatisch das zwölfte Regierungsjahr; die gewählte Form ist im Deutschen natürlich und präzise.
- source_word: לְ/יוֹרָם
  choice: Jorams
  rationale: Das ל kennzeichnet in dieser Regierungsformel den König, nach dessen Regierungsjahren datiert wird; der deutsche Genitiv gibt dies knapp und idiomatisch wieder.
- source_word: בֶּן אַחְאָב
  choice: des Sohnes Ahabs
  rationale: Die patronymische Verbindung wird formal beibehalten und in die deutsche Apposition eingepasst.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Königs von Israel
  rationale: Der Königstitel wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: In Thronbesteigungsnotizen bezeichnet das Verb den Beginn der Herrschaft; diese Wiedergabe ist klarer als das möglicherweise durative „regierte“.
- source_word: אֲחַזְיָהוּ
  choice: Ahazja
  rationale: Der Personenname folgt der geläufigen deutschen biblischen Namensform.
- source_word: בֶן יְהוֹרָם
  choice: der Sohn Jehorams
  rationale: Die Form „Jehoram“ bildet die im Hebräischen gegenüber „Joram“ vorhandene längere Namensform ab und unterscheidet die beiden Könige im Vers.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Der Königstitel wird direkt und idiomatisch übersetzt.
