base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: de
  text: 'Dann kam Elisa nach Damaskus. Ben-Hadad, der König von Aram[a], war krank. Da wurde ihm berichtet: »Der Mann Gottes ist hierhergekommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Syrien. Im Hebräischen steht: Aram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dann kam
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Dann kam« gibt den Fortgang im Deutschen natürlich wieder.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: דַּמֶּשֶׂק
  choice: Damaskus
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: וּבֶן־הֲדַד
  choice: Ben-Hadad
  rationale: Der mit Waw angeschlossene Satz liefert Hintergrundinformation; im Deutschen ist dafür kein ausdrückliches »und« nötig.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: »Aram« entspricht unmittelbar der hebräischen ethnogeografischen Bezeichnung und vermeidet die interpretierende Wiedergabe »Syrien«.
- source_word: חֹלֶה
  choice: war krank
  rationale: Das prädikative Partizip bezeichnet den andauernden Zustand Ben-Hadads.
- source_word: וַיֻּגַּד לוֹ
  choice: Da wurde ihm berichtet
  rationale: Die unpersönliche Passivkonstruktion bewahrt die Form des hebräischen Hofal und klingt zugleich natürlich.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die deutsche Zeichensetzung leitet die folgende direkte Rede idiomatisch ein; ein wörtliches »indem man sagte« wäre unnötig schwerfällig.
- source_word: בָּא
  choice: ist ... hierhergekommen
  rationale: Das Perfekt bezeichnet in der gemeldeten Rede eine vollzogene Ankunft mit gegenwärtigem Ergebnis.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die Wiedergabe erhält die wörtliche und erzählerisch prägnante hebräische Bezeichnung, statt sie zu »Prophet Gottes« auszudeuten.
- source_word: עַד הֵנָּה
  choice: hierher
  rationale: Die Richtungsangabe »bis hierher« wird im modernen Deutschen natürlich mit »hierher« ausgedrückt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit kurzen, klaren Sätzen. Die historische Bezeichnung »Aram« bleibt erhalten; deshalb ist keine Fußnote mit der sachlich unzutreffenden Zuordnung des Krankseins zu »Syrien« nötig.
