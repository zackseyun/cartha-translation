base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: de
  text: 'Da ging er von Elisa weg und kam zu seinem Herrn. Der fragte ihn: »Was hat Elisa dir gesagt?« Er antwortete: »Er hat mir gesagt: ›Du wirst ganz sicher wieder gesund werden.[a]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Du wirst gewiss leben.« Das Hebräische wiederholt die Verbwurzel zur Verstärkung: »Leben wirst du leben.« Im Zusammenhang ist damit die Genesung von der Krankheit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: Da ging er von Elisa weg
  rationale: Die Weggangsbewegung wird im natürlichen deutschen Erzählstil wiedergegeben; מֵאֵת bezeichnet die Trennung von Elisa.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: und kam zu seinem Herrn
  rationale: בוא אֶל bedeutet hier »zu … kommen«. אֲדֹנָיו bezeichnet im höfischen Zusammenhang Hasaëls menschlichen Herrn, König Ben-Hadad, nicht Gott.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: Was hat Elisa dir gesagt?
  rationale: Das deutsche Perfekt ist in direkter Rede natürlich und gibt die abgeschlossene, für die Gegenwart relevante Mitteilung wieder.
- source_word: אָמַר לִי
  choice: Er hat mir gesagt
  rationale: Die Wendung wird eng am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: חָיֹה תִחְיֶה
  choice: Du wirst ganz sicher wieder gesund werden
  rationale: Infinitivus absolutus und finites Verb verstärken gemeinsam die Aussage. Im Zusammenhang mit der Krankheit bezeichnet חיה das Weiterleben beziehungsweise Genesen; »wieder gesund werden« vermittelt hier den kontextuellen Sinn, während die Fußnote die wörtlichere Form bewahrt.
theological_decisions:
- issue: Bedeutung von אֲדֹנָיו im nichtgöttlichen Zusammenhang
  choice: seinem Herrn
  alternative: seinem Gebieter
  rationale: Das Wort bezeichnet Hasaëls menschlichen Vorgesetzten. Die Kleinschreibung verhindert eine Verwechslung mit dem Gottesnamen beziehungsweise einem göttlichen Titel.
- issue: Wiedergabe von חָיֹה תִחְיֶה angesichts des weiteren Erzählverlaufs
  choice: Du wirst ganz sicher wieder gesund werden
  alternative: Du wirst ganz sicher am Leben bleiben
  rationale: Die Übersetzung gibt Hasaëls Bericht wieder und lässt die Spannung zur zuvor von Elisa angekündigten Todesfolge bestehen, ohne Hasaëls Aussage harmonisierend umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlicher direkter Rede. »Herr« ist hier ein menschlicher Hoftitel und wird daher kleingeschrieben. Die verstärkte hebräische Konstruktion wird im Haupttext idiomatisch und in der Fußnote formal transparent wiedergegeben.
