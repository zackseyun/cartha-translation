theological_decisions:
- issue: Genealogische Bedeutung von »Tochter Omris«
  choice: Die konkrete Verwandtschaftsbezeichnung »eine Tochter Omris« steht im Haupttext.
  alternative: »eine Nachfahrin Omris« beziehungsweise »eine Angehörige des Hauses Omri«
  rationale: Hebräische Verwandtschaftsbegriffe können auch weitere Abstammung oder dynastische Zugehörigkeit ausdrücken. Die Übersetzung bewahrt daher den wörtlichen Ausdruck und macht die echte genealogische Mehrdeutigkeit in der Fußnote sichtbar.
translation_notes:
