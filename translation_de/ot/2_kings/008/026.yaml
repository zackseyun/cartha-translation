- source_word: בַּת עָמְרִי
  choice: eine Tochter Omris
  rationale: Bewahrt die unmittelbare lexikalische Bedeutung von בַּת; der mögliche weitere dynastische Sinn wird in einer Fußnote offengehalten.
- source_word: מֶלֶךְ יִשְׂרָאֵל
