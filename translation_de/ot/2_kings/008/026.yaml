- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: war zweiundzwanzig Jahre alt
  rationale: Die wörtliche hebräische Altersformel »ein Sohn von zweiundzwanzig Jahren« wird idiomatisch und präzise im modernen Deutschen wiedergegeben.
- source_word: בְמָלְכוֹ
