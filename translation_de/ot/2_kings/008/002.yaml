base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: de
  text: Da stand die Frau auf und handelte nach dem Wort des Mannes Gottes. Sie zog mit ihrem Haushalt fort und lebte sieben Jahre lang als Fremde[a] im Land der Philister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hielt sich sieben Jahre lang als Fremde im Land der Philister auf«.'
    reason: Lexikalische Alternative für וַתָּגָר; sie hebt den vorübergehenden Aufenthalt als Ortsfremde hervor.
lexical_decisions:
- source_word: וַתָּקָם
  choice: Da stand die Frau auf
  rationale: Die Wiedergabe bewahrt die mit קום ausgedrückte einleitende Reaktion der Frau und den erzählerischen Ablauf, ohne das folgende Fortziehen vorwegzunehmen.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: handelte nach dem Wort
  rationale: Die Wendung bezeichnet ein Handeln gemäß einer mündlichen Anweisung. Die Formulierung erhält den hebräischen Bezug auf das »Wort« und bleibt im Deutschen verständlich.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Dies ist die transparente und im biblischen Deutsch etablierte Wiedergabe des Titels für einen von Gott beauftragten Menschen.
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: Sie zog mit ihrer Hausgemeinschaft fort
  rationale: בַּיִת mit Suffix meint hier die zum Haus gehörenden Menschen, nicht das Gebäude. »Hausgemeinschaft« gibt diesen umfassenden sozialen Sinn wieder.
- source_word: וַתָּגָר
  choice: lebte ... als Fremde
  rationale: גור bezeichnet den Aufenthalt als ortsfremde, nicht voll ansässige Person. Die Formulierung macht diesen sozialen Unterton in heutigem Deutsch deutlich.
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: im Land der Philister
  rationale: Die Wiedergabe folgt der ethnogeografischen Formulierung des Hebräischen und ist transparenter als der spätere Gebietsname »Philistäa«.
- source_word: שֶׁבַע שָׁנִים
  choice: sieben Jahre lang
  rationale: Die Ergänzung »lang« kennzeichnet die Zeitspanne im Deutschen idiomatisch.
theological_decisions:
- issue: Titel אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  alternative: Prophet
  rationale: Der Quelltext verwendet den Titel »Mann Gottes« und nicht das gewöhnliche Wort für »Prophet«. Die Übersetzung bewahrt diese Bezeichnung, ohne die Person funktional umzubenennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Erzählton. »Hausgemeinschaft« vermeidet das Missverständnis eines mitgenommenen Gebäudes; »als Fremde leben« erschließt die soziale Bedeutung von גור ohne veraltetes »in der Fremde weilen«.
