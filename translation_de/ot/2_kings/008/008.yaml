base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: de
  text: 'Der König sagte zu Hasaël: „Nimm ein Geschenk mit und geh dem Mann Gottes entgegen. Frage durch ihn Jahwe mit den Worten: ‚Werde ich von dieser Krankheit genesen?[a]‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Werde ich von dieser Krankheit leben?“ Gemeint ist, ob der König die Krankheit überleben beziehungsweise von ihr genesen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: Geschenk
  rationale: Im Erzählzusammenhang ist eine Gabe für den Gottesmann gemeint, nicht ein kultisches Opfer oder ein Tribut.
- source_word: בְּיָדְךָ
  choice: mit
  rationale: Die hebräische Wendung lautet wörtlich „in deiner Hand“. Das natürliche deutsche „mitnehmen“ bewahrt hier den Sinn, ohne eine unidiomatische Formulierung zu erzwingen.
- source_word: לִקְרַאת
  choice: entgegengehen
  rationale: 'Die Form bezeichnet den Zweck des Gehens: Hasaël soll dem Gottesmann entgegengehen, um ihn aufzusuchen.'
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Die feste hebräische Bezeichnung wird beibehalten, statt sie erklärend durch „Prophet“ zu ersetzen.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: Befrage durch ihn Jahwe
  rationale: דרשׁ bezeichnet hier das Einholen einer göttlichen Auskunft; מֵאֹתוֹ stellt den Gottesmann als Vermittler der Antwort dar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: הַאֶחְיֶה
  choice: Werde ich … genesen?
  rationale: Das Verb bedeutet wörtlich „leben“, fragt in diesem Krankheitszusammenhang aber danach, ob der König die Krankheit übersteht beziehungsweise wieder gesund wird.
- source_word: מֵחֳלִי זֶה
  choice: von dieser Krankheit
  rationale: Die Präposition und das Substantiv werden in einer natürlichen deutschen Wendung für das Genesen von einer konkreten Krankheit wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Gottesnamen.
- issue: Vermittlung der göttlichen Auskunft
  choice: Befrage durch ihn Jahwe
  alternative: Befrage den Mann Gottes nach Jahwe
  rationale: Die Formulierung wahrt, dass Jahwe der Befragte und der Gottesmann der Vermittler ist, ohne beide Rollen gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hasaël“ folgt der geläufigen deutschen Namensform; „Mann Gottes“ bewahrt die markante hebräische Bezeichnung. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
