base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: de
  text: 'Hasaël sagte: „Was ist denn dein Diener, dieser Hund, dass er diese große Sache tun sollte?“ Elisa antwortete: „Jahwe hat mir gezeigt, dass du König über Aram sein wirst.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי מָה
  choice: Was ist denn
  rationale: Die Wendung leitet Hasaëls ungläubigen Einwand ein. „Denn“ gibt den Zusammenhang und den erstaunten Ton im Deutschen natürlich wieder.
- source_word: עַבְדְּךָ הַכֶּלֶב
  choice: dein Diener, dieser Hund
  rationale: „Dein Diener“ bewahrt die höfische Selbstbezeichnung; „dieser Hund“ gibt die appositionelle, stark selbsterniedrigende Bildsprache wieder.
- source_word: כִּי יַעֲשֶׂה
  choice: dass er … vollbringen sollte
  rationale: Die modale Formulierung bewahrt Hasaëls ungläubige Frage, ohne eindeutig zwischen Fähigkeit, Wahrscheinlichkeit und Zukunft festzulegen.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: eine so gewaltige Tat
  rationale: דָּבָר kann Sache, Vorgang oder Tat bezeichnen. Im Kontext der zuvor angekündigten Handlungen ist „Tat“ natürlich; „gewaltig“ bezeichnet das erschreckende Ausmaß, nicht moralische Größe.
- source_word: הִרְאַנִי
  choice: hat mir gezeigt
  rationale: Die vollendete Verbform bezeichnet eine bereits empfangene Offenbarung, deren Ergebnis für Elisas gegenwärtige Aussage maßgeblich ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: König über Aram
  rationale: „Über“ bildet die Präposition עַל direkt ab; „Aram“ wahrt die hebräische Gebietsbezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen.
- issue: Charakter von Hasaëls Einwand
  choice: 'Modal offen: „vollbringen sollte“'
  alternative: „vollbringen könnte“ oder „vollbringen würde“
  rationale: Die Aussage kann Unglauben über die eigene Fähigkeit, Stellung oder künftige Handlung ausdrücken. Die Übersetzung entscheidet diese Spannung nicht vorschnell.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich und verständlich; die selbsterniedrigende Hund-Metapher und die prophetische Gewissheit werden ohne konfessionelle Zusatzdeutung bewahrt.
