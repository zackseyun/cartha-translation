revisions:
- from: 'Da kam er hinein, und siehe, die Heerführer saßen beisammen. Er sagte: »Ich habe eine Botschaft für dich, Heerführer.« Jehu fragte: »Für wen von uns allen?« Er antwortete: »Für dich, Heerführer.«'
  to: 'Da kam er, und siehe, die Befehlshaber des Heeres saßen da. Er sagte: »Ich habe eine Botschaft für dich, Befehlshaber.« Jehu fragte: »An wen von uns allen?« Er antwortete: »An dich, Befehlshaber.«'
  rationale: Die Revision entfernt nicht ausgedrückte Ergänzungen, verwendet für die militärischen Führer eine klare, nicht rangspezifische Bezeichnung und gibt die zweimalige Adressatenrichtung von אֶל im Deutschen präzise wieder. »Botschaft« ist für דָּבָר in dieser elliptischen Mitteilungsform idiomatisch und sachgerecht.
