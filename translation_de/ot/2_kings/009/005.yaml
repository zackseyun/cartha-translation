base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: de
  text: 'Da kam er, und siehe, die Befehlshaber des Heeres saßen da. Er sagte: »Ich habe eine Botschaft für dich, Befehlshaber.« Jehu fragte: »An wen von uns allen?« Er antwortete: »An dich, Befehlshaber.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam er hinein
  rationale: Das Wayyiqtol führt die Erzählung weiter; »da« gibt die Abfolge natürlich wieder, und »hinein« verdeutlicht im Kontext das Eintreten, ohne zusätzliche Handlung einzuführen.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה lenkt den Blick lebhaft auf die nun vorgefundene Szene. »Siehe« bewahrt diese präsentierende Funktion in würdigem, verständlichem Deutsch.
- source_word: שָׂרֵי הַחַיִל
  choice: die Heerführer
  rationale: שָׂרֵי bezeichnet militärische Führer, הַחַיִל das Heer beziehungsweise die Streitmacht. »Heerführer« ist klar und vermeidet die Festlegung auf einen modernen Dienstrang.
- source_word: יֹשְׁבִים
  choice: saßen beisammen
  rationale: Das Partizip zeichnet den andauernden Zustand der versammelten Führer. »Beisammen« macht die im folgenden Dialog vorausgesetzte Gruppe natürlich sichtbar.
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: Ich habe eine Botschaft für dich
  rationale: Die wörtlich elliptische Wendung »Ein Wort ist mir an dich« bezeichnet eine an den Angeredeten gerichtete Mitteilung. »Botschaft« gibt die idiomatische Bedeutung von דָּבָר hier natürlicher wieder als »Wort«.
- source_word: הַשָּׂר
  choice: Heerführer
  rationale: Der Ausdruck ist hier eine direkte Anrede an einen militärischen Befehlshaber. »Heerführer« hält den militärischen Kontext fest, ohne einen bestimmten Rang zu unterstellen.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: Für wen von uns allen?
  rationale: Die Frage zielt darauf, welcher der versammelten Männer gemeint ist. »Von uns allen« bewahrt ausdrücklich den umfassenden partitivischen Ausdruck מִכֻּלָּנוּ.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: Für dich, Heerführer
  rationale: Die Antwort identifiziert den Adressaten und greift die zuvor verwendete natürliche deutsche Fügung »für dich« auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Bewegung. »Siehe« erhält die markierte hebräische Präsentationsform; »Heerführer« vermeidet sowohl archaisches »Oberster« als auch einen zu genau bestimmten modernen militärischen Rang.
