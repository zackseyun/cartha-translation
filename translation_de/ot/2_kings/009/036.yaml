base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: de
  text: 'Da kehrten sie zurück und berichteten es ihm. Er sagte: „Das ist das Wort Jahwes, das er durch seinen Diener Elija, den Tischbiter, gesprochen hat: ‚Im Gebiet von Jesreel[a] werden die Hunde Isebels Fleisch fressen.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Grundstück / Landstück von Jesreel“. Das hebräische Wort kann einen Anteil oder ein abgegrenztes Stück Land bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: Da kehrten sie zurück und berichteten es ihm
  rationale: Die fortlaufenden Wayyiqtol-Formen werden als natürliche deutsche Erzählfolge wiedergegeben. נגד im Hifil bedeutet hier „berichten/mitteilen“; das Objekt „es“ ist im Deutschen zur idiomatischen Ergänzung sinnvoll.
- source_word: דְּבַר יְהוָה הוּא
  choice: Das ist das Wort Jahwes
  rationale: Die hervorgehobene hebräische Nominalkonstruktion wird knapp und natürlich wiedergegeben; der Gottesname erscheint in der im Deutschen geläufigen Form „Jahwe“.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: das er durch seinen Diener … gesprochen hat
  rationale: בְּיַד bezeichnet hier die Vermittlung bzw. Beauftragung. „Durch“ gibt die Funktion im heutigen Deutsch klarer wieder als eine wörtliche Wiedergabe mit „durch die Hand“.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: Elija, den Tischbiter
  rationale: Verwendet die üblichen deutschen Namensformen und gibt die Herkunftsbezeichnung substantivisch wieder.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: Im Gebiet von Jesreel
  rationale: חֵלֶק kann einen Anteil, Landstrich oder ein abgegrenztes Grundstück bezeichnen. „Gebiet“ bewahrt den örtlichen Sinn, ohne den Umfang unnötig festzulegen; die engere Möglichkeit wird in der Fußnote genannt.
- source_word: יֹאכְלוּ הַכְּלָבִים אֶת בְּשַׂר אִיזָבֶל
  choice: werden die Hunde Isebels Fleisch fressen
  rationale: „Fressen“ ist bei Tieren die natürliche deutsche Entsprechung zu אכל; „Fleisch“ bewahrt die konkrete und drastische Bedeutung von בָּשָׂר.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ ist dessen geläufige wissenschaftliche und deutschsprachige Wiedergabe und vermeidet die Ersetzung durch einen Titel.
- issue: Prophetische Vermittlung in בְּיַד עַבְדּוֹ
  choice: durch seinen Diener
  alternative: durch die Hand seines Dieners
  rationale: Die Formulierung bezeichnet Elija als beauftragten Vermittler des göttlichen Wortes. Die idiomatische deutsche Wiedergabe bewahrt diesen Sinn, ohne aus der Wendung eine zusätzliche Lehraussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die direkte Rede und die drastische Bildsprache des prophetischen Gerichtswortes bleiben erhalten; der mögliche Umfang von חֵלֶק wird nicht vorschnell festgelegt.
