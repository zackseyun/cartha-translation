source:
  edition: WLC
  text: וַ/יָּב֥וֹא יֵה֖וּא יִזְרְעֶ֑אלָ/ה וְ/אִיזֶ֣בֶל שָׁמְעָ֗ה וַ/תָּ֨שֶׂם בַּ/פּ֤וּךְ עֵינֶ֨י/הָ֙ וַ/תֵּ֣יטֶב אֶת רֹאשָׁ֔/הּ וַ/תַּשְׁקֵ֖ף בְּעַ֥ד הַ/חַלּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: de
  text: Als Jehu nach Jesreel kam, hörte Isebel davon. Sie schminkte ihre Augen mit Kajal, machte ihr Haar zurecht[a] und blickte durch das Fenster hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „machte ihren Kopf schön“; gemeint ist wohl, dass sie ihr Haar ordnete oder ihren Kopfschmuck zurechtmachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... יִזְרְעֶאלָה
  choice: Als Jehu nach Jesreel kam
  rationale: Die Richtungsendung an יִזְרְעֶאלָה bezeichnet die Bewegung auf Jesreel zu; „nach Jesreel kam“ ist im Deutschen natürlich und lässt offen, wie weit Jehu bereits in die Stadt eingedrungen war.
- source_word: שָׁמְעָה
  choice: hörte ... davon
  rationale: 'Das im Hebräischen nicht ausdrücklich genannte Objekt ergibt sich aus dem Zusammenhang: Isebel hört von Jehus Ankunft.'
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: Sie schminkte ihre Augen mit Kajal
  rationale: פּוּךְ bezeichnet ein dunkles Augenschminkmittel. „Mit Kajal schminken“ gibt den konkreten Vorgang in verständlichem modernem Deutsch wieder.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: machte ihr Haar zurecht
  rationale: Wörtlich heißt die Wendung, sie habe ihren Kopf schön oder ansehnlich gemacht. Im Zusammenhang ist das Herrichten des Haars wahrscheinlich; eine Fußnote bewahrt jedoch die weitere Ausdrucksweise des Hebräischen.
- source_word: וַתַּשְׁקֵף בְּעַד הַחַלּוֹן
  choice: blickte durch das Fenster hinaus
  rationale: שׁקף bezeichnet hier das Hinausblicken aus einer erhöhten Öffnung; בְּעַד gibt die Blickrichtung durch das Fenster wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Kajal“ bewahrt den konkreten kulturellen Bezug; die ungewöhnliche hebräische Wendung zum Herrichten des Kopfes wird idiomatisch übersetzt und in der Fußnote transparent gemacht.
