base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: de
  text: 'Da kehrte Joram um und floh[a]. Er rief Ahasja zu: »Verrat[b], Ahasja!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wendete seine Hände«. Wahrscheinlich ist gemeint, dass er dadurch den Wagen wendete; Zügel oder Wagen werden im Hebräischen jedoch nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Täuschung« beziehungsweise »Arglist«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: wendete
  rationale: Das Verb הפך bedeutet grundsätzlich »wenden/umkehren«. »Wendete« bewahrt diese Bedeutung, ohne ausdrücklich einen Wagen oder Zügel zu ergänzen.
- source_word: יָדָיו
  choice: seine Hände
  rationale: Der hebräische Text nennt wörtlich »seine Hände«. Im Zusammenhang dürfte die Wendung das Wenden des Wagens durch Handhabung der Zügel bezeichnen, doch weder Wagen noch Zügel werden hier ausdrücklich genannt.
- source_word: וַיָּנֹס
  choice: floh
  rationale: נוס bezeichnet in diesem Erzählzusammenhang eine eilige Flucht; »floh« gibt dies knapp und natürlich wieder.
- source_word: וַיֹּאמֶר
  choice: rief ... zu
  rationale: Wörtlich steht »sagte zu«. Wegen des alarmierenden Ausrufs und der Fluchtszene ist »rief ... zu« im Deutschen eine natürliche kontextuelle Wiedergabe.
- source_word: מִרְמָה
  choice: Verrat
  rationale: מִרְמָה kann Täuschung, Arglist oder Treulosigkeit bezeichnen. In der alarmierten Warnung an einen König erfasst »Verrat« die feindselige Treulosigkeit, ohne sie enger als »Hochverrat« politisch festzulegen.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: Ahasja
  rationale: Der Personenname wird in geläufiger deutscher Bibelschreibung wiedergegeben. Seine Wiederholung in der direkten Anrede bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnliche konkrete Wendung »seine Hände wenden« bleibt im Haupttext erhalten; die wahrscheinlich gemeinte Wagenwendung wird nur in der Fußnote erläutert. »Da« nimmt den raschen Fortgang der hebräischen Erzählung auf.
