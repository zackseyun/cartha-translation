  terminology: „verfluchte Frau“ ist für הָאֲרוּרָה הַזֹּאת treffend; das ergänzte „Frau“ ist im Deutschen sinnvoll. „Königstochter“ gibt בַת־מֶלֶךְ präzise wieder, ohne die im Hebräischen nicht genannte Identität des Königs zu ergänzen. Die Fußnote ist als lexikalische Alternative sachgerecht.
