base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: de
  text: 'Dann ging er hinein, aß und trank und sagte: „Kümmert euch bitte um diese verfluchte Frau[a] und begrabt sie; denn sie ist eine Königstochter.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Verfluchte“.'
    reason: Das Hebräische verwendet eine feminine Form ohne ein ausdrücklich genanntes Wort für „Frau“.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dann ging er hinein
  rationale: בוא bezeichnet hier im Erzählzusammenhang das Hineingehen Jehus in das Gebäude. „ging … hinein“ gibt Richtung und Erzählfolge natürlich wieder.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: aß und trank
  rationale: Die beiden Verben stehen ohne ausdrücklich genanntes Objekt; deshalb wird weder „Wein“ noch ein anderes Objekt ergänzt.
- source_word: פִּקְדוּ נָא
  choice: Kümmert euch bitte um
  rationale: פקד bedeutet hier, sich der Sache beziehungsweise der sterblichen Überreste anzunehmen. Der Plural des Imperativs und die abmildernde Partikel נָא werden mit „euch“ und „bitte“ wiedergegeben.
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: diese verfluchte Frau
  rationale: Die feminine substantivierte Form bezieht sich auf Isebel. „Frau“ wird für klares, natürliches Deutsch ergänzt; „verflucht“ bewahrt die Schärfe der Bezeichnung.
- source_word: וְקִבְרֻהָ
  choice: und begrabt sie
  rationale: Der Imperativ mit femininem Objektsuffix wird direkt und idiomatisch wiedergegeben.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: denn sie ist eine Königstochter
  rationale: Die Begründung hebt ihre königliche Abstammung hervor. „eine Königstochter“ bewahrt die unbestimmte Formulierung des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die direkte Rede bleibt knapp und befehlend; „bitte“ gibt נָא wieder, ohne den Befehl übermäßig höflich erscheinen zu lassen.
