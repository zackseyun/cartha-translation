  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Jehu geht hinein, isst und trinkt und befiehlt anschließend, sich um Isebel zu kümmern und sie zu begraben. „verfluchte Frau“ und „eine Königstochter“ treffen die Aussage angemessen. „Danach sagte er“ ist jedoch eine leicht unnötige Umformung des einfachen narrativen וַיֹּאמֶר („und sagte er“).'
