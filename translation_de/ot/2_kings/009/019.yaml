base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: de
  text: 'Da sandte er einen zweiten Reiter. Der kam zu ihnen und sagte: »So spricht der König: Ist Frieden?[a]« Jehu aber sagte: »Was geht dich der Frieden an? Kehr um und folge mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ist alles in Ordnung?« Das hebräische Wort kann »Frieden« oder »Wohlergehen« bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: einen zweiten Reiter
  rationale: Die Wendung bezeichnet wörtlich einen zweiten Reiter auf einem Pferd. Im Zusammenhang ist »zweiter Reiter« natürlich und ausreichend eindeutig.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: So spricht der König
  rationale: Die traditionelle, weiterhin verständliche deutsche Botenformel bewahrt den förmlichen Ton der königlichen Botschaft.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: Das Wort kann Frieden, Wohlergehen oder einen guten Ausgang bezeichnen. »Frieden« erhält die bewusste Wiederholung in Jehus Antwort.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Was geht dich der Frieden an?
  rationale: Diese idiomatische deutsche Wiedergabe erhält den abweisenden, konfrontativen Sinn und wiederholt wie das Hebräische das Wort »Frieden«.
- source_word: סֹב אֶל אַחֲרָי
  choice: Dreh um und reih dich hinter mir ein!
  rationale: Die Formulierung bewahrt sowohl den Befehl zum Umkehren als auch die räumliche Anweisung, sich hinter Jehu einzuordnen, ohne das allgemeinere »Folge mir« einzusetzen.
