  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: de
  text: 'Als Joram Jehu sah, fragte er: »Kommst du in Frieden, Jehu?« Er antwortete: »Was für Frieden kann es geben,[a] solange die Hurereien[b] deiner Mutter Isebel und ihre vielen Zaubereien fortbestehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was für Frieden?« Jehu greift das Wort aus Jorams Frage auf und weist die Möglichkeit von Frieden zurück.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet wörtlich Hurerei, kann hier aber zugleich sittliche und kultische Untreue meinen.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Als … sah
  rationale: Die hebräische Erzählungsformel leitet den nächsten Vorgang ein. Im modernen Deutschen gibt der temporale Nebensatz den Ablauf natürlich und präzise wieder; ein zusätzliches »und es geschah« wäre hier schwerfällig.
- source_word: הֲשָׁלוֹם
  choice: Kommst du in Frieden?
  rationale: Die Frage erkundigt sich im Kontext nach Jehus friedlicher Absicht. Die Formulierung ist im Deutschen idiomatisch und bewahrt zugleich das Schlüsselwort »Frieden« für die Wiederaufnahme in Jehus Antwort.
- source_word: מָה הַשָּׁלוֹם
  choice: Was für Frieden kann es geben?
  rationale: Die rhetorische Frage bestreitet, dass unter den genannten Umständen Frieden möglich ist, und wiederholt wie der hebräische Text ausdrücklich das Wort »Frieden«.
- source_word: עַד
  choice: solange
  rationale: Die Präposition bezeichnet hier den fortdauernden Zustand, der Frieden ausschließt.
- source_word: זְנוּנֵי
  choice: Hurereien
  rationale: Das bewusst anstößige hebräische Bild wird nicht zu einem allgemeinen Begriff wie »Untreue« oder »Götzendienst« abgeschwächt. Der Plural kann sittliche, sexuelle und kultische Untreue anklingen lassen.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: deiner Mutter Isebel
  rationale: Die deutsche Wortstellung ist natürlich und erhält die direkte persönliche Anklage.
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: und ihre vielen Zaubereien
  rationale: Die Wiedergabe bewahrt den Plural sowie die quantitative Verstärkung durch »vielen«.
theological_decisions:
- issue: Bedeutungsumfang von זְנוּנֵי
  choice: Das konkrete und schockierende Bild wird mit »Hurereien« bewahrt.
  alternative: Untreue, sexuelle Ausschweifungen oder Götzendienst
  rationale: Der Kontext kann zugleich sittliche und kultische Untreue aufrufen. Eine abstraktere Wiedergabe würde diese Mehrdeutigkeit verengen und die Schärfe der Anklage mindern.
- issue: Wiederholung von שָׁלוֹם
  choice: Beide Vorkommen werden mit »Frieden« wiedergegeben.
  alternative: Die erste Frage könnte mit »Ist alles in Ordnung?« oder »Kommst du mit friedlichen Absichten?« übersetzt werden.
  rationale: Die einheitliche Wortwahl erhält Jehus pointierte Aufnahme von Jorams Frage und den rhetorischen Gegensatz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt natürlich, bewahrt jedoch die Wiederholung von »Frieden« und die bewusst harte Bildsprache des hebräischen Textes.
