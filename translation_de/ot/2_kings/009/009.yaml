  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: de
  text: Und ich werde dem Haus Ahabs dasselbe Geschick bereiten wie dem Haus Jerobeams, des Sohnes Nebats, und wie dem Haus Baschas, des Sohnes Ahijas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit dem hebräischen Bildwort: »Ich werde das Haus Ahabs dem Haus Jerobeams, des Sohnes Nebats, und dem Haus Baschas, des Sohnes Ahijas, gleichmachen.« Das hebräische Wort für »Haus« bezeichnet hier ein Königshaus oder eine Herrscherlinie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתִּי
  choice: Und ich werde … gleichmachen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, machen“. Zusammen mit dem direkten Objekt und den durch כ eingeleiteten Vergleichen bezeichnet es hier, dass Gott Ahabs Haus dasselbe Geschick wie den genannten Königshäusern bereiten wird. „gleichmachen“ gibt diese Konstruktion im Deutschen knapp und idiomatisch wieder.
- source_word: אֶת
  choice: '[unübersetzt]'
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt und erhält im Deutschen keine eigene Entsprechung.
- source_word: בֵּית אַחְאָב
  choice: das Haus Ahabs
  rationale: „Haus“ bewahrt die hebräische Metapher für Königshaus, Familie beziehungsweise Dynastie; der Genitiv ist im Deutschen natürlich.
- source_word: כְּ/בֵית יָרָבְעָם בֶּן נְבָט
  choice: dem Haus Jerobeams, des Sohnes Nebats
  rationale: Das Präfix כ markiert den Vergleich und wird in der Konstruktion „jemanden jemandem gleichmachen“ durch den Dativ wiedergegeben. Die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: וּ/כְ/בֵית בַּעְשָׁא בֶן אֲחִיָּה
  choice: und dem Haus Baschas, des Sohnes Ahijas
  rationale: Die parallele Vergleichskonstruktion wird im Deutschen symmetrisch wiedergegeben; Namen und Abstammungsangabe bleiben erhalten.
theological_decisions:
- issue: Dynastische Gerichtsformel
  choice: das Haus Ahabs … dem Haus Jerobeams … und dem Haus Baschas gleichmachen
  alternative: Ahabs Dynastie … der Dynastie Jerobeams … und der Dynastie Baschas gleichmachen
  rationale: „Haus“ erhält das biblische Bild und den Bezug auf frühere Gerichtsworte, ohne die Bedeutung ausschließlich auf einen modernen politischen Dynastiebegriff festzulegen. Die Fußnote erklärt den dynastischen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bindet beide Vergleichsglieder klar an „gleichmachen“. Die traditionellen deutschen Namensformen Jerobeam, Nebat, Bascha und Ahija werden verwendet.
