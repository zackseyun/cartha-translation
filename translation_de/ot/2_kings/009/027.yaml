  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Ortsnamen werden in geläufiger deutscher Umschrift wiedergegeben. Die kurzen Hauptsätze erhalten das schnelle Erzähltempo; echte räumliche Mehrdeutigkeit wird nicht stillschweigend beseitigt, sondern in einer Fußnote kenntlich gemacht.
