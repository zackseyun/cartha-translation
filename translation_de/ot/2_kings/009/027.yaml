  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: de
  text: 'Als Ahasja, der König von Juda, das sah, floh er auf dem Weg nach Bet-Haggan[a]. Jehu verfolgte ihn und befahl: »Trefft auch ihn im Wagen[b]!« Sie trafen ihn am Anstieg von Gur, der bei Jibleam liegt. Doch er floh nach Megiddo und starb dort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Haggan kann „Haus des Gartens“ bedeuten; hier ist es wahrscheinlich ein Ortsname.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Trefft auch ihn gegen den Wagen!“ Die hebräische Präposition kann hier den Ort des Angriffs oder dessen Zielrichtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: das sah
  rationale: Das hebräische Verb hat kein ausdrückliches Objekt. Das deutsche Demonstrativpronomen gibt natürlich wieder, dass Ahasja das unmittelbar zuvor Geschehene sah, ohne es näher festzulegen.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: auf dem Weg nach Bet-Haggan
  rationale: דֶּרֶךְ bezeichnet Weg oder Straße; Bet-Haggan ist hier am wahrscheinlichsten ein Ortsname. Die Zielrichtung ist im Deutschen natürlich mit „nach“ wiedergegeben.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: Jehu verfolgte ihn
  rationale: „Verfolgte ihn“ gibt die Verbindung von רדף und אַחַר vollständig und idiomatisch wieder.
- source_word: גַּם אֹתוֹ הַכֻּהוּ
  choice: Trefft auch ihn
  rationale: 'גַּם bewahrt den additiven Sinn: Auch Ahasja soll getroffen werden. נכה bedeutet grundsätzlich schlagen oder treffen; „trefft“ passt hier zum Angriff aus der Entfernung und legt nicht vorschnell „tötet“ fest.'
- source_word: אֶל הַמֶּרְכָּבָה
  choice: in seinem Wagen
  rationale: אֶל bezeichnet gewöhnlich eine Bewegung auf etwas zu, kann hier aber den räumlichen beziehungsweise zielbezogenen Zusammenhang des Angriffs angeben. „In seinem Wagen“ ergibt im Kontext einen klaren deutschen Sinn; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: בְּמַעֲלֵה גוּר
  choice: am Anstieg von Gur
  rationale: מַעֲלֶה bezeichnet einen Anstieg oder ansteigenden Weg; die topografische Angabe bleibt erhalten.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: der bei Jibleam liegt
  rationale: Die Wendung setzt den Anstieg von Gur räumlich zu Jibleam in Beziehung. „Bei“ wahrt die nicht näher bestimmte Nähe.
- source_word: וַיָּנָס מְגִדּוֹ וַיָּמָת שָׁם
  choice: er floh nach Megiddo und starb dort
  rationale: Die Abfolge von Flucht und Tod wird direkt und ohne zusätzliche Deutung wiedergegeben.
