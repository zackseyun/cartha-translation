  text: וַ/יֹּ֤אמֶר יְהוֹרָם֙ אֱסֹ֔ר וַ/יֶּאְסֹ֖ר רִכְבּ֑/וֹ וַ/יֵּצֵ֣א יְהוֹרָ֣ם מֶֽלֶךְ יִ֠שְׂרָאֵל וַ/אֲחַזְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה אִ֣ישׁ בְּ/רִכְבּ֗/וֹ וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את יֵה֔וּא וַ/יִּמְצָאֻ֔/הוּ בְּ/חֶלְקַ֖ת נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: de
  text: 'Da sagte Joram: »Spann an!« Und man spannte seinen Wagen an.[a] Dann zogen Joram, der König von Israel, und Ahasja, der König von Juda, aus, jeder in seinem Wagen. Sie fuhren Jehu entgegen und trafen ihn auf dem Grundstück Nabots, des Jesreeliters.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und er spannte seinen Wagen an.« Gemeint ist wahrscheinlich, dass ein Diener den Befehl ausführte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: Spannt an!
  rationale: Der Imperativ von אסר bezeichnet im Zusammenhang mit einem Streitwagen das Anschirren des Gespanns. Die knappe deutsche Wendung bewahrt die Dringlichkeit des Befehls.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: Und man spannte seinen Wagen an.
  rationale: Die hebräische Verbform ist formal 3. Person Singular, doch nach dem königlichen Befehl liegt sachlich die Ausführung durch einen Diener nahe. Das unpersönliche »man« gibt diesen Sinn natürlich wieder, ohne ausdrücklich mehrere Diener vorauszusetzen.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: jeder in seinem Wagen
  rationale: אִישׁ ist hier distributiv gebraucht und macht deutlich, dass beide Könige jeweils in einem eigenen Wagen ausfuhren.
- source_word: לִקְרַאת יֵהוּא
  choice: Jehu entgegen
  rationale: לקראת bezeichnet hier die Bewegung auf Jehu zu, um ihm zu begegnen. »Jehu entgegen« ist im Deutschen knapp und idiomatisch.
- source_word: וַיִּמְצָאֻהוּ
  choice: trafen ihn
  rationale: מצא kann im Erzählzusammenhang »finden« oder »antreffen« bedeuten. »Trafen ihn« gibt die beabsichtigte Begegnung natürlich wieder.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: auf dem Grundstück Nabots
  rationale: חלקה bezeichnet ein abgegrenztes Stück Land beziehungsweise einen Grundbesitz. »Grundstück« bewahrt den für die Nabot-Erzählung wichtigen Eigentumsbezug.
- source_word: הַיִּזְרְעֵאלִי
  choice: des Jesreeliters
  rationale: Das Gentiliz identifiziert Nabot als Mann aus Jesreel und bewahrt seine aus der vorausgehenden Erzählung bekannte Bezeichnung.
