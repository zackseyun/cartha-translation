    issue: »den Wagen« ist als Objekt von »bestieg« ergänzt.
    rationale: Der hebräische Text nennt bei וַיִּרְכַּב kein Reittier und keinen Wagen. Auch wenn ein Wagen im weiteren Erzählzusammenhang naheliegen kann, sollte die Übersetzung diese im einzelnen Vers offene Angabe nicht festlegen.
  - severity: low
    issue: »um Joram zu besuchen« ist interpretierender als notwendig.
    rationale: לִרְאוֹת אֶת bedeutet wörtlich »um Joram zu sehen«. Der Besuchssinn ist aus dem Kontext verständlich, doch die direkte deutsche Wiedergabe ist natürlich und quellennäher.
  revised_text: Da stieg Jehu auf und machte sich auf den Weg nach Jesreel, denn Joram lag dort, und Ahasja, der König von Juda, war hinabgezogen, um Joram zu sehen.
