base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: de
  text: Da stieg Jehu auf und machte sich auf den Weg nach Jesreel, denn Joram lag dort, und Ahasja, der König von Juda, war hinabgezogen, um Joram zu sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: bestieg den Wagen
  rationale: רכב bezeichnet das Aufsteigen beziehungsweise Fahren auf einem Reittier oder Wagen. Im erzählerischen Zusammenhang ist ein Wagen naheliegend; die Formulierung hält das Aufsteigen vom anschließenden Wegfahren auseinander.
- source_word: וַיֵּלֶךְ יִזְרְעֶאלָה
  choice: fuhr nach Jesreel
  rationale: הלך bezeichnet die Bewegung zum Ziel; die Richtungsendung an יִזְרְעֶאלָה wird im Deutschen natürlich mit »nach Jesreel« wiedergegeben. Nach dem Besteigen eines Wagens ist »fuhr« idiomatischer als »ging«.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier den Grund für Jehus Fahrt an. »Denn« wahrt den erzählerischen Stil und die kausale Beziehung.
- source_word: שֹׁכֵב שָׁמָּה
  choice: lag dort
  rationale: Das Partizip von שׁכב bedeutet wörtlich »liegen«. Die Übersetzung vermeidet es, den Gesundheitszustand stärker zu bestimmen, als der Vers selbst es tut.
- source_word: יָרַד
  choice: war hinabgezogen
  rationale: Das Qatal beschreibt plausibel eine bereits vor Jehus Aufbruch erfolgte Handlung. »Hinabgezogen« bewahrt die räumliche Nuance von ירד und passt zum königlichen Reisegeschehen.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: um Joram zu besuchen
  rationale: Wörtlich steht »um Joram zu sehen«; im Zusammenhang mit dem verwundeten König bezeichnet die Wendung einen Besuch. Natürliches Deutsch verlangt hier eher »besuchen«.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: Jehu / Joram / Ahasja / Jesreel / Juda
  rationale: Die Namen folgen ihren geläufigen deutschen Bibelformen.
