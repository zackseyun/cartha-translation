base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: de
  text: 'Da sagten sie: »Das ist gelogen! Sag es uns doch.« Er antwortete: »Er hat dies und das[a] zu mir gesagt: ›So spricht Yahweh: Ich habe dich zum König über Israel gesalbt.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „so und so“; eine hebräische Wendung für eine unbestimmte oder zusammenfassende Wiedergabe, auch: „soundso“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Das ist gelogen!
  rationale: Das Substantiv bezeichnet Lüge oder Falschheit. Die idiomatische deutsche Wendung gibt den abrupten Vorwurf wieder, Jehu verschweige ihnen die eigentliche Botschaft.
- source_word: הַגֶּד נָא לָנוּ
  choice: Sag es uns doch
  rationale: Der Hifil-Imperativ von נגד fordert zum Berichten auf; נָא verleiht der Aufforderung je nach Zusammenhang höflichen oder drängenden Nachdruck. Das Pronomen „es“ nimmt im Deutschen natürlich die gemeinte Botschaft auf.
- source_word: כָּזֹאת וְכָזֹאת
  choice: dies und das
  rationale: Die hebräische Wendung gibt eine unbestimmte oder zusammenfassende Wiedergabe an. „Dies und das“ bewahrt diese Offenheit, ohne eine wortgetreue vollständige Wiedergabe zu behaupten.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Yahweh
  rationale: Die feste prophetische Botenformel wird in würdigem, geläufigem Deutsch wiedergegeben; das Präsens erhält ihren Verkündigungscharakter.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: מְשַׁחְתִּיךָ
  choice: Ich habe dich … gesalbt
  rationale: Das Perfekt bezeichnet die vollzogene Salbung und Beauftragung. „Gesalbt“ bewahrt die königliche und theologische Bedeutung des Verbs משׁח.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: zum König über Israel
  rationale: לְ bezeichnet die Einsetzung in das Königsamt; אֶל wird im Herrschaftszusammenhang idiomatisch mit „über“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottesnamen. „Yahweh“ macht den Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Salbung
  choice: zum König … gesalbt
  alternative: zum König bestimmt
  rationale: Die konkrete Salbung und ihre königliche Beauftragung werden beibehalten; eine allgemeinere Formulierung würde das Zeichen und seine theologische Spannung abschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Sätze und der Ausruf bewahren die Dringlichkeit des Dialogs; die prophetische Formel bleibt bewusst feierlich.
