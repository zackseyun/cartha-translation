  text: וּ/בָ֖אתָ שָׁ֑מָּ/ה וּ/רְאֵֽה שָׁ֠ם יֵה֨וּא בֶן יְהוֹשָׁפָ֜ט בֶּן נִמְשִׁ֗י וּ/בָ֨אתָ֙ וַ/הֲקֵֽמֹת/וֹ֙ מִ/תּ֣וֹך אֶחָ֔י/ו וְ/הֵבֵיאתָ֥ אֹת֖/וֹ חֶ֥דֶר בְּ/חָֽדֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: de
  text: Wenn du dort angekommen bist, halte dort nach Jehu Ausschau, dem Sohn Joschafats, des Sohnes Nimschis. Geh hinein, lass ihn aus dem Kreis seiner Brüder aufstehen und bring ihn in ein inneres Gemach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ein Gemach innerhalb eines Gemachs“, das heißt in einen abgeschirmten inneren Raum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: Wenn du dort angekommen bist
  rationale: בוא kann je nach Perspektive „kommen“, „gehen“ oder „ankommen“ bedeuten. Die temporale Formulierung gibt natürlich wieder, dass die Ankunft den folgenden Anweisungen vorausgeht.
- source_word: וּרְאֵה שָׁם
  choice: halte dort nach … Ausschau
  rationale: ראה bedeutet wörtlich „sehen“, bezeichnet hier im Zusammenhang der Anweisung aber das Auffinden beziehungsweise Erkennen Jehus. „Dort“ bewahrt das ausdrücklich wiederholte שָׁם.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: Jehu, dem Sohn Joschafats, des Sohnes Nimschis
  rationale: Die genealogische Folge mit zweimal בן wird vollständig wiedergegeben; die Namen folgen geläufigen deutschen Bibelnamensformen.
- source_word: וּבָאתָ
  choice: Geh hinein
  rationale: Das zweite בוא bezeichnet hier die Bewegung zu Jehu beziehungsweise in die Versammlung hinein; „Geh hinein“ ist im Deutschen natürlich.
- source_word: וַהֲקֵמֹתוֹ
  choice: lass ihn … aufstehen
  rationale: Der Hifil von קום bedeutet, jemanden aufstehen zu lassen beziehungsweise zum Aufstehen zu veranlassen. Die Wiedergabe wahrt die kausative Bedeutung ohne unnötige Härte.
- source_word: מִתּוֹךְ אֶחָיו
  choice: aus dem Kreis seiner Brüder
  rationale: אחים heißt wörtlich „Brüder“, kann in diesem militärisch-sozialen Zusammenhang jedoch auch Gefährten oder Standesgenossen bezeichnen. „Aus dem Kreis“ gibt מִתּוֹךְ idiomatisch wieder, während „Brüder“ die Ausgangsform bewahrt.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: und bring ihn
  rationale: Der Hifil von בוא bedeutet hier direkt „bringen“ beziehungsweise „hineinführen“.
- source_word: חֶדֶר בְּחָדֶר
  choice: in ein inneres Gemach
  rationale: Die wörtliche Wendung „Gemach in einem Gemach“ bezeichnet einen besonders innen gelegenen, abgeschirmten Raum. „Inneres Gemach“ ist klar und würdig; die konkrete hebräische Form bleibt in der Fußnote erhalten.
