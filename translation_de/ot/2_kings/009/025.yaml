  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: de
  text: 'Dann sagte er zu Bidkar, seinem Offizier[a]: »Heb ihn auf und wirf ihn auf das Feldstück im Feld Nabots, des Jesreeliters! Denn denk daran: Du und ich, wir ritten Seite an Seite[b] hinter Ahab, dem Vater Jorams, her, als Jahwe diesen Ausspruch[c] gegen ihn ergehen ließ.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinem dritten Mann«; möglicherweise ist damit ein bestimmter militärischer Rang oder die Stellung Bidkars gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »als Paar Reitende« oder »in Paaren reitend«; wahrscheinlich ritten Jehu und Bidkar gemeinsam hinter Ahab her.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Orakel« beziehungsweise »Last«. Das hebräische Wort bezeichnet hier einen gewichtigen prophetischen Ausspruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: Bidkar
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: שלשה
  choice: seinem Offizier
  rationale: Die Überlieferung und der Zusammenhang sprechen für eine Amts- oder Rangbezeichnung Bidkars. »Offizier« ist verständlich, ohne einen nicht sicher bestimmbaren militärischen Rang festzulegen.
- source_word: שָׂא
  choice: Heb ihn auf
  rationale: Der Imperativ von נשׂא bezeichnet hier das Aufheben beziehungsweise Wegnehmen des Getöteten.
- source_word: הַשְׁלִכֵהוּ
  choice: wirf ihn
  rationale: Die Wiedergabe bewahrt die direkte und kräftige Form des Befehls.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: auf das Feldstück
  rationale: חלקה bezeichnet ein abgegrenztes Grundstück oder Flurstück; שדה kennzeichnet es als Feldland. »Feldstück« gibt beides knapp und natürlich wieder.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabots, des Jesreeliters
  rationale: Natürliche deutsche Genitivkonstruktion mit der herkömmlichen deutschen Form des Herkunftsnamens.
- source_word: זְכֹר
  choice: denk daran
  rationale: Der Imperativ leitet die begründende Erinnerung ein und klingt im gegenwärtigen Deutsch natürlich.
- source_word: רֹכְבִים צְמָדִים
  choice: ritten Seite an Seite
  rationale: Wörtlich etwa »als Paar/paargleich Reitende«. Die Formulierung vermittelt die wahrscheinlich gemeinte gemeinsame Formation, während die wörtliche Bildsprache in einer Fußnote erhalten bleibt.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: hinter seinem Vater Ahab her
  rationale: אחרי hat hier räumlichen beziehungsweise begleitenden Sinn. Das Pronomen bezieht sich auf den getöteten Joram, dessen Vater Ahab war.
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben; »Jahwe« ist die etablierte deutsche Form.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: diesen Ausspruch gegen ihn ergehen ließ
  rationale: מַשָּׂא bezeichnet hier einen gewichtigen, unheilvollen prophetischen Ausspruch. Die deutsche Wendung bewahrt sowohl dessen Herkunft von Jahwe als auch seine Ausrichtung gegen Ahab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als »Jahwe« bewahrt den Charakter als Gottes Eigenname.
- issue: Bedeutung von מַשָּׂא
  choice: Ausspruch
  alternative: Last; Orakel
  rationale: Das Wort kann wörtlich »Last« und in prophetischem Sprachgebrauch einen gewichtigen, häufig drohenden Gottesspruch bezeichnen. »Ausspruch« hält den prophetischen Sinn offen; die Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Erzählbewegung. Die militärische Amtsbezeichnung, die ungewöhnliche Reitformel und die Mehrdeutigkeit von מַשָּׂא werden nicht überpräzisiert, sondern durch Fußnoten offengehalten.
