  terminology: Die Namensformen Jehu, Joschafat, Nimschi, Joram, Ramot-Gilead und Hasaël sind im Deutschen angemessen. »Aram« ist gegenüber der traditionellen Bezeichnung »Syrien« vorzuziehen. Die Fußnotenformulierung zu שׁמר ist sachgerecht.
