source:
  edition: WLC
  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: de
  text: So verschwor sich Jehu, der Sohn Joschafats, des Sohnes Nimschis, gegen Joram. Joram aber hatte bei Ramot-Gilead Wache gehalten[a], er und ganz Israel, wegen Hasaël, des Königs von Aram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hatte Ramot-Gilead bewacht« beziehungsweise »hatte Ramot-Gilead verteidigt«. Das hebräische Verb kann in einem militärischen Zusammenhang Bewachen, Sichern oder Verteidigen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: »Syrien«; hebräisch: »Aram«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: So verschwor sich … gegen
  rationale: Das Hitpael von קשר bezeichnet hier eine Verschwörung beziehungsweise einen politischen Aufstand. Die deutsche Wendung ist idiomatisch und bewahrt die feindliche Zielrichtung.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: der Sohn Joschafats, des Sohnes Nimschis
  rationale: Die doppelte Abstammungsangabe wird entsprechend der hebräischen Form als Vater- und Großvaterangabe wiedergegeben.
- source_word: הָיָה שֹׁמֵר
  choice: hatte … bewacht
  rationale: Die Verbindung aus qatal und Partizip beschreibt eine Hintergrundhandlung. »Bewacht« lässt sowohl militärisches Sichern als auch Verteidigen zu.
- source_word: בְּרָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Der Ortsname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: mit ganz Israel
  rationale: Das Hebräische nennt ausdrücklich »ganz Israel«. Die deutsche Fassung bewahrt diese nationale Bezeichnung, während der militärische Kontext erkennen lässt, dass vor allem die versammelten Streitkräfte gemeint sein können.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Anlass beziehungsweise die Bedrohung, aufgrund deren Ramot-Gilead gesichert wurde.
- source_word: מֶלֶךְ אֲרָם
  choice: König von Aram
  rationale: »Aram« gibt die hebräische ethnogeografische Bezeichnung unmittelbar wieder; »Syrien« ist die traditionelle Alternative.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht Joram und ganz Israel gemeinsam zum Subjekt des Bewachens, ohne die wörtliche nationale Bezeichnung vorschnell auf »Heer« einzuengen. Die genealogische Form bleibt bewusst erhalten.
