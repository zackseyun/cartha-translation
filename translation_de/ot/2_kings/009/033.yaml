  text: וַ/יֹּ֥אמֶר שמט/הו וַֽ/יִּשְׁמְט֑וּ/הָ וַ/יִּ֨ז מִ/דָּמָ֧/הּ אֶל הַ/קִּ֛יר וְ/אֶל הַ/סּוּסִ֖ים וַֽ/יִּרְמְסֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/033.yaml
  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: de
  text: 'Da sagte er: »Stürzt sie hinunter!« Da stürzten sie sie hinunter. Von ihrem Blut spritzte etwas an die Mauer und an die Pferde[a], und er zertrampelte sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Ihr Blut spritzte an die Mauer und an die Pferde.« Wörtlich heißt es: »Von ihrem Blut spritzte es an die Mauer und an die Pferde.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו / וישמטוה
  choice: »Stürzt sie hinunter!« / »Da stürzten sie sie hinunter«
  rationale: Der Imperativ und die unmittelbar folgende Erfüllung verwenden dieselbe Wurzel שמט. Die Wiederholung desselben deutschen Verbs bewahrt diese Verbindung; »hinunterstürzen« bezeichnet im Fensterkontext natürlich und kraftvoll das Herabwerfen.
- source_word: ויז מדמה
  choice: Von ihrem Blut spritzte etwas
  rationale: Das Verb נזה bezeichnet hier ein Spritzen oder Verspritzen. Die Verbindung mit מן ist wörtlich »von/aus ihrem Blut« und lässt sich im Deutschen natürlich partitiv wiedergeben, ohne mehr Blutmenge zu behaupten, als der Text nennt.
- source_word: הקיר
  choice: die Mauer
  rationale: קיר bezeichnet eine Wand oder Mauer. Im äußeren Gebäudekontext ist »Mauer« die natürliche deutsche Bezeichnung.
- source_word: הסוסים
  choice: die Pferde
  rationale: Die gewöhnliche, direkte Wiedergabe des hebräischen Plurals.
- source_word: וירמסנה
  choice: und er zertrampelte sie
  rationale: רמס bedeutet »zertreten, zertrampeln«. Die maskuline Singularform verweist grammatisch auf Jehu als handelndes Subjekt und bewahrt die Härte der Darstellung.
theological_decisions:
- issue: Wer Isebel zertrampelt
  choice: »er zertrampelte sie« mit Jehu als grammatischem Subjekt
  alternative: »die Pferde zertrampelten sie« oder »er ließ sie zertrampeln«
  rationale: Das hebräische Verb steht im maskulinen Singular; »die Pferde« ist daher nicht das grammatische Subjekt. Wie Jehu die Handlung ausführte, bleibt unausgeführt und wird nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, unmittelbarer Erzählweise. Die Wiederholung von »hinunterstürzen« bildet die hebräische Wortwiederholung ab; die gewaltsame Sprache des Ausgangstextes wird nicht abgeschwächt.
