  text: ו/הית נִבְלַ֣ת אִיזֶ֗בֶל כְּ/דֹ֛מֶן עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה בְּ/חֵ֣לֶק יִזְרְעֶ֑אל אֲשֶׁ֥ר לֹֽא יֹאמְר֖וּ זֹ֥את אִיזָֽבֶל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: de
  text: 'Und Isebels Leichnam wird wie Mist auf dem Feld im Gebiet von Jesreel[a] liegen, sodass man sagen wird: »Das ist Isebel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Landstück von Jesreel“. Das hebräische Wort חֵלֶק kann einen bestimmten Landstrich oder ein einzelnes Grundstück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Und … wird … liegen
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt im prophetischen Zusammenhang die Zukunftsansage fort. Im Deutschen gibt „wird … liegen“ zugleich den resultierenden Zustand natürlich wieder.
- source_word: נִבְלַת אִיזֶבֶל
  choice: Isebels Leichnam
  rationale: נִבְלָה bezeichnet einen toten Körper. „Leichnam“ ist würdig, verständlich und bewahrt die drastische Aussage, ohne wie „Kadaver“ vorrangig an ein Tier zu denken.
- source_word: כְּדֹמֶן
  choice: wie Mist
  rationale: דֹּמֶן bezeichnet Mist beziehungsweise Dung. „Wie Mist“ gibt den unverhüllten Vergleich knapp und idiomatisch wieder.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: auf der Oberfläche des Feldes
  rationale: Die Wendung bedeutet wörtlich „auf dem Angesicht des Feldes“. „Auf der Oberfläche des Feldes“ bewahrt das räumliche Bild in natürlichem modernem Deutsch.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: im Gebiet von Jesreel
  rationale: חֵלֶק kann einen Anteil, ein bestimmtes Grundstück oder einen Landstrich bezeichnen. „Gebiet“ ist im Haupttext natürlich, während die engere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: sodass man nicht mehr sagen wird
  rationale: אֲשֶׁר führt hier am natürlichsten die Folge ein. Das unbestimmte pluralische Subjekt wird im Deutschen idiomatisch mit „man“ wiedergegeben; „mehr“ verdeutlicht den Verlust der Identifizierbarkeit im Kontext.
- source_word: זֹאת אִיזָבֶל
  choice: Das ist Isebel
  rationale: Die einfache hinweisende Identifikationsformel wird direkt und natürlich wiedergegeben.
