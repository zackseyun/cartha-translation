  text: וְ/לָקַחְתָּ֤ פַךְ הַ/שֶּׁ֨מֶן֙ וְ/יָצַקְתָּ֣ עַל רֹאשׁ֔/וֹ וְ/אָֽמַרְתָּ֙ כֹּֽה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵ֑ל וּ/פָתַחְתָּ֥ הַ/דֶּ֛לֶת וְ/נַ֖סְתָּה וְ/לֹ֥א תְחַכֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: de
  text: 'Dann nimm das Ölfläschchen, gieße es auf seinen Kopf und sage: »So spricht Jahwe: Ich habe dich zum König über Israel[a] gesalbt.« Dann öffne die Tür und flieh; warte nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu Israel“; in dieser Formel der Königseinsetzung ist „über Israel“ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: den Krug mit dem Öl
  rationale: פַךְ bezeichnet ein kleines Gefäß für Flüssigkeiten. „Krug“ ist im Deutschen natürlich und lässt die genaue Gefäßform offen; הַשֶּׁמֶן bedeutet schlicht „das Öl“, ohne dass die Ölsorte ausdrücklich genannt wird.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: gieße es auf seinen Kopf
  rationale: יצק mit עַל bezeichnet das Gießen auf etwas. Die Formulierung gibt die Handlung direkt und ohne zusätzliche Deutung wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die traditionelle deutsche Botenformel bewahrt den feierlichen prophetischen Ton; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: Ich habe dich zum König gesalbt
  rationale: Das Perfekt מְשַׁחְתִּי wird als vollzogene, durch die Salbung wirksame Handlung wiedergegeben; לְמֶלֶךְ bezeichnet die Einsetzung in das Königsamt.
- source_word: אֶל יִשְׂרָאֵל
  choice: über Israel
  rationale: Wörtlich steht die Präposition אֶל („zu/gegen“); in dieser Einsetzungsformel bezeichnet sie jedoch die Herrschaftsbeziehung zum Volk. „Über Israel“ ist im Deutschen idiomatisch.
- source_word: וּפָתַחְתָּ הַדֶּלֶת וְנַסְתָּה
  choice: Dann öffne die Tür und flieh
  rationale: Die aufeinanderfolgenden Verbformen geben eine Handlungsfolge wieder. „Flieh“ bewahrt die Dringlichkeit von נוס.
- source_word: וְלֹא תְחַכֶּה
  choice: warte nicht!
  rationale: חכה bedeutet hier „warten/verweilen“. Der Ausruf vermittelt die knappe Dringlichkeit des abschließenden Verbots.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יְהוָה. „Jahwe“ gibt diesen als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis des eingesetzten Königs zu Israel
  choice: zum König über Israel
  alternative: zum König für Israel / zu Israel
  rationale: Die ungewöhnliche Verbindung אֶל יִשְׂרָאֵל wird nicht hölzern wiedergegeben. Im Kontext der Königseinsetzung bezeichnet sie am ehesten den Herrschaftsbereich, ohne weitergehende Aussagen über das Königtum einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, dringlicher Befehlsfolge. Die prophetische Formel „So spricht Jahwe“ wahrt den feierlichen Ton. Der Fußnotenmarker wurde an die sachlich zugehörige Stelle nach „Israel“ gesetzt.
