base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: de
  text: 'Da ritt der Reiter ihm entgegen und sagte: »So spricht der König: Ist Frieden[a]?« Jehu aber sagte: »Was hast du mit Frieden zu schaffen? Dreh um und reih dich hinter mir ein.« Der Wächter meldete: »Der Bote hat sie erreicht, aber er kehrt nicht zurück.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ist alles in Ordnung?« Das hebräische Wort schalom kann hier Frieden, Wohlergehen oder unversehrte Verhältnisse bezeichnen und wird in Jehus Antwort wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: der Reiter
  rationale: Die Wendung bedeutet wörtlich »der Reiter des Pferdes«. Im Deutschen bezeichnet »der Reiter« die Person natürlich und eindeutig; das Verb »ritt« nimmt den Pferdebezug auf.
- source_word: לִקְרָאתוֹ
  choice: ihm entgegen
  rationale: Die Präposition mit Infinitiv bezeichnet eine Bewegung auf jemanden zu, um ihm zu begegnen. »Ihm entgegen« ist im erzählenden Zusammenhang knapp und idiomatisch.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: So spricht der König
  rationale: Die formelhafte Botenrede wird in würdigem, geläufigem Deutsch bewahrt.
- source_word: הֲשָׁלוֹם
  choice: Ist Frieden?
  rationale: Die bewusst knappe Formulierung erhält das Leitwort שָׁלוֹם, das in Jehus Antwort wiederkehrt. Die im Deutschen natürlichere Sinnmöglichkeit wird in der Fußnote genannt.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Was hast du mit Frieden zu schaffen?
  rationale: Die deutsche idiomatische Wendung gibt Jehus schroffe Zurückweisung wieder und bewahrt zugleich das wiederholte Wort »Frieden«.
- source_word: סֹב אֶל אַחֲרָי
  choice: Dreh um und reih dich hinter mir ein
  rationale: Das Hebräische befiehlt wörtlich eine Wendung hinter Jehu. Die Übersetzung macht die im militärischen Zusammenhang naheliegende Aufforderung verständlich, ohne ein bloßes Nachfolgen über den Text hinaus auszudeuten.
- source_word: הַצֹּפֶה
  choice: der Wächter
  rationale: Das substantivierte Partizip bezeichnet den Mann, der von seinem Beobachtungsposten aus Ausschau hält. »Wächter« ist hier geläufig und prägnant.
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: Im historischen Erzählzusammenhang ist ein menschlicher Abgesandter gemeint; »Bote« vermeidet die unzutreffende Assoziation eines Engels.
- source_word: בָּא ... עַד הֵם
  choice: hat sie erreicht
  rationale: Die Wendung bezeichnet das Eintreffen des Boten bei der Gruppe. Das deutsche Perfekt passt zur Meldung über das nun sichtbare Ergebnis.
- source_word: וְלֹא שָׁב
  choice: aber er kehrt nicht zurück
  rationale: 'Das Präsens gibt die unmittelbare Beobachtung des Wächters natürlich wieder: Der Bote ist angekommen und kommt nicht zurück.'
