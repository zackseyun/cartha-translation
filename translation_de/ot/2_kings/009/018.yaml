  source_fidelity: 'Die Übersetzung gibt den hebräischen Ablauf und die wesentlichen Bezüge zuverlässig wieder: Der berittene Bote reitet Jehu entgegen, überbringt die königliche Frage, wird schroff angewiesen, sich hinter Jehu einzureihen, und der Wächter meldet sein Ausbleiben. Die Wiederholung von „Frieden“ bewahrt das rhetorisch wichtige שָׁלוֹם. „Sie“ in „hat sie erreicht“ gibt das hebräische Pluralobjekt korrekt wieder.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen knapper, erzählerischer Rede. „Ist Frieden?“ ist bewusst markiert, aber als knappe formelhafte Anfrage verständlich; die Fußnote bietet die idiomatischere Sinnwiedergabe. „Dreh um und reih dich hinter mir ein“ ist natürlich und vermittelt den im Kontext naheliegenden Befehl.
  terminology: „Reiter“, „König“, „Frieden“, „Wächter“ und „Bote“ sind treffend. Insbesondere vermeidet „Bote“ die im Kontext falsche Engelas­soziation bei מַלְאָךְ. Die Fußnote zu „Frieden“ erklärt die semantische Spannweite von schalom und sichert die wiederholte Wortwahl ab.
