  source_fidelity: 'Die Übersetzung gibt den hebräischen Bericht präzise wieder: Der Wächter meldet das Eintreffen des Boten, dessen Ausbleiben und erkennt die Fahrweise als die Jehus. „Denn er fährt wie ein Wahnsinniger“ gibt בְּשִׁגָּעוֹן יִנְהָג angemessen als drastische Charakterisierung der Fahrweise wieder, ohne sie auf bloße Geschwindigkeit zu reduzieren.'
