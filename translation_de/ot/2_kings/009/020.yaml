source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד הַ/צֹּפֶה֙ לֵ/אמֹ֔ר בָּ֥א עַד אֲלֵי/הֶ֖ם וְ/לֹֽא שָׁ֑ב וְ/הַ/מִּנְהָ֗ג כְּ/מִנְהַג֙ יֵה֣וּא בֶן נִמְשִׁ֔י כִּ֥י בְ/שִׁגָּע֖וֹן יִנְהָֽג־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: de
  text: 'Da meldete der Wächter: „Er ist bei ihnen angekommen, aber er ist nicht zurückgekehrt. Und die Fahrweise ist wie die Fahrweise Jehus, des Sohnes Nimschis; denn er fährt wie ein Wahnsinniger.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד הַצֹּפֶה
  choice: Da meldete der Wächter
  rationale: נגד bezeichnet hier die Meldung des postierten Beobachters. „Meldete“ passt natürlich in den militärisch-königlichen Zusammenhang; „Wächter“ gibt צֹפֶה verständlich wieder.
- source_word: לֵאמֹר
  choice: direkte Rede ohne eigenes „und sagte“
  rationale: Der hebräische Redeanzeiger wird im Deutschen durch Doppelpunkt und direkte Rede idiomatisch und vollständig ausgedrückt.
- source_word: בָּא עַד אֲלֵיהֶם
  choice: Er ist bei ihnen angekommen
  rationale: Die Verbindung von בוא mit עַד und אֶל bezeichnet, dass der Bote die Gruppe erreicht hat.
- source_word: וְלֹא שָׁב
  choice: aber er ist nicht zurückgekehrt
  rationale: Das Perfekt beschreibt den bis zum Zeitpunkt der Meldung fortbestehenden Befund; „aber“ macht den im Zusammenhang liegenden Gegensatz deutlich.
- source_word: וְהַמִּנְהָג כְּמִנְהַג
  choice: Und die Fahrweise ist wie die Fahrweise
  rationale: מִנְהָג bezeichnet hier angesichts der Wagenfahrt die charakteristische Art des Fahrens. Die Wiederholung bewahrt die auffällige hebräische Formulierung.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Jehus, des Sohnes Nimschis
  rationale: Der Genitiv fügt sich in den deutschen Vergleich ein; das Patronym wird ausdrücklich bewahrt.
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: denn er fährt wie ein Wahnsinniger
  rationale: בְשִׁגָּעוֹן beschreibt adverbial eine wahnsinnige, rasende Fahrweise. Die Formulierung wahrt die starke Aussage des hebräischen Substantivs und klingt im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am hebräischen Bericht, wird aber durch den idiomatischen deutschen Redeanschluss geglättet. „Wie ein Wahnsinniger“ erhält die drastische Charakterisierung, ohne sie zum bloßen Tempoausdruck „schnell“ oder „wild“ abzuschwächen.
