  terminology: „Wächter“, „Fahrweise“, „Jehu“ und „Nimschi“ sind sachgerecht. Die patronymische Genitivkonstruktion „Jehus, des Sohnes Nimschis“ ist korrekt und natürlich. Es sind keine theologischen Fachbegriffe oder strittigen Deutungen betroffen.
