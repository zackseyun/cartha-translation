id: 2KI.9.31
reference: 2 Kings 9:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֵה֖וּא בָּ֣א בַ/שָּׁ֑עַר וַ/תֹּ֣אמֶר הֲ/שָׁל֔וֹם זִמְרִ֖י הֹרֵ֥ג אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: de
  text: 'Als Jehu durch das Tor kam, sagte sie: »Ist Frieden[b], Simri[a], Mörder seines Herrn[c]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isebel nennt Jehu spöttisch „Simri“ und vergleicht ihn damit mit Simri, der seinen Herrn tötete und die Königsherrschaft an sich riss; siehe 1. Könige 16,9–20.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Ist alles in Ordnung?“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „einer, der seinen Herrn tötet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: durch das Tor kam
  rationale: Die Verbindung bezeichnet Jehus Bewegung in den Torbereich beziehungsweise durch das Stadttor. Die deutsche Formulierung ist natürlich und wahrt die räumliche Bewegung des hebräischen Textes.
- source_word: וַתֹּאמֶר
  choice: sagte sie
  rationale: Die feminine Singularform verweist im Zusammenhang auf Isebel; das Pronomen macht diesen Bezug im Deutschen ausdrücklich.
- source_word: הֲשָׁלוֹם
  choice: Ist Frieden
  rationale: Die knappe Frage bewahrt die ungewöhnliche Schärfe und Mehrdeutigkeit des Hebräischen zwischen einer Frage nach Frieden und einer Frage danach, ob alles gut steht.
- source_word: זִמְרִי
  choice: Simri
  rationale: Der Name wird nach der üblichen deutschen Bibelschreibung wiedergegeben. Isebel gebraucht ihn als spöttische Anrede für Jehu und stellt ihn damit dem früheren Königsmörder Simri gleich.
- source_word: הֹרֵג
  choice: Mörder
  rationale: Das Partizip bedeutet wörtlich „Tötender“ beziehungsweise „einer, der tötet“. Im anklagenden, spöttischen Zusammenhang gibt „Mörder“ seine Funktion natürlich wieder.
- source_word: אֲדֹנָיו
  choice: seines Herrn
  rationale: אדון bezeichnet hier den menschlichen Herrn beziehungsweise König Simris. „Herr“ bewahrt die traditionelle und sachlich passende Beziehung eines Untergebenen zu seinem Gebieter.
theological_decisions:
- issue: Deutung der Anrede „Simri, Mörder seines Herrn“
  choice: Die Worte werden als spöttischer Vergleich Jehus mit dem früheren Usurpator Simri wiedergegeben, ohne den Vergleich im Haupttext erklärend aufzulösen.
  alternative: Die Anrede könnte ohne Hinweis auf ihren anspielenden Charakter rein wörtlich gelesen werden, als ob Jehu tatsächlich Simri genannt würde.
  rationale: 'Der historische Zusammenhang von 1. Könige 16,9–20 macht die polemische Anspielung wahrscheinlich: Simri tötete seinen Herrn und riss die Königsherrschaft an sich. Die Übersetzung erhält sowohl den Wortlaut als auch seine Spannung.'
- issue: Bedeutung von הֲשָׁלוֹם
  choice: „Ist Frieden?“
  alternative: „Ist alles in Ordnung?“ oder „Kommst du in Frieden?“
  rationale: Die formnahe Wiedergabe lässt offen, ob Isebel nach Frieden, Wohlergehen oder dem guten Ausgang von Jehus Unternehmen fragt, und vermeidet eine vorschnelle Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst knappe und im Deutschen leicht fremd klingende Frage „Ist Frieden?“ erhält die rhetorische Härte und Mehrdeutigkeit des Hebräischen. Die Namensform „Simri“ folgt der üblichen deutschen Bibeltradition.
