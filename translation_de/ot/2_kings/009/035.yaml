  text: וַ/יֵּלְכ֖וּ לְ/קָבְרָ֑/הּ וְ/לֹא מָ֣צְאוּ בָ֗/הּ כִּ֧י אִם הַ/גֻּלְגֹּ֛לֶת וְ/הָ/רַגְלַ֖יִם וְ/כַפּ֥וֹת הַ/יָּדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: de
  text: Da gingen sie hin, um sie zu begraben. Doch sie fanden nichts mehr von ihr als den Schädel, die Füße und die Handflächen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Da gingen sie hin
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da gingen sie hin“ gibt die zeitlich-folgernde Bewegung in natürlichem deutschem Erzählstil wieder.
- source_word: לְקָבְרָהּ
  choice: um sie zu begraben
  rationale: Der Infinitiv von קבר mit Suffix der 3. Person Feminin Singular bezeichnet Isebel und drückt den Zweck des Hingehens aus.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: Doch sie fanden nichts mehr von ihr
  rationale: Das וְ wirkt im Zusammenhang adversativ. Das wörtliche „in ihr“ ist hier idiomatisch auf die noch vorhandenen Körperreste bezogen; „nichts mehr von ihr“ macht diesen Sinn im Deutschen klar.
- source_word: כִּי אִם
  choice: als
  rationale: Nach „nichts“ gibt „als“ die hebräische Ausnahmeformel knapp und idiomatisch wieder.
- source_word: הַגֻּלְגֹּלֶת
  choice: den Schädel
  rationale: גֻּלְגֹּלֶת bezeichnet hier den Schädel, nicht allgemein den Kopf, und bewahrt die drastische Konkretheit des Berichts.
- source_word: וְהָרַגְלַיִם
  choice: die Füße
  rationale: רַגְלַיִם bezeichnet in diesem anatomischen Zusammenhang am naheliegendsten die Füße.
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: die Handflächen
  rationale: כַּפּוֹת bezeichnet die flachen beziehungsweise hohlen Innenseiten der Hände; „Handflächen“ bewahrt die anatomische Genauigkeit ohne unnötige Umschreibung.
