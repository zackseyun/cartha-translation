base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: de
  text: 'Da ging Jehu zu den Dienern seines Herrn hinaus. Einer fragte ihn: »Ist alles in Ordnung?[a] Warum ist dieser Verrückte[b] zu dir gekommen?« Er antwortete ihnen: »Ihr kennt den Mann und seine Rede.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ist Frieden?« Gemeint ist die Frage, ob alles gut oder in Ordnung ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »dieser Wahnsinnige« oder »dieser verrückte Kerl«. Das hebräische Wort ist abwertend.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »sein Gespräch«, »seine Äußerungen« oder »seine Art zu reden«. Das hebräische Wort kann allgemein die Rede oder das Reden eines Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: die Diener seines Herrn
  rationale: Die Wendung bezeichnet die Untergebenen von Jehus Vorgesetztem. »Diener« vermeidet hier die unpassende Verengung auf Sklaven; »Herr« bewahrt die offene Bezeichnung des Hebräischen, ohne ausdrücklich »König« einzusetzen.
- source_word: הֲשָׁלוֹם
  choice: Ist alles in Ordnung?
  rationale: Die wörtliche Frage nach »Frieden« ist hier eine idiomatische Erkundigung, ob alles gut beziehungsweise unbedenklich ist. Die deutsche Formulierung klingt natürlich und wahrt den Fragesinn.
- source_word: מַדּוּעַ בָּא
  choice: Warum ist … gekommen?
  rationale: Das deutsche Perfekt ist in gegenwärtiger direkter Rede die natürliche Form für die Frage nach dem unmittelbar vorausgehenden Kommen.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: dieser Verrückte
  rationale: Der Ausdruck ist eine abwertende Bezeichnung für einen als wahnsinnig oder rasend angesehenen Mann. »Dieser Verrückte« erhält den verächtlichen Ton in verständlichem modernem Deutsch.
- source_word: וַיֹּאמֶר לוֹ
  choice: Einer fragte ihn
  rationale: Das Verb steht im Singular, obwohl zuvor eine Mehrzahl genannt wird. »Einer« gibt plausibel wieder, dass einer aus der Gruppe das Wort ergreift; »fragte« entspricht der folgenden direkten Frage im Deutschen natürlicher als das allgemeinere »sagte«.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: Ihr kennt doch den Mann
  rationale: »Doch« bringt die ausweichende, voraussetzende Färbung der Antwort idiomatisch zum Ausdruck, ohne den Inhalt näher festzulegen.
- source_word: שִׂיחוֹ
  choice: sein Gerede
  rationale: Das Wort kann Rede, Äußerung oder Gespräch bezeichnen. »Gerede« wahrt den unbestimmten Bezug auf seine Rede und passt zum abschätzigen Ton, ohne es ausdrücklich als Botschaft oder sinnloses Gestammel festzulegen.
