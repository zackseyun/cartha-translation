id: 2KI.9.29
reference: 2 Kings 9:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בִ/שְׁנַת֙ אַחַ֣ת עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/יוֹרָ֖ם בֶּן אַחְאָ֑ב מָלַ֥ךְ אֲחַזְיָ֖ה עַל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: de
  text: Im elften Regierungsjahr Jorams, des Sohnes Ahabs,[a] wurde Ahasja König über Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zeitangaben zu den Regierungszeiten Jorams und Ahasjas lassen sich in den Büchern Könige und Chronik nur schwer miteinander in Einklang bringen. Hier wird der hebräische Text so wiedergegeben, wie er überliefert ist, ohne die Chronologie im Haupttext aufzulösen.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַת עֶשְׂרֵה שָׁנָה
  choice: Im elften Regierungsjahr
  rationale: Die hebräische Wendung bezeichnet idiomatisch das elfte Jahr einer Herrschaft. „Regierungsjahr“ macht den chronologischen Bezug im Deutschen eindeutig; das einleitende ו wird in der natürlichen deutschen Zeitangabe nicht eigens wiedergegeben.
- source_word: לְיוֹרָם
  choice: Jorams
  rationale: Das ל kennzeichnet hier den Herrscher, dessen Regierungsjahre als zeitlicher Bezugspunkt dienen. Der deutsche Genitiv gibt die übliche Königsjahrformel natürlich wieder.
- source_word: בֶּן אַחְאָב
  choice: des Sohnes Ahabs
  rationale: Die Apposition identifiziert Joram durch seine Abstammung und wird im Deutschen eindeutig und würdig mit einer Genitivfügung wiedergegeben.
- source_word: מָלַךְ
  choice: wurde ... König
  rationale: Das Verb bezeichnet in dieser chronologischen Notiz den Regierungsantritt, nicht die gesamte Regierungsdauer. „Wurde König“ gibt diesen ingressiven Sinn in heutigem Deutsch klar wieder.
- source_word: אֲחַזְיָה
  choice: Ahasja
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: עַל יְהוּדָה
  choice: über Juda
  rationale: Bei מלך bezeichnet עַל den Herrschaftsbereich. „König über Juda“ bewahrt diese Beziehung natürlich und präzise.
theological_decisions:
- issue: Chronologische Spannung zwischen den Regierungsangaben in Könige und Chronik
  choice: Die masoretische Lesart „im elften Regierungsjahr Jorams“ wird unverändert im Haupttext wiedergegeben.
  alternative: Die Jahresangabe harmonisieren oder nach abweichenden Textzeugen beziehungsweise Parallelstellen ändern.
  rationale: Die Übersetzung folgt dem vorgelegten hebräischen Text und löst die überlieferte chronologische Schwierigkeit nicht stillschweigend auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die knappe Form einer königlichen Chroniknotiz bleibt erhalten.
