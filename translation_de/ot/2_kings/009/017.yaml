  text: וְ/הַ/צֹּפֶה֩ עֹמֵ֨ד עַֽל הַ/מִּגְדָּ֜ל בְּ/יִזְרְעֶ֗אל וַ/יַּ֞רְא אֶת שִׁפְעַ֤ת יֵהוּא֙ בְּ/בֹא֔/וֹ וַ/יֹּ֕אמֶר שִׁפְעַ֖ת אֲנִ֣י רֹאֶ֑ה וַ/יֹּ֣אמֶר יְהוֹרָ֗ם קַ֥ח רַכָּ֛ב וּֽ/שְׁלַ֥ח לִ/קְרָאתָ֖/ם וְ/יֹאמַ֥ר הֲ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: de
  text: 'Der Wächter stand auf dem Turm in Jesreel. Er sah Jehu mit seiner Schar herankommen und sagte: »Ich sehe eine Schar!« Da sagte Joram: »Nimm einen Reiter und schick ihn ihnen entgegen. Er soll fragen: ›Ist Frieden?‹[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Ist alles in Ordnung?«'
    reason: Die knappe hebräische Frage kann sowohl nach friedlicher Absicht als auch danach fragen, ob alles wohlsteht.
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: der Wächter
  rationale: Bezeichnet einen Mann, der Ausschau hält; »Wächter« ist im erzählerischen Zusammenhang klar und eingeführt.
- source_word: עֹמֵד
  choice: stand
  rationale: Das Partizip beschreibt den andauernden Hintergrundzustand; im Deutschen gibt das Präteritum diesen szenischen Rahmen natürlich wieder.
- source_word: הַמִּגְדָּל
  choice: der Turm
  rationale: Gibt die Grundbedeutung wieder, ohne die kontextuelle Funktion als Wachturm in das Substantiv einzutragen.
- source_word: בְּיִזְרְעֶאל
  choice: in Jesreel
  rationale: Im Deutschen gebräuchliche Form des Ortsnamens.
- source_word: שִׁפְעַת
  choice: Schar
  rationale: Das seltene Wort bezeichnet hier eine sichtbare größere Gruppe; »Schar« wahrt die Unbestimmtheit, ohne eine feste militärische Einheit zu behaupten.
- source_word: יֵהוּא ... בְּבֹאוֹ
  choice: Jehu ... herankommen
  rationale: Der singularische Bezug auf Jehu bleibt erhalten; »herankommen« drückt die vom Turm aus beobachtete Annäherung natürlich aus.
- source_word: קַח רַכָּב
  choice: Nimm einen Reiter
  rationale: Der Singular und die anschließenden singularischen Verbformen sprechen für einen einzelnen berittenen Boten.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: schick ihn ihnen entgegen
  rationale: Der pluralische Suffixbezug wird bewahrt und gilt der gesichteten Gruppe.
- source_word: וְיֹאמַר
  choice: Er soll fragen
  rationale: Gibt den jussivischen Sinn nach der Befehlsform idiomatisch wieder; im Deutschen ist bei der folgenden Frage »fragen« natürlicher als »sagen«.
- source_word: הֲשָׁלוֹם
  choice: Ist Frieden?
  rationale: Bewahrt die knappe, mehrdeutige Frage nach friedlicher Absicht beziehungsweise Wohlergehen und erhält das wiederkehrende Friedensmotiv des Abschnitts.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die ungewöhnlich knappe Frage »Ist Frieden?« bleibt bewusst stehen; die idiomatischere deutsche Wiedergabe wird in der Fußnote angeboten. Die Namen erscheinen in den im Deutschen üblichen Formen »Jesreel« und »Joram«.
