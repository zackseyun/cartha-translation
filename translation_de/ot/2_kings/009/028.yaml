base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/028.yaml
  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: de
  text: Seine Diener brachten ihn nach Jerusalem und begruben ihn in seinem Grab bei seinen Vätern[a] in der Stadt Davids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Bei seinen Vätern“ ist eine hebräische Bestattungsformel und meint hier: bei seinen königlichen Vorfahren.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: brachten
  rationale: Der Hifil von רכב bedeutet wörtlich „reiten lassen“ bzw. „befördern“. Da Ahasja bereits tot ist, gibt „brachten“ den Transport des Leichnams natürlich wieder, ohne ihn als lebenden Reiter erscheinen zu lassen.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד bezeichnet hier Männer im königlichen Dienst; „Diener“ ist direkt, verständlich und lässt die mögliche Funktion als Hofbedienstete oder Amtsträger offen.
- source_word: יְרוּשָׁלָמָה
  choice: nach Jerusalem
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf Jerusalem zu; im Deutschen ist „nach Jerusalem“ die natürliche Wiedergabe.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: und begruben ihn
  rationale: Die fortgesetzte Handlung wird knapp wiedergegeben; „seine Diener“ bleibt das eindeutige Subjekt.
- source_word: בִקְבֻרָתוֹ
  choice: in seinem Grab
  rationale: Das Substantiv bezeichnet seine Grabstätte. „Grab“ ist im Deutschen natürlich und wahrt den Possessivbezug des Hebräischen.
- source_word: עִם אֲבֹתָיו
  choice: bei seinen Vätern
  rationale: „Bei seinen Vätern“ bewahrt die hebräische Bestattungsformel und klingt für eine Beisetzung inmitten der Vorfahren im Deutschen natürlicher als das räumlich möglicherweise missverständliche „mit seinen Vätern“.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Direkte und im Deutschen etablierte Wiedergabe der Ortsbezeichnung.
