  text: וְ/אָבַ֖ד כָּל בֵּ֣ית אַחְאָ֑ב וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: de
  text: Das ganze Haus Ahabs wird zugrunde gehen, und ich werde in Israel jeden männlichen Angehörigen[a] Ahabs ausrotten, ob gebunden oder frei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeden, der gegen eine Wand uriniert“; eine derbe hebräische Umschreibung für männliche Personen.'
    reason: Die wörtliche Gestalt des Idioms wird offengelegt, während der Haupttext seine gemeinte Bedeutung verständlich wiedergibt.
  - marker: b
    text: 'Wörtlich etwa: „den Eingeschlossenen und den Verlassenen“. Die genaue Bedeutung dieser festen Paarformel ist unsicher; gemeint ist offenbar, dass keiner ausgenommen wird.'
    reason: Die Übersetzung bewahrt eine echte lexikalische Unsicherheit und vermeidet eine unbelegte Festlegung auf bestimmte soziale oder rechtliche Gruppen.
lexical_decisions:
- source_word: וְאָבַד
  choice: wird zugrunde gehen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ steht in der prophetischen Gerichtsaussage für ein zukünftiges Geschehen. „Zugrunde gehen“ bewahrt den Gerichtssinn, ohne die im Verb nicht ausdrücklich bezeichnete Ursache zu ergänzen.
- source_word: כָּל בֵּית אַחְאָב
  choice: das ganze Haus Ahabs
  rationale: „Haus“ bleibt als biblischer Ausdruck für Familie, Gefolge und Dynastie erhalten; „das ganze“ gibt die umfassende Aussage natürlich wieder.
- source_word: וְהִכְרַתִּי
  choice: ich werde … ausrotten
  rationale: Das Hifil von כרת bezeichnet hier die vollständige Beseitigung einer Linie. „Ausrotten“ ist im Deutschen klarer als das wörtlichere „abschneiden“ und bewahrt die Schärfe des Gerichtswortes.
- source_word: לְאַחְאָב
  choice: Ahabs
  rationale: Das לְ kennzeichnet hier die Zugehörigkeit zu Ahab. Der deutsche Genitiv gibt diese Beziehung natürlich wieder.
- source_word: מַשְׁתִּין בְּקִיר
  choice: jeden männlichen Angehörigen Ahabs[a]
  rationale: Die derbe hebräische Wendung bezeichnet die männlichen Angehörigen. Die verständliche Bedeutung steht im Haupttext; der wörtliche Ausdruck wird aus Gründen der Transparenz in der Fußnote genannt.
- source_word: וְעָצוּר וְעָזוּב
  choice: den Gebundenen wie den Freien[b]
  rationale: Die formelhafte Paarung wird relativ formal wiedergegeben, da ihre genaue soziale Bedeutung umstritten ist. Sie unterstreicht jedenfalls die ausnahmslose Reichweite des Gerichts.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: 'Die Präposition wird räumlich verstanden: Das Urteil betrifft Ahabs männliche Angehörige in Israel.'
theological_decisions:
- issue: Wiedergabe der dynastischen Gerichtsformel
  choice: „Haus Ahabs“ und die umfassende Ausrottung aller männlichen Angehörigen werden ausdrücklich beibehalten.
  alternative: Dynamische Zusammenfassung als „Ich werde Ahabs ganze Familie vernichten“.
  rationale: Die gewählte Fassung erhält das Bild des königlichen „Hauses“, die dynastische Dimension des Gerichtswortes und den ausdrücklich auf männliche Angehörige bezogenen hebräischen Ausdruck, ohne zusätzliche dogmatische Deutung.
- issue: Deutung von וְעָצוּר וְעָזוּב
  choice: „den Gebundenen wie den Freien“ mit erläuternder Fußnote
  alternative: Festlegung auf „Sklaven und Freie“, „Unmündige und Mündige“ oder „Bewahrte und Verlassene“.
  rationale: Die genaue Referenz der festen Wendung ist unsicher. Eine formnahe Übersetzung bewahrt diese Unschärfe und macht zugleich deutlich, dass niemand ausgenommen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz behält die biblische Rede vom „Haus Ahabs“ bei, erklärt jedoch den derben männlichen Ausdruck in einer Fußnote. Die seltene Paarung „Gebundene wie Freie“ ist bewusst formnah und wird wegen ihrer unsicheren Bedeutung erläutert.
