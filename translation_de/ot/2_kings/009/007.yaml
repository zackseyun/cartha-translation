  text: וְ/הִ֨כִּיתָ֔ה אֶת בֵּ֥ית אַחְאָ֖ב אֲדֹנֶ֑י/ךָ וְ/נִקַּמְתִּ֞י דְּמֵ֣י עֲבָדַ֣/י הַ/נְּבִיאִ֗ים וּ/דְמֵ֛י כָּל עַבְדֵ֥י יְהוָ֖ה מִ/יַּ֥ד אִיזָֽבֶל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: de
  text: Und du sollst das Haus Ahabs, deines Herrn, niederschlagen. Und ich werde das Blut meiner Diener, der Propheten, und das Blut aller Diener Jahwes an Isebel rächen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von der Hand Isebels“; eine hebräische Wendung dafür, dass Isebel für das vergossene Blut verantwortlich ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: Und du sollst … erschlagen
  rationale: נכה bezeichnet hier im Zusammenhang des Gerichts über ein Königshaus ein tödliches, vernichtendes Schlagen. „Erschlagen“ gibt diese Stärke in würdigem, verständlichem Deutsch wieder.
- source_word: בֵּית אַחְאָב
  choice: das Haus Ahabs
  rationale: „Haus“ bewahrt die biblische Ausdrucksweise für Familie, Gefolge und dynastische Linie eines Königs.
- source_word: אֲדֹנֶיךָ
  choice: deines Herrn
  rationale: Das Wort bezeichnet hier Jehus menschlichen Oberherrn. Die Kleinschreibung unterscheidet ihn von einer Gottesbezeichnung.
- source_word: וְנִקַּמְתִּי
  choice: So werde ich … rächen
  rationale: נקם bezeichnet Gottes vergeltendes Eintreten für die Ermordeten. „Rächen“ erhält die ausdrückliche Aussage göttlicher Vergeltung, ohne sie auszudeuten.
- source_word: דְּמֵי
  choice: das Blut
  rationale: Der hebräische Plural „Blute“ bezeichnet vergossenes Blut beziehungsweise Blutschuld; im Deutschen ist der Singular „Blut“ idiomatisch.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: meiner Diener, der Propheten
  rationale: Die Apposition macht deutlich, dass die Propheten als Gottes Diener bezeichnet werden.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: aller Diener Jahwes
  rationale: Die Genitivverbindung folgt dem hebräischen Konstrukt und gibt den Gottesnamen als Eigennamen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Tetragramms als Eigenname bewahrt, dass im Hebräischen der Gottesname und nicht ein Titel steht.
- source_word: מִיַּד אִיזָבֶל
  choice: an Isebel
  rationale: Die hebräische Wendung „aus/von der Hand Isebels“ bezeichnet Isebel als verantwortliche Urheberin. „An Isebel rächen“ ist im Deutschen die natürliche Entsprechung im Zusammenhang mit נקם.
theological_decisions:
- issue: Göttliche Vergeltung
  choice: So werde ich … rächen
  alternative: So werde ich Vergeltung üben für …
  rationale: Der Text schreibt Gott selbst die Vergeltung für das vergossene Blut zu. Diese theologische Spannung wird weder abgeschwächt noch über den Wortlaut hinaus erklärt.
- issue: Umfang des „Hauses Ahabs“
  choice: das Haus Ahabs
  alternative: die Dynastie Ahabs
  rationale: „Haus“ lässt die im Hebräischen vorhandene Bandbreite zwischen Familie, Hofverband und Herrscherlinie bestehen, statt sie auf den dynastischen Aspekt zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblischer Königshaus-Terminologie. Die Satzteilung sorgt für Klarheit; „So“ gibt die resultative Verbindung der beiden hebräischen Teilsätze natürlich wieder.
