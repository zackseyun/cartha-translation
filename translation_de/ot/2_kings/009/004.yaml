  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: de
  text: Da ging der junge Mann, der junge Prophet[a], nach Ramot-Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „der junge Mann, der junge Mann, der Prophet“. Die Wortfolge ist ungewöhnlich; die Übersetzung gibt sie appositionell wieder.'
    reason: Die Fußnote legt die genaue hebräische Wiederholung offen und kennzeichnet zugleich, dass die deutsche Formulierung eine verständliche appositionelle Wiedergabe ist.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging
  rationale: Das narrative Waw mit der Verbform führt die Handlung fort. „Da ging“ gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר bezeichnet hier den von Elisa ausgesandten jungen Mann; „der junge Mann“ ist verständlich und legt keine besondere Amtsfunktion fest.
- source_word: הַנַּעַר הַנָּבִיא
  choice: der junge Mann, der junge Prophet
  rationale: Die unmittelbar wiederholte Form הַנַּעַר und das folgende הַנָּבִיא werden appositionell verstanden. Die Wiedergabe wahrt die auffällige Wiederholung und vermeidet die im Hebräischen nicht ausdrücklich ausgedrückte Besitzkonstruktion „Diener des Propheten“.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Der Ortsname wird in der im Deutschen üblichen biblischen Form mit Bindestrich wiedergegeben.
theological_decisions:
- issue: Bezeichnet הַנָּבִיא den jungen Mann selbst oder seine Zugehörigkeit zu einem Propheten?
  choice: der junge Prophet
  alternative: der Diener des Propheten
  rationale: Der masoretische Wortlaut enthält keinen Genitiv und setzt הַנָּבִיא mit Artikel neben die wiederholte Bezeichnung הַנַּעַר. Daher ist die appositionelle Lesart näher am überlieferten Text; die ungewöhnliche Formulierung und mögliche Spannung werden nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Wiederholung wird bewusst im Haupttext erhalten; die Fußnote erläutert ihre Ungewöhnlichkeit.
