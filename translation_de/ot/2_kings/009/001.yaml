  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: de
  text: 'Dann rief der Prophet Elisa einen von den Prophetenschülern[a] und sagte zu ihm: »Binde dein Gewand hoch[b], nimm dieses Fläschchen mit Öl in die Hand und geh nach Ramot-Gilead.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen von den Söhnen der Propheten“. Gemeint sind Angehörige einer prophetischen Gemeinschaft, nicht unbedingt leibliche Söhne von Propheten.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Gürte deine Hüften“. Die Wendung bezeichnet das Hochbinden langer Gewänder, um sich zum raschen Aufbruch oder zum Handeln bereitzumachen.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: Dann rief der Prophet Elisa
  rationale: Das einleitende ו führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge natürlich wieder. Der appositionelle Titel steht im Deutschen idiomatisch vor dem Namen.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: einen von den Prophetenschülern
  rationale: Wörtlich „von den Söhnen der Propheten“; gemeint sind Angehörige einer prophetischen Gemeinschaft, nicht leibliche Söhne. „Prophetenschüler“ ist im modernen Deutsch verständlich und wahrt diesen institutionellen Sinn.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Gürte deine Hüften
  rationale: Die konkrete hebräische Wendung bleibt erhalten, während eine Fußnote ihre kulturell bedingte Bedeutung als Vorbereitung zum raschen Aufbruch erklärt.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: diesen Ölkrug
  rationale: פַּךְ bezeichnet ein kleines Gefäß, besonders für Öl. „Ölkrug“ ist natürlich und lässt die genaue Form und Größe offen.
- source_word: בְּיָדֶךָ
  choice: in die Hand
  rationale: Die konkrete Körperangabe des Hebräischen wird bewahrt; nach „nimm“ verlangt natürliches Deutsch den Akkusativ mit Richtungsbedeutung.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Gebräuchliche deutsche Transliteration des Ortsnamens.
theological_decisions: []
