  source_fidelity: 'Der Entwurf gibt den hebräischen Sinn insgesamt zuverlässig wieder: Jorams Rückkehr und Genesung, die Verwundung durch die Aramäer im Kampf gegen Hasaël sowie Jehús Weisung sind sachgerecht erfasst. Im zweiten Satz sollte jedoch die Zweckbeziehung von „aus der Stadt entkommen“ zu „nach Jesreel gehen und melden“ im Deutschen eindeutiger markiert werden.'
