  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: de
  text: 'König Joram war nach Jesreel zurückgekehrt, um sich von den Wunden zu erholen, die ihm die Aramäer beigebracht hatten, als er gegen Hasaël, den König von Aram, kämpfte. Jehu sagte: »Wenn ihr das wollt, darf niemand aus der Stadt entkommen, um nach Jesreel zu gehen und es dort zu melden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: war … zurückgekehrt
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Jorams Rückkehr nach Jesreel der nun berichteten Anweisung Jehus vorausging; שׁוב bedeutet hier „zurückkehren“.
- source_word: לְהִתְרַפֵּא
  choice: um sich … zu erholen
  rationale: Der Hitpael von רפא bezeichnet hier die Genesung von Verletzungen. Die deutsche Wendung ist natürlich und behauptet keine eigenmächtige Selbstheilung.
- source_word: מִן הַמַּכִּים אֲשֶׁר יַכֻּהוּ
  choice: von den Wunden …, die ihm … beigebracht hatten
  rationale: מַכִּים bezeichnet in diesem Zusammenhang die im Kampf erlittenen Verwundungen; נכה beschreibt, dass die Aramäer sie ihm zufügten.
- source_word: אֲרַמִּים
  choice: die Aramäer
  rationale: Die historische Volksbezeichnung wird direkt wiedergegeben; „Syrer“ wäre in diesem Zusammenhang weniger genau.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: als er gegen Hasaël … kämpfte
  rationale: ב mit dem Infinitiv constructus bezeichnet den zeitlichen Begleitumstand; „gegen“ bringt die feindliche Beziehung im Deutschen klar zum Ausdruck.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: Wenn ihr das wollt
  rationale: Die wörtlich ungewöhnliche Wendung mit נֶפֶשׁ drückt den Willen beziehungsweise Wunsch der Angesprochenen aus. Die Übersetzung bewahrt den konditionalen Charakter in geläufigem Deutsch.
- source_word: אַל יֵצֵא פָלִיט מִן הָעִיר
  choice: darf niemand aus der Stadt entkommen
  rationale: פָלִיט bezeichnet hier nicht zwingend eine bereits feststehende Personengruppe von Flüchtlingen, sondern jeden, dem die Flucht gelingen könnte. Das Verbot wird im Deutschen idiomatisch mit „darf niemand“ ausgedrückt.
- source_word: לָלֶכֶת לְהַגִּיד בְּיִזְרְעֶאל
  choice: nach Jesreel gehen, um es dort zu melden
  rationale: Die aufeinanderfolgenden Infinitive beschreiben das Weggehen mit dem Zweck, die Nachricht in Jesreel zu überbringen. „dort“ verdeutlicht lediglich den Ortsbezug von בְּיִזְרְעֶאל.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Namensform „Joram“ folgt dem im Deutschen für diesen König üblichen Gebrauch; „Hasaël“, „Jehu“, „Jesreel“ und „Aram“ bleiben historisch erkennbare Eigennamen. Keine erläuternden Fußnoten sind erforderlich.
