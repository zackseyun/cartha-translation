  terminology: „Joram“, „Jesreel“, „Aramäer“, „Hasaël“, „Aram“ und „Jehu“ sind konsistent und historisch angemessen. „Wenn ihr das wollt“ trifft die volitive hebräische Wendung idiomatisch. Keine theologischen Fachbegriffe oder Fußnoten sind erforderlich.
