  edition: WLC
  text: וַ/יָּ֨קָם֙ וַ/יָּבֹ֣א הַ/בַּ֔יְתָ/ה וַ/יִּצֹ֥ק הַ/שֶּׁ֖מֶן אֶל רֹאשׁ֑/וֹ וַ/יֹּ֣אמֶר ל֗/וֹ כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מְשַׁחְתִּ֧י/ךָֽ לְ/מֶ֛לֶךְ אֶל עַ֥ם יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: de
  text: 'Da stand er auf und ging ins Haus. Dann goss er das Öl auf seinen Kopf und sagte zu ihm: »So spricht Jahwe, der Gott Israels: Ich habe dich zum König über das Volk Jahwes, über Israel, gesalbt.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hiermit salbe ich dich zum König über das Volk Jahwes, über Israel.« Das hebräische Perfekt kann in dieser Salbungsformel performativ verstanden werden.'
    reason: Alternative Deutung der Verbform als performative Einsetzungsformel.
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da stand er auf
  rationale: Das Wayyiqtol führt die Erzählung fort; »stand auf« ist im modernen Deutschen natürlich und wahrt den konkreten Handlungsablauf.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: ging ins Haus
  rationale: Die Richtungsendung an בַּיִת bezeichnet die Bewegung in das Haus hinein; »ging ins Haus« entspricht dem Erzählstandpunkt.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: goss das Öl auf seinen Kopf
  rationale: יצק bedeutet hier »gießen«; der bestimmte Artikel wird mit »das Öl« wiedergegeben. »Kopf« ist gegenwärtiger und allgemein verständlicher als »Haupt«.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige, würdige deutsche Wiedergabe der prophetischen Botenformel; das Präsens bringt die aktuell übermittelte Gottesrede zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen etablierte Form.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung wird unmittelbar und idiomatisch wiedergegeben.
- source_word: מְשַׁחְתִּיךָ
  choice: Ich habe dich … gesalbt
  rationale: Das hebräische Perfekt bezeichnet passend die soeben durch das Ausgießen des Öls vollzogene Salbung, kann in dieser Formel jedoch zugleich performative Kraft haben.
- source_word: לְמֶלֶךְ
  choice: zum König
  rationale: Die לְ-Verbindung bezeichnet das Amt beziehungsweise Ergebnis der Salbung; »zum König salben« ist die natürliche deutsche Fügung.
- source_word: אֶל עַם יְהוָה אֶל יִשְׂרָאֵל
  choice: über das Volk Jahwes, über Israel
  rationale: אֶל bezeichnet in diesem königlichen Einsetzungskontext den Herrschaftsbereich. Die Wiederholung von »über« erhält die Parallelität; »Israel« erläutert appositionell »das Volk Jahwes«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm als Gottesnamen. Die Umschrift »Jahwe« bewahrt dessen Eigennamencharakter, ohne eine konfessionell geprägte Ersatzbezeichnung einzuführen.
- issue: Zeitform und performative Kraft von מְשַׁחְתִּיךָ
  choice: Ich habe dich … gesalbt
  alternative: Hiermit salbe ich dich …
  rationale: Das Perfekt lässt sich auf die unmittelbar zuvor vollzogene Handlung beziehen. Zugleich kann die Äußerung als wirksame Einsetzungsformel verstanden werden; diese echte Bedeutungsnuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. »Kopf« vermeidet unnötig archaisches »Haupt«; die traditionelle Botenformel »So spricht« bleibt wegen ihrer Prägnanz und ihres biblisch-prophetischen Charakters erhalten. Der Fußnotenmarker steht bei der tatsächlich erläuterten Salbungsaussage.
