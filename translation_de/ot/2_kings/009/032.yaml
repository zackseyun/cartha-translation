base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: de
  text: 'Er blickte zum Fenster hinauf und sagte: »Wer ist mit mir? Wer?« Da blickten zwei oder drei Eunuchen[a] zu ihm hinunter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hofbeamte«. Das hebräische Wort kann Eunuchen oder Hofbeamte bezeichnen; in einem königlichen Palast sind hier wahrscheinlich Eunuchen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: Er hob sein Gesicht
  rationale: Bewahrt das hebräische Bild des erhobenen Gesichts; im Zusammenhang ist damit der nach oben gerichtete Blick gemeint.
- source_word: הַחַלּוֹן
  choice: zum Fenster
  rationale: חַלּוֹן bezeichnet hier die Fensteröffnung des Palastes.
- source_word: מִי אִתִּי מִי
  choice: Wer hält zu mir? Wer?
  rationale: Das wörtliche »Wer ist mit mir?« meint in diesem Aufruf Zugehörigkeit beziehungsweise Parteinahme. Die Wiederholung von מִי bleibt zur Verstärkung erhalten.
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: blickten ... zu ihm hinunter
  rationale: שׁקף bezeichnet hier den Blick von einem erhöhten Fenster nach unten; אֵלָיו gibt die Blickrichtung auf Jehu an.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: zwei oder drei
  rationale: Die asyndetische Zahlenfolge bezeichnet idiomatisch eine kleine, ungefähr angegebene Zahl.
- source_word: סָרִיסִים
  choice: Eunuchen
  rationale: סָרִיס kann sowohl einen Eunuchen als auch einen Hofbeamten bezeichnen. Im königlichen Palast ist »Eunuchen« wahrscheinlich, ohne dass die breitere Bedeutung ausgeschlossen wäre.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Wer hält zu mir?« gibt den parteilichen Sinn im Deutschen natürlicher wieder als das formal nähere »Wer ist mit mir?«. Das hebräische Bild »sein Gesicht heben« und die eindringliche Wiederholung »Wer?« bleiben erhalten.
