id: 2KI.9.10
reference: 2 Kings 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת אִיזֶ֜בֶל יֹאכְל֧וּ הַ/כְּלָבִ֛ים בְּ/חֵ֥לֶק יִזְרְעֶ֖אל וְ/אֵ֣ין קֹבֵ֑ר וַ/יִּפְתַּ֥ח הַ/דֶּ֖לֶת וַ/יָּנֹֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: de
  text: Die Hunde werden Isebel im Gebiet von Jesreel[a] fressen, und niemand wird sie begraben.« Dann öffnete er die Tür und floh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Landstück von Jesreel“. Das hebräische Wort חֵלֶק bezeichnet einen Anteil oder ein abgegrenztes Stück Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: werden … fressen
  rationale: Das Verb אכל bezeichnet hier im prophetischen Gerichtswort schlicht das Fressen; die Zukunftsform gibt den angekündigten Ausgang natürlich wieder.
- source_word: הַכְּלָבִים
  choice: die Hunde
  rationale: Der bestimmte Artikel wird beibehalten; die Formulierung ist im Deutschen natürlich und bewahrt die Anschaulichkeit.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: im Gebiet von Jesreel
  rationale: חֵלֶק kann einen Anteil, ein Stück oder einen abgegrenzten Landbereich bezeichnen. „Gebiet“ ist verständlich, ohne die Größe als einzelnes Grundstück festzulegen.
- source_word: וְאֵין קֹבֵר
  choice: und niemand wird sie begraben
  rationale: Wörtlich steht „und es gibt keinen Begrabenden“. Das Objekt „sie“ ergibt sich eindeutig aus dem Zusammenhang; die Zukunft entspricht der prophetischen Ankündigung.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: Dann öffnete er die Tür
  rationale: Die Wayyiqtol-Form führt die Erzählung zeitlich weiter; „Dann“ gibt die Abfolge im modernen Deutsch flüssig wieder.
- source_word: וַיָּנֹס
  choice: und floh
  rationale: נוס bedeutet „fliehen“. Die knappe Form bewahrt Tempo und Dringlichkeit des hebräischen Erzählstils.
- source_word: אִיזֶבֶל
  choice: Isebel
  rationale: Der Personenname wird in der im modernen deutschen Bibelgebrauch geläufigen Form wiedergegeben.
theological_decisions: []
