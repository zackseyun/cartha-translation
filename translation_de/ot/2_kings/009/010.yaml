  source_fidelity: 'Der Entwurf gibt die hebräische Aussage vollständig und in ihrer Abfolge wieder: die Hunde als Subjekt, das künftige Fressen Isebels, den Ortsbezug, das Ausbleiben eines Begräbnisses sowie den anschließenden knappen Erzählfortgang. „Sie“ bei „niemand wird sie begraben“ ist als kontextgemäß ergänztes Objekt eindeutig. „Im Gebiet von Jesreel“ ist für בְּחֵלֶק יִזְרְעֶאל vertretbar; die Fußnote wahrt die engere Möglichkeit eines Landstücks/Grundstücks.'
