base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: de
  text: 'Da beeilten sie sich. Jeder nahm sein Gewand und legte es unter ihn auf die bloßen Stufen[a]. Dann stießen sie ins Horn[b] und riefen: »Jehu ist König!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »oben auf den Stufen« oder »auf dem Treppenabsatz«. Der hebräische Ausdruck ist selten; seine genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch Schofar, ein Horn, das als Signalinstrument verwendet wurde; traditionell auch mit »Posaune« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: Da beeilten sie sich
  rationale: Das Verb מהר bezeichnet eiliges, unverzügliches Handeln; „Da“ gibt hier die unmittelbare Reaktion im Erzählablauf natürlich wieder.
- source_word: אִישׁ בִּגְדוֹ
  choice: Jeder nahm sein Gewand
  rationale: אִישׁ wird distributiv verstanden, und בֶּגֶד ist der allgemeine Ausdruck für ein Kleidungsstück beziehungsweise Gewand.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: legte es unter ihn
  rationale: Das jeweilige Gewand ist das sinngemäße Objekt; das Suffix in תַחְתָּיו bezieht sich im Zusammenhang am ehesten auf Jehu. Die Formulierung deutet die genaue Art des Ausbreitens nicht weiter aus.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: auf die bloßen Stufen
  rationale: Die seltene Wendung bezeichnet vermutlich die bloße Oberfläche, den oberen Bereich oder einen Absatz der Treppe. „Auf die bloßen Stufen“ bewahrt eine wahrscheinliche Bedeutung, während die Fußnote die Unsicherheit offenlegt.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: stießen sie ins Horn
  rationale: שׁוֹפָר ist ein als Signal- und Kultinstrument verwendetes Tierhorn. „Ins Horn stoßen“ ist verständlich und gibt die feste Verbindung mit תקע idiomatisch wieder.
- source_word: וַיֹּאמְרוּ
  choice: riefen
  rationale: Im Zusammenhang einer öffentlichen Königsproklamation gibt „riefen“ die kommunikative Funktion des allgemeinen Verbs אמר natürlich wieder.
- source_word: מָלַךְ יֵהוּא
  choice: Jehu ist König
  rationale: Das Perfekt verkündet den vollzogenen Herrschaftsantritt. Die knappe deutsche Akklamationsform „Jehu ist König!“ gibt diesen erreichten Status unmittelbar wieder.
