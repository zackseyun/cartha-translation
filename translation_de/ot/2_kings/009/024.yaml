base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: de
  text: Jehu aber zog seinen Bogen voll aus und traf Joram zwischen den Armen[a]. Der Pfeil drang durch sein Herz und trat wieder heraus, und er brach in seinem Streitwagen zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zwischen den Schultern« beziehungsweise »zwischen den Schulterblättern«. Wörtlich steht im Hebräischen: »zwischen seinen Armen«; die Wendung kann den oberen Rücken oder den Schulterbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: spannte den Bogen mit voller Kraft
  rationale: Die Wendung lautet wörtlich etwa »füllte seine Hand mit dem Bogen« und bezeichnet hier das volle Spannen des Bogens. Die gewählte Formulierung gibt den Sinn natürlich und anschaulich wieder.
- source_word: וַיַּךְ
  choice: traf
  rationale: נכה bedeutet allgemein »schlagen/treffen«. Im Zusammenhang mit dem abgeschossenen Pfeil ist »traf« im Deutschen präzise, ohne ein zusätzliches Verb wie »schoss« in den Text einzutragen.
- source_word: בֵּין זְרֹעָיו
  choice: zwischen den Armen
  rationale: זְרוֹעַ bezeichnet gewöhnlich den Arm. Die wörtliche Wiedergabe bewahrt die anatomische Unbestimmtheit; die mögliche idiomatische Bedeutung wird in einer Fußnote genannt.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: Der Pfeil drang durch sein Herz und trat wieder heraus
  rationale: Der hebräische Text sagt, dass der Pfeil »aus seinem Herzen herauskam«. Die Formulierung macht den Durchschuss im Deutschen verständlich, ohne das Herz lediglich metaphorisch zu deuten.
- source_word: וַיִּכְרַע
  choice: er brach … zusammen
  rationale: כרע bezeichnet ein Sichbeugen oder Niedersinken. Nach der tödlichen Verwundung gibt »zusammenbrechen« den erzählerischen Sinn natürlich wieder.
- source_word: בְּרִכְבּוֹ
  choice: in seinem Wagen
  rationale: Das Suffix bezeichnet Jorams eigenen Wagen; im unmittelbaren Kontext ist damit sein Streitwagen gemeint.
