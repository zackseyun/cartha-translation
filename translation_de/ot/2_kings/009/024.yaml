translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Der Name יְהוֹרָם wird entsprechend der im Deutschen geläufigen Form »Joram« wiedergegeben. Die ungewöhnliche Körperangabe bleibt im Haupttext bewusst nah am Hebräischen und wird nicht stillschweigend anatomisch präzisiert.
