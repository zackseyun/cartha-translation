base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: de
  text: »Ganz gewiss[a] habe ich gestern das Blut Nabots und das Blut seiner Söhne gesehen«, spricht Jahwe. »Und ich werde es dir auf diesem Grundstück vergelten«, spricht Jahwe. »Nun nimm ihn auf und wirf ihn auf das Grundstück, gemäß dem Wort Jahwes.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wenn nicht.« Die hebräische Wendung ist hier eine nachdrückliche, schwurartige Versicherung; auch möglich: »Gewiss« oder »In der Tat«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: So wahr ich lebe
  rationale: Die Verbindung leitet hier keine gewöhnliche Bedingung ein, sondern eine nachdrückliche, schwurartige Versicherung. Die deutsche Wendung gibt diese pragmatische Kraft natürlich wieder; die idiomatische Ergänzung „ich lebe“ wird in einer Fußnote offengelegt.
- source_word: דְּמֵי
  choice: das Blut
  rationale: Der hebräische Konstruktplural bezeichnet vergossenes Blut beziehungsweise gewaltsame Tötung. Im Deutschen ist der Singular „Blut“ die natürliche Entsprechung.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Der Personenname wird gemäß der geläufigen deutschen Bibeltradition als „Nabot“ wiedergegeben.
- source_word: בָנָיו
  choice: seiner Söhne
  rationale: Das Hebräische bezeichnet ausdrücklich die Söhne; diese Spezifität bleibt erhalten.
- source_word: רָאִיתִי אֶמֶשׁ
  choice: Gestern habe ich ... gesehen
  rationale: Das Perfekt wird zusammen mit dem Zeitadverb idiomatisch als deutsches Perfekt wiedergegeben. אֶמֶשׁ lässt grundsätzlich auch einen Bezug auf die vergangene Nacht zu, doch „gestern“ ist hier die am wenigsten festlegende Wiedergabe.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die gewichtige prophetische Botenformel wird in geläufigem, würdigem Deutsch wiedergegeben; der Gottesname bleibt als „Jahwe“ erkennbar.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: werde ich es dir vergelten
  rationale: Das Piel von שלם bezeichnet hier richterliche Vergeltung. Das Pronomen „es“ greift das vergossene Blut beziehungsweise die Tat idiomatisch auf, ohne die Art der Vergeltung näher zu bestimmen.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: auf diesem Grundstück
  rationale: חֶלְקָה bezeichnet ein abgegrenztes Stück Land. „Grundstück“ ist im Kontext von Nabots Besitz präzise und natürlich.
- source_word: שָׂא הַשְׁלִכֵהוּ
  choice: heb ihn auf und wirf ihn
  rationale: Die beiden Imperative werden direkt und konkret wiedergegeben. Das männliche Objektpronomen bezieht sich im Kontext auf den Getöteten.
- source_word: כִּדְבַר יְהוָה
  choice: wie Jahwe es gesagt hat
  rationale: Die Wendung bedeutet wörtlich „gemäß dem Wort Jahwes“. Die gewählte Form ist modernes, natürliches Deutsch und bewahrt den Bezug auf die zuvor ausgesprochene Ankündigung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Spezifität von בָנָיו im Zusammenhang des Gerichts
  choice: seiner Söhne
  alternative: seiner Kinder
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich Söhne. Eine Verallgemeinerung zu „Kinder“ würde diese Information beseitigen.
- issue: Bezug des Suffixes in וְשִׁלַּמְתִּי לְךָ
  choice: dir
  alternative: euch
  rationale: Das Suffix ist grammatisch maskulin Singular. Der deutsche Singular erhält die direkte richterliche Anrede, auch wenn der im Zitat ursprünglich Angeredete aus dem größeren Zusammenhang erschlossen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede und klarer richterlicher Schärfe. „Vergelten“ wahrt den ernsten, rechtlichen Ton; „Grundstück“ ist konkreter und gegenwärtiger als „Flurstück“. Die schwurartige Eröffnung wird verständlich formuliert und wegen ihrer formalen Mehrdeutigkeit erläutert.
