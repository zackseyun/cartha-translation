id: 2KI.20.4
reference: 2 Kings 20:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י יְשַׁעְיָ֔הוּ לֹ֣א יָצָ֔א ה/עיר הַ/תִּֽיכֹנָ֑ה וּ/דְבַר יְהוָ֔ה הָיָ֥ה אֵלָ֖י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: de
  text: 'Noch bevor Jesaja den mittleren Hof[a] verlassen hatte, erging das Wort Yahwehs an ihn:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die mittlere Stadt«. Gemeint ist hier wahrscheinlich ein Bereich des Palastes, traditionell der »mittlere Hof«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Noch bevor …
  rationale: Die narrative Einleitung wird zusammen mit לֹא יָצָא idiomatisch als zeitlicher Nebensatz wiedergegeben; so bleibt die Ereignisfolge klar, ohne eine schwerfällige Formel wie »Und es geschah«.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Eingebürgerte deutsche Namensform.
- source_word: לֹא יָצָא
  choice: verlassen hatte
  rationale: Im durch »Noch bevor« eingeleiteten Nebensatz bringt das Plusquamperfekt zum Ausdruck, dass Jesaja den Ort noch nicht verlassen hatte, als das Wort an ihn erging.
- source_word: הָעִיר הַתִּיכֹנָה
  choice: den mittleren Hof
  rationale: Wörtlich steht »die mittlere Stadt«. Im Palastzusammenhang wird die Wendung traditionell als Bezeichnung eines Hof- oder Palastbereichs verstanden; »mittlerer Hof« ist kontextuell natürlich, während die echte lexikalische Schwierigkeit in einer Fußnote erhalten bleibt.
- source_word: וּדְבַר יְהוָה
  choice: das Wort Yahwehs
  rationale: Bewahrt die feste prophetische Formel und gibt das Tetragramm als Eigennamen wieder.
- source_word: הָיָה אֵלָיו
  choice: erging … an ihn
  rationale: Natürliche, würdevolle deutsche Wiedergabe der Formel היה אל für den Empfang göttlicher Rede.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet die im folgenden Vers einsetzende direkte Rede im modernen Deutschen natürlicher ein als das partizipiale »indem er sprach«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. »Yahweh« gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Satzfügung wurde für natürlichen deutschen Lesefluss moderat umgestellt; die unsichere Ortsbezeichnung bleibt durch die Fußnote transparent.
