base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: de
  text: Und Hiskia legte sich zu seinen Vätern[a], und sein Sohn Manasse wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schlief mit seinen Vätern«. Das Hebräische verwendet eine feste königliche Formel für den Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Das Verb שׁכב bedeutet wörtlich »sich hinlegen« und bildet zusammen mit »zu seinen Vätern« eine feste königliche Todesformel. »Legte sich« bewahrt das hebräische Bild, ohne es auf das bloße »starb« zu reduzieren.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die Wendung ist eine herkömmliche hebräische Formel für Tod und Bestattung. »Väter« gibt אבות formal genau wieder; das im Deutschen idiomatischere »zu« vermittelt die Zugehörigkeit im Zusammenhang der Todesformel.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In Thronfolgeformeln bezeichnet מלך hier den Regierungsantritt. »Wurde König« bringt diesen Übergang genauer zum Ausdruck als »regierte«.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Die ausdrückliche Sohnesbezeichnung wird entsprechend dem hebräischen Text beibehalten.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת bezeichnet in diesem Zusammenhang die Nachfolge im Königsamt. »An seiner Stelle« ist natürliches modernes Deutsch und gibt den Stellungswechsel klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Wendung »legte sich zu seinen Vätern« bewahrt bewusst das Bild und den formelhaften Charakter des hebräischen Königberichts; die Fußnote erläutert die idiomatische Bedeutung.
