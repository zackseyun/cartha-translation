  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַֽׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר הֲ/ל֛וֹא אִם שָׁל֥וֹם וֶ/אֱמֶ֖ת יִהְיֶ֥ה בְ/יָמָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: de
  text: 'Da sagte Hiskia zu Jesaja: »Das Wort Jahwes, das du verkündet hast, ist gut.« Und er sagte: »Wird es nicht zu meinen Lebzeiten Frieden und Beständigkeit[a] geben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Frieden und Treue« beziehungsweise »Frieden und Wahrheit«. Das hebräische Wort kann Wahrheit, Treue oder verlässliche Beständigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: gut
  rationale: Die direkte Wiedergabe bewahrt die knappe Bewertung und lässt offen, ob Hiskia Gottes Urteil anerkennt oder vor allem auf den Aufschub der angekündigten Folgen reagiert.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ entspricht dem prophetischen Sprachgebrauch von דָּבָר; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: דִּבַּרְתָּ
  choice: das du verkündet hast
  rationale: Im Zusammenhang richtet sich das Verb auf Jesajas prophetische Mitteilung. „Verkündet“ klingt im Deutschen natürlicher als „gesprochen“, ohne Jesajas Rolle als Übermittler zu verdecken.
- source_word: הֲלוֹא אִם
  choice: Wird nicht …?
  rationale: Die hebräische Wendung ist elliptisch. Die rhetorische Frage wird in idiomatischem Deutsch wiedergegeben, ohne sie ausdrücklich als inneren Gedanken umzudeuten.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ bewahrt die breite Bedeutung von Wohlergehen, Ruhe und ungestörten Verhältnissen.
- source_word: אֱמֶת
  choice: Beständigkeit
  rationale: Hier bezeichnet אֱמֶת wahrscheinlich verlässliche, stabile Verhältnisse. Die ebenfalls mögliche Grundbedeutung „Treue/Wahrheit“ bleibt in der Fußnote sichtbar.
- source_word: בְיָמָי
  choice: zu meinen Lebzeiten
  rationale: Die idiomatische deutsche Form gibt den zeitlichen Sinn klar wieder und hebt Hiskias Bezug auf seine eigene Lebenszeit hervor.
theological_decisions:
- issue: Ist Hiskias zweiter Satz ausgesprochene Rede oder eine erzählerische Angabe seines inneren Gedankens?
  choice: 'Als direkte Rede wiedergeben: „Und er sagte …“'
  alternative: 'Als Begründung seines inneren Gedankens wiedergeben: „Denn er dachte …“'
  rationale: וַיֹּאמֶר bedeutet ausdrücklich „und er sagte“. Die direkte Rede folgt daher dem hebräischen Wortlaut und bewahrt zugleich die moralische Spannung seiner auf die eigene Lebenszeit bezogenen Reaktion.
- issue: Wie ist die elliptische Verbindung הֲלוֹא אִם zu ergänzen?
  choice: 'Als rhetorische Frage formulieren: „Wird nicht … herrschen?“'
  alternative: 'Näher an der unvollständigen Form: „Ist es nicht so, wenn …?“'
  rationale: Das Deutsche benötigt eine syntaktische Abrundung. Die gewählte Frage erhält den rhetorischen Charakter, ohne Hiskias Beweggrund ausdrücklich zu billigen oder zu verurteilen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die rhetorische Frage bleiben erhalten; die hebräische Ellipse wird nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
