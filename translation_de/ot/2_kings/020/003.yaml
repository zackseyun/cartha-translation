reference: 2 Kings 20:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: de
  text: „Ach, Jahwe, denk doch daran, dass ich in Treue und mit ungeteiltem Herzen[a] vor dir gelebt und getan habe, was gut ist in deinen Augen.“ Und Hiskia weinte heftig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit ganzem Herzen“; gemeint ist ein aufrichtiges, ungeteiltes Herz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: Ach ... doch
  rationale: Die beiden Bittepartikeln rahmen den eindringlichen, emotionalen Appell. „Ach ... doch“ gibt ihn in natürlichem, würdigem Deutsch wieder, ohne ein doppeltes „bitte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: זְכָר
  choice: denk daran
  rationale: Der Imperativ bedeutet „erinnere dich/denk daran“. Im Gebet klingt „denk doch daran“ natürlich und bewahrt den Aufforderungscharakter.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: ich ... vor dir gelebt habe
  rationale: Die hebräische Wendung bezeichnet den Lebenswandel in Gottes Gegenwart. „Vor dir gelebt“ vermittelt das Idiom im modernen Deutschen klarer als das missverständliche „vor dir gewandelt“.
- source_word: בֶּאֱמֶת
  choice: in Treue
  rationale: אֱמֶת kann Wahrheit, Aufrichtigkeit oder Treue bezeichnen. Im Zusammenhang mit Hiskias Lebensführung bezeichnet „Treue“ seine verlässliche, aufrichtige Haltung vor Gott.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: mit ungeteiltem Herzen
  rationale: שָׁלֵם bezeichnet Ganzheit beziehungsweise ungeteilte Loyalität, nicht sündlose Vollkommenheit. „Mit ungeteiltem Herzen“ macht diese Bedeutung im Deutschen deutlich.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: und getan habe, was gut ist in deinen Augen
  rationale: Die Formulierung bewahrt die hebräische Bildsprache und stellt Gottes Urteil als Maßstab heraus.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: Und Hiskia weinte heftig
  rationale: Die Verbindung von Verb und zugehörigem Substantiv mit גָדוֹל verstärkt das Weinen. „Heftig“ gibt die Intensität wieder, ohne die nicht ausdrücklich genannte Nuance von Bitterkeit einzutragen.
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי.
- issue: Bedeutung von שָׁלֵם in Hiskias Selbstaussage
  choice: mit ungeteiltem Herzen
  alternative: mit vollkommenem Herzen
  rationale: Die Formulierung bezeichnet hier die Ganzheit und Lauterkeit seiner Hingabe. Sie sollte weder als Behauptung absoluter Sündlosigkeit abgeschwächt noch in diese Richtung übersteigert werden.
- issue: Intensität von בְּכִי גָדוֹל
  choice: weinte heftig
  alternative: weinte bitterlich
  rationale: Der hebräische Ausdruck betont ausdrücklich die Größe beziehungsweise Stärke des Weinens; „bitterlich“ ist idiomatisch möglich, fügt jedoch eine spezifischere Gefühlsnuance hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die altertümliche Wendung „vor dir gewandelt“ wird vermieden, die transparente biblische Formulierung „gut in deinen Augen“ jedoch bewahrt. Der emotionale Ton des Gebets kommt durch „Ach ... doch“ zum Ausdruck.
