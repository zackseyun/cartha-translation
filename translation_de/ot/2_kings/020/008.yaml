  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַׁעְיָ֔הוּ מָ֣ה א֔וֹת כִּֽי יִרְפָּ֥א יְהוָ֖ה לִ֑/י וְ/עָלִ֛יתִי בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: de
  text: 'Und Hiskia sagte zu Jesaja: „Was ist das Zeichen dafür, dass Jahwe mich heilen wird und ich am dritten Tag zum Haus Jahwes[a] hinaufgehen werde?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Tempel Jahwes“. Wörtlich: „zum Haus Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Gibt den fortlaufenden hebräischen Erzählstil wieder, ohne eine stärkere zeitliche Folgerung als im Ausgangstext auszudrücken.
- source_word: חִזְקִיָּהוּ … יְשַׁעְיָהוּ
  choice: Hiskia … Jesaja
  rationale: Verwendet die im Deutschen üblichen biblischen Namensformen.
- source_word: מָה אוֹת
  choice: Was ist das Zeichen
  rationale: אוֹת bezeichnet hier ein bestätigendes Zeichen für die göttliche Zusage; „Zeichen“ bewahrt diesen Sinn, ohne ihn auf einen bloßen Beweis zu verengen.
- source_word: כִּי
  choice: dafür, dass
  rationale: Leitet hier den Inhalt dessen ein, was das erbetene Zeichen bestätigen soll.
- source_word: יִרְפָּא יְהוָה לִי
  choice: dass Jahwe mich heilen wird
  rationale: Der Imperfekt bezeichnet im Zusammenhang die erwartete zukünftige Heilung; das hebräische לִי wird gemäß deutschem Sprachgebrauch als direktes Objekt wiedergegeben.
- source_word: וְעָלִיתִי
  choice: und ich … hinaufgehen werde
  rationale: עלה bedeutet „hinaufgehen“ und bezeichnet passend den Gang zum höher gelegenen Heiligtum. Die Koordination bleibt unter dem einleitenden „dass“.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Natürliche und genaue deutsche Wiedergabe der Zeitangabe.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Bewahrt das konkrete hebräische Bild; „Tempel Jahwes“ ist als idiomatische Alternative in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des erbetenen Zeichens
  choice: Das Zeichen bestätigt sowohl die Heilung als auch den Gang zum Haus Jahwes am dritten Tag.
  alternative: Das Zeichen bezieht sich nur auf die Heilung, während der Gang zum Heiligtum als bloße Folge ausgesagt wird.
  rationale: כִּי leitet den Inhalt ein, und וְ verbindet die beiden folgenden Verbalaussagen eng. Die Übersetzung hält beide unter dem gemeinsamen inhaltlichen Bezug, ohne ihre sachliche Beziehung weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Fragesatz, ist aber flüssig und allgemein verständlich. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Anmerkung bezieht.
