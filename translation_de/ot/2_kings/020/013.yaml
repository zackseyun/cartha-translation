source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: de
  text: 'Hiskia hörte sie an[a] und zeigte ihnen seine ganze Schatzkammer[b]: das Silber, das Gold, die Gewürze, das kostbare Öl, sein Waffenlager[c] und alles, was sich in seinen Vorratshäusern fand. Es gab nichts in seinem Haus und in seinem ganzen Herrschaftsgebiet[d], was Hiskia ihnen nicht zeigte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahm sie wohlwollend auf“. Die hebräische Wendung kann bedeuten, jemandem Gehör zu schenken bzw. ihm eine Audienz zu gewähren.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Haus seiner Kostbarkeiten“; oder: „sein ganzes Schatzhaus“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sein Arsenal“; wörtlicher: „das Haus seiner Geräte“ beziehungsweise „seiner Ausrüstung“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „in seinem ganzen Herrschaftsbereich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: hörte auf sie
  rationale: Die Wendung bezeichnet hier wahrscheinlich ein aufmerksames oder wohlwollendes Anhören der Gesandten, nicht bloß akustisches Hören. „Hörte auf sie“ bewahrt die idiomatische Offenheit.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: zeigte ihnen
  rationale: Der Hifil von ראה bedeutet gewöhnlich „zeigen“; dieselbe Wiedergabe verbindet beide Vorkommen im Vers.
- source_word: בֵּית נְכֹתֹה
  choice: sein ganzes Schatzhaus
  rationale: Die Wendung bezeichnet den Aufbewahrungsort seiner Kostbarkeiten. „Schatzhaus“ passt zur anschließenden Aufzählung; כָּל wird durch „ganzes“ wiedergegeben.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: Im Zusammenhang mit königlichen Vorräten ist das Edelmetall gemeint, nicht Geld im engeren modernen Sinn.
- source_word: הַזָּהָב
  choice: das Gold
  rationale: Direkte Bezeichnung des gelagerten Edelmetalls.
- source_word: הַבְּשָׂמִים
  choice: die Gewürze
  rationale: Der Plural bezeichnet wertvolle aromatische Stoffe; „Gewürze“ ist eine natürliche, hinreichend breite deutsche Wiedergabe.
- source_word: שֶׁמֶן הַטּוֹב
  choice: das kostbare Öl
  rationale: Wörtlich „das gute Öl“; im Inventar wertvoller Güter bringt „kostbar“ Qualität und Wert zum Ausdruck, ohne einen bestimmten Verwendungszweck festzulegen.
- source_word: בֵּית כֵּלָיו
  choice: sein Waffenlager
  rationale: Wörtlich etwa „Haus seiner Geräte/Ausrüstung“. Im königlichen Zusammenhang kann כֵּלִים Waffen und militärische Ausrüstung bezeichnen; „Waffenlager“ ist verständlich, während die wörtlichere Alternative in der Fußnote erhalten bleibt.
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: alles, was sich in seinen Vorratshäusern fand
  rationale: אֹצָר kann Schatzkammer oder Vorratshaus bedeuten. „Vorratshäuser“ vermeidet eine unklare Gleichsetzung mit בֵּית נְכֹתֹה und bewahrt die Mehrzahl.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Es gab nichts ..., was Hiskija ihnen nicht zeigte
  rationale: Die deutsche Doppelverneinung bildet die emphatische hebräische Gesamtaussage natürlich und eng nach.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: Bewahrt den Wortlaut; obwohl im königlichen Kontext auch der Palast gemeint sein kann, legt der hebräische Ausdruck dies nicht ausdrücklich fest.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: in seinem ganzen Herrschaftsgebiet
  rationale: מֶמְשָׁלָה bezeichnet den Bereich seiner Herrschaft. „Herrschaftsgebiet“ gibt diese räumlich-politische Weite wieder, ohne sie enger als „Königreich“ zu bestimmen.
