  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: de
  text: 'Und Hiskia sagte: »Es ist leicht, dass der Schatten sich zehn Stufen[a] weiterbewegt. Nein, der Schatten soll vielmehr zehn Stufen zurückgehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zehn Grade«. Das hebräische Wort bedeutet »Stufen« oder »Aufstiege« und kann sich auf die Stufen oder Einteilungen von Ahas’ Schattenvorrichtung beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: es ist leicht
  rationale: Die Wendung gibt die Bedeutung »leicht, mühelos« knapp und natürlich wieder.
- source_word: הַצֵּל / לַצֵּל
  choice: der Schatten
  rationale: Dies ist die direkte und im Zusammenhang eindeutige Wiedergabe von צֵל.
- source_word: לִנְטוֹת
  choice: weiterzuwandern
  rationale: נטה bezeichnet hier die voranschreitende Ausdehnung beziehungsweise Bewegung des Schattens. »Weiterzuwandern« klingt im Deutschen natürlich und macht den Gegensatz zum Zurückgehen deutlich, ohne eine bestimmte Konstruktion des Schattenmessers vorauszusetzen.
- source_word: מַעֲלוֹת
  choice: Stufen
  rationale: מַעֲלוֹת bedeutet wörtlich »Stufen« oder »Aufstiege«. »Stufen« bewahrt das konkrete Bild; die mögliche Bedeutung als Grade beziehungsweise Teilungen wird in der Fußnote genannt.
- source_word: לֹא כִּי
  choice: Nein, ... vielmehr
  rationale: Die Formulierung weist die erste Möglichkeit zurück und stellt ihr die gewünschte Alternative gegenüber.
- source_word: יָשׁוּב ... אֲחֹרַנִּית
  choice: soll ... zurückgehen
  rationale: שׁוב mit אֲחֹרַנִּית bezeichnet eine Bewegung zurück. Die deutsche Soll-Konstruktion gibt den auffordernden Sinn im Kontext angemessen wieder.
