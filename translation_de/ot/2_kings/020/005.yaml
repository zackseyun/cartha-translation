  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: de
  text: 'Geh zurück und sage zu Hiskia, dem Oberhaupt meines Volkes: »So spricht Jahwe, der Gott deines Vaters David: Ich habe dein Gebet gehört und deine Tränen gesehen. Sieh, ich heile dich.[a] Am dritten Tag wirst du zum Haus Jahwes hinaufgehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde dich heilen.« Das Hebräische verwendet hier ein Partizip: »Sieh, ich heile dich«; es kann eine unmittelbar bevorstehende Handlung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב
  choice: Kehre um
  rationale: Der Imperativ fordert Jesaja auf, seinen Weg umzukehren und zu Hiskia zurückzugehen; „Kehre um“ bewahrt die knappe Richtungsangabe.
- source_word: נְגִיד עַמִּי
  choice: dem Fürsten meines Volkes
  rationale: נָגִיד bezeichnet einen eingesetzten Führer oder Herrscher. „Fürst“ ist im königlichen Kontext würdig und unterscheidet den Titel vom allgemeineren „Anführer“.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die traditionelle prophetische Botenformel und gibt den Gottesnamen ausdrücklich wieder.
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: der Gott deines Vaters David
  rationale: Natürliches Deutsch, das אָבִיךָ im genealogischen Sinn wiedergibt.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ
  choice: Ich habe dein Gebet gehört
  rationale: Das Perfekt bezeichnet die erfolgte Wahrnehmung, deren gegenwärtige Folge nun angekündigt wird.
- source_word: רָאִיתִי אֶת דִּמְעָתֶךָ
  choice: und deine Tränen gesehen
  rationale: Bewahrt den Parallelismus zur erhörten Bitte und gibt den hebräischen Singular idiomatisch als deutschen Plural wieder.
- source_word: הִנְנִי רֹפֶא לָךְ
  choice: Sieh, ich heile dich
  rationale: „Sieh“ erhält den hervorhebenden Charakter von הִנְנִי; das Präsens spiegelt das Partizip und lässt die im Kontext naheliegende unmittelbar bevorstehende Heilung offen.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe ohne erläuternden Zusatz.
- source_word: תַּעֲלֶה בֵּית יְהוָה
  choice: wirst du zum Haus Jahwes hinaufgehen
  rationale: „Hinaufgehen“ bewahrt die räumliche und kultische Ausdrucksweise; „Haus Jahwes“ entspricht der hebräischen Benennung statt der interpretierenden Wiedergabe „Tempel“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Ausgangstext ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Zeitbezug von רֹפֶא im Heilsversprechen
  choice: ich heile dich
  alternative: ich werde dich heilen
  rationale: Das hebräische Partizip kann gegenwärtige oder unmittelbar bevorstehende Handlung ausdrücken. Die Hauptübersetzung wahrt seine Form und Unmittelbarkeit; die futurische Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Formel. Archaisierende Formen wie „siehe“ und „du sollst hinaufgehen“ werden vermieden; „Fürst“ bleibt als kontextuell passender Herrschertitel erhalten. Der Fußnotenmarker [a] steht unmittelbar nach der betreffenden Aussage.
