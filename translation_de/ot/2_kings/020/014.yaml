base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: de
  text: 'Da kam der Prophet Jesaja zu König Hiskia und sagte zu ihm: »Was haben diese Männer gesagt, und woher sind sie zu dir gekommen?[a]« Hiskia antwortete: »Sie sind aus einem fernen Land gekommen[b], aus Babel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher könnte man übersetzen: »Und woher kommen sie zu dir?« Die hebräische Verbform kann formal als Gegenwart wiedergegeben werden; im Erzählzusammenhang ist jedoch die vergangene Ankunft gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Die allgemeine Angabe »aus einem fernen Land« wird anschließend durch »aus Babel« genauer bestimmt. So bleibt Hiskias Betonung der großen Entfernung erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: der Prophet Jesaja
  rationale: Natürliche deutsche Wortstellung für den bestimmten Titel mit dem Eigennamen.
- source_word: אֶל הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: zu König Hiskia
  rationale: Idiomatiche deutsche Wiedergabe der Verbindung von Titel und Eigenname.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: Was haben diese Männer gesagt
  rationale: Das Perfekt gibt die bereits erfolgte Äußerung wieder; אֲנָשִׁים wird geschlechtsgenau mit »Männer« übersetzt.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: und woher sind sie zu dir gekommen?
  rationale: Der narrative Zusammenhang legt eine vergangene Ankunft nahe; »zu dir« bewahrt das ausdrücklich genannte אֵלֶיךָ.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: aus einem fernen Land
  rationale: Natürliche und würdevolle Wiedergabe der geografischen Ferne.
- source_word: מִבָּבֶל
  choice: aus Babel
  rationale: »Babel« ist die in deutschen Bibeln etablierte Form des hebräischen Ortsnamens בָּבֶל.
