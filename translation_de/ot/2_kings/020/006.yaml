  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: de
  text: Und ich werde deinem Leben fünfzehn Jahre hinzufügen. Ich werde dich und diese Stadt aus der Hand des Königs von Assyrien[a] retten und diese Stadt beschützen[b] – um meinetwillen und um meines Dieners David willen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus der Hand des Königs von Assyrien“, das heißt: aus seiner Macht.'
    reason: Erläuterung des hebräischen Machtidioms; der Wortlaut „aus der Hand“ bleibt im Haupttext erhalten.
  - marker: b
    text: 'Oder: „verteidigen“.'
    reason: Lexikalische Alternative für גנן im Zusammenhang einer militärischen Bedrohung.
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: ich werde deinem Leben fünfzehn Jahre hinzufügen
  rationale: Das hebräische Bild lautet wörtlich „deinen Tagen hinzufügen“. „Deinem Leben … hinzufügen“ gibt den Sinn in natürlichem modernem Deutsch wieder, ohne die bestimmte Verlängerung abzuschwächen.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: aus der Hand des Königs von Assyrien
  rationale: „Hand“ bezeichnet hier Macht oder Gewalt. Die deutsche Wendung bewahrt das hebräische Bild und bleibt verständlich.
- source_word: אַצִּילְךָ
  choice: ich werde dich … retten
  rationale: Das Hifil von נצל bezeichnet das Herausreißen oder Retten aus einer Bedrohung; „retten“ ist im militärisch-politischen Zusammenhang klar und idiomatisch.
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: und diese Stadt
  rationale: Die Stadt ist zusammen mit dem König unmittelbares Objekt von „retten“, was die deutsche Koordination knapp abbildet.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: und diese Stadt beschützen
  rationale: גנן bedeutet schützen oder verteidigen. „Beschützen“ hebt die bewahrende Handlung hervor; „verteidigen“ ist im Belagerungskontext ebenfalls möglich.
- source_word: לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי
  choice: um meinetwillen und um meines Dieners David willen
  rationale: Die doppelte Zweck- beziehungsweise Begründungsformel wird parallel wiedergegeben und weder dogmatisch erweitert noch abgeschwächt.
theological_decisions:
- issue: Gottes Beweggrund für den Schutz Jerusalems
  choice: um meinetwillen und um meines Dieners David willen
  alternative: um meiner selbst und um meines Dieners David willen
  rationale: Der Text nennt ausdrücklich Gott selbst und seinen Diener David als Beweggründe. Die gewählte Form erhält diese theologische Spannung, ohne sie durch eine nähere Erklärung des Bundes oder der Verheißung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die altertümlich wirkende, aber weiterhin verständliche Wendung „um meinetwillen … willen“ bewahrt die Parallelität und Feierlichkeit des Hebräischen. Der erste Satz wird zur besseren Lesbarkeit vom folgenden Rettungsversprechen getrennt.
