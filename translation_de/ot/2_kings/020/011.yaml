  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: de
  text: Da rief der Prophet Jesaja zu Jahwe, und er ließ den Schatten auf den Stufen des Ahas um die zehn Stufen[a] zurückgehen, auf denen er zuvor hinabgegangen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zehn Grade“. Das hebräische Wort bezeichnet wörtlich „Stufen“ oder „Aufgänge“. Manche verstehen die Stufen des Ahas als Teil einer Vorrichtung zur Messung des Schattenstands, daher die traditionelle Wiedergabe „Sonnenuhr des Ahas“.'
    reason: Lexikalische und historische Alternative zu מַעֲלוֹת.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief ... zu
  rationale: קרא mit אֶל־יְהוָה bezeichnet hier den eindringlichen Ruf zu Gott. „Rief zu“ bewahrt die Bildhaftigkeit, ohne das Verb im Haupttext ausdrücklich als „betete“ auszulegen.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: der Prophet Jesaja
  rationale: Natürliche deutsche Wortstellung für Personenname und Titel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes.
- source_word: וַיָּשֶׁב אֶת־הַצֵּל
  choice: er ließ den Schatten ... zurückgehen
  rationale: Der Hifil von שוב ist kausativ. Die Formulierung gibt wieder, dass Jahwe die Rückbewegung des Schattens bewirkte.
- source_word: בַּמַּעֲלוֹת ... בְּמַעֲלוֹת אָחָז
  choice: auf den Stufen des Ahas
  rationale: מַעֲלוֹת bedeutet wörtlich „Stufen/Aufgänge“. Die Übersetzung vermeidet die nicht ausdrücklich im Text stehende Festlegung auf eine Sonnenuhr.
- source_word: אֲשֶׁר יָרְדָה
  choice: die er hinabgewandert war
  rationale: Das Relativpronomen bezieht sich sinngemäß auf die Strecke von zehn Stufen; das grammatische Subjekt ist der Schatten. Das Plusquamperfekt kennzeichnet seine vorangegangene Abwärtsbewegung.
- source_word: אֲחֹרַנִּית עֶשֶׂר מַעֲלוֹת
  choice: die zehn Stufen zurückgehen
  rationale: Die deutsche Wortstellung stellt Richtung und Ausmaß der umgekehrten Bewegung klar dar und bewahrt die Wiederholung von „Stufen“ sinngemäß.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der „Stufen des Ahas“
  choice: Stufen des Ahas
  alternative: Sonnenuhr des Ahas
  rationale: Der hebräische Ausdruck nennt Stufen oder Aufgänge, bestimmt die Vorrichtung aber nicht näher. Der Haupttext lässt die historische Gestalt daher offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde gegenüber dem Hebräischen behutsam geordnet, damit Bezug und Bewegungsrichtung verständlich bleiben. Der Fußnotenmarker steht bei „Stufen“, auf die sich die Anmerkung tatsächlich bezieht.
