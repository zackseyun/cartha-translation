  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Ruf Jesajas zu Jahwe, die kausative Rückbewegung des Schattens und das Maß von zehn Stufen zutreffend wieder. Die derzeitige Relativkonstruktion „die er hinabgewandert war“ verwischt jedoch den Bezug: Sie kann grammatisch nur auf „Stufen“ bezogen werden, während „er“ der Schatten sein soll; zudem ist „hinabwandern“ für einen Schatten unnatürlich. Die Revision stellt klar, dass der Schatten zuvor auf diesen Stufen abwärts gegangen war, ohne die nicht näher bestimmte Beschaffenheit der maʿalot festzulegen.'
  naturalness: „Da rief“ und „der Prophet Jesaja“ sind modernes, würdiges Standarddeutsch. „Auf denen er zuvor hinabgegangen war“ ist idiomatisch und behebt den unklaren bzw. unnatürlichen Ausdruck „die er hinabgewandert war“.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Stufen des Ahas“ bleibt quellentreu und vermeidet die im Hebräischen nicht explizit genannte „Sonnenuhr“. Die Fußnote kennzeichnet „Grade“ und die historische Deutung sachgerecht als Alternativen.
