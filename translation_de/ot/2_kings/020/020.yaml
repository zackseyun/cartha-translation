base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Was sonst noch von Hiskia zu berichten ist, seine ganze Macht und wie er das Wasserbecken[a] und den Kanal[b] anlegte und das Wasser in die Stadt leitete[c] – steht das nicht im Buch der Geschichte der Könige von Juda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wasserspeicher“; das hebräische Wort kann ein künstlich angelegtes Sammelbecken bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wasserleitung“; das hebräische Wort bezeichnet einen Wasserlauf oder einen technisch angelegten Wasserkanal.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind wahrscheinlich Hiskias bekannte Wasserbauten in Jerusalem; vergleiche 2. Chronik 32,30.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי חִזְקִיָּהוּ
  choice: Was sonst noch von Hiskia zu berichten ist
  rationale: Die Wendung ist eine historiografische Schlussformel. Die deutsche Fassung gibt den weiten Sinn von דְּבָרִים natürlich wieder, ohne einen im Hebräischen nicht vorhandenen zeitlichen Diskursmarker hinzuzufügen.
- source_word: גְּבוּרָתוֹ
  choice: seine Macht
  rationale: Das Substantiv kann Stärke, Macht oder mächtige Leistungen bezeichnen. „Macht“ bewahrt die abstrakte Ausdrucksweise und lässt die folgenden Bauleistungen als deren konkrete Entfaltung erscheinen.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: und wie er … anlegte
  rationale: Die Relativkonstruktion führt die konkreten Wasserbauten ein. „Wie er … anlegte“ ist im Deutschen natürlich und gibt עָשָׂה im baulichen Zusammenhang angemessen wieder.
- source_word: הַבְּרֵכָה
  choice: das Wasserbecken
  rationale: בְּרֵכָה bezeichnet hier ein künstlich angelegtes Becken oder Reservoir. „Wasserbecken“ ist verständlich und lässt die genaue Bauform offen.
- source_word: הַתְּעָלָה
  choice: den Kanal
  rationale: Das Wort bezeichnet einen Wasserlauf beziehungsweise einen technisch angelegten Wasserkanal. „Kanal“ ist im modernen Deutschen klar und sachgerecht.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: und das Wasser in die Stadt leitete
  rationale: Die Richtungsendung an עִירָה bezeichnet Bewegung in die Stadt hinein. Im Zusammenhang eines Wasserbauwerks gibt „leitete“ den kausativen praktischen Sinn idiomatisch wieder.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: steht das nicht
  rationale: Die rhetorische Frage der traditionellen Schlussformel bleibt erhalten. Der deutsche Singular „das“ fasst die zuvor genannten Berichte als Gesamtinhalt zusammen.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Buch der Chronik der Könige von Juda
  rationale: Die Formulierung kennzeichnet eine königliche Quellenschrift. „Chronik“ gibt den Titelcharakter wieder, ohne sie mit dem kanonischen Buch der Chronik gleichzusetzen.
