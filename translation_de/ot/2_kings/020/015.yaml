base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: de
  text: 'Da fragte er: „Was sahen sie in deinem Haus[a]?“ Hiskia antwortete: „Sie sahen alles, was in meinem Haus ist. Es gab nichts in meinen Schatzkammern[b], das ich ihnen nicht gezeigt hätte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deinem Palast“. Wörtlich: „in deinem Haus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Vorratskammern“. Das hebräische Wort bezeichnet Räume, in denen Kostbarkeiten oder Vorräte aufbewahrt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רָאוּ
  choice: Was haben sie … gesehen?
  rationale: Die direkte Frage wird im Deutschen natürlich mit dem Perfekt wiedergegeben; מָה bleibt schlicht „was“.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: in deinem Haus / in meinem Haus
  rationale: בַּיִת bedeutet zunächst „Haus“, kann im königlichen Zusammenhang aber auch den Palast bezeichnen. Die Hauptübersetzung bewahrt die konkrete hebräische Ausdrucksweise.
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: Gebräuchliche deutsche Namensform.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: alles, was in meinem Haus ist
  rationale: Gibt den umfassenden Sinn von כָּל אֲשֶׁר und den Relativsatz vollständig und natürlich wieder.
- source_word: לֹא הָיָה דָבָר
  choice: Es gab nichts
  rationale: Idiomatiche deutsche Wiedergabe der negierten hebräischen Existenzkonstruktion.
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: was ich ihnen nicht … gezeigt hätte
  rationale: Der Hifil von ראה bedeutet „sehen lassen, zeigen“; das Suffix der 3. Person Plural wird mit „ihnen“ ausdrücklich wiedergegeben. Der Konjunktiv II ist im deutschen Folgesatz nach „Es gab nichts“ idiomatisch.
- source_word: בְּאֹצְרֹתָי
  choice: in meinen Schatzkammern
  rationale: אֹצָר bezeichnet eine Schatzkammer oder einen Vorratsraum. Im königlichen Kontext und angesichts der vorgezeigten Kostbarkeiten passt „Schatzkammern“ am besten.
