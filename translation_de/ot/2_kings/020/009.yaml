base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: de
  text: 'Und Jesaja sagte: »Dies ist für dich das Zeichen von Jahwe, dass Jahwe tun wird, was er gesagt hat: Soll der Schatten zehn Stufen[a] vorwärtsgehen oder soll er zehn Stufen zurückgehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Grad«. Das hebräische Wort bedeutet wörtlich »Stufen« oder »Aufstiege«; traditionell wird es hier wegen der Bewegung des Schattens auf der mit Ahas verbundenen Vorrichtung auch mit »Grad« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: das Zeichen
  rationale: אוֹת bezeichnet hier ein bestätigendes, von Gott gegebenes Zeichen; »Zeichen« ist im Deutschen natürlich und quellennah.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת bezeichnet Herkunft bzw. Urheberschaft. Der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt beziehungsweise die Bedeutung des Zeichens ein.
- source_word: יַעֲשֶׂה ... אֶת־הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: tun wird, was er angekündigt hat
  rationale: Die idiomatische Formulierung bewahrt den Erfüllungsgedanken von דָּבָר und דִּבֵּר, ohne im modernen Deutschen schwerfällig zu wirken.
- source_word: הָלַךְ הַצֵּל
  choice: Soll der Schatten … vorwärtsgehen
  rationale: Obwohl הָלַךְ formal eine Perfektform ist, stellt der Kontext zwei mögliche Zeichen zur Wahl. »Soll … vorwärtsgehen« gibt die modale Frage und den Gegensatz zu יָשׁוּב klar wieder.
- source_word: מַעֲלוֹת
  choice: Stufen
  rationale: מַעֲלוֹת bedeutet wörtlich »Stufen« oder »Aufstiege«. Diese Wiedergabe bleibt näher am Hebräischen als das traditionelle »Grad« und legt die genaue Beschaffenheit der Vorrichtung nicht fest.
- source_word: אִם
  choice: oder
  rationale: אִם führt in der disjunktiven Frage die zweite Möglichkeit ein; im Deutschen ist »oder« die natürliche Entsprechung.
- source_word: יָשׁוּב
  choice: zurückgehen
  rationale: שׁוּב bezeichnet die Umkehr beziehungsweise Rückkehr; »zurückgehen« passt natürlich zur rückläufigen Bewegung des Schattens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen יְהוָה. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die zweigliedrige Frage bleiben erhalten; die Formulierung vermeidet eine unnötige Festlegung darauf, ob מַעֲלוֹת konkrete Treppenstufen oder Maßeinteilungen einer Vorrichtung bezeichnet.
