base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: de
  text: Zu jener Zeit sandte Berodach-Baladan, der Sohn Baladans und König von Babylon, Briefe und ein Geschenk an Hiskia; denn er hatte gehört, dass Hiskia krank gewesen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Jesaja 39,1 lautet der Name Merodach-Baladan; auch alte Überlieferungen bezeugen diese Namensform.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Natürliche deutsche Erzählformel, die den zeitlichen Bezug wahrt, ohne die Dauer näher festzulegen.
- source_word: שָׁלַח
  choice: sandte
  rationale: Entspricht dem gewöhnlichen Sinn des Verbs und passt zum würdevollen Erzählregister.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: Berodach-Baladan
  rationale: Gibt die Konsonantenform des WLC an dieser Stelle unmittelbar wieder; die abweichende Namensform in Jesaja 39,1 wird in der Fußnote genannt.
- source_word: בֶּן בַּלְאֲדָן
  choice: der Sohn Baladans
  rationale: Natürliche deutsche Wiedergabe des hebräischen Patronymikons.
- source_word: מֶלֶךְ בָּבֶל
  choice: König von Babylon
  rationale: Übliche und klare Wiedergabe der Status- und Herrschaftsbezeichnung.
- source_word: סְפָרִים
  choice: Briefe
  rationale: Im diplomatischen Zusammenhang bezeichnet das Wort am wahrscheinlichsten schriftliche Mitteilungen.
- source_word: וּמִנְחָה
  choice: und ein Geschenk
  rationale: Das Wort kann Gabe, Opfergabe oder Tribut bedeuten; hier ist Geschenk kontextgerecht und vermeidet eine unnötige politische Festlegung.
- source_word: כִּי שָׁמַע
  choice: denn er hatte gehört
  rationale: Das erste כִּי begründet die Gesandtschaft; das Plusquamperfekt bildet die zeitliche Abfolge im Deutschen natürlich ab.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: dass Hiskia krank gewesen war
  rationale: Das zweite כִּי leitet den Inhalt des Gehörten ein; die Formulierung wahrt den Rückblick auf Hiskias Krankheit.
