source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: de
  text: Einige deiner Söhne, die von dir abstammen und die du zeugen wirst, wird man wegnehmen; sie werden Eunuchen[a] im Palast des Königs von Babylon sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hofbeamte“ oder „Palastbeamte“. Das hebräische Wort kann sowohl buchstäbliche Eunuchen als auch königliche Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: Und einige von deinen Söhnen
  rationale: Das partitive מִן wird im Deutschen natürlich mit „einige von“ wiedergegeben; „Söhne“ bewahrt die konkrete Bedeutung von בָּנִים.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: die von dir abstammen
  rationale: Die wörtliche Wendung „aus dir hervorgehen“ bezeichnet leibliche Abstammung; „von dir abstammen“ gibt den Sinn in natürlichem modernem Deutsch wieder.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: die du zeugen wirst
  rationale: Der Hifil von ילד bezeichnet bei einem männlichen Subjekt das Zeugen; die Formulierung erhält den ausdrücklich väterlichen Bezug.
- source_word: יִקַּח
  choice: wird man wegnehmen
  rationale: Die formal singularische Aktivform hat hier am ehesten ein unbestimmtes Subjekt. Das deutsche „man“ bewahrt diese Unbestimmtheit, ohne einen Täter ausdrücklich zu ergänzen; „wegnehmen“ macht die Verschleppung im Kontext deutlich.
- source_word: וְהָיוּ
  choice: Sie werden ... sein
  rationale: היה mit einem Prädikatsnomen kann „sein“ oder „werden“ bedeuten. „sein“ lässt offen, ob der Ausdruck einen neu erlangten Status oder eine Hofstellung bezeichnet.
- source_word: סָרִיסִים
  choice: Eunuchen
  rationale: „Eunuchen“ gibt die konkrete Grundbedeutung wieder. Da das Wort auch Hofbeamte bezeichnen kann, wird diese echte lexikalische Alternative in einer Fußnote erhalten.
- source_word: בְּהֵיכַל
  choice: im Palast
  rationale: In Verbindung mit dem König von Babylon bezeichnet הֵיכָל den königlichen Palast, nicht einen Tempel.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babylon
  rationale: Die deutsche Genitivverbindung gibt die hebräische Constructusverbindung klar und würdig wieder.
theological_decisions:
- issue: Bedeutung von סָרִיסִים am Königshof
  choice: Eunuchen im Haupttext
  alternative: Hofbeamte oder Palastbeamte
  rationale: Die konkrete Bedeutung „Eunuchen“ passt zum Wortkern und zur Schwere der Gerichtsankündigung. Weil סָרִיסִים jedoch auch königliche Amtsträger bezeichnen kann, wird die Spannung nicht aufgelöst, sondern durch die Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Abstammungsaussage des Hebräischen bleibt erhalten. Zwei Sätze vermeiden eine schwerfällige Satzperiode und machen die Gerichtsankündigung klar lesbar.
