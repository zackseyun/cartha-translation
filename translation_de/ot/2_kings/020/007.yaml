  text: וַ/יֹּ֣אמֶר יְשַֽׁעְיָ֔הוּ קְח֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וַ/יִּקְח֛וּ וַ/יָּשִׂ֥ימוּ עַֽל הַ/שְּׁחִ֖ין וַ/יֶּֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: de
  text: 'Und Jesaja sagte: „Nehmt einen Feigenkuchen[a].“ Da nahmen sie ihn, legten ihn auf das Geschwür[b], und er genas.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: eine zusammengepresste Masse aus Feigen; auch „Feigenpresskuchen“.'
    reason: lexical_alternative
  - marker: b
    text: Auch „die entzündete Hautstelle“ oder „die Beule“.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und er lebte“; hier ist gemeint, dass er genas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Und … sagte“ bewahrt den fortlaufenden Erzählfluss, ohne eine genauere zeitliche Beziehung hinzuzufügen.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Gebräuchliche deutsche Namensform des Propheten.
- source_word: קְחוּ
  choice: Nehmt
  rationale: Der Imperativ Plural von לקח wird direkt wiedergegeben. „Holt“ oder „bringt“ würden eine im Hebräischen nicht ausdrücklich enthaltene Bewegungsrichtung ergänzen.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: einen Feigenkuchen
  rationale: דְּבֶלֶת bezeichnet eine zusammengepresste Masse beziehungsweise einen Presskuchen, hier ausdrücklich aus Feigen. „Feigenkuchen“ ist im Deutschen knapp und verständlich; die Fußnote verhindert die moderne Assoziation eines gebackenen Kuchens.
- source_word: וַיִּקְחוּ
  choice: Da nahmen sie ihn
  rationale: Das pluralische Verb antwortet auf den pluralischen Befehl. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch „ihn“ aufgenommen; „Da“ kennzeichnet natürlich die anschließende Reaktion.
- source_word: וַיָּשִׂימוּ עַל
  choice: legten ihn auf
  rationale: שׂים ist ein allgemeines Verb des Setzens oder Platzierens. Bei der Anwendung auf eine erkrankte Hautstelle ist „auflegen“ beziehungsweise „auf … legen“ idiomatisch und sachlich.
- source_word: הַשְּׁחִין
  choice: das Geschwür
  rationale: שְׁחִין bezeichnet eine entzündliche Hauterkrankung, etwa ein Geschwür oder eine Beule. „Geschwür“ ist eine geläufige, hinreichend offene Wiedergabe; weitere Möglichkeiten werden in der Fußnote genannt.
- source_word: וַיֶּחִי
  choice: er wurde wieder gesund
  rationale: חיה bedeutet wörtlich „leben“ beziehungsweise „lebendig werden“. Im Zusammenhang der Behandlung einer Krankheit bezeichnet es die gesundheitliche Wiederherstellung; „wurde wieder gesund“ gibt diesen Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Art des Ergebnisses in וַיֶּחִי
  choice: körperliche Genesung
  alternative: „er lebte“ oder „er kam wieder zu Kräften“
  rationale: Der weitere Zusammenhang handelt von Hiskias Krankheit und Heilung. Daher ist Genesung der naheliegende kontextuelle Sinn, ohne dass eine Auferweckung oder eine weitergehende medizinische Aussage in den Text hineingelesen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Erzählführung. Der Plural „Nehmt“ und „sie“ bleibt erhalten. Die konkrete medizinische Bezeichnung wird nicht stärker präzisiert, als es das hebräische שְׁחִין erlaubt; die idiomatische Wiedergabe des abschließenden חיה wird durch eine wörtliche Fußnote transparent gemacht.
