lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Consecutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יְשַׁעְיָהוּ
  choice: Jesaja
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: אֶל חִזְקִיָּהוּ
  choice: zu Hiskia
  rationale: Die Präposition bezeichnet den Adressaten der Rede; „Hiskia“ ist die eingebürgerte deutsche Namensform.
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ wird knapp und formgetreu wiedergegeben und bewahrt die feierliche prophetische Aufforderungsformel.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der prophetischen Formel bezeichnet דָּבָר die von Gott kommende Äußerung; „Wort“ bewahrt die vertraute biblische Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle deutsche Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Aufforderung und die Erzählfolge des Hebräischen bleiben erhalten.
