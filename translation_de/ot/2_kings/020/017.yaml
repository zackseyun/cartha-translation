source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: de
  text: Siehe, es kommen Tage, da wird alles, was in deinem Haus ist und was deine Vorfahren bis zum heutigen Tag angesammelt haben, nach Babylon fortgebracht werden. Nichts wird übrig bleiben, spricht der HERR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Das einleitende Aufmerksamkeitssignal wird in einer würdigen, im prophetischen Kontext weiterhin verständlichen Form wiedergegeben.
- source_word: וְנִשָּׂא
  choice: wird … fortgebracht werden
  rationale: Das passive Verb bezeichnet die gewaltsame oder unfreiwillige Wegführung des Besitzes; „fortgebracht“ wahrt das Passiv und den Gerichtston.
- source_word: אֲבֹתֶיךָ
  choice: deine Vorfahren
  rationale: Der Ausdruck meint hier frühere Generationen und ist nicht auf den unmittelbaren Vater beschränkt.
- source_word: אָצְרוּ
  choice: angesammelt haben
  rationale: Gibt das Aufspeichern beziehungsweise Anhäufen von Schätzen oder Vorräten natürlich wieder, ohne den im Kontext nicht ausdrücklich genannten Gegenstand einzuengen.
- source_word: דָּבָר
  choice: Nichts
  rationale: In der negierten Wendung לֹא יִוָּתֵר דָּבָר bedeutet das Wort idiomatisch „nicht eine Sache“ beziehungsweise „nichts“.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchenform entspricht dem vorgesehenen Bibelregister.
theological_decisions:
- issue: Reichweite der angekündigten Wegführung
  choice: „alles“ und „nichts“ ohne Abschwächung beibehalten
  alternative: Die Aussage auf ausgewählte Schätze oder Güter begrenzen
  rationale: Der hebräische Text formuliert umfassend und rhetorisch zugespitzt; eine Einschränkung wäre interpretierend.
- issue: Prophetische Zeitformel
  choice: „es kommen Tage“
  alternative: „die Zeit wird kommen“
  rationale: Die konkrete hebräische Mehrzahl bleibt erhalten und bewahrt den prophetischen Klang, ohne einen genauen Zeitpunkt festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht prophetisch-biblischem Klang. Die Satzstruktur bleibt nahe am Hebräischen, ist aber flüssig und allgemein verständlich.
