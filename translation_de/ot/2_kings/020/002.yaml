source:
  edition: WLC
  text: וַ/יַּסֵּ֥ב אֶת פָּנָ֖י/ו אֶל הַ/קִּ֑יר וַ/יִּ֨תְפַּלֵּ֔ל אֶל יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/002.yaml
  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: de
  text: 'Da wandte er sein Gesicht zur Wand und betete zu Jahwe[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell wiedergegeben mit „der HERR“.'
    reason: Die Fußnote weist auf die hebräische Namensform und die verbreitete traditionelle Wiedergabe hin.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: Da wandte er
  rationale: Die Hifil-Wayyiqtol-Form von סבב bezeichnet hier eine in der Erzählfolge vollzogene Wendung. „Da“ gibt den Fortgang der Handlung natürlich wieder.
- source_word: פָּנָיו
  choice: sein Gesicht
  rationale: פנים bezeichnet hier konkret das Gesicht; die Formulierung bewahrt das anschauliche Bild des hebräischen Textes.
- source_word: אֶל הַקִּיר
  choice: zur Wand
  rationale: אֶל bezeichnet die Richtung, קִיר die Wand. „Zur Wand“ ist im Deutschen idiomatisch und präzise.
- source_word: וַיִּתְפַּלֵּל
  choice: und betete
  rationale: Das Hitpael von פלל bedeutet in diesem Zusammenhang „beten“; die Vergangenheitsform setzt die Erzählfolge fort.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bedeutet „zu“; der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Ausgangstext ausdrücklich gebrauchte Eigenname erkennbar bleibt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv von אמר führt den Inhalt des Gebets im folgenden Vers ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion besser als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den Charakter als Gottesname; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wendung „sein Gesicht zur Wand“ bleibt erhalten; der Doppelpunkt führt das in Vers 3 folgende Gebet idiomatisch ein.
