source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: de
  text: 'In jenen Tagen wurde Hiskia todkrank. Da kam der Prophet Jesaja, der Sohn des Amoz, zu ihm und sagte zu ihm: »So spricht Jahwe: Bestelle dein Haus, denn du wirst sterben und nicht am Leben bleiben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Gibt die übliche hebräische Zeitangabe nah am Wortlaut und in natürlichem, würdigem Deutsch wieder.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: wurde Hiskia todkrank
  rationale: Bewahrt den ingressiven Sinn von חלה und gibt לָמוּת idiomatisch als lebensbedrohliche, zum Tod führende Erkrankung wieder.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: der Prophet Jesaja, der Sohn des Amoz
  rationale: Die appositionale Bezeichnung wird vollständig bewahrt und im Deutschen natürlich angeordnet.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Entspricht der prophetischen Botenformel; das Tetragramm wird als persönlicher Name Jahwe wiedergegeben.
- source_word: צַו לְבֵיתֶךָ
  choice: Bestelle dein Haus
  rationale: Die traditionelle deutsche Wendung bewahrt das Bild des Hebräischen und bezeichnet die nötigen Anordnungen für Hausstand und Familie angesichts des Todes.
- source_word: כִּי מֵת אַתָּה וְלֹא תִחְיֶה
  choice: denn du wirst sterben und nicht am Leben bleiben
  rationale: Gibt die sichere Ankündigung des unmittelbar bevorstehenden Todes verständlich wieder, ohne einen bereits eingetretenen Tod zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; die im Deutschen gebräuchliche Transkription »Jahwe« bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft von כִּי מֵת אַתָּה
  choice: du wirst sterben
  alternative: du stirbst / du bist tot
  rationale: Die Formulierung kündigt den sicheren und bevorstehenden Tod an. Sie wird weder als bereits vollendeter Tod noch unnötig als bloße Möglichkeit verstanden.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Der einleitende Anschluss וַ wird im Deutschen idiomatisch mit »Da« wiedergegeben; unnötige Wiederholungen werden ansonsten nicht geglättet.
