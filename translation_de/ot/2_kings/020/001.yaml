  source_fidelity: Die Übersetzung gibt die Zeitangabe, die zum Tod führende Erkrankung, Jesajas Identifikation als Prophet und Sohn des Amoz, die Botenformel, den Imperativ an das Haus sowie die doppelte und sichere Todesankündigung zuverlässig wieder. »todkrank« trifft חָלָה ... לָמוּת idiomatisch; »du wirst sterben und nicht am Leben bleiben« wahrt die nachdrückliche Zweigliedrigkeit von כִּי מֵת אַתָּה וְלֹא תִחְיֶה.
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem biblisch-erzählendem Ton. »Bestelle dein Haus« ist eine etablierte, verständliche Wendung und bewahrt das Bild des Ausgangstextes. Die Wiederholung in »sagte zu ihm« ist quellentreu und nicht störend.
  terminology: »Hiskia«, »Jesaja«, »Amoz« und »Jahwe« sind im Deutschen sachgerecht. »So spricht Jahwe« bildet die prophetische Botenformel treffend ab, ohne eine theologische Zuspitzung hinzuzufügen.
