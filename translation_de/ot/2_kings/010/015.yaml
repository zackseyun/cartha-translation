  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֡ם וַ/יִּמְצָ֣א אֶת יְהוֹנָדָב֩ בֶּן רֵכָ֨ב לִ/קְרָאת֜/וֹ וַֽ/יְבָרְכֵ֗/הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/יֵ֧שׁ אֶת לְבָבְ/ךָ֣ יָשָׁ֗ר כַּ/אֲשֶׁ֤ר לְבָבִ/י֙ עִם לְבָבֶ֔/ךָ וַ/יֹּ֨אמֶר יְהוֹנָדָ֥ב יֵ֛שׁ וָ/יֵ֖שׁ תְּנָ֣/ה אֶת יָדֶ֑/ךָ וַ/יִּתֵּ֣ן יָד֔/וֹ וַ/יַּעֲלֵ֥/הוּ אֵלָ֖י/ו אֶל הַ/מֶּרְכָּבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: de
  text: 'Dann zog er von dort weiter und traf Jonadab, den Sohn Rechabs, der ihm entgegenkam. Er begrüßte ihn[a] und fragte ihn: »Ist dein Herz aufrichtig, wie mein Herz mit deinem Herzen verbunden ist?«[b] Jonadab antwortete: »Ja, das ist es!«[c] Darauf sagte er: »Gib mir deine Hand!« Er gab ihm seine Hand, und Jehu nahm ihn zu sich auf den Wagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er segnete ihn.« Das hebräische Verb kann »segnen« bedeuten, bezeichnet in einer solchen Begegnung aber wahrscheinlich einen Gruß.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ist dein Herz aufrichtig, wie mein Herz mit deinem Herzen ist?« Gemeint ist gegenseitige Loyalität oder Übereinstimmung der Absichten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Es ist, und es ist« – eine nachdrückliche Bestätigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Dann zog er von dort weiter
  rationale: Die Form führt die Erzählung fort; »zog … weiter« gibt die fortgesetzte Bewegung natürlich wieder.
- source_word: וַיִּמְצָא אֶת יְהוֹנָדָב בֶּן רֵכָב
  choice: traf Jonadab, den Sohn Rechabs
  rationale: מצא bedeutet grundsätzlich »finden«, bezeichnet hier im Zusammenhang einer Begegnung unterwegs aber idiomatisch das Antreffen.
- source_word: לִקְרָאתוֹ
  choice: der ihm entgegenkam
  rationale: Die Wendung beschreibt eine Bewegung auf Jehu zu, um ihm zu begegnen.
- source_word: וַיְבָרְכֵהוּ
  choice: Er begrüßte ihn
  rationale: ברך kann »segnen« bedeuten, dient in einer Begegnungsszene jedoch wahrscheinlich als Bezeichnung für einen Gruß; die wörtliche Möglichkeit wird in einer Fußnote bewahrt.
- source_word: הֲיֵשׁ אֶת לְבָבְךָ יָשָׁר
  choice: Ist dein Herz aufrichtig
  rationale: »Herz« bewahrt das hebräische Bild für innere Haltung und Loyalität; »aufrichtig« gibt יָשָׁר verständlich wieder.
- source_word: כַּאֲשֶׁר לְבָבִי עִם לְבָבֶךָ
  choice: wie mein Herz deinem Herzen zugetan ist
  rationale: Die Formulierung wahrt die doppelte Herzmetapher und drückt die relationale Ausrichtung aus, ohne sie auf eine bestimmte politische oder moralische Bedeutung zu verengen.
- source_word: יֵשׁ וָיֵשׁ
  choice: Ja, das ist es!
  rationale: Natürliches modernes Deutsch vermittelt die nachdrückliche Bejahung der hebräischen Wiederholung; der Wortlaut wird in einer Fußnote angegeben.
- source_word: תְּנָה אֶת יָדֶךָ
  choice: Gib mir deine Hand!
  rationale: Die direkte Aufforderung bewahrt sowohl die konkrete Handlung als auch deren möglichen Charakter als Zeichen des Einverständnisses.
- source_word: וַיִּתֵּן יָדוֹ
  choice: Er gab ihm seine Hand
  rationale: Die Formulierung entspricht unmittelbar der vorausgehenden Aufforderung; »ihm« macht den aus dem Zusammenhang erschließbaren Empfänger deutlich.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל הַמֶּרְכָּבָה
  choice: Jehu ließ ihn zu sich in den Wagen steigen
  rationale: Der Hifil von עלה bezeichnet das Hinaufbringen bzw. Hinaufsteigenlassen. Die Nennung Jehus verhindert im Deutschen ein missverständliches Pronomen und »zu sich« bewahrt אֵלָיו.
theological_decisions:
- issue: Bedeutung der Herzensfrage
  choice: Die Bildsprache von Herz, Aufrichtigkeit und gegenseitiger Zugewandtheit bleibt erhalten.
  alternative: Explizite Deutung als politische Loyalität oder völlige Übereinstimmung der Absichten.
  rationale: Der Kontext legt Loyalität und gemeinsame Ausrichtung nahe, doch der hebräische Wortlaut benennt deren genaue Art nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Erzählprosa. Die Herzmetapher bleibt bewusst erhalten; schwer verständliche hebräische Idiomatik wird im Haupttext behutsam geglättet und in den Fußnoten dokumentiert. Die Namensform »Jonadab« folgt dem im Deutschen geläufigen biblischen Gebrauch.
