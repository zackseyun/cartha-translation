base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: de
  text: 'Am Morgen ging er hinaus, stellte sich hin und sagte zum ganzen Volk: »Ihr seid unschuldig.[a] Seht, ich habe mich gegen meinen Herrn verschworen und ihn getötet. Aber wer hat alle diese erschlagen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihr seid gerecht« beziehungsweise »Ihr seid im Recht.« Das hebräische Wort kann moralische Gerechtigkeit oder Schuldlosigkeit bezeichnen; in diesem öffentlichen, auf Schuld bezogenen Zusammenhang liegt »unschuldig« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Am Morgen
  rationale: Die hebräische Erzählungsformel leitet den nächsten Handlungsschritt ein. Im modernen Deutschen gibt die knappe Zeitangabe ihre Funktion natürlich wieder, ohne das schwerfällige »Und es geschah am Morgen«.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: ging er hinaus, stellte sich hin
  rationale: Bewahrt beide aufeinanderfolgenden Verben und lässt die öffentliche, bewusste Haltung vor der Ansprache erkennen.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Übliche und natürliche Wiedergabe einer öffentlichen Ansprache an die versammelte Bevölkerung.
- source_word: צַדִּקִים אַתֶּם
  choice: Ihr seid unschuldig
  rationale: צַדִּיק bezeichnet hier im öffentlich-rechtlichen Kontrast Personen, die von der Schuld an Jehus Tat freigesprochen werden. Eine Fußnote bewahrt die breiteren Bedeutungen »gerecht« und »im Recht«.
- source_word: הִנֵּה
  choice: Seht
  rationale: Natürliches, nachdrückliches Aufmerksamkeitssignal an eine Mehrzahl von Angesprochenen.
- source_word: קָשַׁרְתִּי עַל
  choice: ich habe mich gegen … verschworen
  rationale: Die Verbindung bezeichnet ein Komplott gegen einen Herrscher oder Vorgesetzten; »sich gegen jemanden verschwören« ist im Deutschen idiomatisch.
- source_word: אֲדֹנִי
  choice: meinen Herrn
  rationale: Bezeichnet hier Jehus königlichen Herrn und nicht den Gottesnamen; die Kleinschreibung hält dies eindeutig.
- source_word: וָאֶהְרְגֵהוּ
  choice: und ihn getötet
  rationale: Direkte, moderne Wiedergabe des Tötungsverbs samt männlichem Objektpronomen.
- source_word: וּמִי הִכָּה
  choice: Aber wer hat … erschlagen?
  rationale: Das kontextuell adversative »Aber« hebt den rhetorischen Gegensatz hervor. »Erschlagen« gibt נכה in diesem eindeutig tödlichen Zusammenhang prägnant wieder.
- source_word: כָּל אֵלֶּה
  choice: alle diese
  rationale: Bewahrt die knappe, demonstrative und im Hebräischen nicht ausdrücklich auf »Männer« festgelegte Formulierung; der Kontext identifiziert die Getöteten.
