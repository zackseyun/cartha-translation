base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: de
  text: »Wenn nun dieser Brief zu euch kommt[a] und bei euch die Söhne eures Herrn[b] sind sowie die Streitwagen und die Pferde und eine befestigte Stadt[c] und die Waffen,«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn dieses Schriftstück bei euch eintrifft«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die Söhne des Königs, dem die Empfänger gedient hatten.
    reason: cultural_note
  - marker: c
    text: 'Oder: »eine Festungsstadt«; die Wendung bezeichnet eine verteidigungsfähige Stadt, die ihnen zur Verfügung stand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Wenn nun
  rationale: Die Verbindung leitet den nächsten Schritt des Schreibens ein; »nun« gibt den Diskursübergang natürlich wieder.
- source_word: כְּבֹא הַסֵּפֶר הַזֶּה אֲלֵיכֶם
  choice: wenn dieser Brief zu euch kommt
  rationale: כְּ mit dem Infinitiv von בוא ist temporal. סֵפֶר bezeichnet hier im Kontext königlicher Korrespondenz einen Brief beziehungsweise ein Schriftstück.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: die Söhne eures Herrn
  rationale: אדון bezeichnet hier den menschlichen Herrscher, dem die Empfänger dienten. »Herr« bewahrt das politische Dienstverhältnis und die Form des Hebräischen.
- source_word: הָרֶכֶב וְהַסּוּסִים
  choice: die Streitwagen und die Pferde
  rationale: רֶכֶב ist kollektiv für die verfügbaren Streitwagen gebraucht; »Streitwagen« macht den militärischen Zusammenhang deutlich, ohne über den Text hinauszugehen.
- source_word: וְעִיר מִבְצָר
  choice: außerdem eine befestigte Stadt
  rationale: Die Wendung bezeichnet eine verteidigungsfähige Stadt. »Außerdem« verdeutlicht, dass auch sie zu den verfügbaren Mitteln gehört.
- source_word: וְהַנָּשֶׁק
  choice: und die Waffen
  rationale: נֶשֶׁק bezeichnet hier allgemein Waffen beziehungsweise Bewaffnung; »Waffen« ist die klare moderne Entsprechung.
