  naturalness: Die vorliegende Fassung ist verständlich, aber die Gedankenstrich-Klammer und die Stellung von »außerdem« machen den ohnehin unvollständigen Bedingungssatz unnötig schwerfällig. Ein schlicht gebauter, offen mit Komma endender Konditionalsatz ist im modernen Standarddeutsch natürlicher und bildet die Fortsetzung im nächsten Vers klar ab.
  terminology: »Brief«, »Söhne eures Herrn«, »Streitwagen«, »Pferde«, »befestigte Stadt« und »Waffen« sind angemessene, registergerechte Entsprechungen. Die Fußnoten sind sachlich; bei Anmerkung c sollte die Erläuterung nicht stärker als der Text festlegen, dass konkret eine bestimmte Stadt gemeint sei.
