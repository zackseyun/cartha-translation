source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יֵהוּא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יְהוֹאָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: de
  text: Und Jehu legte sich zu seinen Vätern, und man begrub ihn in Samaria. Sein Sohn Joahas wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: שׁכב bedeutet wörtlich „sich hinlegen“ und dient in königlichen Schlussformeln als Umschreibung des Todes. „Legte sich zu seinen Vätern“ bewahrt die hebräische Bildsprache und ist im Deutschen als biblische Wendung verständlich.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die feste deutsche Wendung „sich zu seinen Vätern legen“ gibt die hebräische Todesformel natürlich wieder und erhält ihren Bezug auf die Vorfahren.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: man begrub ihn
  rationale: Das hebräische Verb steht aktiv in der 3. Person Plural, ohne die Handelnden zu nennen. Das unpersönliche „man“ bildet dies im modernen Deutschen natürlicher ab als ein unbegründetes „sie“.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition ב ist hier lokal gebraucht; „in Samaria“ bezeichnet den Ort der Bestattung.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der Nachfolgeformel bezeichnet מלך den Herrschaftsantritt. „Wurde König“ bringt diesen Übergang präziser zum Ausdruck als das umfassendere „regierte“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die Nachfolge im Königsamt und wird im Deutschen eng und idiomatisch wiedergegeben.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
- source_word: יְהוֹאָחָז
  choice: Joahas
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
theological_decisions:
- issue: Bedeutung der königlichen Todesformel
  choice: Die überlieferte Bildsprache „legte sich zu seinen Vätern“ wird beibehalten.
  alternative: „starb“
  rationale: Die Formel bezeichnet zwar den Tod, enthält aber zugleich ein bewusstes Bild der Verbindung mit den Vorfahren. Eine bloße Wiedergabe mit „starb“ würde diese Nuance beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Todesformel. Die Satzverknüpfung bleibt erzählerisch knapp; vor dem Nachfolgesatz wird im Deutschen auf ein weiteres „und“ verzichtet, ohne den Sinn zu verändern.
