  text: וּ/רְאִיתֶ֞ם הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ מִ/בְּנֵ֣י אֲדֹנֵי/כֶ֔ם וְ/שַׂמְתֶּ֖ם עַל כִּסֵּ֣א אָבִ֑י/ו וְ/הִֽלָּחֲמ֖וּ עַל בֵּ֥ית אֲדֹנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: de
  text: Dann wählt unter den Söhnen eures Herrn den Guten und Rechtschaffenen aus[a], setzt ihn auf den Thron seines Vaters und kämpft für das Haus[b] eures Herrn!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und seht den Guten und Rechtschaffenen unter den Söhnen eures Herrn.« Das hebräische Verb bedeutet eigentlich »sehen«, hat hier im Zusammenhang aber den Sinn, nach Prüfung jemanden auszuwählen.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Haus« ist hier das Königshaus oder die Dynastie gemeint, nicht nur ein Gebäude.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: wählt … aus
  rationale: Das Verb bedeutet wörtlich »sehen«, bezeichnet hier aber im Zusammenhang das prüfende Auswählen eines geeigneten Thronfolgers. »Auswählen« gibt die beabsichtigte Handlung im Deutschen natürlich wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: den Besten und Rechtschaffensten
  rationale: Die beiden substantivierten Adjektive kennzeichnen den unter mehreren Kandidaten am besten geeigneten und charakterlich rechten Sohn. Der Kontext legt im Deutschen eine superlativische Wiedergabe nahe.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: unter den Söhnen eures Herrn
  rationale: Die Präposition bezeichnet die Auswahl aus einer Gruppe. אֲדֹנֵיכֶם bezieht sich auf einen menschlichen Herrscher; »eures Herrn« wahrt den sozialen und königlichen Titel, ohne ihn mit dem Gottesnamen gleichzusetzen.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: setzt ihn auf den Thron seines Vaters
  rationale: Die Wendung beschreibt die Einsetzung zum königlichen Nachfolger. Die Ergänzung »ihn« ist im Hebräischen impliziert und im Deutschen für einen klaren Satz erforderlich.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: und kämpft für das Haus eures Herrn
  rationale: »Haus« bezeichnet hier nicht nur ein Gebäude, sondern das königliche Haus beziehungsweise die Dynastie. Die Formulierung bewahrt das biblische Bild und erklärt es in der Fußnote.
theological_decisions:
- issue: Wiedergabe von אֲדֹנֵיכֶם
  choice: eures Herrn
  alternative: eures Gebieters
  rationale: Gemeint ist eindeutig ein menschlicher königlicher Vorgesetzter, nicht JHWH. »Herr« ist im Deutschen als Bezeichnung dieses Treueverhältnisses natürlich; das Possessivpronomen und der Erzählzusammenhang machen den menschlichen Bezug deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Aufforderung und der herausfordernde Ton bleiben erhalten. »Haus« wird als bewusst bewahrtes dynastisches Bild verwendet; die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
