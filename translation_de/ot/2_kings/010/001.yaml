translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „nach Samaria an ...“ bewahrt sowohl das Ziel der Sendung als auch die im masoretischen Text schwierige Adressatenangabe. „Darin schrieb er:“ verbindet den Vers idiomatisch mit dem folgenden Briefinhalt.
