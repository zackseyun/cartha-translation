  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: de
  text: 'Ahab hatte siebzig Söhne in Samaria. Jehu schrieb Briefe und schickte sie nach Samaria an die führenden Männer von Jesreel[a], an die Ältesten und an die Betreuer der Söhne Ahabs[b]. Darin schrieb er:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an die führenden Männer von Jesreel“. Da die Briefe nach Samaria geschickt wurden, verstehen manche die Formulierung als Bezeichnung von Amtsträgern aus Jesreel, die sich dort aufhielten. Einige alte Übersetzungen und Ausleger lesen dagegen „die führenden Männer von Samaria“. Der Haupttext folgt dem masoretischen Wortlaut.'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „Erzieher“, „Pflegeväter“ oder „Vormünder“. Das hebräische Wort bezeichnet diejenigen, denen die Erziehung oder Beaufsichtigung der Söhne Ahabs anvertraut war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: Ahab hatte
  rationale: Die Verbindung aus ו und ל leitet hier die Umstände beziehungsweise das Thema ein; im Deutschen gibt „Ahab hatte“ die Besitzangabe natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: שִׁבְעִים בָּנִים
  choice: siebzig Söhne
  rationale: בָּנִים bezeichnet wörtlich Söhne; im Zusammenhang mit der königlichen Nachfolge ist die männliche Bedeutung relevant.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition bezeichnet hier den Ort, an dem sich Ahabs Söhne befanden.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: schrieb Briefe
  rationale: סְפָרִים meint in diesem Erzählzusammenhang schriftliche Mitteilungen; „Briefe“ ist im Deutschen klar und idiomatisch.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: schickte sie nach Samaria
  rationale: Das im Hebräischen aus dem vorherigen Satzglied erschließbare Objekt sind die Briefe; das Pronomen wird im Deutschen zur natürlichen Satzbildung ergänzt.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: an die führenden Männer von Jesreel
  rationale: שָׂרִים bezeichnet leitende Amtsträger oder Machthaber. „Führende Männer“ ist verständlich und lässt ihren genauen Amtsrang offen; die schwierige Ortsangabe „von Jesreel“ bleibt entsprechend dem masoretischen Text erhalten.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: Gemeint sind anerkannte kommunale oder gesellschaftliche Führungspersonen, nicht lediglich ältere Menschen.
- source_word: הָאֹמְנִים אַחְאָב
  choice: die Betreuer der Söhne Ahabs
  rationale: Das Partizip von אמן bezeichnet Personen, denen die Erziehung oder Obhut anvertraut ist. Die Söhne werden für eindeutiges, natürliches Deutsch aus dem Kontext ergänzt.
- source_word: לֵאמֹר
  choice: 'Darin schrieb er:'
  rationale: Die Formel leitet den Inhalt der Briefe ein. Die idiomatische deutsche Wiedergabe stellt den Bezug zum schriftlichen Mitteilungsvorgang klar her.
