  text: וַ/יָּבֹא֙ שֹֽׁמְר֔וֹן וַ֠/יַּךְ אֶת כָּל הַ/נִּשְׁאָרִ֧ים לְ/אַחְאָ֛ב בְּ/שֹׁמְר֖וֹן עַד הִשְׁמִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר אֶל אֵלִיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: de
  text: Als er nach Samaria kam, erschlug er alle, die von Ahab in Samaria noch übrig waren, bis er sie vernichtet hatte[a] – gemäß dem Wort Yahwehs, das er zu Elija gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis er ihn vernichtet hatte“. Die singularische Form kann sich kollektiv auf Ahabs Haus, also auf die ihm Zugehörigen, beziehen.'
    reason: Die hebräische Objektsendung ist maskulin Singular, obwohl unmittelbar zuvor von mehreren Übriggebliebenen die Rede ist.
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: Als er nach Samaria kam
  rationale: Die Wayyiqtol-Form führt die Erzählung fort; die temporale Wiedergabe mit „als“ verbindet das Eintreffen natürlich mit der folgenden Handlung.
- source_word: וַיַּךְ
  choice: erschlug er
  rationale: נכה bezeichnet hier im Zusammenhang der Ausrottung tödliche Gewalt. „Erschlug“ ist knapp, eindeutig und dem ernsten Erzählton angemessen.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: alle, die von Ahab noch übrig waren
  rationale: Das Partizip bezeichnet die Übriggebliebenen; לְאַחְאָב drückt ihre Zugehörigkeit beziehungsweise Beziehung zu Ahab aus. Die Formulierung bleibt verständlich, ohne ausdrücklich „Haus“ oder „Nachkommen“ in den Text einzufügen.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die zweite Ortsangabe wird wie im Hebräischen beibehalten, obwohl die Wiederholung im Deutschen stilistisch entbehrlich wäre.
- source_word: עַד הִשְׁמִידוֹ
  choice: bis er sie vernichtet hatte
  rationale: שׁמד bedeutet „vernichten, ausrotten“. Das pluralische „sie“ nimmt im natürlichen Deutschen die unmittelbar genannten Übriggebliebenen auf; die formal singularische Objektsendung und ihre mögliche kollektive Beziehung werden in der Fußnote kenntlich gemacht.
- source_word: כִּדְבַר יְהוָה
  choice: gemäß dem Wort Yahwehs
  rationale: דבר wird als „Wort“ wiedergegeben, um die Formel der prophetischen Erfüllung zu bewahren; der Gottesname יהוה erscheint als „Yahweh“.
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: das er zu Elija gesprochen hatte
  rationale: Die Vorzeitigkeit macht deutlich, dass das zuvor an Elija ergangene Wort nun erfüllt wurde. „Elija“ ist die im modernen Deutschen geläufige biblische Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Yahweh“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug der singularischen Objektsendung in הִשְׁמִידוֹ
  choice: Im Haupttext pluralisch auf die Übriggebliebenen bezogen, mit Fußnote zur singularisch-kollektiven Lesart
  alternative: „bis er ihn vernichtet hatte“, kollektiv auf Ahab beziehungsweise Ahabs Haus bezogen
  rationale: Die hebräische Form ist grammatisch maskulin Singular, während der unmittelbare Kontext eine Mehrzahl von Menschen nennt. Eine kollektive Beziehung auf Ahab beziehungsweise sein Haus ist möglich. Die Übersetzung wahrt sowohl natürliches Deutsch als auch die echte grammatische Spannung durch eine Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählweise. Die Wiederholung von „Samaria“ und die prophetische Erfüllungsformel bleiben aus Gründen der Textnähe erhalten.
