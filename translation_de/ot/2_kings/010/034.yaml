  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Was sonst noch über Jehu zu berichten ist, alles, was er tat, und seine ganze Macht[a] – steht das nicht im Buch der Geschichte der Könige von Israel geschrieben?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle seine Machttaten«; auch: »alle seine Heldentaten«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist eine königliche Annalenquelle, nicht notwendigerweise das kanonische Buch der Chronik.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: Was sonst noch über Jehu zu berichten ist
  rationale: Die feste Königsformel bezeichnet die übrigen berichtenswerten Taten und Angelegenheiten eines Herrschers. Diese natürliche deutsche Wiedergabe vermittelt den historiografischen Sinn von דִּבְרֵי, ohne es unpassend wörtlich als »Worte« wiederzugeben.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: alles, was er tat
  rationale: Die Formulierung bewahrt sowohl die umfassende Bedeutung von כָּל als auch den Relativsatz.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: und alle seine Machttaten
  rationale: גְּבוּרָה kann Macht, Stärke, Tapferkeit oder machtvolle Taten bezeichnen. Im königlichen Annalenstil sind die sichtbaren Machterweise beziehungsweise bedeutenden Taten gemeint; »Machttaten« hält diese Bedeutungsbreite besser offen als das abstrakte »Macht«.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: steht das nicht … geschrieben?
  rationale: Die rhetorische Frage, die eine bejahende Antwort erwartet, bleibt erhalten. Das zusammenfassende deutsche Singularpronomen »das« bezieht sich natürlich auf den gesamten zuvor genannten Stoff.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Geschichte
  rationale: עַל סֵפֶר wird im Deutschen idiomatisch mit »im Buch« wiedergegeben. דִּבְרֵי הַיָּמִים bezeichnet hier annalistische Geschichtsaufzeichnungen; »Geschichte« vermeidet eine Verwechslung mit dem kanonischen Buch der Chronik.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: Das לְ kennzeichnet im Titel die Zuordnung; der deutsche Genitiv gibt diese Beziehung natürlich wieder.
