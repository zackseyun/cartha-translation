source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֔ה לְ/קַצּ֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יַּכֵּ֥/ם חֲזָאֵ֖ל בְּ/כָל גְּב֥וּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: de
  text: In jener Zeit begann Jahwe, Teile von Israel abzutrennen[a], und Hasaël schlug sie im ganzen Gebiet Israels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Israel zu verkleinern«. Das hebräische Verb bezeichnet hier wohl die beginnende Beschneidung Israels, insbesondere durch Gebietsverluste.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »entlang der ganzen Grenze Israels«. Das hebräische Wort kann sowohl »Grenze« als auch »Gebiet« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jener Zeit
  rationale: Die hebräische Zeitangabe bedeutet wörtlich »in jenen Tagen«; »in jener Zeit« ist im modernen Deutschen natürlich und bewahrt den zeitlichen Rückbezug.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen übliche Form.
- source_word: הֵחֵל
  choice: begann
  rationale: Die Hifil-Form bezeichnet hier den Beginn des folgenden Vorgangs.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: Teile von Israel abzutrennen
  rationale: Die Wendung beschreibt keine sofortige vollständige Vernichtung, sondern eine einsetzende Beschneidung beziehungsweise Verkleinerung Israels, im Kontext besonders durch Gebietsverluste. Die Formulierung erhält das Bild des Abschneidens, ohne den Vorgang unnötig zu präzisieren.
- source_word: וַיַּכֵּם
  choice: schlug sie
  rationale: נכה bezeichnet ein Schlagen und kann im militärischen Zusammenhang Niederlage und Tötung einschließen. »Schlug sie« bewahrt die kräftige, zugleich nicht überpräzisierte Aussage sowie das pluralische Suffix.
- source_word: חֲזָאֵל
  choice: Hasaël
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamenschreibung transliteriert; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: im gesamten Gebiet Israels
  rationale: גְּבוּל kann sowohl die Grenze als auch das dadurch bestimmte Gebiet bezeichnen. Der militärisch-geografische Zusammenhang spricht hier für das gesamte Herrschaftsgebiet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst und keinen Titel. Die Wiedergabe als »Jahwe« wahrt diese Unterscheidung, ohne eine konfessionelle Deutung einzutragen.
- issue: Gottes Handeln bei der Verkleinerung Israels
  choice: Jahwe begann, Teile von Israel abzutrennen
  alternative: Israel begann kleiner zu werden
  rationale: Die aktive grammatische Aussage, dass Jahwe den Vorgang einleitet, bleibt erhalten; sie wird nicht in eine bloß politische Entwicklung umgedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise und die aktive Aussage über Jahwes Handeln bleiben erhalten. »Abtrennen« bewahrt das hebräische Schnittbild, während die Fußnote die mögliche abstraktere Wiedergabe nennt.
