  text: וַ/יִּקְבֹּ֤ץ יֵהוּא֙ אֶת כָּל הָ/עָ֔ם וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַחְאָ֕ב עָבַ֥ד אֶת הַ/בַּ֖עַל מְעָ֑ט יֵה֖וּא יַעַבְדֶ֥/נּוּ הַרְבֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: de
  text: 'Da versammelte Jehu das ganze Volk und sagte zu ihnen[a]: »Ahab hat dem Baal wenig gedient[b]; Jehu wird ihm viel dienen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jehus Aussage ist im Zusammenhang ironisch: Er kündigt an, Baal »viel« zu dienen, doch im weiteren Verlauf zeigt sich, dass dies eine List ist, mit der er die Verehrer Baals zusammenbringen will.'
    reason: cross_reference
  - marker: b
    text: 'Oder: »Ahab hat Baal wenig verehrt … Jehu wird ihn viel verehren.« Das hebräische Verb für »dienen« kann auch den religiösen Dienst beziehungsweise die Verehrung einer Gottheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: versammelte
  rationale: קבץ bezeichnet hier im fortlaufenden Erzählzusammenhang das Zusammenbringen von Menschen. »Versammelte« ist im Deutschen natürlich und präzise.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Die Wendung bedeutet wörtlich »das ganze Volk«. Diese Wiedergabe bewahrt den umfassenden Bezug, ohne die Gruppe näher einzugrenzen.
- source_word: עָבַד אֶת הַבַּעַל
  choice: dem Baal gedient
  rationale: עבד bezeichnet in Verbindung mit einer Gottheit kultischen Dienst. »Dienen« bleibt nahe am Hebräischen und lässt die religiöse Bedeutung erkennen; das deutsche Verb verlangt den Dativ.
- source_word: מְעָט
  choice: wenig
  rationale: Das Wort bezeichnet hier den Grad und bildet einen knappen Gegensatz zu הַרְבֵּה. »Wenig« erhält diesen Parallelismus ohne den Zusatz »nur«.
- source_word: יַעַבְדֶנּוּ
  choice: wird ihm dienen
  rationale: Das Suffix verweist auf Baal. Das Pronomen »ihm« bewahrt die Form des Hebräischen; die Zukunft entspricht dem Sinn des Imperfekts in dieser direkten Rede.
- source_word: הַרְבֵּה
  choice: viel
  rationale: הַרְבֵּה wird adverbial gebraucht und steht im Gegensatz zu מְעָט. »Viel« bewahrt die knappe Gegenüberstellung »wenig … viel«.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Der Artikel gehört im Hebräischen zur Bezeichnung, doch im Deutschen wird »Baal« gewöhnlich als Eigenname gebraucht. Wegen des Verbs »dienen« lautet die Form im Satz »dem Baal«.
theological_decisions:
- issue: Jehus Erklärung, Baal dienen zu wollen
  choice: Die Aussage wird im Haupttext ohne ausdrückliches Signal für Täuschung oder Ironie wiedergegeben.
  alternative: Zusätze wie »gab vor« oder »behauptete, er werde Baal dienen«
  rationale: Im Zusammenhang ist Jehus Aussage eine List. Der hebräische Wortlaut dieses Verses berichtet seine Rede jedoch ohne einen solchen deutenden Zusatz. Die Spannung wird deshalb bewahrt und in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gegenüberstellung »wenig … viel« und die direkte Rede bleiben erhalten. Der Haupttext erklärt Jehus List nicht vorzeitig.
