  text: וַ/יָּבֹ֤א הַ/מַּלְאָךְ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר הֵבִ֖יאוּ רָאשֵׁ֣י בְנֵֽי הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר שִׂ֣ימוּ אֹתָ֞/ם שְׁנֵ֧י צִבֻּרִ֛ים פֶּ֥תַח הַ/שַּׁ֖עַר עַד הַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: de
  text: 'Der Bote kam und meldete ihm: „Sie haben die Köpfe der Königssöhne gebracht.“ Da sagte er: „Legt sie in zwei Haufen[a] an den Eingang des Tores, bis es Morgen wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in zwei Stapel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: Im Erzählzusammenhang ist ein menschlicher Nachrichtenüberbringer gemeint, kein übernatürliches Wesen.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: meldete ihm
  rationale: Die deutsche Redeeinleitung mit Doppelpunkt gibt die hebräische Verbindung aus Mitteilungsverb und לֵאמֹר natürlich wieder, ohne das schwerfällige „meldete ihm und sagte“.
- source_word: הֵבִיאוּ
  choice: Sie haben … gebracht
  rationale: Die Verbform bezeichnet eine abgeschlossene Handlung mit gegenwärtigem Ergebnis; das deutsche Perfekt passt zur direkten Meldung.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: die Köpfe der Königssöhne
  rationale: Der Plural רָאשֵׁי bezeichnet hier im Kontext die abgetrennten Köpfe; בְנֵי הַמֶּלֶךְ meint die männlichen Nachkommen des Königs.
- source_word: שִׂימוּ אֹתָם
  choice: Legt sie
  rationale: Der Imperativ wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: שְׁנֵי צִבֻּרִים
  choice: in zwei Haufen
  rationale: צִבֻּרִים bezeichnet zusammengetragene Haufen oder Stapel. „Haufen“ ist anschaulich und idiomatisch; „Stapel“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: פֶּתַח הַשַּׁעַר
  choice: an den Eingang des Tores
  rationale: Die Formulierung bezeichnet den Bereich unmittelbar am Torzugang. Wegen des Verbs „legen“ ist im Deutschen die Richtungsangabe mit Akkusativ natürlich.
- source_word: עַד הַבֹּקֶר
  choice: bis es Morgen wird
  rationale: Die Wendung bezeichnet die Dauer bis zum folgenden Morgen und wird in flüssigem Deutsch wiedergegeben.
