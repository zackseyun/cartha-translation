  text: מִן הַ/יַּרְדֵּן֙ מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ אֵ֚ת כָּל אֶ֣רֶץ הַ/גִּלְעָ֔ד הַ/גָּדִ֥י וְ/הָ/רֻאובֵנִ֖י וְ/הַֽ/מְנַשִּׁ֑י מֵ/עֲרֹעֵר֙ אֲשֶׁ֣ר עַל נַ֣חַל אַרְנֹ֔ן וְ/הַ/גִּלְעָ֖ד וְ/הַ/בָּשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: de
  text: vom Jordan nach Osten, das ganze Land Gilead – das Gebiet der Gaditer, Rubeniter und Manassiter – von Aroër, das am Arnontal[a] liegt, sowie Gilead und Baschan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Arnon“; das hebräische Wort נַחַל kann ein Flusstal, ein Wadi oder ein Bachbett bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: vom Jordan nach Osten
  rationale: מִן bezeichnet den Ausgangspunkt; מִזְרַח הַשֶּׁמֶשׁ bedeutet wörtlich „zum Sonnenaufgang hin“ und ist in einer geografischen Angabe natürlich mit „nach Osten“ wiederzugeben.
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: das ganze Land Gilead
  rationale: אֵת kennzeichnet das von dem Verb in Vers 32 abhängige Objekt. „Das ganze Land Gilead“ bewahrt die regionale Bezeichnung und den umfassenden Sinn von כָּל.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: das Gebiet der Gaditer, Rubeniter und Manassiter
  rationale: Die singularischen Volksbezeichnungen stehen kollektiv für die drei ostjordanischen Stammesgruppen. Der Zusatz „das Gebiet“ macht die Apposition im Deutschen verständlich, ohne neue räumliche Grenzen einzuführen.
- source_word: מֵעֲרֹעֵר
  choice: von Aroër
  rationale: Die Präposition markiert Aroër als Grenz- beziehungsweise Ausgangspunkt; der Ortsname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: das am Arnontal liegt
  rationale: אֲשֶׁר bezieht sich auf Aroër, עַל ist hier örtlich zu verstehen. נַחַל kann Tal, Wadi oder Wasserlauf bezeichnen; „Arnontal“ ist eine klare geografische Wiedergabe, während die Mehrdeutigkeit in der Fußnote kenntlich bleibt.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: sowie Gilead und Baschan
  rationale: „Sowie“ erhält die additive Kraft der Konjunktion, ohne die Wendung ausdrücklich als Steigerung oder erläuternde Gleichsetzung festzulegen.
