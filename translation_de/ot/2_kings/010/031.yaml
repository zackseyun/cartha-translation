base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: de
  text: Doch Jehu achtete nicht darauf, mit ganzem Herzen nach der Weisung Jahwes[a], des Gottes Israels, zu leben. Er wandte sich nicht von den Sünden Jerobeams[b] ab, durch die er Israel zur Sünde verleitete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem Gesetz Jahwes“. Das hebräische Wort bezeichnet sowohl Weisung als auch verbindliches Gesetz.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die mit Jerobeam verbundenen kultischen Verfehlungen, besonders der von ihm eingerichtete Götzendienst; dies ist eine wiederkehrende Wendung in den Königebüchern.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: achtete nicht darauf, … zu leben
  rationale: Die Verbindung von שׁמר mit dem Infinitiv bezeichnet sorgfältiges Beachten beziehungsweise darauf Bedachtsein. „Zu leben“ gibt die Wegmetapher im Deutschen natürlich wieder, ohne ihren Bezug auf die Lebensführung zu verlieren.
- source_word: תּוֹרַת
  choice: Weisung
  rationale: תּוֹרָה bezeichnet hier die verbindliche göttliche Unterweisung im Bundesverhältnis. „Weisung“ bewahrt die Breite des Begriffs besser als das im heutigen Deutsch leicht verengte „Gesetz“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכָל לְבָבוֹ
  choice: mit ganzem Herzen
  rationale: Die geläufige deutsche Wendung bringt ungeteilte innere Hingabe treffend zum Ausdruck.
- source_word: לֹא סָר מֵעַל
  choice: wandte sich nicht … ab
  rationale: Die Formulierung bildet die Bedeutung des Sich-Entfernens oder Abwendens in natürlichem Deutsch ab.
- source_word: חַטֹּאות יָרָבְעָם
  choice: Sünden Jerobeams
  rationale: Die Wiedergabe bewahrt den Plural und die wiederkehrende wertende Formel der Königebücher.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: durch die dieser Israel zur Sünde verführt hatte
  rationale: Das Relativpronomen kann auf die Sünden als Mittel der Verführung zurückweisen. „Dieser“ macht eindeutig, dass Jerobeam und nicht Jehu das Subjekt des Relativsatzes ist; das Plusquamperfekt ordnet die Handlung zeitlich ein.
theological_decisions:
- issue: Bewertung von Jehus Bundestreue
  choice: Der Vers kritisiert Jehus fehlende ungeteilte Treue trotz seines vorherigen Vorgehens gegen den Baalskult.
  alternative: Die Aussage beziehe sich lediglich auf eine unvollständige politische Reform.
  rationale: „Mit ganzem Herzen“ und die Abkehr von Jerobeams Sünden betreffen ausdrücklich religiöse und moralische Bundestreue. Die Übersetzung bewahrt die Spannung zwischen Jehus Reformen und seinem fortdauernden Ungehorsam.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Formulierung „darauf achten, … zu leben“ vermittelt die hebräische Verbindung von sorgfältigem Beachten und Lebenswandel. Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
