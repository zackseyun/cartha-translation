  register: Modernes, würdevolles Standarddeutsch. »Traf« vermeidet die im Deutschen unpassende Vorstellung eines Sucherfolgs. Die wörtlich-konkreten Verwandtschafts- und Hofbegriffe bleiben erhalten; echte Bedeutungsbreiten werden durch Fußnoten sichtbar gemacht.
