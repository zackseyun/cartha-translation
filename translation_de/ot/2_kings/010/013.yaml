source:
  edition: WLC
  text: וְ/יֵה֗וּא מָצָא֙ אֶת אֲחֵי֙ אֲחַזְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּ֖אמֶר מִ֣י אַתֶּ֑ם וַ/יֹּאמְר֗וּ אֲחֵ֤י אֲחַזְיָ֨הוּ֙ אֲנַ֔חְנוּ וַ/נֵּ֛רֶד לִ/שְׁל֥וֹם בְּנֵֽי הַ/מֶּ֖לֶךְ וּ/בְנֵ֥י הַ/גְּבִירָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: de
  text: 'Jehu traf die Brüder[a] Ahasjas, des Königs von Juda, und fragte: »Wer seid ihr?« Sie antworteten: »Wir sind die Brüder Ahasjas und sind herabgekommen, um uns nach dem Wohlergehen der Söhne des Königs und der Söhne der Königsmutter[b] zu erkundigen.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Brüder« können in königlichen Erzählungen auch nähere Verwandte oder Angehörige der Sippe gemeint sein, nicht nur leibliche Brüder.
    reason: lexical_alternative
  - marker: b
    text: »Königsmutter« gibt das hebräische gebirah wieder, einen höfischen Titel für die Mutter des Königs.
    reason: cultural_note
  - marker: c
    text: 'Oder: »um zu sehen, ob es den Söhnen des Königs und den Söhnen der Königsmutter gut geht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָא
  choice: traf
  rationale: Das Verb bezeichnet hier das Antreffen oder die Begegnung. »Traf« ist im Deutschen natürlicher als das missverständliche »fand«.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: die Brüder Ahasjas
  rationale: Die konkrete Verwandtschaftsbezeichnung des Hebräischen bleibt im Haupttext erhalten; der mögliche weitere Sinn wird in einer Fußnote erläutert.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Apposition wird eindeutig auf Ahasja bezogen und entspricht dem hebräischen Königstitel.
- source_word: מִי אַתֶּם
  choice: Wer seid ihr?
  rationale: Direkte und natürliche Wiedergabe der knappen hebräischen Frage.
- source_word: וַנֵּרֶד
  choice: wir sind herabgekommen
  rationale: Bewahrt die im Hebräischen ausdrücklich bezeichnete Abwärtsbewegung und klingt aus der Perspektive der Sprecher natürlich.
- source_word: לִשְׁלוֹם
  choice: um uns nach dem Wohlergehen ... zu erkundigen
  rationale: Die Wendung bezeichnet hier die Erkundigung nach dem Ergehen anderer, nicht nur einen Gruß.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: die Söhne des Königs
  rationale: Bewahrt die geschlechtsspezifische und formell parallele Ausdrucksweise des Ausgangstextes.
- source_word: הַגְּבִירָה
  choice: Königsmutter
  rationale: Im judäischen Königshaus bezeichnet das Wort einen höfischen Titel der Mutter des regierenden Königs.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: und die Söhne der Königsmutter
  rationale: Die eigenständige Parallelformulierung des Hebräischen wird beibehalten, ohne eine mögliche Überschneidung der genannten Gruppen aufzulösen.
