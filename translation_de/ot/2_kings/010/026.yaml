  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: de
  text: Dann brachten sie die Kultsteine[a] aus dem Haus des Baal[b] hinaus und verbrannten sie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kultpfeiler“ beziehungsweise „aufgerichtete Steine“. Das hebräische Wort bezeichnet aufgerichtete Steine, die mit kultischer Verehrung verbunden waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus dem Tempel des Baal“.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen steht am Verb ein feminines Objekt im Singular: wörtlich „und verbrannten sie“ (Singular). Da zuvor von mehreren Kultsteinen die Rede ist, ist der Sinn offenbar kollektiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: Dann brachten sie … hinaus
  rationale: Die Hifil-Form von יצא bedeutet „hinausbringen“. „Dann“ gibt die fortschreitende Erzählfolge des Waw-Konsekutivs in natürlichem Deutsch wieder.
- source_word: מַצְּבוֹת
  choice: Kultsteine
  rationale: מַצֵּבָה bezeichnet einen aufgerichteten Stein beziehungsweise Kultpfeiler. Im Zusammenhang mit dem Baalskult ist „Kultsteine“ präzise und für heutige Leser verständlich, ohne daraus allgemein „Bilder“ zu machen.
- source_word: בֵּית הַבַּעַל
  choice: Haus des Baal
  rationale: בַּיִת bedeutet wörtlich „Haus“ und kann im kultischen Zusammenhang einen Tempel bezeichnen. „Haus des Baal“ bewahrt die Ausdrucksweise des Hebräischen; „Tempel des Baal“ bleibt als verständliche Alternative in der Fußnote.
- source_word: וַיִּשְׂרְפוּהָ
  choice: und verbrannten sie
  rationale: Obwohl das hebräische Verb ein feminines Singularobjekt („es/sie“) trägt, bezieht sich der Sinn auf das vorangehende pluralische מַצְּבוֹת. Der deutsche Plural vermeidet eine irreführende Inkongruenz; die formale Besonderheit wird in der Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Bezug zur hebräischen Satzstruktur. „Kultsteine“ ist gegenüber dem missverständlichen bloßen „Säulen“ sachlich genauer; die enger formalen Alternativen werden in den Fußnoten bewahrt.
