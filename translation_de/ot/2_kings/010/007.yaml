base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: de
  text: Als der Brief bei ihnen ankam, nahmen sie die Söhne des Königs und schlachteten siebzig Mann ab. Ihre Köpfe legten sie in Behälter[a] und schickten sie zu ihm nach Jesreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Töpfe« beziehungsweise »in Körbe«. Das hebräische Wort bezeichnet Behälter, deren genaue Art hier ungewiss ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: der Brief
  rationale: Im Erzählzusammenhang bezeichnet סֵפֶר Jehus schriftliche Mitteilung; »Brief« ist im Deutschen die natürlichste und genaueste Wiedergabe.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: die Söhne des Königs
  rationale: Die Formulierung bewahrt sowohl das familiäre als auch das dynastische Verhältnis und folgt dem unmittelbaren Wortsinn.
- source_word: וַיִּשְׁחֲטוּ
  choice: schlachteten sie ab
  rationale: שׁחט bezeichnet ein Schlachten und unterstreicht hier die brutale Tötung; »abschlachten« gibt diese Härte im modernen Deutschen deutlich wieder.
- source_word: שִׁבְעִים אִישׁ
  choice: siebzig Mann
  rationale: אִישׁ dient hier der Zählung männlicher Personen; die feste deutsche Zählform »siebzig Mann« entspricht dem Kontext.
- source_word: רָאשֵׁיהֶם
  choice: ihre Köpfe
  rationale: Die wörtliche Wiedergabe ist durch den Zusammenhang eindeutig geboten; ein Euphemismus wäre unangemessen.
- source_word: בַּדּוּדִים
  choice: in Behälter
  rationale: דּוּדִים bezeichnet Gefäße oder Behälter, deren Material und genaue Form hier nicht sicher bestimmbar sind. »Behälter« wahrt diese lexikalische Offenheit.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das Pronomen verweist im Kontext auf Jehu; die deutsche Fassung erhält wie das Hebräische die pronominale Bezugnahme.
- source_word: יִזְרְעֶאלָה
  choice: nach Jesreel
  rationale: Das angefügte Richtungszeichen bezeichnet Bewegung auf Jesreel zu; »nach Jesreel« gibt das Ziel im Deutschen idiomatisch wieder.
