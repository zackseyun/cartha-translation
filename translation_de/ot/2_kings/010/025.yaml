  to: 'Als er das Brandopfer dargebracht hatte, sagte Jehu zu den Leibwächtern und den Offizieren: »Geht hinein und erschlagt sie! Keiner darf herauskommen.« Da erschlugen sie sie mit der Schneide des Schwertes. Dann warfen die Leibwächter und die Offiziere sie hinaus und gingen bis zur Burganlage des Baalshauses[a].'
