base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: de
  text: 'Als er das Brandopfer dargebracht hatte, sagte Jehu zu den Leibwächtern und den Offizieren: »Geht hinein und erschlagt sie! Keiner darf herauskommen.« Da erschlugen sie sie mit der Schneide des Schwertes. Dann warfen die Leibwächter und die Offiziere sie hinaus und gingen bis zur Burganlage des Baalshauses[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis zur Stadt des Baalshauses“. Das hebräische Wort kann hier möglicherweise eine befestigte Anlage oder einen inneren Bereich des Tempelkomplexes bezeichnen; auch „Tempelburg“ ist als Deutung möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: Als er das Brandopfer vollständig dargebracht hatte
  rationale: Die Konstruktion mit כְּ und Infinitiv bezeichnet den Zeitpunkt nach Abschluss der Opferhandlung. „Das Brandopfer darbringen“ ist im Deutschen die natürliche kultische Wendung; „vollständig“ gibt den Abschlusscharakter von כלה wieder.
- source_word: לָרָצִים
  choice: zu den Leibwächtern
  rationale: רָצִים bedeutet wörtlich „Läufer“, bezeichnet im königlichen Umfeld jedoch häufig die Leibwache. „Leibwächter“ vermittelt hier ihre Funktion verständlicher als das missverständliche „Läufer“.
- source_word: לַשָּׁלִשִׁים
  choice: zu den Offizieren
  rationale: שָׁלִישׁ bezeichnet einen ranghohen militärischen Amtsträger, möglicherweise ursprünglich einen Streitwagenoffizier. „Offiziere“ wahrt die nötige begriffliche Breite.
- source_word: בֹּאוּ הַכּוּם
  choice: Geht hinein und erschlagt sie
  rationale: בוא bezeichnet hier das Hineingehen in den Tempelbereich. נכה meint in diesem Hinrichtungskontext tödliches Niederschlagen; „erschlagen“ gibt dies knapp und deutlich wieder.
- source_word: אִישׁ אַל יֵצֵא
  choice: Keiner darf herauskommen
  rationale: אִישׁ ist hier distributiv gebraucht. Die moderne deutsche Formulierung gibt das ausnahmslose Verbot wieder, ohne unnötig ein Geschlecht hervorzuheben.
- source_word: לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die hebräische Wendung lautet wörtlich „mit dem Mund des Schwertes“. „Mit der Schärfe des Schwertes“ bewahrt das konkrete Bild in verständlichem Deutsch.
- source_word: וַיַּשְׁלִכוּ
  choice: warfen sie hinaus
  rationale: Das Objekt ist im Hebräischen nur impliziert und bezieht sich im Kontext auf die Erschlagenen. „Hinaus“ macht die aus dem Ablauf erschließbare Richtung deutlich.
- source_word: עַד עִיר בֵּית הַבָּעַל
  choice: bis zum inneren Bezirk des Baalstempels
  rationale: עִיר bedeutet gewöhnlich „Stadt“, kann hier im architektonischen Zusammenhang aber einen abgegrenzten oder befestigten inneren Bereich der Tempelanlage bezeichnen. Die ungewöhnliche wörtliche Lesart bleibt in der Fußnote sichtbar.
