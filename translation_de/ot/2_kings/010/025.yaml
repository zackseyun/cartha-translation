  naturalness: „Mit der Schärfe des Schwertes“ ist im modernen Standarddeutsch weniger idiomatisch als „mit der Schneide des Schwertes“. „Gingen ... bis“ ist hier natürlich und näher am Erzählstil als „drangen ... vor“.
  terminology: „Brandopfer“, „Leibwächter“ und „Offiziere“ sind in diesem Kontext vertretbar. Der Abschluss der Opferhandlung wird durch „dargebracht hatte“ bereits ausgedrückt; „vollständig“ ist als zusätzliche Explizierung nicht nötig.
