source:
  edition: WLC
  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: de
  text: 'Dann gingen Jehu und Jonadab, der Sohn Rechabs, in das Haus des Baal[a]. Jehu sagte zu den Baalsverehrern: »Sucht sorgfältig nach und vergewissert euch, dass hier unter euch kein Diener des HERRN ist, sondern ausschließlich Baalsverehrer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Tempel des Baal«. Wörtlich: »in das Haus des Baal«.'
    reason: 'Lexikalische Alternative: בֵּית kann allgemein »Haus« und in diesem kultischen Zusammenhang konkret »Tempel« bezeichnen.'
lexical_decisions:
- source_word: וַיָּבֹא
  choice: gingen ... in
  rationale: בוא kann je nach Perspektive »kommen«, »gehen« oder »hineingehen« bedeuten. Mit dem Ziel בֵּית הַבַּעַל gibt »gingen ... in« die Bewegung ins Gebäude natürlich wieder. Das singularische Verb steht im Hebräischen vor einem zusammengesetzten Subjekt und wird im Deutschen sinngemäß pluralisch wiedergegeben.
- source_word: יְהוֹנָדָב בֶּן־רֵכָב
  choice: Jonadab, der Sohn Rechabs
  rationale: Die im Deutschen gebräuchliche Namensform »Jonadab« und die Genitivform »Rechabs« ergeben eine klare, natürliche Wiedergabe der Abstammungsangabe.
- source_word: בֵּית הַבָּעַל
  choice: das Haus des Baal
  rationale: Die wörtliche Wiedergabe bewahrt das hebräische Bild. Da damit hier ein Kultgebäude gemeint ist, nennt die Fußnote »Tempel des Baal« als verständliche Alternative.
- source_word: עֹבְדֵי הַבַּעַל
  choice: Baalsverehrer
  rationale: עבד kann »dienen« bedeuten; im kultischen Zusammenhang bezeichnet das Partizip die Anhänger beziehungsweise Verehrer Baals. »Baalsverehrer« macht diesen Sinn im heutigen Deutsch deutlich.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: Sucht sorgfältig nach und vergewissert euch
  rationale: Die zwei Imperative fordern sowohl eine aktive Suche als auch die anschließende Feststellung des Ergebnisses. Die Formulierung ist idiomatisch und erhält beide Handlungselemente.
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: dass hier unter euch kein ... ist
  rationale: 'פֶּן drückt hier eine vorsorgliche Vergewisserung aus: Es soll ausgeschlossen werden, dass sich eine solche Person unter ihnen befindet.'
- source_word: מֵעַבְדֵי יְהוָה
  choice: kein Diener des HERRN
  rationale: Der partitive Plural bedeutet sinngemäß »niemand von den Dienern des HERRN«. Der deutsche Singular nach »kein« ist natürlich. »Diener« bewahrt die im Hebräischen bestehende lexikalische Verbindung zu עבד, ohne die kultische Bedeutung bei Baal undeutlich werden zu lassen.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms durch den hervorgehobenen Titel »HERR« entspricht der vorgegebenen Projektkonvention und unterscheidet den Gottesnamen klar von gewöhnlichem »Herr«.
- source_word: כִּי אִם ... לְבַדָּם
  choice: sondern ausschließlich
  rationale: 'Die Verbindung bezeichnet einen scharfen Ausschluss: Nicht Diener des HERRN, sondern nur Baalsverehrer dürfen anwesend sein.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die Fassung folgt der zuletzt bestätigten Projektkonvention und gibt das Tetragramm als »der HERR« wieder. Die persönliche Referenz des Gottesnamens bleibt durch die typografische Hervorhebung erkennbar.
- issue: Bedeutung von עבד in der Gegenüberstellung
  choice: Baalsverehrer / Diener des HERRN
  alternative: Diener Baals / Verehrer des HERRN
  rationale: 'Dasselbe hebräische Wortfeld steht auf beiden Seiten, doch der Kontext akzentuiert unterschiedlich: Bei Baal geht es um die zum Kult versammelten Anhänger, während »Diener des HERRN« eine geläufige, weiter gefasste Bezeichnung ist. Die Übersetzung erhält die theologische Gegenüberstellung, ohne beide Ausdrücke künstlich gleichzuschalten.'
- issue: Bezugswort des singularischen וַיֹּאמֶר
  choice: Jehu sagte
  alternative: er sagte
  rationale: Der hebräische Singular verweist am natürlichsten auf Jehu als handelnde Hauptperson. Die ausdrückliche Namensnennung verhindert im Deutschen eine mögliche Mehrdeutigkeit nach dem zusammengesetzten Subjekt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Haus des Baal« hält die Quellformulierung sichtbar; »Baalsverehrer« ist für gewöhnliche Leser klarer als das missverständliche »Diener Baals«. Die direkte Rede bleibt knapp und befehlend.
