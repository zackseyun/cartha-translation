  source_fidelity: Die Übersetzung gibt die Bewegung in das „Haus des Baal“, die gemeinsame Handlung Jehús und Jonadabs sowie Jehús anschließende Aufforderung zutreffend wieder. „Sucht sorgfältig nach und vergewissert euch“ bildet die beiden Imperative חַפְּשׂוּ וּרְאוּ idiomatisch als Suche und Überprüfung ab. Die Vorsichtsnuance von פֶּן wird durch die Aufforderung zur Vergewisserung angemessen erfasst. Die ausschließende Gegenüberstellung ist mit „sondern ausschließlich“ klar wiedergegeben.
  naturalness: Modernes, flüssiges Standarddeutsch mit angemessen knappem, befehlendem Register in der direkten Rede. „Baalsverehrer“ ist verständlich und im kultischen Kontext natürlich; „Diener des HERRN“ ist als feste religionssprachliche Bezeichnung ebenfalls idiomatisch.
