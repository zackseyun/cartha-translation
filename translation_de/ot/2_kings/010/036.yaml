base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/036.yaml
  text: The time that Jehu reigned over Israel was twenty-eight years in Samaria.
translation:
  language: de
  text: Jehu regierte achtundzwanzig Jahre über Israel, in Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר
  choice: '[als deutsche Satzformel nicht eigens wiedergegeben]'
  rationale: Die hebräische Wendung bedeutet wörtlich „und die Tage, die“, dient hier aber als Formel zur Angabe der Regierungsdauer. Im natürlichen modernen Deutsch wird dieser Sinn direkt mit „regierte achtundzwanzig Jahre“ ausgedrückt.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet in diesem königlichen Schlussvermerk die Ausübung der Königsherrschaft. „Regierte“ ist die übliche und natürliche deutsche Wiedergabe.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet zusammen mit מָלַךְ den Herrschaftsbereich beziehungsweise das beherrschte Volk.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: achtundzwanzig Jahre
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Regierungsdauer.
- source_word: בְּשֹׁמְרוֹן
  choice: sein Regierungssitz war Samaria
  rationale: Die Ortsangabe bezieht sich in der königlichen Formel auf Samaria als Ort, von dem aus Jehu über Israel regierte. Die explizite Formulierung verhindert im Deutschen, dass „in Samaria“ fälschlich wie eine Begrenzung der gesamten Herrschaft auf die Stadt klingt.
theological_decisions: []
translation_notes:
