id: 2KI.10.11
reference: 2 Kings 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣ךְ יֵה֗וּא אֵ֣ת כָּל הַ/נִּשְׁאָרִ֤ים לְ/בֵית אַחְאָב֙ בְּ/יִזְרְעֶ֔אל וְ/כָל גְּדֹלָ֖י/ו וּ/מְיֻדָּעָ֣י/ו וְ/כֹהֲנָ֑י/ו עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: de
  text: So erschlug Jehu alle, die vom Haus Ahabs in Jesreel noch übrig waren, ebenso alle seine führenden Männer[a], seine Vertrauten[b] und seine Priester, bis er ihm keinen Überlebenden übrig ließ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: seine Großen; auch: seine Vornehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: seine Bekannten oder seine engen Vertrauten.'
    reason: lexical_alternative
  - marker: c
    text: Mit „ihm“ kann Ahab oder das Haus Ahabs gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: erschlug
  rationale: נכה bezeichnet in diesem Erzählzusammenhang tödliche Gewalt. „Erschlug“ gibt die Aussage knapp und eindeutig wieder, ohne das altertümlichere „schlug ... tot“ zu verwenden.
- source_word: הַנִּשְׁאָרִים לְבֵית אַחְאָב
  choice: alle, die vom Haus Ahabs ... noch übrig waren
  rationale: Die Formulierung bewahrt den Gedanken der noch Verbliebenen und gibt לְבֵית אַחְאָב als Zugehörigkeit zum Königshaus beziehungsweise zur Dynastie Ahabs wieder.
- source_word: בְּיִזְרְעֶאל
  choice: in Jesreel
  rationale: Die Präposition ist lokal zu verstehen; „in“ passt zur Stadt Jesreel.
- source_word: גְּדֹלָיו
  choice: seine führenden Männer
  rationale: Wörtlich sind es „seine Großen“, also gesellschaftlich oder politisch einflussreiche Männer. „Führende Männer“ ist im heutigen Deutsch klar und vermeidet die engere Festlegung auf einen förmlichen Adelsstand.
- source_word: מְיֻדָּעָיו
  choice: seine Vertrauten
  rationale: Das Partizip zu ידע bezeichnet hier Personen, die Ahab persönlich nahestanden oder zu seinem engeren Umfeld gehörten. „Vertraute“ ist natürlicher und kontextuell treffender als bloß „Bekannte“.
- source_word: כֹהֲנָיו
  choice: seine Priester
  rationale: Die einfache Wiedergabe lässt offen, welche genaue kultische oder amtliche Funktion diese Ahab zugeordneten Priester innehatten.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: bis er ihm keinen Überlebenden übrig ließ
  rationale: Die Wendung bezeichnet vollständige Vernichtung. „Überlebender“ gibt שָׂרִיד präzise wieder; das singularische Pronomen לוֹ bleibt als „ihm“ erhalten.
theological_decisions:
- issue: Bezugswort des Pronomens לוֹ im Schlusssatz
  choice: Das Pronomen wird formal als „ihm“ wiedergegeben.
  alternative: „dem Haus Ahabs“ beziehungsweise „Ahab“ ausdrücklich einzusetzen.
  rationale: Das hebräische Pronomen kann komprimiert auf Ahab oder auf das Haus Ahabs bezogen sein. Die Wiedergabe „ihm“ bewahrt diese sprachliche Spannung, statt den Bezug im Haupttext stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem fortschreitenden Aufbau des Hebräischen, bleibt aber gut lesbar. „Haus Ahabs“ bewahrt die dynastische Ausdrucksweise; „Jesreel“ folgt der etablierten deutschen Namensform.
