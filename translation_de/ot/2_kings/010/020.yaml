  text: וַ/יֹּ֣אמֶר יֵה֗וּא קַדְּשׁ֧וּ עֲצָרָ֛ה לַ/בַּ֖עַל וַ/יִּקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/020.yaml
  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: de
  text: 'Da sagte Jehu: „Heiligt eine Festversammlung für den Baal!“ Und sie riefen sie aus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge im modernen deutschen Erzählstil natürlich wieder.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Schreibweise.
- source_word: קַדְּשׁוּ
  choice: Heiligt
  rationale: Der Pluralimperativ von קדשׁ bezeichnet hier das kultische Bestimmen beziehungsweise Absondern der Versammlung; „heiligt“ bewahrt diesen religiösen Gehalt knapp und würdig.
- source_word: עֲצָרָה
  choice: eine Festversammlung
  rationale: עֲצָרָה bezeichnet eine förmliche religiöse Zusammenkunft, oft mit festlichem beziehungsweise feierlichem Charakter. „Festversammlung“ ist im Deutschen präzise und verständlich.
- source_word: לַבַּעַל
  choice: für den Baal
  rationale: 'Die Präposition ל bezeichnet hier Zweck oder Zuordnung: Die Versammlung gilt dem Baal. Der bestimmte Artikel des Hebräischen wird mit „den“ bewahrt.'
- source_word: וַיִּקְרָאוּ
  choice: Und sie riefen sie aus
  rationale: קרא bedeutet in diesem Zusammenhang, die Versammlung öffentlich bekannt zu machen beziehungsweise einzuberufen. Das Pronomen „sie“ nimmt die Versammlung auf.
theological_decisions: []
