  source_fidelity: Der Text gibt die Abfolge des hebräischen Erzähltexts sowie den Pluralimperativ קַדְּשׁוּ angemessen wieder. „Heiligt“ bewahrt das kultische Moment des formalen Heiligens/Bestimmens; „Festversammlung für den Baal“ entspricht עֲצָרָה לַבַּעַל. „Sie riefen sie aus“ gibt וַיִּקְרָאוּ idiomatisch als öffentliche Ausrufung der zuvor genannten Versammlung wieder.
  naturalness: Die Formulierung ist moderne, gut verständliche Standardsprache mit einem angemessen würdigen, biblisch-narrativen Register. Die Wiederaufnahme durch „sie“ ist eindeutig, da sie sich auf die feminine „Festversammlung“ bezieht.
  terminology: „Jehu“ entspricht der üblichen deutschen Namensform. „Baal“ mit bestimmtem Artikel ist im Deutschen sachgerecht. Die kultisch geprägten Begriffe „heiligen“ und „Festversammlung“ sind präzise, ohne die im Kontext folgende Täuschungsabsicht vorwegzunehmen.
