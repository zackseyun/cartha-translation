base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: de
  text: 'Da sagte er: »Ergreift sie lebend!« Sie ergriffen sie lebend und schlachteten sie an der Zisterne[a] von Bet-Eked ab: zweiundvierzig Männer. Keinen von ihnen ließ er übrig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei der Zisterne« beziehungsweise »in die Zisterne«. Die hebräische Präposition lässt hier mehrere räumliche Deutungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: Ergreift sie
  rationale: תפשׂ bezeichnet hier das gewaltsame Ergreifen oder Gefangennehmen. »Ergreift« ist prägnant und passt zur anschließenden Angabe »lebend«.
- source_word: חַיִּים
  choice: lebend
  rationale: Das Wort wird hier prädikativ beziehungsweise adverbial gebraucht und stellt heraus, dass sie zunächst nicht getötet werden sollen.
- source_word: וַיִּשְׁחָטוּם
  choice: schlachteten sie ... ab
  rationale: שׁחט bezeichnet ein Schlachten und ist stärker und konkreter als ein allgemeines »töten«. »Abschlachten« bewahrt die Härte des Geschehens.
- source_word: אֶל־בּוֹר
  choice: an der Zisterne
  rationale: אֶל kann in diesem räumlichen Zusammenhang »an/bei« bedeuten; בּוֹר bezeichnet eine Grube oder Zisterne. Die genaue räumliche Beziehung bleibt unsicher und wird in der Fußnote kenntlich gemacht.
- source_word: בֵּית עֵקֶד
  choice: Bet-Eked
  rationale: Der Ausdruck fungiert als Ortsname und wird daher transliteriert, nicht etymologisierend übersetzt.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: zweiundvierzig Männer
  rationale: Die Zahlverbindung mit אִישׁ zählt hier ausdrücklich Männer; die Wiedergabe ist direkt und natürlich.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: Keinen von ihnen ließ er übrig
  rationale: Das singularische Verb hat im Erzählzusammenhang Jehu als Subjekt. Die Formulierung bewahrt den Nachdruck darauf, dass niemand aus der Gruppe überlebte.
