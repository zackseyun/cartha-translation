  text: וַ/יַּשְׁמֵ֥ד יֵה֛וּא אֶת הַ/בַּ֖עַל מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: de
  text: So vernichtete Jehu den Baal aus Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rottete Jehu den Baal aus Israel aus« beziehungsweise »beseitigte Jehu den Baal aus Israel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: So vernichtete
  rationale: Das Hifil von שׁמד bezeichnet das Herbeiführen von Vernichtung oder Beseitigung. »Vernichtete« gibt die starke Aussage des Verbs knapp und natürlich wieder; »So« stellt im Kontext den folgernden Erzählzusammenhang her.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: הַבַּעַל
  choice: den Baal
  rationale: Der hebräische Artikel wird im Deutschen natürlich mit »den« wiedergegeben. Die Bezeichnung bleibt beim Namen der Gottheit und wird nicht deutend zu »Baalverehrung« erweitert.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: Die Präposition מִן bezeichnet Trennung beziehungsweise Entfernung. »Aus Israel« drückt unmittelbar aus, dass Baal aus dem Bereich Israels beseitigt wurde.
theological_decisions:
- issue: Referent von »Baal«
  choice: »den Baal« als Bezeichnung der Gottheit beziehungsweise des durch sie repräsentierten Kultes
  alternative: »die Baalverehrung« oder »den Baalskult«
  rationale: Der hebräische Text nennt wörtlich »den Baal«. Die direkte Wiedergabe bewahrt die Ausdrucksweise und lässt den Kontext zeigen, dass damit die Unterdrückung des Baalkultes gemeint ist, ohne diese Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des Hebräischen bleibt erhalten. Der bestimmte Artikel bei »Baal« wird beibehalten, da »den Baal« im Deutschen verständlich und quellennah ist.
