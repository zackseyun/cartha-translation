  to: 'Sie gingen hinein, um Schlachtopfer und Brandopfer darzubringen. Jehu aber hatte draußen achtzig Männer aufgestellt und sagte: »Wer einen von den Männern, die ich in eure Hände gebe, entkommen lässt, verwirkt sein eigenes Leben für das Leben des Entkommenen.«[a]'
  rationale: Die Revision wahrt alle Inhalte des Ausgangstextes, bringt die Übergabeformel näher an die hebräische Bildsprache und glättet die Zeitführung. Die Ergänzung »sein eigenes« beziehungsweise »des Entkommenen« löst die im Deutschen sonst unverständliche Doppelreferenz auf; der wörtliche, ambige Wortlaut bleibt durch die Fußnote dokumentiert.
