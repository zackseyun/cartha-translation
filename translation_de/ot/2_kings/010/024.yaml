base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: de
  text: 'Sie gingen hinein, um Schlachtopfer und Brandopfer darzubringen. Jehu aber hatte draußen achtzig Männer aufgestellt und sagte: »Wer einen von den Männern, die ich in eure Hände gebe, entkommen lässt, verwirkt sein eigenes Leben für das Leben des Entkommenen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sein Leben anstelle seines Lebens«. Die beiden gleichlautenden Pronomen der hebräischen Strafformel beziehen sich auf zwei verschiedene Personen: auf den Wächter, der ein Entkommen zulässt, und auf den Entkommenen.'
    reason: Die Fußnote bewahrt die bewusst knappe, im Deutschen ohne Erläuterung mehrdeutige Formulierung des Hebräischen und erklärt die Referenz der beiden Pronomen.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dann gingen sie hinein
  rationale: בוא bezeichnet je nach Blickrichtung Kommen, Gehen oder Eintreten. Hier ist die Bewegung in den Ort der Opferhandlung gemeint; »gingen hinein« gibt dies im deutschen Erzählfluss natürlich wieder.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: um Schlachtopfer und Brandopfer darzubringen
  rationale: עשה bedeutet grundsätzlich »tun/machen«, bezeichnet bei Opfergaben aber deren kultische Darbringung. זְבָחִים wird als »Schlachtopfer« wiedergegeben, um es vom folgenden, vollständig verbrannten Brandopfer zu unterscheiden.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: hatte draußen achtzig Männer aufgestellt
  rationale: שׂים heißt »setzen/stellen«; im Zusammenhang mit einer Wachmannschaft ist »aufstellen« idiomatisch. אִישׁ bleibt entsprechend dem unspezifischen Ausgangstext »Männer« und wird nicht zu »Soldaten« präzisiert. Das Plusquamperfekt verdeutlicht, dass Jehu diese Vorkehrung bereits getroffen hatte.
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: Wer einen von den Männern … entkommen lässt
  rationale: Die Formulierung ist im Hebräischen knapp und formal mehrdeutig; im Zusammenhang richtet sich die Todesandrohung an die aufgestellten Wächter. Die deutsche Fassung macht die aus der Situation hervorgehende Verantwortlichkeit verständlich, ohne den Umfang der Warnung einzuschränken.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: die ich in eure Gewalt gebe
  rationale: Die Wendung »auf/in jemandes Hand bringen« bezeichnet die Übergabe in dessen Macht oder Verantwortung. »In eure Gewalt geben« bildet diesen Sinn in natürlichem Deutsch ab.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: muss mit seinem Leben für das Leben des Entkommenen einstehen
  rationale: נפש bedeutet hier »Leben«. תחת drückt Stellvertretung beziehungsweise Ersatz aus. Die Formulierung unterscheidet im Deutschen klar das Leben des verantwortlichen Wächters vom Leben des Entkommenen.
