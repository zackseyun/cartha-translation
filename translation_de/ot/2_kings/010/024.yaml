  terminology: »Schlachtopfer« und »Brandopfer« sind präzise kultische Begriffe in modernem Standarddeutsch. »In eure Hände gebe« bewahrt die bildhafte Übergabeformel. »Leben« ist für נֶפֶשׁ in diesem Rechts- bzw. Strafkontext angemessen.
