base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: de
  text: Jehu ließ in ganz Israel einen Aufruf ergehen. Alle Verehrer des Baal kamen, und kein einziger Mann blieb aus. Sie gingen in das Haus des Baal, und das Haus des Baal füllte sich von einem Ende bis zum anderen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mund an Mund“; eine hebräische Redewendung dafür, dass das Haus vollständig, von einem Ende bis zum anderen, gefüllt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: Darauf ließ Jehu in ganz Israel einen Aufruf ergehen
  rationale: Das Verb bedeutet wörtlich „senden“. Da kein ausdrückliches Objekt genannt wird und der Zusammenhang eine landesweite Einberufung voraussetzt, gibt „einen Aufruf ergehen lassen“ die Handlung im modernen Deutschen klar wieder, ohne bestimmte Boten ausdrücklich in den Text einzuführen.
- source_word: עֹבְדֵי הַבַּעַל
  choice: Verehrer des Baal
  rationale: עבד bezeichnet im kultischen Zusammenhang Menschen, die einer Gottheit dienen. „Verehrer“ macht die religiöse Bedeutung deutlich und vermeidet den möglichen Eindruck gewöhnlicher Diener.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: kein einziger Mann blieb zurück, der nicht gekommen wäre
  rationale: Die Formulierung wahrt das ausdrücklich maskuline אִישׁ und zugleich die nachdrückliche Aussage, dass aus der bezeichneten Gruppe niemand fehlte.
- source_word: בֵּית הַבַּעַל
  choice: das Haus des Baal
  rationale: Die wörtliche Bezeichnung „Haus des Baal“ bleibt erhalten. Im Zusammenhang ist eindeutig ein Heiligtum beziehungsweise Tempel gemeint.
- source_word: וַיִּמָּלֵא בֵית הַבַּעַל
  choice: das Haus des Baal füllte sich
  rationale: Der hebräische Nifal bezeichnet hier das Vollwerden des Gebäudes; die reflexive deutsche Wendung ist natürlich und nah an der Form des Ausgangstextes.
- source_word: פֶּה לָפֶה
  choice: von einem Ende bis zum anderen
  rationale: Die wörtliche Wendung „Mund an Mund“ ist ein räumliches Idiom für die vollständige Füllung. Die gewählte Formulierung vermittelt diesen Sinn verständlich; die wörtliche Gestalt wird in der Fußnote bewahrt.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: kein einziger Mann blieb zurück
  alternative: niemand blieb zurück
  rationale: Der hebräische Text verwendet ausdrücklich das maskuline Singularwort אִישׁ. Die gewählte Fassung bewahrt diese Form, ohne über die Aussage des Verses hinauszugehen.
- issue: Bezeichnung des Baalsheiligtums
  choice: Haus des Baal
  alternative: Baalstempel
  rationale: „Haus des Baal“ bildet בֵּית הַבַּעַל formal ab und lässt zugleich die kultische Bedeutung aus dem Kontext hervorgehen, ohne sie interpretierend zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und die umfassenden Aussagen des Hebräischen bleiben erhalten; schwer verständliche Idiomatik wird im Text sinngemäß und in der Fußnote wörtlich wiedergegeben.
