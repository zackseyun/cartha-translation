  text: וַ/יֹּ֨אמֶר֙ לְכָ֣/ה אִתִּ֔/י וּ/רְאֵ֖ה בְּ/קִנְאָתִ֣/י לַ/יהוָ֑ה וַ/יַּרְכִּ֥בוּ אֹת֖/וֹ בְּ/רִכְבּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: de
  text: 'Dann sagte er: »Komm mit mir und sieh meinen Eifer[a] für Jahwe!« Da ließen sie ihn auf seinem Streitwagen mitfahren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Eifersucht«. Das hebräische Wort kann je nach Zusammenhang sowohl Eifer als auch Eifersucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: Komm mit mir
  rationale: Der Imperativ von הלך dient hier idiomatisch als Einladung beziehungsweise Aufforderung; zusammen mit אִתִּי ergibt sich im Deutschen natürlich »Komm mit mir«.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Der Imperativ von ראה wird direkt wiedergegeben und bewahrt die Aufforderung, Jehus Handeln selbst wahrzunehmen.
- source_word: בְּקִנְאָתִי
  choice: meinen Eifer
  rationale: קִנְאָה kann Eifer oder Eifersucht bezeichnen. Im Zusammenhang mit Jehus beanspruchtem Einsatz für Jahwe ist »Eifer« die natürlichste Haupttextwiedergabe; die lexikalische Spannung wird in einer Fußnote erhalten.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kennzeichnet hier das Ziel beziehungsweise den Gegenstand des Eifers; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: Da ließen sie ihn … mitfahren
  rationale: Der Hifil von רכב ist kausativ (»jemanden fahren/reiten lassen«). »Mitfahren lassen« ist in diesem Zusammenhang natürlich und gibt die Beförderung als Mitreisender wieder; der hebräische Plural bleibt als »sie« erhalten.
- source_word: בְּרִכְבּוֹ
  choice: in seinem Wagen
  rationale: רֶכֶב bezeichnet hier Jehus Fahrzeug beziehungsweise Streitwagen. »In seinem Wagen« ist eine natürliche deutsche Formulierung und legt den im Suffix grammatisch nur als männlichen Singular bezeichneten Besitzer nicht ausdrücklich namentlich fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. »Jahwe« bewahrt ihn als Eigennamen und entspricht der im Deutschen üblichen wissenschaftlich fundierten Form.
- issue: Bewertung von Jehus קִנְאָה
  choice: Eifer, ohne ausdrückliche Billigung
  alternative: Eifersucht
  rationale: Der Haupttext gibt Jehus eigene Behauptung wieder. »Eifer« bezeichnet seinen beanspruchten leidenschaftlichen Einsatz, ohne dass die Übersetzung seine Motive oder Taten theologisch bestätigt; die mögliche Bedeutung »Eifersucht« wird in der Fußnote genannt.
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die direkte Rede bleibt knapp und eindringlich. »Mitfahren« vermeidet eine unnatürlich wörtliche Kausativkonstruktion; die Mehrzahl »sie« und die nicht ausdrücklich aufgelöste Besitzangabe »sein« bewahren die Form des hebräischen Textes.
