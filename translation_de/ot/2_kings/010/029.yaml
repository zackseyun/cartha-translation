source:
  edition: WLC
  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: de
  text: 'Doch von den Sünden Jerobeams, des Sohnes Nebats, der Israel zur Sünde verführte, ließ Jehu nicht ab: von den goldenen Kälbern, die in Bethel und Dan standen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Die Partikel schränkt Jehus zuvor geschildertes Vorgehen adversativ ein. „Doch“ ist im Deutschen natürlich und macht den Kontrast deutlich, ohne den Satz als unvollständige Ausnahme zu formulieren.
- source_word: חֲטָאֵי
  choice: Sünden
  rationale: Der Plural bezeichnet konkret die mit Jerobeams Kultpolitik verbundenen Verfehlungen; „Sünden“ gibt dies direkt und verständlich wieder.
- source_word: הֶחֱטִיא
  choice: zu denen dieser Israel verführt hatte
  rationale: Der Hifil von חטא hat kausative Bedeutung. „Verführt hatte“ drückt aus, dass Jerobeam Israel zum Sündigen brachte; „dieser“ stellt den Bezug zu Jerobeam klar.
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: wandte sich nicht ... von ... ab
  rationale: Die hebräische Wendung bedeutet, dass Jehu diesen Sünden nicht den Rücken kehrte beziehungsweise sie nicht aufgab. Die deutsche Formulierung bewahrt das Bild des Abwendens und klingt idiomatisch.
- source_word: עֶגְלֵי הַזָּהָב
  choice: die goldenen Kälber
  rationale: Die konkrete Bezeichnung erläutert appositionell, worin Jerobeams Sünden bestanden.
- source_word: אֲשֶׁר בֵּית אֵל וַאֲשֶׁר בְּדָן
  choice: in Bethel und Dan
  rationale: Die elliptischen Relativsätze bezeichnen die Standorte der Kälber. Im Deutschen ist die knappe Ortsangabe natürlich und eindeutig.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens.
- source_word: דָּן
  choice: Dan
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens.
theological_decisions:
- issue: Beziehung zwischen den „Sünden Jerobeams“ und den „goldenen Kälbern“
  choice: Die goldenen Kälber werden nach einem Gedankenstrich als konkretisierende Apposition wiederaufgenommen.
  alternative: Die Wendung könnte als syntaktisch lose, nachgetragene Erläuterung wiedergegeben werden.
  rationale: Der hebräische Text geht von der abstrakten Bezeichnung der Sünden zu den konkreten Kultbildern über. Der Gedankenstrich erhält diese erläuternde Bewegung, ohne zusätzliche Deutung einzutragen.
- issue: Bezugswort des Suffixes in מֵאַחֲרֵיהֶם
  choice: Das Abwenden wird auf die zuvor genannten Sünden bezogen und anschließend durch die goldenen Kälber konkretisiert.
  alternative: Das maskuline Pluralsuffix könnte formal vorausweisend beziehungsweise locker auf die anschließend genannten Kälber bezogen verstanden werden.
  rationale: 'Im Satzzusammenhang bleibt die bewusste syntaktische Spannung erhalten: Jehu gab Jerobeams sündhaften Kult nicht auf, der in den Kälbern Gestalt annahm.'
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung ist eng am hebräischen Satzgang orientiert, vermeidet aber die im Deutschen unnatürliche wörtliche Wendung „von hinter ihnen“. Der Gedankenstrich bildet die appositionelle Konkretisierung des Ausgangstextes ab.
