source:
  edition: WLC
  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: de
  text: „Und nun ruft alle Propheten Baals, alle seine Verehrer und alle seine Priester zu mir! Niemand darf fehlen, denn ich habe für Baal ein großes Opfer zu bringen. Wer fehlt, soll nicht am Leben bleiben.“ Jehu aber handelte mit Hinterlist[a], um die Verehrer Baals zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit List“ beziehungsweise „durch Täuschung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Wendung enthält ausdrücklich das Zeit- und Übergangswort עַתָּה („nun/jetzt“) mit וְ; „Und nun“ gibt den einleitenden Aufruf natürlich und quellennah wieder.
- source_word: נְבִיאֵי הַבַּעַל
  choice: die Propheten Baals
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und natürlich wieder.
- source_word: עֹבְדָיו
  choice: seine Verehrer
  rationale: Im kultischen Zusammenhang bezeichnet עבד Menschen, die Baal dienen und ihn verehren; „Verehrer“ macht den religiösen Bezug deutlicher als „Diener“.
- source_word: קִרְאוּ אֵלַי
  choice: ruft … zu mir
  rationale: Der pluralische Imperativ bezeichnet hier das Herbeirufen in Jehus Gegenwart; die deutsche Form ist direkt und verständlich.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: Niemand darf fehlen
  rationale: Die Wendung meint, dass keine Person bei der angeordneten Versammlung fehlen soll. Das natürliche deutsche „niemand“ hat dieselbe generische Reichweite, ohne das grammatisch maskuline אִישׁ unidiomatisch nachzubilden.
- source_word: זֶבַח גָּדוֹל לִי לַבַּעַל
  choice: ich habe für Baal ein großes Opfer zu bringen
  rationale: „Opfer“ gibt זֶבַח im kultischen Kontext verständlich wieder; „habe … zu bringen“ bewahrt Jehus angekündigte Verpflichtung beziehungsweise Absicht, ohne die Opferart unnötig einzuengen.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: Wer fehlt, soll nicht am Leben bleiben
  rationale: Die Wiederholung von פקד wird mit „fehlt“ aufgenommen; „soll nicht am Leben bleiben“ bewahrt die schroffe Todesdrohung des Hebräischen.
- source_word: בְעָקְבָה
  choice: mit Hinterlist
  rationale: Das seltene Substantiv bezeichnet ein täuschendes beziehungsweise listiges Vorgehen. „Hinterlist“ bewahrt hier die ausdrücklich negative Erzählwertung.
- source_word: לְמַעַן הַאֲבִיד
  choice: um … zu vernichten
  rationale: Die deutsche Zweckkonstruktion entspricht לְמַעַן mit dem Hifil von אבד und gibt die beabsichtigte vollständige Beseitigung kraftvoll wieder.
theological_decisions:
- issue: Erzählerische Bewertung von Jehus Vorgehen
  choice: Jehu aber handelte mit Hinterlist
  alternative: Jehu ging dabei mit List vor
  rationale: Der Erzähler kennzeichnet die Einladung als Täuschungsmanöver. „Hinterlist“ wahrt diese moralische und erzählerische Spannung, ohne Jehus Vorgehen zu rechtfertigen.
- issue: Generisches maskulines אִישׁ
  choice: Niemand darf fehlen
  alternative: Kein Mann darf fehlen
  rationale: אִישׁ steht in der negierten Einzelpersonenformel generisch. Im modernen Deutschen gibt „niemand“ die Reichweite genauer und natürlicher wieder; „kein Mann“ könnte fälschlich einen ausdrücklichen Gegensatz zu Frauen nahelegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Befehlsform und knapper Erzählweise. Der ausdrückliche hebräische Übergang וְעַתָּה wird mit „Und nun“ wiedergegeben. „Baal“ erhält im Deutschen den üblichen Genitiv „Baals“. Die einzige Fußnote bewahrt die Bedeutungsbreite von בְעָקְבָה zwischen listigem und klar hinterlistigem Vorgehen.
