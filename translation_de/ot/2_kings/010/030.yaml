  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Jehu: „Weil du gut daran getan hast, das auszuführen, was in meinen Augen recht ist, und dem Haus Ahab gegenüber alles getan hast, was ich im Sinn hatte, sollen deine Nachkommen bis zur vierten Generation[a] auf dem Thron Israels sitzen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne der vierten [Generation]“; ein Idiom für eine Dynastie über vier Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in seiner im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Bewahrt die kausale Funktion der Wendung in natürlichem modernem Deutsch.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת
  choice: du gut daran getan hast, auszuführen
  rationale: Gibt sowohl die ausdrückliche Anerkennung als auch den Infinitiv des Handelns idiomatisch wieder.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: was in meinen Augen recht ist
  rationale: Bewahrt die geläufige hebräische Bewertungsformel und bleibt im Deutschen verständlich.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: alles, was ich im Herzen hatte
  rationale: Erhält das hebräische Bild vom Herzen als Sitz des Willens und Vorhabens, ohne es einengend auszudeuten.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: du am Haus Ahabs alles getan hast
  rationale: Bezeichnet Jehus Vorgehen gegen Ahabs Dynastie, ohne die Art des Handelns über den Wortlaut hinaus zu präzisieren.
- source_word: בְּנֵי רְבִעִים
  choice: deine Söhne bis zur vierten Generation
  rationale: Gibt das dynastische Idiom verständlich wieder und hält zugleich am konkreten Ausdruck „Söhne“ fest.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: werden ... auf dem Thron Israels sitzen
  rationale: Bewahrt das königliche Bild des Sitzens auf dem Thron; der dynastische Bezug des Dativs לְךָ ergibt sich im Deutschen aus „deine Söhne“.
theological_decisions:
- issue: Göttliche Anerkennung von Jehus Handeln
  choice: Die Aussage wird als ausdrückliche Anerkennung seines Vorgehens am Haus Ahabs wiedergegeben.
  alternative: Die Anerkennung abschwächen oder zu einer uneingeschränkten Billigung seiner gesamten Herrschaft ausweiten.
  rationale: Der hebräische Text lobt konkret Jehus Ausführung des göttlichen Gerichts am Haus Ahabs. Er äußert sich hier nicht pauschal zu allen Aspekten seines Handelns; diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Gedankengang, wird aber durch die wiederholte kausale Verknüpfung im Deutschen klar gegliedert.
