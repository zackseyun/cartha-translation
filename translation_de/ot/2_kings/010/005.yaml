base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: de
  text: 'Da schickten der Palastvorsteher, der Stadtvorsteher, die Ältesten und die Betreuer[a] eine Botschaft an Jehu: »Wir sind deine Diener. Alles, was du uns sagst, werden wir tun. Wir werden niemanden zum König machen. Tu, was in deinen Augen gut ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pflegeväter“ oder „Erzieher“. Gemeint sind die Männer, denen die königlichen Söhne zur Betreuung anvertraut waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: der Palastvorsteher
  rationale: Die Umschreibung bezeichnet den für das königliche Haus beziehungsweise den Palast zuständigen Amtsträger. „Palastvorsteher“ gibt Funktion und königlichen Kontext knapp wieder, ohne einen genauer bestimmten Titel vorauszusetzen.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: der Stadtvorsteher
  rationale: Der hebräische Ausdruck beschreibt den für die Stadt verantwortlichen Amtsträger. „Stadtvorsteher“ bleibt nahe an dieser Funktionsbezeichnung und legt kein spezifisch modernes Amt fest.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: „Älteste“ ist die übliche und sachgerechte Wiedergabe der gesellschaftlich-politischen Führungsgruppe.
- source_word: הָאֹמְנִים
  choice: die Erzieher
  rationale: Das Partizip bezeichnet hier die Männer, denen die königlichen Söhne zur Betreuung und Erziehung anvertraut waren. „Erzieher“ ist im Deutschen natürlich und passt zum unmittelbaren Kontext.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Hier handelt es sich um eine politische Unterwerfungserklärung und ehrerbietige Selbstbezeichnung; „Diener“ ist daher angemessener als „Sklaven“.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: Alles, was du uns sagst, werden wir tun
  rationale: Die Formulierung bewahrt die umfassende Gehorsamszusage und klingt zugleich klar und würdig.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: Wir werden niemanden zum König machen
  rationale: 'Die Wiedergabe erhält die kausative Bedeutung des Hifil: Sie werden keinen Menschen als König einsetzen beziehungsweise herrschen lassen.'
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: was in deinen Augen gut ist
  rationale: Die bildhafte hebräische Wendung bleibt erhalten und ist im Deutschen verständlich; sie bezeichnet das, was Jehu selbst für gut hält.
- source_word: עֲשֵׂה
  choice: Tu
  rationale: Der knappe Imperativ entspricht der Kürze und Direktheit des hebräischen Schlusses.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Amtsbezeichnungen werden knapp und funktional wiedergegeben. Die wörtliche Wendung „in deinen Augen“ bewahrt das hebräische Bild. Der Fußnotenmarker steht unmittelbar bei dem erklärungsbedürftigen Ausdruck.
