id: 2KI.10.10
reference: 2 Kings 10:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: de
  text: 'Erkennt also: Kein Wort Jahwes, das Jahwe gegen das Haus Ahabs geredet hat, wird zu Boden fallen[a]. Jahwe hat getan, was er durch seinen Diener Elija geredet hat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung „zu Boden fallen“ bedeutet hier: fehlschlagen oder unerfüllt bleiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Hand seines Dieners Elija“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: Erkennt also
  rationale: Der pluralische Imperativ fordert die Angesprochenen auf, die Folgerung anzuerkennen; אֵפוֹא verleiht dem Aufruf folgernden Nachdruck.
- source_word: לֹא יִפֹּל ... אַרְצָה
  choice: wird zu Boden fallen
  rationale: Die anschauliche hebräische Wendung bleibt erhalten; sie besagt, dass kein Teil der Ankündigung scheitert oder unerfüllt bleibt.
- source_word: מִדְּבַר יְהוָה
  choice: Kein Wort Jahwes
  rationale: Das partitive מִן bezeichnet hier keinen einzigen Bestandteil des von Jahwe gesprochenen Wortes. Die deutsche Formulierung gibt diesen Sinn knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל בֵּית אַחְאָב
  choice: gegen das Haus Ahabs
  rationale: עַל hat im Zusammenhang der Gerichtsankündigung adversative Bedeutung. „Haus Ahabs“ bewahrt die biblische Bezeichnung für Familie und Dynastie.
- source_word: וַיהוָה עָשָׂה
  choice: Jahwe hat getan
  rationale: Die Form stellt die angekündigte Tat als vollzogen dar; das deutsche Perfekt passt zur gegenwärtigen Feststellung des Sprechers.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: durch seinen Diener Elija
  rationale: Die Wendung בְּיַד bezeichnet die Vermittlung oder Beauftragung. Im Deutschen gibt „durch“ den Sinn natürlich wieder; die wörtliche Bildform wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; seine Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung von einem bloßen Titel.
- issue: Gewissheit prophetischer Erfüllung
  choice: Die Metapher „zu Boden fallen“ bleibt im Text erhalten.
  alternative: „unerfüllt bleiben“ oder „fehlschlagen“
  rationale: Die hebräische Bildsprache bringt die vollständige Verwirklichung der Gerichtsankündigung zum Ausdruck, ohne das Bild durch eine reine Deutung zu ersetzen.
- issue: Vermittlung der prophetischen Botschaft
  choice: „durch seinen Diener Elija“
  alternative: „durch die Hand seines Dieners Elija“
  rationale: Beide Wiedergaben verstehen Elija als beauftragten Vermittler. Der Haupttext verwendet natürliches Deutsch, während die Fußnote die hebräische Ausdrucksweise dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Gottesnamens sowie „Haus Ahabs“ und die Metapher „zu Boden fallen“ bewahren die Struktur und Bildsprache des Hebräischen; „durch seinen Diener“ vermeidet zugleich eine im heutigen Deutsch unnötig sperrige Wendung.
