source:
  edition: WLC
  text: וַֽ/יִּתְּצ֔וּ אֵ֖ת מַצְּבַ֣ת הַ/בָּ֑עַל וַֽ/יִּתְּצוּ֙ אֶת בֵּ֣ית הַ/בַּ֔עַל וַ/יְשִׂמֻ֥/הוּ ל/מחראות עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: de
  text: Sie rissen die Kultsäule des Baal nieder, rissen den Tempel des Baal[a] nieder und machten ihn zu einer Latrine. So ist es bis heute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: das Haus des Baal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: sie rissen … nieder
  rationale: נתץ bezeichnet die gewaltsame Zerstörung von Bauwerken oder Kultgegenständen. „Niederreißen“ ist im modernen Deutsch natürlich und passt sowohl zur Kultsäule als auch zum Tempel.
- source_word: מַצְּבַת
  choice: die Kultsäule
  rationale: מַצֵּבָה bezeichnet hier einen aufgerichteten, kultisch verwendeten Stein beziehungsweise Pfeiler. „Kultsäule“ macht die Funktion verständlich, ohne einen bestimmten Baustil vorauszusetzen.
- source_word: הַבָּעַל
  choice: des Baal
  rationale: בַּעַל ist hier die Bezeichnung des kanaanäischen Gottes und wird als „Baal“ wiedergegeben.
- source_word: בֵּית הַבַּעַל
  choice: den Tempel des Baal
  rationale: בַּיִת bedeutet wörtlich „Haus“, bezeichnet im kultischen Zusammenhang aber den Tempel beziehungsweise das Heiligtum. „Tempel des Baal“ ist für heutige Leser unmittelbar verständlich; die wörtliche Ausdrucksweise wird in der Fußnote genannt.
- source_word: וַיְשִׂמֻהוּ
  choice: und machten ihn zu
  rationale: שׂוּם mit ל bezeichnet hier die Umwandlung beziehungsweise Bestimmung zu einem neuen Zweck. Das maskuline Pronomen bezieht sich am natürlichsten auf den Tempel.
- source_word: למחראות
  choice: zu einer Latrine
  rationale: Das Wort bezeichnet einen Ort für menschliche Ausscheidungen. „Latrine“ gibt die absichtliche Entweihung klar und ohne archaische Umschreibung wieder.
- source_word: עַד הַיּוֹם
  choice: So ist es bis heute
  rationale: Die hebräische Wendung bezeichnet das Fortbestehen des Zustands bis zur Gegenwart des Erzählers. Ein eigener kurzer Satz klingt im Deutschen natürlich und bewahrt den zeitlichen Sinn.
theological_decisions:
- issue: Bezeichnung des Baalheiligtums
  choice: Tempel des Baal
  alternative: Haus des Baal
  rationale: Der kultische Kontext zeigt, dass בֵּית hier ein Heiligtum bezeichnet. „Tempel“ ist idiomatisches modernes Deutsch; die wörtliche Lesart „Haus“ bleibt durch die Fußnote sichtbar.
- issue: Bezeichnung der Entweihung
  choice: zu einer Latrine
  alternative: zu einem Abortplatz
  rationale: Die direkte Wiedergabe wahrt die drastische Aussage über die vollständige Profanierung des Baalstempels, ohne sie abzuschwächen oder konfessionell auszudeuten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Wiederholung von „niederreißen“ spiegelt die hebräische Wiederholung; die drastische Bezeichnung „Latrine“ bleibt bewusst erhalten.
