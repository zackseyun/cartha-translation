  terminology: „Baal“ ist korrekt als Gottesname behandelt. „Kultsäule“, „Tempel“ und „Latrine“ sind klare, registergerechte Begriffe. Die Fußnote erläutert transparent, dass „Tempel“ die kontextuelle Wiedergabe des wörtlichen „Haus“ ist.
