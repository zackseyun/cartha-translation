base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/004.yaml
  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: de
  text: 'Doch sie fürchteten sich sehr, sehr und sagten: »Seht, die beiden Könige konnten ihm nicht standhalten[a] – wie sollten dann wir ihm standhalten?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „konnten nicht vor ihm stehen … wie sollten wir stehen?“ Im Hebräischen steht in beiden Satzteilen dasselbe Verb „stehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: sie fürchteten sich
  rationale: Die Form von ירא bezeichnet hier die furchtsame Reaktion auf Jehus Forderung. „Sich fürchten“ ist im modernen Deutsch klar und bewahrt die emotionale Aussage.
- source_word: מְאֹד מְאֹד
  choice: sehr, sehr
  rationale: Die Wiederholung verstärkt die Furcht nachdrücklich. Sie wird beibehalten, statt zu einem einzigen verstärkenden Ausdruck zusammengezogen zu werden.
- source_word: הִנֵּה
  choice: Seht
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die folgende Feststellung. „Seht“ ist gegenwärtig verständlich und weniger altertümlich als „Siehe“.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: die beiden Könige
  rationale: Der Ausdruck verweist bestimmt auf die zwei zuvor genannten Könige, die Jehu nicht widerstehen konnten.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: konnten vor ihm nicht bestehen
  rationale: עמד לפני beschreibt in diesem Zusammenhang, dass jemand einem Gegner nicht standhalten kann. „Vor ihm bestehen“ bewahrt sowohl das Bild des Stehens als auch die idiomatische Bedeutung.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: wie sollten dann wir bestehen?
  rationale: Die Frage zieht eine Folgerung aus dem Schicksal der beiden Könige. „Dann“ macht diesen Zusammenhang natürlich deutlich; die Wiederholung von „bestehen“ bildet die Wiederholung von עמד ab, und die Stellung von „wir“ gibt dem ausdrücklichen אֲנָחְנוּ Gewicht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige hebräische Wiederholung „sehr, sehr“ und die verbale Parallele in beiden Satzteilen bleiben erhalten; die Satzstellung „dann wir“ hebt die Sprechergruppe hervor.
