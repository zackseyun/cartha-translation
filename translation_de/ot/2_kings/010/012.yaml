source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ וַ/יָּבֹ֔א וַ/יֵּ֖לֶךְ שֹׁמְר֑וֹן ה֛וּא בֵּֽית עֵ֥קֶד הָרֹעִ֖ים בַּ/דָּֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: de
  text: Dann brach er auf, zog weiter und ging nach Samaria. Unterwegs war er bei Bet-Eked der Hirten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Eked kann etwa „Haus des Sammelns“ bedeuten; manche verstehen den Ortsnamen als Hinweis auf einen Platz, an dem Hirten Tiere schoren oder banden. Da die genaue Bedeutung unsicher ist, wird er im Haupttext als Ortsname wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Dann brach er auf
  rationale: Das Qal-Wayyiqtol von קום führt die nächste Handlung ein. Im Zusammenhang einer Reise gibt „brach er auf“ die Funktion natürlicher wieder als das wörtlichere „stand er auf“.
- source_word: וַיָּבֹא
  choice: zog weiter
  rationale: בוא kann je nach Erzählperspektive „kommen“ oder „gehen“ bedeuten. „Zog weiter“ wahrt die Bewegungsfolge und vermeidet eine unnatürliche Häufung von „gehen“.
- source_word: וַיֵּלֶךְ שֹׁמְרוֹן
  choice: ging nach Samaria
  rationale: הלך mit dem Ortsnamen bezeichnet hier die Bewegung in Richtung Samaria. Die zielgerichtete deutsche Wendung ist klar und idiomatisch.
- source_word: הוּא
  choice: war er
  rationale: Das selbstständige Pronomen eröffnet hier eine Umstands- beziehungsweise Ortsangabe; im Deutschen wird es zusammen mit dem aus dem Zusammenhang ergänzten Verb „war“ wiedergegeben.
- source_word: בֵּית עֵקֶד
  choice: Bet-Eked
  rationale: Die Verbindung fungiert als Ortsname. Wegen der unsicheren Bedeutung von עקד wird sie im Haupttext transkribiert statt übersetzt.
- source_word: הָרֹעִים
  choice: der Hirten
  rationale: רֹעִים bedeutet unmittelbar „Hirten“ beziehungsweise „Viehhirten“. Der Genitiv bewahrt die Form des Ortsnamens, ohne seine genauere Bedeutung festzulegen.
- source_word: בַּדָּרֶךְ
  choice: Unterwegs
  rationale: Die Wendung bezeichnet die Lage beziehungsweise den Aufenthalt auf der Reiseroute. „Unterwegs“ ist in diesem Satz natürliches modernes Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges ErzählDeutsch. Die Folge der drei hebräischen Bewegungsverben bleibt erkennbar, wird aber idiomatisch differenziert. Die etwas abrupte Ortsangabe des Hebräischen wird nicht harmonisierend zu einem neuen Reiseziel umgedeutet.
