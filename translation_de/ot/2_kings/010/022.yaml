base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: de
  text: 'Er sagte zu dem, der für die Kleiderkammer zuständig war: „Hol Kleidung für alle Baalsverehrer[a] heraus!“ Da holte er die Kleidung für sie heraus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Diener des Baal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: die Kleiderkammer
  rationale: Das seltene Substantiv bezeichnet hier einen Raum oder Bereich zur Aufbewahrung von Kleidung. „Kleiderkammer“ ist im heutigen Deutsch verständlich und vermeidet die späteren kirchlichen Assoziationen von „Sakristei“.
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: zu dem, der für die Kleiderkammer zuständig war
  rationale: Die Wendung bedeutet wörtlich „zu dem, der über der Kleiderkammer war“ und bezeichnet den verantwortlichen Aufseher. Die gewählte Formulierung gibt diese Amtsfunktion natürlich wieder.
- source_word: הוֹצֵא
  choice: Gib ... heraus
  rationale: Der Hifil-Imperativ von יצא fordert dazu auf, die aufbewahrten Gewänder herauszugeben. „Herausgeben“ passt zum verwalteten Kleidervorrat und verbindet sich natürlich mit dem folgenden Satz.
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: Gewänder / die Gewänder
  rationale: Beide Substantive bezeichnen Kleidung kollektiv. „Gewänder“ wahrt den gehobenen Erzählton und passt zu besonderen Kleidungsstücken, ohne eine nicht ausdrücklich genannte kultische Funktion festzulegen.
- source_word: עֹבְדֵי הַבָּעַל
  choice: Baalsverehrer
  rationale: עבד bezeichnet hier Menschen, die Baal kultisch dienen. „Baalsverehrer“ vermittelt diesen religiösen Sinn unmittelbar; die wörtlichere Möglichkeit „Diener des Baal“ bleibt in der Fußnote erhalten.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: Da gab er ihnen die Gewänder heraus
  rationale: Das singularische Kollektivum wird im Deutschen idiomatisch als Plural wiedergegeben. „Da“ führt die unmittelbare Ausführung des Befehls im Erzählfluss fort.
theological_decisions:
- issue: Bedeutung von עֹבְדֵי הַבָּעַל im kultischen Zusammenhang
  choice: Baalsverehrer
  alternative: Diener des Baal
  rationale: Die Übersetzung macht den kultischen Bezug deutlich, ohne über die im Text ausgesagte Zugehörigkeit zum Baalsdienst hinauszugehen. Die wörtlichere Alternative wird als echte lexikalische Möglichkeit dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kleiderkammer“ ist konkret und gegenwärtig verständlich; „Gewänder“ trägt einen leicht gehobenen, zum historischen Erzähltext passenden Ton. Der Satzbau bleibt nah am Hebräischen, ohne im Deutschen steif zu wirken.
