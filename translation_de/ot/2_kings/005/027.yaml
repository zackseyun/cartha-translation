  text: וְ/צָרַ֤עַת נַֽעֲמָן֙ תִּֽדְבַּק בְּ/ךָ֔ וּֽ/בְ/זַרְעֲ/ךָ לְ/עוֹלָ֑ם וַ/יֵּצֵ֥א מִ/לְּ/פָנָ֖י/ו מְצֹרָ֥ע כַּ/שָּֽׁלֶג־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: de
  text: So wird Naamans Hautkrankheit für immer an dir und deinen Nachkommen haften.« Da ging er von ihm weg, von einer Hautkrankheit betroffen und weiß wie Schnee.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרַעַת
  choice: Hautkrankheit
  rationale: Der hebräische Begriff bezeichnet ein Spektrum schwerer Hauterkrankungen beziehungsweise kultisch relevanter Hautzustände, nicht eindeutig die moderne Hansen-Krankheit. »Hautkrankheit« vermeidet eine anachronistisch genaue Diagnose.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: תִּדְבַּק
  choice: wird … haften
  rationale: דבק bezeichnet festes Anhaften oder Sich-Anschließen. »An dir … haften« bewahrt das anschauliche Bild und klingt in einer Fluchankündigung natürlich.
- source_word: וּבְזַרְעֲךָ
  choice: und deinen Nachkommen
  rationale: זֶרַע bezeichnet hier die Nachkommenschaft. »Nachkommen« ist im heutigen Deutsch klarer und natürlicher als das wörtliche »Same«.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Im Kontext des Gerichts bezeichnet der Ausdruck eine fortdauernde Wirkung; »für immer« gibt dies klar und gegenwärtig wieder.
- source_word: וַיֵּצֵא
  choice: Da ging er … weg
  rationale: Die narrative Verbform beschreibt das unmittelbare Fortgehen. »Da ging er … weg« bildet den Erzählfortschritt idiomatisch ab.
- source_word: מִלְּפָנָיו
  choice: von ihm weg
  rationale: Wörtlich steht »von vor seinem Angesicht«. Die Formulierung bezeichnet das Verlassen von Elischas Gegenwart; »von ihm weg« ist natürlich und wahrt den Bezug.
- source_word: מְצֹרָע
  choice: von der Krankheit gezeichnet
  rationale: Das Wort bezeichnet eine von צָרַעַת betroffene Person. Die Formulierung stellt den Bezug zur zuvor genannten Hautkrankheit her, ohne eine moderne Diagnose festzulegen, und lässt sich natürlich mit »weiß wie Schnee« verbinden.
- source_word: כַּשָּׁלֶג
  choice: weiß wie Schnee
  rationale: Wörtlich lautet der Vergleich »wie Schnee«; im Zusammenhang ist die schneeweiße Erscheinung der gemeinte Vergleichspunkt. Die Ergänzung »weiß« macht diesen im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe von צָרַעַת und מְצֹרָע
  choice: Hautkrankheit / von der Krankheit gezeichnet
  alternative: Aussatz / aussätzig
  rationale: Der Text schildert eine von Gott verhängte Erkrankung und deren Fortbestand bei den Nachkommen, erlaubt aber keine sichere Gleichsetzung mit der modernen Hansen-Krankheit. Die breitere Wiedergabe vermeidet eine medizinische Festlegung; die traditionelle Übersetzung wird in der Fußnote genannt.
- issue: Reichweite von לְעוֹלָם
  choice: für immer
  alternative: auf unabsehbare Zeit
  rationale: Die starke, unbefristete Formulierung des Gerichtswortes soll nicht abgeschwächt werden. Zugleich wird keine zusätzliche systematisch-theologische Erklärung zur tatsächlichen Dauer eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gerichtsaussage bleibt kraftvoll und bildhaft; medizinisch irreführende traditionelle Terminologie steht nur in der erklärenden Fußnote.
