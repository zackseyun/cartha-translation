  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: de
  text: 'Als der König von Israel den Brief gelesen hatte, zerriss er seine Kleider und sagte: »Bin ich etwa Gott, dass ich töten und lebendig machen kann? Dieser da schreibt mir, ich solle einen Mann von seinem Aussatz[a] heilen! Erkennt doch und seht, dass er einen Anlass zum Streit mit mir sucht.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צָרַעַת kann verschiedene Hautkrankheiten bezeichnen und nicht zwingend die heute als Hansen-Krankheit bezeichnete Lepra.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass er einen Vorwand gegen mich sucht“ bzw. „dass er nach einem Anlass gegen mich sucht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: den Brief
  rationale: סֵפֶר bezeichnet hier das zuvor übermittelte königliche Schreiben; „Brief“ ist im Erzählzusammenhang die natürliche und präzise Wiedergabe.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: zerriss er seine Kleider
  rationale: Die konkrete Handlung und die feste biblische Gebärde äußerster Bestürzung werden unmittelbar bewahrt.
- source_word: הַאֱלֹהִים אָנִי
  choice: Bin ich Gott
  rationale: Die rhetorische Frage stellt den König dem Gott gegenüber, dem die Macht über Tod und Leben zukommt; der bestimmte bzw. einzigartige Bezug wird nicht zu „ein Gott“ abgeschwächt.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: dass ich töten und lebendig machen könnte
  rationale: Das ausgewogene Gegensatzpaar des Hebräischen bleibt erhalten; der Konjunktiv entspricht im Deutschen der rhetorisch zurückgewiesenen Fähigkeit.
- source_word: שֹׁלֵחַ אֵלַי
  choice: schickt mir die Aufforderung
  rationale: Im Kontext des bereits genannten Briefes bezeichnet שׁלח die an den König gerichtete Mitteilung bzw. Forderung. Die deutsche Formulierung macht diesen kommunikativen Zusammenhang natürlich verständlich.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: einen Mann von seinem Aussatz zu heilen
  rationale: אָסַף mit מִן bezeichnet hier idiomatisch die Beseitigung bzw. Heilung von der Krankheit, nicht ein wörtliches „Sammeln“.
- source_word: צָּרַעַת
  choice: Aussatz
  rationale: „Aussatz“ wahrt den etablierten Erzählbegriff, ohne durch „Lepra“ vorschnell eine moderne medizinische Diagnose festzulegen; die weitere Bedeutung wird in einer Fußnote erläutert.
- source_word: דְּעוּ נָא וּרְאוּ
  choice: Erkennt doch und seht
  rationale: Beide Imperative bleiben sichtbar; „doch“ gibt die auffordernde Partikel נָא in würdigem, natürlichem Deutsch wieder.
- source_word: מִתְאַנֶּה הוּא לִי
  choice: dass er einen Anlass zum Streit mit mir sucht
  rationale: Das Hitpael bezeichnet das Suchen einer Gelegenheit oder eines Vorwands gegen jemanden. Die gewählte Fassung bewahrt sowohl die absichtliche Provokation als auch den erwarteten Konflikt.
theological_decisions:
- issue: Bezug von הָאֱלֹהִים in der rhetorischen Frage
  choice: „Bin ich Gott“
  alternative: „Bin ich ein Gott“
  rationale: Im israelitischen Erzählzusammenhang gilt das Töten und Lebendigmachen als göttliches Vorrecht. Die Wiedergabe bewahrt diesen bestimmten Bezug, ohne eine weitergehende Lehrformel in den Vers einzutragen.
- issue: Medizinische Bestimmung von צָרַעַת
  choice: „Aussatz“ mit erklärender Fußnote
  alternative: „schwere Hautkrankheit“ oder „Lepra“
  rationale: Der hebräische Ausdruck umfasst mehr als die heute als Hansen-Krankheit bezeichnete Lepra. Der traditionelle Oberbegriff bleibt lesbar, während die Fußnote eine medizinische Überbestimmung verhindert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede behält ihre alarmierte rhetorische Kraft. „Dieser da“ gibt das distanzierende זֶה wieder; die doppelte Aufforderung „Erkennt doch und seht“ wahrt die hebräische Form, ohne altertümlich zu wirken.
