source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֶל הָ/עֹ֔פֶל וַ/יִּקַּ֥ח מִ/יָּדָ֖/ם וַ/יִּפְקֹ֣ד בַּ/בָּ֑יִת וַ/יְשַׁלַּ֥ח אֶת הָ/אֲנָשִׁ֖ים וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: de
  text: Als er an den Hügel[a] kam, nahm er ihnen die Sachen ab[b] und verwahrte sie im Haus[c]. Dann schickte er die Männer fort, und sie gingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die Anhöhe“ beziehungsweise „an den befestigten Hügel“; Hebräisch: „an den Ofel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nahm er aus ihrer Hand“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „legte sie im Haus ab“ beziehungsweise „brachte sie im Haus unter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: den Hügel
  rationale: עֹפֶל bezeichnet eine Anhöhe, einen Hügel oder einen befestigten Hügel. Im Erzählzusammenhang ist die topografische Bedeutung am wahrscheinlichsten; „Hügel“ ist klar und legt nicht unnötig den Eigennamen „Ofel“ fest.
- source_word: מִיָּדָם
  choice: ihnen … ab
  rationale: Wörtlich steht „aus ihrer Hand“. Die deutsche Wendung „jemandem etwas abnehmen“ gibt die direkte Übergabe natürlich wieder; die hebräische Bildlichkeit wird in einer Fußnote genannt.
- source_word: וַיִּפְקֹד
  choice: verwahrte
  rationale: פקד hat ein breites Bedeutungsspektrum. Hier bezeichnet das Verb, dass Gehasi die empfangenen Gegenstände im Haus sicher unterbringt. „Verwahrte“ trifft diesen kontextuellen Sinn, ohne eine genauere Art der Lagerung zu behaupten.
- source_word: בַּבָּיִת
  choice: im Haus
  rationale: בית bezeichnet hier am natürlichsten das Gebäude als Ort, an dem die Gegenstände verwahrt wurden.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Der hebräische Text sagt allgemein „die Männer“. Obwohl es sich im Zusammenhang um Naamans Begleiter oder Diener handelt, wird keine spezifische Dienerbezeichnung verwendet.
