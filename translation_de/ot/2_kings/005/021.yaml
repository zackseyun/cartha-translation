  text: וַ/יִּרְדֹּ֥ף גֵּיחֲזִ֖י אַחֲרֵ֣י נַֽעֲמָ֑ן וַ/יִּרְאֶ֤ה נַֽעֲמָן֙ רָ֣ץ אַחֲרָ֔י/ו וַ/יִּפֹּ֞ל מֵ/עַ֧ל הַ/מֶּרְכָּבָ֛ה לִ/קְרָאת֖/וֹ וַ/יֹּ֥אמֶר הֲ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: de
  text: 'Da lief Gehasi Naaman nach. Als Naaman sah, dass er hinter ihm herlief, stieg er vom Wagen, ging ihm entgegen und fragte: »Ist alles in Ordnung?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch schalom bezeichnet hier in einer knappen Frage das Wohlergehen beziehungsweise die Frage, ob alles in Ordnung ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: lief … nach
  rationale: רדף bezeichnet das gezielte Nacheilen oder Verfolgen. Im Zusammenhang wirkt „nachlaufen“ natürlich und gibt die Bewegung wieder, ohne feindselige Absicht anzudeuten.
- source_word: אַחֲרֵי / רָץ אַחֲרָיו
  choice: nach / hinter ihm herlief
  rationale: Die Präposition bezeichnet die Bewegung hinter einer Person her. Die beiden deutschen Formulierungen vermeiden eine schwerfällige Wiederholung und bewahren den fortlaufenden Vorgang.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: stieg er vom Wagen
  rationale: נפל bedeutet wörtlich „fallen“, kann hier aber idiomatisch das rasche Absteigen bezeichnen. „Stieg … vom Wagen“ vermeidet den falschen Eindruck eines Unfalls; die Eile ist bereits durch Naamans unmittelbare Reaktion erkennbar.
- source_word: לִקְרָאתוֹ
  choice: ging ihm entgegen
  rationale: לקראת bezeichnet eine Bewegung auf jemanden zu, um ihn zu treffen. Die ausdrückliche Wiedergabe als eigene Handlung erhält die Abfolge des Hebräischen.
- source_word: הֲשָׁלוֹם
  choice: Ist alles in Ordnung?
  rationale: שָׁלוֹם bezeichnet hier in einer knappen Frage das Wohlergehen beziehungsweise die Frage, ob alles gut steht. Die deutsche Wendung gibt diese pragmatische Funktion natürlich wieder.
- source_word: וַ
  choice: Da
  rationale: Das einleitende narrative Waw führt die Handlung weiter. „Da“ wahrt den Erzählfluss im modernen Deutschen.
