  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: de
  text: 'Und er brachte den Brief zum König von Israel. Darin hieß es: »Und nun, wenn dieser Brief bei dir eintrifft: Sieh, ich habe meinen Diener Naaman zu dir geschickt, damit du ihn von seiner Hautkrankheit befreist.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist ungewöhnlich; sie meint hier wohl, Naaman von seiner Hautkrankheit zu befreien, also ihn davon zu heilen. Traditionell wird צָרַעַת mit »Aussatz« wiedergegeben.
    reason: Erläutert die auffällige hebräische Verbindung, ohne eine unsichere wörtliche Bildübertragung vorzuschreiben, und nennt die traditionelle Alternative.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Und er brachte
  rationale: Der Hifil von בוא hat hier den Brief als Objekt. »Brachte« gibt die kausative Bedeutung knapp wieder, ohne bereits ausdrücklich eine förmliche Übergabe anzunehmen.
- source_word: הַסֵּפֶר
  choice: den Brief
  rationale: סֵפֶר bezeichnet in diesem diplomatischen Zusammenhang das schriftliche Botschaftsschreiben eines Königs an einen anderen.
- source_word: לֵאמֹר
  choice: Darin hieß es
  rationale: Die deutsche Formulierung macht natürlich verständlich, dass nun der Wortlaut des Briefes folgt.
- source_word: וְעַתָּה
  choice: Nun denn
  rationale: Die Wendung bewahrt den förmlichen Übergang der königlichen Korrespondenz in gegenwärtigem, würdigem Deutsch.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: wenn dieser Brief bei dir eintrifft
  rationale: כ mit dem Infinitiv constructus ist temporal zu verstehen; »eintrifft« ist für einen Brief idiomatisch und präzise.
- source_word: הִנֵּה
  choice: sieh
  rationale: »Sieh« erhält die aufmerksamkeitslenkende Kraft der hebräischen Partikel, ohne das altertümlichere »siehe« zu verlangen.
- source_word: שָׁלַחְתִּי
  choice: Ich habe ... geschickt
  rationale: Das Perfekt bezeichnet im brieflichen Zusammenhang eine bereits vollzogene Sendung mit gegenwärtigem Ergebnis.
- source_word: עַבְדִּי
  choice: meinen Diener
  rationale: עֶבֶד kann Sklave, Diener oder königlicher Untergebener bedeuten. »Diener« bewahrt die Breite des Ausdrucks, ohne Naamans amtlichen Rang näher festzulegen.
- source_word: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: damit du ihn von seiner Hautkrankheit befreist
  rationale: אסף mit מן und der Krankheit ist hier eine ungewöhnliche Wendung. »Befreist« vermittelt die gemeinte Beseitigung des Leidens, ohne sie stärker medizinisch als »heilst« festzulegen; die konkrete hebräische Ausdrucksweise wird in der Fußnote genannt.
- source_word: צָרַעַת
  choice: Hautkrankheit
  rationale: Der hebräische Begriff umfasst verschiedene Hautleiden und ist nicht ohne Weiteres mit der modernen Hansen-Krankheit gleichzusetzen.
theological_decisions:
- issue: Wiedergabe von צָרַעַת
  choice: Hautkrankheit
  alternative: Aussatz
  rationale: »Hautkrankheit« vermeidet eine anachronistische medizinische Festlegung. Die traditionelle Wiedergabe »Aussatz« bleibt in der Fußnote sichtbar.
- issue: Wiedergabe der ungewöhnlichen Verbindung אסף מן
  choice: von seiner Hautkrankheit befreien
  alternative: 'von seinem Aussatz heilen; wörtlicher: ihn von seiner Hautkrankheit sammeln/wegnehmen'
  rationale: Der Haupttext gibt die kontextuelle Bedeutung in natürlichem Deutsch wieder, ohne das seltene Bild als gewöhnliches Heilungsverb zu glätten. Die Fußnote bewahrt sowohl die sprachliche Auffälligkeit als auch die geläufige sinngemäße Übersetzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht förmlichem Ton für königliche Korrespondenz. Der Satzbau bleibt gut verständlich; »Nun denn« und »sieh« erhalten die rhetorischen Signale des Hebräischen, ohne insgesamt altertümlich zu wirken.
