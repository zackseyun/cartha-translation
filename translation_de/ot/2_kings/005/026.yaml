revisions:
- from: 'Er aber sagte zu ihm[a]: »Ging mein Herz nicht mit, als der Mann sich von seinem Wagen aus dir zuwandte? Ist dies die Zeit, Silber anzunehmen und Kleider, Olivenhaine und Weinberge, Schafe und Rinder sowie Knechte und Mägde[b] zu erwerben?«'
  to: 'Er aber sagte zu ihm[a]: »Ging mein Herz nicht mit, als der Mann sich von seinem Wagen abwandte, um dir entgegenzugehen? Ist dies die Zeit, Silber, Kleider, Olivenhaine und Weinberge, Schafe und Rinder sowie Knechte und Mägde an sich zu nehmen?«'
  rationale: Die Revision beseitigt die unidiomatische Bewegungsbeschreibung, ohne die im Hebräischen nicht ausdrücklich festgelegte Frage eines Herabsteigens vom Wagen zu entscheiden. „An sich zu nehmen“ ersetzt das zu enge „zu erwerben“ und umfasst die gesamte Aufzählung in einer dem hebräischen לקח entsprechenden Weise. Der Fußnotenanker b wird vom Haupttext entfernt, weil die soziale Statusalternative den Ausdruck „Knechte und Mägde“ betrifft und unmittelbar dort stehen soll.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:58:21Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur, die rhetorische Frage und die Besitzliste folgen dem Hebräischen gut. „zu erwerben“ ist jedoch für לקח („nehmen“) zu spezifisch und kann besonders bei Knechten und Mägden einen nicht im Text ausgedrückten Erwerbsvorgang nahelegen. Die Wendung „von seinem Wagen aus dir zuwandte“ gibt die Bewegung zudem unnatürlich und syntaktisch missverständlich wieder.
  naturalness: „Ging mein Herz nicht mit“ ist als bewusst bildnahe, verständliche Wiedergabe tragfähig. Dagegen ist „als der Mann sich von seinem Wagen aus dir zuwandte“ im modernen Deutsch holprig; „sich von seinem Wagen abwandte, um dir entgegenzugehen“ ist idiomatisch und wahrt, ohne ein ausdrückliches Herabsteigen zu behaupten, die Bewegungsrichtung des Hebräischen.
  terminology: „Silber“, „Kleider“, „Olivenhaine“, „Weinberge“, „Schafe und Rinder“ sind sachgerecht. „Knechte und Mägde“ bewahrt die geschlechtliche Paarung und lässt den sozialen Status nicht enger festlegen als der Haupttext; die Alternative „Sklaven und Sklavinnen“ ist sinnvoll. Die Fußnotenanker bleiben korrekt platziert.
  issues:
  - severity: medium
    issue: „von seinem Wagen aus dir zuwandte“
    rationale: Die Formulierung ist im Deutschen nicht natürlich und kann nahelegen, dass der Mann sich weiterhin auf dem Wagen befand. Das Hebräische beschreibt sein Sich-Abwenden vom Wagen beziehungsweise seine Hinwendung zu Gehasi; ein tatsächliches Herabsteigen sollte nicht als eindeutige Aussage eingeführt werden.
  - severity: medium
    issue: „… sowie Knechte und Mägde zu erwerben“
    rationale: Das Verb „erwerben“ verengt לקח auf einen förmlichen Erwerb und passt nicht gleichartig zu allen Gliedern der hebräischen Liste. „an sich zu nehmen“ gibt die allgemeine Aneignungs- bzw. Empfangsnuance wieder und bewahrt den Vorwurf gewinnsüchtigen Nehmens.
  revised_text: 'Er aber sagte zu ihm[a]: »Ging mein Herz nicht mit, als der Mann sich von seinem Wagen abwandte, um dir entgegenzugehen? Ist dies die Zeit, Silber, Kleider, Olivenhaine und Weinberge, Schafe und Rinder sowie Knechte und Mägde an sich zu nehmen?«'
  revised_footnotes:
