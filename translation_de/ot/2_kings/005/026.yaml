  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: de
  text: 'Er aber sagte zu ihm[a]: »Ging mein Herz nicht mit, als der Mann sich von seinem Wagen abwandte, um dir entgegenzugehen? Ist dies die Zeit, Silber, Kleider, Olivenhaine und Weinberge, Schafe und Rinder sowie Knechte und Mägde an sich zu nehmen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: „War ich nicht im Geist dabei, als der Mann sich von seinem Wagen abwandte, um dir entgegenzugehen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא לִבִּי הָלַךְ
  choice: Ging mein Herz nicht mit
  rationale: Die Wiedergabe bewahrt das anschauliche hebräische Bild für Elisas innere Wahrnehmung oder geistige Gegenwart. Das mit- ergänzt im Deutschen idiomatisch die Vorstellung, ohne sie vollständig auszudeuten.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: als der Mann sich von seinem Wagen aus dir zuwandte
  rationale: „Sich zuwenden“ gibt הָפַךְ im Zusammenhang natürlich wieder; „von seinem Wagen aus“ wahrt die Mehrdeutigkeit, ob Naaman sich auf dem Wagen umwandte oder von ihm herabkam, statt ein Absteigen ausdrücklich festzulegen.
- source_word: הַעֵת
  choice: Ist dies die Zeit
  rationale: Der Zusammenhang verlangt eine rhetorische Frage. Die Formulierung gibt Elisas Tadel wieder, ohne eine zusätzliche Begründung einzutragen.
- source_word: לָקַחַת אֶת־הַכֶּסֶף
  choice: Silber anzunehmen
  rationale: כֶּסֶף bezeichnet wörtlich Silber und kann zugleich Geld meinen. „Annehmen“ passt zum empfangenen Geschenk, während „Silber“ die konkrete Ausdrucksweise des Hebräischen wahrt.
- source_word: בְּגָדִים וְזֵיתִים וּכְרָמִים
  choice: Kleider, Olivenhaine und Weinberge
  rationale: „Kleider“ ist gegenwärtiges, würdevolles Deutsch. זֵיתִים bezeichnet in dieser Aufzählung von Besitz am ehesten Olivenbäume beziehungsweise Olivenhaine; die Paarung mit Weinbergen legt landwirtschaftlichen Grundbesitz nahe.
- source_word: צֹאן וּבָקָר
  choice: Schafe und Rinder
  rationale: Die konkreten Tierbezeichnungen werden beibehalten, statt sie verallgemeinernd als Kleinvieh und Großvieh oder Herden wiederzugeben.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: Knechte und Mägde
  rationale: Die geschlechtlich unterschiedene Paarung des Hebräischen bleibt erhalten. Die traditionellen deutschen Sozialbezeichnungen lassen den genauen Grad der Unfreiheit offen; die mögliche Wiedergabe als Sklaven und Sklavinnen wird in einer Fußnote genannt.
theological_decisions:
- issue: Elisas übernatürliche Wahrnehmung in לִבִּי הָלַךְ
  choice: Das hebräische Bild „Ging mein Herz nicht mit“ bleibt im Haupttext erhalten.
  alternative: „War ich nicht im Geist dabei?“
  rationale: Die Alternative erklärt die wahrscheinlich gemeinte innere oder geistige Gegenwart deutlicher, würde jedoch die Art dieser Wahrnehmung stärker festlegen als der hebräische Wortlaut.
- issue: Sozialer Status von עֲבָדִים וּשְׁפָחוֹת
  choice: Knechte und Mägde
  alternative: Sklaven und Sklavinnen
  rationale: Die Wörter können abhängige Dienende bis hin zu rechtlich unfreien Menschen bezeichnen. Der Haupttext bewahrt die kontextuelle Offenheit; die Fußnote macht die härtere, ebenfalls mögliche Wiedergabe transparent.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Frage und die ausgreifende Aufzählung bleiben erhalten. „Ging mein Herz nicht mit“ bewahrt bewusst das fremdartige, aber verständliche hebräische Bild; Fußnoten erläutern die wichtigsten echten Übersetzungsalternativen.
