  text: וְ/הוּא בָא֙ וַ/יַּעֲמֹ֣ד אֶל אֲדֹנָ֔י/ו וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע מ/אן גֵּחֲזִ֑י וַ/יֹּ֕אמֶר לֹֽא הָלַ֥ךְ עַבְדְּ/ךָ֖ אָ֥נֶה וָ/אָֽנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: de
  text: 'Doch er kam herein und trat vor seinen Herrn. Da sagte Elisa zu ihm: »Woher kommst du, Gehasi?«[a] Er antwortete: »Dein Diener ist weder hierhin noch dorthin gegangen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Woher, Gehasi?«'
    reason: Die knappe hebräische Frage enthält kein ausgesprochenes Verb.
  - marker: b
    text: 'Sinngemäß: »Dein Diener ist nirgendwohin gegangen.«'
    reason: Die hebräische Wendung »hierhin und dorthin« kann idiomatisch »irgendwohin« bedeuten.
lexical_decisions:
- source_word: וְהוּא בָא
  choice: Doch er kam herein
  rationale: וְהוּא markiert hier im Erzählfluss einen leichten Gegensatz zu Gehasis heimlichem Handeln; בָא bezeichnet sein Kommen beziehungsweise Eintreten in Elisas Gegenwart. »Doch er kam herein« gibt beides natürlich wieder.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: und trat vor seinen Herrn
  rationale: Die Wendung bezeichnet das Sichhinstellen vor einen Vorgesetzten beziehungsweise das Erscheinen zu dessen Dienst. »trat vor« ist im Deutschen idiomatisch; »Herrn« bezeichnet hier den menschlichen Dienstherrn Elisa.
- source_word: מֵאָן
  choice: Woher kommst du
  rationale: Das Fragewort bedeutet wörtlich »von woher?«. Im Kontext fragt Elisa nach Gehasis unmittelbar vorausgegangenem Weg; »Woher kommst du?« bewahrt die Herkunftsfrage ohne sie unnötig auszuweiten.
- source_word: גֵּחֲזִי
  choice: Gehasi
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: Dein Diener ist … nicht gegangen
  rationale: Die selbstbezügliche Höflichkeitsform »dein Diener« bleibt erhalten, da sie Gehasis untergeordnete Stellung gegenüber Elisa ausdrückt.
- source_word: אָנֶה וָאָנָה
  choice: weder hierhin noch dorthin
  rationale: Die paarige hebräische Ortswendung bedeutet »hierhin und dorthin« beziehungsweise idiomatisch »irgendwohin«. Die konkretere Wiedergabe erhält das Sprachbild und den Nachdruck der Leugnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die höflich-untergeordnete Selbstbezeichnung Gehasis und das räumliche Idiom des Hebräischen werden bewahrt; die Fußnoten weisen auf die wörtliche Kürze beziehungsweise den idiomatischen Sinn hin.
