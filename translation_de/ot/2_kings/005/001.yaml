id: 2KI.5.1
reference: 2 Kings 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: de
  text: Naaman, der Heerführer des Königs von Aram, war ein bedeutender Mann bei seinem Herrn und hoch angesehen, denn durch ihn hatte Jahwe Aram den Sieg geschenkt.[a] Der Mann war ein tapferer Krieger, doch er litt an Aussatz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Rettung“ oder „Befreiung“ bedeuten; hier bezieht es sich auf militärischen Erfolg.
    reason: lexical_alternative
  - marker: b
    text: Das mit „Aussatz“ übersetzte hebräische Wort bezeichnet verschiedene schwere Hautveränderungen und entspricht nicht unbedingt der heutigen klinischen Lepra (Hansen-Krankheit).
    reason: cultural_note
lexical_decisions:
- source_word: שַׂר צְבָא
  choice: Heerführer
  rationale: Bezeichnet den Befehlshaber der Streitkräfte; „Heerführer“ ist prägnant, würdig und im modernen Deutschen verständlich.
- source_word: מֶלֶךְ אֲרָם
  choice: des Königs von Aram
  rationale: Der hebräische Name אֲרָם bezeichnet Aram; die traditionelle Gleichsetzung mit „Syrien“ wird nicht in den Haupttext eingetragen.
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו
  choice: war ein bedeutender Mann bei seinem Herrn
  rationale: אִישׁ גָּדוֹל bezeichnet hier gesellschaftliche und politische Bedeutung; לִפְנֵי trägt im höfischen Zusammenhang den Sinn seiner Stellung beim König.
- source_word: וּנְשֻׂא פָנִים
  choice: und hoch angesehen
  rationale: Die Wendung bezeichnet Ehre und Ansehen und wird idiomatisch statt wörtlich wiedergegeben.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: denn durch ihn hatte Jahwe Aram den Sieg geschenkt
  rationale: בוֹ ist instrumental („durch ihn“); תְּשׁוּעָה meint im militärischen Kontext konkret Sieg, kann jedoch breiter Rettung oder Befreiung bezeichnen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: גִּבּוֹר חַיִל
  choice: ein tapferer Krieger
  rationale: Die feste Wendung hebt militärische Tüchtigkeit und Tapferkeit hervor; die gewählte Formulierung ist natürliches modernes Deutsch.
- source_word: מְצֹרָע
  choice: litt an Aussatz
  rationale: Das Wort bezeichnet einen von צָרַעַת Betroffenen. „Aussatz“ erhält den biblischen Zusammenhang, während eine Fußnote vor der vorschnellen Gleichsetzung mit moderner Lepra schützt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen; die Übersetzung bewahrt ihn als Eigennamen.
- issue: Jahwe schenkt einem fremden Volk militärischen Erfolg
  choice: denn durch ihn hatte Jahwe Aram den Sieg geschenkt
  alternative: denn durch ihn hatte Jahwe Aram Rettung verschafft
  rationale: Die ausdrückliche Zuschreibung von Arams Erfolg an Jahwe bleibt ungemildert erhalten und bewahrt die Aussage über seine Herrschaft auch über die Völker.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der höfisch-militärische Kontext bleibt erkennbar; unnötig altertümliche Formen werden vermieden. Die beiden adversativen Aussagen über Naamans militärische Stärke und seine Erkrankung werden bewusst spannungsvoll nebeneinandergestellt.
