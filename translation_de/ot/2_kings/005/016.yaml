  text: וַ/יֹּ֕אמֶר חַי יְהוָ֛ה אֲשֶׁר עָמַ֥דְתִּי לְ/פָנָ֖י/ו אִם אֶקָּ֑ח וַ/יִּפְצַר בּ֥/וֹ לָ/קַ֖חַת וַ/יְמָאֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: de
  text: 'Doch er sagte: »So wahr Jahwe lebt, vor dem ich stehe: Ich werde es nicht annehmen!«[a] Da drängte er ihn, es anzunehmen, doch er weigerte sich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schwurformel lautet wörtlich: »So wahr Jahwe lebt, vor dem ich stehe: Wenn ich nehme …« Das »wenn« drückt hier eine nachdrückliche Verneinung aus: »Ich werde es ganz gewiss nicht annehmen.« Das Objekt »es« ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Die feste hebräische Schwurformel wird mit einer natürlichen und feierlichen deutschen Entsprechung wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: vor dem ich stehe
  rationale: Die Formulierung bewahrt das Bild des Dieners oder Propheten, der in Gottes Gegenwart steht, ohne es auf »dem ich diene« festzulegen.
- source_word: אִם אֶקָּח
  choice: Ich nehme es nicht an
  rationale: אִם dient in dieser elliptischen Schwurformel als starke Verneinung. »Annehmen« bezeichnet im Deutschen natürlich die Annahme des angebotenen Geschenks.
- source_word: וַיִּפְצַר בּוֹ לָקַחַת
  choice: Da drängte er ihn, es anzunehmen
  rationale: פצר bezeichnet nachdrückliches Zureden; der ergänzte Objektbezug ergibt sich eindeutig aus dem Kontext.
- source_word: וַיְמָאֵן
  choice: doch er weigerte sich
  rationale: Die direkte Wiedergabe erhält den entschiedenen Charakter der Ablehnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen; »Jahwe« bewahrt diesen Namenscharakter.
- issue: Bedeutung von »vor ihm stehen«
  choice: vor dem ich stehe
  alternative: dem ich diene
  rationale: Die wörtlichere Formulierung bewahrt sowohl die Vorstellung von Gottes Gegenwart als auch den möglichen Dienstgedanken, ohne die Mehrdeutigkeit aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Schwurformel bleibt erhalten; zugleich werden der elliptische hebräische Eid und der aus dem Zusammenhang erschlossene Gegenstand durch eine Fußnote transparent gemacht.
