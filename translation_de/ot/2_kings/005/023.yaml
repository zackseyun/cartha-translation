base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: de
  text: 'Naaman sagte: „Bitte nimm zwei Talente!“ Er drängte ihn dazu und schnürte zwei Talente Silber[a] in zwei Beutel, zusammen mit zwei Garnituren Kleidung. Er gab sie zwei seiner Diener, und sie trugen sie vor ihm her.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine große antike Gewichtseinheit; hier ist eine entsprechende Menge Silber gemeint, keine Münze.
    reason: cultural_note
  - marker: b
    text: 'Wahrscheinlich: vor Gehasi her. Das hebräische Pronomen nennt die Person nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: Bitte nimm
  rationale: הוֹאֵל leitet hier eine höfliche, nachdrückliche Bitte vor dem Imperativ ein. „Bitte nimm“ ist im modernen Deutschen natürlich und bleibt nahe an der hebräischen Formulierung.
- source_word: כִּכָּרָיִם
  choice: zwei Talente
  rationale: כִּכָּר bezeichnet eine antike Gewichtseinheit. „Talent“ ist die etablierte deutsche Bibelbezeichnung; eine Fußnote erklärt, dass kein Geldstück gemeint ist.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Er drängte ihn dazu
  rationale: Die Wendung bezeichnet nachdrückliches Zureden beziehungsweise Drängen. Das Objekt bleibt wie im Hebräischen pronominal und bezieht sich im Zusammenhang auf Gehasi.
- source_word: וַיָּצַר
  choice: band … in zwei Beutel
  rationale: Das Verb bezeichnet das feste Verschnüren oder Verpacken. Mit den ausdrücklich genannten Beuteln gibt „band … in zwei Beutel“ die konkrete Handlung knapp wieder.
- source_word: חֲרִטִים
  choice: Beutel
  rationale: Das Wort bezeichnet Behälter für Geld oder Wertgegenstände. „Beutel“ ist sachlich, verständlich und weniger irreführend als „Geldbörsen“.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: zwei Sätze Kleidung
  rationale: Gemeint sind zwei vollständige Garnituren beziehungsweise Wechselkleider. „Sätze Kleidung“ ist in diesem historischen Zusammenhang verständlich und gibt die Mehrteiligkeit wieder.
- source_word: שְׁנֵי נְעָרָיו
  choice: zwei seiner Diener
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Hier tragen Naamans Untergebene die Last, weshalb „Diener“ ihre Funktion am klarsten ausdrückt.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: sie trugen es vor ihm her
  rationale: Die räumliche Wendung לְפָנָיו wird bewusst mit dem Pronomen wiedergegeben. Der Bezug auf Gehasi ist im Zusammenhang wahrscheinlich, doch die hebräische Form nennt ihn nicht ausdrücklich.
