base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: de
  text: 'Da sagte Naaman: »Wenn nicht, dann lass deinem Diener bitte so viel Erde gegeben werden, wie ein Maultierpaar tragen kann.[a] Denn dein Diener wird künftig keinen anderen Göttern mehr Brandopfer oder Schlachtopfer darbringen, sondern allein Jahwe.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »eine Traglast Erde für ein Maultierpaar«. Gemeint ist so viel Erde, wie zwei Maultiere tragen können.'
    reason: lexical_alternative
  - marker: b
    text: Warum Naaman Erde aus Israel mitnehmen möchte, sagt der Text nicht ausdrücklich. Die Bitte kann mit der antiken Verbindung einer Gottheit mit ihrem Land oder mit dem Wunsch zusammenhängen, Jahwe auf Erde aus Israel zu verehren.
    reason: cultural_note
lexical_decisions:
- source_word: וָלֹא
  choice: Wenn nicht, dann
  rationale: Die elliptische Wendung antwortet höflich auf Elisas Ablehnung des Geschenks im vorherigen Vers. Die bedingte Form gibt den Zusammenhang natürlicher wieder als ein wörtliches »und nicht«.
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: lass deinem Diener bitte … geben
  rationale: Die Form bewahrt den passiven Sinn und Naamans höfliche, unterwürfige Redeweise, ohne im Deutschen unnötig schwerfällig zu klingen.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: so viel Erde, wie ein Maultierpaar tragen kann
  rationale: מַשָּׂא bezeichnet eine Traglast, צֶמֶד ein Paar und אֲדָמָה die transportierte Erde. Die mengenmäßige Umschreibung ist klar und entspricht dem Sinn der hebräischen Wortgruppe.
- source_word: עֹלָה וָזֶבַח
  choice: Brandopfer oder Schlachtopfer
  rationale: Brandopfer ist die übliche präzise Wiedergabe von עֹלָה. Schlachtopfer gibt זֶבַח als Opfer wieder, bei dem ein Tier geschlachtet wird, und unterscheidet es vom Brandopfer.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: keinem anderen Gott mehr
  rationale: Im verneinten Satz ist der deutsche Singular distributiv und natürlich; er schließt die Verehrung sämtlicher anderer Götter aus, ohne deren Existenzfrage auszulegen.
- source_word: כִּי אִם לַיהוָה
  choice: sondern allein Jahwe
  rationale: כִּי אִם drückt einen ausschließenden Gegensatz aus. »Allein« macht die Exklusivität deutlich; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, während »der HERR« die traditionelle Ersatzlesung wäre.
- issue: Grund für Naamans Bitte um israelitische Erde
  choice: Im Haupttext nicht erklärt
  alternative: Ausdrückliche Deutung als Altarsockel oder als Bindung einer Gottheit an ihr Land
  rationale: Der Vers verbindet die Bitte mit Naamans künftig ausschließlicher Verehrung Jahwes, nennt aber das genaue Motiv nicht. Eine Festlegung im Haupttext würde die genuine Offenheit des Textes auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Naamans Selbstbezeichnung als »dein Diener« bleibt wegen ihrer höflichen und unterwürfigen Funktion erhalten. Die Satzstruktur wurde für gute Verständlichkeit leicht geglättet, ohne die passive Bitte, die Opferbegriffe oder die nicht erklärte Bedeutung der Erde zu beseitigen.
