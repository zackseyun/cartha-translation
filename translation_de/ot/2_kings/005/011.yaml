base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: de
  text: 'Doch Naaman wurde zornig und ging weg. Er sagte: „Ich hatte mir gedacht: Bestimmt wird er zu mir herauskommen, dastehen, den Namen Jahwes, seines Gottes, anrufen, seine Hand über die betroffene Stelle schwingen und den Aussätzigen heilen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Aussatz beseitigen“ beziehungsweise „die aussatzartige Hautkrankheit wegnehmen“. Das hebräische Verb bedeutet wörtlich „sammeln, wegnehmen“; das letzte Wort kann den Erkrankten oder das aussatzartige Leiden bezeichnen. Mit „Aussatz“ ist nicht zwingend die heute so genannte Lepra gemeint.'
    reason: Der hebräische Ausdruck ist lexikalisch und syntaktisch mehrdeutig und bezeichnet keine sicher bestimmbare moderne Krankheit.
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: wurde zornig
  rationale: קצף bezeichnet starken Zorn; die ingressiv formulierte Wendung gibt den Eintritt der Reaktion natürlich wieder, ohne die Intensität unnötig zu steigern.
- source_word: וַיֵּלַךְ
  choice: ging weg
  rationale: Im Kontext bezeichnet הלך Naamans verärgertes Fortgehen von Elisas Haus.
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: Ich hatte mir gedacht
  rationale: Die wörtliche Redewendung „siehe, ich sagte zu mir“ beschreibt Naamans vorherige innere Erwartung; im Deutschen gibt das Plusquamperfekt den zeitlichen Bezug und die natürliche Gedankenrede wieder.
- source_word: יֵצֵא יָצוֹא
  choice: Bestimmt wird er … herauskommen
  rationale: Der Infinitivus absolutus verstärkt die finite Verbform; „bestimmt“ bildet Naamans feste Erwartung idiomatisch ab.
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: den Namen Jahwes, seines Gottes, anrufen
  rationale: Die feste Verbindung קרא בשם bezeichnet hier die Anrufung der Gottheit; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: seine Hand über die betroffene Stelle schwingen
  rationale: הניף bezeichnet eine schwingende oder winkende Bewegung. „Betroffene Stelle“ verdeutlicht im Kontext, dass der erkrankte Körperbereich gemeint ist, während אֶל räumlich als Bewegung darüber hin verstanden wird.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: den Aussätzigen heilen
  rationale: אסף bedeutet grundsätzlich „sammeln, wegnehmen“ und hat hier die idiomatische Bedeutung, das Leiden zu beseitigen. הַמְּצֹרָע kann formal den betroffenen Menschen bezeichnen; die natürliche deutsche Wiedergabe ist daher „den Aussätzigen heilen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den Charakter als Eigenname.
- issue: Deutung von הַמְּצֹרָע
  choice: den Aussätzigen
  alternative: den Aussatz beziehungsweise die aussatzartige Hautkrankheit
  rationale: Die Form kann substantivisch den Erkrankten bezeichnen, während אסף in diesem Zusammenhang die Beseitigung seines Leidens meint. Die Fußnote bewahrt die mögliche sachbezogene Deutung und vermeidet eine eindeutige moderne Diagnose.
translation_notes:
  register: Moderne, würdige Erzählsprache. Naamans feste, beinahe inszeniert wirkende Erwartung bleibt in der Folge der Verben hörbar. „Aussätziger“ wahrt den vertrauten biblischen Ausdruck; die Fußnote begrenzt die mögliche medizinische Fehlinterpretation.
