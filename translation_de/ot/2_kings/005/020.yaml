revisions:
- from: 'Doch Gehasi, der Diener Elisas, des Mannes Gottes, sagte: »Sieh nur! Mein Herr hat Naaman, diesen Aramäer, geschont[a] und aus seiner Hand nicht angenommen, was er mitgebracht hatte. So wahr Jahwe lebt[b]: Ich werde ihm nachlaufen und etwas von ihm nehmen!«'
  to: 'Doch Gehasi, der Diener Elisas, des Mannes Gottes, sagte: »Sieh nur! Mein Herr hat Naaman, diesen Aramäer, dadurch geschont[a], dass er aus seiner Hand nicht annahm, was er mitgebracht hatte. So wahr Jahwe lebt[b]: Ich werde ihm nachlaufen und etwas von ihm nehmen!«'
  rationale: Die Revision beseitigt die im Deutschen holprige Koordination und macht ausdrücklich, dass Elisas Nichtannehmen der Gabe die Weise ist, in der er Naaman schonte. Die revidierte Fußnote formuliert die mögliche Nuance ohne syntaktische Unklarheit. Bedeutung, Register, Gottesname, historische Bezeichnung und die hervorgehobene Apposition bleiben erhalten.
