  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: de
  text: 'Doch Gehasi, der Diener Elisas, des Mannes Gottes, sagte: »Sieh nur! Mein Herr hat Naaman, diesen Aramäer, dadurch geschont[a], dass er aus seiner Hand nicht annahm, was er mitgebracht hatte. So wahr Jahwe lebt[b]: Ich werde ihm nachlaufen und etwas von ihm nehmen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat davon abgesehen, aus seiner Hand anzunehmen, was er mitgebracht hatte«.'
    reason: Das hebräische Verb kann das Schonen Nahamans oder, mit Blick auf die folgende Infinitivkonstruktion, Elisas Unterlassen des Annehmens hervorheben.
  - marker: b
    text: 'Hebräische Schwurformel, wörtlich: »Jahwe lebt!«'
    reason: Die Fußnote erläutert die kulturelle und sprachliche Form des feierlichen Eides.
lexical_decisions:
- source_word: נַעַר
  choice: Diener
  rationale: Das Wort kann einen jungen Mann oder Bediensteten bezeichnen. Hier steht Gehasis Funktion im Dienst Elisas im Vordergrund.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Die transparente Wiedergabe bewahrt den feststehenden prophetischen Titel.
- source_word: הִנֵּה
  choice: Sieh nur!
  rationale: Die Formulierung gibt den nachdrücklichen, Aufmerksamkeit heischenden Gesprächseinsatz in natürlichem modernem Deutsch wieder.
- source_word: חָשַׂךְ
  choice: geschont
  rationale: Im Zusammenhang mit dem folgenden Infinitiv besagt das Verb, dass Elisa Naaman die Abgabe ersparte, indem er das Mitgebrachte nicht annahm. Eine mögliche wörtlichere Nuance wird in der Fußnote bewahrt.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Gemeint ist Gehasis menschlicher Vorgesetzter Elisa. „Mein Herr“ wahrt das damalige Dienstverhältnis, ohne einen Gottesbezug anzudeuten.
- source_word: הָאֲרַמִּי הַזֶּה
  choice: diesen Aramäer
  rationale: „Aramäer“ entspricht der historischen Bezeichnung genauer als „Syrer“; das Demonstrativpronomen und sein möglicherweise abschätziger Ton bleiben erhalten.
- source_word: מִקַּחַת מִיָּדוֹ
  choice: aus seiner Hand nicht angenommen
  rationale: Die körpernahe hebräische Wendung „aus seiner Hand“ wird bewahrt, während „angenommen“ den Empfang der angebotenen Gaben im Deutschen natürlich bezeichnet.
- source_word: אֵת אֲשֶׁר הֵבִיא
  choice: was er mitgebracht hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Naaman die Gaben zuvor mitgebracht hatte.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Dies ist die geläufige deutsche Wiedergabe der hebräischen Schwurformel und bewahrt zugleich den Gottesnamen.
- source_word: רַצְתִּי אַחֲרָיו
  choice: Ich werde ihm nachlaufen
  rationale: Der Verbzusammenhang nach der Schwurformel drückt Gehasis unmittelbar gefassten Entschluss aus; „nachlaufen“ bewahrt die konkrete Bewegung.
- source_word: וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  choice: und etwas von ihm nehmen
  rationale: מְאוּמָה bezeichnet hier kontextgemäß eine nicht näher bestimmte Gabe, die Gehasi erhalten will.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kraft der Schwurformel חַי־יְהוָה כִּי אִם
  choice: 'So wahr Jahwe lebt: Ich werde …'
  alternative: Jahwe lebt! Gewiss werde ich …
  rationale: Die gewählte Form macht den feierlichen Eid und den dadurch bekräftigten Entschluss deutlich, ohne über Gehasis missbräuchliche Verwendung des Gottesnamens hinaus eine theologische Bewertung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh nur!“ vermittelt den Nachdruck von הִנֵּה ohne archaisches „Siehe“. Die Apposition „Naaman, diesen Aramäer“ bewahrt die auffällige Hervorhebung des Ausgangstextes und lässt dessen möglicherweise abschätzigen Ton bestehen. Die direkte Rede klingt entschlossen und selbstrechtfertigend, ohne Gehasis Motiv zusätzlich auszudeuten.
