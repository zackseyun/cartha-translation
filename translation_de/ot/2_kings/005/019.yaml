  text: וַ/יֹּ֥אמֶר ל֖/וֹ לֵ֣ךְ לְ/שָׁל֑וֹם וַ/יֵּ֥לֶךְ מֵ/אִתּ֖/וֹ כִּבְרַת אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/019.yaml
  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: de
  text: 'Und er sagte zu ihm: »Geh in Frieden!« Dann ging er von ihm fort, eine Strecke weit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »eine Strecke Landes«. Der hebräische Ausdruck bezeichnet eine Wegstrecke, ohne ihre genaue Länge anzugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: Und er sagte zu ihm
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; das Pronomen bezieht sich im Kontext auf Naaman. Die schlichte Wiedergabe bleibt nahe am hebräischen Erzählstil.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Geh in Frieden!
  rationale: Die Verbindung ist eine geläufige Segens- und Abschiedsformel. Sie bewahrt sowohl den Sinn von שָׁלוֹם als auch die Kürze des Hebräischen.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: Dann ging er von ihm fort
  rationale: Die Form setzt die Handlungsfolge fort. »von ihm fortgehen« gibt das Verlassen von Elisas Gegenwart natürlich und eindeutig wieder.
- source_word: כִּבְרַת אָרֶץ
  choice: eine Strecke weit
  rationale: Der Ausdruck bezeichnet eine zurückgelegte Wegstrecke, ohne ein genaues Maß anzugeben. Die deutsche Formulierung vermeidet es, die Entfernung als ausdrücklich kurz oder beträchtlich festzulegen.
theological_decisions:
- issue: Elisas Antwort auf Naamans vorausgehende Bitte im Zusammenhang mit dem Haus Rimmons
  choice: Die Formel wird ohne erläuternden Zusatz als »Geh in Frieden!« wiedergegeben.
  alternative: Die Worte als ausdrückliche Billigung von Naamans angekündigtem Verhalten oder als rein höfliche, ethisch bedeutungslose Entlassung auslegen.
  rationale: Der hebräische Text enthält lediglich die knappe Segens- und Abschiedsformel. Die Übersetzung bewahrt die theologische Spannung und fügt weder Zustimmung noch Verurteilung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählführung. Die direkte Rede bleibt bewusst kurz; die unbestimmte Entfernungsangabe wird nicht überpräzisiert.
