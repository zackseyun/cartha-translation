  source_fidelity: Die Übersetzung gibt die Abfolge der hebräischen Wayyiqtol-Formen angemessen wieder. »Geh in Frieden!« entspricht der Abschieds- und Segensformel לֵךְ לְשָׁלוֹם, ohne ihre ethische oder theologische Reichweite auszudeuten. »Dann ging er von ihm fort, eine Strecke weit« gibt מֵאִתּוֹ כִּבְרַת אָרֶץ idiomatisch und ohne unzulässige Präzisierung der Distanz wieder.
  naturalness: Modernes, gut lesbares Standarddeutsch. Die knappe Erzählweise und der würdige Registerton passen zum Kontext. »eine Strecke weit« ist natürlich und bewahrt die Unbestimmtheit der hebräischen Distanzangabe.
  terminology: Die Personenpronomina sind im Kontext eindeutig (Elisa und Naaman). »Frieden« ist für שָׁלוֹם in dieser formelhaften Verabschiedung passend. Der Fußnotentext erklärt den Ausdruck sachlich und ohne eine genaue Maßeinheit oder eine strittige Deutung zu behaupten.
