id: 2KI.5.12
reference: 2 Kings 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: de
  text: Sind nicht Abana und Parpar[a], die Flüsse von Damaskus, besser als alle Gewässer Israels? Könnte ich mich nicht in ihnen waschen und rein werden?[b] Da wandte er sich ab und ging voller Zorn davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Abana wird nach einer anderen überlieferten Namensform auch »Amana« wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und gereinigt werden«. Das Hebräische kann sowohl körperliche Heilung beziehungsweise Reinigung als auch einen weiter gefassten Zustand der Reinheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Sind nicht / Könnte ich nicht
  rationale: Die Fragepartikel erwartet jeweils eine bejahende Antwort und wird in beiden rhetorischen Fragen idiomatisch wiedergegeben.
- source_word: טוֹב ... מִכֹּל
  choice: besser als alle
  rationale: Die Vergleichskonstruktion verlangt im Deutschen den Komparativ.
- source_word: אבנה
  choice: Abana
  rationale: Der Gewässername wird entsprechend der masoretischen Form transliteriert; die traditionelle Variante »Amana« steht in der Fußnote.
- source_word: וּפַרְפַּר
  choice: und Parpar
  rationale: Nahe Transliteration des hebräischen Eigennamens in deutscher Schreibweise.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: die Flüsse von Damaskus
  rationale: Natürliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: als alle Gewässer Israels
  rationale: Bewahrt den umfassenden Ausdruck und gibt מַיִם breiter mit »Gewässer« statt erneut mit »Flüsse« wieder.
- source_word: אֶרְחַץ בָּהֶם
  choice: mich in ihnen waschen
  rationale: רחץ bezeichnet Waschen oder Baden; die reflexive deutsche Form passt zum Zusammenhang und greift Elisas Anweisung auf.
- source_word: וְטָהָרְתִּי
  choice: und rein werden
  rationale: Bewahrt die mögliche körperliche und kultische Bedeutungsbreite von טהר, ohne sie einseitig festzulegen.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: Da wandte er sich ab und ging ... davon
  rationale: Gibt beide aufeinanderfolgenden Bewegungsverben natürlich wieder und macht die Abwendung im Kontext deutlich.
- source_word: בְּחֵמָה
  choice: voller Zorn
  rationale: Drückt die starke Erregung von חֵמָה würdig und in heutigem Standarddeutsch aus.
theological_decisions:
- issue: Bedeutungsumfang der Reinigungssprache
  choice: rein werden
  alternative: gereinigt werden
  rationale: Der Zusammenhang betrifft Naamans Hautkrankheit, doch טהר kann zugleich körperliche und kultische Reinheit bezeichnen. »Rein werden« erhält diese Spannung, ohne die Aussage stärker zu theologisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen bleiben erhalten; die Flussnamen werden textnah transliteriert. »Voller Zorn« vermittelt die Intensität, ohne unnötig umgangssprachlich zu wirken.
