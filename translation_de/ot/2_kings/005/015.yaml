  text: וַ/יָּשָׁב֩ אֶל אִ֨ישׁ הָ/אֱלֹהִ֜ים ה֣וּא וְ/כָֽל מַחֲנֵ֗/הוּ וַ/יָּבֹא֮ וַ/יַּעֲמֹ֣ד לְ/פָנָי/ו֒ וַ/יֹּ֗אמֶר הִנֵּה נָ֤א יָדַ֨עְתִּי֙ כִּ֣י אֵ֤ין אֱלֹהִים֙ בְּ/כָל הָ/אָ֔רֶץ כִּ֖י אִם בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּ֛ה קַח נָ֥א בְרָכָ֖ה מֵ/אֵ֥ת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: de
  text: 'Dann kehrte er mit seinem ganzen Gefolge zu dem Mann Gottes zurück. Er kam, trat vor ihn hin und sagte: »Jetzt weiß ich: Auf der ganzen Erde gibt es keinen Gott außer in Israel. Und nun nimm bitte ein Geschenk[a] von deinem Diener an.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: einen Segen. Das hebräische Wort bezeichnet hier ein Geschenk oder eine Gabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Bewahrt den festen hebräischen Titel und seine literarische Prägung, ohne ihn durch die erklärende Wiedergabe »Prophet Gottes« einzuengen.
- source_word: מַחֲנֵהוּ
  choice: sein ganzes Gefolge
  rationale: Wörtlich bezeichnet das Wort sein »Lager«; hier meint es jedoch die ihn begleitende Gruppe. »Gefolge« ist im Deutschen natürlich und dem erzählerischen Zusammenhang angemessen.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: Er trat vor ihn hin
  rationale: Gibt die konventionelle Wendung für das Erscheinen und Stehen vor einer Person natürlich wieder.
- source_word: הִנֵּה נָא יָדַעְתִּי
  choice: Jetzt weiß ich
  rationale: Drückt die nachdrückliche, neu gewonnene Erkenntnis idiomatisch aus; ein eigenständiges »Siehe doch« wäre im heutigen Deutschen unnötig schwerfällig.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: Auf der ganzen Erde gibt es keinen Gott außer in Israel
  rationale: Bewahrt sowohl die umfassende Aussage als auch die ungewöhnliche örtliche Formulierung »in Israel«, ohne sie zu »außer dem Gott Israels« zu erweitern.
- source_word: קַח נָא בְרָכָה
  choice: nimm bitte ein Geschenk an
  rationale: Das Verb bezeichnet hier das Annehmen, und בְרָכָה wird im Kontext einer Gabe idiomatisch als »Geschenk« verstanden. Die wörtlichere Bedeutung steht in der Fußnote.
- source_word: עַבְדֶּךָ
  choice: deinem Diener
  rationale: Hier handelt es sich um eine ehrerbietige Selbstbezeichnung, nicht um die Hervorhebung eines rechtlichen Sklavenstatus.
theological_decisions:
- issue: Naamans Bekenntnis, dass es keinen Gott außer in Israel gibt
  choice: Als uneingeschränktes Bekenntnis zur Einzigkeit Gottes wiedergegeben, wobei die Ortsangabe »in Israel« erhalten bleibt.
  alternative: »Es gibt keinen Gott außer dem Gott Israels« oder »keinen anderen Gott als den in Israel«
  rationale: Der hebräische Wortlaut formuliert stark und ausdrücklich »keinen Gott ... außer in Israel«. Die Übersetzung soll diese Spannung bewahren und weder abschwächen noch durch eine systematisierende Ergänzung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und feierlich, ohne archaische Aufmerksamkeitspartikel. Die Abfolge der hebräischen Erzählverben wurde in natürliche deutsche Sätze gegliedert.
