source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו אֱלִישָׁ֖ע מַלְאָ֣ךְ לֵ/אמֹ֑ר הָל֗וֹךְ וְ/רָחַצְתָּ֤ שֶֽׁבַע פְּעָמִים֙ בַּ/יַּרְדֵּ֔ן וְ/יָשֹׁ֧ב בְּשָׂרְ/ךָ֛ לְ/ךָ֖ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: de
  text: 'Da schickte Elisa einen Boten zu ihm und ließ ihm sagen: »Geh und wasch dich siebenmal im Jordan! Dann wird dein Fleisch wiederhergestellt werden[a], und du wirst rein sein[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Dann wird dein Fleisch zu dir zurückkehren.« Gemeint ist die Wiederherstellung des früheren gesunden Zustands.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »und du wirst gereinigt sein.« Das hebräische Verb kann körperliches wie auch kultisches Reinwerden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו אֱלִישָׁע מַלְאָךְ
  choice: Da schickte Elisa einen Boten zu ihm
  rationale: Die erzählende Verbfolge wird mit „Da“ natürlich fortgeführt. מַלְאָךְ bezeichnet hier eindeutig einen menschlichen Boten.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Die deutsche Konstruktion gibt die hebräische Redeeinleitung idiomatisch wieder und macht deutlich, dass der Bote Elisas Worte übermittelt.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: Geh und wasch dich
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb hat auffordernde Kraft; die reflexive deutsche Form ist hier natürlich.
- source_word: שֶׁבַע פְּעָמִים בַּיַּרְדֵּן
  choice: siebenmal im Jordan
  rationale: Dies entspricht der schlichten Zahlenangabe und dem als Gewässernamen gebrauchten Eigennamen.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: Dann wird dein Fleisch dir wiederhergestellt werden
  rationale: „Fleisch“ bewahrt die konkrete Körperbezeichnung בָּשָׂר; „wiederhergestellt“ gibt den idiomatischen Sinn von שׁוב wieder, während „dir“ das לְךָ abbildet.
- source_word: וּטְהָר
  choice: und du wirst rein sein
  rationale: Die Form bezeichnet das Reinwerden beziehungsweise Reinsein und lässt sowohl die körperliche als auch die kultische Bedeutungsnähe bestehen.
theological_decisions:
- issue: Konkrete Körperbezeichnung בָּשָׂר
  choice: Fleisch
  alternative: Körper; Haut
  rationale: „Fleisch“ bleibt eng am hebräischen Wortlaut. „Haut“ wäre im Krankheitskontext verständlich, würde die Bedeutung jedoch unnötig verengen.
- issue: Bedeutungsumfang von טהר
  choice: du wirst rein sein
  alternative: du wirst gereinigt sein; du wirst gesund sein
  rationale: „Rein“ bewahrt die Spannung zwischen körperlicher Heilung und Reinheitssprache; „gesund“ würde den möglichen kultischen Beiklang beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Befehl ist direkt und verständlich formuliert; die konkrete Rede von „Fleisch“ und die mehrdeutige Reinheitssprache bleiben erhalten.
