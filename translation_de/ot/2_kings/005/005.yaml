base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: de
  text: 'Da sagte der König von Aram: »Geh nur! Ich werde dem König von Israel einen Brief schicken.« Da ging er und nahm zehn Talente Silber, sechstausend Goldstücke[a] und zehn Garnituren Kleidung mit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sechstausend Gold«; welche Einheit gezählt wird, sagt der hebräische Text nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: Geh nur!
  rationale: Die beiden Imperative bilden hier wahrscheinlich eine idiomatische Aufforderung beziehungsweise bereitwillige Erlaubnis. »Geh nur!« gibt dies in natürlichem Deutsch wieder, ohne das im Deutschen missverständliche wörtliche »Geh, komm« zu übernehmen.
- source_word: סֵפֶר
  choice: einen Brief
  rationale: Im diplomatischen Zusammenhang bezeichnet das Wort eine schriftliche Mitteilung von einem König an einen anderen.
- source_word: בְּיָדוֹ
  choice: mit
  rationale: Wörtlich heißt die Wendung »in seiner Hand«; hier bezeichnet sie idiomatisch das Mitführen beziehungsweise den Besitz der genannten Gaben.
- source_word: כִּכְּרֵי כֶסֶף
  choice: Talente Silber
  rationale: כִּכָּר ist eine antike Gewichtseinheit. Die Beibehaltung als »Talent« vermeidet eine unsichere moderne Umrechnung.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: sechstausend Goldstücke
  rationale: Der hebräische Text nennt wörtlich »sechstausend Gold«, ohne die gezählte Einheit ausdrücklich anzugeben. »Goldstücke« ist eine lesbare, bewusst unspezifische Ergänzung.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: Festgewänder
  rationale: Die Wendung bezeichnet vollständige Wechselkleider beziehungsweise wertvolle Kleidungsstücke, wie sie als Geschenke überreicht wurden. »Festgewänder« vermittelt ihren Geschenk- und Wertcharakter knapp und natürlich.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: Der hebräische Eigenname אֲרָם wird als »Aram« wiedergegeben und nicht durch die traditionelle Bezeichnung »Syrien« ersetzt.
