  text: וַ/יֵּ֗רֶד וַ/יִּטְבֹּ֤ל בַּ/יַּרְדֵּן֙ שֶׁ֣בַע פְּעָמִ֔ים כִּ/דְבַ֖ר אִ֣ישׁ הָ/אֱלֹהִ֑ים וַ/יָּ֣שָׁב בְּשָׂר֗/וֹ כִּ/בְשַׂ֛ר נַ֥עַר קָטֹ֖ן וַ/יִּטְהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: de
  text: Er stieg hinab und tauchte sich siebenmal im Jordan unter[a], nach dem Wort des Mannes Gottes. Sein Fleisch wurde wieder wie das Fleisch eines kleinen Jungen, und er wurde rein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: tauchte siebenmal in den Jordan ein. Das hebräische Verb kann ein Eintauchen oder Untertauchen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: er wurde gereinigt. Das Hebräische kann sowohl das Reinwerden als auch das Ergebnis der Reinigung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Da stieg er hinab
  rationale: Das narrative וַ führt die Handlung fort und zeigt zugleich Naamans Reaktion auf die vorausgehende Anweisung. „stieg … hinab“ bewahrt die konkrete Bewegungsrichtung von ירד.
- source_word: וַיִּטְבֹּל
  choice: tauchte … unter
  rationale: טבל bezeichnet das Eintauchen oder Untertauchen. Die Formulierung ist im Deutschen natürlich und lässt offen, wie genau die Handlung vollzogen wurde.
- source_word: בַּיַּרְדֵּן
  choice: im Jordan
  rationale: Die übliche deutsche Bezeichnung des Flusses benötigt hier keinen Zusatz wie „Fluss“.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Dies ist die natürliche deutsche Wiedergabe der wiederholten Handlung.
- source_word: כִּדְבַר אִישׁ הָאֱלֹהִים
  choice: wie der Mann Gottes gesagt hatte
  rationale: Die idiomatische Wendung gibt die Übereinstimmung mit dem gesprochenen Wort wieder, ohne דָּבָר unnötig auf einen formellen Befehl festzulegen. „Mann Gottes“ bewahrt den prophetischen Titel.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: Da wurde sein Fleisch wieder
  rationale: שׁוב trägt hier den Gedanken der Rückkehr beziehungsweise Wiederherstellung. „Fleisch“ bildet בשר konkret ab und vermeidet eine vorschnelle Einengung auf „Haut“.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: wie das Fleisch eines kleinen Jungen
  rationale: Die Wiedergabe bewahrt sowohl die Wiederholung von בשר als auch das anschauliche Bild von נער קטן.
- source_word: וַיִּטְהָר
  choice: und er wurde rein
  rationale: Das Qal von טהר bezeichnet hier das Reinwerden beziehungsweise den erreichten Zustand der Reinheit. „wurde rein“ bewahrt den resultativen Vorgang und die biblische Reinheitssprache.
theological_decisions:
- issue: Art von Naamans Wiederherstellung
  choice: Körperliche Wiederherstellung und Reinwerden werden nebeneinander wiedergegeben.
  alternative: Den Vorgang ausschließlich medizinisch als „Heilung“ oder ausschließlich kultisch als „Reinigung“ bezeichnen.
  rationale: Der hebräische Text verbindet die Wiederherstellung des Fleisches mit dem Reinwerden. Die Übersetzung erhält beide Dimensionen, ohne eine sakramentale, typologische oder rein medizinische Deutung einzutragen.
- issue: Bedeutung von טהר
  choice: „er wurde rein“
  alternative: „er wurde gereinigt“
  rationale: Die gewählte Form wahrt den inchoativ-resultativen Sinn des Verbs und lässt offen, ob der Akzent stärker auf dem Vorgang oder dem erreichten Zustand liegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt erzählerisch klar; „Mann Gottes“, „Fleisch“ und „rein“ bewahren die konkrete und theologisch offene Ausdrucksweise des hebräischen Textes.
