base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: de
  text: 'Da traten seine Diener zu ihm, redeten mit ihm und sagten: „Mein Vater, wenn der Prophet dir etwas Großes aufgetragen hätte, hättest du es nicht getan? Wie viel mehr, wenn er dir sagt: Wasch dich und werde rein[a]!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische kann hier sowohl körperliche als auch kultische Reinheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: traten … zu ihm
  rationale: Gibt das Herantreten sowohl räumlich als auch sozial angemessen und in natürlichem deutschem Erzählstil wieder.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד kann Diener oder Sklave bezeichnen; hier passt „Diener“ für Naamans respektvoll auftretende Untergebene, ohne ihren genauen Rechtsstatus festzulegen.
- source_word: אָבִי
  choice: Mein Vater
  rationale: Bewahrt die respektvolle, bildhafte Anrede eines Untergebenen an einen Höhergestellten, ohne sie zu „mein Herr“ zu verflachen.
- source_word: דָּבָר גָּדוֹל … דִּבֶּר אֵלֶיךָ
  choice: etwas Großes von dir verlangt hätte
  rationale: Im Kontext bezeichnet die Wendung eine große oder anspruchsvolle Aufgabe. „Verlangt“ macht den Sinn des prophetischen Redens hier idiomatisch deutlich.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: hättest du es nicht getan?
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: וְאַף כִּי
  choice: Wie viel mehr solltest du es tun
  rationale: Bringt den Schluss vom Größeren auf das Geringere im heutigen Deutsch klar zum Ausdruck.
- source_word: רְחַץ
  choice: Wasch dich
  rationale: Direkte und kontextgerechte Wiedergabe des Imperativs.
- source_word: וּטְהָר
  choice: dann wirst du rein
  rationale: Das Verb kann das Reinwerden beziehungsweise Gereinigtwerden bezeichnen. Die resultative Formulierung ist im Deutschen natürlich und bewahrt die körperliche wie auch die Reinheitsnuance.
theological_decisions:
- issue: Bedeutungsnuance von טהר bei Naamans Heilung
  choice: dann wirst du rein
  alternative: und lass dich reinigen / und werde rein
  rationale: „Rein werden“ lässt sowohl die Heilung von der Hautkrankheit als auch den Reinheitsaspekt anklingen, ohne eine spätere theologische Deutung einzutragen. Die mögliche passive Nuance wird in der Fußnote erhalten.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die respektvolle Anrede „Mein Vater“ bleibt als bewusst fremdartige, aber verständliche Metapher erhalten. Der Satzbau verdeutlicht Naamans Dienern zugeschriebenen Schluss vom Schwierigen auf die einfache Aufforderung.
