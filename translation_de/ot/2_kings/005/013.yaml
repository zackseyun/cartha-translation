review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Handlung, die respektvolle Anrede und die rhetorische Argumentation insgesamt zutreffend wieder. In der zweiten Frage fügt „solltest du es tun“ jedoch ein im Hebräischen nicht ausgedrücktes Objekt und eine modal-normative Nuance ein. Die knappe Vergleichsformel kann im Deutschen besser erhalten werden.
  naturalness: „Wie viel mehr solltest du es tun, da er ... gesagt hat“ klingt im modernen Deutsch schwerfällig und ist durch das unklare „es“ weniger präzise. „Wie viel mehr, wenn er dir sagt ...“ ist idiomatisch und bildet die rhetorische Ellipse klar ab.
  terminology: „Diener“, „Mein Vater“, „Prophet“ und „rein“ sind angemessen. Für וּטְהָר ist „werde rein“ als Imperativ genauer als die futurische Paraphrase „dann wirst du rein“. Die bisherige Fußnotenalternative „dann wirst du gereinigt“ legt zudem eine passive Form nahe, die der hebräischen Imperativform nicht entspricht.
  issues:
  - severity: medium
    issue: Die Wendung „Wie viel mehr solltest du es tun“ ergänzt ein unbestimmtes „es“ und ein „solltest“, das im Ausgangstext nicht steht.
    rationale: וְאַף כִּי leitet hier den Schluss vom größeren zum geringeren Fall ein; die Aussage kann im Deutschen elliptisch bei der anschließenden Aufforderung bleiben.
  - severity: medium
    issue: „dann wirst du rein“ gibt den abschließenden hebräischen Imperativ nicht direkt wieder.
    rationale: רְחַץ וּטְהָר besteht aus zwei Imperativen. „Wasch dich und werde rein“ wahrt Form, Parallelismus und Resultat besser.
  - severity: medium
    issue: Die Fußnote behauptet eine passive Alternative („wirst du gereinigt“).
    rationale: Die vorliegende hebräische Form ist kein Passiv. Die Reinheitsnuance kann ohne eine irreführende Passivparaphrase erläutert werden.
