revisions:
- from: 'Da traten seine Diener zu ihm, redeten mit ihm und sagten: „Mein Vater, wenn der Prophet etwas Großes von dir verlangt hätte, hättest du es nicht getan? Wie viel mehr solltest du es tun, da er zu dir gesagt hat: Wasch dich, dann wirst du rein[a]!“'
  to: 'Da traten seine Diener zu ihm, redeten mit ihm und sagten: „Mein Vater, wenn der Prophet dir etwas Großes aufgetragen hätte, hättest du es nicht getan? Wie viel mehr, wenn er dir sagt: Wasch dich und werde rein[a]!“'
  rationale: Die Revision stellt die beiden hebräischen Imperative unmittelbar als „Wasch dich und werde rein“ dar und formuliert die Schlussfolgerung der Diener ohne zusätzliches, semantisch unscharfes „es tun“. „Aufgetragen“ gibt im Kontext den Inhalt des prophetischen Redens natürlich wieder, ohne den Wortlaut unnötig zu verengen. Die Fußnote bewahrt die relevante Reinheitsnuance, ohne fälschlich eine passive Verbform als Alternative auszugeben.
