source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: de
  text: 'Als Elisa, der Mann Gottes, hörte, dass der König von Israel seine Kleider zerrissen hatte, schickte er dem König die Botschaft: „Warum hast du deine Kleider zerrissen? Er soll doch zu mir kommen[a]; dann wird er erkennen, dass es in Israel einen Propheten gibt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Er“ ist Naaman gemeint, nicht der König von Israel.
    reason: Der hebräische Text nennt das Subjekt des Verbs nicht ausdrücklich; aus dem Zusammenhang ergibt sich der Bezug auf Naaman.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als ... hörte
  rationale: Die hebräische Erzählungsformel leitet den nächsten Vorgang ein. Die temporale Konstruktion „Als ... hörte“ gibt sie im modernen Deutschen natürlich wieder, ohne ein nicht ausdrücklich vorhandenes „Nun“ einzufügen.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Im Deutschen übliche biblische Namensform.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die Wendung ist eine feste prophetische Bezeichnung und wird transparent sowie traditionsübergreifend wiedergegeben.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: seine Kleider zerrissen hatte
  rationale: קָרַע bedeutet „zerreißen“. Das Plusquamperfekt verdeutlicht, dass die Handlung dem Hören Elisas vorausging; „Kleider“ ist würdig und allgemein verständlich.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: schickte er dem König die Botschaft
  rationale: Das Hebräische sagt wörtlich, dass Elisa „zum König sandte, indem er sprach“. Die deutsche Formulierung macht idiomatisch deutlich, dass eine Nachricht übermittelt wurde, ohne einen ausdrücklich genannten Boten hinzuzufügen.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: Warum hast du deine Kleider zerrissen?
  rationale: Die direkte Frage wird eng am Wortlaut und in natürlichem modernem Deutsch wiedergegeben.
- source_word: יָבֹא נָא אֵלַי
  choice: Er soll doch zu mir kommen
  rationale: Die dritte Person Singular bleibt erhalten und bezieht sich im Zusammenhang auf Naaman. „doch“ gibt die höflich auffordernde beziehungsweise nachdrückliche Nuance von נָא natürlich wieder.
- source_word: וְיֵדַע
  choice: dann wird er erkennen
  rationale: Der hebräische Imperfekt bezeichnet hier die erwartete Folge. „Dann“ macht den Folgezusammenhang im Deutschen klar, ohne ihn als ausschließliche Zweckangabe festzulegen.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: dass es in Israel einen Propheten gibt
  rationale: יֵשׁ ist eine Existenzpartikel; die gewählte Form gibt den Satz klar und unmittelbar wieder.
theological_decisions:
- issue: Prophetischer Titel אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  alternative: der Gottesmann; der zu Gott gehörende Mann
  rationale: „Mann Gottes“ bewahrt die Funktion als prophetische Amts- und Ehrenbezeichnung, statt die Wendung lediglich als Aussage über Elisas Frömmigkeit zu deuten.
- issue: Subjekt von יָבֹא und וְיֵדַע
  choice: Beide Formen werden auf Naaman bezogen.
  alternative: Der König soll zu Elisa kommen und erkennen.
  rationale: Die Verben stehen zwar ohne ausdrücklich genanntes Subjekt, doch der Erzählzusammenhang legt Naaman als denjenigen nahe, der zu Elisa kommen und dadurch erkennen soll, dass es in Israel einen Propheten gibt. Eine Fußnote verhindert ein mögliches Missverständnis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, wird aber idiomatisch geglättet. Die Wiederholung von „Kleider zerrissen“ und die prophetische Titelbezeichnung bleiben bewusst erhalten.
