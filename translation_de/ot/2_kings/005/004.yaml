  terminology: »Herr« bildet אָדוֹן im höfisch-hierarchischen Kontext angemessen ab und vermeidet eine unzulässige weitergehende Festlegung. »Mädchen« ist für נַעֲרָה sachgerecht. Die Fußnote erklärt die idiomatische Funktion präzise und ist korrekt an der betreffenden Wendung verankert.
