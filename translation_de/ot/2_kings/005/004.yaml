source:
  edition: WLC
  text: וַ/יָּבֹ֕א וַ/יַּגֵּ֥ד לַ/אדֹנָ֖י/ו לֵ/אמֹ֑ר כָּ/זֹ֤את וְ/כָ/זֹאת֙ דִּבְּרָ֣ה הַֽ/נַּעֲרָ֔ה אֲשֶׁ֖ר מֵ/אֶ֥רֶץ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/004.yaml
  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: de
  text: 'Da ging er hinein und berichtete seinem Herrn: »So und so[a] hat das Mädchen aus dem Land Israel gesprochen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »So und so«. Die hebräische Redewendung fasst zusammen, was sie sagte, ohne ihre Worte vollständig zu wiederholen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da ging er hinein
  rationale: בוא kann je nach Perspektive »kommen«, »gehen« oder »hineingehen« bedeuten. Hier passt »ging … hinein« zum anschließenden Bericht an den Herrn und bewahrt die Erzählfolge.
- source_word: וַיַּגֵּד
  choice: berichtete
  rationale: נגד im Hifil bedeutet »mitteilen, berichten, kundtun«. »Berichtete« gibt die förmliche Meldung in diesem Zusammenhang natürlich wieder.
- source_word: לַאדֹנָיו
  choice: seinem Herrn
  rationale: אָדוֹן bezeichnet einen Herrn oder Vorgesetzten. »Seinem Herrn« ist im höfischen Zusammenhang angemessen und lässt die genaue soziale Beziehung offen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel für direkte Rede wird im natürlichen modernen Deutsch durch einen Doppelpunkt wiedergegeben, ohne ihren Sinn zu verlieren.
- source_word: כָּזֹאת וְכָזֹאת
  choice: So und so
  rationale: Die feste Wendung fasst eine Äußerung zusammen, ohne sie wörtlich zu wiederholen. »So und so« ist im Deutschen idiomatisch und nah an der hebräischen Form.
- source_word: דִּבְּרָה
  choice: hat … gesprochen
  rationale: דבר ist das gewöhnliche Verb für »sprechen«. Das Perfekt ist in der deutschen direkten Rede natürlich.
- source_word: הַנַּעֲרָה
  choice: das Mädchen
  rationale: נַעֲרָה kann ein Mädchen oder eine junge Frau bezeichnen. Da der Ausdruck an dieser Stelle den Dienststatus nicht ausdrücklich nennt, wird er nicht als »Dienerin« präzisiert.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: aus dem Land Israel
  rationale: Die Herkunftsangabe wird knapp und natürlich wiedergegeben; »Land« bildet אֶרֶץ ausdrücklich ab.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von וַיָּבֹא וַיַּגֵּד
  choice: er
  alternative: Naaman oder eine andere ausdrücklich benannte Person
  rationale: Die hebräischen Verbformen markieren ein männliches Singularsubjekt, nennen es in diesem Vers aber nicht beim Namen. Die Übersetzung bewahrt diese Offenheit und identifiziert den Handelnden nicht zusätzlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise und die nicht ausdrücklich geklärte Identität des männlichen Subjekts bleiben erhalten; die direkte Rede klingt bewusst wie eine zusammenfassende Meldung.
