  source_fidelity: Der Text gibt die Erzählfolge (וַיָּבֹא), den Bericht an den Vorgesetzten (וַיַּגֵּד לַאדֹנָיו) und die einleitende Redefunktion von לֵאמֹר zuverlässig wieder. »So und so« bewahrt die absichtlich ungenaue hebräische Zusammenfassungsformel כָּזֹאת וְכָזֹאת. »Das Mädchen aus dem Land Israel« entspricht הַנַּעֲרָה אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל, ohne den im Vers nicht wiederholten Dienststatus hinzuzufügen.
