  text: וַ/תֹּ֨אמֶר֙ אֶל גְּבִרְתָּ֔/הּ אַחֲלֵ֣י אֲדֹנִ֔/י לִ/פְנֵ֥י הַ/נָּבִ֖יא אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן אָ֛ז יֶאֱסֹ֥ף אֹת֖/וֹ מִ/צָּרַעְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: de
  text: 'Sie sagte zu ihrer Herrin: „Wenn mein Herr doch bei dem Propheten wäre, der in Samaria ist! Dann würde er ihn von seinem Aussatz[a] heilen.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Aussatz“ übersetzte hebräische Wort kann verschiedene schwere Hautkrankheiten bezeichnen und meint nicht zwingend die heutige Hansen-Krankheit (Lepra).
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier ein Verb mit der Grundbedeutung „sammeln“ oder „aufnehmen“; in Verbindung mit einer Krankheit bedeutet es, jemanden davon zu befreien beziehungsweise ihn zu heilen.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: ihrer Herrin
  rationale: Bezeichnet die ranghöhere Frau im Haushalt; „Herrin“ gibt das soziale Verhältnis im Deutschen klar und würdig wieder.
- source_word: אַחֲלֵי
  choice: Wenn … doch
  rationale: Die geläufige deutsche Wunschform bewahrt den sehnsüchtigen, optativischen Sinn der Partikel.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Bewahrt die respektvolle Bezeichnung Naamans aus der Sicht des israelitischen Mädchens, ohne den Sinn unnötig auf ein Eigentumsverhältnis festzulegen.
- source_word: לִפְנֵי
  choice: bei
  rationale: Gibt die hebräische Wendung „vor/im Angesicht von“ in diesem Zusammenhang natürlich als Aufenthalt in der Gegenwart des Propheten wieder.
- source_word: הַנָּבִיא אֲשֶׁר בְּשֹׁמְרוֹן
  choice: der Prophet, der in Samaria lebt
  rationale: Das Hebräische nennt den Titel und den Ort, nicht den Namen Elisa. „lebt“ macht die örtliche Angabe im Deutschen flüssig, ohne zusätzliche Identifizierung einzuführen.
- source_word: יֶאֱסֹף אֹתוֹ מִצָּרַעְתּוֹ
  choice: würde er ihn von seinem Aussatz heilen
  rationale: אָסַף bedeutet grundsätzlich „sammeln/aufnehmen“, bezeichnet in dieser Konstruktion jedoch idiomatisch die Beseitigung der Krankheit beziehungsweise die Genesung davon. „heilen“ gibt den gemeinten Sinn in natürlichem Deutsch wieder; die ungewöhnliche Bildsprache wird in einer Fußnote dokumentiert.
- source_word: צָרַעַת
  choice: Aussatz
  rationale: „Aussatz“ ist die traditionelle und verständliche Bibelübersetzung, darf aber nicht ohne Weiteres mit der modernen Diagnose Lepra beziehungsweise Hansen-Krankheit gleichgesetzt werden; diese Spannweite wird vermerkt.
theological_decisions: []
