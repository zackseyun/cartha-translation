  register: Modernes, würdevolles Standarddeutsch. Die Wunschform „Wenn … doch“ ist idiomatisch und bewahrt die emotionale Färbung. Die unnatürliche wörtliche Wiedergabe des Krankheitsidioms wurde im Haupttext zugunsten verständlicher Bedeutung vermieden und in der Fußnote offengelegt.
