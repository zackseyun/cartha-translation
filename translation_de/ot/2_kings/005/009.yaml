base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/009.yaml
  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: de
  text: So kam Naaman mit seinen Pferden und Wagen[a] und blieb am Eingang von Elisas Haus stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen der Singular: „mit seinem Pferd und seinem Wagen“. Die Wörter sind hier wahrscheinlich kollektiv gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: So kam
  rationale: בוא bezeichnet hier in der fortlaufenden Erzählung Naamans Ankunft bei Elisa. „Kam“ bewahrt die schlichte narrative Bewegung; „so“ nimmt den Erzählanschluss des Wayyiqtol natürlich auf.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: בְּסוּסוֹ
  choice: mit seinen Pferden
  rationale: Die Form ist morphologisch Singular („mit seinem Pferd“), kann im Zusammenhang aber kollektiv verstanden werden. Der Plural passt zum vornehmen militärischen Gefolge und ergibt zusammen mit רֶכֶב natürliches Deutsch.
- source_word: וּבְרִכְבּוֹ
  choice: und Wagen
  rationale: רֶכֶב kann einen einzelnen Wagen oder kollektiv Wagen beziehungsweise Streitwagen bezeichnen. „Wagen“ hält die Art der Fahrzeuge offen und folgt der wahrscheinlichen kollektiven Bedeutung.
- source_word: וַיַּעֲמֹד
  choice: blieb ... stehen
  rationale: עמד bedeutet „stehen“ und beschreibt hier, dass Naaman vor dem Haus Halt macht und dort stehen bleibt. Die deutsche Wendung bewahrt das anschauliche Moment besser als bloßes „hielt an“.
- source_word: פֶּתַח הַבַּיִת
  choice: am Eingang ... des Hauses
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang eines Hauses. „Am Eingang“ ist präzise und in modernem Deutsch natürlich.
- source_word: לֶאֱלִישָׁע
  choice: von Elisas Haus
  rationale: 'Die Präposition ל bezeichnet in dieser Konstruktion Zugehörigkeit: das Haus, das Elisa zugeordnet ist. Natürliches Deutsch verlangt daher „Elisas Haus“.'
