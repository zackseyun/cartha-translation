  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: de
  text: 'Was diese Sache betrifft, möge Jahwe deinem Diener vergeben: Wenn mein Herr in das Haus Rimmons[b] geht, um sich dort niederzuwerfen[a], und er sich auf meine Hand stützt und ich mich im Haus Rimmons niederwerfe – bei meinem Niederwerfen im Haus Rimmons –, möge Jahwe deinem Diener in dieser Sache bitte vergeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „anbete“. Das hebräische Verb kann sowohl die körperliche Handlung des Niederwerfens als auch kultische Verehrung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Rimmon war ein syrischer Gott; mit dem „Haus Rimmons“ ist sein Heiligtum gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: möge ... vergeben
  rationale: Die Verbform drückt hier eine Bitte aus. „Möge ... vergeben“ gibt den bittenden Sinn würdig und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעַבְדֶּךָ
  choice: deinem Diener
  rationale: Naaman bezeichnet sich in höfischer Rede als Diener; „Sklave“ würde hier einen nicht hervorgehobenen sozialen Aspekt in den Vordergrund rücken.
- source_word: בְּבוֹא אֲדֹנִי
  choice: wenn mein Herr ... geht
  rationale: Die Präposition mit Infinitiv bezeichnet den zeitlichen Umstand. „Mein Herr“ bezeichnet Naamans königlichen Dienstherrn.
- source_word: בֵית רִמּוֹן
  choice: Tempel Rimmons
  rationale: Das wörtliche „Haus Rimmons“ meint im Kontext eindeutig das Heiligtum des Gottes Rimmon; „Tempel“ ist im Deutschen unmittelbar verständlich.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: um sich ... niederzuwerfen
  rationale: Das Verb bezeichnet eine tiefe Verbeugung oder Niederwerfung und kann im religiösen Kontext auch Anbetung ausdrücken. Die körperliche Formulierung bewahrt die Mehrdeutigkeit.
- source_word: נִשְׁעָן עַל יָדִי
  choice: er sich dabei auf meine Hand stützt
  rationale: Die partizipiale Form beschreibt einen begleitenden Umstand. „Hand“ hält sich eng an den hebräischen Ausdruck.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: sodass auch ich mich ... niederwerfe
  rationale: Der Satz beschreibt die Folge davon, dass Naaman seinen Herrn stützt. „Auch“ macht seine dadurch bedingte Mitbewegung deutlich, ohne über seine innere Haltung zu entscheiden.
- source_word: נָא
  choice: doch
  rationale: Die Bittpartikel verstärkt die Bitte. Das deutsche Modalwort „doch“ wirkt hier natürlich und respektvoll.
theological_decisions:
- issue: Ob השתחוה als kultische „Anbetung“ oder als körperliches Niederwerfen wiederzugeben ist
  choice: sich niederwerfen
  alternative: anbeten; sich verbeugen
  rationale: Das hebräische Verb kann sowohl die körperliche Handlung als auch kultische Verehrung bezeichnen. „Sich niederwerfen“ lässt offen, wie Naamans äußere Handlung zu seiner inneren Bindung an Jahwe steht, und bewahrt so die Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange, wiederholende Satzbau der Bitte wird weitgehend bewahrt; Gedankenstriche gliedern ihn für heutige Leser. Die Übersetzung vermeidet eine Festlegung auf Naamans innere Absicht.
