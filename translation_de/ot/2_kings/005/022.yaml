  source_fidelity: 'Der Entwurf gibt die hebräische Aussage insgesamt zuverlässig wieder: שָׁלוֹם ist passend idiomatisch als beruhigende Versicherung übersetzt; die Herkunft aus dem Bergland Ephraims und die Zugehörigkeit zu den בני הנביאים bleiben erkennbar. Auch die Bitte um ein Talent Silber und zwei Kleidungswechsel ist sachlich richtig. Die Botenformel kann im Deutschen jedoch unmittelbarer an שְׁלָחַנִי לֵאמֹר angeschlossen werden.'
  naturalness: „Garnituren Kleidung“ ist im modernen Standarddeutsch unidiomatisch. „Wechselkleider“ bezeichnet die gemeinten vollständigen Kleidungswechsel präzise und natürlich. „Hat mich geschickt, um dir zu sagen“ ist eine flüssige deutsche Wiedergabe der Botenformel.
  terminology: „Prophetenschüler“ ist als verständliche Wiedergabe der technischen Wendung „Söhne der Propheten“ vertretbar, sofern die Fußnote den wörtlichen Ausdruck und den Gemeinschaftsbezug angibt. „Talent“ soll als antike Gewichtseinheit beibehalten werden; die Fußnote ist angemessen.
