  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם אֲדֹנִ/י֮ שְׁלָחַ֣/נִי לֵ/אמֹר֒ הִנֵּ֣ה עַתָּ֡ה זֶ֠ה בָּ֣אוּ אֵלַ֧/י שְׁנֵֽי נְעָרִ֛ים מֵ/הַ֥ר אֶפְרַ֖יִם מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים תְּנָ/ה נָּ֤א לָ/הֶם֙ כִּכַּר כֶּ֔סֶף וּ/שְׁתֵּ֖י חֲלִפ֥וֹת בְּגָדִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: de
  text: 'Er sagte: »Alles ist in Ordnung.[a] Mein Herr hat mich geschickt, um dir zu sagen: ›Sieh, gerade eben sind zwei junge Männer aus dem Bergland Ephraims zu mir gekommen, die zu den Prophetenschülern gehören.[b] Gib ihnen bitte ein Talent Silber[c] und zwei Wechselkleider.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Friede« oder »Es steht gut«. Das hebräische schalom dient hier als beruhigende Versicherung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von den Söhnen der Propheten«. So wurden Angehörige einer prophetischen Gemeinschaft bezeichnet.'
    reason: cultural_note
  - marker: c
    text: Ein Talent war eine große antike Gewichtseinheit für Edelmetall.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Alles ist in Ordnung
  rationale: Das Wort dient hier als idiomatische Versicherung, dass nichts geschehen sei; die Formulierung ist natürlich und gibt die Gesprächsfunktion wieder.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Gehasi bezeichnet Elisa als seinen Vorgesetzten; „mein Herr“ bewahrt die respektvolle Anrede, ohne einen göttlichen Titel nahezulegen.
- source_word: שְׁלָחַנִי לֵאמֹר
  choice: hat mich geschickt und lässt dir sagen
  rationale: Die deutsche Botenformel gibt sowohl das Senden als auch die folgende übermittelte Rede flüssig wieder.
- source_word: הִנֵּה עַתָּה זֶה
  choice: Sieh, gerade eben
  rationale: „Sieh“ erhält das Aufmerksamkeitssignal, „gerade eben“ die betonte zeitliche Unmittelbarkeit.
- source_word: נְעָרִים
  choice: junge Männer
  rationale: Die Bezeichnung kann Jugendliche, Diener oder junge Männer meinen; aufgrund ihrer Zuordnung zur Prophetengemeinschaft ist „junge Männer“ hier am wenigsten interpretierend.
- source_word: מֵהַר אֶפְרַיִם
  choice: aus dem Bergland Ephraim
  rationale: Gemeint ist die Hochlandregion Ephraims und nicht zwingend ein einzelner Berg.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: die zu den Prophetenschülern gehören
  rationale: Die hebräische feste Wendung bezeichnet Angehörige einer prophetischen Gemeinschaft; „Prophetenschüler“ vermittelt diese Bedeutung im heutigen Deutsch verständlich.
- source_word: תְּנָה נָּא
  choice: Gib ihnen bitte
  rationale: נָא mildert die Aufforderung zu einer höflichen Bitte ab.
- source_word: כִּכַּר כֶּסֶף
  choice: ein Talent Silber
  rationale: „Talent“ bewahrt die antike Gewichtseinheit; die Fußnote erklärt sie, ohne eine unsichere moderne Wertumrechnung einzuführen.
- source_word: חֲלִפוֹת בְּגָדִים
  choice: Garnituren Kleidung
  rationale: Gemeint sind vollständige Sätze beziehungsweise Wechselkleider; „Garnituren Kleidung“ ist verständlich und bewahrt den Sachbezug.
