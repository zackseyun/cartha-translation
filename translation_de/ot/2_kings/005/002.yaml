source:
  edition: WLC
  text: וַ/אֲרָם֙ יָצְא֣וּ גְדוּדִ֔ים וַ/יִּשְׁבּ֛וּ מֵ/אֶ֥רֶץ יִשְׂרָאֵ֖ל נַעֲרָ֣ה קְטַנָּ֑ה וַ/תְּהִ֕י לִ/פְנֵ֖י אֵ֥שֶׁת נַעֲמָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: de
  text: Streifscharen der Aramäer waren ausgezogen und hatten aus dem Land Israel ein kleines Mädchen[a] gefangen weggeführt. Sie diente der Frau Naamans.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein junges Mädchen«. Die hebräische Wendung betont, dass es ein kleines beziehungsweise junges Mädchen war.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Und sie war vor der Frau Naamans«; gemeint ist, dass sie ihr aufwartete oder diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: Die Aramäer ... in Streifscharen
  rationale: Das singularische »Aram« bezeichnet hier aufgrund des pluralischen Verbs die aramäischen Kräfte; גְדוּדִים sind bewaffnete Streif- oder Raubscharen.
- source_word: יָצְאוּ
  choice: waren ... ausgezogen
  rationale: Das Perfekt bildet gegenüber der folgenden Erzählhandlung eine vorausliegende Hintergrundhandlung ab.
- source_word: וַיִּשְׁבּוּ
  choice: hatten ... gefangen weggeführt
  rationale: Das Verb bezeichnet nicht nur das Ergreifen, sondern das Gefangennehmen und Fortschleppen als Gefangene.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: aus dem Land Israel
  rationale: Die ausdrückliche geografische Wendung des Hebräischen bleibt erhalten.
- source_word: נַעֲרָה קְטַנָּה
  choice: ein junges Mädchen
  rationale: נַעֲרָה bezeichnet ein Mädchen beziehungsweise eine junge Frau; קְטַנָּה hebt ihre Jugend oder Kleinheit hervor. »Junges Mädchen« ist im Deutschen natürlich, ohne einen Dienerinnenstatus in die Bezeichnung hineinzulesen.
- source_word: וַתְּהִי לִפְנֵי
  choice: Es kam in den Dienst
  rationale: Wörtlich »sie war vor«; im Zusammenhang bezeichnet die Wendung ihre persönliche Aufwartung beziehungsweise ihren Dienst bei Naamans Frau.
- source_word: אֵשֶׁת נַעֲמָן
  choice: der Frau Naamans
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und würdig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die zeitliche Vorordnung der aramäischen Streifzüge wird durch das Plusquamperfekt ausgedrückt; der zweite Satz vermeidet eine im Deutschen unnatürliche wörtliche Wiedergabe des Dienstidioms.
