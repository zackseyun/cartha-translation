  - severity: medium
    issue: »Es kam in den Dienst« verändert den Aussageaspekt von וַתְּהִי.
    rationale: Der hebräische Text stellt ihren bestehenden Dienst bzw. ihre Anwesenheit bei Naamans Frau fest, nicht ausdrücklich ihren Eintritt in diesen Dienst.
