revisions:
- from: Die Aramäer waren in Streifscharen ausgezogen und hatten aus dem Land Israel ein junges Mädchen[a] gefangen weggeführt. Es kam in den Dienst der Frau Naamans.[b]
  to: Streifscharen der Aramäer waren ausgezogen und hatten aus dem Land Israel ein kleines Mädchen[a] gefangen weggeführt. Sie diente der Frau Naamans.[b]
  rationale: Die Revision gibt die raubenden aramäischen Verbände idiomatischer wieder, erhält die zeitliche Vorordnung der Erzählung und vermeidet beim Dienstmädchen eine zusätzliche Aussage über den Beginn ihres Dienstes. Die Wahl »kleines Mädchen« entspricht dem hebräischen Adjektiv genauer; die Fußnotenanker bleiben an den jeweiligen Ausdrücken bzw. Aussagen erhalten.
