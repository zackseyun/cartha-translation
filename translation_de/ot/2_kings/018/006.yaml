  text: וַ/יִּדְבַּק֙ בַּֽ/יהוָ֔ה לֹא סָ֖ר מֵ/אַֽחֲרָ֑י/ו וַ/יִּשְׁמֹר֙ מִצְוֺתָ֔י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: de
  text: Er hielt an Jahwe[a] fest und wandte sich nicht von ihm ab. Er hielt die Gebote, die Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hing Jahwe an“. Das hebräische Verb bezeichnet eine enge, beständige Bindung und bringt hier starke Bundestreue zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: hielt sich fest an
  rationale: Das Verb דבק bezeichnet hier eine enge, beständige Bindung und Bundestreue. Die Formulierung bewahrt das Bild des Sich-Festhaltens und klingt zugleich natürlich.
- source_word: בַּיהוָה
  choice: an Jahwe
  rationale: Die Präposition בְּ bezeichnet zusammen mit דבק die Person, an die sich Hiskia eng hält. Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: wich nicht davon ab, ihm zu folgen
  rationale: Die hebräische Wendung verbindet das Nicht-Abweichen mit dem Folgen hinter Jahwe her. Diese Wiedergabe erhält sowohl das Bild des Weges als auch den Gedanken treuer Gefolgschaft.
- source_word: וַיִּשְׁמֹר
  choice: hielt
  rationale: שׁמר bedeutet in Verbindung mit Geboten, sie zu halten beziehungsweise zu befolgen. „Hielt“ wahrt den vertrauten bundestheologischen Sprachgebrauch.
- source_word: מִצְוֺתָיו
  choice: seine Gebote
  rationale: Das Suffix verweist auf Jahwe; מִצְוֹת bezeichnet seine verbindlichen Weisungen.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: die Jahwe Mose geboten hatte
  rationale: Die Formulierung bewahrt die Wiederholung des Verbs „gebieten“ und macht durch das Plusquamperfekt deutlich, dass die Gebote Mose bereits zuvor gegeben worden waren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von דבק für Hiskias Verhältnis zu Jahwe
  choice: hielt sich fest an
  alternative: blieb Jahwe treu
  rationale: Die gewählte Fassung bewahrt die konkrete Metapher enger Bindung; die darin liegende Bundestreue wird nicht auf eine abstrakte Deutung reduziert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt klar und gut verständlich; zugleich werden die hebräischen Leitbegriffe „sich festhalten“, „folgen“ und „Gebote halten“ bewahrt.
