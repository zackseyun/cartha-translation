  rationale: Die Revision ersetzt die zeitlich interpretierende Konjunktion „als“ durch die quellennähere Koordination „und“ und entfernt das nicht im Hebräischen ausgedrückte „hier“. Alle übrigen tragfähigen Entscheidungen, insbesondere die kultische Terminologie und die direkte Rede, bleiben erhalten.
