  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: de
  text: 'Wenn ihr aber zu mir sagt: »Wir vertrauen auf den HERRN, unseren Gott«, ist er nicht der, dessen Höhenheiligtümer und Altäre Hiskia beseitigt hat und zu Juda und Jerusalem sagte: »Vor diesem Altar in Jerusalem sollt ihr euch niederwerfen«?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּמוֹתָיו
  choice: dessen Höhenheiligtümer
  rationale: במות bezeichnet hier kultische Stätten auf Anhöhen bzw. lokale Heiligtümer. »Höhenheiligtümer« ist im Deutschen verständlicher und genauer als das bloße »Höhen«.
- source_word: תִּשְׁתַּחֲווּ
  choice: sollt ihr euch niederwerfen
  rationale: Das Verb bezeichnet die körperliche Niederwerfung als Verehrung. Die Wiedergabe bewahrt das konkrete Bild und den kultischen Zusammenhang.
- source_word: וַיֹּאמֶר
  choice: als er … sagte
  rationale: Die deutsche Nebensatzkonstruktion gibt den begleitenden bzw. erläuternden Zusammenhang natürlich wieder, ohne eine zusätzliche zeitliche Abfolge stark zu betonen.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms mit »HERR« wird beibehalten.
theological_decisions:
- issue: Zuordnung der beseitigten Heiligtümer und Altäre zu JHWH
  choice: »dessen Höhenheiligtümer und Altäre«
  alternative: »die Höhenheiligtümer und Altäre, die ihm geweiht waren«
  rationale: Der Vers gibt die polemische Behauptung des assyrischen Sprechers wieder. Das Possessivverhältnis des Hebräischen bleibt erhalten, ohne seine Fehldeutung von Hiskias Kultreform zu korrigieren.
- issue: Art der geforderten Verehrung
  choice: »euch niederwerfen«
  alternative: »anbeten«
  rationale: Die konkrete Handlung des hebräischen Verbs wird bewahrt; zugleich wird nicht unnötig festgelegt, ob ausschließlich eine innere oder eine liturgische Bedeutung gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede und die rhetorische Frage bleiben erhalten. »Hier in Jerusalem« gibt die hebräische Wortstellung natürlich wieder und macht deutlich, dass der bezeichnete Altar sich in Jerusalem befindet.
