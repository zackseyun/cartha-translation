    issue: „als er zu Juda und Jerusalem sagte“ für ויאמר
    rationale: Das hebräische ויאמר ist hier mit der vorangehenden Aussage koordiniert. „Als“ fügt eine zeitliche Unterordnung hinzu. „und zu Juda und Jerusalem sagte“ gibt die Syntax und den Zusammenhang neutraler wieder.
  - severity: low
    issue: Die Ergänzung „hier“
    rationale: Das Demonstrativum הזה bezieht sich auf den Altar („diesem Altar“); ein zusätzliches „hier“ ist im Ausgangstext nicht vorhanden. Es kann ohne Bedeutungsverlust entfallen.
