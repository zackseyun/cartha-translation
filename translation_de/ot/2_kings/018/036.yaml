source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ישׁוּ הָ/עָ֔ם וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: de
  text: 'Aber das Volk schwieg und antwortete ihm kein Wort[a], denn der Befehl des Königs lautete: „Antwortet ihm nicht!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie antworteten ihm kein Wort“; das heißt, sie gaben ihm überhaupt keine Antwort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: schwieg
  rationale: Der Hifil von חרשׁ bezeichnet hier bewusstes Stillschweigen. „Schwieg“ ist im Deutschen natürlich und gibt die zurückhaltende Reaktion des Volkes treffend wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם bezeichnet hier die judäische Bevölkerung, die der Rede zuhört. „Das Volk“ ist die übliche, kontextgerechte Wiedergabe, ohne die Gruppe näher zu bestimmen als der hebräische Text.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: und antwortete ihm kein Wort
  rationale: Die Formulierung bewahrt die hebräische Wendung mit דָבָר („Wort“) und ist zugleich gutes, verständliches Deutsch. Gemeint ist, dass überhaupt keine Antwort gegeben wurde.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für das Schweigen ein. „Denn“ fügt sich natürlich in den erzählenden Satz ein.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: der Befehl des Königs
  rationale: מִצְוָה bedeutet hier eine verbindliche Anordnung. „Befehl“ bringt die königliche Autorität klar zum Ausdruck.
- source_word: הִיא לֵאמֹר
  choice: lautete
  rationale: Die Konstruktion leitet den Inhalt des Befehls ein, wörtlich etwa „war, indem er sagte“. Im Deutschen gibt „lautete“ diese Funktion knapp und idiomatisch wieder.
- source_word: לֹא תַעֲנֻהוּ
  choice: Antwortet ihm nicht!
  rationale: Die zweite Person maskulin Plural richtet das Verbot an die versammelte Gruppe. Der deutsche Pluralimperativ gibt dies direkt wieder und wahrt die Wiederholung des Verbs ענה.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wortstellung wird nicht mechanisch nachgebildet; die prägnante Wiederholung von „antworten“ und die Wendung „kein Wort“ bleiben jedoch erhalten.
