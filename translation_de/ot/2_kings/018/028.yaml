base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: de
  text: 'Da stand der Rabschake und rief mit lauter Stimme auf Judäisch[a]. Er redete und sagte: »Hört das Wort des Großkönigs, des Königs von Assyrien!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf Hebräisch«. Der hebräische Ausdruck bezeichnet genauer die Sprache Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Da trat … vor
  rationale: עמד bezeichnet hier im Erzählzusammenhang das Einnehmen einer Position zum öffentlichen Auftreten. „Trat vor“ ist im Deutschen natürlicher als das rein statische „stand“ und fügt keine wesentliche Deutung hinzu.
- source_word: רַב שָׁקֵה
  choice: der Rabschake
  rationale: Die historische assyrische Amtsbezeichnung wird in ihrer eingebürgerten deutschen Form transliteriert, statt durch die möglicherweise missverständliche etymologische Wiedergabe „Obermundschenk“ ersetzt zu werden.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: rief mit lauter Stimme
  rationale: Die Verbindung bezeichnet einen weithin hörbaren öffentlichen Ruf; die konkrete Ausdrucksweise bleibt in natürlichem Deutsch erhalten.
- source_word: יְהוּדִית
  choice: auf Judäisch
  rationale: Das Wort bezeichnet spezifisch die Sprache Judas. „Judäisch“ bewahrt diese historische Genauigkeit; die geläufigere Wiedergabe „Hebräisch“ wird in der Fußnote genannt.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: Er redete und sagte
  rationale: Beide hebräischen Redeverben bleiben sichtbar, auch wenn die Doppelung im modernen Deutschen markiert wirkt.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der direkte Imperativ Plural entspricht dem öffentlichen, heroldartigen Ton.
- source_word: דְּבַר
  choice: das Wort
  rationale: „Wort“ gibt die offizielle königliche Verlautbarung formal und quellenah wieder; „Botschaft“ wäre glatter, aber interpretierender.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: des Großkönigs
  rationale: „Großkönig“ ist eine prägnante und historisch passende deutsche Wiedergabe des assyrischen Herrschertitels.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: des Königs von Assyrien
  rationale: Die Konstruktion wird klar, formal und idiomatisch wiedergegeben.
