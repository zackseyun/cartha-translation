  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: de
  text: 'Da sagte der Rabschake zu ihnen: „Hat mein Herr mich etwa zu deinem Herrn und zu dir gesandt, um diese Worte zu sagen? Hat er mich nicht auch zu den Männern gesandt, die auf der Mauer sitzen und mit euch ihren eigenen Kot essen und ihren eigenen Urin trinken werden?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text gebraucht hier derbe Bilder für die Not einer Belagerung: „ihren Kot essen und ihren Urin trinken“. Die masoretische Lesetradition bietet für den zweiten Ausdruck eine verhüllende Formulierung, die oft mit „das Wasser ihrer Füße trinken“ wiedergegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: der Rabschake
  rationale: Der aus dem Akkadischen stammende assyrische Amtstitel wird in der Erzählung wie eine feste Amtsbezeichnung verwendet. Die im Deutschen traditionelle Transliteration vermeidet eine unsichere Festlegung auf ein bestimmtes Amt.
- source_word: הַעַל ... שְׁלָחַנִי אֲדֹנִי
  choice: Hat mein Herr mich etwa ... gesandt
  rationale: Die Fragepartikel leitet eine rhetorische Frage ein. „etwa“ gibt ihren herausfordernden Ton in natürlichem Deutsch wieder, ohne das im Hebräischen nicht ausdrücklich stehende „nur“ einzufügen.
- source_word: אֲדֹנֶיךָ
  choice: deinem Herrn
  rationale: Gemeint ist hier der judäische König als politischer Gebieter, nicht Gott. „Herr“ bewahrt die Anrede- und Rangbeziehung im Deutschen.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: um diese Worte zu reden
  rationale: Die Formulierung bleibt nahe am konkreten hebräischen Ausdruck und behält den würdevollen Erzählton bei.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: Hat er mich nicht auch zu den Männern gesandt, die auf der Mauer sitzen
  rationale: הֲלֹא erwartet Zustimmung; „nicht auch“ macht den im Zusammenhang liegenden Einschluss der Männer auf der Mauer deutlich. Das im zweiten Fragesatz ausgelassene Verb „gesandt“ wird im Deutschen wiederholt.
- source_word: חרי/הם
  choice: ihren eigenen Kot
  rationale: Der derbe Ausdruck bezeichnet menschliche Ausscheidungen. „Kot“ vermittelt die grobe Belagerungsdrohung deutlich, ohne sie unnötig abzuschwächen.
- source_word: שיני/הם
  choice: ihren eigenen Urin
  rationale: Der sachliche Sinn des groben beziehungsweise durch die Lesetradition verhüllten Ausdrucks ist Urin. Die direkte Wiedergabe erhält die Härte des assyrischen Spotts.
- source_word: עִמָּכֶם
  choice: mit euch
  rationale: Die knappe Wiedergabe bewahrt die Aussage, dass die Angesprochenen dasselbe Los gemeinsam mit den Männern auf der Mauer erleiden werden.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die obszöne Härte der Drohung wird nicht beschönigt. Der assyrische Titel bleibt als „Rabschake“ transliteriert; die rhetorische Spannung der beiden Fragen bleibt erhalten.
