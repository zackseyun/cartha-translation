  text: וְ/הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ בְּ/כֹ֥ל אֲשֶׁר יֵצֵ֖א יַשְׂכִּ֑יל וַ/יִּמְרֹ֥ד בְּ/מֶֽלֶךְ אַשּׁ֖וּר וְ/לֹ֥א עֲבָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: de
  text: Und Jahwe war mit ihm. Bei allem, was er unternahm, hatte er Erfolg.[a] Er lehnte sich gegen den König von Assyrien auf und diente ihm nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wohin er auch auszog, hatte er Erfolg“; oder: „Bei allem, was er unternahm, handelte er klug.“ Das hebräische Wort verbindet die Vorstellungen von klugem Handeln und Erfolg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen יהוה in der im Deutschen geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְהָיָה ... עִמּוֹ
  choice: war mit ihm
  rationale: Die natürliche deutsche Wiedergabe der hebräischen Wendung bezeichnet Gottes fortdauernde Gegenwart und Beistand.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: bei allem, was er unternahm
  rationale: Das wörtliche Bild des Hinausgehens bezeichnet hier umfassend Hiskias Unternehmungen, möglicherweise einschließlich militärischer Auszüge.
- source_word: יַשְׂכִּיל
  choice: hatte er Erfolg
  rationale: Der Hifil von שׂכל kann sowohl kluges Handeln als auch daraus erwachsenden Erfolg ausdrücken. Im königlichen Erzählzusammenhang ist die Erfolgsbedeutung passend, ohne die Weisheitsnuance in der Fußnote zu verschweigen.
- source_word: וַיִּמְרֹד
  choice: lehnte sich ... auf
  rationale: Gibt den politischen Aufstand gegen die assyrische Oberherrschaft in natürlichem modernem Deutsch wieder.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: gegen den König von Assyrien
  rationale: Direkte und idiomatische Wiedergabe des politischen Gegenübers.
- source_word: וְלֹא עֲבָדוֹ
  choice: diente ihm nicht mehr
  rationale: עבד bezeichnet hier den Dienst eines Vasallen. Das deutsche „nicht mehr“ macht im Anschluss an den Aufstand den kontextuell vorausgesetzten Abbruch dieses Dienstverhältnisses deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Eigennamen und entspricht der üblichen deutschen Form.
- issue: Verhältnis von Gottes Beistand und Hiskias Erfolg
  choice: Beide Aussagen werden nebeneinandergestellt, ohne eine über den Text hinausgehende Kausalformel einzufügen.
  alternative: Deshalb hatte er bei allem Erfolg.
  rationale: Der hebräische Text verbindet Gottes Gegenwart und Hiskias Erfolg, formuliert den Zusammenhang aber nicht ausdrücklich mit „deshalb“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bei allem, was er unternahm“ gibt die hebräische Auszugswendung idiomatisch wieder; die Fußnote bewahrt sowohl ihr Bild als auch die Doppelbedeutung von יַשְׂכִּיל.
