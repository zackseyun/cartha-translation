source:
  edition: WLC
  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: de
  text: Er beseitigte die Kulthöhen, zerbrach die Steinmale, hieb die Aschera[a] um und zerschlug die bronzene Schlange, die Mose gemacht hatte. Denn bis zu jenen Tagen hatten die Söhne Israels für sie Räucheropfer dargebracht. Sie wurde Nehuschtan genannt.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Ascherapfahl“ beziehungsweise „den heiligen Pfahl“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er nannte sie Nehuschtan.“ Im Hebräischen wird das Subjekt des Verbs nicht ausdrücklich genannt.'
    reason: alternative_reading
  - marker: c
    text: Nehuschtan ist wahrscheinlich ein Wortspiel mit dem hebräischen Wort für „Bronze“ und kann etwa „ein bloßes Stück Bronze“ bedeuten.
    reason: cultural_note
lexical_decisions:
- source_word: הֵסִיר אֶת הַבָּמוֹת
  choice: beseitigte die Kulthöhen
  rationale: „Kulthöhen“ gibt den etablierten kultischen Sinn von בָּמוֹת im modernen Deutschen klarer wieder als das missverständliche bloße „Höhen“.
- source_word: שִׁבַּר אֶת הַמַּצֵּבֹת
  choice: zerbrach die Steinmale
  rationale: מַצֵּבוֹת bezeichnet aufgerichtete, kultisch verwendete Steine beziehungsweise Steinmale; „Steinmale“ wahrt Gegenständlichkeit und kultischen Kontext.
- source_word: כָרַת אֶת הָאֲשֵׁרָה
  choice: hieb die Aschera um
  rationale: Das Verb bezeichnet das Fällen oder Abhauen. Die Transliteration „Aschera“ bewahrt die Mehrdeutigkeit zwischen dem benannten Kultgegenstand und seiner Verbindung mit der Göttin.
- source_word: כִתַּת נְחַשׁ הַנְּחֹשֶׁת
  choice: zerschlug die bronzene Schlange
  rationale: כִתַּת bezeichnet gründliches Zerschlagen. „Bronzene Schlange“ ist verständlich und hält die Wortverbindung נְחַשׁ/נְחֹשֶׁת erkennbar.
- source_word: עַד הַיָּמִים הָהֵמָּה
  choice: bis zu jener Zeit
  rationale: Die idiomatische deutsche Wendung bezeichnet die Zeit bis zu Hiskias Reform, ohne den hebräischen Ausdruck unnötig wörtlich abzubilden.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die familiäre und grammatisch maskuline Formulierung des Hebräischen wird bewahrt.
- source_word: מְקַטְּרִים לוֹ
  choice: hatten ihr Räucheropfer dargebracht
  rationale: Das Verb bezeichnet das Verbrennen von Räucherwerk beziehungsweise das Erzeugen von Opferrauch; „Räucheropfer darbringen“ ist im Deutschen natürlich und kultisch präzise.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: Man nannte sie Nehuschtan
  rationale: Die unpersönliche Wiedergabe wahrt, dass das ausdrücklich nicht genannte Subjekt entweder Hiskia oder allgemein die Menschen sein kann.
theological_decisions:
- issue: Bedeutung von אֲשֵׁרָה
  choice: Aschera
  alternative: Ascherapfahl; heiliger Pfahl
  rationale: Da der Gegenstand umgehauen wird, liegt ein Kultobjekt nahe. Die Transliteration verhindert jedoch, dass die genaue Art dieses Gegenstands oder sein Verhältnis zur Göttin voreilig festgelegt wird.
- issue: Bezug des Pronomens in מְקַטְּרִים לוֹ
  choice: ihr Räucheropfer dargebracht
  alternative: für sie Räucheropfer verbrannt
  rationale: Das feminine deutsche Pronomen bezieht sich eindeutig auf die bronzene Schlange und drückt die kultische Zuwendung aus, ohne eine weitergehende Aussage über deren genaue religiöse Einordnung hinzuzufügen.
- issue: Subjekt von וַיִּקְרָא
  choice: 'unpersönlich: „Man nannte sie Nehuschtan“'
  alternative: „Er nannte sie Nehuschtan“ mit Hiskia als Subjekt
  rationale: Das hebräische Verb steht im Singular, nennt sein Subjekt aber nicht ausdrücklich. Die unpersönliche deutsche Form bewahrt diese Offenheit.
- issue: Deutung von נְחֻשְׁתָּן
  choice: Nehuschtan als Name belassen
  alternative: ein bloßes Stück Bronze
  rationale: Das Wortspiel mit נְחֹשֶׁת („Bronze“) ist wahrscheinlich, doch seine genaue Bedeutung und wertende Kraft sind nicht sicher genug, um sie in den Haupttext einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kulthöhen“, „Steinmale“ und „Räucheropfer“ vermitteln den antiken kultischen Zusammenhang ohne altertümliche Satzform. Die feminine Pronominalreferenz folgt dem deutschen Genus von „Schlange“.
