  naturalness: „Ihr Räucheropfer darbringen“ ist zwar grammatisch möglich, wirkt hier aber leicht missverständlich, weil „ihr“ als Possessivpronomen aufgefasst werden kann. „Für sie Räucheropfer darbrachten“ ist im modernen Standarddeutsch klar und natürlich. „Sie wurde Nehuschtan genannt“ bewahrt die vom deutschen unpersönlichen Passiv ausgedrückte Offenheit idiomatischer als „Man nannte sie“.
  terminology: „Kulthöhen“, „Steinmale“, „Aschera“, „bronzene Schlange“ und „Nehuschtan“ sind sachgerecht. Die Fußnoten geben die lexikalische Unsicherheit bei Aschera sowie die unsichere Benennungssituation und das Wortspiel bei Nehuschtan angemessen wieder.
