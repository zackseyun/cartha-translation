base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: de
  text: Im dritten Regierungsjahr Hoscheas, des Königs von Israel, des Sohnes Elas, wurde Hiskia, der Sohn des Ahas, König[a] von Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: begann Hiskia, der Sohn des Ahas, über Juda zu regieren. Das hebräische Verb bezeichnet in dieser königlichen Datierungsformel Hiskias Thronbesteigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: unübersetzt als eigenständige Einleitung
  rationale: Die Form dient hier als erzählerischer Übergang. Im modernen Deutschen wird ihre Funktion durch den direkten Einstieg in die Zeitangabe natürlich wiedergegeben; ein zusätzliches „Und es geschah“ wäre unnötig schwerfällig.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: Im dritten Regierungsjahr
  rationale: Die Wendung bezeichnet in diesem Zusammenhang das dritte Jahr der Herrschaft Hoscheas. „Regierungsjahr“ macht den Bezug im Deutschen eindeutig und entspricht der üblichen königlichen Datierungsformel.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: Hoscheas, des Sohnes Elas
  rationale: Die Präposition לְ markiert Hoscheas Herrschaft als zeitlichen Bezugspunkt. Die Namen folgen den im Deutschen gebräuchlichen biblischen Formen.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Königs von Israel
  rationale: Die Apposition bezeichnet Hoscheas Amt und Herrschaftsgebiet.
- source_word: מָלַךְ
  choice: wurde ... König
  rationale: In dieser Thronbesteigungsformel bezeichnet das Verb den Beginn der Königsherrschaft, nicht deren gesamte Dauer. Die deutsche Formulierung gibt diesen ingressiven Sinn natürlich wieder.
- source_word: חִזְקִיָּה בֶן אָחָז
  choice: Hiskia, der Sohn des Ahas
  rationale: Verwendet die geläufigen deutschen Namensformen und gibt die Abstammungsangabe klar wieder.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Im Hebräischen steht die Bezeichnung appositionell zu Hiskia; im Deutschen wird sie idiomatisch mit „wurde“ verbunden.
