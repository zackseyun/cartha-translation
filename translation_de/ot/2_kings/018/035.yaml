source:
  edition: WLC
  text: מִ֚י בְּ/כָל אֱלֹהֵ֣י הָֽ/אֲרָצ֔וֹת אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: de
  text: Welcher von allen Göttern der Länder hat sein Land aus meiner Hand gerettet? Wie sollte da Jahwe Jerusalem aus meiner Hand retten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: Wer von allen Göttern der Länder
  rationale: מִי mit בְּכָל wird partitiv wiedergegeben. „Länder“ bezeichnet hier die verschiedenen von Assyrien bedrohten oder besiegten Länder, nicht die gesamte Erde.
- source_word: אֲשֶׁר הִצִּילוּ
  choice: hat … gerettet
  rationale: נצל im Hifil bedeutet „retten, befreien“. Der Singular folgt dem interrogativen „Wer“ und gibt die distributive rhetorische Frage im Deutschen natürlich wieder.
- source_word: אֶת אַרְצָם
  choice: sein Land
  rationale: Der hebräische Pluralsuffix bezieht sich distributiv auf die jeweiligen Götter und ihre Länder. Nach dem singularischen „Wer“ ist „sein Land“ im Deutschen idiomatisch.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die wörtliche Metapher für Macht und Verfügungsgewalt ist im Deutschen verständlich und wird an beiden Stellen bewahrt.
- source_word: כִּי יַצִּיל
  choice: sodass … retten sollte
  rationale: Die Verbindung drückt die höhnische Schlussfolgerung bzw. Herausforderung aus. „Sollte“ bewahrt den rhetorisch-ungläubigen Ton des Imperfekts.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ macht den Kontrast zwischen den Göttern der Länder und Israels Gott ausdrücklich sichtbar, ohne den Namen durch einen Titel zu ersetzen.
- issue: Modalität der abschließenden Herausforderung
  choice: retten sollte
  alternative: retten wird
  rationale: Die Formulierung bewahrt den spöttischen Zweifel des assyrischen Sprechers; sie stellt keine neutrale Zukunftsaussage dar.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Hand-Metapher bleibt erhalten; die Satzform bewahrt die scharfe rhetorische Herausforderung des assyrischen Redners.
