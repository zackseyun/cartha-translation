source:
  edition: WLC
  text: וַ/יֶּ֧גֶל מֶֽלֶךְ אַשּׁ֛וּר אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יַּנְחֵ֞/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: de
  text: Der König von Assyrien verschleppte Israel[b] nach Assyrien und siedelte sie in Halah, am Habor, dem Fluss von Gosan,[a] und in den Städten der Meder an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „am Habor, dem Fluss bei Gosan“ oder „am Fluss Habor in Gosan“. Die genaue geografische Beziehung der Namen ist im Hebräischen nicht eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: „Israel“ bezeichnet hier das Nordreich und die von dort verschleppte Bevölkerung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: verschleppte
  rationale: Der Hifil von גלה bezeichnet hier die erzwungene Wegführung ins Exil. „Verschleppte“ gibt den Zwang und den politischen Zusammenhang in natürlichem Deutsch wieder.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Klare und idiomatische Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name bezeichnet hier das Nordreich als kollektive Größe und schließt dessen verschleppte Bevölkerung ein, ohne den politischen Bezug aufzulösen.
- source_word: אַשּׁוּרָה
  choice: nach Assyrien
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf Assyrien zu; „nach Assyrien“ ist die übliche deutsche Ortsangabe.
- source_word: וַיַּנְחֵם
  choice: siedelte sie … an
  rationale: Die kausative Form bezeichnet im Zusammenhang die Ansiedlung der Verschleppten an zugewiesenen Orten. „Ansiedeln“ ist im Deutschen präzise und idiomatisch.
- source_word: בַּחְלַח
  choice: in Halach
  rationale: Der Ortsname wird nach einer im Deutschen gebräuchlichen, quellennahen Umschrift wiedergegeben.
- source_word: וּבְחָבוֹר
  choice: am Habor
  rationale: Da Habor durch die folgende Apposition als Fluss bestimmt wird, gibt „am“ die geografische Lage natürlich wieder.
- source_word: נְהַר גּוֹזָן
  choice: dem Fluss von Gosan
  rationale: Die Apposition und die Constructus-Verbindung werden transparent wiedergegeben. Die genaue Beziehung zwischen Fluss und Gosan bleibt dabei wie im Hebräischen offen.
- source_word: וְעָרֵי מָדָי
  choice: und in den Städten der Meder
  rationale: Direkte, natürliche Wiedergabe der Constructus-Verbindung; מָדַי bezeichnet die Meder beziehungsweise ihr Gebiet.
theological_decisions:
- issue: Referenz von „Israel“
  choice: Der Eigenname „Israel“ bleibt im Haupttext stehen.
  alternative: „die Israeliten“ oder „die Bevölkerung des Nordreichs“
  rationale: Das Hebräische bezeichnet das Nordreich kollektiv als „Israel“. Eine erläuternde Fußnote klärt den historischen Bezug, ohne ihn im Text interpretierend einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verschleppte“ macht den Zwang der Deportation deutlich; „siedelte … an“ beschreibt knapp die anschließende Zuweisung neuer Wohnorte. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken.
