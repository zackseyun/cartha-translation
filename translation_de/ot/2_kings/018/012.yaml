  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: de
  text: weil sie nicht auf die Stimme Jahwes, ihres Gottes, hörten[a], sondern seinen ganzen Bund brachen[b], alles, was Mose, der Diener Jahwes, geboten hatte. Sie hörten nicht darauf und taten es nicht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie Jahwe, ihrem Gott, nicht gehorchten“. Die hebräische Wendung „auf die Stimme hören“ schließt häufig Gehorsam ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „seinen Bund übertraten“ oder „verletzten“.'
    reason: lexical_alternative
  - marker: c
    text: Die erneute Verneinung des Hörens greift den Anfang des Verses auf und betont die anhaltende Weigerung, das Gebotene zu befolgen.
    reason: literary_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: weil
  rationale: Die Wendung gibt den Grund für die im vorherigen Vers geschilderte Wegführung an; „weil“ drückt diesen kausalen Anschluss natürlich aus.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: auf die Stimme … hören
  rationale: Die konkrete hebräische Ausdrucksweise bleibt erhalten, während der darin mitschwingende Sinn des Gehorsams durch den Kontext deutlich wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  choice: seinen Bund brachen
  rationale: עבר mit בְּרִית bezeichnet hier die Verletzung eines Bundes. „Einen Bund brechen“ ist im Deutschen klar, würdig und idiomatisch.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: nämlich alles, was … geboten hatte
  rationale: '„Nämlich“ macht die appositionelle Beziehung verständlich: Der gebrochene Bund wird inhaltlich mit dem von Mose Gebotenen verbunden, ohne die hebräische Spannung aufzulösen.'
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Mose, der Diener Jahwes
  rationale: „Diener“ bewahrt den ehrenden und amtlichen Charakter des Titels besser als „Sklave“.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: Sie hörten nicht darauf und handelten nicht danach
  rationale: Die Wiederholung von „hören“ bleibt sichtbar; „danach handeln“ gibt den praktischen Vollzug des Gebotenen im natürlichen Deutschen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen unmittelbar. Die Transliteration bewahrt seinen Charakter als Eigenname.
- issue: Ob שׁמע ausdrücklich mit „gehorchen“ wiederzugeben ist
  choice: auf die Stimme hören
  alternative: gehorchen
  rationale: Das hebräische Idiom umfasst Gehorsam, doch die konkrete Bildsprache und die Wiederholung im Vers sollen erhalten bleiben. Eine Fußnote nennt die sinngemäße Alternative.
- issue: Beziehung zwischen „seinem Bund“ und „alles, was Mose … geboten hatte“
  choice: erläuternde Apposition mit „nämlich“
  alternative: „und alles übertraten, was Mose … geboten hatte“
  rationale: Das zweite אֵת kann die vorangehende Aussage näher bestimmen. Die Übersetzung lässt erkennen, dass das von Mose Gebotene den Bund inhaltlich erläutert, ohne daraus eine eigenständige zusätzliche Handlung zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Vers bleibt als kausaler Anschluss an den vorherigen Satz kleingeschrieben. Die Wiederholung des Hörens und die Bundessprache des Hebräischen werden bewahrt; erläuternde Zusätze beschränken sich auf das für verständliches Deutsch Nötige.
