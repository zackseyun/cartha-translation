  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: de
  text: Da sandte der König von Assyrien aus Lachisch den Tartan, den Rabsaris und den Rabschake[a] mit einem großen Heer zu König Hiskia nach Jerusalem. Sie zogen hinauf und kamen nach Jerusalem. Sie zogen hinauf, kamen und stellten sich an der Wasserleitung des oberen Teiches auf, die an der Straße zum Wäscherfeld[b] liegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tartan, Rabsaris und Rabschake sind wahrscheinlich assyrische Amtstitel und keine Eigennamen. Als mögliche Funktionsbezeichnungen werden unter anderem „Oberbefehlshaber“, „oberster Hofbeamter“ und „oberster Mundschenk“ erwogen; die genaue Bedeutung ist teilweise unsicher.
    reason: cultural_note
  - marker: b
    text: 'Traditionell: „Walkerfeld“. Gemeint ist ein Gelände, auf dem Textilien gewaschen, gebleicht oder bearbeitet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן וְאֶת רַב סָרִיס וְאֶת רַב שָׁקֵה
  choice: den Tartan, den Rabsaris und den Rabschake
  rationale: Die drei Ausdrücke sind wahrscheinlich assyrische Amtstitel. Die im Deutschen eingebürgerten Umschriften bewahren ihren fremden Verwaltungscharakter, ohne die jeweils unsichere Amtsfunktion vorschnell festzulegen.
- source_word: בְּחֵיל כָּבֵד
  choice: mit einem großen Heer
  rationale: חַיִל bezeichnet hier eine Streitmacht, und כָּבֵד hebt deren beträchtliche Stärke oder Größe hervor. „Großes Heer“ ist idiomatisches modernes Deutsch und gibt den militärischen Sinn klar wieder.
- source_word: וַיַּעֲלוּ וַיָּבֹאוּ ... וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: Sie zogen hinauf und kamen ... Sie zogen hinauf, kamen und stellten sich ... auf
  rationale: Die auffällige Wiederholung der hebräischen Verbfolge bleibt erhalten. „Hinaufziehen“ bewahrt zugleich die mit Jerusalem verbundene Aufstiegsrichtung.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: Wasserleitung des oberen Teiches
  rationale: תְעָלָה bezeichnet einen Wasserkanal oder eine Leitung; בְּרֵכָה einen Teich beziehungsweise ein Sammelbecken. Die gewählte Fassung ist verständlich und topografisch passend.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: Straße zum Wäscherfeld
  rationale: מְסִלָּה bezeichnet eine ausgebaute Straße oder einen Weg. כּוֹבֵס ist jemand, der Textilien wäscht oder bleicht; „Wäscherfeld“ ist heute verständlicher als das traditionelle „Walkerfeld“.
