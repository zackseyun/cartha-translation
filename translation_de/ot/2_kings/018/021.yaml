  text: עַתָּ֡ה הִנֵּ֣ה בָטַ֣חְתָּ לְּ/ךָ֡ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: de
  text: 'Sieh doch, du verlässt dich auf Ägypten, auf diesen zerbrochenen Rohrstab[a]: Wenn sich jemand[b] darauf stützt, fährt der Rohrstab ihm in die Handfläche und durchbohrt sie. So ist der Pharao, der König von Ägypten, für alle, die sich auf ihn verlassen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesen geknickten Rohrstab“. Das hebräische Adjektiv kann etwas Geknicktes, Zerschlagenes oder Zerbrochenes bezeichnen. „Zerbrochen“ passt zu einem Rohr, das als Stütze versagt und die Hand verletzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Mann“. Die männliche Einzahl wird hier allgemein für einen beliebigen Menschen gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die aufmerksamkeitslenkende Partikel wird als gegenwärtiger, eindringlicher Hinweis wiedergegeben, ohne ein im Hebräischen nicht ausdrücklich vorhandenes zeitliches „jetzt“ einzuführen.
- source_word: בָטַחְתָּ לְּךָ ... עַל מִצְרַיִם
  choice: du verlässt dich auf Ägypten
  rationale: בטח bezeichnet Vertrauen beziehungsweise Sichverlassen. Das Perfekt beschreibt im Kontext des Spottworts die gegenwärtige Haltung; die deutsche reflexive Wendung ist idiomatisch und bewahrt das Bild der Abhängigkeit.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: diesen geknickten Rohrstab
  rationale: מִשְׁעֶנֶת ist eine Stütze, auf die man sich lehnt; קָנֶה ist ein Rohr. רָצוּץ kann „geknickt“, „zerbrochen“ oder „zerschlagen“ bedeuten. „Geknickter Rohrstab“ ist im Deutschen anschaulich und erklärt, weshalb die vermeintliche Stütze splittert und verletzt.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: Wenn sich jemand darauf stützt
  rationale: Das Nifal von סמך bezeichnet das Aufstützen oder Anlehnen. Die relative Konstruktion hat hier bedingten Sinn. „Jemand“ gibt das generisch verwendete אִישׁ natürlich wieder.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: dringt er ihm in die Handfläche und durchbohrt sie
  rationale: בוא bezeichnet das Hineingelangen, כַּף hier die Handfläche und נקב das Durchbohren oder Durchstechen. Das Pronomen „er“ greift den Rohrstab auf; „sie“ bezieht sich wie das hebräische feminine Suffix auf die Handfläche.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: So ist der Pharao, der König von Ägypten
  rationale: כֵּן zieht ausdrücklich den Vergleich zwischen dem verletzenden Rohrstab und dem Pharao. Die Apposition wird im Deutschen zur Klarheit mit Artikeln und Kommas gesetzt.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: für alle, die sich auf ihn verlassen
  rationale: 'Die Präposition ל bezeichnet hier die Beziehung beziehungsweise Wirkung: So erweist sich der Pharao für diejenigen, die auf ihn vertrauen. Das Partizip wird als allgemeine Aussage wiedergegeben.'
