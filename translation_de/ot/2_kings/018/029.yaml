  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥יא לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּי לֹ֣א יוּכַ֔ל לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: de
  text: 'So spricht der König: Lasst euch nicht von Hiskia täuschen,[a] denn er wird euch nicht aus seiner Hand retten können.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »irreführen«. Das hebräische Verb kann bedeuten, jemanden in die Irre zu führen oder zu täuschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »aus seiner Hand«; das ist ein Bild für die Macht eines Menschen. Im Paralleltext Jesaja 36,14 steht: »aus meiner Hand«.'
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: So spricht der König
  rationale: Die geläufige deutsche Botenformel bewahrt den feierlich-offiziellen Ton der königlichen Verkündigung; das hebräische Perfekt wird in dieser Formel idiomatisch mit Präsens wiedergegeben.
- source_word: אַל יַשִּׁיא לָכֶם חִזְקִיָּהוּ
  choice: Lasst euch nicht von Hiskia täuschen
  rationale: Die Konstruktion wird im Deutschen natürlich als „sich von jemandem täuschen lassen“ formuliert. Das Verb bezeichnet hier irreführendes Täuschen; „irreführen“ bleibt eine mögliche Alternative.
- source_word: כִּי לֹא יוּכַל
  choice: denn er wird … nicht … können
  rationale: כִּי begründet die Warnung; die Zukunftsform gibt die auf die erwartete Rettung gerichtete Behauptung des Sprechers wieder.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: euch … retten
  rationale: „Retten“ ist im militärisch-politischen Zusammenhang klar, würdig und im modernen Deutsch natürlicher als „erretten“.
- source_word: מִיָּדוֹ
  choice: aus seiner Hand
  rationale: Die wörtliche Wiedergabe erhält das verständliche hebräische Bild für Macht beziehungsweise Gewalt und folgt dem maskulinen Suffix der vorliegenden Textfassung.
theological_decisions:
- issue: Bezug und Textform von מִיָּדוֹ („aus seiner Hand“)
  choice: 'Die dritte Person wird entsprechend dem WLC beibehalten: „aus seiner Hand“.'
  alternative: „aus meiner Hand“, wie im Paralleltext Jesaja 36,14; sinngemäß auch „aus seiner Gewalt“.
  rationale: Die Übersetzung folgt der vorliegenden hebräischen Textform und harmonisiert sie nicht mit dem Jesajaparallel. Die Fußnote macht die auffällige Variante transparent, ohne sie im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Proklamationsformel „So spricht“ bleibt erhalten; ansonsten werden gut verständliche, gegenwärtige Formulierungen verwendet. Sämtliche Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Textstellen.
