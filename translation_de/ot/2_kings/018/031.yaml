base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: de
  text: 'Hört nicht auf Hiskia! Denn so spricht der König von Assyrien: »Schließt Frieden mit mir[a] und kommt zu mir heraus! Esst, jeder von seinem eigenen Weinstock und seinem eigenen Feigenbaum, und trinkt, jeder, das Wasser aus seiner eigenen Zisterne.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Macht mit mir einen Segen.« Die hebräische Wendung meint hier wahrscheinlich, Frieden zu schließen oder sich auf günstige Bedingungen zu einigen.'
    reason: Die ungewöhnliche wörtliche Form mit »Segen« und ihre kontextuelle Deutung sollen transparent bleiben.
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: Hört nicht auf Hiskia!
  rationale: שׁמע mit אֶל bedeutet hier, jemandem Gehör zu schenken beziehungsweise auf ihn zu hören. Die deutsche Wendung bewahrt sowohl den unmittelbaren Sinn als auch den mitschwingenden Gedanken des Befolgens.
- source_word: כִּי כֹה אָמַר מֶלֶךְ אַשּׁוּר
  choice: Denn so spricht der König von Assyrien
  rationale: Die feste Botenformel wird knapp und würdevoll wiedergegeben. Das hebräische Perfekt אָמַר kann in dieser Formel im Deutschen idiomatisch mit dem Präsens »spricht« erscheinen.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Schließt Frieden mit mir
  rationale: Die ungewöhnliche Wendung, wörtlich mit »Segen«, bezeichnet im Kontext das Eingehen günstiger Bedingungen beziehungsweise eines Friedensschlusses. Die wörtliche Form wird wegen ihrer Mehrdeutigkeit in einer Fußnote dokumentiert.
- source_word: וּצְאוּ אֵלַי
  choice: und kommt zu mir heraus
  rationale: Die konkrete Bewegungsbedeutung von יצא bleibt erhalten. Dass das Herauskommen aus der belagerten Stadt zugleich Unterwerfung bedeutet, wird nicht zusätzlich in den Text eingetragen.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: Dann soll jeder von seinem eigenen Weinstock und seinem eigenen Feigenbaum essen
  rationale: אִישׁ ist distributiv gebraucht. »Jeder« ist im modernen Deutschen die natürliche, quellengenaue Wiedergabe; »eigenen« verdeutlicht die Possessivsuffixe und die versprochene ungestörte Nutzung.
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: und das Wasser aus seiner eigenen Zisterne trinken
  rationale: בּוֹר bezeichnet hier eine Zisterne beziehungsweise einen Wasserspeicher, nicht notwendig einen Brunnen mit eigener Quelle. »Zisterne« ist daher sachlich präzise.
theological_decisions:
- issue: Politische Wendung עֲשׂוּ אִתִּי בְרָכָה
  choice: Schließt Frieden mit mir
  alternative: Macht mit mir einen Segen / Kommt mit mir zu einer Übereinkunft
  rationale: Die Aussage ist Teil assyrischer Propaganda und bietet offenbar günstige Kapitulations- oder Friedensbedingungen an. Die idiomatische Haupttextfassung vermittelt diese Funktion, während die Fußnote die auffällige Bildsprache und verbleibende lexikalische Spannung offenlegt.
- issue: Distributiver Gebrauch von אִישׁ
  choice: jeder
  alternative: jeder Mann
  rationale: Das maskuline Singularwort bezeichnet hier distributiv die einzelnen Angehörigen der angesprochenen Bevölkerung. »Jeder« ist im Deutschen generisch, natürlich und bewahrt den Einzelbezug, ohne eine sachlich unbegründete Beschränkung auf erwachsene Männer zu behaupten.
translation_notes:
  register: Moderne, klare Standardsprache mit würdigem Ton. Die direkte Rede wird lebendig, aber nicht umgangssprachlich formuliert. Die wiederholte Besitzanzeige unterstreicht das assyrische Versprechen von Sicherheit und eigenem Ertrag.
