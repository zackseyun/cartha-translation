id: 2KI.18.5
reference: 2 Kings 18:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: de
  text: Er vertraute auf Jahwe[a], den Gott Israels. Nach ihm gab es unter allen Königen von Juda keinen wie ihn, auch nicht unter denen, die vor ihm gewesen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der persönliche Name Gottes; traditionell oft mit »der HERR« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: auf Jahwe
  rationale: Die Präposition ב bezeichnet bei בטח die Person, auf die man vertraut; im Deutschen ist »auf jemanden vertrauen« idiomatisch. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Status-constructus-Verbindung bezeichnet Jahwe als Israels Gott und steht appositionell zum Gottesnamen.
- source_word: בָּטָח
  choice: vertraute
  rationale: Das Qal-Perfekt von בטח bedeutet »vertrauen, sich verlassen auf«. »Vertraute« bewahrt die knappe verbale Aussage.
- source_word: וְאַחֲרָיו
  choice: Nach ihm
  rationale: Die Wendung ist zeitlich zu verstehen. Das einleitende ו muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: לֹא הָיָה כָמֹהוּ
  choice: gab es … keinen wie ihn
  rationale: Die hebräische Vergleichsformel hebt seine Einzigartigkeit hervor und wird in natürlichem Deutsch mit »keinen wie ihn« wiedergegeben.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: unter allen Königen von Juda
  rationale: ב bezeichnet hier den Kreis, innerhalb dessen verglichen wird; »unter« ist dafür die natürliche deutsche Entsprechung.
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: auch nicht unter denen, die vor ihm gewesen waren
  rationale: Der Relativsatz erweitert den Vergleich ausdrücklich auf die früheren Könige. »Auch nicht« macht die im Hebräischen knappe Fortführung des verneinten Vergleichs verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. »Jahwe« gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite des Vergleichs mit Hiskia
  choice: Vergleich mit den späteren und den früheren Königen Judas
  alternative: Beschränkung des Vergleichs auf die Zeit nach Hiskia
  rationale: וְאַחֲרָיו eröffnet den Blick auf die Zeit nach ihm, während der anschließende Relativsatz ausdrücklich auch diejenigen vor ihm einschließt. Die Übersetzung bewahrt beide Vergleichsrichtungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Vergleichsstruktur, wird jedoch so gegliedert, dass die zeitliche Zweiteilung für heutige Leser klar verständlich ist.
