id: 2KI.18.23
reference: 2 Kings 18:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י אֶת מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: de
  text: 'Nun denn, geh doch mit meinem Herrn, dem König von Assyrien, eine Wette ein[a]: Ich gebe dir zweitausend Pferde, wenn du für sie Reiter stellen kannst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geh mit meinem Herrn eine Verpflichtung ein“ oder „triff mit meinem Herrn eine Vereinbarung“. Das hebräische Verb kann das Eingehen einer Vereinbarung oder das Einstehen für etwas bezeichnen; hier meint es wahrscheinlich eine spöttische Wette oder Herausforderung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: geh doch … eine Wette ein
  rationale: Das Hitpael von ערב bezeichnet hier im Zusammenhang der spöttischen Herausforderung am ehesten das Eingehen einer Wette oder eines Wettstreits. „doch“ gibt die auffordernde Partikel נָא natürlich wieder.
- source_word: אֶת אֲדֹנִי אֶת מֶלֶךְ אַשּׁוּר
  choice: mit meinem Herrn, dem König von Assyrien
  rationale: אֶת bezeichnet nach הִתְעָרֶב den Gegenpart. „Herr“ wahrt die politische Anrede für den assyrischen König, ohne hier einen Gottesnamen anzunehmen.
- source_word: וְאֶתְּנָה לְךָ
  choice: Ich gebe dir
  rationale: Die Kohortativform formuliert im Rahmen der Herausforderung ein nachdrückliches Angebot; das Deutsche Präsens wirkt in direkter Rede natürlich und verbindlich.
- source_word: אַלְפַּיִם סוּסִים
  choice: zweitausend Pferde
  rationale: Direkte Wiedergabe der Zahl und des Substantivs.
- source_word: אִם תּוּכַל
  choice: wenn du … kannst
  rationale: Die Bedingung stellt Judas Fähigkeit spöttisch infrage. „wenn“ entspricht hier einer real formulierten, rhetorisch jedoch höhnischen Bedingung.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: für sie Reiter stellen
  rationale: Die wörtliche Vorstellung, sich Reiter auf den Pferden zu verschaffen, wird idiomatisch wiedergegeben. „Reiter stellen“ bewahrt den militärischen Sinn und den Vorwurf mangelnder Mannschaftsstärke.
theological_decisions: []
translation_notes:
  register: Moderne, würdige direkte Rede mit deutlich spöttischem Unterton. „Mein Herr“ bezeichnet den menschlichen Oberherrn des Sprechers. Der Doppelpunkt macht das konkrete Wettangebot transparent, ohne den Sinn zu erweitern.
