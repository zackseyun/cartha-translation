  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: de
  text: 'Du sagst: »Das ist doch nur Gerede.« Doch Rat und Stärke braucht man für den Krieg. Auf wen vertraust du nun, dass du dich gegen mich erhoben hast?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: Gerede
  rationale: Wörtlich »Wort der Lippen«; im Zusammenhang bezeichnet die Wendung bloßes Reden ohne die für den Krieg nötige Substanz. »Gerede« gibt dies im modernen Deutschen knapp und natürlich wieder.
- source_word: עֵצָה
  choice: kluger Rat
  rationale: Bezeichnet Beratung, Plan oder strategische Klugheit. »Kluger Rat« passt zum militärischen Zusammenhang, ohne den Sinn auf eine einzelne Strategie zu verengen.
- source_word: גְבוּרָה
  choice: Stärke
  rationale: Kann Kraft, Stärke oder militärische Macht meinen. »Stärke« wahrt die Bedeutungsbreite und bildet mit »kluger Rat« ein natürliches Begriffspaar.
- source_word: בָטַחְתָּ
  choice: vertraust du
  rationale: Das Verb bezeichnet vertrauensvolles Sich-Verlassen auf jemanden oder etwas. Das deutsche Präsens entspricht der gegenwärtigen rhetorischen Herausforderung.
- source_word: מָרַדְתָּ
  choice: du dich gegen mich auflehnst
  rationale: Das Verb bedeutet rebellieren bzw. sich gegen eine Oberhoheit erheben. »Sich auflehnen« ist gegenwärtig und würdevoll und bewahrt den politischen Vorwurf.
theological_decisions:
- issue: Bezug und Zeichensetzung des ersten Satzteils
  choice: »Das ist doch nur Gerede.« Doch für den Krieg braucht man klugen Rat und Stärke.
  alternative: »Nur Gerede! Rat und Stärke sind für den Krieg da.«
  rationale: Der hebräische Text ist syntaktisch knapp und kann unterschiedlich gegliedert werden. Die gewählte Fassung folgt der naheliegenden Gegenüberstellung zwischen bloßen Worten und den tatsächlichen Erfordernissen des Krieges, ohne eine besondere theologische Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede bleibt pointiert; »doch« und »nun« bilden die argumentative Bewegung des hebräischen Textes ab.
