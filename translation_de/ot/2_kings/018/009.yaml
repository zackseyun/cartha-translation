review_pass:
  verdict: revise
  source_fidelity: Die Zeitangaben, die Identifizierung Salmanassars, der militärische Zug gegen Samaria und die Belagerung entsprechen dem hebräischen Text. Das einleitende וַיְהִי darf im modernen Deutschen idiomatisch unausgedrückt bleiben. Die vorliegende Stellung von „des Königs von Israel“ lässt jedoch unnötig offen, ob der Titel Hoschea oder Ela zugeordnet wird; im Hebräischen gehört er eindeutig zu Hoschea.
  naturalness: Die Erzählprosa ist insgesamt modern und gut lesbar. Die Genitivkette „Hoscheas, des Sohnes Elas, des Königs von Israel“ wirkt allerdings schwerfällig und erzeugt einen vermeidbaren falschen Anschluss. Ein Relativsatz stellt die Bezüge natürlich und eindeutig her.
  terminology: „Regierungsjahr“, „Salmanassar“, „Assyrien“, „gegen Samaria heraufziehen“ und „belagern“ sind sachgerecht und im modernen deutschen Bibelregister angemessen. Keine theologischen Fachbegriffe sind betroffen.
  issues:
  - severity: medium
    issue: Mehrdeutiger Bezug von „des Königs von Israel“
    rationale: In „Hoscheas, des Sohnes Elas, des Königs von Israel“ kann der unmittelbar vorausgehende Genitiv „Elas“ als Bezug des Königstitels gelesen werden. Der hebräische Ausdruck מֶלֶךְ יִשְׂרָאֵל bezeichnet hingegen Hoschea. Die deutsche Fassung soll diese Zuordnung explizit machen.
  revised_text: Im vierten Regierungsjahr König Hiskias – es war das siebte Regierungsjahr Hoscheas, der ein Sohn Elas und König von Israel war – zog Salmanassar, der König von Assyrien, gegen Samaria herauf und belagerte die Stadt.
