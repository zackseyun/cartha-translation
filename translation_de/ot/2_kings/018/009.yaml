  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: de
  text: Im vierten Regierungsjahr König Hiskias – es war das siebte Regierungsjahr Hoscheas, der ein Sohn Elas und König von Israel war – zog Salmanassar, der König von Assyrien, gegen Samaria herauf und belagerte die Stadt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[nicht eigens wiedergegeben]'
  rationale: Die hebräische narrative Einleitungsformel eröffnet hier die Zeitangabe. Im modernen Deutschen wird ihre Funktion natürlich durch den vorangestellten Datierungsrahmen erfüllt; „Und es geschah“ wäre möglich, aber unnötig schwerfällig.
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: Im vierten Regierungsjahr König Hiskias
  rationale: Die Ergänzung „Regierungsjahr“ verdeutlicht die im Hebräischen vorausgesetzte Königsdatierung und ist im Deutschen idiomatisch.
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ
  choice: es war das siebte Regierungsjahr Hoscheas
  rationale: הִיא verbindet die beiden synchronen Regierungsangaben. Der deutsche Einschub bewahrt diese Funktion klar und natürlich.
- source_word: בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: des Sohnes Elas, des Königs von Israel
  rationale: Die Apposition bezieht den Königstitel eindeutig auf Hoschea und bewahrt zugleich die Abstammungsangabe.
- source_word: עָלָה ... עַל שֹׁמְרוֹן
  choice: zog ... gegen Samaria herauf
  rationale: עלה bezeichnet im militärischen Zusammenhang den Feldzug gegen einen Ort; „heraufziehen gegen“ erhält sowohl die Bewegungs- als auch die feindliche Komponente.
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: Salmanassar, der König von Assyrien
  rationale: „Salmanassar“ ist die etablierte deutsche Namensform; die Apposition wird im Deutschen mit bestimmtem Artikel natürlich wiedergegeben.
- source_word: וַיָּצַר עָלֶיהָ
  choice: und belagerte die Stadt
  rationale: צור bezeichnet das Einschließen beziehungsweise Belagern einer Stadt. „Die Stadt“ macht den femininen Rückbezug auf Samaria im Deutschen eindeutig.
