source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: de
  text: Wie könntest du da auch nur einen einzigen Statthalter unter den geringsten Dienern meines Herrn zurückschlagen[a], wo du doch auf Ägypten wegen der Streitwagen und Reiter vertraust?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Gesicht ... zurückwenden“; eine hebräische Wendung im Sinn von „abwehren“ oder „zurückschlagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: zurückschlagen
  rationale: Der Hifil von שוב zusammen mit אֵת פְּנֵי ist eine militärische Wendung für das Zurückweisen oder Abwehren eines Gegners. „Zurückschlagen“ gibt den Sinn im Deutschen natürlich wieder.
- source_word: פַחַת
  choice: Statthalter
  rationale: Das Wort bezeichnet im neuassyrischen Verwaltungs- und Militärkontext einen Provinzbeamten beziehungsweise Statthalter, der zugleich militärische Befehlsgewalt haben konnte. „Statthalter“ wahrt diese institutionelle Bedeutung besser als das enger militärische „Hauptmann“.
- source_word: אַחַד
  choice: auch nur einen einzigen
  rationale: Die verstärkende Formulierung bringt die spöttische rhetorische Zuspitzung des Zahlworts im Kontext zum Ausdruck.
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: unter den geringsten Dienern meines Herrn
  rationale: „Geringsten“ bezeichnet Rang und Bedeutung, nicht Körpergröße; „mein Herr“ gibt den menschlichen Vorgesetzten des Sprechers wieder.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: wo du doch auf Ägypten vertraust
  rationale: בטח על bedeutet „auf jemanden vertrauen/sich verlassen“. „Wo ... doch“ bildet den vorwurfsvollen Zusammenhang der rhetorischen Frage idiomatisch ab.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: weil es dir Streitwagen und Reiter stellen soll
  rationale: Die Präposition bezeichnet hier den Zweck beziehungsweise die erhofften militärischen Mittel. Die explizite Formulierung macht im Deutschen deutlich, weshalb Juda sich auf Ägypten verlässt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Verhöhnung wird durch „auch nur einen einzigen“ und „wo ... doch“ erhalten. „Statthalter“ bewahrt die mögliche administrative und militärische Funktion des assyrischen Amtsträgers; die hebräische Bildsprache wird in der Fußnote dokumentiert.
