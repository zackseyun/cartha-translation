base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: de
  text: Da riefen sie nach dem König. Und Eljakim, der Sohn Hilkijas, der dem Palast vorstand,[a] kam zu ihnen heraus, zusammen mit Schebna, dem Schreiber,[b] und Joach, dem Sohn Asafs, dem Protokollführer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der über dem Haus war“; gemeint ist ein hoher königlicher Verwaltungsbeamter, möglicherweise der Palastvorsteher.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Sekretär“.'
    reason: lexical_alternative
  - marker: c
    text: Die genaue Aufgabe dieses königlichen Beamten ist ungewiss; auch „Chronist“ oder „Kanzler“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: Da riefen sie nach dem König
  rationale: קרא mit אֶל kann ein Rufen zu oder nach jemandem bezeichnen. Im diplomatischen Zusammenhang ist „nach dem König rufen“ natürlich und gibt die Bitte um sein Erscheinen wieder, ohne einen förmlichen Befehl zu unterstellen.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: Darauf kam … zu ihnen hinaus
  rationale: יצא bezeichnet das Hinausgehen beziehungsweise Herauskommen. „Kam … zu ihnen hinaus“ bildet die Bewegung aus der Stadt zu der assyrischen Gesandtschaft idiomatisch ab.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Eljakim, der Sohn Hilkijas
  rationale: Die Personennamen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die hebräische Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: der dem Palast vorstand
  rationale: Die Wendung bezeichnet einen hohen Verwaltungstitel. „Dem Palast vorstehen“ vermittelt die Leitungsfunktion und gibt בַּיִת in seinem königlichen Kontext sinnvoll wieder, ohne die genaue Zuständigkeit enger festzulegen.
- source_word: הַסֹּפֵר
  choice: der Schreiber
  rationale: סֹפֵר bezeichnet hier einen Verwaltungsbeamten, der als Schreiber oder Sekretär tätig war. „Schreiber“ bleibt nah am Hebräischen und ist verständlich.
- source_word: הַמַּזְכִּיר
  choice: der Kanzler
  rationale: מַזְכִּיר ist hier der Titel eines hohen königlichen Beamten, vermutlich mit Zuständigkeit für Akten, Eingaben oder amtliche Erinnerung. „Kanzler“ ist im Deutschen eine knappe funktionale Entsprechung; die Unsicherheit über das genaue Amt wird in einer Fußnote kenntlich gemacht.
