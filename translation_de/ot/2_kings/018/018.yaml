  naturalness: Der Text ist überwiegend natürliches modernes Standarddeutsch. »Darauf« fügt allerdings eine nicht ausdrücklich markierte Folgerung hinzu; ein schlichtes »und« entspricht dem Erzählanschluss besser. Die Fußnotenanker werden klarer unmittelbar an die jeweils erläuterte Amtsbezeichnung gesetzt.
  terminology: »Schreiber« und die Erklärung zu dem über den Palast/Haushalt gesetzten Beamten sind angemessen. Für הַמַּזְכִּיר ist »Protokollführer« als vorsichtige funktionale Wiedergabe geeigneter als »Kanzler«, sofern die verbleibende historische Unsicherheit in der Fußnote ausdrücklich genannt wird.
