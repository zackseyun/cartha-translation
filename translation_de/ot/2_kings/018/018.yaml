  to: Da riefen sie nach dem König. Und Eljakim, der Sohn Hilkijas, der dem Palast vorstand,[a] kam zu ihnen heraus, zusammen mit Schebna, dem Schreiber,[b] und Joach, dem Sohn Asafs, dem Protokollführer.[c]
