base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: de
  text: 'Da sagte der Rabschake zu ihnen: »Sagt doch zu Hiskia: So spricht der Großkönig, der König von Assyrien: Was ist das für ein Vertrauen, auf das du dich verlässt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Der assyrische Amtstitel wird in der im Deutschen etablierten bibelsprachlichen Form wiedergegeben, statt ihn als Eigennamen zu erklären oder unsicher funktional zu übersetzen.
- source_word: נָא
  choice: doch
  rationale: Gibt die höflich beziehungsweise nachdrücklich abtönende Partikel in natürlichem modernem Deutsch wieder.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: der Großkönig
  rationale: Die feste königliche Titulatur wird knapp und idiomatisch wiedergegeben; zugleich bleibt ihre propagandistische Wirkung erhalten.
- source_word: מָה הַבִּטָּחוֹן הַזֶּה
  choice: Was ist das für ein Vertrauen
  rationale: Bewahrt die abwertend-herausfordernde Frageform des Hebräischen in natürlichem Deutsch.
- source_word: אֲשֶׁר בָּטָחְתָּ
  choice: auf das du dich verlässt
  rationale: Gibt das Wortspiel mit בִּטָּחוֹן und בָּטַח soweit idiomatisch möglich durch »Vertrauen« und »sich verlassen« wieder, ohne eine zeitliche Nuance zu erzwingen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist klar gestaffelt; der assyrische Herrschertitel und der herausfordernde Ton bleiben erhalten.
