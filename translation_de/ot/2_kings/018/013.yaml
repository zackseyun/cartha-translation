base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: de
  text: Im vierzehnten Regierungsjahr König Hiskias zog Sanherib, der König von Assyrien, gegen alle befestigten Städte Judas und nahm sie ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּה
  choice: Im vierzehnten Regierungsjahr König Hiskias
  rationale: Die hebräische Wendung bezeichnet in einer üblichen Datierungsformel das vierzehnte Jahr der Königsherrschaft Hiskias. „Regierungsjahr“ macht diesen Sinn im Deutschen eindeutig und natürlich; das einleitende וּ wird nicht eigens wiedergegeben, da es hier vor allem den Erzählzusammenhang fortführt.
- source_word: עָלָה ... עַל
  choice: zog ... gegen
  rationale: עלה mit עַל bezeichnet im militärischen Zusammenhang das Vorrücken gegen ein Ziel. „zog gegen“ bewahrt den Bewegungsaspekt und ist idiomatisches, würdiges Deutsch.
- source_word: סַנְחֵרִיב
  choice: Sanherib
  rationale: Im Deutschen etablierte Form des assyrischen Königsnamens.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die Apposition identifiziert Sanheribs Amt und Herrschaftsgebiet. Der Artikel entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: gegen alle befestigten Städte Judas
  rationale: הַבְּצֻרוֹת bezeichnet militärisch befestigte beziehungsweise gesicherte Städte. „befestigte Städte“ ist die klare und geläufige Wiedergabe.
- source_word: וַיִּתְפְּשֵׂם
  choice: und nahm sie ein
  rationale: Das Verb bezeichnet hier die Eroberung und Inbesitznahme der zuvor genannten Städte. „Städte einnehmen“ ist im Deutschen die natürliche militärische Formulierung; das Pronomen „sie“ gibt das hebräische Objektsuffix wieder.
