source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes recht war, ganz so, wie es sein Vater David[a] getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vater“ bedeutet hier Vorfahr in der davidischen Königslinie, nicht unmittelbarer Vater.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er tat
  rationale: Das Qal-Wayyiqtol von עשה führt die erzählte Handlung fort. Im modernen Deutschen muss das einleitende ו nicht eigens mit „und“ wiedergegeben werden.
- source_word: הַיָּשָׁר
  choice: was … recht war
  rationale: Das mit Artikel gebrauchte Adjektiv ישר ist substantiviert und bezeichnet das Rechte beziehungsweise Richtige. „Was … recht war“ ist idiomatisch und bewahrt den moralischen Bewertungscharakter.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Wendung bezeichnet Jahwes Beurteilung. Die im Deutschen verständliche bildhafte Formulierung bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: כ mit כל und אֲשֶׁר drückt umfassende Übereinstimmung mit einem Vorbild aus. „Ganz so, wie“ gibt diese vollständige Entsprechung natürlich wieder.
- source_word: עָשָׂה
  choice: getan hatte
  rationale: Das Perfekt bezeichnet Davids zeitlich vorausliegendes Handeln, das Hiskia als Maßstab dient; das deutsche Plusquamperfekt macht dieses Verhältnis deutlich.
- source_word: דָּוִד אָבִיו
  choice: sein Vater David
  rationale: Die Formulierung bewahrt die dynastische Vater-Terminologie des hebräischen Königsschemas. Da אָב auch einen Vorfahren bezeichnen kann, wird der gemeinte Sinn in einer Fußnote erklärt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ wahrt diesen Charakter, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אָבִיו in der Verbindung „sein Vater David“
  choice: Die wörtliche dynastische Formel im Haupttext beibehalten
  alternative: sein Vorfahr David
  rationale: „Vater“ stellt Hiskia in die davidische Abstammungs- und Vorbildlinie und bewahrt die theologische Resonanz der Königsformel. Die Fußnote verhindert das Missverständnis, David sei sein unmittelbarer Vater gewesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich deutsch, während das hebräische Bewertungsidiom „in den Augen Jahwes“ und die dynastische Bezeichnung „Vater“ bewusst erhalten bleiben.
