source:
  edition: WLC
  text: וַֽ/יִּלְכְּדֻ֗/הָ מִ/קְצֵה֙ שָׁלֹ֣שׁ שָׁנִ֔ים בִּ/שְׁנַת שֵׁ֖שׁ לְ/חִזְקִיָּ֑ה הִ֣יא שְׁנַת תֵּ֗שַׁע לְ/הוֹשֵׁ֨עַ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל נִלְכְּדָ֖ה שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: de
  text: Am Ende von drei Jahren nahmen sie die Stadt ein.[a] Im sechsten Regierungsjahr Hiskias – es war das neunte Jahr Hoscheas, des Königs von Israel – wurde Samaria eingenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Nach drei Jahren nahmen sie die Stadt ein.« Der hebräische Zeitausdruck lautet wörtlicher: »am Ende von drei Jahren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: nahmen sie die Stadt ein
  rationale: Das aktive Verb im Plural und der feminine Objektsuffix werden bewahrt. »Die Stadt« gibt den im Kontext eindeutigen Bezug auf Samaria natürlich wieder und vermeidet das schwerfällige »nahmen sie sie ein«.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: Am Ende von drei Jahren
  rationale: Die hebräische Zeitangabe bezeichnet das Ende des genannten Zeitraums; die relativ formnahe Wiedergabe erhält diese Nuance.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: Im sechsten Regierungsjahr Hiskias
  rationale: Die Ergänzung »Regierungsjahr« macht die übliche Königschronologie im Deutschen eindeutig, ohne den Sinn zu erweitern.
- source_word: הִיא
  choice: es war
  rationale: Das Pronomen verbindet die beiden Datierungen und kennzeichnet sie als dasselbe Jahr.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: das neunte Jahr Hoscheas, des Königs von Israel
  rationale: Die zweite Regierungsdatierung und Hoscheas Königstitel bleiben ausdrücklich erhalten.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: wurde Samaria eingenommen
  rationale: Die passive Ergebnisfeststellung des Nifal wird bewahrt; »eingenommen« nimmt denselben Wortstammgedanken wie zuvor »einnahmen« auf.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
