base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: de
  text: Zu jener Zeit schnitt Hiskia die Türen und die Türpfosten[a] des Tempels Jahwes ab, die Hiskia, der König von Juda, überzogen hatte, und gab sie dem König von Assyrien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Türrahmen“ oder „Pfeiler“. Das seltene hebräische Wort kann allgemeiner tragende Bauteile im Bereich der Tempeltüren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die übliche deutsche Erzählformel gibt die hebräische Zeitangabe natürlich und präzise wieder.
- source_word: קִצַּץ
  choice: ließ … abschneiden
  rationale: Das Verb bezeichnet ein Ab- oder Wegschneiden. Die kausative deutsche Formulierung ist idiomatisch und lässt offen, ob Hiskia persönlich handelte.
- source_word: דַּלְתוֹת
  choice: die Türen
  rationale: Die geläufige Bedeutung ist hier klar und im Deutschen ohne die technischere Präzisierung „Türflügel“ verständlich.
- source_word: הֵיכַל יְהוָה
  choice: des Tempels Jahwes
  rationale: הֵיכָל bezeichnet in diesem Kontext eindeutig den Jerusalemer Tempel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הָאֹמְנוֹת
  choice: die Türpfosten
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich Bauteile im Bereich der Türen; „Türpfosten“ passt zum unmittelbaren Zusammenhang, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: צִפָּה
  choice: hatte überziehen lassen
  rationale: Das Verb bezeichnet das Überziehen oder Verkleiden einer Oberfläche, häufig mit Metall. Die Formulierung vermeidet die Ergänzung eines im Vers nicht ausdrücklich genannten Materials.
- source_word: וַיִּתְּנֵם
  choice: und gab sie
  rationale: Die einfache deutsche Erzählform entspricht dem hebräischen Verb; das Pronomen nimmt die zuvor genannten abgetrennten Bauteile auf.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: dem König von Assyrien
  rationale: Direkte und im Deutschen übliche Wiedergabe der hebräischen Fügung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn in einer im modernen Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt nah am hebräischen Erzählfluss, wird jedoch durch „ließ … abschneiden“ und die Apposition natürlich deutsch gestaltet.
