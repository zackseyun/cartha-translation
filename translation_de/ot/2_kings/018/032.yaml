source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: de
  text: 'bis ich komme und euch wegführe in ein Land, das eurem eigenen Land gleicht: ein Land mit Getreide und jungem Wein[a], ein Land mit Brot und Weinbergen, ein Land mit Olivenöl und Honig. Dann werdet ihr leben und nicht sterben. Hört nicht auf Hiskia, denn er führt euch in die Irre, wenn er sagt: »Jahwe wird uns retten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Most“. Das hebräische Wort תִּירוֹשׁ bezeichnet frischen beziehungsweise jungen Wein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: bis ich komme
  rationale: Die Wendung bezeichnet den künftigen Zeitpunkt, bis zu dem die Angesprochenen sich fügen sollen; „komme“ gibt בוא direkt und natürlich wieder.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: und euch wegführe
  rationale: לקח bedeutet grundsätzlich „nehmen“; im Zusammenhang der angekündigten Deportation macht „wegführen“ die Bewegung fort aus dem eigenen Land deutlich, ohne die Aussage unnötig zu verschärfen.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: in ein Land, das eurem eigenen Land gleicht
  rationale: Die Vergleichspartikel כְ bezeichnet Ähnlichkeit, nicht Identität. Die Formulierung bewahrt den werbenden Charakter der assyrischen Rede.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: ein Land mit Getreide und jungem Wein
  rationale: דגן bezeichnet Getreide allgemein. תירוש meint typischerweise frischen beziehungsweise jungen Wein und nicht bloß Wein im allgemeinen Sinn.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: ein Land mit Brot und Weinbergen
  rationale: Die konkreten Bilder „Brot“ und „Weinberge“ werden beibehalten und vermitteln den verheißenen landwirtschaftlichen Überfluss.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: ein Land mit Olivenöl und Honig
  rationale: Die hebräische Verbindung זֵית יִצְהָר ist verdichtet und bezeichnet Erzeugnisse des Ölbaums beziehungsweise Olivenöl. Die deutsche Wiedergabe nennt den natürlichen Sinn, während eine Fußnote die sprachliche Verdichtung ausweist.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: So sollt ihr leben und nicht sterben
  rationale: Die koordinierten Verbformen setzen die werbende Aufforderung fort. „So sollt ihr“ wahrt den exhortativen Charakter besser als eine rein kausale Umschreibung.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: Hört nicht auf Hiskia
  rationale: שמע אל bedeutet hier, auf jemanden zu hören beziehungsweise ihm Folge zu leisten. „Auf Hiskia hören“ ist im Deutschen unmittelbar verständlich.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: denn er führt euch in die Irre
  rationale: Das Hifil von סות kann „verleiten“, „aufwiegeln“ oder „irreführen“ bedeuten. „In die Irre führen“ passt zur Anschuldigung des Redners, ohne als Erzählerurteil eine tatsächliche Täuschung festzustellen.
- source_word: לֵאמֹר
  choice: wenn er sagt
  rationale: Der Infinitiv führt den Inhalt der behaupteten Irreführung ein. „Wenn er sagt“ ist im Deutschen idiomatisch und erhält den wiederholten beziehungsweise situationsbezogenen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname transliteriert und nicht durch einen Titel ersetzt.
- source_word: יַצִּילֵנוּ
  choice: wird uns retten
  rationale: Das Hifil von נצל bezeichnet das Retten oder Befreien aus Gefahr; „retten“ ist im militärischen Zusammenhang klar und bewahrt zugleich den theologischen Klang göttlicher Rettung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Status der Behauptung über Hiskia
  choice: als Anschuldigung des assyrischen Redners formuliert
  alternative: als objektive Feststellung, Hiskia täusche das Volk
  rationale: Der Satz gehört zur psychologischen Kriegsführung des Rabschake. Die Übersetzung wahrt dessen Perspektive und macht seine Behauptung nicht zum Erzählerurteil.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dreifache Beschreibung „ein Land mit …“ bildet die werbende Wiederholung des Hebräischen ab. „Wegführen“ lässt den Deportationskontext erkennen; die anschließende Fülle-Rhetorik bleibt dennoch als Rede des assyrischen Gesandten hörbar.
