source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶלְיָקִ֣ים בֶּן חִ֠לְקִיָּהוּ וְ/שֶׁבְנָ֨ה וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר עִמָּ֨/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חֹמָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: de
  text: 'Da sagten Eljakim, der Sohn Hilkijas, Schebna und Joach zum Rabschake: »Sprich bitte mit deinen Dienern Aramäisch, denn wir verstehen es. Sprich nicht mit uns Judäisch[a] vor den Ohren des Volkes, das auf der Mauer ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hebräisch«. Das hebräische Wort יְהוּדִית bedeutet wörtlich »judäisch« und bezeichnet hier die Sprache Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Der assyrische Amtstitel wird in seiner überlieferten Form beibehalten, da sich die genaue Funktion nicht mit Sicherheit bestimmen lässt; Übersetzungen wie »Obermundschenk« oder »Feldherr« wären zu eng.
- source_word: דַּבֶּר נָא
  choice: Rede doch
  rationale: Die Partikel נָא macht die Aufforderung zu einer höflichen Bitte; »doch« gibt diesen Ton im modernen Deutschen natürlich wieder.
- source_word: עֲבָדֶיךָ
  choice: deinen Dienern
  rationale: In dieser diplomatischen Anrede ist עבד eine konventionelle, selbsterniedrigende Bezeichnung und betont hier keinen Sklavenstatus.
- source_word: אֲרָמִית
  choice: aramäisch
  rationale: Die Sprachbezeichnung wird im Deutschen idiomatisch adverbial mit »reden« verbunden.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: denn wir verstehen es
  rationale: שׁמע kann »hören« oder »verstehen« bedeuten. Da es um Sprachkenntnis geht, ist hier »verstehen« gemeint.
- source_word: יְהוּדִית
  choice: judäisch
  rationale: Das Wort bezeichnet wörtlich die Sprache beziehungsweise Sprechweise Judas. »Judäisch« bewahrt diese historische Bezeichnung, ohne sie vorschnell mit einer modernen sprachwissenschaftlichen Kategorie gleichzusetzen.
- source_word: בְּאָזְנֵי
  choice: sodass ... es hören kann
  rationale: Die hebräische Wendung bedeutet wörtlich »in den Ohren von«. Die deutsche Formulierung bewahrt den hörbezogenen Sinn und klingt zugleich natürlich.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: das Volk auf der Mauer
  rationale: »Volk« gibt הָעָם ohne die unbelegte Einengung auf Soldaten wieder; »auf der Mauer« erhält die räumliche Szenerie.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Da sagten ... zu
  rationale: »Da« führt die Erzählung natürlich fort. Wegen des zusammengesetzten Subjekts steht das Verb im Deutschen im Plural, obwohl das Hebräische formal mit einer Singularform beginnt.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Erzählsprache. Die höfliche diplomatische Redeweise bleibt erhalten; der unsichere assyrische Amtstitel wird nicht spekulativ aufgelöst.
