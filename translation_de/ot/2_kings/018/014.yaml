source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: de
  text: 'Da sandte Hiskia, der König von Juda, zum König von Assyrien nach Lachisch[a] und ließ ihm sagen: »Ich habe gesündigt. Zieh von mir ab! Was immer du mir auferlegst[b], will ich tragen.« Da erlegte der König von Assyrien Hiskia, dem König von Juda, dreihundert Talente Silber und dreißig Talente Gold auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »nach Lachisch«. Gemeint sein kann, dass Hiskia seine Boten dorthin sandte, wo sich der König von Assyrien aufhielt.
    reason: Die hebräische Ortsform drückt eine Bewegung nach Lachisch aus; syntaktisch ist zugleich der Aufenthaltsort des assyrischen Königs mitgemeint.
  - marker: b
    text: 'Auch: »Was immer du mir als Last auferlegst, werde ich übernehmen.« Das Hebräische spricht vom Tragen dessen, was auf Hiskia gelegt wird; im Zusammenhang ist eine Abgabe gemeint.'
    reason: Die Fußnote bewahrt die konkrete hebräische Bildsprache und erläutert ihre wirtschaftlich-politische Bedeutung, ohne den Haupttext unnötig einzuengen.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte … und ließ ihm sagen
  rationale: שלח bezeichnet hier das Senden von Boten oder einer Botschaft. Die deutsche Wendung macht den im Hebräischen vorausgesetzten Mitteilungsakt natürlich verständlich.
- source_word: לָכִישָׁה
  choice: nach Lachisch
  rationale: Das ה locale bezeichnet regulär die Richtung auf einen Ort hin. Die Übersetzung bewahrt diese Form, ohne auszuschließen, dass sich der assyrische König dort befand.
- source_word: חָטָאתִי
  choice: Ich habe gesündigt
  rationale: חטא ist das gewöhnliche Verb für sündigen. Auch in der diplomatisch-politischen Situation bleibt seine moralische Tragweite erhalten; eine Abschwächung zu »Ich war im Unrecht« wäre interpretierender.
- source_word: שׁוּב מֵעָלַי
  choice: Zieh von mir ab
  rationale: שוב mit מעל bezeichnet hier das Zurückweichen beziehungsweise Aufgeben des feindlichen Drucks. »Abziehen« passt zum militärischen Zusammenhang und bewahrt das Bild der Bewegung.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: Was immer du mir auferlegst
  rationale: נתן על bezeichnet in diesem Zusammenhang das Auferlegen einer Last oder Abgabe, ohne diese im ersten Satz ausdrücklich auf Tribut oder Geld zu verengen.
- source_word: אֶשָּׂא
  choice: will ich tragen
  rationale: נשא bedeutet wörtlich »tragen«. Im Kontext ist das Tragen beziehungsweise Erfüllen der auferlegten Forderung gemeint; die Bildsprache bleibt erhalten.
- source_word: וַיָּשֶׂם ... עַל
  choice: erlegte … auf
  rationale: שים על bezeichnet das Auferlegen einer Verpflichtung oder Abgabe. Die Formulierung stellt bewusst den sprachlichen Zusammenhang zur vorherigen Zusage Hiskias her.
- source_word: כִּכַּר
  choice: Talente
  rationale: ככר ist eine antike Gewichtseinheit, die in deutschen Bibelübersetzungen herkömmlich als »Talent« wiedergegeben wird.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Das Wort bezeichnet hier das nach Gewicht bemessene Metall Silber, nicht allgemein Geld.
- source_word: זָהָב
  choice: Gold
  rationale: Die direkte Bedeutung ist Gold, ebenfalls als Gewichtsmenge angegeben.
theological_decisions:
- issue: Moralische Tragweite von Hiskias Eingeständnis
  choice: »Ich habe gesündigt«
  alternative: »Ich habe mich vergangen« / »Ich war im Unrecht«
  rationale: Obwohl die Aussage Teil einer politischen Unterwerfung ist, verwendet der hebräische Text das übliche Wort für Sünde. Die Übersetzung wahrt diese Spannung, ohne festzulegen, ob Hiskia sein Handeln gegenüber Gott, gegenüber dem assyrischen König oder in beiden Beziehungen bewertet.
- issue: Bestimmung der auferlegten Last
  choice: Breite Formulierung »Was immer du mir auferlegst, will ich tragen«
  alternative: »Jeden Tribut, den du festsetzt, werde ich zahlen«
  rationale: Die breitere Wiedergabe folgt der Bildsprache des Hebräischen und vermeidet eine vorzeitige Einengung. Der folgende Satz zeigt, dass die Forderung tatsächlich in einer Abgabe aus Silber und Gold bestand.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerisch-biblischem Ton. »Da sandte« und »Da erlegte« bilden den hebräischen Erzählungsfortgang ab, ohne altertümliche Syntax zu häufen. Die direkte Rede bleibt knapp und nachdrücklich.
