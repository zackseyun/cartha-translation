  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: de
  text: 'Und lasst euch von Hiskia nicht dazu bringen, auf Jahwe zu vertrauen, indem er sagt: »Jahwe wird uns ganz gewiss retten[a], und diese Stadt wird nicht in die Hand des Königs von Assyrien gegeben werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »retten wird er uns retten«; die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage.'
    reason: Erläutert die emphatische hebräische Konstruktion präzise und bewahrt die im Deutschen wiedergegebene Emphase.
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: Und lasst euch ... nicht dazu bringen, ... zu vertrauen
  rationale: 'Der Hifil von בטח mit Objektsuffix hat hier kausative Bedeutung: Hiskia veranlasst das Volk zum Vertrauen. Die deutsche Formulierung bewahrt diesen Sinn und klingt zugleich natürlich.'
- source_word: חִזְקִיָּהוּ
  choice: Hiskia
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: אֶל יְהוָה
  choice: auf Jahwe
  rationale: אֶל bezeichnet wörtlich eine Richtung; in Verbindung mit בטח entspricht dem im Deutschen idiomatisch »auf jemanden vertrauen«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: לֵאמֹר
  choice: wenn er sagt
  rationale: Der zitierende Infinitiv führt den Inhalt ein, mit dem Hiskia nach Aussage des Redners Vertrauen bewirken will. »Wenn er sagt« gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: wird uns ganz gewiss retten
  rationale: Infinitivus absolutus und finite Verbform derselben Wurzel verstärken gemeinsam die Aussage. »Ganz gewiss« gibt diese Emphase idiomatisch wieder.
- source_word: וְלֹא תִנָּתֵן
  choice: und ... wird nicht ... gegeben werden
  rationale: Die passive Verbform wird formal nah wiedergegeben; im militärischen Zusammenhang bezeichnet sie die Auslieferung der Stadt an fremde Herrschaft.
- source_word: הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Natürliche deutsche Wiedergabe von Substantiv und Demonstrativpronomen.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die konkrete hebräische Herrschaftsmetapher bleibt erhalten und ist im Deutschen verständlich.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: des Königs von Assyrien
  rationale: Gebräuchliche deutsche historische Bezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Emphatische Rettungszusage in der zitierten Rede
  choice: ganz gewiss retten
  alternative: retten, ja, retten
  rationale: Die Aussage steht im Mund Hiskias, wird aber vom assyrischen Redner zitiert und bestritten. Die Übersetzung bewahrt sowohl die starke Gewissheit der Aussage als auch ihre Einbettung in die gegnerische Rede, ohne sie theologisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kausative Aussage über Hiskias Einfluss wird natürlich formuliert; die hebräische Metapher »in die Hand« und die Emphase der Rettungszusage bleiben erhalten.
