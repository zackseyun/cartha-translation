    rationale: Der Infinitivus absolutus הַצֵּל bedeutet hier „retten“ und verstärkt das folgende finite Verb; er ist nicht selbst ein Partizip „rettend“. Eine wörtlichkeitsnahe Umschreibung sollte dies erkennbar machen.
