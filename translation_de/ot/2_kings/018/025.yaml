source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: de
  text: 'Bin ich nun etwa ohne Jahwe[a] gegen diesen Ort heraufgezogen, um ihn zu zerstören? Jahwe hat zu mir gesagt: »Zieh gegen dieses Land hinauf und zerstöre es!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unabhängig von Jahwe«; wörtlich: »ohne Jahwe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: etwa ohne
  rationale: Die Fragepartikel הֲ und מִבַּלְעֲדֵי bilden eine rhetorische Frage. »Etwa ohne« klingt im Deutschen natürlich und lässt offen, ob fehlende Beauftragung, Unterstützung oder unabhängiges Handeln gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עָלִיתִי
  choice: bin ich … heraufgezogen
  rationale: עלה bezeichnet das Hinaufziehen; im Zusammenhang hat das Verb zugleich militärischen Sinn, ohne dass dieser ausdrücklich ergänzt werden muss.
- source_word: הַמָּקוֹם הַזֶּה
  choice: diesen Ort
  rationale: Die allgemeine Bedeutung von מָקוֹם bleibt erhalten, ohne den Bezug im Haupttext ausdrücklich als Jerusalem festzulegen.
- source_word: לְהַשְׁחִיתוֹ
  choice: um ihn zu zerstören
  rationale: Der Hifil von שׁחת bezeichnet hier die Zerstörung des Ortes; das maskuline Pronomen nimmt »Ort« auf.
- source_word: אָמַר אֵלַי
  choice: hat zu mir gesagt
  rationale: Natürliche und genaue Wiedergabe der Aussage, mit der der Sprecher göttliche Beauftragung beansprucht.
- source_word: עֲלֵה
  choice: Zieh … hinauf
  rationale: Der Imperativ von עלה wird entsprechend seiner räumlichen Grundbedeutung wiedergegeben; der militärische Zusammenhang ist durch »gegen« deutlich.
- source_word: הָאָרֶץ הַזֹּאת
  choice: dieses Land
  rationale: אֶרֶץ bezeichnet hier das angegriffene Land. Die Wiedergabe bewahrt den Unterschied zu מָקוֹם, »Ort«, im ersten Satz.
- source_word: וְהַשְׁחִיתָהּ
  choice: und zerstöre es
  rationale: Die Wiederholung von שׁחת wird auch auf Deutsch beibehalten; »es« bezieht sich auf das sächliche deutsche Wort »Land«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als Eigenname, ohne die behauptete göttliche Beauftragung des assyrischen Sprechers zu bestätigen oder abzuschwächen.
- issue: Bestimmung von »diesem Ort« und »diesem Land«
  choice: Die beiden hebräischen Ausdrücke werden als »dieser Ort« und »dieses Land« beibehalten.
  alternative: Jerusalem und Juda ausdrücklich nennen
  rationale: Der Vers verwendet מָקוֹם und אֶרֶץ. Eine ausdrückliche Ersetzung durch Jerusalem oder Juda würde den geschichtlichen Bezug erläutern, aber den Wortlaut interpretierend verengen.
- issue: Anspruch auf göttliche Beauftragung
  choice: Als direkte Behauptung des Sprechers ohne redaktionelle Wertung wiedergeben
  alternative: Den Anspruch sprachlich als zweifelhaft oder wahr kennzeichnen
  rationale: Der Text berichtet die Behauptung des Rabschake, entscheidet in diesem Vers aber nicht ausdrücklich über ihre Wahrheit. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt deutlich, der militärische Zusammenhang wird durch »gegen« vermittelt, und die verschiedenen Bezeichnungen »Ort« und »Land« werden nicht vereinheitlicht.
