  text: וַ/יִּתֵּן֙ חִזְקִיָּ֔ה אֶת כָּל הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בֵית יְהוָ֑ה וּ/בְ/אֹצְר֖וֹת בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: de
  text: Da gab Hiskia alles Silber, das sich im Haus Jahwes[a] und in den Schatzkammern des Hauses des Königs[b] befand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel Jahwes“; wörtlich: „im Haus Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „des königlichen Palasts“; wörtlich: „des Hauses des Königs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Da gab
  rationale: נתן bedeutet allgemein „geben“ oder „übergeben“. „Da gab“ wahrt die erzählerische Verknüpfung und legt den Vorgang nicht enger als förmliche Zahlung aus.
- source_word: חִזְקִיָּה
  choice: Hiskia
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: כָּל הַכֶּסֶף
  choice: alles Silber
  rationale: כֶּסֶף bezeichnet wörtlich Silber und kann erweitert Geld meinen. Die konkrete Wiedergabe bewahrt die Ausdrucksweise des Hebräischen.
- source_word: הַנִּמְצָא
  choice: das sich ... befand
  rationale: 'Die deutsche Wendung gibt den resultativen Sinn des Niphal-Partizips natürlich wieder: das Silber, das dort vorhanden beziehungsweise vorzufinden war.'
- source_word: בֵית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Metapher „Haus“ und der Gottesname bleiben erhalten; gemeint ist im Kontext der Tempel.
- source_word: וּבְאֹצְרוֹת
  choice: und in den Schatzkammern
  rationale: אֹצָר kann Schatzkammer, Vorratsraum oder Schatzhaus bezeichnen. Der finanzielle Zusammenhang legt „Schatzkammern“ nahe.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Königshaus
  rationale: Die kompakte deutsche Wiedergabe bewahrt das hebräische „Haus des Königs“, bezeichnet hier jedoch den königlichen Palast beziehungsweise dessen Komplex.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich deutsch, während „Silber“, „Haus Jahwes“ und die beiden parallelen Ortsangaben die Bildsprache und Struktur des Hebräischen weitgehend bewahren.
