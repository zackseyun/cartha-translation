  source_fidelity: 'Der Satz gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: Hiskia als Handelnder, die umfassende Menge des Silbers, dessen Vorhandensein an beiden genannten Orten sowie die parallelen Ortsangaben. „Das sich … befand“ ist eine natürliche Wiedergabe von הַנִּמְצָא. Die Wiedergabe von יְהוָה als „Jahwe“ entspricht der vorgegebenen Namenspraxis.'
  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. „Königshaus“ bezeichnet im heutigen Deutsch jedoch vorrangig eine Dynastie beziehungsweise Herrscherfamilie und kann daher den hier gemeinten Gebäudekomplex missverständlich wiedergeben. „Haus des Königs“ bewahrt die hebräische Formulierung ohne diese unnötige Verschiebung.
  terminology: „Hiskia“, „Silber“, „Haus Jahwes“ und „Schatzkammern“ sind angemessen. Die Anmerkung zu „Haus Jahwes“ sollte als tatsächliche lexikalische Alternative formuliert werden, nicht als bloße Feststellung, damit sie dem Ankergrund und der englischen Auditspur entspricht.
  issues:
