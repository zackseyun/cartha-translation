    rationale: Es kann die königliche Dynastie meinen, während בֵּית הַמֶּלֶךְ hier den königlichen Gebäudekomplex bezeichnet. „Haus des Königs“ ist zugleich quellennäher und klarer.
  - severity: low
    issue: Fußnote a bietet keine als solche gekennzeichnete lexikalische Alternative.
    rationale: Die Fußnote erklärt lediglich den Bezug. Die englische Auditspur dokumentiert „Tempel Jahwes/des HERRN“ als Alternative zu der wörtlichen Wendung „Haus Jahwes“.
  revised_text: Da gab Hiskia alles Silber, das sich im Haus Jahwes[a] und in den Schatzkammern des Hauses des Königs[b] befand.
