  rationale: Die Revision ersetzt das im heutigen Deutsch potenziell dynastisch verstandene „Königshaus“ durch die quellennähere Formulierung „Haus des Königs“. Fußnote a wird zu einer echten, transparent ausgewiesenen lexikalischen Alternative umgestaltet. Der Sinn des Verses bleibt unverändert.
