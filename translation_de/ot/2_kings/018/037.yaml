base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: de
  text: Da kamen Eljakim, der Sohn Hilkijas, der dem Palast vorstand, der Schreiber Schebna und Joach, der Sohn Asafs, der Kanzler, mit zerrissenen Kleidern zu Hiskia und berichteten ihm die Worte des Rabschake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabschake ist ein assyrischer Amtstitel, möglicherweise für einen hochrangigen Beamten, etwa den obersten Mundschenk oder einen königlichen Sprecher.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kamen
  rationale: Das narrative Waw wird im Deutschen flüssig mit „Da“ wiedergegeben. Obwohl das hebräische Verb singularisch steht, verlangt das nachfolgende zusammengesetzte Subjekt im Deutschen den Plural.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: der dem Palast vorstand
  rationale: Die Wendung bezeichnet ein Hofamt mit Verantwortung für den königlichen Haushalt beziehungsweise die Palastverwaltung; „dem Palast vorstand“ ist verständlich und wahrt den amtlichen Sinn.
- source_word: הַסֹּפֵר
  choice: der Schreiber
  rationale: Der Ausdruck bezeichnet einen amtlichen Schreiber oder Sekretär. „Schreiber“ bleibt quellennah und passt zum höfischen Zusammenhang.
- source_word: הַמַּזְכִּיר
  choice: der Berichtsschreiber
  rationale: Der Amtstitel bezeichnet einen für Aufzeichnungen oder Berichte zuständigen Hofbeamten. „Berichtsschreiber“ vermittelt diese Verwaltungsfunktion verständlich, ohne sie zu eng festzulegen.
- source_word: קְרוּעֵי בְגָדִים
  choice: mit zerrissenen Kleidern
  rationale: Die konkrete Wendung bezeichnet ihren Zustand bei der Ankunft und ist ein sichtbares Zeichen von Bestürzung und Trauer.
- source_word: וַיַּגִּדוּ לוֹ
  choice: und berichteten ihm
  rationale: „Berichteten“ entspricht dem formellen Zusammenhang, in dem die Beamten eine empfangene Rede an den König weitergeben.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: Die wörtliche Wiedergabe bewahrt, dass der Inhalt der Rede weitergegeben wird, und klingt auch im Deutschen natürlich.
- source_word: רַב שָׁקֵה
  choice: Rabschake
  rationale: Der assyrische Amtstitel wird transliteriert, weil seine genaue Amtsfunktion nicht sicher genug ist, um sie im Haupttext festzulegen.
