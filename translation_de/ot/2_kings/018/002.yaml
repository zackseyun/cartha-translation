base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: de
  text: Er war fünfundzwanzig Jahre alt, als er König wurde, und regierte neunundzwanzig Jahre in Jerusalem. Seine Mutter hieß Abi, eine Tochter Sacharjas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: fünfundzwanzig Jahre alt
  rationale: Die hebräische Altersformel wird im modernen Deutschen idiomatisch und genau so wiedergegeben.
- source_word: הָיָה בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet bei dieser Königsformel das Alter beim Regierungsantritt; die deutsche Wendung ist natürlich und bewahrt diesen zeitlichen Sinn.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet die Ausübung der Königsherrschaft; „regierte“ ist im Deutschen die präzise und übliche Entsprechung.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ist hier lokal gebraucht und bezeichnet den Regierungssitz.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Dies gibt die hebräische Namensformel knapp und natürlich im modernen Deutschen wieder.
- source_word: אֲבִי
  choice: Abi
  rationale: Der Personenname wird in einer dem Hebräischen nahen, im Deutschen gut lesbaren Form transliteriert.
- source_word: בַּת זְכַרְיָה
  choice: sie war eine Tochter Secharjas
  rationale: Die Konstruktverbindung bezeichnet die Abstammung. Ein eigener Satzteil vermeidet im Deutschen die mögliche Fehllektüre, „Abi Tochter“ sei ein zusammengesetzter Name.
