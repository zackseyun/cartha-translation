source:
  edition: WLC
  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: de
  text: Wo sind die Götter von Hamat und Arpad? Wo sind die Götter von Sefarwajim, Hena und Iwa?[a] Haben sie Samaria aus meiner Hand gerettet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andere Schreibweisen des letzten Ortsnamens sind »Awa« und »Iwwa«.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Wo sind
  rationale: Das Ortsfragewort leitet spöttische rhetorische Fragen ein; wegen des pluralischen Bezugsworts »Götter« ist »Wo sind« im Deutschen natürlich.
- source_word: אֱלֹהֵי
  choice: die Götter von
  rationale: Die Konstruktform ist pluralisch und bezeichnet im Zusammenhang die Gottheiten der genannten Städte beziehungsweise Völker.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamat und Arpad
  rationale: Die Ortsnamen werden in ihren im Deutschen etablierten biblischen Formen wiedergegeben.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: Sefarwajim, Hena und Iwa
  rationale: Die Eigennamen werden nach gängigen deutschen Transkriptionskonventionen wiedergegeben; abweichende traditionelle Schreibweisen des letzten Namens werden in einer Fußnote genannt.
- source_word: כִּי
  choice: Haben
  rationale: כִּי führt hier im Zusammenhang der spöttischen Herausforderung eine rhetorische Frage ein. Im natürlichen Deutschen wird diese Funktion durch die Frageform ausgedrückt, ohne das Wort gesondert wiederzugeben.
- source_word: הִצִּילוּ
  choice: gerettet
  rationale: Das Hiphil von נצל bedeutet hier, aus der Gewalt eines militärischen Gegners zu retten oder zu befreien. »Gerettet« ist klar und idiomatisch.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Dies ist die etablierte deutsche Namensform.
- source_word: מִיָּדִי
  choice: aus meiner Hand
  rationale: Die konkrete hebräische Wendung für Macht und Verfügungsgewalt bleibt erhalten und ist auch im modernen Deutschen verständlich.
theological_decisions:
- issue: Bezug der Herausforderung auf die fremden Götter
  choice: 'Der Vers bleibt als assyrische Prahlrede formuliert: Die Götter der genannten Orte hätten Samaria nicht aus der Hand des Sprechers retten können.'
  alternative: Die Schlussfrage könnte als allgemeinere Verhöhnung sämtlicher Nationalgötter verstanden werden.
  rationale: Der hebräische Text nennt bestimmte Gottheiten beziehungsweise ihre Orte und verbindet sie unmittelbar mit der rhetorischen Frage nach Samarias Rettung. Die Übersetzung übernimmt diese Spannung, ohne über Existenz oder Macht dieser Gottheiten eine eigene dogmatische Aussage hinzuzufügen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Frageform und das konkrete Bild »aus meiner Hand« bewahren den höhnischen, machtpolitischen Ton des hebräischen Textes.
