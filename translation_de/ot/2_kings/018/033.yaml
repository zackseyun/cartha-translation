base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: de
  text: Haben die Götter der Völker denn jemals ihr jeweiliges Land aus der Hand des Königs von Assyrien gerettet?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: wirklich … gerettet
  rationale: Der absolute Infinitiv zusammen mit dem finiten Verb verstärkt die Verbalhandlung. In der rhetorischen Frage gibt „wirklich“ die nachdrückliche Herausforderung natürlich wieder.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: die Götter der Völker
  rationale: Die pluralische Status-constructus-Verbindung wird direkt wiedergegeben; „Völker“ bezeichnet hier die verschiedenen Nationen mit ihren jeweiligen Gottheiten.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ wird distributiv gebraucht und bezieht sich auf die einzelnen Götter, nicht auf einen männlichen Menschen.
- source_word: אֶת אַרְצוֹ
  choice: sein Land
  rationale: 'Das singularische Suffix steht passend zum distributiven „jeder“: Gemeint ist jeweils das Land des betreffenden Gottes.'
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die deutsche Wendung bewahrt das hebräische Bild für Macht und Gewalt und ist im gehobenen biblischen Register verständlich.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: des Königs von Assyrien
  rationale: Die hebräische Genitivverbindung wird in natürlichem Standarddeutsch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische hebräische Konstruktion wird im Haupttext mit „wirklich“ ausgedrückt; dadurch ist keine Fußnote erforderlich. Die leicht markierte Stellung von „jeder“ bewahrt den distributiven Bezug des Hebräischen.
