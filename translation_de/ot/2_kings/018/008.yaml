  text: הֽוּא הִכָּ֧ה אֶת פְּלִשְׁתִּ֛ים עַד עַזָּ֖ה וְ/אֶת גְּבוּלֶ֑י/הָ מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/008.yaml
  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: de
  text: Er schlug die Philister bis nach Gaza und in das dazugehörige Gebiet hinein[b], vom Wachturm bis zur befestigten Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Wachturm bis zur befestigten Stadt“; gemeint ist die ganze Spanne vom kleinsten Außenposten bis zur großen befestigten Siedlung.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „und bis an ihre Grenzen“. Das hebräische Wort kann sowohl Grenzlinien als auch das zu einer Stadt gehörende Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Er
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten und nimmt Hiskia als hervorgehobenes Subjekt wieder auf.
- source_word: הִכָּה
  choice: schlug
  rationale: Die Grundbedeutung von נכה wird bewahrt; im militärischen Zusammenhang schließt sie Niederlage ein, ohne diese Deutung ausdrücklich festzulegen.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Übliche deutsche Bezeichnung der Volksgruppe.
- source_word: עַד עַזָּה
  choice: bis nach Gaza
  rationale: עַד bezeichnet die räumliche Ausdehnung; bei einem Ortsnamen ist „bis nach Gaza“ natürliches modernes Deutsch.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: und in dessen Gebiet
  rationale: גְּבוּל kann Grenze oder Gebiet bedeuten. Im Zusammenhang bezeichnet es wahrscheinlich das zu Gaza gehörende Umland; die Präposition „in“ ergibt zusammen mit „schlug“ idiomatisches Deutsch, während die Alternative in der Fußnote erhalten bleibt.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: vom Wachturm
  rationale: Die Verbindung bezeichnet einen Turm für Wächter beziehungsweise einen Beobachtungsposten. Der Singular des Hebräischen bleibt erhalten.
- source_word: עַד עִיר מִבְצָר
  choice: bis zur befestigten Stadt
  rationale: Wörtliche und im Deutschen geläufige Wiedergabe; zusammen mit „Wachturm“ beschreibt die Wendung die gesamte Spanne der Siedlungs- und Verteidigungsorte.
