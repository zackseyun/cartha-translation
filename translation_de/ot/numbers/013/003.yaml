  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: de
  text: Da sandte Mose sie aus der Wüste Paran auf Jahwes[a] Befehl. Sie alle waren Männer, Oberhäupter der Söhne Israels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach dem Mund Jahwes«; gemeint ist: gemäß seiner Weisung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Oberhäupter der Söhne Israels«; auch: »Anführer der Israeliten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֹתָם מֹשֶׁה
  choice: So sandte Mose sie
  rationale: Die narrative Verbform bezeichnet eine vergangene Handlung; „sandte“ ist im Deutschen natürlich und bewahrt den Anschluss an den vorausgehenden Auftrag.
- source_word: מִמִּדְבַּר פָּארָן
  choice: aus der Wüste Paran
  rationale: מִדְבָּר bezeichnet eine unbesiedelte Wüsten- oder Steppenregion. „Wüste Paran“ ist die geläufige, knappe geografische Wiedergabe.
- source_word: עַל פִּי יְהוָה
  choice: nach dem Befehl Jahwes
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund Jahwes“ und bezeichnet hier Handeln gemäß seiner ausdrücklichen Weisung.
- source_word: כֻּלָּם אֲנָשִׁים
  choice: Sie alle waren Männer
  rationale: כֻּלָּם betont die Gesamtheit; אֲנָשִׁים bezeichnet in diesem Zusammenhang die männlichen Stammesvertreter.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: Oberhäupter der Israeliten
  rationale: רָאשֵׁי bezeichnet führende Repräsentanten. „Oberhäupter“ erhält das hebräische Bild, während „der Israeliten“ die Zugehörigkeit im heutigen Deutsch natürlich ausdrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Bezeichnung אֲנָשִׁים
  choice: Männer
  alternative: Leute
  rationale: Gemeint sind hier männliche Stammesvertreter; die geschlechtliche Aussage des Ausgangstextes wird daher beibehalten.
- issue: Familienausdruck בְנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: „Israeliten“ bezeichnet dieselbe Volkszugehörigkeit in natürlichem modernem Deutsch. Die wörtlichere Lesart wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, vermeidet aber unnatürliche Wörtlichkeit. Der Gottesname wird als „Jahwe“ wiedergegeben; echte lexikalische Alternativen werden in Fußnoten ausgewiesen.
