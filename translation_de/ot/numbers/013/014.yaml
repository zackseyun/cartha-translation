lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: vom Stamm
  rationale: Die Präposition לְ kennzeichnet in dieser Namensliste die Zuordnung des Vertreters zu seinem Stamm. „Vom Stamm“ ist im Deutschen knapp, natürlich und kontextgerecht.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Der Stammesname wird in der im Deutschen gebräuchlichen Form wiedergegeben.
- source_word: נַחְבִּי
  choice: Nachbi
  rationale: Der Personenname wird quellennah und nach deutscher Lautkonvention umschrieben; „ch“ gibt den hebräischen Reibelaut ח wieder.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die hebräische Abstammungsangabe wird in der Namensliste mit einer natürlichen deutschen Apposition wiedergegeben.
- source_word: וָפְסִי
  choice: Wofsi
  rationale: Der Personenname wird in einer gebräuchlichen deutschen Form wiedergegeben; eine stärker vokalnahe Umschrift ist „Wafsi“.
