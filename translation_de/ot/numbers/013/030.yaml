base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: de
  text: 'Da brachte Kaleb das Volk vor Mose zur Ruhe[a] und sagte: »Lasst uns unbedingt hinaufziehen[b] und das Land in Besitz nehmen; denn wir können es ganz gewiss schaffen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brachte das Volk vor Mose zum Schweigen«. Das hebräische Verb kann »ruhig machen«, »stillen« oder »zum Schweigen bringen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Hinaufziehen werden wir gewiss hinaufziehen«; im Hebräischen wird die Verbform zur Verstärkung mit dem Infinitiv desselben Verbs verbunden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: »denn wir sind ganz gewiss dazu imstande«. Das hebräische Pronomen bezieht sich grammatisch auf das Land; gemeint sein kann die Fähigkeit, es einzunehmen oder gegen es zu bestehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: brachte … zur Ruhe
  rationale: Das Verb bezeichnet, dass eine Menschenmenge ruhig oder still gemacht wird. Die Formulierung ist im modernen Deutschen natürlich und vermeidet den möglicherweise zu harten Beiklang von »zum Schweigen bringen«.
- source_word: אֶת־הָעָם
  choice: das Volk
  rationale: עַם bezeichnet hier die versammelte Gemeinschaft Israels; »das Volk« ist die sachlich und kontextuell passende Wiedergabe.
- source_word: אֶל־מֹשֶׁה
  choice: vor Mose
  rationale: אֶל bedeutet gewöhnlich »zu/auf … hin«, bezeichnet hier aber die Ausrichtung der Szene auf Mose beziehungsweise sein Beisein. »Vor Mose« gibt dies knapp und idiomatisch wieder.
- source_word: עָלֹה נַעֲלֶה
  choice: Lasst uns auf jeden Fall hinaufziehen
  rationale: Der vorangestellte Infinitivus absolutus verstärkt die finite Verbform. »Auf jeden Fall« bewahrt Nachdruck und Entschlossenheit, ohne die im Hebräischen nicht ausdrücklich enthaltene Zeitangabe »sofort« einzuführen.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: und das Land in Besitz nehmen
  rationale: יָרַשׁ bezeichnet hier das aktive Ergreifen und Besetzen des Landes. Das ausdrücklich wiederholte »das Land« macht den Bezug des femininen Pronomens im Deutschen eindeutig.
- source_word: כִּי יָכוֹל נוּכַל
  choice: denn wir können es ganz gewiss schaffen
  rationale: Auch hier verstärkt ein Infinitivus absolutus die finite Verbform. »Ganz gewiss« gibt Kalebs betonte Zuversicht in natürlichem modernem Deutsch wieder.
- source_word: לָהּ
  choice: es … schaffen
  rationale: Das feminine Suffix bezieht sich grammatisch auf das Land, doch die Wendung bezeichnet die Fähigkeit im Blick auf die zuvor genannte Einnahme. »Es schaffen« wahrt diesen weiten Bezug besser als das stärker deutende »es bezwingen«.
theological_decisions:
- issue: Grundlage von Kalebs Zuversicht
  choice: Keine ausdrückliche Begründung durch Gottes Hilfe ergänzt
  alternative: »Mit Gottes Hilfe können wir es ganz gewiss schaffen«
  rationale: Kalebs Vertrauen steht im größeren Erzählzusammenhang mit Gottes Verheißung, doch dieser Vers nennt Gottes Hilfe nicht ausdrücklich. Die Übersetzung fügt diese theologische Folgerung daher nicht in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Redeform. »Zur Ruhe bringen« ist verständlich und weniger hart als »zum Schweigen bringen«; die beiden hebräischen Verstärkungskonstruktionen werden durch »auf jeden Fall« und »ganz gewiss« hörbar gemacht.
