base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: de
  text: Sie gingen und kamen zu Mose und Aaron und zur ganzen Gemeinde der Israeliten[a] in die Wüste Paran, nach Kadesch. Sie brachten ihnen und der ganzen Gemeinde Bericht und zeigten ihnen die Frucht des Landes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gemeinde der Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Sie zogen weiter und kamen
  rationale: Bewahrt die beiden aufeinanderfolgenden Erzählverben, klingt im Deutschen aber natürlicher als das wörtliche „sie gingen und kamen“.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: die ganze Gemeinde der Israeliten
  rationale: „Gemeinde“ gibt עֵדָה wieder; „Israeliten“ bezeichnet im modernen Deutschen die aus Männern und Frauen bestehende Gemeinschaft, während die wörtliche Form in einer Fußnote dokumentiert wird.
- source_word: מִדְבַּר פָּארָן
  choice: die Wüste Paran
  rationale: „Wüste“ ist die übliche und kontextgerechte Wiedergabe von מִדְבָּר in den Wanderungserzählungen.
- source_word: קָדֵשָׁה
  choice: nach Kadesch
  rationale: Die Richtungsendung -ה bezeichnet hier das Ziel der Bewegung; „nach Kadesch“ gibt diese Form direkt und idiomatisch wieder.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: Sie brachten ihnen Bericht
  rationale: Die Wendung bezeichnet das Überbringen einer Nachricht beziehungsweise eines Berichts nach der Erkundung. „Bericht bringen“ ist natürliches Deutsch und wahrt den Rückkehrbezug des Verbs.
- source_word: וַיַּרְאוּם
  choice: zeigten ihnen
  rationale: Der Hifil von ראה bedeutet hier „sehen lassen, zeigen“.
- source_word: פְּרִי הָאָרֶץ
  choice: die Frucht des Landes
  rationale: Die konkrete Wiedergabe passt zu den mitgebrachten Früchten und bewahrt die Bildhaftigkeit des Hebräischen.
