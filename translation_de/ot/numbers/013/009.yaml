  rationale: Das vorangestellte לְ kennzeichnet in dieser Liste den Stamm, dem der jeweils genannte Kundschafter zugeordnet ist. „Für den Stamm“ gibt seine repräsentative Zuordnung natürlich wieder und bewahrt zugleich die Präposition.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Der Stammesname wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: פַּלְטִי
  choice: Palti
  rationale: Der Personenname wird gemäß der hebräischen Form transliteriert.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die hebräische Abstammungsangabe wird in der deutschen Namensliste natürlich als „der Sohn“ wiedergegeben.
- source_word: רָפוּא
  choice: Rafu
  rationale: Der Personenname wird in einer lautnahen deutschen Transliteration mit f für den unbetonten Konsonanten פ wiedergegeben.
