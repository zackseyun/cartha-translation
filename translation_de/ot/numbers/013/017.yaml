  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֹתָ/ם֙ מֹשֶׁ֔ה לָ/ת֖וּר אֶת אֶ֣רֶץ כְּנָ֑עַן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם עֲל֥וּ זֶה֙ בַּ/נֶּ֔גֶב וַ/עֲלִיתֶ֖ם אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: de
  text: 'Mose sandte sie aus, um das Land Kanaan zu erkunden[a], und sagte zu ihnen: »Zieht auf diesem Weg in den Negev[b] hinauf und steigt dann ins Bergland[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auszukundschaften«.'
    reason: lexical_alternative
  - marker: b
    text: Der Negev ist die trockene südliche Region des Landes.
    reason: cultural_note
  - marker: c
    text: 'Oder: »ins Gebirge«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte … aus
  rationale: Die deutsche Verbverbindung gibt das Aussenden zu einem bestimmten Auftrag natürlich und präzise wieder.
- source_word: לָתוּר
  choice: um … zu erkunden
  rationale: Das Verb bezeichnet hier die planmäßige Erkundung des Landes. „Erkunden“ wahrt den Aufklärungscharakter, ohne zwingend heimliche Spionage anzudeuten.
- source_word: אֶרֶץ כְּנָעַן
  choice: das Land Kanaan
  rationale: Die geografische Bezeichnung wird vollständig und im Deutschen idiomatisch wiedergegeben.
- source_word: עֲלוּ זֶה
  choice: Zieht auf diesem Weg … hinauf
  rationale: Das demonstrative זֶה ist hier wahrscheinlich adverbial beziehungsweise weisend gebraucht. Die Formulierung bewahrt sowohl die Routenangabe als auch die durch עלה bezeichnete Aufwärtsbewegung.
- source_word: בַּנֶּגֶב
  choice: in den Negev
  rationale: Negev wird als geografischer Eigenname behandelt. Das deutsche „in den“ bringt im Zusammenhang der Bewegungsanweisung die Zielrichtung natürlich zum Ausdruck.
- source_word: וַעֲלִיתֶם
  choice: und steigt dann
  rationale: Die Form führt nach dem Imperativ die Anweisung fort. „Dann“ verdeutlicht die natürliche Abfolge, ohne den Aussagegehalt zu verändern.
- source_word: הָהָר
  choice: ins Bergland
  rationale: Der Ausdruck bezeichnet hier kollektiv die gebirgige Hochlandregion und nicht notwendig einen einzelnen Berg.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Zieht“ passt zu einer Reisegruppe zu Fuß; „Bergland“ bezeichnet die Region natürlicher als das missverständliche Singularwort „Berg“.
