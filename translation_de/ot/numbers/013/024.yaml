  text: לַ/מָּק֣וֹם הַ/ה֔וּא קָרָ֖א נַ֣חַל אֶשְׁכּ֑וֹל עַ֚ל אֹד֣וֹת הָֽ/אֶשְׁכּ֔וֹל אֲשֶׁר כָּרְת֥וּ מִ/שָּׁ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: de
  text: Diesen Ort nannte man das Tal Eschkol[a], wegen der Traube, die die Söhne Israels von dort abgeschnitten hatten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Wadi Eschkol« beziehungsweise »Schlucht Eschkol«. Das hebräische Wort kann ein saisonales Bachbett oder das dazugehörige Tal bezeichnen. Eschkol ist zugleich das hebräische Wort für »Traube« oder »Traubenbüschel«.
    reason: lexical_alternative_and_wordplay
  - marker: b
    text: Oder »die Israeliten« beziehungsweise »die Kinder Israels«.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: Diesen Ort
  rationale: Die bestimmte Wendung verweist auf den zuvor beschriebenen Ort; der deutsche Akkusativ ergibt sich aus der natürlichen aktiven Konstruktion »Diesen Ort nannte man …«.
- source_word: קָרָא
  choice: nannte man
  rationale: Die aktive Form im Hebräischen hat hier ein nicht näher bezeichnetes Subjekt. Das unpersönliche deutsche »man« gibt diese Namengebung natürlich wieder, ohne einen bestimmten Namensgeber einzuführen.
- source_word: נַחַל
  choice: Tal
  rationale: Das Wort kann ein Wadi, Bachbett, Schluchttal oder das zugehörige Tal bezeichnen. »Tal« ist im Deutschen verständlich und als Bestandteil eines Ortsnamens idiomatisch; die Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: אֶשְׁכּוֹל
  choice: Eschkol
  rationale: Hier ist das Wort Bestandteil des Ortsnamens und wird daher transliteriert. Das Wortspiel mit dem gleichlautenden gewöhnlichen Wort für »Traube/Traubenbüschel« wird in der Fußnote erklärt.
- source_word: עַל אֹדוֹת
  choice: wegen
  rationale: Die Wendung bezeichnet den Grund für die Namensgebung; »wegen« gibt die kausale Bedeutung knapp und natürlich wieder.
- source_word: הָאֶשְׁכּוֹל
  choice: der Traube
  rationale: Im unmittelbaren Zusammenhang ist ein abgeschnittener Traubenbüschel gemeint. »Traube« ist dafür im modernen Deutschen die natürliche Bezeichnung und lässt zugleich das hebräische Wortspiel erkennen.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: die … abgeschnitten hatten
  rationale: כרת bezeichnet hier das Abschneiden bei der Ernte. Das Plusquamperfekt macht im Deutschen deutlich, dass dies der Namengebung vorausging, ohne den Sinn zu verändern.
- source_word: מִשָּׁם
  choice: dort
  rationale: »Dort« bewahrt den Ortsverweis idiomatisch; ein wörtlicheres »von dort« wäre zusammen mit »abschneiden« im Deutschen unnötig schwerfällig.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe erhält die familiäre Form des hebräischen Ausdrucks und passt in diesem Zusammenhang konkret zu den ausgesandten Männern.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / die Kinder Israels
  rationale: Die formnahe Wiedergabe bewahrt die familiäre Ausdrucksweise des Hebräischen. Hier bezeichnet sie die männlichen Kundschafter; eine neutralisierende Form ist daher nicht erforderlich.
- issue: Subjekt der Namengebung bei קָרָא
  choice: 'unpersönlich: »nannte man«'
  alternative: '»er nannte« / passiv: »wurde genannt«'
  rationale: Der hebräische Singular nennt keinen eindeutigen Handelnden. Die unpersönliche Form bewahrt diese Offenheit, statt einen bestimmten Namensgeber vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aktive unpersönliche Konstruktion ist natürlich und bewahrt das im Hebräischen nicht näher bestimmte Subjekt. Der Ortsname wird als »Tal Eschkol« formuliert; die geografische Bedeutungsbreite und das Wortspiel werden in der Fußnote erläutert.
