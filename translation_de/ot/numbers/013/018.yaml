base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: de
  text: Seht euch an, wie das Land beschaffen ist[a] und ob das Volk, das darin wohnt[b], stark oder schwach ist, ob es aus wenigen oder vielen besteht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „was es ist“. Gemeint ist eine Einschätzung der Art oder Beschaffenheit des Landes.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „das Volk, das auf ihm wohnt“. Im Deutschen sagt man bei den Bewohnern eines Landes gewöhnlich „darin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Seht euch an
  rationale: Die Form führt im Zusammenhang den Auftrag an die Kundschafter fort. „Seht euch an“ vermittelt eine gezielte Prüfung natürlicher als das bloße „seht“.
- source_word: הָאָרֶץ מַה הִוא
  choice: wie das Land beschaffen ist
  rationale: Wörtlich steht „was es ist“; gemeint ist eine Beurteilung der Art oder Beschaffenheit des Landes. Die gewählte Formulierung ist idiomatisch und bewahrt den prüfenden Sinn.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: das Volk, das darin wohnt
  rationale: Das Partizip von ישׁב bezeichnet hier die ansässige Bevölkerung. Obwohl עַל wörtlich „auf“ bedeutet, ist „in dem Land wohnen“ im Deutschen die natürliche Ausdrucksweise.
- source_word: הֶחָזָק
  choice: stark
  rationale: חזק bezeichnet Stärke oder Macht; „stark“ passt zur Einschätzung der Bevölkerung.
- source_word: הֲרָפֶה
  choice: schwach
  rationale: רפה steht hier als Gegenbegriff zu חזק und bezeichnet mangelnde Stärke.
- source_word: הַמְעַט
  choice: wenige
  rationale: Der Ausdruck bezeichnet eine geringe Anzahl und steht im Gegensatz zu רָב.
- source_word: רָב
  choice: viele
  rationale: רָב bezeichnet hier eine große Anzahl; „viele“ gibt den Gegensatz zu „wenige“ knapp wieder.
- source_word: אִם
  choice: ob … oder
  rationale: Die Partikel verbindet hier die Alternativen einer indirekten Frage; im Deutschen entspricht dem idiomatisch „ob … oder“.
