source:
  edition: WLC
  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: de
  text: Und dort sahen wir die Nephilim – die Söhne Anaks[a], die von den Nephilim abstammten. In unseren eigenen Augen waren wir wie Heuschrecken, und genauso waren wir auch in ihren Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: »die Riesen«. Die Bedeutung des hebräischen Ausdrucks »Nephilim« ist unsicher; deshalb wird er im Haupttext transliteriert wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: die Nephilim
  rationale: Der unsichere und kulturell geprägte Ausdruck wird transliteriert, statt ihn durch die traditionelle Deutung »Riesen« festzulegen.
- source_word: בְּנֵי עֲנָק
  choice: die Söhne Anaks
  rationale: Bewahrt die hebräische Abstammungsformel und ist im Deutschen als Bezeichnung einer Nachkommenschaft verständlich.
- source_word: מִן הַנְּפִלִים
  choice: die von den Nephilim abstammen
  rationale: מן bezeichnet hier wahrscheinlich Herkunft beziehungsweise Abstammung; die Formulierung macht den Bezug verständlich, ohne die Identität beider Gruppen vollständig gleichzusetzen.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: In unseren eigenen Augen waren wir
  rationale: Gibt die idiomatische Selbstwahrnehmung wieder und bewahrt zugleich das parallele Bild von den »Augen«.
- source_word: כַּחֲגָבִים
  choice: wie Heuschrecken
  rationale: חגב bezeichnet eine Heuschrecke beziehungsweise einen Grashüpfer; »Heuschrecken« ist die geläufige und bildkräftige deutsche Wiedergabe.
- source_word: וְכֵן
  choice: und genauso
  rationale: Bewahrt die vergleichende Folgerung und die rhetorische Entsprechung zwischen eigener und fremder Wahrnehmung.
- source_word: בְעֵינֵיהֶם
  choice: in ihren Augen
  rationale: Erhält die hebräische Wendung und den Parallelismus zu »in unseren eigenen Augen«.
theological_decisions:
- issue: Wiedergabe von נְפִילִים
  choice: Nephilim
  alternative: Riesen; Gefallene
  rationale: Die Bedeutung und der Bezug des auch in Genesis 6,4 vorkommenden Ausdrucks sind umstritten. Die Transliteration vermeidet, eine bestimmte anthropologische oder theologische Deutung in den Haupttext einzutragen.
- issue: Verhältnis der Söhne Anaks zu den Nephilim
  choice: die von den Nephilim abstammen
  alternative: unter den Nephilim; einige von den Nephilim
  rationale: Die Präposition מן kann verschiedene Beziehungen ausdrücken. Im Zusammenhang liegt Abstammung nahe, doch die Formulierung vermeidet weitergehende Aussagen über Wesen oder Ursprung der Nephilim.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wiederholung von »Nephilim« sowie der Parallelismus »in unseren eigenen Augen … in ihren Augen« bleiben erhalten. Der Gedankenstrich markiert die erläuternde Apposition.
