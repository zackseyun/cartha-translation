base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: de
  text: 'Und wie das Land beschaffen ist: ob es fruchtbar oder mager ist, ob es dort Bäume gibt oder nicht.[a] Seid mutig und nehmt etwas von der Frucht des Landes!« Es war die Zeit der ersten reifen Trauben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „ob es dort Holz gibt oder nicht“; das hebräische Wort kann „Baum“ oder „Holz“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Die Tage waren die Tage der ersten reifen Trauben“, das heißt, es war der Beginn der Weinlesezeit.'
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: fruchtbar oder mager
  rationale: Die Adjektive bedeuten wörtlich „fett“ und „mager/dünn“. Auf Land bezogen beschreibt der Gegensatz seine Ertragsfähigkeit; „fruchtbar oder mager“ bewahrt zugleich das hebräische Bild.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: ob es darin Bäume gibt oder nicht
  rationale: עֵץ kann sowohl „Baum“ als auch „Holz“ bedeuten. Im Zusammenhang der Erkundung des Landes ist „Bäume“ die naheliegendste Wiedergabe; die mögliche Bedeutung „Nutzholz“ wird in der Fußnote erhalten.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: Seid mutig
  rationale: Die reflexive Verbform fordert die Kundschafter auf, sich für die Aufgabe zu stärken beziehungsweise Mut zu fassen. „Seid mutig“ ist natürliches modernes Deutsch und gibt den Aufforderungscharakter wieder.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: nehmt etwas von der Frucht des Landes mit
  rationale: מִן bezeichnet hier eine Teilmenge. „Mitnehmen“ macht im Deutschen die im Erkundungsauftrag liegende Rückkehr mit einer Probe natürlich deutlich, ohne den Sinn wesentlich zu erweitern.
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: die ersten Trauben reif wurden
  rationale: Die Wendung bezeichnet den Beginn der Traubenreife. Die zeitliche Formulierung ist im Deutschen klar und vermeidet hier unnötige kultische Assoziationen des Wortes „Erstlingsfrüchte“.
- source_word: וְהַיָּמִים יְמֵי
  choice: Es war gerade die Zeit
  rationale: Die idiomatische deutsche Zeitangabe gibt den hebräischen erzählerischen Hinweis klar wieder; die wörtlich repetitive Struktur wird in der Fußnote dokumentiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch den Erkundungsauftrag aus dem vorherigen Kontext fort; daher beginnt er mit „und“. Das konkrete Bild „mager“ bleibt erhalten, wird aber durch „fruchtbar“ eindeutig auf die Bodenqualität bezogen.
