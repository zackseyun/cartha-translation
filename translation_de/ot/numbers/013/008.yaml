lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: vom Stamm
  rationale: Das לְ kennzeichnet in der Liste die Zugehörigkeit beziehungsweise Vertretung. „Vom Stamm“ ist im Deutschen natürlich und bewahrt die knappe Listenform.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Der Stammesname wird in der geläufigen deutschen Form wiedergegeben.
- source_word: הוֹשֵׁעַ
  choice: Hoschea
  rationale: Die lautnahe deutsche Namensform unterscheidet diesen Mann vom Propheten Hosea und entspricht dem Namen, der in Numeri 13,16 zu Josua erweitert wird.
- source_word: בִּן
  choice: der Sohn
  rationale: Die hebräische Abstammungsangabe wird in der deutschen Listenform klar und natürlich wiedergegeben.
- source_word: נוּן
  choice: Nuns
  rationale: Der Eigenname Nun steht nach „Sohn“ idiomatisch im deutschen Genitiv.
