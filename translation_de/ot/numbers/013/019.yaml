  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: de
  text: Und wie ist das Land, in dem das Volk wohnt? Ist es gut oder schlecht? Und wie sind die Städte, in denen es wohnt? Sind es unbefestigte Siedlungen oder befestigte Orte?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in Lagern oder befestigten Orten“. Mit „Lagern“ sind hier vermutlich lagerartige, nicht befestigte Siedlungen im Gegensatz zu befestigten Orten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  choice: Und wie ist / Und wie sind
  rationale: Die idiomatische deutsche Frage nach Beschaffenheit oder Zustand gibt die interrogative Wendung natürlich wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Die übliche und im Zusammenhang der Erkundung Kanaans passende Wiedergabe.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: in dem das Volk wohnt
  rationale: Das maskuline Singularpronomen bezeichnet hier kollektiv die Bevölkerung. Die explizite Wiedergabe mit „das Volk“ ist im Deutschen verständlich und bewahrt den kollektiven Sinn.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: Ist es gut oder schlecht?
  rationale: Bewahrt die breite Bewertung der hebräischen Adjektive, ohne sie auf Fruchtbarkeit zu verengen.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: Normale Wiedergabe von עָרִים und passend zur Frage nach Art und Befestigung der Siedlungen.
- source_word: הַבְּמַחֲנִים
  choice: offene Siedlungen
  rationale: מַחֲנִים bezeichnet wörtlich Lager; im Gegensatz zu befestigten Orten sind hier unbefestigte, lagerartige Siedlungen gemeint.
- source_word: בְּמִבְצָרִים
  choice: befestigte Orte
  rationale: Gibt den defensiven Charakter von מִבְצָרִים klar und idiomatisch wieder.
