source:
  edition: WLC
  text: וַ/יְסַפְּרוּ ל/וֹ֙ וַ/יֹּ֣אמְר֔וּ בָּ֕אנוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֣ר שְׁלַחְתָּ֑/נוּ וְ֠/גַם זָבַ֨ת חָלָ֥ב וּ/דְבַ֛שׁ הִ֖וא וְ/זֶה פִּרְיָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: de
  text: 'Sie berichteten ihm und sagten: »Wir sind in das Land gekommen, in das du uns geschickt hast. Und tatsächlich[a] fließt es von Milch und Honig über, und das hier ist seine Frucht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ja, es fließt von Milch und Honig über.« Das hebräische וְגַם bekräftigt die Aussage über den Reichtum des Landes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: Sie berichteten
  rationale: Das Piel von ספר bezeichnet hier das Erstatten eines Berichts. „Berichteten“ passt zur förmlichen Rückmeldung der Kundschafter und ist im Deutschen natürlich.
- source_word: לוֹ
  choice: ihm
  rationale: Das hebräische Suffix ist ein Pronomen. Sein Bezug auf Mose ergibt sich aus dem Kontext; deshalb wird der Name nicht ergänzend eingesetzt.
- source_word: וַיֹּאמְרוּ
  choice: und sagten
  rationale: Die Form führt die Erzählung fort und leitet die direkte Rede ein. Die Wiedergabe bewahrt die ausdrückliche Doppelung mit „berichteten“.
- source_word: בָּאנוּ אֶל הָאָרֶץ
  choice: Wir sind in das Land gekommen
  rationale: בוא kann „kommen“ oder „hineingehen/eintreten“ bedeuten. „In das Land gekommen“ gibt sowohl die Bewegung zum Ziel als auch das Betreten des Landes natürlich wieder.
- source_word: אֲשֶׁר שְׁלַחְתָּנוּ
  choice: in das du uns geschickt hast
  rationale: Der Relativsatz nimmt das Land als Ziel des Sendens auf. Im Deutschen ist die Wiederaufnahme mit „in das“ idiomatisch und eindeutig.
- source_word: וְגַם
  choice: Und tatsächlich
  rationale: Die Verbindung bekräftigt hier die positive Aussage über das Land. „Und tatsächlich“ erhält sowohl den Anschluss als auch die emphatische Kraft.
- source_word: זָבַת חָלָב וּדְבַשׁ הִוא
  choice: fließt es von Milch und Honig über
  rationale: Die feststehende hebräische Wendung beschreibt reichen landwirtschaftlichen Ertrag. Die geläufige deutsche Formulierung wahrt das Bild, wobei „es“ auf das Land zurückverweist.
- source_word: וְזֶה פִּרְיָהּ
  choice: und das hier ist seine Frucht
  rationale: '„Das hier“ gibt die hinweisende Funktion von זֶה wieder: Die mitgebrachte Frucht wird als sichtbarer Beleg präsentiert.'
theological_decisions: []
