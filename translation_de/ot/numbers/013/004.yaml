  text: 'Und dies sind ihre Namen: für den Stamm Ruben Schammua, der Sohn Sakkurs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies
  rationale: Die Konjunktion וְ wahrt den Zusammenhang mit der vorangehenden Beauftragung; אֵלֶּה verweist auf die nun folgende Namensliste.
- source_word: שְׁמוֹתָם
  choice: sind ihre Namen
  rationale: Das Hebräische bildet eine Nominalklausel; im Deutschen wird die Kopula „sind“ natürlich ergänzt.
- source_word: לְמַטֵּה
  choice: für den Stamm
  rationale: 'לְ bezeichnet hier die Zuordnung beziehungsweise Vertretung: Der Genannte steht für den jeweiligen Stamm. „Für den Stamm“ erhält diese Funktion genauer als ein bloßes Herkunftsverhältnis.'
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Verwendet wird die im Deutschen übliche biblische Namensform.
- source_word: שַׁמּוּעַ
  choice: Schammua
  rationale: Der Personenname wird nach üblicher deutscher biblischer Schreibweise transliteriert.
- source_word: בֶּן
  choice: der Sohn
  rationale: בֶּן kennzeichnet die Abstammung; mit „der Sohn“ entsteht in der deutschen Aufzählung eine klare und natürliche Fügung.
- source_word: זַכּוּר
  choice: Sakkur
  rationale: Der Personenname wird in der gebräuchlichen deutschen biblischen Form wiedergegeben.
