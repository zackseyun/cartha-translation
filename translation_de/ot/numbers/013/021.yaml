  text: וַֽ/יַּעֲל֖וּ וַ/יָּתֻ֣רוּ אֶת הָ/אָ֑רֶץ מִ/מִּדְבַּר צִ֥ן עַד רְחֹ֖ב לְבֹ֥א חֲמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: de
  text: So zogen sie hinauf und erkundeten das Land von der Wüste Zin bis nach Rehob bei Lebo-Hamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis nach Rehob, dort, wo man nach Hamat kommt“. Die hebräische Wendung kann deskriptiv als Zugang nach Hamat verstanden werden; sie wird jedoch häufig als Ortsname „Lebo-Hamat“ aufgefasst.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: sie zogen hinauf
  rationale: עלה bezeichnet das Hinaufgehen. „Sie zogen hinauf“ bewahrt die Richtungsangabe und klingt für eine Reisegruppe natürlich.
- source_word: וַיָּתֻרוּ
  choice: erkundeten
  rationale: תור bezeichnet hier die planmäßige Erkundung des Landes. „Erkundeten“ ist im Deutschen idiomatisch und legt den Vorgang nicht unnötig auf verdeckte Spionage fest.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang ist das zu erkundende Land Kanaan gemeint; „das Land“ gibt den bestimmten Ausdruck knapp und sachgerecht wieder.
- source_word: מִמִּדְבַּר צִן
  choice: von der Wüste Zin
  rationale: מִדְבָּר bezeichnet ein unbesiedeltes, trockenes Gebiet. „Wüste“ ist im modernen Standarddeutsch natürlich; Zin bleibt als Ortsname erhalten.
- source_word: עַד רְחֹב
  choice: bis nach Rehob
  rationale: עַד kennzeichnet die räumliche Ausdehnung, und „bis nach“ ist bei einem Ortsnamen eine natürliche deutsche Entsprechung.
- source_word: לְבֹא חֲמָת
  choice: dort, wo man nach Hamat kommt
  rationale: Die Wendung wird hier deskriptiv als geographische Bestimmung verstanden. Diese Wiedergabe bewahrt das Verbalsubstantiv בוא und vermeidet, einen eigenständigen Ortsnamen „Lebo-Hamat“ vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erkundeten“ ist gegenüber „spionierten aus“ neutraler und entspricht dem Erkundungsauftrag. Die mehrdeutige geographische Wendung לְבֹא חֲמָת wird im Haupttext deskriptiv wiedergegeben; die mögliche Auffassung als Ortsname steht in der Fußnote.
