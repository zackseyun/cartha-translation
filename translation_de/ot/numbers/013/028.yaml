source:
  edition: WLC
  text: אֶ֚פֶס כִּֽי עַ֣ז הָ/עָ֔ם הַ/יֹּשֵׁ֖ב בָּ/אָ֑רֶץ וְ/הֶֽ/עָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְ/גַם יְלִדֵ֥י הָֽ/עֲנָ֖ק רָאִ֥ינוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: de
  text: Doch das Volk, das im Land wohnt, ist stark, und die Städte sind befestigt und sehr groß; auch haben wir dort die Nachkommen Anaks[a] gesehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Kinder Anaks“. Gemeint sind die von Anak Abstammenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: Doch
  rationale: Die Wendung schränkt den positiven Bericht des vorangehenden Verses nachdrücklich ein. „Doch“ gibt diese adversative Kraft knapp und natürlich wieder.
- source_word: עַז
  choice: stark
  rationale: Das Adjektiv bezeichnet hier die Stärke beziehungsweise Wehrhaftigkeit des Volkes, ohne zwingend dessen Wildheit oder Feindseligkeit auszudrücken.
- source_word: הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: das Volk, das im Land wohnt
  rationale: Die partizipiale Konstruktion wird als natürlicher deutscher Relativsatz wiedergegeben; „Volk“ bewahrt den kollektiven Bezug.
- source_word: וְהֶעָרִים בְּצֻרוֹת גְּדֹלֹת מְאֹד
  choice: und die Städte sind befestigt und sehr groß
  rationale: „Befestigt“ erfasst den militärischen Sinn von בְּצֻרוֹת; die Koordination und die Verstärkung durch מְאֹד bleiben erhalten.
- source_word: וְגַם
  choice: auch
  rationale: Die additive Partikel führt einen weiteren beunruhigenden Befund an.
- source_word: יְלִדֵי הָעֲנָק
  choice: die Nachkommen Anaks
  rationale: Die Konstruktverbindung bezeichnet die von Anak abstammenden Menschen. „Nachkommen“ ist im Deutschen klar und idiomatisch; die wörtlichere Form wird in der Fußnote genannt.
- source_word: רָאִינוּ שָׁם
  choice: haben wir dort … gesehen
  rationale: Das deutsche Perfekt ist in einem berichtenden Aussagesatz natürlich und gibt die abgeschlossene Wahrnehmung wieder; „dort“ erhält die Ortsangabe.
