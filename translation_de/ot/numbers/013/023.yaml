  text: וַ/יָּבֹ֜אוּ עַד נַ֣חַל אֶשְׁכֹּ֗ל וַ/יִּכְרְת֨וּ מִ/שָּׁ֤ם זְמוֹרָה֙ וְ/אֶשְׁכּ֤וֹל עֲנָבִים֙ אֶחָ֔ד וַ/יִּשָּׂאֻ֥/הוּ בַ/מּ֖וֹט בִּ/שְׁנָ֑יִם וּ/מִן הָ/רִמֹּנִ֖ים וּ/מִן הַ/תְּאֵנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: de
  text: Sie kamen bis zum Eschkoltal[a]. Dort schnitten sie einen Rebzweig mit einer einzigen Traube ab, den zwei von ihnen an einer Stange trugen[b]. Sie nahmen auch einige Granatäpfel und Feigen mit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Wadi Eschkol“, „zur Schlucht Eschkol“ oder „zum Bach Eschkol“. Das hebräische Wort נַחַל kann ein Tal, eine Schlucht oder ein zeitweise wasserführendes Bachbett bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Zweig einer Weinrebe mit einer einzigen Traube“. Das hebräische Pronomen kann sich auf den abgeschnittenen Rebzweig samt Traube als eine Einheit beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: Eschkoltal
  rationale: נַחַל bezeichnet je nach Gelände ein Tal, eine Schlucht oder ein zeitweise wasserführendes Bachbett. „Eschkoltal“ ist als geografischer Name im Deutschen natürlich und lässt die genauere Geländeform offen; Alternativen werden in der Fußnote genannt.
- source_word: זְמוֹרָה
  choice: eine Rebe
  rationale: זְמוֹרָה bezeichnet hier einen Rebzweig beziehungsweise eine Weinranke. „Rebe“ ist im Zusammenhang mit der daran hängenden Traube knapp und allgemein verständlich.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: eine einzige Weintraube
  rationale: אֶשְׁכּוֹל עֲנָבִים meint eine einzelne Traube beziehungsweise Weintraube; אֶחָד hebt ihre Einzahl hervor. „Eine einzige Weintraube“ gibt dies idiomatisch wieder.
- source_word: וַיִּשָּׂאֻהוּ בַמּוֹט בִּשְׁנָיִם
  choice: die zwei von ihnen an einer Stange trugen
  rationale: Das singularische Suffix nimmt das abgeschnittene Gebilde als Einheit auf. מוֹט ist eine Tragestange, und בִּשְׁנָיִם bezeichnet zwei Träger aus der zuvor genannten Gruppe.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: Sie nahmen auch einige Granatäpfel und Feigen mit
  rationale: Das Hebräische nennt elliptisch weitere Früchte; das Verb „mitnehmen“ wird aus dem Zusammenhang ergänzt. Der partitive Sinn von מִן wird mit „einige“ natürlich ausgedrückt.
