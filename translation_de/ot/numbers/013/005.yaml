- source_word: לְמַטֵּה
  choice: vom Stamm
  rationale: מַטֶּה bezeichnet in dieser Stammesliste einen Stamm. Die Präposition לְ ordnet den genannten Vertreter dem Stamm zu; im Deutschen gibt „vom Stamm“ die Listenform knapp und natürlich wieder.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Der Name des Stammvaters und Stammes wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: שָׁפָט
  choice: Schafat
  rationale: Der Personenname wird nach gebräuchlicher deutscher Umschrift wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: בֶּן bezeichnet hier die Abstammung. Der bestimmte Artikel sorgt in der deutschen Namensangabe für einen natürlichen Satzfluss.
- source_word: חוֹרִי
  choice: Horis
  rationale: Der Personenname wird in deutscher Umschrift wiedergegeben und zur natürlichen Wiedergabe der hebräischen Status-constructus-Verbindung in den Genitiv gesetzt.
