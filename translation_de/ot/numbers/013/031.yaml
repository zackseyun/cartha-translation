  text: וְ/הָ֨/אֲנָשִׁ֜ים אֲשֶׁר עָל֤וּ עִמּ/וֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַ/עֲל֣וֹת אֶל הָ/עָ֑ם כִּֽי חָזָ֥ק ה֖וּא מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: de
  text: 'Doch die Männer, die mit ihm hinaufgezogen waren, sagten: „Wir können nicht gegen das Volk hinaufziehen[a], denn es ist stärker als wir.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu dem Volk hinaufziehen“; im Zusammenhang ist ein Hinaufziehen gegen das Volk zum Kampf gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen „das Volk“ und das darauf bezogene Pronomen im Singular. Das Deutsche bewahrt den kollektiven Singular mit „es ist stärker als wir“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Doch die Männer
  rationale: Das וְ führt hier im Zusammenhang einen Gegensatz zu Kalebs unmittelbar vorausgehender Aufforderung ein. „Doch“ gibt diese Diskursfunktion in natürlichem Deutsch wieder; „die Männer“ bewahrt die konkrete Bezeichnung.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: die mit ihm hinaufgezogen waren
  rationale: Der Relativsatz bezeichnet die Männer, die Kaleb zuvor begleitet hatten. Das Plusquamperfekt macht dieses zeitliche Verhältnis im Deutschen klar, ohne zusätzliche Information einzutragen.
- source_word: לֹא נוּכַל
  choice: Wir können nicht
  rationale: יכל bezeichnet Fähigkeit oder Vermögen. „Wir können nicht“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: gegen das Volk hinaufziehen
  rationale: עלה bedeutet wörtlich „hinaufgehen/hinaufziehen“. אֶל hat gewöhnlich die Richtung „zu/auf … hin“, bezeichnet hier im militärischen Zusammenhang jedoch eine gegen das Volk gerichtete Bewegung. Die Formulierung bewahrt zugleich das konkrete Verb und macht den Konfliktbezug verständlich.
- source_word: כִּי חָזָק הוּא
  choice: denn es ist stärker
  rationale: כִּי begründet die vorangehende Behauptung. Das singularische „es“ entspricht dem kollektiven Singular הָעָם und klingt mit „das Volk“ auch im Deutschen natürlich.
- source_word: מִמֶּנּוּ
  choice: als wir
  rationale: Die Form kann morphologisch sowohl auf die erste Person Plural („als wir/als uns“) als auch auf die dritte Person Singular („als er/als ihn“) bezogen werden. Der unmittelbare Zusammenhang mit „Wir können nicht“ und die alten Übersetzungen stützen hier „als wir“.
theological_decisions:
- issue: Mögliche Mehrdeutigkeit von מִמֶּנּוּ
  choice: als wir
  alternative: als er/als ihn
  rationale: Die hebräische Form ist formal mehrdeutig. Die Aussage der Kundschafter über ihre eigene fehlende Fähigkeit und die kollektive Stärke des Volkes legt den Vergleich „stärker als wir“ nahe. Die andere grammatische Möglichkeit wird in einer Fußnote offengelegt, ohne eine theologische Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinaufziehen“ erhält das räumliche Bild des hebräischen Verbs und passt zugleich zu einem militärischen Aufbruch. Der kollektive Singular „das Volk … es“ wird beibehalten, da er im Deutschen natürlich ist.
