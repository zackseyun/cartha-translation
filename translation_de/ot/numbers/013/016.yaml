id: NUM.13.16
reference: Numbers 13:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/הוֹשֵׁ֥עַ בִּן נ֖וּן יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: de
  text: Das sind die Namen der Männer, die Mose aussandte, um das Land zu erkunden.[a] Mose nannte Hoschea, den Sohn Nuns, Josua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „um das Land auszukundschaften“. Das hebräische Verb kann sowohl eine allgemeine Erkundung als auch eine gezielte Kundschaftertätigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Hoschea ist die frühere Form von Josuas Namen; hier nennt Mose ihn Josua.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Das sind die Namen
  rationale: Die präsentische Wendung gibt die hebräische deiktische Einführung der zuvor genannten Liste im Deutschen natürlich wieder.
- source_word: הָאֲנָשִׁים
  choice: der Männer
  rationale: Im Zusammenhang sind die namentlich genannten männlichen Stammesvertreter gemeint; daher ist „Männer“ sachlich und grammatisch präzise.
- source_word: שָׁלַח
  choice: aussandte
  rationale: „Aussenden“ ist in diesem Erzählzusammenhang idiomatisch und bildet den gezielten Auftrag deutlicher ab als das allgemeinere „schicken“.
- source_word: לָתוּר
  choice: um … zu erkunden
  rationale: Das Verb bezeichnet hier das untersuchende Durchziehen beziehungsweise die Erkundung des Landes. „Erkunden“ ist modernes, neutrales Deutsch und legt die Tätigkeit nicht einseitig auf Spionage fest.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Die kontextuell bestimmte Bezeichnung wird entsprechend der üblichen biblischen Redeweise als „das Land“ wiedergegeben.
- source_word: וַיִּקְרָא … יְהוֹשֻׁעַ
  choice: nannte … Josua
  rationale: Die Konstruktion bezeichnet hier das Benennen einer Person. „Nannte“ bleibt nahe am Hebräischen und vermeidet eine über das Gesagte hinausgehende Erklärung.
- source_word: הוֹשֵׁעַ
  choice: Hoschea
  rationale: „Hoschea“ gibt die hebräische Namensform im Deutschen transparent wieder und unterscheidet sie von „Josua“.
- source_word: בִּן נוּן
  choice: den Sohn Nuns
  rationale: Die deutsche Genitivform gibt das hebräische Patronym natürlich wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: „Josua“ ist die etablierte deutsche Namensform und gewährleistet unmittelbare Verständlichkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Wiedergabe bleibt nahe an der hebräischen Erzählform, verwendet aber idiomatische deutsche Ausdrücke. Die mögliche Spannweite von לָתוּר wird nicht im Haupttext verengt, sondern in der Fußnote offengehalten.
