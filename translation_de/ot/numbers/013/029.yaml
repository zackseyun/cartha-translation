source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: de
  text: Amalek wohnt im Land des Negev[a], die Hetiter, Jebusiter und Amoriter wohnen im Bergland, und die Kanaaniter wohnen am Meer und am Jordan entlang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Südland“. „Negev“ bezeichnet wahrscheinlich die südliche Region Kanaans.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der Volks- beziehungsweise Eigenname wird entsprechend der im Deutschen eingebürgerten biblischen Form wiedergegeben.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: wohnt / wohnen
  rationale: Das Partizip von ישׁב bezeichnet hier dauerhafte Ansiedlung; „wohnen“ ist natürlich und bewahrt diesen Sinn.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: im Land des Negev
  rationale: נֶגֶב bezeichnet hier wahrscheinlich die bestimmte südliche Trockenzone Kanaans; „Land“ gibt אֶרֶץ ausdrücklich wieder.
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: die Hetiter / Jebusiter / Amoriter / Kanaaniter
  rationale: Die morphologisch singularischen Volksbezeichnungen werden im Deutschen idiomatisch als kollektive Pluralformen wiedergegeben.
- source_word: בָּהָר
  choice: im Bergland
  rationale: הַר bezeichnet in diesem geografischen Zusammenhang nicht nur einen einzelnen Berg, sondern die gebirgige Region.
- source_word: עַל הַיָּם
  choice: am Meer
  rationale: Die räumliche Bedeutung „beim Meer“ wird knapp und natürlich wiedergegeben, ohne sie enger als „Küste“ festzulegen.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: am Jordan entlang
  rationale: Die Wendung bedeutet wörtlich „an der Seite des Jordan“ und bezeichnet idiomatisch das Gebiet längs des Flusses.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „wohnen“ folgt der hebräischen Satzstruktur und unterstreicht die dauerhafte Ansiedlung der genannten Völker.
