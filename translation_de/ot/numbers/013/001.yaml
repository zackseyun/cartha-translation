base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] redete zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; gebräuchlich mit „Jahwe“ wiedergegeben. Traditionell wird der Name auch mit „der HERR“ wiedergegeben.'
    reason: Erläuterung des Gottesnamens und seiner gebräuchlichen Wiedergaben.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … redete
  rationale: Das narrative wayyiqtol führt ein neues Redeereignis ein. „Redete“ wahrt die im Hebräischen erkennbare Unterscheidung zu אמר („sagen“) und entspricht der geläufigen Formel für Gottes Rede.
- source_word: יְהוָה
  choice: JHWH
  rationale: Die vier hebräischen Konsonanten des Gottesnamens werden als „JHWH“ wiedergegeben. So bleibt der Eigenname sichtbar, ohne die historisch nicht völlig sichere Aussprache festzulegen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu“ ist in modernem Deutsch natürlich.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Namensform.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der folgenden direkten Rede ein. Im natürlichen Deutschen erfüllt ein Doppelpunkt diese Funktion, ohne das schwerfällige „und sprach“ oder „indem er sagte“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: JHWH
  alternative: Jahwe; der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen und keinen Titel. „JHWH“ bewahrt dies und vermeidet zugleich, die unsichere Vokalisierung als eindeutig auszugeben; die Fußnote nennt die verbreitete Aussprache „Jahwe“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste hebräische Redeeinleitung wird knapp und natürlich wiedergegeben; der Doppelpunkt eröffnet die in Vers 2 folgende direkte Rede.
