source:
  edition: WLC
  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: de
  text: 'Da brachten sie den Söhnen Israels[c] einen schlechten Bericht[a] über das Land, das sie erkundet[b] hatten, und sagten: »Das Land, durch das wir gezogen sind, um es zu erkunden, ist ein Land, das seine Bewohner verschlingt[d]; und alle Menschen, die wir darin gesehen haben, sind Männer von außergewöhnlicher Größe[e].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen üblen Bericht“; stärker auch: „sie verleumdeten das Land“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ausgekundschaftet“.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch „Söhne Israels“, eine feste Bezeichnung für das Volk Israel als Ganzes.
    reason: cultural_note
  - marker: d
    text: 'Oder: „das seine Bewohner aufzehrt“.'
    reason: lexical_alternative
  - marker: e
    text: 'Wörtlich etwa: „Männer von Maß(en)“; gemeint ist hier ihre auffallende Körpergröße.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: verbreiteten … einen schlechten Bericht
  rationale: Die Verbindung bedeutet wörtlich etwa, einen üblen Bericht hervorzubringen. „Verbreiteten … einen schlechten Bericht“ gibt die idiomatische Handlung in natürlichem Deutsch wieder, ohne im Haupttext bereits die stärkere Deutung „verleumdeten“ festzuschreiben.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: „Land“ wahrt den geografischen und bundestheologischen Kontext und ist im Deutschen die etablierte, natürliche Entsprechung.
- source_word: תָּרוּ / לָתוּר
  choice: erkundet / zu erkunden
  rationale: Das Verb bezeichnet das Auskundschaften oder Erkunden eines Gebiets. „Erkunden“ ist modern und verständlich, ohne den Vorgang unnötig auf Spionage zu verengen.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: unter den Söhnen Israels
  rationale: Die ausdrückliche hebräische Bezeichnung „Söhne Israels“ bleibt sichtbar. „Unter“ passt im Deutschen zur Verbreitung eines Berichts innerhalb des Volkes.
- source_word: עָבַרְנוּ בָהּ
  choice: durch das wir gezogen sind
  rationale: Dies bildet die Bewegung durch das Land idiomatisch und quellennah ab.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: ein Land, das seine Bewohner verschlingt
  rationale: „Verschlingt“ bewahrt die drastische, personifizierende Metapher des hebräischen Partizips besser als eine abschwächende Umschreibung.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: Männer von außergewöhnlicher Größe
  rationale: Die Wendung verweist hier auf auffallende körperliche Größe. Diese Formulierung vermeidet das im Deutschen mögliche Missverständnis von „Männern von Format“ als gesellschaftlich bedeutenden Männern.
theological_decisions:
- issue: Korporative, grammatisch männliche Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Kinder Israels
  rationale: Die Quellform wird beibehalten und durch eine Fußnote als feste Bezeichnung des gesamten Volkes erläutert; damit wird sie weder geschlechtsneutral eingeebnet noch fälschlich auf einzelne erwachsene Männer beschränkt.
- issue: Bewertung des Berichts als דִּבָּה
  choice: schlechter Bericht
  alternative: üble Nachrede / Verleumdung
  rationale: Der Haupttext lässt offen, ob der Ausdruck vor allem einen negativen Bericht oder ausdrücklich verleumderische Rede bezeichnet. Die stärkere Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die drastische Bildsprache des Ausgangstextes bleibt erhalten; erklärungsbedürftige oder stärker deutbare Ausdrücke werden nicht im Haupttext vereindeutigt, sondern in Fußnoten ausgewiesen.
