  text: וַ/יַּעֲל֣וּ בַ/נֶּגֶב֮ וַ/יָּבֹ֣א עַד חֶבְרוֹן֒ וְ/שָׁ֤ם אֲחִימַן֙ שֵׁשַׁ֣י וְ/תַלְמַ֔י יְלִידֵ֖י הָ/עֲנָ֑ק וְ/חֶבְר֗וֹן שֶׁ֤בַע שָׁנִים֙ נִבְנְתָ֔ה לִ/פְנֵ֖י צֹ֥עַן מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: de
  text: Sie zogen in den Negev hinauf, und er kam bis nach Hebron. Dort waren Ahiman, Scheschai und Talmai, die Nachkommen Anaks. Hebron war sieben Jahre vor Zoan in Ägypten erbaut worden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: in den Negev
  rationale: Der bestimmte hebräische Gebietsname bezeichnet die südliche Region; die Umschrift bewahrt den Ortsnamen und passt zur Bewegungsangabe »hinaufziehen«.
- source_word: וַיָּבֹא
  choice: und er kam
  rationale: Der masoretische Text wechselt ausdrücklich vom Plural zum Singular. Diese auffällige Numerusspannung wird entsprechend der Vorlage bewahrt und nicht geglättet.
- source_word: יְלִידֵי הָעֲנָק
  choice: die Nachkommen Anaks
  rationale: Die Wendung bezeichnet die von Anak Abstammenden; »Nachkommen« ist im heutigen Deutsch natürlich und lässt offen, wie viele Generationen gemeint sind.
- source_word: לִפְנֵי
  choice: vor
  rationale: 'Im Zusammenhang mit »sieben Jahre« ist die zeitliche Bedeutung eindeutig: Hebron wurde sieben Jahre früher als Zoan erbaut.'
- source_word: צֹעַן מִצְרָיִם
  choice: Zoan in Ägypten
  rationale: Die Ortsbestimmung wird idiomatisch wiedergegeben und identifiziert Zoan als ägyptische Stadt.
theological_decisions:
- issue: Numeruswechsel von »sie zogen« zu »er kam«
  choice: Den Wechsel zwischen Plural und Singular im Haupttext bewahren.
  alternative: 'Den Singular an den Kontext angleichen: »und sie kamen bis nach Hebron«.'
  rationale: Der WLC liest eindeutig וַיַּעֲלוּ im Plural und anschließend וַיָּבֹא im Singular. Da die Referenz des Singulars nicht ausdrücklich genannt wird, soll die echte textliche Spannung nicht stillschweigend aufgelöst werden.
- issue: Bezeichnung der Anak-Nachkommen
  choice: »die Nachkommen Anaks«
  alternative: »die Anakiter« oder »die Söhne Anaks«
  rationale: Die gewählte Form bleibt nah an der Abstammungsaussage, ohne eine weitergehende ethnische oder genealogische Präzisierung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die auffällige Singularform »er kam« wird aus Quellentreue beibehalten; keine Fußnote ist nötig, da die Ambiguität im Haupttext sichtbar bleibt.
