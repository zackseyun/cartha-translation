  yaml_path: translation/ot/numbers/013/011.yaml
  text: 'from the tribe of Joseph[a], from the tribe of Manasseh: Gaddi son of Susi.'
translation:
  language: de
  text: 'vom Stamm Josef, vom Stamm Manasse: Gaddi, der Sohn Susis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: vom Stamm
  rationale: Die Präposition לְ kennzeichnet in dieser Aufzählung die Stammeszugehörigkeit beziehungsweise den Stamm, den der Genannte vertritt. „Vom Stamm“ ist im Deutschen natürlich und sachgerecht.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: vom Stamm Manasse
  rationale: Die Wiederholung von לְמַטֵּה bleibt erhalten und verdeutlicht, dass hier innerhalb Josefs konkret Manasse gemeint ist.
- source_word: גַּדִּי
  choice: Gaddi
  rationale: Direkte Wiedergabe des hebräischen Personennamens in einer geläufigen deutschen Form.
- source_word: בֶּן
  choice: der Sohn
  rationale: „Der Sohn“ gibt die genealogische Beziehung in der deutschen Aufzählung klar und natürlich wieder.
- source_word: סוּסִי
  choice: Susis
  rationale: Der Name Susi steht nach „Sohn“ idiomatisch im deutschen Genitiv.
