  rationale: Die Revision ersetzt die misslungene Schlussapposition durch einen klaren deutschen Folgesatz, ohne den Rang von נָשִׂיא näher festzulegen. Die distributive Wendung wird mit „je einen Mann aus dem Stamm seiner Väter“ transparent und idiomatisch wiedergegeben. Die Ambiguität von לְךָ bleibt mit „dir“ im Haupttext erhalten.
