  naturalness: Der erste Satz ist modernes, verständliches Standarddeutsch. Im zweiten Satz ist „jeden einen führenden Mann unter ihnen“ keine natürliche bzw. grammatisch tragfähige deutsche Konstruktion. Eine finite Folgekonstruktion stellt die Aussage klar dar.
  terminology: „Männer“, „Land Kanaan“, „Söhnen Israels“ und „Anführer“ sind angemessen. „Anführer“ gibt נָשִׂיא neutral und modern wieder; die Fußnote bewahrt mögliche spezifischere Rangbezeichnungen.
