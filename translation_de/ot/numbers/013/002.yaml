source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: de
  text: Schick dir Männer aus, damit sie das Land Kanaan erkunden[a], das ich den Söhnen Israels gebe. Ihr sollt je einen Mann aus dem Stamm seiner Väter aussenden; jeder soll ein Anführer unter ihnen sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auskundschaften.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: jeder soll ein Stammesoberster unter ihnen sein; das hebräische Wort kann einen Anführer, Obersten oder Fürsten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: Schick dir Männer aus
  rationale: Der Imperativ שְׁלַח wird mit „schick … aus“ wiedergegeben; das Dativpronomen לְךָ bleibt als „dir“ sichtbar, ohne seine mögliche Nuance als persönliche Beauftragung, Erlaubnis oder Betonung festzulegen.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Der maskuline Plural bezeichnet hier die männlichen Vertreter der Stämme.
- source_word: וְיָתֻרוּ
  choice: damit sie … erkunden
  rationale: תור bezeichnet hier das Erkunden bzw. Auskundschaften des Landes. „Erkunden“ ist natürliches heutiges Deutsch und legt den Ausdruck nicht ausschließlich auf heimliche Spionage fest.
- source_word: אֶרֶץ כְּנַעַן
  choice: das Land Kanaan
  rationale: Die deutsche Fügung gibt אֶרֶץ ausdrücklich wieder und bezeichnet Kanaan idiomatisch als Land.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: das ich … gebe
  rationale: Das Partizip נֹתֵן stellt die göttliche Gabe als gegenwärtig bzw. im Vollzug begriffen dar; das deutsche Präsens wahrt diese Offenheit.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die familiäre und bundestheologisch geprägte hebräische Wendung wird formal bewahrt; sie bezeichnet das Volk Israel insgesamt.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: Je einen Mann aus jedem Stamm
  rationale: „Je einen“ gibt die distributive und durch Wiederholung betonte Auswahl verständlich wieder.
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: aus jedem Stamm ihrer Vorfahren
  rationale: מַטֶּה bedeutet hier „Stamm“, אֲבֹתָיו verweist auf die Abstammungslinie. Der deutsche Plural „ihrer Vorfahren“ bezieht sich natürlich auf die auszusendenden Männer.
- source_word: תִּשְׁלָחוּ
  choice: sollt ihr aussenden
  rationale: Der Imperfekt trägt hier anweisende Kraft. „Sollt ihr“ gibt die pluralische Weisung klar wieder.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: jeden einen führenden Mann unter ihnen
  rationale: נָשִׂיא bezeichnet einen anerkannten Führenden, Stammesobersten oder Fürsten. Die Formulierung hält offen, welchen genauen Rang diese Männer innehatten.
theological_decisions:
- issue: Nuance von לְךָ im göttlichen Auftrag
  choice: Im Haupttext als „dir“ beibehalten
  alternative: Als idiomatisches Element unübersetzt lassen oder mit „für dich“ wiedergeben
  rationale: Die Wiedergabe bewahrt die im Hebräischen vorhandene persönliche Nuance, ohne zu entscheiden, ob sie Erlaubnis, persönliche Beteiligung oder bloße Hervorhebung ausdrückt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: „den Söhnen Israels“
  alternative: „den Israeliten“ oder „den Kindern Israels“
  rationale: Die gewählte Form erhält die familiäre Bundesbezeichnung des Ausgangstextes. Gemeint ist dabei das Volk Israel als Ganzes, nicht nur dessen männliche Angehörige.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schick“ ist die heutige standardsprachliche Imperativform und wirkt weniger altertümlich als „sende“. Die Wiederholung und Satzstellung bewahren den anweisenden Charakter, ohne unnötig hebraisierend zu klingen.
