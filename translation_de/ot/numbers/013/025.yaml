  text: וַ/יָּשֻׁ֖בוּ מִ/תּ֣וּר הָ/אָ֑רֶץ מִ/קֵּ֖ץ אַרְבָּעִ֥ים יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: de
  text: Nach vierzig Tagen kehrten sie von der Erkundung des Landes zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von der Erforschung des Landes“ oder „vom Ausspähen des Landes“. Das hebräische Verb bezeichnet hier die Untersuchung des Landes im Rahmen eines Erkundungsauftrags.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: kehrten sie zurück
  rationale: Das Qal-Wayyiqtol, 3. Person Plural, von שׁוב führt die Erzählung fort. Die deutsche Verbform gibt die Rückkehr natürlich wieder; das וַ wird im deutschen Erzählfluss nicht eigens mit „und“ ausgedrückt.
- source_word: מִתּוּר
  choice: von der Erkundung
  rationale: Der Infinitivus constructus von תור mit מִן bezeichnet die Tätigkeit, von der sie zurückkehrten. „Erkundung“ trifft im Zusammenhang den Charakter einer planmäßigen Untersuchung, ohne die abwertende Nebenbedeutung von „Ausspähung“ aufzudrängen.
- source_word: הָאָרֶץ
  choice: des Landes
  rationale: אָרֶץ bezeichnet hier das konkret untersuchte Land, nicht die Erde im umfassenden Sinn.
- source_word: מִקֵּץ
  choice: nach
  rationale: Die Verbindung bezeichnet den Zeitpunkt, an dem der genannte Zeitraum vollständig abgelaufen ist. Im Deutschen gibt „nach vierzig Tagen“ dies idiomatisch und präzise wieder.
- source_word: אַרְבָּעִים יוֹם
  choice: vierzig Tagen
  rationale: Die hebräische Maßangabe aus Zahlwort und singularischem יוֹם wird im Deutschen idiomatisch im Plural wiedergegeben.
