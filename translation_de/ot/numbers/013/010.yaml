lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: vom Stamm
  rationale: Die Verbindung aus לְ und מַטֶּה bezeichnet in dieser Listenformel die Stammeszugehörigkeit beziehungsweise Vertretung; „vom Stamm“ ist im Deutschen knapp und natürlich.
- source_word: זְבוּלֻן
