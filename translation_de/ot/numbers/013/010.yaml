  rationale: Der Stammesname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: גַּדִּיאֵל
  choice: Gaddiël
  rationale: Der Personenname wird möglichst quellennah transliteriert; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: בֶּן
  choice: der Sohn
  rationale: בֶּן bezeichnet das Sohnverhältnis; mit Artikel fügt sich die Angabe natürlich in die deutsche Namensliste ein.
- source_word: סוֹדִי
  choice: Sodis
  rationale: Der Personenname wird transliteriert und im deutschen Genitiv an „Sohn“ angeschlossen.
