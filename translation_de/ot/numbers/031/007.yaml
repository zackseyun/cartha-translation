source:
  edition: WLC
  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: de
  text: Sie zogen gegen Midian in den Krieg[a], wie Jahwe es Mose geboten hatte, und töteten alles Männliche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie kämpften gegen Midian.“ Das hebräische Verb kann militärischen Dienst oder Kriegsführung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: sie zogen … in den Krieg
  rationale: Das Verb צבא bezeichnet hier militärischen Einsatz beziehungsweise Kriegsführung. Die deutsche Wendung ist natürlich und bewahrt den militärischen Sinn.
- source_word: עַל
  choice: gegen
  rationale: In Verbindung mit militärischem Handeln bezeichnet עַל die feindliche Ausrichtung gegen Midian.
- source_word: מִדְיָן
  choice: Midian
  rationale: Der Eigenname wird nach üblicher deutscher Form wiedergegeben.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion bezeichnet die Übereinstimmung des Handelns mit dem zuvor ergangenen Befehl.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass das Gebot dem Kriegszug vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: אֶת מֹשֶׁה
  choice: es Mose
  rationale: אֶת kennzeichnet Mose als direktes Objekt von „gebieten“. Das ergänzte „es“ ermöglicht eine natürliche deutsche Satzstellung und verweist auf das gebotene Vorgehen.
- source_word: וַיַּהַרְגוּ
  choice: und töteten
  rationale: הרג bedeutet direkt „töten“; die Übersetzung bleibt sachlich und unbeschönigt.
- source_word: כָּל זָכָר
  choice: alles Männliche
  rationale: זָכָר bezeichnet das männliche Geschlecht und ist nicht auf erwachsene Männer beschränkt. „Alles Männliche“ bewahrt mit כָּל den umfassenden, kollektiv-singularischen Ausdruck des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang von זָכָר
  choice: alles Männliche
  alternative: alle Männer
  rationale: Der hebräische Ausdruck bezeichnet männliche Personen nach ihrem Geschlecht, ohne die Aussage auf erwachsene Männer einzugrenzen. Die Übersetzung lässt den erschütternd umfassenden Wortlaut unverändert stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und direkt; die Härte der Aussage wird weder abgeschwächt noch erklärend erweitert.
