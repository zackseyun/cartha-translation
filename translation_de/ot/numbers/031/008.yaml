  text: וְ/אֶת מַלְכֵ֨י מִדְיָ֜ן הָרְג֣וּ עַל חַלְלֵי/הֶ֗ם אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע חֲמֵ֖שֶׁת מַלְכֵ֣י מִדְיָ֑ן וְ/אֵת֙ בִּלְעָ֣ם בֶּן בְּע֔וֹר הָרְג֖וּ בֶּ/חָֽרֶב־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: de
  text: 'Sie töteten die Könige von Midian zusammen mit den übrigen Erschlagenen[a]: Ewi, Rekem, Zur, Hur und Reba, die fünf Könige von Midian. Sie töteten auch Bileam, den Sohn Beors, mit dem Schwert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter ihren Erschlagenen«. Die hebräische Wendung ist knapp und kann besagen, dass die Könige unter den anderen Toten Midians getötet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: töteten sie
  rationale: Das Qal Perfekt 3. Person Plural von הרג bezeichnet unmittelbar das Töten; die deutsche Wortstellung greift den vorangestellten Gegenstand des hebräischen Satzes auf.
- source_word: עַל חַלְלֵיהֶם
  choice: zusammen mit den übrigen Erschlagenen
  rationale: Die knappe Wendung bedeutet wörtlich etwa »auf/bei ihren Erschlagenen« und kann die Könige als unter beziehungsweise zusammen mit den anderen Toten getötet beschreiben. »Den übrigen« macht den im Zusammenhang naheliegenden einschließenden Sinn verständlich, ohne die räumliche Nuance im Haupttext festzuschreiben.
- source_word: מַלְכֵי מִדְיָן
  choice: die Könige von Midian
  rationale: Die Status-constructus-Verbindung wird direkt und natürlich wiedergegeben; dieselbe Formulierung bleibt in der nachfolgenden Apposition erhalten.
- source_word: אֱוִי
  choice: Ewi
  rationale: Der Personenname wird nach geläufiger deutscher biblischer Umschrift wiedergegeben.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Der Personenname wird transliteriert.
- source_word: צוּר
  choice: Zur
  rationale: Der Personenname wird in der geläufigen deutschen biblischen Form wiedergegeben.
- source_word: חוּר
  choice: Hur
  rationale: Der Personenname wird in geläufiger deutscher Form transliteriert.
- source_word: רֶבַע
  choice: Reba
  rationale: Der Personenname wird in der geläufigen deutschen biblischen Form wiedergegeben.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: die fünf Könige von Midian
  rationale: Die Wortgruppe fasst die fünf zuvor genannten Männer appositionell zusammen.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Bileam, den Sohn Beors
  rationale: Der Personenname und das Patronym werden idiomatisch und zugleich eng am Hebräischen wiedergegeben.
- source_word: בֶּחָרֶב
  choice: mit dem Schwert
  rationale: Das instrumentale ב wird mit »mit« wiedergegeben und das konkrete Tötungsinstrument bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »die Könige von Midian« und das konkrete »mit dem Schwert« bewahren die Struktur und Bildlichkeit des Hebräischen. Die Mehrdeutigkeit von עַל חַלְלֵיהֶם wird durch eine Fußnote offengehalten.
