lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: die Männer des Heeres
  rationale: Die Konstruktverbindung bezeichnet die männlichen Angehörigen der Streitmacht. „Männer des Heeres“ gibt sowohl die Form als auch den militärischen Zusammenhang in würdigem, natürlichem Deutsch wieder.
- source_word: בָּזְזוּ
  choice: hatten … Beute gemacht
  rationale: Das Verb בזז bedeutet „plündern, Beute machen“. Das Plusquamperfekt verdeutlicht im Erzählzusammenhang die bereits vollzogene Handlung; „Beute machen“ ist idiomatisch und bewahrt den Sinn ohne unnötige Ergänzung.
- source_word: אִישׁ לוֹ
  choice: jeder für sich
  rationale: Die distributive Wendung besagt, dass jeder Einzelne Beute für sich selbst genommen hatte. „Jeder für sich“ ist knapp und natürlich; der Bezug auf die Männer ist aus dem Satz eindeutig.
