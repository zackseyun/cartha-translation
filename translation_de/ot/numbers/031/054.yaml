  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה וְ/אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶת הַ/זָּהָ֔ב מֵ/אֵ֛ת שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/הַ/מֵּא֑וֹת וַ/יָּבִ֤אוּ אֹת/וֹ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד זִכָּר֥וֹן לִ/בְנֵֽי יִשְׂרָאֵ֖ל לִ/פְנֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: de
  text: So nahmen Mose und der Priester Eleasar das Gold von den Befehlshabern über Tausendschaften und Hundertschaften und brachten es in das Zelt der Begegnung, als Erinnerungszeichen für die Söhne Israels[a] vor Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Israeliten«. Wörtlich steht im Hebräischen »die Söhne Israels«, eine herkömmliche Bezeichnung für das Bundesvolk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: So nahmen
  rationale: לקח bedeutet hier im fortlaufenden Erzählzusammenhang „nehmen“. Wegen des zusammengesetzten Subjekts steht das Verb im Deutschen idiomatisch im Plural; „So“ stellt den folgernden Anschluss an den vorherigen Vers her.
- source_word: הַזָּהָב
  choice: das Gold
  rationale: Der bestimmte Artikel bezeichnet das zuvor genannte Gold.
- source_word: מֵאֵת
  choice: von
  rationale: Die Präposition kennzeichnet hier die Herkunft beziehungsweise die Personen, von denen das Gold genommen wurde.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: den Befehlshabern über Tausendschaften und Hundertschaften
  rationale: שׂרים bezeichnet im militärischen Kontext Befehlshaber. „Tausendschaften“ und „Hundertschaften“ gibt die militärisch-administrativen Einheiten wieder, ohne zwingend exakte Mannschaftsstärken zu behaupten.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung bezeichnet das Heiligtum, an dem Gott seinem Volk begegnet; diese Wiedergabe ist verständlich und bewahrt den Bedeutungsgehalt von מועד.
- source_word: זִכָּרוֹן
  choice: als Erinnerungszeichen
  rationale: Das Substantiv bezeichnet etwas, das Erinnerung beziehungsweise Gedenken bewirkt. „Erinnerungszeichen“ macht den gegenständlichen und kultischen Sinn im Deutschen deutlich.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Söhne Israels
  rationale: Die formnahe Wiedergabe bewahrt die konventionelle bundesbezogene Bezeichnung בני ישראל; eine idiomatischere Alternative wird in der Fußnote genannt.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet die kultische Gegenwart Jahwes und wird knapp sowie formnah wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt diesen als persönlichen Gottesnamen, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
- issue: Wiedergabe von בני ישראל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die formnahe Wiedergabe erhält die grammatische Gestalt und den bundesgeschichtlichen Charakter der festen Bezeichnung. Die idiomatische, geschlechtsübergreifend verstandene Alternative wird transparent in der Fußnote angegeben.
translation_notes:
  register: Moderne, würdige Standardsprache. „Tausendschaften und Hundertschaften“ verdeutlicht die militärischen Einheiten; „Zelt der Begegnung“ und „Erinnerungszeichen“ bleiben quellennah und zugleich verständlich. Der Fußnotenmarker steht unmittelbar bei der erläuterten Wendung.
