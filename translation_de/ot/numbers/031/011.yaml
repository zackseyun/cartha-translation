  yaml_path: translation/ot/numbers/031/011.yaml
  text: And they took all the spoil and all the plunder, both man and beast.
translation:
  language: de
  text: Sie nahmen die gesamte Beute und alles Erbeutete an Menschen und Vieh mit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: Beute
  rationale: Die übliche Bezeichnung für im Krieg erbeutete Güter; sie bleibt vom folgenden מַלְקוֹחַ unterschieden.
- source_word: מַלְקוֹחַ
  choice: alles Erbeutete
  rationale: Das Wort bezeichnet das Weggenommene bzw. Gefangene und wird durch die folgende Angabe »an Menschen und Vieh« näher bestimmt. Die substantivierte Form gibt den Sammelbegriff natürlich wieder, ohne ihn enger als der hebräische Text festzulegen.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: an Menschen und Vieh
  rationale: Die hebräische Konstruktion spezifiziert den מַלְקוֹחַ nach seinem Inhalt; »Menschen« ist im heutigen Deutsch idiomatischer und semantisch angemessener als der kollektive Singular »Mensch«.
- source_word: וַיִּקְחוּ
  choice: Sie nahmen … mit
  rationale: Im Kontext bezeichnet לקח das an sich Nehmen und Mitführen der Beute; die Satzklammer ist natürliches modernes Deutsch.
