  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: de
  text: Aber alle Mädchen, die noch nicht mit einem Mann geschlafen haben, lasst für euch am Leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Aber alle
  rationale: וְ setzt das Gebot fort und bildet im Zusammenhang einen Gegensatz zu den vorherigen Tötungsbefehlen; כֹל mit dem Kollektivbegriff wird im Deutschen natürlich mit „alle“ wiedergegeben.
- source_word: הַטַּף בַּנָּשִׁים
  choice: Mädchen unter den Frauen
  rationale: טַף bezeichnet Kinder bzw. junge Angehörige einer Gruppe. Durch בַּנָּשִׁים und den anschließenden Relativsatz ist hier die weibliche Teilgruppe gemeint. „Mädchen“ gibt diese kontextuelle Eingrenzung wieder, ohne ein bestimmtes Alter festzulegen.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: die noch nicht mit einem Mann geschlafen haben
  rationale: Die Verbindung von יָדַע mit מִשְׁכַּב זָכָר ist ein Euphemismus für Geschlechtsverkehr. Die deutsche Wendung ist verständlich und bewahrt einen geläufigen bildhaften Ausdruck, statt den abstrakten Begriff „Jungfrau“ einzuführen.
- source_word: הַחֲיוּ לָכֶם
  choice: lasst für euch am Leben
  rationale: Der Hifil-Imperativ von חיה verlangt, jemanden am Leben zu lassen. „Für euch“ bewahrt לָכֶם, ohne den vom Text nicht näher bestimmten Zweck auszudeuten.
theological_decisions:
- issue: Wiedergabe des sexuellen Euphemismus
  choice: die noch nicht mit einem Mann geschlafen haben
  alternative: die das Beilager eines Mannes nicht gekannt haben; die keinen Geschlechtsverkehr mit einem Mann gehabt haben; die Jungfrauen sind
  rationale: Die gewählte Formulierung vermittelt den sexuellen Sinn in natürlichem heutigen Deutsch und bleibt euphemistisch. „Jungfrauen“ wäre knapper, würde aber eine abstrakte Bezeichnung an die Stelle der konkreten hebräischen Umschreibung setzen.
- issue: Geschlecht und Alter der mit טַף bezeichneten Personen
  choice: Mädchen
  alternative: Kinder; junge Mädchen; weibliche Kinder
  rationale: טַף allein ist nicht weiblich markiert und bezeichnet Kinder bzw. junge Angehörige; der unmittelbare Kontext grenzt die Gruppe jedoch auf weibliche Personen ein. „Mädchen“ macht diese Eingrenzung deutlich, ohne über das im Text angegebene Alter hinauszugehen.
- issue: Bedeutung von לָכֶם
  choice: für euch
  alternative: für euch selbst; als euren Besitz
  rationale: Die Präpositionalform wird ausdrücklich bewahrt. Der Text erklärt an dieser Stelle nicht näher, wozu die Überlebenden bestimmt sind; eine Ergänzung wie „als euren Besitz“ würde die Aussage stärker festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Härte des Befehls wird weder abgeschwächt noch durch erläuternde Zusätze verschärft. Die Satzstellung bleibt gut verständlich und lehnt sich zugleich eng an die hebräische Abfolge an.
