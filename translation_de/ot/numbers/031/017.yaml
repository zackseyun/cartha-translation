  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: de
  text: Und nun tötet alle männlichen Kinder, und tötet jede Frau, die mit einem Mann geschlafen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die einen Mann erkannt hat, indem sie mit einem Mann lag“. „Erkennen“ ist hier eine hebräische Umschreibung für Geschlechtsverkehr.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise, während der Haupttext ihren idiomatischen Sinn natürlich wiedergibt.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Funktion von וְ als auch den Übergang zum unmittelbar folgenden Befehl durch עַתָּה knapp und natürlich wieder.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: tötet
  rationale: Die Imperative von הרג sind direkt und nachdrücklich. „Tötet“ bewahrt diese Härte, ohne sie durch eine beschönigende Umschreibung abzuschwächen.
- source_word: כָל זָכָר בַּטָּף
  choice: alle männlichen Kinder
  rationale: זָכָר bezeichnet das männliche Geschlecht, während טַף hier die kleinen Kinder beziehungsweise die abhängigen Kleinen bezeichnet. Die deutsche Formulierung gibt beide Bestandteile verständlich wieder.
- source_word: כָל אִשָּׁה
  choice: jede Frau
  rationale: אִשָּׁה bezeichnet hier Frauen allgemein und nicht speziell Ehefrauen; כָל hat in der singularischen Wendung distributiven Sinn.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: die mit einem Mann geschlafen hat
  rationale: Die Verbindung aus „einen Mann kennen“ und der näheren Bestimmung durch das Liegen ist ein hebräischer Ausdruck für Geschlechtsverkehr. Die gewählte Formulierung gibt den Sinn in natürlichem modernem Deutsch wieder; die wörtlichere Gestalt wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe eines moralisch erschütternden Kriegsbefehls
  choice: Den Tötungsbefehl direkt und ohne Abschwächung übersetzen
  alternative: Mit „bringt ... um“ oder „lasst ... sterben“ euphemistischer beziehungsweise indirekter formulieren
  rationale: Der hebräische Text enthält einen unmittelbaren, harten Befehl. Die Übersetzung darf dessen Schwere weder mildern noch durch moralische oder historische Erklärungen im Haupttext erweitern.
- issue: Sexuelle Umschreibung im Hebräischen
  choice: Den gemeinten sexuellen Verkehr im Haupttext idiomatisch als „mit einem Mann geschlafen hat“ wiedergeben
  alternative: Die hebräische Wendung formal als „einen Mann erkannt hat zum Beischlaf eines Männlichen“ nachbilden
  rationale: Eine streng formale Nachbildung wäre im Deutschen unnatürlich und teilweise missverständlich. Die Fußnote erhält die sprachliche Eigenart des Ausgangstextes, ohne den Sinn im Haupttext zu verdunkeln.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die imperativische Härte des Verses bleibt unverändert sichtbar; altertümliche Wörter wie „erschlagen“ oder „Beischlaf“ werden im Haupttext vermieden.
