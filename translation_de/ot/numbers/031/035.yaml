  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: de
  text: Und von den Frauen, die keinen Geschlechtsverkehr mit einem Mann gehabt hatten[a], waren es insgesamt 32.000 Personen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die das Lager eines Mannes nicht gekannt hatten“; eine hebräische Umschreibung dafür, dass sie keinen Geschlechtsverkehr mit einem Mann gehabt hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶפֶשׁ אָדָם מִן הַנָּשִׁים
  choice: Und die Frauen … waren … Personen
  rationale: נֶפֶשׁ אָדָם bezeichnet hier menschliche Personen im Gegensatz zum zuvor gezählten Vieh. Im Deutschen wäre eine wörtliche Wiedergabe wie „Menschenseelen von den Frauen“ unnatürlich; die Satzgestaltung benennt die Gruppe zunächst als Frauen und greift für die Gesamtzahl „Personen“ auf.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: die noch keinen Geschlechtsverkehr mit einem Mann gehabt hatten
  rationale: Die Verbindung aus יָדַע und מִשְׁכַּב זָכָר ist eine Umschreibung für sexuelle Beziehungen mit einem männlichen Menschen. Die sinngemäße Wiedergabe ist im modernen Deutschen klar und würdig; der hebräische Wortlaut bleibt in der Fußnote sichtbar.
- source_word: כָּל נֶפֶשׁ
  choice: insgesamt … Personen
  rationale: Die Wendung nimmt die genannte Gruppe auf und führt ihre Gesamtzahl an. „insgesamt“ bildet diese summierende Funktion idiomatisch ab.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: '32.000'
  rationale: Übliche deutsche Wiedergabe der Zahl zweiunddreißigtausend.
