  source_fidelity: 'Der Entwurf gibt die Satzstruktur und sämtliche wesentlichen Elemente des Hebräischen zutreffend wieder: die Annäherung an Mose, die eingesetzten militärischen Amtsträger, ihren Zuständigkeitsbereich bei den Tausenderverbänden des Heeres sowie die nähere Benennung als Oberste über Tausend und über Hundert. Die Fußnote bewahrt sachgerecht die mögliche Nichtnumerik von אֶלֶף.'
