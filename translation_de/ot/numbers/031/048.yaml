source:
  edition: WLC
  text: וַֽ/יִּקְרְבוּ֙ אֶל מֹשֶׁ֔ה הַ/פְּקֻדִ֕ים אֲשֶׁ֖ר לְ/אַלְפֵ֣י הַ/צָּבָ֑א שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/שָׂרֵ֥י הַ/מֵּאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: de
  text: Da traten die Befehlshaber, die über die Tausenderverbände[a] des Heeres eingesetzt waren – die Obersten über Tausend und die Obersten über Hundert –, an Mose heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Tausende“. Gemeint sind militärische Einheiten; ob damit jeweils eine genaue Truppenstärke bezeichnet wird, bleibt offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: Da traten … an Mose heran
  rationale: קרב bezeichnet hier die Bewegung auf Mose zu. „Herantreten“ bewahrt den konkreten Sinn und passt zum erzählenden Zusammenhang.
- source_word: הַפְּקֻדִים
  choice: die Befehlshaber
  rationale: Die Form bezeichnet hier Männer, die über militärische Einheiten eingesetzt sind. „Befehlshaber“ gibt ihre Funktion im Kontext klar und in heutiger Sprache wieder.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: die über die Tausenderverbände des Heeres eingesetzt waren
  rationale: Die Formulierung drückt den Verantwortungsbereich dieser Befehlshaber aus; der folgende Zusatz benennt ihre Ränge genauer.
- source_word: אַלְפֵי
  choice: Tausenderverbände
  rationale: אֶלֶף kann die Zahl Tausend, eine militärische Einheit oder in anderen Zusammenhängen eine Sippenordnung bezeichnen. Im militärischen Kontext ist „Tausenderverbände“ angemessen, ohne eine exakte tatsächliche Truppenstärke zu behaupten.
- source_word: הַצָּבָא
  choice: des Heeres
  rationale: צבא bezeichnet hier die organisierte Streitmacht. „Heer“ ist im Deutschen klar, würdig und dem alttestamentlichen Militärkontext angemessen.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: die Obersten über Tausend
  rationale: שׂר bezeichnet einen führenden Amtsträger. Die traditionelle, weiterhin verständliche militärische Wendung bewahrt die Rang- und Einheitenstruktur des Hebräischen.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: und die Obersten über Hundert
  rationale: Die parallele Wiedergabe erhält die im hebräischen Text erkennbare militärische Gliederung.
theological_decisions: []
