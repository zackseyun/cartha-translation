  text: אַ֥ךְ אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כָּ֑סֶף אֶֽת הַ/נְּחֹ֨שֶׁת֙ אֶת הַ/בַּרְזֶ֔ל אֶֽת הַ/בְּדִ֖יל וְ/אֶת הָ/עֹפָֽרֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: de
  text: Nur das Gold, das Silber, die Bronze[a], das Eisen, das Zinn und das Blei –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kupfer. Der hebräische Ausdruck kann allgemein ein Metall auf Kupferbasis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Nur
  rationale: Das Wort leitet hier eine Einschränkung beziehungsweise Ausnahme gegenüber der vorangehenden Anweisung ein; „Nur“ gibt diese Funktion knapp und natürlich wieder.
- source_word: הַזָּהָב
  choice: das Gold
  rationale: Die übliche Bezeichnung für das Metall Gold.
- source_word: הַכָּסֶף
  choice: das Silber
  rationale: Im Zusammenhang einer Metallliste bezeichnet כֶּסֶף Silber, nicht Geld.
- source_word: הַנְּחֹשֶׁת
  choice: die Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder ein kupferbasiertes Metall wie Bronze bezeichnen. „Bronze“ entspricht der herkömmlichen Wiedergabe in biblischen Metalllisten; die echte lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: הַבַּרְזֶל
  choice: das Eisen
  rationale: Die übliche deutsche Wiedergabe des Metalls בַּרְזֶל.
- source_word: הַבְּדִיל
  choice: das Zinn
  rationale: In dieser Aufzählung von Metallen ist „Zinn“ die naheliegende Bedeutung von בְּדִיל.
- source_word: הָעֹפָרֶת
  choice: das Blei
  rationale: Die übliche deutsche Wiedergabe des Metalls עֹפָרֶת.
- source_word: אֵת (wiederholt vor jedem Substantiv)
  choice: nicht eigens wiedergegeben
  rationale: Der hebräische Akkusativmarker gliedert und betont die Aufzählung, hat im Deutschen jedoch keine direkte Entsprechung; seine strukturierende Funktion wird durch die Reihung und Zeichensetzung vermittelt.
