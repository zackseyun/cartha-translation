  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: de
  text: Die Kriegsbeute[a] – der Rest des Beuteguts, das die Angehörigen des Heeres erbeutet hatten – betrug 675.000 Schafe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Beutegut, der Rest der Beute“. Im Hebräischen stehen hier zwei eng verwandte Begriffe für Kriegsbeute (מַלְקוֹחַ und בָּז), vermutlich mit stilistischer oder sachlicher Nuance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: betrug
  rationale: Die Form leitet die Bestandsangabe ein. „Betrug“ gibt die kopulative Aussage bei einer gezählten Menge im modernen Deutschen natürlich wieder; ein zusätzliches „nun“ ist im Hebräischen nicht ausdrücklich vorhanden.
- source_word: הַמַּלְקוֹחַ
  choice: die Kriegsbeute
  rationale: Das Wort bezeichnet das im Krieg Erbeutete. „Kriegsbeute“ macht den militärischen Zusammenhang klar und lässt sich vom folgenden, nahezu gleichbedeutenden Begriff stilistisch unterscheiden.
- source_word: יֶתֶר הַבָּז
  choice: der Rest des Beuteguts
  rationale: „Rest“ bewahrt die Bedeutung von יֶתֶר, während „Beutegut“ den zweiten Beutebegriff wiedergibt, ohne beide hebräischen Wörter völlig gleichzusetzen.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: das … erbeutet hatten
  rationale: „Erbeuten“ entspricht dem militärischen Vorgang präzise. Das Plusquamperfekt verdeutlicht, dass die Erbeutung der anschließenden Bestandsangabe vorausging.
- source_word: עַם הַצָּבָא
  choice: die Angehörigen des Heeres
  rationale: Die Wiedergabe erhält sowohl den Personenbezug von עַם als auch den militärischen Bezug von צָבָא und klingt im heutigen Standarddeutsch natürlicher als „das Volk des Heeres“.
- source_word: צֹאן
  choice: Schafe
  rationale: Im vorliegenden Zählverzeichnis ist „Schafe“ die direkte und gut verständliche Wiedergabe; der weitere mögliche Sinn „Kleinvieh“ ist hier nicht nötig.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: '675.000'
  rationale: Die hebräische Zahl ergibt 600.000 + 70.000 + 5.000. Die Ziffernschreibweise mit deutschem Tausenderpunkt ist in einer Bestandsliste klar und exakt.
