  naturalness: Die vorangestellte Objektgruppe ist in einem würdevollen Bibelregister gut möglich. »Wohnsitzen« ist hier als formell-biblische Bezeichnung für Wohn- bzw. Siedlungsorte verständlich; die Fußnote bietet eine modernere Alternative.
  terminology: »Städte« ist angemessen für עָרִים. »Lager« bewahrt bei טִירוֹת die lexikalische Offenheit gegenüber Lagern, umfriedeten Niederlassungen und Dörfern. »Mit Feuer« gibt בָּאֵשׁ wieder, ohne eine zusätzliche Deutung einzuführen.
