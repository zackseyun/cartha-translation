  text: וְ/אֵ֤ת כָּל עָרֵי/הֶם֙ בְּ/מ֣וֹשְׁבֹתָ֔/ם וְ/אֵ֖ת כָּל טִֽירֹתָ֑/ם שָׂרְפ֖וּ בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: de
  text: Und alle ihre Städte in ihren Wohnsitzen[a] und alle ihre Lager[b] verbrannten sie mit Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in ihren Siedlungen« oder »an ihren Wohnorten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »umfriedete Niederlassungen« oder »Dörfer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: ihre Städte
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft; »Städte« ist hier im militärisch-geografischen Zusammenhang eine natürliche und hinreichend breite Wiedergabe.
- source_word: בְּמוֹשְׁבֹתָם
  choice: in ihren Siedlungsgebieten
  rationale: מוֹשָׁב kann Wohnort, Wohnsitz oder Siedlungsgebiet bezeichnen. Die Wiedergabe wahrt den räumlichen Bezug und ergibt zusammen mit »Städte« natürliches Deutsch.
- source_word: טִירֹתָם
  choice: ihre Zeltlager
  rationale: טִירָה kann ein Lager, eine umfriedete Niederlassung oder eine kleinere Siedlung bezeichnen. »Zeltlager« unterscheidet diese Wohnform von den zuvor genannten Städten, ohne die mögliche Bedeutung als Lager zu verlieren.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: verbrannten sie
  rationale: Das Deutsche drückt das Verbrennen bereits eindeutig aus; die instrumentale Wendung »mit Feuer« wäre zwar formal möglich, klänge hier jedoch unnötig schwerfällig.
- source_word: וְאֵת ... וְאֵת
  choice: alle ... und alle
  rationale: Die wiederholte Objektmarkierung mit כָּל gliedert zwei umfassende Objektgruppen; »alle ... und alle« erhält diese Betonung.
