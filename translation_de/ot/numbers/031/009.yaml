  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: de
  text: Die Israeliten nahmen die Frauen von Midian und ihre Kinder[a] gefangen und plünderten ihr gesamtes Vieh, ihre gesamten Herden und ihren ganzen Besitz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Kleinkinder“ beziehungsweise „ihre Kleinen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr ganzes Vermögen“ beziehungsweise „all ihre Güter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: nahmen … gefangen
  rationale: Das qal von שׁבה bezeichnet hier das Gefangennehmen von Menschen; die deutsche Wendung ist natürlich und wahrt den Bezug auf menschliche Gefangene.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die übliche moderne deutsche Bezeichnung gibt die hebräische Zugehörigkeitsform בְּנֵי יִשְׂרָאֵל klar und ohne unnötige Missverständnisse über ausschließlich leibliche Söhne wieder.
- source_word: נְשֵׁי מִדְיָן
  choice: die Frauen von Midian
  rationale: נָשִׁים bezeichnet hier Frauen allgemein, nicht notwendig Ehefrauen; die Konstruktion mit „von Midian“ spiegelt die hebräische Verbindung.
- source_word: טַפָּם
  choice: ihre Kinder
  rationale: טַף bezeichnet kollektiv die jungen Kinder beziehungsweise die Kleinen; „Kinder“ ist im heutigen Deutsch klar, während die genauere Altersnuance in einer Fußnote erhalten bleibt.
- source_word: בְּהֶמְתָּם
  choice: ihr gesamtes Vieh
  rationale: בְּהֵמָה bezeichnet kollektiv die Haustiere beziehungsweise den Viehbestand.
- source_word: מִקְנֵהֶם
  choice: ihre gesamten Herden
  rationale: מִקְנֶה bezeichnet häufig den erworbenen Viehbestand, besonders Herden; „Herden“ unterscheidet den Ausdruck soweit möglich vom vorausgehenden בְּהֵמָה.
- source_word: חֵילָם
  choice: ihren ganzen Besitz
  rationale: חַיִל kann in diesem nichtmilitärischen Zusammenhang Vermögen, Güter oder Besitz bezeichnen; „Besitz“ fasst die übrigen materiellen Werte natürlich zusammen.
- source_word: בָּזָזוּ
  choice: plünderten
  rationale: בזז bezeichnet das Erbeuten von Gütern nach einem militärischen Sieg; „plünderten“ bewahrt diesen kriegerischen Sinn knapp und deutlich.
theological_decisions:
- issue: Wiedergabe der Zugehörigkeitsbezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Form bezeichnet hier das Volk Israel als handelnde Gruppe. „Die Israeliten“ ist im modernen Deutschen eindeutig und idiomatisch, ohne eine weitergehende theologische Deutung einzutragen.
- issue: Semantischer Umfang von טַף
  choice: Kinder
  alternative: Kleinkinder / die Kleinen
  rationale: Der Ausdruck hebt die jungen, abhängigen Angehörigen hervor, legt aber keine exakt bestimmbare Altersgrenze fest. Der Haupttext bleibt daher allgemein; die engere Nuance wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Aufzählung des Hebräischen bleibt erhalten. „Israeliten“ wird gegenüber dem im Deutschen missverständlicheren „Söhne Israels“ bevorzugt; die Überschneidung zwischen „Vieh“ und „Herden“ wird als Eigenart der hebräischen Aufzählung nicht eingeebnet.
