lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Waw mit der narrativen Verbform führt die Handlung weiter. „Dann sprach“ gibt sowohl die Abfolge als auch die Bedeutung von דבר natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten des Sprechens; „zu Mose“ ist die natürliche deutsche Form.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel kündigt die unmittelbar folgende direkte Rede an. Im heutigen Deutsch erfüllt ein Doppelpunkt diese Funktion natürlicher als das wörtliche „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Formel לֵאמֹר idiomatisch wieder und verweist auf die direkte Rede im folgenden Vers.
