  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה אֶ֥לֶף לַ/מַּטֶּ֖ה לַ/צָּבָ֑א אֹ֠תָ/ם וְ/אֶת פִּ֨ינְחָ֜ס בֶּן אֶלְעָזָ֤ר הַ/כֹּהֵן֙ לַ/צָּבָ֔א וּ/כְלֵ֥י הַ/קֹּ֛דֶשׁ וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: de
  text: 'Mose sandte sie, tausend aus jedem Stamm, in den Krieg: sie zusammen mit Pinhas, dem Sohn Eleasars, des Priesters. Pinhas hatte die heiligen Geräte[a] und die Trompeten zum Signalgeben[b] in seiner Hand.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Geräte des Heiligtums“ oder „die geweihten Gegenstände“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Trompeten für das Signal“ oder „die Alarmtrompeten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Die übliche und im deutschen Erzählstil natürliche Wiedergabe von שׁלח.
- source_word: אֶלֶף לַמַּטֶּה
  choice: tausend aus jedem Stamm
  rationale: 'Gibt den distributiven Sinn wieder: Jeder Stamm stellte tausend Männer.'
- source_word: לַצָּבָא
  choice: in den Kampf
  rationale: Im Zusammenhang bezeichnet צבא den Kriegsdienst beziehungsweise den Feldzug; „in den Kampf“ ist idiomatisch und bewahrt die Zielrichtung.
- source_word: אֹתָם ... אֹתָם
  choice: sie ... sie
  rationale: Die auffällige Wiederaufnahme des Pronomens wird beibehalten; der Doppelpunkt macht die Apposition im Deutschen verständlich.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Pinhas, den Sohn des Priesters Eleasar
  rationale: Die Wortstellung macht deutlich, dass im Hebräischen Eleasar als Priester bezeichnet wird, und vermeidet die mögliche deutsche Fehlzuordnung zu Pinhas.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: die heiligen Geräte
  rationale: Bewahrt sowohl den kultischen Bezug als auch die Unbestimmtheit darüber, um welche Gegenstände es sich genau handelte.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: die Trompeten für das Alarmsignal
  rationale: חצוצרות bezeichnet die Trompeten, während תרועה hier im militärischen Kontext ein lautes Alarm- oder Kampfsignal meint.
- source_word: בְּיָדוֹ
  choice: in seiner Hand
  rationale: Erhält die Singularform und das konkrete hebräische Bild; der nächste mögliche singularische Bezug ist Pinhas.
theological_decisions:
- issue: Die Aufgabe des Pinhas und der heiligen Gegenstände beim Feldzug
  choice: Pinhas zieht als priesterlicher Begleiter mit und hat die heiligen Geräte sowie die Signaltrompeten bei sich.
  alternative: Pinhas wäre nur Beobachter, oder die Geräte hätten keinen erkennbaren kultischen Bezug.
  rationale: Der Vers verbindet Pinhas ausdrücklich mit den heiligen Geräten und den Trompeten, ohne seine Funktion oder eine Theologie des Krieges weiter auszudeuten.
- issue: Bezug von בְּיָדוֹ („in seiner Hand“)
  choice: Das Singularpronomen wird auf Pinhas bezogen.
  alternative: Es könnte kollektiv verstanden oder freier als „bei ihnen“ beziehungsweise „unter ihrer Obhut“ wiedergegeben werden.
  rationale: Pinhas ist das nächstliegende singularische Bezugswort; die formale Singularität des Ausgangstextes bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „in den Kampf“ und „sie … sie“ folgt bewusst der markanten hebräischen Satzführung; ein Doppelpunkt und ein neuer Satz verhindern dabei unnötige Unklarheit. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
