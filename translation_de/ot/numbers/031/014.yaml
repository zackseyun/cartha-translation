id: NUM.31.14
reference: Numbers 31:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְצֹ֣ף מֹשֶׁ֔ה עַ֖ל פְּקוּדֵ֣י הֶ/חָ֑יִל שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/שָׂרֵ֣י הַ/מֵּא֔וֹת הַ/בָּאִ֖ים מִ/צְּבָ֥א הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: de
  text: Und Mose wurde zornig auf die Befehlshaber des Heeres, die Obersten über Tausend und die Obersten über Hundert, die vom Kriegsdienst kamen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die aus dem Kriegsheer kamen“. Das Hebräische verbindet hier die Vorstellungen von Heer beziehungsweise Militärdienst und Krieg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: wurde zornig
  rationale: קצף bezeichnet heftigen Zorn. „Wurde zornig“ gibt die einsetzende Reaktion im deutschen Erzählstil natürlich und ohne Übersteigerung wieder.
- source_word: פְּקוּדֵי הֶחָיִל
  choice: die Befehlshaber des Heeres
  rationale: Die Wendung bezeichnet hier die für das Heer eingesetzten Verantwortungsträger. „Befehlshaber“ vermittelt den militärischen Leitungsauftrag, während „Heer“ חַיִל in diesem Zusammenhang angemessen wiedergibt.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: die Obersten über Tausend
  rationale: Die Wiedergabe bewahrt die hebräische militärische Gliederung und klingt in würdigem, verständlichem Deutsch natürlich.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: und die Obersten über Hundert
  rationale: Die parallele Formulierung wahrt sowohl die Satzstruktur als auch die militärische Hierarchie des Ausgangstextes.
- source_word: הַבָּאִים
  choice: die … kamen
  rationale: Das Partizip beschreibt die vom Kriegsdienst kommenden Männer. Im Deutschen ist der Relativsatz mit Präteritum idiomatisch; „zurückkehrten“ wäre deutlicher interpretierend, da eine Rückkehr im Verb selbst nicht ausdrücklich bezeichnet ist.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: vom Kriegsdienst
  rationale: צָבָא kann Heer oder Militärdienst bezeichnen; in Verbindung mit מִן und מִלְחָמָה passt hier „vom Kriegsdienst“. Die kompakte Wiedergabe bewahrt den Dienst- und Kriegssinn, ohne das schwerfällige „vom Dienst des Krieges“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Hierarchie wird formal bewahrt; unnötig altertümliche Formen und die interpretierende Ergänzung „zurückkehrten“ werden vermieden.
