base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: de
  text: Sie brachten die Gefangenen, das Erbeutete[a] und die Beute zu Mose, zum Priester Eleasar und zur Gemeinde der Israeliten ins Lager in den Steppen von Moab[b], die am Jordan bei Jericho liegen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Kontext möglicherweise: „das erbeutete Vieh“; vgl. Vers 32.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in den Ebenen von Moab“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder, unter Einbezug der geografischen Lage: „die am Jordan gegenüber von Jericho liegen“.'
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Sie brachten
  rationale: Der Hifil von בוא bedeutet hier angesichts der folgenden direkten Objekte kausativ „bringen“.
- source_word: הַשְּׁבִי
  choice: die Gefangenen
  rationale: Im militärischen Zusammenhang bezeichnet שבי die gefangen genommenen Menschen, nicht den abstrakten Zustand der Gefangenschaft.
- source_word: הַמַּלְקוֹחַ
  choice: das erbeutete Vieh
  rationale: מלקוח bezeichnet das Genommene beziehungsweise Weggenommene und wird im unmittelbaren Kontext von Vers 32 ausdrücklich auf Vieh bezogen. Die Konkretisierung unterscheidet den Ausdruck verständlich von שׁלל, ohne ihn mit Personen gleichzusetzen.
- source_word: הַשָּׁלָל
  choice: die Beute
  rationale: שׁלל ist die übliche Bezeichnung für Kriegsbeute; die Wiedergabe bleibt von מלקוח unterschieden.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: die Gemeinde der Israeliten
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft; „Gemeinde der Israeliten“ ist im heutigen Deutsch natürlich und gibt בני ישראל idiomatisch wieder.
- source_word: אֶל הַמַּחֲנֶה
  choice: ins Lager
  rationale: אֶל bezeichnet die Bewegung zum Lager hin; im Deutschen ist „ins Lager“ in diesem Zusammenhang die natürliche Formulierung.
- source_word: עַרְבֹת מוֹאָב
  choice: die Steppen von Moab
  rationale: עֲרָבוֹת bezeichnet hier die offenen Ebenen beziehungsweise Steppen Moabs; „Steppen“ wahrt die topografische Färbung.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: die am Jordan gegenüber von Jericho liegen
  rationale: Die Wendung lokalisiert die Steppen Moabs am Jordan auf der Jericho gegenüberliegenden Seite; eine Fußnote weist auf die weniger explizite Alternative hin.
