source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: de
  text: Teile die Beute[a] je zur Hälfte zwischen den Kriegsteilnehmern, die zum Kampf ausgezogen sind, und der ganzen Gemeinde[b] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet das im Krieg Genommene; hier gehören dazu auch Gefangene und Vieh.
    reason: lexical_scope
  - marker: b
    text: 'Oder: »Gemeinschaft« beziehungsweise »Versammlung«. Gemeint ist die Gesamtheit Israels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: Teile … je zur Hälfte … auf
  rationale: חצה bezeichnet hier nicht nur ein allgemeines Verteilen, sondern die Teilung in zwei Hälften zwischen den anschließend genannten Gruppen. Die deutsche Formulierung gibt diesen Zusammenhang klar und natürlich wieder.
- source_word: הַמַּלְקוֹחַ
  choice: die Beute
  rationale: מַלְקוֹחַ bezeichnet das im Krieg Genommene und umfasst im Kontext sowohl Menschen als auch Vieh und sonstigen Besitz. »Beute« ist die übliche, verständliche deutsche Entsprechung.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: den Kriegsteilnehmern
  rationale: Die wörtliche Wendung »die den Krieg ergreifen/handhaben« bezeichnet idiomatisch diejenigen, die aktiv am Krieg beteiligt waren. »Kriegsteilnehmer« bewahrt diesen Sinn, ohne die Wendung unnötig einzuengen.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: die zum Kampf ausgezogen sind
  rationale: Die Partizipialwendung kennzeichnet die Kriegsteilnehmer näher als diejenigen, die zum militärischen Einsatz ausgezogen waren. »Zum Kampf ausgezogen« ist im Deutschen klar und dem Kontext angemessen.
- source_word: כָּל הָעֵדָה
  choice: der ganzen Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. »Gemeinde« wahrt den korporativen biblischen Sinn und bleibt in modernem Deutsch verständlich.
