source:
  edition: WLC
  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: de
  text: 'Und erhebe als Abgabe für Jahwe von den Kämpfern, die zum Kampf ausgezogen sind, je eines auf fünfhundert[a]: von den Menschen, von den Rindern, von den Eseln und vom Kleinvieh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Seele von fünfhundert“. Das hebräische Wort nefesch dient hier als Zählbegriff für ein einzelnes Lebewesen, sowohl für Menschen als auch für Tiere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: erhebe als Abgabe
  rationale: Das Hifil von רום bezeichnet hier das Absondern beziehungsweise Erheben eines festgesetzten Anteils; מֶכֶס ist eine auferlegte Abgabe aus der Beute. Die Formulierung bewahrt sowohl den Vorgang als auch den Pflichtcharakter.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet Jahwe als Empfänger beziehungsweise Eigentümer der Abgabe; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: von den Kriegsleuten, die zum Kampf ausgezogen sind
  rationale: Die Wiedergabe hält die männliche militärische Gruppenbezeichnung fest und gibt לַצָּבָא im Zusammenhang idiomatisch als Teilnahme am Kampf wieder.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: je ein Lebewesen von fünfhundert
  rationale: נֶפֶשׁ dient als Zählbegriff für ein einzelnes lebendes Wesen und umfasst hier sowohl Menschen als auch Tiere. „Lebewesen“ vermeidet die moderne metaphysische Engführung von „Seele“; „je“ verdeutlicht, dass die Quote für jede folgende Kategorie gilt.
- source_word: מִן הָאָדָם
  choice: von den Menschen
  rationale: אָדָם bezeichnet hier den menschlichen Anteil der Beute im Gegensatz zu den anschließend genannten Tierarten.
- source_word: וּמִן הַבָּקָר
  choice: von den Rindern
  rationale: בָּקָר bezeichnet Rinder beziehungsweise Großvieh; „Rinder“ ist in dieser Aufzählung konkret und gegenwärtig.
- source_word: וּמִן הַחֲמֹרִים
  choice: von den Eseln
  rationale: חֲמֹרִים ist der gewöhnliche Plural für Esel.
- source_word: וּמִן הַצֹּאן
  choice: vom Kleinvieh
  rationale: צֹאן ist ein Sammelbegriff für Schafe und Ziegen. „Kleinvieh“ bewahrt diesen Umfang genauer als das möglicherweise nur auf Schafe bezogene „Herde“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den Bundesnamen als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נֶפֶשׁ in der Abgabenquote
  choice: Lebewesen
  alternative: Seele; eines
  rationale: Da der Ausdruck ausdrücklich auf Menschen und Tiere bezogen wird, bezeichnet נֶפֶשׁ hier das einzelne lebende Wesen. Die Wiedergabe wahrt diese Breite, ohne eine Aussage über eine immaterielle Seele einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Imperativ/Futurwert wird als direkte Anweisung wiedergegeben. Die Aufzählung bleibt knapp und parallel; „Kleinvieh“ umfasst Schafe und Ziegen.
