source:
  edition: WLC
  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: de
  text: 'Ihr aber sollt sieben Tage außerhalb des Lagers lagern. Jeder, der einen Menschen getötet hat, und jeder, der einen Erschlagenen[a] berührt hat: Reinigt euch am dritten und am siebten Tag, ihr und eure Gefangenen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Leichnam eines Erschlagenen«. Das hebräische Wort bezeichnet einen gewaltsam Getöteten; hier ist die Berührung seines Leichnams gemeint.'
    reason: lexikalische Alternative und Verdeutlichung des rituellen Zusammenhangs
lexical_decisions:
- source_word: חֲנוּ
  choice: sollt … lagern
  rationale: Der Imperativ Plural von חנה fordert die Angesprochenen auf, außerhalb des Hauptlagers ihr Lager aufzuschlagen beziehungsweise dort zu bleiben. Die deutsche Soll-Form gibt die verbindliche Anweisung natürlich wieder.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Die räumliche Wendung wird direkt und passend zum militärischen Kontext wiedergegeben.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: jeder, der einen Menschen getötet hat
  rationale: נֶפֶשׁ bezeichnet hier einen Menschen, nicht eine vom Körper getrennte »Seele«. Nach der Schlacht hat das Partizip vergangenen Bezug.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: und jeder, der einen Erschlagenen berührt hat
  rationale: חָלָל bezeichnet einen gewaltsam Getöteten und schließt hier wegen der Verunreinigung durch Totenkontakt dessen Leichnam ein. »Erschlagenen« bewahrt den personalen und gewaltsamen Aspekt.
- source_word: תִּתְחַטְּאוּ
  choice: Reinigt euch
  rationale: Der Hitpael von חטא bezeichnet in diesem Zusammenhang die rituelle Reinigung von Verunreinigung, nicht allgemein moralische Besserung oder Vergebung.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: am dritten und am siebten Tag
  rationale: Die beiden vorgeschriebenen Zeitpunkte des Reinigungsritus bleiben ausdrücklich erhalten.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: ihr und eure Gefangenen
  rationale: שְׁבִי bezeichnet im Krieg erbeutete beziehungsweise gefangen genommene Menschen; »Gefangene« ist im Deutschen klar und neutral.
theological_decisions:
- issue: Art der Reinigung nach dem Töten oder der Berührung eines Toten
  choice: rituelle Reinigung von durch Totenkontakt entstandener Unreinheit
  alternative: moralische Reinigung von Blutschuld
  rationale: Der unmittelbare Zusammenhang und die Reinigung am dritten und siebten Tag weisen auf das Ritual bei Totenunreinheit. »Reinigt euch« legt daher weder Vergebung noch moralische Schuld als Hauptaussage in den Text hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die Wiederholung von »Lager/lagern« bewahren die Struktur des Hebräischen; der Doppelpunkt macht den Übergang von der näher bezeichneten Personengruppe zur an alle gerichteten Reinigungsanweisung verständlich.
