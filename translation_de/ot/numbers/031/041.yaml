id: NUM.31.41
reference: Numbers 31:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Und Mose gab die Abgabe[a], den für Jahwe bestimmten Beitrag[b], dem Priester Eleasar, genau wie Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Umlage“ oder „Abgabeanteil“; gemeint ist der festgesetzte Anteil an der Beute.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Jahwes Beitrag“ oder „die Gabe für Jahwe“; traditionell: „Hebopfer für den HERRN“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Die narrative Verbform von נתן bezeichnet hier schlicht die Übergabe; „gab“ ist im Deutschen klar und natürlich.
- source_word: מֶכֶס
  choice: Abgabe
  rationale: Im Zusammenhang der Kriegsbeute bezeichnet מֶכֶס den festgesetzten, abzuführenden Anteil. „Abgabe“ gibt dies wieder, ohne an ein modernes Steuersystem denken zu lassen.
- source_word: תְּרוּמַת יְהוָה
  choice: den für Jahwe bestimmten Beitrag
  rationale: תְּרוּמָה bezeichnet einen ausgesonderten Beitrag beziehungsweise eine Gabe. Die Formulierung macht deutlich, dass dieser Anteil Jahwe zukommt, ohne eine bestimmte Ritualhandlung vorauszusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen deutschen Bibelstil als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: dem Priester Eleasar
  rationale: Die deutsche Wortstellung ist idiomatisch und bewahrt sowohl den Namen als auch die Amtsbezeichnung.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: genau wie Jahwe Mose geboten hatte
  rationale: „Genau wie“ betont die Übereinstimmung mit der vorausgegangenen Anweisung; das Plusquamperfekt gibt deren zeitliche Vorordnung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen in der im Deutschen üblichen wissenschaftlich und kirchlich verbreiteten Form.
- issue: Verhältnis von מֶכֶס und תְּרוּמַת יְהוָה
  choice: 'Apposition: Die Abgabe ist der für Jahwe bestimmte Beitrag'
  alternative: zwei voneinander verschiedene Größen
  rationale: Die unmittelbar aufeinanderfolgenden Nominalgruppen beschreiben denselben Anteil; die zweite bestimmt die erste näher. Dadurch bleibt zugleich sichtbar, dass es sich sowohl um eine festgesetzte Abgabe als auch um eine Jahwe geweihte Gabe handelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionale Struktur des Hebräischen bleibt erkennbar, wird aber durch „den für Jahwe bestimmten Beitrag“ idiomatisch verdeutlicht. „Hebopfer“ steht nur als traditionelle Alternative in der Fußnote, weil der Vers selbst keine konkrete Hebegeste beschreibt.
