  verdict: revise
  source_fidelity: 'Die Aussage wird im Wesentlichen zutreffend wiedergegeben: Mose entnimmt aus dem Israel zugeteilten Beuteanteil eine Abgabe im Verhältnis eins zu fünfzig, und zwar aus Menschen und Vieh, für die Leviten. Die Formulierung „Hälfte der Israeliten“ ist im Deutschen jedoch vermeidbar mehrdeutig; sie kann auch „die Hälfte der Israeliten als Personen“ bedeuten, statt den den Israeliten zustehenden Anteil zu bezeichnen.'
  naturalness: Der Satz ist in würdigem modernem Standarddeutsch gut lesbar. „Je einen von fünfzig“ ist bei der gemeinsamen Nennung von Menschen und Vieh grammatisch und referenziell weniger klar als die neutrale, explizit auf beide Gruppen bezogene Formulierung „jeweils eines von fünfzig, sowohl von den Menschen als auch vom Vieh“.
  terminology: „Israeliten“, „Vieh“, „Leviten“, „Wohnung Jahwes“ und „Jahwe“ sind sachgerecht. „Den Dienst an der Wohnung Jahwes versahen“ gibt die für den Dienst bzw. die Obhut am Mischkan Verantwortlichen idiomatisch wieder, ohne die hebräische Wendung unnötig auf bloßen Wachdienst einzuengen.
  issues:
