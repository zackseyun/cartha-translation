  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Von der den Israeliten zugeteilten Hälfte nahm Mose jeweils eines von fünfzig, sowohl von den Menschen als auch vom Vieh, und gab sie den Leviten, die den Dienst an der Wohnung Jahwes versahen, wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Von der Hälfte der Israeliten
  rationale: Die Wendung bezeichnet die den Israeliten zugeteilte Hälfte der Beute. „Israeliten“ gibt בְּנֵי יִשְׂרָאֵל im heutigen Deutsch natürlich wieder, ohne den Bezug auf das Volk zu verändern.
- source_word: אֶת הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: je einen von fünfzig
  rationale: אָחֻז bezeichnet hier die als Abgabe herausgenommene Person beziehungsweise das herausgenommene Tier. Die Formulierung gibt die Quote von eins zu fünfzig knapp und idiomatisch wieder.
- source_word: מִן הָאָדָם
  choice: von den Menschen
  rationale: אָדָם ist kollektiv gebraucht und umfasst die unter der Beute gezählten Menschen, nicht nur männliche Einzelpersonen.
- source_word: וּמִן הַבְּהֵמָה
  choice: und vom Vieh
  rationale: בְּהֵמָה bezeichnet hier die erbeuteten domestizierten Tiere; „Vieh“ ist dafür die geläufige deutsche Bezeichnung.
- source_word: וַיִּתֵּן אֹתָם
  choice: und gab sie
  rationale: Das pluralische Suffix bezieht sich auf die aus beiden Gruppen genommenen Menschen und Tiere; „sie“ bewahrt den Numerus des Hebräischen.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: die den Dienst an der Wohnung Jahwes versahen
  rationale: Die Verbindung aus שׁמר und מִשְׁמֶרֶת bezeichnet die verantwortliche Wahrnehmung einer übertragenen Aufgabe. „den Dienst … versehen“ ist würdig und verständlich; „Wohnung“ gibt מִשְׁכָּן näher wieder als das traditionellere „Stiftshütte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird im Deutschen mit der üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: wie Jahwe es Mose geboten hatte
  rationale: כַּאֲשֶׁר bezeichnet die Übereinstimmung mit dem zuvor erteilten Befehl. Das Plusquamperfekt macht den zeitlichen Rückbezug im Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ erhält diesen Textbefund, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die feste hebräische Volksbezeichnung meint hier die Israeliten insgesamt. Die natürliche deutsche Form vermeidet eine irreführende Beschränkung auf männliche Nachkommen, ohne den Sinn zu glätten.
- issue: Art der levitischen Aufgabe am Heiligtum
  choice: den Dienst an der Wohnung Jahwes versahen
  alternative: die den Wachdienst an der Wohnung Jahwes ausübten
  rationale: Die hebräische Wortgruppe kann sowohl das Bewachen als auch das verantwortliche Wahrnehmen einer Dienstpflicht hervorheben. Die gewählte Fassung lässt diesen weiteren Aufgabenbezug bestehen, ohne ihn ausschließlich militärisch oder kultisch zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper narrativer Syntax. „Je einen von fünfzig“ macht deutlich, dass sowohl bei den Menschen als auch beim Vieh dieselbe Abgabequote galt. Keine Fußnoten erforderlich.
