    rationale: Der hebräische Kontext und die Konstruktion bezeichnen die den Israeliten zugeteilte Hälfte der Beute. Die deutsche Fassung kann hingegen auch eine Hälfte des Volkes meinen.
  - severity: low
    issue: „je einen von fünfzig, von den Menschen und vom Vieh“ ist bei zwei Kategorien nicht ganz eindeutig.
    rationale: „Einen“ wirkt zunächst auf Personen bezogen; außerdem bleibt die Verteilung auf Menschen und Vieh syntaktisch locker. Die neutrale Form „jeweils eines“ mit „sowohl … als auch“ bildet die Quote für beide Gruppen klar ab.
