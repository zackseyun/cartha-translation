base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: de
  text: Die Zahl der Menschen[a] betrug 16.000, und die darauf entfallende Abgabe[b] für Jahwe betrug 32 Personen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht „Seele“; im Ausdruck mit „Mensch“ und bei der Wiederholung am Satzende ist dies eine Zählbezeichnung für menschliche Personen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „festgesetzter Anteil“ oder „Abgabeanteil“. Das hebräische Wort bezeichnet den aus der Beute für Jahwe ausgesonderten Anteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: Menschen
  rationale: Die Wortgruppe bezeichnet hier menschliche Einzelpersonen im Unterschied zu den zuvor aufgezählten Tieren. „Menschen“ gibt diese Zählfunktion im Deutschen natürlich wieder.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: '16.000'
  rationale: Direkte Wiedergabe der Kardinalzahl in üblicher deutscher Schreibweise.
- source_word: מִכְסָם
  choice: ihre Abgabe
  rationale: מֶכֶס bezeichnet hier den festgesetzten, aus der Beute ausgesonderten Anteil. „Abgabe“ ist im Deutschen sachlich und kontextgerecht; „Tribut“ wäre ebenfalls möglich, klingt jedoch stärker politisch.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet die Zuweisung an Jahwe; „für“ drückt die Bestimmung des ausgesonderten Anteils natürlich aus.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: 32 Personen
  rationale: נֶפֶשׁ dient erneut als Zählbegriff für einzelne Menschen; „Personen“ ist bei der genauen Angabe der Abgabe eindeutig und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt dessen Funktion als Gottesname, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von נֶפֶשׁ in Bezug auf Menschen
  choice: Menschen / Personen
  alternative: Seelen
  rationale: In dieser Beute- und Zählliste bezeichnet נֶפֶשׁ konkrete menschliche Individuen. „Seelen“ könnte hier unbeabsichtigt eine metaphysische Aussage nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „betrug“ bildet die sachliche Listenstruktur klar ab; Ziffern sind für die administrative Zahlenangabe gut lesbar.
