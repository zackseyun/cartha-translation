id: NUM.31.16
reference: Numbers 31:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: de
  text: Seht, diese Frauen waren es, die auf Bileams Wort hin[b] die Söhne Israels[a] dazu brachten, Jahwe in der Sache mit Peor die Treue zu brechen; und so kam die Plage über die Gemeinde Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Söhne Israels“; gemeint ist hier das Volk Israel.
    reason: lexical_alternative
  - marker: b
    text: „Auf Bileams Wort hin“ kann auch mit „durch Bileams Rat“ oder „auf Bileams Anweisung“ wiedergegeben werden. Das Hebräische lautet wörtlich „durch/bei dem Wort Bileams“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: Seht, diese Frauen waren es
  rationale: Die emphatische Verbindung aus Ausruf und femininem Pluralpronomen verweist im Kontext ausdrücklich auf die midianitischen Frauen. „Seht“ gibt die hinweisende Kraft in gegenwärtigem, würdigem Deutsch wieder.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale Wendung des Hebräischen wird bewahrt; eine Fußnote erläutert, dass damit das Volk Israel gemeint ist.
- source_word: בִּדְבַר בִּלְעָם
  choice: auf Bileams Wort hin
  rationale: דָּבָר bedeutet wörtlich „Wort“ beziehungsweise „Sache“; im Zusammenhang bezeichnet die Wendung Bileams Anweisung oder Rat. Die Übersetzung bewahrt die lexikalische Offenheit.
- source_word: לִמְסָר מַעַל בַּיהוָה
  choice: dazu brachten, Jahwe die Treue zu brechen
  rationale: מעל bezeichnet einen Treuebruch, besonders gegenüber Gott. Die deutsche Formulierung gibt sowohl die veranlassende Rolle der Frauen als auch die relationale, bundestheologische Bedeutung wieder, ohne eine bestimmte Auslegung der Art des Treuebruchs hinzuzufügen.
- source_word: עַל דְּבַר פְּעוֹר
  choice: in der Sache mit Peor
  rationale: Die Wendung verweist knapp auf den bekannten Vorfall um Peor und bleibt näher am offenen Ausdruck „Sache/Angelegenheit“, statt Peor ausdrücklich mit einer nicht genannten Gottheit gleichzusetzen.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: und so kam die Plage
  rationale: Das fortführende וַ mit היה berichtet die Folge des Treuebruchs. „Und so“ macht den im Zusammenhang erkennbaren Folgezusammenhang natürlich deutlich.
- source_word: בַּעֲדַת יְהוָה
  choice: über die Gemeinde Jahwes
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft; „Gemeinde“ ist hier verständlich und würdig. Bei einer Plage gibt „über“ das Hereinbrechen über die Gemeinschaft idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text zweimal stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מַעַל
  choice: Jahwe die Treue brechen
  alternative: sich gegen Jahwe versündigen; Untreue gegen Jahwe begehen
  rationale: Die gewählte Formulierung erhält den Gedanken eines Treuebruchs gegenüber Jahwe und reduziert ihn weder auf eine allgemeine Sünde noch legt sie eine speziell konfessionelle Deutung fest.
- issue: Verantwortung der Frauen und Bileams Rolle
  choice: Die Frauen brachten Israel auf Bileams Wort hin zum Treuebruch
  alternative: Die Frauen handelten auf Bileams Rat; Bileam selbst verführte Israel
  rationale: 'Die syntaktische Rollenverteilung des Verses bleibt erhalten: Die Frauen sind das ausdrücklich genannte Mittel beziehungsweise die handelnde Ursache, während Bileams „Wort“ den veranlassenden Hintergrund bezeichnet. Die genaue Art seines Einflusses bleibt offen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer bewusst leicht biblischen Prägung. „Seht“ wahrt den nachdrücklichen Hinweischarakter; „Gemeinde“ und „Plage“ bleiben verständliche traditionelle Begriffe. Die Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Wendung.
