  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: de
  text: Mose und der Priester Eleasar taten, was Jahwe Mose befohlen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: taten
  rationale: עשה fasst hier die Ausführung des zuvor erteilten Befehls zusammen. In Verbindung mit „was … befohlen hatte“ ist „taten“ im Deutschen natürlich und präzise.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: וְאֶלְעָזָר
  choice: und … Eleasar
  rationale: Die Konjunktion und der Personenname werden direkt wiedergegeben; „Eleasar“ entspricht der üblichen deutschen Namensform.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die Apposition bezeichnet Eleasars Amt. Die Voranstellung in „der Priester Eleasar“ klingt im modernen Deutschen natürlich.
- source_word: כַּאֲשֶׁר
  choice: was
  rationale: Im deutschen Satz „taten, was … befohlen hatte“ drückt „was“ idiomatisch aus, dass ihr Handeln dem Befehl entsprach; wörtlicher wäre „so, wie“.
- source_word: צִוָּה
  choice: befohlen hatte
  rationale: Das Plusquamperfekt macht die im Kontext vorausgehende Anordnung deutlich, ohne den Sinn zu erweitern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Die direkte Objektmarkierung אֶת bleibt im Deutschen unübersetzt; der Name steht als Objekt zu „befohlen hatte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Formulierung bewahrt den schlichten Berichtston; „der Priester Eleasar“ gibt die hebräische Apposition natürlich wieder.
