source:
  edition: WLC
  text: וּ/מִֽ/מַּחֲצִ֖ית בְּנֵ֣י יִשְׂרָאֵ֑ל אֲשֶׁר֙ חָצָ֣ה מֹשֶׁ֔ה מִן הָ/אֲנָשִׁ֖ים הַ/צֹּבְאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: de
  text: Und von der Hälfte, die den Söhnen Israels gehörte und die Mose von den Männern, die zum Kriegsdienst ausgezogen waren, abgeteilt hatte —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: Und von der Hälfte
  rationale: Die Konjunktion וּ und die Präposition מִן werden beide wiedergegeben. מַחֲצִית bezeichnet hier im Zusammenhang der Beuteverteilung eine Hälfte beziehungsweise einen Halbanteil.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die den Söhnen Israels gehörte
  rationale: Die wörtliche maskuline Bezeichnung »Söhne Israels« bleibt erhalten; die Zugehörigkeitskonstruktion macht den Bezug der Hälfte im Deutschen eindeutig und natürlich.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bezieht sich auf die feminine »Hälfte«.
- source_word: חָצָה
  choice: abgeteilt hatte
  rationale: Das Verb bezeichnet hier das Abteilen beziehungsweise Trennen des Anteils Israels vom Anteil der Kriegsteilnehmer. Das Plusquamperfekt verdeutlicht die vorangegangene Handlung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Übliche deutsche Namensform.
- source_word: מִן הָ/אֲנָשִׁים
  choice: von den Männern
  rationale: אֲנָשִׁים bedeutet hier konkret »Männer« und bezeichnet im Kontext die männlichen Kriegsteilnehmer.
- source_word: הַ/צֹּבְאִים
  choice: die zum Kriegsdienst ausgezogen waren
  rationale: Das Partizip von צבא bezeichnet Männer im militärischen Einsatz. Die Formulierung bewahrt sowohl den militärischen Sinn als auch den Gedanken des Ausziehens zum Feldzug.
