source:
  edition: WLC
  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: de
  text: Nimm Rache für die Israeliten an den Midianitern.[a] Danach wirst du zu deinem Volk versammelt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Räche die Israeliten an den Midianitern.“ Wörtlich: „Nimm die Rache der Söhne Israels von den Midianitern.“ Die hebräische Präposition bezeichnet hier die Partei, an der die Vergeltung vollzogen wird.'
    reason: lexical_alternative
  - marker: b
    text: „Zu seinem Volk versammelt werden“ ist eine hebräische Umschreibung für das Sterben.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: Nimm Rache
  rationale: Die Verbindung aus Imperativ und stammverwandtem Substantiv bezeichnet nachdrücklich den Vollzug der Vergeltung. „Nimm Rache“ gibt den Befehl idiomatisch wieder, ohne ihn abzuschwächen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich „die Söhne Israels“; im heutigen Deutsch bezeichnet „die Israeliten“ natürlich und präzise das Volk als Ganzes, das im Kontext gerächt werden soll.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: an den Midianitern
  rationale: Bei נקם bezeichnet die Präposition die Gruppe, an der die Vergeltung vollzogen wird. Die deutsche Verbindung „Rache an jemandem nehmen“ entspricht diesem Sinn.
- source_word: אַחַר
  choice: Danach
  rationale: Kennzeichnet die zeitliche Folge knapp und natürlich.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: du wirst zu deinem Volk versammelt werden
  rationale: Bewahrt das hebräische Sterbeidiom und seine Bildsprache, statt es deutend mit „du wirst sterben“ wiederzugeben.
theological_decisions:
- issue: Das Sterbeidiom im Blick auf Moses bevorstehenden Tod
  choice: „du wirst zu deinem Volk versammelt werden“
  alternative: „du wirst sterben“ oder „du wirst zu deinen Vorfahren versammelt werden“
  rationale: Die wörtlich-nahe Wiedergabe erhält die Bildsprache und lässt offen, welche genauere Vorstellung vom Zustand nach dem Tod damit verbunden ist.
- issue: Träger und Ziel der Vergeltung
  choice: Gott befiehlt Mose, für die Israeliten an den Midianitern Rache zu nehmen.
  alternative: „Räche die Israeliten an den Midianitern“
  rationale: Beide Formulierungen sind sachlich möglich; „Nimm Rache für … an …“ bildet die hebräische Nominalfügung erkennbarer ab, ohne die Vergeltung als private Fehde umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Israeliten“ ist hier natürlicher als das formale „Söhne Israels“. Das Sterbeidiom bleibt bewusst erhalten und wird in einer Fußnote erläutert.
