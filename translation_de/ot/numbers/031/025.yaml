  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: Da sagte Jahwe zu Mose:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und Jahwe sagte zu Mose, sagend.“ Das Hebräische verwendet hier eine feste Formel zur Einleitung der folgenden Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sprach
  rationale: Das Narrativ-Waw führt die Handlung fort. „Da sprach“ ist eine natürliche, würdige deutsche Erzählformel und gibt den Fortgang der Erzählung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen stehende Eigenname erhalten bleibt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ entspricht der üblichen deutschen Redeformel.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt wiedergegeben
  rationale: Der Infinitiv לֵאמֹר leitet den im folgenden Vers einsetzenden Redeinhalt ein. Im natürlichen modernen Deutsch erfüllt der Doppelpunkt diese Funktion, ohne das schwerfällige „und sagte“ oder „folgendermaßen“ einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה und nicht einen Titel. „Jahwe“ bewahrt diese Unterscheidung.
- issue: Explizite Wiedergabe von לֵאמֹר
  choice: Doppelpunkt als funktionale Entsprechung
  alternative: und sagte / mit den Worten
  rationale: לֵאמֹר eröffnet die nachfolgende direkte Rede. Ein Doppelpunkt gibt diese Funktion im Deutschen knapp und idiomatisch wieder, ohne dem Text einen zusätzlichen inhaltlichen Akzent zu verleihen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. „Da sprach“ bewahrt den biblischen Ton, bleibt aber allgemein verständlich; der Doppelpunkt führt unmittelbar in Vers 26 weiter.
