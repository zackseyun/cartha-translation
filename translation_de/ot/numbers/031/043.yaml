  language: de
  text: Die der Gemeinde zustehende Hälfte des Kleinviehs betrug 337.500.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: betrug
  rationale: Die Form von היה führt hier in einer Bestandsaufstellung die errechnete Gesamtzahl an. „Betrug“ ist im modernen Deutschen dafür natürlich und präzise.
- source_word: מֶחֱצַת הָעֵדָה
  choice: die Hälfte, die der Gemeinde zustand
  rationale: Die Constructusverbindung bezeichnet den der Gemeinde zugeteilten Anteil. Die Formulierung macht diese Zugehörigkeit idiomatisch deutlich, ohne über den Kontext hinauszugehen.
- source_word: הָעֵדָה
  choice: der Gemeinde
  rationale: עֵדָה bezeichnet hier die Gemeinschaft Israels. „Gemeinde“ ist im Pentateuch eine verständliche und würdige Wiedergabe, ohne eine spätere kirchliche Institution vorauszusetzen.
- source_word: מִן הַצֹּאן
  choice: bei den Schafen und Ziegen
  rationale: צֹאן ist ein Sammelbegriff für Kleinvieh, insbesondere Schafe und Ziegen. Die explizite Wiedergabe ist im Deutschen klarer als das potenziell nur auf Schafe bezogene „Herde“.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: '337.500'
  rationale: Die hebräische Zahlenfolge ergibt 300.000 + 30.000 + 7.000 + 500. Ziffern sind in dieser Bestandsaufstellung übersichtlich und bewahren die genaue Zahl.
theological_decisions: []
translation_notes:
  register: Modernes, sachliches und zugleich würdiges Standarddeutsch. Die Satzstellung folgt natürlichem Deutsch; die konkrete Wiedergabe von צֹאן vermeidet das Missverständnis, es seien ausschließlich Schafe gemeint.
