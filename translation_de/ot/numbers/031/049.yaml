    rationale: Sie kann nahelegen, dass keiner der Sprecher vermisst werde, statt dass unter den von ihnen gezählten Kämpfern niemand fehlt. „Keiner unserer Männer fehlt“ stellt den Bezug im Deutschen klar her, ohne den Sinn zu erweitern.
  - severity: low
