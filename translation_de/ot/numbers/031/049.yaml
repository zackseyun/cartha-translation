base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: de
  text: 'Und sie sagten zu Mose: »Deine Diener haben die Krieger gezählt[a], die unter unserem Befehl stehen[b], und keiner unserer Männer fehlt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »haben das Haupt der Kriegsmänner erhoben«; eine hebräische Wendung für das Zählen oder Mustern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die uns anvertraut sind«. Wörtlich: »die in unserer Hand sind«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Die militärischen Befehlshaber sprechen Mose gegenüber ehrerbietig von sich selbst. »Diener« gibt diese Anrede natürlicher wieder als »Sklaven«.
- source_word: נָשְׂאוּ אֶת־רֹאשׁ
  choice: haben … gezählt
  rationale: Die wörtliche Wendung »den Kopf erheben« bezeichnet hier idiomatisch die Erfassung beziehungsweise Zählung der Truppe.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: die Krieger
  rationale: Die Wendung meint die männlichen Angehörigen der kämpfenden Truppe; »Krieger« ist im Deutschen knapp, verständlich und kontextgerecht.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: die unter unserem Befehl stehen
  rationale: Wörtlich »die in unserer Hand sind«; im militärischen Zusammenhang bezeichnet dies die Männer, für welche die Sprecher Verantwortung tragen und über die sie Befehlsgewalt haben.
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: und von uns wird kein Mann vermisst
  rationale: Das Nifal von פקד bezeichnet hier, dass nach der Musterung niemand fehlt oder als Verlust zu beklagen ist. Die Formulierung wahrt den Bezug »von uns/aus unserer Mitte«.
