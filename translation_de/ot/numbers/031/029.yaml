  text: מִ/מַּֽחֲצִיתָ֖/ם תִּקָּ֑חוּ וְ/נָתַתָּ֛ה לְ/אֶלְעָזָ֥ר הַ/כֹּהֵ֖ן תְּרוּמַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: de
  text: Von ihrer Hälfte sollt ihr es nehmen und Eleasar, dem Priester, als Abgabe für Jahwe[a] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Jahwes Abgabe“ oder „als Opfergabe für Jahwe“. Das hebräische Wort תְּרוּמָה bezeichnet einen Anteil, der für einen heiligen Zweck ausgesondert wird.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: Von ihrer Hälfte
  rationale: Die Präposition מִן mit מַחֲצִית bezeichnet die Hälfte, die ihnen im Zusammenhang zugeteilt wurde. Die Formulierung bewahrt den rückbezüglichen Possessivsinn.
- source_word: תִּקָּחוּ
  choice: sollt ihr es nehmen
  rationale: Die Verbform ist 2. Person Plural und hat hier anweisenden Charakter. „Sollt ihr“ gibt diesen rechtlich-instruktiven Sinn natürlich wieder.
- source_word: וְנָתַתָּה
  choice: und … geben
  rationale: Die hebräische Form wechselt zur 2. Person Singular. Im Deutschen lässt der koordinierte Infinitiv die Anweisung flüssig weiterlaufen, ohne den Numeruswechsel künstlich hervorzuheben.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: Eleasar, dem Priester
  rationale: Der Personenname wird in seiner üblichen deutschen Bibelform wiedergegeben; die Apposition bezeichnet sein Amt.
- source_word: תְּרוּמַת יְהוָה
  choice: Abgabe für Jahwe
  rationale: תְּרוּמָה bezeichnet hier einen ausgesonderten Anteil für den heiligen Gebrauch. „Abgabe“ passt zum festgelegten Anteil aus der Beute; „für Jahwe“ wahrt die mögliche Zielbeziehung des Genitivs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt im Deutschen dessen Charakter als Eigenname.
- issue: Genitivverhältnis in תְּרוּמַת יְהוָה
  choice: Abgabe für Jahwe
  alternative: Jahwes Abgabe
  rationale: Die Wendung kann sowohl besitzanzeigend als auch zielbezogen verstanden werden. Im Kontext eines ausgesonderten Beuteanteils ist „für Jahwe“ natürlich; die Fußnote bewahrt die alternative Beziehung.
- issue: Bedeutung von תְּרוּמָה
  choice: Abgabe
  alternative: Opfergabe
  rationale: Hier steht ein festgelegter Anteil der Kriegsbeute im Vordergrund. „Abgabe“ bildet diesen Verteilungskontext genauer ab, ohne den heiligen Verwendungszweck zu leugnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtlich-anweisende Satzform bleibt erhalten; die hebräische Spannung zwischen pluralischem תִּקָּחוּ und singularischem וְנָתַתָּה wird nicht durch eine schwerfällige deutsche Numerusmarkierung überbetont.
