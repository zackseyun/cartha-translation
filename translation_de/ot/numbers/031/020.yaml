  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: de
  text: Und jedes Kleidungsstück, jeden Gegenstand aus Leder, alles aus Ziegenhaar Gefertigte und jeden Gegenstand aus Holz sollt ihr reinigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb steht in einer Form, die auch „sollt ihr euch reinigen“ bedeuten kann. Die vorangestellte Aufzählung spricht hier dafür, es auf die genannten Gegenstände zu beziehen.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: בֶּגֶד
  choice: Kleidungsstück
  rationale: בֶּגֶד bezeichnet gewöhnlich ein Kleid oder Kleidungsstück. „Kleidungsstück“ ist im heutigen Deutsch eindeutig und passt zur Aufzählung von Gegenständen.
- source_word: כְּלִי עוֹר
  choice: Gegenstand aus Leder
  rationale: כְּלִי kann allgemein ein Gerät, Gefäß oder einen Gebrauchsgegenstand bezeichnen. Da hier Materialgruppen aufgezählt werden, ist „Gegenstand“ weiter und sachgerechter als „Gefäß“; עוֹר bezeichnet Haut, Fell oder verarbeitetes Leder.
- source_word: מַעֲשֵׂה עִזִּים
  choice: alles aus Ziegenhaar Gefertigte
  rationale: מַעֲשֵׂה bezeichnet etwas Hergestelltes oder ein Erzeugnis. In dieser Materialliste ist wahrscheinlich ein aus Ziegenhaar gefertigter Gegenstand gemeint; „alles … Gefertigte“ gibt die umfassende Formulierung mit כָל natürlich wieder.
- source_word: כְּלִי עֵץ
  choice: Gegenstand aus Holz
  rationale: כְּלִי ist auch hier nicht auf ein Gefäß beschränkt. „Gegenstand aus Holz“ wahrt die parallele Einteilung nach Materialien.
- source_word: תִּתְחַטָּאוּ
  choice: sollt ihr reinigen
  rationale: Die Hitpael-Form der Wurzel חטא bezeichnet in diesem rituellen Zusammenhang Reinigung beziehungsweise Entsündigung. Die vorangestellte Gegenstandsliste legt nahe, das Verb hier auf die genannten Dinge zu beziehen. „Reinigen“ ist natürliches Deutsch und wird durch den Kontext als rituelle Reinigung bestimmt.
theological_decisions:
- issue: Bezug und Bedeutung der rituellen Reinigungsform תִּתְחַטָּאוּ
  choice: Die genannten Gegenstände werden als Objekte der Reinigung wiedergegeben.
  alternative: „sollt ihr euch reinigen“ beziehungsweise eine ausdrücklich reflexive Wiedergabe
  rationale: Das Verb steht morphologisch in einer reflexiven Stammform, doch die vorangestellte Liste konkreter Gegenstände fungiert im Satz am naheliegendsten als Objekt. Die Fußnote bewahrt die formale Mehrdeutigkeit, ohne aus der mit חטא verbundenen Wurzel eine Aussage über moralische Bekehrung oder spätere Sühnelehren abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die viergliedrige Aufzählung und ihre Materialordnung bleiben erhalten. „Rituell“ wird nicht in den Haupttext eingefügt, weil der unmittelbare Zusammenhang die Art der Reinigung bereits erkennen lässt; die Fußnote bewahrt die echte grammatische Spannung.
