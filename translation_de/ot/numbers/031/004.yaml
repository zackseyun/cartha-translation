  yaml_path: translation/ot/numbers/031/004.yaml
  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
translation:
  language: de
  text: Je tausend von jedem Stamm, je tausend von jedem Stamm, sollt ihr aus allen Stämmen Israels zum Heer[a] entsenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Kriegsdienst“. Der hebräische Ausdruck kann hier die Einordnung in das militärische Aufgebot beziehungsweise den Militärdienst bezeichnen, nicht nur eine Bewegung zu einem Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: Je tausend aus jedem Stamm, je tausend aus jedem Stamm
  rationale: Die distributive Bedeutung der wiederholten hebräischen Wendung wird mit „je … aus jedem“ wiedergegeben; zugleich bleibt die auffällige Wiederholung als rhetorisches Merkmal des Ausgangstextes erhalten.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: aus allen Stämmen Israels
  rationale: 'Die Wendung bestimmt den Umfang der Aushebung: Die Entsandten sollen aus sämtlichen Stämmen Israels kommen.'
- source_word: תִּשְׁלְחוּ
  choice: sollt ihr … entsenden
  rationale: Das Qal-Imperfekt in diesem anweisenden Zusammenhang hat verpflichtende Kraft. „Sollt ihr entsenden“ ist gegenwärtiges, würdevolles Deutsch und passt zur Entsendung eines militärischen Aufgebots.
- source_word: לַצָּבָא
  choice: zum Heer
  rationale: צָבָא bezeichnet hier das militärische Aufgebot beziehungsweise den Heeresdienst. „Zum Heer“ bewahrt die knappe räumlich-funktionale Formulierung des Hebräischen; die mögliche funktionale Wiedergabe wird in der Fußnote genannt.
