  text: וַ/תְּהִי֙ הַֽ/מֶּחֱצָ֔ה חֵ֕לֶק הַ/יֹּצְאִ֖ים בַּ/צָּבָ֑א מִסְפַּ֣ר הַ/צֹּ֗אן שְׁלֹשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹשִׁ֣ים אֶ֔לֶף וְ/שִׁבְעַ֥ת אֲלָפִ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: de
  text: Die Hälfte[a] – der Anteil derer, die zum Krieg ausgezogen waren – belief sich bei den Schafen auf 337.500.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: „Der Anteil derer, die zum Krieg ausgezogen waren.“'
    reason: Die hebräischen Ausdrücke „die Hälfte“ und „der Anteil“ stehen erläuternd nebeneinander; im Deutschen kann dies knapper zusammengezogen werden.
lexical_decisions:
- source_word: וַתְּהִי
  choice: belief sich
  rationale: Die Form leitet hier die ermittelte Gesamtzahl ein. „Belief sich“ gibt dies im Deutschen natürlich wieder, ohne über den Zahlensinn hinauszugehen.
- source_word: הַמֶּחֱצָה
  choice: die Hälfte
  rationale: Gemeint ist eine der beiden Hälften der zuvor aufgeteilten Beute. Die direkte Wiedergabe wahrt den Bezug zum hebräischen Substantiv.
- source_word: חֵלֶק
  choice: der Anteil derer
  rationale: Das Wort steht als nähere Bestimmung zu „die Hälfte“ und bezeichnet den den Kriegsteilnehmern zugewiesenen Anteil.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: die zum Krieg ausgezogen waren
  rationale: Die Wendung bezeichnet diejenigen, die am Kriegszug teilgenommen hatten. Diese Formulierung ist natürlich und bleibt dem militärischen Ausdruck eng verbunden.
- source_word: מִסְפַּר הַצֹּאן
  choice: bei den Schafen
  rationale: Der hebräische Ausdruck führt die Zahl der Tiere ein. Zusammen mit „belief sich“ ergibt sich eine idiomatische deutsche Mengenangabe.
- source_word: הַצֹּאן
  choice: Schafe
  rationale: Im Zusammenhang der Beuteaufstellung bezeichnet der Ausdruck hier die Schafe; „Schafe“ ist konkreter und verständlicher als das allgemeinere „Kleinvieh“.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: '337.500'
  rationale: Die additive hebräische Zahlenfolge ergibt exakt 337.500. Ziffern entsprechen heutiger deutscher Schreibweise und erhöhen die Übersichtlichkeit.
