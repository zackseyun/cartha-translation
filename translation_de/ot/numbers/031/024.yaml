  text: Am siebten Tag sollt ihr eure Kleider waschen; dann werdet ihr rein sein. Danach dürft ihr ins Lager kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: sollt ihr … waschen
  rationale: Das Piel von כבס bezeichnet hier das Waschen von Kleidungsstücken. „Sollt ihr … waschen“ gibt die verbindliche Anweisung natürlich wieder.
- source_word: בִּגְדֵיכֶם
  choice: eure Kleider
  rationale: בגד bezeichnet Kleidung beziehungsweise Kleidungsstücke; „Kleider“ ist im Deutschen klar und würdevoll.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Idiomatiche Wiedergabe der zeitlichen Bestimmung.
- source_word: וּטְהַרְתֶּם
  choice: dann seid ihr rein
  rationale: Das Qal von טהר beschreibt hier resultativ den erreichten Zustand kultischer Reinheit. „Seid ihr rein“ bewahrt diesen Zustandscharakter, ohne eine reflexive Handlung einzutragen.
- source_word: וְאַחַר
  choice: Danach
  rationale: Gibt die zeitliche Abfolge knapp und natürlich wieder.
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: dürft ihr ins Lager kommen
  rationale: בוא אל bedeutet „hineinkommen/eintreten“. Im Zusammenhang bezeichnet der Satz die nach vollzogener Reinigung erlaubte Rückkehr ins Lager.
theological_decisions:
- issue: Sprache kultischer Reinheit
  choice: „dann seid ihr rein“
  alternative: „dann werdet ihr gereinigt“ oder „reinigt euch“
  rationale: Der hebräische Text bezeichnet am ehesten den nach dem vorgeschriebenen Waschen erreichten Zustand kultischer Reinheit. Die Übersetzung vermeidet es, moralische oder geistliche Reinigung einzutragen.
- issue: Modalität des Wiedereintritts ins Lager
  choice: „dürft ihr ins Lager kommen“
  alternative: „sollt ihr ins Lager kommen“
  rationale: Die Form kann formal als Zukunft beziehungsweise Folgehandlung verstanden werden; im Reinheitskontext liegt jedoch die Erlaubnis zum Wiedereintritt nach abgeschlossener Reinigung nahe.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem und allgemein verständlichem Stil. Die kultisch-rituelle Bedeutung von „rein“ bleibt erhalten; erklärungsbedürftige Alternativen werden nicht unnötig in Fußnoten ausgelagert.
