  text: וַ/חֲמֹרִ֕ים שְׁלֹשִׁ֥ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת וּ/מִכְסָ֥/ם לַֽ/יהוָ֖ה אֶחָ֥ד וְ/שִׁשִּֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: de
  text: Die Esel waren 30.500, und ihre Abgabe[a] für Jahwe betrug 61.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihr festgesetzter Anteil. Das hebräische Wort bezeichnet hier den aus der Beute ausgesonderten Anteil, der Jahwe zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: Die Esel
  rationale: חֲמֹרִים bezeichnet gewöhnlich Esel. Das einleitende ו setzt die Aufzählung fort; im Deutschen wird dieser Zusammenhang durch den fortlaufenden Inventarstil ausreichend deutlich.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: '30.500'
  rationale: Die hebräische Zahlenfolge ergibt 30.500. Ziffern sind in einer zahlengeprägten Aufstellung übersichtlich und in der deutschen Schreibweise steht der Punkt als Tausendertrennzeichen.
- source_word: וּ/מִכְסָ/ם
  choice: ihre Abgabe
  rationale: מֶכֶס bezeichnet hier den festgesetzten, aus der Beute ausgesonderten Anteil. „Abgabe“ ist im heutigen Deutsch verständlich und gibt den verpflichtenden Charakter wieder, ohne eine moderne Steuerordnung vorauszusetzen.
- source_word: לַ/יהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet Jahwe als Empfänger beziehungsweise denjenigen, dem der Anteil zusteht. „Für Jahwe“ klingt im Deutschen natürlich und bewahrt den Gottesnamen als Namen.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: '61'
  rationale: Die ungewöhnliche hebräische Reihenfolge „eins und sechzig“ bezeichnet eindeutig die Zahl 61; die Zifferndarstellung entspricht dem Inventarcharakter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, sachliche und würdevolle Standardsprache. Die knappe Inventarstruktur und die exakten Zahlen bleiben erhalten; „betrug“ macht den elliptischen hebräischen Nominalsatz im Deutschen verständlich.
