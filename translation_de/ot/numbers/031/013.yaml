base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: de
  text: Da gingen Mose, der Priester Eleasar und alle Leiter der Gemeinde aus dem Lager hinaus, um ihnen entgegenzugehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Da gingen … hinaus
  rationale: Das Wayyiqtol von יצא führt die Erzählung fort und bezeichnet eine Bewegung nach draußen; „Da gingen … hinaus“ ist im Deutschen natürlich und bewahrt die Richtung.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: der Priester Eleasar
  rationale: Die deutsche Wortstellung gibt Eleasars Amtsbezeichnung klar und idiomatisch wieder.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: alle führenden Männer der Gemeinde
  rationale: נְשִׂיאִים bezeichnet hier anerkannte Leitungs- oder Oberhäupter, nicht Könige; „führende Männer“ ist kontextgerecht, während הָעֵדָה als versammelte Bundesgemeinschaft mit „Gemeinde“ wiedergegeben wird.
- source_word: לִקְרָאתָם
  choice: ihnen entgegen
  rationale: 'Die Wendung bezeichnet den Zweck beziehungsweise die Zielrichtung des Hinausgehens: Sie gingen hinaus, um den Zurückkehrenden zu begegnen.'
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: vor das Lager
  rationale: Die hebräische Richtungsangabe meint einen Ort außerhalb der Lagergrenze. „Vor das Lager“ drückt im Deutschen sowohl die Bewegung als auch die Lage außerhalb aus.
theological_decisions: []
