source:
  edition: WLC
  text: וַ/יִּמָּֽסְרוּ֙ מֵ/אַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַ/מַּטֶּ֑ה שְׁנֵים עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: de
  text: 'So wurden aus den Tausendschaften Israels[a] je tausend aus jedem Stamm gestellt[b]: zwölftausend zum Krieg gerüstete Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Tausendschaften Israels“ kann sowohl die Tausende als Zahlenangabe als auch größere Sippen- oder Heeresverbände Israels bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „übergeben“, „bereitgestellt“ oder „gemustert“. Das hebräische Verb kann ausdrücken, dass Männer zum Dienst gestellt oder zugeteilt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: wurden ... gestellt
  rationale: Das Nifal bezeichnet hier, dass die Männer aus Israel für den Feldzug bereitgestellt beziehungsweise zugeteilt wurden. „Gestellt“ bewahrt den passiven Sinn und klingt im militärischen Zusammenhang natürlich.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: aus den Tausendschaften Israels
  rationale: אַלְפֵי kann wörtlich „Tausende“, zugleich aber auch größere Sippen- oder Heeresverbände bezeichnen. „Tausendschaften“ erhält Zahlbezug und organisatorische Bedeutung.
- source_word: אֶלֶף לַמַּטֶּה
  choice: je tausend von jedem Stamm
  rationale: 'Die Präposition לְ ist hier distributiv zu verstehen: Jeder Stamm stellte tausend Männer.'
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: zwölftausend
  rationale: Die Kardinalzahl fasst die aus den Stämmen gestellte Gesamtzahl zusammen.
- source_word: חֲלוּצֵי צָבָא
  choice: zum Krieg gerüstete Männer
  rationale: Die Wendung bezeichnet für den militärischen Einsatz ausgerüstete beziehungsweise bereitgemachte Männer; „zum Krieg gerüstet“ gibt dies prägnant und würdig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tausendschaften“ ist bewusst gewählt, um die Mehrdeutigkeit zwischen zahlenmäßigen Tausenden und sozialen beziehungsweise militärischen Verbänden zu bewahren; die Fußnote erläutert den weniger alltäglichen Ausdruck.
