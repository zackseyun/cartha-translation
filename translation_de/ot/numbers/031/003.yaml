  terminology: »Mose«, »Volk«, »Männer«, »Midian«, »Rache« und »Jahwe« sind konsistent und angemessen. »Rache Jahwes« bewahrt die knappe, theologisch offene Zuordnung der hebräischen Konstruktverbindung. Die Fußnote nennt die tragfähige alternative Lesart, ohne sie dogmatisch zu entscheiden.
