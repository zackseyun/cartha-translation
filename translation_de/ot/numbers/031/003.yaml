reference: Numbers 31:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: de
  text: 'Mose sagte zum Volk: »Rüstet Männer aus eurer Mitte zum Kampf aus. Sie sollen gegen Midian ziehen, um an Midian die Rache Jahwes[a] zu vollstrecken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Rache für Jahwe«. Die hebräische Formulierung kann sowohl die Jahwe zugehörige Rache als auch die für ihn beziehungsweise in seinem Auftrag vollzogene Rache bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר ... לֵאמֹר
  choice: sagte
  rationale: Die hebräische Erzählungsformel leitet die direkte Rede ein. Das schlichte »sagte« gibt sie im heutigen Deutsch natürlich wieder, ohne die Doppelung »redete … und sagte« nachzuahmen.
- source_word: הָעָם
  choice: dem Volk
  rationale: Gemeint ist hier die von Mose angesprochene Gemeinschaft Israels; »Volk« ist die direkte und geläufige Entsprechung.
- source_word: הֵחָלְצוּ
  choice: Rüstet … aus
  rationale: Das Verb bezeichnet in diesem militärischen Zusammenhang das Ausrüsten beziehungsweise Bereitmachen für einen Feldzug.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: Männer aus eurer Mitte
  rationale: Die Wendung bezeichnet ausdrücklich Männer, die aus der angesprochenen Gemeinschaft ausgewählt werden.
- source_word: לַצָּבָא
  choice: zum Kampf
  rationale: צָבָא kann Heer, Kriegsdienst oder Kampf bezeichnen. Nach »ausrüsten« drückt »zum Kampf« den militärischen Zweck klar und idiomatisch aus.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: Sie sollen gegen Midian ziehen
  rationale: Die Verbindung mit עַל bezeichnet hier eine feindliche Ausrichtung gegen Midian. »ziehen« macht den militärischen Zusammenhang natürlich verständlich, ohne bereits eine bestimmte Kampfhandlung vorwegzunehmen.
- source_word: לָתֵת נִקְמַת
  choice: die Rache … vollstrecken
  rationale: Wörtlich steht »Rache geben«; im Deutschen gibt »Rache vollstrecken« die idiomatische Bedeutung des Ausführens der Vergeltung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּמִדְיָן
  choice: an Midian
  rationale: Die Präposition kennzeichnet Midian als Ziel der Vergeltung; »Rache an Midian« ist im Deutschen idiomatisch.
theological_decisions:
- issue: Zuordnung der Rache in נִקְמַת יְהוָה
  choice: die Rache Jahwes
  alternative: die Rache für Jahwe
  rationale: Die Status-constructus-Verbindung kann die Rache als Jahwe zugehörig beziehungsweise von ihm ausgehend bezeichnen, aber auch als in seinem Namen oder für ihn vollzogen verstanden werden. Der Haupttext bewahrt die knappe Genitivkonstruktion; die Fußnote nennt die echte Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar gegliedert; der harte Ausdruck »Rache« bleibt ungemildert erhalten. Der Gottesname wird als »Jahwe« wiedergegeben.
