  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מֹשֶׁ֑ה הַֽ/חִיִּיתֶ֖ם כָּל נְקֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: de
  text: 'Mose sagte zu ihnen: „Habt ihr alle weiblichen Personen am Leben gelassen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche deutsche Wiedergabe des narrativen Wayyiqtol von אמר ist das Präteritum „sagte“.
- source_word: אֲלֵיהֶם
  choice: zu ihnen
  rationale: Die Präposition אֶל mit Suffix der 3. Person maskulin Plural bezeichnet die Adressaten, an die Mose seine Worte richtet.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Eigenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: הַחִיִּיתֶם
  choice: habt ihr … am Leben gelassen
  rationale: Die Hifil-Form von חיה bedeutet hier „leben lassen/am Leben lassen“. Das Perfekt passt zur unmittelbaren Beurteilung einer abgeschlossenen Handlung; die Frage ergibt sich aus Form und Kontext.
- source_word: כָּל
  choice: alle
  rationale: כָּל bezeichnet hier die Gesamtheit ohne Ausnahme; vor „weiblichen Personen“ ist „alle“ im Deutschen idiomatisch.
- source_word: נְקֵבָה
  choice: weiblichen Personen
  rationale: נְקֵבָה bezeichnet geschlechtsbezogen weibliche Menschen und legt in diesem Vers kein Alter fest. „Weibliche Personen“ bewahrt den umfassenden, sachlich-markierten Ausdruck, ohne ihn auf erwachsene Frauen einzuengen.
theological_decisions:
- issue: Wiedergabe von נְקֵבָה im gewaltsamen Kriegskontext
  choice: weibliche Personen
  alternative: Frauen; Frauen und Mädchen; alles Weibliche
  rationale: Der hebräische Ausdruck ist nicht auf erwachsene Frauen begrenzt. „Weibliche Personen“ erhält den erschütternd umfassenden Bezug auf Menschen weiblichen Geschlechts, ohne durch „Frauen“ eine Altersgrenze einzutragen oder durch „alles Weibliche“ im Deutschen Tiere mit einzuschließen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die direkte Frage bewahrt die Schärfe des hebräischen Wortlauts. Es ist keine Fußnote nötig, da „am Leben gelassen“ die maßgebliche kausative Bedeutung natürlich und genau wiedergibt.
