  terminology: »Priester Eleasar« und »Gemeinde« sind angemessen. »Vaterhäuser« ist hier als etablierter, hinreichend verständlicher Begriff genauer als »Großfamilien«; die Fußnote kann die soziale Bedeutung erläutern. »Kriegsbeute« macht מַלְקוֹחַ explizit, ohne die erfassten Menschen oder Tiere auf bloße Sachgüter zu reduzieren.
