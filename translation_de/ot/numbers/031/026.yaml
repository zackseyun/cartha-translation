  source_fidelity: 'Die Grundbedeutung ist zutreffend: Der Text befiehlt eine Zählung der im Krieg erlangten Menschen und Tiere. Die hebräische Imperativform שָׂא ist jedoch Singular und richtet sich ausdrücklich an Mose; der Pluralimperativ »Ermittelt« nivelliert dies, obwohl das nachgestellte אַתָּה »du« gerade hervorgehoben wird. »Großfamilien« ist als Erklärung möglich, gibt אֲבוֹת („Väter-/Vaterhäuser“, d. h. Abstammungshäuser) aber etwas zu frei wieder.'
