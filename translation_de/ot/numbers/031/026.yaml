  text: שָׂ֗א אֵ֣ת רֹ֤אשׁ מַלְק֨וֹחַ֙ הַ/שְּׁבִ֔י בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה אַתָּה֙ וְ/אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/רָאשֵׁ֖י אֲב֥וֹת הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: de
  text: Ermittle die Gesamtzahl der Kriegsbeute, der Menschen und Tiere[a] – du, der Priester Eleasar und die Oberhäupter der Vaterhäuser der Gemeinde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Beute des Gefangenen-/Gefangenschaftszugs«. Der hebräische Ausdruck bezeichnet das im Krieg Erbeutete; hier werden ausdrücklich Menschen und Tiere genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: Ermittelt die Gesamtzahl
  rationale: Die Wendung bedeutet idiomatisch, eine Zählung beziehungsweise Bestandsaufnahme vorzunehmen; eine wörtliche Wiedergabe mit »den Kopf erheben« wäre im Deutschen missverständlich.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: der erbeuteten Menschen und Tiere
  rationale: Die beiden Substantive bezeichnen die Kriegsbeute beziehungsweise das Gefangengenommene. Da der folgende Ausdruck ausdrücklich Menschen und Tiere nennt, wird die Konstruktion natürlich und ohne Beschränkung auf Sachgüter wiedergegeben.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: Menschen und Tiere
  rationale: אָדָם bezeichnet hier Menschen im Gegensatz zu den Tieren; בְּהֵמָה meint in diesem Zusammenhang besonders Nutz- oder Herdentiere, ohne dass die allgemeinere Kategorie ausgeschlossen ist.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen hebt Moses als Beteiligten an der Bestandsaufnahme hervor.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: der Priester Eleasar
  rationale: Der Name wird in geläufiger deutscher Form wiedergegeben; im Deutschen steht die Amtsbezeichnung natürlich vor dem Namen.
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  choice: die Oberhäupter der Großfamilien der Gemeinde
  rationale: רָאשֵׁי bezeichnet leitende Oberhäupter; אֲבוֹת steht verkürzt für väterliche beziehungsweise verwandtschaftlich gegliederte Familienverbände. »Großfamilien« vermittelt diese Sozialstruktur verständlicher als das wörtliche »Väter«.
- source_word: הָעֵדָה
  choice: der Gemeinde
  rationale: Der Ausdruck bezeichnet die organisierte Gemeinschaft Israels; »Gemeinde« ist im Pentateuch verständlich und traditionsnah.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Pluralimperativ »Ermittelt« nimmt die nachgestellte Aufzählung der gemeinsam Verantwortlichen auf. »Großfamilien« vermeidet die im heutigen Deutsch missverständliche wörtliche Form »Vaterhäuser«, während die soziale Gliederung des hebräischen Ausdrucks erhalten bleibt.
