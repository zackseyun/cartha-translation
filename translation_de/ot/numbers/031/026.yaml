  to: Ermittle die Gesamtzahl der Kriegsbeute, der Menschen und Tiere[a] – du, der Priester Eleasar und die Oberhäupter der Vaterhäuser der Gemeinde.
  rationale: Die Revision bewahrt den singularischen, an Mose gerichteten Imperativ und gibt zugleich die Beteiligung Eleasars und der Familienoberhäupter in der nachgestellten Aufzählung wieder. »Kriegsbeute« entspricht מַלְקוֹחַ, während »Menschen und Tiere« die anschließende Spezifizierung klar ausdrückt. »Vaterhäuser« ist für die soziale Gliederung des hebräischen Textes präziser; die Fußnote erläutert die nicht ganz eindeutige Beute-/Gefangenschaftsformulierung, ohne sie übermäßig festzulegen.
