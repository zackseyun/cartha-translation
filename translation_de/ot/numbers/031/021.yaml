  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: de
  text: 'Da sagte der Priester Eleasar zu den Männern des Heeres, die in den Kampf gezogen waren: »Dies ist die Satzung des Gesetzes[a], die Jahwe Mose geboten hat:«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Rechtsbestimmung der Weisung«.'
    reason: Die Verbindung חֻקַּת הַתּוֹרָה kann sowohl mit traditionell-rechtlichem Wortlaut („Satzung des Gesetzes“) als auch unter Betonung des anweisenden Charakters von תּוֹרָה wiedergegeben werden.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: der Priester Eleasar
  rationale: Die im Deutschen übliche Wortstellung verbindet den Eigennamen klar mit seinem bestimmten Amtstitel.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: die Männer des Heeres
  rationale: Die Formulierung bewahrt das ausdrücklich männliche אַנְשֵׁי und gibt צָבָא als militärischen Verband wieder.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: die in den Kampf gezogen waren
  rationale: Die idiomatische deutsche Wendung bezeichnet die Männer, die sich zum Kampf begeben hatten, ohne das Hebräische ausdrücklich zu „aus dem Kampf zurückkehrten“ zu erweitern.
- source_word: חֻקַּת הַתּוֹרָה
  choice: die Satzung des Gesetzes
  rationale: „Satzung“ bewahrt den verbindlichen, festgesetzten Charakter von חֻקָּה; „Gesetz“ gibt תּוֹרָה in diesem rechtlichen Zusammenhang angemessen wieder. Die mögliche Bedeutung „Weisung“ bleibt in der Fußnote sichtbar.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: die Jahwe Mose geboten hat
  rationale: Mose ist durch אֶת als direktes Objekt des Gebots gekennzeichnet. Die Formulierung vermeidet daher die nicht ausdrückliche Deutung, Jahwe habe etwas „durch Mose“ geboten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem biblischem Rechtsregister. „Heer“ und „Satzung“ wahren die formelle Färbung, bleiben aber allgemein verständlich.
