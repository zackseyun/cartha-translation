id: NUM.31.52
reference: Numbers 31:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: de
  text: Das gesamte Gold der Abgabe, die sie Jahwe darbrachten, betrug 16.750 Schekel[a]; es kam von den Befehlshabern der Tausendschaften und den Befehlshabern der Hundertschaften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schekel war hier eine Gewichtseinheit. 16.750 Schekel entsprechen ungefähr 190 Kilogramm, wobei das genaue Gewicht eines Schekels schwanken konnte.
    reason: Maßangabe und ungefähre moderne Entsprechung
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: Das gesamte Gold ... betrug
  rationale: Die Formulierung gibt die erzählerisch angeschlossene Angabe einer Gesamtsumme in natürlichem Deutsch wieder.
- source_word: הַתְּרוּמָה
  choice: der Abgabe
  rationale: תְּרוּמָה bezeichnet hier eine für Jahwe ausgesonderte und übergebene Abgabe; „Abgabe“ passt zum Anteil aus der Kriegsbeute, ohne eine bestimmte Opferart zu unterstellen.
- source_word: אֲשֶׁר הֵרִימוּ לַיהוָה
  choice: die sie Jahwe darbrachten
  rationale: Das Hifil von רום bezeichnet in diesem kultischen Zusammenhang das Aussondern und Übergeben; „darbringen“ wahrt den sakralen Bezug, ohne eine buchstäbliche Hebebewegung zu behaupten.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: 16.750 Schekel
  rationale: Die Zahl wird nach deutscher Schreibkonvention wiedergegeben; Schekel ist hier eine Gewichtseinheit.
- source_word: מֵאֵת
  choice: es kam von
  rationale: Die Präposition kennzeichnet die Herkunft des Goldes; ein eigener Satzteil macht diesen Bezug im Deutschen eindeutig.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: den Befehlshabern der Tausendschaften
  rationale: Der militärische Kontext spricht für „Befehlshaber“; „Tausendschaften“ bezeichnet die gegliederten Truppeneinheiten und nicht bloß Zahlen.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: den Befehlshabern der Hundertschaften
  rationale: Die parallele Wiedergabe erhält die militärisch-administrative Gliederung des hebräischen Textes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von תְּרוּמָה
  choice: Abgabe
  alternative: Opfergabe / Hebopfer
  rationale: Der Ausdruck bezeichnet etwas, das für Jahwe ausgesondert wird. „Abgabe“ bewahrt den konkreten Bezug zum Beuteanteil; „Hebopfer“ wäre im modernen Deutsch missverständlich und „Opfergabe“ könnte die Bedeutung unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärischen Fachbegriffe werden verständlich, aber strukturell nah am Hebräischen wiedergegeben; der Gottesname erscheint als „Jahwe“.
