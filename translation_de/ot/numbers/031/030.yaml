  verdict: revise
  source_fidelity: Die Gliederung der Abgabe (ein Anteil aus fünfzig aus Menschen und den genannten Tierbeständen), die Zuweisung an die Leviten und der Gottesname sind zutreffend wiedergegeben. Die deutsche Formulierung für die levitische Aufgabe sollte jedoch die in שֹׁמְרֵי מִשְׁמֶרֶת enthaltene Obhuts-/Wachdimension deutlicher erkennen lassen.
  naturalness: Der Entwurf ist überwiegend modernes, verständliches Standarddeutsch. „Je einen aus fünfzig“ ist idiomatischer als „je einen von fünfzig“. Die wiederholten Präpositionen in der Aufzählung erhöhen die Klarheit. „Mit der Obhut ... betraut“ ist natürlich und wahrt den institutionellen Charakter der Aufgabe.
  terminology: „Israeliten“, „Rinder“, „Esel“, „Kleinvieh“, „Wohnung Jahwes“ und „Leviten“ sind angemessen. Eine Fußnote zu „Kleinvieh“ erläutert sinnvoll, dass צֹאן vor allem Schafe und Ziegen umfasst, ohne die Kollektivbezeichnung im Text unnötig aufzulösen.
  issues:
  - severity: medium
    issue: Die Wiedergabe „den Dienst an der Wohnung Jahwes versehen“ macht die Bewachungs-/Obhutsdimension von שֹׁמְרֵי מִשְׁמֶרֶת nicht ausdrücklich kenntlich.
    rationale: Die hebräische Kognatenverbindung bezeichnet das Wahrnehmen einer anvertrauten Wache bzw. Obhut. „Mit der Obhut ... betraut“ erhält diese Bedeutung, ohne den Dienst auf bloß physisches Wachen zu verengen.
  - severity: low
    issue: „Je einen von fünfzig“ ist im Deutschen weniger idiomatisch als „je einen aus fünfzig“.
    rationale: „Aus fünfzig“ bezeichnet die Entnahmequote klarer. Die Fußnote kann zugleich die passive Nuance von אָחֻז festhalten.
  - severity: low
    issue: Die lexikalische Spannweite von צֹאן wird im Entwurf nicht durch eine Fußnote dokumentiert.
    rationale: „Kleinvieh“ ist als Kollektivwiedergabe vertretbar, kann im heutigen Deutsch aber weiter verstanden werden; die Erläuterung „vor allem Schafe und Ziegen“ sichert die Quellbedeutung.
