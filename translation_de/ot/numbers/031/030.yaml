  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: de
  text: 'Und von der Hälfte der Israeliten sollst du je einen aus fünfzig nehmen: von den Menschen, von den Rindern, von den Eseln, vom Kleinvieh[b], von allem Vieh. Diese sollst du den Leviten geben, die mit der Obhut der Wohnung Jahwes betraut sind.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Kleinvieh“ bezeichnet hier vor allem Schafe und Ziegen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Und von der Hälfte, die den Israeliten gehört
  rationale: מַחֲצִית bezeichnet die Hälfte beziehungsweise den Halbanteil. „Die den Israeliten gehört“ macht die Zugehörigkeit im Deutschen natürlich deutlich; „Israeliten“ gibt בְּנֵי יִשְׂרָאֵל hier als Volksbezeichnung idiomatisch wieder.
- source_word: תִּקַּח
  choice: sollst du ... nehmen
  rationale: Das Imperfekt hat in diesem Anweisungszusammenhang gebietenden Sinn. Die deutsche Soll-Konstruktion wahrt den rechtlich-anweisenden Ton.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: je einen von fünfzig nehmen
  rationale: Die Wendung legt eine Abgabequote von 1:50 fest. „Je einen von fünfzig“ ist natürliches Deutsch; das Verb „nehmen“ trägt bereits den Sinn des passiven Partizips אָחֻז mit, ohne die schwerfällige Formulierung „einen Genommenen“ zu erzeugen.
- source_word: מִן הָאָדָם
  choice: von den Menschen
  rationale: אָדָם steht kollektiv für die menschlichen Gefangenen innerhalb der Beute. Der deutsche Plural ist in der Aufzählung verständlich und bewahrt den Gegensatz zu den Tiergruppen.
- source_word: מִן הַבָּקָר
  choice: den Rindern
  rationale: בָּקָר bezeichnet Rinder beziehungsweise Großvieh; „Rinder“ ist in dieser Bestandsaufzählung präzise und geläufig.
- source_word: מִן הַחֲמֹרִים
  choice: den Eseln
  rationale: Direkte, moderne Wiedergabe der Tierbezeichnung.
- source_word: וּמִן הַצֹּאן
  choice: und dem Kleinvieh
  rationale: צֹאן ist eine kollektive Bezeichnung insbesondere für Schafe und Ziegen. „Kleinvieh“ erfasst diesen Umfang genauer als nur „Schafe“.
- source_word: מִכָּל הַבְּהֵמָה
  choice: von allem Vieh
  rationale: בְּהֵמָה fungiert hier als zusammenfassende Bezeichnung für den Tierbestand. Die knappe Wiedergabe erhält diese resümierende Funktion.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: die den Dienst an der Wohnung ... versehen
  rationale: Die figura etymologica שֹׁמְרֵי מִשְׁמֶרֶת bezeichnet das gewissenhafte Wahrnehmen einer übertragenen Obhut beziehungsweise Dienstpflicht. „Den Dienst ... versehen“ ist im Deutschen würdig und schließt die Bewachungs- und Aufsichtsfunktion ein.
- source_word: מִשְׁכַּן
  choice: Wohnung
  rationale: מִשְׁכָּן bezeichnet die heilige Wohnstätte Jahwes. „Wohnung“ hält den Bezug auf das Wohnen präsent; „Stiftshütte“ wäre traditionell, aber weniger transparent.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art des levitischen Auftrags in שֹׁמְרֵי מִשְׁמֶרֶת
  choice: den Dienst an der Wohnung versehen
  alternative: die an der Wohnung Wache halten
  rationale: Die Wendung kann sowohl Obhut als auch pflichtgemäßen Dienst ausdrücken. Im Kontext der Leviten ist die weitere Formulierung angemessen und legt den Auftrag nicht ausschließlich auf physisches Bewachen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-anweisendem Ton. Die lange hebräische Aufzählung bleibt erkennbar, wird aber durch Doppelpunkt und Satzteilung lesbar gestaltet. „Wohnung Jahwes“ bewahrt das Wohnmotiv von מִשְׁכָּן und den Gottesnamen.
