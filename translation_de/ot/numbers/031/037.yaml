  text: וַ/יְהִ֛י הַ/מֶּ֥כֶס לַֽ/יהוָ֖ה מִן הַ/צֹּ֑אן שֵׁ֥שׁ מֵא֖וֹת חָמֵ֥שׁ וְ/שִׁבְעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: de
  text: Und die Abgabe für Jahwe aus dem Kleinvieh betrug 675 Tiere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … betrug
  rationale: Die Form dient hier als erzählerische Kopula und leitet die Höhe der Abgabe ein. Im Deutschen gibt „betrug“ die Mengenangabe natürlich und genau wieder.
- source_word: הַמֶּכֶס
  choice: die Abgabe
  rationale: מֶכֶס bezeichnet hier den festgesetzten Anteil aus der Kriegsbeute. „Abgabe“ ist im Deutschen verständlich und vermeidet die modernen oder engeren Assoziationen von „Steuer“ und „Tribut“.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet den für Jahwe bestimmten beziehungsweise ihm zukommenden Anteil.
- source_word: יהוה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִן הַצֹּאן
  choice: aus dem Kleinvieh
  rationale: צֹאן bezeichnet kollektiv kleinere Herdentiere, besonders Schafe und Ziegen. „Kleinvieh“ wahrt diesen weiteren Bedeutungsumfang besser als „Schafe“.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: 675 Tiere
  rationale: Die Zahl wird exakt wiedergegeben. „Tiere“ wird im Deutschen ergänzt, damit klar ist, dass es sich um die Anzahl des Kleinviehs handelt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. „Jahwe“ bewahrt ihn als Gottesnamen, statt ihn durch den traditionellen Ersatztitel „der HERR“ wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Zähl- und Abrechnungsform des hebräischen Verses bleibt erhalten; „Kleinvieh“ bewahrt die Einbeziehung von Schafen und Ziegen.
