  variant: modern standard German
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: de
  text: Alles, was Feuer verträgt, sollt ihr durch das Feuer gehen lassen; und es wird rein sein. Doch es muss mit dem Wasser zur Beseitigung der Unreinheit[a] gereinigt werden. Alles aber, was Feuer nicht verträgt, sollt ihr durch das Wasser gehen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Wasser der Unreinheit“; gemeint ist das in Numeri 19 vorgeschriebene Wasser zur Reinigung von Unreinheit. Traditionell auch: „Reinigungswasser“ oder „Sprengwasser“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: Alles
  rationale: Bezeichnet hier umfassend jeden einzelnen erbeuteten Gegenstand; „alles“ ist im Deutschen natürlich und konkret genug.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: was Feuer verträgt
  rationale: Im Zusammenhang geht es um Gegenstände, die zur Reinigung dem Feuer ausgesetzt werden können, nicht nur um solche, die tatsächlich hineingelangen.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: sollt ihr durchs Feuer gehen lassen
  rationale: Gibt den Kausativ von עבר wieder und bewahrt zugleich die Parallele zur Behandlung mit Wasser.
- source_word: וְטָהֵר
  choice: dann ist es rein
  rationale: Drückt den erreichten Zustand ritueller Reinheit aus, ohne die anschließende zusätzliche Reinigungsvorschrift vorwegzunehmen.
- source_word: אַךְ
  choice: doch zusätzlich
  rationale: Kennzeichnet die folgende Vorschrift als notwendige Einschränkung beziehungsweise Ergänzung zur Feuerbehandlung.
- source_word: בְּמֵי נִדָּה
  choice: mit dem Wasser gegen Unreinheit
  rationale: Bezeichnet das besondere Wasser zur Beseitigung ritueller Unreinheit; die ungewöhnliche Formulierung hält die Beziehung des Genitivs offen und wird in der Fußnote erläutert.
- source_word: יִתְחַטָּא
  choice: muss es … gereinigt werden
  rationale: Das Hitpael von חטא bezeichnet hier das Durchlaufen einer rituellen Reinigung, nicht Vergebung moralischer Schuld.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: Alles aber, was kein Feuer verträgt
  rationale: Stellt natürlich den praktischen Gegensatz zwischen feuerfesten und nicht feuerfesten Gegenständen her.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: sollt ihr durchs Wasser gehen lassen
  rationale: Bewahrt die Wiederholung desselben kausativen Verbs und die Parallelität mit der Feuerklausel.
theological_decisions:
- issue: Bedeutung der Reinigungssprache im priesterlichen Gesetz
  choice: Die Aussage wird auf rituelle Reinheit und Unreinheit bezogen.
  alternative: Die von חטא abgeleitete Verbform könnte mit schuld- oder sündenbezogener Sprache wiedergegeben werden.
  rationale: Der Zusammenhang von Numeri 31 und die entsprechende Vorschrift in Numeri 19 behandeln die rituelle Reinigung von Gegenständen; der Vers spricht nicht von der Vergebung moralischer Schuld.
translation_notes:
  register: Moderne, würdige Standardsprache. „Feuer verträgt“ verdeutlicht die praktische Unterscheidung der Gegenstände; „durchs Feuer/Wasser gehen lassen“ erhält den hebräischen Parallelismus. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
