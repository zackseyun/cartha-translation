  yaml_path: translation/ot/numbers/031/038.yaml
  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: de
  text: Und die Rinder waren sechsunddreißigtausend; die davon für den HERRN erhobene Abgabe betrug zweiundsiebzig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בָּקָר bezeichnet als Kollektiv Rindvieh. Im Zusammenhang der zahlenmäßigen Aufstellung ist „die Rinder“ im modernen Deutschen präzise und natürlich.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: sechsunddreißigtausend
  rationale: Die im Hebräischen als „sechs und dreißigtausend“ angegebene Zahl wird nach heutiger deutscher Zahlwortbildung wiedergegeben.
- source_word: מִכְסָם
  choice: die davon erhobene Abgabe
  rationale: מֶכֶס bezeichnet hier den festgesetzten, aus der Kriegsbeute abzuführenden Anteil. „Abgabe“ trifft diesen administrativen Sinn; „davon“ gibt den pronominalen Bezug von -ם auf die Rinder idiomatisch wieder.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: ל kennzeichnet den Anteil als für JHWH bestimmt. Die Wiedergabe „für den HERRN“ wahrt die im deutschen Bibelgebrauch etablierte Ersatzlesung des Gottesnamens und entspricht der vorliegenden konsultativen Fassung.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: zweiundsiebzig
  rationale: Die hebräische Reihenfolge „zwei und siebzig“ entspricht unmittelbar der üblichen deutschen Zahlwortbildung „zweiundsiebzig“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Der Konsonantentext enthält den Gottesnamen JHWH. „Der HERR“ folgt der traditionellen jüdischen Ersatzlesung und dem weithin vertrauten deutschen Bibelgebrauch; „Jahwe“ wäre eine mögliche direktere Wiedergabe. Die Wahl entscheidet keine weitergehende theologische Frage.
translation_notes:
  register: Moderne, würdige Standardsprache. Der knappe Inventarstil bleibt erhalten; ein Semikolon gliedert Gesamtzahl und Abgabe. „Betrug“ macht die elliptische hebräische Nominalkonstruktion im Deutschen verständlich.
