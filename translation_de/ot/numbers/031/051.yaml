base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/051.yaml
  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: de
  text: Da nahmen Mose und der Priester Eleasar das Gold von ihnen entgegen – alle kunstvoll gearbeiteten Gegenstände.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahmen … entgegen
  rationale: לקח bezeichnet hier das Annehmen beziehungsweise Entgegennehmen des von den Heerführern übergebenen Goldes. Die deutsche Verbklammer gibt den Erzählfortgang natürlich wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Eingebürgerte deutsche Form des Namens.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: und der Priester Eleasar
  rationale: Gibt den Eigennamen mit seiner Amtsbezeichnung in natürlicher deutscher Wortstellung wieder.
- source_word: אֶת הַזָּהָב
  choice: das Gold
  rationale: Der bestimmte Ausdruck verweist auf das im Kontext übergebene Gold.
- source_word: מֵאִתָּם
  choice: von ihnen
  rationale: Die Präposition bezeichnet die Personen, von denen Mose und Eleasar das Gold entgegennahmen.
- source_word: כֹּל כְּלִי מַעֲשֶׂה
  choice: jedes kunstvoll gearbeitete Stück
  rationale: כְּלִי ist hier ein weiter Begriff für einen Gegenstand, nicht speziell für ein Gefäß. מַעֲשֶׂה kennzeichnet die Stücke als bearbeitet beziehungsweise angefertigt; die singularische Form mit כֹּל wird durch „jedes … Stück“ bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entgegennehmen“ macht die Übergabesituation des Kontextes deutlich, während „jedes kunstvoll gearbeitete Stück“ den kollektiven Singular des Hebräischen und den Unterschied zu unbearbeitetem Gold bewahrt.
