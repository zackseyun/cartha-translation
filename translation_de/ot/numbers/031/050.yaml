id: NUM.31.50
reference: Numbers 31:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: de
  text: 'Darum haben wir Jahwes Opfergabe dargebracht, jeder Mann das, was er gefunden hat: Gegenstände aus Gold – Armspangen[a] und Armbänder, Ringe, Ohrringe und Schmuckanhänger[b] –, um für uns[c] vor Jahwe Sühne zu erwirken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Fußspangen«. Die genaue Art des mit אֶצְעָדָה bezeichneten Schmucks ist nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bedeutung von כוּמָז ist unsicher; möglich sind auch »Halsketten«, »Schmuckstücke« oder »Nasenringe«.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »für unsere Leben« beziehungsweise »für unsere Personen«.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: Darum haben wir … dargebracht
  rationale: Das Hifil von קרב bedeutet wörtlich »heranbringen«. Im Zusammenhang einer Opfergabe gibt »darbringen« die kultische Bedeutung in natürlichem Deutsch wieder; »darum« nimmt das folgernde narrative וַ auf.
- source_word: קָרְבַּן יְהוָה
  choice: Jahwes Opfergabe
  rationale: קָרְבָּן bezeichnet eine Gabe, die dargebracht beziehungsweise herangebracht wird. Die deutsche Genitivverbindung bewahrt die offene Zuordnung zu Jahwe, ohne die genaue Opferart festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: jeder Mann das, was er gefunden hat
  rationale: אִישׁ hat hier verteilende Bedeutung und bezieht sich im Kontext auf die männlichen Kriegsteilnehmer. Die Formulierung bewahrt sowohl diesen Bezug als auch den Relativsatz.
- source_word: כְלִי זָהָב
  choice: Gegenstände aus Gold
  rationale: כְלִי ist ein weiter Begriff für Gegenstand, Gerät oder Gefäß. »Gegenstände aus Gold« bleibt bewusst allgemein, während die folgende Aufzählung die konkreten Schmuckstücke nennt.
- source_word: אֶצְעָדָה
  choice: Armspangen
  rationale: Das seltene Wort bezeichnet wahrscheinlich einen an einem Körperglied getragenen Schmuck. »Armspangen« ist im Kontext plausibel; die ebenfalls mögliche Deutung »Fußspangen« wird in einer Fußnote bewahrt.
- source_word: צָמִיד
  choice: Armbänder
  rationale: צָמִיד bezeichnet hier einen um Arm oder Handgelenk getragenen Schmuck; »Armbänder« ist verständlich und unterscheidet den Gegenstand sprachlich von אֶצְעָדָה.
- source_word: טַבַּעַת
  choice: Ringe
  rationale: Das Wort bezeichnet einen Ring, kann aber auch einen Siegelring meinen. Da der Text die Siegelfunktion nicht ausdrücklich festlegt, ist »Ringe« die genauere, nicht überbestimmte Wiedergabe.
- source_word: עָגִיל
  choice: Ohrringe
  rationale: In einer Schmuckliste ist »Ohrringe« die naheliegende Bedeutung und grenzt den Ausdruck von טַבַּעַת ab.
- source_word: כוּמָז
  choice: Schmuckanhänger
  rationale: Die genaue Art dieses Schmuckstücks ist unsicher. »Schmuckanhänger« ist eine vorsichtige, lesbare Wiedergabe; weitere Möglichkeiten werden in der Fußnote genannt.
- source_word: לְכַפֵּר
  choice: um … Sühne zu erwirken
  rationale: כפר trägt hier zusammen mit der Opfergabe und »vor Jahwe« kultisch-theologisches Gewicht. »Sühne erwirken« bewahrt dieses, ohne den genauen Vorgang näher zu bestimmen.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: für uns
  rationale: Wörtlich steht »für unsere Leben/Personen«. Im Kontext bezeichnet נֶפֶשׁ die Menschen selbst; »für uns« ist idiomatisch und vermeidet eine unangebrachte Leib-Seele-Aufteilung.
theological_decisions:
- issue: Bedeutung der Gabe im Verhältnis zu כפר
  choice: Die Gabe wird ausdrücklich mit dem Erwirken von Sühne für die Männer vor Jahwe verbunden.
  alternative: Die Gabe könnte als bloßes Dankopfer oder als Mittel zur allgemeinen Gefahrenabwehr verstanden werden.
  rationale: Die Verbindung von קָרְבָּן, כפר und »vor Jahwe« verlangt eine Wiedergabe mit Sühnesprache. Der Text legt jedoch nicht fest, auf welche Weise die Gabe Sühne bewirkt; diese Spannung bleibt offen.
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: jeder Mann
  alternative: jeder / jeder Einzelne
  rationale: Im unmittelbaren Zusammenhang sind männliche Kriegsteilnehmer beziehungsweise Heerführer gemeint. Die ausdrücklich männliche Referenz wird daher beibehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Darbringen«, »Opfergabe« und »Sühne erwirken« erhalten den kultischen Charakter, ohne altertümliche Satzformen oder eine über den hebräischen Text hinausgehende Erklärung des Sühnevorgangs. Gedankenstriche gliedern die Schmuckliste lesefreundlich.
