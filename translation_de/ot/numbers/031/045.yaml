lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: und … Esel
  rationale: חֲמֹרִים bezeichnet gewöhnlich Esel im Plural; das Präfix וַ wird entsprechend der Aufzählungsstruktur mit „und“ wiedergegeben. Im Deutschen ist bei einer Mengenangabe kein Artikel nötig.
- source_word: שְׁלֹשִׁים אֶלֶף
  choice: '30.000'
  rationale: Die hebräische Kardinalzahl bedeutet „dreißigtausend“. In einer Bestandsaufzählung ist die Ziffernschreibung natürlich und klar.
- source_word: וַ/חֲמֵשׁ מֵאוֹת
  choice: '500'
  rationale: Die additive Zahlenverbindung ergibt zusammen mit 30.000 die Gesamtzahl 30.500. Im modernen Deutschen wird diese Gesamtzahl idiomatisch als eine Zahl geschrieben; das innere וַ muss daher nicht gesondert als „und“ erscheinen.
