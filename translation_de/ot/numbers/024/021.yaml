base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: de
  text: 'Dann sah er die Keniter. Er trug seinen Spruch[a] vor und sagte:


    »Fest ist dein Wohnsitz,

    und du setzt dein Nest in den Felsen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Orakelspruch“. Das hebräische Wort kann einen Spruch, ein Spottlied oder eine prophetische Rede bezeichnen; hier ist Bileams poetischer Orakelspruch gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und dein Nest ist im Felsen gesetzt.“ Die hebräische Form wird unterschiedlich als aktive poetische Aussage oder als statische Beschreibung verstanden.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: die Keniter
  rationale: Der hebräische Singular mit Artikel bezeichnet hier kollektiv das Volk der Keniter. Im natürlichen modernen Deutsch gibt der Plural diesen kollektiven Bezug klar wieder.
- source_word: מְשָׁלוֹ
  choice: seinen Spruch
  rationale: מָשָׁל bezeichnet hier Bileams gewichtige poetisch-prophetische Rede. „Spruch“ bewahrt die poetische Form und bleibt weiter als das modern oft eng verstandene „Sprichwort“.
- source_word: אֵיתָן
  choice: fest
  rationale: Das Adjektiv drückt Festigkeit, Beständigkeit und Sicherheit aus. „Fest“ passt prägnant zum geschützten Wohnsitz im Felsen und lässt diese Bedeutungsbreite bestehen.
- source_word: מוֹשָׁבֶךָ
  choice: dein Wohnsitz
  rationale: מוֹשָׁב bezeichnet den Ort des Wohnens oder der Ansiedlung. „Wohnsitz“ ist gegenwärtig, verständlich und im poetischen Zusammenhang angemessen.
- source_word: וְשִׂים
  choice: ist … gesetzt
  rationale: Die Form lässt sich formal als Aufforderung „setze“ lesen, wird im poetischen Parallelismus jedoch vielfach als Beschreibung des sicher gelegenen Nestes verstanden. Die Hauptfassung folgt der beschreibenden Lesart; die formnähere Alternative steht in der Fußnote.
- source_word: בַּסֶּלַע
  choice: in den Felsen
  rationale: סֶלַע kann Fels, Felsklippe oder Felsmassiv bezeichnen. Der deutsche Ausdruck bewahrt das Bild eines im Fels geschützten Nestes.
- source_word: קִנֶּךָ
  choice: dein Nest
  rationale: Die wörtliche Vogelmetapher wird beibehalten und nicht zu einem bloßen „Zufluchtsort“ verflacht.
theological_decisions:
- issue: Prophetischer Charakter von מָשָׁל
  choice: Spruch im Haupttext, „Orakelspruch“ als Fußnotenalternative
  alternative: Orakel/Orakelspruch unmittelbar im Haupttext
  rationale: Der Kontext ist prophetisch, doch das hebräische Wort bezeichnet breiter eine geprägte poetische Äußerung. Die Fassung vermeidet eine unnötige Verengung, ohne den prophetischen Charakter auszublenden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Zeilengestaltung. Der kollektive Volksname wird im Deutschen idiomatisch im Plural wiedergegeben; die Vogelmetapher und die formale Mehrdeutigkeit von וְשִׂים bleiben erhalten.
