  text: וַ/יִּֽחַר אַ֤ף בָּלָק֙ אֶל בִּלְעָ֔ם וַ/יִּסְפֹּ֖ק אֶת כַּפָּ֑י/ו וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם לָ/קֹ֤ב אֹֽיְבַ/י֙ קְרָאתִ֔י/ךָ וְ/הִנֵּה֙ בֵּרַ֣כְתָּ בָרֵ֔ךְ זֶ֖ה שָׁלֹ֥שׁ פְּעָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: de
  text: 'Da entbrannte Balaks Zorn gegen Bileam, und er schlug die Hände zusammen. Balak sagte zu Bileam: »Ich habe dich gerufen, damit du meine Feinde verfluchst. Doch sieh: Du hast sie nun schon dreimal nachdrücklich gesegnet![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen »du hast gesegnet, gesegnet«; diese Verbindung verstärkt die Aussage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: Da entbrannte Balaks Zorn gegen Bileam
  rationale: Die Wendung bewahrt das hebräische Bild des brennenden Zorns und gibt אֶל in seiner feindseligen Ausrichtung mit „gegen“ wieder.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: er schlug die Hände zusammen
  rationale: Die Formulierung beschreibt die zornige Geste, ohne wie „klatschte“ den modernen Beiklang von Beifall nahezulegen.
- source_word: לָקֹב אֹיְבַי קְרָאתִיךָ
  choice: Ich habe dich gerufen, damit du meine Feinde verfluchst
  rationale: Der Zwecksinn des Infinitivs wird im Deutschen durch „damit“ klar und natürlich ausgedrückt; „verfluchen“ ist hier die direkte Entsprechung zu נקב.
- source_word: וְהִנֵּה
  choice: Doch sieh
  rationale: Die Wiedergabe verbindet den im Kontext gegebenen Gegensatz mit dem aufmerksamkeitslenkenden Charakter der Partikel.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: nachdrücklich gesegnet
  rationale: Das finite Verb mit Infinitivus absolutus verstärkt den Vorgang. „Nachdrücklich“ macht diese Emphase sichtbar, ohne eine zusätzliche Handlung oder Absicht einzutragen.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: nun schon dreimal
  rationale: Die Wendung bezeichnet die bis zum gegenwärtigen Zeitpunkt dreimal erfolgte Handlung; „nun schon“ gibt den demonstrativen und vorwurfsvollen Ton idiomatisch wieder.
theological_decisions: []
