source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: de
  text: 'Dann begann er seinen Spruch und sagte:

    »Ausspruch Bileams, des Sohnes Beors,

    Ausspruch des Mannes, dessen Auge geöffnet ist[a]:«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dessen Auge geschlossen ist«. Die hebräische Wendung ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Dann begann er seinen Spruch
  rationale: Die Verbindung נשׂא + מָשָׁל führt idiomatisch eine feierliche poetische Rede ein. »Begann seinen Spruch« ist im Deutschen natürlich und bewahrt den formellen Charakter.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Schlichte Wiedergabe der narrativen Redeeinleitung.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Wort bezeichnet eine feierliche, autoritative Äußerung. »Ausspruch« ist würdig und lässt sich bei beiden Vorkommen konsequent verwenden.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Bileams, des Sohnes Beors
  rationale: Übliche deutsche Schreibung der Eigennamen und natürliche Wiedergabe der Abstammungsangabe.
- source_word: הַגֶּבֶר
  choice: des Mannes
  rationale: Direkte, natürliche Wiedergabe; eine mögliche Nebenbedeutung von Kraft oder Stärke steht hier nicht im Vordergrund.
- source_word: שְׁתֻם הָעָיִן
  choice: dessen Auge geöffnet ist
  rationale: Der unmittelbare Zusammenhang beschreibt Bileam als Empfänger göttlicher Offenbarung und spricht in Vers 16 von enthüllten Augen. Da die schwierige hebräische Wendung auch gegenteilig verstanden wird, bleibt diese Möglichkeit in einer Fußnote erhalten.
theological_decisions:
- issue: Bileams Selbstbeschreibung שְׁתֻם הָעָיִן
  choice: dessen Auge geöffnet ist
  alternative: dessen Auge geschlossen ist
  rationale: Die Wiedergabe mit »geöffnet« passt zum Offenbarungskontext, darf die lexikalische Unsicherheit jedoch nicht verdecken. Deshalb wird die alternative Deutung ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelstruktur und die zweimalige Formel »Ausspruch« bleiben erhalten; die umstrittene Wendung wird im Haupttext kontextbezogen und in der Fußnote offen wiedergegeben.
