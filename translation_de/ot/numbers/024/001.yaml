source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: de
  text: Als Bileam sah, dass es Jahwe gefiel, Israel zu segnen, ging er nicht wie zuvor los, um nach Wahrsagungszeichen zu suchen[a], sondern wandte er sein Gesicht der Wüste zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung lautet wörtlich etwa „Wahrsagungen entgegen“ und kann auch „Wahrsagungszeichen begegnen“ bedeuten. Gemeint ist Bileams frühere Praxis, nach Zeichen für die Wahrsagung zu suchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als Bileam sah
  rationale: „Sah“ bewahrt die hebräische Ausdrucksweise und kann im Zusammenhang zugleich das Erkennen der Lage bezeichnen.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: dass es in den Augen Jahwes gut war
  rationale: Die Formulierung erhält das hebräische Bild; gemeint ist, dass etwas Jahwe gefällt beziehungsweise von ihm gebilligt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: לְבָרֵךְ
  choice: zu segnen
  rationale: Direkte und natürliche Wiedergabe des Infinitivs von ברך.
- source_word: וְלֹא הָלַךְ
  choice: ging er nicht
  rationale: Entspricht der gewöhnlichen Bedeutung von הלך und fügt sich natürlich in die Erzählung ein.
- source_word: כְּפַעַם בְּפַעַם
  choice: wie die früheren Male
  rationale: Die Wendung bezeichnet ein zuvor wiederholt geübtes Vorgehen.
- source_word: לִקְרַאת נְחָשִׁים
  choice: auf Wahrsagungszeichen aus
  rationale: נְחָשִׁים meint hier Zeichen für divinatorische Deutung, nicht Schlangen. Die deutsche Wendung gibt das gezielte Aufsuchen solcher Zeichen idiomatisch wieder.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: richtete sein Gesicht
  rationale: Bewahrt das hebräische Körperbild und drückt eine bewusste Ausrichtung aus.
- source_word: אֶל הַמִּדְבָּר
  choice: zur Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, karges Land; „Wüste“ ist hier eine knappe und verständliche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Art von Bileams früherer Praxis
  choice: Wahrsagungszeichen aufsuchen
  alternative: Wahrsagungen begegnen
  rationale: Der Ausdruck kann formal ein Entgegengehen oder Begegnen bezeichnen; im Zusammenhang geht es um Bileams gezieltes Aufsuchen divinatorischer Zeichen. Die Fußnote hält die formale Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhaften Wendungen „in den Augen Jahwes“ und „richtete sein Gesicht“ bleiben erhalten; die schwer verständliche Wahrsagungsformel wird im Haupttext idiomatisch und in der Fußnote formnäher wiedergegeben.
