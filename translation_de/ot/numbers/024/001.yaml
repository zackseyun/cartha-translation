  verdict: revise
  source_fidelity: 'Der Entwurf gibt den hebräischen Sinn insgesamt zutreffend wieder: Bileam erkennt, dass Jahwe Israel segnen will, unterlässt sein bisheriges Suchen nach divinatorischen Zeichen und wendet sich der Wüste zu. Die Wiedergabe von לִקְרַאת נְחָשִׁים als gezieltes Suchen ist kontextuell gut begründet; die Fußnote soll jedoch die formalere, semantisch nicht ganz eindeutige Wendung verständlicher abbilden.'
  naturalness: „Richtete sein Gesicht zur Wüste“ ist zwar verständlich, klingt im modernen Standarddeutsch aber steif und weniger idiomatisch als „wandte sein Gesicht der Wüste zu“. Auch „wie zuvor“ ist für כְּפַעַם בְּפַעַם flüssiger als „wie die früheren Male“, ohne den wiederholten früheren Vorgang auszuschließen.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Wahrsagungszeichen“ ist als kontextuelle Wiedergabe von נְחָשִׁים vertretbar. Die Fußnote vermeidet eine missverständliche deutsche Formulierung wie „Wahrsagungen entgegenzugehen“ und kennzeichnet die wörtliche Wendung als ungewohnt.
  issues:
