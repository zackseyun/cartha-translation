    issue: Unidiomatische Wiedergabe der Ausrichtungsformel
    rationale: „Richtete sein Gesicht zur Wüste“ ist stark am Hebräischen orientiert, aber im modernen Deutsch weniger natürlich. „Wandte sein Gesicht der Wüste zu“ erhält das Körperbild und liest sich besser.
  - severity: low
    issue: Fußnote formuliert die wörtliche Alternative missverständlich
    rationale: „Um Wahrsagungen entgegenzugehen“ ist im Deutschen keine klare oder natürliche Erklärung. Die hebräische Wendung kann als „Wahrsagungen/Zeichen entgegen“ beschrieben und ihre Deutung als Suchen nach Omen erläutert werden.
