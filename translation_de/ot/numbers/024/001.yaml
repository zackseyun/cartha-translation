revisions:
- from: Als Bileam sah, dass es in den Augen Jahwes gut war, Israel zu segnen, ging er nicht wie die früheren Male auf Wahrsagungszeichen aus[a], sondern richtete sein Gesicht zur Wüste.
  to: Als Bileam sah, dass es Jahwe gefiel, Israel zu segnen, ging er nicht wie zuvor los, um nach Wahrsagungszeichen zu suchen[a], sondern wandte er sein Gesicht der Wüste zu.
  rationale: Die Revision glättet zwei Formulierungen für modernes Standarddeutsch, ohne den hebräischen Sinn zu verändern. „Es Jahwe gefiel“ gibt das Idiom „gut in den Augen Jahwes“ idiomatisch wieder. Die Schlussformel bewahrt das Bild vom Gesicht, und die Fußnote hält die Auslegungsbreite der schwierigen Wendung לִקְרַאת נְחָשִׁים offen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:05:52Z'
