  text: יִֽזַּל מַ֨יִם֙ מִ/דָּ֣לְיָ֔/ו וְ/זַרְע֖/וֹ בְּ/מַ֣יִם רַבִּ֑ים וְ/יָרֹ֤ם מֵֽ/אֲגַג֙ מַלְכּ֔/וֹ וְ/תִנַּשֵּׂ֖א מַלְכֻתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: de
  text: Wasser wird aus seinen Eimern[a] fließen, und seine Saat[b] wird bei reichlich Wasser sein; sein König wird höher sein als Agag, und sein Königtum wird erhöht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „aus seinen Zweigen“, wenn das Wort hier bildlich und nicht in seiner gewöhnlichen Bedeutung „Eimer“ verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: „Seine Saat“ kann auch „seine Nachkommen“ oder „seine Nachkommenschaft“ bedeuten; das Hebräische kann sowohl Nachkommenschaft als auch Fruchtbarkeit anklingen lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: fließt
  rationale: Das Verb bezeichnet das Fließen oder Strömen von Flüssigkeit. „Fließt“ gibt das Bild natürlich wieder, ohne die Art des Fließens unnötig festzulegen.
- source_word: מַיִם
  choice: Wasser
  rationale: Obwohl die hebräische Form pluralisch ist, ist „Wasser“ hier im Deutschen die natürliche Stoffbezeichnung.
- source_word: מִדָּלְיוֹ
  choice: aus seinen Eimern
  rationale: דְּלִי bezeichnet gewöhnlich einen Eimer oder Schöpfeimer. Diese Grundbedeutung passt zum Wasserbild; die vorgeschlagene metaphorische Deutung „Zweige“ wird in einer Fußnote bewahrt.
- source_word: וְזַרְעוֹ
  choice: und seine Saat
  rationale: זֶרַע kann sowohl Saat beziehungsweise Samen als auch Nachkommen bezeichnen. „Saat“ bewahrt im poetischen Zusammenhang das Fruchtbarkeitsbild und lässt den Bezug auf Nachkommenschaft mitschwingen.
- source_word: בְּמַיִם רַבִּים
  choice: in reichlich Wasser
  rationale: Die Wiedergabe folgt der lokalen Bedeutung der Präposition ב und drückt die Fülle des Wassers idiomatisch aus, ohne sie auf „viele Gewässer“ festzulegen.
- source_word: וְיָרֹם
  choice: wird höher sein
  rationale: רוּם bezeichnet Höhe oder Erhöhung. Mit dem vergleichenden מִן ergibt sich natürlich „höher sein als“; zugleich bleibt der Unterschied zum folgenden Verb נשׂא erhalten.
- source_word: מֵאֲגַג
  choice: als Agag
  rationale: מִן ist nach dem Höhenverb komparativ zu verstehen. Agag bleibt entsprechend dem hebräischen Text ein Eigenname beziehungsweise Herrschertitel.
- source_word: מַלְכּוֹ
  choice: sein König
  rationale: מֶלֶךְ bedeutet klar „König“. Die Übersetzung identifiziert diesen König nicht über den Wortlaut hinaus.
- source_word: וְתִנַּשֵּׂא
  choice: wird erhöht werden
  rationale: Die Verbform bezeichnet das Erhoben- oder Erhöhtwerden. Die passive Form bewahrt die Gestalt des hebräischen Ausdrucks.
- source_word: מַלְכֻתוֹ
  choice: sein Königtum
  rationale: מַלְכוּת kann Königsherrschaft, Königtum oder Reich bezeichnen. „Königtum“ passt zum unmittelbar genannten König und bewahrt den abstrakten Aspekt der Herrschaft.
theological_decisions:
- issue: Bedeutung von זַרְעוֹ
  choice: „seine Saat“ mit erklärender Fußnote
  alternative: „seine Nachkommen“ oder „seine Nachkommenschaft“
  rationale: Der hebräische Ausdruck kann Saat/Samen und Nachkommenschaft bezeichnen. Die poetische Verbindung mit reichlich Wasser kann beide Vorstellungen aufrufen; die Übersetzung legt sich daher nicht ausschließlich auf eine fest.
- issue: Identität des Königs und Verhältnis zu Agag
  choice: 'Der Wortlaut bleibt allgemein: „sein König wird höher sein als Agag“'
  alternative: Ausdrückliche Identifizierung mit Saul, David, dem Messias oder einem anderen Herrscher
  rationale: Der Vers nennt den König nicht näher. Eine konkrete historische oder messianische Identifizierung würde über den hebräischen Wortlaut hinausgehen.
- issue: Bedeutungsumfang von מַלְכֻתוֹ
  choice: „sein Königtum“
  alternative: „sein Reich“ oder „seine Königsherrschaft“
  rationale: „Königtum“ lässt offen, ob der Schwerpunkt auf Herrschaft, Königswürde oder Herrschaftsbereich liegt, und vermeidet eine unnötige Konkretisierung.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Parallelität. Das Präsens „fließt“ gibt den hebräischen poetischen Imperfekt natürlich wieder; die folgenden Zukunftsformen markieren die angekündigte königliche Erhöhung. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
