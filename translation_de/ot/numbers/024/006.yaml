source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: de
  text: Wie Bachtäler ziehen sie sich hin, wie Gärten an einem Strom, wie Aloebäume[a], die Jahwe gepflanzt hat, wie Zedern am Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Adlerholzbäume“ beziehungsweise „duftende Aloehölzer“. Das hebräische Wort bezeichnet hier wohl aromatische Bäume, nicht „Zelte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: Bachtäler
  rationale: Das Wort bezeichnet Täler beziehungsweise Wasserläufe, die zeitweise oder dauerhaft Wasser führen können. „Bachtäler“ bewahrt sowohl die Geländeform als auch den Wasserbezug des Bildes.
- source_word: נִטָּיוּ
  choice: ziehen sie sich hin
  rationale: Die Form von נטה beschreibt ein Ausgestreckt- oder Ausgebreitetsein. „Ziehen sie sich hin“ gibt das räumliche Bild im Deutschen natürlich wieder.
- source_word: גַנֹּת
  choice: Gärten
  rationale: Die direkte Wiedergabe erhält das Bild gepflegter Fruchtbarkeit.
- source_word: עֲלֵי נָהָר
  choice: an einem Strom
  rationale: על bezeichnet hier die Lage an oder neben einem Wasserlauf; „Strom“ passt zum größeren נָהָר und zum poetischen Register.
- source_word: אֲהָלִים
  choice: Aloebäume
  rationale: Gemeint sind in diesem poetischen Zusammenhang duftende Bäume beziehungsweise ihr aromatisches Holz, nicht Zelte. Die traditionelle Benennung bleibt im Text, die botanische Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: נָטַע
  choice: gepflanzt hat
  rationale: Das Perfekt bezeichnet Jahwes vollzogene Pflanzung mit gegenwärtig sichtbarem Ergebnis.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲרָזִים
  choice: Zedern
  rationale: Die übliche Entsprechung bewahrt das Bild großer, kräftiger Bäume.
- source_word: עֲלֵי מָיִם
  choice: am Wasser
  rationale: Die idiomatische deutsche Formulierung gibt die Lage an reichlichem Wasser natürlich wieder; der hebräische Plural kann kollektiv verstanden werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. „Jahwe“ wahrt im modernen Deutschen dessen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Poetisch und würdevoll, zugleich in gegenwärtigem Standarddeutsch. Die vier parallelen Vergleiche und das Wasser- und Fruchtbarkeitsmotiv des Hebräischen bleiben erhalten.
