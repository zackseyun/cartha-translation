base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: de
  text: Da stand Bileam auf, ging fort und kehrte an seinen Ort zurück. Auch Balak ging seines Weges.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand ... auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet hier das Aufstehen als Beginn des Aufbruchs; die deutsche Verbklammer wird durch die anschließende Reihung natürlich getrennt.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: וַיֵּלֶךְ
  choice: ging fort
  rationale: הלך bedeutet grundsätzlich „gehen“. „ging fort“ macht in diesem Kontext den Aufbruch deutlich, ohne ein bestimmtes Ziel hinzuzufügen.
- source_word: וַיָּשָׁב
  choice: kehrte ... zurück
  rationale: שׁוב bezeichnet hier zusammen mit der Zielangabe die Rückkehr an einen früheren Ort.
- source_word: לִמְקֹמוֹ
  choice: an seinen Ort
  rationale: מקום heißt wörtlich „Ort“. Diese zurückhaltende Wiedergabe vermeidet die nicht ausdrücklich genannte Deutung „nach Hause“.
- source_word: וְגַם
  choice: Auch
  rationale: Die additive Partikel stellt Balaks anschließenden Aufbruch parallel zu Bileams Handlung; „Auch“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: בָּלָק
  choice: Balak
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: הָלַךְ
  choice: ging
  rationale: Die einfache Vergangenheitsform gibt das Qal-Perfekt in der fortlaufenden Erzählung natürlich wieder.
- source_word: לְדַרְכּוֹ
  choice: seines Weges
  rationale: Die feste deutsche Wendung „seines Weges gehen“ entspricht dem hebräischen Ausdruck mit דרך, ohne ihn unnötig auszudeuten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper narrativer Reihung. Die leicht formelle Wendung „seines Weges“ bewahrt das hebräische Bild und ist im heutigen Deutsch weiterhin gut verständlich.
