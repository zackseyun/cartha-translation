base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: de
  text: 'Denn wenn Kain[a] zum Verbrennen bestimmt ist: Wie lange noch, bis Assur[b] dich gefangen wegführt?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kain bezeichnet hier wahrscheinlich die Keniter und nicht die Einzelperson Kain.
    reason: lexical_alternative
  - marker: b
    text: Assur kann in diesem Zusammenhang das Land beziehungsweise Reich Assyrien oder die assyrische Macht bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Die Wendung wird als erklärende Bedingung verstanden. „Denn wenn“ erhält sowohl den Anschluss an den vorangehenden Spruch als auch die konditionale Kraft, ohne die syntaktische Spannung aufzulösen.
- source_word: יִהְיֶה לְבָעֵר
  choice: zum Verbrennen bestimmt ist
  rationale: Die Verbindung von היה mit לְ und dem Infinitiv bezeichnet hier das bevorstehende Geschick. Die Formulierung bewahrt das Bild des Verbrennens und lässt offen, ob wörtliches Feuer oder bildhafte Vernichtung gemeint ist.
- source_word: קָיִן
  choice: Kain
  rationale: Der Eigenname wird formnah wiedergegeben. Im Zusammenhang bezeichnet er wahrscheinlich kollektiv die Keniter; diese Zuordnung wird in einer Fußnote erläutert.
- source_word: עַד מָה
  choice: Wie lange dauert es dann noch, bis
  rationale: Die zeitliche Frage wird im Deutschen idiomatisch formuliert. „Noch“ bringt den Gedanken der begrenzten verbleibenden Zeit zum Ausdruck, ohne einen genauen Zeitpunkt festzulegen.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Die gebräuchliche deutsche Form des Eigennamens wahrt die Mehrdeutigkeit zwischen Assur als Land beziehungsweise Reich und der assyrischen Macht.
- source_word: תִּשְׁבֶּךָּ
  choice: dich gefangen wegführt
  rationale: Das Verb שׁבה bezeichnet das Gefangennehmen beziehungsweise Wegführen in die Gefangenschaft. Die Übersetzung gibt beide Aspekte knapp und natürlich wieder.
theological_decisions: []
