  variant: modern standard German
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: de
  text: Wenn Balak mir sein Haus voll Silber und Gold gäbe, könnte ich nicht über das Wort Jahwes hinausgehen[a], um aus meinem eigenen Herzen Gutes oder Böses zu tun. Was Jahwe spricht, das werde ich sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über den Mund Jahwes hinausgehen“.'
    reason: Die Fußnote macht das konkrete hebräische Bild sichtbar, das im Haupttext mit „Wort“ idiomatisch wiedergegeben wird.
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: Wenn … gäbe
  rationale: אִם mit dem Imperfekt bezeichnet hier eine hypothetische Bedingung. Der deutsche Konjunktiv II gibt sie natürlich und präzise wieder.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: sein Haus voll Silber und Gold
  rationale: Die Wendung bezeichnet den Inhalt beziehungsweise die Fülle seines Hauses als Silber und Gold; die gewählte Form bewahrt das anschauliche Bild und klingt im Deutschen natürlich.
- source_word: לֹא אוּכַל
  choice: könnte ich nicht
  rationale: Der Konjunktiv entspricht dem hypothetischen Bedingungssatz und bringt die erklärte Unmöglichkeit angemessen zum Ausdruck.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: über das Wort Jahwes hinausgehen
  rationale: Wörtlich steht hier „über den Mund Jahwes hinausgehen“. „Wort“ vermittelt im Haupttext idiomatisch die göttliche Äußerung, während das Bild des Überschreitens erhalten bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: Gutes oder Böses zu tun
  rationale: Die substantivierten Adjektive bewahren die direkte Gegenüberstellung des Hebräischen und dessen moralisches Gewicht.
- source_word: מִלִּבִּי
  choice: aus eigenem Herzen
  rationale: Die Präposition bezeichnet die Quelle oder den eigenen Antrieb. Die Formulierung erhält das hebräische Herz-Motiv und verdeutlicht den Gegensatz zu Jahwes Reden.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ אֲדַבֵּר
  choice: Was Jahwe spricht, das werde ich sprechen
  rationale: Die deutsche Korrelativkonstruktion „Was …, das …“ bewahrt die resumptive Struktur und die Wiederholung desselben Verbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton als Gottes Eigennamen. Die Übersetzung bewahrt diesen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art von Bileams Begrenzung
  choice: Bileam kann nicht eigenmächtig über Jahwes Wort hinausgehen oder Gutes beziehungsweise Böses tun
  alternative: Bileam kann lediglich einen bestimmten Befehl zum Segnen oder Fluchen nicht ändern
  rationale: Die Übersetzung hält sich an die umfassend formulierte Aussage des Verses, ohne daraus weitergehende Lehren über prophetisches Handeln abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Konjunktiv II trägt den hypothetischen Charakter; die parallele Schlussformulierung bewahrt die feierliche Nachdrücklichkeit des Hebräischen.
