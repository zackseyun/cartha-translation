  text: כָּרַ֨ע שָׁכַ֧ב כַּ/אֲרִ֛י וּ/כְ/לָבִ֖יא מִ֣י יְקִימֶ֑/נּוּ מְבָרֲכֶ֣י/ךָ בָר֔וּךְ וְ/אֹרְרֶ֖י/ךָ אָרֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: de
  text: Er kauert nieder, liegt da wie ein Löwe und wie eine Löwin[a] – wer wird ihn aufscheuchen? Wer dich segnet, ist gesegnet, und wer dich verflucht, ist verflucht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und wie ein starker Löwe“. Das hebräische Wort kann einen starken oder ausgewachsenen Löwen bezeichnen; „Löwin“ bewahrt den Unterschied zum vorausgehenden Wort für „Löwe“.'
    reason: lexical_alternative
  - marker: b
    text: Die Segens- und Fluchformel erinnert an 1. Mose 12,3 und 27,29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: er kauert nieder
  rationale: Das Verb bezeichnet ein Sich-Niederbeugen. Zusammen mit שָׁכַב und dem Löwenbild beschreibt es hier am natürlichsten die Haltung eines Tieres, nicht einen Akt der Anbetung oder Unterwerfung.
- source_word: שָׁכַב
  choice: liegt da
  rationale: Das häufige Verb bedeutet „liegen“ oder „sich niederlegen“. „Liegt da“ ergibt mit dem vorausgehenden Verb ein natürliches, anschauliches deutsches Bild.
- source_word: כַּאֲרִי
  choice: wie ein Löwe
  rationale: Die Vergleichspartikel und das gebräuchliche Wort für „Löwe“ werden direkt wiedergegeben.
- source_word: וּכְלָבִיא
  choice: und wie eine Löwin
  rationale: לָבִיא kann einen starken oder ausgewachsenen Löwen bezeichnen und wird auch für eine Löwin gebraucht. „Löwin“ bewahrt im Deutschen die Abwechslung gegenüber אֲרִי, ohne die mögliche Alternative zu verschweigen.
- source_word: מִי יְקִימֶנּוּ
  choice: wer wagt, ihn aufzuschrecken?
  rationale: Der Hifil von קום bedeutet wörtlich, jemanden aufstehen zu lassen. Beim ruhenden Löwen ist „aufschrecken“ kontextgerecht; „wagt“ gibt die rhetorische Drohwirkung idiomatisch wieder, ohne einen zusätzlichen Handelnden einzuführen.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: Wer dich segnet, ist gesegnet
  rationale: Das substantivierte Partizip und das prädikative Adjektiv werden als allgemeingültige Einzelaussage wiedergegeben. Der Singular entspricht zudem formal dem hebräischen בָרוּךְ.
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: und wer dich verflucht, ist verflucht
  rationale: Die genaue Parallelität der Segens- und Fluchformel bleibt erhalten; der deutsche Singular entspricht dem hebräischen prädikativen אָרוּר.
theological_decisions:
- issue: Bezug der Suffixe der zweiten Person in der Segens- und Fluchformel
  choice: Die Anrede bleibt im Singular „dich“ und wird nicht näher bestimmt.
  alternative: Ausdrückliche Deutung auf Israel als Volk oder enger auf Israels König.
  rationale: Der unmittelbare Zusammenhang spricht in poetischem Singular von Jakob beziehungsweise Israel. Die unveränderte Singularform bewahrt den repräsentativ-korporativen Spielraum des Hebräischen.
- issue: Anklang an die patriarchalische Segens- und Fluchformel
  choice: Die Formel wird direkt übersetzt; der mögliche Schriftbezug steht nur in einer Fußnote.
  alternative: Den Bezug auf Abraham oder die Patriarchen erklärend in den Haupttext aufnehmen.
  rationale: Der Wortlaut erinnert deutlich an Genesis 12,3 und 27,29, doch eine Ausdeutung im Haupttext würde mehr festlegen als der Vers selbst.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Rhythmus. Der Gedankenstrich markiert die rhetorische Frage. Die beiden echten Sachhinweise sind den jeweils passenden Stellen zugeordnet; alle Fußnotenmarker erscheinen im Haupttext.
