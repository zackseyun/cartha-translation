  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: de
  text: 'Dann sah er Amalek, erhob seinen Spruch[a] und sagte:


    »Amalek war der Erste der Völker[b],

    doch sein Ende führt zum Untergang.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „sprach sein Orakel“ oder „trug sein Gleichnis vor“; das hebräische Wort kann einen poetischen Spruch, ein Gleichnis, einen Spottvers oder ein Orakel bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „der Erste unter den Völkern“ beziehungsweise „der Vornehmste unter den Völkern“; der hebräische Ausdruck kann zeitlichen Vorrang oder Vorrang im Rang bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich knapp: „doch sein Ende bis zum Untergang“; auch möglich: „doch zuletzt geht er zugrunde“. Der Ausdruck hebt den vollständigen Untergang hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: Dann sah er Amalek
  rationale: Das Narrativ wird fortgeführt; ראה hat hier den schlichten Sinn „sehen“. „Dann“ gibt die Abfolge im modernen Deutsch natürlich wieder.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: erhob seinen Spruch
  rationale: Die traditionelle und zugleich verständliche deutsche Wendung wahrt den gehobenen poetisch-prophetischen Charakter. מָשָׁל kann einen Spruch, ein Gleichnis, Spottlied oder Orakel bezeichnen; eine Fußnote erhält diese Gattungsbreite.
- source_word: רֵאשִׁית גּוֹיִם
  choice: der Erste unter den Völkern
  rationale: רֵאשִׁית kann zeitlichen Vorrang oder höchsten Rang ausdrücken. Die knappe deutsche Form lässt beide Deutungen zu; „Erste“ wird substantiviert großgeschrieben.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der Eigenname wird in der im Deutschen etablierten Form wiedergegeben und bezeichnet im Kontext das entsprechende Volk.
- source_word: וְאַחֲרִיתוֹ
  choice: doch sein Ende
  rationale: אַחֲרִית bezeichnet Ende, Ausgang oder spätere Zukunft. „Doch“ macht den im Kontext angelegten Gegensatz zum ersten Versglied idiomatisch sichtbar.
- source_word: עֲדֵי אֹבֵד
  choice: ist der Untergang
  rationale: Die hebräische Wendung ist knapp und elliptisch. „Ist der Untergang“ bewahrt ihre Endgültigkeit, ohne ein nicht ausdrücklich vorhandenes „ewig“ einzuführen.
theological_decisions:
- issue: Bedeutung von Amaleks Stellung in רֵאשִׁית גּוֹיִם
  choice: Die Mehrdeutigkeit zwischen zeitlichem Vorrang und Vorrang im Rang bleibt erhalten.
  alternative: „Amalek war das früheste der Völker“ oder „Amalek war das führende der Völker“.
  rationale: Der hebräische Ausdruck entscheidet nicht eindeutig zwischen zeitlicher Priorität und Vorrangstellung. Die Übersetzung vermeidet deshalb eine historische oder theologische Festlegung.
- issue: Reichweite von עֲדֵי אֹבֵד
  choice: „sein Ende ist der Untergang“
  alternative: „am Ende wird er für immer zugrunde gehen“
  rationale: Die Aussage völligen Untergangs wird wiedergegeben, ohne „für immer“ als ausdrückliche Zeitangabe in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. „Erhob seinen Spruch“ erhält den feierlichen Ton der Bileam-Sprüche; die Fußnoten erläutern echte lexikalische Mehrdeutigkeiten, ohne sie im Haupttext aufzulösen.
