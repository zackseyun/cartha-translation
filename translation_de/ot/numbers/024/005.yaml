  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: de
  text: Wie schön sind deine Zelte, Jakob, deine Wohnstätten, Israel![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Wie gut“ oder „wie angenehm sind deine Zelte … deine Wohnstätten!“ Der hebräische Ausruf drückt Bewunderung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה טֹּבוּ
  choice: Wie schön
  rationale: Die Verbindung ist ein bewundernder Ausruf, keine Frage. „Schön“ gibt hier die positive, erfreuliche Wirkung des gesehenen Lagers natürlich wieder; das breitere Bedeutungsspektrum von טוֹב wird in der Fußnote offengehalten.
- source_word: אֹהָלֶיךָ
  choice: deine Zelte
  rationale: אֹהֶל bezeichnet hier im Zusammenhang mit Israels Lager gewöhnliche Zelte; eine kultisch gefärbte Wiedergabe wie „Stiftshütten“ wäre irreführend.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Name wird beibehalten und bezeichnet hier poetisch das Volk Israel.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: deine Wohnstätten
  rationale: „Wohnstätten“ wahrt den poetischen Parallelismus zu „Zelte“, ohne beide Ausdrücke gleichzusetzen oder unnötig an das Heiligtum denken zu lassen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name wird beibehalten und steht parallel zu „Jakob“ als Anrede des Volkes.
theological_decisions:
- issue: Ob traditionelle kultische Begriffe wie „Stiftshütten“ verwendet werden sollen
  choice: „Zelte“ und „Wohnstätten“
  alternative: „Zelte“ und „Stiftshütten“
  rationale: Der unmittelbare Zusammenhang beschreibt Israels Lager und seine Behausungen, nicht ausdrücklich das Heiligtum. Die gewählte Formulierung vermeidet daher eine unbegründete kultische Festlegung.
translation_notes:
  register: Poetisch, würdevoll und zugleich in modernem Standarddeutsch verständlich. Die im Hebräischen nicht nötigen Anredepartikeln „o“ werden vermieden; das Ausrufezeichen bewahrt den bewundernden Ton.
