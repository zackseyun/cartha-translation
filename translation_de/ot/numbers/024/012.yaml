  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen zuverlässig wieder: Bileam richtet die Rede an Balak; die rhetorisch bejahend erwartete Frage (הלא) ist mit „Habe ich nicht“ angemessen erfasst; גם als „auch“, מלאכיך als menschliche „Boten“, der Relativsatz sowie die rückblickende Redehandlung mit dem über den Vers hinausweisenden Einleitungsinfinitiv לֵאמֹר sind erhalten.'
  naturalness: '„Bileam sagte zu Balak: »Habe ich nicht auch zu deinen Boten, die du zu mir geschickt hast, gesagt:“ ist modernes, würdiges und gut verständliches Standarddeutsch. Der Doppelpunkt und das offen bleibende Anführungszeichen sind wegen der erst in V. 13 folgenden wörtlichen Rede sachgerecht.'
  terminology: Die Namensformen Bileam und Balak entsprechen dem etablierten deutschen biblischen Gebrauch. „Boten“ trifft den hier kontextuell erforderlichen menschlichen Sinn von מלאך; die Fußnote nennt „Gesandten“ zutreffend als mögliche stilistische Alternative und grenzt den sonst möglichen Engel-Sinn angemessen ein.
