id: NUM.24.12
reference: Numbers 24:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל בָּלָ֑ק הֲ/לֹ֗א גַּ֧ם אֶל מַלְאָכֶ֛י/ךָ אֲשֶׁר שָׁלַ֥חְתָּ אֵלַ֖/י דִּבַּ֥רְתִּי לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: de
  text: 'Bileam sagte zu Balak: »Habe ich nicht auch zu deinen Boten[a], die du zu mir geschickt hast, gesagt[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Gesandten«. Das hebräische Wort kann sowohl menschliche Boten als auch – in anderen Zusammenhängen – Engel bezeichnen; hier sind nach dem Zusammenhang menschliche Boten gemeint.
    reason: lexical_alternative
  - marker: b
    text: Die hier angekündigte wörtliche Rede folgt im nächsten Vers.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die narrative Wayyiqtol-Form von אמר leitet direkte Rede ein; »sagte« ist dafür die natürliche deutsche Entsprechung.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: אֶל בָּלָק
  choice: zu Balak
  rationale: אֶל bezeichnet hier den Adressaten der Rede; »zu Balak« ist im Deutschen idiomatisch.
- source_word: הֲלֹא
  choice: Habe ich nicht
  rationale: Die verneinte Frage erwartet Zustimmung. Das deutsche Perfekt gibt den rückblickenden Bezug in direkter Rede natürlich wieder.
- source_word: גַּם
  choice: auch
  rationale: »Auch« bewahrt die hinzufügende beziehungsweise hervorhebende Funktion von גַּם, ohne sie genauer festzulegen als der hebräische Text.
- source_word: מַלְאָכֶיךָ
  choice: deinen Boten
  rationale: מַלְאָך kann einen menschlichen Boten oder ein himmlisches Wesen bezeichnen; in diesem diplomatischen Zusammenhang sind menschliche Boten gemeint.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: die du zu mir geschickt hast
  rationale: Die Relativkonstruktion wird in natürlichem, genauem Deutsch wiedergegeben.
- source_word: דִּבַּרְתִּי
  choice: gesagt
  rationale: Das Perfekt blickt auf Bileams frühere Mitteilung an die Boten zurück. Im Deutschen verbindet »gesagt« diese Aussage idiomatisch mit dem nachfolgenden Zitat.
- source_word: לֵאמֹר
  choice: Doppelpunkt nach »gesagt«
  rationale: Der hebräische Infinitiv leitet den Inhalt der Rede ein. Da dieser erst im folgenden Vers erscheint, übernimmt im Deutschen der Doppelpunkt diese Funktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der über die Versgrenze hinwegführende Beginn des Zitats bleiben erhalten; deshalb endet der Vers bewusst mit einem Doppelpunkt und ohne schließendes Anführungszeichen.
