  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: de
  text: 'Dann trug er seinen Spruch vor und sagte: »Wehe! Wer bleibt am Leben, wenn Gott dies herbeiführt?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schlusswendung ist schwer zu deuten. Möglich ist auch: »wenn Gott dies festsetzt« oder »wenn Gott dies ins Werk setzt«. Die hebräische Formulierung lässt außerdem abweichende syntaktische Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Dann trug er seinen Spruch vor
  rationale: נשׂא mit מָשָׁל ist eine feste Verbindung für das Vortragen eines poetischen Ausspruchs. »Spruch« wahrt die breite Bedeutung von מָשָׁל im Zusammenhang der prophetischen Reden Bileams, ohne vorschnell auf »Gleichnis« festzulegen.
- source_word: אֹוי
  choice: Wehe!
  rationale: Die Interjektion drückt hier Erschrecken und Klage angesichts des angekündigten Geschehens aus. Das knappe »Wehe!« entspricht der Würde und Eindringlichkeit des Hebräischen.
- source_word: מִי יִחְיֶה
  choice: Wer bleibt am Leben
  rationale: Wörtlich steht »Wer wird leben?«; im Zusammenhang ist das Überleben gemeint. »Bleibt am Leben« gibt diesen Sinn natürlich wieder, ohne ein zusätzliches Modalverb einzuführen.
- source_word: מִשֻּׂמוֹ אֵל
  choice: wenn Gott dies herbeiführt
  rationale: Die stark verkürzte und schwierige Wendung wird temporal verstanden, wobei אֵל Subjekt ist. »Herbeiführt« wahrt den Grundgedanken des Setzens beziehungsweise Bewirkens, ohne die unklare Formulierung übermäßig zu präzisieren.
theological_decisions:
- issue: Deutung der schwierigen Schlusswendung מִשֻּׂמוֹ אֵל
  choice: »wenn Gott dies herbeiführt«; אֵל wird als Subjekt verstanden.
  alternative: Möglich sind etwa »wenn Gott dies festsetzt« oder näher an der hebräischen Form »wenn er dies einsetzt — Gott«; bei anderer syntaktischer Analyse kann die Wendung abweichend verstanden werden.
  rationale: Der hebräische Text ist elliptisch und textlich beziehungsweise syntaktisch schwer zu deuten. Die gewählte Fassung erhält Gottes Handeln als die wahrscheinlichste Aussage, während eine Fußnote die echte Unsicherheit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetisch-prophetische Kürze bleibt erhalten; »Spruch« ist für heutige Leser verständlich und semantisch weiter als »Gleichnis«. Der einzige Fußnotenmarker [a] steht unmittelbar nach dem Satz, auf den sich die textliche Alternative bezieht.
