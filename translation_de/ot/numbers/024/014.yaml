  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: de
  text: 'Und nun: Sieh, ich gehe zu meinem Volk. Komm, ich will dir sagen[a], was dieses Volk deinem Volk[b] in den letzten Tagen[c] antun wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „dir raten“ oder „dich beraten“. Hier besteht der Rat in der folgenden prophetischen Mitteilung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder dem Zusammenhang nach: „gegen dein Volk“. Im Hebräischen steht die allgemeinere Präposition „zu/für“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in kommenden Tagen“. Die hebräische Wendung kann allgemein auf die Zukunft verweisen, behält hier aber ihr prophetisches Gewicht.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus ו und עַתָּה führt Bileams nächste Aussage als zeitlichen und folgernden Übergang ein. „Und nun“ bewahrt beides in natürlichem Deutsch.
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: הִנְנִי hebt die unmittelbar bevorstehende Handlung nachdrücklich hervor. „Sieh, ich“ erhält dieses markierte Signal, ohne das altertümlichere „siehe“ zu verwenden.
- source_word: הוֹלֵךְ לְעַמִּי
  choice: ich gehe zu meinem Volk
  rationale: Das Qal-Partizip bezeichnet hier eine unmittelbar bevorstehende Bewegung. Die Übersetzung bleibt bei der schlichten Zielangabe des Hebräischen und fügt kein ausdrückliches „zurück“ hinzu.
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ ruft Balak zur Aufmerksamkeit auf und leitet die folgende Mitteilung ein. „Komm“ gibt die knappe hebräische Aufforderung idiomatisch wieder.
- source_word: אִיעָצְךָ
  choice: ich will dir sagen
  rationale: Das Verb יעץ bedeutet grundsätzlich „raten, beraten“. Da der folgende Relativsatz den Inhalt als prophetische Mitteilung angibt, ist „dir sagen“ im Deutschen natürlich und kontextgerecht; die engere lexikalische Bedeutung wird in einer Fußnote offengelegt.
- source_word: אֲשֶׁר יַעֲשֶׂה הָעָם הַזֶּה
  choice: was dieses Volk … tun wird
  rationale: Der Relativsatz nennt den Inhalt der angekündigten Mitteilung. „Dieses Volk“ bewahrt den kollektiven Singular von עָם, und das Futur gibt die noch bevorstehende Handlung wieder.
- source_word: לְעַמְּךָ
  choice: deinem Volk
  rationale: Die Präposition ל bezeichnet hier das betroffene Gegenüber. Der deutsche Dativ bleibt formal offen; der Zusammenhang kann eine feindliche Handlung nahelegen, ohne dass „gegen“ in den Haupttext eingefügt wird.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: am Ende der Tage
  rationale: Die feste Wendung verweist auf eine kommende Zeit und kann prophetisches beziehungsweise endzeitliches Gewicht tragen. Die idiomnahe Formulierung bewahrt diese Spannung besser als das allgemeinere „in Zukunft“.
theological_decisions:
- issue: Zeitliche Tragweite von בְּאַחֲרִית הַיָּמִים
  choice: am Ende der Tage
  alternative: in kommenden Tagen / in ferner Zukunft
  rationale: Die Wendung kann allgemein auf eine spätere Zeit zielen, besitzt aber zugleich mögliches prophetisch-endzeitliches Gewicht. Die Übersetzung legt sie weder ausschließlich eschatologisch noch lediglich als unbestimmte Zukunft fest.
- issue: Art der Handlung gegenüber Moab
  choice: deinem Volk … tun wird
  alternative: gegen dein Volk tun wird / deinem Volk antun wird
  rationale: Der Zusammenhang deutet eine feindliche Handlung an, doch die Präposition ל lautet zunächst „zu/für“ und bezeichnet hier den Betroffenen. Der Dativ bewahrt die sprachliche Offenheit und lässt die feindliche Stoßrichtung aus dem Zusammenhang hervorgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Satzführung. „Sieh“ erhält den Nachdruck von הִנְנִי ohne das stärker altertümliche „siehe“. Die bewusst einfache Formulierung „deinem Volk … tun“ bewahrt die Offenheit der hebräischen Präposition; die Fußnoten erläutern die lexikalischen und zeitlichen Alternativen.
