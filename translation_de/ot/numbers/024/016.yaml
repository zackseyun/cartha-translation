source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: de
  text: 'Ausspruch dessen, der die Worte Gottes hört[a] und um die Erkenntnis des Höchsten weiß, der eine Vision des Allmächtigen sieht, niedersinkend und mit enthüllten Augen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Aussprüche Gottes hört“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: Ausspruch dessen
  rationale: Die Wendung leitet einen feierlichen prophetischen Spruch ein. „Ausspruch“ bewahrt das Gewicht des Hebräischen und ist im heutigen Standarddeutsch verständlich.
- source_word: שֹׁמֵעַ
  choice: der … hört
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet den Sprecher durch eine kennzeichnende, fortdauernde Tätigkeit.
- source_word: אִמְרֵי אֵל
  choice: die Worte Gottes
  rationale: Die Konstruktverbindung bezeichnet von Gott gesprochene Worte oder Aussprüche; „Worte Gottes“ ist klar und würdevoll.
- source_word: אֵל
  choice: Gott
  rationale: Der semitische Gottestitel verweist hier auf Gott und wird bedeutungsgemäß übersetzt, nicht als „El“ transkribiert.
- source_word: וְיֹדֵעַ
  choice: und … kennt
  rationale: Das koordinierte Partizip führt die parallele Selbstbeschreibung möglichst eng am Hebräischen fort.
- source_word: דַּעַת עֶלְיוֹן
  choice: die Erkenntnis des Höchsten
  rationale: 'Der Genitiv bleibt bewusst offen: Gemeint sein kann Erkenntnis, die dem Höchsten gehört, ihn betrifft oder von ihm vermittelt wird.'
- source_word: עֶלְיוֹן
  choice: der Höchste
  rationale: Dies ist die etablierte deutsche Wiedergabe des göttlichen Titels und erhält dessen superlativische Aussage.
- source_word: מַחֲזֵה
  choice: eine Vision
  rationale: Das Wort bezeichnet eine visionäre Schau beziehungsweise Offenbarung. Der unbestimmte Artikel klingt im Deutschen natürlich, ohne die Art der Vision näher festzulegen.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Der göttliche Titel wird in seiner herkömmlichen Bedeutungswiedergabe übersetzt.
- source_word: יֶחֱזֶה
  choice: der … sieht
  rationale: Das Imperfekt fügt sich hier als Relativsatz in die poetische Selbstbeschreibung ein.
- source_word: נֹפֵל
  choice: niedersinkend
  rationale: Das Partizip bezeichnet wörtlich ein Fallen oder Niedersinken. Die Übersetzung vermeidet, einen visionären Trancezustand bereits im Haupttext festzuschreiben.
- source_word: וּגְלוּי עֵינָיִם
  choice: doch mit enthüllten Augen
  rationale: „Enthüllte Augen“ bewahrt das konkrete hebräische Bild. „Doch“ gibt den naheliegenden Gegensatz zum Niedersinken wieder, während die wörtlich koordinierende Lesart in der Fußnote genannt wird.
theological_decisions:
- issue: Wiedergabe der Gottestitel אֵל, עֶלְיוֹן und שַׁדַּי
  choice: Gott / der Höchste / der Allmächtige
  alternative: El / Eljon / Schaddai
  rationale: Die Ausdrücke fungieren hier als Gottestitel. Ihre Übersetzung vermittelt ihre Bedeutung im Deutschen, ohne sie als Eigennamen festzulegen.
- issue: Bedeutung von דַּעַת עֶלְיוֹן
  choice: die Erkenntnis des Höchsten
  alternative: Erkenntnis vom Höchsten / Erkenntnis, die vom Höchsten kommt
  rationale: Die knappe Genitivverbindung lässt mehrere Beziehungen zu. Die gewählte Form bewahrt diese theologisch bedeutsame Mehrdeutigkeit, statt Art oder Herkunft der Erkenntnis festzulegen.
- issue: Zustand des Sehers bei נֹפֵל
  choice: niedersinkend
  alternative: in Trance / niedergeworfen
  rationale: Der hebräische Text nennt ein Fallen beziehungsweise Niedersinken, erklärt es aber nicht ausdrücklich als Trance. Eine solche Deutung wird daher nur als Möglichkeit in der Fußnote erwähnt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzstruktur. Die Wiederholungen und kompakten Genitivverbindungen des hebräischen Orakels bleiben weitgehend erhalten; erklärende Deutungen werden nicht in den Haupttext eingetragen.
