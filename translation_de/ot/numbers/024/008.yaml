source:
  edition: WLC
  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: de
  text: Gott führt ihn aus Ägypten; er hat die Hörner eines Wildstiers[a]. Er wird die Völker verschlingen, die seine Gegner sind, ihre Knochen zernagen[b] und seine Pfeile zerschmettern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kraft eines Wildstiers“. Die hebräische Wendung כְּתוֹעֲפֹת רְאֵם ist schwierig; sie kann das Bild der hochragenden Hörner oder allgemeiner die gewaltige Kraft des Tieres bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zerbrechen“ beziehungsweise „bis auf die Knochen entblößen“. Das hebräische Verb יְגָרֵם ist selten; seine genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und seine Pfeile zerschmettert er“. Die Wendung ist in Bedeutung und Satzbeziehung schwierig. Manche verstehen sie im Sinn von: „und er durchbohrt sie mit seinen Pfeilen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Gott
  rationale: Das Substantiv bezeichnet hier Gott als den, der die Befreiung aus Ägypten bewirkt. „Gott“ ist die klare und natürliche deutsche Wiedergabe.
- source_word: מוֹצִיאוֹ
  choice: führt ihn aus
  rationale: Das Partizip mit Suffix hat verbale, anschaulich-gegenwärtige Kraft. „Führt ihn aus“ bewahrt diese poetische Vergegenwärtigung.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Dies ist die übliche deutsche Wiedergabe der Exodusformel.
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: die Hörner eines Wildstiers
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich die hochragenden Hörner oder, davon abgeleitet, die gewaltige Kraft des Wildstiers. Die konkrete Tiermetapher bleibt im Haupttext erhalten; die allgemeinere Deutung als Kraft steht in der Fußnote.
- source_word: לוֹ
  choice: er hat
  rationale: Die Präposition mit Suffix drückt hier Besitz oder Zuordnung aus. Im Deutschen gibt „er hat“ diese Beziehung natürlich wieder, ohne einen zusätzlichen Referenten einzuführen.
- source_word: יֹאכַל
  choice: wird verschlingen
  rationale: Das Verb bedeutet wörtlich „essen“, bezeichnet in der Kriegspoesie aber die vernichtende Überwältigung der Gegner. „Verschlingen“ erhält zugleich das Bild des Fressens.
- source_word: גּוֹיִם צָרָיו
  choice: die Völker, die seine Gegner sind
  rationale: Die Formulierung wahrt sowohl „Völker“ als auch die nähere Bestimmung, dass gerade die ihm feindlichen Völker gemeint sind.
- source_word: וְעַצְמֹתֵיהֶם
  choice: ihre Knochen
  rationale: Direkte Wiedergabe des Substantivs mit dem pluralischen Suffix.
- source_word: יְגָרֵם
  choice: zernagen
  rationale: Das seltene Verb ist in seiner genauen Bedeutung unsicher. „Zernagen“ passt zum vorausgehenden Bild des Verschlingens und zum Objekt „Knochen“; andere mögliche Bedeutungen werden in der Fußnote genannt.
- source_word: וְחִצָּיו יִמְחָץ
  choice: und sie mit seinen Pfeilen zerschmettern
  rationale: „Mit seinen Pfeilen“ gibt die naheliegende instrumentale Beziehung wieder; das im Deutschen erforderliche Objekt „sie“ bezieht sich auf die Gegner. „Zerschmettern“ bewahrt die heftige Bedeutung von מחץ.
theological_decisions:
- issue: Bezug der männlichen Singularformen im Orakel Bileams
  choice: Die Formen „ihn“, „er“ und „seine“ bleiben im Singular stehen, ohne den Bezug näher festzulegen.
  alternative: Man könnte den Bezug ausdrücklich als Israel in korporativem Sinn, als Israels königlichen Repräsentanten oder in späterer Auslegung als messianische Einzelperson bestimmen.
  rationale: Der hebräische Text verwendet Singularformen, während der Zusammenhang sowohl ein kollektiv verstandenes Israel als auch einen repräsentativen Herrscher zulässt. Die Übersetzung bewahrt diese Spannung und legt keine engere dogmatische Deutung fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit kräftigen poetischen Verben. Die martialische Bildsprache und der Wechsel vom vergegenwärtigenden „führt“ zur zukünftigen Aussage „wird …“ bleiben erhalten. Der Singular wird nicht erläuternd aufgelöst.
