  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: die schroffe Aufforderung zur eiligen Abreise, Balaks frühere emphatische Ehrenzusage sowie die kontrastierende Feststellung, dass Jahwe Balaam die Ehre vorenthalten hat. Das Plusquamperfekt bei »Ich hatte gesagt« ist als deutscher Rückblick auf die frühere Zusage angemessen. »hat dir die Ehre verwehrt« trifft מנע ... מן in diesem Kontext präzise.'
