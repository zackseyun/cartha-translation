  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: de
  text: 'Und nun flieh an deinen Ort! Ich hatte gesagt: »Ich werde dich gewiss hoch ehren.« Doch siehe, Jahwe hat dir die Ehre verwehrt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jahwe hat dich von der Ehre ferngehalten« oder »Jahwe hat verhindert, dass du geehrt wirst.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Konjunktion als auch den zeitlich-folgernden Übergang natürlich wieder.
- source_word: בְּרַח
  choice: flieh
  rationale: Der Imperativ bezeichnet eine eilige, nachdrückliche Entfernung und bewahrt Balaks schroffen Ton.
- source_word: לְךָ אֶל־מְקוֹמֶךָ
  choice: an deinen Ort
  rationale: Bewahrt die wörtliche Ortsangabe und legt nicht unnötig auf »nach Hause« fest; das reflexive לְךָ wird im Deutschen nicht eigens ausgedrückt.
- source_word: אָמַרְתִּי
  choice: Ich hatte gesagt
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen natürlich, dass Balak auf seine frühere Zusage zurückblickt.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: Ich werde dich gewiss hoch ehren
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb ist emphatisch; »gewiss« bildet die Bekräftigung ab, »hoch ehren« den intensiven Sinn im Kontext königlicher Anerkennung.
- source_word: וְהִנֵּה
  choice: Doch siehe
  rationale: »Doch« macht den sachlichen Gegensatz deutlich, während »siehe« die hervorhebende und würdige Wirkung von הִנֵּה erhält.
- source_word: מְנָעֲךָ ... מִכָּבוֹד
  choice: hat dir die Ehre verwehrt
  rationale: מנע mit מן bezeichnet hier das Vorenthalten beziehungsweise Fernhalten von der versprochenen Ehre; die deutsche Formulierung ist präzise und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; »Jahwe« bewahrt den persönlichen Namen, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
- issue: Handelnder hinter der verweigerten Ehre
  choice: Jahwe hat dir die Ehre verwehrt
  alternative: Jahwe hat dich von der Ehre ferngehalten
  rationale: Balak schreibt Jahwe unmittelbar die Verhinderung der versprochenen Ehrung zu. Die Übersetzung bewahrt diese Aussage, ohne ihre theologische Spannung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der schroffe Imperativ und die emphatische Zusage bleiben hörbar; »Doch siehe« erhält die markante Gegenüberstellung, ohne unnötig altertümlich zu wirken.
