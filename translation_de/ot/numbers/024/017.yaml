source:
  edition: WLC
  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: de
  text: Ich sehe ihn[a], doch nicht jetzt; ich erblicke ihn, doch nicht nahe. Ein Stern wird aus Jakob hervortreten, und ein Zepter wird sich aus Israel erheben; es wird die Ecken Moabs zerschmettern[b] und alle Söhne Schets niederreißen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde ihn sehen.“ Das hebräische Imperfekt kann hier gegenwärtig-visionär oder zukünftig verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Ecken Moabs“; gemeint sein können Moabs äußerste Bereiche oder bildlich seine Stärke.'
    reason: cultural_note
  - marker: c
    text: „Schet“ kann als Eigenname gelesen werden, möglicherweise „Seth“. Manche deuten den Ausdruck weiter gefasst als poetische Bezeichnung für die Menschheit oder für ein feindliches Volk.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: Ich sehe ihn
  rationale: Das Qal-Imperfekt der 1. Person Singular mit maskulinem Objektsuffix wird im lebendigen prophetischen Präsens wiedergegeben. „Ihn“ bewahrt den im Hebräischen angelegten persönlichen Bezug; eine futurische Wiedergabe bleibt möglich und wird in der Fußnote genannt.
- source_word: אֲשׁוּרֶנּוּ
  choice: ich schaue ihn
  rationale: שׁור bedeutet hier „anschauen, erblicken“. „Schaue“ erhält den gehobenen poetischen Parallelismus zu „sehe“, ohne beide Verben gleich wiederzugeben.
- source_word: קָרוֹב
  choice: nahe
  rationale: Die knappe Wiedergabe bewahrt neben der im Kontext wahrscheinlichen zeitlichen Bedeutung auch die räumliche Nuance des hebräischen Ausdrucks.
- source_word: דָּרַךְ כּוֹכָב
  choice: Ein Stern ist … hervorgetreten
  rationale: דָּרַךְ bezeichnet wörtlich ein Treten oder Voranschreiten. „Hervorgetreten“ ist mit dem Bild eines Sterns im Deutschen verständlich, wahrt die ungewöhnliche Dynamik des Verbs und gibt das prophetische Perfekt als gewiss dargestelltes Geschehen wieder.
- source_word: וְקָם שֵׁבֶט
  choice: und ein Zepter hat sich … erhoben
  rationale: שֵׁבֶט kann Stab, Zepter oder Stamm bedeuten. Im Parallelismus mit dem Stern und angesichts der folgenden Herrschafts- und Siegesaussage ist „Zepter“ die naheliegende königliche Bedeutung.
- source_word: פַּאֲתֵי מוֹאָב
  choice: die Seiten Moabs
  rationale: פֵּאָה bezeichnet Ecke, Rand oder Seite. „Seiten“ ist im modernen Deutschen verständlicher als das wörtlichere „Ecken“, ohne die bildhafte Rede interpretierend auf „Fürsten“ oder „Macht“ festzulegen.
- source_word: וְקַרְקַר
  choice: niederreißen
  rationale: Das seltene Verb ist in seiner genauen Bedeutung unsicher; vorgeschlagen werden unter anderem niederreißen, zerstören und verwüsten. „Niederreißen“ passt zum Zusammenhang und behauptet keine unnötige lexikalische Präzision.
- source_word: כָּל בְּנֵי שֵׁת
  choice: alle Söhne Sets
  rationale: Die Konsonanten lassen sich am unmittelbarsten als der Eigenname Set lesen. Die Genitivform „Sets“ ist im Deutschen natürlich; die mögliche weiter gefasste poetische Deutung wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Messianische Tragweite von Bileams Spruch
  choice: Die königlichen Bilder „Stern“ und „Zepter“ bleiben im Haupttext stehen, ohne den Kommenden ausdrücklich als Messias zu bezeichnen.
  alternative: Den Vers unmittelbar als Messiasprophetie formulieren oder ausschließlich auf einen zeitnahen historischen König beziehen.
  rationale: Der hebräische Text zeichnet eine kommende königliche Gestalt in Bildern, nennt sie aber nicht ausdrücklich Messias. Die Übersetzung wahrt damit sowohl die traditionelle messianische Lesbarkeit als auch den ursprünglichen historischen und poetischen Deutungsspielraum.
- issue: Persönlicher oder symbolischer Bezug
  choice: Am Anfang steht das persönliche Pronomen „ihn“; anschließend bleiben Stern und Zepter als grammatische Bildträger erhalten, sodass „es“ zerschmettert.
  alternative: Durchgehend „er“ verwenden oder alle Aussagen unpersönlich deuten.
  rationale: Die maskulinen Objektsuffixe am Versanfang weisen auf eine Person, während danach die Bildwörter Stern und Zepter als Subjekte erscheinen. Die Wiedergabe glättet diese Spannung nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Parallelstruktur. Die ungewöhnlichen königlichen Bilder und die zeitliche Spannung von prophetischem Sehen und noch ausstehender Erfüllung werden bewahrt. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
