  naturalness: „Ich schaue ihn“ ist im modernen Standarddeutsch ohne Präfix unidiomatisch; „ich erblicke ihn“ ist natürlich und wahrt den gehobenen Parallelismus. „Doch nicht nahe“ ist als knappe prophetisch-poetische Ellipse möglich und bewahrt die räumlich-zeitliche Offenheit von קָרוֹב.
