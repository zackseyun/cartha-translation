source:
  edition: WLC
  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: de
  text: Edom wird zum Besitz werden; auch Seïr wird zum Besitz seiner Feinde[a] werden, während Israel tapfer handelt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet wörtlich „seine Feinde“ und hat ein maskulines Singularsuffix. Umstritten ist, ob es auf Seïr beziehungsweise Edom oder auf den im umgebenden Orakel beschriebenen Herrscher zurückweist. Daher ist auch die Wiedergabe möglich: „Seïr wird zum Besitz seiner Feinde werden.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „handelt mit Stärke“. Die hebräische Wendung bezeichnet machtvolles oder tapferes Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: wird … werden
  rationale: Das Qal-Perfekt mit vorangestelltem וְ steht im prophetischen Zusammenhang für ein zukünftiges Ergebnis. Die Formulierung gibt den Übergang in den neuen Zustand wieder.
- source_word: יְרֵשָׁה
  choice: Besitz
  rationale: Das Substantiv bezeichnet etwas, das in Besitz genommen oder besetzt wird. „Besitz“ bewahrt das nominale Bild und passt zum militärischen Zusammenhang, ohne den stärker familiär geprägten Begriff „Erbe“ einzutragen.
- source_word: שֵׂעִיר
  choice: Seïr
  rationale: Der Ortsname steht parallel zu Edom. Da im Hebräischen an dieser Stelle kein Wort für „Gebirge“ steht, wird nur der Eigenname wiedergegeben.
- source_word: אֹיְבָיו
  choice: seine Feinde
  rationale: Das hebräische Suffix ist maskulin Singular. „Seine“ bewahrt diese Form und lässt den möglichen Rückbezug auf die einzelne Herrschergestalt des umgebenden Orakels offen.
- source_word: וְיִשְׂרָאֵל
  choice: während Israel
  rationale: Das וְ kann schlicht „und“ bedeuten; „während“ gibt den begleitenden Zusammenhang der Aussage im Deutschen natürlich wieder, ohne eine streng zeitliche Abfolge zu behaupten.
- source_word: עֹשֶׂה חָיִל
  choice: seine Stärke beweist
  rationale: Die Wendung bedeutet wörtlich etwa „Stärke/Tüchtigkeit wirken“ und bezeichnet hier machtvolles oder tapferes Handeln. Die gewählte Formulierung ist gegenwärtiges, verständliches Deutsch und bewahrt den militärischen Sinn.
theological_decisions:
- issue: Bezugswort des maskulinen Singularsuffixes in אֹיְבָיו („seine Feinde“)
  choice: Das Suffix wird formal als „seine“ wiedergegeben und kann auf die einzelne Herrschergestalt im Zusammenhang zurückweisen.
  alternative: Man kann es auf Seïr beziehungsweise Edom beziehen und sinngemäß „dessen Feinde“ oder „seine eigenen Feinde“ verstehen.
  rationale: Die hebräische Form ist maskulin Singular, während der nähere Zusammenhang in den Versen 17–19 von einer einzelnen kommenden Herrschergestalt spricht. Die Übersetzung bewahrt diese literarische Verbindung, ohne die Gestalt ausdrücklich messianisch zu bestimmen; die andere syntaktische Deutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Zukunftsform. Die Wiederholung von „zum Besitz werden“ bildet den hebräischen Parallelismus ab; „seine Stärke beweist“ vermeidet eine altertümliche Wendung wie „vollbringt Heldentaten“, ohne die kriegerische Kraft des Ausdrucks abzuschwächen.
