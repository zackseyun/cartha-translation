  terminology: Die Eigennamen Edom und Seïr sowie „Besitz“ sind vertretbar. Die Wiedergabe „seiner Feinde“ bewahrt die grammatische Singularform, ohne den umstrittenen Bezug dogmatisch festzulegen. Die Fußnote soll direkt an dieser Wortgruppe stehen.
