source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: de
  text: Doch Schiffe werden von der Küste Kittims[a] kommen. Sie werden Assur[b] bedrängen und Eber[c] bedrängen; und auch er[d] wird dem Untergang verfallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kittim kann insbesondere Zypern bezeichnen, aber auch allgemeiner westliche Seevölker.
    reason: alternative_reading
  - marker: b
    text: Assur kann auch als „Assyrien“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: Eber kann als Volksbezeichnung, die Hebräer oder Menschen „jenseits“ einer Grenze wie des Euphrat bezeichnen.
    reason: alternative_reading
  - marker: d
    text: Im Hebräischen steht „auch er“. Worauf sich das Pronomen bezieht, ist unklar; manche verstehen es kollektiv als „auch diese Macht“ oder beziehen es auf einen Herrscher, der die Macht Kittims vertritt.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: Schiffe
  rationale: Das Substantiv bezeichnet seegängige Fahrzeuge und wird hier kollektiv gebraucht. „Schiffe“ ist die klare, nicht überpräzisierende Wiedergabe.
- source_word: מִיַּד
  choice: von der Küste
  rationale: Wörtlich „von der Hand/Seite“; in dieser geografischen und maritimen Verbindung bezeichnet die Wendung am ehesten die Küste beziehungsweise den Küstenbereich.
- source_word: כִּתִּים
  choice: Kittim
  rationale: Die Umschrift bewahrt die offene historische Zuordnung, statt den Namen vorschnell mit Zypern oder allgemein mit westlichen Seemächten gleichzusetzen.
- source_word: וְעִנּוּ
  choice: sie werden bedrängen
  rationale: Das Piel von ענה kann bedrängen, unterdrücken oder demütigen bedeuten. „Bedrängen“ gibt feindliche Schädigung wieder, ohne deren genaue Form festzulegen.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: „Assur“ entspricht der im Deutschen etablierten Form des hebräischen Eigennamens und lässt offen, ob Volk, Land oder Macht gemeint ist.
- source_word: עֵבֶר
  choice: Eber
  rationale: Die Beibehaltung des Namens wahrt die umstrittene Referenz, die als Personen-/Volksname, als Hebräer oder als Menschen jenseits einer Grenze verstanden werden kann.
- source_word: וְגַם הוּא
  choice: und auch er
  rationale: Das hebräische Pronomen ist maskulin Singular. Die direkte Wiedergabe erhält die grammatische Form und die Unsicherheit über den Bezug.
- source_word: עֲדֵי אֹבֵד
  choice: wird dem Untergang verfallen
  rationale: Die Formulierung gibt die Bewegung beziehungsweise das Ergebnis „bis/zum Untergang“ in natürlichem Deutsch wieder, ohne ewige Vernichtung ausdrücklich einzutragen.
theological_decisions:
- issue: Historische Identifizierung von Kittim, Assur und Eber sowie Bezug des abschließenden Pronomens
  choice: Die hebräischen Namen bleiben stehen; das abschließende Pronomen wird als maskuliner Singular „er“ wiedergegeben.
  alternative: Kittim als Zypern oder westliche Seemacht, Assur als Assyrien, Eber als Hebräer oder Völker jenseits des Euphrat und „er“ kollektiv als jene Macht beziehungsweise ihr Herrscher deuten.
  rationale: Die prophetischen Referenzen sind historisch umstritten. Der Text legt ihre genaue Identität und den Bezug des Pronomens nicht eindeutig fest; die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wiederholung von „bedrängen“ folgt der hebräischen Satzstruktur. Eigennamen und das singuläre Pronomen bleiben bewusst interpretations offen.
