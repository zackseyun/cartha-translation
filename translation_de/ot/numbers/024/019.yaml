  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: de
  text: Einer aus Jakob wird herrschen[a] und den Überlebenden aus der Stadt vernichten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Einer aus Jakob wird Macht ausüben.“ Das hebräische Verb kann „herrschen“ oder „Macht ausüben“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Den Überlebenden“ kann auch kollektiv im Sinn von „die Übriggebliebenen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Und einer wird … herrschen
  rationale: Die Form wird am wahrscheinlichsten von רדה („herrschen, Macht ausüben“) abgeleitet. Da im Satz kein ausdrückliches Subjekt steht, gibt „einer“ den aus dem Zusammenhang erschlossenen königlichen Herrscher wieder, ohne ihn näher zu bestimmen.
- source_word: מִיַּעֲקֹב
  choice: aus Jakob
  rationale: Die Präposition מן bezeichnet hier Herkunft oder Ursprung; „aus Jakob“ ist im Deutschen natürlich und passt zur prophetisch-poetischen Rede von einem Herrscher, der aus Jakob hervorgeht.
- source_word: וְהֶאֱבִיד
  choice: und … vernichten
  rationale: Der Hifil von אבד bedeutet, jemanden zugrunde zu richten beziehungsweise zu vernichten. „Vernichten“ bewahrt die Stärke und Direktheit des hebräischen Ausdrucks.
- source_word: שָׂרִיד
  choice: den letzten Überlebenden
  rationale: שָׂרִיד bezeichnet einen Übriggebliebenen oder Überlebenden. „Den letzten Überlebenden“ gibt den bestimmten Singular idiomatisch wieder; die mögliche kollektive Bedeutung wird in einer Fußnote kenntlich gemacht.
- source_word: מֵעִיר
  choice: aus der Stadt
  rationale: עִיר bedeutet gewöhnlich „Stadt“. Das Hebräische rechtfertigt hier keine ausdrückliche Präzisierung als befestigte Stadt oder Stadtstaat.
theological_decisions:
- issue: Königliche beziehungsweise messianische Beziehung im Bileam-Orakel
  choice: 'Die Aussage bleibt allgemein königlich formuliert: „einer wird aus Jakob herrschen“.'
  alternative: Den Herrscher ausdrücklich als einen historischen König oder unmittelbar als den Messias bezeichnen.
  rationale: Der Zusammenhang beschreibt eine königliche Gestalt, doch der Vers selbst identifiziert sie nicht ausdrücklich. Die offene Formulierung bewahrt sowohl den historischen als auch den messianisch-prophetischen Deutungshorizont, ohne ihn dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetisch-poetischer Satzführung. „Einer“ wahrt das im Hebräischen unausgesprochene, aus dem Zusammenhang erschlossene Subjekt; die Fußnoten erhalten die lexikalischen und grammatischen Spielräume.
