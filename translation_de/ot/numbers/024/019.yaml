    rationale: שָׂרִיד bezeichnet einen Überlebenden bzw. Übriggebliebenen, enthält aber keine Aussage, dass es sich um den allerletzten handle.
  - severity: low
    issue: Stellung von „aus Jakob“
    rationale: Die gegenwärtige Verbindung „aus Jakob herrschen“ ist im modernen Deutsch etwas holprig. „Einer aus Jakob wird herrschen“ macht die im Hebräischen gemeinte Herkunft des Herrschers idiomatisch deutlich.
  - severity: low
    issue: Fußnote a formuliert „von Jakob aus“ räumlich
    rationale: Die Präposition bezeichnet hier am ehesten Herkunft. „Von Jakob her“ bzw. die Hauptformulierung „einer aus Jakob“ vermeidet eine räumliche Lesart.
