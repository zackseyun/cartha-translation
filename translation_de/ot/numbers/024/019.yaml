- from: Und einer wird aus Jakob herrschen[a] und den letzten Überlebenden aus der Stadt vernichten.[b]
  to: Einer aus Jakob wird herrschen[a] und den Überlebenden aus der Stadt vernichten.[b]
  rationale: Die Revision entfernt die nicht im Ausgangstext enthaltene Steigerung „letzten“, stellt die Herkunftsangabe im Deutschen idiomatisch zu „einer“ und passt die Fußnote daran an. Die knappe, königlich-prophetische Aussage bleibt offen und nimmt keine messianische Identifizierung vor.
