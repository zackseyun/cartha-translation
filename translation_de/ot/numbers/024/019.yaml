  source_fidelity: Die Wiedergabe von רדה mit „herrschen“ und von הֶאֱבִיד mit „vernichten“ ist zutreffend. Das unausgedrückte Subjekt darf angesichts des unmittelbaren Kontextes mit „einer“ wiedergegeben werden. „den letzten Überlebenden“ fügt jedoch „letzten“ hinzu, das im hebräischen שָׂרִיד nicht enthalten ist.
  naturalness: „Und einer wird aus Jakob herrschen“ ist verständlich, aber im modernen Standarddeutsch weniger idiomatisch. „Einer aus Jakob wird herrschen“ ist natürlich und bewahrt die Herkunftsangabe. Die Fußnote sollte die Herkunftsnuance nicht als bloß räumliches Herrschen „von Jakob aus“ formulieren.
  terminology: „Überlebender“ ist eine angemessene Wiedergabe von שָׂרִיד. Der Singular ist im Deutschen beizubehalten; eine mögliche kollektive Bedeutung kann in der Fußnote genannt werden. „Stadt“ gibt עִיר ohne unbegründete Spezifizierung wieder.
