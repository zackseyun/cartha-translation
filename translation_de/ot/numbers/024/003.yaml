  terminology: „Spruch“ für מָשָׁל und „Ausspruch“ für נְאֻם unterscheiden die beiden hebräischen Ausdrücke sinnvoll. Die Namensformen Bileam und Beor sind im deutschen Bibelgebrauch etabliert. „Mann“ für הַגֶּבֶר ist ohne unnötige interpretierende Verstärkung angemessen.
