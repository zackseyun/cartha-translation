source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: de
  text: 'Dann hob er seinen Spruch an und sagte:


    „Ausspruch Bileams, des Sohnes Beors,

    Ausspruch des Mannes mit dem verschlossenen Auge[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem geöffneten Auge“. Aufgrund des Zusammenhangs einer prophetischen Schau und alter Auslegungstraditionen verstehen manche die Wendung so; die hebräische Form legt jedoch unmittelbarer „verschlossen“ oder „geschlossen“ nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Dann hob er seinen Spruch an
  rationale: Die feste Wendung leitet einen feierlichen poetischen Spruch ein. „Einen Spruch anheben“ bewahrt das hebräische Bild und klingt im Deutschen würdig und verständlich.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Schlichte Wiedergabe des gewöhnlichen Erzählverbs אמר; der Übergang zur direkten Rede bleibt klar.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Wort bezeichnet eine feierliche, häufig prophetische Erklärung. „Ausspruch“ erhält den formelhaften Charakter, ohne stärker als der Ausgangstext festzulegen, ob hier ein göttliches Orakel gemeint ist.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Bileams, des Sohnes Beors
  rationale: Die Namen folgen der im Deutschen üblichen biblischen Form; das Abstammungsverhältnis wird natürlich und eindeutig wiedergegeben.
- source_word: הַגֶּבֶר
  choice: des Mannes
  rationale: Im formelhaften Selbstzeugnis ist „Mann“ die natürliche Wiedergabe; eine Erweiterung zu „starker Mann“ wäre hier nicht erforderlich.
- source_word: שְׁתֻם הָעָיִן
  choice: mit dem verschlossenen Auge
  rationale: Die schwierige hebräische Form legt unmittelbar „verschlossen“ oder „geschlossen“ nahe. Die kontextuell und traditionsgeschichtlich verbreitete Deutung „geöffnet“ wird wegen der echten Unsicherheit in einer Fußnote bewahrt.
theological_decisions:
- issue: Deutung der visionären Selbstbeschreibung שְׁתֻם הָעָיִן
  choice: mit dem verschlossenen Auge
  alternative: mit dem geöffneten Auge
  rationale: Die Hauptfassung folgt der unmittelbar naheliegenden Bedeutung der masoretischen Form, statt sie stillschweigend an den Zusammenhang prophetischen Sehens anzugleichen. Da alte Auslegungstraditionen und der Kontext auch „geöffnet“ stützen, wird diese Lesart transparent als Alternative angegeben.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Zeilengliederung. „Spruch anheben“ und das zweimalige „Ausspruch“ erhalten den feierlichen Parallelismus des Hebräischen. Der Fußnotenmarker steht unmittelbar bei der umstrittenen Wendung.
