id: NUM.24.2
reference: Numbers 24:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: de
  text: Da erhob Bileam seine Augen und sah Israel, wie es nach seinen Stämmen lagerte[a]; und der Geist Gottes kam über ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie es Stamm für Stamm lagerte“; auch: „wie es nach seinen Stämmen wohnte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und Gottes Geist war auf ihm“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: erhob ... seine Augen
  rationale: Die geläufige hebräische Wendung wird in würdigem, verständlichem Deutsch bewahrt, statt sie lediglich mit „blickte auf“ wiederzugeben.
- source_word: וַיַּרְא
  choice: sah
  rationale: Die direkte Wiedergabe bezeichnet Bileams Wahrnehmung dessen, was vor ihm lag.
- source_word: שֹׁכֵן
  choice: lagerte
  rationale: Im Zusammenhang der geordneten Wüstenlager Israels ist „lagerte“ natürlicher und genauer als das allgemeinere „wohnte“, ohne militärische Einzelheiten hinzuzufügen.
- source_word: לִשְׁבָטָיו
  choice: nach seinen Stämmen
  rationale: Die Präposition bezeichnet hier die Gliederung beziehungsweise Anordnung Israels nach Stämmen. Das Possessivpronomen richtet sich nach dem kollektiven Eigennamen „Israel“.
- source_word: רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  rationale: Im Zusammenhang des folgenden prophetischen Spruchs bezeichnet die Wendung am ehesten Gottes Geist als Quelle der Befähigung; die Übersetzung fügt keine späteren dogmatischen Einzelbestimmungen hinzu.
- source_word: וַתְּהִי עָלָיו
  choice: kam über ihn
  rationale: Die dynamische deutsche Wendung gibt in diesem prophetischen Zusammenhang das Eintreten der göttlichen Befähigung idiomatisch wieder; die wörtlichere Zustandsaussage bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Deutung von רוּחַ אֱלֹהִים bei Bileams prophetischer Befähigung
  choice: der Geist Gottes
  alternative: Gottes Geist war auf ihm
  rationale: Der unmittelbare Zusammenhang stützt den Bezug auf Gottes prophetisch befähigenden Geist. Die Übersetzung wahrt zugleich durch die Fußnote die grammatisch mögliche, weniger dynamische Wiedergabe und legt keine weitergehende pneumatologische Systematik in den Vers hinein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ausdrücklich genannte Körpermetapher „seine Augen erheben“ bleibt erhalten. Das Semikolon bewahrt den engen Zusammenhang der beiden hebräischen Erzählabschnitte, ohne einen schwer lesbaren deutschen Satz zu erzeugen.
