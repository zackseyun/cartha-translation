source:
  edition: WLC
  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: de
  text: 'Ausspruch[a] dessen, der Gottes Worte hört,


    der die Vision des Allmächtigen schaut,


    der niederfällt[b], mit unverhüllten Augen[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Orakelspruch“. Das hebräische נְאֻם ist eine feierliche Formel für eine prophetische Äußerung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der niedersinkt“ oder „der daliegt“. Die genaue Körperhaltung wird im Hebräischen nicht näher bestimmt.'
    reason: ambiguity
  - marker: c
    text: 'Auch: „mit geöffneten Augen“. Wörtlich steht hier „mit unverhüllten Augen“; das Bild bezeichnet ein Sehen, dem die Verhüllung genommen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Substantiv leitet feierlich eine prophetische Äußerung ein. „Ausspruch“ bewahrt den formelhaften, gehobenen Charakter, ohne die im heutigen Deutsch missverständlichen Nebenbedeutungen von „Orakel“ aufzudrängen.
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: dessen, der Gottes Worte hört
  rationale: Das substantivisch gebrauchte Partizip kennzeichnet den Sprecher als einen Hörenden. „Gottes Worte“ gibt den Konstruktus אִמְרֵי אֵל klar und idiomatisch wieder.
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: der die Vision des Allmächtigen schaut
  rationale: מַחֲזֵה bezeichnet eine visionäre Schau; das verwandte Verb חזה wird mit „schaut“ wiedergegeben, sodass der poetische und offenbarungsbezogene Charakter hörbar bleibt.
- source_word: נֹפֵל
  choice: der niederfällt
  rationale: Das Partizip wird verbal wiedergegeben und lässt offen, ob ein Sturz, ein Niedersinken oder eine liegende beziehungsweise gebeugte Haltung während der Vision gemeint ist.
- source_word: וּגְלוּי עֵינָיִם
  choice: doch mit unverhüllten Augen
  rationale: „Unverhüllt“ bewahrt das konkrete Bild von freigelegten Augen. „Doch“ bringt den naheliegenden Gegensatz zwischen dem Niederfallen und dem dennoch gewährten Sehen zum Ausdruck, ohne die Bildsprache zu glätten.
theological_decisions:
- issue: Wiedergabe des Gottestitels שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Der Ausdruck wird hier als göttlicher Titel verstanden und daher übersetzt statt als Name transkribiert. „Der Allmächtige“ ist die herkömmliche, kontextgerechte Wiedergabe, ohne eine weitergehende dogmatische Deutung festzulegen.
- issue: Art der Offenbarung beim Niederfallen
  choice: Die körperliche Haltung und das unverhüllte Sehen bleiben nebeneinandergestellt
  alternative: Das Niederfallen ausdrücklich als Ekstase, Schlaf oder Anbetung deuten
  rationale: Der hebräische Text benennt weder Ursache noch genaue Art des Niederfallens. Die Übersetzung vermeidet deshalb eine konfessionelle oder psychologische Festlegung.
translation_notes:
  register: Poetisch-feierlicher, aber gegenwärtiger Standardwortschatz. Die parallelen Relativsätze bilden den hebräischen Aufbau nach. „Vision“ und „schaut“ erhalten den visionären Ton; altertümliche Formen wie „der da hört“ werden vermieden.
