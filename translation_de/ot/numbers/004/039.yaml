base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/039.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: de
  text: von dreißig Jahren an aufwärts bis zum Alter von fünfzig Jahren, jeder, der zum Dienst antritt, um die Arbeit am Zelt der Begegnung zu verrichten—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: von dreißig Jahren an aufwärts
  rationale: Die deutsche Altersangabe gibt die hebräische Untergrenze samt וָמַעְלָה eng und verständlich wieder.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: bis zum Alter von fünfzig Jahren
  rationale: Diese Formulierung kennzeichnet die Obergrenze des Altersbereichs klar und natürlich.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: jeder, der zum Dienst antritt
  rationale: בוא bezeichnet hier das Herantreten beziehungsweise Eintreten, während צבא im Zusammenhang des levitischen Ordnungsdienstes nicht primär militärisch zu verstehen ist. Die Wendung bewahrt den Gedanken eines geregelten Dienstantritts.
- source_word: לַעֲבֹדָה
  choice: um die Arbeit … zu verrichten
  rationale: עֲבֹדָה bezeichnet die auszuführende Arbeit beziehungsweise Dienstleistung. Die finale Formulierung macht das Verhältnis zum vorausgehenden Dienstantritt im Deutschen deutlich, ohne beide Ausdrücke gleich wiederzugeben.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: בְּ kann im Kontext des Heiligtums den Tätigkeitsbereich bezeichnen. „Am“ vermeidet die zu enge Aussage, sämtliche Arbeit habe ausschließlich im Inneren des Zeltes stattgefunden; „Zelt der Begegnung“ gibt die traditionelle Sachbezeichnung verständlich wieder.
theological_decisions: []
