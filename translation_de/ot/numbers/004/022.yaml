  text: נָשֹׂ֗א אֶת רֹ֛אשׁ בְּנֵ֥י גֵרְשׁ֖וֹן גַּם הֵ֑ם לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: de
  text: Erfasse auch die Söhne Gerschons[a], nach ihren Vaterhäusern, nach ihren Sippen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Erhebe das Haupt der Söhne Gerschons, auch sie.« Dies ist eine hebräische Wendung für das Erfassen oder Zählen einer Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Erfasse
  rationale: Die Wendung bedeutet wörtlich »den Kopf erheben«, bezeichnet hier aber idiomatisch die Erfassung beziehungsweise Zählung einer Gruppe. »Erfasse« gibt den administrativen Sinn und die Imperativform natürlich wieder.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: die Nachkommen Gerschons
  rationale: בָּנִים kann in genealogischem Zusammenhang über unmittelbare Söhne hinaus die Nachkommenschaft bezeichnen. »Nachkommen« ist im Deutschen hier eindeutiger als »Söhne«, ohne die Abstammungsbeziehung aufzugeben.
- source_word: גַּם הֵם
  choice: auch
  rationale: Die Wörter beziehen die Gerschoniter zusätzlich zu der zuvor genannten Gruppe in die Erfassung ein; »auch« gibt dies knapp und idiomatisch wieder.
- source_word: לְבֵית אֲבֹתָם
  choice: geordnet nach ihren Großfamilien
  rationale: בֵּית אָבוֹת bezeichnet die durch die väterliche Abstammung bestimmte größere Familien- beziehungsweise Ahnenhausstruktur. »Großfamilien« ist für heutige Leser verständlich und unterscheidet diese Ebene von den Sippen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: und Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet im Stammes- und Zählungskontext soziale Verwandtschaftsgruppen. »Sippen« wahrt diese historische Bedeutung besser als das moderne »Familien«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche hebräische Zählungsformel wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich erläutert. »Großfamilien« und »Sippen« unterscheiden die beiden sozialen Gliederungsebenen, ohne altertümlich zu klingen.
