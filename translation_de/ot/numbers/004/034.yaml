  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: de
  text: So musterten Mose und Aaron und die Oberhäupter der Gemeinschaft die Söhne Kehats[a] nach ihren Sippen und nach ihren Vaterhäusern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Söhne des Kehatiters“; gemeint ist die von Kehat abstammende Sippengruppe.
    reason: lexical_alternative
  - marker: b
    text: „Vaterhäuser“ ist ein traditioneller israelitischer Verwandtschaftsbegriff für abstammungsbezogene Haushalts- oder Familienverbände.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: musterten
  rationale: Im Zusammenhang von Numeri 4 bezeichnet פקד das Zählen und dienstbezogene Erfassen der Männer. „musterten“ gibt beides knapp wieder, ohne die in anderen Zusammenhängen mögliche Bedeutung „einsetzen“ anzunehmen.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: die Oberhäupter der Gemeinschaft
  rationale: נְשִׂיאִים bezeichnet anerkannte leitende Repräsentanten; „Oberhäupter“ passt zum Stammes- und Sippenkontext. „Gemeinschaft“ gibt עֵדָה in natürlichem modernem Deutsch wieder.
- source_word: בְּנֵי הַקְּהָתִי
  choice: die Söhne der Kehatiter
  rationale: Die Formulierung bewahrt die ausdrückliche verwandtschaftliche Redeweise mit בְּנֵי. Gemeint ist die von Kehat abstammende Gruppe.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier eine genealogische Untergliederung; „Sippe“ unterscheidet diese Ebene von den Vaterhäusern.
- source_word: וּלְבֵית אֲבֹתָם
  choice: und ihren Vaterhäusern
  rationale: „Vaterhäuser“ bewahrt den israelitischen Fachausdruck בֵית אָבוֹת und dessen patriarchal-genealogische Struktur.
