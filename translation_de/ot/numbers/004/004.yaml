translation:
  language: de
  text: Dies ist der Dienst der Söhne Kehats im Zelt der Begegnung bezüglich der hochheiligen Gegenstände[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich eine hebräische Steigerungsform, etwa: „Heiliges der Heiligkeiten“. Im Zusammenhang sind wahrscheinlich die hochheiligen Gegenstände gemeint. Die Wendung kann jedoch auch „das Allerheiligste“, den innersten Bereich des Heiligtums, bezeichnen.'
    reason: Bewahrt die Mehrdeutigkeit des Bezugs von קֹדֶשׁ הַקֳּדָשִׁים, während der Haupttext den kontextuell wahrscheinlichen Bezug auf die Gegenstände verständlich wiedergibt.
lexical_decisions:
- source_word: זֹאת
  choice: Dies ist
  rationale: Das feminine Demonstrativpronomen eröffnet den Nominalsatz; im Deutschen wird die im Hebräischen fehlende Kopula natürlich ergänzt.
- source_word: עֲבֹדַת
  choice: der Dienst
  rationale: Das Wort bezeichnet hier die zugewiesene kultische Aufgabe. „Dienst“ bewahrt den sakralen und geordneten Charakter.
- source_word: בְּנֵי קְהָת
  choice: der Söhne Kehats
  rationale: Die hebräische Verwandtschaftsbezeichnung wird formal bewahrt; im Kontext sind Kehats Nachkommen beziehungsweise die Kehatiter gemeint.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: „Zelt der Begegnung“ ist eine quellennah verständliche Wiedergabe. Das deutsche „am“ bezeichnet hier den Bereich, in dem der Dienst ausgeübt wird, ohne ihn unnötig auf das Zeltinnere zu beschränken.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: das Hochheilige
  rationale: 'Die substantivierte Form bewahrt die Mehrdeutigkeit der hebräischen Steigerungsform: Gemeint sein können die hochheiligen Gegenstände, während sprachlich auch das Allerheiligste als Raum anklingt.'
theological_decisions:
- issue: Bezug von קֹדֶשׁ הַקֳּדָשִׁים
  choice: Im Haupttext mehrdeutig als „das Hochheilige“, im Kontext vor allem auf die hochheiligen Gegenstände bezogen
  alternative: „das Allerheiligste“ als Bezeichnung des innersten Heiligtums
  rationale: Der folgende Abschnitt behandelt die heiligen Einrichtungsgegenstände, welche die Kehatiter zu tragen hatten. Die knappe hebräische Wendung legt den Bezug jedoch nicht ausdrücklich durch eine Präposition fest; deshalb wird die räumliche Lesart nicht aus dem Haupttext ausgeschlossen und in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt knapp wie der hebräische Nominalsatz; „Hochheilige“ ist verständlich und erhält die sachliche Mehrdeutigkeit, die eine stärker erklärende Haupttextfassung beseitigen würde.
