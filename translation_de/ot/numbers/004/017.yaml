  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: de
  text: 'Da sprach Jahwe[a] zu Mose und zu Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der persönliche Name Gottes; hier mit „Jahwe“ wiedergegeben.'
    reason: Erläuterung der Wiedergabe des Gottesnamens
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da sprach“ gibt die Abfolge natürlich wieder und bewahrt den feierlichen Sprachgestus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und zu Aaron
  rationale: Die Wiederholung der Präposition אֶל wird beibehalten, sodass beide ausdrücklich als unmittelbare Adressaten erscheinen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel für die folgende direkte Rede wird im natürlichen modernen Deutsch durch einen Doppelpunkt ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. „Jahwe“ bewahrt diesen als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die hebräische Redeeinleitung wird idiomatisch durch einen Doppelpunkt wiedergegeben; die wiederholte Präposition vor beiden Namen bleibt erhalten.
