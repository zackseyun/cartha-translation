  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: de
  text: Das ist der Dienst der Sippen der Söhne Meraris für ihren gesamten Dienst am Zelt der Begegnung, unter der Leitung Itamars[a], des Sohnes des Priesters Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »durch die Hand Itamars«; die Wendung bezeichnet hier Aufsicht oder verantwortliche Leitung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Das ist der Dienst
  rationale: Das feminine Demonstrativpronomen leitet eine zusammenfassende Aussage ein; im Deutschen wird die Kopula ergänzt. »Dienst« gibt עֲבֹדָה im levitisch-kultischen Zusammenhang angemessen wieder.
- source_word: מִשְׁפְּחֹת
  choice: die Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet hier genealogische Untergruppen innerhalb eines Stammes; »Sippen« ist präziser als das modern oft enger verstandene »Familien«.
- source_word: בְּנֵי מְרָרִי
  choice: der Söhne Meraris
  rationale: Die traditionelle genealogische Ausdrucksweise wird bewahrt; der vorangehende Plural »Sippen« macht deutlich, dass die Nachkommenschaft als Gruppe gemeint ist.
- source_word: לְכָל עֲבֹדָתָם
  choice: bei all ihrem Dienst
  rationale: Die Präposition לְ bezeichnet hier den Bezug auf die Gesamtheit der zugewiesenen Aufgaben. Die Wiederholung von »Dienst« spiegelt die Wiederholung von עֲבֹדָה.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: »Zelt der Begegnung« gibt die feste Bezeichnung אֹהֶל מוֹעֵד transparent wieder. »Am« bezeichnet natürlich den gesamten dortigen Dienstbereich, ohne die Tätigkeit auf das Innere des Zeltes zu beschränken.
- source_word: בְּיַד
  choice: unter der Leitung
  rationale: Wörtlich »durch die Hand«; in diesem Verwaltungskontext bezeichnet die Wendung Aufsicht beziehungsweise verantwortliche Leitung.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Itamars, des Sohnes Aarons, des Priesters
  rationale: Die Namen werden in geläufiger deutscher biblischer Form wiedergegeben. Die Apposition hält die grammatische Zuordnung offen genug, während der unmittelbare Anschluss »Aarons, des Priesters« den hebräischen Wortlaut abbildet.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die kultisch-administrative Terminologie bleibt durch »Dienst« erhalten; »Sippen« kennzeichnet die genealogischen Gruppen präzise. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Satz, dessen Leitungsformel erläutert wird.
