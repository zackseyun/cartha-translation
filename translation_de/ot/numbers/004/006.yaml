  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: de
  text: Sie sollen eine Decke aus Leder[a] darüberlegen, darüber ein vollständig blaues Tuch ausbreiten und seine Tragstangen einsetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort תַּחַשׁ (tachasch) ist in seiner Bedeutung unsicher. Es kann die Haut eines bestimmten Tieres bezeichnen; vorgeschlagen wurden unter anderem Ziegen-, Schweinswal- oder Dugonghaut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Dann sollen sie … darüberlegen
  rationale: Die verbundene Perfektform setzt die Verfahrensanweisung fort; „sollen“ gibt diesen instruktiven Sinn natürlich wieder. „Darüberlegen“ bezeichnet die Platzierung der Decke über der Lade.
- source_word: כְּסוּי
  choice: eine Decke
  rationale: Das Substantiv bezeichnet hier eine schützende Abdeckung; „Decke“ ist im Deutschen konkret und im Zusammenhang natürlich.
- source_word: עוֹר תַּחַשׁ
  choice: feines Leder
  rationale: Die Tier- oder Materialbezeichnung תַּחַשׁ ist unsicher. „Feines Leder“ vermeidet eine spekulative zoologische Festlegung; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: וּפָרְשׂוּ
  choice: ausbreiten
  rationale: Das Verb bezeichnet das Ausbreiten eines Tuches oder einer Abdeckung.
- source_word: בֶגֶד
  choice: ein … Tuch
  rationale: Obwohl das Wort häufig ein Kleidungsstück bezeichnet, meint es hier aufgrund seiner Funktion eine Stoffbahn beziehungsweise ein Tuch.
- source_word: כְּלִיל תְּכֵלֶת
  choice: ganz aus blauem Purpur bestehend
  rationale: כְּלִיל betont die Vollständigkeit; תְּכֵלֶת bezeichnet den kostbaren blau bis blauvioletten Farbstoff beziehungsweise damit gefärbten Stoff. „Blauer Purpur“ ist eine verständliche kultische Farbbezeichnung.
- source_word: מִלְמָעְלָה
  choice: darüber
  rationale: Wörtlich bezeichnet der Ausdruck die Lage von oben; in der Schichtfolge ist gemeint, dass das blaue Tuch über die Lederdecke kommt.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: und die Tragstangen einsetzen
  rationale: בַּדִּים sind die Stangen zum Tragen der Lade. „Einsetzen“ gibt die Handlung idiomatisch wieder, ohne ein zusätzliches Objekt einzuführen.
