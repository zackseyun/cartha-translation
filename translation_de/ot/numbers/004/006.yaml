revisions:
- from: Dann sollen sie eine Decke aus feinem Leder[a] darüberlegen, darüber ein ganz aus blauem Purpur bestehendes Tuch ausbreiten und die Tragstangen einsetzen.
  to: Sie sollen eine Decke aus Leder[a] darüberlegen, darüber ein vollständig blaues Tuch ausbreiten und seine Tragstangen einsetzen.
  rationale: Die Revision entfernt die unbelegte Qualitätsbestimmung „fein“, gibt die durchgehende Farbe des Tuchs idiomatisch und quellengetreu wieder und präzisiert die Fußnote, ohne die unsichere Tierbezeichnung festzulegen. Die räumliche Schichtfolge und die Tragstangen bleiben erhalten.
