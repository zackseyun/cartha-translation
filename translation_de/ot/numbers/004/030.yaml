source:
  edition: WLC
  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: de
  text: 'Von dreißig Jahren an bis zum Alter von fünfzig Jahren sollst du sie zählen: jeden, der zum Dienst antritt, um die Arbeit am Zelt der Begegnung zu verrichten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: Von dreißig Jahren an bis zum Alter von fünfzig Jahren
  rationale: Die hebräische Altersformel wird in natürlichem, präzisem Deutsch wiedergegeben; beide Grenzen des Bereichs bleiben ausdrücklich erhalten.
- source_word: תִּפְקְדֵם
  choice: sollst du sie zählen
  rationale: פקד bezeichnet hier das Zählen beziehungsweise Erfassen der für den Dienst geeigneten Leviten. „Zählen“ bewahrt den Zensuskontext, ohne einen unnötig militärischen Ton einzuführen.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: jeden, der zum Dienst antritt
  rationale: Die Wendung bezeichnet jeden, der in den geordneten levitischen Dienst eintritt. „Zum Dienst antreten“ gibt sowohl das Kommen als auch den institutionellen Charakter von צבא idiomatisch wieder.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: um die Arbeit … zu verrichten
  rationale: Die deutsche Formulierung vermeidet eine schwerfällige etymologische Wiederholung und bewahrt den Sinn der Ausführung der zugewiesenen Arbeit.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Bezeichnung gibt מועד als festgesetzte Begegnung wieder und ist im modernen Deutschen verständlich, ohne zusätzliche kultische Deutung einzutragen.
theological_decisions:
- issue: Möglicher militärischer Beiklang von לַצָּבָא
  choice: zum Dienst antritt
  alternative: zum Heer eintritt / zum Dienstaufgebot kommt
  rationale: Im Zusammenhang geht es um den geordneten Arbeitsdienst der Leviten am Heiligtum, nicht um Kampf. Die Übersetzung erhält den Gedanken des organisierten Dienstes, ohne die militärische Nebenbedeutung überzubetonen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular entspricht תִּפְקְדֵם. Keine Fußnoten nötig, da die relevanten Bedeutungsnuancen im Haupttext sachgerecht und ohne Verlust wiedergegeben werden.
