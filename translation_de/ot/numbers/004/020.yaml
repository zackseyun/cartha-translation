source:
  edition: WLC
  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: de
  text: Sie dürfen aber nicht hineingehen, um die heiligen Gegenstände auch nur einen Augenblick[a] anzusehen; sonst werden sie sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auch nur für einen Moment“. Die hebräische Wendung ist schwer zu deuten und kann auch bedeuten: „während die heiligen Gegenstände verhüllt werden“.'
    reason: lexikalische Alternative und Bewahrung der Mehrdeutigkeit
lexical_decisions:
- source_word: וְלֹא
  choice: aber nicht
  rationale: Die Verbindung aus Konjunktion und Verneinung führt die Anweisung als warnendes Verbot fort; „aber nicht“ gibt den Kontrast im Deutschen natürlich wieder.
- source_word: יָבֹאוּ
  choice: sie dürfen nicht hineingehen
  rationale: Das Verb bezeichnet das Hineingehen oder Eintreten. Im Zusammenhang hat die Form verbietende Kraft, die mit „dürfen nicht“ klar ausgedrückt wird.
- source_word: לִרְאוֹת
  choice: um … anzusehen
  rationale: Der Infinitiv bezeichnet hier den Zweck des Hineingehens. „Ansehen“ gibt die gezielte visuelle Wahrnehmung natürlicher wieder als das bloße „sehen“.
- source_word: כְבַלַּע
  choice: auch nur einen Augenblick
  rationale: Die schwierige Wendung kann idiomatisch eine äußerst kurze Zeit bezeichnen. Da auch ein Bezug auf das Verhüllen der heiligen Gegenstände möglich ist, wird diese Alternative in der Fußnote bewahrt.
- source_word: אֶת הַקֹּדֶשׁ
  choice: die heiligen Gegenstände
  rationale: Der grammatisch singularische Ausdruck kann kollektiv gebraucht sein. Im unmittelbaren Zusammenhang sind die zuvor genannten heiligen Geräte und Einrichtungsgegenstände gemeint.
- source_word: וָמֵתוּ
  choice: sonst werden sie sterben
  rationale: Die abschließende Verbform nennt die tödliche Folge einer Übertretung. „Sonst“ macht diese Warnfunktion im modernen Deutschen deutlich.
theological_decisions:
- issue: Bezug von הַקֹּדֶשׁ
  choice: kollektive Bezeichnung der heiligen Gegenstände
  alternative: das Heiligtum oder das Heilige im abstrakten Sinn
  rationale: Der unmittelbare Kontext handelt vom Bedecken und Tragen der Einrichtungsgegenstände des Zeltheiligtums. Die kollektive Wiedergabe entspricht diesem konkreten Bezug, ohne einen weitergehenden theologischen Sinn einzutragen.
- issue: Deutung von כְבַלַּע
  choice: 'zeitlich: auch nur einen Augenblick'
  alternative: während die heiligen Gegenstände verhüllt werden
  rationale: Die hebräische Wendung ist umstritten. Die Hauptübersetzung folgt der idiomatischen zeitlichen Deutung; die kontextuell mögliche Deutung als Hinweis auf das Verhüllen bleibt ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist als klare kultische Warnung verständlich; die echte Mehrdeutigkeit der schwierigen hebräischen Wendung wird nicht im Haupttext aufgelöst, sondern in der Fußnote offengelegt.
