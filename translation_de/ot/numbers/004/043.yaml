  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: de
  text: 'von dreißig Jahren an bis zu fünfzig Jahren: alle, die zum Dienst kommen[a], um die Arbeit im Zelt der Begegnung[b] zu verrichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle, die sich zum geordneten Dienst einfinden“. Das hier verwendete Wort für „Dienst“ kann eine organisierte Dienstordnung, andernorts auch einen militärischen Einsatz, bezeichnen; an dieser Stelle geht es um den Dienst der Leviten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Zelt der Begegnung“. Die hebräische Präposition bedeutet primär „in“, kann je nach Zusammenhang aber auch den weiteren Ort oder Wirkungsbereich bezeichnen.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: von dreißig Jahren an
  rationale: Die hebräische Altersangabe bezeichnet einschließlich das Mindestalter von dreißig Jahren; die deutsche Wendung ist natürlich und präzise.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: bis zu fünfzig Jahren
  rationale: Die Formulierung gibt die obere Altersgrenze knapp und idiomatisch wieder.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: alle, die zum Dienst antreten
  rationale: Das substantivierte Partizip von בוא bezeichnet hier diejenigen, die sich zum zugewiesenen, geordneten Dienst einfinden. „Zum Dienst antreten“ bildet die Verbindung natürlich ab, ohne sie unnötig zu militarisieren.
- source_word: לַעֲבֹדָה
  choice: um die Arbeit … zu verrichten
  rationale: עֲבֹדָה bezeichnet Arbeit beziehungsweise Dienst. Die Wiedergabe als „Arbeit“ hält den Ausdruck von dem vorangehenden צָבָא unterscheidbar.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: בְּ kann in diesem Zusammenhang den Ort beziehungsweise Wirkungsbereich bezeichnen. „Am Zelt“ ist im Deutschen idiomatisch und vermeidet die unbeabsichtigte Behauptung, sämtliche Arbeiten seien ausschließlich im Inneren ausgeführt worden.
