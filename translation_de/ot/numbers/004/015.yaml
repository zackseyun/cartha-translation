reference: Numbers 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: de
  text: Wenn Aaron und seine Söhne das Heilige und alle heiligen Geräte vollständig zugedeckt haben und das Lager aufbricht, sollen danach die Söhne Kehats[a] kommen, um sie zu tragen. Doch sie dürfen das Heilige[b] nicht berühren, sonst sterben sie[c]. Dies ist die Traglast der Söhne Kehats im Zusammenhang mit dem Zelt der Begegnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kehatiter“. Wörtlich: „die Söhne Kehats“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Heiligtum“. Das hebräische „das Heilige“ kann kollektiv die heiligen Gegenstände oder weiter gefasst das Heiligtum bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „und sie sterben“. Der hebräische Wortlaut nennt die Folge unmittelbar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: fertig zugedeckt haben
  rationale: Die Verbindung von כִלָּה mit dem Infinitiv bezeichnet den Abschluss des Zudeckens. Die deutsche Formulierung gibt sowohl die vollendete Handlung als auch den zeitlichen Zusammenhang natürlich wieder.
- source_word: הַקֹּדֶשׁ
  choice: das Heiligtum
  rationale: Beim ersten Vorkommen bezeichnet der Ausdruck im Zusammenhang den heiligen Bereich beziehungsweise dessen zentralen heiligen Bestand. „Heiligtum“ ist eine klare, kultisch passende Wiedergabe.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: alle Geräte des Heiligtums
  rationale: כְּלֵי bezeichnet Geräte, Gegenstände oder Ausstattungsstücke. „Geräte“ ist im Zusammenhang mit dem Heiligtum präzise und im Deutschen geläufig.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: wenn das Lager aufbricht
  rationale: Der Infinitiv mit בּ hat zeitliche Funktion. „Das Lager bricht auf“ ist eine natürliche deutsche Wendung für den Beginn des Weiterzugs.
- source_word: בְנֵי קְהָת
  choice: die Söhne Kehats
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird bewahrt; zugleich erläutert eine Fußnote die im Deutschen mögliche Stammesbezeichnung „Kehatiter“.
- source_word: לָשֵׂאת
  choice: um sie zu tragen
  rationale: Der Infinitiv nennt den Zweck ihres Kommens. Das Pronomen „sie“ nimmt die zuvor genannten zugedeckten heiligen Gegenstände auf.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: Doch sie dürfen die heiligen Dinge nicht berühren
  rationale: Im unmittelbaren Zusammenhang geht es um die heiligen Gegenstände, die nach dem Zudecken getragen werden. „Dürfen nicht“ gibt das Verbot idiomatisch wieder, ohne seinen Ernst abzuschwächen.
- source_word: וָמֵתוּ
  choice: sonst sterben sie
  rationale: Die hebräische Form nennt die Todesfolge direkt. „Sonst sterben sie“ wahrt diese Aussage und macht im Deutschen den Folgezusammenhang deutlich.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: Das ist die Traglast der Söhne Kehats
  rationale: מַשָּׂא kann die konkrete Last oder den zugewiesenen Tragedienst bezeichnen. „Traglast“ bewahrt beide Aspekte möglichst knapp.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: Die Präposition bezeichnet hier plausibel den Dienstbereich beziehungsweise die Zuordnung zum Zelt. „Am“ ist im Deutschen natürlicher als ein rein räumliches „im“, da die Last beim Transport getragen wird.
theological_decisions:
- issue: Bezug von הַקֹּדֶשׁ im Berührungsverbot
  choice: die heiligen Dinge, also die heiligen Gegenstände
  alternative: das Heiligtum
  rationale: Der unmittelbare Kontext handelt von den zugedeckten Geräten, welche die Söhne Kehats tragen sollen. Die kollektive Wiedergabe „die heiligen Dinge“ passt dazu; die breitere Deutung „das Heiligtum“ bleibt in der Fußnote ausdrücklich erhalten.
- issue: Aussagekraft der Todesfolge וָמֵתוּ
  choice: sonst sterben sie
  alternative: und sie sterben
  rationale: Die gewählte Formulierung macht den im Hebräischen angelegten Folgezusammenhang verständlich, während die Fußnote die noch formalere direkte Nebenordnung dokumentiert.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Verfahrensabfolge. Traditionelle kultische Begriffe wie „Heiligtum“ und „Zelt der Begegnung“ bleiben erhalten; schwer verständliche oder unnötig altertümliche Satzformen werden vermieden.
