source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: de
  text: Das sind die Gemusterten aus den Sippen der Söhne Meraris, die Mose und Aaron auf Befehl Jahwes durch Mose musterten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Das sind die Gemusterten
  rationale: Die präsentierende Wendung wird natürlich wiedergegeben; פְקוּדֵי bezeichnet im Zusammenhang der Erfassung die gemusterten beziehungsweise registrierten Männer.
- source_word: מִשְׁפְּחֹת
  choice: aus den Sippen
  rationale: Im Stammes- und Levitenkontext bezeichnet מִשְׁפָּחָה eine größere Verwandtschaftsgruppe; „Sippen“ ist hier präziser als das moderne „Familien“.
- source_word: בְּנֵי מְרָרִי
  choice: der Söhne Meraris
  rationale: Bewahrt die hebräische Verwandtschaftsbezeichnung, statt sie zum Volksgruppennamen „Merariter“ umzubilden.
- source_word: פָּקַד
  choice: musterten
  rationale: Greift die Wortwurzel von פְקוּדֵי auf und passt zur amtlichen Erfassung der dienstfähigen Leviten in Numeri 4.
- source_word: עַל־פִּי יְהוָה
  choice: auf Befehl Jahwes
  rationale: Die wörtliche Wendung „nach dem Mund Jahwes“ ist im Deutschen missverständlich; gemeint ist die Erfassung gemäß Jahwes ausdrücklicher Anweisung.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Der hebräische Instrumentalidiom „durch die Hand Moses“ bezeichnet Mose als Vermittler beziehungsweise Ausführenden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im modernen Standarddeutsch als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Jahwes Befehl und Moses Vermittlung
  choice: „auf Befehl Jahwes durch Mose“
  alternative: „nach dem Ausspruch Jahwes, durch die Hand Moses“
  rationale: 'Die beiden hebräischen Idiome werden verständlich wiedergegeben, ohne ihre theologischen Rollen zu vermischen: Jahwe erteilt den Befehl, Mose vermittelt beziehungsweise vollzieht ihn.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die amtliche Zählung wird mit „mustern“ ausgedrückt; archaische Lehnübersetzungen wie „nach dem Mund“ und „durch die Hand“ werden zugunsten ihres im Kontext klaren Sinnes vermieden.
