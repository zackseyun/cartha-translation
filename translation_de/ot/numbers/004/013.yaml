  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: de
  text: Dann sollen sie die Asche vom Altar entfernen und über ihn ein purpurfarbenes Tuch ausbreiten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Altar reinigen“ beziehungsweise „die fetthaltigen Ascherückstände vom Altar entfernen“. Das hebräische Verb bezeichnet hier das Beseitigen der Asche beziehungsweise der Opferreste vom Altar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: Dann sollen sie die Asche … entfernen
  rationale: Das Piel von דשׁן bezeichnet in diesem kultischen Zusammenhang das Beseitigen der beim Opferdienst entstandenen, teils fetthaltigen Ascherückstände vom Altar. Die Formulierung ist im modernen Deutschen natürlich und gibt den konkreten Vorgang wieder.
- source_word: הַמִּזְבֵּחַ
  choice: vom Altar
  rationale: מִזְבֵּחַ ist die übliche Bezeichnung für den Altar; die Verbindung mit „entfernen“ verlangt im Deutschen hier „vom Altar“.
- source_word: וּפָרְשׂוּ
  choice: und … darüberbreiten
  rationale: פרשׂ bedeutet ausbreiten oder ausspannen. „Darüberbreiten“ gibt das Bedecken des Altars mit dem Tuch knapp und natürlich wieder.
- source_word: עָלָיו
  choice: darüber
  rationale: עַל mit Suffix verweist auf den Altar und bezeichnet hier die Lage des Tuches über ihm.
- source_word: בֶּגֶד
  choice: Tuch
  rationale: Obwohl בֶּגֶד häufig ein Kleidungsstück bezeichnet, ist hier ein Textil zum Abdecken eines Kultgegenstands gemeint. „Tuch“ entspricht dieser Funktion.
- source_word: אַרְגָּמָן
  choice: purpurfarbenes
  rationale: אַרְגָּמָן bezeichnet purpurgefärbtes Material. Zusammen mit בֶּגֶד gibt „purpurfarbenes Tuch“ den Sinn wieder, ohne die genaue Textilart zu überspezifizieren.
