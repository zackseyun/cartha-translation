  text: 'Und die gezählten Männer der Söhne Gerschons, nach ihren Sippen und ihren Vaterhäusern:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: Und die Gemusterten
  rationale: Die Passivbedeutung bezeichnet hier die bei der Zählung beziehungsweise Musterung erfassten Männer; „Gemusterten“ bewahrt den Bezug auf den amtlichen Vorgang und passt zum fortlaufenden Satz.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: der Söhne Gerschons
  rationale: Gibt die genealogische Gruppenbezeichnung wörtlich und im Deutschen verständlich wieder.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet die Untergliederung nach Verwandtschaftsgruppen; „Sippen“ unterscheidet sie von der nächsthöheren Einheit.
- source_word: וּלְבֵית אֲבֹתָם
  choice: und ihren Großfamilien
  rationale: Das wörtliche „Vaterhäuser“ wäre im modernen Deutsch missverständlich; „Großfamilien“ bezeichnet hier die größeren väterlich-genealogischen Verbände.
