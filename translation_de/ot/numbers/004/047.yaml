  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: de
  text: 'vom Alter von dreißig Jahren an bis zum Alter von fünfzig Jahren: jeder, der kommt, um die Arbeit des Dienstes[a] und den Dienst des Lastentragens im Zelt der Begegnung zu verrichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »die Dienstarbeit und die Arbeit des Lastentragens«. Das Hebräische verwendet hier mehrfach Formen derselben Wortwurzel für Arbeit beziehungsweise Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: vom Alter von dreißig Jahren an
  rationale: Die hebräische Altersformel bezeichnet die untere Grenze. Diese Wiedergabe ist im modernen Deutschen natürlich und bewahrt den zeitlichen Ausgangspunkt, ohne das schwerfällige »und aufwärts«.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: bis zum Alter von fünfzig Jahren
  rationale: Die Formulierung gibt die obere Altersgrenze klar wieder; der Zusammenhang beschreibt die eingeschlossene Altersspanne.
- source_word: כָּל הַבָּא
  choice: jeder, der kommt
  rationale: Das substantivierte Partizip wird formal bewahrt und nicht deutend durch »jeder Dienstfähige« oder »jeder Eingeteilte« ersetzt.
- source_word: לַעֲבֹד
  choice: um … zu verrichten
  rationale: Der Infinitiv bezeichnet den Zweck des Kommens. »verrichten« passt zur nachfolgenden Dienstterminologie und unterscheidet das Verb von den wiederholten Nominalformen.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: die Arbeit des Dienstes
  rationale: Die Wiedergabe erhält beide verwandten Nominalbegriffe und damit die auffällige hebräische Konstruktion, bleibt aber im Deutschen verständlich.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: und den Dienst des Lastentragens
  rationale: מַשָּׂא bezeichnet hier eine zu tragende Last beziehungsweise das Lastentragen. Die Formulierung macht die konkrete Transportaufgabe sichtbar.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: Das Präfix ב bezeichnet hier sinnvoll den Ort beziehungsweise Wirkungsbereich des levitischen Dienstes. »Zelt der Begegnung« gibt die kultische Bezeichnung wörtlich und verständlich wieder.
