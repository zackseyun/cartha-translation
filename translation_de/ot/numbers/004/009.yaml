translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Inventarcharakter, bleibt aber durch „damit“ und „dazu“ gut verständlich. Kultische Fachbegriffe werden beibehalten und bei echter lexikalischer Unsicherheit durch Fußnoten erläutert.
