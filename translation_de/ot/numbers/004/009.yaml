  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: de
  text: Dann sollen sie ein Tuch aus blauem Purpur[a] nehmen und damit den Leuchter zur Beleuchtung samt seinen Lampen, seinen Zangen, seinen Feuerpfannen[b] und allen seinen Ölgefäßen bedecken, mit denen sie an ihm Dienst tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ein blaues Tuch“ oder „ein blauviolettes Tuch“. Das hebräische תְּכֵלֶת bezeichnet den charakteristischen blau bis blauviolett gefärbten Stoff, der für die Ausstattung des Heiligtums verwendet wurde.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann je nach Zusammenhang auch „Glutpfannen“ oder „Räucherpfannen“ bezeichnen; hier sind wohl Geräte zur Pflege der Lampen gemeint.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: ein Tuch aus blauem Purpur
  rationale: בֶּגֶד bezeichnet hier aufgrund des Zusammenhangs ein Tuch, nicht ein Kleidungsstück. תְּכֵלֶת ist der charakteristische blaue bis blauviolette Farbstoff beziehungsweise der damit gefärbte Stoff der Heiligtumstextilien; „blauer Purpur“ ist im Deutschen präziser als das allgemeinere „blau“.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: den Leuchter für das Licht
  rationale: מְנוֹרָה ist ein Leuchter beziehungsweise Lampenständer. Die Genitivverbindung הַמָּאוֹר kann funktional verstanden werden; „für das Licht“ bleibt nahe am Wortlaut und bezeichnet seinen Zweck, ohne sie unnötig als bloße Eigenschaft umzuformen.
- source_word: נֵרֹתֶיהָ
  choice: seine Lampen
  rationale: נֵר bezeichnet eine Lampe oder deren Flamme. Hier sind die einzelnen Lampen des Leuchters gemeint; „Lampen“ ist im modernen Deutsch klar und sachgerecht.
- source_word: מַלְקָחֶיהָ
  choice: seine Dochtzangen
  rationale: Das Wort bezeichnet Zangen zum Warten der Lampendochte. „Dochtzangen“ gibt die wahrscheinliche Funktion genauer wieder als das unspezifische „Zangen“, ohne eine schneidende Funktion vorauszusetzen.
- source_word: מַחְתֹּתֶיהָ
  choice: seine Feuerpfannen
  rationale: מַחְתָּה kann eine Feuerpfanne oder ein Räuchergerät bezeichnen. Beim Leuchter geht es wahrscheinlich um ein Gerät zur Aufnahme von Glut oder Rückständen bei der Lampenpflege; „Feuerpfannen“ vermeidet die irreführende Festlegung auf Räucherwerk.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: alle seine Ölgefäße
  rationale: כְּלִים umfasst Gefäße und Geräte; in Verbindung mit שֶׁמֶן sind hier die für das Lampenöl bestimmten Behälter oder Gerätschaften gemeint. „Ölgefäße“ ist knapp und natürlich.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: mit denen sie an ihm Dienst tun
  rationale: שׁרת bezeichnet besonders im Heiligtum kultischen Dienst. „Dienst tun“ bewahrt diesen Sinn; „mit denen“ gibt den instrumentalen Plural בָּהֶם wieder, und „an ihm“ bezieht sich im Deutschen natürlich auf den Leuchter.
