  text: וְ/עַ֣ל מִזְבַּ֣ח הַ/זָּהָ֗ב יִפְרְשׂוּ֙ בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: de
  text: Über den goldenen Altar sollen sie ein blaues Tuch breiten und ihn mit einer Decke aus Tachasch-Leder[a] bedecken; dann sollen sie seine Tragstangen anbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bedeutung von hebräisch tachasch ist ungewiss. Möglich ist auch: „mit einer Decke aus Tachasch-Haut“. Vorgeschlagene Deutungen umfassen unter anderem Dugonghaut und andere widerstandsfähige Häute beziehungsweise Lederarten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: der goldene Altar
  rationale: Die Constructusverbindung bezeichnet den aus Gold bestehenden beziehungsweise mit Gold überzogenen Altar; »der goldene Altar« ist im Deutschen natürlich und präzise.
- source_word: יִפְרְשׂוּ
  choice: sollen sie … breiten
  rationale: פרשׂ bezeichnet das Ausbreiten eines Tuchs über einem Gegenstand; »breiten« gibt die kultische Handlung knapp und würdig wieder.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: ein blaues Tuch
  rationale: בגד ist hier ein Tuch, während תכלת den charakteristischen blauen bis blaupurpurnen Farbstoff bezeichnet. »Blaues Tuch« bleibt verständlich, ohne den genauen antiken Farbton zu überpräzisieren.
- source_word: וְכִסּוּ אֹתוֹ
  choice: und ihn … bedecken
  rationale: Das Suffix bezieht sich auf den maskulinen Altar. Das Perfekt mit ו setzt die Anweisungsfolge fort.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: mit einer Decke aus feinem Leder
  rationale: מכסה ist eine Decke beziehungsweise Schutzhülle und עור bedeutet Haut oder Leder. Da die Tierart תחש nicht sicher identifiziert ist, vermeidet »feines Leder« eine unbegründete zoologische Festlegung; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: dann sollen sie seine Tragstangen einsetzen
  rationale: בדים sind die zum Tragen bestimmten Stangen. »Einsetzen« gibt in diesem Zusammenhang natürlich wieder, dass sie an ihren vorgesehenen Platz gebracht werden.
