  naturalness: „Breiten“ und „bedecken“ sind idiomatisch. „Tragstangen einsetzen“ ist verständlich, kann aber nahelegen, die Stangen würden erst in den Altar eingefügt. „Anbringen“ gibt שׂים in dieser Anweisung natürlicher und weniger spezifisch wieder.
  terminology: „Goldener Altar“ und „blaues Tuch“ sind angemessen. „Feines Leder“ fügt eine Qualitätsbestimmung hinzu, die im Hebräischen nicht steht; die Unsicherheit betrifft die Bedeutung von תחש, nicht eine nachweisbare Feinheit des Leders. Eine transparente Wiedergabe als „Tachasch-Leder“ mit Fußnote wahrt die lexikalische Ungewissheit besser. Da עור „Haut/Leder“ bedeutet, ist „Tachasch-Leder“ als vorsichtige Bezeichnung möglich.
