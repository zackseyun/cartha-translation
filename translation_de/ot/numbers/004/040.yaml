  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: de
  text: Die Zahl der unter ihnen Gezählten, nach ihren Sippen und ihren Vaterhäusern, betrug 2.630.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: betrug
  rationale: Das Verb היה dient hier in der Zählungsformel zur Angabe einer Gesamtsumme. Das deutsche Singularverb richtet sich natürlich nach »die Zahl«.
- source_word: פְּקֻדֵיהֶם
  choice: die Zahl der Gemusterten unter ihnen
  rationale: Die Form bezeichnet die bei der Zählung erfassten beziehungsweise registrierten Personen. »Gemusterte« bewahrt den amtlichen Zählungskontext; »unter ihnen« gibt den Bezug des Suffixes wieder, ohne in diesem Vers ausdrücklich »Männer« hinzuzufügen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftliche Untergliederung. »Sippen« ist im genealogischen Kontext präzise und verständlich.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: »Vaterhäuser« erhält die feste israelitische Bezeichnung für die genealogisch-soziale Gliederung und bleibt im Deutschen transparent.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: '2.630'
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise mit einem Punkt als Tausendertrennzeichen wiedergegeben.
