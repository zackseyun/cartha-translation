base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: de
  text: Dann sollen sie alle Dienstgeräte nehmen, mit denen sie im Heiligtum Dienst tun, sie in ein blaues Tuch legen, sie mit einer Hülle aus feinem Leder[a] bedecken und sie auf die Tragstange[b] legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort תָּחַשׁ (tachash) ist in seiner Bedeutung unsicher. Es kann die Haut eines bestimmten Tieres oder eine besondere Art feinen beziehungsweise widerstandsfähigen Leders bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf den Tragholm“. Im Hebräischen steht „Stange/Holm“ im Singular; das Wort kann im Zusammenhang den Tragbalken oder die Tragevorrichtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Dann sollen sie … nehmen
  rationale: Die mit וְ fortgeführte Verbform beschreibt den nächsten Schritt der angeordneten Handlungsfolge; „Dann sollen sie“ gibt den prozeduralen Zusammenhang in natürlichem Deutsch wieder.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: alle Dienstgeräte
  rationale: כְּלִי bezeichnet hier die Geräte beziehungsweise Gegenstände, die für den kultischen Dienst gebraucht werden. „Dienstgeräte“ ist knapp, verständlich und kontextgerecht.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם בַּקֹּדֶשׁ
  choice: mit denen der Dienst im Heiligtum verrichtet wird
  rationale: שרת bezeichnet den heiligen beziehungsweise kultischen Dienst. Die unpersönliche deutsche Passivform bewahrt den sachlichen Bezug auf die Verwendung der Geräte, ohne das im Hebräischen nicht ausdrücklich genannte Subjekt näher festzulegen. בַּקֹּדֶשׁ wird kontextgemäß als „im Heiligtum“ wiedergegeben.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: ein blaues Tuch
  rationale: בֶּגֶד kann Stoff, Tuch oder Gewand bezeichnen; beim Verpacken der Geräte ist „Tuch“ natürlich. תְּכֵלֶת bezeichnet den charakteristischen blauen beziehungsweise blaupurpurnen Farbstoff; „blau“ ist hier die klare Standardwiedergabe.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: eine Decke aus feinem Leder[a]
  rationale: מִכְסֵה ist eine schützende Bedeckung. Die genaue Bedeutung von תָּחַשׁ ist unsicher; „feines Leder“ vermeidet eine spekulative Tierbestimmung, während die Fußnote die Unsicherheit offenlegt.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: und auf die Tragstange[b] legen
  rationale: מוֹט bezeichnet eine Stange oder einen Tragholm. Die Übersetzung erhält den Singular des Hebräischen und macht zugleich die Funktion im Transportzusammenhang deutlich.
theological_decisions: []
