  text: 'And the numbered men of the clans of the sons of Merari, by their clans, by their fathers'' houses:'
translation:
  language: de
  text: 'Und die gemusterten Männer aus den Sippen der Nachkommen Meraris, nach ihren Sippen, nach ihren Vaterhäusern:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: Und die Gemusterten
  rationale: Die substantivierte Form bewahrt den Bezug auf die bei der Musterung Erfassten; das Geschlecht und Alter der Gemusterten ergeben sich aus dem weiteren Zusammenhang, stehen aber in diesem Vers nicht ausdrücklich.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Bezeichnet die Untergliederungen innerhalb eines Stammes und wird von בֵּית אָבוֹת unterschieden.
- source_word: בְּנֵי מְרָרִי
  choice: Nachkommen Meraris
  rationale: בְּנֵי bezeichnet hier die Angehörigen der von Merari abstammenden Linie, nicht nur seine unmittelbaren Söhne.
- source_word: בֵית אֲבֹתָם
  choice: Großfamilien
  rationale: Die Wendung bezeichnet väterliche Familienverbände; „Großfamilien“ ist im heutigen Deutsch verständlich und unterscheidet die Ebene von den Sippen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Verwaltungsstil. Der Doppelpunkt bleibt erhalten, weil der Vers syntaktisch in Vers 43 weitergeführt wird. Die wiederholte Gliederungsformel „nach ihren Sippen und ihren Großfamilien“ bildet die Struktur des Hebräischen ab.
