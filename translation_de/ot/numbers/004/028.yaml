source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹ֛ת בְּנֵ֥י הַ/גֵּרְשֻׁנִּ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד וּ/מִ֨שְׁמַרְתָּ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: de
  text: Das ist der Dienst der Sippen der Gerschoniter beim Zelt der Begegnung. Ihr Dienstauftrag[a] steht unter der Leitung[b] Itamars, des Sohnes Aarons, des Priesters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Pflicht“ beziehungsweise „die ihnen übertragene Verantwortung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in der Hand“; gemeint ist die Aufsicht oder Autorität Itamars.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Das ist der Dienst
  rationale: Die identifizierende Aussage wird im Deutschen natürlich mit „Das ist“ wiedergegeben; „Dienst“ bezeichnet hier die zugewiesene Arbeit am Heiligtum, ohne spätere kirchliche Amtsvorstellungen einzutragen.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: der Sippen der Gerschoniter
  rationale: „Sippen“ gibt die genealogisch-soziale Größe von מִשְׁפָּחוֹת im Stammeszusammenhang präziser wieder als das enger wirkende „Familien“. „Gerschoniter“ fasst die wörtliche Abstammungsformulierung idiomatisch als Gruppenbezeichnung.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: beim Zelt der Begegnung
  rationale: Die Präposition bezeichnet hier den Tätigkeitsbereich. „Beim“ vermeidet die unnötige Festlegung, sämtliche Arbeiten seien im Inneren des Zeltes ausgeführt worden.
- source_word: וּמִשְׁמַרְתָּם
  choice: Ihr Dienstauftrag
  rationale: מִשְׁמֶרֶת bezeichnet eine übertragene Pflicht beziehungsweise Verantwortung. „Dienstauftrag“ verbindet die Verpflichtung mit dem unmittelbaren Heiligtumsdienst.
- source_word: בְּיַד
  choice: unter der Leitung
  rationale: Die hebräische Wendung lautet wörtlich „in/unter der Hand“ und bezeichnet hier Aufsicht oder Autorität. „Unter der Leitung“ gibt das Idiom in klarem, heutigem Deutsch wieder.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Itamars, des Sohnes Aarons, des Priesters
  rationale: Die Genitivkonstruktion schließt natürlich an „unter der Leitung“ an und bewahrt die Abstammungs- und Priesterangabe des Hebräischen.
theological_decisions: []
