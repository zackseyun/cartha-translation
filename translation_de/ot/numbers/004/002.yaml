base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/002.yaml
  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: de
  text: Ermittelt die Zahl[a] der Söhne Kehats unter den Söhnen Levis, nach ihren Sippen und nach ihren Vaterhäusern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Erhebt das Haupt der Söhne Kehats«; dies ist eine hebräische Wendung für das Zählen beziehungsweise die Ermittlung ihrer Zahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Ermittelt die Zahl
  rationale: Die Wendung bedeutet wörtlich »den Kopf erheben«, bezeichnet in diesem Verwaltungszusammenhang jedoch das Zählen beziehungsweise die Erhebung der Zahl einer Gruppe. »Ermittelt die Zahl« gibt den idiomatischen Sinn natürlich und präzise wieder.
- source_word: בְּנֵי קְהָת
  choice: die Söhne Kehats
  rationale: Die genealogische Ausdrucksweise des Hebräischen bleibt erhalten; gemeint sind Kehats männliche Nachkommen.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: unter den Söhnen Levis
  rationale: מִתּוֹךְ kennzeichnet die Auswahl einer Teilgruppe aus einer größeren Gruppe. »Unter« drückt dieses Verhältnis im Deutschen knapp und idiomatisch aus.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im Stammes- und Zählungskontext gewöhnlich eine Sippe beziehungsweise einen Clan als Gliederungseinheit.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: »Vaterhäuser« bewahrt die israelitische genealogische und administrative Bezeichnung, ohne sie zum allgemeineren »Familien« einzuebnen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogischen Ausdrücke »Söhne Kehats«, »Söhne Levis« und »Vaterhäuser« wurden wegen ihrer Bedeutung für die Gliederung Israels formal nah am Hebräischen wiedergegeben.
