  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: de
  text: 'von dreißig Jahren an aufwärts bis zu fünfzig Jahren: jeder, der zum Dienst[a] antritt, um die Arbeit im Zelt der Begegnung zu verrichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann hier einen geordneten, gemeinschaftlich organisierten Dienst bezeichnen; wörtlich ist auch die militärische Bedeutung „Heer“ oder „Heeresdienst“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: von dreißig Jahren an aufwärts
  rationale: Die deutsche Altersangabe gibt den Ausgangspunkt mit מִן sowie וָמַעְלָה ausdrücklich wieder und bleibt zugleich verständlich.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: bis zu fünfzig Jahren
  rationale: Die Formulierung gibt עַד als obere Grenze der Altersspanne natürlich wieder.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: jeder, der zum Dienst antritt
  rationale: Die Wendung bewahrt den Gedanken des Hinzukommens beziehungsweise Eintretens aus בוא und versteht צָבָא im levitischen Zusammenhang als geordneten Dienst, nicht als Kriegführung.
- source_word: לַעֲבֹדָה
  choice: um die Arbeit … zu verrichten
  rationale: Die Zweckangabe unterscheidet עֲבֹדָה sprachlich vom vorausgehenden צָבָא und vermeidet das kirchlich geprägte Wort „Amt“.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: „Zelt der Begegnung“ bildet die feste hebräische Bezeichnung transparent ab; „am“ bezeichnet hier den gesamten Dienstbereich des Zeltes, ohne ihn unnötig auf dessen Innenraum einzugrenzen.
theological_decisions: []
