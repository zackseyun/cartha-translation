  text: אַל תַּכְרִ֕יתוּ אֶת שֵׁ֖בֶט מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י מִ/תּ֖וֹךְ הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/018.yaml
  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: de
  text: Ihr sollt den Stamm der Sippen der Kehatiter nicht aus der Mitte der Leviten ausrotten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch „abschneiden“ sowie „ausrotten“ oder „vernichten“ bedeuten; „Sippen“ kann auch mit „Familien“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּכְרִיתוּ
  choice: Sorgt dafür, dass … nicht … ausgerottet wird
  rationale: Die Verneinung אַל mit dem Hifil von כרת verbietet, das Ausrotten beziehungsweise Verschwinden der Gruppe zu verursachen. Die deutsche Formulierung gibt den kausativen Sinn natürlich wieder.
- source_word: שֵׁבֶט
  choice: Stamm
  rationale: Im genealogischen Zusammenhang bezeichnet das Wort eine abstammungsmäßig bestimmte Gruppe; „Stamm“ ist die übliche und sachlich passende Wiedergabe.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Der Plural bezeichnet die zugehörigen Großfamilien oder Clans. „Sippen“ unterscheidet diese Einheiten verständlich vom übergeordneten „Stamm“.
- source_word: הַקְּהָתִי
  choice: der Kehatiter
  rationale: Das singularische Gentiliz ist kollektiv gebraucht. Im Deutschen gibt der Plural „Kehatiter“ diese Gruppenbezeichnung natürlich wieder.
- source_word: מִתּוֹךְ הַלְוִיִּם
  choice: aus der Mitte der Leviten
  rationale: Die Wendung bezeichnet die Entfernung aus einer größeren Gemeinschaft und bewahrt das räumlich-soziale Bild des Hebräischen.
theological_decisions:
- issue: Tragweite des Verbots hinsichtlich der Kehatiter
  choice: Das Verbot untersagt, das Aussterben beziehungsweise die Vernichtung der kehatitischen Gruppe unter den Leviten zu verursachen.
  alternative: „Rottet den Stamm … nicht aus“ als direkter formuliertes Verbot.
  rationale: Das Hifil hat kausative Kraft, während der Vers selbst den Mechanismus nicht nennt. Die Formulierung wahrt diese Offenheit; erst der Kontext verbindet die Gefahr mit dem Umgang mit den heiligen Gegenständen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kausative Verbform wird idiomatisch wiedergegeben; „Stamm“ und „Sippen“ bilden die genealogische Hierarchie des Ausgangstextes ab.
