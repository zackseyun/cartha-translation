  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: de
  text: Sie sollen ihn und alle seine Geräte in eine Hülle aus Tachaschhaut[a] legen und ihn auf die Tragstange legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort תַּחַשׁ (tachasch) ist in seiner Bedeutung unsicher. Es kann die Haut eines bestimmten Tieres oder eine Art widerstandsfähiges Leder bezeichnen. Traditionelle Übersetzungen nennen unter anderem Delfin- oder Seekuhhaut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: sie sollen … legen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ setzt die Abfolge der Verfahrensanweisungen fort; im Deutschen gibt „sollen“ den anweisenden Zukunftsbezug natürlich wieder.
- source_word: אֹתָהּ
  choice: ihn
  rationale: Das feminine Singularpronomen verweist auf die im Deutschen maskuline „Leuchte“ beziehungsweise den „Leuchter“ des vorherigen Verses; das Genus wird der deutschen Bezugsform angepasst.
- source_word: כָּל כֵּלֶיהָ
  choice: alle seine Geräte
  rationale: כֵּלִים bezeichnet hier die zum Leuchter gehörenden Gegenstände oder Geräte; „Geräte“ ist breit genug und im Heiligtumskontext verständlich.
- source_word: אֶל מִכְסֵה
  choice: in eine Decke
  rationale: אֶל kann nach נתן das Hineinlegen beziehungsweise Einschlagen in eine schützende Hülle bezeichnen. „In eine Decke legen“ bildet den Vorgang ohne unnötige Ausdeutung ab.
- source_word: עוֹר תַּחַשׁ
  choice: feinem Leder
  rationale: Die genaue Bedeutung von תַּחַשׁ ist unsicher. „Feines Leder“ vermeidet eine spekulative Tierbestimmung und bezeichnet verständlich das Material der schützenden Decke; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: עַל הַמּוֹט
  choice: auf die Tragstange
  rationale: מוֹט bezeichnet eine Stange oder einen Tragbaum. Der Singular des Hebräischen bleibt erhalten, und „Tragstange“ macht die Transportfunktion knapp deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Folge kultischer Arbeitsanweisungen und der hebräische Singular bei „Tragstange“ bleiben erhalten; die lexikalische Unsicherheit bei תַּחַשׁ wird nicht im Haupttext überladen, sondern in der Fußnote transparent gemacht.
