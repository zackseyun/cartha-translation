  - severity: low
    issue: „Decke“ ist als Wiedergabe von מִכְסֶה weniger genau als „Hülle“.
    rationale: Der Ausdruck bezeichnet eine Bedeckung bzw. Schutzhülle; im vorliegenden Verpackungs- und Transportvorgang beschreibt „Hülle“ die Funktion natürlicher.
