reference: Numbers 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: de
  text: Die Aufsicht[a] Eleasars, des Sohnes des Priesters Aaron, umfasst das Öl für das Licht, das wohlriechende Räucherwerk, das regelmäßige Speiseopfer[b] und das Salböl. Ihm obliegt die Aufsicht über die ganze Stiftshütte und alles, was sich darin befindet, über das Heiligtum[c] und seine Geräte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Aufsicht“ kann auch mit „Verantwortung“ oder „Obhut“ wiedergegeben werden; das hebräische Wort bezeichnet eine übertragene Zuständigkeit.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das beständige Speiseopfer“. Gemeint ist das regelmäßig wiederkehrende Opfer.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Heilige“. Die hebräische Formulierung kann den heiligen Bereich beziehungsweise das Heiligtum bezeichnen; die Präposition lässt sich auch örtlicher als „im Heiligtum“ verstehen.'
    reason: ambiguity
  - marker: d
    text: 'Oder: „Gefäße“ beziehungsweise „Ausstattungsstücke“. Das hebräische Wort umfasst verschiedene Geräte und Gegenstände des Heiligtums.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: Aufsicht / obliegt die Aufsicht
  rationale: Das Substantiv bezeichnet hier eine übertragene Aufsichts- und Verantwortungsaufgabe. „Aufsicht“ gibt den administrativen Sinn wieder und lässt sich an beiden Stellen natürlich verwenden.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: das Öl für das Licht
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Fügung und vermeidet die weitergehende Festlegung auf eine bestimmte Lampe oder den Leuchter.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: das wohlriechende Räucherwerk
  rationale: Die Wendung bezeichnet aus aromatischen Stoffen bereitetes Räucherwerk; „wohlriechend“ ist im Deutschen natürlich und trifft die Funktion der Gewürzstoffe.
- source_word: מִנְחַת הַתָּמִיד
  choice: das regelmäßige Speiseopfer
  rationale: מִנְחָה bezeichnet hier das Speiseopfer; תָּמִיד drückt regelmäßige beziehungsweise fortwährende Wiederkehr aus, ohne an dieser Stelle ausdrücklich „täglich“ zu sagen.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: „Salböl“ ist die geläufige, präzise deutsche Wiedergabe der kultischen Wendung.
- source_word: כָּל הַמִּשְׁכָּן
  choice: die ganze Stiftshütte
  rationale: „Stiftshütte“ ist im deutschen Bibelgebrauch verständlich und bezeichnet hier das transportable Heiligtum; „die ganze“ bewahrt die umfassende Bedeutung von כָּל.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: und alles, was sich darin befindet
  rationale: Die Relativkonstruktion wird vollständig und in natürlichem modernem Deutsch wiedergegeben.
- source_word: בְּקֹדֶשׁ
  choice: über das Heiligtum
  rationale: Die Präposition בְּ wird im Rahmen der Aufsicht als Bereichsangabe verstanden. קֹדֶשׁ bezeichnet hier den heiligen Bereich beziehungsweise das Heiligtum, nicht abstrakt „Heiligkeit“.
- source_word: וּבְכֵלָיו
  choice: und seine Geräte
  rationale: כֵּלִים umfasst Geräte, Gefäße und sonstige Ausstattungsstücke. „Geräte“ ist hier weit genug und bewahrt den sachlichen kultischen Sinn.
theological_decisions:
- issue: Bezug und Funktion des wiederholten פְקֻדַּת
  choice: Eleasar trägt sowohl für die aufgezählten heiligen Stoffe als auch umfassend für die Stiftshütte, ihren Inhalt, das Heiligtum und dessen Geräte Aufsichtsverantwortung.
  alternative: Die zweite Wendung kann enger als appositionelle Zusammenfassung der ersten gelesen und die gesamte hebräische Nominalkonstruktion ohne ergänztes Verb stehen gelassen werden.
  rationale: Der hebräische Satz ist verblos und appositionell gefügt. Die deutsche Fassung ergänzt „umfasst“ und „obliegt“, ohne Art oder Umfang des Amtes über den Wortlaut hinaus theologisch zu bestimmen.
- issue: Verständnis von בְּקֹדֶשׁ וּבְכֵלָיו
  choice: 'Die Wendung nennt weitere Bereiche, auf die sich Eleasars Aufsicht erstreckt: das Heiligtum und seine Geräte.'
  alternative: 'Die Präpositionen können stärker örtlich wiedergegeben werden: „im Heiligtum und bei/an seinen Geräten“.'
  rationale: Im Anschluss an פְקֻדַּת ist בְּ idiomatisch als Angabe des Zuständigkeitsbereichs verständlich. Eine Fußnote bewahrt die mögliche örtlichere Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Verwendung von „Aufsicht“ bewahrt die Wiederholung des hebräischen Schlüsselworts. Die verblosen hebräischen Satzteile werden zur Verständlichkeit in zwei eng verbundene deutsche Sätze überführt; die kultischen Fachbegriffe bleiben erhalten und werden bei echter Bedeutungsbreite durch Fußnoten erläutert.
