base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: de
  text: und die Säulen des Vorhofs ringsum samt ihren Sockeln, ihren Pflöcken und ihren Seilen, mit ihrer gesamten Ausrüstung und allem, was für ihren Dienst erforderlich ist. Die Gegenstände ihres Tragdienstes sollt ihr ihnen namentlich zuweisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Formulierung ist verdichtet: wörtlich etwa „die Gegenstände der Verantwortung ihres Tragens“. Gemeint sind die einzelnen Gegenstände, für deren Transport sie verantwortlich sind.'
    reason: Die Wortgruppe כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם verbindet Gegenstände, anvertraute Verantwortung und Tragen; die Fußnote erläutert dies, ohne die syntaktisch verdichtete Formulierung künstlich wörtlich nachzubilden.
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: die Säulen des Vorhofs ringsum
  rationale: עַמּוּדִים bezeichnet tragende Säulen oder Pfosten; חָצֵר ist hier der Vorhof des Heiligtums. Das adverbiale סָבִיב wird mit „ringsum“ wiedergegeben und bezeichnet die Säulen entlang des gesamten Vorhofs.
- source_word: אַדְנֵיהֶם
  choice: ihre Sockel
  rationale: אֶדֶן bezeichnet im Zusammenhang der Stiftshütte den Sockel beziehungsweise die Fußfassung eines Bauteils. „Sockel“ ist im Deutschen klar und sachgerecht.
- source_word: יְתֵדֹתָם
  choice: ihre Pflöcke
  rationale: יָתֵד bezeichnet einen Pflock, mit dem eine Zeltkonstruktion befestigt wird. „Pflöcke“ passt natürlich zu den anschließend genannten Seilen.
- source_word: מֵיתְרֵיהֶם
  choice: ihre Seile
  rationale: מֵיתָר bezeichnet ein Seil oder eine Schnur, besonders zur Befestigung eines Zeltes. „Seile“ ist hier die geläufige deutsche Bezeichnung.
- source_word: לְכָל כְּלֵיהֶם
  choice: mit ihrer gesamten Ausrüstung
  rationale: כְּלִים ist ein weiter Begriff für Geräte, Gegenstände oder Ausrüstung. In diesem Zusammenhang sind die zugehörigen Bauteile und Hilfsmittel gemeint, weshalb „Ausrüstung“ angemessen ist.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: und allem, was zu ihrem Dienst gehört
  rationale: עֲבֹדָה kann Arbeit, Dienst oder Aufgabe bedeuten. Die Umschreibung bewahrt den Bezug zum levitischen Dienst und klingt im modernen Deutschen natürlicher als „mit all ihrem Dienst“.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: sollt ihr ihnen namentlich zuweisen
  rationale: פקד kann hier einsetzen, bestimmen oder zuweisen bedeuten. In Verbindung mit בְשֵׁמֹת geht es um die persönliche Zuteilung der Tragaufgaben; das ergänzte „ihnen“ macht diesen Bezug im Deutschen deutlich.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: die Gegenstände, die sie als ihre Last zu tragen haben
  rationale: Die verdichtete hebräische Wortgruppe verbindet Gegenstände, Verantwortungsbereich und Traglast. Die deutsche Fassung gibt den naheliegenden Gesamtsinn wieder, ohne die Zuordnung einzelner Gegenstände zu einzelnen Trägern stärker festzulegen, als es der Zusammenhang erlaubt.
