  yaml_path: translation/ot/numbers/004/044.yaml
  text: And those counted from them by their clans were three thousand two hundred.
translation:
  language: de
  text: Und die Zahl der nach ihren Sippen Gemusterten betrug 3.200.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Und … betrug
  rationale: Die Wayyiqtol-Form von היה führt die Erzähl- bzw. Ergebnisfolge fort. Im Deutschen gibt „Und … betrug“ die anschließende Feststellung einer Gesamtzahl natürlich wieder.
- source_word: פְקֻדֵיהֶם
  choice: die Zahl der … Gemusterten
  rationale: Im Zusammenhang der Zählung bezeichnet die Form die erfassten bzw. registrierten Personen. Die deutsche Wendung macht zugleich deutlich, dass hier ihre Gesamtzahl genannt wird, ohne ein im Vers nicht ausdrücklich stehendes „Männer“ hinzuzufügen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Sippen- oder Familienverbände innerhalb des Stammes. „Nach ihren Sippen“ entspricht der Gliederung der Musterung und klingt in modernem Deutsch natürlich.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: '3.200'
  rationale: Die Zahl wird als die im Deutschen übliche Schreibweise für dreitausendzweihundert wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gemusterte“ bewahrt den amtlichen Zählungskontext; „Sippen“ gibt die soziale Untergliederung präziser wieder als das weiter gefasste „Familien“.
