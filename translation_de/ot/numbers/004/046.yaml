revisions:
- from: Alle Gemusterten[a], die Mose und Aaron und die führenden Männer Israels unter den Leviten musterten, nach ihren Sippen und ihren Großfamilien[b] –
  to: Die Gesamtzahl der Leviten, die Mose und Aaron und die Oberhäupter Israels nach ihren Sippen und ihren Vaterhäusern erfassten –
  rationale: 'Die Revision macht die Leviten eindeutig zur gezählten Gruppe, vermeidet die im Deutschen vor allem militärische Konnotation von „Musterung“ und bewahrt mit „Vaterhäusern“ die quellennahe Gliederungsterminologie. Da der hebräische Satz im folgenden Vers fortgesetzt wird, bleibt der Gedankenstrich erhalten. Die Fußnotenanker werden an die passenden Begriffe gebunden: [a] an „erfassten“, [b] an „Vaterhäusern“.'
