review_pass:
  verdict: revise
  source_fidelity: Die Grundgliederung und der Zählungsbezug sind zutreffend. „unter den Leviten“ schwächt jedoch die direkte Objektbeziehung von אֶת־הַלְוִיִּם ab; gezählt wurden die Leviten selbst. „Musterung“ kann zudem im modernen Deutsch unnötig militärisch verstanden werden.
  naturalness: „Alle Gemusterten ... musterten“ ist zwar verständlich, klingt aber im heutigen Standarddeutsch schwerfällig und stark militärisch. Eine Formulierung mit „Gesamtzahl“ und „erfassten“ gibt die resümierende, zum Folgesatz hin offene Syntax natürlich wieder.
  terminology: „Sippen“ ist für מִשְׁפְּחוֹת passend. Für בֵּית אָבוֹת sollte die etablierte, quellennahe Bezeichnung „Vaterhäuser“ im Haupttext stehen; eine Fußnote kann sie erläutern. „Oberhäupter Israels“ gibt נְשִׂיאֵי יִשְׂרָאֵל historisch angemessen und idiomatisch wieder.
  issues:
  - severity: medium
    issue: „unter den Leviten“ statt einer direkten Benennung der Leviten als gezählter Gruppe
    rationale: Das hebräische אֶת markiert „die Leviten“ als direktes Objekt von פָּקַד. „Unter den Leviten“ formuliert lediglich eine Teilmenge bzw. Zugehörigkeit und ist daher weniger präzise.
  - severity: low
    issue: „Gemusterten/musterten“
    rationale: Die Wortstammwiederholung ist nachvollziehbar, doch „Musterung“ ist im modernen Deutsch überwiegend militärisch konnotiert und die doppelte Formulierung wirkt unnatürlich.
  - severity: low
    issue: „Großfamilien“ im Haupttext
    rationale: Die Wiedergabe erklärt den Ausdruck, ersetzt aber die im Text bewusst verwendete institutionell-genealogische Bezeichnung בֵּית אָבוֹת. „Vaterhäuser“ bewahrt die Terminologie; die Erklärung gehört in die Anmerkung.
  revised_text: Die Gesamtzahl der Leviten, die Mose und Aaron und die Oberhäupter Israels nach ihren Sippen und ihren Vaterhäusern erfassten –
