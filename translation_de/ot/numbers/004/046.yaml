base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: de
  text: Die Gesamtzahl der Leviten, die Mose und Aaron und die Oberhäupter Israels nach ihren Sippen und ihren Vaterhäusern erfassten –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Alle Gemusterten
  rationale: Die passive Partizipialform bezeichnet die bei einer amtlichen Zählung erfassten Personen. „Gemusterte“ bewahrt den Zensuscharakter und entspricht dem wiederholten Wortstamm פקד.
- source_word: אֲשֶׁר פָּקַד
  choice: die … musterten
  rationale: Der Relativsatz bestimmt die Gemusterten näher. „Mustern“ bezeichnet hier das amtliche Erfassen und hält die Verbindung zum vorausgehenden Partizip sichtbar.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: und die führenden Männer Israels
  rationale: נְשִׂיאִים sind die maßgeblichen Stammes- oder Volksführer. Die Wiedergabe ist modern und vermeidet das heute missverständliche „Fürsten“.
- source_word: אֶת הַלְוִיִּם
  choice: unter den Leviten
  rationale: Der Ausdruck kennzeichnet die Leviten als die erfasste Gruppe. Im deutschen Satz stellt „unter den Leviten“ idiomatisch klar, dass die genannten Gemusterten aus dieser Gruppe stammen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Sippe beziehungsweise den Clan als Gliederungseinheit.
- source_word: וּלְבֵית אֲבֹתָם
  choice: und ihren Großfamilien
  rationale: בֵּית אָבוֹת bezeichnet eine vom Vaterhaus beziehungsweise von der Abstammung bestimmte Haushalts- und Verwandtschaftseinheit. „Großfamilien“ vermittelt die soziale Einheit im heutigen Deutsch verständlicher als die wörtliche Form.
