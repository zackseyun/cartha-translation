source:
  edition: WLC
  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: de
  text: 'Dann sollen sie alle seine Geräte darauflegen, mit denen sie an ihm Dienst verrichten: die Kohlenpfannen, die Gabeln, die Schaufeln und die Sprengschalen – alle Geräte des Altars. Dann sollen sie eine Lederabdeckung[a] über ihn ausbreiten und seine Tragstangen einsetzen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit dem hebräischen Wort tachash bezeichnete Tier beziehungsweise Leder ist nicht sicher bestimmt. Vorgeschlagen wurden unter anderem Ziegen-, Dachs- oder Tümmlerhaut; möglicherweise ist allgemein besonders geeignetes, widerstandsfähiges Leder gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Dann sollen sie … darauflegen
  rationale: Gibt die Abfolge der Anweisungen und das konkrete Auflegen der Geräte auf den Altar in natürlichem Deutsch wieder.
- source_word: כָּל־כֵּלָיו
  choice: alle seine Geräte
  rationale: כְּלִי bezeichnet hier umfassend die für den Altardienst bestimmten Gegenstände; „Geräte“ ist klarer und weniger altertümlich als „Gefäße“.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: mit denen sie an ihm Dienst tun
  rationale: Bewahrt den kultischen Dienstcharakter von שׁרת und den Bezug auf den Altar, ohne das Hebräische unnötig zu glätten.
- source_word: הַמַּחְתֹּת
  choice: die Kohlenpfannen
  rationale: Das Wort bezeichnet Pfannen zum Aufnehmen oder Tragen glühender Kohlen; „Kohlenpfannen“ ist im Altarkontext präziser als „Räucherpfannen“.
- source_word: הַמִּזְלָגֹת
  choice: die Gabeln
  rationale: Gibt die gabelförmigen Geräte in verständlichem, modernem Deutsch wieder, ohne ihre genaue Verwendung übermäßig festzulegen.
- source_word: הַיָּעִים
  choice: die Schaufeln
  rationale: Bezeichnet Werkzeuge, die unter anderem zum Entfernen von Asche dienten; „Schaufeln“ ist die klare sachliche Entsprechung.
- source_word: הַמִּזְרָקֹת
  choice: die Sprengschalen
  rationale: Die Gefäße wurden im Opferdienst besonders im Zusammenhang mit Blut verwendet; „Sprengschalen“ wahrt den kultischen Funktionsbezug besser als das allgemeinere „Schalen“.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: alle Geräte des Altars
  rationale: Die zusammenfassende Apposition wird beibehalten und terminologisch an כָּל־כֵּלָיו angeglichen.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: Dann sollen sie eine Decke … darüberbreiten
  rationale: Gibt sowohl das Ausbreiten als auch die schützende Bedeckung ausdrücklich wieder.
- source_word: עוֹר תַּחַשׁ
  choice: Leder[a]
  rationale: Da die Tierart hinter תַּחַשׁ nicht sicher bestimmbar ist, vermeidet die Hauptübersetzung eine spekulative zoologische Festlegung; die Ungewissheit wird in der Fußnote offengelegt.
- source_word: וְשָׂמוּ בַדָּיו
  choice: und seine Tragstangen einsetzen
  rationale: „Einsetzen“ gibt das Anbringen beziehungsweise Platzieren der zum Transport dienenden Stangen idiomatisch wieder.
