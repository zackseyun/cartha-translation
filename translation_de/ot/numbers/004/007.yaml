id: NUM.4.7
reference: Numbers 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: de
  text: Über den Tisch der Gegenwart[a] sollen sie ein blaues Tuch breiten. Darauf sollen sie die Teller, die Schalen, die Schüsseln und die Kannen für das Trankopfer stellen. Auch das beständige Brot[b] soll darauf liegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: »Schaubrottisch«. Das Hebräische lautet wörtlicher »Tisch des Angesichts« beziehungsweise »Tisch der Gegenwart«.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »das ständig aufgelegte Brot«. Gemeint ist das Brot, das regelmäßig vor dem HERRN auf dem Tisch lag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: Tisch der Gegenwart
  rationale: Die Wendung bedeutet wörtlich »Tisch des Angesichts/der Gegenwart«. »Tisch der Gegenwart« bewahrt das hebräische Bild und den kultischen Bezug, ohne es durch die traditionelle Bezeichnung »Schaubrottisch« vorzeitig auszulegen.
- source_word: יִפְרְשׂוּ
  choice: sollen sie … breiten
  rationale: Das Verb bezeichnet das Ausbreiten eines Stoffes über einem Gegenstand. »Ein Tuch über den Tisch breiten« ist natürliches, präzises Deutsch.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: ein blaues Tuch
  rationale: תְּכֵלֶת bezeichnet den charakteristischen blauen bis blauvioletten Farbton der Heiligtumstextilien. »Blau« ist verständlich und legt den genauen, unsicheren Farbton nicht zu eng fest.
- source_word: הַקְּעָרֹת
  choice: die Teller
  rationale: Das Wort bezeichnet hier flache Tisch- oder Serviergefäße. »Teller« gibt diese Funktion verständlich wieder.
- source_word: הַכַּפֹּת
  choice: die Schalen
  rationale: Die genaue Gestalt dieser kleinen kultischen Gefäße ist nicht sicher; »Schalen« ist im Zusammenhang der Tischgeräte eine zurückhaltende Wiedergabe.
- source_word: הַמְּנַקִּיֹּת
  choice: die Schüsseln
  rationale: Die Bezeichnung dieses Geräts ist unsicher und wird verschieden wiedergegeben. »Schüsseln« wahrt die Einordnung als Tischgefäß, ohne eine spezielle Form zu behaupten.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: die Kannen für das Trankopfer
  rationale: Die Wortgruppe bezeichnet Gefäße zum Ausgießen einer Libation. »Kannen für das Trankopfer« gibt Form beziehungsweise Funktion in modernem Deutsch wieder.
- source_word: לֶחֶם הַתָּמִיד
  choice: das beständige Brot
  rationale: תָּמִיד bezeichnet das regelmäßig beziehungsweise fortwährend vor Gott befindliche Brot. »Beständiges Brot« bewahrt die knappe kultische Formulierung; eine Fußnote erläutert sie.
- source_word: עָלָיו יִהְיֶה
  choice: soll darauf liegen
  rationale: Die Aussage verlangt, dass sich das Brot auf dem Tisch befindet. Im Deutschen ist »darauf liegen« für Brot natürlicher als das formalere »darauf sein«, ohne ein zusätzliches Fortdauern in das Verb einzutragen.
