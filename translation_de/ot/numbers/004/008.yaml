  text: וּ/פָרְשׂ֣וּ עֲלֵי/הֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: de
  text: Darüber sollen sie ein scharlachrotes Tuch breiten, ihn mit einer Decke aus Tahaschhaut[a] bedecken und seine Tragstangen einsetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Tahasch; welches Tier beziehungsweise welches Material gemeint ist, ist ungewiss. Traditionelle Wiedergaben sind unter anderem „Dachshaut“, „Seekuhhaut“ oder, allgemeiner, „feines Leder“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: Über sie sollen sie … breiten
  rationale: Die Formulierung gibt das konkrete Ausbreiten einer Abdeckung über den zuvor genannten Gegenständen wieder und bewahrt den Pluralbezug des hebräischen Pronomens.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: ein scharlachrotes Tuch
  rationale: בגד bezeichnet hier ein zum Abdecken verwendetes Textil, nicht ein Kleidungsstück. תולעת שני kennzeichnet dessen scharlachrote Farbe beziehungsweise Färbung; „Garn“ ist an dieser Stelle nicht ausdrücklich genannt.
- source_word: וְכִסּוּ אֹתוֹ
  choice: ihn … bedecken
  rationale: Das maskuline Singularpronomen verweist im Zusammenhang auf den Tisch als Einheit. Der Wechsel vom Plural „sie“ zum Singular „ihn“ wird wie im Hebräischen beibehalten.
- source_word: בְּמִכְסֵה
  choice: mit einer Decke
  rationale: מכסה bezeichnet eine weitere Abdeckung. „Decke“ ist im Deutschen konkret, natürlich und für den kultischen Zusammenhang passend.
- source_word: עוֹר תָּחַשׁ
  choice: Tahaschhaut
  rationale: Die Tierart oder Materialbezeichnung תחש ist nicht sicher bestimmbar. Die Umschrift vermeidet eine spekulative zoologische Festlegung; „Haut“ entspricht עור.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: seine Tragstangen einsetzen
  rationale: בדים sind die zum Tragen des heiligen Geräts bestimmten Stangen. „Einsetzen“ gibt im Transportzusammenhang das Anbringen beziehungsweise In-Stellung-Bringen knapp und natürlich wieder.
