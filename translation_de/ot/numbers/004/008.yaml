translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den auffälligen Wechsel vom pluralischen Bezug auf die Gegenstände zum singularischen Bezug auf den Tisch, ohne die Unsicherheit bei תחש zu verdecken.
