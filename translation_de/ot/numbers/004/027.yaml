  source_fidelity: Die Grundstruktur und die Zuständigkeit Aarons und seiner Söhne werden zutreffend wiedergegeben. »Übrigen« hat jedoch im Hebräischen keine Entsprechung und legt eine nicht ausdrücklich markierte Gegenüberstellung von Tragdienst und anderem Dienst nahe. »Feste« verstärkt מִשְׁמֶרֶת unnötig; der Begriff bezeichnet eine zugewiesene Verantwortung bzw. Aufgabe, nicht notwendig deren Dauerhaftigkeit.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. Die Wiederholung von »allem, was sie zu tragen haben« ist angesichts der hebräischen Wiederholung vertretbar. Die revidierte Fassung ist etwas genauer und bleibt flüssig.
  terminology: »Dienst«, »Gerschoniter«, »Weisung« und die Umschreibung des konkreten Tragens sind angemessen. »Als Aufgabe« gibt בְּמִשְׁמֶרֶת ohne zusätzliche Festlegung wieder.
