    rationale: »Fest« ist eine zusätzliche Qualifizierung. בְּמִשְׁמֶרֶת bezeichnet hier eine übertragene Aufgabe, Verantwortlichkeit oder Dienstpflicht, ohne ausdrücklich deren Unveränderlichkeit zu behaupten.
