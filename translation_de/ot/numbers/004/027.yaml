  text: עַל פִּי֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו תִּהְיֶ֗ה כָּל עֲבֹדַת֙ בְּנֵ֣י הַ/גֵּרְשֻׁנִּ֔י לְ/כָל מַשָּׂאָ֔/ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/פְקַדְתֶּ֤ם עֲלֵ/הֶם֙ בְּ/מִשְׁמֶ֔רֶת אֵ֖ת כָּל מַשָּׂאָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: de
  text: Der gesamte Dienst der Gerschoniter soll nach der Weisung Aarons und seiner Söhne erfolgen[a], sowohl bei allem, was sie zu tragen haben, als auch bei ihrem gesamten Dienst. Ihr sollt ihnen alles, was sie zu tragen haben, als Aufgabe[b] zuweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf den Mund Aarons und seiner Söhne hin«; die hebräische Wendung bezeichnet ihre Anweisung oder ihren Befehl.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »als anvertraute Verantwortung« beziehungsweise »als Dienstpflicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: nach der Weisung
  rationale: Die Wendung bedeutet wörtlich »auf den Mund hin« und bezeichnet hier Handeln nach der Anordnung oder Weisung einer zuständigen Person. »Nach der Weisung« ist natürliches Deutsch und bewahrt den Autoritätssinn.
- source_word: עֲבֹדַת
  choice: Dienst
  rationale: Im Zusammenhang mit dem Heiligtum bezeichnet עֲבֹדָה den zugewiesenen Arbeits- und Dienstbereich der Leviten. »Dienst« gibt diesen kultischen und praktischen Sinn angemessen wieder.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: die Gerschoniter
  rationale: Wörtlich steht »die Söhne des Gerschoniters«; gemeint ist der von Gerschon abstammende Sippenverband. Die deutsche Volks- bzw. Sippenbezeichnung ist hier natürlich und eindeutig.
- source_word: מַשָּׂאָם
  choice: alles, was sie zu tragen haben
  rationale: מַשָּׂא bezeichnet hier konkret die beim Transport des Heiligtums zu tragenden Gegenstände. Die Umschreibung vermeidet den möglichen übertragenen Klang von »Lasten« und wahrt den konkreten Auftrag.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: ihr sollt ihnen … zuweisen
  rationale: פקד mit עַל kann hier das Übertragen oder Zuweisen einer Verantwortung bezeichnen. Die Verbform ist Plural; deshalb wird das ausdrückliche »ihr« beibehalten.
- source_word: בְּמִשְׁמֶרֶת
  choice: als feste Aufgabe
  rationale: מִשְׁמֶרֶת kann eine anvertraute Verantwortung, einen Auftrag oder eine Dienstpflicht bezeichnen. »Als feste Aufgabe« ist verständlich und bringt die verbindliche Zuweisung zum Ausdruck.
