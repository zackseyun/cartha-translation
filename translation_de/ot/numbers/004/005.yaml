base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: de
  text: Wenn das Lager aufbricht, sollen Aaron und seine Söhne kommen, den abschirmenden Vorhang abnehmen und damit die Lade des Zeugnisses[a] bedecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch »Bundeslade«; im Hebräischen steht hier jedoch »Zeugnis«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: sollen Aaron und seine Söhne hineingehen
  rationale: Das morphologisch singularische Verb steht bei einem zusammengesetzten Subjekt und wird von pluralischen Verben fortgeführt. „Hineingehen“ gibt im Zusammenhang des Heiligtums die gerichtete Bewegung natürlich wieder; „sollen“ kennzeichnet die Anweisung.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: Wenn das Lager aufbricht
  rationale: Der Infinitiv mit בְּ bezeichnet den Zeitpunkt. „Aufbrechen“ ist im Deutschen die natürliche Bezeichnung für den Beginn des Weiterzugs eines Lagers.
- source_word: וְהוֹרִדוּ
  choice: abnehmen
  rationale: Beim Abbau des Heiligtums wird der Vorhang von seinem Platz heruntergenommen. „Abnehmen“ ist hier klarer und idiomatischer als das wörtlichere „herablassen“.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: den abschirmenden Vorhang
  rationale: פָּרֹכֶת bezeichnet den inneren Vorhang, הַמָּסָךְ seine abschirmende Funktion. Die attributive Wiedergabe ist im Deutschen natürlich und bewahrt den sachlichen Gehalt der Verbindung.
- source_word: וְכִסּוּ בָהּ
  choice: und damit … bedecken
  rationale: כסה bedeutet „bedecken“; das feminine Suffix verweist auf den Vorhang. „Damit“ bringt den instrumentalen Sinn knapp zum Ausdruck.
- source_word: אֲרֹן הָעֵדֻת
  choice: die Lade des Zeugnisses
  rationale: Der hebräische Text hat ausdrücklich עֵדוּת („Zeugnis“), nicht בְּרִית („Bund“). Die Übersetzung folgt daher dem Ausgangstext statt der geläufigeren traditionellen Bezeichnung.
theological_decisions:
- issue: Traditionelle Wiedergabe von אֲרֹן הָעֵדֻת
  choice: die Lade des Zeugnisses
  alternative: die Bundeslade
  rationale: „Bundeslade“ ist geläufig, ersetzt jedoch das tatsächlich stehende „Zeugnis“ durch „Bund“. Die gewählte Form bewahrt die Ausdrucksweise und mögliche theologische Akzentsetzung des hebräischen Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig, bleibt aber eng an der Abfolge des Hebräischen. Der Fußnotenmarker wurde sachgerecht bei „Zeugnis“ gesetzt, da sich die Anmerkung auf אֲרֹן הָעֵדֻת bezieht.
