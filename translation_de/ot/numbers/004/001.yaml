lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Narrativtempus von דבר leitet eine göttliche Rede ein; „sprach“ ist im Deutschen die natürliche, würdige Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im Hebräischen stehenden Eigennamen zu bewahren.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und zu Aaron
  rationale: Die Wiederholung der Präposition אֶל vor beiden Namen wird im Deutschen beibehalten und kennzeichnet beide ausdrücklich als Angesprochene.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die feste hebräische Redeeinleitungsformel wird vor der unmittelbar folgenden direkten Rede im natürlichen modernen Deutsch durch einen Doppelpunkt ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen; die Fußnote weist auf die hebräische Konsonantenform hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gibt die hebräische Formel לֵאמֹר idiomatisch wieder und bereitet die folgende direkte Rede vor.
