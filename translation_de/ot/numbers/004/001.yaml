  text: 'Und Jahwe[a] sprach zu Mose und zu Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit „der HERR“ wiedergegeben.'
