  source_fidelity: 'Die Relativkonstruktion muss im Deutschen eindeutig den Vorhof bezeichnen, nicht den Vorhang: Der Vorhof umgibt Wohnung und Altar ringsum. Die Wendung zu כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם sollte die offene Beziehung von לָהֶם bewahren; „was mit ihnen zu tun ist“ ist im Deutschen zu allgemein und kann bloß „was sie betrifft“ bedeuten.'
