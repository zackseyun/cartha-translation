  to: und die Behänge des Vorhofs, den Vorhang für den Eingang des Tores des Vorhofs, der die Wohnung und den Altar ringsum umgibt, ihre Seile[a], alle Geräte für ihren Dienst und alles, was für sie zu tun ist[b]; und sie sollen Dienst tun.
  rationale: 'Die Revision klärt den Bezug des Relativsatzes entsprechend der hebräischen Syntax und räumlichen Aussage: Der Vorhof, nicht der Torvorhang, umgibt Wohnung und Altar. Außerdem ersetzt sie die zu unspezifische Hauptlesart bei „alles, was mit ihnen zu tun ist“ durch eine näher am hebräischen Wortlaut bleibende Formulierung und belässt die Auslegungsalternative in der Fußnote. Der Schlusssatz wird ohne ergänzendes „darin“ formuliert.'
