  terminology: „Behänge“, „Vorhof“, „Vorhang“, „Wohnung“, „Altar“, „Seile“ und „Dienst“ sind im Heiligtumskontext angemessen und konsistent. Die Fußnoten bewahren die lexikalische Alternative bei מֵיתְרֵיהֶם sowie die syntaktisch-semantische Mehrdeutigkeit der Wendung mit לָהֶם.
