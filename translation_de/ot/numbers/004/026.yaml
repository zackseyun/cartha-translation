  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: de
  text: und die Behänge des Vorhofs, den Vorhang für den Eingang des Tores des Vorhofs, der die Wohnung und den Altar ringsum umgibt, ihre Seile[a], alle Geräte für ihren Dienst und alles, was für sie zu tun ist[b]; und sie sollen Dienst tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schnüre“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alles, was mit ihnen zu tun ist“. Das Hebräische kann sowohl Aufgaben meinen, die mit diesen Gegenständen ausgeführt werden, als auch Arbeiten, die für sie oder an ihnen zu verrichten sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: Behänge
  rationale: Bezeichnet die Stoffbahnen, die den Vorhof abgrenzen. „Behänge“ unterscheidet sie passend von den inneren Vorhängen der Wohnung.
- source_word: חָצֵר
  choice: Vorhof
  rationale: Im Heiligtumskontext bezeichnet das Wort den umschlossenen äußeren Bereich; „Vorhof“ ist im Deutschen klar und geläufig.
- source_word: מָסַךְ
  choice: Vorhang
  rationale: Bezeichnet hier den textilen Abschluss eines Eingangs. „Vorhang“ ist natürliches modernes Deutsch und gibt die Funktion am Tor wieder.
- source_word: פֶּתַח שַׁעַר
  choice: am Eingang des Tores
  rationale: Bewahrt die doppelte Bezeichnung von Eingang und Tor, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: der rings um die Wohnung und den Altar liegt
  rationale: Das Relativpronomen wird auf den Vorhof bezogen, der räumlich die Wohnung und den Altar umgibt. So bleibt die Aussage verständlich, ohne den Torvorhang selbst als ringsum verlaufend erscheinen zu lassen.
- source_word: מֵיתְרֵיהֶם
  choice: ihre Seile
  rationale: Bezeichnet die zur Befestigung gehörenden Seile oder Schnüre; „Seile“ ist unmittelbar verständlich, die Alternative wird in einer Fußnote genannt.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: alle Geräte für ihren Dienst
  rationale: כְּלִים ist ein weiter Begriff für Geräte und Zubehör; „Dienst“ erhält den Arbeits- und Heiligtumsbezug von עֲבֹדָה.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: alles, was mit ihnen zu tun ist
  rationale: 'Die Formulierung erhält die Mehrdeutigkeit der Präposition ל: Gemeint sein können Arbeiten mit diesen Gegenständen oder Arbeiten, die für sie beziehungsweise an ihnen ausgeführt werden.'
- source_word: וְעָבָדוּ
  choice: darin sollen sie ihren Dienst tun
  rationale: Das Verb bezeichnet die Ausführung des zugewiesenen Dienstes. „Darin“ knüpft idiomatisch an die zuvor genannten Gegenstände und Aufgaben an.
