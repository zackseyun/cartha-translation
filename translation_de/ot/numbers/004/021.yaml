  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Dann sprach Jahwe zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Waw mit der Verbform führt die Erzählung weiter. „Dann sprach“ gibt sowohl die zeitlich-fortschreitende Funktion als auch die Bedeutung von דבר natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Formulierung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeformel „indem er sagte/zu sagen“ leitet den folgenden Wortlaut ein. Im heutigen Deutsch übernimmt ein Doppelpunkt diese Funktion prägnant und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm als Gottes persönlichen Namen. „Jahwe“ bewahrt diesen Namen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Einleitungsformel wird natürlich wiedergegeben; der Doppelpunkt kündigt die in Vers 22 folgende Rede an.
