  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: de
  text: 'Dies[a] waren die Gemusterten aus den Sippen der Söhne Gerschons: alle, die am Zelt der Begegnung Dienst taten und die Mose und Aaron auf Befehl Jahwes musterten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies sind die Gemusterten aus den Sippen der Söhne Gerschons.“'
    reason: Das Hebräische markiert bei „dies“ keine Zeitstufe; je nach Verständnis als gegenwärtige Auflistung oder erzählerische Zusammenfassung ist auch das Präsens möglich.
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Dies waren die Gemusterten
  rationale: Die Wendung fasst den zuvor berichteten Musterungsabschnitt zusammen. Das deutsche Präteritum passt zum Erzählzusammenhang; פְקוּדֵי bezeichnet hier die bei der Musterung Erfassten.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Gemeint sind größere verwandtschaftliche Untergruppen innerhalb eines Stammes; „Sippen“ gibt diese soziale Einheit genauer wieder als das im Deutschen enger wirkende „Familien“.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: Söhne Gerschons
  rationale: Die hebräische Verwandtschaftsbezeichnung wird formal bewahrt und nicht zu „Gerschoniter“ verdichtet.
- source_word: כָּל הָעֹבֵד
  choice: alle, die … Dienst taten
  rationale: Das substantivierte Partizip bezeichnet sämtliche zum Dienst Herangezogenen. Im deutschen Rückblick ist das Präteritum natürlich.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: Die Präposition kann den gesamten mit dem Heiligtum verbundenen Dienst bezeichnen; „am“ vermeidet die irreführende Einschränkung, alle Arbeiten seien im Inneren des Zeltes ausgeführt worden.
- source_word: אֲשֶׁר פָּקַד
  choice: die … musterten
  rationale: Das Verb פקד steht hier im Musterungszusammenhang. Die aktive Konstruktion bewahrt Mose und Aaron als ausdrücklich genannte Handelnde.
- source_word: עַל פִּי יְהוָה
  choice: auf Befehl Jahwes
  rationale: Die wörtliche Wendung „nach dem Mund Jahwes“ ist ein Idiom für Handeln gemäß seinem Befehl.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mustern“ und „Gemusterte“ halten den Zensuszusammenhang sowie die Wortverbindung der beiden Formen von פקד sichtbar; „Dienst tun“ ist verständlich und dem kultischen Kontext angemessen.
