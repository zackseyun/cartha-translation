  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: de
  text: 'Und dies ist ihre Trageaufgabe bei ihrem gesamten Dienst am Zelt der Begegnung: die Bretter der Wohnung[a], ihre Riegel, ihre Säulen und ihre Sockel[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Rahmen der Wohnung“. Das hebräische Wort bezeichnet tragende hölzerne Bauteile; ihre genaue Bauform ist nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fußstücke“ oder „Aufnahmesockel“. Gemeint sind die Grund- beziehungsweise Aufnahmeelemente der Konstruktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Und dies ist
  rationale: Bewahrt den Anschluss durch וְ und die präsentierende Formulierung des Hebräischen.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: die ihnen anvertraute Traglast
  rationale: מִשְׁמֶרֶת bezeichnet die zugewiesene Verantwortung, מַשָּׂא die konkret zu tragende Last. Die Formulierung verbindet beide Aspekte natürlich und knapp.
- source_word: לְכָל עֲבֹדָתָם
  choice: bei ihrem gesamten Dienst
  rationale: עֲבֹדָה bezeichnet hier den zugewiesenen Dienst der Leviten; „bei“ gibt den Bezug der Traglast zu diesem Dienst idiomatisch wieder.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: „Zelt der Begegnung“ gibt die feste Heiligtumsbezeichnung wieder; „am“ bezeichnet natürlich den Tätigkeitsbereich, zu dem auch äußere Bauteile gehören.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: die Rahmen der Wohnung
  rationale: קֶרֶשׁ bezeichnet die tragenden hölzernen Bauteile; „Rahmen“ hebt ihre konstruktive Funktion hervor. מִשְׁכָּן wird als „Wohnung“ wiedergegeben und vom Zelt der Begegnung begrifflich unterschieden.
- source_word: בְרִיחָיו
  choice: ihre Riegel
  rationale: Die Bauteile verbanden beziehungsweise sicherten die Rahmen; „Riegel“ ist im Deutschen präziser als das mehrdeutige „Stangen“.
- source_word: עַמּוּדָיו
  choice: ihre Säulen
  rationale: Bezeichnet aufrechte Stützelemente und entspricht dem würdigen, sachlichen Register des Bauberichts.
- source_word: אֲדָנָיו
  choice: ihre Sockel
  rationale: Gemeint sind die Fundament- beziehungsweise Aufnahmeelemente, in denen Rahmen oder Säulen standen; „Sockel“ ist verständlich und baulich treffend.
