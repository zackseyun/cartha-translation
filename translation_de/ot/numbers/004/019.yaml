  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: de
  text: 'Doch tut Folgendes für sie, damit sie am Leben bleiben und nicht sterben, wenn sie sich den hochheiligen Gegenständen[a] nähern: Aaron und seine Söhne sollen kommen und jeden Mann seinem Dienst und seiner Traglast zuweisen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Allerheiligsten« beziehungsweise »dem hochheiligen Bereich«. Im Zusammenhang sind wahrscheinlich die hochheiligen Gegenstände gemeint, die transportiert werden sollten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: Doch tut Folgendes für sie
  rationale: Die Wendung leitet nach der vorausgehenden Warnung eine schützende Anweisung ein; לָהֶם wird sinnvoll benefaktiv wiedergegeben.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: damit sie am Leben bleiben und nicht sterben
  rationale: Die Verbfolge bezeichnet hier den beabsichtigten Zweck beziehungsweise das Ergebnis der Anweisung.
- source_word: בְּגִשְׁתָּם
  choice: wenn sie sich … nähern
  rationale: ב mit dem Infinitivkonstrukt hat temporale Funktion; ‚sich nähern‘ bewahrt zugleich den kultischen Annäherungssinn.
- source_word: אֶת קֹדֶשׁ הַקֳּדָשִׁים
  choice: den hochheiligen Dingen
  rationale: Im Zusammenhang der Transportaufgaben sind wahrscheinlich die heiligsten Kultgegenstände gemeint; der Plural ‚Dinge‘ macht diesen Bezug im Deutschen verständlich, ohne die mögliche räumliche Deutung zu verschweigen.
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: Aaron und seine Söhne sollen hineingehen
  rationale: Das Imperfekt hat vorschreibende Kraft. Im unmittelbaren Kontext bezeichnet בוא ihr Eintreten zu den verhüllten Heiligtümern; ‚hineingehen‘ ist daher natürlicher als bloß ‚kommen‘.
- source_word: וְשָׂמוּ אוֹתָם אִישׁ אִישׁ
  choice: und jeden Einzelnen … einteilen
  rationale: Die Wiederholung אִישׁ אִישׁ ist distributiv. ‚Einteilen‘ gibt das Zuweisen jedes Mannes zu seiner konkreten Aufgabe idiomatisch wieder.
- source_word: עַל עֲבֹדָתוֹ
  choice: für seinen Dienst
  rationale: עֲבֹדָה bezeichnet im levitischen Zusammenhang den zugewiesenen Dienst beziehungsweise die konkrete Dienstaufgabe.
- source_word: וְאֶל מַשָּׂאוֹ
  choice: und seine Traglast
  rationale: מַשָּׂא meint hier konkret das beim Transport zu Tragende; ‚Traglast‘ bewahrt den sachlichen Zusammenhang besser als das im Deutschen leicht übertragene ‚Bürde‘.
theological_decisions:
- issue: Bezug von קֹדֶשׁ הַקֳּדָשִׁים
  choice: die hochheiligen Dinge
  alternative: das Allerheiligste / der hochheilige Bereich
  rationale: Der Abschnitt handelt von den verhüllten heiligen Gegenständen, die die Kehatiter tragen sollen. Daher liegt ein gegenständlicher Bezug nahe; die traditionelle räumliche Lesart bleibt als Fußnote erhalten.
- issue: Geschlecht und distributive Aussage von אִישׁ אִישׁ
  choice: jeden Einzelnen
  alternative: jeden Mann / Mann für Mann
  rationale: Gemeint sind in diesem Zusammenhang die männlichen Leviten. ‚Jeden Einzelnen‘ wahrt die distributive Aussage, ohne den historischen Referentenkreis zu erweitern oder auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtsanweisung bleibt verbindlich formuliert; kultische Fachsprache wird verständlich gehalten. Der Ausdruck ‚Traglast‘ stellt den konkreten Transportzusammenhang heraus.
