  text: their counted men were eight thousand five hundred and eighty[a].
translation:
  language: de
  text: Die Zahl der bei ihnen erfassten Männer betrug achttausendfünfhundertachtzig[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die bei ihnen Erfassten waren achttausendfünfhundertachtzig“ oder „Ihre Gemusterten waren achttausendfünfhundertachtzig“. Das Hebräische bezeichnet die bei der Zählung registrierten Personen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: betrug
  rationale: Die Verbform von היה führt hier die Gesamtsumme der Zählung ein. Das deutsche Singularverb „betrug“ bezieht sich natürlich auf „die Zahl“ und gibt die Funktion im Kontext idiomatisch wieder.
- source_word: פְּקֻדֵיהֶם
  choice: die Zahl der bei ihnen erfassten Männer
  rationale: Das von פקד abgeleitete Wort bezeichnet in diesem Musterungs- und Zählungskontext die registrierten Personen. „Erfasst“ bringt die amtliche Zählung zum Ausdruck; „Männer“ entspricht dem männlichen Personenkreis, der im Zusammenhang von Numeri 4 für den Dienst gezählt wird.
- source_word: שְׁמֹנַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וּשְׁמֹנִים
  choice: achttausendfünfhundertachtzig
  rationale: Die additive hebräische Zahlenfolge wird als übliche deutsche Kardinalzahl wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Gezählten
  choice: bei ihnen erfassten Männer
  alternative: die bei ihnen Erfassten / ihre Gemusterten
  rationale: Der unmittelbare Kontext zählt männliche Leviten eines festgelegten Alters für den Dienst. „Männer“ benennt den tatsächlichen Referenten, ohne die grammatisch knappe Form des Hebräischen als geschlechtsneutral umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „Die Zahl … betrug“ ist für eine Zählung natürlich und klar; „erfasst“ vermeidet das heute teilweise militärisch oder altertümlich wirkende „gemustert“, das in der Fußnote als nähere formale Alternative erhalten bleibt.
