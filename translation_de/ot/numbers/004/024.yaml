  source_fidelity: 'Der Text gibt den hebräischen Nominalsatz und die Aufgabenbestimmung zuverlässig wieder: עֲבֹדַת als „Dienst“, מִשְׁפְּחֹת als „Sippen“, das kollektive Gentiliz „Gerschoniter“ sowie die beiden ל-Ausdrücke als „zu dienen und Lasten zu tragen“. „Lasten“ macht die in מַשָּׂא enthaltene Bedeutung des Getragenen bzw. der Traglast explizit, ohne den Sinn einzuengen.'
  naturalness: '„Das ist der Dienst der Sippen der Gerschoniter: zu dienen und Lasten zu tragen“ ist klares, modernes Standarddeutsch. Der Doppelpunkt markiert die Erläuterung der Dienstaufgaben idiomatisch; die Wiederaufnahme von „Dienst“ in „zu dienen“ ist im kultisch-administrativen Register angemessen und entspricht der hebräischen Wortstammbeziehung.'
  terminology: „Sippen“ ist für verwandtschaftlich gegliederte Gruppen treffend, und „Gerschoniter“ ist die etablierte deutsche Namensform. „Dienst“ bewahrt den sachlichen, kultischen Kontext ohne konfessionelle Überdeutung. Es sind keine Fußnotenanker im deutschen Entwurf vorhanden, die zu prüfen oder zu ergänzen wären.
