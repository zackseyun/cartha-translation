  text: זֹ֣את עֲבֹדַ֔ת מִשְׁפְּחֹ֖ת הַ/גֵּרְשֻׁנִּ֑י לַ/עֲבֹ֖ד וּ/לְ/מַשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: de
  text: 'Das ist der Dienst der Sippen der Gerschoniter: zu dienen und Lasten zu tragen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: Das ist
  rationale: Das feminine Singular-Demonstrativ eröffnet einen hebräischen Nominalsatz; im Deutschen wird die nicht ausgedrückte Kopula natürlich mit »ist« wiedergegeben.
- source_word: עֲבֹדַת
  choice: der Dienst
  rationale: עֲבֹדָה kann Dienst, Arbeit oder Aufgabe bezeichnen. »Dienst« passt zum levitischen Zusammenhang und bewahrt den Bezug zum folgenden Infinitiv desselben Wortstamms.
- source_word: מִשְׁפְּחֹת
  choice: der Sippen
  rationale: Der Plural im Status constructus bezeichnet die verwandtschaftlich gegliederten Gruppen innerhalb der Gerschoniter. »Sippen« ist hier präziser als das im Deutschen leicht auf Kernfamilien bezogene »Familien«.
- source_word: הַגֵּרְשֻׁנִּי
  choice: der Gerschoniter
  rationale: Das substantivierte Gentiliz ist kollektiv gebraucht und bezeichnet die Nachkommen Gerschons; nach »Sippen« ist der deutsche Plural idiomatisch.
- source_word: לַעֲבֹד
  choice: zu dienen
  rationale: Der Infinitiv mit ל bezeichnet die Tätigkeit beziehungsweise Bestimmung. »Zu dienen« erhält die Wortstammverbindung zu »Dienst« und ist natürliches modernes Deutsch.
- source_word: וּלְמַשָּׂא
  choice: und Lasten zu tragen
  rationale: מַשָּׂא bezeichnet eine Last beziehungsweise das Tragen einer Last. Die verbale deutsche Formulierung wahrt die Parallelität zu »zu dienen« und macht die gemeinte Transportaufgabe verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die erläuternde Funktion der beiden mit ל eingeleiteten Ausdrücke ab. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; konfessionelle oder über den Kontext hinausgehende Deutungen werden vermieden.
