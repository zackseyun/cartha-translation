source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: de
  text: Das waren die Gemusterten aus den Sippen der Kehatiter, alle, die im Zelt der Begegnung Dienst leisteten und die Mose und Aaron auf den Befehl Jahwes hin durch Mose[a] musterten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „durch Moses Hand“; idiomatisch auch: „durch Mose“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: die Gemusterten
  rationale: Das Wort bezeichnet hier im Zusammenhang der Erfassung für den Dienst die gezählten beziehungsweise gemusterten Männer; „die Gemusterten“ ist knapp und wahrt den konkreten Personenbezug.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: die Sippen der Kehatiter
  rationale: מִשְׁפָּחוֹת bezeichnet größere Familienverbände oder Sippen. „Kehatiter“ gibt die kollektive Nachkommengruppe natürlich wieder.
- source_word: כָּל הָעֹבֵד
  choice: alle, die … Dienst taten
  rationale: Das Partizip bezeichnet alle, die mit dem Dienst befasst waren; die deutsche Formulierung ist natürlich und entspricht im Rückblick dem Erzählzusammenhang.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: „Zelt der Begegnung“ gibt die feste Bezeichnung אֹהֶל מוֹעֵד verständlich und quellennah wieder; בְּ bezeichnet hier den Bereich des Dienstes.
- source_word: אֲשֶׁר פָּקַד
  choice: die … musterten
  rationale: פקד bezeichnet auch hier das Zählen oder Mustern, nicht das Einsetzen in ein Amt. Der Relativsatz bezieht sich auf die erfassten Personen.
- source_word: עַל פִּי יְהוָה
  choice: auf den Befehl Jahwes hin
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund Jahwes“ und bezeichnet seine ausdrückliche Weisung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die idiomatische Wendung bezeichnet Vermittlung oder Beauftragung. „Durch Mose“ vermeidet im Deutschen die missverständliche wörtliche Form „durch die Hand Moses“ und bewahrt zugleich die im Hebräischen auffällige erneute Nennung Moses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der Vers verwendet den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ ist im modernen Deutschen die übliche wissenschaftlich begründete Wiedergabe.
- issue: Verhältnis von Mose und Aaron zur durch Mose vermittelten Weisung
  choice: Mose und Aaron musterten; der Befehl erging durch Mose
  alternative: den Schluss nur als „nach Jahwes Befehl“ wiedergeben
  rationale: 'Die doppelte Erwähnung Moses wird beibehalten: Mose und Aaron führen die Musterung gemeinsam durch, während Jahwes Weisung „durch Mose“ vermittelt wird. Die Spannung wird nicht eingeebnet.'
translation_notes:
  register: Moderne, würdige Standardsprache. „Gemusterte“ und „Sippen“ passen zum Erfassungs- und Dienstkontext; „Zelt der Begegnung“ bleibt verständlich und nah an der hebräischen Bezeichnung.
