  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: de
  text: 'von dreißig Jahren an aufwärts bis zum Alter von fünfzig Jahren: alle, die zum Dienst[a] antreten, um die Arbeit am Zelt der Begegnung zu verrichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »Dienst« wiedergegebene hebräische Wort צָבָא kann auch »Dienstpflicht«, »Heerschar« oder »Truppe« bedeuten. Hier bezeichnet es den geordneten Dienst der Leviten am Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: von dreißig Jahren an aufwärts
  rationale: Die hebräische Altersformel mit בֶּן bezeichnet das Lebensalter; וָמַעְלָה markiert die untere Grenze einschließlich der darüberliegenden Jahrgänge. Die deutsche Formulierung ist knapp und für eine amtliche Altersangabe natürlich.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: bis zum Alter von fünfzig Jahren
  rationale: Gibt die obere Grenze des genannten Altersbereichs klar und idiomatisch wieder, ohne über die Frage der exakten Ein- oder Ausschließlichkeit hinauszugehen.
- source_word: כָּל בָּא לַצָּבָא
  choice: alle, die zum Dienst antreten
  rationale: Das Partizip בָּא bedeutet wörtlich »kommend/eintretend«; zusammen mit לַצָּבָא bezeichnet es hier das Antreten zu einem geordneten levitischen Dienst. Die Formulierung bewahrt sowohl die Bewegungsvorstellung als auch den institutionellen Zusammenhang.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: um die Arbeit … zu verrichten
  rationale: Die Infinitivkonstruktion drückt den Zweck aus. »Arbeit verrichten« ist würdig und entspricht dem konkreten Sinn von מְלָאכָה.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: בְּ kann in diesem Zusammenhang den Ort beziehungsweise den Arbeitsbereich bezeichnen. »Am« vermeidet die unnötige Verengung auf Tätigkeiten ausschließlich im Inneren des Zeltes; »Zelt der Begegnung« gibt אֹהֶל מוֹעֵד transparent und eingebürgert wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Altersformel bleibt knapp und listenartig. »Zum Dienst antreten« bildet die Verbindung von בָּא und צָבָא natürlich ab, ohne einen militärischen Sinn in den Haupttext einzutragen.
