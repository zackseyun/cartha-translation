  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: de
  text: Sie sollen die Zeltbahnen der Wohnung tragen, das Zelt der Begegnung mit seiner Decke, die darüberliegende Tachaschdecke[a] und den Vorhang für den Eingang des Zeltes der Begegnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes תַּחַשׁ (Tachasch) ist unsicher. Es kann eine Tierart, eine Tierhaut oder ein bestimmtes Material bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Sie sollen … tragen
  rationale: נשׂא bezeichnet hier das Tragen der Heiligtumsteile beim Transport; die deutsche Formulierung gibt den verpflichtenden Zukunftssinn natürlich wieder.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: die Zeltbahnen der Wohnung
  rationale: יְרִיעֹת sind die einzelnen Stoffbahnen der Zeltanlage. „Wohnung“ gibt מִשְׁכָּן als Bezeichnung des Heiligtums wieder und wahrt den Bezug zum Wohnen Gottes.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung bewahrt sowohl den baulichen Sinn von אֹהֶל als auch die Funktion des Ortes, an dem Gott Mose begegnet.
- source_word: מִכְסֵהוּ
  choice: samt seiner Decke
  rationale: Das Suffix bezieht sich auf das Zelt der Begegnung. „Samt“ macht die sachliche Zuordnung flüssig, ohne die Art dieser Decke näher festzulegen.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: die Decke aus Tachaschleder
  rationale: Die Bedeutung von תַּחַשׁ ist unsicher. Die lautnahe Wiedergabe vermeidet eine unbelegte Festlegung auf eine bestimmte Tierart oder Lederqualität.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: die oben darüberliegt
  rationale: Die Formulierung gibt die Lage dieser Decke als oberste Schicht knapp und idiomatisch wieder.
- source_word: מָסַךְ פֶּתַח
  choice: den Vorhang am Eingang
  rationale: מָסָךְ bezeichnet hier einen abschirmenden textilen Vorhang; „am Eingang“ gibt die Beziehung zum Zelteingang natürlich wieder.
theological_decisions:
- issue: Wiedergabe von מִשְׁכָּן
  choice: Wohnung
  alternative: Stiftshütte / Heiligtumszelt
  rationale: „Wohnung“ bewahrt die Grundbedeutung der hebräischen Bezeichnung und ihren theologischen Bezug auf Gottes Wohnen, ohne eine konfessionell geprägte traditionelle Benennung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählungsstruktur des Hebräischen bleibt erhalten; „samt“ und „die oben darüberliegt“ sorgen zugleich für natürliche Lesbarkeit. Der Fußnotenmarker steht unmittelbar bei dem unsicheren Ausdruck.
