  text: בְּנֵ֖י מְרָרִ֑י לְ/מִשְׁפְּחֹתָ֥/ם לְ/בֵית אֲבֹתָ֖/ם תִּפְקֹ֥ד אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: de
  text: Die Söhne Meraris[a] sollst du nach ihren Sippen, nach ihren Vaterhäusern[b] zählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Nachkommen Meraris« oder »die Merariter«.'
    reason: lexical_alternative
  - marker: b
    text: »Vaterhäuser« ist eine genealogische Bezeichnung für nach väterlicher Abstammung gegliederte Familienverbände.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: die Söhne Meraris
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten; im Zusammenhang der Zählung umfasst sie die männlichen Nachkommen beziehungsweise die Merariter.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die verwandtschaftlichen Untergruppen innerhalb des Stammes; »Sippen« ist im Deutschen präziser als das allgemeinere »Familien«.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Die feste genealogische Wendung bezeichnet patrilineare Haushalts- beziehungsweise Abstammungsverbände; »Vaterhäuser« bewahrt die israelitische Sozialstruktur.
- source_word: תִּפְקֹד
  choice: sollst du … zählen
  rationale: פקד meint in diesem Zählungskontext das Erfassen beziehungsweise Registrieren; »zählen« ist klar, natürlich und ohne zusätzliche militärische Festlegung.
- source_word: אֹתָם
  choice: sie
  rationale: Das direkte Objekt verweist auf die Söhne beziehungsweise Nachkommen Meraris und wird im Deutschen als Pronomen wiedergegeben.
