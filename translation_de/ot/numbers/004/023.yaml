base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: de
  text: 'Vom Alter von dreißig Jahren an bis zum Alter von fünfzig Jahren sollst du sie zählen: jeden, der zum Dienst antritt, um die Arbeit im Zelt der Begegnung zu verrichten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Dienstpflicht antritt“. Die hebräische Wendung verwendet militärisch geprägte Sprache bildlich für den geordneten Dienst am Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: Vom Alter von dreißig Jahren an bis zum Alter von fünfzig Jahren
  rationale: Die hebräische Altersformel mit בֶּן bezeichnet eine Altersspanne und keine Sohnschaft. Die deutsche Formulierung gibt Anfang und Obergrenze klar und würdevoll wieder.
- source_word: תִּפְקֹד אֹתָם
  choice: sollst du sie mustern
  rationale: פקד bezeichnet hier das geordnete Erfassen beziehungsweise Zählen dienstfähiger Leviten. „Mustern“ passt zum administrativen Kontext und nimmt zugleich den im folgenden צבא-Ausdruck anklingenden Dienstcharakter auf.
- source_word: כָּל הַבָּא
  choice: jeden, der … antritt
  rationale: Das substantivierte Partizip mit כָּל bezeichnet jeden Einzelnen aus der betreffenden Gruppe. „Jeden, der … antritt“ ist im Deutschen natürlich und passt zum organisierten Dienst.
- source_word: לִצְבֹא צָבָא
  choice: zum Dienst antritt
  rationale: Die figura etymologica aus צבא bezeichnet das Antreten zu einem geordneten Dienst und hat militärische Färbung, meint hier aber den levitischen Heiligtumsdienst. Die Formulierung bewahrt den Anklang, ohne einen Kampfeinsatz zu behaupten.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: um die Arbeit … zu verrichten
  rationale: Die Verbindung von Verb und stammverwandtem Substantiv betont die tatsächliche Ausführung der zugewiesenen Arbeit. „Die Arbeit verrichten“ ist idiomatisch und sachlich.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: בְּ kann im vorliegenden Dienstkontext den Ort beziehungsweise Wirkungsbereich bezeichnen. „Am Zelt der Begegnung“ schließt Tätigkeiten am und im Heiligtum ein und gibt den feststehenden Namen verständlich wieder.
theological_decisions:
- issue: Soll die צבא-Wortgruppe ausdrücklich militärisch wiedergegeben werden?
  choice: „zum Dienst antritt“ als kultischer Dienst mit erkennbarem organisatorischem Anklang
  alternative: „zum Heeresdienst antritt“ oder „Kriegsdienst leistet“
  rationale: Der unmittelbare Zusammenhang handelt von den Aufgaben der Leviten am Zelt der Begegnung, nicht von Kampfhandlungen. Eine ausdrücklich militärische Wiedergabe würde daher leicht einen falschen Sachbezug erzeugen; die Fußnote hält die sprachliche Färbung dennoch offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Mustern“ ist bewusst als präziser Ausdruck für das geordnete Erfassen der Dienstfähigen gewählt; die doppelte Dienstterminologie des Hebräischen wird ohne schwerfällige deutsche Wiederholung wiedergegeben.
