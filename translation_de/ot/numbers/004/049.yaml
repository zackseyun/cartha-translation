  to: Auf Befehl Jahwes[a] wurden sie durch Mose[b] gezählt, jeder Einzelne entsprechend seinem Dienst und seiner zu tragenden Last; und seine Zuweisung[c] erfolgte so, wie Jahwe es Mose befohlen hatte.
  rationale: Die Revision ersetzt die zu allgemeine administrative Umschreibung »erfasst« durch »gezählt«, da der Abschnitt die Registrierung der Leviten zählt und einteilt. Außerdem wird die konkrete Tragebedeutung von מַשָּׂא natürlicher und eindeutiger ausgedrückt. Die umstrittene Wiedergabe von וּפְקֻדָיו als »seine Zuweisung« bleibt im Haupttext bestehen, während die Fußnote die relevanten Alternativen bewahrt.
