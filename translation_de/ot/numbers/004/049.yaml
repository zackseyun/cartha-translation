base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: de
  text: Auf Befehl Jahwes[a] wurden sie durch Mose[b] gezählt, jeder Einzelne entsprechend seinem Dienst und seiner zu tragenden Last; und seine Zuweisung[c] erfolgte so, wie Jahwe es Mose befohlen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach dem Mund Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »durch die Hand Moses«; gemeint sein kann auch: »unter Moses Leitung«.'
    reason: lexical_alternative
  - marker: c
    text: 'Der schwierige hebräische Ausdruck kann auch als »seine Bestellung«, »sein Verantwortungsbereich« oder »die ihm Anvertrauten« verstanden werden; manche verstehen den Satz: »Und sie wurden von ihm gezählt, wie Jahwe es Mose befohlen hatte.«'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: Auf Befehl Jahwes
  rationale: Die Wendung bedeutet wörtlich »nach dem Mund Jahwes«, ist hier aber idiomatisch als Handeln auf göttlichen Befehl zu verstehen. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: פָּקַד אֹתָם
  choice: wurden sie … erfasst
  rationale: פקד bezeichnet im Zusammenhang der levitischen Zählung das amtliche Erfassen beziehungsweise Registrieren. »Erfasst« lässt den administrativen Sinn erkennen, ohne den Vorgang auf bloßes Zählen zu verengen.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Das Idiom »durch die Hand Moses« bezeichnet hier Mose als vermittelnde beziehungsweise ausführende Person. Die natürliche deutsche Wiedergabe lautet »durch Mose«.
- source_word: אִישׁ אִישׁ
  choice: jeder Einzelne
  rationale: Die Wiederholung hat distributive Bedeutung und hebt die individuelle Erfassung und Zuweisung hervor.
- source_word: עַל עֲבֹדָתוֹ
  choice: entsprechend seinem Dienst
  rationale: עֲבֹדָה bezeichnet hier die jeweilige Dienstaufgabe am Heiligtum; »entsprechend« gibt den zuordnenden Sinn von עַל im Satzgefüge wieder.
- source_word: וְעַל מַשָּׂאוֹ
  choice: und seiner Traglast
  rationale: מַשָּׂא meint hier konkret die beim Transport des Heiligtums zu tragende Last. »Traglast« ist präziser als das möglicherweise nur bildlich verstandene »Last«.
- source_word: וּפְקֻדָיו
  choice: und seine Zuweisung
  rationale: Die schwierige Form aus der Wurzel פקד kann eine Zuweisung, Bestellung oder einen anvertrauten Zuständigkeitsbereich bezeichnen. Die Wiedergabe hält den Bezug auf den zuvor genannten Einzelnen fest, ohne den Ausdruck mit dem ersten פקד gleichzusetzen.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: erfolgte so, wie Jahwe es Mose befohlen hatte
  rationale: Die Ergänzung »erfolgte so« bildet im Deutschen einen klaren Satz und versteht den Relativsatz als Aussage darüber, dass die Zuweisung dem an Mose ergangenen Befehl entsprach.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug und Bedeutung von וּפְקֻדָיו
  choice: seine Zuweisung
  alternative: die ihm Anvertrauten; und sie wurden von ihm erfasst
  rationale: Die Form und der knappe Satzbau lassen mehrere Deutungen zu. Der Haupttext folgt dem distributiven Bezug auf »jeder Einzelne«; eine Fußnote bewahrt die wesentlichen Alternativen, ohne die grammatische Spannung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Erfasst« und »Zuweisung« spiegeln den administrativen Zusammenhang wider; »Traglast« wahrt zugleich den konkreten Bezug auf den Transport der Heiligtumsgeräte. Die Satzstellung bleibt nah am Hebräischen, wird aber für heutige Leser flüssig gestaltet.
