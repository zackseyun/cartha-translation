  yaml_path: translation/ot/numbers/004/036.yaml
  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: de
  text: Und die nach ihren Sippen Gemusterten waren zweitausendsiebenhundertfünfzig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Und … betrug
  rationale: Das Waw mit der Verbform von היה führt die Erzählung beziehungsweise das Ergebnis fort. Im Deutschen gibt „Und … betrug“ die kopulative Aussage in Verbindung mit einer Zahlenangabe natürlich wieder.
- source_word: פְקֻדֵיהֶם
  choice: die Zahl derer, die aus ihnen … gezählt worden waren
  rationale: Die Form von פקד bezeichnet im Kontext der Musterung die Erfassten beziehungsweise deren Zählung. Die Wiedergabe bewahrt den passiven Sinn, ohne ein im Vers nicht ausdrücklich genanntes „Männer“ hinzuzufügen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die familiäre Untergliederung innerhalb des Stammes. „Sippen“ ist in diesem Zählungskontext präzise und verständlich.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: zweitausendsiebenhundertfünfzig
  rationale: Die hebräische Kardinalzahl wird vollständig und mit unverändertem Zahlenwert in üblicher deutscher Schreibweise wiedergegeben.
