  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: de
  text: 'und für das Gemeinschaftsopfer[a]: zwei Rinder[b], fünf Widder, fünf Ziegenböcke und fünf einjährige männliche Lämmer. Das war die Opfergabe Pagiëls, des Sohnes Ochrans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Friedensopfer“ oder „Heilsopfer“; der hebräische Ausdruck bezeichnet eine bestimmte Opferart und kann mit Frieden, Gemeinschaft und Wohlergehen verbunden werden.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch bezeichnet das Wort allgemein Rindvieh; traditionell wird hier auch „zwei Stiere“ übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: und für das Gemeinschaftsopfer
  rationale: Die Präfixe führen den nächsten Posten der Opferliste ein. „Gemeinschaftsopfer“ bezeichnet die kultische Opferart verständlich, ohne die mögliche Bedeutungsbreite von שְׁלָמִים zu verengen; traditionelle Alternativen stehen in der Fußnote.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר ist eine kollektive Bezeichnung für Rindvieh und legt hier das Geschlecht nicht ausdrücklich fest. „Zwei Rinder“ ist im Deutschen natürlich und genauer als „zwei Stiere“.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet ausdrücklich männliche Schafe; „Widder“ ist die übliche präzise deutsche Entsprechung.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתֻּדִים bezeichnet männliche Ziegen. „Ziegenböcke“ ist präzise und in modernem Deutsch geläufig.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige männliche Lämmer
  rationale: כְּבָשִׂים bezeichnet hier männliche Lämmer, und בְּנֵי שָׁנָה gibt ihr Alter mit einem Jahr an. Die ausdrückliche Geschlechtsangabe bewahrt die lexikalische Unterscheidung des Hebräischen.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: Die Wendung schließt die wiederkehrende Aufzählungsformel ab. Das Präteritum passt zum deutschen Erzählzusammenhang; „Opfergabe“ gibt קָרְבָּן als dargebrachte Gabe wieder.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: Pagiëls, des Sohnes Ochrans
  rationale: Die Namen werden in geläufiger deutscher Form transliteriert. Die Genitivkonstruktion gibt die Zugehörigkeit der Opfergabe und das Patronymikon natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von הַשְּׁלָמִים
  choice: Gemeinschaftsopfer
  alternative: Friedensopfer; Heilsopfer
  rationale: Der hebräische Kultbegriff kann mit Frieden, Wohlergehen und Gemeinschaft verbunden werden. Der Haupttext verwendet eine verständliche Bezeichnung; die Fußnote bewahrt die etablierten Alternativen, ohne eine einzelne Deutung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listenstruktur des hebräischen Textes bleibt erhalten; ein abschließendes „und“ macht die deutsche Aufzählung natürlich. Sämtliche Fußnotenmarker stehen an der jeweils sachlich passenden Stelle im Haupttext.
