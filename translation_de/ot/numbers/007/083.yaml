  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: de
  text: 'Und als Heilsopfer: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige männliche Lämmer. Das war die Opfergabe Ahiras, des Sohnes Enans.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: Und als Heilsopfer
  rationale: Die Wendung führt den nächsten Teil der Opferliste ein. „Heilsopfer“ ist im Deutschen ein geläufiger kultischer Fachausdruck für זֶבַח שְׁלָמִים und lässt dessen Bedeutungsbreite offen, ohne eine bestimmte Deutung wie Gemeinschaft oder Wohlergehen festzuschreiben.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר ist eine kollektive Bezeichnung für Rindvieh; das Hebräische legt hier kein Geschlecht fest. „Zwei Rinder“ ist präzise und natürlich.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִים bezeichnet spezifisch männliche Schafe; „Widder“ ist die genaue deutsche Entsprechung.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתּוּדִים bezeichnet männliche Ziegen. „Ziegenböcke“ gibt Tierart und Geschlecht eindeutig wieder.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige männliche Lämmer
  rationale: כְּבָשִׂים bezeichnet hier männliche Lämmer, und בְּנֵי שָׁנָה nennt ihr Alter. Die Formulierung bewahrt beide Angaben klar.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: Die Wendung bildet die abschließende Identifikationsformel. Das Präteritum passt zum erzählenden Kontext; „Opfergabe“ unterscheidet קָרְבָּן sprachlich vom zuvor genannten Schlachtopfer.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: Ahiras, des Sohnes Enans
  rationale: Die Namen werden transliteriert; die Genitivform gibt das Besitzverhältnis und die hebräische Abstammungsangabe natürlich wieder.
theological_decisions:
- issue: Bedeutungsbreite von הַשְּׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer; Wohlergehensopfer
  rationale: Der kultische Begriff kann mit Frieden, Wohlergehen und Gemeinschaft verbunden werden. „Heilsopfer“ ist eine etablierte, knappe deutsche Wiedergabe, die keine einzelne dieser Nuancen exklusiv festlegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper Listenstruktur. Kultische Fachbegriffe bleiben verständlich; unnötig altertümliche Formen werden vermieden.
