  text: Am elften Tag war Pagïel, der Sohn Ochrans, das Oberhaupt der Söhne Aschers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne Aschers“; gemeint sind die Angehörigen des Stammes Ascher.'
