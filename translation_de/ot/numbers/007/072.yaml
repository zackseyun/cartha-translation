lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: Am elften Tag
  rationale: Die im Hebräischen wiederholte Tagesformel wird in natürlichem Deutsch knapp wiedergegeben; die zeitliche Einordnung bleibt vollständig erhalten.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: elften
  rationale: Die Zahlform bezeichnet innerhalb der fortlaufenden Abfolge von Numeri 7 den elften Tag und wird im Deutschen idiomatisch als Ordinalzahl übersetzt.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Das Wort bezeichnet hier das anerkannte Oberhaupt beziehungsweise den Vertreter eines Stammes. „Anführer“ ist verständlich und vermeidet die königlichen Nebenbedeutungen von „Fürst“.
- source_word: לִ/בְנֵי אָשֵׁר
  choice: der Söhne Aschers
  rationale: Die Formulierung bewahrt den hebräischen Verwandtschaftsausdruck und bezeichnet zugleich die Stammeszugehörigkeit.
- source_word: פַּגְעִיאֵל
  choice: Pagiël
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: בֶּן עָכְרָן
  choice: der Sohn Ochrans
  rationale: Das hebräische Patronymikon wird im Deutschen regulär mit „Sohn“ wiedergegeben; „Ochran“ folgt der gebräuchlichen deutschen Namensform.
