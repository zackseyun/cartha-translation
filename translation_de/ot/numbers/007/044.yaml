  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: de
  text: eine goldene Schale, zehn Schekel schwer,[a] mit Räucherwerk gefüllt;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet das Hebräische knapp: »eine goldene Schale, zehn [an Gold], mit Räucherwerk gefüllt«. Die Gewichtseinheit »Schekel« ist nach der im Kapitel wiederholten Gewichtsformel ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im wiederkehrenden Inventar von Numeri 7 bezeichnet das Wort ein kleines Gefäß für Räucherwerk. »Schale« ist im modernen Deutschen natürlich und legt die Form weniger eng fest als »Löffel«.
- source_word: אַחַת
  choice: eine
  rationale: Das Zahlwort stimmt mit dem femininen Substantiv כַּף überein; im Deutschen wird es durch den unbestimmten Artikel beziehungsweise das Zahlwort »eine« wiedergegeben.
- source_word: עֲשָׂרָה זָהָב
  choice: zehn Schekel schwer
  rationale: Die knappe hebräische Wendung nennt Zahl und Material, während die Gewichtseinheit aus der wiederholten Formel des Kapitels zu ergänzen ist. Die deutsche Fassung macht die Gewichtsangabe verständlich, ohne »Goldschekel« als besondere Einheit zu suggerieren.
- source_word: מְלֵאָה
  choice: gefüllt
  rationale: Das prädikative Adjektiv beschreibt den Inhalt des Gefäßes. »Mit … gefüllt« ist idiomatisches, knappes Deutsch.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Das Wort bezeichnet die aromatische Substanz für die kultische Räucherung; »Räucherwerk« ist dafür die präzise und geläufige deutsche Bezeichnung.
