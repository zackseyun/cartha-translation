  language: de
  text: je einen Stier aus dem Rinderbestand[a], je einen Widder, je ein einjähriges männliches Lamm[b] als Brandopfer;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen Stier, Sohn des Rindviehs«. Die hebräische Wendung bezeichnet ein Rind aus dem Rinderbestand und wird häufig als Hinweis auf einen jungen Stier verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ein männliches Lamm, Sohn seines Jahres«; gemeint ist ein männliches Lamm, das ein Jahr alt ist oder in seinem ersten Lebensjahr steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen Stier aus der Rinderherde
  rationale: פַּר bezeichnet einen Stier; בֶּן בָּקָר ist wörtlich »Sohn des Rindviehs/der Herde« und ordnet das Tier idiomatisch der Rinderherde zu. Die Formulierung ist im Deutschen natürlich und bewahrt die Klassifizierung.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist die übliche Bezeichnung für einen ausgewachsenen männlichen Schafbock, hier in einer Opferliste.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ein männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet spezifisch ein männliches Lamm; die Geschlechtsangabe bleibt im Opferkontext ausdrücklich erhalten.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjähriges
  rationale: Die hebräische Wendung bedeutet wörtlich »Sohn seines Jahres« und bezeichnet ein Tier von einem Jahr beziehungsweise in seinem ersten Lebensjahr.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist die feste Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wird; »als« gibt hier die Bestimmung der aufgezählten Tiere natürlich wieder.
