  yaml_path: translation/ot/numbers/007/036.yaml
  text: On the fifth day Shelumiel son of Zurishaddai[a], leader of the sons of Simeon,
translation:
  language: de
  text: 'Am fünften Tag: Schelumiël, Sohn Zurischaddais, Anführer der Söhne Simeons[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Anführer für die Söhne Simeons. Wörtlich steht: „Söhne Simeons“.'
    reason: Die Präposition ל kann hier neben Zugehörigkeit auch Vertretung ausdrücken; die Fußnote bewahrt diese Alternative, ohne „Söhne“ zu „Nachkommen“ zu erweitern.
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Am fünften Tag
  rationale: Die Präposition mit bestimmtem ordinalem Ausdruck wird im Deutschen idiomatisch so wiedergegeben; eine Ergänzung wie „der Einweihung“ steht nicht ausdrücklich im Vers.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Das Wort bezeichnet hier das anerkannte Oberhaupt einer Stammesgruppe. „Anführer“ ist verständlich und vermeidet den möglicherweise königlichen Beiklang von „Fürst“.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: der Nachkommen Simeons
  rationale: Die Wendung bezeichnet die Zugehörigkeit zu beziehungsweise Vertretung von Simeons Stammesgruppe. „Nachkommen“ gibt die kollektive Bedeutung von בְּנֵי im heutigen Deutsch natürlich wieder; die wörtlichere Form und die mögliche Nuance von ל werden in der Fußnote bewahrt.
- source_word: שְׁלֻמִיאֵל
  choice: Schelumiël
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren Form transliteriert; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die Patronymform wird als deutsche Apposition natürlich mit Artikel wiedergegeben.
- source_word: צוּרִישַׁדָּי
  choice: Zurischaddai
  rationale: Der Personenname wird transliteriert und nicht übersetzt.
