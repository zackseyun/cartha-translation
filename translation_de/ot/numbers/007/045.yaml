translation:
  language: de
  text: einen Stier aus der Rinderherde, einen Widder und ein einjähriges männliches Lamm zum Brandopfer;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen jungen Stier aus der Rinderherde
  rationale: פַּר bezeichnet im Opferkontext einen jungen Stier; בֶּן בָּקָר ordnet ihn dem Rindvieh beziehungsweise der Rinderherde zu. Die Formulierung ist natürlich und erhält die nähere Bestimmung.
- source_word: אֶחָד
  choice: einen
  rationale: Die wiederholte Zahl bezeichnet jeweils genau ein Opfertier. Im Deutschen wird sie bei jedem Tier wiedergegeben, wobei beim dritten Tier das gleichbedeutende »ein« in »einjähriges« nicht die Stückzahl ausdrückt; daher steht zusätzlich der unbestimmte Artikel.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist die übliche Bezeichnung für ein ausgewachsenes männliches Schaf, besonders in Opfertexten.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ein männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet hier ein männliches Lamm. »männliches Lamm« macht die im hebräischen Wort enthaltene Geschlechtsangabe ausdrücklich.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjähriges
  rationale: Die hebräische Altersformel bezeichnet ein Tier im ersten Lebensjahr beziehungsweise von einem Jahr. »einjährig« ist die knappe, geläufige deutsche Formulierung für Opferlisten.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig auf dem Altar verbrannte Opfer. »als Brandopfer« fügt sich natürlich in die Aufzählung ein.
theological_decisions:
- issue: Bedeutung von עֹלָה
  choice: Brandopfer
  alternative: Ganzopfer
  rationale: »Brandopfer« ist der etablierte und allgemein verständliche deutsche Opferbegriff. Der Gedanke des vollständigen Verbrennens wird dadurch bezeichnet, ohne zusätzliche kulttheologische Deutung in den Vers einzutragen.
translation_notes:
  register: Knappe, würdige Listenform in modernem Standarddeutsch. Die dreifache Einzelzählung und die kultischen Tierbezeichnungen bleiben erhalten; das Semikolon entspricht dem fortlaufenden Charakter der Opferliste.
