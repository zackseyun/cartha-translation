base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/066.yaml
  text: 'On the tenth day, the leader of the sons of Dan was Ahiezer son of Ammishaddai:'
translation:
  language: de
  text: 'Am zehnten Tag war der Anführer der Nachkommen Dans Ahieser, der Sohn Ammischaddais:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: Am zehnten Tag
  rationale: Die Präposition ב mit יוֹם bezeichnet hier innerhalb der fortlaufenden Aufzählung den Zeitpunkt; „am“ ist die natürliche deutsche Wiedergabe. Das Ordinalzahlwort wird direkt mit „zehnten“ wiedergegeben.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Das Wort bezeichnet hier das anerkannte Oberhaupt beziehungsweise den Repräsentanten eines Stammes. „Anführer“ ist verständlich und vermeidet die königlichen Nebenbedeutungen von „Fürst“.
- source_word: לִבְנֵי דָן
  choice: der Nachkommen Dans
  rationale: Die Wendung bezeichnet die von ihm vertretene Gruppe. „Nachkommen Dans“ bewahrt den genealogischen Ausdruck בני und klingt im modernen Deutschen natürlicher als „Söhne Dans“.
- source_word: אֲחִיעֶזֶר
  choice: Ahiëser
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamenform transliteriert; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die übliche patronymische Angabe wird direkt als „der Sohn“ wiedergegeben und appositiv in den deutschen Satz eingefügt.
- source_word: עַמִּישַׁדָּי
  choice: Ammischaddais
  rationale: Der Personenname wird transliteriert; der deutsche Genitiv ermöglicht eine natürliche Wiedergabe von „Sohn des Ammischaddai“ ohne unnötige Schwere.
theological_decisions: []
