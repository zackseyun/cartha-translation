base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe bestand aus einer silbernen Schale[a], die 130 Schekel wog, und einem silbernen Becken[b], das 70 Schekel wog, nach dem Schekel des Heiligtums[c]. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, für ein Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Platte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schüssel“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: nach dem am Heiligtum geltenden Gewichtsstandard.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet hier die kultische Opfergabe. „bestand aus“ führt die folgende Aufzählung im Deutschen natürlich ein.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: einer silbernen Schale
  rationale: קְעָרָה bezeichnet ein eher flaches Gefäß beziehungsweise eine Schale; die genaue Gefäßform bleibt unsicher und wird in einer Fußnote kenntlich gemacht.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: die 130 Schekel wog
  rationale: Gibt die hebräische Gewichtsangabe idiomatisch und vollständig wieder.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: einem silbernen Becken
  rationale: מִזְרָק ist ein kultisch verwendetes Gefäß, das als Becken oder Schüssel verstanden werden kann; „Becken“ unterscheidet es im Haupttext von קְעָרָה.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: das 70 Schekel wog
  rationale: Die elliptische Gewichtsangabe wird im Deutschen durch ein Verb verdeutlicht.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Bewahrt die Formulierung des Ausgangstextes und bezeichnet den am Heiligtum geltenden Gewichtsstandard.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren … gefüllt
  rationale: Der ausdrückliche Rückverweis auf beide Gefäße bleibt erhalten.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Übliche und präzise Bezeichnung für das feine, für Opfer verwendete Mehl.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip bezeichnet das Vermischen des Feinmehls mit Öl; „vermengt“ ist würdig, verständlich und sachlich genau.
- source_word: לְמִנְחָה
  choice: für ein Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext das aus pflanzlichen Erzeugnissen bereitete Speiseopfer.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung wird syntaktisch geglättet, ohne Angaben oder den kultischen Charakter zu verlieren; die unsichere Gefäßterminologie wird durch knappe Alternativen in Fußnoten offengehalten.
