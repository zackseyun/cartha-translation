  yaml_path: translation/ot/numbers/007/024.yaml
  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: de
  text: Am dritten Tag war der Anführer der Söhne Sebulons[a] Eliab, Sohn Helons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Anführer für die Söhne Sebulons“. Die hebräische Präposition kann hier Zugehörigkeit oder Vertretung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: Am … Tag
  rationale: Die Präposition ב mit יוֹם bezeichnet in dieser Erzählformel den Zeitpunkt; „am … Tag“ ist die natürliche deutsche Wiedergabe.
- source_word: הַשְּׁלִישִׁי
  choice: dritten
  rationale: Das Ordinalzahlwort bestimmt „Tag“ und wird im Deutschen entsprechend flektiert.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: נָשִׂיא bezeichnet hier das anerkannte Oberhaupt eines Stammes. „Anführer“ ist verständlich und vermeidet den irreführenden königlichen Beiklang von „Fürst“.
- source_word: לִבְנֵי
  choice: der Söhne
  rationale: ל kennzeichnet hier die Zugehörigkeit beziehungsweise Vertretung; „der Söhne“ bewahrt sowohl den Stammesbezug als auch die genealogische Ausdrucksweise. Die mögliche Wiedergabe mit „für“ wird in der Fußnote genannt.
- source_word: זְבוּלֻן
  choice: Sebulons
  rationale: Übliche deutsche Form des Stammesnamens, hier als Genitivattribut.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Übliche deutsche Wiedergabe des Personennamens.
- source_word: בֶּן
  choice: der Sohn
  rationale: Gibt die hebräische Vatersnamensformel in natürlichem Deutsch wieder.
- source_word: חֵלֹן
  choice: Helons
  rationale: Übliche deutsche Wiedergabe des Personennamens im Genitiv.
