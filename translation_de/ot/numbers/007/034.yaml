  rationale: Der unmittelbare Kontext zählt Opfergaben auf; daher bezeichnet das Substantiv hier die Opferkategorie. Die Übersetzung bleibt beim kultischen Sinn des hebräischen Textes, ohne spätere theologische Deutungen einzutragen.
