- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Fügung bezeichnet idiomatisch ein männliches Tier der Ziegen. „Ziegenbock“ ist im modernen Deutschen klar, natürlich und für den Opferkontext genau.
- source_word: אֶחָד
  choice: einen
  rationale: Der Zahlwert „einer“ bleibt durch den Akkusativ „einen“ ausdrücklich erhalten und wahrt den aufzählenden Charakter des Abschnitts.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת die Opferart „Sündopfer“, nicht lediglich die abstrakte Sünde. „Als“ gibt die Funktion des Tieres in dieser Opferliste natürlich wieder.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im kultischen Zusammenhang
  choice: Sündopfer
