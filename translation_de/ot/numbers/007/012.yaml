  text: וַ/יְהִ֗י הַ/מַּקְרִ֛יב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן אֶת קָרְבָּנ֑/וֹ נַחְשׁ֥וֹן בֶּן עַמִּינָדָ֖ב לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: de
  text: Am ersten Tag brachte Nachschon, der Sohn Amminadabs, vom Stamm Juda[a] seine Opfergabe dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Stamm Juda“. Die hebräische Wendung kann sowohl Nachschons Zugehörigkeit zum Stamm Juda als auch sein Handeln als dessen Vertreter hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: brachte … dar
  rationale: Die hebräische Erzählungsform leitet die Aussage ein. Im modernen Deutschen wird sie natürlich durch den finiten Erzählungssatz wiedergegeben, ohne die altertümliche Formel „Und es geschah“.
- source_word: הַמַּקְרִיב
  choice: brachte … dar
  rationale: Das Hifil-Partizip von קרב bezeichnet hier das kultische Heranbringen beziehungsweise Darbringen. Die finite Form ist im Deutschen natürlicher und bewahrt den kultischen Sinn.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: am ersten Tag
  rationale: Natürliche deutsche Wiedergabe der hebräischen Zeitangabe.
- source_word: אֶת קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן bezeichnet im Kontext der Einweihung des Heiligtums eine kultische Gabe. „Opfergabe“ ist präziser als das allgemeinere „Gabe“.
- source_word: נַחְשׁוֹן
  choice: Nachschon
  rationale: Im Deutschen gebräuchliche bibelsprachliche Umschrift des hebräischen Personennamens.
- source_word: בֶּן עַמִּינָדָב
  choice: der Sohn Amminadabs
  rationale: Natürliche deutsche Wiedergabe des hebräischen Patronyms.
- source_word: לְמַטֵּה יְהוּדָה
  choice: für den Stamm Juda
  rationale: מַטֶּה bedeutet hier „Stamm“; die Präposition ל kann die Zuordnung oder Vertretung ausdrücken. „Für den Stamm Juda“ bewahrt den Gedanken, dass Nachschon den Stamm bei der Darbringung vertritt.
