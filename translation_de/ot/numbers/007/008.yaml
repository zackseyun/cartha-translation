  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: de
  text: Die vier Wagen und die acht Rinder gab er den Söhnen Meraris, entsprechend ihrem Dienst, unter der Leitung Itamars, des Sohnes des Priesters Aaron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: Wagen
  rationale: עֲגָלָה bezeichnet ein Fahrzeug mit Rädern. »Wagen« ist im Deutschen natürlich und passt zum Transport des Heiligtums.
- source_word: הַבָּקָר
  choice: Rinder
  rationale: בָּקָר bezeichnet Rinder; hier sind Zugtiere gemeint. »Rinder« gibt den hebräischen Ausdruck präzise wieder, ohne ein bestimmtes Geschlecht vorauszusetzen.
- source_word: נָתַן
  choice: gab
  rationale: Das Verb bedeutet schlicht »geben«. Der Zusammenhang schließt eine Zuteilung ein, doch diese Nuance muss nicht ausdrücklich in das Verb eingetragen werden.
- source_word: לִבְנֵי מְרָרִי
  choice: den Söhnen Meraris
  rationale: Die familiär-stammesbezogene Formulierung des Hebräischen wird bewahrt und ist im Deutschen verständlich.
- source_word: כְּפִי עֲבֹדָתָם
  choice: entsprechend ihrem Dienst
  rationale: כְּפִי bedeutet idiomatisch »entsprechend« oder »gemäß«; עֲבֹדָה bezeichnet hier den übertragenen Dienst am Heiligtum.
- source_word: בְּיַד אִיתָמָר
  choice: unter der Leitung Itamars
  rationale: Wörtlich »durch/in der Hand Itamars«; im administrativen Zusammenhang bezeichnet die Wendung Leitung, Zuständigkeit oder Aufsicht.
- source_word: הַכֹּהֵן
  choice: des Priesters
  rationale: Der bestimmte Titel bezieht sich syntaktisch auf Aaron. »Des Sohnes des Priesters Aaron« bildet diese Zuordnung eindeutig und natürlich ab.
theological_decisions: []
