lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im Zusammenhang der Opfergaben in Numeri 7 bezeichnet das Wort ein kleines Gefäß für Räucherwerk, nicht wörtlich eine Handfläche. „Schale“ ist im modernen Deutschen natürlich und passt zum kultischen Inventar.
- source_word: אַחַת
  choice: eine
  rationale: Das Zahlwort stimmt mit dem femininen Substantiv כַּף überein.
- source_word: עֲשָׂרָה
  choice: zehn Schekel schwer
  rationale: Der hebräische Text nennt nur „zehn“ und lässt die Gewichtseinheit aus. Die wiederkehrende Opferformel in Numeri 7 macht deutlich, dass Schekel als Gewicht gemeint sind; „schwer“ fügt die Angabe natürlich in den deutschen Satz ein.
- source_word: זָהָב
  choice: goldene
  rationale: Bezeichnet das Material des Gefäßes.
- source_word: מְלֵאָה
  choice: voll
  rationale: Gibt das prädikative Adjektiv knapp und idiomatisch wieder.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Im kultischen Zusammenhang ist „Räucherwerk“ präziser als das allgemeinere „Weihrauch“, da nicht zwingend nur eine einzelne Duftsubstanz gemeint ist.
