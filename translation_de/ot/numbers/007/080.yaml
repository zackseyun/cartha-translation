  text: one golden dish of ten shekels[a], full of incense[b];
translation:
  language: de
  text: eine goldene Schale, zehn Schekel schwer[a], gefüllt mit Räucherwerk;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „eine goldene Schale, zehn [an] Gold, gefüllt mit Räucherwerk“. Die Gewichtseinheit „Schekel“ ist aus der wiederkehrenden Aufzählungsformel dieses Kapitels erschlossen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im Zusammenhang der Heiligtumsgaben bezeichnet das Wort ein kleines Gefäß für Räucherwerk. „Schale“ ist im heutigen Deutsch klarer als das traditionell mögliche „Löffel“.
- source_word: אַחַת
  choice: eine
  rationale: Das Zahlwort bezeichnet ein einzelnes Gefäß und stimmt mit dem femininen Substantiv כַּף überein.
- source_word: עֲשָׂרָה זָהָב
  choice: zehn Schekel schwer
  rationale: Die knappe hebräische Gewichtsangabe lautet wörtlich etwa „zehn [an] Gold“. Aus der wiederkehrenden Inventarformel des Kapitels ist die Gewichtseinheit Schekel zu ergänzen; „schwer“ macht die Funktion der Angabe im Deutschen deutlich.
- source_word: זָהָב
  choice: goldene
  rationale: Das Material des Gefäßes ist Gold; die attributive Wiedergabe ist im Deutschen natürlich.
- source_word: מְלֵאָה
  choice: gefüllt mit
  rationale: Das feminine Adjektiv beschreibt den Inhalt der Schale. „Gefüllt mit“ ergibt eine natürliche deutsche Formulierung.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Das Wort bezeichnet die im Heiligtumsdienst verwendete aromatische Räuchersubstanz; „Räucherwerk“ ist dafür die etablierte und sachlich genaue deutsche Bezeichnung.
theological_decisions: []
