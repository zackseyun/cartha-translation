lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Genitivverbindung bezeichnet idiomatisch ein männliches Tier aus der Gattung der Ziegen. »Ziegenbock« ist im modernen Deutschen eindeutig und für eine Opferliste natürlich.
- source_word: אֶחָד
  choice: einen
  rationale: Der Zahlbegriff »ein« bleibt ausdrücklich erhalten; die Akkusativform »einen« passt zur fortlaufenden Aufzählung und bewahrt deren inventarartigen Stil.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Im Opferkontext bezeichnet חַטָּאת das Sünd- beziehungsweise Reinigungsopfer. »Als Sündopfer« gibt die Funktion des Tieres idiomatisch wieder; die alternative kultische Nuance wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des kultischen Begriffs חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Begriff kann sowohl auf Sünde als auch auf die Beseitigung kultischer Unreinheit bezogen sein. In dieser Opferliste ist sicher, dass eine Opferart gemeint ist; »Sündopfer« ist die geläufige deutsche Bezeichnung, während »Reinigungsopfer« als sachlich mögliche Deutung in der Fußnote genannt wird.
