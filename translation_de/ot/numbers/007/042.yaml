  verdict: revise
  source_fidelity: 'Der hebräische Text ist eine nominale Einleitungsformel: Am sechsten Tag wird Eljasaf als נָשִׂיא („Anführer/Oberhaupt“) der בני גד benannt. Das Verb „brachte ... seine Gabe dar“ und das Objekt „seine Gabe“ stehen nicht in diesem Vers; die anschließende Opfergabe beginnt erst im folgenden Vers. Eine ergänzte Kopula ist im Deutschen dagegen erforderlich und gibt die Funktion der Nominalformel angemessen wieder.'
  naturalness: „Am sechsten Tag war der Anführer der Nachkommen Gads Eljasaf, der Sohn Deuels:“ ist modernes, verständliches Standarddeutsch und behält den für die folgende Aufzählung erforderlichen Doppelpunkt. Die Schreibung „Deuel“ ist im Deutschen bei diesem Namen natürlicher als die künstlich wirkende Trema-Schreibung „Dëuel“.
  terminology: „Anführer“ gibt נָשִׂיא sachgerecht wieder. „Nachkommen Gads“ ist als Wiedergabe von בני גד vertretbar und bewahrt die Abstammungsbezeichnung. Die Namensform „Deuel“ entspricht hier dem masoretischen דְּעוּאֵל; die abweichende Form „Reuel“ kann knapp erläutert werden.
  issues:
  - severity: medium
    issue: „brachte ... seine Gabe dar“ ergänzt ein Prädikat und ein Objekt, die in Numeri 7,42 nicht stehen.
    rationale: Der Vers identifiziert den Stammesführer; die Opfergabe wird in Vers 43 genannt. Die Ergänzung verändert daher die unmittelbare Aussage und sollte nicht in den Vers eingebracht werden.
  - severity: low
    issue: Die Trema-Schreibung „Dëuel“ bzw. „Rëuel“ ist für deutsche Bibelnamen unüblich.
    rationale: „Deuel“ und „Reuel“ geben die im Audit Trail behandelten Namensformen verständlich und ohne zusätzliche, nicht quellenbedingte Aussprachemarkierung wieder.
  revised_text: 'Am sechsten Tag war der Anführer der Nachkommen Gads Eljasaf, der Sohn Deuels:'
  revised_footnotes:
