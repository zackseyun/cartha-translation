    text: Der Name lautet hier im hebräischen Text „Deuel“; in verwandten Stellen begegnet auch die Form „Reuel“.
    reason: alternative_reading
  revision_rationale: Die nicht im hebräischen Vers vorhandene Darbringungsformel wurde entfernt und durch die im Deutschen notwendige Kopula zur Wiedergabe der hebräischen Nominalformel ersetzt. Die Namensschreibung wurde auf die gebräuchlichen Formen „Deuel“ und „Reuel“ vereinheitlicht. Der Doppelpunkt bleibt erhalten, da die folgende Opferauflistung angeschlossen wird.
