  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: de
  text: 'Am sechsten Tag war der Anführer der Nachkommen Gads Eljasaf, der Sohn Deuels:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Am sechsten Tag
  rationale: Die Präposition ב mit יוֹם bezeichnet in dieser Erzählformel den Zeitpunkt; zusammen mit der Ordnungszahl ergibt sich im Deutschen natürlich „Am sechsten Tag“.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Das Wort bezeichnet hier das anerkannte Oberhaupt eines Stammes. „Anführer“ ist modern und verständlich, ohne den möglicherweise königlichen Sinn von „Fürst“ nahezulegen.
- source_word: לִבְנֵי גָד
  choice: der Nachkommen Gads
  rationale: Wörtlich steht „der Söhne Gads“; gemeint ist der aus Gad hervorgegangene Stamm. „Nachkommen Gads“ bewahrt das Abstammungsmotiv und ist im Deutschen natürlich.
- source_word: אֶלְיָסָף
  choice: Eljasaf
  rationale: Der Personenname wird in einer im Deutschen lesbaren, am Hebräischen orientierten Form wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die übliche hebräische Vatersnamenformel wird direkt und natürlich wiedergegeben.
- source_word: דְּעוּאֵל
  choice: Dëuel
  rationale: Der masoretische Text dieses Verses liest דְּעוּאֵל. Die Trema-Schreibung macht kenntlich, dass die Vokale getrennt gesprochen werden.
- source_word: '[elliptisches Prädikat im Hebräischen]'
  choice: brachte ... seine Gabe dar
  rationale: Der hebräische Nominalsatz setzt in der wiederkehrenden Aufzählungsformel die Darbringung aus dem Kontext voraus. Die Ergänzung ergibt im Deutschen einen vollständigen Satz und entspricht dem Aufbau von Numeri 7; der Doppelpunkt leitet die folgende Aufzählung ein.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Stammesbezeichnung wird als „Nachkommen Gads“ statt wörtlich als „Söhne Gads“ wiedergegeben. Das im Hebräischen aufgrund der festen Wiederholungsformel ausgelassene Prädikat wird für einen vollständigen deutschen Satz aus dem Kontext ergänzt.
