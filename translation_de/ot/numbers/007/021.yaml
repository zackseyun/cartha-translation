  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: de
  text: einen Stier aus der Rinderherde[a], einen Widder und ein einjähriges männliches Lamm[b] als Brandopfer;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Stier, ein Sohn des Rindviehs“. Gemeint ist ein Rind aus der Herde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein männliches Lamm in seinem ersten Lebensjahr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: Stier
  rationale: פַּר bezeichnet einen Stier beziehungsweise jungen Stier; „Stier“ ist im Deutschen die natürliche und präzise Bezeichnung in einer Opferliste.
- source_word: אֶחָד
  choice: einen / ein
  rationale: Der dreimal wiederholte Zahlbegriff wird durch den jeweiligen unbestimmten Artikel wiedergegeben, der im Deutschen in dieser Aufzählung zugleich die Stückzahl eins ausdrückt.
- source_word: בֶּן בָּקָר
  choice: aus der Rinderherde
  rationale: Die wörtliche Wendung „Sohn des Rindviehs“ ist eine hebräische Bezeichnung für ein Tier aus dem Rinderbestand; die gewählte Formulierung ist verständlich und bewahrt den Bezug zur Herde.
- source_word: אַיִל
  choice: Widder
  rationale: Dies ist die übliche präzise deutsche Bezeichnung für ein ausgewachsenes männliches Schaf, besonders in Opfertexten.
- source_word: כֶּבֶשׂ
  choice: männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet hier ein Lamm; „männliches“ macht das grammatisch und sachlich naheliegende Geschlecht in der Opfervorschrift deutlich.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjährig
  rationale: Die hebräische Altersangabe bedeutet, dass das Lamm ein Jahr alt beziehungsweise in seinem ersten Lebensjahr ist.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist die feste Bezeichnung für das vollständig verbrannte Opfer; „als“ gibt die Funktion der Tiere in der Aufzählung natürlich wieder.
