source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: de
  text: Am neunten Tag war Abidan, der Sohn Gideonis, der Anführer der Söhne Benjamins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Anführer für die Söhne Benjamins“. Die hebräische Präposition kann hier Zugehörigkeit oder Vertretung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: Am neunten Tag
  rationale: Die Präposition בְּ mit יוֹם wird in dieser Zeitangabe im Deutschen idiomatisch mit „am“ wiedergegeben; הַתְּשִׁיעִי ist die Ordinalzahl „neunten“.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Das Wort bezeichnet hier das anerkannte Oberhaupt, das den Stamm bei der Darbringung vertritt. „Anführer“ ist verständlich und vermeidet die möglichen monarchischen Nebenbedeutungen von „Fürst“.
- source_word: לִבְנֵי בִנְיָמִן
  choice: der Söhne Benjamins
  rationale: Die Form bewahrt die familiäre Abstammungssprache des Hebräischen. Die Präposition לְ bezeichnet hier wahrscheinlich die Zugehörigkeit des Anführers zur Stammesgruppe, kann aber auch seine Vertretungsfunktion ausdrücken.
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: בֶּן גִּדְעֹנִי
  choice: der Sohn Gideonis
  rationale: Die hebräische Vatersnamensformel wird natürlich und genau als „der Sohn Gideonis“ wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische Stammesbezeichnung בְנֵי
  choice: Söhne Benjamins
  alternative: Nachkommen Benjamins; Benjaminiter
  rationale: Die maskuline familiäre Abstammungsbezeichnung des Hebräischen bleibt erhalten, ohne sie zu einer geschlechtsneutralen Volksbezeichnung umzudeuten.
- issue: Beziehung des Anführers zum Stamm durch לְ
  choice: Anführer der Söhne Benjamins
  alternative: Anführer für die Söhne Benjamins
  rationale: Der Genitiv ist im Deutschen die natürlichste Wiedergabe der wahrscheinlich gemeinten Zugehörigkeit; die mögliche repräsentative Bedeutung der Präposition wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im Hebräischen fehlende finite Verb wird für einen vollständigen deutschen Satz durch „war“ ergänzt; es führt keine zusätzliche Handlung ein. Die Namensfolge wurde für einen natürlichen deutschen Satz umgestellt.
