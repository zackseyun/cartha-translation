  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/063.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: de
  text: einen Stier aus der Rinderherde[a], einen Widder und ein einjähriges männliches Lamm als Brandopfer;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen jungen Stier, einen Widder und ein männliches Lamm in seinem ersten Lebensjahr als Brandopfer«. Die hebräischen Wendungen bedeuten wörtlich »Sohn der Rinderherde« und »Sohn seines Jahres«; idiomatisch bezeichnen sie ein Rind aus der Herde beziehungsweise ein Tier in seinem ersten Lebensjahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: Stier aus der Rinderherde
  rationale: פַּר bezeichnet im Opferkontext einen Stier; בֶּן־בָּקָר ordnet ihn idiomatisch der Rinderherde zu. Die Wiedergabe ist natürlich und bewahrt die nähere Bestimmung.
- source_word: אַיִל
  choice: Widder
  rationale: Präzise deutsche Bezeichnung für ein erwachsenes männliches Schaf und die übliche Entsprechung im Opferkontext.
- source_word: כֶּבֶשׂ
  choice: männliches Lamm
  rationale: Das Wort bezeichnet hier ein Lamm, wahrscheinlich männlichen Geschlechts; die ausdrückliche Wiedergabe wahrt die terminologische Unterscheidung der Opferliste.
- source_word: בֶּן־שְׁנָתוֹ
  choice: einjährig
  rationale: Die hebräische Wendung bezeichnet ein Tier in seinem ersten Lebensjahr beziehungsweise von einem Jahr; »einjährig« ist knapp und idiomatisch.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist der feststehende Ausdruck für das vollständig verbrannte Opfer; die Präposition לְ wird hier natürlich mit »als« wiedergegeben.
- source_word: אֶחָד
  choice: einen/ein
  rationale: Die bei jedem Tier wiederholte Zahl wird beibehalten und der deutschen Kasus- und Genusflexion angepasst.
