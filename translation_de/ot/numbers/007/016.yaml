lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Fügung bezeichnet idiomatisch ein männliches Tier aus den Ziegen. »Ziegenbock« ist im Deutschen eindeutig, natürlich und für die Opferliste passend.
- source_word: אֶחָד
  choice: einen
  rationale: Der Zahlwert »eins« bleibt durch den unbestimmten Akkusativ Singular gewahrt; im Deutschen bezeichnet »einen Ziegenbock« in diesem Aufzählungszusammenhang ausdrücklich ein einzelnes Tier.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet im Opferkontext das Sündopfer, nicht lediglich die abstrakte Sünde. Die Präposition לְ wird hier idiomatisch mit »als« wiedergegeben und benennt die Opferfunktion des Tieres.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch im Listenstil des Kapitels. Die Formulierung folgt dem Hebräischen eng, ohne eine im Deutschen unnötige lexikalische Fußnote; »Ziegenbock« gibt Geschlecht und Tierart bereits eindeutig wieder.
