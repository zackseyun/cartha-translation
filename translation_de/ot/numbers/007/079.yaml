  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe bestand aus einer silbernen Schale[a], die 130 Schekel wog, und einem silbernen Becken, das 70 Schekel wog, nach dem Schekelgewicht des Heiligtums[b]. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, für ein Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einer silbernen Schüssel«. Das hebräische Wort bezeichnet ein Gefäß, dessen genaue Form nicht sicher bestimmt werden kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: nach dem am Heiligtum geltenden Gewichtsstandard.'
    reason: cultural_clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן bezeichnet hier die vor Gott gebrachte Gabe; »Opfergabe« ist im kultischen Zusammenhang klar und natürlich.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: eine silberne Schale
  rationale: קַעֲרָה bezeichnet ein Gefäß, wahrscheinlich von eher flacher Form. »Schale« wahrt die Unsicherheit über seine genaue Gestalt besser als »Teller«.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: die 130 Schekel wog
  rationale: Die prädikative Gewichtsangabe wird in natürlichem Deutsch als Relativsatz wiedergegeben.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ein silbernes Becken
  rationale: מִזְרָק ist ein kultisch verwendetes Gefäß. »Becken« ist verständlich, ohne seine konkrete rituelle Funktion zu stark festzulegen.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: das 70 Schekel wog
  rationale: Der elliptische hebräische Ausdruck bezeichnet das Gewicht des Beckens; der Relativsatz macht dies im Deutschen eindeutig.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die Wendung bezeichnet den am Heiligtum geltenden Gewichtsstandard. Die Übersetzung vermeidet, »Schekel« missverständlich nur als Münze erscheinen zu lassen.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren ... gefüllt
  rationale: Die Formulierung bezieht den Inhalt ausdrücklich auf beide genannten Gefäße.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Dies ist die übliche präzise Bezeichnung für das fein gemahlene Mehl der Opfertexte.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip bezeichnet das Vermischen des Mehls mit Öl; »vermengt« ist knapp, würdig und verständlich.
- source_word: לְמִנְחָה
  choice: für ein Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext das unblutige Opfer aus Mehl beziehungsweise Getreide; »Speiseopfer« ist im Deutschen die geläufige kultische Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählungsstruktur des Hebräischen wird lesbar gegliedert; beide Gewichtsangaben werden ausdrücklich als solche formuliert. Die Maßangabe »Schekel« bleibt als historischer Fachbegriff erhalten.
