  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: de
  text: einen Stier aus der Rinderherde[a], einen Widder und ein einjähriges männliches Lamm[b] als Brandopfer;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen Stier, Sohn der Rinderherde«; gemeint ist ein Stier aus dem Rinderbestand, oft als junger Stier verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein männliches Lamm in seinem ersten Lebensjahr«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen Stier aus der Rinderherde
  rationale: פַּר bezeichnet einen Stier beziehungsweise jungen Stier; בֶּן בָּקָר ist wörtlich »Sohn der Rinderherde« und bestimmt ihn idiomatisch als Tier aus der Rinderherde. Die Wiedergabe ist natürlich und vermeidet eine missverständliche Wort-für-Wort-Formulierung.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist im Opferkontext die übliche Bezeichnung für ein ausgewachsenes männliches Schaf.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: ein einjähriges männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet hier ein männliches Lamm; בֶּן שְׁנָתוֹ ist eine Altersangabe und kann idiomatisch mit »einjährig« beziehungsweise »im ersten Lebensjahr« wiedergegeben werden.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; »als Brandopfer« fügt sich natürlich in die Aufzählung ein.
- source_word: אֶחָד
  choice: einen/ein
  rationale: Das bei jedem Tier wiederholte Zahlwort wird in der deutschen Akkusativform wiedergegeben und bewahrt die genaue Stückzahl.
