source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe bestand aus einer silbernen Schale[a], die 130 Schekel wog, und einem silbernen Becken[b], das 70 Schekel wog, nach dem Schekelgewicht des Heiligtums[c]. Beide waren mit Feinmehl gefüllt, das für ein Speiseopfer mit Öl vermengt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schüssel“; das hebräische Wort bezeichnet ein flaches schalenartiges Gefäß.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet ein kultisches Gefäß; auch „Schüssel“ ist möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nach dem Schekel des Heiligtums“; gemeint ist der dort geltende Gewichtsstandard.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet hier die kultische Opfergabe. Die Ergänzung „bestand aus“ gibt den verblosen hebräischen Satz im Deutschen natürlich wieder und leitet die Aufzählung ein.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: einer silbernen Schale
  rationale: קְעָרָה bezeichnet ein flaches schalen- oder schüsselartiges Gefäß. „Schale“ ist im Deutschen klar und lässt die genaue Gefäßform offen.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: die 130 Schekel wog
  rationale: Die Gewichtsangabe wird idiomatisch als Relativsatz wiedergegeben; die im Hebräischen ausdrücklich genannte Gewichtsgröße bleibt erhalten.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: einem silbernen Becken
  rationale: מִזְרָק ist ein kultisches Gefäß, das auch für Blut verwendet werden konnte. „Becken“ ist sachlich und vermeidet die interpretierende Festlegung auf eine konkrete Funktion.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: das 70 Schekel wog
  rationale: Der parallele Relativsatz macht eindeutig, dass diese Gewichtsangabe zum Becken gehört.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die Wendung bezeichnet den beim Heiligtum geltenden Gewichtsstandard. „Schekelgewicht“ verdeutlicht, dass Schekel hier eine Gewichtseinheit ist, ohne den kultischen Bezug aufzulösen.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren … gefüllt
  rationale: Die ausdrückliche Zweizahl bezieht sich auf die beiden Gefäße und wird im Deutschen knapp und eindeutig bewahrt.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist das für Opfer verwendete feine beziehungsweise hochwertige Mehl; „Feinmehl“ ist präzise und im Opferkontext verständlich.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das feminine Partizip bezieht sich grammatisch auf סֹלֶת. „Vermengt“ gibt den Vorgang präzise und in würdigem modernem Deutsch wieder.
- source_word: לְמִנְחָה
  choice: für ein Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext das unblutige Mehl- beziehungsweise Getreideopfer. „Speiseopfer“ ist knapp und etabliert.
theological_decisions: []
