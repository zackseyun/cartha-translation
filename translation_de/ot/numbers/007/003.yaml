  naturalness: „führende Männer“ wirkt im Deutschen sperrig. „Oberhäupter“ ist in diesem erzählerischen Kontext idiomatischer. Die Fußnote sollte nur die unsichere Wagenbezeichnung betreffen und ihr Marker unmittelbar bei „Wagen“ stehen.
  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe von יהוה. „Opfergabe“ ist angemessen, ohne eine Schlachtung der Wagen oder Tiere zu behaupten. „Stiftshütte“ ist für מִשְׁכָּן der etablierte und verständliche Fachausdruck; er ist nicht mit dem spezifisch anderen Ausdruck „Zelt der Begegnung“ gleichzusetzen.
