  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: de
  text: 'Und sie brachten ihre Opfergabe vor Jahwe: sechs gedeckte Wagen[a] und zwölf Rinder – jeweils einen Wagen für zwei Oberhäupter und ein Rind für jeden Einzelnen. Dann brachten sie sie vor die Stiftshütte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „überdachte Wagen“. Die Bedeutung des seltenen hebräischen Ausdrucks עֶגְלֹת צָב ist nicht völlig sicher; traditionell versteht man ihn als Hinweis auf gedeckte oder überdachte Transportwagen.'
    reason: lexikalische Alternative und Unsicherheit bei עֶגְלֹת צָב
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: ihre Opfergabe
  rationale: קָרְבָּן bezeichnet hier eine im kultischen Zusammenhang dargebrachte Gabe; „Opfergabe“ ist verständlich und lässt offen, dass Wagen und Rinder nicht als Schlachtopfer gemeint sind.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי hat die räumlich-relationale Bedeutung „vor, in der Gegenwart von“; die knappe Wiedergabe entspricht dem Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֶגְלֹת צָב
  choice: überdachte Wagen
  rationale: עֲגָלוֹת sind Wagen; das seltene צָב wird traditionell als Hinweis auf eine Überdachung oder Abdeckung verstanden. Die verbleibende lexikalische Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: בָּקָר / שׁוֹר
  choice: Rinder / Rind
  rationale: בָּקָר bezeichnet Rindvieh kollektiv, während שׁוֹר ein einzelnes Rind bezeichnet. „Rinder“ ist im Deutschen natürlich und legt Geschlecht oder Kastration nicht unnötig fest.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: je einen Wagen für zwei der führenden Männer
  rationale: 'Die Formulierung ist distributiv: Auf jeweils zwei נְשִׂיאִים kommt ein Wagen. „führende Männer“ bezeichnet in diesem Kontext die Stammesoberhäupter ohne monarchische Nebenbedeutung.'
- source_word: וְשׁוֹר לְאֶחָד
  choice: und je ein Rind für jeden von ihnen
  rationale: Auch diese Wendung ist distributiv; jeder der zuvor genannten führenden Männer stellte ein Rind.
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: Sie brachten sie
  rationale: הקריב bedeutet „heranbringen, darbringen“. Da Wagen und Rinder vor das Heiligtum gebracht werden, vermeidet „brachten“ die falsche Festlegung auf ein Schlachtopfer.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bedeutet wörtlich „Wohnung, Wohnstätte“ und bezeichnet das transportable Heiligtum. „Wohnung“ erhält den theologischen Bezug auf Gottes Wohnen unter Israel; „Zelt der Begegnung“ wäre die Wiedergabe eines anderen hebräischen Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von הקריב bei Wagen und Rindern
  choice: brachten
  alternative: opferten
  rationale: Der Zusammenhang beschreibt die Übergabe von Transportmitteln und Zugtieren. „Opferten“ könnte irreführend eine Schlachtung ausdrücken; „brachten“ wahrt den Vorgang der kultischen Darbringung ohne diese Zusatzannahme.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Ablauf, wird aber durch Gedankenstrich und einen neuen Satz lesbar gegliedert. „Wohnung“ wird als verständliche, quellennähere Bezeichnung des מִשְׁכָּן verwendet.
