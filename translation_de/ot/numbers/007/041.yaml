  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: de
  text: 'und für das Friedensopfer[a]: zwei Rinder[b], fünf Widder, fünf Ziegenböcke und fünf einjährige männliche Lämmer. Dies war die Opfergabe Schelumiëls, des Sohnes Zurischaddais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gemeinschaftsopfer“ beziehungsweise „Heilsopfer“.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet allgemein Rindvieh; manche Übersetzungen geben es hier mit „Stiere“ oder „Ochsen“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: und zum Schlachtopfer der Friedensopfer
  rationale: Die Präfixe führen den nächsten Teil der Opferliste ein. „Schlachtopfer“ gibt זֶבַח kultisch präzise wieder; „Friedensopfer“ ist eine geläufige, traditionsnahe Wiedergabe von שְׁלָמִים, ohne die möglichen Bedeutungsnuancen zu verschweigen.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר ist eine allgemeine Sammelbezeichnung für Rindvieh und legt das Geschlecht nicht ausdrücklich fest. „Rinder“ ist im Deutschen natürlich und weniger spezifisch als „Stiere“ oder „Ochsen“.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet hier eindeutig männliche Schafe.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתֻּדִים bezeichnet männliche Ziegen; „Ziegenböcke“ bewahrt diese Geschlechtsangabe eindeutig.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige männliche Lämmer
  rationale: כְּבָשִׂים bezeichnet männliche Lämmer, und בְּנֵי שָׁנָה gibt ihr Alter als einjährig an. Beide Angaben bleiben ausdrücklich erhalten.
- source_word: זֶה קָרְבַּן
  choice: Dies war die Opfergabe
  rationale: Das deutsche Präteritum passt zur erzählenden Aufzählung; „Opfergabe“ gibt קָרְבָּן in diesem kultischen Zusammenhang klar wieder.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: Schelumiëls, des Sohnes Zurischaddais
  rationale: Die Namen werden nach deutscher Transliterationskonvention wiedergegeben; die Apposition bildet die hebräische Abstammungsformel natürlich ab.
theological_decisions:
- issue: Bedeutung von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: Der hebräische Opferbegriff lässt sich nicht mit einem einzigen deutschen Ausdruck vollständig erfassen. Der Haupttext verwendet die geläufige kultische Bezeichnung, während die Fußnote sachlich mögliche Alternativen nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. Die listenartige Satzstruktur des Hebräischen bleibt erhalten; unnötige Archaismen werden vermieden.
