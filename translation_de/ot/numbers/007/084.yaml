source:
  edition: WLC
  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: de
  text: Das war die Weihegabe für den Altar an dem Tag, an dem er gesalbt wurde,[a] von den Stammesoberhäuptern Israels:[b] zwölf silberne Schalen, zwölf silberne Becken und zwölf goldene Schälchen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dies ist die Weihe des Altars am Tag seiner Salbung.« Der hebräische Wortlaut lässt diese formalere Wiedergabe zu; im Zusammenhang liegt jedoch eine rückblickende Zusammenfassung der dargebrachten Weihegaben nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: »von den Oberhäuptern Israels«; gemeint sind die anerkannten Führer der Stämme. Traditionell wird das Wort auch mit »Fürsten« wiedergegeben.'
    reason: lexical_alternative
  - marker: c
    text: Die genauen Formen der Gefäße sind nicht sicher. Möglich sind auch Wiedergaben wie »silberne Platten«, »silberne Schüsseln« und »goldene Löffel«.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Das war die Weihegabe für den Altar
  rationale: Der Satz blickt zusammenfassend auf die zuvor aufgeführten Gaben zurück. חֲנֻכָּה bezeichnet die Weihe; im Kontext sind konkret die dafür dargebrachten Gaben gemeint. Eine Fußnote bewahrt die formalere Wiedergabe.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: an dem Tag, an dem er gesalbt wurde
  rationale: Die Zeitangabe wird im Deutschen natürlich als Relativsatz wiedergegeben; das Pronomen bezieht sich auf den Altar.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: von den Stammesoberhäuptern Israels
  rationale: נָשִׂיא bezeichnet hier die anerkannten Repräsentanten der Stämme. »Stammesoberhäupter« ist präziser als das möglicherweise monarchisch missverständliche »Fürsten«.
- source_word: קַעֲרֹת כֶּסֶף
  choice: silberne Schalen
  rationale: קְעָרָה bezeichnet ein flaches schalen- oder plattenartiges Gefäß; »Schalen« ist verständlich und unterscheidet diese Gefäße von den folgenden Becken.
- source_word: מִזְרְקֵי כֶּסֶף
  choice: silberne Becken
  rationale: מִזְרָק bezeichnet ein kultisches Becken beziehungsweise eine tiefe Schale; »Becken« hält den Unterschied zum ersten Gefäßtyp sichtbar.
- source_word: כַּפּוֹת זָהָב
  choice: goldene Schälchen
  rationale: כַּף bezeichnet hier kleine, löffel- oder schalenartige Behälter. »Schälchen« passt zu den in 4. Mose 7 genannten Räuchergefäßen, ohne eine moderne Essbesteckfunktion festzulegen.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Direkte Wiedergabe der Kardinalzahl; die unterschiedlichen hebräischen Genusformen müssen im Deutschen nicht eigens markiert werden.
