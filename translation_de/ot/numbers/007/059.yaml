  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: de
  text: 'Und für das Heilsopfer[a]: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige Lämmer. Das war die Opfergabe Gamliëls, des Sohnes Pedazurs.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Friedensopfer beziehungsweise Gemeinschaftsopfer.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: Dies ist die Opfergabe Gamliëls, des Sohnes Pedazurs. Der hebräische Satz enthält kein ausdrückliches Verb.'
    reason: source_form
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: Und für das Heilsopfer
  rationale: Die Präfixe führen den letzten Posten der Opferliste fort. זֶבַח bezeichnet hier ein Schlachtopfer; שְׁלָמִים ist der feststehende Opferbegriff. „Heilsopfer“ ist im Deutschen bibelsprachlich etabliert und lässt die Bedeutungsbreite zwischen Frieden, Wohlergehen und Gemeinschaft offen.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר ist eine Sammelbezeichnung für Rindvieh und legt nicht eigens Zugochsen fest. „Rinder“ ist präzise und natürlich.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet eindeutig männliche Schafe.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתֻּדִים bezeichnet männliche Ziegen; „Ziegenböcke“ ist im modernen Deutsch eindeutig und idiomatisch.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige Lämmer
  rationale: Die Wendung „Söhne eines Jahres“ gibt das vorgeschriebene Alter der Lämmer an; „einjährige Lämmer“ bewahrt diese Angabe knapp und natürlich.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: Der hebräische Nominalsatz enthält kein ausgesprochenes Verb. Das Präteritum fügt sich in die erzählende Aufzählung; „Opfergabe“ gibt קָרְבָּן als eine Gott dargebrachte Gabe wieder.
- source_word: גַּמְלִיאֵל
  choice: Gamliël
  rationale: Die Schreibung folgt der hebräischen Namensform genauer als die traditionelle, über das Griechische vermittelte Form „Gamaliel“; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: בֶּן פְּדָה־צוּר
  choice: des Sohnes Pedazurs
  rationale: Die Genitivfügung ist im Deutschen natürlich; „Pedazur“ gibt die hebräische Namensform פְּדָה־צוּר wieder.
theological_decisions:
- issue: Bedeutungsbreite von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Der Ausdruck kann Frieden, Wohlergehen und die mit dem Opfer verbundene Gemeinschaft anklingen lassen. „Heilsopfer“ ist ein etablierter deutscher Fachbegriff, ohne die Bedeutung ausschließlich auf zwischenmenschliche Gemeinschaft oder Abwesenheit von Konflikt festzulegen.
- issue: Zeitbezug des verblosen Satzes זֶה קָרְבַּן
  choice: Das war die Opfergabe
  alternative: Das ist die Opfergabe
  rationale: Das Hebräische lässt den Zeitbezug grammatisch offen. Das Präteritum entspricht dem deutschen Erzählzusammenhang; die Fußnote wahrt die formale Offenheit des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Listenstruktur. Die Tierbezeichnungen sind konkret und allgemein verständlich; etablierte Opfersprache bleibt erhalten. Alle Fußnotenmarker stehen im Haupttext.
