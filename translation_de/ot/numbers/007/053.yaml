  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: de
  text: und zum Heilsopfer[a] zwei Rinder[b], fünf Widder, fünf Ziegenböcke und fünf einjährige männliche Lämmer. Das war die Opfergabe Elischamas, des Sohnes Ammihuds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Friedensopfer“ oder „Gemeinschaftsopfer“; der hebräische Ausdruck bezeichnet ein Opfer, das mit Frieden, Wohlergehen und einem gemeinsamen Opfermahl verbunden ist.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch eine Sammelbezeichnung für Rindvieh; daher auch „zwei Stück Rindvieh“. Die genauere Wiedergabe „zwei Stiere“ legt mehr fest, als der Ausdruck für sich genommen erkennen lässt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: und als Heilsopfer
  rationale: Die Wendung führt eine weitere Opferart in der Aufzählung ein. „Heilsopfer“ ist ein etablierter deutscher kultischer Ausdruck; eine Fußnote wahrt die Bedeutungsbreite von שְׁלָמִים zwischen Frieden, Wohlergehen und Gemeinschaft.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר ist eine Sammelbezeichnung für Rindvieh und legt hier Geschlecht oder Verwendungsart der Tiere nicht ausdrücklich fest.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet in dieser Opferliste eindeutig männliche Schafe.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתֻּדִים bezeichnet ausdrücklich männliche Ziegen.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige männliche Lämmer
  rationale: כְּבָשִׂים ist die maskuline Bezeichnung für Lämmer, während בְּנֵי שָׁנָה ihr Alter mit einem Jahr angibt. Die ausdrückliche Geschlechtsangabe unterscheidet sie im Deutschen von der geschlechtsneutralen Pluralform „Lämmer“.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: Der verblosen hebräischen Identifikationsformel entspricht im fortlaufenden deutschen Erzählbericht natürlich das Präteritum. „Opfergabe“ gibt קָרְבָּן im kultischen Zusammenhang präzise wieder.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elischamas, des Sohnes Ammihuds
  rationale: Die Namen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die Genitivfügung bildet das hebräische Patronym natürlich und eindeutig ab.
theological_decisions:
- issue: Bedeutungsbreite von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Keine einzelne deutsche Bezeichnung erfasst die ganze kultische Bedeutungsbreite. Der Haupttext verwendet den etablierten Ausdruck „Heilsopfer“, während die Fußnote die anderen sachlich möglichen Deutungsakzente offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form der hebräischen Opferliste bleibt erhalten. Kultische Fachbegriffe werden verständlich formuliert und bei echter Bedeutungsbreite durch Fußnoten erläutert.
