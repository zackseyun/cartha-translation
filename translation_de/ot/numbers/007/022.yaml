lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Wortverbindung bezeichnet idiomatisch einen männlichen Ziegenbock. „Ziegenbock“ ist im modernen Deutschen klar und bewahrt die ausdrücklich männliche Bedeutung.
- source_word: אֶחָד
  choice: einen
  rationale: Das Zahlwort gibt die Anzahl innerhalb der Opferliste an. Im Deutschen bringt der unbestimmte Artikel im Akkusativ die Einzahl natürlich zum Ausdruck; der Kontext der Aufzählung macht die Zählfunktion deutlich.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet in diesem kultischen Zusammenhang die Opferart „Sündopfer“. Die Präposition לְ markiert hier die Bestimmung beziehungsweise Funktion des Tieres, was „als“ idiomatisch wiedergibt.
theological_decisions:
- issue: Wiedergabe des Opferbegriffs חַטָּאת
  choice: Sündopfer
  alternative: für die Sünde
  rationale: In der Opferliste bezeichnet חַטָּאת eine festgelegte Opferkategorie und nicht lediglich die abstrakte Sünde. „Sündopfer“ erhält den konkreten kultischen Sinn.
