lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Wortverbindung bezeichnet einen männlichen Vertreter der Ziegen. „Ziegenbock“ ist die natürliche, präzise deutsche Entsprechung und bewahrt die ausdrücklich bezeichnete Tierart und das Geschlecht.
- source_word: אֶחָד
  choice: einen
  rationale: Der Zahlwert „eins“ wird durch den unbestimmten Akkusativ „einen“ idiomatisch ausgedrückt; in dieser Aufzählung bezeichnet er genau ein Tier.
- source_word: לְחַטָּאת
  choice: für ein Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת gewöhnlich das Sündopfer. Die Präposition לְ gibt hier die Bestimmung des Tieres an und wird natürlich mit „für“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Sünde
  rationale: In priesterlichen Opferlisten ist חַטָּאת ein Fachausdruck für das Opfer im Zusammenhang mit Sünde. „Sündopfer“ bewahrt die kultische Bedeutung, ohne weitergehende dogmatische Aussagen in den Text einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenform des hebräischen Textes bleibt erhalten; der abschließende Punkt entspricht der deutschen Einzelversdarstellung.
