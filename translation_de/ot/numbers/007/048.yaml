  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י אֶפְרָ֑יִם אֱלִֽישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: de
  text: Am siebten Tag war Elischama, der Sohn Ammihuds, der Anführer der Nachkommen Ephraims.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Anführer für die Nachkommen Ephraims«. Die hebräische Präposition kann hier eine Zugehörigkeit oder eine Vertretungsbeziehung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Die Präposition ב mit יוֹם und der Ordnungszahl bildet eine Zeitangabe; »Am siebten Tag« ist die natürliche und genaue deutsche Wiedergabe.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Das Wort bezeichnet hier den führenden Repräsentanten eines Stammes. »Anführer« ist modern und verständlich und vermeidet die heute missverständliche dynastische Bedeutung von »Fürst«.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: der Nachkommen Ephraims
  rationale: Die Verbindung bezeichnet die Zugehörigkeit beziehungsweise repräsentative Beziehung zu den בני אפרים. »Nachkommen Ephraims« gibt die genealogische Gruppenbezeichnung in natürlichem modernem Deutsch wieder.
- source_word: אֱלִישָׁמָע
  choice: Elischama
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: בֶּן עַמִּיהוּד
  choice: der Sohn Ammihuds
  rationale: Die hebräische Vatersnamenformel wird im Deutschen natürlich als »der Sohn Ammihuds« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das im Hebräischen verblos formulierte Aufzählungsschema wird für einen natürlichen deutschen Satz mit »war« wiedergegeben; die mögliche Nuance der Präposition ל bleibt in der Fußnote erhalten.
