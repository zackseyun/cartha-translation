  language: de
  text: eine Schale aus Gold[a], zehn Schekel schwer, mit Räucherwerk gefüllt;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Schale aus Gold, zehn, voll Räucherwerk“; „Schekel“ ist aus der wiederholten Opferformel im Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im kultischen Inventarkontext bezeichnet das Wort ein kleines Gefäß für Räucherwerk, nicht die menschliche Handfläche. „Schale“ ist im heutigen Deutsch natürlich und vermeidet die irreführende Vorstellung eines Esslöffels.
- source_word: אַחַת
  choice: eine
  rationale: Das einfache Zahlwort stimmt mit dem femininen Substantiv כַּף überein.
- source_word: עֲשָׂרָה
  choice: zehn Schekel schwer
  rationale: Im Hebräischen steht nur „zehn“; aus der wiederholten Opferformel im unmittelbaren Zusammenhang ist jedoch die Gewichtseinheit Schekel zu ergänzen. „Schwer“ macht die Gewichtsbedeutung im Deutschen klar.
- source_word: זָהָב
  choice: goldene
  rationale: Das Substantiv bezeichnet hier das Material des Gefäßes; die adjektivische Wiedergabe ist knapp und idiomatisch.
- source_word: מְלֵאָה
  choice: mit … gefüllt
  rationale: Das feminine Prädikatsadjektiv beschreibt den Inhalt der Schale. Die Formulierung ist im Deutschen natürlicher als eine streng wörtliche Wiedergabe mit „voll“.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: „Räucherwerk“ bezeichnet präzise die aromatische Substanz des israelitischen Kults und passt hier besser als das stärker auf den Rauch bezogene „Weihrauch“.
