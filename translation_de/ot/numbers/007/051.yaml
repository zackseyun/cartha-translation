  language: de
  text: einen Stier aus der Rinderherde, einen Widder und ein einjähriges männliches Lamm als Brandopfer;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: Stier aus der Rinderherde
  rationale: פַּר bezeichnet einen Stier beziehungsweise Jungstier; בֶּן־בָּקָר ordnet ihn idiomatisch dem Rindvieh zu. Die Wiedergabe bewahrt beide Bestandteile und klingt in einer Opferliste natürlich.
- source_word: אַיִל
  choice: Widder
  rationale: Direkte und im Opferkontext übliche Bezeichnung für ein ausgewachsenes männliches Schaf.
- source_word: כֶּבֶשׂ
  choice: männliches Lamm
  rationale: Das Substantiv bezeichnet hier ein Lamm männlichen Geschlechts; die ausdrückliche Angabe wahrt die Präzision der Opferliste.
- source_word: בֶּן־שְׁנָתוֹ
  choice: einjährig
  rationale: Die hebräische Altersangabe bezeichnet ein Tier im Alter von einem Jahr; »einjährig« ist im Deutschen knapp und idiomatisch.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist die feste Bezeichnung für das vollständig verbrannte Opfer; »als Brandopfer« fügt sich natürlich in die Aufzählung ein.
- source_word: אֶחָד
  choice: einen/ein
  rationale: Die wiederholte Zahl kennzeichnet jeweils die Menge eins. Sie wird bei jedem Tier ausdrücklich wiedergegeben.
