  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: de
  text: eine goldene Schale, zehn Schekel schwer,[a] voll Räucherwerk;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „eine Schale, zehn Gold, voll Räucherwerk“. Die Gewichtseinheit „Schekel“ ist aufgrund der wiederkehrenden Opfergabenformel in Numeri 7 mitgemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im Zusammenhang der Opfergaben bezeichnet das Wort ein kleines Gefäß für Räucherwerk; „Schale“ ist im heutigen Deutsch natürlich und sachlich passend.
- source_word: אַחַת
  choice: eine
  rationale: Die feminine Zahlform gibt die Anzahl des Gefäßes an.
- source_word: עֲשָׂרָה זָהָב
  choice: zehn Schekel schwer
  rationale: Der im verkürzten hebräischen Wortlaut nicht ausdrücklich genannte Schekel ist aus der wiederkehrenden Gewichtsformel in Numeri 7 zu erschließen. „schwer“ macht deutlich, dass es um das Gewicht der goldenen Schale geht.
- source_word: זָהָב
  choice: goldene
  rationale: Das Substantiv bezeichnet hier das Material des Gefäßes und wird im Deutschen idiomatisch als Adjektiv wiedergegeben.
- source_word: מְלֵאָה
  choice: voll
  rationale: Das feminine Prädikatsadjektiv bezieht sich auf die Schale; „voll“ bildet die knappe Formulierung des Hebräischen ab.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: „Räucherwerk“ bezeichnet im kultischen Zusammenhang präzise die zum Verbrennen bestimmte duftende Substanz.
