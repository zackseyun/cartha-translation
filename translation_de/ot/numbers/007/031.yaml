  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe bestand aus einer silbernen Schale[a] von hundertdreißig Schekel Gewicht und einem silbernen Becken[b] von siebzig Schekel nach dem Schekelgewicht des Heiligtums[c]. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, als Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schüssel“; gemeint ist ein kultisches Gefäß.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sprengschale“; das hebräische Wort bezeichnet ein beim Opferdienst verwendetes Gefäß.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: nach dem am Heiligtum geltenden Gewichtsstandard.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet hier die für den Kult dargebrachte Gabe. Die Formulierung leitet die anschließende Aufzählung im Deutschen natürlich ein.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: einer silbernen Schale
  rationale: קְעָרָה bezeichnet ein eher flaches Gefäß; „Schale“ ist im Deutschen verständlich und vermeidet eine zu genaue Festlegung der Form.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: von hundertdreißig Schekel Gewicht
  rationale: Bewahrt die ausdrückliche Gewichtsangabe des Hebräischen in idiomatischer deutscher Form.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: einem silbernen Becken
  rationale: מִזְרָק ist ein im Opferdienst verwendetes Gefäß; „Becken“ bringt den kultischen Gefäßcharakter besser zum Ausdruck als das häuslich klingende „Schüssel“.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: von siebzig Schekel
  rationale: Die elliptische hebräische Gewichtsangabe wird knapp und eindeutig auf das Becken bezogen.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die Wendung bezeichnet den am Heiligtum geltenden Gewichtsstandard, nicht einen besonderen Gegenstand oder eine Währung im modernen Sinn.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren … gefüllt
  rationale: Gibt den ausdrücklichen Bezug auf beide Gefäße klar und natürlich wieder.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der etablierte deutsche Ausdruck für das hochwertige, fein gemahlene Mehl der Opferbestimmungen.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: das mit Öl vermengt war
  rationale: Das feminine Partizip bezieht sich grammatisch auf סֹלֶת; der Relativsatz bildet diesen Bezug klar ab.
- source_word: לְמִנְחָה
  choice: als Speiseopfer
  rationale: מִנְחָה bezeichnet in diesem priesterlichen Zusammenhang das unblutige Mehl- beziehungsweise Speiseopfer.
