  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: de
  text: 'und für das Heilsopfer: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige männliche Lämmer. Das war die Opfergabe Netanels, des Sohnes Zuars.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: und für das Heilsopfer
  rationale: Die Präfixe führen den nächsten Bestandteil der Opferliste ein. „Heilsopfer“ ist ein etablierter deutscher Kultbegriff für שְׁלָמִים und lässt dessen Bedeutungsbreite zwischen Frieden, Gemeinschaft und Wohlergehen bestehen.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר bezeichnet Rindvieh kollektiv, ohne hier das Geschlecht ausdrücklich festzulegen. „Rinder“ ist präzise und natürlich.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet ausdrücklich männliche Schafe.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתּוּדִים bezeichnet männliche Ziegen; „Ziegenböcke“ ist im modernen Deutsch eindeutig und idiomatisch.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige männliche Lämmer
  rationale: כְּבָשִׂים ist eine maskuline Bezeichnung für Lämmer, und בְּנֵי שָׁנָה gibt ihr Alter als ein Jahr an. Die Formulierung bewahrt beide Angaben.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: Die Wendung ist eine abschließende Identifikationsformel. Das Präteritum passt zum deutschen Erzählzusammenhang; „Opfergabe“ gibt קָרְבָּן im kultischen Kontext klar wieder.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: Netanels, des Sohnes Zuars
  rationale: Die Namen werden nach geläufiger deutscher Bibeltransliteration wiedergegeben; die Apposition bildet das Patronym natürlich ab.
theological_decisions:
- issue: Bedeutungsbreite von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Der hebräische Kultbegriff kann mit Frieden, Wohlergehen und Opfergemeinschaft verbunden werden. „Heilsopfer“ ist im Deutschen etabliert, ohne die genaue Funktion des Opfers konfessionell festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die listenartige Syntax und die kultischen Fachbegriffe bleiben erhalten; zugleich werden missverständliche oder veraltete Tierbezeichnungen vermieden.
