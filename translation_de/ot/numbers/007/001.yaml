  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: de
  text: 'Und es geschah an dem Tag, als Mose die Wohnung[a] fertig aufgerichtet hatte: Er salbte und heiligte sie samt all ihren Geräten sowie den Altar samt all seinen Geräten; er salbte und heiligte sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Stiftshütte“; auch: „Zeltwohnung“. Das hebräische Wort bezeichnet hier das tragbare Heiligtum als Wohnstätte Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Bewahrt die erzählerische Einleitungsfunktion der Wayyiqtol-Form in würdigem, verständlichem Deutsch.
- source_word: בְּיוֹם כַּלּוֹת
  choice: an dem Tag, als ... fertig ... hatte
  rationale: Gibt die hebräische Zeitangabe natürlich wieder und lässt zugleich ihren Bezug auf den Abschluss der Handlung erkennen.
- source_word: לְהָקִים
  choice: aufgerichtet
  rationale: Das Hifil von קום bezeichnet hier das physische Aufrichten beziehungsweise Errichten des Heiligtums.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: Die Grundbedeutung von משכן ist eine Wohnstätte; im Kontext bezeichnet das Wort das tragbare Heiligtum als Ort der Gegenwart Gottes. Eine Fußnote nennt den geläufigen traditionellen Ausdruck.
- source_word: וַיִּמְשַׁח
  choice: salbte
  rationale: משׁח bezeichnet hier die rituelle Salbung mit Öl und wird mit dem etablierten deutschen Kultbegriff wiedergegeben.
- source_word: וַיְקַדֵּשׁ
  choice: heiligte
  rationale: קדשׁ bedeutet im kultischen Zusammenhang, etwas für den heiligen Gebrauch auszusondern. „Heiligte“ bewahrt die direkte Verbindung zum Begriff der Heiligkeit.
- source_word: כָּל כֵּלָיו
  choice: all ihren/seinen Geräten
  rationale: כְּלִים bezeichnet in beiden Vorkommen die zum Heiligtum beziehungsweise zum Altar gehörenden Gegenstände; „Geräte“ ist breit genug und erhält die lexikalische Wiederholung.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: „Altar“ ist die standardsprachliche und genaue Entsprechung von מזבח.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: er salbte und heiligte sie
  rationale: Das pluralische Pronomen wird entsprechend dem Hebräischen beibehalten; sein zusammenfassender Bezugsumfang wird nicht künstlich verengt.
theological_decisions:
- issue: Kultische Heiligung unbelebter Gegenstände
  choice: heiligte
  alternative: weihte; heiligte für den Dienst
  rationale: Der Vers beschreibt keine moralische Veränderung, sondern die Aussonderung für den heiligen Gebrauch. „Heiligte“ wahrt dennoch die lexikalische und theologische Spannung des Stammes קדשׁ.
- issue: Bezeichnung des משכן
  choice: Wohnung
  alternative: Stiftshütte; Zeltwohnung; Heiligtum
  rationale: „Wohnung“ gibt die Wortbedeutung unmittelbar wieder und hebt Gottes Wohnen inmitten Israels hervor, ohne eine konfessionell geprägte Sonderdeutung einzutragen; der traditionelle Ausdruck steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Wiederholung von „salbte und heiligte“ sowie die parallele Nennung der Geräte wurden entsprechend der hebräischen Struktur bewahrt.
