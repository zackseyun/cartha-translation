lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im Zusammenhang der Heiligtumsgaben bezeichnet das Wort ein kleines Gefäß; „Schale“ ist im heutigen Deutsch natürlich und vermeidet die irreführende Vorstellung eines gewöhnlichen Esslöffels.
- source_word: אַחַת
  choice: eine
  rationale: Die einfache Kardinalzahl stimmt im Hebräischen mit dem femininen Substantiv כַּף überein.
- source_word: עֲשָׂרָה זָהָב
  choice: von zehn Schekel Gewicht
  rationale: Der Text nennt wörtlich „zehn [an] Gold“; die Gewichtseinheit Schekel ist aufgrund der wiederkehrenden Opferformel im Kontext mitzudenken. Die Formulierung macht deutlich, dass das Gewicht und nicht der Wert gemeint ist.
- source_word: מְלֵאָה
  choice: gefüllt mit
  rationale: Gibt das prädikative Adjektiv idiomatisch wieder und bezeichnet den Inhalt des Gefäßes.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Bezeichnet die aromatische Substanz für den kultischen Gebrauch; „Räucherwerk“ ist im Deutschen präziser als das allgemeinere „Weihrauch“, das auch einen einzelnen Bestandteil bezeichnen kann.
