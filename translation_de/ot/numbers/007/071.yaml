source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: de
  text: 'und für das Heilsopfer[a]: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige Lämmer. Das war die Opfergabe Ahiesers, des Sohnes Ammischaddais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Friedensopfer“ oder „Gemeinschaftsopfer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: und für das Heilsopfer
  rationale: Die Verbindung aus וּלְזֶבַח und dem kultischen Fachbegriff שְׁלָמִים leitet den letzten Teil der Opferliste ein. „Heilsopfer“ ist im Deutschen eine geläufige, knappe Wiedergabe, ohne die mögliche Bedeutungsbreite des Begriffs im Haupttext auszudeuten.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר bezeichnet Rindvieh, ohne hier das Geschlecht festzulegen. „Zwei Rinder“ bewahrt diese Unbestimmtheit.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet in dieser Opferliste eindeutig männliche Schafe.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתֻּדִים bezeichnet männliche Ziegen; „Ziegenböcke“ ist präzise und natürlich.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige Lämmer
  rationale: Die Wendung „Söhne eines Jahres“ gibt das für das Opfer relevante Alter an und wird idiomatisch mit „einjährige Lämmer“ wiedergegeben.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: Das Präteritum entspricht dem erzählenden Zusammenhang der bereits dargebrachten Gaben. „Opfergabe“ gibt קָרְבָּן im kultischen Kontext klar wieder.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiesers, des Sohnes Ammischaddais
  rationale: Die Namen werden in einer etablierten deutschen Transliteration wiedergegeben; die Genitivkonstruktion bildet בֶּן präzise und in würdigem Deutsch ab.
theological_decisions:
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Heilsopfer im Haupttext mit Fußnote
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Der hebräische Opferbegriff kann mit Frieden, Wohlergehen und Gemeinschaft verbunden werden. Keine einzelne deutsche Bezeichnung bildet sein gesamtes Bedeutungsspektrum ab; deshalb nennt die Fußnote sachlich vertretbare Alternativen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die knappe Aufzählungsstruktur des Hebräischen bleibt erhalten; kultische Terminologie wird nicht paraphrastisch aufgelöst.
