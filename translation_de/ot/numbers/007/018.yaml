  text: בַּ/יּוֹם֙ הַ/שֵּׁנִ֔י הִקְרִ֖יב נְתַנְאֵ֣ל בֶּן צוּעָ֑ר נְשִׂ֖יא יִשָּׂשכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/018.yaml
  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: de
  text: Am zweiten Tag brachte Netanel, der Sohn Zuars, der Anführer Issachars, seine Opfergabe dar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen nur: „brachte dar“; „seine Opfergabe“ ist aus dem wiederholten Zusammenhang in 4. Mose 7 ergänzt, in dem jeder Stammesführer eine Opfergabe darbringt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Am zweiten Tag
  rationale: Die Präposition ב mit יוֹם und der Ordinalzahl bezeichnet den Zeitpunkt. Die Wiedergabe ist im Deutschen natürlich und fügt dem Vers keine nähere Bestimmung hinzu.
- source_word: הִקְרִיב
  choice: brachte … seine Opfergabe dar
  rationale: Der Hifil von קרב bezeichnet in diesem kultischen Zusammenhang das Darbringen einer Gabe. Das im Hebräischen nicht ausdrücklich genannte Objekt wird für ein natürliches deutsches Satzgefüge aus dem unmittelbar vorausgehenden und wiederholten Kontext ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Der Personenname wird gemäß der im modernen Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: בֶּן צוּעָר
  choice: der Sohn Zuars
  rationale: Die hebräische Abstammungsformel wird idiomatisch und in ihrer appositionellen Funktion wiedergegeben.
- source_word: נְשִׂיא
  choice: der Anführer
  rationale: נָשִׂיא bezeichnet hier das anerkannte Oberhaupt eines Stammes. „Anführer“ ist verständlich und vermeidet die heute leicht königlich verstandene Bezeichnung „Fürst“.
- source_word: יִשָּׂשכָר
  choice: Issachar
  rationale: Der Stammesname wird in der etablierten deutschen biblischen Form wiedergegeben.
