  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe bestand aus einer silbernen Schale[a] von hundertdreißig Schekel Gewicht und einem silbernen Becken[b] von siebzig Schekel Gewicht, nach dem Schekelgewicht des Heiligtums[c]. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, als Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schüssel“; gemeint ist ein flaches silbernes Gefäß.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet ein Gefäß, das im Heiligtumsdienst verwendet wurde; auch „Schüssel“ ist möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nach dem Schekel des Heiligtums“, das heißt nach dem im Heiligtum geltenden Standardgewicht.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet im kultischen Zusammenhang eine dargebrachte Opfergabe. „bestand aus“ ergänzt für die verblosen Aufzählungssätze eine natürliche deutsche Satzkonstruktion.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: einer silbernen Schale
  rationale: קְעָרָה bezeichnet hier ein eher flaches Gefäß. „Schale“ ist im Deutschen sachlich und kultisch passend; die mögliche Wiedergabe „Schüssel“ wird in der Fußnote genannt.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: von hundertdreißig Schekel Gewicht
  rationale: Die Gewichtsangabe wird in natürlicher deutscher Zahlenfolge wiedergegeben und ausdrücklich auf das erste Gefäß bezogen.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: einem silbernen Becken
  rationale: מִזְרָק ist ein im Heiligtumsdienst verwendetes Gefäß. „Becken“ bewahrt den kultischen Charakter besser als das häuslicher klingende „Schüssel“.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: von siebzig Schekel Gewicht
  rationale: Die im Hebräischen knappe Gewichtsangabe wird im Deutschen eindeutig auf das Becken bezogen.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die Wendung bezeichnet den im Heiligtum geltenden Gewichtsstandard. Diese Formulierung ist verständlicher als die streng wörtliche Wiedergabe „nach dem Schekel des Heiligtums“.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren ... gefüllt
  rationale: Das Pronomen verweist ausdrücklich auf die beiden Gefäße; die im Hebräischen fehlende Kopula wird für idiomatisches Deutsch ergänzt.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist der feste kultische Ausdruck für fein gemahlenes Mehl, das für Opfergaben verwendet wurde.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip bezeichnet das Vermischen des Feinmehls mit Öl. „vermengt“ ist präzise, gegenwärtig verständlich und würdevoll.
- source_word: לְמִנְחָה
  choice: für ein Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext spezifisch das unblutige Mehl- beziehungsweise Speiseopfer; „Speiseopfer“ wahrt die etablierte kultische Unterscheidung.
