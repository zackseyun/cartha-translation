lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im Zusammenhang der Heiligtumsgaben bezeichnet das Wort ein kleines kultisches Gefäß. „Schale“ ist im heutigen Deutsch natürlicher und sachlich klarer als „Löffel“.
- source_word: אַחַת
  choice: eine
  rationale: Das Zahlwort stimmt mit dem femininen Substantiv כַּף überein.
- source_word: עֲשָׂרָה זָהָב
  choice: zehn Schekel schwer
  rationale: Der hebräische Ausdruck ist elliptisch; die in Numeri 7 wiederkehrende Opferformel zeigt, dass eine Gewichtsangabe gemeint ist. Die Einheit „Schekel“ wird daher zum Verständnis ergänzt.
- source_word: מְלֵאָה
  choice: gefüllt mit
  rationale: Gibt den prädikativen Zustand des Gefäßes in natürlichem Deutsch wieder.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Bezeichnet den aromatischen Stoff für das kultische Räucheropfer; „Räucherwerk“ ist in diesem Zusammenhang präziser als das auch den Rauch bezeichnende „Weihrauch“.
