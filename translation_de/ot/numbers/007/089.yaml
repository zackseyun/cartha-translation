  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: de
  text: Als Mose das Zelt der Begegnung betrat, um mit ihm zu reden[a], hörte er die Stimme, die von oberhalb der Sühneplatte[c], die auf der Lade des Zeugnisses lag, zwischen den beiden Kerubim hervor zu ihm sprach[b]. Und die Stimme redete zu ihm[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen bezieht sich im Zusammenhang wahrscheinlich auf Gott; der hebräische Text nennt ihn hier jedoch nicht ausdrücklich.
    reason: referent_note
  - marker: b
    text: 'Die ungewöhnliche hebräische Partizipform kann auch mit einer passivischen Nuance verstanden werden, etwa: „die Stimme, die zu ihm erging“.'
    reason: lexical_alternative
  - marker: c
    text: Die „Sühneplatte“ ist die Deckplatte der Lade.
    reason: cultural_note
  - marker: d
    text: 'Das Subjekt des letzten Satzes wird im Hebräischen nicht ausdrücklich genannt. Im Zusammenhang ist die Stimme beziehungsweise Gott als Sprecher am wahrscheinlichsten. Eine stärker explizierende Wiedergabe wäre: „Und der HERR redete zu ihm.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: Als Mose … hineinging
  rationale: Die Präposition בְּ mit dem Infinitiv constructus von בוא leitet einen temporalen Nebensatz ein. „Als … hineinging“ gibt den erzählerischen Zeitbezug natürlich wieder; eine iterative Bedeutung („immer wenn“) wird vom Vers allein nicht erzwungen.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Bezeichnung meint das Heiligtumszelt, an dem Gott seinem Volk begegnet. „Zelt der Begegnung“ ist im modernen Deutsch verständlich und bewahrt den Sinn von מוֹעֵד besser als eine rein traditionelle, heute weniger transparente Benennung.
- source_word: לְדַבֵּר אִתּוֹ
  choice: um mit ihm zu reden
  rationale: Der Infinitiv bezeichnet Moses Absicht beim Betreten des Zeltes. אִתּוֹ legt hier „mit ihm“ nahe und bewahrt sowohl das Pronomen als auch den relationalen Klang.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: hörte er die Stimme
  rationale: קוֹל kann „Laut“, „Schall“ oder „Stimme“ bedeuten. Der folgende Redepartizip und der Offenbarungskontext sprechen hier deutlich für „Stimme“.
- source_word: מִדַּבֵּר
  choice: zu sich reden
  rationale: Das Partizip beschreibt die Stimme beim Reden. Die Form ist ungewöhnlich und kann auch mit passivischer Nuance verstanden werden; die Hauptfassung gibt den naheliegenden aktiven Sinn in idiomatischem Deutsch wieder.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: von oberhalb der Sühneplatte
  rationale: כַּפֹּרֶת bezeichnet die kultische Deckplatte der Lade. „Sühneplatte“ gibt sowohl die konkrete Form als auch die kultische Funktion wieder, ohne den Gegenstand irreführend als Sitzmöbel darzustellen.
- source_word: אֲרֹן הָעֵדֻת
  choice: Lade des Zeugnisses
  rationale: Die traditionelle Wendung bewahrt den rechtlich-bundestheologischen Sinn von עֵדוּת und verweist auf das in der Lade verwahrte Zeugnis.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: zwischen den beiden Kerubim hervor
  rationale: Die Formulierung gibt den räumlichen Ausgangspunkt der Stimme wieder. „Kerubim“ bewahrt die besondere hebräische Bezeichnung dieser himmlischen Wesen.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Und er redete zu ihm
  rationale: Das Hebräische nennt das Subjekt nicht ausdrücklich. Die pronominale Fassung bewahrt diese Knappheit und Mehrdeutigkeit, statt den HERRN, die Stimme oder Mose ausdrücklich als Subjekt einzusetzen.
theological_decisions:
- issue: Bezug des Pronomens in „um mit ihm zu reden“
  choice: Das Pronomen bleibt unaufgelöst; im Zusammenhang ist Gott der wahrscheinlichste Bezug.
  alternative: „um mit dem HERRN zu reden“
  rationale: Der Heiligtumskontext legt Gott als Gesprächspartner nahe, doch der hebräische Text nennt ihn an dieser Stelle nicht ausdrücklich. Die Übersetzung vermeidet daher eine erklärende Einfügung in den Haupttext.
- issue: Subjekt des abschließenden וַיְדַבֵּר אֵלָיו
  choice: „Und er redete zu ihm“ bewahrt das nicht ausdrücklich genannte Subjekt.
  alternative: '„Und der HERR redete zu Mose“; „Und die Stimme redete zu ihm“; nach anderer syntaktischer Zuordnung: „Und Mose redete zu ihm“'
  rationale: Am wahrscheinlichsten ist, dass der göttliche Sprecher beziehungsweise die Stimme zu Mose redet. Da das Hebräische beide Beteiligten nur pronominal bezeichnet, soll die echte syntaktische Spannung nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die räumlichen Angaben werden durch Gedankenstrich und „hervor“ zusammengehalten. Gottesbezeichnungen werden nicht ergänzt, wo der hebräische Text nur Pronomen beziehungsweise ein unausgesprochenes Subjekt bietet. Kultische Fachbegriffe werden verständlich, aber ohne konfessionelle Sonderprägung wiedergegeben.
