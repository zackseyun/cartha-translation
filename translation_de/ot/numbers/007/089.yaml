    rationale: Nach dem als Subjekt eingeführten Mose wird „er“ im Deutschen gewöhnlich auf Mose bezogen. Der hebräische Schluss lässt das Subjekt zwar unausgedrückt, der Kontext verbindet das Reden aber mit der Stimme beziehungsweise dem göttlichen Sprecher. „Die Stimme“ verhindert eine sachlich irreführende deutsche Auflösung; die Fußnote hält die Frage des impliziten Subjekts transparent.
