revisions:
- from: Als Mose in das Zelt der Begegnung hineinging, um mit ihm zu reden[a], hörte er die Stimme zu sich reden[b] – von oberhalb der Sühneplatte[c], die auf der Lade des Zeugnisses lag, zwischen den beiden Kerubim hervor. Und er redete zu ihm.[d]
  to: Als Mose das Zelt der Begegnung betrat, um mit ihm zu reden[a], hörte er die Stimme, die von oberhalb der Sühneplatte[c], die auf der Lade des Zeugnisses lag, zwischen den beiden Kerubim hervor zu ihm sprach[b]. Und die Stimme redete zu ihm[d].
  rationale: Die Revision ersetzt die im Deutschen sinnwidrige reflexive Wendung durch „zu ihm sprach“. Im Schlusssatz wird „die Stimme“ wiederholt, weil das deutsche Pronomen „er“ sonst vorrangig Mose als Subjekt verstehen ließe. Die Fußnote erläutert weiterhin, dass der hebräische Text das Subjekt nicht ausdrücklich nennt, ohne eine Gottesbezeichnung in den Haupttext einzutragen.
