  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: de
  text: 'Die Rinder für das Brandopfer: zwölf Stiere, zwölf Widder, zwölf einjährige Lämmer und ihr Speisopfer; dazu zwölf Ziegenböcke als Sündopfer[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann neben dem Bezug auf Sünde auch die Reinigung von Unreinheit hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: Die Rinder … insgesamt
  rationale: הַבָּקָר bezeichnet kollektiv die Rinder; כָּל fasst ihre Gesamtzahl zusammen. Die deutsche Satzstellung macht den inventarartigen Charakter natürlich verständlich.
- source_word: לָעֹלָה
  choice: für das Brandopfer
  rationale: Die Präposition לְ bezeichnet hier die Bestimmung; „Brandopfer“ ist der übliche und sachlich genaue Opferbegriff.
- source_word: פָּרִים
  choice: Stiere
  rationale: פָּר bezeichnet im Opferkontext männliche Rinder; „Stiere“ ist modern und präzise.
- source_word: אֵילִם
  choice: Widder
  rationale: Entspricht dem üblichen Opferbegriff für männliche Schafe.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: einjährige Lämmer
  rationale: Gibt Tierart und vorgeschriebenes Alter knapp und natürlich wieder.
- source_word: וּמִנְחָתָם
  choice: und die dazugehörigen Speisopfer
  rationale: מִנְחָה bezeichnet in diesem kultischen Zusammenhang die begleitende Getreidegabe. Der Plural im Deutschen verdeutlicht die Zuordnung zu den mehreren Brandopfertieren, ohne den kollektiven Sinn des hebräischen Singulars zu verändern.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: sowie zwölf Ziegenböcke
  rationale: Die Wortgruppe bezeichnet ausdrücklich männliche Ziegen; „Ziegenböcke“ ist präzise und gegenwartssprachlich.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Die Präposition kennzeichnet die Opferbestimmung. „Sündopfer“ ist die geläufige Bezeichnung, während die mögliche Reinigungsnuance in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der priesterlichen Opfersprache
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: חַטָּאת kann sowohl den Bezug auf Sünde als auch die durch das Opfer bewirkte Reinigung hervorheben. Im Haupttext steht der etablierte und allgemein verständliche Ausdruck; die sachlich mögliche Alternative wird in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdige Standardsprache mit der knappen Struktur einer Opferliste. Die traditionelle Opfterminologie bleibt erhalten; veraltete Tierbezeichnungen werden vermieden.
