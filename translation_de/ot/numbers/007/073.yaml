  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe war eine silberne Schale[a] von hundertdreißig Schekel Gewicht und ein silbernes Becken von siebzig Schekel Gewicht, gewogen nach dem Schekel des Heiligtums[b]. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, für ein Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Platte“. Das hebräische Wort bezeichnet hier ein vermutlich flaches Gefäß aus Silber.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: nach dem für das Heiligtum geltenden Gewichtsstandard.'
    reason: clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet hier die kultische Gabe. Die Ergänzung „bestand aus“ gibt die nominale hebräische Aufzählung im Deutschen natürlich wieder.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: eine silberne Schale
  rationale: קְעָרָה bezeichnet im Inventar des Heiligtums ein eher flaches Gefäß. „Schale“ ist im modernen Deutschen natürlich und lässt Form und genaue Verwendung angemessen offen.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: von hundertdreißig Schekel Gewicht
  rationale: Die Formulierung bewahrt die ausdrückliche Gewichtsangabe und fügt sich klar in die deutsche Aufzählung ein.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ein silbernes Becken
  rationale: מִזְרָק ist ein kultisch verwendetes Gefäß, wahrscheinlich zum Auffangen oder Versprengen von Flüssigkeit. „Becken“ unterscheidet es verständlich von der zuerst genannten Schale.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: von siebzig Schekel Gewicht
  rationale: Der knappe hebräische Ausdruck bezeichnet das Gewicht des Beckens; die deutsche Wiedergabe macht diesen Bezug ausdrücklich.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: gewogen nach dem Schekel des Heiligtums
  rationale: Die Präposition bezeichnet den verbindlichen Gewichtsstandard. „Schekel des Heiligtums“ bewahrt den Genitiv des Hebräischen, während „gewogen nach“ die Funktion im Deutschen klärt.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren ... gefüllt
  rationale: Das maskuline Dualpronomen bezieht sich auf die zwei Gefäße; die Formulierung erhält diesen ausdrücklichen Rückbezug.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist das für Opfer verwendete fein verarbeitete Mehl; „Feinmehl“ ist präzise und im kultischen Zusammenhang etabliert.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: das mit Öl vermengt war
  rationale: Das feminine Partizip bezieht sich grammatisch auf סֹלֶת. Der Relativsatz bildet diesen Bezug eindeutig und in natürlichem Deutsch ab.
- source_word: לְמִנְחָה
  choice: als Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext das unblutige Mehl- beziehungsweise Getreideopfer. „Speiseopfer“ ist eine knappe, gebräuchliche deutsche Fachbezeichnung.
