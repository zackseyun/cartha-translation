source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe bestand aus einer silbernen Schale[a] — sie wog 130 Schekel — und einem silbernen Becken[b] von 70 Schekel, nach dem Schekel des Heiligtums[c]. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, als Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schüssel“; קְעָרָה bezeichnet ein eher flaches Gefäß.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schüssel“; מִזְרָק bezeichnet ein Gefäß des Opferdienstes.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: nach dem beim Heiligtum geltenden Standardgewicht.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet hier die kultische Opfergabe; die Formulierung leitet die folgende Aufzählung im Deutschen natürlich ein.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: einer silbernen Schale
  rationale: קְעָרָה bezeichnet ein flaches Gefäß beziehungsweise eine Schüssel oder Schale. „Schale“ ist für das kultische Inventar verständlich und vermeidet die heute meist flache Vorstellung eines Tellers.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: sie wog 130 Schekel
  rationale: 'Gibt die wörtliche Gewichtsangabe „ihr Gewicht: hundertdreißig“ in natürlichem Deutsch wieder.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: einem silbernen Becken
  rationale: מִזְרָק ist ein im Opferdienst verwendetes Gefäß; „Becken“ wahrt den kultischen Charakter besser als das häuslich wirkende „Schüssel“.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: von 70 Schekel
  rationale: Die knappe Maßangabe bezeichnet das Gewicht des Beckens.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die Wendung verweist auf den beim Heiligtum geltenden Gewichtsstandard; die Übersetzung macht diese Funktion klar, ohne die kultische Bezeichnung zu verlieren.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren ... gefüllt
  rationale: Bewahrt die ausdrückliche Zusammenfassung der beiden Gefäße.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Etablierte und genaue Bezeichnung für besonders feines, bei Opfergaben verwendetes Mehl.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: das mit Öl vermengt war
  rationale: Das passive Partizip bezeichnet mit Öl gemischtes Mehl; „vermengt“ ist präzise und dem würdigen Register angemessen.
- source_word: לְמִנְחָה
  choice: als Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext die unblutige, aus Mehl beziehungsweise Getreide bestehende Opfergabe; „Speiseopfer“ ist die geläufige deutsche Fachbezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Inventarsyntax. Arabische Ziffern fördern die Lesbarkeit; „Schekel“ bleibt als antike Gewichtseinheit erhalten. Die Gedankenstriche grenzen die eingeschobene Gewichtsangabe eindeutig ab.
