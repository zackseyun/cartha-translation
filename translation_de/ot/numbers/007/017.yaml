base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: de
  text: 'und zum Heilsopfer[a]: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige Widderlämmer. Das war die Opfergabe Nachschons, des Sohnes Amminadabs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Friedensopfer“, „Gemeinschaftsopfer“ oder „Wohlergehensopfer“. Der hebräische Ausdruck bezeichnet häufig ein Opfer, zu dem eine gemeinsam gehaltene Opfermahlzeit gehörte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: und als Heilsopfer
  rationale: Die Präposition לְ führt einen weiteren Teil der Opfergabe ein. „Heilsopfer“ ist ein etablierter deutscher Fachausdruck für שְׁלָמִים, ohne den möglichen Gemeinschafts- und Wohlergehensaspekt auszublenden; diese Bedeutungsbreite wird in der Fußnote genannt.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר ist eine Kollektivbezeichnung für Rindvieh und legt hier das Geschlecht nicht ausdrücklich fest.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet eindeutig männliche Schafe beziehungsweise Widder.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתּוּדִים bezeichnet männliche Ziegen; „Ziegenböcke“ ist präzise und im modernen Deutsch natürlich.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige Lämmer
  rationale: כְּבָשִׂים bezeichnet Lämmer, während בְּנֵי שָׁנָה ihr Alter als einjährig angibt. Ein männliches Geschlecht wird in dieser Formulierung nicht ausdrücklich markiert.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: Die verblose hebräische Zusammenfassung wird im deutschen Erzählzusammenhang idiomatisch mit „war“ wiedergegeben; קָרְבָּן ist hier eine kultische Opfergabe.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nachschons, des Sohnes Amminadabs
  rationale: Die Namen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die Apposition bildet das Patronym deutlich und natürlich ab.
theological_decisions:
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Heilsopfer mit Fußnote
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Kein einzelner deutscher Ausdruck deckt den kultischen Begriff vollständig ab. „Heilsopfer“ wahrt die traditionelle Fachsprache, während die Fußnote die möglichen Aspekte von Frieden, Gemeinschaft und Wohlergehen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Listenform des hebräischen Opferverzeichnisses bleibt erhalten; kultische Fachsprache wird durch eine verständliche Fußnote ergänzt.
