  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: de
  text: Am zwölften Tag war Ahira, der Sohn Enans, der Anführer der Söhne Naftalis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר יוֹם
  choice: Am zwölften Tag
  rationale: Die Präposition בְּ mit יוֹם ist temporal; die ungewöhnliche hebräische Zählformel wird im Deutschen natürlich als Ordinalangabe wiedergegeben.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Im Stammeskontext bezeichnet נָשִׂיא das anerkannte Oberhaupt beziehungsweise den führenden Vertreter; „Anführer“ ist verständlich und vermeidet die königlichen Nebenbedeutungen von „Fürst“.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: der Söhne Naftalis
  rationale: Das לְ kennzeichnet hier die Zuordnung des Anführers zum Stamm; בְּנֵי wird entsprechend der männlichen hebräischen Stammesbezeichnung mit „Söhne“ wiedergegeben.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Der Personenname wird transliteriert und nicht übersetzt.
- source_word: בֶּן עֵינָן
  choice: der Sohn Enans
  rationale: Die übliche hebräische Vaterangabe wird in natürlichem Deutsch als „der Sohn Enans“ wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische Stammesbezeichnung בְּנֵי
  choice: Söhne Naftalis
  alternative: Nachkommen Naftalis
  rationale: Die grammatisch männliche Pluralform ist die übliche Stammesbezeichnung. „Söhne“ bewahrt diese Form, ohne sie durch eine geschlechtsneutrale Deutung zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt den Namen wie im Deutschen üblich vor die Amtsbezeichnung; der Inhalt und die Zuordnungen des hebräischen Satzes bleiben erhalten.
