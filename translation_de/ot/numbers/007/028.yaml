  text: einen Ziegenbock als Sündopfer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: einen Ziegenbock
  rationale: Die Wortverbindung bezeichnet im Opferkontext einen männlichen Ziegenbock. „Ziegenbock“ gibt Geschlecht und Tierart knapp und idiomatisch wieder.
- source_word: אֶחָד
  choice: einen
  rationale: Der Akkusativ des unbestimmten Artikels ist hier zugleich die natürliche deutsche Entsprechung des Zahlworts „eins“ innerhalb der Aufzählung; „einen einzigen“ würde eine nicht vorhandene Betonung eintragen.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das Sündopfer. Die Präposition לְ kennzeichnet hier die Bestimmung beziehungsweise Funktion des Tieres und wird natürlich mit „als“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im kultischen Zusammenhang
  choice: Sündopfer
  alternative: für Sünde
  rationale: Der unmittelbare Kontext zählt Opfertiere und Opfergaben auf. Daher ist die kultische Bedeutung „Sündopfer“ gemeint, nicht die abstrakte Bedeutung „Sünde“.
translation_notes:
  register: Knappes, würdiges Standarddeutsch, passend zum Listencharakter des Verses. Keine Fußnote erforderlich.
