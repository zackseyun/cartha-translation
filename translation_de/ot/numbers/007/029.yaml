source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: de
  text: 'und als Heilsopfer: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige männliche Lämmer. Das war die Opfergabe Eliabs, des Sohnes Helons.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: und als Heilsopfer
  rationale: Die Präfixe führen die Aufzählung des vorherigen Verses fort und bezeichnen die Opferkategorie. „Heilsopfer“ ist im Deutschen eine geläufige, knappe Wiedergabe des kultischen Fachbegriffs שְׁלָמִים, ohne dessen Bedeutungsbreite auf bloße Gemeinschaft oder Wohlergehen zu verengen.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר ist eine kollektive Bezeichnung für Rindvieh und legt hier kein Geschlecht fest; „Rinder“ bewahrt diese Unbestimmtheit.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet eindeutig männliche Schafe.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתֻּדִים bezeichnet männliche Ziegen; „Ziegenböcke“ gibt Geschlecht und Tierart eindeutig wieder.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige männliche Lämmer
  rationale: בְּנֵי שָׁנָה bezeichnet das Alter von einem Jahr. Die maskuline Form כְּבָשִׂים wird in dieser Opferliste ausdrücklich als „männliche Lämmer“ wiedergegeben.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: קָרְבָּן ist eine Gott dargebrachte Gabe. Das deutsche Präteritum fügt sich natürlich in den erzählenden Rückblick ein, während der identifizierende Charakter der hebräischen Nominalkonstruktion erhalten bleibt.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Eliabs, des Sohnes Helons
  rationale: Die Namen werden transliteriert; die Apposition gibt das Patronymikon natürlich und präzise wieder.
theological_decisions:
- issue: Bedeutungsbreite von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer; Wohlergehensopfer
  rationale: Der hebräische Kultbegriff kann Frieden, Wohlergehen und die mit dem Opfer verbundene Gemeinschaft anklingen lassen. „Heilsopfer“ ist eine etablierte deutsche Bezeichnung und vermeidet eine einseitige Festlegung auf nur einen dieser Aspekte.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die knappe Listenform des Hebräischen bleibt erhalten; unnötige Ergänzungen werden vermieden. Da keine Fußnote erforderlich ist, enthält der Haupttext keinen Fußnotenmarker.
