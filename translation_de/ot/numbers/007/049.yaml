source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe bestand aus einer silbernen Schale[a], die 130 Schekel wog, und einem silbernen Becken, das 70 Schekel wog, jeweils nach dem Schekelgewicht des Heiligtums. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, als Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schüssel“; das anschließend genannte „Becken“ kann auch mit „Schale“ wiedergegeben werden.'
    reason: Die genaue Form der mit קַעֲרָה und מִזְרָק bezeichneten Gefäße ist nicht sicher; die Übersetzungen dienen vor allem dazu, die beiden Gefäßarten voneinander zu unterscheiden.
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet im kultischen Zusammenhang eine dargebrachte Gabe. „Opfergabe“ ist präzise und leitet die folgende Aufzählung im Deutschen natürlich ein.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: einer silbernen Schale
  rationale: קְעָרָה bezeichnet ein flaches oder breites Gefäß. „Schale“ ist im modernen Deutschen verständlich und lässt die genaue Gefäßform offen.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: die 130 Schekel wog
  rationale: Die Relativkonstruktion gibt die knappe hebräische Gewichtsangabe idiomatisch und eindeutig wieder.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: einem silbernen Becken
  rationale: מִזְרָק bezeichnet ein im Opferdienst verwendetes Gefäß, wahrscheinlich ein Becken oder eine Schüssel. „Becken“ unterscheidet es passend von קְעָרָה.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: das 70 Schekel wog
  rationale: Die Gewichtsangabe wird parallel zur ersten Gefäßbeschreibung formuliert.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: jeweils nach dem Schekelgewicht des Heiligtums
  rationale: Die Wendung bezeichnet den am Heiligtum geltenden Gewichtsstandard; „jeweils“ macht deutlich, dass beide Gewichtsangaben danach bemessen sind.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren ... gefüllt
  rationale: Die beiden Gefäße sind der eindeutige Bezug; die finite Form ist in modernem Deutsch flüssig.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: „Feinmehl“ ist die etablierte und sachlich genaue Bezeichnung für das hochwertige Mehl der Opfertexte.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Die Formulierung beschreibt die Zubereitung des Mehls präzise und in einem würdigen, gegenwärtigen Register.
- source_word: לְמִנְחָה
  choice: für ein Speiseopfer
  rationale: מִנְחָה bezeichnet in diesem priesterlichen Kontext das unblutige Opfer aus Mehl; „Speiseopfer“ ist der geläufige deutsche Fachausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aufzählende Inventarsprache des Hebräischen bleibt erkennbar, wird aber durch Relativsätze und einen neuen Satz gut lesbar gestaltet. Maßeinheiten werden nicht in moderne Gewichte umgerechnet, da „Schekel“ hier Teil des kultischen Gewichtsstandards ist.
