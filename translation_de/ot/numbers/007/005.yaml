  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: de
  text: Nimm sie von ihnen entgegen[a]; sie sollen für den Dienst am Zelt der Begegnung verwendet werden. Übergib sie den Leviten, jedem entsprechend seinem Dienst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nimm sie von ihnen.“ Das Verb kann sowohl das schlichte Nehmen als auch, wie hier im Zusammenhang von Gaben, das Entgegennehmen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeder gemäß seinem Dienst“; gemeint ist die Zuteilung entsprechend der jeweiligen Dienstaufgabe der Leviten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: Nimm sie von ihnen entgegen
  rationale: לקח bezeichnet hier das Annehmen der von den Stammesoberhäuptern dargebrachten Wagen und Rinder; „entgegennehmen“ gibt den Vorgang im Deutschen natürlich wieder, während „von ihnen“ die Herkunft ausdrücklich bewahrt.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: sie sollen … verwendet werden
  rationale: Die hebräische Zweckkonstruktion lautet wörtlich etwa „sie sollen zum Verrichten des Dienstes sein“. Da Wagen und Rinder die Bezugsgröße sind, bringt die passive Formulierung den gemeinten Gebrauch in natürlichem Deutsch zum Ausdruck.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: Dienst am Zelt der Begegnung
  rationale: עֲבֹדָה bezeichnet die zugewiesene Arbeit im Zusammenhang mit dem Heiligtum; „Dienst“ wahrt diesen offiziellen und kultischen Klang. אֹהֶל מוֹעֵד wird mit der geläufigen Bezeichnung „Zelt der Begegnung“ wiedergegeben.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: Übergib sie den Leviten
  rationale: נתן bedeutet grundsätzlich „geben“. „Übergeben“ passt zur konkreten Zuteilung der Gegenstände und Tiere und bleibt dem hebräischen Ausdruck nahe.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: jedem entsprechend seinem Dienst
  rationale: אִישׁ ist hier distributiv gebraucht. כְּפִי bedeutet idiomatisch „entsprechend“ bzw. „nach Maßgabe“; die Formulierung bewahrt den Bezug auf den jeweils zugewiesenen Dienst.
theological_decisions: []
