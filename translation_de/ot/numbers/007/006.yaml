  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֶת הָ/עֲגָלֹ֖ת וְ/אֶת הַ/בָּקָ֑ר וַ/יִּתֵּ֥ן אוֹתָ֖/ם אֶל הַ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: de
  text: Da nahm Mose die Wagen und die Rinder und gab sie den Leviten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das Qal-Wayyiqtol von לקח bedeutet gewöhnlich „nehmen“. Hier nimmt Mose die zuvor dargebrachten Gaben entgegen; „nahm“ gibt den Vorgang direkt und natürlich wieder.
- source_word: הָעֲגָלֹת
  choice: die Wagen
  rationale: עֲגָלוֹת bezeichnet hier Transportfahrzeuge für den Dienst am Heiligtum. „Wagen“ ist im modernen Deutschen klar und deckt die Bedeutung ohne unnötige Spezifizierung ab.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בָּקָר ist eine Kollektivbezeichnung für Rindvieh. „Rinder“ bewahrt die allgemeinere Formulierung dieses Verses; der nähere Zusammenhang bestimmt die Tiere genauer als Zugrinder.
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Das Qal-Wayyiqtol von נתן bedeutet hier schlicht „geben“. Die amtliche Zuweisung ergibt sich aus dem Zusammenhang und muss nicht in das Verb hineingelesen werden.
- source_word: אוֹתָם
  choice: sie
  rationale: Das maskuline Pluralpronomen bezieht sich zusammenfassend auf die Wagen und die Rinder. „Sie“ ist die natürliche deutsche Entsprechung.
- source_word: אֶל הַלְוִיִּם
  choice: den Leviten
  rationale: אֶל bezeichnet hier die Richtung beziehungsweise den Empfänger der Übergabe. Der deutsche Dativ nach „geben“ drückt dies idiomatisch und genau aus.
theological_decisions: []
translation_notes:
  register: Moderne, schlichte und würdige Standardsprache. Die parataktische Erzählstruktur des Hebräischen bleibt mit „Da ... und ...“ erkennbar, ohne im Deutschen schwerfällig zu wirken.
