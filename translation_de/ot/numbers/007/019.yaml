source:
  edition: WLC
  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: de
  text: 'Er brachte seine Opfergabe dar: eine silberne Schale[a], hundertdreißig Schekel schwer; ein silbernes Becken[b], siebzig Schekel schwer, gewogen nach dem Schekel des Heiligtums[c]; beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, für ein Speiseopfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine silberne Schüssel“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine silberne Schale“. Das hebräische Wort bezeichnet ein kultisches Gefäß, dessen genaue Form hier nicht näher bestimmt wird.'
    reason: lexical_alternative
  - marker: c
    text: Der „Schekel des Heiligtums“ war der beim Heiligtum geltende Gewichtsstandard.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  choice: brachte … dar
  rationale: Der Hifil von קרב bezeichnet im Opfer- und Weihekontext das Heranbringen beziehungsweise Darbringen. Die deutsche Wendung ist natürlich und bewahrt den kultischen Sinn.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן bezeichnet hier das, was im kultischen Zusammenhang dargebracht wird. „Opfergabe“ ist präzise und in modernem Deutsch verständlich.
- source_word: קַעֲרַת כֶּסֶף
  choice: eine silberne Schale
  rationale: קְעָרָה bezeichnet ein flaches Gefäß; „Schale“ gibt die Form ausreichend wieder, ohne eine nicht sicher belegte Spezialfunktion festzulegen.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: hundertdreißig Schekel schwer
  rationale: Die Gewichtsangabe mit dem femininen Suffix bezieht sich auf die Schale. Die Formulierung gibt den knappen Inventarstil idiomatisch wieder.
- source_word: מִזְרָק
  choice: ein silbernes Becken
  rationale: Das Wort bezeichnet ein im Kult verwendetes Gefäß. „Becken“ ist sachlich und lässt dessen genaue, hier nicht genannte Verwendung offen.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: gewogen nach dem Schekel des Heiligtums
  rationale: Die Wendung bezeichnet den beim Heiligtum geltenden Gewichtsstandard. Die Ergänzung „gewogen“ macht diese Funktion im Deutschen klar.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: beide waren … gefüllt
  rationale: Die Formulierung bezieht beide zuvor genannten Gefäße ausdrücklich ein.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist hochwertiges, fein verarbeitetes Mehl, das für Opfer verwendet wurde; „Feinmehl“ ist die etablierte präzise Wiedergabe.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Die Wendung beschreibt die Zubereitung des Mehls. „Vermengt“ entspricht dem Vorgang und passt zum würdigen Register.
- source_word: לְמִנְחָה
  choice: für ein Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext speziell das aus pflanzlichen Erzeugnissen bestehende Speiseopfer, nicht lediglich eine allgemeine Gabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem knappen Charakter einer kultischen Inventarliste. Die Maßeinheit „Schekel“ und der Ausdruck „Speiseopfer“ bleiben erhalten, weil sie den historischen und kultischen Kontext präzise wiedergeben.
