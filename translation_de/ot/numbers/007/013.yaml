  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: 'Und seine Opfergabe war: eine silberne Schale[a], die 130 Schekel wog, und ein silbernes Becken[b], das 70 Schekel wog, nach dem Schekelgewicht des Heiligtums. Beide waren mit Feinmehl gefüllt, das mit Öl vermischt war, für ein Speiseopfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Platte“; das hebräische Wort bezeichnet ein flaches Gefäß.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schüssel“; das hebräische Wort bezeichnet ein kultisches Gefäß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: Und seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet im kultischen Zusammenhang eine dargebrachte Gabe. „Opfergabe“ ist präzise und im Deutschen natürlich; „bestand aus“ leitet die folgende Aufzählung verständlich ein.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: einer silbernen Schale
  rationale: קְעָרָה bezeichnet ein eher flaches Gefäß. „Schale“ wahrt die allgemeine Gefäßbezeichnung, ohne eine nicht ausdrücklich genannte genaue Form festzulegen.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: die 130 Schekel wog
  rationale: Die Gewichtsangabe wird in natürlicher deutscher Syntax als Relativsatz wiedergegeben.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: einem silbernen Becken
  rationale: מִזְרָק ist ein kultisches Gefäß, das unter anderem für Flüssigkeiten verwendet wurde. „Becken“ unterscheidet es von der קְעָרָה, ohne seine hier nicht genannte Funktion zu ergänzen.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: das 70 Schekel … wog
  rationale: Die elliptische hebräische Gewichtsangabe wird für verständliches Deutsch verbal ausgedrückt.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die Wendung bezeichnet den am Heiligtum geltenden Gewichtsstandard. Diese Wiedergabe macht die Funktion verständlich und bewahrt den kultischen Bezug.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren … gefüllt
  rationale: Die ausdrückliche Bezugnahme auf beide Gefäße wird knapp und eindeutig bewahrt.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist feines, für Opfer verwendetes Mehl; „Feinmehl“ ist die etablierte präzise Entsprechung.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermischt
  rationale: Das passive Partizip bezeichnet das Vermischen des Mehls mit Öl.
- source_word: לְמִנְחָה
  choice: für ein Speiseopfer
  rationale: Im priesterlichen Opferkontext bezeichnet מִנְחָה das unblutige Mehl- beziehungsweise Speiseopfer. „Speiseopfer“ gibt die kultische Kategorie idiomatisch wieder.
