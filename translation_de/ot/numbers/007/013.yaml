- from: Und seine Opfergabe bestand aus einer silbernen Schale[a], die 130 Schekel wog, und einem silbernen Becken[b], das 70 Schekel nach dem Schekelgewicht des Heiligtums wog. Beide waren mit Feinmehl gefüllt, das für ein Speiseopfer mit Öl vermischt war.
  to: 'Und seine Opfergabe war: eine silberne Schale[a], die 130 Schekel wog, und ein silbernes Becken[b], das 70 Schekel wog, nach dem Schekelgewicht des Heiligtums. Beide waren mit Feinmehl gefüllt, das mit Öl vermischt war, für ein Speiseopfer.'
  rationale: Die Änderung beseitigt die deutsche syntaktische Mehrdeutigkeit und macht klar, dass das Feinmehl – nicht das Speiseopfer als Ganzes – mit Öl vermischt ist. Im Übrigen bleiben Inhalt, Fachterminologie, Gefäßunterscheidung und Fußnoten des Entwurfs erhalten.
