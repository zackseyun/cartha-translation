source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: de
  text: 'und für das Friedensopfer[a]: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige Lämmer. Das war die Opfergabe Eljasafs, des Sohnes Dehuels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Gemeinschaftsopfer« oder »Heilsopfer«.'
    reason: Das hebräische שְׁלָמִים kann ein Opfer bezeichnen, das mit Frieden, Wohlergehen und Gemeinschaft verbunden ist; kein einzelner deutscher Ausdruck deckt die gesamte Bedeutungsbreite ab.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: und für das Friedensopfer
  rationale: Die Präfixe führen einen weiteren Posten der Opferliste ein. »Friedensopfer« ist der geläufige deutsche kultische Fachbegriff; die möglichen Bedeutungsnuancen von Gemeinschaft und Wohlergehen werden in der Fußnote genannt.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר bezeichnet kollektiv Rindvieh und legt hier das Geschlecht nicht fest; »Rinder« wahrt diese Unbestimmtheit.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet eindeutig männliche Schafe.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתּוּדִים bezeichnet männliche Ziegen; »Ziegenböcke« ist im modernen Deutsch eindeutig und natürlich.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige Lämmer
  rationale: Die wörtliche Wendung »Söhne eines Jahres« bezeichnet das Alter; »einjährige Lämmer« gibt dies idiomatisch wieder.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: קָרְבָּן bezeichnet hier die dargebrachte Gabe. Das Präteritum fügt sich natürlich in die erzählende Zusammenfassung ein.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: Eljasafs, des Sohnes Dëuels
  rationale: Die Eigennamen werden nach üblichen deutschen Bibelkonventionen transliteriert; der Patronym-Ausdruck wird transparent wiedergegeben.
