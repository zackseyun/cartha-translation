    issue: „alle Rinder“ wird im Deutschen durch die nachfolgende Aufzählung von Widdern, Ziegenböcken und Lämmern widersprüchlich.
    rationale: Während die hebräische summarische Listenform so stehen kann, versteht modernes Deutsch „Rinder“ als bovine Tiere. „dazu“ löst diese Zuordnungsunschärfe nicht vollständig. Eine zusammenfassende Wiedergabe als „Gesamtzahl der Opfertiere“ erhält die listenabschließende Aussage und die Zahlenangaben ohne falsche zoologische Kategorie.
  revised_text: Die Gesamtzahl der Opfertiere für das Friedensopfer[a] betrug vierundzwanzig Stiere, sechzig Widder, sechzig Ziegenböcke und sechzig einjährige Lämmer. Das war die Einweihung des Altars, nachdem er gesalbt worden war.
