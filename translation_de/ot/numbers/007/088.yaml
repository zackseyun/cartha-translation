  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: de
  text: Die Gesamtzahl der Opfertiere für das Friedensopfer[a] betrug vierundzwanzig Stiere, sechzig Widder, sechzig Ziegenböcke und sechzig einjährige Lämmer. Das war die Einweihung des Altars, nachdem er gesalbt worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinschaftsopfer“ oder „Heilsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: Und alle Rinder
  rationale: Bewahrt die Verbindung durch וְ, die Gesamtheit durch כֹל und den kollektiven Sinn von בְּקַר für Rinder; die anschließende Einzelangabe nennt konkret Stiere.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: für das Friedensopfer
  rationale: „Friedensopfer“ ist eine verständliche und traditionsnahe Bezeichnung der Opfergattung; die Wendung mit „für“ gibt die Zuordnung der Tiere im Deutschen natürlich wieder. Andere mögliche Nuancen werden in der Fußnote erhalten.
- source_word: עֶשְׂרִים וְאַרְבָּעָה פָּרִים
  choice: vierundzwanzig Stiere
  rationale: Gibt Zahl und Tierbezeichnung direkt wieder; der hebräische Ausdruck verlangt hier nicht ausdrücklich „junge Stiere“.
- source_word: אֵילִם שִׁשִּׁים
  choice: sechzig Widder
  rationale: „Widder“ ist die übliche deutsche Bezeichnung für männliche Schafe im Opferkontext.
- source_word: עַתֻּדִים שִׁשִּׁים
  choice: sechzig Ziegenböcke
  rationale: Der Ausdruck bezeichnet männliche Ziegen; „Ziegenböcke“ ist im heutigen Deutsch eindeutig und natürlich.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁשִּׁים
  choice: sechzig einjährige Lämmer
  rationale: Bewahrt sowohl die Tierart als auch die für die Opferbestimmung wichtige Altersangabe.
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Das war die Einweihung des Altars
  rationale: „Einweihung“ bezeichnet hier angemessen das Einweihungsgeschehen beziehungsweise dessen zusammenfassend aufgezählte Gaben, ohne das im Hebräischen nicht ausdrücklich stehende Wort „Opfergabe“ einzufügen.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: nachdem er gesalbt worden war
  rationale: Die passive Form vermeidet es, einen im Vers nicht genannten Handelnden einzuführen; das Pronomen bezieht sich grammatisch auf den Altar.
theological_decisions:
- issue: Wiedergabe der Opfergattung שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: „Friedensopfer“ wahrt die traditionelle kultische Bezeichnung, ohne die möglichen Bedeutungsaspekte von Gemeinschaft, Wohlergehen und Ganzsein endgültig festzulegen; diese werden als Übersetzungsalternativen dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt klar und rhythmisch; „dazu“ verhindert, dass die Widder, Ziegenböcke und Lämmer grammatisch ebenfalls als Unterarten der zuvor genannten Rinder erscheinen.
