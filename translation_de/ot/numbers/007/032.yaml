  language: de
  text: eine goldene Schale im Gewicht von zehn Schekel[a], gefüllt mit Räucherwerk;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Schale, zehn, Gold, gefüllt mit Räucherwerk“. „Schekel“ und „im Gewicht von“ sind nach der wiederholten Opferformel im Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im Verzeichnis der Heiligtumsgaben bezeichnet das Wort ein kleines Gefäß für Räucherwerk, nicht die Handfläche. „Schale“ ist im heutigen Deutsch konkret und natürlich.
- source_word: אַחַת
  choice: eine
  rationale: Das Zahlwort stimmt mit dem femininen Substantiv כַּף überein und wird schlicht mit „eine“ wiedergegeben.
- source_word: עֲשָׂרָה
  choice: im Gewicht von zehn Schekeln
  rationale: Im Hebräischen steht elliptisch nur „zehn“. Aus der wiederholten Opferformel im unmittelbaren Kontext ergibt sich, dass das Gewicht in Schekeln gemeint ist. Die ergänzte Formulierung macht zugleich deutlich, dass sich die Angabe auf das Gewicht der Schale bezieht.
- source_word: זָהָב
  choice: goldene
  rationale: Das Substantiv bezeichnet hier das Material des Gefäßes. Im Deutschen ist die attributive Wiedergabe „goldene Schale“ idiomatisch und präzise.
- source_word: מְלֵאָה
  choice: gefüllt mit
  rationale: Die feminine Form beschreibt den Zustand beziehungsweise Inhalt der Schale. „Gefüllt mit“ ist natürlich und entspricht der Aussage „voll von“.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: „Räucherwerk“ bezeichnet im kultischen Zusammenhang die aromatische Substanz präziser als das allgemeinere „Weihrauch“, das auch einen einzelnen Bestandteil bezeichnen kann.
