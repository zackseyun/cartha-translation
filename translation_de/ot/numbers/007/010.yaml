base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: de
  text: Da brachten die Oberhäupter am Tag der Salbung des Altars die Weihegabe für den Altar dar. Die Oberhäupter brachten ihre Opfergabe vor dem Altar dar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: brachten … dar
  rationale: Das Hifil von קרב bezeichnet im kultischen Zusammenhang das Heranbringen bzw. Darbringen einer Gabe. „Darbringen“ ist im Deutschen natürlich und bewahrt den Opferkontext.
- source_word: הַנְּשִׂאִים
  choice: die Oberhäupter
  rationale: נָשִׂיא bezeichnet hier die führenden Repräsentanten der Stämme. „Oberhäupter“ ist präziser als das monarchisch klingende „Fürsten“ und würdevoller als das allgemeinere „Leiter“.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: die Gaben zu seiner Weihe
  rationale: Wörtlich steht „die Weihe des Altars“. Da etwas dargebracht wird und die folgenden Verse die einzelnen Gaben aufzählen, gibt die Formulierung den kontextuell gemeinten Gegenstand verständlich wieder, ohne die wörtliche Lesart zu verschweigen.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: am Tag, an dem der Altar gesalbt wurde
  rationale: Die Infinitivkonstruktion mit בְּ hat temporale Bedeutung. Das ausdrücklich wiederholte Nomen „Altar“ beseitigt im Deutschen eine mögliche unnatürliche Pronomenmehrdeutigkeit.
- source_word: קָרְבָּנָם
  choice: ihre Opfergabe
  rationale: קָרְבָּן ist eine im Heiligtum dargebrachte Gabe. „Opfergabe“ bewahrt sowohl den Gabe- als auch den kultischen Aspekt.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: vor dem Altar
  rationale: Die räumliche und kultische Wendung wird direkt und idiomatisch wiedergegeben.
