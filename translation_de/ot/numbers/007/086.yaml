source:
  edition: WLC
  text: כַּפּ֨וֹת זָהָ֤ב שְׁתֵּים עֶשְׂרֵה֙ מְלֵאֹ֣ת קְטֹ֔רֶת עֲשָׂרָ֧ה עֲשָׂרָ֛ה הַ/כַּ֖ף בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ כָּל זְהַ֥ב הַ/כַּפּ֖וֹת עֶשְׂרִ֥ים וּ/מֵאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: de
  text: zwölf goldene Schalen, voll Räucherwerk[a], jede Schale zehn Schekel schwer, nach dem Schekelgewicht des Heiligtums; das Gold aller Schalen betrug insgesamt 120 Schekel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schälchen“, „Pfannen“; traditionell auch „Löffel“. Gemeint sind Gefäße für das Räucherwerk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: Schalen
  rationale: כַּף bezeichnet hier kleine Gefäße für Räucherwerk. „Schalen“ ist im modernen Deutschen natürlich und passt zu Gefäßen, die gefüllt und gewogen werden; „Löffel“ wäre heute missverständlich.
- source_word: זָהָב
  choice: goldene
  rationale: Die Materialangabe wird im Deutschen idiomatisch als Adjektiv zum Gefäß wiedergegeben.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: zwölf
  rationale: Die Kardinalzahl gibt die Gesamtzahl der Gefäße an.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: voll Räucherwerk
  rationale: Die Formulierung gibt knapp und natürlich wieder, dass die Schalen mit Räucherwerk gefüllt waren.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: jede Schale zehn Schekel schwer
  rationale: Die Wiederholung der Zahl drückt distributiv aus, dass jede einzelne Schale zehn Schekel wog.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die kultische Maßformel bezeichnet den am Heiligtum geltenden offiziellen Gewichtsstandard. Die Übersetzung bewahrt diesen technischen Sinn in verständlichem Deutsch.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: das Gold aller Schalen
  rationale: Die Genitivformulierung fasst die gesamte Goldmenge zusammen, die auf die Schalen entfiel.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: insgesamt 120 Schekel
  rationale: Der hebräische Ausdruck bezeichnet 120; „Schekel“ wird aus der unmittelbar vorausgehenden Gewichtsangabe sinngemäß ergänzt.
