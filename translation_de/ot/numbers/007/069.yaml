  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: de
  text: einen Stier aus dem Rinderbestand, einen Widder und ein einjähriges männliches Lamm als Brandopfer;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen Stier vom Rind
  rationale: Die Wendung bezeichnet einen Stier aus dem Rinderbestand. Die knappe Form bewahrt den aufzählenden Charakter und gibt בֶּן בָּקָר sachgemäß statt unnatürlich wörtlich wieder.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist die übliche Bezeichnung für ein ausgewachsenes männliches Schaf, besonders in Opferlisten.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ein männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet ein Lamm und kann insbesondere im Opferkontext ein männliches Tier meinen; die ausdrückliche Geschlechtsangabe schafft im Deutschen die hier sachlich angemessene Präzision.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjährig
  rationale: Die hebräische Altersangabe bedeutet idiomatisch, dass das Tier ein Jahr alt beziehungsweise im ersten Lebensjahr ist.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig auf dem Altar verbrannte Opfer; »als Brandopfer« fügt sich natürlich in die Inventarliste ein.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Opfersprache in modernem Standarddeutsch. Die wiederholte Zahl אֶחָד wird durch die deutschen unbestimmten Zahlwörter »einen/ein« wiedergegeben, die hier zugleich ausdrücklich jeweils ein Tier bezeichnen. Die Listenstruktur des Hebräischen bleibt erhalten.
