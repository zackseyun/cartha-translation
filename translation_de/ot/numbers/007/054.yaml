source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: de
  text: Am achten Tag war Gamliel, der Sohn Pedazurs, der Anführer der Nachkommen Manasses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Söhne Manasses«; gemeint sind die Nachkommen beziehungsweise der Stamm Manasse.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Am achten Tag
  rationale: Die Präposition ב mit יוֹם und der Ordnungszahl bildet eine Zeitangabe. »Am achten Tag« ist die natürliche deutsche Entsprechung, ohne den im Vers nicht ausdrücklich genannten Anlass zu ergänzen.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: נָשִׂיא bezeichnet hier das anerkannte Oberhaupt einer Stammesgruppe. »Anführer« ist verständlich und vermeidet die im Deutschen irreführende königliche Bedeutung von »Fürst«.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: der Nachkommen Manasses
  rationale: Die Wendung bezeichnet die von diesem Anführer vertretene Gruppe. »Nachkommen Manasses« gibt die familiär-stammesbezogene Bedeutung von בְּנֵי natürlich wieder; die Zuordnung durch ל wird im Deutschen idiomatisch mit dem Genitiv ausgedrückt.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Der Personen- und Stammesname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: גַּמְלִיאֵל
  choice: Gamliël
  rationale: Der Personenname wird nach etablierter deutscher biblischer Namensform wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: בֶּן
  choice: Sohn
  rationale: Die übliche und direkte Wiedergabe der patronymischen Verbindung.
- source_word: פְּדָה צוּר
  choice: Pedazur
  rationale: Der zusammengesetzte Eigenname wird entsprechend der etablierten deutschen biblischen Schreibweise als ein Name wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt den Namen vor die Amtsbezeichnung und klingt dadurch im Deutschen natürlich, ohne den Aussagegehalt zu verändern. Der stammesbezogene Familienausdruck wird im Text verständlich wiedergegeben und in der Fußnote wörtlich erläutert.
