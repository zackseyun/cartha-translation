  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: de
  text: einen jungen Stier, einen Widder und ein einjähriges männliches Lamm als Brandopfer;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen jungen Stier
  rationale: Die feste Opferformel bezeichnet ein männliches Rind; »junger Stier« gibt פַּר präzise und natürlich wieder. בֶּן בָּקָר gehört zur näheren Bestimmung des Rindes und muss im Deutschen nicht zusätzlich mit »aus der Herde« wiederholt werden.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist die übliche Bezeichnung für ein ausgewachsenes männliches Schaf; »Widder« ist das genaue deutsche Äquivalent.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ein männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet hier im Opferverzeichnis ein männliches Lamm. Die Geschlechtsangabe wird ausdrücklich wiedergegeben.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjährig
  rationale: Die hebräische Wendung bezeichnet ein Tier in seinem ersten Lebensjahr beziehungsweise von einem Jahr; »einjährig« ist in dieser Aufzählung knapp und idiomatisch.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; die Präposition לְ wird in der deutschen Opferliste natürlich mit »als« wiedergegeben.
- source_word: אֶחָד
  choice: ein/einen
  rationale: Die bei jedem Tier wiederholte Zahl wird im Deutschen durch den unbestimmten Artikel mit Zahlwert ausgedrückt; so bleibt die Einzelzählung erhalten, ohne unnatürlich zu klingen.
