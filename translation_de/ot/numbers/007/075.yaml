  source_fidelity: Der Entwurf gibt die drei einzeln gezählten Opfertiere und ihre Bestimmung als Brandopfer sachgerecht wieder. »Junger Stier« ist für פַּר בֶּן־בָּקָר in der deutschen Opfersprache eine etablierte und angemessene Wiedergabe. »Einjähriges männliches Lamm« entspricht כֶּבֶשׂ ... בֶּן־שְׁנָתוֹ; »Widder« entspricht אַיִל. Die unbestimmten Artikel markieren in dieser Inventarform je ein Tier ausreichend.
