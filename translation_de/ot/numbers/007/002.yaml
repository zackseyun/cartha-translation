  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: de
  text: Da brachten die führenden Männer Israels, die Oberhäupter ihrer Vaterhäuser[a], Gaben dar.[b] Sie waren die Führer der Stämme; sie standen den Gemusterten vor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein »Vaterhaus« war ein größerer, durch gemeinsame Abstammung verbundener Familienverband.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »brachten heran«; gemeint ist hier das Darbringen der Einweihungsgaben.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »hatten die Aufsicht über die Gezählten«. Gemeint sind die bei der Zählung erfassten beziehungsweise gemusterten Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: brachten … Gaben dar
  rationale: Der Hifil von קרב bedeutet wörtlich »heranbringen« und bezeichnet im kultischen Zusammenhang das Darbringen oder Präsentieren. Das nicht ausdrücklich genannte Objekt wird aus dem unmittelbaren Kontext der Einweihungsgaben erschlossen; »Gaben darbringen« ist im Deutschen natürlich und wahrt den kultischen Bezug.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: die führenden Männer Israels
  rationale: נָשִׂיא bezeichnet hier keine Königssöhne, sondern anerkannte Stammes- und Sippenführer. »Führende Männer« ist gegenwärtiges, verständliches Deutsch und vermeidet die irreführende Wiedergabe »Fürsten«.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: die Oberhäupter ihrer Vaterhäuser
  rationale: Die Wendung bezeichnet die Leiter größerer, durch gemeinsame Abstammung verbundener Familienverbände. »Vaterhäuser« erhält die patriarchale Verwandtschaftsterminologie des Hebräischen; eine Fußnote erläutert den historischen Sinn.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: Sie waren die Führer der Stämme
  rationale: מַטֶּה bedeutet wörtlich »Stab«, ist hier aber die übliche Bezeichnung für einen Stamm. Die Wiedergabe nennt den gemeinten sozialen Verband direkt.
- source_word: הֵם הָעֹמְדִים עַל
  choice: standen … vor
  rationale: עמד mit עַל kann das Übergeordnetsein beziehungsweise die Aufsicht bezeichnen. Die deutsche Wendung »jemandem vorstehen« gibt die Leitungsfunktion idiomatisch wieder, ohne das konkrete Bild unnötig auszubauen.
- source_word: הַפְּקֻדִים
  choice: den Gemusterten
  rationale: Das passive Wort von פקד bezeichnet die bei der Zählung Erfassten beziehungsweise Registrierten. »Gemusterte« bewahrt den Zusammenhang von Volkszählung und dienstfähiger Mannschaft, ohne ausschließlich eine moderne militärische Musterung zu meinen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Führende Männer« vermeidet das heute missverständliche »Fürsten«; »Vaterhäuser« bewahrt mit Erläuterung die historische Sozialstruktur. Der zweite Satz ist gegenüber einer streng abbildenden Wiederholung leicht verbunden, ohne inhaltliche Elemente auszulassen.
