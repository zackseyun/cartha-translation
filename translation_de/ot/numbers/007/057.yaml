  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: de
  text: einen jungen Stier, einen Widder und ein einjähriges männliches Lamm als Brandopfer;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen jungen Stier
  rationale: פַּר bezeichnet einen Stier beziehungsweise Jungstier; בֶּן בָּקָר ist eine idiomatische nähere Bestimmung aus dem Rinderbestand. Im Deutschen gibt »junger Stier« die gesamte Wendung natürlich und ohne die schwerfällige wörtliche Form »Sohn des Rindes« wieder.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist im Opferkontext die übliche Bezeichnung für ein erwachsenes männliches Schaf.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: ein einjähriges männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet hier ein Lamm; die männliche Form des hebräischen Substantivs und der Opferkontext rechtfertigen die ausdrückliche Geschlechtsangabe. בֶּן שְׁנָתוֹ wird idiomatisch als »einjährig« wiedergegeben.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist der feste Opferbegriff für das Brandopfer; die Präposition לְ bezeichnet hier die Bestimmung der Tiere.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch im Stil einer Opferinventarliste. Die dreifache hebräische Zahl אֶחָד wird durch die deutschen unbestimmten Zahlwörter »einen/ein« wiedergegeben, die hier zugleich jeweils »einen einzigen« ausdrücken. Keine Fußnote nötig, da »junger Stier« die hebräische Gesamtwendung sachgerecht und verständlich abbildet.
