  language: de
  text: je einen Stier aus der Rinderherde, je einen Widder und je ein einjähriges männliches Lamm als Brandopfer;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen Stier aus der Rinderherde
  rationale: פַּר bezeichnet einen Stier bzw. jungen Stier; בֶּן בָּקָר spezifiziert idiomatisch seine Zugehörigkeit zum Rindvieh. Die Wiedergabe ist natürlich und bewahrt beide Angaben ohne unverständliche Wörtlichkeit.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist im Opferkontext die übliche Bezeichnung für einen ausgewachsenen männlichen Schafbock; »Widder« ist die geläufige deutsche Entsprechung.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: ein einjähriges männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet hier ein Lamm, im Opferkontext männlich; בֶּן שְׁנָתוֹ gibt sein Alter als einjährig bzw. im ersten Lebensjahr an.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig auf dem Altar verbrannte Opfer. »Brandopfer« ist der etablierte, verständliche deutsche Sachbegriff; die Präposition לְ wird im Listenzusammenhang natürlich mit »als« wiedergegeben.
- source_word: אֶחָד
  choice: einen / ein
  rationale: Die dreifache Wiederholung des Zahlworts wird beibehalten und markiert jeweils genau ein Opfertier.
