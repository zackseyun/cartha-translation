id: NUM.7.9
reference: Numbers 7:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: de
  text: Den Söhnen Kehats aber gab er nichts[a], denn ihnen oblag der Dienst an den heiligen Dingen; sie sollten sie auf der Schulter tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: keine Wagen und Rinder (siehe Vers 3–8).'
    reason: Das Hebräische nennt den Gegenstand von „gab“ nicht erneut; der vorhergehende Zusammenhang macht ihn deutlich.
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Den Söhnen Kehats aber
  rationale: לִבְנֵי bezeichnet den indirekten Empfänger; „Söhne Kehats“ bewahrt die formale Sippenbezeichnung. Das nachgestellte „aber“ gibt den Gegensatz zu den zuvor bedachten levitischen Gruppen natürlich wieder.
- source_word: לֹא נָתָן
  choice: gab er nichts
  rationale: Das nicht ausdrücklich genannte Objekt sind nach dem Zusammenhang die Wagen und Rinder. „Nichts“ macht diesen Rückbezug im Deutschen knapp und idiomatisch deutlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung dafür ein, dass Kehats Söhne keine Wagen und Rinder erhielten.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: der Dienst an den heiligen Dingen
  rationale: עֲבֹדָה bedeutet „Dienst/Arbeit“; הַקֹּדֶשׁ bezieht sich hier im Kontext wahrscheinlich auf die den Kehatitern anvertrauten heiligen Gegenstände. Die Formulierung wahrt zugleich den Dienstaspekt.
- source_word: עֲלֵיהֶם
  choice: ihnen oblag
  rationale: Die hebräische Wendung bezeichnet eine ihnen auferlegte Zuständigkeit. „Ihnen oblag“ gibt diesen Verpflichtungscharakter in würdigem, natürlichem Deutsch wieder.
- source_word: בַּכָּתֵף
  choice: auf der Schulter
  rationale: Die Einzahl steht im Hebräischen kollektiv beziehungsweise distributiv. Die wörtliche deutsche Wendung ist verständlich und bewahrt das Bild.
- source_word: יִשָּׂאוּ
  choice: sie sollten sie tragen
  rationale: Das Imperfekt drückt hier die vorgeschriebene Aufgabe aus. Das zweite „sie“ ergänzt das im Hebräischen unausgesprochene Objekt, die heiligen Dinge.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sachliche Spannung zwischen der wörtlichen Wendung „Dienst des Heiligen“ und dem kontextuell wahrscheinlichen Bezug auf heilige Gegenstände wird durch „Dienst an den heiligen Dingen“ wiedergegeben; eine stärker formale Alternative wäre „der Dienst am Heiligtum“.
