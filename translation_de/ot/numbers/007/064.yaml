lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Wendung bezeichnet idiomatisch einen männlichen Ziegenbock. „Ziegenbock“ ist im modernen Deutschen eindeutig und bewahrt die für das Opfer relevante Tier- und Geschlechtsangabe.
- source_word: אֶחָד
  choice: einen
  rationale: Der ausdrücklich genannte Numerus wird im Akkusativ durch „einen“ wiedergegeben und entspricht dem aufzählenden Stil des Kapitels.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet hier im kultischen Zusammenhang das Sündopfer; die Präposition לְ gibt die Bestimmung des Tieres an, was im Deutschen natürlich mit „als“ ausgedrückt wird.
