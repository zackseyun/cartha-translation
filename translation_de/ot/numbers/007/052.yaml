lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Verbindung bezeichnet im Opferkontext einen männlichen Ziegenbock. „Ziegenbock“ gibt Tierart und Geschlecht knapp und natürlich wieder, ohne den idiomatischen hebräischen Plural wörtlich nachzubilden.
- source_word: אֶחָד
  choice: einen
  rationale: Der Zahlwert „eins“ bleibt in der Akkusativform des unbestimmten Artikels beziehungsweise Zahlworts erhalten; in dieser Aufzählung bezeichnet „einen“ genau ein Opfertier und klingt im Deutschen natürlicher als „einen einzigen“.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet hier aufgrund des kultischen Listen-Kontexts das Sündopfer, nicht abstrakt die Sünde. Die Präposition לְ wird mit „als“ idiomatisch und sachgerecht wiedergegeben.
