base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: de
  text: 'und als Friedensopfer[a]: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige männliche Lämmer. Das war die Opfergabe Abidans, des Sohnes Gideonis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gemeinschaftsopfer“ oder „Heilsopfer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: und als Friedensopfer
  rationale: Die Präfixe führen die Opferliste aus dem vorherigen Vers fort. „Friedensopfer“ gibt den kultischen Ausdruck זֶבַח הַשְּׁלָמִים knapp und traditionsnah wieder, ohne seine Bedeutungsbreite in der Fußnote zu verschweigen.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר bezeichnet kollektiv Rindvieh; „Rinder“ legt das Geschlecht nicht genauer fest, als es der hebräische Text tut.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet spezifisch männliche Schafe; „Widder“ ist die präzise und geläufige deutsche Entsprechung.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתֻּדִים bezeichnet männliche Ziegen. „Ziegenböcke“ ist im heutigen Deutsch eindeutig und natürlich.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige Widderlämmer
  rationale: כְּבָשִׂים bezeichnet hier männliche Lämmer, und בְּנֵי שָׁנָה gibt ihr Alter als einjährig an. „Widderlämmer“ bewahrt die Geschlechtsangabe kompakt.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: Die nominale Schlussformel enthält im Hebräischen keine ausdrückliche Zeitform. Das Präteritum fügt sich natürlich in den berichtenden deutschen Kontext; „Opfergabe“ gibt קָרְבַּן angemessen wieder.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: Abidans, des Sohnes Gidonis
  rationale: Die Namen werden nach der hebräischen Form als Abidan und Gidoni wiedergegeben; die deutsche Genitivkonstruktion drückt das Patronym natürlich aus.
theological_decisions:
- issue: Bedeutungsumfang von הַשְּׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: Der Ausdruck kann Frieden, Wohlergehen und die mit dem Opfer verbundene Gemeinschaft anklingen lassen. Der Haupttext verwendet den etablierten kultischen Begriff, während die Fußnote die echte lexikalische Spannweite offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt knapp und formelhaft; Fachsprache wird nur dort verwendet, wo der kultische Text sie erfordert.
