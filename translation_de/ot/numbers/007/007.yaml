  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: de
  text: Die zwei Wagen[a] und die vier Rinder[b] gab er den Söhnen Gerschons, entsprechend ihrem Dienst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Karren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vier Stück Rindvieh“; im Zusammenhang handelt es sich um Zugtiere. Das Hebräische verwendet eine Sammelbezeichnung für Rinder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: Wagen
  rationale: עֲגָלָה bezeichnet einen Wagen für den Transport. „Wagen“ ist im Deutschen natürlich und passt zum Transport des Heiligtums; „Karren“ bleibt als mögliche Alternative in einer Fußnote erhalten.
- source_word: הַבָּקָר
  choice: Rinder
  rationale: בָּקָר ist eine kollektive Bezeichnung für Rindvieh. „Rinder“ wahrt diese Unbestimmtheit, ohne Geschlecht oder Kastration festzulegen; im Zusammenhang sind Zugtiere gemeint.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: den Söhnen Gerschons
  rationale: Die Formulierung gibt die hebräische Verwandtschaftsbezeichnung wörtlich und im Deutschen verständlich wieder, statt sie durch „den Gerschonitern“ zu ersetzen.
- source_word: כְּפִי עֲבֹדָתָם
  choice: entsprechend ihrem Dienst
  rationale: כְּפִי bedeutet hier „entsprechend/gemäß“, und עֲבֹדָה bezeichnet den zugewiesenen Dienst am Heiligtum. Die Wiedergabe ist natürlich und bewahrt den Bezug auf ihre Aufgabe.
- source_word: נָתַן
  choice: gab er
  rationale: נָתַן bedeutet schlicht „geben“. Die Übersetzung vermeidet das stärker deutende „teilte er zu“.
