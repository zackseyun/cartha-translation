  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen jungen Stier aus der Rinderherde
  rationale: פַּר bezeichnet im Opferkontext einen Stier beziehungsweise jungen Stier; בֶּן בָּקָר ordnet ihn idiomatisch dem Rindvieh zu. Die Wiedergabe ist im Deutschen natürlich und bewahrt beide Angaben.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist die übliche Bezeichnung für ein ausgewachsenes männliches Schaf; der Akkusativ fügt sich in die fortlaufende Opferliste ein.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ein männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet im Opferkontext ein Lamm und häufig ausdrücklich ein männliches Tier. Die Geschlechtsangabe wird deshalb im Text sichtbar gemacht.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjähriges
  rationale: Die hebräische Wendung bezeichnet idiomatisch ein Tier im Alter von einem Jahr; das deutsche Adjektiv ist knapp und natürlich.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist der feststehende Opferbegriff für das vollständig verbrannte Opfer; לְ bezeichnet hier die Bestimmung beziehungsweise Funktion.
