base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: de
  text: Am vierten Tag war Elizur, der Sohn Schedeurs, der Stammesführer[a] der Söhne Rubens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Oberhaupt“, traditionell „Fürst“; das hebräische Wort bezeichnet hier das offizielle Oberhaupt eines Stammes.
    reason: lexical_alternative
  - marker: b
    text: Oder „für die Söhne Rubens“; die hebräische Präposition kann hier Zugehörigkeit oder Vertretung ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: Am … Tag
  rationale: Die Präposition בְּ mit יוֹם bezeichnet in dieser Aufzählung den Zeitpunkt; „am … Tag“ ist die natürliche deutsche Wiedergabe.
- source_word: הָרְבִיעִי
  choice: vierten
  rationale: Das Ordinalzahlwort bestimmt „Tag“ und wird unmittelbar mit „vierten“ wiedergegeben.
- source_word: נָשִׂיא
  choice: Stammesführer
  rationale: Das Wort bezeichnet hier das anerkannte Oberhaupt eines Stammes. „Stammesführer“ macht die amtliche und stammesbezogene Funktion deutlich, ohne den missverständlichen königlichen Sinn von „Fürst“ nahezulegen.
- source_word: לִבְנֵי רְאוּבֵן
  choice: der Söhne Rubens
  rationale: לְ kennzeichnet hier Zugehörigkeit beziehungsweise Vertretung. Die Formulierung bewahrt das familiär-stammesbezogene Bild des Hebräischen.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Der Personenname wird nach geläufiger deutscher Schreibweise transliteriert.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die übliche hebräische Abstammungsangabe wird im Deutschen als Apposition natürlich wiedergegeben.
- source_word: שְׁדֵיאוּר
  choice: Schedeürs
  rationale: Der Personenname wird in geläufiger deutscher Form transliteriert und wegen der Konstruktion „Sohn …“ in den Genitiv gesetzt.
