base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: »Je ein Stammesoberhaupt pro Tag, je ein Stammesoberhaupt pro Tag sollen ihre Opfergabe zur Einweihung des Altars darbringen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich wiederholt der hebräische Text: „ein Oberhaupt für den Tag, ein Oberhaupt für den Tag“. Das Verb und „ihre Opfergabe“ stehen im Plural; die Formel beschreibt die geregelte Abfolge der Darbringungen.'
    reason: Die Fußnote erläutert die auffällige Wiederholung und den hebräischen Plural, ohne den Zweckausdruck aus einer angeblich vollständigen wörtlichen Wiedergabe auszulassen oder eine über den Wortlaut hinausgehende Ergänzung einzutragen.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נָשִׂיא
  choice: Stammesoberhaupt
  rationale: Im Zusammenhang sind die Oberhäupter der israelitischen Stämme gemeint; die Wiedergabe benennt ihre Funktion klar und vermeidet die monarchische Nebenbedeutung von „Fürst“.
- source_word: אֶחָד ... לַיּוֹם
  choice: jeweils ein ... pro Tag
  rationale: Die distributive Bedeutung der wiederholten Wendung wird in idiomatischem Deutsch ausgedrückt, während ihre auffällige Wiederholung erhalten bleibt.
- source_word: יַקְרִיבוּ
  choice: soll ... darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferzusammenhang das Darbringen. Das hebräische Verb steht im Plural, bezieht sich aber distributiv auf die nacheinander handelnden Stammesoberhäupter; daher ist im Deutschen der Singular natürlich.
- source_word: קָרְבָּנָם
  choice: seine Opfergabe
  rationale: Das hebräische Suffix ist formal pluralisch („ihre“), erhält im distributiven deutschen Satz jedoch passend den Singular; „Opfergabe“ bezeichnet eine Gott dargebrachte Gabe klar.
- source_word: לַחֲנֻכַּת
  choice: zur Einweihung
  rationale: Die Präposition bezeichnet hier Zweck beziehungsweise Anlass; „Einweihung“ ist die natürliche deutsche Bezeichnung für die feierliche Indienstnahme des Altars.
- source_word: הַמִּזְבֵּחַ
  choice: des Altars
  rationale: „Altar“ ist die sachlich und kultisch übliche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholung des Hebräischen bleibt im Haupttext erhalten. „Stammesoberhaupt“ verdeutlicht den Kontext; die Fußnote dokumentiert die allgemeinere wörtliche Bedeutung „Oberhaupt“ und die hebräische Satzform.
