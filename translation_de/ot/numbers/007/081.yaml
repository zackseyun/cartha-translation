  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: einen Stier aus der Rinderherde
  rationale: פַּר bezeichnet einen Stier beziehungsweise Jungstier; בֶּן בָּקָר ordnet ihn dem Rindvieh zu. Die Formulierung gibt beides natürlich wieder, ohne den hebräischen Ausdruck wörtlich zu überladen.
- source_word: אֶחָד
  choice: einen / ein
  rationale: Die wiederholte Zahl »eins« gliedert die Opferliste. Die deutschen Akkusativformen bewahren diese Zählstruktur.
- source_word: אַיִל
  choice: Widder
  rationale: Dies ist die übliche und sachlich genaue Bezeichnung für das männliche erwachsene Schaf im Opferkontext.
- source_word: כֶּבֶשׂ
  choice: männliches Lamm
  rationale: Das Wort bezeichnet hier ein männliches Lamm; die Geschlechtsangabe des Hebräischen bleibt ausdrücklich erhalten.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjähriges
  rationale: Die hebräische Altersangabe wird im heutigen Deutsch idiomatisch und knapp mit »einjährig« wiedergegeben.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet das Brandopfer, bei dem das Opfertier vollständig verbrannt wurde. »Als« passt natürlich zur Funktion des Tieres in dieser Aufzählung.
