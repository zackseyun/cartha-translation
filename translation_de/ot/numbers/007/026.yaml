  text: eine goldene Schale von zehn Schekel Gewicht[a], gefüllt mit Räucherwerk;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine goldene Schale, zehn, gefüllt mit Räucherwerk“; „Schekel Gewicht“ ist nach der üblichen Opfergabenformel im unmittelbaren Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im Zusammenhang des Heiligtums bezeichnet das Wort ein kleines Gefäß. „Schale“ ist im modernen Deutschen natürlich und eignet sich für ein Gefäß mit Räucherwerk.
- source_word: אַחַת
  choice: eine
  rationale: Die einfache Kardinalzahl wird direkt wiedergegeben und stimmt mit dem femininen Substantiv „Schale“ überein.
- source_word: עֲשָׂרָה
  choice: von zehn Schekel Gewicht
  rationale: Im Hebräischen steht wörtlich nur „zehn“; die Maßeinheit ergibt sich aus der wiederkehrenden Opfergabenformel im unmittelbaren Zusammenhang. Die Formulierung macht deutlich, dass das Gewicht gemeint ist.
- source_word: זָהָב
  choice: goldene
  rationale: Das Material des Gefäßes wird im Deutschen idiomatisch durch das Adjektiv „golden“ ausgedrückt.
- source_word: מְלֵאָה
  choice: gefüllt mit
  rationale: Das feminine Prädikatsadjektiv bezeichnet den Inhalt des Gefäßes; „gefüllt mit“ ist eine natürliche deutsche Wiedergabe.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: „Räucherwerk“ bezeichnet passend die aromatische Substanz, die im Heiligtumsdienst verbrannt wurde.
