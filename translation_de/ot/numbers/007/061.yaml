source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe bestand aus einer silbernen Schale[a], die 130 Schekel wog, und einem silbernen Becken[b], das 70 Schekel wog, nach dem Schekelgewicht des Heiligtums[c]. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, für ein Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „flache Schüssel“. Das hebräische Wort bezeichnet ein eher flaches Gefäß.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schüssel“. Gemeint ist ein Gefäß, das im Heiligtumsdienst verwendet wurde.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: nach dem beim Heiligtum geltenden Standardgewicht für einen Schekel.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Seine Opfergabe bestand aus
  rationale: קָרְבָּן bezeichnet hier die kultische Opfergabe. „bestand aus“ verbindet die nominale Inventarliste natürlich mit ihren Bestandteilen.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: einer silbernen Schale
  rationale: קְעָרָה bezeichnet ein eher flaches Gefäß; „Schale“ ist im Deutschen natürlich und lässt die genaue Form angemessen offen.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: die 130 Schekel wog
  rationale: Gibt die wörtliche Gewichtsangabe idiomatisch und eindeutig wieder.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: einem silbernen Becken
  rationale: מִזְרָק bezeichnet ein im Heiligtumsdienst gebrauchtes Gefäß; „Becken“ wahrt den kultischen Charakter besser als das häuslich klingende „Schüssel“.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: das 70 Schekel wog
  rationale: Die im Hebräischen knappe zweite Gewichtsangabe wird zur Klarheit parallel zur ersten formuliert.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die Wendung bezeichnet den beim Heiligtum geltenden Gewichtsstandard, nicht eine eigene Münzsorte.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren ... gefüllt
  rationale: Bewahrt den ausdrücklichen Bezug auf beide Gefäße und gibt das prädikative מְלֵאִים natürlich wieder.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Übliche und präzise Bezeichnung für das hochwertige Mehl der Opferbestimmungen.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: das mit Öl vermengt war
  rationale: Gibt das passive Partizip klar wieder; „vermengt“ ist würdig und im Opferkontext natürlich.
- source_word: לְמִנְחָה
  choice: als Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Kontext das aus Getreide beziehungsweise Mehl bestehende Opfer; „Speiseopfer“ ist der etablierte präzise deutsche Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Inventarstruktur. Die Zahlen werden zur schnellen Erfassbarkeit als Ziffern gesetzt. Die beiden unterschiedlichen Gefäßbegriffe des Hebräischen bleiben unterschieden; kultische Fachsprache wird nur dort verwendet, wo sie sachlich nötig ist.
