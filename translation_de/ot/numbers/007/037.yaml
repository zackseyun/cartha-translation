source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: de
  text: Seine Opfergabe war eine silberne Schale[a] mit einem Gewicht von 130 Schekel und ein silbernes Becken[b] mit einem Gewicht von 70 Schekel, jeweils nach dem Schekel des Heiligtums[c]. Beide waren mit Feinmehl gefüllt, das mit Öl vermengt war, für ein Speiseopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schüssel«. Das hebräische Wort bezeichnet ein Gefäß, möglicherweise eine eher flache Schale oder Schüssel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sprengschale«. Das hebräische Gefäßwort wird andernorts für eine im Kult verwendete Schale gebraucht, unter anderem beim Sprengen von Blut.'
    reason: lexical_alternative
  - marker: c
    text: Der »Schekel des Heiligtums« war der beim Heiligtum geltende Gewichtsstandard.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן bezeichnet eine im Gottesdienst dargebrachte Gabe. »Opfergabe« ist im Deutschen klar und wahrt den kultischen Zusammenhang.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: eine silberne Schale
  rationale: קַעֲרָה kann eine Schale, Schüssel oder flache Platte bezeichnen. »Schale« ist ein natürlicher, ausreichend weiter Gefäßbegriff; die alternative Form »Schüssel« wird in der Fußnote genannt.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: sie wog 130 Schekel
  rationale: 'Die hebräische Nominalfügung lautet sinngemäß »ihr Gewicht: dreißig und hundert«. Die verbale deutsche Form gibt dies knapp und natürlich wieder.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: ein silbernes Becken
  rationale: מִזְרָק bezeichnet ein im Kult verwendetes Becken oder eine Schale, teils zum Sprengen von Flüssigkeiten. »Becken« vermeidet im Haupttext eine nicht ausdrücklich genannte Funktionsbestimmung.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: von 70 Schekel
  rationale: Die Angabe bezeichnet das Gewicht des Beckens; die knappe Form ist im Zusammenhang eindeutig.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: gewogen nach dem Schekel des Heiligtums
  rationale: Die Wendung bezeichnet den beim Heiligtum geltenden Gewichtsstandard. Das ergänzte »gewogen« macht diese Funktion im Deutschen klar, ohne die kultische Bezugnahme aufzulösen.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Beide waren … gefüllt
  rationale: Das Dualpronomen bezieht sich ausdrücklich auf die beiden Gefäße; die deutsche Form wahrt diesen Bezug.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist der übliche priesterliche Ausdruck für besonders feines Mehl als Opferstoff. »Feinmehl« ist präzise und idiomatisch.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Die Form beschreibt das Vermischen des Mehls mit Öl. »Vermengt« ist würdig, verständlich und im Opferkontext natürlich.
- source_word: לְמִנְחָה
  choice: für ein Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Kontext das unblutige Opfer aus Mehl beziehungsweise Getreide. »Speiseopfer« ist der etablierte deutsche Fachausdruck und vermeidet die missverständliche Vorstellung, unverarbeitetes Korn sei gemeint.
