  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: de
  text: eine goldene Schale[a] im Gewicht von zehn Schekeln[b], gefüllt mit Räucherwerk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Pfanne«, »Napf«; traditionell auch »Löffel«. Gemeint ist hier ein kleines Gefäß.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »eine goldene Schale, zehn Gold, gefüllt mit Räucherwerk«. »Schekel« ist aus dem Zusammenhang als Gewichtseinheit ergänzt.'
    reason: supplied_for_clarity
lexical_decisions:
- source_word: כַּף
  choice: Schale
  rationale: Im Zusammenhang der Heiligtumsgaben bezeichnet das Wort ein kleines Gefäß. »Schale« ist im heutigen Deutsch verständlich und vermeidet die irreführende Vorstellung eines gewöhnlichen Esslöffels.
- source_word: אַחַת
  choice: eine
  rationale: Die Kardinalzahl stimmt mit dem femininen Substantiv כַּף überein und wird direkt wiedergegeben.
- source_word: עֲשָׂרָה זָהָב
  choice: im Gewicht von zehn Schekeln
  rationale: Die hebräische Kurzform »zehn Gold« bezeichnet im Kontext das Gewicht des goldenen Gefäßes. Die Maßeinheit Schekel wird aus der unmittelbar vorausgehenden Inventarformel ergänzt.
- source_word: מְלֵאָה
  choice: gefüllt mit
  rationale: Das feminine Adjektiv beschreibt den Inhalt der Schale; die verbale deutsche Formulierung ist natürlich und präzise.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Das Wort bezeichnet die aromatische Substanz, die im Gottesdienst verbrannt wird; »Räucherwerk« ist dafür die übliche sachgerechte Bezeichnung.
