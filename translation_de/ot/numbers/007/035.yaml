  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: de
  text: 'und zum Heilsopfer[a]: zwei Rinder, fünf Widder, fünf Ziegenböcke und fünf einjährige Lämmer. Das war die Opfergabe Elizurs, des Sohnes Schedëurs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Friedensopfer oder Gemeinschaftsopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: und zum Heilsopfer
  rationale: Die Präfixe führen einen weiteren Posten der Opferliste ein. „Heilsopfer“ ist ein etablierter deutscher kultischer Fachbegriff für שְׁלָמִים; die Fußnote wahrt die Bedeutungsbreite.
- source_word: בָּקָר שְׁנַיִם
  choice: zwei Rinder
  rationale: בָּקָר bezeichnet kollektiv Großvieh beziehungsweise Rinder und legt das Geschlecht hier nicht fest.
- source_word: אֵילִם חֲמִשָּׁה
  choice: fünf Widder
  rationale: אֵילִם bezeichnet eindeutig männliche Schafe.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: fünf Ziegenböcke
  rationale: עַתֻּדִים bezeichnet männliche Ziegen; „Ziegenböcke“ gibt diese Spezifizierung knapp und natürlich wieder.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: fünf einjährige Lämmer
  rationale: כְּבָשִׂים bezeichnet hier Lämmer, und בְּנֵי שָׁנָה gibt ihr Alter als einjährig an. Eine ausdrückliche Geschlechtsangabe wird im Deutschen nicht ergänzt.
- source_word: זֶה קָרְבַּן
  choice: Das war die Opfergabe
  rationale: קָרְבָּן ist eine Gott dargebrachte Gabe. Das deutsche Präteritum fügt sich natürlich in den erzählenden Zusammenhang ein.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizurs, des Sohnes Schedëurs
  rationale: Der Genitiv gibt die Zugehörigkeit der Opfergabe idiomatisch wieder; das Patronym wird ausdrücklich bewahrt.
theological_decisions:
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Der hebräische Opferbegriff kann Frieden, Wohlergehen und Gemeinschaft anklingen lassen. „Heilsopfer“ dient als knapper etablierter Hauptbegriff, ohne die möglichen Nuancen durch eine dogmatische Festlegung auszuschließen.
translation_notes:
  register: Moderne, würdige Standardsprache; die knappe Form einer kultischen Inventarliste bleibt erhalten. Die Namensform „Schedëur“ nutzt das Trema zur Kennzeichnung der getrennten Vokale.
