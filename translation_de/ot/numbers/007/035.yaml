  source_fidelity: Der Text gibt die hebräische Aufzählung vollständig und in der richtigen Reihenfolge wieder. „zum Heilsopfer“ bildet וּלְזֶבַח הַשְּׁלָמִים angemessen ab; „zwei Rinder“, „fünf Widder“, „fünf Ziegenböcke“ und „fünf einjährige Lämmer“ entsprechen den jeweiligen Tier- und Mengenangaben. Die abschließende Formel samt Patronym ist korrekt wiedergegeben.
