lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Verbindung bezeichnet idiomatisch ein männliches Tier aus den Ziegen. „Ziegenbock“ ist im heutigen Deutschen klar und für eine Opferliste angemessen.
- source_word: אֶחָד
  choice: einen
  rationale: Das Zahlwort zählt das Opfertier. Im Deutschen bringt der Akkusativ „einen“ innerhalb der fortlaufenden Aufzählung sowohl die Zahl als auch die syntaktische Einbindung natürlich zum Ausdruck.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet im Opferkontext das Sündopfer; die Präposition ל kann hier idiomatisch mit „als“ wiedergegeben werden und bezeichnet die Opferfunktion des Tieres.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im kultischen Kontext
  choice: Sündopfer
  alternative: Sünde
  rationale: Da der Vers zu einer Opferinventarliste gehört, ist hier die kultische Bedeutung gemeint. Die Fußnote bewahrt dennoch die lexikalische Grundbedeutung und Mehrdeutigkeit des hebräischen Ausdrucks.
translation_notes:
  register: Knappes, würdiges Standarddeutsch; die elliptische Aufzählungsform des hebräischen Opferinventars bleibt erhalten.
