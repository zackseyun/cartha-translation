source:
  edition: WLC
  text: שְׁלֹשִׁ֣ים וּ/מֵאָ֗ה הַ/קְּעָרָ֤ה הָֽ/אַחַת֙ כֶּ֔סֶף וְ/שִׁבְעִ֖ים הַ/מִּזְרָ֣ק הָ/אֶחָ֑ד כֹּ֚ל כֶּ֣סֶף הַ/כֵּלִ֔ים אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/085.yaml
  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: de
  text: Jede silberne Schale wog 130 Schekel und jedes Becken 70 Schekel. Das gesamte Silber der Gefäße wog 2.400 Schekel, nach dem Schekelgewicht des Heiligtums.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: nach dem Schekel des Heiligtums.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: '130'
  rationale: Die hebräische Zahlfolge lautet wörtlich »dreißig und hundert«; im modernen Deutschen wird sie idiomatisch als 130 wiedergegeben.
- source_word: הַקְּעָרָה הָאַחַת
  choice: jede Schale
  rationale: Der bestimmte Singular mit אֶחָד wird in diesem Inventarkontext distributiv verstanden. קְעָרָה bezeichnet hier eine Schale; das Material wird durch כֶּסֶף angegeben.
- source_word: כֶּסֶף
  choice: silberne / Silber
  rationale: כֶּסֶף bezeichnet hier das Material der Gefäße, nicht Geld.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: jedes Becken
  rationale: Auch hier ist der bestimmte Singular mit אֶחָד distributiv. מִזְרָק bezeichnet ein kultisch verwendetes Becken beziehungsweise eine Schale; »Becken« unterscheidet es verständlich von קְעָרָה.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: das gesamte Silber der Gefäße
  rationale: כֹּל bezeichnet die Gesamtmenge, und כֵּלִים die Gefäße beziehungsweise Geräte.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: '2.400'
  rationale: Die Zahl wird in üblicher moderner deutscher Schreibweise wiedergegeben.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekelgewicht des Heiligtums
  rationale: Die Präposition בְּ kennzeichnet hier den zugrunde gelegten Gewichtsstandard. »Schekelgewicht« macht verständlich, dass Schekel eine Gewichtseinheit bezeichnet.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die elliptischen Gewichtsangaben des Hebräischen werden durch »wog« und die bei beiden Einzelgewichten ergänzte Einheit verständlich ausgedrückt. Der Satz wird zur besseren Lesbarkeit in zwei Hauptsätze gegliedert.
