  language: de
  text: einen Ziegenbock als Sündopfer –[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Ziegenbock zum Sündopfer«.'
    reason: Die Präposition לְ kann in dieser Opferformel sowohl funktional mit »als« als auch zielbezogen mit »zum« wiedergegeben werden.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die hebräische Wortverbindung bezeichnet idiomatisch ein männliches Tier aus der Gruppe der Ziegen. »Ziegenbock« ist im modernen Deutsch eindeutig, natürlich und für den Opferkontext genau.
- source_word: אֶחָד
  choice: einen
  rationale: Das Zahlwort »eins« steht in der Aufzählungsformel attributiv beim Akkusativobjekt und wird daher natürlich mit »einen« wiedergegeben; der aufzählende Charakter bleibt erhalten.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet im Opferkontext das Sündopfer, nicht lediglich die abstrakte Sünde. Die Präposition לְ lässt sich hier idiomatisch mit »als« wiedergeben; »zum Sündopfer« bleibt als mögliche Alternative in der Fußnote erhalten.
