source:
  edition: WLC
  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: de
  text: Wie Jahwe Mose geboten hatte, so handelten die Töchter Zelofhads.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Ganz so, wie
  rationale: Die vergleichende Wendung bezeichnet die genaue Übereinstimmung zwischen Jahwes Gebot und dem Handeln der Töchter; „Ganz so, wie“ ist natürliches Deutsch und bewahrt diesen Nachdruck.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Verb bezeichnet das Erteilen eines verbindlichen Gebots. Das Plusquamperfekt macht im Deutschen deutlich, dass das Gebot dem anschließenden Handeln vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: אֶת kennzeichnet Mose als direktes Objekt des Verbs; „Mose gebieten“ gibt diese Konstruktion im Deutschen idiomatisch wieder.
- source_word: כֵּן עָשׂוּ
  choice: handelten
  rationale: Die Verbindung bedeutet, dass sie entsprechend dem Gebot verfuhren. „handelten“ vermeidet ein unnatürliches deutsches „so taten“ und wahrt den knappen Sinn.
- source_word: בְּנוֹת צְלָפְחָד
  choice: die Töchter Zelofhads
  rationale: Die Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung klar und natürlich wieder; „Zelofhad“ folgt einer geläufigen deutschen Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Eigennaamenscharakter, ohne ihn durch einen traditionellen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Struktur כַּאֲשֶׁר ... כֵּן wird durch „Ganz so, wie ... handelten“ natürlich wiedergegeben; der Satz bleibt knapp und betont die genaue Befolgung des Gebots.
