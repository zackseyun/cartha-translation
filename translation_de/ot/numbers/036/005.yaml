id: NUM.36.5
reference: Numbers 36:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: de
  text: 'Da gebot Mose den Israeliten nach dem Wort Jahwes[a]: »Der Stamm der Nachkommen Josefs hat recht.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach dem Mund Jahwes«; gemeint ist: entsprechend seiner Weisung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »redet richtig« oder »spricht recht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Da gebot
  rationale: Das Verb bezeichnet ein autoritatives Gebieten oder Befehlen. „Gebot“ bewahrt diese Kraft und verbindet den Satz natürlich mit dem vorangehenden Zusammenhang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die hebräische Wendung bedeutet hier das Volk Israel. „Israeliten“ ist im modernen Deutschen natürlich, präzise und schließt das ganze angesprochene Volk ein.
- source_word: עַל פִּי יְהוָה
  choice: nach dem Wort Jahwes
  rationale: Die Wendung lautet wörtlich „nach dem Mund Jahwes“ und bezeichnet die göttliche Weisung beziehungsweise Autorisierung. „Nach dem Wort“ wahrt das Sprachbild teilweise, ohne im Deutschen befremdlich zu wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: לֵאמֹר
  choice: durch Doppelpunkt und direkte Rede ausgedrückt
  rationale: Die formelhafte Einleitung der direkten Rede muss im natürlichen Deutschen nicht eigens mit „indem er sagte“ wiederholt werden; der Doppelpunkt gibt ihre Funktion vollständig wieder.
- source_word: מַטֵּה בְנֵי יוֹסֵף
  choice: der Stamm der Nachkommen Josefs
  rationale: מַטֵּה bezeichnet hier die Stammesgruppe. „Nachkommen Josefs“ gibt die genealogische Bedeutung von בְנֵי יוֹסֵף im Deutschen klarer wieder als das missverständliche „Söhne Josefs“, da mehrere Generationen gemeint sind.
- source_word: כֵּן ... דֹּבְרִים
  choice: hat recht
  rationale: Die Verbindung bestätigt, dass die vorgetragene Aussage beziehungsweise Forderung sachlich richtig ist. „Hat recht“ ist idiomatisches modernes Deutsch; die wörtlichere Sprechform wird in einer Fußnote festgehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen; die traditionelle Ersetzung durch „der HERR“ ist möglich, steht jedoch nicht im Konsonantentext.
- issue: Art der Bestätigung der josefitischen Stammesgruppe
  choice: hat recht
  alternative: redet richtig
  rationale: Der Satz bestätigt die Richtigkeit ihrer vorangegangenen Forderung. Die idiomatische Fassung lässt offen, ob die Zustimmung primär ihrer Aussage oder ihrem Anliegen gilt, während die Fußnote die sprachlich engere Wiedergabe nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Israeliten“ und „Nachkommen Josefs“ vermeiden im Deutschen unnatürliche oder potenziell missverständliche Nachbildungen hebräischer Verwandtschaftsausdrücke. Die knappe direkte Rede entspricht dem deutschen Erzählstil; beide Fußnotenmarker stehen im Haupttext.
