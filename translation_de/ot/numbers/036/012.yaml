  source_fidelity: 'Der deutsche Text gibt die hebräische Konstruktion sachgerecht wieder: Die Frauen heirateten Männer aus den Sippen der Nachkommen Manasses; ihr Erbbesitz blieb der väterlichen Stammes- und Sippenzuordnung erhalten. Die Ergänzung „Männer“ macht die im Hebräischen elliptische Heiratsformel verständlich, ohne den Sinn zu verändern.'
