  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: de
  text: Sie heirateten Männer aus den Sippen der Nachkommen Manasses, des Sohnes Josefs,[a] und ihr Erbbesitz blieb beim Stamm der Sippe ihres Vaters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Manasses, des Sohnes Josefs“. Mit „Söhne“ sind hier die Nachkommen gemeint.'
    reason: Die Fußnote bewahrt die wörtliche genealogische Ausdrucksweise, während der Haupttext ihre Bedeutung im Stammeszusammenhang verständlich wiedergibt.
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: Männer aus den Sippen
  rationale: Die Präposition מִן bezeichnet hier am natürlichsten die Herkunft der Ehemänner aus den manassitischen Sippen. „Männer“ ist im Deutschen zur verständlichen Wiedergabe der elliptischen hebräischen Heiratsformel ergänzt; „Sippen“ bildet die innertribale Sozialstruktur genauer ab als das allgemeinere „Familien“.
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: der Nachkommen Manasses, des Sohnes Josefs
  rationale: בְּנֵי bezeichnet im Stammeszusammenhang die Nachkommenschaft Manasses. „Nachkommen“ ist im modernen Deutsch natürlicher und verhindert das Missverständnis, nur unmittelbare Söhne seien gemeint; die genealogische Beziehung zu Josef bleibt ausdrücklich erhalten.
- source_word: הָיוּ לְנָשִׁים
  choice: Sie heirateten
  rationale: Die wörtliche Wendung „sie wurden zu Frauen“ bezeichnet, dass die Frauen Ehefrauen wurden. „Sie heirateten“ ist eine natürliche, aktive deutsche Wiedergabe und bewahrt die Frauen als grammatisches Subjekt.
- source_word: נַחֲלָתָן
  choice: ihr Erbbesitz
  rationale: נַחֲלָה meint in diesem Rechtszusammenhang den erblich zugewiesenen Landbesitz. „Erbbesitz“ ist präziser als das möglicherweise abstrakt oder allgemein verstandene „Erbe“.
- source_word: וַתְּהִי
  choice: blieb
  rationale: Das Verb bedeutet grundsätzlich „war/wurde“. Im Zusammenhang hebt der Satz jedoch hervor, dass der Erbbesitz infolge der Heirat innerhalb des Stammes dort verblieb; „blieb“ gibt diese kontextuelle Bedeutung knapp wieder.
- source_word: עַל מַטֵּה
  choice: beim Stamm
  rationale: מַטֶּה bezeichnet hier den Stamm als soziale und territoriale Einheit. עַל drückt die Zuordnung des Erbbesitzes aus; „beim Stamm“ ist dafür eine natürliche deutsche Formulierung.
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: der Sippe ihres Vaters
  rationale: Die singularische Status-constructus-Verbindung bezeichnet die väterliche Sippe der Töchter. Die formnahe Wiedergabe erhält sowohl die Sippenebene als auch den Bezug auf ihren Vater.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische hebräische Heiratsformel wird zur unmittelbaren Verständlichkeit mit „heirateten Männer aus“ wiedergegeben. „Sippe“, „Stamm“ und „Erbbesitz“ halten die rechtliche und soziale Struktur des Verses deutlich auseinander.
