  terminology: „Sippen“ für מִשְׁפְּחֹת, „Nachkommen“ für בני im Stammeskontext, „Erbbesitz“ für נַחֲלָה und „Stamm“ für מַטֶּה sind terminologisch treffend. Die Fußnote erklärt transparent, weshalb im Haupttext „Nachkommen“ steht, obwohl die genealogische Formel wörtlich „Söhne“ lautet.
