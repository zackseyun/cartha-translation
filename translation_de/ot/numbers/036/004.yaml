  source_fidelity: 'Die Satzstruktur und die rechtliche Folge des hebräischen Textes sind zutreffend wiedergegeben: Der Erbbesitz der Töchter würde dem Stamm, dem sie angehören werden, zugerechnet und dem Stamm ihrer Väter entzogen. »Erlassjahr« ist jedoch nicht die angemessene Wiedergabe von יוֹבֵל. Es bezeichnet im Deutschen eher ein Erlass- bzw. Schuldenerlassjahr und kann mit dem Sabbatjahr oder Regelungen aus Dtn 15 assoziiert werden. יוֹבֵל ist hier präzise als »Jubeljahr« wiederzugeben.'
