base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: de
  text: Und wenn bei den Israeliten[a] das Jubeljahr kommt, wird ihr Erbbesitz dem Erbbesitz des Stammes hinzugefügt, dem sie dann angehören; dem Erbbesitz des Stammes unserer Väter aber wird ihr Erbbesitz entzogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei den Söhnen Israels«; traditionell: »bei den Kindern Israel«. Wörtlich steht im Hebräischen: »für die Söhne Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Die Verbindung kann wörtlich auch »und falls« heißen. Im rechtlichen Gedankengang wird jedoch mit dem erwarteten Eintreten des Erlassjahres gerechnet; »und wenn« bewahrt den Bedingungscharakter in natürlichem Deutsch.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: das Erlassjahr kommt
  rationale: היה bezeichnet hier idiomatisch das Eintreten des יוֹבֵל. »Erlassjahr« ist im Deutschen verständlich und bezeichnet das besondere fünfzigste Jahr im mosaischen Recht.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Söhne Israels
  rationale: Die hebräische Verwandtschaftsbezeichnung wird im Haupttext formal bewahrt; eine geläufigere Bedeutungsangabe steht in der Fußnote.
- source_word: וְנוֹסְפָה
  choice: wird … hinzugefügt
  rationale: Der Niphal drückt aus, dass der Erbbesitz einem anderen Stammesbesitz zugeschlagen wird.
- source_word: נַחֲלָתָן
  choice: ihr Erbbesitz
  rationale: נחלה bezeichnet hier nicht nur einen abstrakten Erbanspruch, sondern das erbliche Landlos der Töchter. »Erbbesitz« macht diesen sachlichen Bezug deutlich.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: dem Erbbesitz des Stammes hinzugefügt
  rationale: על bezeichnet mit יסף die Hinzufügung zu einem anderen Bestand; der deutsche Dativ nach »hinzufügen« gibt dies natürlich wieder.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: dem sie dann angehören
  rationale: Die schwerfällige wörtliche Formulierung bezeichnet im Kontext den Stamm der Männer, in den die Töchter einheiraten. »dann« verdeutlicht den zukünftigen Bezug, ohne zusätzliche Sachinformation einzuführen.
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: dem Erbbesitz des Stammes unserer Väter
  rationale: Die patriarchale Stammeszuordnung und die Perspektive der Sprecher werden entsprechend dem Hebräischen bewahrt.
- source_word: יִגָּרַע
  choice: wird … entzogen
  rationale: Der Niphal von גרע bezeichnet Verminderung beziehungsweise Wegnahme. »entzogen« bringt den rechtlichen Verlust des Erbbesitzes prägnant zum Ausdruck.
