  terminology: »Jubeljahr« ist der im modernen deutschen Bibelgebrauch etablierte Begriff für יוֹבֵל. »Erbbesitz« gibt נחלה im Kontext der erblichen Landzuteilung treffend wieder. Die Fußnote bewahrt die wörtliche Formulierung »Söhne Israels« und nennt zugleich die idiomatische Haupttextfassung.
