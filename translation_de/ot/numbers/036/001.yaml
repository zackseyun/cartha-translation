source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: de
  text: Da traten die Oberhäupter der Vaterhäuser der Sippe der Nachkommen Gileads – Gilead war ein Sohn Machirs, Machir ein Sohn Manasses – aus den Sippen der Nachkommen Josefs heran. Sie sprachen vor Mose und vor den Stammesführern, den Oberhäuptern der Vaterhäuser der Israeliten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: Da traten … heran
  rationale: Die Erzählform führt den formellen Auftritt zur Vorlage eines Rechtsfalls ein; „herantreten“ bewahrt Bewegung und offiziellen Rahmen.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Vaterhäuser
  rationale: Die Wendung bezeichnet anerkannte Leiter verwandtschaftlich organisierter Großfamilien. „Vaterhäuser“ erhält die besondere soziale Einheit des Hebräischen.
- source_word: לְמִשְׁפַּחַת בְּנֵי גִלְעָד
  choice: der Sippe der Nachkommen Gileads
  rationale: Das ל bezeichnet hier die Zugehörigkeit. „Sippe“ unterscheidet מִשְׁפָּחָה vom Vaterhaus; „Nachkommen“ gibt בְּנֵי in diesem genealogischen Kollektiv natürlich wieder.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: Gilead war ein Sohn Machirs, Machir ein Sohn Manasses
  rationale: Die explizite Auflösung macht die genealogischen Bezüge im Deutschen eindeutig, ohne die wiederholte Abstammungsangabe zu verkürzen.
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: aus den Sippen der Nachkommen Josefs
  rationale: מִן bezeichnet die Herkunft beziehungsweise Einordnung in den größeren Stammesverband; die Mehrzahl „Sippen“ bleibt erhalten.
- source_word: וַיְדַבְּרוּ לִפְנֵי מֹשֶׁה
  choice: Sie sprachen vor Mose
  rationale: „Vor“ bewahrt die formelle Bedeutung eines Auftretens in der Gegenwart einer Autorität.
- source_word: הַנְּשִׂיאִים
  choice: die Stammesführer
  rationale: Im Zusammenhang sind die נְשִׂיאִים die führenden Repräsentanten Israels. „Stammesführer“ ist präziser als das allgemeinere „Führer“.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: die Oberhäupter der Vaterhäuser der Israeliten
  rationale: Die Apposition erklärt die Stellung der Stammesführer. „Israeliten“ gibt die formale Wendung „Söhne Israels“ in natürlichem modernem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die institutionellen Begriffe „Sippe“, „Vaterhaus“ und „Stammesführer“ halten die Ebenen der israelitischen Verwandtschafts- und Leitungsstruktur auseinander. Der verschachtelte Stammbaum wurde durch einen Gedankenstrich und zwei eindeutige Sätze innerhalb des Einschubs lesbar gemacht.
