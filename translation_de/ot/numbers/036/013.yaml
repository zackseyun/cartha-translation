  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: de
  text: Das sind die Gebote und Rechtsbestimmungen, die Jahwe durch Mose den Israeliten[a] in den Steppen Moabs am Jordan bei Jericho geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“; die Bundesbezeichnung meint das Volk Israel als Gesamtheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Die deiktische Pluralform leitet eine abschließende Zusammenfassung ein; „Das sind“ ist im modernen Deutschen natürlich.
- source_word: הַמִּצְוֺת
  choice: die Gebote
  rationale: „Gebote“ bewahrt den formellen rechtlichen Klang von מִצְוֹת.
- source_word: וְהַמִּשְׁפָּטִים
  choice: und Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier verbindliche rechtliche Regelungen; „Rechtsbestimmungen“ ist verständlicher und sachlich treffender als das im Deutschen missverständliche „Gerichte“.
- source_word: צִוָּה
  choice: geboten hat
  rationale: Die Wiedergabe wahrt die Wortverbindung mit „Gebote“ und die autoritative Kraft des Verbs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die Wendung bedeutet wörtlich „durch die Hand Moses“ und bezeichnet hier Moses vermittelnde Funktion.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Wörtlich steht „den Söhnen Israels“; gemeint ist das Volk Israel als Gesamtheit. Die natürliche deutsche Volksbezeichnung wird verwendet und die wörtliche Form in einer Fußnote vermerkt.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: in den Steppen Moabs
  rationale: עֲרָבוֹת bezeichnet die ebenen, trockenen Steppengebiete Moabs; „Steppen“ bildet die Landschaft genauer ab als das allgemeinere „Ebenen“.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: am Jordan gegenüber von Jericho
  rationale: Die geographische Wendung bezeichnet das ostjordanische Gebiet auf der Jericho gegenüberliegenden Seite; diese Wiedergabe macht die Lage klar, ohne den Text unnötig auszubauen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Adressatenformel בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  alternative: den Söhnen Israels
  rationale: Die Formel bezeichnet hier kollektiv das Volk Israel. Die natürliche deutsche Form steht im Haupttext; die formale Entsprechung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die abschließende Rechtsformel bleibt formal, während hebräische Idiome natürlich wiedergegeben werden. Die geografische Angabe wird entsprechend ihrem wahrscheinlichen Bezug auf das Ostjordanland formuliert.
