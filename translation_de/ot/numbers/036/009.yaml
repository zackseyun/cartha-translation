source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: de
  text: Kein Erbbesitz soll von einem Stamm auf einen anderen Stamm übergehen; denn die Stämme der Söhne Israels sollen jeweils an ihrem eigenen Erbbesitz festhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn jeder Stamm der Israeliten soll an seinem eigenen Erbbesitz festhalten.“ Hebräisch: „die Stämme der Söhne Israels“; die folgende Form ist distributiv und bezieht sich auf den jeweiligen Stamm.'
    reason: Die Anmerkung dokumentiert sowohl die idiomatische Alternative als auch die im Hebräischen vorliegende Verbindung von pluralischem „Stämme“ mit distributiver Aussage.
lexical_decisions:
- source_word: תִסֹּב
  choice: soll … übergehen
  rationale: Das Verb bezeichnet hier, dass ein Landanteil seine Stammeszugehörigkeit wechselt. „Übergehen“ gibt diesen rechtlichen Sinn natürlich wieder.
- source_word: נַחֲלָה
  choice: Erbbesitz
  rationale: Im Zusammenhang geht es um den einem Stamm zugeteilten und innerhalb des Stammes zu bewahrenden Landbesitz. „Erbbesitz“ ist genauer als das allgemeinere „Erbe“.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: von einem Stamm auf einen anderen Stamm
  rationale: מַטֶּה bezeichnet hier eindeutig den Stamm als politische und genealogische Einheit, nicht den wörtlichen „Stab“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für das vorausgehende Verbot ein.
- source_word: אִישׁ בְּנַחֲלָתוֹ
  choice: jeder an seinem eigenen Erbbesitz
  rationale: Das distributive אִישׁ wird auf die pluralischen „Stämme“ bezogen. Die Wendung bewahrt die auffällige individuelle Form des Hebräischen, bleibt im Deutschen aber verständlich.
- source_word: יִדְבְּקוּ
  choice: sollen … festhalten
  rationale: דבק bedeutet „haften, sich fest anschließen“. Mit „an … festhalten“ bleibt das Bild erhalten und der rechtliche Sinn wird verständlich.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: die Stämme der Söhne Israels
  rationale: Die Formulierung bildet das hebräische בְּנֵי יִשְׂרָאֵל geschlechtsgenau ab; zugleich ist sie als traditionelle Bezeichnung des ganzen Volkes zu verstehen.
theological_decisions:
- issue: Geschlechtsspezifische Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und wird deshalb im Haupttext bewahrt, ohne seine korporative Bedeutung für das gesamte Volk auf Männer einzuengen.
- issue: Grammatische Spannung zwischen distributivem אִישׁ und pluralischem מַטּוֹת
  choice: die Stämme … jeder an seinem eigenen Erbbesitz
  alternative: jeder Stamm … an seinem eigenen Erbbesitz
  rationale: Die gewählte Fassung bewahrt sowohl den Plural „Stämme“ als auch die distributive Einzelperspektive des Hebräischen, statt die Konstruktion vollständig zu glätten.
translation_notes:
  register: Moderner, würdiger Rechtstext. „Erbbesitz“ hält den Bezug auf das zugeteilte Stammesland deutlich; die leicht markierte Konstruktion „die Stämme … jeder“ bewahrt eine echte syntaktische Spannung des Hebräischen.
