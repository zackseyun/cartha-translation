  to: Und jede Tochter, die Erbbesitz aus den Stämmen der Söhne Israels hat,[a][b] soll einen Mann aus der Sippe des Stammes ihres Vaters heiraten,[c] damit jeder von den Söhnen Israels den Erbbesitz seiner Väter in Besitz haben kann.[d]
