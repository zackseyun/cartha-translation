base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: de
  text: Und jede Tochter, die Erbbesitz aus den Stämmen der Söhne Israels hat,[a][b] soll einen Mann aus der Sippe des Stammes ihres Vaters heiraten,[c] damit jeder von den Söhnen Israels den Erbbesitz seiner Väter in Besitz haben kann.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die Erbbesitz erbt“ oder „die Erbin von Landbesitz ist“; das hebräische Partizip kann ihren Status als Erbin hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Söhne Israels“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aus dem Familienverband des Stammes ihres Vaters“; das hebräische Wort bezeichnet eine Verwandtschaftsgruppe innerhalb eines Stammes.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: „damit die Söhne Israels, jeder Einzelne, den Erbbesitz seiner Väter erben/in Besitz nehmen“. Das Verb kann sowohl „erben“ als auch „in Besitz nehmen“ oder „besitzen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: die Erbbesitz … hat
  rationale: Das Partizip von ירשׁ beschreibt hier im rechtlichen Zusammenhang den Status einer erbberechtigten Tochter, die Landbesitz innehat. Die Formulierung vermeidet im Deutschen die schwerfällige Wiederholung „ein Erbe erbt“.
- source_word: נַחֲלָה
  choice: Erbbesitz
  rationale: Gemeint ist der vererbte Landanteil innerhalb der Stammesordnung. „Erbbesitz“ bringt sowohl den Erb- als auch den Besitzaspekt prägnant zum Ausdruck.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: aus einem der Stämme der Söhne Israels
  rationale: Der Plural bezeichnet die Stammesverbände Israels; „aus einem der“ macht die partitive Bedeutung im Deutschen natürlich verständlich. Die quellsprachliche Wendung „Söhne Israels“ bleibt erhalten.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: aus der Sippe des Stammes ihres Vaters
  rationale: „Sippe“ bezeichnet hier die kleinere Verwandtschaftsgruppe innerhalb des Stammes und wahrt so die gestufte Sozialstruktur des Hebräischen.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: soll … heiraten
  rationale: Die hebräische Wendung lautet wörtlich „soll einem zur Frau werden“. „Soll … heiraten“ gibt die rechtliche Vorschrift in natürlichem, modernem Deutsch wieder.
- source_word: יִירְשׁוּ אִישׁ
  choice: damit jeder … behält
  rationale: ירשׁ bezeichnet in diesem Landrechtskontext nicht nur den Erwerb durch Erbschaft, sondern auch das fortdauernde Innehaben. „Jeder … behält“ verdeutlicht den Zweck der Heiratsregel und gibt אִישׁ distributiv wieder.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: den Erbbesitz seiner Väter
  rationale: Die Formulierung bewahrt die patrilineare Ausdrucksweise und den rechtlichen Bezug auf den von den Vätern überkommenen Landanteil.
theological_decisions:
- issue: Geschlechtsspezifische Bundes- und Rechtssprache
  choice: „Söhne Israels“ und „seiner Väter“ im Haupttext beibehalten
  alternative: „Israeliten“ und „seiner Vorfahren“
  rationale: Die maskulinen Formen gehören hier zur patrilinearen Erb- und Stammesordnung des Abschnitts und sollten deshalb nicht stillschweigend neutralisiert werden.
- issue: Bedeutung von ירשׁ im Zwecksatz
  choice: „behält“
  alternative: „erbt“ oder „besitzt“
  rationale: Der Vers zielt darauf, dass der angestammte Landbesitz innerhalb des jeweiligen Stammes verbleibt. „Behält“ bildet diese kontextuelle Funktion ab, ohne die mögliche Grundbedeutung „erben/in Besitz nehmen“ zu verschweigen; diese wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Ton. „Erbbesitz“ hält den Land- und Erbcharakter zusammen; „Sippe“ unterscheidet die kleinere Verwandtschaftseinheit vom Stamm. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Formulierungen.
