source:
  edition: WLC
  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: de
  text: Wenn sie Männer aus einem der Stämme der Israeliten heiraten, wird ihr Erbbesitz vom Erbbesitz unserer Väter abgezogen und dem Erbbesitz des Stammes hinzugefügt, dessen Männern sie zur Frau werden; vom Los[a] unseres Erbbesitzes wird er abgezogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Los unseres Erbbesitzes“. Das Los bezeichnet hier den durch Los zugeteilten Anteil.'
    reason: Die Fußnote bewahrt die konkrete hebräische Bezeichnung גוֹרָל („Los“) und erläutert ihre Funktion im Zusammenhang der Landzuteilung.
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: und wenn sie Frauen ... werden
  rationale: Die hebräische Formulierung lautet wörtlich „und sie werden ... zu Frauen“. Im fortlaufenden Bedingungsgedanken ist „und wenn“ im Deutschen natürlich und gibt die mögliche Heiratssituation wieder.
- source_word: מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: von Männern aus einem der Stämme der Israeliten
  rationale: בנים bezeichnet hier die männlichen Angehörigen der israelitischen Stämme. Die Wiedergabe vermeidet das im modernen Deutschen missverständliche „Söhne der Stämme“, bewahrt aber die männliche Referenz und die Stammesstruktur.
- source_word: נַחֲלָתָן
  choice: ihr Erbbesitz
  rationale: נחלה bezeichnet in diesem Zusammenhang den erblich zugewiesenen Landbesitz; „Erbbesitz“ macht den rechtlichen und territorialen Sinn deutlicher als das allgemeinere „Erbe“.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: vom Erbbesitz unserer Väter
  rationale: Die Formulierung bewahrt die konkrete väterliche Abstammungslinie des Hebräischen und den wiederholten Leitbegriff נחלה.
- source_word: וְנִגְרְעָה ... יִגָּרֵעַ
  choice: wird ... abgezogen ... wird ... abgezogen
  rationale: Die wiederholte Wurzel גרע beschreibt die Verringerung beziehungsweise den Verlust des Stammesbesitzes. Die gleiche deutsche Wortwahl erhält die bewusste Wiederholung.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: dem Erbbesitz des Stammes hinzugefügt
  rationale: מַטֶּה bedeutet hier „Stamm“; עַל mit יסף bezeichnet das Hinzukommen zum Besitz dieses Stammes.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: dem sie dann angehören
  rationale: Die knappe hebräische Zugehörigkeitsformel bezieht sich auf den Stamm der Ehemänner. „dann“ verdeutlicht, dass diese Zugehörigkeit aus der Heirat folgt, ohne zusätzliche rechtliche Einzelheiten einzutragen.
- source_word: מִגֹּרַל נַחֲלָתֵנוּ
  choice: von dem Losanteil unseres Erbbesitzes
  rationale: גוֹרָל ist wörtlich das „Los“ und bezeichnet hier den durch Los zugewiesenen Anteil. „Losanteil“ bewahrt sowohl das Zuteilungsverfahren als auch das Ergebnis.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit juristisch-territorial präzisem „Erbbesitz“. Die syntaktische Wiederholung von „abgezogen“ spiegelt die rhetorische Rahmung des hebräischen Verses. Der Fußnotenmarker steht unmittelbar nach dem erklärungsbedürftigen Satzteil beziehungsweise am Versende.
