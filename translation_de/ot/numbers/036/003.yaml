revisions:
- from: Und wenn sie Frauen von Männern aus einem der Stämme der Israeliten werden, wird ihr Erbbesitz vom Erbbesitz unserer Väter abgezogen und dem Erbbesitz des Stammes hinzugefügt, dem sie dann angehören; so wird er von dem Losanteil unseres Erbbesitzes abgezogen.[a]
  to: Wenn sie Männer aus einem der Stämme der Israeliten heiraten, wird ihr Erbbesitz vom Erbbesitz unserer Väter abgezogen und dem Erbbesitz des Stammes hinzugefügt, dessen Männern sie zur Frau werden; vom Los[a] unseres Erbbesitzes wird er abgezogen.
  rationale: Die Revision macht die Heiratsbeziehung zu den Männern des betreffenden Stammes explizit, verbessert die idiomatische Verständlichkeit und erhält die Wiederholung von „abgezogen“ sowie die juristisch-territoriale Terminologie. Sie nimmt keine über den Text hinausgehende Aussage über eine allgemeine Stammeszugehörigkeit der Frauen vor.
