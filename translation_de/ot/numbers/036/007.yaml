  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: de
  text: Kein Erbbesitz der Söhne Israels soll von Stamm zu Stamm übergehen[a]; denn jeder von den Söhnen Israels soll am Erbbesitz des Stammes seiner Väter festhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »soll sich von Stamm zu Stamm wenden«; gemeint ist der Wechsel des Erbbesitzes in die Zugehörigkeit eines anderen Stammes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִסֹּב
  choice: soll … übergehen
  rationale: Das Verb סבב bezeichnet hier im rechtlichen Zusammenhang den Wechsel eines Erbbesitzes aus der Zugehörigkeit zu einem Stamm in die eines anderen; »übergehen« gibt diesen Vorgang im Deutschen natürlich wieder.
- source_word: נַחֲלָה
  choice: Erbbesitz
  rationale: Der Ausdruck bezeichnet den als Erbe zugeteilten Landbesitz. »Erbbesitz« bewahrt sowohl den erbrechtlichen als auch den territorialen Sinn.
- source_word: מִמַּטֶּה אֶל מַטֶּה
  choice: von einem Stamm auf einen anderen
  rationale: מַטֶּה bedeutet in diesem Zusammenhang »Stamm«. Die deutsche Formulierung gibt die gerichtete Übertragung klar und idiomatisch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale genealogische Bundesbezeichnung wird entsprechend dem hebräischen Wortlaut bewahrt.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ hat hier distributive Funktion. »Jeder« verbindet sich natürlich mit dem kollektiv genannten Subjekt und erhält den individuellen Bezug.
- source_word: יִדְבְּקוּ
  choice: sollen … festhalten
  rationale: דבק bezeichnet ein enges und dauerhaftes Gebundensein. »An … festhalten« passt sowohl zum rechtlichen Zusammenhang als auch zum nachdrücklichen Charakter des Verbs.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: am Erbbesitz des Stammes seiner Väter
  rationale: Die Wiedergabe bleibt nahe an der genealogischen Struktur des Hebräischen und bezeichnet den ererbten Besitz innerhalb des väterlichen Stammes.
theological_decisions:
- issue: Männlich-genealogische Sprache in der bundesrechtlichen Aussage
  choice: »die Söhne Israels … jeder … seiner Väter«
  alternative: »die Israeliten … alle … ihrer Vorfahren«
  rationale: Der hebräische Text verwendet ausdrücklich בְּנֵי, אִישׁ und אֲבֹתָיו. Die Übersetzung bewahrt diese genealogische Ausdrucksweise, ohne darüber hinaus eine Aussage über den Kreis der Betroffenen einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-genealogischem Ton. Die Wiederholung von »die Söhne Israels« und die väterliche Abstammungssprache werden bewusst beibehalten; »von einem Stamm auf einen anderen« ist gegenüber einer wörtlicheren Wendung idiomatisches Deutsch.
