  text: וַ/תִּהְיֶ֜ינָה מַחְלָ֣ה תִרְצָ֗ה וְ/חָגְלָ֧ה וּ/מִלְכָּ֛ה וְ/נֹעָ֖ה בְּנ֣וֹת צְלָפְחָ֑ד לִ/בְנֵ֥י דֹדֵי/הֶ֖ן לְ/נָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: de
  text: Machla, Tirza, Hogla, Milka und Noa, die Töchter Zelofhads, wurden Ehefrauen der Söhne ihrer Onkel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausführlicher: der Söhne der Brüder ihres Vaters.'
    reason: Die knappe Wiedergabe „Onkel“ kann im Deutschen sowohl die väterliche als auch die mütterliche Seite bezeichnen; der Zusammenhang meint hier die Brüder des Vaters.
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: wurden
  rationale: Die Form von היה bezeichnet hier den Eintritt in den durch die Eheschließung entstandenen Stand. „Wurden“ gibt diesen Übergang im Deutschen knapp und natürlich wieder.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: Machla, Tirza, Hogla, Milka und Noa
  rationale: Die Personennamen werden in ihren im Deutschen gebräuchlichen biblischen Formen wiedergegeben; ihre Reihenfolge entspricht dem Hebräischen.
- source_word: בְּנוֹת צְלָפְחָד
  choice: die Töchter Zelofhads
  rationale: בְּנוֹת bezeichnet hier leibliche Töchter im genealogischen Zusammenhang. Der hebräische Name wird in der gebräuchlichen deutschen Form „Zelofhad“ wiedergegeben.
- source_word: לִבְנֵי דֹדֵיהֶן
  choice: der Söhne ihrer Onkel
  rationale: Die Präposition ל gehört zur hebräischen Heiratsformel; im Deutschen wird das Verhältnis idiomatisch mit „die Frauen der Söhne“ ausgedrückt. דֹדֵיהֶן bezeichnet hier aufgrund des Erb- und Sippenzusammenhangs die Onkel, genauer die Brüder ihres Vaters.
- source_word: לְנָשִׁים
  choice: die Frauen
  rationale: נָשִׁים bedeutet in dieser Heiratsformel „Frauen“ im Sinn von Ehefrauen. Der bestimmte Artikel ergibt sich aus der natürlichen deutschen Satzbildung.
theological_decisions: []
