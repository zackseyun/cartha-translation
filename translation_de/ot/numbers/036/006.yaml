  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: de
  text: 'Dies ist die Weisung, die Jahwe bezüglich der Töchter Zelofhads angeordnet hat: »Sie dürfen heiraten, wen sie für gut halten[a]; doch sie dürfen nur einen Mann aus einer Sippe des Stammes ihres Vaters heiraten[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dem, der in ihren Augen gut ist«; gemeint ist: wen sie selbst für geeignet halten.'
    reason: Die Fußnote bewahrt das hebräische Idiom und erläutert seinen Sinn.
  - marker: b
    text: 'Oder: »in eine Sippe des Stammes ihres Vaters«. Das Hebräische nennt sowohl die Sippe als auch den Stamm und betont damit die väterliche Stammeszugehörigkeit.'
    reason: Die Alternative macht die mit der Heirat verbundene Zugehörigkeit zu einer Sippe desselben Stammes deutlicher, ohne eine weitergehende innerstammesrechtliche Deutung festzulegen.
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Dies ist die Weisung
  rationale: דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. Im Zusammenhang bezeichnet es eine verbindliche göttliche Anordnung; »Weisung« gibt diese Funktion im Deutschen natürlich wieder.
- source_word: צִוָּה יְהוָה
  choice: die Jahwe ... gegeben hat
  rationale: צוה bezeichnet ein Gebieten oder Anordnen. Zusammen mit »Weisung« vermeidet »gegeben hat« eine schwerfällige Wiederholung und wahrt die bleibende Geltung des Befehls. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: für die Töchter Zelofhads
  rationale: Die Präposition ל kennzeichnet hier diejenigen, auf die sich die Anordnung bezieht. »Für« lässt sowohl den Bezug als auch die mittelbare Adressierung offen.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Der übliche hebräische Zitateinleiter wird im natürlichen modernen Deutsch am besten durch einen Doppelpunkt wiedergegeben.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: wen sie für gut halten
  rationale: Die Wendung bedeutet wörtlich »dem, der in ihren Augen gut ist«. Die Übersetzung bewahrt das Urteil der Frauen, ohne die deutsche Formulierung unnötig zu verfremden.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: sie dürfen heiraten / sie dürfen ... heiraten
  rationale: Wörtlich heißt die Wendung »sie sollen/werden zu Frauen [für jemanden] sein«. Im Kontext ist »heiraten« die natürliche deutsche Entsprechung. Beim ersten Vorkommen steht die Erlaubnis, beim zweiten die durch אַךְ eingeschränkte Erlaubnis im Vordergrund.
- source_word: אַךְ
  choice: doch ... nur
  rationale: אַךְ führt hier eine ausdrückliche Einschränkung der zuvor gewährten freien Wahl ein.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: innerhalb einer Sippe aus dem Stamm ihres Vaters
  rationale: מִשְׁפָּחָה bezeichnet hier eine Sippe oder einen Clan innerhalb des Stammes. Die Formulierung hält beide Ebenen—Sippe und Stamm—ausdrücklich fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der Heiratsbeschränkung
  choice: innerhalb einer Sippe aus dem Stamm ihres Vaters
  alternative: innerhalb der Sippe des Stammes ihres Vaters
  rationale: Der Vers verbindet מִשְׁפָּחָה (Sippe/Clan) und מַטֶּה (Stamm). Die Übersetzung lässt die syntaktische Beziehung nachvollziehbar, ohne über den Wortlaut hinaus eine bestimmte innerstammesrechtliche Auslegung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig und verständlich formuliert; die rechtliche Verbindlichkeit sowie die Unterscheidung zwischen freier Partnerwahl und stammesbezogener Einschränkung bleiben erhalten.
