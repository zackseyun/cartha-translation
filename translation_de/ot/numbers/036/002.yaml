  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: de
  text: 'Sie sagten: „Jahwe hat meinem Herrn geboten, das Land den Söhnen Israels[a] durch das Los als Erbbesitz zuzuteilen. Und mein Herr hat von Jahwe den Befehl erhalten, den Erbbesitz Zelofhads, unseres Bruders, seinen Töchtern zu geben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „den Kindern Israels“ beziehungsweise „den Israeliten“. Wörtlich: „den Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: In der direkten Anrede an Mose ist dies eine respektvolle menschliche Anrede, kein Gottestitel. „Mein Herr“ wahrt den ehrerbietigen Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָתֵת אֶת הָאָרֶץ בְּנַחֲלָה
  choice: das Land … als Erbbesitz zuzuteilen
  rationale: „Zuteilen“ klingt im Zusammenhang der Landverteilung natürlich; „als Erbbesitz“ bewahrt den rechtlichen Sinn von נַחֲלָה.
- source_word: בְּגוֹרָל
  choice: durch das Los
  rationale: Die Wendung bezeichnet das Los als Mittel der Landverteilung.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die Übersetzung bewahrt die wörtliche männliche Pluralform und die traditionelle Bundesbezeichnung, obwohl die Form kollektiv das Volk Israel meint.
- source_word: צֻוָּה בַיהוָה
  choice: hat von Jahwe den Befehl erhalten
  rationale: Die passive Form und ב als Angabe der Quelle bzw. des Urhebers werden in natürlichem Deutsch wiedergegeben.
- source_word: נַחֲלַת צְלָפְחָד
  choice: den Erbbesitz … Zelofhads
  rationale: Der Ausdruck bezeichnet den Zelofhad bzw. seiner Linie zustehenden erblichen Landanteil.
- source_word: אָחִינוּ
  choice: unseres Bruders
  rationale: Die wörtliche Verwandtschaftssprache bleibt erhalten; sie kann hier zugleich die Zugehörigkeit zum Clan ausdrücken.
- source_word: לִבְנֹתָיו
  choice: seinen Töchtern
  rationale: Die Töchter sind die Empfängerinnen des Erbbesitzes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtlich markierte Kollektivbezeichnung לִבְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Kinder Israels; Israeliten
  rationale: Die Quellform lautet wörtlich „Söhne Israels“ und wird beibehalten; eine Fußnote verdeutlicht die mögliche kollektive Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der rechtliche Kontext wird durch „Erbbesitz“, „zuteilen“ und „den Befehl erhalten“ klar ausgedrückt; die zweimalige ehrerbietige Anrede Moses als „mein Herr“ bleibt erhalten.
