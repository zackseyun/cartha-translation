  text: אֵ֚לֶּה פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן אֲשֶׁ֨ר פָּֽקְד֜וּ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: de
  text: Das sind die von Mose und dem Priester Eleasar Gezählten. Sie zählten die Söhne Israels[a] in den Ebenen Moabs am Jordan gegenüber von Jericho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Israeliten« beziehungsweise »die Kinder Israels«. Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »am Jordan bei Jericho«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: die … Gezählten
  rationale: Das substantivierte Partizip gibt die im Rahmen der Volkszählung erfassten Personen wieder und bewahrt den persönlichen Bezug.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der hebräische Text nennt Eleasar ausdrücklich den Priester; „Hohepriester“ wäre eine kontextuelle Ergänzung.
- source_word: פָּקְדוּ
  choice: zählten
  rationale: Die Wiederholung derselben deutschen Wortwurzel entspricht der Wiederholung von פקד und passt zum Volkszählungskontext.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Formulierung bewahrt den grammatisch männlichen und genealogisch geprägten Ausdruck des Hebräischen; eine geläufigere Alternative wird in der Fußnote genannt.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: in den Ebenen Moabs
  rationale: Die geographische Wendung bezeichnet die Ebenen beziehungsweise Steppen Moabs; „Ebenen Moabs“ ist im Deutschen klar und würdig.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: am Jordan gegenüber von Jericho
  rationale: Die Wiedergabe macht die Lage auf der moabitischen Jordanseite in Beziehung zu Jericho verständlich und erhält die mögliche räumliche Nuance von עַל.
theological_decisions:
- issue: Geschlechtlich und genealogisch geprägter Bundesausdruck בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die wörtlichere Fassung bewahrt die genealogische Form des Ausgangstextes, ohne den umfassenderen Bezug des Ausdrucks auszuschließen; dieser wird in einer Fußnote verdeutlicht.
- issue: Amtsbezeichnung Eleasars
  choice: der Priester
  alternative: der Hohepriester
  rationale: Die Übersetzung bleibt bei der im Hebräischen tatsächlich verwendeten Amtsbezeichnung und ergänzt keinen spezifischeren Titel aus dem Kontext.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdigen Erzählregister. Die Wiederholung von „gezählt“ bildet die hebräische Wortwiederholung ab; die Satzteilung verhindert eine schwerfällige Relativsatzkonstruktion.
