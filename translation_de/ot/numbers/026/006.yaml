  text: לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרוֹנִ֑י לְ/כַרְמִ֕י מִשְׁפַּ֖חַת הַ/כַּרְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/006.yaml
  text: from Hezron[a], the clan of the Hezronites; from Carmi, the clan of the Carmites.
translation:
  language: de
  text: 'Von Hezron[a]: die Sippe der Hezroniter; von Karmi: die Sippe der Karmiter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „für Hezron … für Karmi“. Die hebräische Präposition bezeichnet hier im Zusammenhang der Volkszählung die genealogische Zuordnung oder Abstammung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: von Hezron
  rationale: Das präfigierte לְ kennzeichnet in dieser Zählungsformel die genealogische Zuordnung beziehungsweise Abstammung. „Von Hezron“ gibt diesen Sinn im Deutschen knapp und natürlich wieder.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier eine größere verwandtschaftliche Untergruppe innerhalb eines Stammes. „Sippe“ ist dafür präziser als das im Deutschen meist enger verstandene „Familie“.
- source_word: הַחֶצְרוֹנִי
  choice: der Hezroniter
  rationale: Die gentilizische Form bezeichnet kollektiv die von Hezron abgeleitete Gruppe. Der deutsche Gruppenname „Hezroniter“ bewahrt diesen Sinn.
- source_word: לְ/כַרְמִי
  choice: von Karmi
  rationale: Wie bei לְחֶצְרֹן drückt לְ in der genealogischen Zählungsformel Zuordnung oder Herkunft aus; „von Karmi“ erhält zugleich den Parallelismus.
- source_word: הַכַּרְמִי
  choice: der Karmiter
  rationale: Das Gentilizium benennt kollektiv die zu Karmi gehörende Nachkommengruppe; „Karmiter“ ist die entsprechende natürliche deutsche Bildung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe, parallele Zählungsformel des Hebräischen bleibt erhalten; „Sippe“ bezeichnet eine größere verwandtschaftliche Gruppe, nicht nur die Kernfamilie.
