  - marker: b
    text: 'Oder: „die Familie der Eriter“. Das Hebräische verwendet eine Sippenbezeichnung und eine gentilizische Form.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: von Osni
  rationale: Das Präfix לְ leitet in dieser Zählungsformel die von einem Ahnherrn abstammende Linie ein; im Deutschen gibt „von“ diese genealogische Zuordnung knapp und natürlich wieder. Der Personenname wird als Osni transkribiert.
- source_word: מִשְׁפַּחַת
  choice: die Sippe der
  rationale: מִשְׁפָּחָה bezeichnet hier eine größere verwandtschaftliche Untergruppe innerhalb eines Stammes. „Sippe“ ist im Zählungs- und Stammeskontext genauer als das enger klingende „Familie“.
- source_word: הָ/אָזְנִי
  choice: der Osniter
  rationale: Die bestimmte gentilizische Form bezeichnet die von Osni hergeleitete Nachkommengruppe. Der deutsche Gruppenname „Osniter“ bewahrt diese Funktion.
- source_word: לְ/עֵרִי
  choice: von Eri
  rationale: Wie im ersten Halbvers kennzeichnet לְ die genealogische Zuordnung; „von Eri“ hält die parallele Listenformel aufrecht.
- source_word: הָ/עֵרִי
  choice: der Eriter
  rationale: Die bestimmte gentilizische Form bezeichnet die von Eri hergeleitete Nachkommengruppe; „Eriter“ ist die natürliche deutsche Bildung.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listenregister mit parallelem Satzbau. „Sippe“ vermittelt die soziale Größe der hebräischen מִשְׁפָּחָה besser als „Familie“; die Gentilbildungen Osniter und Eriter bleiben für heutige Leser verständlich.
