  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: de
  text: 'von Osni[a]: die Sippe der Osniter; von Eri[b]: die Sippe der Eriter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Familie der Osniter“. Das Hebräische verwendet eine Sippenbezeichnung und eine gentilizische Form.'
