  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: de
  text: 'Von Serach: die Sippe der Serachiter; von Saul: die Sippe der Sauliter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: von Serach
  rationale: Das Präfix לְ bezeichnet in dieser Volkszählungsformel die genealogische Zuordnung zu dem genannten Stammvater. „von Serach“ gibt diese Herkunft knapp und passend zur Listenform wieder.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftlich definierte Untergruppe innerhalb eines Stammes. „Sippe“ ist im Deutschen genauer als das allgemeinere „Familie“ und bleibt in der wiederholten Listenform natürlich.
- source_word: הַזַּרְחִי
  choice: der Serachiter
  rationale: Die patronymische Bildung bezeichnet die von Serach hergeleitete Gruppe. „Serachiter“ bildet diese Zugehörigkeit im Deutschen klar ab.
- source_word: לְ/שָׁאוּל
  choice: von Schaul
  rationale: Wie beim ersten Namen kennzeichnet לְ die genealogische Zuordnung. „von Schaul“ wahrt die parallele Struktur des hebräischen Satzes.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: Die Wiederholung wird entsprechend der hebräischen Formel gleichlautend wiedergegeben.
- source_word: הַשָּׁאוּלִי
  choice: der Schauliter
  rationale: Die patronymische Form bezeichnet die von Schaul abstammende Sippe. „Schauliter“ ist eine knappe und formgetreue deutsche Wiedergabe.
