  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: de
  text: 'Und dies waren die Söhne[a] Schutelachs: von Eran die Sippe der Eraniter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne“. In genealogischen Angaben kann das hebräische Wort auch Nachkommen oder Sippenlinien bezeichnen, nicht nur unmittelbare Söhne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Und dies waren
  rationale: Die Verbindung aus Konjunktion und Demonstrativ führt den nächsten Eintrag der Volkszählungsliste ein. Das Präteritum klingt im deutschen Erzählzusammenhang natürlich, ohne die Listenfunktion zu verändern.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die formale genealogische Ausdrucksweise des Hebräischen bleibt erhalten. Da hier auch Nachkommen beziehungsweise Sippenlinien gemeint sein können, erläutert eine Fußnote den weiteren Bedeutungsumfang.
- source_word: שׁוּתָלַח
  choice: Schutelach
  rationale: Der Personenname wird nach einer im Deutschen geläufigen biblischen Umschrift wiedergegeben.
- source_word: לְ/עֵרָן
  choice: von Eran
  rationale: Das Präfix לְ kennzeichnet hier innerhalb der Zählungsformel die von Eran hergeleitete Untergruppe. „Von Eran“ bewahrt diese knappe Zuordnungsformel.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: Im Kontext der Volkszählung bezeichnet מִשְׁפָּחָה eine verwandtschaftliche Untergliederung des Stammes; „Sippe“ gibt diese Ebene präzise und knapp wieder.
- source_word: הָ/עֵרָנִי
  choice: der Eraniter
  rationale: Die patronymische Form bezeichnet die nach Eran benannte Abstammungsgruppe. Der deutsche Gruppenname „Eraniter“ entspricht dieser Funktion.
