  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: de
  text: 'Das sind die Sippen der Söhne Ephraims nach der Zahl der Erfassten[a]: 32.500. Das sind die Söhne Josefs nach ihren Sippen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihrer Erfassung“, „nach ihrer Zahl“ oder sinngemäß „wie sie gezählt worden waren“. Der hebräische Ausdruck gehört zur Sprache der amtlichen Volkszählung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Zusammenhang mit Volkszählung und Stammesgliederung bezeichnet מִשְׁפָּחָה eine größere verwandtschaftliche Untergruppe eines Stammes; „Sippen“ gibt diese soziale Einheit präziser wieder als „Familien“.
- source_word: בְּנֵי אֶפְרַיִם
  choice: die Söhne Ephraims
  rationale: Die formal nahe Wiedergabe bewahrt die genealogische Ausdrucksweise des hebräischen Registers; gemeint sind hier Ephraims Nachkommen.
- source_word: לִפְקֻדֵיהֶם
  choice: nach ihren Gemusterten
  rationale: Die Form von פקד gehört zur Sprache der Zählung und Registrierung. „Gemusterte“ bezeichnet die amtlich erfassten Angehörigen und wahrt den Zensuscharakter der Formulierung.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '32.500'
  rationale: Die Zahl wird in üblicher moderner deutscher Schreibweise wiedergegeben und bewahrt den exakten Gesamtwert.
- source_word: בְנֵי יוֹסֵף
  choice: die Söhne Josefs
  rationale: Die wiederholte genealogische Formel wird formal bewahrt und verbindet Ephraim ausdrücklich mit Josef.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: Die Schlussformel fasst die verwandtschaftlichen Untergliederungen zusammen; die Wiedergabe entspricht konsistent dem ersten Vorkommen von מִשְׁפְּחֹת.
