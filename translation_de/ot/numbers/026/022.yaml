base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/022.yaml
  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: de
  text: 'Das waren die Sippen Judas nach ihren Erfassten: 76.500[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach ihrer Zahl«. Der hebräische Ausdruck bezeichnet die bei der Volkszählung Erfassten beziehungsweise Eingeschriebenen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Der pluralische Demonstrativausdruck leitet die abschließende Zusammenfassung ein; das Präteritum entspricht im Deutschen dem erzählenden Kontext der Volkszählung.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Zusammenhang der Stammeszählung bezeichnet das Wort verwandtschaftlich gegliederte Untergruppen eines Stammes; »Sippen« ist hier genauer als »Familien«.
- source_word: יְהוּדָה
  choice: Judas
  rationale: Nach »Sippen« steht der Name idiomatisch im deutschen Genitiv und bezeichnet hier den Stamm Juda.
- source_word: לִפְקֻדֵיהֶם
  choice: nach ihren Gemusterten
  rationale: Die Wendung beruht auf פקד im Sinn der amtlichen Erfassung bei einer Zählung. »Gemusterte« bewahrt den Zensusbezug knapp und natürlich; die mögliche Wiedergabe als bloße Gesamtzahl wird in der Fußnote genannt.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '76.500'
  rationale: Die Zahl wird in der im modernen Deutschen üblichen Reihenfolge und Schreibweise wiedergegeben; ihr genauer Wert bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sippen« und »Gemusterte« bewahren die sachliche Terminologie des Stammes- und Zensuskontexts, ohne unnötig altertümlich zu klingen.
