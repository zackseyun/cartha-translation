  text: וְ/שֵׁ֣ם אֵ֣שֶׁת עַמְרָ֗ם יוֹכֶ֨בֶד֙ בַּת לֵוִ֔י אֲשֶׁ֨ר יָלְדָ֥ה אֹתָ֛/הּ לְ/לֵוִ֖י בְּ/מִצְרָ֑יִם וַ/תֵּ֣לֶד לְ/עַמְרָ֗ם אֶֽת אַהֲרֹן֙ וְ/אֶת מֹשֶׁ֔ה וְ/אֵ֖ת מִרְיָ֥ם אֲחֹתָֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: de
  text: Der Name von Amrams Frau war Jochebed, eine Tochter Levis[a], die dem Levi in Ägypten geboren wurde[b]. Sie gebar dem Amram Aaron und Mose sowie deren Schwester Mirjam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Tochter Levis“. In genealogischen Zusammenhängen kann „Tochter“ mitunter auch allgemeiner eine weibliche Nachfahrin bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die sie dem Levi in Ägypten gebar“; wer die Mutter war, bleibt im Hebräischen unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: Der Name von Amrams Frau
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet den Namen der Frau Amrams. Das einleitende וְ wird im Deutschen nicht eigens wiedergegeben, da der Zusammenhang auch ohne ein hölzernes „Und“ gewahrt bleibt.
- source_word: יוֹכֶבֶד
  choice: Jochebed
  rationale: Der Personenname folgt der geläufigen deutschen Form.
- source_word: בַּת לֵוִי
  choice: eine Tochter Levis
  rationale: Die konkrete hebräische Verwandtschaftsbezeichnung „Tochter“ bleibt erhalten; die mögliche weitere genealogische Bedeutung wird nicht stillschweigend als „Nachfahrin“ festgelegt.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: die Levi in Ägypten geboren wurde
  rationale: Das Hebräische formuliert aktiv mit einer nicht genannten weiblichen Person als Subjekt („die sie dem Levi gebar“). Die deutsche Passivkonstruktion gibt den Sinn natürlich wieder, ohne die nicht ausdrücklich genannte Mutter zu ergänzen.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: Sie gebar Amram
  rationale: Die Formulierung bewahrt sowohl das Gebären als auch die durch לְ bezeichnete Beziehung zu Amram knapp und quellennah.
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה
  choice: Aaron und Mose
  rationale: Die Akkusativzeichen bleiben unübersetzt; die Namen stehen in ihren üblichen deutschen Formen.
- source_word: וְאֵת מִרְיָם אֲחֹתָם
  choice: und Mirjam, ihre Schwester
  rationale: Die hebräische Nachstellung von „ihre Schwester“ wird bewahrt und auf Aaron und Mose bezogen.
theological_decisions:
- issue: Genealogische Bedeutung von בַּת לֵוִי („Tochter Levis“)
  choice: Die wörtliche Verwandtschaftsbezeichnung „eine Tochter Levis“ bleibt im Haupttext stehen.
  alternative: „eine Nachfahrin Levis“
  rationale: Der Wortlaut soll nicht zur Lösung chronologischer oder genealogischer Fragen harmonisiert werden. Eine Fußnote weist auf die mögliche weitere Verwendung des Ausdrucks hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Bezug zur hebräischen Satzstruktur. Die traditionelle Namensform „Mose“ und die geläufigen deutschen Formen „Jochebed“, „Aaron“ und „Mirjam“ werden verwendet. Die genealogische Spannung und das unausgesprochene Subjekt des Relativsatzes werden durch Fußnoten offengelegt, nicht im Haupttext aufgelöst.
