  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: de
  text: von Asriël, die Sippe der Asriëliter, und von Sichem, die Sippe der Sichemiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: Asriël
  rationale: Der Personenname wird in einer im Deutschen eingebürgerten, zugleich am Hebräischen orientierten Form wiedergegeben; das Trema macht die getrennte Aussprache von i und e kenntlich.
- source_word: מִשְׁפַּחַת
  choice: die Sippe der
  rationale: Im Kontext der Volkszählung bezeichnet מִשְׁפָּחָה eine verwandtschaftliche Untergruppe des Stammes. „Sippe“ ist dafür im Deutschen präzise und natürlich.
- source_word: הָאַשְׂרִיאֵלִי
  choice: Asriëliter
  rationale: Das mit Artikel gebrauchte Gentiliz bezeichnet kollektiv die von Asriël abstammende Sippe; die deutsche Gruppenbezeichnung wird mit „-iter“ gebildet.
- source_word: וְ
  choice: und
  rationale: Die einfache Konjunktion verbindet die beiden Einträge der Aufzählung.
- source_word: שֶׁכֶם
  choice: Sichem
  rationale: Hier bezeichnet der Name den Ahnherrn der Sippe. „Sichem“ ist die geläufige deutsche Namensform.
- source_word: הַשִּׁכְמִי
  choice: Sichemiter
  rationale: Das Gentiliz bezeichnet kollektiv die Nachkommen Sichems und wird idiomatisch als „Sichemiter“ wiedergegeben.
