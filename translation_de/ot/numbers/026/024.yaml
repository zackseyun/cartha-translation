  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: de
  text: von Jaschub die Sippe der Jaschubiter; von Schimron die Sippe der Schimroniter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיָשׁוּב
  choice: von Jaschub
  rationale: Das לְ vor dem Personennamen führt in der Zählung den namensgebenden Vorfahren der Sippe an. „Von Jaschub“ bewahrt die knappe Listenform und die Zuordnungsbeziehung.
- source_word: מִשְׁפַּחַת
  choice: die Sippe der
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftlich bestimmte Untergruppe innerhalb des Stammes. „Sippe“ ist in diesem genealogisch-administrativen Zusammenhang präziser als „Familie“.
- source_word: הַיָּשׁוּבִי
  choice: Jaschubiter
  rationale: Die Nisbe bezeichnet die von Jaschub hergeleitete Gruppe. „Jaschubiter“ gibt den hebräischen Gruppennamen knapp und idiomatisch wieder.
- source_word: לְשִׁמְרֹן
  choice: von Schimron
  rationale: Wie im ersten Glied führt לְ den namensgebenden Vorfahren ein. Die gleiche Wiedergabe erhält den Parallelismus der Zählungsformel.
- source_word: מִשְׁפַּחַת
  choice: die Sippe der
  rationale: Die wiederholte Formel wird aus Gründen der Genauigkeit und Konsistenz unverändert wiedergegeben.
- source_word: הַשִּׁמְרֹנִי
  choice: Schimroniter
  rationale: Die Nisbe bezeichnet die nach Schimron benannte beziehungsweise von ihm hergeleitete Sippe; „Schimroniter“ ist die natürliche deutsche Gruppenbezeichnung.
