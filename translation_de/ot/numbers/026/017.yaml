  text: לַ/אֲר֕וֹד מִשְׁפַּ֖חַת הָ/אֲרוֹדִ֑י לְ/אַ֨רְאֵלִ֔י מִשְׁפַּ֖חַת הָ/אַרְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/017.yaml
  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: de
  text: Von Arod[a] die Sippe der Aroditen; von Areli die Sippe der Areliten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und der hebräischen Zählungsformel näher: „Zu Arod gehörte die Sippe der Aroditen; zu Areli gehörte die Sippe der Areliten.“ Die hebräische Präposition לְ steht jeweils vor dem Namen des Vorfahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: Von Arod
  rationale: Das vorangestellte לְ führt in der formelhaften Zählung den namensgebenden Vorfahren ein. „Von Arod“ gibt die Abstammungsbeziehung im Deutschen knapp und natürlich wieder.
- source_word: מִשְׁפַּחַת
  choice: die Sippe der
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftliche Untergliederung innerhalb des Stammes. „Sippe“ ist in diesem genealogischen und zensusartigen Zusammenhang präziser als das allgemeinere „Familie“.
- source_word: הָאֲרוֹדִי
  choice: der Aroditen
  rationale: Die gentilizische Form mit Artikel bezeichnet die von Arod hergeleitete Gruppe; der deutsche Volks- bzw. Sippenname im Plural bildet dies idiomatisch ab.
- source_word: לְאַרְאֵלִי
  choice: von Areli
  rationale: Wie beim ersten Namen führt לְ den namensgebenden Vorfahren ein. Die parallele Wiedergabe erhält die formelhafte Struktur.
- source_word: הָאַרְאֵלִי
  choice: der Areliten
  rationale: Die gentilizische Form bezeichnet die von Areli abstammende Sippe und wird idiomatisch als Gruppenname im Plural wiedergegeben.
