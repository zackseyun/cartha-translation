  variant: modern standard German
source:
  edition: WLC
  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: de
  text: 'Die Söhne Gads nach ihren Sippen: von Zefon[a] die Sippe der Zefoniter, von Haggi die Sippe der Haggiter, von Schuni die Sippe der Schuniter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Text- und Übersetzungstraditionen lesen hier „Zifon“ beziehungsweise „Zifoniter“ (vgl. 1. Mose 46,16). Der masoretische Text dieses Verses hat jedoch „Zefon“ (צפון); deshalb steht „Zefon“ im Haupttext.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: Die Söhne Gads
  rationale: Die formelhafte genealogische Wendung wird nah am Hebräischen wiedergegeben; der deutsche Genitiv ist natürlich und bewahrt die Abstammungssprache.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im Zählungs- und Stammeszusammenhang eine Untergliederung des Stammes; „Sippe“ ist hier präziser als das engere moderne „Familie“.
- source_word: לִצְפוֹן / לְחַגִּי / לְשׁוּנִי
  choice: von Zefon / von Haggi / von Schuni
  rationale: Das wiederholte ל kennzeichnet in dieser genealogischen Formel die Zuordnung zur Abstammungslinie; „von“ gibt dies knapp und parallel wieder.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: die Sippe der Zefoniter
  rationale: Die gentilizische Form bezeichnet die von Zefon abgeleitete Sippengruppe; „Zefoniter“ bildet dies im Deutschen verständlich ab.
- source_word: מִשְׁפַּחַת הַחַגִּי
  choice: die Sippe der Haggiter
  rationale: Die gentilizische Bezeichnung wird als deutscher Gruppenname wiedergegeben und wahrt die parallele Listenstruktur.
- source_word: מִשְׁפַּחַת הַשּׁוּנִי
  choice: die Sippe der Schuniter
  rationale: Die vom Ahnherrn Schuni abgeleitete Gruppenbezeichnung wird in natürlicher deutscher Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper genealogischer Parallelstruktur. „Sippe“ vermeidet die mögliche Verengung von מִשְׁפָּחָה auf die heutige Kleinfamilie. Die Namen folgen einer geläufigen deutschen Transliteration; der im masoretischen Text bezeugte Name Zefon bleibt erhalten.
