  text: בְּנֵ֥י יוֹסֵ֖ף לְ/מִשְׁפְּחֹתָ֑/ם מְנַשֶּׁ֖ה וְ/אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/028.yaml
  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: de
  text: 'Die Söhne Josefs nach ihren Sippen: Manasse und Ephraim.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Söhne
  rationale: Der Status constructus im Plural wird mit der üblichen und transparenten Abstammungsbezeichnung wiedergegeben; im Zensuskontext bleibt so die formale Linie zu Josef sichtbar.
- source_word: יוֹסֵף
  choice: Josefs
  rationale: Der Eigenname wird in der im Deutschen üblichen Form wiedergegeben und wegen der hebräischen Genitivverbindung flektiert.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederung eines Stammes und nicht bloß die moderne Kernfamilie. Die Präposition לְ drückt die Einteilung beziehungsweise Zuordnung aus; „nach ihren Sippen“ gibt dies natürlich und präzise wieder.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Im Deutschen etablierte Form des Personen- und Stammesnamens.
- source_word: וְאֶפְרָיִם
  choice: und Ephraim
  rationale: Die Konjunktion und der Eigenname werden direkt wiedergegeben; gemeint ist die zweite der beiden von Josef hergeleiteten Stammeslinien.
theological_decisions: []
