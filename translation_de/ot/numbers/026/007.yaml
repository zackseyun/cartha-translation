base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: de
  text: Das sind die Sippen der Rubeniter. Die Zahl ihrer Gemusterten betrug 43.730.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ihrer Gezählten“ oder „ihrer Erfassten“. Das hebräische Wort bezeichnet hier die bei der Volkszählung registrierten Personen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Stammes- und Volkszählungskontext bezeichnet das Wort größere verwandtschaftliche Untergruppen eines Stammes, nicht bloß Kernfamilien. „Sippen“ gibt diese soziale Einheit im Deutschen knapp und verständlich wieder.
- source_word: הָרֻאוּבֵנִי
  choice: der Rubeniter
  rationale: Das Gentiliz bezeichnet die Angehörigen beziehungsweise Nachkommen Rubens; „Rubeniter“ ist die gebräuchliche deutsche Stammesbezeichnung.
- source_word: פְקֻדֵיהֶם
  choice: der bei ihnen Gemusterten
  rationale: Das Wort gehört im Kontext zur Volkszählung und bezeichnet die erfassten beziehungsweise gemusterten Personen. Die Formulierung bewahrt den passiven Zählungssinn, ohne an dieser Stelle das im Hebräischen nicht wiederholte Wort „Männer“ einzufügen.
- source_word: וַיִּהְיוּ
  choice: betrug
  rationale: Bei einer zahlenmäßigen Gesamtangabe ist „betrug“ im modernen Deutschen natürlicher als ein bloßes „war“, ohne den Aussagegehalt zu verändern.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: '43.730'
  rationale: Die Ziffernschreibung ist bei einer Volkszählung übersichtlich und gibt die hebräische Zahl exakt wieder.
theological_decisions: []
