base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: de
  text: Von zwanzig Jahren an aufwärts, wie Jahwe[a] Mose und den Israeliten[b] geboten hatte, die aus dem Land Ägypten ausgezogen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat den Gottesnamen JHWH, hier mit »Jahwe« wiedergegeben; traditionell wird er mit »der HERR« wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »den Söhnen Israels«; gemeint ist das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: Von zwanzig Jahren an aufwärts
  rationale: Die hebräische Schwellenformel bezeichnet Menschen im Alter von mindestens zwanzig Jahren. Die Wiedergabe bewahrt die knappe, im Kontext elliptische Form des Ausgangstextes.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: wie … geboten hatte
  rationale: כַּאֲשֶׁר verweist vergleichend auf den vorausgehenden Auftrag; das Plusquamperfekt macht im Deutschen deutlich, dass dieser Befehl bereits ergangen war, ohne seinen Inhalt abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als Jahwe wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: und den Israeliten
  rationale: Wörtlich steht »Söhne Israels«; hier bezeichnet die feste Wendung jedoch das Volk Israel insgesamt.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: die aus dem Land Ägypten gezogen waren
  rationale: Das substantivisch bzw. attributiv gebrauchte Partizip kennzeichnet die Israeliten als die aus Ägypten ausgezogene Generation. »gezogen waren« entspricht natürlichem Deutsch und wahrt den zeitlichen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den persönlichen Gottesnamen, während »der HERR« die traditionelle Ersatzlesung darstellt.
- issue: Bezugswort von הַיֹּצְאִים
  choice: Relativsatz zu »Israeliten«
  alternative: 'syntaktischer Neuansatz: »Die Israeliten, die …«'
  rationale: Nach Wortstellung und Kongruenz bezieht sich das maskuline Pluralpartizip am unmittelbarsten auf »Israeliten«. Die im masoretischen Text vorhandene knappe, an den Kontext anschließende Syntax wird nicht durch einen neuen Hauptsatz ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Gestalt des hebräischen Verses bleibt erkennbar, statt ein im masoretischen Text nicht ausdrücklich vorhandenes Verb wie »zählt« oder »mustert« einzufügen.
