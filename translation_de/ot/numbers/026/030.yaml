  text: אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד אִיעֶ֕זֶר מִשְׁפַּ֖חַת הָ/אִֽיעֶזְרִ֑י לְ/חֵ֕לֶק מִשְׁפַּ֖חַת הַֽ/חֶלְקִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: de
  text: 'Das sind die Söhne Gileads:[a] von Iëser: die Sippe der Iësriter; von Helek: die Sippe der Helkiter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Söhne Gileads« kann im Hebräischen auch männliche Nachkommen oder die von ihnen hergeleiteten Sippen bezeichnen, nicht nur unmittelbare Söhne.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Das hebräische Demonstrativ ist ohne Zeitangabe; im Deutschen führt das Präsens die folgende Aufzählung natürlich ein.
- source_word: בְּנֵי גִלְעָד
  choice: die Söhne Gileads
  rationale: Bewahrt die formale genealogische Ausdrucksweise; im Zusammenhang sind männliche Nachkommen beziehungsweise von ihnen hergeleitete Sippen gemeint.
- source_word: אִיעֶזֶר
  choice: Iëser
  rationale: Der Personenname wird nach seiner hebräischen Form ins Deutsche übertragen; das Trema verdeutlicht die getrennte Aussprache von I und e.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: Im Zensus bezeichnet das Wort eine Untergliederung des Stammes; »Sippe« ist hier genauer als das moderne, engere »Familie«.
- source_word: הָאִיעֶזְרִי
  choice: die Iësriter
  rationale: Die gentilizische Form bezeichnet die von Iëser hergeleitete Sippe und wird als deutscher Gruppenname wiedergegeben.
- source_word: לְחֵלֶק
  choice: von Helek
  rationale: Das Präfix לְ führt in der wiederkehrenden Zensusformel den jeweiligen Ahnherrn der Sippe ein; »von« bildet diese Zuordnung natürlich ab.
- source_word: הַחֶלְקִי
  choice: die Helkiter
  rationale: Die gentilizische Form bezeichnet die von Helek hergeleitete Sippe und wird als deutscher Gruppenname wiedergegeben.
