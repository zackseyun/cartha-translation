  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: de
  text: Das sind die Sippen der Söhne Aschers. Die Zahl der von ihnen amtlich Erfassten betrug 53.400[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nach ihren Gemusterten“. Das hebräische Wort gehört zur Sprache der Volkszählung und bezeichnet diejenigen, die amtlich erfasst oder gezählt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Der pluralische Demonstrativausdruck leitet die zusammenfassende Feststellung ein; im Deutschen ist „Das sind“ natürlich und klar.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Zusammenhang der Stammeszählung bezeichnet das Wort größere verwandtschaftliche Gruppen, nicht moderne Kernfamilien; „Sippen“ gibt diese soziale Einheit prägnant wieder.
- source_word: בְּנֵי אָשֵׁר
  choice: die Söhne Aschers
  rationale: Die Formulierung bewahrt die genealogische Ausdrucksweise des Hebräischen und bezeichnet hier die männliche Stammeslinie beziehungsweise Aschers Nachkommen.
- source_word: לִפְקֻדֵיהֶם
  choice: nach ihren Gemusterten
  rationale: Das von פקד abgeleitete Wort gehört zur Zählungs- und Musterungssprache und meint die amtlich erfassten Personen. Die Wendung bewahrt diese konkrete Bedeutung statt nur eine abstrakte Gesamtzahl zu nennen.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '53.400'
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise wiedergegeben und entspricht genau der hebräischen Gesamtangabe.
theological_decisions: []
translation_notes:
