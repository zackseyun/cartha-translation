  text: לְ/יֵ֕צֶר מִשְׁפַּ֖חַת הַ/יִּצְרִ֑י לְ/שִׁלֵּ֕ם מִשְׁפַּ֖חַת הַ/שִּׁלֵּמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: de
  text: 'Von Jezer: die Sippe der Jezeriter; von Schillem: die Sippe der Schillemiter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: von Jezer
  rationale: Das Präfix לְ leitet in dieser Zählungsformel den jeweiligen Stammvater der Sippe ein; im Deutschen gibt „von“ diese Zugehörigkeit natürlich wieder. Der Personenname folgt der im Deutschen gebräuchlichen biblischen Form „Jezer“.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftlich definierte Untergruppe innerhalb eines Stammes. „Sippe“ ist genauer als das moderne „Familie“ und passt zum israelitischen Zählungskontext.
- source_word: הַ/יִּצְרִי
  choice: der Jesriter
  rationale: Die Nisbe bezeichnet die von Jezer hergeleitete Sippe. „Jesriter“ ist die gebräuchliche deutsche biblische Bezeichnung; die unterschiedliche Namensform Jezer/J.esriter beruht auf der traditionellen Wiedergabe und nicht auf einem Bedeutungsunterschied.
- source_word: לְ/שִׁלֵּם
  choice: von Schillem
  rationale: Wie im ersten Halbvers kennzeichnet לְ den Sippenvater; „von“ bewahrt die parallele Zählungsformel. Der Name wird transliteriert.
- source_word: הַ/שִּׁלֵּמִי
  choice: der Schillemiter
  rationale: Die Nisbe bezeichnet die Nachkommen beziehungsweise Sippe Schillems. „Schillemiter“ bildet diese Ableitung im Deutschen klar und knapp ab.
theological_decisions: []
translation_notes:
  register: Knappes, formelhaftes Zählungsregister in modernem, würdigem Standarddeutsch. Der parallele Satzbau des Hebräischen bleibt erhalten; das Semikolon trennt die beiden Sippeneinträge.
