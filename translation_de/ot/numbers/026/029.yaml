  variant: modern standard German
source:
  edition: WLC
  text: בְּנֵ֣י מְנַשֶּׁ֗ה לְ/מָכִיר֙ מִשְׁפַּ֣חַת הַ/מָּכִירִ֔י וּ/מָכִ֖יר הוֹלִ֣יד אֶת גִּלְעָ֑ד לְ/גִלְעָ֕ד מִשְׁפַּ֖חַת הַ/גִּלְעָדִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: de
  text: 'Die Söhne Manasses: von Machir die Sippe der Machiriter; Machir zeugte Gilead; von Gilead die Sippe der Gileaditer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Die Söhne Manasses
  rationale: Die wörtliche genealogische Wendung bleibt erhalten; im Zusammenhang der Volkszählung schließt sie die Nachkommen beziehungsweise Stammeszweige ein.
- source_word: לְמָכִיר
  choice: von Machir
  rationale: Das präfigierte לְ ordnet die folgende Sippe der von Machir ausgehenden Linie zu; »von« gibt diese genealogische Beziehung knapp und parallel wieder.
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: die Sippe der Machiriter
  rationale: מִשְׁפָּחָה bezeichnet hier eine Untergliederung des Stammes und wird daher mit »Sippe« statt mit dem engeren »Familie« wiedergegeben; das Gentiliz wird als Gruppenbezeichnung pluralisch übersetzt.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: Machir zeugte Gilead
  rationale: »zeugte« ist die präzise und im Deutschen weiterhin verständliche genealogische Entsprechung des Hifil von ילד; das einleitende ו wird nach dem Semikolon ohne zusätzliches »und« natürlich wiedergegeben.
- source_word: לְגִלְעָד
  choice: von Gilead
  rationale: Wie zuvor bei Machir kennzeichnet לְ die zu Gilead gehörende Abstammungslinie; die parallele Formulierung wird bewahrt.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: die Sippe der Gileaditer
  rationale: »Sippe« entspricht der sozialen Einheit im Zensuskontext; das Gentiliz wird als kollektive Gruppenbezeichnung »Gileaditer« wiedergegeben.
theological_decisions: []
