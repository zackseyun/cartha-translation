base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: de
  text: 'Dies sind die Söhne Ephraims nach ihren Sippen: von Schutelach die Sippe der Schutelachiter, von Becher die Sippe der Becheriter, von Tahan die Sippe der Tahaniter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: Dies sind die Söhne Ephraims
  rationale: Die hebräische Listenformel wird eng und zugleich idiomatisch wiedergegeben. „Söhne“ bewahrt die genealogische Ausdrucksweise, obwohl im Zusammenhang auch die von ihnen abstammenden Gruppen gemeint sind.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im Zensuskontext eine Untergliederung des Stammes; „Sippe“ gibt diese genealogisch-soziale Einheit treffender wieder als das engere moderne „Familie“.
- source_word: לְשׁוּתֶלַח
  choice: von Schutelach
  rationale: Das präfigierte ל ordnet die folgende Sippe dem genannten Stammvater zu. „Von“ erhält die knappe Listenstruktur und bezeichnet die Abstammungszuordnung.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: die Sippe der Schutelachiter
  rationale: Das Gentilizium bezeichnet die von Schutelach hergeleitete Gruppe; die deutsche Pluralbildung auf „-iter“ ist in biblischen Stammes- und Sippennamen geläufig.
- source_word: לְבֶכֶר ... מִשְׁפַּחַת הַבַּכְרִי
  choice: von Becher die Sippe der Becheriter
  rationale: Die wiederholte genealogische Formel wird parallel wiedergegeben; die Namensform bleibt für deutschsprachige Leser durchsichtig.
- source_word: לְתַחַן ... מִשְׁפַּחַת הַתַּחֲנִי
  choice: von Tahan die Sippe der Tahaniter
  rationale: Die syntaktische Parallelität des hebräischen Verzeichnisses bleibt erhalten, und das Gentilizium wird als kollektive Sippenbezeichnung formuliert.
