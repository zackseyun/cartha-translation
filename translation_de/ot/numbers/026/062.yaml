  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: de
  text: Die Zahl ihrer Gemusterten betrug 23.000, alle männlichen Personen im Alter von einem Monat an. Denn sie waren nicht unter den Söhnen Israels[a] gemustert worden, weil ihnen kein Erbbesitz unter den Söhnen Israels gegeben worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder an beiden Stellen: »Israeliten« statt »Söhne Israels«.'
    reason: 'Lexikalische Alternative: בְּנֵי יִשְׂרָאֵל kann sowohl formal als »Söhne Israels« als auch idiomatisch als »Israeliten« wiedergegeben werden.'
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: die Zahl der bei ihnen Gemusterten
  rationale: Das Wort bezeichnet im Volkszählungskontext die erfassten Personen beziehungsweise deren Gesamtzahl. Die Formulierung gibt den Sinn natürlich wieder und hält den Bezug auf die Gruppe fest.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: '23.000'
  rationale: Übliche deutsche Wiedergabe der Kardinalzahl.
- source_word: כָּל זָכָר
  choice: alle männlichen Personen
  rationale: Die Formulierung ist geschlechtsgenau und schließt, wie die folgende Altersangabe zeigt, auch Säuglinge ein; daher wäre »Männer« zu eng.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: im Alter von einem Monat an
  rationale: Natürliche deutsche Formulierung für die im Hebräischen angegebene untere Altersgrenze.
- source_word: הָתְפָּקְדוּ
  choice: waren … gemustert worden
  rationale: Bewahrt den Bezug zur förmlichen Zählung und entspricht demselben hebräischen Wortstamm wie zu Beginn des Verses.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: zusammen mit den Söhnen Israels / unter den Söhnen Israels
  rationale: Die jeweilige Präposition wird dem deutschen Kontext angepasst; »Söhne Israels« bewahrt die familiäre Ausdrucksweise des Hebräischen.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: ihnen kein Erbbesitz … gegeben worden war
  rationale: »Erbbesitz« bezeichnet hier den erblich zugeteilten Landanteil und bewahrt zugleich die Passivkonstruktion.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die gewählte Form gibt die wörtliche familiäre und bundesbezogene Ausdrucksweise wieder, ohne die mögliche idiomatische Bedeutung »Israeliten« auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gemusterte« hält den amtlichen Volkszählungskontext fest; »männliche Personen« ist wegen der Einbeziehung einmonatiger Säuglinge präziser als »Männer«.
