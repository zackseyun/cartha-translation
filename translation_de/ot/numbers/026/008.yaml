lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das וּ führt die genealogische Aufzählung fort und wird mit „Und“ wiedergegeben. בְנֵי ist die Konstruktform im Plural von „Söhne“; die wörtliche genealogische Formulierung bleibt verständlich und bewahrt, dass der hebräische Text den Plural verwendet, obwohl nur Eliab genannt wird.
- source_word: פַלּוּא
  choice: Pallu
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben; im Genitivzusammenhang erhält er die Endung -s.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
