base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/052.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: Alternative traditionelle Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das Wayyiqtol führt die Erzählung weiter. Die geläufige deutsche Schriftformel „Da sprach“ gibt sowohl den Fortgang als auch den feierlichen Charakter der Redeeinleitung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch den traditionellen Ersatztitel „der HERR“ ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten des Sprechens; im Deutschen ist „zu Mose sprechen“ die natürliche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den Inhalt der folgenden Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion besser als das formelhafte „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; „der HERR“ wäre eine traditionelle Ersatzlesung, „Jehova“ eine historisch entstandene Mischform.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird idiomatisch mit „Da sprach …:“ wiedergegeben; der Doppelpunkt verweist auf die in Vers 53 folgende Rede.
