base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: de
  text: Da öffnete die Erde ihren Mund und verschlang sie und Korach, als die Gemeinde starb, als das Feuer die zweihundertfünfzig Männer verzehrte; und sie wurden zu einem Zeichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einem Warnzeichen«. Das hebräische Wort kann ein Zeichen, Signal oder Feldzeichen bezeichnen; im Zusammenhang hat es warnende Funktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: Da öffnete die Erde ihren Mund
  rationale: אֶרֶץ kann »Erde« oder »Land« bedeuten; das Bild des sich öffnenden Bodens spricht hier für »Erde«. »Mund« bewahrt die anschauliche Personifikation.
- source_word: וַתִּבְלַע אֹתָם וְאֶת־קֹרַח
  choice: und verschlang sie und Korach
  rationale: Die koordinierte Formulierung des Hebräischen wird beibehalten, ohne Korachs Schicksal mit anderen Stellen harmonisierend umzudeuten.
- source_word: בְּמוֹת הָעֵדָה
  choice: als die Gemeinde starb
  rationale: ב mit dem Infinitiv constructus ist temporal. עֵדָה bezeichnet in Numeri regelmäßig die versammelte Gemeinde beziehungsweise Gemeinschaft.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: als das Feuer … verzehrte
  rationale: Das wörtliche »aß« wird bei Feuer im Deutschen idiomatisch und zugleich bildnah mit »verzehrte« wiedergegeben.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: die zweihundertfünfzig Männer
  rationale: Die Zahl und das geschlechtsspezifische אִישׁ werden direkt und in natürlicher deutscher Zahlenschreibung wiedergegeben.
- source_word: וַיִּהְיוּ לְנֵס
  choice: und sie wurden zu einem Zeichen
  rationale: נֵס kann Zeichen, Signal oder Feldzeichen bezeichnen. »Zeichen« bleibt lexikalisch eng und lässt die im Kontext naheliegende Warnfunktion unausgesprochen, statt sie in den Haupttext einzutragen.
theological_decisions:
- issue: Bezugswort des abschließenden Plurals »sie wurden«
  choice: Der Plural bleibt ohne nähere Bestimmung erhalten.
  alternative: Die zweihundertfünfzig Männer oder das gesamte Gerichtsgeschehen ausdrücklich als Bezugsgröße festlegen.
  rationale: Die hebräische Pluralform lässt den Bezug offen; die Übersetzung bewahrt diese Mehrdeutigkeit.
- issue: Korachs Verhältnis zum Verschlungenwerden in diesem Vers
  choice: »sie und Korach« wird entsprechend der unmittelbaren hebräischen Syntax beibehalten.
  alternative: Korach durch eine erklärende oder harmonisierende Formulierung von den Verschlungenen trennen.
  rationale: Der Vers nennt Korach syntaktisch zusammen mit »ihnen«. Eine Harmonisierung mit der weiteren Erzählung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Syntax. Die ungewöhnliche Aussage »als die Gemeinde starb« und die Verbindung »sie und Korach« bleiben bewusst erhalten. Der Fußnotenmarker [a] steht unmittelbar nach der zu erläuternden Wendung.
