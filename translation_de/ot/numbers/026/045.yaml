  text: לִ/בְנֵ֣י בְרִיעָ֔ה לְ/חֶ֕בֶר מִשְׁפַּ֖חַת הַֽ/חֶבְרִ֑י לְ/מַ֨לְכִּיאֵ֔ל מִשְׁפַּ֖חַת הַ/מַּלְכִּיאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: de
  text: 'Von den Söhnen Berias: von Heber die Sippe der Heberiter; von Malkiël die Sippe der Malkiëliter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי בְרִיעָה
  choice: Von den Söhnen Berias
  rationale: Die Zensusformel ordnet die folgenden Untergruppen den Söhnen Berias zu. „Söhne“ wahrt die genealogische Ausdrucksweise des Hebräischen; der Genitiv „Berias“ ist im Deutschen natürlich.
- source_word: לְחֶבֶר
  choice: von Heber
  rationale: Das präfigierte ל bezeichnet in dieser wiederkehrenden Zensusformel die Abstammungslinie; „von“ gibt diese Herkunft knapp und verständlich wieder.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: Im Zensus bezeichnet מִשְׁפָּחָה eine größere verwandtschaftliche Untereinheit innerhalb eines Stammes. „Sippe“ ist hier präziser als das im Deutschen meist enger verstandene „Familie“.
- source_word: הַחֶבְרִי
  choice: der Heberiter
  rationale: Die patronymische Form bezeichnet die von Heber hergeleitete Gruppe. „Heberiter“ bildet diesen Gruppennamen im Deutschen klar ab.
- source_word: לְמַלְכִּיאֵל
  choice: von Malkiël
  rationale: Wie bei Heber kennzeichnet ל die von dem genannten Vorfahren ausgehende Linie; „von Malkiël“ bewahrt den parallelen Aufbau.
- source_word: הַמַּלְכִּיאֵלִי
  choice: der Malkiëliter
  rationale: Die patronymische Form bezeichnet die Nachkommengruppe Malkiëls. „Malkiëliter“ erhält die genealogische Benennung und den Parallelismus.
theological_decisions: []
