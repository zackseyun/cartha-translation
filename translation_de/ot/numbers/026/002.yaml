source:
  edition: WLC
  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: de
  text: Erfasst die ganze Gemeinde der Söhne Israels[a], alle, die zwanzig Jahre alt und darüber sind, nach ihren Vaterhäusern[b], jeden in Israel, der zum Kriegsdienst auszieht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne Israels“; auch möglich: „Israeliten“ oder „Kinder Israels“.'
    reason: lexical_alternative
  - marker: b
    text: „Vaterhäuser“ bezeichnet die nach väterlicher Abstammung gegliederten Großfamilien oder Sippenverbände.
    reason: cultural_clarification
  - marker: c
    text: 'Auch möglich: „jeden in Israel, der wehrfähig ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: Erfasst
  rationale: Die Wendung bedeutet wörtlich „hebt das Haupt“ und ist hier eine feste Zählungsformel. „Erfasst“ gibt den Auftrag zu einer Volks- beziehungsweise Musterungszählung knapp und natürlich wieder.
- source_word: כָּל־עֲדַת
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet die organisierte Gemeinschaft Israels. „Gemeinde“ bewahrt den gemeinschaftlichen und zugleich würdigen Ton.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die familiäre maskuline Ausdrucksweise des Hebräischen bleibt erhalten; im Zusammenhang der militärischen Musterung ist sie zudem sachlich relevant.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: alle Zwanzigjährigen und darüber
  rationale: Dies gibt die Altersgrenze idiomatisch und präzise wieder, ohne ein zusätzliches Geschlechtssubstantiv einzuführen.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ bildet die patrilinearen Großfamilien beziehungsweise Sippenverbände des Textes genauer ab als das allgemeinere „Familien“.
- source_word: כָּל־יֹצֵא צָבָא
  choice: jeden …, der zum Kriegsdienst auszieht
  rationale: Die Formulierung bleibt nahe beim partizipialen „jeder Ausziehende“ und bringt die militärische Bedeutung von צָבָא im Kontext klar zum Ausdruck.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die einfache Wiedergabe wahrt die mögliche soziale beziehungsweise räumliche Beziehung, ohne sie unnötig festzulegen.
theological_decisions:
- issue: Geschlechtsspezifische Bundes- und Abstammungsbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Kinder Israels
  rationale: Die wörtlich-familiäre und maskuline Bezeichnung wird bewahrt. Das ist in dieser militärischen Zählung nicht bloß eine allgemeine Sammelbezeichnung, sondern kontextuell bedeutsam.
- issue: Bedeutungsumfang von כָּל־יֹצֵא צָבָא
  choice: jeden in Israel, der zum Kriegsdienst auszieht
  alternative: jeden in Israel, der wehrfähig ist
  rationale: „Wehrfähig“ würde eine Fähigkeit oder Eignung ausdrücklich machen, die im hebräischen Partizip nur funktional vorausgesetzt sein kann. Die gewählte Fassung bewahrt die konkrete Rede vom Ausziehen und erklärt צָבָא sachgerecht als Kriegsdienst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Imperativ „Erfasst“ ist klar und knapp; „Vaterhäuser“ und „Kriegsdienst“ bewahren die institutionelle Struktur des Ausgangstextes. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
