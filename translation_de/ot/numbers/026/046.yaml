translation_notes:
  register: Modernes, standarddeutsches und würdiges Erzählregister. Die idiomatische Konstruktion „hieß“ vermeidet die im Deutschen schwerfällige wörtliche Wiedergabe „Und der Name … war“, ohne Inhalt hinzuzufügen.
