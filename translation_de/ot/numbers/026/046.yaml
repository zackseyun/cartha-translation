lexical_decisions:
- source_word: וְשֵׁם
  choice: Und … hieß
  rationale: Die hebräische Verbindung aus Konjunktion und Nominalkonstruktion fügt eine weitere genealogische Angabe an. Im Deutschen gibt „Und … hieß“ den Sinn natürlich und knapp wieder.
- source_word: בַּת אָשֵׁר
  choice: Aschers Tochter
  rationale: Die Singularform „Tochter“ bezeichnet hier am ehesten eine leibliche Tochter; der deutsche Genitiv gibt die hebräische Status-constructus-Verbindung prägnant wieder.
- source_word: שָׂרַח
  choice: Serach
  rationale: Der Personenname wird nach seiner hebräischen Form transliteriert; „ch“ gibt den abschließenden gutturalen Laut für deutschsprachige Leser angemessen wieder.
