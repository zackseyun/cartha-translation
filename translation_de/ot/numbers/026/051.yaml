source:
  edition: WLC
  text: אֵ֗לֶּה פְּקוּדֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל שֵׁשׁ מֵא֥וֹת אֶ֖לֶף וָ/אָ֑לֶף שְׁבַ֥ע מֵא֖וֹת וּ/שְׁלֹשִֽׁים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: de
  text: 'Das waren die Gemusterten der Söhne Israels[a]: 601.730[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Israeliten“. Wörtlich: „der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: sechshunderteintausendsiebenhundertdreißig.'
    reason: numeric_clarity
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Das deiktische Pluralwort fasst hier die zuvor aufgeführten Zählungen zusammen; im Deutschen wird die Kopula ergänzt und wegen des rückblickenden Abschlusses das Präteritum natürlich verwendet.
- source_word: פְּקוּדֵי
  choice: die Gemusterten
  rationale: Die substantivische Form von פקד bezeichnet im Zusammenhang die bei der Volks- und Heereszählung registrierten Personen. „Gemusterte“ bewahrt sowohl den Personenbezug als auch den militärischen Zählungskontext.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die formal nahe Wiedergabe erhält das hebräische Verwandtschaftsbild und den im Zensuskontext männlichen Bezug.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: '601.730'
  rationale: Die additiven Zahlenglieder ergeben 601.730; die Ziffernschreibung ist im modernen Deutschen bei einer solchen Zensusgesamtzahl klar und natürlich.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  alternative: der Israeliten
  rationale: Die gewählte Form bewahrt den familiären Ausdruck des Hebräischen und vermeidet eine stillschweigende Einebnung zum bloßen Volksnamen. Eine Fußnote nennt die idiomatische Alternative.
- issue: Bedeutung von פְּקוּדֵי im Zensuskontext
  choice: die Gemusterten
  alternative: die Gezählten / die Gesamtzahl der Gemusterten
  rationale: Der hebräische Ausdruck bezieht sich auf die registrierten Personen, nicht nur abstrakt auf die Summe. „Gemusterte“ lässt zugleich den militärisch geprägten Zensuszusammenhang erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gemusterte“ ist ein geläufiger, präziser Begriff für zum Dienst erfasste Männer; die nahe Wendung „Söhne Israels“ hält die Bildsprache der Vorlage fest. Die Zahl wird zur schnellen Erfassbarkeit in deutscher Schreibweise mit Tausenderpunkt gesetzt.
