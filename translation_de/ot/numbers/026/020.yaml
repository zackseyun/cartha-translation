  text: וַ/יִּהְי֣וּ בְנֵי יְהוּדָה֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שֵׁלָ֗ה מִשְׁפַּ֨חַת֙ הַ/שֵּׁ֣לָנִ֔י לְ/פֶ֕רֶץ מִשְׁפַּ֖חַת הַ/פַּרְצִ֑י לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: de
  text: 'Die Nachkommen Judas, nach ihren Sippen geordnet, waren: von Schela die Sippe der Schelaniter, von Perez die Sippe der Pereziter und von Serach die Sippe der Serachiter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: Die Form von היה leitet in dieser Volkszählung die Aufzählung ein; „waren“ gibt die kopulative Funktion natürlich und knapp wieder.
- source_word: בְנֵי יְהוּדָה
  choice: die Nachkommen Judas
  rationale: Wörtlich steht „die Söhne Judas“. Im Zusammenhang der Volkszählung bezeichnet der Ausdruck jedoch die in männlicher Linie auf Juda zurückgeführten Nachkommen; „Nachkommen“ vermeidet im Deutschen das Missverständnis, nur seine unmittelbaren Söhne seien gemeint.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen geordnet
  rationale: מִשְׁפָּחָה bezeichnet hier Untergliederungen eines Stammes. „Sippen“ ist genauer als das moderne „Familien“, und „geordnet“ macht die einteilende Funktion der Präposition לְ idiomatisch deutlich.
- source_word: לְשֵׁלָה
  choice: von Schela
  rationale: Das wiederholte לְ führt jeweils den Stammvater der betreffenden Sippe an; „von“ drückt die Abstammungszuordnung knapp aus.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: die Sippe der Schelaniter
  rationale: Die Wiedergabe bewahrt sowohl den ausdrücklichen Sippenbegriff als auch die vom Namen Schela abgeleitete Gruppenbezeichnung.
- source_word: לְפֶרֶץ / מִשְׁפַּחַת הַפַּרְצִי
  choice: von Perez die Sippe der Pereziter
  rationale: „Perez“ folgt unmittelbar dem hebräischen Namen; „Pereziter“ gibt die zugehörige Gentilbezeichnung verständlich wieder.
- source_word: לְזֶרַח / מִשְׁפַּחַת הַזַּרְחִי
  choice: von Serach die Sippe der Serachiter
  rationale: „Serach“ ist eine im Deutschen natürliche, hebräisch orientierte Umschrift von זֶרַח; „Serachiter“ bildet die entsprechende Sippenbezeichnung transparent ab.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Listenstil. Die parallele Struktur des hebräischen Sippenregisters bleibt erhalten, während „Nachkommen“ den genealogischen Sinn von בְנֵי im Volkszählungskontext klar ausdrückt.
