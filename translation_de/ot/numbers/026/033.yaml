source:
  edition: WLC
  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: de
  text: Zelofhad, der Sohn Hefers, hatte keine Söhne[a], sondern nur Töchter. Die Töchter Zelofhads hießen Machla, Noa[b], Hogla, Milka und Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ihm waren keine Söhne, sondern Töchter.«'
    reason: lexical_alternative
  - marker: b
    text: Noa ist hier der Name einer Tochter Zelofhads, nicht Noah aus der Fluterzählung.
    reason: cultural_note
lexical_decisions:
- source_word: וּצְלָפְחָד בֶּן־חֵפֶר
  choice: Zelofhad, der Sohn Hefers
  rationale: Das anknüpfende ו wird im Deutschen nicht eigens wiedergegeben, da der Zusammenhang die Fortführung bereits erkennen lässt. Die Namen folgen gebräuchlichen deutschen Bibelschreibungen; die Abstammungsangabe wird natürlich formuliert.
- source_word: לֹא הָיוּ לוֹ בָּנִים
  choice: hatte keine Söhne
  rationale: Die hebräische Besitzkonstruktion lautet wörtlich etwa »ihm waren keine Söhne«; idiomatisches Deutsch gibt sie mit »hatte keine Söhne« wieder. »Söhne« bleibt erhalten, weil der Text ausdrücklich Töchter gegenüberstellt.
- source_word: כִּי אִם בָּנוֹת
  choice: sondern nur Töchter
  rationale: 'כִּי אִם drückt hier nach der Verneinung eine ausschließende Gegenüberstellung aus: keine Söhne, sondern ausschließlich Töchter.'
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: Die Töchter Zelofhads hießen
  rationale: Der hebräische Singular שֵׁם steht kollektiv vor mehreren Namen. Die deutsche Wendung ist knapp und natürlich, ohne den Sinn zu verändern.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Machla, Noa, Hogla, Milka und Tirza
  rationale: Die Personennamen werden in den im Deutschen verbreiteten biblischen Formen wiedergegeben. »Noa« bewahrt zugleich die im Hebräischen erkennbare Unterscheidung zum Namen Noahs aus der Fluterzählung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Namensliste und die ausdrückliche Gegenüberstellung von Söhnen und Töchtern bleiben erhalten.
