source:
  edition: WLC
  text: אַךְ בְּ/גוֹרָ֕ל יֵחָלֵ֖ק אֶת הָ/אָ֑רֶץ לִ/שְׁמ֥וֹת מַטּוֹת אֲבֹתָ֖/ם יִנְחָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: de
  text: Nur durch das Los soll das Land verteilt werden; nach den Namen der Stämme ihrer Väter[a] sollen sie erben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihrer Vorfahren“. Wörtlich steht im Hebräischen „ihrer Väter“; gemeint sind die väterlichen Abstammungslinien innerhalb der Stämme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Nur
  rationale: Die Partikel wirkt hier einschränkend und legt fest, dass die Verteilung ausschließlich durch das Los erfolgen soll.
- source_word: בְּגוֹרָל
  choice: durch das Los
  rationale: Das instrumentale בְּ bezeichnet das Los als Mittel der Landverteilung; „durch das Los“ ist im Deutschen klar und idiomatisch.
- source_word: יֵחָלֵק
  choice: soll … verteilt werden
  rationale: Die Nifal-Form wird passiv wiedergegeben. „Soll“ bringt in diesem Weisungskontext den verpflichtenden Charakter des Imperfekts natürlich zum Ausdruck.
- source_word: אֶת הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist das zur Verteilung bestimmte Land; eine weitergehende Präzisierung ist im Text nicht nötig.
- source_word: לִשְׁמוֹת
  choice: nach den Namen
  rationale: Die Präposition bezeichnet hier den Maßstab beziehungsweise Bezug der Zuteilung. „Nach den Namen“ bewahrt die konkrete Ausdrucksweise des Hebräischen.
- source_word: מַטּוֹת
  choice: Stämme
  rationale: מַטּוֹת kann wörtlich „Stäbe“ bedeuten, bezeichnet hier jedoch eindeutig die Stammesverbände Israels.
- source_word: אֲבֹתָם
  choice: ihrer Väter
  rationale: Die wörtliche und kontextuell bedeutsame männliche Abstammungsbezeichnung wird beibehalten; eine mögliche allgemeinere Wiedergabe wird in der Fußnote genannt.
- source_word: יִנְחָלוּ
  choice: sollen sie erben
  rationale: Das Verb נחל bezeichnet den Empfang als Erbbesitz. Die knappe deutsche Formulierung bewahrt das im Hebräischen nicht ausdrücklich genannte Objekt.
theological_decisions:
- issue: Geschlechtsspezifische Abstammungsbezeichnung in אֲבֹתָם
  choice: ihrer Väter
  alternative: ihrer Vorfahren
  rationale: Der hebräische Text spricht ausdrücklich von „Vätern“ und verweist im Zusammenhang der Stammeszugehörigkeit auf väterliche Abstammungslinien. Die Hauptübersetzung bewahrt diesen Akzent, ohne die allgemeinere mögliche Wiedergabe zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Parallelismus, während „soll … verteilt werden“ den rechtlich-anweisenden Zusammenhang natürlich ausdrückt.
