    issue: Namensform „Sebulons“
    rationale: 'Die etablierte deutsche biblische Namensform lautet „Sebulon“ (Genitiv: „Sebulons“). Die vorliegende Form „Sebulons“ ist zwar verständlich, aber als Grundform bzw. zugrunde liegende Schreibweise nicht die übliche deutsche Bibelnamenschreibung.'
  revised_text: 'Die Söhne Sebulons nach ihren Sippen: von Sered die Sippe der Serediter, von Elon die Sippe der Eloniter und von Jachleel die Sippe der Jachleeliter.'
