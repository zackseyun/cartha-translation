  edition: WLC
  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: de
  text: 'Die Söhne Sebulons nach ihren Sippen: von Sered die Sippe der Serediter, von Elon die Sippe der Eloniter und von Jachleel die Sippe der Jachleeliter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: Die Söhne Sebulons
  rationale: Die konstruktive Verbindung wird wörtlich und im Deutschen natürlich wiedergegeben. Im Volkszählungskontext bezeichnet „Söhne“ zugleich die von Sebulon abstammenden Stammesangehörigen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die größeren Verwandtschaftsgruppen innerhalb des Stammes; „Sippe“ ist präziser als das im Deutschen enger wirkende „Familie“. Die Präposition לְ hat eine gliedernde Bedeutung.
- source_word: לְסֶרֶד
  choice: von Sered
  rationale: Das präfigierte לְ führt in der Listenformel den jeweiligen Stammvater der Sippe ein; „von“ drückt die Abstammungsbeziehung knapp aus.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: die Sippe der Serediter
  rationale: Das Gentilizium bezeichnet die von Sered abgeleitete Sippengruppe. Die deutsche Bildung „Serediter“ macht diese Beziehung transparent.
- source_word: לְאֵלֹון … מִשְׁפַּחַת הָאֵלֹנִי
  choice: von Elon die Sippe der Eloniter
  rationale: Die wiederholte Listenformel und das von Elon gebildete Gentilizium werden parallel zum ersten Glied wiedergegeben.
- source_word: לְיַחְלְאֵל … מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: von Jachleel die Sippe der Jachleeliter
  rationale: „Jachleel“ gibt יַחְלְאֵל nach geläufiger deutscher Bibelnamen-Tradition wieder; das Gentilizium wird entsprechend als „Jachleeliter“ gebildet.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die dreigliedrige hebräische Listenstruktur bleibt erkennbar; „Sippe“ wahrt den Volkszählungs- und Stammeskontext, ohne die Gruppen als bloße Kernfamilien erscheinen zu lassen.
