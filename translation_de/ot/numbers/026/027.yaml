base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/027.yaml
  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: de
  text: 'Das sind die Sippen der Sebuloniter, nach der Zahl ihrer Gemusterten: 60.500.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Das deiktische Pluralpronomen leitet die zusammenfassende Zensusformel ein; im Deutschen ist hier das Präsens natürlich.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Stammes- und Zensuskontext bezeichnet der Ausdruck größere verwandtschaftliche Gruppen innerhalb eines Stammes; „Sippen“ ist genauer als „Familien“.
- source_word: הַזְּבוּלֹנִי
  choice: der Sebuloniter
  rationale: Das artikulierte Gentiliz steht kollektiv für die von Sebulon abstammende Stammesgruppe; der deutsche Plural „Sebuloniter“ gibt dies idiomatisch wieder.
- source_word: לִפְקֻדֵיהֶם
  choice: nach der Zahl ihrer Gemusterten
  rationale: Die Form von פקד hat hier den Zensus- beziehungsweise Musterungssinn. Die Wiedergabe wahrt den Bezug auf die erfassten Angehörigen und ergibt zugleich natürliches Deutsch.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '60.500'
  rationale: Die Ziffernschreibung ist in modernem Deutsch für eine Zensuszahl klar und würdevoll; der Punkt entspricht der deutschen Schreibkonvention für Tausendergruppen.
