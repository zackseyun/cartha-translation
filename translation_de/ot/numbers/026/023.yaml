  terminology: „Sippe“ trifft hier die soziale Untergliederung von משפחה präzise. Die Namen Tola, Puwa sowie die daraus gebildeten Gruppenbezeichnungen sind konsistent. Die Fußnote gibt die abweichende Namensschreibung „Pua“ sachlich wieder und ist zutreffend bei „Puwa“ verankert.
