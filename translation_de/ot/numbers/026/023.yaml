source:
  edition: WLC
  text: בְּנֵ֤י יִשָּׂשכָר֙ לְ/מִשְׁפְּחֹתָ֔/ם תּוֹלָ֕ע מִשְׁפַּ֖חַת הַ/תּוֹלָעִ֑י לְ/פֻוָ֕ה מִשְׁפַּ֖חַת הַ/פּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: de
  text: 'Die Söhne Issachars nach ihren Sippen: von Tola die Sippe der Tolaiter; von Puwa[a] die Sippe der Puniter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Puwa wird in einigen verwandten Stellen und Übersetzungen „Pua“ geschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: Die Söhne Issachars
  rationale: Die wörtliche genealogische Wendung bleibt erhalten; im Zusammenhang der Volkszählung bezeichnet sie zugleich die Nachkommen Issachars.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederungen des Stammes. „Sippen“ ist im Deutschen präziser als das allgemeinere „Familien“ und passt zum Zählungsregister.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Der Personenname wird transliteriert; die gleichlautende Bedeutung des gewöhnlichen Substantivs ist hier nicht gemeint.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: die Sippe der Tolaiter
  rationale: Die gentilizische Form bezeichnet die von Tola hergeleitete Sippe; der deutsche Gruppenname „Tolaiter“ bildet diese Funktion natürlich ab.
- source_word: לְפֻוָה
  choice: von Puwa
  rationale: Das vorangestellte לְ führt in der Aufzählung den jeweiligen Sippenahnen ein. Die Schreibung פֻוָה wird im Deutschen lautnah als „Puwa“ wiedergegeben.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: die Sippe der Puniter
  rationale: Die gentilizische Form benennt die von Puwa abstammende Gruppe; „Puniter“ erhält die vom hebräischen Text unterschiedene Form des Sippennamens.
theological_decisions: []
translation_notes:
