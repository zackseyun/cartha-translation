  source_fidelity: 'Der Entwurf gibt die hebräische Listenform und ihre Gliederung zuverlässig wieder: בני יששכר als „Die Söhne Issachars“, למשפחתם als „nach ihren Sippen“ und die beiden distributiven לְ-Einleitungen mit „von“. Die Gentilformen הַתּוֹלָעִי und הַפּוּנִי sind korrekt als Gruppenbezeichnungen „Tolaiter“ und „Puniter“ wiedergegeben. „Puwa“ entspricht der Schreibung פֻוָה in diesem Vers.'
