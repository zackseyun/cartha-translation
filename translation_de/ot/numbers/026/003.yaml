  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן אֹתָ֖/ם בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: de
  text: 'Mose und der Priester Eleasar sprachen zu ihnen in den Ebenen Moabs am Jordan bei Jericho und sagten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redeten
  rationale: Das Verb דבר bezeichnet hier das Sprechen zu den Adressaten; der Plural entspricht dem zusammengesetzten Subjekt Mose und Eleasar.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Eingebürgerte deutsche Form des hebräischen Personennamens.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: und der Priester Eleasar
  rationale: Natürliche deutsche Wortstellung; הַכֹּהֵן bezeichnet Eleasars Amt, ohne ihn hier ausdrücklich »Hohepriester« zu nennen.
- source_word: אֹתָם
  choice: zu ihnen
  rationale: Der pronominale Objektmarker bezeichnet die Angeredeten; mit »reden« ist »zu ihnen« idiomatisch.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: in den Steppen Moabs
  rationale: עֲרָבוֹת bezeichnet die flachen, trockenen Steppengebiete; »Steppen Moabs« ist im Deutschen geografisch präzise und verständlich.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: am Jordan gegenüber von Jericho
  rationale: Die feste geografische Wendung lokalisiert die moabitische Ebene am Jordan auf der Jericho gegenüberliegenden Seite.
- source_word: לֵאמֹר
  choice: 'Sie sagten:'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Ein neuer deutscher Hauptsatz ist natürlicher als das schwerfällige »indem sie sagten«.
