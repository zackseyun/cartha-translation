  text: בְּנֵ֣י שִׁמְעוֹן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/נְמוּאֵ֗ל מִשְׁפַּ֨חַת֙ הַ/נְּמ֣וּאֵלִ֔י לְ/יָמִ֕ין מִשְׁפַּ֖חַת הַ/יָּמִינִ֑י לְ/יָכִ֕ין מִשְׁפַּ֖חַת הַ/יָּכִינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: de
  text: Die Söhne Simeons nach ihren Sippen:[a] von Nemuel die Sippe der Nemueliter, von Jamin die Sippe der Jaminiter, von Jachin[b] die Sippe der Jachiniter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren Familien“. Mit „Sippen“ sind hier die Abstammungsgruppen innerhalb des Stammes gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Der Name kann auch „Jakin“ geschrieben werden.
    reason: transliteration_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: Die Söhne Simeons
  rationale: Die genealogische Wendung wird nah am Hebräischen wiedergegeben; im Zusammenhang der Volkszählung sind die männlichen Abstammungslinien gemeint.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederungen des Stammes. „Sippen“ ist im Deutschen präziser als das leicht missverständliche „Familien“.
- source_word: לִנְמוּאֵל / לְיָמִין / לְיָכִין
  choice: von Nemuel / von Jamin / von Jachin
  rationale: Das Präfix לְ führt in dieser Aufzählungsformel jeweils den namensgebenden Vorfahren der Sippe ein; „von“ gibt die Abstammungsbeziehung natürlich wieder.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי / הַיָּמִינִי / הַיָּכִינִי
  choice: die Sippe der Nemueliter / Jaminiter / Jachiniter
  rationale: Die Gentilizia bezeichnen jeweils die nach dem Vorfahren benannte Nachkommengruppe und werden daher als deutsche Gruppenbezeichnungen im Plural wiedergegeben.
