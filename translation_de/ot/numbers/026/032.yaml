  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: de
  text: von Schemida die Sippe der Schemidaiter und von Hefer die Sippe der Heferiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: von Schemida
  rationale: Die knappe hebräische Zählungsformel setzt den in den vorangehenden Gliedern erkennbaren Herkunftsbezug fort; das Deutsche ergänzt daher idiomatisch „von“. Der Personenname wird in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftlich definierte Untergruppe innerhalb des Stammes. „Sippe“ gibt diese Ebene präziser wieder als das allgemeinere „Familie“.
- source_word: הַ/שְּׁמִידָעִי
  choice: der Schemidaiter
  rationale: Die gentilizische Form bezeichnet die von Schemida hergeleitete Gruppe. „Schemidaiter“ bildet diesen Abstammungsnamen im Deutschen verständlich und knapp ab.
- source_word: וְ/חֵפֶר
  choice: und von Hefer
  rationale: Die Konjunktion führt das nächste Glied derselben elliptischen Zählungsformel ein; „von“ wird zur natürlichen deutschen Wiedergabe des Herkunftsverhältnisses ergänzt.
- source_word: הַֽ/חֶפְרִי
  choice: der Heferiter
  rationale: Die gentilizische Form bezeichnet die zu Hefer gehörende beziehungsweise von ihm abstammende Gruppe; „Heferiter“ bewahrt diese Funktion als Gruppenname.
theological_decisions: []
