  text: בְּנֵ֣י בִנְיָמִן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/בֶ֗לַע מִשְׁפַּ֨חַת֙ הַ/בַּלְעִ֔י לְ/אַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽ/אַשְׁבֵּלִ֑י לַ/אֲחִירָ֕ם מִשְׁפַּ֖חַת הָ/אֲחִירָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: de
  text: 'Die Söhne Benjamins nach ihren Sippen: von Bela die Sippe der Belaiter, von Aschbel die Sippe der Aschbeliter und von Ahiram[a] die Sippe der Ahiramiter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der masoretische Text liest hier »Ahiram«; in einigen Textüberlieferungen und Übersetzungen steht »Ahiam«.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: die Söhne Benjamins
  rationale: Die Grundbedeutung von בְּנֵי ist »Söhne«. Im Zusammenhang der Volkszählung sind damit zugleich die von ihnen ausgehenden Nachkommen gemeint; die formale genealogische Ausdrucksweise bleibt erhalten.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederung eines Stammes. »Sippe« gibt diese Ebene im heutigen Deutsch genauer wieder als das mehrdeutige »Familie«.
- source_word: לְבֶלַע
  choice: von Bela
  rationale: Das vorangestellte לְ führt in dieser Aufzählung jeweils den Stammvater einer Sippe ein; »von Bela« drückt die genealogische Zuordnung natürlich aus.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: die Sippe der Belaiter
  rationale: Die gentilizische Bildung הַבַּלְעִי bezeichnet die nach Bela benannte beziehungsweise von ihm abstammende Sippe. »Belaiter« bildet den Namen im Deutschen transparent nach.
- source_word: לְאַשְׁבֵּל
  choice: von Aschbel
  rationale: Wie bei Bela kennzeichnet לְ den Ahnherrn der folgenden Sippe. Die Schreibweise »Aschbel« entspricht der üblichen deutschen Wiedergabe des hebräischen Namens.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: die Sippe der Aschbeliter
  rationale: Das Gentilizium wird als deutsche Gruppenbezeichnung »Aschbeliter« wiedergegeben und parallel zu den übrigen Sippennamen formuliert.
- source_word: לַאֲחִירָם
  choice: von Ahiram
  rationale: Der masoretische Text liest אֲחִירָם. »Ahiram« gibt diese Lesart wieder; לַ wird entsprechend der genealogischen Reihe mit »von« übersetzt.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: die Sippe der Ahiramiter
  rationale: Die vom Namen Ahiram abgeleitete Gruppenbezeichnung wird im Deutschen regelmäßig als »Ahiramiter« gebildet.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte genealogische Listenform des Hebräischen bleibt erkennbar, wird aber durch die abschließende Verbindung mit »und« natürlich lesbar. Der Fußnotenmarker steht bei »Ahiram«, da sich die Textvariante auf diesen Namen bezieht.
