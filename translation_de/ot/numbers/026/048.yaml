  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: de
  text: 'Die Söhne Naftalis nach ihren Sippen: von Jachzeel die Sippe der Jachzeeliter; von Guni die Sippe der Guniter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die wörtliche Konstruktform leitet die genealogische Aufzählung ein; „Söhne“ ist hier im Deutschen verständlich und bewahrt die hebräische Ausdrucksweise.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Der Personen- und Stammesname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: Die Präposition bezeichnet hier die Gliederung des Stammes; „Sippen“ trifft מִשְׁפָּחָה im Zusammenhang der Volkszählung genauer als das engere moderne „Familien“.
- source_word: לְיַחְצְאֵל
  choice: von Jachzeel
  rationale: Das לְ führt in der wiederkehrenden Zählungsformel den Stammvater der jeweiligen Sippe ein; „von“ gibt das genealogische Verhältnis natürlich wieder.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: die Sippe der Jachzeeliter
  rationale: Das Gentiliz bezeichnet kollektiv die von Jachzeel hergeleitete Gruppe; der deutsche Plural „Jachzeeliter“ macht diesen Sinn deutlich.
- source_word: לְגוּנִי
  choice: von Guni
  rationale: Wie zuvor führt לְ den Ahnherrn der Untergruppe ein; „von Guni“ entspricht der knappen genealogischen Listenform.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: die Sippe der Guniter
  rationale: Das Gentiliz wird kollektiv als Bezeichnung der von Guni abstammenden Sippe wiedergegeben.
