lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: wurden ... geboren
  rationale: Das Nifal von ילד bezeichnet hier in einer genealogischen Formel das Geborenwerden. Obwohl das hebräische Verb morphologisch im Singular steht, verlangt die Aufzählung mehrerer Söhne im natürlichen Deutschen den Plural.
- source_word: לְאַהֲרֹן
  choice: Aaron
  rationale: Die Präposition לְ kennzeichnet in dieser genealogischen Wendung den Elternteil, dem die Söhne geboren wurden. Die deutsche Konstruktion „Aaron wurden ... geboren“ bewahrt diese Perspektive.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: nicht gesondert wiedergegeben
  rationale: Die wiederholte Partikel אֶת markiert die Namen in der hebräischen Konstruktion, besitzt hier aber keine eigenständige deutsche Entsprechung.
- source_word: נָדָב
  choice: Nadab
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: אֲבִיהוּא
  choice: Abihu
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Im Deutschen gebräuchliche biblische Form des Personennamens.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
