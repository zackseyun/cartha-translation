  text: Dem Aaron wurden Nadab und Abihu, Eleasar und Itamar geboren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht das Verb formal im Singular („wurde geboren“), obwohl anschließend vier Namen folgen. Dies ist eine genealogische Formel.
