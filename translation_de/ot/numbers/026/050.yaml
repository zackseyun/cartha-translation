  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: de
  text: Dies sind die Sippen Naftalis nach ihren Sippen, und die Zahl ihrer Gemusterten betrug 45.400.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Gemusterten zählten 45.400.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Die deiktische Pluralform leitet die zusammenfassende Aussage ein; das Präsens entspricht der hebräischen Nominalkonstruktion und klingt in einer Aufzählung natürlich.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Zusammenhang der Stammeszählung bezeichnet מִשְׁפָּחָה größere verwandtschaftliche Untergruppen eines Stammes; „Sippen“ ist daher genauer als das häuslich klingende „Familien“.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Gebräuchliche deutsche Schreibweise des Stammes- und Personennamens.
- source_word: לְמִשְׁפְּחֹתָם
  choice: geordnet nach ihren Sippen
  rationale: Das präfigierte לְ kennzeichnet hier die Einteilung beziehungsweise Zuordnung nach Sippen. „Geordnet nach“ macht diese Funktion in natürlichem Deutsch deutlich.
- source_word: וּפְקֻדֵיהֶם
  choice: die Zahl der bei ihnen Gemusterten
  rationale: Die Form von פקד bezeichnet im Zählungskontext die registrierten beziehungsweise gemusterten Personen. Die Wiedergabe vermeidet den nicht ausdrücklich gesetzten Zusatz „Männer“, bewahrt aber den Personenbezug.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '45.400'
  rationale: Direkte Wiedergabe der Kardinalzahl in der im modernen Deutschen üblichen Ziffernschreibung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sippen“ wahrt die soziale Größenordnung der Stammesuntergliederung; „Gemusterte“ erhält den formellen Zählungscharakter. Der Fußnotenmarker steht unmittelbar nach der betroffenen Satzaussage.
