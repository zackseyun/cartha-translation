- from: Das sind die Sippen Naftalis, geordnet nach ihren Sippen, und die Zahl der bei ihnen Gemusterten betrug 45.400.[a]
  to: Dies sind die Sippen Naftalis nach ihren Sippen, und die Zahl ihrer Gemusterten betrug 45.400.[a]
  rationale: Die possessive Beziehung in וּפְקֻדֵיהֶם wird mit „ihrer Gemusterten“ präzise wiedergegeben. Die alternative Fußnote bietet eine Formulierung, die die Gemusterten unmittelbar als die gezählte Personengruppe auffasst. Bedeutung, Register und die im Hebräischen vorliegende Zensusformel bleiben erhalten.
