  text: לָ/רַ֗ב תַּרְבֶּה֙ נַחֲלָת֔/וֹ וְ/לַ/מְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑/וֹ אִ֚ישׁ לְ/פִ֣י פְקֻדָ֔י/ו יֻתַּ֖ן נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: de
  text: Dem größeren Stamm sollst du ein größeres Erbteil geben und dem kleineren Stamm ein kleineres Erbteil; jedem soll sein Erbteil entsprechend der Zahl seiner Gemusterten gegeben werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jedem nach Maßgabe seiner Gemusterten“. Der knappe hebräische Ausdruck bezieht die Größe des Erbteils unmittelbar auf die Zahl der bei der Musterung Erfassten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: dem größeren Stamm
  rationale: רַב steht substantivisch und bezeichnet im Zusammenhang der Volkszählung die zahlenmäßig größere Stammesgruppe. „Stamm“ macht den Bezug im Deutschen natürlich verständlich.
- source_word: תַּרְבֶּה נַחֲלָתוֹ
  choice: sollst du ein größeres Erbteil geben
  rationale: Die Hifilform von רבה verlangt eine Vergrößerung; idiomatisches Deutsch drückt dies bei einer Landzuteilung mit „ein größeres Erbteil geben“ aus.
- source_word: וְלַמְעַט
  choice: und dem kleineren Stamm
  rationale: מְעַט ist parallel zu רַב substantivisch gebraucht und bezeichnet die zahlenmäßig kleinere Gruppe.
- source_word: תַּמְעִיט נַחֲלָתוֹ
  choice: ein kleineres Erbteil
  rationale: Die Hifilform von מעט bedeutet „kleiner machen/verringern“. In diesem Kontext ist die natürliche deutsche Entsprechung die Zuweisung eines kleineren Erbteils.
- source_word: נַחֲלָה
  choice: Erbteil
  rationale: Das Wort bezeichnet hier den rechtmäßig zugeteilten Landbesitz; „Erbteil“ bewahrt den erbrechtlichen Klang und passt zum biblischen Landverteilungskontext.
- source_word: אִישׁ
  choice: jedem
  rationale: Das maskuline Singularwort ist distributiv gebraucht. „Jedem“ bildet diese Verteilung ab, ohne fälschlich eine Landzuteilung an jeden einzelnen Mann statt an die jeweils repräsentierte Gruppe nahezulegen.
- source_word: לְפִי פְקֻדָיו
  choice: entsprechend der Zahl seiner Gemusterten
  rationale: לְפִי bezeichnet Maßstab beziehungsweise Verhältnis; פְקֻדָיו meint die bei der Zählung Erfassten. Die Formulierung bewahrt den knappen Bezug zur Volkszählung.
- source_word: יֻתַּן
  choice: soll ... gegeben werden
  rationale: Die passive Form von נתן wird formal als „gegeben werden“ wiedergegeben; der Zusammenhang macht die Zuteilung deutlich.
theological_decisions:
- issue: Bezug der proportionalen Landzuteilung
  choice: Die Stammesgruppe erhält ihr Erbteil entsprechend ihrer Zahl bei der Musterung.
  alternative: Jeder einzelne Mann erhält ein persönliches Erbteil entsprechend den von ihm Abstammenden.
  rationale: Der unmittelbare Zensus- und Landverteilungskontext sowie die Gegenüberstellung von größerer und kleinerer Gruppe sprechen für einen distributiven Singular, ohne dass eine individualistische Zuteilung in den Text eingetragen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbteil“ wahrt die traditionelle Rechtssprache; „Gemusterte“ hält den Bezug zur amtlichen Volkszählung fest. Die parallele hebräische Konstruktion wird in natürlichem Deutsch als „ein größeres … ein kleineres Erbteil“ wiedergegeben.
