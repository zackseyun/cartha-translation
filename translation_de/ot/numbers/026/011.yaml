  footnotes:
  - marker: a
    text: 'Oder: „Und die Söhne Korachs starben nicht.“ Die hebräische Konjunktion kann eine einfache Verknüpfung ausdrücken; „Aber“ hebt den Gegensatz zu den zuvor erwähnten Todesfällen hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Aber die Söhne
  rationale: Die Konjunktion ו kann schlicht mit „und“ wiedergegeben werden; im Zusammenhang hebt sie hier jedoch den Gegensatz zu den zuvor genannten Todesfällen hervor. בְנֵי bezeichnet in diesem genealogischen Zusammenhang die Söhne beziehungsweise Nachkommen.
- source_word: קֹרַח
  choice: Korachs
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben; der Genitiv entspricht der hebräischen Status-constructus-Verbindung.
- source_word: לֹא
  choice: nicht
  rationale: Die hebräische Negation wird im deutschen Präteritum natürlich mit „nicht“ wiedergegeben.
- source_word: מֵתוּ
  choice: starben
  rationale: Die Form von מות bedeutet „sterben“; das Präteritum „starben“ entspricht der abgeschlossenen Aussage im erzählenden beziehungsweise genealogischen Zusammenhang.
theological_decisions: []
