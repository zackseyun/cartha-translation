  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose und zu Eleasar, dem Sohn des Priesters Aaron:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die Grundbedeutung ist „sagen“. Zusammen mit dem folgenden לֵאמֹר leitet die Form direkt die in Vers 2 folgende Rede ein; im Deutschen genügt dafür natürlich ein Doppelpunkt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Form.
- source_word: אֶל מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: zu Mose und zu Eleasar
  rationale: Die Wiederholung der Präposition אֶל wird beibehalten und kennzeichnet beide Männer ausdrücklich als Adressaten.
- source_word: בֶּן אַהֲרֹן הַכֹּהֵן
  choice: dem Sohn des Priesters Aaron
  rationale: Die hebräische Wortfolge ist mehrdeutig hinsichtlich der Zuordnung von „der Priester“. Der Kontext und der masoretische Akzent unterstützen die natürliche deutsche Zuordnung des Titels zu Aaron.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeanzeiger wird im modernen Deutschen idiomatisch durch einen Doppelpunkt vor der folgenden direkten Rede ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen; die Übersetzung bewahrt ihn als Eigennamen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Zuordnung des Titels הַכֹּהֵן
  choice: Aaron ist als Priester bezeichnet
  alternative: Eleasar ist als Priester bezeichnet
  rationale: Die Stellung unmittelbar nach „Aaron“ und der masoretische Akzent sprechen für „Aaron, der Priester“. Die deutsche Genitivfügung „des Priesters Aaron“ gibt diese Zuordnung eindeutig und natürlich wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitung wird idiomatisch mit „sagte …:“ wiedergegeben; der Satz bleibt offen für den in Vers 2 folgenden Redetext.
