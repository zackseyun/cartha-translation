source:
  edition: WLC
  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: de
  text: 'Denn Jahwe hatte zu ihnen gesagt: »Sie werden ganz gewiss in der Wüste sterben.«[a] Und von ihnen war kein einziger übrig geblieben außer Kaleb, dem Sohn Jefunnes, und Josua, dem Sohn Nuns.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen eine verstärkende Verbindung: »Sterbend werden sie sterben«; gemeint ist: Sie werden ganz gewiss sterben.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlicher: »Und nicht ein Mann war von ihnen übrig geblieben.« Das heißt: Kein Einziger von ihnen blieb übrig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die zuvor festgestellte Lage ein und bewahrt die erklärende beziehungsweise kausale Funktion.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als im Deutschen geläufige Transkription des persönlichen Gottesnamens wieder, statt es durch einen Titel zu ersetzen.
- source_word: אָמַר ... לָהֶם
  choice: hatte über sie gesagt
  rationale: Das Plusquamperfekt macht deutlich, dass der Ausspruch der nun beschriebenen Erfüllung vorausging; »über sie« gibt den Bezug der Aussage in diesem Kontext natürlich wieder.
- source_word: מוֹת יָמֻתוּ
  choice: Sie werden ganz gewiss ... sterben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; »ganz gewiss« bildet diesen Nachdruck in natürlichem modernem Deutsch ab.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: »Wüste« ist eine übliche und kontextgerechte Wiedergabe von מִדְבָּר im Zusammenhang der Wüstenwanderung.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: Und keiner von ihnen war übrig geblieben
  rationale: 'Gibt den distributiven Sinn von אִישׁ idiomatisch wieder: Kein einziger Angehöriger der betreffenden Gruppe blieb übrig.'
- source_word: כִּי אִם
  choice: außer
  rationale: Kennzeichnet die beiden alleinigen Ausnahmen von der vorausgehenden Verneinung.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Kaleb, dem Sohn Jefunnes
  rationale: Verwendet die im Deutschen gebräuchlichen Namensformen und gibt das Patronymikon natürlich wieder.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: und Josua, dem Sohn Nuns
  rationale: Verwendet die traditionelle deutsche Namensform Josua und gibt das Patronymikon eindeutig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« bewahrt ihn als Namen und verwendet die im modernen Deutschen übliche wissenschaftliche Transkription, ohne einen Titel einzusetzen.
- issue: Umfang und Gewissheit des angekündigten Todes
  choice: »Sie werden ganz gewiss in der Wüste sterben«
  alternative: »Sterbend werden sie sterben«; »Sie müssen in der Wüste sterben«
  rationale: Die Wiedergabe erhält die starke Bekräftigung der göttlichen Ankündigung, ohne die hebräische Konstruktion unnatürlich nachzubilden oder zusätzliche modale Bedeutungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der emphatische hebräische Ausdruck wird idiomatisch wiedergegeben; eine Fußnote dokumentiert seine Form. »Keiner« bildet den generischen, distributiven Sinn von אִישׁ natürlicher ab als das im Deutschen missverständliche »kein Mann«.
