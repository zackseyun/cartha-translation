  yaml_path: translation/ot/numbers/026/056.yaml
  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: de
  text: Nach dem Los soll sein Erbbesitz unter den größeren und kleineren Stämmen verteilt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל פִּי
  choice: Nach der Entscheidung
  rationale: Die Wendung bedeutet idiomatisch »gemäß« beziehungsweise »nach Maßgabe«. Mit »nach der Entscheidung des Loses« wird deutlich, dass das Los die Zuteilung bestimmt.
- source_word: הַגּוֹרָל
  choice: des Loses
  rationale: גּוֹרָל bezeichnet hier das zur Landverteilung verwendete Los.
- source_word: תֵּחָלֵק
  choice: soll … aufgeteilt werden
  rationale: Der Niphal von חלק bezeichnet hier passiv die Aufteilung beziehungsweise Zuteilung des Erbbesitzes.
- source_word: נַחֲלָתוֹ
  choice: sein Erbbesitz
  rationale: Der maskuline Singularsuffix wird formal mit »sein« wiedergegeben; im Zusammenhang ist die Aussage distributiv auf den jeweils betroffenen Stamm bezogen. »Erbbesitz« bezeichnet treffend den zugewiesenen Landanteil.
- source_word: בֵּין
  choice: zwischen
  rationale: בֵּין stellt hier die Beziehung zwischen zwei gegensätzlichen Größenklassen her.
- source_word: רַב
  choice: dem größeren
  rationale: רַב steht im Zensus- und Verteilungskontext vergleichend für die zahlenmäßig größere Einheit; die knappe substantivische Form bewahrt die Unbestimmtheit des Hebräischen.
- source_word: לִמְעָט
  choice: dem kleineren
  rationale: מְעָט bildet den Gegenpol zu רַב und bezeichnet hier die zahlenmäßig kleinere Einheit. Die Präposition wird in der deutschen Konstruktion »zwischen … und …« idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Erbbesitz« hält den Land- und Zuteilungsbezug fest. Die etwas knappe Gegenüberstellung »dem größeren und dem kleineren« bewahrt die im Hebräischen nicht ausdrücklich genannten Bezugswörter und damit dessen Mehrdeutigkeit.
