    rationale: Die Wendung bedeutet hier »nach/gemäß dem Los«. Zwar entscheidet das Los funktional über die Zuteilung, doch »Entscheidung« steht nicht ausdrücklich im Text und ist weniger direkt.
  - severity: medium
    issue: »zwischen dem größeren und dem kleineren« hat keinen klaren deutschen Bezug und steht zudem im Singular.
    rationale: Im Kontext sind größere und kleinere Stämme beziehungsweise Gruppen gemeint. Die Pluralform mit dem Bezugswort macht die Verteilung verständlich und idiomatisch.
  revised_text: Nach dem Los soll sein Erbbesitz unter den größeren und kleineren Stämmen verteilt werden.
