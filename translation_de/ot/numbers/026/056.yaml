revisions:
- from: Nach der Entscheidung des Loses[a] soll sein Erbbesitz zwischen dem größeren und dem kleineren aufgeteilt werden.
  to: Nach dem Los soll sein Erbbesitz unter den größeren und kleineren Stämmen verteilt werden.
  rationale: Die Revision ersetzt die interpretierende Formulierung »nach der Entscheidung des Loses« durch die nähere und natürliche Wiedergabe »nach dem Los«. Außerdem ergänzt sie den kontextuell eindeutigen Bezug »Stämmen«, damit die kontrastierten Größen im Deutschen klar und grammatisch idiomatisch ausgedrückt werden. Die Fußnote bietet die mögliche Wiedergabe »viele und wenige« und erklärt die Größenrelation.
  reviewer_model: gpt-5.6-terra
