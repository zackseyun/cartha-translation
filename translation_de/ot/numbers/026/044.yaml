  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: de
  text: 'Die Söhne Aschers nach ihren Sippen: Zu Jimna gehörte die Sippe der Jimniter, zu Jischwi die Sippe der Jischwiter und zu Beria die Sippe der Beriiter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Die Söhne Aschers
  rationale: Die wörtliche genealogische Wendung „Söhne Aschers“ ist im Deutschen verständlich und bewahrt die Form des hebräischen Ausdrucks; im Zusammenhang schließt sie die von diesen Söhnen ausgehenden Gruppen ein.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet in diesem Zensus eine Untergliederung des Stammes. „Sippe“ ist hier genauer als das modern oft enger verstandene „Familie“.
- source_word: לְיִמְנָה / לְיִשְׁוִי / לִבְרִיעָה
  choice: Zu Jimna / zu Jischwi / zu Beria
  rationale: Das präfigierte ל ordnet jede Sippe ihrem namensgebenden Vorfahren zu. „Zu … gehörte“ gibt diese Zuordnung in natürlichem Deutsch wieder, ohne eine über den Text hinausgehende Abstammungsformel einzuführen.
- source_word: מִשְׁפַּחַת הַיִּמְנָה
  choice: die Sippe der Jimniter
  rationale: Die hebräische Bildung bezeichnet die nach Jimna benannte Sippengruppe; „Jimniter“ bildet diese Herkunftsbezeichnung knapp nach.
- source_word: מִשְׁפַּחַת הַיִּשְׁוִי
  choice: die Sippe der Jischwiter
  rationale: Die Form ist eine von Jischwi abgeleitete Gruppenbezeichnung. Die deutsche Wiedergabe hält den Namen des masoretischen Textes erkennbar.
- source_word: מִשְׁפַּחַת הַבְּרִיעִי
  choice: die Sippe der Beriiter
  rationale: „Beriiter“ gibt die hebräische Herkunftsbezeichnung בְּרִיעִי unmittelbar wieder und unterscheidet sie zugleich vom Personennamen Beria.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Listenstil in modernem Standarddeutsch. Die wiederholte Zuordnungsformel des Hebräischen bleibt erkennbar, wird aber durch nur einmal gesetztes „gehörte“ idiomatisch und gut lesbar gestaltet.
