  text: וַ/יִּהְי֣וּ בְנֵי פֶ֔רֶץ לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרֹנִ֑י לְ/חָמ֕וּל מִשְׁפַּ֖חַת הֶ/חָמוּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: de
  text: 'Die Söhne Perez'' waren: Von Hezron: die Sippe der Hezroniter; von Hamul: die Sippe der Hamuliter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: In der genealogischen Zählungsformel dient היה als einfache Kopula zur Einführung der aufgeführten Söhne und ihrer Sippen. „Waren“ ist im Deutschen natürlich und formnah.
- source_word: בְנֵי
  choice: Söhne von
  rationale: Hier werden die männlichen Linienbegründer genannt, von denen die Sippen abstammen. „Söhne“ bewahrt die konkrete genealogische Form des Hebräischen.
- source_word: פֶרֶץ
  choice: Perez
  rationale: Gebräuchliche moderne Wiedergabe des hebräischen Personennamens.
- source_word: לְחֶצְרֹן
  choice: von Hezron
  rationale: Das Präfix לְ kennzeichnet in dieser Zählungsformel die Zuordnung beziehungsweise Abstammung. „Von Hezron“ gibt diese Beziehung knapp und idiomatisch wieder.
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: מִשְׁפָּחָה bezeichnet im Zählungskontext des Buches Numeri eine verwandtschaftliche Untereinheit innerhalb eines Stammes. „Sippe“ unterscheidet diese Gruppe von der modernen Kernfamilie und ist allgemein verständlich.
- source_word: הַחֶצְרֹנִי
  choice: der Hezroniter
  rationale: Die gentilizische Form bezeichnet die von Hezron hergeleitete Gruppe. Der deutsche Gruppenname „Hezroniter“ passt zur Zählungsformel.
- source_word: לְחָמוּל
  choice: von Hamul
  rationale: Wie bei Hezron zeigt לְ die genealogische Zuordnung beziehungsweise Abstammung an.
- source_word: הֶחָמוּלִי
  choice: der Hamuliter
  rationale: Die gentilizische Form bezeichnet die von Hamul hergeleitete Gruppe; „Hamuliter“ ist die natürliche deutsche Gruppenbezeichnung.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallele Satzstruktur und die genealogische Formel des Hebräischen bleiben sichtbar; „Sippe“ wird als präzise und verständliche Bezeichnung der verwandtschaftlichen Untergruppe verwendet.
