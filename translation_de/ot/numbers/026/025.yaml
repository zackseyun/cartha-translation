  text: אֵ֛לֶּה מִשְׁפְּחֹ֥ת יִשָּׂשכָ֖ר לִ/פְקֻדֵי/הֶ֑ם אַרְבָּעָ֧ה וְ/שִׁשִּׁ֛ים אֶ֖לֶף וּ/שְׁלֹ֥שׁ מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/025.yaml
  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: de
  text: 'Das sind die Sippen Issachars, nach der Zahl ihrer Erfassten[a]: 64.300.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihrer Zahl“ oder „nach ihrer Erfassung“. Der hebräische Ausdruck bezieht sich auf die bei der Volkszählung registrierten Angehörigen dieser Sippen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Der pluralische Demonstrativausdruck eröffnet einen zusammenfassenden verblosen Satz; im Deutschen wird die Kopula natürlich ergänzt.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Stammes- und Volkszählungskontext bezeichnet das Wort größere verwandtschaftliche Gruppen innerhalb eines Stammes; „Sippen“ ist hier genauer als „Familien“.
- source_word: יִשָּׂשכָר
  choice: Issachar
  rationale: Die im Deutschen etablierte Form des Stammes- und Personennamens.
- source_word: לִפְקֻדֵיהֶם
  choice: nach der Zahl ihrer Erfassten
  rationale: Die Form von פקד mit Präposition und Suffix verweist auf die bei der Volkszählung registrierten Angehörigen dieser Sippen. Die Wiedergabe bleibt nahe an den gezählten Personen und klingt zugleich verständlich; die mögliche abstraktere Deutung wird in der Fußnote bewahrt.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: '64.300'
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise wiedergegeben und bewahrt den exakten Wert von vierundsechzigtausenddreihundert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sippen“ wahrt die soziale Gliederung des Zählungsberichts; „Erfasste“ vermeidet eine unnötige militärische Zuspitzung und bleibt für heutige Leser verständlich.
