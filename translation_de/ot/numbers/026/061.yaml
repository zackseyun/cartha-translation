source:
  edition: WLC
  text: וַ/יָּ֥מָת נָדָ֖ב וַ/אֲבִיה֑וּא בְּ/הַקְרִיבָ֥/ם אֵשׁ זָרָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: de
  text: Nadab und Abihu aber starben, als sie fremdes Feuer[a] vor Jahwe darbrachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unerlaubtes Feuer. Der hebräische Ausdruck bezeichnet hier Feuer, das für die Darbringung vor Jahwe nicht vorgesehen oder zugelassen war.'
    reason: lexikalische Alternative und kontextuelle Erläuterung
lexical_decisions:
- source_word: וַיָּמָת
  choice: starben
  rationale: Das Verb steht im Hebräischen im Singular vor dem zusammengesetzten Subjekt »Nadab und Abihu«. Im Deutschen verlangt das mehrteilige Subjekt den Plural.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadab und Abihu
  rationale: Die Personennamen werden in ihrer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בְּהַקְרִיבָם
  choice: als sie … darbrachten
  rationale: Die Präposition בְּ mit Infinitivus constructus und Suffix bezeichnet hier den Zeitpunkt beziehungsweise Anlass. »Darbringen« entspricht dem kultischen Zusammenhang.
- source_word: אֵשׁ זָרָה
  choice: fremdes Feuer
  rationale: Die formal nahe Wiedergabe bewahrt die Bildsprache und die Bedeutungsbreite von זָרָה. Im kultischen Zusammenhang bezeichnet der Ausdruck Feuer, das für diese Darbringung nicht vorgesehen oder zugelassen war; dies wird in der Fußnote erläutert.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי wird im räumlich-kultischen Sinn mit »vor« wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«.
- source_word: וַ
  choice: aber
  rationale: Das einleitende Waw hebt diese Todesnotiz als Gegensatz beziehungsweise Ausnahme innerhalb des genealogischen Zusammenhangs hervor. Die Nachstellung von »aber« ist im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Eigenname wird erkennbar als Gottesname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֵשׁ זָרָה im kultischen Zusammenhang
  choice: fremdes Feuer mit erläuternder Fußnote
  alternative: unerlaubtes Feuer
  rationale: »Fremdes Feuer« wahrt die lexikalische Spannung des hebräischen Ausdrucks; die Alternative macht dessen kontextuelle Bedeutung deutlicher, legt sie jedoch bereits im Haupttext stärker aus.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Todesnotiz und ihre genealogische Kontrastwirkung bleiben erhalten; kultische Fachsprache wird sparsam und verständlich eingesetzt.
