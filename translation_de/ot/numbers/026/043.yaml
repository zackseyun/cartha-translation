base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/043.yaml
  text: All the families of the Shuhamites[a], according to those numbered among them, were sixty-four thousand four hundred.
translation:
  language: de
  text: Alle Sippen[a] der Schuhamiter zählten nach der Musterung 64.400.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Großfamilien“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Alle
  rationale: Gibt die Gesamtheit der im vorherigen Zusammenhang genannten Sippen knapp und genau wieder.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Der Ausdruck bezeichnet im Stammes- und Volkszählungskontext größere genealogische Familienverbände; „Sippen“ ist hier präziser als das im heutigen Deutsch oft enger verstandene „Familien“.
- source_word: הַשּׁוּחָמִי
  choice: der Schuhamiter
  rationale: Das Gentiliz bezeichnet die von Schuham abstammende Gruppe; die deutsche Namensform mit der Gruppenendung „-iter“ bewahrt diesen Bezug.
- source_word: לִפְקֻדֵיהֶם
  choice: nach der Musterung
  rationale: Die Wendung bezieht sich auf die amtliche Erfassung beziehungsweise Zählung der Gemusterten und bezeichnet die Grundlage der angegebenen Gesamtzahl.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '64.400'
  rationale: Die Zahl wird in üblicher moderner deutscher Schreibweise wiedergegeben und bleibt exakt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, knappes Standarddeutsch mit dem im alttestamentlichen Stammeskontext verständlichen Begriff „Sippen“. Die elliptische Zahlenangabe bleibt wie im Hebräischen ohne ergänztes „Männer“, um keine im Vers selbst unausgesprochene Präzisierung einzutragen.
