  text: 'Das sind die Sippen der Söhne Gads nach der Zahl ihrer Gemusterten: 40.500.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Bezeichnet hier die genealogischen Untergruppen des Stammes; „Sippen“ ist im Deutschen natürlich und unterscheidet sie vom gesamten Stamm.
- source_word: בְּנֵי גָד
  choice: Söhne Gads
  rationale: Bewahrt die genealogische Ausdrucksweise des Hebräischen; gemeint sind Gads Nachkommen.
- source_word: לִפְקֻדֵיהֶם
  choice: nach der Zahl ihrer Gemusterten
  rationale: פְּקוּדִים bezeichnet im Zählungskontext die erfassten beziehungsweise gemusterten Männer; die Formulierung gibt die Zuordnung zur ermittelten Gesamtzahl idiomatisch wieder.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '40.500'
  rationale: Gibt die hebräische Zahl „vierzigtausend und fünfhundert“ in geläufiger deutscher Zahlenschreibung wieder.
