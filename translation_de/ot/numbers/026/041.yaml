  text: These were the sons of Benjamin by their clans, and those numbered from them were forty-five thousand six hundred.
translation:
  language: de
  text: Das waren die Nachkommen Benjamins nach ihren Sippen. Die Zahl der Gemusterten betrug 45.600.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי בִנְיָמִן
  choice: die Nachkommen Benjamins
  rationale: בנים bezeichnet in diesem genealogischen und statistischen Zusammenhang nicht nur unmittelbare Söhne, sondern die von Benjamin abstammenden Angehörigen des Stammes.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת sind hier die Untergliederungen des Stammes; »Sippen« ist im Deutschen präzise und im Kontext der Volkszählung natürlich.
- source_word: וּפְקֻדֵיהֶם
  choice: Die Zahl der Gemusterten
  rationale: Das passive Partizip von פקד bezeichnet die bei der Zählung erfassten beziehungsweise gemusterten Männer. Die Formulierung gibt den statistischen Sinn idiomatisch wieder.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '45.600'
  rationale: Die hebräische Zahl lautet wörtlich »fünfundvierzigtausend und sechshundert«; Ziffern sind in dieser Zählung übersichtlich und eindeutig.
