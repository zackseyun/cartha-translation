  text: וַ/יִּהְי֥וּ בְנֵי בֶ֖לַע אַ֣רְדְּ וְ/נַעֲמָ֑ן מִשְׁפַּ֨חַת֙ הָֽ/אַרְדִּ֔י לְ/נַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽ/נַּעֲמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: de
  text: 'Und die Söhne Belas waren Ard und Naaman: von Ard stammt die Sippe der Arditer, von Naaman die Sippe der Naamaniter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Und … waren
  rationale: Die Form führt die genealogische Aufzählung fort; die schlichte Wiedergabe wahrt den Zusammenhang und fügt keine zusätzliche Hervorhebung ein.
- source_word: בְנֵי בֶלַע
  choice: die Söhne Belas
  rationale: בְּנֵי bezeichnet hier die namentlich genannten männlichen Nachkommen; der deutsche Genitiv klingt natürlich und bleibt nah am genealogischen Ausdruck.
- source_word: אַרְדְּ וְנַעֲמָן
  choice: Ard und Naaman
  rationale: Die Personennamen werden in geläufiger deutscher Transliteration wiedergegeben.
- source_word: מִשְׁפַּחַת
  choice: Sippe
  rationale: Im Kontext der Volkszählung bezeichnet das Wort eine größere verwandtschaftliche Untergruppe innerhalb eines Stammes; „Sippe“ ist im Deutschen präziser als „Familie“.
- source_word: הָאַרְדִּי
  choice: die Arditer
  rationale: Das hebräische Zugehörigkeitsadjektiv bezeichnet die von Ard hergeleitete Sippe; die deutsche Gruppenbezeichnung gibt dies verständlich wieder.
- source_word: לְנַעֲמָן
  choice: von Naaman
  rationale: Das לְ kennzeichnet in dieser genealogischen Formel die Zuordnung beziehungsweise Abstammung.
- source_word: הַנַּעֲמִי
  choice: die Naamaniter
  rationale: Das Zugehörigkeitsadjektiv wird transparent vom Namen Naaman abgeleitet und als Bezeichnung der Nachkommengruppe wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem sachlichen Charakter einer genealogischen Zählung. Das ergänzte Verb „stammt“ macht die im Hebräischen knappe Zuordnungsformel im Deutschen verständlich, ohne ihren Sinn auszuweiten.
