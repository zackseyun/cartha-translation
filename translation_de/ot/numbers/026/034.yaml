  text: אֵ֖לֶּה מִשְׁפְּחֹ֣ת מְנַשֶּׁ֑ה וּ/פְקֻ֣דֵי/הֶ֔ם שְׁנַ֧יִם וַ/חֲמִשִּׁ֛ים אֶ֖לֶף וּ/שְׁבַ֥ע מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/034.yaml
  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: de
  text: "Das sind die Sippen Manasses, und die bei ihnen Gez\0e4hlten[a] waren 52.700."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Erfassten“ oder „ihre Gemusterten“. Die hebräische Volkszählungsformel verwendet eine Form von פקד und bezeichnet die gezählten oder registrierten Personen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Die deiktische Pluralform leitet die zusammenfassende Aussage ein; das Präsens entspricht der hebräischen Form und ist in einer Aufzählung natürlich.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Kontext der Volkszählung bezeichnet das Wort größere verwandtschaftliche Untergruppen eines Stammes, nicht lediglich einzelne Hausfamilien.
- source_word: מְנַשֶּׁה
  choice: Manasses
  rationale: Verwendet die im Deutschen etablierte biblische Namensform im Genitiv nach „Sippen“.
- source_word: וּפְקֻדֵיהֶם
  choice: und ihre Gemusterten
  rationale: Die Form von פקד bezeichnet hier die im Rahmen der Volkszählung erfassten beziehungsweise aufgebotenen Personen. „Gemusterten“ bewahrt den amtlichen Zählungscharakter, ohne das im unmittelbaren Wortlaut nicht ausdrücklich stehende „Männer“ hinzuzufügen.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: '52.700'
  rationale: Gibt die hebräische Zahlenfolge idiomatisch und mit demselben Gesamtwert wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sippen“ bildet die soziale Gliederung im Zählungskontext präziser ab als das häuslicher klingende „Familien“; „Gemusterte“ hält den amtlichen Charakter der Formel fest.
