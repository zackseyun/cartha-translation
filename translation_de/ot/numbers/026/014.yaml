lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Das deiktische Pluralpronomen eröffnet als präsentische Nominalklausel die Zusammenfassung der Zählung; „Das sind“ ist im modernen Deutschen natürlich.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Stammes- und Volkszählungskontext bezeichnet der Ausdruck verwandtschaftliche Untergruppen eines Stammes; „Sippen“ unterscheidet sie klar von einzelnen Familien.
- source_word: הַשִּׁמְעֹנִי
  choice: der Simeoniter
  rationale: Das substantivierte Gentiliz im Singular wird kollektiv gebraucht; der deutsche Plural „Simeoniter“ gibt diesen Bezug natürlich wieder.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: '22.200'
  rationale: Die hebräische Gesamtzahl wird nach üblicher deutscher Zahlenschreibung knapp und eindeutig wiedergegeben.
