lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Die Söhne Judas
  rationale: Der Status constructus bezeichnet in dieser genealogischen Aufzählung Judas leibliche Söhne; die Genitivform ist im Deutschen natürlich und präzise.
- source_word: עֵר וְאוֹנָן
  choice: Er und Onan
  rationale: Die Eigennamen werden in ihren im Deutschen geläufigen biblischen Formen wiedergegeben; die Konjunktion verbindet beide Namen schlicht.
- source_word: וַיָּמָת
  choice: Doch … starben
  rationale: Die Verbform berichtet ein vergangenes Ereignis. „Doch“ gibt den im Zusammenhang naheliegenden Gegensatz zwischen der Nennung der Söhne und ihrem Tod wieder; der Plural folgt dem zusammengesetzten Subjekt.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Dies ist eine natürliche deutsche Wiedergabe der geografischen Wendung und bewahrt Kanaan als Ortsnamen.
