base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: de
  text: 'Das waren die Sippen Levis: die Sippe der Libniter[a], die Sippe der Hebroniter, die Sippe der Machliter, die Sippe der Muschiter und die Sippe der Korachiter. Und Kehat zeugte Amram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Großfamilien“ beziehungsweise „Familienverbände“; das hebräische Wort מִשְׁפָּחָה bezeichnet hier eine verwandtschaftliche Untergruppe innerhalb des Stammes.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: Sippen / die Sippe der
  rationale: Im Kontext der Volkszählung bezeichnet מִשְׁפָּחָה eine verwandtschaftliche Untergruppe innerhalb eines Stammes. „Sippe“ unterscheidet diese Einheit deutlicher von der modernen Kleinfamilie und ist in genealogischem Zusammenhang verständlich.
- source_word: לֵוִי
  choice: Levi
  rationale: Der Eigenname des Stammvaters wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: הַלִּבְנִי / הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  choice: Libniter / Hebroniter / Machliter / Muschiter / Korachiter
  rationale: Die adjektivisch-gentilizischen Formen bezeichnen die jeweiligen Nachkommengruppen. Deutsche Gruppenbezeichnungen auf „-iter“ geben diese Form knapp, parallel und traditionsgerecht wieder.
- source_word: וּקְהָת
  choice: Kehat
  rationale: Der Eigenname wird in geläufiger deutscher Transkription wiedergegeben. Die Konjunktion markiert hier den Übergang zur genealogischen Aussage; ein eigener deutscher Satz stellt diesen Zusammenhang natürlich dar, ohne ein zusätzliches „und“ zu erzwingen.
- source_word: הוֹלִד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischen Formeln das männliche Zeugen beziehungsweise Hervorbringen eines Nachkommen. „Zeugte“ ist präzise und im Deutschen zwar gehoben, aber nicht veraltet.
- source_word: אֶת עַמְרָם
  choice: Amram
  rationale: Die Akkusativpartikel אֶת bleibt unübersetzt; der Eigenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Der hebräische Nominalsatz enthält keine ausdrückliche Kopula. Das Präteritum passt zur rückblickenden Aufzählung; das deutsche Singularpronomen „das“ nimmt die folgende Gesamtliste idiomatisch auf.
