source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: de
  text: Doch unter diesen war kein Mann von denen, die Mose und Aaron, der Priester, bei der Zählung der Söhne Israels in der Wüste Sinai gezählt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Gemusterten Moses und Aarons, des Priesters, die die Söhne Israels in der Wüste Sinai zählten“.'
    reason: Die Anmerkung verdeutlicht die im Hebräischen verschachtelte Konstruktion und den Bezug des Relativsatzes auf Mose und Aaron.
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: Doch unter diesen
  rationale: Die Präposition wird mit „unter“ wiedergegeben; das vorangestellte ו trägt im Zusammenhang wahrscheinlich einen Gegensatz zum vorherigen Vers und wird daher natürlich mit „doch“ übersetzt.
- source_word: לֹא הָיָה אִישׁ
  choice: war kein einziger Mann
  rationale: Die deutsche Wendung gibt die Nichtexistenz eines Angehörigen der früher gezählten Männer nachdrücklich und idiomatisch wieder.
- source_word: מִפְּקוּדֵי
  choice: von denen, die … gezählt hatten
  rationale: Das Partizip bezeichnet die beim früheren Zensus erfassten Personen; die Formulierung vermeidet eine abstrakte Wiedergabe als bloße Zählung.
- source_word: מֹשֶׁה וְאַהֲרֹן הַכֹּהֵן
  choice: Mose und der Priester Aaron
  rationale: Die Apposition „der Priester“ gehört zu Aaron. „Hohepriester“ wird nicht ergänzt, da im Hebräischen nur הַכֹּהֵן steht.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: als sie … musterten
  rationale: Das relative אֲשֶׁר kann hier den Vorgang näher bestimmen; „mustern“ trifft פקד im Kontext einer amtlichen Erfassung wehrfähiger Männer und vermeidet eine schwerfällige Wiederholung von „zählen“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche familiäre Bezeichnung wird bewahrt, zumal der Kontext ausdrücklich die gezählten Männer betrifft.
- source_word: בְּמִדְבַּר סִינָי
  choice: in der Wüste Sinai
  rationale: „Wüste Sinai“ ist eine klare, etablierte deutsche Wiedergabe der hebräischen Konstruktverbindung.
theological_decisions:
- issue: Geschlechtsspezifische Sprache bei אִישׁ und בְּנֵי יִשְׂרָאֵל
  choice: „Mann“ und „Söhne Israels“ im Haupttext beibehalten
  alternative: „Mensch“ beziehungsweise „Israeliten“ oder „Volk Israel“
  rationale: Der Vers bezieht sich auf die männlichen Angehörigen der früheren Zensusgeneration. Die maskuline Aussage des Ausgangstextes soll deshalb nicht neutralisiert werden.
- issue: Bezeichnung Aarons
  choice: „der Priester“
  alternative: „der Hohepriester“
  rationale: Auch wenn Aaron das hohepriesterliche Amt ausübte, enthält dieser Vers nur die Bezeichnung הַכֹּהֵן; eine Präzisierung zu „Hohepriester“ wäre eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ markiert den im Kontext naheliegenden Gegensatz; „kein einziger Mann“ bewahrt die emphatische Singularform. Die Satzstruktur wurde behutsam geglättet, ohne inhaltliche Ergänzungen.
