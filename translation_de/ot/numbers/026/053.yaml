base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: de
  text: Diesen soll das Land als Erbbesitz zugeteilt werden, entsprechend der Zahl der Namen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entsprechend der Zahl der Personen“; wörtlich: „entsprechend der Zahl der Namen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: Unter diese
  rationale: Die Präposition ל bezeichnet hier die Empfänger der Landverteilung. Im Deutschen gibt „unter diese“ den Verteilungssinn natürlich wieder.
- source_word: תֵּחָלֵק
  choice: soll ... aufgeteilt werden
  rationale: Der Nifal-Imperfekt von חלק bezeichnet das passive Aufteilen beziehungsweise Zuteilen; die Soll-Form entspricht dem anweisenden Kontext.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang mit der Landzuteilung an Israel ist „das Land“ die übliche und sachlich passende Wiedergabe.
- source_word: בְּנַחֲלָה
  choice: als Erbbesitz
  rationale: נחלה bezeichnet einen erblich zugewiesenen Besitzanteil. „Erbbesitz“ bewahrt sowohl den rechtlichen als auch den Zuteilungsaspekt.
- source_word: בְּמִסְפַּר
  choice: entsprechend der Zahl
  rationale: Die Präposition בְּ bezeichnet hier Maßstab oder Verhältnis der Verteilung; „entsprechend der Zahl“ ist im Deutschen klar und idiomatisch.
- source_word: שֵׁמוֹת
  choice: Namen
  rationale: Die wörtliche Bedeutung „Namen“ bleibt im Haupttext erhalten; im Volkszählungskontext sind damit die gezählten Personen gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am Hebräischen, während „aufgeteilt“ und „Erbbesitz“ den Verteilungs- und Besitzkontext verständlich ausdrücken.
