  terminology: »Sippe« trifft die hier gemeinte soziale Untergliederung präziser als »Familie« und wird konsequent verwendet. »Schuham« und »Schuhamiter« sind konsistent gebildet. Die Fußnote ist korrekt verankert und erklärt die gewählte Wiedergabe ohne den Haupttext zu überladen.
