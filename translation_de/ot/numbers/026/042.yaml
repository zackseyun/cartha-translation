base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: de
  text: 'Das waren die Nachkommen Dans[a] nach ihren Sippen: von Schuham die Sippe der Schuhamiter. Das waren die Sippen Dans nach ihren Sippen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Dans«; in dieser genealogischen Zählungsformel kann »Söhne« die Stammesnachkommen insgesamt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Die Vergangenheitsform fügt sich natürlich in den berichtenden Zusammenhang der Volkszählung ein und bewahrt die hinweisende Funktion.
- source_word: בְנֵי דָן
  choice: die Nachkommen Dans
  rationale: Wörtlich steht hier »die Söhne Dans«; in dieser genealogischen Zählungsformel bezeichnet der Ausdruck jedoch die Stammesnachkommen insgesamt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederung eines Stammes; »Sippe« gibt diese Ebene präziser wieder als das allgemeinere »Familie«.
- source_word: לְשׁוּחָם
  choice: von Schuham
  rationale: Das Präfix לְ kennzeichnet in der genealogischen Formel die Zuordnung zum Stammvater einer Sippe; »von Schuham« ist im Deutschen knapp und verständlich.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: die Sippe der Schuhamiter
  rationale: Die Verbindung bezeichnet kollektiv die nach Schuham benannte Sippe.
- source_word: מִשְׁפְּחֹת דָּן
  choice: die Sippen Dans
  rationale: Die Formulierung gibt die zusammenfassende Wendung direkt wieder und hält die Bezeichnung »Sippen« im ganzen Vers einheitlich.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: Die Wiederholung des hebräischen Ausdrucks wird trotz ihrer Schwerfälligkeit beibehalten, da sie zum formelhaften Stil des Zählungsberichts gehört.
