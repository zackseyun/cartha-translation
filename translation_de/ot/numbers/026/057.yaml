base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: de
  text: 'Und dies waren die Erfassten[a] des Stammes Levi nach ihren Sippen: von Gerschon die Sippe der Gerschoniter, von Kehat die Sippe der Kehatiter, von Merari die Sippe der Merariter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gezählten“ beziehungsweise „die Registrierten“. Das hebräische Wort bezeichnet die bei der Zählung erfassten Personen, nicht nur den Vorgang der Zählung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: die Gemusterten
  rationale: Die Form bezeichnet konkret die bei der Zählung erfassten Personen. „Gemusterte“ bewahrt diesen Personenbezug und passt zum Kontext der Volkszählung.
- source_word: הַלֵּוִי
  choice: Levis
  rationale: Der Singular bezeichnet hier Levi als Stammvater beziehungsweise Stammesbezeichnung. Der Genitiv „Levis“ gibt die Zugehörigkeit knapp und natürlich wieder, ohne den Ausdruck vorschnell in „Leviten“ aufzulösen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet in diesem Zählungs- und Stammeskontext größere Verwandtschaftsverbände, nicht moderne Kleinfamilien. „Sippen“ bildet diese Gliederung sachgerecht ab.
- source_word: לְגֵרְשׁוֹן
  choice: von Gerschon
  rationale: Das Präfix לְ kennzeichnet in dieser Aufzählung die Zuordnung beziehungsweise Abstammung. „Von Gerschon“ lässt die knappe genealogische Struktur bestehen.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי
  choice: die Sippe der Gerschoniter
  rationale: Das Gentiliz bezeichnet die von Gerschon hergeleitete Gruppe; der deutsche Plural „Gerschoniter“ gibt den kollektiven Sinn natürlich wieder.
- source_word: לִקְהָת
  choice: von Kehat
  rationale: Wie bei Gerschon führt לְ die zugehörige Abstammungsgruppe ein.
- source_word: מִשְׁפַּחַת הַקְּהָתִי
  choice: die Sippe der Kehatiter
  rationale: Das Gentiliz bezeichnet die von Kehat abstammende Sippengruppe.
- source_word: לִמְרָרִי
  choice: von Merari
  rationale: Die wiederholte Konstruktion ordnet die folgende Sippe Merari zu.
- source_word: מִשְׁפַּחַת הַמְּרָרִי
  choice: die Sippe der Merariter
  rationale: Das Gentiliz bezeichnet kollektiv die von Merari abstammende Sippe.
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: „Und“ wahrt die Verbindung zum vorausgehenden Zählungsbericht; das Präsens ist in einer identifizierenden Listenformel im Deutschen natürlich.
