  variant: modern standard German
source:
  edition: WLC
  text: רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל בְּנֵ֣י רְאוּבֵ֗ן חֲנוֹךְ֙ מִשְׁפַּ֣חַת הַ/חֲנֹכִ֔י לְ/פַלּ֕וּא מִשְׁפַּ֖חַת הַ/פַּלֻּאִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: de
  text: 'Ruben, der Erstgeborene Israels: die Söhne Rubens[a]: von Henoch die Sippe der Henochiter; von Pallu die Sippe der Palluiter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne“ kann hier im weiteren genealogischen Sinn auch „Nachkommen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: der Erstgeborene Israels
  rationale: Die Status- und Verwandtschaftsbezeichnung wird eng am hebräischen Konstrukt wiedergegeben; „Sohn“ ist im Deutschen nicht eigens hinzuzufügen.
- source_word: בְּנֵי רְאוּבֵן
  choice: die Söhne Rubens
  rationale: Die wörtliche genealogische Bezeichnung bleibt erhalten. Im Zählungszusammenhang kann sie zugleich die männlichen Nachkommen beziehungsweise Linien Rubens umfassen.
- source_word: חֲנוֹךְ
  choice: Henoch
  rationale: Die im Deutschen gebräuchliche biblische Namensform wird verwendet.
- source_word: מִשְׁפַּחַת
  choice: Sippe
  rationale: Gemeint ist hier ein verwandtschaftlicher Unterverband innerhalb des Stammes; „Sippe“ ist präziser als das enger verstandene „Familie“.
- source_word: הַחֲנֹכִי
  choice: die Henochiter
  rationale: Die Gentilform bezeichnet die von Henoch hergeleitete Sippe und wird mit der üblichen deutschen Gruppenbezeichnung wiedergegeben.
- source_word: לְפַלּוּא
  choice: von Pallu
  rationale: Das Präfix לְ führt in dieser genealogischen Aufzählung den Sippengründer beziehungsweise die von ihm ausgehende Linie ein; „von“ gibt diese Beziehung knapp wieder.
- source_word: הַפַּלֻּאִי
  choice: die Palluiter
  rationale: Die Gentilform bezeichnet die von Pallu hergeleitete Sippe; „Palluiter“ folgt der üblichen deutschen Bildung.
theological_decisions: []
translation_notes:
  register: Knappe, listenartige Genealogiesprache; die elliptische Struktur des Hebräischen bleibt gewahrt. Die Namensformen entsprechen dem üblichen deutschen Bibelgebrauch.
