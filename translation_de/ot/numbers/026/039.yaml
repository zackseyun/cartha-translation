  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: de
  text: 'Von Schufam[a]: die Sippe der Schufamiter; von Hufam: die Sippe der Hufamiter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Name lautet hier Schufam. In manchen Übersetzungstraditionen finden sich unter dem Einfluss anderer Textüberlieferungen oder paralleler Namenslisten verwandte Schreibweisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: Von Schufam
  rationale: Die Präposition לְ bezeichnet in dieser Zählungsformel die Zugehörigkeit beziehungsweise Abstammung. „Von“ gibt diese Beziehung im Deutschen knapp wieder; der Personenname wird lautnah als „Schufam“ wiedergegeben.
- source_word: מִשְׁפַּחַת
  choice: die Sippe der
  rationale: מִשְׁפָּחָה bezeichnet hier einen verwandtschaftlich bestimmten Unterverband innerhalb des Stammes. „Sippe“ ist genauer als die im heutigen Deutsch meist enger verstandene „Familie“.
- source_word: הַשּׁוּפָמִי
  choice: Schufamiter
  rationale: Die mit Artikel gebrauchte Herkunftsbezeichnung benennt kollektiv die von Schufam abgeleitete Sippe; der deutsche Plural auf „-iter“ entspricht der üblichen Bildung biblischer Gruppennamen.
- source_word: לְחוּפָם
  choice: von Hufam
  rationale: Wie im ersten Versglied kennzeichnet לְ die Zuordnung der Sippe zu ihrem Stammvater. Der Name wird lautnah als „Hufam“ transliteriert.
- source_word: הַחוּפָמִי
  choice: Hufamiter
  rationale: Die Herkunftsbezeichnung benennt kollektiv die Nachkommen beziehungsweise Sippenangehörigen Hufams und wird entsprechend als deutscher Gruppenname wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappes, listenartiges Deutsch bewahrt die nominale Zählungsformel des Hebräischen. „Sippe“ ist gegenwärtig verständlich und bildet die soziale Untergliederung genauer ab als „Familie“; die Personennamen und davon abgeleiteten Gruppennamen werden einheitlich transliteriert.
