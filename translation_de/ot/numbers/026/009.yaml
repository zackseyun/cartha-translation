source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: de
  text: Und die Söhne Eliabs waren Nemuël, Datan und Abiram. Das sind Datan und Abiram, die Berufenen der Gemeinde[a], die in der Gemeinschaft Korachs gegen Mose und Aaron stritten, als sie gegen Jahwe stritten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ausgewählten Männer der Gemeinde“.'
    reason: Lexikalische Alternative zu קרואי העדה, das sowohl gerufene beziehungsweise einberufene als auch ausgewählte oder anerkannte Männer bezeichnen kann.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne Eliabs waren
  rationale: In der genealogischen Aufzählung bezeichnet בנים männliche Nachkommen. Das ergänzte „waren“ ergibt im Deutschen einen vollständigen und natürlichen Satz.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: Das sind jener Datan und Abiram
  rationale: Das formal singularische הוּא dient hier der hervorhebenden Identifikation. „jener“ bewahrt den rückverweisenden Nachdruck, während „Das sind“ im Deutschen auf beide Männer bezogen werden kann.
- source_word: קרואי הָעֵדָה
  choice: die Berufenen der Gemeinde
  rationale: Das passive Partizip von קרא bedeutet wörtlich „Gerufene/Berufene“. Die knappe substantivische Wiedergabe bewahrt die mögliche Bedeutung als einberufene, anerkannte oder ausgewählte Männer, ohne sich auf eine einzige Deutung festzulegen.
- source_word: הָעֵדָה
  choice: der Gemeinde
  rationale: עֵדָה bezeichnet hier die Gemeinschaft Israels. „Gemeinde“ ist im deutschen Bibelregister verständlich und wahrt den kollektiven Sinn.
- source_word: הִצּוּ ... בְּהַצֹּתָם
  choice: die sich ... auflehnten, als sie sich ... auflehnten
  rationale: נצה bezeichnet feindseligen Streit beziehungsweise Widerstand. „sich auflehnen gegen“ gibt in diesem Kontext die offene Gegnerschaft natürlich wieder; die Wiederholung bewahrt die Wiederaufnahme derselben hebräischen Wurzel.
- source_word: בַּעֲדַת קֹרַח
  choice: in der Gemeinschaft Korachs
  rationale: Die Formulierung kennzeichnet ihre Verbindung mit Korachs Gruppe. „Gemeinschaft“ vermeidet hier eine missverständliche Wiederholung von „Gemeinde“ und fügt keine ausdrücklich genannten „Anhänger“ hinzu.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ wahrt seinen Charakter als Eigenname.
- issue: Bedeutung von קרואי העדה
  choice: die Berufenen der Gemeinde
  alternative: die ausgewählten Männer der Gemeinde
  rationale: Die hebräische Wendung kann Gerufene, Einberufene oder anerkannte beziehungsweise ausgewählte Vertreter bezeichnen. Der Haupttext bleibt nahe an der Wortform; die stärker deutende Möglichkeit steht in der Fußnote.
- issue: Charakter des Widerstands gegen Mose, Aaron und Jahwe
  choice: sich auflehnen gegen
  alternative: mit jemandem streiten
  rationale: Der Zusammenhang spricht für feindseligen, gemeinschaftlichen Widerstand. Die Formulierung hält zugleich fest, dass ihr Vorgehen gegen Mose und Aaron als Auflehnung gegen Jahwe bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensformen „Datan“, „Abiram“, „Mose“ und „Korach“ folgen geläufigen deutschen Bibelschreibungen; „Nemuël“ markiert die getrennte Vokalaussprache. Die hebräische Wiederholung von נצה wurde bewusst beibehalten.
