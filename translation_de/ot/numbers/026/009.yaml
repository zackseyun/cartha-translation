  verdict: revise
  source_fidelity: Die genealogische Einleitung, die Namen und die Wiederaufnahme von Datan und Abiram sind grundsätzlich zutreffend. „sich auflehnen“ ist für נצה jedoch stärker und deutender als nötig; das Verb bezeichnet Streit bzw. Gegnerschaft. Die Wiederholung sollte entsprechend neutral wiedergegeben werden.
  naturalness: „Das sind jener Datan und Abiram“ ist im modernen Standarddeutsch grammatisch und idiomatisch nicht gelungen. „Das sind Datan und Abiram“ ist klar und wahrt die identifizierende Funktion von הוּא. Die übrige Satzstruktur bleibt im würdevollen Bibelregister natürlich.
  terminology: „Jahwe“, „Gemeinde“, die etablierten Namensformen und „die Berufenen der Gemeinde“ sind vertretbar. Letzteres bewahrt die knappe, nicht abschließend interpretierte Konstruktion קרואי העדה; die Fußnote bietet die stärker interpretierende Alternative angemessen an.
  issues:
  - severity: medium
    issue: Überdeutende Wiedergabe von נצה als „sich auflehnen“
    rationale: Das hebräische נצה meint hier Streit oder Gegnerschaft. „Sich auflehnen“ legt ausdrücklich Rebellion nahe und ist daher enger als der Wortlaut. „gegen ... streiten“ gibt die Aussage neutral wieder und erhält die Wiederholung derselben Wurzel.
  - severity: medium
    issue: Unidiomatische Formulierung „Das sind jener Datan und Abiram“
    rationale: Das demonstrative Singularwort „jener“ passt syntaktisch nicht zu der zweigliedrigen Namensgruppe. Die deutsche Pluralidentifikation „Das sind Datan und Abiram“ entspricht der resumptiv-identifizierenden Funktion von הוּא natürlich.
