source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: de
  text: als Erinnerungszeichen[a] für die Israeliten, damit kein Unbefugter[b], der nicht von Aarons Nachkommen stammt, sich nähert, um vor Jahwe Räucherwerk darzubringen, und damit er nicht wie Korach und seine Gemeinschaft wird, so wie Jahwe durch Mose[c] zu ihm[d] gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Gedenkzeichen« oder »Zeichen zur Erinnerung«.'
    reason: lexical_alternative
  - marker: b
    text: »Unbefugter« bezeichnet hier jemanden, der nicht zum priesterlichen Dienst berechtigt ist, nicht unbedingt einen Menschen fremder Herkunft.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »durch die Hand Mose«; gemeint ist: »durch Mose«.'
    reason: lexical_alternative
  - marker: d
    text: »Zu ihm« bezieht sich wahrscheinlich auf Aaron.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: Erinnerungszeichen
  rationale: Das Substantiv bezeichnet etwas, das dauerhaft an ein Geschehen oder eine Anordnung erinnert. »Erinnerungszeichen« ist im Deutschen verständlich und bewahrt sowohl den gegenständlichen als auch den erinnernden Sinn.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Israeliten
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet das ganze Volk, ohne die hebräische Wendung unnötig als »Söhne Israels« zu verengen.
- source_word: אִישׁ זָר
  choice: kein Unbefugter
  rationale: זָר bezeichnet hier im priesterlichen Zusammenhang jemanden, der zu diesem Dienst nicht berechtigt ist, nicht notwendig einen ethnischen Ausländer.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: der nicht von Aarons Nachkommen stammt
  rationale: Die Formulierung gibt die Abstammungsaussage von זֶרַע natürlich und präzise wieder.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: um vor Jahwe Räucherwerk darzubringen
  rationale: »Räucherwerk darbringen« ist eine natürliche kultische Formulierung und bringt die Handlung des Verbrennens beziehungsweise Aufsteigenlassens von Räucherwerk zum Ausdruck.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: und damit er nicht wird wie Korach und seine Gemeinschaft
  rationale: Die bewusst offene Vergleichsformulierung des Hebräischen bleibt erhalten; sie wird nicht ausdrücklich auf Korachs Schicksal oder Bestrafung festgelegt.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Wörtlich »durch die Hand Moses«; im Hebräischen ist dies eine geläufige Wendung für vermittelte Rede oder Handlung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben, sodass seine Funktion als geoffenbarter Bundesname sichtbar bleibt.
- issue: Bedeutung von זָר im priesterlichen Zusammenhang
  choice: Unbefugter
  alternative: Fremder
  rationale: Der Vers beschränkt den priesterlichen Räucherdienst auf Aarons Nachkommen. Eine ethnische Bedeutung wird hier nicht vorausgesetzt.
- issue: Sinn des Vergleichs mit Korach und seiner Gemeinschaft
  choice: nicht wird wie Korach und seine Gemeinschaft
  alternative: nicht dasselbe Schicksal erleidet wie Korach und seine Gemeinschaft
  rationale: Der Text nennt weder Schicksal noch Strafe ausdrücklich. Die gewählte Fassung wahrt die theologische und semantische Offenheit des Vergleichs.
- issue: Bezugswort des abschließenden Pronomens לוֹ
  choice: zu ihm
  alternative: zu Aaron
  rationale: Das hebräische Pronomen bleibt im Haupttext unaufgelöst; im Kontext ist Aaron wahrscheinlich, aber nicht ausdrücklich genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers setzt syntaktisch den vorausgehenden Zusammenhang fort und beginnt deshalb als Satzfragment mit »als«. Kultische Fachsprache wird verständlich gehalten; echte Mehrdeutigkeiten beim Korach-Vergleich und beim abschließenden Pronomen werden nicht im Haupttext aufgelöst.
