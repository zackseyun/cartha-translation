revisions:
- from: Da nahm Aaron es[a], wie Mose gesagt hatte, und lief mitten in die Versammlung hinein. Und siehe, die Plage hatte unter dem Volk bereits begonnen. Da legte er das Räucherwerk auf[b] und schaffte Sühne für das Volk.
  to: Da nahm Aaron es[a], wie Mose gesagt hatte, und lief mitten in die Versammlung hinein. Und siehe, die Plage hatte unter dem Volk bereits begonnen. Da gab er das Räucherwerk darauf[b] und erwirkte Sühne für das Volk.
  rationale: 'Die Revision beseitigt die im Deutschen offene Konstruktion „das Räucherwerk auflegen“, ohne den hebräischen Text stärker als nötig zu konkretisieren: Das anaphorische „darauf“ verweist nur auf den unmittelbar vorausgesetzten kultischen Gegenstand. „Erwirkte Sühne“ wahrt כפר als kultischen Fachausdruck und ist zugleich idiomatischer. Die Fußnoten sind an die revidierten Formulierungen angepasst.'
