source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: de
  text: Da nahm Aaron es[a], wie Mose gesagt hatte, und lief mitten in die Versammlung hinein. Und siehe, die Plage hatte unter dem Volk bereits begonnen. Da gab er das Räucherwerk darauf[b] und erwirkte Sühne für das Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Objekt wird im Hebräischen nicht genannt; aus dem vorherigen Vers ist die Räucherpfanne mit dem Feuer zu ergänzen.
    reason: implicit_object
  - marker: b
    text: 'Wörtlich: „gab“ oder „setzte das Räucherwerk“. „Darauf“ bezieht sich im Zusammenhang auf die zuvor genannte Räucherpfanne mit dem Feuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm Aaron es
  rationale: Das Verb bedeutet schlicht „nehmen“. Das im Hebräischen nicht ausdrücklich genannte Objekt wird im Deutschen durch „es“ aus dem vorherigen Vers aufgenommen, ohne es genauer festzulegen.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: wie Mose gesagt hatte
  rationale: דבר bezeichnet hier das Sprechen beziehungsweise Sagen. Obwohl Moses Worte als Anweisung dienen, wird nicht stärker mit „befohlen“ interpretiert.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: lief mitten in die Versammlung hinein
  rationale: רוץ bedeutet „laufen/rennen“, und תוך bezeichnet die Mitte. „Versammlung“ gibt קהל als das versammelte Volk wieder, ohne den Begriff kirchlich einzuengen.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die Wendung lenkt die Aufmerksamkeit nachdrücklich und anschaulich auf die unerwartete Lage. „Und siehe“ bewahrt diese erzählerische Signalwirkung in würdigem Deutsch.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: die Plage hatte unter dem Volk bereits begonnen
  rationale: נגף bezeichnet in diesem Zusammenhang die tödliche Plage. Das Plusquamperfekt macht deutlich, dass sie beim Eintreffen Aarons schon eingesetzt hatte; „bereits“ verdeutlicht diesen zeitlichen Zusammenhang idiomatisch.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: Da legte er das Räucherwerk auf
  rationale: נתן hat die breite Bedeutung „geben, setzen, legen“. „Auflegen“ gibt im Kontext die konkrete Handlung an der Räucherpfanne wieder, ohne sie bereits mit dem deutenderen Verb „opfern“ zu bezeichnen.
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: und schaffte Sühne für das Volk
  rationale: כפר ist im priesterlich-rituellen Zusammenhang ein gewichtiger Fachausdruck. „Sühne schaffen“ ist verständlich und wahrt den kultischen Sinn, ohne die genaue Wirkungsweise dogmatisch weiter zu bestimmen.
theological_decisions:
- issue: Wiedergabe des kultischen Verbs כפר
  choice: schaffte Sühne für das Volk
  alternative: vollzog die Sühne für das Volk; erwirkte Sühne für das Volk
  rationale: Die Formulierung bewahrt das theologische Gewicht der priesterlichen Handlung und ihren Bezug auf das Volk. Sie legt zugleich nicht genauer fest, ob der Akzent auf Entsühnung, Versöhnung oder Abwendung des Gerichts liegt.
- issue: Wiedergabe von קָהָל
  choice: Versammlung
  alternative: Gemeinde
  rationale: „Versammlung“ bezeichnet hier unmittelbar das zusammengekommene Volk Israel. „Gemeinde“ wäre ebenfalls möglich, könnte bei heutigen Lesern jedoch vorschnell kirchliche Vorstellungen wecken.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. „Und siehe“ ist bewusst als markierte, aber weiterhin verständliche Aufmerksamkeitspartikel erhalten. Die kultische Sprache bleibt prägnant und wird nicht konfessionell ausgedeutet.
