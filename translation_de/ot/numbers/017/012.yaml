  naturalness: „Da legte er das Räucherwerk auf“ bleibt im heutigen Standarddeutsch unvollständig, da „auflegen“ normalerweise eine ausgedrückte Bezugsfläche verlangt. „Darauf“ stellt den nötigen Kontextbezug zur zuvor genannten, aber im Hebräischen nur impliziten Räucherpfanne her. „Erwirkte Sühne“ ist zudem die idiomatischere moderne Wiedergabe als „schaffte Sühne“, ohne den kultischen Sinn zu verändern.
  terminology: „Plage“, „Versammlung“, „Räucherwerk“ und „Sühne“ sind passend. „Mose“ und „Aaron“ entsprechen der deutschen Namensform. Die Fußnoten erklären sowohl das elliptische Objekt als auch die konkrete, kontextuell erschlossene Bezugsfläche der Räucherhandlung.
