  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: de
  text: Und Mose tat, wie Jahwe ihm geboten hatte; so tat er.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat es
  rationale: עשה bedeutet allgemein „tun/machen“. Im Zusammenhang mit der Ausführung eines Gebots ist „tat es“ natürlich; das ergänzte „es“ verweist auf den zuvor gebotenen Vollzug.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: כַּאֲשֶׁר
  choice: genau so, wie
  rationale: Die Wendung bezeichnet die Übereinstimmung mit dem Gebot; „genau so, wie“ gibt den hervorgehobenen Gehorsam klar und idiomatisch wieder.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: צוה bezeichnet ein verbindliches Anordnen. Das Plusquamperfekt macht im Deutschen deutlich, dass das Gebot dem Vollzug vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die gebräuchliche deutsche Form.
- source_word: אֹתוֹ
  choice: ihm
  rationale: Die hebräische Akkusativkonstruktion nach צוה bezeichnet die Person, der etwas geboten wird; idiomatisches Deutsch verwendet hier den Dativ „ihm“.
- source_word: כֵּן
  choice: so
  rationale: כֵּן nimmt die vorausgehende Aussage bestätigend wieder auf.
- source_word: עָשָׂה
  choice: tat er es
  rationale: Die Wiederholung von עשה wird bewahrt, weil sie den vollständigen Vollzug des göttlichen Gebots nachdrücklich bestätigt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm als Gottesnamen. Die Wiedergabe „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die absichtliche Wiederholung von „tat“ bleibt erhalten; die leicht feierliche Satzstruktur spiegelt die nachdrückliche Gehorsamsformel des Hebräischen.
