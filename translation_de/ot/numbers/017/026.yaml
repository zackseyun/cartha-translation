  - severity: low
    issue: Die zweimalige Ergänzung von „es“ ist nicht erforderlich.
    rationale: Der hebräische Text nennt bei עָשָׂה kein ausdrückliches Objekt. Die deutsche Konstruktion „tat, wie … geboten hatte; so tat er“ ist vollständig und erhält die knappe Wiederholung unmittelbarer.
