  source_fidelity: 'Der hebräische Gehorsamssatz wird im Kern korrekt wiedergegeben: Mose handelt gemäß Jahwes Befehl, und die abschließende Wiederholung bestätigt dies nachdrücklich. „Genau“ ist jedoch gegenüber כַּאֲשֶׁר nicht erforderlich und legt eine stärkere explizite Präzisierung nahe, als der Wortlaut selbst ausdrückt. Die im Deutschen nicht nötigen Objektpronomen „es“ ergänzen zudem ein im Hebräischen nicht ausgedrücktes Objekt.'
  naturalness: „Und Mose tat, wie Jahwe ihm geboten hatte; so tat er.“ ist idiomatisches, modernes Standarddeutsch mit angemessen würdigem biblischem Register. Die Wiederholung von „tat“ und „so“ bewahrt die knappe, bestätigende Struktur des Hebräischen.
  terminology: „Mose“ ist die übliche deutsche Namensform. „Jahwe“ gibt das Tetragramm als Eigenname wieder. „geboten hatte“ ist für צִוָּה in diesem Kontext treffend; der deutsche Dativ „ihm“ entspricht der idiomatischen Rektion von „gebieten“.
