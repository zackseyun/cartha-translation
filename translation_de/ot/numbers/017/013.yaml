  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: de
  text: Und er stellte sich zwischen die Toten und die Lebenden, und die Plage wurde aufgehalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Und er stellte sich
  rationale: Das Verb עמד bedeutet hier, dass Aaron seinen Platz einnahm beziehungsweise sich hinstellte. „Er stellte sich“ ist im Deutschen natürlich und bringt die bewusste Positionierung zwischen den beiden Gruppen zum Ausdruck, ohne eine militärische Nuance hinzuzufügen.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und
  rationale: Die paarige Präposition bezeichnet die räumliche Stellung zwischen zwei Gruppen und wird direkt und idiomatisch mit „zwischen ... und“ wiedergegeben.
- source_word: הַמֵּתִים
  choice: die Toten
  rationale: Die substantivierte Form bezeichnet diejenigen, die bereits gestorben waren. „Die Toten“ ist die natürliche deutsche Entsprechung und bewahrt den scharfen Gegensatz.
- source_word: הַחַיִּים
  choice: die Lebenden
  rationale: Das substantivierte Adjektiv bezeichnet diejenigen, die noch lebten. „Die Lebenden“ entspricht der hebräischen Form und bildet einen klaren Gegensatz zu „die Toten“.
- source_word: וַתֵּעָצַר
  choice: wurde aufgehalten
  rationale: Die passive Form von עצר bezeichnet hier, dass das weitere Umsichgreifen der Plage gestoppt wurde. „Wurde aufgehalten“ bewahrt die passive Aussage und klingt in diesem Zusammenhang natürlich.
- source_word: הַמַּגֵּפָה
  choice: die Plage
  rationale: מגפה bezeichnet in diesem Kontext eine tödliche, als Gericht auftretende Plage. „Plage“ ist prägnant, traditionsnah und fügt keine über den Text hinausgehende Erklärung hinzu.
theological_decisions:
- issue: Bedeutung von מַגֵּפָה im Gerichtskontext
  choice: die Plage
  alternative: das Unheil; die Seuche
  rationale: Der unmittelbare Zusammenhang beschreibt ein von Gott ausgehendes tödliches Geschehen. „Plage“ wahrt dessen Schwere und den konventionellen biblischen Sinn, ohne die Art des Geschehens enger festzulegen, als es der hebräische Ausdruck verlangt.
translation_notes:
  register: Moderne, würdige Standardsprache mit engem Anschluss an die konkrete und kontrastreiche Formulierung des Hebräischen. Keine Fußnote erforderlich.
