revisions:
- from: Dann wird der Stab des Mannes, den ich erwähle, austreiben. So werde ich das Murren der Israeliten[a], mit dem sie gegen euch murren, von mir weg zum Verstummen bringen.
  to: Dann wird der Stab des Mannes, den ich erwähle, austreiben; und ich werde die Klagen der Israeliten[a], die sie gegen euch erheben, von mir wegnehmen.
  rationale: Die Revision ersetzt die unidiomatische räumlich-kausative Formulierung durch eine natürliche deutsche Wiedergabe, die מֵעָלַי weiterhin ausdrücklich berücksichtigt. Zugleich wird die abschließende Aussage, dass die Israeliten gegen „euch“ klagen, klar ausgedrückt. Die unterschiedliche Bezugnahme auf Gott („von mir“) und auf Mose und Aaron („gegen euch“) bleibt erhalten.
