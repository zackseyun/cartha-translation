  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: de
  text: Dann wird der Stab des Mannes, den ich erwähle, austreiben; und ich werde die Klagen der Israeliten[a], die sie gegen euch erheben, von mir wegnehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die Söhne Israels; gemeint ist das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Dann wird
  rationale: Gibt die zukunftsgerichtete Folgeformel im Deutschen natürlich und klar wieder.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: des Mannes, den ich erwähle
  rationale: Bewahrt das maskuline Singular und gibt die göttliche Auswahl des durch den Stab vertretenen Mannes idiomatisch wieder.
- source_word: מַטֵּהוּ יִפְרָח
  choice: der Stab … wird austreiben
  rationale: „Stab“ ist im Zusammenhang die natürliche Wiedergabe von מַטֶּה; „austreiben“ bezeichnet hier das sichtbare Hervorbringen neuen Wachstums, ohne die ausführlicheren Vorgänge des Folgeverses vorwegzunehmen.
- source_word: וַהֲשִׁכֹּתִי מֵעָלַי
  choice: werde ich … von mir weg zum Verstummen bringen
  rationale: Verbindet die verursachende Bedeutung „zur Ruhe bringen“ mit der räumlich formulierten Wendung מֵעָלַי und vermeidet es, diese stillschweigend nur als „gegen mich“ aufzulösen.
- source_word: תְּלֻנּוֹת
  choice: Murren
  rationale: Passt zur negativen, wiederholten Klage des Volkes und ermöglicht im Deutschen die erkennbare Verbindung mit dem folgenden Partizip.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Gibt die korporative Bedeutung in natürlichem modernem Deutsch wieder; die wörtliche Familienbezeichnung wird in der Fußnote genannt.
- source_word: אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם
  choice: mit dem sie gegen euch murren
  rationale: Bewahrt den fortdauernden Charakter des Partizips und die gegen Mose und Aaron gerichtete Beschwerde.
theological_decisions:
- issue: Bezug von מֵעָלַי und עֲלֵיכֶם
  choice: „von mir weg“ und zugleich „gegen euch“
  alternative: „das Murren gegen mich … beenden“
  rationale: 'Der Text verwendet zwei unterschiedliche Präpositionalfügungen. Die Übersetzung wahrt die Spannung: Gott entfernt das Murren von sich, während ausdrücklich gesagt wird, dass das Volk gegen Mose und Aaron murrt.'
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die natürliche deutsche Kollektivbezeichnung umfasst hier das Volk; eine Fußnote macht die wörtliche hebräische Form transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Murren“ bewahrt den biblischen Ernst, bleibt aber allgemein verständlich; die ungewöhnliche Formulierung „von mir weg zum Verstummen bringen“ erhält bewusst die räumliche Bildlichkeit und Mehrdeutigkeit des Hebräischen.
