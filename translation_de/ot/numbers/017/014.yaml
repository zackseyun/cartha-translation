base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: de
  text: Die Zahl derer, die durch die Plage starben, betrug 14.700, abgesehen von denen, die im Zusammenhang mit Korach[a] starben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen Korach“ oder „in der Angelegenheit Korachs“. Die Wendung verweist auf Todesfälle im Zusammenhang mit Korachs Auflehnung, ohne sie hier näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: betrug
  rationale: Die narrative Verbform leitet die abschließende Zahlenangabe ein. In Verbindung mit „Die Zahl derer“ gibt „betrug“ den Sinn im modernen Deutschen natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „Nun“ einzufügen.
- source_word: הַמֵּתִים בַּמַּגֵּפָה
  choice: derer, die durch die Plage starben
  rationale: Das substantivierte Partizip wird verständlich als Relativsatz wiedergegeben. „Durch die Plage“ bezeichnet die Plage als Todesursache; „an der Plage“ wäre ebenfalls möglich.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: '14.700'
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise wiedergegeben.
- source_word: מִלְּבַד
  choice: abgesehen von
  rationale: Die Formulierung zeigt, dass die zuvor im Zusammenhang mit Korach Gestorbenen nicht in der Zahl 14.700 enthalten sind.
- source_word: עַל דְּבַר קֹרַח
  choice: im Zusammenhang mit Korach
  rationale: Die hebräische Wendung kann einen ursächlichen Bezug oder allgemeiner die Angelegenheit Korachs bezeichnen. Die gewählte Formulierung bleibt natürlich und legt die genaue Art des Zusammenhangs nicht enger fest als der Ausgangstext.
theological_decisions:
- issue: Umfang und Art der mit Korach verbundenen Todesfälle
  choice: Die 14.700 Opfer der Plage werden von den zuvor im Zusammenhang mit Korach Gestorbenen unterschieden, ohne diese näher zu kategorisieren.
  alternative: „die wegen Korach starben“ oder „die in der Angelegenheit Korachs starben“
  rationale: Der Vers blickt auf das frühere Gericht im Umfeld Korachs zurück. Er unterscheidet beide Gruppen, bestimmt aber hier weder die genaue Ursächlichkeit noch einzelne Untergruppen ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur macht die Zählung klar und bewahrt zugleich die Bedeutungsbreite von עַל דְּבַר קֹרַח.
