  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das narrative Waw führt die Handlung fort; „sprach“ gibt דבר in der feierlichen Redeeinleitungsformel wieder und unterscheidet es von אמר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose sprechen“ ist im Deutschen natürlich und präzise.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion idiomatischer als das formelhafte „und sagte“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt diesen Namenscharakter; „der HERR“ ersetzt ihn durch einen Titel, während „Jehova“ auf einer späteren Mischlesung beruht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird natürlich deutsch mit einem Doppelpunkt wiedergegeben; der anschließende Redeinhalt folgt im nächsten Vers.
