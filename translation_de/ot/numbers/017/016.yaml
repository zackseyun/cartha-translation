  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/016.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Dann sprach Jahwe zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Dann sprach“ gibt den Fortgang in natürlichem Deutsch wieder und bewahrt den eigenen Sprechakt des Verbs דבר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Formulierung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlich und ohne das schwerfällige „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt; „Jehova“ beruht auf einer späteren Mischform.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet die hebräische Einleitungsformel לֵאמֹר idiomatisch ab; die eigentliche Rede folgt im nächsten Vers.
