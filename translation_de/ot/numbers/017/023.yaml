base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: de
  text: 'Am nächsten Tag ging Mose in das Zelt des Zeugnisses[a], und siehe, der Stab Aarons für das Haus Levi[b] hatte ausgeschlagen: Er hatte Blüten hervorgebracht, Blüten getrieben und trug reife Mandeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Zelt der Bezeugung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »für das Haus Levi«; der Stab stand für den Stamm beziehungsweise die Sippe Levi.'
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Am nächsten Tag
  rationale: Die natürliche moderne Zeitangabe gibt den folgenden Tag und den Erzählablauf präzise wieder.
- source_word: אֹהֶל הָעֵדוּת
  choice: das Zelt des Zeugnisses
  rationale: Die formale Wiedergabe bewahrt die rechtlich-bundestheologische Bedeutung von עֵדוּת; die mögliche Alternative „Zeugniszelt“ wäre kompakter, aber weniger transparent.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die traditionelle, weiterhin verständliche Wendung erhält die aufmerksamkeitslenkende und überraschende Kraft des hebräischen Erzählmarkers.
- source_word: פָּרַח
  choice: hatte ausgeschlagen
  rationale: „Ausschlagen“ beschreibt anschaulich den Beginn pflanzlichen Wachstums an dem Stab und lässt Raum für die anschließend genannten Entwicklungsstufen.
- source_word: מַטֵּה
  choice: Stab
  rationale: „Stab“ ist im Deutschen die klare und übliche Bezeichnung für den Gegenstand und wahrt zugleich das mögliche Wortspiel mit dem Stammesverband im weiteren Kontext.
- source_word: לְבֵית לֵוִי
  choice: für das Haus Levi
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Sozialbezeichnung und drückt aus, dass Aarons Stab Levi repräsentiert.
- source_word: וַיֹּצֵא פֶרַח
  choice: er hatte Knospen hervorgebracht
  rationale: Die Formulierung erhält eine erkennbare Wachstumsfolge. Das botanisch nicht völlig eindeutige פֶרַח wird hier im Zusammenspiel mit dem folgenden צִיץ als Knospenstadium verstanden.
- source_word: וַיָּצֵץ צִיץ
  choice: Blüten getrieben
  rationale: Die idiomatische deutsche Wendung gibt das Aufblühen wieder und unterscheidet diese Stufe von den zuvor genannten Knospen.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: Mandeln reifen lassen
  rationale: Die Formulierung bewahrt den Aspekt des Reifwerdens und damit den Höhepunkt der außergewöhnlich vollständigen Wachstumsfolge.
theological_decisions:
- issue: Bedeutung von עֵדוּת in der Bezeichnung des Heiligtums
  choice: Zelt des Zeugnisses
  alternative: Zelt des Zeugen / Zeugniszelt
  rationale: „Zeugnis“ erhält die rechtliche und bundesbezogene Spannung des Ausdrucks, ohne ihn ausdrücklich mit einer bestimmten Sache oder Lehrdeutung gleichzusetzen.
- issue: Funktion von Aarons Stab für Levi
  choice: für das Haus Levi
  alternative: vom Stamm Levi
  rationale: Die formale Fassung wahrt die Repräsentationsbeziehung des Stabes, ohne „Haus“ vorschnell ausschließlich als Stamm oder Sippe festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formaler Satzführung. „Und siehe“ wurde bewusst als markierter biblischer Erzählruf beibehalten. Die Abfolge Ausschlagen – Knospen – Blüten – reife Mandeln wird sprachlich klar dargestellt, ohne die botanische Terminologie stärker festzulegen, als es der hebräische Text erlaubt.
