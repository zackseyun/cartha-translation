    rationale: „hatte ausgeschlagen; er hatte ... hervorgebracht, Blüten getrieben und ... reifen lassen“ mischt Plusquamperfekt und Präteritum. Das Präteritum kann die aufeinanderfolgenden erzählten Vorgänge klar und einheitlich wiedergeben.
