source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: de
  text: 'Und es geschah: Als sich die Gemeinde gegen Mose und Aaron versammelte, da wandten sie sich dem Zelt der Begegnung zu, und siehe, die Wolke bedeckte es[a], und die Herrlichkeit Jahwes erschien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Suffix steht im Maskulinum Singular und bezieht sich am natürlichsten auf das Zelt der Begegnung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Gibt den hebräischen Erzählübergang wieder, ohne die altertümliche deutsche Wendung „es begab sich“ zu verwenden.
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: als sich die Gemeinde … versammelte
  rationale: Die Präposition ב mit dem Infinitiv bezeichnet hier den zeitlichen Umstand; der Nifal von קהל drückt das Sichversammeln aus.
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: Bezeichnet die israelitische Gemeinschaft als zusammengehörige und hier versammelte Körperschaft.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: gegen Mose und Aaron
  rationale: Der Zusammenhang zeigt eine feindselige Versammlung; עַל bezeichnet daher Opposition, nicht nur räumliche Ausrichtung.
- source_word: וַיִּפְנוּ אֶל
  choice: sie wandten sich … zu
  rationale: Gibt die körperliche Hinwendung zum Zelt direkt und idiomatisch wieder.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Übersetzt beide Bestandteile der festen Heiligtumsbezeichnung und bleibt näher am Hebräischen als „Stiftshütte“.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Bewahrt die feierliche, aufmerksamkeitslenkende Funktion von הִנֵּה.
- source_word: כִסָּהוּ הֶעָנָן
  choice: die Wolke bedeckte es
  rationale: Das maskuline Singularsuffix wird im Deutschen durch „es“ aufgenommen und bezieht sich am natürlichsten auf das unmittelbar vorausgehende Zelt.
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Der Nifal von ראה bezeichnet hier das sichtbare Offenbarwerden.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: Bewahrt die gewichtige biblische Wendung für Gottes sichtbar offenbarte Majestät und Gegenwart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens erhält den Namen, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt ihn in einer im Deutschen etablierten Form, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bezugswort des Suffixes in כִסָּהוּ
  choice: Das Zelt der Begegnung
  alternative: die Gemeinde oder die gesamte Szene
  rationale: Das maskuline Singularsuffix weist am natürlichsten auf das nächststehende maskuline Singularwort אֹהֶל („Zelt“) zurück. Die knappe hebräische Form lässt den Bezug jedoch nur grammatisch und kontextuell erschließen, weshalb eine Fußnote die geringe Restunsicherheit sichtbar macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der feierliche Aufmerksamkeitsruf „siehe“ und der narrative Auftakt „Und es geschah“ erhalten den biblischen Erzählton, ohne insgesamt altertümliche Sprache zu verwenden.
