  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: de
  text: 'Sag zu Eleasar, dem Sohn Aarons, des Priesters: Er soll die Räucherpfannen[a] mitten aus dem Brand emporheben und das Feuer weiter weg verstreuen; denn sie sind heilig geworden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feuerpfannen“. Das hebräische Wort bezeichnet Gefäße, in denen glühende Kohlen oder Räucherwerk getragen wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn sie sind heilig“. Das hebräische Perfekt kann den erreichten Zustand hervorheben: „sie sind heilig geworden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Sag
  rationale: Der Imperativ von אמר leitet den Auftrag ein, den Mose Eleasar übermitteln soll. „Sag“ ist natürlich und bewahrt die direkte Befehlsform.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Eleasar, dem Sohn des Priesters Aaron
  rationale: Die Formulierung gibt die hebräische Zuordnung so wieder, dass „der Priester“ grammatisch Aaron bezeichnet, ohne Eleasars priesterliche Stellung zu bestreiten.
- source_word: וְיָרֵם
  choice: er soll … herausholen
  rationale: Der Jussiv nach dem Imperativ bezeichnet den Inhalt des zu übermittelnden Auftrags. „Herausholen“ gibt in Verbindung mit מִבֵּין sowohl das Anheben als auch die Bewegung aus dem Brand idiomatisch wieder.
- source_word: הַמַּחְתֹּת
  choice: die Räucherpfannen
  rationale: מחתה bezeichnet ein Gefäß für glühende Kohlen beziehungsweise Räucherwerk. „Räucherpfannen“ ist im kultischen Zusammenhang verständlich und genauer als das allgemeinere „Pfannen“.
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: aus dem Brand
  rationale: שׂרפה kann den Brand, das Verbrennen oder den vom Feuer betroffenen Bereich bezeichnen. „Aus dem Brand“ wahrt das konkrete Bild, ohne ausdrücklich „Asche“ oder „Brandreste“ einzutragen.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: und das Feuer weiter weg verstreuen
  rationale: זרה bedeutet „zerstreuen“ oder „ausstreuen“; הָלְאָה bezeichnet eine Bewegung weiter fort. Das ungewöhnliche Bild des verstreuten Feuers bleibt erhalten und wird nicht stillschweigend auf „Kohlen“ verengt.
- source_word: כִּי קָדֵשׁוּ
  choice: denn sie sind heilig geworden
  rationale: Das Perfekt bezeichnet hier plausibel einen eingetretenen Zustand. Der maskuline Plural bezieht sich am natürlichsten auf die Räucherpfannen.
theological_decisions:
- issue: Bezug des Plurals in כִּי קָדֵשׁוּ
  choice: Der Plural bezieht sich auf die Räucherpfannen.
  alternative: Der Plural umfasst die Räucherpfannen und das Feuer oder allgemeiner die zum Opfer gehörenden Gegenstände.
  rationale: 'הַמַּחְתֹּת ist der nächstliegende geeignete Pluralbezug. Auch der Handlungsablauf stützt dies: Die Pfannen werden geborgen, während das Feuer verstreut werden soll.'
- issue: Aspektuelle Bedeutung von קָדֵשׁוּ
  choice: „sie sind heilig geworden“
  alternative: „sie sind heilig“
  rationale: Die gewählte Wiedergabe bringt den durch das vorausgegangene Geschehen erreichten Zustand zum Ausdruck; die rein statische Wiedergabe bleibt grammatisch möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Terminologie bleibt anschaulich, und die ungewöhnliche Wendung „das Feuer … verstreuen“ bewahrt die Bildsprache des Hebräischen. Die Satzstruktur macht den Jussiv als Inhalt des an Eleasar auszurichtenden Befehls deutlich.
