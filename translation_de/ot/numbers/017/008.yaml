  text: וַ/יָּבֹ֤א מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶל פְּנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: de
  text: Da kamen Mose und Aaron vor das Zelt der Begegnung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kamen
  rationale: Das Wayyiqtol von בוא führt die Erzählung fort. Obwohl das Verb im Hebräischen im Singular steht, verlangt das zusammengesetzte Subjekt im natürlichen Deutschen den Plural. „Kamen“ bezeichnet die Annäherung, ohne ein Eintreten in das Zelt zu behaupten.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im Deutschen gebräuchliche Namensform.
- source_word: וְאַהֲרֹן
  choice: und Aaron
  rationale: Wiedergabe der Konjunktion und der im Deutschen gebräuchlichen Namensform.
- source_word: אֶל־פְּנֵי
  choice: vor
  rationale: Die Wendung bedeutet wörtlich etwa „zum Angesicht von“, bezeichnet hier aber idiomatisch die Bewegung an die Vorderseite beziehungsweise in den Bereich vor dem Zelt.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wiedergabe erhält die Konstruktverbindung und den kultischen Sinn des bestimmten Heiligtums. „Begegnung“ gibt מוֹעֵד in diesem feststehenden Ausdruck natürlich und verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählbewegung des Hebräischen bleibt erhalten; eine Fußnote zur wörtlichen Körperteilmetapher von אֶל־פְּנֵי ist für diese unstrittige deutsche Idiomatik nicht nötig.
