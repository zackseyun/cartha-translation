  - severity: low
    issue: »Da fielen sie auf ihr Angesicht«
    rationale: Die Singularform »ihr Angesicht« bei pluralischem Subjekt ist biblisch-traditionell, aber im modernen Standarddeutsch wenig natürlich. Eine idiomatische Umschreibung erhält die körperliche Geste der Prostration.
