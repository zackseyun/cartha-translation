  verdict: revise
  source_fidelity: 'Die Aussage des hebräischen Textes wird im Wesentlichen getroffen: Aufforderung zur Entfernung aus der Gemeinschaft, anschließende Ankündigung unverzüglicher Vernichtung und die Niederwerfung von Mose und Aaron. »Erhebt euch aus der Mitte« ist im modernen Deutschen jedoch nicht zuverlässig als Aufforderung zum Weggehen verständlich; es legt vielmehr ein bloßes Aufstehen nahe. Für הֵרֹמּוּ ist hier eine kontextgemäße Wiedergabe als Entfernung erforderlich.'
  naturalness: Die Formulierung »fielen sie auf ihr Angesicht« ist zwar traditionssprachlich verständlich, wirkt im modernen Standarddeutsch jedoch unidiomatisch. »Warfen sie sich mit dem Gesicht zu Boden« ist klar, würdevoll und gibt die hebräische Geste ohne Bedeutungszuwachs wieder.
  terminology: »Gemeinde« gibt עֵדָה angemessen als die Gemeinschaft Israels wieder. »Vernichte« bildet כלה in diesem Gerichtskontext klar und angemessen ab. Die Fußnoten bewahren die relevante lexikalische Alternative zur Aufforderung und zur Vernichtungsankündigung.
