base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: de
  text: »Entfernt euch aus der Mitte dieser Gemeinde[a], damit ich sie in einem Augenblick vernichte[b].« Da warfen sie sich mit dem Gesicht zu Boden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sondert euch aus dieser Versammlung ab.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mache ich ihnen augenblicklich ein Ende.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: Erhebt euch
  rationale: Der Nifal-Imperativ Plural von רום wird bildhaft und zugleich kontextgemäß wiedergegeben; gemeint ist, dass Mose und Aaron sich aus der Gemeinde entfernen sollen. Die wörtliche Bildsprache bleibt erhalten, ohne die mögliche Bedeutung »Sondert euch ab« in den Haupttext einzutragen.
- source_word: מִתּוֹךְ
  choice: aus der Mitte
  rationale: Gibt die räumliche Trennung aus dem Inneren einer Gruppe eng am hebräischen Ausdruck und in natürlichem Deutsch wieder.
- source_word: הָעֵדָה הַזֹּאת
  choice: dieser Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. »Gemeinde« wahrt den gemeinschaftlichen Sinn, ohne ausschließlich eine kultische Versammlung zu bezeichnen.
- source_word: וַאֲכַלֶּה
  choice: damit ich ... vernichte
  rationale: Das Piel von כלה bezeichnet hier das vollständige Beenden bzw. Vernichten. »Vernichte« ist im modernen Deutsch klar und bewahrt die Härte des angekündigten Gerichts.
- source_word: כְּרָגַע
  choice: in einem Augenblick
  rationale: Der Ausdruck bezeichnet eine äußerst kurze Zeitspanne; die deutsche Wendung ist idiomatisch und entspricht dem hebräischen Sinn.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: Da fielen sie auf ihr Angesicht
  rationale: Das narrative ו wird im Handlungsfortgang mit »Da« wiedergegeben. »Auf ihr Angesicht« bewahrt die körperliche Bildsprache der Niederwerfung und den feierlich-biblischen Ton.
theological_decisions:
- issue: Art des göttlichen Befehls an Mose und Aaron
  choice: Der Befehl wird als Aufforderung wiedergegeben, sich vor dem unmittelbar bevorstehenden Gericht aus der Gemeinde herauszubegeben, ohne die Drohung abzumildern.
  alternative: »Sondert euch von dieser Versammlung ab« oder »Geht weg aus dieser Gemeinde«
  rationale: Das Hebräische verbindet einen dringlichen Imperativ mit Gottes Absicht, die Gemeinde unverzüglich zu vernichten. Die bildnahe Form »Erhebt euch« wahrt zugleich die mögliche Nuance des Sich-Absonderns.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. »Gemeinde« ist allgemein verständlich; »auf ihr Angesicht« ist bewusst etwas feierlicher und erhält die traditionelle Körpermetapher.
