  rationale: Die Aufforderung wird mit »Entfernt euch« so wiedergegeben, dass ihre im Kontext eindeutige Funktion der Absonderung aus der bedrohten Gemeinschaft im modernen Deutsch erkennbar bleibt. Die Fußnote erhält mit »Sondert euch ... ab« eine mögliche, stärker reflexive Nuance. Die Schlussgeste wird idiomatisch formuliert, ohne ihre Bedeutung als Niederwerfung zu verändern.
