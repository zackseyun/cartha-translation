  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: »Bring Aarons Stab zurück vor das Zeugnis[b], damit er als Zeichen für die Söhne des Aufruhrs[a] aufbewahrt wird. So sollst du ihrem Murren gegen mich ein Ende machen, damit sie nicht sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für die Aufrührer« beziehungsweise »für die widerspenstigen Söhne«.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Zeugnis« ist wahrscheinlich das Bundeszeugnis gemeint, das mit der Bundeslade verbunden war; der hebräische Ausdruck selbst bleibt knapp.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen in der im Deutschen üblichen Form wieder.
- source_word: הָשֵׁב
  choice: Bring ... zurück
  rationale: Der Hifil-Imperativ von שוב fordert Mose auf, den Stab wieder an seinen vorherigen Ort zu bringen.
- source_word: מַטֵּה
  choice: Stab
  rationale: Die natürliche deutsche Entsprechung bezeichnet den hier als Zeichen dienenden Stab Aarons.
- source_word: לִפְנֵי הָעֵדוּת
  choice: vor das Zeugnis
  rationale: Bewahrt die knappe kultische Formulierung des Hebräischen, ohne sie ausdrücklich zur Lade oder zum Bundesdokument zu erweitern.
- source_word: לְמִשְׁמֶרֶת
  choice: Dort soll er aufbewahrt werden
  rationale: Drückt den Zweck dauernder Verwahrung in natürlichem Deutsch aus; „dort“ nimmt den zuvor genannten Ort auf.
- source_word: לְאוֹת
  choice: als Zeichen
  rationale: אוֹת bezeichnet hier ein sichtbares Zeichen beziehungsweise Mahnzeichen.
- source_word: לִבְנֵי מֶרִי
  choice: für die Söhne des Aufruhrs
  rationale: Erhält die markante hebräische Sohnes-Wendung und die Bedeutung von מֶרִי als Auflehnung beziehungsweise Widersetzlichkeit; eine idiomatischere Deutung steht in der Fußnote.
- source_word: וּתְכַל
  choice: So sollst du ... ein Ende machen
  rationale: Der Hifil von כלה bedeutet hier, etwas zu beenden. Der Satzanschluss lässt Zweck beziehungsweise beabsichtigte Folge erkennen, ohne die Person des Verbs zu verändern.
- source_word: תְּלוּנֹּתָם
  choice: ihrem Murren
  rationale: „Murren“ wahrt das wiederkehrende Motiv der widerwilligen Beschwerden Israels in der Wüste.
- source_word: מֵעָלַי
  choice: gegen mich
  rationale: In Verbindung mit dem Murren bezeichnet die Präposition dessen Ausrichtung gegen Jahwe.
- source_word: וְלֹא יָמֻתוּ
  choice: damit sie nicht sterben
  rationale: Gibt die beabsichtigte Folge im Deutschen klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Referenz von הָעֵדוּת
  choice: das Zeugnis
  alternative: die Bundesurkunde / die Lade des Zeugnisses
  rationale: Der hebräische Ausdruck bleibt knapp und lässt offen, ob unmittelbar das Bundeszeugnis oder metonymisch die damit verbundene Lade gemeint ist.
- issue: Bildhafte Personenbezeichnung לִבְנֵי מֶרִי
  choice: Söhne des Aufruhrs
  alternative: die Aufrührer / die Widerspenstigen
  rationale: Die ungewöhnliche familiale Ausdrucksweise des Hebräischen wird im Haupttext bewahrt, während die Fußnote die idiomatische Bedeutung erläutert.
- issue: Syntaktische Zuordnung von וּתְכַל
  choice: 'Mose ist das grammatische Subjekt: „So sollst du ... ein Ende machen“'
  alternative: 'sinngemäße unpersönliche Wiedergabe: „So wird ... ein Ende gemacht“'
  rationale: Die Verbform ist zweite Person maskulin Singular und richtet sich an Mose; die Übersetzung bewahrt diese grammatische Spannung, auch wenn der Stab als Zeichen das Mittel dazu ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Wendung „vor das Zeugnis“ und das markante Bild „Söhne des Aufruhrs“ bleiben bewusst erhalten; Fußnoten erläutern beide Stellen. Sämtliche Fußnotenmarker stehen im Haupttext.
