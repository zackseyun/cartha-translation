id: NUM.17.11
reference: Numbers 17:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: de
  text: 'Da sagte Mose zu Aaron: »Nimm die Räucherpfanne[a], lege Feuer vom Altar hinein und gib Räucherwerk darauf. Geh schnell zur Gemeinde und schaffe Sühne für sie! Denn der Zorn ist von Yahweh her ausgegangen[b]; die Plage hat begonnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Feuerbecken«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von vor Yahweh«; gemeint ist: aus seiner Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: die Räucherpfanne
  rationale: Bezeichnet ein kultisches Gefäß zum Tragen von Glut und Räucherwerk. »Räucherpfanne« ist im Deutschen präziser als das ebenfalls mögliche »Feuerbecken«.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: lege Feuer vom Altar hinein
  rationale: Gibt sowohl die Herkunft des Feuers vom Altar als auch das Einlegen in das Gefäß in natürlichem Deutsch wieder.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Der übliche deutsche Begriff für die im Heiligtumsdienst verbrannte aromatische Substanz.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: Geh schnell
  rationale: Bewahrt Bewegungsverb und Dringlichkeit des hebräischen Ausdrucks.
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: Bezeichnet in Numeri die versammelte Gemeinschaft Israels; »Gemeinde« wahrt den korporativen und bundesbezogenen Sinn.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: schaffe Sühne für sie
  rationale: Bewahrt den kultisch-theologischen Gehalt von כפר, ohne eine bestimmte Sühnetheorie in den Text einzutragen.
- source_word: הַקֶּצֶף
  choice: der Zorn
  rationale: Gibt den göttlichen Zorn als wirksames Gerichtsgeschehen in würdigem, verständlichem Deutsch wieder.
- source_word: מִלִּפְנֵי יְהוָה
  choice: von Yahweh her
  rationale: Natürliches Deutsch für den Ausgang aus Yahwehs Gegenwart; die konkrete hebräische Wendung wird in einer Fußnote kenntlich gemacht.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הֵחֵל הַנָּגֶף
  choice: die Plage hat begonnen
  rationale: נֶגֶף bezeichnet hier die bereits einsetzende tödliche Heimsuchung; »Plage« ist kontextuell klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich; »Yahweh« wahrt den Eigennamen.
- issue: Kultisches Verb כפר
  choice: schaffe Sühne für sie
  alternative: vollziehe für sie die Sühne
  rationale: Die Formulierung erhält die priesterlich-kultische Bedeutung und bleibt zugleich offen dafür, wie das Verhältnis von Sühne, Zorn und Plage theologisch näher zu bestimmen ist.
- issue: Herkunft des göttlichen Zorns
  choice: von Yahweh her ausgegangen
  alternative: von Yahwehs Angesicht ausgegangen
  rationale: Die Hauptfassung ist natürliches modernes Deutsch; die Fußnote bewahrt das hebräische Bild von der Gegenwart beziehungsweise dem Angesicht Yahwehs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, dringlichen Imperativen. Kultische Schlüsselbegriffe wie »Räucherwerk« und »Sühne« bleiben erhalten; schwer verständliche hebräische Räumlichkeit wird im Haupttext idiomatisch und in der Fußnote formal transparent wiedergegeben.
