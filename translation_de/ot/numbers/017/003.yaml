  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: de
  text: Die Räucherpfannen dieser Männer, die mit ihrem Leben für ihre Sünde bezahlten[a], soll man zu dünnen Metallplatten hämmern, als Überzug für den Altar[b]. Denn sie haben sie vor Jahwe dargebracht, und sie sind heilig geworden[c]. Sie sollen den Israeliten als Zeichen dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „dieser Sünder, mit ihrem Leben“; gemeint ist, dass ihre Sünde sie das Leben kostete.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu getriebenen Blechen als Überzug für den Altar verarbeiten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sind sie geheiligt worden“. Das Subjekt sind am wahrscheinlichsten die Räucherpfannen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: Räucherpfannen
  rationale: Die Gefäße wurden in diesem kultischen Zusammenhang zum Verbrennen von Räucherwerk verwendet; „Räucherpfannen“ ist im Deutschen klarer als das allgemeinere „Feuerpfannen“.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: dieser Männer, die mit ihrem Leben für ihre Sünde bezahlten
  rationale: Die partizipiale Bezeichnung wird ereignisbezogen wiedergegeben. בְּנַפְשֹׁתָם bezeichnet hier idiomatisch den Verlust des eigenen Lebens infolge ihrer Sünde.
- source_word: וְעָשׂוּ אֹתָם
  choice: soll man ... hämmern
  rationale: Der Satz führt die Anweisung des vorherigen Verses fort. Das unpersönliche „man“ gibt den direktiven Sinn natürlich wieder, ohne einen im Vers nicht ausdrücklich genannten Ausführenden festzulegen.
- source_word: רִקֻּעֵי פַחִים
  choice: dünne Metallplatten
  rationale: Die Wendung bezeichnet durch Hämmern beziehungsweise Treiben erzeugte Metallbleche oder -platten; Verb und Ergebnis werden im deutschen Satz gemeinsam ausgedrückt.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: damit den Altar überziehen
  rationale: Die funktionale Wiedergabe bezeichnet verständlich den vorgesehenen Überzug des Altars.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: Denn sie haben sie vor Jahwe dargebracht
  rationale: „Darbringen“ bewahrt den kultischen Sinn von הקריב und passt zu den Räucherpfannen als Gegenstand.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname in gebräuchlicher deutscher Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּקְדָּשׁוּ
  choice: dadurch sind sie heilig geworden
  rationale: Das pluralische Verb bezieht sich am natürlichsten auf die Räucherpfannen. „Heilig geworden“ wahrt den resultativen Sinn, ohne eine bestimmte vermittelnde Handlung über das Darbringen hinaus einzutragen.
- source_word: וְיִהְיוּ לְאוֹת לִבְנֵי יִשְׂרָאֵל
  choice: So sollen sie den Israeliten als Zeichen dienen
  rationale: Die Wiedergabe erhält den direktiven beziehungsweise zukünftigen Sinn und gibt die kollektive Bezeichnung בני ישראל in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bezug und Bedeutung der Heiligungsaussage
  choice: Die Räucherpfannen wurden heilig, weil sie vor Jahwe dargebracht worden waren.
  alternative: Das pluralische Verb könnte weniger wahrscheinlich auf die Männer bezogen oder lediglich als kultische Aussonderung ohne bleibenden Heiligkeitsstatus verstanden werden.
  rationale: Die Räucherpfannen sind der nächste grammatische Bezug und die Aussage begründet, weshalb ihr Metall nur noch für einen heiligen Zweck, nämlich als Altarüberzug, verwendet werden soll. Die Spannung bleibt erhalten, dass Gegenstände sündiger Rebellen dennoch heilig wurden.
- issue: Bedeutung von בְּנַפְשֹׁתָם
  choice: Ihre Sünde kostete sie das eigene Leben.
  alternative: Sie sündigten gegen ihr eigenes Leben beziehungsweise hinsichtlich ihrer Seele.
  rationale: Im Erzählzusammenhang verweist die Wendung auf die tödliche Folge ihrer Rebellion, ohne eine Trennung von Seele und Körper vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachwörter werden nur dort verwendet, wo sie verständlich und sachlich erforderlich sind. „Israeliten“ steht natürlicher für das wörtliche „Söhne Israels“; die Pronomenbezüge werden durch Satzteilung verdeutlicht.
