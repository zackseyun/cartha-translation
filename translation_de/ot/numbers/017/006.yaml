source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: de
  text: 'Am nächsten Tag murrte die ganze Gemeinde der Israeliten gegen Mose und gegen Aaron: „Ihr habt das Volk Jahwes getötet!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: murrte
  rationale: Das Verb לון bezeichnet in den Wüstenerzählungen das feindselige Murren einer Gemeinschaft gegen ihre Führer. „Murren“ ist im Deutschen geläufig und bewahrt den charakteristischen Erzählton.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: die ganze Gemeinde der Israeliten
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft. „Gemeinde“ gibt ihren gemeinschaftlichen Charakter wieder; בְּנֵי יִשְׂרָאֵל ist als feste Volksbezeichnung im natürlichen modernen Deutsch idiomatisch mit „Israeliten“ wiedergegeben und umfasst hier die gesamte Gemeinschaft.
- source_word: מִמָּחֳרָת
  choice: am nächsten Tag
  rationale: Dies ist die natürliche moderne Wiedergabe der Zeitangabe „am folgenden/nächsten Tag“.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: gegen Mose und gegen Aaron
  rationale: Die Wiederholung von עַל wird im Deutschen beibehalten und richtet den Vorwurf ausdrücklich gegen beide Führer.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die formelhafte Einleitung direkter Rede wird im heutigen Deutschen idiomatisch durch einen Doppelpunkt ausgedrückt; ein zusätzliches „und sagte“ wäre wegen des bereits finiten Verbs stilistisch schwerfällig.
- source_word: אַתֶּם הֲמִתֶּם
  choice: Ihr habt … getötet
  rationale: Die Hifil-Form ist kausativ und richtet eine unmittelbare Anschuldigung an mehrere Personen. Das Perfekt bezeichnet eine abgeschlossene Tat mit gegenwärtiger Relevanz.
- source_word: עַם יְהוָה
  choice: das Volk Jahwes
  rationale: „Volk“ gibt עַם wieder, und der Genitiv bewahrt die Zugehörigkeitsbeziehung der hebräischen Wortgruppe knapp und feierlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen etablierte Form der wissenschaftlich wahrscheinlichen Aussprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname macht den Bundesnamen sichtbar, ohne die traditionelle Ersatzlesung „der HERR“ stillschweigend in den Haupttext einzutragen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: In dieser festen Volksbezeichnung bezieht sich die grammatisch maskuline Form auf die gesamte Gemeinde. „Israeliten“ bewahrt den ethnischen und heilsgeschichtlichen Bezug in natürlichem Deutsch, ohne die Aussage fälschlich auf männliche Nachkommen zu beschränken.
- issue: Verantwortungszuschreibung in הֲמִתֶּם
  choice: getötet
  alternative: den Tod verursacht
  rationale: Die direkte, scharfe Anklage wird nicht abgeschwächt. Zugleich entscheidet die Übersetzung nicht, ob der Vorwurf sachlich berechtigt ist; sie gibt die Rede der Gemeinde wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe, anklagende Rhythmus der direkten Rede bleibt erhalten; die wiederholte Präposition „gegen“ spiegelt die hebräische Hervorhebung beider Adressaten.
