source:
  edition: WLC
  text: וְ/הִנַּחְתָּ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵי֙ הָֽ/עֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: de
  text: Und du sollst sie im Zelt der Begegnung vor dem Zeugnis[a] niederlegen, dort, wo ich euch begegne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Bundeszeugnis“. Mit „dem Zeugnis“ ist wahrscheinlich das Bundeszeugnis im Heiligtum gemeint, das mit den Tafeln verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wo ich mich euch zu erkennen gebe“ beziehungsweise „wo ich mich mit euch zu treffen bestimme“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: Und du sollst sie … niederlegen
  rationale: Der Hifil von נוח/ניח mit Objektssuffix bezeichnet hier das veranlasste Ablegen beziehungsweise Platzieren der Stäbe. „Niederlegen“ ist im Deutschen natürlich und passt zu den konkreten Gegenständen.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Die feste Bezeichnung des Heiligtums wird transparent wiedergegeben. „Begegnung“ bewahrt den Zusammenhang mit dem folgenden Verb יעד.
- source_word: לִפְנֵי הָעֵדוּת
  choice: vor dem Zeugnis
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „im Angesicht von“. הָעֵדוּת wird wörtlich als „das Zeugnis“ wiedergegeben, ohne den hier nicht ausdrücklich genannten Gegenstand genauer festzulegen.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: wo ich … begegne
  rationale: Der Nifal von יעד bezeichnet in diesem Heiligtumskontext die festgesetzte Begegnung. Das relative אֲשֶׁר wird zusammen mit שָׁמָּה lokativ als „dort, wo“ wiedergegeben.
- source_word: לָכֶם
  choice: euch
  rationale: Die Präposition ל wird bei יעד idiomatisch als die an der Begegnung beteiligte Person verstanden; deutsches „jemandem begegnen“ verlangt den Dativ.
- source_word: שָׁמָּה
  choice: dort
  rationale: Das Ortsadverb wird ausdrücklich wiedergegeben; „dort, wo“ ist im Deutschen natürlich und erhält die räumliche Hervorhebung des Hebräischen.
theological_decisions:
- issue: Bezug von „dem Zeugnis“
  choice: Die wörtliche Wendung „vor dem Zeugnis“ bleibt im Haupttext stehen.
  alternative: „vor den Tafeln des Zeugnisses“, „vor der Lade des Zeugnisses“ oder „vor dem Bundeszeugnis“
  rationale: Der hebräische Text nennt hier weder die Tafeln noch die Lade ausdrücklich. Die offene, theologisch gewichtige Bezeichnung soll daher nicht auf einen einzelnen Bezug verengt werden.
- issue: Bedeutung der göttlichen Begegnung
  choice: „wo ich euch begegne“
  alternative: „wo ich mich euch zu erkennen gebe“ oder „wo ich mich mit euch zu treffen bestimme“
  rationale: Der Nifal von יעד kann die festgesetzte Begegnung betonen; „begegne“ gibt den unmittelbaren Sinn knapp wieder, während die Fußnote die weiteren Nuancen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt gut verständlich und folgt zugleich eng der hebräischen Ortsfolge. „Zelt der Begegnung“ und „Zeugnis“ werden als sachliche Bezeichnungen ohne typografische Sonderbehandlung verwendet.
