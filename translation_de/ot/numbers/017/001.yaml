lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Darauf sprach
  rationale: Das Waw mit der narrativen Verbform führt die Handlung weiter. „Darauf“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder; „sprach“ entspricht דבר und leitet zusammen mit לֵאמֹר die folgende Gottesrede ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier die Richtung der Rede; „zu Mose“ ist die übliche und natürliche deutsche Formulierung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die formelhafte Infinitivkonstruktion führt den Inhalt der direkten Rede ein. Im heutigen Deutsch erfüllt der Doppelpunkt diese Funktion natürlicher als das wörtliche „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname JHWH. „Jahwe“ bewahrt diesen als persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darauf“ wahrt den narrativen Anschluss, und der Doppelpunkt gibt die hebräische Redeeinleitungsformel idiomatisch wieder.
