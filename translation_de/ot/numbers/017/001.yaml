  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Darauf sprach Jahwe zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
