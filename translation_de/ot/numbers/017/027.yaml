id: NUM.17.27
reference: Numbers 17:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: de
  text: 'Da sagten die Israeliten[a] zu Mose: »Sieh nur,[b] wir sterben! Wir gehen zugrunde![c] Wir alle gehen zugrunde!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »die Söhne Israels«; gemeint sind die Israeliten als Gemeinschaft.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »Siehe«; hier ein Ausruf der Bestürzung und des Alarms.
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen stehen nacheinander zwei verschiedene Verben: »sterben« (גוע) und »zugrunde gehen« (אבד). Dadurch wird die Panik des Volkes gesteigert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt die gemeinschaftliche Identität präzise wieder; die wörtliche hebräische Wendung wird in der Fußnote genannt.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: 'Da sagten ...:'
  rationale: Die deutsche Einleitung der direkten Rede gibt die Funktion von לֵאמֹר idiomatisch wieder, ohne das schwerfällige »sagten ..., indem sie sprachen«.
- source_word: הֵן
  choice: Sieh nur
  rationale: Die aufmerksamkeitslenkende Partikel drückt hier alarmierte Eindringlichkeit aus. »Siehe« wäre formaler, klingt im heutigen Deutsch jedoch altertümlich.
- source_word: גָּוַעְנוּ
  choice: wir sterben
  rationale: Das Verb bezeichnet das Sterben beziehungsweise das Aushauchen des Lebens. Das Präsens passt zum unmittelbaren panischen Ausruf.
- source_word: אָבַדְנוּ
  choice: wir gehen zugrunde
  rationale: Diese Wiedergabe unterscheidet אבד von גוע und vermittelt drohenden Untergang. Die Wiederholung wird beibehalten.
- source_word: כֻּלָּנוּ
  choice: wir alle
  rationale: Die Stellung vor dem wiederholten Verb betont, dass nach der Befürchtung des Volkes niemand ausgenommen ist.
theological_decisions: []
