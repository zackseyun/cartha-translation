source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶלְעָזָ֣ר הַ/כֹּהֵ֗ן אֵ֚ת מַחְתּ֣וֹת הַ/נְּחֹ֔שֶׁת אֲשֶׁ֥ר הִקְרִ֖יבוּ הַ/שְּׂרֻפִ֑ים וַֽ/יְרַקְּע֖וּ/ם צִפּ֥וּי לַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: de
  text: Da nahm der Priester Eleasar die bronzenen Räucherpfannen[a], die die Verbrannten[b] dargebracht hatten, und man hämmerte sie zu einem Überzug[c] für den Altar aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feuerpfannen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Verbrannten“ oder „die, die verbrannt worden waren“; gemeint sind die im vorausgehenden Geschehen vom Feuer Verzehrten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Verkleidung“ beziehungsweise „Metallbelag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: Räucherpfannen
  rationale: Das Wort bezeichnet Gefäße für glühende Kohlen beziehungsweise Räucherwerk. „Räucherpfannen“ ist im kultischen Zusammenhang verständlich und lässt die konkrete Gefäßform offen.
- source_word: הַנְּחֹשֶׁת
  choice: bronzenen
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen; bei den Geräten des Heiligtums ist „Bronze“ die übliche und kontextuell wahrscheinliche Wiedergabe.
- source_word: הִקְרִיבוּ
  choice: dargebracht hatten
  rationale: Im kultischen Zusammenhang bedeutet die Hifil-Form „darbringen“ oder „als Opfergabe herbeibringen“. Das Plusquamperfekt macht die zeitliche Beziehung zum vorausgehenden Geschehen deutlich.
- source_word: הַשְּׂרֻפִים
  choice: die Verbrannten
  rationale: Das passive Partizip bezeichnet konkret diejenigen, die vom Feuer verzehrt wurden. Die substantivierte Form bewahrt diese knappe Ausdrucksweise, ohne die Betroffenen im Haupttext näher zu identifizieren.
- source_word: וַיְרַקְּעוּם
  choice: man hämmerte sie … aus
  rationale: רקע bezeichnet das Breitschlagen beziehungsweise Aushämmern von Metall. Die unpersönliche Konstruktion gibt das ausdrücklich genannte Objekt „sie“ wieder, ohne der im Hebräischen nicht näher bestimmten Mehrzahl ein konkretes Subjekt zuzuschreiben.
- source_word: צִפּוּי
  choice: Überzug
  rationale: Das Substantiv bezeichnet eine aufgebrachte Bedeckung oder Verkleidung. „Überzug“ ist natürlich und bewahrt den Bezug zum Metallbelag des Altars.
- source_word: לַמִּזְבֵּחַ
  choice: für den Altar
  rationale: 'Die Präposition לְ bezeichnet hier Zweck oder Bestimmung: Das ausgehämmerte Metall sollte als Überzug für den Altar dienen.'
