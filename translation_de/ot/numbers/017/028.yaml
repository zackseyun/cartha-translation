  text: כֹּ֣ל הַ/קָּרֵ֧ב הַ/קָּרֵ֛ב אֶל מִשְׁכַּ֥ן יְהוָ֖ה יָמ֑וּת הַ/אִ֥ם תַּ֖מְנוּ לִ/גְוֺֽעַ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: de
  text: Jeder, der sich der Zeltwohnung Yahwes nähert – jeder, der sich nähert –, wird sterben. Sollen wir denn alle zugrunde gehen[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist schwierig. Sie verwendet hier für „sterben/zugrunde gehen“ ein anderes Verb als zuvor bei „wird sterben“ und kann den Gedanken des völligen Zugrundegehens verstärken.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Jeder
  rationale: כֹּל bezeichnet hier umfassend jeden Menschen, der sich nähert; „Jeder“ gibt diese allgemeine Aussage im Deutschen natürlich wieder.
- source_word: הַקָּרֵב הַקָּרֵב
  choice: der sich nähert, der sich … nähert
  rationale: Die auffällige Wiederholung des Partizips wird beibehalten, um die Eindringlichkeit und Angst der Rede nicht zu glätten.
- source_word: מִשְׁכַּן
  choice: Zeltwohnung
  rationale: „Zeltwohnung“ bezeichnet in diesem Wüstenkontext präzise das transportable Heiligtum und bewahrt zugleich die Grundbedeutung „Wohnung“.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָמוּת
  choice: wird sterben
  rationale: Das Imperfekt beschreibt hier die erwartete Folge des Herantretens; „wird sterben“ ist klar und direkt.
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: Sollen wir denn alle zugrunde gehen?
  rationale: תמם vermittelt das völlige Zu-Ende-Gehen, während גוע das Sterben bezeichnet. „Alle zugrunde gehen“ gibt den verzweifelten Gedanken der vollständigen Vernichtung idiomatisch wieder und unterscheidet sich sprachlich von יָמוּת.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration bewahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Zugang zur Zeltwohnung und Todesfolge
  choice: Die Aussage bleibt als angstvolle, umfassende Folgerung des Volkes formuliert.
  alternative: Die Aussage ausdrücklich auf unbefugtes oder kultisch unerlaubtes Näherkommen beschränken.
  rationale: Der Vers selbst nennt keine solche Einschränkung ausdrücklich. Der Zusammenhang kann sie nahelegen, doch sie soll nicht in den Wortlaut eingefügt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung wurde bewusst erhalten. „Denn“ trägt den Ton der verzweifelten rhetorischen Frage, ohne eine zusätzliche Sachinformation einzuführen.
