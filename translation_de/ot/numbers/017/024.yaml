  source_fidelity: 'Der Text gibt die Abfolge und die zentralen hebräischen Ausdrücke zuverlässig wieder: Mose bringt die Stäbe aus der Gegenwart Jahwes zu ganz Israel; sie sehen die Stäbe, und jeder nimmt seinen eigenen Stab. „Sie sahen sie an“ ist eine kontextuell natürliche, nur leicht explizitierende Wiedergabe von וַיִּרְאוּ; die Fußnote wahrt die weniger bestimmte Grundbedeutung „sie sahen“.'
