id: NUM.17.24
reference: Numbers 17:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: de
  text: Da brachte Mose alle Stäbe aus der Gegenwart Jahwes zu allen Israeliten[a]. Sie sahen sie an[b], und jeder nahm seinen Stab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu allen Söhnen Israels“.'
    reason: Die Fußnote bewahrt die Form der hebräischen Volksbezeichnung בְּנֵי יִשְׂרָאֵל.
  - marker: b
    text: 'Wörtlich auch: „Sie sahen“.'
    reason: Das hebräische Verb nennt lediglich das Sehen und lässt die kontextuell naheliegende Bedeutung „ansehen/betrachten“ formal unausgesprochen.
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: brachte … heraus
  rationale: Der Hifil von יצא bezeichnet das Herausbringen. Die im Deutschen trennbare Verbform wird durch die nachgestellten Ergänzungen als „brachte … aus der Gegenwart Jahwes“ realisiert.
- source_word: הַמַּטֹּת
  choice: die Stäbe
  rationale: מַטֶּה bezeichnet hier die konkreten Stäbe, die zuvor vor Jahwe niedergelegt worden waren; „Stäbe“ ist im Deutschen eindeutig und kontextgerecht.
- source_word: מִלִּפְנֵי יְהוָה
  choice: aus der Gegenwart Jahwes
  rationale: Die Wendung bedeutet wörtlich „von vor Jahwe“. „Aus der Gegenwart Jahwes“ bewahrt die räumliche Vorstellung, ohne eine im Deutschen missverständliche Formulierung zu erzwingen.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: zu allen Israeliten
  rationale: בְּנֵי יִשְׂרָאֵל ist die übliche Volksbezeichnung. „Israeliten“ gibt sie in natürlichem, heutigem Deutsch wieder; die wörtlichere Form steht in der Fußnote.
- source_word: וַיִּרְאוּ
  choice: sie sahen sie an
  rationale: ראה bedeutet grundsätzlich „sehen“. Im Handlungsablauf liegt das Betrachten der herausgebrachten Stäbe nahe; „ansahen“ formuliert dies natürlich, während die Fußnote die formal offenere Wiedergabe nennt.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: und jeder nahm seinen Stab
  rationale: אִישׁ wird hier distributiv gebraucht. „Jeder“ bildet diese Verteilung natürlich ab, und das Possessivpronomen entspricht מַטֵּהוּ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt knapp und erzählerisch; idiomatisch notwendige Glättungen werden durch Fußnoten transparent gemacht.
