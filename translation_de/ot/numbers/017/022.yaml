source:
  edition: WLC
  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: de
  text: Da legte Mose die Stäbe[a] vor Jahwe in das Zelt des Zeugnisses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stöcke“. Das hebräische Wort bezeichnet hier die gegenständlichen Stäbe, die für die Stämme stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Stiftshütte des Zeugnisses“. Wörtlich: „das Zelt des Zeugnisses“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: Da legte … in
  rationale: Das Hifil von נוח bezeichnet hier das Hinlegen oder Platzieren eines Gegenstands. „legte … in“ gibt die konkrete Handlung in natürlichem deutschem Erzählstil wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: הַמַּטֹּת
  choice: die Stäbe
  rationale: מַטֶּה kann je nach Zusammenhang „Stab“, „Stock“ oder „Stamm“ bedeuten. Hier sind die konkreten Stäbe gemeint, die für die Stämme stehen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet eine Stellung vor jemandem und kann zugleich die Gegenwart dieser Person ausdrücken. „Vor“ bewahrt diese knappe räumliche und relationale Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאֹהֶל
  choice: in das Zelt
  rationale: אֹהֶל bedeutet wörtlich „Zelt“. Wegen des Verbs des Platzierens ist im Deutschen die Richtungsangabe „in das Zelt“ idiomatisch; gemeint ist der Ort, an dem die Stäbe niedergelegt wurden.
- source_word: הָעֵדֻת
  choice: des Zeugnisses
  rationale: עֵדוּת bezeichnet hier das mit dem Heiligtum verbundene Bundeszeugnis. Die traditionelle, quellennah bleibende Wiedergabe „Zeugnis“ wahrt den kultischen Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von עֵדוּת in der Bezeichnung des Zeltes
  choice: Zeugnis
  alternative: Bundesurkunde; Bundeszeugnis
  rationale: „Zeugnis“ erhält die knappe und theologisch vielschichtige Ausdrucksweise des Hebräischen, statt den Bezug ausdrücklich auf die Bundestafeln festzulegen.
translation_notes:
  register: Moderner, würdiger Erzählstil mit quellennaher kultischer Terminologie. „Da“ führt die fortlaufende hebräische Erzählform natürlich weiter; „Stäbe“ und „Zelt“ bleiben konkret und allgemein verständlich.
