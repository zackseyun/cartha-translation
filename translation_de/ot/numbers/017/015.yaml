  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: de
  text: Dann kehrte Aaron zu Mose an den Eingang des Zeltes der Begegnung zurück, und die Plage wurde aufgehalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kam zum Stillstand.'
    reason: Lexikalische Alternative zu נֶעֱצָרָה; sie betont den eingetretenen Stillstand, ohne den Handelnden zu benennen.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Dann kehrte … zurück
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge natürlich wieder. שׁוּב bezeichnet hier die räumliche Rückkehr.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet die Bewegung auf Mose zu; das Präfix „zurück-“ bringt die erneute Hinwendung bereits zum Ausdruck.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: an den Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet den Eingang beziehungsweise die Öffnung. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent und in würdigem, verständlichem Deutsch wieder.
- source_word: הַמַּגֵּפָה
  choice: die Plage
  rationale: מַגֵּפָה bezeichnet in diesem Gerichtskontext eine tödliche Plage; „Plage“ ist knapp, verständlich und kontextgerecht.
- source_word: נֶעֱצָרָה
  choice: wurde aufgehalten
  rationale: Der Nifal von עצר besagt, dass die Plage angehalten oder zum Stillstand gebracht wurde. Die passive Form lässt den im Kontext naheliegenden Handelnden unausgesprochen, wie im Hebräischen.
theological_decisions:
- issue: Unausgesprochene göttliche Urheberschaft beim Ende der Plage
  choice: Die passive Form „wurde aufgehalten“ bleibt ohne ausdrücklich genanntes Subjekt stehen.
  alternative: „Der HERR hielt die Plage auf“
  rationale: Im Zusammenhang ist Gottes Handeln vorausgesetzt, doch der hebräische Satz nennt ihn hier nicht ausdrücklich als Subjekt. Die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die syntaktische Zuordnung des Eingangs als Ort der Rückkehr zu Mose bleibt eng am hebräischen Wortlaut.
