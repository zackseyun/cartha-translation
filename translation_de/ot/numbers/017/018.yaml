  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: de
  text: Und den Namen Aarons sollst du auf den Stab Levis schreiben; denn für jedes Oberhaupt ihrer Großfamilien gibt es einen Stab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Denn ein Stab ist für das Oberhaupt ihres Vaterhauses.« Die hebräische Wendung kann distributiv verstanden werden: Für jedes Oberhaupt eines Vaterhauses ist ein einziger Stab vorgesehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: Und
  rationale: Die Konjunktion führt die Anweisung des vorhergehenden Verses fort; der direkte Objektmarker wird im Deutschen nicht eigens wiedergegeben.
- source_word: שֵׁם אַהֲרֹן
  choice: den Namen Aarons
  rationale: Natürliche deutsche Wiedergabe der Genitivverbindung; gemeint ist die Aufschrift mit Aarons persönlichem Namen.
- source_word: תִּכְתֹּב
  choice: sollst du … schreiben
  rationale: Das Qal-Imperfekt der 2. Person Singular hat hier im Anweisungskontext gebietende Bedeutung.
- source_word: עַל מַטֵּה לֵוִי
  choice: auf den Stab Levis
  rationale: מַטֶּה bezeichnet hier den konkreten Stab, der zugleich den Stamm Levi repräsentiert. „Stab“ ist aktuell und bewahrt beide Aspekte.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung dafür ein, dass Aarons Name auf Levis Stab geschrieben werden soll.
- source_word: מַטֶּה אֶחָד
  choice: einen Stab
  rationale: Gibt die Einzahl und die repräsentative Zuordnung prägnant wieder.
- source_word: לְ/רֹאשׁ
  choice: für jedes Oberhaupt
  rationale: רֹאשׁ bezeichnet hier das Haupt beziehungsweise den führenden Repräsentanten einer sozialen Einheit. Das distributive „jedes“ ergibt sich im Zusammenhang, bleibt aber in einer Fußnote als Auslegungsfrage kenntlich.
- source_word: בֵּית אֲבוֹתָם
  choice: ihrer Großfamilien
  rationale: Der Ausdruck bezeichnet väterlich gegliederte Sippen- oder Großfamilienverbände. „Großfamilien“ ist für heutige Leser verständlicher als das formalere „Vaterhäuser“.
theological_decisions: []
