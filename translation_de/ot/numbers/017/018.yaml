  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während „Großfamilien“ den antiken Verwandtschaftsverband verständlich ausdrückt. Die mögliche Mehrdeutigkeit der Schlusswendung wird durch die Fußnote bewahrt.
