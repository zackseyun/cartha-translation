revisions:
- from: Da redete Mose zu den Israeliten[a]. Alle ihre Oberhäupter gaben ihm je einen Stab, für jedes Oberhaupt einen Stab, nach ihren Vaterhäusern insgesamt zwölf Stäbe; und Aarons Stab war unter ihren Stäben.
  to: 'Mose redete zu den Israeliten[a], und alle ihre Oberhäupter gaben ihm je einen Stab, für jedes Oberhaupt nach ihren Vaterhäusern einen Stab: zwölf Stäbe; und Aarons Stab war unter ihren Stäben.'
  rationale: Die Revision beseitigt die stilistisch auffällige Einleitung „Da redete“ und entfernt die nicht ausdrücklich im Hebräischen enthaltene Explikation „insgesamt“. Die distributive Wiederholung, die Zuordnung zu den Vaterhäusern, die Zahl zwölf und die Einordnung von Aarons Stab bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:03:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Elemente des Hebräischen zutreffend wieder: Mose spricht zu den Israeliten; die Oberhäupter übergeben die zwölf Stäbe nach Vaterhäusern; Aarons Stab befindet sich unter ihnen. Die distributive, im Hebräischen wiederholte Wendung wird angemessen sichtbar gehalten. „Insgesamt“ ist jedoch eine explizierende Ergänzung, die im Ausgangstext nicht ausgedrückt wird.'
  naturalness: „Da redete Mose“ wirkt im modernen Standarddeutsch unnötig markiert und weniger idiomatisch als „Mose redete“. Die Wiederholung „je einen Stab, für jedes Oberhaupt einen Stab“ ist zwar quellentreu motiviert, lässt sich durch Zeichensetzung klarer und natürlicher gliedern.
  terminology: „Israeliten“, „Oberhäupter“, „Stab“ und „Vaterhäuser“ sind im Kontext sachgerecht. „Oberhäupter“ vermeidet die heute leicht missverständliche dynastische Konnotation von „Fürsten“. Die Fußnote erklärt die wörtliche hebräische Bezeichnung ausreichend.
  issues:
