  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וַ/יִּתְּנ֣וּ אֵלָ֣י/ו כָּֽל נְשִֽׂיאֵי/הֶ֡ם מַטֶּה֩ לְ/נָשִׂ֨יא אֶחָ֜ד מַטֶּ֨ה לְ/נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת וּ/מַטֵּ֥ה אַהֲרֹ֖ן בְּ/ת֥וֹךְ מַטּוֹתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: de
  text: 'Mose redete zu den Israeliten[a], und alle ihre Oberhäupter gaben ihm je einen Stab, für jedes Oberhaupt nach ihren Vaterhäusern einen Stab: zwölf Stäbe; und Aarons Stab war unter ihren Stäben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“; dies ist eine feste Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: דבר bezeichnet hier das Reden zu einer Personengruppe; „redete zu“ ist im erzählenden Zusammenhang natürlich und wahrt die Zielrichtung des hebräischen אֶל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten[a]
  rationale: Die feste hebräische Volksbezeichnung meint die Angehörigen Israels als Gemeinschaft. „Israeliten“ ist im modernen Deutschen klar und schließt die ganze Gemeinschaft ein; die wörtliche Form wird in der Fußnote genannt.
- source_word: נְשִׂיאֵיהֶם
  choice: ihre Oberhäupter
  rationale: נָשִׂיא bezeichnet hier die anerkannten Repräsentanten der Stämme beziehungsweise Vaterhäuser. „Oberhäupter“ ist präziser als das politisch oder dynastisch missverständliche „Fürsten“.
- source_word: מַטֶּה
  choice: Stab
  rationale: Gemeint ist ein tatsächlich übergebener Stab, der zugleich als Repräsentationszeichen dient. „Stab“ ist die natürliche und kontextgerechte deutsche Entsprechung.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד מַטֶּה לְנָשִׂיא אֶחָד
  choice: je einen Stab, für jedes Oberhaupt einen Stab
  rationale: Die distributive Bedeutung und die betonte Wiederholung des Hebräischen bleiben erkennbar, ohne im Deutschen unverständlich zu wirken.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ gibt die patrilinearen Großfamilien beziehungsweise Sippenverbände der israelitischen Sozialordnung wieder; „nach“ bezeichnet die entsprechende Zuordnung.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: insgesamt zwölf Stäbe
  rationale: „Insgesamt“ macht deutlich, dass zwölf die Summe der zuvor einzeln genannten Stäbe ist, ohne dem Ausgangstext eine neue Aussage hinzuzufügen.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: und Aarons Stab war unter ihren Stäben
  rationale: Die verblosen hebräische Nominalklausel wird im Deutschen mit „war“ wiedergegeben; „unter“ bewahrt die Bedeutung von בְּתוֹךְ als Zugehörigkeit innerhalb der Gruppe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung bei der Verteilung der Stäbe bleibt teilweise erhalten; altertümliche oder dynastisch missverständliche Bezeichnungen wie „Fürsten“ werden vermieden.
