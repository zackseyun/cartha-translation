    issue: „Da redete Mose“ ist stilistisch unnötig markiert.
    rationale: Das einleitende וַ wird in der deutschen Erzählprosa hier natürlich durch eine einfache Satzverbindung beziehungsweise durch „Mose redete“ wiedergegeben; „Da“ fügt keinen erforderlichen zeitlichen Akzent hinzu.
  - severity: low
    issue: „insgesamt“ expliziert die Zahl der Stäbe.
    rationale: שְׁנֵים עָשָׂר מַטּוֹת lautet schlicht „zwölf Stäbe“. Die Gesamtzahl ergibt sich aus dem Kontext, wird aber nicht durch ein eigenes Wort für „insgesamt“ markiert.
