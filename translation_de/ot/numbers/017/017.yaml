source:
  edition: WLC
  text: דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/קַ֣ח מֵֽ/אִתָּ֡/ם מַטֶּ֣ה מַטֶּה֩ לְ/בֵ֨ית אָ֜ב מֵ/אֵ֤ת כָּל נְשִֽׂיאֵ/הֶם֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת אִ֣ישׁ אֶת שְׁמ֔/וֹ תִּכְתֹּ֖ב עַל מַטֵּֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: de
  text: Rede zu den Israeliten[a] und nimm von all ihren Anführern, entsprechend ihren Vaterhäusern, je einen Stab[b], insgesamt zwölf Stäbe. Den Namen jedes Mannes sollst du auf seinen Stab schreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Söhnen Israels«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann sowohl »Stab« als auch »Stamm« bezeichnen; hier ist der konkrete Stab gemeint.
    reason: lexical_wordplay
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt den hebräischen Volksnamen treffend wieder; die wörtliche Form »Söhne Israels« wird in einer Fußnote bewahrt.
- source_word: מַטֶּה
  choice: Stab
  rationale: Gemeint ist hier der konkrete Stab, auf den ein Name geschrieben wird. »Stab« ist im Deutschen klarer und würdiger als »Stock«; zugleich kann das hebräische Wort auch einen Stamm bezeichnen.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: je einen Stab für jedes Vaterhaus
  rationale: »Je einen« bildet die distributive Wiederholung des hebräischen Nomens idiomatisch ab. »Vaterhaus« bewahrt die soziale Gliederung nach väterlicher Abstammung präziser als das allgemeinere »Familie«.
- source_word: נְשִׂיאֵיהֶם
  choice: ihre Anführer
  rationale: Das Wort bezeichnet die führenden Vertreter der jeweiligen Gruppen. »Anführer« ist modernes Standarddeutsch und vermeidet den irreführenden königlichen Beiklang von »Fürsten«.
- source_word: לְבֵית אֲבֹתָם
  choice: entsprechend ihren Vaterhäusern
  rationale: Die Formulierung bezeichnet die Zuordnung der Anführer zu den jeweiligen väterlichen Abstammungsverbänden.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: insgesamt zwölf Stäbe
  rationale: »Insgesamt« macht im Deutschen natürlich deutlich, dass die einzeln einzusammelnden Stäbe zusammen zwölf ergeben.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב עַל מַטֵּהוּ
  choice: Den Namen jedes Mannes sollst du auf seinen Stab schreiben
  rationale: 'Die Formulierung erhält die distributive Beziehung: Jeder namentlich bezeichnete Mann hat den ihm zugeordneten Stab.'
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der fachlich geprägte Ausdruck »Vaterhaus« wurde beibehalten, weil er die im Text vorausgesetzte Abstammungs- und Sippenordnung präzise wiedergibt; der Satzbau wurde für die deutsche Lesbarkeit behutsam geordnet.
