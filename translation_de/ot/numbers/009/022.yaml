base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: de
  text: 'Ob es zwei Tage, einen Monat oder längere Zeit[a] war: Solange die Wolke über der Wohnung verweilte und über ihr ruhte, lagerten die Israeliten und brachen nicht auf; wenn sie sich aber erhob, brachen sie auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Tage“; hier wahrscheinlich im Sinn von „viele Tage“ oder „längere Zeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: Ob es ... oder ... oder ... war
  rationale: Die wiederholte Disjunktion bezeichnet verschiedene mögliche Zeitspannen; diese deutsche Fassung bildet die Reihung natürlich ab.
- source_word: יֹמַיִם
  choice: zwei Tage
  rationale: Die Dualform bezeichnet ausdrücklich zwei Tage.
- source_word: חֹדֶשׁ
  choice: einen Monat
  rationale: Der Ausdruck steht innerhalb einer Aufzählung möglicher Zeitspannen und ist hier unbestimmt zu verstehen.
- source_word: יָמִים
  choice: längere Zeit
  rationale: Nach „zwei Tage“ und „einen Monat“ bezeichnet der bloße Plural in diesem Zusammenhang wahrscheinlich einen längeren Zeitraum; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: בְּהַאֲרִיךְ הֶעָנָן
  choice: Solange die Wolke ... verweilte
  rationale: Das Hifil von ארך drückt hier das Fortdauern des Aufenthalts aus; „solange“ verbindet dies idiomatisch mit dem wiederholten Verhalten Israels.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: „Wohnung“ bewahrt die Wortverbindung zu שכן und ist eine verständliche, würdige Bezeichnung für das tragbare Heiligtum; „Stiftshütte“ wäre traditioneller, aber im modernen Deutsch weniger unmittelbar verständlich.
- source_word: לִשְׁכֹּן עָלָיו
  choice: über ihr ruhte
  rationale: שכן bezeichnet ein bleibendes Sich-Niederlassen. „Ruhte“ klingt im Deutschen bei einer Wolke natürlich und wahrt den Gedanken ihrer beständigen Gegenwart über der Wohnung.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung gibt die hebräische Wendung natürlich wieder, ohne den Gemeindeverband auf männliche Personen zu beschränken.
- source_word: יַחֲנוּ ... וְלֹא יִסָּעוּ
  choice: blieben ... im Lager und brachen nicht auf
  rationale: Die Imperfektformen beschreiben das jeweils wiederkehrende Verhalten. „Im Lager bleiben“ und „aufbrechen“ machen den im Reisekontext gemeinten Gegensatz klar.
- source_word: וּבְהֵעָלֹתוֹ יִסָּעוּ
  choice: sobald sie sich aber erhob, brachen sie auf
  rationale: Das Suffix bezieht sich auf die Wolke. Die reflexive Formulierung gibt ihr Aufsteigen idiomatisch wieder und hält den Gegensatz zum Verweilen fest.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Der traditionelle Ausdruck „Stiftshütte“ wurde zugunsten von „Wohnung“ vermieden, um משכן transparent und die Wortbeziehung zu שכן erkennbar zu halten. Die wiederholte Handlung wird durch „blieben“ und „brachen“ im Zusammenhang als regelmäßiges Verhalten verständlich.
