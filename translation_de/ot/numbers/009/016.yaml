  revision_rationale: Die Revision bindet die Feuererscheinung eindeutig an die Wolke zurück, gibt מַרְאֵה אֵשׁ mit der engen deutschen Entsprechung „das Aussehen von Feuer“ wieder und vermeidet die überstarke Vergleichsnuance von „wie von Feuer“.
