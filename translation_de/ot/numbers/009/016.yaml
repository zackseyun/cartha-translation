review_pass:
  verdict: revise
  source_fidelity: 'Der erste Teilsatz gibt die gewohnheitsmäßige, fortdauernde Aussage von כֵּן יִהְיֶה תָמִיד angemessen wieder. Die Wolke als Subjekt und die Wohnstätte als Bezugsobjekt von יְכַסֶּנּוּ entsprechen dem unmittelbaren Kontext. Im zweiten Teilsatz ist jedoch „eine Erscheinung wie von Feuer zu sehen“ weniger präzise: Es macht aus der knappen prädikativen Aussage eine unpersönliche Sichtbarkeitskonstruktion und legt durch „wie“ stärker als nötig einen bloß feuerähnlichen Eindruck nahe.'
  naturalness: „So war es ständig“ ist modernes, verständliches Standarddeutsch. „Die Wolke hatte nachts das Aussehen von Feuer“ ist zugleich natürlicher und syntaktisch klarer als „nachts war eine Erscheinung … zu sehen“.
  terminology: „Wohnstätte“ ist als Wiedergabe von מִשְׁכָּן im Kontext vertretbar. „Das Aussehen von Feuer“ gibt מַרְאֵה אֵשׁ eng wieder und wahrt die Aussageoffenheit hinsichtlich der Art der Feuererscheinung.
  issues:
  - severity: medium
    issue: Der zweite Teilsatz verschiebt die hebräische Aussage.
    rationale: וּמַרְאֵה אֵשׁ לָיְלָה beschreibt die nächtliche Erscheinungsweise der Wolke elliptisch. Die Formulierung „eine Erscheinung wie von Feuer zu sehen“ fügt eine unpersönliche Konstruktion hinzu und kann „wie“ als ausdrückliche Irrealitäts- oder Vergleichsaussage lesen lassen. Die Konstruktion „hatte ... das Aussehen von Feuer“ bildet die hebräische Nominalfügung genauer nach.
  revised_text: 'So war es ständig: Die Wolke bedeckte die Wohnstätte, und nachts hatte sie das Aussehen von Feuer.[a]'
