source:
  edition: WLC
  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: de
  text: 'So war es ständig: Die Wolke bedeckte die Wohnstätte, und nachts hatte sie das Aussehen von Feuer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und (das) Aussehen von Feuer bei Nacht“.'
    reason: Die knappe hebräische Nominalfügung beschreibt die nächtliche Erscheinungsweise der Wolke, ohne die Art dieser Feuererscheinung näher festzulegen.
lexical_decisions:
- source_word: כֵּן יִהְיֶה תָמִיד
  choice: So war es ständig
  rationale: Die Wendung fasst den regelmäßig anhaltenden Vorgang zusammen. Das Imperfekt beschreibt hier im Rückblick einen gewohnheitsmäßigen Zustand; „ständig“ gibt תָמִיד natürlich und prägnant wieder.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Der bestimmte Ausdruck verweist auf die aus dem unmittelbaren Zusammenhang bekannte Wolke über der Wohnstätte.
- source_word: יְכַסֶּנּוּ
  choice: bedeckte die Wohnstätte
  rationale: Das Verb bedeutet „bedecken, verhüllen“. Das maskuline Suffix bezieht sich im Kontext am ehesten auf מִשְׁכָּן, die Wohnstätte. Die Wiederaufnahme des Substantivs ist im Deutschen eindeutiger als ein Pronomen und bewahrt den sachlichen Bezug.
- source_word: וּמַרְאֵה אֵשׁ
  choice: und eine Erscheinung wie von Feuer zu sehen
  rationale: מַרְאֶה bezeichnet das sichtbare Erscheinungsbild. Die Formulierung bewahrt die Offenheit, ob es sich um Feuer selbst oder um etwas Feuerähnliches handelte, und ergänzt für natürliches Deutsch „zu sehen“.
- source_word: לָיְלָה
  choice: nachts
  rationale: Die adverbiale Wiedergabe ist im modernen Deutschen knapp und idiomatisch.
theological_decisions:
- issue: Bezugswort des Pronominalsuffixes in יְכַסֶּנּוּ
  choice: die Wohnstätte
  alternative: ihn beziehungsweise sie
  rationale: Das hebräische Suffix ist maskulin Singular und verweist im unmittelbaren Zusammenhang am ehesten auf den מִשְׁכָּן. Da dessen deutsche Entsprechungen ein anderes grammatisches Geschlecht haben können, wird das Bezugswort ausdrücklich wiederholt.
- issue: Art der nächtlichen Feuererscheinung
  choice: eine Erscheinung wie von Feuer
  alternative: Feuer beziehungsweise Feuerschein
  rationale: Der Ausdruck מַרְאֵה אֵשׁ benennt das sichtbare Erscheinungsbild, ohne eindeutig festzulegen, ob wirkliches Feuer oder lediglich etwas Feuerähnliches gemeint ist. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „die Wohnstätte“ vermeidet einen missverständlichen deutschen Pronomenbezug; die nächtliche Erscheinung wird bewusst nicht als eindeutig materielles Feuer festgelegt.
