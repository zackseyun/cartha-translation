  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: de
  text: Manchmal blieb die Wolke einige Tage lang über der Stiftshütte. Auf den Befehl Jahwes[a] hin lagerten sie, und auf den Befehl Jahwes hin brachen sie auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach dem Mund Jahwes“; gemeint ist: auf Jahwes Befehl beziehungsweise Weisung hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Manchmal
  rationale: Die Wendung führt innerhalb der geschilderten wechselnden Zeitspannen einen weiteren möglichen Fall ein. „Manchmal“ gibt dies im modernen Deutschen knapp und natürlich wieder.
- source_word: יִהְיֶה הֶעָנָן
  choice: blieb die Wolke
  rationale: היה bezeichnet hier im Zusammenhang der Wanderung nicht bloß das Dasein, sondern das fortdauernde Verweilen der Wolke über der Stiftshütte.
- source_word: יָמִים מִסְפָּר
  choice: eine Anzahl von Tagen
  rationale: Die Wendung bezeichnet eine begrenzte, nicht näher bestimmte Zahl von Tagen. Die Übersetzung wahrt diese Unbestimmtheit, ohne sie auf „wenige“ festzulegen.
- source_word: עַל הַמִּשְׁכָּן
  choice: über der Stiftshütte
  rationale: מִשְׁכָּן ist hier die tragbare Heiligtumswohnung Israels; „Stiftshütte“ ist dafür die etablierte und verständliche deutsche Bezeichnung. עַל beschreibt die Lage der Wolke darüber.
- source_word: עַל פִּי יְהוָה
  choice: auf den Befehl Jahwes hin
  rationale: Die wörtliche Wendung „nach dem Mund Jahwes“ bezeichnet hier die maßgebliche Weisung oder Anordnung Jahwes. Die Fußnote macht das hebräische Bild sichtbar.
- source_word: יַחֲנוּ
  choice: lagerten sie
  rationale: Das Imperfekt schildert in diesem Abschnitt wiederholtes beziehungsweise jeweils eintretendes Verhalten; „lagerten sie“ ist im Deutschen für das Verbleiben am Lagerplatz natürlich.
- source_word: יִסָּעוּ
  choice: brachen sie auf
  rationale: נסע bezeichnet im Kontext der Wüstenwanderung das Aufbrechen vom Lager und den Beginn der nächsten Wegstrecke.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form der wissenschaftlichen Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst und keinen Herrschaftstitel. Die Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „auf den Befehl Jahwes hin“ bildet die bewusste Parallelität des hebräischen Textes ab; die zeitliche Unbestimmtheit von יָמִים מִסְפָּר bleibt erhalten.
