  source_fidelity: 'Die wesentlichen Begriffe sind zutreffend wiedergegeben: טָמֵא לָנֶפֶשׁ bezeichnet in diesem Kontext Leichenunreinheit, בְּדֶרֶךְ רְחֹקָה eine fern gelegene Reise, und עָשָׂה פֶסַח das Begehen des Passa. Der Gottesname wird angemessen als „Jahwe“ wiedergegeben. Die Stellung von „bei euch oder in euren künftigen Generationen“ im Entwurf kann jedoch den Eindruck erwecken, sie gehöre nur zur ersten Alternative der Bedingung. Im Hebräischen bestimmt sie den Geltungsbereich der Regel bzw. die betroffene Person.'
