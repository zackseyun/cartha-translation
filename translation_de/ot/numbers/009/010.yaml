  terminology: „Söhne Israels“, „Mann“, „unrein“, „Passa“ und „Jahwe“ sind konsistent und sachgerecht. Die Fußnote zu Leichenunreinheit sollte die wörtliche Formulierung genauer als „unrein in Bezug auf eine Person/Seele“ bezeichnen, ohne zu suggerieren, der Grundtext meine hier eine lebende Person.
