source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: de
  text: 'Rede zu den Söhnen Israels[a] und sage: »Wenn irgendein Mann bei euch oder in euren künftigen Generationen wegen einer Leiche unrein ist[b] oder auf einer fernen Reise ist[c], soll er das Passa für Jahwe feiern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“; die Bezeichnung meint hier die Gemeinschaft Israels.'
    reason: Die wörtliche, männlich formulierte Bundesbezeichnung wird beibehalten und ihr gemeinschaftlicher Bezug erläutert.
  - marker: b
    text: 'Oder: „durch einen Toten unrein“. Die hebräische Wendung lautet wörtlich etwa „unrein in Bezug auf eine Person/eine Seele“ und bezeichnet hier die durch einen Leichnam verursachte kultische Unreinheit.'
    reason: Die kontextbedingte Bedeutung des hebräischen Ausdrucks wird transparent gemacht.
  - marker: c
    text: 'Wörtlicher: „auf einem fernen Weg“.'
    reason: Die Fußnote bewahrt das konkrete Bild des hebräischen Ausdrucks neben der idiomatischen Haupttextfassung.
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Rede zu den Söhnen Israels und sag
  rationale: Die Wendung gibt den göttlichen Redeauftrag direkt und in natürlichem, würdigem Deutsch wieder; „Söhne Israels“ bewahrt die konkrete hebräische Formulierung.
- source_word: אִישׁ אִישׁ
  choice: irgendein Mann
  rationale: 'Die Wiederholung hat distributive Bedeutung: Gemeint ist jeder einzelne Mann, auf den einer der genannten Fälle zutrifft.'
- source_word: טָמֵא לָנֶפֶשׁ
  choice: wegen einer Leiche unrein
  rationale: נֶפֶשׁ bezeichnet in diesem kultrechtlichen Zusammenhang einen verstorbenen Menschen beziehungsweise eine Leiche als Ursache ritueller Unreinheit.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: sich auf einer weiten Reise befindet
  rationale: Die idiomatische deutsche Wiedergabe vermittelt, dass jemand wegen einer Reise weit entfernt ist; die wörtlichere Fassung wird in einer Fußnote genannt.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: bei euch oder in euren künftigen Generationen
  rationale: 'Die Präpositionalgruppen bestimmen den Geltungsbereich der Anweisung: Sie betrifft sowohl die gegenwärtige Gemeinschaft als auch spätere Generationen.'
- source_word: וְעָשָׂה פֶסַח
  choice: soll er das Passa feiern
  rationale: עשה mit פֶסַח ist eine feste Wendung für das Begehen beziehungsweise Feiern des Passafestes. Das Waw führt hier zur Rechtsfolge; ein nicht ausdrücklich vorhandenes „dennoch“ wird nicht ergänzt.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet Jahwe als denjenigen, dem die Passafeier gilt; „für“ ist im Deutschen bei einer kultischen Feier natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Form der Rechtsbestimmung
  choice: irgendein Mann
  alternative: jemand
  rationale: אִישׁ אִישׁ ist grammatisch und lexikalisch männlich und distributiv. Die Übersetzung bewahrt diese Form, ohne den rechtlichen Anwendungsbereich über den Wortlaut hinaus näher festzulegen.
- issue: Zuordnung von לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: bei euch oder in euren künftigen Generationen
  alternative: für euch oder für eure Generationen
  rationale: Die Wendung wird sinnvoll auf den Personenkreis beziehungsweise zeitlichen Geltungsbereich bezogen. Die hebräische Stellung lässt eine etwas formellere Zuordnung zum ganzen Bedingungssatz zu, ohne den sachlichen Sinn wesentlich zu verändern.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Rechtssatzton. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt. „Passa“ ist die etablierte deutsche biblische Bezeichnung; „feiern“ gibt die hebräische Kollokation natürlich wieder. Alle erklärungsbedürftigen Abweichungen von einer streng wörtlichen Wiedergabe sind knapp in Fußnoten ausgewiesen.
