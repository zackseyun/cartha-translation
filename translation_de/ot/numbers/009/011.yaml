  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: de
  text: Im zweiten Monat, am vierzehnten Tag, zur Abendzeit[a], sollen sie es feiern. Sie sollen es mit ungesäuertem Brot und bitteren Kräutern essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen den Abenden“; die genaue zeitliche Einordnung dieser hebräischen Wendung ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: Im zweiten Monat
  rationale: חֹדֶשׁ bezeichnet im kalendarischen Zusammenhang einen Monat; die Präposition bildet eine natürliche Zeitangabe.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: am vierzehnten Tag
  rationale: Die hebräische Kardinalzahlkonstruktion mit יוֹם gibt idiomatisch ein Kalenderdatum an.
- source_word: בֵּין הָעַרְבַּיִם
  choice: in der Abenddämmerung
  rationale: Die Wendung bezeichnet den Zeitraum um Sonnenuntergang beziehungsweise die Dämmerung. Die natürliche deutsche Wiedergabe erhält den zeitlichen Sinn; die wörtliche Form steht in der Fußnote.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: sollen sie es feiern
  rationale: עשה mit dem Passa als Bezugsobjekt bedeutet hier, die vorgeschriebene Feier zu vollziehen beziehungsweise zu begehen. „Feiern“ ist in diesem kultischen Zusammenhang natürlich und verständlich.
- source_word: עַל מַצּוֹת
  choice: mit ungesäuertem Brot
  rationale: עַל drückt hier beim Essen Begleitung aus; מַצּוֹת bezeichnet ungesäuertes Brot.
- source_word: וּמְרֹרִים
  choice: und bitteren Kräutern
  rationale: Der Plural bezeichnet die bitteren Kräuter beziehungsweise bitteren Pflanzen, die zum Passa gegessen werden.
- source_word: יֹאכְלֻהוּ
  choice: Sie sollen es ... essen
  rationale: Das Qal-Imperfekt mit Suffix der dritten Person Maskulinum Singular verweist auf das Passa beziehungsweise das Passaopfer; „sollen“ entspricht dem rechtlich anweisenden Kontext.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Anweisung wird mit „sollen“ wiedergegeben; „feiern“ vermittelt den kultischen Sinn von עשה, ohne eine konfessionelle Deutung einzutragen.
