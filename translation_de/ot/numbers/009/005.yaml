source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: de
  text: Die Israeliten feierten das Passa im ersten Monat, am vierzehnten Tag des Monats, zur Abenddämmerung[a] in der Wüste Sinai; genau nach allem, was Jahwe Mose geboten hatte, taten sie es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen den Abenden“; die hebräische Wendung bezeichnet die Dämmerungszeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ אֶת־הַפֶּסַח
  choice: sie feierten … das Passa
  rationale: עָשָׂה bedeutet grundsätzlich „tun/machen“, bezeichnet zusammen mit פֶּסַח jedoch idiomatisch die Durchführung der Passafeier. „Das Passa feiern“ gibt diesen rituellen Sinn in natürlichem Deutsch wieder, ohne den Ausdruck auf Opfer oder Fest einzuengen.
- source_word: בָּרִאשׁוֹן
  choice: im ersten Monat
  rationale: Das substantivierte Zahlwort bezeichnet im anschließenden kalendarischen Zusammenhang den ersten Monat; „Monat“ wird zur Klarheit ergänzt.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: am vierzehnten Tag des Monats
  rationale: Dies gibt die hebräische Datumsformel klar und formnah wieder.
- source_word: בֵּין הָעַרְבַּיִם
  choice: zur Abenddämmerung
  rationale: Die wörtlich schwer verständliche Wendung „zwischen den Abenden“ bezeichnet die Dämmerungszeit. Die idiomatische Übersetzung steht im Text, die hebräische Ausdrucksweise in der Fußnote.
- source_word: בְּמִדְבַּר סִינָי
  choice: in der Wüste Sinai
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Steppenland; „Wüste Sinai“ ist im Deutschen die geläufige und sachlich passende Wiedergabe.
- source_word: כְּכֹל אֲשֶׁר
  choice: genauso, wie
  rationale: Die Formulierung betont, dass Israel dem erteilten Gebot vollständig entsprach. „Genauso, wie“ bewahrt diesen Nachdruck in natürlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ ist dessen geläufige deutsche Umschrift und ersetzt den Namen nicht durch einen Titel.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass das Gebot der beschriebenen Ausführung vorausging.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet „Söhne Israels“, fungiert hier jedoch als feste kollektive Bezeichnung des Volkes. „Die Israeliten“ gibt diesen Sinn im modernen Deutsch eindeutig und ohne eine sachlich unbeabsichtigte Beschränkung auf Männer wieder.
- source_word: כֵּן עָשׂוּ
  choice: taten es
  rationale: Die schlichte Wiedergabe bewahrt die abschließende Wiederaufnahme von עָשָׂה und unterstreicht den Gehorsam gegenüber dem Gebot.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ein Eigenname und nicht der Titel אֲדֹנָי. Deshalb wird der Name in geläufiger deutscher Form wiedergegeben.
- issue: Umfang der Bezeichnung פֶּסַח
  choice: das Passa
  alternative: das Passaopfer / das Passafest
  rationale: פֶּסַח kann je nach Zusammenhang das Opfer oder die gesamte Feier bezeichnen. Die allgemeinere Form „das Passa“ lässt den genauen Umfang hier offen und vermeidet eine unnötige Festlegung.
- issue: Kollektiver Ausdruck בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische Wendung bezeichnet idiomatisch das Bundesvolk als Ganzes. Die deutsche Kollektivbezeichnung bewahrt den gemeinten Umfang, während die wörtliche Alternative im heutigen Deutsch leicht ausschließlich männlich verstanden würde.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau bleibt nahe an der zeitlichen Abfolge des Hebräischen, wird jedoch für einen natürlichen deutschen Lesefluss leicht umgestellt. Die Wiederholung des Verbs עָשָׂה wird durch „feierten“ und abschließend „taten es“ nachvollziehbar gemacht.
