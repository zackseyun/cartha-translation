  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: de
  text: 'Und Jahwe redete zu Mose in der Wüste Sinai[a], im zweiten Jahr nach ihrem Auszug aus dem Land Ägypten, im ersten Monat, und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Sinai-Steppe“.'
    reason: Lexikalische Alternative für מִדְבָּר, das je nach Landschaft auch unbesiedeltes Steppenland bezeichnen kann.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … redete
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Redete“ ist eine natürliche, würdige Wiedergabe der göttlichen Rede und bewahrt mit „Und“ den hebräischen Erzählfluss.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet bei דבר den Adressaten der Rede; „zu Mose“ entspricht dem üblichen deutschen Ausdruck.
- source_word: בְּמִדְבַּר סִינַי
  choice: in der Wüste Sinai
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Steppengebiet. Die Formulierung bewahrt die hebräische Zuordnung zu Sinai.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: im zweiten Jahr
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: nach ihrem Auszug aus dem Land Ägypten
  rationale: Der Infinitiv mit לְ bildet hier eine zeitliche Angabe. „Nach ihrem Auszug“ gibt den nominalen Ereignisbezug knapp wieder; „Land“ bildet אֶרֶץ ausdrücklich ab.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: im ersten Monat
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Zeitangabe.
- source_word: לֵאמֹר
  choice: 'Er sprach:'
  rationale: לֵאמֹר leitet den in den folgenden Versen wiedergegebenen Redeinhalt ein. Ein neuer deutscher Satz mit Doppelpunkt ist natürlicher als das schwerfällige „indem er sagte“ und erhält die einleitende Funktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Zeitangabe bleibt in der Reihenfolge des Hebräischen erhalten. Der abschließende Redeeinleiter wird zur besseren deutschen Lesbarkeit als eigener Satz formuliert.
