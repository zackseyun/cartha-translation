review_pass:
  verdict: revise
  source_fidelity: Die wiederholte Abfolge ist korrekt wiedergegeben, ebenso die Ortskorrespondenz und das Lagern. „sich die Wolke über dem Zelt erhob“ kann jedoch bedeuten, dass sie sich an einer Position über dem Zelt lediglich nach oben bewegte. מֵעַל betont, dass sie von ihrer Position über dem Zelt weggenommen bzw. sich von dort erhob. „sich vom Zelt erhob“ gibt dies im modernen Deutsch idiomatischer wieder; eine Fußnote hält die wörtlichere räumliche Formulierung fest.
  naturalness: Der Satz ist insgesamt klares, modernes Standarddeutsch. Die Parallelität von „aufbrachen“ und „ihr Lager aufschlugen“ ist gelungen. Die Fassung „vom Zelt erhob“ ist in diesem erzählerischen Kontext ebenso natürlich und präziser.
  terminology: „Wolke“, „Israeliten“, „Zelt“, „sich niederließ“ und „ihr Lager aufschlagen“ sind angemessen. „Israeliten“ ist hier eine natürliche kollektive Wiedergabe von בני ישראל und sollte nicht künstlich durch eine nur männlich klingende Form ersetzt werden.
  issues:
  - severity: medium
    issue: Die Ausgangsposition der Wolke wird in „über dem Zelt erhob“ nicht eindeutig als Herkunft der Bewegung ausgedrückt.
    rationale: Das hebräische מֵעַל הָאֹהֶל gehört zum Erheben der Wolke und bedeutet „von über dem Zelt“. Die vorgeschlagene Anpassung wahrt diese Beziehung, ohne das Deutsche unnötig schwerfällig zu machen.
  revised_text: Immer wenn sich die Wolke vom Zelt erhob[a], brachen danach die Israeliten auf; und an dem Ort, wo sich die Wolke niederließ, dort schlugen die Israeliten ihr Lager auf.
