source:
  edition: WLC
  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: de
  text: Immer wenn sich die Wolke vom Zelt erhob[a], brachen danach die Israeliten auf; und an dem Ort, wo sich die Wolke niederließ, dort schlugen die Israeliten ihr Lager auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von über dem Zelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: Immer wenn sich ... erhob
  rationale: Die Verbindung לְפִי mit dem Infinitiv bezeichnet hier den wiederkehrenden Zeitpunkt beziehungsweise Umstand. „Immer wenn“ gibt diesen iterativen Sinn natürlich wieder; das intransitive „sich erhob“ wahrt, dass die hebräische Form auch als Aufsteigen verstanden werden kann.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Die übliche und kontextgemäße Wiedergabe von עָנָן.
- source_word: מֵעַל הָאֹהֶל
  choice: über dem Zelt
  rationale: מֵעַל bezeichnet die Ausgangslage oberhalb des Zeltes. Im Deutschen ergibt die Verbindung mit „sich erhob“ natürlich „über dem Zelt“; אֹהֶל wird wörtlich als „Zelt“ wiedergegeben.
- source_word: וְאַחֲרֵי כֵן
  choice: danach
  rationale: Das Adverb wahrt die ausdrücklich markierte zeitliche Abfolge, ohne schwerfällig zu wirken.
- source_word: יִסְעוּ
  choice: brachen ... auf
  rationale: Das Imperfekt hat im Zusammenhang wiederholende Bedeutung. „Brachen auf“ ist die natürliche deutsche Bezeichnung für den Beginn der jeweiligen Wanderetappe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Abstammungsbezeichnung bedeutet idiomatisch das Volk Israel insgesamt. „Die Israeliten“ ist im modernen Deutschen präzise und schließt Männer und Frauen ein; „Söhne Israels“ könnte hier fälschlich nur männliche Personen nahelegen.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: und an dem Ort, wo
  rationale: Diese Wiedergabe erhält die ausdrückliche Ortsangabe und klingt zugleich natürlich.
- source_word: יִשְׁכָּן
  choice: sich ... niederließ
  rationale: שׁכן kann „wohnen“, „sich niederlassen“ oder „ruhen“ bedeuten. Bei der Wolke bezeichnet es anschaulich ihr Verbleiben an einem Ort; „sich niederließ“ bewahrt zugleich die Wohn- beziehungsweise Niederlassungsnuance.
- source_word: שָׁם ... שָׁם
  choice: wo ... dort
  rationale: Die korrelative deutsche Konstruktion bewahrt die hervorgehobene räumliche Entsprechung des zweimaligen שָׁם.
- source_word: יַחֲנוּ
  choice: schlugen ... ihr Lager auf
  rationale: Das Imperfekt beschreibt wiederholtes Handeln. Die Wendung ist modern und idiomatisch für „lagern“ beziehungsweise „sein Lager beziehen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer erzählerischer Abfolge. Die parallelen wiederholten Handlungen werden durch Präteritum im iterativen Zusammenhang ausgedrückt. Keine Fußnote ist nötig, da „Zelt“ den hebräischen Wortlaut direkt wahrt und „Israeliten“ die kollektive Abstammungsbezeichnung im Deutschen eindeutig wiedergibt.
