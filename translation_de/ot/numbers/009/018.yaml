source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: de
  text: Auf Jahwes Befehl[a] brachen die Israeliten auf, und auf Jahwes Befehl schlugen sie ihr Lager auf. Solange die Wolke über der Wohnstätte blieb, lagerten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf den Mund Jahwes«; eine hebräische Wendung für eine verbindliche Anweisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: auf Jahwes Befehl
  rationale: Die Wendung bedeutet wörtlich »nach dem Mund Jahwes«, bezeichnet hier aber Jahwes maßgebende Anweisung. »Auf Jahwes Befehl« gibt das Idiom natürlich und präzise wieder.
- source_word: יִסְעוּ
  choice: brachen … auf
  rationale: נסע bezeichnet im Zusammenhang einer Wanderung das Aufbrechen vom bisherigen Lagerplatz. Die deutsche Wendung ist gegenwärtig und idiomatisch.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet »die Söhne Israels«; im Kontext bezeichnet sie jedoch das Volk insgesamt. »Die Israeliten« ist im modernen Deutschen natürlich und schließt die ganze Gemeinschaft ein, ohne den Sinn zu verändern.
- source_word: יַחֲנוּ
  choice: schlugen sie ihr Lager auf / blieben sie im Lager
  rationale: חנה bedeutet lagern. Beim ersten Vorkommen steht das Beziehen eines Lagerplatzes im Vordergrund; beim zweiten ergibt die Zeitangabe einen andauernden Zustand.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: solange
  rationale: Die hebräische Formulierung lautet näher am Wortlaut »alle Tage, die« und drückt die gesamte Dauer aus. »Solange« gibt dies knapp und natürlich wieder.
- source_word: יִשְׁכֹּן
  choice: blieb
  rationale: שׁכן kann »wohnen«, »sich niederlassen« oder »verweilen« bedeuten. Bei der Wolke bezeichnet es hier ihre fortdauernde Gegenwart über der Wohnstätte.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnstätte
  rationale: מִשְׁכָּן bezeichnet die tragbare heilige Wohnstätte Jahwes. »Wohnstätte« bewahrt den Bezug zur Wurzel שׁכן und vermeidet das heute wenig verständliche traditionelle Wort »Stiftshütte«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname יהוה wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. »Jahwe« gibt ihn in der im Deutschen üblichen wissenschaftlichen Form wieder und bewahrt die Unterscheidung von einem bloßen Titel.
- issue: Bezeichnung von מִשְׁכָּן
  choice: Wohnstätte
  alternative: Stiftshütte; Heiligtum; Zelt der Begegnung
  rationale: »Wohnstätte« gibt die lexikalische Bedeutung wieder. »Zelt der Begegnung« bezeichnet genauer אֹהֶל מוֹעֵד und wäre daher hier keine unmittelbare Entsprechung; »Heiligtum« würde den Wohnaspekt abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Bewegungen – Aufbrechen und Lagern – sind parallel formuliert. »Wohnstätte« bewahrt den sprachlichen Zusammenhang mit dem Verweilen der Wolke, bleibt aber ohne traditionelle Fachsprache verständlich.
