  text: וְ/יַעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת הַ/פָּ֖סַח בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: de
  text: Und die Söhne Israels sollen das Passafest zu seiner festgesetzten Zeit feiern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“; traditionell auch: „die Kinder Israels“. Wörtlich steht im Hebräischen: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: Und … sollen … feiern
  rationale: Das Präformativkonjugationsverb mit vorangestelltem וְ hat hier im Zusammenhang auffordernden Charakter. עשה bedeutet wörtlich „tun/machen“, bezeichnet mit פֶּסַח als Objekt aber idiomatisch das Begehen oder Feiern des Passafestes.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale verwandtschaftliche Wendung gibt das hebräische „Söhne Israels“ genau wieder; das geläufigere „die Israeliten“ wird als Alternative in der Fußnote genannt.
- source_word: הַפָּסַח
  choice: das Passafest
  rationale: פֶּסַח kann das Passa beziehungsweise dessen Begehung bezeichnen. „Passafest“ ist im Deutschen verständlich und lässt den Vers offen, ohne ihn ausdrücklich auf das Opfer oder nur auf einen einzelnen Ritus zu verengen.
- source_word: בְּמוֹעֲדוֹ
  choice: zu seiner festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet hier den festgesetzten Zeitpunkt; das Suffix der dritten Person Singular wird durch „seiner“ wiedergegeben und auf das Passafest bezogen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung „Und“ bewahrt das einleitende וְ; „sollen“ gibt den auffordernden Sinn natürlich wieder. „Passafest feiern“ ist eine im heutigen Deutschen verständliche idiomatische Wiedergabe.
