    rationale: Das Nifal von עלה wird hier natürlich intransitiv als „sich erheben/aufsteigen“ wiedergegeben. Eine passive Deutung („emporgehoben wurde“) kann als Auslegungsnuance genannt werden, sollte aber nicht als gleichwertige direkte grammatische Aussage der Form behauptet werden.
  - severity: low
    issue: „sich ... hob“ und der Wechsel zu „sobald“ schwächen die idiomatische und formale Parallelität.
    rationale: „Die Wolke sich erhob“ ist im modernen Deutschen geläufiger. Die Wiederholung von „Wenn ... sich erhob, brachen sie auf“ entspricht der wiederholten hebräischen Struktur.
  - severity: low
