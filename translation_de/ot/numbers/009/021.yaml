  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: de
  text: Manchmal blieb die Wolke vom Abend bis zum Morgen. Wenn die Wolke sich am Morgen erhob[a], brachen sie auf. Oder sie blieb einen Tag und eine Nacht lang; wenn die Wolke sich erhob, brachen sie auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn die Wolke emporgehoben wurde“. Das hebräische Verb bedeutet wörtlich „sich erheben/aufsteigen“; im Zusammenhang kann das Erheben der Wolke als Aufbruchssignal verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Manchmal
  rationale: Die hebräische Wendung führt einen gelegentlich eintretenden Fall innerhalb des zuvor beschriebenen Ablaufs ein. „Manchmal“ gibt dies knapp und natürlich wieder.
- source_word: יִהְיֶה הֶעָנָן
  choice: blieb die Wolke
  rationale: היה bezeichnet zusammen mit der Zeitspanne das fortdauernde Verweilen der Wolke; „blieb“ macht diesen durativen Sinn im Deutschen deutlich.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: vom Abend bis zum Morgen
  rationale: Die Formulierung bildet Anfang und Ende der Zeitspanne unmittelbar und idiomatisch ab.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: wenn/sobald sich die Wolke hob
  rationale: Das Nifal von עלה beschreibt hier das Sichheben der Wolke als Aufbruchssignal. „Sich hob“ ist im Deutschen natürlich und lässt offen, ob der Vorgang lediglich beschrieben oder als bewirkt verstanden wird.
- source_word: וְנָסָעוּ
  choice: brachen sie auf
  rationale: נסע bezeichnet im Zusammenhang der Wüstenwanderung den Abmarsch vom Lagerplatz. „Aufbrechen“ gibt dies präzise und geläufig wieder.
- source_word: יוֹמָם וָלַיְלָה
  choice: einen Tag und eine Nacht
  rationale: Im vorliegenden Zusammenhang bezeichnet die Wendung die Dauer des Verweilens der Wolke, nicht bloß Tages- und Nachtzeit.
theological_decisions:
- issue: Handlungsträger beim Heben der Wolke
  choice: „sich die Wolke hob“
  alternative: „die Wolke emporgehoben wurde“
  rationale: Die reflexive deutsche Form gibt den sichtbaren Vorgang wieder, ohne einen im Satz nicht genannten Handlungsträger einzuführen; die mögliche passive Auffassung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Satzstruktur bildet den geregelten Ablauf ab; „sobald“ im zweiten Fall vermeidet schwerfällige Wiederholung, ohne den zeitlichen Zusammenhang zu verändern.
