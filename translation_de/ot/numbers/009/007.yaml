  text: וַ֠/יֹּאמְרוּ הָ/אֲנָשִׁ֤ים הָ/הֵ֨מָּה֙ אֵלָ֔י/ו אֲנַ֥חְנוּ טְמֵאִ֖ים לְ/נֶ֣פֶשׁ אָדָ֑ם לָ֣/מָּה נִגָּרַ֗ע לְ/בִלְתִּ֨י הַקְרִ֜ב אֶת קָרְבַּ֤ן יְהוָה֙ בְּ/מֹ֣עֲד֔/וֹ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: de
  text: 'Da sagten jene Männer zu ihm: „Wir sind wegen der Leiche eines Menschen unrein.[a] Warum sollen wir davon ausgeschlossen sein, die Opfergabe für Jahwe zu ihrer festgesetzten Zeit inmitten der Israeliten darzubringen?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „unrein wegen der Seele eines Menschen“; der hebräische Ausdruck bezeichnet kultische Unreinheit aufgrund einer menschlichen Leiche.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Warum sollen wir daran gehindert werden, die Opfergabe für Jahwe … darzubringen?“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: Da sagten jene Männer zu ihm
  rationale: Die narrative Verbform wird im Deutschen natürlich mit „Da sagten“ wiedergegeben; „jene Männer“ bewahrt den rückverweisenden Demonstrativausdruck.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: wegen der Leiche eines Menschen unrein
  rationale: Der kultisch-rechtliche Ausdruck bezeichnet Unreinheit infolge einer menschlichen Leiche. Die Wiedergabe macht den idiomatischen Sinn deutlich, ohne bloßen Kontakt ausdrücklich in den Text einzutragen.
- source_word: נִגָּרַע
  choice: sollen wir davon ausgeschlossen sein
  rationale: Der Niphal bezeichnet hier den Ausschluss beziehungsweise das Fernhalten von der Teilnahme; die passive Nuance bleibt erhalten.
- source_word: לְבִלְתִּי הַקְרִב
  choice: die ... Opfergabe ... darzubringen
  rationale: הקריב ist im Opferkontext „darbringen“; zusammen mit לְבִלְתִּי bezeichnet die Konstruktion das Verhindertsein an dieser Handlung.
- source_word: קָרְבַּן יְהוָה
  choice: die Opfergabe für Jahwe
  rationale: קָרְבָּן bezeichnet eine Gott dargebrachte Gabe. „Für Jahwe“ gibt die Zielrichtung im Deutschen klar wieder, während der Gottesname als Eigenname erscheint.
- source_word: בְּמֹעֲדוֹ
  choice: zu ihrer festgesetzten Zeit
  rationale: מוֹעֵד meint hier den vorgeschriebenen Zeitpunkt der Opfergabe; das feminine Pronomen bezieht sich im Deutschen auf „Opfergabe“.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: inmitten der Israeliten
  rationale: „Israeliten“ ist die natürliche deutsche Wiedergabe des etablierten hebräischen Volksnamens „Söhne Israels“ und schließt hier das ganze Volk ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der durch לְנֶפֶשׁ אָדָם bezeichneten Unreinheit
  choice: wegen der Leiche eines Menschen unrein
  alternative: durch Berührung mit einer menschlichen Leiche unrein
  rationale: Der Ausdruck bezeichnet Leichenunreinheit. Da der Vers selbst die Berührung nicht ausdrücklich formuliert, bleibt die Hauptfassung knapp und vermeidet eine unnötige Präzisierung.
- issue: Genitivbeziehung in קָרְבַּן יְהוָה
  choice: Opfergabe für Jahwe
  alternative: Opfergabe Jahwes
  rationale: Der Kontext versteht die Gabe als Jahwe dargebracht. Die gewählte Formulierung ist im modernen Deutsch eindeutig, ohne die kultische Zugehörigkeit umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Fachbegriffe werden verständlich, aber nicht umschreibend wiedergegeben. Die direkte Rede behält den protestierenden Frageton; „Israeliten“ dient als geläufiger deutscher Volksname.
