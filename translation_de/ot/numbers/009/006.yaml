source:
  edition: WLC
  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: de
  text: Es gab Männer, die wegen des Leichnams eines Menschen unrein waren[a] und deshalb an jenem Tag das Passafest nicht begehen konnten. Sie traten an jenem Tag vor Mose und Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unrein für/bei der נֶפֶשׁ eines Menschen“; die hebräische Wendung bezeichnet hier Unreinheit, die durch einen menschlichen Leichnam verursacht wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: Es gab Männer
  rationale: Die Formulierung führt einen neuen erzählerischen Umstand ein. „Es gab Männer“ ist natürliches modernes Deutsch und bewahrt die ausdrücklich männliche Bezeichnung.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: wegen einer menschlichen Leiche unrein
  rationale: Die Wendung bezeichnet im priesterlichen Reinheitsrecht rituelle Unreinheit aufgrund einer menschlichen Leiche; sie ist nicht als moralische Verfehlung zu verstehen.
- source_word: וְלֹא יָכְלוּ
  choice: und deshalb … nicht … konnten
  rationale: '„Deshalb“ verdeutlicht den im Zusammenhang gegebenen Folgebezug: Die Unreinheit verhinderte die Teilnahme.'
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: das Passafest begehen
  rationale: Das hebräische Idiom lautet wörtlich „das Passa tun“ und meint, es vorschriftsgemäß zu halten. „Begehen“ ist im Deutschen verständlich, würdig und weniger einseitig festlich als „feiern“.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Gibt die Zeitangabe direkt und idiomatisch wieder; ihre Wiederholung im Vers bleibt erhalten.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: Sie traten … vor
  rationale: „Vor Mose und Aaron treten“ gibt sowohl die Annäherung als auch לִפְנֵי natürlich wieder, ohne die Begegnung ausdrücklich als förmliche Rechtssache auszudeuten.
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: Mose … Aaron
  rationale: Verwendet die im Deutschen etablierten biblischen Namensformen.
theological_decisions:
- issue: Art der Unreinheit
  choice: Rituelle Unreinheit aufgrund einer menschlichen Leiche
  alternative: 'Wörtlicher: „unrein wegen der Seele/dem Leben eines Menschen“'
  rationale: Im Kontext des pentateuchischen Reinheitsrechts ist נֶפֶשׁ אָדָם hier eine idiomatische Bezeichnung für einen menschlichen Leichnam. Die Wiedergabe vermeidet, moralische Schuld in den Text hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „an jenem Tag“ entspricht der hebräischen Hervorhebung; der zweite Hauptsatz vermeidet eine im Deutschen schwerfällige Kette mit Semikolon.
