  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְ/אֶשְׁמְעָ֔ה מַה יְצַוֶּ֥ה יְהוָ֖ה לָ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: de
  text: 'Da sagte Mose zu ihnen: „Wartet,[a] und ich will hören, was Jahwe euch gebieten wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Steht“; auch: „Bleibt stehen“ oder „Steht bereit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt die fortschreitende hebräische Erzählfolge in natürlichem modernem Deutsch wieder.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: Entspricht schlicht und unmittelbar der Präposition mit dem Suffix der 3. Person maskulin Plural.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Verwendet die im Deutschen etablierte Namensform.
- source_word: עִמְדוּ
  choice: Wartet hier
  rationale: Das Verb bedeutet wörtlich „steht“, hat hier aber idiomatisch den Sinn, an Ort und Stelle zu bleiben und zu warten. „Hier“ macht diesen kontextuellen Sinn im Deutschen natürlich deutlich; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: וְאֶשְׁמְעָה
  choice: damit ich höre
  rationale: Die Kohortativform drückt Moses Absicht aus, die Antwort Jahwes zu vernehmen. „Damit“ stellt den sachlichen Bezug zum vorausgehenden Warten idiomatisch her, ohne die Quelle der Antwort ausdrücklich zu ergänzen.
- source_word: מַה
  choice: was
  rationale: Gibt das Fragepronomen wieder, das den Inhalt des erwarteten Gebots einleitet.
- source_word: יְצַוֶּה
  choice: gebieten wird
  rationale: Das Piel von צוה bezeichnet ein verbindliches Gebieten oder Anordnen; das Futur entspricht der erwarteten, noch ausstehenden Weisung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen in der im Deutschen geläufigen Form wieder, statt es durch einen Titel zu ersetzen.
- source_word: לָכֶם
  choice: euch
  rationale: Der Dativ lässt im Deutschen bewusst offen, ob das Gebot an die Männer gerichtet ist oder ihre Angelegenheit betrifft, und bewahrt damit die semantische Spannweite der hebräischen Präposition.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen und vermeidet die Ersetzung durch einen Titel.
- issue: Bezug von לָכֶם
  choice: euch
  alternative: über euch / in eurem Fall
  rationale: Das knappe deutsche Dativpronomen bewahrt die im Hebräischen mögliche Spannung zwischen einem an sie gerichteten Gebot und einer ihre Lage betreffenden Weisung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die direkte Rede bleibt knapp; der Gottesname wird als „Jahwe“ wiedergegeben. Der Fußnotenmarker steht unmittelbar nach der idiomatischen Wiedergabe des Imperativs.
