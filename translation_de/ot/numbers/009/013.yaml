source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: de
  text: Doch wenn ein Mann rein ist und sich nicht auf einer Reise befindet, es aber unterlässt, das Passafest zu feiern, soll dieser Mensch aus seinem Volk ausgerottet werden[a]; denn er hat Jahwes Opfergabe nicht zu seiner festgesetzten Zeit dargebracht. Dieser Mann muss seine Sünde tragen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Rechtsformel bezeichnet ein schweres Bundesgericht, ohne hier näher zu bestimmen, wie dieses vollzogen wird.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Schuld tragen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: rein
  rationale: Im Zusammenhang bezeichnet das Wort kultische beziehungsweise rituelle Reinheit, nicht in erster Linie moralische Makellosigkeit.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: sich nicht auf einer Reise befindet
  rationale: Die Wendung bezeichnet das Unterwegssein und entspricht dem im Kontext genannten Hinderungsgrund einer Reise.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: es aber unterlässt, das Passafest zu feiern
  rationale: חָדַל bezeichnet hier das bewusste oder schuldhafte Unterlassen; לעשות הפסח meint die Durchführung der Passafeier, zu der das Opfer gehört.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: soll dieser Mensch aus seinem Volk ausgerottet werden
  rationale: נֶפֶשׁ bezeichnet hier die betreffende Person. „Ausgerottet werden“ bewahrt die gewichtige, aber hinsichtlich ihrer konkreten Vollstreckung nicht näher bestimmte Rechtsformel.
- source_word: קָרְבַּן יְהוָה
  choice: Jahwes Opfergabe
  rationale: קָרְבָּן ist eine Gott dargebrachte Gabe; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בְּמֹעֲדוֹ
  choice: zu ihrer festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet den verbindlich bestimmten Zeitpunkt. Das feminine Pronomen bezieht sich im Deutschen natürlich auf „Opfergabe“.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: muss seine Sünde tragen
  rationale: Die Formulierung bewahrt das hebräische Rechts- und Schuldidiom, das sowohl Schuldhaftigkeit als auch die daraus erwachsenden Folgen einschließen kann.
theological_decisions:
- issue: Bedeutung der Strafe „ausgerottet werden“
  choice: Die Rechtsformel bleibt ohne nähere Festlegung erhalten.
  alternative: „aus der Gemeinschaft ausgeschlossen werden“ oder „getötet werden“
  rationale: Der Vers bestimmt nicht ausdrücklich, ob die Formel Tod, Ausschluss oder ein unmittelbares göttliches Gericht bezeichnet. Eine präzisierende Wiedergabe würde die vorhandene Spannung auflösen.
- issue: Bedeutung von „seine Sünde tragen“
  choice: Das Bild wird wörtlich und offen wiedergegeben.
  alternative: „seine Schuld tragen“ oder „für seine Sünde büßen“
  rationale: Das hebräische Idiom kann Schuld und deren Folgen umfassen; „Sünde tragen“ legt sich nicht unnötig auf nur einen Aspekt fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Passafest feiern“ macht die gemeinte Durchführung der Passafeier verständlich, während „Opfergabe dargebracht“ den ausdrücklich genannten kultischen Aspekt bewahrt. Die Satzstruktur erhält den nachdrücklichen Abschluss „Dieser Mann …“.
