  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/עֲשֹׂ֥ת הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/004.yaml
  text: So Moses told the sons of Israel to keep the Passover.
translation:
  language: de
  text: Da sagte Mose zu den Israeliten, sie sollten das Passafest feiern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sagte
  rationale: Das Verb bedeutet wörtlich „sprechen“; in Verbindung mit dem folgenden Zweck- bzw. Inhaltsausdruck gibt „sagte …, sie sollten“ die kommunikative Funktion natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich „die Söhne Israels“; als feste Bezeichnung für das Volk ist „die Israeliten“ im modernen Deutsch klar und idiomatisch.
- source_word: לַעֲשֹׂת
  choice: sie sollten … feiern
  rationale: Wörtlich „zu tun/auszuführen“; beim Passa bezeichnet עשה dessen ordnungsgemäße Begehung. Der abhängige Aufforderungsinhalt wird im Deutschen natürlich mit „sollten“ ausgedrückt.
- source_word: הַפָּסַח
  choice: das Passafest
  rationale: Hier ist die kultische Passafeier gemeint; „Passafest“ ist für heutige Leser eindeutiger als das alleinstehende „Passa“.
