  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: de
  text: Auf den Befehl Jahwes hin lagerten sie, und auf den Befehl Jahwes hin brachen sie auf. Sie hielten die Weisung Jahwes ein, auf den Befehl Jahwes hin durch Mose[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand Moses«; eine hebräische Wendung, die Mose als Vermittler oder Beauftragten bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: auf den Befehl … hin / gemäß dem Befehl
  rationale: Die Wendung bedeutet wörtlich »auf den Mund von«, bezeichnet hier aber eine maßgebliche Anweisung. Die gewählten Formulierungen geben diesen idiomatischen Sinn in natürlichem Deutsch wieder und bewahren die Wiederholung im hebräischen Text.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben, sodass der im Ausgangstext ausdrücklich gebrauchte Eigenname erhalten bleibt.
- source_word: יַחֲנוּ
  choice: sie lagerten
  rationale: Das Verb bezeichnet das Lagern beziehungsweise Verweilen im Lager. »Sie lagerten« ist knapp, verständlich und passt zum zusammenfassenden Charakter des Verses.
- source_word: יִסָּעוּ
  choice: sie brachen auf
  rationale: Im Zusammenhang der Wüstenwanderung bezeichnet das Verb den Aufbruch von einem Lagerplatz. »Sie brachen auf« gibt diesen Vorgang präzise und idiomatisch wieder.
- source_word: מִשְׁמֶרֶת
  choice: Anordnung
  rationale: Das Substantiv bezeichnet etwas zur Beachtung oder Einhaltung Anvertrautes. »Anordnung« wahrt den verpflichtenden Sinn und verbindet sich im Deutschen natürlich mit »sich an etwas halten«.
- source_word: שָׁמָרוּ
  choice: sie hielten sich an
  rationale: Das Verb kann »bewahren«, »beachten« oder »einhalten« bedeuten. Zusammen mit מִשְׁמֶרֶת bringt »sich an die Anordnung halten« den Gehorsamsaspekt in gegenwärtigem Deutsch klar zum Ausdruck.
- source_word: בְּיַד מֹשֶׁה
  choice: der durch Mose erging
  rationale: Die wörtliche Wendung »durch die Hand Moses« bezeichnet Mose als Vermittler des göttlichen Befehls. Die Wiedergabe ist natürlich und lässt die vermittelte Urheberschaft Jahwes deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der hebräische Text den Tetragrammaton verwendet, bewahrt »Jahwe« den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Jahwes Befehl und Moses Vermittlung
  choice: der durch Mose erging
  alternative: durch die Hand Moses
  rationale: Der Befehl bleibt ausdrücklich Jahwes Befehl; Mose wird als dessen Vermittler dargestellt. Die idiomatische Wiedergabe legt keine weitergehende Lehre über Inspiration oder Vermittlung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Bezugnahme auf Jahwes Befehl bleibt als prägendes Stilmerkmal erhalten; die hebräische Vermittlungsformel wird im Text idiomatisch und in der Fußnote wörtlich wiedergegeben.
