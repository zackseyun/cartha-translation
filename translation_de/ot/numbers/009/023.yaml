- from: Auf den Befehl Jahwes hin lagerten sie, und auf den Befehl Jahwes hin brachen sie auf. Sie hielten sich an die Anordnung Jahwes, gemäß dem Befehl Jahwes, der durch Mose[a] erging.
  to: Auf den Befehl Jahwes hin lagerten sie, und auf den Befehl Jahwes hin brachen sie auf. Sie hielten die Weisung Jahwes ein, auf den Befehl Jahwes hin durch Mose[a].
  rationale: Die Revision bewahrt die dreifache Wiederholung von Jahwes Befehl, die knappe Bewegungsterminologie und die Vermittlung durch Mose. Sie ersetzt die schwerfällige Relativsatzlösung durch eine direkte, quellentreue Anbindung von „durch Mose“ und verwendet mit „Weisung ... einhalten“ eine natürlichere deutsche Entsprechung für מִשְׁמֶרֶת שׁמר.
