    rationale: Er lässt „durch Mose“ ausschließlich als Eigenschaft des unmittelbar vorhergehenden „Befehls“ erscheinen und formuliert die hebräische Vermittlungsformel umständlich. Eine direkte Anbindung an „auf den Befehl Jahwes hin“ gibt die Konstruktion klarer wieder.
  - severity: low
