  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: de
  text: Und wenn ein Fremder bei euch lebt und das Passah[a] für Jahwe feiern will, soll er es nach der Satzung des Passahs und nach der dafür geltenden Ordnung tun. So soll er es halten. Eine einzige Satzung soll für euch gelten, für den Fremden[b] wie für den Einheimischen des Landes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Passah für Jahwe machen«. Gemeint ist, das Passah vorschriftsgemäß zu begehen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen ansässigen Fremden, der unter den Israeliten lebt, nicht bloß einen Reisenden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »den im Land Geborenen« beziehungsweise »den Landeseinheimischen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit der vorausgehenden Regelung als auch den konditionalen Charakter.
- source_word: יָגוּר ... גֵּר
  choice: ein Fremder bei euch lebt
  rationale: גֵּר bezeichnet hier einen dauerhaft unter Israel lebenden Fremden, nicht lediglich einen Durchreisenden. Die Fußnote präzisiert diesen rechtlichen und sozialen Status.
- source_word: וְעָשָׂה פֶסַח
  choice: das Passah ... feiern will
  rationale: Die hebräische Wendung »das Passah tun/machen« bezeichnet dessen rituelle Begehung. Der Kontext legt bei der konditionalen Fallregel den Wunsch zur Teilnahme nahe.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet die Ausrichtung beziehungsweise Widmung der Feier; der Gottesname wird als Jahwe wiedergegeben.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: nach der Satzung des Passahs
  rationale: חֻקָּה hat rechtlich-kultischen Sinn und bezeichnet eine verbindliche Festsetzung.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: nach der dafür geltenden Ordnung
  rationale: מִשְׁפָּט bezeichnet hier die maßgebliche Regelung oder Verfahrensordnung der Passahfeier. »Dafür geltend« macht den pronominalen Rückbezug natürlich verständlich.
- source_word: כֵּן יַעֲשֶׂה
  choice: So soll er es halten
  rationale: Gibt die nachdrückliche Forderung wieder, das Passah genau in der vorgeschriebenen Weise zu begehen.
- source_word: חֻקָּה אַחַת יִהְיֶה לָכֶם
  choice: Eine einzige Satzung soll für euch gelten
  rationale: Betont wie das Hebräische die Einheitlichkeit und Verbindlichkeit der Regel.
- source_word: וְלַגֵּר וּלְאֶזְרַח הָאָרֶץ
  choice: für den Fremden wie für den Einheimischen des Landes
  rationale: Die Konstruktion stellt beide Gruppen hinsichtlich dieser Satzung gleich; »Einheimischer« vermeidet moderne staatsrechtliche Vorstellungen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Geltungsbereich der einen Satzung
  choice: Dieselbe Passahsatzung gilt für den ansässigen Fremden und den Einheimischen
  alternative: Eine allgemeine, über den Passahkontext hinausgehende rechtliche Gleichstellung
  rationale: Der Satz betont eindeutig eine einheitliche Regel, doch der unmittelbare Kontext begrenzt die Aussage auf die vorgeschriebene Passahfeier. Die Übersetzung weitet sie nicht stillschweigend aus.
- issue: Teilnahmeabsicht des Fremden
  choice: feiern will
  alternative: feiert; feiern wird
  rationale: Im konditionalen Gesetzesfall beschreibt וְעָשָׂה die beabsichtigte Begehung. Die Formulierung drückt dies aus, ohne eine zusätzliche Verpflichtung zur Teilnahme zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-kultischer Klarheit. »Satzung« und »Ordnung« erhalten die begriffliche Unterscheidung zwischen חֻקָּה und מִשְׁפָּט, ohne altertümlich zu wirken. Alle Fußnotenmarker stehen unmittelbar an den einschlägigen Ausdrücken.
