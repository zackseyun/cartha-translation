  text: בְּ/אַרְבָּעָ֣ה עָשָֽׂר י֠וֹם בַּ/חֹ֨דֶשׁ הַ/זֶּ֜ה בֵּ֧ין הָֽ/עֲרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖/וֹ בְּ/מוֹעֲד֑/וֹ כְּ/כָל חֻקֹּתָ֥י/ו וּ/כְ/כָל מִשְׁפָּטָ֖י/ו תַּעֲשׂ֥וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: de
  text: Am vierzehnten Tag dieses Monats, zwischen den Abenden[a], sollt ihr es zu seiner festgesetzten Zeit feiern. Nach allen seinen Satzungen und nach allen seinen Rechtsbestimmungen sollt ihr es feiern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen den Abenden“; eine traditionelle hebräische Zeitangabe für den Zeitraum um die Abenddämmerung. Ihre genaue zeitliche Abgrenzung ist nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: Am vierzehnten Tag dieses Monats
  rationale: Die hebräische Datumsangabe wird in natürliches, präzises Standarddeutsch übertragen.
- source_word: בֵּין הָעַרְבַּיִם
  choice: zwischen den Abenden
  rationale: Die wörtliche Wiedergabe bewahrt die besondere hebräische Zeitangabe und lässt ihre genaue zeitliche Abgrenzung offen; eine Fußnote erläutert die Wendung.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: sollt ihr es feiern
  rationale: עָשָׂה bedeutet grundsätzlich „tun/machen“, bezeichnet mit dem Passafest als Bezug jedoch dessen Begehung. „feiern“ ist im Deutschen idiomatisch und bewahrt in beiden Vorkommen die Wiederholung.
- source_word: בְּמוֹעֲדוֹ
  choice: zu seiner festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet hier den verbindlich bestimmten Zeitpunkt des Festes.
- source_word: כְּכָל חֻקֹּתָיו
  choice: nach allen seinen Satzungen
  rationale: חֻקּוֹת bezeichnet festgesetzte kultisch-rechtliche Anordnungen; „Satzungen“ erhält den formellen Charakter.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: und nach allen seinen Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet verbindliche rechtliche Regelungen. „Rechtsbestimmungen“ unterscheidet den Ausdruck von חֻקּוֹת, ohne den Zusammenhang künstlich zu präzisieren.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „feiern“ die im Zusammenhang idiomatische Bedeutung von עָשָׂה wiedergibt. Die Wiederholung des abschließenden Befehls wurde beibehalten.
