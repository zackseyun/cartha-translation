  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: de
  text: Sie sollen nichts davon bis zum Morgen übrig lassen. Keinen Knochen davon sollen sie zerbrechen.[a][b] Sie sollen es gemäß der gesamten Vorschrift für das Passafest begehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Näher am hebräischen Singular und Präpositionalbezug: „Einen Knochen sollen sie an ihm nicht zerbrechen.“'
    reason: lexical_alternative
  - marker: b
    text: Vgl. 2. Mose 12,46; die Vorschrift, keinen Knochen zu zerbrechen, wird in Johannes 19,36 aufgegriffen.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: sie sollen nichts davon bis zum Morgen übrig lassen
  rationale: Der Hifil von שׁאר bedeutet „übrig lassen/zurücklassen“; מן mit Suffix ist hier partitiv. Die Formulierung gibt das Verbot natürlich und vollständig wieder.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: Keinen seiner Knochen sollen sie zerbrechen
  rationale: Das singularische עֶצֶם ist distributiv zu verstehen. Das verneinte „keinen seiner Knochen“ ist im Deutschen idiomatisch und bewahrt den umfassenden Sinn; בוֹ bezeichnet die Zugehörigkeit zum Passaopfer.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: nach der ganzen Vorschrift für das Passafest
  rationale: חֻקָּה bezeichnet eine festgesetzte Vorschrift; כָּל mit dem Singular meint hier die Vorschrift in ihrem ganzen Umfang. „Passafest“ lässt den rituellen Bezug erkennen, ohne den Ausdruck auf das Opfertier zu verengen.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: sie sollen es … begehen
  rationale: עשה kann in Verbindung mit einem Fest oder Ritus „begehen/halten“ bedeuten. „Begehen“ ist in modernem Deutsch natürlich und bezieht das Pronomen auf das Passafest beziehungsweise seine Feier.
theological_decisions:
- issue: Mögliche christologische Bedeutung der Vorschrift, keinen Knochen zu zerbrechen
  choice: Die Vorschrift wird im Haupttext als Passaregel wiedergegeben; ihre spätere christologische Aufnahme wird nicht in den Wortlaut eingetragen.
  alternative: Den Haupttext sprachlich so gestalten, dass die neutestamentliche Erfüllung ausdrücklich hervortritt.
  rationale: Im unmittelbaren Kontext regelt der hebräische Text die Passafeier. Die Übersetzung soll diese Aussage unverändert wiedergeben; weiterführende kanonische Bezüge können als Querverweis kenntlich gemacht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge des Hebräischen zu verändern. „Passafest“ macht deutlich, dass הַפֶּסַח hier den Ritus beziehungsweise seine Feier bezeichnen kann.
