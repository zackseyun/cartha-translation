lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da redete
  rationale: Das Waw mit der narrativen Verbform führt die Erzählung weiter. „Da redete“ gibt die zeitliche Folge in natürlichem, würdigem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten; „zu Mose“ ist die übliche deutsche Verbindung mit „reden“.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die Infinitivform leitet die folgende wörtliche Rede ein. „Und sagte“ vermeidet das im Deutschen schwerfällige „indem er sagte“ und bewahrt die einleitende Funktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. Die Umschrift „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersatzlesung „der HERR“ wird nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die knappe Redeeinleitungsformel des Hebräischen bleibt erkennbar, ohne unnatürliche deutsche Syntax.
