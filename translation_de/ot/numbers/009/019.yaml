source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: de
  text: Wenn die Wolke viele Tage über der Stiftshütte blieb, hielten die Söhne Israels[a] die Weisung Jahwes ein[b] und brachen nicht auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ beziehungsweise „die Kinder Israels“. Wörtlich steht im Hebräischen: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bewahrten die Anordnung Jahwes“; wörtlicher: „hielten die Verpflichtung Jahwes ein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ הֶעָנָן
  choice: Wenn die Wolke … blieb
  rationale: Die Präposition ב mit dem Infinitiv von אָרַךְ leitet einen Temporalsatz ein und bezeichnet hier ein längeres Verweilen. Die deutsche Formulierung gibt dies natürlich wieder.
- source_word: עַל הַמִּשְׁכָּן
  choice: über der Stiftshütte
  rationale: מִשְׁכָּן bezeichnet in diesem Zusammenhang das tragbare Heiligtum Israels. „Stiftshütte“ ist die im Deutschen verständliche, eingebürgerte Bezeichnung; עַל beschreibt die Position der Wolke darüber.
- source_word: יָמִים רַבִּים
  choice: viele Tage
  rationale: Die konkrete Zeitangabe des Hebräischen wird bewahrt und nicht zum allgemeineren „lange Zeit“ verflacht.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Formulierung bildet die hebräische verwandtschaftlich-bundestheologische Ausdrucksweise genau ab; die idiomatische Alternative „die Israeliten“ wird in einer Fußnote genannt.
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: den Auftrag Jahwes
  rationale: מִשְׁמֶרֶת bezeichnet hier eine zu beachtende Verpflichtung oder einen anvertrauten Auftrag. „Auftrag“ ist im modernen Deutsch verständlich und bewahrt den Gedanken pflichtgetreuer Befolgung.
- source_word: וְלֹא יִסָּעוּ
  choice: und brachen nicht auf
  rationale: נסע bezeichnet im Kontext der Wüstenwanderung das Aufbrechen und Weiterziehen eines Lagers. „Aufbrechen“ trifft diesen konkreten Reisesinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die gewählte Form erhält die im Hebräischen ausdrücklich männliche und verwandtschaftliche Wendung, ohne ihre kollektive Bedeutung auf einzelne Männer zu beschränken; die idiomatische Alternative steht in der Fußnote.
- issue: Bedeutung von מִשְׁמֶרֶת im Verhältnis zu Jahwe
  choice: den Auftrag Jahwes erfüllen
  alternative: Jahwes Weisung befolgen
  rationale: Die Formulierung wahrt den Gedanken einer von Jahwe auferlegten Pflicht, ohne sie enger als einzelnes Gebot oder kultischen Dienst festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt dem klaren Erzählfluss des Hebräischen; „Stiftshütte“ und „Jahwe“ bewahren den heilsgeschichtlichen Kontext, während „erfüllten den Auftrag“ die schwerfällige wörtliche Verbindung von שׁמר und מִשְׁמֶרֶת idiomatisch ausdrückt.
