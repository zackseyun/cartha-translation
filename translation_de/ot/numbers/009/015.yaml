language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: de
  text: An dem Tag, als die Wohnung aufgerichtet wurde, bedeckte die Wolke die Wohnung, das Zelt des Zeugnisses[a]. Und am Abend war sie bis zum Morgen über der Wohnung und sah aus wie Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Zelt der Bundesurkunde“. Das hebräische Wort עֵדוּת kann das „Zeugnis“ und in diesem Zusammenhang besonders die bezeugenden Bundesbestimmungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הָקִים
  choice: An dem Tag, als … aufgerichtet wurde
  rationale: Die temporale Konstruktion wird als natürlicher deutscher Nebensatz wiedergegeben; das Präfix ו verbindet mit dem Kontext, verlangt hier aber kein zusätzliches einleitendes Wort.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet die tragbare heilige Wohnstätte Gottes. „Wohnung“ bewahrt die Wortbedeutung und bleibt im Zusammenhang verständlich; „Stiftshütte“ wäre traditioneller, aber im heutigen Deutsch weniger unmittelbar.
- source_word: כִּסָּה הֶעָנָן
  choice: bedeckte die Wolke
  rationale: כסה bezeichnet schlicht das Bedecken; der bestimmte Artikel kennzeichnet die aus dem Zusammenhang bekannte Wolke.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: das Zelt des Zeugnisses
  rationale: Die Wendung erläutert hier appositionell die „Wohnung“. „Zeugnis“ bewahrt den kultischen Ausdruck עֵדוּת, ohne ihn vorschnell auf eine einzelne Deutung einzuengen.
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: Und am Abend war sie
  rationale: Der Imperfekt beschreibt in diesem erzählenden Zusammenhang den andauernden beziehungsweise regelmäßig gegebenen Zustand. Das feminine Pronomen bezieht sich im Deutschen eindeutig auf die Wolke.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: sah aus wie Feuer
  rationale: Die Formulierung gibt den visuellen Vergleich wieder und behauptet nicht, die Wolke sei tatsächlich Feuer gewesen.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Die Wendung bezeichnet den zeitlichen Endpunkt; ihre Voranstellung im deutschen Satz macht die Dauerbeziehung eindeutig und natürlich.
theological_decisions:
- issue: Verhältnis von „Wohnung“ und „Zelt des Zeugnisses“
  choice: 'Apposition: Das Zelt des Zeugnisses identifiziert die Wohnung näher.'
  alternative: 'Lokative oder direktionale Deutung des ל: „bei/gegen das Zelt des Zeugnisses“'
  rationale: Die Syntax und der sachliche Zusammenhang sprechen am ehesten dafür, dass beide Ausdrücke dieselbe heilige Anlage bezeichnen. Die appositionelle Wiedergabe vermeidet die irreführende Vorstellung zweier verschiedener Objekte.
- issue: Art der nächtlichen Erscheinung
  choice: Die Wolke sah aus wie Feuer.
  alternative: Die Wolke war Feuer.
  rationale: כְּמַרְאֵה kennzeichnet ausdrücklich eine Ähnlichkeit der Erscheinung und keine Identitätsaussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wohnung“ wird als quellennähere und heute verständlichere Wiedergabe von מִשְׁכָּן verwendet; die traditionelle Form „Stiftshütte“ wird vermieden. Der zweite Satz ist für natürliches Deutsch leicht umgestellt, ohne die zeitliche oder bildhafte Aussage zu verändern.
