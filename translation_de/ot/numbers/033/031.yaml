base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: de
  text: Sie brachen von Moserot auf und schlugen ihr Lager in Bene-Jaakan[a] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Bene-Jaakan bedeutet wörtlich „Söhne Jaakans“, dient hier aber als Ortsname.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in den Wegstationen der Wüstenwanderung regelmäßig den Aufbruch von einem Lagerplatz. „aufbrechen“ ist im modernen Deutschen natürlich und bewahrt die wiederkehrende Reiseformel.
- source_word: מִמֹּסֵרוֹת
  choice: von Moserot
  rationale: Die Präposition מִן wird mit „von“ wiedergegeben. Der Ortsname מֹסֵרוֹת wird als „Moserot“ transliteriert; die Endung -ot bildet die hebräische Lautgestalt im Deutschen angemessen ab.
- source_word: וַיַּחֲנוּ
  choice: und schlugen ihr Lager … auf
  rationale: חנה bedeutet in diesem Reiseverzeichnis „lagern“. Die idiomatische Wendung „das Lager aufschlagen“ ist klar, würdig und vermeidet die unmittelbare Wiederholung von „aufbrechen“.
- source_word: בִּבְנֵי יַעֲקָן
  choice: in Bene-Jaakan
  rationale: Die Wortgruppe bedeutet wörtlich „Söhne Jaakans“, fungiert hier jedoch als Ortsname. Die Präposition ב wird bei einem Lagerort natürlich mit „in“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die knappe Reiseroutenformel und die hebräischen Ortsnamen bleiben erhalten.
