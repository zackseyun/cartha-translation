  yaml_path: translation/ot/numbers/033/026.yaml
  text: They set out from Makheloth and camped at Tahath.
translation:
  language: de
  text: Sie brachen von Makhelot auf und lagerten in Tachat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: Das Verb נסע bezeichnet in der Reisewegformel den Aufbruch von einem Lagerplatz. „aufbrechen“ ist im heutigen Deutsch natürlich und gibt die Bewegung präzise wieder.
- source_word: מִמַּקְהֵלֹת
  choice: von Makhelot
  rationale: Die Präposition מִן wird mit „von“ wiedergegeben; der Ortsname wird in einer für deutsche Leser verständlichen, am Hebräischen orientierten Form transkribiert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet hier das Beziehen eines Lagerplatzes. „lagerten“ entspricht der wiederkehrenden Wegstationsformel und klingt würdig sowie natürlich.
- source_word: בְּתָחַת
  choice: bei Tachat
  rationale: Die Präposition ב wird bei einem Lagerort idiomatisch mit „bei“ wiedergegeben. תָחַת wird hier als Ortsname verstanden und transkribiert, nicht nach seiner gleichlautenden Bedeutung „unter“ übersetzt.
theological_decisions: []
