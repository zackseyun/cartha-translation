base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: de
  text: Sie brachen von Obot auf und lagerten bei Ije-Abarim[a] an der Grenze Moabs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ijje-Abarim“. Der hebräische Ortsname kann mit Wörtern zusammenhängen, die „Trümmerstätten“ und „Abarim/jenseitige Gebiete“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der Reiseroutenformel das Aufbrechen eines Lagers und die Weiterreise. „aufbrechen“ ist im modernen Deutschen natürlich und konkret.
- source_word: מֵאֹבֹת
  choice: von Obot
  rationale: מֵ bezeichnet den Ausgangspunkt; אֹבֹת ist ein Ortsname und wird nach gängiger deutscher biblischer Namensform als „Obot“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ bewahrt die Reiseroutenformel in würdigem, verständlichem Deutsch.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: bei Ije-Abarim
  rationale: Die Wortgruppe fungiert hier als Ortsname. Die Transliteration vermeidet eine unsichere etymologische Ausdeutung; בְּ wird bei einem Lagerplatz idiomatisch mit „bei“ wiedergegeben.
- source_word: בִּגְבוּל
  choice: an der Grenze
  rationale: גְּבוּל kann Grenze, Grenzgebiet oder Gebiet bedeuten. „an der Grenze“ entspricht hier am unmittelbarsten der Ortsangabe, ohne einen Aufenthalt tief im Gebiet Moabs zu behaupten.
- source_word: מוֹאָב
  choice: Moabs
  rationale: Der bekannte Orts- und Volksname wird in der im Deutschen üblichen Form „Moab“ wiedergegeben; nach „Grenze“ steht der Genitiv.
theological_decisions: []
