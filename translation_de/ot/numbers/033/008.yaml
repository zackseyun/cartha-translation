  rationale: Die Revision beseitigt eine unnötige Einfügung bei der Aufbruchsangabe und verdeutlicht die dreitägige Reise, ohne die im Hebräischen enthaltene Wegstreckenangabe zu nivellieren. Die Fußnoten bewahren sowohl die ungewöhnliche kürzere Ortsnamensform als auch die mögliche zeitbezogene Wiedergabe.
