  text: וַ/יִּסְעוּ֙ מִ/פְּנֵ֣י הַֽ/חִירֹ֔ת וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּ/מִדְבַּ֣ר אֵתָ֔ם וַֽ/יַּחֲנ֖וּ בְּ/מָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: de
  text: Sie brachen von Hahirot[a] auf, zogen mitten durch das Meer in die Wüste und legten in der Wüste Etam eine Reise von drei Tagen zurück[b]. Dann lagerten sie bei Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor Hahirot“. Im Gegensatz zu den entsprechenden Stellen im 2. Buch Mose steht hier nicht „Pi-Hahirot“, sondern nur „Hahirot“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zogen drei Tage lang durch die Wüste Etam“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in den Reiserouten häufig das Aufbrechen von einem Lagerplatz; „aufbrechen“ ist im Deutschen natürlich und trifft den Etappenstil.
- source_word: מִפְּנֵי הַחִירֹת
  choice: von der Stelle vor Hahirot
  rationale: Die Formulierung gibt מִפְּנֵי („von vor“) verständlich wieder, ohne den im hebräischen Text fehlenden Bestandteil „Pi-“ zu ergänzen.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: zogen mitten durch das Meer
  rationale: עבר bezeichnet das Hinüber- oder Hindurchziehen; בְּתוֹךְ hebt ausdrücklich die Mitte beziehungsweise das Innere des Meeres hervor.
- source_word: הַמִּדְבָּרָה
  choice: in die Wüste
  rationale: Das Richtungs-He bezeichnet eine Bewegung auf die Wüste zu beziehungsweise in sie hinein.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: gingen drei Tagereisen weit
  rationale: Die Verbindung aus דֶּרֶךְ und „drei Tagen“ bezeichnet eine in drei Tagen zurückgelegte Wegstrecke; die Wiedergabe bewahrt den Wegcharakter und klingt zugleich idiomatisch.
- source_word: בְּמִדְבַּר אֵתָם
  choice: durch die Wüste Etam
  rationale: Die Präposition steht im Zusammenhang fortgesetzter Bewegung; „durch“ gibt diesen Verlauf im Deutschen natürlich wieder. Der Eigenname wird transliteriert.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: Dann lagerten sie bei Mara
  rationale: חנה bezeichnet hier das Lagern an einer Station; „bei“ passt zu einem benannten Lagerplatz.
