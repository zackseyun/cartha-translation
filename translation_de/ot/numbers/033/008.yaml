  - severity: medium
    issue: „drei Tagereisen weit“ ist mehrdeutig.
    rationale: Die deutsche Wendung kann drei getrennte Tagesreisen meinen. Der hebräische Ausdruck bezeichnet dagegen eine Reise bzw. Wegstrecke von drei Tagen. „eine Reise von drei Tagen“ gibt dies eindeutig wieder.
