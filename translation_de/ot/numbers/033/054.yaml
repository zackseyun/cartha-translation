revisions:
- from: Ihr sollt das Land durch das Los unter euren Sippen als Erbbesitz verteilen. Der größeren sollt ihr einen größeren Erbbesitz geben und der kleineren einen kleineren. Wohin das Los für jemanden fällt, das soll ihm gehören. Nach euren väterlichen Stämmen sollt ihr euren Erbbesitz erhalten.
  to: Ihr sollt das Land durch das Los unter euren Sippen als Erbbesitz verteilen. Der größeren Sippe sollt ihr ihren Erbbesitz vergrößern, der kleineren sollt ihr ihren Erbbesitz verkleinern. Wo das Los für jemanden hinfällt, dort soll sein Erbbesitz sein. Nach den Stämmen eurer Väter sollt ihr eure Erbanteile erhalten.
  rationale: Die Revision präzisiert die örtliche Losformel, klärt den Bezug von „größer/kleiner“ als Sippen und gibt den pluralischen Abschluss idiomatisch wieder. Sie bewahrt die rechtlich geprägte Terminologie von נַחֲלָה und vermeidet eine weitergehende Auslegung.
