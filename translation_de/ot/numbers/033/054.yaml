review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur entspricht dem Hebräischen: Landzuteilung durch Los an Sippen, größere bzw. kleinere Zuteilung und Gliederung nach den Stämmen der Väter. Die räumliche Aussage in אֶל אֲשֶׁר ... שָׁמָּה wird jedoch durch „Wohin ... fällt“ nicht idiomatisch und nicht ganz präzise wiedergegeben; gemeint ist der Ort bzw. Bereich, auf den das Los fällt. Außerdem ist das abschließende תִּתְנַחָלוּ pluralisch und bezieht sich auf die Zuteilung nach den Vaterstämmen.'
  naturalness: Der Text ist überwiegend modernes Standarddeutsch. „Der größeren ... der kleineren“ bleibt ohne ausdrücklich genanntes Bezugswort etwas elliptisch; „der größeren Sippe“ bzw. „der kleineren“ ist klarer. „Wohin das Los ... fällt“ klingt im Deutschen weniger natürlich als „Wo das Los ... hinfällt“ oder „Auf wen/wohin das Los fällt“; da der Kontext Landanteile betrifft, ist eine Ortsformulierung vorzuziehen.
  terminology: „Sippen“ gibt מִשְׁפָּחֹת sachgerecht wieder; „Stämme eurer Väter“ wahrt מַטּוֹת אֲבֹתֵיכֶם. „Erbbesitz“ ist für נַחֲלָה möglich, aber die Wiederholung des Possessivpronomens im Hebräischen wird mit „seinen Erbbesitz“ bzw. „ihren Erbbesitz“ besser abgebildet. „durch das Los“ ist korrekt.
  issues:
  - severity: medium
    issue: „Wohin das Los für jemanden fällt“
    rationale: 'Die Verbindung אֶל אֲשֶׁר ... שָׁמָּה beschreibt den Zielort der Loszuteilung: an den Ort, auf den das Los für ihn fällt, dort soll sein Anteil sein. „Wohin ... fällt“ ist im Deutschen unidiomatisch und lässt die örtliche Zuordnung unscharf.'
  - severity: low
    issue: „Der größeren ... der kleineren“ ohne Bezugswort
    rationale: Das Hebräische meint die zahlenmäßig größere bzw. kleinere soziale Einheit. Das Bezugswort „Sippe“ sollte wenigstens im ersten Glied stehen, um die Referenz eindeutig zu machen.
  - severity: low
    issue: Schlussformulierung im Singular „euren Erbbesitz“
    rationale: Der hebräische Schluss steht im Plural und nimmt die nach Vaterstämmen gegliederte Zuteilung auf. „eure Erbanteile“ macht dies im Deutschen klarer, ohne den Sinn zu ändern.
  revised_text: Ihr sollt das Land durch das Los unter euren Sippen als Erbbesitz verteilen. Der größeren Sippe sollt ihr ihren Erbbesitz vergrößern, der kleineren sollt ihr ihren Erbbesitz verkleinern. Wo das Los für jemanden hinfällt, dort soll sein Erbbesitz sein. Nach den Stämmen eurer Väter sollt ihr eure Erbanteile erhalten.
