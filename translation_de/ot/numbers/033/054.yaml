base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: de
  text: Ihr sollt das Land durch das Los unter euren Sippen als Erbbesitz verteilen. Der größeren Sippe sollt ihr ihren Erbbesitz vergrößern, der kleineren sollt ihr ihren Erbbesitz verkleinern. Wo das Los für jemanden hinfällt, dort soll sein Erbbesitz sein. Nach den Stämmen eurer Väter sollt ihr eure Erbanteile erhalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם אֶת־הָאָרֶץ
  choice: Ihr sollt das Land … als Erbbesitz verteilen
  rationale: Der Hitpael von נחל steht hier im Zusammenhang der Verteilung des Landes. Die Wiedergabe wahrt den Erbbesitzgedanken und macht zugleich den distributiven Sinn im Deutschen verständlich.
- source_word: בְּגוֹרָל
  choice: durch das Los
  rationale: גורל bezeichnet das Los als Mittel der Zuteilung; „durch das Los“ ist im Deutschen präzise und geläufig.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: unter euren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier eine größere verwandtschaftliche Einheit innerhalb des Stammes, nicht bloß die moderne Kernfamilie.
- source_word: לָרַב תַּרְבּוּ אֶת־נַחֲלָתוֹ וְלַמְעַט תַּמְעִיט אֶת־נַחֲלָתוֹ
  choice: Der größeren sollt ihr einen größeren Erbbesitz geben und der kleineren einen kleineren
  rationale: „Der größeren/kleineren“ bezieht sich im Kontext auf die zahlenmäßig größere bzw. kleinere Sippe. Die Formulierung gibt die Größenabstufung natürlich wieder, ohne den Bezug im Text übermäßig auszudeuten.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל לוֹ יִהְיֶה
  choice: Wohin das Los für jemanden fällt, das soll ihm gehören
  rationale: Die räumliche Richtung von אֶל ... שָׁמָּה und die Losformel יֵצֵא werden idiomatisch wiedergegeben; לוֹ יִהְיֶה bezeichnet die verbindliche Zugehörigkeit.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: nach euren väterlichen Stämmen
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf die Abstammung über die Väter und die Gliederung nach Stämmen.
- source_word: תִּתְנֶחָלוּ
  choice: sollt ihr euren Erbbesitz erhalten
  rationale: Der abschließende Hitpael von נחל wird als Empfang des zugewiesenen Erbbesitzes wiedergegeben und hält das Leitmotiv des Landes als Erbe fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sippen“ vermeidet die missverständliche Verengung auf Kernfamilien; „Erbbesitz“ erhält den rechtlich-theologischen Charakter von נַחֲלָה. Die knappe Wiederholung „größeren … größeren / kleineren … kleineren“ bildet die Parallelität des Hebräischen natürlich ab.
