  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: de
  text: Sie brachen von Ijjim auf und lagerten in Dibon-Gad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in den Stationenlisten den Aufbruch von einem Lagerplatz. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Bewegung präzise wieder.
- source_word: מֵעִיִּים
  choice: von Ijjim
  rationale: Die Präposition מֵ wird mit „von“ wiedergegeben. Der Ortsname עִיִּים wird nach gängiger deutscher Umschrift als „Ijjim“ transliteriert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet hier das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ passt natürlich zur wiederkehrenden Reiseroutenformel.
- source_word: בְּדִיבֹן גָּד
  choice: bei Dibon-Gad
  rationale: Die Präposition בְּ vor einem Ortsnamen wird in diesem Reisebericht idiomatisch mit „bei“ wiedergegeben. „Dibon-Gad“ bleibt als zusammengesetzter Ortsname erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache; die knappe, formelhafte Struktur der Stationenliste bleibt gewahrt. Ortsnamen werden transliteriert.
