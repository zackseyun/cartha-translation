  text: וַ/יִּסְע֖וּ מִ/סֻּכֹּ֑ת וַ/יַּחֲנ֣וּ בְ/אֵתָ֔ם אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: de
  text: Sie brachen von Sukkot auf und lagerten in Etam, das am Rand der Wüste liegt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in Reiseberichten den Aufbruch von einem Lagerplatz; „aufbrechen“ ist im modernen Deutschen natürlich und präzise.
- source_word: מִסֻּכֹּת
  choice: von Sukkot
  rationale: Der Ortsname wird nach dem Hebräischen als „Sukkot“ transliteriert; die Präposition מִן bezeichnet den Ausgangspunkt.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet, ein Lager aufzuschlagen beziehungsweise zu lagern; „lagerten“ passt knapp und natürlich zum Reiseverzeichnis.
- source_word: בְאֵתָם
  choice: bei Etam
  rationale: Die Präposition בְּ kann bei Ortsangaben den Aufenthaltsort bezeichnen; „bei Etam“ ist idiomatisch und vermeidet die unbelegte Festlegung, dass innerhalb eines Ortes gelagert wurde.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen leitet eine nähere Ortsbeschreibung Etams ein.
- source_word: בִּקְצֵה
  choice: am Rand
  rationale: קָצֶה bezeichnet das äußerste Ende beziehungsweise den Rand eines Gebiets; „am Rand“ gibt die geografische Aussage ohne unnötige politische Konnotation wieder.
- source_word: הַמִּדְבָּר
  choice: der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Weide- oder Steppenland; „Wüste“ ist im Deutschen die geläufige biblische Bezeichnung, ohne zwingend eine reine Sandwüste vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch im Stil eines Reiseverzeichnisses. Die Ortsnamen werden hebraïsch nah als „Sukkot“ und „Etam“ wiedergegeben. Keine Fußnote ist nötig, da „am Rand der Wüste“ die lexikalische Spannweite von בִּקְצֵה angemessen ausdrückt.
