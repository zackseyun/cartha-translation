  yaml_path: translation/ot/numbers/033/036.yaml
  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: de
  text: Sie brachen von Ezjon-Geber auf und lagerten in der Wüste Zin; das ist[a] Kadesch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bezogen auf „Wüste Zin“: „die Kadesch ist“. Das hebräische Pronomen identifiziert die genannte Örtlichkeit mit Kadesch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in den Reiseaufzeichnungen das Abbrechen des Lagers und den anschließenden Aufbruch. „Aufbrechen“ gibt diese wiederkehrende Wegformel natürlich und prägnant wieder.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: von Ezjon-Geber
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Bibeltradition transliteriert; die Präposition מִן wird mit „von“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet hier, an einem Ort das Lager aufzuschlagen. „Lagerten“ ist modernes, klares Deutsch und passt zum Itinerarstil.
- source_word: בְמִדְבַּר צִן
  choice: in der Wüste Zin
  rationale: מִדְבָּר kann je nach Zusammenhang „Wüste“ oder „Wildnis“ bezeichnen. „Wüste Zin“ ist im Deutschen die geläufige biblisch-geografische Bezeichnung, ohne die Geländeart über das Hebräische hinaus näher festzulegen.
- source_word: הִוא
  choice: das ist
  rationale: Das feminine Pronomen nimmt wahrscheinlich auf die Wüste beziehungsweise die genannte Örtlichkeit Bezug und führt eine Identifizierung mit Kadesch ein. „Das ist“ bewahrt diese knappe appositionelle Aussage.
- source_word: קָדֵשׁ
  choice: Kadesch
  rationale: Der Ortsname wird in der etablierten deutschen Form transliteriert.
