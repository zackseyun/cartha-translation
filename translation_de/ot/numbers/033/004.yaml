  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: de
  text: Während die Ägypter diejenigen begruben, die Jahwe unter ihnen erschlagen hatte – alle Erstgeborenen –, hatte Jahwe auch an ihren Göttern Strafgerichte vollstreckt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: während die Ägypter … begruben
  rationale: Die Nominalkonstruktion mit Partizip beschreibt eine gleichzeitig ablaufende Hintergrundhandlung; „während“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם
  choice: diejenigen, die Jahwe unter ihnen erschlagen hatte
  rationale: Die Relativkonstruktion bleibt erhalten. „Erschlagen“ wahrt das Bild von נכה und macht im Kontext die tödliche Wirkung deutlich; בָּהֶם bezeichnet idiomatisch die Betroffenen innerhalb der Ägypter.
- source_word: כָּל בְּכוֹר
  choice: alle Erstgeborenen
  rationale: Die nachgestellte Apposition wird beibehalten, statt durch einen nicht ausdrücklich vorhandenen Possessivbezug geglättet zu werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּבֵאלֹהֵיהֶם
  choice: Auch an ihren Göttern
  rationale: ב mit עשה שפטים bezeichnet die Zielgruppe der Gerichtshandlung. „An“ ist im Deutschen idiomatisch und bleibt der hebräischen Konstruktion nahe.
- source_word: עָשָׂה ... שְׁפָטִים
  choice: vollstreckte … Strafgerichte
  rationale: Die feste Verbindung meint die Durchführung göttlicher Gerichtsakte. „Strafgerichte vollstrecken“ ist präzise, würdig und im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; die Umschrift bewahrt diesen Textbefund.
- issue: Bezug von אֱלֹהֵיהֶם
  choice: ihre Götter
  alternative: ihre Götzen
  rationale: Die Übersetzung bewahrt die direkte Aussage über die Götter Ägyptens, ohne sie interpretierend auf Götzenbilder oder menschliche Machthaber einzuengen.
- issue: Syntaktischer Bezug von כָּל בְּכוֹר
  choice: 'nachgestellte Apposition: „alle Erstgeborenen“'
  alternative: „all ihre Erstgeborenen, die …“
  rationale: Die hebräische Wortfolge benennt zunächst diejenigen, die Jahwe schlug, und bestimmt sie anschließend als alle Erstgeborenen. Diese Spannung wird nicht durch einen hinzugefügten Possessivbezug aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Hauptaussagen werden zur besseren Lesbarkeit in getrennten Sätzen wiedergegeben; die nachgestellte Identifizierung „alle Erstgeborenen“ bleibt durch den Doppelpunkt sichtbar.
