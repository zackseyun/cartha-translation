  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע הַֽ/כְּנַעֲנִי֙ מֶ֣לֶךְ עֲרָ֔ד וְ/הֽוּא יֹשֵׁ֥ב בַּ/נֶּ֖גֶב בְּ/אֶ֣רֶץ כְּנָ֑עַן בְּ/בֹ֖א בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: de
  text: Der kanaanitische König von Arad, der im Negev[a] im Land Kanaan wohnte, hörte, als die Söhne Israels[b] kamen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Negev“ kann auch mit „der Süden“ oder „das Südland“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Israeliten“. Wörtlich steht im Hebräischen: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Das Qal-Wayyiqtol von שׁמע bedeutet unmittelbar „hörte“. Da im Hebräischen kein ausdrückliches Objekt wie „Nachricht“ steht, wird ein solches auch im Deutschen nicht ergänzt.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: der kanaanitische König von Arad
  rationale: Die attributive deutsche Form gibt die ethnisch-politische Kennzeichnung natürlich wieder und bewahrt zugleich die Herrscherbezeichnung und den Ortsnamen.
- source_word: וְהוּא יֹשֵׁב
  choice: der … wohnte
  rationale: Pronomen und Partizip liefern eine beschreibende Hintergrundangabe; ein Relativsatz ist dafür im modernen Deutschen die natürlichste Form.
- source_word: בַּנֶּגֶב
  choice: im Negev
  rationale: Hier ist Negev als geografische Regionsbezeichnung zu verstehen. Die Transliteration ist präziser als das allgemeinere „im Süden“.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die Wiedergabe behält sowohl אֶרֶץ („Land“) als auch den Eigennamen Kanaan bei.
- source_word: בְּבֹא
  choice: als … kamen
  rationale: 'Die Präposition ב mit dem Infinitiv von בוא bezeichnet hier den Zeitpunkt: „als … kamen“. Die Formulierung bewahrt die im Hebräischen fehlende ausdrückliche Inhaltsangabe zu „hörte“.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Dies bildet die hebräische Wendung formal transparent ab; „die Israeliten“ ist eine natürliche, aber weniger wörtliche Alternative.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Relativsatz glättet die hebräische Hintergrundkonstruktion, während die ungewöhnlich offene Verbindung „hörte, als … kamen“ beibehalten wird, damit kein im Ausgangstext unausgesprochenes Objekt ergänzt wird.
