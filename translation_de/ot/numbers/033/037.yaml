  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַֽ/יַּחֲנוּ֙ בְּ/הֹ֣ר הָ/הָ֔ר בִּ/קְצֵ֖ה אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: de
  text: Sie brachen von Kadesch auf und lagerten am Berg Hor[a], am Rand des Landes Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: »bei Hor, dem Berg«; traditionell wird der Ortsname mit »Berg Hor« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der Reiseroutenformel den Aufbruch von einem Lagerplatz. »Sie brachen auf« ist natürliches modernes Deutsch und gibt den konkreten Reisebeginn wieder.
- source_word: מִקָּדֵשׁ
  choice: von Kadesch
  rationale: Der hebräische Text nennt hier nur קָדֵשׁ. Daher wird der Ortsname nicht zu »Kadesch-Barnea« erweitert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen eines Lagers. »lagerten« passt zum wiederkehrenden Stil der Wüstenwanderung und ist im Deutschen klar verständlich.
- source_word: בְּהֹר הָהָר
  choice: am Berg Hor
  rationale: Die hebräische Wendung lautet wörtlich etwa »bei Hor, dem Berg«. »Berg Hor« ist die etablierte und im Deutschen natürliche Wiedergabe des Ortsnamens.
- source_word: בִּקְצֵה
  choice: am Rand
  rationale: קצה bezeichnet Ende, äußersten Bereich oder Rand. »am Rand« bewahrt die räumliche Aussage, ohne zwingend eine genau festgelegte politische Grenze vorauszusetzen.
- source_word: אֶרֶץ אֱדוֹם
  choice: des Landes Edom
  rationale: אֶרֶץ bezeichnet hier das Land beziehungsweise Gebiet Edoms. »Land Edom« ist direkt, idiomatisch und dem Erzählregister angemessen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reiseroutenformel des Hebräischen bleibt erhalten. Auf eine Fußnote zu »Kadesch« wurde verzichtet, weil der Haupttext den ausdrücklich belegten kurzen Ortsnamen bereits ohne interpretierende Erweiterung wiedergibt.
