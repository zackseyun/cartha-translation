base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: de
  text: Sie brachen von Punon auf und lagerten sich in Obot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der wiederkehrenden Reiseroutenformel das Abbrechen des Lagers und den anschließenden Aufbruch. „aufbrechen“ ist im modernen Deutschen idiomatisch und bewahrt diesen Zusammenhang.
- source_word: מִפּוּנֹן
  choice: von Punon
  rationale: Die Präposition מִן bezeichnet den Ausgangsort. Der Ortsname wird nach deutscher Bibeltradition als „Punon“ transliteriert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet in diesem Reisebericht, ein Lager aufzuschlagen beziehungsweise zu lagern. „lagerten“ ist knapp, natürlich und entspricht der formelhaften Darstellung.
- source_word: בְּאֹבֹת
  choice: bei Obot
  rationale: Die Präposition בְּ kennzeichnet hier den Lagerort und wird im Deutschen natürlich mit „bei“ wiedergegeben. אֹבֹת wird entsprechend der im Deutschen üblichen Transliteration als „Obot“ geschrieben.
