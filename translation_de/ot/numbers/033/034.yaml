  yaml_path: translation/ot/numbers/033/034.yaml
  text: They set out from Jotbathah and camped at Abronah.
translation:
  language: de
  text: Sie brachen von Jotbata auf und lagerten sich in Abrona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in der Reiseroutenformel den Aufbruch von einer Station. „Sie brachen auf“ ist im modernen Deutschen natürlich und bewahrt den Bewegungssinn.
- source_word: מִיָּטְבָתָה
  choice: von Jotbata
  rationale: Die Präposition מִן wird mit „von“ wiedergegeben. Der Ortsname wird nach gängiger deutscher Bibeltradition als „Jotbata“ transliteriert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet in diesem Kontext, an der nächsten Station das Lager aufzuschlagen. „lagerten“ ist knapp, idiomatisch und für die wiederkehrende Reiseroutenformel geeignet.
- source_word: בְּעַבְרֹנָה
  choice: bei Abrona
  rationale: Die Präposition בְּ ist hier lokal. „bei Abrona“ bezeichnet den Lagerplatz natürlich, ohne den Ortsnamen als umgrenzte Siedlung vorauszusetzen.
