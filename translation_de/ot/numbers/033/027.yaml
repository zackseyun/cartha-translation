  yaml_path: translation/ot/numbers/033/027.yaml
  text: They set out from Tahath and camped at Terah.
translation:
  language: de
  text: Sie brachen von Tahat auf und lagerten sich in Terach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der Lagerstationsformel den Aufbruch vom bisherigen Lager und die Weiterreise. „aufbrechen“ ist im modernen Deutschen natürlich und gibt diesen Vorgang präzise wieder.
- source_word: מִתָּחַת
  choice: von Tahat
  rationale: Die Präposition מִן wird mit „von“ wiedergegeben. Der Ortsname תָּחַת wird nach einer im Deutschen üblichen hebräischen Umschrift als „Tahat“ geschrieben.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet in den Wüstenwanderungslisten, an einem Ort das Lager aufzuschlagen. „lagerten“ ist knapp, geläufig und dem wiederkehrenden Reiseformular angemessen.
- source_word: בְּתָרַח
  choice: bei Terach
  rationale: Die Präposition בְּ bezeichnet hier den Lagerort; „bei“ ist dafür im Deutschen idiomatisch. Der Ortsname תָּרַח wird gemäß deutscher Bibeltradition und Aussprache als „Terach“ wiedergegeben.
