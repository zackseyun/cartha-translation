  yaml_path: translation/ot/numbers/033/024.yaml
  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: de
  text: Sie brachen vom Berg Schapher auf und lagerten bei Harada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der Reiseroutenformel den Aufbruch von einem Lagerplatz zum nächsten. „aufbrechen“ ist im heutigen Deutsch natürlich und gibt die Bewegung präzise wieder.
- source_word: מֵהַר
  choice: vom Berg
  rationale: Die Präposition מִן mit הַר bedeutet hier „vom Berg“. Zusammen mit dem folgenden Eigennamen ist „Berg Schefer“ eine natürliche deutsche Form.
- source_word: שָׁפֶר
  choice: Schefer
  rationale: Der Ortsname wird gemäß seiner masoretischen Vokalisierung ins Deutsche übertragen; „sch“ gibt den hebräischen Sch-Laut שׁ wieder.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet in diesem Reiseverzeichnis das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist knapp, gegenwärtig und idiomatisch.
- source_word: בַּחֲרָדָה
  choice: bei Harada
  rationale: בְּ kennzeichnet hier den Ort des nächsten Lagerplatzes. „bei“ ist in deutschen Reiseroutenformeln natürlich; Harada wird als Eigenname transliteriert.
theological_decisions: []
