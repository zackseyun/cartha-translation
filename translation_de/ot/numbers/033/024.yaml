  source_fidelity: 'Die Reiseroutenformel ist zutreffend wiedergegeben: וַיִּסְעוּ ... וַיַּחֲנוּ entspricht „Sie brachen ... auf und lagerten ...“. Der Ortsname שָׁפֶר ist jedoch nach der masoretischen Vokalisierung als „Schapher“ wiederzugeben, nicht „Schefer“. Die Schreibung „Schefer“ verschiebt den ersten Vokal von a zu e. Die englische Auditspur bietet zwar „Shepher“ als Hauptform, nennt aber selbst „Shapher“ als mögliche Form; für die deutsche Transliteration ist „Schapher“ quellentreuer.'
