  text: וְ/הוֹרַשְׁתֶּ֥ם אֶת הָ/אָ֖רֶץ וִֽ/ישַׁבְתֶּם בָּ֑/הּ כִּ֥י לָ/כֶ֛ם נָתַ֥תִּי אֶת הָ/אָ֖רֶץ לָ/רֶ֥שֶׁת אֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: de
  text: Ihr sollt das Land in Besitz nehmen und darin wohnen, denn euch habe ich das Land gegeben, damit ihr es besitzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit ihr es als Erbe in Besitz nehmt«. Das hebräische Verb ירשׁ kann sowohl »in Besitz nehmen« als auch »erben« beziehungsweise »als Erbe erhalten« bedeuten, besonders im Zusammenhang der Landverheißung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Ihr sollt … in Besitz nehmen
  rationale: Die Hifil-Form von ירשׁ kann das Vertreiben beziehungsweise Enteignen und die daraus folgende Besitznahme bezeichnen. Da das direkte Objekt hier »das Land« und nicht dessen Bewohner sind, gibt »in Besitz nehmen« den Sinn im Deutschen natürlich und präzise wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier das Israel zugesagte Gebiet. »Land« ist die geläufige und kontextgerechte Wiedergabe.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: und darin wohnen
  rationale: ישׁב bezeichnet hier dauerhaftes Wohnen beziehungsweise Ansiedeln. »Darin wohnen« ist modern, würdig und bewahrt den räumlichen Bezug.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung des Gebots ein. »Denn« bewahrt die kausale Verknüpfung in einem natürlichen deutschen Satzbau.
- source_word: לָכֶם נָתַתִּי
  choice: euch habe ich … gegeben
  rationale: Die Voranstellung von »euch« gibt den Empfängerbezug von לָכֶם wieder; das Perfekt »habe gegeben« stellt die Gabe als vollzogen und weiterhin maßgeblich dar.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: damit ihr es besitzt
  rationale: Der Infinitiv mit לְ bezeichnet hier Ziel oder Zweck der Landgabe. »Damit ihr es besitzt« ist idiomatisch und gibt den Besitzsinn von ירשׁ wieder, ohne seine mögliche Erb-Bedeutung auszuschließen.
theological_decisions:
- issue: Wiedergabe von ירשׁ im Zusammenhang der Landverheißung
  choice: in Besitz nehmen / besitzen
  alternative: 'als Erbe erhalten / erben; beim ersten Vorkommen auch: die Bewohner vertreiben'
  rationale: Der unmittelbare Zusammenhang verbindet Gottes Gabe des Landes mit dessen tatsächlicher Besitznahme. Die mögliche Erbnuance von ירשׁ bleibt in der Fußnote sichtbar; die Hauptübersetzung legt jedoch weder ausschließlich Erbrecht noch ausschließlich Vertreibung in den Text hinein.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Bibelton. »Wohnen« vermeidet das heute gehobene »weilen«; »in Besitz nehmen« ist bei einem Land als Objekt natürlicher als eine wörtliche Wiedergabe im Sinn von »enteignen/vertreiben«.
