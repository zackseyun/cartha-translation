base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/032.yaml
  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: de
  text: Sie brachen von Bene-Jaakan[a] auf und schlugen ihr Lager in Hor-Haggidgad auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Bene-Jaakan ist wahrscheinlich ein Ortsname; wörtlich bedeutet die Form „Söhne Jaakans“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: Das Verb נסע bezeichnet in der wiederkehrenden Reiseroutenformel den Aufbruch von einer Lagerstation. „Aufbrechen“ ist im modernen Deutschen natürlich und erhält den formelhaften Reiseablauf.
- source_word: מִבְּנֵי יַעֲקָן
  choice: von Bene-Jaakan
  rationale: Die Form dient hier als Ortsname einer Lagerstation und entspricht dem Ortsnamen Beerot-Bene-Jaakan in Deuteronomium 10,6. Daher wird sie transliteriert; ihre wörtliche Bedeutung wird in einer Fußnote genannt.
- source_word: וַיַּחֲנוּ
  choice: und schlugen ihr Lager … auf
  rationale: Das Verb חנה bezeichnet in der Reiseroutenformel das Lagern an der nächsten Station. Die idiomatische Wendung ist klar, modern und würdevoll.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: in Hor-Haggidgad
  rationale: Es handelt sich um einen Ortsnamen, der transliteriert wird. Die Präposition ב wird bei einem als Gebiet beziehungsweise Lagerort verstandenen Ortsnamen natürlich mit „in“ wiedergegeben; der Artikel bleibt im Namensbestandteil „Haggidgad“ erkennbar.
