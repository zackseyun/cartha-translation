  yaml_path: translation/ot/numbers/033/022.yaml
  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: de
  text: Sie brachen von Rissa auf und schlugen ihr Lager in Kehelata auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der Lagerplatzliste den Aufbruch von einer Station. „aufbrechen“ ist im modernen Deutschen natürlich und wahrt die wiederkehrende Reiseformel.
- source_word: מֵרִסָּה
  choice: von Rissa
  rationale: Der Ortsname wird zusammen mit der Präposition מֵ („von“) als „von Rissa“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und schlugen ihr Lager … auf
  rationale: חנה bezeichnet hier das Lagern an der nächsten Station. Die idiomatische Wendung „das Lager aufschlagen“ gibt die konkrete Handlung klar und würdig wieder.
- source_word: בִּקְהֵלָתָה
  choice: in Kehelata
  rationale: Der Ortsname wird transliteriert; die Präposition בְּ wird bei einem Aufenthaltsort natürlich mit „in“ wiedergegeben.
