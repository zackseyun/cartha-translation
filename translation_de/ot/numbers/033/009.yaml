  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: de
  text: Sie brachen von Mara auf und kamen nach Elim. In Elim gab es zwölf Wasserquellen und siebzig Palmen, und dort schlugen sie ihr Lager auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: Das Verb נסע bezeichnet in der Reiseroutenformel das Abbrechen des Lagers und den anschließenden Aufbruch. „aufbrechen“ ist im modernen Deutschen natürlich und präzise.
- source_word: מִמָּרָה
  choice: von Mara
  rationale: Der Ortsname wird nach üblicher deutscher Form transliteriert; die Präposition מִן bezeichnet den Ausgangspunkt.
- source_word: וַיָּבֹאוּ
  choice: und kamen
  rationale: בוא bedeutet hier „kommen/gelangen“. „kamen nach“ gibt die Ankunft schlicht wieder, ohne zusätzliche Deutung.
- source_word: אֵילִמָה / בְאֵילִם
  choice: nach Elim / In Elim
  rationale: Die erste Form enthält die Richtungsendung und bezeichnet die Bewegung zum Ort; die zweite lokalisiert die dort vorhandenen Quellen und Palmen.
- source_word: עֵינֹת מַיִם
  choice: Wasserquellen
  rationale: עַיִן bezeichnet hier natürliche Quellen. „Wasserquellen“ ist verständlich und bewahrt die ausdrückliche Verbindung mit מַיִם.
- source_word: תְּמָרִים
  choice: Palmen
  rationale: תָּמָר bezeichnet Palmen, wahrscheinlich Dattelpalmen. „Palmen“ vermeidet eine Spezifizierung, die der Vers nicht ausdrücklich macht.
- source_word: וַיַּחֲנוּ שָׁם
  choice: und dort schlugen sie ihr Lager auf
  rationale: חנה bezeichnet in den Wüstenstationen das Lagern. Die deutsche Wendung ist natürlich, würdevoll und macht den Reiseroutenkontext deutlich.
