  yaml_path: translation/ot/numbers/033/021.yaml
  text: They set out from Libnah and camped at Rissah.
translation:
  language: de
  text: Sie brachen von Libna auf und schlugen ihr Lager in Rissa auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der Wüsten-Itinerarformel den Aufbruch von einem Lagerplatz zur nächsten Wegstrecke. „aufbrechen“ ist natürliches modernes Deutsch und bewahrt den Bewegungssinn.
- source_word: מִלִּבְנָה
  choice: von Libna
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt; לִבְנָה wird als Ortsname in der üblichen deutschen Form „Libna“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und schlugen ihr Lager auf
  rationale: חנה ist das übliche Verb für das Lagern an einer Station. „ihr Lager aufschlagen“ ist im Deutschen idiomatischer und anschaulicher als das alleinstehende „lagern“.
- source_word: בְּרִסָּה
  choice: in Rissa
  rationale: Die Präposition בְּ bezeichnet den Ort. Bei einem Orts- oder Lagerplatznamen ist „in Rissa“ im Deutschen eine natürliche Wiedergabe.
theological_decisions: []
