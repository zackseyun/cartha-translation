  text: They set out from Hor-haggidgad and camped at Jotbathah.
translation:
  language: de
  text: Sie brachen von Hor-Gidgad auf und lagerten in Jotbata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der Stationenliste den Aufbruch von einem Lagerplatz. „aufbrechen“ ist im modernen Deutschen idiomatisch und bewahrt den wiederkehrenden Reisecharakter der Formel.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: von Hor-Gidgad
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt. Der Ortsname wird in einer geläufigen deutschen Transliteration wiedergegeben; der Bindestrich macht die Zusammengehörigkeit der Namenselemente sichtbar.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet in diesem Reisebericht, an einer Station das Lager aufzuschlagen. „lagerten“ ist natürlich, knapp und dem formelhaften Stil angemessen.
- source_word: בְּיָטְבָתָה
  choice: in Jotbata
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Lagerns. Bei einem Ortsnamen ist „in“ im Deutschen die natürliche locative Wiedergabe; der Name wird transliteriert.
theological_decisions: []
translation_notes:
  register: Knappe, würdige und moderne Wiedergabe der formelhaften Reiseroute. Die Ortsnamen werden transliteriert; unnötig altertümliche Ausdrücke werden vermieden.
