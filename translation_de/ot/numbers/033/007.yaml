  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: de
  text: Sie brachen von Etam auf und wandten sich zurück nach Pi-Hahirot[a], das Baal-Zefon gegenüberliegt, und lagerten vor Migdol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kehrten nach Pi-Hahirot zurück“. Das hebräische Verb kann sowohl eine Rückkehr als auch eine Umkehr beziehungsweise Richtungsänderung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in den Stationenlisten regelmäßig das Aufbrechen eines Lagers; „aufbrechen“ ist natürliches heutiges Deutsch und bewahrt den Reisesinn.
- source_word: מֵאֵתָם
  choice: von Etam
  rationale: Der Ortsname wird gemäß üblicher deutscher Transkription als Eigenname wiedergegeben.
- source_word: וַיָּשָׁב
  choice: und wandten sich zurück
  rationale: שׁוב kann „zurückkehren“ oder „umkehren/sich zurückwenden“ bedeuten. Im Zusammenhang der Route bezeichnet es wahrscheinlich eine Richtungsänderung, ohne zwingend die Rückkehr an einen früheren Ort auszusagen.
- source_word: עַל פִּי הַחִירֹת
  choice: nach Pi-Hahirot
  rationale: עַל steht hier bei einem Ortsnamen in einer Richtungs- bzw. Zielangabe. „nach“ gibt die Bewegung idiomatisch wieder; der Ortsname bleibt transkribiert.
- source_word: אֲשֶׁר עַל פְּנֵי בַּעַל צְפֹון
  choice: das Baal-Zefon gegenüberliegt
  rationale: עַל־פְּנֵי beschreibt hier eine räumliche Lagebeziehung. „gegenüberliegt“ ist in einer geografischen Angabe klar und natürlich.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet „lagern, ein Lager aufschlagen“; „lagerten“ ist knapp, verständlich und dem Stil einer Reiseroute angemessen.
- source_word: לִפְנֵי מִגְדֹּל
  choice: vor Migdol
  rationale: לִפְנֵי bezeichnet die Lage vor bzw. angesichts eines Ortes. Migdol wird hier als Ortsname und nicht als Gattungsbezeichnung „Turm“ verstanden.
theological_decisions: []
