base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/017.yaml
  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: de
  text: Sie brachen von Kibrot-Hattaawa[a] auf und schlugen ihr Lager in Hazerot auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibrot-Hattaawa bedeutet wahrscheinlich »Gräber des Verlangens« oder »Gräber der Begierde«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: Das Verb נסע bezeichnet in der wiederkehrenden Reiseroutenformel den Aufbruch von einer Station. „Aufbrechen“ ist im modernen Deutschen natürlich und bildet die Bewegung von einem Lagerplatz zum nächsten präzise ab.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: von Kibrot-Hattaawa
  rationale: Der Ortsname wird gemäß der hebräischen Form transkribiert; die Präposition מִן wird mit „von“ wiedergegeben. Seine mögliche Bedeutung wird in der Fußnote genannt, statt den Eigennamen im Haupttext zu ersetzen.
- source_word: וַיַּחֲנוּ
  choice: und schlugen ihr Lager … auf
  rationale: חנה bedeutet in den Stationsangaben „lagern“. Die idiomatische deutsche Wendung „das Lager aufschlagen“ ist verständlich und würdevoll und vermeidet das heute teils missverständliche bloße „campen“.
- source_word: בַּחֲצֵרֹת
  choice: in Hazerot
  rationale: Der Ortsname wird transkribiert. Die Präposition ב wird beim Aufenthalt an einem Ort natürlich mit „in“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, klare Standardsprache mit der in biblischen Reiserouten natürlichen Wendung „aufbrechen“ und „das Lager aufschlagen“. Die Ortsnamen bleiben als Eigennamen transkribiert; die semantische Deutung von Kibrot-Hattaawa steht in der Fußnote.
