  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: de
  text: Mose schrieb ihre Aufbrüche nach ihren Etappen[b] auf, auf Yahwehs Befehl[a]; und dies waren ihre Etappen nach ihren Aufbrüchen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach dem Mund Yahwehs«; dies ist eine hebräische Wendung für »auf Yahwehs Befehl«.'
    reason: lexical_alternative
  - marker: b
    text: Für »Aufbrüche« sind auch »Auszüge« oder, wenn Orte gemeint sind, »Ausgangsorte« möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Der Vers kehrt die Begriffe bewusst um: »ihre Aufbrüche nach ihren Etappen« – »ihre Etappen nach ihren Aufbrüchen«.'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: schrieb … auf
  rationale: Das Waw-Imperfekt erzählt ein vergangenes Geschehen; „aufschreiben“ bezeichnet natürlich und präzise das schriftliche Festhalten.
- source_word: מוֹצָאֵיהֶם
  choice: ihre Aufbruchspunkte
  rationale: מוֹצָא kann den Ausgang, das Ausgehen oder den Ort des Aufbruchs bezeichnen. Im Reiseverzeichnis gibt „Aufbruchspunkte“ den konkreten Bezug wieder und lässt sich in der Umkehrung des Satzes beibehalten.
- source_word: לְמַסְעֵיהֶם
  choice: entsprechend ihren Wegstrecken
  rationale: מַסָּע bezeichnet einen Reiseabschnitt beziehungsweise eine Etappe; das relationale ל wird mit „entsprechend“ wiedergegeben, sodass die formale Zuordnung erhalten bleibt.
- source_word: עַל פִּי יְהוָה
  choice: wie Yahweh es befohlen hatte
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund Yahwehs“, ist hier jedoch ein Idiom für einen Befehl oder eine Anweisung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: מַסְעֵיהֶם
  choice: ihre Wegstrecken
  rationale: „Wegstrecken“ ist für ein Reiseverzeichnis verständlich und bezeichnet die aufeinanderfolgenden Abschnitte der Wanderung.
- source_word: לְמוֹצָאֵיהֶם
  choice: entsprechend ihren Aufbruchspunkten
  rationale: 'Die spiegelbildliche Formulierung des Hebräischen wird bewahrt: Aufbruchspunkte entsprechend den Wegstrecken, dann Wegstrecken entsprechend den Aufbruchspunkten.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; die Wiedergabe als „Yahweh“ bewahrt den Charakter als Gottesname.
- issue: Art der göttlichen Veranlassung
  choice: wie Yahweh es befohlen hatte
  alternative: nach dem Mund Yahwehs
  rationale: Die idiomatische Bedeutung als göttlicher Befehl wird verständlich wiedergegeben, ohne eine zusätzliche Aussage über die Art der Inspiration einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche chiastische Zuordnung des hebräischen Textes bleibt sichtbar; die idiomatische Wendung עַל־פִּי wird im Haupttext natürlich wiedergegeben und in der Fußnote wörtlich erläutert.
