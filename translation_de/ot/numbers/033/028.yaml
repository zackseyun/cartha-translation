  yaml_path: translation/ot/numbers/033/028.yaml
  text: They set out from Terah and camped at Mithkah.
translation:
  language: de
  text: Sie brachen von Terach auf und lagerten in Mitka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in der Reiseroutenformel den Aufbruch von einem Lagerplatz. „aufbrechen“ ist im modernen Deutschen idiomatisch und bewahrt den formelhaften Reiseablauf.
- source_word: מִתָּרַח
  choice: von Terach
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt. תָּרַח ist hier ein Ortsname und wird als „Terach“ transkribiert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet in diesem Zusammenhang das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist natürlich, prägnant und passt zur wiederkehrenden Reiseroutenformel.
- source_word: בְּמִתְקָה
  choice: in Mitka
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Lagers. Der Ortsname מִתְקָה wird als „Mitka“ transkribiert; „in“ gibt die hebräische Ortsangabe direkt und natürlich wieder.
theological_decisions: []
