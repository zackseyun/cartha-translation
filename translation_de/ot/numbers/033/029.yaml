base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/029.yaml
  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: de
  text: Sie brachen von Mitka auf und lagerten in Haschmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in der wiederkehrenden Lagerstationsformel den Aufbruch von einem Ort. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Bewegung zur nächsten Station treffend wieder.
- source_word: מִמִּתְקָה
  choice: von Mitka
  rationale: Die Präposition מִן wird mit „von“ wiedergegeben. Der Ortsname מִתְקָה wird nach der üblichen deutschen Bibeltradition als „Mitka“ transliteriert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet hier das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist eine klare, knappe Wiedergabe der Itinerarformel.
- source_word: בְּחַשְׁמֹנָה
  choice: in Haschmona
  rationale: Die Präposition בְּ markiert den Ort der Lagerung und wird im Deutschen bei einem Ortsnamen natürlich mit „in“ wiedergegeben. חַשְׁמֹנָה wird als „Haschmona“ transliteriert.
