source:
  edition: WLC
  text: וַ/יִּסְע֖וּ מֵ/הָרֵ֣י הָ/עֲבָרִ֑ים וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: de
  text: Sie brachen vom Gebirge Abarim auf und lagerten in den Ebenen Moabs[a] am Jordan bei Jericho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Steppen Moabs“. Das hebräische Wort kann Steppenland oder Ebenen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Jordan gegenüber von Jericho“. Die knappe hebräische Ortsangabe kann auch auf das Gebiet jenseits von Jericho bezogen werden; ein ausdrückliches Wort für „gegenüber“ steht jedoch nicht da.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in den Wegverzeichnissen häufig das Aufbrechen eines Lagers und die Weiterreise; „aufbrechen“ gibt diesen Etappencharakter in natürlichem modernem Deutsch wieder.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: vom Gebirge Abarim
  rationale: הָרֵי ist die Konstruktus-Mehrzahl von הַר und kann Berge oder Bergland bezeichnen. „Gebirge Abarim“ ist eine natürliche geografische Wiedergabe, ohne den Eigennamen einzudeutschen.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet hier das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist knapp, gegenwärtig und dem wiederkehrenden Reiseformular angemessen.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: in den Ebenen Moabs
  rationale: עֲרָבוֹת bezeichnet offenes, oft trockenes Steppen- oder Ebenenland. „Ebenen“ ist gut verständlich; die mögliche präzisere Geländebezeichnung „Steppen“ wird in der Fußnote erhalten.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: am Jordan bei Jericho
  rationale: עַל kann bei einem Gewässer die Lage an oder entlang ihm bezeichnen. Die knappe hebräische Verbindung יַרְדֵּן יְרֵחוֹ wird geografisch verständlich als „Jordan bei Jericho“ wiedergegeben, während die mögliche Auffassung „gegenüber von Jericho“ in der Fußnote bewahrt bleibt.
theological_decisions: []
