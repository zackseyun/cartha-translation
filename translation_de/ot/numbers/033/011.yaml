base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: de
  text: Sie brachen vom Roten Meer[a] auf und lagerten in der Wüste Sin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Schilfmeer“. Der hebräische Name jam suf wird traditionell mit „Rotes Meer“ wiedergegeben; wörtlich wird er häufig als „Schilfmeer“ verstanden.'
    reason: lexical_alternative
  - marker: b
    text: „Sin“ ist der Name eines Wüstengebiets und nicht das deutsche Wort „Sünde“.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der Reiseformel von Numeri 33 den Aufbruch von einem Lagerplatz. „Aufbrechen“ ist im heutigen Deutsch natürlich und bildet die wiederkehrende Reiseroute präzise ab.
- source_word: מִיַּם סוּף
  choice: vom Roten Meer
  rationale: יַם־סוּף ist die traditionelle geografische Bezeichnung „Rotes Meer“. Die lexikalisch naheliegende Alternative „Schilfmeer“ wird wegen der echten Deutungsfrage in einer Fußnote bewahrt.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet das Aufschlagen beziehungsweise Beziehen eines Lagers. „Lagerten“ ist eine knappe, natürliche Wiedergabe der Formel.
- source_word: בְּמִדְבַּר סִין
  choice: in der Wüste Sin
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Steppengebiet. „Wüste“ ist hier idiomatisch; „Sin“ bleibt als Ortsname unübersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reiseroutenformel des hebräischen Textes bleibt erhalten; beide Ortsbezeichnungen sind für gewöhnliche Leser verständlich erläutert.
