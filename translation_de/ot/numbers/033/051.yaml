  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: de
  text: 'Rede zu den Israeliten[a] und sag ihnen: »Wenn ihr über den Jordan in das Land Kanaan zieht,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Denn ihr seid im Begriff, den Jordan zu überqueren.“ Die hebräische Partizipialkonstruktion bezeichnet hier ein unmittelbar bevorstehendes Geschehen; כִּי kann „wenn“ oder „denn“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piël-Imperativ fordert unmittelbar zum Sprechen auf; „Rede“ bewahrt die formale Kraft und lässt sich natürlich mit „sag ihnen“ verbinden.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische Bezeichnung umfasst das Volk Israel; die wörtliche familiäre Formulierung wird in einer Fußnote kenntlich gemacht.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sag ihnen
  rationale: Gibt das zweite hebräische Redeverb samt indirektem Objekt wieder, ohne es mit dem vorausgehenden Verb zusammenzuziehen.
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: Wenn ihr … zieht
  rationale: Im Zusammenhang leitet כִּי die bevorstehende Situation ein, für die anschließend Anweisungen gegeben werden. Das deutsche Präsens im Konditionalsatz drückt den nahen Zukunftsbezug natürlich aus.
- source_word: אֶת הַיַּרְדֵּן
  choice: über den Jordan
  rationale: עבר mit direktem Objekt bezeichnet hier das Überschreiten des Flusses; „über den Jordan“ ist im Deutschen die natürliche Wendung.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: in das Land Kanaan
  rationale: Bewahrt sowohl die Bewegungsrichtung als auch das ausdrücklich genannte „Land“.
