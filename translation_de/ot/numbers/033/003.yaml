source:
  edition: WLC
  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: de
  text: Sie brachen von Ramses im ersten Monat auf, am fünfzehnten Tag des ersten Monats. Am Tag nach dem Passafest zogen die Israeliten mit erhobener Hand[a] vor den Augen aller Ägypter aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit erhobener Hand“; ein hebräisches Bild für ein offenes, selbstbewusstes und ungehindertes Vorgehen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in den Reiseverzeichnissen das Aufbrechen von einem Lager- oder Ausgangsort; „aufbrechen“ ist natürliches Deutsch und entspricht der wiederkehrenden Itinerarformel.
- source_word: מֵרַעְמְסֵס
  choice: von Ramses
  rationale: Der Ortsname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: im ersten Monat
  rationale: Die schlichte Zeitangabe wird unmittelbar und ohne ergänzende Kalenderdeutung übersetzt.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: am fünfzehnten Tag des ersten Monats
  rationale: Dies ist die natürliche deutsche Form der hebräischen Datumsangabe.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: am Tag nach dem Passafest
  rationale: מָחֳרַת bezeichnet den folgenden Tag; „Passafest“ macht den Festbezug von הַפֶּסַח im heutigen Deutsch klar.
- source_word: יָצְאוּ
  choice: zogen … aus
  rationale: „Ausziehen“ bewahrt das Exodusmotiv von יצא und klingt im Deutschen in diesem Zusammenhang natürlicher als das bloße „hinausgehen“.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet kollektiv die Angehörigen Israels. „Die Israeliten“ ist im modernen Deutsch präzise, inklusiv und natürlich; eine wörtliche Wiedergabe als „Söhne Israels“ könnte fälschlich nur männliche Personen nahelegen.
- source_word: בְּיָד רָמָה
  choice: erhobenen Hauptes
  rationale: Die wörtliche Wendung „mit erhobener Hand“ bezeichnet hier ein offenes, selbstbewusstes und ungehindertes Fortziehen. „Erhobenen Hauptes“ vermittelt diese Haltung idiomatisch, während die Fußnote das hebräische Bild bewahrt.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: vor den Augen aller Ägypter
  rationale: Die bildhafte hebräische Formulierung wird verständlich und nahezu formal entsprechend wiedergegeben; מִצְרַיִם bezeichnet hier kollektiv die Ägypter.
theological_decisions:
- issue: Kollektive Bezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist eine konventionelle Volksbezeichnung. Die natürliche kollektive Wiedergabe erfasst den Referenten, ohne die Gruppe unbegründet auf Männer einzuschränken.
- issue: Bedeutung des Idioms בְיָד רָמָה
  choice: erhobenen Hauptes
  alternative: mit erhobener Hand / kühn / trotzig
  rationale: Das Idiom verbindet Selbstbewusstsein, Offenheit und öffentliche Sichtbarkeit. „Trotzig“ würde die emotionale oder rebellische Nuance stärker festlegen, als es der Kontext verlangt; die gewählte Form lässt diese Spannung offen und wird durch die Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Hauptsätze bilden die hebräische Abfolge klar ab. Das ungewöhnliche hebräische Idiom wird im Text natürlich wiedergegeben und in der Fußnote transparent gemacht.
