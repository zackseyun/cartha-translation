  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: Aaron
  rationale: Das ו führt den Erzählzusammenhang fort, muss aber in diesem einzelnen deutschen Satz nicht eigens mit „und“ wiedergegeben werden; der Personenname erscheint in seiner etablierten deutschen Form.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: war 123 Jahre alt
  rationale: Die hebräische Altersformel בן + Zahl + שנה wird im modernen Deutschen idiomatisch mit „war … Jahre alt“ wiedergegeben. Die Ziffernschreibung ist klar und natürlich.
- source_word: בְּ/מֹת/וֹ
  choice: als er … starb
  rationale: Die Präposition ב mit dem substantivischen Infinitiv und Suffix bezeichnet hier den Zeitpunkt; ein temporaler Nebensatz gibt dies im Deutschen natürlich wieder.
- source_word: בְּ/הֹר הָ/הָר
  choice: auf dem Berg Hor
  rationale: הֹר הָהָר ist der Ortsname „Berg Hor“. „Auf“ entspricht dem geschilderten Sterben auf dem Berg.
