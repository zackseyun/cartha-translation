source:
  edition: WLC
  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: de
  text: Wenn ihr aber die Bewohner des Landes nicht vor euch vertreibt, werden die, die ihr von ihnen übrig lasst, zu Stacheln in euren Augen[a] und zu Dornen in euren Seiten[b] werden. Sie werden euch in dem Land bedrängen[c], in dem ihr wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu spitzen Dornen in euren Augen“. Das seltene hebräische Wort bezeichnet offenbar etwas Scharfes, das sticht oder durchbohrt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu Haken in euren Seiten“. Beide Bilder beschreiben ein anhaltendes, schmerzhaftes Leid, das von den verbliebenen Bewohnern ausgeht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „anfeinden“ beziehungsweise „bedrücken“. Das hebräische Verb kann verschiedene Formen feindseliger Bedrängnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: vertreibt
  rationale: Der Hifil von ירשׁ bezeichnet hier das Entfernen beziehungsweise die Vertreibung der bisherigen Bewohner aus ihrem Besitz. „Vertreiben“ ist im Deutschen klar und entspricht dem militärisch-siedlungsgeschichtlichen Zusammenhang.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: die Bewohner des Landes
  rationale: Die substantivierte Partizipialfügung wird direkt und in natürlichem Standarddeutsch wiedergegeben.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die räumliche hebräische Wendung bleibt erhalten und bezeichnet die Vertreibung angesichts des vorrückenden Israel.
- source_word: תּוֹתִירוּ
  choice: ihr von ihnen übrig lasst
  rationale: Der Hifil von יתר bedeutet, jemanden oder etwas verbleiben zu lassen. Die Formulierung bewahrt den kausativen Sinn, ohne den im Verb nicht ausdrücklich enthaltenen Gedanken des Verschonens einzutragen.
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: zu Stacheln in euren Augen
  rationale: Das seltene Substantiv bezeichnet offenbar etwas Scharfes oder Stechendes. „Stacheln“ erhält das drastische Körperbild und unterscheidet es vom folgenden Dornenbild.
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: zu Dornen in euren Seiten
  rationale: Das Substantiv bezeichnet scharfe, stechende Gegenstände. „Dornen“ ergibt zusammen mit „in euren Seiten“ ein verständliches und eindringliches Bild fortwährenden Schmerzes.
- source_word: וְצָרֲרוּ אֶתְכֶם
  choice: sie werden euch bedrängen
  rationale: צרר umfasst feindseliges Bedrängen, Anfeinden und Bedrücken. „Bedrängen“ bewahrt diese Spannweite, ohne eine spezifischere Form der Feindseligkeit festzulegen.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: in dem Land, in dem ihr wohnt
  rationale: Obwohl עַל wörtlich „auf“ bedeuten kann, ist „in dem Land“ im Deutschen die natürliche Ortsangabe. Das Partizip wird mit dem gegenwärtigen „wohnt“ wiedergegeben.
