base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/013.yaml
  text: They set out from Dophkah and camped at Alush.
translation:
  language: de
  text: Sie brachen von Dofka auf und schlugen ihr Lager in Alusch auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der Lagerplatzliste den Aufbruch von einer Station zur Weiterreise. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Bewegungsrichtung treffend wieder.
- source_word: מִדָּפְקָה
  choice: von Dofka
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt („von“). Der Ortsname דָּפְקָה wird nach einer im Deutschen gut lesbaren, quellenahen Umschrift als „Dofka“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: schlugen ihr Lager … auf
  rationale: חנה bezeichnet hier das Lagern an der nächsten Reisestation. Die idiomatische Wendung „das Lager aufschlagen“ ist klar, gegenwärtig und würdevoll.
- source_word: בְּאָלוּשׁ
  choice: in Alusch
  rationale: Die Präposition בְּ bezeichnet den Ort des Lagers. „in“ ist bei einem Ortsnamen im Deutschen idiomatisch; אָלוּשׁ wird als „Alusch“ transliteriert.
theological_decisions: []
translation_notes:
  register: Knappes, modernes Standarddeutsch entsprechend der formelhaften Reiseroute; die beiden Ortsnamen werden transliteriert und nicht gedeutet.
