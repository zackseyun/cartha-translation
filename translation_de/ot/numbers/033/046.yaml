  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: de
  text: Sie brachen von Dibon-Gad auf und lagerten bei Almon-Diblatajim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der wiederkehrenden Reiseformel von Numeri 33 das Abbrechen des Lagers und den Aufbruch zur nächsten Station. „aufbrechen“ ist im modernen Deutschen natürlich und präzise.
- source_word: מִדִּיבֹן גָּד
  choice: von Dibon-Gad
  rationale: Der Ortsname wird gemäß der üblichen deutschen Wiedergabe hebräischer Eigennamen transliteriert. Der Bindestrich stellt die Verbindung als zusammengesetzten Ortsnamen dar, ohne sie deutend als „Dibon von Gad“ aufzulösen.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet in dieser Reiseformel, an einer Station das Lager aufzuschlagen. „lagerten“ ist klar, idiomatisch und dem würdigen Erzählregister angemessen.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: bei Almon-Diblatajim
  rationale: Der Ortsname wird transliteriert; ב wird als „bei“ wiedergegeben, da es hier die Lagerstätte bezeichnet. Der Bindestrich behandelt die Wortfolge als zusammengesetzten Ortsnamen.
