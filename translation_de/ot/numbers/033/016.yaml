  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: de
  text: Sie brachen von der Wüste Sinai auf und lagerten in Kibrot-Hattaawa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
