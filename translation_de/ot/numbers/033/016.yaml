lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: Das Verb נסע bezeichnet in der wiederkehrenden Reiseroute das Aufbrechen von einem Lagerplatz. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Bewegung präzise wieder.
- source_word: מִמִּדְבַּר סִינָי
  choice: von der Wüste Sinai
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Wildnisgebiet. „Wüste Sinai“ ist die geläufige, verständliche geografische Bezeichnung und bewahrt die hebräische Zuordnung.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ passt natürlich zur knappen Reiseroutenformel.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: in Kibrot-Taawa
  rationale: Der Ausdruck wird hier als Ortsname gebraucht und deshalb transliteriert. Die Präposition בְּ wird bei einem Lagerort idiomatisch mit „in“ wiedergegeben; die Bedeutung des Namens bleibt in der Fußnote erhalten.
