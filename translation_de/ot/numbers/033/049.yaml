  text: וַ/יַּחֲנ֤וּ עַל הַ/יַּרְדֵּן֙ מִ/בֵּ֣ית הַיְשִׁמֹ֔ת עַ֖ד אָבֵ֣ל הַשִּׁטִּ֑ים בְּ/עַֽרְבֹ֖ת מוֹאָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: de
  text: Sie lagerten am Jordan, von Bet-Jeschimot bis Abel-Schittim, in den Steppen Moabs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: Sie lagerten
  rationale: Das Wayyiqtol von חנה führt die Reiseroute erzählerisch fort. „lagerten“ ist im heutigen Deutsch natürlich und präzise.
- source_word: עַל הַיַּרְדֵּן
  choice: am Jordan
  rationale: עַל bezeichnet bei einem Fluss die Lage an oder bei ihm; „am Jordan“ ist idiomatisches Deutsch.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: von Bet-Jeschimot
  rationale: Das Präfix מִן kennzeichnet den Ausgangspunkt der räumlichen Ausdehnung. Der Ortsname wird in einer im Deutschen gut lesbaren Form wiedergegeben.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: bis Abel-Schittim
  rationale: עַד bezeichnet den Endpunkt der räumlichen Ausdehnung; „bis“ gibt dies knapp und eindeutig wieder.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: in den Steppen Moabs
  rationale: עֲרָבוֹת bezeichnet die flache, trockene Steppenlandschaft östlich des Jordan. „Steppen“ bewahrt den landschaftlichen Sinn genauer als das allgemeinere „Ebenen“.
