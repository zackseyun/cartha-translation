  yaml_path: translation/ot/numbers/033/018.yaml
  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: de
  text: Sie brachen von Hazerot auf und lagerten in Ritma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in der Wegstationsformel den Aufbruch beziehungsweise das Abbrechen des Lagers. „Sie brachen auf“ ist natürliches modernes Deutsch und gibt die Bewegung präzise wieder.
- source_word: מֵחֲצֵרֹת
  choice: von Hazerot
  rationale: Der Ortsname חֲצֵרֹת wird transliteriert; die Präposition מִן wird mit „von“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: Das Verb חנה ist das übliche Verb für das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist im Deutschen knapp, verständlich und für die Wegstationsformel passend.
- source_word: בְּרִתְמָה
  choice: in Ritma
  rationale: Der Ortsname רִתְמָה wird transliteriert; בְּ bezeichnet hier den Ort des Lagers und wird idiomatisch mit „in“ wiedergegeben.
