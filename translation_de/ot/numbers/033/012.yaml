  text: וַ/יִּסְע֖וּ מִ/מִּדְבַּר סִ֑ין וַֽ/יַּחֲנ֖וּ בְּ/דָפְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: de
  text: Sie brachen aus der Wüste Sin[a] auf und lagerten in Dofka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sin ist hier der Name eines Wüstengebiets.
    reason: Der Ortsname könnte im Deutschen missverstanden oder mit dem ähnlich geschriebenen englischen Wort „sin“ verbunden werden; die Anmerkung stellt seine geografische Funktion klar.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der Lagerstationsformel das Abbrechen des Lagers und den Aufbruch zur nächsten Station. „aufbrechen“ ist im modernen Deutschen natürlich und präzise.
- source_word: מִמִּדְבַּר
  choice: aus der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Wildnisgebiet. In dieser geografischen Benennung ist „Wüste“ die geläufige deutsche Wiedergabe.
- source_word: סִין
  choice: Sin
  rationale: Der Ortsname wird transliteriert und nicht übersetzt.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen eines Lagers. „lagerten“ entspricht der knappen Reiseroutenformel.
- source_word: בְּדָפְקָה
  choice: in Dofka
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Lagers. „in“ ist bei einem Ortsnamen im Deutschen idiomatisch; דָּפְקָה wird nach deutscher Lautkonvention als „Dofka“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Reiseroutenformel in modernem Standarddeutsch. Die Ortsnamen folgen geläufiger deutscher Transliteration.
