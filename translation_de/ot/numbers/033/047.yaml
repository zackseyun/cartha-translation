base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: de
  text: Sie brachen von Almon-Diblatajim auf und lagerten im Abarimgebirge[a] vor Nebo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegenüber von Nebo“ beziehungsweise „Nebo vorgelagert“. Das Hebräische bezeichnet eine räumliche Beziehung, ohne deren genaue Ausrichtung festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der wiederkehrenden Reiseroutenformel von Numeri 33 das Abbrechen des Lagers und den Aufbruch. „Sie brachen auf“ ist natürliches modernes Deutsch.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: von Almon-Diblatajim
  rationale: Der Ortsname wird transliteriert; der Bindestrich kennzeichnet ihn als zusammengesetzten Namen.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist knapp und idiomatisch.
- source_word: בְּהָרֵי הָעֲבָרִים
  choice: im Abarimgebirge
  rationale: הָרֵי ist der Konstruktplural von הַר, und עֲבָרִים fungiert hier als geografischer Eigenname. „Abarimgebirge“ gibt die Bergregion im Deutschen natürlich wieder.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet eine räumliche Beziehung im Sinn von „vor/in Sichtweite gegenüber“, ohne die genaue Orientierung festzulegen.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Der geografische Eigenname wird transliteriert.
