  yaml_path: translation/ot/numbers/033/030.yaml
  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: de
  text: Sie brachen von Haschmona auf und schlugen ihr Lager in Moserot auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: Das Verb נסע bezeichnet in der wiederkehrenden Reiseroutenformel den Aufbruch von einem Lagerplatz. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Bewegung von einer Station zur nächsten präzise wieder.
- source_word: מֵחַשְׁמֹנָה
  choice: von Haschmona
  rationale: Die Präposition מִן wird mit „von“ wiedergegeben. Der Ortsname חַשְׁמֹנָה wird nach seiner hebräischen Form als „Haschmona“ transkribiert.
- source_word: וַיַּחֲנוּ
  choice: und schlugen ihr Lager … auf
  rationale: חנה bedeutet in diesen Reiseroutenangaben, an einem Ort zu lagern. Die feste deutsche Wendung „das Lager aufschlagen“ ist anschaulich, würdig und idiomatisch.
- source_word: בְּמֹסֵרוֹת
  choice: in Moserot
  rationale: Die Präposition בְ bezeichnet hier den Ort des Lagerns und wird natürlich mit „in“ wiedergegeben. Der Ortsname מֹסֵרוֹת wird als „Moserot“ transkribiert; die Endung gibt das hebräische -ot wieder.
theological_decisions: []
translation_notes:
  register: Knappes, modernes Standarddeutsch im gleichförmigen Stil der Lagerstationsliste. Die parallele Abfolge „aufbrechen – Lager aufschlagen“ bewahrt die formelhafte Struktur des Hebräischen.
