  text: וַ/יִּסְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל מֵ/רַעְמְסֵ֑ס וַֽ/יַּחֲנ֖וּ בְּ/סֻכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/005.yaml
  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: de
  text: Die Israeliten[a] brachen von Ramses[b] auf und lagerten in Sukkot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“; traditionell auch: „die Kinder Israel“.'
    reason: lexical_alternative
  - marker: b
    text: Ramses wird in manchen Übersetzungen auch „Raamses“ geschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: brachen … auf
  rationale: Das Verb נסע bezeichnet in Reiseberichten das Abbrechen eines Lagers und den anschließenden Aufbruch. „Aufbrechen“ gibt diese Bewegung im modernen Deutschen natürlich wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung lautet wörtlich „die Söhne Israels“, bezeichnet hier jedoch das Volk Israel. „Die Israeliten“ ist im Deutschen eindeutig, natürlich und schließt die gesamte Gemeinschaft ein; die wörtliche Form wird in einer Fußnote bewahrt.
- source_word: מֵרַעְמְסֵס
  choice: von Ramses
  rationale: Die Präposition מִן kennzeichnet den Ausgangspunkt. „Ramses“ ist eine geläufige deutsche Schreibweise des Ortsnamens.
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: חנה bedeutet, ein Lager aufzuschlagen oder zu lagern. „Lagerten“ passt knapp und würdig zum Stil eines Reiseverzeichnisses.
- source_word: בְּסֻכֹּת
  choice: in Sukkot
  rationale: Die Präposition ב bezeichnet den Ort des Lagerns. Der Ortsname wird in einer dem Hebräischen nahen und im Deutschen gebräuchlichen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappes, modernes und würdiges Deutsch im Stil eines Reiseverzeichnisses. Die idiomatische Volksbezeichnung „Israeliten“ vermeidet ein mögliches Missverständnis der wörtlichen Wendung, während die Fußnote deren Form sichtbar hält.
