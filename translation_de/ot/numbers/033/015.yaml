  text: Sie brachen von Refidim auf und lagerten in der Wüste Sinai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in der Reiseroutenformel den Aufbruch von einer Station. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Bewegung präzise wieder.
- source_word: מֵרְפִידִם
  choice: von Refidim
  rationale: Die Präposition מִן bezeichnet hier den Ausgangspunkt. Der Ortsname רְפִידִם wird in der im Deutschen üblichen biblischen Form „Refidim“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet in den Wüstenwanderungsberichten das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist knapp, idiomatisch und dem wiederkehrenden Reiseformular angemessen.
- source_word: בְּמִדְבַּר סִינָי
  choice: in der Wüste Sinai
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Wildnisgebiet, ohne zwingend eine reine Sandwüste zu meinen. „Wüste Sinai“ ist die geläufige deutsche Bezeichnung und bildet die hebräische Genitivverbindung natürlich ab.
