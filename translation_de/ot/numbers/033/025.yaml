base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/025.yaml
  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: de
  text: Sie brachen von Harada auf und lagerten in Makhelot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie zogen von Harada weiter und schlugen bei Makhelot ihr Lager auf.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in der Lagerplatzliste den Aufbruch von einem bisherigen Lager. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Bewegung präzise wieder.
- source_word: מֵחֲרָדָה
  choice: von Harada
  rationale: Die Präposition מִן kennzeichnet den Ausgangsort. Der Ortsname wird gemäß seiner hebräischen Form als „Harada“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet in diesem Reisebericht, ein Lager aufzuschlagen beziehungsweise zu lagern. „lagerten“ ist knapp, verständlich und entspricht der wiederkehrenden Reiseroutenformel.
- source_word: בְּמַקְהֵלֹת
  choice: in Makhelot
  rationale: Die Präposition בְ bezeichnet hier den Ort des Lagers. „in“ ist bei Ortsnamen im Deutschen idiomatisch; der Name wird als „Makhelot“ transliteriert.
