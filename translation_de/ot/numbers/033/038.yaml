  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: de
  text: Und Aaron, der Priester, stieg auf Befehl Jahwes[a] auf den Berg Hor hinauf und starb dort, im vierzigsten Jahr nach dem Auszug der Israeliten aus dem Land Ägypten, im fünften Monat, am ersten Tag des Monats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach dem Wort Jahwes«; wörtlich: »auf den Mund Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: stieg … hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. Die deutsche Verbklammer „stieg … hinauf“ gibt diese Richtung natürlich und deutlich wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die Apposition bewahrt Aarons Amtsbezeichnung unmittelbar und sachlich.
- source_word: אֶל הֹר הָהָר
  choice: auf den Berg Hor
  rationale: „Berg Hor“ ist die übliche deutsche Form des Ortsnamens; „auf“ passt zur gerichteten Aufwärtsbewegung.
- source_word: עַל פִּי יְהוָה
  choice: auf Befehl Jahwes
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund Jahwes“, idiomatisch jedoch, dass etwas gemäß seinem Ausspruch oder Befehl geschieht. „Auf Befehl“ ist im Deutschen klar und prägnant; die wörtlichere Alternative wird in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּמָת שָׁם
  choice: und starb dort
  rationale: Direkte, natürliche Wiedergabe des Verbs und der Ortsangabe; das Subjekt Aaron bleibt im Deutschen eindeutig.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: im vierzigsten Jahr
  rationale: Entspricht der hebräischen Datierungsformel in idiomatischem Deutsch.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: nach dem Auszug der Israeliten
  rationale: Der Infinitiv bezeichnet den Auszug als zeitlichen Bezugspunkt. Die nominale deutsche Form ist knapp und entspricht der etablierten Bezeichnung des Ereignisses.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die Wendung bezeichnet hier das Volk als Ganzes; „Israeliten“ ist im modernen Deutschen natürlicher als die wörtliche Form „Söhne Israels“.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Bewahrt sowohl die Herkunftsrichtung als auch das ausdrücklich genannte „Land“.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: im fünften Monat
  rationale: Direkte und verständliche Wiedergabe der Kalenderangabe.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Gibt die hebräische Datumsformel im Deutschen eindeutig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bedeutung von עַל פִּי יְהוָה
  choice: auf Befehl Jahwes
  alternative: nach dem Wort Jahwes
  rationale: Die idiomatische Wendung kann göttliche Anordnung oder Weisung bezeichnen. Der Haupttext gibt diesen Sinn natürlich wieder; die Fußnote hält die wörtlichere Form und damit die Bildsprache offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählfluss, vermeidet aber unnötig wörtliche oder altertümliche Formulierungen. Die wiederholte Monatsangabe bleibt erhalten, da sie dem Ausgangstext entspricht.
