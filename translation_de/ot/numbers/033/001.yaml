id: NUM.33.1
reference: Numbers 33:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: de
  text: Dies sind die Wegstationen der Israeliten[a], die aus dem Land Ägypten auszogen, nach ihren Heeresverbänden[b], unter der Führung von Mose und Aaron[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „geordnet nach ihren Verbänden“. Das hebräische Wort kann organisierte, auch militärisch gegliederte Verbände bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „durch die Hand von Mose und Aaron“; gemeint ist ihre Vermittlung oder Führung.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Dies sind
  rationale: Die demonstrative Eröffnung führt die folgende Liste ein; im Deutschen wird die Kopula natürlich ergänzt.
- source_word: מַסְעֵי
  choice: die Wegstationen
  rationale: Das Substantiv bezeichnet hier die aufeinanderfolgenden Etappen beziehungsweise Aufbruchsstationen des Wüstenwegs. „Wegstationen“ passt zum anschließenden Reiseverzeichnis.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich „die Söhne Israels“; im modernen Deutschen bezeichnet „Israeliten“ das gesamte Volk einschließlich seiner Familien natürlicher und ohne eine unbeabsichtigte Beschränkung auf männliche Personen.
- source_word: אֲשֶׁר יָצְאוּ
  choice: die … auszogen
  rationale: יצא bezeichnet das Heraus- beziehungsweise Fortziehen aus Ägypten; „auszogen“ ist im Exoduszusammenhang prägnant und idiomatisch.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die ausdrückliche Nennung von אֶרֶץ („Land“) bleibt erhalten.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צָבָא bezeichnet geordnete Verbände und kann militärische Färbung tragen. „Heeresverbände“ bewahrt diesen Zug, ohne zu behaupten, dass hier ein Kampf beschrieben wird.
- source_word: בְּיַד
  choice: unter der Führung von
  rationale: Der hebräische Ausdruck lautet wörtlich „durch/unter der Hand von“ und bezeichnet hier Vermittlung, Leitung oder verantwortliche Führung. Die idiomatische deutsche Wiedergabe nennt die gemeinte Funktion klar.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Mose und Aaron
  rationale: Eingebürgerte deutsche Namensformen.
theological_decisions: []
