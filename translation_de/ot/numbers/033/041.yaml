  yaml_path: translation/ot/numbers/033/041.yaml
  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: de
  text: Sie brachen vom Berg Hor auf und lagerten in Zalmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in den Reiserouten Israels regelmäßig den Aufbruch von einem Lagerplatz; „aufbrechen“ ist dafür im modernen Deutschen natürlich und präzise.
- source_word: מֵהֹר הָהָר
  choice: vom Berg Hor
  rationale: הֹר הָהָר ist der etablierte Ortsname „Berg Hor“. Die Präposition מִן wird mit „von“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet hier, an der nächsten Station das Lager aufzuschlagen. „lagerten“ wahrt den formelhaften Reisebericht und klingt würdig sowie idiomatisch.
- source_word: בְּצַלְמֹנָה
  choice: in Zalmon[a]
  rationale: Die Präposition בְּ ist lokal gebraucht. Der Ortsname צַלְמֹנָה wird nach gängiger deutscher Bibeltradition als „Zalmona“ transliteriert.
