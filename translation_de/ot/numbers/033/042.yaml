  yaml_path: translation/ot/numbers/033/042.yaml
  text: They set out from Zalmonah and camped at Punon.
translation:
  language: de
  text: Sie brachen von Zalmona auf und schlugen in Punon ihr Lager auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der wiederkehrenden Reiseroutenformel das Abbrechen des Lagers und den anschließenden Aufbruch. „Sie brachen auf“ ist im modernen Deutsch natürlich und gibt diesen Vorgang präzise wieder.
- source_word: מִצַּלְמֹנָה
  choice: von Zalmon
  rationale: Die Präposition מִן wird mit „von“ wiedergegeben. Der Ortsname צַלְמֹנָה wird entsprechend der gebräuchlichen deutschen biblischen Namensform als „Zalmon“ transliteriert.
- source_word: וַיַּחֲנוּ
  choice: und schlugen ihr Lager auf
  rationale: חנה bedeutet hier, an der nächsten Station zu lagern. „Ihr Lager aufschlagen“ ist eine natürliche deutsche Wiedergabe der Reiseroutenformel.
- source_word: בְּפוּנֹן
  choice: in Punon
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Lagerns und wird im Deutschen idiomatisch mit „in“ wiedergegeben; der Ortsname wird als „Punon“ transliteriert.
theological_decisions: []
translation_notes:
  register: Knappe, würdige und moderne Wiedergabe der formelhaften Reiseroutenangabe. Die parallelen Verben werden idiomatisch als „aufbrechen“ und „das Lager aufschlagen“ formuliert.
