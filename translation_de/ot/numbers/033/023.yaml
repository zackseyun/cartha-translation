lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Verb נסע bezeichnet in den Wegstationslisten das Aufbrechen eines Lagers; „aufbrechen“ ist im modernen Deutschen natürlich und präzise.
- source_word: מִקְּהֵלָתָה
  choice: von Kehelata
  rationale: Der Ortsname wird mit der vorangestellten Präposition מִן wiedergegeben und nach den hebräischen Lautformen ins Deutsche transliteriert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet hier das Aufschlagen beziehungsweise Beziehen eines Lagers; „lagerten“ bewahrt die wiederkehrende Reiseroutenformel knapp und verständlich.
- source_word: בְּהַר
  choice: am Berg
  rationale: הַר bezeichnet einen Berg oder eine Anhöhe; zusammen mit dem folgenden Eigennamen gibt „am Berg …“ den Lagerort idiomatisch wieder.
- source_word: שָׁפֶר
  choice: Schefer
  rationale: Der Ortsname wird gemäß seiner masoretischen Vokalisierung und in einer für deutsche Leser üblichen Umschrift wiedergegeben.
