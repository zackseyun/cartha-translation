  text: They set out from Abronah and camped at Ezion-geber.
translation:
  language: de
  text: Sie brachen von Abrona auf und lagerten in Ezjon-Geber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der Lagerplatzliste den Aufbruch von einem bisherigen Lager. „aufbrechen“ ist im modernen Deutschen idiomatisch und gibt die Bewegung präzise wieder.
- source_word: מֵעַבְרֹנָה
  choice: von Abrona
  rationale: Die Präposition מֵ wird mit „von“ wiedergegeben. עַבְרֹנָה ist ein Ortsname und wird nach gängiger deutscher Bibeltradition als „Abrona“ transliteriert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet hier das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist natürliches, knappes Deutsch für die wiederkehrende Reiseroutenformel.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: bei Ezjon-Geber
  rationale: בְּ markiert den Ort des Lagers und wird hier idiomatisch mit „bei“ wiedergegeben. Der zusammengesetzte Ortsname wird als „Ezjon-Geber“ transliteriert.
