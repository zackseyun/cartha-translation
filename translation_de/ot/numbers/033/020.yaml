  yaml_path: translation/ot/numbers/033/020.yaml
  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: de
  text: Sie brachen von Rimmon-Perez auf und lagerten in Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der Reiseroutenformel den Aufbruch von einem Lagerplatz. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Bewegung von der vorherigen Station klar wieder.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: von Rimmon-Perez
  rationale: Die Präposition מִן bedeutet hier „von“. Der zusammengesetzte Ortsname wird transliteriert und mit Bindestrich geschrieben.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bezeichnet in den Wüstenetappen das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist knapp, geläufig und passt zur wiederkehrenden Reiseroutenformel.
- source_word: בְּלִבְנָה
  choice: bei Libna
  rationale: Die Präposition בְּ kennzeichnet hier den Ort der nächsten Lagerstation. „bei“ ist im Deutschen für einen Lagerplatz an einem benannten Ort idiomatisch; „in Libna“ wäre ebenfalls grammatisch möglich, könnte aber stärker eine Siedlung voraussetzen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache; die knappe, formelhafte Struktur der Etappenliste bleibt erhalten. Die Ortsnamen werden in geläufiger deutscher Transliteration wiedergegeben.
