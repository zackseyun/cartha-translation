  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: de
  text: Ihr sollt alle Bewohner des Landes vor euch vertreiben und alle ihre Bildwerke[a] vernichten; auch alle ihre aus Metall gegossenen Bilder[b] sollt ihr vernichten und alle ihre Kulthöhen zerstören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre figurierten Steine“ oder „ihre geschnitzten Bilder“. Der genaue Gegenstand und sein Material sind im Hebräischen nicht eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ihre Gussbilder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: ihr sollt … vertreiben
  rationale: Das Hifil von ירשׁ bezeichnet hier die Entfernung der bisherigen Bewohner aus ihrem Besitzgebiet. „Vertreiben“ ist im Deutschen natürlich und gibt zusammen mit מִפְּנֵיכֶם die räumliche Bewegung klar wieder.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: alle Bewohner des Landes
  rationale: Die substantivierte Partizipialform bezeichnet alle, die im Land wohnen. „Bewohner“ ist knapp, gegenwärtig und sachlich.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die hebräische Wendung wird bildnah und im Deutschen verständlich wiedergegeben.
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: vernichten … vernichten
  rationale: Das Piel von אבד fordert die vollständige Beseitigung der Kultgegenstände. Die Wiederholung von „vernichten“ bewahrt die auffällige Wiederholung desselben hebräischen Verbs.
- source_word: מַשְׂכִּיֹּתָם
  choice: ihre Bildsteine
  rationale: Der Ausdruck bezeichnet bildlich gestaltete oder verzierte Darstellungen, wahrscheinlich auf beziehungsweise aus Stein. „Bildsteine“ ist prägnant; eine Fußnote hält die Unsicherheit über genaue Form und Material offen.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: ihre aus Metall gegossenen Bilder
  rationale: צֶלֶם bezeichnet ein Bild, während מַסֵּכָה auf das Gießen aus Metall verweist. Die Formulierung macht Herstellungsweise und Gegenstand in modernem Deutsch deutlich, ohne „Götzen“ ausdrücklich in den Text einzutragen.
- source_word: בָּמֹתָם
  choice: ihre Kulthöhen
  rationale: בָּמוֹת sind erhöhte beziehungsweise als „Höhen“ bezeichnete Kultstätten. „Kulthöhen“ ist im Deutschen genauer als das missverständliche bloße „Höhen“.
- source_word: תַּשְׁמִידוּ
  choice: zerstören
  rationale: Das Hifil von שׁמד bezeichnet hier die vollständige Beseitigung von Kultstätten. „Zerstören“ passt sachlich zu den Kulthöhen und unterscheidet das Verb vom zuvor wiederholten אבד.
theological_decisions:
- issue: Befehl zur Entfernung der Landesbewohner und zur Beseitigung ihrer Kultstätten
  choice: Der Vers wird ohne Abschwächung als Befehl wiedergegeben, die Bewohner zu vertreiben und die genannten Kultgegenstände und Kultstätten vollständig zu beseitigen.
  alternative: Das erste Verb lediglich territorial mit „enteignen“ oder „ihres Besitzes berauben“ wiederzugeben und die kultischen Begriffe zu verallgemeinern.
  rationale: Der hebräische Text nennt sowohl die Entfernung der Bewohner als auch die Vernichtung konkreter kultischer Gegenstände und Orte. Die Übersetzung gibt beides direkt wieder, ohne eine über den Vers hinausgehende Rechtfertigung oder konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Soll-Form wahrt den Charakter einer verbindlichen Anordnung. Die hebräische Wiederholung von אבד wird bewusst durch zweimaliges „vernichten“ erhalten; das Semikolon verhindert dabei einen schwerfälligen Satzbau.
