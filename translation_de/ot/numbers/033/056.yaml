  verdict: revise
  source_fidelity: Die Aussage gibt die hebräische Folgeformel, die göttliche Absicht (דמיתי) und die betonte Entsprechung des Handelns zutreffend wieder. Für idiomatisches Deutsch ist bei der mit ל markierten Person jedoch „antun“ erforderlich bzw. deutlich natürlicher als die bloße Verbindung „jemandem tun“.
  naturalness: „Was ich ihnen zu tun gedachte, werde ich euch tun“ ist stark archaisierend und im heutigen Standarddeutsch holprig. „beabsichtigte, ihnen anzutun / werde ich euch antun“ ist klar, würdig und erhält den drohenden Parallelismus.
  terminology: „Beabsichtigte“ trifft hier die intentionale Bedeutung von דמה präzise, ohne über eine bloße Absicht hinaus ein konkretes Strafmaß zu benennen. „Antun“ macht im Deutschen die im Kontext eindeutig nachteilige Handlung idiomatisch sichtbar, ohne zusätzliche Einzelheiten einzutragen.
