  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: de
  text: 'Dann wird es geschehen: Was ich beabsichtigte, ihnen anzutun, werde ich euch antun.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ich beabsichtigte, ihnen anzutun, werde ich euch antun.“'
    reason: Diese Lesart gibt כַּאֲשֶׁר mit „wie“ wieder und bewahrt die mögliche formal nähere Satzanbindung.
lexical_decisions:
- source_word: וְהָיָה
  choice: Dann wird es geschehen
  rationale: Die hebräische Wendung leitet die Folge der vorausgehenden Warnung ein. Die Übersetzung bewahrt den Zukunfts- und Konsequenzcharakter in würdigem, heutigem Deutsch.
- source_word: כַּאֲשֶׁר
  choice: Was
  rationale: In der vorliegenden Satzfügung leitet כַּאֲשֶׁר den Inhalt des beabsichtigten Handelns ein. „Was“ ergibt im Deutschen einen klaren Satz; die formal nähere Wiedergabe mit „wie“ wird in der Fußnote genannt.
- source_word: דִּמִּיתִי
  choice: ich … gedachte
  rationale: Das Piel von דמה bezeichnet hier ein beabsichtigtes oder beschlossenes Handeln. „Gedachte“ gibt die Absicht knapp und feierlich wieder, ohne bloßes Nachdenken anzudeuten.
- source_word: לַעֲשׂוֹת לָהֶם
  choice: ihnen zu tun
  rationale: Die einfache Wiedergabe bewahrt die Weite von עשה und die indirekte Objektkonstruktion mit ל; der strafende Sinn ergibt sich aus dem Zusammenhang.
- source_word: אֶעֱשֶׂה לָכֶם
  choice: werde ich euch tun
  rationale: Die Wiederholung von „tun“ erhält den scharfen Parallelismus des Hebräischen und vermeidet eine zusätzliche, im Wortlaut nicht ausdrücklich benannte Art des Gerichts.
theological_decisions:
- issue: Tragweite der göttlichen Warnung
  choice: Die Aussage bleibt eine unmittelbare Androhung entsprechenden göttlichen Handelns an Israel.
  alternative: Eine abgeschwächte Aussage über bloße natürliche Folgen.
  rationale: Die erste Person Singular und die parallelen Verbformen stellen Gott selbst als Handelnden dar. Die Übersetzung wahrt den Ernst des Gerichts, ohne dessen konkrete Gestalt über den Vers hinaus auszuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gedachte“ ist leicht gehoben, aber allgemein verständlich und passt zur feierlichen Warnformel. Der bewusst harte Ausdruck „euch tun“ erhält den hebräischen Parallelismus.
