    issue: Die Wendung „ihnen zu tun ... euch tun“ ist im modernen Standarddeutsch unidiomatisch und unnötig archaisierend.
    rationale: Obwohl sie den hebräischen Parallelismus formal nachbilden will, beeinträchtigt sie Verständlichkeit und natürlichen Sprachgebrauch. Das Verb „antun“ erlaubt dieselbe syntaktische und semantische Entsprechung in gutem Deutsch.
  - severity: low
    issue: Die Fußnote bezeichnet ihre Formulierung als „Wörtlicher“, bietet aber mit „wie“ nur eine mögliche Satzanbindung und wiederholt zudem die unnatürliche Wendung „jemandem tun“.
    rationale: Eine Fußnote sollte die alternative Anbindung von כַּאֲשֶׁר als „wie“ klar und idiomatisch wiedergeben.
