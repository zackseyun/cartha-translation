base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: de
  text: Sie brachen von Elim auf und lagerten am Roten Meer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schilfmeer“. Der hebräische Name Jam Suf wird traditionell mit „Rotes Meer“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der Stationenliste den Aufbruch von einem Lagerplatz. „aufbrechen“ ist im modernen Deutschen natürlich und bewahrt die wiederkehrende Reiseformel.
- source_word: מֵאֵילִם
  choice: von Elim
  rationale: Die Präposition מִן bezeichnet den Ausgangsort; der Ortsname אֵילִם wird als „Elim“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist knapp, gegenwärtig und für die Wegstationen passend.
- source_word: עַל
  choice: am
  rationale: עַל bezeichnet hier bei einem Gewässer die Lage des Lagerplatzes an beziehungsweise neben dem Meer; „am“ ist die natürliche deutsche Ortsangabe.
- source_word: יַם סוּף
  choice: das Rote Meer
  rationale: Die traditionelle und im Deutschen geläufige Wiedergabe des geografischen Namens ist „Rotes Meer“. Die lexikalisch mögliche Wiedergabe „Schilfmeer“ wird in der Fußnote offengelegt.
theological_decisions: []
