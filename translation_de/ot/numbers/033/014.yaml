  text: וַ/יִּסְע֖וּ מֵ/אָל֑וּשׁ וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ם וְ/לֹא הָ֨יָה שָׁ֥ם מַ֛יִם לָ/עָ֖ם לִ/שְׁתּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: de
  text: Sie brachen von Alusch auf und lagerten in Refidim; doch dort gab es kein Wasser für das Volk zum Trinken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in der Itinerarformel das Aufbrechen eines Lagers und die Weiterreise. „aufbrechen“ ist im modernen Deutschen natürlich und gibt die Formel treffend wieder.
- source_word: מֵאָלוּשׁ
  choice: von Alusch
  rationale: Der Ortsname wird nach den üblichen deutschen Namensformen transliteriert und nicht übersetzt.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist knapp, verständlich und der Reiseroute angemessen.
- source_word: בִּרְפִידִם
  choice: in Refidim
  rationale: Der Ortsname wird in der im Deutschen etablierten Form wiedergegeben; die Präposition ב wird örtlich mit „in“ übersetzt.
- source_word: וְלֹא הָיָה שָׁם
  choice: doch dort gab es kein
  rationale: Das Waw leitet hier einen widrigen Umstand am neuen Lagerplatz ein. „doch“ macht diesen kontextuellen Gegensatz deutlich, ohne mehr als der Zusammenhang auszusagen.
- source_word: מַיִם
  choice: Wasser
  rationale: Die direkte und kontextuell eindeutige Entsprechung von מַיִם.
- source_word: לָעָם
  choice: das Volk
  rationale: עַם bezeichnet hier kollektiv das israelitische Volk. In der deutschen Konstruktion wird die Zugehörigkeit des nicht vorhandenen Wassers durch den Relativsatz ausgedrückt.
- source_word: לִשְׁתּוֹת
  choice: trinken konnte
  rationale: Der Infinitiv bezeichnet den vorgesehenen Gebrauch des Wassers. Der Relativsatz „das das Volk trinken konnte“ ist natürliches Deutsch und bewahrt den Sinn „Wasser für das Volk zum Trinken“.
