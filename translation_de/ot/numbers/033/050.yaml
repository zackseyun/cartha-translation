source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: de
  text: 'Und Jahwe redete zu Mose in den Steppen Moabs am Jordan bei Jericho:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … redete
  rationale: Das narrative Waw führt die Erzählung fort. »redete« gibt דבר wieder und lässt zugleich einen Unterschied zum folgenden לאמר erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; »Mose« ist die übliche deutsche Namensform.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: in den Steppen Moabs
  rationale: עֲרָבוֹת bezeichnet offene Steppen- oder Ebenenlandschaft. »Steppen Moabs« ist präzise und im Deutschen verständlich.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: am Jordan bei Jericho
  rationale: Die geografische Wendung lokalisiert die Steppen am Jordan auf der Höhe beziehungsweise in der Nähe Jerichos; die knappe deutsche Form bildet beide Ortsangaben natürlich ab.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die im nächsten Vers folgende direkte Rede ein. Im natürlichen modernen Deutsch erfüllt der Doppelpunkt dieselbe Funktion, ohne das schwerfällige »und sprach« zu wiederholen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« bewahrt ihn als Namen und vermeidet die Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Steppen« wahrt die Geländebezeichnung genauer als das allgemeinere »Ebenen«. Der Doppelpunkt gibt die redeeinleitende Funktion von לֵאמֹר idiomatisch wieder.
