  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: de
  text: Sie brachen von Ritma auf und lagerten in Rimmon-Perez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in der wiederkehrenden Reiseroutenformel das Abbrechen des Lagers und den anschließenden Aufbruch. „Sie brachen auf“ ist im modernen Deutschen idiomatisch und gibt diesen Sinn prägnant wieder.
- source_word: מֵרִתְמָה
  choice: von Ritma
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt und wird mit „von“ wiedergegeben. Der Ortsname רִתְמָה wird als „Ritma“ transkribiert.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen beziehungsweise Beziehen eines Lagers. „lagerten“ ist natürlich, verständlich und für die Reiseroutenformel angemessen.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: in Rimmon-Perez
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Lagers; bei einem Ortsnamen ist „in“ im Deutschen die natürliche Wiedergabe. Der zweiteilige Ortsname wird als „Rimmon-Perez“ transkribiert und mit Bindestrich als zusammengehöriges Toponym dargestellt.
theological_decisions: []
