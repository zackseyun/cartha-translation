  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: de
  text: Gebt morgen Feuer hinein und legt vor Yahweh Räucherwerk darauf. Dann wird der Mann, den Yahweh erwählt, der Heilige sein. Ihr geht zu weit, ihr Söhne Levis![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es ist zu viel für euch, ihr Söhne Levis!“'
    reason: Die knappe hebräische Wendung רַב לָכֶם bedeutet wörtlicher „viel/zu viel für euch“ und kann sowohl formnah als Feststellung als auch idiomatisch als Vorwurf des Zu-weit-Gehens wiedergegeben werden.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: Gebt Feuer hinein
  rationale: נתן mit ב bezeichnet hier, bezogen auf die Räucherpfannen aus dem vorherigen Vers, das Hineingeben von Feuer. Die Formulierung ist knapp und idiomatisch.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: und legt ... Räucherwerk darauf
  rationale: שים mit עַל bedeutet „legen/auflegen“. Das Pronomen bezieht sich auf die Gefäße beziehungsweise das darin befindliche Feuer; „darauf“ bewahrt die räumliche Ausdrucksweise des Hebräischen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: Die Wendung bezeichnet die kultische Handlung in Yahwehs Gegenwart; „vor“ ist im Deutschen natürlich und quellennah.
- source_word: מָחָר
  choice: morgen
  rationale: Direkte Wiedergabe des temporalen Adverbs; die Stellung macht klar, dass beide Handlungen am folgenden Tag vor Yahweh erfolgen.
- source_word: וְהָיָה
  choice: 'Dann gilt:'
  rationale: Die Verbform leitet das Ergebnis der angeordneten Prüfung ein. „Dann gilt“ gibt diese Folgerungsfunktion in natürlichem Deutsch wieder, ohne den Ausgang vorwegzunehmen.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: Der Mann, den Yahweh erwählt
  rationale: „Mann“ bewahrt den maskulinen Singular von אִישׁ; das Präsens „erwählt“ ist in einem deutschen Relativsatz mit künftigem Bezug idiomatisch.
- source_word: הוּא הַקָּדוֹשׁ
  choice: der ist der Heilige
  rationale: Das selbstständige Pronomen wird durch die wiederaufnehmende Konstruktion „der ist“ hervorgehoben. Der bestimmte Ausdruck „der Heilige“ bewahrt den Artikel und bezeichnet den von Gott ausgesonderten Mann.
- source_word: רַב לָכֶם
  choice: Ihr geht zu weit
  rationale: Die wörtlich mengenbezogene Wendung hat hier die Kraft eines Vorwurfs wegen Grenzüberschreitung. Die gewählte Formulierung ist modern und bewahrt die rhetorische Schärfe.
- source_word: בְּנֵי לֵוִי
  choice: ihr Söhne Levis
  rationale: Die direkte Anrede und das genealogische Bild des Hebräischen bleiben erhalten; das zusätzliche „ihr“ klingt im heutigen Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Yahweh“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הוּא הַקָּדוֹשׁ
  choice: der ist der Heilige
  alternative: der ist heilig; der ist derjenige, der heilig ist
  rationale: Der bestimmte Artikel bei קָדוֹשׁ und die Hervorhebung durch הוּא werden erhalten, ohne näher festzulegen, welche kultische Stellung die Erwählung im Einzelnen bestätigt.
- issue: Kraft von רַב לָכֶם
  choice: Ihr geht zu weit
  alternative: Es ist zu viel für euch; Genug von euch
  rationale: Im Kontext erwidert Mose den Vorwurf aus Vers 3 und beschuldigt die Söhne Levis der Anmaßung. Die idiomatische Wiedergabe macht diesen Vorwurf deutlich, während die formnähere Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Terminologie bleibt konkret; Satzbau und Wortwahl sind für heutige Leser verständlich. Die Wiederholung des Gottesnamens und die betonte Identifikation „der ist der Heilige“ folgen bewusst der hebräischen Struktur.
