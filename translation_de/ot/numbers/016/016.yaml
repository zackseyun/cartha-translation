source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: de
  text: 'Und Mose sagte zu Korach: „Du und deine ganze Gemeinschaft, findet euch morgen vor Jahwe ein – du, sie und Aaron.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die Waw-Fortschreibung führt die Erzählung weiter; „Und … sagte“ bewahrt den hebräischen Anschluss in natürlichem Deutsch.
- source_word: קֹרַח
  choice: Korach
  rationale: Der Personenname wird in der im Deutschen geläufigen hebräischen Form wiedergegeben.
- source_word: אַתָּה וְכָל עֲדָתְךָ
  choice: du und deine ganze Gemeinschaft
  rationale: עֵדָה bezeichnet hier die zu Korach gehörende versammelte Gruppe; „Gemeinschaft“ ist verständlich und wahrt den kollektiven Sinn.
- source_word: הֱיוּ לִפְנֵי יְהוָה
  choice: findet euch … vor Jahwe ein
  rationale: Das wörtliche „seid vor Jahwe“ bezeichnet kontextuell das angeordnete Erscheinen. „Findet euch … ein“ gibt dies natürlich wieder, ohne ein besonderes Ritual hinzuzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: du, sie und Aaron
  rationale: Die ausdrückliche Aufzählung aller Beteiligten bleibt erhalten; deutsche Zeichensetzung macht die Koordination klar.
- source_word: מָחָר
  choice: morgen
  rationale: Das Zeitadverb bezeichnet den folgenden Tag und steht im Deutschen natürlich vor der Ortsangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Imperativ wird idiomatisch als „findet euch … ein“ formuliert; die abschließende Wiederholung bleibt wegen ihrer hebräischen Hervorhebungsfunktion erhalten.
