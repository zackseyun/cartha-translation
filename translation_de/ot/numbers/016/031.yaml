lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Sobald er … zu Ende gesprochen hatte
  rationale: 'Die Konstruktion bezeichnet das unmittelbare zeitliche Zusammentreffen: Als Mose mit dem Reden fertig war, trat das Ereignis ein. „Sobald“ gibt diese Unmittelbarkeit natürlich und prägnant wieder.'
- source_word: הָאֲדָמָה
  choice: der Erdboden
  rationale: Das Wort bezeichnet hier den Boden bzw. die Erde als Oberfläche. „Erdboden“ ist im Deutschen eindeutig und passt zum anschließenden Aufspalten.
- source_word: וַתִּבָּקַע
  choice: spaltete sich
  rationale: Die Nifal-Form beschreibt, dass der Boden aufbrach bzw. sich spaltete; die reflexive deutsche Form bewahrt diese Darstellung ohne einen ausdrücklich genannten Handelnden.
- source_word: אֲשֶׁר תַּחְתֵּיהֶם
  choice: unter ihnen
  rationale: Die Relativkonstruktion wird idiomatisch und ohne Bedeutungsverlust verdichtet.
