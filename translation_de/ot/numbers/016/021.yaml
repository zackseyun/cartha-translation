  variant: modern standard German
source:
  edition: WLC
  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: de
  text: „Sondert euch aus der Mitte dieser Gemeinde ab, damit ich sie in einem Augenblick vernichte.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: Sondert euch … ab
  rationale: Der Nifal-Imperativ Plural von בדל fordert die Angesprochenen auf, sich deutlich von der Gruppe zu trennen; die reflexive deutsche Form gibt dies natürlich wieder.
- source_word: מִתּוֹךְ
  choice: aus der Mitte
  rationale: Die Verbindung bezeichnet eine Trennung aus dem Inneren einer Gruppe und bewahrt damit die räumliche Aussage des Hebräischen.
- source_word: הָעֵדָה הַזֹּאת
  choice: dieser Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels; „Gemeinde“ ist im Pentateuch gebräuchlich, verständlich und wahrt den korporativen Sinn.
- source_word: וַאֲכַלֶּה
  choice: damit ich … vernichte
  rationale: Die Form nach dem Imperativ drückt hier Absicht beziehungsweise Folge aus. „Vernichten“ bewahrt die starke Gerichtsbedeutung von כלה, ohne sie abzuschwächen.
- source_word: אֹתָם
  choice: sie
  rationale: Das Akkusativpronomen verweist auf die unter Gericht stehende Gemeinde.
- source_word: כְּרָגַע
  choice: in einem Augenblick
  rationale: רֶגַע bezeichnet eine äußerst kurze Zeitspanne; die deutsche Wendung vermittelt sowohl Kürze als auch Plötzlichkeit.
theological_decisions:
- issue: Charakter der göttlichen Gerichtsankündigung
  choice: Die Aussage wird als wirkliche Absicht wiedergegeben, die Gemeinde unverzüglich zu vernichten.
  alternative: Eine abgeschwächte Wiedergabe wie „mit ihnen verfahren“ oder „sie beseitigen“.
  rationale: כלה trägt in diesem Zusammenhang eine starke Gerichtsbedeutung. Die Übersetzung bewahrt die Härte und theologische Spannung der Ankündigung, ohne sie erklärend abzumildern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt eng am hebräischen Aufbau, klingt jedoch natürlich. „Sondert euch … ab“ ist gegenüber „Trennt euch“ etwas feierlicher und bildet בדל präzise ab.
