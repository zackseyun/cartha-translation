  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: de
  text: 'Tut Folgendes: Nehmt euch Räucherpfannen[a], Korach und seine ganze Gemeinschaft[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feuerpfannen“. Gemeint sind Gefäße, in denen glühende Kohlen getragen wurden, besonders für das Räucheropfer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine ganze Versammlung“ beziehungsweise „seine ganze Gefolgschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: Tut Folgendes
  rationale: Die Verbindung aus Demonstrativpronomen und Imperativ weist voraus auf die nun folgende Anweisung. „Tut Folgendes“ ist im Deutschen natürlich und bewahrt diese vorausweisende Funktion.
- source_word: קְחוּ לָכֶם
  choice: Nehmt euch
  rationale: Der pluralische Imperativ wird direkt wiedergegeben; das Dativpronomen „euch“ erhält die reflexive Nuance der Präposition mit Suffix.
- source_word: מַחְתּוֹת
  choice: Räucherpfannen
  rationale: Das Wort bezeichnet Gefäße für glühende Kohlen, besonders beim Räuchern. „Räucherpfannen“ ist im kultischen Zusammenhang anschaulich und hinreichend präzise.
- source_word: קֹרַח
  choice: Korach
  rationale: Der Eigenname wird nach der im Deutschen üblichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: וְכָל עֲדָתוֹ
  choice: und seine ganze Gemeinschaft
  rationale: עֵדָה bezeichnet eine zusammengehörige oder versammelte Gruppe. „Gemeinschaft“ passt hier zu Korachs Gefolgschaft, ohne den Ausdruck unnötig institutionell festzulegen.
