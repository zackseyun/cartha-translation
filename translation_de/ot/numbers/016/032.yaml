base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: de
  text: Da öffnete die Erde ihren Mund und verschlang sie, ihre Haushalte[a], alle Menschen, die zu Korach gehörten[b], und ihren gesamten Besitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Häuser“. Das hebräische Wort kann sowohl die Gebäude als auch im weiteren Sinn die zugehörigen Hausgemeinschaften bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische lautet wörtlich „jeden Menschen, der zu Korach gehörte“; „Mensch“ steht im Singular als Sammelbegriff.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: öffnete
  rationale: Das Qal-Wayyiqtol von פתח bedeutet schlicht „öffnete“. „Spaltete sich“ wäre im Zusammenhang möglich, würde dem Verb aber zusätzliche Bildhaftigkeit geben.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Erde“, „Land“ oder „Boden“ bedeuten. Hier bewahrt „die Erde“ die Personifikation des hebräischen Bildes.
- source_word: אֶת־פִּיהָ
  choice: ihren Mund
  rationale: Die wörtliche Metapher wird beibehalten; „ihre Öffnung“ würde das eindringliche Bild abschwächen.
- source_word: וַתִּבְלַע
  choice: verschlang
  rationale: בלע bedeutet gewöhnlich „verschlingen“; das deutsche Verb gibt sowohl die Handlung als auch die Personifikation natürlich wieder.
- source_word: בָּתֵּיהֶם
  choice: ihre Haushalte
  rationale: בַּיִת bezeichnet wörtlich ein Haus, kann aber erweitert die Hausgemeinschaft meinen. Im Gerichtszusammenhang ist „Haushalte“ wahrscheinlich, während die wörtliche Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: alle Menschen, die zu Korach gehörten
  rationale: אָדָם steht hier im Singular kollektiv. Der deutsche Plural „alle Menschen“ gibt die kollektive Bedeutung klar und natürlich wieder; die Zugehörigkeitsbeziehung des ל wird mit „zu Korach gehörten“ ausgedrückt.
- source_word: כָּל־הָרֲכוּשׁ
  choice: ihren gesamten Besitz
  rationale: רְכוּשׁ bezeichnet Besitz beziehungsweise Habe. „Gesamter Besitz“ ist im modernen Deutsch klar und deckt den Umfang des Ausdrucks ab.
theological_decisions:
- issue: Wiedergabe von אָדָם als kollektiver Singular
  choice: alle Menschen, die zu Korach gehörten
  alternative: jeder Mann, der zu Korach gehörte
  rationale: Die Form ist grammatisch Singular, wird mit כָּל jedoch kollektiv gebraucht. „Alle Menschen“ bildet diese kollektive Aussage im Deutschen idiomatisch ab, ohne den Personenkreis enger festzulegen, als es der hebräische Ausdruck verlangt.
- issue: Bedeutung von בָּתֵּיהֶם im Gerichtsgeschehen
  choice: ihre Haushalte
  alternative: ihre Häuser
  rationale: Der Kontext spricht wahrscheinlich von den Hausgemeinschaften, doch das hebräische Wort kann auch die Gebäude selbst bezeichnen. Diese Spannung wird durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Personifikation. „Da“ führt die fortlaufende Erzählung natürlich weiter. Die Reihung der Akkusativobjekte folgt eng der hebräischen Struktur, bleibt aber im Deutschen flüssig.
