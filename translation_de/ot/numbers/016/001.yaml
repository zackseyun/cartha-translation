source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: de
  text: Korach, der Sohn Jizhars, des Sohnes Kehats, des Sohnes Levis, nahm zusammen mit Datan und Abiram, den Söhnen Eliabs, und On, dem Sohn Pelets – sie gehörten zum Stamm Ruben –, Männer[a] mit sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt der hebräische Text: „Und Korach … nahm.“ Ein Objekt wird nicht genannt; „Männer“ ist aus dem Zusammenhang mit Vers 2 ergänzt.'
    reason: Die Fußnote macht die Ellipse des hebräischen Ausgangstextes und die für verständliches Deutsch notwendige Ergänzung transparent.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm … Männer mit sich
  rationale: Das Verb לקח bedeutet grundsätzlich „nehmen“. Da im Hebräischen kein Objekt genannt wird, wird „Männer“ aus dem unmittelbaren Zusammenhang in Vers 2 ergänzt. „Mit sich nehmen“ ergibt im Deutschen einen natürlichen, noch relativ quellennahen Satz, ohne die Handlung bereits als „Aufstand“ oder „Zusammenrotten“ auszudeuten.
- source_word: קֹרַח
  choice: Korach
  rationale: Im Deutschen übliche, am Hebräischen orientierte Form des Personennamens.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: ein Sohn Jizhars, des Sohnes Kehats, des Sohnes Levis
  rationale: Die wiederholte Abstammungsformel wird bewahrt; die deutschen Genitive machen zugleich deutlich, dass es sich um eine fortlaufende Ahnenreihe handelt.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: zusammen mit Datan und Abiram, den Söhnen Eliabs
  rationale: „Zusammen mit“ verdeutlicht die gemeinsame Beteiligung, während „Söhne Eliabs“ die genealogische Angabe direkt wiedergibt.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: und mit On, einem Sohn Pelets
  rationale: Der Name und die genealogische Zuordnung werden schlicht und transparent wiedergegeben.
- source_word: בְּנֵי רְאוּבֵן
  choice: sie waren Nachkommen Rubens
  rationale: Die Angabe bezieht sich im Satz am natürlichsten auf Datan, Abiram und On. „Nachkommen“ vermeidet im Deutschen den irreführenden Eindruck, sie seien unmittelbare leibliche Söhne Rubens, und unterscheidet die weitere Stammeszugehörigkeit von den unmittelbar zuvor genannten Vätern.
theological_decisions:
- issue: Ellipse im Eröffnungssatz
  choice: Das aus Vers 2 erschließbare Objekt „Männer“ wird ergänzt und durch eine Fußnote kenntlich gemacht.
  alternative: Nur „nahm“ ohne Objekt wiedergeben oder stärker deutend „scharten sich zusammen“ beziehungsweise „erhoben sich“ übersetzen.
  rationale: Die Ergänzung macht die im Hebräischen knappe Konstruktion im Deutschen verständlich, ohne die Art und Absicht der Handlung stärker festzulegen, als es der Ausgangstext an dieser Stelle tut.
- issue: Bezug von בְּנֵי רְאוּבֵן
  choice: Die Ruben-Zugehörigkeit wird auf Datan, Abiram und On bezogen.
  alternative: Die Formulierung grammatisch auf alle genannten Männer einschließlich des Leviten Korach beziehen.
  rationale: Korachs levitische Abstammung ist ausdrücklich genannt; die nachgestellte Ruben-Angabe kennzeichnet daher die unmittelbar zuvor genannten Datan, Abiram und On als Angehörige des Stammes Ruben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogische Struktur bleibt deutlich, wird jedoch durch idiomatische Genitive und eine eingeschobene Erklärung zur Stammeszugehörigkeit lesbar gehalten. Die Namensformen folgen geläufigen deutschen, hebräisch orientierten Schreibungen.
