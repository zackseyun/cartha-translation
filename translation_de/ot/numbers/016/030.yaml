source:
  edition: WLC
  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: de
  text: Wenn aber Jahwe etwas Neues schafft[a] und der Erdboden seinen Mund aufreißt und sie samt allem, was ihnen gehört, verschlingt und sie lebendig in die Scheol hinabsteigen[b], dann werdet ihr erkennen, dass diese Männer Jahwe verachtet haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Schöpfung erschafft“; sinngemäß: „etwas Unerhörtes schafft“. Im Hebräischen stehen ein Substantiv und ein verwandtes Verb nebeneinander, um Jahwes außergewöhnliches Handeln hervorzuheben.'
    reason: lexical_alternative
  - marker: b
    text: Scheol ist die hebräische Bezeichnung für den Bereich der Toten; je nach Zusammenhang kann auch „das Grab“ gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: etwas ganz Neues schafft
  rationale: Die figura etymologica aus dem Substantiv בְּרִיאָה und dem verwandten Verb ברא betont ein außergewöhnliches, neuartiges Schöpfungshandeln Jahwes. Die deutsche Wendung ist natürlich und bewahrt sowohl den Gedanken des Neuen als auch den des Schaffens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: der Erdboden seinen Mund aufreißt
  rationale: אֲדָמָה bezeichnet hier den Boden unter ihnen; „seinen Mund aufreißt“ bewahrt das anschauliche Bild und gibt das kräftige פצה angemessen wieder.
- source_word: וּבָלְעָה
  choice: verschlingt
  rationale: בלע bedeutet schlucken oder verschlingen; im Bild des aufgerissenen Erdbodens ist „verschlingt“ im Deutschen treffend und würdevoll.
- source_word: אֹתָם וְאֶת כָּל אֲשֶׁר לָהֶם
  choice: sie samt allem, was ihnen gehört
  rationale: Die Formulierung erhält den umfassenden Sinn, ohne den möglichen Umfang von Besitz und Zugehörigen unnötig festzulegen.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: sie lebendig ins Scheol hinabfahren
  rationale: „Lebendig“ bewahrt den hervorgehobenen Gegensatz zum Totenreich. Scheol bleibt als hebräischer Begriff erhalten, da er nicht eindeutig auf „Grab“ reduziert werden kann.
- source_word: וִידַעְתֶּם
  choice: dann werdet ihr erkennen
  rationale: Im Bedingungssatz bezeichnet die Form die daraus folgende Erkenntnis; „erkennen“ trägt dem beweiskräftigen Charakter des Zeichens Rechnung.
- source_word: נִאֲצוּ
  choice: verachtet haben
  rationale: נאץ bezeichnet verächtliche Zurückweisung beziehungsweise Geringschätzung; „verachtet haben“ gibt die starke Aussage direkt wieder.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: diese Männer
  rationale: Das ausdrücklich maskuline Pluralnomen wird entsprechend wiedergegeben.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Grab; das Totenreich
  rationale: Der hebräische Begriff kann sowohl den Bereich der Toten als auch, konkreter verstanden, das Grab bezeichnen. Die Transliteration wahrt diese Bedeutungsbreite, während die Fußnote die Alternativen erläutert.
- issue: Art des außergewöhnlichen Handelns Jahwes
  choice: etwas ganz Neues schafft
  alternative: eine Schöpfung erschafft; etwas Unerhörtes schafft
  rationale: Die Wiedergabe hält an der Schöpfungssprache des hebräischen Wortspiels fest, ohne genauer festzulegen, worin die Neuheit ontologisch besteht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das kräftige Bild vom Erdboden, der seinen Mund aufreißt, bleibt erhalten. „Sodass“ bildet den inhaltlichen Fortgang des außergewöhnlichen Zeichens natürlich ab; die Folge des Bedingungssatzes wird mit „dann“ deutlich markiert.
