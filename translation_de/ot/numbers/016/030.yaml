  rationale: Die Revision bewahrt die hebräische Konditionalstruktur durch einfache Reihung der Ereignisse, entfernt eine nicht notwendige Intensivierung und verbessert die moderne deutsche Idiomatik bei der Bewegung zur Scheol. Die Fußnotenanker bleiben unmittelbar bei den jeweils erläuterten Ausdrücken und die Fußnoten erklären die lexikalische Ambiguität ohne sie im Haupttext aufzulösen.
