base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: de
  text: 'Da ließ Mose Datan und Abiram, die Söhne Eliabs, rufen. Doch sie sagten: »Wir kommen nicht hinauf.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir gehen nicht hinauf.« Das hebräische Verb bedeutet wörtlich »hinaufgehen« und kann sich darauf beziehen, zu Mose hinaufzugehen oder auf seine Aufforderung hin vor ihm zu erscheinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ließ … rufen
  rationale: Die Verbindung von שׁלח mit dem folgenden Infinitiv קרא bezeichnet, dass Mose nach ihnen schicken und sie zu sich rufen ließ. Die deutsche Konstruktion ist natürlich und legt keinen bestimmten Boten fest.
- source_word: לִקְרֹא
  choice: rufen
  rationale: קרא mit ל bei einer Person bedeutet hier, jemanden zu sich zu rufen bzw. vorzuladen. Im Zusammenhang vermittelt »rufen lassen« den offiziellen Charakter, ohne unnötig bürokratisch zu klingen.
- source_word: דָתָן וְלַאֲבִירָם
  choice: Datan und Abiram
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition wiedergegeben.
- source_word: בְּנֵי אֱלִיאָב
  choice: die Söhne Eliabs
  rationale: Die wörtliche Herkunftsangabe identifiziert beide Männer; der deutsche Genitiv ist knapp und natürlich.
- source_word: וַיֹּאמְרוּ
  choice: Doch sie sagten
  rationale: Das einleitende Waw führt hier eine ablehnende Antwort auf Moses Aufforderung ein. »Doch« macht diesen sachlich vorhandenen Gegensatz im Deutschen deutlich.
- source_word: לֹא נַעֲלֶה
  choice: Wir kommen nicht hinauf
  rationale: עלה bedeutet wörtlich »hinaufgehen«. Die Verneinung des Imperfekts drückt hier eine entschiedene Weigerung aus. »Hinaufkommen« bewahrt die räumliche Bildlichkeit und passt zur Bewegung an den Ort des Rufenden.
