  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: de
  text: 'Dann sagte Mose zu Korach: „Hört doch, ihr Söhne Levis!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hört bitte, ihr Söhne Levis!“; auch möglich: „Hört jetzt, ihr Leviten!“'
    reason: Lexikalische Alternativen für נָא und eine idiomatischere Wiedergabe von בְּנֵי לֵוִי.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Dann sagte“ gibt die Abfolge in natürlichem modernem Deutsch wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: אֶל קֹרַח
  choice: zu Korach
  rationale: אֶל kennzeichnet den Adressaten; „zu Korach“ ist die natürliche deutsche Wiedergabe. Der Name folgt der im Deutschen üblichen Form.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der maskuline Pluralimperativ von שׁמע ist eine nachdrückliche Aufforderung zum Zuhören; „Hört“ bewahrt die knappe rhetorische Form.
- source_word: נָא
  choice: doch
  rationale: Die Partikel verstärkt oder mildert die Aufforderung. Im Deutschen vermittelt „doch“ hier einen dringlichen Appell natürlicher als das höflich klingende „bitte“.
- source_word: בְּנֵי לֵוִי
  choice: ihr Söhne Levis
  rationale: Die wörtliche Verwandtschaftsbezeichnung und ihre männliche Form bleiben erhalten; der deutsche Genitiv „Levis“ ist idiomatisch.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung in der direkten Anrede
  choice: ihr Söhne Levis
  alternative: ihr Leviten / ihr Nachkommen Levis
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Ausdruck „Söhne Levis“. Die Übersetzung bewahrt diese Form, ohne sie zu einer neutraleren Stammesbezeichnung zu verallgemeinern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt knapp und nachdrücklich; „doch“ gibt den appellativen Ton von נָא wieder.
