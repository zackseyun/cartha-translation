  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וַ/יֵּ֖לֶךְ אֶל דָּתָ֣ן וַ/אֲבִירָ֑ם וַ/יֵּלְכ֥וּ אַחֲרָ֖י/ו זִקְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: de
  text: Da stand Mose auf und ging zu Datan und Abiram, und die Ältesten Israels gingen hinter ihm her.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand auf
  rationale: Das wayyiqtol von קום bezeichnet hier das Aufstehen als Beginn der nächsten Handlung; „stand auf“ ist im deutschen Erzählstil natürlich und präzise.
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: הלך bezeichnet allgemein das Gehen; „ging“ passt zum schlichten narrativen Zusammenhang, ohne die Fortbewegungsart näher zu bestimmen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet die auf Personen gerichtete Bewegung; im Deutschen ist „zu“ die natürliche Entsprechung.
- source_word: דָּתָן וַאֲבִירָם
  choice: Datan und Abiram
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition wiedergegeben.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: gingen hinter ihm her
  rationale: Die Wendung bewahrt sowohl das Verb הלך als auch die räumlich-narrative Vorstellung von אַחֲרָיו und klingt in modernem Deutsch natürlich.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Die Konstruktverbindung bezeichnet die anerkannten Ältesten beziehungsweise führenden Männer Israels; „die Ältesten Israels“ ist transparent und konventionell.
- source_word: וַ
  choice: Da / und
  rationale: Das einleitende „Da“ gibt den Fortgang der Erzählung idiomatisch wieder; das folgende „und“ wahrt die koordinierende Abfolge des hebräischen Narrativs.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Die enge hebräische Wendung „gingen hinter ihm her“ ist ohne Fußnote verständlich und bewahrt die Bildhaftigkeit des Ausgangstextes.
