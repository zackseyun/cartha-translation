  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: de
  text: Als Mose das hörte, fiel er mit dem Gesicht zu Boden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fiel auf sein Gesicht“. Hebräische Redewendung für ein Niederfallen mit dem Gesicht zum Boden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Als … das hörte
  rationale: שׁמע bedeutet hier in der fortlaufenden Erzählung natürlich „hören“. Das im Hebräischen nicht ausgedrückte Objekt wird durch „das“ aus dem vorhergehenden Zusammenhang aufgenommen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: וַיִּפֹּל
  choice: warf er sich … zu Boden
  rationale: נפל bedeutet wörtlich „fallen“. Zusammen mit עַל־פָּנָיו bezeichnet die Wendung hier das Niederfallen; die gewählte Formulierung gibt die körperliche Bewegung in natürlichem Deutsch wieder, ohne ihren Anlass näher zu deuten.
- source_word: עַל־פָּנָיו
  choice: mit dem Gesicht zu Boden
  rationale: Die hebräische Wendung bedeutet wörtlich „auf sein Gesicht“ und beschreibt eine vollständig niedergeworfene Haltung. „Mit dem Gesicht zu Boden“ bewahrt das konkrete Bild und klingt im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutung von Moses Körperhaltung
  choice: Die körperliche Handlung wird als Niederwerfen mit dem Gesicht zu Boden wiedergegeben, ohne sie ausdrücklich als Gebet, Trauer, Demut oder Fürbitte zu erklären.
  alternative: „Er warf sich im Gebet nieder“ oder „er fiel vor Trauer auf sein Gesicht“.
  rationale: Der hebräische Text nennt nur die Handlung und legt ihre genaue emotionale oder religiöse Bedeutung nicht ausdrücklich fest. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die idiomatische Haupttextfassung vermittelt die konkrete Körperhaltung; die Fußnote dokumentiert die hebräische Ausdrucksweise.
