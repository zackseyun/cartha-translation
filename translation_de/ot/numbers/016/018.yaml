  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: de
  text: Da nahm jeder seine Räucherpfanne[a]. Sie legten Feuer hinein und taten Räucherwerk darauf. Dann stellten sie sich zusammen mit Mose und Aaron an den Eingang des Zeltes der Begegnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feuerpfanne“. Das hebräische Wort bezeichnet ein Gefäß, in dem glühende Kohlen zum Darbringen von Räucherwerk getragen wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: jeder seine Räucherpfanne
  rationale: אִישׁ ist hier distributiv gebraucht, und das Possessivsuffix bezeichnet das jeweilige eigene Gefäß. „Räucherpfanne“ benennt ein Gefäß, in dem glühende Kohlen zum Verbrennen von Räucherwerk getragen wurden.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: Sie legten Feuer hinein
  rationale: עַל bedeutet wörtlich „auf“, bezeichnet bei einem Gefäß hier aber idiomatisch das Hineinlegen der glühenden Kohlen. „Hinein“ ist im Deutschen natürlich und macht den Vorgang klar.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: taten Räucherwerk darauf
  rationale: Das Räucherwerk wird auf das Feuer beziehungsweise die glühenden Kohlen in den Pfannen gelegt. „Darauf“ bewahrt die räumliche Aussage der hebräischen Präposition.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: „Räucherwerk“ ist die geläufige Bezeichnung für die aromatische Substanz, die im gottesdienstlichen Zusammenhang verbrannt wird.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: an den Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet den Eingang oder die Öffnung. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד verständlich und in etablierter kultischer Sprache wieder.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: zusammen mit Mose und Aaron
  rationale: Der verblosen Schlussfügung nach der Ortsangabe wird im Deutschen durch „zusammen mit“ ein klarer syntaktischer Anschluss gegeben; Mose und Aaron stehen ebenfalls dort.
