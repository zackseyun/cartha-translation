    rationale: Die Wendung ist als wörtliche Wiedergabe sperrig. „Sie zogen ... weg“ bewahrt die wörtliche Aufwärtsbewegung besser, während die Erklärung die idiomatische Bedeutung vorsichtig einordnet.
