  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: de
  text: Da entfernten sie sich aus der Umgebung des Wohnplatzes Korachs, Datans und Abirams.[a] Datan und Abiram aber kamen heraus und standen am Eingang ihrer Zelte, zusammen mit ihren Frauen, ihren Söhnen und ihren kleinen Kindern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da zogen sie hinauf, weg aus der Umgebung des Wohnplatzes Korachs, Datans und Abirams.« Das hebräische Verb bedeutet wörtlich »hinaufziehen«, bezeichnet hier aber wahrscheinlich das Zurückweichen aus diesem Bereich. Mit »Wohnplatz« ist nicht das Heiligtumszelt des HERRN gemeint, sondern der Wohn- bzw. Lagerbereich der genannten Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: entfernten sie sich aus der Umgebung
  rationale: Das Verb bedeutet wörtlich »hinaufgehen«, bezeichnet hier mit מֵעַל und מִסָּבִיב jedoch im Zusammenhang das Zurückweichen aus dem umliegenden Bereich. Die Formulierung gibt die räumliche Trennung natürlich wieder.
- source_word: מִשְׁכַּן
  choice: Wohnstätte
  rationale: Hier ist die Wohn- beziehungsweise Lagerstätte der genannten Männer gemeint, nicht das Heiligtum des HERRN. »Wohnstätte« bewahrt den konkreten Sinn und vermeidet eine Verwechslung mit der Stiftshütte.
- source_word: יָצְאוּ
  choice: kamen heraus
  rationale: Datan und Abiram treten aus ihren Zelten ins Blickfeld; »kamen heraus« ist dafür im Deutschen natürlich.
- source_word: נִצָּבִים
  choice: stellten sich
  rationale: Das Partizip beschreibt, dass sie am Zelteingang aufrecht beziehungsweise positioniert dastanden. »Stellten sich« gibt die Szene wieder, ohne ausdrücklich Trotz oder Widerstand hineinzulesen.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: an den Eingang ihrer Zelte
  rationale: Die Pluralform »ihre Zelte« wird beibehalten; פתח bezeichnet deren Eingang oder Öffnung.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: zusammen mit ihren Frauen, ihren Söhnen und ihren kleinen Kindern
  rationale: »Söhne« hält die Bezeichnung בנים von טף, den kleinen Kindern beziehungsweise Angehörigen, auseinander. »Zusammen mit« drückt die Begleitung idiomatisch aus.
