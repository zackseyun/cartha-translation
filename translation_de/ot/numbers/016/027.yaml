    rationale: נִצָּבִים ist ein Partizip und beschreibt hier ihre Haltung bzw. Position am Eingang. „Stellten sich“ kann einen zusätzlichen, punktuellen Bewegungsvorgang nahelegen.
  - severity: low
    issue: Fußnote erklärt die Bedeutung von מִשְׁכָּן nicht
    rationale: „Wohnstätte“ könnte im Pentateuch-Kontext mit dem Heiligtumszelt assoziiert werden. Eine knappe Anmerkung, dass der Wohnplatz der genannten Männer gemeint ist, verhindert diese Verwechslung.
  - severity: low
