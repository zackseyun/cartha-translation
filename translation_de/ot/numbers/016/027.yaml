  to: Da entfernten sie sich aus der Umgebung des Wohnplatzes Korachs, Datans und Abirams.[a] Datan und Abiram aber kamen heraus und standen am Eingang ihrer Zelte, zusammen mit ihren Frauen, ihren Söhnen und ihren kleinen Kindern.
