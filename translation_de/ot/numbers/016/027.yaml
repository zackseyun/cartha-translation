  source_fidelity: 'Die Grundbedeutung wird weitgehend getroffen: Die Menge zieht sich aus dem Bereich der Wohnstätte zurück; Datan und Abiram treten mit ihren Familien an die Zelteingänge. Allerdings ist „stellten sich“ gegenüber dem hebräischen Partizip נִצָּבִים weniger präzise, da es vor allem den Zustand „standen“ beschreibt, nicht zwingend das Sich-hinstellen. Die Fußnote gibt die Konstruktion zudem unnötig schwerfällig und mit einer nicht ganz passenden wörtlichen Wortstellung wieder.'
  naturalness: Der Text ist gut verständlich und angemessen würdevoll. „Wohnstätte“ wirkt jedoch etwas gehoben und abstrakt; „Wohnplatz“ ist im Kontext eines Lagers konkreter und modern natürlich. „standen am Eingang ihrer Zelte“ ist idiomatisch und näher am Ausgangstext.
  terminology: Eigennamen, „Frauen“, „Söhne“ und „kleine Kinder“ sind korrekt. Die Fußnote sollte klarstellen, dass מִשְׁכָּן hier nicht das Heiligtumszelt bezeichnet; diese wichtige Abgrenzung fehlt im deutschen Fußnotenbestand trotz entsprechender englischer Audit-Notiz.
