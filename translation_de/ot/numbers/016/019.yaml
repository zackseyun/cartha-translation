  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: de
  text: Und Korach versammelte die ganze Gemeinde am Eingang des Zeltes der Begegnung gegen sie. Da erschien die Herrlichkeit Jahwes[a] der ganzen Gemeinde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: versammelte
  rationale: Der Hifil von קהל bezeichnet hier das aktive Zusammenrufen beziehungsweise Versammeln durch Korach. „Versammelte“ ist präzise und natürlich.
- source_word: עֲלֵיהֶם
  choice: gegen sie
  rationale: עַל hat im Zusammenhang der Auflehnung eine feindliche beziehungsweise gegnerische Ausrichtung. „Gegen sie“ bezieht sich im Kontext auf Mose und Aaron.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet in Numeri häufig die Gemeinschaft Israels als versammelten Gesamtverband; כָּל wird mit „die ganze“ wiedergegeben.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: אֶל bezeichnet das Ziel der Versammlung; im Deutschen gibt „am Eingang“ den erreichten Versammlungsort idiomatisch wieder. „Zelt der Begegnung“ bewahrt die herkömmliche sachliche Bedeutung von אֹהֶל מוֹעֵד.
- source_word: וַיֵּרָא
  choice: Da erschien
  rationale: Der Nifal von ראה bezeichnet hier das Sichtbarwerden einer göttlichen Erscheinung. „Da erschien“ gibt zugleich den erzählerischen Fortgang natürlich wieder.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet hier die wahrnehmbare Manifestation der göttlichen Gegenwart; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: אֶל כָּל הָעֵדָה
  choice: der ganzen Gemeinde
  rationale: Beim Verb „erscheinen“ wird die Personengruppe, der etwas erscheint, im Deutschen idiomatisch im Dativ bezeichnet; damit bleibt die Gemeinde als Adressatin der Erscheinung erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt, ohne den Namen im Haupttext durch einen Titel zu ersetzen.
- issue: Bezug und Richtung von עֲלֵיהֶם
  choice: gegen sie
  alternative: bei ihnen / um sie herum
  rationale: Der unmittelbare Konfliktzusammenhang legt die gegnerische Ausrichtung der von Korach versammelten Gemeinde gegen Mose und Aaron nahe. Die Präposition kann in anderen Zusammenhängen räumlich verstanden werden, doch hier ist die adversative Lesart am wahrscheinlichsten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Erzählfolge, während „Da erschien“ den Übergang idiomatisch gestaltet. „Zelt der Begegnung“ ist verständlich und terminologisch beständig; „Gemeinde“ bewahrt den kollektiven Charakter von עֵדָה.
