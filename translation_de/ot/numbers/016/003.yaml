id: NUM.16.3
reference: Numbers 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: de
  text: 'Sie scharten sich gegen Mose und Aaron zusammen und sagten zu ihnen: „Ihr geht zu weit![a] Denn die ganze Gemeinde – sie alle – ist heilig, und Jahwe ist mitten unter ihnen.[b] Warum erhebt ihr euch also über die Versammlung Jahwes?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Genug für euch!“ oder: „Zu viel für euch!“ Die hebräische Wendung ist ein scharfer Vorwurf.'
    reason: lexical_alternative
  - marker: b
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder, der traditionell auch mit „der HERR“ wiedergegeben wird.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: Sie scharten sich gegen … zusammen
  rationale: Das Nifal von קהל bezeichnet das gemeinsame Zusammenkommen; mit עַל ist hier aufgrund des konfrontativen Zusammenhangs eine gegen Mose und Aaron gerichtete Sammlung gemeint. „Sich gegen jemanden zusammenscharen“ gibt beides natürlich wieder.
- source_word: רַב לָכֶם
  choice: Ihr geht zu weit!
  rationale: Die knappe hebräische Wendung, wörtlich etwa „Genug für euch!“ oder „Zu viel für euch!“, fungiert als scharfer Vorwurf. Die gewählte Formulierung ist im modernen Deutschen klar, ohne die Aussage weiter auszudeuten.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: die ganze Gemeinde – sie alle –
  rationale: Die Wiederaufnahme durch כֻּלָּם verstärkt die ausnahmslose Gesamtheit. Gedankenstriche bewahren diesen Nachdruck in natürlichem Deutsch.
- source_word: קְדֹשִׁים
  choice: heilig
  rationale: „Heilig“ ist die sachlich und theologisch angemessene Wiedergabe von קדושׁ; die Behauptung der Sprecher wird ohne wertende Zusätze wiedergegeben.
- source_word: וּבְתוֹכָם יְהוָה
  choice: und Jahwe ist mitten unter ihnen
  rationale: „Mitten unter ihnen“ bringt die göttliche Gegenwart innerhalb der Gemeinschaft präzise und idiomatisch zum Ausdruck. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וּמַדּוּעַ תִּתְנַשְּׂאוּ
  choice: Warum erhebt ihr euch also
  rationale: Der Hitpael von נשׂא bezeichnet hier reflexive Selbsterhöhung. „Also“ macht den folgernden Anschluss an die vorangehende Begründung deutlich.
- source_word: עַל קְהַל יְהוָה
  choice: über die Versammlung Jahwes
  rationale: Mit dem Verb der Selbsterhöhung bezeichnet עַל eine Stellung über anderen. „Versammlung“ bildet קהל ab und unterscheidet es angemessen von עֵדָה („Gemeinde“) im vorherigen Satzteil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bewertung der Behauptung, die ganze Gemeinde sei heilig
  choice: Die Behauptung wird ohne interpretierende Einschränkung direkt wiedergegeben.
  alternative: Zusätze wie „angeblich heilig“ oder eine abschwächende Umschreibung
  rationale: Der Vers berichtet die Aussage der Aufständischen; ihre theologische Bewertung bleibt dem weiteren Erzählzusammenhang überlassen. So bleiben Spannung und Sprecherperspektive erhalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede bleibt scharf und emphatisch; die Gedankenstriche bilden die hebräische Verstärkung ab. „Gemeinde“ und „Versammlung“ geben die unterschiedlichen hebräischen Wörter עֵדָה und קהל wieder.
