source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: de
  text: Er hat dich und mit dir alle deine Brüder, die Söhne Levis, zu sich kommen lassen, und ihr begehrt auch noch das Priestertum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: hat … zu sich kommen lassen
  rationale: Der Hifil von קרב bezeichnet ein Heranbringen bzw. das Gewähren von Nähe und Zugang. „Zu sich kommen lassen“ gibt hier natürlich wieder, dass Gott Korach und den Leviten kultische Nähe gewährt hat.
- source_word: אֹתְךָ
  choice: dich
  rationale: Das maskuline Singularobjekt spricht Korach persönlich an.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: und … alle deine Brüder, die Söhne Levis
  rationale: „Deine Brüder“ bleibt erhalten; „die Söhne Levis“ identifiziert sie appositionell und bildet die hebräische Form transparent ab.
- source_word: אִתָּךְ
  choice: mit dir
  rationale: Bezeichnet Korach zusammen mit seinen levitischen Brüdern; die ungewöhnliche Punktierung ändert den kontextuell eindeutigen Bezug nicht.
- source_word: וּבִקַּשְׁתֶּם
  choice: Und nun verlangt ihr … nach
  rationale: בקש kann „suchen“, „begehren“ oder „verlangen“ bedeuten. Im tadelnden Kontext drückt „verlangen nach“ das Streben nach einem zusätzlichen Amt aus. Das pluralische „ihr“ wahrt den Wechsel von Korach als Einzelperson zur angesprochenen Gruppe.
- source_word: גַּם
  choice: auch noch
  rationale: Kennzeichnet die zusätzliche Forderung über das bereits gewährte levitische Vorrecht hinaus und bringt im Deutschen den tadelnden Zusammenhang idiomatisch zum Ausdruck.
- source_word: כְּהֻנָּה
  choice: das Priestertum
  rationale: Bezeichnet hier den priesterlichen Stand bzw. das Priesteramt im Unterschied zum levitischen Dienst.
theological_decisions:
- issue: Unterscheidung zwischen dem kultischen Status der Leviten und dem der Priester
  choice: das Priestertum
  alternative: den Priesterdienst / das Priesteramt
  rationale: '„Das Priestertum“ bewahrt die institutionelle und theologische Unterscheidung: Korach und seine Gefährten streben über den ihnen gewährten levitischen Dienst hinaus nach dem Priestertum.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage macht den im Kontext vorwurfsvollen Sinn der hebräischen Koordination deutlich. Der Wechsel von Singular („dich“) zu Plural („ihr“) wird bewahrt.
