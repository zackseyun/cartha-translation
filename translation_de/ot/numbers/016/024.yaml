  text: דַּבֵּ֥ר אֶל הָ/עֵדָ֖ה לֵ/אמֹ֑ר הֵֽעָלוּ֙ מִ/סָּבִ֔יב לְ/מִשְׁכַּן קֹ֖רַח דָּתָ֥ן וַ/אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: de
  text: 'Sag der Gemeinde: »Zieht euch aus der Umgebung der Wohnstätte Korachs, Datans und Abirams zurück!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵעָלוּ
  choice: Zieht euch … zurück
  rationale: Der Nifal-Imperativ von עלה fordert hier im Zusammenhang eine räumliche Entfernung aus dem Gefahrenbereich. Die idiomatische deutsche Wendung gibt die Bewegung weg von der genannten Wohnstätte klar wieder, ohne eine im Deutschen missverständliche Aufwärtsbewegung zu behaupten.
- source_word: הָעֵדָה
  choice: der Gemeinde
  rationale: „Gemeinde“ bezeichnet hier die versammelte Gemeinschaft Israels und entspricht dem hebräischen Kollektivbegriff in natürlichem biblischem Deutsch.
- source_word: מִשְׁכַּן
  choice: Wohnstätte
  rationale: Das Wort bezeichnet eine Stätte des Wohnens. „Wohnstätte“ bewahrt den Singular und vermeidet eine vorschnelle Festlegung auf „Zelt“, auch wenn der Kontext eine Zeltanlage nahelegt.
- source_word: מִסָּבִיב לְ
  choice: aus der Umgebung
  rationale: Die Verbindung bezeichnet den Bereich rings um die Wohnstätte; „aus der Umgebung“ verbindet diesen Ausgangspunkt natürlich mit der Aufforderung, sich zurückzuziehen.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die einleitende Redeformel דַּבֵּר … לֵאמֹר wird idiomatisch durch „Sag …:“ wiedergegeben; die direkte Aufforderung steht in deutschen Anführungszeichen.
