  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder; „sprach“ entspricht der feierlichen Redeeinleitung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: אֶל
  choice: zu
  rationale: In Verbindung mit einem Verb des Sprechens ist „zu“ die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Übliche deutsche Form des Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die in Vers 24 folgende direkte Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den persönlichen Namen, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitung wird idiomatisch mit einem Doppelpunkt abgeschlossen, da die direkte Rede im folgenden Vers beginnt.
