id: NUM.16.29
reference: Numbers 16:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: de
  text: Wenn diese Männer sterben wie alle Menschen und sie das Los aller Menschen trifft[a], dann hat Jahwe mich nicht gesandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Heimsuchung aller Menschen über sie kommt“. Im Hebräischen stehen hier ein Substantiv und ein Verb derselben Wurzel פקד; diese kann eine Heimsuchung, eine Zuweisung oder das bezeichnen, was jemandem widerfährt.'
    reason: lexikalische Alternative und im Deutschen nicht vollständig nachbildbare Wortwiederholung
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet schlicht und natürlich den Bedingungssatz ein, mit dem Mose die Echtheit seiner Sendung prüfbar macht.
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: diese Männer sterben wie alle Menschen
  rationale: Die vergleichende Konstruktion bezeichnet den gewöhnlichen Tod, der allen Menschen widerfährt. Die deutsche Fassung ist natürlich und bewahrt den kollektiven, geschlechtsübergreifenden Sinn von אָדָם.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: und sie das Los aller Menschen trifft
  rationale: פְּקֻדָּה und das verwandte Verb פקד können eine Heimsuchung, Zuweisung oder das jemandem Widerfahrende bezeichnen. „Los“ lässt offen, ob vor allem Schicksal, Heimsuchung oder zugewiesenes Ergehen gemeint ist; die Fußnote weist auf die hebräische Wortwiederholung hin.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: dann hat Jahwe mich nicht gesandt
  rationale: Das deutsche Perfekt bezeichnet die vorausliegende Sendung mit ihrer gegenwärtigen Bedeutung. „Dann“ macht die im Hebräischen aus dem Bedingungssatz hervorgehende Folgerung idiomatisch deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen in einer im Deutschen etablierten wissenschaftlichen Umschrift.
- issue: Generischer Sinn von כָּל הָאָדָם
  choice: alle Menschen
  alternative: jeder Mensch; die ganze Menschheit
  rationale: אָדָם ist hier kollektiv und bezeichnet das allgemein menschliche Geschick, nicht ausschließlich männliche Personen.
- issue: Bedeutungsbreite der Wurzel פקד
  choice: Los … trifft
  alternative: Heimsuchung … kommt über sie; ihnen widerfährt, was allen Menschen bestimmt ist
  rationale: Die Formulierung hält die Aussage vom allgemeinen menschlichen Ergehen offen, ohne sie vorschnell ausschließlich als Strafe zu deuten. Die formale Wortwiederholung des Hebräischen wird in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die parallelen Satzglieder des Hebräischen bleiben erkennbar; schwer verständliche wörtliche Wendungen wie „den Tod aller Menschen sterben“ werden zugunsten natürlicher deutscher Syntax vermieden.
