  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose und Aaron:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Verbform führt die Erzählung fort; „sprach“ gibt דבר in der üblichen gehobenen Erzählform wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und Aaron
  rationale: Die Präposition אֶל bezeichnet beide Adressaten. Im natürlichen Deutschen muss „zu“ vor Aaron nicht wiederholt werden, obwohl es im Hebräischen erneut steht.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel „indem er sagte/mit den Worten“ kündigt direkte Rede an; im modernen Deutschen übernimmt der Doppelpunkt diese Funktion idiomatisch und knapp.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Wiedergabe und bewahrt den Charakter als persönlichen Gottesnamen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte hebräische Wendung לֵאמֹר wird vor der anschließenden direkten Rede idiomatisch durch einen Doppelpunkt wiedergegeben.
