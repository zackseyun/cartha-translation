  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: de
  text: 'Er sagte zu der Gemeinde: „Entfernt euch bitte von den Zelten dieser gottlosen Männer und berührt nichts von dem, was ihnen gehört, sonst werdet ihr im Zusammenhang mit all ihren Sünden weggerafft.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sonst werdet ihr wegen all ihrer Sünden vernichtet.“ Das Hebräische kann hier auch in einem ausdrücklich kausalen Sinn verstanden werden.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinde“ bewahrt den gemeinschaftlichen Sinn und ist im Deutschen in diesem erzählerischen Zusammenhang gut verständlich.
- source_word: סוּרוּ נָא
  choice: Entfernt euch bitte
  rationale: סוּר fordert zum Weggehen beziehungsweise Zurückweichen auf; נָא verleiht der Aufforderung einen dringlichen, bittenden Ton und bedeutet hier nicht einfach zeitlich „jetzt“.
- source_word: מֵעַל אָהֳלֵי
  choice: von den Zelten
  rationale: מֵעַל bezeichnet hier idiomatisch die Trennung aus dem unmittelbaren Bereich der Zelte. „Von den Zelten“ gibt die räumliche Warnung natürlich wieder.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: diese gottlosen Männer
  rationale: רְשָׁעִים bezeichnet moralisch und gerichtlich schuldige, frevelhafte Menschen. „Gottlos“ ist in diesem Gerichtskontext würdig und verständlich; „Männer“ entspricht dem ausdrücklich männlichen אֲנָשִׁים.
- source_word: וְאַל תִּגְּעוּ
  choice: und berührt nichts
  rationale: נגע bedeutet unmittelbar „berühren“ oder „in Kontakt kommen“. Die direkte Formulierung wahrt den uneingeschränkten Charakter des Verbots.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: nichts von dem, was ihnen gehört
  rationale: Die Wendung umfasst ihren gesamten Besitz. Nach dem verneinten Imperativ ist „nichts von dem, was ihnen gehört“ natürliches modernes Deutsch.
- source_word: פֶּן תִּסָּפוּ
  choice: sonst werdet ihr … mit weggerafft
  rationale: Das Niphal von ספה kann „weggerafft“, „vernichtet“ oder „aufgerieben werden“ bedeuten. „Mit weggerafft“ bewahrt das passive Gerichtsgeschehen und macht deutlich, dass die Angesprochenen in das bevorstehende Unheil hineingezogen werden könnten.
- source_word: בְּכָל חַטֹּאתָם
  choice: in all ihren Sünden
  rationale: Die Präposition ב kann hier Zusammenhang, Begleitumstand oder Ursache ausdrücken. Die nahe Wiedergabe „in all ihren Sünden“ erhält diese Mehrdeutigkeit; eine ausdrücklich kausale Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Gemeinsame Betroffenheit vom Gericht durch Nähe zu den Schuldigen
  choice: Die Warnung verlangt Abstand von den schuldigen Männern und ihrem Besitz, damit die Gemeinde nicht in das mit ihren Sünden verbundene Gericht hineingerissen wird.
  alternative: 'Die Schlusswendung kann ausdrücklich kausal verstanden werden: „damit ihr nicht wegen all ihrer Sünden vernichtet werdet“.'
  rationale: Der hebräische Wortlaut verbindet räumliche Nähe, Sünde und drohendes Gericht, legt jedoch nicht eindeutig fest, ob בְּכָל חַטֹּאתָם vor allem begleitend-assoziativ oder kausal zu verstehen ist. Die Übersetzung bewahrt diese Spannung, ohne eine Lehre von übertragener Schuld einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Aufforderung bleibt eindringlich, während „bitte“ die Funktion von נָא wiedergibt. Das etwas markierte „in all ihren Sünden“ wurde bewusst beibehalten, um die Mehrdeutigkeit des hebräischen ב nicht vorschnell auf eine rein kausale Aussage zu verengen.
