  text: וַ/יֵּ֨רְד֜וּ הֵ֣ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֛ם חַיִּ֖ים שְׁאֹ֑לָ/ה וַ/תְּכַ֤ס עֲלֵי/הֶם֙ הָ/אָ֔רֶץ וַ/יֹּאבְד֖וּ מִ/תּ֥וֹךְ הַ/קָּהָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: de
  text: Da stiegen sie lebendig in den Scheol hinab – sie und alles, was ihnen gehörte –, und die Erde bedeckte sie, und sie kamen aus der Mitte der Gemeinde um[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie gingen aus der Mitte der Gemeinde zugrunde“. Hebräisch: „Scheol“ kann auch „Grab“ oder „Totenreich“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: So fuhren sie … hinab
  rationale: ירד bezeichnet eine Bewegung nach unten. „hinabfahren“ ist im Zusammenhang mit dem Totenreich natürlich und bewahrt die räumliche Bildsprache.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: sie und alles, was ihnen gehörte
  rationale: Die Formulierung bleibt so weit wie das Hebräische und beschränkt das Gemeinte weder ausschließlich auf Personen noch ausschließlich auf Besitz.
- source_word: חַיִּים
  choice: lebend
  rationale: Das prädikativ gebrauchte Wort betont, dass sie noch am Leben waren, als sie hinabfuhren.
- source_word: שְׁאֹלָה
  choice: ins Totenreich
  rationale: שְׁאוֹל bezeichnet hier den Bereich der Toten; „Totenreich“ gibt den Begriff verständlich wieder, ohne ihn auf ein einzelnes Grab oder auf eine spätere Höllenvorstellung zu verengen. Die Richtungsendung wird mit „ins“ ausgedrückt.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: Die Erde bedeckte sie
  rationale: Die Erde bleibt wie im Hebräischen Subjekt. „bedeckte sie“ ist im Deutschen idiomatisch und gibt כסה mit עַל sachgerecht wieder.
- source_word: וַיֹּאבְדוּ
  choice: sie verschwanden
  rationale: אבד kann „zugrunde gehen“ oder „verschwinden“ bedeuten. In Verbindung mit מִתּוֹךְ bezeichnet „verschwanden aus“ anschaulich ihr Ausscheiden aus der Gemeinde, ohne den bereits beschriebenen Vorgang unnötig zu verdoppeln.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: aus der Mitte der Gemeinde
  rationale: Die Wendung bildet מִתּוֹךְ eng ab; „Gemeinde“ bezeichnet hier die versammelte Gemeinschaft Israels in natürlichem biblischem Deutsch.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab; Unterwelt
  rationale: „Totenreich“ bewahrt die alttestamentliche Vorstellung eines Bereichs der Toten besser als „Grab“ und vermeidet zugleich, שְׁאוֹל mit der später systematisierten Vorstellung der Hölle gleichzusetzen. Eine Fußnote ist nicht nötig, weil die deutsche Wiedergabe den Sinn unmittelbar erschließt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der dramatischen Abfolge des Hebräischen; der Gedankenstrich hebt die nähere Bestimmung des Subjekts hervor. „Hinabfahren“ und „Gemeinde“ bewahren einen angemessen biblischen Ton, bleiben aber allgemein verständlich.
