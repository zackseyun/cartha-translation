revisions:
- from: So fuhren sie lebend ins Totenreich hinab – sie und alles, was ihnen gehörte. Die Erde bedeckte sie, und sie verschwanden aus der Mitte der Gemeinde.
  to: Da stiegen sie lebendig in den Scheol hinab – sie und alles, was ihnen gehörte –, und die Erde bedeckte sie, und sie kamen aus der Mitte der Gemeinde um[a].
  rationale: Die Revision ersetzt die unnötig spezifische und weniger natürliche Bewegungsbeschreibung durch „stiegen ... hinab“, transliteriert Scheol zur Wahrung der semantischen und theologischen Offenheit und gibt אבד mit „kamen ... um“ kontextgerecht wieder. Die Fußnote dokumentiert die wesentlichen lexikalischen Alternativen, ohne sie zur Hauptaussage zu machen.
