  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: de
  text: 'Da flohen alle Israeliten, die um sie herum waren, vor ihrem Geschrei[a]; denn sie sagten: »Sonst verschlingt die Erde auch uns!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor ihrem Lärm«. Das hebräische Wort kann Stimme, Laut, Schrei oder Geräusch bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: Da flohen alle Israeliten
  rationale: Die kollektive Bezeichnung wird im modernen Deutschen natürlich mit »alle Israeliten« wiedergegeben; »Da« führt die unmittelbare Reaktion im Erzählzusammenhang idiomatisch fort.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: die rings um sie standen
  rationale: Die Wendung bezeichnet die Menschen in ihrer unmittelbaren Umgebung. Das ergänzte »standen« ergibt einen natürlichen deutschen Relativsatz, ohne eine besondere Handlung zu behaupten.
- source_word: נָסוּ
  choice: flohen
  rationale: נוּס bezeichnet hier eine eilige Flucht vor der drohenden Gefahr.
- source_word: לְ/קֹלָם
  choice: vor ihrem Geschrei
  rationale: קוֹל kann Stimme, Laut, Schrei oder Geräusch bezeichnen. Im Zusammenhang liegt das hörbare Schreien der Verschlungenen nahe; die Präposition לְ bezeichnet den Anlass der Flucht. Die breitere Bedeutung »Lärm« bleibt in der Fußnote erhalten.
- source_word: כִּי אָמְרוּ
  choice: denn sie sagten
  rationale: כִּי führt die von den Israeliten selbst ausgesprochene Begründung ihrer Flucht ein.
- source_word: פֶּן
  choice: Sonst
  rationale: פֶּן leitet eine befürchtete Folge ein. »Sonst« ist im heutigen gesprochenen Ausruf natürlich und bewahrt die Dringlichkeit besser als das gehobene »damit nicht«.
- source_word: תִּבְלָעֵ/נוּ
  choice: verschlingt ... auch uns
  rationale: בלע greift das Bild der Erde auf, die Menschen verschlingt. Das im Deutschen idiomatische »auch« verdeutlicht die im Suffix liegende Einbeziehung der Sprechenden nach dem zuvor geschilderten Gericht, ohne den Sinn zu verändern.
- source_word: הָ/אָרֶץ
  choice: die Erde
  rationale: »Erde« wahrt die Verbindung zu Vers 32 und dessen personifiziertem Bild, dass die Erde ihren Mund öffnet.
