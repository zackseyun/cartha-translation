base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: de
  text: 'Da wurde Mose sehr zornig und sagte zu Jahwe: »Wende dich ihrer Opfergabe nicht zu.[a] Keinen einzigen Esel habe ich von ihnen genommen, und keinem von ihnen habe ich etwas Böses angetan.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Beachte ihre Opfergabe nicht« beziehungsweise »Nimm ihre Opfergabe nicht an«. Wörtlich: »Wende dich ihrer Opfergabe nicht zu.«'
    reason: Lexikalische Bedeutungsbreite der Wendung פנה אל im Gebets- und Opferzusammenhang.
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: Da wurde Mose sehr zornig
  rationale: Die hebräische Wendung bezeichnet das heftige Aufkommen von Zorn; die deutsche Formulierung gibt sowohl den Vorgang als auch die durch מְאֹד ausgedrückte Intensität natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Wende dich ihrer Opfergabe nicht zu
  rationale: Die Formulierung bewahrt das hebräische Bild von פנה אל. Im Gebetszusammenhang kann es zugleich bedeuten, einer Gabe Beachtung oder Annahme zu schenken; diese Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
- source_word: מִנְחָתָם
  choice: ihrer Opfergabe
  rationale: מִנְחָה kann Gabe, Tribut oder Opfergabe bedeuten. »Opfergabe« passt zum kultischen Zusammenhang, ohne die Gabe unnötig als Speiseopfer festzulegen.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: Ich habe ihnen nicht einen einzigen Esel weggenommen
  rationale: נשא bezeichnet hier das Nehmen oder Aneignen. »Weggenommen« macht Moses' Verneinung materieller Ausbeutung klar und erhält das konkrete Bild.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: und keinem von ihnen etwas Böses angetan
  rationale: Der Hifil von רעע bezeichnet das Zufügen von Bösem oder Schaden. Die gewählte Wendung ist idiomatisches Deutsch und lässt sowohl Unrecht als auch konkrete Schädigung anklingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn von אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Wende dich ihrer Opfergabe nicht zu
  alternative: Sieh ihre Opfergabe nicht gnädig an / Nimm ihre Opfergabe nicht an
  rationale: Der Haupttext erhält die Bildsprache des Hebräischen und legt nicht abschließend fest, ob vor allem Beachtung, Wohlgefallen oder Annahme gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung »ihnen nicht einen einzigen Esel« setzt den im Hebräischen hervorgehobenen Umfang der Verneinung klar um; die direkte Rede bleibt knapp und eindringlich.
