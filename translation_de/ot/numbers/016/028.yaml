reference: Numbers 16:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: de
  text: 'Und Mose sagte: „Daran werdet ihr erkennen, dass Jahwe mich gesandt hat, all diese Taten[a] zu vollbringen; denn es kam nicht aus meinem eigenen Herzen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all diese Werke“ oder „all diese Handlungen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nicht aus meinem Herzen“; gemeint ist: nicht aus eigenem Antrieb oder in eigener Vollmacht.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Und Mose sagte
  rationale: Die gewöhnliche deutsche Erzählform gibt das einleitende Wayyiqtol natürlich wieder, ohne eine stärkere zeitliche oder folgernde Beziehung einzutragen.
- source_word: בְּזֹאת
  choice: Daran
  rationale: Die Formulierung verweist auf das unmittelbar bevorstehende Geschehen als erkennbares Zeichen und ist im modernen Deutsch natürlicher als das wörtlichere „hierdurch“.
- source_word: תֵּדְעוּן
  choice: werdet ihr erkennen
  rationale: Das Imperfekt der 2. Person Plural hat hier Zukunftssinn; „erkennen“ bringt den durch ein Zeichen gewonnenen Nachweis treffend zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שְׁלָחַנִי
  choice: mich gesandt hat
  rationale: Das deutsche Perfekt bezeichnet die bereits erfolgte Sendung mit ihrer fortdauernden Bedeutung für die gegenwärtige Auseinandersetzung.
- source_word: לַעֲשׂוֹת
  choice: zu vollbringen
  rationale: „Vollbringen“ gibt das Ausführen der bezeichneten Handlungen in würdigem, natürlichem Deutsch wieder, ohne den Inhalt näher festzulegen.
- source_word: אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: all diese Taten
  rationale: מַעֲשִׂים bezeichnet hier Handlungen oder Werke; „Taten“ ist konkret und zugleich kontextuell offen.
- source_word: כִּי לֹא מִלִּבִּי
  choice: denn es kam nicht aus meinem eigenen Herzen
  rationale: Die Wiedergabe erhält sowohl die begründende Funktion von כִּי als auch das hebräische Bild vom Herzen. Eine Fußnote erläutert dessen idiomatischen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Umschrift bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Ursprung und Autorität von Moses Handeln
  choice: nicht aus meinem eigenen Herzen
  alternative: nicht aus eigenem Antrieb
  rationale: Die bildhafte Ausdrucksweise des Hebräischen bleibt im Haupttext sichtbar. Die Fußnote erläutert, dass Mose damit selbstbestimmte Initiative beziehungsweise eigene Autorität verneint, ohne die Aussage konfessionell weiter auszudeuten.
- issue: Funktion des zweiten כִּי
  choice: denn
  alternative: und dass
  rationale: כִּי kann hier die vorangehende Behauptung begründen; „denn“ bewahrt diesen naheliegenden Zusammenhang. Die alternative Auffassung als zweiter Inhaltssatz ist grammatisch möglich und wird nicht zu einer eigenständigen theologischen Aussage ausgebaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Daran werdet ihr erkennen“ ist allgemein verständlich und gibt die Beweisfunktion des angekündigten Geschehens wieder. Die ungewöhnliche Herzformulierung bleibt wegen ihres theologischen und anthropologischen Bildgehalts erhalten und wird in der Fußnote erklärt.
