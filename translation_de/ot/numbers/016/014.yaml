  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: de
  text: Du hast uns ja nicht in ein Land gebracht, in dem Milch und Honig fließen, und uns auch keinen Erbbesitz an Feldern und Weinbergen gegeben. Willst du diesen Männern etwa die Augen ausstechen?[a] Wir kommen nicht hinauf!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Augen ausstechen«. Die drastische Wendung kann auch bildlich verstanden werden, etwa im Sinn von: »Willst du diese Männer täuschen oder sie für blind halten?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: ja nicht … auch keinen
  rationale: אַף verstärkt und erweitert hier den Vorwurf. Die Verbindung aus „ja nicht“ und „auch keinen“ gibt den emphatischen, fortführenden Sinn im natürlichen Deutschen wieder.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: in ein Land, in dem Milch und Honig fließen
  rationale: Die geläufige deutsche Wiedergabe bewahrt das hebräische Bild für die Fruchtbarkeit und Fülle des Landes.
- source_word: הֲבִיאֹתָנוּ
  choice: du hast uns … nicht … gebracht
  rationale: Die Form steht im Zusammenhang einer anklagenden rhetorischen Aussage. Eine deutsche Aussagesatzkonstruktion vermittelt den Vorwurf klar.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: und uns auch keinen Erbbesitz an Feldern und Weinbergen gegeben
  rationale: נַחֲלָה bezeichnet einen zugeteilten beziehungsweise ererbten Besitz. Die deutschen Plurale geben den kollektiven Sinn der hebräischen Singularformen natürlich wieder.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: Willst du diesen Männern etwa die Augen ausstechen?
  rationale: נקר im Piel bezeichnet konkret das Ausstechen der Augen. Das drastische Bild bleibt im Haupttext erhalten; „etwa“ trägt den empörten rhetorischen Ton.
- source_word: לֹא נַעֲלֶה
  choice: Wir kommen nicht hinauf!
  rationale: עלה bedeutet wörtlich „hinaufgehen“. Da die Sprecher einer Aufforderung zu Mose nicht folgen wollen, ist „hinaufkommen“ aus der Perspektive des Einladenden passend.
theological_decisions:
- issue: Konkrete oder bildliche Bedeutung des Ausstechens der Augen
  choice: Das konkrete Bild „die Augen ausstechen“ bleibt im Haupttext stehen.
  alternative: „Willst du diese Männer blind machen?“ oder eine rein übertragene Wiedergabe im Sinn von Täuschung.
  rationale: Der hebräische Wortlaut ist bewusst drastisch und kann sowohl eine konkrete Gewaltdrohung als auch den Vorwurf umfassen, die Männer für blind beziehungsweise leicht täuschbar zu halten. Die Übersetzung sollte diese Spannung nicht einseitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem, empörtem Redeton. Das drastische hebräische Bild wird bewahrt; die mögliche übertragene Bedeutung wird in der Fußnote erläutert.
