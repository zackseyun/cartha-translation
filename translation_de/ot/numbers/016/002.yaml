  source_fidelity: 'Die Grundstruktur und die wesentlichen Bedeutungen werden zutreffend wiedergegeben: Das Aufstehen „vor Mose“ bleibt ohne vorwegnehmende Deutung als offene Rebellion, die 250 Männer werden als Israel zugehörig bezeichnet, und die drei nachfolgenden Ehrenbezeichnungen bleiben appositiv. „Berufenen der Versammlung“ ist jedoch im Deutschen semantisch und syntaktisch missverständlich; es kann eher Personen bezeichnen, die andere berufen, statt Personen, die selbst berufen wurden. Die Präpositionalfügung macht die passive Bedeutung von קְרִאֵי מוֹעֵד klar.'
