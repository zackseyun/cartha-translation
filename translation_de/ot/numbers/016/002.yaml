  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: de
  text: 'Sie erhoben sich vor Mose, zusammen mit 250 Männern aus Israel: Vorstehern der Gemeinde, zur Versammlung Berufenen[a], angesehenen Männern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu der Zusammenkunft Einberufenen“. Die hebräische Wendung kann Männer bezeichnen, die offiziell zu einer angesetzten Versammlung gerufen wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Sie erhoben sich
  rationale: Das narrative Qal von קום bezeichnet das Aufstehen beziehungsweise aktive Auftreten; „erhoben sich“ bewahrt die mögliche konfrontative Färbung, ohne sie ausdrücklich in das Verb hineinzulesen.
- source_word: לִפְנֵי
  choice: vor Mose
  rationale: Die räumlich-relationale Bedeutung „vor/in Gegenwart von“ bleibt erhalten; der Zusammenhang kann eine Konfrontation erkennen lassen, ohne dass mit „gegen“ überübersetzt wird.
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל
  choice: zusammen mit 250 Männern von den Israeliten
  rationale: Die elliptische Koordination wird im Deutschen natürlich ergänzt. „Männer von den Israeliten“ gibt sowohl אֲנָשִׁים als auch die Herkunftsangabe wieder, ohne das im Deutschen missverständliche „Söhne Israels“ zu verwenden.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: '250'
  rationale: Übliche und leicht erfassbare moderne deutsche Zahlenschreibung.
- source_word: נְשִׂיאֵי עֵדָה
  choice: Vorstehern der Gemeinde
  rationale: נָשִׂיא bezeichnet hier führende Repräsentanten; „Vorsteher“ ist würdig und institutionell passend, während „Gemeinde“ die versammelte Gemeinschaft bezeichnet.
- source_word: קְרִאֵי מוֹעֵד
  choice: Berufenen der Versammlung
  rationale: Die passive Bezeichnung wird eng am Hebräischen wiedergegeben. Sie kann offiziell einberufene oder zur Zusammenkunft berufene Männer meinen; diese Offenheit wird in der Fußnote erläutert.
- source_word: אַנְשֵׁי שֵׁם
  choice: angesehenen Männern
  rationale: Die Wendung „Männer des Namens“ bezeichnet Personen von Ruf und Ansehen. „Angesehene Männer“ ist im modernen Deutschen natürlich und bewahrt die soziale Auszeichnung.
theological_decisions:
- issue: Konfrontative Bedeutung von קום und לִפְנֵי
  choice: „Sie erhoben sich vor Mose“
  alternative: „Sie lehnten sich gegen Mose auf“
  rationale: Die stärkere Formulierung würde die aus dem Kontext erkennbare Auflehnung bereits ausdrücklich in die lexikalische Bedeutung eintragen. Die Übersetzung lässt die Spannung bestehen und überlässt dem Erzählzusammenhang die Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionale Reihe des Hebräischen bleibt erkennbar, wird aber durch Doppelpunkt und deutsche Kasusformen lesbar gegliedert. Der Vers setzt syntaktisch die im vorherigen Vers genannten Männer als Subjekt voraus.
