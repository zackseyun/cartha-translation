  terminology: „Mose“, „Vorsteher der Gemeinde“ und „angesehene Männer“ sind angemessen. „Versammlung“ ist für מוֹעֵד in diesem institutionellen Kontext tragfähig; die Fußnote wahrt die Möglichkeit von „Zusammenkunft“ und einer offiziell angesetzten Versammlung.
