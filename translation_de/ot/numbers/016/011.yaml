  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: de
  text: Darum habt ihr euch gegen Jahwe[b] versammelt, du und deine ganze Gemeinschaft[a]. Und Aaron – was ist er schon[c], dass ihr gegen ihn murrt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine ganze Versammlung« beziehungsweise »deine ganze Gemeinde«.'
    reason: lexical_alternative
  - marker: b
    text: »Jahwe« gibt den Gottesnamen JHWH wieder.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Und wer ist Aaron schon?« Gemeint ist: Der Aufruhr richtet sich letztlich gegen Jahwe und nicht nur gegen Aaron.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem unmittelbar zuvor Gesagten und klingt im modernen Deutschen natürlich.
- source_word: עֲדָתְךָ
  choice: deine ganze Gemeinschaft
  rationale: Bezeichnet hier Korachs geschlossene Gruppe. »Gemeinschaft« wahrt den kollektiven Sinn, ohne einen ausschließlich kultischen oder kirchlichen Beiklang aufzudrängen.
- source_word: הַנֹּעָדִים
  choice: habt ihr euch … versammelt
  rationale: Das Nifal-Partizip bezeichnet das Zusammenkommen der angesprochenen Gruppe; die finite Form ergibt im Deutschen einen klaren, natürlichen Satz.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang mit Aufruhr und Murren hat die Präposition adversative Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen JHWH als Eigennamen wieder.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: Und Aaron – was ist er schon
  rationale: Bewahrt die wörtliche Frage nach Aarons Bedeutung und ihre rhetorische Herabsetzung, formuliert sie aber idiomatisch auf Deutsch.
- source_word: תלונו
  choice: ihr … murrt
  rationale: Das Verb לון ist in den Wüstenerzählungen ein Leitwort für anklagendes, aufbegehrendes Klagen; »murren« erhält diesen negativen Ton.
- source_word: עָלָיו
  choice: gegen ihn
  rationale: Gibt die gegen Aaron gerichtete Beschwerde mit der adversativen Bedeutung passend wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen JHWH. Seine Wiedergabe als »Jahwe« macht sichtbar, dass hier ein Eigenname steht.
- issue: Eigentliches Ziel des Aufruhrs
  choice: Die Gruppe hat sich gegen Jahwe versammelt; Aaron wird anschließend rhetorisch als bloßer menschlicher Anlass des Murrens relativiert.
  alternative: Jahwe und Aaron werden als gleichrangige Ziele des Aufruhrs verstanden.
  rationale: 'Die hebräische Satzfolge nennt zunächst das Sichversammeln gegen Jahwe und fragt danach: »Aaron – was ist er?« So bleibt die Spannung zwischen dem sichtbaren Angriff auf Aaron und dem letztlich gegen Gott gerichteten Aufruhr erhalten.'
- issue: Rhetorische Form von מַה הוּא
  choice: was ist er schon
  alternative: wer ist er schon
  rationale: »Was« entspricht dem hebräischen מַה und betont Aarons geringe eigene Bedeutung; »schon« macht die rhetorische Kraft im Deutschen hörbar, ohne den Sinn festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede wird durch »du und deine ganze Gemeinschaft« bewahrt; »ihr« nimmt die zusammengesetzte Gruppe idiomatisch wieder auf. Der Gedankenstrich trägt die scharfe rhetorische Wendung des hebräischen Satzes.
