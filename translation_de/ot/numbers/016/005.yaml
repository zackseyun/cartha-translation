base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: de
  text: 'Er sprach zu Korach und zu seiner ganzen Gemeinschaft: »Am Morgen wird Jahwe erkennen lassen[a], wer ihm gehört und wer heilig ist, und er wird ihn in seine Nähe bringen. Wen er erwählt, den wird er in seine Nähe bringen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Jahwe wird erkennen, wer ihm gehört«; das hebräische Verb bedeutet grundsätzlich »kennen/erkennen«, kann hier aber das öffentliche Erkennenlassen oder Erweisen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »In seine Nähe bringen« ist priesterlich-kultische Sprache und meint den von Jahwe gewährten Zugang zu seiner Gegenwart zum heiligen Dienst.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach er
  rationale: דבר bezeichnet hier das an Korach und seine Gemeinschaft gerichtete Sprechen. »Sprach« bewahrt den erzählerischen Ton und unterscheidet das Verb von לֵאמֹר, das die direkte Rede einleitet.
- source_word: עֲדָתוֹ
  choice: seiner ganzen Gemeinschaft
  rationale: עֵדָה bezeichnet eine versammelte Gruppe oder Gemeinschaft. »Gemeinschaft« ist im heutigen Deutsch verständlich und gibt Korachs Gefolgschaft wieder; »ganzen« bildet כָּל ab.
- source_word: בֹּקֶר
  choice: Am Morgen
  rationale: Das allein stehende Substantiv wird adverbial gebraucht und bezeichnet den Zeitpunkt der bevorstehenden Offenbarung.
- source_word: וְיֹדַע יְהוָה
  choice: wird Jahwe erkennen lassen
  rationale: ידע bedeutet formal »kennen/erkennen«, bezeichnet im Zusammenhang aber wahrscheinlich das öffentliche Erweisen oder Offenbarwerden der von Jahwe anerkannten Person. »Erkennen lassen« bewahrt die Verbindung zum Grundverb, ohne die resultative Aussage zu verdecken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: wer ihm gehört
  rationale: Die Formulierung gibt die knappe Zugehörigkeitsaussage »wer sein ist« in natürlichem Deutsch wieder, ohne ihre mögliche bundesbezogene Tragweite näher festzulegen.
- source_word: וְאֶת הַקָּדוֹשׁ
  choice: und wer heilig ist
  rationale: Das substantivierte Adjektiv bezeichnet die für den heiligen Dienst ausgesonderte Person. Die prädikative deutsche Form wahrt die Parallelität zu »wer ihm gehört«.
- source_word: וְהִקְרִיב אֵלָיו
  choice: und er wird ihn zu sich nahen lassen
  rationale: Der Hifil von קרב bezeichnet das Heranbringen beziehungsweise die Gewährung des Zugangs, besonders im priesterlich-kultischen Zusammenhang. »Nahen lassen« erhält diese Fachsprache besser als ein allgemeines »heranführen«.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: Wen er erwählt
  rationale: בחר bezeichnet das Auswählen oder Erwählen. Die knappe Relativkonstruktion entspricht dem Hebräischen und bleibt würdig und natürlich.
- source_word: יַקְרִיב אֵלָיו
  choice: den wird er zu sich nahen lassen
  rationale: Die Wiederholung von קרב wird bewusst erhalten, weil sie den Gedanken des von Jahwe gewährten heiligen Zugangs hervorhebt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Umschrift »Jahwe« bewahrt ihn als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ידע in וְיֹדַע יְהוָה
  choice: Jahwe wird erkennen lassen
  alternative: Jahwe wird erkennen
  rationale: Die Aussage kann formal besagen, dass Jahwe erkennt, wer ihm gehört; im Zusammenhang der angekündigten Prüfung liegt zugleich das öffentliche Bekanntmachen nahe. Der Haupttext gibt diese kontextuelle Funktion wieder, während die Fußnote die wörtlichere Möglichkeit bewahrt.
- issue: Priesterlicher Zugang in הקריב אליו
  choice: zu sich nahen lassen
  alternative: zu sich bringen
  rationale: Die Formulierung lässt den kultischen Sinn des autorisierten Zutritts zu Jahwes Gegenwart erkennen, ohne bereits ausdrücklich ein bestimmtes Amt in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die hebräische Wiederholung von »nahen lassen« bleibt als rhetorisch und theologisch bedeutsames Element erhalten; unnötige konfessionelle Präzisierungen werden vermieden.
