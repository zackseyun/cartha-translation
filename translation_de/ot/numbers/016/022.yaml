base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: de
  text: 'Da fielen sie auf ihr Angesicht nieder und sagten: „Gott, du Gott der Geister allen Fleisches[a], wenn ein einziger Mann[b] sündigt, willst du über die ganze Gemeinde zornig werden?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du Gott des Lebensatems allen Fleisches“. Die Wendung kann Gott als den Geber des Lebens für alle Lebewesen hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: '„Ein einziger Mann“ kann hier stellvertretend für einen Einzelnen stehen: Die Bitte lautet, dass die Sünde eines Einzelnen nicht Zorn über die ganze Gemeinde bringen möge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: Da fielen sie auf ihr Angesicht
  rationale: Bewahrt das konkrete hebräische Bild einer demütigen, erschrockenen oder fürbittenden Niederwerfung; der Singular „Angesicht“ entspricht einer würdigen deutschen Bibelwendung.
- source_word: אֵל אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Gott, du Gott der Geister allen Fleisches
  rationale: Gibt die Anrede und Genitivverbindung eng wieder. „Geister“ bezeichnet hier am ehesten das innere Leben der einzelnen Menschen unter Gottes Kenntnis und Herrschaft; die mögliche Bedeutung „Lebensatem“ bleibt in der Fußnote erhalten.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: Erhält die umfassende hebräische Wendung „alles Fleisch“, statt sie auf „alle Menschen“ zu verengen.
- source_word: הָאִישׁ אֶחָד
  choice: ein einziger Mann
  rationale: Gibt das maskuline Singularwort אִישׁ und die hervorhebende Zahl אֶחָד genau wieder; die mögliche repräsentative Funktion wird in der Fußnote erläutert.
- source_word: יֶחֱטָא
  choice: soll ... sündigen
  rationale: Der deutsche Fragesatz mit „soll“ bewahrt den vorwurfsvoll-fürbittenden Charakter, ohne die verbale Aussage übermäßig festzulegen.
- source_word: וְעַל כָּל־הָעֵדָה תִּקְצֹף
  choice: und du über die ganze Gemeinde zornig werden?
  rationale: „Über jemanden zornig werden“ ist eine natürliche deutsche Verbindung für קצף mit עַל; „Gemeinde“ passt zum versammelten Volk Israel.
theological_decisions:
- issue: Anthropologische Bedeutung von אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Titel Gottes als des Gottes der Geister aller Menschen bzw. allen Fleisches
  alternative: Gott als Geber des Lebensatems aller Lebewesen
  rationale: Im Zusammenhang appellieren Mose und Aaron daran, dass Gott individuelle Schuld von der gesamten Gemeinde unterscheiden kann. Dennoch lässt רוּחֹת auch die Deutung als Lebensatem zu; diese Spannung wird nicht aufgelöst, sondern in der Fußnote ausgewiesen.
- issue: Reichweite von הָאִישׁ אֶחָד
  choice: ein einziger Mann
  alternative: ein einzelner Mensch
  rationale: Die maskuline Form und der Bezug auf einen konkreten männlichen Anführer werden bewahrt. Zugleich kann die Aussage grundsätzlich die Schuld eines Einzelnen gegenüber der Gemeinschaft betreffen; darauf weist die Fußnote hin.
- issue: Verhältnis von individueller Sünde und gemeinschaftlichem Zorn
  choice: Die Frage bleibt als fürbittender Einspruch formuliert
  alternative: Als ausdrückliche Lehraussage über ausschließlich individuelle Vergeltung formulieren
  rationale: Der hebräische Text stellt eine rhetorische Bitte beziehungsweise Frage dar. Die Übersetzung macht daraus keine umfassende dogmatische Festlegung und bewahrt so die Spannung zwischen individueller Verantwortung und gemeinschaftlichen Folgen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. „Auf ihr Angesicht“ und „alles Fleisch“ sind leicht gehobene, aber verständliche Wendungen. Beide Fußnotenmarker stehen im Haupttext; [a] ist unmittelbar an die mehrdeutige Gottesbezeichnung, [b] an die gesamte rhetorische Frage gesetzt.
