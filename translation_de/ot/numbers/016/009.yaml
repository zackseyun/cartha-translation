  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: de
  text: Ist es euch zu wenig[a], dass der Gott Israels euch aus der Gemeinde Israels ausgesondert hat, um euch ihm nahezubringen, damit ihr den Dienst an der Wohnstätte Jahwes verrichtet und vor der Gemeinde steht, um ihr zu dienen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ist es euch eine Kleinigkeit …?“ Die hebräische Wendung ist eine vorwurfsvolle Frage: Gilt euch das bereits gewährte Vorrecht als gering oder nicht ausreichend?'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: Ist es euch etwa zu wenig
  rationale: Die rhetorische Frage wirft den Leviten vor, das ihnen gewährte Vorrecht für unzureichend zu halten. Die deutsche Formulierung gibt den idiomatischen Sinn natürlich wieder.
- source_word: הִבְדִּיל
  choice: ausgesondert hat
  rationale: Der Hifil von בדל bezeichnet das Absondern aus einer größeren Gemeinschaft. „Ausgesondert“ bewahrt hier sowohl den trennenden als auch den zweckbestimmten Sinn.
- source_word: עֲדַת יִשְׂרָאֵל / הָעֵדָה
  choice: Gemeinde Israels / Gemeinde
  rationale: עֵדָה bezeichnet hier die Gemeinschaft beziehungsweise versammelte Gemeinde Israels. „Gemeinde“ ist verständlich und passt zum gemeinschaftlichen wie kultischen Zusammenhang.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: um euch zu sich kommen zu lassen
  rationale: קרב im Hifil bedeutet „nahebringen“. Die Formulierung wahrt die kultische Nähe zu Gott, ohne die Leviten ausdrücklich als Opfergaben zu deuten.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: damit ihr den Dienst an der Wohnung Jahwes verrichtet
  rationale: Verb und stammverwandtes Substantiv betonen die Dienstaufgabe. „Den Dienst … verrichtet“ gibt dies in idiomatischem Deutsch wieder; מִשְׁכָּן wird grundnah als „Wohnung“ übersetzt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: und vor der Gemeinde steht
  rationale: Die Wendung bezeichnet die offizielle Dienststellung der Leviten vor der versammelten Gemeinschaft.
- source_word: לְשָׁרְתָם
  choice: um ihr zu dienen
  rationale: שרת bezeichnet einen geordneten, besonders auch kultischen Dienst. Das Pronomen bezieht sich auf die kollektiv-singularische „Gemeinde“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Art der Annäherung der Leviten an Gott
  choice: euch zu sich kommen zu lassen
  alternative: euch sich als Opfer darbringen zu lassen
  rationale: Das Verb kann in kultischen Zusammenhängen das Darbringen bezeichnen, doch hier sind die Leviten die direkten Objekte. Die gewählte Wiedergabe bewahrt die kultische Nähe, ohne eine nicht ausdrücklich markierte Opferdeutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt erhalten; kultische Begriffe werden verständlich, aber ohne konfessionelle Zusätze wiedergegeben.
