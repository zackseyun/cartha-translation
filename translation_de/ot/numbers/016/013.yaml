  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: de
  text: Ist es etwa zu wenig, dass du uns aus einem Land heraufgeführt hast, in dem Milch und Honig fließen,[a] um uns in der Wüste zu töten, dass du dich auch noch zum Herrscher über uns aufspielst?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Sprecher bezeichnen Ägypten spöttisch als ein Land, „in dem Milch und Honig fließen“ – mit einer Wendung, die sonst für das verheißene Land gebraucht wird.
    reason: cultural_note
  - marker: b
    text: 'Oder: „dass du auch noch über uns herrschst“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Ist es euch etwa zu wenig
  rationale: Die rhetorische Frage drückt empörten Vorwurf aus. „Etwa“ macht diese Funktion im heutigen Deutsch natürlich hörbar; „euch“ bezieht die angesprochenen Mose und Aaron aus dem Kontext ein, während der folgende Singular Mose gilt.
- source_word: הֶעֱלִיתָנוּ
  choice: du uns … heraufgeführt hast
  rationale: Der Hifil von עלה bezeichnet ein Hinaufführen. Die Wiedergabe erhält die für den Exodus typische Bewegungsrichtung und zugleich die Ironie der Anklage.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: aus einem Land …, in dem Milch und Honig fließen
  rationale: Die feste Fülleformel wird unverändert bewahrt. Dass die Sprecher sie hier auf Ägypten anwenden, erzeugt die beabsichtigte Ironie.
- source_word: לַהֲמִיתֵנוּ
  choice: um uns … zu töten
  rationale: Der Zweckinfinitiv wird direkt und kräftig wiedergegeben.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist im modernen deutschen Bibelregister die geläufige, kontextgerechte Wiedergabe von מִדְבָּר.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: Willst du dich … zum Herrscher über uns aufspielen?
  rationale: Das Verb bezeichnet herrscherliches Auftreten; die Verbindung von finitem Verb und Infinitivus absolutus verstärkt den Vorwurf. „Sich zum Herrscher aufspielen“ gibt sowohl die beanspruchte Herrschaft als auch den anklagenden Ton natürlich wieder.
- source_word: גַּם
  choice: nun auch noch
  rationale: Die Wendung kennzeichnet im Deutschen klar die zusätzliche, empört vorgebrachte Beschwerde.
theological_decisions:
- issue: Ironische Bezeichnung Ägyptens als Land, in dem Milch und Honig fließen
  choice: Die Fülleformel bleibt im Haupttext wörtlich erhalten.
  alternative: Die Ironie durch einen Zusatz wie „angeblich“ ausdrücklich markieren.
  rationale: Der hebräische Text lässt die Ironie aus dem Zusammenhang entstehen. Eine ausdrückliche Kennzeichnung würde die Interpretation in den Haupttext eintragen und die Spannung abschwächen.
- issue: Vorwurf angemaßter Herrschaft gegen Mose
  choice: „dich zum Herrscher über uns aufspielen“
  alternative: „über uns herrschen“ oder „dich als Herrscher über uns einsetzen“
  rationale: Die gewählte Form wahrt den polemischen Vorwurf der Sprecher, ohne zu entscheiden, ob ihre Anschuldigung sachlich berechtigt ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Anklage und die Ironie bleiben deutlich, ohne durch erklärende Zusätze im Haupttext aufgelöst zu werden.
