  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: de
  text: Jeder von euch soll seine Räucherpfanne[a] nehmen, Räucherwerk darauflegen und seine Räucherpfanne vor Jahwe[b] bringen – zweihundertfünfzig Räucherpfannen; auch du und Aaron, jeder mit seiner Räucherpfanne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Feuerpfanne; gemeint ist ein Gefäß zum Darbringen von Räucherwerk.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּקְחוּ אִישׁ
  choice: Jeder von euch soll … nehmen
  rationale: Der pluralische Imperativ richtet sich an die ganze Gruppe, während אִישׁ die Anweisung auf jeden Einzelnen verteilt. Die deutsche Soll-Konstruktion gibt beides natürlich wieder.
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: seine Räucherpfanne / Räucherpfannen
  rationale: Das Wort bezeichnet hier ein Gefäß für glühende Kohlen und Räucherwerk. „Räucherpfanne“ ist im kultischen Zusammenhang verständlich und weniger missverständlich als das allgemeinere „Feuerbecken“.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: Räucherwerk darauflegen
  rationale: „Darauf“ wahrt die Präposition עַל und lässt erkennen, dass das Räucherwerk auf die in den Pfannen befindlichen Kohlen gelegt wird.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: sie vor Jahwe bringen
  rationale: Das Hifil von קרב bezeichnet im kultischen Zusammenhang das Heranbringen beziehungsweise Darbringen. „Vor Jahwe bringen“ ist natürlich und bewahrt die räumlich-kultische Wendung.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: zweihundertfünfzig Räucherpfannen
  rationale: Die ausgeschriebene Zahl entspricht dem erzählerischen Register und bezeichnet die Gesamtzahl der Pfannen der Gruppe.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: und auch du und Aaron, jeder seine Räucherpfanne
  rationale: Die knappe, verblose Ergänzung des Hebräischen wird bewahrt; „jeder“ gibt die distributive Bedeutung von אִישׁ wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die distributive Struktur („jeder“) und die knappe Schlusswendung des Hebräischen bleiben erhalten; der Gedankenstrich kennzeichnet die erläuternde Gesamtzahl.
