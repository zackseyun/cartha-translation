  text: וְ/אֵ֥שׁ יָצְאָ֖ה מֵ/אֵ֣ת יְהוָ֑ה וַ/תֹּ֗אכַל אֵ֣ת הַ/חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ מַקְרִיבֵ֖י הַ/קְּטֹֽרֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: de
  text: Und Feuer ging von Jahwe aus und verzehrte die zweihundertfünfzig Männer, die das Räucherwerk darbrachten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher an der hebräischen Wendung: »ging von Jahwe her aus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: Und Feuer
  rationale: אֵשׁ bedeutet »Feuer«. Ohne unbestimmten Artikel klingt die Wendung im Deutschen natürlich und gewichtig; וְ wahrt als »Und« die Erzählfolge.
- source_word: יָצְאָה מֵ/אֵת יְהוָה
  choice: ging von Jahwe aus
  rationale: יצא bezeichnet das Heraus- oder Ausgehen; מֵאֵת kennzeichnet hier den Ursprung bei Jahwe. »ging von Jahwe aus« ist idiomatisch und bildet die Herkunft des Feuers klar ab.
- source_word: וַ/תֹּאכַל
  choice: und verzehrte
  rationale: אכל bedeutet wörtlich »essen«, bezeichnet bei Feuer aber idiomatisch das Verzehren. »verzehrte« ist im Deutschen klar, würdig und nicht unnötig archaisch.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: die zweihundertfünfzig Männer
  rationale: Die hebräische Zahlverbindung mit אִישׁ bezeichnet eine bestimmte Gruppe von 250 Männern. Die ausgeschriebene Zusammenschreibung entspricht modernem Standarddeutsch.
- source_word: מַקְרִיבֵי הַ/קְּטֹרֶת
  choice: die das Räucherwerk darbrachten
  rationale: Das Partizip von קרב beschreibt die Männer durch ihre kultische Handlung. קְטֹרֶת ist hier das konkrete Räucherwerk der Begebenheit; »darbrachten« gibt den kultischen Zusammenhang präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den offenbarten Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, während »verzehrte« und der Relativsatz idiomatisch verständlich sind.
