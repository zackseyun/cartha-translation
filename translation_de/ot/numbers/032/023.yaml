  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: de
  text: 'Doch wenn ihr nicht so handelt, seht: Ihr habt gegen Jahwe gesündigt. Und wisst: Eure Sünde wird euch finden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eure Schuld wird euch einholen.“ Das hebräische Bild bezeichnet, dass die Sünde den Schuldigen unausweichlich erreichen wird, und kann dabei sowohl ihre Aufdeckung als auch ihre Folgen einschließen.'
    reason: lexikalische Alternative und Erläuterung des hebräischen Bildes
lexical_decisions:
- source_word: וְאִם לֹא תַעֲשׂוּן כֵּן
  choice: Doch wenn ihr nicht so handelt
  rationale: Die Formulierung gibt den bedingten Gegensatz zum vorausgehenden Auftrag natürlich wieder; „so handelt“ verweist klar auf das zuvor Geforderte.
- source_word: הִנֵּה חֲטָאתֶם לַיהוָה
  choice: dann habt ihr gegen Jahwe gesündigt
  rationale: „Dann“ macht die im Warnzusammenhang bezeichnete Folge deutlich. חטא mit ל bezeichnet hier den, gegen den sich die Sünde richtet; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וּדְעוּ
  choice: Und wisst
  rationale: Der direkte Imperativ im Plural bleibt erhalten und unterstreicht die Gewissheit der angekündigten Folge.
- source_word: חַטַּאתְכֶם
  choice: Eure Sünde
  rationale: Das Substantiv kann Sünde oder Schuld bezeichnen. „Sünde“ bewahrt hier die unmittelbare Verbindung zum vorangehenden Verb „gesündigt“.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: wird euch finden
  rationale: Die personifizierende, eindringliche Bildsprache des Hebräischen bleibt erhalten, ohne die Aussage ausschließlich als Entlarvung oder als Bestrafung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Bundesnamen יהוה. „Jahwe“ gibt diesen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Aussage, dass die Sünde den Schuldigen „finden“ wird
  choice: Die bildhafte Formulierung bleibt offen
  alternative: Eure Schuld wird euch einholen
  rationale: Der Vers kann unvermeidliche Aufdeckung, Schuldfolge oder beides ausdrücken. Die wörtlich nachvollziehbare Personifikation bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Imperativ „Und wisst“ erhält den feierlichen Ernst der Warnung; die ungewöhnliche, aber verständliche Wendung „Eure Sünde wird euch finden“ bewahrt die eindringliche Personifikation des Ausgangstextes.
