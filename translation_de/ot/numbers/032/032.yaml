  source_fidelity: Die Übersetzung gibt die Betonung von נַחְנוּ („Wir selbst“), die künftige Zusage des Hinüberziehens, die militärische Bereitschaft von חֲלוּצִים sowie „vor Jahwe“ zutreffend wieder. Die Ortsangabe מֵעֵבֶר לַיַּרְדֵּן ist perspektivabhängig; „diesseits des Jordan“ ist im erzählerischen Kontext der östlich des Jordan stehenden Sprecher vertretbar und wird angemessen mit einer Alternative erläutert.
  naturalness: „Unser Besitz als Erbteil aber wird bei uns diesseits des Jordan sein“ ist im modernen Deutsch syntaktisch schwerfällig und klingt nicht idiomatisch. „… wird uns diesseits des Jordan gehören“ drückt den hebräischen Besitz-/Zugehörigkeitsgedanken natürlich aus.
  terminology: „Jahwe“, „Land Kanaan“, „bewaffnet“ und „Erbbesitz“ sind sachgerecht und im würdevollen modernen Standarddeutsch angemessen. Das nicht im Hebräischen ausdrücklich markierte kontrastierende „aber“ sollte nicht ergänzt werden.
