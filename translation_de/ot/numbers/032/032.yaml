  variant: modern standard German
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: de
  text: Wir selbst werden bewaffnet vor Jahwe in das Land Kanaan hinüberziehen; unser Erbbesitz wird uns diesseits des Jordan[a] gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jenseits des Jordan“ beziehungsweise „auf der anderen Seite des Jordan“. Der hebräische Ausdruck hängt von der jeweiligen Blickrichtung ab; „diesseits“ folgt hier der Position der Sprecher östlich des Flusses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: Wir selbst
  rationale: Das selbstständige Personalpronomen hebt die Sprecher zusätzlich zur bereits in der Verbform enthaltenen Person hervor.
- source_word: נַעֲבֹר
  choice: werden … hinüberziehen
  rationale: Das Qal-Imperfekt bezeichnet hier die zugesagte künftige Überquerung des Jordan; „hinüberziehen“ passt zugleich zum gemeinschaftlichen militärischen Aufbruch.
- source_word: חֲלוּצִים
  choice: bewaffnet
  rationale: Das Wort bezeichnet in diesem Zusammenhang zum Kampf ausgerüstete Männer; „bewaffnet“ gibt dies knapp und verständlich wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet räumlich beziehungsweise relational „vor“; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֶרֶץ כְּנָעַן
  choice: in das Land Kanaan
  rationale: Obwohl im Hebräischen vor „Land Kanaan“ keine Präposition steht, verlangt die deutsche Zielangabe nach dem Bewegungsverb natürlich „in“.
- source_word: וְאִתָּנוּ
  choice: aber wird bei uns … sein
  rationale: Der hebräische Nominalsatz enthält kein ausgesprochenes Verb. Das ergänzte Futur entspricht dem zukunftsbezogenen Versprechen; „aber“ macht den sachlichen Gegensatz zwischen dem Zug nach Kanaan und dem verbleibenden Erbteil deutlich.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: unser Besitz als Erbteil
  rationale: 'Die Wiedergabe bewahrt beide Aspekte der Konstruktverbindung: den festen Besitz und die als Erbe zugeteilte Habe.'
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: diesseits des Jordan
  rationale: Der Ausdruck ist perspektivabhängig. Aus der östlich des Jordan gelegenen Sprecherposition bezeichnet er hier die Seite, auf der ihr Erbteil liegen soll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ wahrt den offenbarten Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לִפְנֵי יְהוָה im Kriegszug
  choice: vor Jahwe
  alternative: in der Gegenwart Jahwes
  rationale: Die knappe Wiedergabe erhält sowohl die räumliche Vorstellung als auch die mögliche bundesbezogene und theologische Tragweite, ohne sie näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgliederung mit Semikolon hält die beiden Zusagen eng zusammen, ohne den hebräischen Nominalsatz unnatürlich nachzuahmen. „Jordan“ steht entsprechend üblichem biblischem Deutsch ohne Genitiv-s.
