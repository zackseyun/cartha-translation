  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: de
  text: und jeder von euch, der für den Kampf gerüstet ist, vor Jahwe über den Jordan zieht, bis er seine Feinde aus seiner Gegenwart vertrieben[a] hat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „enteignet“ beziehungsweise „aus ihrem Besitz verdrängt“. Das hebräische Verb kann sowohl das Vertreiben als auch die Wegnahme des Besitzes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Pronomen in „er seine Feinde aus seiner Gegenwart vertrieben hat“ beziehen sich am ehesten auf Jahwe. Manche beziehen sie jedoch auf Israel als Gesamtheit oder auf dessen Kampftruppe.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: und … zieht
  rationale: Das Qal-Perfekt mit וְ führt im Bedingungsgefüge aus Vers 20 die Voraussetzung fort. Das deutsche Präsens in der abhängigen Bedingung ist natürlich und hat hier Zukunftsbezug.
- source_word: לָכֶם כָּל חָלוּץ
  choice: jeder zum Kampf gerüstete Mann von euch
  rationale: חָלוּץ bezeichnet einen für den Kampf ausgerüsteten Menschen. Die Formulierung bewahrt den verteilenden Sinn von כָּל und gibt לָכֶם idiomatisch als Zugehörigkeit zur angesprochenen Gruppe wieder.
- source_word: אֶת הַיַּרְדֵּן
  choice: über den Jordan
  rationale: Beim Verb des Hinüberziehens verlangt natürliches Deutsch „über den Jordan“; die Bezeichnung „Fluss“ muss nicht ergänzt werden.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet das Handeln vor beziehungsweise in der Gegenwart Gottes. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: עַד
  choice: bis
  rationale: Die Konjunktion markiert schlicht den zeitlichen Endpunkt.
- source_word: הוֹרִישׁוֹ
  choice: er … vertrieben hat
  rationale: Das Hifil von ירשׁ kann hier „vertreiben“ oder „enteignen/verdrängen“ bedeuten. „Vertreiben“ ist klares, gegenwärtiges Deutsch; die lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: אֹיְבָיו מִפָּנָיו
  choice: seine Feinde vor sich
  rationale: Die männlichen Singularsuffixe werden beibehalten, ohne ihren Bezug im Haupttext ausdrücklich festzulegen. „Vor sich“ gibt מִפָּנָיו idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im modernen Standarddeutsch als Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug der männlichen Singularpronomen in הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו
  choice: Im Text bleibt die Pronominalkette erhalten; am ehesten bezieht sie sich auf Jahwe.
  alternative: Die Pronomen beziehen sich auf Israel als Gesamtheit oder auf das gerüstete Heer.
  rationale: Das unmittelbar vorausgehende „vor Jahwe“ und der Sprachgebrauch der Landnahme sprechen dafür, Jahwe als Bezug zu verstehen. Da die andere Deutung grammatisch möglich ist, wird sie nicht aus dem Haupttext entfernt, sondern in der Fußnote genannt.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der Vers bleibt als Fortsetzung des in Vers 20 begonnenen Bedingungssatzes syntaktisch offen. Die Formulierung wahrt die echte Mehrdeutigkeit des hebräischen Pronominalbezugs.
