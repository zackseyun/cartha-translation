base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: de
  text: Da gab Mose Gilead Machir, dem Sohn Manasses, und er ließ sich darin nieder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wohnte darin.'
    reason: Lexikalische Alternative für וַיֵּשֶׁב; das Verb kann sowohl die Niederlassung als auch das anschließende Wohnen bezeichnen.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Das einfache Verb נתן bedeutet hier im Zusammenhang der Landvergabe schlicht „geben“; „zuteilen“ oder „überlassen“ würde eine zusätzliche verwaltungssprachliche Nuance eintragen.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Der etablierte Gebietsname wird im Deutschen ohne Artikel wiedergegeben, obwohl im Hebräischen der Artikel steht.
- source_word: לְמָכִיר
  choice: Machir
  rationale: Die Präposition לְ kennzeichnet hier den Empfänger; der deutsche Dativ nach „geben“ gibt diese Funktion natürlich und genau wieder.
- source_word: בֶּן מְנַשֶּׁה
  choice: dem Sohn Manasses
  rationale: בֶּן bezeichnet in dieser genealogischen Angabe am unmittelbarsten den Sohn; der Genitiv „Manasses“ entspricht gehobenem, aber geläufigem Bibeldeutsch.
- source_word: וַיֵּשֶׁב
  choice: ließ sich nieder
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „sich ansiedeln“ bedeuten. Im Zusammenhang der Inbesitznahme eines Gebietes bringt „sich niederlassen“ den ingressiven bzw. siedlungsbezogenen Sinn natürlich zum Ausdruck.
- source_word: בָּהּ
  choice: darin
  rationale: Das feminine Singularsuffix verweist auf das Gebiet Gilead zurück; „darin“ wahrt diesen ausdrücklichen Rückbezug besser als das ebenfalls mögliche „dort“.
