  yaml_path: translation/ot/numbers/032/034.yaml
  text: The sons of Gad built Dibon[a], Ataroth[b], and Aroer.
translation:
  language: de
  text: Die Gaditer bauten[a] Dibon, Atarot und Aroër.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang auch: »bauten wieder auf« oder »befestigten«. Das hebräische Verb selbst bedeutet schlicht »bauten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: bauten
  rationale: Das Verb בנה bezeichnet hier zunächst schlicht das Bauen. Im Zusammenhang kann auch ein Wiederaufbau oder eine Befestigung gemeint sein, doch diese Nuancen sind im Verb selbst nicht ausdrücklich enthalten.
- source_word: בְנֵי גָד
  choice: die Nachkommen Gads
  rationale: Wörtlich steht »Söhne Gads«. Im Stammeszusammenhang sind die Angehörigen beziehungsweise Nachkommen des Stammes Gad gemeint; »Nachkommen Gads« gibt dies in natürlichem modernem Deutsch wieder.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Hebräischer Akkusativmarker ohne eigenständige deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: דִּיבֹן
  choice: Dibon
  rationale: Ortsname in der im Deutschen üblichen biblischen Form.
- source_word: עֲטָרֹת
  choice: Atarot
  rationale: Ortsname in einer dem Hebräischen entsprechenden deutschen Umschrift.
- source_word: עֲרֹעֵר
  choice: Aroër
  rationale: Ortsname in der im Deutschen üblichen biblischen Form; das Trema zeigt die getrennte Aussprache der Vokale an.
