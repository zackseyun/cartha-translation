source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: de
  text: 'Und seht: ihr seid an die Stelle eurer Väter getreten, eine Brut sündiger Männer[a], um den glühenden Zorn[b] Jahwes gegen Israel noch zu steigern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Vermehrung sündiger Männer« beziehungsweise »Nachkommen sündiger Männer«. Das hebräische Wort kann Vermehrung oder Nachkommenschaft bezeichnen; »Brut« gibt hier den tadelnden Ton wieder.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen ein Ausdruck vom »Brennen der Nase«; dies ist eine bildhafte Wendung für heftigen Zorn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und seht
  rationale: Bewahrt den nachdrücklichen Hinweischarakter der Wendung in natürlichem, gegenwärtigem Deutsch.
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: ihr seid an die Stelle eurer Väter getreten
  rationale: Gibt sowohl das Aufstehen beziehungsweise Auftreten als auch die Nachfolge anstelle der vorigen Generation idiomatisch wieder.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: eine Brut sündiger Männer
  rationale: תַּרְבּוּת kann Vermehrung oder Nachkommenschaft bezeichnen; »Brut« erhält hier den scharfen, vorwurfsvollen Ton. אֲנָשִׁים ist ausdrücklich männlich und bezieht sich auf die angesprochenen Männer.
- source_word: לִסְפּוֹת עוֹד
  choice: noch zu steigern
  rationale: Drückt knapp aus, dass dem bereits bestehenden Zorn weiteres hinzugefügt wird.
- source_word: חֲרוֹן אַף
  choice: glühenden Zorn
  rationale: Bewahrt das Bild des Brennens im hebräischen Ausdruck, ohne die wörtliche Rede von der Nase unverständlich nachzubilden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner etablierten Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל יִשְׂרָאֵל
  choice: gegen Israel
  rationale: Bei einer Zornesangabe bezeichnet אֶל das Ziel, gegen das sich der Zorn richtet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst; deshalb wird er als Name wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Geschlechtsspezifische Formulierung אֲנָשִׁים חַטָּאִים
  choice: sündige Männer
  alternative: sündige Menschen / Sünder
  rationale: Der hebräische Text nennt ausdrücklich Männer; im Zusammenhang werden die männlichen Vertreter der Stämme angesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Und seht« trägt den rhetorischen Nachdruck; »Brut« ist bewusst scharf, da Mose die neue Generation anklagt. Beide Fußnotenmarker stehen im Haupttext.
