  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם לֹ֧א יַֽעַבְר֛וּ חֲלוּצִ֖ים אִתְּ/כֶ֑ם וְ/נֹֽאחֲז֥וּ בְ/תֹכְ/כֶ֖ם בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: de
  text: Wenn sie aber nicht zum Kampf gerüstet mit euch hinüberziehen, sollen sie unter euch im Land Kanaan Besitz erhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollen sie unter euch im Land Kanaan angesiedelt werden.“ Das hebräische Verb kann nicht nur den Empfang von Besitz, sondern auch das feste Ansässigwerden darin bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Wenn … aber
  rationale: Die Verbindung leitet die gegensätzliche Bedingung zum vorherigen Vers ein; die deutsche Nachstellung von „aber“ gibt diesen Kontrast natürlich wieder.
- source_word: יַעַבְרוּ
  choice: hinüberziehen
  rationale: Das Verb bezeichnet hier das Überschreiten des Jordan; „hinüberziehen“ passt zugleich zum geografischen und militärischen Zusammenhang.
- source_word: חֲלוּצִים
  choice: zum Kampf gerüstet
  rationale: Der Ausdruck bezeichnet bewaffnete beziehungsweise für den Kampf ausgerüstete Männer. Die gewählte Formulierung ist präzise und im heutigen Deutsch natürlich.
- source_word: אִתְּכֶם
  choice: mit euch
  rationale: Gibt die im Hebräischen ausgedrückte Begleitung unmittelbar wieder.
- source_word: וְנֹאחֲזוּ
  choice: sollen … Besitz erhalten
  rationale: Der Nifal des Verbs אחז bezeichnet im Zusammenhang der Landverteilung, dass ihnen Besitz zufällt beziehungsweise sie darin ansässig werden. Die Hauptfassung wahrt den passiven Ergebnissinn.
- source_word: בְּתֹכְכֶם
  choice: unter euch
  rationale: Bezeichnet ihre Ansiedlung innerhalb der Gemeinschaft Israels westlich des Jordan.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Bewahrt die vollständige geografische Bezeichnung des hebräischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zum Kampf gerüstet“ verdeutlicht den militärischen Sinn ohne archaische Ausdrucksweise; die Mehrdeutigkeit des Verbs für Besitzempfang beziehungsweise Ansiedlung bleibt durch die Fußnote erhalten.
