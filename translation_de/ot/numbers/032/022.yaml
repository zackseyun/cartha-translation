source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: de
  text: und wenn das Land vor Jahwe[a] unterworfen ist, könnt ihr danach zurückkehren, und ihr werdet gegenüber Jahwe und Israel von jeder Verpflichtung frei sein[b]. Und dieses Land wird vor Jahwe euer Besitz sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Gottesname wird traditionell auch mit »der HERR« wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und ihr werdet vor Jahwe und Israel schuldlos (oder: unschuldig) sein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה
  choice: und … unterworfen ist
  rationale: Das Nifal von כבש bezeichnet, dass das Land unter Kontrolle gebracht worden ist. »Unterworfen« bewahrt den passiven, resultativen Sinn.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet hier »vor« beziehungsweise »in der Gegenwart von«. Die knappe Wiedergabe bewahrt zugleich den Gedanken der Verantwortung vor Gott.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: Danach könnt ihr zurückkehren
  rationale: Die Rückkehr folgt zeitlich auf die Erfüllung der zuvor genannten Bedingung. »Könnt« gibt im Zusammenhang die dann eröffnete Möglichkeit wieder, ohne aus der Verbform allein ein ausdrückliches Gebot zu machen.
- source_word: וִהְיִיתֶם נְקִיִּים
  choice: und seid … von eurer Verpflichtung frei
  rationale: נָקִי kann »rein«, »unschuldig« oder »frei von Haftung bzw. Verpflichtung« bedeuten. Im Zusammenhang geht es um die erfüllte Zusage der Stämme; die gewählte Formulierung macht diesen Sinn verständlich, während die Fußnote die weitere Bedeutungsbreite wahrt.
- source_word: מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: gegenüber Jahwe und Israel
  rationale: Mit נָקִי bezeichnet מן, wem gegenüber keine Schuld oder Verpflichtung mehr besteht. »Gegenüber« ist dafür im Deutschen idiomatisch und bewahrt den relationalen Sinn.
- source_word: וְהָיְתָה הָאָרֶץ הַזֹּאת לָכֶם לַאֲחֻזָּה
  choice: Dann soll dieses Land … euer Besitz sein
  rationale: אֲחֻזָּה bezeichnet festen Landbesitz, häufig mit erblichem Einschlag. »Besitz« ist hier genau und verständlich, ohne die Erblichkeit stärker auszudrücken, als es der unmittelbare Wortlaut verlangt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form »Jahwe« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Bundesname wird in der im Deutschen üblichen Form wiedergegeben. Eine Fußnote nennt die traditionelle Ersetzung durch den Titel »der HERR«.
- issue: Bedeutung von נְקִיִּים im Zusammenhang der eingegangenen Zusage
  choice: von eurer Verpflichtung frei
  alternative: schuldlos / unschuldig
  rationale: Der Kontext handelt von der Erfüllung einer Verpflichtung gegenüber Gott und Israel. Da das hebräische Wort zugleich Schuldlosigkeit ausdrücken kann, wird diese Bedeutungsalternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder bleiben nahe an der hebräischen Bedingungsfolge; kurze Hauptsätze verhindern jedoch eine schwerfällige Kettenkonstruktion. Der Vers beginnt bewusst mit »und«, weil er die im vorherigen Vers begonnene Bedingung fortsetzt.
