  source_fidelity: 'Die zentrale Bedeutungsfolge ist zutreffend: Unterwerfung des Landes vor Jahwe, anschließende Rückkehr, Freiheit von der eingegangenen Verantwortung gegenüber Jahwe und Israel sowie Besitz des Landes. Die Übersetzung sollte jedoch die aus dem vorherigen Vers fortgesetzte Bedingung im Deutschen ausdrücklich und syntaktisch klar markieren. Außerdem gibt »seid ... frei« nach »könnt ihr zurückkehren« die hebräische Zukunfts-/Folgeaussage weniger gut wieder.'
  naturalness: 'Die vorliegende Fassung ist wegen des punktierten Satzanfangs »und das Land ... unterworfen ist. Danach« nicht idiomatisch: Der einleitende Teilsatz verlangt eine Fortsetzung als Bedingungs- oder Zeitsatz. »könnt ihr zurückkehren und seid ... frei« verbindet zudem zwei grammatisch und semantisch unterschiedlich geartete Aussagen holprig.'
  terminology: »Jahwe«, »unterworfen«, »Besitz« und die Fußnotenalternativen sind sachgerecht. »von eurer Verpflichtung frei« ist im Kontext vertretbar, doch »von jeder Verpflichtung frei« ist idiomatischer und vermeidet eine unnötig enge Festlegung auf nur eine einzelne Verpflichtung; die Fußnote erhält die Bedeutung »schuldlos/unschuldig«.
