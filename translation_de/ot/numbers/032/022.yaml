- from: und das Land vor Jahwe[a] unterworfen ist. Danach könnt ihr zurückkehren und seid gegenüber Jahwe und Israel von eurer Verpflichtung frei[b]. Dann soll dieses Land vor Jahwe euer Besitz sein.
  to: und wenn das Land vor Jahwe[a] unterworfen ist, könnt ihr danach zurückkehren, und ihr werdet gegenüber Jahwe und Israel von jeder Verpflichtung frei sein[b]. Und dieses Land wird vor Jahwe euer Besitz sein.
  rationale: Die Revision stellt die bedingte Fortsetzung aus dem vorhergehenden Vers mit »wenn« syntaktisch klar dar, bewahrt die zeitliche Abfolge mit »danach« und gibt die zukünftige Folge von וִהְיִיתֶם mit »ihr werdet ... frei sein« wieder. Die Fußnotenanker bleiben beim Gottesnamen bzw. bei נְקִיִּים; die Fußnote zu b wurde an die vollständige deutsche Satzform angepasst.
