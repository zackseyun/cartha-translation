  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: de
  text: Keiner von den Männern, die aus Ägypten heraufzogen und zwanzig Jahre alt oder älter waren, wird das Land sehen[a], das ich Abraham, Isaak und Jakob zugeschworen habe; denn sie sind mir nicht vollständig gefolgt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen eine Schwurformel mit „wenn“: „Wenn die Männer … das Land sehen werden“. In diesem Zusammenhang ist damit eine nachdrückliche Verneinung gemeint: „Keiner … wird das Land sehen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie sind mir nicht ganz gefolgt.“ Das hebräische Idiom betont, dass ihr Folgen nicht vollständig war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Keiner ... wird ... sehen
  rationale: אִם eröffnet hier eine verkürzte Schwurformel mit impliziter Verneinung. Die deutsche Wiedergabe als entschiedene negative Aussage vermittelt ihren Sinn, ohne durch ein wörtliches „wenn“ irrezuführen.
- source_word: יִרְאוּ
  choice: wird ... sehen
  rationale: ראה bezeichnet hier das Erleben beziehungsweise Erreichen des verheißenen Landes. „sehen“ bewahrt die knappe Bildsprache des Hebräischen.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das hebräische Substantiv ist ausdrücklich maskulin und steht im Zusammenhang mit den Männern im wehrfähigen Zählalter.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: die aus Ägypten heraufgezogen sind
  rationale: עלה mit מִן ist eine typische Wendung für den Auszug aus Ägypten. „heraufgezogen“ erhält dieses räumliche Bild.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: zwanzig Jahre oder älter waren
  rationale: Dies gibt die hebräische Altersgrenze in natürlichem modernem Deutsch präzise wieder.
- source_word: הָאֲדָמָה
  choice: das Land
  rationale: אֲדָמָה kann „Erdboden“ bedeuten, bezeichnet hier aber im Zusammenhang der Verheißung das zugesagte Land.
- source_word: נִשְׁבַּעְתִּי
  choice: zugeschworen habe
  rationale: Das Verb bezeichnet eine feierliche eidliche Zusage. „zugeschworen“ verbindet im Deutschen den Eid natürlich mit den genannten Empfängern.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Isaak und Jakob
  rationale: Die drei Empfänger der Landverheißung werden vollständig und in der Reihenfolge des Hebräischen genannt; die Beziehung wird durch „zugeschworen“ idiomatisch ausgedrückt.
- source_word: כִּי
  choice: denn
  rationale: כִּי nennt hier den Grund für das angekündigte Gericht. „denn“ bewahrt den feierlichen Erzählton und macht den kausalen Zusammenhang deutlich.
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: sie sind mir nicht uneingeschränkt gefolgt
  rationale: Die Wendung מלא אחרי bedeutet, jemandem vollständig beziehungsweise ohne Vorbehalt zu folgen. Die Übersetzung erhält das konkrete Motiv des Folgens und gibt zugleich den idiomatischen Vollständigkeitsaspekt wieder.
theological_decisions:
- issue: Wiedergabe der mit אִם eingeleiteten Schwurformel
  choice: Keiner von den Männern ... wird das Land sehen
  alternative: Wenn die Männer ... das Land sehen werden
  rationale: In diesem Schwurkontext trägt אִם eine implizite starke Verneinung. Eine rein wörtliche Bedingungsform wäre auf Deutsch missverständlich; die gewählte Fassung gibt das feierliche göttliche Urteil wieder, ohne es theologisch auszuweiten.
- issue: Reichweite der Wendung לֹא מִלְאוּ אַחֲרַי
  choice: sie sind mir nicht uneingeschränkt gefolgt
  alternative: sie sind nicht vollständig hinter mir hergegangen
  rationale: Die Formulierung bewahrt das relationale Bild des Folgens und bringt den Aspekt der fehlenden Ganzheit zum Ausdruck, ohne ihn zu einer abstrakten Aussage über den gesamten Glaubenszustand der Betroffenen auszubauen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die hebräische Schwurformel wird sinnentsprechend wiedergegeben; die Bilder des Heraufziehens, Sehens und Folgens bleiben erhalten.
