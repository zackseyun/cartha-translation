  to: Keiner von den Männern, die aus Ägypten heraufzogen und zwanzig Jahre alt oder älter waren, wird das Land sehen[a], das ich Abraham, Isaak und Jakob zugeschworen habe; denn sie sind mir nicht vollständig gefolgt[b].
