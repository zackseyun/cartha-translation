  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: de
  text: 'Da antworteten die Söhne Gads und die Söhne Rubens: »Was Jahwe zu deinen Dienern geredet hat, das werden wir tun.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie Jahwe zu deinen Dienern geredet hat, so werden wir handeln.«'
    reason: Die Verbindung אֵת אֲשֶׁר … כֵּן kann entweder inhaltlich als »Was … das« oder stärker modal als »Wie … so« wiedergegeben werden.
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Da antworteten
  rationale: Das narrative Wayyiqtol von ענה leitet die unmittelbare Antwort auf die vorausgehende Rede ein. »Da antworteten« ist im Deutschen natürlich und bildet die Erzählfolge ab.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: die Söhne Gads und die Söhne Rubens
  rationale: Die zweimalige hebräische Verbindung mit בְּנֵי wird transparent wiedergegeben; die Wiederholung bleibt erhalten, statt sie durch »Gaditer und Rubeniter« zusammenzuziehen.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der hebräische Redeintroduktor wird im modernen Deutschen idiomatisch durch die Zeichensetzung ausgedrückt; ein zusätzliches »und sagten« wäre nach »antworteten« schwerfälliger.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: Was ... das
  rationale: Die korrelative Verbindung bezeichnet den Inhalt der vorausgegangenen Rede und dessen entsprechende Ausführung. »Was … das« bewahrt diese Beziehung klar und natürlich.
- source_word: דִּבֶּר
  choice: geredet hat
  rationale: Das Perfekt verweist auf Jahwes unmittelbar vorausgehende, weiterhin maßgebliche Rede. Das deutsche Perfekt bringt diese gegenwärtige Relevanz passend zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. »Jahwe« ist die im Deutschen übliche Form der wissenschaftlich begründeten Umschrift des Tetragramms.
- source_word: אֶל עֲבָדֶיךָ
  choice: zu deinen Dienern
  rationale: Die Sprecher bezeichnen sich gegenüber Mose ehrerbietig als seine Diener; »Sklaven« würde hier einen nicht im Vordergrund stehenden Rechtsstatus nahelegen.
- source_word: נַעֲשֶׂה
  choice: werden wir tun
  rationale: Die breite Bedeutung von עשה wird direkt wiedergegeben, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Wiedergabe als »Jahwe« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Jahwes Rede und der Zusage der Stämme
  choice: Was Jahwe zu deinen Dienern geredet hat, das werden wir tun.
  alternative: Wie Jahwe zu deinen Dienern geredet hat, so werden wir handeln.
  rationale: Die Hauptfassung versteht אֵת אֲשֶׁר als Inhaltsangabe und כֵּן als rückverweisendes Korrelat. Die alternative modale Lesart bleibt in der Fußnote sichtbar, ohne den Gehorsamsumfang enger festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wörtliche Stammesbezeichnung und der Gottesname bleiben erhalten; der hebräische Redeintroduktor wird durch einen deutschen Doppelpunkt idiomatisch umgesetzt.
