base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: de
  text: 'Die Söhne Rubens und die Söhne Gads hatten außerordentlich viel Vieh[a]. Sie sahen das Land von Jaser und das Land Gilead, und siehe: Der Ort war ein Ort für Vieh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Rubeniter und die Gaditer hatten außerordentlich viel Vieh.“ Wörtlich steht im Hebräischen: „die Söhne Rubens und die Söhne Gads“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Der Ort war für Vieh geeignet.“ Das Hebräische wiederholt „Ort“ zur Hervorhebung: „Der Ort war ein Ort für Vieh.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: sehr große Viehbestände
  rationale: מִקְנֶה bezeichnet Vieh beziehungsweise Tierbesitz in seiner Gesamtheit; der deutsche Plural „Viehbestände“ gibt die große Menge natürlich wieder. „Sehr große“ bündelt רַב und die nachgestellte Verstärkung עָצוּם מְאֹד, ohne die Aussage auf Rinder zu verengen.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: die Söhne Rubens und die Söhne Gads
  rationale: Die Wiedergabe bewahrt sowohl das wörtliche „Söhne“ als auch dessen Wiederholung im Hebräischen. Gemeint sind im Zusammenhang die Angehörigen der beiden Stämme; diese verständlichere Alternative wird in der Fußnote genannt.
- source_word: וַיִּרְאוּ
  choice: Sie sahen
  rationale: Die einfache narrative Fortführung wird als neuer deutscher Hauptsatz wiedergegeben. So wird keine im Ausgangstext nicht ausdrücklich markierte temporale oder kausale Beziehung eingeführt.
- source_word: אֶרֶץ יַעְזֵר וְאֶת אֶרֶץ גִּלְעָד
  choice: das Land von Jaser und das Land Gilead
  rationale: אֶרֶץ wird direkt mit „Land“ übersetzt und die Wiederholung beibehalten. „Jaser“ folgt der im Deutschen etablierten biblischen Namensform.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: „Siehe“ erhält die aufmerksamkeitslenkende und entdeckende Funktion von הִנֵּה. Die Form ist gehoben, aber im biblischen Erzählstil weiterhin verständlich.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: Die Gegend war für Viehhaltung geeignet
  rationale: 'Die idiomatische deutsche Formulierung gibt den Sinn wieder: Das Gebiet eignete sich als Aufenthalts- und Weideland für Vieh. Die auffällige Wiederholung von מָקוֹם wird in der Fußnote transparent gemacht.'
