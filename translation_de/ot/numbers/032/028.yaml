base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: de
  text: Da gab Mose Eleasar, dem Priester, Josua, dem Sohn Nuns, sowie den Oberhäuptern der Sippen der Stämme Israels Anweisungen in Bezug auf sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da befahl Mose ihnen, nämlich Eleasar, dem Priester, Josua, dem Sohn Nuns, sowie den Oberhäuptern der Sippen der Stämme Israels.“ Das hebräische „ihnen“ kann sich auf diese genannten Leiter beziehen, statt auf die zuvor erwähnten Stämme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: gab … Anweisungen
  rationale: צוה bezeichnet ein autoritatives Anweisen oder Befehlen. „Anweisungen geben“ passt natürlich zum administrativen Zusammenhang und bewahrt den verbindlichen Charakter.
- source_word: לָהֶם
  choice: über sie
  rationale: Das Pronomen verweist im unmittelbaren Zusammenhang am ehesten auf die Rubeniter und Gaditer, über die Mose den genannten Leitern Anweisungen erteilt. Die alternative syntaktische Zuordnung wird in der Fußnote offengehalten.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: Eleasar, dem Priester
  rationale: Der Akkusativmarker kennzeichnet bei צוה die angewiesene Person. Im Deutschen verlangt die Wendung „Anweisungen geben“ den Dativ.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, dem Sohn Nuns
  rationale: Die traditionelle deutsche Namensform „Josua“ und der knappe Genitiv „Nuns“ geben das hebräische Patronymikon natürlich und genau wieder.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: den Oberhäuptern der Sippen der Stämme
  rationale: Die komprimierte Verwaltungsbezeichnung benennt die Leiter der väterlich-ancestralen Verbände innerhalb der Stämme. „Sippen“ ist im heutigen Deutsch verständlicher als „Vaterhäuser“, ohne die soziale Gliederung einzuebnen.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: Israels
  rationale: In Verbindung mit den Stämmen bezeichnet die Wendung das Volk Israel. Der Genitiv „Israels“ ist knapp, idiomatisch und bewahrt den genealogisch-volklichen Bezug.
