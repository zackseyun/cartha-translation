base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: de
  text: Denn wenn ihr euch von ihm abwendet[a], wird er es wieder in der Wüste zurücklassen[b], und ihr werdet dieses ganze Volk ins Verderben stürzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von hinter ihm“. Die Wendung bezeichnet die Abkehr davon, ihm zu folgen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht ein Pronomen im Singular: „es/ihn in der Wüste zurücklassen“. Es ist wahrscheinlich kollektiv auf Israel beziehungsweise das Volk bezogen. Manche Übersetzungen geben sinngemäß „sie“ oder ausdrücklich „Israel“ wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn wenn
  rationale: Die Verbindung bewahrt sowohl die begründende Anknüpfung an den vorherigen Vers als auch die bedingende Aussage.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: ihr euch davon abwendet, ihm zu folgen
  rationale: Die Wendung bedeutet nicht bloß eine räumliche Rückkehr, sondern die Abkehr davon, hinter jemandem herzugehen beziehungsweise ihm zu folgen.
- source_word: וְיָסַף עוֹד
  choice: wird er erneut
  rationale: Die Verbindung von יסף und עוד bezeichnet hier die Wiederholung eines Geschehens.
- source_word: לְהַנִּיחוֹ
  choice: es … lassen
  rationale: נוח im Hifil kann hier ‚bleiben lassen‘ bedeuten. Das sächliche Singularpronomen gibt den hebräischen Singular kollektiv mit Bezug auf ‚Volk‘ wieder, ohne ihn zum Plural zu glätten.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: ‚Wüste‘ ist im Deutschen die natürliche und traditionsübergreifend verständliche Wiedergabe von מִדְבָּר in diesem Erzählzusammenhang.
- source_word: וְשִׁחַתֶּם
  choice: ihr werdet … ins Verderben stürzen
  rationale: Die Form bezeichnet das Verursachen von Verderben oder Untergang. Die Wendung erhält den kausativen Sinn, ohne zwingend eine sofortige vollständige Vernichtung festzulegen.
- source_word: לְכָל הָעָם הַזֶּה
  choice: dieses ganze Volk
  rationale: Die Wiedergabe erhält das kollektive Singular des Hebräischen und klingt zugleich natürlich auf Deutsch.
theological_decisions:
- issue: Bezug des singularischen Pronomens in לְהַנִּיחוֹ
  choice: Das Singularpronomen wird als ‚es‘ beibehalten und kollektiv auf ‚dieses ganze Volk‘ bezogen.
  alternative: 'Den Bezug zum Plural glätten: ‚sie in der Wüste lassen‘; oder ausdrücklich ‚Israel in der Wüste lassen‘.'
  rationale: Der masoretische Text enthält ein maskulines Singularsuffix. Da das deutsche ‚Volk‘ sächlich ist, bewahrt ‚es‘ sowohl den Numerus als auch den wahrscheinlichen kollektiven Bezug, ohne einen ausdrücklichen Referenten in den Text einzufügen.
- issue: Stärke und Reichweite von וְשִׁחַתֶּם
  choice: ‚ins Verderben stürzen‘
  alternative: ‚vernichten‘ oder ‚zugrunde richten‘
  rationale: Die gewählte Formulierung gibt die verursachende Verantwortung der Angesprochenen wieder und lässt offen, ob das Verderben ausschließlich als unmittelbare physische Vernichtung zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die begründend-konditionale Einleitung, der kollektive Singular und die kausative Unheilsfolge werden bewahrt; schwer verständliche hebräische Idiomatik wird im Haupttext natürlich wiedergegeben und in den Fußnoten erläutert.
