  text: כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔/ם מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן וָ/הָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֨/נוּ֙ אֵלֵ֔י/נוּ מֵ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: de
  text: Denn wir werden nicht gemeinsam mit ihnen jenseits des Jordan und darüber hinaus Erbbesitz erhalten, weil uns unser Erbbesitz auf der Ostseite des Jordan zugefallen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִנְחַל
  choice: wir werden … Erbbesitz erhalten
  rationale: Das Qal von נחל bezeichnet hier das Empfangen eines Landanteils als Erbbesitz. Die Formulierung ist im Deutschen natürlicher als das wörtliche »erben« und bewahrt den Zusammenhang der Landzuteilung.
- source_word: אִתָּם
  choice: zusammen mit ihnen
  rationale: Die Präposition bezeichnet die gemeinsame Beteiligung mit den übrigen Stämmen.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: jenseits des Jordan und weiter westwärts
  rationale: מֵעֵבֶר bezeichnet die andere Seite des Jordan; וָהָלְאָה meint von dort aus weiter. Da die Sprecher östlich des Jordan stehen und der Gegensatz im zweiten Halbvers ausdrücklich die Ostseite nennt, macht »westwärts« die räumliche Blickrichtung verständlich.
- source_word: בָאָה נַחֲלָתֵנוּ אֵלֵינוּ
  choice: uns unser Erbbesitz … zugefallen ist
  rationale: Das wörtliche Bild »unser Erbbesitz ist zu uns gekommen« wird mit der im deutschen Zuteilungskontext natürlichen Wendung »zugefallen« wiedergegeben; das Perfekt bezeichnet die bereits feststehende Zuteilung.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: auf der Ostseite des Jordan
  rationale: Die Wendung bezeichnet hier eindeutig die östliche Seite des Jordan. Diese Wiedergabe vermeidet die im Deutschen perspektivisch mehrdeutige Formulierung »jenseits des Jordan«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erbbesitz« hält den sachlichen und bundestheologischen Landzuteilungscharakter fest, ohne konfessionelle Deutung hinzuzufügen. Die räumliche Gegenüberstellung von Westen und Osten wird für heutige Leser klar ausgedrückt.
