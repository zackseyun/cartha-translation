  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: de
  text: außer Kaleb – dem Sohn Jefunnes, dem Kenasiter – und Josua, dem Sohn Nuns; denn sie sind Jahwe ganz nachgefolgt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sie füllten hinter Jahwe [her]“; die hebräische Wendung bezeichnet uneingeschränkte Treue und vollständiges Nachfolgen.'
    reason: Erläuterung des hebräischen Idioms und seiner ungewöhnlichen wörtlichen Gestalt.
lexical_decisions:
- source_word: בִּלְתִּי
  choice: außer
  rationale: Die Partikel führt hier die einzigen Ausnahmen von dem zuvor genannten Gericht ein; „außer“ ist im Deutschen knapp und natürlich.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Kaleb, dem Sohn Jefunnes
  rationale: Die Eigennamen folgen der üblichen deutschen biblischen Schreibweise; das Abstammungsverhältnis wird idiomatisch mit „Sohn“ wiedergegeben.
- source_word: הַקְּנִזִּי
  choice: dem Kenasiter
  rationale: Die Herkunfts- beziehungsweise Sippenbezeichnung wird mit der im Deutschen geläufigen Form „Kenasiter“ wiedergegeben.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: und Josua, dem Sohn Nuns
  rationale: Die Konjunktion verbindet die zweite Ausnahme; die Namen werden in geläufiger deutscher Form wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet, warum Kaleb und Josua ausgenommen sind; „denn“ bewahrt den Anschluss an den vorangehenden Satzteil.
- source_word: מִלְאוּ אַחֲרֵי
  choice: mit ungeteiltem Herzen gefolgt
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „hinter [jemandem] voll machen“ und bezeichnet uneingeschränkte Loyalität. Die deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne bloßen Gehorsam als alleinige Deutung festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung von מִלְאוּ אַחֲרֵי
  choice: mit ungeteiltem Herzen gefolgt
  alternative: vollständig gefolgt
  rationale: Die idiomatische Wendung drückt uneingeschränkte Treue aus. „Mit ungeteiltem Herzen“ macht dies in natürlichem Deutsch verständlich, ohne die Aussage auf eine bestimmte dogmatische Kategorie zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist als Fortsetzung des vorangehenden Satzes mit kleingeschriebenem „außer“ gestaltet; die semikolonartige Gliederung macht Ausnahme und Begründung klar.
