base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: de
  text: Da gab Mose den Nachkommen Gads, den Nachkommen Rubens und dem halben Stamm Manasse, dem Sohn Josefs, das Königreich Sihons, des Königs der Amoriter, und das Königreich Ogs, des Königs von Baschan – das Land mit seinen Städten, den Städten des Landes ringsum, in ihren Gebieten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und das Land, seine Städte mit ihren Gebieten, die Städte des Landes ringsum.“ Die hebräische Schlussformulierung ist syntaktisch stark verdichtet; mehrere eng verwandte Wiedergaben sind möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: So gab
  rationale: נתן bezeichnet hier die Zuweisung des eroberten Landes. „Gab“ bewahrt den schlichten Erzählstil; „so“ nimmt das narrative וַ auf.
- source_word: לָהֶם
  choice: den … und dem …
  rationale: Der hebräische indirekte Gegenstand wird in den ausdrücklich genannten Empfängern wiedergegeben; ein zusätzliches „ihnen“ wäre im Deutschen schwerfällig.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: den Nachkommen Gads, den Nachkommen Rubens
  rationale: „Nachkommen“ gibt בְּנֵי als Stammes- und Familienbezeichnung natürlich wieder, ohne ausschließlich unmittelbare Söhne zu meinen.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: und dem halben Stamm Manasse
  rationale: Dies ist im Deutschen klarer und natürlicher als „Halbstamm“, bleibt aber formal nahe an der hebräischen Fügung.
- source_word: בֶן יוֹסֵף
  choice: dem Sohn Josefs
  rationale: Die genealogische Kennzeichnung Manasses wird ausdrücklich bewahrt.
- source_word: מַמְלֶכֶת
  choice: das Königreich
  rationale: „Königreich“ ist die direkte und im Kontext verständliche Wiedergabe des ehemals von den beiden Königen beherrschten Gebiets.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihons, des Königs der Amoriter
  rationale: Die genitivische deutsche Form gibt die hebräische Apposition eindeutig und würdig wieder.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogs, des Königs von Baschan
  rationale: Direkte Wiedergabe der Namens- und Titelfolge; „von Baschan“ bezeichnet den Herrschaftsbereich.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier das zuvor genannte Territorium; „Land“ ist die übliche und hinreichend offene Entsprechung.
- source_word: לְעָרֶיהָ
  choice: mit seinen Städten
  rationale: Die elliptische Präpositionalfügung wird idiomatisch als Einschluss der zum Land gehörenden Städte verstanden.
- source_word: בִּגְבֻלֹת
  choice: in ihren Gebieten
  rationale: Der Plural von גְּבוּל kann Grenzen oder abgegrenzte Gebiete bezeichnen. „In ihren Gebieten“ ist verständlich, lässt die genaue Zuordnung des Pronomens jedoch entsprechend dem Hebräischen offen.
- source_word: עָרֵי הָאָרֶץ סָבִיב
  choice: die Städte des Landes ringsum
  rationale: Die knappe, appositionelle Schlussformulierung wird möglichst eng nachgebildet, ohne ihre syntaktische Mehrdeutigkeit aufzulösen.
