  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: de
  text: Und warum entmutigt[a] ihr die Israeliten, in das Land hinüberzuziehen, das Jahwe ihnen gegeben hat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Herz der Söhne Israels mutlos macht“; gemeint ist, ihren Mut oder ihre Entschlossenheit zu schwächen.'
    reason: Bewahrt die bildhafte hebräische Ausdrucksweise und weist zugleich auf die wörtlichere Wiedergabe der Volksbezeichnung hin.
lexical_decisions:
- source_word: וְלָמָּה
  choice: Und warum
  rationale: Gibt sowohl die Verknüpfung mit dem vorausgehenden Vorwurf als auch die Frage wieder.
- source_word: תנואון אֶת לֵב
  choice: entmutigt ihr
  rationale: Das Hifil von נוא bezeichnet hier das Schwächen des Mutes oder der Entschlossenheit. Die natürliche deutsche Wiedergabe „entmutigen“ erfasst die hebräische Wendung mit „Herz“, ohne unidiomatisch zu klingen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die geläufige deutsche Volksbezeichnung gibt die Zugehörigkeit der wörtlichen Wendung „Söhne Israels“ präzise und natürlich wieder; im Kontext ist das ganze Volk gemeint.
- source_word: מֵעֲבֹר אֶל הָאָרֶץ
  choice: in das Land hinüberzuziehen
  rationale: Die Präposition מִן mit dem Infinitiv bezeichnet das Abhalten von der Überquerung; „hinüberziehen“ bewahrt zugleich das Motiv des Übergangs in das Land.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: das … ihnen gegeben hat
  rationale: Das Perfekt beschreibt die vollzogene göttliche Gabe mit fortdauernder Geltung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als gebräuchliche deutsche Umschrift wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; seine Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Umfang von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Formulierung bezeichnet hier kollektiv das Volk. „Israeliten“ wahrt diesen Sinn, ohne die Wendung auf ausschließlich männliche Einzelpersonen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinüberziehen“ hält den konkreten Übergang in das Land präsent; die Satzstellung bleibt trotz enger Orientierung am Hebräischen natürlich.
