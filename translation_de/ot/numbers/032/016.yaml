  text: וַ/יִּגְּשׁ֤וּ אֵלָי/ו֙ וַ֣/יֹּאמְר֔וּ גִּדְרֹ֥ת צֹ֛אן נִבְנֶ֥ה לְ/מִקְנֵ֖/נוּ פֹּ֑ה וְ/עָרִ֖ים לְ/טַפֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: de
  text: 'Da traten sie zu ihm und sagten: »Wir wollen hier Schafpferche für unser Vieh bauen und Städte für unsere Kinder.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unsere Kleinen« beziehungsweise »unsere Angehörigen«. Das hebräische Wort bezeichnet besonders die kleinen oder abhängigen und damit schutzbedürftigen Mitglieder der Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: Da traten sie zu ihm
  rationale: נגשׁ bezeichnet hier das körperliche Herantreten; die Formulierung gibt zugleich die fortschreitende Erzählung natürlich wieder.
- source_word: וַיֹּאמְרוּ
  choice: und sagten
  rationale: Schlichte und gegenwärtige deutsche Redeeinleitung für die hebräische Erzählform.
- source_word: גִּדְרֹת צֹאן
  choice: Schafpferche
  rationale: Die Konstruktverbindung bezeichnet eingefriedete Plätze für Schafe; »Schafpferche« ist präzise und im Deutschen verständlich.
- source_word: נִבְנֶה
  choice: wir wollen … bauen
  rationale: Der Imperfekt der ersten Person Plural drückt im Kontext eine Absicht beziehungsweise einen Vorschlag aus; »wir wollen« bewahrt diese modale Offenheit besser als eine rein zukünftige Aussage.
- source_word: לְמִקְנֵנוּ
  choice: für unser Vieh
  rationale: מִקְנֶה ist ein Sammelbegriff für Nutz- beziehungsweise Herdentiere und nicht auf Rinder beschränkt.
- source_word: פֹּה
  choice: hier
  rationale: Direkte und natürliche Wiedergabe des Ortsadverbs.
- source_word: וְעָרִים
  choice: und Städte
  rationale: עָרִים bedeutet grundsätzlich »Städte«, auch wenn nach antikem Maßstab kleinere befestigte Orte gemeint sein können.
- source_word: לְטַפֵּנוּ
  choice: für unsere Kinder
  rationale: טַף bezeichnet besonders die kleinen und schutzbedürftigen Angehörigen. »Kinder« ist im modernen Deutschen natürlicher als »die Kleinen«; die weitere Bedeutungsnuance wird in der Fußnote genannt.
theological_decisions: []
