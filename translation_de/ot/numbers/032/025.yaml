  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: de
  text: 'Da sagten die Gaditer und die Rubeniter zu Mose: „Deine Diener werden tun, wie mein Herr befiehlt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: die Gaditer und die Rubeniter
  rationale: Das hebräische „Söhne Gads und Söhne Rubens“ bezeichnet hier die Angehörigen der beiden Stämme; die deutschen Volksbezeichnungen sind natürlich und sachlich genau.
- source_word: לֵאמֹר
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Redeformel-Infinitiv wird im heutigen Deutsch durch den Doppelpunkt und die direkte Rede idiomatisch ausgedrückt; „und sagten … und sprachen“ wäre unnötig schwerfällig.
- source_word: עֲבָדֶיךָ
  choice: Deine Diener
  rationale: Bewahrt die demütige Selbstbezeichnung der Sprecher gegenüber Mose.
- source_word: כַּאֲשֶׁר אֲדֹנִי מְצַוֶּה
  choice: was mein Herr befiehlt
  rationale: Gibt die respektvolle Anrede an Mose im Singular wieder und bewahrt das Präsens des Partizips.
theological_decisions:
- issue: Bezug von אֲדֹנִי
  choice: mein Herr
  alternative: der HERR
  rationale: Die Form mit Suffix der ersten Person Singular ist hier eine respektvolle Anrede an Mose, nicht der Gottesname.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stammesbezeichnungen sind idiomatisch wiedergegeben; die Höflichkeits- und Unterordnungsformeln des Hebräischen bleiben erkennbar.
