  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: de
  text: Unsere kleinen Kinder[a], unsere Frauen, unser Vieh und alle unsere Tiere werden dort in den Städten Gileads bleiben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Kinder“. Das hebräische Wort טַף bezeichnet oft besonders kleine oder abhängige Kinder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden dort sein“. Im Hebräischen steht einfach „werden sein“; im Zusammenhang ist gemeint, dass sie dort bleiben, während die Männer in den Kampf ziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: unsere kleinen Kinder
  rationale: טַף bezeichnet häufig besonders die kleinen oder abhängigen Kinder; die Formulierung gibt diesen Schwerpunkt natürlich wieder, ohne die mögliche allgemeinere Bedeutung auszuschließen.
- source_word: נָשֵׁינוּ
  choice: unsere Frauen
  rationale: Im familiären Zusammenhang bezeichnet der Ausdruck die Ehefrauen der Sprecher; „unsere Frauen“ ist im Deutschen dafür natürlich und würdevoll.
- source_word: מִקְנֵנוּ
  choice: unser Vieh
  rationale: מִקְנֶה bezeichnet Herden und Nutztiere als Besitz; „Vieh“ ist die knappe, geläufige deutsche Entsprechung.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: und alle unsere Tiere
  rationale: בְּהֵמָה ist ein weiter Ausdruck für Tiere, besonders Haustiere. „alle unsere Tiere“ bewahrt die umfassende Aussage und vermeidet eine unnötige Verengung auf Rinder.
- source_word: יִהְיוּ שָׁם
  choice: werden dort bleiben
  rationale: Wörtlich steht „werden dort sein“; im Zusammenhang bedeutet dies, dass sie zurückbleiben, während die Männer zum Kampf ausziehen.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: in den Städten Gileads
  rationale: Die Status-constructus-Verbindung wird im Deutschen natürlich als Genitivverbindung wiedergegeben; עָרִים kann hier angemessen mit „Städte“ übersetzt werden.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die inhaltliche Wiederaufnahme von „Vieh“ durch den umfassenderen Ausdruck „alle unsere Tiere“ bleibt erhalten. „Bleiben“ gibt die kontextuelle Bedeutung des wörtlichen „sein“ wieder.
