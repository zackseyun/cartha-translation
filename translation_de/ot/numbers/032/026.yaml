  naturalness: Der Satz ist modernes, natürliches Standarddeutsch. Die Wiederholung in „unser Vieh und alle unsere Tiere“ entspricht der im Hebräischen vorliegenden, offenbar umfassend gemeinten Doppelung und sollte nicht geglättet werden.
