  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: de
  text: Sie zogen hinauf bis zum Eschkoltal und sahen das Land, und sie nahmen den Israeliten[a] den Mut, in das Land zu ziehen, das Jahwe[b] ihnen gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Söhnen Israels«; gemeint sind die Israeliten als Volk.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text hat hier den Gottesnamen JHWH, wiedergegeben als »Jahwe«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Sie zogen hinauf
  rationale: Bewahrt die Richtungsbedeutung von עלה und klingt im Deutschen natürlich.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: bis zum Eschkoltal
  rationale: נחל bezeichnet hier ein Tal beziehungsweise Wadi; „Eschkoltal“ ist verständlich und entspricht dem etablierten Ortsnamen.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: und sahen das Land
  rationale: Gibt ראה schlicht und quellennah wieder, ohne eine genauere Art des Betrachtens einzutragen.
- source_word: וַיָּנִיאוּ אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: Dann nahmen sie den Israeliten den Mut
  rationale: Die kausative Verbform bezeichnet hier das Entmutigen beziehungsweise Abbringen; die deutsche Wendung gibt zugleich die Funktion von לֵב als Mut und Entschlossenheit wieder.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: in das Land zu ziehen
  rationale: In Verbindung mit „den Mut nehmen“ drückt der Infinitiv natürlich aus, dass sie vom Hineingehen abgehalten wurden.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: das Jahwe ihnen gegeben hatte
  rationale: Das Plusquamperfekt passt zum rückblickenden Erzählzusammenhang; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ macht diesen im Haupttext sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: „Israeliten“ ist die natürliche moderne deutsche Wiedergabe der üblichen nationalen und bundestheologischen Bezeichnung; die wörtlichere Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Formulierung „den Mut nehmen“ erschließt den Sinn der hebräischen Wendung, während die Fußnote die wörtlichere Volksbezeichnung dokumentiert.
