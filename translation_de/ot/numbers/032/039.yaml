  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: de
  text: Die Söhne Machirs, des Sohnes Manasses, zogen nach Gilead und nahmen es ein; und er vertrieb[a] die Amoriter[b], die dort lebten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht nach den vorangehenden Verben im Plural ein Verb im Singular: „und er vertrieb“. Möglicherweise wird Machirs Nachkommenschaft als kollektive Einheit behandelt; denkbar ist auch ein textlicher oder stilistischer Wechsel. Manche Übersetzungen glätten die Form zu „und sie vertrieben“.'
    reason: textual_variant
  - marker: b
    text: 'Im Hebräischen steht der Volksname im Singular: „der Amoriter“. Er ist hier kollektiv gebraucht und bezeichnet die amoritischen Bewohner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: zogen
  rationale: הלך ist hier das gewöhnliche narrative Verb für eine zielgerichtete Bewegung. „Zogen“ passt im militärisch-geografischen Zusammenhang, ohne einen im Hebräischen nicht ausdrücklich bezeichneten Aufstieg einzutragen.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Die Söhne Machirs, des Sohnes Manasses
  rationale: בני bedeutet wörtlich „Söhne von“, kann hier jedoch auch Nachkommen oder Angehörige einer Sippe bezeichnen. Die formnahe Wiedergabe bewahrt den hebräischen Verwandtschaftsausdruck und bleibt im Deutschen verständlich.
- source_word: גִּלְעָדָה
  choice: nach Gilead
  rationale: Das direktionale ה bezeichnet eine Bewegung auf Gilead zu; „nach Gilead“ ist die natürliche deutsche Wiedergabe.
- source_word: וַיִּלְכְּדֻהָ
  choice: nahmen es ein
  rationale: לכד bezeichnet häufig die Einnahme eines Ortes oder Gebietes. „Einnehmen“ gibt den militärischen Sinn im Deutschen idiomatisch wieder.
- source_word: וַיּוֹרֶשׁ
  choice: und er vertrieb
  rationale: Die masoretische Form ist grammatisch 3. Person Maskulinum Singular, obwohl zuvor Pluralverben stehen. Die singularische Form wird im Haupttext bewahrt; eine Fußnote erläutert die mögliche kollektive oder stilistisch-textliche Erklärung. ירש im Hifil bedeutet hier „vertreiben/enteignen“; „vertrieb“ ist natürlich und sachlich.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Der morphologische Singular „der Amoriter“ wird kollektiv für die Angehörigen dieses Volkes gebraucht. Der deutsche Plural macht diese Funktion klar.
- source_word: אֲשֶׁר בָּהּ
  choice: die dort lebten
  rationale: Wörtlich steht „die in ihr waren“. Im Zusammenhang sind die Bewohner Gileads gemeint; „die dort lebten“ gibt dies in natürlichem Deutsch wieder, ohne den Referenten zu verändern.
