translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Numerusverschiebung des hebräischen Textes wird bewusst im Haupttext erhalten und erläutert. Das Semikolon hält den Satzfluss zusammen, markiert aber zugleich den abrupten Wechsel vom pluralischen zum singularischen Verb.
