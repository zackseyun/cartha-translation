  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: de
  text: Und die Söhne Rubens bauten Heschbon, Elale und Kirjatajim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: Und die Söhne Rubens
  rationale: בְנֵי bedeutet wörtlich „Söhne von“; zusammen mit dem Stammesnamen bezeichnet es Rubens Nachkommen. Die Wiedergabe bewahrt die hebräische Ausdrucksform und den Abstammungsbezug, ohne die idiomatisch mögliche Übersetzung „Rubeniter“ vorzuschreiben.
- source_word: בָּנוּ
  choice: bauten
  rationale: Das Qal Perfekt von בנה hat als Grundbedeutung „bauen“. Im Siedlungszusammenhang könnte ein Wiederaufbau oder Ausbau gemeint sein, doch der Text selbst legt diese Präzisierung nicht ausdrücklich fest.
- source_word: אֶת / וְאֶת / וְאֵת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigenständige Entsprechung; die Objektfunktion wird durch Satzbau und Kasus ausgedrückt.
- source_word: חֶשְׁבּוֹן
  choice: Heschbon
  rationale: Der Ortsname wird nach geläufiger deutscher Bibelnamensform wiedergegeben.
- source_word: אֶלְעָלֵא
  choice: Elale
  rationale: Der Ortsname wird in einer im Deutschen etablierten Form wiedergegeben, die die masoretische Lautgestalt angemessen erkennen lässt.
- source_word: קִרְיָתָיִם
  choice: Kirjatajim
  rationale: Die deutsche Transliteration gibt den Ortsnamen und insbesondere die Endung -ajim verständlich und quellennah wieder.
