  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: de
  text: 'Und Mose sagte zu ihnen: »Wenn ihr dies tut, wenn ihr euch vor Jahwe zum Kampf rüstet,[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ihr euch vor Jahwe zum Kampf bewaffnet“ oder „wenn ihr vor Jahwe als Bewaffnete zum Kampf auszieht“. Das hebräische Verb bezeichnet in diesem militärischen Zusammenhang, dass man bewaffnet oder kampfbereit ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: Und Mose sagte zu ihnen
  rationale: Der Wayyiqtol führt die nächste Äußerung in der Erzählfolge ein; die deutsche Satzstellung ist natürlich und bewahrt den Anschluss.
- source_word: אִם תַּעֲשׂוּן אֶת הַדָּבָר הַזֶּה
  choice: Wenn ihr dies tut
  rationale: Die konditionale Wendung blickt auf die zuvor erklärte Zusage zurück. Das knappe „dies“ gibt הַדָּבָר הַזֶּה idiomatisch wieder, ohne den Bezug enger festzulegen.
- source_word: אִם תֵּחָלְצוּ
  choice: wenn ihr euch … rüstet
  rationale: Das Nifal von חלץ bezeichnet hier militärisches Ausgerüstet- beziehungsweise Bereitgemachtsein. „Sich zum Kampf rüsten“ ist im Deutschen klar und natürlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ bewahrt sowohl die räumlich-präsentische als auch die autoritative Dimension von לִפְנֵי; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Im unmittelbaren Zusammenhang bezeichnet מִלְחָמָה den bevorstehenden militärischen Einsatz. „Zum Kampf“ ist natürlicher als „für den Krieg“ und verbindet sich idiomatisch mit „sich rüsten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ macht den Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „vor Jahwe“ für den militärischen Einsatz
  choice: Die offene Formulierung „vor Jahwe“ wird beibehalten.
  alternative: unter Jahwes Befehl / in Jahwes Gegenwart
  rationale: לִפְנֵי kann Gegenwart und Autorität mitschwingen lassen. Eine ausdeutende Übersetzung würde eine dieser Dimensionen einseitig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als noch nicht abgeschlossener Bedingungssatz offen und endet entsprechend mit einem Komma innerhalb der Anführungszeichen.
