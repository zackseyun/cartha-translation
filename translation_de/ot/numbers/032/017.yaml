  to: Wir aber werden uns unverzüglich zum Kampf rüsten und vor den Israeliten herziehen,[a] bis wir sie an ihren Ort gebracht haben. Unsere Kinder[b] werden wegen der Bewohner des Landes in den befestigten Städten bleiben.
  rationale: Die Revision gibt die Eile von חֻשִׁים mit „unverzüglich“ wieder und wahrt zugleich die reflexiv-militärische Bedeutung von נֵחָלֵץ durch „sich zum Kampf rüsten“. Sie vermeidet zusätzliche Modalität sowie die explizite Schutzbehauptung und belässt die mögliche weitere Bedeutung von טַף in der Fußnote.
