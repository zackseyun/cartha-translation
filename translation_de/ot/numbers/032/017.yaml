  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: de
  text: Wir aber werden uns unverzüglich zum Kampf rüsten und vor den Israeliten herziehen,[a] bis wir sie an ihren Ort gebracht haben. Unsere Kinder[b] werden wegen der Bewohner des Landes in den befestigten Städten bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor den Söhnen Israels“. Gemeint ist wahrscheinlich, dass sie vor den übrigen Israeliten, an der Spitze des Heeres, in den Kampf ziehen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Sammelbegriff bezeichnet Kinder und kann auch weitere abhängige Familienangehörige einschließen.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: wir werden uns kampfbereit machen
  rationale: 'Das Nifal von חלץ hat hier im Zusammenhang eine reflexive bzw. mediale Bedeutung: Die Sprecher verpflichten sich, sich für den Kampf auszurüsten.'
- source_word: חֻשִׁים
  choice: kampfbereit
  rationale: Das Wort kann Eile oder entschlossene Bereitschaft ausdrücken und wird in diesem militärischen Zusammenhang teils als Hinweis auf Bewaffnung verstanden. „Kampfbereit“ gibt die energische militärische Bereitschaft natürlich wieder, ohne ein möglicherweise zu enges „schnell“ festzulegen.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten vorausziehen
  rationale: Wörtlich steht „vor den Söhnen Israels“. Im militärischen Kontext bezeichnet die Wendung wahrscheinlich das Ziehen an der Spitze des Heeres; die Fußnote bewahrt die formale Alternative.
- source_word: עַד אֲשֶׁר אִם
  choice: bis
  rationale: Die erweiterte Konjunktion bezeichnet idiomatisch den Endpunkt der zugesagten Handlung.
- source_word: הֲבִיאֹנֻם
  choice: wir sie ... gebracht haben
  rationale: Das Hifil von בוא bedeutet „bringen“ bzw. „kommen lassen“; das Suffix bezieht sich auf die Israeliten.
- source_word: אֶל מְקוֹמָם
  choice: an ihren Ort
  rationale: Die knappe Formulierung bewahrt die Breite des Hebräischen; gemeint ist im Zusammenhang ihr künftiger Siedlungs- bzw. Bestimmungsort.
- source_word: וְיָשַׁב טַפֵּנוּ
  choice: Unsere Kinder und übrigen Angehörigen sollen unterdessen ... bleiben
  rationale: טף ist ein Kollektivbegriff für Kinder und weitere abhängige Familienangehörige. „Bleiben“ passt zum vorübergehenden Aufenthalt während des Feldzugs; „unterdessen“ macht den zeitlichen Zusammenhang natürlich deutlich.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: in den befestigten Städten
  rationale: Die Konstruktverbindung bezeichnet Städte, die durch Befestigungen geschützt sind.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: geschützt vor den Bewohnern des Landes
  rationale: Die Präposition bezeichnet hier die Bedrohung, vor der die befestigten Städte Schutz bieten. Die explizite Wiedergabe ist im Deutschen klarer als „wegen“.
