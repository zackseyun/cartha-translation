source:
  edition: WLC
  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: de
  text: Wir werden nicht in unsere Häuser zurückkehren, bis jeder der Söhne Israels sein Erbteil in Besitz genommen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis die Israeliten jeweils ihr Erbteil in Besitz genommen haben“. Hebräisch: „die Söhne Israels“ und „jeder sein Erbteil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: wir werden nicht zurückkehren
  rationale: Das Qal-Imperfekt der 1. Person Plural bezeichnet im Zusammenhang die verbindliche zukünftige Absicht; die deutsche Futurform gibt die Zusage natürlich wieder.
- source_word: אֶל בָּתֵּינוּ
  choice: in unsere Häuser
  rationale: Bei „zurückkehren“ bezeichnet אֶל das Ziel. „Häuser“ bewahrt den konkreten Plural des Hebräischen.
- source_word: עַד
  choice: bis
  rationale: Die Präposition markiert die zeitliche Grenze der zugesagten Nicht-Rückkehr.
- source_word: הִתְנַחֵל
  choice: in Besitz genommen haben
  rationale: Das Hitpael von נחל bezeichnet hier, dass die Israeliten ihr zugeteiltes Erbland erlangen und besiedeln. Das Perfekt nach „bis“ entspricht im Deutschen dem erreichten Abschluss.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe erhält die wörtliche, familiäre Bundesbezeichnung des hebräischen Textes; die idiomatische Alternative steht in der Fußnote.
- source_word: אִישׁ נַחֲלָתוֹ
  choice: jeder sein Erbteil
  rationale: אִישׁ wirkt hier distributiv („jeder“), während נַחֲלָתוֹ den jeweils zugeteilten Landbesitz bezeichnet. „Erbteil“ bewahrt den theologischen und landbezogenen Gehalt.
theological_decisions:
- issue: Geschlechtlich markierte Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptfassung bewahrt die ausdrücklich männliche und familiäre Form des Hebräischen, ohne sie stillschweigend zu neutralisieren. Die im Deutschen geläufigere kollektive Bezeichnung wird als Alternative dokumentiert.
- issue: Bedeutung von נחל als Erbe und Landzuteilung
  choice: sein Erbteil in Besitz genommen haben
  alternative: sein Erbteil erhalten haben
  rationale: Die gewählte Formulierung verbindet den Erbcharakter des Landes mit der im Kontext gemeinten tatsächlichen Besitznahme, ohne das Verhältnis zwischen göttlicher Gabe und menschlicher Inbesitznahme einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt gut verständlich und wahrt zugleich die distributive Struktur des Hebräischen. „Erbteil“ ist bibelsprachlich geprägt, aber weiterhin geläufig und im Landzuteilungskontext genauer als das allgemeinere „Erbe“.
