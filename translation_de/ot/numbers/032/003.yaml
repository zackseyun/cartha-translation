lexical_decisions:
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Ortsname; nach der hebräischen Form in einer im Deutschen gut lesbaren Umschrift wiedergegeben.
- source_word: דִיבֹן
  choice: Dibon
  rationale: Ortsname; in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: יַעְזֵר
  choice: Jaser
  rationale: Ortsname; deutsche biblische Umschrift mit J für den anlautenden hebräischen Konsonanten und s für ז.
- source_word: נִמְרָה
  choice: Nimra
  rationale: Die hier stehende Kurzform des Ortsnamens wird beibehalten und nicht an Bet-Nimra angeglichen.
- source_word: חֶשְׁבּוֹן
  choice: Heschbon
  rationale: Konventionelle deutsche Wiedergabe des Ortsnamens; sch bildet שׁ ab.
- source_word: אֶלְעָלֵה
  choice: Elale
  rationale: Lesbare deutsche Umschrift des Ortsnamens ohne künstliche Wiedergabe des schwach hörbaren Kehllauts.
- source_word: שְׂבָם
  choice: Sebam
  rationale: Folgt der in diesem Vers überlieferten Form שׂבם; verwandte Namensformen werden nicht in den Haupttext harmonisiert.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: בְּעֹן
  choice: Beon
  rationale: Gibt die hier überlieferte Kurzform wieder, ohne sie zu Baal-Meon zu erweitern.
- source_word: וְ / וּ
  choice: Kommas mit abschließendem „und“
  rationale: Natürliches modernes Deutsch für eine Ortsliste; die syntaktische Reihung und das abschließende Bindewort bleiben erkennbar.
