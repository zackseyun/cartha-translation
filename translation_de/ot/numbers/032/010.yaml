  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּשָּׁבַ֖ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: de
  text: 'Da entbrannte an jenem Tag der Zorn Jahwes[a], und er schwor:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; die genaue antike Aussprache ist nicht sicher. Traditionell wird der Name auch mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte … der Zorn
  rationale: Die feste hebräische Wendung verbindet חרה („heiß werden, entbrennen“) mit אַף, das hier idiomatisch „Zorn“ bezeichnet. „Der Zorn entbrannte“ bewahrt das Hitze- beziehungsweise Feuermotiv und klingt im Deutschen natürlich und würdig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname JHWH wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen verbreitete wissenschaftliche Umschrift.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist eine natürliche deutsche Wiedergabe der bestimmten Zeitangabe und verweist auf den im Zusammenhang genannten Tag.
- source_word: וַיִּשָּׁבַע
  choice: er schwor
  rationale: Der Nifal von שבע bezeichnet das Schwören beziehungsweise Ablegen eines Eides. „Er schwor“ ist knapp und entspricht der direkten Erzählweise des Hebräischen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv „sagend/indem er sprach“ führt den Inhalt des Schwurs im folgenden Vers ein. Im modernen Deutschen übernimmt ein Doppelpunkt diese Funktion natürlicher als die formelhafte Wiedergabe „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersatzlesung „der HERR“ würde ihn durch einen Titel ersetzen. Die genaue antike Aussprache ist nicht vollständig gesichert und wird deshalb in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „Da entbrannte …“ bildet die erzählerische Folge ab. Der Doppelpunkt kündigt den im nächsten Vers folgenden Wortlaut des Schwurs an.
