  text: בְּנֽוּ לָ/כֶ֤ם עָרִים֙ לְ/טַפְּ/כֶ֔ם וּ/גְדֵרֹ֖ת לְ/צֹנַאֲ/כֶ֑ם וְ/הַ/יֹּצֵ֥א מִ/פִּי/כֶ֖ם תַּעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: de
  text: Baut euch Städte für eure kleinen Kinder und Pferche für eure Herden, und tut, was ihr versprochen habt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und tut, was aus eurem Mund hervorgegangen ist“; gemeint ist, dass sie ihr gegebenes Wort einhalten sollen.'
    reason: literal_rendering
lexical_decisions:
- source_word: בְּנוּ לָכֶם
  choice: Baut euch
  rationale: Der Imperativ Plural von בנה wird direkt mit „Baut“ wiedergegeben; der Dativ „euch“ bringt die praktische Bedeutung von לָכֶם natürlich zum Ausdruck.
- source_word: עָרִים לְטַפְּכֶם
  choice: Städte für eure Kinder
  rationale: עָרִים bezeichnet Städte oder Ortschaften. טַף meint vor allem die kleinen Kinder; im natürlichen modernen Deutsch gibt „Kinder“ den familiären Bezug klar wieder.
- source_word: וּגְדֵרֹת לְצֹנַאֲכֶם
  choice: und Pferche für eure Herden
  rationale: גְדֵרֹת sind umzäunte Einfriedungen; im Zusammenhang mit צֹאן ist „Pferche“ die treffende konkrete Bezeichnung. צֹאן bezeichnet kollektiv Kleinvieh, besonders Schafe und Ziegen, und wird idiomatisch mit „Herden“ wiedergegeben.
- source_word: וְהַיֹּצֵא מִפִּיכֶם תַּעֲשׂוּ
  choice: und tut, was ihr versprochen habt
  rationale: 'Wörtlich heißt die hebräische Wendung: „und was aus eurem Mund hervorgegangen ist, sollt ihr tun“. Im Kontext bezeichnet sie das Einhalten des zuvor gegebenen Wortes; „was ihr versprochen habt“ vermittelt diese idiomatische Bedeutung klar.'
