id: NUM.32.27
reference: Numbers 32:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: de
  text: Doch deine Diener werden hinüberziehen, jeder zum Kriegsdienst Gerüstete[a], vor Jahwe[b] in den Kampf[c], so wie mein Herr es sagt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jeder für den Heeresdienst Ausgerüstete«; auch »jeder Bewaffnete« ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: »Vor Jahwe« kann hier zugleich das Handeln in seiner Gegenwart und unter seiner Autorität bezeichnen.
    reason: cultural_note
  - marker: c
    text: 'Oder: »zum Krieg« beziehungsweise »zur Schlacht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: Doch deine Diener
  rationale: עֶבֶד bezeichnet hier in der ehrerbietigen Selbstbezeichnung gegenüber Mose »Diener«. Das Waw führt eine kontrastierende Fortsetzung ein und wird daher mit »Doch« wiedergegeben.
- source_word: יַעַבְרוּ
  choice: werden hinüberziehen
  rationale: עבר bezeichnet hier das Überschreiten der Grenze beziehungsweise des Jordans zum Feldzug. »Hinüberziehen« bewahrt sowohl die Bewegung als auch den militärischen Zusammenhang.
- source_word: כָּל חֲלוּץ צָבָא
  choice: jeder zum Kriegsdienst Gerüstete
  rationale: 'כָּל ist mit der singularischen Form distributiv: »jeder«. חֲלוּץ צָבָא bezeichnet einen für den militärischen Einsatz ausgerüsteten beziehungsweise bewaffneten Mann; die gewählte Formulierung hält diese Bedeutungsbreite offen.'
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet »vor/in der Gegenwart von«. »Vor Jahwe« bewahrt die knappe räumlich-theologische Formulierung und gibt den Gottesnamen als Jahwe wieder.
- source_word: לַמִּלְחָמָה
  choice: in den Kampf
  rationale: Die Präposition לְ kann hier Richtung oder Zweck ausdrücken. »In den Kampf« ist natürliches Deutsch und wahrt den Zug zum militärischen Einsatz.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: so wie mein Herr es sagt
  rationale: כַּאֲשֶׁר drückt Übereinstimmung aus. אֲדֹנִי ist hier die respektvolle Anrede Moses, nicht ein Gottestitel; das Partizip דֹּבֵר verweist auf seine gegenwärtige Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לִפְנֵי יְהוָה im Feldzug
  choice: vor Jahwe
  alternative: in der Gegenwart Jahwes / unter Jahwes Führung
  rationale: Die wörtlich-nahe Fassung bewahrt sowohl den Gedanken der Gegenwart als auch der Autorität Jahwes, ohne eine dieser theologischen Nuancen allein festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ehrerbietige Selbstbezeichnung »deine Diener« und die Anrede »mein Herr« bleiben erhalten; »Jahwe« wird klar von der menschlichen Anrede an Mose unterschieden.
