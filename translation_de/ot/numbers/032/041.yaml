  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: de
  text: Jair, der Sohn Manasses, ging und eroberte ihre Dörfer[a]. Er nannte sie Hawwot-Jair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hawwot-Jair bedeutet „Dörfer Jairs“ oder „Siedlungen Jairs“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: Jaïr
  rationale: Eingebürgerte deutsche Umschrift des Personennamens; die Trema-Schreibung verdeutlicht die getrennte Aussprache der Vokale.
- source_word: בֶּן מְנַשֶּׁה
  choice: der Sohn Manasses
  rationale: Gibt die hebräische Konstruktverbindung wörtlich und in natürlichem Deutsch wieder; eine weitere Bedeutung als Nachkomme wird nicht in den Text eingetragen.
- source_word: הָלַךְ
  choice: zog aus
  rationale: Im Zusammenhang einer Eroberung gibt diese Wendung die zielgerichtete Bewegung natürlicher wieder als das bloße „ging“, ohne ein zusätzliches Ziel zu benennen.
- source_word: וַיִּלְכֹּד
  choice: eroberte
  rationale: Das Verb bezeichnet hier im militärisch-territorialen Zusammenhang das Einnehmen von Siedlungen.
- source_word: חַוֺּתֵיהֶם
  choice: ihre Dörfer
  rationale: Bezeichnet kleine, wohl unbefestigte Siedlungen; „Dörfer“ ist die verständlichste moderne deutsche Entsprechung.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: Er nannte sie
  rationale: קרא mit direktem Objekt bezeichnet hier die Benennung und wird im Deutschen idiomatisch mit „nennen“ wiedergegeben.
- source_word: חַוֺּת יָאִיר
  choice: Hawwot-Jaïr
  rationale: Die Verbindung fungiert als Ortsname und wird daher umschrieben; ihre transparente Bedeutung wird in der Fußnote erklärt.
theological_decisions: []
