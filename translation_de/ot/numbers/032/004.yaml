  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: de
  text: Das Land, das Jahwe vor der Gemeinde Israels[a] geschlagen hat, eignet sich für Viehhaltung[b], und deine Diener haben Vieh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor der Versammlung Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »ist ein Land für Vieh«; der hebräische Begriff umfasst Vieh allgemein und nicht nur Rinder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: Das Land
  rationale: אֶרֶץ bezeichnet hier das konkrete Gebiet; der bestimmte Artikel wird bewahrt.
- source_word: הִכָּה
  choice: geschlagen hat
  rationale: נכה bezeichnet ein Schlagen und im militärischen Zusammenhang auch das Besiegen. Die relativ formale Wiedergabe bewahrt die auffällige Aussage über das Land, ohne das Objekt stillschweigend in dessen Bewohner umzudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: לִפְנֵי עֲדַת יִשְׂרָאֵל
  choice: vor der Gemeinde Israel
  rationale: לִפְנֵי bedeutet hier »vor« beziehungsweise »im Beisein von«; עֵדָה bezeichnet die versammelte Gemeinschaft Israels.
- source_word: אֶרֶץ מִקְנֶה
  choice: eignet sich für Viehhaltung
  rationale: Die knappe hebräische Fügung charakterisiert das Land als für Vieh geeignet. Die deutsche Formulierung gibt diese Beziehung natürlich wieder.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: und deine Diener haben Vieh
  rationale: Das לְ drückt hier Besitz aus. »Deine Diener« wahrt die höfliche Selbstbezeichnung der Sprecher gegenüber Mose.
- source_word: מִקְנֶה
  choice: Vieh
  rationale: מִקְנֶה ist ein Sammelbegriff für gehaltene Nutztiere und nicht auf Rinder beschränkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als Eigenname erhält diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Objekt des göttlichen Schlagens
  choice: das Land … geschlagen hat
  alternative: dessen Bewohner Jahwe … besiegt hat
  rationale: Der Wortlaut nennt הָאָרֶץ als Bezugswort des Relativsatzes. Obwohl militärisch wohl die Niederwerfung der Bewohner beziehungsweise Herrscher gemeint ist, wird diese metonymische Spannung nicht im Haupttext aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung, dass Jahwe das Land »geschlagen« habe, bleibt aus Gründen der Quellennähe erhalten; die Eignung zur Viehhaltung wird dagegen idiomatisch ausgedrückt.
