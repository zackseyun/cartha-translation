  text: וְ/נֹ֣בַח הָלַ֔ךְ וַ/יִּלְכֹּ֥ד אֶת קְנָ֖ת וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יִּקְרָ֧א לָ֦/ה נֹ֖בַח בִּ/שְׁמֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: de
  text: Und Nobach zog hin, nahm Kenat und die dazugehörigen Ortschaften[a] ein und nannte die Stadt nach seinem eigenen Namen Nobach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Töchter“; damit sind kleinere, von Kenat abhängige Ortschaften gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: Nobach
  rationale: Hebräischer Personenname; in einer im Deutschen gut lesbaren, quellennahen Form wiedergegeben. Dieselbe Form bleibt bei der Benennung der Stadt erhalten.
- source_word: הָלַךְ
  choice: zog hin
  rationale: Das Bewegungsverb bezeichnet hier den Aufbruch beziehungsweise Zug Nobachs; „zog hin“ passt natürlich in den erzählenden Eroberungskontext, ohne ein zusätzliches Ziel einzutragen.
- source_word: וַיִּלְכֹּד
  choice: nahm … ein
  rationale: לכד bezeichnet im militärischen Zusammenhang das Erobern oder Einnehmen einer Stadt; „nahm … ein“ ist dafür die natürliche deutsche Wendung.
- source_word: קְנָת
  choice: Kenat
  rationale: Ortsname; nach dem Hebräischen transliteriert.
- source_word: בְּנֹתֶיהָ
  choice: die dazugehörigen Ortschaften
  rationale: Wörtlich „ihre Töchter“; gemeint sind von Kenat abhängige kleinere Siedlungen. Die Wiedergabe vermittelt das Verhältnis, ohne die Größe dieser Orte unnötig festzulegen.
- source_word: וַיִּקְרָא לָהּ
  choice: nannte die Stadt
  rationale: קרא mit ל bezeichnet hier die Namensgebung. Das feminine Pronomen bezieht sich auf die Stadt; „die Stadt“ macht diesen im Deutschen sonst schwer erkennbaren Bezug klar.
- source_word: בִּשְׁמוֹ
  choice: nach seinem eigenen Namen
  rationale: Die Wendung besagt, dass die Stadt den Namen ihres Eroberers erhielt. „eigenen“ verdeutlicht den Rückbezug auf Nobach.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzfolge des Hebräischen bleibt erkennbar, während idiomatische deutsche Wendungen wie „nahm … ein“ und „nannte die Stadt“ verwendet werden.
