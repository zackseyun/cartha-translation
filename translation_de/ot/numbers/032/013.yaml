id: NUM.32.13
reference: Numbers 32:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: de
  text: Da entbrannte Yahwehs Zorn über Israel[a], und er ließ sie vierzig Jahre lang in der Wüste umherziehen[b], bis die ganze Generation, die getan hatte, was in Yahwehs Augen böse war, vergangen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da wurde Yahweh zornig auf Israel.« Wörtlich steht im Hebräischen eine bildhafte Wendung vom Brennen des Zorns.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und er ließ sie vierzig Jahre lang in der Wüste umherirren.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: Da entbrannte Yahwehs Zorn
  rationale: Bewahrt das hebräische Bild vom »Brennen« des Zorns und klingt zugleich natürlich und würdig auf Deutsch.
- source_word: בְּיִשְׂרָאֵל
  choice: über Israel
  rationale: Im Deutschen ist »Zorn über jemanden« eine idiomatische Wiedergabe für das Ziel des göttlichen Zorns.
- source_word: וַיְנִעֵם
  choice: er ließ sie … umherziehen
  rationale: Gibt die kausative Verbform wieder, ohne unnötig eine konkrete Art der Bewegung festzulegen.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Die geläufige deutsche Wiedergabe im Kontext der Wüstenwanderung; sie bezeichnet hier das unbewohnte Wüstenland.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: Natürliche deutsche Zeitangabe, die die Dauer deutlich ausdrückt.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: bis die ganze Generation … vergangen war
  rationale: תֹּם bezeichnet das vollständige Zu-Ende-Gehen; »vergangen war« vermittelt im Zusammenhang das Verschwinden beziehungsweise Sterben der Generation, ohne es stärker auszudeuten.
- source_word: הָעֹשֶׂה הָרַע
  choice: die getan hatte, was … böse war
  rationale: Überträgt das singularische Partizip passend zur kollektiven Bezeichnung »Generation« und gibt הָרַע idiomatisch wieder.
- source_word: בְּעֵינֵי יְהוָה
  choice: in Yahwehs Augen
  rationale: Bewahrt die hebräische Bewertungsmetapher in einer verständlichen deutschen Wendung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Darstellung des göttlichen Zorns
  choice: Yahwehs Zorn entbrannte über Israel
  alternative: Yahweh wurde zornig auf Israel
  rationale: Die gewählte Fassung erhält das starke hebräische Bild des brennenden Zorns, ohne zusätzliche theologische Deutung.
- issue: Göttliche Verursachung der Wüstenwanderung
  choice: er ließ sie … umherziehen
  alternative: er brachte sie dazu, … umherzuirren
  rationale: Die kausative Bedeutung bleibt erhalten; zugleich wird nicht über den Wortlaut hinaus erklärt, auf welche Weise Gott dies bewirkte.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Bildsprache des hebräischen Textes und die kausative Aussage über Yahwehs Handeln bleiben erhalten.
