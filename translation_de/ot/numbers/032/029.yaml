source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: de
  text: 'Und Mose sagte zu ihnen: »Wenn die Söhne Gads und die Söhne Rubens mit euch über den Jordan ziehen, jeder zum Kampf gerüstet vor Jahwe, und das Land vor euch unterworfen worden ist, dann sollt ihr ihnen das Land Gilead als Besitz geben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und ... sagte
  rationale: Gibt den erzählenden Wayyiqtol-Anschluss natürlich und quellennah wieder.
- source_word: אִם
  choice: Wenn
  rationale: Bewahrt den echten Bedingungssatz, von dessen Erfüllung die Landzuteilung abhängt.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: die Söhne Gads und die Söhne Rubens
  rationale: Erhält die formale hebräische Stammes- und Verwandtschaftsbezeichnung, ohne sie zu modernisieren.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: über den Jordan ziehen
  rationale: Ist im Deutschen für einen gemeinsamen militärischen Übergang idiomatisch und entspricht עבר mit direktem Objekt.
- source_word: אִתְּכֶם
  choice: mit euch
  rationale: Gibt die schlichte Begleitung ohne interpretierende Erweiterung wieder.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: jeder zum Kampf gerüstet
  rationale: חָלוּץ bezeichnet hier jeden ausgerüsteten beziehungsweise kampfbereiten Mann; die knappe deutsche Form bewahrt den distributiven Sinn von כָּל.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Bewahrt sowohl die räumlich-theologische Wendung »vor« als auch den als Eigennamen gebrauchten Gottesnamen.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: und das Land ... unterworfen wird
  rationale: Gibt den passiven Sinn des Niphal wieder und bezeichnet die Erlangung der Herrschaft, ohne Vernichtung zu unterstellen.
- source_word: לִפְנֵיכֶם
  choice: vor euch
  rationale: Erhält das wiederholte hebräische Idiom und bezieht die Unterwerfung auf Israels Vorrücken.
- source_word: וּנְתַתֶּם לָהֶם
  choice: dann sollt ihr ihnen ... geben
  rationale: »Dann« verdeutlicht im Deutschen den Nachsatz der Bedingung; »sollt« gibt die verbindliche Anweisung wieder.
- source_word: אֶרֶץ הַגִּלְעָד לַאֲחֻזָּה
  choice: das Land Gilead als Besitz
  rationale: אֲחֻזָּה meint einen dauerhaft zugewiesenen Landbesitz; »Besitz« ist knapp und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. »Jahwe« gibt ihn im modernen deutschen Bibelgebrauch als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von »vor Jahwe« im Kriegszusammenhang
  choice: Die offene Formulierung »vor Jahwe« bleibt erhalten.
  alternative: unter Jahwes Führung / im Auftrag Jahwes
  rationale: Der hebräische Ausdruck kann Gegenwart, Verantwortlichkeit und religiös verstandenes Handeln anklingen lassen. Eine erklärende Umschreibung würde diese Spannung einseitig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennaher Satzstruktur. Die Wiederholung »die Söhne ... und die Söhne ...« sowie zweimal »vor« wurde bewusst bewahrt. Keine Fußnoten erforderlich.
