  naturalness: Die Formulierung ist würdiges, modernes Standarddeutsch. „Unterworfen worden ist“ ist hier zwar etwas formeller, aber als präzise Wiedergabe der abgeschlossenen passiven Bedingung klar und gut lesbar.
  terminology: „Jahwe“ gibt יהוה angemessen als Eigennamen wieder. „Zum Kampf gerüstet“, „vor Jahwe“ und „als Besitz“ sind sachgerecht; insbesondere lässt „vor Jahwe“ die Bedeutungsoffenheit des hebräischen Ausdrucks bestehen.
