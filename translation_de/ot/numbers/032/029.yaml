  to: 'Und Mose sagte zu ihnen: »Wenn die Söhne Gads und die Söhne Rubens mit euch über den Jordan ziehen, jeder zum Kampf gerüstet vor Jahwe, und das Land vor euch unterworfen worden ist, dann sollt ihr ihnen das Land Gilead als Besitz geben.«'
  rationale: Nur die deutsche Verbform im zweiten Glied des Bedingungssatzes wurde zu „unterworfen worden ist“ geändert. Damit bleibt der passive Charakter erhalten und die Unterwerfung des Landes wird eindeutig als erfüllte Voraussetzung der anschließenden Landzuteilung wiedergegeben.
