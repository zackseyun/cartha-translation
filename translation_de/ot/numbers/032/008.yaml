  text: כֹּ֥ה עָשׂ֖וּ אֲבֹתֵי/כֶ֑ם בְּ/שָׁלְחִ֥/י אֹתָ֛/ם מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לִ/רְא֥וֹת אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/008.yaml
  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: de
  text: So handelten eure Väter, als ich sie von Kadesch-Barnea sandte, um das Land zu sehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um das Land zu besichtigen“ oder „zu erkunden“. Wörtlich: „um das Land zu sehen“; im Zusammenhang geht es um die Erkundung des Landes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה עָשׂוּ
  choice: Genauso haben es ... gemacht
  rationale: כֹּה verweist vergleichend auf das Verhalten der früheren Generation. „Genauso“ stellt den Bezug zur gegenwärtigen Situation natürlich her; „haben es gemacht“ gibt עָשׂוּ schlicht wieder.
- source_word: אֲבֹתֵיכֶם
  choice: eure Väter
  rationale: Bewahrt die konkrete generationale Ausdrucksweise des Hebräischen. „Vorfahren“ wäre möglich, würde den Bezug auf die unmittelbar vorherige Generation aber abschwächen.
- source_word: בְּשָׁלְחִי אֹתָם
  choice: als ich sie ... aussandte
  rationale: Die Präposition ב mit Infinitivus constructus und Suffix hat hier temporale Bedeutung. „Aussandte“ passt idiomatisch zu einem Auftrag zur Erkundung.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: von Kadesch-Barnea
  rationale: Der Ortsname wird nach üblicher deutscher biblischer Schreibweise transliteriert.
- source_word: לִרְאוֹת אֶת הָאָרֶץ
  choice: um das Land zu erkunden
  rationale: ראה bedeutet wörtlich „sehen“; im Zusammenhang bezeichnet es das auftragsgemäße Besichtigen beziehungsweise Erkunden des Landes. Die Fußnote wahrt die wörtliche Bedeutung und mögliche Nuancen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Eure Väter“ bewahrt den Generationenbezug; „erkunden“ gibt die kontextuelle Funktion wieder, ohne die stärker militärisch gefärbte Deutung „ausspionieren“ festzuschreiben.
