  text: וְ/אֶת נְב֞וֹ וְ/אֶת בַּ֧עַל מְע֛וֹן מֽוּסַבֹּ֥ת שֵׁ֖ם וְ/אֶת שִׂבְמָ֑ה וַ/יִּקְרְא֣וּ בְ/שֵׁמֹ֔ת אֶת שְׁמ֥וֹת הֶ/עָרִ֖ים אֲשֶׁ֥ר בָּנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: de
  text: und Nebo[a], Baal-Meon – mit geänderten Namen – und Sibma. Und sie gaben den Städten, die sie gebaut hatten, Namen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe hebräische Wendung kann auch mit „deren Namen geändert worden waren“ wiedergegeben werden. Sie bezieht sich wahrscheinlich auf Nebo und Baal-Meon; ihre genaue syntaktische Anbindung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוֹ
  choice: Nebo
  rationale: Eigenname eines Ortes; in geläufiger deutscher Form wiedergegeben.
- source_word: בַּעַל מְעוֹן
  choice: Baal-Meon
  rationale: Zusammengesetzter Ortsname; der Bindestrich macht seine Bestandteile lesbar.
- source_word: מוּסַבֹּת שֵׁם
  choice: '[a] Namensänderung in einer Fußnote'
  rationale: Die knappe hebräische Partizipialfügung bezeichnet wahrscheinlich geänderte Namen und bezieht sich wohl auf Nebo und Baal-Meon; ihre genaue syntaktische Anbindung bleibt jedoch unsicher.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Eigenname eines Ortes; nahe Umschrift in deutscher Form.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת אֶת שְׁמוֹת הֶעָרִים
  choice: sie gaben den Städten … Namen
  rationale: Natürliches Deutsch für die hebräische Benennungsformel, ohne den Sinn zu erweitern.
- source_word: אֲשֶׁר בָּנוּ
  choice: die sie gebaut hatten
  rationale: בנה bedeutet gewöhnlich »bauen«; das Plusquamperfekt verdeutlicht, dass das Bauen der Namensgebung vorausging, ohne »wiederaufbauen« einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt knapp; die syntaktisch unsichere Bemerkung über die geänderten Namen wird in die Fußnote verlegt, damit die Ambiguität nicht durch eine glatte Haupttextlösung verdeckt wird.
