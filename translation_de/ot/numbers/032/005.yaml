source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִם מָצָ֤אנוּ חֵן֙ בְּ/עֵינֶ֔י/ךָ יֻתַּ֞ן אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לַ/עֲבָדֶ֖י/ךָ לַ/אֲחֻזָּ֑ה אַל תַּעֲבִרֵ֖/נוּ אֶת הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: de
  text: 'Sie sagten: „Wenn wir Gunst in deinen Augen gefunden haben, soll dieses Land deinen Dienern als Besitz gegeben werden. Führe uns nicht über den Jordan.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass uns den Jordan nicht überqueren.“ Das hebräische Verb steht in einer Kausativform und lässt sich hier mit mehreren eng verwandten Formulierungen wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: wenn wir Gunst in deinen Augen gefunden haben
  rationale: Die geläufige hebräische Wendung für wohlwollende Annahme bleibt in ihrer Bildlichkeit erhalten und ist auch im heutigen Deutsch verständlich.
- source_word: יֻתַּן
  choice: soll ... gegeben werden
  rationale: Die passive Form mit aufforderndem beziehungsweise bittendem Sinn wird bewahrt; die Formulierung passt zu einer höflichen Bitte.
- source_word: הָאָרֶץ הַזֹּאת
  choice: dieses Land
  rationale: „Land“ ist im Zusammenhang mit einem Siedlungsgebiet die direkte und natürliche Entsprechung.
- source_word: לַעֲבָדֶיךָ
  choice: deinen Dienern
  rationale: עבד dient hier als ehrerbietige Selbstbezeichnung der Bittsteller. „Diener“ gibt dies in modernem Deutsch wieder, ohne unnötig den Status von Sklaven in den Vordergrund zu rücken.
- source_word: לַאֲחֻזָּה
  choice: als Besitz
  rationale: אֲחֻזָּה bezeichnet einen bleibenden Landbesitz beziehungsweise eine Besitzung. „Als Besitz“ ist knapp und überlädt den Ausdruck nicht mit dem spezielleren Begriff „Erbe“.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: Führe uns nicht über den Jordan
  rationale: 'Die Kausativform von עבר wird mit „führen“ wiedergegeben: Mose soll nicht veranlassen, dass sie den Jordan überschreiten. Die Formulierung vermeidet zugleich die im Deutschen missverständliche Redewendung „jemanden über den Jordan bringen“.'
