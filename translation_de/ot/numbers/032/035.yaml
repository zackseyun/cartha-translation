lexical_decisions:
- source_word: וְאֶת / וְ
  choice: und
  rationale: Die Konjunktion וְ verbindet die Ortsnamen in der Aufzählung. Der direkte Objektmarker אֶת hat im Deutschen keine eigene Entsprechung und bleibt unübersetzt.
- source_word: עַטְרֹת שׁוֹפָן
  choice: Atrot-Schofan
  rationale: Der zusammengesetzte Ortsname wird nach geläufigen deutschen Umschriftkonventionen wiedergegeben und nicht übersetzt.
- source_word: יַעְזֵר
  choice: Jaser
  rationale: Der Ortsname wird in einer im Deutschen üblichen und gut lesbaren Form transkribiert; deutsches J entspricht dabei dem hebräischen Jod-Laut.
- source_word: יָגְבֳּהָה
  choice: Jogboha
  rationale: Der Ortsname wird nach geläufiger deutscher Umschrift wiedergegeben; die Form wahrt die Identität des Ortes, ohne eine unsichere Namensbedeutung einzutragen.
