  text: וְ/אֶת בֵּ֥ית נִמְרָ֖ה וְ/אֶת בֵּ֣ית הָרָ֑ן עָרֵ֥י מִבְצָ֖ר וְ/גִדְרֹ֥ת צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: de
  text: und Bet-Nimra und Bet-Haran, befestigte Städte[a], sowie Schafhürden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Städte der Befestigung; auch: Festungsstädte.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: Einfriedungen für Schafe oder Pferche für Kleinvieh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: Bet-Nimra
  rationale: Der Ortsname wird nach üblicher deutscher Bibelnamenschreibung transliteriert; בֵּית bleibt als Bestandteil des Namens „Bet-“ erhalten und wird nicht als „Haus“ übersetzt.
- source_word: בֵּית הָרָן
  choice: Bet-Haran
  rationale: Der Ausdruck ist ein Ortsname und wird daher transliteriert, statt als „Haus Harans“ wiedergegeben zu werden.
- source_word: עָרֵי מִבְצָר
  choice: befestigte Städte
  rationale: Die Konstruktverbindung bezeichnet Städte mit Verteidigungsanlagen. „Befestigte Städte“ ist im modernen Deutsch natürlich und bewahrt den militärisch-defensiven Sinn.
- source_word: גִדְרֹת צֹאן
  choice: Schafhürden
  rationale: Die Wendung bezeichnet umfriedete Plätze für Schafe beziehungsweise Kleinvieh. „Schafhürden“ ist eine knappe, im Zusammenhang passende Wiedergabe.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: und ... und ... sowie
  rationale: Die wiederholten Konjunktionen führen die Aufzählung aus dem vorherigen Vers weiter. Das unübersetzbare Akkusativzeichen אֵת wird nicht eigens wiedergegeben; „sowie“ vermeidet am Listenende eine schwerfällige Häufung von „und“.
