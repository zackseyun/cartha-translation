  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Frage und der scharfe Gegensatz zwischen dem Kriegseinsatz der übrigen Stämme und dem Zurückbleiben Gads und Rubens bleiben erhalten.
