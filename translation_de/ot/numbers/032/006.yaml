  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: de
  text: 'Mose aber sagte zu den Söhnen Gads und den Söhnen Rubens: »Sollen eure Brüder in den Krieg ziehen, während ihr hier sitzen bleibt?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »eure Brüder« sind hier die Israeliten aus den übrigen Stämmen gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mose aber sagte
  rationale: Das Waw führt die Erzählung fort; »aber« gibt hier den im Zusammenhang liegenden Einwand natürlich wieder, während »sagte« die Redeeinleitung schlicht bewahrt.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: zu den Söhnen Gads und den Söhnen Rubens
  rationale: Die wörtliche Stammesbezeichnung »Söhne« bleibt erhalten. Die deutschen Genitivformen »Gads« und »Rubens« sind verständlich und würdevoll.
- source_word: הַאַחֵיכֶם
  choice: eure Brüder
  rationale: Die konkrete Verwandtschaftsbezeichnung entspricht dem Hebräischen; im Zusammenhang sind die Männer der übrigen israelitischen Stämme gemeint.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: in den Krieg ziehen
  rationale: Die Verbindung ist eine übliche militärische Wendung für das Eintreten in einen Krieg beziehungsweise Feldzug. »In den Krieg ziehen« klingt im Deutschen natürlich und erhält die rhetorische Schärfe der Frage.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: während ihr hier sitzen bleibt
  rationale: »Sitzen bleiben« bewahrt die konkrete Bildsprache von ישב und drückt zugleich das untätige Zurückbleiben im Kontrast zum Kriegsdienst der anderen aus.
theological_decisions: []
