  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: de
  text: Der Mann Mose war sehr demütig[a], demütiger als jeder andere Mensch auf der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sanftmütig; das hebräische Wort kann auch „niedrig“ oder „gebeugt“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הָ/אִישׁ מֹשֶׁה
  choice: Der Mann Mose aber
  rationale: הָאִישׁ wird entsprechend der markierten hebräischen Form als „der Mann“ wiedergegeben. Das nachgestellte „aber“ lässt das Waw als kontextuellen Anschluss erkennen und passt zum eingeschobenen Charakterhinweis, ohne ein zeitliches „nun“ einzutragen.
- source_word: ענו
  choice: demütig
  rationale: Das Adjektiv beschreibt hier am ehesten Moses Haltung bzw. Wesen. „Sanftmütig“ ist ebenfalls möglich, kann aber stärker auf Milde im Verhalten eingeengt verstanden werden; „gebeugt“ würde eher äußere Bedrängnis nahelegen.
- source_word: מְאֹד
  choice: sehr
  rationale: Natürliche Wiedergabe des hebräischen Intensivierungsadverbs.
- source_word: מִ/כֹּל הָאָדָם
  choice: mehr als jeder Mensch
  rationale: Die Vergleichskonstruktion מן + כל wird im Deutschen idiomatisch mit „mehr als jeder“ wiedergegeben. אָדָם ist hier generisch und bezeichnet einen Menschen unabhängig vom Geschlecht.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: auf der ganzen Erde
  rationale: Die hebräische Wendung bedeutet wörtlich „der auf der Oberfläche des Erdbodens [ist]“. Die kompakte deutsche Form bewahrt den universalen Umfang des Vergleichs und klingt natürlich.
theological_decisions:
- issue: Bedeutung von ענו als Charakterisierung Moses
  choice: demütig
  alternative: sanftmütig; gebeugt
  rationale: „Demütig“ gibt die hier wahrscheinlich gemeinte innere Haltung wieder, ohne Schwäche zu unterstellen. Da das Wort auch mit Niedrigkeit bzw. Bedrängnis verbunden sein kann und traditionell „sanftmütig“ übersetzt wird, wird diese Bedeutungsbreite in der Fußnote kenntlich gemacht.
- issue: Generischer Bezug von הָאָדָם
  choice: jeder Mensch
  alternative: jeder Mann
  rationale: אָדָם bezeichnet in dieser Vergleichsaussage Menschen allgemein. „Mensch“ bildet diesen generischen Umfang im heutigen Deutschen präziser ab, ohne den Text auf männliche Personen zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung erhält „der Mann Mose“ als auffällige hebräische Bezeichnung; „aber“ markiert den narrativen Anschluss. Die Vergleichsformulierung ist bewusst knapp und allgemeinverständlich.
