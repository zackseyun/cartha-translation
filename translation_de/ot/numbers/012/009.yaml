base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: de
  text: Da entbrannte Jahwes Zorn gegen sie[a], und er ging fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jahwes Nase wurde heiß gegen sie“; eine hebräische Redewendung dafür, dass sein Zorn entbrannte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר
  choice: entbrannte
  rationale: Das Verb חרה beschreibt im Zornesidiom ein Heiß- oder Brennendwerden. „Entbrannte“ bewahrt dieses Bild und klingt im Deutschen natürlich.
- source_word: אַף
  choice: Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet zusammen mit חרה jedoch idiomatisch den Zorn. „Zorn“ passt zum würdevollen Erzählregister und zur Intensität des Ausdrucks.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: בָּם
  choice: gegen sie
  rationale: Die Präposition bezeichnet hier die Personen, gegen die sich der göttliche Zorn richtet.
- source_word: וַיֵּלַךְ
  choice: er ging fort
  rationale: הלך bedeutet grundsätzlich „gehen“; im Zusammenhang bezeichnet es Jahwes Weggehen beziehungsweise seinen Rückzug. „Ging fort“ gibt dies klar wieder, ohne mehr auszudeuten als der hebräische Text.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Art von Jahwes Weggehen
  choice: er ging fort
  alternative: er zog sich zurück
  rationale: Der Text verwendet das allgemeine Verb הלך. „Er ging fort“ wahrt dessen Offenheit; „er zog sich zurück“ würde den Vorgang stärker interpretieren.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzfolge und das Wärmebild des hebräischen Zornesidioms bleiben erhalten; das wörtliche Körperbild wird in der Fußnote erläutert.
