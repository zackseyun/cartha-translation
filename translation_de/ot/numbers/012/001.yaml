  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: de
  text: Da redeten Mirjam und Aaron gegen Mose wegen der kuschitischen Frau[a], die er genommen hatte[b]; denn er hatte eine kuschitische Frau genommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „äthiopischen Frau“. Im Hebräischen steht „kuschitische Frau“, also eine Frau aus Kusch.'
    reason: lexical_alternative
  - marker: b
    text: „Genommen hatte“ ist eine hebräische Ausdrucksweise, die „geheiratet hatte“ oder „zur Frau genommen hatte“ bedeuten kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר
  choice: Da redeten
  rationale: דבר bezeichnet das Reden; zusammen mit בְּמֹשֶׁה erhält es hier eine gegnerische Bedeutung. Der deutsche Plural folgt dem zusammengesetzten Subjekt, während die auffällige feminine Singularform des Hebräischen nicht ohne Zusatz nachgebildet werden kann.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: Mirjam und Aaron
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Formen und bewahren die hebräische Reihenfolge, in der Mirjam zuerst genannt wird.
- source_word: בְּמֹשֶׁה
  choice: gegen Mose
  rationale: Die Präposition ב bei דבר kann die Person kennzeichnen, gegen die sich feindseliges oder kritisches Reden richtet. „Gegen Mose“ gibt diesen Kontext knapp wieder.
- source_word: עַל אֹדוֹת
  choice: wegen
  rationale: Die Wendung bezeichnet hier den Anlass oder Grund des Redens. „Wegen“ ist natürliches modernes Deutsch und erhält die kausale Bedeutung.
- source_word: הָאִשָּׁה
  choice: der Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. „Frau“ wahrt die lexikalische Offenheit; die Wendung mit לקח lässt zugleich den ehelichen Zusammenhang erkennen.
- source_word: הַכֻּשִׁית / כֻשִׁית
  choice: kuschitischen / kuschitische
  rationale: Das Adjektiv bezeichnet eine Frau aus Kusch. „Kuschitisch“ ist quellentreu und vermeidet die mögliche anachronistische Gleichsetzung mit dem heutigen Äthiopien.
- source_word: אֲשֶׁר לָקָח
  choice: die er genommen hatte
  rationale: לקח bedeutet wörtlich „nehmen“ und kann im ehelichen Zusammenhang „zur Frau nehmen“ beziehungsweise „heiraten“ heißen. Die wörtlichere Form bewahrt das hebräische Idiom; eine Fußnote erläutert es.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier eine begründende oder erklärende Wiederaufnahme ein. „Denn“ erhält diesen Zusammenhang und passt zum würdigen deutschen Erzählstil.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: er hatte eine kuschitische Frau genommen
  rationale: Die Wiederholung des Hebräischen wird nicht geglättet, sondern zur Wahrung seiner Betonung beibehalten.
theological_decisions:
- issue: Identität und Herkunftsbezeichnung der Frau des Mose
  choice: כֻשִׁית wird als „kuschitisch“ wiedergegeben, ohne die Frau mit Zippora gleichzusetzen oder von ihr zu unterscheiden.
  alternative: „äthiopisch“ als traditionelle Wiedergabe oder eine ausdrückliche harmonisierende Identifikation mit Zippora
  rationale: Der Vers selbst bezeichnet die Frau als Kuschitin. Die Übersetzung bewahrt diese Angabe und entscheidet keine historischen oder harmonisierenden Fragen, die der Wortlaut offenlässt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Wiederholung bleibt erhalten. Die Marker stehen wie im vorgelegten Text unmittelbar nach der betreffenden Wendung; ihre Reihenfolge [b][a] ordnet zuerst die idiomatische Wendung und danach die Herkunftsbezeichnung zu.
