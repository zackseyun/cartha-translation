  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: de
  text: Bitte, lass sie nicht einem Toten gleichen[a], dessen Fleisch zur Hälfte verzehrt ist, wenn er aus dem Mutterleib kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein tot geborenes Kind, dessen Fleisch zur Hälfte verzehrt ist, wenn es aus dem Mutterleib kommt.“ Das Hebräische vergleicht sie mit einem bei der Geburt Toten; manche Übersetzungen machen das Bild der Totgeburt im Haupttext ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Bitte … nicht
  rationale: אַל drückt die Verneinung einer Bitte oder Aufforderung aus; נָא verleiht ihr den dringlichen, flehenden Ton „bitte“.
- source_word: תְהִי
  choice: lass sie … sein
  rationale: Die feminine Singularform bezieht sich im Zusammenhang auf Mirjam. Nach אַל נָא gibt die deutsche Wendung eine flehentliche negative Bitte natürlich wieder.
- source_word: כַּמֵּת
  choice: wie ein Toter
  rationale: Die Formulierung bleibt nahe bei dem allgemeineren hebräischen Vergleich „wie ein Toter“, ohne die im Folgesatz anklingende Totgeburtsvorstellung bereits ausdrücklich festzulegen.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: wenn er aus dem Mutterleib kommt
  rationale: Die Infinitivkonstruktion mit בְּ hat temporalen Sinn. „Aus dem Mutterleib kommt“ bewahrt die anschauliche Ausdrucksweise des Hebräischen.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: dessen Fleisch schon halb verzehrt ist
  rationale: Das passive „verzehrt“ gibt den Zustand des Fleisches idiomatisch wieder; „Fleisch“ bewahrt das konkrete und drastische Bild. „Schon“ verdeutlicht den beim Hervorkommen bestehenden Zustand, ohne den Vergleich inhaltlich umzudeuten.
theological_decisions:
- issue: Bezug der femininen Singularform
  choice: „sie“ bezeichnet Mirjam
  alternative: Das Subjekt unbestimmt lassen
  rationale: Der unmittelbare Zusammenhang macht Mirjam zum Gegenstand von Aarons Bitte; das deutsche Pronomen gibt die grammatische Form des Hebräischen ausdrücklich wieder.
- issue: Totgeburtsbild ausdrücklich benennen
  choice: Im Haupttext den wörtlicheren Vergleich „wie ein Toter“ bewahren
  alternative: „wie ein tot geborenes Kind“
  rationale: Der folgende Relativsatz legt ein bei der Geburt totes Wesen nahe, doch כַּמֵּת selbst sagt lediglich „wie ein Toter“. Die Fußnote macht die plausible explizite Wiedergabe zugänglich, ohne die genuine Bildspannung im Haupttext aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Bitte klingt eindringlich, bleibt aber schlicht. Das drastische körperliche Bild und der Wechsel vom femininen Bezug auf Mirjam zum maskulinen Vergleichsbild bleiben erhalten.
