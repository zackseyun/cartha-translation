id: NUM.12.5
reference: Numbers 12:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: de
  text: Da kam Jahwe in einer Wolkensäule herab und stellte sich an den Eingang des Zeltes.[a] Er rief Aaron und Mirjam, und die beiden traten vor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist im Zusammenhang das Zelt der Begegnung; im Hebräischen steht hier nur „das Zelt“.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „und die beiden gingen hinaus“ oder „kamen heraus“. Gemeint ist hier wahrscheinlich, dass sie auf Jahwes Ruf hin vortraten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: kam … herab
  rationale: Gibt die konkrete Bewegungsangabe von ירד natürlich wieder und bewahrt die theophanische Bildsprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen als in deutscher Standardsprache geläufige Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּעַמּוּד עָנָן
  choice: in einer Wolkensäule
  rationale: Die Präposition bezeichnet hier am ehesten die Erscheinungs- beziehungsweise Begleitform; die unbestimmte Form entspricht der artikellosen hebräischen Wendung.
- source_word: וַיַּעֲמֹד
  choice: stellte sich
  rationale: Im Zusammenhang einer Ankunft am Zelteingang klingt die ingressiv-dynamische Wiedergabe natürlicher als das statische „stand“, ohne den Sinn zu verändern.
- source_word: פֶּתַח הָאֹהֶל
  choice: an den Eingang des Zeltes
  rationale: פתח bezeichnet Eingang oder Öffnung. Der Haupttext bewahrt das schlichte „Zelt“, da hier nicht die volle Bezeichnung „Zelt der Begegnung“ steht.
- source_word: וַיִּקְרָא
  choice: rief
  rationale: Entspricht der üblichen Bedeutung von קרא und passt zur direkten Aufforderung an Aaron und Mirjam.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: Aaron und Mirjam
  rationale: Verwendet die im modernen deutschen Bibelgebrauch üblichen Namensformen.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: die beiden traten vor
  rationale: יצא bedeutet wörtlich „hinausgehen/herauskommen“; im Kontext bezeichnet es wahrscheinlich ihr Hervortreten als Antwort auf den Ruf. שְׁנֵיהֶם wird ausdrücklich mit „die beiden“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname des Ausgangstextes bleibt als Eigenname erkennbar; eine Ersetzung durch den traditionellen Titel würde eine im Hebräischen nicht ausgeschriebene Lesetradition in den Haupttext setzen.
- issue: Anthropomorphe Aussage über Jahwes Herabkommen
  choice: Die konkrete Formulierung „kam … herab“ bleibt erhalten.
  alternative: erschien
  rationale: Der hebräische Text verwendet ausdrücklich das Verb des Herabsteigens. Eine abstraktere Umschreibung würde die theophanische Bildsprache abschwächen.
- issue: Bewegung Aarons und Mirjams nach dem Ruf
  choice: traten vor
  alternative: gingen beide hinaus / kamen beide heraus
  rationale: Die kontextuelle Wiedergabe macht die wahrscheinliche Funktion der Bewegung verständlich, während eine Fußnote die wörtlichere und weiterhin mögliche Lesart bewahrt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Erzählbewegung. Die Satzteilung verbessert die Lesbarkeit, ohne die hebräische Abfolge zu verändern. Der Gottesname wird als „Jahwe“ wiedergegeben; echte lexikalische Mehrdeutigkeit bei יצא wird durch die Fußnote offengehalten.
