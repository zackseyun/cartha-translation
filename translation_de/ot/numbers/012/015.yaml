  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: de
  text: So wurde Mirjam sieben Tage lang außerhalb des Lagers abgesondert, und das Volk brach nicht auf, bis Mirjam wieder aufgenommen wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis Mirjam aufgenommen wurde“. Das hebräische Verb bedeutet „sammeln“ und bezeichnet hier ihre Aufnahme in das Lager nach der Zeit ihrer Absonderung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: wurde … abgesondert
  rationale: Das Nifal von סגר bezeichnet hier einen auferlegten Zustand der Absonderung beziehungsweise Einschließung. „Abgesondert“ ist im Zusammenhang der zeitweiligen Ausweisung aus dem Lager natürlich und vermeidet das missverständliche Bild, Mirjam sei außerhalb des Lagers in einem Gebäude eingeschlossen gewesen.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Die Ortsangabe wird direkt und idiomatisch wiedergegeben; „Lager“ passt zum Wüstenzug Israels.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die deutsche Wendung gibt die bezeichnete Zeitdauer klar und natürlich wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: In diesem Erzählzusammenhang bezeichnet הָעָם die Gemeinschaft Israels; „das Volk“ ist die geläufige und sachlich passende Wiedergabe.
- source_word: לֹא נָסַע
  choice: brach nicht auf
  rationale: נסע bezeichnet in den Wüstenerzählungen häufig das Aufbrechen des Lagers zur Weiterreise. „Aufbrechen“ bewahrt diesen konkreten Reisesinn.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: bis Mirjam wieder aufgenommen wurde
  rationale: Das Nifal von אסף bedeutet wörtlich „gesammelt/zusammengebracht werden“. Hier geht es kontextuell um Mirjams erneute Aufnahme nach ihrer Absonderung. „Wieder aufgenommen“ drückt dies in natürlichem Deutsch aus; die wörtlichere Form bleibt in der Fußnote sichtbar.
