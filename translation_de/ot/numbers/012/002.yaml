  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: de
  text: 'Da sagten sie: »Hat Jahwe wirklich nur durch Mose gesprochen? Hat er nicht auch durch uns gesprochen?«[a] Und Jahwe hörte es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hat Jahwe wirklich nur zu Mose gesprochen? Hat er nicht auch zu uns gesprochen?« Die hebräische Präposition kann sowohl den Empfänger als auch den Vermittler göttlicher Rede bezeichnen.'
    reason: Alternative grammatische Lesart
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Das Wayyiqtol führt die direkte Rede als nächsten Schritt der Erzählung ein; „Da sagten sie“ klingt im modernen Deutschen natürlich und bewahrt den narrativen Zusammenhang.
- source_word: הֲרַק אַךְ
  choice: wirklich nur
  rationale: Die Fragepartikel und die beiden restriktiv-verstärkenden Partikeln formulieren eine zugespitzte rhetorische Frage. „wirklich nur“ gibt sowohl die Bekräftigung als auch den Ausschließlichkeitsanspruch wieder.
- source_word: בְּמֹשֶׁה / בָּנוּ
  choice: durch Mose / durch uns
  rationale: Die Präposition ב kann bei göttlichem Reden sowohl den Empfänger als auch das vermittelnde Werkzeug bezeichnen. Der Zusammenhang des Streits um prophetische Autorität spricht hier eher für „durch“; die mögliche Lesart „zu“ bleibt in der Fußnote erhalten.
- source_word: דִּבֶּר
  choice: gesprochen
  rationale: דבר bezeichnet hier göttliches, offenbarendes Reden. „gesprochen“ ist im Deutschen idiomatisch und wahrt den Bezug auf prophetische Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Und Jahwe hörte es
  rationale: Im Hebräischen bleibt das Gehörte als Objekt unausgesprochen; „es“ bezeichnet im Deutschen natürlich die soeben geäußerte Rede, ohne den Sinn weiter auszudeuten.
theological_decisions:
- issue: Bedeutung der Präposition ב bei דבר
  choice: „durch Mose / durch uns“ als Bezeichnung prophetischer Vermittlung
  alternative: „zu Mose / zu uns“ als Bezeichnung der Empfänger göttlicher Rede
  rationale: Der nähere Zusammenhang betrifft den Anspruch Mirjams und Aarons auf prophetische Autorität neben Mose. Dennoch lässt die hebräische Konstruktion auch die Empfängerlesart zu; deshalb wird diese nicht ausgeschlossen, sondern ausdrücklich in der Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den persönlichen Gottesnamen verwendet, bewahrt die Übersetzung ihn als Namen und ersetzt ihn nicht durch einen Titel.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Schärfe wird durch „wirklich nur“ bewahrt; die knappe Schlussaussage bleibt bewusst ohne erklärenden Zusatz.
