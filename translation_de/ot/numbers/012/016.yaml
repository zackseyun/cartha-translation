  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: de
  text: Danach brach das Volk von Hazerot auf und lagerte in der Wüste Paran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Danach
  rationale: Markiert die zeitliche Abfolge nach den zuvor berichteten Ereignissen; im modernen Deutschen natürlich und präzise.
- source_word: נָסְעוּ
  choice: brach … auf
  rationale: Das Verb נסע bezeichnet in den Wüstenwanderungen häufig das Aufbrechen von einem Lagerplatz; »aufbrechen« gibt dies idiomatisch wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet hier die israelitische Gemeinschaft als Kollektiv; »das Volk« ist die übliche und kontextgerechte Wiedergabe.
- source_word: מֵחֲצֵרוֹת
  choice: von Hazerot
  rationale: Der Ortsname wird in einer im Deutschen gebräuchlichen, quellennahen Form transliteriert.
- source_word: וַיַּחֲנוּ
  choice: und lagerte
  rationale: חנה bedeutet, ein Lager aufzuschlagen beziehungsweise zu lagern. Der Singular entspricht dem deutschen Kollektivsubjekt »das Volk«.
- source_word: בְּמִדְבַּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Weide- oder Wüstenland; »Wüste« ist im Deutschen die geläufige biblische Wiedergabe.
- source_word: פָּארָן
  choice: Paran
  rationale: Der Ortsname wird nach etablierter deutscher Schreibweise transliteriert.
