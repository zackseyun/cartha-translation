source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: de
  text: 'Da sagte Jahwe plötzlich zu Mose, Aaron und Mirjam: „Geht hinaus, ihr drei[a], zum Zelt der Begegnung.“ Und alle drei gingen hinaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die drei von euch“ oder „ihr alle drei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Das Adverb bezeichnet das unvermittelte und unerwartete Eingreifen Jahwes.
- source_word: צְאוּ
  choice: Geht hinaus
  rationale: Der Imperativ von יצא bezeichnet eine Bewegung aus einem Ort heraus. „Geht hinaus“ ist im Deutschen natürlich; je nach räumlicher Perspektive wäre auch „Kommt heraus“ möglich.
- source_word: שְׁלָשְׁתְּכֶם
  choice: ihr drei
  rationale: Die Form hebt ausdrücklich alle drei angesprochenen Personen hervor.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wiedergabe erhält den Sinn eines bestimmten Zeltes, an dem Begegnung beziehungsweise Zusammenkunft stattfindet.
- source_word: וַיֵּצְאוּ
  choice: gingen hinaus
  rationale: Die narrative Verbform wird als fortschreitende Erzählung wiedergegeben und greift die Bewegung des Befehls auf.
- source_word: שְׁלָשְׁתָּם
  choice: alle drei
  rationale: Die Form betont erneut, dass Mose, Aaron und Mirjam gemeinsam dem Befehl folgten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich. „Jahwe“ bewahrt diesen, ohne ihn durch den traditionellen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namensreihe wird ohne wiederholtes „zu“ natürlich verdichtet. Der Imperativ bleibt räumlich offen genug; die mögliche Alternative „Kommt heraus“ ist in der lexikalischen Begründung dokumentiert. „Zelt der Begegnung“ wird als feste Bezeichnung großgeschrieben.
