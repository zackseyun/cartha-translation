source:
  edition: WLC
  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: de
  text: Von Mund zu Mund rede ich mit ihm[a], deutlich und nicht in Rätseln; und er schaut die Gestalt Jahwes[b]. Warum habt ihr euch also nicht gefürchtet, gegen meinen Diener, gegen Mose, zu reden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Angesicht zu Angesicht“. Wörtlich steht im Hebräischen „von Mund zu Mund“; die Wendung hebt die unmittelbare Rede hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Abbild Jahwes“ oder „die Erscheinung Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: Von Mund zu Mund
  rationale: Die wörtliche, markante Wendung betont die unmittelbare Rede. Das geläufigere „von Angesicht zu Angesicht“ wäre bereits eine Deutung und würde das ausdrücklich verwendete Wort „Mund“ ersetzen.
- source_word: אֲדַבֶּר בּוֹ
  choice: rede ich mit ihm
  rationale: דבר mit ב bezeichnet hier das Reden mit jemandem; „mit ihm“ gibt die wechselseitige, unmittelbare Kommunikation natürlicher wieder als bloßes „zu ihm“.
- source_word: וּמַרְאֶה
  choice: deutlich
  rationale: Im Gegensatz zu „nicht in Rätseln“ bezeichnet das Wort hier eine klare, unverhüllte Mitteilung bzw. Offenbarung. Die adverbiale Wiedergabe ergibt im Deutschen einen natürlichen und kontextgerechten Satz.
- source_word: וְלֹא בְחִידֹת
  choice: und nicht in Rätseln
  rationale: חִידֹת bezeichnet rätselhafte oder schwer verständliche Aussagen. „Rätsel“ ist modern, verständlich und bewahrt den Gegensatz zur deutlichen Rede.
- source_word: וּתְמֻנַת יְהוָה
  choice: die Gestalt Jahwes
  rationale: תְּמוּנָה kann Gestalt, Abbild oder Erscheinung bezeichnen. „Gestalt“ wahrt die konkrete Aussage, ohne die Art der göttlichen Sichtbarkeit näher festzulegen; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: יַבִּיט
  choice: er schaut
  rationale: Die Hifil-Form von נבט bezeichnet ein bewusstes Hinblicken oder Anschauen. „Schaut“ ist würdig, aber im heutigen Deutsch natürlicher als „erblickt“ oder „schaut ... an“.
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: Warum habt ihr euch also nicht gefürchtet
  rationale: Das einleitende ו verbindet die Frage folgernd mit der besonderen Stellung Moses. Die Perfektform wird als rückblickender Vorwurf wiedergegeben.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: gegen meinen Diener, gegen Mose, zu reden
  rationale: Das wiederholte ב kennzeichnet im Kontext das Ziel feindseliger Rede. Die Wiederholung von „gegen“ erhält die nachdrückliche Apposition des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Moses Schauen der göttlichen Gestalt
  choice: die Gestalt Jahwes
  alternative: das Abbild Jahwes / die Erscheinung Jahwes
  rationale: Die Übersetzung lässt die Spannung zwischen Gottes Unsichtbarkeit und der hier bezeugten besonderen Offenbarung an Mose bestehen. Sie legt weder eine vollständige Schau des göttlichen Wesens noch lediglich eine innere Vision fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „von Mund zu Mund“ wurde bewusst bewahrt und durch eine Fußnote erläutert. Die Satzstellung am Ende erhält die nachdrückliche Wiederholung des hebräischen Textes.
