  terminology: „Jahwe“ gibt יהוה konsequent als Namen wieder. „Gestalt Jahwes“ ist für תְּמוּנַת יהוה eine tragfähige, nicht dogmatisch einengende Wiedergabe. Die Alternativen in Fußnote b sind passend; beide Fußnoten sind an der sachlich zugehörigen Stelle verankert.
