base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Wenn ihr Vater ihr ins Gesicht gespuckt hätte, müsste sie sich dann nicht sieben Tage lang schämen[a]? Sie soll sieben Tage lang außerhalb des Lagers ausgeschlossen werden; danach soll sie wieder aufgenommen werden[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wäre sie dann nicht sieben Tage lang beschämt?'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: danach soll sie wieder hineingeholt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָרֹק יָרַק
  choice: gespuckt hätte
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; im hypothetischen deutschen Satz wird sie natürlich durch die vollendete Form wiedergegeben, ohne die im Deutschen unübliche Wiederholung nachzuahmen.
- source_word: בְּפָנֶיהָ
  choice: ihr ins Gesicht
  rationale: Dies ist im Zusammenhang mit Spucken die natürliche deutsche Wiedergabe und vermittelt die öffentliche Demütigung.
- source_word: תִכָּלֵם
  choice: wäre sie ... beschämt
  rationale: Das Nifal bezeichnet das Beschämt- oder Zuschandenwerden. „Beschämt“ wahrt sowohl die von außen zugefügte Schande als auch die mögliche innere Scham.
- source_word: תִּסָּגֵר
  choice: soll ... ausgeschlossen bleiben
  rationale: Die passive Form bezeichnet ihre zeitweilige Absonderung. „Ausgeschlossen bleiben“ klingt zusammen mit „außerhalb des Lagers“ natürlich und hält die konkrete soziale und räumliche Ausgrenzung fest.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Direkte und im Deutschen idiomatische Ortsangabe.
- source_word: תֵּאָסֵף
  choice: soll ... wieder aufgenommen werden
  rationale: Die passive Form von אסף beschreibt hier die erneute Aufnahme in das Lager beziehungsweise in die Gemeinschaft nach der Ausschlusszeit.
theological_decisions:
- issue: Bedeutung des Satzes über das Spucken des Vaters
  choice: hypothetischer Vergleich zur Begründung von Schande und zeitweiliger Ausgrenzung
  alternative: Rückblick auf ein tatsächlich geschehenes Ereignis
  rationale: Die hebräische Konstruktion ist als rhetorischer Bedingungssatz zu verstehen. Die Übersetzung bewahrt diesen Vergleich, ohne ihm eine zusätzliche symbolische oder lehrmäßige Bedeutung zu geben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Frage und die passiven Verbformen des Hebräischen bleiben erhalten; unnötige kultische Fachsprache wird vermieden.
