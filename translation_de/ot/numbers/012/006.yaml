source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: de
  text: 'Und er sagte: „Hört nun meine Worte! Wenn es unter euch einen Propheten gibt, gebe ich, Jahwe, mich ihm in einer Vision[a] zu erkennen[b]; in einem Traum rede ich zu ihm[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer Erscheinung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „offenbare ich mich ihm“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „rede ich mit ihm“. Das Hebräische verwendet eine Präposition, die wörtlich „in/mit ihm“ bedeuten kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Gibt das narrative Wayyiqtol schlicht wieder und führt die direkte Rede ein.
- source_word: שִׁמְעוּ נָא דְבָרָי
  choice: Hört nun meine Worte!
  rationale: Der Pluralimperativ und נָא bilden hier eine eindringliche, feierliche Aufforderung; „nun“ bewahrt diese Nuance natürlich.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: Wenn es unter euch einen Propheten gibt
  rationale: Natürliche deutsche Wiedergabe des wörtlich ungewöhnlichen „wenn euer Prophet ist“, ohne die Zugehörigkeit zur angesprochenen Gemeinschaft zu verlieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בַּמַּרְאָה
  choice: in einer Erscheinung
  rationale: מַרְאָה kann eine visionäre Erscheinung oder Schau bezeichnen; „Erscheinung“ bewahrt den Bezug auf göttliches Sichzeigen und lässt die genaue Art offen.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: gebe ich mich ihm zu erkennen
  rationale: 'Bewahrt die reflexive Bedeutung des Hitpael: Jahwe macht sich dem Propheten bekannt.'
- source_word: בַּחֲלוֹם אֲדַבֶּר בּוֹ
  choice: in einem Traum rede ich zu ihm
  rationale: „In einem Traum“ bezeichnet das Offenbarungsmedium; דבר ב kann idiomatisch das Reden zu bzw. mit einer Person ausdrücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als „Jahwe“ erhält den persönlichen Namen.
- issue: Art prophetischer Offenbarung
  choice: Jahwe gibt sich in einer Erscheinung zu erkennen und redet in einem Traum
  alternative: Jahwe offenbart sich in einer Vision und spricht in einem Traum
  rationale: Die Formulierung bewahrt die beiden im Text genannten Offenbarungsweisen, ohne sie dogmatisch näher festzulegen.
- issue: Bedeutung von אֲדַבֶּר בּוֹ
  choice: rede ich zu ihm
  alternative: rede ich mit ihm; rede ich in ihm
  rationale: Die Präposition ב lässt eine gewisse sprachliche Spannung bestehen. Im Deutschen ist „zu ihm reden“ im Kontext am natürlichsten; die Alternative „mit ihm“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der feierliche Aufruf bleibt erhalten; ungewöhnliche hebräische Wendungen werden natürlich formuliert, während echte lexikalische Mehrdeutigkeiten durch Fußnoten sichtbar bleiben.
