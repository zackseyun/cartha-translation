source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: de
  text: 'Und Aaron sagte zu Mose: „Bitte, mein Herr, lege uns doch nicht die Sünde[a] zur Last, denn wir haben töricht gehandelt und gesündigt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schuld“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Ach, mein Herr
  rationale: בִּי leitet eine dringliche, höfliche Bitte ein; „Ach“ gibt den flehentlichen Ton natürlich wieder. אֲדֹנִי ist hier die respektvolle Anrede an Mose und kein Gottestitel.
- source_word: אַל נָא
  choice: doch nicht
  rationale: Die verneinte Bitte wird im Deutschen mit „doch nicht“ idiomatisch und eindringlich ausgedrückt; zusammen mit „Ach“ bleibt der flehentliche Charakter erhalten, ohne schwerfällige Doppelung.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: lege uns … die Sünde zur Last
  rationale: Die Formulierung bewahrt das Bild des Auflegens, klingt aber im modernen Deutschen natürlich. חַטָּאת wird im Haupttext direkt mit „Sünde“ wiedergegeben; „Schuld“ bleibt eine kontextuell mögliche Alternative.
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: denn wir haben töricht gehandelt
  rationale: Das Niphal von יאל bezeichnet hier törichtes oder unvernünftiges Handeln. „Töricht gehandelt“ wahrt sowohl den moralischen Ernst als auch natürliches Deutsch.
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: und gesündigt
  rationale: Die zweite Aussage bekennt die Verfehlung ausdrücklich. Im Deutschen kann das gemeinsame „denn wir haben“ beide koordinierten Verben tragen, ohne den Sinn abzuschwächen.
theological_decisions:
- issue: Wiedergabe von אֲדֹנִי als Anrede an Mose
  choice: mein Herr
  alternative: Herr; bitte, mein Herr
  rationale: Die Wendung ist hier eine menschliche Ehrenanrede, kein göttlicher Titel. „Mein Herr“ erhält Aarons Unterordnung und die Dringlichkeit seiner Bitte.
- issue: Bedeutung von חַטָּאת in Aarons Bitte
  choice: Sünde
  alternative: Schuld
  rationale: „Sünde“ gibt das Lexem transparent wieder und verbindet die Last mit dem ausdrücklich folgenden Sündenbekenntnis. Da im Kontext auch die zugerechnete Schuld gemeint sein kann, wird diese Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ach, mein Herr“ trägt den flehentlichen Ton, während „zur Last legen“ die hebräische Metapher verständlich erhält. Die beiden Bekenntnisaussagen sind knapp und rhythmisch verbunden.
