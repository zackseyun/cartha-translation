id: NUM.12.13
reference: Numbers 12:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּצְעַ֣ק מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: de
  text: 'Da schrie Mose zu Jahwe: „O Gott, bitte heile sie doch!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht die Bittepartikel zweimal; hier wird die eindringliche Bitte mit „bitte … doch“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: Da schrie … zu
  rationale: צעק bezeichnet hier einen eindringlichen Hilferuf. „Schrie … zu“ gibt die Dringlichkeit stärker wieder als das neutralere „rief“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵאמֹר
  choice: direkte Rede ohne „und sagte“
  rationale: Die deutsche Zeichensetzung mit Doppelpunkt führt den Inhalt des Rufes natürlich ein; eine zusätzliche Wiedergabe von לֵאמֹר wäre redundant.
- source_word: אֵל
  choice: O Gott
  rationale: אֵל steht als direkte Anrede. „O Gott“ bewahrt die Gebetsanrede in würdiger, verständlicher Sprache.
- source_word: נָא … נָא
  choice: bitte … doch
  rationale: Die beiden Bittenpartikeln werden beide erkennbar wiedergegeben. „Bitte … doch“ klingt im Deutschen natürlicher als die mechanische Wiederholung „bitte … bitte“ und bewahrt zugleich die Eindringlichkeit.
- source_word: רְפָא
  choice: heile
  rationale: Der Imperativ von רפא fordert unmittelbar zur Heilung auf; „heile“ ist die präzise und natürliche Entsprechung.
- source_word: לָהּ
  choice: sie
  rationale: Das feminine Singularpronomen bezieht sich auf Mirjam und wird im Deutschen ausdrücklich mit „sie“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bezeichnung Gottes mit אֵל
  choice: O Gott
  alternative: O mächtiger Gott
  rationale: אֵל kann zwar mit Stärke verbunden sein, doch hier verlangt der Kontext keine auslegende Erweiterung. Die schlichte Anrede „O Gott“ wahrt den Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform erhält die Unmittelbarkeit von Moses Fürbitte; Ausrufezeichen und die Partikeln „bitte … doch“ vermitteln ihre Dringlichkeit, ohne den Wortlaut unnötig auszubauen.
