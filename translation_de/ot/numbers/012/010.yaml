  text: וְ/הֶ/עָנָ֗ן סָ֚ר מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/הִנֵּ֥ה מִרְיָ֖ם מְצֹרַ֣עַת כַּ/שָּׁ֑לֶג וַ/יִּ֧פֶן אַהֲרֹ֛ן אֶל מִרְיָ֖ם וְ/הִנֵּ֥ה מְצֹרָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: de
  text: Die Wolke wich von ihrem Platz über dem Zelt. Und siehe, Mirjam war von einer Hautkrankheit befallen, weiß wie Schnee. Aaron wandte sich Mirjam zu, und siehe, sie war von einer Hautkrankheit befallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck wird traditionell mit „aussätzig“ wiedergegeben. Er kann jedoch unterschiedliche Hautveränderungen oder kultisch relevante Hautbefunde bezeichnen und meint nicht notwendigerweise Lepra im heutigen medizinischen Sinn (Hansen-Krankheit).
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Der bestimmte Ausdruck bezeichnet im Zusammenhang die sichtbare Wolke, die mit der Gegenwart des HERRN verbunden ist.
- source_word: סָר
  choice: zog … fort
  rationale: Das Verb bezeichnet ein Weichen oder Sichentfernen; die Formulierung gibt die Bewegung der Wolke in natürlichem Deutsch wieder.
- source_word: מֵעַל הָאֹהֶל
  choice: von über dem Zelt
  rationale: מֵעַל bezeichnet die Bewegung weg von einer Position oberhalb des Zeltes. Die knappe Wiedergabe bewahrt diese räumliche Angabe.
- source_word: וְהִנֵּה
  choice: da / und da sah er
  rationale: Die Partikel stellt den überraschenden Anblick lebhaft vor Augen. „Da“ wirkt im modernen Deutschen natürlicher als „siehe“, während die zweite Wiedergabe den Wahrnehmungszusammenhang mit Aarons Hinwendung verdeutlicht.
- source_word: מְצֹרַעַת
  choice: von einer schweren Hautkrankheit befallen
  rationale: Der hebräische Ausdruck bezeichnet einen als ṣāraʿat eingeordneten Hautbefund, der nicht ohne Weiteres mit der modernen Hansen-Krankheit gleichgesetzt werden darf. Die Formulierung vermeidet diese irreführende Verengung.
- source_word: כַּשָּׁלֶג
  choice: wie Schnee
  rationale: Die knappe Vergleichsform des Hebräischen bleibt erhalten, ohne ausdrücklich „weiß“ hinzuzufügen.
- source_word: וַיִּפֶן … אֶל
  choice: wandte sich … zu
  rationale: Die Wendung bezeichnet Aarons körperliche Hinwendung zu Mirjam und wird idiomatisch wiedergegeben.
theological_decisions:
- issue: Bedeutung von מְצֹרַעַת (ṣāraʿat)
  choice: schwere Hautkrankheit
  alternative: aussätzig
  rationale: Die traditionelle Wiedergabe „aussätzig“ kann fälschlich eine eindeutige Diagnose von Lepra im heutigen medizinischen Sinn nahelegen. Der allgemeinere Ausdruck wahrt den weiteren Bedeutungsumfang und die kultische Dimension des alttestamentlichen Begriffs, ohne eine konkrete moderne Diagnose einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das zweimalige Feststellen von Mirjams Zustand bleibt entsprechend der hebräischen Wiederholung erhalten. „Da“ bewahrt die anschauliche Überraschungswirkung von וְהִנֵּה, ohne den heute altertümlich wirkenden Imperativ „siehe“ zu verwenden.
