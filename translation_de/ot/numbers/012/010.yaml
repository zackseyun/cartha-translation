review_pass:
  verdict: revise
  source_fidelity: 'Die Abfolge wird grundsätzlich korrekt wiedergegeben: Die Wolke entfernt sich, Mirjams Zustand wird festgestellt, Aaron wendet sich ihr zu, und der Zustand wird erneut hervorgehoben. Die Wiedergabe „schwere Hautkrankheit“ ist jedoch enger bzw. stärker als das Hebräische; מְצֹרַעַת bezeichnet einen ṣāraʿat-Befund und legt weder Schwere noch eine moderne klinische Diagnose fest. Die zweite Formulierung „da sah er, dass“ macht aus der hebräischen Hervorhebung „und siehe“ eine explizite Wahrnehmungsaussage und glättet die Wiederholung.'
  naturalness: '„von über dem Zelt fort“ ist im heutigen Standarddeutsch schwerfällig. Auch „von einer schweren Hautkrankheit befallen, wie Schnee“ ist syntaktisch und semantisch unklar: Der Schneevergleich bezieht sich im Kontext auf das weiße Erscheinungsbild. Eine knappe explizite Verbindung mit „weiß wie Schnee“ ist im Deutschen erforderlich, ohne eine medizinische Diagnose einzutragen.'
  terminology: „Hautkrankheit“ ist als allgemeine Übersetzung vertretbar, wenn die Fußnote den kultisch-rituell relevanten und nicht eindeutig modernen Charakter des Ausdrucks erläutert. „Schwere“ sollte entfallen. Die traditionelle Benennung „aussätzig“ kann in der Fußnote genannt werden, sollte aber nicht die Hauptübersetzung bestimmen.
  issues:
  - severity: medium
    issue: Unbelegte Einengung durch „schwere Hautkrankheit“
    rationale: Das hebräische מְצֹרַעַת benennt einen ṣāraʿat-Befund, nicht ausdrücklich eine schwere Erkrankung. Die Ergänzung „schwere“ verändert die Aussage unnötig.
  - severity: medium
    issue: Der Vergleich „wie Schnee“ ist in der deutschen Satzkonstruktion unklar
    rationale: Im Ausgangstext legt der Vergleich das auffällige weiße Erscheinungsbild nahe. Nach „von einer … befallen“ wirkt „wie Schnee“ im Deutschen bezugslos; „weiß wie Schnee“ gibt den Sinn klar und idiomatisch wieder.
  - severity: low
    issue: Die zweite הנה-Hervorhebung wird zu einer Wahrnehmungsbeschreibung umgeformt
    rationale: „Da sah er, dass“ ist inhaltlich naheliegend, ersetzt aber die wiederholte dramatische Feststellung. „Und siehe“ bzw. eine entsprechende direkte Hervorhebung bewahrt die Struktur genauer.
  - severity: low
    issue: „von über dem Zelt fort“ ist stilistisch holprig
    rationale: Die räumliche Ausgangsposition kann natürlicher als „von ihrem Platz über dem Zelt“ ausgedrückt werden.
