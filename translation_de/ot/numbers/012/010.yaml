revisions:
- from: Und die Wolke zog von über dem Zelt fort. Da war Mirjam von einer schweren Hautkrankheit befallen[a], wie Schnee. Aaron wandte sich Mirjam zu, und da sah er, dass sie von einer schweren Hautkrankheit befallen war.
  to: Die Wolke wich von ihrem Platz über dem Zelt. Und siehe, Mirjam war von einer Hautkrankheit befallen, weiß wie Schnee. Aaron wandte sich Mirjam zu, und siehe, sie war von einer Hautkrankheit befallen.[a]
  rationale: Die Revision entfernt die nicht im Hebräischen enthaltene Qualifizierung „schwere“, macht den Schneevergleich im Deutschen verständlich und bewahrt die zweimalige hervorgehobene Feststellung des hebräischen Textes. Die räumliche Angabe zur Wolke wird idiomatischer formuliert, ohne die Aussage zu erweitern.
