id: NUM.12.7
reference: Numbers 12:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: de
  text: 'Nicht so ist es bei meinem Diener Mose: In meinem ganzen Haus ist er treu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »In meinem ganzen Haushalt ist er treu.« Das hebräische Wort für »Haus« kann auch einen Haushalt oder Herrschaftsbereich bezeichnen, nicht nur ein Gebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Nicht so ist es bei
  rationale: Die Wendung bildet einen nachdrücklichen Gegensatz zum zuvor Gesagten. Diese deutsche Formulierung ist natürlich und macht den Bezug auf Mose klar.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: עֶבֶד kann »Sklave« oder »Diener« bedeuten; hier bezeichnet das Wort Moses ehrenvolle Stellung im Dienst Gottes, ohne vor allem einen rechtlichen Sklavenstatus hervorzuheben.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname folgt der etablierten deutschen biblischen Namensform.
- source_word: בְּכָל בֵּיתִי
  choice: in meinem ganzen Haus
  rationale: Die Wiedergabe erhält sowohl die Präposition als auch das Bild des Hauses. Das hebräische בַּיִת kann dabei über ein Gebäude hinaus einen Haushalt oder Herrschaftsbereich bezeichnen.
- source_word: נֶאֱמָן הוּא
  choice: ist er treu
  rationale: נֶאֱמָן bezeichnet Zuverlässigkeit und Treue. Die vorangestellte Ortsangabe und die Wortstellung »ist er treu« geben den Satz im Deutschen klar und würdig wieder.
theological_decisions:
- issue: Bedeutung von »mein Haus« für Moses Stellung
  choice: Das Bild »in meinem ganzen Haus« bleibt im Haupttext erhalten.
  alternative: »in meinem ganzen Haushalt« oder »unter meinem ganzen Volk«
  rationale: Das Haus kann Gottes Haushalt, Gemeinschaft oder Bereich meinen. Die bildhafte Formulierung bewahrt diese Bedeutungsweite und ihre späteren innerbiblischen Bezüge, ohne sie vorschnell auf eine einzige Deutung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der starke Gegensatz und das Hausbild des Hebräischen werden bewahrt; die mögliche erweiterte Bedeutung von »Haus« wird in der Fußnote erläutert.
