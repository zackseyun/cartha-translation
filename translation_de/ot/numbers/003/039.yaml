  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: de
  text: Die Gesamtzahl der Leviten, die Mose und Aaron[a] auf Befehl Jahwes[b] nach ihren Sippen zählten – alle männlichen Personen im Alter von einem Monat an –, betrug 22.000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text stehen besondere Punkte über dem Namen „Aaron“. Ihre genaue Bedeutung ist unklar.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „nach dem Mund Jahwes“; eine hebräische Redewendung für „auf Befehl Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פְּקוּדֵי / פָּקַד
  choice: die Gesamtzahl / zählten
  rationale: Die Wortfamilie פקד bezeichnet hier die Erfassung bei einer Volkszählung. „Gesamtzahl“ gibt das Ergebnis natürlich wieder, während „zählten“ die Wiederholung des hebräischen Verbs erkennbar hält.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Dies ist die geläufige deutsche Bezeichnung für die Angehörigen des Stammes Levi.
- source_word: עַל פִּי יְהוָה
  choice: auf Befehl Jahwes
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund Jahwes“ und bezeichnet hier seinen Befehl oder seine ausdrückliche Anweisung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: „Sippen“ bezeichnet in diesem Zählungskontext die größeren verwandtschaftlichen Einheiten genauer als das modern oft enger verstandene „Familien“.
- source_word: כָּל זָכָר
  choice: alle männlichen Personen
  rationale: Die Formulierung gibt die ausdrückliche Geschlechtsangabe des Hebräischen wieder und schließt auch die im nächsten Ausdruck genannten Säuglinge ein.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: im Alter von einem Monat an
  rationale: Dies ist eine natürliche deutsche Wiedergabe der hebräischen Altersgrenze „von einem Monat und darüber“.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: '22.000'
  rationale: Die Zahl wird eindeutig und nach deutscher Schreibkonvention wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Außergewöhnliche Punkte über וְאַהֲרֹן („und Aaron“)
  choice: Aaron im Haupttext beibehalten und die masoretische Markierung in einer Fußnote anzeigen
  alternative: Aaron aufgrund der Markierung aus dem Haupttext auslassen
  rationale: Der Konsonantentext nennt Aaron ausdrücklich; die besondere Punktierung signalisiert jedoch eine alte textliche Auffälligkeit, deren genaue Bedeutung nicht sicher ist. Daher wird weder der Name gestrichen noch die Markierung verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur fasst die censusartige Formulierung flüssig zusammen; der Gedankenstrich kennzeichnet „alle männlichen Personen im Alter von einem Monat an“ als erläuternde Bestimmung. Die ausdrücklich männliche Zählgruppe und die Altersgrenze bleiben vollständig erhalten.
