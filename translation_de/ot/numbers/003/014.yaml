  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] redete zu Mose in der Wüste Sinai:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“; traditionell „der HERR“ wiedergegeben.'
