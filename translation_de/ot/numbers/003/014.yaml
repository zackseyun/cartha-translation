lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das narrative Wayyiqtol von דבר eröffnet die übliche göttliche Redeformel. „Redete“ gibt sie in gehobenem, aber verständlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Fügung.
- source_word: בְּמִדְבַּר סִינַי
  choice: in der Wüste Sinai
  rationale: מִדְבָּר bezeichnet eine Wüsten- bzw. unbesiedelte Weidelandschaft. Die etablierte deutsche Ortsbezeichnung lautet „Wüste Sinai“.
- source_word: לֵאמֹר
  choice: und sprach
  rationale: Der Infinitiv לֵאמֹר führt den folgenden Redeinhalt formelhaft ein. „Und sprach“ bewahrt die traditionelle hebräische Doppelungsformel in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Gottesnamen. „Jahwe“ erhält den Charakter eines persönlichen Namens, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem biblischem Register. Die knappe hebräische Redeformel wird strukturell bewahrt; „redete … und sprach“ ist bewusst formeller als alltägliche Umgangssprache.
