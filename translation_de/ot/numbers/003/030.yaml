  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י אֶלִיצָפָ֖ן בֶּן עֻזִּיאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: de
  text: Und das Oberhaupt[a] des Vaterhauses[b] der Sippen der Kehatiter war Elizafan, der Sohn Usiëls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Anführer« oder »Fürst« (hebräisch נָשִׂיא).'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »Haus des Vaters«; gemeint ist eine vom väterlichen Vorfahren her bestimmte Großfamilien- oder Sippeneinheit.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Und das Oberhaupt
  rationale: נָשִׂיא bezeichnet hier den anerkannten Leiter einer Stammes- beziehungsweise Sippeneinheit; »Oberhaupt« gibt die Autoritätsstellung wieder, ohne eine monarchische Bedeutung nahezulegen. Das ו wird als fortführendes »Und« wiedergegeben.
- source_word: בֵית אָב
  choice: des Vaterhauses
  rationale: Der feste Ausdruck bezeichnet eine patrilineare Großfamilien- oder Sippeneinheit. »Vaterhaus« bewahrt das israelitische Verwandtschaftsbild; eine Fußnote erläutert den historischen Sinn.
- source_word: לְמִשְׁפְּחֹת
  choice: der Sippen
  rationale: מִשְׁפָּחוֹת meint verwandtschaftlich gegliederte Gruppen. »Sippen« unterscheidet diese Ebene im Deutschen deutlich vom übergeordneten »Vaterhaus«.
- source_word: הַקְּהָתִי
  choice: der Kehatiter
  rationale: Das substantivierte Gentiliz im Singular steht kollektiv für die Nachkommen Kehats; der deutsche Plural gibt diese Gruppenbezeichnung natürlich wieder.
- source_word: אֶלִיצָפָן
  choice: Elizafan
  rationale: Der Personenname wird nach einer am Hebräischen orientierten deutschen Umschrift wiedergegeben.
- source_word: בֶּן עֻזִּיאֵל
  choice: der Sohn Usiëls
  rationale: Die genealogische Formel wird in natürlichem Deutsch wiedergegeben; »Usiëls« markiert die Zugehörigkeit eindeutig.
