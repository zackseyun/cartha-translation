  text: אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/כֹּהֲנִ֖ים הַ/מְּשֻׁחִ֑ים אֲשֶׁר מִלֵּ֥א יָדָ֖/ם לְ/כַהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: de
  text: Dies sind die Namen der Söhne Aarons, der gesalbten Priester, deren Hand er gefüllt hat[a], damit sie als Priester dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deren Hand er gefüllt hat«; eine hebräische Wendung für die Einsetzung zum Priesterdienst.'
    reason: Die wörtlich bewahrte hebräische Einsetzungsformel ist im modernen Deutschen ohne Erklärung nicht unmittelbar verständlich.
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Dies sind die Namen
  rationale: Die im Hebräischen nominale Identifikationsformel wird im natürlichen Deutschen mit der Kopula wiedergegeben.
- source_word: בְּנֵי אַהֲרֹן
  choice: der Söhne Aarons
  rationale: Die Status-constructus-Verbindung wird als deutscher Genitiv ausgedrückt; »Söhne« bewahrt die ausdrücklich männliche Bezeichnung.
- source_word: הַכֹּהֲנִים הַמְּשֻׁחִים
  choice: der gesalbten Priester
  rationale: Beide bestimmten Ausdrücke stehen appositionell zu den Söhnen Aarons. »Gesalbt« gibt das passive Partizip von משׁח unmittelbar wieder.
- source_word: אֲשֶׁר מִלֵּא יָדָם
  choice: deren Hand er gefüllt hatte
  rationale: Die konkrete hebräische Einsetzungsformel bleibt sichtbar. Das Verb steht aktiv in der 3. Person Singular; daher wird das nicht ausdrücklich benannte Subjekt mit »er« wiedergegeben. Der Singular »Hand« entspricht der Form יָדָם.
- source_word: לְכַהֵן
  choice: damit sie als Priester dienten
  rationale: Der Infinitiv bezeichnet Zweck beziehungsweise Funktion der Einsetzung. Die finale Formulierung ist im Deutschen klar und bewahrt den Gedanken des priesterlichen Dienstes.
theological_decisions:
- issue: Wiedergabe der priesterlichen Einsetzungsformel מִלֵּא יָדָם
  choice: Die wörtliche Wendung »deren Hand er gefüllt hatte« steht im Haupttext und wird in einer Fußnote erklärt.
  alternative: »die er zum Priesterdienst eingesetzt/geweiht hatte«
  rationale: Eine rein idiomatische Wiedergabe wäre leichter verständlich, würde aber das auffällige konkrete Bild des hebräischen Textes verdecken. Die Fußnote ermöglicht Verständlichkeit, ohne die Formulierung vorschnell auf einen bestimmten späteren Ordinationsbegriff festzulegen.
- issue: Nicht ausdrücklich genannter Handelnder bei מִלֵּא
  choice: »er«
  alternative: »man« oder eine passive Formulierung wie »deren Hände gefüllt worden waren«
  rationale: Die hebräische Verbform ist aktiv und markiert ein männliches Subjekt im Singular, auch wenn dessen Name in diesem Vers nicht genannt wird. »Er« bewahrt diese grammatische Information, ohne den Handelnden im Text zu identifizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die appositionelle Struktur und die rituelle Bildsprache des Hebräischen bleiben erhalten; die Fußnote erläutert die sonst missverständliche Wendung.
