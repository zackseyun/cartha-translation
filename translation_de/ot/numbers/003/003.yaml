  naturalness: Der Satzbau ist würdiges modernes Standarddeutsch. Mit dem nicht markierten Plusquamperfekt und dem daran angeglichenen Präteritum „dienten“ entsteht allerdings eine unnötige zeitliche Festlegung. Präsensperfekt mit präsentischem Finalsatz bewahrt den aspektuell-resultativen Charakter verständlich.
  terminology: „Gesalbte Priester“ und „als Priester dienen“ sind angemessen. Die Fußnote erklärt die kultische hebräische Formel, ohne sie konfessionell einzuengen. Der Singular „Hand“ entspricht der hebräischen Form יָדָם und sollte beibehalten werden.
