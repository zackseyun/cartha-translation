  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: de
  text: Die Sippen der Söhne Kehats[a] sollen an der Südseite der Stiftshütte lagern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Nachkommen Kehats“ oder „der Kehatiter“. Wörtlich steht im Hebräischen: „der Söhne Kehats“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Zusammenhang der Lagerordnung bezeichnet das Wort größere verwandtschaftliche Untergruppen, nicht nur unmittelbare Familien. „Sippen“ gibt diese soziale Einheit im Deutschen präzise und knapp wieder.
- source_word: בְּנֵי קְהָת
  choice: der Söhne Kehats
  rationale: Die wörtliche Abstammungsformulierung des Hebräischen bleibt erhalten. Gemeint sind Kehats Nachkommen beziehungsweise die Kehatiter.
- source_word: יַחֲנוּ
  choice: sollen … lagern
  rationale: Das Imperfekt beschreibt hier die angeordnete Lagerposition. „Sollen … lagern“ drückt die Vorschrift in natürlichem modernem Deutsch aus.
- source_word: עַל יֶרֶךְ
  choice: an der …seite
  rationale: Die Verbindung bezeichnet die Lage an einer Flanke oder Seite. „An der Südseite“ ist im Deutschen die natürliche Ortsangabe.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: Das Wort bezeichnet hier das heilige Zelt als Ort der Gegenwart Gottes. „Wohnung“ bildet die Grundbedeutung ab und bleibt im Kontext der bereits eingeführten Stiftshütte verständlich.
- source_word: תֵּימָנָה
  choice: Süd-
  rationale: Die Richtungsform bezeichnet die südliche Lage; zusammen mit יֶרֶךְ ergibt sich idiomatisch „Südseite“.
