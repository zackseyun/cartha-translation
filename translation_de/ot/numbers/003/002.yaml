  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי אַהֲרֹ֖ן הַ/בְּכ֣וֹר נָדָ֑ב וַ/אֲבִיה֕וּא אֶלְעָזָ֖ר וְ/אִיתָמָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/002.yaml
  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: de
  text: 'Dies sind die Namen der Söhne Aarons: der Erstgeborene Nadab, Abihu, Eleasar und Itamar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies sind
  rationale: Die einleitende Konjunktion mit Demonstrativ wird im Deutschen natürlich und deiktisch mit „Dies sind“ wiedergegeben; ein ausdrückliches „Und“ ist hier nicht erforderlich.
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: die Namen der Söhne Aarons
  rationale: Die hebräische Status-constructus-Verbindung wird formal nah und zugleich idiomatisch wiedergegeben.
- source_word: הַבְּכֹר
  choice: der Erstgeborene
  rationale: Der Ausdruck bezeichnet ausdrücklich den Erstgeborenen, nicht lediglich den altersmäßig Ältesten; die Stellung vor Nadab folgt der hebräischen Wortfolge.
- source_word: נָדָב
  choice: Nadab
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וַאֲבִיהוּא
  choice: dann Abihu
  rationale: „Dann“ macht deutlich, dass nach der appositionellen Kennzeichnung Nadabs die Aufzählung der weiteren Söhne fortgesetzt wird, ohne Abihu sprachlich an „der Erstgeborene“ anzuschließen.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וְאִיתָמָר
  choice: und Itamar
  rationale: Der abschließende Konjunktionsanschluss der hebräischen Liste wird bewahrt; der Name erscheint in gebräuchlicher deutscher Form.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung bleibt der hebräischen Listenstruktur nahe; „dann“ verhindert dabei die mögliche Fehlzuordnung, Abihu sei ebenfalls mit der Bezeichnung „der Erstgeborene“ verbunden.
