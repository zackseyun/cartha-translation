  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: de
  text: Vor der Wohnung, an ihrer Ostseite, vor dem Zelt der Begegnung gegen Sonnenaufgang, lagerten Mose, Aaron und seine Söhne. Sie versahen den Wachdienst am Heiligtum für die Israeliten. Doch jeder Unbefugte[b], der sich nähert, soll getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Gemeint ist hier keine ethnisch fremde Person, sondern jemand, der nicht befugt ist, sich dem Heiligtumsdienst zu nähern.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: lagerten
  rationale: Das substantivisch gebrauchte Partizip bezeichnet die dort stationierten Personen; im deutschen Satz lässt sich dies natürlich mit dem Präteritum wiedergeben.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: vor der Wohnung
  rationale: „Wohnung“ gibt מִשְׁכָּן wieder und unterscheidet den Ausdruck vom unmittelbar folgenden „Zelt der Begegnung“.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: an ihrer Ostseite ... gegen Sonnenaufgang
  rationale: Die beiden verwandten Richtungsangaben werden unterschieden wiedergegeben, sodass die hebräische Hervorhebung der Ostlage erhalten bleibt.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Der Ausdruck bezeichnet das Heiligtumszelt als Ort der Begegnung; diese geläufige Wiedergabe bewahrt seine Bedeutung.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: Mose, Aaron und seine Söhne
  rationale: Das maskuline Singularsuffix bezieht sich grammatisch am natürlichsten auf Aaron.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: versahen den Dienst
  rationale: Die figura etymologica bezeichnet die gewissenhafte Wahrnehmung einer übertragenen Aufgabe; „den Dienst versehen“ klingt im Deutschen natürlich und wahrt den Pflichtcharakter.
- source_word: הַמִּקְדָּשׁ
  choice: Heiligtum
  rationale: Hier ist der heilige Bereich beziehungsweise der daran verrichtete Dienst gemeint, nicht nur ein einzelner Innenraum.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: als Dienst für die Israeliten
  rationale: Die Formulierung wahrt die Zuordnung der Aufgabe zu Israel, ohne eindeutig festzulegen, ob stärker stellvertretende Wahrnehmung oder eine Israel auferlegte Pflicht betont wird.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Im modernen Standarddeutsch bezeichnet dies das Bundesvolk natürlich und eindeutig.
- source_word: וְהַזָּר
  choice: jeder Unbefugte
  rationale: זָר bezeichnet im Kontext eine Person ohne Berechtigung zum Zugang oder Heiligtumsdienst, nicht notwendig einen ethnischen Fremden.
- source_word: הַקָּרֵב
  choice: der sich nähert
  rationale: Die partizipiale Form bezeichnet das unbefugte Herantreten an den heiligen Bereich.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Der Hophal drückt verursachtes beziehungsweise vollstrecktes Töten aus, nicht bloß ein Sterben.
theological_decisions:
- issue: Bezug von „seine Söhne“
  choice: Das Pronomen bezieht sich auf Aarons Söhne.
  alternative: Es könnte lockerer auf die mit Mose und Aaron verbundenen Familien bezogen werden.
  rationale: Das Singularsuffix folgt unmittelbar auf Aaron; zudem ist der priesterliche Wachdienst im Kontext Aaron und seinen Söhnen übertragen.
- issue: Bedeutung von זָר im Heiligtumsrecht
  choice: Gemeint ist eine für diesen Zugang oder Dienst nicht befugte Person.
  alternative: Ein ethnischer Ausländer oder ein Fremder im allgemeinen sozialen Sinn.
  rationale: Der unmittelbare Zusammenhang behandelt Zuständigkeit und Zugang am Heiligtum, nicht ethnische Zugehörigkeit.
- issue: Sinn von לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: „als Dienst für die Israeliten“ lässt die genaue Art der Zuordnung offen.
  alternative: „stellvertretend für die Israeliten“ oder „als die den Israeliten obliegende Pflicht“.
  rationale: Die Präposition und das wiederholte מִשְׁמֶרֶת können sowohl die Israel zugeordnete Verantwortung als auch deren Wahrnehmung zugunsten Israels nahelegen; die Übersetzung soll diese Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wohnung“ und „Zelt der Begegnung“ werden terminologisch unterschieden. Die Satzgliederung löst den langen hebräischen Nominalsatz behutsam auf, ohne seine räumliche Betonung oder den rechtlichen Nachsatz abzuschwächen.
