revisions:
- from: Vor der Wohnung, an ihrer Ostseite[a], vor dem Zelt der Begegnung gegen Sonnenaufgang, lagerten Mose, Aaron und seine Söhne. Sie versahen den Dienst am Heiligtum als Dienst für die Israeliten. Doch jeder Unbefugte[b], der sich nähert, soll getötet werden.
  to: Vor der Wohnung, an ihrer Ostseite, vor dem Zelt der Begegnung gegen Sonnenaufgang, lagerten Mose, Aaron und seine Söhne. Sie versahen den Wachdienst am Heiligtum für die Israeliten. Doch jeder Unbefugte[b], der sich nähert, soll getötet werden.
  rationale: Die räumliche Ortsbestimmung und die terminologische Unterscheidung von „Wohnung“ und „Zelt der Begegnung“ bleiben erhalten. Der zweite Satz wird nur insofern geändert, als „Wachdienst“ die im Hebräischen betonte Obhuts- und Wächterfunktion ausdrückt. „für die Israeliten“ lässt weiterhin offen, ob die Aufgabe als für Israel wahrgenommene oder Israel zugeordnete Verpflichtung verstanden wird. Der Fußnotenanker [a] entfällt, weil die überarbeitete Textfassung keine Markierung [a] enthält; die zugehörige Fußnote wird dennoch als Bestandteil des vollständigen Fußnotensatzes beibehalten.
