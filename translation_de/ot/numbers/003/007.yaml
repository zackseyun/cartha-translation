  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: de
  text: Sie sollen seinen[a] Auftrag[b] und den Auftrag der ganzen Gemeinde[c] vor dem Zelt der Begegnung erfüllen, um den Dienst an der Wohnstätte zu verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seinen“ bezieht sich im unmittelbaren Zusammenhang wahrscheinlich auf Aaron; möglich ist auch ein allgemeinerer Bezug auf den priesterlichen beziehungsweise den Heiligtumsdienst.
    reason: textual_ambiguity
  - marker: b
    text: 'Wörtlicher: „seinen Auftrag“ oder „seine Obhut bewahren“. Das hebräische Verb und das zugehörige Nomen können sowohl das Bewachen als auch das gewissenhafte Erfüllen einer anvertrauten Pflicht bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Die Leviten übernehmen damit Aufgaben, die Aaron und die ganze Gemeinde in Bezug auf das Heiligtum betreffen; ob besonders an stellvertretenden Dienst gedacht ist, wird hier nicht ausdrücklich gesagt.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ ... מִשְׁמַרְתּוֹ ... מִשְׁמֶרֶת
  choice: seinen Dienstauftrag ... den Dienstauftrag ... wahrnehmen
  rationale: Die Verbindung von שׁמר mit מִשְׁמֶרֶת bezeichnet hier das verantwortliche Hüten, Beachten und Ausführen einer übertragenen Aufgabe. „Einen Dienstauftrag wahrnehmen“ ist im modernen Deutschen natürlich, wahrt den kultischen Pflichtcharakter und erhält die Wiederholung des hebräischen Nomens.
- source_word: הָעֵדָה
  choice: Gemeinde
  rationale: עֵדָה bezeichnet im Buch Numeri regelmäßig die Gemeinschaft Israels. „Gemeinde“ ist im kultischen Zusammenhang verständlich und würdevoll, ohne den Ausdruck auf eine bloße Versammlung zu verengen.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: vor dem Zelt der Begegnung
  rationale: לִפְנֵי hat hier räumlich-kultische Bedeutung. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent und in heutigem Deutsch wieder.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת
  choice: um den Dienst ... zu verrichten
  rationale: Die Zweckangabe und das Wortspiel aus Verb und stammverwandtem Nomen werden sinngemäß bewahrt; „Dienst verrichten“ ist natürlicher als eine mechanische Wiedergabe wie „den Dienst dienen“.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet die Wohnstätte Gottes unter Israel. „Wohnung“ bewahrt diese Bedeutung unmittelbarer als das traditionsgeprägte „Stiftshütte“ und unterscheidet den Ausdruck vom zuvor genannten אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Bezug des maskulinen Suffixes in מִשְׁמַרְתּוֹ
  choice: „seinen“ wird im Haupttext beibehalten; Aaron ist im unmittelbaren Zusammenhang der wahrscheinlichste Bezug.
  alternative: Das Suffix kann allgemeiner auf den Zuständigkeitsbereich des Heiligtums oder auf den priesterlichen Auftrag insgesamt bezogen werden.
  rationale: Numeri 3,6 ordnet die Leviten Aaron zu, weshalb Aaron der nächstliegende Bezug ist. Da das Hebräische den Namen hier jedoch nicht wiederholt, wird er nicht erläuternd in den Haupttext eingesetzt; die geringe Restoffenheit wird in der Fußnote genannt.
- issue: Verhältnis des Dienstauftrags der Leviten zum Auftrag der ganzen Gemeinde
  choice: Die parallele Formulierung bleibt stehen und wird nicht so umgeschrieben, als ersetzten die Leviten die Gemeinde vollständig.
  alternative: Explizite Wiedergabe als Dienst „im Namen der ganzen Gemeinde“ oder „anstelle der ganzen Gemeinde“.
  rationale: Der Kontext legt eine stellvertretende beziehungsweise gemeinschaftsbezogene Aufgabe nahe, doch die Präposition beziehungsweise genaue Relation ist im Ausdruck nicht ausdrücklich markiert. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dienstauftrag wahrnehmen“ vermeidet das altertümliche „Obhut halten“, ohne den Gedanken an anvertraute Verantwortung abzuschwächen. „Wohnung“ wird als sachlich-theologischer Ausdruck für Gottes Wohnstätte verwendet und bewusst vom „Zelt der Begegnung“ unterschieden.
