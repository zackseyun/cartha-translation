  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: de
  text: Und der Oberste über die Oberhäupter der Leviten war Eleasar, der Sohn des Priesters Aaron. Er hatte die Aufsicht über diejenigen, die den Wachdienst am Heiligtum[a] versahen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die den Wachdienst an den heiligen Gegenständen versahen“. Das hebräische Wort kann sowohl das Heiligtum selbst als auch die dazugehörigen heiligen Gegenstände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: Und der Oberste über die Oberhäupter der Leviten
  rationale: נָשִׂיא bezeichnet hier einen Leiter oder ein Oberhaupt. Die Formulierung gibt sowohl Eleasars Vorrang als auch seine Aufsicht über die untergeordneten levitischen Oberhäupter wieder, ohne einen königlichen Titel anzudeuten.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Eleasar, der Sohn des Priesters Aaron
  rationale: Die Namensformen folgen dem etablierten deutschen Bibelgebrauch. Durch „des Priesters Aaron“ wird eindeutig ausgedrückt, dass הַכֹּהֵן Aaron näher bestimmt.
- source_word: פְּקֻדַּת
  choice: Er hatte die Aufsicht über
  rationale: פְּקֻדָּה kann Aufsicht, Zuständigkeit oder Amt bezeichnen. Die verbale Wiedergabe ergibt einen natürlichen deutschen Satz und wahrt Eleasars administrative Verantwortung.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: diejenigen, die den Dienst … versahen
  rationale: Die Verbindung aus Partizip und stammverwandtem Substantiv bezeichnet das treue Wahrnehmen einer anvertrauten Pflicht. „Den Dienst versahen“ passt zum levitischen Aufgabenbereich und vermeidet die zu enge Vorstellung bloßer Bewachung.
- source_word: הַקֹּדֶשׁ
  choice: das Heiligtum
  rationale: Im Zusammenhang des Zeltheiligtums bezeichnet הַקֹּדֶשׁ wahrscheinlich den heiligen Bereich; zugleich kann das Wort auch die heiligen Gegenstände meinen. Die Hauptübersetzung wählt die kontextuell naheliegende räumliche Bedeutung und vermerkt die echte lexikalische Alternative in einer Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst rangbetonte Wiederholung „Oberste … Oberhäupter“ spiegelt die hebräische Konstruktion, während die Aufteilung in zwei Sätze die komplexe Nominalstruktur verständlich macht.
