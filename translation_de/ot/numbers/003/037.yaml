  language: de
  text: und die Säulen des Vorhofs ringsum und ihre Sockel[a] und ihre Pflöcke und ihre Seile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fußgestelle« beziehungsweise »Aufnahmen«. Das hebräische Wort bezeichnet die tragenden Basisteile der Säulen.'
