lexical_decisions:
- source_word: עַמֻּדֵי
  choice: Säulen
  rationale: Der Konstruktplural bezeichnet die aufrechten Träger der Vorhofeinfassung; »Säulen« ist im Heiligtumsbau verständlich und sachlich passend.
- source_word: הֶחָצֵר
  choice: des Vorhofs
  rationale: Das Wort bezeichnet hier den umgrenzten Hof der Stiftshütte; »Vorhof« ist die geläufige und präzise deutsche Bezeichnung.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb beschreibt die Säulen an allen Seiten des Vorhofs und bewahrt knapp den räumlichen Sinn.
- source_word: אַדְנֵיהֶם
  choice: ihre Sockel
  rationale: In den Beschreibungen der Stiftshütte bezeichnet das Wort die tragenden Fußteile beziehungsweise Aufnahmen der Säulen; »Sockel« ist klar und anschaulich.
- source_word: יְתֵדֹתָם
  choice: ihre Pflöcke
  rationale: Gemeint sind Pflöcke zur Befestigung der Anlage; die knappe Wiedergabe entspricht dem hebräischen Ausdruck.
- source_word: מֵיתְרֵיהֶם
  choice: ihre Seile
  rationale: Das Wort bezeichnet die zur Verspannung und Befestigung dienenden Seile; »Seile« ist natürliches modernes Deutsch.
- source_word: וְ
  choice: und
  rationale: Die wiederholte Konjunktion kennzeichnet die Fortsetzung und Aufzählungsstruktur des hebräischen Inventars; sie wird deshalb beibehalten.
