    rationale: Die Formulierung „über … hinaus übrig waren“ ist im Deutschen nicht idiomatisch und kann einen verbliebenen Rest statt einer zahlenmäßig übersteigenden Gruppe nahelegen. Das hebräische Partizip עֹדְפִים bezeichnet hier die Überschussgruppe.
  - severity: low
    issue: Primärbegriff „Lösegeld“ kann im heutigen Deutsch fehlleiten
    rationale: Im vorliegenden Zählungs- und Auslösungsverfahren bezeichnet כֶּסֶף הַפִּדְיוֹם eine Auslösungszahlung. „Auslösungsgeld“ wahrt diesen Sinn genauer; „Lösegeld“ kann als Alternative vermerkt werden.
