base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: de
  text: Und Mose nahm das Auslösungsgeld von denjenigen, deren Zahl die Zahl der durch die Leviten Ausgelösten überstieg[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Lösegeld“. Gemeint ist die zur Auslösung entrichtete Geldsumme.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: von den israelitischen Erstgeborenen, deren Zahl die Zahl der Leviten überstieg, die bei dieser Auslösung für sie eintraten.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das Qal-Wayyiqtol von לקח ist das gewöhnliche Erzählverb „nehmen“. „Empfing“ wäre im Zusammenhang möglich, würde den einfachen Wortlaut aber stärker auslegen.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: das Lösegeld
  rationale: Die Wendung bezeichnet die zur Auslösung entrichtete Geldsumme. „Lösegeld“ ist im Deutschen natürlich und bewahrt den rechtlich-kultischen Sinn; „Auslösungsgeld“ ist als nähere formale Alternative möglich.
- source_word: מֵאֵת
  choice: von
  rationale: Die Präposition bezeichnet hier die Herkunft beziehungsweise die Personengruppe, von der Mose das Geld nahm.
- source_word: הָעֹדְפִים
  choice: die … übrig waren
  rationale: Das Partizip von עודף bezeichnet diejenigen, die zahlenmäßig über eine Vergleichsgruppe hinausgingen. Die Formulierung hält dies fest, ohne „Erstgeborene“ ausdrücklich in den Vers einzufügen.
- source_word: עַל
  choice: über … hinaus
  rationale: עַל drückt hier den zahlenmäßigen Überschuss gegenüber der Vergleichsgruppe aus.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: die durch die Leviten Ausgelösten
  rationale: Der passive Partizipialkonstrukt bezeichnet die Personen, die im vorausgehenden Auslösungsverfahren den Leviten zugeordnet und dadurch ausgelöst wurden. „Durch“ gibt den kontextuellen Sinn verständlich wieder, ohne die Leviten selbst als Zahlungsempfänger darzustellen.
theological_decisions:
- issue: Art des Verhältnisses zwischen den Leviten und den Ausgelösten
  choice: „die durch die Leviten Ausgelösten“
  alternative: „die Ausgelösten der Leviten“
  rationale: Der hebräische Konstrukt ist formal weiter, doch der unmittelbare Zusammenhang beschreibt die Leviten als stellvertretende Entsprechung für Israels Erstgeborene. Die verständliche deutsche Wiedergabe macht diese Beziehung sichtbar, ohne eine weitergehende Sühnelehre einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markierte Wendung „über … hinaus übrig waren“ bewahrt den Gedanken eines zahlenmäßigen Überschusses; die Fußnote erklärt den vorausgesetzten Zählungs- und Auslösungskontext.
