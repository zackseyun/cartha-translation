- from: Und Mose nahm das Lösegeld von denen, die über die durch die Leviten Ausgelösten hinaus übrig waren[a][b].
  to: Und Mose nahm das Auslösungsgeld von denjenigen, deren Zahl die Zahl der durch die Leviten Ausgelösten überstieg[a][b].
  rationale: Die Revision ersetzt die schwerfällige Restformulierung durch einen eindeutigen Zahlenvergleich und verwendet „Auslösungsgeld“ als kontextgenaueren Hauptbegriff. Die Wiedergabe „durch die Leviten Ausgelösten“ bleibt wegen des unmittelbaren Kontextes der stellvertretenden Zuordnung erhalten, ohne eine weitergehende theologische Deutung einzutragen. Beide Fußnotenanker bleiben an der passenden Stelle erhalten.
