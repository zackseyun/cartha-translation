  source_fidelity: 'Der Grundsinn ist zutreffend: Mose nimmt die Zahlung von der zahlenmäßigen Überschussgruppe gegenüber den durch die Leviten vertretenen bzw. ausgelösten Erstgeborenen. Die Wendung „übrig waren“ gibt עֹדְפִים jedoch weniger präzise wieder, da es um einen zahlenmäßigen Überschuss, nicht um einen bloßen Rest geht. „Durch die Leviten Ausgelösten“ ist im Kontext vertretbar, sollte aber syntaktisch klarer an den Zahlenvergleich gebunden werden.'
  naturalness: '„die über die durch die Leviten Ausgelösten hinaus übrig waren“ ist im modernen Standarddeutsch schwerfällig und semantisch doppelt markiert: „über … hinaus“ und „übrig“ verschieben den Akzent. „deren Zahl die Zahl … überstieg“ ist klar, idiomatisch und gibt den Kontextvergleich ausdrücklich wieder.'
  terminology: „Auslösungsgeld“ ist für כֶּסֶף הַפִּדְיוֹם im kultisch-rechtlichen Zählungs- und Ersatzkontext präziser und weniger missverständlich als das im heutigen Deutsch oft mit Entführung assoziierte „Lösegeld“. „Lösegeld“ bleibt als lexikalische Alternative in der Anmerkung möglich.
