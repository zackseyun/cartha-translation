base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: de
  text: Zu Gerschon gehörten die Sippe der Libniter und die Sippe der Schimiter; das sind die Sippen der Gerschoniter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: Zu Gerschon gehörten
  rationale: Das präfigierte לְ bezeichnet hier im Rahmen der genealogischen Aufzählung die Zuordnung zu Gerschon. Die Formulierung ist im Deutschen natürlich und gibt das Besitz- bzw. Zugehörigkeitsverhältnis wieder.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: die Sippe / die Sippen
  rationale: מִשְׁפָּחָה bezeichnet in diesem Zählungs- und Abstammungskontext eine verwandtschaftliche Untergruppe innerhalb eines Stammes. „Sippe“ ist weiter als die moderne Kleinfamilie und kleiner als ein Stamm.
- source_word: הַלִּבְנִי
  choice: der Libniter
  rationale: Die gentilizische Form bezeichnet die von Libni abstammende Gruppe. Der deutsche Gruppenname „Libniter“ bewahrt diese genealogische Funktion.
- source_word: הַשִּׁמְעִי
  choice: der Schimiter
  rationale: Die gentilizische Form bezeichnet die von Schimi abstammende Gruppe. „Schimiter“ ist eine knappe, im Deutschen verständliche Wiedergabe.
- source_word: אֵלֶּה הֵם
  choice: das sind
  rationale: Die hebräische Identifikationsformel wird idiomatisch mit dem deutschen Präsens wiedergegeben. Das Singularpronomen „das“ kann im Deutschen auf die zuvor genannten Gruppen verweisen.
- source_word: הַגֵּרְשֻׁנִּי
  choice: der Gerschoniter
  rationale: Der Gentilname bezeichnet den größeren levitischen Abstammungsverband Gerschons; „Gerschoniter“ gibt dies knapp und traditionsnah wieder.
