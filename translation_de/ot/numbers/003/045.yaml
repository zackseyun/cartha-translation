id: NUM.3.45
reference: Numbers 3:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: de
  text: Nimm die Leviten anstelle jedes Erstgeborenen unter den Söhnen Israels[a] und das Vieh der Leviten anstelle ihres Viehs[b]. Die Leviten sollen mir gehören. Ich bin Jahwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „unter den Israeliten“. Wörtlich steht im Hebräischen „unter den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „anstelle“ übersetzte hebräische Wort bezeichnet einen Ersatz oder eine Stellvertretung.
    reason: lexical_alternative
  - marker: c
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Nimm
  rationale: Der Imperativ von לקח fordert Mose auf, die Leviten als Ersatz zu nehmen beziehungsweise zu bestimmen. „Nimm“ gibt den direkten Befehl knapp und natürlich wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche deutsche Bezeichnung für die Angehörigen des Stammes Levi.
- source_word: תַּחַת
  choice: anstelle
  rationale: Das Wort bezeichnet hier nicht eine räumliche Lage, sondern Ersatz beziehungsweise Stellvertretung. „Anstelle“ wahrt diesen Sinn in beiden parallelen Satzteilen.
- source_word: כָּל בְּכוֹר
  choice: jedes Erstgeborenen
  rationale: כָּל mit dem singularischen בְּכוֹר hat verteilenden Sinn. Wegen „anstelle“ steht die deutsche Form im Genitiv.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: unter den Söhnen Israels
  rationale: „Unter“ gibt den partitiven Gebrauch der Präposition בְּ wieder; „Söhne Israels“ bewahrt die konkrete hebräische Formulierung, ohne sie verallgemeinernd aufzulösen.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: das Vieh der Leviten
  rationale: בְּהֵמָה bezeichnet kollektiv domestizierte Tiere. „Vieh“ ist im Deutschen ein natürlicher Kollektivbegriff.
- source_word: בְּהֶמְתָּם
  choice: ihr Vieh
  rationale: Das maskuline Pluralsuffix verweist auf die Söhne Israels. Die Formulierung erhält die Parallelität zum Vieh der Leviten.
- source_word: וְהָיוּ לִי
  choice: Die Leviten sollen mir gehören
  rationale: Die Wiedergabe drückt die beanspruchte Zugehörigkeit klar aus. Die ausdrückliche Wiederaufnahme von „die Leviten“ folgt dem hebräischen Satz und vermeidet ein mehrdeutiges Pronomen.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Die Formel ist eine göttliche Selbstidentifikation und bekräftigt die Autorität des vorausgehenden Gebots. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
- issue: Charakter der Zuordnung der Leviten
  choice: anstelle … sollen mir gehören
  alternative: für … sollen mein sein
  rationale: תַּחַת bezeichnet in diesem Zusammenhang einen Ersatz der Erstgeborenen durch die Leviten. Die Übersetzung macht diese Stellvertretung sichtbar, ohne ihre kultisch-theologische Bedeutung weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte Imperativ und die parallele Ersatzformulierung des Hebräischen bleiben erhalten. „Vieh“ wird als geläufiger Kollektivbegriff verwendet; „sollen mir gehören“ klingt natürlicher als das formalere „sollen mein sein“.
