source:
  edition: WLC
  text: מִשְׁפְּחֹ֖ת הַ/גֵּרְשֻׁנִּ֑י אַחֲרֵ֧י הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ יָֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: de
  text: Die Sippen der Gerschoniter sollen hinter der Wohnung lagern, nach Westen hin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wörtlich »zum Meer hin«, eine im biblischen Hebräisch übliche Bezeichnung für »nach Westen«.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Stammes- und Zählungskontext bezeichnet das Wort größere, abstammungsbezogene Untergruppen; »Sippen« gibt diesen korporativen Sinn besser wieder als das eher häuslich klingende »Familien«.
- source_word: הַגֵּרְשֻׁנִּי
  choice: der Gerschoniter
  rationale: Die singularische Gentilbezeichnung mit Artikel wird kollektiv gebraucht und bezeichnet die von Gerschon abstammende Gruppe.
- source_word: אַחֲרֵי
  choice: hinter
  rationale: Die Präposition ist hier räumlich und beschreibt die Lage im Lager, nicht eine zeitliche Abfolge.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: Das Wort bezeichnet hier das heilige Zeltheiligtum als Wohnstätte Gottes. »Wohnung« wahrt die Grundbedeutung und ist im Kontext des Buches Numeri als feststehende Bezeichnung verständlich.
- source_word: יַחֲנוּ
  choice: sollen … lagern
  rationale: Das Imperfekt beschreibt die vorgeschriebene Lagerordnung; die Konstruktion mit »sollen« gibt diese normative Aussage natürlich wieder.
- source_word: יָמָּה
  choice: nach Westen hin
  rationale: Die Richtungsform von »Meer« ist im biblischen Hebräisch eine übliche Bezeichnung für die westliche Richtung. Die Wiedergabe ist im Deutschen klar und erhält die Richtungsnuance.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sippen« bildet die soziale Gliederung präzise ab; »Wohnung« bewahrt das zentrale hebräische Bild, ohne eine konfessionell geprägte Sonderdeutung einzuführen.
