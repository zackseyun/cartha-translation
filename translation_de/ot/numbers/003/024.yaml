  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und alle wesentlichen Elemente des Hebräischen zutreffend wieder: die fortführende Konjunktion, נָשִׂיא als nichtmonarchisches Leitungsamt, בֵּית־אָב als kinship-/Sippenstruktur, die Zuordnung zu den Gerschonitern sowie Name und Abstammung Eljasafs.'
