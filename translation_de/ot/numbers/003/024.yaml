source:
  edition: WLC
  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לַ/גֵּרְשֻׁנִּ֑י אֶלְיָסָ֖ף בֶּן לָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: de
  text: Und das Oberhaupt des Vaterhauses der Gerschoniter war Eljasaf, der Sohn Laëls.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Vaterhaus«; ein israelitischer Verwandtschaftsbegriff für eine Großfamilie oder einen Sippenverband.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Und das Oberhaupt
  rationale: נָשִׂיא bezeichnet hier den leitenden Repräsentanten einer Sippe, nicht einen königlichen Fürsten. Das vorangestellte ו wird zur Fortführung der Aufzählung mit „Und“ wiedergegeben.
- source_word: בֵית אָב
  choice: des Vaterhauses
  rationale: Der Ausdruck ist ein israelitischer Verwandtschaftsbegriff für einen väterlich bestimmten Familien- oder Sippenverband. „Vaterhaus“ bewahrt die Bildsprache und ist im biblischen Register verständlich; die Fußnote erläutert den kulturellen Sinn.
- source_word: לַגֵּרְשֻׁנִּי
  choice: der Gerschoniter
  rationale: Die Form bezeichnet die Zugehörigkeit zur von Gerschon abstammenden Gruppe; im Deutschen ist der kollektive Plural natürlich.
- source_word: אֶלְיָסָף
  choice: Eljasaf
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamensform transliteriert.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die gewöhnliche genealogische Beziehung wird klar und idiomatisch ausgedrückt.
- source_word: לָאֵל
  choice: Laël
  rationale: Der Personenname wird transliteriert; das Trema zeigt, dass a und e getrennt gesprochen werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Oberhaupt“ vermeidet den königlichen Beiklang von „Fürst“, während „Vaterhaus“ den kulturellen Ausgangsbegriff bewahrt und in der Fußnote erklärt wird.
