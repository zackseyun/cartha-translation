  text: וּ/פְקֻדֵי/הֶם֙ בְּ/מִסְפַּ֣ר כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שֵׁ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: de
  text: Und die Zahl aller bei ihnen erfassten männlichen Personen im Alter von einem Monat an betrug sechstausendzweihundert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: die Zahl der bei ihnen Gemusterten
  rationale: Die substantivische Form von פקד mit Suffix bezeichnet hier die zu dieser Gruppe gehörenden Gemusterten beziehungsweise deren Musterungszahl. Die Formulierung wahrt sowohl den Personenbezug als auch den Zusammenhang der Zählung.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: aller männlichen Personen
  rationale: בְּמִסְפַּר führt die zahlenmäßige Erfassung ein; כָּל זָכָר bezeichnet ausnahmslos jede männliche Person. Im Deutschen lässt sich die Formel natürlich in die Gesamtaussage über die Musterungszahl einfügen.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: im Alter von einem Monat an
  rationale: Die Wendung setzt die untere Altersgrenze einschließlich eines Monats und umfasst alle Älteren; „von einem Monat an“ gibt dies in modernem Deutsch knapp und eindeutig wieder.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: sechstausendzweihundert
  rationale: Die ausgeschriebene Kardinalzahl entspricht dem hebräischen Gesamtwert 6.200 und passt zum Stil fortlaufenden Bibeltexts.
