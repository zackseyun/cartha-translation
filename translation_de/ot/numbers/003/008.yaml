  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: de
  text: Sie sollen für alle Geräte des Zeltes der Begegnung und für die Dienstpflicht der Söhne Israels[a] Sorge tragen, um den Dienst an der Wohnstätte zu verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die gegenüber den Söhnen Israels wahrzunehmende Aufsichtspflicht“. Die Genitivverbindung kann die von den Söhnen Israels übernommene Dienstpflicht oder eine ihnen gegenüber wahrzunehmende Verantwortung bezeichnen.'
    reason: Die Zuordnung von מִשְׁמֶרֶת zu בְּנֵי יִשְׂרָאֵל ist auslegungsfähig; die Anmerkung bewahrt die mögliche Alternative, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: sie sollen … beaufsichtigen / … versehen
  rationale: Das Verb bezeichnet hier nicht nur Bewachen, sondern die verantwortliche Wahrnehmung eines anvertrauten Auftrags. Im Deutschen wird es passend zu den beiden Objekten idiomatisch differenziert wiedergegeben.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: alle Geräte des Zeltes der Begegnung
  rationale: כְּלִים umfasst Geräte, Gegenstände und Ausstattungsstücke. „Geräte“ ist weit genug und im Heiligtumskontext natürlich.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wiedergabe bewahrt sowohl das Zeltmotiv als auch den Gedanken des bestimmten Begegnungsortes.
- source_word: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: den Dienst der Söhne Israels
  rationale: מִשְׁמֶרֶת bezeichnet eine anvertraute Pflicht oder Aufgabe. „Dienst“ passt zum kultischen Zusammenhang; die mögliche Zuordnung des Genitivs bleibt in der Fußnote sichtbar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale korporative Bezeichnung des Hebräischen wird beibehalten, ohne sie zu „Israeliten“ zu verallgemeinern.
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: indem sie die Arbeit an der Wohnung verrichten
  rationale: Die Konstruktion verbindet Verb und stammverwandtes Substantiv und bezeichnet die Ausführung der Heiligtumsarbeit. „Wohnung“ gibt מִשְׁכָּן transparent als Wohnstätte wieder.
theological_decisions:
- issue: Bezug von מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: den Dienst der Söhne Israels versehen
  alternative: die Aufsichtspflicht gegenüber den Söhnen Israels wahrnehmen
  rationale: Der hebräische Genitiv kann die den Israeliten obliegende Aufgabe oder eine ihnen gegenüber wahrzunehmende Pflicht bezeichnen. Der Haupttext folgt der naheliegenden Stellvertretungsbedeutung; die Fußnote bewahrt die Alternative.
- issue: Korporative maskuline Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die konkrete Form des Ausgangstextes wird erhalten; sie fungiert hier zugleich als nationale Kollektivbezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zelt der Begegnung“ und „Wohnung“ unterscheiden die beiden hebräischen Heiligtumsbezeichnungen. Die etwas formelle Wendung „einen Dienst versehen“ entspricht dem kultisch-administrativen Kontext.
