id: NUM.3.20
reference: Numbers 3:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: de
  text: 'Die Söhne Meraris, nach ihren Sippen: Machli und Muschi. Das sind die Sippen der Leviten[a] nach ihren Vaterhäusern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Sippen Levis«. Im Hebräischen steht die singularische Bezeichnung »der Levit«; sie kann kollektiv gemeint sein oder auf Levi als Stammvater zurückweisen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: Die Söhne Meraris
  rationale: בְּנֵי bedeutet wörtlich »Söhne von«; der deutsche Genitiv gibt die genealogische Zuordnung knapp und natürlich wieder. Das einleitende וּ wird im listenartigen Zusammenhang nicht eigens mit »und« wiedergegeben.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: Die Präposition לְ kennzeichnet hier die Gliederung nach verwandtschaftlichen Untereinheiten; »Sippen« passt zum stammesgeschichtlichen Zusammenhang.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Machli und Muschi
  rationale: Die Eigennamen werden in ihren im Deutschen etablierten biblischen Formen wiedergegeben; das Präfix וּ wird als »und« übersetzt.
- source_word: אֵלֶּה הֵם
  choice: Das sind
  rationale: Demonstrativum und Pronomen bilden eine identifizierende Aussage; im Deutschen ist der Singular »Das« bei einer folgenden pluralischen Benennung idiomatisch.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: die Sippen der Leviten
  rationale: Obwohl הַלֵּוִי formal Singular ist, kann die Volksbezeichnung kollektiv gebraucht sein. Der Plural »Leviten« ist im Zusammenhang mit den mehreren Sippen natürlich; die formale und sachliche Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: בֵּית אָבוֹת ist eine feste genealogisch-administrative Bezeichnung für eine vom Vater her bestimmte Haus- oder Familiengruppe; »Vaterhäuser« bewahrt dieses historische Gliederungsprinzip.
theological_decisions:
- issue: Bezug und Zahl von הַלֵּוִי
  choice: der Leviten
  alternative: Levis / des Leviten
  rationale: Der singularische Gentilname kann kollektiv die Angehörigen des Stammes bezeichnen oder auf Levi als Stammvater zurückweisen. Der Kontext mit mehreren Sippen begünstigt im Haupttext die kollektive Wiedergabe, ohne die Alternative auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sippen« und »Vaterhäuser« erhalten die genealogische und verwaltungsmäßige Begrifflichkeit des hebräischen Textes, ohne sie durch moderne Familienbegriffe einzuebnen.
