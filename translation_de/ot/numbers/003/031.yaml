  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: de
  text: Zu ihrer Aufgabe gehörten die Lade, der Tisch, der Leuchter, die Altäre, die Geräte des Heiligtums, mit denen Dienst verrichtet wird, der Eingangsvorhang[a] und der gesamte damit verbundene Dienst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der abschirmende Vorhang am Eingang, nicht der innere Vorhang vor dem Allerheiligsten.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: Und ihrer Obhut waren
  rationale: מִשְׁמֶרֶת bezeichnet hier die den Kehatitern übertragene Verantwortung. „Ihrer Obhut waren“ ist im Deutschen natürlich und führt die folgende Gegenstandsliste klar ein.
- source_word: הָאָרֹן
  choice: die Lade
  rationale: Im Heiligtumskontext bezeichnet אָרוֹן die heilige Lade. Der hebräische Text ergänzt hier weder „Bundes-“ noch „Zeugnis-“.
- source_word: הַשֻּׁלְחָן
  choice: der Tisch
  rationale: Das Hebräische nennt schlicht den bekannten Tisch des Heiligtums, ohne weitere Bestimmung.
- source_word: הַמְּנֹרָה
  choice: der Leuchter
  rationale: מְנוֹרָה bezeichnet den kultischen Leuchter. „Leuchter“ ist die etablierte und verständliche deutsche Sachbezeichnung.
- source_word: הַמִּזְבְּחֹת
  choice: die Altäre
  rationale: Die hebräische Pluralform wird unmittelbar wiedergegeben.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: die Geräte des Heiligtums
  rationale: כְּלִים sind Geräte oder Gerätschaften; הַקֹּדֶשׁ bezeichnet hier wahrscheinlich den heiligen Bereich beziehungsweise das Heiligtum. Die Formulierung ist klar und wahrt die kultische Einordnung.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: mit denen man den Dienst verrichtet
  rationale: שׁרת bezeichnet kultischen Dienst. Das unpersönliche „man“ wahrt die nicht ausdrücklich genannte Personengruppe des hebräischen Verbs besser als ein bestimmtes „sie“.
- source_word: הַמָּסָךְ
  choice: der Eingangsvorhang
  rationale: מָסָךְ bezeichnet im Stiftshüttenkontext einen abschirmenden Vorhang am Eingang und ist vom inneren Vorhang (פָּרֹכֶת) zu unterscheiden.
- source_word: וְכֹל עֲבֹדָתוֹ
  choice: und alle damit verbundenen Arbeiten
  rationale: עֲבֹדָה kann Dienst oder Arbeit bezeichnen. Der maskuline Singularsuffix hat einen nicht völlig eindeutigen Bezug; „damit verbunden“ bewahrt diese Offenheit, während „Arbeiten“ die praktischen Aufgaben einschließt.
theological_decisions:
- issue: Kultische Dienstterminologie
  choice: „den Dienst verrichtet“ für שׁרת, aber „Arbeiten“ für עֲבֹדָה
  alternative: Beide Ausdrücke einheitlich mit „dienen/Dienst“ wiedergeben
  rationale: Die Wiedergabe bewahrt beim Verb den kultischen Sinn, vermeidet jedoch bei der abschließenden Sammelbezeichnung eine im Deutschen schwerfällige Wiederholung und lässt praktische Aufgaben mitgemeint sein.
- issue: Bezug des Suffixes in עֲבֹדָתוֹ
  choice: Mit „damit verbundenen“ nicht ausdrücklich festlegen
  alternative: „all seinen Dienst“ auf den Eingangsvorhang oder „den gesamten damit verbundenen Dienst“ auf die ganze Gegenstandsliste beziehen
  rationale: Der maskuline Singularsuffix ist grammatisch vorhanden, sein genauer Bezug im Satz aber nicht sicher. Die Übersetzung soll diese Spannung nicht künstlich auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt eng am Hebräischen; traditionelle, verständliche Heiligtumsbegriffe werden ohne konfessionelle Zusätze verwendet.
