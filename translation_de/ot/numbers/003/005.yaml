  source_fidelity: 'Der Entwurf gibt die hebräische Erzählungsformel vollständig und sachgerecht wieder: וַיְדַבֵּר („redete“), den Gottesnamen יְהוָה („Jahwe“), den Adressaten אֶל־מֹשֶׁה („zu Mose“) sowie לֵאמֹר als Einleitung der folgenden Rede („und sprach“). Die Verbindung „redete … und sprach“ ist eine zulässige formelhafte deutsche Entsprechung und lässt erkennen, dass der Inhalt erst im folgenden Vers folgt.'
  naturalness: „Und Jahwe redete zu Mose und sprach:“ ist würdiges, gut verständliches Standarddeutsch. Es ist bewusst formelhaft, aber nicht unnatürlich; der Doppelanschluss entspricht dem biblischen Register.
  terminology: „Jahwe“ ist die im Deutschen etablierte wissenschaftliche Wiedergabe des Tetragramms. „Mose“ ist die Standardform. Die Fußnote informiert zutreffend über JHWH sowie traditionelle bzw. alternative Wiedergaben, ohne den Textsinn zu verändern.
