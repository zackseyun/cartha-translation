  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] redete zu Mose und sprach:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit „der HERR“, ferner mit „Jehova“ wiedergegeben.'
    reason: Alternative Wiedergaben des Gottesnamens transparent machen.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das mit Waw fortgeführte Piel von דבר führt die Erzählung weiter und gehört zur üblichen Einleitungsformel göttlicher Rede. „Redete“ gibt das Verb genauer wieder als das allgemeinere „sagte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen gebräuchliche wissenschaftliche Wiedergabe.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Formulierung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Dies ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: und sprach
  rationale: Der Infinitiv לֵאמֹר leitet den im folgenden Vers wiedergegebenen Redeinhalt ein. Die traditionelle und zugleich verständliche deutsche Formel „und sprach“ bewahrt die hebräische Redeeinleitung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm JHWH. „Jahwe“ bewahrt den Charakter als Gottesname; „Jehova“ beruht auf einer späteren Mischlesung, während „der HERR“ den Namen durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste hebräische Redeeinleitung wird mit „redete … und sprach“ bewusst formal und anschlussfähig an den folgenden Redeinhalt wiedergegeben.
