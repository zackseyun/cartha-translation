  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: de
  text: Du sollst die Leviten Aaron und seinen Söhnen übergeben; sie sind ihm aus der Mitte der Söhne Israels ganz und gar übergeben.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische wiederholt das Wort für »gegeben« zur Verstärkung: »gegeben, gegeben« oder »ganz und gar gegeben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von den Israeliten«; Hebräisch: »von den Söhnen Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Du sollst … übergeben
  rationale: Das Qal-Perfekt mit וְ hat im Anweisungskontext verpflichtende Kraft. „Übergeben“ gibt sowohl נתן als auch die Zuweisung der Leviten an Aaron und seine Söhne natürlich wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Dies ist die übliche und präzise deutsche Bezeichnung für die Angehörigen des Stammes Levi, die für den Heiligtumsdienst ausgesondert sind.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Aaron und seinen Söhnen
  rationale: Die Präposition לְ bezeichnet hier die Empfänger der Übergabe. Im Deutschen regiert „übergeben“ den Dativ ohne zusätzliche Präposition.
- source_word: נְתוּנִם נְתוּנִם
  choice: ganz und gar übergeben
  rationale: Die Wiederholung des passiven Partizips verstärkt die Aussage. „Ganz und gar“ bewahrt diese Emphase in natürlichem Deutsch; die hebräische Wiederholung wird in einer Fußnote offengelegt.
- source_word: הֵמָּה
  choice: sie sind
  rationale: Das selbstständige Pronomen hebt die Leviten hervor. Im Deutschen wird die Hervorhebung zusammen mit dem emphatischen Prädikat ausreichend vermittelt.
- source_word: לוֹ
  choice: ihm
  rationale: Das Pronomen verweist im unmittelbaren Zusammenhang auf Aaron und bezeichnet ihn als Empfänger der Zuweisung.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: aus der Mitte der Söhne Israels
  rationale: מֵאֵת bezeichnet Herkunft beziehungsweise Auswahl aus einer größeren Gruppe. Die Formulierung bewahrt sowohl diesen Auswahlgedanken als auch den familiären Ausdruck „Söhne Israels“.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Der hebräische Ausdruck ist wörtlich ein maskuliner Plural im Konstruktus und trägt eine familiär-bundestheologische Färbung. Die wörtlichere Form bleibt im Text erhalten; die idiomatischere kollektive Wiedergabe wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ganz und gar“ vermittelt die hebräische Emphase verständlich, ohne die im Deutschen schwerfällige Wortwiederholung in den Haupttext zu übernehmen. Die Fußnotenmarker stehen unmittelbar nach den jeweils erläuterten Aussagen.
