source:
  edition: WLC
  text: וּ/פְקֻדַּ֣ת מִשְׁמֶרֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמֻּדָ֣י/ו וַ/אֲדָנָ֑י/ו וְ/כָל כֵּלָ֔י/ו וְ/כֹ֖ל עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: de
  text: Die den Söhnen Meraris anvertraute Aufgabe umfasste die Rahmen der Stiftshütte[a], ihre Riegel, ihre Säulen und ihre Sockel[b], alle ihre Geräte und alle damit verbundenen Arbeiten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Bretter der Stiftshütte“.'
    reason: Das hebräische קֶרֶשׁ kann als Brett oder Bohle bezeichnet werden; im Zusammenhang handelt es sich um tragende Bauteile.
  - marker: b
    text: 'Oder: „ihre Fußstücke“ beziehungsweise „ihre Einlasssockel“.'
    reason: Das hebräische אֶדֶן bezeichnet die unteren Aufnahmeteile, in welche Säulen oder Rahmenteile eingesetzt wurden.
  - marker: c
    text: 'Wörtlicher: „und ihren gesamten Dienst“.'
    reason: עֲבֹדָה kann sowohl den Dienst als auch die damit verbundene Arbeit bezeichnen.
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: anvertrauter Verantwortungsbereich
  rationale: Die verbundene Wendung bezeichnet die den Meraritern zugewiesene und zur Obhut übertragene Aufgabe. Die deutsche Formulierung gibt sowohl die offizielle Zuweisung als auch die praktische Verantwortung natürlich wieder.
- source_word: בְּנֵי מְרָרִי
  choice: die Söhne Meraris
  rationale: Dies entspricht der ausdrücklichen hebräischen Verwandtschaftsbezeichnung und ist im genealogischen Zusammenhang verständlich.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: die Rahmenteile der Stiftshütte
  rationale: קֶרֶשׁ bezeichnet hier die aufrechten tragenden Bauteile. „Rahmenteile“ bringt ihre bauliche Funktion zum Ausdruck, ohne sie vorschnell auf flache Bretter festzulegen.
- source_word: הַמִּשְׁכָּן
  choice: Stiftshütte
  rationale: „Stiftshütte“ ist im Deutschen die geläufige technische Bezeichnung für das transportable Heiligtum; der Grundgedanke des hebräischen Wortes ist eine „Wohnung“.
- source_word: בְרִיחָיו
  choice: ihre Riegel
  rationale: Gemeint sind die Riegel, welche die Rahmenteile der Stiftshütte verbanden oder stabilisierten.
- source_word: עַמֻּדָיו
  choice: ihre Säulen
  rationale: Das Wort bezeichnet aufrechte Stützen; „Säulen“ ist in diesem baulichen und sakralen Zusammenhang natürlich.
- source_word: אֲדָנָיו
  choice: ihre Sockel
  rationale: Gemeint sind die tragenden Fuß- oder Aufnahmeteile für die Bauelemente. „Sockel“ ist präzise und gut verständlich.
- source_word: כָל כֵּלָיו
  choice: alle ihre Geräte
  rationale: כְּלִי ist ein weiter Sammelbegriff für zugehörige Gegenstände, Gerätschaften oder Ausrüstung. „Geräte“ bewahrt diese Breite.
- source_word: כֹל עֲבֹדָתוֹ
  choice: alle damit verbundenen Arbeiten
  rationale: Die Wendung fasst die gesamte praktische Arbeit beziehungsweise den Dienst an den genannten Teilen zusammen. Die gewählte Formulierung ist im Deutschen natürlicher als „all ihr Dienst“.
