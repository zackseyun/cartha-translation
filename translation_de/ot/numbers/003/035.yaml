  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: de
  text: Und das Oberhaupt des Vaterhauses der Sippen Meraris war Zuriël, der Sohn Abihajils.[a][b] Sie sollten an der Nordseite der Wohnstätte lagern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Anführer«; das hebräische Wort kann einen anerkannten Leiter oder auch einen Fürsten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Vaterhaus« bezeichnet einen größeren, patrilinear bestimmten Verwandtschaftsverband.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Und das Oberhaupt
  rationale: נָשִׂיא bezeichnet hier den anerkannten Leiter einer Verwandtschaftsgruppe. »Oberhaupt« passt zum organisatorischen Zusammenhang und vermeidet die monarchischen Anklänge von »Fürst«; ו wird als fortführendes »Und« wiedergegeben.
- source_word: בֵית אָב
  choice: Stammhaus
  rationale: Die Wendung bezeichnet einen patrilinear bestimmten größeren Verwandtschaftsverband. »Stammhaus« ist im Deutschen knapp und verständlich; die wörtliche Bedeutung wird in einer Fußnote erläutert.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: der Sippen Meraris
  rationale: מִשְׁפָּחוֹת meint in diesem Zusammenhang die Untergliederungen des Stammes Levi. »Sippen« trifft diese größeren Verwandtschaftsgruppen besser als das engere »Familien«; ל wird idiomatisch als Genitivbeziehung ausgedrückt.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: Zuriël, der Sohn Abihajils
  rationale: Die Eigennamen werden in deutscher Bibeltradition entsprechend dem Hebräischen wiedergegeben; בֶּן wird als »Sohn« übersetzt.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: an der Nordseite der Wohnung
  rationale: יֶרֶךְ bedeutet wörtlich »Seite« oder »Flanke«; zusammen mit צָפֹנָה bezeichnet die Wendung die Nordseite. מִשְׁכָּן wird als »Wohnung« wiedergegeben, da das Wort Gottes Wohnstätte unter Israel bezeichnet und nicht primär eine Bauform.
- source_word: יַחֲנוּ
  choice: Sie sollten … lagern
  rationale: Der Imperfekt beschreibt hier die vorgeschriebene Lagerordnung. »Sollten lagern« gibt den zugewiesenen Standort natürlich wieder.
- source_word: צָפֹנָה
  choice: Nordseite
  rationale: Das Richtungswort bezeichnet die Lage im Norden und wird idiomatisch in die Ortsangabe aufgenommen.
theological_decisions:
- issue: Wiedergabe von מִשְׁכָּן
  choice: Wohnung
  alternative: Stiftshütte / Heiligtum
  rationale: »Wohnung« bewahrt die Grundbedeutung des hebräischen Wortes als Ort des Wohnens Gottes. »Stiftshütte« ist traditionell, aber im heutigen Deutsch wenig durchsichtig; »Heiligtum« wäre weiter gefasst als der konkrete Ausdruck.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem aufzählenden Charakter des hebräischen Textes, bleibt aber natürlich lesbar. »Sippen« und »Stammhaus« unterscheiden die ineinandergreifenden Verwandtschaftsebenen; die Fußnotenmarker stehen unmittelbar nach dem einschlägigen ersten Satz.
