  terminology: Die Namen Zuriël und Abihajil sind angemessene Transliterationen. »Sippen« trifft מִשְׁפָּחוֹת gut. Die Fußnote zu »Vaterhaus« soll nach der Änderung nicht mehr als bloße wörtliche Alternative formuliert werden, sondern den technischen kinship-Begriff erläutern.
