base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: de
  text: Zu Merari gehörten die Sippe der Machliter und die Sippe der Muschiter. Dies sind die Sippen Meraris.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: Zu Merari gehörten
  rationale: Das präfigierte ל eröffnet in dieser Aufzählung die Zuordnung der folgenden Gruppen zu Merari. Die verbale deutsche Formulierung gibt diese klassifizierende Funktion natürlich wieder.
- source_word: מִשְׁפַּחַת
  choice: die Sippe der
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftlich definierte Untergruppe innerhalb des Stammes. „Sippe“ ist im Deutschen präziser als „Familie“ und enger als „Stamm“.
- source_word: הַמַּחְלִי
  choice: Machliter
  rationale: Die Form ist eine Gruppenbezeichnung für die Nachkommen beziehungsweise Sippenangehörigen Machlis. „Machliter“ gibt das Gentiliz wieder.
- source_word: וּמִשְׁפַּחַת
  choice: und die Sippe der
  rationale: Die Konjunktion verbindet die zweite Sippe parallel mit der ersten; die Wiederholung wahrt die klare Listenstruktur des Hebräischen.
- source_word: הַמּוּשִׁי
  choice: Muschiter
  rationale: Die Form bezeichnet die von Muschi abgeleitete Gruppe und wird entsprechend als Gentiliz wiedergegeben.
- source_word: אֵלֶּה הֵם
  choice: Das waren
  rationale: Die Verbindung aus Demonstrativpronomen und Personalpronomen identifiziert zusammenfassend die zuvor genannten Gruppen. Im deutschen Erzählkontext ist „Das waren“ natürlich und bewahrt die zusammenfassende Aussage.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: die Sippen Meraris
  rationale: Der Plural fasst die beiden zuvor genannten Verwandtschaftsgruppen zusammen. Der deutsche Genitiv gibt die hebräische Status-constructus-Verbindung knapp und eindeutig wieder.
