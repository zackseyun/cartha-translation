  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: de
  text: Zähle die Söhne Levis nach ihren Vaterhäusern[a] und ihren Sippen. Alle männlichen Personen von einem Monat an sollst du zählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Leviten“. Wörtlich steht im Hebräischen „die Söhne Levis“, wodurch Abstammung und Sippengliederung hervorgehoben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: zähle / sollst du zählen
  rationale: Das Verb פקד bezeichnet hier das administrative Zählen beziehungsweise Erfassen. „Zählen“ ist verständlich und gibt sowohl den Imperativ als auch die abschließende Bekräftigung wieder, ohne einen militärischen Nebensinn einzutragen.
- source_word: בְּנֵי לֵוִי
  choice: die Söhne Levis
  rationale: Die Formulierung entspricht dem wörtlichen genealogischen Ausdruck und passt zur anschließenden Gliederung nach Vaterhäusern und Sippen. „Leviten“ wäre als sinngemäße Wiedergabe ebenfalls möglich.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ bewahrt den patriarchal-genealogischen Fachausdruck und unterscheidet diese soziale Einheit von den anschließend genannten Sippen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: „Sippen“ gibt die verwandtschaftliche Gliederung wieder und vermeidet eine begriffliche Gleichsetzung mit den Vaterhäusern.
- source_word: כָּל זָכָר
  choice: alle männlichen Personen
  rationale: Der hebräische Ausdruck bezeichnet das männliche Geschlecht, nicht erwachsene Männer; die Wiedergabe schließt daher die ausdrücklich genannten Säuglinge eindeutig ein.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: im Alter von einem Monat und darüber
  rationale: Die Formulierung gibt die untere Altersgrenze genau und in natürlichem modernem Deutsch wieder.
theological_decisions: []
