  register: Modernes, würdevolles Standarddeutsch. Die genealogischen Begriffe „Söhne Levis“, „Vaterhäuser“ und „Sippen“ bleiben unterscheidbar; die Altersangabe wird idiomatisch und präzise formuliert.
