base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: de
  text: Nadab und Abihu aber starben vor Jahwe, als sie vor Jahwe fremdes Feuer[a] in der Wüste Sinai darbrachten. Sie hatten keine Söhne; Eleasar und Itamar dienten vor Aaron, ihrem Vater[b], als Priester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Adjektiv kann auch „ungehörig“, „fremd“ oder „nicht zugelassen“ bedeuten; wahrscheinlich ist Feuer gemeint, das für den kultischen Dienst nicht zugelassen war.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu Lebzeiten ihres Vaters Aaron“. Die hebräische Wendung kann den Dienst in Aarons Gegenwart oder während seiner Lebenszeit bezeichnen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיָּמָת
  choice: starben
  rationale: Die Wayyiqtol-Form von מות berichtet schlicht ihren Tod; wegen des zusammengesetzten Subjekts steht im Deutschen der Plural.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet die Gegenwart Jahwes und lässt sich im Zusammenhang des Gerichts knapp und idiomatisch mit „vor Jahwe“ wiedergeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּהַקְרִבָם
  choice: als sie … darbrachten
  rationale: Der Infinitiv mit בְּ bezeichnet hier den zeitlichen beziehungsweise begleitenden Umstand; „darbringen“ passt zum Opferkontext.
- source_word: אֵשׁ זָרָה
  choice: fremdes Feuer
  rationale: Die formal nahe Wiedergabe bewahrt die kultische Ausdrucksweise; eine Fußnote erläutert, dass wohl nicht zugelassenes Feuer gemeint ist.
- source_word: בְּמִדְבַּר סִינַי
  choice: in der Wüste Sinai
  rationale: Natürliche deutsche Wiedergabe der hebräischen Konstruktverbindung.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: Sie hatten keine Söhne
  rationale: בָנִים bezeichnet ausdrücklich Söhne, was für die priesterliche Nachfolge bedeutsam ist.
- source_word: וַיְכַהֵן
  choice: dienten … als Priester
  rationale: כהן bedeutet, den Priesterdienst auszuüben; im Deutschen verlangt das zusammengesetzte Subjekt den Plural.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: vor ihrem Vater Aaron
  rationale: Die knappe Formulierung bewahrt die Mehrdeutigkeit der hebräischen Wendung zwischen Gegenwart und Gleichzeitigkeit, ohne Aufsicht oder Rangordnung ausdrücklich hineinzulesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Bedeutung von אֵשׁ זָרָה
  choice: fremdes Feuer
  alternative: unerlaubtes Feuer
  rationale: „Fremdes Feuer“ entspricht der offenen Formulierung des Hebräischen; die wahrscheinliche kultische Bedeutung wird erläutert, aber nicht als einzige mögliche Nuance in den Haupttext eingetragen.
- issue: Bedeutung von עַל פְּנֵי bei Aaron
  choice: vor ihrem Vater Aaron
  alternative: zu Lebzeiten ihres Vaters Aaron
  rationale: Die hebräische Wendung kann sowohl Aarons Gegenwart als auch den Dienst während seiner Lebenszeit ausdrücken. Der Haupttext erhält diese Spannung; die Fußnote nennt die zeitliche Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle kultische Wendung „fremdes Feuer“ bleibt erhalten und wird erläutert. Der Semikolonanschluss bildet den engen Zusammenhang zwischen fehlenden Söhnen und der Fortführung des Priesterdienstes durch Eleasar und Itamar ab.
