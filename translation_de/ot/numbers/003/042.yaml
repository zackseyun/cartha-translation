id: NUM.3.42
reference: Numbers 3:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: de
  text: So zählte Mose alle Erstgeborenen unter den Söhnen Israels[a], genauso wie Jahwe es ihm befohlen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter den Söhnen Israels“; sinngemäß auch: „unter den Israeliten“ oder „unter den Kindern Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: zählte
  rationale: פקד bezeichnet in diesem Zusammenhang das Zählen beziehungsweise Erfassen von Personen. „Zählte“ ist klar, natürlich und dem unmittelbaren Kontext angemessen.
- source_word: כַּאֲשֶׁר
  choice: genauso wie
  rationale: Die Konjunktion bezeichnet hier die genaue Übereinstimmung von Moses Handeln mit dem göttlichen Befehl.
- source_word: צִוָּה
  choice: befohlen hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass der Befehl Moses Handlung vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe „Jahwe“ gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֹתוֹ
  choice: ihm
  rationale: Das Pronomen bezieht sich auf Mose als den Empfänger des Befehls; das deutsche Verb „befehlen“ verlangt hier den Dativ.
- source_word: אֶת כָּל־בְּכֹר
  choice: alle Erstgeborenen
  rationale: Die Formulierung bewahrt den umfassenden Sinn der hebräischen Wendung. „Männlich“ wird nicht ergänzt, da es in diesem Vers nicht ausdrücklich steht.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: unter den Söhnen Israels
  rationale: Die Wiedergabe bewahrt den maskulinen Verwandtschaftsausdruck des Hebräischen; „unter“ entspricht der Präposition ב in diesem Zählungskontext.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ wahrt den Eigennamen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Geschlechtsspezifische Wendung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Verwandtschaftsbegriff בנים. Die Übersetzung erhält diese Formulierung; die geläufigere Sachwiedergabe „Israeliten“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist flüssig, bleibt aber nahe am hebräischen Aussagegang. Der Gottesname wird als „Jahwe“ wiedergegeben; die geschlechtsspezifische Ausgangsformulierung bleibt im Haupttext erhalten.
