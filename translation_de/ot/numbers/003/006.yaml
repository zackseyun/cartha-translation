  variant: modern standard German
source:
  edition: WLC
  text: הַקְרֵב֙ אֶת מַטֵּ֣ה לֵוִ֔י וְֽ/הַעֲמַדְתָּ֣ אֹת֔/וֹ לִ/פְנֵ֖י אַהֲרֹ֣ן הַ/כֹּהֵ֑ן וְ/שֵׁרְת֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: de
  text: Lass den Stamm Levi herantreten und stelle ihn vor Aaron, den Priester; sie sollen ihm dienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann sowohl persönlichen Hilfsdienst als auch kultischen Dienst bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: Lass … herantreten
  rationale: Der Hifil-Imperativ von קרב bedeutet, jemanden heranzubringen beziehungsweise herantreten zu lassen. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt den Gedanken der Annäherung.
- source_word: מַטֵּה לֵוִי
  choice: den Stamm Levi
  rationale: מַטֶּה bezeichnet hier nicht wörtlich einen Stab, sondern im Zusammenhang der Stammesordnung den Stamm Levi.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: und stelle ihn
  rationale: Der Hifil von עמד bedeutet hier »hinstellen« oder »aufstellen«. Das maskuline Singularpronomen nimmt den kollektiven Ausdruck »Stamm Levi« auf.
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: vor Aaron, den Priester
  rationale: לִפְנֵי bezeichnet am unmittelbarsten die Stellung vor beziehungsweise in der Gegenwart Aarons. Die Apposition entspricht natürlichem modernem Deutsch.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: sie sollen ihm dienen
  rationale: שרת bezeichnet persönlichen oder kultischen Dienst. Das Pronomen bezieht sich am natürlichsten auf Aaron; der Plural des Verbs greift die einzelnen Angehörigen des zuvor singularisch bezeichneten Stammes auf.
theological_decisions:
- issue: Art des Dienstes der Leviten für Aaron
  choice: Die Leviten werden Aaron zugeordnet und sollen ihm in seiner priesterlichen Aufgabe dienen.
  alternative: Die Leviten dienen gemeinsam mit Aaron, ohne dass ihr Dienst auf ihn ausgerichtet ist.
  rationale: Das direkte Objekt אֹתוֹ bezeichnet Aaron als Empfänger ihres Dienstes. Daher wird die Beziehung nicht zu einem bloßen gemeinsamen Dienst abgeschwächt; zugleich legt der Vers die konkreten Aufgaben noch nicht näher fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom singularischen Kollektiv »Stamm« zum pluralischen »sie« folgt bewusst dem Hebräischen und macht deutlich, dass die Leviten als Angehörige des Stammes handeln.
