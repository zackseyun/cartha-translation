source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: de
  text: Du sollst Aaron und seine Söhne einsetzen, und sie sollen über ihr Priesteramt wachen. Doch jeder Unbefugte[a], der sich nähert, soll getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Außenstehende«; gemeint ist hier jeder, der nicht zum priesterlichen Zugang oder Dienst befugt ist, nicht speziell ein Fremder anderer Herkunft.'
    reason: lexikalische Alternative und Klärung
lexical_decisions:
- source_word: תִּפְקֹד
  choice: du sollst … einsetzen
  rationale: פקד bezeichnet hier angesichts des direkten Objekts Aaron und seine Söhne sowie des folgenden Auftrags zur Wahrung des Priesteramts ihre Einsetzung beziehungsweise Beauftragung, nicht ihre Zählung.
- source_word: וְשָׁמְרוּ
  choice: sie sollen … wachen
  rationale: שׁמר bedeutet bewahren, hüten oder wachen. Die Formulierung beschreibt hier die verantwortliche Wahrung der Aufgaben und Grenzen des Priesteramts.
- source_word: כְּהֻנָּתָם
  choice: ihr Priesteramt
  rationale: Das Substantiv bezeichnet die priesterliche Funktion und Amtsausübung. „Priesteramt“ gibt dies im Deutschen natürlicher und eindeutiger wieder als das stärker kollektiv oder institutionell klingende „Priestertum“.
- source_word: הַזָּר
  choice: jeder Unbefugte
  rationale: זָר bezeichnet hier jemanden, der nicht zum priesterlichen Dienst beziehungsweise Zugang berechtigt ist, nicht einen ethnisch Fremden. „Unbefugte“ macht die kultische Nichtberechtigung verständlich, ohne ethnische Fremdheit einzutragen.
- source_word: הַקָּרֵב
  choice: der sich nähert
  rationale: Das Partizip von קרב bezeichnet das Herantreten an den vorbehaltenen heiligen Bereich oder Dienst. „Sich nähern“ bewahrt die konkrete, im Hebräischen nicht näher bestimmte Aussage.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Der Hofal von מות ist passiv-kausativ und hat hier rechtlich-sanktionsbezogene Kraft. Die Wiedergabe bezeichnet daher nicht bloß ein Sterben, sondern eine verhängte Tötung.
theological_decisions:
- issue: Beschränkung des Zugangs zum priesterlichen Dienst
  choice: Aaron und seine Söhne werden mit dem Priesteramt betraut; wer sich diesem Bereich unbefugt nähert, verfällt der Todesstrafe.
  alternative: Die Aussage kann allgemeiner auf jeden Nichtpriester bezogen werden, ohne dass dieser Vers allein die genauen räumlichen oder rituellen Grenzen festlegt.
  rationale: Der hebräische Text betont die autorisierte Wahrung des Priesteramts und die tödliche Folge unbefugter Annäherung. Die Übersetzung lässt offen, welche konkrete Form des Nahens gemeint ist, und fügt keine späteren ritual- oder konfessionsspezifischen Einzelheiten hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Einsetzen“ und „Priesteramt“ sind unmittelbar verständlich; „über … wachen“ bewahrt den Schutz- und Auftragscharakter von שׁמר. Der Rechtssatz bleibt knapp und ernst. Der Fußnotenmarker [a] steht unmittelbar beim erklärten Ausdruck.
