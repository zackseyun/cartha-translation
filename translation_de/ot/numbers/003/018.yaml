source:
  edition: WLC
  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹן לְ/מִשְׁפְּחֹתָ֑/ם לִבְנִ֖י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: de
  text: 'Und dies sind die Namen der Söhne Gerschons nach ihren Sippen: Libni und Schimi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Und dies sind
  rationale: Die Verbindung aus ו und dem Demonstrativpronomen leitet die folgende Aufzählung ein. „Und dies sind“ bewahrt den hebräischen Anschluss und klingt im Deutschen würdig und natürlich.
- source_word: שְׁמוֹת
  choice: die Namen
  rationale: Die Konstruktform wird zusammen mit „der Söhne Gerschons“ als „die Namen der …“ wiedergegeben.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: der Söhne Gerschons
  rationale: בְּנֵי bedeutet hier konkret „Söhne“; unmittelbar anschließend werden zwei männliche Nachkommen genannt. Der hebräische Name גֵרְשׁוֹן wird in der im Deutschen geläufigen Form „Gerschon“ wiedergegeben.
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im genealogischen und zensusbezogenen Zusammenhang eine größere Familien- oder Sippengruppe. „Nach ihren Sippen“ gibt sowohl die Einteilung als auch die Präposition ל angemessen wieder.
- source_word: לִבְנִי
  choice: Libni
  rationale: Der Personenname wird in einer dem Hebräischen nahen, im Deutschen etablierten Form wiedergegeben.
- source_word: וְ/שִׁמְעִי
  choice: und Schimi
  rationale: Der Personenname wird nach deutscher Laut- und Schreibkonvention als „Schimi“ wiedergegeben; die Konjunktion ו wird mit „und“ übersetzt.
theological_decisions: []
translation_notes:
  register: Moderner, klarer und würdiger Standardstil. Die knappe genealogische Listenform des Hebräischen bleibt erhalten; „Sippen“ vermeidet die mögliche Verengung von מִשְׁפָּחָה auf die moderne Kernfamilie.
