  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzfolge, den Besitzanspruch לִי, die zeitliche Rückbindung an die Tötung der ägyptischen Erstgeburt, die Heiligung/Aussonderung und die Spannweite Mensch–Vieh im Wesentlichen zutreffend wieder. Die Formulierung „Mir sollen sie gehören“ schwächt jedoch das einfache hebräische Futurum יִהְיוּ לִי („sie werden mir gehören“) durch einen im Deutschen stärker verpflichtend-normativen Beiklang von „sollen“ ab.
  naturalness: Modernes Standarddeutsch und würdiger Register sind überwiegend gelungen. „Sie sollen mir gehören“ ist natürlicher als die Voranstellung „Mir sollen sie gehören“ und entspricht zugleich enger der hebräischen Aussage.
  terminology: „Jahwe“ ist konsistent mit der maßgeblichen englischen POB-Entscheidung. „heiligte ich mir“ bewahrt den kultischen Charakter von הִקְדַּשְׁתִּי und den Besitzbezug, ist aber leicht markiert; als bibelsprachliche, verständliche Formulierung ist sie vertretbar. „Alles Erstgeborene“ ist als Kollektiv sachgerecht. Die Fußnote verankert nur die erste der drei Besitzformulierungen, obwohl sie die Wiederkehr erklärt; das ist ausreichend, aber die Fußnote sollte die deutsche Variation präziser beschreiben.
  issues:
