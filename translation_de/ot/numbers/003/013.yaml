    issue: „Mir sollen sie gehören“ für יִהְיוּ לִי
    rationale: Das hebräische Imperfekt ist hier eine deklarative Zukunfts- bzw. Bestandsaussage. Deutsches „sollen“ kann eine Anordnung oder Verpflichtung nahelegen. „Sie werden mir gehören“ gibt die Aussage ohne diesen Zusatzton wieder.
  - severity: low
    issue: Fußnote a beschreibt die dreifache hebräische Wendung nicht ganz präzise im Blick auf die deutsche Wiedergabe.
    rationale: Die deutsche Übersetzung variiert die drei Vorkommen idiomatisch. Die Anmerkung sollte klar sagen, dass לִי dreimal erscheint und den göttlichen Anspruch hervorhebt, statt eine alternative Gesamtformulierung in den Vordergrund zu stellen.
  revised_text: Denn mir gehört alles Erstgeborene.[a] An dem Tag, als ich alles Erstgeborene im Land Ägypten schlug, heiligte ich mir alles Erstgeborene in Israel, vom Menschen bis zum Vieh. Sie werden mir gehören. Ich bin Jahwe.
  revised_footnotes:
