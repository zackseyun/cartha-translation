source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: de
  text: Denn mir gehört alles Erstgeborene.[a] An dem Tag, als ich alles Erstgeborene im Land Ägypten schlug, heiligte ich mir alles Erstgeborene in Israel, vom Menschen bis zum Vieh. Sie werden mir gehören. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ist die hebräische Wendung »mir« beziehungsweise »mein« im Vers dreimal gesetzt; sie betont Jahwes Anspruch auf alles Erstgeborene.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage über die Leviten ein und bewahrt den erklärenden Zusammenhang.
- source_word: לִי
  choice: mir gehört / mir / Mir sollen sie gehören
  rationale: Die dreimalige Formulierung betont Jahwes Anspruch. Die variierte deutsche Wiedergabe bewahrt diese Wiederholung in natürlicher Syntax.
- source_word: כָּל בְּכוֹר
  choice: alles Erstgeborene
  rationale: Gibt die umfassende kollektive Bedeutung wieder, ohne das im Hebräischen hier nicht ausdrücklich genannte Merkmal »männlich« hinzuzufügen.
- source_word: בְּיוֹם
  choice: An dem Tag, als
  rationale: Bewahrt die ausdrückliche zeitliche Verknüpfung und klingt im modernen Deutschen natürlich.
- source_word: הַכֹּתִי
  choice: ich ... schlug
  rationale: נכה bezeichnet hier das tödliche Schlagen der ägyptischen Erstgeburt. Im Kontext ist »schlug« eindeutig und wahrt die knappe, feierliche Ausdrucksweise.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Behält die im Ausgangstext ausdrücklich vorhandene volle geografische Bezeichnung bei.
- source_word: הִקְדַּשְׁתִּי
  choice: heiligte ich mir
  rationale: Die Hifil-Form von קדשׁ bedeutet, etwas für Gott als heilig auszusondern. »Heiligte« wahrt den kultischen Gehalt und die Verbindung mit dem wiederholten לִי.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Gibt den Bereich der Heiligung knapp und formal entsprechend dem Hebräischen wieder.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: vom Menschen bis zum Vieh
  rationale: Bewahrt die Spannweite der merismatischen Wendung von menschlichen bis zu tierischen Erstgeborenen; »Mensch« ist im heutigen Deutsch inklusiv und »Vieh« passt zur Tierkategorie im Kontext.
- source_word: יִהְיוּ
  choice: sollen sie gehören
  rationale: Drückt den fortdauernden göttlichen Anspruch aus; »sollen« bewahrt den deklarativen beziehungsweise normativen Zug, ohne die Aussage auf eine bloße Zukunftsprognose zu reduzieren.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Gibt den ausdrücklich gesetzten Gottesnamen als Eigennamen wieder und bewahrt die abschließende Autoritätsformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottes persönlichen Bundesnamen. »Jahwe« macht diesen Namen im deutschen Haupttext sichtbar.
- issue: Wiedergabe von אָדָם in der Mensch-Tier-Spannweite
  choice: Mensch
  alternative: Mann
  rationale: אָדָם bezeichnet hier die menschliche Kategorie im Gegensatz zum Vieh, nicht speziell erwachsene Männer. »Mensch« erhält die kollektive und geschlechtsübergreifende Bedeutung.
- issue: Bedeutung der Heiligung der Erstgeburt
  choice: heiligte ich mir
  alternative: sonderte ich für mich aus
  rationale: »Heiligte« hält den kultisch-theologischen Gehalt von קדשׁ fest, während »mir« zugleich den göttlichen Besitzanspruch ausdrückt; die Formulierung legt nicht näher fest, wie dieser Anspruch in jedem Einzelfall vollzogen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau und Wiederholungsstruktur des Hebräischen. »Alles Erstgeborene« dient kollektiv für sämtliche Erstgeborenen. Der Gottesname wird als »Jahwe« wiedergegeben.
