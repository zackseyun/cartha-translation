  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: de
  text: Du sollst je fünf Schekel nehmen[a], nach dem Schekel des Heiligtums[b]; ein Schekel entspricht zwanzig Gera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fünf Schekel je Kopf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: nach dem im Heiligtum geltenden Gewichtsstandard.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Du sollst … nehmen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Anweisungskontext direktiven Sinn; „sollst“ bewahrt den rechtlich-instruktiven Ton.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: je fünf Schekel
  rationale: Die Wiederholung der Zahl drückt eine Verteilung aus. „Je fünf“ gibt diese Funktion im heutigen Deutsch natürlich wieder.
- source_word: לַגֻּלְגֹּלֶת
  choice: pro Kopf
  rationale: Wörtlich „für den Kopf/Schädel“; hier ist es eine feste Wendung für den Betrag je Person. „Pro Kopf“ erhält das konkrete Bild und den distributiven Sinn.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Wendung bezeichnet den im Heiligtum geltenden Gewichtsstandard. Die Übersetzung hält sowohl den Maßstab als auch den kultischen Bezug fest.
- source_word: תִּקָּח … הַשָּׁקֶל
  choice: ein Schekel entspricht
  rationale: Obwohl תִּקָּח formal „du sollst nehmen“ bedeutet, dient die Schlusskonstruktion im Kontext zur Bestimmung des anzuwendenden Schekelgewichts. Idiomatisches Deutsch gibt dies als Gleichsetzung wieder.
- source_word: עֶשְׂרִים גֵּרָה
  choice: zwanzig Gera
  rationale: Die hebräische Gewichtseinheit wird als Fachbegriff transliteriert; im Deutschen bleibt die Einheitenbezeichnung nach einer Zahl unverändert.
