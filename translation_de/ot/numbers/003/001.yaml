reference: Numbers 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: de
  text: Dies ist die Geschlechterfolge Aarons und Moses[a] zu der Zeit[b], als Jahwe mit Mose[c] auf dem Berg Sinai redete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Nachkommen Aarons und Moses“. Das hebräische Wort ist eine übliche Überschriftsformel und kann eine Abstammungslinie oder das bezeichnen, was aus jemandem hervorgeht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an dem Tag“; gemeint ist hier „zu der Zeit“ oder einfach „als“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu Mose“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies ist
  rationale: Die hebräische Einleitungsformel eröffnet einen neuen Abschnitt. Im Deutschen richtet sich das Verb idiomatisch nach dem singularischen Prädikatsnomen „Geschlechterfolge“; das vorangestellte וְ wird nicht eigens mit „und“ wiedergegeben.
- source_word: תּוֹלְדֹת
  choice: Geschlechterfolge
  rationale: Der Ausdruck kann eine Abstammungslinie, Nachkommenschaft oder das aus einer Person Hervorgegangene bezeichnen. „Geschlechterfolge“ bewahrt den formelhaften Charakter der Überschrift, ohne sie vorschnell auf die im Folgenden genannten Nachkommen Aarons zu verengen.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: Aarons und Moses
  rationale: Beide Namen werden wie im Ausgangstext beibehalten, obwohl die anschließende Aufzählung vor allem Aarons Söhne betrifft.
- source_word: בְּיוֹם
  choice: zu der Zeit
  rationale: Wörtlich steht „an dem Tag“; in dieser Konstruktion ist dies eine Zeitangabe im Sinn von „zu der Zeit, als“ oder „als“.
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: mit Mose redete
  rationale: Die Verbindung kann sowohl als „mit Mose reden“ als auch als „zu Mose reden“ wiedergegeben werden. Die gewählte Form erhält die mögliche wechselseitige Färbung, ohne die Alternative auszuschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּהַר סִינָי
  choice: auf dem Berg Sinai
  rationale: Die Ortsangabe wird räumlich präzise und in natürlichem Standarddeutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. Seine Wiedergabe als „Jahwe“ wahrt diesen Befund, statt den Namen durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תּוֹלְדֹת bei einer Überschrift, die Aaron und Mose nennt
  choice: Geschlechterfolge Aarons und Moses
  alternative: Nachkommen Aarons und Moses
  rationale: Die formelhafte Wiedergabe erhält die Spannung, dass beide Männer genannt werden, obwohl die folgenden Verse in erster Linie Aarons Söhne aufführen. „Nachkommen“ würde die Überschrift stärker festlegen, als es der hebräische Ausdruck verlangt.
- issue: Richtung beziehungsweise Gegenseitigkeit des Redens
  choice: mit Mose redete
  alternative: zu Mose redete
  rationale: Die Konstruktion דִּבֶּר אֶת־ kann im Kontext als Reden mit oder zu einer Person verstanden werden. Der Haupttext wählt „mit“, während die Fußnote die ebenso mögliche deutsche Wiedergabe nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Wendung „Geschlechterfolge“ wahrt den Charakter der hebräischen Abschnittsüberschrift; die übrige Syntax bleibt flüssig und allgemein verständlich.
