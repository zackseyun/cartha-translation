lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: zählte
  rationale: פקד bezeichnet in diesem Zusammenhang die Erfassung bei einer Zählung. „zählte“ ist im modernen Deutschen klar und passt zur Zählung der Leviten.
- source_word: אֹתָם
  choice: sie
  rationale: Das direkte Objekt verweist auf die im Kontext genannten Leviten.
- source_word: עַל פִּי יְהוָה
  choice: auf Befehl Jahwes
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund Jahwes“, bezeichnet hier aber idiomatisch das Handeln aufgrund seines Befehls.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Formulierung drückt die genaue Übereinstimmung der Handlung mit dem zuvor erteilten Gebot aus.
- source_word: צֻוָּה
  choice: es ihm geboten worden war
  rationale: Die Pualform ist passiv. Das Plusquamperfekt macht im Deutschen deutlich, dass der Befehl der Zählung vorausging; der Empfänger ist aus dem Kontext Mose.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Haupttextfassung bewahrt den Befehlscharakter; die Fußnote dokumentiert das konkrete hebräische Bild.
