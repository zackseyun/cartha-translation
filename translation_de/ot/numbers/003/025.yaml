  to: Und die Aufgabe[a] der Söhne Gerschons im Zelt der Begegnung umfasste die Wohnstätte, das Zelt, seine Abdeckung und den Vorhang[b] für den Eingang des Zeltes der Begegnung.
  rationale: Die Revision gibt die lokative Präposition mit „im“ wieder, ersetzt das missverständliche „Decke“ durch „Abdeckung“ und verwendet „Wohnstätte“, um die kultische Bedeutung von מִשְׁכָּן sowie dessen Unterscheidung von אֹהֶל zu bewahren. Die deutsche Satzform bleibt modern und dem hebräischen Aufzählungscharakter angemessen. Fußnoten sind an den lexikalisch diskutierten Begriffen ergänzt.
