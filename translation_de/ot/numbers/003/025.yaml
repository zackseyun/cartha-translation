base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: de
  text: Und die Aufgabe[a] der Söhne Gerschons im Zelt der Begegnung umfasste die Wohnstätte, das Zelt, seine Abdeckung und den Vorhang[b] für den Eingang des Zeltes der Begegnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienst“ oder „Verantwortungsbereich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Schirm“; gemeint ist ein aufgehängter Abschluss am Eingang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: Aufgabe
  rationale: Im Zusammenhang der levitischen Dienstordnung bezeichnet das Wort den anvertrauten Verantwortungsbereich. „Aufgabe“ ist im modernen Deutschen natürlich und leitet die folgende Aufzählung passend ein.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: die Söhne Gerschons
  rationale: Die Wiedergabe bewahrt die familiäre Ausdrucksweise des Hebräischen; „die Gerschoniter“ wäre ebenfalls möglich.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: Die Präposition bezeichnet hier am ehesten den Ort beziehungsweise Dienstbereich. „Zelt der Begegnung“ gibt den hebräischen Ausdruck transparent und verständlich wieder.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: „Wohnung“ bildet die Grundbedeutung von מִשְׁכָּן ab und bezeichnet hier das Heiligtum beziehungsweise dessen inneren Bau. Der traditionelle Ausdruck „Stiftshütte“ könnte die anschließende Unterscheidung vom Zelt verwischen.
- source_word: וְהָאֹהֶל
  choice: das Zelt
  rationale: Die eigenständige Wiedergabe erhält die Aufzählung und die im Hebräischen erkennbare Unterscheidung zwischen Wohnung und Zelt.
- source_word: מִכְסֵהוּ
  choice: seine Decke
  rationale: Das Suffix bezieht sich grammatisch am natürlichsten auf das unmittelbar vorausgehende Zelt. „Decke“ bezeichnet hier dessen schützende Abdeckung.
- source_word: מָסַךְ
  choice: Vorhang
  rationale: Das Wort bezeichnet einen aufgehängten Sicht- oder Abschlussvorhang an einem Eingang. „Vorhang“ ist im Deutschen anschaulich und natürlich.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: „Am Eingang“ drückt die Lage und Funktion des Vorhangs idiomatisch aus, ohne die Beziehung unnötig festzulegen.
