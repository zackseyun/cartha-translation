  naturalness: „Aufgabe ... umfasste“ ist idiomatisch und bewahrt die listenartige Struktur. „Wohnstätte“ ist als kultischer, zugleich verständlicher Ausdruck natürlicher und genauer als das im heutigen Deutsch stark alltagssprachliche „Wohnung“.
  terminology: „Zelt der Begegnung“, „Söhne Gerschons“ und „Vorhang“ sind angemessen. „Wohnstätte“ und „Zelt“ halten die im Hebräischen vorhandene terminologische Unterscheidung aufrecht. Die Fußnoten übernehmen die relevanten lexikalischen Alternativen der englischen Audit-Spur und sind an den entsprechenden Wörtern verankert.
