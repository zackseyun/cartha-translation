  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: de
  text: Und du sollst das Silber Aaron und seinen Söhnen geben, als Auslösungsgeld für die unter ihnen Überzähligen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher möglich: „für die Ausgelösten der unter ihnen Überzähligen“. Das Hebräische verwendet eine knappe Genitivverbindung; im Zusammenhang bezeichnet das Silber die für die Überzähligen zu entrichtende Auslösung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Und du sollst … geben
  rationale: Das Qal Perfekt 2. Person maskulin Singular mit וְ setzt im Anweisungskontext die Handlungsfolge fort und hat direktiven Sinn.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: כֶּסֶף bezeichnet wörtlich Silber und kann daraus abgeleitet Geld meinen. Hier bleibt „Silber“ quellennah und ist im Zusammenhang einer Zahlung verständlich.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Aaron und seinen Söhnen
  rationale: Die Präposition לְ wird im Deutschen durch den Dativ wiedergegeben. „Söhne“ bezeichnet hier konkret Aarons männliche priesterliche Nachkommen.
- source_word: פְּדוּיֵי
  choice: als Lösegeld für
  rationale: Die konstruktverbundene Pluralform von פדה ist stark verdichtet und kann auf die Ausgelösten beziehungsweise auf den für sie entrichteten Auslösungsbetrag bezogen werden. Da das Silber übergeben wird, gibt „als Lösegeld für“ den Zusammenhang natürlich wieder.
- source_word: הָעֹדְפִים
  choice: die überzählig sind
  rationale: Das Partizip bezeichnet diejenigen, deren Zahl über die Vergleichszahl hinausgeht, hier die Erstgeborenen, die die Zahl der Leviten übersteigen.
- source_word: בָּהֶם
  choice: unter ihnen
  rationale: בְּ mit dem Pronomen bezeichnet hier die Zugehörigkeit innerhalb der gezählten Gruppe und wird idiomatisch mit „unter ihnen“ wiedergegeben.
