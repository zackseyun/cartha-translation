  yaml_path: translation/ot/numbers/003/044.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH. Traditionell wird der Gottesname in deutschen Bibelübersetzungen mit „der HERR“ wiedergegeben; alternativ wird er als „Jahwe“ transkribiert.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol führt die Erzählung fort. „Sprach“ ist die übliche, formgerechte Wiedergabe von דבר in dieser Redeeinleitung und unterscheidet es von אמר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im Deutschen üblichen wissenschaftlichen Umschrift, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten des Sprechens; „zu Mose“ ist im Deutschen natürlich und präzise.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet den Inhalt der folgenden Gottesrede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt dieselbe Funktion, ohne die schwerfällige Formel „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Redeeinleitung bleibt erhalten; לֵאמֹר wird idiomatisch durch den Doppelpunkt ausgedrückt.
