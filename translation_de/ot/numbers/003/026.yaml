  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: de
  text: und die Behänge des Vorhofs[a], den Vorhang für den Eingang zum Vorhof, der Wohnung und Altar ringsum umgibt, sowie dessen Seile[b] für alle damit verbundenen Dienste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vorhänge des Vorhofs«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Schnüre«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: Behänge
  rationale: Bezeichnet die Stoffbahnen, die den Vorhof umschlossen. »Behänge« ist in diesem Heiligtumskontext präzise und weniger häuslich als »Gardinen« oder »Vorhänge«.
- source_word: חָצֵר
  choice: Vorhof
  rationale: Bezeichnet den umschlossenen Bereich um die Wohnung und den Altar; »Vorhof« ist im Heiligtumskontext klar und im Deutschen geläufig.
- source_word: מָסַךְ
  choice: Vorhang
  rationale: Gemeint ist ein textiler Abschluss am Eingang. »Vorhang« ist natürliches modernes Deutsch und wird durch die Bezeichnung der übrigen Stoffbahnen als »Behänge« ausreichend unterschieden.
- source_word: פֶּתַח
  choice: Eingang
  rationale: Gibt die Öffnung beziehungsweise den Zugang wieder, ohne ein festes Tor anzudeuten.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: der die Wohnung und den Altar ringsum umgibt
  rationale: Der Relativsatz beschreibt den Vorhof als räumliche Umgrenzung von Wohnung und Altar. »ringsum umgibt« gibt סָבִיב idiomatisch wieder, ohne עַל mechanisch zu übersetzen.
- source_word: מִשְׁכָּן
  choice: Wohnung
  rationale: Bewahrt die Grundbedeutung des hebräischen Begriffs für das heilige Zeltheiligtum und entspricht der würdigen deutschen Bibelsprache.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: Die übliche und eindeutige deutsche Entsprechung.
- source_word: מֵיתָרָיו
  choice: seine Seile
  rationale: Gibt den pronominalen Bezug des Hebräischen möglichst formal wieder und bezeichnet die zur Befestigung dienenden Seile.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: für alle damit verbundenen Arbeiten
  rationale: Gibt den gesamten Dienst beziehungsweise die an der Anlage auszuführenden Aufgaben in natürlichem Deutsch wieder, ohne den im Hebräischen nicht völlig eindeutigen Bezug des Suffixes unnötig festzulegen.
theological_decisions:
- issue: Bezug der singularischen Suffixe in מֵיתָרָיו und עֲבֹדָתוֹ
  choice: Der erste pronominale Bezug bleibt als »seine« erhalten; der zweite wird mit »damit verbundenen« offen auf den beschriebenen Heiligtumskomplex bezogen.
  alternative: »die dazugehörigen Seile für seinen gesamten Dienst«
  rationale: Im Hebräischen ist der genaue Rückbezug nicht ausdrücklich aufgelöst. Die Übersetzung vermeidet eine dogmatisch oder sachlich unnötige Festlegung, auch wenn das deutsche »seine« wegen des unmittelbar vorausgehenden »Altar« lokal mehrdeutig bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger Heiligtumsterminologie. Der Vers bleibt als syntaktische Fortsetzung des vorausgehenden Satzes kleingeschrieben. Die Fußnoten bewahren naheliegende lexikalische Alternativen.
