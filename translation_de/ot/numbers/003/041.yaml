id: NUM.3.41
reference: Numbers 3:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: de
  text: Und du sollst die Leviten für mich nehmen – ich bin Jahwe – anstelle jedes Erstgeborenen unter den Söhnen Israels[a], ebenso das Vieh der Leviten anstelle jedes erstgeborenen Tieres unter dem Vieh der Söhne Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter den Israeliten«. Wörtlich steht im Hebräischen: »unter den Söhnen Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Und du sollst … nehmen
  rationale: Das Qal Perfekt 2. Person Singular mit וְ hat im anweisenden Zusammenhang direktiven Sinn; „du sollst“ wahrt den rechtlich-feierlichen Ton.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche deutsche Bezeichnung der von Levi abstammenden Gruppe; der bestimmte Artikel bleibt erhalten.
- source_word: לִי
  choice: für mich
  rationale: Die Präposition bezeichnet hier Zugehörigkeit beziehungsweise Weihe; „für mich“ ist im Deutschen natürlich und kontextgerecht.
- source_word: אֲנִי יְהוָה
  choice: ich bin Jahwe
  rationale: Die Selbstvorstellungsformel bleibt als emphatische göttliche Aussage erhalten; der Gottesname wird als Eigenname wiedergegeben.
- source_word: תַּחַת
  choice: anstelle
  rationale: Im Zusammenhang von Zählung und Auslösung bezeichnet das Wort eine Stellvertretung beziehungsweise Ersetzung.
- source_word: כָּל בְּכֹר
  choice: jedes Erstgeborenen
  rationale: כָּל mit einem singularischen Substantiv ist distributiv; wegen „anstelle“ steht die deutsche Form im Genitiv.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: unter den Söhnen Israels
  rationale: Die Formulierung gibt das hebräische בְּנֵי יִשְׂרָאֵל formal wieder und bewahrt die sprachliche Bildwelt der Abstammungsbezeichnung.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: das Vieh der Leviten
  rationale: בְּהֵמָה bezeichnet hier kollektiv die domestizierten Tiere der Leviten; „Vieh“ ist knapp und idiomatisch.
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: jedes erstgeborenen Tieres unter dem Vieh der Söhne Israels
  rationale: Die Ergänzung „Tieres“ macht die substantivische Beziehung im Deutschen eindeutig und bewahrt zugleich die Parallelität des Satzes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Kinder Israels
  rationale: Die gewählte Form bewahrt die grammatisch maskuline Abstammungsbezeichnung des Hebräischen. Eine Fußnote nennt die natürliche nationale Entsprechung, ohne die Quellform im Haupttext einzuebnen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit einem leicht rechtlich-feierlichen Ton. Der Gedankenstrich hebt die eingeschobene göttliche Selbstvorstellung hervor. „Ebenso“ bildet das zweite וְ natürlich ab und verdeutlicht die parallele Zuordnung, ohne zusätzliche Sachinformation einzuführen.
