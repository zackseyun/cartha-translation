  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: de
  text: Die Zahl ihrer Gemusterten[a] – aller männlichen Personen im Alter von einem Monat und darüber – betrug siebentausendfünfhundert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Gemusterten“ oder „die unter ihnen Gezählten“. Der hebräische Text wiederholt diesen Ausdruck in diesem Vers zweimal; die Wiederholung ist im deutschen Satzbau geglättet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die bei ihnen Gemusterten
  rationale: Die Form bezeichnet die bei einer Zählung beziehungsweise Musterung erfassten Personen. „Gemusterte“ bewahrt den amtlichen Zensuscharakter besser als das allgemeinere „Gezählte“.
- source_word: בְּמִסְפַּר
  choice: die Zahl
  rationale: Die hebräische Angabe zur zahlenmäßigen Erfassung wird in natürlichem Deutsch in die Wendung „Die Zahl … betrug“ eingebunden.
- source_word: כָּל זָכָר
  choice: alle männlichen Personen
  rationale: Die Wiedergabe hält die ausdrücklich männliche Bezugsgruppe fest und passt zum Kontext einer Volkszählung.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: von einem Monat an
  rationale: Dies ist eine knappe, natürliche deutsche Wiedergabe der Altersgrenze „vom Sohn eines Monats und darüber“.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: siebentausendfünfhundert
  rationale: Die ausgeschriebene Zahl entspricht dem hebräischen Zahlwort und ist in fortlaufender Bibelprosa gut lesbar.
