  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Zähle alle männlichen Erstgeborenen unter den Söhnen Israels, die einen Monat alt oder älter sind, und erfasse sie namentlich[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und erhebe die Zahl ihrer Namen“; gemeint ist eine namentliche Erfassung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens JHWH bewahrt den Eigennamen im Haupttext.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativpräteritum mit Waw führt die Handlung weiter; „Da sagte“ klingt im Deutschen natürlich und gibt die Abfolge wieder.
- source_word: פְּקֹד
  choice: Zähle
  rationale: Der Imperativ bezeichnet in diesem Zusammenhang das zahlenmäßige Erfassen im Rahmen einer Zählung.
- source_word: כָּל בְּכֹר זָכָר
  choice: alle männlichen Erstgeborenen
  rationale: „Erstgeborene“ gibt בְּכוֹר wieder, während „männlich“ die ausdrückliche Geschlechtsangabe זָכָר bewahrt.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: unter den Söhnen Israels
  rationale: Die Formulierung erhält das konkrete hebräische „Söhne Israels“; „unter“ entspricht dem Sinn der Auswahl aus dieser Gruppe.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: die einen Monat alt oder älter sind
  rationale: Die natürliche deutsche Altersangabe gibt die untere Altersgrenze des hebräischen Idioms präzise wieder.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: und erfasse sie namentlich
  rationale: Die wörtlich schwer verständliche Wendung „die Zahl ihrer Namen erheben“ bezeichnet eine namentliche Erfassung; die Übersetzung gibt den idiomatischen Sinn klar wieder.
