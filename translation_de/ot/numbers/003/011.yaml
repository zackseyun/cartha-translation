  yaml_path: translation/ot/numbers/003/011.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ gibt den Fortgang im modernen Deutschen natürlich wieder; „sprach“ bewahrt den formelhaften Charakter von דבר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Wiedergabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende wörtliche Rede ein. Im heutigen Deutschen erfüllt der Doppelpunkt diese Funktion idiomatischer als das formelhafte „und sagte“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung gegenüber einem bloßen Titel, ohne eine konfessionelle Sonderdeutung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird natürlich wiedergegeben; der Doppelpunkt verweist auf die in Vers 12 folgende Rede.
