  text: מֵ/אֵ֗ת בְּכ֛וֹר בְּנֵ֥י יִשְׂרָאֵ֖ל לָקַ֣ח אֶת הַ/כָּ֑סֶף חֲמִשָּׁ֨ה וְ/שִׁשִּׁ֜ים וּ/שְׁלֹ֥שׁ מֵא֛וֹת וָ/אֶ֖לֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: de
  text: 'Von den Erstgeborenen der Söhne Israels[a] nahm er das Silber: 1.365 Schekel, nach dem Schekel des Heiligtums[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von den Erstgeborenen der Israeliten“. Wörtlich steht im Hebräischen: „die Erstgeborenen der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: nach dem beim Heiligtum geltenden Gewichtsstandard.'
    reason: clarification
lexical_decisions:
- source_word: מֵאֵת
  choice: von
  rationale: Die Präposition bezeichnet hier die Personen, von denen Mose das Silber nahm. „Von“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: den Erstgeborenen der Söhne Israels
  rationale: Das singularische בְּכוֹר steht kollektiv. Der Plural „den Erstgeborenen“ macht diese kollektive Bedeutung im Deutschen verständlich, während „Söhne Israels“ die hebräische Ausdrucksweise und den männlichen Bezug des Zählungs- und Auslösungskontexts wahrt.
- source_word: לָקַח
  choice: nahm er
  rationale: „Nehmen“ entspricht der Grundbedeutung des Verbs und hält den Vorgang bewusst neutral; „empfangen“ wäre kontextuell möglich, aber stärker deutend.
- source_word: הַכָּסֶף
  choice: das Silber
  rationale: כֶּסֶף bezeichnet wörtlich Silber und kann zugleich Zahlungsmittel meinen. Da anschließend das Gewicht in Schekeln angegeben wird, ist „Silber“ sachlich und idiomatisch passend.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: '1.365'
  rationale: Die hebräischen Zahlbestandteile ergeben 1.365. Die übliche deutsche Ziffernschreibung stellt die Summe übersichtlich dar.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Wendung bezeichnet den beim Heiligtum geltenden Gewichtsstandard. „Nach“ gibt die maßgebliche Norm wieder, ohne daraus eine besondere Münzsorte zu machen.
theological_decisions:
- issue: Kollektive Bedeutung des singularischen „Erstgeborenen“
  choice: Plural „den Erstgeborenen“ im Haupttext
  alternative: Singular „dem Erstgeborenen“
  rationale: Der Zusammenhang handelt von der Gesamtheit der überzähligen Erstgeborenen, sodass der grammatische Singular kollektiv verstanden werden muss. Der deutsche Plural vermittelt den Referenzumfang, ohne eine zusätzliche theologische Festlegung einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau bleibt nah am Hebräischen, wird aber durch den Doppelpunkt vor der Gewichtsangabe natürlich gegliedert. „Schekel“ bleibt als historische Gewichtseinheit unübersetzt.
