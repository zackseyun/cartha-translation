  text: וַ/יְהִי֩ כָל בְּכ֨וֹר זָכָ֜ר בְּ/מִסְפַּ֥ר שֵׁמ֛וֹת מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה לִ/פְקֻדֵי/הֶ֑ם שְׁנַ֤יִם וְ/עֶשְׂרִים֙ אֶ֔לֶף שְׁלֹשָׁ֥ה וְ/שִׁבְעִ֖ים וּ/מָאתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: de
  text: Die Gesamtzahl aller männlichen Erstgeborenen im Alter von einem Monat an, die namentlich erfasst worden waren[a], betrug nach ihrer Zählung[b] 22.273.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „nach der Zahl der Namen“; gemeint ist, dass jeder Einzelne namentlich registriert wurde.
    reason: cultural_note
  - marker: b
    text: 'Oder: „nach ihrer Erfassung“. Das hebräische Wort bezeichnet hier die amtliche Zählung der Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: beliefen sich
  rationale: Die Form leitet das Ergebnis der Zählung ein. Mit dem pluralischen Sammelbezug ist „beliefen sich“ im Deutschen natürlich und gibt den festgestellten Gesamtbestand wieder.
- source_word: כָל בְּכוֹר זָכָר
  choice: alle männlichen Erstgeborenen
  rationale: Bewahrt sowohl die umfassende Aussage als auch die Bestimmung nach Geschlecht und Geburtsrang in idiomatischem Deutsch.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: die namentlich erfasst wurden
  rationale: Die wörtliche Wendung „nach der Zahl der Namen“ ist eine Zensusformel und bezeichnet die individuelle Registrierung nach Namen. Die gewählte Form gibt diesen Sinn verständlich wieder.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: im Alter von einem Monat an
  rationale: Gibt die untere Altersgrenze der Zählung präzise und in natürlichem modernem Deutsch wieder.
- source_word: לִפְקֻדֵיהֶם
  choice: nach ihrer Zählung
  rationale: Bezeichnet die amtliche Erfassung beziehungsweise den bei der Musterung festgestellten Bestand der Gruppe, ohne die Wendung nur wegzulassen.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: '22.273'
  rationale: Die hebräische Zahl setzt sich aus 22.000 sowie 200 + 70 + 3 zusammen und ergibt 22.273. Damit wird ein Zahlenfehler der englischen Konsultationsfassung nicht übernommen.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die beiden hebräischen Zensusausdrücke bleiben unterscheidbar: namentliche Registrierung einerseits und amtlich festgestellter Gesamtbestand andererseits. Die Zahl folgt unmittelbar dem hebräischen Text und lautet 22.273, nicht 22.373.'
