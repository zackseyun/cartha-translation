source:
  edition: WLC
  text: וְ/אֵת֙ פְּדוּיֵ֣י הַ/שְּׁלֹשָׁ֔ה וְ/הַ/שִּׁבְעִ֖ים וְ/הַ/מָּאתָ֑יִם הָ/עֹֽדְפִים֙ עַל הַ/לְוִיִּ֔ם מִ/בְּכ֖וֹר בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: de
  text: Und als Lösegeld für die 273 von den Erstgeborenen der Söhne Israels, die über die Zahl der Leviten hinausgehen,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Ausgelösten unter den 273“. Die hebräische Form lässt sich wörtlicher auf die ausgelösten Personen beziehen; im unmittelbaren Zusammenhang ist jedoch das Lösegeld für die überzähligen Erstgeborenen gemeint (Verse 47–48).'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: als Lösegeld für
  rationale: Die Form gehört zu פדה („auslösen, freikaufen“). Im unmittelbaren Zusammenhang geht es um den zu entrichtenden Betrag für die überzähligen Erstgeborenen (V. 47–48). „Lösegeld“ gibt diesen Sinn im Deutschen knapp und natürlich wieder, ohne die mögliche wörtlichere Deutung zu verschweigen.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: Die im Hebräischen additiv ausgedrückte Zahl wird als übliche deutsche Ziffer wiedergegeben; die genaue Menge bleibt unverändert.
- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: die über die Zahl der Leviten hinausgehen
  rationale: Das Partizip bezeichnet diejenigen, die zahlenmäßig über die als Ersatz verfügbaren Leviten hinausgehen. Die Ergänzung „die Zahl“ macht den Vergleich im Deutschen eindeutig und idiomatisch.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: von den Erstgeborenen der Söhne Israels
  rationale: „Von den“ gibt die partitive Bedeutung von מִן wieder. „Söhne Israels“ bewahrt die formale Bundesbezeichnung בְּנֵי יִשְׂרָאֵל und den Bezug auf die männlichen Erstgeborenen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bleibt entsprechend dem hebräischen Zusammenhang syntaktisch offen und wird im folgenden Vers fortgeführt. Die Formulierung „über die Zahl … hinausgehen“ vermeidet das missverständliche räumliche „über“ und bewahrt den zahlenmäßigen Vergleich.
