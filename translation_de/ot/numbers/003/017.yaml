lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Das waren
  rationale: Das Wayyiqtol von היה dient hier als einfache Vergangenheitskopula zur Einleitung der Namensliste; eine Zustandsveränderung ist nicht gemeint.
- source_word: אֵלֶּה
  choice: Das
  rationale: Das Demonstrativpronomen verweist voraus auf die anschließend genannten Personen. Zusammen mit וַיִּהְיוּ ergibt sich im Deutschen natürlich „Das waren“.
- source_word: בְנֵי לֵוִי
  choice: die Söhne Levis
  rationale: Gemeint sind hier Levis drei unmittelbare Söhne; daher ist „Söhne“ genauer als das allgemeinere „Nachkommen“.
- source_word: בִּשְׁמֹתָם
  choice: mit ihren Namen
  rationale: Die Wendung bezeichnet die namentliche Aufführung der Söhne. „Mit ihren Namen“ wahrt die hebräische Ausdrucksweise, ohne im Deutschen unverständlich zu sein.
- source_word: גֵּרְשׁוֹן
  choice: Gerschon
  rationale: Der Personenname wird in einer im Deutschen etablierten, aussprachenahen Form wiedergegeben.
- source_word: קְהָת
  choice: Kehat
  rationale: „Kehat“ ist die gebräuchliche deutsche Namensform und liegt dem hebräischen קְהָת nahe.
- source_word: מְרָרִי
  choice: Merari
  rationale: Der Personenname wird in der etablierten deutschen Form transliteriert.
