base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Und Mose gab Aaron und seinen Söhnen das Auslösungsgeld[a] auf Befehl Jahwes, so wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Silber der Ausgelösten“; gemeint ist die für ihre Auslösung erhobene Zahlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Das Verb נתן bezeichnet hier im fortlaufenden Erzählzusammenhang schlicht die Übergabe des Geldes; „gab“ ist natürlich und präzise.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: das Lösegeld
  rationale: Die Verbindung bedeutet wörtlich „Silber der Ausgelösten“ und bezeichnet im Kontext die für ihre Auslösung entrichtete Zahlung. „Lösegeld“ gibt diesen rechtlich-kultischen Sinn knapp und verständlich wieder.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Aaron und seinen Söhnen
  rationale: Die wiederholte Präposition markiert beide Empfänger; im Deutschen genügt eine gemeinsame Dativkonstruktion. „Seinen“ bezieht sich eindeutig auf Aaron.
- source_word: עַל פִּי יְהוָה
  choice: nach dem Befehl Jahwes
  rationale: Die Wendung lautet wörtlich „nach dem Mund Jahwes“, ist hier jedoch idiomatisch als Handeln gemäß seinem Befehl zu verstehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige Form der wissenschaftlich üblichen Wiedergabe von JHWH.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: genauso wie Jahwe es Mose geboten hatte
  rationale: „Genauso wie“ bewahrt den Gedanken genauer Übereinstimmung; das Plusquamperfekt macht im Deutschen deutlich, dass das Gebot der Übergabe vorausging.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / JHWH
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Wiedergabe „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כֶּסֶף הַפְּדֻיִם
  choice: Lösegeld
  alternative: Silber der Ausgelösten
  rationale: Im Zusammenhang mit der Auslösung der überzähligen Erstgeborenen bezeichnet die Wendung die dafür erhobene Zahlung. Die wörtliche Form bleibt in der Fußnote sichtbar, ohne den deutschen Haupttext unnötig zu erschweren.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzfolge ist für natürliches Deutsch leicht umgestellt; die Wiederholung des Gottesnamens und die ausdrückliche Übereinstimmung mit dem zuvor erteilten Gebot bleiben erhalten.
