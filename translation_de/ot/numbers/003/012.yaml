  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: de
  text: Ich aber – siehe – habe die Leviten aus der Mitte der Söhne Israels[a] genommen, anstelle jedes Erstgeborenen, das unter den Söhnen Israels zuerst den Mutterleib öffnet. Die Leviten sollen mir gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israeliten“. Der hebräische Ausdruck lautet wörtlich „Söhne Israels“ und ist eine feststehende Bezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Und ich selbst
  rationale: Die Konjunktion und das ausdrücklich gesetzte Personalpronomen werden bewahrt; „selbst“ gibt dessen emphatische Kraft in natürlichem Deutsch wieder.
- source_word: הִנֵּה
  choice: siehe
  rationale: Das deiktisch-emphatische Signalwort bleibt als feierliche, im biblischen Register verständliche Aufmerksamkeitspartikel erhalten.
- source_word: לָקַחְתִּי
  choice: habe ... genommen
  rationale: Das hebräische Perfekt bezeichnet hier eine vollzogene göttliche Handlung mit fortdauernder Geltung.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Dies ist die geläufige deutsche Bezeichnung der betreffenden Stammesgruppe.
- source_word: מִתּוֹךְ
  choice: aus der Mitte
  rationale: Die Wendung hält fest, dass die Leviten aus dem Gesamtverband Israels herausgenommen werden.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formelhafte und wörtlich maskuline hebräische Bezeichnung wird transparent wiedergegeben; die idiomatische Alternative steht in der Fußnote.
- source_word: תַּחַת
  choice: anstelle
  rationale: Im kultisch-rechtlichen Zusammenhang bezeichnet die Präposition eindeutig eine stellvertretende Einsetzung.
- source_word: כָּל בְּכוֹר
  choice: jedes Erstgeborenen
  rationale: Der Singular mit כָּל hat distributive Bedeutung und wird entsprechend mit „jedes“ wiedergegeben.
- source_word: פֶּטֶר רֶחֶם
  choice: das ... den Mutterschoß öffnet
  rationale: Die konkrete hebräische Rechtsformel wird verständlich und zugleich bildnah wiedergegeben.
- source_word: וְהָיוּ לִי
  choice: Die Leviten sollen mir gehören
  rationale: Die Formulierung drückt den aus der Einsetzung folgenden göttlichen Besitz- beziehungsweise Zugehörigkeitsanspruch aus, ohne zusätzliche theologische Kategorien einzutragen.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die Hauptfassung bewahrt die formelhafte, grammatisch maskuline Gestalt des Hebräischen; die geläufigere kollektive Wiedergabe wird als echte Übersetzungsalternative vermerkt.
- issue: Verhältnis der Leviten zu Gott in וְהָיוּ לִי
  choice: Die Leviten sollen mir gehören
  alternative: Die Leviten sollen mein sein
  rationale: „Gehören“ bezeichnet den göttlichen Anspruch in verständlichem Gegenwartsdeutsch, ohne den Satz durch spätere Vorstellungen von Weihe oder Priestertum auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parenthese „– siehe –“ bewahrt die feierliche emphatische Markierung des Hebräischen; der zweite Satz ist zur besseren deutschen Lesbarkeit gegenüber der langen hebräischen Satzfolge abgesetzt.
