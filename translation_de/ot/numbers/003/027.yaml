  text: וְ/לִ/קְהָ֗ת מִשְׁפַּ֤חַת הַֽ/עַמְרָמִי֙ וּ/מִשְׁפַּ֣חַת הַ/יִּצְהָרִ֔י וּ/מִשְׁפַּ֨חַת֙ הַֽ/חֶבְרֹנִ֔י וּ/מִשְׁפַּ֖חַת הָֽ/עָזִּיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַ/קְּהָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: de
  text: Und zu Kehat gehörten die Sippe der Amramiter, die Sippe der Jizhariter, die Sippe der Hebroniter und die Sippe der Usiëliter. Das sind die Sippen der Kehatiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: Und zu Kehat gehörten
  rationale: Die Verbindung aus Konjunktion und Präposition leitet die genealogische Zuordnung ein. Die Ergänzung des im Hebräischen vorausgesetzten Verbs ergibt im Deutschen einen natürlichen und klaren Satz.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: die Sippe / die Sippen
  rationale: Im genealogischen und administrativen Zusammenhang bezeichnet מִשְׁפָּחָה eine größere verwandtschaftliche Untergruppe; „Sippe“ unterscheidet sie verständlich von der engeren Familie.
- source_word: הַֽ/עַמְרָמִי
  choice: die Amramiter
  rationale: Das Gentiliz bezeichnet die Nachkommen Amrams; die deutsche Bildung auf „-iter“ gibt diese Zugehörigkeit knapp wieder.
- source_word: הַ/יִּצְהָרִי
  choice: die Jizhariter
  rationale: Das Gentiliz bezeichnet die Nachkommen Jizhars. „Jizhar“ folgt einer im Deutschen verständlichen, quellennahen Umschrift.
- source_word: הַֽ/חֶבְרֹנִי
  choice: die Hebroniter
  rationale: Das Gentiliz bezeichnet die Nachkommen Hebrons und wird mit der geläufigen deutschen Namensform wiedergegeben.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: die Usiëliter
  rationale: Das Gentiliz bezeichnet die Nachkommen Usiëls; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: אֵלֶּה הֵם
  choice: Das sind
  rationale: Demonstrativpronomen und Personalpronomen bilden eine identifizierende Zusammenfassung; im Deutschen ist „Das sind“ idiomatisch.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: die Sippen der Kehatiter
  rationale: Die pluralische Konstruktverbindung fasst die genannten Gruppen als die Sippen der von Kehat abstammenden Gemeinschaft zusammen.
