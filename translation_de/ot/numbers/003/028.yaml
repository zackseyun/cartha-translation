base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: de
  text: Die Zahl aller männlichen Personen, die einen Monat alt oder älter waren, betrug 8.600; sie versahen den Wachdienst am Heiligtum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie hatten den Dienst für das Heilige zu versehen.“ „Das Heilige“ kann den heiligen Bereich oder die heiligen Dinge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: Die Zahl aller männlichen Personen
  rationale: Die Wendung eröffnet eine Zählungsangabe. „Die Zahl“ gibt die Funktion von בְּמִסְפַּר im Deutschen natürlich wieder; „aller männlichen Personen“ bewahrt den ausdrücklich männlichen Bezug von כָּל זָכָר.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: die einen Monat alt oder älter waren
  rationale: Die geläufige deutsche Altersangabe gibt die untere Altersgrenze präzise und verständlich wieder.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: '8.600'
  rationale: Die Ziffernschreibung ist in modernem Deutsch bei einer statistischen Zählungsangabe übersichtlich und eindeutig.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: sie versahen den Wachdienst
  rationale: Die Verbindung aus Partizip und stammverwandtem Substantiv bezeichnet eine fortdauernde, anvertraute Bewachungs- beziehungsweise Aufsichtspflicht. „Den Wachdienst versehen“ wahrt diesen Amts- und Schutzaspekt ohne unnatürliche Wiederholung.
- source_word: הַקֹּדֶשׁ
  choice: am Heiligtum
  rationale: Im levitischen Zusammenhang bezeichnet der Ausdruck am ehesten den heiligen Bereich beziehungsweise das Heiligtum. Die Fußnote hält die weiter gefasste Bedeutung „das Heilige“ offen.
theological_decisions:
- issue: Bezugsbereich von הַקֹּדֶשׁ
  choice: Heiligtum
  alternative: das Heilige, möglicherweise einschließlich heiliger Gegenstände
  rationale: Der unmittelbare kultische Kontext legt einen heiligen Ort nahe, doch der hebräische Ausdruck kann auch umfassender das Heilige bezeichnen. Diese Spannung wird nicht dogmatisch eingeengt, sondern in der Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe an der Zählungsformel des Hebräischen, wird aber durch Semikolon und ein ausdrückliches Pronomen für heutige Leser klar gegliedert.
