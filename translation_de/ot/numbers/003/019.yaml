  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: de
  text: 'Und die Söhne Kehats nach ihren Sippen: Amram, Jizhar, Hebron und Usiel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְּנֵי ist der Status constructus Plural von בֵּן, »Sohn«. In diesem genealogischen Zusammenhang bezeichnet es die Söhne beziehungsweise die von ihnen ausgehenden Linien; die formnahe Wiedergabe »Söhne« ist hier natürlich und passend. Das וּ wird als »Und« wiedergegeben, da der Vers die vorausgehende Aufzählung fortsetzt.
- source_word: קְהָת
  choice: Kehats
  rationale: Der Personenname wird nach etablierter deutscher Bibelnamenschreibung als »Kehat« wiedergegeben; der deutsche Genitiv »Kehats« entspricht der hebräischen Genitivverbindung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftlich gegliederte soziale Einheit innerhalb Israels. »Sippen« ist präziser als das im heutigen Deutsch oft auf den engsten Haushalt beschränkte »Familien«; לְ drückt hier die Zuordnung beziehungsweise Gliederung aus.
- source_word: עַמְרָם
  choice: Amram
  rationale: Der Personenname wird in der üblichen deutschen Form wiedergegeben.
- source_word: וְיִצְהָר
  choice: Jizhar
  rationale: Der Personenname wird nach einer im Deutschen etablierten, quellennahen Umschrift mit anlautendem J wiedergegeben; die Konjunktion erscheint gemäß deutscher Aufzählungssyntax erst vor dem letzten Glied.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Hier ist Hebron ein Personenname, nicht der gleichnamige Ort; die etablierte deutsche Namensform wird beibehalten.
- source_word: וְעֻזִּיאֵל
  choice: und Usiël
  rationale: Der Personenname wird in etablierter deutscher Form als »Usiël« wiedergegeben. Die Diärese macht kenntlich, dass i und e getrennt gesprochen werden. Das vorangestellte וְ wird als »und« ausgedrückt.
