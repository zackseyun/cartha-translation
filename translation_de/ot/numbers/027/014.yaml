id: NUM.27.14
reference: Numbers 27:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: de
  text: weil ihr euch in der Wüste Zin, beim Streit der Gemeinde, meinem Befehl widersetzt habt, indem ihr mich am Wasser vor ihren Augen nicht als heilig erwiesen habt.[a] Das ist das Wasser von Meriba-Kadesch in der Wüste Zin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „um mich am Wasser vor ihren Augen als heilig zu erweisen“. Der hebräische Infinitiv ist positiv formuliert; aus dem Zusammenhang ergibt sich, dass Mose und Aaron dies nicht getan haben.'
    reason: lexical_alternative
  - marker: b
    text: „Meriba-Kadesch“ kann auch mit „Meriba bei Kadesch“ oder wörtlicher mit „Streit von Kadesch“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: weil
  rationale: Die Konjunktion leitet hier den Grund dafür ein, dass Mose und Aaron das Land nicht betreten dürfen; daher ist die kausale Wiedergabe im Deutschen sachgerecht.
- source_word: מְרִיתֶם פִּי
  choice: ihr euch meinem Befehl widersetzt habt
  rationale: מרה bezeichnet Auflehnung oder Widersetzlichkeit; פִּי bedeutet wörtlich „meinem Mund“, steht hier aber idiomatisch für Gottes ausgesprochenen Befehl.
- source_word: בְּמִדְבַּר צִן
  choice: in der Wüste Zin
  rationale: מִדְבָּר bezeichnet eine Wüsten- oder Steppenlandschaft; „Wüste Zin“ ist die geläufige deutsche Form des geografischen Namens.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: beim Streit der Gemeinde
  rationale: מְרִיבָה bezeichnet Streit oder Hader, עֵדָה die versammelte israelitische Gemeinde. Die Formulierung lässt offen, ob der Genitiv vor allem die streitende Gemeinde oder den sie betreffenden Vorfall bezeichnet.
- source_word: לְהַקְדִּישֵׁנִי
  choice: indem ihr mich … nicht als heilig erwiesen habt
  rationale: Der Hifil von קדש bedeutet hier, Gottes Heiligkeit öffentlich zur Geltung zu bringen. Die im Kontext vorausgesetzte Verneinung wird für ein verständliches Deutsch ausdrücklich gemacht.
- source_word: בַּמַּיִם לְעֵינֵיהֶם
  choice: am Wasser vor ihren Augen
  rationale: Die Wendung nennt den Ort des Geschehens und betont zugleich, dass das Versagen öffentlich vor der Gemeinde geschah.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: das Wasser von Meriba-Kadesch
  rationale: Die Ortsbezeichnung wird in einer im Deutschen verständlichen, transliterierten Form wiedergegeben; „Wasser“ kann im Deutschen kollektivisch stehen.
theological_decisions:
- issue: Die kontextuell vorausgesetzte Verneinung bei לְהַקְדִּישֵׁנִי
  choice: „indem ihr mich … nicht als heilig erwiesen habt“
  alternative: „um mich … als heilig zu erweisen“
  rationale: Der hebräische Infinitiv ist positiv formuliert, doch der übergeordnete Vorwurf des Ungehorsams und der Erzählzusammenhang zeigen, dass Mose und Aaron dies unterließen. Die Hauptfassung macht diesen Zusammenhang verständlich; die Fußnote bewahrt die formale Gestalt des Hebräischen.
- issue: Deutung von מְרִיבַת קָדֵשׁ als Ortsname oder beschreibende Wendung
  choice: „Meriba-Kadesch“
  alternative: „Streit von Kadesch“ oder „Meriba bei Kadesch“
  rationale: Die transliterierte Ortsbezeichnung vermeidet eine vorschnelle Festlegung, während die Fußnote die Bedeutung und mögliche alternative Wiedergabe nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gemeinde“ wahrt den gemeinschaftlichen Charakter von עֵדָה; „als heilig erwiesen“ gibt die öffentliche Anerkennung von Gottes Heiligkeit ohne konfessionelle Zusatzdeutung wieder. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Aussage.
