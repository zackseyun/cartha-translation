  source_fidelity: Der Entwurf gibt die Satzstruktur, den Subjektwechsel zu Eleasar, den Gottesnamen, die technische Bezeichnung „Urim“ sowie die offene Referenz von „seinen“ insgesamt zuverlässig wieder. „Ausziehen ... einziehen“ ist für das hebräische Wortpaar angemessen. Die Verbindung „durch den Rechtsspruch der Urim eine Entscheidung erfragen“ vermischt jedoch das Mittel bzw. den Gegenstand der Befragung mit ihrem Ergebnis und ist gegenüber בְּמִשְׁפַּט הָאוּרִים unnötig ausdeutend.
