  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: de
  text: 'Er soll vor Eleasar, dem Priester, stehen. Dieser soll für ihn vor Jahwe den Rechtsspruch der Urim[a] erfragen. Auf seinen Befehl sollen sie ausziehen, und auf seinen Befehl sollen sie einziehen: er und alle Söhne Israels mit ihm[b], die ganze Gemeinde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Entscheidung der Urim“. Gemeint ist die priesterliche Befragung vor Jahwe mithilfe der Urim.'
    reason: lexical_alternative
  - marker: b
    text: '„Söhne Israels“ bedeutet hier: die Israeliten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: vor
  rationale: 'Gibt die räumliche und relationale Bedeutung knapp und natürlich wieder: Josua tritt vor Eleasar.'
- source_word: יַעֲמֹד
  choice: soll ... stehen
  rationale: Das Imperfekt hat im Einsetzungskontext anweisenden Charakter; die deutsche Soll-Form bringt dies klar zum Ausdruck.
- source_word: וְשָׁאַל לוֹ
  choice: Dieser soll für ihn ... eine Entscheidung erfragen
  rationale: Der Kontext legt Eleasar als Subjekt und Josua als Begünstigten der priesterlichen Befragung nahe. „Dieser“ macht den Subjektwechsel verständlich.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: durch den Rechtsspruch der Urim
  rationale: מִשְׁפָּט bezeichnet hier das durch das priesterliche Verfahren ermittelte Urteil beziehungsweise die Entscheidung. „Urim“ bleibt als kultischer Fachbegriff transliteriert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל פִּיו
  choice: auf seinen Befehl
  rationale: Die Wendung bedeutet wörtlich „nach seinem Mund“ und bezeichnet eine maßgebliche Weisung. Das singuläre Pronomen bleibt erhalten, ohne seinen Bezug im Haupttext näher festzulegen.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: sollen sie ausziehen ... sollen sie einziehen
  rationale: Bewahrt das hebräische Begriffspaar für das Hinaus- und Hineingehen der Gemeinschaft, hier möglicherweise besonders im öffentlichen oder militärischen Sinn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Bewahrt die konkrete Formulierung des Hebräischen; eine idiomatische Bedeutungsangabe steht in der Fußnote.
- source_word: הָעֵדָה
  choice: Gemeinde
  rationale: Bezeichnet im Pentateuch die als Ganzes verstandene Bundesgemeinschaft Israels.
theological_decisions:
- issue: Bezug des Pronomens in עַל פִּיו („auf seinen Befehl“)
  choice: 'Das singuläre Pronomen bleibt im Haupttext unaufgelöst: „auf seinen Befehl“.'
  alternative: Das Pronomen könnte unmittelbar auf Eleasar, auf Josua als Leiter oder auf die durch die Urim vermittelte göttliche Weisung bezogen werden.
  rationale: Die hebräische Formulierung ist hinsichtlich des unmittelbaren Bezugs knapp und mehrdeutig. Eine ausdrückliche Festlegung würde eine im Ausgangstext vorhandene Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anweisende Soll-Form entspricht dem Einsetzungskontext. Kultische Fachsprache wird erhalten, aber durch eine knappe Fußnote erläutert; die Mehrdeutigkeit des Pronomens wird nicht aufgelöst.
