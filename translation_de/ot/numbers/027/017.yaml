id: NUM.27.17
reference: Numbers 27:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁר יֵצֵ֣א לִ/פְנֵי/הֶ֗ם וַ/אֲשֶׁ֤ר יָבֹא֙ לִ/פְנֵי/הֶ֔ם וַ/אֲשֶׁ֥ר יוֹצִיאֵ֖/ם וַ/אֲשֶׁ֣ר יְבִיאֵ֑/ם וְ/לֹ֤א תִהְיֶה֙ עֲדַ֣ת יְהוָ֔ה כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: de
  text: der vor ihnen auszieht und vor ihnen einzieht[a], der sie hinausführt und sie hereinführt[b], damit die Gemeinde Jahwes nicht wie Schafe ist, die keinen Hirten haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor ihnen her auszieht und vor ihnen her einzieht“.'
    reason: lexical_alternative
  - marker: b
    text: Die Folge „ausziehen … einziehen … hinausführen … hereinführen“ ist eine hebräische Ausdrucksweise für umfassende öffentliche Führung.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen beschreibt die in Vers 16 erbetene Führungsperson und schließt im Deutschen natürlich an den vorausgesetzten persönlichen Bezug an.
- source_word: יֵצֵא ... יָבֹא
  choice: auszieht ... einzieht
  rationale: Die konkreten Bewegungsverben und ihre Parallelität bleiben erhalten; im Zusammenhang bezeichnen sie das öffentliche Vorangehen des Leiters.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die Wendung bedeutet wörtlich „vor ihnen“ und kann räumliches Vorangehen sowie die Führungsrolle ausdrücken, ohne die Bildsprache aufzulösen.
- source_word: יוֹצִיאֵם ... יְבִיאֵם
  choice: sie hinausführt ... sie hereinführt
  rationale: Die Hifil-Formen sind kausativ. „Führen“ gibt im Deutschen sowohl diesen Sinn als auch die persönliche Leitungsfunktion passend wieder.
- source_word: עֲדַת יְהוָה
  choice: die Gemeinde Jahwes
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinde“ ist verständlich und kollektiv, während „Jahwe“ den im Text stehenden Gottesnamen wiedergibt.
- source_word: כַּצֹּאן
  choice: wie Schafe
  rationale: Das hebräische Kollektiv wird im Deutschen idiomatisch als Plural wiedergegeben und die Vergleichsform bleibt unmittelbar erhalten.
- source_word: רֹעֶה
  choice: Hirten
  rationale: Das Wort bezeichnet einen, der eine Herde hütet. „Hirte“ bewahrt das konkrete Leitungsbild, ohne es kirchlich zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Folge „ausziehen … einziehen … hinausführen … hereinführen“
  choice: Die konkrete Bewegungs- und Führungssprache wird beibehalten.
  alternative: Abstrakte Wiedergabe wie „sie in allem leiten“
  rationale: Die Formulierung beschreibt umfassende öffentliche Führung, trägt aber zugleich zur anschließenden Hirtenmetapher bei. Eine abstrakte Paraphrase würde diese Bildhaftigkeit und ihre Spannung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur und die konkrete Hirten- und Führungssprache des Hebräischen bleiben erhalten; „Gemeinde“ ist hier nicht konfessionell, sondern als versammelte Gemeinschaft Israels gemeint.
