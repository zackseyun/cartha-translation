id: NUM.27.12
reference: Numbers 27:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: »Steig auf diesen Berg im Abarimgebirge[a] und sieh dir das Land an, das ich den Israeliten[b] gegeben habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »diesen Berg der Abarim«; auch möglich: »diesen Berg im Abarim-Bergland« oder »den Berg Abarim«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Söhnen Israels«; gemeint sind die Israeliten, das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit Imperfekt führt die Erzählung weiter; »Da sagte« ist im modernen deutschen Erzählstil natürlich.
- source_word: עֲלֵה
  choice: Steig auf
  rationale: Der Imperativ von עלה bezeichnet die Aufwärtsbewegung auf den Berg und wird knapp und idiomatisch wiedergegeben.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: diesen Berg im Abarimgebirge
  rationale: Die Wendung bezeichnet hier einen bestimmten Berg im Abarim-Bergland. Die räumliche Wiedergabe ist im Deutschen natürlicher; die wörtlichere Konstruktion bleibt in der Fußnote erhalten.
- source_word: וּרְאֵה
  choice: und sieh dir ... an
  rationale: Der Imperativ von ראה fordert Mose auf, das Land von dort aus in Augenschein zu nehmen; die deutsche Verbklammer gibt dies natürlich wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang der Landverheißung ist »das Land« die sachlich und sprachlich angemessene Wiedergabe.
- source_word: נָתַתִּי
  choice: ich ... gegeben habe
  rationale: Das Perfekt stellt die göttliche Gabe als feststehend bzw. vollzogen dar; das deutsche Perfekt im Relativsatz bewahrt diesen Sinn.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die hebräische feste Volksbezeichnung bedeutet wörtlich »den Söhnen Israels«; »den Israeliten« ist im modernen Deutschen die natürliche ethnische Bezeichnung, während die Formnähe in einer Fußnote dokumentiert wird.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Transliteration bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels; Kinder Israels; Volk Israel
  rationale: Die Wendung fungiert als Volksbezeichnung. »Israeliten« ist inklusiv und idiomatisch, ohne zu behaupten, der Bezug beschränke sich auf männliche Nachkommen; die wörtliche Form wird in der Fußnote genannt.
- issue: Geografische Deutung von הַר הָעֲבָרִים
  choice: Berg im Abarimgebirge
  alternative: Berg der Abarim; Berg Abarim
  rationale: Der Kontext bezeichnet einen einzelnen Berg innerhalb des Abarim-Berglands. Da die hebräische Konstruktion mehrere formnahe Wiedergaben zulässt, wird die Alternative offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und natürlich formuliert; geografische und ethnische Hebraismen werden lesbar wiedergegeben und in Fußnoten transparent gemacht.
