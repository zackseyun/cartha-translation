source:
  edition: WLC
  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: de
  text: Da traten die Töchter Zelofhads heran[a]. Zelofhad war der Sohn Hefers, des Sohnes Gileads, des Sohnes Machirs, des Sohnes Manasses. Sie gehörten zu den Sippen Manasses, des Sohnes Josefs. Seine Töchter hießen Machla, Noa[b], Hogla, Milka und Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da kamen die Töchter Zelofhads näher“; auch möglich: „Da näherten sie sich“. Die Formulierung kann auf das förmliche Vortreten mit einem Anliegen hinweisen, von dem die folgenden Verse berichten.'
    reason: lexical_alternative
  - marker: b
    text: Noa ist hier der Name einer Tochter Zelofhads und nicht mit Noach, der männlichen Gestalt aus dem 1. Buch Mose, zu verwechseln.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: Da traten ... heran
  rationale: Das Qal Wayyiqtol 3. Person feminin Plural von קרב bezeichnet das Herantreten; die Formulierung passt zum folgenden förmlichen Vorbringen, ohne dessen Ziel bereits ausdrücklich zu ergänzen.
- source_word: בְּנוֹת צְלָפְחָד
  choice: die Töchter Zelofhads
  rationale: Der Status constructus bezeichnet hier die leiblichen Töchter des genannten Vaters; dies wird durch die anschließende Namensliste bestätigt.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: der Sohn ... des Sohnes ... des Sohnes ... des Sohnes
  rationale: Die ausdrückliche genealogische Kette bleibt erhalten, da sie die Zugehörigkeit und den späteren Erbanspruch verankert. Die deutsche Kasusfolge macht die Abstammung eindeutig.
- source_word: לְמִשְׁפְּחֹת
  choice: Sie gehörten zu den Sippen
  rationale: מִשְׁפָּחָה bezeichnet im stammesgeschichtlichen Zusammenhang eine Sippe beziehungsweise einen Clan. Die Präposition ל markiert hier die Zugehörigkeit; ein eigener deutscher Satz ist natürlicher und bleibt inhaltlich genau.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: Manasses, des Sohnes Josefs
  rationale: Die Verbindung zur Linie Josefs wird ausdrücklich bewahrt.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Seine Töchter hießen
  rationale: Die hebräische Namensformel wird idiomatisch und vollständig wiedergegeben; das Possessivpronomen verweist auf Zelofhad.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: Machla, Noa, Hogla, Milka und Tirza
  rationale: Die Personennamen folgen gebräuchlichen deutschen Bibeltransliterationen und geben die hebräischen Formen erkennbar wieder.
