  register: Modernes, würdiges Standarddeutsch. Die lange Genealogie wurde zur besseren Verständlichkeit auf mehrere Sätze verteilt, ohne ein Glied auszulassen oder die Zugehörigkeitsangaben zu verdichten. Die Schreibweisen Manasse, Josef, Machla, Noa, Hogla, Milka und Tirza entsprechen verbreitetem deutschem Bibelgebrauch.
