base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: de
  text: Warum soll der Name unseres Vaters aus seiner Sippe verloren gehen, weil er keinen Sohn hatte? Gebt uns Landbesitz unter den Brüdern unseres Vaters.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geschmälert“ oder „weggenommen werden“. Das Hebräische fragt, warum der Name ihres Vaters aus seiner Sippe verloren gehen sollte, weil er keinen Sohn hatte.'
    reason: lexical_alternative
  - marker: b
    text: „Landbesitz“ bezeichnet hier einen innerhalb der Sippe zugewiesenen erblichen Landanteil.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: Warum soll
  rationale: Leitet eine rhetorische Protestfrage ein und gibt den Einwand im Deutschen natürlich wieder.
- source_word: יִגָּרַע
  choice: verschwinden
  rationale: Das Nifal von גרע bezeichnet hier den Verlust des Namens aus dem Zusammenhang der Sippe; „verschwinden“ bewahrt die Wirkung des hebräischen Bildes, ohne eine absichtliche Tilgung zu behaupten.
- source_word: שֵׁם
  choice: Name
  rationale: Die wörtliche Wiedergabe erhält die hebräische Vorstellung vom Fortbestand des Vaters und seiner Linie innerhalb der Sippe.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: aus seiner Sippe
  rationale: מִשְׁפָּחָה bezeichnet im Zusammenhang der Stammes- und Landordnung eine größere Verwandtschaftsgruppe, nicht bloß die Kernfamilie.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: nur weil er keinen Sohn hatte
  rationale: „Sohn“ bleibt geschlechtsspezifisch erhalten, da die Rechtsfrage männliche Nachkommen betrifft; die Vergangenheit entspricht dem deutschen Erzählzusammenhang, während „nur weil“ den protestierenden Ton verdeutlicht.
- source_word: תְּנָה לָּנוּ
  choice: Gebt uns
  rationale: Direkte, natürliche Wiedergabe der imperativischen Bitte; der Plural richtet sich an Mose und die versammelten Entscheidungsträger im Kontext.
- source_word: אֲחֻזָּה
  choice: Landbesitz
  rationale: Bezeichnet einen dauerhaft zugewiesenen Grundbesitz beziehungsweise Erbanteil; „Landbesitz“ macht den sachlichen Bezug deutlicher als das allgemeine „Besitz“.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: unter den Brüdern unseres Vaters
  rationale: Gibt die ausdrücklich männliche Verwandtschaftsbezeichnung und die Einordnung in deren Landanteile genau wieder.
theological_decisions:
- issue: Geschlechtsspezifische Sprache des Erbrechts
  choice: Sohn / Brüder unseres Vaters
  alternative: Kind / Verwandte unseres Vaters
  rationale: Der hebräische Text nennt ausdrücklich männliche Nachkommen und die Brüder des Vaters, weil es um die geltende Erbfolge geht. Diese rechtlich und erzählerisch wichtige Spannung wird nicht neutralisiert.
- issue: Bedeutung des Fortbestands des väterlichen Namens
  choice: Name … verschwinden
  alternative: Name … geschmälert oder weggenommen werden
  rationale: Die Formulierung bewahrt das hebräische Motiv des Namens als fortbestehender Stellung und Erinnerung innerhalb der Sippe, ohne eine weitergehende theologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sippe“ bildet die über die Kernfamilie hinausgehende Verwandtschaftsgruppe ab. Die direkte Bitte bleibt knapp und bestimmt; die Fußnotenmarker stehen vollständig im Haupttext.
