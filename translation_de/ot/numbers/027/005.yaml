  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: de
  text: Da brachte Mose ihren Rechtsfall vor Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da legte Mose ihren Rechtsanspruch Jahwe zur Entscheidung vor.«'
    reason: Lexikalische Alternative für וַיַּקְרֵב und מִשְׁפָּטָן; sie hebt den formellen Rechtsanspruch und die erwartete Entscheidung hervor.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Da brachte ... vor
  rationale: Der Hifil von קרב bedeutet »heranbringen« oder »vorlegen«. Im rechtlichen Zusammenhang gibt die idiomatische Wendung »einen Rechtsfall vor jemanden bringen« die förmliche Vorlage zur Entscheidung wieder.
- source_word: מִשְׁפָּטָן
  choice: ihren Rechtsfall
  rationale: מִשְׁפָּט kann unter anderem Rechtsspruch, Rechtsanspruch oder Rechtssache bezeichnen. Der feminine Pluralsuffix verweist auf die Töchter Zelofhads; »ihren Rechtsfall« bezeichnet hier präzise und verständlich ihre zur Entscheidung vorgelegte Angelegenheit.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bedeutet »vor« beziehungsweise »in der Gegenwart von« und passt zugleich zur deutschen Rechtssprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַ
  choice: Da
  rationale: Das narrative Waw führt die Handlung als Reaktion auf die vorausgehende Eingabe weiter; »Da« drückt diesen Zusammenhang im Deutschen natürlich aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« bewahrt diesen als Namen, während »der HERR« ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Rechtsfall« macht den juristischen Kontext ausdrücklich, ohne vorwegzunehmen, wie Jahwe entscheiden wird.
