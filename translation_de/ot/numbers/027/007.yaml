  source_fidelity: Die Übersetzung gibt die gerichtliche Bestätigung in כֵּן ... דֹּבְרֹת treffend mit „haben recht“ wieder. Der Nachdruck von נָתֹן תִּתֵּן, der Erbbesitz innerhalb der väterlichen Verwandtschaft und die rechtliche Übertragung des väterlichen Erbes sind inhaltlich erhalten.
  naturalness: „Das Erbe ... auf sie übergehen lassen“ ist im Deutschen weniger idiomatisch und kann den Vorgang eher als selbsttätigen Übergang erscheinen lassen. „Auf sie übertragen“ ist die natürliche rechtlich-administrative Entsprechung und erhält den kausativen Charakter des Hebräischen.
