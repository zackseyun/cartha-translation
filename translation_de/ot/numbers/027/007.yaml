source:
  edition: WLC
  text: כֵּ֗ן בְּנ֣וֹת צְלָפְחָד֮ דֹּבְרֹת֒ נָתֹ֨ן תִּתֵּ֤ן לָ/הֶם֙ אֲחֻזַּ֣ת נַחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֣י אֲבִי/הֶ֑ם וְ/הַֽעֲבַרְתָּ֛ אֶת נַחֲלַ֥ת אֲבִי/הֶ֖ן לָ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: de
  text: Die Töchter Zelofhads haben recht.[a] Du sollst ihnen[b] unter den Brüdern ihres Vaters unbedingt einen Erbbesitz geben und das Erbe ihres Vaters auf sie übertragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Töchter Zelofhads reden richtig.«'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische verwendet an dieser Stelle bei »ihnen« eine maskuline Pluralform; aus dem Zusammenhang geht jedoch eindeutig hervor, dass die Töchter Zelofhads gemeint sind.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: haben recht
  rationale: Die Verbindung bedeutet wörtlich, dass die Töchter »richtig reden«, und bestätigt im rechtlichen Zusammenhang die Berechtigung ihrer Forderung. »Haben recht« gibt das im heutigen Deutsch natürlich und prägnant wieder.
- source_word: נָתֹן תִּתֵּן
  choice: sollst ... unbedingt ... geben
  rationale: Der Infinitivus absolutus mit dem finiten Verb verstärkt die Anweisung. »Unbedingt« bewahrt diesen Nachdruck, ohne altertümlich zu klingen.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: Erbbesitz
  rationale: Das zusammengesetzte Rechtswort verbindet dauerhaften Landbesitz mit dem Gedanken des Erbes. »Erbbesitz« drückt beides knapp aus.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: unter den Brüdern ihres Vaters
  rationale: Die Formulierung ordnet den Anteil der Töchter dem Sippenbesitz ihrer väterlichen Onkel zu und folgt dem Hebräischen in natürlichem Deutsch.
- source_word: וְהַעֲבַרְתָּ
  choice: auf sie übergehen lassen
  rationale: Der Hifil von עבר bezeichnet hier rechtlich, dass das Erbe auf eine andere Partei übergeht. Die deutsche Wendung wahrt den kausativen und administrativen Sinn.
- source_word: נַחֲלַת אֲבִיהֶן
  choice: das Erbe ihres Vaters
  rationale: Die Wendung bezeichnet den Erbanteil ihres verstorbenen Vaters und bleibt in dieser Form klar und unmittelbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Sprache bleibt klar und nachdrücklich; die idiomatische Aussage »haben recht« vermeidet eine unnötig wörtliche, im Deutschen schwerfällige Formulierung.
