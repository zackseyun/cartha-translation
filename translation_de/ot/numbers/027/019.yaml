  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: de
  text: Du sollst ihn vor den Priester Eleasar und vor die ganze Gemeinde stellen und ihn vor ihren Augen beauftragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm Weisung geben“ oder „ihm befehlen“. Das hebräische Verb bedeutet häufig „befehlen“ oder „anweisen“; im Zusammenhang der öffentlichen Einsetzung Josuas kann es eine öffentliche Beauftragung bezeichnen.'
    reason: lexikalische Alternative und Erhalt der Bedeutungsbreite
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: du sollst ihn … stellen
  rationale: 'Der Hifil von עמד ist hier kausativ: Mose soll Josua vor Eleasar und die Gemeinde treten lassen beziehungsweise ihn dort aufstellen. „Stellen“ gibt den formellen Vorgang knapp und natürlich wieder.'
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier die räumliche und zugleich formelle Anwesenheit vor Eleasar und der Gemeinde.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: den Priester Eleasar
  rationale: Die deutsche Wortstellung mit vorangestelltem Amtstitel ist natürlich und bewahrt die bestimmte Amtsbezeichnung.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft Israels. „Gemeinde“ ist im Deutschen verständlich und bewahrt den gemeinschaftlichen Sinn.
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: ihm … seinen Auftrag erteilen
  rationale: צוה bedeutet gewöhnlich „befehlen“ oder „anweisen“. Im Zusammenhang der öffentlichen Einsetzung Josuas bezeichnet es die autoritative Übertragung beziehungsweise Einschärfung seines Auftrags; die Formulierung wahrt sowohl den Amtsakt als auch dessen Verbindlichkeit.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die hebräische Wendung wird bildnah wiedergegeben und betont, dass der Vorgang öffentlich und von allen sichtbar geschieht.
theological_decisions:
- issue: Öffentliche Einsetzung und Beauftragung Josuas
  choice: „ihm … seinen Auftrag erteilen“
  alternative: „ihm Befehl geben“ oder „ihn anweisen“
  rationale: Der unmittelbare Zusammenhang beschreibt eine öffentliche Einsetzung vor dem Priester und der ganzen Gemeinde. Die gewählte Formulierung macht den verbindlichen Auftrag deutlich, ohne aus dem Verb allein ein stärker ausgearbeitetes Amtsverständnis abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem zeremoniellen Ablauf des Hebräischen; „vor ihren Augen“ bewahrt das anschauliche Bild und den öffentlichen Charakter der Handlung.
