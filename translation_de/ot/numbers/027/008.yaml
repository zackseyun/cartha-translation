  verdict: revise
  source_fidelity: Der Entwurf gibt die Rechtsregel, die männlich formulierte Fallbeschreibung („ein Mann“, „kein Sohn“) und die Übertragung des Erbes an die Tochter sachgerecht wieder. „Söhne Israels“ wahrt die Form von בְּנֵי יִשְׂרָאֵל; die verkürzte deutsche Redeformel „sollst du sagen“ ist als idiomatische Wiedergabe von תְּדַבֵּר לֵאמֹר vertretbar.
  naturalness: „Etwas auf seine Tochter übergehen lassen“ ist zwar grundsätzlich verständlich, wirkt im heutigen Deutsch aber weniger klar und kann wegen „übergehen“ unnötig missverständlich sein. „Sein Erbe auf seine Tochter übertragen“ ist im rechtlichen Kontext eindeutig und natürlich.
  terminology: „Erbe“ ist hier als Bezeichnung für die zu übertragende Erbmasse bzw. den Erbbesitz möglich. „Übertragen“ gibt den rechtlich-administrativen Hifil von עבר präzise wieder. Die Bezeichnung „Söhne Israels“ ist bewusst formtreu und im würdigen Register tragfähig.
  issues:
