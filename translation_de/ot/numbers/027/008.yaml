  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֣ישׁ כִּֽי יָמ֗וּת וּ/בֵן֙ אֵ֣ין ל֔/וֹ וְ/הַֽעֲבַרְתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/בִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: de
  text: 'Und zu den Söhnen Israels sollst du sagen: »Wenn ein Mann stirbt und keinen Sohn hat, sollt ihr sein Erbe auf seine Tochter übertragen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶל בְּנֵי יִשְׂרָאֵל
  choice: Und zu den Söhnen Israels
  rationale: Die Wiedergabe bewahrt die wörtliche familiäre und maskuline Form des Hebräischen; das idiomatischere »Israeliten« würde diese Bildsprache einebnen.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: sollst du sagen
  rationale: Die hebräische Redeformel lautet wörtlich »sollst du reden, indem du sagst«. Im modernen Deutschen gibt »sollst du sagen« ihre Funktion natürlich und vollständig wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Der kasuistische Rechtssatz ist im Hebräischen ausdrücklich maskulin formuliert und betrifft hier die Erbfolge eines Mannes.
- source_word: כִּי יָמוּת
  choice: wenn ... stirbt
  rationale: כִּי mit dem Imperfekt führt hier einen Rechtsfall ein. Deutsches »wenn« ist dafür idiomatischer als »falls«, ohne den bedingten Charakter aufzugeben.
- source_word: וּבֵן אֵין לוֹ
  choice: und keinen Sohn hat
  rationale: Dies gibt die Existenzkonstruktion »und ein Sohn ist ihm nicht« knapp und natürlich wieder und bewahrt den ausdrücklichen Bezug auf einen Sohn.
- source_word: וְהַעֲבַרְתֶּם
  choice: sollt ihr ... übergehen lassen
  rationale: Der Hifil von עבר bezeichnet hier das Veranlassen eines rechtlichen Übergangs. »Übergehen lassen« bewahrt das hebräische Übergangsbild und ist im Erbkontext verständlich; »übertragen« wäre eine mögliche stärker verwaltungssprachliche Alternative.
- source_word: נַחֲלָתוֹ
  choice: sein Erbe
  rationale: נַחֲלָה bezeichnet hier den vererbbaren Besitz beziehungsweise Erbanteil. »Erbe« ist im Deutschen prägnant und bezeichnet in diesem Zusammenhang die Erbmasse, nicht die erbende Person.
- source_word: לְבִתּוֹ
  choice: auf seine Tochter
  rationale: Mit »übergehen lassen« verlangt idiomatisches Deutsch die Verbindung »auf« für die Empfängerin des Erbes.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Rechtstext. Die Anrede »Söhne Israels« bleibt aus Gründen der Formtreue erhalten; die redundante hebräische Redeformel wird im Deutschen idiomatisch verdichtet.
