    issue: Die Wendung „sein Erbe auf seine Tochter übergehen lassen“ ist stilistisch und semantisch weniger eindeutig.
    rationale: Das Verb „übergehen“ kann im modernen Deutsch auch „nicht beachten“ bedeuten; zudem formuliert der hebräische Hifil eine veranlasste rechtliche Übertragung. „Übertragen“ bildet diese Funktion klarer ab.
