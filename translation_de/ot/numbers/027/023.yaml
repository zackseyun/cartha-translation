  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּסְמֹ֧ךְ אֶת יָדָ֛י/ו עָלָ֖י/ו וַ/יְצַוֵּ֑/הוּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: de
  text: Dann legte er ihm die Hände auf und beauftragte ihn[a], ganz wie Jahwe durch Mose[b] geredet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wies ihn an“ beziehungsweise „gab ihm seinen Auftrag“. Das hebräische Verb kann ein Befehlen oder Anweisen bezeichnen; hier steht es im Zusammenhang mit Josuas öffentlicher Einsetzung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Hand Moses“; eine hebräische Wendung für das Handeln oder Reden durch einen Beauftragten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת יָדָיו עָלָיו
  choice: Dann legte er ihm die Hände auf
  rationale: Die Wendung bezeichnet das Auflegen beider Hände auf eine Person. Die deutsche Formulierung ist natürlich, bewahrt die rituelle Handlung und gibt die Pluralform יָדָיו wieder.
- source_word: וַיְצַוֵּהוּ
  choice: und beauftragte ihn
  rationale: צוה kann „befehlen“ oder „anweisen“ bedeuten; im Zusammenhang der öffentlichen Einsetzung Josuas bezeichnet es zugleich die Erteilung seines Auftrags. „Beauftragte ihn“ wahrt diesen amtlichen Zusammenhang, ohne eine spätere kirchliche Ordinationsvorstellung einzutragen.
- source_word: כַּאֲשֶׁר
  choice: ganz wie
  rationale: Die Formulierung hebt die genaue Übereinstimmung zwischen Moses Handeln und Jahwes zuvor ergangenem Wort hervor.
- source_word: דִּבֶּר
  choice: geredet hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Jahwes Wort Moses Handlung vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die hebräische Wendung bedeutet wörtlich „durch die Hand Moses“ und bezeichnet Mose als den Vermittler beziehungsweise Beauftragten, durch den Jahwe sprach.
theological_decisions:
- issue: Bedeutung von צוה bei der Einsetzung Josuas
  choice: beauftragte ihn
  alternative: befahl ihm / wies ihn an
  rationale: Der unmittelbare Zusammenhang verbindet das Verb mit Handauflegung und öffentlicher Einsetzung. „Beauftragte ihn“ lässt den förmlichen Charakter erkennen, ohne auszuschließen, dass dabei verbindliche Weisungen erteilt wurden.
- issue: Vermittelte Rede in בְּיַד מֹשֶׁה
  choice: durch Mose
  alternative: durch die Hand Moses
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet Mose klar als Jahwes menschlichen Vermittler, ohne ihm die Urheberschaft des göttlichen Wortes zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dann“ stellt den erzählerischen Anschluss her; „ihm die Hände auflegen“ ist die geläufige deutsche Wendung. Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
