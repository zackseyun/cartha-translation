base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/015.yaml
  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: de
  text: 'Da redete Mose zu Jahwe[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da redete
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da redete“ gibt die zeitlich-fortschreitende Erzählweise natürlich wieder und entspricht דבר genauer als ein bloßes „sagte“.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: אֶל
  choice: zu
  rationale: 'Die Präposition bezeichnet hier die Richtung der Rede: Mose richtet sich an Jahwe.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die Infinitivkonstruktion leitet den unmittelbar folgenden Wortlaut ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion besser als das schwerfällige „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm JHWH. „Jahwe“ bewahrt den persönlichen Gottesnamen; die Fußnote nennt die traditionelle Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da redete“ wahrt den erzählerischen Fortgang; der Doppelpunkt gibt die hebräische Einleitungsformel vor der in Vers 16 folgenden direkten Rede idiomatisch wieder.
