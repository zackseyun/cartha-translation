  yaml_path: translation/ot/numbers/027/009.yaml
  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: de
  text: Und wenn er keine Tochter hat, sollt ihr sein Erbe seinen Brüdern geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Leitet als Fortsetzung der gesetzlichen Fallfolge die nächste Bedingung ein und bewahrt die verbindende Funktion von וְ.
- source_word: אֵין לוֹ
  choice: er keine … hat
  rationale: Die hebräische Existenzkonstruktion mit לְ wird im Deutschen idiomatisch mit „haben“ wiedergegeben.
- source_word: בַּת
  choice: Tochter
  rationale: Gibt das feminine Substantiv im Singular genau und im Deutschen nach „keine“ natürlich wieder.
- source_word: וּנְתַתֶּם
  choice: sollt ihr … geben
  rationale: Bewahrt die Anweisung in der zweiten Person Plural; „sollt“ entspricht dem rechtlichen, verpflichtenden Charakter, ohne unnötig zu verschärfen.
- source_word: נַחֲלָתוֹ
  choice: sein Erbe
  rationale: Bezeichnet hier den vererbbaren Besitz beziehungsweise Erbanteil; „Erbe“ ist im Deutschen in diesem gesetzlichen Zusammenhang knapp und idiomatisch.
- source_word: לְאֶחָיו
  choice: seinen Brüdern
  rationale: Gibt den ausdrücklich maskulinen Plural wieder und bezeichnet in dieser Erbfolge die Brüder des Verstorbenen als nächste Erben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer gesetzlicher Satzstruktur. Die Bedingung und ihre Rechtsfolge werden natürlich formuliert; die zweite Person Plural bleibt erhalten.
