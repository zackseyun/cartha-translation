source:
  edition: WLC
  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: de
  text: Und du sollst etwas von deiner Würde auf ihn legen[a], damit die ganze Gemeinde der Israeliten auf ihn hört[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas von deiner Hoheit“, „von deinem Glanz“ oder „von deiner Autorität“. Das hebräische Wort bezeichnet Würde, Glanz oder Ehre und kann hier auch die mit dem Amt verbundene Autorität einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihm gehorcht“. Das hebräische Verb kann „hören“, „auf jemanden hören“ oder „gehorchen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Und du sollst … legen
  rationale: נתן bedeutet grundsätzlich „geben“; zusammen mit עַל und im Zusammenhang der Einsetzung gibt „auf ihn legen“ das Bild der Übertragung natürlich wieder.
- source_word: מֵהוֹדְךָ
  choice: etwas von deiner Würde
  rationale: הוֹד bezeichnet Hoheit, Glanz, Ehre oder Würde. Der partitive Gebrauch von מִן verlangt „etwas von“. „Würde“ bewahrt die sichtbare Ehrstellung des Amtes, ohne den Ausdruck vorschnell auf „Autorität“ zu verengen.
- source_word: עָלָיו
  choice: auf ihn
  rationale: Direkte Wiedergabe der Präposition עַל mit pronominalem Suffix; das Bild der Übertragung bleibt erhalten.
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck der Handlung ein und ist im modernen Deutschen knapp und natürlich.
- source_word: יִשְׁמְעוּ
  choice: auf ihn hört
  rationale: שׁמע kann „hören“, „hören auf“ oder „gehorchen“ bedeuten. „Auf ihn hören“ bewahrt die Verbindung zum Hören und lässt zugleich das gemeinte Befolgen erkennen.
- source_word: כָּל עֲדַת
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft Israels; „die ganze Gemeinde“ ist eine klare und etablierte deutsche Wiedergabe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die idiomatische Bezeichnung „Israeliten“ gibt die Zugehörigkeit zum Volk Israel wieder; eine wörtliche Form wie „Söhne Israels“ könnte im heutigen Deutsch fälschlich nur männliche Personen nahelegen.
theological_decisions:
- issue: Art dessen, was Mose auf Josua überträgt
  choice: „etwas von deiner Würde“; eine partielle Übertragung der mit Moses Amt verbundenen Ehrstellung
  alternative: „etwas von deiner Hoheit/deinem Glanz/deiner Autorität“
  rationale: הוֹד hat ein breiteres Bedeutungsfeld als bloße Amtsgewalt. Der Kontext legt eine öffentliche Bevollmächtigung nahe, doch die Übersetzung sollte die lexikalische Bildhaftigkeit und Spannung zwischen Würde, Hoheit und Autorität nicht beseitigen.
- issue: Bedeutung von שׁמע im Zwecksatz
  choice: „auf ihn hört“
  alternative: „ihm gehorcht“ oder „ihn anhört“
  rationale: Im Einsetzungskontext ist folgsames Hören gemeint. „Auf ihn hören“ vermittelt dies im Deutschen, ohne die Mehrdeutigkeit des hebräischen Verbs vollständig auf „gehorchen“ festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Würde“ wahrt die Bildsprache von הוֹד; „auf ihn hört“ bildet die semantische Spannung zwischen Hören und Gehorchen natürlich ab. Die Marker stehen jeweils unmittelbar an der betreffenden Wendung.
