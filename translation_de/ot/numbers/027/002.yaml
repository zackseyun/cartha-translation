  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: de
  text: 'Da traten sie am Eingang des Zeltes der Begegnung vor Mose, vor den Priester Eleasar, vor die führenden Männer und vor die ganze Gemeinde und sagten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: Da traten sie
  rationale: Das feminine Verb im narrativen Zusammenhang bezeichnet, dass die zuvor genannten Töchter öffentlich vor die zuständigen Personen treten. „Da traten sie“ gibt die Erzählfolge und den formellen Charakter im natürlichen Deutschen wieder.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die dreifache Präposition bezeichnet das Auftreten in Gegenwart der genannten Autoritäten; die Wiederholung wird wegen ihres öffentlichen und rechtlichen Gewichts bewahrt.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: den Priester Eleasar
  rationale: Der hebräische Titel lautet schlicht „der Priester“; eine Erweiterung zu „Hohepriester“ wäre nicht ausdrücklich im Text enthalten.
- source_word: הַנְּשִׂיאִם
  choice: die führenden Männer
  rationale: נְשִׂיאִים bezeichnet hier die offiziell anerkannten Führer der Gemeinschaft. „Führende Männer“ ist im Kontext sachgerecht und vermeidet den im modernen Deutsch leicht monarchisch verstandenen Ausdruck „Fürsten“.
- source_word: כָל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet in Numeri die versammelte Gemeinschaft Israels. „Gemeinde“ wahrt diesen gemeinschaftlichen Sinn, und „die ganze“ gibt כָּל wieder.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: an den Eingang des Zeltes der Begegnung
  rationale: פֶּתַח ist der Eingang; אֹהֶל מוֹעֵד wird als etablierter kultischer Ausdruck mit „Zelt der Begegnung“ wiedergegeben.
- source_word: לֵאמֹר
  choice: 'und sagten:'
  rationale: Die hebräische Redeformel leitet die direkte Rede im folgenden Vers ein. Im modernen Deutschen ist ein finites Verb mit Doppelpunkt natürlicher als das partizipiale „indem sie sprachen“.
theological_decisions:
- issue: Öffentlich-rechtlicher Rahmen des Anliegens
  choice: Die dreifache Wiederholung von „vor“ und die vollständige Aufzählung der anwesenden Instanzen bleiben erhalten.
  alternative: Die Gruppen in einer glatteren Zusammenfassung zusammenfassen.
  rationale: Die Satzstruktur hebt hervor, dass die Frauen ihr Anliegen öffentlich vor Mose, dem Priester, den Führenden und der gesamten Gemeinde vorbringen. Diese Gewichtung darf nicht zu bloßer erzählerischer Bewegung abgeschwächt werden.
- issue: Bedeutung von עֵדָה
  choice: Gemeinde
  alternative: Versammlung
  rationale: „Gemeinde“ bewahrt den in Numeri häufigen Sinn der gemeinschaftlich verfassten Gesamtheit Israels, ohne über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Wiederholung bildet den feierlich-öffentlichen Charakter des hebräischen Satzes ab; die abschließende Redeformel wird idiomatisch mit „und sagten:“ wiedergegeben.
