  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: de
  text: Wenn du es gesehen hast, wirst auch du zu deinem Volk versammelt werden[a], so wie dein Bruder Aaron versammelt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „wirst du sterben“ oder „wirst du zu deinen Vorfahren versammelt werden“. Wörtlich lautet die hebräische Wendung: „zu deinem Volk versammelt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה
  choice: Wenn du ... gesehen hast
  rationale: Die Qal-Form 2. Person Singular maskulin folgt im Zusammenhang auf den Auftrag, das Land anzusehen. Die temporale Wiedergabe macht die Abfolge im Deutschen natürlich deutlich.
- source_word: אֹתָהּ
  choice: es
  rationale: Das feminine Objektsuffix bezieht sich im Kontext auf das Land; im Deutschen wird dafür das Neutrum „es“ verwendet.
- source_word: וְנֶאֱסַפְתָּ
  choice: wirst ... versammelt werden
  rationale: Der Niphal von אסף bezeichnet in der festen Wendung den Tod und die Aufnahme zu den eigenen Leuten. Die passive Metapher bleibt erhalten.
- source_word: אֶל עַמֶּיךָ
  choice: zu deinem Volk
  rationale: Die direkte Wiedergabe bewahrt die familiäre und gemeinschaftliche Resonanz der hebräischen Todesformel, ohne sie auf eine bestimmte Jenseitsvorstellung festzulegen.
- source_word: גַּם אָתָּה
  choice: auch du
  rationale: 'Die Wortstellung gibt die Hervorhebung natürlich wieder: Mose wird dasselbe widerfahren wie Aaron.'
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Leitet den ausdrücklichen Vergleich mit Aarons Schicksal klar und idiomatisch ein.
- source_word: נֶאֱסַף
  choice: versammelt wurde
  rationale: Die Wiederholung derselben deutschen Wortwahl erhält die sprachliche Parallele zum vorherigen Satzteil.
- source_word: אַהֲרֹן אָחִיךָ
  choice: dein Bruder Aaron
  rationale: Die im Deutschen natürliche Wortfolge bewahrt sowohl den Eigennamen als auch die Verwandtschaftsbezeichnung.
theological_decisions:
- issue: Wiedergabe der Todesformel אסף אל־עמיו
  choice: „zu deinem Volk versammelt werden“
  alternative: „sterben“ oder „zu deinen Vorfahren versammelt werden“
  rationale: Die hebräische Formulierung wird als Bild beibehalten. So bleiben ihre gemeinschaftliche und theologische Weite sowie eine mögliche Mehrdeutigkeit erhalten, ohne dem Vers eine genauer ausgearbeitete Lehre vom Jenseits aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Todesformel bleibt trotz ihrer leichten Fremdheit erhalten; die Fußnote erklärt ihre sinngemäßen Möglichkeiten.
