source:
  edition: WLC
  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: de
  text: Jahwe, der Gott der Geister alles Fleisches[a], möge einen Mann über die Gemeinde[b] einsetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Alles Fleisch“ ist eine hebräische Ausdrucksweise für die gesamte Menschheit in ihrer sterblichen Geschöpflichkeit.
    reason: cultural_note
  - marker: b
    text: 'Oder: „über die Versammlung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: möge … einsetzen
  rationale: פקד hat ein breites Bedeutungsspektrum. Mit einer Person als Objekt und der anschließenden Wendung „über die Gemeinde“ bezeichnet es hier die Einsetzung in ein Leitungsamt. Die Wunschform gibt den hebräischen Jussiv angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: der Gott der Geister
  rationale: Die formnahe Wiedergabe bewahrt den besonderen Gottestitel und den Plural רוּחוֹת. Gemeint sind die Geister beziehungsweise das innere Leben der Menschen unter Gottes Herrschaft.
- source_word: לְכָל בָּשָׂר
  choice: allen Fleisches
  rationale: Die traditionelle, im Deutschen verständliche biblische Wendung bewahrt das hebräische Bild und bezeichnet hier die gesamte Menschheit in ihrer geschöpflichen und sterblichen Existenz.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das hebräische Substantiv ist ausdrücklich maskulin und bezeichnet im Zusammenhang einen einzelnen männlichen Nachfolger für Mose.
- source_word: עַל הָעֵדָה
  choice: über die Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Bundesgemeinschaft Israels. „Gemeinde“ ist im Deutschen natürlich und erhält den gemeinschaftlichen sowie institutionellen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in der Bitte
  choice: Jahwe … möge … einsetzen
  alternative: Der HERR … setze ein
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יְהוָה. „Jahwe“ bewahrt den persönlichen Bundesnamen; die Wunschform lässt die Bitte als Bitte stehen.
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: einen Mann
  alternative: jemanden / eine Person
  rationale: Der Text verwendet ein maskulines Substantiv im Singular; im unmittelbaren Zusammenhang geht es um Josua als männlichen Nachfolger Moses. Die Übersetzung neutralisiert diese Angabe daher nicht.
- issue: Deutung von „Geister allen Fleisches“
  choice: formnahe Wiedergabe ohne nähere dogmatische Festlegung
  alternative: der Gott, der jedem Menschen seinen Geist gibt / der die Herzen aller Menschen kennt
  rationale: Die ungewöhnliche Gottesbezeichnung kann Gottes Herrschaft über das menschliche Leben und seine Kenntnis des Inneren anklingen lassen. Eine erklärende Paraphrase würde diese Bedeutung enger festlegen, als es der hebräische Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Die ungewöhnliche Wendung „Gott der Geister allen Fleisches“ bleibt erhalten, damit ihre theologische Weite nicht durch eine Paraphrase verengt wird.
