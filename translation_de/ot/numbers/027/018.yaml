  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Nimm dir Josua, den Sohn Nuns, einen Mann, in dem Geist ist,[a] und lege deine Hand auf ihn.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „einen Mann, in dem der Geist ist“ oder „einen Mann, der Geist hat“. Im Hebräischen steht kein Artikel.'
    reason: Bewahrt die grammatische und theologische Mehrdeutigkeit von רוּחַ.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als im Deutschen geläufige Transkription wieder.
- source_word: קַח לְךָ
  choice: Nimm dir
  rationale: Bewahrt sowohl den Imperativ als auch das ethische Dativpronomen לְךָ in natürlichem Deutsch.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, den Sohn Nuns
  rationale: Verwendet die geläufige deutsche Namensform und bildet die hebräische Sohnesbezeichnung idiomatisch nach.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Entspricht der ausdrücklich maskulinen Singularform im Hebräischen.
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: in dem Geist ist
  rationale: Bleibt bei der artikellosen, knappen hebräischen Formulierung und legt nicht ausdrücklich fest, ob Gottes Geist oder Geist im allgemeineren Sinn gemeint ist.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: und lege deine Hand auf ihn
  rationale: Gibt die Handlung des Handauflegens wieder und bewahrt den Singular „Hand“.
theological_decisions:
- issue: Ob רוּחַ Gottes Geist oder Geist im allgemeineren Sinn bezeichnet
  choice: Geist
  alternative: der Geist / Gottes Geist / einen Geist
  rationale: Das Hebräische hat keinen Artikel und nennt Gott nicht ausdrücklich. Die Hauptfassung bewahrt diese Offenheit; die Fußnote erläutert die möglichen Verständnisse.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst ungewohnte Wendung „in dem Geist ist“ spiegelt die knappe hebräische Formulierung; die Fußnote bietet idiomatischere beziehungsweise stärker deutende Möglichkeiten.
