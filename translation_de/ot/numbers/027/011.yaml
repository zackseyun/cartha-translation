reference: Numbers 27:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: de
  text: Und wenn sein Vater keine Brüder hat, sollt ihr sein Erbe seinem nächsten Blutsverwandten aus seiner Sippe geben[a], und er soll es in Besitz nehmen[b]. Das soll für die Söhne Israels[c] eine verbindliche Rechtsbestimmung sein[d], so wie Jahwe Mose geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seinem Blutsverwandten, der ihm aus seiner Sippe am nächsten ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und er soll es erben“.'
    reason: lexical_alternative
  - marker: c
    text: „Söhne Israels“ ist eine feststehende Bezeichnung für das Volk Israel.
    reason: cultural_note
  - marker: d
    text: 'Wörtlicher auch: „eine Rechtssatzung“ oder „eine Satzung des Rechts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים
  choice: Brüder
  rationale: 'Der unmittelbare familiäre Sinn passt zur gesetzlichen Erbfolge: Gemeint sind die Brüder des Vaters.'
- source_word: נַחֲלָתוֹ
  choice: sein Erbe
  rationale: Das Substantiv bezeichnet hier den im Rahmen der Erbfolge weiterzugebenden Erbbesitz; „Erbe“ ist dafür im modernen Deutschen klar und natürlich.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: seinem nächsten Blutsverwandten
  rationale: שְׁאֵר bezeichnet einen nahen leiblichen Verwandten, während הַקָּרֹב אֵלָיו den Grad der Verwandtschaft als den nächsten bestimmt. Die Formulierung hält beide Aspekte fest.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: aus seiner Sippe
  rationale: מִשְׁפָּחָה bezeichnet in Israels gesellschaftlicher Gliederung häufig einen größeren Verwandtschaftsverband und nicht nur die moderne Kernfamilie.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: und er soll es in Besitz nehmen
  rationale: ירשׁ kann sowohl „erben“ als auch „in Besitz nehmen“ bedeuten. Die gewählte Wiedergabe wahrt den rechtlichen Besitzübergang und vermeidet die unmittelbare Wiederholung von „Erbe“.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Söhne Israels
  rationale: Die wörtliche, im Bundeskontext feststehende Volksbezeichnung bleibt erhalten; sie bezeichnet hier Israel als Gemeinschaft.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: eine verbindliche Rechtsbestimmung
  rationale: Die Verbindung bezeichnet eine dauerhaft geltende rechtliche Satzung. „Verbindliche Rechtsbestimmung“ gibt die gesetzliche Funktion in verständlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bundes- und Volksbezeichnung לִבְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die quellensprachliche Bildhaftigkeit und der traditionelle nationale Bezug bleiben sichtbar. Die Formulierung fungiert im Zusammenhang als Bezeichnung des ganzen Volkes.
- issue: Rechtliche Formel לְחֻקַּת מִשְׁפָּט
  choice: verbindliche Rechtsbestimmung
  alternative: Satzung des Rechts
  rationale: Die Formulierung soll weder bloß rituell noch abstrakt richterlich verstanden werden, sondern als bindende Erbrechtsregel; die Alternative bildet die beiden hebräischen Bestandteile formaler ab.
translation_notes:
  register: Moderner, würdevoller Gesetzesstil mit klarer Satzstruktur. Die rechtliche Terminologie bleibt erkennbar, ohne unnötig altertümlich zu wirken. „Sippe“ bewahrt den weiteren Verwandtschaftsverband, und „Jahwe“ gibt den Gottesnamen in geläufiger deutscher Form wieder.
