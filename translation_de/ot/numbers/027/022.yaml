base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: de
  text: 'Mose tat, wie Jahwe ihm geboten hatte: Er nahm Josua und stellte ihn vor den Priester Eleasar und vor die ganze Gemeinde.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ ihn vor dem Priester Eleasar und vor der ganzen Gemeinde stehen“; das hebräische Verb kann hier auch im Sinn von „stellte ihn ihnen vor“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: Mose tat, wie Jahwe ihm geboten hatte
  rationale: Die knappe deutsche Wendung bildet Moses Gehorsam gegenüber dem vorausgehenden Befehl natürlich ab; das Plusquamperfekt wahrt die zeitliche Abfolge.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: Er nahm Josua
  rationale: „Nahm“ entspricht der Grundbedeutung von לקח und passt zum Vorgang der öffentlichen Einsetzung.
- source_word: וַיַּעֲמִדֵהוּ
  choice: stellte ihn
  rationale: Der Hifil von עמד bezeichnet hier das Veranlassen des Stehens beziehungsweise das öffentliche Hinstellen oder Vorstellen; „stellte ihn“ bewahrt den körperlichen und zeremoniellen Sinn.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet die Platzierung in der Gegenwart Eleasars und der Gemeinde und lässt sich an beiden Stellen knapp mit „vor“ wiedergeben.
- source_word: כָּל־הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה meint hier die versammelte Gemeinschaft Israels; „Gemeinde“ ist im Deutschen verständlich und im pentateuchischen Zusammenhang angemessen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, ohne ihn durch einen Hoheitstitel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken. „Gemeinde“ bezeichnet hier die versammelte Gemeinschaft Israels.
