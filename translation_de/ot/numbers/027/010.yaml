  register: Moderner, würdiger und klarer Gesetzesstil. Die Satzstellung „Wenn … aber“ bildet die kontrastive Fortführung der Fallfolge idiomatisch ab; die wörtlichere Verwandtschaftsbezeichnung bleibt im Haupttext, während die geläufige Bezeichnung in der Fußnote steht.
