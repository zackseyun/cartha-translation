  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: de
  text: Wenn er aber keine Brüder hat, sollt ihr sein Erbe den Brüdern seines Vaters geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: seinen Onkeln väterlicherseits.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel führt im gestuften Erbrecht den nächsten Fall ein; die deutsche Nachstellung von „aber“ gibt sowohl Bedingung als auch Kontrast natürlich wieder.
- source_word: אֵין לוֹ
  choice: er keine … hat
  rationale: Die hebräische Existenzverneinung mit ל und Pronominalsuffix wird im Deutschen idiomatisch als verneinter Besitz ausgedrückt.
- source_word: אַחִים
  choice: Brüder
  rationale: Der maskuline Plural bezeichnet hier im Zusammenhang des Erbrechts männliche Geschwister.
- source_word: וּנְתַתֶּם
  choice: sollt ihr … geben
  rationale: Die Form setzt die rechtliche Anweisung in der zweiten Person Plural fort; „sollt ihr“ wahrt den verbindlichen Charakter in natürlichem Deutsch.
- source_word: נַחֲלָתוֹ
  choice: sein Erbe
  rationale: נַחֲלָה bezeichnet hier den vererbten Besitz beziehungsweise Nachlass; „Erbe“ ist im deutschen Rechtssatz knapp und verständlich.
- source_word: לַאֲחֵי אָבִיו
  choice: den Brüdern seines Vaters
  rationale: Die Wiedergabe folgt eng der hebräischen Verwandtschaftsbezeichnung und vermeidet eine unnötige Umformung im Haupttext.
