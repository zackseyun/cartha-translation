  text: Then Yahweh said to Moses[a], saying,
translation:
  language: de
  text: 'Dann sagte Jahwe zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Und Jahwe sagte zu Mose, zu sagen.“ Die hebräische Formel leitet die folgende Rede ein.'
    reason: Die Funktion des ausdrücklich vorhandenen לֵאמֹר wird im Haupttext idiomatisch durch den Doppelpunkt ausgedrückt.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw consecutivum führt die Erzählung zeitlich weiter. „Dann“ gibt diese Abfolge in natürlichem Deutsch wieder; אמר bedeutet hier „sagen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Dies ist die natürliche deutsche Wiedergabe der Präposition אֶל in einer Redeeinleitung und die übliche Form des Namens מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der folgenden Rede ein. Im Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als die formelhafte Wiederholung „und sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die knappe hebräische Redeeinleitung bleibt erhalten; eine im Deutschen schwerfällige Doppelung von „sagen/sprechen“ wird in die Zeichensetzung und eine Fußnote verlagert.
