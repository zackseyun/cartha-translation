  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: de
  text: Unser Vater ist in der Wüste gestorben. Er gehörte jedoch nicht zu der Gemeinschaft, die sich gegen Jahwe zusammenschloss – zu Korachs Gemeinschaft; vielmehr starb er wegen seiner eigenen Sünde[a]. Söhne hatte er keine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „in seiner Sünde“. Der hebräische Ausdruck nennt keine bestimmte Sünde; er grenzt den Tod des Vaters lediglich von einer Beteiligung am Aufstand Korachs ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: Unser Vater
  rationale: Die Töchter sprechen von ihrem unmittelbaren Vater; die natürliche und kontextuell eindeutige Wiedergabe ist „Vater“.
- source_word: מֵת בַּמִּדְבָּר
  choice: ist in der Wüste gestorben
  rationale: Das Qal-Perfekt wird im Deutschen idiomatisch mit dem Perfekt wiedergegeben; „Wüste“ bezeichnet den Aufenthaltsraum Israels in der Wüstenzeit.
- source_word: בְּתוֹךְ הָעֵדָה
  choice: zu der Gemeinschaft
  rationale: בְּתוֹךְ bezeichnet hier die Zugehörigkeit zu einer Gruppe; עֵדָה meint in diesem Zusammenhang die versammelte Gemeinschaft.
- source_word: הַנּוֹעָדִים עַל יְהוָה
  choice: die sich gegen Jahwe zusammenschloss
  rationale: Der Niphal-Partizipialausdruck bezeichnet ein gemeinsames Sichversammeln; עַל markiert hier die feindliche Ausrichtung gegen Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּעֲדַת קֹרַח
  choice: zur Gemeinschaft Korachs
  rationale: Die Wendung identifiziert die betreffende Gruppe als die mit Korach verbundene Gemeinschaft; die Wiederholung von „Gemeinschaft“ bildet die Wiederholung von עֵדָה ab.
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: vielmehr starb er wegen seiner eigenen Sünde
  rationale: כִּי führt hier die erklärende Gegenüberstellung ein. בְּ kann kausal verstanden werden; „eigenen“ verdeutlicht den Gegensatz zur Beteiligung an Korachs Aufstand, ohne die Sünde näher zu bestimmen.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: Söhne hatte er keine
  rationale: Die deutsche Haben-Konstruktion gibt die hebräische Existenzkonstruktion mit לְ idiomatisch wieder. „Söhne“ bleibt erhalten, da es im Kontext um männliche Erben geht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt diese Form, statt sie durch einen Hoheitstitel zu ersetzen.
- issue: Persönliche Sünde gegenüber der Beteiligung an Korachs Aufstand
  choice: wegen seiner eigenen Sünde
  alternative: in seiner Sünde
  rationale: Die Formulierung erhält die Aussage, dass der Vater nicht zu Korachs Gemeinschaft gehörte, aber aufgrund seiner eigenen Sünde starb. Welche Sünde gemeint ist, lässt der Text offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze machen die Argumentation der Töchter klar; die Wiederholung von „Gemeinschaft“ bewahrt die lexikalische Verbindung der beiden Vorkommen von עֵדָה. Der markierte Alternativhinweis steht unmittelbar nach der betreffenden Wendung.
