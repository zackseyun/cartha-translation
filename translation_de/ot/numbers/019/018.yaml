  terminology: „Reiner Mann“ ist im Kontext ritueller Reinheit zutreffend und wird durch die Fußnote sinnvoll gegen moralische Missverständnisse abgesichert. „Ysop“, „besprengen“, „Geräte“, „Menschen“, „Erschlagener“, „Toter“ und „Grab“ sind jeweils angemessene, quellentreue Wiedergaben. Die Fußnote zu „Erschlagenen“ erläutert die lexikalische Abgrenzung ohne den Haupttext zu überladen.
