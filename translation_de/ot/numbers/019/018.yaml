source:
  edition: WLC
  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: de
  text: Dann soll ein reiner Mann[a] Ysop nehmen und ihn in das Wasser tauchen. Er soll das Zelt, alle Geräte und die Menschen, die dort waren, damit besprengen, ebenso den, der einen Knochen, einen Erschlagenen[b], einen Toten oder ein Grab berührt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Rein« meint hier rituell rein.
    reason: clarification
  - marker: b
    text: 'Oder: einen gewaltsam Getöteten. Das hebräische Wort bezeichnet besonders einen durch Gewalt ums Leben Gekommenen und unterscheidet sich vom allgemeineren »Toten« im folgenden Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: Ysop
  rationale: Die traditionelle Bezeichnung der bei Reinigungsriten verwendeten Pflanze bleibt erhalten; eine genauere botanische Bestimmung ist unsicher.
- source_word: בַּמַּיִם
  choice: in das Wasser
  rationale: Der bestimmte Artikel wird bewahrt; gemeint ist das zuvor bereitete Reinigungswasser.
- source_word: אִישׁ טָהוֹר
  choice: ein reiner Mann
  rationale: Die maskuline Singularform wird wiedergegeben. »Rein« bezeichnet hier den rituellen Status, nicht moralische Fehlerlosigkeit.
- source_word: וְהִזָּה
  choice: besprengen
  rationale: Das Verb bezeichnet das rituelle Aufbringen von Flüssigkeit in Tropfen; »besprengen« ist im Deutschen präzise und würdig.
- source_word: הָאֹהֶל
  choice: das Zelt
  rationale: Im Zusammenhang ist das von Totenunreinheit betroffene Wohnzelt gemeint, nicht das Heiligtum.
- source_word: הַכֵּלִים
  choice: alle Geräte
  rationale: כְּלִי bezeichnet allgemein Geräte, Gefäße oder sonstige Gebrauchsgegenstände; »Geräte« wahrt die Breite des Ausdrucks.
- source_word: הַנְּפָשׁוֹת
  choice: die Menschen
  rationale: נֶפֶשׁ meint hier die im Zelt anwesenden Personen, nicht »Seelen« im späteren anthropologischen Sinn.
- source_word: הַנֹּגֵעַ
  choice: den, der … berührt hat
  rationale: Das substantivierte Partizip bezeichnet die durch Berührung betroffene Person.
- source_word: בָּעֶצֶם
  choice: einen Knochen
  rationale: Gemeint ist im Kontext ein menschlicher Knochen als Quelle ritueller Unreinheit; der deutsche unbestimmte Artikel entspricht dem generischen Sinn.
- source_word: בֶחָלָל
  choice: einen Erschlagenen
  rationale: חָלָל bezeichnet hier einen gewaltsam Getöteten und wird vom allgemeineren מֵת unterschieden.
- source_word: בַמֵּת
  choice: einen Toten
  rationale: Der allgemeinere Ausdruck für einen Verstorbenen bleibt von dem zuvor genannten gewaltsam Getöteten unterschieden.
- source_word: בַקָּבֶר
  choice: ein Grab
  rationale: Natürliche deutsche Wiedergabe des Begriffs für eine Begräbnisstätte; der Ausdruck ist hier generisch.
theological_decisions:
- issue: Terminologie ritueller Reinheit
  choice: rein
  alternative: sauber; lauter
  rationale: Der Zusammenhang betrifft kultische Reinheit nach Kontakt mit dem Tod, nicht moralische Reinheit. Die Fußnote macht diesen Bezug ausdrücklich, ohne ihn im Haupttext auszudeuten.
- issue: Geschlechtsspezifische Formulierung von אִישׁ
  choice: Mann
  alternative: Mensch; Person
  rationale: Das Hebräische verwendet ausdrücklich das maskuline Singularsubstantiv אִישׁ; diese Form wird beibehalten, ohne daraus eine weitergehende Lehrentscheidung abzuleiten.
- issue: Unterscheidung zwischen חָלָל und מֵת
  choice: Erschlagener und Toter
  alternative: Leichnam und Toter
  rationale: Die Übersetzung erhält die Spannung zwischen dem speziell gewaltsam Getöteten und dem allgemeinen Ausdruck für einen Toten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für natürliche Lesbarkeit in zwei Sätze gegliedert; die wiederholten Zielangaben des Hebräischen bleiben inhaltlich vollständig erhalten. »Besprengen« wahrt den rituellen Ton, während »Menschen« eine missverständliche Wiedergabe als »Seelen« vermeidet.
