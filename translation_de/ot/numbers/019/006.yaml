id: NUM.19.6
reference: Numbers 19:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: de
  text: Dann soll der Priester Zedernholz, Ysop und karmesinrotes Garn nehmen und alles mitten in den Brand der Kuh[a] werfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jungen Kuh«. Das hebräische Wort bezeichnet ein weibliches Rind; sein Alter wird hier nicht eigens ausgedrückt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll ... nehmen
  rationale: Das Waw mit Qatal führt die vorgeschriebene rituelle Handlungsfolge weiter. »Dann soll« gibt den sequenziellen und rechtsförmigen Charakter im Deutschen natürlich wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche Wiedergabe von כֹּהֵן im kultischen Zusammenhang; der bestimmte Artikel bleibt erhalten.
- source_word: עֵץ אֶרֶז
  choice: Zedernholz
  rationale: Die Konstruktion bedeutet wörtlich »Holz der Zeder«; »Zedernholz« ist die natürliche und genaue deutsche Entsprechung.
- source_word: וְאֵזוֹב
  choice: Ysop
  rationale: Konventionelle Wiedergabe von אֵזוֹב. Die genaue botanische Bestimmung ist unsicher, doch »Ysop« ist als traditionelle Bezeichnung verständlich.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: karmesinrotes Garn
  rationale: Die Wendung bezeichnet mit dem aus der Kermesschildlaus gewonnenen Farbstoff gefärbtes Material. »Karmesinrotes Garn« passt zum konkreten Ritualgegenstand, ohne das wörtliche Farbelement »Wurm« irreführend wiederzugeben.
- source_word: וְהִשְׁלִיךְ
  choice: und ... werfen
  rationale: Der Hifil von שלך bedeutet »werfen«. Die moderne deutsche Formulierung ist klar und bewahrt die konkrete Handlung.
- source_word: אֶל תּוֹךְ
  choice: mitten in
  rationale: Die Verbindung bezeichnet das Innere beziehungsweise die Mitte und wird deshalb genauer als mit einem bloßen »in« wiedergegeben.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: den Brand der Kuh
  rationale: שְׂרֵפָה bezeichnet hier den Verbrennungsvorgang beziehungsweise Brand, nicht lediglich ein Feuer. פָּרָה bezeichnet ein weibliches Rind; »Kuh« ist die verständliche, untechnische Wiedergabe.
theological_decisions:
- issue: Wiedergabe von פָּרָה im Reinigungsritual mit der roten Kuh
  choice: Kuh
  alternative: junge Kuh
  rationale: Das hebräische Wort bezeichnet ein weibliches Rind, legt für sich genommen aber dessen Alter nicht eindeutig fest. »Kuh« wahrt diese Offenheit; die traditionsgeprägte Wiedergabe »junge Kuh« wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Ritualsprache. »Dann soll« kennzeichnet die fortlaufende Vorschrift. Das ergänzte »alles« ist im Deutschen nötig, um die drei genannten Gegenstände gemeinsam als Objekt von »werfen« aufzunehmen, ohne den Sinn zu verändern.
