  source_fidelity: Die Übersetzung gibt die rituelle Abfolge des Waw-Qatal angemessen mit „Dann soll“ wieder. Die drei Gegenstände, das Hineinwerfen „mitten in“ den Verbrennungsvorgang und die Bezeichnung פָּרָה als „Kuh“ sind quellennah. Das zusammenfassende „alles“ macht im Deutschen klar, dass sämtliche zuvor genannten Gegenstände geworfen werden, ohne eine zusätzliche Sachinformation einzutragen.
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch mit einem passenden würdigen Register für eine Ritualvorschrift. „Mitten in den Brand der Kuh“ ist knapp, verständlich und bewahrt die im Hebräischen betonte Platzierung in das Innere der Verbrennung.
  terminology: „Priester“, „Zedernholz“, „Ysop“ und „karmesinrotes Garn“ sind treffende, etablierte Wiedergaben. „Kuh“ wahrt die altersmäßige Offenheit von פָּרָה; die Fußnote nennt transparent die mögliche traditionsnahe Alternative „junge Kuh“, ohne diese dem Grundtext aufzuzwingen.
