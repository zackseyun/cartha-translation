  text: וְ/כֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין צָמִ֥יד פָּתִ֖יל עָלָ֑י/ו טָמֵ֖א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: de
  text: Und jedes offene Gefäß, das keinen festgebundenen Deckel[a] hat, ist unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine fest angebrachte Abdeckung“ oder „einen versiegelten Deckel“; der hebräische Ausdruck bezeichnet eine Abdeckung, die am Gefäß befestigt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Und jedes
  rationale: וְ verbindet die Vorschrift mit dem vorausgehenden Zusammenhang; כֹל mit einem singularischen Substantiv wird hier natürlich distributiv mit „jedes“ wiedergegeben.
- source_word: כְּלִי
  choice: Gefäß
  rationale: כְּלִי kann allgemein einen Gegenstand oder ein Gerät bezeichnen; in diesem Zusammenhang ist ein Behältnis gemeint, weshalb „Gefäß“ präzise und traditionsunabhängig passt.
- source_word: פָתוּחַ
  choice: offene
  rationale: Das Adjektiv bedeutet unmittelbar „offen“; der folgende Relativsatz erläutert, dass keine befestigte Abdeckung vorhanden ist.
- source_word: אֲשֶׁר אֵין ... עָלָיו
  choice: auf dem sich kein ... befindet
  rationale: Diese Formulierung gibt die im Hebräischen ausgedrückte Abwesenheit und die Lage der Abdeckung auf dem Gefäß natürlich wieder.
- source_word: צָמִיד פָּתִיל
  choice: festgebundener Deckel
  rationale: Die seltene Wortverbindung bezeichnet wahrscheinlich eine durch Binden befestigte Abdeckung. „Festgebundener Deckel“ bewahrt sowohl die konkrete Bindungsvorstellung als auch die Funktion des Verschließens, ohne einen technisch luftdichten Verschluss vorauszusetzen.
- source_word: טָמֵא הוּא
  choice: ist unrein
  rationale: Die knappe Prädikatsaussage wird ebenso knapp wiedergegeben; der kultische Zusammenhang erklärt die Art der Unreinheit, ohne dass „kultisch“ in den Haupttext eingefügt werden muss.
theological_decisions:
- issue: Art der Unreinheit
  choice: „unrein“
  alternative: „kultisch unrein“
  rationale: Der Kontext betrifft Reinheitsvorschriften, doch der hebräische Text sagt lediglich טָמֵא. Die schlichte Wiedergabe bewahrt die Ausdrucksweise des Ausgangstextes und vermeidet eine erklärende Ergänzung im Haupttext.
- issue: Art des Gefäßverschlusses
  choice: „festgebundener Deckel“
  alternative: „fest angebrachte Abdeckung“ oder „versiegelter Deckel“
  rationale: Die genaue antike Ausführung bleibt ungewiss. Die gewählte Formulierung erhält das Element des Bindens, ohne aus dem Text eine bestimmte technische Art der Versiegelung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ist aber idiomatisch. „Gefäß“ und „unrein“ entsprechen dem sachlichen Register der Reinheitsvorschrift; die Fußnote wahrt die lexikalische Unsicherheit bei צָמִיד פָּתִיל.
