  to: Ein reiner Mann soll die Asche der Kuh einsammeln und sie außerhalb des Lagers an einem reinen Ort niederlegen. Sie soll für die Gemeinde der Israeliten zur Verwendung für Wasser zur Beseitigung von Unreinheit[a] aufbewahrt werden; sie ist ein Sündopfer[b].
  rationale: Die Revision beseitigt die nicht vom Vers geforderte Altersangabe bei פָּרָה und gibt die durch לְמֵי נִדָּה angezeigte Bestimmung der Asche wieder, ohne einen über den Wortlaut hinausgehenden unmittelbaren Bereitungsvorgang zu behaupten. Die begriffliche Mehrdeutigkeit von חַטָּאת bleibt im Haupttext und in der Fußnote erhalten.
