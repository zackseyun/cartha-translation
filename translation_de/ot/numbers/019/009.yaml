reference: Numbers 19:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: de
  text: Ein reiner Mann soll die Asche der Kuh einsammeln und sie außerhalb des Lagers an einem reinen Ort niederlegen. Sie soll für die Gemeinde der Israeliten zur Verwendung für Wasser zur Beseitigung von Unreinheit[a] aufbewahrt werden; sie ist ein Sündopfer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungswasser“. Wörtlicher: „Wasser der Unreinheit“; gemeint ist Wasser zur Beseitigung ritueller Unreinheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie ist ein Reinigungsopfer“. Das hebräische Wort חַטָּאת kann ein Sündopfer bezeichnen und in priesterlichen Texten zugleich dessen reinigende Funktion hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: ein reiner Mann
  rationale: אִישׁ bezeichnet ausdrücklich einen Mann; טָהוֹר meint im rituellen Zusammenhang kultische Reinheit. Das knappe „rein“ bleibt verständlich und wird durch den Kontext präzisiert.
- source_word: וְאָסַף
  choice: soll … einsammeln
  rationale: Das Perfekt mit וְ setzt die rituelle Anweisungsfolge fort. „Soll“ gibt diesen rechtlich-instruktiven Sinn wieder; „einsammeln“ passt natürlich zum Aufnehmen der Asche.
- source_word: אֵפֶר הַפָּרָה
  choice: die Asche der jungen Kuh
  rationale: אֵפֶר ist kollektiv „Asche“. פָּרָה bezeichnet ein weibliches Rind; „junge Kuh“ ist im heutigen Deutsch verständlicher und genauer als das oft missverständliche „Färse“, ohne ein im Vers nicht genanntes Alter zu stark festzulegen.
- source_word: וְהִנִּיחַ
  choice: und sie … niederlegen
  rationale: Das Verb bezeichnet das Hinlegen, Absetzen oder Deponieren. „Niederlegen“ bewahrt den konkreten Vorgang und den würdigen Anweisungsstil.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Die Wendung ist hier lokal zu verstehen und wird im Deutschen idiomatisch mit „außerhalb des Lagers“ wiedergegeben.
- source_word: בְּמָקוֹם טָהוֹר
  choice: an einem reinen Ort
  rationale: „Rein“ bewahrt die Verbindung zu טָהוֹר beim Mann und lässt den rituellen Sinn im Kontext hervortreten.
- source_word: וְהָיְתָה … לְמִשְׁמֶרֶת
  choice: Dort soll sie … aufbewahrt werden
  rationale: Die feminine Singularform bezieht sich am natürlichsten auf die kollektiv verstandene Asche. לְמִשְׁמֶרֶת bezeichnet Verwahrung beziehungsweise Bereithaltung; „aufbewahrt werden“ gibt die Funktion idiomatisch wieder.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: für die Gemeinde der Israeliten
  rationale: עֵדָה ist die versammelte beziehungsweise rechtlich-religiöse Gemeinschaft. „Gemeinde der Israeliten“ ist natürliches modernes Deutsch und gibt בני ישראל gemeinschaftsbezogen wieder.
- source_word: לְמֵי נִדָּה
  choice: um Wasser gegen Unreinheit zu bereiten
  rationale: Wörtlich steht „für Wasser der Unreinheit/Absonderung“. Die gewählte Formulierung macht die Zweckbeziehung deutlich, ohne נִדָּה einfach mit allgemeiner Reinigung gleichzusetzen; eine geläufigere Alternative steht in der Fußnote.
- source_word: חַטָּאת הִוא
  choice: sie ist ein Sündopfer
  rationale: חַטָּאת kann Sünde, Sündopfer oder im priesterlichen Sprachgebrauch ein der Reinigung dienendes Opfer bezeichnen. „Sündopfer“ bewahrt den traditionellen Opferbegriff; das feminine „sie“ hält den Rückbezug auf die Asche sichtbar.
theological_decisions:
- issue: Bedeutung von חַטָּאת innerhalb eines Reinigungsrituals
  choice: sie ist ein Sündopfer
  alternative: sie dient der Reinigung von Sünde / sie ist ein Reinigungsopfer
  rationale: Der hebräische Ausdruck verbindet Sünde, Opfer und rituelle Reinigung, ohne diese Aspekte hier ausdrücklich voneinander zu trennen. Der Haupttext wahrt den etablierten Opferbegriff; die Fußnote nennt die funktionale Deutung, damit die im Kontext vorhandene Spannung nicht aufgelöst wird.
- issue: Funktion des מֵי נִדָּה
  choice: Wasser gegen Unreinheit
  alternative: Reinigungswasser
  rationale: נִדָּה bezeichnet hier rituelle Unreinheit beziehungsweise deren Beseitigung. Die Hauptfassung hält die Unreinheit ausdrücklich fest; die idiomatische Alternative erläutert den Zweck.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rituell-rechtlicher Satzführung. Fachlich belastete Begriffe werden im Haupttext knapp gehalten und in Fußnoten erläutert. Die Wiederholung von „rein“ gibt die hebräische Wortverbindung wieder; „Israeliten“ vermeidet die im Deutschen unnatürliche Formel „Söhne Israels“.
