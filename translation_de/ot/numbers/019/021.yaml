  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: de
  text: 'Und dies soll für sie eine bleibende Satzung sein: Wer das Reinigungswasser[a] sprengt, soll seine Kleider waschen; und wer das Reinigungswasser berührt, ist bis zum Abend unrein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wasser der Unreinheit“; sinngemäß auch: „Wasser zur Beseitigung der Unreinheit“; traditionell: „Entsündigungswasser“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: Und dies soll für sie eine bleibende Satzung sein
  rationale: Die Formulierung gibt die fortdauernde Geltung der Vorschrift wieder. „Bleibend“ bewahrt den zeitlichen Sinn von עוֹלָם im gesetzlichen Zusammenhang, ohne über den Kontext hinaus eine metaphysische Aussage zu erzwingen.
- source_word: וּמַזֵּה
  choice: Wer … versprengt
  rationale: Das substantivierte Partizip bezeichnet die Person, die das Wasser im rituellen Vollzug sprengt. „Versprengen“ ist im Deutschen präziser als das im Alltag weiter gefasste „besprengen“.
- source_word: מֵי הַנִּדָּה
  choice: Reinigungswasser
  rationale: Die Wendung bezeichnet im Zusammenhang von Numeri 19 das eigens bereitete Wasser zur Beseitigung ritueller Unreinheit. Die gut verständliche Wiedergabe „Reinigungswasser“ gibt die Funktion wieder; die eigentümliche hebräische Formulierung und mögliche Alternativen bleiben in der Fußnote sichtbar.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: soll seine Kleider waschen
  rationale: Die Formulierung bildet die vorgeschriebene Handlung klar und in heutigem Deutsch ab.
- source_word: וְהַנֹּגֵעַ
  choice: und wer … berührt
  rationale: Das zweite substantivierte Partizip wird parallel und natürlich wiedergegeben.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: ist bis zum Abend unrein
  rationale: „Unrein“ ist der sachgerechte Begriff für den kultisch-rituellen Status; „bis zum Abend“ entspricht der üblichen deutschen Wendung und der zeitlichen Grenze des Hebräischen.
theological_decisions:
- issue: Rituelle Unreinheit und die Bezeichnung des verwendeten Wassers
  choice: „unrein“ und „Reinigungswasser“ als kultisch-rituelle Begriffe
  alternative: „Wasser der Unreinheit“, „Wasser zur Beseitigung der Unreinheit“ oder traditionell „Entsündigungswasser“
  rationale: Der Vers behandelt rituelle Unreinheit, nicht unmittelbar moralische Schuld. „Reinigungswasser“ macht die Funktion verständlich, während die Fußnote die ungewöhnliche und mehrdeutige hebräische Fügung offenlegt und eine dogmatische Überdeutung vermeidet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Rechtssatz bleibt knapp und parallel gebaut; kultische Fachsprache wird verständlich formuliert, ohne die rituelle Kategorie moralisch umzudeuten.
