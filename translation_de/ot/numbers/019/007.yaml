base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: de
  text: Dann soll der Priester seine Kleider waschen und seinen Körper mit Wasser waschen. Danach darf er das Lager betreten; der Priester ist jedoch bis zum Abend unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Unrein“ bezeichnet hier rituelle Unreinheit, nicht notwendig persönliche Sünde oder moralische Schuld.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: soll seine Kleider waschen
  rationale: Das Piel von כבס bezeichnet das Waschen von Kleidung; „soll“ gibt die Verfahrensanweisung im deutschen Rechtstext natürlich wieder.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: seinen Körper mit Wasser abwaschen
  rationale: בשר meint hier den Körper. „Mit Wasser abwaschen“ bewahrt den Waschvorgang und gibt die instrumentale beziehungsweise mediale Bedeutung der Präposition idiomatisch wieder, ohne ein vollständiges Bad ausdrücklich vorauszusetzen.
- source_word: וְאַחַר
  choice: Danach
  rationale: Kennzeichnet klar und knapp die zeitliche Folge des Ritualablaufs.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: darf er ins Lager kommen
  rationale: Der Imperfekt kann in diesem Verfahrenszusammenhang die nach dem Waschen erlaubte Rückkehr bezeichnen; „darf“ macht diese Lesart deutlich, ohne einen Befehl zur Rückkehr zu formulieren.
- source_word: וְטָמֵא הַכֹּהֵן
  choice: doch der Priester bleibt ... unrein
  rationale: Die koordinierende Konstruktion bezeichnet den trotz Waschung fortbestehenden Status. „Bleibt“ stellt den zeitlichen Fortbestand natürlich dar; „unrein“ bewahrt den kultisch-rechtlichen Terminus.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Gängige, natürliche deutsche Wiedergabe des bestimmten hebräischen Ausdrucks.
theological_decisions:
- issue: Art der Unreinheit
  choice: kultisch-ritueller Status, nicht moralische Schuld
  alternative: moralische Unreinheit
  rationale: Im Zusammenhang von Numeri 19 bezeichnet טמא einen zeitlich begrenzten kultischen Status. Der Haupttext lässt den Fachbegriff „unrein“ stehen; die Fußnote verhindert eine moralische Fehlinterpretation.
- issue: Rückkehr ins Lager
  choice: erlaubte Rückkehr nach dem Waschen
  alternative: angeordnete oder lediglich vorausgesagte Rückkehr
  rationale: יָבֹא kann formal auch „wird/soll kommen“ bedeuten. Im Ablauf liegt eine Erlaubnis zur Rückkehr nahe; die bleibende Unreinheit bis zum Abend erhält dabei die Spannung des Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gesetzessprache. Die Abfolge und die Spannung zwischen erlaubter Rückkehr und fortbestehender ritueller Unreinheit bleiben erhalten.
