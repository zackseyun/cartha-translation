  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: de
  text: Er soll sich damit[a] am dritten und am siebten Tag reinigen; dann wird er rein sein. Wenn er sich aber nicht am dritten und am siebten Tag reinigt[b], wird er nicht rein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: mit dem zuvor in diesem Kapitel zubereiteten Reinigungswasser.'
    reason: cross_reference
  - marker: b
    text: Das hebräische Verb bezeichnet hier die rituelle Reinigung von Unreinheit, nicht die Vergebung von Sünde.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: sich entsündigen
  rationale: Das Hitpael von חטא bezeichnet in diesem rituellen Zusammenhang die Beseitigung von Unreinheit. „Sich entsündigen“ hält die besondere, von טהר unterschiedene Wortwahl sichtbar, ohne hier moralische Vergebung zu behaupten; eine Fußnote erläutert den rituellen Sinn.
- source_word: בּוֹ
  choice: damit
  rationale: Das Pronomen verweist am natürlichsten auf das zuvor genannte Reinigungswasser. „Damit“ bewahrt den knappen Rückverweis des Hebräischen.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: am dritten und am siebten Tag
  rationale: Natürliche deutsche Zeitangabe, welche die beiden vorgeschriebenen Tage und ihre Verbindung genau wiedergibt.
- source_word: יִטְהָר
  choice: wird er rein sein
  rationale: טהר bezeichnet hier den erreichten Status ritueller Reinheit. Die Wiedergabe unterscheidet das Ergebnis sprachlich vom vorausgehenden Reinigungsritus.
- source_word: וְאִם לֹא
  choice: Wenn ... aber nicht
  rationale: Die Stellung von „aber“ im deutschen Bedingungssatz gibt den kontrastierenden Warncharakter natürlich wieder.
- source_word: הוּא
  choice: Er
  rationale: Das ausdrückliche maskuline Singularpronomen wird bewahrt und bezieht sich im Zusammenhang auf den zuvor genannten unreinen Menschen.
theological_decisions:
- issue: Art der Reinigung in Numeri 19
  choice: Die Aussage als rituelle Entsündigung und Reinheit wiedergeben.
  alternative: Eine moralische Vergebung oder innere Heiligung ausdrücken.
  rationale: Der Zusammenhang betrifft Verunreinigung durch einen Toten und den vorgeschriebenen Gebrauch des Reinigungswassers. Der Vers beschreibt den kultischen Reinheitsstatus, nicht ausdrücklich die Vergebung persönlicher Schuld.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entsündigen“ ist bewusst fachsprachlicher als gewöhnliches „reinigen“, um die Unterscheidung zwischen יתחטא und טהר zu erhalten; die Fußnote verhindert eine moralische Überdeutung.
