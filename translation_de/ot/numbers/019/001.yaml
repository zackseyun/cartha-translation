  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose und Aaron:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר mit narrativem וַ führt einen neuen Redeakt ein; „sprach“ gibt die feierliche Erzählformel natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und Aaron
  rationale: „Zu“ bezeichnet die Adressaten der Rede. Im Deutschen muss die Präposition vor dem zweiten Namen nicht wiederholt werden, da beide eindeutig gleichgeordnet sind.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die formelhafte Einleitung der folgenden direkten Rede wird im modernen Deutschen idiomatisch durch einen Doppelpunkt ausgedrückt; ein zusätzliches „und sagte“ wäre schwerfällig und redundant.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der im Deutschen üblichen wissenschaftlich begründeten Umschrift.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeformel bleibt erhalten, wobei לֵאמֹר idiomatisch durch den Doppelpunkt wiedergegeben wird.
