  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: de
  text: Wer die Asche der Kuh einsammelt, soll seine Kleider waschen; er ist bis zum Abend unrein. Dies soll für die Israeliten[a] und für den Fremden, der in ihrer Mitte lebt, eine ewige Satzung[b] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für die Söhne Israels“; die Wendung bezeichnet das Volk Israel insgesamt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine dauerhafte Satzung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  choice: wer … einsammelt
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet die handelnde Person. Die deutsche Relativkonstruktion ist natürlich und bewahrt den fortdauernden Handlungsbezug.
- source_word: אֵפֶר הַפָּרָה
  choice: die Asche der jungen Kuh
  rationale: אֵפֶר ist kollektiv als „Asche“ zu verstehen. פָּרָה bezeichnet ein weibliches Rind; „junge Kuh“ ist im heutigen Deutsch verständlicher als das fachsprachliche „Färse“ und genauer als eine geschlechtsneutrale Bezeichnung.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: soll seine Kleider waschen
  rationale: כִבֶּס bezeichnet im Kontext priesterlicher Reinheitsvorschriften das Waschen von Kleidung. „Soll“ gibt den rechtlichen Vorschriftscharakter idiomatisch wieder.
- source_word: וְטָמֵא
  choice: und ist … unrein
  rationale: Das Adjektiv bezeichnet hier einen rituellen Status, nicht moralische Schuld. Die präsentische Rechtsformulierung ist im Deutschen natürlich und lässt offen, ob der hebräische Ausdruck als Zustand oder Resultat akzentuiert wird.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Formulierung entspricht dem determinierten hebräischen Ausdruck und ist idiomatisches Deutsch.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Israeliten
  rationale: Die feste hebräische Kollektivbezeichnung „Söhne Israels“ meint hier das Volk Israel insgesamt. „Israeliten“ gibt diesen korporativen Sinn im modernen Deutschen klar wieder; die wörtliche Form wird in einer Fußnote bewahrt.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: und für den Fremden, der als Fremder in ihrer Mitte lebt
  rationale: גֵּר bezeichnet einen nichtisraelitischen ansässigen Fremden. Die Wiederholung „Fremder … als Fremder“ spiegelt bewusst die hebräische Wortwiederholung, während „lebt“ den residenten Charakter verständlich ausdrückt.
- source_word: לְחֻקַּת עוֹלָם
  choice: eine ewige Satzung
  rationale: חֻקָּה ist eine verbindliche Satzung; עוֹלָם bezeichnet in dieser Rechtsformel unbegrenzte beziehungsweise dauerhafte Geltung. „Ewig“ bewahrt die volle zeitliche Ausdruckskraft, während eine Fußnote die mögliche Wiedergabe „dauerhaft“ nennt.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die grammatisch maskuline Wendung ist eine feste korporative Bezeichnung für das gesamte Volk. Im Deutschen ist „Israeliten“ zugleich genau und natürlich; die formale Gestalt des Hebräischen wird in der Fußnote kenntlich gemacht.
- issue: Rituelle Unreinheit
  choice: unrein
  alternative: rituell unrein
  rationale: „Unrein“ entspricht der kultischen Terminologie des Abschnitts, ohne moralische Verfehlung auszusagen. Der Kontext macht den rituellen Sinn deutlich; ein erklärender Zusatz im Haupttext wäre daher unnötig.
- issue: Zeitliche Tragweite von עוֹלָם
  choice: ewige Satzung
  alternative: dauerhafte Satzung
  rationale: Die hebräische Rechtsformel kann sowohl mit „ewig“ als auch kontextbezogen mit „dauerhaft“ wiedergegeben werden. Der Haupttext bewahrt die stärkere formale Entsprechung, ohne die semantische Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die hebräische Wiederholung bei גֵּר wurde soweit natürlich beibehalten. Fußnoten markieren die korporative Wendung „Söhne Israels“ und die Bedeutungsbreite von עוֹלָם.
