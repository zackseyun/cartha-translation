  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: de
  text: 'Dies ist die Weisung: Wenn ein Mensch in einem Zelt stirbt, wird jeder, der das Zelt betritt, und jeder, der sich im Zelt befindet,[a] sieben Tage unrein sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, was sich im Zelt befindet“. Der hebräische Ausdruck kann sowohl Menschen als auch Sachen bezeichnen. Der Parallelismus mit dem vorangehenden Satzteil und die Einzahl des Verbs sprechen jedoch eher für Personen; Gefäße werden im folgenden Vers ausdrücklich behandelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Dies ist die Weisung
  rationale: תּוֹרָה bezeichnet hier die verbindliche Vorschrift zur Verunreinigung durch einen Toten. „Weisung“ wahrt den Bedeutungsumfang des hebräischen Wortes und klingt in diesem kultrechtlichen Zusammenhang würdig und verständlich.
- source_word: אָדָם כִּי יָמוּת
  choice: Wenn ein Mensch … stirbt
  rationale: אָדָם ist hier generisch und bezeichnet einen Menschen unabhängig vom Geschlecht; כִּי führt den Fall ein, für den die Vorschrift gilt. „Wenn“ entspricht natürlichem deutschem Gesetzesstil.
- source_word: בְּאֹהֶל
  choice: in einem Zelt
  rationale: Das erste Vorkommen ist im Hebräischen unbestimmt und führt den Schauplatz ein.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: jeder, der das Zelt betritt
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden Eintretenden; die Formulierung ist im modernen Deutsch natürlich.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: und alles, was sich im Zelt befindet
  rationale: אֲשֶׁר ist nicht ausdrücklich auf Personen beschränkt. Die neutrale Wiedergabe „alles, was“ erhält die mögliche umfassende Aussage, statt sie aufgrund des Parallelismus stillschweigend auf Menschen einzuengen.
- source_word: יִטְמָא
  choice: wird … unrein sein
  rationale: Das Imperfekt beschreibt im Rechtssatz die eintretende kultische Unreinheit. „Unrein sein“ ist sachlich und vermeidet die im heutigen Deutsch ungewöhnlich befehlshaft klingende Form „soll unrein sein“.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage
  rationale: Die schlichte Zeitangabe wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Umfang von וְכָל אֲשֶׁר בָּאֹהֶל
  choice: Im Haupttext umfassend als „alles, was sich im Zelt befindet“ wiedergegeben.
  alternative: „jeder, der sich im Zelt befindet“
  rationale: Der hebräische Relativausdruck kann Personen wie Sachen einschließen. Der vorangehende Ausdruck bezieht sich deutlich auf Eintretende, und Vers 15 regelt Gefäße eigens; dennoch erzwingt die Grammatik hier keine rein personale Deutung. Die Fußnote hält die engere Möglichkeit offen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit verständlicher kultrechtlicher Terminologie. „Weisung“ bildet תּוֹרָה weniger eng als „Gesetz“ ab; die Satzstruktur bleibt nahe am hebräischen Rechtssatz.
