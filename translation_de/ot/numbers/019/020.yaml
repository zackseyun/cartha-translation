source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: de
  text: Wer aber unrein wird und sich nicht reinigt, der soll aus der Mitte der Versammlung abgeschnitten werden[a]; denn er hat das Heiligtum des HERRN unrein gemacht. Das Reinigungswasser[b] wurde nicht auf ihn gesprengt; er ist unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jene Person soll aus der Mitte der Versammlung abgeschnitten werden.“ Die hebräische Rechtsformel legt nicht ausdrücklich fest, auf welche Weise dies vollzogen wird.'
    reason: Bewahrt die rechtliche und theologische Offenheit von וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא, ohne die Sanktion als bloßen Ausschluss zu bestimmen.
  - marker: b
    text: 'Wörtlich: „Wasser der Unreinheit“; traditionell auch „Wasser der Absonderung“. Gemeint ist das in diesem Kapitel bereitete Wasser zur Reinigung.'
    reason: Dokumentiert die alternative wörtliche Wiedergabe von מֵי נִדָּה und erläutert die Funktion im unmittelbaren Kontext.
lexical_decisions:
- source_word: אִישׁ
  choice: wer
  rationale: Die generische Relativkonstruktion gibt den einzelnen Betroffenen im natürlichen modernen Deutsch wieder, ohne das grammatische Maskulinum unnötig als geschlechtliche Einschränkung zu verstehen.
- source_word: יִטְמָא
  choice: unrein wird
  rationale: Die Form bezeichnet hier den Eintritt in einen Zustand kultischer Unreinheit, nicht notwendig moralische Schuld.
- source_word: יִתְחַטָּא
  choice: sich entsündigt
  rationale: Das Hitpael von חטא ist in diesem kultischen Zusammenhang ein Fachausdruck für die vorgeschriebene Reinigung. „Sich entsündigen“ wahrt die auffällige hebräische Wortbildung, während der Kontext die rituelle Bedeutung erkennen lässt.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: der soll … ausgeschlossen werden
  rationale: נפש bezeichnet in der Rechtsformel die ganze Person. „Ausgeschlossen werden“ gibt das Abgeschnittenwerden wieder, ohne den nicht ausdrücklich genannten Vollzug als Hinrichtung festzulegen.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: aus der Mitte der Versammlung
  rationale: קהל meint die versammelte Bundesgemeinschaft; die Formulierung bewahrt sowohl den gemeinschaftlichen als auch den rechtlichen Sinn.
- source_word: מִקְדַּשׁ יְהוָה
  choice: das Heiligtum des HERRN
  rationale: מקדש bezeichnet den heiligen Wohn- und Kultbereich. Der Gottesname wird nach deutscher Bibelkonvention mit „HERR“ wiedergegeben.
- source_word: טִמֵּא
  choice: unrein gemacht
  rationale: Das Piel bezeichnet hier, dass das Heiligtum durch die fortbestehende Unreinheit kultisch verunreinigt wird; die Wortwahl hält die Verbindung zum wiederholten טמא sichtbar.
- source_word: מֵי נִדָּה
  choice: Reinigungswasser
  rationale: Die Wendung bezeichnet das in diesem Kapitel bereitete Wasser zur Beseitigung der durch einen Toten verursachten Unreinheit. Die knappe deutsche Bezeichnung gibt seine Funktion verständlich wieder; die wörtlichere Alternative steht in der Fußnote.
- source_word: זֹרַק עָלָיו
  choice: wurde nicht auf ihn gesprengt
  rationale: זרק bezeichnet im Ritual das Sprengen beziehungsweise Versprengen einer Flüssigkeit auf jemanden.
- source_word: טָמֵא הוּא
  choice: er ist unrein
  rationale: Die verblos formulierte Schlussaussage stellt seinen fortbestehenden rechtlich-kultischen Status direkt fest.
theological_decisions:
- issue: Art der Strafe in der Formel כרת
  choice: „aus der Mitte der Versammlung ausgeschlossen werden“ mit Fußnote zur wörtlichen Wendung
  alternative: „ausgerottet/abgeschnitten werden“, als mögliche Todesstrafe oder unmittelbares göttliches Gericht verstanden
  rationale: Der Vers benennt den genauen Vollzug nicht. Die Übersetzung macht die Trennung von der Gemeinschaft deutlich, während die Fußnote die offenere hebräische Rechtsformel bewahrt und keine bestimmte Vollzugsart dogmatisch festlegt.
- issue: Bedeutung von יתחטא
  choice: kultische Reinigung („sich entsündigt“)
  alternative: moralische Vergebung oder gewöhnliches Reinigen
  rationale: Im Zusammenhang von Numeri 19 geht es um die vorgeschriebene Reinigung von Totenunreinheit. Die Form enthält zwar die Wurzel חטא, darf hier aber nicht auf moralische Sünde verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultrechtlicher Präzision. Die Wiederholung von „unrein“ bildet die hebräische Leitwortstruktur ab. „Sich entsündigen“ ist bewusst leicht fachsprachlich und bibelsprachlich, weil die zugrunde liegende Form im Hebräischen auffällig ist; der unmittelbare Kontext verhindert eine rein moralische Deutung.
