source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: de
  text: Jeder, der einen Toten berührt, den Leichnam eines Menschen, der gestorben ist, und sich nicht reinigt, hat die Wohnung des HERRN verunreinigt. Jener Mensch soll von Israel abgeschnitten werden. Denn das Reinigungswasser[a] wurde nicht auf ihn gesprengt; er bleibt unrein, seine Unreinheit haftet ihm noch an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wasser der Unreinheit“; gemeint ist das Wasser, das zur Beseitigung der durch einen Toten verursachten Unreinheit verwendet wurde.'
    reason: lexikalische Alternative und Erklärung des kultischen Fachausdrucks
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: der einen Toten berührt
  rationale: Das Partizip von נגע bezeichnet hier unmittelbare Berührung; מֵת wird durch die folgende Apposition als menschlicher Leichnam bestimmt.
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: den Leichnam eines Menschen, der gestorben ist
  rationale: נֶפֶשׁ bezeichnet im Kontext der Leichenunreinheit den toten Körper; אָדָם ist hier generisch und wird natürlich mit „Mensch“ wiedergegeben.
- source_word: יִתְחַטָּא
  choice: sich entsündigt
  rationale: Der Hitpael von חטא ist hier ein kultischer Fachausdruck für die rituelle Reinigung. „Sich entsündigen“ bewahrt die ungewöhnliche Wortbildung und vermeidet eine rein hygienische Deutung.
- source_word: מִשְׁכַּן יְהוָה
  choice: die Wohnung des HERRN
  rationale: מִשְׁכָּן bedeutet Wohnstätte bzw. Wohnung und bezeichnet das Heiligtum; „Wohnung“ ist verständlich und bildet den hebräischen Begriff direkt ab. Das Tetragramm wird nach deutscher Bibelkonvention mit HERR wiedergegeben.
- source_word: טִמֵּא
  choice: unrein gemacht
  rationale: Der Piel bezeichnet das Verunreinigen des Heiligtums. Die Wiedergabe hält den Zusammenhang mit טָמֵא und טֻמְאָה im zweiten Versglied sichtbar.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: Dieser Mensch soll ... ausgerottet werden
  rationale: נֶפֶשׁ meint hier die betreffende Person. „Ausgerottet werden“ bewahrt die gewichtige Bundes- und Gerichtsformel, ohne ihre konkrete Vollzugsweise festzulegen.
- source_word: מֵי נִדָּה
  choice: Reinigungswasser
  rationale: Wörtlich handelt es sich um „Wasser der Unreinheit“; funktional ist das zur Beseitigung der Leichenunreinheit bestimmte Wasser gemeint. Die Fußnote erhält die formale Ambiguität.
- source_word: זֹרַק עָלָיו
  choice: wurde nicht auf ihn gesprengt
  rationale: זרה bezeichnet in diesem Ritual das Besprengen; die deutsche Passivform entspricht der hebräischen Konstruktion.
- source_word: טָמֵא יִהְיֶה
  choice: er bleibt unrein
  rationale: Im Zusammenhang mit der unterlassenen Besprengung bezeichnet die Wendung den fortbestehenden Status; „bleibt“ macht diesen Zusammenhang im Deutschen natürlich deutlich.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: seine Unreinheit haftet ihm noch an
  rationale: עוֹד kennzeichnet das Fortbestehen, und בּוֹ beschreibt die weiterhin an der Person befindliche Unreinheit. „Haftet ihm ... an“ bewahrt dieses Bild idiomatisch.
theological_decisions:
- issue: Bedeutung der Sanktion וְנִכְרְתָה
  choice: aus Israel ausgerottet werden
  alternative: aus der Gemeinschaft ausgeschlossen / getötet werden
  rationale: Die hebräische Formel bestimmt in diesem Vers nicht ausdrücklich, ob menschlicher Ausschluss, Tod oder göttliches Gericht gemeint ist. Daher wird die traditionelle offene Gerichtsformel beibehalten.
- issue: Art der Verunreinigung
  choice: kultisch-rituelle Unreinheit sprachlich als „unrein“ wiedergeben
  alternative: moralische Schuld oder hygienische Verunreinigung
  rationale: Der Kontext handelt von Leichenberührung, Besprengung und Heiligtum. Die Übersetzung wahrt die kultische Kategorie, ohne sie mit moralischer Schuld oder Hygiene gleichzusetzen.
- issue: Bezug von מֵי נִדָּה
  choice: Reinigungswasser mit wörtlicher Alternative in der Fußnote
  alternative: Wasser der Unreinheit im Haupttext
  rationale: Der Ausdruck bezeichnet das Wasser, das gegen die Unreinheit eingesetzt wird. Die verständliche Funktionsangabe im Haupttext und die wörtliche Form in der Fußnote bewahren sowohl Sinn als auch sprachliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, wurde aber zur besseren Verständlichkeit in zwei Hauptsätze gegliedert. Kultische Schlüsselbegriffe werden konsequent mit „unrein/Unreinheit“ wiedergegeben; die offene Sanktionsformel bleibt erhalten.
