  naturalness: Die Satzführung ist klar und würdig. „Sich reinigen“ ist in diesem kultischen Kontext natürlich; die fortgesetzte Terminologie „unrein/Unreinheit“ verdeutlicht, dass keine hygienische Aussage gemeint ist. „Von Israel abgeschnitten werden“ bewahrt die formelhafte, bewusst offene Sanktion.
  terminology: „Wohnung des HERRN“ ist als Wiedergabe von מִשְׁכַּן יְהוָה vertretbar. „Reinigungswasser“ ist als verständliche funktionale Wiedergabe von מֵי נִדָּה mit der vorhandenen Fußnote vertretbar. „Verunreinigt“ stellt den Zusammenhang mit „unrein/Unreinheit“ klar her.
