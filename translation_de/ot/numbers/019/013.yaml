revisions:
- from: Jeder, der einen Toten berührt, den Leichnam eines Menschen, der gestorben ist, und sich nicht entsündigt, hat die Wohnung des HERRN unrein gemacht. Dieser Mensch soll aus Israel ausgerottet werden. Denn das Reinigungswasser[a] wurde nicht auf ihn gesprengt; er bleibt unrein, seine Unreinheit haftet ihm noch an.
  to: Jeder, der einen Toten berührt, den Leichnam eines Menschen, der gestorben ist, und sich nicht reinigt, hat die Wohnung des HERRN verunreinigt. Jener Mensch soll von Israel abgeschnitten werden. Denn das Reinigungswasser[a] wurde nicht auf ihn gesprengt; er bleibt unrein, seine Unreinheit haftet ihm noch an.
  rationale: Die Revision ersetzt die moralisch missverständliche Wendung „sich entsündigt“ durch „sich reinigt“, das im unmittelbaren kultischen Kontext eindeutig rituell zu verstehen ist. Die Sanktion wird mit der formelhaften Wendung „von Israel abgeschnitten werden“ wiedergegeben, damit weder Todesstrafe noch bloßer gemeinschaftlicher Ausschluss in den Text eingetragen wird. Die übrigen Formulierungen und der Fußnotenanker bleiben erhalten.
