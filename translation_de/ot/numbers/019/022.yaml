source:
  edition: WLC
  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: de
  text: Und alles, was ein unreiner Mensch berührt, wird unrein; und wer es[a] berührt, wird bis zum Abend unrein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Objekt von „berührt“ ist im Hebräischen nicht ausdrücklich genannt. Das „es“ ist aus dem Zusammenhang ergänzt und bezieht sich in dieser Übersetzung auf das zuvor Berührte.
    reason: implicit_object
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Und alles, was
  rationale: Die umfassende Aussage von כֹל und der Relativanschluss mit אֲשֶׁר werden im modernen Deutschen klar und natürlich wiedergegeben.
- source_word: יִגַּע בּוֹ
  choice: berührt
  rationale: נגע mit ב bezeichnet hier den unmittelbaren Kontakt; „berühren“ passt zum Zusammenhang der kultischen Unreinheit.
- source_word: הַטָּמֵא
  choice: der unreine Mensch
  rationale: Das substantivierte Adjektiv bezeichnet hier einen Menschen im Zustand kultischer Unreinheit. Die Ergänzung „Mensch“ macht den Bezug im Deutschen eindeutig.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: Die Verbform bezeichnet die durch Berührung eintretende Unreinheit und wird als Zustandsveränderung wiedergegeben.
- source_word: וְהַנֶּפֶשׁ הַנֹּגַעַת
  choice: und wer … berührt
  rationale: נֶפֶשׁ bezeichnet in diesem Rechtskontext die ganze Person, nicht eine vom Körper getrennte „Seele“. Die deutsche Konstruktion mit „wer“ ist idiomatisch und bewahrt den Personenbezug.
- source_word: תִּטְמָא עַד הָעָרֶב
  choice: ist bis zum Abend unrein
  rationale: Die Formulierung gibt den fortdauernden Zustand kultischer Unreinheit und seine zeitliche Grenze klar wieder.
theological_decisions:
- issue: Art der Unreinheit
  choice: „unrein“ als kultisch-rechtliche Kategorie
  alternative: „befleckt“, „sündig“ oder moralisch schuldig
  rationale: Der Vers beschreibt durch Berührung übertragene kultische Unreinheit; eine moralische Schuld wird nicht ausgesagt.
- issue: Bedeutung von נֶפֶשׁ
  choice: als Bezeichnung der Person wiedergegeben
  alternative: „Seele“
  rationale: In diesem Rechtszusammenhang bezeichnet נֶפֶשׁ den Menschen als Person. „Seele“ könnte im Deutschen eine nicht ausdrücklich gemeinte Trennung von Körper und Seele nahelegen.
translation_notes:
  register: Moderne, würdige Rechtssprache mit verständlicher Satzstruktur. „Unrein“ wird konsequent für die kultische Kategorie verwendet; unnötig archaische Formulierungen werden vermieden.
