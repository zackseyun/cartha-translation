  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Elemente des Hebräischen zuverlässig wieder: die Versorgung des rituell Unreinen, die partitive Entnahme von Staub aus der Verbrennung, die kultische Bezeichnung חטאת sowie das Hinzufügen von מַיִם חַיִּים in ein Gefäß. „Etwas von dem Staub“ bewahrt die gegenüber „Asche“ lexikalisch weitere hebräische Wortwahl. Das unpersönliche „man“ ist im deutschen Rechtssatzregister eine angemessene Wiedergabe der im Hebräischen wechselnden unbestimmten Personalformen.'
