id: NUM.19.17
reference: Numbers 19:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: de
  text: Für den Unreinen soll man etwas von dem Staub nehmen, der von der Verbrennung des Reinigungsopfers[a] stammt, und lebendiges Wasser[b] darüber in ein Gefäß geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Sündopfer“. Das hebräische Wort kann in priesterlichen Zusammenhängen ein Opfer bezeichnen, das der Reinigung dient.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „lebendiges Wasser“; gemeint ist frisches Wasser aus einer Quelle oder einem fließenden Gewässer.
    reason: lexical_explanation
lexical_decisions:
- source_word: לַטָּמֵא
  choice: für den Unreinen
  rationale: Der substantivierte Adjektivausdruck bezeichnet hier einen Menschen im Zustand ritueller Unreinheit.
- source_word: מֵעֲפַר
  choice: etwas von dem Staub
  rationale: עָפָר bedeutet wörtlich „Staub“ beziehungsweise loses, pulverförmiges Material; „etwas von“ gibt den partitiven Gebrauch von מִן wieder.
- source_word: שְׂרֵפַת הַחַטָּאת
  choice: der von der Verbrennung des Reinigungsopfers stammt
  rationale: Die Formulierung bleibt nahe am hebräischen „Staub von der Verbrennung“, wird aber in natürlichem Deutsch syntaktisch entfaltet. חטאת bezeichnet im priesterlichen Kontext ein der Reinigung dienendes Opfer.
- source_word: וְנָתַן
  choice: und … geben
  rationale: Der Wechsel vom pluralischen לָקְחוּ zum Singular ist in Rechtstexten idiomatisch und kann einen unbestimmten Handelnden bezeichnen. Das deutsche unpersönliche „man“ bildet dies natürlich ab.
- source_word: מַיִם חַיִּים
  choice: lebendiges Wasser
  rationale: Die wörtliche Wiedergabe bewahrt die konkrete Bildsprache und die biblische Resonanz; gemeint ist Wasser aus einer frischen beziehungsweise fließenden Quelle.
- source_word: אֶל כֶּלִי
  choice: in ein Gefäß
  rationale: Die Präposition bezeichnet hier die Bewegung in das Gefäß hinein; „Gefäß“ passt zum kultischen Register.
theological_decisions:
- issue: Bedeutung von חטאת im Kontext ritueller Unreinheit
  choice: Reinigungsopfer
  alternative: Sündopfer
  rationale: Im Zusammenhang mit der roten Kuh steht die Beseitigung ritueller Unreinheit im Vordergrund. „Reinigungsopfer“ gibt diese Funktion wieder, ohne die traditionelle und lexikalisch mögliche Wiedergabe „Sündopfer“ auszuschließen.
- issue: Wiedergabe von מַיִם חַיִּים
  choice: lebendiges Wasser
  alternative: frisches Wasser / Quellwasser / fließendes Wasser
  rationale: Die formnahe Wendung wahrt die Mehrdeutigkeit und Bildkraft des Hebräischen. Eine Fußnote erläutert ihre konkrete Bedeutung, ohne sie im Haupttext einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischem Grundwortschatz. Das unpersönliche „man“ gibt den idiomatischen Numeruswechsel des hebräischen Rechtstextes wieder. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
