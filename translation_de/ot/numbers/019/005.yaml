review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Verbrennung, die Bestandteile des Tieres und die Einschließung des Mistes sachgerecht wieder. Der hebräische Text benennt jedoch einen maskulinen Handelnden („er“; im Kontext der in V. 3 genannte Beauftragte). Die unpersönliche Wiedergabe „man soll“ verwischt diese Referenz, während die Fußnote sie zugleich erläutert.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. Mit dem im Kontext eindeutig anschließbaren „Er“ bleibt er ebenso natürlich und wird präziser. „Vor seinen Augen“ ist idiomatisch.
  terminology: „Kuh“, „Haut“, „Fleisch“, „Blut“ und „Mist“ sind treffende, moderne Wiedergaben. „Samt ihrem Mist“ gibt die einschließende Funktion von עַל prägnant wieder.
  issues:
  - severity: medium
    issue: Unpersönliches „man“ statt des maskulinen Handlungsträgers
    rationale: Das Hebräische verwendet sowohl beim ersten Verb als auch beim abschließenden Imperfekt einen maskulinen Singular. Da der Kontext den Beauftragten bereits identifiziert, kann und sollte das Deutsche „Er“ verwenden. Die vorhandene Fußnote macht die Abweichung zudem unnötig auffällig.
  - severity: low
    issue: Fußnote erklärt eine durch die Übersetzung selbst erzeugte Abweichung
    rationale: Nach Wiederherstellung des personalen Bezugs ist die Anmerkung entbehrlich; der Bezug auf den Beauftragten ergibt sich aus dem unmittelbaren Kontext.
