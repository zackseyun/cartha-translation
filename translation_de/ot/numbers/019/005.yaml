  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: de
  text: Und er soll die Kuh vor seinen Augen verbrennen; ihre Haut, ihr Fleisch und ihr Blut samt ihrem Mist soll er verbrennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Und man soll … verbrennen
  rationale: Das Waw mit Qatal setzt die Verfahrensanweisung fort. Die unpersönliche Form mit „man soll“ gibt den Vorschriftscharakter natürlich wieder, ohne im Deutschen einen im Einzelvers isoliert unklaren männlichen Bezug einzuführen.
- source_word: הַפָּרָה
  choice: die Kuh
  rationale: פָּרָה bezeichnet ein weibliches Rind. „Kuh“ ist die klare moderne Entsprechung; das Alter des Tieres wird durch dieses Wort nicht eigens festgelegt.
- source_word: לְעֵינָיו
  choice: vor seinen Augen
  rationale: Die anschauliche hebräische Wendung wird wörtlich und zugleich idiomatisch wiedergegeben; sie bezeichnet das Verbrennen in seiner Gegenwart und unter seiner Aufsicht.
- source_word: עֹרָהּ
  choice: ihre Haut
  rationale: עוֹר bezeichnet hier die Haut des Tieres. „Haut“ ist im Deutschen natürlicher und ebenso präzise wie „Fell“ oder „Tierhaut“.
- source_word: בְּשָׂרָהּ
  choice: ihr Fleisch
  rationale: בָּשָׂר wird direkt mit „Fleisch“ wiedergegeben und passt zum kultischen Zusammenhang.
- source_word: דָּמָהּ
  choice: ihr Blut
  rationale: Direkte Wiedergabe von דָּם mit dem femininen Possessivbezug auf die Kuh.
- source_word: עַל פִּרְשָׁהּ
  choice: samt ihrem Mist
  rationale: פֶּרֶשׁ bezeichnet Kot beziehungsweise Mist; עַל hat in der Aufzählung einschließende beziehungsweise begleitende Funktion. „Samt“ gibt knapp wieder, dass auch der Mist mitverbrannt wird.
- source_word: יִשְׂרֹף
  choice: soll man verbrennen
  rationale: Der Imperfekt hat in der gesetzlichen Anweisung verpflichtenden Sinn. Die Wiederholung von „verbrennen“ bewahrt die nachdrückliche Struktur des Hebräischen.
