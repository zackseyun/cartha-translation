- from: Und man soll die Kuh vor seinen Augen verbrennen; ihre Haut, ihr Fleisch und ihr Blut samt ihrem Mist soll man verbrennen.[a]
  to: Und er soll die Kuh vor seinen Augen verbrennen; ihre Haut, ihr Fleisch und ihr Blut samt ihrem Mist soll er verbrennen.
  rationale: Die Revision stellt den im hebräischen Text ausgedrückten maskulinen Singular wieder her und bewahrt zugleich die gesetzliche Soll-Form sowie die emphatische Wiederholung von „verbrennen“. Die sonstigen lexikalischen Entscheidungen bleiben erhalten. Die Fußnote wird entfernt, weil sie nach dieser Korrektur nicht mehr benötigt wird.
