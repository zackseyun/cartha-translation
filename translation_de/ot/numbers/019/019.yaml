source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: de
  text: Der Reine soll den Unreinen am dritten und am siebten Tag besprengen und ihn am siebten Tag reinigen.[a] Dann soll er seine Kleider waschen und sich mit Wasser waschen;[b] am Abend wird er rein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „reinigen“ wiedergegebene hebräische Verb gehört zur Wortfamilie von „Sünde“. In diesem Zusammenhang bezeichnet es jedoch die Reinigung von ritueller Unreinheit, nicht die Vergebung moralischer Schuld.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen wird das Subjekt der Waschhandlungen nicht nochmals ausdrücklich genannt. Dem Zusammenhang nach ist wahrscheinlich der zuvor Unreine gemeint, der nun gereinigt wird.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהִזָּה
  choice: soll … besprengen
  rationale: Das Hifil von נזה bezeichnet hier das rituelle Besprengen mit dem Reinigungswasser. Im Deutschen kann „besprengen“ den Gegenstand direkt bei sich haben, sodass kein im Hebräischen unausgedrücktes „es“ ergänzt werden muss.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: der Reine / den Unreinen
  rationale: Die substantivierten Adjektive bezeichnen Personen in einem Zustand ritueller Reinheit beziehungsweise Unreinheit. Die knappe Form entspricht dem Rechtsstil und ist im Deutschen natürlich.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: am dritten und am siebten Tag
  rationale: Die Zeitpunkte des Rituals werden klar und in natürlichem Deutsch wiedergegeben.
- source_word: וְחִטְּאוֹ
  choice: und ihn … reinigen
  rationale: Das Piel von חטא bezeichnet in diesem Zusammenhang die Beseitigung ritueller Unreinheit, nicht ausdrücklich moralische Vergebung oder Sühne.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Dann soll er seine Kleider waschen
  rationale: „Kleider waschen“ ist eine direkte und gegenwärtige Wiedergabe der vorgeschriebenen Handlung.
- source_word: וְרָחַץ בַּמַּיִם
  choice: und sich mit Wasser waschen
  rationale: רחץ bezeichnet hier das Waschen des Körpers. Die reflexive Form macht den im Hebräischen aus dem Zusammenhang hervorgehenden Bezug idiomatisch deutlich.
- source_word: וְטָהֵר בָּעָרֶב
  choice: am Abend ist er rein
  rationale: Die Formulierung bezeichnet den erreichten Zustand ritueller Reinheit und den Zeitpunkt seines Eintritts.
theological_decisions:
- issue: Bedeutung von חטא im Reinigungsritual
  choice: Als rituelles Reinigen wiedergeben
  alternative: ihn entsündigen / für ihn Sühne schaffen
  rationale: Der Zusammenhang handelt von Verunreinigung durch einen Toten und vom Reinigungswasser. Eine ausdrücklich moralische oder sühnende Deutung würde mehr behaupten, als dieser Vers sagt.
- issue: Geschlecht der substantivierten Adjektive הַטָּהֹר und הַטָּמֵא
  choice: der Reine / der Unreine als rechtlich-repräsentative Personenbezeichnungen
  alternative: die reine Person / die unreine Person
  rationale: Die hebräischen Formen stehen im Maskulinum Singular und sind im Gesetzestext repräsentativ gebraucht. Die deutsche Form wahrt sowohl die grammatische Gestalt als auch den allgemeinen Geltungsbereich.
- issue: Subjekt der abschließenden Waschhandlungen
  choice: Das hebräische Pronomen im Haupttext nicht durch eine ausdrückliche Personenbezeichnung ersetzen; die wahrscheinliche Zuordnung in einer Fußnote erläutern
  alternative: Der Gereinigte soll dann seine Kleider waschen …
  rationale: Die Verbfolge nennt das Subjekt nicht erneut. Der Zusammenhang legt den zuvor Unreinen nahe, doch eine ausdrückliche Festlegung im Haupttext würde die syntaktische Offenheit beseitigen.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit kurzen, klaren Sätzen. „Besprengen“, „reinigen“ und „rein“ bewahren die rituelle Begrifflichkeit, ohne altertümliche oder konfessionell geprägte Formulierungen einzuführen.
