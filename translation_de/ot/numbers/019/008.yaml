revisions:
- from: Wer sie verbrennt, soll seine Kleider im Wasser waschen und seinen Körper im Wasser baden.[a] Er ist bis zum Abend unrein.[b]
  to: Wer sie verbrennt, soll seine Kleider im Wasser waschen und sich im Wasser waschen.[a] Er ist bis zum Abend unrein.[b]
  rationale: Die einzige Änderung ersetzt die im modernen Deutsch weniger idiomatische Formulierung „seinen Körper im Wasser baden“ durch „sich im Wasser waschen“. Der hebräische Bezug auf den eigenen Körper bleibt in der reflexiven Konstruktion erhalten; die Unterscheidung zwischen Kleiderwaschen und Körperwaschung wird weiterhin durch Objekt gegenüber Reflexivform deutlich. Fußnotenanker und Fußnotentexte bleiben korrekt zugeordnet.
