  terminology: „Unrein“ ist als knapper etablierter Ausdruck angemessen; die Fußnote erklärt zutreffend, dass rituelle und nicht zwingend moralische Unreinheit gemeint ist. „Kleider“, „Abend“ und „soll“ passen zum sachlich-vorschreibenden Register.
