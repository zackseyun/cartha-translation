  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/הּ יְכַבֵּ֤ס בְּגָדָי/ו֙ בַּ/מַּ֔יִם וְ/רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/טָמֵ֖א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: de
  text: Wer sie verbrennt, soll seine Kleider im Wasser waschen und sich im Wasser waschen.[a] Er ist bis zum Abend unrein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder bei beiden Vorkommen: „mit Wasser“. Wörtlich steht im Hebräischen „im Wasser“.'
    reason: lexical_alternative
  - marker: b
    text: „Unrein“ bezeichnet hier rituelle Unreinheit, nicht notwendigerweise moralische Schuld.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף
  choice: wer … verbrennt
  rationale: Das substantivierte Partizip bezeichnet die Person, die das Verbrennen ausführt. Die deutsche Relativkonstruktion ist natürlich und gibt die Rollenbezeichnung präzise wieder.
- source_word: אֹתָהּ
  choice: sie
  rationale: Das feminine Objektsuffix bezieht sich auf die zuvor genannte Kuh; im Deutschen ist daher das feminine Pronomen sachgerecht.
- source_word: יְכַבֵּס
  choice: soll … waschen
  rationale: Das Imperfekt hat in dieser Ritualvorschrift anweisenden Charakter. „Soll“ vermittelt diesen rechtlich-vorschreibenden Sinn in modernem Deutsch.
- source_word: בְּגָדָיו
  choice: seine Kleider
  rationale: „Kleider“ ist eine geläufige und würdige Wiedergabe für die persönliche Kleidung.
- source_word: בַּמַּיִם
  choice: im Wasser
  rationale: Die Präposition ב mit Artikel bedeutet wörtlich „in dem Wasser“. „Im Wasser“ bewahrt diese Formulierung und die Wiederholung des Hebräischen; idiomatisch wäre auch „mit Wasser“ möglich.
- source_word: וְרָחַץ
  choice: und … baden
  rationale: „Baden“ unterscheidet das Waschen des Körpers vom Waschen der Kleider und erhält so den hebräischen Wortwechsel zwischen רחץ und כבס.
- source_word: בְּשָׂרוֹ
  choice: seinen Körper
  rationale: בשר bedeutet wörtlich „Fleisch“, bezeichnet hier beim Baden aber idiomatisch den Körper der Person.
- source_word: וְטָמֵא
  choice: er ist … unrein
  rationale: Die Formulierung beschreibt den daraus folgenden Status. „Unrein“ ist der etablierte knappe Ausdruck; der Zusammenhang zeigt, dass rituelle Unreinheit gemeint ist.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Wendung bezeichnet die Dauer der Unreinheit. „Bis zum Abend“ ist eng am Hebräischen und vermeidet die interpretierende Präzisierung „bis Sonnenuntergang“.
theological_decisions:
- issue: Wiedergabe der kultischen Unreinheit
  choice: unrein
  alternative: kultisch unrein; rituell unrein
  rationale: טמא bezeichnet im priesterlichen Gesetz einen rituellen Status und nicht notwendig moralische Schuld. Der Haupttext bleibt mit „unrein“ knapp; eine Fußnote erklärt den kultischen Sinn.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Vorschrift wird mit „soll“ ausgedrückt; die zwei unterschiedlichen Verben für das Reinigen von Kleidung und Körper bleiben erhalten.
