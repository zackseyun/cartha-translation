  verdict: revise
  source_fidelity: 'Die zentralen hebräischen Elemente sind zutreffend wiedergegeben: חֻקַּת הַתּוֹרָה als „Satzung des Gesetzes“, פָרָה אֲדֻמָּה als „rote Kuh“, תְּמִימָה und אֵין בָּהּ מוּם als zwei getrennte Beschreibungen sowie das Joch-Kriterium. Allerdings fügt „und sage ihnen“ dem Text eine zusätzliche Aufforderung hinzu. לֵאמֹר leitet hier die anschließende Rede ein und wird im Deutschen angemessen durch einen Doppelpunkt wiedergegeben.'
