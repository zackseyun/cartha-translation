source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: de
  text: 'Dies ist die Satzung des Gesetzes, die der HERR[a] geboten hat: »Rede zu den Israeliten: Sie sollen dir eine rote Kuh bringen, die unversehrt ist, keinen Makel hat und auf die noch nie ein Joch gekommen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier der Gottesname JHWH.
    reason: Macht die traditionelle Wiedergabe „HERR“ transparent.
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: Satzung des Gesetzes
  rationale: Gibt die formale, verbindliche Einzelbestimmung (חֻקָּה) innerhalb der Weisung bzw. des Gesetzes (תּוֹרָה) wieder, ohne die beiden Begriffe miteinander zu verschmelzen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Natürliches modernes Deutsch für die kollektive Bezeichnung „Söhne/Kinder Israels“.
- source_word: פָרָה אֲדֻמָּה
  choice: rote Kuh
  rationale: פָרָה bezeichnet ein weibliches Rind; „Kuh“ ist sachlich und allgemeinverständlich. אֲדֻמָּה wird direkt mit „rot“ wiedergegeben.
- source_word: תְּמִימָה
  choice: unversehrt
  rationale: Bewahrt den Gedanken der Ganzheit und Untadeligkeit und vermeidet, den Ausdruck vollständig mit dem unmittelbar folgenden „kein Makel“ gleichzusetzen.
- source_word: מוּם
  choice: Makel
  rationale: Bezeichnet hier einen körperlichen Fehler, der die kultische Eignung beeinträchtigt; „Makel“ entspricht dem sakralrechtlichen Zusammenhang.
- source_word: לֹא עָלָה עָלֶיהָ עֹל
  choice: noch nie ein Joch getragen hat
  rationale: Idiomatiches Deutsch für die Aussage, dass dieses Tier niemals unter ein Joch genommen wurde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR mit Fußnote
  alternative: JHWH oder Jahwe
  rationale: Folgt der etablierten deutschen Bibeltradition, macht aber durch die Fußnote transparent, dass im Hebräischen der Eigenname Gottes steht.
- issue: Verhältnis von תְּמִימָה und אֵין בָּהּ מוּם
  choice: 'Beide Beschreibungen bleiben ausdrücklich erhalten: „unversehrt“ und „keinen Makel“'
  alternative: Zusammenziehung zu „fehlerlos“ oder „makellos“
  rationale: Der hebräische Text enthält zwei sich überschneidende, aber nicht völlig identische Anforderungen; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede gliedert den langen hebräischen Satz verständlich; „und sage ihnen“ nimmt לֵאמֹר idiomatisch auf. Kultische Schlüsselbegriffe werden nicht unnötig vereinfacht.
