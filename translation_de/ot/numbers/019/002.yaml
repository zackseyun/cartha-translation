  terminology: „HERR“ mit transparenter Fußnote für JHWH ist konsistent. „Satzung des Gesetzes“, „Israeliten“, „rote Kuh“, „unversehrt“ und „Makel“ passen zum kultisch-rechtlichen Register. Die doppelte Charakterisierung des Tieres bleibt erhalten.
