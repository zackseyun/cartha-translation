  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: de
  text: Ihr sollt sie[a] dem Priester Eleasar übergeben. Er soll sie aus dem Lager hinausführen, und sie soll vor ihm geschlachtet werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das feminine Pronomen „sie“ bezieht sich auf die rote Kuh.
    reason: lexical_clarification
  - marker: b
    text: 'Wörtlich ist auch möglich: „und er soll sie vor ihm schlachten“. Das hebräische Verb hat ein nicht näher bezeichnetes implizites Subjekt in der 3. Person maskulin Singular. „Vor ihm“ bezieht sich naheliegend auf Eleasar; daher kann die Schlachtung als in seiner Gegenwart vollzogen verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: Ihr sollt … übergeben
  rationale: Die zweite Person Plural bezeichnet die angesprochenen Israeliten. Das mit וְ verbundene Perfekt hat im gesetzlichen Zusammenhang anweisende Bedeutung; „sollt“ gibt diesen verpflichtenden Charakter in natürlichem Deutsch wieder.
- source_word: אֹתָהּ
  choice: sie
  rationale: Das feminine Singularpronomen bezieht sich auf die rote Kuh. Anders als im Englischen entspricht das grammatische Geschlecht im Deutschen dem Bezugswort „Kuh“, daher ist „sie“ sowohl idiomatisch als auch quellennah.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: dem Priester Eleasar
  rationale: Die deutsche Dativkonstruktion nach „übergeben“ gibt die Zielangabe natürlich wieder. Name und Amtstitel bleiben klar erkennbar.
- source_word: וְהוֹצִיא אֹתָהּ
  choice: Er soll sie … hinausführen
  rationale: Der Hifil von יצא bedeutet, etwas oder jemanden hinauszubringen. Bei einem lebenden Tier ist „hinausführen“ im Deutschen besonders natürlich und bewahrt den kausativen Sinn.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die Wendung bezeichnet die Bewegung an einen Ort außerhalb des Lagers. „Aus dem Lager hinaus“ bildet Richtung und Überschreitung der Lagergrenze idiomatisch ab.
- source_word: וְשָׁחַט אֹתָהּ
  choice: und sie soll … geschlachtet werden
  rationale: Das hebräische Verb steht zwar in der dritten Person Maskulinum Singular, doch sein unausgesprochenes Subjekt ist angesichts von „vor ihm“ nicht eindeutig. Das deutsche Passiv lässt den Ausführenden offen, ohne einen unbestimmten Handelnden ausdrücklich einzuführen.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Die knappe Wendung kann räumlich „vor ihm“ und sinngemäß „in seiner Gegenwart“ bedeuten. „Vor ihm“ erhält diese Bedeutungsbreite.
theological_decisions:
- issue: Wer die Kuh schlachtet
  choice: Der Haupttext lässt durch das Passiv offen, wer die Schlachtung ausführt, und hält fest, dass sie vor Eleasar geschieht.
  alternative: „Und er soll sie vor ihm schlachten“, wobei Eleasar als fortgesetztes Subjekt von „hinausführen“ und ein anderer männlicher Bezugspunkt für „ihm“ verstanden werden müsste; oder Eleasar bleibt als handelnde Person gedacht, während „vor ihm“ seine beaufsichtigende Gegenwart hervorhebt.
  rationale: Die aufeinanderfolgenden Verben haben formal jeweils ein unausgesprochenes Subjekt in der dritten Person Maskulinum Singular. Zugleich legt לְפָנָיו („vor ihm“) nahe, Eleasar als anwesenden Priester von demjenigen zu unterscheiden, der schlachtet. Das Passiv bewahrt die Spannung, statt die Identität des Schlachters festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer gesetzlicher Anweisungsform. „Ihr sollt“ wahrt die Anrede im Plural; das Passiv im letzten Satzteil bewahrt die im Hebräischen bestehende Unbestimmtheit des Handelnden.
