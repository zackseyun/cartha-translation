  source_fidelity: Die Aussage über die sieben Tage Unreinheit ist zutreffend wiedergegeben. „Einen toten Menschen“ ist verständlich, gibt jedoch die konkrete Bedeutung von מֵת im Kontext des Berührens weniger präzise wieder als „Leichnam“. Die universale Spezifizierung לְכָל נֶפֶשׁ אָדָם sollte zudem im Deutschen erkennbar bleiben.
  naturalness: „Wer den Leichnam irgendeines Menschen berührt, ist sieben Tage lang unrein“ ist modernes, klares Standarddeutsch und wahrt den knappen Rechtsstil.
  terminology: „Unrein“ ist als zentraler kultischer Terminus angemessen und sollte ohne erläuternden Zusatz im Haupttext stehen. „Leichnam“ trifft den rituellen Kontext und vermeidet die mögliche, wenn auch geringe, Unschärfe von „toter Mensch“.
