  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: de
  text: Wer den Leichnam irgendeines Menschen berührt, ist sieben Tage lang unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Wer … berührt
  rationale: Das substantivierte Partizip mit Artikel bezeichnet in dieser Rechtsbestimmung allgemein jeden, auf den der genannte Fall zutrifft. Die deutsche Wer-Konstruktion gibt diesen generischen Sinn natürlich wieder.
- source_word: בְּמֵת
  choice: einen toten Menschen
  rationale: מֵת bezeichnet hier einen Verstorbenen beziehungsweise dessen Leichnam. „Einen toten Menschen“ ist klar, würdig und allgemein verständlich; die wörtlichere Alternative „einen Toten“ wird in der Fußnote berücksichtigt.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: Menschen
  rationale: Die Wendung bestimmt den Toten als menschliche Person und schließt jeden Menschen ein. Im Deutschen vermittelt „einen toten Menschen“ diesen Sinn idiomatisch, ohne אָדָם fälschlich auf Männer zu beschränken.
- source_word: וְטָמֵא
  choice: ist … unrein
  rationale: Das Verb beschreibt die als Folge der Berührung eintretende kultische Unreinheit. Das Präsens entspricht dem allgemeinen Geltungscharakter der Rechtsbestimmung im modernen Deutschen.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die Dauerangabe wird direkt und idiomatisch wiedergegeben; „lang“ verdeutlicht, dass es sich um einen Zeitraum handelt.
theological_decisions:
- issue: Bedeutung von אָדָם in einer allgemeinen Rechtsbestimmung
  choice: Mensch
  alternative: Mann
  rationale: אָדָם meint hier einen Menschen ohne Beschränkung auf das männliche Geschlecht. „Mensch“ gibt den sachlichen Umfang der Vorschrift genau wieder.
- issue: Art der Unreinheit
  choice: unrein
  alternative: kultisch unrein
  rationale: Der Text sagt lediglich „unrein“. Eine ausdrückliche Ergänzung wie „kultisch“ wäre zwar kontextuell zutreffend, würde aber eine im Vers nicht ausgesprochene Erläuterung in den Haupttext eintragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die knappe Form wahrt den Charakter einer allgemeinen Rechtsbestimmung; „unrein“ bleibt als zentraler kultischer Begriff ohne erklärenden Zusatz stehen.
