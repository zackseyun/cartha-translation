  text: וְ/לָקַ֞ח אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן מִ/דָּמָ֖/הּ בְּ/אֶצְבָּע֑/וֹ וְ/הִזָּ֞ה אֶל נֹ֨כַח פְּנֵ֧י אֹֽהֶל מוֹעֵ֛ד מִ/דָּמָ֖/הּ שֶׁ֥בַע פְּעָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: de
  text: Dann soll der Priester Eleasar mit seinem Finger etwas von ihrem Blut nehmen und siebenmal etwas von ihrem Blut zur Vorderseite des Zeltes der Begegnung hin sprengen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor das Zelt der Begegnung«. Die hebräische Wendung bezeichnet die Ausrichtung auf die Vorderseite des Zeltes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll ... nehmen
  rationale: Das Waw mit Qatal führt in der kultischen Verfahrensanweisung den nächsten Schritt ein; die deutsche Soll-Form gibt den verpflichtenden Charakter natürlich wieder.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: der Priester Eleasar
  rationale: Der Personenname wird nach üblicher deutscher Form als »Eleasar« wiedergegeben; der Titel bezeichnet sein Amt.
- source_word: מִדָּמָהּ
  choice: etwas von ihrem Blut
  rationale: 'Die Präposition מִן ist hier partitiv: Eleasar nimmt einen Teil des Blutes der zuvor genannten Kuh. Die Wiederholung im zweiten Satzteil bleibt erhalten.'
- source_word: בְּאֶצְבָּעוֹ
  choice: mit seinem Finger
  rationale: Die Präposition בְּ bezeichnet hier das Mittel der rituellen Handlung; die instrumentale Wiedergabe ist im Deutschen klar und natürlich.
- source_word: וְהִזָּה
  choice: und ... sprengen
  rationale: נזה bezeichnet im priesterlichen Ritual das gezielte Sprengen beziehungsweise Versprengen von Blut oder Wasser. »Sprengen« ist dafür die traditionelle, weiterhin verständliche kultische Bezeichnung.
- source_word: אֶל נֹכַח פְּנֵי
  choice: zur Vorderseite ... hin
  rationale: Die Wendung bezeichnet eine Ausrichtung auf die Vorder- oder Frontseite und nicht notwendigerweise einen Ort im Inneren.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Bezeichnung gibt beide Bestandteile des hebräischen Heiligtumsnamens transparent wieder, ohne den interpretativeren Ausdruck »Stiftshütte« zu verwenden.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Direkte und idiomatische Wiedergabe der bestimmten Anzahl ritueller Wiederholungen.
theological_decisions: []
