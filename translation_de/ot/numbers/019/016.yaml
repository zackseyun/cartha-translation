id: NUM.19.16
reference: Numbers 19:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: de
  text: Und jeder, der draußen auf dem Feld einen vom Schwert Erschlagenen, einen Toten, einen menschlichen Knochen oder ein Grab berührt, ist sieben Tage unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist kultische Unreinheit.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: Und jeder, der … berührt
  rationale: Die Verbindung aus כֹל und Relativsatz bezeichnet hier allgemein jede Person, auf die der Rechtsfall zutrifft.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: draußen auf dem Feld
  rationale: Die wörtliche Wendung »auf der Oberfläche des Feldes« ist idiomatisch zu verstehen und meint den offenen Bereich außerhalb eines Gebäudes.
- source_word: בַּחֲלַל חֶרֶב
  choice: einen vom Schwert Erschlagenen
  rationale: חָלָל bezeichnet einen Erschlagenen beziehungsweise Getöteten; חֶרֶב nennt das Tötungswerkzeug.
- source_word: אוֹ בְמֵת
  choice: einen Toten
  rationale: מֵת kann einen Verstorbenen oder Leichnam bezeichnen. »einen Toten« ist knapp, natürlich und wahrt die Breite des Ausdrucks.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: einen menschlichen Knochen
  rationale: אָדָם ist hier generisch auf menschliche Überreste bezogen und nicht speziell auf einen Mann.
- source_word: אוֹ בְקָבֶר
  choice: oder ein Grab
  rationale: קֶבֶר bezeichnet gewöhnlich ein Grab oder eine Grabstätte; »Grab« ist im rechtlichen Zusammenhang die direkte Entsprechung.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: ist sieben Tage unrein
  rationale: Das Verb bezeichnet kultische Unreinheit. Das deutsche Präsens gibt die allgemeine Rechtsfolge natürlich wieder.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: menschlich
  alternative: eines Mannes
  rationale: Im Zusammenhang der Reinheitsbestimmungen geht es allgemein um menschliche Gebeine, nicht ausdrücklich um die Gebeine einer männlichen Person.
- issue: Art der Unreinheit
  choice: unrein
  alternative: kultisch unrein
  rationale: Der unmittelbare priesterliche Kontext macht die kultische Bedeutung deutlich; eine erläuternde Ergänzung im Haupttext wäre nicht ausdrücklich im Hebräischen enthalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssatzstruktur. Das idiomatische עַל פְּנֵי הַשָּׂדֶה wird natürlich als »draußen auf dem Feld« wiedergegeben; die Aufzählung des Hebräischen bleibt erhalten.
