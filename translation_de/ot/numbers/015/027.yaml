source:
  edition: WLC
  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: de
  text: Wenn aber eine einzelne Person aus Versehen sündigt, soll sie eine einjährige weibliche Ziege als Sündopfer[a] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann das Opfer bezeichnen, das Sünde oder Unreinheit beseitigt, nicht nur die Sünde selbst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Die Verbindung leitet gegenüber der vorherigen Regelung einen kontrastierenden Einzelfall ein; „Wenn aber“ gibt diese mild adversative Fortführung natürlich wieder.
- source_word: נֶפֶשׁ אַחַת
  choice: eine einzelne Person
  rationale: נֶפֶשׁ bezeichnet im Rechtskontext eine Person; אַחַת hebt hervor, dass es um einen einzelnen Menschen geht.
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: aus Versehen sündigt
  rationale: בִשְׁגָגָה bezeichnet unbeabsichtigtes beziehungsweise irrtümliches Handeln und grenzt es von vorsätzlicher Auflehnung ab. „Aus Versehen“ ist verständliches modernes Deutsch.
- source_word: וְהִקְרִיבָה
  choice: soll sie ... darbringen
  rationale: Im Opferkontext bezeichnet das Hifil von קרב das Heranbringen beziehungsweise Darbringen einer Opfergabe. Die deutsche Soll-Form entspricht dem Rechtsstil.
- source_word: עֵז
  choice: weibliche Ziege
  rationale: Das hebräische Substantiv bezeichnet hier ausdrücklich ein weibliches Tier; diese Angabe wird bewahrt.
- source_word: בַּת שְׁנָתָהּ
  choice: einjährige
  rationale: Die Wendung bezeichnet ein Tier in seinem ersten Lebensjahr beziehungsweise von etwa einem Jahr; „einjährig“ ist die natürliche knappe Wiedergabe.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Im priesterlichen Opferrecht bezeichnet חַטָּאת regelmäßig die Opferart, die Sünde beziehungsweise Unreinheit behandelt. „Sündopfer“ ist die geläufige deutsche Bezeichnung; die funktionale Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Geschlecht der einzelnen schuldigen Person
  choice: Das grammatische Femininum wird mit „sie“ wiedergegeben.
  alternative: Geschlechtsneutral formulieren oder generisches Maskulinum verwenden.
  rationale: Die femininen Verbformen stimmen grammatisch mit dem femininen Substantiv נֶפֶשׁ überein. „Sie“ bewahrt die Form des Hebräischen, ohne zu behaupten, die Vorschrift gelte ausschließlich für Frauen.
- issue: Bedeutung von חַטָּאת im Opferrecht
  choice: Im Haupttext steht „Sündopfer“.
  alternative: „Reinigungsopfer“
  rationale: „Sündopfer“ ist die bekannte und kontextuell tragfähige Bezeichnung. Da חַטָּאת zugleich die reinigende Funktion des Opfers hervorheben kann, bleibt „Reinigungsopfer“ als echte lexikalische Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem Rechts- und Opferwortschatz. Die Satzstellung ist natürlich, bewahrt aber Bedingung, Einzelfall, unbeabsichtigtes Handeln sowie Tierart, Geschlecht und Alter.
