  terminology: „Sündopfer“ ist die etablierte deutsche Wiedergabe von חַטָּאת im Opferkontext. Die Fußnote bewahrt mit „Reinigungsopfer“ zutreffend die funktionale lexikalische Alternative. „Aus Versehen“ ist hier eine idiomatische Wiedergabe von בִּשְׁגָגָה.
