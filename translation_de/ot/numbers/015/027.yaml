  source_fidelity: Der Entwurf gibt die Bedingung, den einzelnen Fall, das unbeabsichtigte Sündigen, die Darbringungspflicht sowie Tierart, Geschlecht, Alter und Opferzweck zuverlässig wieder. „Wenn aber“ ist im Kontext angemessen. Das Femininum bei „sie“ kann im Deutschen wie im Hebräischen mit dem femininen Wort „Person“ übereinstimmen und legt den Anwendungsbereich nicht auf Frauen fest.
