source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: de
  text: Denn er hat das Wort Jahwes verachtet und sein Gebot gebrochen. Diese Person wird ganz gewiss ausgerottet werden.[a] Ihre Schuld liegt auf ihr.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „ausgerottet werden“ gibt eine hebräische Gerichtsformel wieder; die genaue Form des Gerichts wird hier nicht näher bestimmt.
    reason: Die hebräische Formel הִכָּרֵת תִּכָּרֵת bezeichnet ein ernstes Gericht, legt dessen konkrete Vollzugsform im Vers jedoch nicht fest.
  - marker: b
    text: 'Wörtlich: „Ihre Schuld ist auf ihr.“'
    reason: Die knappe hebräische Nominalwendung bezeichnet die bei der betreffenden Person verbleibende Schuldhaftung.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das zuvor genannte Gericht ein und klingt im Deutschen in diesem Zusammenhang natürlicher als ein vorangestelltes „Weil“.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דָּבָר bezeichnet hier im bundesrechtlichen Zusammenhang Jahwes ausgesprochenes Wort beziehungsweise seine Weisung; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בָּזָה
  choice: hat … verachtet
  rationale: Drückt bewusste Missachtung und Geringschätzung aus, nicht bloß Nachlässigkeit.
- source_word: מִצְוָתוֹ
  choice: sein Gebot
  rationale: Bewahrt den Singular und den rechtlich-bundestheologischen Gehalt, ohne altertümlich zu wirken.
- source_word: הֵפַר
  choice: gebrochen
  rationale: Gibt die Verletzung beziehungsweise Außerkraftsetzung des göttlichen Gebots idiomatisch wieder.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: soll ganz gewiss ausgerottet werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Ganz gewiss“ bildet diese Intensivierung ab; „ausgerottet werden“ erhält die unbestimmte gerichtliche Formel.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: diese Person
  rationale: נֶפֶשׁ bezeichnet im Rechtstext die betreffende Einzelperson; „Seele“ würde im modernen Deutschen irreführende anthropologische Vorstellungen nahelegen.
- source_word: עֲוֺנָהּ בָּהּ
  choice: ihre Schuld liegt auf ihr
  rationale: Die knappe nominale Wendung bezeichnet die fortbestehende Schuldhaftung der Person. Die feminine Form folgt grammatisch dem femininen נֶפֶשׁ und wird durch „Person“ im Deutschen natürlich aufgenommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Bundesnamen; die Transliteration bewahrt diesen Eigennamen.
- issue: Bedeutung der Formel הִכָּרֵת תִּכָּרֵת
  choice: Die gerichtliche Formel „ganz gewiss ausgerottet werden“ ohne nähere Bestimmung beibehalten
  alternative: hingerichtet oder aus der Gemeinschaft ausgeschlossen werden
  rationale: Der Vers legt nicht fest, ob Tod, Ausschluss oder eine andere Form göttlichen Gerichts gemeint ist. Die Übersetzung wahrt diese echte Unbestimmtheit.
- issue: Deutung von עֲוֺנָהּ בָּהּ
  choice: ihre Schuld liegt auf ihr
  alternative: ihre Missetat ist an ihr
  rationale: „Schuld“ bewahrt den forensischen Sinn und die persönliche Haftung, ohne die Wendung durch eine zeitliche oder dogmatische Ergänzung zu präzisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, rechtlich-feierliche Sätze entsprechen dem Charakter des Gesetzestextes. Das Pronomen „ihre“ bezieht sich grammatisch auf „Person“ und trifft keine Aussage über das Geschlecht.
