  variant: modern standard German
source:
  edition: WLC
  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: de
  text: Vom ersten Teil eures Teiges[a] sollt ihr einen Brotfladen als Abgabe[b] darbringen. Ebenso wie die Abgabe von der Tenne sollt ihr ihn darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann den gekneteten Teig oder, metonymisch, die Knetschüssel beziehungsweise den Knettrog bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Traditionell „Hebopfer“. Das hebräische Substantiv bezeichnet eine ausgesonderte und dargebrachte Abgabe; das zugehörige Verb bedeutet wörtlich „emporheben“.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: vom ersten Teil
  rationale: Das Wort bezeichnet den Anfang beziehungsweise den ersten Anteil. „Vom ersten Teil“ gibt hier den partitiven Sinn wieder, ohne speziell an Ernteerstlinge denken zu lassen.
- source_word: עֲרִסֹתֵיכֶם
  choice: eures Teiges
  rationale: Das Substantiv kann den gekneteten Teig oder metonymisch das Knetgefäß bezeichnen. Da daraus ein Brotfladen genommen wird, ist „Teig“ im Zusammenhang am wahrscheinlichsten; die echte lexikalische Mehrdeutigkeit wird in Fußnote [a] genannt.
- source_word: חַלָּה
  choice: einen Brotfladen
  rationale: חַלָּה bezeichnet hier ein geformtes Brot beziehungsweise einen Brotkuchen. „Brotfladen“ ist in modernem Deutsch verständlich und vermeidet bei „Kuchen“ die Vorstellung einer Süßspeise.
- source_word: תָּרִימוּ
  choice: sollt ihr … darbringen
  rationale: Der Hifil von רום bedeutet wörtlich „emporheben“ und bezeichnet im kultischen Zusammenhang das Absondern und Präsentieren einer Gabe. „Darbringen“ gibt die Funktion natürlich und würdig wieder; die wörtliche Bildsprache wird in Fußnote [b] erläutert.
- source_word: תְרוּמָה
  choice: Abgabe
  rationale: תְּרוּמָה ist ein ausgesonderter und Gott beziehungsweise dem priesterlichen Dienst übergebener Anteil. „Abgabe“ ist transparent und weniger altertümlich als „Hebopfer“.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: wie die Abgabe von der Tenne
  rationale: Die Wendung vergleicht den Teiganteil mit der Abgabe, die vom Ertrag auf der Tenne genommen wird. „Von der Tenne“ macht diese Herkunftsbeziehung im Deutschen deutlich.
- source_word: גֹּרֶן
  choice: Tenne
  rationale: „Tenne“ ist die übliche knappe deutsche Bezeichnung für den Ort, an dem Getreide gedroschen und bearbeitet wird.
- source_word: כֵּן
  choice: ebenso
  rationale: כֵּן führt die Folgerung aus dem Vergleich ein; „ebenso“ ist im modernen Deutschen klar und natürlich.
- source_word: אֹתָהּ
  choice: ihn
  rationale: Das Pronomen verweist auf den zuvor genannten Brotfladen beziehungsweise die Abgabe. Im Deutschen richtet sich das Genus bei der ausdrücklichen Rückverweisung auf „Brotfladen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Brotfladen“ und „Abgabe“ vermeiden missverständliche oder altertümliche Fachsprache; die kultische Bildsprache und die lexikalische Mehrdeutigkeit bleiben durch die Fußnoten zugänglich.
