base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: de
  text: Wenn ihr aber unbeabsichtigt irregeht und nicht alle diese Gebote befolgt, die Jahwe zu Mose gesprochen hat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr irrt“ oder „unbeabsichtigt sündigt“. Das hebräische Verb bezeichnet ein Irren oder Abirren und meint hier das unbeabsichtigte Verfehlen der Gebote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn ... aber
  rationale: Leitet den folgenden Rechtsfall konditional ein und gibt zugleich den leichten Kontrast zum vorausgehenden Abschnitt in natürlichem Deutsch wieder.
- source_word: תִשְׁגּוּ
  choice: ihr unbeabsichtigt irregeht
  rationale: שׁגה bezeichnet ein Irren oder Abirren. Der rechtliche Zusammenhang zeigt, dass hier ein unbeabsichtigtes Verfehlen gemeint ist, ohne das Verb vorschnell ausdrücklich mit „sündigen“ gleichzusetzen.
- source_word: וְלֹא תַעֲשׂוּ
  choice: und ... nicht ... befolgt
  rationale: עשה bedeutet grundsätzlich „tun“. In Verbindung mit Geboten gibt „befolgen“ den gemeinten Vollzug idiomatisch und präzise wieder.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: alle diese Gebote
  rationale: Bewahrt sowohl die umfassende Aussage von כָּל als auch die deiktische Bestimmung הָאֵלֶּה.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: die Jahwe Mose gegeben hat
  rationale: Wörtlich steht „die Jahwe zu Mose geredet hat“. Im Deutschen bezeichnet „Gebote geben“ natürlich ihre mündliche Mitteilung, während die Fußnote die formale Alternative nicht eigens benötigt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Eingebürgerte deutsche Form des hebräischen Personennamens.
theological_decisions:
- issue: Bedeutungsumfang von שׁגה im kultisch-rechtlichen Zusammenhang
  choice: unbeabsichtigt irregehen
  alternative: unbeabsichtigt sündigen
  rationale: Der unmittelbare Zusammenhang handelt von unbeabsichtigten Verfehlungen und stellt sie später vorsätzlichem Handeln gegenüber. „Irregehen“ bewahrt jedoch das Bild und die lexikalische Offenheit des hebräischen Verbs.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; die Transliteration bewahrt diese sprachliche Form, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural und die konditionale Rechtsform bleiben erhalten; das Satzende mit Komma zeigt, dass der Gedanke im folgenden Vers weitergeführt wird.
