  text: הָֽ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם תּוֹרָ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם לָ/עֹשֶׂ֖ה בִּ/שְׁגָגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: de
  text: Für den Einheimischen unter den Israeliten und für den ansässigen Fremden[a], der unter ihnen lebt, gilt ein und dasselbe Gesetz, wenn jemand unabsichtlich handelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „ansässiger Fremder“ ist ein nicht einheimischer Mensch gemeint, der dauerhaft innerhalb der israelitischen Gemeinschaft lebt.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: der Einheimische unter den Israeliten
  rationale: Die Formulierung bezeichnet ein einheimisches Mitglied der israelitischen Gemeinschaft und bewahrt zugleich die ausdrückliche Zuordnung zu den Israeliten.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: und der ansässige Fremde, der unter ihnen lebt
  rationale: גֵּר bezeichnet hier keinen bloßen Durchreisenden, sondern einen nicht einheimischen Menschen mit dauerhaftem Aufenthalt in der Gemeinschaft. Das Pronomen bleibt entsprechend dem masoretischen Text in der dritten Person Plural.
- source_word: תּוֹרָה אַחַת יִהְיֶה לָכֶם
  choice: gilt ein und dasselbe Gesetz
  rationale: Die idiomatische deutsche Rechtsformulierung bringt die identische Geltung der Weisung für beide genannten Gruppen zum Ausdruck; לָכֶם bleibt in der Aussage über die Geltung für die angeredete Gemeinschaft enthalten.
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: wenn jemand unabsichtlich handelt
  rationale: Das substantivierte Partizip ist generisch; „jemand“ wahrt diesen offenen Bezug. בִּשְׁגָגָה bezeichnet im gesetzlichen Zusammenhang ein Handeln aus Versehen beziehungsweise ohne Absicht.
theological_decisions:
- issue: Reichweite der rechtlichen Gleichbehandlung von Einheimischen und ansässigen Fremden
  choice: Der Vers erklärt, dass bei unabsichtlichem Handeln für beide Gruppen dasselbe Gesetz gilt.
  alternative: „Eine Weisung“ statt „ein und dasselbe Gesetz“; dies könnte den weiteren Bedeutungsumfang von תּוֹרָה stärker abbilden.
  rationale: Der unmittelbare Zusammenhang ist gesetzlich und opferrechtlich. Die Übersetzung gibt die gleiche Anwendung der betreffenden Regel wieder, ohne daraus eine uneingeschränkte Aussage über sämtliche Rechtsbereiche abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge ist für natürliches Deutsch geordnet, ohne die im Hebräischen genannten Gruppen oder die gleiche rechtliche Geltung zu verwischen. Die dritte Person „unter ihnen“ folgt bewusst dem WLC und wird nicht nach der englischen Konsultationsfassung zu „unter euch“ angeglichen.
