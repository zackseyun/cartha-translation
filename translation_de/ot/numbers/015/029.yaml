review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die beiden Personengruppen (הָאֶזְרָח und גֵּר), dessen Aufenthalt „unter ihnen“ sowie die gleiche Geltung einer Weisung bzw. eines Gesetzes bei unbeabsichtigtem Handeln zuverlässig wieder. „Wenn jemand unabsichtlich handelt“ bildet das generische Singularpartizip לָעֹשֶׂה angemessen ab. Die rechtliche Umformung von „eine Weisung soll für euch sein“ zu „gilt ein und dasselbe Gesetz“ ist im Deutschen vertretbar und bewahrt die Gleichbehandlung im vorliegenden Fall.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. „Einheimischer unter den Israeliten“ ist leicht formell, aber für den rechtlichen und antiken Registerton passend. „Ansässiger Fremder“ wird durch die Fußnote ausreichend präzisiert.
  terminology: „Gesetz“ ist im unmittelbaren gesetzlichen Kontext eine tragfähige Wiedergabe von תּוֹרָה, ohne den Vers über seinen Kontext hinaus auszudehnen. „Ansässiger Fremder“ trifft גֵּר hier besser als eine Bezeichnung für einen bloßen Reisenden. Die Fußnote erklärt den sozialen Status sachlich und ohne anachronistische oder konfessionelle Zusätze.
