source:
  edition: WLC
  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: de
  text: 'Und als Trankopfer sollst du einen halben Hin Wein darbringen: ein Feueropfer[a] von angenehmem Duft für Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Speisegabe“; auch möglich: „eine im Feuer dargebrachte Gabe“.'
    reason: Das kultische Wort אִשֵּׁה kann traditionell auf die Darbringung im Feuer bezogen, aber auch funktional als Speisegabe verstanden werden.
lexical_decisions:
- source_word: וְיַיִן
  choice: Und … Wein
  rationale: יַיִן bezeichnet eindeutig Wein; die Konjunktion וְ wird mit „Und“ wiedergegeben. Für natürliches Deutsch steht „Wein“ innerhalb der umgestellten Satzfolge.
- source_word: תַּקְרִיב
  choice: sollst du … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Gabe. „Darbringen“ ist im Deutschen klar und wahrt den kultischen Zusammenhang.
- source_word: לַנֶּסֶךְ
  choice: als Trankopfer
  rationale: נֶסֶךְ bezeichnet ein ausgegossenes Flüssigkeitsopfer. „Trankopfer“ ist die verständliche und etablierte deutsche Entsprechung.
- source_word: חֲצִי הַהִין
  choice: einen halben Hin
  rationale: Die alte Maßeinheit wird beibehalten, statt sie mit einem unsicheren modernen Volumenwert zu ersetzen.
- source_word: אִשֵּׁה
  choice: ein Feueropfer
  rationale: Das priesterliche Opferwort wird traditionell und seinem wahrscheinlichen Bezug auf die Darbringung im Feuer entsprechend mit „Feueropfer“ wiedergegeben. Die ebenfalls vertretene funktionale Deutung als Speisegabe bleibt in der Fußnote sichtbar.
- source_word: רֵיחַ נִיחֹחַ
  choice: von angenehmem Duft
  rationale: Die feste kultische Wendung beschreibt den wohlgefälligen beziehungsweise angenehmen Duft des Opfers. Die Formulierung ist natürlich und vermeidet eine unnötige Auflösung der Bildsprache.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition לְ bezeichnet hier die Ausrichtung auf Gott; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ gibt den Eigennamen als solchen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אִשֵּׁה
  choice: Feueropfer
  alternative: Speisegabe; eine im Feuer dargebrachte Gabe
  rationale: Die Feuerassoziation des kultischen Ausdrucks wird im Haupttext gewahrt, ohne die alternative funktionale Deutung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die alte Maßeinheit „Hin“ und die kultischen Begriffe bleiben erhalten; die Satzstellung wurde für flüssiges Deutsch behutsam umgeordnet.
