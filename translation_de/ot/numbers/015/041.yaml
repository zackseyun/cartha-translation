  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: de
  text: Ich bin Jahwe, euer Gott, der euch aus dem Land Ägypten herausgeführt hat, um euer Gott zu sein.[a] Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um euch zum Gott zu sein“.'
    reason: Die Fußnote bildet die hebräische Konstruktion לִהְיוֹת לָכֶם לֵאלֹהִים einschließlich der Präposition ל genauer ab, während der Haupttext die Bundesformel idiomatisch wiedergibt.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Tetragramms bewahrt den offenbarten Eigennamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, bezeichnet es hier mit singularischem Bezug den einen Gott Israels; das Suffix der 2. Person Plural wird mit „euer“ wiedergegeben.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen bezieht sich auf den persönlichen Sprecher und wird im Deutschen natürlich mit „der“ wiedergegeben.
- source_word: הוֹצֵאתִי
  choice: herausgeführt hat
  rationale: Der Hifil von יצא hat kausativen Sinn („herausbringen/herausführen“). „Herausgeführt“ gibt die Exodusformel klar und idiomatisch wieder.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: „Land“ wird entsprechend אֶרֶץ ausdrücklich bewahrt; die Formulierung erhält den feierlichen Klang der Exodusformel.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: um euer Gott zu sein
  rationale: Die Infinitivkonstruktion bezeichnet Zweck beziehungsweise Ergebnis und drückt die Bundesbeziehung in natürlichem Deutsch aus.
- source_word: אֲנִי
  choice: Ich bin
  rationale: Der hebräische Nominalsatz benötigt im Deutschen eine Kopula; „Ich bin“ bewahrt zugleich die Hervorhebung in beiden Vorkommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt im modernen Deutschen den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bundesformel לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: um euer Gott zu sein
  alternative: um euch Gott zu sein
  rationale: Die gewählte Formulierung macht die Bundesbeziehung in verständlichem Deutsch deutlich; die wörtlichere, ungewöhnliche Zuordnung mit לָכֶם wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlicher Wiederholung der Selbstvorstellung. Die Satzstruktur bleibt eng am hebräischen Bundes- und Exoduswortlaut, vermeidet jedoch unnötig altertümliche Wendungen.
