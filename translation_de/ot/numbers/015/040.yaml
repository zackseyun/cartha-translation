source:
  edition: WLC
  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: de
  text: damit ihr euch erinnert und alle meine Gebote ausführt und heilig für euren Gott seid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet einen Zweck beziehungsweise ein beabsichtigtes Ergebnis ein und entspricht natürlichem modernem Deutsch.
- source_word: תִּזְכְּרוּ
  choice: ihr euch erinnert
  rationale: Das Qal-Imperfekt in der Zweckkonstruktion bezeichnet das beabsichtigte Erinnern; die reflexive deutsche Wendung ist idiomatisch.
- source_word: וַעֲשִׂיתֶם
  choice: und … befolgt
  rationale: עשה bedeutet hier, die Gebote auszuführen. „Befolgen“ gibt dies im Deutschen natürlich wieder, ohne eine bloß äußerliche Handlung anzudeuten.
- source_word: אֶת כָּל מִצְוֺתָי
  choice: alle meine Gebote
  rationale: Bewahrt כָּל, den Possessivsuffix und den rechtlich-bundestheologischen Sinn von מִצְוֹת.
- source_word: וִהְיִיתֶם
  choice: und … seid
  rationale: היה mit prädikativem Adjektiv bezeichnet hier einen Zustand; „seid“ fügt sich natürlich in die Zweckreihe ein, ohne einen ausdrücklich gebotenen Prozess des Werdens einzutragen.
- source_word: קְדֹשִׁים
  choice: heilig
  rationale: „Heilig“ bewahrt die ethische, kultische und bundestheologische Bedeutungsbreite; „abgesondert“ wäre enger und stärker deutend.
- source_word: לֵאלֹהֵיכֶם
  choice: eurem Gott
  rationale: Der Dativ gibt die durch ל bezeichnete Beziehung beziehungsweise Zuordnung im Deutschen knapp und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung der Heiligkeit im Bundeskontext
  choice: „heilig“ beibehalten
  alternative: „für euren Gott ausgesondert“ oder „eurem Gott geweiht“
  rationale: „Heilig“ wahrt die volle ethische, kultische und relationale Spannung des hebräischen Ausdrucks, ohne ihn auf Absonderung oder Weihe zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Zweckkonstruktion bleibt erhalten. „Eurem Gott heilig“ ist bewusst knapp und bildet die relationale Formulierung des Hebräischen ab.
