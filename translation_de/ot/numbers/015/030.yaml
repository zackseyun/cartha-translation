  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: de
  text: Doch wer mit erhobener Hand[a] handelt, sei es ein Einheimischer oder ein Fremder, verhöhnt Jahwe; diese Person soll aus der Mitte ihres Volkes ausgerottet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vermessen“ oder „trotzig“; wörtlich: „mit erhobener Hand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: wer / diese Person
  rationale: נֶפֶשׁ bezeichnet im Rechtskontext die ganze Person. Die Konstruktion „wer … diese Person“ ist im modernen Deutschen natürlich und bewahrt den juridischen Sinn.
- source_word: תַּעֲשֶׂה
  choice: handelt
  rationale: Das breite Verb עשה wird kontextgemäß mit „handelt“ wiedergegeben, ohne die Art des Vergehens enger festzulegen als der Vers.
- source_word: בְּיָד רָמָה
  choice: mit erhobener Hand
  rationale: Die bildhafte hebräische Wendung wird formal bewahrt. Sie bezeichnet demonstratives, vermessenes oder trotziges Handeln; diese Deutungsmöglichkeiten stehen in der Fußnote.
- source_word: הָאֶזְרָח
  choice: Einheimischer
  rationale: Bezeichnet ein einheimisches Mitglied der israelitischen Gemeinschaft und bildet einen klaren rechtlichen Gegensatz zu גֵּר.
- source_word: הַגֵּר
  choice: Fremder
  rationale: גֵּר bezeichnet hier einen nicht einheimischen Menschen, der dauerhaft innerhalb Israels lebt. „Fremder“ ist verständlich und verlangt keine moderne staatsrechtliche Kategorie.
- source_word: אֶת־יְהוָה הוּא מְגַדֵּף
  choice: verhöhnt Jahwe
  rationale: גדף drückt verächtliche Schmähung beziehungsweise Lästerung aus. „Verhöhnt“ erfasst den direkten Angriff auf Jahwe, ohne ihn auf bloße Rede zu beschränken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְנִכְרְתָה
  choice: soll … ausgerottet werden
  rationale: Die deutsche biblisch-rechtliche Wendung bewahrt die Schwere von כרת im Niphal, ohne zu entscheiden, ob menschliche Hinrichtung, Ausschluss oder unmittelbares göttliches Gericht gemeint ist.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: aus der Mitte ihres Volkes
  rationale: Die Formulierung gibt die Entfernung aus der eigenen Gemeinschaft wieder. Das feminine Pronomen entspricht im Deutschen dem Bezugswort „Person“.
theological_decisions:
- issue: Art des Vergehens und der Strafe
  choice: Die offene, trotzige Auflehnung wird durch das Bild „mit erhobener Hand“ bezeichnet; „ausgerottet“ bleibt hinsichtlich der konkreten Vollzugsart offen.
  alternative: Die Wendung ausdrücklich als „vorsätzlich“ oder „trotzig“ deuten und „ausgerottet“ auf Hinrichtung oder Ausschluss festlegen.
  rationale: Der hebräische Text trägt beide Aussagen mit großem Gewicht vor, bestimmt aber weder alle Aspekte des Idioms noch die genaue Art der Sanktion. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter Bildsprache und rechtlichem Ton. „Sei es … oder …“ gibt die universale Geltung für Einheimische und ansässige Fremde knapp wieder.
