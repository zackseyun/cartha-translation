revisions:
- from: Jeder Einheimische[a] soll dies auf diese Weise tun, um Jahwe ein Feueropfer[b] darzubringen, einen Duft, der ihm gefällt.
  to: Jeder Einheimische[a] soll dies alles auf diese Weise tun, um Jahwe ein Feueropfer[b] als wohlgefälligen Duft darzubringen.
  rationale: Die Revision verbindet die kultische Formel אִשֶּׁה רֵיחַ נִיחֹחַ im Deutschen klarer und wahrt zugleich ihre knappe, formelhafte Aussage. „Dies alles“ gibt den pluralischen Rückverweis von אֵלֶּה besser wieder. Die Fußnote zu אִשֶּׁה wurde sprachlich und sachlich präzisiert, ohne eine umstrittene Etymologie zur Hauptübersetzung zu erheben.
