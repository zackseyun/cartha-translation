  verdict: revise
  source_fidelity: Der Entwurf gibt die distributive und rechtlich vorschreibende Aussage von כָּל הָאֶזְרָח יַעֲשֶׂה angemessen wieder und übersetzt den Gottesnamen korrekt mit „Jahwe“. Die Verbindung von אִשֶּׁה und רֵיחַ נִיחֹחַ sollte jedoch im Deutschen enger als kultische Bestimmung ausgedrückt werden. „einen Duft, der ihm gefällt“ steht derzeit etwas lose neben „ein Feueropfer“ und macht die Funktion des Duftausdrucks weniger klar.
  naturalness: „Jeder Einheimische soll dies auf diese Weise tun“ ist verständlich, aber „dies alles“ bezieht sich natürlicher und vollständiger auf אֵלֶּה. „Als wohlgefälligen Duft“ ist modernes, würdiges Standarddeutsch und bildet die hebräische Opferformel idiomatischer ab als der Relativsatz.
  terminology: „Feueropfer“ ist als traditionelle, quellentreue Wiedergabe von אִשֶּׁה vertretbar. Die Fußnote sollte die Deutungsunsicherheit sachlich benennen, ohne die unidiomatische Formulierung „Feuer-Gabe“ oder eine zu starke Gleichsetzung mit einem Speiseopfer zu verwenden. „Wohlgefälliger Duft“ ist für רֵיחַ נִיחֹחַ ein etablierter und theologisch nicht überdeutender Ausdruck.
  issues:
