    rationale: Die genaue Herleitung des Fachworts ist umstritten; im Kontext ist jedoch sicher eine Opfergabe im Zusammenhang mit Feuer gemeint. Die Fußnote sollte diese Spannung präzise und zurückhaltend markieren.
