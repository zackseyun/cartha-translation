  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: de
  text: Jeder Einheimische[a] soll dies alles auf diese Weise tun, um Jahwe ein Feueropfer[b] als wohlgefälligen Duft darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet einen maskulinen Singular mit repräsentativer Bedeutung; gemeint ist jeder einheimische Angehörige Israels.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine durch Feuer dargebrachte Opfergabe“. Die genaue Bedeutung des hebräischen Fachworts ist umstritten; möglicherweise hängt es mit „Speise“ zusammen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: Jeder Einheimische
  rationale: כָּל ist vor dem singularischen הָאֶזְרָח distributiv zu verstehen. „Einheimischer“ bezeichnet hier ein einheimisches Mitglied Israels im Gegensatz zum Fremden im folgenden Vers.
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: soll dies auf diese Weise tun
  rationale: Das Imperfekt hat im Gesetzestext vorschreibende Kraft. „Dies“ verweist knapp auf die zuvor geregelten Opferhandlungen zurück.
- source_word: לְהַקְרִיב
  choice: um … darzubringen
  rationale: Der Hifil von קרב ist hier der übliche kultische Ausdruck für das Darbringen eines Opfers; die deutsche Zweckkonstruktion gibt לְ angemessen wieder.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Der kultische Fachausdruck bezeichnet ein dem Feuer übergebenes beziehungsweise durch Feuer dargebrachtes Opfer. Die Übersetzung bleibt nahe am hebräischen Ausdruck; eine alternative Deutung wird in der Fußnote genannt.
- source_word: רֵיחַ נִיחֹחַ
  choice: einen Duft, der ihm gefällt
  rationale: Die natürliche deutsche Formulierung bewahrt die kultische Aussage, dass die Gabe vor Jahwe Wohlgefallen findet, ohne den feststehenden hebräischen Ausdruck unnötig wörtlich klingen zu lassen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt den im Ausgangstext verwendeten Bundesnamen.
- issue: Generische Bedeutung des maskulinen Singulars הָאֶזְרָח
  choice: Jeder Einheimische
  alternative: Jede einheimische Person
  rationale: Die Form ist grammatisch maskulin und singularisch, hat in dieser gesetzlichen Anweisung jedoch repräsentative, nicht ausschließlich männliche Bedeutung. Die Fußnote macht diese Spannung sichtbar.
- issue: Bedeutung des kultischen Ausdrucks אִשֵּׁה
  choice: Feueropfer
  alternative: Speiseopfer / durch Feuer dargebrachtes Opfer
  rationale: Die genaue Etymologie und Nuance des Fachworts sind umstritten. „Feueropfer“ wahrt den traditionellen Bezug zum Feuer, ohne die alternative Auffassung als Gabe beziehungsweise Speise auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gesetzlichem „soll“. Die Syntax bleibt klar und mündlich verständlich; kultische Fachsprache wird nur dort verwendet, wo der hebräische Text selbst einen Fachausdruck bietet.
