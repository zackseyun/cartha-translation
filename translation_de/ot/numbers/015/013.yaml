    issue: Die Apposition „ein Feueropfer ..., einen Duft, der ihm gefällt“ ist syntaktisch und semantisch locker angebunden.
    rationale: רֵיחַ נִיחֹחַ charakterisiert im Opferkontext die Opfergabe beziehungsweise ihre Annahme vor Jahwe. Die Konstruktion „als wohlgefälligen Duft“ stellt diesen Bezug klar, ohne über den hebräischen Text hinauszugehen.
  - severity: low
