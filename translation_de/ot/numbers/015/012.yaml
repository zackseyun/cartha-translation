translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Anlehnung an die wiederholte Mengenstruktur des Hebräischen. Die nicht ausdrücklich genannten Opfer beziehungsweise Tiere werden nicht in den Haupttext eingefügt; dadurch bleibt die im Ausgangstext vorhandene Bezugsoffenheit erhalten.
