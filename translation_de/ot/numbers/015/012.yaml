  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: de
  text: Je nachdem, wie viele ihr zubereitet[a], sollt ihr für jedes einzelne entsprechend ihrer Anzahl verfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Je nachdem, wie viele ihr macht; so sollt ihr für jedes einzelne entsprechend ihrer Anzahl tun.« Das hebräische Verb עשה bedeutet gewöhnlich »tun« oder »machen«; hier verdeutlicht »zubereiten« den Zusammenhang der Opfergaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: Entsprechend der Anzahl
  rationale: Das präfigierte כ bezeichnet hier Übereinstimmung beziehungsweise ein Verhältnis; die Wendung bewahrt die formale Mengenangabe und passt zur Vorschrift über die Opfergaben.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen leitet den auf »Anzahl« bezogenen Relativsatz ein und entspricht natürlichem modernem Deutsch.
- source_word: תַּעֲשׂוּ
  choice: ihr zubereitet / sollt ihr … machen
  rationale: עשה bedeutet grundsätzlich »tun/machen«, bezeichnet im Opferzusammenhang jedoch das Zubereiten beziehungsweise Bereitstellen der Gaben. Die erste Wiedergabe verdeutlicht den Kontext; die zweite bewahrt die allgemeine Bedeutung des Verbs und vermeidet eine schwerfällige Wiederholung.
- source_word: כָּכָה
  choice: genauso
  rationale: Das Adverb nimmt die einleitende Verhältnisangabe auf und bringt die geforderte Gleichförmigkeit der Zubereitung zum Ausdruck.
- source_word: לָאֶחָד
  choice: für jedes einzelne
  rationale: Wörtlich steht »für das eine«; im Zusammenhang ist die Form distributiv und meint jede einzelne Einheit der zuvor genannten Opfer.
- source_word: כְמִסְפָּרָם
  choice: entsprechend ihrer Anzahl
  rationale: Die Wiedergabe erhält sowohl den Vergleichsausdruck כ als auch das pluralische Suffix »ihrer« und lässt den Bezug auf die gezählten Opfer unausgesprochen wie im Hebräischen.
