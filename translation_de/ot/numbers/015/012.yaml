  source_fidelity: Der Entwurf gibt die wiederholte Mengenstruktur, die distributive Wendung לָאֶחָד und das pluralische Suffix in כְמִסְפָּרָם im Wesentlichen wieder. Die Verbindung „die ihr zubereitet“ lässt im Deutschen jedoch fälschlich „Anzahl“ als direkt zubereiteten Gegenstand erscheinen. Der hebräische Text setzt den kultischen Gegenstand elliptisch voraus; dies lässt sich idiomatischer ausdrücken, ohne ihn ausdrücklich zu benennen.
  naturalness: „Entsprechend der Anzahl, die ihr zubereitet“ ist im modernen Deutsch schwer verständlich, da man keine Anzahl zubereitet. Auch „es ... machen“ ist hier weniger präzise und stilistisch uneinheitlich gegenüber dem ersten „zubereitet“. „Je nachdem, wie viele ihr zubereitet“ und „verfahren“ ergeben einen natürlichen, sachlich-vorschriftlichen Satz.
  terminology: „Zubereiten“ ist im unmittelbaren Opferkontext als kontextklärende Wiedergabe von עשה vertretbar, sofern die Fußnote die allgemeinere Grundbedeutung nennt. „Jeweils“ bzw. „für jedes einzelne“ wahrt die bewusst nicht näher bestimmte Bezugsgröße; es werden weder Tiere noch Opfergaben ausdrücklich ergänzt.
