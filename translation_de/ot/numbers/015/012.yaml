  rationale: Die Revision beseitigt die im Deutschen missverständliche Vorstellung, eine „Anzahl“ werde zubereitet, und bewahrt zugleich die im Hebräischen elliptisch bleibende Bezugsgröße. Die wiederholte Orientierung an der Anzahl sowie die distributive und im Bezug offene Schlusswendung bleiben erhalten.
