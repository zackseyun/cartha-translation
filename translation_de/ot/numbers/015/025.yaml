  to: Der Priester soll für die ganze Gemeinschaft der Israeliten Sühne erwirken, und ihnen wird vergeben werden, denn es war eine unbeabsichtigte Verfehlung, und sie haben ihre Opfergabe, ein Feueropfer[a] für Jahwe, und ihr Sündopfer[b] vor Jahwe dargebracht, wegen ihrer unbeabsichtigten Verfehlung.
