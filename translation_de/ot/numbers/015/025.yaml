id: NUM.15.25
reference: Numbers 15:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: de
  text: Der Priester soll für die ganze Gemeinschaft der Israeliten Sühne erwirken, und ihnen wird vergeben werden, denn es war eine unbeabsichtigte Verfehlung, und sie haben ihre Opfergabe, ein Feueropfer[a] für Jahwe, und ihr Sündopfer[b] vor Jahwe dargebracht, wegen ihrer unbeabsichtigten Verfehlung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Speisegabe für Jahwe“. Das hebräische Wort ist ein technischer Opferbegriff; seine genaue Deutung ist umstritten. Traditionell wird es als „Feueropfer“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr Reinigungsopfer“. Das hebräische Wort kann im Opferkontext das Opfer bezeichnen, das Sünde beziehungsweise kultische Verunreinigung beseitigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: soll … Sühne erwirken
  rationale: Das Piel von כפר bezeichnet im Opferkontext das Herbeiführen von Sühne. „Sühne erwirken“ ist im Deutschen verständlich und bewahrt die kultisch-theologische Aussage, ohne den Priester ausdrücklich zum Urheber der Vergebung zu machen.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: für die ganze Gemeinschaft der Israeliten
  rationale: עַל bezeichnet hier die Personengruppe, für die Sühne erwirkt wird. „Gemeinschaft der Israeliten“ gibt עֲדַת בְּנֵי יִשְׂרָאֵל natürlich und inklusiv als Bezeichnung des versammelten Volkes wieder.
- source_word: וְנִסְלַח לָהֶם
  choice: und ihnen wird vergeben werden
  rationale: Die unpersönliche Passivform bewahrt, dass der hebräische Text den Handelnden nicht ausdrücklich nennt, und bringt zugleich die zugesagte Vergebung klar zum Ausdruck.
- source_word: כִּי שְׁגָגָה הִוא
  choice: denn es war eine unbeabsichtigte Verfehlung
  rationale: שְׁגָגָה bezeichnet ein aus Versehen beziehungsweise ohne Absicht begangenes Fehlverhalten. „Unbeabsichtigte Verfehlung“ erhält sowohl den rechtlichen als auch den moralischen Gehalt.
- source_word: אֶת קָרְבָּנָם
  choice: ihre Opfergabe
  rationale: קָרְבָּן ist der allgemeine Ausdruck für eine Gott dargebrachte Gabe. „Opfergabe“ ist im Deutschen präzise und vermeidet eine unnötige Festlegung auf eine bestimmte Opferart.
- source_word: אִשֶּׁה לַיהוָה
  choice: als Feueropfer für Jahwe
  rationale: אִשֶּׁה bezeichnet eine auf dem Altar verbrannte Opfergabe. „Feueropfer“ gibt den kultischen Vollzug knapp wieder; die mögliche Deutung als „Speisegabe“ wird in einer Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְחַטָּאתָם
  choice: und ihr Sündopfer
  rationale: Da חַטָּאת hier etwas bezeichnet, das vor Jahwe gebracht wird, ist die Opferbedeutung gefordert. „Reinigungsopfer“ bleibt eine sachlich mögliche alternative Bezeichnung.
- source_word: עַל שִׁגְגָתָם
  choice: wegen ihrer unbeabsichtigten Verfehlung
  rationale: Die Wiederholung derselben hebräischen Wortwurzel wird mit derselben deutschen Wendung sichtbar gehalten. עַל bezeichnet hier den Anlass beziehungsweise Grund des Opfers.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Umschrift „Jahwe“ bewahrt dessen Charakter als Eigenname.
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Die Syntax verlangt eine Opfergabe, nicht lediglich die abstrakte „Sünde“. „Sündopfer“ ist die geläufige Wiedergabe; „Reinigungsopfer“ hebt eine ebenfalls vorhandene kultische Funktion hervor und wird deshalb in der Fußnote genannt.
- issue: Verhältnis von Sühne und Vergebung
  choice: Der Priester erwirkt Sühne; die Vergebung wird passiv zugesagt
  alternative: Der Priester vergibt ihnen
  rationale: Der hebräische Text unterscheidet das priesterliche Sühnehandeln von der passiv formulierten Vergebung. Diese theologisch bedeutsame Unterscheidung wird nicht eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Schlüsselbegriffe „Sühne“, „Opfergabe“ und „Sündopfer“ bleiben erhalten, werden aber in einer klaren Satzstruktur verwendet. Der Gedankenstrich am Schluss bildet die nachgestellte hebräische Begründung ab, ohne ihren Bezug zu den dargebrachten Opfern zu verwischen.
