- from: Dann soll derjenige, der Yahweh seine Opfergabe darbringt, als Speiseopfer ein Zehntel Efa Feinmehl darbringen, vermengt mit einem Viertel Hin Öl.
  to: 'Dann soll derjenige, der Yahweh seine Opfergabe darbringt, ein Speiseopfer aus Feinmehl darbringen: ein Zehntel eines Efa, mit einem Viertel eines Hin Öl vermischt.'
  rationale: Die Revision glättet ausschließlich die deutschen Maßkonstruktionen und stellt den syntaktischen Bezug des mit Öl vermischten Feinmehls klar. Bedeutung, kultischer Registerton, Gottesname und die im Hebräischen vorausgesetzten antiken Maße bleiben gewahrt.
