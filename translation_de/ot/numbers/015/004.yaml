  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: de
  text: 'Dann soll derjenige, der Yahweh seine Opfergabe darbringt, ein Speiseopfer aus Feinmehl darbringen: ein Zehntel eines Efa, mit einem Viertel eines Hin Öl vermischt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Dann soll ... darbringen
  rationale: Das Waw mit der Verbform führt die gesetzliche Abfolge aus dem vorherigen Vers fort; „dann“ gibt diesen verfahrensbezogenen Anschluss natürlich wieder. „Darbringen“ trifft den kultischen Sinn von הקריב.
- source_word: הַמַּקְרִיב
  choice: derjenige, der ... darbringt
  rationale: Das Hifil-Partizip bezeichnet die Person, die die Opfergabe darbringt, ohne einen unnötig technischen Ausdruck zu verwenden.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן bezeichnet hier allgemein eine Gott dargebrachte Gabe; „Opfergabe“ ist im kultischen Zusammenhang klar und präzise.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als „Yahweh“ wiedergegeben; die durch ל ausgedrückte Richtung beziehungsweise Zuordnung ist in „Yahweh ... darbringt“ enthalten.
- source_word: מִנְחָה
  choice: als Speiseopfer
  rationale: Im Opferrecht bezeichnet מִנְחָה ein aus pflanzlichen Erzeugnissen bestehendes Opfer. „Speiseopfer“ ist im Deutschen verständlich und schließt sich natürlich an das ausdrücklich genannte Feinmehl an.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת bezeichnet hochwertiges, fein gemahlenes Mehl für Opfergaben; „Feinmehl“ ist knapp und geläufig.
- source_word: עִשָּׂרוֹן
  choice: ein Zehntel Efa
  rationale: Wörtlich steht „ein Zehntel“; in den Opferbestimmungen ist damit ein Zehntel Efa gemeint. Die ergänzte Maßeinheit macht die Angabe auf Deutsch verständlich.
- source_word: בָּלוּל
  choice: vermengt
  rationale: Das passive Partizip beschreibt das mit Öl vermischte Mehl. „Vermengt“ ist natürlich und dem würdigen kultischen Register angemessen.
- source_word: בִּרְבִעִית הַהִין
  choice: mit einem Viertel Hin
  rationale: Die alte Maßeinheit Hin bleibt erhalten; „ein Viertel“ gibt die Mengenangabe genau wieder.
- source_word: שָׁמֶן
  choice: Öl
  rationale: Der hebräische Text nennt nur Öl. Obwohl wahrscheinlich Olivenöl gemeint ist, wird diese Spezifizierung nicht in den Haupttext eingeführt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Text enthält den Gottesnamen יהוה. Die Transliteration „Yahweh“ bewahrt ihn als Namen und folgt der vorgegebenen Übersetzungspraxis, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die antiken Maßeinheiten Efa und Hin bleiben erhalten. Keine Fußnote ist erforderlich, da „ein Zehntel Efa“ die im Opferkontext vorausgesetzte Maßeinheit knapp im Haupttext ausweist.
