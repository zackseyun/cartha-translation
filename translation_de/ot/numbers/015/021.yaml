base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: de
  text: Von der ersten Portion eures Teiges[a] sollt ihr Jahwe über alle eure Generationen hinweg eine Abgabe[b] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eurer Knetgefäße“; das hebräische Wort kann den Teig oder, damit verbunden, das Knetgefäß bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Opfergabe“; traditionell: „Hebopfer“. Gemeint ist ein ausgesonderter, Jahwe dargebrachter Anteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: von der ersten Portion
  rationale: רֵאשִׁית bezeichnet hier den ersten, aus dem Ganzen genommenen Anteil. „Erste Portion“ gibt den partitiven und kultischen Sinn natürlich wieder, ohne ihn ausdrücklich als „Erstlingsgabe“ zu deuten.
- source_word: עֲרִסֹתֵיכֶם
  choice: eures Teiges
  rationale: עֲרִסָה kann den Teig oder metonymisch das Knetgefäß bezeichnen. Da ein Anteil davon gegeben wird, ist „Teig“ im Zusammenhang am naheliegendsten; die sachlich mögliche Alternative bleibt in der Fußnote erhalten.
- source_word: תִּתְּנוּ
  choice: sollt ihr … geben
  rationale: נתן bedeutet gewöhnlich „geben“. Die schlichte Verpflichtungsform bewahrt die Direktheit des hebräischen Gebots, ohne das Verb kultisch zu spezialisieren.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der Eigenname erkennbar bleibt.
- source_word: תְּרוּמָה
  choice: eine Abgabe
  rationale: תְּרוּמָה bezeichnet einen ausgesonderten, Gott dargebrachten Anteil. „Abgabe“ ist verständliches heutiges Deutsch und enger als das allgemeine „Opfer“, ohne den umstrittenen traditionellen Ausdruck „Hebopfer“ in den Haupttext zu übernehmen.
- source_word: לְדֹרֹתֵיכֶם
  choice: über alle eure Generationen hinweg
  rationale: Die Wendung bezeichnet die fortdauernde Geltung für die aufeinanderfolgenden Generationen. Die deutsche Formulierung gibt diese zeitliche Erstreckung idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Ausgangstext ausdrücklich gebraucht. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von תְּרוּמָה
  choice: Abgabe
  alternative: Opfergabe / Hebopfer
  rationale: „Abgabe“ lässt offen, wie der ausgesonderte Anteil rituell behandelt wird, und vermeidet sowohl eine zu allgemeine Opferkategorie als auch die traditionelle, erklärungsbedürftige Festlegung auf „Hebopfer“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Gebot, Empfänger und generationenübergreifende Geltung klar zusammen. Lexikalische Mehrdeutigkeiten werden nicht im Haupttext überladen, sondern in den markierten Fußnoten bewahrt.
