  source_fidelity: Die Übersetzung gibt die unpersönlich-passive Vergebungszusage von וְנִסְלַח angemessen wieder. Die gesamte israelitische Gemeinschaft sowie der גֵּר innerhalb ihrer Mitte werden ausdrücklich einbezogen. Die knappe Schlussklausel wird idiomatisch als unbeabsichtigtes Handeln des ganzen Volkes ausgelegt; Fußnote b bewahrt die mögliche unpersönlichere Deutung und damit die hebräische Kürze.
