reference: Numbers 15:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: de
  text: Und der ganzen Gemeinschaft der Israeliten wird vergeben werden, ebenso dem Fremden, der in ihrer Mitte lebt[a]; denn das ganze Volk hat aus Versehen gehandelt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Fremder“ ist hier ein nichtisraelitischer Einwohner gemeint, der dauerhaft unter den Israeliten lebt und an den Rechten und Pflichten ihrer Gemeinschaft teilhat.
    reason: cultural_note
  - marker: b
    text: 'Oder: „denn bei dem ganzen Volk geschah es aus Versehen.“ Der hebräische Schlusssatz ist sehr knapp.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: wird vergeben werden
  rationale: Das Nifal hat hier unpersönlich-passiven Sinn. Die deutsche Passivform gibt wieder, dass der Gemeinschaft Vergebung gewährt wird.
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: der ganzen Gemeinschaft der Israeliten
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft. „Gemeinschaft der Israeliten“ ist im modernen Deutschen natürlich und bewahrt den korporativen Sinn von בְּנֵי יִשְׂרָאֵל.
- source_word: וְלַגֵּר
  choice: ebenso dem Fremden
  rationale: גֵּר bezeichnet einen nichtisraelitischen dauerhaft ansässigen Fremden innerhalb der Gemeinschaft. „Fremder“ ist würdig und verständlich; die nähere soziale Bedeutung wird in der Fußnote erläutert.
- source_word: הַגָּר בְּתוֹכָם
  choice: der in ihrer Mitte lebt
  rationale: Die Partizipialfügung bezeichnet den Aufenthalt innerhalb Israels. Eine wörtliche Wiedergabe des hebräischen Wortspiels wäre auf Deutsch schwerfällig; diese Formulierung ist natürlich und präzise.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den Grund für die zuvor zugesagte Vergebung ein.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: das ganze Volk hat aus Versehen gehandelt
  rationale: Die kompakte Nominalfügung wird als elliptische Aussage verstanden. „Aus Versehen“ wahrt die rechtliche Kategorie einer unbeabsichtigten Verfehlung, ohne den im Hebräischen nicht ausdrücklich genannten Gegenstand zu ergänzen.
theological_decisions:
- issue: Korporativer Umfang der Vergebung
  choice: Die Vergebung gilt der ganzen Gemeinschaft Israels und ebenso dem ansässigen Fremden.
  alternative: Die erste Wendung könnte formaler als „der ganzen Gemeinde der Söhne Israels“ wiedergegeben werden.
  rationale: Der Text betont die gemeinschaftliche Reichweite und schließt den Fremden ausdrücklich ein, ohne darüber hinausgehende dogmatische Aussagen hinzuzufügen.
- issue: Deutung der knappen Schlussklausel
  choice: „denn das ganze Volk hat aus Versehen gehandelt“
  alternative: „denn bei dem ganzen Volk geschah es aus Versehen“
  rationale: Das Hebräische ist knapp und lässt offen, ob eher das Volk als irrend oder das Geschehen als unbeabsichtigt beschrieben wird. Die Hauptfassung ist idiomatisch, während die Fußnote die sachlich mögliche unpersönliche Wiedergabe bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gemeinschaft“ vermeidet die heute leicht konfessionell verstandene Engführung von „Gemeinde“, und „aus Versehen“ macht die rechtliche Kategorie der unbeabsichtigten Verfehlung allgemein verständlich.
