  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: de
  text: Wenn aber etwas versehentlich geschieht und es der Gemeinde entgeht, soll die ganze Gemeinde einen Stier aus der Rinderherde als Brandopfer darbringen, zum wohlgefälligen Duft für Jahwe, samt dem dazugehörigen Speiseopfer und Trankopfer nach der Vorschrift, außerdem einen Ziegenbock als Sündopfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Reinigungsopfer«. Das hebräische Wort חַטָּאת kann das mit Sünde verbundene Opfer und dessen rituell reinigende Wirkung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: der Gemeinde entgangen
  rationale: Die Wendung bedeutet wörtlich „vor den Augen der Gemeinde weg“, bezeichnet hier aber idiomatisch etwas, das von ihr nicht bemerkt oder übersehen wurde.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: es unabsichtlich geschehen ist
  rationale: שְׁגָגָה bezeichnet einen unbeabsichtigten Verstoß und steht im Kontext im Gegensatz zu vorsätzlichem, herausforderndem Handeln.
- source_word: כָל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Bundesgemeinschaft; כָל wird mit „die ganze“ wiedergegeben.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: einen Stier aus der Rinderherde
  rationale: Die Konstruktion bezeichnet einen einzelnen Stier aus dem Rinderbestand; die Wiedergabe ist natürlich und bewahrt die Opferspezifikation.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist der feste kultische Ausdruck für ein vollständig verbranntes Opfer.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: zum wohlgefälligen Duft
  rationale: Die kultische Wendung beschreibt das Opfer als für Gott annehmbar und bewahrt zugleich das Bild des Duftes.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וּמִנְחָתוֹ וְנִסְכּוֹ
  choice: samt dem dazugehörigen Speiseopfer und Trankopfer
  rationale: Die Suffixe bezeichnen die vorgeschriebenen Begleitopfer zum Stier; „dazugehörig“ macht diesen Bezug im Deutschen deutlich.
- source_word: כַמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte kultische Regelung oder Verfahrensweise.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: außerdem einen Ziegenbock
  rationale: שְׂעִיר עִזִּים bezeichnet ausdrücklich ein männliches Tier; „außerdem“ gibt die koordinierende Ergänzung natürlich wieder.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת ist die herkömmliche Bezeichnung dieses Opfertyps; seine mögliche reinigende Nuance wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im priesterlichen Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Begriff kann sowohl den Bezug zur Sünde als auch die rituell reinigende Wirkung hervorheben. „Sündopfer“ wahrt die etablierte Terminologie; die sachlich bedeutsame Alternative wird in einer Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname im Ausgangstext wird als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter kultischer Terminologie. Der lange hebräische Satzbau bleibt erkennbar, wird jedoch durch natürliche deutsche Verknüpfungen lesbar gestaltet.
