id: NUM.15.8
reference: Numbers 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: de
  text: Und wenn du ein Rind als Brandopfer oder Schlachtopfer darbringst, um ein Gelübde zu erfüllen[a] oder als Friedensopfer für Jahwe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ein Gelübde einzulösen“ beziehungsweise „das Gelobte zu leisten“. Die hebräische Wendung meint, dass ausgeführt wird, was man gelobt hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gemeinschaftsopfer“ beziehungsweise „Heilsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Und wenn
  rationale: Die Verbindung leitet im fortlaufenden Gesetzestext einen weiteren Fall ein. „Und wenn“ gibt sowohl den Anschluss als auch den konditional-temporalen Sinn natürlich wieder.
- source_word: תַעֲשֶׂה
  choice: darbringst
  rationale: Das Verb bedeutet grundsätzlich „tun/machen“, bezeichnet hier aber die kultische Verwendung des Rindes als Opfer. „Darbringen“ ist im Deutschen idiomatisch und aus dem unmittelbaren Zusammenhang hinreichend bestimmt.
- source_word: בֶן בָּקָר
  choice: ein Rind
  rationale: Die Wendung bezeichnet ein Tier aus der Rinderherde. „Ein Rind“ wahrt die fehlende eindeutige Altersangabe besser als „ein Jungstier“.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Dies ist die geläufige und sachlich genaue Bezeichnung für das vollständig verbrannte Opfer.
- source_word: אוֹ זָבַח
  choice: oder Schlachtopfer
  rationale: זֶבַח bezeichnet ein durch Schlachtung dargebrachtes Opfer. „Schlachtopfer“ unterscheidet den allgemeinen Opferbegriff hier klar vom Brandopfer, ohne eine engere Unterart vorwegzunehmen.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: um ein Gelübde zu erfüllen
  rationale: Die Wendung bezeichnet hier die Ausführung dessen, was durch ein Gelübde zugesagt wurde. Die deutsche Formulierung gibt den idiomatischen Sinn klar wieder.
- source_word: אוֹ שְׁלָמִים
  choice: oder als Friedensopfer
  rationale: „Friedensopfer“ ist die etablierte, knappe Bezeichnung der Opferkategorie. Der Singular im Deutschen stimmt mit dem einzelnen Rind überein, obwohl die hebräische Kategorie im Plural steht.
- source_word: לַ/יהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier den Empfänger beziehungsweise die Widmung des Opfers. „Für“ ist in diesem deutschen Satz natürlicher als „Jahwe darbringen“, während der Gottesname ausdrücklich erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: „Friedensopfer“ bewahrt die traditionelle Opferkategorie und legt den vielschichtigen Begriff nicht ausschließlich auf Gemeinschaft oder Wohlergehen fest.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Satzform bleibt wegen des folgenden Verses bewusst offen und endet mit einem Komma. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
