source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: de
  text: und ihr Yahweh ein Feueropfer darbringt – ein Brandopfer oder ein Schlachtopfer, sei es, um ein Gelübde zu erfüllen, als freiwilliges Opfer oder zu euren festgesetzten Zeiten[a] –, um Yahweh einen wohlgefälligen Duft zu bereiten, von den Rindern oder vom Kleinvieh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an euren Festzeiten.'
    reason: Das hebräische Wort kann allgemein festgesetzte Zeiten oder speziell festgesetzte Festzeiten bezeichnen.
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: und ihr … ein Feueropfer darbringt
  rationale: Das allgemeine Verb „machen“ erhält im Opferzusammenhang idiomatisch die Bedeutung „darbringen“. „Feueropfer“ gibt den kultischen Fachausdruck אִשֶּׁה knapp und verständlich wieder.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: עֹלָה אוֹ זֶבַח
  choice: ein Brandopfer oder ein Schlachtopfer
  rationale: „Brandopfer“ ist die übliche präzise Wiedergabe von עֹלָה; „Schlachtopfer“ unterscheidet זֶבַח klar davon und wahrt dessen Bezug zur rituellen Schlachtung.
- source_word: לְפַלֵּא נֶדֶר
  choice: um ein Gelübde zu erfüllen
  rationale: Die Wendung bezeichnet hier die Ausführung beziehungsweise Einlösung eines Gelübdes; die gewählte Formulierung ist im Deutschen natürlich und lässt den Opferzweck erkennen.
- source_word: בִנְדָבָה
  choice: als freiwillige Gabe
  rationale: Die Formulierung bezeichnet eine aus freiem Entschluss dargebrachte Opfergabe und steht im Kontrast zum Gelübdeopfer.
- source_word: בְּמֹעֲדֵיכֶם
  choice: zu euren festgesetzten Zeiten
  rationale: מוֹעֵד kann allgemein einen festgesetzten Zeitpunkt oder konkreter eine Festzeit bezeichnen. Die Hauptfassung bewahrt den weiteren Bedeutungsumfang; die engere Möglichkeit steht in der Fußnote.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: um Yahweh einen wohlgefälligen Duft zu bereiten
  rationale: Die kultische Metapher bleibt erhalten, ohne den Ausdruck mechanistisch als tatsächliche Besänftigung Gottes auszudeuten. „Wohlgefällig“ bringt die positive Annahme des Opfers zum Ausdruck.
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: von den Rindern oder vom Kleinvieh
  rationale: בָּקָר bezeichnet Rinder, צֹאן kollektiv das Kleinvieh, vor allem Schafe und Ziegen. Die Übersetzung erhält diese kultisch relevante Unterscheidung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als solcher sichtbar gemacht, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropomorphe Opferformel רֵיחַ נִיחֹחַ
  choice: einen wohlgefälligen Duft
  alternative: einen beruhigenden Duft
  rationale: Die gewählte Fassung bewahrt das Bild und die Aussage göttlichen Wohlgefallens, ohne stärker als der Kontext eine Besänftigung oder Beschwichtigung zu behaupten.
translation_notes:
  register: Moderne, würdige Standardsprache mit den etablierten kultischen Begriffen „Brandopfer“, „Schlachtopfer“ und „Kleinvieh“. Der mit „und“ beginnende, syntaktisch an den vorherigen Vers anschließende Satzbau sowie das abschließende Komma wurden bewahrt.
