lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw consecutivum führt ein neues Redeereignis in der Erzählfolge ein; „sprach“ gibt דבר in der wiederkehrenden göttlichen Redeeinleitung würdig und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet den Adressaten der Rede; „zu Mose sprechen“ ist die natürliche deutsche Verbindung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Eigenname wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen als Namen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitung bleibt erhalten; לֵאמֹר wird idiomatisch durch den Doppelpunkt ausgedrückt.
