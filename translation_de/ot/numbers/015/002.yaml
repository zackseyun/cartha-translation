  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל אֶ֨רֶץ֙ מוֹשְׁבֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: de
  text: 'Rede zu den Söhnen Israels und sag zu ihnen[a]: »Wenn ihr in das Land kommt, in dem ihr wohnen werdet[b] und das ich euch gebe,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Israeliten« oder »zu den Kindern Israels«. Wörtlich heißt es im Hebräischen: »zu den Söhnen Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »in das Land eurer Wohnorte«; auch möglich: »in das Land eurer Niederlassungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ leitet den göttlichen Auftrag an Mose ein, eine Weisung weiterzugeben. »Rede zu« bewahrt den feierlichen Befehlsstil und ist im Deutschen natürlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die hebräische Wendung bedeutet wörtlich »Söhne Israels«. Die verwandtschaftliche und grammatisch maskuline Ausdrucksweise bleibt im Haupttext erhalten.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sag zu ihnen
  rationale: Die übliche Weitergabeformel wird direkt wiedergegeben. »Sag« ist modern und würdevoll, ohne die Wiederholung der beiden hebräischen Redeverben einzuebnen.
- source_word: כִּי
  choice: Wenn
  rationale: כִּי führt hier den erwarteten künftigen Umstand ein, unter dem die folgenden Bestimmungen gelten; eine kausale Wiedergabe wäre im Deutschen irreführend.
- source_word: תָבֹאוּ
  choice: ihr ... kommt
  rationale: בוא bezeichnet das Kommen beziehungsweise Eintreten. Die Konstruktion »in das Land kommt« ist idiomatisch und bleibt nahe am Ausgangstext.
- source_word: אֶרֶץ
  choice: das Land
  rationale: »Land« ist im Zusammenhang der Landverheißung die sachlich und theologisch angemessene Standardwiedergabe.
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: in dem ihr wohnen werdet
  rationale: Das Substantiv מוֹשָׁב kann Wohnort, Niederlassung oder Wohnen bezeichnen. Die relative Formulierung gibt den ungewöhnlichen hebräischen Ausdruck verständlich wieder, ohne eine konkrete Siedlungsform festzulegen.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: und das ich euch gebe
  rationale: Das Partizip נֹתֵן stellt Gottes Geben als gegenwärtig wirksame beziehungsweise feststehende Handlung dar. Das deutsche Präsens bewahrt diese Offenheit besser als ein ausschließlich zukünftiges »geben werde«.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  alternative: den Israeliten / den Kindern Israels
  rationale: Die wörtliche verwandtschaftliche Bezeichnung und ihre maskuline Form werden bewahrt; die Fußnote macht deutlich, dass die Wendung auch das Volk Israel als Gemeinschaft bezeichnen kann.
- issue: Zeitlicher Aspekt der göttlichen Gabe in נֹתֵן
  choice: das ich euch gebe
  alternative: das ich euch geben werde / das ich euch gerade gebe
  rationale: Das Präsens bewahrt die aspektuelle Spannung des hebräischen Partizips zwischen gegenwärtigem, bevorstehendem und gewiss zugesagtem Handeln, ohne sie auf eine einzige zeitliche Nuance festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt am Versende bewusst offen, da der Satz im folgenden Vers weitergeführt wird. »Sag« vermeidet unnötig altertümliches Deutsch; die wörtlichere Bezeichnung »Söhne Israels« und die semantische Schwierigkeit von מוֹשְׁבֹתֵיכֶם werden durch Fußnoten transparent gemacht.
