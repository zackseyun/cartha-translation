  yaml_path: translation/ot/numbers/015/009.yaml
  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: de
  text: 'Dann soll er zusammen mit dem jungen Rind ein Speiseopfer darbringen: drei Zehntel eines Efa Feinmehl, vermengt mit einem halben Hin Öl.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Dann soll er … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen bzw. Darbringen; das einleitende ו wird als Abfolge der Anweisungen mit „Dann“ wiedergegeben.
- source_word: עַל
  choice: zusammen mit
  rationale: עַל bezeichnet hier die Beigabe zum Tieropfer, nicht eine räumliche Lage darauf.
- source_word: בֶּן הַבָּקָר
  choice: dem jungen Rind
  rationale: Wörtlich „Sohn des Rindviehs“; die Wendung bezeichnet hier ein junges Rind als Opfertier. Die Wiedergabe vermeidet eine im Hebräischen nicht ausdrücklich festgelegte Geschlechtsbestimmung.
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im priesterlichen Opferrecht bezeichnet מִנְחָה das aus pflanzlichen Erzeugnissen bestehende Opfer; „Speiseopfer“ ist im Deutschen verständlich und kultisch präzise.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Bezeichnet sorgfältig verarbeitetes feines Mehl, wie es für Opfer verwendet wurde.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: drei Zehntel Efa
  rationale: Wörtlich „drei Zehntel“; im Kontext der Opfermaße ist Efa als Bezugsgröße zu ergänzen.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: vermengt mit … Öl
  rationale: Das passive Partizip mit ב bezeichnet das Vermischen des Mehls mit Öl; „vermengt“ entspricht dem würdigen kultischen Register.
- source_word: חֲצִי הַהִין
  choice: einem halben Hin
  rationale: Das antike Flüssigkeitsmaß wird transliteriert, statt durch eine unsichere moderne Umrechnung ersetzt zu werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe „Speiseopfer“, „Efa“ und „Hin“ bleiben erhalten; die elliptische Maßangabe wird aus dem unmittelbaren Opferkontext verständlich ergänzt.
