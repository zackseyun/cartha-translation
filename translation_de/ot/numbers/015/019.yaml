source:
  edition: WLC
  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: de
  text: Und wenn ihr vom Brot des Landes esst, sollt ihr für Jahwe eine Abgabe darbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Abgabe für Jahwe emporheben“; dies ist kultische Sprache für das Darbringen einer ausgesonderten Gabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: Und wenn ihr … esst
  rationale: Die Konstruktion mit היה und dem Infinitiv mit בְּ bezeichnet hier einen künftigen zeitlichen Umstand; die finite deutsche Wendung gibt ihn natürlich wieder.
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: vom Brot des Landes
  rationale: מִן hat eine partitive beziehungsweise herkunftsbezogene Bedeutung. Die Formulierung bewahrt das konkrete Bild des Brotes und den Bezug auf das verheißene Land.
- source_word: תָּרִימוּ תְרוּמָה
  choice: eine Abgabe darbringen
  rationale: 'Die Verbindung ist kultische Fachsprache: Wörtliches „eine Abgabe emporheben“ wäre im heutigen Deutsch missverständlich; „darbringen“ vermittelt die Übergabe an Gott, „Abgabe“ die ausgesonderte Gabe.'
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: לְ bezeichnet hier die Bestimmung beziehungsweise Widmung der Abgabe. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Eigennamen יהוה; „Jahwe“ bewahrt diesen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von תָּרִימוּ תְרוּמָה
  choice: eine Abgabe darbringen
  alternative: eine Abgabe emporheben
  rationale: Die Übersetzung wahrt den Opfer- und Weihekontext, ohne zwingend eine bestimmte rituelle Hebebewegung vorauszusetzen; die konkrete hebräische Ausdrucksweise wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Abgabe“ ist verständlich und näher an der ausgesonderten תרומה als das allgemeinere „Opfergabe“; die Fußnote bewahrt das konkrete Bild des hebräischen Verbs.
