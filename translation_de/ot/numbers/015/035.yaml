  terminology: „Jahwe“, „Mose“, „Gemeinschaft“ und „Lager“ sind sachgerecht. „Gemeinschaft“ ist für עֵדָה eine natürliche moderne Wahl und wahrt den kollektiven, formellen Bezug. Die Fußnoten erläutern die beiden hebräischen Verstärkungsformen angemessen, ohne den Haupttext zu überladen.
