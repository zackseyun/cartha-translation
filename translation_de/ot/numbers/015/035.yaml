id: NUM.15.35
reference: Numbers 15:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose: „Der Mann muss unbedingt getötet werden.[a] Die ganze Gemeinschaft soll ihn außerhalb des Lagers steinigen.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Der Mann soll ganz gewiss getötet werden.“'
    reason: Die hebräische Verbindung von Infinitivus absolutus und finitem Verb verstärkt das Todesurteil.
  - marker: b
    text: 'Hebräisch: „ihn mit Steinen steinigen“; eine nachdrückliche gerichtliche Wendung für die Hinrichtung durch Steinigung.'
    reason: Die Fußnote macht die im flüssigen deutschen Haupttext nicht nachgebildete hebräische Wiederholung und ihren emphatischen Sinn sichtbar.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sprach
  rationale: Das Narrativpräteritum führt die Handlung weiter; „Da sprach“ gibt die zeitliche Folge in würdigem, natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מוֹת יוּמַת
  choice: muss unbedingt getötet werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. Die Übersetzung bewahrt sowohl die nachdrückliche Verbindlichkeit als auch die passive Form.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der bestimmte Ausdruck verweist auf den zuvor genannten Täter.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: soll ihn … steinigen
  rationale: Das idiomatische deutsche Verb bezeichnet die im Hebräischen nachdrücklich angeordnete Hinrichtung durch Steine, ohne die unnatürliche Wiederholung „mit Steinen steinigen“ im Haupttext.
- source_word: כָּל־הָעֵדָה
  choice: die ganze Gemeinschaft
  rationale: עֵדָה bezeichnet hier die gesamte versammelte Bundesgemeinschaft; „Gemeinschaft“ ist im heutigen Deutsch verständlich und wahrt den korporativen Sinn.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Die Wendung bezeichnet den Ort der Vollstreckung und wird im Deutschen präzise und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm als Gottesnamen. „Jahwe“ bewahrt dessen Charakter als Eigenname, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Verbindlichkeit des Todesurteils
  choice: muss unbedingt getötet werden
  alternative: soll des Todes sterben
  rationale: Die Formulierung wahrt die emphatische und passive Aussage des Hebräischen, ohne archaisch zu klingen oder die Art der rechtlichen Verbindlichkeit weiter zu bestimmen, als es der Text tut.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, klar verständlichem Erzähl- und Rechtsstil. „Da sprach“ hält den biblischen Erzählton, während „muss unbedingt getötet werden“ und „Gemeinschaft“ für heutige Leser natürlich bleiben.
