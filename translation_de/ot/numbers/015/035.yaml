  source_fidelity: Der Text gibt die Abfolge, den Gottesnamen, das emphatisch formulierte Todesurteil, den bestimmten Verweis auf den zuvor genannten Mann, die Vollstreckung durch die gesamte Gemeinschaft und den Ort außerhalb des Lagers zutreffend wieder. „Muss unbedingt getötet werden“ bewahrt die passive Konstruktion und die Verstärkung von מוֹת יוּמָת; „steinigen“ gibt רָגוֹם ... בָּאֲבָנִים idiomatisch wieder.
