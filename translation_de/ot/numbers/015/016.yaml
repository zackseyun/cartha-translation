base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: de
  text: Ein Gesetz und eine Rechtsbestimmung sollen für euch und für den Fremden gelten, der bei euch lebt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den ansässigen Ausländer“. Das hebräische Wort גֵּר bezeichnet einen Nichtisraeliten, der innerhalb der Gemeinschaft Israels lebt und ihrer Ordnung untersteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: Gesetz
  rationale: Im rechtlichen Zusammenhang bezeichnet תּוֹרָה eine verbindliche Weisung. „Gesetz“ ist hier neben מִשְׁפָּט natürlich und präzise.
- source_word: מִשְׁפָּט
  choice: Rechtsbestimmung
  rationale: Das Wort bezeichnet hier eine festgelegte rechtliche Norm. „Rechtsbestimmung“ bewahrt den juristischen Sinn und unterscheidet den Ausdruck von תּוֹרָה.
- source_word: אַחַת / אֶחָד
  choice: ein / eine
  rationale: Die wiederholte Zahl betont die Einheit und Gleichheit des geltenden Maßstabs; die deutsche Formulierung bewahrt diese Wiederholung.
- source_word: יִהְיֶה
  choice: sollen … gelten
  rationale: Das Imperfekt hat in diesem Gesetzestext vorschreibende Kraft. „Sollen … gelten“ gibt diese Normativität in natürlichem modernem Deutsch wieder.
- source_word: גֵּר
  choice: Fremder
  rationale: גֵּר bezeichnet einen Nichtisraeliten, der dauerhaft innerhalb der Gemeinschaft Israels lebt. „Fremder“ ist im Haupttext verständlich; eine Fußnote präzisiert den sozialen Status.
- source_word: הַגָּר
  choice: der … lebt
  rationale: Das Partizip bezeichnet den tatsächlichen Aufenthalt des Fremden. Eine wörtliche Wiederholung wie „der fremd ist“ wäre im Deutschen unnatürlich; „der bei euch lebt“ vermittelt den Sinn klar.
- source_word: אִתְּכֶם
  choice: bei euch
  rationale: Wörtlich bedeutet die Präposition „mit euch“. Im Zusammenhang mit dem ansässigen Fremden gibt „bei euch“ die soziale und räumliche Beziehung idiomatisch wieder.
theological_decisions:
- issue: Rechtliche Gleichstellung Israels und des ansässigen Fremden
  choice: Der gleiche rechtliche Maßstab gilt für Israel und den bei ihnen lebenden Fremden.
  alternative: Die Aussage kann enger auf die unmittelbar vorausgehenden Opferbestimmungen bezogen werden.
  rationale: Die umfassende Formulierung „ein Gesetz und eine Rechtsbestimmung“ bleibt erhalten, ohne ihren Geltungsbereich über den Kontext hinaus ausdrücklich auszudehnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Einheitsformel des Hebräischen wird bewahrt; die Rechtsnorm wird idiomatisch mit „gelten“ ausgedrückt.
