source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וַֽ/יִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּ/י֥וֹם הַ/שַּׁבָּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: de
  text: Als die Israeliten in der Wüste waren, fanden sie einen Mann, der am Sabbattag Holz sammelte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Zweige sammelte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: als … waren
  rationale: Die Form eröffnet den erzählerischen Hintergrund. Die temporale Wiedergabe mit „als“ bildet die Umstandsangabe im Deutschen natürlich ab.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung lautet wörtlich „Söhne Israels“, bezeichnet hier jedoch das Volk als Kollektiv. „Die Israeliten“ ist im modernen Deutschen klar, natürlich und schließt in diesem Zusammenhang das ganze Volk ein.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet das unbewohnte Wüsten- oder Steppengebiet der Wanderungszeit; „Wüste“ ist die geläufige biblische und moderne deutsche Entsprechung.
- source_word: וַיִּמְצְאוּ
  choice: fanden sie
  rationale: Die direkte Wiedergabe von מצא passt zum schlichten Erzählstil; ein stärker interpretierendes „trafen sie auf“ ist nicht erforderlich.
- source_word: אִישׁ
  choice: einen Mann
  rationale: אִישׁ bezeichnet hier ausdrücklich eine männliche Einzelperson.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: der … Holz sammelte
  rationale: Das Partizip beschreibt den Mann während des Sammelns. עֵצִים kann kollektiv „Holz“ oder konkreter „Holzstücke/Zweige“ bezeichnen; „Holz sammelte“ ist idiomatisch und lässt den Umfang offen.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: am Sabbattag
  rationale: Die Zusammensetzung „Sabbattag“ gibt sowohl יוֹם als auch שַׁבָּת knapp und natürlich wieder.
theological_decisions:
- issue: Bezeichnung des Bundesvolkes בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die idiomatische Kollektivbezeichnung vermittelt im Deutschen den Bezug auf das Volk, ohne durch das grammatisch männliche „Söhne“ eine nur männliche Gruppe nahezulegen. Eine theologische Zusatzdeutung wird nicht eingeführt.
- issue: Sabbatterminologie
  choice: am Sabbattag
  alternative: am Sabbat
  rationale: Die Wiedergabe bewahrt das im Hebräischen ausdrücklich vorhandene Wort „Tag“, ohne die rechtliche oder theologische Bedeutung der Handlung über den Vers hinaus zu erläutern.
translation_notes:
  register: Moderner, würdevoller Erzählstil. „Israeliten“ ist für heutige Leser natürlicher als die formale Wendung „Söhne Israels“. Der Relativsatz gibt das hebräische Partizip verständlich wieder. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen lexikalische Alternative er sich bezieht.
