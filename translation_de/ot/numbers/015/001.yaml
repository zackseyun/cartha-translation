lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Sprach“ bewahrt die feierliche, formelhafte Ausdrucksweise der göttlichen Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu Mose“ ist idiomatisches modernes Deutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den folgenden Wortlaut ein. Im Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das redundante „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Redeeinleitungsformel לֵאמֹר idiomatisch wieder und verweist auf den in Vers 2 folgenden Redeinhalt.
