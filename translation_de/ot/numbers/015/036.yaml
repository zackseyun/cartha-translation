  text: וַ/יֹּצִ֨יאוּ אֹת֜/וֹ כָּל הָ/עֵדָ֗ה אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֛/וֹ בָּ/אֲבָנִ֖ים וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Da brachte die ganze Gemeinde ihn aus dem Lager hinaus und steinigte ihn; und er starb, wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels; »Gemeinde« bewahrt den gemeinschaftlichen und bundesbezogenen Sinn, כָּל wird mit »ganze« wiedergegeben.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: brachte … ihn … hinaus
  rationale: Die Hifil-Form von יצא bedeutet »hinausbringen«. Zusammen mit der Ortsangabe ergibt sich im Deutschen natürlich »aus dem Lager hinausbringen«.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die Wendung bezeichnet die Bewegung an einen Ort außerhalb des Lagers. Die deutsche Formulierung gibt Ziel und Bewegung idiomatisch wieder.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: steinigte ihn
  rationale: רגם mit dem Instrument בָּאֲבָנִים bezeichnet die Hinrichtung durch Steinigen. Im Deutschen enthält »steinigen« das Mittel bereits; »mit Steinen steinigen« wäre unnötig schwerfällig.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: מות ist das gewöhnliche Verb für »sterben«; die direkte Wiedergabe vermeidet eine interpretierende Passivform.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: wie Jahwe es Mose geboten hatte
  rationale: כַּאֲשֶׁר drückt Entsprechung aus; das Plusquamperfekt bildet den vorausgegangenen Befehl ab. Das ergänzte »es« ist im Deutschen idiomatisch. יְהוָה wird als Eigenname »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als Gottes persönlichen Bundesnamen. »Jahwe« gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Abfolge des hebräischen Erzählstils bleibt erhalten; das explizite »mit Steinen« wird nicht eigens wiederholt, weil es im deutschen Verb »steinigen« bereits enthalten ist.
