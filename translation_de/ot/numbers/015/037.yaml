lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sprach
  rationale: Die übliche deutsche Erzählformel gibt das hebräische wayyiqtol natürlich und würdig wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle Wiedergabe des Gottesnamens mit HERR entspricht der vorgegebenen Texttradition und dem konsultierten POB-Text.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Direkte und idiomatische Wiedergabe der hebräischen Präpositionalverbindung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel für direkte Rede wird im modernen Deutschen am natürlichsten durch einen Doppelpunkt ausgedrückt; ein zusätzliches „und sagte“ wäre redundant.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: der HERR
  alternative: Jahwe
  rationale: „der HERR“ wahrt die traditionelle deutsche Bibelkonvention und folgt der aktuellen redaktionellen Vorgabe, ohne eine zusätzliche konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Erzählstil. Die knappe Einleitungsformel bereitet die folgende direkte Rede vor.
