  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: de
  text: So soll es für jeden einzelnen Stier oder jeden einzelnen Widder oder für ein Tier vom Kleinvieh gemacht werden, sei es von den Schafen oder von den Ziegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שֶׂה bezeichnet allgemein ein einzelnes Tier vom Kleinvieh; der folgende Ausdruck bestimmt es näher als eines von den Schafen oder von den Ziegen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: So
  rationale: Leitet in natürlichem, zugleich würdigem Deutsch die vorgeschriebene Ausführungsweise ein.
- source_word: יֵעָשֶׂה
  choice: soll es ... gemacht werden
  rationale: Bewahrt die unpersönlich-passive Form und den vorschreibenden Charakter des hebräischen Nifal-Imperfekts.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: für jeden einzelnen Stier
  rationale: Der bestimmte Artikel mit אֶחָד hebt das einzelne Tier hervor; im Deutschen gibt »jeden einzelnen« den distributiven Sinn verständlich wieder.
- source_word: אַיִל
  choice: Widder
  rationale: Übliche und genaue deutsche Bezeichnung für das männliche Schaf.
- source_word: הָאֶחָד
  choice: jeden einzelnen
  rationale: Die wiederholte Einzahl wird ausdrücklich bewahrt, ohne die im Deutschen unnatürliche Formulierung »den einen« zu erzwingen.
- source_word: שֶׂה
  choice: ein Tier vom Kleinvieh
  rationale: שֶׂה bezeichnet hier allgemein ein einzelnes Tier aus Schafen oder Ziegen; die folgende Unterscheidung schließt die engere Wiedergabe »Lamm« aus.
- source_word: בַכְּבָשִׂים
  choice: von den Schafen
  rationale: Die Präposition bezeichnet hier die Zugehörigkeit zur Tiergruppe; »von den Schafen« ist idiomatisches Deutsch.
- source_word: בָעִזִּים
  choice: von den Ziegen
  rationale: Parallel zu »von den Schafen« und als Angabe der Tiergruppe wiedergegeben.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: oder ... oder ..., ebenso ... sei es ... oder
  rationale: Die Alternativen bleiben vollständig erkennbar; die leicht umgestaltete deutsche Syntax vermeidet ein schwerfälliges vierfaches »oder«.
