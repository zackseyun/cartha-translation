    rationale: אִשֶּׁה רֵיחַ נִיחֹחַ bezeichnet das Feueropfer als einen wohlgefälligen Duft für den HERRN. Die Akkusativ-Apposition gibt diese Konstruktion unmittelbarer wieder.
