source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: de
  text: Und wenn sich ein Fremder bei euch aufhält oder jemand, der über eure Generationen hinweg in eurer Mitte lebt, und dem HERRN ein Feueropfer[a], einen wohlgefälligen Duft, darbringt, dann soll er es ebenso tun, wie ihr es tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Opfergabe, die im Feuer dargebracht wird“.'
    reason: Das seltene kultische Wort אִשֶּׁה wird gewöhnlich mit Feuer in Verbindung gebracht; die genaue Wortbildung und damit die treffendste deutsche Wiedergabe sind jedoch nicht völlig sicher.
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit der vorangehenden Regelung als auch die konditionale Einführung des Falls.
- source_word: יָגוּר ... גֵּר
  choice: sich ein Fremder ... aufhält
  rationale: Gibt das Wortspiel aus dem Verb גור und der rechtlich-sozialen Bezeichnung גֵּר in natürlichem Deutsch wieder. „Fremder“ bezeichnet hier einen Nichtisraeliten, der innerhalb der Gemeinschaft lebt, nicht bloß einen unbekannten Menschen.
- source_word: אִתְּכֶם
  choice: bei euch
  rationale: Entspricht der Präposition „mit/bei“ und unterscheidet sich im Deutschen noch erkennbar vom anschließenden „in eurer Mitte“.
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם לְדֹרֹתֵיכֶם
  choice: oder wenn jemand über eure Generationen hinweg in eurer Mitte lebt
  rationale: Gibt die offene Relativkonstruktion inklusiv wieder und bringt die fortdauernde Geltung der Vorschrift idiomatisch zum Ausdruck, ohne den Personenkreis enger zu bestimmen als der hebräische Text.
- source_word: וְעָשָׂה
  choice: darbringt
  rationale: Im Opferkontext bezeichnet עשה das Vollziehen beziehungsweise Darbringen des Opfers; „darbringen“ ist im Deutschen präziser und natürlicher als das wörtliche „machen“.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Die Bezeichnung ist wahrscheinlich von אֵשׁ („Feuer“) abzuleiten und meint eine auf dem Altar verbrannte Opfergabe. „Feueropfer“ wahrt diese kultische Bedeutung und vermeidet die sachlich missverständliche Wiedergabe „Speiseopfer“.
- source_word: רֵיחַ נִיחֹחַ
  choice: als wohlgefälligen Duft
  rationale: Bewahrt das konkrete Duftbild und drückt zugleich die im Opferkontext gemeinte Annahme beziehungsweise Gefälligkeit vor Gott aus.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Verwendet die im deutschen Bibelgebrauch etablierte Wiedergabe des Gottesnamens JHWH; der Dativ fügt sich natürlich zu „darbringen“.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: dann soll er es genauso machen, wie ihr es macht
  rationale: Bewahrt die vergleichende Rechtsformel und ihren verpflichtenden Sinn. Das Pronomen „es“ macht den Rückbezug auf das Opferverfahren im Deutschen verständlich.
theological_decisions:
- issue: Stellung des nichtisraelitischen Teilnehmers am Opferdienst
  choice: Für den hier beschriebenen Opferfall gilt für den Fremden oder sonstigen Bewohner in Israels Mitte dasselbe Verfahren wie für die angesprochenen Israeliten.
  alternative: Die Bestimmung könnte enger ausschließlich auf einen bereits dauerhaft in Israels Bundesgemeinschaft eingegliederten Fremden bezogen werden.
  rationale: Die Formel „genauso ... wie ihr“ betont die Gleichheit der Opferpraxis in diesem konkreten Fall. Die Übersetzung zieht daraus keine weitergehenden Aussagen über Bundeszugehörigkeit oder allgemeinen Rechtsstatus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die Wiederholung von „macht“ im Schlusssatz wurde beibehalten, weil sie die formelhafte Entsprechung des Hebräischen trägt. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die lexikalische Alternative bezieht.
