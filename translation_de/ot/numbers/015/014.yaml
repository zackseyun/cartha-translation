  terminology: „Fremder“ ist als rechtlich-soziale Kategorie hier vertretbar. „Feueropfer“ gibt אִשֶּׁה als etablierter kultischer Fachausdruck wieder; die Fußnote wahrt die lexikalische Unsicherheit. „Der HERR“ entspricht dem üblichen deutschen Bibelgebrauch für JHWH.
