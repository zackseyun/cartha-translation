  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Der Vers behandelt den bei Israel wohnenden Fremden beziehungsweise eine Person in ihrer Mitte und verlangt beim Darbringen eines Feueropfers dieselbe Praxis wie bei den Angesprochenen. Die Wiedergabe „oder wenn jemand“ fügt jedoch im zweiten Glied eine zweite Kondition ein, die im Hebräischen nicht steht; dort folgt auf „ein Fremder“ eine koordinierte Personenbezeichnung. Ferner ist „als wohlgefälligen Duft“ weniger nah an der appositiven Opferformel רֵיחַ נִיחֹחַ als „einen wohlgefälligen Duft“.'
