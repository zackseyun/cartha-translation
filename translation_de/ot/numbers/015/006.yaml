source:
  edition: WLC
  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: de
  text: Oder für einen Widder sollst du ein Speiseopfer aus zwei Zehnteln Feinmehl[a] zubereiten, vermengt mit einem Drittel Hin Öl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwei Zehntel«; nach dem Opfermaßsystem sind zwei Zehntel eines Efa gemeint.'
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Oder
  rationale: Die Partikel verbindet diese Vorschrift mit den vorhergehenden Opferfällen und führt eine weitere Möglichkeit ein.
- source_word: לָ/אַ֨יִל֙
  choice: für einen Widder
  rationale: אַיִל bezeichnet einen Widder; ל markiert hier die Zuordnung des Speiseopfers zum Opfertier.
- source_word: תַּעֲשֶׂ֣ה
  choice: sollst du … zubereiten
  rationale: עשה ist allgemein »tun/machen«, bezeichnet hier aber natürlich die vorgeschriebene Zubereitung des Opfers.
- source_word: מִנְחָ֔ה
  choice: als Speiseopfer
  rationale: Im priesterlichen Opferkontext bezeichnet מִנְחָה das unblutige Opfer aus Getreide beziehungsweise Mehl; »Speiseopfer« ist der etablierte und verständliche deutsche Ausdruck.
- source_word: סֹ֖לֶת
  choice: Feinmehl
  rationale: סֹלֶת bezeichnet fein ausgemahlenes, hochwertiges Mehl als Opferstoff.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: zwei Zehntel Efa
  rationale: Wörtlich steht »zwei Zehntel«; die Maßeinheit Efa ist im Opfermaßsystem mitgemeint und wird zur Verständlichkeit im Text ergänzt, zugleich aber in einer Fußnote als Ergänzung kenntlich gemacht.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: vermengt mit … Öl
  rationale: Das passive Partizip beschreibt das Mehl als mit Öl vermischt; »vermengt« ist in einer Opferanweisung präzise und würdig.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: einem Drittel Hin
  rationale: Die Bruchangabe wird idiomatisch wiedergegeben, während die antike Maßeinheit Hin beibehalten wird.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Anweisungston. Die antiken Maße Efa und Hin bleiben erhalten; die im Hebräischen ausgelassene Bezugsgröße Efa wird zur Verständlichkeit ergänzt und in der Fußnote offengelegt.
