  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּנִּ֥יחוּ אֹת֖/וֹ בַּ/מִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: de
  text: Sie brachten ihn in Gewahrsam, denn es war nicht eindeutig festgelegt, was mit ihm geschehen sollte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: denn es war nicht ausdrücklich bestimmt, was mit ihm geschehen sollte.'
    reason: Lexikalische Alternative für לֹא פֹרַשׁ; „ausdrücklich bestimmt“ betont stärker das fehlende Aussprechen bzw. Spezifizieren der Entscheidung.
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: sie brachten
  rationale: Der Hifil von נוח kann hier das Versetzen bzw. Unterbringen einer Person bezeichnen. „Sie brachten ihn“ ist im Deutschen natürlich und passt zur anschließenden Angabe des Gewahrsams.
- source_word: בַּמִּשְׁמָר
  choice: in Gewahrsam
  rationale: מִשְׁמָר bezeichnet Bewachung, Gewahrsam oder einen Haftort. „In Gewahrsam“ gibt die vorläufige Verwahrung wieder, ohne bereits eine förmliche Gefängnisstrafe vorauszusetzen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die Verwahrung ein. „Denn“ verbindet die beiden Hauptaussagen in einem würdigen, zugleich geläufigen Erzählstil.
- source_word: לֹא פֹרַשׁ
  choice: es war nicht eindeutig festgelegt
  rationale: Die Passivform von פרש bezeichnet hier, dass die erforderliche Entscheidung noch nicht klar ausgesprochen oder bestimmt war. Die Formulierung bewahrt sowohl den passiven Sinn als auch die rechtliche Unklarheit.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: was mit ihm geschehen sollte
  rationale: Die unpersönliche Passivkonstruktion fragt nach der an ihm vorzunehmenden Maßnahme. „Was mit ihm geschehen sollte“ entspricht dem rechtlich-abwägenden Sinn in natürlichem Deutsch.
theological_decisions:
- issue: Art der Unklarheit im rechtlichen Verfahren
  choice: Die vorgeschriebene Maßnahme war noch nicht eindeutig festgelegt.
  alternative: Nur die konkrete Art der Todesstrafe war noch nicht ausdrücklich bestimmt.
  rationale: לֹא פֹרַשׁ nennt allgemein das Fehlen einer klaren Festlegung. Die Übersetzung beschränkt dies nicht ohne ausdrücklichen Textgrund auf die Vollstreckungsart und lässt die verfahrensrechtliche Spannung bestehen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. „Gewahrsam“ wahrt den rechtlichen Kontext, ohne eine endgültige Verurteilung vorwegzunehmen.
