  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: de
  text: Sprich zu den Israeliten und sag ihnen, sie sollen sich von Generation zu Generation Quasten[a] an den Ecken ihrer Gewänder machen und an der Quaste jeder Ecke eine blaue Schnur[b] anbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fransen« (hebräisch צִיצִת).'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort תְּכֵלֶת bezeichnet einen blauen oder blauvioletten Farbstoff beziehungsweise Farbton, der auch für Israels heilige Gegenstände und Stoffe verwendet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet »Söhne Israels«; »Israeliten« gibt die Bezeichnung des Volkes im modernen Deutschen natürlich und präzise wieder.
- source_word: וְעָשׂוּ לָהֶם
  choice: sie sollen sich … machen
  rationale: Die Aufforderung nach »sag ihnen« wird im Deutschen idiomatisch mit »sollen« wiedergegeben; das reflexive »sich« bewahrt לָהֶם.
- source_word: צִיצִת
  choice: Quasten
  rationale: Das Wort bezeichnet herabhängende Fadenbündel am Gewand. »Quasten« ist im heutigen Deutsch konkreter als »Fransen«; die Alternative wird in einer Fußnote genannt.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: an den Ecken ihrer Gewänder
  rationale: כָּנָף bedeutet wörtlich »Flügel«, bezeichnet bei einem Gewand aber dessen Rand beziehungsweise Ecke. Hier ist »Ecken« sachlich und kontextuell passend.
- source_word: לְדֹרֹתָם
  choice: von Generation zu Generation
  rationale: Die Formulierung bringt die fortdauernde Geltung für die aufeinanderfolgenden Generationen natürlich zum Ausdruck.
- source_word: עַל צִיצִת הַכָּנָף
  choice: an der Quaste jeder Ecke
  rationale: 'Der hebräische Singular ist im Zusammenhang distributiv zu verstehen: An jeder Gewandecke befindet sich eine Quaste.'
- source_word: פְּתִיל
  choice: Schnur
  rationale: פְּתִיל bezeichnet einen gedrehten Faden oder eine Schnur; »Schnur« vermittelt die sichtbare, angebrachte Komponente angemessen.
- source_word: תְּכֵלֶת
  choice: blau
  rationale: תְּכֵלֶת bezeichnet einen kostbaren blauen bis blauvioletten Farbstoff beziehungsweise dessen Farbe. »Blau« ist klar und etabliert; die mögliche Farbnuance wird in der Fußnote erläutert.
