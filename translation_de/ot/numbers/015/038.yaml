  source_fidelity: 'Der Entwurf gibt die hebräische Aufforderung vollständig und sachgerecht wieder: die Israeliten, das Anfertigen der Quasten an den Gewandecken für die kommenden Generationen sowie die blaue Schnur an jeder Quaste. Die distributive Wiedergabe von עַל־צִיצִת הַכָּנָף durch „an der Quaste jeder Ecke“ ist im Deutschen verständlich und inhaltlich angemessen.'
