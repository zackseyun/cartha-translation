  terminology: „Quasten“ ist für צִיצִת eine tragfähige, konkrete Übersetzung; die lexikalische Alternative „Fransen“ ist passend belegt. „Ecken ihrer Gewänder“ gibt die idiomatische Bedeutung von כָּנָף im Kleidungskontext wieder. „Blaue Schnur“ trifft פְּתִיל תְּכֵלֶת, ohne die diskutierte genaue Farbnuance festzulegen. Die Fußnote zu תְּכֵלֶת ist sachlich und nicht überbestimmt.
