source:
  edition: WLC
  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: de
  text: 'Für die Versammlung soll eine einzige Satzung gelten: für euch und für den ansässigen Fremden[a]. Sie soll eine bleibende Satzung für alle eure Generationen sein. Wie ihr, so soll der ansässige Fremde vor Jahwe sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich wird das hebräische Wort für den ansässigen Fremden wiederholt: »für den Fremden, der als Fremder ansässig ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: die Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft. »Versammlung« ist im Deutschen verständlich und wahrt den gemeinschaftlich-rechtlichen Kontext, ohne einen ausschließlich kirchlichen Klang einzutragen.
- source_word: חֻקָּה אַחַת
  choice: ein und dieselbe Satzung
  rationale: Die Verbindung bezeichnet eine einzige, für beide Gruppen gleichermaßen geltende verbindliche Regelung. »Ein und dieselbe« macht die betonte Gleichheit idiomatisch deutlich.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: für euch und für den ansässigen Fremden
  rationale: גֵּר bezeichnet hier einen Nichtisraeliten, der dauerhaft unter Israel lebt. »Ansässiger Fremder« bildet diesen rechtlichen und sozialen Status verständlicher ab als das heute missverständliche »Fremdling«. Die Wiederholung der Wurzel גור lässt sich im Deutschen nicht natürlich bewahren, ohne schwerfällig zu werden.
- source_word: חֻקַּת עוֹלָם
  choice: eine bleibende Satzung
  rationale: עוֹלָם bezeichnet in dieser Rechtsformel eine fortdauernde Geltung. »Bleibend« wahrt diese zeitliche Weite, ohne eine philosophische Aussage über absolute Ewigkeit aufzuzwingen.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Die Wendung bezeichnet die fortgesetzte Geltung über die aufeinanderfolgenden Generationen hinweg.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: Wie ihr, so soll auch der ansässige Fremde sein
  rationale: Die ausgewogene Vergleichskonstruktion wird erhalten und hebt die Gleichstellung beider Gruppen in der behandelten Regelung hervor.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet »vor« beziehungsweise »in der Gegenwart von«. »Vor Jahwe« ist knapp, würdig und bewahrt den persönlichen Gottesnamen.
theological_decisions:
- issue: Rechtliche Stellung des ansässigen Fremden in den Kultvorschriften Israels
  choice: Der Vers stellt Israeliten und ansässige Fremde hinsichtlich der hier behandelten Satzung vor Jahwe gleich.
  alternative: Die Aussage könnte als allgemeine, über den unmittelbaren Opferkontext hinausreichende rechtliche Gleichstellung verstanden werden.
  rationale: Der Wortlaut betont dieselbe Satzung für beide Gruppen, steht aber in einem konkreten Zusammenhang mit Opferbestimmungen. Die Übersetzung bewahrt die Gleichstellung, ohne ihren Geltungsbereich über den Textzusammenhang hinaus festzulegen.
- issue: Zeitliche Tragweite von חֻקַּת עוֹלָם
  choice: »bleibende Satzung«
  alternative: »ewige Satzung« oder »immerwährende Satzung«
  rationale: Die hebräische Formel bezeichnet dauerhafte Geltung über die Generationen. »Bleibend« erhält diese Aussage, ohne die mögliche Spannung zwischen dauernder Bundesordnung und philosophischer Endlosigkeit vorweg zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Prägnanz und die parallele Satzstruktur des Hebräischen werden bewahrt. »Ansässiger Fremder« vermeidet das veraltete und heute abwertend wirkende »Fremdling«; der Gottesname wird als »Jahwe« wiedergegeben.
