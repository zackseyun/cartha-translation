  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: de
  text: Und Wein als Trankopfer[a], ein Drittel Hin[b], sollst du als einen wohlgefälligen Duft[c] für Jahwe darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Ausgussopfer“. Gemeint ist ein ausgegossenes flüssiges Opfer, das eine Opfergabe begleitet.'
    reason: lexical_alternative
  - marker: b
    text: Ein Hin war ein antikes Hohlmaß für Flüssigkeiten.
    reason: cultural_note
  - marker: c
    text: 'Oder: „als einen beruhigenden Duft“ oder „als einen angenehmen Duft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַיִן
  choice: Und … Wein
  rationale: יַיִן bezeichnet gewöhnlich Wein; die Konjunktion verbindet die Anweisung mit den vorausgehenden Opferbestimmungen.
- source_word: לַנֶּסֶךְ
  choice: als Trankopfer
  rationale: נֶסֶךְ bezeichnet ein ausgegossenes flüssiges Opfer. „Trankopfer“ ist im Deutschen verständlich und im biblischen Opferwortschatz etabliert.
- source_word: שְׁלִשִׁית הַהִין
  choice: ein Drittel Hin
  rationale: Die antike Maßeinheit wird beibehalten, statt sie durch eine unsichere moderne Mengenangabe zu ersetzen.
- source_word: תַּקְרִיב
  choice: sollst du … darbringen
  rationale: Der Hifil von קרב bedeutet im Opferkontext, eine Gabe darzubringen beziehungsweise vor Gott zu bringen; „darbringen“ ist natürliches, würdevolles Deutsch.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein angenehmer Duft
  rationale: Die feste Opferformel beschreibt den Duft als für Gott wohltuend beziehungsweise annehmbar, ohne die Bildsprache erklärend aufzulösen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung auf Gott; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Gottesname wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutung von רֵיחַ נִיחֹחַ
  choice: ein angenehmer Duft
  alternative: ein beruhigender Duft / ein wohlgefälliger Duft
  rationale: Die Übersetzung bewahrt die konkrete Opfermetaphorik und legt nicht genauer fest, ob נִיחֹחַ primär „beruhigend“, „wohltuend“ oder „wohlgefällig“ bedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung wurde für natürliche Lesbarkeit geglättet; der Gedankenstrich hebt die abschließende Opferformel ab. Alle Fußnotenmarker stehen unmittelbar bei ihrem Bezugsausdruck.
