  text: אֵת֩ כָּל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶׁ֑ה מִן הַ/יּ֞וֹם אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה וָ/הָ֖לְאָה לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/023.yaml
  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: de
  text: alles, was Jahwe euch durch Mose[a] geboten hat, vom Tag an, da Jahwe gebot, und fortan für eure Generationen –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand Moses«; eine hebräische Wendung für die Vermittlung durch Mose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles, was
  rationale: Gibt die umfassende Bedeutung der Verbindung natürlich und präzise wieder.
- source_word: צִוָּה יְהוָה אֲלֵיכֶם
  choice: Jahwe euch geboten hat
  rationale: Das Perfekt bezeichnet die ergangenen, weiterhin maßgeblichen Weisungen; das deutsche Perfekt passt hier idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die Wendung bedeutet wörtlich »durch die Hand Moses«, bezeichnet hier aber die Vermittlung durch Mose.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: von dem Tag an, als
  rationale: Markiert den zeitlichen Ausgangspunkt in natürlichem modernem Deutsch.
- source_word: צִוָּה יְהוָה
  choice: Jahwe Gebote erteilte
  rationale: Bewahrt den Sinn des wiederholten Verbs und vermeidet zugleich die im Deutschen schwer verständliche Ellipse »Jahwe gebot« ohne genanntes Objekt.
- source_word: וָהָלְאָה
  choice: und weiterhin
  rationale: Gibt die Fortsetzung ab dem genannten Zeitpunkt wieder.
- source_word: לְדֹרֹתֵיכֶם
  choice: von Generation zu Generation
  rationale: Bringt die fortdauernde Geltung über die aufeinanderfolgenden Generationen hinweg klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Unausgesprochenes Objekt beim zweiten צִוָּה
  choice: Gebote erteilte
  alternative: gebot
  rationale: Im Hebräischen steht das Verb absolut beziehungsweise mit einem aus dem Zusammenhang ergänzbaren Inhalt. Die Übersetzung macht dies verständlich, ohne ein bestimmtes Einzelgebot festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt entsprechend dem hebräischen Kontext syntaktisch offen und endet mit einem Gedankenstrich, da Vers 23 den in Vers 22 begonnenen Satz fortführt.
