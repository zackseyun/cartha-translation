source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: de
  text: Und der Priester soll vor Jahwe für die Person, die sich verfehlt, indem sie unabsichtlich sündigt, Sühne erwirken, um für sie Sühne zu erwirken; und ihr wird vergeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר / לְכַפֵּר עָלָיו
  choice: Sühne erwirken / für ihn Sühne erwirken
  rationale: Das Piel von כפר bezeichnet im priesterlichen Zusammenhang das wirksame Vollziehen der Sühne. „Sühne erwirken“ ist im Deutschen verständlich und bewahrt sowohl den kultischen Sinn als auch die Wiederholung des Verbs.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Direkte und natürliche Wiedergabe des kultischen Amtsträgers.
- source_word: עַל הַנֶּפֶשׁ
  choice: für den Menschen
  rationale: נֶפֶשׁ bezeichnet hier die betreffende Person, nicht eine vom Körper getrennte „Seele“.
- source_word: הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  choice: der unabsichtlich sündigt, wenn er unabsichtlich sündigt
  rationale: Die Formulierung gibt sowohl das sündige Handeln als auch dessen Unabsichtlichkeit wieder und bewahrt die auffällige Wiederholung der Wurzel שׁגג im Hebräischen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor/in der Gegenwart von“. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: וְנִסְלַח לוֹ
  choice: und ihm wird vergeben
  rationale: Die passive Form von סלח bezeichnet die gewährte Vergebung; die deutsche unpersönliche Passivkonstruktion bewahrt diesen Sinn natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כפר
  choice: Sühne erwirken
  alternative: entsühnen
  rationale: „Sühne erwirken“ wahrt die kultische Aussage, ohne eine bestimmte spätere Theorie darüber festzulegen, auf welche Weise Sühne zustande kommt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Deutschen ungewöhnliche Wiederholung von „unabsichtlich sündigt“ und „Sühne erwirken“ wurde bewusst beibehalten, weil sie die doppelte Ausdrucksweise des hebräischen Textes abbildet.
