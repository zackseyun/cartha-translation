revisions:
- from: Und der Priester soll vor Jahwe für den Menschen, der unabsichtlich sündigt, wenn er unabsichtlich sündigt, Sühne erwirken, um für ihn Sühne zu erwirken; und ihm wird vergeben.
  to: Und der Priester soll vor Jahwe für die Person, die sich verfehlt, indem sie unabsichtlich sündigt, Sühne erwirken, um für sie Sühne zu erwirken; und ihr wird vergeben.
  rationale: Die Revision verbessert die deutsche Idiomatik, ohne den kultischen Begriff כפר abzuschwächen oder die auffällige zweigliedrige Beschreibung der unbeabsichtigten Verfehlung zu tilgen. Die Wiederholung von „Sühne erwirken“ bleibt entsprechend dem hebräischen כפר ... לכפר erhalten. Eine Fußnote ist nicht erforderlich, da keine textkritische oder inhaltlich unauflösbare Mehrdeutigkeit im deutschen Text erklärt werden muss.
