  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: de
  text: Und als Trankopfer sollst du für jedes Lamm[b] ein Viertel Hin Wein bei dem Brandopfer[a] oder für das Schlachtopfer bereiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »auf dem Brandopfer«. Die hebräische Präposition bezeichnet hier wahrscheinlich die Begleitung oder Zuordnung innerhalb des Opferrituals.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »für das eine Lamm«; gemeint ist die vorgeschriebene Menge für jedes einzelne Lamm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: Und … Wein
  rationale: וְ verbindet die Anweisung mit dem vorhergehenden Vers; יַיִן bezeichnet gewöhnlichen Wein. Die deutsche Wortstellung setzt „Und“ an den Anfang und „Wein“ zur Mengenangabe.
- source_word: לַ/נֶּסֶךְ
  choice: als Trankopfer
  rationale: נֶסֶךְ bezeichnet hier das ausgegossene Weinopfer. „Trankopfer“ ist die geläufige und verständliche deutsche Wiedergabe.
- source_word: רְבִיעִית הַ/הִין
  choice: ein Viertel Hin
  rationale: Die Mengenangabe wird genau wiedergegeben; die antike Maßeinheit „Hin“ bleibt erhalten, statt unsicher in ein modernes Volumen umgerechnet zu werden.
- source_word: תַּעֲשֶׂה
  choice: sollst du … bereiten
  rationale: עָשָׂה bedeutet grundsätzlich „tun/machen“, bezeichnet in dieser kultischen Anweisung aber natürlich das Bereiten beziehungsweise Herrichten des Trankopfers.
- source_word: עַל הָ/עֹלָה
  choice: zu dem Brandopfer
  rationale: עַל kann formal „auf/über“ bedeuten, bezeichnet hier jedoch wahrscheinlich die rituelle Zuordnung oder Begleitung. „Zu dem Brandopfer“ ist im Deutschen natürlich und lässt die Zuordnung erkennen.
- source_word: א֣וֹ לַ/זָּבַח
  choice: oder dem Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer und wird so vom Brandopfer unterschieden. „Schlachtopfer“ wahrt diese kultische Unterscheidung genauer als das allgemeinere „Opfer“.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: für jedes Lamm
  rationale: Wörtlich steht „für das eine Lamm“; in der Verfahrensanweisung hat die Formulierung distributive Kraft und gibt die Menge pro einzelnem Lamm an.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt die Art und Zuordnung des Opfers voran und lässt die Mengenangabe klar hervortreten. Die alte Maßeinheit „Hin“ wird beibehalten.
