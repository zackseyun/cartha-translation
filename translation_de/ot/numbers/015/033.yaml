  text: וַ/יַּקְרִ֣יבוּ אֹת֔/וֹ הַ/מֹּצְאִ֥ים אֹת֖/וֹ מְקֹשֵׁ֣שׁ עֵצִ֑ים אֶל מֹשֶׁה֙ וְ/אֶֽל אַהֲרֹ֔ן וְ/אֶ֖ל כָּל הָ/עֵדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/033.yaml
  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: de
  text: Diejenigen, die ihn beim Holzsammeln fanden, brachten ihn zu Mose und Aaron und zur ganzen Gemeinde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beim Sammeln von Stöcken“. Das hebräische Wort עֵצִים kann Holz allgemein oder einzelne Holzstücke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: brachten ihn
  rationale: Die Hifil-Form von קרב bezeichnet hier das Heranbringen beziehungsweise Vorführen des Mannes. „Brachten ihn zu“ gibt dies im Deutschen natürlich wieder, ohne eine zusätzliche räumliche Nuance zu erzwingen.
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: diejenigen, die ihn … fanden
  rationale: Das mit Artikel gebrauchte Partizip bezeichnet substantivisch die Personen, die ihn fanden. „Diejenigen, die“ ist präzise und in diesem rechtlich-erzählenden Zusammenhang angemessen.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: beim Holzsammeln
  rationale: Die Wendung beschreibt, womit der Mann beschäftigt war, als man ihn fand. „Holz“ bewahrt den weiteren Bedeutungsumfang von עֵצִים; die mögliche konkretere Bedeutung „Holzstücke/Zweige“ wird in der Fußnote genannt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: zu Mose und Aaron und zur ganzen Gemeinde
  rationale: „Zu“ entspricht der wiederholten Richtungsangabe אֶל. Das zweite „und“ erhält die feierlich-reihende Struktur des Hebräischen; „Gemeinde“ bezeichnet hier die versammelte Gemeinschaft Israels.
- source_word: עֵדָה
  choice: Gemeinde
  rationale: Im pentateuchischen Zusammenhang bezeichnet עֵדָה die gemeinschaftlich beziehungsweise repräsentativ versammelte Gemeinschaft Israels. „Gemeinde“ ist dafür eine geläufige und würdige deutsche Wiedergabe.
