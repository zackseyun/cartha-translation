base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: de
  text: Sie soll euch als Quaste dienen[a]. Wenn ihr sie seht, sollt ihr an alle Gebote Jahwes denken und sie tun. Ihr sollt nicht eurem Herzen und euren Augen nachgehen[b], denen ihr nachhurt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Franse“. Das hebräische Wort bezeichnet die quastenartige Franse an einer Ecke des Gewandes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eurem Herzen und euren Augen folgen“. Das hebräische Verb kann ein Erkunden, Umherstreifen oder Verfolgen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „denen ihr nachhurt“. Das Hebräische gebraucht das Bild sexueller Untreue für Untreue gegenüber dem Bund; schwächer könnte man übersetzen: „denen ihr untreu nachlauft“ oder „durch die ihr in die Irre geht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: Quaste
  rationale: Das Wort bezeichnet hier den quastenartigen Besatz an den Ecken des Gewandes. „Quaste“ benennt den konkreten Gegenstand im heutigen Deutsch klarer als das allgemeinere „Saum“.
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: Sie soll euch als Quaste dienen
  rationale: Die Wiedergabe erhält die prädikative Konstruktion und gibt den Dativ לָכֶם natürlich mit „euch“ wieder.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: Wenn ihr sie seht
  rationale: Die zeitliche Beziehung zum folgenden Erinnern wird im Deutschen durch einen Wenn-Satz natürlich und sinngenau ausgedrückt.
- source_word: מִצְוֺת
  choice: Gebote
  rationale: „Gebote“ wahrt den rechtlichen und bundesbezogenen Gehalt des hebräischen Ausdrucks.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der offenbarte Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: und sie tun
  rationale: Die direkte Formulierung entspricht dem üblichen Gebrauch von עשה bei Geboten; „befolgen“ wäre bereits stärker deutend.
- source_word: תָתֻרוּ
  choice: nachgehen
  rationale: Das Verb kann das Erkunden, Umherstreifen oder Verfolgen bezeichnen. „Nachgehen“ bewahrt hier den Gedanken des aktiven Verfolgens und klingt im Deutschen natürlich.
- source_word: לְבַבְכֶם
  choice: eurem Herzen
  rationale: „Herz“ bewahrt die biblische Bildsprache; im Hebräischen umfasst es auch Denken, Wollen und Begehren.
- source_word: עֵינֵיכֶם
  choice: euren Augen
  rationale: Die konkrete hebräische Ausdrucksweise bleibt erhalten, ohne sie deutend zu „dem, was eure Augen begehren“ auszubauen.
- source_word: זֹנִים
  choice: nachhurt
  rationale: Die bewusst anstößige Metapher sexueller Untreue wird bewahrt. Das ungewöhnliche Verb bildet zugleich die Verbindung mit אַחֲרֵיהֶם („ihnen nach“) knapp ab.
- source_word: אֲשֶׁר אַתֶּם זֹנִים אַחֲרֵיהֶם
  choice: denen ihr nachhurt
  rationale: Der Relativsatz bleibt auf Herz und Augen bezogen und erhält sowohl das Motiv des Hinterhergehens als auch das Bild ehelicher beziehungsweise bundesbezogener Untreue.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Stärke der Untreue-Metapher in זנה
  choice: die sexuelle Untreue mit „nachhurt“ ausdrücklich wiedergeben
  alternative: „untreu nachlauft“ oder „in die Irre geht“
  rationale: Das Hebräische verwendet absichtlich die starke Bildsprache sexueller Untreue für den Bruch der Bundestreue. Eine bloße Wiedergabe als Irrtum oder Abweichen würde diese Spannung abschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau ist gegenüber dem Hebräischen behutsam gegliedert. Das seltene „nachhurt“ ist bewusst markiert und bewahrt die Härte sowie die Richtungsangabe der hebräischen Metapher; die Fußnote bietet verständlichere Alternativen.
