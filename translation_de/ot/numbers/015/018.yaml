  language: en
  yaml_path: translation/ot/numbers/015/018.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: de
  text: 'Rede zu den Israeliten und sage ihnen: Wenn ihr in das Land kommt, in das ich euch bringe,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ von דבר leitet häufig einen göttlichen Auftrag an Mose ein, der dem Volk auszurichten ist; „Rede“ gibt die direkte Aufforderung würdig und formelnah wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Wörtlich steht „den Söhnen Israels“. Im modernen Deutschen bezeichnet „Israeliten“ in dieser festen Anrede das ganze Bundesvolk natürlich und ohne die mögliche Verengung auf männliche Personen.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sage ihnen
  rationale: Bewahrt die im Hebräischen übliche zweigliedrige Auftragsformel und bleibt im Deutschen verständlich.
- source_word: בְּבֹאֲכֶם
  choice: Wenn ihr … kommt
  rationale: Die Präposition ב mit dem Infinitivus constructus hat hier temporale Bedeutung; „wenn ihr kommt“ erhält zugleich den Bewegungssinn von בוא.
- source_word: אֶל הָאָרֶץ
  choice: in das Land
  rationale: Bei בוא mit אֶל bezeichnet die Wendung den Eintritt in das Land; „in das Land kommen“ ist die natürliche deutsche Formulierung.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: in das ich euch bringe
  rationale: Das Partizip מֵבִיא stellt Gottes gegenwärtig zugesagte beziehungsweise bevorstehende Führung dar. Das richtungsweisende שָׁמָּה wird im Deutschen idiomatisch durch „in das“ aufgenommen, ohne ein redundantes „dorthin“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Formel „Söhne Israels“ wird zugunsten des im Deutschen natürlichen und den gesamten Adressatenkreis einschließenden „Israeliten“ wiedergegeben. Das abschließende Komma zeigt, dass der Satz in Vers 19 weitergeführt wird.
