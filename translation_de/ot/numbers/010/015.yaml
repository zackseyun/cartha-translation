  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י יִשָׂשכָ֑ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: de
  text: Und über der Abteilung[a] des Stammes der Söhne Issachars stand Netanel, der Sohn Zuars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heeresschar“ oder „Heer“; das hebräische Wort צְבָא bezeichnet hier einen geordneten Stammesverband in der Marschordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Und über
  rationale: Die Verbindung aus Konjunktion und Präposition führt die geordnete Aufzählung fort und bezeichnet hier, wer einer Stammesabteilung vorstand.
- source_word: צְבָא
  choice: Abteilung
  rationale: Im Zusammenhang der Marschordnung bezeichnet das Wort einen geordneten Stammesverband. „Abteilung“ ist verständlich und bewahrt den organisatorischen Sinn, ohne die militärische Bedeutung unnötig zu verstärken.
- source_word: מַטֵּה
  choice: Stamm
  rationale: Das Wort bezeichnet hier eindeutig die soziale Einheit des Stammes, nicht einen Stab.
- source_word: בְּנֵי יִשָׂשכָר
  choice: Söhne Issachars
  rationale: Die Formulierung gibt die hebräische Abstammungsbezeichnung genau und in würdigem, verständlichem Deutsch wieder.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Der Personenname wird nach geläufiger deutscher biblischer Schreibweise wiedergegeben.
- source_word: בֶּן צוּעָר
  choice: der Sohn Zuars
  rationale: Die Wendung bewahrt die ausdrückliche Angabe der Abstammung und fügt sich natürlich in den deutschen Satz ein.
