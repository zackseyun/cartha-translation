  terminology: „Abteilung“ und die Fußnotenalternativen „Heeresschar“ bzw. „Heer“ bilden den Bedeutungsspielraum von צָבָא angemessen ab. „Stamm“ für מַטֶּה und „Söhne Issachars“ für בְּנֵי יִשָׂשכָר sind konsistent und quellentreu. Die Namensformen Netanel und Zuar sind im Deutschen gebräuchlich.
