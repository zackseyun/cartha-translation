  source_fidelity: Der Entwurf gibt die hebräische Formel וְעַל־צְבָא מַטֵּה בְּנֵי יִשָׂשכָר sachgerecht wieder. „Und über“ bewahrt die Verknüpfung; „Abteilung“ ist für צָבָא im Kontext der Marschordnung eine vertretbare, nicht übermäßig militarisierende Wahl. „Stamm der Söhne Issachars“, Netanel und „der Sohn Zuars“ entsprechen dem Ausgangstext. Das ergänzende „stand“ macht die im Hebräischen elliptische Führungsangabe idiomatisch verständlich und verändert den Sinn nicht.
