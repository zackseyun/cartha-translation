  terminology: »Heerschar«, »Stamm«, »Söhne Gads«, »Eljasaf« und »Dëuel« sind angemessen. Die Fußnote bewahrt die lexikalischen Alternativen und erläutert die kontextuelle Bedeutung von צָבָא zutreffend.
