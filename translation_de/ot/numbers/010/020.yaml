  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: de
  text: Und über der Heerschar des Stammes der Söhne Gads stand Eljasaf, Sohn Dëuels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Abteilung« beziehungsweise »Heer« statt »Heerschar«. Das hebräische Wort צָבָא hat häufig militärische Obertöne, bezeichnet hier aber die geordnete Marschformation des Stammes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Über
  rationale: עַל bezeichnet in der wiederkehrenden Listenformel die Leitungsstellung über der jeweiligen Stammesformation. Im Deutschen bildet die vorangestellte Präpositionalgruppe zusammen mit »führte … den Befehl« den Zusammenhang natürlich ab; das verbindende וְ wird durch den fortlaufenden Satzanschluss hinreichend wiedergegeben.
- source_word: צְבָא
  choice: Heerschar
  rationale: צָבָא bezeichnet hier die geordnete, zum Aufbruch formierte Stammesgruppe und behält militärische Obertöne. »Heerschar« wahrt diese Färbung, ohne den Verband enger als ein modernes »Heer« zu bestimmen.
- source_word: מַטֵּה
  choice: Stamm
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang den Stamm als Gliederung Israels, nicht den wörtlichen Stab.
- source_word: בְנֵי גָד
  choice: Söhne Gads
  rationale: Die Wiedergabe bewahrt die hebräische Stammesbezeichnung und ist in einem biblisch-genealogischen Zusammenhang verständlich.
- source_word: אֶלְיָסָף
  choice: Eljasaf
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: בֶּן דְּעוּאֵל
  choice: der Sohn Dëuels
  rationale: Die Patronymformel wird unmittelbar wiedergegeben. Das Trema in »Dëuel« signalisiert die getrennte Aussprache der Vokale und unterscheidet den Namen von »Duel«.
