  naturalness: Der Satzanfang ist in der vorliegenden Fassung durch die verschachtelte Genitivgruppe »dem Sohn des Midianiters Reguël« schwer lesbar. Eine Umstellung der Appositionen macht klarer, dass Hobab als Moses Schwiegervater bezeichnet wird, ohne die in der Fußnote erklärte Unsicherheit aufzulösen.
  terminology: »Mose«, »Reguël«, »Jahwe«, »Midianiter« und »Schwiegervater« sind für modernes Standarddeutsch und den gewünschten würdevollen Register angemessen. Die Fußnote zu חֹתֵן bleibt erforderlich; sie wahrt die weitere mögliche Bedeutung als angeheirateter Verwandter.
