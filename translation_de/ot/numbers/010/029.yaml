  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: de
  text: 'Mose sagte zu Hobab, Moses Schwiegervater[b], dem Sohn Reguëls, des Midianiters: »Wir brechen zu dem Ort auf, von dem Jahwe gesagt hat: ›Ich werde ihn euch geben.‹ Komm mit uns, und wir werden dir Gutes tun; denn Jahwe hat Israel Gutes zugesagt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Das hebräische Wort חֹתֵן kann allgemeiner einen angeheirateten Verwandten bezeichnen; daher verstehen manche Hobab hier als Moses Schwager oder als einen anderen angeheirateten Verwandten.
    reason: alternative Deutung der Verwandtschaftsbezeichnung
lexical_decisions:
- source_word: חֹבָב
  choice: Hobab
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: רְעוּאֵל
  choice: Reguël
  rationale: Diese im Deutschen gebräuchliche Form des hebräischen Personennamens wahrt durch das Trema die getrennte Aussprache der Vokale.
- source_word: הַמִּדְיָנִי
  choice: des Midianiters
  rationale: Der Gentilname mit Artikel bezieht sich grammatisch am natürlichsten auf Reguël; die Genitivkonstruktion ist idiomatisches Deutsch.
- source_word: חֹתֵן מֹשֶׁה
  choice: dem Schwiegervater des Mose
  rationale: חֹתֵן bezeichnet häufig den Schwiegervater, kann aber allgemeiner einen angeheirateten Verwandten meinen; die Unschärfe wird in einer Fußnote offengehalten.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: Wir brechen … auf
  rationale: Partizip und ausdrückliches Pronomen bezeichnen hier die unmittelbar bevorstehende beziehungsweise einsetzende Reise; „aufbrechen“ ist natürlich und präzise.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: 'von dem Jahwe gesagt hat: ›Ich werde ihn euch geben.‹'
  rationale: Die Relativkonstruktion und die direkte Zusage bleiben erhalten; „ihn“ nimmt den maskulinen „Ort“ auf, und „euch“ gibt den hebräischen Plural wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner etablierten deutschen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: לְכָה אִתָּנוּ
  choice: Komm mit uns
  rationale: Dies ist die natürliche deutsche Wiedergabe der einladenden Aufforderung.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: und wir werden dir Gutes tun
  rationale: Die Wendung bewahrt den benefaktiven Sinn des Hifil von יטב und zugleich die Verbindung zum nachfolgenden טוֹב.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: Jahwe hat Israel Gutes zugesagt
  rationale: „Gutes zugesagt“ gibt im Kontext einer göttlichen Verheißung idiomatisch wieder, dass Jahwe Gutes über beziehungsweise hinsichtlich Israels geredet hat, ohne den Inhalt näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Verwandtschaftsbezeichnung חֹתֵן מֹשֶׁה
  choice: Schwiegervater des Mose
  alternative: angeheirateter Verwandter des Mose / Schwager des Mose
  rationale: „Schwiegervater“ ist eine verbreitete und lexikalisch gut belegte Bedeutung. Da חֹתֵן weiter gefasst sein kann und die genaue Zuordnung im Erzählzusammenhang umstritten ist, nennt eine Fußnote die offene Alternative.
- issue: Aussage דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: Jahwe hat Israel Gutes zugesagt
  alternative: Jahwe hat Gutes über Israel geredet
  rationale: Der Kontext legt eine wohltuende göttliche Zusage nahe. Die Formulierung vermeidet jedoch eine nähere dogmatische Bestimmung ihres Inhalts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist flüssig gestaltet, während Wiederholung und Bedeutungsbezug von „Gutes tun“ und „Gutes zusagen“ erhalten bleiben. Die traditionelle Namensform „Mose“ und die etablierte deutsche Form „Jahwe“ werden verwendet.
