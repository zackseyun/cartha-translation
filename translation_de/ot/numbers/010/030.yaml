  yaml_path: translation/ot/numbers/010/030.yaml
  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: de
  text: 'Doch er sagte zu ihm: »Ich werde nicht gehen, sondern in mein Land und zu meiner Verwandtschaft gehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אֵלֵךְ
  choice: Ich werde nicht mitgehen
  rationale: Im Dialog bezeichnet הלך hier das Mitziehen mit Mose; »mitgehen« macht den im Deutschen nötigen Bezug natürlich deutlich.
- source_word: כִּי אִם
  choice: sondern
  rationale: Die Wendung stellt nach der Verneinung die beabsichtigte Alternative heraus.
- source_word: מוֹלַדְתִּי
  choice: meine Verwandtschaft
  rationale: מוֹלֶדֶת kann Herkunftsort oder Sippe bezeichnen; parallel zu »mein Land« liegt hier die angestammte Verwandtschaft nahe, ohne den Begriff enger als nötig festzulegen.
- source_word: אֵלֵךְ
  choice: zurückkehren
  rationale: Das Ziel ist sein eigenes Land und seine Verwandtschaft; im Deutschen gibt »zurückkehren« die kontextuell erkennbare Rückbewegung idiomatisch wieder.
