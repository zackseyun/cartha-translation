  source_fidelity: Die Grundbedeutung ist getroffen, einschließlich der Alternative zu einem Mitgehen mit Israel. Allerdings enthält »mitgehen« beim ersten Verb und besonders »zurückkehren« beim zweiten Verb zusätzliche kontextuelle Präzisierungen, die im Hebräischen nicht ausdrücklich stehen. Das Hebräische verwendet beide Male schlicht »gehen«; die Richtung zum eigenen Land und zur eigenen Herkunft/Verwandtschaft ist durch die Zielangaben ausgedrückt.
  naturalness: Die vorgeschlagene Fassung ist flüssig und modernes Standarddeutsch. Die Wiederholung von »gehen« in der Revision ist zwar etwas knapper, aber in direkter Rede natürlich und näher an der rhetorischen Wiederholung des Ausgangstextes.
  terminology: »Verwandtschaft« ist für מוֹלַדְתִּי in diesem Kontext eine vertretbare, natürliche Wiedergabe und entspricht der englischen Audit-Fassung »kindred«. Sie wahrt die mögliche Nuance von Herkunftsverband besser als eine rein geographische Einengung auf »Geburtsort«.
