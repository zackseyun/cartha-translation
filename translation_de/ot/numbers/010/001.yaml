base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר mit narrativem וַ führt einen neuen Redeakt ein; „sprach“ gibt die feierliche göttliche Redeeinleitung im Deutschen angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet den Adressaten der Rede; „zu Mose sprechen“ ist die natürliche deutsche Verbindung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Namensform.
- source_word: לֵאמֹר
  choice: durch Doppelpunkt wiedergegeben
  rationale: Der Infinitiv לֵאמֹר leitet den unmittelbar folgenden Wortlaut ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt diesen als persönlichen Gottesnamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Redeeinleitungsformel wird idiomatisch mit einem Doppelpunkt abgeschlossen, da der Inhalt der Rede im folgenden Vers steht.
