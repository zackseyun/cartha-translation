  text: וּ/בְ/נֻחֹ֖/ה יֹאמַ֑ר שׁוּבָ֣/ה יְהוָ֔ה רִֽבְב֖וֹת אַלְפֵ֥י יִשְׂרָאֵֽל׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: de
  text: 'Und wenn sie zur Ruhe kam, sagte er: »Kehre zurück, Jahwe, zu den Zehntausenden der Tausenden Israels!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht nach »Jahwe«: »Zehntausende der Tausenden Israels«. Die hebräische Formulierung nennt die Richtung nicht ausdrücklich; »zu« ergibt sich aus dem Zusammenhang. Die gehäuften Zahlwörter betonen Israels gewaltige Menge.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: Und wenn sie zur Ruhe kam
  rationale: Die Präposition mit dem Infinitiv von נוח bildet einen temporalen Nebensatz. Das feminine Suffix verweist im Zusammenhang auf die Bundeslade; das Pronomen bewahrt diesen Rückbezug natürlich.
- source_word: יֹאמַר
  choice: sagte er
  rationale: Der Imperfekt steht parallel zu Vers 35 in einer wiederkehrenden Situation. Im Deutschen kann das Präteritum in der Konstruktion mit »wenn« den gewohnheitsmäßigen Vorgang knapp und idiomatisch ausdrücken.
- source_word: שׁוּבָה
  choice: Kehre zurück
  rationale: Der Imperativ von שוב mit paragogischem ה ist eine direkte Bitte an Jahwe. »Kehre zurück« bewahrt die Bewegungsmetaphorik, ohne das Ziel oder die genaue Art der Rückkehr ergänzend festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רִבְבֹות
  choice: Zehntausenden
  rationale: רבבה bezeichnet wörtlich eine Größenordnung von zehntausend und kann zugleich eine sehr große Menge ausdrücken. Die Zahlbezeichnung wahrt das konkrete Bild des Hebräischen.
- source_word: אַלְפֵי
  choice: der Tausenden
  rationale: Der Pluralkonstrukt von אֶלֶף wird im naheliegenden Zahlensinn wiedergegeben; die mögliche Bedeutung »Sippen« wird nicht in den Haupttext eingetragen, da die Verbindung mit רִבְבֹות für eine emphatische Zahlenformel spricht.
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: zu den Zehntausenden der Tausenden Israels
  rationale: Die ungewöhnliche Häufung zweier großer Zahlbegriffe wird formal bewahrt. Dadurch bleiben sowohl der gehobene Klang als auch die mögliche syntaktische Härte des Originals sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift »Jahwe« bewahrt den Eigennamen, während »der HERR« ihn durch einen Titel ersetzen würde.
- issue: Richtung und Ziel von שׁוּבָה
  choice: Kehre zurück, Jahwe, zu den Zehntausenden der Tausenden Israels
  alternative: Kehre zurück, Jahwe, du Zehntausende der Tausenden Israels
  rationale: Die Präposition »zu« ist im Hebräischen nicht ausdrücklich vorhanden, wird aber für die im Kontext naheliegende Anrede als deutsche Ergänzung eingesetzt. Da die knappe Syntax auch anders bezogen werden kann, wird die formale Alternative in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst erhöhter Gebetssprache. Die auffällige Zahlenhäufung des Hebräischen bleibt erhalten, statt zu »den unzähligen Tausenden« geglättet zu werden.
