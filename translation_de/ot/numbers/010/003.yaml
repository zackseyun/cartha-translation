translation:
  language: de
  text: Wenn in beide Trompeten geblasen wird, soll sich die ganze Gemeinde zu dir am Eingang des Zeltes der Begegnung versammeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und sie sollen in sie blasen, und die ganze Gemeinde soll sich zu dir versammeln.“'
    reason: Die Hauptfassung gibt die Verbfolge im Anweisungskontext zeitlich wieder und nennt zur Klarheit die beiden in V. 2 erwähnten Trompeten. Die Fußnote bewahrt die formale Satzfolge sowie die Zielrichtung von אֵלֶיךָ („zu dir“).
lexical_decisions:
- source_word: וְתָקְעוּ בָהֵן
  choice: Wenn beide geblasen werden
  rationale: תקע bezeichnet hier das Blasen der Trompeten. Die zeitlich-bedingte Wiedergabe passt zur Abfolge der Anweisungen. Das feminine Pluralsuffix verweist auf die beiden silbernen Trompeten aus Vers 2; „beide“ macht diesen Bezug im Deutschen eindeutig, ohne ein unbestimmtes handelndes Subjekt einzuführen.
- source_word: וְנוֹעֲדוּ
  choice: soll sich … versammeln
  rationale: Der Nifal von יעד bezeichnet hier das Zusammenkommen aufgrund eines festgelegten Signals. „sich versammeln“ ist im Deutschen natürlich und bewahrt den korporativen Sinn.
- source_word: אֵלֶיךָ
  choice: bei dir
  rationale: Wörtlich steht „zu dir“. Im Kontext bezeichnet die Wendung das Zusammenkommen bei Mose; „bei dir“ gibt die räumliche und persönliche Ausrichtung idiomatisch wieder.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet die Gemeinschaft Israels als versammelte Körperschaft. „die ganze Gemeinde“ ist verständlich, würdevoll und schließt sämtliche Gemeindeglieder ein.
- source_word: פֶּתַח
  choice: am Eingang
  rationale: פֶּתַח bezeichnet den Zugang beziehungsweise die Öffnung. „Eingang“ ist für ein Zelt im modernen Deutschen die natürlichste Bezeichnung.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die feste Wendung bezeichnet das Heiligtumszelt als Ort der von Gott bestimmten Begegnung. „Zelt der Begegnung“ erhält diese Bedeutungsbeziehung und ist im Deutschen geläufig.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die Singularform „die ganze Gemeinde … soll sich versammeln“ entspricht natürlichem Deutsch. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die formale Alternative bezieht.
