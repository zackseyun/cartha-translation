  source_fidelity: 'Die Hauptfassung gibt die zeitlich/prozedurale Funktion von וְתָקְעוּ angemessen wieder und trifft mit „die ganze Gemeinde“, „Eingang“ und „Zelt der Begegnung“ den Sinn gut. Die Orts- und Zielrichtung von אֵלֶיךָ wird jedoch mit „zu dir“ genauer wiedergegeben als mit dem rein lokativen „bei dir“. Die bestehende Fußnote ist zudem im Deutschen nicht tragfähig: „mit ihnen blasen“ bezeichnet nicht idiomatisch das Blasen der Trompeten und verschleiert die Präposition בָּהֵן.'
  naturalness: „Wenn in beide Trompeten geblasen wird“ ist modernes, natürliches Standarddeutsch. Es macht den aus dem unmittelbaren Kontext hervorgehenden Bezug auf die zwei Trompeten explizit, ohne ein nicht genanntes handelndes Subjekt festzulegen. „sich zu dir … versammeln“ ist in diesem Anweisungskontext idiomatisch.
  terminology: „Gemeinde“ für עֵדָה und „Zelt der Begegnung“ für אֹהֶל מוֹעֵד sind konsequent und angemessen. Die ergänzte Bezeichnung „Trompeten“ bezieht sich eindeutig auf die in V. 2 genannten silbernen Trompeten.
