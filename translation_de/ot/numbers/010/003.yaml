  - severity: low
    issue: Die Hauptfassung hat „bei dir“ statt „zu dir“.
    rationale: אֵלֶיךָ bezeichnet unmittelbar die Zielrichtung des Sich-Versammelns. „Zu dir“ bewahrt diese Nuance, bleibt im Deutschen natürlich und stimmt mit der Fußnotenbegründung überein.
