base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: de
  text: Dann brachen die Kehatiter auf und trugen die heiligen Gegenstände[a]. Die Wohnung wurde aufgerichtet, bevor sie ankamen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Träger des Heiligtums“. Gemeint sind hier die heiligen Gegenstände des Heiligtums, die von den Kehatitern getragen wurden, im Unterschied zur Wohnung selbst, die anschließend genannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: Dann brachen ... auf
  rationale: Das Waw führt die Abfolge des Reiseberichts fort; „aufbrechen“ ist im Zusammenhang mit dem Zug des Lagers natürlich und präzise.
- source_word: הַקְּהָתִים
  choice: die Kehatiter
  rationale: Die Form bezeichnet die von Kehat abstammende Sippe; „Kehatiter“ ist die übliche deutsche Bezeichnung.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: und trugen die heiligen Gegenstände
  rationale: Wörtlich steht „Träger des Heiligtums“. Im Kontext sind metonymisch die heiligen Einrichtungsgegenstände gemeint, da die Konstruktion der Wohnung im nächsten Satz eigens genannt wird.
- source_word: הַמִּקְדָּשׁ
  choice: die heiligen Gegenstände
  rationale: מִקְדָּשׁ bezeichnet hier kontextbedingt die zum Heiligtum gehörenden heiligen Gegenstände, nicht den gesamten Bau.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: Die Wohnung wurde aufgerichtet
  rationale: Das hebräische Verb ist aktiv in der 3. Person Plural, doch sein Subjekt ist nicht ausdrücklich genannt. Das deutsche Passiv vermeidet die falsche Zuordnung der Handlung an die Kehatiter; im Kontext richteten die vorausgezogenen Leviten die Wohnung auf.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: „Wohnung“ gibt die Grundbedeutung von מִשְׁכָּן wieder und ist im deutschen Bibelwortschatz für das transportable Heiligtum verständlich; der bestimmte Artikel und der Kontext kennzeichnen den Fachbegriff.
- source_word: עַד בֹּאָם
  choice: bevor sie ankamen
  rationale: Die Wendung besagt im Zusammenhang, dass die Wohnung beim Eintreffen der Kehatiter bereits bereitstand; „bevor sie ankamen“ drückt diese zeitliche Beziehung natürlich aus.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die Übersetzung folgt einer Optimal-Äquivalenz: Sie wahrt die narrative Abfolge und gibt die metonymische Bedeutung von הַמִּקְדָּשׁ verständlich wieder. Das Passiv erhält die im Hebräischen nicht ausdrücklich aufgelöste Subjektfrage, ohne den Kehatitern irrtümlich das Aufrichten der Wohnung zuzuschreiben.'
