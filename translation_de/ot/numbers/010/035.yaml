  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: de
  text: 'Und sooft die Lade aufbrach[a], sagte Mose: »Steh auf[b], Jahwe! Deine Feinde sollen sich zerstreuen, und die dich hassen, sollen vor dir fliehen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und es geschah, als die Lade aufbrach“. Die hebräische Wendung kann formaler so wiedergegeben werden; im Zusammenhang bezeichnet sie wahrscheinlich das, was jedes Mal beim Aufbruch geschah.'
    reason: lexical_alternative
  - marker: b
    text: „Steh auf“ ist ein bildhafter Aufruf an Jahwe, machtvoll einzugreifen; damit ist nicht gemeint, dass Gott zuvor buchstäblich untätig gewesen wäre.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: Und sooft … aufbrach
  rationale: Die Konstruktion mit וַיְהִי und Infinitivus constructus bezeichnet im Zusammenhang einen wiederkehrenden Vorgang. „Sooft“ gibt diesen zeitlichen und iterativen Sinn natürlich wieder.
- source_word: הָאָרֹן
  choice: die Lade
  rationale: Der hebräische Text nennt schlicht „die Lade“. Der Zusatz „des Bundes“ wäre zwar sachlich naheliegend, steht aber nicht ausdrücklich im Vers.
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ bewahrt das anschauliche Bild eines machtvollen Eingreifens Gottes und klingt im modernen Deutschen zugleich natürlich und feierlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וְיָפֻצוּ
  choice: sollen sich zerstreuen
  rationale: Das Imperfekt nach dem Imperativ hat hier wahrscheinlich jussivischen Charakter. „Sollen“ gibt den bittenden beziehungsweise auffordernden Sinn wieder, ohne ihn als bloße Zukunftsaussage festzulegen.
- source_word: אֹיְבֶיךָ
  choice: deine Feinde
  rationale: Direkte und idiomatische Wiedergabe des Plurals mit Suffix der zweiten Person Singular.
- source_word: וְיָנֻסוּ
  choice: sollen … fliehen
  rationale: Wie beim vorangehenden Verb liegt eine jussivische Bitte vor. Die parallele Formulierung mit „sollen“ erhält den poetischen Aufbau.
- source_word: מְשַׂנְאֶיךָ
  choice: die dich hassen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die durch ihre fortdauernde feindselige Haltung gegenüber Jahwe gekennzeichnet sind.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die Wendung bezeichnet hier das Fliehen aus Gottes Gegenwart beziehungsweise vor seinem machtvollen Nahen. „Vor dir“ ist knapp, bildhaft und im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Transliteration bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Befehls קוּמָה an Gott
  choice: Bildhafter Aufruf zu machtvollem Eingreifen
  alternative: Wörtliche Aussage, Gott müsse sich aus körperlicher Ruhe erheben
  rationale: Die militärisch-gebetshafte Sprache bittet Jahwe, wirksam gegen seine Feinde vorzugehen. Die Metapher bleibt im Haupttext erhalten, während die Fußnote ein grob körperliches Missverständnis vermeidet.
- issue: Modalität von וְיָפֻצוּ und וְיָנֻסוּ
  choice: 'jussivische Bitte: „sollen“'
  alternative: 'indikativische Folge: „werden“'
  rationale: Nach dem Imperativ קוּמָה sind die beiden Imperfektformen am ehesten volitiv zu verstehen. Die Übersetzung lässt sie als Bitte beziehungsweise Anrufung erkennen und macht sie nicht zu einer einfachen Vorhersage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, gebetshaftem Klang. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; unnötige kontextuelle Ergänzungen werden vermieden.
