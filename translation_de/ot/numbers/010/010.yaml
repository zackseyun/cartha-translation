source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: de
  text: Am Tag eurer Freude, zu euren festgesetzten Zeiten und an den Anfängen eurer Monate[a] sollt ihr die Trompeten über euren Brandopfern und euren Heilsopfern[b] blasen. Sie sollen euch vor eurem Gott zum Gedenken sein. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an euren Neumondstagen“. Wörtlich: „an den Anfängen eurer Monate“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch übersetzt: „Friedensopfern“ oder „Gemeinschaftsopfern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: eurer Freude
  rationale: Das Substantiv bezeichnet Freude oder Fröhlichkeit. „Freude“ ist im modernen Deutschen natürlich und wahrt die feierliche Aufzählung.
- source_word: מוֹעֲדֵיכֶם
  choice: euren festgesetzten Zeiten
  rationale: מוֹעֵד kann allgemein eine festgesetzte Zeit und im kultischen Zusammenhang besonders einen Festtermin bezeichnen. Die Wiedergabe bewahrt diese Bedeutungsbreite.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: den Anfängen eurer Monate
  rationale: Die Wendung lautet wörtlich „Köpfe/Anfänge eurer Monate“ und bezeichnet die Monatsanfänge beziehungsweise Neumondstage. Die formnahe Übersetzung hält das hebräische Bild sichtbar; die geläufige Deutung steht in der Fußnote.
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: sollt ihr die Trompeten … blasen
  rationale: תקע bezeichnet hier das Blasen beziehungsweise Erschallenlassen der kultischen Trompeten. Die deutsche Verbindung „Trompeten blasen“ ist direkt und idiomatisch.
- source_word: עַל עֹלֹתֵיכֶם
  choice: über euren Brandopfern
  rationale: „Über“ gibt die Präposition עַל wieder und lässt sowohl die räumliche als auch die rituell begleitende Beziehung offen.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: euren Heilsopfern
  rationale: שְׁלָמִים bezeichnet eine Opferart im Bedeutungsfeld von Heil, Wohlergehen, Frieden und Gemeinschaft. „Heilsopfer“ ist ein etablierter deutscher Fachausdruck; das vorangestellte זִבְחֵי ist in der deutschen Bezeichnung „Opfer“ sachlich mitenthalten.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: Das soll euch … zur Erinnerung dienen
  rationale: Die unpersönliche Formulierung gibt die Funktion als kultisches Gedenken wieder, ohne den möglichen Bezug ausschließlich auf Trompetenklang oder Opfer festzulegen.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: vor eurem Gott
  rationale: Die Wendung entspricht unmittelbar dem hebräischen „vor/im Angesicht eures Gottes“ und ist im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. „Jahwe“ wahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי und vermeidet eine stillschweigende Ersetzung.
- issue: Wiedergabe von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer oder Gemeinschaftsopfer
  rationale: Der hebräische Opferbegriff umfasst Vorstellungen von Heil, Wohlergehen, Frieden und gemeinschaftlichem Opfermahl. „Heilsopfer“ lässt diese Breite eher offen; die Alternativen werden dokumentiert.
- issue: Bezug von וְהָיוּ („sie sollen sein“)
  choice: 'unpersönlich: „Das soll … dienen“'
  alternative: „Sie sollen … dienen“, bezogen auf die Trompetenstöße oder die Opfer
  rationale: Der genaue grammatische beziehungsweise sachliche Bezug ist nicht völlig eindeutig. Die deutsche Formulierung erhält die Funktion des Gedenkzeichens, ohne eine umstrittene Referenz festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die Satzstruktur folgt der hebräischen Abfolge, wird jedoch für natürliche deutsche Lesbarkeit leicht geglättet. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
