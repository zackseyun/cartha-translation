base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: de
  text: Dann wurde die Wohnstätte abgebaut, und die Söhne Gerschons und die Söhne Meraris brachen auf, die die Wohnstätte trugen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht erneut „die Wohnstätte“, nicht ausdrücklich „ihre Bestandteile“. Im Zusammenhang des Abbaus ist das Tragen der zerlegten Teile naheliegend.
    reason: cultural_note
lexical_decisions:
- source_word: וְהוּרַד
  choice: wurde abgebaut
  rationale: Der Hofal von ירד bezeichnet hier, dass die aufgerichtete Wohnung heruntergenommen wurde. „Abgebaut“ ist im Zusammenhang des Lageraufbruchs natürlich, ohne die einzelnen Arbeitsschritte näher festzulegen.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet das Heiligtum als Gottes Wohnstätte. „Wohnung“ bewahrt diesen Sinn und ist im Deutschen eine etablierte biblische Bezeichnung; der Kontext macht die besondere heilige Wohnung kenntlich.
- source_word: וְנָסְעוּ
  choice: brachen auf
  rationale: נסע bezeichnet im Reisebericht das Aufbrechen aus dem Lager und den Beginn des Weiterzugs. „Brachen auf“ gibt dies in natürlichem modernem Deutsch wieder.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: die Söhne Gerschons
  rationale: Die wörtliche Sippenbezeichnung des Hebräischen bleibt erhalten und wahrt die Parallelstruktur des Verses.
- source_word: וּבְנֵי מְרָרִי
  choice: die Söhne Meraris
  rationale: Die ausdrückliche Formulierung „Söhne Meraris“ wird entsprechend dem Hebräischen und parallel zu „Söhne Gerschons“ wiedergegeben.
- source_word: נֹשְׂאֵי
  choice: sie trugen
  rationale: Das Partizip beschreibt ihre Tätigkeit beziehungsweise Aufgabe beim Aufbruch. Ein eigener deutscher Hauptsatz ist klar und natürlich.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: Auch beim zweiten Vorkommen wird dasselbe Substantiv beibehalten. Obwohl sachlich die zerlegten Bestandteile gemeint sind, ergänzt der Haupttext nicht ausdrücklich „Teile“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederholung von „die Wohnung“ sowie die Sippenbezeichnungen „Söhne Gerschons“ und „Söhne Meraris“ bleiben erhalten; die sachlich naheliegenden „Bestandteile“ werden nur in der Fußnote erläutert.
