  terminology: Die Namen Gerschon und Merari sowie die wörtlichen Sippenbezeichnungen „Söhne ...“ sind korrekt. „Wohnstätte“ wird an beiden Stellen gleich wiedergegeben und erhält die hebräische Wiederholung. Die Fußnote erläutert lediglich die kontextuell naheliegende Zerlegung, ohne „Bestandteile“ in den Haupttext einzutragen.
