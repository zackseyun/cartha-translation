base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: de
  text: 'Und es geschah im zweiten Jahr, im zweiten Monat, am zwanzigsten Tag des Monats: Da stieg[a] die Wolke über der Stiftshütte des Zeugnisses[b] auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »erhob sich«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wohnstätte des Zeugnisses«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische Erzählform führt das nächste Ereignis in der Abfolge ein; die Wiedergabe ist würdig, verständlich und bewahrt den erzählerischen Anschluss.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: im zweiten Jahr
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: im zweiten Monat
  rationale: Die Ordnungszahl und die zeitliche Einordnung werden eng am Hebräischen wiedergegeben.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: am zwanzigsten Tag des Monats
  rationale: Der hebräische Ausdruck lautet wörtlich etwa »am Zwanzigsten im Monat«; »Tag« wird zur eindeutigen, natürlichen deutschen Datumsangabe ergänzt.
- source_word: נַעֲלָה
  choice: erhob sich
  rationale: Das Nifal von עלה bezeichnet hier die Aufwärtsbewegung der Wolke. »Erhob sich« ist im Deutschen natürlich und lässt offen, ob vor allem das Aufsteigen oder das Sich-Entfernen gemeint ist.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Der bestimmte Ausdruck verweist auf die bereits bekannte Wolke, die Israel in der Wüste führt.
- source_word: מֵעַל
  choice: von über
  rationale: Die Präposition bezeichnet eine Bewegung weg von einer Position oberhalb der Wohnung. Die etwas markierte, aber verständliche Formulierung bewahrt diese räumliche Präzision.
- source_word: מִשְׁכַּן
  choice: Wohnung
  rationale: מִשְׁכַּן bezeichnet wörtlich die Wohnstätte beziehungsweise Wohnung Gottes. Diese Wiedergabe wahrt die Wortbedeutung und die Verbindung zum Motiv des Wohnens Gottes; die traditionelle Bezeichnung »Stiftshütte« wird in der Fußnote genannt.
- source_word: הָעֵדֻת
  choice: des Zeugnisses
  rationale: עֵדוּת bezeichnet im Heiligtumskontext das Zeugnis, besonders die steinernen Tafeln als Bundeszeugnis. »Zeugnis« bleibt lexikalisch nah und vermeidet die interpretierende Ersetzung durch »Bund« oder »Bundesurkunde«.
theological_decisions:
- issue: Bezeichnung des Heiligtums מִשְׁכַּן הָעֵדֻת
  choice: Wohnung des Zeugnisses
  alternative: Stiftshütte des Zeugnisses; Zeltwohnung des Zeugnisses; Wohnung der Bundesurkunde
  rationale: »Wohnung« entspricht מִשְׁכַּן genauer als »Zelt«, während »des Zeugnisses« die kultische und bundestheologische Bedeutung von עֵדוּת bewahrt, ohne sie auf eine einzige erklärende Umschreibung festzulegen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewusst bibelnaher Erzählführung. Der Doppelpunkt gliedert die ausführliche Datumsangabe vom eigentlichen Ereignis. »Von über« ist idiomatisch etwas markiert, gibt jedoch die räumliche Aussage von מֵעַל präziser wieder als bloßes »von«.
