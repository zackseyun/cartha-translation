  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: de
  text: Dann brach das Banner des Lagers Ruben nach seinen Abteilungen[a] auf; an der Spitze seines Heeres stand Elizur, der Sohn Schedeurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach seinen Heeresverbänden“; das hebräische Wort bezeichnet geordnete Verbände und kann einen militärischen Klang haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Dann brach ... auf
  rationale: Das Verb נסע bezeichnet hier das Aufbrechen zur nächsten Marschetappe; „Dann“ gibt die fortschreitende Erzählfolge des waw wieder.
- source_word: דֶּגֶל
  choice: Banner
  rationale: דֶּגֶל bezeichnet das Kennzeichen, unter dem der Stammesverband marschierte. „Banner“ bewahrt das konkrete Bild und ist im heutigen Deutsch verständlich.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: das Lager Rubens
  rationale: Die hebräische Genitivverbindung wird knapp und natürlich wiedergegeben.
- source_word: לְצִבְאֹתָם
  choice: nach seinen Heeresverbänden
  rationale: צָבָא bezeichnet hier geordnete, marschierende Verbände. Der Plural mit Suffix bezieht sich sinngemäß auf das Lager als Kollektiv; „nach“ gibt die geordnete Gliederung wieder.
- source_word: וְעַל צְבָאוֹ
  choice: über seinem Heer stand
  rationale: עַל drückt die Führungsstellung aus. Die Einzahl von צָבָא und das maskuline Suffix werden bewahrt; „stand“ ergänzt im Deutschen natürlich die im Hebräischen nominal formulierte Aussage.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Der Personenname wird nach üblicher deutscher Bibelnamenkonvention transliteriert.
- source_word: בֶּן שְׁדֵיאוּר
  choice: der Sohn Schedëurs
  rationale: Die patronymische Angabe wird idiomatisch deutsch wiedergegeben; der Name wird transliteriert.
