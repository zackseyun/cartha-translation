    rationale: Die hebräische Leitungsrelation עַל kann im Deutschen idiomatisch mit „an der Spitze ... stand“ wiedergegeben werden, ohne die Aussage zu verändern.
  - severity: low
    issue: „Heeresverbänden“ als Haupttext ist stärker militarisierend als erforderlich
    rationale: צבא bezeichnet hier geordnete Einheiten der Marschordnung. „Abteilungen“ ist im Haupttext klarer; die militärische Konnotation wird in der Fußnote transparent bewahrt.
