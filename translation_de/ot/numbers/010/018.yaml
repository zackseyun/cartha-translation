  source_fidelity: Der Vers gibt die Aufbruchsfolge, das Banner/Lager Rubens, die Gliederung nach צְבָאֹת und Elizurs Leitungsstellung über צְבָאוֹ zutreffend wieder. Die militärisch-organisatorische Bedeutung von צבא sollte jedoch in der Hauptübersetzung nicht unnötig stark zu einem eigentlichen „Heer“ verengt werden; die Fußnote kann diese mögliche Nuance festhalten.
  naturalness: „Über seinem Heer stand Elizur“ ist zwar verständlich, klingt im modernen Standarddeutsch aber steif und ist als Führungsbezeichnung weniger idiomatisch. „An der Spitze seines Heeres stand“ gibt die Konstruktion עַל ... natürlich wieder. Die Schreibung „Schedëur“ ist im Deutschen ungewöhnlich.
  terminology: „Ruben“, „Elizur“ und „Schedeur“ entsprechen der geläufigen deutschen Bibelnamenschreibung. „Abteilungen“ ist für die geordnete Marschgliederung angemessen; „Heeresverbände“ bleibt als lexikalische Alternative in der Anmerkung erhalten.
