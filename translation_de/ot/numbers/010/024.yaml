  text: Und über der Heeresabteilung[a] des Stammes der Söhne Benjamins stand Abidan, der Sohn Gideonis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Heer« oder »Abteilung«. Das hebräische Wort bezeichnet einen geordneten, militärisch gegliederten Verband.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Über … befehligte
  rationale: Die Verbindung setzt die Aufzählung der Marschordnung fort und bezeichnet Abidans Leitungsfunktion. Im Deutschen gibt die verbale Formulierung den elliptischen hebräischen Nominalsatz natürlich wieder.
- source_word: צְבָא
  choice: Heeresabteilung
  rationale: Das Wort bezeichnet hier den geordneten, militärisch gegliederten Stammesverband beim Aufbruch, nicht notwendig ein Heer im engeren Sinn.
- source_word: מַטֵּה
  choice: Stamm
  rationale: In diesem Zusammenhang bezeichnet das Wort die stammesmäßige Einheit, nicht den konkreten Gegenstand »Stab«.
- source_word: בְּנֵי בִנְיָמִן
  choice: Söhne Benjamins
  rationale: Die formale genealogische Wendung des Hebräischen bleibt erhalten und passt zur wiederkehrenden Formel des Abschnitts.
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: בֶּן גִּדְעוֹנִי
  choice: der Sohn Gideonis
  rationale: Natürliche deutsche Wiedergabe der patronymischen Bezeichnung; die herkömmliche Genitivform wahrt den Eigennamen Gideoni.
