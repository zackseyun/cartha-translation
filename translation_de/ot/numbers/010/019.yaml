  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: de
  text: Und über der Heeresabteilung des Stammes der Söhne Simeons stand Schelumiel, der Sohn Zurischaddais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abteilung“ oder „Heer“ statt „Heeresabteilung“; das hebräische Wort צְבָא bezeichnet hier das organisierte Stammesaufgebot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Über … war … eingesetzt
  rationale: עַל bezeichnet in diesem Zusammenhang den Anführer, der einer geordneten Stammesabteilung vorsteht. Die deutsche Satzform gibt diese Leitungsfunktion natürlich wieder; das verbindende וְ wird im fortlaufenden Reihungszusammenhang nicht eigens mit „und“ abgebildet.
- source_word: צְבָא
  choice: Heeresabteilung
  rationale: Das Wort bezeichnet hier das organisierte Aufgebot des Stammes in der Marschordnung. „Heeresabteilung“ bewahrt den militärisch-organisatorischen Sinn, ohne einen gerade stattfindenden Kampf vorauszusetzen.
- source_word: מַטֵּה
  choice: Stamm
  rationale: Im Zusammenhang der Lager- und Marschordnung bezeichnet מַטֵּה eindeutig einen israelitischen Stamm.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: Söhne Simeons
  rationale: Die wörtliche Stammesbezeichnung bleibt erhalten und ist im Deutschen verständlich.
- source_word: שְׁלֻמִיאֵל
  choice: Schelumiël
  rationale: Der Personenname wird nach geläufiger deutscher Bibelorthografie transliteriert; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: בֶּן
  choice: Sohn
  rationale: Bei einem unmittelbaren Patronym ist „Sohn“ die klare und genaue Wiedergabe.
- source_word: צוּרִי שַׁדָּי
  choice: Zurischaddai
  rationale: Der Personenname wird als ein zusammengehöriger Name in geläufiger deutscher Form transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „war … eingesetzt“ verdeutlicht die im Hebräischen knappe Leitungsrelation, während „Heeresabteilung“ den organisatorisch-militärischen Kontext der Marschordnung wahrt.
