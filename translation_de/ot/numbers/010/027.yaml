  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: de
  text: Und über das Heer des Stammes der Söhne Naftalis stand Ahira, der Sohn Enans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Heeresabteilung“, „der Heeresverband“ oder „die Abteilung“. Das hebräische Wort צְבָא bezeichnet hier den geordneten Stammesverband in der Lager- und Marschordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Über
  rationale: Die Präposition bezeichnet in der wiederkehrenden Leitungsformel die Stellung eines Anführers über einem geordneten Stammesverband. Das einleitende וְ wird im Deutschen nicht eigens mit „und“ wiedergegeben, da die Satzverknüpfung im fortlaufenden Listenstil auch ohne Konjunktion natürlich erkennbar bleibt.
- source_word: צְבָא
  choice: Heer
  rationale: Das Wort bezeichnet hier den geordneten, marschierenden Stammesverband. „Heer“ bewahrt die militärisch-organisatorische Bedeutung und entspricht dem Sprachgebrauch im unmittelbaren Kontext.
- source_word: מַטֵּה
  choice: Stamm
  rationale: In diesem Zusammenhang bezeichnet מַטֵּה eindeutig eine israelitische Stammeseinheit, nicht den konkreten Gegenstand „Stab“.
- source_word: בְּנֵי נַפְתָּלִי
  choice: der Söhne Naftalis
  rationale: Die ausdrückliche hebräische Verwandtschaftsformel „Söhne Naftalis“ bleibt erhalten; sie bezeichnet hier seine stammesmäßigen Nachkommen.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Der Personenname wird nach gebräuchlicher deutscher biblischer Namensform transliteriert.
- source_word: בֶּן עֵינָן
  choice: der Sohn Enans
  rationale: Die hebräische Vatersnamenformel wird klar und idiomatisch wiedergegeben.
