id: NUM.10.33
reference: Numbers 10:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: de
  text: So brachen sie vom Berg Jahwes auf und zogen drei Tagesreisen weit[a]. Die Lade des Bundes Jahwes zog drei Tagesreisen weit vor ihnen her, um für sie einen Ruheplatz zu suchen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen Weg von drei Tagen«; ebenso beim zweiten Vorkommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um für sie einen Ruheplatz zu erkunden« beziehungsweise »ausfindig zu machen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: So brachen sie … auf und zogen
  rationale: נסע bezeichnet im Kontext der Wüstenwanderung das Aufbrechen des Lagers und den anschließenden Zug. Die zweigliedrige deutsche Wendung gibt beides natürlich wieder.
- source_word: מֵהַר יְהוָה
  choice: vom Berg Jahwes
  rationale: הַר bedeutet hier „Berg“; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: drei Tagesreisen weit
  rationale: Die Verbindung bezeichnet eine nach Reisetagen bemessene Wegstrecke. „Drei Tagesreisen weit“ wahrt diesen räumlichen Akzent und klingt im Deutschen natürlich.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Wiedergabe bildet die hebräische Status-constructus-Kette eng ab, ohne sie zu einer theologischen Paraphrase auszubauen.
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: zog … vor ihnen her
  rationale: Das Partizip beschreibt die begleitende, fortdauernde Bewegung der Lade. „Zog vor ihnen her“ ist idiomatisch und bewahrt die räumliche Aussage.
- source_word: לָתוּר
  choice: zu suchen
  rationale: תור kann „erkunden“, „auskundschaften“ oder „suchen“ bedeuten. Da hier ein geeigneter Rastort das Ziel ist, passt „suchen“ ohne unnötig militärischen Beiklang.
- source_word: מְנוּחָה
  choice: einen Ruheplatz
  rationale: Im Reisekontext ist ein konkreter Ort zum Ruhen beziehungsweise Lagern gemeint, nicht nur abstrakte Ruhe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen des Gottes Israels. „Jahwe“ bewahrt ihn als Namen und verwendet die im Deutschen übliche Form.
- issue: Vorausziehen der Bundeslade
  choice: räumlich und funktional formuliert, ohne zusätzliche Deutung
  alternative: die Lade als unmittelbar handelnde göttliche Gegenwart ausdrücklich deuten
  rationale: Der Vers schreibt der Lade das Vorausziehen und Suchen zu, erklärt aber nicht näher, wie dies theologisch zu verstehen ist. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lade“ und „Bund“ bewahren die etablierte biblische Begrifflichkeit; Satzbau und Verben bleiben zugleich allgemein verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
