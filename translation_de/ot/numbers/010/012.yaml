  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: de
  text: Da brachen die Söhne Israels[a] in einzelnen Etappen aus der Wüste Sinai auf, und die Wolke ließ sich in der Wüste Paran nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Hebräisch: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Da brachen … auf
  rationale: נסע bezeichnet in den Wanderungsberichten häufig das Abbrechen des Lagers und den Aufbruch. „aufbrechen“ gibt diesen konkreten Reisesinn in natürlichem Deutsch wieder; „da“ führt die hebräische Erzählfolge fort.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bewahrt die ausdrücklich männliche familiäre Formulierung des Hebräischen. Das idiomatischere „die Israeliten“ wird in einer Fußnote genannt.
- source_word: לְמַסְעֵיהֶם
  choice: in einzelnen Etappen
  rationale: Das von מסע abgeleitete Substantiv im Plural bezeichnet die aufeinanderfolgenden Zug- oder Reisestationen. „in einzelnen Etappen“ gibt den verteilenden Sinn verständlich und idiomatisch wieder.
- source_word: מִמִּדְבַּר סִינָי
  choice: aus der Wüste Sinai
  rationale: מִדְבָּר bezeichnet unbebautes, dünn besiedeltes Wildnis- oder Wüstenland. „Wüste“ ist im Deutschen für diese geografische Bezeichnung geläufig, ohne den Text unnötig auszudeuten.
- source_word: וַיִּשְׁכֹּן
  choice: ließ sich … nieder
  rationale: שׁכן bedeutet sich niederlassen oder wohnen. Bei der Wolke beschreibt es hier, dass sie an einem Ort zur Ruhe kam; „ließ sich nieder“ ist anschaulich und wahrt den Bezug zum Verbstamm besser als ein bloßes „blieb stehen“.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Der bestimmte Artikel verweist auf die aus dem Zusammenhang bekannte Wolke der göttlichen Führung; eine schlichte, bestimmte Wiedergabe ist angemessen.
- source_word: בְּמִדְבַּר פָּארָן
  choice: in der Wüste Paran
  rationale: Die Formulierung gibt die Ortsangabe direkt wieder und behält den Eigennamen Paran bei.
theological_decisions:
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Obwohl keine Lehrfrage im engeren Sinn betroffen ist, bewahrt der Haupttext die ausdrücklich familiäre und männliche hebräische Wendung. Die idiomatische kollektive Lesart wird als Alternative in der Fußnote angeboten, ohne die Aussage stillschweigend zu verallgemeinern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der fortlaufenden Erzählung, vermeidet jedoch unnötig altertümliche Formen. „In einzelnen Etappen“ verdeutlicht den Plural des hebräischen Reisewortes, ohne zusätzliche historische Einzelheiten einzutragen.
