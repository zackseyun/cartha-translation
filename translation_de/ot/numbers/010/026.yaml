  text: וְ/עַל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: de
  text: Über das Aufgebot des Stammes der Söhne Aschers stand Pagiël, der Sohn Ochrans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Heeresabteilung“, „die Schar“ oder „das Heer“; das hebräische Wort bezeichnet hier einen geordneten Verband innerhalb der Lager- und Marschordnung Israels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Über … stand
  rationale: Die Präposition bezeichnet hier die Leitungsstellung über dem Stammesaufgebot; die deutsche Satzstellung gibt die fortlaufende Listenstruktur natürlich wieder.
- source_word: צְבָא
  choice: Aufgebot
  rationale: Im Zusammenhang der Lager- und Marschordnung bezeichnet das Wort einen geordneten Stammesverband. „Aufgebot“ wahrt den militärisch-organisatorischen Klang, ohne zwingend ein ganzes Heer zu bezeichnen.
- source_word: מַטֵּה
  choice: Stamm
  rationale: Das Wort bezeichnet hier eindeutig die israelitische Stammeseinheit, nicht den wörtlichen Stab.
- source_word: בְּנֵי אָשֵׁר
  choice: Söhne Aschers
  rationale: Die Wendung wird nah am hebräischen Wortlaut als Stammesbezeichnung wiedergegeben.
- source_word: פַּגְעִיאֵל
  choice: Pagiël
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: בֶּן עָכְרָן
  choice: der Sohn Ochrans
  rationale: Die hebräische Patronymik wird im Deutschen natürlich mit „Sohn“ und dem Namen im Genitiv wiedergegeben.
theological_decisions: []
