source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: de
  text: Und über dem Aufgebot des Stammes der Söhne Manasses stand Gamaliel, der Sohn Pedazurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צְבָא kann auch mit »Heer«, »Truppe« oder »Abteilung« wiedergegeben werden; hier bezeichnet es das geordnete Aufgebot des Stammes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Über ... war
  rationale: Die wiederkehrende Lager- und Marschordnungsformel bezeichnet den Mann, der einer Stammeseinheit vorstand. Die deutsche Satzstellung gibt diese Leitungsfunktion natürlich wieder.
- source_word: צְבָא
  choice: Heerschar
  rationale: Das Wort bezeichnet hier die geordnete, marschierende Stammeseinheit und kann militärisch gefärbt sein, ohne ausschließlich eine kämpfende Armee zu meinen.
- source_word: מַטֵּה
  choice: Stamm
  rationale: In diesem Zusammenhang bezeichnet מַטֵּה den Stamm als soziale und organisatorische Einheit.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: die Söhne Manasses
  rationale: Die formale Stammesbezeichnung des Hebräischen wird bewahrt; sie bezeichnet die von Manasse abstammende Linie.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die genealogische Verbindung wird im Deutschen klar und idiomatisch ausgedrückt.
- source_word: פְּדָה צוּר
  choice: Pedazur
  rationale: Die im Ausgangstext graphisch aus zwei Bestandteilen bestehende Form ist ein einziger Personenname und wird nach gebräuchlicher deutscher Bibeltradition als Pedazur wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe wiederkehrende Leitungsformel des hebräischen Textes bleibt erkennbar; »Heerschar« bewahrt dessen organisatorisch-militärische Färbung.
