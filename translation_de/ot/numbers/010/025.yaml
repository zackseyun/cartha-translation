  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: de
  text: Dann brach das Banner[a] des Lagers der Söhne Dans auf, als Nachhut[b] aller Lager nach ihren Abteilungen[c]. Anführer seines Heeres war Achieser, der Sohn Ammischaddais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feldzeichen“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „sammelnd“ oder „das Ende bildend“ bedeuten; gemeint ist die Formation, die am Schluss des Zuges marschierte.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch „Heere“ oder „Verbände“ bedeuten; hier bezeichnet es die geordneten Stammesabteilungen beim Marsch.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Dann brach ... auf
  rationale: Das וַו mit der Verbform führt die Marschfolge weiter; „Dann“ und „brach ... auf“ geben die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: דֶּגֶל
  choice: Banner
  rationale: Das Wort bezeichnet hier das Feldzeichen, unter dem ein Stammeslager marschiert. „Banner“ ist modern und verständlich; „Feldzeichen“ ist eine mögliche stärker militärische Alternative.
- source_word: מַחֲנֵה בְנֵי דָן
  choice: des Lagers der Söhne Dans
  rationale: Die hebräische Stammesformel und die Genitivbeziehungen werden eng am Ausgangstext wiedergegeben.
- source_word: מְאַסֵּף לְכָל הַמַּחֲנֹת
  choice: Es bildete die Nachhut für alle Lager
  rationale: Das Partizip bezeichnet im Marschzusammenhang die am Ende ziehende Formation, die den rückwärtigen Abschluss sichert. Die Formulierung gibt diese Funktion klar wieder.
- source_word: לְצִבְאֹתָם
  choice: geordnet nach ihren Heerscharen
  rationale: צָבָא bezeichnet hier die organisierten Verbände Israels. „Heerscharen“ bewahrt den militärisch-organisatorischen Klang, ohne den Begriff auf eine moderne Armee einzuengen.
- source_word: וְעַל צְבָאוֹ
  choice: Über seinem Heer stand
  rationale: Die Präposition עַל bezeichnet die Führungsstellung über dem zu Dan gehörenden Heer beziehungsweise Verband; die Formulierung bewahrt die hebräische Struktur.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiëser, der Sohn Ammischaddais
  rationale: Die Namen werden in geläufiger deutscher Bibelschreibung wiedergegeben; die hebräische Patronymformel bleibt erhalten.
