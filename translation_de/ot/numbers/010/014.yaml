  text: וַ/יִּסַּ֞ע דֶּ֣גֶל מַחֲנֵ֧ה בְנֵֽי יְהוּדָ֛ה בָּ/רִאשֹׁנָ֖ה לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: de
  text: Als Erstes brach das Feldzeichen[a] des Lagers der Söhne Judas nach ihren Heeresverbänden[b] auf; an der Spitze seines Heeresverbands stand Nachschon, der Sohn Amminadabs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Banner«. Das hebräische Wort bezeichnet das Stammeszeichen, unter dem die Lagereinheit marschierte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »nach ihren Abteilungen/Heerscharen«. Im Hebräischen steht ein militärisch-organisatorischer Ausdruck für die geordneten Einheiten des Stammes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: brach … auf
  rationale: Das Verb נסע bezeichnet im Zusammenhang der Wüstenwanderung das Aufbrechen vom Lager und den Beginn des Weitermarsches. „Aufbrechen“ ist im Deutschen natürlich und präzise.
- source_word: דֶּגֶל
  choice: Feldzeichen
  rationale: דֶּגֶל bezeichnet hier das Stammeszeichen und zugleich die darunter geordnete Lagereinheit. „Feldzeichen“ bewahrt den militärisch-organisatorischen Charakter; die mögliche Wiedergabe „Banner“ wird in der Fußnote genannt.
- source_word: מַחֲנֵה
  choice: Lager
  rationale: In der Verbindung דֶּגֶל מַחֲנֵה bezeichnet das Wort das geordnete Lager, das unter einem Feldzeichen marschiert.
- source_word: בְנֵי יְהוּדָה
  choice: Söhne Judas
  rationale: Die formale Stammesbezeichnung des Hebräischen bleibt erhalten, statt sie zu „Volk“ oder „Nachkommen“ zu verallgemeinern.
- source_word: בָּרִאשֹׁנָה
  choice: als Erster
  rationale: Die adverbiale Form bezeichnet die erste Stelle in der Marschordnung. Die Formulierung stimmt grammatisch mit „das Feldzeichen“ überein.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צְבָאוֹת bezeichnet die geordneten, militärisch strukturierten Einheiten des Stammes. „Heeresverbände“ gibt sowohl Organisation als auch militärische Färbung wieder, ohne einzelne Größen wie Kompanien vorauszusetzen.
- source_word: וְעַל צְבָאוֹ
  choice: und über seinem Heeresverband stand
  rationale: עַל bezeichnet hier die Leitungsstellung Nachschons über dem betreffenden Verband. Das singularische Suffix wird in Bezug auf die Einheit Judas mit „seinem“ wiedergegeben.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nachschon, der Sohn Amminadabs
  rationale: Die Namen werden in einer im Deutschen etablierten, quellenahen Form wiedergegeben; „der Sohn“ macht die genealogische Beziehung idiomatisch deutlich.
