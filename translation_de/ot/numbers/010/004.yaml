id: NUM.10.4
reference: Numbers 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם בְּ/אַחַ֖ת יִתְקָ֑עוּ וְ/נוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ הַ/נְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: de
  text: Wenn aber nur eine geblasen wird, sollen sich die führenden Männer, die Oberhäupter der Tausendschaften Israels, bei dir versammeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit den „Tausendschaften Israels“ sind wahrscheinlich Gliederungseinheiten des Volkes gemeint, denen jeweils ein Oberhaupt vorstand. Manche übersetzen sinngemäß: „die Oberhäupter der Sippen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Wenn aber
  rationale: Die Wendung führt eine Bedingung ein und hebt zugleich den Gegensatz zum Signal mit beiden Trompeten im vorherigen Vers hervor.
- source_word: בְּ/אַחַת יִתְקָעוּ
  choice: nur eine geblasen wird
  rationale: Gemeint ist elliptisch eine der beiden Trompeten. Die passive deutsche Form ist idiomatisch und bewahrt die unbestimmten Bläser des hebräischen Plurals.
- source_word: וְ/נוֹעֲדוּ
  choice: sollen sich … versammeln
  rationale: Der Niphal von יעד bezeichnet hier das Zusammenkommen aufgrund eines festgelegten Signals; „sollen“ gibt die Anweisung im Kontext natürlich wieder.
- source_word: אֵלֶי/ךָ
  choice: bei dir
  rationale: Das Zusammenkommen ist auf Mose als Ziel- und Bezugsperson gerichtet; „bei dir versammeln“ ist im Deutschen natürlicher als „zu dir versammeln“.
- source_word: הַ/נְּשִׂיאִים
  choice: die führenden Männer
  rationale: נשיאים bezeichnet die anerkannten Anführer des Volkes. Die Wiedergabe vermeidet den im modernen Deutschen leicht monarchisch verstandenen Ausdruck „Fürsten“.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: die Oberhäupter der Tausendschaften Israels
  rationale: Die formnahe Wiedergabe erhält die administrative beziehungsweise militärische Bezeichnung אלפים, ohne sie im Haupttext eindeutig als Sippen zu deuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tausendschaften“ bewahrt die historische Verwaltungssprache des Hebräischen; die mögliche Bedeutung „Sippen“ wird in der Fußnote genannt. Der Fußnotenmarker steht am Versende, da die Anmerkung die unmittelbar vorausgehende Bezeichnung erläutert.
