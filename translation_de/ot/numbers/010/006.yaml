base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: de
  text: Wenn ihr ein zweites Alarmsignal[a] blast, sollen die Lager, die im Süden lagern, aufbrechen. Für ihre Aufbrüche sollen sie ein Alarmsignal blasen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Signalstoß“. Das hebräische Wort bezeichnet hier einen besonderen Trompetenruf, der den Lagern das Zeichen zum Aufbruch gab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: wenn ihr … blast
  rationale: תקע bezeichnet hier das Blasen der Trompeten. Die zweite Person Plural bleibt erhalten; „wenn“ gibt den Ablauf der Anweisung im Deutschen natürlich wieder.
- source_word: תְּרוּעָה
  choice: Alarmsignal
  rationale: Im Zusammenhang bezeichnet תְּרוּעָה einen unterscheidbaren Trompetenstoß, der den Lagern das Zeichen zum Aufbruch gibt. „Alarmsignal“ verbindet die Dringlichkeit des Signals mit seiner konkreten Funktion.
- source_word: שֵׁנִית
  choice: ein zweites
  rationale: Das Ordinalwort bestimmt hier das Alarmsignal und wird knapp und idiomatisch wiedergegeben.
- source_word: וְנָסְעוּ
  choice: sollen … aufbrechen
  rationale: נסע bezeichnet im Zusammenhang des Wüstenlagers das Losziehen beziehungsweise Aufbrechen. Die Soll-Form entspricht dem anweisenden Charakter.
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: die Lager, die … lagern
  rationale: Die Wiederholung ist im Deutschen verständlich und bewahrt sowohl das Substantiv „Lager“ als auch die beschreibende Partizipialform von חנה.
- source_word: תֵּימָנָה
  choice: an der Südseite
  rationale: Obwohl die Form grundsätzlich eine Richtung ausdrücken kann, bezeichnet sie hier aufgrund von „lagern“ die Lage der südlichen Lagergruppen.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: sollen sie ein Alarmsignal blasen
  rationale: Die aktive Verbform in der dritten Person Plural wird beibehalten. Das Pronomen „sie“ lässt den im unmittelbaren Satz nicht ausdrücklich genannten Bezug ebenso offen wie der hebräische Text.
- source_word: לְמַסְעֵיהֶם
  choice: zu ihrem Aufbruch
  rationale: מַסָּע bezeichnet hier das Aufbrechen aus dem Lager; der Singular im Deutschen fasst den jeweiligen Anlass kollektiv und natürlich zusammen.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Anweisungssprache. Die Wiederholung von „Alarmsignal“ folgt der bewussten Wiederholung im Hebräischen; die aktive Schlussform und ihr nicht ausdrücklich benannter Bezug werden nicht durch eine deutsche Passivkonstruktion vereindeutigt.
