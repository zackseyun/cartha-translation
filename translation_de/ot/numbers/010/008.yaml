source:
  edition: WLC
  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: de
  text: Die Söhne Aarons, die Priester, sollen die Trompeten blasen. Dies soll euch von Generation zu Generation als bleibende Ordnung[a] gelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ewige Ordnung“; oder: „Ordnung für immer“.'
    reason: Lexikalische Alternative für חֻקַּת עוֹלָם; עוֹלָם kann je nach Zusammenhang lange Dauer oder unbegrenzte Fortdauer bezeichnen.
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: Die Söhne Aarons
  rationale: בְּנֵי bedeutet wörtlich „Söhne von“. Die familiäre Bezeichnung bleibt erhalten und wird in natürlichem deutschem Genitiv wiedergegeben.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die Wendung bestimmt „die Söhne Aarons“ appositionell näher und wird entsprechend als nachgestellte Erläuterung wiedergegeben.
- source_word: יִתְקְעוּ בַּחֲצֹצְרוֹת
  choice: sollen die Trompeten blasen
  rationale: תקע bezeichnet zusammen mit חצצרות das Blasen beziehungsweise Ertönenlassen von Trompeten. „Sollen“ gibt den anordnenden Sinn des Imperfekts in diesem Rechtstext angemessen wieder.
- source_word: וְהָיוּ לָכֶם
  choice: Dies soll euch … gelten
  rationale: Der hebräische Plural greift formal das zuvor Gesagte auf, doch der Sinn betrifft die gesamte Anordnung. Das zusammenfassende „Dies“ vermeidet im Deutschen den missverständlichen Eindruck, die Priester selbst oder die Trompeten seien die Ordnung.
- source_word: לְחֻקַּת עוֹלָם
  choice: als bleibende Ordnung
  rationale: חֻקָּה bezeichnet eine festgesetzte Ordnung oder Satzung; עוֹלָם drückt hier ihre fortdauernde Geltung aus. „Bleibende Ordnung“ ist verständlich und bewahrt den rechtlichen Charakter, ohne die Bedeutungsbreite von עוֹלָם vorschnell auf metaphysische Endlosigkeit festzulegen.
- source_word: לְדֹרֹתֵיכֶם
  choice: von Generation zu Generation
  rationale: Die idiomatische deutsche Wendung vermittelt die fortlaufende Geltung für die aufeinanderfolgenden Generationen.
theological_decisions:
- issue: Reichweite von חֻקַּת עוֹלָם
  choice: bleibende Ordnung
  alternative: ewige Ordnung; Ordnung für immer
  rationale: Die Formel bezeichnet eine dauerhaft geltende Anordnung innerhalb des Bundeslebens Israels. „Bleibend“ erhält diese fortdauernde Kraft, ohne festzulegen, ob עוֹלָם hier philosophisch absolute Endlosigkeit meint; die wörtlicheren Möglichkeiten werden in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz hält die appositionelle Struktur des Hebräischen fest; der zweite gibt die Rechtsformel natürlich wieder. Der Fußnotenmarker steht bei der Wendung, auf die sich die Anmerkung tatsächlich bezieht.
