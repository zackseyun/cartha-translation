source:
  edition: WLC
  text: אֵ֛לֶּה מַסְעֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/צִבְאֹתָ֑/ם וַ/יִּסָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: de
  text: Dies waren die Aufbrüche der Israeliten nach ihren Heeresverbänden[a], und sie brachen auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach ihren Abteilungen« bzw. »nach ihren Scharen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Dies waren
  rationale: Der pluralische Demonstrativausdruck leitet rückblickend eine Zusammenfassung ein; im Deutschen ist dafür »Dies waren« natürlich, obwohl im Hebräischen keine Kopula steht.
- source_word: מַסְעֵי
  choice: die Aufbrüche
  rationale: Der Konstruktplural von מַסָּע kann Reiseabschnitte, Aufbrüche oder Marschbewegungen bezeichnen. Im unmittelbaren Zusammenhang fasst das Wort die geordneten Aufbrüche zusammen und wird zudem durch וַיִּסָּעוּ aufgenommen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich »die Söhne Israels«; die etablierte deutsche Volksbezeichnung gibt den gemeinschaftlichen Sinn hier natürlich und inklusiv wieder.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צָבָא bezeichnet hier die für den Marsch geordneten Großgruppen Israels. »Heeresverbände« bewahrt den militärisch-organisatorischen Klang, ohne eine konkrete Kampfhandlung zu behaupten.
- source_word: וַיִּסָּעוּ
  choice: so brachen sie auf
  rationale: Die Wayyiqtol-Form von נסע bezeichnet im Reisebericht das Aufbrechen. »So« gibt den zusammenfassenden Übergang idiomatisch wieder, ohne eine zusätzliche zeitliche Aussage einzuführen.
theological_decisions:
- issue: Militärische Bezeichnung der geordneten Gemeinschaft Israels
  choice: Heeresverbände
  alternative: Abteilungen / Scharen
  rationale: Der militärische Organisationsbegriff des Hebräischen bleibt erkennbar; zugleich wird nicht unterstellt, dass die Gruppen in diesem Vers gerade kämpften.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt knapp und bewahrt den zusammenfassenden Charakter des hebräischen Verses.
