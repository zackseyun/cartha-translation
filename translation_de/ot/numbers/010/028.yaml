    issue: „so“ in „so brachen sie auf“
    rationale: Das hebräische וַיִּסָּעוּ bedeutet hier schlicht „und sie brachen auf“. „So“ kann im Deutschen einen folgernden oder resümierenden Akzent setzen, der im Ausgangstext nicht ausdrücklich markiert ist.
