source:
  edition: WLC
  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/016.yaml
  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: de
  text: Und über die Heerschar[a] des Stammes der Söhne Sebulons stand Eliab, der Sohn Helons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Für „Heerschar“ auch: „Heer“ oder „Abteilung“; das hebräische Wort צְבָא bezeichnet hier einen geordneten Stammesverband in Marschordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Über ... stand
  rationale: Die Konjunktion verbindet den Satz mit der vorausgehenden Aufzählung; עַל bezeichnet in der elliptischen Führungsformel die Befehlsgewalt. Im Deutschen gibt die Verbformulierung „Über ... stand“ dies natürlich wieder.
- source_word: צְבָא
  choice: Heerschar
  rationale: Das Wort bezeichnet hier den geordneten, zum Marsch aufgestellten Stammesverband. „Heerschar“ bewahrt den militärisch-organisatorischen Klang, ohne zwingend ein stehendes Heer zu bezeichnen; mögliche Alternativen werden in der Fußnote genannt.
- source_word: מַטֵּה
  choice: Stamm
  rationale: Hier bezeichnet מַטֵּה eindeutig die soziale und politische Einheit des Stammes, nicht den wörtlichen Stab.
- source_word: בְּנֵי זְבוּלֻן
  choice: der Söhne Sebulons
  rationale: Die ausdrücklich verwandtschaftliche hebräische Formulierung wird bewahrt; sie bezeichnet die Angehörigen beziehungsweise Nachkommen des Stammesvaters Sebulon.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶּן חֵלֹון
  choice: der Sohn Helons
  rationale: Die hebräische Patronymik wird direkt und idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufzählungsform des Hebräischen bleibt erhalten; das im Hebräischen ausgelassene Verb wird für einen natürlichen deutschen Satz mit „stand“ ergänzt.
