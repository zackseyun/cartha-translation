  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: de
  text: Fertige dir zwei Trompeten aus Silber an. In Treibarbeit sollst du sie anfertigen. Sie sollen dir zur Einberufung der Gemeinde und zum Aufbruch der Lager dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Fertige dir … an
  rationale: Der deutsche Dativ „dir“ gibt לְךָ natürlich wieder und bezeichnet die Anfertigung zum Gebrauch unter Moses Verantwortung.
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  choice: zwei Trompeten aus Silber
  rationale: חֲצֹצְרָה bezeichnet eine gerade Metalltrompete, nicht das gebogene Horn; „aus Silber“ benennt das Material eindeutig und idiomatisch.
- source_word: מִקְשָׁה
  choice: in Treibarbeit
  rationale: Das Wort bezeichnet durch Hämmern beziehungsweise Treiben geformte Metallarbeit. „Aus einem Stück“ wäre eine mögliche Folgerung, ist hier aber zu interpretierend.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: sollst du sie anfertigen
  rationale: Die imperativisch gebrauchte Verbform führt die Anweisung fort und bewahrt zugleich die Wiederholung von עשׂה.
- source_word: וְהָיוּ לְךָ
  choice: Sie sollen dir dazu dienen
  rationale: Die Wendung beschreibt hier die vorgesehene Funktion der Trompeten, nicht bloß ihren Besitz.
- source_word: לְמִקְרָא הָעֵדָה
  choice: die Gemeinde zusammenzurufen
  rationale: מִקְרָא bezeichnet hier das Einberufen beziehungsweise Zusammenrufen; עֵדָה ist die Gemeinschaft Israels als „Gemeinde“.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: den Lagern das Zeichen zum Aufbruch zu geben
  rationale: מַסַּע bezeichnet den Aufbruch beziehungsweise das Weiterziehen. Die Formulierung macht die Signalfunktion der Trompeten und den Bezug auf die einzelnen Lager im natürlichen Deutschen deutlich.
