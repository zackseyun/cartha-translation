  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: de
  text: 'Und er sagte: „Verlass uns doch nicht! Denn du weißt, wie wir in der Wildnis lagern,[a] und du wirst uns als Augen dienen.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „du kennst unser Lagern in der Wildnis“; gemeint sein können die Art des Lagerns oder geeignete Lagerplätze.'
    reason: Die substantivische Form חֲנֹתֵנוּ lässt offen, ob der Vorgang des Lagerns oder die Lagerorte im Vordergrund stehen.
  - marker: b
    text: 'Wörtlich: „und du wirst uns zu Augen sein“, das heißt, aufgrund deiner Kenntnis der Wildnis als kundiger Führer dienen.'
    reason: Die Fußnote erklärt die ungewöhnliche hebräische Metapher und bewahrt zugleich ihre wörtliche Form.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Das narrative Wayyiqtol leitet die direkte Rede ein; die schlichte Wiedergabe bewahrt den hebräischen Erzählfluss.
- source_word: אַל נָא תַּעֲזֹב אֹתָנוּ
  choice: Verlass uns doch nicht!
  rationale: אַל bezeichnet das Verbot, während נָא die Bitte nachdrücklich und höflich macht. „doch“ gibt diesen flehentlichen Ton im Deutschen natürlich wieder.
- source_word: כִּי עַל כֵּן
  choice: Denn
  rationale: Die Wendung führt die Begründung für die Bitte ein. „Denn“ ist in diesem Zusammenhang klar, idiomatisch und würdevoll.
- source_word: יָדַעְתָּ חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: du weißt, wo wir in der Wildnis lagern können
  rationale: חֲנֹתֵנוּ bezeichnet unser Lagern beziehungsweise unsere Lagerplätze. Die Wiedergabe mit „wo“ erschließt im Kontext Hobabs Kenntnis geeigneter Orte, ohne die mögliche wörtlichere Deutung zu verschweigen; diese wird in einer Fußnote genannt.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינַיִם
  choice: und du sollst uns als Augen dienen
  rationale: Die Formulierung bewahrt das hebräische Bild von den „Augen“, macht aber zugleich seine Funktion verständlich. Das Verb kann hier erwartete oder erwünschte künftige Tätigkeit ausdrücken; „sollst“ passt zur vorausgehenden Bitte, ohne daraus einen Befehl zu machen.
theological_decisions:
- issue: Verhältnis von Gottes Führung zu Hobabs Ortskenntnis
  choice: Die menschliche Führungsfunktion wird entsprechend dem Wortlaut wiedergegeben, ohne sie theologisch abzuschwächen.
  alternative: Die Aussage ausdrücklich auf bloße praktische Beratung zu begrenzen.
  rationale: Der Vers nennt Hobab bildhaft „Augen“ für Israel. Wie dies mit der göttlichen Führung zusammenwirkt, wird im Text nicht erklärt und soll daher nicht harmonisierend aufgelöst werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Bitte klingt eindringlich, aber nicht altertümlich. „Wildnis“ gibt מִדְבָּר breiter und geografisch angemessener wieder als das oft zu eng verstandene „Wüste“.
