  text: וּ/תְקַעְתֶּ֖ם תְּרוּעָ֑ה וְ/נָֽסְעוּ֙ הַֽ/מַּחֲנ֔וֹת הַ/חֹנִ֖ים קֵֽדְמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: de
  text: Wenn ihr ein Alarmsignal[a] blast, sollen die Lager, die auf der Ostseite lagern, aufbrechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Signal zum Aufbruch“. Das hebräische Wort bezeichnet hier einen besonderen Trompetenstoß, der den Aufbruch der Lager anzeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Wenn ihr … blast
  rationale: תקע bezeichnet beim Gebrauch von Trompeten das Blasen. Die mit ו eingeleitete Form wird im Zusammenhang natürlich als zeitliche Bedingung für den folgenden Aufbruch wiedergegeben.
- source_word: תְּרוּעָה
  choice: das Alarmsignal
  rationale: תְּרוּעָה bezeichnet hier nicht irgendeinen Ton, sondern ein unterscheidbares Trompetensignal zur Bewegung des Lagers; „Alarmsignal“ bewahrt zugleich den kräftigen Signalcharakter.
- source_word: וְנָסְעוּ
  choice: sollen … aufbrechen
  rationale: נסע bezeichnet beim Lagerzug das Aufbrechen beziehungsweise Sich-in-Bewegung-Setzen. „Sollen aufbrechen“ passt zum anweisenden Kontext.
- source_word: הַמַּחֲנוֹת
  choice: die Lager
  rationale: Der Plural bezeichnet die gegliederten Lagerverbände Israels; „die Lager“ ist direkt und im Deutschen verständlich.
- source_word: הַחֹנִים
  choice: die … lagern
  rationale: Das Partizip beschreibt die Lager nach ihrer gegenwärtigen Position. Der Relativsatz gibt diesen stativen Sinn knapp und natürlich wieder.
- source_word: קֵדְמָה
  choice: auf der Ostseite
  rationale: Die Form bezeichnet hier im Rahmen der Lagerordnung die Lage im Osten, nicht die Bewegungsrichtung nach Osten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Blasen“ wird idiomatisch für ein Trompetensignal gebraucht; die Wiederholung „Lager … lagern“ bildet die hebräische Wortfügung verständlich und ohne sachliche Ergänzung ab.
