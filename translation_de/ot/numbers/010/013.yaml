  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: de
  text: So brachen sie zum ersten Mal auf, auf Jahwes Befehl, der durch Mose erging[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Moses“; eine hebräische Wendung, die Mose als Vermittler oder Beauftragten bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: So brachen sie … auf
  rationale: נסע bezeichnet in diesem Reisebericht das Aufbrechen des Lagers und den anschließenden Weiterzug. „Aufbrechen“ gibt den einsetzenden Vorgang im modernen Deutschen natürlich wieder.
- source_word: בָּרִאשֹׁנָה
  choice: zum ersten Mal
  rationale: Die adverbiale Form bedeutet „zuerst“ oder „zum ersten Mal“. Hier bezeichnet sie den ersten geordneten Aufbruch Israels vom Sinai.
- source_word: עַל פִּי
  choice: nach dem Befehl
  rationale: Die Wendung bedeutet wörtlich „auf den Mund hin“, idiomatisch jedoch „gemäß“ oder „auf Befehl“. Im Zusammenhang göttlicher Weisung bringt „nach dem Befehl“ die verpflichtende Richtung präzise zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die wörtliche Wendung „durch die Hand Moses“ bezeichnet Mose als vermittelnden Beauftragten. „Durch Mose“ ist klares, heutiges Deutsch und bewahrt diese Mittlerfunktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Moses Rolle in der Weitergabe des Befehls
  choice: durch Mose
  alternative: durch die Hand Moses; von Mose
  rationale: Die Formulierung lässt den Befehl von Jahwe ausgehen und stellt Mose als dessen Vermittler beziehungsweise Beauftragten dar, ohne Mose selbst zur Quelle des Befehls zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt gut lesbar und bildet zugleich die Abfolge des hebräischen Satzes ab. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Wendung.
