  text: וּ/בְ/הַקְהִ֖יל אֶת הַ/קָּהָ֑ל תִּתְקְע֖וּ וְ/לֹ֥א תָרִֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: de
  text: Wenn ihr die Gemeinde versammelt, sollt ihr blasen, aber kein Alarmsignal geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְהַקְהִיל
  choice: Wenn ihr aber … versammelt
  rationale: 'Die Präposition ב mit dem Hifil-Infinitiv von קהל hat hier temporalen Sinn: »wenn ihr versammelt«. »Aber« macht den sachlichen Gegensatz zum Aufbruchssignal des vorherigen Zusammenhangs natürlich deutlich.'
- source_word: הַקָּהָל
  choice: die Gemeinde
  rationale: קָהָל bezeichnet hier die versammelte Gemeinschaft Israels. »Gemeinde« ist im Deutschen verständlich und für den gemeinschaftlichen Zusammenhang angemessen.
- source_word: תִּתְקְעוּ
  choice: sollt ihr blasen
  rationale: תקע meint im Kontext das Blasen der Trompeten. Das Objekt wird wie im Hebräischen nicht eigens wiederholt, da es aus dem Zusammenhang hervorgeht.
- source_word: וְלֹא תָרִיעוּ
  choice: jedoch kein Alarmsignal geben
  rationale: Das Hifil von רוע bezeichnet hier das besondere Signal zum Aufbruch und steht im Gegensatz zum gewöhnlichen Blasen zur Versammlung. »Alarmsignal« bildet diesen technischen Unterschied knapp ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Anweisungsform. Der Gegensatz zwischen gewöhnlichem Trompetenblasen zur Versammlung und dem besonderen Signal zum Aufbruch bleibt erhalten.
