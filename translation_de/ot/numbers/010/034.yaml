  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: de
  text: Und die Wolke Jahwes war tagsüber über ihnen, wenn sie vom Lager aufbrachen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war tagsüber auf ihnen“.'
    reason: Lexikalische Alternative für עֲלֵיהֶם; עַל kann sowohl „über“ als auch „auf“ bezeichnen.
lexical_decisions:
- source_word: וַעֲנַן יְהוָה
  choice: Und die Wolke Jahwes
  rationale: עָנָן bedeutet „Wolke“; die vorangestellte Konjunktion wahrt den erzählerischen Anschluss. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: עֲלֵיהֶם
  choice: war über ihnen
  rationale: עַל bezeichnet hier die räumliche Lage über ihnen; „über ihnen“ ist im Deutschen natürlich und lässt den möglichen Schutzgedanken unausgesprochen.
- source_word: יוֹמָם
  choice: tagsüber
  rationale: Das Adverb bezeichnet die Zeit am Tag; „tagsüber“ ist eine knappe, moderne Wiedergabe.
- source_word: בְּנָסְעָם
  choice: wenn sie … aufbrachen
  rationale: Der Infinitiv von נסע mit בְּ und Suffix hat temporalen Sinn und bezeichnet hier das Aufbrechen beziehungsweise Weiterziehen.
- source_word: מִן־הַמַּחֲנֶה
  choice: vom Lager
  rationale: מַחֲנֶה bezeichnet das Lager; die Präposition מִן wird idiomatisch mit „vom“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen direkt. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Wolke über Israel
  choice: räumlich offen als „über ihnen“
  alternative: deutend als „zu ihrem Schutz über ihnen“
  rationale: Der Text nennt die Lage der Wolke, erklärt ihre Funktion hier aber nicht ausdrücklich; eine Schutzfunktion wird daher nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanschluss mit „Und“ und die zeitliche Konstruktion des Hebräischen bleiben erhalten; die ungewöhnliche Schlussmarkierung im masoretischen Text hat keinen übersetzbaren Wortlaut.
