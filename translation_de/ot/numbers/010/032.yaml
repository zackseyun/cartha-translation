source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: de
  text: Und wenn du mit uns gehst, dann werden wir dir das Gute erweisen, das Jahwe uns erweisen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Verbindung eröffnet eine Bedingung. »Wenn« bewahrt den konditionalen Sinn, ohne die hebräische Wendung unnötig wörtlich mit »und es wird geschehen« wiederzugeben.
- source_word: תֵלֵךְ עִמָּנוּ
  choice: du mit uns gehst
  rationale: הלך mit עִם bezeichnet hier das Mitgehen beziehungsweise Begleiten auf der Reise; »mit uns gehst« ist direkt und im Deutschen natürlich.
- source_word: הַטּוֹב הַהוּא
  choice: das Gute
  rationale: Die substantivierte Form bezeichnet das Gute beziehungsweise die Wohltat, die im folgenden Relativsatz näher bestimmt wird.
- source_word: אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: das Jahwe uns erweist
  rationale: Der Hifil von יטב bedeutet hier, jemandem Gutes zu tun oder Gutes zu erweisen. »Gutes erweisen« gibt den Sinn würdig und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: werden wir dir … ebenfalls erweisen
  rationale: Die Wiederholung derselben Verbalwurzel יטב stellt eine Entsprechung zwischen Jahwes Güte gegenüber Israel und Israels Güte gegenüber dem Angesprochenen her. »Ebenfalls« macht diese Entsprechung deutlich, ohne ausdrücklich eine völlig identische Gabe zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Umschrift »Jahwe« bewahrt den Charakter als Eigenname.
- issue: Beziehung zwischen Jahwes Gutem und Israels Gegenleistung
  choice: das Gute … ebenfalls erweisen
  alternative: dir Gutes tun
  rationale: Die gewählte Fassung erhält die erkennbare Entsprechung der beiden Formen von יטב. Sie vermeidet zugleich die stärkere Behauptung, Israel werde exakt dieselbe konkrete Gabe weiterreichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem Hebräischen leicht geglättet; die Bedingung und die wechselseitige Formulierung von »Gutes erweisen« bleiben erhalten.
