    rationale: Die deutsche unpersönliche Konstruktion macht aus dem passiven „ihr werdet erinnert/in Erinnerung gebracht“ eine aktive Erinnerungshandlung eines ungenannten „man“. Die revidierte passive Form wahrt die grammatische Offenheit, ohne Jahwe ausdrücklich zum Subjekt zu machen.
