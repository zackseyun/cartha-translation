  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: de
  text: Und wenn ihr in eurem Land gegen den Feind in den Krieg zieht, der euch bedrängt[a], dann sollt ihr mit den Trompeten Alarm blasen, und ihr werdet vor Jahwe, eurem Gott, in Erinnerung gebracht werden[b] und vor euren Feinden gerettet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und falls ihr in eurem Land gegen den Feind in den Krieg zieht, der euch bedrängt“. Die hebräische Verbindung kann sowohl eine Bedingung als auch eine eintretende Situation bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder sinngemäß: „Dann wird Jahwe, euer Gott, an euch denken.“ Im Hebräischen steht eine passive Form, die offenlässt, wie das Erinnern grammatisch genauer zu verstehen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Die Verbindung kann eine bedingte oder situative Klausel einleiten. „Und wenn“ wahrt den Anschluss an den Kontext und lässt den Fall als künftige Situation erscheinen; die mögliche konditionale Nuance wird in einer Fußnote genannt.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: ihr … in den Krieg zieht
  rationale: Die hebräische Wendung bezeichnet den Eintritt in eine kriegerische Auseinandersetzung. „In den Krieg ziehen“ ist im Deutschen idiomatisch und passt zur militärischen Situation.
- source_word: בְּאַרְצְכֶם
  choice: in eurem Land
  rationale: „Land“ erhält die territoriale und bundestheologische Färbung von אֶרֶץ besser als das modern-politische „Staat“.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: gegen den Feind …, der euch bedrängt
  rationale: „Feind“ gibt צַר natürlich wieder; der folgende Relativsatz bewahrt die zusätzliche partizipiale Aussage von צֹרֵר und damit die verstärkende Beschreibung des feindlichen Handelns.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: dann sollt ihr mit den Trompeten Alarm blasen
  rationale: Im Zusammenhang mit Trompeten bezeichnet das Hifil von רוע einen Alarm- oder Signalstoß. „Alarm blasen“ ist knapp, verständlich und funktional genau.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: So wird man sich vor Jahwe, eurem Gott, an euch erinnern
  rationale: Die unpersönliche deutsche Passivumschreibung wahrt möglichst natürlich die passive Form des hebräischen Niphal und nennt Gott nicht ausdrücklich als grammatisches Subjekt. „Vor Jahwe“ erhält die Wendung לִפְנֵי und ihre kultisch-bundestheologische Spannung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: und ihr werdet vor euren Feinden gerettet werden
  rationale: Das Niphal von ישׁע ist passiv und bezeichnet Rettung beziehungsweise Befreiung. „Vor euren Feinden gerettet“ ist im Deutschen die natürliche Verbindung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als Namen und ersetzt ihn nicht durch den Titel „Herr“.
- issue: Aussage und Form von וֲנִזְכַּרְתֶּם
  choice: So wird man sich vor Jahwe, eurem Gott, an euch erinnern
  alternative: Jahwe, euer Gott, wird an euch denken
  rationale: Die gewählte Form bewahrt die passive beziehungsweise medial-passive Gestalt und die ungewöhnliche Perspektive „vor Jahwe“. Die Alternative ist verständlicher, macht Jahwe jedoch ausdrücklich zum Subjekt und legt die Syntax stärker aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Der Satz wurde zur besseren Lesbarkeit geteilt. „Trompeten“ knüpft an die silbernen Signalinstrumente des Kapitels an; „Alarm blasen“ ist gegenwärtig verständlich, ohne den militärischen und kultischen Zusammenhang zu verwischen.
