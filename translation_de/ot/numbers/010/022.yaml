id: NUM.10.22
reference: Numbers 10:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: de
  text: Dann brach das Banner[a] des Lagers der Söhne Ephraims nach ihren Heeresverbänden[b] auf. An der Spitze seines Heeresverbands stand Elischama, der Sohn Ammihuds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feldzeichen“. Das hebräische Wort bezeichnet das Stammeszeichen, unter dem das Lager marschierte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach ihren Abteilungen“ beziehungsweise „nach ihren Heerscharen“. Gemeint sind die geordneten, militärisch gegliederten Gruppen des Lagers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Dann brach ... auf
  rationale: Das Waw mit Qatal führt die Abfolge des Aufbruchs fort. „Dann“ gibt die zeitliche Folge natürlich wieder; „aufbrechen“ passt zum Marschkontext.
- source_word: דֶּגֶל
  choice: Banner
  rationale: Das Wort bezeichnet das Feld- oder Stammeszeichen, unter dem die Lagerabteilung zog. „Banner“ ist gegenwärtig und verständlich; „Feldzeichen“ bleibt als Alternative in der Fußnote.
- source_word: מַחֲנֵה
  choice: Lager
  rationale: In der Verbindung mit דֶּגֶל bezeichnet es das dem Banner zugeordnete Lager beziehungsweise dessen marschierende Einheit.
- source_word: בְנֵי אֶפְרַיִם
  choice: Söhne Ephraims
  rationale: Die formnahe Wiedergabe bewahrt die übliche hebräische Stammesbezeichnung, ohne sie zu „Nachkommen“ oder „Stamm“ zu glätten.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צָבָא bezeichnet hier geordnete, militärisch strukturierte Gruppen. „Heeresverbände“ wahrt diesen Charakter, ohne zwingend einen konkreten Kampfeinsatz auszudrücken.
- source_word: וְעַל צְבָאוֹ
  choice: An der Spitze seines Heeresverbands stand
  rationale: Die idiomatische Formulierung gibt die Leitungsbeziehung von עַל wieder. Der Singular mit Suffix verweist auf den Verband des ephraimitischen Lagers.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elischama, der Sohn Ammihuds
  rationale: Die Namen werden nach üblicher deutscher biblischer Namensform wiedergegeben; בֶּן wird transparent als „Sohn“ übersetzt.
theological_decisions: []
