  source_fidelity: 'Der hebräische Redeauftrag und seine Verschachtelung sind sachgerecht wiedergegeben: Mose soll zu Aaron und dessen Söhnen sprechen; diese werden angewiesen, die Israeliten zu segnen und dabei die folgenden Worte zu sagen. „Die Israeliten“ gibt בְּנֵי יִשְׂרָאֵל als etablierte Volksbezeichnung treffend wieder, ohne fälschlich nur Männer zu meinen.'
