source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר כֹּ֥ה תְבָרֲכ֖וּ אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: de
  text: 'Sprich zu Aaron und seinen Söhnen: »So sollt ihr die Israeliten segnen. Sagt zu ihnen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sprich
  rationale: Der Piel-Imperativ 2. Person Singular richtet einen unmittelbaren Redeauftrag an Mose; „Sprich“ gibt die übliche hebräische Befehlsformel würdig und knapp wieder.
- source_word: וְאֶל בָּנָיו
  choice: und seinen Söhnen
  rationale: בָּנָיו bezeichnet hier im Zusammenhang Aarons Söhne als priesterliche Amtsträger; die geschlechtsspezifische Bedeutung ist sachlich relevant.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der quotative Infinitiv leitet den Inhalt der Rede ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion, ohne ein schwerfälliges „und sage“ einzufügen.
- source_word: כֹּה
  choice: So
  rationale: כֹּה führt die vorgeschriebene Art und anschließend den Wortlaut des Segens ein; „So“ ist idiomatisch und bewahrt den verbindlichen Charakter.
- source_word: תְבָרֲכוּ
  choice: sollt ihr … segnen
  rationale: Der Piel-Imperfekt 2. Person Plural hat hier instruktive beziehungsweise verpflichtende Kraft. „Sollt ihr“ wahrt diese, ohne bloße Zukunft oder übermäßig starken Zwang auszudrücken.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich „die Söhne Israels“, doch als feste Volksbezeichnung meint der Ausdruck das Volk Israel. „Die Israeliten“ ist im modernen Deutsch präzise, natürlich und inklusiv hinsichtlich des bezeichneten Volkes.
- source_word: אָמֹר לָהֶם
  choice: Sagt zu ihnen
  rationale: Der Infinitiv absolut fungiert hier als nachdrücklicher pluralischer Redeauftrag an Aaron und seine Söhne und leitet den genauen Segenswortlaut des folgenden Verses ein.
theological_decisions:
- issue: Bundes- und Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Der hebräische Ausdruck hat eine wörtliche familiäre Form, dient hier jedoch als konventionelle Bezeichnung des gesamten Volkes. Die idiomatische Wiedergabe vermeidet im Deutschen das Missverständnis, nur männliche Israeliten seien gemeint, ohne die Bundesidentität inhaltlich zu verändern.
- issue: Verbindlichkeit der priesterlichen Segensanweisung
  choice: So sollt ihr … segnen
  alternative: So werdet ihr … segnen
  rationale: Der Kontext kennzeichnet תְבָרֲכוּ als Anweisung, nicht als bloße Zukunftsaussage. „Sollt“ hält den autoritativen und liturgischen Charakter fest, ohne über den Text hinaus ein stärkeres „müsst“ zu setzen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, liturgisch geeignetem Ton. Die hebräische Redeverschachtelung wird durch Doppelpunkt und direkte Rede natürlich strukturiert. Der Vers endet mit einem Doppelpunkt, weil in Vers 24 der vorgeschriebene Segenswortlaut folgt.
