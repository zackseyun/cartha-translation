  terminology: „Aaron“, „seinen Söhnen“, „Israeliten“ und „segnen“ sind präzise und im biblischen Register idiomatisch. „So sollt ihr“ gibt die instruktive Kraft von תְבָרֲכוּ angemessen wieder, ohne sie unnötig zu verschärfen.
