source:
  edition: WLC
  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: de
  text: Jahwe erhebe sein Angesicht zu dir und gebe dir Frieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Frieden“ (Schalom) kann auch umfassendes Wohlergehen, Unversehrtheit und Ganzsein bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: erhebe
  rationale: נשׂא bedeutet wörtlich „heben, erheben, tragen“. Mit „Angesicht“ als Objekt bezeichnet die Wendung hier die gnädige, wohlwollende Zuwendung. „Erhebe“ bewahrt das hebräische Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: פָּנָיו
  choice: sein Angesicht
  rationale: פָּנִים bezeichnet das Gesicht oder Angesicht. „Angesicht“ bewahrt die konkrete Bildsprache und passt zum würdevollen Segensstil; „Gegenwart“ wäre stärker deutend.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: אֶל bezeichnet eine Richtung auf jemanden hin. „Zu dir“ gibt diese Richtung knapp und natürlich wieder.
- source_word: וְיָשֵׂם
  choice: und gebe
  rationale: שׂים bedeutet wörtlich „setzen, stellen, legen“. In der Verbindung mit שָׁלוֹם und einem Begünstigten ist „Frieden geben“ im Deutschen idiomatisch und gibt die beabsichtigte Wirkung klar wieder.
- source_word: לְךָ
  choice: dir
  rationale: Die Präposition לְ kennzeichnet hier den Empfänger beziehungsweise Begünstigten und wird als Dativ „dir“ wiedergegeben.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen, Unversehrtheit und Ganzsein. „Frieden“ ist in einer Segensformel die treffende Hauptwiedergabe; die größere Bedeutungsbreite wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im hebräischen Text steht der persönliche Gottesname. „Jahwe“ bewahrt ihn in einer gebräuchlichen deutschen Form, statt ihn durch einen Titel zu ersetzen.
- issue: Bewahrung der anthropomorphen Wendung „sein Angesicht erheben“
  choice: Das konkrete Bild wird mit „erhebe sein Angesicht zu dir“ beibehalten.
  alternative: wende sich dir gnädig zu; blicke dich wohlwollend an
  rationale: Die hebräische Segensformel drückt Gottes wohlwollende Zuwendung durch ein körperbezogenes Bild aus. Die Übersetzung bewahrt diese literarische und theologische Bildsprache, ohne sie in eine abstrakte Aussage aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst feierlichem „Angesicht“. Die syntaktische Nähe zur hebräischen Segensformel erhält ihren poetischen Parallelismus und ihre konkrete Bildsprache.
