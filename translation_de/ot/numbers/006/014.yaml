source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: de
  text: 'Und er soll Jahwe seine Opfergabe darbringen: ein einjähriges männliches Lamm ohne Makel als Brandopfer, ein einjähriges weibliches Lamm ohne Makel als Sündopfer[a] und einen Widder ohne Makel als Friedensopfer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann sowohl Sünde als auch das mit der Reinigung von Verunreinigung oder Verfehlung verbundene Opfer bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Heilsopfer“ beziehungsweise „Gemeinschaftsopfer“. Der hebräische Ausdruck שְׁלָמִים kann Frieden, Wohlergehen und Gemeinschaft anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב אֶת־קָרְבָּנוֹ
  choice: Und er soll seine Opfergabe darbringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Gabe. „Darbringen“ ist im Deutschen natürlich und wahrt den rituellen Sinn; „Opfergabe“ gibt קָרְבָּן wieder, ohne es mit einer einzelnen Opferart gleichzusetzen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כֶּבֶשׂ בֶּן־שְׁנָתוֹ תָמִים אֶחָד
  choice: ein einjähriges männliches Lamm ohne Makel
  rationale: כֶּבֶשׂ bezeichnet hier ein männliches Lamm; בֶּן־שְׁנָתוֹ gibt sein Alter an. „Ohne Makel“ entspricht dem opferrechtlichen Sinn von תָמִים.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet die Opferart, bei der das Tier vollständig auf dem Altar verbrannt wird. „Brandopfer“ ist die geläufige und präzise deutsche Bezeichnung.
- source_word: וְכַבְשָׂה אַחַת בַּת־שְׁנָתָהּ תְּמִימָה
  choice: ein einjähriges weibliches Lamm ohne Makel
  rationale: כַבְשָׂה ist ausdrücklich die weibliche Form. Die Wiedergabe macht den im Hebräischen markierten Geschlechtsunterschied zum ersten Tier sichtbar.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet hier eine Opferkategorie. „Sündopfer“ ist die geläufigste deutsche Entsprechung; die ebenfalls mögliche funktionale Deutung als „Reinigungsopfer“ wird in einer Fußnote bewahrt.
- source_word: וְאַיִל אֶחָד תָּמִים
  choice: einen Widder ohne Makel
  rationale: אַיִל bezeichnet spezifisch einen Widder. Der Akkusativ folgt im Deutschen der von „darbringen“ eröffneten Konstruktion.
- source_word: לִשְׁלָמִים
  choice: als Friedensopfer
  rationale: שְׁלָמִים ist eine Opferkategorie, die mit Frieden, Wohlergehen und Gemeinschaft verbunden ist. „Friedensopfer“ wahrt den lexikalischen Bezug zu שׁלם; alternative geläufige Deutungen stehen in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חַטָּאת im Opferrecht
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck kann sowohl auf Sünde als auch auf die durch das Opfer bewirkte Reinigung von Verunreinigung oder Verfehlung bezogen sein. Die Hauptfassung verwendet die traditionelle Opferbezeichnung, ohne die funktionale Alternative zu verschweigen.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Friedensopfer
  alternative: Heilsopfer oder Gemeinschaftsopfer
  rationale: Der hebräische Ausdruck umfasst Aspekte von Frieden, Wohlergehen und kultischer Gemeinschaft. Keine einzelne deutsche Bezeichnung bildet das gesamte Bedeutungsspektrum ab; deshalb werden Alternativen in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortlaufende Anweisung wird mit „Und er soll“ wiedergegeben. „Ohne Makel“ bewahrt den kultisch-rechtlichen Ton, während die Satzstruktur für heutige Leser klar und flüssig bleibt.
