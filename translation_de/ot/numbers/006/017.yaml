  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: de
  text: Und den Widder soll er Jahwe als Heilsopfer[a] darbringen, zusammen mit dem Korb ungesäuerter Brote. Der Priester soll das dazugehörige Speiseopfer und Trankopfer darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinschaftsopfer“. Das hebräische שְׁלָמִים kann als „Heilsopfer“ oder „Gemeinschaftsopfer“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: den Widder
  rationale: אַיִל bezeichnet im Opferkontext spezifisch einen männlichen Schafbock; „Widder“ ist die natürliche deutsche Entsprechung.
- source_word: יַעֲשֶׂה
  choice: soll er … darbringen
  rationale: עשה bedeutet grundsätzlich „tun/machen“, bezeichnet hier aber idiomatisch die Ausführung beziehungsweise Darbringung des Opfers.
- source_word: זֶבַח שְׁלָמִים
  choice: als Heilsopfer
  rationale: „Heilsopfer“ ist eine etablierte, knappe deutsche Bezeichnung für diese Opfergattung. Die Fußnote bewahrt die mögliche Deutung als Gemeinschaftsopfer.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition kennzeichnet den Empfänger des Opfers; durch „Jahwe … darbringen“ wird dies im Deutschen idiomatisch ausgedrückt und der Gottesname wiedergegeben.
- source_word: עַל סַל הַמַּצּוֹת
  choice: zusammen mit dem Korb ungesäuerter Brote
  rationale: עַל bezeichnet hier die rituelle Begleitung, nicht bloß eine räumliche Lage. „Zusammen mit“ gibt diesen Zusammenhang klar wieder.
- source_word: מִנְחָתוֹ וְאֶת נִסְכּוֹ
  choice: das dazugehörige Speiseopfer und Trankopfer
  rationale: Die Suffixe beziehen sich auf den Opferkomplex. „Dazugehörig“ wahrt diesen Bezug, ohne im Deutschen durch „sein“ eine menschliche Bezugsperson nahezulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den in der Forschung üblichen deutschen Lautwert wieder, statt den Namen durch einen Titel zu ersetzen.
- issue: Wiedergabe von שְׁלָמִים
  choice: Heilsopfer
  alternative: Gemeinschaftsopfer; Friedensopfer
  rationale: Der Begriff bezeichnet eine Opfergattung, deren genaue Benennungsmotivation nicht völlig sicher ist. „Heilsopfer“ ist im Deutschen etabliert; die alternative Akzentuierung auf Gemeinschaft wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Gesetzessprache. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge der hebräischen Handlungen zu verändern; „auch“ verdeutlicht den anschließenden, zusätzlich genannten priesterlichen Vollzug.
