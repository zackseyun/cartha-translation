id: NUM.6.25
reference: Numbers 6:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: de
  text: Yahweh lasse sein Angesicht über dir leuchten und sei dir gnädig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Yahweh lasse sein Angesicht dir zugewandt leuchten und erweise dir Gunst.“'
    reason: Alternative Wiedergabe der Richtungsangabe אֵלֶיךָ und des Verbs חנן.
lexical_decisions:
- source_word: יָאֵר
  choice: lasse … leuchten
  rationale: Der Hifil-Jussiv von אור drückt innerhalb des Segens einen Wunsch aus und hat kausative Bedeutung. „Lasse … leuchten“ gibt beides im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: פָּנָיו
  choice: sein Angesicht
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten. „Angesicht“ ist im modernen Deutschen gehoben, aber verständlich und für den würdevollen Segensstil angemessen; „Gegenwart“ wäre bereits eine Deutung.
- source_word: אֵלֶיךָ
  choice: über dir
  rationale: Die Präposition bezeichnet hier die dem Gesegneten zugewandte Richtung. In Verbindung mit „leuchten“ ist „über dir“ eine natürliche deutsche Wiedergabe des Segensbildes, ohne dessen Sinn auf eine abstrakte Aussage zu reduzieren.
- source_word: וִיחֻנֶּךָּ
  choice: und sei dir gnädig
  rationale: חנן bezeichnet das Erweisen von Gnade oder Gunst. „Sei dir gnädig“ bewahrt den Wunschcharakter, die Bedeutung und den würdevollen Parallelismus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration „Yahweh“ bewahrt ihn als Eigennamen.
- issue: Anthropomorphe Wendung vom leuchtenden Angesicht
  choice: Das konkrete Bild im Haupttext bewahren
  alternative: Yahweh wende sich dir freundlich zu
  rationale: Das Hebräische beschreibt Gottes wohlwollende Zuwendung poetisch als das Leuchten seines Angesichts. Eine abstrakte Umschreibung würde die Bildkraft und theologische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter poetischer Bildsprache. „Angesicht“ ist gehoben, jedoch weder unverständlich noch unnötig altertümlich; die jussive Segensform wird durch „lasse“ und „sei“ wiedergegeben.
