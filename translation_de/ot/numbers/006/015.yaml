  text: וְ/סַ֣ל מַצּ֗וֹת סֹ֤לֶת חַלֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וּ/מִנְחָתָ֖/ם וְ/נִסְכֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/015.yaml
  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: de
  text: 'und einen Korb mit ungesäuertem Brot: Kuchen aus Feinmehl, mit Öl vermengt[a], und ungesäuerte Fladen, mit Öl bestrichen[b], sowie ihr Speiseopfer und ihre Trankopfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Öl gemischt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit Öl gesalbt«; hier bezeichnet das hebräische Verb das Auftragen von Öl bei der Zubereitung der Fladen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: Korb
  rationale: Das Substantiv bezeichnet hier das Behältnis für die ungesäuerten Backwaren; »Korb« ist die klare und natürliche Wiedergabe.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Der Begriff bezeichnet allgemein ungesäuerte Brotwaren. Da anschließend Kuchen und Fladen genannt werden, gibt die erste Verwendung sinnvoll die übergeordnete Kategorie wieder.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Dies ist der gebräuchliche Opferterminus für fein gemahlenes, hochwertiges Mehl.
- source_word: חַלֹּת
  choice: Kuchen
  rationale: Im Opferkontext sind geformte Backwaren gemeint, nicht große moderne Brotlaibe; »Kuchen« wahrt den Unterschied zu den dünnen Fladen.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das Partizip beschreibt das Vermischen des Mehls beziehungsweise Teigs mit Öl; »vermengt« ist präzise und in kultischen Vorschriften angemessen.
- source_word: רְקִיקֵי מַצּוֹת
  choice: ungesäuerte Fladen
  rationale: רְקִיקִים bezeichnet dünne, flache Backwaren. »Fladen« ist im heutigen Deutsch anschaulicher und natürlicher als »Oblaten«.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: mit Öl bestrichen
  rationale: Das Passivpartizip von משׁח bedeutet gewöhnlich »gesalbt«; bei der Zubereitung von Fladen bezeichnet es hier das Auftragen von Öl. »Bestrichen« gibt den konkreten Vorgang natürlich wieder, während die Fußnote die lexikalische Verbindung bewahrt.
- source_word: מִנְחָתָם
  choice: dem dazugehörigen Speiseopfer
  rationale: מִנְחָה ist in den Opferbestimmungen der feste Ausdruck für das Speiseopfer. Der Pluralsuffixbezug wird im Deutschen idiomatisch durch »dazugehörig« ausgedrückt.
- source_word: נִסְכֵּיהֶם
  choice: den dazugehörigen Trankopfern
  rationale: Der Ausdruck bezeichnet ausgegossene Flüssigkeitsopfer. »Trankopfer« ist der geläufige und verständliche deutsche Fachbegriff; »dazugehörig« gibt den pluralischen Suffixbezug idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe »Speiseopfer« und »Trankopfer« bleiben erhalten; die Satzstruktur folgt der hebräischen Aufzählung, wird aber durch »dazu« und »dazugehörig« im Deutschen flüssig verbunden.
