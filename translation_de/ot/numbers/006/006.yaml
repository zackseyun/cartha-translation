base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: de
  text: Während der ganzen Zeit, in der er für den HERRN abgesondert ist[a], darf er sich keinem Toten nähern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während seiner Nasiräerweihe“ oder „während der Zeit seines Nasiräergelübdes“. Das hebräische Wort bezeichnet den Zustand oder Zeitraum der Absonderung als Nasiräer.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „nefesch“ („Person“ bzw. „Lebewesen“) mit „tot“; gemeint ist ein verstorbener Mensch beziehungsweise ein menschlicher Leichnam.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: während der ganzen Zeit
  rationale: Die Wendung bezeichnet die gesamte Dauer der Absonderung; im Deutschen ist „während der ganzen Zeit“ natürlicher als die formale Wiedergabe „alle Tage“.
- source_word: הַזִּירוֹ
  choice: in der er … abgesondert ist
  rationale: Das Wort aus der Wurzel נזר bezeichnet hier den Zustand beziehungsweise Zeitraum seiner nasiräischen Absonderung. Die Formulierung bewahrt diesen Sinn, ohne im Haupttext ausdrücklich „Gelübde“ hinzuzufügen.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die Präposition kennzeichnet die Ausrichtung beziehungsweise Widmung an JHWH. „Für den HERRN“ ist im Deutschen idiomatisch; der Gottesname wird traditionsgemäß als „der HERR“ wiedergegeben.
- source_word: עַל נֶפֶשׁ מֵת
  choice: keinem Toten nähern
  rationale: Im Kontext der Reinheitsvorschriften bezeichnet נֶפֶשׁ מֵת einen verstorbenen Menschen beziehungsweise dessen Leichnam; mit בוא und עַל geht es um das Herantreten.
- source_word: לֹא יָבֹא
  choice: darf er sich … nicht nähern
  rationale: Der negierte Imperfekt formuliert in diesem Rechtstext ein Verbot. „Darf … nicht“ ist dafür klares, modernes Deutsch.
theological_decisions:
- issue: Wiedergabe der nasiräischen Terminologie ohne Überbestimmung
  choice: für den HERRN abgesondert
  alternative: sein Nasiräergelübde / seine Weihe
  rationale: Der hebräische Ausdruck bezeichnet unmittelbar die Absonderung beziehungsweise deren Dauer, während der Zusammenhang sie als nasiräisch erkennen lässt. Die Hauptfassung vermeidet, das hier nicht ausdrücklich stehende Wort „Gelübde“ einzutragen.
- issue: Wiedergabe von יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die traditionelle deutsche Wiedergabe „der HERR“ wahrt die erkennbare Besonderheit des Gottesnamens, ohne eine unsichere Vokalisierung in den Haupttext zu setzen.
- issue: Referent von נֶפֶשׁ מֵת
  choice: ein Toter
  alternative: ein Leichnam / eine tote Person
  rationale: Die Wendung meint im gesetzlichen Kontext einen menschlichen Toten. „Keinem Toten“ ist natürlich und lässt offen, ob der Akzent auf Annäherung an die verstorbene Person oder ihren Leichnam liegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zeitliche Konstruktion wurde idiomatisch entfaltet; die Rechtssprache bleibt durch „darf … nicht“ klar. Sämtliche Fußnotenmarker stehen unmittelbar bei den erklärten Ausdrücken.
