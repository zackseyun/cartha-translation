source:
  edition: WLC
  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: de
  text: So sollen sie meinen Namen auf die Israeliten legen,[a] und ich selbst werde sie segnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf die Söhne Israels«. Die Wendung »meinen Namen auf … legen« bezeichnet wahrscheinlich, dass der Name des HERRN über ihnen ausgerufen wird und sie als ihm zugehörig gekennzeichnet werden.'
    reason: lexikalische Alternative und kulturell-theologische Erläuterung
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: So sollen sie … legen
  rationale: שׂוּם bedeutet gewöhnlich »setzen, legen, anbringen«. »So« verbindet den Satz folgernd mit dem zuvor erteilten Auftrag zum priesterlichen Segen; »sollen« gibt hier den anweisenden Charakter der Verbform natürlich wieder.
- source_word: אֶת שְׁמִי
  choice: meinen Namen
  rationale: Die konkrete Rede vom Namen bleibt erhalten, weil sie Gottes Gegenwart, Zugehörigkeit und Bundesbeziehung anklingen lässt, ohne diese Bedeutungen auf eine einzige Deutung zu verengen.
- source_word: עַל
  choice: auf
  rationale: »Auf« bewahrt die räumliche Metapher des Hebräischen und ergibt zusammen mit »den Namen … legen« eine verständliche, bewusst feierliche Formulierung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht »die Söhne Israels«. Als feste Bezeichnung des gesamten Volkes ist »die Israeliten« im heutigen Deutsch natürlich und umfasst hier die ganze Gemeinschaft.
- source_word: וַאֲנִי
  choice: und ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen אֲנִי trägt Nachdruck; »ich selbst« macht deutlich, dass Gott der eigentlich Segnende ist.
- source_word: אֲבָרֲכֵם
  choice: werde sie segnen
  rationale: Die Form von ברך bezeichnet Gottes zugesagtes Segnen; das deutsche Futur gibt die anschließende göttliche Zusage klar wieder.
theological_decisions:
- issue: Bedeutung des Auflegens von Gottes Namen
  choice: Die konkrete Wendung »meinen Namen auf die Israeliten legen« bleibt im Haupttext stehen.
  alternative: »meinen Namen über ihnen ausrufen« oder »sie als mein Eigentum kennzeichnen«
  rationale: Die Wendung kann Anrufung des göttlichen Namens, Bundeszugehörigkeit und göttlichen Schutz beziehungsweise Segen umfassen. Eine erklärende Paraphrase würde diese Bedeutungsfülle unnötig auf eine Lesart festlegen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / das Volk Israel
  rationale: Die hebräische Wendung ist ein übliches Ethnonym für die gesamte Bundesgemeinschaft. »Die Israeliten« gibt ihren kollektiven Bezug im modernen Standarddeutsch präzise und ohne den möglichen Eindruck wieder, nur männliche Nachkommen seien gemeint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst konkrete und leicht ungewohnte Namensmetapher bleibt erhalten; die Fußnote erläutert sie, ohne die mögliche theologische Bedeutungsbreite im Haupttext einzuengen.
