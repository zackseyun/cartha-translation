lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: segne dich
  rationale: Der Piel-Jussiv der 3. Person Singular mit Suffix der 2. Person Singular hat in diesem Segensspruch volitiven Charakter. Der deutsche Konjunktiv „segne“ gibt dies knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: וְיִשְׁמְרֶךָ
  choice: und behüte dich
  rationale: Der Qal-Jussiv von שמר bezeichnet hier schützendes Bewahren. „Behüte dich“ ist natürlich, würdevoll und bewahrt den knappen Parallelismus des Segensspruchs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Knappe, poetische und würdige Segenssprache in modernem Standarddeutsch. Der Konjunktiv gibt den hebräischen Jussiv wieder; „behüten“ vermittelt den Gedanken schützenden Bewahrens.
