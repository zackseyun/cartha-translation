  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: de
  text: Der Priester soll sie als Schwingopfer vor Jahwe schwingen. Es ist dem Priester heilig, zusätzlich zur Brust des Schwingopfers und zum Schenkel der Abgabe. Danach darf der Nasiräer Wein trinken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Danach wird der Nasiräer Wein trinken.“ Im Zusammenhang ist damit gemeint, dass er nach Abschluss seines Gelübdes wieder Wein trinken darf.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: soll sie als Schwingopfer ... schwingen
  rationale: Die Hifilform von נוף bezeichnet im Opferkult das rituelle Schwingen beziehungsweise Darbringen; die deutsche Wiedergabe bewahrt die hebräische Wortverbindung.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet hier „vor“ beziehungsweise „in der Gegenwart von“; der Gottesname יהוה wird als Jahwe wiedergegeben.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: Es ist eine heilige Gabe für den Priester
  rationale: Das singularische הוּא wird gewahrt; „Gabe“ verdeutlicht im Deutschen, dass der geschwungene Anteil als geheiligter Priesteranteil bestimmt ist.
- source_word: עַל
  choice: zusätzlich zu
  rationale: Die Präposition bezeichnet in dieser Zuteilungsformel eine Ergänzung zu den bereits dem Priester zustehenden Opferanteilen.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: Brust des Schwingopfers
  rationale: Formnahe Wiedergabe des kultischen Fachausdrucks für den geschwungenen Brustanteil.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: Schenkel der Abgabe
  rationale: שׁוֹק bezeichnet den Schenkel beziehungsweise oberen Beinabschnitt; תְּרוּמָה ist eine ausgesonderte und dargebrachte Abgabe. „Abgabe“ ist verständlicher als der traditionelle Ausdruck „Hebopfer“.
- source_word: וְאַחַר יִשְׁתֶּה
  choice: Danach darf ... wieder trinken
  rationale: Der Kontext zeigt, dass nach Abschluss des Rituals das während des Gelübdes geltende Verbot aufgehoben ist; „darf ... wieder“ drückt diese wiederhergestellte Erlaubnis natürlich aus.
- source_word: הַנָּזִיר
  choice: der Nasiräer
  rationale: Eingebürgerte deutsche Bezeichnung für eine Person unter dem in Numeri 6 beschriebenen Nasiräergelübde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname im hebräischen Text wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft von יִשְׁתֶּה im Schlusssatz
  choice: darf wieder Wein trinken
  alternative: wird/soll Wein trinken
  rationale: Im gesetzlichen Zusammenhang bezeichnet die Form die nach Beendigung des Gelübdes wieder bestehende Erlaubnis, ohne ein Gebot zum Weingenuss auszudrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachbegriffe werden soweit möglich formnah wiedergegeben; „Abgabe“ vermeidet das heute schwer verständliche „Hebopfer“. Der anaphorische Plural „sie“ verweist auf die in Vers 19 genannten Opferbestandteile.
