  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: de
  text: 'Und dies ist die Weisung für den Nasiräer: Am Tag, an dem die Tage seiner Absonderung erfüllt sind,[a] soll man ihn zum Eingang des Zeltes der Begegnung bringen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Tage seines Nasiräergelübdes“; auch: „die Zeit seiner Weihe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „soll er ihn zum Eingang des Zeltes der Begegnung bringen“. Das Hebräische verwendet ein aktives Verb; wer mit „er“ gemeint ist, wird in diesem Vers nicht ausdrücklich gesagt.'
    reason: source_form_ambiguity
lexical_decisions:
- source_word: וְזֹאת
  choice: Und dies ist
  rationale: Die Verbindung aus Konjunktion und Demonstrativ leitet eine rechtliche Bestimmung ein; „Und dies ist“ bewahrt sowohl den Anschluss als auch den feierlich-rechtlichen Ton.
- source_word: תּוֹרַת
  choice: die Weisung für
  rationale: תּוֹרָה bezeichnet hier eine verbindliche kultische Anweisung. „Weisung“ gibt den Sinn natürlich wieder, ohne den Ausdruck auf ein modernes Gesetzesverständnis zu verengen.
- source_word: הַנָּזִיר
  choice: den Nasiräer
  rationale: „Nasiräer“ ist im Deutschen die etablierte Bezeichnung für die besondere, in Numeri 6 geregelte Form der Weihe.
- source_word: בְּיוֹם
  choice: An dem Tag
  rationale: Die ausdrückliche hebräische Zeitangabe wird formal bewahrt und nicht lediglich mit „wenn“ wiedergegeben.
- source_word: מְלֹאת יְמֵי נִזְרוֹ
  choice: an dem die Tage seiner Weihe vollendet sind
  rationale: Die Formulierung bewahrt das hebräische Bild von den voll gewordenen beziehungsweise abgeschlossenen Tagen und gibt נִזְרוֹ als den besonderen Weihe- und Absonderungszustand des Nasiräers wieder.
- source_word: יָבִיא אֹתוֹ
  choice: soll er … gebracht werden
  rationale: Die hebräische Verbform ist aktiv („er soll ihn bringen“), doch ihr Subjekt bleibt unausgesprochen. Das deutsche Passiv gibt den Verfahrenssinn verständlich wieder, ohne ein bestimmtes Subjekt einzusetzen; die formale Alternative wird in einer Fußnote genannt.
- source_word: אֶל פֶּתַח
  choice: zum Eingang
  rationale: פֶּתַח bezeichnet den Eingang beziehungsweise die Öffnung; „Eingang“ ist in diesem Heiligtumskontext natürlich und präzise.
- source_word: אֹהֶל מוֹעֵד
  choice: des Zeltes der Begegnung
  rationale: Diese Wiedergabe bewahrt die Bestandteile der festen hebräischen Bezeichnung und ist im Deutschen verständlich.
theological_decisions:
- issue: Bedeutung der Wortgruppe נָזִיר / נֵזֶר in Numeri 6
  choice: „Nasiräer“ für die Person und „Weihe“ für ihren besonderen Zustand
  alternative: „Abgesonderter“ und „Absonderung“ oder durchgehend „Nasiräergelübde“
  rationale: „Nasiräer“ erhält den Namen der besonderen israelitischen Einrichtung. „Weihe“ macht verständlich, dass es sich um ein Gott geweihtes Abgesondertsein handelt, ohne die Formulierung ausschließlich auf den Akt des Gelübdes einzuengen. Die anderen möglichen Nuancen werden in der Fußnote offengehalten.
- issue: Diathese von יָבִיא אֹתוֹ
  choice: 'Passiv: „soll er … gebracht werden“'
  alternative: 'Aktiv: „soll er ihn … bringen“'
  rationale: Der hebräische Text verwendet formal ein aktives Verb, benennt dessen Subjekt an dieser Stelle jedoch nicht. Das Passiv vermeidet eine unbegründete Festlegung und hält den Nasiräer als die zum Heiligtum gebrachte Person im Mittelpunkt; die formale Lesart bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-kultischem Ton. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch die wiederholte Zeitangabe „an dem Tag, an dem“ idiomatisch verständlich. Fachsprache wird nur beim etablierten Ausdruck „Nasiräer“ beibehalten.
