lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Wayyiqtol führt einen neuen Erzählschritt ein. „sprach“ ist in dieser göttlichen Redeeinleitung würdig und präzise; das folgende לֵאמֹר wird im Deutschen idiomatisch durch den Doppelpunkt wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen verwendete Eigenname erhalten bleibt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten des Sprechens; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die formelhafte Einleitung der folgenden direkten Rede wird in natürlichem modernem Deutsch durch einen Doppelpunkt ausgedrückt; „indem er sagte“ wäre unnötig schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen JHWH. „Jahwe“ bewahrt diesen Eigennamen, während „der HERR“ die traditionelle Ersatzlesung darstellt und in der Fußnote dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitung bleibt erhalten; לֵאמֹר wird gemäß natürlichem deutschen Sprachgebrauch typografisch durch den Doppelpunkt ausgedrückt.
