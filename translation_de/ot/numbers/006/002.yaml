source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: de
  text: 'Rede zu den Israeliten und sag ihnen: Wenn ein Mann oder eine Frau ein besonderes Gelübde ablegt, ein Nasiräergelübde[a], um sich Jahwe zu weihen[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich durch ein Gelübde absondert, indem er oder sie ein Nasiräergelübde ablegt«.'
    reason: lexical_alternative
  - marker: b
    text: Ein Nasiräer oder eine Nasiräerin war durch ein besonderes Gelübde für Jahwe abgesondert.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt die gemeinte Volksgemeinschaft präzise wieder; eine wörtliche Wiedergabe als »Söhne Israels« könnte hier fälschlich nur Männer nahelegen.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ein Mann oder eine Frau
  rationale: Der hebräische Text nennt ausdrücklich beide Geschlechter; diese rechtliche Einschließlichkeit bleibt erhalten.
- source_word: כִּי
  choice: wenn
  rationale: In der kasuistischen Rechtsform leitet כִּי einen möglichen Fall ein; »wenn« ist im Deutschen natürlich und bewahrt den bedingten Sinn.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: ein besonderes Gelübde ablegt
  rationale: Die Hifil-Form von פלא bezeichnet hier etwas Besonderes beziehungsweise Außergewöhnliches; zusammen mit der figura etymologica des Gelobens ergibt sich diese klare deutsche Formulierung.
- source_word: נֶדֶר נָזִיר
  choice: das Gelübde eines Nasiräers
  rationale: Die Formulierung bewahrt die hebräische Genitivbeziehung und den technischen Begriff für die in Numeri 6 geregelte Weihe.
- source_word: נָזִיר
  choice: Nasiräer
  rationale: »Nasiräer« ist im Deutschen die etablierte Bezeichnung für eine Person, die durch dieses besondere Gelübde abgesondert ist; sie ist von »Nazarener« zu unterscheiden.
- source_word: לְהַזִּיר
  choice: um sich zu weihen
  rationale: Das Verb bezeichnet das Sich-Absondern beziehungsweise Sich-Weihen. »Sich weihen« vermittelt den religiösen Zweck natürlich; die Fußnote hält den Aspekt der Absonderung fest.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Weihe auf Jahwe; der Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; »Jahwe« gibt den Bundesnamen als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Geschlechtliche Reichweite der Vorschrift
  choice: »ein Mann oder eine Frau« ausdrücklich beibehalten; anschließend reflexives »sich«
  alternative: »jemand« oder eine nur männliche Formulierung
  rationale: Beide Geschlechter werden im Ausgangstext ausdrücklich genannt. Das deutsche »sich« bezieht sich ohne zusätzliche Festlegung auf Mann wie Frau.
- issue: Verhältnis von Weihe und Absonderung im Nasiräergelübde
  choice: im Haupttext »sich weihen«, in der Fußnote die Absonderung erläutern
  alternative: im Haupttext »sich absondern«
  rationale: Beide Bedeutungsaspekte gehören zum Wortfeld נזר. Die gewählte Fassung drückt die Hinwendung zu Jahwe natürlich aus, ohne den Aspekt der besonderen Absonderung zu verlieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die kasuistische Rechtsform bleiben erhalten. »Israeliten« vermeidet eine im Deutschen missverständliche geschlechtliche Verengung; »Nasiräer« bewahrt den etablierten Fachbegriff.
