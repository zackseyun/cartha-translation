source:
  edition: WLC
  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: de
  text: Wenn aber jemand ganz plötzlich neben ihm stirbt[a] und dadurch sein geweihtes Haupt[b] unrein wird, soll er sich am Tag seiner Reinigung den Kopf scheren; am siebten Tag soll er ihn scheren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen eine verstärkte Wendung: „wenn ein Toter neben ihm stirbt, plötzlich, unvermittelt“. Gemeint ist ein abrupter, unerwarteter Todesfall in seiner unmittelbaren Nähe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Haupt seiner Weihe“. Der hebräische Ausdruck verbindet das Haupt beziehungsweise das ungeschnittene Haar eng mit seiner Nasiräerweihe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn aber
  rationale: Leitet innerhalb der Nasiräerbestimmungen einen möglichen Ausnahmefall ein; „aber“ markiert den Gegensatz zum vorausgesetzten ungestörten Verlauf der Weihe.
- source_word: יָמוּת מֵת
  choice: jemand stirbt
  rationale: Die Verbindung aus dem Verb „sterben“ und dem verwandten Substantiv „Toter“ ist im Hebräischen idiomatisch; im Deutschen wird sie natürlich als „jemand stirbt“ wiedergegeben.
- source_word: עָלָיו
  choice: neben ihm
  rationale: Im Zusammenhang der Verunreinigung durch einen Todesfall bezeichnet die Präposition unmittelbare Nähe, ohne zwingend einen körperlichen Kontakt auszusagen.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: ganz plötzlich
  rationale: Die Häufung zweier Ausdrücke für Plötzlichkeit betont den abrupten und unerwarteten Eintritt des Todes; „ganz plötzlich“ bildet diese Verstärkung idiomatisch ab.
- source_word: וְטִמֵּא
  choice: und dadurch … unrein wird
  rationale: Die hebräische Form ist transitiv („und er/es verunreinigt“), doch der handelnde Bezug kann im Satzfluss auf den Todesfall beziehungsweise den Sterbenden bezogen werden. Die deutsche Ergebnisformulierung gibt die verursachte kultische Unreinheit klar wieder, ohne den Verstorbenen als absichtlich Handelnden erscheinen zu lassen.
- source_word: רֹאשׁ נִזְרוֹ
  choice: sein geweihtes Haupt
  rationale: נֵזֶר bezeichnet hier die Nasiräerweihe, die besonders am ungeschnittenen Haar sichtbar ist. „Geweihtes Haupt“ bewahrt die enge Verbindung von Kopf und Weihe, ohne den Ausdruck vorschnell ausschließlich auf Haar oder Gelübde zu reduzieren.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: soll er sein Haupt … rasieren
  rationale: Die Rechtsfolge wird in natürlichem deutschem Gesetzesstil mit „soll“ formuliert; „sein Haupt rasieren“ hält den Bezug zum zuvor genannten geweihten Haupt fest.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: am Tag seiner Reinigung
  rationale: Der Ausdruck bezeichnet die rituelle Reinigung nach eingetretener Unreinheit. „Reinigung“ ist verständlich und wahrt den kultischen Zusammenhang.
- source_word: בַּיּוֹם הַשְּׁבִיעִי יְגַלְּחֶנּוּ
  choice: am siebten Tag soll er es rasieren
  rationale: Die Wiederholung der Rasieranweisung samt genauer Zeitangabe bleibt erhalten; das Pronomen „es“ bezieht sich auf das Haupt.
theological_decisions:
- issue: Bedeutung der Nasiräerweihe und ihrer Verunreinigung
  choice: 'נזר wird als Weihebegriff gefasst: „sein geweihtes Haupt“.'
  alternative: „der Kopf seiner Absonderung“, „das Haupt seines Gelübdes“ oder ausschließlich „sein geweihtes Haar“
  rationale: Der Vers behandelt eine kultische Verunreinigung, welche die Nasiräerweihe unterbricht. Die gewählte Fassung hält die Verbindung zwischen Haupt, ungeschnittenem Haar und Weihe offen, ohne spätere dogmatische Kategorien oder eine im Ausdruck nicht ausdrücklich genannte Deutung als Gelübde einzutragen.
- issue: Verursacher der Verunreinigung
  choice: 'Der plötzliche Todesfall wird als Ursache dargestellt: „und dadurch … unrein wird“.'
  alternative: „und er verunreinigt sein geweihtes Haupt“
  rationale: Die Alternative bildet die transitive Verbform formaler ab, lässt im Deutschen aber missverständlich den Sterbenden als gezielt handelndes Subjekt erscheinen. Die Ergebnisformulierung bewahrt den sachlichen Zusammenhang der kultischen Verunreinigung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haupt“ ist hier bewusst gewählt, weil die kultisch geprägte Verbindung von Kopf, Haar und Weihe mit dem alltäglicheren „Kopf“ weniger gut zur Geltung käme. Die Satzfolge bewahrt die rechtliche Anweisung und die im Hebräischen vorhandene Wiederholung der Rasur am siebten Tag.
