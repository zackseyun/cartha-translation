source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: de
  text: Er soll dem HERRN die Tage seiner Nasiräerweihe[a] erneut weihen und ein einjähriges männliches Lamm als Schuldopfer bringen. Die früheren Tage aber verfallen[b], weil seine Nasiräerweihe verunreinigt worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Tage seiner Absonderung“ oder „die Tage seiner Weihe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Die ersten Tage werden fallen“; gemeint ist, dass die zuvor erfüllten Tage nicht mehr angerechnet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר לַיהוָה אֶת יְמֵי נִזְרוֹ
  choice: Er soll die Tage seiner Nasiräerweihe dem HERRN neu weihen
  rationale: Das Hifil von נזר bezeichnet hier nach der Unterbrechung die erneute Aufnahme der geweihten Absonderung. „Neu weihen“ gibt diesen Kontext wieder; „Nasiräerweihe“ wahrt den institutionellen Sinn und zugleich den Gedanken der Weihe.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: ein einjähriges männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet hier ein männliches Lamm; בֶּן שְׁנָתוֹ bedeutet, dass es in seinem ersten Lebensjahr steht.
- source_word: לְאָשָׁם
  choice: als Schuldopfer
  rationale: „Schuldopfer“ ist die geläufige Bezeichnung für die Opferkategorie אָשָׁם und bewahrt den kultisch-rechtlichen Charakter.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: Die früheren Tage aber verfallen
  rationale: יִפְּלוּ bedeutet wörtlich „fallen“, bezeichnet hier aber die rechtliche Folge, dass die vor der Verunreinigung abgeleisteten Tage nicht mehr angerechnet werden. „Verfallen“ ist knapp und idiomatisch.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: weil seine Nasiräerweihe unrein geworden ist
  rationale: Das Verb bezeichnet rituelle Verunreinigung. Die resultative deutsche Formulierung wahrt, dass die Nasiräerweihe durch das vorausgehende Ereignis verunreinigt wurde.
theological_decisions:
- issue: Wiedergabe von נזר im Gesetz über die Nasiräer
  choice: Nasiräerweihe
  alternative: Absonderung; Weihe; Nasiräergelübde
  rationale: Im Kontext von Numeri 6 ist der Ausdruck institutionell und bezeichnet den geweihten Stand des Nasiräers. „Nasiräerweihe“ bewahrt sowohl die kultische Besonderheit als auch den Grundgedanken geweihter Absonderung, ohne den Ausdruck auf den bloßen Gelübdeakt zu verengen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die konventionelle Wiedergabe „der HERR“ kennzeichnet den Gottesnamen und entspricht der vorgegebenen Terminologie.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Rechtsstil, während „neu weihen“ und „verfallen“ die aus dem Zusammenhang erkennbare Wirkung natürlich ausdrücken. Die Fußnoten bewahren die wörtlichere und lexikalisch weitere Lesart.
