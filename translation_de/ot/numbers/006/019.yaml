base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: de
  text: Dann soll der Priester die gekochte Vorderkeule vom Widder nehmen, dazu einen ungesäuerten Brotlaib aus dem Korb und einen ungesäuerten Fladen, und alles auf die Handflächen des Nasiräers legen, nachdem dieser sein Weihehaar[a] abgeschoren hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seine Weihe«. Gemeint ist hier das Haar, das als sichtbares Zeichen seiner Nasiräerweihe diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  choice: Dann soll der Priester ... nehmen
  rationale: Die Abfolge des Rituals wird im modernen Deutschen natürlich mit „Dann soll“ wiedergegeben; כֹּהֵן bezeichnet den kultischen Priester.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: die gekochte Vorderkeule
  rationale: זְרוֹעַ bezeichnet hier den Vorderlauf beziehungsweise die Schulterpartie des Opfertiers; „Vorderkeule“ ist als Fleischstück präziser als das allgemeinere „Schulter“. בְּשֵׁלָה wird als „gekocht“ wiedergegeben.
- source_word: חַלַּת מַצָּה אַחַת
  choice: einen ungesäuerten Brotlaib
  rationale: חַלָּה bezeichnet ein einzelnes Brot beziehungsweise einen Brotlaib; מַצָּה kennzeichnet ihn als ungesäuert.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: einen ungesäuerten Fladen
  rationale: רָקִיק ist ein dünnes Backwerk. „Fladen“ ist im Deutschen natürlich und bewahrt den Unterschied zum Brotlaib.
- source_word: וְנָתַן עַל כַּפֵּי
  choice: und alles auf die Handflächen ... legen
  rationale: כַּפַּיִם meint konkret die Handflächen. Das ergänzte „alles“ fasst die zuvor genannten Stücke natürlich zusammen, ohne den Sinn zu erweitern.
- source_word: הַנָּזִיר
  choice: des Nasiräers
  rationale: „Nasiräer“ ist die etablierte deutsche Bezeichnung für eine Person unter dem in diesem Abschnitt beschriebenen Weihegelübde.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: nachdem dieser ... abgeschoren hat
  rationale: Die Infinitivkonstruktion bezeichnet eine bereits vollzogene Rasur. „Dieser“ macht den Bezug auf den Nasiräer eindeutig.
theological_decisions:
- issue: Bedeutung von נִזְרוֹ im Zusammenhang mit der Nasiräerweihe
  choice: sein Weihezeichen
  alternative: seine Weihe; das Haar seiner Weihe
  rationale: Wörtlich bezeichnet נֵזֶר die Weihe beziehungsweise Absonderung, doch im unmittelbaren Ritualzusammenhang ist das abgeschorene Haar als sichtbares Zeichen dieser Weihe gemeint. „Weihezeichen“ bewahrt die symbolische Verbindung, ohne „Kopf“ in den hebräischen Text einzutragen; die Fußnote legt die Verdichtung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Ritualsprache. Die Satzfolge bleibt eng am Hebräischen, während „dazu“ und „alles“ die Aufzählung im Deutschen flüssig und eindeutig machen.
