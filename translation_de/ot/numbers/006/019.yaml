  terminology: „Priester“, „Widder“, „ungesäuert“, „Handflächen“ und „Nasiräer“ sind angemessen. „Weihehaar“ ist hier der geeignete kontextuelle Ausdruck für נִזְרוֹ; die Fußnote muss die wörtlichere Formulierung „seine Weihe“ dokumentieren.
