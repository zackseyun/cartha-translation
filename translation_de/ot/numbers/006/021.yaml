source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: de
  text: Dies ist die Weisung für den Nasiräer, der Jahwe für seine Nasiräerweihe eine Opfergabe gelobt, neben dem, was er aufzubringen vermag.[a] Entsprechend dem Gelübde, das er ablegt, soll er handeln, gemäß der Weisung für seine Nasiräerweihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »neben dem, was seine Hand erreicht«; gemeint ist, was er nach seinen Mitteln aufzubringen vermag.'
    reason: Die hebräische Wendung verwendet das Bild der „Hand“ für die verfügbaren Mittel. Die Fußnote erläutert das Idiom, ohne das genaue Verhältnis der Gabe zu den Mitteln über den knappen Wortlaut hinaus festzulegen.
lexical_decisions:
- source_word: תּוֹרַת הַנָּזִיר
  choice: die Weisung für den Nasiräer
  rationale: תּוֹרָה bezeichnet hier die verbindliche Vorschrift für den Nasiräer. „Weisung“ bewahrt den rechtlich-lehrhaften Sinn, ohne das Wort auf modernes Gesetzesrecht zu verengen; „Nasiräer“ ist der etablierte Fachbegriff.
- source_word: קָרְבָּנוֹ לַיהוָה
  choice: seine Opfergabe für Jahwe
  rationale: קָרְבָּן ist eine dargebrachte Gabe; „Opfergabe“ ist im kultischen Zusammenhang eindeutig. ל bezeichnet die Bestimmung der Gabe für Jahwe.
- source_word: עַל נִזְרוֹ
  choice: aufgrund seiner Nasiräerweihe
  rationale: נֵזֶר bezeichnet hier die besondere Absonderung bzw. Weihe des Nasiräers. „Aufgrund“ gibt den Zusammenhang der vorgeschriebenen Opfergabe mit dieser Weihe wieder.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: kommt zu dem hinzu, was er außerdem aufbringen kann
  rationale: Die Wendung bezeichnet das, was jemand nach seinen Mitteln zusätzlich leisten kann. Die Formulierung lässt im Kontext erkennen, dass die eigens gelobte Gabe über die reguläre Vorschrift hinausgeht; die wörtliche Bildsprache steht in der Fußnote.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: Wie es dem Gelübde entspricht, das er ablegt
  rationale: כְּפִי drückt Übereinstimmung mit dem Inhalt bzw. Umfang des Gelübdes aus. Die Wiederholung der Gelübdesprache bleibt erhalten.
- source_word: כֵּן יַעֲשֶׂה
  choice: so soll er handeln
  rationale: Die Formulierung gibt die verpflichtende Kraft des hebräischen Imperfekts im rechtlichen Kontext in natürlichem Deutsch wieder.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: über die Weisung für seine Nasiräerweihe hinaus
  rationale: עַל kann hier einen Zusatz zur vorgeschriebenen Nasiräerordnung ausdrücken. Die Wiedergabe fügt sich in den Kontrast zwischen der regulären Vorschrift und dem individuellen Gelübde ein, ohne die syntaktische Schwierigkeit zu verdecken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis des persönlichen Gelübdes zur vorgeschriebenen Nasiräerordnung
  choice: Das individuell Gelobte gilt zusätzlich zur regulären Weisung
  alternative: Die Opfergabe für die Nasiräerweihe wird lediglich nach den verfügbaren Mitteln bemessen
  rationale: Die Stellung von מִלְּבַד und der abschließende Ausdruck עַל תּוֹרַת נִזְרוֹ sprechen dafür, eine zusätzliche, freiwillig gelobte Leistung neben der vorgeschriebenen Ordnung zu verstehen. Die kompakte hebräische Syntax bleibt jedoch auslegungsfähig; deshalb wird die wörtliche Wendung in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlichem Ton. Die Wiederholung von „Gelübde“ und „Weisung“ bildet die formelhafte Struktur des Hebräischen ab; unnötige Archaismen werden vermieden.
