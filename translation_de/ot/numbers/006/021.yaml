  source_fidelity: 'Die Grundbegriffe sind überwiegend zutreffend wiedergegeben: תּוֹרָה als „Weisung“, נָזִיר als „Nasiräer“, קָרְבָּן als „Opfergabe“ und יהוה als „Jahwe“. Die Wiedergabe der abschließenden Präposition עַל mit „über … hinaus“ ist jedoch nicht haltbar: Die Formel עַל תּוֹרַת נִזְרוֹ bindet das Handeln an die Weisung für seine Nasiräerweihe an, nicht an ein Handeln über diese Weisung hinaus. Auch die Einleitung des Entwurfs gestaltet die syntaktisch knappe Beziehung zwischen der gelobten Opfergabe und den verfügbaren Mitteln zu stark als festes Zusatzverhältnis aus.'
