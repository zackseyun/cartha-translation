  terminology: „Nasiräer“, „Nasiräerweihe“, „Gelübde“, „Opfergabe“, „Weisung“ und „Jahwe“ sind konsistent und für modernes Standarddeutsch angemessen. „Gemäß der Weisung“ gibt die Schlussformel sachgerecht wieder.
