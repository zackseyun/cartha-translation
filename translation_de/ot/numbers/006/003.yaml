source:
  edition: WLC
  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: de
  text: Er soll sich von Wein und berauschendem Getränk fernhalten. Weder Weinessig noch Essig aus berauschendem Getränk soll er trinken. Auch keinerlei Traubenaufguss[a] soll er trinken und weder frische noch getrocknete Trauben[b] essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Traubensaft“ beziehungsweise „Flüssigkeit aus eingeweichten Trauben“. Das hebräische Wort bezeichnet eine aus eingeweichten oder verarbeiteten Trauben gewonnene Flüssigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Trauben, frische und getrocknete“; getrocknete Trauben sind Rosinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: Er soll sich von Wein und berauschendem Getränk fernhalten
  rationale: Das Hifil von נזר bezeichnet hier das Sichfernhalten bzw. Enthalten. „Berauschendes Getränk“ bewahrt die Unterscheidung zwischen שֵׁכָר und gewöhnlichem Wein, ohne eine bestimmte Getränkeart vorauszusetzen.
- source_word: חֹמֶץ יַיִן
  choice: Weinessig
  rationale: Die knappe deutsche Zusammensetzung gibt die hebräische Genitivverbindung natürlich wieder; חֹמֶץ kann sauren Wein beziehungsweise Essig bezeichnen.
- source_word: וְחֹמֶץ שֵׁכָר
  choice: Essig aus berauschendem Getränk
  rationale: Die Wiedergabe erhält die Parallelität zu Weinessig und macht die Herkunft des sauren Getränks verständlich.
- source_word: וְכָל מִשְׁרַת עֲנָבִים
  choice: auch keinerlei Traubenaufguss
  rationale: מִשְׁרָה bezeichnet dem Wortlaut nach eine durch Einweichen gewonnene Flüssigkeit. „Traubenaufguss“ wahrt diese Bedeutung; die mögliche weitere oder kontextuelle Auffassung als Traubensaft wird in der Fußnote genannt.
- source_word: וַעֲנָבִים לַחִים וִיבֵשִׁים לֹא יֹאכֵל
  choice: und weder frische noch getrocknete Trauben essen
  rationale: „Frisch“ und „getrocknet“ geben den Gegensatz von לַחִים und יְבֵשִׁים wieder. Die deutsche Konstruktion „weder … noch“ drückt unter der Verneinung natürlich aus, dass beide Formen verboten sind.
theological_decisions:
- issue: Umfang des nasiräischen Verzichts
  choice: Die Reihe wird ohne Einschränkung auf alkoholische Getränke wiedergegeben.
  alternative: Die Vorschrift als bloßes Alkoholverbot formulieren.
  rationale: Der hebräische Text nennt ausdrücklich auch Essig, Traubenflüssigkeit sowie frische und getrocknete Trauben. Die Übersetzung bewahrt daher den umfassenderen, an Traubenprodukten orientierten Verzicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Berauschendes Getränk“ ist verständlicher als das altertümliche „starkes Getränk“; „Traubenaufguss“ bleibt quellennah und wird durch eine Fußnote erläutert. Alle Fußnotenmarker stehen unmittelbar bei den erklärten Ausdrücken.
