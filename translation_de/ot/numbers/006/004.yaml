source:
  edition: WLC
  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: de
  text: Während der ganzen Zeit seiner Nasiräerweihe darf er nichts essen, was vom Weinstock stammt, von den Kernen bis zur Schale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Kernen bis zur Schale“; damit ist jeder Bestandteil der Traube gemeint.'
    reason: Die Anmerkung erklärt die umfassende Bedeutung der hebräischen Spannweitenformel.
lexical_decisions:
- source_word: נִזְרוֹ
  choice: seiner Nasiräerweihe
  rationale: Das Substantiv bezeichnet hier im unmittelbaren Zusammenhang von Numeri 6 die besondere Weihe beziehungsweise Absonderung eines Nasiräers. „Nasiräerweihe“ gibt sowohl den institutionellen als auch den religiösen Sinn knapp und verständlich wieder.
- source_word: כֹּל יְמֵי
  choice: Während der ganzen Zeit
  rationale: Die Wendung bezeichnet die vollständige Dauer der Nasiräerweihe. Diese Formulierung ist im Deutschen natürlicher als das wörtlichere „alle Tage“.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה מִגֶּפֶן הַיַּיִן
  choice: nichts …, was vom Weinstock stammt
  rationale: Das negierte Verb trägt das Verbot; „nichts“ bildet dies im Deutschen idiomatisch ab. „Vom Weinstock stammt“ erfasst das vom Weinstock Hervorgebrachte, ohne das Hebräische unnatürlich als „gemacht wird“ wiederzugeben.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: von den Kernen bis zur Schale
  rationale: Die Spannweitenformel nennt die Kerne und die Schale als äußere Endpunkte und schließt damit jeden Bestandteil der Traube ein. Die bildhafte Ausdrucksweise bleibt im Haupttext erhalten.
- source_word: לֹא יֹאכֵל
  choice: darf er nichts essen
  rationale: Der negierte Imperfekt hat in diesem Gesetzestext verbietende Kraft. „Darf … nichts essen“ gibt das Verbot in modernem, würdigem Standarddeutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar erkennbarem Gesetzescharakter. Der technische Ausdruck „Nasiräerweihe“ bleibt erhalten; die hebräische Spannweitenformel wird nicht aufgelöst, sondern in einer Fußnote erläutert.
