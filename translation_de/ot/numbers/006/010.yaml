  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יָבִא֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/010.yaml
  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: de
  text: Und am achten Tag soll er zwei Turteltauben oder zwei junge Tauben[a] zum Priester an den Eingang des Zeltes der Begegnung bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwei Söhne einer Taube“; die hebräische Wendung bezeichnet junge Tauben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: Und am achten Tag
  rationale: Die Verbindung aus Konjunktion, Präposition und Zeitangabe führt die vorherigen Anweisungen fort; im Deutschen ist „Und am achten Tag“ natürlich und wahrt den zeitlichen Ablauf.
- source_word: יָבִא
  choice: soll er … bringen
  rationale: Das Hifil-Imperfekt hat hier im gesetzlichen Kontext anweisende Kraft. „soll“ gibt diese verbindliche Vorschrift in natürlichem modernem Deutsch wieder.
- source_word: שְׁתֵּי תֹרִים
  choice: zwei Turteltauben
  rationale: תֹרִים bezeichnet spezifisch Turteltauben und nicht lediglich Tauben im Allgemeinen.
- source_word: אוֹ
  choice: oder
  rationale: Die Konjunktion bezeichnet die zulässige Alternative zwischen den beiden Opfergaben.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: zwei junge Tauben
  rationale: Die wörtliche Wendung „zwei Söhne einer Taube“ ist eine idiomatische Bezeichnung für junge Tauben; die natürliche deutsche Wiedergabe bewahrt den sachlichen Sinn.
- source_word: אֶל הַ/כֹּהֵן
  choice: zum Priester
  rationale: Die Präposition bezeichnet das Ziel des Bringens; „zum Priester“ ist präzise und idiomatisch.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: an den Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet Eingang oder Öffnung. „Zelt der Begegnung“ gibt die etablierte kultische Bezeichnung אֹהֶל מוֹעֵד transparent und würdig wieder.
