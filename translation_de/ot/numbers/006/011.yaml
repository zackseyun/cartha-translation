  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: de
  text: Und der Priester soll die eine als Sündopfer[a] und die andere als Brandopfer darbringen und für ihn Sühne erwirken, weil er wegen eines Toten schuldig geworden ist[b]; und er soll sein Haupt an diesem Tag heiligen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort kann besonders im Zusammenhang mit ritueller Unreinheit ein Opfer zur Reinigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in Bezug auf die Person“. Im Zusammenhang ist ein verstorbener Mensch gemeint, durch dessen Tod beziehungsweise Leichnam der Nasiräer verunreinigt wurde.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: der Priester soll … darbringen
  rationale: עָשָׂה bedeutet grundsätzlich „tun/machen“, bezeichnet im Opferkontext aber idiomatisch das Darbringen der Opfer.
- source_word: אֶחָד לְחַטָּאת
  choice: die eine als Sündopfer
  rationale: חַטָּאת bezeichnet hier die Opfergattung. „Sündopfer“ ist die etablierte deutsche Benennung; wegen des Zusammenhangs mit ritueller Verunreinigung wird „Reinigungsopfer“ als Alternative vermerkt.
- source_word: וְאֶחָד לְעֹלָה
  choice: die andere als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; „die andere“ gibt den deutschen Paarbezug natürlich wieder.
- source_word: וְכִפֶּר עָלָיו
  choice: für ihn Sühne erwirken
  rationale: Die Wendung bewahrt die kultische Aussage von כפר, ohne eine bestimmte Theorie der Sühne festzulegen.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: weil er sich an dem Toten versündigt hat
  rationale: Die Konstruktion verbindet חטא mit עַל; נֶפֶשׁ bezeichnet im unmittelbaren Kontext einen verstorbenen Menschen. Die Formulierung wahrt dabei die auffällige Sprache des Ausgangstextes, der die durch den Todesfall eingetretene Verunreinigung als Verfehlung bezeichnet.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: er soll sein Haupt … wieder heiligen
  rationale: קִדַּשׁ heißt wörtlich „heiligen“. „Wieder“ verdeutlicht aus dem Kontext die Erneuerung der Nasiräerweihe, ohne die kultische Bildsprache des Hauptes aufzulösen.
- source_word: בַּיּוֹם הַהוּא
  choice: noch am selben Tag
  rationale: Die Wiedergabe entspricht dem zeitlichen Ausdruck und macht die im Zusammenhang geforderte unmittelbare Handlung natürlich verständlich.
theological_decisions:
- issue: Bedeutung von חַטָּאת im priesterlichen Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Beide Bezeichnungen erfassen Aspekte der Opfergattung. Der Haupttext verwendet den geläufigen traditionellen Begriff; die Fußnote bewahrt die im Kontext ritueller Verunreinigung wichtige Alternative.
- issue: Bedeutung von נֶפֶשׁ
  choice: der Tote
  alternative: Leichnam
  rationale: נֶפֶשׁ bedeutet für sich „Person/Leben/Wesen“, bezeichnet hier aber aufgrund von Numeri 6,6–12 einen verstorbenen Menschen beziehungsweise dessen Leichnam. „Der Tote“ wahrt den personalen Bezug.
- issue: Charakter der Verfehlung bei unbeabsichtigter Berührung mit einem Toten
  choice: sich an dem Toten versündigt
  alternative: wegen des Toten schuldig geworden
  rationale: Der Text verwendet ausdrücklich חטא, obwohl der vorherige Vers ein plötzliches, unbeabsichtigtes Ereignis beschreibt. Die Übersetzung bewahrt diese theologische Spannung, statt sie als bloße Verunreinigung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sühne erwirken“, „Haupt“ und „heiligen“ bewahren die kultische Ausdrucksweise, während Satzbau und Verbwahl allgemein verständlich bleiben.
