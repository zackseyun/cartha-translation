reference: Numbers 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: de
  text: Während der ganzen Zeit seines Nasiräergelübdes[a] darf kein Schermesser über seinen Kopf geführt werden.[b] Bis die Tage erfüllt sind, in denen er sich für Jahwe absondert, soll er heilig sein; er soll sein Haupthaar ungeschnitten wachsen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seines Gelübdes der Absonderung«. Das hebräische Wort hinter »Nasiräer« ist mit der Vorstellung von Absonderung und Weihe verbunden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Kein Schermesser soll über seinen Kopf gehen«; gemeint ist, dass sein Kopfhaar nicht geschoren werden darf.'
    reason: idiom_explanation
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: sein Nasiräergelübde
  rationale: Die technische Bezeichnung »Nasiräergelübde« ist im Deutschen verständlich und bewahrt zugleich den Zusammenhang mit der hebräischen Wortfamilie für Absonderung und Weihe.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: kein Schermesser darf über seinen Kopf geführt werden
  rationale: Die Formulierung erhält das hebräische Bild vom Schermesser, das über den Kopf geht, klingt im Deutschen aber natürlicher als eine streng wörtliche Wiedergabe.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: bis die Tage erfüllt sind
  rationale: Die Wendung bewahrt den Gedanken der vollständig abgelaufenen, durch das Gelübde bestimmten Tage.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: für die er sich für Jahwe absondert
  rationale: »Sich absondern« gibt die Grundbedeutung der Wurzel נזר wieder und hält den Bezug zwischen der Handlung und dem Nasiräerstatus sichtbar. Das erste »für« bezeichnet die Zeitspanne, das zweite die Ausrichtung auf Jahwe.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Absonderung auf Gott; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: קָדֹשׁ יִהְיֶה
  choice: soll er heilig sein
  rationale: »Heilig« bewahrt den ausdrücklich verwendeten theologischen Begriff קדוש, ohne ihn auf »geweiht« oder »ausgesondert« einzuengen.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: er soll sein Haupthaar ungeschnitten wachsen lassen
  rationale: Die Wiedergabe drückt sowohl das Wachsenlassen als auch den durch פֶּרַע bezeichneten ungeschnittenen beziehungsweise frei wachsenden Zustand des Haares verständlich aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- issue: קדוש als Heiligkeitsbegriff
  choice: heilig
  alternative: geweiht / abgesondert
  rationale: Der Ausgangstext verwendet ausdrücklich קדוש. »Heilig« erhält dessen theologisches Gewicht und lässt offen, wie sich Heiligkeit und Absonderung genau zueinander verhalten.
- issue: Bedeutung der Absonderung im Nasiräergelübde
  choice: er sondert sich für Jahwe ab
  alternative: er weiht sich Jahwe
  rationale: »Absondern« bleibt näher an der Wurzel נזר und vermeidet es, die Handlung ausschließlich mit einem stärker kultisch geprägten Begriff zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich verbindlichem Ton. »Nasiräergelübde« dient als verständlicher Fachbegriff. Die männlichen Pronomen folgen der grammatischen Form und dem unmittelbaren Kontext des hebräischen Verses.
