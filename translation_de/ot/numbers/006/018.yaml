source:
  edition: WLC
  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: de
  text: Dann soll der Nasiräer am Eingang des Zeltes der Begegnung sein geweihtes Haupt scheren. Er soll das Haar seines geweihten Hauptes nehmen und es auf das Feuer legen, das unter dem Friedensopfer[a] brennt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinschaftsopfer“ oder „Heilsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּזִיר
  choice: der Nasiräer
  rationale: Der etablierte Fachbegriff bezeichnet hier einen Menschen, der das besondere Nasiräergelübde dieses Kapitels abgelegt hat.
- source_word: וְגִלַּח
  choice: Dann soll … scheren
  rationale: Das Verb bezeichnet das Abscheren des Haares; die Soll-Form gibt den verbindlichen Ablauf der Ritualanweisung in natürlichem Deutsch wieder.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet den Eingang; אֹהֶל מוֹעֵד wird als geläufige Bezeichnung des Heiligtums mit „Zelt der Begegnung“ wiedergegeben.
- source_word: רֹאשׁ נִזְרוֹ
  choice: sein geweihtes Haupt
  rationale: Die wörtliche Formulierung „das Haupt seiner Weihe“ wäre im heutigen Deutsch schwer verständlich. „sein geweihtes Haupt“ bewahrt den Zusammenhang mit der besonderen Weihe des Nasiräers, ohne das Nomen vorschnell nur als Gelübde zu deuten.
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: das Haar seines geweihten Hauptes
  rationale: Die Wiedergabe erhält die Wiederholung von רֹאשׁ נִזְרוֹ und macht den rituellen Bezug des Haares auf die Weihe sichtbar.
- source_word: הָאֵשׁ
  choice: das Feuer
  rationale: Dies ist die direkte und kontextgemäße Bedeutung.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition beschreibt hier eine räumliche Lage.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: Friedensopfer
  rationale: „Friedensopfer“ ist ein etablierter deutscher Fachausdruck für diese Opferart und lässt deren Bedeutungsfeld von Frieden, Heil und Wohlergehen offen.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: Der Ausdruck bezeichnet eine kultische Opferkategorie. „Friedensopfer“ wahrt den traditionellen Fachbegriff, ohne die Bedeutung ausschließlich auf Gemeinschaft oder Wohlergehen einzuengen; sachlich mögliche Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haupt“ statt „Kopf“ hält den kultisch-feierlichen Ton, während die syntaktisch schwer verständliche wörtliche Wendung „Haupt seiner Weihe“ idiomatisch als „geweihtes Haupt“ formuliert wird. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die lexikalischen Alternativen beziehen.
