  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: de
  text: Der Priester soll sie vor Jahwe bringen[a] und sein Sündopfer[b] und sein Brandopfer darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Jahwe heranbringen“. Das hebräische Verb kann das Vorführen beziehungsweise Heranbringen in Gottes Gegenwart vor der eigentlichen Opferhandlung betonen.'
    reason: lexical_alternative
  - marker: b
    text: „Sündopfer“ kann in der priesterlichen Opfersprache auch als „Reinigungsopfer“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: soll … bringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Vorführen. „Bringen“ unterscheidet diesen vorbereitenden Vorgang von der anschließend genannten Darbringung der Opfer.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Wiedergabe von כֹּהֵן im kultischen Zusammenhang.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier das Bringen in Gottes Gegenwart; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְעָשָׂה
  choice: und … darbringen
  rationale: עשה bedeutet wörtlich „tun/machen“, bezeichnet mit Opfernamen jedoch den Vollzug beziehungsweise die Darbringung des Opfers. „Darbringen“ ist im Deutschen natürlich und kultisch präzise.
- source_word: אֶת חַטָּאתוֹ
  choice: sein Sündopfer
  rationale: חַטָּאת bezeichnet in der priesterlichen Opfersprache das mit Sünde beziehungsweise Reinigung verbundene Opfer. „Sündopfer“ ist die geläufige Wiedergabe; die mögliche Deutung als „Reinigungsopfer“ bleibt in einer Fußnote sichtbar.
- source_word: וְאֶת עֹלָתוֹ
  choice: sein Brandopfer
  rationale: עֹלָה ist die feste Bezeichnung für das vollständig verbrannte Opfer.
- source_word: implicit object of וְהִקְרִיב
  choice: sie
  rationale: Das Hebräische lässt das Objekt unausgesprochen und setzt die Opfergaben aus dem vorhergehenden Vers voraus. Das Pronomen wahrt diesen Kontextbezug, ohne die Gegenstände näher zu bestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חַטָּאת in der Opfersprache
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ ist die traditionelle und allgemein verständliche Bezeichnung, während „Reinigungsopfer“ einen wichtigen kultischen Bedeutungsaspekt hervorhebt. Die Alternative wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden aufeinanderfolgenden Verben werden mit „bringen“ und „darbringen“ unterschieden, um den Ablauf des hebräischen Satzes abzubilden. Das zweimalige „sein“ bleibt erhalten und entspricht den beiden hebräischen Possessivsuffixen.
