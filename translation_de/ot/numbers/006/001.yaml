  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell wird der Gottesname in deutschen Bibeln mit „der HERR“ wiedergegeben. Eine andere Wiedergabe ist „Jehova“.'
