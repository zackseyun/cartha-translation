lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Wayyiqtol führt die Erzählung fort. „Sprach“ entspricht der formellen Einleitung einer Gottesrede und vermeidet zusammen mit der folgenden Formel eine schwerfällige Doppelung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Formulierung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die formelhafte Infinitivkonstruktion leitet den Inhalt der folgenden Rede ein. Im heutigen Deutsch erfüllt ein Doppelpunkt diese Funktion natürlicher als das wörtliche „und sagte“ oder „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Eigenname; „der HERR“ ersetzt ihn durch einen Titel, während „Jehova“ auf einer späteren Mischlesung beruht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Redeeinleitung wird knapp und natürlich mit einem Doppelpunkt abgeschlossen; der einleitende Anschluss „Und“ bleibt erhalten.
