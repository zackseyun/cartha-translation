base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: de
  text: Nicht einmal wegen seines Vaters oder seiner Mutter, seines Bruders oder seiner Schwester darf er sich bei ihrem Tod unrein machen[a]; denn die Weihe für seinen Gott ist auf seinem Kopf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darf er ihretwegen nicht unrein werden, wenn sie sterben.“'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort נֵזֶר bezeichnet hier die Weihe beziehungsweise Absonderung für Gott und ihr sichtbares Zeichen: das ungeschnittene Haar auf seinem Kopf.'
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו וּלְאִמּוֹ לְאָחִיו וּלְאַחֹתוֹ
  choice: Nicht einmal wegen seines Vaters oder seiner Mutter, seines Bruders oder seiner Schwester
  rationale: Die vorangestellten Verwandtschaftsangaben tragen Nachdruck. „Nicht einmal“ gibt diesen im Deutschen natürlich wieder; Singular und Geschlecht der Verwandtschaftsbezeichnungen bleiben erhalten.
- source_word: לֹא יִטַּמָּא לָהֶם
  choice: darf er sich ... wegen ... unrein machen
  rationale: Die reflexive Form bezeichnet rituelle Verunreinigung. „Sich unrein machen“ bewahrt diesen Sinn, ohne eine darüber hinausgehende moralische Verfehlung anzudeuten; „wegen“ gibt den Bezug auf die genannten Angehörigen idiomatisch wieder.
- source_word: בְּמֹתָם
  choice: bei ihrem Tod
  rationale: Die Wendung bezeichnet den Tod als Anlass der Verunreinigung und bewahrt die nominale Ausdrucksweise des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Verbots ein; „denn“ ist in diesem würdevollen Gesetzestext klar und natürlich.
- source_word: נֵזֶר אֱלֹהָיו
  choice: die Weihe für seinen Gott
  rationale: נֵזֶר bezeichnet im Nasiräerkontext die Gott gewidmete Absonderung beziehungsweise deren sichtbares Zeichen. „Weihe“ vermittelt den kultischen Sinn; „für seinen Gott“ bewahrt das ausdrückliche Possessivsuffix und drückt die Ausrichtung der Weihe idiomatisch aus.
- source_word: עַל רֹאשׁוֹ
  choice: ist auf seinem Kopf
  rationale: Die konkrete Bildsprache wird erhalten und verweist im Zusammenhang auf das Haar als sichtbares Zeichen der Weihe, ohne diese Deutung in den Haupttext einzutragen.
theological_decisions:
- issue: Art der Unreinheit im Nasiräergesetz
  choice: Die Vorschrift wird als Verbot ritueller Verunreinigung wiedergegeben.
  alternative: Moralisch belastete Formulierungen wie „sich beflecken“ oder „sich entweihen“.
  rationale: Der Zusammenhang betrifft die durch den Kontakt mit Toten entstehende kultische Unreinheit. Die Übersetzung soll keine zusätzliche Aussage über persönliche Sündhaftigkeit eintragen.
- issue: Bedeutung von נֵזֶר
  choice: „Weihe“ mit einer Fußnote zum Zeichen beziehungsweise Stand der Absonderung für Gott.
  alternative: „Krone“, „Haar“ oder ausschließlich „Absonderung“.
  rationale: Das Wort trägt hier zugleich die Vorstellung eines besonderen Weihe- oder Absonderungsstandes und seines sichtbaren Zeichens auf dem Kopf. „Weihe“ ist im Haupttext verständlich, während die Fußnote die Bild- und Bedeutungsspannung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung erhält den Nachdruck auf den engsten Angehörigen; kultische Fachsprache bleibt verständlich und wird durch eine knappe Fußnote erläutert.
