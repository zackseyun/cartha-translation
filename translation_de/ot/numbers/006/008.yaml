  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: de
  text: Alle Tage seiner Absonderung ist er Jahwe heilig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seines Nasiräergelübdes“ oder „seiner Weihe“. Das hebräische Wort bezeichnet hier den Zustand, in dem jemand als Nasiräer abgesondert ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: während der ganzen Zeit
  rationale: Die Verbindung bezeichnet umfassend die gesamte Dauer. Im Deutschen ist „während der ganzen Zeit“ natürlicher als die wörtlichere Form „alle Tage“.
- source_word: נִזְרוֹ
  choice: seiner Absonderung
  rationale: Das Wort bezeichnet hier den besonderen, abgesonderten Stand des Nasiräers. „Absonderung“ bewahrt diesen Sinn, ohne den Begriff vorschnell auf das Gelübde selbst einzuengen.
- source_word: קָדֹשׁ
  choice: heilig
  rationale: „Heilig“ erhält das theologische Gewicht des hebräischen Adjektivs und bezeichnet die besondere Zugehörigkeit zu Gott.
- source_word: הוּא
  choice: ist er
  rationale: Das selbstständige Pronomen bildet mit der im Hebräischen unausgesprochenen Kopula den Satz „ist er“.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier Ausrichtung und Zugehörigkeit. „Für Jahwe“ ist im Deutschen idiomatisch und gibt den Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נִזְרוֹ in der Nasiräergesetzgebung
  choice: seiner Absonderung
  alternative: seines Nasiräergelübdes; seiner Weihe
  rationale: Im Mittelpunkt steht die Dauer des abgesonderten Zustands. Die gewählte Formulierung unterscheidet diesen Zustand vom Gelübde als Sprechakt und vermeidet zugleich die Wiederholung des Heiligkeitsbegriffs durch „Weihe“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zeitangabe wurde idiomatisch formuliert; „heilig“ und der Gottesname bleiben in ihrer theologischen Prägnanz erhalten.
