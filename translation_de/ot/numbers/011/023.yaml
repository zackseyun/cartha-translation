source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: »Ist Jahwes Hand etwa zu kurz?[a] Jetzt wirst du sehen, ob mein Wort bei dir in Erfüllung geht oder nicht.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ist Jahwes Hand zu kurz?“ Die „Hand“ steht bildlich für seine Macht und Fähigkeit zu handeln.'
    reason: cultural_note
  - marker: b
    text: Die hebräische Wendung kann auch das Eintreten dessen meinen, was Jahwe gesagt hat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der geläufigen Form „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: Ist etwa Jahwes Hand zu kurz geworden?
  rationale: Die anschauliche hebräische Rede von der „Hand“ bleibt erhalten. „Etwa“ kennzeichnet im natürlichen Deutschen den rhetorischen Charakter der Frage, die eine Verneinung erwartet.
- source_word: עַתָּה תִרְאֶה
  choice: Jetzt wirst du sehen
  rationale: Gibt den unmittelbaren zeitlichen Bezug und die bevorstehende Bestätigung klar und direkt wieder.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: ob mein Wort für dich eintrifft
  rationale: „Mein Wort“ bewahrt den Singular von דְבָרִי; „eintrifft“ drückt hier das Wirklichwerden der angekündigten Zusage aus. „Für dich“ erhält den Bezug der angefügten zweiten Person, ohne die mögliche Nuance des Geschehens vollständig festzulegen.
- source_word: אִם לֹא
  choice: oder nicht
  rationale: In Verbindung mit „ob“ ist dies die natürliche deutsche Wiedergabe der alternativen Frage.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Macht
  choice: Das Bild von Jahwes zu kurz gewordener Hand wird beibehalten.
  alternative: „Ist Jahwes Macht etwa begrenzt?“
  rationale: Das hebräische Körperbild bezeichnet Gottes wirksame Macht und trägt die rhetorische Schärfe der Antwort. Eine Auflösung in „Macht“ wäre verständlich, würde das Bild aber einebnen.
- issue: Bezug von Gottes „Wort“ auf Mose
  choice: „ob mein Wort für dich eintrifft“
  alternative: „ob dir widerfährt, was ich gesagt habe“
  rationale: Die Übersetzung bewahrt sowohl דְבָרִי als „mein Wort“ als auch den persönlichen Bezug des Verbs. Die Fußnote weist auf die sprachlich mögliche stärker ereignishafte Wiedergabe hin, ohne die Zusage einseitig auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt bildhaft und knapp; „etwa“ macht ihre erwartete verneinende Antwort idiomatisch erkennbar. Der Gottesname erscheint als „Jahwe“.
