source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: de
  text: 'Doch Mose sagte zu ihm: „Eiferst du etwa für mich? Wenn doch das ganze Volk Jahwes Propheten wäre und Jahwe seinen Geist auf sie legte[a]!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: „dass Jahwe seinen Geist auf sie gebe/lege“. Die Partikel kann hier den Wunschinhalt fortführen; auch eine erläuternde oder begründende Nuance ist möglich.'
    reason: Die Anmerkung dokumentiert die mehrdeutige Funktion von כִּי, ohne die Hauptübersetzung einseitig auf eine kausale Lesart festzulegen.
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: Eiferst du etwa für mich?
  rationale: קנא bezeichnet hier Josuas parteilichen Eifer für Moses Stellung. „Eifern für“ ist im Deutschen natürlich und bewahrt die mögliche Spannung zwischen Eifer und Eifersucht, ohne Josuas Motiv stärker negativ festzulegen als der hebräische Text.
- source_word: וּמִי יִתֵּן
  choice: Wenn doch
  rationale: Die feste hebräische Wendung drückt einen nachdrücklichen Wunsch aus, nicht die wörtliche Frage „Wer wird geben?“.
- source_word: כָּל עַם יְהוָה
  choice: das ganze Volk Jahwes
  rationale: Die Wiedergabe erhält sowohl den kollektiven Singular עַם als auch das Zugehörigkeitsverhältnis zu Jahwe.
- source_word: נְבִיאִים
  choice: Propheten
  rationale: Das Substantiv bezeichnet unmittelbar Propheten; die nominale Form wird beibehalten.
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: weil Jahwe seinen Geist auf sie legte
  rationale: 'כִּי lässt sich hier begründend beziehungsweise erläuternd verstehen: Das ganze Volk wäre prophetisch, weil Jahwe seinen Geist auf sie legte. Der deutsche Konjunktiv führt den Wunschcharakter fort und bewahrt die hebräische Bildsprache „auf sie“.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: רוּחוֹ
  choice: seinen Geist
  rationale: Im Zusammenhang prophetischer Befähigung bezeichnet רוּחַ Gottes Geist. Die Großschreibung macht den göttlichen Bezug im Deutschen deutlich.
theological_decisions:
- issue: Bedeutung von Gottes Geist im Zusammenhang prophetischer Befähigung
  choice: seinen Geist
  alternative: seinen geist / seinen Wind / seinen Atem
  rationale: Der unmittelbare Kontext verbindet das Kommen des Geistes mit prophetischem Reden. „Geist“ gibt diesen Bezug wieder, ohne eine weitergehende systematisch-theologische Erklärung in den Vers einzutragen.
- issue: Syntaktische Funktion von כִּי nach dem Wunsch
  choice: weil Jahwe seinen Geist auf sie legte
  alternative: dass Jahwe seinen Geist auf sie legte
  rationale: כִּי kann hier den Grund beziehungsweise die Voraussetzung dafür angeben, dass das ganze Volk Propheten wäre. Da auch eine Fortführung des Wunschinhalts möglich ist, wird die Alternative in einer Fußnote bewahrt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt den im hebräischen Text ausdrücklich gebrauchten Bundesnamen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Eiferst du etwa für mich?“ ist idiomatisch, erhält aber die mögliche Nuance von Eifersucht oder parteilichem Eifer. Der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
