  to: 'Doch Mose sagte zu ihm: „Eiferst du etwa für mich? Wenn doch das ganze Volk Jahwes Propheten wäre und Jahwe seinen Geist auf sie legte[a]!“'
  rationale: Die Revision bewahrt die Frage nach Josuas parteilichem Eifer, die optative Wendung „Wenn doch“, den kollektiven Ausdruck „das ganze Volk Jahwes“ sowie die Bildsprache der Geistgabe „auf sie“. Durch die Koordination mit „und“ steht „legte“ eindeutig im Bereich des durch „Wenn doch“ eröffneten Wunsches, statt eine abgeschlossene, kausal begründende Handlung zu behaupten. Die verbliebene syntaktische Mehrdeutigkeit von כִּי wird knapp in der Fußnote dokumentiert.
