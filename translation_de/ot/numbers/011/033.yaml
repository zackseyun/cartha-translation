source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: de
  text: Während das Fleisch noch zwischen ihren Zähnen war, ehe es aufgezehrt war[a], entbrannte der Zorn Jahwes gegen das Volk, und Jahwe schlug das Volk mit einer überaus schweren Plage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bevor es abgeschnitten (oder: weggenommen) wurde“; im Zusammenhang wohl: bevor das Fleisch aufgezehrt war.'
    reason: Bewahrt die ungewöhnliche wörtliche Bedeutung von יִכָּרֵת und macht zugleich die kontextuelle Deutung transparent.
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: das Fleisch
  rationale: Im Zusammenhang mit den Wachteln bezeichnet בָּשָׂר das Fleisch der Tiere als Nahrung. „Fleisch“ ist im Deutschen zugleich wörtlich und idiomatisch.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: noch zwischen ihren Zähnen war
  rationale: Bewahrt das anschauliche hebräische Bild und gibt die Fortdauer durch „noch“ natürlich wieder.
- source_word: טֶרֶם יִכָּרֵת
  choice: ehe es aufgezehrt war
  rationale: יִכָּרֵת bedeutet wörtlich „abgeschnitten/weggenommen werden“. Im Essenskontext liegt die Bedeutung „aufgezehrt“ nahe; eine Fußnote erhält die wörtlichere Alternative.
- source_word: וְאַף יְהוָה חָרָה
  choice: entbrannte der Zorn Jahwes
  rationale: Gibt die Metapher des brennenden Zorns würdig und im modernen Standarddeutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als gebräuchliche deutsche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיַּךְ
  choice: schlug
  rationale: Das Verb נכה bezeichnet hier ein göttliches Schlagen im Gericht; „schlug“ bewahrt die Kraft und die Verbindung zum folgenden מַכָּה.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: eine überaus schwere Plage
  rationale: מַכָּה kann eine verheerende Heimsuchung oder Plage bezeichnen. „Überaus schwer“ gibt die starke Intensivierung רַבָּה מְאֹד natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt den Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bildhafte Rede vom göttlichen Zorn
  choice: entbrannte der Zorn Jahwes
  alternative: Jahwe wurde zornig
  rationale: Die gewählte Fassung erhält die hebräische Metapher vom brennenden Zorn und schwächt die Darstellung des Gerichts nicht ab.
- issue: Art der מַכָּה
  choice: Plage
  alternative: Schlag / Heimsuchung
  rationale: Der Text bestimmt die genaue Art des Geschehens nicht. „Plage“ bezeichnet eine schwere, das Volk treffende Heimsuchung, ohne eine konkrete Krankheit festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der zeitlichen und kausalen Bewegung des Hebräischen; „ehe“ und „entbrannte“ sind gehoben, aber allgemein verständlich. Die Wiederholung des Namens Jahwe wird wie im Ausgangstext beibehalten.
