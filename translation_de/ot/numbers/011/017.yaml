source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: de
  text: Und ich werde herabkommen und dort mit dir reden. Ich werde etwas von dem Geist[a], der auf dir ist, nehmen und auf sie legen. Dann werden sie gemeinsam mit dir die Last des Volkes tragen, damit du sie nicht allein tragen musst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann „Geist“, „Wind“ oder „Atem“ bedeuten. Hier bezeichnet es den Geist, der Mose für seine Leitungsaufgabe befähigt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: Und ich werde herabkommen
  rationale: ירד bedeutet wörtlich „hinabgehen/herabkommen“. „Herabkommen“ bewahrt die räumliche und theophanische Ausdrucksweise, ohne sie abzuschwächen.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: und dort mit dir reden
  rationale: דבר mit עם bezeichnet hier ein Reden mit jemandem. „Dort“ erhält den konkreten Ortsbezug des hebräischen Textes.
- source_word: וְאָצַלְתִּי מִן
  choice: Ich werde etwas von … nehmen
  rationale: Das seltene Verb אצל beschreibt hier eine Entnahme beziehungsweise Übertragung von dem, was auf Mose ist. Die Formulierung gibt den partitiven Sinn von מִן wieder, ohne ausdrücklich zu behaupten, Mose werde dadurch etwas eingebüßt.
- source_word: הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: dem Geist, der auf dir ist
  rationale: רוּחַ kann „Geist“, „Wind“ oder „Atem“ bedeuten. Im Zusammenhang bezeichnet es die von Gott gewährte Befähigung zum Leitungsdienst; die Wendung „auf dir“ bewahrt das Bild des Ausgangstextes.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: und auf sie legen
  rationale: שׂים bedeutet „setzen, stellen, legen“. Die Übersetzung erhält das Bild, dass der Geist auf Personen gelegt wird beziehungsweise auf ihnen ruht.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: Dann werden sie gemeinsam mit dir die Last des Volkes tragen
  rationale: נשׂא und מַשָּׂא bilden ein Wortfeld des Tragens und der Last. Die deutsche Fassung bewahrt dieses Bild für die gemeinsam übernommene Leitungsverantwortung.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: damit du sie nicht allein tragen musst
  rationale: Die Schlussklausel beschreibt Zweck beziehungsweise Folge der geteilten Verantwortung. Das Pronomen „sie“ greift im Deutschen die Last auf; „allein“ gibt die Hervorhebung durch אַתָּה לְבַדֶּךָ natürlich wieder.
theological_decisions:
- issue: 'Bezug von רוּחַ: Gottes befähigender Geist oder Moses menschlicher Geist'
  choice: „Geist“ im Sinn der von Gott gewährten Befähigung
  alternative: Moses eigener menschlicher Geist oder seine innere Haltung
  rationale: Der unmittelbare Zusammenhang, besonders Numeri 11,25, beschreibt ein göttliches Handeln, durch das das auf Mose Befindliche auch auf die Ältesten kommt. Die Übersetzung belässt jedoch die bildhafte Rede vom Geist „auf“ Mose und erläutert nicht dogmatisch, auf welche Weise diese Übertragung geschieht.
- issue: Ob die Übertragung eine Verminderung bei Mose bedeutet
  choice: Die Frage bleibt offen
  alternative: Ausdrücklich sagen, Gott teile den Geist ohne jeden Verlust für Mose, oder nehme Mose einen Teil weg
  rationale: Der Text spricht von einer Entnahme aus beziehungsweise von dem Geist auf Mose und vom Auflegen auf die Ältesten, erklärt aber nicht ausdrücklich, ob Mose dadurch etwas verliert. „Etwas von … nehmen“ wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist leicht geglättet, während die Bilder des Herabkommens, des auf Mose befindlichen Geistes und des gemeinsamen Lastentragens erhalten bleiben.
