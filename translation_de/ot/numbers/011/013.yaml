base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: de
  text: 'Woher soll ich Fleisch nehmen, um es diesem ganzen Volk zu geben? Denn sie weinen vor mir[a] und sagen: »Gib uns Fleisch, damit wir essen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie weinen zu mir« oder »sie setzen mir mit ihrem Weinen zu«. Die hebräische Wendung lautet wörtlich: »sie weinen auf mich«.'
    reason: Die Präposition עַל kann hier sowohl das auf Mose gerichtete Weinen als auch den dadurch auf ihn ausgeübten Druck bezeichnen; keine einzelne deutsche Formulierung bildet die Spannweite vollständig ab.
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: Woher soll ich … nehmen?
  rationale: מֵאַיִן fragt nach der Herkunft oder Bezugsquelle; zusammen mit לִי bringt die Formulierung zugleich Moses’ persönliche Ratlosigkeit und Unfähigkeit idiomatisch zum Ausdruck.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: Im Zusammenhang mit der Versorgung und dem Essen bezeichnet בָּשָׂר Fleisch als Nahrungsmittel.
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: um es diesem ganzen Volk zu geben
  rationale: Der Infinitiv לָתֵת wird als Zweckangabe wiedergegeben. »Diesem ganzen Volk« bewahrt den kollektiven Singular von עָם in natürlichem Deutsch.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung für Moses’ Frage und Klage ein.
- source_word: יִבְכּוּ עָלַי
  choice: sie weinen vor mir[a]
  rationale: Die Wendung mit עַל beschreibt ein auf Mose gerichtetes Weinen beziehungsweise Drängen. »Vor mir« bleibt im Haupttext zurückhaltend; die mögliche stärkere Drucknuance wird in der Fußnote offengelegt.
- source_word: לֵאמֹר
  choice: und sagen
  rationale: Der hebräische Rede-Einleiter wird in diesem Satz idiomatisch als koordinierte Handlung wiedergegeben.
- source_word: תְּנָה לָּנוּ
  choice: Gib uns
  rationale: Der Imperativ mit dem Dativpronomen lässt sich direkt und natürlich so wiedergeben.
- source_word: וְנֹאכֵלָה
  choice: damit wir essen können
  rationale: Die Kohortativform bezeichnet hier den beabsichtigten beziehungsweise erwünschten Ausgang der Bitte. Die deutsche Zweckkonstruktion gibt diesen volitiven Sinn natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frageform bewahrt Moses’ Verzweiflung, ohne sie auszudeuten. Der kollektive Singular »Volk« bleibt erhalten; die direkte Rede ist klar und alltagssprachlich verständlich.
