base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: de
  text: Das Volk zog umher und sammelte es. Dann mahlten sie es mit der Handmühle oder zerstampften es im Mörser, kochten es im Topf und machten Fladen daraus. Sein Geschmack war wie der von gehaltvollem Öl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie frisches Öl“. Die Bedeutung der hebräischen Wendung ist unsicher; sie bezeichnet wahrscheinlich die reichhaltige oder frische Beschaffenheit von Öl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: zog umher
  rationale: Das Verb bezeichnet ein Hin-und-her-Ziehen in einem Gebiet. Der deutsche Erzählzusammenhang lässt dabei erkennen, dass es sich um das übliche Vorgehen beim Sammeln handelte.
- source_word: לָקְטוּ
  choice: sammelte
  rationale: Die übliche Bedeutung des Verbs passt unmittelbar zum Einsammeln des Mannas.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: mahlten sie es mit der Handmühle
  rationale: רֵחַיִם bezeichnet eine Handmühle beziehungsweise deren Mahlsteine. „Mit der Handmühle“ gibt das konkrete Gerät und den instrumentalen Sinn natürlich wieder.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: zerstampften es im Mörser
  rationale: Das Verb bedeutet zerstoßen oder zerstampfen; zusammen mit מְדֹכָה ist „im Mörser zerstampfen“ die natürliche deutsche Wendung.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: kochten es im Topf
  rationale: Das Verb kann kochen oder sieden bedeuten. „Kochen“ wahrt die mögliche Bedeutungsbreite, ohne ein bestimmtes Zubereitungsverfahren unnötig festzulegen.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: machten Fladen daraus
  rationale: עֻגוֹת bezeichnet flache beziehungsweise runde Brote oder Kuchen. „Fladen“ ist im gegebenen Speisekontext klar und vermeidet die moderne Assoziation süßen Kuchens.
- source_word: טַעְמוֹ
  choice: Es schmeckte
  rationale: Die prädikative deutsche Formulierung gibt „sein Geschmack war“ natürlich und präzise wieder.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: wie kräftiges Öl
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich die gehaltvolle, frische oder saftreiche Beschaffenheit von Öl. „Kräftiges Öl“ vermittelt den reichen Geschmack, während die Unsicherheit in der Fußnote offengelegt wird.
