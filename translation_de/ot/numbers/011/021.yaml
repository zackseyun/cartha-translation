  to: 'Mose aber sagte: „Das Volk, in dessen Mitte ich bin, zählt sechshunderttausend Mann zu Fuß[a]. Du aber hast gesagt: ‚Ich werde ihnen Fleisch geben, und sie werden einen ganzen Monat lang davon essen[b].‘“'
  rationale: Die einzige notwendige Änderung ersetzt die unidiomatische und zu stark militärisch wirkende Formulierung „Mann Fußvolk“ durch „Mann zu Fuß“. Die alternative militärische Deutung bleibt ausdrücklich in der Fußnote erhalten. Inhalt, Register, Satzstruktur und die übrigen Fußnoten bleiben unverändert.
