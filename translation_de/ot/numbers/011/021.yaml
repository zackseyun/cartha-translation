translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht Moses Einwand klar lesbar, ohne seinen Inhalt zu verstärken. Die ungewöhnlichen beziehungsweise mehrdeutigen hebräischen Wendungen werden im Text natürlich wiedergegeben und in den Fußnoten offengehalten.
