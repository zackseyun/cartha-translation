    issue: „sechshunderttausend Mann Fußvolk“ ist sprachlich und semantisch problematisch.
    rationale: Die Wortgruppe verbindet zwei konkurrierende Bezeichnungen unidiomatisch. „Fußvolk“ hat zudem vorrangig eine militärische Bedeutung, während רַגְלִי hier auch schlicht Personen „zu Fuß“ beziehungsweise die so gezählte Gruppe bezeichnen kann. „Mann zu Fuß“ wahrt den Wortbezug und lässt die Nuance in der Fußnote offen.
