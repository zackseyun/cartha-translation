source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: de
  text: 'Mose aber sagte: „Das Volk, in dessen Mitte ich bin, zählt sechshunderttausend Mann zu Fuß[a]. Du aber hast gesagt: ‚Ich werde ihnen Fleisch geben, und sie werden einen ganzen Monat lang davon essen[b].‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sechshunderttausend Fußsoldaten“. Der hebräische Ausdruck kann die zu Fuß Gezählten oder Fußsoldaten bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch wörtlich: „einen Monat von Tagen“; gemeint ist ein voller Monat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Mose aber sagte
  rationale: Das Waw führt die Erzählung weiter; „aber“ gibt zugleich den im Zusammenhang erkennbaren Einwand des Mose natürlich wieder.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: sechshunderttausend
  rationale: Die Kardinalzahl wird direkt und ohne Umschreibung wiedergegeben.
- source_word: רַגְלִי הָעָם
  choice: Das Volk … zählt sechshunderttausend Mann Fußvolk
  rationale: „Fußvolk“ bewahrt den Bezug zu רגל („Fuß“) und ist im Deutschen verständlicher als das isolierte „zu Fuß“. Da der Ausdruck auch allgemeiner auf zu Fuß Gezählte bezogen werden kann, wird die Bedeutungsbreite in einer Fußnote offengehalten.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: in dessen Mitte ich bin
  rationale: Die Formulierung bildet בְּקֶרֶב („inmitten, mitten unter“) eng nach und bleibt in gehobenem, modernem Deutsch verständlich.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: Du aber hast gesagt
  rationale: Das ausdrücklich gesetzte Pronomen אַתָּה trägt Kontrast; die deutsche Stellung mit „aber“ gibt diesen Nachdruck wieder.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: Im Zusammenhang bezeichnet das Wort tierisches Fleisch als Nahrung; „Fleisch“ ist die natürliche deutsche Entsprechung.
- source_word: אֶתֵּן לָהֶם
  choice: Ich werde ihnen … geben
  rationale: Der hebräische Imperfekt drückt hier die angekündigte zukünftige Handlung aus.
- source_word: וְאָכְלוּ
  choice: und sie werden … davon essen
  rationale: Die koordinierte Zukunftsaussage wird als zugesagtes Ergebnis wiedergegeben; „davon“ stellt im Deutschen den natürlichen Rückbezug auf das Fleisch her.
- source_word: חֹדֶשׁ יָמִים
  choice: einen ganzen Monat lang
  rationale: Die wörtliche Wendung „einen Monat von Tagen“ ist ein Idiom für einen vollen Monat. Die idiomatische deutsche Fassung vermittelt den Sinn klar; die hebräische Form wird in der Fußnote dokumentiert.
