  text: וְ/הַ/מָּ֕ן כִּ/זְרַע גַּ֖ד ה֑וּא וְ/עֵינ֖/וֹ כְּ/עֵ֥ין הַ/בְּדֹֽלַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: de
  text: Das Manna war wie Koriandersamen, und sein Aussehen glich dem Aussehen von Bdellium.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bdellium ist ein wohlriechendes Harz oder Gummiharz. Die genaue Bestimmung des hebräischen Begriffs ist unsicher; manche verstehen darunter auch einen perlen- oder kristallartigen Stoff.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: das Manna
  rationale: Der bestimmte hebräische Ausdruck bezeichnet die bereits bekannte Speise in der Wüste; im Deutschen ist „das Manna“ die natürliche Form.
- source_word: כִּזְרַע גַּד
  choice: wie Koriandersamen
  rationale: כִּ bezeichnet den Vergleich, und גַּד wird gewöhnlich als Koriander bestimmt. Das deutsche Sammelwort „Koriandersamen“ gibt die konkrete Form natürlich wieder.
- source_word: וְעֵינוֹ
  choice: und sein Aussehen
  rationale: עַיִן bedeutet wörtlich „Auge“, bezeichnet hier idiomatisch jedoch das sichtbare Erscheinungsbild.
- source_word: כְּעֵין
  choice: glich dem Aussehen von
  rationale: Die Wiederholung des Ausdrucks עַיִן wird im Deutschen bewahrt, ohne den Satz unnötig wörtlich oder schwerfällig zu gestalten.
- source_word: הַבְּדֹלַח
  choice: Bdellium
  rationale: Die genaue Bedeutung ist unsicher. Die traditionelle Transliteration wahrt diese Unsicherheit besser als eine eindeutige Deutung als Harz, Perle oder Kristall.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Satzanschluss וְ wird mit „und“ wiedergegeben, ohne ein nicht ausdrücklich vorhandenes zeitliches „nun“ einzufügen. Die wiederholte Rede vom „Aussehen“ bewahrt den sichtbaren Vergleich und die Struktur des Ausgangstextes.
