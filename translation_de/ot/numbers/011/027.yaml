source:
  edition: WLC
  text: וַ/יָּ֣רָץ הַ/נַּ֔עַר וַ/יַּגֵּ֥ד לְ/מֹשֶׁ֖ה וַ/יֹּאמַ֑ר אֶלְדָּ֣ד וּ/מֵידָ֔ד מִֽתְנַבְּאִ֖ים בַּֽ/מַּחֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: de
  text: 'Da lief ein junger Mann zu Mose und berichtete ihm: „Eldad und Medad prophezeien im Lager.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da lief der junge Mann zu Mose und meldete ihm: ‚Eldad und Medad prophezeien im Lager.‘“ Der hebräische Artikel bei „junger Mann“ kann mit „der“ wiedergegeben werden; das Verb des Berichtens kann auch „melden“ heißen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: Da lief
  rationale: Das Verb רוץ bezeichnet hier unmittelbar das Laufen; „Da lief“ gibt die lebendige hebräische Erzählfolge natürlich wieder.
- source_word: הַנַּעַר
  choice: ein junger Mann
  rationale: נַעַר kann einen Jungen, Jugendlichen oder jungen Mann bezeichnen. Im Zusammenhang handelt es sich um einen nicht näher benannten Boten; idiomatisches Deutsch führt ihn mit „ein junger Mann“ ein. Der hebräische Artikel bleibt in der Fußnote berücksichtigt.
- source_word: וַיַּגֵּד לְמֹשֶׁה וַיֹּאמַר
  choice: zu Mose und berichtete ihm
  rationale: Die beiden aufeinanderfolgenden Verben des Mitteilens werden im Deutschen natürlich zu einer Einleitung der direkten Rede zusammengezogen, ohne einen Bedeutungsbestandteil zu verlieren.
- source_word: אֶלְדָּד וּמֵידָד
  choice: Eldad und Medad
  rationale: Die Personennamen werden nach der üblichen deutschen Form wiedergegeben.
- source_word: מִתְנַבְּאִים
  choice: reden prophetisch
  rationale: Das Hitpael-Partizip von נבא bezeichnet eine andauernde prophetische Tätigkeit. „Reden prophetisch“ ist für heutige Leser verständlich und lässt offen, welche konkrete Form diese Tätigkeit annahm.
- source_word: בַּמַּחֲנֶה
  choice: im Lager
  rationale: מַחֲנֶה bezeichnet hier das Lager Israels; „im Lager“ ist die direkte und idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Art der prophetischen Tätigkeit
  choice: reden prophetisch
  alternative: prophezeien
  rationale: Die Übersetzung benennt die prophetische Tätigkeit, ohne ihren Inhalt, ihre Form oder ihren Status näher festzulegen; die im Ausgangstext bestehende Offenheit bleibt erhalten.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. „Da lief“ bewahrt die zügige hebräische Erzählbewegung; die direkte Rede wird idiomatisch eingeleitet. Die Fußnotenmarkierung steht unmittelbar nach dem Vers.
