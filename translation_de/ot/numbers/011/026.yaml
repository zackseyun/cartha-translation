source:
  edition: WLC
  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: de
  text: Doch zwei Männer waren im Lager zurückgeblieben. Der eine hieß Eldad, der zweite Medad. Da ließ sich der Geist auf ihnen nieder. Sie gehörten zu den Eingetragenen[a], waren aber nicht zum Zelt hinausgegangen[b]; und sie weissagten im Lager.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie gehörten zu den Verzeichneten.« Wörtlich steht im Hebräischen: »Sie waren unter den Aufgeschriebenen.«'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist im Zusammenhang wahrscheinlich das Zelt der Begegnung.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: waren … zurückgeblieben
  rationale: Das Verb שׁאר bezeichnet das Zurück- oder Übrigbleiben. Die Formulierung gibt den narrativen Zusammenhang natürlich wieder, ohne einen Grund für ihr Fernbleiben zu unterstellen.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: zwei Männer
  rationale: אֲנָשִׁים bezeichnet hier ausdrücklich zwei männliche Personen.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Der eine hieß …, der zweite …
  rationale: Die natürliche deutsche Namensformel bewahrt zugleich die ausdrückliche Unterscheidung zwischen dem einen und dem zweiten Mann.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: Da ließ sich der Geist auf ihnen nieder
  rationale: נוח beschreibt hier das Niederlassen beziehungsweise Ruhen des Geistes auf den Männern. Die Formulierung ist im Deutschen idiomatisch und wahrt das Bild des Hebräischen.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: Sie gehörten zu den Eingetragenen
  rationale: כְּתֻבִים bedeutet wörtlich die ‚Aufgeschriebenen‘ beziehungsweise ‚Eingetragenen‘. Die gewählte Formulierung macht verständlich, dass ihre Namen in der betreffenden Gruppe verzeichnet waren, ohne die genaue Art der Liste festzulegen.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: waren aber nicht zum Zelt hinausgegangen
  rationale: Die Richtungsendung an אֹהֱלָה bezeichnet die Bewegung zum Zelt hin. Das Plusquamperfekt stellt klar, dass sie zuvor nicht dorthin hinausgegangen waren.
- source_word: וַיִּתְנַבְּאוּ
  choice: sie weissagten
  rationale: Der Hitpael von נבא bezeichnet hier prophetisches Reden oder Handeln; ‚weissagten‘ ist die knappe, traditionelle und weiterhin verständliche deutsche Wiedergabe.
theological_decisions:
- issue: Bezeichnet הָרוּחַ den göttlichen Geist oder lediglich einen Geist?
  choice: der Geist
  alternative: der geist / ein Geist
  rationale: Im unmittelbaren Kontext ist es der von Gott verliehene Geist, der auch die übrigen Ältesten zum prophetischen Reden befähigt. Die Großschreibung kennzeichnet den Bezug, ohne eine weitergehende dogmatische Aussage einzutragen.
- issue: Soll הָאֹהֱלָה ausdrücklich als ‚Zelt der Begegnung‘ wiedergegeben werden?
  choice: zum Zelt
  alternative: zum Zelt der Begegnung
  rationale: Der Zusammenhang legt das Zelt der Begegnung nahe, doch der hebräische Vers selbst sagt nur ‚das Zelt‘. Deshalb bleibt der Haupttext bei der quellennahen Form und erläutert die wahrscheinliche Identifikation in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater Nähe zur hebräischen Erzählstruktur. Die leicht gehobene Wendung »weissagten« bewahrt den präzisen Bezug auf prophetisches Reden; ungewöhnliche Quellenausdrücke werden durch Fußnoten erschlossen.
