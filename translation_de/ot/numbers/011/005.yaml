  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: de
  text: Wir denken an die Fische, die wir in Ägypten umsonst[a] aßen, an die Gurken, die Melonen, den Lauch, die Zwiebeln und den Knoblauch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kostenlos“ oder „ohne dafür zu bezahlen“. Die Klagenden erinnern sich aus der Perspektive ihrer gegenwärtigen Beschwerde an Ägypten, obwohl sie dort tatsächlich Sklaven waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: Wir denken an
  rationale: Das Qal-Perfekt der 1. Person Plural bezeichnet hier im direkten Klageruf eine gegenwärtige Erinnerung. „Wir denken an“ klingt im modernen Deutschen natürlich und leitet die folgende Aufzählung idiomatisch ein.
- source_word: הַדָּגָה
  choice: die Fische
  rationale: Das Substantiv bezeichnet Fisch kollektiv als Nahrung. Der deutsche Plural gibt diesen Sinn natürlich wieder.
- source_word: אֲשֶׁר נֹאכַל
  choice: die wir … aßen
  rationale: Das Yiqtol steht in einem vergangenen, gewohnheitsmäßigen Zusammenhang. Das Präteritum ist hier knapp und idiomatisch; der Rückblick ergibt sich aus dem Kontext.
- source_word: בְּמִצְרַיִם
  choice: in Ägypten
  rationale: Direkte Wiedergabe der Ortsangabe.
- source_word: חִנָּם
  choice: umsonst
  rationale: Das Adverb bedeutet „ohne Bezahlung, kostenlos“. „Umsonst“ bewahrt sowohl diesen Sinn als auch die im Kontext mitschwingende Ironie, ohne die Aussage der Klagenden zu korrigieren.
- source_word: הַקִּשֻּׁאִים
  choice: die Gurken
  rationale: Übliche und sachlich passende Bezeichnung des genannten Gemüses.
- source_word: הָאֲבַטִּחִים
  choice: die Melonen
  rationale: Der Ausdruck bezeichnet eine Melonenart. „Melonen“ vermeidet eine unnötig enge botanische Festlegung auf Wassermelonen.
- source_word: הֶחָצִיר
  choice: den Lauch
  rationale: Im Zusammenhang dieser Nahrungsmittelliste ist die traditionelle Deutung als Gartengemüse plausibel. „Lauch“ passt besser als die sonst möglichen Bedeutungen „Gras“ oder „Grünzeug“.
- source_word: הַבְּצָלִים
  choice: die Zwiebeln
  rationale: Die übliche lexikalische Entsprechung.
- source_word: הַשּׁוּמִים
  choice: den Knoblauch
  rationale: Die übliche lexikalische Entsprechung; im Deutschen wird „Knoblauch“ normalerweise als Stoff- beziehungsweise Sammelbezeichnung im Singular gebraucht.
theological_decisions:
- issue: Wiedergabe von חִנָּם angesichts der Sklaverei Israels in Ägypten
  choice: umsonst
  alternative: kostenlos; ohne dafür zu bezahlen
  rationale: Der Vers gibt die Erinnerung aus der beschönigenden Perspektive der Klagenden wieder und nicht als objektive Bewertung ihres Lebens in Ägypten. Die direkte Wiedergabe erhält die rhetorische Spannung und Ironie, ohne eine auslegende Korrektur in den Haupttext einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die wiederholte hebräische Akkusativmarkierung wird durch „an“ vor der ersten und der zweiten Aufzählungsgruppe erkennbar gemacht, ohne die deutsche Formulierung durch ständige Wiederholung zu beschweren.
