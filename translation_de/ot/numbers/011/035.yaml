base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: de
  text: Von Kibrot-Hattaawa[a] brach das Volk nach Hazerot auf, und sie blieben in Hazerot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibrot-Hattaawa bedeutet »Gräber des Verlangens« oder »Gräber der Begierde«.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  choice: Von Kibrot-Hattaawa
  rationale: Der Ausdruck ist ein transparenter Ortsname aus »Gräber« und »Verlangen/Begierde«. Im erzählenden Reisebericht wird er als Eigenname transliteriert; seine Bedeutung wird in einer Fußnote bewahrt.
- source_word: נָסְע֥וּ
  choice: brach … auf
  rationale: נסע bezeichnet in Reiseberichten häufig das Aufbrechen eines Lagers und den anschließenden Weitermarsch. »aufbrechen« gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: הָ/עָ֖ם
  choice: das Volk
  rationale: עם bezeichnet hier die israelitische Gemeinschaft als Kollektiv. »das Volk« ist die übliche und kontextgerechte Wiedergabe.
- source_word: חֲצֵר֑וֹת
  choice: Hazerot
  rationale: Der Ortsname wird nach einer im Deutschen verständlichen, quellenahen Umschrift wiedergegeben.
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  choice: und sie blieben in Hazerot
  rationale: Wörtlich heißt die Wendung »und sie waren in Hazerot«. Im Zusammenhang einer Reiseroute bezeichnet היה mit ב den Aufenthalt an einem Ort; »blieben« vermittelt dies idiomatisch, ohne die Dauer näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen werden transliteriert; die durchschaubare Bedeutung von Kibrot-Hattaawa wird durch die Fußnote zugänglich gemacht. Die Wiederholung von Hazerot bleibt entsprechend dem hebräischen Text erhalten.
