source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: de
  text: Da ging Mose hinaus und sagte dem Volk die Worte Jahwes. Er versammelte siebzig Männer aus den Ältesten des Volkes und stellte sie rings um das Zelt[a] auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „das Zelt“; nach dem Zusammenhang ist wahrscheinlich das Zelt der Begegnung gemeint.
    reason: cross_reference
  - marker: b
    text: Oder „ließ sie dort stehen“. Das hebräische Verb bedeutet wörtlich „brachte sie zum Stehen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging hinaus
  rationale: Das Verb יצא bezeichnet hier in der fortlaufenden Erzählung das Hinausgehen aus dem bisherigen Aufenthaltsort. „Ging hinaus“ ist direkt und idiomatisch.
- source_word: וַיְדַבֵּר אֶל הָעָם אֵת דִּבְרֵי יְהוָה
  choice: sagte dem Volk die Worte Jahwes
  rationale: Die Wiedergabe bewahrt sowohl das Reden zum Volk als auch die konkrete hebräische Formulierung „die Worte Jahwes“, ohne sie verengend als bloße „Botschaft“ zu deuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im modernen Deutschen geläufige Umschrift des göttlichen Eigennamens und ersetzt ihn nicht durch einen Titel wie „der HERR“.
- source_word: וַיֶּאֱסֹף
  choice: versammelte
  rationale: אסף bedeutet sammeln oder versammeln; bei einer Gruppe von Personen ist „versammelte“ im Deutschen besonders natürlich.
- source_word: שִׁבְעִים אִישׁ
  choice: siebzig Männer
  rationale: אִישׁ wird nach der Zahl kollektiv gebraucht und bezeichnet im Zusammenhang die männlichen Ältesten; die geschlechtsspezifische Aussage bleibt erhalten.
- source_word: מִזִּקְנֵי הָעָם
  choice: aus den Ältesten des Volkes
  rationale: Die Präposition מִן hat hier partitive Bedeutung. זִקְנֵי bezeichnet anerkannte Älteste und nicht lediglich ältere Männer.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: stellte sie … auf
  rationale: Der Hifil von עמד bedeutet wörtlich, jemanden zum Stehen zu bringen beziehungsweise an einen Platz zu stellen. „Aufstellen“ gibt die gezielte Platzierung idiomatisch wieder.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: rings um das Zelt
  rationale: סְבִיבֹת bezeichnet die Lage ringsherum; הָאֹהֶל lautet hier lediglich „das Zelt“. Die kontextuelle Bestimmung als Begegnungszelt wird deshalb nicht in den Haupttext eingefügt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt diesen Charakter, während „der HERR“ einen Titel an seine Stelle setzen würde.
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: siebzig Männer
  alternative: siebzig Personen
  rationale: Die grammatisch männliche Bezeichnung steht hier im Zusammenhang mit den ausgewählten Ältesten. Eine geschlechtsneutrale Wiedergabe würde diese Angabe abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die konkrete Wendung „die Worte Jahwes“ und das schlichte „das Zelt“ bleiben erhalten; unnötig altertümliche Formen werden vermieden.
