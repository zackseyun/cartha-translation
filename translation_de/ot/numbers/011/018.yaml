  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: de
  text: 'Und zum Volk sollst du sagen: »Heiligt euch für morgen[a], und ihr werdet Fleisch essen. Denn ihr habt vor Jahwes Ohren geweint und gesagt: ›Wer gibt uns Fleisch zu essen? Denn in Ägypten ging es uns gut.‹ Und Jahwe wird euch Fleisch geben, und ihr werdet essen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sondert euch für morgen aus.« Das hebräische Verb bezeichnet ein Sich-Heiligen beziehungsweise Sich-Absondern zur Vorbereitung auf Jahwes Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאמַר
  choice: sollst du sagen
  rationale: Das Imperfekt 2. Person Singular richtet sich mit auffordernder Kraft an Mose; die deutsche Soll-Konstruktion gibt den Auftrag natürlich und deutlich wieder.
- source_word: הִתְקַדְּשׁוּ
  choice: Heiligt euch
  rationale: Der Hitpael-Imperativ von קדשׁ bezeichnet das Sich-Absondern beziehungsweise Sich-Bereitmachen für Gottes Handeln; »heiligt euch« bewahrt die religiöse Bedeutung.
- source_word: לְמָחָר
  choice: für morgen
  rationale: Die Präposition bezeichnet die Vorbereitung im Blick auf den kommenden Tag.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: dann werdet ihr Fleisch essen
  rationale: בָּשָׂר meint hier Speisefleisch; die Verbfolge nach dem Imperativ drückt die anschließende Folge beziehungsweise Zukunft aus.
- source_word: בְּכִיתֶם
  choice: ihr habt ... geweint
  rationale: Das Qatal verweist auf das vorausgegangene Weinen, das Gottes folgende Reaktion begründet.
- source_word: בְּאָזְנֵי יְהוָה
  choice: vor den Ohren Jahwes
  rationale: Die Wiedergabe erhält das konkrete hebräische Bild und ist im Deutschen verständlich; gemeint ist, dass Jahwe ihr Klagen hörte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen geläufige Transkription.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Wer gibt uns Fleisch zu essen?
  rationale: Der Hifil von אכל bedeutet wörtlich »essen lassen« beziehungsweise »zu essen geben«; diese Formulierung bewahrt den kausativen Sinn idiomatisch.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: Denn in Ägypten ging es uns gut
  rationale: Die Wendung gibt טוֹב לָנוּ natürlich wieder, ohne einen im Hebräischen nicht ausdrücklich vorhandenen Vergleich einzuführen.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: Darum wird Jahwe euch Fleisch geben
  rationale: Das einfache ו verbindet hier die Klage mit Jahwes daraus folgender Antwort; »darum« macht diese im Zusammenhang erkennbare Folgerung im Deutschen deutlich.
- source_word: וַאֲכַלְתֶּם
  choice: und ihr werdet essen
  rationale: Die Wiederholung des Essens wird entsprechend dem Hebräischen wegen ihrer nachdrücklichen Wirkung beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Vorbereitung des Volkes mit הִתְקַדְּשׁוּ
  choice: Heiligt euch
  alternative: Bereitet euch vor
  rationale: Die gewählte Formulierung bewahrt die religiös-kultische Färbung, ohne die genaue Art der Vorbereitung näher festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede ist klar gegliedert; die hebräische Wiederholung und das Bild von den »Ohren Jahwes« bleiben erhalten.
