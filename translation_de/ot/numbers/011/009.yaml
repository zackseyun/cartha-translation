  register: Modernes, klares und würdiges Standarddeutsch. Die Wiederholung von „herabkommen“ bildet die hebräische Wortwiederholung bewusst nach; „auch“ verdeutlicht die natürliche Zuordnung beider paralleler Vorgänge, ohne den pronominalen Bezug von עָלָיו aufzulösen.
