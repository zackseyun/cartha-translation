  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: de
  text: Wenn der Tau nachts auf das Lager herabkam,[a] kam das Manna darauf herab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und wenn der Tau nachts auf das Lager herabkam, kam das Manna darauf herab.“ Im Hebräischen steht für Tau und Manna dasselbe Verb („herabkommen“); dadurch wird die Parallelität betont.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: Wenn … herabkam
  rationale: Die Verbindung aus Konjunktion, Präposition und Infinitivus constructus von ירד leitet hier einen temporalen Nebensatz ein. „Wenn … herabkam“ ist natürliches Deutsch und gibt den wiederholten Vorgang im Erzählzusammenhang wieder.
- source_word: הַטַּל
  choice: der Tau
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: עַל הַמַּחֲנֶה
  choice: auf das Lager
  rationale: עַל bezeichnet hier das Ziel bzw. die Fläche, auf die der Tau herabkommt; „auf das Lager“ ist im Deutschen bildhaft und idiomatisch.
- source_word: לָיְלָה
  choice: nachts
  rationale: Das adverbial gebrauchte Zeitwort wird in modernem Deutsch knapp und natürlich mit „nachts“ wiedergegeben.
- source_word: יֵרֵד
  choice: kam … herab
  rationale: Das Imperfekt beschreibt im narrativen Zusammenhang einen regelmäßig wiederkehrenden Vorgang. Das Präteritum ist hier natürlich; die Wiederholung von „herabkam/herab“ bewahrt die lexikalische Parallele zum ersten Vorkommen von ירד.
- source_word: הַמָּן
  choice: das Manna
  rationale: Das bestimmte Substantiv bezeichnet die bereits bekannte Nahrung.
- source_word: עָלָיו
  choice: darauf
  rationale: Das maskuline Singularsuffix verweist grammatisch am ehesten auf das Lager zurück. „Darauf“ bewahrt den pronominalen Bezug, ohne das Verhältnis zwischen Tau und Manna genauer festzulegen, als es der hebräische Text tut.
