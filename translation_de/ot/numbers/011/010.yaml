id: NUM.11.10
reference: Numbers 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: de
  text: Mose hörte, wie das Volk nach seinen Sippen[a] weinte, jeder Mann am Eingang seines Zeltes. Da entbrannte Jahwes Zorn heftig, und in Moses Augen war es schlimm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach ihren Familien«. Das hebräische Wort kann Familienverbände oder Sippen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und es missfiel Mose«. Wörtlich: »und in Moses Augen war es schlimm/böse«; worauf sich »es« bezieht, bleibt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Das Qal-Wayyiqtol von שׁמע bezeichnet hier die akustische Wahrnehmung des Weinens; »hörte« ist die natürliche deutsche Entsprechung.
- source_word: הָעָם בֹּכֶה
  choice: wie das Volk … weinte
  rationale: Das Partizip schildert ein andauerndes Geschehen. Die Konstruktion mit »wie« ist im Deutschen idiomatisch und bewahrt den Vorgangscharakter.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: nach seinen Sippen
  rationale: מִשְׁפָּחָה bezeichnet verwandtschaftlich gegliederte Familienverbände. »Sippen« gibt diese soziale Einheit präziser wieder als das engere »Familien«.
- source_word: אִישׁ
  choice: jeder Mann
  rationale: Der maskuline Singular wird distributiv gebraucht und bezeichnet die einzelnen Männer beziehungsweise Haushaltsvorstände innerhalb des Volkes.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: am Eingang seines Zeltes
  rationale: Die Formulierung erhält das räumliche Bild des hebräischen Textes und klingt im Deutschen natürlich.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: Da entbrannte Jahwes Zorn heftig
  rationale: »Entbrannte« bewahrt die hebräische Metapher vom brennenden Zorn; »heftig« gibt die Verstärkung durch מְאֹד idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben; »Jahwe« ist die im modernen Deutschen geläufige Form.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: und in Moses Augen war es schlimm
  rationale: Die Wiedergabe hält an der bildhaften Wendung »in den Augen« sowie am unausgesprochenen Bezug von רָע fest, klingt aber natürlicher als »es war böse«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. Seine Wiedergabe als »Jahwe« bewahrt dies, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug und Wertung von וּבְעֵינֵי מֹשֶׁה רָע
  choice: in Moses Augen war es schlimm
  alternative: es missfiel Mose
  rationale: Der hebräische Text lässt offen, worauf sich die negative Wertung genau bezieht. Die gewählte Form bewahrt diese Unbestimmtheit und die stärkere Wertung von רָע, ohne Mose ausdrücklich zum moralischen Urteilenden zu machen.
- issue: Distributives אִישׁ
  choice: jeder Mann
  alternative: jeder Einzelne
  rationale: Die Übersetzung bildet die grammatisch maskuline Einzahl ab, die hier distributiv innerhalb der Gemeinschaft gebraucht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Zornesmetapher und die bewusst unbestimmte Schlusswendung bleiben erhalten; altertümliche Satzstellung und unnötige Konfessionssprache werden vermieden.
