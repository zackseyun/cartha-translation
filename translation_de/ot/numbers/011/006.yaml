source:
  edition: WLC
  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: de
  text: Aber jetzt ist unser Verlangen ausgetrocknet[a]; es gibt überhaupt nichts außer dem Manna vor unseren Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unsere Seele ist ausgetrocknet.“ Das hebräische Wort נֶפֶשׁ (nefesch) kann „Seele“, „Leben“ oder in einem Zusammenhang mit Nahrung „Verlangen/Appetit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Aber jetzt
  rationale: Die Verbindung aus Konjunktion und Zeitadverb bildet im Zusammenhang einen Gegensatz zur zuvor beschriebenen Versorgung und gibt den klagenden Ton natürlich wieder.
- source_word: נַפְשֵׁנוּ
  choice: unser Verlangen
  rationale: נֶפֶשׁ bezeichnet zwar häufig Seele oder Leben, kann in einem Kontext von Hunger und Nahrung aber das innere Begehren beziehungsweise den Appetit meinen. „Verlangen“ bewahrt etwas von der Bedeutungsbreite und passt zur Nahrungsklage.
- source_word: יְבֵשָׁה
  choice: ist ausgetrocknet
  rationale: Das Adjektiv bezeichnet einen trockenen, verdorrten Zustand. Die bildhafte Formulierung des Hebräischen wird damit erhalten.
- source_word: אֵין כֹּל
  choice: es gibt überhaupt nichts
  rationale: „Überhaupt“ gibt die emphatische Verneinung mit כֹּל idiomatisch wieder.
- source_word: בִּלְתִּי אֶל
  choice: außer
  rationale: 'Die Konstruktion drückt Ausschluss aus: Nichts ist da mit Ausnahme des Mannas.'
- source_word: הַמָּן
  choice: dem Manna
  rationale: Der bestimmte Artikel verweist auf die bekannte Nahrung; im Deutschen lässt sich dies natürlich mit „dem Manna“ ausdrücken, ohne ein im Ausgangstext nicht vorhandenes Demonstrativ einzuführen.
- source_word: עֵינֵינוּ
  choice: vor unseren Augen
  rationale: Die konkrete Wendung wird formal bewahrt und bezeichnet das Einzige, was sie fortwährend zu sehen bekommen.
theological_decisions: []
