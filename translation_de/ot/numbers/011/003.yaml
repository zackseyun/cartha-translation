id: NUM.11.3
reference: Numbers 11:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: de
  text: Da nannte er diesen Ort Tabera[a], denn das Feuer Jahwes hatte unter ihnen gebrannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tabera klingt im Hebräischen wie das Wort für »Brennen«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: Da nannte er diesen Ort
  rationale: Die deutsche Wendung gibt die hebräische Namensgebungsformel natürlich und vollständig wieder; ein wörtliches „er nannte den Namen dieses Ortes“ wäre im modernen Deutsch schwerfällig.
- source_word: תַּבְעֵרָה
  choice: Tabera
  rationale: Der Ortsname wird in üblicher deutscher Form transliteriert; sein Wortspiel mit dem folgenden Verb wird in der Fußnote erläutert.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Namensgebung ein; „denn“ ist hier idiomatisch und bewahrt den erzählerischen Zusammenhang.
- source_word: בָעֲרָה
  choice: hatte ... gebrannt
  rationale: בער bezeichnet das Brennen. Das Plusquamperfekt macht im Deutschen deutlich, dass das Feuer Anlass für die anschließende Namensgebung war, ohne die Aussage inhaltlich zu erweitern.
- source_word: בָם
  choice: unter ihnen
  rationale: Die Präposition bezeichnet hier das Brennen innerhalb der Gemeinschaft beziehungsweise des Lagers, nicht ein innerliches Brennen in einzelnen Personen.
- source_word: אֵשׁ יְהוָה
  choice: das Feuer Jahwes
  rationale: Die Konstruktion wird eng am Hebräischen wiedergegeben und lässt sowohl die Zugehörigkeit als auch den göttlichen Ursprung des Feuers anklingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form und vermeidet, den Namen durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kompakte Erzählform bleibt erhalten; der hebräische Namensklang wird wegen seiner Bedeutung für die Begründung in einer Fußnote erläutert.
