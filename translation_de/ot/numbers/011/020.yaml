  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: de
  text: 'einen ganzen Monat lang, bis es euch zur Nase herauskommt und euch zum Ekel wird[a]. Denn ihr habt Jahwe verworfen, der mitten unter euch ist, und vor ihm geweint und gesagt: »Warum sind wir nur aus Ägypten ausgezogen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und euch widerwärtig wird«; das hebräische Wort drückt starke Abscheu aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: einen ganzen Monat lang
  rationale: Die wörtliche Wendung »bis zu einem Monat von Tagen« bezeichnet idiomatisch die Dauer eines vollen Monats; die deutsche Fassung gibt Dauer und Nachdruck natürlich wieder.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: bis es euch zur Nase herauskommt
  rationale: אַפּ bezeichnet hier konkret Nase bzw. Nasenlöcher. Die geläufige deutsche Wendung bewahrt das drastische Körperbild des Hebräischen, ohne steif zu wirken.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: und euch zum Ekel wird
  rationale: Das seltene זָרָא bezeichnet etwas Widerwärtiges oder Abscheuliches. »Zum Ekel werden« vermittelt die starke Abscheu klar und idiomatisch.
- source_word: יַעַן כִּי
  choice: Denn
  rationale: Die Verbindung leitet den Grund für das angekündigte Gericht ein; »Denn« stellt diesen Zusammenhang im Deutschen klar her.
- source_word: מְאַסְתֶּם
  choice: ihr habt verworfen
  rationale: Das Verb bezeichnet ablehnendes Zurückweisen, oft mit dem Beiklang der Missachtung. »Verworfen« wahrt diese Stärke und passt zur Bundesbeziehung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: der mitten unter euch ist
  rationale: Die Formulierung bezeichnet Jahwes Gegenwart in der Gemeinschaft und vermeidet die individualistische Deutung »in euch«.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: und vor ihm geweint
  rationale: Die Wiedergabe bewahrt sowohl das tatsächliche Weinen als auch dessen Ausrichtung auf Gottes Gegenwart.
- source_word: לָמָּה זֶּה
  choice: Warum ... nur
  rationale: Das deiktische זֶה verstärkt hier die vorwurfsvolle Frage. Das deutsche Modalwort »nur« gibt diesen Ton natürlich wieder, ohne eine neue Sachinformation hinzuzufügen.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: sind wir ... aus Ägypten ausgezogen
  rationale: »Ausziehen« greift die konkrete Bedeutung von יצא auf und entspricht zugleich dem etablierten deutschen Sprachgebrauch für den Exodus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm. Die Wiedergabe mit dem Eigennamen »Jahwe« bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Bedeutung von מְאַסְתֶּם gegenüber Jahwe
  choice: verworfen
  alternative: verachtet
  rationale: Das Verb kann Zurückweisung mit Verachtung verbinden. »Verworfen« lässt den Schwerpunkt auf der Zurückweisung liegen, ohne die emotionale Nuance zwingend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das drastische Bild wird mit der natürlichen Wendung »zur Nase herauskommen« bewahrt. »Warum ... nur« gibt den verstärkten, klagenden Frageton wieder. Der Vers beginnt als Fortsetzung des vorangehenden Satzes bewusst kleingeschrieben.
