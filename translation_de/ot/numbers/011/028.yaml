  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: de
  text: 'Da antwortete Josua, Sohn Nuns, der Mose seit seiner Jugend diente[a]: »Mein Herr Mose, halte sie zurück![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Schar von Moses jungen Männern“, möglicherweise auch: „aus der Schar seiner Erwählten“. Die hebräische Wendung ist knapp und nicht eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verbiete es ihnen!“ Das hebräische Verb kann „zurückhalten“, „hindern“ oder „verbieten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: Das narrative Wayyiqtol führt Josuas Reaktion ein. „Da antwortete“ gibt sowohl die Erzählfolge als auch die Antwortfunktion in natürlichem Deutsch wieder.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, der Sohn Nuns
  rationale: Die Namen folgen der etablierten deutschen Bibeltradition; der Genitiv „Nuns“ ist idiomatisches Standarddeutsch.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: der Mose ... diente
  rationale: מְשָׁרֵת bezeichnet einen persönlichen Helfer oder Diener. Die verbale Wiedergabe ist im Deutschen natürlich und vermeidet die heute leicht missverständliche Bezeichnung „Diener“.
- source_word: מִבְּחֻרָיו
  choice: seit seiner Jugend
  rationale: Die kompakte, textlich schwierige Wendung wird als zeitliche Angabe zu Josuas Dienst verstanden. Da auch die Deutung „einer seiner jungen Männer“ beziehungsweise „einer seiner Erwählten“ möglich ist, bleibt die Mehrdeutigkeit in einer Fußnote sichtbar.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: Mein Herr Mose
  rationale: אֲדֹנִי ist hier die ehrerbietige Anrede eines menschlichen Vorgesetzten. „Mein Herr“ bewahrt diesen respektvollen Ton.
- source_word: כְּלָאֵם
  choice: halte sie zurück
  rationale: Der Imperativ von כלא kann Zurückhalten, Hindern oder Verbieten bezeichnen. „Halte sie zurück“ wahrt die Breite des Ausdrucks, ohne die konkrete Art des Eingreifens festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „Mein Herr Mose“ bewahrt Josuas Ehrerbietung; die beiden Fußnoten erhalten die genuine lexikalische Mehrdeutigkeit des Hebräischen.
