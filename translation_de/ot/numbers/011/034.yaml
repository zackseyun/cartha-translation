review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Erzählfolge, den nicht näher bestimmten Handelnden im Singular sowie das unbestimmte Plural-Subjekt beim Begraben im Wesentlichen zutreffend wieder. „von Begierde erfüllt gewesen waren“ ist jedoch keine unmittelbare Wiedergabe des substantivierten Partizips הַמִּתְאַוִּים („diejenigen, die gierig begehrten / begehrt hatten“), sondern fügt die Vorstellung eines Erfülltseins hinzu.
  naturalness: Die Namensformel und die Syntax sind verständlich und würdig. „die Leute, die von Begierde erfüllt gewesen waren“ klingt jedoch unnötig schwer und die doppelte Vorzeitigkeit ist im Deutschen hier nicht erforderlich.
  terminology: „Kibrot-Hattaawa“ ist als deutsche Umschrift konsistent. Die Fußnote gibt die wahrscheinliche Bedeutung sachgerecht wieder; „gieriges Verlangen“ wahrt, dass es um ungeordnetes Begehren und nicht spezifisch um sexuelles Verlangen geht.
  issues:
  - severity: medium
    issue: Zusätzliche Bildlichkeit und überstarke Vorzeitigkeit bei der Beschreibung der Begehrenden
    rationale: Das hebräische Partizip bezeichnet die Menschen als solche, die gierig begehrten. Die Formulierung „von Begierde erfüllt gewesen waren“ fügt semantisch ein Erfülltsein hinzu und ist durch das Plusquamperfekt stilistisch und zeitlich schwerfälliger als nötig.
  revised_text: So nannte er jenen Ort Kibrot-Hattaawa[a], denn dort begrub man die Leute, die gierig begehrt hatten.
  revised_footnotes:
