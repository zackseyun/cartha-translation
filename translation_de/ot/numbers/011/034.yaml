  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי שָׁם֙ קָֽבְר֔וּ אֶת הָ/עָ֖ם הַ/מִּתְאַוִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: de
  text: So nannte er jenen Ort Kibrot-Hattaawa[a], denn dort begrub man die Leute, die gierig begehrt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibrot-Hattaawa bedeutet wahrscheinlich „Gräber der Begierde“ oder „Gräber des gierigen Verlangens“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: So nannte er
  rationale: Das Wayyiqtol führt die Handlung erzählerisch fort. Die 3. Person Singular bleibt erhalten, ohne den im Hebräischen nicht ausdrücklich genannten Handelnden namentlich festzulegen.
- source_word: אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: jenen Ort
  rationale: Die deutsche Benennungsformel „einen Ort nennen“ gibt den Sinn der wörtlichen hebräischen Wendung „den Namen jenes Ortes nennen“ natürlich und vollständig wieder.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: Kibrot-Hattaawa
  rationale: Der Ortsname wird in einer dem Hebräischen angenäherten deutschen Umschrift wiedergegeben; seine Bedeutung wird in der Fußnote erläutert.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Namensgebung ein; „denn“ ist in diesem erzählerischen Satz idiomatisch.
- source_word: שָׁם קָבְרוּ
  choice: dort begruben sie
  rationale: Ortadverb und qal Perfekt Plural werden direkt wiedergegeben; das unbestimmte „sie“ wahrt, dass die Bestattenden im Vers nicht näher bezeichnet werden.
- source_word: אֶת הָעָם הַמִּתְאַוִּים
  choice: die Leute, die von Begierde erfüllt gewesen waren
  rationale: „Leute“ bezeichnet hier die betroffene Gruppe aus dem Volk. Das Partizip von התאוה drückt starkes, ungeordnetes Verlangen aus; die vorzeitige Form entspricht der rückblickenden Begründung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der implizite Singular bei „nannte er“ und der unbestimmte Plural bei „begruben sie“ bleiben entsprechend dem Hebräischen erhalten; der Ortsname wird transliteriert und nicht im Haupttext übersetzt.
