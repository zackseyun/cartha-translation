revisions:
- from: So nannte er jenen Ort Kibrot-Hattaawa[a], denn dort begruben sie die Leute, die von Begierde erfüllt gewesen waren.
  to: So nannte er jenen Ort Kibrot-Hattaawa[a], denn dort begrub man die Leute, die gierig begehrt hatten.
  rationale: Die Übersetzung behält die narrative Singularform und die Namensumschrift bei. „begrub man“ gibt das im Hebräischen nicht weiter bestimmte Plural-Subjekt im natürlichen modernen Deutsch wieder. „die gierig begehrt hatten“ gibt den substantivierten Partizipialausdruck ohne die zusätzliche Vorstellung wieder, sie seien von Begierde „erfüllt“ gewesen.
  reviewer_model: gpt-5.6-terra
