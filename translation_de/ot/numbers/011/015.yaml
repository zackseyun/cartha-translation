id: NUM.11.15
reference: Numbers 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: de
  text: Wenn du so mit mir umgehst, dann töte mich doch gleich – wenn ich Gunst in deinen Augen gefunden habe – und lass mich mein Elend[a] nicht mit ansehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Unglück“ oder „mein Unheil“. Das hebräische Wort kann Not und Verderben bezeichnen, nicht nur moralisch Böses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn
  rationale: Leitet den Bedingungssatz ein; das vorangestellte וְ muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: כָּכָה
  choice: so
  rationale: Natürliche deutsche Wiedergabe des modalen Adverbs in Moses’ Klage.
- source_word: אַתְּ ... עֹשֶׂה לִּי
  choice: du so mit mir umgehst
  rationale: עָשָׂה mit לְ bezeichnet hier, wie Gott an Mose handelt. „Mit mir umgehen“ gibt die relationale Aussage idiomatisch und quellennah wieder.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: dann töte mich doch gleich
  rationale: Der Infinitivus absolutus verstärkt den Imperativ; „gleich“ vermittelt die Eindringlichkeit, während „doch“ den flehenden Ton von נָא aufnimmt.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: wenn ich Gunst in deinen Augen gefunden habe
  rationale: Bewahrt die geläufige hebräische Wendung und ihr Bild; „Gunst“ bezeichnet Gottes wohlwollende Zuwendung, ohne zusätzliche dogmatische Bedeutung einzutragen.
- source_word: וְאַל אֶרְאֶה
  choice: und lass mich ... nicht mit ansehen
  rationale: Gibt die an Gott gerichtete negative Bitte natürlich wieder und bewahrt zugleich das Motiv des Sehens.
- source_word: בְּרָעָתִי
  choice: mein Elend
  rationale: רָעָה kann Not, Unheil oder Unglück bezeichnen und muss hier nicht moralisch als „Böses“ verstanden werden. Im Zusammenhang beklagt Mose seine bedrängte Lage.
theological_decisions:
- issue: Bedeutung von בְּרָעָתִי in Moses’ Bitte
  choice: mein Elend, also persönliche Not oder bedrängende Lage
  alternative: mein Böses; mein Unglück; das Unheil, das mich trifft
  rationale: Der Zusammenhang schildert Moses Verzweiflung unter seiner Last, nicht ausdrücklich ein Bekenntnis eigener moralischer Bosheit. „Elend“ wahrt den Sinn persönlicher Not, während die Fußnote die mögliche Bedeutungsbreite offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die eingeschobene Bedingung ab und erhält die emotionale Dringlichkeit von Moses Bitte. Die Bildsprache „Gunst in deinen Augen“ wurde bewusst bewahrt.
