revisions:
- from: Das Volk aber klagte vor den Ohren Jahwes über sein Unglück[a]. Als Jahwe es hörte, entbrannte sein Zorn. Da brannte das Feuer Jahwes[b] unter ihnen und verzehrte einen Teil am Rand des Lagers[c].
  to: Das Volk glich Menschen, die über Not klagten[a]. Jahwe hörte es, und sein Zorn entbrannte. Da brannte das Feuer Jahwes[b] unter ihnen und fraß am Rand des Lagers[c] um sich.
  rationale: Die Revision hält die im Hebräischen schwierige Vergleichskonstruktion im Haupttext fest, ohne sie mit einer unnatürlichen wörtlichen Wendung zu belasten. Das hebräische Hörbild wird transparent in der Anmerkung dokumentiert. Die Formulierung „fraß ... um sich“ vermeidet eine sachlich nicht abgesicherte Ergänzung zum ausgelassenen Objekt von „verzehrte“, während sie die Wirkung des Feuers und die Ortsangabe bewahrt.
