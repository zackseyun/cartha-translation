source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: de
  text: Das Volk glich Menschen, die über Not klagten[a]. Jahwe hörte es, und sein Zorn entbrannte. Da brannte das Feuer Jahwes[b] unter ihnen und fraß am Rand des Lagers[c] um sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Das Volk war wie Klagende über Unglück/Not in den Ohren Jahwes.“ Die hebräische Form ist selten und schwierig; möglich sind auch „als Klagende“, „klagend“ oder „wie wenn es klagte“. „In den Ohren Jahwes“ bedeutet, dass die Klage zu Jahwes Gehör kam.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Feuer von Jahwe“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „an den Außenbezirken des Lagers“. Was das Feuer dort verzehrte, wird im Hebräischen nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים רַע
  choice: Das Volk aber klagte … über sein Unglück
  rationale: Die seltene und schwierige Form כְּמִתְאֹנְנִים bezeichnet hier fortgesetztes Klagen oder Murren; רַע wird im Zusammenhang am ehesten als erlittenes Unglück beziehungsweise Not verstanden. Das deutsche Präteritum gibt den hebräischen Erzählfortgang natürlich wieder, während die Fußnote die vergleichende Form mit כ und ihre Unsicherheit offenlegt.
- source_word: בְּאָזְנֵי יְהוָה
  choice: vor den Ohren Jahwes
  rationale: 'Die Formulierung bewahrt das hebräische Hörbild und ist im Deutschen verständlich: Das Klagen gelangte unmittelbar zu Jahwes Gehör.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Als Jahwe es hörte
  rationale: Das im Hebräischen unausgesprochene Objekt wird aus dem Zusammenhang mit „es“ ergänzt; die temporale Verbindung bildet die enge Erzählfolge idiomatisch ab.
- source_word: וַיִּחַר אַפּוֹ
  choice: entbrannte sein Zorn
  rationale: Die geläufige deutsche Wendung erhält das hebräische Bild des brennenden Zorns, ohne das Körperbild der wörtlich genannten Nase unnatürlich nachzubilden.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: Da brannte das Feuer Jahwes unter ihnen
  rationale: „Feuer Jahwes“ wahrt die Genitivverbindung, und „unter ihnen“ gibt בָּם wieder, ohne die genaue Art des göttlichen Bezugs vorschnell als Herkunft oder Besitz festzulegen.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: und verzehrte einen Teil am Rand des Lagers
  rationale: Da das Objekt von „verzehrte“ im Hebräischen nicht ausdrücklich genannt wird, vermeidet „einen Teil“ die engere Festlegung auf Personen; בִּקְצֵה bezeichnet den Rand beziehungsweise Außenbereich des Lagers.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt ihn als solchen, ohne einen traditionellen Ersatztitel in den Text einzutragen.
- issue: Zuordnung des Gerichtsfeuers
  choice: das Feuer Jahwes
  alternative: ein Feuer von Jahwe
  rationale: Die Genitivkonstruktion bleibt erhalten und damit auch eine gewisse Offenheit, ob sie vor allem Zugehörigkeit, Ursprung oder göttliche Wirksamkeit bezeichnet.
- issue: Nicht genanntes Objekt von וַתֹּאכַל
  choice: einen Teil
  alternative: einige von ihnen; den Randbereich
  rationale: Der hebräische Text sagt nicht ausdrücklich, ob Menschen, Zelte oder ein Bereich des Lagers verzehrt wurden. Die gewählte Formulierung ergänzt nur das im Deutschen nötige Objekt und vermeidet eine unnötige personelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Vor den Ohren“ bewahrt bewusst das konkrete hebräische Hörbild. Die schwerfällige Reihung zahlreicher deutscher „und“-Sätze wird maßvoll gegliedert, ohne die Abfolge von Klage, Hören, Zorn und Feuer zu verwischen.
