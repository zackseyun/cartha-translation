base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: de
  text: 'Das Gesindel[a], das sich unter ihnen befand, hatte ein starkes Verlangen[b]. Auch die Söhne Israels[c] weinten wieder und sagten: »Wer wird uns Fleisch zu essen geben?«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gemischte Menge“. Das seltene hebräische Wort ist abwertend und bezeichnet eine nicht zum Kern gehörende Gruppe inmitten Israels.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „begehrte ein Begehren“; die Verbindung eines Verbs mit einem stammverwandten Substantiv verstärkt das Verlangen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Israeliten“. Hebräisch: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Wer wird uns mit Fleisch speisen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: das Gesindel
  rationale: Das seltene kollektive Substantiv ist abwertend und bezeichnet eine nicht zum Kern gehörende Menge im Lager. „Gesindel“ bewahrt den negativen Beiklang und den Kollektivcharakter; die weniger wertende Alternative wird in der Fußnote genannt.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: das sich unter ihnen befand
  rationale: Die Wendung bedeutet wörtlich „das in seiner Mitte war“. Die deutsche Fassung löst den kontextbedingten Numerusbezug natürlich auf und bezeichnet die Menge innerhalb des Volkes beziehungsweise Lagers.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: wurde von heftiger Gier gepackt
  rationale: Verb und stammverwandtes Substantiv bilden eine verstärkende figura etymologica. Die gewählte Formulierung gibt die Intensität in natürlichem Deutsch wieder, ohne das unbeholfene „gierte eine Gier“ in den Haupttext zu übernehmen.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: Da weinten … wieder
  rationale: שׁוב bezeichnet hier am wahrscheinlichsten die Wiederaufnahme des Weinens. „Wieder“ gibt diesen idiomatischen Sinn klarer wieder als das im Deutschen missverständliche „sie kehrten um und weinten“.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: auch die Söhne Israels
  rationale: Die formnahe Wiedergabe erhält die hebräische Abstammungsbezeichnung. „Die Israeliten“ ist die natürlichere deutsche Entsprechung und wird als Alternative vermerkt.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Wer wird uns Fleisch zu essen geben?
  rationale: Der Hifil von אכל bedeutet „essen lassen, zu essen geben, speisen“. Die gewählte Frage ist im Deutschen natürlich und bewahrt sowohl das Fleisch als Objekt als auch den Gedanken des Zu-essen-Gebens.
