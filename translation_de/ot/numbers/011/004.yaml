  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die abwertende Wirkung des seltenen הָאסַפְסֻף bleibt erhalten; die hebräische Intensivkonstruktion wird im Haupttext natürlich und in der Fußnote formal transparent wiedergegeben. Das idiomatische „wieder“ bei שׁוב vermeidet eine sachlich irreführende räumliche Deutung.
