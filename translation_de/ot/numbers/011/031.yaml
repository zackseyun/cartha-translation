source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: de
  text: Da ging ein Wind von Jahwe aus[a], trieb Wachteln vom Meer heran und ließ sie beim Lager niedergehen, etwa eine Tagesreise weit auf dieser Seite und eine Tagesreise weit auf jener Seite, rings um das Lager, und etwa zwei Ellen über dem Erdboden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da ging ein Geist von Jahwe aus.« Das hebräische Wort kann »Wind« oder »Geist« bedeuten; hier spricht das Herantragen der Wachteln vom Meer deutlich für »Wind«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »etwa zwei Ellen über/auf der Fläche des Erdbodens«. Die Angabe kann die Höhe bezeichnen, in der die Wachteln flogen oder verteilt waren, möglicherweise aber auch die Tiefe einer Schicht auf dem Boden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: ein Wind
  rationale: רוּחַ kann »Wind«, »Atem« oder »Geist« bedeuten. Da er hier Wachteln vom Meer heranträgt, passt »Wind« im Zusammenhang am besten; die mögliche Bedeutung »Geist« bleibt in einer Fußnote sichtbar.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: ging ... von Jahwe aus
  rationale: נָסַע bezeichnet gewöhnlich ein Aufbrechen oder Sich-in-Bewegung-Setzen. In Verbindung mit רוּחַ und מֵאֵת gibt die Formulierung den Ursprung der Bewegung bei Jahwe natürlich wieder, ohne ihren Mechanismus näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּגָז שַׂלְוִים
  choice: trieb Wachteln ... heran
  rationale: Das seltene Verb גוז bezeichnet hier im Zusammenhang die Wirkung des Windes, der die Wachteln vom Meer zum Lager bringt. »trieb ... heran« bewahrt sowohl die Bewegung als auch die Kraft des Windes.
- source_word: מִן הַיָּם
  choice: vom Meer
  rationale: Die Wendung bezeichnet in ihrem einfachen geografischen Sinn die Herkunft der Vögel vom Meer.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: ließ sie rings um das Lager niedergehen
  rationale: נטשׁ kann unter anderem »ausbreiten«, »hinwerfen« oder »liegen lassen« bedeuten. Zusammen mit den folgenden räumlichen Angaben ist das Niedergehen beziehungsweise Verteilen der Wachteln gemeint. »rings um« nimmt die nachfolgende ausdrückliche Angabe auf und vermeidet die Vorstellung, sie seien direkt auf die Zelte gefallen.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: ungefähr eine Tagesreise weit auf der einen Seite und eine Tagesreise weit auf der anderen Seite
  rationale: Die Wiedergabe erhält die wiederholte, räumliche Formulierung des Hebräischen und kennzeichnet durch »ungefähr« die approximative Kraft von כְּ.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: rings um das Lager
  rationale: Die Formulierung gibt den umfassenden räumlichen Sinn der pluralischen Wendung knapp und natürlich wieder.
- source_word: וּכְאַמָּתַיִם
  choice: etwa zwei Ellen
  rationale: Die alte Maßeinheit bleibt aus formaler Transparenz erhalten; כְּ wird mit »etwa« wiedergegeben.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: über dem Erdboden
  rationale: Wörtlich heißt die Wendung »über/auf der Fläche des Erdbodens«. In Verbindung mit »zwei Ellen« kann sie eine Höhe über dem Boden bezeichnen; da auch eine Schichttiefe denkbar ist, wird die Unsicherheit in einer Fußnote erläutert.
theological_decisions:
- issue: Wirksamkeit des von Jahwe ausgehenden Windes
  choice: Jahwe ist der Ursprung des Windes, der die Wachteln heranträgt.
  alternative: Man könnte stärker dynamisch formulieren, Jahwe habe die Wachteln durch einen Wind gesandt.
  rationale: Der hebräische Text verbindet göttliche Urheberschaft und ein natürliches Mittel, ohne das Verhältnis näher zu erklären. Die Übersetzung erhält diese Spannung.
- issue: רוּחַ als Wind oder Geist
  choice: Wind
  alternative: Geist
  rationale: Die konkrete Tätigkeit des Herantragens vom Meer spricht deutlich für »Wind«. Weil רוּחַ aber auch »Geist« heißen kann und von Jahwe ausgeht, wird die echte lexikalische Alternative nicht verschwiegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur wahrt die ausgreifende räumliche Beschreibung des Hebräischen, wird aber durch einen Doppelpunkt gegliedert. Die Maßeinheit »Elle« bleibt erhalten. Alle Fußnotenmarker stehen im Haupttext.
