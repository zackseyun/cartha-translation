source:
  edition: WLC
  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: de
  text: Da kam Jahwe in der Wolke herab und redete zu ihm. Er nahm von dem Geist, der auf ihm war, und legte ihn auf die siebzig Männer, die Ältesten. Als der Geist auf ihnen ruhte, redeten sie prophetisch; doch danach taten sie es nicht wieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie hörten nicht auf“. Die knappe hebräische Wendung ist unterschiedlich verstanden worden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: וַיֵּרֶד
  choice: kam … herab
  rationale: Die Formulierung gibt die Abwärtsbewegung natürlich wieder und bewahrt die anschauliche Sprache der Gotteserscheinung.
- source_word: בֶּעָנָן
  choice: in der Wolke
  rationale: Der Artikel weist auf die aus dem Zusammenhang bekannte Wolke der göttlichen Gegenwart.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: Er nahm von dem Geist, der auf ihm war
  rationale: Die seltene Verbform bezeichnet hier ein Nehmen beziehungsweise Abzweigen von dem Geist auf Mose. Die Wiedergabe vermeidet die zusätzliche Behauptung, der Geist sei dadurch vermindert worden.
- source_word: רוּחַ
  choice: Geist
  rationale: Der Zusammenhang mit der von Gott verliehenen prophetischen Befähigung spricht für Gottes Geist, nicht für Wind oder eine bloß menschliche Gemütsverfassung.
- source_word: וַיִּתֵּן עַל
  choice: legte ihn auf
  rationale: Die Wendung bewahrt das räumliche Bild des Hebräischen und passt zum anschließenden Ruhen des Geistes auf den Ältesten.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: die siebzig Männer, die Ältesten
  rationale: Diese appositionelle Wiedergabe erhält sowohl „Männer“ als auch „Älteste“, ohne daraus zwei verschiedene Gruppen zu machen.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: Als der Geist auf ihnen ruhte
  rationale: נוח mit על bezeichnet hier das Ruhen des Geistes auf den Betreffenden; die deutsche Formulierung ist klar und bildgetreu.
- source_word: וַיִּתְנַבְּאוּ
  choice: redeten sie prophetisch
  rationale: Die Wendung macht die prophetische Betätigung in verständlichem Deutsch deutlich, ohne ihren genauen Inhalt näher festzulegen.
- source_word: וְלֹא יָסָפוּ
  choice: doch danach taten sie es nicht wieder
  rationale: יסף kann idiomatisch bedeuten, etwas erneut oder weiterhin zu tun. Im Zusammenhang ist die einmalige prophetische Betätigung die naheliegende Lesart; die gegenteilige traditionelle Deutung wird wegen der Kürze und Mehrdeutigkeit der Wendung in der Fußnote erhalten.
theological_decisions:
- issue: Bezug von רוּחַ
  choice: Gottes „Geist“
  alternative: „Geist“ im Sinn einer unpersönlichen Kraft oder menschlichen Verfassung
  rationale: Der Geist ist zunächst auf Mose, wird von Jahwe auf die Ältesten gelegt und befähigt sie zum prophetischen Reden. Das spricht für Gottes wirkenden Geist, ohne weitergehende dogmatische Aussagen in den Vers einzutragen.
- issue: Bedeutung von וְלֹא יָסָפוּ
  choice: Sie taten es danach nicht wieder
  alternative: Sie hörten nicht auf
  rationale: Die knappe hebräische Wendung lässt unterschiedliche traditionelle Deutungen zu. Die kontextuell naheliegende Auffassung steht im Haupttext; die gegenteilige Lesart wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am hebräischen Erzählstil; „redeten prophetisch“ ist für heutige Leser verständlicher als das weniger alltägliche „weissagten“. Die ungewöhnliche Apposition „die siebzig Männer, die Ältesten“ bewahrt bewusst die doppelte Bezeichnung des Ausgangstextes.
