base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: de
  text: Da machte sich das Volk auf. Den ganzen Tag, die ganze Nacht und den ganzen folgenden Tag sammelten sie die Wachteln. Selbst wer am wenigsten sammelte, sammelte zehn Homer[a][b]. Dann breiteten sie die Wachteln für sich rings um das Lager aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Homer war ein großes Trockenmaß. Die genaue Entsprechung in heutigen Maßeinheiten ist unsicher; entscheidend ist hier, dass selbst die kleinste gesammelte Menge außerordentlich groß war.
    reason: cultural_note
  - marker: b
    text: 'Oder: „zehn Eselslasten“. Diese Wiedergabe versteht חֳמָרִים aufgrund seiner sprachlichen Verbindung mit dem Wort für „Esel“ und nicht als die übliche Bezeichnung des Trockenmaßes „Homer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: Da machte sich das Volk auf
  rationale: קום bezeichnet hier den entschlossenen Beginn einer Tätigkeit. „Sich aufmachen“ wahrt die hebräische Erzählbewegung und klingt im Deutschen natürlicher als das wörtliche „aufstehen“.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: den ganzen Tag, die ganze Nacht und den ganzen folgenden Tag
  rationale: Die dreigliedrige Zeitangabe betont die nahezu ununterbrochene Dauer. Die Wiederholung von „ganz“ bleibt im Deutschen hörbar.
- source_word: וַיַּאַסְפוּ אֶת הַשְּׂלָו
  choice: sammelten sie die Wachteln
  rationale: אסף bedeutet sammeln oder einsammeln; „sammeln“ ist schlicht und kontextgerecht. Der kollektive Singular שְּׂלָו wird idiomatisch als Plural „Wachteln“ wiedergegeben.
- source_word: הַמַּמְעִיט
  choice: selbst wer am wenigsten sammelte
  rationale: Das Hifil-Partizip von מעט bezeichnet hier im Zusammenhang mit אסף die Person, die die geringste Menge sammelte. „Selbst“ verdeutlicht die Aussage über das erstaunlich hohe Mindestmaß, ohne zusätzlichen Sachinhalt einzuführen.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: zehn Homer
  rationale: חֹמֶר ist gewöhnlich die Bezeichnung eines großen Trockenmaßes. Die transliterierte Maßeinheit vermeidet eine trügerisch genaue moderne Umrechnung; die etymologisch mögliche Deutung als Eselslasten wird in einer Fußnote bewahrt.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: Dann breiteten sie die Wachteln für sich … aus
  rationale: Die figura etymologica aus finitem Verb und absolutem Infinitiv betont das gründliche Ausbreiten. „Für sich“ gibt לָהֶם wieder, ohne einen nicht ausdrücklich genannten Zweck wie Trocknen festzulegen. Das wiederholte Substantiv beseitigt im Deutschen eine mögliche Unklarheit des Pronomens.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: rings um das Lager
  rationale: Die Form bezeichnet den umliegenden Bereich beziehungsweise eine Verteilung rund um das Lager. „Rings um“ gibt diesen umfassenden Sinn knapp wieder.
theological_decisions: []
