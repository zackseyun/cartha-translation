base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: de
  text: 'Bin etwa ich mit diesem ganzen Volk schwanger geworden? Oder habe ich es geboren, dass du zu mir sagst: »Trag es an deiner Brust, wie ein Betreuer[a] einen Säugling trägt, in das Land, das du seinen Vorfahren unter Eid zugesagt hast«?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Pflegevater«. Das hebräische Wort steht in männlicher Form und bezeichnet einen fürsorglichen Betreuer eines Kindes.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische spricht vom Volk als von einem einzelnen Kind und verwendet entsprechend durchgehend Formen im Singular.
    reason: collective_singular
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: Bin etwa ich … schwanger geworden?
  rationale: Die Fragepartikel und das betonte Pronomen bilden eine rhetorische Frage. Die Formulierung gibt die Schwangerschaftsbedeutung von הרה im heutigen Deutsch unmittelbar wieder und bewahrt das bewusst mütterliche Bild.
- source_word: כָּל הָעָם הַזֶּה
  choice: dieses ganze Volk
  rationale: עָם ist ein kollektiver Singular; die deutsche Formulierung ist natürlich und ermöglicht es, die folgenden singularischen Bezüge als »es« und »seinen« beizubehalten.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: Oder habe ich es geboren
  rationale: אִם führt hier die zweite, parallele rhetorische Frage ein. ילד setzt das Bild von Schwangerschaft und Geburt fort; »es« nimmt das grammatisch sächliche und kollektiv-singularische »Volk« auf.
- source_word: כִּי תֹאמַר אֵלַי
  choice: dass du zu mir sagst
  rationale: Die Wendung gibt den Inhalt beziehungsweise Anlass der Klage direkt und idiomatisch wieder.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: Trag es an deiner Brust
  rationale: נשא bezeichnet hier das Tragen eines Kindes. חֵיק meint Brust, Schoß oder den körpernahen Bereich; »an deiner Brust« bewahrt das fürsorgliche, körpernahe Bild in natürlichem Deutsch.
- source_word: הָאֹמֵן
  choice: ein Pflegevater
  rationale: Das maskuline Partizip bezeichnet einen Mann, der ein Kind betreut und trägt. »Pflegevater« wahrt sowohl die grammatische Form als auch die konkrete Fürsorgerrolle, ohne ihn zum stillenden Elternteil zu machen.
- source_word: הַיֹּנֵק
  choice: einen Säugling
  rationale: Das Wort bezeichnet ein noch saugendes Kind; »Säugling« ist die präzise und geläufige moderne Bezeichnung.
- source_word: עַל הָאֲדָמָה
  choice: in das Land
  rationale: Im Zusammenhang der gerichteten Bewegung bezeichnet עַל das Ziel. »Land« entspricht dem verheißenen Gebiet.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: das du seinen Vorfahren zugeschworen hast
  rationale: »Zuschwören« bewahrt den Eidcharakter von שׁבע. »Seinen« erhält den singularischen Bezug auf das Volk; »Vorfahren« ist im heutigen Deutsch klarer und ebenso sachgerecht wie das wörtlichere »Väter«.
theological_decisions:
- issue: Israel als kollektiver Singular und einzelnes Kind
  choice: Die singularischen Bezüge werden mit »es« und »seinen« beibehalten.
  alternative: Pluralische Bezüge wie »sie« und »ihren« verwenden.
  rationale: Das Hebräische behandelt das Volk durchgehend als kollektiven Singular und entfaltet so das Bild Israels als eines einzigen Kindes. Im Deutschen ist dies mit dem sächlichen Singular »Volk« zugleich natürlich.
- issue: Geschlecht und Rolle von הָאֹמֵן
  choice: »Pflegevater« im Haupttext
  alternative: »Betreuer«, »Pfleger« oder traditionell »Wärterin/Amme«
  rationale: Die hebräische Form ist maskulin und meint einen fürsorglichen Träger beziehungsweise Erzieher des Kindes. »Pflegevater« bewahrt diese Einzelheiten; eine allgemeinere Wiedergabe bleibt lexikalisch möglich und wird in der Fußnote genannt.
- issue: Die mütterliche Metaphorik in Moses’ Klage
  choice: Schwangerschaft und Geburt ausdrücklich wiedergeben
  alternative: Abschwächend mit »hervorbringen« oder »zeugen« übersetzen
  rationale: Der Ausgangstext verbindet Empfängnis beziehungsweise Schwangerschaft und Geburt bewusst mit Moses’ rhetorischer Klage. Diese auffällige Spannung soll nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt bildhaft und körpernah. »Schwanger geworden« ist bewusst deutlich, weil die ungewöhnliche mütterliche Metapher des hebräischen Textes nicht abgeschwächt werden soll. Die Satzführung folgt der zweifachen rhetorischen Frage und bleibt dennoch gut vorlesbar.
