  text: הֲ/צֹ֧אן וּ/בָקָ֛ר יִשָּׁחֵ֥ט לָ/הֶ֖ם וּ/מָצָ֣א לָ/הֶ֑ם אִ֣ם אֶֽת כָּל דְּגֵ֥י הַ/יָּ֛ם יֵאָסֵ֥ף לָ/הֶ֖ם וּ/מָצָ֥א לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: de
  text: Würden für sie Schafe und Rinder geschlachtet, wäre das genug für sie? Oder würden alle Fische des Meeres für sie zusammengebracht, wäre das genug für sie?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung, wörtlich „und es würde für sie genügen“, ist idiomatisch im Sinn von „und es wäre genug für sie“ gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: Sollten etwa
  rationale: Die Fragepartikel eröffnet eine rhetorische, hypothetische Frage. „Sollten etwa“ gibt im Deutschen sowohl den fragenden als auch den ungläubig-abwägenden Ton natürlich wieder.
- source_word: צֹאן וּבָקָר
  choice: Schafe und Rinder
  rationale: Das Wortpaar bezeichnet Kleinvieh und Rinder. Die konkrete Wiedergabe ist allgemein verständlich und passt zum Versorgungskontext.
- source_word: יִשָּׁחֵט
  choice: geschlachtet werden
  rationale: Das Nifal von שׁחט bezeichnet hier das Schlachten von Tieren zur Nahrung; „geschlachtet“ ist genauer als das allgemeinere „getötet“.
- source_word: לָהֶם
  choice: für sie
  rationale: Die Präposition bezeichnet hier die Bereitstellung zugunsten des Volkes.
- source_word: וּמָצָא לָהֶם
  choice: würde das für sie ausreichen
  rationale: מצא ist in dieser Verbindung idiomatisch im Sinn von „genügen, ausreichen“ gebraucht. Die Formulierung wahrt den rhetorischen Fragesinn und ist idiomatisches Deutsch.
- source_word: אִם
  choice: Oder sollten
  rationale: אִם führt hier die zweite Möglichkeit der rhetorischen Alternative ein; „oder“ macht diese disjunktive Funktion deutlich, während der deutsche Konjunktiv die Hypothese ausdrückt.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: alle Fische des Meeres
  rationale: Die Wiedergabe folgt der hebräischen Gesamtbezeichnung und bewahrt den umfassenden Sinn von כָּל.
- source_word: יֵאָסֵף
  choice: zusammengebracht werden
  rationale: Das Nifal von אסף bedeutet „gesammelt/zusammengebracht werden“. Die Wahl vermeidet die zusätzliche, im Verb nicht ausdrücklich enthaltene Vorstellung des Fangens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen rhetorischen Fragen und die wiederholte Wendung des Hebräischen bleiben erkennbar; der Gedankenstrich gliedert die langen Fragesätze ohne die Spannung aufzulösen.
