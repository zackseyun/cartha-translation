  terminology: „Schafe und Rinder“, „schlachten“, „Fische des Meeres“ und „zusammengebracht“ sind treffend, verständlich und dem Register angemessen. „Genug“ ist eine natürliche Wiedergabe der idiomatischen Wendung und vermeidet eine irreführende Literalübersetzung.
