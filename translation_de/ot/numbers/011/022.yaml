  source_fidelity: 'Die Grundbedeutung wird getroffen: Es geht in beiden rhetorischen Alternativen um eine für das Volk ausreichende Menge an Fleisch bzw. Fisch. Die Übersetzung von וּמָצָא לָהֶם mit „ausreichen“ ist sachgerecht. Die Fußnote beschreibt die hebräische Form jedoch unzutreffend als Passiv („gefunden werden“); וּמָצָא ist hier nicht passivisch.'
