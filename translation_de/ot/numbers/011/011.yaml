  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: de
  text: 'Und Mose sagte zu Jahwe: „Warum hast du deinen Diener schlecht behandelt?[a] Und warum habe ich keine Gunst in deinen Augen gefunden,[b] sodass du mir die Last dieses ganzen Volkes auferlegt hast?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Warum hast du deinem Diener Böses getan?“ Das hebräische Verb kann „Schlechtes“ oder „Böses tun“ bedeuten und bringt Moses’ scharfe Klage zum Ausdruck.'
    reason: lexical_alternative
  - marker: b
    text: „Gunst in deinen Augen finden“ ist eine hebräische Redewendung und bedeutet, bei jemandem Wohlwollen zu finden.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֲרֵעֹתָ
  choice: hast du … so übel mitgespielt
  rationale: Gibt den Hifil von רעע als scharfe, von Mose geäußerte Klage wieder, ohne diese als objektives moralisches Urteil des Erzählers auszugeben.
- source_word: לְעַבְדֶּךָ
  choice: deinem Diener
  rationale: Hier ist עבד eine ehrerbietige Selbstbezeichnung Moses vor Gott; „Diener“ entspricht dem Kontext besser als „Sklave“.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: habe ich keine Gunst in deinen Augen gefunden
  rationale: Bewahrt die verständliche hebräische Redewendung und ihre bildhafte Ausdrucksweise.
- source_word: לָשׂוּם אֶת מַשָּׂא
  choice: sodass du … die Last … auferlegt hast
  rationale: „Auferlegt“ verbindet sich im Deutschen natürlich mit „Last“; „sodass“ gibt den resultativen Zusammenhang des Infinitivs wieder.
- source_word: כָּל הָעָם הַזֶּה
  choice: dieses ganzen Volkes
  rationale: Bewahrt „Volk“ als kollektiven Singular und ergibt zugleich natürliches modernes Deutsch.
- source_word: עָלָי
  choice: mir … auferlegt
  rationale: Der deutsche Dativ bei „auferlegen“ gibt die hebräische Wendung „auf mich“ idiomatisch wieder.
theological_decisions:
- issue: Mögliche Aussage über Gottes Handeln in הֲרֵעֹתָ
  choice: 'als direkte, scharfe Klage Moses: „hast du … so übel mitgespielt“'
  alternative: „hast du deinem Diener Böses getan“
  rationale: Der hebräische Wortlaut lässt eine sehr starke Beschwerde zu. Die gewählte Fassung bewahrt diese Spannung, ohne durch „Böses getan“ unnötig den Eindruck zu erwecken, der Erzähler selbst spreche Gott moralisches Unrecht zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzfluss bleibt nah am Hebräischen; die rhetorische Schärfe von Moses Klage sowie das Lastbild werden bewahrt. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Textstellen.
