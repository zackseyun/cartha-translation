  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: de
  text: Ihr werdet nicht nur einen Tag lang davon essen[a], auch nicht zwei Tage, nicht fünf Tage, nicht zehn Tage und nicht zwanzig Tage,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Nicht einen Tag werdet ihr essen und nicht zwei Tage und nicht fünf Tage und nicht zehn Tage und nicht zwanzig Tage.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: nicht … auch nicht
  rationale: Die wiederholte Verneinung jeder Zeitspanne wird im Deutschen ausdrücklich bewahrt; „nicht nur“ ergibt sich aus dem über den Vers hinausführenden Satzbau und verhindert das Missverständnis, sie würden überhaupt keinen einzigen Tag davon essen.
- source_word: יוֹם אֶחָד
  choice: einen Tag lang
  rationale: Gibt die Dauer natürlich wieder und bewahrt den Beginn der Zahlenfolge.
- source_word: תֹּאכְלוּ/ן
  choice: ihr werdet … essen
  rationale: Das Qal-Imperfekt der 2. Person maskulin Plural bezeichnet hier im Zusammenhang der göttlichen Ankündigung ein zukünftiges Geschehen.
- source_word: יוֹמָיִם
  choice: zwei Tage
  rationale: Die Dualform bezeichnet ausdrücklich zwei Tage.
- source_word: חֲמִשָּׁה יָמִים
  choice: fünf Tage
  rationale: Direkte Wiedergabe des Zahlworts mit Plural, die die steigernde Aufzählung erhält.
- source_word: עֲשָׂרָה יָמִים
  choice: zehn Tage
  rationale: Direkte Wiedergabe zur Wahrung des rhetorischen Aufbaus.
- source_word: עֶשְׂרִים יוֹם
  choice: zwanzig Tage
  rationale: Das im Hebräischen nach zwanzig idiomatisch gebrauchte Singularwort wird im Deutschen regelgerecht im Plural wiedergegeben.
- source_word: וְ
  choice: auch nicht / und nicht
  rationale: Das Waw verbindet die wiederholt verneinten Zeitangaben. Idiomatisches Deutsch variiert zwischen „auch nicht“ und abschließendem „und nicht“, ohne die kumulative Aufzählung aufzulösen.
