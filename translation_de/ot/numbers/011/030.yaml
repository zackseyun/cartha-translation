  yaml_path: translation/ot/numbers/011/030.yaml
  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: de
  text: Dann kehrten Mose und die Ältesten Israels ins Lager zurück[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann wörtlicher auch „gesammelt/versammelt werden“ bedeuten. Im Zusammenhang bezeichnet es die Rückkehr Moses und der Ältesten ins Lager.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: kehrte … zurück
  rationale: Das Niphal von אסף kann formal „wurde gesammelt/versammelt“ bedeuten; im Zusammenhang bezeichnet es jedoch die Rückkehr zum Lager. „kehrte … zurück“ gibt diesen idiomatischen Bewegungssinn natürlich wieder, ohne die wörtlichere Möglichkeit zu verschweigen.
- source_word: אֶל הַמַּחֲנֶה
  choice: ins Lager
  rationale: אֶל bezeichnet die Bewegung zum Lager hin. Im Deutschen ist „ins Lager“ in diesem Zusammenhang natürlicher als „zum Lager“ und lässt erkennen, dass Mose dorthin zurückkehrte.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: er und die Ältesten Israels
  rationale: Das ausdrücklich gesetzte Pronomen הוּא wird beibehalten und bewahrt so die appositionelle Struktur und Hervorhebung des Hebräischen.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Dies ist eine klare und im biblischen Erzählstil geläufige Wiedergabe der Status-constructus-Verbindung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionelle Nachstellung „er und die Ältesten Israels“ bewahrt bewusst die hebräische Hervorhebung, auch wenn „zusammen mit den Ältesten Israels“ idiomatischer wäre.
