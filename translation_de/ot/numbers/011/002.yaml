id: NUM.11.2
reference: Numbers 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: de
  text: Da schrie das Volk zu Mose, und Mose betete zu Jahwe. Darauf ließ das Feuer nach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Da sank das Feuer“; gemeint ist, dass es abklang oder sich legte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: schrie … zu
  rationale: Das Verb צעק bezeichnet hier einen dringlichen Hilferuf aus Bedrängnis; „schrie … zu“ gibt sowohl die Intensität als auch die Ausrichtung auf Mose wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם bezeichnet in diesem Erzählzusammenhang die israelitische Gemeinschaft als Ganzes; „das Volk“ ist die natürliche deutsche Wiedergabe.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: אֶל kennzeichnet die Richtung des Hilferufs auf Mose hin; „zu Mose“ ist knapp und idiomatisch.
- source_word: וַיִּתְפַּלֵּל
  choice: betete
  rationale: Der Hitpael von פלל bedeutet gewöhnlich „beten“. Der Zusammenhang lässt Fürbitte erkennen, doch „betete“ bleibt näher am ausdrücklichen Wortlaut.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Form der wissenschaftlich begründeten Umschrift.
- source_word: וַתִּשְׁקַע
  choice: ließ … nach
  rationale: שקע vermittelt das Bild des Sinkens beziehungsweise Abklingens. Bei Feuer drückt „ließ nach“ natürlich aus, dass es abnahm, ohne zwingend vollständiges Erlöschen zu behaupten.
- source_word: הָאֵשׁ
  choice: das Feuer
  rationale: אֵשׁ bedeutet unmittelbar „Feuer“ und verweist hier auf das im vorangehenden Vers genannte göttliche Feuer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Moses Handlung als Gebet oder ausdrückliche Fürbitte
  choice: betete
  alternative: trat für das Volk ein
  rationale: Die Situation legt Fürbitte nahe, doch das Verb selbst sagt „beten“. Die Übersetzung vermeidet es daher, die kontextuelle Folgerung in den Haupttext aufzunehmen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählfolge. „Darauf“ macht den zeitlich-folgernden Zusammenhang des hebräischen Narrativstils natürlich verständlich. Die traditionelle deutsche Namensform „Mose“ wird verwendet.
