source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose: »Versammle für mich siebzig Männer aus den Ältesten Israels, von denen du weißt, dass sie Älteste des Volkes und seine Amtsträger[a] sind. Bring sie zum Zelt der Begegnung, und sie sollen dort bei dir stehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Aufseher«; gemeint sind mit Verwaltungsaufgaben betraute Funktionsträger des Volkes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sich dort bei dir einfinden« oder »dort bei dir Stellung nehmen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Tetragramms bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶסְפָה לִּי
  choice: Versammle mir
  rationale: אָסַף bezeichnet hier das Zusammenbringen einer Personengruppe; der Dativ לִי wird mit „mir“ knapp und unmittelbar wiedergegeben.
- source_word: שִׁבְעִים אִישׁ
  choice: siebzig Männer
  rationale: אִישׁ steht nach der Zahl distributiv und bezeichnet in diesem Leitungskontext erwachsene Männer.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: aus den Ältesten Israels
  rationale: Die Präposition מִן kennzeichnet die Auswahl aus der größeren Gruppe der Ältesten Israels.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: von denen du weißt, dass sie … sind
  rationale: Die hebräische Konstruktion wird idiomatisch wiedergegeben, ohne den Gedanken aufzugeben, dass Mose diese Männer bereits als anerkannte Führungspersonen kennt.
- source_word: וְשֹׁטְרָיו
  choice: und seine Amtsträger
  rationale: שֹׁטֵר bezeichnet hier mit Verwaltungsaufgaben betraute Funktionsträger; das Suffix bezieht sich auf das Volk.
- source_word: וְלָקַחְתָּ אֹתָם אֶל
  choice: Nimm sie mit zum
  rationale: לקח bedeutet grundsätzlich „nehmen“; mit einem Ziel bezeichnet es hier das Mitnehmen beziehungsweise Hinbringen der Männer.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Benennung gibt beide Bestandteile des hebräischen Heiligtumsbegriffs wieder und ist im Deutschen verständlich.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: und sie sollen sich dort mit dir aufstellen
  rationale: Der Hitpael von יצב drückt aus, dass die Männer ihren Platz einnehmen beziehungsweise sich offiziell bereitstellen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Eigennamen und ersetzt ihn nicht durch den traditionellen Titel.
- issue: Stellung der ausgewählten Männer
  choice: Amtsträger
  alternative: Aufseher
  rationale: Der Begriff שֹׁטֵר bezeichnet administrative Funktionsträger unter den Ältesten, ohne dass ihre genaue Amtsstruktur im Deutschen konfessionell oder institutionell festgelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und knapp; institutionelle Begriffe werden nicht stärker präzisiert, als es der hebräische Text erlaubt.
