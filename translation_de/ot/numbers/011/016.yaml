revisions:
- from: 'Da sprach Jahwe zu Mose: »Versammle mir siebzig Männer aus den Ältesten Israels, von denen du weißt, dass sie Älteste des Volkes und seine Amtsträger[a] sind. Nimm sie mit zum Zelt der Begegnung, und sie sollen sich dort mit dir aufstellen[b].«'
  to: 'Da sprach Jahwe zu Mose: »Versammle für mich siebzig Männer aus den Ältesten Israels, von denen du weißt, dass sie Älteste des Volkes und seine Amtsträger[a] sind. Bring sie zum Zelt der Begegnung, und sie sollen dort bei dir stehen[b].«'
  rationale: Die Revision glättet zwei Formulierungen für modernes Standarddeutsch, ohne den Sinn oder den Direktionscharakter des Hebräischen zu verändern. „Für mich“ bewahrt die dative Nuance von לִּי; „dort bei dir stehen“ gibt die Grundbedeutung von והתיצבו wieder und vermeidet die zu spezifische Assoziation einer geordneten Aufstellung. Die Fußnotenanker bleiben bei den jeweils erläuterten Begriffen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:01:28Z'
