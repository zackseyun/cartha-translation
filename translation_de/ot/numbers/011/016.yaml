  terminology: „Jahwe“, „Älteste“, „Amtsträger“ und „Zelt der Begegnung“ sind passende, konsistente Wiedergaben. „Aufseher“ bleibt als mögliche, aber enger gefasste Alternative zu Amtsträgern sinnvoll. Die Fußnote zum abschließenden Verb sollte eine natürliche Alternative wie „sich dort bei dir einfinden“ bieten, ohne die Grundbedeutung des Stehens zu verdecken.
