base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: de
  text: Da kamen Mose und Aaron aus der Gegenwart der Gemeinde[a][b] zum Eingang des Zeltes der Begegnung. Sie fielen auf ihr Angesicht nieder, und die Herrlichkeit Jahwes[c] erschien ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung lautet wörtlich: „aus dem Angesicht der Gemeinde“ beziehungsweise „aus der Gegenwart der Gemeinde“. Gemeint ist, dass Mose und Aaron sich von den versammelten Menschen entfernten.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Versammlung“.'
    reason: lexical_alternative
  - marker: c
    text: Traditionelle deutsche Bibelübersetzungen geben den Gottesnamen häufig mit „der HERR“ wieder.
    reason: translation_tradition
lexical_decisions:
- source_word: וַיָּבֹא
  choice: gingen
  rationale: בוא kann je nach Blickrichtung „kommen“, „gehen“ oder „eintreten“ bedeuten. Da Mose und Aaron sich von der Gemeinde zum Zelt bewegen, ist „gingen“ im Deutschen die natürliche Erzählperspektive.
- source_word: מִפְּנֵי
  choice: von … weg
  rationale: Die Wendung bedeutet wörtlich „vom Angesicht/von der Gegenwart … her“. „Von … weg“ gibt die räumliche Bewegung im heutigen Deutsch klar wieder; die wörtlichere Form bleibt in der Fußnote erhalten.
- source_word: הַקָּהָל
  choice: die Gemeinde
  rationale: קהל bezeichnet die versammelte Gemeinschaft Israels. „Gemeinde“ ist im biblischen Zusammenhang verständlich; „Versammlung“ bleibt als mögliche Alternative vermerkt.
- source_word: פֶּתַח
  choice: Eingang
  rationale: פתח bezeichnet die Öffnung beziehungsweise den Zugang zu einem Bau oder Zelt. „Eingang“ ist hier präzise und idiomatisch.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die feste Bezeichnung wird nah an den Bestandteilen אֹהֶל („Zelt“) und מוֹעֵד („bestimmte Zeit/Begegnung“) wiedergegeben. „Begegnung“ lässt den kultischen Ort erkennen, ohne eine zusätzliche Deutung einzutragen.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: Sie fielen auf ihr Angesicht nieder
  rationale: Die Übersetzung bewahrt das hebräische Körperbild und dessen Ausdruck von Demut, Erschrecken oder flehentlicher Hinwendung, ohne eines dieser Motive ausdrücklich festzulegen.
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Der Niphal von ראה bezeichnet hier ein Sichtbarwerden beziehungsweise Sich-Zeigen. „Erschien“ ist knapp und entspricht dem Kontext einer göttlichen Manifestation.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כבוד bezeichnet hier die wahrnehmbare göttliche Herrlichkeit. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲלֵיהֶם
  choice: ihnen
  rationale: אל bezeichnet die Ausrichtung auf Mose und Aaron; mit „erschien“ ist der deutsche Dativ die natürliche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Ersetzung durch „der HERR“ wird als Übersetzungsalternative kenntlich gemacht, aber nicht in den Haupttext übernommen.
- issue: Bedeutung der Herrlichkeitserscheinung
  choice: „die Herrlichkeit Jahwes erschien ihnen“ ohne nähere Erklärung
  alternative: eine ausdrücklich als Lichtglanz, Wolke oder sichtbare Gestalt beschriebene Erscheinung
  rationale: Der Vers nennt כבוד יהוה, bestimmt aber die konkrete Erscheinungsform nicht. Die Übersetzung bewahrt diese Offenheit und ergänzt keine Einzelheiten aus anderen Textstellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der hebräischen Erzählformen zu verändern. „Auf ihr Angesicht niederfallen“ bewahrt bewusst das konkrete biblische Bild; „Zelt der Begegnung“ wird als feste Kultbezeichnung großgeschrieben.
