base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: de
  text: Bitte lass uns durch dein Land ziehen. Wir werden weder durch Felder noch durch Weinberge ziehen und kein Wasser aus einem Brunnen trinken. Wir werden die Königsstraße[a] nehmen und weder nach rechts noch nach links abbiegen, bis wir deine Grenze überschritten haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf dem Weg des Königs«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »bis wir deine Grenze passiert haben«. Das hebräische Wort kann je nach Zusammenhang auch ein abgegrenztes Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא בְאַרְצֶךָ
  choice: Lass uns bitte durch dein Land ziehen
  rationale: Der Kohortativ mit נָא formuliert eine höfliche Bitte; mit עבר bezeichnet בְאַרְצֶךָ das Durchqueren des Landes.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: Wir werden weder durch Felder noch durch Weinberge ziehen
  rationale: Die hebräischen Singularformen sind kollektiv gebraucht. Der deutsche Plural gibt das allgemeine Versprechen natürlich und eindeutig wieder.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: und kein Wasser aus einem Brunnen trinken
  rationale: מֵי בְאֵר bedeutet wörtlich Wasser eines Brunnens; die gewählte Formulierung ist modernes, klares Deutsch.
- source_word: דֶּרֶךְ הַמֶּלֶךְ נֵלֵךְ
  choice: Wir werden auf der Königsstraße bleiben
  rationale: דֶּרֶךְ הַמֶּלֶךְ ist wörtlich der Weg des Königs und bezeichnet eine festgelegte königliche Straße. Bleiben bringt zusammen mit dem folgenden Satz das zugesagte Nichtabweichen idiomatisch zum Ausdruck.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: weder nach rechts noch nach links abbiegen
  rationale: Die beiden Richtungsangaben werden ausdrücklich bewahrt; abbiegen ist in diesem Straßenkontext natürlich.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: bis wir dein Gebiet durchquert haben
  rationale: גְּבוּל kann Grenze oder Gebiet bedeuten. Im Kontext meint die Wendung, das edomitische Hoheitsgebiet vollständig passiert zu haben; diese Wiedergabe vermeidet die missverständliche Vorstellung, man ziehe längs durch eine Grenzlinie.
