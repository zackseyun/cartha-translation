  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: de
  text: Nimm Aaron und seinen Sohn Eleasar und führe sie auf den Berg Hor hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח
  choice: Nimm
  rationale: Der Qal-Imperativ von לקח bedeutet hier unmittelbar „nimm“ und bezeichnet, dass Mose Aaron und Eleasar mitnehmen soll.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: בְּנוֹ
  choice: seinen Sohn
  rationale: Das maskuline Suffix der 3. Person Singular bezieht sich im Zusammenhang am natürlichsten auf Aaron; die deutsche Wortstellung macht diesen Bezug eindeutig und idiomatisch.
- source_word: וְהַעַל
  choice: führe ... hinauf
  rationale: 'Der Hifil-Imperativ von עלה hat einen kausativen Sinn: „hinaufführen“ beziehungsweise „hinaufbringen“. „Führe sie ... hinauf“ ist im Deutschen natürlich und bewahrt diesen Sinn.'
- source_word: אֹתָם
  choice: sie
  rationale: Das Objektpronomen bezeichnet Aaron und Eleasar gemeinsam.
- source_word: הֹר הָהָר
  choice: den Berg Hor
  rationale: Die formale Wortfolge lautet ungefähr „Hor, der Berg“. „Berg Hor“ ist die herkömmliche und natürliche deutsche Wiedergabe des Ortsnamens.
