  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: de
  text: Da schrien wir zu Jahwe, und er hörte unsere Stimme. Er sandte einen Engel[a] und führte uns aus Ägypten heraus. Und nun sind wir in Kadesch, einer Stadt am Rand deines Gebiets.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Boten“. Das hebräische Wort kann sowohl einen menschlichen als auch einen himmlischen Boten bezeichnen; in diesem Zusammenhang wird häufig ein von Gott gesandter Engel verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: Da schrien wir
  rationale: צעק bezeichnet einen dringenden Hilferuf. „Schrien wir“ bewahrt die Notlage und die Intensität des Rufens; „da“ gibt den erzählenden Anschluss natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: und er hörte unsere Stimme
  rationale: Die Wiedergabe erhält die ausdrückliche Formulierung „unsere Stimme“ und bleibt im Deutschen verständlich.
- source_word: מַלְאָךְ
  choice: einen Engel[a]
  rationale: מַלְאָךְ kann allgemein einen Boten bezeichnen, in diesem Zusammenhang aber auch einen himmlischen Boten. „Engel“ ist im Exodusbezug eine natürliche Wiedergabe; die weitere lexikalische Möglichkeit wird in der Fußnote bewahrt.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: und führte uns aus Ägypten heraus
  rationale: Der Hifil von יצא bedeutet „herausführen“ oder „herausbringen“. „Führte … heraus“ ist idiomatisch und bewahrt die aktive Befreiung aus Ägypten.
- source_word: וְהִנֵּה
  choice: Und nun
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die gegenwärtige Lage. „Und nun“ erfüllt diese Diskursfunktion in natürlichem modernem Deutsch, ohne das altertümliche „siehe“.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: einer Stadt am Rand deines Gebiets
  rationale: Die Wendung beschreibt Kadesch als eine Stadt an der äußersten Begrenzung des edomitischen Gebiets. „Am Rand deines Gebiets“ gibt die räumliche Aussage klar und idiomatisch wieder.
theological_decisions:
- issue: Identität des מַלְאָךְ beim Auszug aus Ägypten
  choice: Im Haupttext steht „einen Engel“, ohne seine genaue Identität näher zu bestimmen.
  alternative: „einen Boten“; oder eine ausdrückliche Identifizierung mit dem Engel Jahwes beziehungsweise einer besonderen Gotteserscheinung
  rationale: Der Vers sagt lediglich, dass Jahwe einen מַלְאָךְ sandte. Er bestimmt dessen Identität nicht genauer. Die Übersetzung vermeidet daher eine weitergehende christologische oder andere dogmatische Festlegung und nennt in der Fußnote die lexikalisch allgemeinere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am hebräischen Erzählstil, wird aber durch maßvolle Gliederung natürlich lesbar. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Anmerkung bezieht.
