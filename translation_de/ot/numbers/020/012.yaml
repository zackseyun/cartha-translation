reference: Numbers 20:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose und Aaron: „Weil ihr mir nicht vertraut habt[a] und mich vor den Augen der Söhne Israels nicht als heilig erwiesen habt[b], darum werdet ihr diese Versammlung nicht in das Land bringen, das ich ihnen gegeben habe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „weil ihr nicht an mich geglaubt habt“. Das hebräische Verb kann Glauben oder Vertrauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „mich geheiligt“ oder „mich als heilig anerkannt habt“. Gemeint ist, Jahwes Heiligkeit öffentlich zur Geltung zu bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: ihr mir nicht vertraut habt
  rationale: Die Hifil-Form von אמן mit ב bezeichnet hier Glauben beziehungsweise Vertrauen auf eine Person. „Mir vertraut“ ist im heutigen Deutsch natürlich und lässt die personale Beziehung erkennen; „an mich geglaubt“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: לְהַקְדִּישֵׁנִי
  choice: mich … als heilig erwiesen habt
  rationale: Die kausative Form von קדש bezeichnet hier, Jahwes Heiligkeit öffentlich zur Geltung zu bringen. Die Formulierung ist verständlicher als das missverständliche „mich geheiligt“ und bewahrt den öffentlichen Aspekt.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Bewahrt das anschauliche hebräische Idiom und betont, dass das Versagen öffentlich vor Israel geschah.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Formale Wiedergabe des hebräischen Bundes- und Volksnamens; sie erhält die sprachliche Gestalt des Ausgangstextes.
- source_word: לָכֵן
  choice: darum
  rationale: Markiert in natürlichem, würdigem Deutsch die ausdrücklich gezogene Folge.
- source_word: תָבִיאוּ
  choice: werdet ihr … nicht … bringen
  rationale: Die Hifil-Form von בוא bedeutet „hineinbringen“. Das deutsche Futur gibt die feierliche Folgeankündigung klar wieder, ohne den Satz als bloßen Befehl erscheinen zu lassen.
- source_word: הַקָּהָל הַזֶּה
  choice: diese Versammlung
  rationale: Gibt die versammelte Gemeinschaft in der Wüste wieder und vermeidet unnötig kirchliche Assoziationen von „Gemeinde“.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Entspricht dem üblichen Ausdruck für das verheißene Land im pentateuchischen Zusammenhang.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: das ich ihnen gegeben habe
  rationale: Bewahrt den hebräischen Perfekt und stellt das Land als bereits verbindlich zugesprochene Gabe dar.
theological_decisions:
- issue: Art des Versagens von Mose und Aaron
  choice: Das Versagen wird sowohl als mangelndes Vertrauen auf Jahwe als auch als unterlassene öffentliche Erweisung seiner Heiligkeit wiedergegeben.
  alternative: Die Aussage ausschließlich als Ungehorsam, Selbstüberhebung oder falsche Darstellung Gottes zu erklären.
  rationale: Der Vers nennt beide Aspekte, legt aber nicht abschließend dar, wie die konkrete Handlung diese Schuld verwirklichte. Die Übersetzung bewahrt diese Spannung, statt sie durch eine Deutung aufzulösen.
- issue: Bedeutung von לְהַקְדִּישֵׁנִי
  choice: „mich … als heilig erwiesen habt“
  alternative: „mich geheiligt habt“ oder „meine Heiligkeit gezeigt habt“
  rationale: Gott wird nicht erst heilig gemacht; gemeint ist, dass seine Heiligkeit vor Israel anerkannt und sichtbar zur Geltung gebracht werden sollte. Die gewählte Formulierung drückt dies aus, ohne eine bestimmte Erklärung des Vorfalls einzutragen.
- issue: Zeitwert von נָתַתִּי
  choice: „gegeben habe“
  alternative: „geben werde“ oder „gebe“
  rationale: Der Perfekt stellt die Gabe als feststehend beziehungsweise aus göttlicher Sicht vollzogen dar. Diese covenantale Gewissheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Begründungs- und Folgestruktur, wird jedoch durch die koordinierte Formulierung „nicht vertraut … und … nicht als heilig erwiesen“ idiomatisch lesbar. Der Gottesname wird als „Jahwe“ wiedergegeben.
