  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: de
  text: Aaron wird zu seinem Volk versammelt werden[a]; denn er wird nicht in das Land kommen, das ich den Israeliten gegeben habe, weil ihr euch bei den Wassern von Meriba meinem Befehl widersetzt habt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu seinem Volk versammelt werden“; eine hebräische Todesformel, die die Zugehörigkeit zu den Seinen ausdrückt.'
    reason: Die Fußnote erläutert die formelhafte Wendung, ohne ihren Bedeutungsumfang auf „Vorfahren“ oder eine bestimmte Jenseitsvorstellung einzuengen.
  - marker: b
    text: 'Wörtlich: „gegen meinen Mund“; gemeint ist Gottes ausgesprochener Befehl.'
    reason: Die Fußnote dokumentiert die hebräische Metonymie, die im Haupttext sinngemäß wiedergegeben wird.
lexical_decisions:
- source_word: יֵאָסֵף ... אֶל־עַמָּיו
  choice: wird zu seinen Vorfahren versammelt werden
  rationale: Die hebräische Todesformel wird bewahrt. „Vorfahren“ macht im Deutschen den Bezug auf die bereits Verstorbenen verständlich, ohne die Wendung auf ein bloßes „sterben“ zu reduzieren.
- source_word: כִּי לֹא יָבֹא אֶל־הָאָרֶץ
  choice: denn er wird nicht in das Land kommen
  rationale: „Denn“ gibt den begründenden Zusammenhang wieder; „in das Land kommen“ entspricht der Bewegungsformulierung des Hebräischen natürlich und präzise.
- source_word: אֲשֶׁר נָתַתִּי
  choice: das ich ... gegeben habe
  rationale: Das Perfekt bezeichnet die göttliche Gabe als feststehend und weiterhin gültig.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die formelhafte Wendung bedeutet hier das Volk Israel insgesamt. „Israeliten“ ist im modernen Deutschen die natürliche ethnonymische Entsprechung; die wörtliche Form wird in einer Fußnote dokumentiert.
- source_word: מְרִיתֶם אֶת־פִּי
  choice: ihr euch ... meinem Befehl widersetzt habt
  rationale: Das Verb bezeichnet Auflehnung oder Widersetzlichkeit. Das wörtliche „gegen meinen Mund“ meint im Kontext den von Gott ausgesprochenen Befehl.
- source_word: לְמֵי מְרִיבָה
  choice: bei den Wassern von Meriba
  rationale: Die Orts- und Ereignisbezeichnung bleibt als Eigenname erhalten; „bei“ gibt den situativen Bezug idiomatisch wieder.
theological_decisions:
- issue: Todesformel „zu seinem Volk versammelt werden“
  choice: Die bildhafte Todesformel als „zu seinen Vorfahren versammelt werden“ bewahren
  alternative: „Aaron wird sterben“ oder wörtlich „zu seinem Volk versammelt werden“
  rationale: Die Wiedergabe erhält die Vorstellung der Zugehörigkeit zu den bereits Verstorbenen, ohne eine bestimmte Lehre über das Jenseits festzulegen. „Vorfahren“ vermeidet zudem im Deutschen das mögliche Missverständnis einer Rückkehr zum lebenden Volk.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: „Israeliten“ im Haupttext
  alternative: „Söhne Israels“
  rationale: Die hebräische Formel bezeichnet die Volksgemeinschaft und nicht ausschließlich männliche Nachkommen. Die idiomatische deutsche Form wahrt den Umfang des Referenten; die formale Gestalt wird in der Fußnote genannt.
- issue: Gegenstand der Auflehnung in אֶת־פִּי
  choice: „meinem Befehl“
  alternative: „meinem Mund“ oder „meinem Wort“
  rationale: „Mein Mund“ ist eine hebräische Metonymie für Gottes ausgesprochenen Befehl. Die klare deutsche Wiedergabe benennt den Sinn, während die Fußnote die Bildsprache des Ausgangstextes bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der feierlichen Begründungsstruktur des Hebräischen, vermeidet aber unnatürliche Hebraismen. „Meriba“ folgt der geläufigen deutschen Namensform.
