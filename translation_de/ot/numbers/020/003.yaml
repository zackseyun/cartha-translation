source:
  edition: WLC
  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: de
  text: 'Das Volk stritt mit Mose und sagte: „Wären wir doch umgekommen, als[a] unsere Brüder vor Jahwe umkamen!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie“.'
    reason: Das mit בְּ eingeleitete Infinitivgefüge kann hier zeitlich („als“) oder als Hinweis auf ein entsprechendes Schicksal („wie“) verstanden werden.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: stritt
  rationale: Das Verb ריב bezeichnet eine streitende, widerstreitende Auseinandersetzung. „Stritt“ bewahrt die gegen Mose gerichtete Schärfe und ist im heutigen Deutsch natürlich.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם bezeichnet hier die israelitische Gemeinschaft insgesamt; „das Volk“ gibt den kollektiven Ausdruck schlicht und direkt wieder.
- source_word: עִם מֹשֶׁה
  choice: mit Mose
  rationale: עִם bedeutet regulär „mit“. In Verbindung mit „stritt“ bringt „mit Mose“ die feindselige Auseinandersetzung idiomatisch zum Ausdruck, ohne die Präposition zu verstärken.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: und sagte
  rationale: Die hebräische Redeeinleitung wird im Deutschen idiomatisch zusammengezogen. Das kollektive Subjekt „das Volk“ verlangt im natürlichen Deutsch den Singular.
- source_word: וְלוּ
  choice: Wären ... doch
  rationale: לוּ drückt hier einen unerfüllten Wunsch beziehungsweise eine Klage aus. Der deutsche Konjunktiv mit „doch“ gibt diese emotionale Kraft natürlich wieder.
- source_word: גָוַעְנוּ ... בִּגְוַע
  choice: wären wir ... umgekommen, als ... umkamen
  rationale: Die Wiederholung derselben hebräischen Wurzel גוע wird durch die Wiederholung von „umkommen“ hörbar bewahrt. Die Konstruktion mit בְּ wird im Haupttext zeitlich mit „als“ wiedergegeben.
- source_word: אַחֵינוּ
  choice: unsere Brüder
  rationale: Die grammatisch maskuline Pluralform wird direkt wiedergegeben und bezeichnet im Zusammenhang offenbar Angehörige des eigenen Volkes.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Ausgangstext ausdrücklich gebrauchte Eigenname erkennbar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, während „der HERR“ die traditionelle Ersatzlesung wäre.
- issue: Geschlechtsspezifische Wiedergabe von אַחֵינוּ
  choice: unsere Brüder
  alternative: unsere Angehörigen
  rationale: Die hebräische Form ist maskulin plural. Da der Kontext keine eindeutige Ausweitung auf beide Geschlechter verlangt, bleibt diese Form erhalten.
- issue: Verhältnis zwischen dem gewünschten Sterben und dem Sterben der Brüder
  choice: als unsere Brüder ... umkamen
  alternative: wie unsere Brüder ... umkamen
  rationale: בִּגְוַע kann die zeitlichen Umstände („als“) bezeichnen, lässt aber auch einen vergleichenden beziehungsweise gleichartigen Bezug zu. Die Fußnote bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, eindringliche Klage und die Wiederholung der Sterbewurzel werden bewahrt; unnötig hölzerne Bestandteile der hebräischen Redeeinleitung werden idiomatisch zusammengezogen.
