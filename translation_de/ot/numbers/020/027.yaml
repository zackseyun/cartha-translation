source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: de
  text: Mose tat, wie Jahwe geboten hatte, und sie stiegen vor den Augen der ganzen Gemeinde[a] auf den Berg Hor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: öffentlich und für die ganze versammelte Gemeinschaft sichtbar.'
    reason: Die Fußnote erläutert die hebräische Wendung „vor den Augen“, ohne ihre anschauliche Form im Haupttext aufzugeben.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: Das Verb עשה bezeichnet hier Moses Ausführung des zuvor erteilten Befehls. „tat“ bewahrt den schlichten Erzählstil und verbindet sich natürlich mit dem folgenden Vergleichssatz.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: was … geboten hatte
  rationale: Die Wendung besagt, dass Mose entsprechend dem göttlichen Befehl handelte. Im Deutschen gibt „tat, was … geboten hatte“ den Sinn idiomatisch wieder; das Plusquamperfekt macht deutlich, dass der Befehl zuvor ergangen war.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. „Jahwe“ ist die im Deutschen geläufige Wiedergabe des persönlichen Namens und ersetzt ihn nicht durch einen Titel.
- source_word: וַיַּעֲלוּ
  choice: sie stiegen … hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. Beim Besteigen eines Berges ist „hinaufsteigen“ im modernen Deutsch natürlich und präzise.
- source_word: אֶל הֹר הָהָר
  choice: auf den Berg Hor
  rationale: הֹר הָהָר ist die Bezeichnung des Berges Hor. Nach „hinaufsteigen“ gibt „auf den Berg Hor“ das Ziel der Bewegung idiomatisch wieder.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die wörtliche Bildsprache bezeichnet eine Handlung in voller Sicht anderer. Sie bleibt auch im Deutschen verständlich und betont den öffentlichen Charakter des Geschehens.
- source_word: כָּל הָעֵדָה
  choice: der ganzen Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinde“ ist im Kontext des Buches Numeri sachgerecht und allgemein verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den persönlichen Gottesnamen gebraucht, wird er als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- issue: Öffentlicher Charakter des Aufstiegs
  choice: vor den Augen der ganzen Gemeinde
  alternative: im Beisein der ganzen Gemeinde
  rationale: Die gewählte Fassung bewahrt das hebräische Bild und lässt zugleich erkennen, dass die gesamte versammelte Gemeinschaft den Vorgang sehen konnte.
translation_notes:
  register: Moderner, würdiger Erzählstil mit schlichter Satzstruktur. Die beiden hebräischen Wayyiqtol-Formen werden als zwei Hauptsätze wiedergegeben. Die sichtbare Öffentlichkeit des Geschehens und der persönliche Gottesname bleiben erhalten.
