  text: וַ/יֹּ֖אמֶר לֹ֣א תַעֲבֹ֑ר וַ/יֵּצֵ֤א אֱדוֹם֙ לִ/קְרָאת֔/וֹ בְּ/עַ֥ם כָּבֵ֖ד וּ/בְ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: de
  text: 'Doch er sagte: „Du darfst nicht hindurchziehen.“ Da zog Edom ihm entgegen[a] mit einer großen Streitmacht[b] und mit starker Hand[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn abzufangen“. Die hebräische Wendung bedeutet an sich „jemandem entgegengehen“; der Zusammenhang ist jedoch eindeutig feindlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit einem gewichtigen Volk“; gemeint ist ein großer oder eindrucksvoller Verband von Männern.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit mächtiger Gewalt“. „Mit starker Hand“ ist eine hebräische Wendung für den Einsatz großer Macht oder Gewalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch er sagte
  rationale: Das narrative וַ wird im ablehnenden Kontext adversativ wiedergegeben. Das Pronomen lässt den im Zusammenhang vorausgesetzten Sprecher weiterhin unbestimmt.
- source_word: לֹא תַעֲבֹר
  choice: Du darfst nicht hindurchziehen
  rationale: Der Imperfekt mit לֹא drückt hier ein entschiedenes Verbot beziehungsweise eine Verweigerung aus; „hindurchziehen“ bezeichnet das Durchqueren des Landes.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: Da zog Edom
  rationale: יצא bedeutet grundsätzlich „hinausgehen/ausziehen“. „zog“ ist im Deutschen natürlich und bleibt zurückhaltender als eine ausdrückliche Deutung als militärischer Aufmarsch.
- source_word: לִקְרָאתוֹ
  choice: ihm entgegen
  rationale: Die Wendung bezeichnet zunächst eine Bewegung auf jemanden zu. Sie bewahrt die lexikalische Neutralität, während der Zusammenhang die feindliche Absicht erkennen lässt.
- source_word: בְּעַם כָּבֵד
  choice: mit einer großen Streitmacht
  rationale: Wörtlich steht „mit einem schweren/gewichtigen Volk“. Im Zusammenhang bezeichnet die idiomatische Formulierung einen großen, eindrucksvollen und offenbar bewaffneten Verband.
- source_word: וּבְיָד חֲזָקָה
  choice: und mit starker Hand
  rationale: Die bildhafte hebräische Wendung für Macht beziehungsweise Gewalt wird im Deutschen formal bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feindliche Lage wird durch „Streitmacht“ deutlich, ohne die grundsätzlich neutrale Bewegungsformel לִקְרָאתוֹ im Haupttext unnötig zu verschärfen. Die Körpermetapher „mit starker Hand“ bleibt erhalten.
