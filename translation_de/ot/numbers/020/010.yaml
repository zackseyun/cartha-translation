  text: וַ/יַּקְהִ֜לוּ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן אֶת הַ/קָּהָ֖ל אֶל פְּנֵ֣י הַ/סָּ֑לַע וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְעוּ נָא֙ הַ/מֹּרִ֔ים הֲ/מִן הַ/סֶּ֣לַע הַ/זֶּ֔ה נוֹצִ֥יא לָ/כֶ֖ם מָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: de
  text: 'Da versammelten Mose und Aaron die Gemeinde vor dem Felsen, und er sagte zu ihnen: »Hört doch, ihr Widerspenstigen! Sollen wir euch aus diesem Felsen Wasser hervorbringen[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus diesem Felsen Wasser hervorkommen lassen“.'
    reason: Der kausative Verbstamm kann neben „hervorbringen“ auch als „hervorkommen lassen“ wiedergegeben werden.
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: versammelten
  rationale: Der Hifil von קהל bezeichnet das Zusammenrufen beziehungsweise Versammeln einer Gruppe; „versammelten“ gibt den kausativen Sinn natürlich wieder.
- source_word: הַקָּהָל
  choice: die Gemeinde
  rationale: קָהָל bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinde“ ist im Deutschen natürlich und bezeichnet die Gemeinschaft, ohne sie auf eine bloße Menschenmenge zu reduzieren.
- source_word: אֶל פְּנֵי הַסָּלַע
  choice: vor dem Felsen
  rationale: Die Wendung bezeichnet die Stellung unmittelbar vor beziehungsweise gegenüber dem Felsen; „vor dem Felsen“ ist knapp und idiomatisch.
- source_word: וַיֹּאמֶר
  choice: er sagte
  rationale: Das hebräische Verb steht im Singular und verweist nach dem zusammengesetzten Subjekt natürlich auf Mose, ohne seinen Namen im Zieltext ergänzen zu müssen.
- source_word: שִׁמְעוּ נָא
  choice: Hört doch
  rationale: Der Imperativ fordert zum Hören auf; נָא verstärkt hier die eindringliche Aufforderung. „Hört doch“ klingt im modernen Deutschen nachdrücklich, nicht höflich-abgeschwächt.
- source_word: הַמֹּרִים
  choice: ihr Widerspenstigen
  rationale: Das substantivierte Partizip von מרה bezeichnet Menschen, die sich widersetzen oder auflehnen. „Widerspenstige“ bewahrt den direkten Vorwurf und vermeidet die vorwiegend politisch-militärische Färbung von „Rebellen“.
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: aus diesem Felsen
  rationale: Die Präposition מן bezeichnet die Quelle, aus der das Wasser hervorkommen soll; im Deutschen ist bei einem Felsen „aus“ die natürliche Entsprechung.
- source_word: נוֹצִיא
  choice: sollen wir … hervorbringen
  rationale: Der Hifil von יצא bedeutet, etwas heraus- beziehungsweise hervorkommen zu lassen. Die Frageform und die erste Person Plural werden mit „sollen wir“ ausdrücklich bewahrt.
- source_word: מָיִם
  choice: Wasser
  rationale: Dies ist die gewöhnliche und kontextuell eindeutige Wiedergabe von מַיִם.
theological_decisions:
- issue: Erste Person Plural in Moses Frage
  choice: Sollen wir euch … Wasser hervorbringen?
  alternative: Sollen wir für euch … Wasser hervorkommen lassen?
  rationale: נוֹצִיא steht ausdrücklich in der ersten Person Plural. Die Übersetzung bewahrt daher die Spannung zwischen der von Mose und Aaron beanspruchten beziehungsweise angesprochenen Rolle und Gottes eigentlicher Wirksamkeit, statt sie durch eine erklärende Umformulierung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt scharf und eindringlich; die rhetorische Frage sowie der Wechsel vom pluralischen Handlungsträger zum singularischen Sprecher werden formal bewahrt.
