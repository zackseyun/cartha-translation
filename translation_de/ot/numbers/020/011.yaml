  terminology: „Mose“, „Stab“, „Felsen“, „Gemeinde“ und „Vieh“ sind kontextgerecht und konsistent. „Vieh“ deckt בְּעִירָם als allgemeine Bezeichnung für die Tiere bzw. das Nutzvieh ausreichend ab. Es wird keine über den Vers hinausgehende theologische Deutung eingeführt.
