source:
  edition: WLC
  text: וַ/יָּ֨רֶם מֹשֶׁ֜ה אֶת יָד֗/וֹ וַ/יַּ֧ךְ אֶת הַ/סֶּ֛לַע בְּ/מַטֵּ֖/הוּ פַּעֲמָ֑יִם וַ/יֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַ/תֵּ֥שְׁתְּ הָ/עֵדָ֖ה וּ/בְעִירָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: de
  text: Da hob Mose seine Hand und schlug zweimal mit seinem Stab auf den Felsen. Da kam viel Wasser heraus, und die Gemeinde und ihr Vieh tranken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: hob … seine Hand
  rationale: Das Hifil von רום bezeichnet hier das Heben einer Hand. „hob“ gibt die körperliche Handlung natürlich und genau wieder.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Direkte Wiedergabe des Singulars mit Suffix der 3. Person maskulin Singular.
- source_word: וַיַּךְ
  choice: schlug … auf
  rationale: נכה bedeutet hier „schlagen“. In Verbindung mit dem Felsen und dem Stab ist „auf den Felsen schlagen“ im modernen Deutschen idiomatisch und bewahrt den erzählerischen Ernst.
- source_word: הַסֶּלַע
  choice: den Felsen
  rationale: סֶלַע bezeichnet einen Felsen oder Felsblock; der bestimmte Artikel wird beibehalten.
- source_word: בְּמַטֵּהוּ
  choice: mit seinem Stab
  rationale: מַטֶּה kann „Stab“ oder „Rute“ bedeuten. „Stab“ ist hier sachlich, geläufig und kontextgerecht.
- source_word: פַּעֲמָיִם
  choice: zweimal
  rationale: Die duale Form wird im Deutschen idiomatisch mit „zweimal“ wiedergegeben.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: Da kam viel Wasser heraus
  rationale: רַבִּים bezeichnet bei „Wasser“ eine große Menge. „viel Wasser“ ist eine direkte, natürliche Wiedergabe; der Singular „kam“ entspricht dem deutschen Gebrauch des Stoffnomens.
- source_word: וַתֵּשְׁתְּ
  choice: tranken
  rationale: Das hebräische Verb steht feminin singular und stimmt mit dem Kollektiv עֵדָה überein. Da im Deutschen Gemeinde und Vieh als verbundenes Subjekt erscheinen, ist der Plural natürlich.
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinde“ bewahrt den kollektiven Sinn und ist im Pentateuch verständlich und würdig.
- source_word: וּבְעִירָם
  choice: und ihr Vieh
  rationale: בְּעִיר bezeichnet Nutz- beziehungsweise Herdentiere allgemein. „Vieh“ ist breit genug und vermeidet die zu enge Bedeutung von „Rinder“.
theological_decisions:
- issue: Darstellung von Moses’ Handlung am Felsen
  choice: Die Handlung wird sachlich als zweimaliges Schlagen auf den Felsen wiedergegeben.
  alternative: Eine erweiterte Formulierung, die Moses’ Ungehorsam bereits in den Vers hineinträgt.
  rationale: Der weitere Zusammenhang bewertet Moses’ Verhalten, doch dieser Vers selbst berichtet zunächst die Handlung und ihr Ergebnis. Die Übersetzung fügt deshalb kein ausdrückliches theologisches Urteil hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Folge mit „Da“ bildet den hebräischen Erzählfluss ab, ohne unnatürlich viele deutsche „und“-Verknüpfungen zu verwenden.
