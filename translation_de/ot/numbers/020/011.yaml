  source_fidelity: 'Der Entwurf gibt die Abfolge und alle wesentlichen Elemente des Hebräischen zuverlässig wieder: Mose hebt seine Hand, schlägt den Felsen mit seinem Stab zweimal, reichlich Wasser kommt heraus, und Gemeinde sowie Vieh trinken. Die kollektivische Kongruenz des hebräischen Singularverbs bei „Gemeinde“ ist im deutschen Plural „tranken“ idiomatisch angemessen.'
