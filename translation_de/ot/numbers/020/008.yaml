source:
  edition: WLC
  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: de
  text: Nimm den Stab[a] und versammle die Gemeinde, du und dein Bruder Aaron. Redet vor ihren Augen zu dem Felsen, dann wird er sein Wasser geben. So sollst du für sie Wasser aus dem Felsen hervorbringen und die Gemeinde und ihr Vieh tränken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stock“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: den Stab
  rationale: מַטֶּה bezeichnet einen Stab oder Stock; „Stab“ ist im Deutschen natürlich und passt zum Gegenstand der Erzählung, ohne seine Funktion näher festzulegen.
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: עֵדָה meint hier die versammelte Gemeinschaft Israels. „Gemeinde“ bewahrt den gemeinschaftlichen und formellen Sinn.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: Redet ... zu dem Felsen
  rationale: Der Plural וְדִבַּרְתֶּם richtet den Auftrag an Mose und Aaron gemeinsam; „zu dem Felsen reden“ gibt דבר אל eng und verständlich wieder.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die hebräische Wendung wird wörtlich und zugleich idiomatisch wiedergegeben und hebt die öffentliche Sichtbarkeit hervor.
- source_word: וְנָתַן מֵימָיו
  choice: dann wird er sein Wasser geben
  rationale: Der Felsen ist das grammatische Subjekt; das Possessivsuffix in מֵימָיו wird mit „sein Wasser“ erhalten. „Dann“ macht den Folgezusammenhang im Deutschen deutlich.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: So sollst du für sie Wasser aus dem Felsen hervorbringen
  rationale: Der Hifil von יצא bezeichnet das Heraus- beziehungsweise Hervorbringen. Der Singular richtet sich nun ausdrücklich an Mose.
- source_word: וְהִשְׁקִיתָ
  choice: tränken
  rationale: „Tränken“ gibt den kausativen Sinn von שקה knapp und idiomatisch wieder und kann sowohl Menschen als auch Tiere als Objekte haben.
- source_word: בְּעִירָם
  choice: ihr Vieh
  rationale: בְּעִיר bezeichnet Haustiere beziehungsweise Nutzvieh. „Vieh“ ist im modernen Deutschen breit genug und fügt sich natürlich in den Satz.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: du und dein Bruder Aaron
  rationale: Die Apposition wird vollständig und in natürlicher deutscher Wortfolge bewahrt.
theological_decisions:
- issue: Öffentlicher Charakter des Befehls
  choice: „vor ihren Augen“
  alternative: „vor ihnen“ oder „in ihrer Gegenwart“
  rationale: לְעֵינֵיהֶם betont ausdrücklich, dass das Reden zum Felsen für die Gemeinde sichtbar geschieht. Diese Nuance ist für den weiteren Erzählverlauf bedeutsam und wird nicht abgeschwächt.
- issue: Adressaten des Befehls, zum Felsen zu reden
  choice: Plural „Redet“ für Mose und Aaron
  alternative: Singular „Rede“ nur an Mose
  rationale: Die Verbform וְדִבַּרְתֶּם ist eindeutig Plural. Die Übersetzung bewahrt diese grammatische Spannung dazu, dass die folgenden Verben wieder im Singular an Mose gerichtet sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Syntax, wo diese in natürlichem Deutsch tragfähig ist. Der Wechsel vom Pluralauftrag „Redet“ zum Singular „sollst du ... hervorbringen“ bleibt erhalten.
