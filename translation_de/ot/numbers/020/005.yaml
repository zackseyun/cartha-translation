- from: Und warum habt ihr uns aus Ägypten heraufgeführt, um uns an diesen schlimmen Ort zu bringen? Hier kann man weder Getreide[a] noch Feigen noch Weintrauben noch Granatäpfel anbauen, und es gibt kein Wasser zu trinken.
  to: Und warum habt ihr uns aus Ägypten heraufgeführt, um uns an diesen schlimmen Ort zu bringen? Es ist kein Ort, an dem Getreide[a], Feigen, Weintrauben oder Granatäpfel wachsen, und es gibt kein Wasser zu trinken.
  rationale: Die Aufzählung wird als Beschreibung eines unfruchtbaren Ortes formuliert. Damit bleibt die wahrscheinliche landwirtschaftliche Aussage von „kein Ort für Saat“ erhalten, ohne die hebräische Nominalreihe in eine im Deutschen unnatürliche Aussage über das Anbauen einzelner Früchte umzudeuten. Die Fußnote wahrt die wörtliche Lesart und die lexikalische Offenheit.
