source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: de
  text: Und warum habt ihr uns aus Ägypten heraufgeführt, um uns an diesen schlimmen Ort zu bringen? Es ist kein Ort, an dem Getreide[a], Feigen, Weintrauben oder Granatäpfel wachsen, und es gibt kein Wasser zu trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kein Ort für Saat“. Gemeint sein kann ein Ort, der sich nicht zum Säen eignet, oder ein Ort, der kein Getreide beziehungsweise keine Feldfrüchte hervorbringt. Die hebräischen Bezeichnungen für Feige, Weinstock und Granatapfel können auch die jeweiligen Pflanzen meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Und warum
  rationale: Die Konjunktion führt die fortgesetzte Klage weiter; „Und warum“ bildet diesen Zusammenhang natürlich ab.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: habt ihr uns aus Ägypten heraufgeführt
  rationale: Der Hifil von עלה bedeutet hier „heraufführen“. Die räumliche Exodus-Wendung und der Plural der angeredeten Führer bleiben erhalten.
- source_word: לְהָבִיא אֹתָנוּ
  choice: um uns … zu bringen
  rationale: Der Infinitiv mit לְ bezeichnet hier den von den Klagenden unterstellten Zweck beziehungsweise das Ergebnis.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: an diesen schlimmen Ort
  rationale: רַע bezeichnet den Ort hier als schlecht, beschwerlich oder unerwünscht, nicht zwingend als moralisch böse. „schlimm“ erhält die starke negative Wertung ohne eine moralische Festlegung.
- source_word: לֹא מְקוֹם זֶרַע
  choice: Hier kann man … kein Getreide anbauen
  rationale: Wörtlich steht „kein Ort des Samens“. Im Zusammenhang mit den aufgeführten Kulturpflanzen bezeichnet die Wendung wahrscheinlich einen zum Säen beziehungsweise zum Anbau geeigneten Ort; die deutsche Fassung macht diesen Sinn verständlich, ohne das Ergebnis bloß als vorhandenes Erzeugnis darzustellen.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: weder … Feigen noch Weintrauben noch Granatäpfel
  rationale: Die Einzelnomen können Pflanzen oder deren Früchte bezeichnen. In der deutschen Aufzählung ist die Wiedergabe durch die landwirtschaftlichen Erzeugnisse natürlich; „Weintrauben“ vermeidet das mehrdeutige deutsche „Wein“.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: und es gibt kein Wasser zu trinken
  rationale: Die Existenzverneinung אַיִן mit dem Infinitiv wird idiomatisch und eng am Hebräischen wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem Erzählton. Die rhetorische Klage bleibt scharf; „schlimm“ vermeidet bei רַע eine unbeabsichtigte moralische Deutung. Die Paarung „weder … noch“ gibt die Reihe der fehlenden Anbauprodukte im Deutschen flüssig wieder.
