  text: וַ/יֵּרְד֤וּ אֲבֹתֵ֨י/נוּ֙ מִצְרַ֔יְמָ/ה וַ/נֵּ֥שֶׁב בְּ/מִצְרַ֖יִם יָמִ֣ים רַבִּ֑ים וַ/יָּרֵ֥עוּ לָ֛/נוּ מִצְרַ֖יִם וְ/לַ/אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: de
  text: Unsere Väter zogen nach Ägypten hinab,[a] und wir lebten lange Zeit in Ägypten.[b] Und die Ägypter behandelten uns und unsere Väter schlecht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unsere Vorfahren zogen nach Ägypten hinab“; das Hebräische lautet wörtlich „unsere Väter“. Entsprechend auch am Versende.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „viele Tage“; eine hebräische Wendung für eine lange Zeit.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „misshandelten uns und unsere Väter“ oder „taten uns und unseren Vätern Böses an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: zogen … hinab
  rationale: Bewahrt die geläufige geografische Bewegungsangabe ירד und klingt im Deutschen natürlich-biblisch.
- source_word: אֲבֹתֵינוּ
  choice: unsere Väter
  rationale: Gibt den wörtlichen Ausdruck wieder; im geschichtlichen Zusammenhang sind die Vorfahren gemeint.
- source_word: מִצְרַיְמָה
  choice: nach Ägypten
  rationale: Gibt das Richtungs-He natürlich und präzise wieder.
- source_word: וַנֵּשֶׁב
  choice: wir lebten
  rationale: ישב bezeichnet hier das Wohnen beziehungsweise Verweilen; „lebten“ ist klar und gegenwärtig.
- source_word: יָמִים רַבִּים
  choice: lange Zeit
  rationale: Die wörtliche Wendung „viele Tage“ bezeichnet idiomatisch eine lange Zeitspanne; die natürliche deutsche Wiedergabe vermeidet die unbeabsichtigte Verengung auf einzelne Tage.
- source_word: וַיָּרֵעוּ
  choice: behandelten … schlecht
  rationale: Der Hifil von רעע bezeichnet schädigendes oder böses Handeln gegenüber Betroffenen; die Formulierung erhält die breite moralisch negative Bedeutung.
- source_word: מִצְרַיִם
  choice: die Ägypter
  rationale: Obwohl die Form „Ägypten“ lautet, zeigt das pluralische Verb, dass die Ägypter als handelnde Menschen gemeint sind.
- source_word: לָנוּ וְלַאֲבֹתֵינוּ
  choice: uns und unsere Väter
  rationale: Gibt beide betroffenen Gruppen und die Wiederholung von אבות ausdrücklich wieder.
