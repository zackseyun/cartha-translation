id: NUM.20.23
reference: Numbers 20:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose und zu Aaron am Berg Hor, an der Grenze des Landes Edom:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sprach
  rationale: Das Verb אמר bedeutet gewöhnlich »sagen«; in der feierlichen erzählenden Einleitung göttlicher Rede ist »sprach« im Deutschen natürlich und präzise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des Gottesnamens JHWH bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und zu Aaron
  rationale: Die Wiederholung der Präposition אֶל wird beibehalten und gibt dem Satz Klarheit und den Rhythmus des Hebräischen.
- source_word: בְּהֹר הָהָר
  choice: am Berg Hor
  rationale: Die Ortsangabe bezeichnet den Berg Hor; בְּ ist hier lokativ und wird natürlich mit »am« wiedergegeben.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: an der Grenze des Landes Edom
  rationale: גְּבוּל bezeichnet hier die territoriale Grenze; die deutsche Formulierung ist unmittelbar verständlich und entspricht der hebräischen Konstruktion.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als die formelhafte Wiedergabe »indem er sagte«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« bewahrt ihn als Namen; die traditionelle Ersetzung durch den Titel »der HERR« wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Präposition in »zu Mose und zu Aaron« wahrt die hebräische Satzgestalt; der Doppelpunkt gibt die Redeeinleitungsformel לֵאמֹר idiomatisch wieder.
