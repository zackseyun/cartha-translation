base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: de
  text: Mose zog Aaron seine Gewänder aus und bekleidete Aarons Sohn Eleasar damit[a]. Aaron starb dort oben auf dem Berg[b]. Danach stiegen Mose und Eleasar vom Berg hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Aarons priesterliche Amtsgewänder. Indem Eleasar sie erhält, tritt er das priesterliche Amt seines Vaters an, wie es der Zusammenhang beschreibt.
    reason: cultural_note
  - marker: b
    text: 'Oder: auf dem Gipfel des Berges.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: zog … aus
  rationale: Der Hifil von פשט bezeichnet hier das Ausziehen beziehungsweise Abnehmen der Kleidung einer anderen Person. Die Wendung ist im Deutschen konkret und natürlich.
- source_word: בְּגָדָיו
  choice: seine Gewänder
  rationale: בגד ist die allgemeine Bezeichnung für Kleidung oder Gewänder. „Gewänder“ wahrt den würdigen Erzählton, ohne im Haupttext ausdrücklich „priesterlich“ hinzuzufügen.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: legte sie seinem Sohn Eleasar an
  rationale: Der Hifil von לבש bedeutet, jemanden zu bekleiden. Die deutsche Formulierung stellt klar, dass dieselben zuvor ausgezogenen Gewänder Eleasar angelegt werden.
- source_word: וַיָּמָת
  choice: starb
  rationale: מות ist das gewöhnliche Verb für „sterben“; die direkte Wiedergabe vermeidet einen im Hebräischen nicht vorhandenen Euphemismus.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb wird ausdrücklich wiedergegeben und bezieht Aarons Tod auf den zuvor genannten Ort.
- source_word: בְּרֹאשׁ הָהָר
  choice: oben auf dem Berg
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“ und bezeichnet räumlich die Spitze oder den obersten Bereich. „Oben auf dem Berg“ ist natürlich und lässt die mögliche Wiedergabe „auf dem Gipfel“ offen.
- source_word: וַיֵּרֶד … מִן הָהָר
  choice: stiegen … vom Berg hinab
  rationale: ירד bezeichnet die Abwärtsbewegung; zusammen mit מִן הָהָר wird sie im Deutschen klar und idiomatisch als Hinabsteigen vom Berg ausgedrückt.
theological_decisions:
- issue: Bedeutung der Gewänder bei der Nachfolge Eleasars
  choice: Im Haupttext steht nur „Gewänder“; ihre priesterliche Funktion wird in einer Fußnote erläutert.
  alternative: „priesterliche Gewänder“ oder „Amtsgewänder“ unmittelbar in den Haupttext aufnehmen.
  rationale: Der Zusammenhang beschreibt die Übertragung des priesterlichen Amtes auf Eleasar, doch der Vers selbst verwendet das allgemeine Wort בְּגָדִים. Die gewählte Fassung vermeidet eine inhaltlich zutreffende, aber lexikalisch ergänzende Präzisierung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die Formulierung bleibt nahe am konkreten Handlungsgeschehen des Hebräischen, erläutert die Amtsnachfolge jedoch nur in der Fußnote.
