  verdict: revise
  source_fidelity: Der Entwurf gibt die Handlung, den Tod Aarons auf dem Berg und den anschließenden Abstieg von Mose und Eleasar insgesamt quellentreu wieder. In „seinem Sohn Eleasar“ ist der Bezug des Possessivpronomens im Deutschen jedoch naheliegend Mose zugeordnet, während der hebräische Text Eleasar ausdrücklich als Sohn Aarons bezeichnet.
  naturalness: Die Erzählung ist modernes, würdiges Standarddeutsch. „Aaron seine Gewänder ausziehen“ und „vom Berg hinabsteigen“ sind idiomatisch. Die Umstellung zu „bekleidete Aarons Sohn Eleasar damit“ beseitigt die Bezugsmehrdeutigkeit und bleibt natürlich.
  terminology: „Gewänder“ gibt בְּגָדָיו angemessen wieder, ohne die im Vers nicht ausdrücklich benannte priesterliche Funktion in den Haupttext einzutragen. „Gipfel“ ist eine passende lexikalische Alternative zu „oben auf dem Berg“. Die Namen Mose, Aaron und Eleasar sind standardsprachlich und konsistent.
  issues:
