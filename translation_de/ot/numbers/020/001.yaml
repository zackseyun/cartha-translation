  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: de
  text: Im ersten Monat kamen die Israeliten[a], die ganze Gemeinschaft, in die Wüste Zin. Das Volk blieb in Kadesch. Dort starb Mirjam, und dort wurde sie begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«; gemeint sind die Israeliten als ganzes Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet »die Söhne Israels«, bezeichnet hier jedoch das gesamte Volk. »Die Israeliten« gibt die Bedeutung im modernen Deutschen natürlich und inklusiv wieder; die Ausgangsmetapher wird in einer Fußnote genannt.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinschaft
  rationale: עֵדָה bezeichnet die versammelte Volks- und Bundesgemeinschaft. »Gemeinschaft« ist im heutigen Deutsch verständlicher und weniger kirchlich geprägt als »Gemeinde«.
- source_word: מִדְבַּר צִן
  choice: die Wüste Zin
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Land; »Wüste« ist die übliche und geografisch passende deutsche Wiedergabe.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: im ersten Monat
  rationale: Die Wendung ist eine schlichte Zeitangabe; welcher erste Monat gemeint ist, wird im Vers nicht näher bestimmt.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: Beim kollektiven Subjekt »das Volk« bezeichnet das Verb den Aufenthalt an einem Ort. »Blieb« vermeidet die mögliche Vorstellung einer dauerhaften Ansiedlung.
- source_word: בְּקָדֵשׁ
  choice: in Kadesch
  rationale: Die hebräische Präposition בְּ wird ortsbezogen direkt mit »in« wiedergegeben; »Kadesch« entspricht der etablierten deutschen Namensform.
- source_word: וַתָּמָת ... וַתִּקָּבֵר
  choice: starb ... wurde begraben
  rationale: Die direkte Aussage über Mirjams Tod und die passive Form des Begrabens werden bewahrt, ohne einen nicht genannten Handelnden zu ergänzen.
- source_word: שָׁם ... שָׁם
  choice: dort ... dort
  rationale: Die auffällige Wiederholung des Ortsadverbs wird entsprechend dem Hebräischen beibehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze narrative Sätze bewahren den schlichten Stil des Hebräischen. Die Apposition »die ganze Gemeinschaft« bleibt erhalten; die Wiederholung von »dort« wird nicht geglättet.
