base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: de
  text: 'Dann sandte Mose von Kadesch aus Boten zum König von Edom: »So spricht dein Bruder Israel: Du weißt um all die Mühsal, die uns getroffen hat.[a][b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »all die Not« beziehungsweise »all die Bedrängnis«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die uns gefunden hat«; gemeint ist: »die uns getroffen hat« oder »die über uns gekommen ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Dann sandte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Dann« gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im diplomatischen Zusammenhang sind menschliche Überbringer beziehungsweise Abgesandte gemeint, nicht himmlische Wesen.
- source_word: מִקָּדֵשׁ
  choice: von Kadesch aus
  rationale: Der hebräische Text nennt nur Kadesch; der längere Ortsname Kadesch-Barnea wird nicht ergänzt.
- source_word: מֶלֶךְ אֱדוֹם
  choice: zum König von Edom
  rationale: Dies gibt die hebräische Genitivverbindung unmittelbar und idiomatisch wieder.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird in einer im Deutschen geläufigen, würdevollen Form wiedergegeben.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: dein Bruder Israel
  rationale: Die direkte Verwandtschaftssprache bleibt erhalten und erinnert an die über Jakob und Esau bestehende Beziehung zwischen Israel und Edom.
- source_word: אַתָּה יָדַעְתָּ
  choice: Du weißt
  rationale: Das Perfekt bezeichnet hier einen gegenwärtigen Wissensstand; das ausdrückliche »Du« bewahrt die im Hebräischen vorhandene Hervorhebung.
- source_word: כָּל הַתְּלָאָה
  choice: all die Mühsal
  rationale: »Mühsal« umfasst die erlittene Not und Bedrängnis und entspricht dem Sammelbegriff im Singular.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: die uns getroffen hat
  rationale: Das hebräische Bild lautet wörtlich, dass die Mühsal Israel »gefunden« habe; »getroffen hat« gibt dieses Idiom im Deutschen klar und bildnah wieder.
theological_decisions:
- issue: Verwandtschaftssprache zwischen Israel und Edom
  choice: dein Bruder Israel
  alternative: dein Verwandter Israel
  rationale: Der Appell wird bewusst als Rede unter Brüdern formuliert und gründet in der Abstammungsbeziehung von Jakob und Esau. Die Übersetzung erhält diese theologisch und rhetorisch bedeutsame Metapher, ohne sie im Haupttext auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller biblischer Erzähl- und Botenformel. Die direkte familiäre Anrede bleibt bewusst ungemildert erhalten.
