  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des Hebräischen wieder: Mose als Subjekt, das Senden menschlicher Boten von Kadesch zum König von Edom, die Botenformel, die direkte Verwandtschaftsanrede sowie die erlittene umfassende Mühsal. »Die uns getroffen hat« ist eine treffende idiomatische Wiedergabe von אֲשֶׁר מְצָאָתְנוּ und wahrt das Bild des hebräischen Ausdrucks angemessen.'
  naturalness: Modernes, flüssiges Standarddeutsch. »Dann sandte«, »von Kadesch aus«, »So spricht« und »Du weißt um« sind in diesem erzählerisch-diplomatischen Register natürlich und würdevoll. »Mühsal« ist leicht gehoben, aber verständlich und stilistisch passend.
  terminology: »Boten« ist im diplomatischen Kontext korrekt; »Kadesch«, »Edom«, »Israel« und »Mose« sind konsistent und sachgerecht wiedergegeben. »Dein Bruder Israel« erhält die im Ausgangstext rhetorisch wichtige Verwandtschaftsmetapher, ohne sie konfessionell auszudeuten. Die Fußnoten bieten geeignete lexikalische Alternativen und erläutern das hebräische Idiom.
