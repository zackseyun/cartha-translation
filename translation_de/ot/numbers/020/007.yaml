lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … redete
  rationale: Das Waw mit dem Piel von דבר bildet eine übliche hebräische Erzählformel. „Redete“ bewahrt ihren feierlichen, aber verständlichen Klang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: und sprach
  rationale: Der Infinitiv לֵאמֹר leitet den folgenden Redeinhalt formelhaft ein. Die deutsche Bibelformel „und sprach“ gibt seine Funktion natürlich und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt diesen als Namen; die traditionelle Ersetzung durch „der HERR“ ist hier nicht erforderlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeformel bleibt durch „redete … und sprach“ erkennbar; der Doppelungseindruck ist im Deutschen bibelsprachlich geläufig.
