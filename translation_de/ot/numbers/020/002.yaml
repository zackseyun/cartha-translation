  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: de
  text: Die Gemeinschaft hatte kein Wasser, und sie versammelte sich gegen Mose und Aaron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: hatte kein
  rationale: 'Die hebräische Existenzkonstruktion mit לָעֵדָה wird im Deutschen natürlich als Besitz- beziehungsweise Verfügbarkeitsaussage wiedergegeben: Der Gemeinschaft stand kein Wasser zur Verfügung. Das einleitende וְ wird durch die Satzverknüpfung im Kontext getragen und nicht mit einem unbelegten Zeitadverb erweitert.'
- source_word: מַיִם
  choice: Wasser
  rationale: Die hebräische Stoffbezeichnung im Plural entspricht im Deutschen dem Singular des Massennomens „Wasser“.
- source_word: לָ/עֵדָה
  choice: Die Gemeinschaft
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinschaft“ ist im modernen Deutschen verständlich und bewahrt den kollektiven Sinn.
- source_word: וַ/יִּקָּהֲלוּ
  choice: sie versammelte sich
  rationale: Das Verb קהל bezeichnet das Zusammenkommen als Gruppe. Der grammatische Singular bezieht sich im Deutschen auf „die Gemeinschaft“.
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: gegen Mose und Aaron
  rationale: Im Zusammenhang der anschließenden Auseinandersetzung hat עַל adversative Bedeutung. Das Deutsche benötigt „gegen“ nicht vor beiden Namen zu wiederholen, um die Opposition gegen beide klar auszudrücken.
