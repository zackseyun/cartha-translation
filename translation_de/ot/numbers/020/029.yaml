id: NUM.20.29
reference: Numbers 20:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: de
  text: Als die ganze Gemeinde sah, dass Aaron gestorben war[a], weinte das ganze Haus Israel[b] dreißig Tage lang um Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erkannte, dass Aaron gestorben war“. Wörtlich steht im Hebräischen „sah“; das Verb kann hier auch das Erkennen dieser Tatsache einschließen.'
    reason: lexical_alternative
  - marker: b
    text: „Das ganze Haus Israel“ ist eine gemeinschaftliche Bezeichnung für das gesamte Volk Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: sah
  rationale: ראה bedeutet grundsätzlich „sehen“, kann hier aber zugleich das Erkennen der Tatsache einschließen. „sah“ bewahrt die konkrete hebräische Ausdrucksweise.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die israelitische Gemeinschaft; „Gemeinde“ ist im Pentateuch verständlich und würdevoll.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was die Gemeinde sah beziehungsweise erkannte.
- source_word: גָוַע
  choice: gestorben war
  rationale: גוע bezeichnet das Sterben beziehungsweise Verscheiden. Das Plusquamperfekt gibt das zeitliche Verhältnis im Deutschen natürlich wieder.
- source_word: וַיִּבְכּוּ
  choice: weinte
  rationale: בכה bedeutet konkret „weinen“ und bewahrt die emotionale Kraft des hebräischen Textes.
- source_word: אֶת אַהֲרֹן
  choice: um Aaron
  rationale: Bei בכה bezeichnet אֵת die betrauerte Person; idiomatisches Deutsch verlangt „um Aaron weinen“.
- source_word: שְׁלֹשִׁים יוֹם
  choice: dreißig Tage lang
  rationale: Der Akkusativ der Zeitdauer wird im modernen Deutsch natürlich mit „lang“ ausgedrückt.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Die feste Wendung wird bewahrt, damit ihr gemeinschaftlich-korporativer Charakter nicht zu „ganz Israel“ abgeflacht wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Satzfolge und das konkrete Verb „sehen“ bleiben erhalten; „dreißig Tage lang“ und „um Aaron“ entsprechen natürlichem deutschem Sprachgebrauch.
