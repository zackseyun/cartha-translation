source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱד֔וֹם לֹ֥א תַעֲבֹ֖ר בִּ֑/י פֶּן בַּ/חֶ֖רֶב אֵצֵ֥א לִ/קְרָאתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: de
  text: 'Doch Edom sagte zu ihm: »Du darfst nicht durch mein Gebiet ziehen[a], sonst ziehe ich dir mit dem Schwert entgegen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch mich“. Edom spricht hier als Volk beziehungsweise als Gebiet; gemeint ist der Durchzug durch edomitisches Land.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann für sich genommen auch „um dir zu begegnen“ bedeuten. Durch den Zusatz „mit dem Schwert“ ist hier eine bewaffnete Konfrontation gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche erzählende Wiedergabe des Wayyiqtol von אמר; im modernen deutschen Erzählstil natürlich und präzise.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; das Pronomen ist maskulin Singular.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Eigenname des Volkes beziehungsweise seines Gebiets; die Mehrdeutigkeit zwischen Volk und Land bleibt im Kontext erhalten.
- source_word: לֹא תַעֲבֹר
  choice: Du darfst nicht … ziehen
  rationale: Der negierte Qal-Imperfekt 2. Person maskulin Singular spricht ein entschiedenes Durchzugsverbot aus. „Darfst nicht“ klingt im heutigen Deutsch natürlich und bewahrt die verbindliche Ablehnung.
- source_word: בִּי
  choice: durch mein Gebiet
  rationale: Wörtlich steht „durch mich“. Da Edom als Volk beziehungsweise Territorium spricht, bezeichnet die Wendung den Durchzug durch edomitisches Gebiet; die Personifizierung wird in einer Fußnote kenntlich gemacht.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet hier nicht bloß eine Befürchtung, sondern die angedrohte Folge bei Missachtung des Verbots ein. „Sonst“ gibt diese Warnfunktion idiomatisch wieder.
- source_word: בַּחֶרֶב
  choice: mit dem Schwert
  rationale: Die Präposition ב mit חֶרֶב bezeichnet das Mittel bewaffneter Gewalt; die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: אֵצֵא
  choice: ziehe ich
  rationale: Das Qal-Imperfekt 1. Person Singular von יצא bedeutet „hinausgehen/ausziehen“. Zusammen mit „entgegen“ bezeichnet es hier das militärische Ausziehen und lässt sich im Deutschen knapp mit „entgegenziehen“ ausdrücken.
- source_word: לִקְרָאתֶךָ
  choice: dir … entgegen
  rationale: Die Wendung bedeutet grundsätzlich „dir entgegen/um dir zu begegnen“. Der Zusammenhang mit dem Schwert macht die feindliche Absicht deutlich, ohne dass sie eigens in das Lexem hineingelesen werden muss.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ markiert den Gegensatz zur vorausgehenden Bitte, „darfst nicht“ formuliert Edoms entschiedene Verweigerung ohne archaisches Gepräge, und „mit dem Schwert entgegenziehen“ bewahrt sowohl die Bildlichkeit als auch die feindliche Stoßrichtung des hebräischen Satzes.
