source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: de
  text: 'Und die Israeliten sagten zu ihm[a]: »Wir wollen auf der Hauptstraße hinaufziehen. Wenn ich und mein Vieh von deinem Wasser trinken, werde ich den Preis dafür bezahlen. Ich will nur zu Fuß hindurchziehen[b] – weiter nichts.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Mit meinen Füßen will ich hindurchziehen«; gemeint ist der bloße Durchzug durch das Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche deutsche Volksbezeichnung gibt den hebräischen Ausdruck בְּנֵי יִשְׂרָאֵל verständlich wieder; die wörtliche Form »Söhne Israels« wird in der Fußnote kenntlich gemacht.
- source_word: בַּמְסִלָּה
  choice: auf der Straße
  rationale: מְסִלָּה bezeichnet eine ausgebaute beziehungsweise erhöhte Straße; »auf der Straße« bewahrt die Wegvorstellung und passt zur Präposition בְּ.
- source_word: נַעֲלֶה
  choice: wir wollen hinaufziehen
  rationale: Die aufwärts gerichtete Bedeutung von עלה bleibt erhalten; das Kohortativverständnis passt zur erneuten Bitte um Durchzug.
- source_word: מֵימֶיךָ
  choice: von deinem Wasser
  rationale: Das im Hebräischen morphologisch plurale Wort für Wasser wird im Deutschen idiomatisch als Singular wiedergegeben.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: ich und mein Vieh von deinem Wasser trinken
  rationale: Der überraschende Wechsel von der Mehrzahl zur ersten Person Singular bleibt sichtbar; מִקְנֶה umfasst den Viehbestand allgemein.
- source_word: וְנָתַתִּי מִכְרָם
  choice: werde ich den Preis dafür bezahlen
  rationale: מֶכֶר bezeichnet den Kaufpreis beziehungsweise die Bezahlung; »dafür« bezieht sich im Deutschen klar auf das verbrauchte Wasser.
- source_word: רַק אֵין דָּבָר
  choice: nur … – weiter nichts
  rationale: Die Begrenzungspartikel רַק und die minimierende Wendung אֵין דָּבָר werden gemeinsam als nachdrückliche Beschränkung der Bitte wiedergegeben.
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: Ich will … zu Fuß hindurchziehen
  rationale: Die Erwähnung der Füße wird bewahrt, während der Kohortativ als höflich-nachdrückliche Absicht beziehungsweise Bitte erscheint.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Numeruswechsel von »wir« zu »ich« wurde entsprechend dem Hebräischen nicht geglättet. Die direkte Rede bleibt als respektvolle, begrenzte Durchzugsbitte erkennbar.
