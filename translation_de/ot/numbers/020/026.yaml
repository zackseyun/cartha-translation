  text: וְ/הַפְשֵׁ֤ט אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/הִלְבַּשְׁתָּ֖/ם אֶת אֶלְעָזָ֣ר בְּנ֑/וֹ וְ/אַהֲרֹ֥ן יֵאָסֵ֖ף וּ/מֵ֥ת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: de
  text: Zieh Aaron seine Gewänder aus[a] und lege sie seinem Sohn Eleasar an. Aaron aber wird versammelt werden[b] und dort sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind im Zusammenhang Aarons priesterliche Gewänder; im Hebräischen steht nur „seine Gewänder“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wird versammelt werden“. Dies ist eine hebräische Wendung für den Tod; an anderen Stellen lautet sie ausführlicher „zu seinen Vorfahren“ oder „zu seinem Volk versammelt werden“. Eine solche Zielangabe steht in diesem Vers nicht.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וְהַפְשֵׁט
  choice: Zieh … aus
  rationale: Der Hifil-Imperativ von פשט bezeichnet hier das Ausziehen der Kleidung einer anderen Person. Die deutsche Konstruktion „jemandem etwas ausziehen“ gibt dies natürlich und direkt wieder.
- source_word: בְּגָדָיו
  choice: seine Gewänder
  rationale: בגד bedeutet Kleidung oder Gewand. „Gewänder“ passt zum würdevollen, kultischen Zusammenhang, ohne das im Einzelwort nicht ausdrücklich enthaltene „priesterlich“ in den Haupttext einzufügen.
- source_word: וְהִלְבַּשְׁתָּם
  choice: lege sie … an
  rationale: Das Hifil mit dem Suffix „sie“ fordert dazu auf, Eleasar die zuvor genannten Gewänder anzulegen. Die Formulierung bewahrt den Rückbezug des Pronomens und klingt im Deutschen natürlich.
- source_word: אֶת אֶלְעָזָר בְּנוֹ
  choice: seinem Sohn Eleasar
  rationale: Die Wortstellung wurde für idiomatisches Deutsch angepasst; das Verhältnis Eleasars zu Aaron bleibt eindeutig.
- source_word: יֵאָסֵף
  choice: wird zu den Seinen versammelt werden
  rationale: Das Nifal von אסף ist in diesem Zusammenhang eine Todeswendung. „Zu den Seinen“ macht den idiomatischen Sinn im Deutschen verständlich, kennzeichnet aber durch eine Fußnote, dass das Ziel der Versammlung im vorliegenden hebräischen Vers nicht ausdrücklich genannt wird.
- source_word: וּמֵת שָׁם
  choice: und dort sterben
  rationale: Die verbundene Perfektform setzt die zukünftige Folge fort; „und dort sterben“ ist knapp und entspricht dem Ortsadverb שָׁם.
theological_decisions:
- issue: Todeswendung יֵאָסֵף
  choice: „wird zu den Seinen versammelt werden“ im Haupttext, mit textkritisch-lexikalischer Erläuterung
  alternative: „wird versammelt werden“
  rationale: Das bloße „wird versammelt werden“ wäre im heutigen Deutsch unklar und ließe ein notwendiges Ziel vermissen. Die übliche Ergänzung „zu den Seinen“ vermittelt den hebräischen Todesidiom, während die Fußnote offenlegt, dass diese Worte hier nur sinngemäß ergänzt sind. Die Wendung wird nicht einfach mit „sterben“ gleichgesetzt, da der folgende Ausdruck das Sterben eigens nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Imperative bleiben unmittelbar; „Gewänder“ wahrt den feierlichen Kontext. „Aaron aber“ markiert natürlich den Wechsel von der Anweisung zu der angekündigten Folge.
