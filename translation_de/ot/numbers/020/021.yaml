  text: וַ/יְמָאֵ֣ן אֱד֗וֹם נְתֹן֙ אֶת יִשְׂרָאֵ֔ל עֲבֹ֖ר בִּ/גְבֻל֑/וֹ וַ/יֵּ֥ט יִשְׂרָאֵ֖ל מֵ/עָלָֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: de
  text: Doch Edom weigerte sich, Israel durch sein Gebiet ziehen zu lassen. Deshalb wandte sich Israel von ihm ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: weigerte sich
  rationale: Das Verb מאן bezeichnet eine entschiedene Weigerung; „weigerte sich“ ist im deutschen Erzählstil natürlich und präzise.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Der überlieferte Eigenname des Landes beziehungsweise Volkes wird beibehalten.
- source_word: נְתֹן ... עֲבֹר
  choice: durch ... ziehen zu lassen
  rationale: Die Verbindung bezeichnet idiomatisch die verweigerte Erlaubnis zum Durchzug; die deutsche Konstruktion mit „lassen“ gibt dies klar wieder.
- source_word: בִּגְבֻלוֹ
  choice: durch sein Gebiet
  rationale: גְּבוּל kann Grenze, Grenzgebiet oder Territorium bedeuten. Im Kontext geht es um den Durchzug durch das edomitische Hoheitsgebiet, daher ist „Gebiet“ sachlich und idiomatisch.
- source_word: וַיֵּט
  choice: wandte sich ... ab
  rationale: נטה bezeichnet hier ein Abwenden beziehungsweise Ändern der eingeschlagenen Richtung. „Wandte sich ab“ bewahrt die Bewegungsnuance und klingt würdig und natürlich.
- source_word: מֵעָלָיו
  choice: von ihm
  rationale: Die Präpositionalfügung bezeichnet hier die Bewegung weg von Edom; „von ihm“ verbindet sich idiomatisch mit „wandte sich ab“.
theological_decisions: []
translation_notes:
