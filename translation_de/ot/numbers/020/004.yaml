source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: de
  text: Und warum habt ihr die Versammlung Jahwes[a] in diese Wüste gebracht, damit wir und unser Vieh dort sterben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gemeinde Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Und warum
  rationale: Bewahrt sowohl die anknüpfende Konjunktion als auch die vorwurfsvolle Frage.
- source_word: הֲבֵאתֶם
  choice: habt ihr gebracht
  rationale: Das Hifil von בוא bezeichnet hier das Hineinbringen; das deutsche Perfekt gibt die abgeschlossene Handlung mit gegenwärtiger Folge natürlich wieder.
- source_word: קְהַל יְהוָה
  choice: die Versammlung Jahwes
  rationale: קהל bezeichnet die versammelte Gemeinschaft. „Versammlung“ wahrt den kollektiven Sinn, ohne eine spezifisch kirchliche Bedeutung einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: in diese Wüste
  rationale: מִדְבָּר bezeichnet eine Wüsten- oder Steppenlandschaft; „in diese Wüste“ ist im Deutschen idiomatisch und gibt die gerichtete Bewegung wieder.
- source_word: לָמוּת שָׁם
  choice: damit … dort sterben
  rationale: Der Infinitiv kann Zweck oder Folge ausdrücken. „Damit“ lässt im vorwurfsvollen Kontext beide Nuancen mitschwingen.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: wir und unser Vieh
  rationale: Die ausdrücklich genannten Betroffenen bleiben erhalten; „Vieh“ ist eine natürliche deutsche Sammelbezeichnung für בְּעִיר.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Zweck oder Folge bei לָמוּת
  choice: damit wir und unser Vieh dort sterben
  alternative: sodass wir und unser Vieh dort sterben
  rationale: Der Infinitiv lässt Zweck und Ergebnis zu. Im Mund der Klagenden formuliert „damit“ den unterstellten Zweck, ohne diesen als Aussage des Erzählers zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem natürlichen deutschen Sprachfluss, während die anknüpfende Frage und der scharfe Vorwurf des Hebräischen erhalten bleiben.
