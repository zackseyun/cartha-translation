base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: de
  text: Das sind die Wasser von Meriba,[a] wo die Söhne Israels mit Jahwe stritten; und er erwies sich unter ihnen als heilig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba bedeutet „Streit“ oder „Auseinandersetzung“.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und er erwies sich an ihnen als heilig“; wörtlicher: „und er wurde in ihnen als heilig erwiesen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: Das sind
  rationale: Das Demonstrativpronomen identifiziert die zuvor genannten Wasser. Das deutsche Präsens entspricht der Benennungsformel natürlich.
- source_word: מֵי מְרִיבָה
  choice: die Wasser von Meriba
  rationale: Die Konstruktverbindung bezeichnet hier den in der Erzählung benannten Ort beziehungsweise die Wasser von Meriba. Der Name bleibt transliteriert; seine Bedeutung wird in einer Fußnote erläutert.
- source_word: רָבוּ
  choice: stritten
  rationale: ריב bezeichnet Streit oder Auseinandersetzung. „Stritten“ ist modernes, klares Deutsch und bewahrt die Verbindung zur Bedeutung des Namens Meriba.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formnahe Wiedergabe erhält die ausdrücklich maskuline hebräische Konstruktverbindung und ihren traditionellen ethnischen beziehungsweise bundesgeschichtlichen Klang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּקָּדֵשׁ
  choice: und er erwies sich als heilig
  rationale: Der Nifal von קדש kann passiv oder medial-reflexiv verstanden werden. „Er erwies sich als heilig“ gibt die Offenbarung beziehungsweise Bestätigung seiner Heiligkeit natürlich wieder, ohne anzudeuten, Menschen hätten Gott erst heilig gemacht.
- source_word: בָּם
  choice: unter ihnen
  rationale: Die Präposition ב mit Suffix bezeichnet hier am natürlichsten den Bereich beziehungsweise die Personengruppe, in deren Mitte sich Jahwes Heiligkeit erwies. Andere Zuordnungen bleiben möglich und werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von Jahwes Heiligung im Schlusssatz
  choice: und er erwies sich unter ihnen als heilig
  alternative: und er wurde an ihnen als heilig erwiesen / und er heiligte sich an ihnen
  rationale: Die gewählte Formulierung wahrt die mediale beziehungsweise passive Spannung des Nifal, klingt im Deutschen natürlich und vermeidet die missverständliche Vorstellung, Israel habe Gott heilig gemacht. Die Fußnote bewahrt die formnäheren Alternativen.
- issue: Kollektive Bezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / die Kinder Israels
  rationale: Die Hauptübersetzung folgt der grammatischen Form des hebräischen Ausdrucks, ohne seine kollektive Bedeutung zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit formnaher Benennung „Wasser von Meriba“ und „Söhne Israels“. Der Semikolon gliedert die Identifikation des Ortes und die theologische Schlussaussage. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Textstellen.
