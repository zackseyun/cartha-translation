  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: de
  text: Da nahm Mose den Stab von vor Jahwe, wie er ihm geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm
  rationale: Das Qal-Wayyiqtol von לקח bezeichnet hier die nächste erzählte Handlung. „Da nahm“ gibt den einfachen narrativen Fortgang im Deutschen natürlich wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Eingebürgerte deutsche Form des hebräischen Namens מֹשֶׁה.
- source_word: הַמַּטֶּה
  choice: den Stab
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang einen konkreten Stab. „Stab“ ist im modernen Deutschen natürlicher als das ebenfalls mögliche „Rute“.
- source_word: מִלִּפְנֵי
  choice: von seinem Platz vor
  rationale: Die Formulierung bewahrt die räumliche Bedeutung „von vor“, vermeidet aber die unnatürliche deutsche Wendung „von vor Jahwe“. „Seinem Platz“ ist eine knappe kontextuelle Verdeutlichung und bezeichnet keinen im Hebräischen eigens genannten Gegenstand.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Wendung bezeichnet die Übereinstimmung mit dem vorausgehenden Befehl; „genau wie“ drückt dies in natürlichem Deutsch aus.
- source_word: צִוָּהוּ
  choice: er ihm geboten hatte
  rationale: Das Verb bedeutet „ihm befehlen/gebieten“. Das Plusquamperfekt macht im Deutschen deutlich, dass der Befehl der hier berichteten Handlung vorausging.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm יהוה. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Von seinem Platz vor Jahwe“ gibt die konkrete räumliche Aussage idiomatischer wieder als das wörtliche, im Deutschen schwerfällige „von vor Jahwe“.
