  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל כָּל הָ/עֵדָ֖ה הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: de
  text: Dann brachen sie von Kadesch auf, und die Israeliten[a], die ganze Gemeinschaft, kamen zum Berg Hor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Hor, der Berg“; die Wortfolge dient als Ortsname.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Dann brachen sie … auf
  rationale: נסע bezeichnet hier im fortlaufenden Erzählstil das Aufbrechen von einem Lager- oder Aufenthaltsort. „Aufbrechen“ gibt diesen Reisesinn im modernen Deutschen natürlich wieder; „Dann“ markiert die Erzählfolge des וַ.
- source_word: מִקָּדֵשׁ
  choice: von Kadesch
  rationale: Der hebräische Text nennt nur קָדֵשׁ. Die Erweiterung zu „Kadesch-Barnea“ wäre eine kontextuelle Identifizierung, die nicht ausdrücklich im Vers steht.
- source_word: וַיָּבֹאוּ
  choice: kamen zu
  rationale: בוא bedeutet allgemein „kommen“ oder „hineingehen“. Vor einem Bergnamen ist „zum Berg … kommen“ idiomatisch und wahrt die räumliche Zielangabe.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“. „Die Israeliten“ ist die natürliche moderne deutsche Wiedergabe dieses hebräischen Volksnamens, ohne die korporative Bedeutung zu verändern.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinschaft
  rationale: עֵדָה bezeichnet die zusammengehörige beziehungsweise versammelte Gemeinschaft Israels. „Gemeinschaft“ ist im heutigen Deutsch klarer als „Gemeinde“ oder „Versammlung“ und כָּל wird mit „ganze“ wiedergegeben.
- source_word: הֹר הָהָר
  choice: Berg Hor
  rationale: Die ungewöhnliche hebräische Form lautet wörtlich etwa „Hor, der Berg“, fungiert hier jedoch als Ortsname. Die konventionelle deutsche Namensform „Berg Hor“ ist verständlich und sachgerecht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die appositionelle Formulierung „die Israeliten, die ganze Gemeinschaft“ bleibt erhalten und wird nicht zu einer einzigen geglätteten Bezeichnung zusammengezogen.
