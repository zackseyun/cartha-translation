  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: de
  text: Am Morgen nahm Balak Bileam mit und führte ihn hinauf nach Bamot-Baal[a]. Von dort sah er den äußersten Teil des Volkes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Höhen des Baal“, falls die Wendung beschreibend und nicht als Ortsname verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Von dort war nur der äußerste Teil Israels zu sehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Am nächsten Morgen
  rationale: Die hebräische Erzählungsformel führt das nächste Geschehen ein; im Deutschen gibt „Am nächsten Morgen“ den zeitlichen Fortgang natürlich wieder.
- source_word: וַיִּקַּח
  choice: nahm … mit
  rationale: לקח bedeutet grundsätzlich „nehmen“; im Zusammenhang bezeichnet es, dass Balak Bileam zu einem anderen Ort mitnimmt.
- source_word: וַיַּעֲלֵהוּ
  choice: führte ihn hinauf
  rationale: Der Hifil von עלה bezeichnet das Hinaufbringen. „Führte ihn hinauf“ bewahrt den kausativen Sinn und klingt im Deutschen natürlich.
- source_word: בָּמוֹת בָּעַל
  choice: Bamot-Baal
  rationale: Die Verbindung wird hier als Ortsname verstanden und daher entsprechend der deutschen Aussprache transliteriert; die mögliche beschreibende Deutung wird in einer Fußnote bewahrt.
- source_word: וַיַּרְא
  choice: er sah
  rationale: ראה ist das gewöhnliche Verb für „sehen“. Das nicht ausdrücklich genannte Subjekt ist im Zusammenhang am ehesten Bileam.
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Die Wendung bezeichnet schlicht den Standort, von dem aus Bileam das Volk sehen konnte.
- source_word: קְצֵה הָעָם
  choice: den äußersten Teil des Volkes
  rationale: קצה bezeichnet Rand, Ende oder äußersten Teil. Diese Wiedergabe bleibt bei „Volk“, ohne den im Hebräischen nicht ausdrücklich genannten Begriff „Lager“ einzuführen, und macht deutlich, dass nur ein Teil sichtbar war.
theological_decisions:
- issue: Das implizite Subjekt von וַיַּרְא
  choice: „er“ bezieht sich im Zusammenhang auf Bileam
  alternative: Bezug auf Balak
  rationale: Balak bringt Bileam auf die Anhöhe, damit dieser Israel sehen kann; grammatisch bleibt das Pronomen im Deutschen zwar unausgedeutet, der Kontext legt jedoch Bileam nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählfolge wird flüssig wiedergegeben; der Ortsname bleibt transliteriert, während echte lexikalische Mehrdeutigkeiten in den Fußnoten erhalten bleiben.
