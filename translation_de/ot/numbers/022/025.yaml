  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: de
  text: Als die Eselin den Engel Jahwes[a] sah, drängte sie sich gegen die Mauer und presste Bileams Fuß gegen die Mauer. Und er schlug sie wieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Boten Jahwes“. Das hebräische Wort kann sowohl „Bote“ als auch „Engel“ bedeuten; hier ist ein übernatürliches Wesen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: die Eselin
  rationale: Das hebräische אָתוֹן bezeichnet ausdrücklich eine weibliche Eselin; im Deutschen ist „Eselin“ natürlich und präzise.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann „Bote“ oder „Engel“ bedeuten. Da die Gestalt hier übernatürlich ist, steht im Haupttext „Engel“; die allgemeinere Bedeutung wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die geläufige deutsche Form.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: drängte sie sich an die Mauer
  rationale: Die Form beschreibt, wie sich die Eselin eng gegen die Mauer bewegt. „Sich an die Mauer drängen“ klingt im Deutschen natürlich und vermittelt die räumliche Enge.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: presste Bileams Fuß gegen die Mauer
  rationale: Das Verb bezeichnet hier das Einklemmen beziehungsweise feste Drücken des Fußes gegen die Mauer. „Presste“ gibt die Wirkung klar wieder.
- source_word: רֶגֶל
  choice: Fuß
  rationale: „Fuß“ ist in diesem Zusammenhang die naheliegende Bedeutung von רֶגֶל.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: Da schlug er sie wieder
  rationale: יָסַף mit Infinitiv bezeichnet die Wiederholung einer Handlung. „Wieder“ gibt dies knapp und idiomatisch wieder, ohne eine längere fortgesetzte Misshandlung in den Vers hineinzulesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מַלְאַךְ in מַלְאַךְ יְהוָה
  choice: Engel
  alternative: Bote
  rationale: Das Wort kann allgemein einen Boten bezeichnen; im Erzählzusammenhang handelt es sich jedoch eindeutig um ein übernatürliches Wesen. Die lexikalische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eselin“ bewahrt das im Hebräischen ausdrücklich weibliche Geschlecht. Die beiden Vorkommen von לחץ werden differenziert mit „sich drängen“ und „pressen“ wiedergegeben, um im Deutschen sowohl die Bewegung des Tieres als auch deren Wirkung auf Bileams Fuß natürlich auszudrücken.
