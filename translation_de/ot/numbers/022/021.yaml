  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַֽ/יַּחֲבֹ֖שׁ אֶת אֲתֹנ֑/וֹ וַ/יֵּ֖לֶךְ עִם שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: de
  text: Da stand Bileam am Morgen auf, sattelte seine Eselin und ging mit den Fürsten von Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand … auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet in der Erzählfolge das Aufstehen; im Deutschen ist „stand … auf“ natürlich und präzise.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Die Wendung bedeutet schlicht „am Morgen“; „früh am Morgen“ wäre eine nicht ausdrücklich markierte Verstärkung.
- source_word: וַיַּחֲבֹשׁ
  choice: sattelte
  rationale: חבש bezeichnet bei einem Reittier idiomatisch das Satteln beziehungsweise Herrichten zum Reiten.
- source_word: אֶת אֲתֹנוֹ
  choice: seine Eselin
  rationale: אָתוֹן bezeichnet ausdrücklich einen weiblichen Esel. Anders als im Englischen ist „Eselin“ im Deutschen eine geläufige, natürliche und erzählerisch passende Bezeichnung, sodass keine Fußnote nötig ist.
- source_word: וַיֵּלֶךְ
  choice: zog … mit
  rationale: הלך bezeichnet hier die Bewegung beziehungsweise Reise; zusammen mit עִם gibt „zog … mit“ den Aufbruch und die Begleitung in natürlichem Deutsch wieder.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet Begleitung.
- source_word: שָׂרֵי מוֹאָב
  choice: den Fürsten von Moab
  rationale: שָׂרִים kann hochrangige Amtsträger, Anführer oder Fürsten bezeichnen. „Fürsten“ bewahrt den gehobenen politisch-sozialen Rang und passt zum Erzählregister.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weibliche Form „Eselin“ bewahrt die lexikalische Genauigkeit des Hebräischen unmittelbar im Haupttext. „Da“ markiert knapp die fortlaufende Erzählsequenz des Wayyiqtol.
