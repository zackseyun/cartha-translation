  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ לָֽ/אָת֔וֹן כִּ֥י הִתְעַלַּ֖לְתְּ בִּ֑/י ל֤וּ יֶשׁ חֶ֨רֶב֙ בְּ/יָדִ֔/י כִּ֥י עַתָּ֖ה הֲרַגְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: de
  text: 'Und Bileam sagte zu der Eselin: „Weil du mich zum Gespött gemacht hast![a] Hätte ich doch ein Schwert in der Hand, dann hätte ich dich jetzt getötet.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil du mich verhöhnt hast“ bzw. „weil du so mit mir umgesprungen bist“. Das hebräische Verb kann eine misshandelnde, spöttische oder demütigende Behandlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „dann würde ich dich jetzt töten“. Die hebräische Formulierung verbindet einen unerfüllten Wunsch mit Bileams unmittelbarer Tötungsabsicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Gibt den fortschreitenden Erzählstil des hebräischen Wayyiqtol wieder, ohne die zeitliche Abfolge stärker auszudeuten.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Im Deutschen übliche biblische Namensform.
- source_word: לָאָתוֹן
  choice: zu der Eselin
  rationale: אָתוֹן bezeichnet ausdrücklich eine weibliche Eselin; anders als im Englischen ist „Eselin“ im Deutschen natürlich und präzise.
- source_word: כִּי
  choice: Weil
  rationale: Leitet in Bileams direkter Rede den Grund für seinen Zorn ein.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: du mich zum Gespött gemacht hast
  rationale: Der Hitpael von עלל kann eine misshandelnde, verhöhnende oder jemanden zum Narren machende Behandlung ausdrücken. Die gewählte Wendung erfasst hier besonders Bileams empfundene Demütigung.
- source_word: לוּ יֶשׁ חֶרֶב בְּיָדִי
  choice: Hätte ich doch ein Schwert in der Hand
  rationale: לוּ drückt einen unerfüllten Wunsch aus. Die deutsche Formulierung bewahrt sowohl diesen Wunschcharakter als auch das hebräische Bild des Schwertes in der Hand.
- source_word: כִּי עַתָּה
  choice: dann … jetzt
  rationale: 'Im Zusammenhang bezeichnet die Wendung die unmittelbare Folge der irrealen Voraussetzung: Bileam behauptet, er hätte die Eselin auf der Stelle getötet.'
- source_word: הֲרַגְתִּיךְ
  choice: hätte ich dich … getötet
  rationale: Das Perfekt steht im Zusammenhang mit לוּ in einer irrealen Aussage. Der deutsche Konjunktiv II der Vergangenheit bildet diese nicht verwirklichte Tötungsabsicht idiomatisch ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eselin“ bildet das im Hebräischen ausdrücklich weibliche Tier natürlich ab. Die direkte Rede bewahrt Bileams heftigen, impulsiven Ton; die syntaktische Spannung der irrealen Wunsch- und Folgekonstruktion bleibt erhalten.
