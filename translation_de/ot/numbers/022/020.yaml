  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: de
  text: 'In der Nacht kam Gott zu Bileam und sagte zu ihm: »Wenn die Männer gekommen sind, um dich zu rufen,[a] dann steh auf und geh mit ihnen. Doch nur das Wort[b], das ich zu dir reden werde, sollst du tun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn die Männer kamen, um dich zu holen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Sache«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bezeichnet hier in der fortlaufenden Erzählung Gottes Kommen zu Bileam. »Erschien« würde eine Erscheinungsform voraussetzen, die der Text nicht nennt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Vers verwendet אֱלֹהִים und nicht den Gottesnamen JHWH; diese Unterscheidung bleibt erhalten.
- source_word: לַיְלָה
  choice: in der Nacht
  rationale: Eine natürliche moderne Zeitangabe, die den nächtlichen Zeitpunkt genau wiedergibt.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: Wenn die Männer gekommen sind, um dich zu rufen
  rationale: Die Formulierung bewahrt den Bedingungssatz und gibt קרא לך eng am Wortlaut wieder. Die alternative Bedeutung »holen« wird in einer Fußnote genannt.
- source_word: קוּם לֵךְ
  choice: steh auf und geh
  rationale: Die beiden aufeinanderfolgenden Imperative werden in natürlichem, gegenwärtigem Deutsch als zweigliedriger Befehl wiedergegeben.
- source_word: אִתָּם
  choice: mit ihnen
  rationale: Direkte und eindeutige Wiedergabe der Präposition mit Pronominalsuffix.
- source_word: וְאַךְ
  choice: doch nur
  rationale: Die Verbindung bringt die strikte Einschränkung der zuvor erteilten Erlaubnis zum Ausdruck.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: Im Zusammenhang mit אֲדַבֵּר liegt »Wort« nahe und bewahrt den sprachlichen Bezug; die mögliche Bedeutung »Sache« wird in einer Fußnote festgehalten.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: das ich zu dir reden werde
  rationale: Das deutsche Futur gibt den hier naheliegenden Zukunftsbezug des hebräischen Imperfekts ausdrücklich wieder.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: sollst du tun
  rationale: »Sollst« wahrt den verbindlichen Befehlston; die Voranstellung von »nur das Wort« erhält die Hervorhebung des Objekts.
theological_decisions:
- issue: Gottesbezeichnung in diesem Vers
  choice: Gott
  alternative: der HERR
  rationale: Der hebräische Text hat ausdrücklich אֱלֹהִים und nicht JHWH. Die Übersetzung harmonisiert die Bezeichnung daher nicht mit benachbarten Versen.
- issue: Reichweite der göttlichen Erlaubnis
  choice: Die Erlaubnis zum Mitgehen wird durch »doch nur« unmittelbar eingeschränkt.
  alternative: Eine uneingeschränkte Erlaubnis, bei der die folgende Anweisung lediglich ergänzend wäre.
  rationale: 'וְאַךְ kennzeichnet eine deutliche Einschränkung: Bileam darf mitgehen, soll aber ausschließlich das von Gott Gesagte ausführen.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Imperative bleiben direkt, ohne altertümliches »Erhebe dich«. Die Wortstellung im letzten Satz bewahrt die Einschränkung und die Hervorhebung des göttlichen Wortes.
