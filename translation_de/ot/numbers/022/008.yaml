source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: de
  text: 'Da sagte er zu ihnen: „Bleibt diese Nacht hier. Ich werde euch dann Nachricht geben, entsprechend dem, was Jahwe zu mir sagen wird.“ Da blieben die Obersten Moabs bei Bileam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: Bleibt diese Nacht hier
  rationale: Der pluralische Imperativ von לון/לין fordert die Gesandten auf, über Nacht dortzubleiben. Die Formulierung ist natürliches modernes Deutsch und bewahrt Orts- und Zeitangabe.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: Ich werde euch dann die Antwort überbringen
  rationale: Die Verbindung des Hifil von שוב mit דָּבָר bezeichnet das Zurückbringen beziehungsweise Übermitteln einer Antwort. „Überbringen“ wahrt das Bild der weitergegebenen Botschaft, ohne unnatürlich wörtlich zu klingen.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: die Jahwe mir gibt
  rationale: כַּאֲשֶׁר drückt die Entsprechung zwischen Gottes Mitteilung und Bileams Antwort aus. Im Deutschen wird der Sinn idiomatisch wiedergegeben, ohne den Inhalt der erwarteten Rede näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֵּשְׁבוּ
  choice: da blieben
  rationale: ישב kann grundsätzlich „sitzen“ oder „wohnen“ bedeuten; nach der Aufforderung zur Übernachtung bezeichnet es hier kontextgemäß das Bleiben.
- source_word: שָׂרֵי מוֹאָב
  choice: die führenden Männer Moabs
  rationale: שָׂרִים kann Fürsten, Amtsträger oder Anführer bezeichnen. Die gewählte Formulierung bewahrt den hohen Rang, ohne eine erbliche Fürstenwürde festzulegen.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Transliteration wahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ bleibt eine mögliche Lesekonvention, wird hier aber nicht in den Haupttext übernommen.
- issue: Art der erwarteten göttlichen Mitteilung
  choice: die Antwort, die Jahwe mir gibt
  alternative: entsprechend dem, was Jahwe zu mir reden wird
  rationale: Die Übersetzung macht die Mitteilung als Grundlage von Bileams Antwort verständlich, ohne zu entscheiden, ob sie Zustimmung, Ablehnung oder eine andere Weisung enthalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich; „führende Männer“ vermeidet sowohl das heute missverständliche „Fürsten“ als auch das bürokratisch klingende „Beamte“.
