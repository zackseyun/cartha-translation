source:
  edition: WLC
  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: de
  text: 'Und nun, komm bitte und verfluche mir dieses Volk, denn es ist stärker als ich. Vielleicht kann ich es bewirken, dass wir es schlagen und aus dem Land vertreiben. Denn ich weiß: Wen du segnest, der ist gesegnet, und wen du verfluchst, der ist verflucht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Darum … jetzt
  rationale: Die Wendung markiert den folgernden Übergang zu Balaks dringender Bitte; „Darum … jetzt“ gibt sowohl den Zusammenhang als auch die Unmittelbarkeit natürlich wieder.
- source_word: לְכָה נָּא
  choice: komm … bitte
  rationale: Der Imperativ mit der Höflichkeits- bzw. Bittepartikel נָא wird in gegenwärtigem Deutsch angemessen mit „komm … bitte“ wiedergegeben.
- source_word: אָרָה לִּי
  choice: verfluche mir
  rationale: אָרָה bezeichnet das Aussprechen bzw. Herbeiführen eines Fluches. Der ethische Dativ „mir“ bewahrt knapp Balaks persönliches Interesse, das לִּי ausdrückt.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: „Dieses Volk“ entspricht dem singularischen Kollektiv und bewahrt den distanzierenden Ton.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: denn es ist stärker als ich
  rationale: Die komparative Konstruktion wird unmittelbar wiedergegeben; das singularische „es“ nimmt das Kollektiv „Volk“ auf.
- source_word: אוּלַי אוּכַל
  choice: Vielleicht gelingt es mir dann
  rationale: Die Formulierung bewahrt Unsicherheit und Fähigkeit. „Dann“ verdeutlicht natürlich den erhofften Zusammenhang mit dem Fluch, ohne dessen Wirksamkeit als Erzählerbehauptung festzuschreiben.
- source_word: נַכֶּה בּוֹ
  choice: es zu schlagen
  rationale: נכה bedeutet zunächst „schlagen“; die offenere Bedeutung wird gegenüber dem deutenderen „besiegen“ bewahrt. Das Pronomen bleibt wie im Hebräischen singularisch und kollektiv.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: und aus dem Land zu vertreiben
  rationale: גרש bezeichnet das Vertreiben oder Ausstoßen; „aus dem Land“ ist im territorialen Zusammenhang idiomatisch und nah am Ausgangstext.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: Wen du segnest, der ist gesegnet
  rationale: Die deutsche Korrelativkonstruktion gibt die generische Relativform und den resultativen/passiven Zustand prägnant wieder.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: und wen du verfluchst, der ist verflucht
  rationale: Die parallele Form zum Segenssatz bleibt erhalten, ebenso die passive bzw. resultative Aussage von יוּאָר.
theological_decisions:
- issue: Status von Bileams behaupteter Segens- und Fluchmacht
  choice: Die Aussage bleibt als Balaks Überzeugung formuliert, ohne sie erzählerisch zu bestätigen.
  alternative: Die Formulierung könnte so erweitert werden, dass Gott allein Fluch und Segen wirksam macht.
  rationale: Der Vers berichtet Balaks Begründung. Eine dogmatische Erläuterung im Text würde über die Aussage des hebräischen Verses hinausgehen und die Spannung der Erzählung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der singularische Kollektivbezug von „Volk“ wird konsequent mit „es“ bewahrt. Die Satzstruktur bleibt klar und mündlich dringlich, ohne archaische Wörter wie „verwünschen“ oder „schmähen“.
