  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: de
  text: 'Und Moab sagte zu den Ältesten von Midian: »Nun wird diese Versammlung alles rings um uns ablecken, wie ein Rind das Grün des Feldes ableckt.« Balak, der Sohn Zippors, war zu jener Zeit König von Moab.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹאָב
  choice: Moab
  rationale: Der Volks- und Landesname wird wie im Hebräischen personifiziert als sprechendes Subjekt gebraucht.
- source_word: זִקְנֵי מִדְיָן
  choice: die Ältesten von Midian
  rationale: Transparente Wiedergabe der Constructusverbindung; im modernen Deutschen natürlich und würdig.
- source_word: עַתָּה
  choice: Nun
  rationale: Gibt sowohl den unmittelbaren Zeitbezug als auch die besorgte Folgerung in der Rede wieder.
- source_word: יְלַחֲכוּ / כִּלְחֹךְ
  choice: ablecken / ableckt
  rationale: Bewahrt die Wiederholung derselben hebräischen Wurzel und das anschauliche Bild des Vergleichs.
- source_word: הַקָּהָל
  choice: diese ganze Versammlung
  rationale: Bezeichnet die versammelte Gemeinschaft Israels; »ganze« macht den kontextuell hinweisenden und kollektiv bedrohlichen Sinn im Deutschen natürlich, ohne den Ausdruck auf bloße Menge zu reduzieren.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: alles rings um uns
  rationale: Idiomatische und zugleich genaue Wiedergabe von wörtlich »alles in unserer Umgebung«.
- source_word: הַשּׁוֹר
  choice: ein Rind
  rationale: Der hebräische Gattungsbegriff bezeichnet ein Tier der Rindergattung; der deutsche unbestimmte Artikel gibt den generischen Vergleich natürlich wieder.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: das Grün auf dem Feld
  rationale: »Grün« wahrt den breiten Bezug auf grüne Vegetation, ohne ihn unnötig auf Gras einzuengen; »auf dem Feld« ist modernes idiomatisches Deutsch.
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: Balak aber, der Sohn Zippors
  rationale: Das Waw leitet hier eine Hintergrundangabe ein; »aber« markiert den Übergang, ohne eine starke Gegensätzlichkeit zu behaupten.
- source_word: מֶלֶךְ לְמוֹאָב בָּעֵת הַהִוא
  choice: war zu jener Zeit König von Moab
  rationale: Direkte, natürliche Wiedergabe der prädikativen und zeitlichen Angabe.
