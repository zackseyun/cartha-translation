  text: וַ/יֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְ/זִקְנֵ֣י מִדְיָ֔ן וּ/קְסָמִ֖ים בְּ/יָדָ֑/ם וַ/יָּבֹ֨אוּ֙ אֶל בִּלְעָ֔ם וַ/יְדַבְּר֥וּ אֵלָ֖י/ו דִּבְרֵ֥י בָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: de
  text: Da machten sich die Ältesten von Moab und die Ältesten von Midian auf den Weg. Sie hatten den Lohn für die Wahrsagung[a] bei sich. Sie kamen zu Bileam und sagten ihm Balaks Worte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wahrsagemittel in den Händen“. Der hebräische Ausdruck kann Wahrsagungen oder dafür verwendete Mittel bezeichnen; im Zusammenhang ist wahrscheinlich die Bezahlung für die Wahrsagung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: die Ältesten von
  rationale: Die Konstruktverbindung bezeichnet die anerkannten Ältesten beziehungsweise ranghohen Vertreter eines Volkes; „Älteste“ bewahrt die soziale und politische Funktion.
- source_word: וּקְסָמִים בְּיָדָם
  choice: Sie hatten den Lohn für die Wahrsagung bei sich
  rationale: קְסָמִים kann Wahrsagungen, Wahrsagemittel oder metonymisch die dafür bestimmte Bezahlung bezeichnen. Im Erzählzusammenhang liegt die Bezahlung nahe; „bei sich“ gibt das hebräische „in ihrer Hand“ idiomatisch wieder.
- source_word: וַיָּבֹאוּ אֶל
  choice: Sie kamen zu
  rationale: בוא mit אֶל bedeutet „zu jemandem kommen“ beziehungsweise „bei jemandem eintreffen“ und führt die zuvor begonnene Reise fort.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: überbrachten ihm
  rationale: Wörtlich steht „sie redeten zu ihm“. In Verbindung mit „Balaks Worten“ bringt „überbrachten“ den Auftrag natürlich zum Ausdruck, ohne den Inhalt näher festzulegen.
- source_word: דִּבְרֵי בָלָק
  choice: Balaks Worte
  rationale: Die Formulierung bleibt nahe an der hebräischen Konstruktverbindung und lässt offen, ob es sich um genaue Worte oder eine ausgerichtete Botschaft handelt.
- source_word: וַיֵּלְכוּ
  choice: Da machten sich ... auf den Weg
  rationale: Das narrative וַ führt die Folgehandlung weiter. Die deutsche Wendung bezeichnet den Aufbruch natürlich und verhindert eine ungeschickte Wiederholung mit dem anschließenden „kamen“.
theological_decisions:
- issue: Bedeutung von קְסָמִים בְּיָדָם
  choice: Im Haupttext als Bezahlung für die Wahrsagung verstanden
  alternative: Wahrsagungen, Wahrsagemittel oder Omen in ihren Händen
  rationale: Der Zusammenhang einer Gesandtschaft zu dem Wahrsager Bileam spricht eher für ein mitgebrachtes Honorar. Da die hebräische Formulierung dies nicht eindeutig festlegt, wird die sachliche Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze Sätze bilden die hebräische Handlungsfolge klar ab; „Wahrsagung“ bewahrt die negative beziehungsweise fremdreligiöse Praxis, ohne sie konfessionell auszudeuten.
