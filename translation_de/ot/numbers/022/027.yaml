source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: de
  text: Als die Eselin den Engel Jahwes[a] sah, legte sie sich unter Bileam nieder. Da wurde Bileam zornig und schlug die Eselin mit seinem Stock.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Boten Jahwes“. Das hebräische Wort kann sowohl „Bote“ als auch „Engel“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: die Eselin
  rationale: אָתוֹן bezeichnet ausdrücklich einen weiblichen Esel. „Eselin“ ist im Deutschen natürlich und bewahrt diese Angabe direkt.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Da hier ein übernatürlicher Bote gemeint ist, passt „Engel“ im Haupttext am besten; die allgemeinere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַתִּרְבַּץ
  choice: legte sie sich nieder
  rationale: רבץ bedeutet „sich hinlegen, lagern, niederkauern“. „Sich niederlegen“ gibt die Bewegung der Eselin in diesem Zusammenhang klar und ohne zusätzliche Deutung wieder.
- source_word: תַּחַת בִּלְעָם
  choice: unter Bileam
  rationale: תַּחַת bedeutet „unter, unterhalb“. Da Bileam auf der Eselin sitzt, ist die knappe räumliche Wiedergabe „unter Bileam“ sachgerecht.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: Da wurde Bileam zornig
  rationale: Die hebräische Wendung beschreibt wörtlich das Entbrennen des Zorns. Die moderne deutsche Formulierung bewahrt den Sinn und den Eintritt der Reaktion.
- source_word: וַיַּךְ
  choice: schlug
  rationale: נכה bezeichnet hier das Schlagen der Eselin. „Schlug“ ist direkt und entspricht der einmaligen Verbform, ohne eine wiederholte Misshandlung ausdrücklich einzutragen.
- source_word: בַּמַּקֵּל
  choice: mit seinem Stock
  rationale: מַקֵּל kann einen Stock oder Stab bezeichnen. Beim Schlagen eines Tieres ist „Stock“ im Deutschen natürlich; „seinem“ macht den aus dem Zusammenhang erschlossenen Besitzer idiomatisch deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen יהוה. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Bedeutungsumfang von מַלְאָךְ
  choice: Engel
  alternative: Bote
  rationale: Das Wort kann allgemein einen Boten bezeichnen; im Erzählzusammenhang handelt es sich jedoch um einen übernatürlichen Boten Gottes. Die Fußnote hält die lexikalische Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die spezifisch weibliche Tierbezeichnung wird durch „Eselin“ unmittelbar bewahrt; die Mehrdeutigkeit von מַלְאָךְ bleibt durch die Fußnote sichtbar.
