  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: de
  text: Denn ich werde dich überaus ehren[a] und alles tun, was du mir sagst. So komm doch und verfluche dieses Volk für mich!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde dich ganz gewiss sehr ehren“; dem Zusammenhang nach auch: „Ich werde dich reich belohnen“. Im Hebräischen wird die Verbform durch einen vorangestellten absoluten Infinitiv nachdrücklich verstärkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Balaks Versprechen als Begründung für seine erneute Bitte ein und entspricht dem hebräischen Zusammenhang natürlich.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: ich werde dich sehr hoch ehren
  rationale: Die Verbindung aus absolutem Infinitiv und finitem Verb verstärkt die Zusage. „Sehr hoch ehren“ bewahrt die Ehrensprache der Wurzel כבד und gibt die Intensivierung samt מְאֹד in natürlichem Deutsch wieder.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: und alles tun, was du mir sagst
  rationale: Gibt den umfassenden Sinn von כֹל אֲשֶׁר wieder und folgt zugleich einer natürlichen deutschen Wortstellung.
- source_word: וּלְכָה נָּא
  choice: So komm doch
  rationale: Der Bewegungsimperativ wird direkt wiedergegeben; „doch“ vermittelt die bittende und zugleich drängende Nuance von נָא. „So“ verbindet die Aufforderung mit dem vorausgehenden Versprechen.
- source_word: קָבָה
  choice: verfluche
  rationale: Bezeichnet in diesem Zusammenhang das Aussprechen beziehungsweise Herbeiführen eines Fluches; „verfluchen“ ist die klare, knappe deutsche Entsprechung.
- source_word: לִּי
  choice: für mich
  rationale: Bewahrt Balaks persönliches Interesse und den Zweck der erbetenen Handlung.
- source_word: אֵת הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Gibt das singularische Kollektiv עָם im Deutschen idiomatisch und genau wieder.
