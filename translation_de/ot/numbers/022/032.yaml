  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: de
  text: 'Und der Engel Jahwes sagte zu ihm: „Warum hast du deine Eselin diese drei Male geschlagen? Sieh, ich bin als Gegner[a] herausgetreten, denn dein Weg ist vor mir verkehrt[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שָׂטָן bedeutet hier »Gegner« oder »Widersacher«; es ist nicht notwendig der Eigenname »Satan«.
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »verkehrt« wiedergegebene hebräische Verb ist selten und in seiner Bedeutung unsicher; möglich sind auch Bedeutungen wie »überstürzt«, »leichtsinnig« oder »entgegengerichtet«.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten; hier bezeichnet es das übernatürliche Wesen, das Bileam auf dem Weg entgegentritt. Der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: עַל מָה
  choice: Warum
  rationale: Natürliche deutsche Wiedergabe der hebräischen Frage nach dem Grund.
- source_word: הִכִּיתָ אֶת אֲתֹנְךָ
  choice: hast du deine Eselin geschlagen
  rationale: נכה bedeutet »schlagen«; אֲתוֹן bezeichnet ausdrücklich eine weibliche Eselin, was im Deutschen natürlich wiedergegeben werden kann.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: diese drei Mal
  rationale: Die hebräische Wendung bezeichnet idiomatisch drei Gelegenheiten beziehungsweise dreimaliges Handeln.
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: Sieh, ich bin herausgetreten
  rationale: »Sieh« erhält den aufmerksamkeitslenkenden Nachdruck von הִנֵּה; »bin herausgetreten« folgt dem Bewegungsverb und passt zur Konfrontation auf dem Weg.
- source_word: לְשָׂטָן
  choice: als Gegner
  rationale: שָׂטָן ist hier ein Gattungsbegriff für einen Gegner oder Widersacher, nicht notwendig der Eigenname »Satan«.
- source_word: יָרַט הַדֶּרֶךְ לְנֶגְדִּי
  choice: dein Weg ist vor mir verkehrt
  rationale: Das seltene Verb ירט ist unsicher. »Verkehrt« bringt die negative Beurteilung von Bileams Vorgehen zum Ausdruck, ohne die mögliche Bedeutung zu eng festzulegen; »vor mir« bewahrt die räumlich-wertende Spannung von לְנֶגְדִּי.
theological_decisions:
- issue: Bedeutung von לְשָׂטָן
  choice: 'Gattungsbegriff: »als Gegner«'
  alternative: »als Satan« als Name oder Titel
  rationale: Im Zusammenhang stellt sich der Engel Jahwes Bileam entgegen. Die Wiedergabe als Eigenname würde eine spätere dämonologische Bedeutung in den Text hineintragen.
- issue: Bewertung von Bileams Weg durch יָרַט
  choice: »verkehrt«
  alternative: »überstürzt«, »leichtsinnig« oder »mir zuwider«
  rationale: Da das Verb selten und seine genaue Bedeutung umstritten ist, wird eine breite negative Wertung gewählt und die Unsicherheit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Eselin« bewahrt die im Hebräischen ausdrücklich genannte weibliche Form. Die direkte Rede bleibt knapp und eindringlich; zwei Fußnoten machen echte lexikalische Unsicherheiten sichtbar.
