base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: de
  text: 'Sie kamen zu Bileam und sagten zu ihm: »So spricht Balak, der Sohn Zippors: Halte dich bitte nicht davon zurück, zu mir zu kommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: Sie kamen zu Bileam
  rationale: בוא bezeichnet hier das Kommen beziehungsweise Eintreffen der Boten bei Bileam; die deutsche Wendung gibt die gerichtete Bewegung natürlich wieder.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: und sagten zu ihm
  rationale: Die Wiedergabe bewahrt sowohl die Redeeinleitung als auch das hebräische indirekte Objekt.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird im Deutschen idiomatisch und würdevoll mit dem Präsens wiedergegeben.
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: Balak, der Sohn Zippors
  rationale: Die Eigennamen werden in ihrer etablierten deutschen biblischen Form wiedergegeben; das Konstruktverhältnis wird natürlich ausgedrückt.
- source_word: אַל־נָא
  choice: Bitte … nicht
  rationale: אַל markiert die Verneinung der Aufforderung, während נָא ihren bittenden, eindringlichen Ton ausdrückt.
- source_word: תִמָּנַע מֵהֲלֹךְ
  choice: lass dich nicht davon abhalten, … zu kommen
  rationale: מנע mit der Präposition מן und dem Infinitiv bezeichnet, dass jemand vom Vollzug einer Handlung abgehalten wird oder sich davon zurückhält. Die reflexiv-passive deutsche Form wahrt den Sinn, ohne vorschnell zwischen äußerem Hindernis und eigener Weigerung zu entscheiden.
- source_word: אֵלָי
  choice: zu mir
  rationale: Die Richtungspräposition mit Suffix der ersten Person bezeichnet das Ziel der Bewegung.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die Botenformel »So spricht« bleibt bewusst formell; »Bitte« gibt den höflich-eindringlichen Partikelgebrauch wieder. Die Formulierung ist verständlich und bewahrt die mögliche Bedeutungsbreite von מנע.
