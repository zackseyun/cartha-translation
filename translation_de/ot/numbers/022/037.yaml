  text: וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם הֲ/לֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לִ/קְרֹא לָ֔/ךְ לָ֥/מָּה לֹא הָלַ֖כְתָּ אֵלָ֑/י הַֽ/אֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: de
  text: 'Und Balak sagte zu Bileam: „Habe ich nicht ausdrücklich nach dir gesandt, um dich zu rufen?[a] Warum bist du nicht zu mir gekommen?[b] Kann ich dich etwa nicht ehren?“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Habe ich nicht nachdrücklich zu dir gesandt, um dich zu rufen?“ Die hebräische Verbindung eines Infinitivus absolutus mit dem finiten Verb verstärkt die Aussage; im Zusammenhang kann sie auch als wiederholtes oder dringliches Senden verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Warum bist du nicht zu mir gegangen?“'
    reason: lexical_alternative
  - marker: c
    text: „Ehren“ kann hier auch bedeuten, jemanden zu belohnen oder ihm einen hohen Rang zu verleihen, nicht nur ihm Achtung zu erweisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die übliche deutsche Wiedergabe des narrativen Wayyiqtol bewahrt den fortlaufenden Erzählfluss.
- source_word: הֲלֹא שָׁלֹחַ שָׁלַחְתִּי אֵלֶיךָ
  choice: Habe ich nicht ausdrücklich nach dir gesandt
  rationale: Die rhetorische Frage erwartet Zustimmung. „Ausdrücklich“ gibt die Verstärkung durch Infinitivus absolutus und finites Verb wieder, ohne zwingend eine wiederholte oder dringliche Sendung zu behaupten. „Nach dir senden“ ist im Deutschen für das Herbeirufen einer Person idiomatisch.
- source_word: לִקְרֹא לָךְ
  choice: um dich rufen zu lassen
  rationale: קרא bezeichnet hier das Herbeirufen bzw. Vorladen Bileams; die Formulierung passt dazu, dass Balak Boten entsandt hatte.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: Warum bist du nicht zu mir gekommen?
  rationale: הלך bedeutet grundsätzlich „gehen“, doch aus der Perspektive des Sprechers ist bei אֵלָי im Deutschen „zu mir kommen“ idiomatisch.
- source_word: הַאֻמְנָם לֹא אוּכַל כַּבְּדֶךָ
  choice: Kann ich dich etwa nicht ehren?
  rationale: „Etwa“ vermittelt den ungläubig-vorwurfsvollen Ton der emphatischen Frage. יכל bezeichnet Fähigkeit; כבד im Piel das Erweisen bzw. Verleihen von Ehre.
- source_word: כַּבְּדֶךָ
  choice: dich ehren
  rationale: Die breite Bedeutung bleibt erhalten; im Kontext kann die Ehrung auch Belohnung, Reichtum oder hohen Rang einschließen, ohne darauf verengt zu werden.
theological_decisions: []
