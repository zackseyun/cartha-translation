source:
  edition: WLC
  text: וַ/יַּ֥רְא בָּלָ֖ק בֶּן צִפּ֑וֹר אֵ֛ת כָּל אֲשֶׁר עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽ/אֱמֹרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: de
  text: Balak, der Sohn Zippors, sah alles, was Israel den Amoritern[a] angetan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dem Amoriter«; der hebräische Singular bezeichnet hier das Volk als Ganzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das Wayyiqtol führt die Erzählung weiter; das schlichte Präteritum ist im Deutschen die natürliche Erzählform. Ein zusätzliches »Nun« oder »Da« ist nicht erforderlich.
- source_word: בָּלָק בֶּן צִפּוֹר
  choice: Balak, der Sohn Zippors
  rationale: Die Namen folgen der üblichen deutschen Bibelschreibung; die Apposition gibt die hebräische Abstammungsangabe natürlich und eindeutig wieder.
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles, was
  rationale: Diese idiomatische deutsche Wendung gibt die Gesamtheit des folgenden direkten Objekts wieder.
- source_word: עָשָׂה יִשְׂרָאֵל לָאֱמֹרִי
  choice: was Israel den Amoritern angetan hatte
  rationale: Das Plusquamperfekt markiert natürlich, dass Israels Handeln Balaks Wahrnehmung vorausging. »Jemandem etwas antun« gibt עשה mit ל in diesem Kontext idiomatisch wieder, ohne die konkreten Ereignisse über den Kontext hinaus auszumalen.
- source_word: לָאֱמֹרִי
  choice: den Amoritern
  rationale: Der hebräische Singular bezeichnet das Volk kollektiv; im modernen Deutschen ist dafür der ethnische Plural natürlich.
theological_decisions: []
