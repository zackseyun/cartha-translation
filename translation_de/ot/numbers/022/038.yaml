  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: de
  text: 'Und Bileam sagte zu Balak: »Sieh, nun bin ich zu dir gekommen. Kann ich denn überhaupt irgendetwas sagen?[a] Was Gott mir in den Mund legt, das allein werde ich sagen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bin ich denn wirklich imstande, irgendetwas zu sagen?« Das Hebräische verstärkt hier den Gedanken des Könnens beziehungsweise der Vollmacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die hinweisende und nachdrückliche Funktion in würdigem, verständlichem Gegenwartsdeutsch.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: nun bin ich zu dir gekommen
  rationale: Gibt das Perfekt zusammen mit עַתָּה natürlich wieder und betont Bileams nun erfolgte Ankunft.
- source_word: הֲיָכוֹל אוּכַל
  choice: Kann ich denn überhaupt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Frage nach Bileams Fähigkeit beziehungsweise Vollmacht.
- source_word: דַּבֵּר מְאוּמָה
  choice: irgendetwas sagen
  rationale: מְאוּמָה bezeichnet in der rhetorischen Frage irgendetwas, auch nur das Geringste; die Formulierung ist natürlich und erhält den umfassenden Sinn.
- source_word: הַדָּבָר
  choice: Was
  rationale: Das substantivierte Relativgefüge gibt הַדָּבָר אֲשֶׁר im Deutschen idiomatisch wieder, ohne den Inhalt der göttlich gegebenen Rede näher festzulegen.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: Gott mir in den Mund legt
  rationale: Bewahrt das hebräische Bild für von Gott vorgegebene Rede in einer geläufigen deutschen Wendung.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: das werde ich sagen
  rationale: Das vorangestellte Objekt wird durch das Korrelat »das« hervorgehoben und macht deutlich, dass Bileam genau das von Gott Gegebene aussprechen wird.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das zugehörige Verb steht im Singular, und im Kontext ist der eine Gott als Urheber der Rede gemeint.
theological_decisions:
- issue: Göttliche Begrenzung von Bileams Rede
  choice: Bileam stellt rhetorisch infrage, ob er aus eigener Vollmacht überhaupt etwas sagen kann, und bindet seine Rede an das, was Gott ihm in den Mund legt.
  alternative: Bileam könnte frei reden und entschiede sich lediglich freiwillig zur Beschränkung.
  rationale: Die emphatische Konstruktion הֲיָכוֹל אוּכַל und die Hervorhebung von אֹתוֹ zeigen eine starke Begrenzung seiner Rede. Die Übersetzung bewahrt diese Spannung, ohne die Wirkungsweise göttlicher Eingebung dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sieh« erhält den deiktischen Nachdruck, ohne das altertümlichere »Siehe« zu verwenden. Die rhetorische Frage bleibt als Frage stehen; die anschließende Korrelatkonstruktion »Was …, das …« bildet die Hervorhebung des hebräischen Objekts natürlich ab.
