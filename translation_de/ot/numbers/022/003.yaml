  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֨גָר מוֹאָ֜ב מִ/פְּנֵ֥י הָ/עָ֛ם מְאֹ֖ד כִּ֣י רַב ה֑וּא וַ/יָּ֣קָץ מוֹאָ֔ב מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: de
  text: Und Moab fürchtete sich sehr vor dem Volk, weil es zahlreich war; und Moab empfand Grauen vor den Israeliten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „vor den Söhnen Israels“. Das hebräische Verb kann auch ausdrücken, dass Moab die Israeliten verabscheute oder ihrer überdrüssig war; im Zusammenhang steht angstvolles Grauen im Vordergrund.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: fürchtete sich sehr
  rationale: Das Verb גור bezeichnet hier Furcht oder Angst; zusammen mit מְאֹד gibt „fürchtete sich sehr“ die Intensität natürlich und präzise wieder.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Präposition bezeichnet in diesem Zusammenhang den Anlass beziehungsweise Gegenstand der Furcht; deutsches „vor“ ist idiomatisch und bewahrt die räumlich-kausale Bildlichkeit.
- source_word: הָעָם
  choice: dem Volk
  rationale: Das kollektive Singularwort bezeichnet Israel als Volk; der deutsche Singular entspricht der hebräischen Form.
- source_word: כִּי רַב הוּא
  choice: weil es so zahlreich war
  rationale: Das singularische Pronomen bezieht sich auf das Kollektiv „Volk“. „Zahlreich“ gibt רַב im Kontext einer großen Bevölkerungsmenge wieder; „so“ vermittelt die hervorgehobene Größe natürlich.
- source_word: וַיָּקָץ
  choice: graute
  rationale: קוץ kann Abscheu, Bedrängnis oder von Widerwillen geprägtes Entsetzen ausdrücken. „Moab graute vor“ bewahrt die starke, körperlich gefärbte Furcht, ohne die Mehrdeutigkeit einseitig auf Ekel festzulegen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Wörtlich steht „Söhne Israels“. Als feste Volksbezeichnung ist „Israeliten“ im modernen Deutschen natürlich und schließt hier das gesamte Volk ein.
- source_word: מוֹאָב
  choice: Moab
  rationale: Übliche deutsche Wiedergabe des Orts- und Volksnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Moab“ und die zweifache Reaktion des Volkes bleiben erhalten. „Graute“ ist bewusst etwas gehoben, aber allgemein verständlich und bildet die starke, mehrdeutige Gefühlsreaktion knapp ab.
