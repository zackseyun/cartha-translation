source:
  edition: WLC
  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: de
  text: Sieh, das Volk, das aus Ägypten ausgezogen ist, hat die sichtbare Oberfläche des Landes bedeckt.[a] Komm nun, verfluche es für mich. Vielleicht kann ich gegen dieses Volk kämpfen und es vertreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „das Auge des Landes“. Gemeint ist die sichtbare Oberfläche des Landes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Partikel lenkt mit Nachdruck die Aufmerksamkeit auf die folgende Meldung. „Siehe“ ist im Deutschen würdevoll und als biblisches Aufmerksamkeitssignal verständlich.
- source_word: הָעָם
  choice: das Volk
  rationale: Der kollektive Singular bezeichnet Israel als Volksgemeinschaft; „das Volk“ wahrt zugleich den Numerus der hebräischen Bezugsausdrücke.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: das aus Ägypten ausgezogen ist
  rationale: Das determinierte Partizip kennzeichnet das Volk durch den Exodus. Ein deutscher Relativsatz gibt diese Funktion natürlich wieder.
- source_word: וַיְכַס
  choice: hat … bedeckt
  rationale: Das Verb beschreibt eine Handlung mit gegenwärtig sichtbarem Ergebnis. Das Perfekt ist im modernen Deutsch dafür natürlich und stimmt mit dem kollektiven Singular „Volk“ überein.
- source_word: עֵין הָאָרֶץ
  choice: die ganze sichtbare Fläche des Landes
  rationale: Wörtlich steht „das Auge des Landes“. Gemeint ist idiomatisch dessen sichtbare Oberfläche. „Die ganze sichtbare Fläche“ vermittelt das Bild verständlich; die wörtliche Form wird in der Fußnote bewahrt.
- source_word: עַתָּה
  choice: nun
  rationale: Das Wort markiert den dringlichen Übergang von der Lagebeschreibung zur Aufforderung.
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ ist eine nachdrückliche Aufforderungsformel. „Komm“ entspricht der Perspektive des Sprechers und klingt im Deutschen natürlich.
- source_word: קָבָה
  choice: verfluche
  rationale: Das Verb bezeichnet ausdrücklich das Aussprechen eines Fluches; „verfluchen“ erhält diese klare Bedeutung.
- source_word: לִּי
  choice: für mich
  rationale: 'Der Dativ bezeichnet den Begünstigten: Bileam soll in Balaks Interesse handeln.'
- source_word: אֹתוֹ
  choice: es
  rationale: Das maskuline Singularpronomen bezieht sich auf den kollektiven Singular „Volk“. Im Deutschen ist die Wiederaufnahme mit dem neutralen „es“ grammatisch und semantisch natürlich.
- source_word: אוּלַי אוּכַל
  choice: Vielleicht kann ich
  rationale: Die Verbindung drückt eine unsichere Möglichkeit beziehungsweise Hoffnung aus. „Vielleicht kann ich“ ist knapp und bewahrt den vorläufigen Charakter.
- source_word: לְהִלָּחֶם בּוֹ
  choice: gegen es kämpfen
  rationale: Die Konstruktion bezeichnet den Kampf gegen das zuvor genannte Volk. Die Präposition „gegen“ macht die gegnerische Beziehung klar.
- source_word: וְגֵרַשְׁתִּיו
  choice: und es vertreiben
  rationale: Nach dem Modalverb „kann“ wird das zweite, koordinierte Vorhaben im Deutschen natürlich als weiterer Infinitiv verstanden. „Vertreiben“ gibt das gewaltsame Entfernen aus dem Land wieder.
