- from: Siehe, das Volk, das aus Ägypten ausgezogen ist, hat die ganze sichtbare Fläche des Landes bedeckt.[a] Komm nun und verfluche es für mich! Vielleicht kann ich gegen es kämpfen und es vertreiben.
  to: Sieh, das Volk, das aus Ägypten ausgezogen ist, hat die sichtbare Oberfläche des Landes bedeckt.[a] Komm nun, verfluche es für mich. Vielleicht kann ich gegen dieses Volk kämpfen und es vertreiben.
  rationale: Die Revision entfernt die nicht im Ausgangstext ausgedrückte Totalisierung „ganze“, glättet die anaphorische Formulierung beim Kampf gegen das Volk und modernisiert die Aufmerksamkeitspartikel behutsam. Die Bildsprache und ihre Erläuterung in der Fußnote bleiben erhalten.
