    issue: „ganze“ in „die ganze sichtbare Fläche des Landes“
    rationale: Das hebräische Idiom lautet wörtlich „das Auge des Landes“ und meint dessen sichtbare Oberfläche/sein Angesicht. Eine Aussage über die gesamte Fläche wird dadurch nicht explizit gemacht; „ganze“ sollte daher entfallen.
  - severity: low
    issue: „gegen es kämpfen“
    rationale: Die Form bewahrt zwar den kollektiven Singular, ist im modernen Deutsch bei einem Volk als Gegner jedoch unnatürlich. „gegen dieses Volk kämpfen“ ist klarer und verändert weder Numerusbezug noch Sinn.
