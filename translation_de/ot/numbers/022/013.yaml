id: NUM.22.13
reference: Numbers 22:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: de
  text: 'Da stand Bileam am Morgen auf und sagte zu Balaks Würdenträgern[a]: »Geht in euer Land, denn Jahwe hat sich geweigert, mich mit euch gehen zu lassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fürsten« oder »führenden Männern«.'
    reason: שָׂרִים besitzt eine Spannbreite von Fürsten über führende Männer bis zu Amtsträgern; Rang und Funktion sind klar, die genaue Amtsbezeichnung jedoch nicht.
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand … auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet hier im Erzählfluss das morgendliche Aufstehen; die deutsche Verbklammer ergibt sich aus der Satzstellung.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Natürliche und genaue Wiedergabe der üblichen hebräischen Zeitangabe, ohne eine nicht ausdrücklich genannte Betonung wie „früh“ hinzuzufügen.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die natürliche Standardwiedergabe des gewöhnlichen hebräischen Redeverbs im Erzähltext.
- source_word: שָׂרֵי בָלָק
  choice: Balaks Würdenträger
  rationale: שָׂרִים kann Fürsten, führende Männer oder Amtsträger bezeichnen. „Würdenträger“ passt zu den hochrangigen königlichen Abgesandten, ohne zwingend erbliche Prinzen aus ihnen zu machen.
- source_word: לְכוּ
  choice: Geht
  rationale: Direkte Wiedergabe des Imperativs von הלך und im Zusammenhang eine Aufforderung zur Rückkehr.
- source_word: אֶל אַרְצְכֶם
  choice: in euer Land
  rationale: אֶרֶץ bezeichnet hier das eigene Land beziehungsweise Herkunftsgebiet der Gesandten; „in euer Land“ ist im Deutschen idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung der Aufforderung ein. „Denn“ verbindet die direkte Rede natürlich und würdevoll.
- source_word: מֵאֵן
  choice: hat sich geweigert
  rationale: Das Piel-Perfekt von מאן drückt eine entschiedene Weigerung aus; das deutsche Perfekt wahrt ihren gegenwärtigen Bezug in Bileams Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: לְתִתִּי
  choice: mich … gehen zu lassen
  rationale: 'נתן mit folgendem Infinitiv hat hier permissive Bedeutung: erlauben beziehungsweise zulassen. Die gewählte Form ist natürliches Deutsch.'
- source_word: לַהֲלֹךְ עִמָּכֶם
  choice: mit euch gehen
  rationale: הלך mit עִם bezeichnet hier das Mitgehen beziehungsweise Begleiten der Gesandtschaft; die schlichte Wiedergabe erhält den Wortlaut und Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt diesen Unterschied gegenüber einem bloßen Titel, ohne darüber hinaus eine theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Erzählsyntax. Die direkte Rede bleibt knapp. „Würdenträger“ bewahrt den hohen Rang der königlichen Gesandten; die Fußnote macht die echte lexikalische Spannbreite sichtbar.
