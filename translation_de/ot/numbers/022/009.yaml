  text: וַ/יָּבֹ֥א אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֕אמֶר מִ֛י הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: de
  text: 'Da kam Gott zu Bileam und sagte: »Wer sind diese Männer bei dir?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das narrative Wayyiqtol führt die Handlung weiter. „Da kam“ gibt sowohl die Abfolge als auch die gewöhnliche Bedeutung von בוא natürlich wieder, ohne ein Eintreten in einen bestimmten Raum anzunehmen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Singular des Verbs und der Erzählzusammenhang weisen auf Gott als persönliche handelnde Gestalt; „Gott“ ist dafür die übliche deutsche Wiedergabe.
- source_word: אֶל בִּלְעָם
  choice: zu Bileam
  rationale: אֶל bezeichnet hier die Richtung beziehungsweise Hinwendung zu Bileam. Der Personenname wird nach etablierter deutscher Bibelkonvention als „Bileam“ wiedergegeben.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: אמר leitet direkte Rede ein und wird in modernem Deutsch am natürlichsten mit „sagte“ wiedergegeben.
- source_word: מִי
  choice: Wer
  rationale: Das Fragewort verlangt die Identität von Personen und entspricht direkt dem deutschen „Wer“.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: diese Männer
  rationale: Der Ausdruck bezeichnet die konkreten männlichen Abgesandten, die sich bei Bileam befinden. „Diese Männer“ bewahrt Numerus, Geschlechtsbezug und demonstrative Bestimmtheit.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: עִם mit Suffix bezeichnet Gemeinschaft oder Begleitung. In der deutschen Frage „Wer sind diese Männer bei dir?“ ist „bei dir“ idiomatisch und umfasst ihre Anwesenheit in Bileams Gesellschaft.
theological_decisions:
- issue: Referent von אֱלֹהִים in der Bileam-Erzählung
  choice: Gott
  alternative: ein Gott / ein göttliches Wesen
  rationale: Obwohl אֱלֹהִים grundsätzlich weitere Bedeutungen haben kann, sprechen die singularische Verbform und der unmittelbare Erzählzusammenhang hier für Gott als den bestimmten Referenten. Die Übersetzung fügt keine weitergehende dogmatische Deutung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Da kam“ bewahrt den hebräischen Handlungsfortschritt, ohne die im Deutschen schwerfällige Reihung mit „Und“ nachzuahmen. Keine Fußnote erforderlich.
