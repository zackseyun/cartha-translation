source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל הָ/אֱלֹהִ֑ים בָּלָ֧ק בֶּן צִפֹּ֛ר מֶ֥לֶךְ מוֹאָ֖ב שָׁלַ֥ח אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: de
  text: 'Da sagte Bileam zu Gott: „Balak, der Sohn Zippors, der König von Moab, hat zu mir gesandt:[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat nach mir geschickt“. Wörtlich: „hat zu mir gesandt“.'
    reason: Die hebräische Wendung שָׁלַח אֵלַי nennt kein Objekt ausdrücklich. Die alternative Deutung „hat nach mir geschickt“ ist im Kontext möglich, soll aber nicht als alleiniger Sinn in den Haupttext eingehen.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ ist im modernen deutschen Erzählstil natürlich und bewahrt die zeitliche Folge.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: Der Artikel und der unmittelbare Kontext weisen auf Gott als den Gesprächspartner Bileams; im Deutschen steht der Name „Gott“ hier idiomatisch ohne Artikel.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: Balak, der Sohn Zippors
  rationale: Die hebräische Status-constructus-Verbindung wird als natürliche deutsche Apposition wiedergegeben.
- source_word: מֶלֶךְ מוֹאָב
  choice: der König von Moab
  rationale: Die Apposition bezeichnet Balaks Amt; der bestimmte Artikel ist im Deutschen in dieser Konstruktion natürlich.
- source_word: שָׁלַח אֵלַי
  choice: hat mir diese Botschaft geschickt
  rationale: Wörtlich bedeutet die Wendung „hat zu mir gesandt“. Da der folgende Doppelpunkt den Inhalt der Sendung einführt und der Kontext Boten voraussetzt, macht „diese Botschaft geschickt“ den im Deutschen erforderlichen Bezug verständlich, ohne „nach mir geschickt“ als alleinige Deutung festzulegen.
theological_decisions:
- issue: Bezug von הָאֱלֹהִים
  choice: Gott als Bileams Gesprächspartner
  alternative: ein Gott oder Götter im allgemeinen Sinn
  rationale: Der bestimmte Artikel und der unmittelbare Erzählzusammenhang identifizieren den Angesprochenen als Gott, der Bileam im vorhergehenden Vers begegnet, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede endet mit einem Doppelpunkt, weil Bileam im folgenden Vers Balaks Botschaft wiedergibt.
