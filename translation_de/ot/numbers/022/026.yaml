  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: de
  text: Dann ging der Engel Jahwes weiter[a] und stellte sich an einer engen Stelle auf, wo es keinen Weg gab, nach rechts oder links abzubiegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ging erneut weiter“ oder „setzte seinen Weg fort“. Die hebräische Wendung bedeutet wörtlich etwa: „fuhr fort weiterzugehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: Dann zog ... noch weiter
  rationale: Die Verbindung von יסף mit dem Infinitiv עֲבוֹר bezeichnet die Fortsetzung der Bewegung. „Noch weiterziehen“ gibt den Fortgang in der Erzählung natürlich wieder; „Dann“ entspricht der fortlaufenden Narrativfolge.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten; in dieser übernatürlichen Szene ist „Engel“ die naheliegende Wiedergabe. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: וַיַּעֲמֹד
  choice: stellte sich
  rationale: עמד bedeutet hier, dass der Engel an einem bestimmten Ort seine Stellung einnimmt. „Stellte sich“ bildet diese zielgerichtete Handlung im Deutschen genauer ab als das bloße „stand“.
- source_word: בְּמָקוֹם צָר
  choice: an eine enge Stelle
  rationale: Die Wendung bezeichnet einen räumlich eingeengten Ort. „Enge Stelle“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: an der es keinen Weg gab, ... auszuweichen
  rationale: דֶּרֶךְ bezeichnet hier nicht das völlige Fehlen eines Weges, sondern das Fehlen einer Ausweichmöglichkeit. Für נטה ist deshalb im Zusammenhang mit den Richtungsangaben „ausweichen“ idiomatisch und präzise.
- source_word: יָמִין וּשְׂמֹאול
  choice: nach rechts oder nach links
  rationale: Die beiden Richtungsangaben werden mit den im Deutschen üblichen Präpositionen wiedergegeben; die Wiederholung von „nach“ unterstreicht beide ausgeschlossenen Möglichkeiten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen im modernen Standarddeutsch wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מַלְאָךְ in der Verbindung מַלְאַךְ יְהוָה
  choice: Engel
  alternative: Bote
  rationale: Obwohl das Wort grundsätzlich „Bote“ heißen kann, weist die übernatürliche Erscheinung in diesem Erzählzusammenhang auf „Engel“. Die Identität der Gestalt wird darüber hinaus nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die räumliche Enge und die fortschreitende Bewegung bleiben konkret; unnötige konfessionelle Deutungen werden vermieden.
