  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: de
  text: 'Da sagte der Engel Jahwes[a] zu Bileam: »Geh mit den Männern! Aber nur das Wort[b], das ich zu dir reden werde, sollst du reden.« Und Bileam ging mit den Würdenträgern Balaks[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Botschaft« oder »die Sache«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »den Fürsten Balaks« bzw. »den führenden Männern Balaks«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten. Da die Gestalt in dieser Erzählung als übernatürlicher göttlicher Gesandter auftritt, ist »Engel« im Haupttext angemessen; »Bote« bleibt als Fußnotenalternative erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: Geh mit den Männern!
  rationale: Der Imperativ und die bestimmte maskuline Personenbezeichnung werden direkt und natürlich wiedergegeben.
- source_word: וְאֶפֶס
  choice: Aber nur
  rationale: Die Wendung schränkt die zuvor erteilte Erlaubnis nachdrücklich ein; »Aber nur« bildet sowohl den Gegensatz als auch die Ausschließlichkeit ab.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier im Zusammenhang des Redens am ehesten das auszusprechende Wort, kann aber auch »Botschaft« oder »Sache« bedeuten.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: das ich zu dir reden werde
  rationale: Die Zukunftsbedeutung des Imperfekts wird ausdrücklich wiedergegeben; »zu dir reden« bewahrt zudem die Wiederholung des hebräischen Verbs דבר.
- source_word: אֹתוֹ תְדַבֵּר
  choice: sollst du reden
  rationale: Das vorangestellte Objekt wird durch »nur das Wort … sollst du reden« hervorgehoben. »Sollst« gibt die verbindliche Anweisung wieder, ohne ein zusätzliches Modalwort wie »musst« einzuführen.
- source_word: שָׂרֵי בָלָק
  choice: die Würdenträger Balaks
  rationale: שָׂרִים bezeichnet ranghohe Amtsträger oder führende Männer. »Würdenträger« passt zum diplomatischen Gefolge, ohne sie als Königssöhne festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes; die Transliteration »Jahwe« bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Die Erzählung kennzeichnet die Gestalt als übernatürlichen Gesandten. Zugleich wird die lexikalisch mögliche allgemeinere Bedeutung »Bote« in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wiederholung »reden … reden« bewahrt die hebräische Wortverbindung und den Nachdruck der Anweisung. Die Fußnotenmarker stehen jeweils unmittelbar an der betreffenden Wendung.
