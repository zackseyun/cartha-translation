  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen zuverlässig wieder: die diskursive Einleitung („Und nun“), die höfliche Aufforderung zum Bleiben, die additive Anrede („auch ihr“), die Übernachtung, den zielgerichteten Kohortativ und die Erwartung einer weiteren Mitteilung Jahwes. „was Jahwe noch zu mir sagen wird“ gibt מַה־יֹּסֵף … דַּבֵּר עִמִּי idiomatisch und ohne sachliche Einengung wieder.'
