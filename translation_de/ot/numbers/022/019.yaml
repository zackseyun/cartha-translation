  terminology: „Jahwe“ entspricht dem ausdrücklich genannten Tetragramm und der vorgegebenen Benennungspraxis. „erfahre“ ist für den erwarteten Erhalt einer weiteren göttlichen Auskunft angemessen; „sagen wird“ ist hier eine natürliche, kontextgerechte Wiedergabe von „mit mir reden/wird sprechen“.
