source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: de
  text: Und nun bleibt bitte auch ihr über Nacht hier, damit ich erfahre, was Jahwe noch zu mir sagen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Der Ausdruck führt Bileams nächste Anweisung ein; „Und nun“ bewahrt sowohl die Verknüpfung als auch den neuen Gesprächsschritt.
- source_word: שְׁבוּ נָא
  choice: bleibt bitte
  rationale: ישׁב bedeutet hier idiomatisch „bleiben“ statt wörtlich „sitzen“; נָא wird als höfliches „bitte“ wiedergegeben.
- source_word: בָזֶה
  choice: hier
  rationale: Die Ortsangabe wird im Deutschen natürlich und knapp mit „hier“ ausgedrückt.
- source_word: גַּם אַתֶּם
  choice: auch ihr
  rationale: 'Die additive Betonung bleibt erhalten: Auch diese Abgesandten sollen wie die frühere Gruppe bleiben.'
- source_word: הַלָּיְלָה
  choice: über Nacht
  rationale: Im Zusammenhang mit „bleiben“ ist „über Nacht“ idiomatischer als „heute Nacht“ und gibt den zeitlichen Akkusativ treffend wieder.
- source_word: וְאֵדְעָה
  choice: damit ich erfahre
  rationale: Der Kohortativ bezeichnet hier den Zweck des Bleibens; „erfahre“ passt zur erwarteten weiteren Mitteilung.
- source_word: מַה יֹּסֵף
  choice: was … noch
  rationale: Die Verbindung mit יסף drückt eine zusätzliche oder weitere Mitteilung aus; „was … noch“ ist im Deutschen natürlich und wahrt diese Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דַּבֵּר עִמִּי
  choice: zu mir sagen wird
  rationale: Die Formulierung gibt den gemeinten Inhalt einer weiteren göttlichen Mitteilung natürlich wieder; das hebräische עִמִּי kann formaler auch mit „mit mir reden“ übersetzt werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der erwarteten göttlichen Mitteilung
  choice: was Jahwe noch zu mir sagen wird
  alternative: was Jahwe weiter mit mir reden wird
  rationale: Die Übersetzung stellt die erwartete Botschaft in den Vordergrund, ohne über ihren Inhalt oder Gottes Absicht hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung ist flüssig und verständlich; „auch ihr“ bewahrt die Hervorhebung der angesprochenen zweiten Gesandtschaft.
