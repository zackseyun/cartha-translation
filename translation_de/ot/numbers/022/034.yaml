base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: de
  text: 'Da sagte Bileam zum Engel Jahwes[a]: »Ich habe gesündigt; denn ich wusste nicht, dass du mir auf dem Weg gegenüberstandest. Und nun, wenn es böse ist in deinen Augen[b], will ich umkehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bote Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: »wenn es dir missfällt« oder »wenn es in deinen Augen falsch ist«.'
    reason: idiom_clarification
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  rationale: מַלְאַךְ bezeichnet einen Boten und kann bei einem übernatürlichen Gesandten mit »Engel« wiedergegeben werden. Im Erzählzusammenhang erscheint die Gestalt übernatürlich und mit gezogenem Schwert; »Engel« ist daher im Deutschen am natürlichsten. Die mögliche Wiedergabe »Bote Jahwes« bleibt in der Fußnote sichtbar.
- source_word: חָטָאתִי
  choice: Ich habe gesündigt
  rationale: Das Perfekt bezeichnet Bileams Eingeständnis einer vollzogenen Verfehlung. Das deutsche Perfekt ist in direkter Rede natürlich und bewahrt den Bekenntnischarakter.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: denn ich wusste nicht
  rationale: כִּי leitet hier die Begründung ein; »denn« gibt diesen Zusammenhang knapp und idiomatisch wieder.
- source_word: נִצָּב לִקְרָאתִי
  choice: dass du dich mir … entgegenstelltest
  rationale: נִצָּב bezeichnet ein festes Stehen beziehungsweise Sich-Hinstellen, während לִקְרָאתִי eine Bewegung oder Ausrichtung auf Bileam zu ausdrückt. Im Zusammenhang des bewaffneten Widerstands gibt »sich entgegenstellen« die gegnerische Nuance wieder, ohne sie übermäßig auszudeuten.
- source_word: בַּדָּרֶךְ
  choice: auf dem Weg
  rationale: Die Form bezeichnet den Ort der Begegnung während Bileams Reise. »Auf dem Weg« ist präzise und natürlich.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: wenn es … in deinen Augen böse ist
  rationale: Die hebräische Wendung wird bewusst weitgehend formal bewahrt, einschließlich des moralisch gewichtigen רַע. Eine idiomatischere Bedeutungsmöglichkeit wird in der Fußnote genannt.
- source_word: אָשׁוּבָה לִּי
  choice: will ich umkehren
  rationale: Die Kohortativform drückt Bileams Entschluss beziehungsweise Bereitschaft zur Rückkehr aus. »Will ich umkehren« bewahrt diese willentliche Nuance; das ethische beziehungsweise interessenbezogene לִי benötigt im Deutschen keine eigene Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Konsonantentext enthält den persönlichen Gottesnamen. »Jahwe« gibt ihn im modernen Deutschen als gebräuchliche wissenschaftliche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Der Ausdruck legt sprachlich zunächst einen Gesandten fest, nicht aber allein durch das Substantiv dessen Wesen. Der übernatürliche Erzählzusammenhang stützt »Engel«; die lexikalisch mögliche Übersetzung »Bote« wird als Alternative offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit gut verständlicher direkter Rede. Die hebräische Bildrede »in deinen Augen böse« bleibt im Haupttext erhalten; die Fußnote erschließt ihre idiomatische Bedeutung. »Entgegenstelltest« bewahrt die feindliche Ausrichtung der Szene, ohne zusätzliche Motive in den Text einzutragen.
