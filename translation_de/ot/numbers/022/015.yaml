source:
  edition: WLC
  text: וַ/יֹּ֥סֶף ע֖וֹד בָּלָ֑ק שְׁלֹ֣חַ שָׂרִ֔ים רַבִּ֥ים וְ/נִכְבָּדִ֖ים מֵ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: de
  text: Da schickte Balak noch einmal führende Männer, zahlreicher und angesehener als die ersten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: Da schickte ... noch einmal
  rationale: Die Verbindung von יסף mit dem Infinitiv und עוֹד bezeichnet die Wiederholung der Handlung. „Noch einmal schicken“ gibt die hebräische Wendung in natürlichem Deutsch wieder; „Da“ führt die Erzählfolge fort.
- source_word: בָּלָק
  choice: Balak
  rationale: Der Personenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: שָׂרִים
  choice: führende Männer
  rationale: שָׂרִים bezeichnet hier hochrangige Vertreter Balaks. „Führende Männer“ ist verständlich, wahrt den Rangbezug und vermeidet das im heutigen Deutsch leicht dynastisch verstandene „Fürsten“.
- source_word: רַבִּים
  choice: zahlreicher
  rationale: 'Durch מֵאֵלֶּה ist die Aussage vergleichend: Die zweite Gesandtschaft umfasste mehr Personen als die erste.'
- source_word: וְנִכְבָּדִים
  choice: angesehener
  rationale: Das Wort bezeichnet Personen von größerem gesellschaftlichem Gewicht, Rang oder Ansehen. „Angesehener“ bewahrt den Statusaspekt in idiomatischem Deutsch.
- source_word: מֵאֵלֶּה
  choice: als die ersten
  rationale: Das Demonstrativpronomen verweist auf die zuvor entsandten Männer. „Die ersten“ macht diesen Rückbezug im Deutschen knapp und eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Der diplomatische Rang der Gesandten wird verständlich ausgedrückt, ohne einen erblichen Fürstentitel zu unterstellen. Keine Fußnote ist erforderlich, da „angesehener“ die relevante Bedeutungsbreite im Kontext angemessen wiedergibt.
