  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: de
  text: Als die Eselin den Engel Jahwes[a] auf dem Weg stehen sah, das gezückte Schwert in der Hand, wich sie vom Weg ab und ging aufs Feld. Da schlug Bileam die Eselin, um sie wieder auf den Weg zu lenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Boten Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: die Eselin
  rationale: אָתוֹן bezeichnet ausdrücklich einen weiblichen Esel. „Eselin“ ist im Deutschen natürlich und bewahrt diese Information unmittelbar.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Die übernatürliche Gestalt mit gezogenem Schwert legt hier „Engel“ nahe; die allgemeinere Bedeutung „Bote“ bleibt in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: mitten auf dem Weg stehen
  rationale: Das Partizip beschreibt die feste Position des Engels. „Mitten auf dem Weg“ verdeutlicht idiomatisch, dass er den Weg versperrt, ohne eine zusätzliche Handlung einzuführen.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: mit gezücktem Schwert in der Hand
  rationale: שְׁלוּפָה bezeichnet das aus der Scheide gezogene Schwert. Die deutsche Wendung erhält Bild und Begleitumstand knapp und natürlich.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: wich sie vom Weg ab
  rationale: נָטָה bezeichnet hier das Abweichen von der bisherigen Richtung. „Vom Weg abweichen“ ist präzise und idiomatisch.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: lief auf das Feld
  rationale: שָׂדֶה bezeichnet Feld oder offenes Land. „Auf das Feld“ passt zur konkreten Szene; „lief“ gibt die Fortbewegung einer Eselin natürlich wieder, ohne besondere Geschwindigkeit zu behaupten.
- source_word: וַיַּךְ
  choice: schlug
  rationale: נכה ist ein allgemeines Verb des Schlagens. Die einfache Vergangenheitsform wahrt, dass die Verbform für sich genommen keine wiederholten Schläge ausdrückt.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: um sie wieder auf den Weg zu lenken
  rationale: Der kausative Infinitiv mit femininem Suffix bezeichnet Bileams Absicht, die Eselin zum Weg hin umzulenken. „Wieder“ ergibt sich aus ihrem unmittelbar zuvor geschilderten Abweichen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen. Die Transkription „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מַלְאַךְ in der Verbindung מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Die bewaffnete, für Bileam zunächst unsichtbare Gestalt wird im Erzählzusammenhang am natürlichsten als „Engel“ verstanden. Da מַלְאָךְ lexikalisch auch „Bote“ bedeutet, wird diese echte Bedeutungsalternative in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählbewegung. „Eselin“ bewahrt das grammatisch und sachlich weibliche Tier; „gezücktes Schwert“ entspricht etablierter, weiterhin verständlicher deutscher Ausdrucksweise.
