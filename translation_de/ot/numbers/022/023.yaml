  to: Als die Eselin den Engel Jahwes[a] auf dem Weg stehen sah, das gezückte Schwert in der Hand, wich sie vom Weg ab und ging aufs Feld. Da schlug Bileam die Eselin, um sie wieder auf den Weg zu lenken.
