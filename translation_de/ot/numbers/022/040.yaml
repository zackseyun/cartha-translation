base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: de
  text: Und Balak opferte Rinder und Kleinvieh[a] und sandte Bileam und den führenden Männern, die bei ihm waren, davon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann Schafe und Ziegen umfassen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und sandte“. Gemeint sind im Zusammenhang wahrscheinlich Fleischstücke oder Opferanteile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: opferte
  rationale: זבח bezeichnet gewöhnlich das Schlachten als Opferhandlung. „Opferte“ gibt den kultischen Sinn knapp und natürlich wieder.
- source_word: בָּקָר
  choice: Rinder
  rationale: בקר ist eine Sammelbezeichnung für Großvieh beziehungsweise Rinder und legt kein bestimmtes Geschlecht fest.
- source_word: צֹאן
  choice: Kleinvieh
  rationale: צאן umfasst Herden kleiner Nutztiere, besonders Schafe und Ziegen. „Kleinvieh“ bewahrt diesen weiteren Umfang.
- source_word: וַיְשַׁלַּח
  choice: sandte davon
  rationale: Das Verb bedeutet wörtlich nur „sandte“. Aus dem Zusammenhang ergibt sich, dass Balak etwas von den geopferten Tieren sandte; „davon“ macht den deutschen Satz verständlich, ohne ausdrücklich nicht genannte „Anteile“ einzutragen.
- source_word: לְבִלְעָם
  choice: an Bileam
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: לַשָּׂרִים
  choice: an die führenden Männer
  rationale: שׂרים bezeichnet hochrangige Männer, Würdenträger oder Amtsträger. „Führende Männer“ ist im erzählerischen Zusammenhang natürlich und vermeidet die mögliche dynastische Fehlvorstellung von „Fürsten“.
- source_word: אֲשֶׁר אִתּוֹ
  choice: die bei ihm waren
  rationale: Die Relativkonstruktion und das Pronomen des Hebräischen bleiben erhalten. „Ihm“ bezieht sich am natürlichsten auf Bileam, lässt aber die pronominale Form des Ausgangstextes stehen.
