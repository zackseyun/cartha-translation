  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: de
  text: 'Da schickte er Boten zu Bileam, dem Sohn Beors, nach Petor, das am Strom[a] liegt, im Land der Söhne seines Volkes[b], um ihn zu rufen. Sie sollten ihm sagen: »Sieh, ein Volk ist aus Ägypten ausgezogen. Sieh, es bedeckt die Fläche des Landes[c] und hat sich mir gegenüber niedergelassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „der Strom“; wahrscheinlich ist der Euphrat gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „im Land seines Volkes“. Die hebräische Wendung „Land der Söhne seines Volkes“ ist schwierig; auch der Bezug von „seines“ ist nicht eindeutig.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „das Auge des Landes“; gemeint ist offenbar seine sichtbare Oberfläche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickte er
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; „Da“ gibt die zeitlich-folgernde Bewegung in natürlichem Deutsch wieder.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im diplomatischen Zusammenhang sind menschliche Boten gemeint, nicht Engel.
- source_word: פְּתוֹרָה
  choice: nach Petor
  rationale: Das direktionale He am Ortsnamen bezeichnet hier am ehesten die Bewegung zum Aufenthaltsort Bileams.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: das am Strom liegt
  rationale: „Der Strom“ bewahrt die Ausdrucksweise des Hebräischen; wahrscheinlich ist der Euphrat gemeint.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: im Land der Söhne seines Volkes
  rationale: Die schwierige hebräische Wortfolge wird bewusst eng wiedergegeben, ohne den unklaren Bezug des Pronomens stillschweigend festzulegen.
- source_word: לִקְרֹא לוֹ
  choice: um ihn rufen zu lassen
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck der Sendung. Die Formulierung passt dazu, dass die Boten Bileam im Auftrag Balaks herbeirufen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die zweimalige Aufmerksamkeitspartikel bleibt als betonte Aufforderung erhalten.
- source_word: יָצָא מִמִּצְרַיִם
  choice: ist aus Ägypten ausgezogen
  rationale: „Ausziehen“ ist im Deutschen eine natürliche und kontextgerechte Wiedergabe der vollendeten Bewegung aus Ägypten.
- source_word: כִסָּה אֶת עֵין הָאָרֶץ
  choice: es bedeckt die Fläche des Landes
  rationale: Wörtlich steht „das Auge des Landes“; idiomatisch ist die sichtbare Oberfläche beziehungsweise Fläche gemeint.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: und hat sich mir gegenüber niedergelassen
  rationale: יֹשֵׁב kann Sitzen, Wohnen oder Lagern bezeichnen. Im Zusammenhang des herangerückten Volkes gibt „sich niederlassen“ die räumliche Lage wieder, ohne ausdrücklich militärisches Lagern festzulegen.
