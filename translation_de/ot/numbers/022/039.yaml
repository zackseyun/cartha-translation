lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging
  rationale: Das Qal-Wajjiqtol von הלך führt die Erzählung mit der schlichten Bedeutung „gehen“ weiter. „Da ging“ gibt sowohl die Handlung als auch den erzählerischen Anschluss natürlich wieder.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet hier eindeutig Begleitung; „mit“ ist die direkte und idiomatische Wiedergabe.
- source_word: בָּלָק
  choice: Balak
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form transliteriert.
- source_word: וַיָּבֹאוּ
  choice: und sie kamen nach
  rationale: Das plurale Wajjiqtol von בוא bezeichnet die nächste Bewegung. Bei einem Ortsnamen gibt „kamen nach“ die Ankunft natürlich wieder, ohne ein Betreten näher festzulegen.
- source_word: קִרְיַת חֻצוֹת
  choice: Kirjat-Huzot
  rationale: Da die Wortgruppe hier als Ortsname dient, wird sie in der im Deutschen geläufigen Form transliteriert. Ihre mögliche lexikalische Bedeutung bleibt in der Fußnote erhalten.
theological_decisions: []
