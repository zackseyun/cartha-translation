  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: de
  text: Bileam ging mit Balak, und sie kamen nach Kirjat-Huzot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirjat-Huzot bedeutet wahrscheinlich „Stadt der Straßen“ oder „Stadt der Plätze“.
