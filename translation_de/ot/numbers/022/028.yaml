  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: de
  text: 'Da öffnete Jahwe der Eselin den Mund[a], und sie sagte zu Bileam: »Was habe ich dir getan, dass du mich diese drei Male geschlagen hast?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Mund der Eselin«.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung lautet wörtlich etwa »dies drei Füße«; sie ist idiomatisch und bedeutet hier »diese drei Male« oder »bei diesen drei Gelegenheiten«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: öffnete
  rationale: Das Qal-Wayyiqtol von פתח bezeichnet unmittelbar das Öffnen; die schlichte Formulierung bewahrt Jahwes direktes Handeln.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die geläufige deutsche Transkription.
- source_word: פִּי הָאָתוֹן
  choice: der Eselin den Mund
  rationale: Die deutsche Dativkonstruktion gibt die hebräische Wendung »den Mund der Eselin« natürlich wieder. אָתוֹן bezeichnet eine weibliche Eselin.
- source_word: וַתֹּאמֶר לְבִלְעָם
  choice: und sie sagte zu Bileam
  rationale: Die feminine Verbform bezieht sich auf die Eselin; »Bileam« ist die etablierte deutsche Namensform.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: Was habe ich dir getan
  rationale: Die Formulierung entspricht dem hebräischen Wortlaut und ist zugleich natürliches modernes Deutsch.
- source_word: כִּי הִכִּיתַנִי
  choice: dass du mich … geschlagen hast
  rationale: כִּי verbindet hier die Frage mit dem beanstandeten Handeln. נכה wird sachlich mit »schlagen« wiedergegeben.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: nun schon dreimal
  rationale: רְגָלִים bedeutet wörtlich »Füße«, wird hier aber idiomatisch für drei Male beziehungsweise Gelegenheiten gebraucht. »nun schon« nimmt die demonstrativ-aktuelle Nuance von זֶה auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Wiedergabe als »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Eselin« macht das im Hebräischen grammatisch und lexikalisch bezeichnete weibliche Tier deutlich. Die direkte Rede bleibt lebendig, ohne umgangssprachlich zu wirken.
