  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: de
  text: Die Eselin sah mich und wich mir aus – dreimal. Wenn sie mir nicht ausgewichen wäre[a], hätte ich dich jetzt getötet und sie am Leben gelassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen etwa: »Vielleicht ist sie mir ausgewichen.« Gemeint ist dem Zusammenhang nach ein irrealer Bedingungssatz: »Wenn sie mir nicht ausgewichen wäre.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: sah mich
  rationale: ראה bezeichnet hier schlicht das visuelle Wahrnehmen; »sah mich« ist die natürliche und genaue deutsche Wiedergabe.
- source_word: הָאָתוֹן
  choice: die Eselin
  rationale: אָתוֹן bezeichnet ausdrücklich ein weibliches Tier. Im Deutschen ist »Eselin« idiomatisch und bewahrt diese Geschlechtsangabe.
- source_word: וַתֵּט לְפָנַי
  choice: wich mir aus
  rationale: נטה bezeichnet hier das Abweichen von der eingeschlagenen Richtung. In Verbindung mit לְפָנַי gibt »wich mir aus« die räumliche Situation natürlich wieder.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: dreimal
  rationale: Die Wendung bezeichnet idiomatisch drei wiederholte Gelegenheiten; »dreimal« ist im Deutschen klar und knapp.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: Wenn sie mir nicht ausgewichen wäre
  rationale: Obwohl אוּלַי gewöhnlich »vielleicht« bedeutet und im überlieferten Text keine ausdrückliche Verneinung steht, verlangt der narrative Zusammenhang eine irreale Bedingung mit negativem Sinn.
- source_word: כִּי עַתָּה גַּם אֹתְכָה הָרַגְתִּי
  choice: hätte ich dich jetzt getötet
  rationale: Das Perfekt steht im Folgesatz eines irrealen Bedingungsgefüges und wird daher mit dem deutschen Konjunktiv II der Vergangenheit wiedergegeben. גַּם hebt Bileam hervor, ohne dass dafür zwingend ein zusätzliches »sogar« nötig ist.
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: und sie am Leben gelassen
  rationale: Der Hifil von חיה bedeutet »am Leben erhalten/lassen«; die Formulierung bewahrt den ausdrücklichen Gegensatz zu Bileams beabsichtigter Tötung.
theological_decisions:
- issue: Irrealer Bedingungssatz trotz fehlender ausdrücklicher Verneinung nach אוּלַי
  choice: »Wenn sie mir nicht ausgewichen wäre«
  alternative: »Vielleicht ist sie mir ausgewichen«
  rationale: Der Fortgang des Satzes und die Erzählung setzen voraus, dass das Ausweichen der Eselin Bileams Tod verhindert hat. Die negative irreale Bedingung gibt diesen kontextuell erforderlichen Sinn wieder; die formale Auffälligkeit des Hebräischen wird in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Eselin« bewahrt die im Hebräischen ausdrücklich weibliche Tierbezeichnung. Der Gedankenstrich gliedert die knappe Wiederholungsangabe natürlich; die textliche Spannung in der Bedingung wird nicht verdeckt, sondern in der Fußnote dokumentiert.
