revisions:
- from: Da enthüllte Jahwe Bileam die Augen[a], und er sah den Engel Jahwes[b] mitten auf dem Weg stehen, mit dem gezückten Schwert in der Hand. Da verneigte er sich und warf sich mit dem Gesicht zur Erde nieder.
  to: Da öffnete Jahwe Bileam die Augen[a], und er sah den Engel Jahwes[b] auf dem Weg stehen, das gezückte Schwert in seiner Hand. Er verneigte sich und warf sich mit dem Gesicht zur Erde nieder.
  rationale: Die idiomatische Hauptübersetzung von וַיְגַל lautet im Deutschen »öffnete ... die Augen«; die wörtlichere Bedeutung von גלה bleibt transparent in der Fußnote dokumentiert. Die nicht explizite Ortsverstärkung »mitten« wurde entfernt. Im Übrigen bleiben Gottesname, Engelterminologie, gezücktes Schwert sowie die zwei aufeinanderfolgenden körperlichen Gesten quellentreu erhalten.
