  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: de
  text: Da öffnete Jahwe Bileam die Augen[a], und er sah den Engel Jahwes[b] auf dem Weg stehen, das gezückte Schwert in seiner Hand. Er verneigte sich und warf sich mit dem Gesicht zur Erde nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »enthüllte Bileam die Augen«; auch: »deckte Bileam die Augen auf«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Boten Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: enthüllte
  rationale: Das Verb גלה bedeutet grundlegend „aufdecken, enthüllen“. Die Formulierung bewahrt das hebräische Bild, dass Jahwe eine zuvor bestehende Einschränkung von Bileams Wahrnehmung beseitigt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. In dieser übernatürlichen Begegnung ist „Engel“ die natürliche kontextuelle Wiedergabe; die Alternative wird in einer Fußnote genannt.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: mitten auf dem Weg stehen
  rationale: Das Partizip bezeichnet eine feste, stehende Position. „Mitten auf dem Weg“ macht die versperrende Stellung im Deutschen natürlich deutlich.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: mit dem gezückten Schwert in der Hand
  rationale: שְׁלֻפָה bezeichnet ein aus der Scheide gezogenes Schwert. Die deutsche Begleitumstandsformulierung gibt das hebräische Nominalgefüge knapp und anschaulich wieder.
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: verneigte er sich und warf sich mit dem Gesicht zur Erde nieder
  rationale: Die zwei Verben werden als aufeinander bezogene körperliche Handlungen wiedergegeben. So bleibt die im Hebräischen ausdrückliche Niederwerfung erhalten, ohne sie bereits mit „anbeten“ theologisch auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וַיִּשְׁתַּחוּ
  choice: warf sich … nieder
  alternative: betete an
  rationale: Das Verb kann kultische Verehrung bezeichnen, beschreibt hier aber unmittelbar eine körperliche Reaktion. Die Übersetzung lässt die mögliche religiöse Bedeutung offen und vermeidet eine erzwungene theologische Festlegung.
- issue: Bedeutung von מַלְאַךְ
  choice: Engel
  alternative: Bote
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der übernatürliche Zusammenhang spricht für die traditionelle Kontextbedeutung „Engel“, während die Fußnote die echte lexikalische Alternative bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche, aber verständliche Bild „die Augen enthüllen“ folgt bewusst dem hebräischen Wortlaut und wird durch eine Fußnote erklärt. Die beiden Verben der Verneigung und Niederwerfung bleiben unterscheidbar; Satzbau und Wortwahl sind zugleich für gewöhnliche Leser flüssig.
