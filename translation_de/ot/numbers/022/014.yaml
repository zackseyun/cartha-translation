  text: וַ/יָּק֨וּמוּ֙ שָׂרֵ֣י מוֹאָ֔ב וַ/יָּבֹ֖אוּ אֶל בָּלָ֑ק וַ/יֹּ֣אמְר֔וּ מֵאֵ֥ן בִּלְעָ֖ם הֲלֹ֥ךְ עִמָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/014.yaml
  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: de
  text: 'Da machten sich die führenden Männer Moabs auf, kehrten zu Balak zurück und sagten: »Bileam hat sich geweigert, mit uns zu kommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: die führenden Männer Moabs
  rationale: שָׂרִים bezeichnet ranghohe Männer beziehungsweise Amtsträger. »Führende Männer« ist im Kontext natürlich und wahrt ihren hohen gesellschaftlichen Rang, ohne ein genaueres Amt vorauszusetzen.
- source_word: וַיָּק֨וּמוּ
  choice: Da machten sich … auf
  rationale: Das Verb קום leitet hier idiomatisch den Aufbruch ein; die Wendung gibt die Handlung natürlicher wieder als das wörtliche »standen auf«.
- source_word: וַיָּבֹאוּ אֶל־בָּלָק
  choice: kehrten zu Balak zurück
  rationale: בוא bedeutet grundsätzlich »kommen/gelangen«. Aus dem Erzählzusammenhang ergibt sich, dass die Abgesandten zu Balak zurückkehren; »kehrten … zurück« macht diese im Hebräischen kontextuell enthaltene Bewegung im Deutschen verständlich.
- source_word: מֵאֵן
  choice: hat sich geweigert
  rationale: מֵאֵן drückt eine entschiedene Weigerung aus; das deutsche Perfekt passt zur berichteten, unmittelbar vorausgegangenen Entscheidung.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: mit uns zu kommen
  rationale: Die Infinitivkonstruktion bezeichnet hier das Mitgehen mit den Abgesandten. Aus ihrer Perspektive ist idiomatisches deutsches »mit uns zu kommen« angemessen.
