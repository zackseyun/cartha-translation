source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: de
  text: 'Und Gott sagte zu Bileam: „Du darfst nicht mit ihnen gehen. Du darfst das Volk nicht verfluchen, denn es ist gesegnet[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen der Singular: „denn es ist gesegnet“. Gemeint ist das Volk als kollektive Einheit; sinngemäß kann man auch sagen: „denn sie sind gesegnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der Verbform führt die Erzählung weiter; „Und … sagte“ gibt dies in natürlichem deutschem Erzählstil wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Hier bezeichnet אֱלֹהִים den Gott, der unmittelbar zu Bileam spricht; „Gott“ ist die sachgemäße Standardwiedergabe.
- source_word: לֹא תֵלֵךְ
  choice: Du darfst nicht gehen
  rationale: לֹא mit dem Imperfekt hat hier in direkter göttlicher Rede verbietende Kraft. „Du darfst nicht“ ist im heutigen Deutsch klar und nachdrücklich, ohne altertümlich zu wirken.
- source_word: עִמָּהֶם
  choice: mit ihnen
  rationale: Die Präposition mit Pronominalsuffix bezieht sich auf Balaks Boten.
- source_word: לֹא תָאֹר
  choice: Du darfst nicht verfluchen
  rationale: Das Verb אָרַר bedeutet „verfluchen“. Wie im vorangehenden Satz wird das Verbot mit „darfst nicht“ ausgedrückt.
- source_word: אֶת הָעָם
  choice: das Volk
  rationale: הָעָם bezeichnet Israel als kollektive Einheit. Das deutsche „Volk“ bewahrt sowohl den bestimmten Bezug als auch den Singular.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für das Verbot ein. „Denn“ verbindet die Begründung in direkter Rede natürlich und würdig.
- source_word: בָרוּךְ הוּא
  choice: es ist gesegnet
  rationale: Prädikatsadjektiv und Pronomen stehen im maskulinen Singular und beziehen sich auf das kollektiv-singularische הָעָם. Da „Volk“ im Deutschen sächlich und singularisch ist, bewahrt „es ist gesegnet“ die grammatische und kollektive Aussage genau.
theological_decisions:
- issue: Bezug und Numerus in der Aussage „gesegnet“
  choice: „denn es ist gesegnet“ bezieht sich kollektiv auf Israel als Volk.
  alternative: „denn sie sind gesegnet“
  rationale: Der hebräische Text verwendet Singularformen (בָרוּךְ הוּא) mit dem Kollektivnomen הָעָם. Das deutsche „Volk … es“ erhält diesen Kollektivsingular ohne Individualisierung und ohne lehrmäßige Ergänzung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Du darfst nicht“ formuliert das göttliche Verbot natürlich und bestimmt; „verfluchen“ ist hier idiomatischer als das mögliche, aber weniger flüssige „einen Fluch aussprechen über“.
