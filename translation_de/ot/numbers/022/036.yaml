base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: de
  text: Als Balak hörte, dass Bileam gekommen war, ging er ihm bei der Stadt Moabs[a] entgegen, die an der Grenze des Arnon liegt, am äußersten Ende der Grenze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei einer Stadt Moabs“. Die hebräische Wendung kann eine bestimmte, bekannte Stadt Moabs oder allgemeiner eine zu Moab gehörende Stadt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am äußersten Ende des Gebietes“. Das hebräische Wort für „Grenze“ kann je nach Zusammenhang auch „Gebiet“ oder „Territorium“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: שׁמע bedeutet gewöhnlich „hören“. Die schlichte Wiedergabe lässt offen, auf welchem Weg Balak die Nachricht erhielt.
- source_word: כִּי בָא בִלְעָם
  choice: dass Bileam gekommen war
  rationale: Der mit כִּי eingeleitete Satz bezeichnet den Inhalt dessen, was Balak hörte. Das deutsche Plusquamperfekt bildet die zeitliche Abfolge natürlich ab.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: ging er ihm … entgegen
  rationale: Die Verbindung aus יצא und לקראת bezeichnet eine Bewegung hinaus auf eine Person zu. „Entgegenging“ ist im Deutschen idiomatisch und bleibt hinsichtlich der Art des Empfangs neutral.
- source_word: אֶל עִיר מוֹאָב
  choice: bis zur Stadt Moabs
  rationale: אֶל kennzeichnet bei einem Bewegungsverb das Ziel. „Bis zur“ fügt sich natürlich in die deutsche Konstruktion „jemandem entgegengehen“. עִיר מוֹאָב wird primär als bestimmte, zu Moab gehörende Stadt verstanden; die mögliche unbestimmte Lesart bleibt in der Fußnote erhalten.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: Sie liegt am Arnon, an der Grenze
  rationale: Die Formulierung gibt die geografische Lage am Arnon als Grenzlinie wieder, ohne den Flussnamen selbst mit dem Wort „Grenze“ gleichzusetzen.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: am äußersten Ende der Grenze
  rationale: קצה bezeichnet Ende oder äußersten Rand. Die erneute Wiedergabe von גבול als „Grenze“ bewahrt die auffällige Wiederholung des Hebräischen; „Gebiet“ bleibt als mögliche Bedeutung in der Fußnote.
