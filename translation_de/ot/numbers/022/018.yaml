source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: de
  text: 'Bileam antwortete den Dienern Balaks: „Selbst wenn Balak mir sein Haus voll Silber und Gold gäbe, könnte ich mich nicht über das Wort Jahwes, meines Gottes, hinwegsetzen[a], um auch nur etwas Kleines oder Großes zu tun.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über den Mund Jahwes, meines Gottes, hinausgehen“; eine Wendung dafür, seinen Ausspruch zu überschreiten oder zu missachten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: Bileam antwortete
  rationale: Die hebräische Antwortformel wird im natürlichen deutschen Erzählstil knapp wiedergegeben; ein zusätzliches „und sagte“ wäre unnötig schwerfällig.
- source_word: עַבְדֵי בָלָק
  choice: den Dienern Balaks
  rationale: „Diener“ wahrt die soziale Bezeichnung, ohne den Kontext unnötig auf Sklaverei oder ein bestimmtes Hofamt festzulegen.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: Selbst wenn Balak mir … gäbe
  rationale: Der hypothetische Bedingungssatz hat im Zusammenhang eine einräumende Wirkung; der Konjunktiv gibt diese im Deutschen natürlich wieder.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: sein Haus voll Silber und Gold
  rationale: Bewahrt das anschauliche hebräische Bild großen Reichtums in idiomatischem Deutsch.
- source_word: לֹא אוּכַל
  choice: könnte ich … nicht
  rationale: Gibt die ausdrücklich bezeichnete Unfähigkeit wieder und stimmt grammatisch mit der hypothetischen Bedingung überein.
- source_word: לַעֲבֹר אֶת פִּי יְהוָה
  choice: mich nicht über das Wort Jahwes … hinwegsetzen
  rationale: Die Wendung lautet wörtlich etwa „über den Mund Jahwes hinausgehen“ und bezeichnet das Überschreiten oder Missachten seines Ausspruchs. Die deutsche Formulierung bewahrt das Motiv des Überschreitens und bleibt verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: אֱלֹהָי
  choice: meines Gottes
  rationale: Bewahrt die persönliche Zuordnung in Bileams eigener Aussage, ohne darüber hinausgehende theologische Folgerungen einzutragen.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: irgendetwas tun, sei es klein oder groß
  rationale: Gibt die Merismusformel verständlich wieder und erhält zugleich das Gegensatzpaar „klein oder groß“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. Die Wiedergabe als Eigenname macht diese sprachliche Form sichtbar, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Bileams Verhältnis zu Jahwes Ausspruch
  choice: ausgesagte Unfähigkeit, sich über Jahwes Wort hinwegzusetzen
  alternative: bloße Weigerung, Jahwes Gebot zu übertreten
  rationale: לֹא אוּכַל bedeutet „ich kann nicht“, während die folgende Wendung das Überschreiten des göttlichen Ausspruchs bezeichnet. Die Übersetzung erhält sowohl die Modalität als auch die idiomatische Aussage.
- issue: Umfang des verbotenen Handelns
  choice: irgendetwas tun, sei es klein oder groß
  alternative: etwas Kleines oder Großes tun
  rationale: Das Gegensatzpaar ist umfassend gemeint. „Irgendetwas“ verdeutlicht diese Reichweite, während „klein oder groß“ die Form des Ausgangstextes bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und nachdrücklich; die hebräische Doppelformel „antwortete und sagte“ wird idiomatisch verkürzt. Der Name „Bileam“ folgt der etablierten deutschen Bibelnamenform.
