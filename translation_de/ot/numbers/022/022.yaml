id: NUM.22.22
reference: Numbers 22:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: de
  text: Doch Gottes Zorn entbrannte, weil er unterwegs war. Da stellte sich der Engel Jahwes als Gegner[a] in den Weg. Bileam ritt auf seiner Eselin[b], und seine beiden jungen Männer waren bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שָׂטָן (satan) bedeutet hier „Gegner“ oder „Widersacher“; es ist nicht notwendigerweise der Eigenname Satan.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet ausdrücklich eine weibliche Eselin.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: Gottes Zorn entbrannte
  rationale: Die deutsche Wendung bewahrt das anschauliche hebräische Bild vom aufflammenden Zorn und klingt zugleich natürlich und würdig.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: weil er unterwegs war
  rationale: Die kausale Funktion von כִּי und der durative Aspekt des Partizips werden wiedergegeben, ohne den im Hebräischen nicht ausdrücklich genannten Beweggrund näher zu bestimmen.
- source_word: וַיִּתְיַצֵּב
  choice: stellte sich … in den Weg
  rationale: Die Form bezeichnet ein bewusstes Positionieren; die deutsche Wendung vermittelt sowohl die räumliche als auch die konfrontative Aussage.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ bezeichnet hier im Erzählzusammenhang ein himmlisches Wesen; der Gottesname wird als Jahwe wiedergegeben.
- source_word: לְשָׂטָן לוֹ
  choice: als Gegner
  rationale: שָׂטָן ist hier ein Gattungsbegriff für einen Gegner oder Widersacher und beschreibt die Rolle des Engels gegenüber Bileam.
- source_word: וְהוּא רֹכֵב
  choice: Bileam ritt
  rationale: Der Eigenname klärt im Deutschen den Bezug des Pronomens, da unmittelbar zuvor der Engel genannt wurde; das Partizip beschreibt die begleitende Situation.
- source_word: אֲתֹנוֹ
  choice: auf seiner Eselin
  rationale: Das hebräische Wort bezeichnet ausdrücklich eine weibliche Eselin; diese Information lässt sich im Deutschen natürlich im Haupttext bewahren.
- source_word: שְׁנֵי נְעָרָיו
  choice: seine beiden jungen Männer
  rationale: Die Wiedergabe bleibt bei der Grundbedeutung, ohne die Männer unbelegt als Diener oder Begleiter festzulegen.
- source_word: עִמּוֹ
  choice: waren bei ihm
  rationale: Die deutsche Formulierung ergänzt das für einen vollständigen Satz erforderliche Verb und gibt die Begleitung sachgerecht wieder.
theological_decisions:
- issue: Bedeutung von שָׂטָן an dieser Stelle
  choice: Gattungsbegriff „Gegner“
  alternative: Eigenname oder Titel „Satan“
  rationale: Syntax und Kontext bezeichnen die gegnerische Funktion des Engels. Ein Eigenname würde eine spätere Vorstellung in den Text eintragen, die hier nicht verlangt ist.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift gibt den im hebräischen Text stehenden Eigennamen erkennbar wieder.
- issue: Bezug von Gottes Zorn auf Bileams Aufbruch
  choice: weil er unterwegs war
  alternative: weil er ging / weil er loszog
  rationale: Die Formulierung wahrt die Spannung zum zuvor erteilten Aufbruchsbefehl und fügt keine Erklärung dafür hinzu, welcher innere Beweggrund oder welche besondere Art des Gehens Gottes Zorn auslöste.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. „Bileam“ ersetzt im dritten Satz das wörtliche Pronomen, um nach der Erwähnung des Engels einen irreführenden Bezug zu vermeiden. Die Formulierung „unterwegs war“ lässt die im Kontext bestehende theologische Spannung bewusst offen.
