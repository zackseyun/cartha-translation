  text: וַֽ/יַּעֲמֹד֙ מַלְאַ֣ךְ יְהוָ֔ה בְּ/מִשְׁע֖וֹל הַ/כְּרָמִ֑ים גָּדֵ֥ר מִ/זֶּ֖ה וְ/גָדֵ֥ר מִ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: de
  text: Da stellte sich der Engel[a] Jahwes auf einem engen Weg zwischen den Weinbergen auf, mit einer Mauer auf dieser Seite und einer Mauer auf jener Seite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Bote Jahwes. Das hebräische Wort kann sowohl „Bote“ als auch „Engel“ bedeuten; im Zusammenhang ist ein übernatürliches Wesen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Da stellte sich
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da“ markiert den nächsten Handlungsschritt, und „stellte sich“ gibt die bewusste Positionierung natürlich wieder.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten; im erzählerischen Zusammenhang ist ein übernatürliches Wesen gemeint. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: auf einen engen Weg zwischen den Weinbergen
  rationale: מִשְׁעוֹל bezeichnet einen schmalen Pfad oder Hohlweg. Die Mauern zu beiden Seiten stützen die räumliche Wiedergabe „zwischen den Weinbergen“.
- source_word: גָּדֵר
  choice: Mauer
  rationale: גָּדֵר bezeichnet eine Einfriedung, Mauer oder einen Zaun. „Mauer“ passt zum Weinbergbild, ohne das im Hebräischen nicht genannte Baumaterial festzulegen.
- source_word: מִזֶּה וְגָדֵר מִזֶּה
  choice: auf der einen Seite ... und auf der anderen ebenfalls
  rationale: Die wiederholte Wendung bezeichnet eine Begrenzung auf beiden Seiten; die deutsche Form ist klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מַלְאָךְ
  choice: Engel
  alternative: Bote
  rationale: Das Wort ist lexikalisch mehrdeutig, doch der weitere Erzählzusammenhang beschreibt eine für Bileam zunächst unsichtbare übernatürliche Gestalt; daher ist „Engel“ im Haupttext sachgerecht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah an der hebräischen Satzstruktur, klingt aber natürlich. Kein „Steinmauer“, da das Material im Ausgangstext nicht genannt wird.
