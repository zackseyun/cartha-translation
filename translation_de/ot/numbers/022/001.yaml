id: NUM.22.1
reference: Numbers 22:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְב֣וֹת מוֹאָ֔ב מֵ/עֵ֖בֶר לְ/יַרְדֵּ֥ן יְרֵחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: de
  text: Dann brachen die Israeliten[a] auf und lagerten in den Ebenen Moabs, jenseits des Jordan[b], gegenüber von Jericho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«; dies ist eine übliche Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »auf der anderen Seite des Jordan«. Die Ortsangabe hängt vom geografischen Standpunkt des Erzählers ab.'
    reason: lexical_alternative
  - marker: c
    text: Jericho dient hier als Orientierungspunkt für die Lage der Ebenen Moabs auf der Ostseite des Jordan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: brachen … auf
  rationale: Das Verb נסע bezeichnet in den Wüstenwanderungen das Abbrechen des Lagers und den anschließenden Aufbruch; die deutsche Wendung ist natürlich und präzise.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht »die Söhne Israels«; als feste Volksbezeichnung meint die Wendung hier das Volk Israel insgesamt. »Die Israeliten« gibt diese Funktion in modernem Deutsch klar wieder, während die wörtliche Form in der Fußnote erhalten bleibt.
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: חנה bedeutet, ein Lager aufzuschlagen beziehungsweise zu lagern. »Lagerten« ist im Deutschen knapp, würdig und idiomatisch.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: in den Ebenen Moabs
  rationale: עַרְבוֹת bezeichnet offene Ebenen beziehungsweise Steppengebiet. »Ebenen Moabs« ist verständlich und als geografische Bezeichnung etabliert.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Wendung bezeichnet die andere Seite des Jordan relativ zum Standpunkt des Erzählers. »Jenseits des Jordan« bewahrt diese perspektivische Relation, ohne sie weiter festzulegen.
- source_word: יְרֵחוֹ
  choice: gegenüber von Jericho
  rationale: Jericho dient als Orientierungspunkt für den Lagerplatz östlich des Jordan. »Gegenüber von Jericho« macht die geografische Beziehung im Deutschen klar, ohne Jericho selbst zum Lagerort zu erklären.
