translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eselin“ erhält die im Hebräischen ausdrücklich weibliche Tierbezeichnung. Die rhetorischen Fragen bleiben direkt; die leicht gehobene Wendung „zu … gepflegt“ bewahrt den habituellen Sinn der hebräischen Verbkonstruktion.
