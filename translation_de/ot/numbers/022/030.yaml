  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: de
  text: 'Da sagte die Eselin zu Bileam: „Bin ich nicht deine Eselin, auf der du dein Leben lang bis zum heutigen Tag geritten bist? Habe ich mich dir gegenüber jemals so verhalten[a]?“ Er antwortete: „Nein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verwendet eine nachdrückliche Verbverbindung und fragt nach gewohnheitsmäßigem Verhalten: „Habe ich je die Gewohnheit gehabt, mich dir gegenüber so zu verhalten?“'
    reason: Erläutert die habituelle und nachdrückliche Nuance von הַהַסְכֵּן הִסְכַּנְתִּי, ohne eine unidiomatische Formulierung als wörtliche Übersetzung auszugeben.
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: die Eselin / deine Eselin
  rationale: אָתוֹן bezeichnet ausdrücklich einen weiblichen Esel. Anders als im Englischen ist „Eselin“ im Deutschen eine natürliche und gut verständliche Bezeichnung, sodass die Geschlechtsangabe im Haupttext erhalten bleibt.
- source_word: הֲלוֹא אָנֹכִי
  choice: Bin ich nicht
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. „Bin ich nicht“ gibt diese Funktion idiomatisch und direkt wieder.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: auf der du … geritten bist
  rationale: Die Präposition עַל bezeichnet hier das Reiten auf dem Tier. Die deutsche Relativkonstruktion ist klar und natürlich.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: dein Leben lang bis zum heutigen Tag
  rationale: Die Wendung bezeichnet die gesamte bisherige Lebenszeit Bileams. Die Übersetzung bewahrt sowohl den zeitlichen Ausgangspunkt als auch die ausdrückliche Grenze „bis zu diesem Tag“.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: Habe ich … jemals so zu verhalten gepflegt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb von סכן fragt nach einem gewohnheitsmäßigen Verhalten. „Zu … gepflegt“ bildet diesen habituellen Sinn in würdigem, verständlichem Deutsch ab.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: mich dir gegenüber … so zu verhalten
  rationale: כֹּה verweist auf das unmittelbar vorausgehende Verhalten der Eselin. Die idiomatische Formulierung wahrt den Bezug auf Bileam, den לְךָ ausdrückt.
- source_word: וַיֹּאמֶר לֹא
  choice: 'Er antwortete: „Nein.“'
  rationale: Im Deutschen bezeichnet „antwortete“ die Funktion des Sprechakts in diesem Dialog natürlicher als ein wörtliches „sagte“; die knappe Verneinung bleibt erhalten.
