  text: אֶת הַ/כֶּ֥בֶשׂ אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָֽ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: de
  text: Das eine Lamm sollst du am Morgen darbringen, und das zweite Lamm sollst du zwischen den Abenden[a] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „zwischen den Abenden“, eine traditionelle Zeitangabe für die Zeit gegen Abend, etwa in der späten Nachmittags- oder Dämmerungszeit.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: Lamm
  rationale: כֶּבֶשׂ bezeichnet ein Lamm, im Opferkontext gewöhnlich ein junges männliches Schaf. „Lamm“ ist hier die natürliche und hinreichend genaue deutsche Wiedergabe.
- source_word: אֶחָד
  choice: das eine
  rationale: Die Kardinalzahl bedeutet wörtlich „eins/eines“. „Das eine“ bewahrt diese Formulierung und steht natürlich im Gegensatz zu „das zweite“.
- source_word: תַּעֲשֶׂה
  choice: sollst du darbringen
  rationale: עשה bedeutet grundsätzlich „tun/machen“, wird in Opferanweisungen aber idiomatisch für das Zubereiten beziehungsweise Darbringen eines Opfers verwendet. „Darbringen“ gibt den kultischen Sinn klar wieder.
- source_word: בַבֹּקֶר
  choice: am Morgen
  rationale: Die Präpositionalverbindung wird im modernen Standarddeutsch natürlich mit „am Morgen“ wiedergegeben.
- source_word: הַשֵּׁנִי
  choice: das zweite
  rationale: שֵׁנִי ist die Ordnungszahl „zweite“ und kennzeichnet die Reihenfolge ausdrücklich.
- source_word: בֵּין הָעַרְבָּיִם
  choice: zwischen den Abenden
  rationale: Die wörtliche Wendung ist zeitlich und kulturgeschichtlich nicht völlig eindeutig. Die formnahe Wiedergabe bewahrt diese Offenheit; die Fußnote erläutert den gemeinten ungefähren Zeitraum.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, während die umstrittene traditionelle Zeitangabe bewusst formnah erhalten bleibt.
