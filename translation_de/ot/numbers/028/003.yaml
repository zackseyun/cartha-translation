source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: de
  text: 'Und du sollst zu ihnen sagen: »Dies ist das Feueropfer[a], das ihr Jahwe darbringen sollt: täglich zwei einjährige, fehlerlose männliche Lämmer als regelmäßiges Brandopfer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die durch Feuer dargebrachte Opfergabe« oder »Feuergabe«. Die genaue Herleitung und Bedeutungsnuance des hebräischen Ausdrucks ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: das Feueropfer
  rationale: Das kultische Substantiv bezeichnet eine auf dem Altarfeuer dargebrachte Opfergabe. „Feueropfer“ ist im Deutschen knapp, verständlich und quellennah; die mögliche Nuance einer für Gott bestimmten Speisegabe bleibt in der Fußnote erhalten.
- source_word: תַּקְרִיבוּ
  choice: ihr … darbringen sollt
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das rituelle Heranbringen beziehungsweise Darbringen einer Gabe. „Darbringen“ ist natürliches, würdiges Deutsch.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כְּבָשִׂים
  choice: männliche Lämmer
  rationale: Das maskuline Substantiv bezeichnet hier Lämmer; die ausdrückliche Geschlechtsangabe wahrt die Genauigkeit der Opfervorschrift.
- source_word: בְּנֵי שָׁנָה
  choice: ein Jahr alte
  rationale: Die hebräische Wendung bedeutet in diesem Zusammenhang „ein Jahr alt“ und wird transparent und idiomatisch wiedergegeben.
- source_word: תְמִימִם
  choice: fehlerlose
  rationale: Im Opferrecht sind Tiere ohne körperlichen Fehler oder Makel gemeint. „Fehlerlos“ wahrt diese kultische Bedeutung ohne unnötige moralische Nebenbedeutung.
- source_word: לַיּוֹם
  choice: Tag für Tag
  rationale: 'In Verbindung mit „zwei“ hat die Wendung distributiven Sinn: An jedem Tag sind zwei Tiere darzubringen.'
- source_word: עֹלָה
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte und klare deutsche Bezeichnung für das vollständig auf dem Altar verbrannte Opfer.
- source_word: תָמִיד
  choice: regelmäßiges
  rationale: תמיד bezeichnet hier die fortlaufend wiederkehrende, täglich vorgeschriebene Darbringung, nicht einen ununterbrochenen Verbrennungsvorgang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch den traditionell verwendeten Titel „der HERR“.
- issue: Kultische Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die genaue Herleitung und Bedeutungsnuance des Ausdrucks ist umstritten. Der Haupttext bewahrt den klaren Bezug zur Darbringung auf dem Altarfeuer; die Fußnote nennt die kultische Deutung als für Gott bestimmte Speisegabe, ohne ein grob wörtliches Ernähren Gottes zu unterstellen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Anrede wechselt entsprechend dem Hebräischen vom singularischen Mose („du“) zur pluralischen Gemeinde („ihr“). „Tag für Tag“ stellt klar, dass täglich zwei Lämmer gemeint sind.
