  terminology: „Jahwe“ ist konsequent. „Speiseopfer“, „Trankopfer“ und „Feueropfer“ sind etablierte und angemessene kultische Fachbegriffe. Die Fußnote zu בֵּין הָעַרְבָּיִם bewahrt die umstrittene zeitliche Nuance. Die Alternativformulierung zu אִשֶּׁה sollte den Feuerbezug klarer ausdrücken.
