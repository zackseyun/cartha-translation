  to: Und das zweite Lamm sollst du zwischen den Abenden[a] darbringen. Entsprechend dem Speiseopfer des Morgens und dem dazugehörigen Trankopfer sollst du es als Feueropfer[b] darbringen, zu einem wohlgefälligen Duft für Jahwe.
