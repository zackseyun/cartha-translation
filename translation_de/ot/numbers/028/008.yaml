  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: de
  text: Und das zweite Lamm sollst du zwischen den Abenden[a] darbringen. Entsprechend dem Speiseopfer des Morgens und dem dazugehörigen Trankopfer sollst du es als Feueropfer[b] darbringen, zu einem wohlgefälligen Duft für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwischen den Abenden«; der traditionelle hebräische Ausdruck wird häufig als »in der Abenddämmerung« verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine Opfergabe durch Feuer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: das zweite Lamm
  rationale: כֶּבֶשׂ bezeichnet im Opferkontext gewöhnlich ein Lamm; »zweite« wahrt die Abfolge gegenüber dem Morgenopfer.
- source_word: תַּעֲשֶׂה
  choice: sollst du darbringen
  rationale: Das wörtliche »machen/tun« wird im deutschen Opferkontext idiomatisch und sachgerecht mit »darbringen« wiedergegeben.
- source_word: בֵּין הָעַרְבָּיִם
  choice: zwischen den Abenden
  rationale: Die formnahe Wiedergabe bewahrt die nicht völlig eindeutige zeitliche Bedeutung des hebräischen Ausdrucks; die geläufige Deutung steht in der Fußnote.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: wie das Speiseopfer am Morgen
  rationale: מִנְחָה bezeichnet hier das begleitende Speise- beziehungsweise Getreideopfer und nicht allgemein eine Gabe.
- source_word: וּכְנִסְכּוֹ
  choice: und das dazugehörige Trankopfer
  rationale: Das Suffix bezieht sich auf das morgendliche Opferarrangement; »dazugehörig« macht diesen Bezug im Deutschen natürlich verständlich.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Die Wiedergabe erhält den lexikalisch wichtigen Bezug zum Feuer und ist im Deutschen als kultischer Begriff verständlich.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein Duft, der … gefällt
  rationale: Die natürliche deutsche Formulierung bewahrt das Bild eines für Gott angenehmen beziehungsweise wohlgefälligen Duftes.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe »Jahwe« lässt den persönlichen Bundesnamen des Ausgangstextes sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitangabe בֵּין הָעַרְבָּיִם
  choice: zwischen den Abenden
  alternative: in der Abenddämmerung
  rationale: Da die genaue zeitliche Bestimmung des hebräischen Idioms umstritten ist, bleibt die formnahe und offene Wendung im Haupttext; die übliche Deutung wird in einer Fußnote genannt.
- issue: Bedeutung von אִשֵּׁה
  choice: Feueropfer
  alternative: Speiseopfer / Gabe für Gott
  rationale: »Feueropfer« bewahrt den sprachlichen Bezug zum Verbrennen, ohne die Art oder theologische Funktion der Opfergabe enger festzulegen, als der Ausdruck es verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am Hebräischen, wird aber für natürliche Lesbarkeit in zwei Sätze gegliedert. Kultische Fachbegriffe wie »Speiseopfer«, »Trankopfer« und »Feueropfer« werden beibehalten.
