  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: de
  text: Und sein Trankopfer soll für jedes Lamm[a] ein Viertel Hin betragen. Im Heiligtum[b] sollst du Jahwe ein Trankopfer aus berauschendem Getränk[c] ausgießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für ein Lamm“; wörtlich: „für das eine Lamm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an heiliger Stätte“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist ein berauschendes Getränk; um welche Art von Getränk es sich genau handelt, wird nicht gesagt.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: Und sein Trankopfer soll … betragen
  rationale: Das Substantiv bezeichnet die begleitende Flüssigkeitsgabe; „Trankopfer“ ist im Deutschen klar und im Opferkontext geläufig. Das Suffix wird mit „sein“ wiedergegeben und bezieht sich auf das betreffende Lamm beziehungsweise Opfer.
- source_word: רְבִיעִת הַהִין
  choice: ein Viertel Hin
  rationale: Die genaue Mengenangabe bleibt erhalten; die antike Maßeinheit wird nicht spekulativ in ein modernes Maß umgerechnet.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: für jedes Lamm
  rationale: Wörtlich steht „für das eine Lamm“. Im Zusammenhang legt die Form die Menge je einzelnem Lamm fest; „für jedes Lamm“ gibt diese distributive Funktion natürlich wieder.
- source_word: בַּקֹּדֶשׁ
  choice: Am heiligen Ort
  rationale: Im kultischen Zusammenhang ist ein heiliger Bereich beziehungsweise das Heiligtum gemeint. „Am heiligen Ort“ bleibt transparent und vermeidet eine unnötig enge räumliche Festlegung.
- source_word: הַסֵּךְ
  choice: sollst du … ausgießen
  rationale: Die Form von נסך fordert zum kultischen Ausgießen auf. Die deutsche Soll-Konstruktion entspricht dem verbindlichen Anweisungsstil des Abschnitts.
- source_word: נֶסֶךְ
  choice: ein Trankopfer
  rationale: Die Wiederholung des Opferbegriffs wird wie im Hebräischen ausdrücklich beibehalten.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: שֵׁכָר bezeichnet ein berauschendes, vergorenes Getränk, ohne hier dessen genaue Art festzulegen. Die Formulierung ist verständlich und vermeidet die nicht gesicherte Präzisierung als Bier.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben; der Dativ nach „ausgießen“ drückt aus, wem das Opfer gilt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird erkennbar als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug und kultische Bedeutung von שֵׁכָר
  choice: berauschendes Getränk
  alternative: Rauschtrank; Bier; vergorenes Getränk
  rationale: Der Text nennt ein berauschendes Getränk als Trankopfer, bestimmt aber die konkrete Getränkesorte nicht. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger Opferterminologie. Die Satzstruktur bleibt nah am Hebräischen, wird aber für heutige Leser natürlich formuliert. Die antike Maßeinheit „Hin“ und die sachliche Unbestimmtheit der Getränkesorte bleiben erhalten.
