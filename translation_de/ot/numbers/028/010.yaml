  text: עֹלַ֥ת שַׁבַּ֖ת בְּ/שַׁבַּתּ֑/וֹ עַל עֹלַ֥ת הַ/תָּמִ֖יד וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: de
  text: Das Brandopfer für den Sabbat wird an jedem Sabbat zusätzlich zum regelmäßigen Brandopfer und dessen Trankopfer dargebracht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת שַׁבַּת
  choice: Brandopfer für den Sabbat
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; „Brandopfer“ ist der geläufige deutsche Kultbegriff. Die Genitivverbindung bezeichnet hier das für den Sabbat bestimmte Opfer.
- source_word: בְּשַׁבַּתּוֹ
  choice: an jedem Sabbat
  rationale: Die Verbindung aus בְּ, שַׁבָּת und dem Suffix hat im wiederkehrenden Opferkalender distributiven Sinn. „An jedem Sabbat“ gibt diesen Sinn natürlich wieder, ohne das im Deutschen missverständliche „an seinem Sabbat“.
- source_word: עַל
  choice: zusätzlich zu
  rationale: עַל kennzeichnet hier die Hinzufügung zum bereits vorgeschriebenen regelmäßigen Opfer, nicht eine räumliche Lage darüber.
- source_word: עֹלַת הַתָּמִיד
  choice: regelmäßiges Brandopfer
  rationale: תָּמִיד bezeichnet die fortlaufend beziehungsweise regelmäßig vorgeschriebene Darbringung. „Regelmäßig“ ist verständlich und vermeidet den Eindruck eines ununterbrochen brennenden einzelnen Opfers.
- source_word: וְנִסְכָּהּ
  choice: und dem dazugehörigen Trankopfer
  rationale: נֶסֶךְ ist ein ausgegossenes Begleitopfer; „Trankopfer“ ist der etablierte und verständliche deutsche Ausdruck. Das feminine Suffix verweist auf das Brandopfer; „dazugehörig“ macht die Beziehung im Deutschen klar.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Da der hebräische Vers ein knapper Nominalsatz ist, wird für idiomatisches Deutsch „soll … dargebracht werden“ ergänzt; dies entspricht dem anweisenden Kontext, ohne eine zusätzliche kultische Aussage einzuführen.
