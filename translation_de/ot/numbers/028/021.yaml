  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: de
  text: Je ein Zehntel Efa sollst du für jedes der sieben Lämmer zubereiten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ein Zehntel, ein Zehntel sollst du für das eine Lamm zubereiten, für die sieben Lämmer.“ Die Wiederholung hat verteilenden Sinn: ein Zehntel für jedes Lamm. Gemeint ist im Zusammenhang ein Zehntel Efa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: je ein Zehntel Efa
  rationale: 'Die Wiederholung bezeichnet eine Verteilung: für jedes einzelne Lamm ein Zehntel. Im Zusammenhang der Speisopfer ist damit ein Zehntel Efa gemeint; „je“ gibt die distributive Funktion im Deutschen natürlich wieder.'
- source_word: תַּעֲשֶׂה
  choice: sollst du … zubereiten
  rationale: Das Verb bedeutet grundsätzlich „tun/machen“; bei einer vorgeschriebenen Opfergabe ist „zubereiten“ idiomatisch, ohne wie „darbringen“ den Vorgang enger zu bestimmen.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: für jedes … Lamm
  rationale: Die Einzahl mit Artikel und Zahlwort steht zusammen mit der wiederholten Mengenangabe distributiv und bezeichnet die Zuteilung pro Lamm.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: der sieben Lämmer
  rationale: Die Wendung nennt die vollständige Gruppe. Die Einbindung als „jedes der sieben Lämmer“ bewahrt den Sinn und vermeidet im Deutschen eine schwerfällige Wiederholung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die distributive Wiederholung des Hebräischen wird mit „je“ wiedergegeben; die Maßeinheit Efa wird zur kontextuellen Verdeutlichung ergänzt und in der Fußnote erläutert.
