  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; auch mit „Jehova“ wiedergegeben.'
    reason: Alternative Wiedergabe des Gottesnamens
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Piel-Form von דבר bildet eine geläufige hebräische Erzählformel. „Und … sprach“ bewahrt deren feierlichen Erzählrhythmus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier die Richtung beziehungsweise den Adressaten der Rede; „zu Mose“ ist idiomatisches modernes Deutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den folgenden direkten Redewortlaut ein. Im Deutschen erfüllt ein Doppelpunkt diese Funktion natürlich und ohne das schwerfällige „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Namen wieder; die Fußnote weist auf die hebräische Schreibweise und die gebräuchliche Alternative „Jehova“ hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt kündigt die in Vers 2 folgende direkte Rede an und gibt לֵאמֹר idiomatisch wieder.
