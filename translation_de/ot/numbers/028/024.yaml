source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: de
  text: Nach diesem Muster sollt ihr sieben Tage lang Tag für Tag eine Speise als Feueropfer darbringen, die für Jahwe ein angenehmer Duft ist; zusätzlich zu dem regelmäßigen Brandopfer und dessen Trankopfer soll sie dargebracht werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: So … sie
  rationale: Die Vergleichspartikel כ bezeichnet die Übereinstimmung mit den zuvor festgelegten Opfern. Im Deutschen gibt „So sollt ihr sie … darbringen“ diese rückverweisende Art und Weise natürlicher wieder als das steife „Wie diese“.
- source_word: תַּעֲשׂוּ
  choice: sollt ihr … darbringen
  rationale: עשה bedeutet allgemein „tun/machen“, bezeichnet hier aber den Vollzug der Opferhandlung; „darbringen“ ist im kultischen Zusammenhang präzise und verständlich.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: sieben Tage lang Tag für Tag
  rationale: Die Formulierung bewahrt sowohl die Dauer von sieben Tagen als auch den distributiven Sinn der täglichen Wiederholung.
- source_word: לֶחֶם אִשֵּׁה
  choice: als Speise, ein Feueropfer
  rationale: לֶחֶם bezeichnet hier die Gott dargebrachte Opferspeise und nicht notwendig Brot; אִשֶּׁה wird mit dem traditionellen, transparenten Kultbegriff „Feueropfer“ wiedergegeben.
- source_word: רֵיחַ נִיחֹחַ
  choice: zum angenehmen Duft
  rationale: Die feste Opferformel beschreibt einen für Gott annehmbaren Duft. Die Wiedergabe erhält das konkrete Bild, ohne seine theologische Bedeutung auszudeuten.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: עַל עוֹלַת הַתָּמִיד
  choice: zusätzlich zum regelmäßigen Brandopfer
  rationale: עַל bezeichnet hier das Hinzukommen zu einem anderen Opfer; הַתָּמִיד ist das regelmäßig beziehungsweise beständig dargebrachte Brandopfer.
- source_word: יֵעָשֶׂה
  choice: soll es dargebracht werden
  rationale: Das passive עשה bezieht sich im Opferkontext auf das Darbringen; das Pronomen greift das zuvor beschriebene Opfer auf.
- source_word: וְנִסְכּוֹ
  choice: und dem dazugehörigen Trankopfer
  rationale: נסך ist ein ausgegossenes Begleitopfer. Das maskuline Suffix verweist auf das regelmäßige Brandopfer; „dazugehörig“ macht diesen Bezug im Deutschen klar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht im Ausgangstext ausdrücklich. „Jahwe“ wahrt den Charakter als Bundesname und folgt der vorgegebenen textlichen Entscheidung, statt ihn durch einen Titel zu ersetzen.
- issue: Opfersprache bei רֵיחַ נִיחֹחַ
  choice: zum angenehmen Duft
  alternative: zum beruhigenden Duft
  rationale: „Angenehmer Duft“ erhält das Opferbild und seine Aussage der Annahme durch Gott, ohne anzudeuten, das Opfer besänftige einen zuvor zornigen Gott.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher kultischer Terminologie. „Tag für Tag“ vermeidet die schwerfällige Satzstellung einer allzu wörtlichen Wiedergabe; „Brandopfer“, „Feueropfer“ und „Trankopfer“ bewahren die sachlichen Unterschiede der hebräischen Opferbegriffe.
