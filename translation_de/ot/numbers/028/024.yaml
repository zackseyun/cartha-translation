  to: Nach diesem Muster sollt ihr sieben Tage lang Tag für Tag eine Speise als Feueropfer darbringen, die für Jahwe ein angenehmer Duft ist; zusätzlich zu dem regelmäßigen Brandopfer und dessen Trankopfer soll sie dargebracht werden.
