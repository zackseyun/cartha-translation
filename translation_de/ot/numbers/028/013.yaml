    issue: Mehrdeutige Anbindung von „als Brandopfer“
    rationale: Die Formulierung „Feinmehl als Speisopfer … für jedes Lamm, als Brandopfer“ kann im Deutschen das Speisopfer als Brandopfer qualifizieren. Das ist sachlich und syntaktisch irreführend; die hebräische Schlussformel ist besser durch einen neuen Satz wiederzugeben.
  - severity: low
    issue: Maßangabe ohne „von“
    rationale: „ein Zehntel Efa“ ist möglich, aber „ein Zehntel einer Efa“ ist im modernen Standarddeutsch deutlich natürlicher und präzisiert die partitive Konstruktion.
  - severity: low
    issue: Fußnotenalternative „Speisegabe“ kollidiert terminologisch mit „Speisopfer“
    rationale: Da מִנְחָה im Haupttext bereits als „Speisopfer“ erscheint, legt „Speisegabe“ für אִשֶּׁה eine nicht erforderliche semantische Gleichsetzung nahe. „Eine Gott dargebrachte Gabe“ dokumentiert die mögliche Deutung, ohne die Begriffe zu verwischen.
  revised_text: und je ein Zehntel einer Efa Feinmehl als Speisopfer, mit Öl vermengt, für jedes Lamm. Es ist ein Brandopfer, ein wohlgefälliger Duft, ein Feueropfer[a] für Jahwe.
