  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: de
  text: und je ein Zehntel einer Efa Feinmehl als Speisopfer, mit Öl vermengt, für jedes Lamm. Es ist ein Brandopfer, ein wohlgefälliger Duft, ein Feueropfer[a] für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Gott dargebrachte Gabe.'
    reason: Lexikalische Alternative für אִשֶּׁה; die genaue Herleitung und Bedeutungsnuance des kultischen Ausdrucks ist umstritten.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: und je ein Zehntel Efa
  rationale: Die Wiederholung bezeichnet im Zusammenhang die auf jedes einzelne Lamm entfallende Menge. „Efa“ ergänzt die im Hebräischen vorausgesetzte Maßeinheit und „je“ gibt den distributiven Sinn natürlich wieder.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der geläufige deutsche Ausdruck für das im Opferdienst verwendete hochwertige, fein gemahlene Mehl.
- source_word: מִנְחָה
  choice: Speisopfer
  rationale: Im kultischen Zusammenhang bezeichnet das Wort hier die aus Mehl bestehende Opfergabe, nicht allgemein ein Geschenk.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Gibt die Zubereitung des Feinmehls präzise und in würdigem, verständlichem Deutsch wieder.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: für jedes Lamm
  rationale: 'Der bestimmte Singular hat in dieser Aufzählung distributive Funktion: Die angegebene Menge gilt für jedes einzelne Lamm.'
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Der technische Opferbegriff bezeichnet eine Opfergabe, die vollständig auf dem Altar verbrannt wird.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein wohlgefälliger Duft
  rationale: Die feste kultische Wendung drückt aus, dass das Opfer vor Gott Annahme findet; „wohlgefällig“ bewahrt diesen Sinn ohne grob körperliche Vorstellung.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Das seltene kultische Wort bezeichnet eine auf dem Altar dargebrachte Gabe und wird traditionell mit dem Feuer verbunden. „Feueropfer“ ist im Deutschen knapp, verständlich und näher an dieser Deutung als „Speiseopfer“, das hier bereits מִנְחָה wiedergibt.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Präposition bezeichnet den Empfänger beziehungsweise die Ausrichtung des Opfers.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname bleibt als Eigenname erkennbar und wird nicht durch einen Titel ersetzt.
- issue: Bedeutung des kultischen Ausdrucks אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die genaue Herleitung und Bedeutungsnuance des Ausdrucks ist umstritten. Der Haupttext bewahrt die traditionelle Verbindung mit dem Feuer; die mögliche Deutung als Gott dargebrachte Speise wird in der Fußnote offengelegt, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit den etablierten kultischen Begriffen „Speisopfer“ und „Brandopfer“. „Je“ verdeutlicht knapp die Verteilung auf jedes Lamm; der Doppelpunkt macht die zusammenfassende Opfercharakterisierung lesbar, ohne die nominale Dichte des Hebräischen aufzulösen.
