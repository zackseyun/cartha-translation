  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: de
  text: 'Und ihr Speiseopfer soll aus Feinmehl bestehen, das mit Öl vermengt ist: drei Zehntelmaße für den einen Stier[a] und zwei Zehntelmaße für den einen Widder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Zehntelmaß wird in diesem Opferzusammenhang gewöhnlich als ein Zehntel eines Efa verstanden.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Dazu kommt als Speiseopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das aus Getreide bestehende Speiseopfer. Die knappe, verblose hebräische Fügung wird im Deutschen natürlich ergänzt; das Suffix bezieht das Speiseopfer auf die zuvor genannten Tiere.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist die übliche Bezeichnung für hochwertiges feines Mehl als Opferzutat; „Feinmehl“ ist präzise und im Deutschen verständlich.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip beschreibt das rituelle Vermischen des Mehls mit Öl. „Vermengt“ bewahrt den kultischen Ton, ohne altertümlich unverständlich zu sein.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: drei Zehntel
  rationale: עִשָּׂרוֹן bezeichnet ein Zehntelmaß. Da der hebräische Text hier die übergeordnete Einheit nicht ausdrücklich nennt, bleibt sie im Haupttext unausgesprochen und wird in der Fußnote erläutert.
- source_word: לַפָּר הָאֶחָד
  choice: für den einen Stier
  rationale: פַּר bezeichnet einen jungen Stier beziehungsweise einen Stier aus der Rinderherde. „Den einen“ bildet Artikel plus אֶחָד ab und greift die vorgeschriebene Anzahl auf.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: zwei Zehntel
  rationale: Die Form bezeichnet zwei Zehntelmaße; die nicht ausdrücklich genannte Bezugsgröße wird nicht stillschweigend in den Haupttext eingefügt.
- source_word: לָאַיִל הָאֶחָד
  choice: für den einen Widder
  rationale: אַיִל bedeutet hier „Widder“. Die Formulierung „den einen Widder“ bewahrt die bestimmte Zählweise des Hebräischen.
