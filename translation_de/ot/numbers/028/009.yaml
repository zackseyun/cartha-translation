source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: de
  text: 'Und am Sabbattag: zwei einjährige, fehlerlose männliche Lämmer sowie zwei Zehntel eines Efa Feinmehl[a] als Getreideopfer, mit Öl vermengt, und das dazugehörige Trankopfer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwei Zehntel“; in den Opfergesetzen sind damit zwei Zehntel eines Efa gemeint.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Gussopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: Am Sabbattag aber
  rationale: Die Zeitangabe leitet das zusätzliche Sabbatopfer ein. „Aber“ gibt die anknüpfende Konjunktion idiomatisch wieder, ohne den Zusammenhang mit den vorherigen Vorschriften zu lösen.
- source_word: שְׁנֵי כְבָשִׂים
  choice: zwei … männliche Lämmer
  rationale: כְבָשִׂים bezeichnet junge Schafe und ist hier die männliche Form; die ausdrückliche Wiedergabe bewahrt die für Opferbestimmungen relevante Geschlechtsangabe.
- source_word: בְּנֵי שָׁנָה
  choice: einjährige
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne eines Jahres“ und bezeichnet Tiere im Alter von einem Jahr.
- source_word: תְּמִימִם
  choice: fehlerlose
  rationale: Im Opferkontext bezeichnet תמים Tiere ohne körperlichen Makel. „Fehlerlos“ ist präzise und in modernem Deutsch gut verständlich.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: sowie zwei Zehntel Efa
  rationale: Ein עִשָּׂרוֹן ist in den Opfergesetzen ein Zehntel eines Efa. Die Maßeinheit wird im Text ergänzt und durch eine Fußnote transparent gemacht.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת bezeichnet fein gemahlenes, hochwertiges Mehl, das für Opfer verwendet wurde.
- source_word: מִנְחָה
  choice: Getreideopfer
  rationale: In diesem priesterlichen Zusammenhang bezeichnet מִנְחָה ein aus Getreide bestehendes Opfer. „Getreideopfer“ ist für heutige Leser klarer als das traditionelle „Speisopfer“.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Die Formulierung beschreibt das Feinmehl als mit Öl vermischt; „vermengt“ wahrt den würdigen kultischen Stil.
- source_word: וְנִסְכּוֹ
  choice: und das dazugehörige Trankopfer
  rationale: נֶסֶךְ bezeichnet eine als Opfer ausgegossene Flüssigkeit. „Dazugehörige“ gibt das hebräische Possessivsuffix natürlich wieder, ohne einen möglichen Bezug grammatisch überzubestimmen.
