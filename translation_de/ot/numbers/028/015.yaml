  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: de
  text: Und ein Ziegenbock soll Yahweh als Sündopfer[a] dargebracht werden, zusätzlich zum regelmäßigen Brandopfer und dem dazugehörigen Trankopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann ein Opfer bezeichnen, das mit Unreinheit oder Sünde zusammenhängt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: ein Ziegenbock
  rationale: Die Konstruktverbindung bezeichnet einen männlichen Ziegenbock; die deutsche Wiedergabe ist natürlich und bewahrt die Geschlechtsangabe.
- source_word: אֶחָד
  choice: ein
  rationale: Das Zahlwort wird in idiomatischem Deutsch als unbestimmter Artikel wiedergegeben; die vorgeschriebene Einzahl bleibt eindeutig.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Im Opferkontext bezeichnet חַטָּאת das Sünd- beziehungsweise Reinigungsopfer. „Sündopfer“ ist die geläufige Hauptwiedergabe; die sachlich mögliche Alternative steht in der Fußnote.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als „Yahweh“ wiedergegeben; der Dativ ergibt sich im Deutschen aus „dargebracht werden“.
- source_word: עַל
  choice: zusätzlich zu
  rationale: עַל bezeichnet hier das Hinzukommen zum regelmäßigen Opfer, nicht eine räumliche Lage.
- source_word: עֹלַת הַתָּמִיד
  choice: das regelmäßige Brandopfer
  rationale: Die Wendung meint das fest und fortlaufend vorgeschriebene Brandopfer, ohne dass im Ausdruck selbst „täglich“ ergänzt werden muss.
- source_word: יֵעָשֶׂה
  choice: soll ... dargebracht werden
  rationale: Das wörtliche „gemacht werden“ wird im kultischen Zusammenhang idiomatisch und sachgerecht als Darbringung eines Opfers ausgedrückt.
- source_word: וְנִסְכּוֹ
  choice: und dem dazugehörigen Trankopfer
  rationale: Das Suffix bezieht sich auf das regelmäßige Brandopfer. „Dazugehörig“ macht diese Zuordnung im Deutschen klar und vermeidet den möglichen falschen Bezug auf den Ziegenbock.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: Jahwe; der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Yahweh“ bewahrt den persönlichen Bundesnamen statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Beide Bezeichnungen erfassen Aspekte der kultischen Funktion. Die traditionelle und allgemein verständliche Wiedergabe steht im Haupttext; die echte lexikalische Alternative wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält die Opferanweisung klar; „dazugehörig“ verdeutlicht den grammatischen Bezug des Trankopfers.
