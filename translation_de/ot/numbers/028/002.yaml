source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: de
  text: 'Gebiete den Israeliten und sage zu ihnen: »Ihr sollt darauf achten, mir meine Opfergabe, meine Speise für meine Feueropfer[a], meinen wohlgefälligen Duft[b] zur jeweils festgesetzten Zeit darzubringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für meine auf dem Altar verbrannten Opfergaben«.'
    reason: lexical_alternative
  - marker: b
    text: »Wohlgefälliger Duft« ist eine feste Opferformel für eine Gabe, die Gottes Wohlgefallen findet.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Gebiete
  rationale: Der Imperativ von צוה ist eine nachdrückliche Anweisung; »Gebiete« bewahrt diese Stärke in würdigem, verständlichem Deutsch.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die Wendung bezeichnet hier das Volk Israel als Ganzes. »Den Israeliten« ist im modernen Deutsch natürlich und schließt den korporativen Bezug ein, ohne die hebräische Formulierung unnötig hölzern wiederzugeben.
- source_word: קָרְבָּנִי
  choice: meine Opfergabe
  rationale: קָרְבָּן bezeichnet eine Gott dargebrachte Gabe. »Opfergabe« ist präziser als das mehrdeutige »Opfer« und bleibt allgemein genug für den Kontext.
- source_word: לַחְמִי
  choice: meine Speise
  rationale: Wörtlich »mein Brot«, im Opferkontext jedoch allgemeiner die Gott zugeordnete Opferspeise. »Speise« erhält die konkrete kultische Bildsprache.
- source_word: לְאִשַּׁי
  choice: für meine Feueropfer
  rationale: אִשֶּׁה bezeichnet eine auf dem Altar verbrannte Opfergabe. »Feueropfer« gibt den kultischen Vorgang knapp und transparent wieder.
- source_word: רֵיחַ נִיחֹחִי
  choice: meinen wohlgefälligen Duft
  rationale: Die feste Opferformel beschreibt einen Duft, der Gottes Wohlgefallen findet. Die konkrete Bildsprache bleibt erhalten, ohne sie abstrakt aufzulösen.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב
  choice: Ihr sollt darauf achten, … darzubringen
  rationale: שמר mit folgendem Infinitiv verlangt sorgfältige Beachtung. Diese deutsche Konstruktion gibt sowohl die Verpflichtung als auch die Sorgfalt wieder.
- source_word: בְּמוֹעֲדוֹ
  choice: zur jeweils festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet den bestimmten, angeordneten Zeitpunkt. »Jeweils« macht natürlich deutlich, dass jede Opfergabe zu ihrem vorgeschriebenen Termin darzubringen ist.
theological_decisions:
- issue: 'Anthropomorphe Opfersprache: »meine Speise« und »mein wohlgefälliger Duft«'
  choice: Die konkrete kultische Redeweise wird beibehalten.
  alternative: Abstrakte Paraphrase wie »die Opfer, die mir gefallen«.
  rationale: Der hebräische Text spricht bewusst konkret. Die Übersetzung soll diese Bildsprache weder vergröbern noch durch eine theologische Erklärung ersetzen.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  alternative: den Söhnen Israels
  rationale: Die Wendung bezeichnet das gesamte Bundesvolk, nicht nur männliche Nachkommen. »Israeliten« ist eine genaue, natürliche deutsche Kollektivbezeichnung und vermeidet eine im heutigen Deutsch missverständliche Einschränkung.
- issue: Bezug des Suffixes in בְּמוֹעֲדוֹ
  choice: zur jeweils festgesetzten Zeit
  alternative: zu seiner festgesetzten Zeit
  rationale: Das maskuline Singularsuffix kann sich formal auf die Opfergabe beziehungsweise den Opferdienst beziehen. »Jeweils« bewahrt den distributiven Sinn, ohne einen unsicheren Einzelbezug künstlich festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, klar verständlichem Register. Die Satzstellung bündelt die drei Appositionen zu Gottes Opfergabe und lässt die eigentliche Aufforderung deutlich hervortreten. Die konkrete Opfersprache des Hebräischen bleibt erhalten.
