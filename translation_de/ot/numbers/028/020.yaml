  text: וּ/מִ֨נְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֗ר וּ/שְׁנֵ֧י עֶשְׂרֹנִ֛ים לָ/אַ֖יִל תַּעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: de
  text: 'Und als ihre Speisopfergabe sollt ihr mit Öl vermischtes Feinmehl zubereiten: drei Zehntel[a] für den Stier und zwei Zehntel für den Widder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „drei Zehntel“ und „zwei Zehntel“ sind Zehntel eines Efa gemeint, eines Trockenmaßes, das in den Opfervorschriften verwendet wird.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Als ihr Speisopfer
  rationale: מִנְחָה bezeichnet im Opferkontext ein Speisopfer; das Suffix der 3. Person Plural bezieht sich zusammenfassend auf die zuvor genannten Opfertiere.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist die übliche Bezeichnung für fein gemahlenes, für Opfer bestimmtes Mehl.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: mit Öl vermischtes
  rationale: Das passive Partizip beschreibt das Feinmehl als mit Öl vermengt; die Formulierung ist im modernen Deutsch natürlich und quellennah.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: drei Zehntel
  rationale: עִשָּׂרוֹן bezeichnet im kultischen Maßsystem ein Zehntel Efa; die knappe Maßangabe des Hebräischen bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: לַפָּר
  choice: für den Stier
  rationale: Der bestimmte Singular verweist auf den in der Opferanweisung genannten Stier.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: und zwei Zehntel
  rationale: Die parallele Wiedergabe bewahrt die knappe Maßangabe und die Struktur des Hebräischen.
- source_word: לָאַיִל
  choice: für den Widder
  rationale: Der bestimmte Singular verweist auf den in der Opferanweisung genannten Widder.
- source_word: תַּעֲשׂוּ
  choice: sollt ihr … zubereiten
  rationale: עשה bedeutet allgemein „machen/tun“; im Zusammenhang der Opferanweisung gibt „zubereiten“ die geforderte Herstellung wieder, ohne den Vorgang als Darbringung überzubestimmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Speisopfer“ bewahrt den etablierten kultischen Fachbegriff; die Satzstellung zieht תַּעֲשׂוּ vor, um im Deutschen eine klare und natürliche Anweisung zu bilden.
