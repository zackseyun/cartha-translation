source:
  edition: WLC
  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: de
  text: 'Und zu Beginn eurer Monate[a] sollt ihr Jahwe ein Brandopfer darbringen: zwei Stiere aus der Rinderherde, einen Widder und sieben einjährige, makellose männliche Lämmer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den Anfängen eurer Monate“; gemeint sind die Neumondtage.'
    reason: Erläutert die hebräische Redewendung und ihren Bezug auf die monatlichen Neumondfeiern.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: Und an den Anfängen eurer Monate
  rationale: Die hebräische Wendung lautet wörtlich „an den Anfängen eurer Monate“ und bezeichnet die jeweiligen Monatsanfänge beziehungsweise Neumondtage. Die ungewöhnliche Bildsprache bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: תַּקְרִיבוּ
  choice: sollt ihr … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Opfergabe. „Darbringen“ ist im Deutschen natürlich und kultisch präzise.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Dies ist die etablierte deutsche Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Präposition ל wird durch die Konstruktion „Jahwe … darbringen“ natürlich ausgedrückt.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: zwei Stiere aus der Rinderherde
  rationale: Die Wiedergabe bezeichnet Stiere aus dem Rindvieh und vermeidet die nicht zwingende Festlegung auf junge Stiere.
- source_word: וְאַיִל אֶחָד
  choice: einen Widder
  rationale: Direkte und eindeutige Wiedergabe des Opfertiers samt Zahlwort.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sieben einjährige … Lämmer
  rationale: „Einjährig“ gibt die hebräische Wendung „Söhne eines Jahres“ idiomatisch wieder. Das grammatisch männliche Tierwort wird im Deutschen mit „Lämmer“ natürlich ausgedrückt; eine ausdrückliche Geschlechtsangabe wäre hier schwerfällig.
- source_word: תְּמִימִם
  choice: makellose
  rationale: Im Opferkontext bezeichnet das Adjektiv Tiere ohne körperlichen Fehler; „makellos“ ist knapp, verständlich und präzise.
theological_decisions:
- issue: Zeitangabe für die monatliche Opferfeier
  choice: an den Anfängen eurer Monate
  alternative: an euren Neumondtagen / am Anfang jedes Monats
  rationale: Die Hauptfassung bewahrt die konkrete hebräische Formulierung, ohne ihre kultische Bedeutung stillschweigend auf nur eine deutsche Umschreibung zu reduzieren. Die Fußnote nennt die gemeinte Neumondfeier.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich, während die markante hebräische Zeitangabe bewusst bewahrt und erläutert wird.
