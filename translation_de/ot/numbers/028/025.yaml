  text: וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/025.yaml
  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: de
  text: Am siebten Tag sollt ihr eine heilige Versammlung[a] halten. Ihr dürft keinerlei gewöhnliche Arbeit[b] verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine heilige Zusammenkunft“; die hebräische Wendung kann eine förmlich einberufene heilige Versammlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „keinerlei Arbeit des Dienstes“; gemeint ist die gewöhnliche Berufs- oder Werktagsarbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Die Zeitangabe wird im Deutschen natürlich mit „am“ wiedergegeben. Das einleitende ו wird im fortlaufenden Zusammenhang nicht eigens übersetzt.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die feste kultische Wendung bezeichnet eine zu heiligem Zweck einberufene Zusammenkunft. „Heilige Versammlung“ ist würdig und allgemein verständlich; die Nuance der Einberufung wird in der Fußnote bewahrt.
- source_word: יִהְיֶה לָכֶם
  choice: sollt ihr ... halten
  rationale: Wörtlich „soll für euch sein“. Im gesetzlichen Kontext gibt „sollt ihr ... halten“ die verpflichtende Bedeutung idiomatisch wieder.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei gewöhnliche Arbeit
  rationale: In Verbindung mit der Verneinung bezeichnet die Wendung die reguläre Berufs- oder Werktagsarbeit, nicht unterschiedslos jede Tätigkeit. „Keinerlei“ bildet die umfassende Kraft von כָּל ab.
- source_word: לֹא תַעֲשׂוּ
  choice: Ihr dürft ... nicht verrichten
  rationale: Der negierte Imperfekt hat hier prohibitive Kraft. „Dürft ... nicht“ formuliert das Verbot in natürlichem modernem Deutsch.
