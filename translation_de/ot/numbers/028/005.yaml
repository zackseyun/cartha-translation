source:
  edition: WLC
  text: וַ/עֲשִׂירִ֧ית הָ/אֵיפָ֛ה סֹ֖לֶת לְ/מִנְחָ֑ה בְּלוּלָ֛ה בְּ/שֶׁ֥מֶן כָּתִ֖ית רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: de
  text: und ein Zehntel Efa[a] Feinmehl als Speiseopfer, mit einem Viertel Hin[a] Öl aus zerstoßenen Oliven vermengt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa und Hin sind alte israelitische Maßeinheiten.
    reason: cultural_note
  - marker: b
    text: 'Oder: „mit einem Viertel Hin gepresstem Öl“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: und ein Zehntel Efa
  rationale: Die Konjunktion verbindet die Mengenangabe mit der vorhergehenden Opferanweisung. Die alte Maßeinheit Efa bleibt zur Wahrung der Genauigkeit erhalten.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der Ausdruck bezeichnet fein gemahlenes, für Opfer verwendetes Mehl; „Feinmehl“ ist im Deutschen klar und knapp.
- source_word: לְמִנְחָה
  choice: als Speiseopfer
  rationale: Im priesterlichen Opferkontext bezeichnet מִנְחָה das aus pflanzlichen Erzeugnissen bestehende Opfer und nicht bloß eine allgemeine Gabe.
- source_word: בְּלוּלָה
  choice: vermengt
  rationale: Das passive Partizip beschreibt das mit Öl vermischte Mehl; „vermengt“ passt zum gehobenen, aber gegenwärtigen Register.
- source_word: בְּשֶׁמֶן כָּתִית
  choice: mit … Öl aus zerstoßenen Oliven
  rationale: כָּתִית bezeichnet Öl, das durch Zerstoßen beziehungsweise Stampfen der Oliven gewonnen wurde. Die explizite deutsche Formulierung vermeidet das missverständliche „zerstoßenes Öl“.
- source_word: רְבִיעִת הַהִין
  choice: einem Viertel Hin
  rationale: Die idiomatische Bruchangabe wird mit der überlieferten alten Maßeinheit verbunden.
theological_decisions: []
