  text: and one male goat to make atonement for you[a].
translation:
  language: de
  text: und einen Ziegenbock, um für euch Sühne zu erwirken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist verkürzt: „und einen Ziegenbock, um für euch Sühne zu erwirken“. Aus dem unmittelbaren Opferzusammenhang ergibt sich, dass der Bock als Sündopfer dargebracht wird.'
    reason: Kontextuell vorausgesetzte, aber im Vers nicht ausdrücklich genannte Opferart.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die feste Verbindung bezeichnet im Opferkontext einen männlichen Ziegenbock; „Ziegenbock“ ist im Deutschen natürlich und präzise.
- source_word: אֶחָד
  choice: einen
  rationale: Das Zahlwort bezeichnet ein einzelnes Tier. Im fortlaufenden deutschen Satz ist der Akkusativ „einen“ erforderlich.
- source_word: לְכַפֵּר
  choice: um … Sühne zu erwirken
  rationale: כפר bezeichnet im priesterlichen Opferkontext das Vollziehen bzw. Bewirken von Sühne. Die Formulierung wahrt den kultischen Sinn, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: עֲלֵיכֶם
  choice: für euch
  rationale: Bei כפר bezeichnet עַל die Personen, denen die Sühne gilt; „für euch“ gibt diesen Bezug idiomatisch wieder.
theological_decisions:
- issue: Die im Hebräischen nicht ausdrücklich genannte Opferart
  choice: Keine Ergänzung „als Sündopfer“ im Haupttext
  alternative: „und einen Ziegenbock als Sündopfer, um für euch Sühne zu erwirken“
  rationale: Der unmittelbare Opferkontext legt die Funktion als Sünd- beziehungsweise Reinigungsopfer nahe, doch der vorliegende hebräische Vers nennt sie nicht ausdrücklich. Die knappe Form bleibt daher im Haupttext erhalten; die Ellipse wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählungsform des Hebräischen wird bewahrt; „Sühne erwirken“ gibt den kultischen Sprachgebrauch verständlich wieder.
