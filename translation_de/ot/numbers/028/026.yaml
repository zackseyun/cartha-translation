id: NUM.28.26
reference: Numbers 28:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: de
  text: Und am Tag der Erstlingsfrüchte, wenn ihr beim Wochenfest Yahweh ein neues Speiseopfer darbringt, sollt ihr eine heilige Versammlung[a] halten. Ihr dürft keinerlei gewöhnliche Arbeit[b] verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine heilige Einberufung“. Die hebräische Wendung ist ein Fachausdruck für eine zum Gottesdienst einberufene heilige Zusammenkunft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „keine schwere Arbeit“ beziehungsweise „keine Berufsarbeit“. Gemeint ist die reguläre Arbeit des Alltags.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: Und am Tag der Erstlingsfrüchte
  rationale: Die Zeitangabe wird natürlich und zugleich nah am Hebräischen wiedergegeben; „Erstlingsfrüchte“ bewahrt den kultischen Bezug.
- source_word: בְּהַקְרִיבְכֶם
  choice: wenn ihr … darbringt
  rationale: Der Infinitiv mit בְּ bezeichnet Gleichzeitigkeit; קרב meint im Opferkontext das Darbringen.
- source_word: מִנְחָה חֲדָשָׁה
  choice: ein neues Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext regelmäßig ein aus Getreide bestehendes Opfer; „Speiseopfer“ ist der geläufige deutsche Kultusbegriff.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der im Text stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: beim Wochenfest
  rationale: Der Plural bezeichnet hier das kultische Wochenfest, nicht lediglich mehrere Wochen; das Possessivsuffix ist im Deutschen beim etablierten Festnamen entbehrlich.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die Wendung bezeichnet eine zu heiligem Zweck einberufene Zusammenkunft; „Versammlung“ ist im heutigen Deutsch verständlicher als „Einberufung“.
- source_word: יִהְיֶה לָכֶם
  choice: sollt ihr … halten
  rationale: Die deutsche Formulierung gibt die verpflichtende Kraft der Konstruktion idiomatisch wieder.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei gewöhnliche Arbeit
  rationale: Die kultische Rechtsformel verbietet die reguläre Erwerbs- bzw. Alltagsarbeit, nicht unterschiedslos jede Tätigkeit.
- source_word: לֹא תַעֲשׂוּ
  choice: Ihr dürft … nicht verrichten
  rationale: Das Verbot in der zweiten Person Plural wird in natürlichem, würdigem Rechtsdeutsch ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar bewahrt, ohne ihn durch einen Titel zu ersetzen.
- issue: Umfang des Arbeitsverbots
  choice: gewöhnliche Arbeit
  alternative: schwere Arbeit
  rationale: Die Wendung מְלֶאכֶת עֲבֹדָה kann unterschiedlich präzisiert werden. „Gewöhnliche Arbeit“ wahrt den Gegensatz zwischen alltäglicher Arbeit und heiliger Festbegehung, ohne ein umfassendes Verbot jeder Handlung zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlichen kultischen Begriffen. Die Anrede steht entsprechend dem Hebräischen im Plural; die Satzstruktur bleibt rechtlich-feierlich, ohne altertümlich zu wirken.
