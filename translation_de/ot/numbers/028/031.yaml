- from: Zusätzlich zum regelmäßigen Brandopfer und dem dazugehörigen Speiseopfer[a] sollt ihr sie darbringen. Sie sollen für euch ohne Fehler sein, samt den dazugehörigen Trankopfern.
  to: Zusätzlich zum regelmäßigen Brandopfer und dem dazugehörigen Speiseopfer[a] sollt ihr sie samt ihren Trankopfern darbringen; sie sollen fehlerlos sein.
  rationale: Die Umstellung von »samt ihren Trankopfern« zu »darbringen« klärt dessen Funktion als begleitende Opfergabe. »Sie sollen fehlerlos sein« gibt תְּמִימִם idiomatisch wieder. Das hebräische לָכֶם wird nicht mechanisch mit »für euch« nachgebildet, da diese Wendung im Deutschen keinen klaren eigenständigen Sinn vermittelt; der Verpflichtungsbezug ist bereits durch »sollt ihr« ausgedrückt.
