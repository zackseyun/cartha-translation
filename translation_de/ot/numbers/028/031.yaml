base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: de
  text: Zusätzlich zum regelmäßigen Brandopfer und dem dazugehörigen Speiseopfer[a] sollt ihr sie samt ihren Trankopfern darbringen; sie sollen fehlerlos sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem täglichen Brandopfer« beziehungsweise »dem beständigen Brandopfer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Zusätzlich zu
  rationale: Kennzeichnet die hier vorgeschriebenen Opfer als Ergänzung zum regelmäßigen Brandopfer und ist im Deutschen klar und idiomatisch.
- source_word: עֹלַת הַתָּמִיד
  choice: dem regelmäßigen Brandopfer
  rationale: תָּמִיד bezeichnet hier das fest vorgeschriebene, fortlaufend dargebrachte Brandopfer; »regelmäßig« gibt diese kultische Funktion natürlich wieder.
- source_word: וּמִנְחָתוֹ
  choice: und dem dazugehörigen Speiseopfer
  rationale: מִנְחָה bezeichnet in diesem priesterlichen Zusammenhang das begleitende Opfer aus Getreide; »dazugehörig« macht den Bezug des Suffixes deutlich.
- source_word: תַּעֲשׂוּ
  choice: sollt ihr sie darbringen
  rationale: עשה kann im Opferkontext das Bereiten beziehungsweise Vollziehen eines Opfers bezeichnen; »darbringen« ist hier natürlich und sachlich präzise.
- source_word: תְּמִימִם
  choice: ohne Fehler
  rationale: Das Wort verlangt bei Opfertieren körperliche Makellosigkeit; »ohne Fehler« ist verständlich und bewahrt den kultischen Sinn.
- source_word: יִהְיוּ לָכֶם
  choice: Sie sollen für euch … sein
  rationale: Die Formulierung bewahrt das hebräische לָכֶם, auch wenn dessen Funktion im Deutschen etwas markiert wirkt.
- source_word: וְנִסְכֵּיהֶם
  choice: samt den dazugehörigen Trankopfern
  rationale: נֶסֶךְ bezeichnet das ausgegossene Begleitopfer; »Trankopfer« ist der etablierte und klare deutsche Ausdruck.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die kultischen Fachbegriffe »Brandopfer«, »Speiseopfer« und »Trankopfer« werden beibehalten. Der etwas markierte Ausdruck »für euch« spiegelt bewusst den hebräischen Dativ, ohne ihn auszudeuten.
