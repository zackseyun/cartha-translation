source:
  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: de
  text: dazu als Speiseopfer drei Zehntel eines Efa[a] Feinmehl, mit Öl vermengt, für jeden einzelnen Stier und zwei Zehntel eines Efa Feinmehl, mit Öl vermengt[b], für jeden einzelnen Widder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht nur „drei Zehntel“ beziehungsweise später „zwei Zehntel“; gemeint sind Zehntel eines Efa.
    reason: cultural_note
  - marker: b
    text: 'Oder: „mit Öl gemischt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: drei Zehntel Efa
  rationale: עֶשְׂרוֹן bezeichnet in den Opferbestimmungen ein Zehntelmaß, das als Zehntel eines Efa verstanden wird. Die ausdrückliche Nennung von Efa macht die Maßeinheit verständlich.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der kultische Fachausdruck bezeichnet sorgfältig zubereitetes feines Mehl für Opfergaben; „Feinmehl“ ist die etablierte und klare deutsche Wiedergabe.
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im Opferkontext bezeichnet מִנְחָה eine aus pflanzlichen Erzeugnissen bestehende Opfergabe. „Speiseopfer“ ist im Deutschen präzise und geläufig, ohne den Begriff auf Getreide allein zu verengen.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das Partizip beschreibt die Zubereitung des Mehls durch Vermengen mit Öl. Die Formulierung ist natürlich und wahrt den konkreten Vorgang.
- source_word: לַפָּר הָאֶחָד
  choice: für den einen Stier
  rationale: Artikel plus אֶחָד bezeichnet hier den einzelnen Stier innerhalb der Opferanweisung, nicht den „ersten“ Stier. Die Wiedergabe erhält diese spezifisch-distributive Ausdrucksweise.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: zwei Zehntel Efa
  rationale: Wie zuvor wird das Zehntelmaß zur Klarheit mit seiner im Kontext vorausgesetzten Bezugsgröße Efa wiedergegeben.
- source_word: לָאַיִל הָאֶחָד
  choice: für den einen Widder
  rationale: Die Formulierung entspricht derjenigen beim Stier und bezeichnet den einzelnen Widder, ohne eine unbelegte ordinale Bedeutung einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Begriffe „Speiseopfer“, „Efa“ und „Feinmehl“ bleiben wegen ihrer Genauigkeit erhalten; die Satzstellung wurde für flüssiges Deutsch leicht geordnet. Das einleitende וּ wird als „dazu“ wiedergegeben, da der Vers syntaktisch die Opferliste des vorhergehenden Verses fortsetzt.
