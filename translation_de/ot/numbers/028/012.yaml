  naturalness: „Drei Zehntel Efa“ ist ohne Genitiv im heutigen Standarddeutsch weniger idiomatisch. „Drei Zehntel eines Efa“ ist klar und natürlich. Die Umstellung stellt außerdem die Zuordnung der jeweiligen Mehlmenge zu jedem Opfertier verständlich dar.
  terminology: „Speiseopfer“, „Feinmehl“ und „Efa“ sind für den kultischen Kontext angemessen. „Mit Öl vermengt“ ist eine präzise, natürliche Wiedergabe von בְּלוּלָה בַשֶּׁמֶן.
