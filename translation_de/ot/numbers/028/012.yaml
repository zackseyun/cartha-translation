  to: dazu als Speiseopfer drei Zehntel eines Efa[a] Feinmehl, mit Öl vermengt, für jeden einzelnen Stier und zwei Zehntel eines Efa Feinmehl, mit Öl vermengt[b], für jeden einzelnen Widder.
