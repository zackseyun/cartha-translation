  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/018.yaml
  text: On the first day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: de
  text: Am ersten Tag soll eine heilige Versammlung[a] stattfinden. Ihr dürft keinerlei gewöhnliche Arbeit[b] verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine heilige Einberufung«; gemeint ist eine zu heiligem Zweck einberufene Versammlung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »keinerlei Arbeit des Dienstes«; gemeint ist die gewöhnliche Erwerbs- oder Dienstarbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Am ersten Tag
  rationale: Die bestimmte Zeitangabe mit Ordinalzahl wird unmittelbar wiedergegeben; »des Festes« ist aus dem Zusammenhang ersichtlich, steht aber nicht ausdrücklich im Vers.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die feste kultische Wendung bezeichnet eine einberufene Zusammenkunft zu heiligem Zweck. »Heilige Versammlung« ist im heutigen Deutsch natürlich und verständlich; die Nuance der Einberufung wird in einer Fußnote bewahrt.
- source_word: כָּל ... לֹא
  choice: keinerlei
  rationale: Die hebräische Verbindung drückt hier ein umfassendes Verbot aus. »Keinerlei« gibt diese totalisierende Kraft idiomatisch wieder.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: gewöhnliche Arbeit
  rationale: Die Wortverbindung meint die reguläre Erwerbs- beziehungsweise Dienstarbeit, die an Festtagen untersagt ist, nicht ausnahmslos jede Tätigkeit. »Gewöhnliche Arbeit« ist natürlicher und sachlich genauer als »mühevolle Arbeit«.
- source_word: לֹא תַעֲשׂוּ
  choice: Ihr dürft ... nicht verrichten
  rationale: Die zweite Person Plural richtet das verbindliche Verbot an die Gemeinschaft. Die deutsche Formulierung bewahrt den direktiven Sinn in natürlichem Gegenwartsdeutsch.
