  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: de
  text: Und am fünfzehnten Tag dieses Monats ist ein Fest[a]; sieben Tage lang soll ungesäuertes Brot gegessen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Festfeier“. Das hebräische Wort חָג kann sowohl das religiöse Fest als auch dessen feierliche Begehung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Am fünfzehnten Tag
  rationale: Die Verbindung aus Konjunktion und Präposition leitet eine Zeitangabe ein. Im Deutschen ist die Ordnungszahl die natürliche Wiedergabe; ein einleitendes „Und“ ist für den Zusammenhang nicht erforderlich.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: dieses Monats
  rationale: חֹדֶשׁ bezeichnet in dieser kalendarischen Vorschrift den Monat.
- source_word: חָג
  choice: Fest
  rationale: חָג bezeichnet eine religiöse Festfeier, häufig mit Wallfahrtscharakter. „Fest“ ist im Deutschen natürlich und lässt den kultischen Zusammenhang erkennen.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die Wendung gibt die Dauer der folgenden Vorschrift an; „sieben Tage lang“ drückt dies idiomatisch aus.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: מַצּוֹת bezeichnet hier Brot, das ohne Sauerteig zubereitet wurde. Die deutsche Sachbezeichnung ist transparent und geläufig.
- source_word: יֵאָכֵל
  choice: soll … gegessen werden
  rationale: Der passive Nifal-Imperfekt formuliert im gesetzlichen Kontext eine verbindliche Anweisung. „Soll … gegessen werden“ bewahrt Passiv und Normcharakter, ohne die Modalität unnötig zu verschärfen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Form der kalendarisch-kultischen Anweisung und das Passiv des hebräischen Textes bleiben erhalten.
