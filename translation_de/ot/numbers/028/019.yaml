  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: de
  text: 'Und ihr sollt Jahwe ein Feueropfer[a], ein Brandopfer, darbringen: zwei Stiere, einen Widder und sieben einjährige männliche Lämmer. Sie sollen für euch ohne Makel sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine im Feuer dargebrachte Opfergabe“. Das hebräische Wort ist ein technischer Opferbegriff für eine Gabe, die auf dem Altar verbrannt wird beziehungsweise in Rauch aufgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: ihr sollt … darbringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das kultische Darbringen einer Gabe; „darbringen“ ist im Deutschen natürlich und präzise.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der Ausdruck ist ein technischer Opferbegriff für eine im Feuer dargebrachte beziehungsweise in Rauch aufgehende Gabe. „Feueropfer“ bewahrt diesen Bezug, ohne die unsichere Ableitung als „Speiseopfer“ festzulegen.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: „Brandopfer“ ist der etablierte deutsche Ausdruck für das Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; ל kennzeichnet den Empfänger des Opfers.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: zwei junge Stiere
  rationale: Die Verbindung bezeichnet männliche Rinder; „junge Stiere“ gibt die traditionelle und kontextuell passende Alters- beziehungsweise Klassenangabe knapp wieder.
- source_word: וְאַיִל אֶחָד
  choice: einen Widder
  rationale: Standardentsprechung für אַיִל in Opferlisten.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: sieben einjährige männliche Lämmer
  rationale: כְבָשִׂים bezeichnet männliche Lämmer, und בְּנֵי שָׁנָה gibt ihr Alter als einjährig an.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Sie sollen für euch ohne Fehler sein
  rationale: תָּמִים bezeichnet bei Opfertieren die Freiheit von körperlichen Mängeln. Das ungewöhnliche לָכֶם wird beibehalten, um die hebräische Formulierung und den Verantwortungsbezug nicht auszulassen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von אִשֶּׁה und עֹלָה
  choice: „Feueropfer“ als Oberbegriff, durch „als Brandopfer“ näher bestimmt
  alternative: „Speisegabe, ein Brandopfer“
  rationale: Die Apposition wird so verstanden, dass das Brandopfer die konkrete Art des Feueropfers bezeichnet. Die technische Bedeutung von אִשֶּׁה bleibt dabei sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe „Feueropfer“ und „Brandopfer“ werden beibehalten; die Aufzählung folgt der knappen Form des Hebräischen.
