  text: וּ/בַ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֑דֶשׁ פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: de
  text: Im ersten Monat, am vierzehnten Tag des Monats, ist das Passafest für Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Passafest gehört Jahwe.“ Die hebräische Präposition kann Widmung oder Zugehörigkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הָרִאשׁוֹן
  choice: Im ersten Monat
  rationale: Die einleitende Konjunktion וּ kann im Deutschen unmarkiert bleiben; die Zeitangabe wird natürlich und quellennah wiedergegeben.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: am vierzehnten Tag des Monats
  rationale: Dies entspricht der hebräischen Datumsformel und ist im modernen Standarddeutsch idiomatisch.
- source_word: פֶּסַח
  choice: Passafest
  rationale: Der etablierte deutsche Begriff bezeichnet hier die kalendarische Feier; „Passaopfer“ würde den knappen Ausdruck unnötig auf das Opfer einschränken.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition לְ bezeichnet hier die Ausrichtung beziehungsweise Widmung an Jahwe; „für“ gibt diese Beziehung natürlich wieder, ohne sie als bloßen Besitz festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung des Passafestes zu Jahwe in לַיהוָה
  choice: für Jahwe
  alternative: Jahwes / dem Jahwe gehörend
  rationale: Das לְ kann Widmung, Ausrichtung oder Zugehörigkeit ausdrücken. Der Haupttext verwendet die natürliche Widmungsformulierung; die Fußnote hält die mögliche Zugehörigkeitsnuance offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe kalendarische Form des Hebräischen bleibt erhalten; „Passafest“ ist allgemein verständlich und vermeidet eine ungerechtfertigte Verengung auf das Opfer.
