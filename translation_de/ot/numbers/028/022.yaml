  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer[a], um für euch Sühne zu erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als Reinigungsopfer«. Das hebräische Wort für »Sündopfer« kann im Opferzusammenhang auch ein Opfer zur Reinigung von Sünde beziehungsweise Unreinheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: und einen Ziegenbock
  rationale: שָׂעִיר bezeichnet einen männlichen Ziegenbock; das vorangestellte ו wird mit „und“ wiedergegeben. אֶחָד bestimmt die Anzahl und wird durch den unbestimmten Artikel im Akkusativ natürlich ausgedrückt.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im Opferkontext bezeichnet חַטָּאת gewöhnlich ein Opfer und nicht nur die abstrakte Sünde. „Sündopfer“ ist die etablierte und verständliche deutsche Wiedergabe; die mögliche kultische Bedeutung „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: אֶחָד
  choice: einen
  rationale: Das Zahlwort legt fest, dass ein einzelnes Tier darzubringen ist. Im Deutschen drückt „einen Ziegenbock“ die Einzahl idiomatisch aus, ohne ein unnatürlich betontes „einen einzigen“ zu verwenden.
- source_word: לְ/כַפֵּר
  choice: um … Sühne zu erwirken
  rationale: כפר bezeichnet im priesterlichen Opferzusammenhang das Vollziehen von Sühne. Die Formulierung bewahrt die kultisch-theologische Aussage, ohne den Mechanismus der Sühne näher festzulegen.
- source_word: עֲלֵי/כֶם
  choice: für euch
  rationale: עַל mit dem pronominalen Suffix bezeichnet hier den Bezug beziehungsweise die Begünstigten des Sühnevorgangs. „Für euch“ ist natürlich und entspricht der Opferformel.
theological_decisions:
- issue: Wiedergabe der priesterlichen כפר-Terminologie
  choice: um für euch Sühne zu erwirken
  alternative: um für euch Sühnung zu vollziehen / um euch zu entsühnen
  rationale: „Sühne erwirken“ erhält das theologische Gewicht des hebräischen Opferbegriffs, ohne eine bestimmte Sühnetheorie in den Text einzutragen. Die Alternativen sind möglich, wirken im heutigen Deutsch jedoch technischer oder legen den Vorgang enger aus.
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ ist die traditionelle, allgemein verständliche Bezeichnung. Da חַטָּאת im kultischen Zusammenhang auch als Reinigungsopfer verstanden werden kann, wird diese echte lexikalische Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe aufzählende Satzstruktur des Hebräischen bleibt erhalten. „Ziegenbock“ präzisiert das Geschlecht des Tieres; „Sühne erwirken“ wahrt die kultische Sprache, bleibt aber für heutige Leser verständlich.
