  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: de
  text: 'Und ihr sollt Jahwe ein Brandopfer als wohlgefälligen Duft[a] darbringen: zwei Stiere aus der Rinderherde, einen Widder und sieben einjährige männliche Lämmer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem beruhigenden Duft“. Die hebräische Opferformel kann sowohl einen wohlgefälligen als auch einen beruhigenden beziehungsweise besänftigenden Duft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Dann sollt ihr … darbringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das rituelle Darbringen; „darbringen“ ist im Deutschen klar und angemessen.
- source_word: עוֹלָה
  choice: ein Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für das vollständig verbrannte Opfer; eine etymologische Wiedergabe als „Aufstiegsopfer“ wäre weniger verständlich.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als wohlgefälligen Duft
  rationale: Die Formulierung gibt die kultische Wendung natürlich wieder und bringt zum Ausdruck, dass das Opfer vor Gott Gefallen findet, ohne die Bildsprache des Duftes aufzugeben.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: zwei Stiere aus der Rinderherde
  rationale: Die Wiedergabe bewahrt sowohl die Tierart als auch die Einordnung in das Rindvieh; ein bestimmtes Alter der Stiere wird im Ausdruck nicht ausdrücklich genannt.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: Direkte und idiomatische Wiedergabe des einzelnen männlichen Schafes.
- source_word: שִׁבְעָה כְבָשִׂים
  choice: sieben … männliche Lämmer
  rationale: כְבָשִׂים bezeichnet hier männliche Lämmer; das Geschlecht bleibt daher ausdrücklich erhalten.
- source_word: בְּנֵי שָׁנָה
  choice: einjährige
  rationale: Die knappe deutsche Altersangabe entspricht der üblichen Opferbezeichnung für Tiere von einem Jahr.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ macht den im Ausgangstext verwendeten persönlichen Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Opferformel לְרֵיחַ נִיחֹחַ
  choice: als wohlgefälligen Duft
  alternative: zu einem beruhigenden Duft
  rationale: „Wohlgefällig“ bewahrt den Gedanken göttlicher Annahme, während die Fußnote die mögliche Nuance des Beruhigens beziehungsweise Besänftigens offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt Empfänger und Opferart klar heraus; die Aufzählung folgt eng dem Hebräischen. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Opferformel.
