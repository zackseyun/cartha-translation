  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: de
  text: 'Ihre Trankopfer sollen aus Wein bestehen: ein halbes Hin für den Stier, ein Drittel Hin für den Widder und ein Viertel Hin für das Lamm. Das ist das monatliche Brandopfer[a], Monat für Monat im Lauf des Jahres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies ist das Brandopfer zum Neumond, Monat für Monat im Lauf des Jahres.“ Das hebräische Wort חֹדֶשׁ kann sowohl „Monat“ als auch „Neumond“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: ihre Trankopfer
  rationale: נֶסֶךְ bezeichnet im Opferkontext eine ausgegossene Gabe; „Trankopfer“ ist im Deutschen verständlich und sachlich präzise.
- source_word: חֲצִי הַהִין
  choice: ein halbes Hin
  rationale: Die alte Maßeinheit wird beibehalten, statt sie unsicher in ein modernes Maß umzurechnen.
- source_word: לַפָּר
  choice: für den Stier
  rationale: Der bestimmte Singular bezeichnet im Zusammenhang das zuvor genannte Opfertier.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: ein Drittel Hin
  rationale: Natürliche deutsche Wiedergabe des hebräischen Bruchausdrucks bei Wahrung der Maßeinheit.
- source_word: לָאַיִל
  choice: für den Widder
  rationale: Der bestimmte Singular wird entsprechend dem hebräischen Wortlaut wiedergegeben.
- source_word: וּרְבִיעִת הַהִין
  choice: ein Viertel Hin
  rationale: Gibt den hebräischen Bruchausdruck knapp und idiomatisch wieder.
- source_word: לַכֶּבֶשׂ
  choice: für das Lamm
  rationale: Der bestimmte Singular bezeichnet das jeweilige vorgeschriebene Opfertier.
- source_word: יָיִן
  choice: aus Wein bestehen
  rationale: Das am Ende der Mengenliste stehende יָיִן bestimmt den Inhalt sämtlicher Trankopfer; die deutsche Satzgestaltung macht diesen Bezug eindeutig.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: Das ist das monatliche Brandopfer
  rationale: חֹדֶשׁ kann „Monat“ oder „Neumond“ bedeuten. Der Haupttext gibt den wiederkehrenden monatlichen Sinn natürlich wieder; die kultische Alternative bleibt in der Fußnote sichtbar.
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: Monat für Monat, alle Monate des Jahres hindurch
  rationale: Die Formulierung vermittelt den distributiven und den das ganze Jahr umfassenden Sinn, ohne die schwer verständliche wörtliche Wendung „in seinem Monat“ nachzubilden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antike Maßeinheit „Hin“ bleibt erhalten. Die im Hebräischen nachgestellte Angabe „Wein“ wurde aus Gründen der Klarheit vor die Mengenliste gezogen. Die Wiederholung im Schlussglied wird in der natürlichen Wendung „Monat für Monat, alle Monate des Jahres hindurch“ bewahrt.
