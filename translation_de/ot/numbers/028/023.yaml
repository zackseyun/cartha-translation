  text: מִ/לְּ/בַד֙ עֹלַ֣ת הַ/בֹּ֔קֶר אֲשֶׁ֖ר לְ/עֹלַ֣ת הַ/תָּמִ֑יד תַּעֲשׂ֖וּ אֶת אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: de
  text: Zusätzlich zu dem regelmäßigen Morgenbrandopfer sollt ihr diese Opfer darbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: Zusätzlich zu
  rationale: Die Wendung kennzeichnet die Festopfer als Ergänzung zum regelmäßig dargebrachten Opfer und wird so im modernen Deutsch klar wiedergegeben.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: dem regelmäßigen Morgenbrandopfer
  rationale: Der Relativsatz ordnet das morgendliche Brandopfer dem regelmäßigen Opfer zu; die verdichtete Formulierung vermeidet den irreführenden Eindruck, ein Opfer werde für ein anderes dargebracht.
- source_word: תַּעֲשׂוּ
  choice: sollt ihr … darbringen
  rationale: Im Kontext kultischer Anweisungen gibt »darbringen« die Bedeutung von עשׂה natürlicher und präziser wieder als das wörtliche »machen« oder »tun«.
- source_word: אֶת אֵלֶּה
  choice: diese Opfer
  rationale: Das Demonstrativpronomen verweist auf die zuvor vorgeschriebenen Opfer. Das ergänzte Substantiv stellt den Bezug im Deutschen eindeutig her.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Vorschrift bleibt erhalten; »Brandopfer« bewahrt die etablierte kultische Terminologie, und die Anrede steht entsprechend dem hebräischen Plural in der Ihr-Form.
