base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: de
  text: Dies ist das regelmäßige Brandopfer[a], das am Berg Sinai dargebracht wurde[b], zu einem wohlgefälligen Duft[c], ein Feueropfer[d] für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beständige Brandopfer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das am Berg Sinai eingesetzt wurde“. Das hebräische Partizip bedeutet wörtlich „gemacht/getan“ und kann sich hier auf die dort angeordnete Darbringung beziehen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „zu einem beruhigenden Duft“ beziehungsweise „zu einem angenehmen Duft“.'
    reason: lexical_alternative
  - marker: d
    text: Der hebräische Kultbegriff bezeichnet eine Opfergabe, die im Feuer dargebracht wird; möglich ist auch die Wiedergabe „Opfergabe“.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת
  choice: Brandopfer
  rationale: Der etablierte deutsche Kultbegriff bezeichnet ein Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: תָּמִיד
  choice: regelmäßig
  rationale: Im Opferkontext bezeichnet das Wort die fortlaufend wiederkehrende, festgesetzte Darbringung, nicht notwendig eine ununterbrochene Handlung.
- source_word: הָעֲשֻׂיָה
  choice: das … dargebracht wurde
  rationale: Das passive Partizip bedeutet wörtlich „gemacht/getan“. „Dargebracht“ ist im Opferkontext natürlich, ohne die Deutung „eingesetzt“ in den Haupttext einzutragen.
- source_word: בְּהַר סִינַי
  choice: am Berg Sinai
  rationale: Dies ist die natürliche deutsche Ortsangabe; ob die konkrete Darbringung oder die Einsetzung dort gemeint ist, bleibt durch eine Fußnote kenntlich.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als ein wohlgefälliger Duft
  rationale: Die Formulierung bewahrt das konkrete Duftbild und bringt zugleich die Annahme des Opfers zum Ausdruck.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der traditionelle und quellennahe deutsche Kultbegriff bewahrt den im hebräischen Ausdruck angelegten Bezug zum Feuer; „Speiseopfer“ wäre hier missverständlich.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet den Empfänger beziehungsweise die Ausrichtung des Opfers; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar als Gottes Bundesname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutung von הָעֲשֻׂיָה בְּהַר סִינַי
  choice: das am Berg Sinai dargebracht wurde
  alternative: das am Berg Sinai eingesetzt wurde
  rationale: Die Hauptfassung folgt enger dem passiven Partizip „gemacht/getan“; die mögliche institutionelle Bedeutung wird nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Kultische Wendung רֵיחַ נִיחֹחַ
  choice: wohlgefälliger Duft
  alternative: beruhigender Duft
  rationale: Die Fassung erhält das Opferbild und bezeichnet Gottes Wohlgefallen, ohne eine bestimmte Theorie der Beschwichtigung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am knappen kultischen Stil des Hebräischen; erklärungsbedürftige Alternativen stehen in Fußnoten.
