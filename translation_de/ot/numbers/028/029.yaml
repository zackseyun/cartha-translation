  choice: für jedes Lamm
  rationale: Wörtlich „für das eine Lamm“; im Zusammenhang der distributiven Opferformel gibt „für jedes Lamm“ den Sinn natürlich und genau wieder.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: für die sieben Lämmer
  rationale: Der Ausdruck bezeichnet die gesamte bereits genannte Gruppe, auf deren einzelne Tiere das jeweilige Zehntel entfällt; der bestimmte Artikel wird beibehalten.
