base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: de
  text: Diese Opfer sollt ihr Jahwe an euren festgesetzten Zeiten darbringen, zusätzlich zu euren Gelübdeopfern und freiwilligen Opfern, nämlich als Brandopfer, Getreideopfer, Trankopfer und Friedensopfer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gemeinschaftsopfer“. Der hebräische Ausdruck bezeichnet eine Opferart, die mit Frieden, Wohlergehen und Gemeinschaft verbunden ist.
    reason: Lexikalische Alternative zu שְׁלָמִים; der Begriff umfasst mehr als eine einzige deutsche Entsprechung.
lexical_decisions:
- source_word: אֵלֶּה תַּעֲשׂוּ
  choice: Diese Opfer sollt ihr … darbringen
  rationale: אֵלֶּה verweist auf die zuvor vorgeschriebenen Festopfer. תַּעֲשׂוּ bedeutet wörtlich „machen/tun“, bezeichnet im Opferkontext aber idiomatisch das Darbringen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Bundesname „Jahwe“ wiedergegeben.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: zu euren festgesetzten Zeiten
  rationale: מוֹעֵד bezeichnet hier die kultisch bestimmten Zeiten; die Wiedergabe wahrt den zeitlichen Sinn, ohne ihn unnötig auf Festmahle einzuengen.
- source_word: לְבַד מִנִּדְרֵיכֶם וְנִדְבֹתֵיכֶם
  choice: zusätzlich zu euren Gelübdeopfern und euren freiwilligen Gaben
  rationale: לְבַד markiert hier die zusätzlich zu den vorgeschriebenen Festopfern dargebrachten Gaben. נֶדֶר bezeichnet in diesem Opferzusammenhang die aufgrund eines Gelübdes dargebrachte Gabe, נְדָבָה eine freiwillige Gabe.
- source_word: לְעֹלֹתֵיכֶם וּלְמִנְחֹתֵיכֶם וּלְנִסְכֵּיכֶם
  choice: seien es Brandopfer, Speiseopfer, Trankopfer
  rationale: Die drei Fachbegriffe bezeichnen das vollständig verbrannte Opfer, das gewöhnlich aus Getreide bestehende Speiseopfer und das ausgegossene Trankopfer. „Seien es“ stellt die folgenden Opferarten natürlich als mögliche Formen der Gelübde- und freiwilligen Gaben dar.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: oder Friedensopfer
  rationale: שְׁלָמִים bezeichnet eine Opferkategorie, deren Name mit Frieden, Wohlergehen und Ganzheit verbunden ist. „Friedensopfer“ bewahrt diese Wortverbindung und ist als Fachbezeichnung geläufig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: „Friedensopfer“ erhält die lexikalische Beziehung zu Frieden und Wohlergehen. Da „Gemeinschaftsopfer“ einen wichtigen Aspekt dieser Opferart hervorhebt, wird diese Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe bleiben erkennbar, werden aber in einer flüssigen deutschen Satzstruktur verbunden. Der Fußnotenmarker steht unmittelbar bei „Friedensopfer“, auf das sich die Anmerkung bezieht.
