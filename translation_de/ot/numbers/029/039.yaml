  to: Diese Opfer sollt ihr Jahwe an euren festgesetzten Zeiten darbringen, zusätzlich zu euren Gelübdeopfern und freiwilligen Opfern, nämlich als Brandopfer, Getreideopfer, Trankopfer und Friedensopfer[a].
