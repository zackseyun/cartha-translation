  text: וּ/בֶ/עָשׂוֹר֩ לַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם כָּל מְלָאכָ֖ה לֹ֥א תַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: de
  text: Am zehnten Tag dieses siebten Monats soll für euch eine heilige Versammlung sein. Ihr sollt euch selbst Entbehrungen auferlegen[a] und keinerlei Arbeit tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euch selbst demütigen« oder »euch selbst etwas versagen«. Wörtlich: »eure Seelen bedrängen«. Die hebräische rituelle Wendung bezeichnet Selbstverzicht oder Selbstaffliktion und ist besonders mit dem Fasten verbunden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: Am zehnten Tag
  rationale: Die Verbindung aus Präposition und Zahl bezeichnet ein Kalenderdatum. Im Deutschen wird »Tag« sinngemäß ergänzt.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: dieses siebten Monats
  rationale: Die Formulierung bewahrt sowohl die kalendarische Reihenfolge als auch das Demonstrativpronomen »dieses«.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Der feste kultische Ausdruck bezeichnet eine offiziell einberufene, dem Heiligen vorbehaltene Zusammenkunft. »Heilige Versammlung« ist im heutigen Deutsch verständlich und wahrt den liturgischen Charakter.
- source_word: יִהְיֶה לָכֶם
  choice: soll für euch … stattfinden
  rationale: Diese Formulierung gibt die Sollbestimmung und den Dativbezug wieder, ohne im Deutschen unnatürlich zu klingen.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Ihr sollt euch selbst demütigen
  rationale: Das Verb im Piel mit נֶפֶשׁ ist hier eine rituelle Wendung für Selbsterniedrigung beziehungsweise Selbstentbehrung. Die Wiedergabe wahrt ihre Ernsthaftigkeit, ohne sie ausschließlich auf das Fasten festzulegen.
- source_word: נַפְשֹׁתֵיכֶם
  choice: euch selbst
  rationale: Wörtlich steht »eure Seelen/euer Leben«. Im hebräischen Idiom ist jedoch die ganze Person gemeint; die reflexive Wiedergabe vermeidet eine körperlich-seelische Zweiteilung.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: dürft keinerlei Arbeit tun
  rationale: »Keinerlei« bringt die umfassende Geltung des Arbeitsverbots idiomatisch und nachdrücklich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe der rituellen Wendung וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Ihr sollt euch selbst demütigen
  alternative: Ihr sollt euch selbst Entbehrungen auferlegen / Ihr sollt fasten
  rationale: »Demütigen« erhält die rituelle und bußbezogene Spannung des Ausdrucks. »Fasten« wäre im Zusammenhang naheliegend, würde den hebräischen Wortlaut aber stärker eingrenzen, als der Vers selbst es tut; »Entbehrungen auferlegen« wäre deutlicher, jedoch stärker auslegend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kultische Ausdruck wird verständlich, aber nicht umgangssprachlich wiedergegeben; die rechtliche Anweisung bleibt knapp und bestimmt.
