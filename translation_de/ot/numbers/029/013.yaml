  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: de
  text: 'Und ihr sollt Jahwe ein Brandopfer darbringen, ein Feueropfer mit einem Duft, der ihm gefällt[a]: dreizehn Stiere aus der Rinderherde, zwei Widder und vierzehn einjährige männliche Lämmer. Sie sollen ohne Makel sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „ein beruhigender Duft“ oder „ein lieblicher Duft“. Die hebräische Wendung bezeichnet ein Opfer, das Jahwe wohlgefällig ist und von ihm angenommen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: ihr sollt … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferzusammenhang das Heranbringen bzw. Darbringen einer Opfergabe. „Darbringen“ ist im Deutschen natürlich und bewahrt den kultischen Sinn.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Etablierte deutsche Bezeichnung für das vollständig verbrannte Opfer; eine etymologische Wiedergabe wie „Aufstiegsopfer“ wäre weniger verständlich.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Gibt die durch Feuer dargebrachte Opfergabe knapp und sachgerecht wieder, ohne sie unnötig als Speiseopfer zu deuten.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein Duft, der ihm gefällt
  rationale: Gibt die hebräische Wendung idiomatisch als Ausdruck der Annahme des Opfers durch Jahwe wieder und bleibt für heutige Leser unmittelbar verständlich.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen ausdrücklich stehende Eigenname erhalten bleibt.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: Stiere aus der Rinderherde
  rationale: Bewahrt die Tierart und die Zuordnung zum Großvieh, ohne aus der Wendung ein nicht ausdrücklich genanntes junges Alter abzuleiten.
- source_word: אֵילִם
  choice: Widder
  rationale: Übliche und genaue deutsche Bezeichnung für männliche Schafe dieser Opferklasse.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: einjährige männliche Lämmer
  rationale: Bewahrt sowohl das ausdrücklich männliche Geschlecht als auch die Altersangabe.
- source_word: תְּמִימִם
  choice: ohne Makel
  rationale: Im Opferkontext bezeichnet das Wort Tiere ohne körperlichen Fehler oder Defekt; „ohne Makel“ ist die geläufige deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ erhält den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רֵיחַ נִיחֹחַ
  choice: ein Duft, der ihm gefällt
  alternative: ein beruhigender / lieblicher Duft
  rationale: Die Formulierung macht deutlich, dass das Opfer von Jahwe angenommen wird, ohne die Aussage auf eine rein körperliche Geruchswahrnehmung zu reduzieren. Die Bildsprache des Duftes bleibt dennoch erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde zur besseren Verständlichkeit leicht gegliedert; die Aufzählung und sämtliche Angaben zu Art, Zahl, Alter, Geschlecht und Makellosigkeit der Opfertiere bleiben erhalten.
