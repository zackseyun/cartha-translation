base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: de
  text: Und einen Ziegenbock als Sündopfer[a], zusätzlich zu dem Sündopfer zur Versöhnung und dem regelmäßigen Brandopfer[b] mit seinem Speiseopfer und ihren Trankopfern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“; ebenso beim zweiten Vorkommen von „Sündopfer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das beständige Brandopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die Wendung bezeichnet einen männlichen Ziegenbock; diese Wiedergabe ist präzise und im Deutschen natürlich.
- source_word: אֶחָד
  choice: einen
  rationale: Die Zahl des Opfertiers wird entsprechend dem hebräischen Zahlwort ausdrücklich bewahrt.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet das Substantiv die Opferart. „Sündopfer“ ist der etablierte und verständliche deutsche Ausdruck; die mögliche funktionale Wiedergabe „Reinigungsopfer“ wird in einer Fußnote genannt.
- source_word: מִלְּבַד
  choice: außer
  rationale: Kennzeichnet das genannte Opfer als zusätzlich zu den folgenden vorgeschriebenen Opfern.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: Sündopfer zur Versöhnung
  rationale: Die Wiedergabe bewahrt die Verbindung des Opfers mit dem Sühne- beziehungsweise Versöhnungsvorgang, ohne den hebräischen Ausdruck unnötig weiter festzulegen.
- source_word: עֹלַת הַתָּמִיד
  choice: das regelmäßige Brandopfer
  rationale: תָּמִיד bezeichnet hier das beständig wiederkehrende, fest vorgeschriebene Opfer; „regelmäßig“ ist in modernem Deutsch natürlich und vermeidet die mögliche Fehlvorstellung eines ununterbrochen brennenden Opfers.
- source_word: מִנְחָתָהּ
  choice: mit seinem Speiseopfer
  rationale: מִנְחָה bezeichnet in dieser Opferliste das begleitende unblutige Opfer. Das feminine Suffix bezieht sich grammatisch auf עֹלָה, „Brandopfer“.
- source_word: נִסְכֵּיהֶם
  choice: ihren Trankopfern
  rationale: Der Plural des Nomens und der pluralische Possessivbezug werden erhalten. „Trankopfer“ ist der geläufige deutsche Kultbegriff.
theological_decisions:
- issue: Kultische Bedeutung von חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ bewahrt die etablierte kultische Bezeichnung, während „Reinigungsopfer“ stärker die rituelle Funktion hervorhebt. Da der hebräische Ausdruck beide Nuancen zulässt, wird die Alternative in einer Fußnote offengelegt.
- issue: Bedeutung von הַכִּפֻּרִים
  choice: zur Versöhnung
  alternative: zur Sühne
  rationale: „Versöhnung“ ist verständlich und gibt den kultischen Zusammenhang wieder; „Sühne“ wäre ebenfalls möglich. Die Formulierung vermeidet eine über den Vers hinausgehende dogmatische Präzisierung.
translation_notes:
  register: Moderne, würdige Standardsprache mit den im deutschen Bibel- und Kultwortschatz verständlichen Begriffen „Brandopfer“, „Speiseopfer“ und „Trankopfer“. Der Satzanschluss „dazu“ trägt dem fragmentarischen Listencharakter des Verses Rechnung. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
