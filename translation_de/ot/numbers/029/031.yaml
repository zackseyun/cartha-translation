  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וּ/נְסָכֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer, zusätzlich zum regelmäßigen Brandopfer mit seinem Speiseopfer und seinen Trankopfern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר
  choice: Ziegenbock
  rationale: Das Wort bezeichnet hier im Opferkontext einen männlichen Ziegenbock; diese Wiedergabe ist präzise und allgemein verständlich.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet das Substantiv das wegen Sünde dargebrachte Opfer, nicht die Sünde als abstrakten Begriff.
- source_word: אֶחָד
  choice: einen
  rationale: Die Kardinalzahl gibt die Anzahl des Ziegenbocks an.
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Die Wendung kennzeichnet die genannten Opfer als Ergänzung zum regelmäßig vorgeschriebenen Brandopfer.
- source_word: עֹלַת הַתָּמִיד
  choice: dem regelmäßigen Brandopfer
  rationale: תָּמִיד bezeichnet hier das wiederkehrende, fest vorgeschriebene Opfer; „regelmäßig“ gibt dies im heutigen Deutsch natürlicher wieder als „beständig“ oder „fortwährend“.
- source_word: מִנְחָתָהּ
  choice: seinem Speiseopfer
  rationale: מִנְחָה bezeichnet in dieser Opferliste das begleitende, aus pflanzlichen Gaben bestehende Opfer. Das Suffix bezieht sich grammatisch auf das Brandopfer.
- source_word: וּנְסָכֶיהָ
  choice: und seinen Trankopfern
  rationale: נֶסֶךְ bezeichnet ein ausgegossenes Trankopfer. Der hebräische Plural wird bewahrt; das Suffix bezieht sich auf das Brandopfer.
theological_decisions: []
