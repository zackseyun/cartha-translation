source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: de
  text: und ihr Speiseopfer sowie ihre Trankopfer für die Stiere, die Widder und die Lämmer, entsprechend ihrer Zahl und nach der Vorschrift.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der vorgeschriebenen Weise“. Das hebräische Wort מִשְׁפָּט bezeichnet hier die festgelegte Regel dafür, wie diese Opfer darzubringen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ihr Speiseopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das aus Getreide bestehende Speiseopfer. Der Singular mit Pluralsuffix wird als kollektiver Singular wiedergegeben.
- source_word: נִסְכֵּיהֶם
  choice: ihre Trankopfer
  rationale: נֶסֶךְ bezeichnet ausgegossene Opfergaben; „Trankopfer“ ist im Deutschen klar und kultisch präzise.
- source_word: לַפָּרִים
  choice: für die Stiere
  rationale: פַּר bezeichnet in Opferlisten einen Stier; ein bestimmtes Alter wird hier nicht ausdrücklich genannt.
- source_word: לָאֵילִם
  choice: die Widder
  rationale: אַיִל bezeichnet im Opferkontext eindeutig einen Widder. Die für alle drei Tiergruppen geltende Präposition „für“ muss im Deutschen nicht wiederholt werden.
- source_word: וְלַכְּבָשִׂים
  choice: und die Lämmer
  rationale: כֶּבֶשׂ bezeichnet ein Lamm. Das Geschlecht wird nicht eigens ergänzt, da der deutsche Ausdruck im Zusammenhang hinreichend genau ist.
- source_word: בְּמִסְפָּרָם
  choice: entsprechend ihrer Zahl
  rationale: Die Wendung stellt die begleitenden Gaben in Beziehung zur vorgeschriebenen Anzahl der Opfertiere.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte kultische Regel beziehungsweise Verfahrensordnung; „nach der Vorschrift“ ist natürlich und bewahrt den normativen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung des vorhergehenden Zusammenhangs mit „und“ eröffnet. „Speiseopfer“ und „Trankopfer“ bewahren die kultische Fachsprache, ohne unnötig altertümlich zu wirken.
