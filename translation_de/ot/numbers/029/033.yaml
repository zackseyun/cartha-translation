  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּ/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כְּ/מִשְׁפָּטָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: de
  text: und ihr Speiseopfer und ihre Trankopfer für die Stiere, für die Widder und für die Lämmer, entsprechend ihrer Anzahl, nach der Vorschrift.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach der für sie geltenden Vorschrift« beziehungsweise »nach der vorgeschriebenen Ordnung«.'
    reason: Das hebräische כְּמִשְׁפָּטָם bezeichnet die maßgebliche kultische Vorschrift; das Suffix erlaubt in der Wiedergabe eng verwandte Bezüge.
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ihr Speiseopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das begleitende Speise- beziehungsweise Getreideopfer. Der kollektive Singular des Hebräischen bleibt erhalten.
- source_word: נִסְכֵּיהֶם
  choice: ihre Trankopfer
  rationale: נֶסֶךְ bezeichnet ein ausgegossenes Opfer; »Trankopfer« ist die geläufige und sachlich genaue deutsche Wiedergabe. Der hebräische Plural wird beibehalten.
- source_word: לַפָּרִים
  choice: für die Stiere
  rationale: פָּרִים bezeichnet in dieser Opferliste Stiere; eine zusätzliche Altersangabe ist hier lexikalisch nicht erforderlich.
- source_word: לָאֵילִם
  choice: für die Widder
  rationale: אַיִל bezeichnet im Opferkontext eindeutig einen Widder.
- source_word: וְלַכְּבָשִׂים
  choice: und für die Lämmer
  rationale: כֶּבֶשׂ bezeichnet ein Lamm. Das Geschlecht wird nicht eigens ergänzt, da es im deutschen Kontext nicht ausgedrückt werden muss.
- source_word: בְּמִסְפָּרָם
  choice: entsprechend ihrer Anzahl
  rationale: Die Wendung stellt die begleitenden Opfer in Beziehung zur vorgeschriebenen Zahl der Tiere; »entsprechend« gibt diese Zuordnung natürlich wieder.
- source_word: כְּמִשְׁפָּטָם
  choice: nach ihrer Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte kultische Regel oder Ordnung. Die knappe Form bewahrt die mögliche Mehrdeutigkeit des pronominalen Suffixes.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholten Präpositionen der Opferliste und der kollektive Singular »Speiseopfer« wurden zur Wahrung der hebräischen Struktur beibehalten.
