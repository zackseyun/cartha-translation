  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: de
  text: 'Und am siebten Tag: sieben Stiere, zwei Widder und vierzehn einjährige Lämmer ohne Fehler.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „makellos“. Das hebräische Wort bezeichnet bei Opfertieren Unversehrtheit beziehungsweise das Freisein von einem Fehler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: Und am siebten Tag
  rationale: Die Wendung führt den nächsten Tag in der fortlaufenden Festordnung ein. „Und“ bewahrt die Verknüpfung mit dem vorhergehenden Vers und klingt im Deutschen natürlich.
- source_word: פָּרִים שִׁבְעָה
  choice: sieben Stiere
  rationale: פַּר bezeichnet im Opferkontext einen Stier; ein bestimmtes Alter wird hier nicht ausdrücklich genannt.
- source_word: אֵילִם שְׁנָיִם
  choice: zwei Widder
  rationale: אַיִל ist die übliche Bezeichnung für einen Widder, besonders in Opferlisten.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: vierzehn einjährige Lämmer
  rationale: בְּנֵי שָׁנָה ist eine hebräische Altersangabe, wörtlich „Söhne eines Jahres“, und wird idiomatisch mit „einjährig“ wiedergegeben.
- source_word: תְּמִימִם
  choice: alle ohne Fehler
  rationale: Im Opferkontext bezeichnet תמים die körperliche Unversehrtheit beziehungsweise Freiheit von einem Mangel. „Alle“ macht natürlich und eindeutig deutlich, dass sich das pluralische Adjektiv auf die Lämmer bezieht.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe Listenform des Hebräischen bleibt durch den Doppelpunkt und die Reihung erhalten. „Ohne Fehler“ ist für heutige Leser klarer als das etwas gehobenere „ohne Fehl“.
