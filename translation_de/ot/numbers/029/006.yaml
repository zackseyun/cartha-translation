id: NUM.29.6
reference: Numbers 29:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: de
  text: zusätzlich zum Brandopfer des Monats[a] und seinem Speiseopfer, zum regelmäßigen Brandopfer und seinem Speiseopfer sowie zu ihren Trankopfern, nach der für sie geltenden Vorschrift, als wohlgefälliger Duft, ein Feueropfer[b] für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich das Brandopfer zum Neumond; wörtlich steht hier »des Monats«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine Speisegabe« beziehungsweise »eine im Feuer dargebrachte Gabe«. Das hebräische Wort ist ein Fachausdruck der Opfersprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Kennzeichnet die genannten Opfer als Ergänzung zu den zuvor vorgeschriebenen Opfern und ist im Deutschen klar und natürlich.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: Brandopfer des Monats
  rationale: Gibt die hebräische Formulierung wörtlich wieder, ohne die wahrscheinlich gemeinte Neumondfeier stillschweigend in den Haupttext einzutragen.
- source_word: מִנְחָתָהּ
  choice: sein Speiseopfer
  rationale: מִנְחָה bezeichnet in diesem Opferkontext die pflanzliche beziehungsweise aus Getreide bestehende Opfergabe, die das Brandopfer begleitet.
- source_word: עֹלַת הַתָּמִיד
  choice: regelmäßiges Brandopfer
  rationale: תָּמִיד bezeichnet hier die beständige, vorgeschriebene Wiederholung; »regelmäßig« ist verständlich und legt sich nicht allein durch das Wort auf »täglich« fest.
- source_word: וְנִסְכֵּיהֶם
  choice: sowie zu ihren Trankopfern
  rationale: נֶסֶךְ bezeichnet eine ausgegossene Opfergabe; das Pluralsuffix bezieht sich auf die mehreren Opfer.
- source_word: כְּמִשְׁפָּטָם
  choice: nach der für sie geltenden Vorschrift
  rationale: מִשְׁפָּט bezeichnet im kultischen Zusammenhang die festgelegte Ordnung oder Vorschrift für die Darbringung.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als wohlgefälliger Duft
  rationale: Bewahrt die feste Opferformel und vermittelt in natürlichem Deutsch, dass die Opfergabe vor Gott angenommen wird.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der hebräische Fachausdruck bezeichnet eine auf dem Altar im Feuer dargebrachte Gabe. »Feueropfer« ist prägnant und traditionsnah; die lexikalisch diskutierte Alternative wird in einer Fußnote genannt.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet den Empfänger beziehungsweise die Widmung des Opfers; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text enthält den Gottesnamen ausdrücklich. »Jahwe« gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des kultischen Fachworts אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe; im Feuer dargebrachte Gabe
  rationale: Die genaue Ableitung und Bedeutungsbreite des Fachworts sind umstritten. »Feueropfer« bewahrt den klaren Bezug zur Darbringung auf dem Altar, während die alternative Auffassung transparent in der Fußnote erscheint.
- issue: Deutung von עֹלַת הַחֹדֶשׁ
  choice: Brandopfer des Monats
  alternative: Brandopfer zum Neumond
  rationale: Sachlich ist wahrscheinlich das Neumondopfer gemeint; da der hebräische Wortlaut jedoch »des Monats« sagt, bleibt diese Formulierung im Haupttext erhalten und die Deutung wird nicht erzwungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher kultischer Fachsprache. Die Reihung des hebräischen Opferverzeichnisses bleibt erhalten. Die Fußnotenmarker stehen unmittelbar bei den tatsächlich erläuterten Ausdrücken.
