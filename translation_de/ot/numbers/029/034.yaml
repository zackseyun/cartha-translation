  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/034.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer, zusätzlich zum regelmäßigen Brandopfer mit dem dazugehörigen Speiseopfer und Trankopfer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: und einen Ziegenbock
  rationale: שָׂעִיר bezeichnet hier einen männlichen Ziegenbock; אֶחָד gibt die Anzahl ausdrücklich mit „einen“ an, und וּ führt die Opferliste fort.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das Sündopfer, nicht lediglich die abstrakte Sünde.
- source_word: מִ/לְּ/בַד
  choice: zusätzlich zu
  rationale: Die Wendung kennzeichnet das genannte Opfer als Ergänzung zum regelmäßig dargebrachten Brandopfer.
- source_word: עֹלַת הַ/תָּמִיד
  choice: zum regelmäßigen Brandopfer
  rationale: עֹלָה wird mit dem etablierten deutschen Opferbegriff „Brandopfer“ wiedergegeben; תָּמִיד bezeichnet hier die fortlaufend wiederkehrende Darbringung.
- source_word: מִנְחָתָ/הּ וְ/נִסְכָּ/הּ
  choice: mit dem dazugehörigen Speiseopfer und Trankopfer
  rationale: מִנְחָה und נֶסֶך sind die kultischen Begleitopfer. Die femininen Suffixe beziehen sich grammatisch auf עֹלָה; „dazugehörig“ gibt diesen Bezug im Deutschen natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche Standardsprache mit den etablierten kultischen Begriffen „Sündopfer“, „Brandopfer“, „Speiseopfer“ und „Trankopfer“. Der Satz bleibt als Fortsetzung der vorausgehenden Opferliste mit „und“ verbunden.
