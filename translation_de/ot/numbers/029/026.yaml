  text: וּ/בַ/יּ֧וֹם הַ/חֲמִישִׁ֛י פָּרִ֥ים תִּשְׁעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: de
  text: 'Am fünften Tag: neun Stiere[a], zwei Widder und vierzehn einjährige männliche Lämmer, alle ohne Fehler.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und am fünften Tag“. Im Hebräischen beginnt der Vers mit einer verbindenden Konjunktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/חֲמִישִׁי
  choice: Am fünften Tag
  rationale: Die Präposition bezeichnet den Zeitpunkt; das vorangestellte וּ verbindet den Vers mit der fortlaufenden Aufzählung, kann im natürlichen deutschen Listenstil jedoch unausgedrückt bleiben. Die Alternative wird in einer Fußnote bewahrt.
- source_word: פָּרִים תִּשְׁעָה
  choice: neun Stiere
  rationale: פָּר bezeichnet im Opferkontext einen Stier; eine Altersangabe wie „junge“ ist hier nicht ausdrücklich erforderlich.
- source_word: אֵילִם שְׁנָיִם
  choice: zwei Widder
  rationale: אַיִל bezeichnet in solchen Opferlisten einen ausgewachsenen männlichen Schafbock; „Widder“ ist die übliche klare Wiedergabe.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: vierzehn ... männliche Lämmer
  rationale: כֶּבֶשׂ bezeichnet hier im Opferzusammenhang männliche Lämmer. Die Geschlechtsangabe wird im Deutschen ausdrücklich gemacht.
- source_word: בְּנֵי שָׁנָה
  choice: einjährige
  rationale: Die hebräische Wendung bezeichnet Tiere im Alter von einem Jahr; „einjährige“ ist knappes und natürliches Deutsch.
- source_word: תְּמִימִם
  choice: alle ohne Fehler
  rationale: Im Opferkontext bezeichnet תָּמִים Tiere ohne körperlichen Makel. „Alle“ verdeutlicht natürlich, dass das maskuline Pluraladjektiv sich auf die vierzehn Lämmer bezieht.
