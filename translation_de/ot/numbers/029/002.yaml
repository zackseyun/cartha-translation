  variant: modern standard German
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: de
  text: 'Und ihr sollt Jahwe ein Brandopfer zu einem wohlgefälligen Duft[a] darbringen: einen Stier aus der Rinderherde, einen Widder und sieben einjährige männliche Lämmer ohne Fehler.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zu einem beruhigenden Duft“ oder „zu einem angenehmen Duft“. Die hebräische Wendung ist eine feste Opferformel und zeigt an, dass das Opfer vor Jahwe annehmbar ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: ihr sollt … darbringen
  rationale: Das Verb bedeutet wörtlich „machen/tun“, bezeichnet mit עֹלָה im Opferkontext aber idiomatisch das Darbringen eines Opfers.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Der etablierte deutsche Opferbegriff bezeichnet ein Opfer, das vollständig auf dem Altar verbrannt wird und im Rauch aufsteigt.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als wohlgefälligen Duft
  rationale: Die feste Opferformel bringt aus, dass das Opfer vor Gott annehmbar ist. „Wohlgefälliger Duft“ bewahrt das konkrete Duftbild, ohne eine grob körperliche Vorstellung nahezulegen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Bundesname mit der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: einen Stier aus der Rinderherde
  rationale: Die Wendung bedeutet wörtlich etwa „einen Stier, einen Sohn des Rindes/der Herde“. Die gewählte Form gibt die Tierart und Herkunft natürlich wieder, ohne ein bestimmtes Alter hinzuzufügen.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל bezeichnet in Opferlisten eindeutig einen Widder.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sieben einjährige männliche Lämmer
  rationale: כְּבָשִׂים ist die männliche Form für Lämmer; בְּנֵי שָׁנָה bezeichnet ihr Alter als einjährig.
- source_word: תְּמִימִם
  choice: alle ohne Fehler
  rationale: Im Opferkontext verlangt das Wort körperliche Unversehrtheit. „Alle“ macht im Deutschen deutlich, dass die pluralische Bestimmung für die aufgezählten Opfertiere gilt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den Charakter als persönlichen Bundesnamen, während „der HERR“ die traditionelle jüdische Leseersetzung wiedergibt.
- issue: Bedeutung der Opferformel רֵיחַ נִיחֹחַ
  choice: wohlgefälliger Duft
  alternative: beruhigender Duft
  rationale: Die Übersetzung hält sowohl das konkrete Duftbild als auch die Aussage der göttlichen Annahme fest, ohne die Formel ausschließlich als Aussage über Geruch oder Besänftigung auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Opferkatalog, ist aber durch „darbringen“ und die natürliche deutsche Reihenfolge gut verständlich. Der Fußnotenmarker steht unmittelbar bei der erläuterten Wendung.
