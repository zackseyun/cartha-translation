  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: de
  text: dazu einen Ziegenbock als Sündopfer, zusätzlich zum regelmäßigen Brandopfer, seinem Speisopfer und ihren Trankopfern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „und ihren Trankopfern“. Der Plural bezieht sich wahrscheinlich auf die Trankopfer, die zu der Gesamtheit der vorgeschriebenen Opfer gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: dazu einen Ziegenbock
  rationale: Die feste Opferbezeichnung שְׂעִיר עִזִּים meint einen männlichen Ziegenbock; אֶחָד gibt die Anzahl eins an, die im Deutschen durch den unbestimmten Artikel hinreichend ausgedrückt wird. „dazu“ verbindet den Vers natürlich mit der vorausgehenden Aufzählung.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das Sündopfer, nicht lediglich die abstrakte Sünde.
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Die Wendung kennzeichnet die genannten Opfer als Ergänzung zum regelmäßig vorgeschriebenen Opferkomplex.
- source_word: עֹלַת הַתָּמִיד
  choice: dem regelmäßigen Brandopfer
  rationale: תָּמִיד bezeichnet hier das beständig beziehungsweise regelmäßig dargebrachte Brandopfer; „regelmäßig“ ist modernes, klares Deutsch.
- source_word: וּמִנְחָתָהּ
  choice: seinem Speisopfer
  rationale: מִנְחָה bezeichnet in diesem Opferkontext das begleitende Speisopfer. Das feminine Singularsuffix bezieht sich auf עֹלָה; im Deutschen richtet sich das Pronomen grammatisch nach „Brandopfer“.
- source_word: וְנִסְכֵּיהֶם
  choice: und ihren Trankopfern
  rationale: Substantiv und Suffix stehen im Hebräischen im Plural. Die Übersetzung bewahrt diese auffällige Form, statt sie zu einem Singular zu glätten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe „Brandopfer“, „Speisopfer“, „Sündopfer“ und „Trankopfer“ sichern die begriffliche Kontinuität. Der ungewöhnliche Plural am Versende bleibt erhalten und wird in einer Fußnote erläutert.
