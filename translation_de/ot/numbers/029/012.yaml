base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: de
  text: Am fünfzehnten Tag des siebten Monats sollt ihr eine heilige Versammlung halten. Ihr dürft keinerlei gewöhnliche Arbeit verrichten und sollt sieben Tage lang ein Fest für Jahwe feiern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Am fünfzehnten Tag
  rationale: Die Verbindung aus Konjunktion, Präposition und Zahl bezeichnet idiomatisch den fünfzehnten Tag. Im Deutschen ist die eröffnende Konjunktion für einen natürlichen Satzanschluss nicht erforderlich.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: des siebten Monats
  rationale: Der Genitiv gibt die kalendarische Zugehörigkeit des Tages präzise und natürlich wieder.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Der Ausdruck bezeichnet eine offiziell einberufene Zusammenkunft zu heiligem Zweck; „Versammlung“ ist im heutigen Deutsch klarer als „Einberufung“, ohne den kultischen Sinn zu verlieren.
- source_word: יִהְיֶה לָכֶם
  choice: sollt ihr … halten
  rationale: Das wörtliche „soll für euch sein“ wird in Verbindung mit der Versammlung idiomatisch als Verpflichtung zur Abhaltung wiedergegeben.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: Ihr dürft keinerlei gewöhnliche Arbeit verrichten
  rationale: Die Wortverbindung meint reguläre beziehungsweise berufliche Arbeit, nicht ausnahmslos jede Tätigkeit. „Keinerlei“ bewahrt die umfassende Kraft von כָּל innerhalb der Verneinung.
- source_word: וְחַגֹּתֶם חַג
  choice: sondern sollt … ein Fest … feiern
  rationale: Die figura etymologica aus Verb und verwandtem Substantiv wird durch die natürliche deutsche Verbindung „ein Fest feiern“ wiedergegeben. „Sondern“ verdeutlicht den im Kontext angelegten Gegensatz zur gewöhnlichen Arbeit.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet das Fest als Jahwe gewidmet beziehungsweise zu seiner Ehre gefeiert; „für“ ist dafür im Deutschen idiomatisch.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die Ergänzung „lang“ macht die Dauerangabe im Deutschen eindeutig und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen; die genaue antike Aussprache bleibt dennoch nicht völlig sicher.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher kultischer Rechtssprache. Die Anrede bleibt im Plural. Der verpflichtende Charakter der Vorschriften wird durch „sollt“ beziehungsweise „dürft … nicht“ ausgedrückt.
