source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer, zusätzlich zum regelmäßigen Brandopfer mit dem dazugehörigen Speisopfer und Trankopfer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: und einen Ziegenbock
  rationale: Die feste Opferbezeichnung שְׂעִיר עִזִּים meint einen männlichen Ziegenbock; אֶחָד gibt die Anzahl an. „Ziegenbock“ ist im modernen Deutschen klar und natürlich.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das Opfer und nicht die abstrakte Sünde. „Als Sündopfer“ gibt die Funktion des Tieres idiomatisch wieder.
- source_word: מִ/לְּ/בַד
  choice: zusätzlich zu
  rationale: Die Präposition kennzeichnet, dass dieses Opfer neben dem vorgeschriebenen regelmäßigen Opfer dargebracht wird.
- source_word: עֹלַת הַ/תָּמִיד
  choice: dem regelmäßigen Brandopfer
  rationale: תָּמִיד bezeichnet hier das regelmäßig wiederkehrende Opfer. „Regelmäßig“ vermeidet die möglicherweise missverständliche Vorstellung eines ununterbrochen brennenden Einzelopfers.
- source_word: מִנְחָתָהּ
  choice: dem dazugehörigen Speisopfer
  rationale: מִנְחָה bezeichnet in dieser priesterlichen Opferliste das begleitende unblutige Opfer; „Speisopfer“ ist die geläufige deutsche kultische Bezeichnung. Das Suffix bezieht es auf das regelmäßige Brandopfer.
- source_word: וְ/נִסְכָּהּ
  choice: und Trankopfer
  rationale: נֶסֶךְ bezeichnet die ausgegossene Opfergabe. „Trankopfer“ ist verständlich und als kultischer Fachausdruck etabliert; auch das Suffix bezieht sich auf das regelmäßige Brandopfer.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit etablierten Opferbegriffen. Die beiden femininen Suffixe bei מִנְחָתָהּ und נִסְכָּהּ werden durch „dazugehörigen“ gemeinsam auf das Brandopfer bezogen; dadurch wird eine im Deutschen schwerfällige Wiederholung von „sein“ vermieden.
