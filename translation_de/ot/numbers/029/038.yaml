  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer[a], zusätzlich zu dem regelmäßigen Brandopfer[b] und seinem Speisopfer und seinem Trankopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann allgemein eine Ziege bezeichnen; im Opferkontext bezeichnet es oft genauer einen Ziegenbock.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem beständigen Brandopfer“ beziehungsweise „dem fortwährenden Brandopfer“. Gemeint ist das regelmäßig dargebrachte Opfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: und einen Ziegenbock
  rationale: שׂעיר bezeichnet eine Ziege und in Opfertexten häufig genauer einen Ziegenbock; אֶחָד gibt die Anzahl an. Die deutsche Formulierung stellt das Zahlwort idiomatisch vor das Substantiv.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im priesterlichen Opferkontext bezeichnet חַטָּאת das Sündopfer, nicht lediglich die abstrakte Sünde.
- source_word: מִ/לְּ/בַד
  choice: zusätzlich zu
  rationale: Die Wendung kennzeichnet dieses Opfer als Ergänzung zu den bereits vorgeschriebenen regelmäßigen Opfergaben. „Zusätzlich zu“ vermeidet die mögliche ausschließende Bedeutung von „außer“.
- source_word: עֹלַת הַ/תָּמִיד
  choice: dem regelmäßigen Brandopfer
  rationale: עֹלָה ist das Brandopfer; תָּמִיד bezeichnet hier das beständig wiederkehrende, fest vorgeschriebene Opfer.
- source_word: וּ/מִנְחָתָ/הּ
  choice: und seinem Speisopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext das begleitende Speisopfer. Das Suffix bezieht sich auf das Brandopfer.
- source_word: וְ/נִסְכָּ/הּ
  choice: und seinem Trankopfer
  rationale: נֶסֶךְ bezeichnet das begleitende Trankopfer. Das Suffix bezieht sich ebenfalls auf das Brandopfer.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich kultisch angemessene Standardsprache. „Sündopfer“, „Brandopfer“, „Speisopfer“ und „Trankopfer“ bewahren die etablierten Opferbegriffe; „zusätzlich zu“ gibt die additive Beziehung eindeutig wieder.
