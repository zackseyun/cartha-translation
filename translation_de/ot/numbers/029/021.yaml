base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: de
  text: dazu ihre Speiseopfer und Trankopfer für die Stiere, die Widder und die Lämmer, entsprechend ihrer Zahl und nach der Vorschrift[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach der vorgeschriebenen Ordnung“. Das hebräische Wort bezeichnet hier die festgelegte Regel für die Durchführung dieser Opfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ihre Speiseopfer
  rationale: מִנְחָה bezeichnet in diesem Opferkontext die zu den Tieropfern gehörende Getreidegabe. „Speiseopfer“ ist der geläufige deutsche Fachausdruck; der Plural gibt die auf mehrere Opfertiere bezogene kollektive Form natürlich wieder.
- source_word: נִסְכֵּיהֶם
  choice: ihre Trankopfer
  rationale: נֶסֶךְ bezeichnet eine als Opfer ausgegossene Flüssigkeit. „Trankopfer“ ist verständlich und bewahrt den kultischen Sinn.
- source_word: לַפָּרִים
  choice: für die Stiere
  rationale: פָּרִים bezeichnet in der Opferterminologie Stiere; eine ausdrückliche Altersangabe steht hier nicht.
- source_word: לָאֵילִם
  choice: die Widder
  rationale: אַיִל bezeichnet in Opferlisten eindeutig einen Widder; die Präposition „für“ gilt in der deutschen Reihung auch für dieses Glied.
- source_word: וְלַכְּבָשִׂים
  choice: und die Lämmer
  rationale: כֶּבֶשׂ bezeichnet ein Lamm. Das Deutsche muss das im Opfergebrauch mögliche männliche Geschlecht hier nicht eigens ergänzen.
- source_word: בְּמִסְפָּרָם
  choice: entsprechend ihrer Zahl
  rationale: Die Wendung verlangt, dass die begleitenden Opfer der festgelegten Anzahl der jeweiligen Tiere entsprechen.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט meint hier die verbindliche kultische Regel beziehungsweise die vorgeschriebene Durchführung. „Vorschrift“ bewahrt den normativen Charakter in natürlichem Deutsch.
