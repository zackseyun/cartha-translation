  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer[a], zusätzlich zum regelmäßigen Brandopfer, seinem Speiseopfer und seinem Trankopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: Ziegenbock
  rationale: Die Wendung bezeichnet einen männlichen Ziegenbock als Opfertier; „Ziegenbock“ ist im Deutschen eindeutig und natürlich.
- source_word: אֶחָד
  choice: einen
  rationale: Das Zahlwort gibt die Anzahl des Opfertiers an; im Deutschen ist sie in „einen Ziegenbock“ enthalten.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Im Opferkontext bezeichnet das Wort die Opferart, nicht abstrakt die Sünde. „Sündopfer“ ist die geläufige deutsche Wiedergabe; die mögliche funktionsbezogene Übersetzung wird in der Fußnote genannt.
- source_word: מִלְּבַד
  choice: außer
  rationale: Die Präposition kennzeichnet dieses Opfer als zusätzlich zu dem regelmäßig vorgeschriebenen Opfer.
- source_word: עֹלַת הַתָּמִיד
  choice: dem regelmäßigen Brandopfer
  rationale: Die Wendung bezeichnet das beständig wiederkehrende, vorgeschriebene Brandopfer; „regelmäßig“ gibt dies in heutigem Deutsch natürlich wieder.
- source_word: מִנְחָתָהּ
  choice: mit seinem Speiseopfer
  rationale: Im kultischen Zusammenhang ist מִנְחָה das begleitende, aus pflanzlichen Erzeugnissen bestehende Opfer. Das feminine Suffix bezieht sich auf עֹלָה, das Brandopfer; „mit“ macht die Begleitung im Deutschen idiomatisch deutlich.
- source_word: וְנִסְכָּהּ
  choice: und seinem Trankopfer
  rationale: Das Wort bezeichnet das begleitende ausgegossene Opfer; „Trankopfer“ ist die geläufige und verständliche deutsche Bezeichnung. Das Suffix bezieht sich ebenfalls auf das Brandopfer.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ bewahrt die traditionelle und weithin verständliche Benennung, während „Reinigungsopfer“ die rituelle Funktion stärker hervorhebt. Die echte lexikalische Alternative wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Anschluss „dazu“ entspricht dem aufzählenden וּ־ am Versanfang; „außer“ hält fest, dass die genannten Opfer zusätzlich zum regelmäßigen Brandopfer dargebracht werden.
