source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: de
  text: 'Ihr sollt Jahwe ein Brandopfer darbringen, einen angenehmen Duft[a]: einen Stier aus der Rinderherde, einen Widder und sieben einjährige männliche Lämmer. Sie sollen für euch ohne Fehler sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen beruhigenden Duft“. Die hebräische Wendung ist eine feste Opferformel und bezeichnet ein Opfer, das Jahwe annimmt.'
    reason: lexikalische Alternative und Erklärung einer kultischen Formel
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Ihr sollt … darbringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das Darbringen einer Opfergabe. „Darbringen“ ist im Deutschen natürlich, würdig und kultisch passend.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Der etablierte deutsche Opferbegriff bezeichnet das Opfer, das vollständig auf dem Altar verbrannt wird; die etymologische Alternative „Aufstiegsopfer“ wäre weniger verständlich.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger beziehungsweise die Widmung des Opfers; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: רֵיחַ נִיחֹחַ
  choice: einen angenehmen Duft
  rationale: Die feste Opfformel beschreibt bildhaft die Annahme des Opfers durch Gott. Diese Wiedergabe wahrt das Bild, ohne seine Bedeutung auszudeuten.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: einen Stier aus der Rinderherde
  rationale: Die wörtliche Wendung „Stier, Sohn des Rindes/der Herde“ ist eine idiomatische Tierbezeichnung. Die gewählte Fassung bleibt nah am Hebräischen und klingt natürlich.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: „Widder“ ist die übliche und genaue deutsche Entsprechung im Opferkontext.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sieben einjährige männliche Lämmer
  rationale: כְּבָשִׂים bezeichnet hier männliche Lämmer; בְּנֵי שָׁנָה gibt ihr Alter mit einem Jahr an. Die Geschlechtsangabe wird ausdrücklich bewahrt.
- source_word: תְּמִימִם
  choice: ohne Fehler
  rationale: Im Opferkontext bezeichnet das Wort Tiere ohne körperlichen Makel. „Ohne Fehler“ ist klar und gegenwartsnah.
- source_word: יִהְיוּ לָכֶם
  choice: Sie sollen für euch … sein
  rationale: Die Formulierung erhält das ausdrücklich vorhandene לָכֶם („für euch“) und gibt die geforderte Beschaffenheit der von der Gemeinschaft bereitzustellenden Tiere wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen und folgt der vorgegebenen theologischen Entscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רֵיחַ נִיחֹחַ
  choice: einen angenehmen Duft
  alternative: einen beruhigenden Duft; einen Duft, der wohlgefällig macht
  rationale: Die traditionelle Opfersprache bleibt als Metapher stehen. Die Übersetzung erklärt weder einen buchstäblichen göttlichen Geruchssinn noch eine bestimmte Theorie der Besänftigung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit der Opferliste. Kultische Fachsprache wird dort beibehalten, wo sie geläufig ist („Brandopfer“); sonst werden verständliche gegenwärtige Formulierungen gewählt.
