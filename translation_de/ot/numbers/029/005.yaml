  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer, um für euch Sühne zu erwirken—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: und einen Ziegenbock
  rationale: שְׂעִיר עִזִּים bezeichnet idiomatisch einen männlichen Ziegenbock; אֶחָד gibt die Anzahl an. Die deutsche Wortstellung verbindet beides natürlich als „einen Ziegenbock“.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im Opferkontext bezeichnet חַטָּאת das Sündopfer und nicht lediglich die abstrakte Sünde. „Als“ gibt die Funktion des Tieres in der elliptischen Opferliste natürlich wieder.
- source_word: לְ/כַפֵּר
  choice: um … Sühne zu erwirken
  rationale: Das Verb כפר bezeichnet im priesterlichen Opferkontext das Vollziehen bzw. Bewirken von Sühne. Diese Formulierung bewahrt die kultisch-theologische Bedeutung, ohne einen bestimmten späteren Erklärungsansatz festzulegen.
- source_word: עֲלֵי/כֶם
  choice: für euch
  rationale: עַל mit כפר bezeichnet hier die Personen, zu deren Gunsten die Sühne geschieht. „Für euch“ ist präzise und natürlich.
theological_decisions:
- issue: Wiedergabe der priesterlichen כפר-Terminologie
  choice: um für euch Sühne zu erwirken
  alternative: um für euch Sühnung zu vollziehen
  rationale: „Sühne erwirken“ wahrt die kultische und theologische Breite des hebräischen Ausdrucks, ohne den Mechanismus näher zu bestimmen. Die Alternative ist stärker fachsprachlich und im heutigen Deutsch weniger natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, elliptische Form einer Opferliste bleibt erhalten; der Gedankenstrich führt wie im Kontext zum folgenden Vers weiter.
