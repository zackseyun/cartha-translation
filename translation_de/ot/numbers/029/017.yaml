- source_word: וּ/בַ/יּוֹם הַ/שֵּׁנִי
  choice: Und am zweiten Tag
  rationale: Die Verbindung aus Konjunktion, Präposition, Substantiv und Ordinalzahl führt den nächsten Tag in der fortlaufenden Opferliste ein; „Und am“ bewahrt diesen Zusammenhang natürlich.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: Stiere aus der Rinderherde
  rationale: פָּרִים bezeichnet im Opferkontext Stiere; בְּנֵי בָקָר ist wörtlich „Söhne der Rinderherde“ und ordnet sie idiomatisch dem Rindvieh zu.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Kardinalzahl bestimmt die Stiere.
- source_word: אֵילִם שְׁנָיִם
  choice: zwei Widder
  rationale: אֵילִם ist die übliche Bezeichnung für männliche Schafe, besonders in Opferbestimmungen.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: einjährige Lämmer
  rationale: כְּבָשִׂים bezeichnet hier Lämmer; die feste Wendung בְּנֵי שָׁנָה gibt ihr Alter als ein Jahr an.
- source_word: אַרְבָּעָה עָשָׂר
  choice: vierzehn
  rationale: Die Kardinalzahl bestimmt die Lämmer.
- source_word: תְּמִימִם
  choice: makellose
  rationale: Im Opferrecht bezeichnet das Adjektiv Tiere ohne körperlichen Fehler; „makellos“ ist präzise und in modernem Deutsch natürlich.
