  language: de
  text: und je ein Zehntel für jedes der vierzehn Lämmer[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wird »ein Zehntel« zweimal wiederholt (»ein Zehntel, ein Zehntel«). Damit wird ausgedrückt, dass auf jedes einzelne Lamm diese Menge entfällt.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: je ein Zehntel
  rationale: Die Wiederholung bezeichnet distributiv den auf jedes einzelne Tier entfallenden Zehntelanteil. »Je ein Zehntel« gibt diese Funktion im Deutschen knapp und natürlich wieder.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: für jedes Lamm
  rationale: Wörtlich steht »für das eine Lamm«; im Zusammenhang der Opferliste ist die Wendung distributiv zu verstehen und bezeichnet die Menge pro Lamm.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: für die vierzehn Lämmer
  rationale: Die Formulierung bezeichnet die bereits festgelegte Gesamtgruppe von vierzehn Lämmern; der bestimmte Artikel bildet diesen Kontext natürlich ab.
