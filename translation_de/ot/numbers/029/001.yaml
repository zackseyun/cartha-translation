base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: de
  text: Und im siebten Monat, am ersten Tag des Monats, sollt ihr eine heilige Versammlung halten. Ihr sollt keinerlei gewöhnliche Arbeit verrichten. Ein Tag des Signalrufs soll es für euch sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Tag des Hornsignals“ beziehungsweise „ein Tag des Jubelrufs“. Das hebräische Wort bezeichnet einen lauten, weithin hörbaren Schall und kann je nach Zusammenhang ein Horn- oder Trompetensignal, einen Ruf oder einen Jubelruf meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Und im siebten Monat
  rationale: Die Präposition ב bezeichnet hier die Zeitangabe; das einleitende ו wird entsprechend dem fortlaufenden Gesetzesstil mit „Und“ wiedergegeben.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Die wörtlich mit „am Einen des Monats“ gebildete hebräische Kalenderformel bezeichnet eindeutig den ersten Monatstag.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung halten
  rationale: Die feste kultische Wendung bezeichnet eine einberufene heilige Zusammenkunft. Die verbale Fügung mit „halten“ ist im Deutschen natürlicher als „eine Versammlung soll euch sein“.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei gewöhnliche Arbeit
  rationale: Gemeint ist die für Festtage untersagte reguläre Arbeitsleistung, nicht ausnahmslos jede Tätigkeit. „Gewöhnliche Arbeit“ ist modern und vermeidet das missverständliche oder altertümliche „Dienstarbeit“.
- source_word: לֹא תַעֲשׂוּ
  choice: Ihr dürft … nicht verrichten
  rationale: Die Formulierung gibt das Verbot in der zweiten Person Plural klar und mit angemessenem Gesetzeston wieder; zusammen mit כָּל wird es idiomatisch als „keinerlei“ formuliert.
- source_word: יוֹם תְּרוּעָה
  choice: ein Tag des Schallens
  rationale: תְּרוּעָה bezeichnet einen lauten, erhobenen Schall und kann je nach Zusammenhang ein Horn- beziehungsweise Trompetensignal, Rufen oder Jubel meinen. „Schallen“ bewahrt diese Breite, ohne ein im Hebräischen nicht genanntes Instrument festzulegen.
- source_word: יִהְיֶה לָכֶם
  choice: soll es für euch sein
  rationale: Die Wendung bezeichnet, wozu der Tag für die Gemeinschaft bestimmt ist, und bleibt in dieser Satzstellung nah am Hebräischen.
theological_decisions:
- issue: Bezeichnung des Festtags durch יוֹם תְּרוּעָה
  choice: ein Tag des Schallens
  alternative: ein Tag des Hornsignals / ein Tag des Jubelrufs
  rationale: Der Text verwendet keinen späteren Festnamen und nennt auch das Instrument nicht ausdrücklich. Deshalb wird die charakteristische Lautäußerung beschrieben und ihre sachlich möglichen Ausprägungen werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlichem Gesetzesstil. „Heilige Versammlung“ bewahrt den kultischen Charakter; „Tag des Schallens“ erhält bewusst die Mehrdeutigkeit des hebräischen Festbegriffs.
