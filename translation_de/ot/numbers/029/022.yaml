  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer, zusätzlich zum regelmäßigen Brandopfer[a], seinem Speisopfer und seinem Trankopfer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum beständigen Brandopfer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seinem Speisopfer und seinem Trankopfer“; die Fürwörter beziehen sich auf das regelmäßige Brandopfer.'
    reason: cross_reference
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: und einen Ziegenbock
  rationale: שָׂעִיר bezeichnet hier einen männlichen Ziegenbock; die vorangestellte Konjunktion wird mit „und“ wiedergegeben.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das Sündopfer, nicht abstrakt die Sünde.
- source_word: אֶחָד
  choice: einen
  rationale: Der Numeral gibt ausdrücklich die Anzahl des Opfertiers an; im deutschen Akkusativ trägt „einen“ zugleich die Bedeutung „ein einzelner“.
- source_word: מִ/לְּ/בַד
  choice: zusätzlich zu
  rationale: Die Wendung kennzeichnet die genannten Opfer als Ergänzung zum regelmäßig dargebrachten Opferkomplex.
- source_word: עֹלַת הַ/תָּמִיד
  choice: zum regelmäßigen Brandopfer
  rationale: עֹלָה ist der übliche Ausdruck für das Brandopfer; תָּמִיד beschreibt hier dessen wiederkehrende, festgesetzte Darbringung.
- source_word: וּ/מִנְחָתָ/הּ
  choice: seinem Speisopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext das aus pflanzlichen Erzeugnissen bestehende Speisopfer. Das feminine Suffix bezieht sich grammatisch auf עֹלָה; im Deutschen richtet sich das Pronomen nach dem sächlichen „Brandopfer“.
- source_word: וְ/נִסְכָּ/הּ
  choice: und seinem Trankopfer
  rationale: נֶסֶךְ bezeichnet das als Begleitopfer ausgegossene Trankopfer; auch dieses Suffix verweist auf das regelmäßige Brandopfer.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte kultische Terminologie „Sündopfer“, „Brandopfer“, „Speisopfer“ und „Trankopfer“ bleibt erhalten. „Regelmäßig“ gibt die wiederkehrende Funktion von תָּמִיד natürlich wieder; die Alternative „beständig“ wird in einer Fußnote bewahrt.
