base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: de
  text: und ihre Speisopfer und ihre Trankopfer für die Stiere, die Widder und die Lämmer, entsprechend ihrer Zahl und nach der Vorschrift[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach der vorgeschriebenen Weise“. Das hebräische Wort bezeichnet hier das festgelegte Verfahren für diese Opfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ihre Speisopfer
  rationale: מִנְחָה bezeichnet im Opferkontext die zu den Tieropfern gehörenden Speisopfer. Der deutsche Plural gibt die Verteilung auf mehrere Tiere natürlich wieder.
- source_word: וְנִסְכֵּיהֶם
  choice: und ihre Trankopfer
  rationale: נֶסֶךְ bezeichnet ein ausgegossenes Getränkopfer; „Trankopfer“ ist der geläufige und verständliche kultische Fachausdruck.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: für die Stiere, die Widder und die Lämmer
  rationale: Das Präfix ל kennzeichnet hier die Zuordnung der begleitenden Opfer zu den jeweiligen Opfertieren. Im Deutschen genügt ein gemeinsames „für“ vor der Aufzählung.
- source_word: בְּמִסְפָּרָם
  choice: entsprechend ihrer Zahl
  rationale: Die begleitenden Opfer richten sich nach der Zahl der genannten Tiere; „entsprechend“ drückt diese Zuordnung idiomatisch aus.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte rechtlich-kultische Verfahrensordnung. „Vorschrift“ bewahrt diesen formalen Sinn und bleibt allgemein verständlich.
