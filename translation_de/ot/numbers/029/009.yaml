  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: de
  text: 'und ihr Getreideopfer: Feinmehl, mit Öl vermengt, drei Zehntelmaße[a] für den Stier und zwei Zehntelmaße für den einen Widder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Angaben „drei Zehntelmaße“ und „zwei Zehntelmaße“ bezeichnen Zehntel-Einheiten, die traditionell als Zehntel eines Efa verstanden werden.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: und ihr Speisopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das aus Getreide bestehende Begleitopfer. „Speisopfer“ ist im Deutschen prägnant und im biblischen Kultwortschatz verständlich; das Suffix wird als „ihr“ wiedergegeben und bezieht sich auf die zuvor genannten Opfertiere.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת bezeichnet hochwertiges, fein gemahlenes Mehl für Opfergaben. „Feinmehl“ ist genau, geläufig und knapp.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip beschreibt das Feinmehl als mit Öl vermischt. „Vermengt“ ist natürlich, würdig und bewahrt die Zubereitungsangabe.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: drei Zehntelmaß
  rationale: עִשָּׂרוֹן bezeichnet ein Zehntelmaß. „Zehntelmaß“ hält die im Hebräischen benannte Maßeinheit fest, ohne die traditionell angenommene Bezugsgröße Efa in den Haupttext einzutragen.
- source_word: לַפָּר
  choice: für den Stier
  rationale: Der bestimmte Singular verweist auf den zuvor genannten Stier.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: zwei Zehntelmaß
  rationale: Wie bei der vorherigen Mengenangabe gibt „Zehntelmaß“ die hebräische Maßeinheit knapp und konsistent wieder.
- source_word: לָאַיִל הָאֶחָד
  choice: für den einen Widder
  rationale: Die Verbindung aus Artikel und אֶחָד hebt den einen, in der Opferliste genannten Widder hervor; „den einen Widder“ bewahrt diese Bestimmtheit.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit knapper kultischer Fachsprache. Der nominale Aufbau des Hebräischen bleibt durch den Doppelpunkt erhalten; die Maßeinheit wird nicht vorschnell zu „Efa“ aufgelöst.
