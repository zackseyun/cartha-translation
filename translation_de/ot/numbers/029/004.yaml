  - severity: low
    issue: Unvollständige Maßformulierung in der Fußnote
    rationale: „ein Zehntel Efa“ ist im modernen Deutschen weniger idiomatisch; „ein Zehntel eines Efa“ formuliert die gemeinte Maßrelation korrekt.
