  text: and one-tenth for each lamb[a], for the seven lambs.
translation:
  language: de
  text: und ein Zehntel für jedes Lamm[a], für die sieben Lämmer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »ein Zehntel«; im Zusammenhang der Opfergaben ist gewöhnlich ein Zehntel eines Efa gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: und ein Zehntel
  rationale: Die hebräische Wendung bezeichnet ein Zehntelmaß. Da der Ausgangstext die Bezugsgröße nicht ausdrücklich nennt, bleibt auch der Haupttext knapp; im Opferkontext ist ein Zehntel Efa Feinmehl gemeint.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: für jedes einzelne Lamm
  rationale: 'Wörtlich steht »für das eine Lamm«. In der Aufzählung hat die Formulierung distributiven Sinn: Die angegebene Menge gilt für jedes Lamm einzeln.'
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: für die sieben Lämmer
  rationale: Die Präpositionalphrase bezeichnet die bestimmte Gruppe von sieben Lämmern, auf welche die Menge je Tier anzuwenden ist.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der elliptische Charakter der Maßangabe bleibt im Haupttext erhalten; »jedes einzelne« macht die distributive Bedeutung des Hebräischen natürlich und eindeutig sichtbar.
