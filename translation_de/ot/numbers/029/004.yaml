  verdict: revise
  source_fidelity: Der Haupttext gibt וְעִשָּׂרוֹן אֶחָד korrekt als „und ein Zehntel“ wieder und bewahrt damit die im Hebräischen nicht ausdrücklich genannte Bezugsgröße. Die distributive Wiedergabe von לַכֶּבֶשׂ הָאֶחָד mit „für jedes Lamm“ ist im Kontext der Opferliste sachgerecht. „für die sieben Lämmer“ entspricht der bestimmten Siebenergruppe.
  naturalness: „Für jedes einzelne Lamm“ ist verständlich, aber „einzelne“ verstärkt ohne zusätzlichen Quelltextgehalt und klingt neben dem bereits distributiven „jedes“ unnötig schwer. „Für jedes Lamm“ ist natürliches modernes Standarddeutsch.
  terminology: „Zehntel“ und „Efa“ sind als kultische Maßtermini passend. Die Fußnote benötigt im Deutschen jedoch die idiomatische und grammatisch vollständige Formulierung „ein Zehntel eines Efa“; sie soll dabei weiterhin klarstellen, dass dies eine kontextuelle Einordnung und kein Zusatz im hebräischen Haupttext ist.
