source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: de
  text: und ihre Speisegabe und ihre Trankopfer für die Stiere, die Widder und die Lämmer, entsprechend ihrer Zahl und nach der Vorschrift.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der vorgeschriebenen Weise«. Das hebräische Wort bezeichnet hier die festgelegte Regel oder Verfahrensweise für diese Opfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ihre Speisegabe
  rationale: מִנְחָה bezeichnet im Opferkontext die aus Getreide bestehende Begleitgabe. »Speisegabe« ist im Deutschen verständlich und kultisch präzise.
- source_word: נִסְכֵּיהֶם
  choice: ihre Trankopfer
  rationale: נֶסֶךְ bezeichnet ausgegossene flüssige Opfergaben; »Trankopfer« ist die geläufige und klare deutsche Wiedergabe.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: für die Stiere, die Widder und die Lämmer
  rationale: Das wiederholte ל ordnet die begleitenden Gaben den jeweiligen Opfertieren zu. Die natürliche deutsche Aufzählung muss »für« nicht bei jedem Glied wiederholen.
- source_word: בְּמִסְפָּרָם
  choice: entsprechend ihrer Zahl
  rationale: Die Mengen der Begleitopfer richten sich nach der Anzahl der genannten Tiere.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte kultische Regel beziehungsweise Verfahrensweise; »Vorschrift« bewahrt den rechtlich-normativen Sinn und klingt im modernen Deutsch natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch-fachsprachlichen, aber allgemein verständlichen Begriffen. Das einleitende »dazu« bildet den syntaktischen Anschluss an den vorhergehenden Vers natürlich ab.
