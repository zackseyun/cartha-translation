id: NUM.29.27
reference: Numbers 29:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: de
  text: dazu ihr Speiseopfer und ihre Trankopfer für die Stiere, die Widder und die Lämmer, ihrer Zahl entsprechend und nach der Vorschrift.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach der vorgeschriebenen Weise“. Das hebräische Wort bezeichnet hier die festgelegte Regel oder das vorgeschriebene Verfahren für diese Opfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ihr Speiseopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das begleitende, aus Getreide bestehende Opfer; „Speiseopfer“ ist im Deutschen die klare und etablierte kultische Bezeichnung.
- source_word: נִסְכֵּיהֶם
  choice: ihre Trankopfer
  rationale: נֶסֶךְ bezeichnet ausgegossene Flüssigkeitsopfer; „Trankopfer“ ist präzise und allgemein verständlich.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: für die Stiere, die Widder und die Lämmer
  rationale: Das Präfix ל ordnet die begleitenden Opfer den jeweiligen Tiergruppen zu; „für“ gibt diese Zuordnung natürlich wieder.
- source_word: בְּמִסְפָּרָם
  choice: ihrer Zahl entsprechend
  rationale: Die Mengen der begleitenden Opfer richten sich nach der Zahl der Opfertiere; diese Formulierung ist präzise und idiomatisch.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte Regel beziehungsweise das vorgeschriebene Verfahren für die Opfer.
- source_word: וּ
  choice: dazu
  rationale: Der Vers hängt syntaktisch von der vorhergehenden Opferliste ab. „Dazu“ macht knapp deutlich, dass Speise- und Trankopfer die genannten Tieropfer begleiten.
theological_decisions:
- issue: Bedeutung von כַּמִּשְׁפָּט im kultischen Zusammenhang
  choice: nach der Vorschrift
  alternative: nach der vorgeschriebenen Weise
  rationale: Die Hauptfassung wahrt den rechtlich-kultischen Sinn, ohne festzulegen, ob vor allem die Regel selbst oder die geregelte Ausführung gemeint ist; die Fußnote erhält diese Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der elliptische Anschluss an den vorhergehenden Vers wird durch „dazu“ natürlich wiedergegeben; die kultischen Fachbegriffe „Speiseopfer“ und „Trankopfer“ bleiben erhalten.
