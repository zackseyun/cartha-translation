base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: de
  text: 'Und am dritten Tag: elf Stiere, zwei Widder und vierzehn einjährige Lämmer ohne Fehler[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „makellos“. Das hebräische Wort bezeichnet bei Opfertieren das Freisein von körperlichen Fehlern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁלִישִׁי
  choice: Und am dritten Tag
  rationale: Die Konjunktion und die Präposition führen den nächsten Tag in der fortlaufenden Aufzählung ein; die Ordnungszahl wird direkt wiedergegeben.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: elf Stiere
  rationale: פָּרִים bezeichnet hier männliche Rinder als Opfertiere. „Stiere“ ist im Deutschen klar und sachgerecht; ein ausdrücklicher Hinweis auf junge Tiere steht nicht im Text.
- source_word: אֵילִם שְׁנָיִם
  choice: zwei Widder
  rationale: אֵילִם ist die übliche Bezeichnung für ausgewachsene männliche Schafe und wird im Opferkontext direkt mit „Widder“ wiedergegeben.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: vierzehn einjährige Lämmer
  rationale: בְּנֵי שָׁנָה ist die feste Altersangabe „ein Jahr alt“; „einjährige Lämmer“ ist eine natürliche und genaue deutsche Formulierung.
- source_word: תְּמִימִם
  choice: ohne Fehler
  rationale: Im Opferrecht bezeichnet תָּמִים Tiere, die keinen körperlichen Defekt aufweisen. „Ohne Fehler“ gibt diesen konkreten kultischen Sinn verständlich wieder.
theological_decisions:
- issue: Bezug von תְּמִימִם
  choice: Die Formulierung steht unmittelbar bei den Lämmern und wird grammatisch auf sie bezogen.
  alternative: Die Eigenschaft könnte sinngemäß für alle genannten Opfertiere gelten.
  rationale: Wortstellung und Kongruenz lassen den unmittelbaren Bezug auf die Lämmer am deutlichsten erkennen; ein weiter gefasster sachlicher Bezug wird nicht ausdrücklich in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bewahrt den aufzählenden Charakter; die abschließende Interpunktion bleibt als Teil des fortlaufenden Satzes ein Komma.
