  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: de
  text: und einen Ziegenbock als Sündopfer, zusätzlich zum regelmäßigen Brandopfer und seinem Speisopfer und seinem Trankopfer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: und einen Ziegenbock
  rationale: שָׂעִיר bezeichnet hier einen männlichen Ziegenbock; das vorangestellte ו führt die Opferliste fort und wird mit „und“ wiedergegeben.
- source_word: חַטָּאת
  choice: als Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das Sündopfer, nicht abstrakt die Sünde.
- source_word: אֶחָד
  choice: einen
  rationale: Die Mengenangabe „eins“ wird im deutschen unbestimmten Artikel ausdrücklich bewahrt.
- source_word: מִ/לְּ/בַד
  choice: zusätzlich zu
  rationale: Die Wendung kennzeichnet dieses Opfer als Ergänzung zum regelmäßig dargebrachten Opferkomplex.
- source_word: עֹלַת הַ/תָּמִיד
  choice: dem regelmäßigen Brandopfer
  rationale: עֹלָה ist das vollständig verbrannte Brandopfer; תָּמִיד bezeichnet seine regelmäßig fortlaufende Darbringung, ohne hier eigens „täglich“ zu sagen.
- source_word: וּ/מִנְחָתָ/הּ
  choice: und dem dazugehörigen Speisopfer
  rationale: מִנְחָה bezeichnet in dieser Opferliste das begleitende Speisopfer. Das feminine Suffix bezieht sich auf עֹלָה; „dazugehörig“ macht diesen Bezug im Deutschen eindeutig und natürlich.
- source_word: וְ/נִסְכָּ/הּ
  choice: und Trankopfer
  rationale: נֶסֶךְ bezeichnet die begleitende Flüssigkeitsspende. Der Bezug auf das Brandopfer wird durch das bereits gesetzte „dazugehörigen“ gemeinsam für Speis- und Trankopfer ausgedrückt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache; die knappe Form einer kultischen Aufzählung bleibt erhalten. „Regelmäßig“ bewahrt die Bedeutung von תָּמִיד, ohne sie enger als „täglich“ festzulegen.
