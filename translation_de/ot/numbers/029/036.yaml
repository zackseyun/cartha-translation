  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: de
  text: 'Und ihr sollt ein Brandopfer darbringen, ein Feueropfer für Jahwe, zu einem wohlgefälligen Duft: einen Stier, einen Widder und sieben einjährige, fehlerlose Lämmer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem angenehmen Duft“. Die hebräische Wendung ist eine feste Opferformel für ein Opfer, das Gott wohlgefällig und von ihm angenommen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Und ihr sollt … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das rituelle Darbringen; die deutsche Verbklammer ergibt eine natürliche und zugleich präzise Formulierung.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Der etablierte deutsche Kultbegriff bezeichnet das Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Die Wiedergabe hält fest, dass es sich um ein durch Feuer dargebrachtes Opfer handelt, ohne die mögliche Deutung als Speiseopfer einzutragen.
- source_word: רֵיחַ נִיחֹחַ
  choice: wohlgefälliger Duft
  rationale: Die feste Opferformel beschreibt das Opfer als für Gott annehmbar; ‚wohlgefällig‘ bewahrt den kultischen Sinn in würdigem, verständlichem Deutsch.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet die Ausrichtung beziehungsweise Bestimmung des Opfers; der Gottesname wird als Jahwe wiedergegeben.
- source_word: פַּר אֶחָד
  choice: einen Stier
  rationale: פַּר bezeichnet hier ein männliches Rind; ein bestimmtes junges Alter wird im Hebräischen an dieser Stelle nicht ausdrücklich genannt.
- source_word: אַיִל אֶחָד
  choice: einen Widder
  rationale: אַיִל ist in Opferlisten die übliche Bezeichnung für einen Widder.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sieben einjährige Lämmer
  rationale: Die wörtliche Altersangabe ‚Söhne eines Jahres‘ wird idiomatisch als ‚einjährig‘ wiedergegeben; ein zusätzliches ‚männlich‘ ist lexikalisch nicht zwingend.
- source_word: תְּמִימִם
  choice: fehlerlose
  rationale: Im Opferkontext bezeichnet das Wort Tiere ohne körperlichen Makel oder Defekt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird transparent als ‚Jahwe‘ wiedergegeben, statt ihn durch einen Titel zu ersetzen; ‚Jahwe‘ entspricht im Deutschen der üblichen wissenschaftlich begründeten Form.
- issue: Bedeutung der Formel רֵיחַ נִיחֹחַ
  choice: wohlgefälliger Duft
  alternative: beruhigender Duft; angenehmer Duft
  rationale: Die Formulierung wahrt das konkrete Geruchsbild und signalisiert zugleich die Annahme des Opfers durch Gott, ohne die Wendung auf eine menschliche Gemütsberuhigung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit den etablierten kultischen Begriffen „Brandopfer“ und „Feueropfer“. Die Satzstellung bleibt trotz der langen Opferliste gut verständlich. Der Fußnotenmarker steht am Versende und erläutert ausschließlich die feste hebräische Opferformel.
