  text: Je ein Zehntel für ein Lamm, für die sieben Lämmer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Zehntel, ein Zehntel«; bei Opfergaben bezeichnet dies ein Zehntel eines Efa.'
