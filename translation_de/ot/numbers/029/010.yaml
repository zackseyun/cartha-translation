lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: je ein Zehntel
  rationale: 'Die Wiederholung drückt hier eine Verteilung aus: Für jedes einzelne Lamm ist ein Zehntel vorgesehen. Die Bezugsgröße, im Opferkontext ein Zehntel Efa, wird im Haupttext nicht ergänzt, weil sie in diesem Vers nicht ausdrücklich steht; eine Fußnote erläutert sie.'
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: für jedes Lamm
  rationale: Wörtlich steht »für das eine Lamm«; innerhalb der Aufzählung hat die Formulierung verteilenden Sinn und wird im Deutschen natürlich mit »für jedes Lamm« wiedergegeben.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: für die sieben Lämmer
  rationale: Der bestimmte Ausdruck bezeichnet die bereits genannte Gesamtzahl der Lämmer und begrenzt die verteilende Angabe auf diese sieben Tiere.
