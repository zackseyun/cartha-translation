  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: de
  text: dazu ihr Speiseopfer und ihre Trankopfer für den Stier, den Widder und die Lämmer, entsprechend ihrer Anzahl und nach der Vorschrift.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach der festgesetzten Ordnung“. Das hebräische Wort bezeichnet hier die verbindliche Regelung für die Ausführung dieser Opfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: ihr Speiseopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das begleitende Speiseopfer. Der kollektive Singular mit Suffix der 3. Person Plural bleibt erhalten.
- source_word: וְנִסְכֵּיהֶם
  choice: und ihre Trankopfer
  rationale: נֶסֶךְ bezeichnet ein ausgegossenes Flüssigkeitsopfer. „Trankopfer“ ist der geläufige und verständliche deutsche Fachausdruck.
- source_word: לַפָּר
  choice: für den Stier
  rationale: פַּר bezeichnet hier das männliche Rind im Opferverzeichnis; „Stier“ gibt dies direkt wieder.
- source_word: לָאַיִל
  choice: für den Widder
  rationale: אַיִל bedeutet im Opferkontext eindeutig „Widder“.
- source_word: וְלַכְּבָשִׂים
  choice: und die Lämmer
  rationale: כֶּבֶשׂ bezeichnet ein Lamm, im Opfergebrauch häufig ein männliches Tier. Im Deutschen ist „Lämmer“ in dieser Liste natürlich und ausreichend.
- source_word: בְּמִסְפָּרָם
  choice: entsprechend ihrer Anzahl
  rationale: Die Wendung bezeichnet die Übereinstimmung der Beigaben mit der festgelegten Zahl der Opfertiere; die Formulierung ist idiomatisch und bewahrt den Verfahrenscharakter.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die verbindliche kultische Regelung beziehungsweise die vorgeschriebene Ausführung. „Vorschrift“ ist im modernen Deutsch klar und wahrt den rechtlich-formalen Sinn.
