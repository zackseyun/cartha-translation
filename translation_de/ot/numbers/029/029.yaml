  text: וּ/בַ/יּ֧וֹם הַ/שִּׁשִּׁ֛י פָּרִ֥ים שְׁמֹנָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: de
  text: 'Und am sechsten Tag: acht Stiere, zwei Widder und vierzehn einjährige, makellose männliche Lämmer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שִּׁשִּׁי
  choice: Und am sechsten Tag
  rationale: Die Verbindung aus Konjunktion, Präposition, »Tag« und Ordinalzahl führt den nächsten Tag in der fortlaufenden Opferordnung ein; die deutsche Formulierung gibt dies natürlich und genau wieder.
- source_word: פָּרִים שְׁמֹנָה
  choice: acht Stiere
  rationale: פָּרִים bezeichnet im Opferkontext Stiere; ein bestimmtes Alter wird hier nicht ausdrücklich genannt.
- source_word: אֵילִם שְׁנָיִם
  choice: zwei Widder
  rationale: אֵילִם ist die übliche Bezeichnung für männliche Schafe, besonders im Opferkontext.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: vierzehn ... männliche Lämmer
  rationale: כְּבָשִׂים bezeichnet Lämmer und ist grammatisch männlich; »männliche Lämmer« bewahrt die für Opfertiere relevante Spezifizierung.
- source_word: בְּנֵי שָׁנָה
  choice: einjährige
  rationale: Die hebräische Wendung bezeichnet Tiere im Alter von einem Jahr; »einjährige« ist im Deutschen knapp und idiomatisch.
- source_word: תְּמִימִם
  choice: makellose
  rationale: Im kultischen Zusammenhang bezeichnet das Wort Tiere ohne körperlichen Fehler oder Makel; »makellos« ist eine klare und geläufige deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Aufzählungsform des Hebräischen bleibt durch den Doppelpunkt erhalten; die Adjektive stehen natürlich gebündelt bei »männliche Lämmer«.
