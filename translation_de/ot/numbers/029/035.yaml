  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: de
  text: Am achten Tag sollt ihr eine Festversammlung[a] halten; keinerlei gewöhnliche Arbeit dürft ihr verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Abschlussversammlung«. Das hebräische Wort עֲצֶרֶת kann eine Versammlung zum Abschluss eines Festes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Am achten Tag
  rationale: Gibt die bestimmte Ordinalzahl und die Zeitangabe knapp und natürlich wieder, ohne ausdrücklich »des Festes« zu ergänzen.
- source_word: עֲצֶרֶת
  choice: Festversammlung
  rationale: Bezeichnet im kultischen Zusammenhang eine feierliche beziehungsweise abschließende Versammlung. »Festversammlung« ist verständlich und wahrt den sakralen Kontext; die mögliche Bedeutung »Abschlussversammlung« steht in der Fußnote.
- source_word: תִּהְיֶה לָכֶם
  choice: sollt ihr … halten
  rationale: Das wörtliche »soll für euch sein« wird als idiomatische deutsche Anordnung wiedergegeben und mit »Festversammlung« verbunden.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei Berufsarbeit
  rationale: Die feste Wendung meint die gewöhnliche beziehungsweise berufliche Arbeit, die an heiligen Festtagen untersagt ist, nicht unterschiedslos jede Tätigkeit. »Berufsarbeit« bildet den Charakter geregelter Arbeitsverrichtung klar ab.
- source_word: לֹא תַעֲשׂוּ
  choice: dürft ihr nicht verrichten
  rationale: Die negierte Verbform erteilt im gesetzlichen Kontext ein Verbot; »dürft ihr nicht« ist gegenwärtiges, würdevolles Deutsch.
theological_decisions:
- issue: Bedeutung von עֲצֶרֶת innerhalb des Festkalenders
  choice: Im Haupttext steht »Festversammlung« ohne spätere liturgische oder konfessionelle Festbezeichnung.
  alternative: »Abschlussversammlung« betont, dass die Zusammenkunft den Festzeitraum beschließt.
  rationale: Der achte Tag und der Festkontext legen eine abschließende Versammlung nahe, doch das Substantiv selbst lässt eine allgemeinere kultische Bezeichnung zu. Diese Spannung wird durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes, standarddeutsches und würdevolles Gesetzesregister. Der parallele Satzbau bleibt erhalten; unnötig altertümliche Ausdrücke wie »knechtliche Arbeit« werden vermieden.
