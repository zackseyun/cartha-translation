lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: Und am vierten Tag
  rationale: Die Verbindung aus Konjunktion, Präposition und Zeitangabe führt den nächsten Abschnitt der fortlaufenden Opferliste ein; diese Wiedergabe ist im Deutschen natürlich und bewahrt den Anschluss.
- source_word: פָּרִים
  choice: Stiere
  rationale: Im Opferkontext bezeichnet פָּרִים männliche Rinder; „Stiere“ ist die direkte und verständliche deutsche Entsprechung.
- source_word: עֲשָׂרָה
  choice: zehn
  rationale: Die Kardinalzahl gibt die Anzahl der Stiere an.
- source_word: אֵילִם
  choice: Widder
  rationale: Dies ist die übliche deutsche Entsprechung des Opfertiers אֵילִם.
- source_word: שְׁנָיִם
  choice: zwei
  rationale: Die Kardinalzahl gibt die Anzahl der Widder an.
- source_word: כְּבָשִׂים
  choice: Lämmer
  rationale: Das Wort bezeichnet in dieser Opferliste Lämmer; das grammatische Geschlecht im Hebräischen weist hier auf männliche Tiere, doch im natürlichen deutschen Haupttext genügt „Lämmer“.
- source_word: בְּנֵי שָׁנָה
  choice: einjährige
  rationale: Die hebräische Altersformel bezeichnet Tiere im ersten Lebensjahr beziehungsweise von etwa einem Jahr; „einjährige“ ist knapp und idiomatisch.
- source_word: אַרְבָּעָה עָשָׂר
  choice: vierzehn
  rationale: Die zusammengesetzte Kardinalzahl gibt die Anzahl der Lämmer an.
- source_word: תְּמִימִם
  choice: makellose
  rationale: Im Opferrecht bezeichnet das Adjektiv Tiere ohne körperlichen Fehler; „makellos“ gibt diesen kultischen Sinn präzise und in heutigem Deutsch wieder.
