  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: de
  text: 'Und ihr Speiseopfer soll aus Feinmehl bestehen, das mit Öl vermengt ist: drei Zehntel[a] für den Stier, zwei Zehntel für den Widder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „drei Zehntel“ und „zwei Zehntel“ sind Zehntel eines Efa gemeint, eines Trockenmaßes im Opferwesen Israels.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Und als ihr Speiseopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das Speiseopfer; das Suffix bezieht sich auf die zuvor genannten Opfertiere. Die knappe nominale Form des Hebräischen bleibt erhalten.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת bezeichnet hochwertiges, fein gemahlenes Mehl für Opfergaben; „Feinmehl“ ist im Deutschen präzise und geläufig.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip bezeichnet das Zubereiten des Mehls durch Vermengen mit Öl. „Vermengt“ wahrt den gehobenen, kultischen Ton und ist dennoch verständlich.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: drei Zehntel
  rationale: עִשָּׂרוֹן ist ein Zehntel eines Efa. Die Kurzform im Haupttext bewahrt den knappen Wortlaut; die Maßeinheit wird in der Fußnote erklärt.
- source_word: לַפָּר
  choice: für den Stier
  rationale: פַּר bezeichnet hier den einzelnen Opferstier; der Singular des Ausgangstextes wird bewahrt.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: zwei Zehntel
  rationale: Wie zuvor ist die zugrunde liegende Einheit ein Zehntel-Efa; die knappe Mengenangabe entspricht der hebräischen Form.
- source_word: לָאָיִל
  choice: für den Widder
  rationale: אַיִל bezeichnet im Opferkontext eindeutig einen Widder; der Singular wird beibehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufzählungsstruktur des Hebräischen bleibt erhalten; der Gedankenstrich verdeutlicht die anschließenden Mengenangaben. Der traditionelle und sachlich genaue Ausdruck „Speiseopfer“ wird verwendet.
