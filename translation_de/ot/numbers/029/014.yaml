  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: de
  text: 'Und als ihr Speiseopfer: Feinmehl, mit Öl vermengt – drei Zehntel für jeden der dreizehn Stiere[a] und zwei Zehntel für jeden der beiden Widder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „drei Zehntel“ und „zwei Zehntel“ sind Zehntelmaße gemeint, traditionell als Zehntel eines Efa verstanden.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Und als ihr Speiseopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das Speiseopfer; das Suffix im maskulinen Plural bezieht sich auf die genannten Opfertiere beziehungsweise die zugehörigen Opfer.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der etablierte deutsche Ausdruck gibt das für Speiseopfer verwendete fein gemahlene Mehl prägnant wieder.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip bezeichnet das Zubereiten des Mehls durch Vermengen mit Öl; die Formulierung ist würdig und zugleich gut verständlich.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: drei Zehntel
  rationale: עִשָּׂרוֹן bezeichnet ein Zehntelmaß, gewöhnlich als ein Zehntel Efa verstanden. Wie im Hebräischen bleibt die Bezugsgröße im Haupttext unausgesprochen und wird in der Fußnote erklärt.
- source_word: לַפָּר הָאֶחָד לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: für jeden der dreizehn Stiere
  rationale: Das wörtliche 'für den einen Stier, für dreizehn Stiere' ist distributiv gemeint. Die zusammengezogene deutsche Formulierung bewahrt sowohl die Menge je Tier als auch die Gesamtzahl.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: zwei Zehntel
  rationale: Dasselbe kultische Zehntelmaß wie zuvor wird im parallelen Ausdruck konsistent wiedergegeben.
- source_word: לָאַיִל הָאֶחָד לִשְׁנֵי הָאֵילִם
  choice: für jeden der beiden Widder
  rationale: Die hebräische Einzahl mit Artikel hat distributive Funktion; die natürliche deutsche Formulierung verbindet die Zuteilung je Tier mit der Gesamtzahl von zwei Widdern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kultische Fachausdruck „Speiseopfer“ und die traditionelle Maßeinheit bleiben erhalten; die distributiven hebräischen Wendungen werden idiomatisch zusammengezogen. Der Fußnotenmarker steht nach der ersten vollständigen Mengenangabe und erläutert beide Zehntelangaben.
