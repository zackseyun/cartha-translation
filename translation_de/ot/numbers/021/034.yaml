source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Fürchte dich nicht vor ihm, denn ich habe ihn, sein ganzes Volk und sein Land in deine Hand gegeben.[a] Du sollst mit ihm genauso verfahren, wie du mit Sihon, dem König der Amoriter, verfahren bist, der in Heschbon wohnte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„In deine Hand gegeben“ bedeutet: deiner Gewalt ausgeliefert.'
    reason: Erläuterung eines hebräischen Idioms bei gleichzeitiger Bewahrung des Bildes im Haupttext.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen in seiner im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Fürchte dich nicht vor ihm
  rationale: Entspricht dem Verbot im Hebräischen und ist zugleich natürliches, würdevolles Gegenwartsdeutsch.
- source_word: בְיָדְךָ נָתַתִּי
  choice: ich habe ... in deine Hand gegeben
  rationale: Bewahrt sowohl das hebräische Hand-Bild als auch die perfektische Form, die die Übergabe als feststehend darstellt.
- source_word: אֹתוֹ וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: ihn mit seinem ganzen Volk und seinem Land
  rationale: Gibt alle drei Objekte vollständig wieder; „mit“ verbindet die Aufzählung im Deutschen flüssig.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Du sollst mit ihm genauso verfahren, wie du ... verfahren bist
  rationale: „Verfahren“ gibt die Konstruktion עשה ל verständlich wieder und erhält den ausdrücklichen Vergleich mit dem Vorgehen gegen Sihon.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: mit Sihon, dem König der Amoriter
  rationale: Bewahrt Eigenname und Titel; die Apposition ist im Deutschen natürlich.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: der in Heschbon wohnte
  rationale: Das Partizip bezeichnet hier Sihons Wohn- beziehungsweise Herrschaftssitz; „wohnte“ ist eine unmittelbare und gut verständliche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Eigennamen ausdrücklich. „Jahwe“ erhält diese Unterscheidung, ohne einen bloßen Titel einzusetzen.
- issue: Gewissheit der göttlichen Zusage נָתַתִּי
  choice: ich habe ... gegeben
  alternative: ich werde ... geben
  rationale: Das hebräische Perfekt wird nicht in ein Futur aufgelöst. So bleibt die Spannung erhalten, dass Gott die Übergabe als bereits feststehend bezeichnet, obwohl die Auseinandersetzung noch bevorsteht.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Erzählstil. „Sagte“ vermeidet unnötige Altertümlichkeit; „Fürchte dich nicht“ und das Bild von der Hand bewahren den biblischen Ton. Der Fußnotenmarker [a] steht unmittelbar nach dem erläuterten Ausdruck.
