  text: מִ/שָּׁ֖ם נָסָ֑עוּ וַֽ/יַּחֲנ֖וּ בְּ/נַ֥חַל זָֽרֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: de
  text: Von dort brachen sie auf und lagerten am Wadi Zered[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Tal von Zered«, »in der Schlucht von Zered« oder »am Bach Zered«; das hebräische Wort kann ein Wadi, eine Schlucht oder ein zeitweise wasserführendes Bachbett bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Die adverbiale Wendung bezeichnet den Aufbruch vom zuvor genannten Ort; »Von dort« ist im modernen Deutschen natürlich und wahrt die Erzählfolge.
- source_word: נָסָעוּ
  choice: brachen sie auf
  rationale: נסע bezeichnet in Reiseberichten häufig das Abbrechen des Lagers und den anschließenden Aufbruch. »brachen … auf« gibt diesen Sinn idiomatisch wieder.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: חנה bedeutet »lagern« oder »das Lager aufschlagen«. »lagerten« ist verständlich, knapp und dem Reisezusammenhang angemessen.
- source_word: בְּנַחַל
  choice: am Wadi
  rationale: נחל kann ein Wadi, eine Schlucht oder ein zeitweise wasserführendes Bachbett bezeichnen. Mit einem Gewässer- oder Landschaftsnamen gibt »am Wadi« die Ortsangabe im Deutschen natürlich wieder, ohne die genaue Beschaffenheit festzulegen.
- source_word: זָרֶד
  choice: Sered
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren, der hebräischen Aussprache angenäherten Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Wegnotiz und ihre Abfolge bleiben erhalten; »Wadi« bewahrt die geografische Offenheit des hebräischen נחל.
