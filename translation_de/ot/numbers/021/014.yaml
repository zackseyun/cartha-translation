id: NUM.21.14
reference: Numbers 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: de
  text: 'Darum heißt es im Buch der Kriege Jahwes[a]:

    »Waheb in Sufa[b] und die Bachtäler des Arnon.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jahwe gibt den hebräischen Gottesnamen JHWH wieder.
    reason: divine_name
  - marker: b
    text: 'Oder möglicherweise: „Waheb im Sturm“. Der hebräische Wortlaut dieser zitierten Zeile ist dunkel; auch „Waheb“ wird teils anders verstanden, sogar als Bestandteil einer Verbalaussage statt als Ortsname.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt die folgernde Formel knapp und idiomatisch wieder.
- source_word: יֵאָמַר
  choice: heißt es
  rationale: Das unpersönliche Nifal leitet hier ein Zitat aus einer schriftlichen Quelle ein; „heißt es“ ist im Deutschen natürlich.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: im Buch der Kriege Jahwes
  rationale: Bewahrt die Konstruktion und den Plural „Kriege“; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֶת וָהֵב
  choice: Waheb
  rationale: Die schwer verständliche Form wird am ehesten als Ortsname aufgefasst und daher transliteriert, ohne eine unsichere verbale Deutung in den Haupttext einzutragen.
- source_word: בְּסוּפָה
  choice: in Sufa
  rationale: Die Form wird im Haupttext als Ortsname verstanden; die ebenfalls mögliche Bedeutung als Gattungswort „Sturm“ bleibt in der Fußnote erhalten.
- source_word: וְאֶת הַנְּחָלִים
  choice: und die Bachtäler
  rationale: נְחָלִים bezeichnet hier wahrscheinlich Täler beziehungsweise Rinnen saisonaler Wasserläufe; „Bachtäler“ ist verständlich und geografisch angemessener als das im Deutschen weniger allgemein geläufige „Wadis“.
- source_word: אַרְנוֹן
  choice: des Arnon
  rationale: Der Genitiv verbindet die Bachtäler natürlich mit dem geografischen Namen Arnon.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname bewahrt, dass der hebräische Text den persönlichen Gottesnamen nennt, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zitatform bleibt knapp und poetisch; die erhebliche Unsicherheit der Orts- und Wortdeutung wird nicht geglättet, sondern in Fußnote [b] offengelegt.
