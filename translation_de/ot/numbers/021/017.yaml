base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: de
  text: 'Da sang Israel dieses Lied:


    »Steig auf, Brunnen! Antwortet ihm![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet »antworten« oder »entgegnen«. Im Kontext dieses Liedes kann es einen responsorischen oder wechselnden Gesang bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Leitet in der Erzählfolge die unmittelbar anschließende Handlung natürlich ein.
- source_word: יָשִׁיר
  choice: sang
  rationale: Der Imperfekt hat zusammen mit אָז hier Vergangenheitsbedeutung.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Volk.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: dieses Lied
  rationale: Gibt den bestimmten Ausdruck mit Demonstrativpronomen direkt und idiomatisch wieder.
- source_word: עֲלִי
  choice: Steig auf
  rationale: Der feminine Singular des Imperativs richtet sich an den Brunnen; die bildhafte Aufforderung an das Wasser bleibt erhalten.
- source_word: בְאֵר
  choice: Brunnen
  rationale: Die direkte Anrede ist im Deutschen ohne ein zusätzliches »o« klar und wirkt würdevoll, aber nicht altertümlich.
- source_word: עֱנוּ לָהּ
  choice: Singt ihm zu
  rationale: ענה kann in einem Liedkontext responsorisches Antworten bezeichnen. Die Wiedergabe macht den musikalischen Wechselgesang verständlich, ohne die Beziehung zum Verb »antworten« zu verschweigen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, poetischer Form. »Da sang« wahrt den erzählerischen Anschluss; »Steig auf« erhält die Personifikation des Brunnens. Der Plural »Singt« gibt die hebräische Aufforderung an die Gemeinschaft wieder.
