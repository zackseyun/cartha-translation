source:
  edition: WLC
  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: de
  text: Doch Sihon gestattete Israel nicht, durch sein Gebiet[a] zu ziehen. Da versammelte Sihon sein ganzes Volk[b] und zog Israel in die Wüste entgegen. Er kam nach Jahaz[c] und kämpfte gegen Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch sein Grenzgebiet«.'
    reason: גְּבוּל kann sowohl das Gebiet als auch die Grenze beziehungsweise den Grenzbereich bezeichnen.
  - marker: b
    text: 'Wörtlich: »sein ganzes Volk«; der Text sagt nicht ausdrücklich »sein Heer«, auch wenn der Zusammenhang eine kampffähige Streitmacht voraussetzt.'
    reason: Die Fußnote schützt die konkrete Wortwahl des hebräischen Textes vor einer militärisch verdeutlichenden Paraphrase.
  - marker: c
    text: Der Ortsname wird in deutschen Bibelübersetzungen auch »Jahza« wiedergegeben.
    reason: Hinweis auf eine verbreitete alternative deutsche Wiedergabe des Ortsnamens.
lexical_decisions:
- source_word: נָתַן ... עֲבֹר
  choice: gestattete ... zu ziehen
  rationale: Die Verbindung bedeutet idiomatisch, jemandem den Durchzug zu erlauben. „Gestatten“ gibt den Erlaubnissinn präzise und in würdigem, heutigem Deutsch wieder.
- source_word: בִּגְבֻלוֹ
  choice: durch sein Gebiet
  rationale: גְּבוּל kann Grenze, Grenzbereich oder Gebiet bezeichnen. Hier geht es um den Durchzug durch Sihons Herrschaftsgebiet; „Gebiet“ vermeidet das missverständliche Bild eines Zuges entlang oder durch eine Grenzlinie.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: Da versammelte Sihon sein ganzes Volk
  rationale: Der hebräische Text nennt ausdrücklich „sein ganzes Volk“, nicht „sein Heer“. Der militärische Zusammenhang bleibt erkennbar, ohne ihn in den Wortlaut einzutragen.
- source_word: לִקְרַאת יִשְׂרָאֵל הַמִּדְבָּרָה
  choice: zog Israel in die Wüste entgegen
  rationale: לִקְרַאת bezeichnet die Bewegung auf eine Begegnung hin; die Richtungsendung an הַמִּדְבָּרָה gibt die Bewegung zur Wüste an. Die deutsche Formulierung bewahrt beides, ohne die Begegnung vorzeitig als Kampf zu bezeichnen.
- source_word: יָהְצָה
  choice: nach Jahaz
  rationale: Die Richtungsendung bezeichnet die Bewegung nach Jahaz. „Jahaz“ gibt den Ortsnamen nahe an der hebräischen Grundform יַהַץ wieder.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: kämpfte gegen Israel
  rationale: Das Verb לחם mit ב bezeichnet hier eine feindliche Auseinandersetzung. „Gegen Israel kämpfen“ ist im Deutschen eindeutig und natürlich.
- source_word: וְלֹא
  choice: Doch ... nicht
  rationale: Die Konjunktion steht im Gegensatz zu Israels vorausgehendem Ersuchen um Durchzug. „Doch“ bildet diesen Kontrast natürlich ab.
