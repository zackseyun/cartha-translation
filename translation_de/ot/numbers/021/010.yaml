  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנ֖וּ בְּ/אֹבֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: de
  text: Dann brachen die Israeliten auf und lagerten sich in Obot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: brachen … auf
  rationale: נסע bezeichnet in den Wegstationen der Wüstenwanderung das Aufbrechen von einem Lagerplatz; „aufbrechen“ gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ fungiert hier als Volksbezeichnung. „Die Israeliten“ vermittelt die korporative Bedeutung idiomatisch und ohne die im Deutschen mögliche Beschränkung auf männliche Personen.
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: חנה ist das übliche Verb für das Beziehen eines Lagerplatzes. „Lagerten“ ist knapp, verständlich und für einen Reisebericht angemessen.
- source_word: בְּאֹבֹת
  choice: bei Obot
  rationale: אֹבֹת ist ein Ortsname und wird nach der hebräischen Aussprache als „Obot“ transkribiert. Die Präposition בְּ bezeichnet hier den Ort des Lagers; „bei“ ist im Deutschen in solchen Wegangaben natürlich.
- source_word: וַ
  choice: Dann
  rationale: Das einleitende Waw führt die Erzählfolge weiter. „Dann“ macht die zeitliche Abfolge im Deutschen deutlich.
theological_decisions: []
translation_notes:
