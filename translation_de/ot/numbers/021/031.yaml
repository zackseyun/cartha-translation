lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: So wohnte
  rationale: ישׁב bedeutet je nach Zusammenhang „sitzen, wohnen, sich niederlassen“. In dieser erzählerischen Zusammenfassung gibt „wohnte“ den Aufenthalt beziehungsweise die Wohnsitznahme natürlich wieder, ohne die Dauerhaftigkeit von „siedelte sich an“ ausdrücklich festzulegen. Das וַ wird im Zusammenhang folgernd mit „So“ wiedergegeben.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Die gebräuchliche deutsche Form des Namens bezeichnet hier das Volk als Kollektiv.
- source_word: בְּאֶרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier das Gebiet beziehungsweise Land, in dem Israel wohnte. „Im Land“ ist idiomatisch und bewahrt die räumliche Aussage des Hebräischen.
- source_word: הָאֱמֹרִי
  choice: der Amoriter
  rationale: Die hebräische singularische Volksbezeichnung wird im Deutschen idiomatisch als kollektiver Plural „Amoriter“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, schlichtes und würdiges Standarddeutsch. Die knappe Satzstruktur des Hebräischen bleibt erhalten; „wohnte“ ist natürlicher als das gehobenere „weilte“ und weniger festlegend als „siedelte sich an“.
