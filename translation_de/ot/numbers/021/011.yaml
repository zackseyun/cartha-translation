  text: וַ/יִּסְע֖וּ מֵ/אֹבֹ֑ת וַֽ/יַּחֲנ֞וּ בְּ/עִיֵּ֣י הָֽעֲבָרִ֗ים בַּ/מִּדְבָּר֙ אֲשֶׁר֙ עַל פְּנֵ֣י מוֹאָ֔ב מִ/מִּזְרַ֖ח הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: de
  text: Sie brachen von Obot auf und schlugen ihr Lager bei Ije-Abarim[a] auf, in der Wüste gegenüber von Moab, östlich davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname Ije-Abarim kann seiner Wortbedeutung nach auch als »Trümmerstätten von Abarim« oder »Schutthügel von Abarim« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in den Reiseetappen häufig den Aufbruch vom bisherigen Lagerplatz; „aufbrechen“ gibt diesen konkreten Sinn natürlich wieder.
- source_word: מֵאֹבֹת
  choice: von Obot
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition als „Obot“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: schlugen ihr Lager … auf
  rationale: חנה bedeutet „lagern“; die gewählte Wendung ist im heutigen Deutsch anschaulich und idiomatisch.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: bei Ije-Abarim
  rationale: Die Verbindung fungiert im Reisebericht als Ortsname. Ihre durchsichtige Bedeutung wird in einer Fußnote bewahrt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet hier das unbesiedelte Wüsten- beziehungsweise Steppengebiet; „Wüste“ ist im Kontext natürlich und prägnant.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: östlich von Moab
  rationale: עַל־פְּנֵי bezeichnet eine Lage gegenüber beziehungsweise vor Moab; zusammen mit מִמִּזְרַח הַשָּׁמֶשׁ wird die geographische Angabe im Deutschen natürlich als östliche Lage ausgedrückt.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: dem Sonnenaufgang zu
  rationale: Die Formulierung bewahrt das hebräische Bild des Sonnenaufgangs und bezeichnet zugleich die östliche Richtung beziehungsweise Seite.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reiseroute wird knapp und anschaulich formuliert; das Bild des Sonnenaufgangs bleibt erhalten. Die räumliche Konstruktion wird idiomatisch wiedergegeben, ohne die semantische Durchsichtigkeit des Ortsnamens zu verlieren.
