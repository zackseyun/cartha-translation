  text: וַ/יִּפְנוּ֙ וַֽ/יַּעֲל֔וּ דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתָ֜/ם ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: de
  text: Dann wandten sie sich und zogen auf dem Weg nach Baschan hinauf. Og, der König von Baschan, zog ihnen mit seinem ganzen Volk entgegen, um bei Edrei gegen sie zu kämpfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: Dann wandten sie sich
  rationale: פנה bezeichnet hier im fortlaufenden Erzählzusammenhang einen Richtungswechsel. „Sich wenden“ ist knapp, natürlich und wahrt den Anschluss an die vorherige Handlung.
- source_word: וַיַּעֲלוּ
  choice: zogen … hinauf
  rationale: עלה hat eine räumliche beziehungsweise topografische Aufwärtsrichtung. „Hinaufziehen“ gibt diese Nuance in erzählendem Deutsch idiomatisch wieder.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: auf dem Weg nach Baschan
  rationale: דרך mit Ortsbezeichnung bezeichnet hier den Weg beziehungsweise die Route nach Baschan. Die deutsche Formulierung ist natürlicher als „auf dem Weg Baschans“ und vermeidet die missverständliche Aussage, Baschan sei bereits erreicht.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, der König von Baschan
  rationale: Der Personenname wird transliteriert; die Apposition wird im Deutschen zur Klarheit mit Artikel und Kommas wiedergegeben.
- source_word: וַיֵּצֵא
  choice: zog … entgegen
  rationale: יצא bedeutet wörtlich „hinausgehen/-ziehen“. Zusammen mit לִקְרָאתָם lässt es sich im militärischen Kontext natürlich als „ihnen entgegenziehen“ ausdrücken, ohne das Verb unnötig zu „ausmarschieren“ zu verstärken.
- source_word: לִקְרָאתָם
  choice: ihnen … entgegen
  rationale: Die Wendung bedeutet zunächst neutral „ihnen entgegen/zu ihrer Begegnung“. Die feindliche Absicht wird erst durch לַמִּלְחָמָה eindeutig und deshalb nicht vorzeitig in diese Wendung hineingelesen.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: mit seinem ganzen Volk
  rationale: עם heißt wörtlich „Volk“. „Heer“ oder „Truppen“ wäre im Kontext möglich, würde den Ausdruck aber militärisch stärker spezifizieren als der hebräische Text.
- source_word: לַמִּלְחָמָה
  choice: um … gegen sie zu kämpfen
  rationale: Die Präposition ל markiert hier Ziel oder Zweck. Die deutsche Infinitivkonstruktion gibt „zum Kampf“ klar und natürlich wieder und macht den Bezug zu den Israeliten sprachlich eindeutig.
- source_word: אֶדְרֶעִי
  choice: bei Edreï
  rationale: Der Ortsname steht ohne Präposition und bezeichnet knapp den Schauplatz. „Bei Edreï“ entspricht der üblichen deutschen Lokalisierung einer Schlacht und bewahrt den Ortsnamen als Transliteration.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Satzgliederung. Die Übersetzung bleibt nahe an der hebräischen Bewegungsfolge, formuliert jedoch idiomatisch deutsch. Die lexikalische Neutralität von לִקְרָאתָם bleibt erhalten; der folgende Kampfzweck macht die feindliche Begegnung ausdrücklich.
