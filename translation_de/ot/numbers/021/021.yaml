  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: de
  text: 'Dann sandte Israel Boten zu Sihon, dem König der Amoriter, und ließ ihm sagen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Dann sandte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Dann“ gibt diesen Fortgang im Deutschen natürlich wieder; „sandte“ entspricht der Grundbedeutung von שׁלח.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Volk Israel und wird in der üblichen deutschen Form wiedergegeben.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im diplomatischen Zusammenhang sind menschliche Übermittler gemeint, nicht himmlische Wesen. „Boten“ ist eine klare und nicht unnötig spezifizierende Wiedergabe.
- source_word: אֶל־סִיחֹן
  choice: zu Sihon
  rationale: אֶל bezeichnet hier die Zielrichtung; „zu“ ist in Verbindung mit dem Senden von Boten idiomatisches Deutsch.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: dem König der Amoriter
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Sihon als König des amoritischen Volkes. Die Apposition mit „dem“ ist im Deutschen natürlich und eindeutig.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Der Infinitiv leitet die im nächsten Vers folgende Botschaft ein. „Ließ ihm sagen“ drückt im Deutschen idiomatisch aus, dass die Boten Sihons Botschaft übermitteln sollten.
