  text: וְ/אֶ֨שֶׁד֙ הַ/נְּחָלִ֔ים אֲשֶׁ֥ר נָטָ֖ה לְ/שֶׁ֣בֶת עָ֑ר וְ/נִשְׁעַ֖ן לִ/גְב֥וּל מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/015.yaml
  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: de
  text: und der Abhang der Wadis[a], der sich zum Ort Ar[b] hin erstreckt und an die Grenze Moabs stößt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »der Täler« beziehungsweise »der Schluchten«; das hebräische Wort bezeichnet häufig zeitweise wasserführende Bach- oder Flusstäler (Wadis).
    reason: lexical_alternative
  - marker: b
    text: Oder »zum Wohnsitz/Sitz von Ar«. Die hebräische Wendung ist schwierig und kann sich auf die Lage oder die Siedlung Ar beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: Abhang
  rationale: Das Substantiv bezeichnet hier eine Abdachung bzw. einen Hang im Zusammenhang mit den Wasserläufen; »Abhang« ist topografisch präzise und natürlich.
- source_word: הַנְּחָלִים
  choice: der Wadis
  rationale: נְחָלִים bezeichnet häufig zeitweise wasserführende Bach- oder Flusstäler. »Wadis« bewahrt diesen geografischen Sinn; geläufigere Alternativen stehen in der Fußnote.
- source_word: אֲשֶׁר נָטָה
  choice: der sich … erstreckt
  rationale: נטה kann »sich ausstrecken«, »sich neigen« oder »sich hinziehen« bedeuten. Im topografischen Zusammenhang gibt »sich erstrecken« den räumlichen Verlauf klar wieder.
- source_word: לְשֶׁבֶת עָר
  choice: bis zum Ort Ars
  rationale: Die schwierige Wendung mit dem Infinitiv von ישב kann die Lage oder den Sitz Ars bezeichnen. »zum Ort Ars« ist idiomatisch und lässt die genaue topografische Beziehung offen.
- source_word: עָר
  choice: Ar
  rationale: Der Ortsname wird transliteriert; im deutschen Satz steht der reguläre Genitiv »Ars«.
- source_word: וְנִשְׁעַן
  choice: und … stößt
  rationale: שען bedeutet wörtlich »sich anlehnen« oder »aufliegen«. Bei einer geografischen Grenze vermittelt »an … stoßen« die räumliche Beziehung natürlich, ohne eine sachfremde Stützvorstellung einzutragen.
- source_word: לִגְבוּל מוֹאָב
  choice: an die Grenze Moabs
  rationale: גְּבוּל bezeichnet eine Grenze oder ein Grenzgebiet. »Grenze Moabs« ist hier die direkte und verständliche Wiedergabe.
theological_decisions: []
