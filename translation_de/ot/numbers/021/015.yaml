  register: Moderne, würdevolle Standardsprache. Der Satz bleibt als Fortsetzung des poetisch-topografischen Zitats syntaktisch angebunden. »Wadi« ist ein etablierter geografischer Fachausdruck und wird durch die Fußnote erläutert.
