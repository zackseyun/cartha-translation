  text: וּ/מִ/בָּמ֗וֹת הַ/גַּיְא֙ אֲשֶׁר֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַ/פִּסְגָּ֑ה וְ/נִשְׁקָ֖פָה עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: de
  text: und von Bamot in das Tal, das im Gebiet Moabs liegt, zum Gipfel des Pisga, der auf die Einöde[a] hinabblickt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Jeschimon“, wenn das hebräische Wort als Name der Region verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und sie blickt auf die Fläche der Einöde“. Die Formulierung bezeichnet den Ausblick vom Pisga über die Einöde.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: und von Bamot
  rationale: Die Konjunktion und die Präposition werden wiedergegeben. בָּמוֹת bezeichnet in diesem Reisebericht einen Ortsnamen; die im Deutschen übliche, quellennähere Umschrift lautet „Bamot“.
- source_word: הַגַּיְא
  choice: in das Tal
  rationale: גַּיְא kann ein Tal oder eine Schlucht bezeichnen. „Tal“ passt natürlich in die geografische Wegbeschreibung; das im Hebräischen elliptische Zielverhältnis wird durch „in das“ ausgedrückt.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: das im Gebiet Moabs liegt
  rationale: שָׂדֶה bedeutet wörtlich „Feld“, kann geografisch aber auch offenes Land oder ein Gebiet bezeichnen. „Gebiet Moabs“ ist im modernen Deutschen klar und bewahrt den räumlichen Sinn.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: zum Gipfel des Pisga
  rationale: רֹאשׁ heißt wörtlich „Kopf“, bezeichnet topografisch jedoch den Gipfel. פִּסְגָּה wird hier als Orts- beziehungsweise Bergname „Pisga“ wiedergegeben.
- source_word: וְנִשְׁקָפָה
  choice: der … hinabblickt
  rationale: Das Verb beschreibt eine erhöhte Stelle, von der aus man über ein tiefer gelegenes Gebiet blickt. Der deutsche Relativsatz verbindet die Aussage natürlich mit „Gipfel“, ohne die räumliche Perspektive abzuschwächen.
- source_word: עַל־פְּנֵי הַיְשִׁימֹן
  choice: auf die Einöde
  rationale: עַל־פְּנֵי bezeichnet hier die Fläche beziehungsweise das Gebiet, auf das sich der Blick richtet. יְשִׁימוֹן kann eine öde, unbewohnte Landschaft oder den Namen einer bestimmten Region bezeichnen; im Haupttext steht die beschreibende Bedeutung.
