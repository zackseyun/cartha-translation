  register: Moderne, würdevolle Standardsprache. Die knappe Reiseroutenform des Hebräischen bleibt erhalten; nur die für verständliches Deutsch nötigen Präpositionen und das Verb „liegt“ werden ergänzt. Ortsnamen werden in einer im Deutschen gut lesbaren, quellennahen Form wiedergegeben.
