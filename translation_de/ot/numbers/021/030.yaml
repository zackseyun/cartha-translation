source:
  edition: WLC
  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: de
  text: Wir schossen auf sie[a]; Heschbon ging zugrunde bis nach Dibon. Wir verwüsteten bis nach Nofach[b], das bis nach Medeba reicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut des ersten Satzteils ist schwierig. Möglich sind unter anderem auch: »Wir warfen sie nieder« oder »Ihre Herrschaft ging zugrunde«.'
    reason: textual_variant
  - marker: b
    text: Auch die mit »wir verwüsteten« wiedergegebene Form ist unsicher. Sie kann anders aufgefasst werden; im Zusammenhang dieses Siegesliedes liegt jedoch ein Verb der Verwüstung nahe.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: Wir schossen auf sie
  rationale: Die schwierige Form lässt sich als Verb des Schießens mit einem Suffix der 3. Person Plural verstehen. Diese Deutung bewahrt das anschauliche Kampfgeschehen des Siegesliedes; andere plausible Analysen werden in der Fußnote genannt.
- source_word: אָבַד
  choice: ging zugrunde
  rationale: Das Verb bezeichnet Untergang oder Vernichtung. Das deutsche Präteritum fügt sich natürlich in die poetische Rückschau ein.
- source_word: חֶשְׁבּוֹן
  choice: Heschbon
  rationale: Der Ortsname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: עַד דִּיבוֹן
  choice: bis nach Dibon
  rationale: עַד bezeichnet hier die räumliche Ausdehnung bis zu einem Ort.
- source_word: וַנַּשִּׁים
  choice: Wir verwüsteten alles
  rationale: Im Zusammenhang des Siegesliedes ist eine Verbform mit der Bedeutung »verwüsten« am plausibelsten. »Alles« macht die im Deutschen sonst unvollständige Konstruktion idiomatisch, ohne ein bestimmtes zusätzliches Objekt festzulegen.
- source_word: עַד נֹפַח
  choice: bis nach Nofach
  rationale: עַד kennzeichnet die geografische Erstreckung; der Ortsname wird deutsch transliteriert.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: das bis nach Medeba reicht
  rationale: Der Relativsatz wird auf Nofach bezogen und als weitere geografische Ausdehnung verstanden. Die knappe hebräische Form bleibt jedoch syntaktisch nicht völlig eindeutig.
- source_word: מֵידְבָא
  choice: Medeba
  rationale: Der Ortsname wird in der gebräuchlichen deutschen Form wiedergegeben.
