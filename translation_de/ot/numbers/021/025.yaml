source:
  edition: WLC
  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: de
  text: Israel nahm alle diese Städte ein und ließ sich in allen Städten der Amoriter nieder, in Heschbon und in allen seinen Tochterstädten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und in allen seinen Töchtern“; gemeint sind die kleineren, von Heschbon abhängigen Ortschaften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm … ein
  rationale: לקח bedeutet grundsätzlich „nehmen“; im militärischen Zusammenhang gibt die idiomatische Wendung „einnehmen“ die Eroberung natürlich und ohne unnötige Zusätze wieder.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: alle diese Städte
  rationale: Die demonstrative Bestimmung bleibt ausdrücklich erhalten; „Städte“ ist hier eine geläufige Wiedergabe von עָרִים.
- source_word: וַיֵּשֶׁב
  choice: ließ sich … nieder
  rationale: ישׁב kann „sitzen, wohnen, sich niederlassen“ bedeuten. Nach der Einnahme der Orte bezeichnet es hier passend deren Besiedlung.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: in allen Städten der Amoriter
  rationale: Die hebräische Genitivverbindung wird transparent wiedergegeben; der Singular als Kollektivbezeichnung wird im Deutschen natürlich mit „Amoriter“ ausgedrückt.
- source_word: בְּחֶשְׁבּוֹן
  choice: in Heschbon
  rationale: Der Ortsname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: und in allen seinen Tochterstädten
  rationale: Wörtlich stehen hier die „Töchter“ Heschbons, eine Metapher für die von der Hauptstadt abhängigen kleineren Orte. „Tochterstädte“ bewahrt das Bild und bleibt verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nahm … ein“ und „ließ sich … nieder“ sind im Deutschen idiomatisch und bilden zugleich die Abfolge von Eroberung und Besiedlung ab. Das Possessivpronomen „seinen“ bezieht sich grammatisch auf Heschbon.
