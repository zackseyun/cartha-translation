  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: de
  text: 'Und von dort zogen sie nach Beer[a]. Das ist der Brunnen, von dem[b] Jahwe zu Mose sagte: „Versammle das Volk, und ich will ihnen Wasser geben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer ist der Name des Ortes; der hebräische Ortsname bedeutet „Brunnen“.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „über den Jahwe zu Mose sagte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Und von dort
  rationale: Die Verbindung aus Konjunktion und Ortsangabe führt die Reiseroute fort; „Und“ bewahrt den erzählerischen Anschluss.
- source_word: בְּאֵרָה
  choice: zogen sie nach Beer
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf den Ort Beer zu. Das im Hebräischen elliptisch ausgesparte Bewegungsverb wird für natürliches Deutsch aus dem Reisebericht ergänzt.
- source_word: הִוא הַבְּאֵר
  choice: Das ist der Brunnen
  rationale: Die identifizierende Aussage erklärt die Bedeutung des zuvor genannten Ortes und bewahrt zugleich das Wortspiel zwischen dem Ortsnamen Beer und dem hebräischen Wort für „Brunnen“.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: von dem Jahwe zu Mose gesagt hatte
  rationale: Der Relativsatz verbindet den Brunnen mit der anschließenden göttlichen Aussage. Das Plusquamperfekt macht im Deutschen deutlich, dass die Aussage zuvor ergangen war, ohne den Inhalt näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen gebräuchlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱסֹף אֶת הָעָם
  choice: Versammle das Volk
  rationale: Der Imperativ fordert Mose auf, das Volk an einem Ort zusammenzubringen; „versammeln“ ist im Deutschen klar und kontextgerecht.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: und ich will ihnen Wasser geben
  rationale: Die Kohortativform drückt hier Gottes erklärten Willen beziehungsweise seine Zusage aus. „Ich will“ bewahrt diese Nuance, ohne sie ausschließlich als Zukunft oder Zweckangabe festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Seine Wiedergabe als „Jahwe“ bewahrt den persönlichen Namen; „der HERR“ wäre die traditionelle ersetzende Lesung.
- issue: Nuance des Kohortativs וְאֶתְּנָה
  choice: und ich will ihnen Wasser geben
  alternative: damit ich ihnen Wasser gebe
  rationale: Nach dem Imperativ kann der Kohortativ sowohl Absicht als auch entschlossenen Willen ausdrücken. Die gewählte Formulierung hält Gottes Zusage und Willensbekundung zusammen, ohne die Konstruktion ausschließlich final zu deuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das für den deutschen Lesefluss erforderliche Bewegungsverb wird ergänzt; Gottes direkte Rede bleibt knapp und feierlich.
