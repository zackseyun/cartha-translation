id: NUM.21.4
reference: Numbers 21:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: de
  text: Dann brachen sie vom Berg Hor auf und zogen auf dem Weg zum Roten Meer[a], um das Land Edom zu umgehen. Doch unterwegs wurde das Volk ungeduldig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Weg zum Schilfmeer“. Hebräisch: jam suf.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung kann auch bedeuten: „Das Volk wurde unterwegs mutlos“ oder „verlor den Mut“. Möglich ist zudem: „Das Volk wurde wegen des Weges ungeduldig.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: brachen sie … auf
  rationale: Das Verb נסע bezeichnet in den Wüstenetappen häufig das Aufbrechen von einem Lagerplatz und wird so natürlich und präzise wiedergegeben.
- source_word: מֵהֹר הָהָר
  choice: vom Berg Hor
  rationale: הֹר הָהָר ist der Ortsname; „Berg Hor“ entspricht der etablierten deutschen Namensform.
- source_word: דֶּרֶךְ יַם סוּף
  choice: auf dem Weg zum Roten Meer
  rationale: דֶּרֶךְ kann einen Weg beziehungsweise eine Route bezeichnen. Die Konstruktion lässt sich hier natürlich als Ziel- oder Richtungsangabe verstehen; die traditionelle Wiedergabe von יַם סוּף als „Rotes Meer“ steht im Haupttext, während „Schilfmeer“ als echte lexikalische Alternative in der Fußnote erhalten bleibt.
- source_word: לִסְבֹב
  choice: um … zu umgehen
  rationale: Der Infinitiv gibt den Zweck der Route an. „Umgehen“ drückt verständlich aus, dass sie um das Gebiet Edoms herumzogen.
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: das Land Edom
  rationale: אֶרֶץ mit einem Orts- oder Volksnamen bezeichnet das Land beziehungsweise Gebiet; „das Land Edom“ ist knapp und idiomatisch.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: wurde das Volk ungeduldig
  rationale: Die Wendung קצר נפש beschreibt ein inneres Kurzwerden unter Belastung und kann Ungeduld, Mutlosigkeit oder Verzagtheit ausdrücken. „Ungeduldig werden“ passt zum unmittelbaren Zusammenhang, ohne die Alternativen auszuschließen.
- source_word: בַּדָּרֶךְ
  choice: unterwegs
  rationale: 'Die Präposition בְּ wird unmittelbar lokativ verstanden: „auf dem Weg/unterwegs“. Eine kausale Nuance („wegen des Weges“) bleibt grammatisch möglich und wird in der Fußnote kenntlich gemacht.'
theological_decisions: []
