source:
  edition: WLC
  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: de
  text: 'Da legte Israel dem HERRN ein Gelübde ab und sagte: »Wenn du mir dieses Volk wirklich[a] in die Hand gibst, werde ich ihre Städte der Vernichtung weihen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich verstärkend: »Wenn du dieses Volk ganz gewiss in meine Hand gibst.« Im Hebräischen wird das Verb durch einen vorangestellten Infinitiv nachdrücklich hervorgehoben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werde ich ihre Städte mit dem Bann belegen«. Das hebräische Verb bezeichnet das unwiderrufliche Übergeben von etwas an den Bann (ḥerem) und damit hier an die Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יִשְׂרָאֵל נֶדֶר
  choice: Da legte Israel … ein Gelübde ab
  rationale: Die hebräische figura etymologica, wörtlich etwa »Israel gelobte ein Gelübde«, bezeichnet einen feierlichen Schwur. »Ein Gelübde ablegen« gibt den formellen Akt in natürlichem, würdigem Deutsch wieder.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname יהוה wird nach der im Deutschen etablierten Bibelkonvention mit »HERR« in Kapitälchenschreibung wiedergegeben.
- source_word: אִם נָתֹן תִּתֵּן
  choice: Wenn du … wirklich … gibst
  rationale: Der Infinitivus absolutus vor dem finiten Verb verstärkt die Aussage. »Wirklich« bewahrt diese Hervorhebung, ohne die hebräische Konstruktion unnatürlich nachzubilden.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: עַם ist hier ein singularisches Kollektiv; »dieses Volk« entspricht Form und Sinn des Hebräischen.
- source_word: בְּיָדִי
  choice: mir … in die Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in Israels Gewalt. Das Bild »in die Hand geben« ist auch im modernen Deutschen verständlich und bewahrt die Bildsprache.
- source_word: וְהַחֲרַמְתִּי
  choice: werde ich … der Vernichtung weihen
  rationale: Das Hifil von חרם bezeichnet hier das unwiderrufliche Weihen zum ḥerem, das in diesem Kriegskontext die Vernichtung einschließt. Die Formulierung erhält sowohl die kultische als auch die zerstörerische Dimension.
- source_word: עָרֵיהֶם
  choice: ihre Städte
  rationale: עִיר bedeutet im vorliegenden militärischen Zusammenhang unmittelbar »Stadt«; der Plural wird entsprechend wiedergegeben.
theological_decisions:
- issue: Wiedergabe der חרם-Terminologie in einem KriegsGelübde
  choice: ihre Städte der Vernichtung weihen
  alternative: ihre Städte völlig vernichten; ihre Städte mit dem Bann belegen
  rationale: Die Aussage beschreibt nicht nur militärische Zerstörung, sondern eine formelle, unwiderrufliche Bestimmung zum ḥerem. »Der Vernichtung weihen« bewahrt diese kultisch-militärische Spannung, ohne sie ethisch oder dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, klingt aber natürlich. Israels kollektive Rede wird wie im Ausgangstext mit der ersten Person Singular (»mir«, »ich«) bewahrt.
