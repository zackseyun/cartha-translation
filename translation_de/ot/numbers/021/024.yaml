source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: de
  text: Israel schlug ihn mit der Schneide des Schwertes und nahm sein Land in Besitz, vom Arnon bis zum Jabbok, bis zu den Ammonitern[a]; denn die Grenze der Ammoniter war stark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: bis zu den Söhnen Ammons; ebenso im folgenden Satz.'
    reason: lexikalische Alternative und Transparenz der hebräischen Volksbezeichnung
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: schlug ihn
  rationale: נכה bezeichnet zunächst das Schlagen oder Niederschlagen. „Schlug ihn“ bewahrt die direkte Aussage, ohne ausdrücklich zu behaupten, dass der König persönlich getötet wurde.
- source_word: לְפִי חָרֶב
  choice: mit der Schneide des Schwertes
  rationale: Die hebräische Wendung lautet bildhaft „mit dem Mund des Schwertes“. „Mit der Schneide des Schwertes“ gibt dieses Bild im Deutschen verständlich und würdig wieder.
- source_word: וַיִּירַשׁ
  choice: nahm … in Besitz
  rationale: ירש bezeichnet hier die gewaltsame Besitznahme eines Gebietes. Die Wiedergabe vermeidet die im militärischen Zusammenhang missverständliche Bedeutung „erbte“.
- source_word: אַרְצוֹ
  choice: sein Land
  rationale: „Land“ entspricht אֶרֶץ unmittelbar und passt zum territorialen Zusammenhang.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: vom Arnon bis zum Jabbok
  rationale: Das Präpositionspaar bezeichnet die räumliche Ausdehnung; die Flussnamen stehen im natürlichen deutschen Sprachgebrauch mit Artikel.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: bis zu den Ammonitern
  rationale: Die wörtliche Wendung „bis zu den Söhnen Ammons“ hat hier ethnische Bedeutung. „Ammoniter“ ist im modernen Deutschen eindeutig und natürlich; die hebräische Ausdrucksweise wird in der Fußnote dokumentiert.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung dafür ein, weshalb Israels Gebietseroberung an dieser Stelle endete.
- source_word: עַז
  choice: stark
  rationale: עַז bezeichnet Stärke oder Macht. „Stark“ wahrt die lexikalische Breite und legt nicht fest, ob die Grenze durch Befestigungen, natürliche Gegebenheiten oder militärische Macht gesichert war.
- source_word: גְּבוּל
  choice: Grenze
  rationale: „Grenze“ ist die direkte und im territorialen Zusammenhang natürliche Entsprechung von גְּבוּל.
theological_decisions:
- issue: Wiedergabe von בְּנֵי עַמּוֹן
  choice: die Ammoniter
  alternative: die Söhne Ammons
  rationale: Die hebräische männliche Verwandtschaftsbezeichnung bezeichnet hier das gesamte Volk. Die idiomatische Volksbezeichnung ist im deutschen Haupttext klarer, während die Fußnote die Form des Ausgangstextes sichtbar hält.
- issue: Bedeutung der starken Grenze
  choice: die Grenze … war stark
  alternative: die Grenze … war befestigt
  rationale: Der Ausgangstext nennt die Grenze „stark“, erklärt aber nicht, worin ihre Stärke bestand. Die Übersetzung bewahrt diese Offenheit, statt ausdrücklich Befestigungsanlagen vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem erzählerischen Ablauf des Hebräischen, bleibt aber idiomatisch. Die ungewöhnliche Aussage von der „starken“ Grenze wurde bewusst nicht zu „befestigt“ präzisiert.
