id: NUM.21.1
reference: Numbers 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: de
  text: Als der kanaanitische König von Arad, der im Negev wohnte, hörte, dass Israel auf dem Weg von Atarim[a] kam, kämpfte er gegen Israel und nahm einige von ihnen gefangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „auf dem Weg von Atarim“. Die Bedeutung von „Atarim“ ist unsicher. Manche verstehen es als Ortsnamen, andere – unter dem Einfluss alter Übersetzungen – als „die Kundschafter“ oder „die Späher“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: שׁמע bezeichnet hier im Erzählzusammenhang das Erhalten einer Nachricht; „hörte“ bewahrt die Abfolge von Nachricht und Reaktion.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: der kanaanitische König von Arad
  rationale: Die ethnische Bezeichnung und der Herrschertitel werden in natürlichem Deutsch zu einer eindeutigen Nominalgruppe verbunden, ohne den hebräischen Bezug zu verändern.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: der im Negev wohnte
  rationale: Das Partizip bezeichnet den Wohnsitz. „Negev“ bleibt als geografischer Name erhalten, statt zu „Süden“ verallgemeinert zu werden.
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: dass Israel … kam
  rationale: כִּי leitet den Inhalt des Gehörten ein; בָּא beschreibt Israels Herannahen auf der genannten Route.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: auf dem Weg von Atarim
  rationale: דֶּרֶךְ bedeutet Weg oder Route. Das unsichere אֲתָרִים wird konservativ wie ein Eigenname wiedergegeben; die andere Deutungsmöglichkeit steht in der Fußnote.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: kämpfte er gegen Israel
  rationale: Die Form bezeichnet eine feindliche kriegerische Auseinandersetzung; „kämpfte gegen“ bleibt hinsichtlich ihres Umfangs zurückhaltend.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: nahm einige von ihnen gefangen
  rationale: שׁבה mit שֶׁבִי bezeichnet das Gefangennehmen im Krieg. Das Suffix bezieht sich im Kontext auf das kollektiv verstandene Israel; die deutsche Formulierung gibt den partitivischen Sinn idiomatisch wieder.
