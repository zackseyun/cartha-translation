source:
  edition: WLC
  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: de
  text: 'Da kam das Volk zu Mose und sagte: „Wir haben gesündigt, denn wir haben gegen Jahwe und gegen dich geredet. Bete zu Jahwe, dass er die Schlange[a] von uns wegnimmt.“ Da betete Mose für das Volk.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort steht im Singular; es kann hier die Schlangenplage kollektiv bezeichnen.
    reason: Bewahrt die grammatische Einzahl und weist zugleich auf die im Zusammenhang mögliche kollektive Bedeutung hin.
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: Da kam das Volk
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da“ gibt die zeitliche Folge im Deutschen natürlich wieder; der Singular entspricht dem hebräischen Kollektivsubstantiv „Volk“.
- source_word: חָטָאנוּ
  choice: Wir haben gesündigt
  rationale: Das Perfekt bezeichnet eine vollzogene Tat mit gegenwärtiger Bedeutung im Schuldbekenntnis; das deutsche Perfekt ist hier natürlich.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: wir haben gegen Jahwe und gegen dich geredet
  rationale: דבר mit ב bezeichnet hier feindseliges oder auflehnendes Reden. Die Wiederholung von „gegen“ bewahrt die Parallelität beider Bezugsgrößen.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: Bete zu Jahwe
  rationale: Der Hitpael von פלל bedeutet „beten“ und kann Fürbitte einschließen; der folgende Satz macht den fürbittenden Charakter deutlich.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: dass er … von uns wegnimmt
  rationale: Nach der Aufforderung zum Gebet gibt die Verbform den Inhalt beziehungsweise das Ziel der Bitte an. „Von uns wegnehmen“ ist idiomatisch und erhält den Gedanken der Beseitigung der Plage.
- source_word: אֶת הַנָּחָשׁ
  choice: die Schlange
  rationale: נָחָשׁ steht im Hebräischen im Singular. „Schlange“ ist im modernen Deutschen konkret und verständlich; eine mögliche kollektive Bedeutung wird in der Fußnote offengehalten.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: Da betete Mose für das Volk
  rationale: בְּעַד bezeichnet das Eintreten zugunsten anderer. „Für das Volk beten“ ist natürlich und gibt den Fürbittecharakter klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen im Deutschen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Fürbitte des Mose
  choice: Mose betete für das Volk
  alternative: Mose trat für das Volk ein
  rationale: Die Formulierung bewahrt die ausdrückliche Gebetssprache des Verbs und gibt durch „für“ zugleich die in בְּעַד enthaltene Fürbitte wieder.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze, direkte Sätze bewahren die Dringlichkeit des Bekenntnisses und der Bitte; „Jahwe“ wird als Gottesname verwendet.
