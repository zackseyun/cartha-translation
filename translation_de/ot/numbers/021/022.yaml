  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֗/ךָ לֹ֤א נִטֶּה֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּ/דֶ֤רֶךְ הַ/מֶּ֨לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבֻלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: de
  text: Lass mich durch dein Land ziehen. Wir werden weder auf ein Feld noch in einen Weinberg abbiegen und kein Wasser aus einem Brunnen trinken. Wir werden auf der Königsstraße[a] ziehen, bis wir deine Grenze passiert haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „auf der Straße des Königs“.'
    reason: Lexikalische Alternative für בְּדֶרֶךְ הַמֶּלֶךְ; „Königsstraße“ ist die idiomatische deutsche Bezeichnung, während die Genitivverbindung die hebräische Form näher abbildet.
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Lass mich … ziehen
  rationale: Der Kohortativ der 1. Person Singular formuliert hier im diplomatischen Zusammenhang eine Bitte; die deutsche Wendung gibt diese knapp und natürlich wieder.
- source_word: בְאַרְצְךָ
  choice: durch dein Land
  rationale: אֶרֶץ bezeichnet hier das politisch-geografische Land des angeredeten Königs.
- source_word: לֹא נִטֶּה
  choice: wir werden … nicht abbiegen
  rationale: נטה bezeichnet im Reisekontext das Abweichen von der vorgesehenen Route.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: weder auf ein Feld noch in einen Weinberg
  rationale: Die generisch gebrauchten Singularformen bezeichnen landwirtschaftlich genutzte Flächen; die unterschiedlichen deutschen Präpositionen entsprechen dem natürlichen Sprachgebrauch.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: kein Wasser aus einem Brunnen trinken
  rationale: Die Konstruktverbindung bedeutet wörtlich „Wasser eines Brunnens“ und besagt, dass keine örtlichen Wasservorräte beansprucht werden.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: auf der Straße des Königs
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Formulierung und bezeichnet die königliche beziehungsweise öffentliche Hauptstraße, ohne den Ausdruck stärker historisch festzulegen als der Ausgangstext.
- source_word: נֵלֵךְ
  choice: wir werden … ziehen
  rationale: הלך ist das gewöhnliche Verb für gehen oder reisen; „ziehen“ passt natürlich zur Bewegung einer größeren Gruppe.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבֻלֶךָ
  choice: bis wir dein Gebiet durchquert haben
  rationale: גְּבוּל kann Grenze oder abgegrenztes Gebiet bedeuten. Im Zusammenhang bezeichnet die Wendung den vollständigen Durchzug durch das Herrschaftsgebiet.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Wechsel vom Singular in der Bitte („Lass mich“) zum Plural bei den Zusagen („wir“) bleibt wie im Hebräischen erhalten.
