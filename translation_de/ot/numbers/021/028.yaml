source:
  edition: WLC
  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: de
  text: 'Denn Feuer ging von Heschbon aus,

    eine Flamme aus der Stadt Sihons;

    sie verzehrte Ar in Moab,

    die Herren[b] der Höhen am Arnon[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Höhenheiligtümer am Arnon“. Das hebräische Wort kann geografische Höhen oder kultische Höhenstätten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Besitzer“ beziehungsweise sinngemäß „die Bewohner“. Das Hebräische bezeichnet wörtlich die Herren oder Besitzer; das Verhältnis dieser Wortgruppe zu „Ar in Moab“ bleibt in der knappen poetischen Form mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorangehenden Liedzeile ein und bewahrt deren kausalen Zusammenhang.
- source_word: אֵשׁ יָצְאָה
  choice: Feuer ging … aus
  rationale: Gibt das konkrete poetische Bild eines Feuers wieder, das von einem Ort ausgeht; das deutsche Präteritum passt zur erzählenden Liedsprache.
- source_word: מֵחֶשְׁבּוֹן
  choice: von Heschbon
  rationale: Der Ortsname wird in einer im Deutschen geläufigen Umschrift wiedergegeben.
- source_word: לֶהָבָה
  choice: eine Flamme
  rationale: Bewahrt den konkreten Parallelbegriff zu „Feuer“ und die poetische Bildlichkeit.
- source_word: מִקִּרְיַת סִיחֹן
  choice: aus der Stadt Sihons
  rationale: קִרְיָה ist hier das gewöhnliche Wort für „Stadt“; die Genitivfügung bezeichnet sie als Sihons Stadt.
- source_word: אָכְלָה
  choice: sie verzehrte
  rationale: Das Verb bezeichnet bildhaft das Fressen beziehungsweise Verzehren durch Feuer. Das Pronomen kann sich im Deutschen unmittelbar auf „Flamme“ beziehen.
- source_word: עָר מוֹאָב
  choice: Ar in Moab
  rationale: עָר wird als der bekannte Ortsname Ar verstanden; „in Moab“ identifiziert seine regionale Zugehörigkeit natürlich und klar.
- source_word: בַּעֲלֵי
  choice: die Herren
  rationale: Bewahrt die direkte Bedeutung „Herren/Besitzer“, ohne sie stillschweigend als „Bewohner“ auszulegen.
- source_word: בָּמוֹת
  choice: der Höhen
  rationale: Im geografisch-poetischen Zusammenhang ist „Höhen“ natürlich; die ebenfalls mögliche kultische Bedeutung „Höhenheiligtümer“ wird in der Fußnote offengehalten.
- source_word: אַרְנֹן
  choice: am Arnon
  rationale: Bezeichnet die Höhen im Gebiet des Flusses beziehungsweise Wadis Arnon in idiomatischem Deutsch.
theological_decisions:
- issue: Bezug und Bedeutung von בַּעֲלֵי בָּמוֹת אַרְנֹן
  choice: „die Herren der Höhen am Arnon“ als eigene, unverbundene Objekt- oder Appositionsgruppe
  alternative: „die Bewohner der Höhen am Arnon“ beziehungsweise eine engere Apposition zu Ar
  rationale: Der hebräische Ausdruck ist knapp und enthält vor בַּעֲלֵי kein verbindendes „und“. Die Übersetzung bewahrt deshalb seine formale Spannung und erläutert die semantische Alternative in einer Fußnote, statt die Syntax eindeutig festzulegen.
translation_notes:
  register: Moderne, würdige deutsche Liedsprache mit kurzen parallelen Zeilen. Die Ortsnamen folgen geläufigen deutschen Bibelformen. Die ungewöhnlich knappe Reihung im letzten Halbvers wird nicht durch ein im Hebräischen fehlendes „und“ geglättet.
