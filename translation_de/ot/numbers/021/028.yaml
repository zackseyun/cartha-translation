  terminology: Heschbon, Sihon, Ar, Moab und Arnon sind in geläufigen deutschen Bibelformen wiedergegeben. „Herren“ bildet בַּעֲלֵי direkt ab; „Höhen“ ist für בָּמוֹת im geographisch-poetischen Zusammenhang vertretbar. Die Fußnoten halten die mögliche kultische Bedeutung von בָּמוֹת sowie die breitere Bedeutungs- und Bezugsfrage bei בַּעֲלֵי offen. Die Anker stehen an den jeweils erläuterten Ausdrücken.
