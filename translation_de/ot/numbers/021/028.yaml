  verdict: approve
  source_fidelity: Der Text gibt die kausal-erläuternde Partikel כִּי mit „Denn“ angemessen wieder und bewahrt die poetischen Parallelzeilen. „Feuer ging von Heschbon aus“ und „eine Flamme aus der Stadt Sihons“ entsprechen dem hebräischen Bild und der Syntax. „Sie verzehrte Ar in Moab“ gibt אָכְלָה und den Ortsnamen עָר מוֹאָב sachgerecht wieder. Die knappe nachgestellte Gruppe „die Herren der Höhen am Arnon“ erhält die im Hebräischen nicht ausdrücklich aufgelöste Zuordnung von בַּעֲלֵי בָּמוֹת אַרְנֹן.
