  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: de
  text: Dann schickte Mose Kundschafter aus, um Jaser auszukundschaften. Sie nahmen die dazugehörigen Ortschaften[a] ein, und die Amoriter, die dort waren, wurden vertrieben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Töchter“; eine hebräische Bezeichnung für die von einer Stadt abhängigen Siedlungen oder Ortschaften.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht hier ein Verb in der 3. Person Singular; wer damit gemeint ist, wird nicht ausdrücklich genannt.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte … aus
  rationale: Die erzählende Verbform von שׁלח bezeichnet das Aussenden; die trennbare deutsche Wendung klingt natürlich und bewahrt den Handlungsablauf.
- source_word: לְרַגֵּל
  choice: um … auszukundschaften
  rationale: Das Piel von רגל bezeichnet hier militärische Erkundung. „Auskundschaften“ gibt diesen Sinn im Deutschen klar wieder.
- source_word: יַעְזֵר
  choice: Jaser
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Ortsnamens.
- source_word: וַיִּלְכְּדוּ
  choice: sie nahmen … ein
  rationale: לכד bezeichnet im militärischen Zusammenhang das Erobern beziehungsweise Einnehmen eines Ortes.
- source_word: בְּנֹתֶיהָ
  choice: die dazugehörigen Ortschaften
  rationale: Wörtlich steht „ihre Töchter“. Als geografische Wendung bezeichnet dies die von einer Stadt abhängigen Siedlungen; „dazugehörige Ortschaften“ vermittelt diesen Sinn ohne eine unbelegte Größenbestimmung.
- source_word: וַיֹּרֶשׁ / ויירש
  choice: Mose vertrieb
  rationale: Die hebräische Einzahl setzt gegenüber dem vorhergehenden Plural einen singularischen Handlungsträger voraus; im Zusammenhang ist Mose der naheliegende Bezug. „Vertrieb“ gibt den Beseitigungsaspekt von ירש im Eroberungskontext wieder.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Der kollektive ethnische Singular wird im natürlichen Deutschen als Plural des Volksnamens wiedergegeben.
- source_word: אֲשֶׁר שָׁם
  choice: die dort lebten
  rationale: Die Wendung bezeichnet die an diesem Ort anwesende amoritische Bevölkerung; „lebten“ ist im Deutschen idiomatischer als das bloße „waren“.
theological_decisions:
- issue: Wechsel vom pluralischen וַיִּלְכְּדוּ zum singularischen ויירש
  choice: 'Der Subjektwechsel wird sichtbar gemacht: „Sie nahmen … ein, und Mose vertrieb …“'
  alternative: 'Beide Handlungen pluralisch wiederzugeben: „Sie nahmen … ein und vertrieben …“'
  rationale: Der masoretische Ausgangstext bietet beim zweiten Verb eine singularische Form. Die deutsche Fassung bewahrt diesen grammatischen Wechsel, auch wenn Mose dabei als Leiter beziehungsweise Repräsentant der handelnden Israeliten verstanden werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Ortschaften“ vermeidet die zu enge Festlegung auf Dörfer oder Städte; die wörtliche hebräische Bildsprache wird in der Fußnote dokumentiert.
