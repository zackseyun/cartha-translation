  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: de
  text: Da machte Mose eine Schlange aus Bronze[a] und brachte sie auf einer Stange[b] an. Wenn nun die Schlange einen Mann[c] biss und er die bronzene Schlange ansah[d], blieb er am Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kupfer“. Der hebräische Metallbegriff kann Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch ein Feldzeichen oder Banner bezeichnen. In diesem Zusammenhang kann es den aufgerichteten Träger eines solchen Zeichens bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „einen Mann“; hier steht die Form stellvertretend für jeden Menschen, der gebissen wurde.'
    reason: lexical_alternative
  - marker: d
    text: Dieses Geschehen wird in Johannes 3,14–15 typologisch aufgegriffen.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: Schlange
  rationale: „Schlange“ ist die natürliche und genaue deutsche Wiedergabe; das Deutsche benötigt hier keine gehobene Sonderbezeichnung, um zwischen dem Tier und seinem angefertigten Abbild zu unterscheiden.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Der hebräische Metallbegriff kann Kupfer oder Bronze bezeichnen. „Bronze“ entspricht der verbreiteten Deutung in diesem Zusammenhang; die mögliche Alternative wird in einer Fußnote erhalten.
- source_word: הַנֵּס
  choice: die Stange
  rationale: Im Zusammenhang bezeichnet das Wort den aufgerichteten Gegenstand, an dem Mose die Schlange anbrachte. „Stange“ ist konkreter und natürlicher als „Feldzeichen“ oder „Banner“, ohne die lexikalischen Alternativen zu verschweigen.
- source_word: וַיְשִׂמֵהוּ עַל
  choice: befestigte sie an
  rationale: Wörtlich steht „setzte/legte sie auf“. Da die Schlange sichtbar an einer aufgerichteten Stange angebracht wurde, gibt „befestigte sie an“ die räumliche Handlung im Deutschen klar und idiomatisch wieder.
- source_word: וְהָיָה אִם
  choice: Wenn nun
  rationale: Die Konstruktion leitet einen wiederholt möglichen Fall mit seinem Ergebnis ein. „Wenn nun“ bildet diesen Zusammenhang im Deutschen natürlicher ab als das formelhafte „Und es geschah, wenn“.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: wenn die Schlange einen Mann biss
  rationale: Die bestimmte Einzahl „die Schlange“ und das maskuline אִישׁ werden formal bewahrt. Im Zusammenhang steht „einen Mann“ stellvertretend für jeden Gebissenen; dies wird erläutert.
- source_word: וְהִבִּיט אֶל
  choice: und er … ansah
  rationale: „Ansehen“ gibt die konkrete Blickhandlung wieder, ohne durch „aufblicken zu“ oder „vertrauen auf“ eine spätere theologische Deutung in den hebräischen Ausgangstext einzutragen.
- source_word: וָחָי
  choice: blieb er am Leben
  rationale: Die Form bezeichnet das Eintreten beziehungsweise Fortbestehen des Lebens als Folge des Hinsehens. „Blieb am Leben“ ist im Deutschen natürlicher und im Kontext genauer als das isolierte „lebte er“.
theological_decisions:
- issue: Repräsentative maskuline Ausdrucksweise bei אִישׁ
  choice: einen Mann
  alternative: jemanden; einen Menschen
  rationale: Die maskuline Einzahl des Ausgangstextes bleibt sichtbar. Ihre repräsentative Bedeutung für jeden gebissenen Menschen wird in einer Fußnote erklärt, ohne die grammatische Form stillschweigend zu verallgemeinern.
- issue: Mögliche typologische Überdeutung von וְהִבִּיט אֶל
  choice: ansah
  alternative: zu ihr aufblickte; auf sie schaute
  rationale: Johannes 3,14–15 greift das Geschehen später typologisch auf. Der Haupttext von Numeri sollte diese spätere kanonische Verbindung jedoch nicht bereits durch eine theologisch aufgeladene Formulierung vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die bedingte hebräische Konstruktion wird idiomatisch als „Wenn nun …, blieb er am Leben“ wiedergegeben. Lexikalische Mehrdeutigkeiten und die spätere typologische Aufnahme werden in Fußnoten bewahrt, nicht in den Haupttext eingetragen.
