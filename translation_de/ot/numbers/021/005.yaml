  text: וַ/יְדַבֵּ֣ר הָ/עָ֗ם בֵּֽ/אלֹהִים֮ וּ/בְ/מֹשֶׁה֒ לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לָ/מ֖וּת בַּ/מִּדְבָּ֑ר כִּ֣י אֵ֥ין לֶ֨חֶם֙ וְ/אֵ֣ין מַ֔יִם וְ/נַפְשֵׁ֣/נוּ קָ֔צָה בַּ/לֶּ֖חֶם הַ/קְּלֹקֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: de
  text: 'Und das Volk redete gegen Gott und gegen Mose: »Warum habt ihr uns aus Ägypten heraufgeführt, damit wir in der Wüste sterben? Denn es gibt weder Brot noch Wasser, und uns ekelt vor diesem elenden Brot.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesem verächtlichen Brot“ beziehungsweise „diesem wertlosen Brot“. Das hebräische Adjektiv ist selten und bringt die Geringschätzung der von Gott gegebenen Nahrung zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: Und das Volk redete gegen Gott und gegen Mose
  rationale: דבר mit ב wird wegen des anklagenden Inhalts adversativ verstanden. „Redete gegen“ bewahrt den Sprachcharakter, ohne die Aussage zu „lästerte“ oder „beschwerte sich“ zu verschärfen.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: habt ihr uns aus Ägypten heraufgeführt
  rationale: Der Hifil von עלה bedeutet „heraufführen“. Der Plural des Verbs wird beibehalten; die Anrede richtet sich im Zusammenhang gegen Gott und Mose.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: damit wir in der Wüste sterben
  rationale: Der Infinitiv kann Zweck oder als unterstellten Zweck dargestellte Folge ausdrücken. „Damit“ gibt den Vorwurf der Sprecher natürlich wieder.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: Denn es gibt weder Brot noch Wasser
  rationale: Die Wiederholung von אֵין wird im Deutschen idiomatisch durch „weder … noch“ wiedergegeben. „Brot“ erhält die lexikalische Verbindung zum folgenden לֶחֶם.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: und uns ekelt
  rationale: Die wörtliche Wendung mit נֶפֶשׁ bezeichnet starke Abneigung oder Überdruss. „Uns ekelt vor“ ist im Deutschen natürlich und bewahrt die intensive Abscheu.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: vor diesem elenden Brot
  rationale: Das seltene Adjektiv קְלֹקֵל drückt verächtliche Geringschätzung aus. „Elend“ ist verständlich und lässt die genaue Nuance bewusst offen; „diesem“ macht den situationsbezogenen bestimmten Artikel idiomatisch deutlich.
theological_decisions:
- issue: Charakter der Rede gegen Gott und Mose
  choice: „redete gegen Gott und gegen Mose“ als feindselige, anklagende Rede
  alternative: „redete zu/über Gott und Mose“
  rationale: Der Inhalt des Zitats ist eindeutig anklagend. Die adversative Wiedergabe folgt dem Kontext, ohne eine zusätzliche theologische Bewertung einzutragen.
- issue: Adressatenzahl in „habt ihr uns … heraufgeführt“
  choice: Pluralform beibehalten
  alternative: Singularform mit ausschließlichem Bezug auf Mose
  rationale: Die masoretische Verbform הֶעֱלִיתֻנוּ ist zweite Person maskulin Plural. Die Übersetzung bewahrt diese grammatische Spannung, statt sie stillschweigend auf einen einzelnen Adressaten zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt direkt und scharf. „Wüste“ ist allgemein verständlich und entspricht dem biblischen Motiv; „Brot“ wird in beiden Satzteilen wiederholt, um die auffällige Spannung der Klage zu erhalten.
