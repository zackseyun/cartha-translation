  text: וּ/מִ/מַּתָּנָ֖ה נַחֲלִיאֵ֑ל וּ/מִ/נַּחֲלִיאֵ֖ל בָּמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: de
  text: Und von Mattana nach Nahaliel und von Nahaliel nach Bamot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort Bamot kann auch „Höhen“ oder „Höhenheiligtümer“ bedeuten; hier ist es jedoch am besten als Name eines Ortes auf Israels Reiseroute zu verstehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: Und von Mattana
  rationale: Das Präfix וּ wird mit „und“, die Präposition מִן mit „von“ wiedergegeben. מַתָּנָה bezeichnet hier eine Reisestation und wird als Ortsname „Mattana“ transkribiert.
- source_word: נַחֲלִיאֵל
  choice: nach Nahaliel
  rationale: Vor dem Ortsnamen steht im Hebräischen keine Präposition; der knappe Stil der Reiseroute setzt jedoch die Bewegung zur nächsten Station voraus. Natürliches Deutsch macht dies mit „nach“ deutlich.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: und von Nahaliel
  rationale: וּ und מִן werden als „und von“ wiedergegeben; der Ortsname wird bei seiner Wiederholung einheitlich transkribiert.
- source_word: בָּמוֹת
  choice: Bamot
  rationale: Im Zusammenhang dieser Reiseroute ist בָּמוֹת am besten als Ortsname zu verstehen und wird daher transkribiert. Die mögliche lexikalische Bedeutung „Höhen“ beziehungsweise „Höhenheiligtümer“ bleibt in einer Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Reisebericht in modernem Standarddeutsch. Die im Hebräischen elliptisch ausgedrückte Bewegung wird idiomatisch mit „nach“ ergänzt; die Ortsnamen folgen einer geläufigen deutschen Transkription.
