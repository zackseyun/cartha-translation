source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: de
  text: So schlugen sie ihn, seine Söhne und sein ganzes Volk, bis ihm kein Überlebender mehr blieb; und sie nahmen sein Land in Besitz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ אֹתוֹ
  choice: schlugen sie ihn
  rationale: נכה bezeichnet im militärischen Zusammenhang schlagen beziehungsweise vernichtend besiegen. „Schlugen“ bewahrt die konkrete Ausdrucksweise des Hebräischen; dass die Gewalt tödlich war, ergibt sich aus dem folgenden Satzteil.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der maskuline Plural בנים bezeichnet hier die Söhne Ogs und wird geschlechtsgenau wiedergegeben.
- source_word: כָּל עַמּוֹ
  choice: sein ganzes Volk
  rationale: עַם bedeutet grundsätzlich „Volk“ und ist breiter als „Heer“; der Ausdruck umfasst hier alle Menschen unter Ogs Herrschaft, die von der Vernichtung betroffen waren.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: bis ihm kein Überlebender mehr blieb
  rationale: Die idiomatische deutsche Fassung gibt die vollständige Vernichtung wieder und lässt die im Hebräischen nicht ausdrücklich bezeichnete handelnde Person unbestimmt.
- source_word: שָׂרִיד
  choice: Überlebender
  rationale: Im unmittelbaren Kriegskontext ist „Überlebender“ klarer als „Rest“ und vermeidet zusätzliche theologische Konnotationen.
- source_word: וַיִּירְשׁוּ
  choice: sie nahmen … in Besitz
  rationale: ירשׁ bezeichnet hier die Inbesitznahme des eroberten Gebiets nach dem Sieg, nicht eine friedliche Erbschaft.
- source_word: אַרְצוֹ
  choice: sein Land
  rationale: אֶרֶץ bezeichnet das von Og beherrschte Gebiet; „Land“ ist die natürliche und hinreichend breite deutsche Entsprechung.
theological_decisions:
- issue: Subjekt in der Aussage über den letzten Überlebenden
  choice: bis ihm kein Überlebender mehr blieb
  alternative: bis sie ihm keinen Überlebenden übrig ließen
  rationale: Das Hebräische verwendet הִשְׁאִיר im Singular, ohne das Subjekt ausdrücklich zu nennen. Die gewählte Fassung wahrt diese Unbestimmtheit, statt die Israeliten ausdrücklich als Subjekt einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzfolge. Die militärische Härte wird weder abgeschwächt noch über das ausdrücklich Gesagte hinaus präzisiert.
