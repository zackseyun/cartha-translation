  source_fidelity: 'Der deutsche Text gibt die hebräische Abfolge und Aussage sachgerecht wieder: וַיַּכּוּ wird im militärischen Kontext angemessen mit „schlugen“ wiedergegeben; die Objekte „ihn, seine Söhne und sein ganzes Volk“ entsprechen dem Text. „bis ihm kein Überlebender mehr blieb“ gibt die Aussage von עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד idiomatisch wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Subjekt für הִשְׁאִיר festzulegen. „nahmen sein Land in Besitz“ trifft וַיִּירְשׁוּ אֶת־אַרְצוֹ im Eroberungskontext gut.'
