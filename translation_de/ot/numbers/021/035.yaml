  terminology: „Söhne“, „Volk“, „Überlebender“ und „Land“ sind treffende, registergerechte Entsprechungen. „In Besitz nehmen“ vermeidet die missverständliche Vorstellung einer bloß friedlichen Erbschaft, ohne den Text übermäßig zu interpretieren.
