  source_fidelity: Die Wiedergabe von יְהוָה als „Jahwe“, der kollektiven Volksbezeichnung als „die Kanaaniter“, von חרם als „der Vernichtung weihen“ sowie die unpersönliche Benennungsformel sind sachgerecht. „hörte auf Israels Stimme“ ist jedoch im heutigen Deutsch missverständlich, da „auf jemanden hören“ primär „jemandem gehorchen“ bedeutet. Zudem ist „ihre Gewalt“ pronominal mehrdeutig.
  naturalness: Die Revision verwendet mit „Israels Ruf“ eine natürliche deutsche Wiedergabe des hebräischen Ausdrucks „Stimme Israels“, ohne die Anrufungssituation weiter auszudeuten. „in die Gewalt Israels“ beseitigt die Bezugsmehrdeutigkeit. Die Satzfolge bleibt knapp und würdig.
  terminology: „Jahwe“, „Kanaaniter“, „der Vernichtung weihen“ und „Horma“ sind für modernes Standarddeutsch und die zugrunde liegende Terminologie passend. Die Fußnote sollte die tatsächliche etymologische Verbindung ausdrücken, statt lediglich von einem ähnlichen Klang zu sprechen.
  issues:
