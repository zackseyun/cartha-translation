    rationale: Die deutsche Wendung „auf jemandes Stimme hören“ wird heute überwiegend als Gehorsam gegenüber einer Person verstanden. Sie ist daher keine eindeutige Wiedergabe von שמע בקול in diesem Kontext.
  - severity: medium
    issue: „gab die Kanaaniter in ihre Gewalt“
    rationale: Das Possessivpronomen kann sich formal auf die Kanaaniter beziehen. „in die Gewalt Israels“ gibt die Zielgruppe eindeutig wieder.
  - severity: low
    issue: Fußnote beschreibt nur Klangähnlichkeit
    rationale: Horma ist nicht bloß ähnlich klingend, sondern etymologisch mit der Wurzel חרם verbunden. Die Anmerkung sollte das Wortspiel präziser benennen.
