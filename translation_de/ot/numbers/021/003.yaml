  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: de
  text: Und Jahwe hörte Israels Ruf und gab die Kanaaniter in die Gewalt Israels. Da weihten sie sie und ihre Städte der Vernichtung. Da nannte man den Ort Horma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Horma hängt mit dem hebräischen Wort für „der Vernichtung weihen“ oder „dem Bann weihen“ zusammen.
    reason: Das Wortspiel zwischen dem Ortsnamen חָרְמָה und der Wurzel חרם ist in der Übersetzung sonst nicht erkennbar.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: hörte auf Israels Stimme
  rationale: Die deutsche Wendung „auf jemandes Stimme hören“ bewahrt das hebräische Bild und drückt zugleich aus, dass Jahwe Israels Bitte erhörte.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: gab die Kanaaniter in ihre Gewalt
  rationale: נתן mit einem feindlichen Objekt bezeichnet hier die Übergabe in die Macht Israels. Der kollektive Singular הַכְּנַעֲנִי wird im natürlichen Deutschen pluralisch wiedergegeben.
- source_word: וַיַּחֲרֵם
  choice: weihten ... der Vernichtung
  rationale: Die Form bezeichnet die unwiderrufliche Bannweihe zur Vernichtung. Diese Wiedergabe erhält den kultisch-technischen Sinn und vermeidet eine Verflachung zu bloßem „vernichteten“.
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: sie und ihre Städte
  rationale: Die beiden direkten Objekte werden knapp und unmittelbar wiedergegeben.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: Deshalb nannte man den Ort
  rationale: Das unpersönliche „man“ lässt den im Hebräischen unausgesprochenen Bezug des singularischen Verbs offen und gibt die Benennungsformel idiomatisch wieder.
- source_word: חָרְמָה
  choice: Horma
  rationale: Der Ortsname wird in der im Deutschen geläufigen biblischen Form transliteriert; sein Wortspiel mit חרם wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe der Bannterminologie חרם
  choice: weihten sie und ihre Städte der Vernichtung
  alternative: vernichteten sie und ihre Städte völlig; belegten sie und ihre Städte mit dem Bann
  rationale: Die Formulierung bewahrt sowohl den besonderen Gedanken der Bannweihe als auch deren tödliche Konsequenz, ohne den Begriff konfessionell auszudeuten oder durch einen bloß technischen Ausdruck unverständlich zu machen.
- issue: Subjekt von וַיִּקְרָא
  choice: 'unpersönliche Wiedergabe: „nannte man“'
  alternative: „er nannte“ oder „sie nannten“
  rationale: Da das hebräische Verb singularisch ist, sein Subjekt aber nicht ausdrücklich genannt wird, vermeidet die unpersönliche Konstruktion eine unbegründete Festlegung auf Jahwe oder Israel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt quellennah, wird aber für heutige Leser durch natürliche deutsche Wendungen geglättet. Der technische Sinn von חרם bleibt ohne beschönigende oder konfessionell festgelegte Auslegung erhalten.
