- from: Und Jahwe hörte auf Israels Stimme und gab die Kanaaniter in ihre Gewalt. Da weihten sie sie und ihre Städte der Vernichtung. Deshalb nannte man den Ort Horma.[a]
  to: Und Jahwe hörte Israels Ruf und gab die Kanaaniter in die Gewalt Israels. Da weihten sie sie und ihre Städte der Vernichtung. Da nannte man den Ort Horma.[a]
  rationale: 'Die Änderungen beseitigen zwei im modernen Deutschen wesentliche Mehrdeutigkeiten, ohne den Aussagegehalt zu erweitern: Jahwe hört den Ruf Israels und übergibt die Kanaaniter Israel. Die Bannweihe wird weiterhin als technische, auf Vernichtung bezogene Handlung wiedergegeben. Die Fußnote erläutert die etymologische Wortverbindung präzise.'
