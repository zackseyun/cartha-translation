source:
  edition: WLC
  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: de
  text: Denn Heschbon war die Stadt Sihons, des Königs der Amoriter; er hatte gegen den früheren König von Moab Krieg geführt und ihm sein ganzes Land bis zum Arnon weggenommen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus seiner Hand genommen“. Gemeint ist: seiner Gewalt beziehungsweise Verfügungsgewalt entzogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage über Heschbon ein und gibt die erklärende Funktion natürlich wieder.
- source_word: עִיר
  choice: Stadt
  rationale: Die übliche Bedeutung von עִיר; für Heschbon als königliches Zentrum passt „Stadt“ besser als „Ort“.
- source_word: הִוא
  choice: war
  rationale: Der hebräische Nominalsatz enthält keine ausdrückliche Zeitform; im historischen Zusammenhang ist das deutsche Präteritum sachgerecht.
- source_word: נִלְחַם
  choice: hatte … Krieg geführt
  rationale: Bezeichnet hier den Kampf gegen einen Gegner; das Plusquamperfekt verdeutlicht, dass dieser Krieg der erzählten Situation vorausging.
- source_word: הָרִאשׁוֹן
  choice: früheren
  rationale: Bezeichnet in diesem Zusammenhang einen vorausgehenden König von Moab; „früheren“ ist im Deutschen natürlicher als das formal mögliche „ersten“.
- source_word: וַיִּקַּח
  choice: hatte … entrissen
  rationale: Gibt die gewaltsame Wegnahme und die zeitliche Vorordnung im erklärenden Rückblick idiomatisch wieder.
- source_word: כָּל אַרְצוֹ
  choice: sein ganzes Land
  rationale: Bezieht sich im Zusammenhang auf das Herrschaftsgebiet des moabitischen Königs und folgt der einfachen Bildsprache des Hebräischen.
- source_word: מִיָּדוֹ
  choice: ihm … entrissen
  rationale: Gibt die hebräische Wendung „aus seiner Hand nehmen“, also der Verfügungsgewalt entziehen, in natürlichem Deutsch wieder; das konkrete Bild wird in der Fußnote ausgewiesen.
- source_word: עַד אַרְנֹן
  choice: bis zum Arnon
  rationale: Kennzeichnet den Arnon als Grenze der Eroberung.
theological_decisions: []
