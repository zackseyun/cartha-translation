id: NUM.21.29
reference: Numbers 21:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: de
  text: Weh dir, Moab! Du bist zugrunde gerichtet, Volk des Kemosch! Er machte seine Söhne zu Flüchtlingen und seine Töchter zu Gefangenen des Amoriterkönigs Sihon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es machte seine Söhne zu Flüchtlingen und seine Töchter zu Gefangenen des Amoriterkönigs Sihon«, wenn die Suffixe auf Moab statt auf Kemosch bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: Weh dir
  rationale: Die feste deutsche Wendung bewahrt sowohl den Klage- als auch den Unheilscharakter des poetischen Ausrufs.
- source_word: אָבַדְתָּ
  choice: du bist zugrunde gerichtet
  rationale: Die Form bezeichnet Moabs eingetretenen katastrophalen Untergang; die Wiedergabe ist quellenah und im Deutschen idiomatisch.
- source_word: עַם כְּמוֹשׁ
  choice: Volk des Kemosch
  rationale: Die Genitivverbindung gibt das Zugehören beziehungsweise die enge Zuordnung des Volkes zu Kemosch wieder.
- source_word: נָתַן
  choice: er machte
  rationale: נתן bedeutet grundsätzlich »geben«, steht hier jedoch mit prädikativen beziehungsweise resultativen Bestimmungen. »Machte … zu« bildet diese Konstruktion natürlich ab.
- source_word: בָּנָיו פְּלֵיטִם
  choice: seine Söhne zu Flüchtlingen
  rationale: פליטים bezeichnet Entkommene oder Geflohene; »Flüchtlinge« wahrt das Motiv von Flucht und Vertreibung.
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: seine Töchter zu Gefangenen
  rationale: Die Formulierung gibt den Parallelismus zu den Söhnen wieder und bezeichnet die Töchter als in Gefangenschaft Geratene.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: des Amoriterkönigs Sihon
  rationale: In Verbindung mit »Gefangenen« bezeichnet לְ die Zuordnung zur Gewalt Sihons; das deutsche Genitivattribut ist knapp und natürlich.
theological_decisions:
- issue: Bezugswort der maskulinen Singularsuffixe in »seine Söhne« und »seine Töchter«
  choice: Die Suffixe werden auf Kemosch bezogen.
  alternative: 'Die Suffixe können sich sinngemäß auf Moab beziehen: »dessen Söhne« und »dessen Töchter« beziehungsweise »Moabs Söhne und Töchter«.'
  rationale: Kemosch ist das unmittelbar vorausgehende maskuline Singularwort. Die Hauptfassung bewahrt deshalb die grammatische Form und die poetische Darstellung des Gottes als Vater seines Volkes, ohne die mögliche kollektive Beziehung auf Moab zu verschweigen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem poetisch-prophetischen Ausruf »Weh dir«. Der Parallelismus von Söhnen und Töchtern sowie von Flüchtlingen und Gefangenen bleibt deutlich. Die traditionelle deutsche Namensform »Kemosch« wird verwendet.
