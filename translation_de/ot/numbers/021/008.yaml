  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: »Mach dir eine Feuerschlange[a] und stelle sie auf eine Stange[b]. Jeder, der gebissen worden ist und sie ansieht, wird leben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine brennende Schlange«; das hebräische Wort bedeutet wörtlich »Brennender« und bezeichnet hier eine Schlange.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf ein Feldzeichen« oder »auf eine Signalstange«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in seiner im Deutschen üblichen Form wieder, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: עֲשֵׂה לְךָ
  choice: Mach dir
  rationale: Bewahrt den Imperativ samt dem Dativpronomen und klingt zugleich natürlich und unmittelbar.
- source_word: שָׂרָף
  choice: Feuerschlange
  rationale: Bewahrt das Bild des hebräischen Ausdrucks, der wörtlich mit Brennen verbunden ist, und bezeichnet im Erzählzusammenhang eine tödliche Schlange; »Giftschlange« wäre stärker auslegend.
- source_word: וְשִׂים אֹתוֹ עַל נֵס
  choice: befestige sie an einer Stange
  rationale: »Stange« gibt den konkreten Träger des Schlangenbildes verständlich wieder; »befestige« drückt das Anbringen idiomatisch aus, ohne die Art der Befestigung festzulegen.
- source_word: הַנָּשׁוּךְ
  choice: der gebissen worden ist
  rationale: Gibt das substantivierte passive Partizip als allgemeinen Fall wieder und lässt offen, wann genau der Biss erfolgte.
- source_word: וְרָאָה אֹתוֹ
  choice: und sie ansieht
  rationale: »Ansehen« bezeichnet hier das bewusste Hinblicken treffender als das bloße Wahrnehmen mit »sehen«; die koordinierte hebräische Form bleibt erhalten.
- source_word: וָחָי
  choice: wird am Leben bleiben
  rationale: Im Zusammenhang geht es um das Überleben des tödlichen Schlangenbisses; die Formulierung gibt die resultative Aussage klar und würdig wieder.
theological_decisions:
- issue: Bedeutung und Bildsprache von שָׂרָף
  choice: Im Haupttext steht »Feuerschlange«.
  alternative: »brennende Schlange«, »Seraf« oder deutender »Giftschlange«
  rationale: Der Erzählzusammenhang verlangt eine Schlange, während die Wortbildung die Vorstellung des Brennens bewahrt. »Seraf« wäre für heutige Leser leicht als Engelwesen missverständlich, »Giftschlange« legt die Ursache der tödlichen Wirkung stärker fest als der Ausgangstext.
- issue: Aussage von וָחָי
  choice: »wird am Leben bleiben«
  alternative: »wird leben«
  rationale: Die gewählte Wiedergabe macht im unmittelbaren Zusammenhang deutlich, dass der Gebissene nicht stirbt, ohne darüber hinaus eine geistliche oder ewige Lebensbedeutung in den Vers hineinzulesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und feierlich. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wörtern.
