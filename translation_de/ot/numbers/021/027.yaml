  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֛ן יֹאמְר֥וּ הַ/מֹּשְׁלִ֖ים בֹּ֣אוּ חֶשְׁבּ֑וֹן תִּבָּנֶ֥ה וְ/תִכּוֹנֵ֖ן עִ֥יר סִיחֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: de
  text: 'Darum sagen die Spruchdichter[a]: »Kommt nach Heschbon! Die Stadt Sihons soll gebaut und fest gegründet werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Spruchredner«, »die Sänger«; traditionell auch: »die Herrscher«. Das hebräische Partizip bezeichnet hier wahrscheinlich Menschen, die einen Spruch oder ein Spottlied verfassen oder vortragen, nicht politische Herrscher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt die folgernde beziehungsweise erklärende Verbindung zum vorausgehenden Bericht knapp und natürlich wieder.
- source_word: יֹאמְרוּ
  choice: sagen
  rationale: Das Imperfekt dient hier in einer Einleitungsformel für ein überliefertes Wort; das deutsche Präsens gibt diesen üblichen beziehungsweise zeitunabhängigen Sinn angemessen wieder.
- source_word: הַמֹּשְׁלִים
  choice: die Spruchdichter
  rationale: Das Partizip bezeichnet im Kontext wahrscheinlich Verfasser oder Vortragende eines spruch- beziehungsweise spottliedartigen Textes. »Spruchdichter« bewahrt den Bezug zu מָשָׁל besser als das allgemeinere »Dichter«.
- source_word: בֹּאוּ
  choice: Kommt nach
  rationale: Der Imperativ der 2. Person Plural wird direkt wiedergegeben; bei einem Ortsnamen ist »nach« im Deutschen idiomatisch.
- source_word: חֶשְׁבּוֹן
  choice: Heschbon
  rationale: Der Ortsname wird in der im Deutschen geläufigen biblischen Transkription wiedergegeben.
- source_word: תִּבָּנֶה
  choice: soll gebaut werden
  rationale: Die poetisch-volitive Nuance der Form wird mit »soll« ausgedrückt, ohne sie als bloße Zukunft festzulegen.
- source_word: וְתִכּוֹנֵן
  choice: und fest gegründet werden
  rationale: Gibt die Bedeutung von כון als fest gründen beziehungsweise dauerhaft aufrichten wieder und erhält den poetischen Parallelismus.
- source_word: עִיר סִיחוֹן
  choice: die Stadt Sihons
  rationale: Die hebräische Status-constructus-Verbindung wird als natürliche deutsche Genitivverbindung wiedergegeben.
