source:
  edition: WLC
  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: de
  text: Von dort brachen sie auf und lagerten jenseits des Arnon[a], in der Wüste, die sich von der Grenze der Amoriter aus erstreckt. Denn der Arnon bildet die Grenze Moabs zwischen Moab und den Amoritern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der anderen Seite des Arnon“. Der hebräische Ausdruck kann je nach Blickrichtung die jenseitige Seite oder das gegenüberliegende Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Die übliche adverbiale Wendung setzt die Reiseroute vom zuvor genannten Ort aus fort.
- source_word: נָסָעוּ
  choice: brachen sie auf
  rationale: נסע bezeichnet in Reiseberichten häufig das Aufbrechen eines Lagers und nicht bloß allgemeines Reisen.
- source_word: וַיַּחֲנוּ
  choice: und lagerten
  rationale: Das Verb bezeichnet das Aufschlagen beziehungsweise Beziehen eines Lagers; „lagerten“ ist gegenwärtiges, würdiges Standarddeutsch.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: jenseits des Arnon
  rationale: עֵבֶר bezeichnet die andere beziehungsweise gegenüberliegende Seite eines Grenzraums. „Jenseits“ wahrt die im Hebräischen perspektivabhängige Ortsangabe knapp und natürlich.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Der Relativsatz bestimmt den Lagerort näher. Im Deutschen lässt sich die lokale Zuordnung natürlich als Apposition anschließen.
- source_word: הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: die sich vom Gebiet der Amoriter her erstreckt
  rationale: יצא bedeutet wörtlich „herausgehen“ und beschreibt hier räumliche Ausdehnung. גְּבוּל kann außer der Grenzlinie auch das abgegrenzte Gebiet bezeichnen; diese Wiedergabe ergibt eine verständliche geografische Aussage, ohne die Bildlichkeit überzubetonen.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die erklärende Begründung für die geografische Einordnung ein.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: der Arnon bildet die Grenze Moabs
  rationale: Die verblos formulierte geografische Aussage wird idiomatisch mit „bildet“ wiedergegeben.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: zwischen Moab und den Amoritern
  rationale: Die wiederholte Präposition markiert die beiden durch die Grenze getrennten Seiten; der morphologische Singular „der Amoriter“ ist kollektiv gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die perspektivabhängige Lageangabe „jenseits“ bleibt bewusst offen. Die komplexe hebräische geografische Satzfolge wurde moderat gegliedert, ohne Sachinformationen hinzuzufügen.
