id: NUM.21.6
reference: Numbers 21:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: de
  text: Da ließ Jahwe feurige Schlangen[a] unter das Volk kommen. Sie bissen das Volk, und viele aus Israel starben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Giftschlangen“ beziehungsweise „brennende Schlangen“. Wörtlich steht im Hebräischen: „die Schlangen, die feurigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: ließ … kommen
  rationale: שׁלח bedeutet grundsätzlich „senden“. Bei Schlangen klingt im Deutschen „ließ … kommen“ natürlich und bewahrt zugleich Jahwe als handelndes Subjekt; „sandte“ wäre ebenfalls möglich, wirkt hier aber etwas hölzern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die geläufige deutsche Form.
- source_word: בָּעָם
  choice: unter das Volk
  rationale: Die Präposition ב bezeichnet hier den Bereich, in den beziehungsweise innerhalb dessen die Schlangen gebracht werden. „Unter das Volk“ ist idiomatisch und vermeidet die stärker deutende Wiedergabe „gegen das Volk“.
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: feurige Schlangen
  rationale: Die Wiedergabe erhält sowohl das Substantiv „Schlangen“ als auch das bildhafte Attribut „feurig“. Dessen genaue Bedeutung bleibt offen und wird in der Fußnote erläutert.
- source_word: וַיְנַשְּׁכוּ
  choice: Sie bissen
  rationale: נשׁך bezeichnet unmittelbar das Beißen; die einfache Erzählform entspricht der hebräischen Handlungsfolge.
- source_word: וַיָּמָת
  choice: starben
  rationale: מות ist das gewöhnliche Verb für „sterben“; die schlichte Wiedergabe vermeidet eine unnötige Steigerung wie „kamen um“.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: viele aus Israel
  rationale: Die Formulierung gibt den quantitativen Sinn von עַם רָב und das partitive מן knapp und natürlich wieder. Im Kontext sind Menschen aus dem Volk Israel gemeint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen. Die Transliteration bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הַשְּׂרָפִים
  choice: feurige Schlangen
  alternative: Giftschlangen
  rationale: „Feurig“ erhält die konkrete Bildsprache und legt nicht fest, ob das Wort das Aussehen der Schlangen, die brennende Wirkung ihres Bisses oder ihre Giftigkeit bezeichnet.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Satzfolge. Der einleitende Anschluss וַ wird mit „Da“ wiedergegeben. Die Wiederholung von „das Volk“ entspricht dem hebräischen Text; „viele aus Israel“ vermeidet dagegen eine im Deutschen unnötige weitere Wiederholung.
