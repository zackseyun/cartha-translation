source:
  edition: WLC
  text: בְּאֵ֞ר חֲפָר֣וּ/הָ שָׂרִ֗ים כָּר֨וּ/הָ֙ נְדִיבֵ֣י הָ/עָ֔ם בִּ/מְחֹקֵ֖ק בְּ/מִשְׁעֲנֹתָ֑/ם וּ/מִ/מִּדְבָּ֖ר מַתָּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: de
  text: 'der Brunnen, den die Fürsten gruben,

    den die Edlen des Volkes aushoben,

    mit dem Herrscherstab[a], mit ihren Stäben.


    Von der Wüste zogen sie weiter nach Mattana.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch den Gesetzgeber“ beziehungsweise „durch den Herrscher“. Das hebräische Wort kann eine Person oder den Herrscherstab beziehungsweise das Zepter bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „und von der Wüste Mattana“. Gemeint ist wahrscheinlich der Übergang zur nächsten Station der Reiseroute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: der Brunnen
  rationale: Das Substantiv bezeichnet einen Brunnen. Obwohl im Hebräischen kein Artikel steht, ist der in Vers 17 besungene bestimmte Brunnen gemeint.
- source_word: חֲפָרוּהָ
  choice: den … gruben
  rationale: חפר bedeutet „graben“; das feminine Objektsuffix bezieht sich auf בְּאֵר. Der vorangestellte Relativsatz gibt dies im Deutschen natürlich wieder.
- source_word: שָׂרִים
  choice: Fürsten
  rationale: Das Wort bezeichnet hochrangige Führende oder Amtsträger. „Fürsten“ bewahrt den gehobenen, poetischen Ton und die soziale Rangbezeichnung.
- source_word: כָּרוּהָ
  choice: den … aushoben
  rationale: כרה ist ein weiteres Verb für das Graben. „Aushoben“ wahrt die Parallelität, ohne beide hebräischen Verben gleich wiederzugeben.
- source_word: נְדִיבֵי הָעָם
  choice: die Edlen des Volkes
  rationale: Im Parallelismus zu שָׂרִים liegt die Bedeutung „Edle/Vornehme“ näher als „Freiwillige“ oder „Freigebige“.
- source_word: בִּמְחֹקֵק
  choice: mit dem Herrscherstab
  rationale: מְחֹקֵק kann einen Herrscher beziehungsweise Gesetzgeber oder dessen Stab beziehungsweise Zepter bezeichnen. Der Parallelismus mit „mit ihren Stäben“ spricht hier für ein Herrschaftszeichen als Werkzeug.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: mit ihren Stäben
  rationale: Das Wort bezeichnet Stäbe, auf die man sich stützt. Die allgemeine Wiedergabe „Stäbe“ passt zum poetischen Bild und vermeidet eine unnötige Festlegung auf Wanderstäbe.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: Von der Wüste zogen sie weiter nach Mattana
  rationale: Der knappe hebräische Ausdruck enthält wörtlich nur „und von der Wüste Mattana“. Im Zusammenhang der anschließenden Reiseroute wird die elliptische Bewegungsangabe im Deutschen ausdrücklich gemacht.
theological_decisions:
- issue: Mehrdeutigkeit von בִּמְחֹקֵק
  choice: 'instrumental: „mit dem Herrscherstab“'
  alternative: 'personal: „durch den Gesetzgeber/Herrscher“; abstrakt: „nach Anordnung“'
  rationale: Die parallele Wendung „mit ihren Stäben“ begünstigt die instrumentale Lesart. Eine Fußnote bewahrt die echte lexikalische Mehrdeutigkeit, ohne spätere theologische Deutungen in das Lied einzutragen.
- issue: Elliptische Ortsangabe וּמִמִּדְבָּר מַתָּנָה
  choice: 'Reiseübergang: „Von der Wüste zogen sie weiter nach Mattana“'
  alternative: 'wörtlich-fragmentarisch: „und von der Wüste Mattana“'
  rationale: Die Verse 18–20 nennen aufeinanderfolgende Reisestationen. Die ergänzte Bewegungsaussage macht die hebräische Ellipse auf natürlichem Deutsch verständlich, ohne eine zusätzliche inhaltliche Behauptung einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Zeilengliederung. Die Wiederholung der Relativsätze und die Unterscheidung zwischen „gruben“ und „aushoben“ erhalten den Parallelismus. Der Versanfang bleibt kleingeschrieben, weil er das in Vers 17 begonnene Brunnenlied syntaktisch fortsetzt.
