  terminology: „Brunnen“, „Fürsten“, „Edlen“, „Herrscherstab“ und „Stäben“ sind terminologisch stimmig. „Mattana“ ist eine sachgerechte deutsche Namensform. Die Fußnoten sind korrekt verankert und erläutern die zwei tatsächlichen Übersetzungsentscheidungen, ohne eine konfessionelle Deutung einzutragen.
