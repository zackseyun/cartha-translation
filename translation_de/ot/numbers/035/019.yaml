source:
  edition: WLC
  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: de
  text: Der Bluträcher[a] selbst soll den Mörder töten; wenn er ihn antrifft, soll er selbst ihn töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck ist eine feste Rechtsbezeichnung für den Familienangehörigen, dem die Ahndung widerrechtlich vergossenen Blutes oblag; wörtlich etwa „Löser des Blutes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: Bluträcher
  rationale: Die feste hebräische Rechtsbezeichnung meint hier den Familienangehörigen, der für die Ahndung widerrechtlich vergossenen Blutes zuständig ist. „Bluträcher“ gibt diese Funktion im Deutschen knapp und verständlich wieder, ohne die sonst mögliche Bedeutung „Löser“ oder „Erlöser“ einzutragen.
- source_word: הוּא
  choice: selbst
  rationale: Das selbstständige Personalpronomen hebt den handelnden Bluträcher hervor. „Selbst“ bewahrt diesen Nachdruck an beiden Stellen des Verses.
- source_word: יָמִית / יְמִיתֶנּוּ
  choice: soll … töten
  rationale: Der Hifil von מות bezeichnet das Verursachen des Todes. Im rechtlichen Zusammenhang drückt „soll … töten“ sowohl die angeordnete Handlung als auch die kausative Bedeutung aus, ohne mit „hinrichten“ ein förmliches staatliches Verfahren vorauszusetzen.
- source_word: הָרֹצֵחַ
  choice: den Mörder
  rationale: רצח kann rechtswidriges Töten allgemeiner bezeichnen; hier geht es im unmittelbaren Zusammenhang um den Täter, der nach den vorausgehenden Kriterien des Mordes schuldig und dem Tod verfallen ist. Daher passt „Mörder“.
- source_word: בְּפִגְעוֹ בוֹ
  choice: wenn er ihn antrifft
  rationale: Die Wendung beschreibt das Zusammentreffen oder Antreffen einer Person. „Wenn er ihn antrifft“ gibt den zeitlichen Sinn natürlich wieder, ohne den möglichen Anklang an einen tätlichen Angriff in פגע festzuschreiben.
theological_decisions:
- issue: Rechtliche Rolle des גֹּאֵל הַדָּם
  choice: 'Als „Bluträcher“ verstanden: ein menschlicher, verwandtschaftlich bestimmter Rechtsträger im israelitischen Tötungsrecht.'
  alternative: „Blutlöser“ oder „Löser des Blutes“ mit stärkerem Erlösungsanklang.
  rationale: Der Zusammenhang behandelt die rechtliche Ahndung einer Tötung. Die Wiedergabe soll diese geschichtliche Rechtsinstitution erkennen lassen, ohne spätere Erlösungslehren in den Ausdruck hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Rechtssprache. Die Wiederholung von „selbst“ und „töten“ bildet den nachdrücklichen Parallelismus des Hebräischen ab; die Fußnote erklärt den kultur- und rechtsgeschichtlich geprägten Fachausdruck.
