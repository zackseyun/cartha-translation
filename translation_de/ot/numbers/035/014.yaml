source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: de
  text: Drei der Städte sollt ihr jenseits des Jordan[a] bestimmen und drei der Städte im Land Kanaan. Sie sollen Zufluchtsstädte sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der anderen Seite des Jordan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: bestimmen
  rationale: נתן bedeutet wörtlich „geben“, bezeichnet hier aber im rechtlich-administrativen Zusammenhang die Zuweisung von Städten zu einem bestimmten Zweck. „Bestimmen“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Wendung bezeichnet die andere Seite des Jordan aus einem vorausgesetzten räumlichen Blickwinkel, ohne diesen näher festzulegen. „Jenseits des Jordan“ ist knapp und bewahrt diese Relationalität.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) und damit den territorialen Akzent bei.
- source_word: עָרֵי מִקְלָט
  choice: Zufluchtsstädte
  rationale: Der etablierte deutsche Rechtsbegriff bezeichnet Städte, die Menschen Schutz gewährten, welche unabsichtlich jemanden getötet hatten.
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: drei von den Städten ... und drei von den Städten
  rationale: Der bestimmte Ausdruck „die Städte“ verweist auf die bereits behandelte Gesamtmenge. „Drei von den Städten“ bildet diese Teilmengenbeziehung deutlicher ab als das allgemeinere „drei Städte“.
- source_word: תִּהְיֶינָה
  choice: sie sollen ... sein
  rationale: Das Imperfekt von היה beschreibt hier im gesetzlichen Zusammenhang den vorgesehenen Status beziehungsweise Zweck der sechs Städte. „Sollen ... sein“ klingt im modernen Deutschen natürlich und wahrt den normativen Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Satzteilung erleichtert das Verständnis, ohne die inhaltliche Struktur zu verändern. Das zweimalige „von den Städten“ bewahrt die Bestimmtheit und den Bezug auf die zuvor genannte Gesamtzahl.
