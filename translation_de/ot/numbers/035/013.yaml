  text: וְ/הֶ/עָרִ֖ים אֲשֶׁ֣ר תִּתֵּ֑נוּ שֵׁשׁ עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֥ינָה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/013.yaml
  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: de
  text: Und die Städte, die ihr gebt, sollen euch sechs Zufluchtsstädte sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: Und die Städte
  rationale: Die Konjunktion וְ wird schlicht mit „Und“ wiedergegeben; der bestimmte Artikel bleibt erhalten.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bezieht sich auf das feminine Pluralwort „Städte“ und ist im Deutschen natürlich mit „die“ wiederzugeben.
- source_word: תִּתֵּנוּ
  choice: ihr gebt
  rationale: Das Qal-Imperfekt der 2. Person Plural bezeichnet hier im Relativsatz die vorgesehene Handlung; das Präsens ist im Deutschen natürlich und wahrt den prospektiven Zusammenhang.
- source_word: שֵׁשׁ
  choice: sechs
  rationale: Die Kardinalzahl wird unmittelbar wiedergegeben.
- source_word: עָרֵי מִקְלָט
  choice: Zufluchtsstädte
  rationale: Die hebräische Status-constructus-Verbindung bedeutet wörtlich „Städte der Zuflucht“; „Zufluchtsstädte“ ist die klare, geläufige deutsche Bezeichnung für diese Rechtseinrichtung.
- source_word: תִּהְיֶינָה
  choice: sollen … sein
  rationale: Das Qal-Imperfekt der 3. Person feminin Plural hat im gesetzlichen Zusammenhang anordnende beziehungsweise bestimmende Kraft, die „sollen … sein“ angemessen ausdrückt.
- source_word: לָ/כֶם
  choice: euch
  rationale: Die Präposition ל mit Suffix der 2. Person Plural wird bei „sein“ idiomatisch mit dem deutschen Dativ wiedergegeben und bezeichnet die Zuordnung zugunsten der Angesprochenen.
