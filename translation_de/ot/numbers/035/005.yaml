source:
  edition: WLC
  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: de
  text: 'Ihr sollt außerhalb der Stadt messen: an der Ostseite zweitausend Ellen, an der Südseite zweitausend Ellen, an der Westseite[a] zweitausend Ellen und an der Nordseite zweitausend Ellen, wobei die Stadt in der Mitte liegt. Dies soll ihnen das Weideland[b] der Städte sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Meerseite“; damit ist nach dem üblichen hebräischen Sprachgebrauch die Westseite gemeint, die zum Mittelmeer hin liegt.
    reason: lexical_alternative
  - marker: b
    text: Oder „Allmende“ beziehungsweise „Freifläche“. Das hebräische Wort bezeichnet das offene Land rings um eine Stadt, das häufig als Weideland genutzt wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: Ihr sollt messen
  rationale: Das Qal-Perfekt mit וְ hat im gesetzlichen Zusammenhang anweisende Kraft. „Ihr sollt messen“ bewahrt sowohl den konkreten Vermessungsvorgang als auch den verbindlichen Ton.
- source_word: מִחוּץ לָעִיר
  choice: außerhalb der Stadt
  rationale: Die Wendung bezeichnet den Raum außerhalb der Stadt; die deutsche Formulierung ist natürlich und legt keinen zusätzlichen Ausgangspunkt der Messung fest.
- source_word: פְּאַת
  choice: Seite
  rationale: Im Zusammenhang der vier Himmelsrichtungen bezeichnet das Wort jeweils eine Seite beziehungsweise Begrenzung des vermessenen Gebiets.
- source_word: קֵדְמָה
  choice: Ostseite
  rationale: Das Richtungswort bezeichnet hier den Osten; „Ostseite“ passt zum parallelen Aufbau der Vermessungsangaben.
- source_word: נֶגֶב
  choice: Südseite
  rationale: Hier ist die Himmelsrichtung gemeint, nicht die Landschaft Negev.
- source_word: יָם
  choice: Westseite
  rationale: Wörtlich bedeutet das Wort „Meer“, dient hier aber im üblichen hebräischen Richtungsgebrauch als Bezeichnung für den Westen. Eine Fußnote erhält das konkrete Bild.
- source_word: צָפוֹן
  choice: Nordseite
  rationale: Das Wort ist die gewöhnliche Bezeichnung der nördlichen Himmelsrichtung.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: zweitausend Ellen
  rationale: Die ausdrücklich genannte antike Maßeinheit wird beibehalten und nicht in ein modernes Maß umgerechnet.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: wobei die Stadt in der Mitte liegt
  rationale: Die Formulierung gibt die räumliche Anordnung knapp wieder, ohne die geometrische Beziehung zu den Maßangaben über den Wortlaut hinaus zu bestimmen.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: Dies soll ihnen ... dienen
  rationale: Die Wendung bezeichnet die Zuweisung beziehungsweise Bestimmung des Gebiets, ohne eine besondere eigentumsrechtliche Deutung einzutragen.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: Weideland der Städte
  rationale: מִגְרָשׁ bezeichnet das offene Land um eine Stadt, das unter anderem als Weidefläche genutzt wurde. „Weideland“ ist verständlich; die weitere Bedeutungsbreite wird in einer Fußnote genannt.
