review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen zutreffend wieder: das hölzerne Werkzeug bzw. den Gegenstand, dessen tödliche Eignung, den Tod des Getroffenen, die Einstufung als רֹצֵחַ und die verbindliche Todesstrafe. Die Verbindung עֵץ יָד bezeichnet wahrscheinlich einen in der Hand gehaltenen bzw. handgeführten hölzernen Gegenstand; diese Einordnung sollte im Deutschen klarer und idiomatischer ausgedrückt werden.'
  naturalness: Die Abfolge „er ihn ... schlägt und er stirbt“ ist im Deutschen mehrdeutig, weil das zweite „er“ auch auf den Schlagenden bezogen werden kann. Ferner ist „muss unbedingt getötet werden“ zwar verständlich, doch „unbedingt“ kann im modernen Deutsch Dringlichkeit oder Vorbehaltlosigkeit statt der hebräischen Nachdrücksformel nahelegen. Die vorgeschlagene Fassung ist eindeutig und wahrt den rechtssprachlichen Registerton.
  terminology: „Mörder“ ist im Kontext der gesetzlichen Gegenüberstellung zur unbeabsichtigten Tötung angemessen. „Getötet werden“ bewahrt die passive Formulierung des hebräischen Strafsatzes, ohne durch „hingerichtet“ eine zusätzliche terminologische Festlegung einzutragen. „Handgehalten“ ist für die mögliche Bedeutung von יָד natürlicher als „handgeführt“.
  issues:
  - severity: medium
    issue: Mehrdeutiges Personalpronomen in „und er stirbt“
    rationale: Nach „wenn er ihn ... schlägt“ kann das zweite „er“ im Deutschen grammatisch sowohl den Täter als auch den Getroffenen bezeichnen. Der hebräische Text meint eindeutig den Geschlagenen.
  - severity: low
    issue: „Muss unbedingt getötet werden“ ist keine ideale deutsche Wiedergabe der Verstärkung
    rationale: „Unbedingt“ hat im heutigen Deutsch häufig die Konnotation von Dringlichkeit oder eines uneingeschränkten Wunsches. Die rechtliche Modalität von מוֹת יוּמַת wird idiomatischer durch „muss getötet werden“ wiedergegeben.
  - severity: low
    issue: Die Fußnotenalternative „handgeführten“ ist weniger idiomatisch
    rationale: Für einen Gegenstand, der in der Hand gehalten wird, ist „handgehaltenen“ im modernen Standarddeutsch die natürlichere Formulierung.
  revised_text: Oder wenn jemand einen anderen mit einem hölzernen Gegenstand, den er in der Hand hält und der tödlich sein kann, schlägt und dieser stirbt, ist er ein Mörder; der Mörder muss getötet werden.
  revised_footnotes:
  - marker: a
    text: 'Oder: „mit einem hölzernen Werkzeug in der Hand“ oder „mit einem handgehaltenen hölzernen Gegenstand“.'
    reason: lexical_alternative
