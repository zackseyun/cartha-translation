source:
  edition: WLC
  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: de
  text: Oder wenn jemand einen anderen mit einem hölzernen Gegenstand, den er in der Hand hält und der tödlich sein kann, schlägt und dieser stirbt, ist er ein Mörder; der Mörder muss getötet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: mit einem hölzernen Gegenstand in der Hand
  rationale: כְּלִי bezeichnet allgemein einen Gegenstand, ein Gerät oder Werkzeug; im Zusammenhang mit Eisen und Stein ist „Gegenstand“ natürlich und wahrt die Bedeutungsbreite. „In der Hand“ bildet יָד sichtbar ab, obwohl die Verbindung wahrscheinlich einen handgeführten Gegenstand meint.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: durch den man sterben kann
  rationale: Die Formulierung beschreibt die tödliche Eignung des Gegenstands und nicht nur den tatsächlich eingetretenen Tod.
- source_word: הִכָּהוּ
  choice: schlägt
  rationale: נכה bedeutet hier „schlagen“; das Präsens passt zu einer allgemein formulierten Rechtsbestimmung und nimmt den anschließend genannten Tod nicht vorweg.
- source_word: וַיָּמֹת
  choice: und er stirbt
  rationale: Die koordinierte Wiedergabe folgt der hebräischen Abfolge, ohne eine zusätzliche Kausalnuance einzutragen.
- source_word: רֹצֵחַ
  choice: Mörder
  rationale: Der Kontext unterscheidet schuldhafte Tötung vom unbeabsichtigten Töten und verhängt die Todesstrafe; „Mörder“ gibt diese rechtliche und moralische Einstufung angemessen wieder.
- source_word: מוֹת יוּמַת
  choice: muss unbedingt getötet werden
  rationale: Die Verbindung aus absolutem Infinitiv und finitem Passiv verstärkt die verbindliche Strafbestimmung. „Unbedingt“ bewahrt den Nachdruck, ohne das allgemeinere „getötet werden“ durch das spezifischere „hingerichtet werden“ zu ersetzen.
theological_decisions:
- issue: Rechtliche Einstufung von רֹצֵחַ im Tötungsrecht
  choice: Mörder
  alternative: Totschläger; jemand, der tötet
  rationale: Der unmittelbare Zusammenhang klassifiziert die vorsätzliche beziehungsweise schuldhafte Tötung mit einem tödlich geeigneten Gegenstand und grenzt sie vom Unfall ab. „Mörder“ vermittelt das Rechtsurteil, ohne weitere lehrmäßige Kategorien einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Der Satzbau bewahrt die kasuistische Wenn-dann-Struktur des Zusammenhangs; „muss unbedingt“ gibt die hebräische Verstärkung wieder.
