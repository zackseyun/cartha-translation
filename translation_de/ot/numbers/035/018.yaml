revisions:
- from: Oder wenn er ihn mit einem hölzernen Gegenstand in der Hand[a], durch den man sterben kann, schlägt und er stirbt, ist er ein Mörder; der Mörder muss unbedingt getötet werden.
  to: Oder wenn jemand einen anderen mit einem hölzernen Gegenstand, den er in der Hand hält und der tödlich sein kann, schlägt und dieser stirbt, ist er ein Mörder; der Mörder muss getötet werden.
  rationale: Die Revision beseitigt die deutsche Pronomenmehrdeutigkeit, gibt die wahrscheinlich handgehaltene Bedeutung von עֵץ יָד idiomatisch wieder und ersetzt das potenziell fehlleitende „unbedingt“ durch die klare gesetzliche Verpflichtungsform. Die Fußnotenmarkierung bleibt an „in der Hand“ erhalten und dokumentiert die lexikalische Alternative. Inhalt und rechtliche Aussage des Verses bleiben unverändert.
