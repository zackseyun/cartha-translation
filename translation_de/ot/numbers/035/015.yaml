  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: de
  text: Diese sechs Städte sollen den Israeliten[a], den Fremden und den bei ihnen Wohnenden[b] als Zufluchtsorte dienen, damit jeder dorthin fliehen kann, der unabsichtlich einen Menschen getötet hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »den Söhnen Israels«; auch: »den Kindern Israels«.'
    reason: lexical_alternative
  - marker: b
    text: »Fremde« und »bei ihnen Wohnende« geben zwei verschiedene hebräische Begriffe (גֵּר und תּוֹשָׁב) wieder. Beide bezeichnen Personen, die innerhalb der israelitischen Gemeinschaft leben; die Begriffe werden im Text unterschieden.
    reason: cultural_note
  - marker: c
    text: 'Auch: »jeder, der einen Menschen unabsichtlich erschlägt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die geläufige deutsche Volksbezeichnung gibt die feste hebräische Bezeichnung natürlich und ohne den im Deutschen missverständlichen Eindruck ausschließlich männlicher Personen wieder; die wörtlichere Form wird in der Fußnote genannt.
- source_word: גֵּר
  choice: Fremden
  rationale: Der Ausdruck bezeichnet hier nicht einheimische Personen, die innerhalb der israelitischen Gemeinschaft leben; »Fremde« ist in einem würdigen rechtlichen Kontext verständlich.
- source_word: תּוֹשָׁב
  choice: Beisassen
  rationale: Die eigenständige Wiedergabe wahrt den Unterschied zu גֵּר und bezeichnet einen ansässigen Nichtvollbürger; eine Fußnote erläutert den heute weniger geläufigen Rechtsbegriff.
- source_word: בְּתוֹכָם
  choice: die unter ihnen leben
  rationale: Die Formulierung macht in natürlichem Deutsch deutlich, dass sich beide Gruppen innerhalb der israelitischen Gesellschaft aufhalten.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: Diese sechs Städte sollen … als Zufluchtsorte dienen
  rationale: »Sollen … dienen« entspricht dem rechtlich-anordnenden Charakter; der Plural »Zufluchtsorte« passt im Deutschen zu den sechs Städten.
- source_word: לָנוּס שָׁמָּה
  choice: Dorthin kann … fliehen
  rationale: Die Formulierung gibt Zweck und gewährte Möglichkeit idiomatisch wieder.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: jeder, der … einen Menschen getötet hat
  rationale: Im Kontext bezeichnet die Wendung jeden, der den Tod eines Menschen verursacht hat; die Übersetzung ist klarer als eine mechanische Wiedergabe mit »schlagen«.
- source_word: בִּשְׁגָגָה
  choice: unabsichtlich
  rationale: Der Ausdruck markiert die für das Asylrecht entscheidende fehlende Tötungsabsicht.
theological_decisions:
- issue: Geschlechtliche Form der Bundes- und Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels / Kinder Israels
  rationale: Die hebräische Wendung ist hier die feste Bezeichnung des ganzen Volkes. »Israeliten« wahrt diese Bedeutung in natürlichem Deutsch, ohne den Geltungsbereich irrtümlich auf Männer zu beschränken; die formnähere Alternative bleibt in der Fußnote sichtbar.
- issue: Reichweite des Schutzes der Zufluchtsstädte
  choice: Israeliten, Fremde und Beisassen werden ausdrücklich als begünstigte Gruppen genannt
  alternative: Die beiden nicht einheimischen Bezeichnungen zu einer einzigen Gruppe zusammenziehen
  rationale: Der Text nennt גֵּר und תּוֹשָׁב getrennt. Diese rechtliche und gesellschaftliche Differenz wird nicht eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht rechtlichem Ton. Der Satz wurde zur besseren Verständlichkeit geteilt. »Beisasse« ist bewusst fachsprachlich-traditionell gewählt und wird deshalb erläutert; die beiden unterschiedlichen hebräischen Sozialbegriffe bleiben erkennbar.
