  source_fidelity: 'Die Satzglieder und der rechtliche Sinn werden grundsätzlich zutreffend wiedergegeben: Die sechs Städte sind für Israeliten sowie die beiden gesondert genannten Personengruppen bestimmt, damit jemand nach einer unbeabsichtigten Tötung dorthin fliehen kann. »Beisassen« ist jedoch kein modernes Standarddeutsch und legt zudem einen spezifischen historischen Rechtsstatus nahe, den תּוֹשָׁב hier nicht sicher präzisiert.'
  naturalness: Der Entwurf ist klar und würdevoll, doch »Beisassen« wirkt deutlich altertümlich. »bei ihnen Wohnenden« ist modernes, verständliches Deutsch und hält den vom Hebräischen getrennt genannten Begriff offen.
  terminology: »Israeliten«, »Fremde«, »Zufluchtsorte« und »unabsichtlich« sind angemessen. Die getrennte Nennung von גֵּר und תּוֹשָׁב soll erhalten bleiben, ohne für letzteren einen zu engen fachhistorischen deutschen Terminus zu wählen.
