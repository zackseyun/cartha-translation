revisions:
- from: Diese sechs Städte sollen den Israeliten[a], den Fremden und den Beisassen, die unter ihnen leben,[b] als Zufluchtsorte dienen. Dorthin kann jeder fliehen, der unabsichtlich einen Menschen getötet hat.[c]
  to: Diese sechs Städte sollen den Israeliten[a], den Fremden und den bei ihnen Wohnenden[b] als Zufluchtsorte dienen, damit jeder dorthin fliehen kann, der unabsichtlich einen Menschen getötet hat.[c]
  rationale: Die Revision ersetzt den altertümlichen und potenziell zu spezifischen Ausdruck »Beisassen« durch »bei ihnen Wohnende«. Dadurch bleibt die Unterscheidung der beiden hebräischen Begriffe sichtbar, ohne einen strittigen sozialen oder rechtlichen Status festzuschreiben. Die Zweckbeziehung von לָנוּס שָׁמָּה wird mit »damit ... fliehen kann« ausdrücklich und idiomatisch wiedergegeben; die Fußnote zu c wurde präzisiert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:52:21Z'
