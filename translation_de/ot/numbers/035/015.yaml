    rationale: Der Begriff ist heute überwiegend historisch-fachsprachlich und bezeichnet je nach Rechtsgeschichte einen besonderen Status. תּוֹשָׁב bedeutet zunächst eine bei der Gemeinschaft wohnende bzw. ansässige Person; seine genaue soziale Einordnung sollte nicht durch einen deutschen historischen Rechtsbegriff festgelegt werden.
  - severity: low
