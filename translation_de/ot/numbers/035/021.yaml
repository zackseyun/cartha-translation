id: NUM.35.21
reference: Numbers 35:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: de
  text: Oder wenn er ihn aus Feindschaft[a] mit der Hand schlug und er starb, muss der, der ihn geschlagen hat, unbedingt getötet werden; er ist ein Mörder. Der Bluträcher[b] soll den Mörder töten, wenn er auf ihn trifft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „aus Hass“ oder „in feindseliger Absicht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Rächer des Blutes“; gemeint ist der zur Sippe gehörende Rächer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: aus Feindschaft
  rationale: אֵיבָה bezeichnet Feindschaft, Hass oder feindselige Haltung. „Aus Feindschaft“ gibt die Präposition idiomatisch wieder und hebt im Rechtssatz die feindselige Absicht hervor.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: ihn mit der Hand schlug
  rationale: נכה ist der übliche Ausdruck für schlagen. Die ausdrückliche Angabe „mit der Hand“ bleibt erhalten, weil das Angriffsmittel zur rechtlichen Fallbeschreibung gehört.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: Die schlichte Satzfolge entspricht der hebräischen Erzählform und lässt den ursächlichen Zusammenhang im Kontext klar erkennen.
- source_word: מוֹת יוּמַת
  choice: muss ... unbedingt getötet werden
  rationale: Die Verbindung aus Infinitivus absolutus und passiver Verbform verstärkt die Todesbestimmung. „Muss ... unbedingt“ bewahrt sowohl den verpflichtenden als auch den emphatischen Charakter.
- source_word: הַמַּכֶּה
  choice: der, der ihn geschlagen hat
  rationale: Die substantivische Partizipialform bezeichnet den Täter, der den tödlichen Schlag ausgeführt hat. Die gewählte Formulierung ist im Deutschen natürlich und bleibt eng am Wortlaut.
- source_word: רֹצֵחַ הוּא
  choice: er ist ein Mörder
  rationale: Wegen der ausdrücklich genannten Feindschaft geht es hier um vorsätzliche Tötung, nicht um einen unbeabsichtigten Todesfall.
- source_word: גֹּאֵל הַדָּם
  choice: der Bluträcher
  rationale: „Bluträcher“ ist die knappe, etablierte deutsche Bezeichnung für dieses Rechtsamt und bewahrt die besondere israelitische Institution, ohne sie im Haupttext auszudeuten.
- source_word: יָמִית
  choice: soll ... töten
  rationale: Die kausative Verbform bezeichnet das Herbeiführen des Todes. „Soll ... töten“ gibt die rechtliche Anordnung direkt wieder und vermeidet eine unnötige Passivkonstruktion.
- source_word: בְּפִגְעוֹ בוֹ
  choice: wenn er auf ihn trifft
  rationale: Die Wendung bezeichnet das Antreffen oder Begegnen. „Wenn er auf ihn trifft“ ist natürliches modernes Deutsch und lässt die Umstände der Begegnung offen.
theological_decisions:
- issue: Rechtliche Einordnung der vorsätzlichen Tötung
  choice: Mörder
  alternative: Totschläger
  rationale: Der Kontext nennt Feindschaft als Beweggrund und grenzt diesen Fall dadurch von unabsichtlicher Tötung ab. „Mörder“ bringt die im Text ausgesprochene Schuldzuweisung deutlich zum Ausdruck, ohne zusätzliche Motive einzutragen.
- issue: Wiedergabe von גֹּאֵל הַדָּם
  choice: Bluträcher
  alternative: Rächer des Blutes; verwandtschaftlicher Bluträcher
  rationale: Die Übersetzung bewahrt die alttestamentliche Rechtsbezeichnung. Der verwandtschaftliche Hintergrund wird nicht in den Haupttext eingefügt, da er in der unmittelbaren Wortgruppe nicht ausdrücklich genannt ist, aber in einer Fußnote erläutert werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich klarer Satzführung. Die emphatische Todesformel wird durch „muss ... unbedingt“ wiedergegeben; die institutionelle Bezeichnung „Bluträcher“ bleibt bewusst knapp und quellenah.
