  terminology: „Entweihen“ ist hier als moralisch-sakrale Verunreinigung vertretbar und die parallele Wiederholung ist gut. „Sühnung“ eignet sich für כפר; im Haupttext vermeidet „möglich“ die agentive Nebenbedeutung von „erwirken“. „Blut dessen, der es vergossen hat“ gibt שֹׁפְכוֹ klar wieder, ohne den Täterbezug zu verwischen.
