source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: de
  text: Ihr sollt das Land, in dem ihr lebt, nicht entweihen; denn Blut entweiht das Land. Für das Land ist wegen des Blutes, das darin vergossen wurde, keine Sühnung möglich[a], außer durch das Blut dessen, der es vergossen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für das Land kann hinsichtlich des darin vergossenen Blutes keine Sühnung vollzogen werden.“'
    reason: Die hebräische Konstruktion verbindet die Sühnung des Landes eng mit dem darin vergossenen Blut; das genaue Verhältnis lässt sich im Deutschen unterschiedlich ausdrücken.
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: entweihen
  rationale: Das Verb bezeichnet hier eine durch Blutvergießen verursachte moralisch-sakrale Verunreinigung. „Entweihen“ bewahrt diese Dimension besser als das heute leicht ökologisch verstandene „verschmutzen“ und lässt sich an beiden Stellen gleich wiedergeben.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist das von Israel bewohnte Land, nicht allgemein die ganze Erde.
- source_word: אֲשֶׁר אַתֶּם בָּהּ
  choice: in dem ihr lebt
  rationale: Wörtlich „in dem ihr seid“; „lebt“ gibt den räumlichen Aufenthalt in natürlichem modernem Deutsch wieder.
- source_word: כִּי הַדָּם הוּא
  choice: denn Blut
  rationale: Das selbstständige Pronomen hebt „Blut“ hervor; die deutsche Wortstellung trägt den Nachdruck hinreichend, ohne das im Hebräischen nicht lexikalisch vorhandene „selbst“ einzufügen.
- source_word: יְכֻפַּר
  choice: Sühne erwirkt werden
  rationale: Das passive כפר bezeichnet hier die Beseitigung der auf dem Land liegenden Blutschuld. „Sühne“ bewahrt den kultisch-moralischen Gehalt und ist in diesem feierlich-rechtlichen Zusammenhang verständlich.
- source_word: שֻׁפַּךְ
  choice: vergossen wurde
  rationale: „Blut vergießen“ ist die übliche und sachlich genaue deutsche Wendung für tödliches Blutvergießen.
- source_word: כִּי אִם
  choice: außer durch
  rationale: Die Verbindung führt das einzige genannte Mittel beziehungsweise die einzige Ausnahme ein.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: durch das Blut dessen, der es vergossen hat
  rationale: Die Formulierung wahrt den Rückbezug des Pronomens auf das vergossene Blut und bezeichnet verständlich das Blut des Täters.
theological_decisions:
- issue: Verunreinigung des Landes durch Blutvergießen
  choice: Das Blutvergießen entweiht das Land in einem realen moralisch-sakralen Sinn; die dadurch entstandene Blutschuld wird nur durch das Blut des Täters gesühnt.
  alternative: Die Aussage könnte lediglich als Bild für gesellschaftliche Unordnung oder ausschließlich als Regel staatlicher Strafrechtspflege verstanden werden.
  rationale: Die Wiederholung von חנף sowie das kultisch geprägte כפר verbinden Recht, Land und Blutschuld. Die Übersetzung erhält diese Spannung, ohne über die Aussage des Verses hinaus eine spätere Sühnetheorie einzutragen.
- issue: Bezug von יְכֻפַּר
  choice: Das Land ist das von der Blutschuld betroffene und der Sühne bedürftige Bezugswort.
  alternative: 'Man könnte den Satz unpersönlicher wiedergeben: „Das vergossene Blut kann nicht gesühnt werden.“'
  rationale: Die hebräische Konstruktion stellt לָאָרֶץ („für das Land“) ausdrücklich voran und verbindet die Sühne mit dem darin vergossenen Blut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-sakralem Ton. Die Wiederholung „entweihen“ bildet die hebräische Wiederholung desselben Verbs ab. Der einzige Fußnotenmarker [a] steht unmittelbar bei der betreffenden Aussage im Haupttext.
