base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: de
  text: Befiehl den Israeliten[a], den Leviten aus ihrem erblichen Landbesitz Städte zum Wohnen zu geben; und das Weideland[b] rings um die Städte sollt ihr den Leviten geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“; gemeint sind die Israeliten als Volk.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet das offene Nutzland rings um eine Stadt, besonders für Weidewirtschaft und andere gemeinschaftliche Zwecke.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Befiehl
  rationale: Der Imperativ richtet sich an Mose und bezeichnet eine verbindliche Anordnung; „Befiehl“ bewahrt diese Aussagekraft.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung für das Volk Israel; die wörtliche Form „Söhne Israels“ wird in einer Fußnote kenntlich gemacht.
- source_word: וְנָתְנוּ
  choice: zu geben
  rationale: Nach dem einleitenden Befehl gibt die Infinitivkonstruktion im Deutschen den angeordneten Inhalt natürlich wieder.
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Direkte und eindeutige Wiedergabe des Empfängers.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: aus ihrem erblichen Landbesitz
  rationale: Die Formulierung gibt den rechtlichen Zusammenhang von Erbteil und Landbesitz knapp und idiomatisch wieder, ohne den Erbcharakter des Besitzes auszulassen.
- source_word: עָרִים לָשָׁבֶת
  choice: Städte zum Wohnen
  rationale: Der Infinitiv bezeichnet den Zweck; die Wendung ist in modernem Deutsch klar und natürlich.
- source_word: מִגְרָשׁ
  choice: Weideland
  rationale: Gemeint ist das unbebaute Nutzland im Umkreis einer Stadt, besonders für Viehhaltung; eine Fußnote weist auf den weiteren Bedeutungsumfang hin.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: rings um die Städte
  rationale: Die Wiedergabe bezeichnet klar das umliegende Land, das zu den genannten Städten gehört.
- source_word: תִּתְּנוּ
  choice: sollt ihr … geben
  rationale: Die zweite Person Plural wird ausdrücklich bewahrt und damit der Wechsel gegenüber der vorangehenden dritten Person erkennbar gehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den Wechsel von der indirekten Anweisung an die Israeliten zur direkten Anrede in der zweiten Person Plural. Das Semikolon hält beide Satzteile eng zusammen, ohne einen schwerfälligen Satzbau zu erzeugen.
