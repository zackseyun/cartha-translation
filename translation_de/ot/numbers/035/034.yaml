id: NUM.35.34
reference: Numbers 35:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: de
  text: Und ihr sollt das Land, in dem ihr wohnt, nicht verunreinigen, in dessen Mitte ich wohne; denn ich, Jahwe, wohne inmitten der Söhne Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „unter den Israeliten“ beziehungsweise „inmitten der Israeliten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְטַמֵּא
  choice: verunreinigen
  rationale: Das Piel von טמא bezeichnet hier das Unreinmachen in kultischer und moralischer Hinsicht. „Verunreinigen“ bewahrt diese Bedeutungsbreite besser als das heute oft rein ökologische „verschmutzen“.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist das Land, in dem Israel wohnt, nicht die ganze Erde.
- source_word: יֹשְׁבִים בָּהּ
  choice: in dem ihr wohnt
  rationale: Die Formulierung gibt den durativen Sinn des Partizips wieder und klingt im modernen Deutsch natürlich.
- source_word: שֹׁכֵן
  choice: wohne
  rationale: שכן bezeichnet das Wohnen beziehungsweise die bleibende Gegenwart. „Wohnen“ erhält den Zusammenhang zwischen dem Wohnen Israels und Gottes Wohnen im Land.
- source_word: בְּתוֹכָהּ
  choice: in dessen Mitte
  rationale: Die Wendung bewahrt die räumliche Betonung von תוך und die Verbindung zum vorausgehenden „Land“.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung für das Verbot ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: inmitten der Söhne Israels
  rationale: Die Übersetzung erhält sowohl die Wiederholung von תוך als auch die wörtliche, grammatisch maskuline Wendung בני ישראל; die geläufigere deutsche Form steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בני ישראל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die Hauptübersetzung bewahrt die Form des hebräischen Ausdrucks, ohne seine kollektive Bedeutung auf männliche Einzelpersonen zu beschränken; die idiomatische Alternative wird in einer Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Verben „wohnen“ und die Ausdrücke „in dessen Mitte/inmitten“ bilden die bewusste Wiederholung und die theologische Spannung des hebräischen Textes ab. Das Semikolon macht die Begründungsstruktur gut lesbar.
