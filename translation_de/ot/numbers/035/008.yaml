base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: de
  text: 'Die Städte, die ihr aus dem Landbesitz der Israeliten gebt: Von denen, die viel haben, sollt ihr mehr geben, und von denen, die wenig haben, weniger.[a] Jeder soll entsprechend seinem Erbteil, das sie erhalten,[b] den Leviten einige seiner Städte geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Vom Vielen sollt ihr vermehren, und vom Wenigen sollt ihr vermindern.“ Gemeint ist, dass aus größeren und kleineren Erbteilen verhältnismäßig mehr beziehungsweise weniger Städte gegeben werden sollen.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische verbindet die Einzahl „jeder … sein Erbteil“ mit der Mehrzahl „das sie erben/erhalten“. Der Plural kann sich auf die israelitischen Gruppen beziehen; im Zusammenhang sind insbesondere die Stämme gemeint.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft; „Städte“ entspricht dem festen Sprachgebrauch für die Levitenstädte in Numeri 35.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: dem Besitz der Israeliten
  rationale: אֲחֻזָּה bezeichnet erblichen Landbesitz; „Israeliten“ gibt die kollektive Bezeichnung בְּנֵי יִשְׂרָאֵל im heutigen Deutsch natürlich wieder.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: Von denen, die viel haben, sollt ihr mehr nehmen, und von denen, die wenig haben, weniger
  rationale: Der knappe hebräische Gegensatz lautet wörtlich „vom Vielen vermehrt, vom Wenigen vermindert“. Im Zusammenhang fordert er eine proportionale Zahl von Städten aus größeren beziehungsweise kleineren Erbteilen. „Nehmen“ verdeutlicht, dass es um die daraus zu bestimmenden Levitenstädte geht, ohne ausdrücklich „Stämme“ in diesen ersten Satzteil einzufügen.
- source_word: אִישׁ כְּפִי נַחֲלָתוֹ אֲשֶׁר יִנְחָלוּ
  choice: Jeder Stamm soll entsprechend dem Erbteil, das ihm zugeteilt wird
  rationale: אִישׁ ist distributiv („jeder“), während das pluralische יִנְחָלוּ auf die kollektiv angesprochenen israelitischen Gruppen zurückweist. Der Kontext macht die Stämme zum sachlichen Bezugspunkt; „zugeteilt wird“ gibt das Empfangen des Erbteils idiomatisch wieder und vermeidet einen unnatürlichen Numeruswechsel.
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: einige seiner Städte den Leviten geben
  rationale: Das partitive מִן wird natürlich mit „einige seiner Städte“ wiedergegeben; לַלְוִיִּם bezeichnet die Leviten als Empfänger.
