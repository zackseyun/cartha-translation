source:
  edition: WLC
  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: de
  text: 'Wer einen Menschen erschlägt: Aufgrund von Zeugenaussagen soll der Mörder getötet werden[a]. Ein einzelner Zeuge aber darf nicht gegen einen Menschen aussagen, sodass dieser zum Tod verurteilt wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach dem Mund von Zeugen“. Im Hebräischen gehören „Mörder“ und das Verb „getötet werden“ demselben Wortstamm an; hier bezeichnet das Verb die gerichtlich angeordnete Tötung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: wer einen Menschen erschlägt
  rationale: Die Wendung bezeichnet hier jemanden, der einem Menschen tödliche Gewalt antut. „Mensch“ gibt נֶפֶשׁ im rechtlichen Zusammenhang angemessen wieder; „erschlägt“ bewahrt den gewaltsamen Charakter.
- source_word: לְפִי עֵדִים
  choice: aufgrund der Aussage von Zeugen
  rationale: Die wörtliche Wendung „nach dem Mund von Zeugen“ ist eine Rechtsformel für eine Entscheidung auf der Grundlage ihrer Aussage.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: soll als Mörder … getötet werden
  rationale: Im Hebräischen stehen das Verb und „Mörder“ aus demselben Wortstamm. Die passive deutsche Form gibt die gerichtlich angeordnete Tötung wieder, ohne sie als rechtswidrigen Mord zu bezeichnen.
- source_word: וְעֵד אֶחָד
  choice: Ein einzelner Zeuge aber
  rationale: „Aber“ macht den sachlichen Gegensatz zwischen der Aussage von Zeugen und der unzureichenden Aussage nur eines Zeugen deutlich.
- source_word: לֹא יַעֲנֶה
  choice: darf nicht … aussagen
  rationale: ענה bezeichnet in diesem gerichtlichen Zusammenhang das Ablegen einer Zeugenaussage. „Darf nicht“ gibt die rechtliche Unzulässigkeit natürlich wieder.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: gegen einen Menschen aussagen, sodass dieser getötet wird
  rationale: Die knappe hebräische Rechtsformel verbindet die Aussage gegen eine Person mit der Todesfolge. Die Übersetzung wahrt diesen Zusammenhang, ohne eine zusätzliche Verfahrensform ausdrücklich einzutragen.
theological_decisions:
- issue: Beweisgrundlage in einem Fall mit Todesfolge
  choice: „aufgrund der Aussage von Zeugen“ im Gegensatz zu „ein einzelner Zeuge“
  alternative: „aufgrund der Aussage von mindestens zwei Zeugen“
  rationale: Der Plural und der ausdrückliche Ausschluss eines einzelnen Zeugen ergeben die erforderliche Mehrzahl, doch die Zahl „zwei“ steht in diesem Vers nicht ausdrücklich und wird daher nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Wiederaufnahme als „Mörder“ und die Todesfolge bleiben sichtbar; unnötige altertümliche Formulierungen wie „wider eine Seele zum Tode“ werden vermieden.
