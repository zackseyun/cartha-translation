  terminology: „Mensch“, „Mörder“, „Zeuge“ und „aussagen“ passen zum rechtlichen Kontext. „zum Tod verurteilt wird“ macht die im Kontext gerichtliche Todesfolge deutlich, ohne den hebräischen Ausdruck als rechtswidrige Tötung misszuverstehen.
