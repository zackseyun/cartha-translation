  register: Modernes, würdevolles Standarddeutsch. Die rechtlich-sachliche Aussage bleibt knapp; die funktionale Wiedergabe „Weideflächen“ wird durch eine Fußnote um den weiteren Bedeutungsumfang ergänzt.
