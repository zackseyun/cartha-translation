  text: וְ/הָי֧וּ הֶֽ/עָרִ֛ים לָ/הֶ֖ם לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֗ם יִהְי֤וּ לִ/בְהֶמְתָּ/ם֙ וְ/לִ/רְכֻשָׁ֔/ם וּ/לְ/כֹ֖ל חַיָּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: de
  text: Die Städte sollen ihnen als Wohnorte dienen, und ihre Weideflächen[a] sollen für ihr Vieh, ihren Besitz[b] und alle ihre Tiere bestimmt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Freiflächen“ beziehungsweise „offenes Umland“. Das hebräische Wort bezeichnet die offenen Flächen rings um die Städte, die hier besonders als Weideland genutzt werden.
    reason: lexical_alternative
  - marker: b
    text: Oder „ihre Habe“ beziehungsweise „ihre Besitztümer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft; im Zusammenhang der levitischen Städte ist „Städte“ die übliche und passende Wiedergabe.
- source_word: לָשָׁבֶת
  choice: zum Wohnen
  rationale: Der Infinitiv von ישׁב drückt hier den Zweck aus. „Zum Wohnen“ ist natürliches modernes Deutsch und bewahrt diesen Zwecksinn.
- source_word: מִגְרְשֵׁיהֶם
  choice: ihre Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene Umland einer Stadt, das hier besonders der Haltung und Beweidung von Tieren dient. „Weideflächen“ macht diese Funktion verständlich, während eine Fußnote den weiteren räumlichen Sinn nennt.
- source_word: לִבְהֶמְתָּם
  choice: für ihr Vieh
  rationale: בְּהֵמָה bezeichnet hier kollektiv domestizierte Nutztiere; „Vieh“ ist im Deutschen die natürliche Sammelbezeichnung.
- source_word: לִרְכֻשָׁם
  choice: ihren Besitz
  rationale: רְכוּשׁ bezeichnet Besitz beziehungsweise Habe. „Besitz“ wahrt den umfassenden, sachlich-rechtlichen Sinn.
- source_word: וּלְכֹל חַיָּתָם
  choice: und alle ihre Tiere
  rationale: חַיָּה bedeutet Lebewesen oder Tier. Nach der besonderen Nennung des Viehs erweitert die Formulierung den Bezug auf sämtliche Tiere; „Tiere“ ist klar und nicht altertümlich.
theological_decisions: []
