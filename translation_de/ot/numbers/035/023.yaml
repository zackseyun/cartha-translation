base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: de
  text: oder wenn er, ohne zu sehen[a], irgendeinen Stein, durch den jemand sterben könnte, auf ihn fallen lässt, sodass er stirbt, obwohl er nicht sein Feind war und ihm nichts Böses antun wollte –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ohne zu sehen“. Die Wendung nennt nicht, was genau nicht gesehen oder wahrgenommen wurde, und bezeichnet mangelnde Wahrnehmung oder Kenntnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: oder
  rationale: Setzt die Reihe der rechtlichen Fallvarianten mit einer einfachen disjunktiven Konjunktion fort.
- source_word: בְּכָל אֶבֶן
  choice: irgendeinen Stein
  rationale: כָל hat hier einen unbestimmten, weit gefassten Sinn; der instrumentale Zusammenhang wird im Deutschen durch die Konstruktion mit „fallen lässt“ natürlich ausgedrückt.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: durch den jemand sterben könnte
  rationale: Bezeichnet einen Stein, der tödlich sein kann. „Jemand“ gibt die generische dritte Person Singular im modernen Deutsch natürlich wieder.
- source_word: בְּלֹא רְאוֹת
  choice: ohne es zu sehen
  rationale: Bewahrt die konkrete hebräische Wendung, statt sie im Haupttext bereits als „unabsichtlich“ auszulegen; das Pronomen bezieht sich sinngemäß auf das Geschehen beziehungsweise die betroffene Person.
- source_word: וַיִּפֵּל עָלָיו
  choice: auf ihn fallen lässt
  rationale: 'Der Hifil von נפל ist kausativ: Der Handelnde bewirkt, dass der Stein auf den anderen fällt.'
- source_word: וַיָּמֹת
  choice: sodass er stirbt
  rationale: Gibt die tödliche Folge der Handlung in natürlichem deutschen Rechtssatzstil wieder.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: obwohl er nicht sein Feind war
  rationale: „Obwohl“ bringt den im Kontext naheliegenden konzessiv-erklärenden Sinn der mit וְ eingeleiteten Aussage zum Ausdruck.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: und ihm nichts Böses antun wollte
  rationale: רָעָה bezeichnet hier beabsichtigten Schaden. Die deutsche Wendung drückt fehlende Schädigungsabsicht idiomatisch aus, ohne allgemeine moralische Bosheit zu unterstellen.
