  text: וְ/אִם יָצֹ֥א יֵצֵ֖א הָ/רֹצֵ֑חַ אֶת גְּבוּל֙ עִ֣יר מִקְלָט֔/וֹ אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: de
  text: Wenn aber der Totschläger tatsächlich die Grenze seiner Zufluchtsstadt, in die er geflohen ist, überschreitet,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verbindet einen Infinitivus absolutus mit dem finiten Verb („hinausgehen geht er hinaus“), um das Hinausgehen nachdrücklich hervorzuheben.
    reason: Erklärt die mit „tatsächlich“ wiedergegebene hebräische Verstärkung und wahrt zugleich die ausdrücklich genannte Grenze.
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Leitet eine Bedingung ein, die zum vorausgehenden Rechtsfall in Kontrast steht; diese Wortstellung ist im modernen Deutschen natürlich.
- source_word: יָצֹא יֵצֵא
  choice: tatsächlich verlässt
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage. „tatsächlich“ gibt diese Betonung idiomatisch wieder.
- source_word: הָרֹצֵחַ
  choice: der Totschläger
  rationale: Im Zusammenhang der Zufluchtsstädte bezeichnet das Wort denjenigen, der einen Menschen getötet hat, ohne ihn notwendig als schuldigen Mörder einzustufen. „Totschläger“ wahrt diese kontextuelle Offenheit besser als „Mörder“.
- source_word: אֶת גְּבוּל
  choice: das Gebiet … verlässt
  rationale: Mit יצא bezeichnet die Wendung das Überschreiten beziehungsweise Verlassen der festgelegten Grenze. Natürliches Deutsch drückt dies durch das Verlassen des Gebietes aus.
- source_word: עִיר מִקְלָטוֹ
  choice: seiner Zufluchtsstadt
  rationale: Gibt den rechtlichen Begriff und das hebräische Possessivsuffix knapp und verständlich wieder.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: in die er geflohen ist
  rationale: שָׁמָּה enthält eine Richtungsangabe; „in die“ bewahrt sie. Das Perfekt ist in diesem deutschen Relativsatz natürlich und bezeichnet die vorausgehende Flucht.
theological_decisions:
- issue: Rechtlicher Status des הָרֹצֵחַ
  choice: Totschläger
  alternative: Mörder
  rationale: Der Vers setzt nicht voraus, dass vorsätzlicher Mord erwiesen ist. Die Übersetzung soll die im Zufluchtsstadtgesetz bestehende rechtliche Spannung nicht vorentscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich präziser Terminologie. Der Satz bleibt entsprechend dem hebräischen Vers und seinem Anschluss an Vers 27 syntaktisch offen.
