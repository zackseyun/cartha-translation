  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: de
  text: Wenn er ihn aber mit einem Gegenstand aus Eisen[a] schlägt und dieser stirbt, ist er ein Mörder. Der Mörder muss unbedingt getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit einem eisernen Werkzeug« beziehungsweise »mit einem eisernen Gerät«. Das hebräische Wort ist weit gefasst und bezeichnet hier nicht ausdrücklich eine bestimmte Waffe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Leitet innerhalb der fortlaufenden Rechtsfälle eine Bedingung mit abgrenzender Weiterführung ein; die deutsche Nachstellung von »aber« klingt natürlich.
- source_word: בִּכְלִי בַרְזֶל
  choice: mit einem Gegenstand aus Eisen
  rationale: כְּלִי bezeichnet breit einen Gegenstand, ein Gerät oder Werkzeug. »Gegenstand aus Eisen« vermeidet die unbelegte Festlegung auf ein Werkzeug oder eine ausdrücklich als solche bezeichnete Waffe.
- source_word: הִכָּהוּ
  choice: schlägt er ihn
  rationale: Die Hifil-Form von נכה bezeichnet hier das Schlagen einer Person; das Präsens entspricht dem üblichen deutschen Stil für kasuistisches Recht.
- source_word: וַיָּמֹת
  choice: und er stirbt
  rationale: Bewahrt die schlichte hebräische Abfolge, ohne die kausale Beziehung sprachlich stärker zu bestimmen, als es der Ausgangstext tut.
- source_word: רֹצֵחַ הוּא
  choice: ist er ein Mörder
  rationale: רצח stuft den Täter in diesem Rechtsfall als schuldigen Totschläger beziehungsweise Mörder ein; »Mörder« gibt die rechtliche und moralische Wertung prägnant wieder.
- source_word: מוֹת יוּמַת
  choice: muss unbedingt getötet werden
  rationale: Die Verbindung von Infinitivus absolutus und finiter Passivform verstärkt die verbindliche Todesstrafe; »muss unbedingt« bildet sowohl Verpflichtung als auch Nachdruck ab.
- source_word: הָרֹצֵחַ
  choice: der Mörder
  rationale: Die bestimmte Form greift die zuvor festgestellte rechtliche Einstufung des Täters wieder auf.
theological_decisions:
- issue: Rechtliche Einordnung von רצח
  choice: Mörder
  alternative: Totschläger
  rationale: Der Vers ordnet die Tötung mit einem eisernen Gegenstand als schuldhafte Tat ein und verbindet sie mit der Todesstrafe. »Mörder« wahrt diese ausdrückliche rechtlich-moralische Einstufung und grenzt sie von der im Kapitel behandelten unbeabsichtigten Tötung ab.
- issue: Wiedergabe der vorgeschriebenen Todesstrafe
  choice: muss unbedingt getötet werden
  alternative: soll gewiss getötet werden
  rationale: Die Formulierung gibt die emphatische hebräische Konstruktion als verbindliche Rechtsfolge wieder, ohne eine Aussage über heutige staatliche oder kirchliche Anwendung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch im Stil eines knappen Rechtssatzes. Das Präsens dient der allgemeinen Fallbeschreibung. Die Formulierung »Gegenstand aus Eisen« erhält die lexikalische Breite des Hebräischen; die Fußnote nennt engere, ebenfalls mögliche Wiedergaben.
