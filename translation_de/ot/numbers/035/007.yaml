  text: כָּל הֶ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה עִ֑יר אֶתְ/הֶ֖ן וְ/אֶת מִגְרְשֵׁי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: de
  text: Insgesamt sollt ihr den Leviten achtundvierzig Städte geben, samt ihren Weideflächen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeindeland“ beziehungsweise „Freiflächen“; gemeint ist das unbebaute Land rings um die Städte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים אֲשֶׁר תִּתְּנוּ
  choice: Insgesamt sollt ihr … Städte geben
  rationale: Die Formulierung gibt den Gesamtumfang der zuvor angeordneten Zuweisung natürlich wieder. Der hebräische Imperfekt bezeichnet hier im gesetzlichen Zusammenhang die verpflichtende Handlung.
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Bezeichnet eindeutig die Angehörigen des Stammes Levi als Empfänger.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: achtundvierzig Städte
  rationale: Die hebräische Zahlformel wird in natürlicher deutscher Wortstellung wiedergegeben; der deutsche Plural ist nach dieser Zahl erforderlich.
- source_word: אֶתְהֶן
  choice: Insgesamt
  rationale: Das resumptive Objektpronomen greift die Städte nochmals auf und unterstreicht ihre vollständige Zahl. Eine wörtliche Wiedergabe als „sie“ wäre im Deutschen schwerfällig; „Insgesamt“ bewahrt die zusammenfassende Funktion.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: samt ihren Weideflächen
  rationale: מִגְרָשׁ bezeichnet das unbebaute Nutzland im Umfeld einer Stadt, hier besonders als Weideland. „samt“ macht deutlich, dass diese Flächen zusammen mit den Städten zugewiesen werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die gesetzliche Verpflichtung wird mit „sollt ihr“ ausgedrückt; „Insgesamt“ vermeidet eine unnatürliche Nachbildung der hebräischen Wiederaufnahme und bewahrt deren summierende Betonung.
