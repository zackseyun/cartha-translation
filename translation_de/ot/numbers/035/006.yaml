  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: de
  text: Von den Städten, die ihr den Leviten geben sollt, sollt ihr sechs als Zufluchtsstädte bestimmen, damit derjenige, der einen Menschen getötet hat[a], dorthin fliehen kann; darüber hinaus sollt ihr zweiundvierzig Städte geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet hier jemanden, der einen Menschen getötet hat. Es legt an dieser Stelle nicht selbst fest, ob die Tötung vorsätzlich oder unabsichtlich geschah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עִיר kann Stadt oder Ortschaft bezeichnen; „Städte“ entspricht dem rechtlichen und territorialen Zusammenhang sowie dem üblichen deutschen Sprachgebrauch in diesem Abschnitt.
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Der hebräische Ausdruck bezeichnet eindeutig die Empfänger der Städte.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: sechs Zufluchtsstädte
  rationale: מִקְלָט bezeichnet Zuflucht beziehungsweise einen Schutzort; „Zufluchtsstädte“ ist im Deutschen eine präzise und etablierte Bezeichnung für diese Rechtseinrichtung.
- source_word: לָנוּס שָׁמָּה
  choice: dorthin fliehen kann
  rationale: נוּס bedeutet „fliehen“, und שָׁמָּה gibt die Richtung „dorthin“ an. Das ergänzte Modalverb macht den Zwecksatz im Deutschen natürlich verständlich.
- source_word: הָרֹצֵחַ
  choice: der Totschläger
  rationale: Das Wort bezeichnet hier eine Person, die einen Menschen getötet hat, ohne für sich allein zwischen vorsätzlicher und unabsichtlicher Tötung zu unterscheiden. „Totschläger“ bewahrt diese rechtliche Offenheit besser als „Mörder“.
- source_word: וַעֲלֵיהֶם
  choice: zusätzlich zu ihnen
  rationale: עַל drückt in dieser Verbindung eine Ergänzung aus, nicht eine räumliche Lage. „Zusätzlich zu ihnen“ stellt das Zahlenverhältnis klar dar.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: zweiundvierzig Städte
  rationale: Obwohl nach der Zahl im Hebräischen der Singular steht, verlangt natürliches Deutsch den Plural.
theological_decisions:
- issue: Rechtlicher Status des הָרֹצֵחַ
  choice: „Totschläger“ mit erklärender Fußnote, ohne die Absicht festzulegen
  alternative: „Mörder“ oder „jemand, der unabsichtlich getötet hat“
  rationale: Der Vers selbst legt weder Mordabsicht noch Unabsichtlichkeit fest. Die Übersetzung bewahrt diese für die Zufluchtsstadtgesetzgebung wichtige Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in drei Sätze gegliedert; Wiederholung, Zweckbeziehung und rechtliche Unbestimmtheit bleiben erhalten.
