  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: de
  text: Auch dürft ihr kein Lösegeld[a] dafür annehmen, dass jemand in seine Zufluchtsstadt flieht, damit er vor dem Tod des Priesters zurückkehren und wieder im Land wohnen kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ausgleichszahlung“ beziehungsweise „Loskaufpreis“. Das hebräische Wort bezeichnet eine Zahlung, die an die Stelle einer vorgeschriebenen Rechtsfolge treten soll.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Satz ist knapp und syntaktisch mehrdeutig. Er kann auch als Verbot einer Zahlung verstanden werden, die mit der Flucht in die Zufluchtsstadt, dem dortigen Aufenthalt oder der Rückkehr von dort vor dem Tod des Priesters zusammenhängt.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: Lösegeld
  rationale: Das Wort bezeichnet eine Ausgleichs- oder Loskaufzahlung, die an die Stelle einer vorgeschriebenen Rechtsfolge treten soll. „Lösegeld“ gibt diesen rechtlichen Sinn prägnant wieder; „Bestechungsgeld“ wäre zu wertend.
- source_word: לָנוּס אֶל עִיר מִקְלָטוֹ
  choice: für den, der in seine Zufluchtsstadt geflohen ist
  rationale: Der Infinitiv von נוּס bezeichnet das Fliehen. Im Zusammenhang der Zufluchtsstadt ist rückblickend der dorthin Geflohene gemeint; die Formulierung ist im Deutschen natürlich, ohne die Zielrichtung des hebräischen Ausdrucks zu verlieren.
- source_word: עִיר מִקְלָטוֹ
  choice: seine Zufluchtsstadt
  rationale: „Zufluchtsstadt“ ist die klare und eingebürgerte deutsche Bezeichnung für die rechtlich bestimmte Asylstadt; das Possessivsuffix wird mit „seine“ wiedergegeben.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: zurückkehren und wieder im Land wohnen
  rationale: Die beiden Infinitive drücken sowohl die Rückkehr als auch das erneute Wohnen im Land aus. „wieder“ macht den Wiederaufnahmecharakter von שׁוּב im Deutschen deutlich.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: vor dem Tod des Priesters
  rationale: Im Verbot ist gemeint, dass eine Zahlung keine vorzeitige Rückkehr ermöglichen darf. „vor dem Tod“ gibt diese zeitliche Grenze im Deutschen unmissverständlich wieder.
theological_decisions:
- issue: Reichweite des Verbots und syntaktische Zuordnung der Zahlung
  choice: Das Verbot wird als Untersagung einer Zahlung wiedergegeben, durch die der Geflohene vor dem Tod des Priesters zurückkehren und wieder im Land wohnen dürfte.
  alternative: Der kompakte hebräische Satz kann enger auf eine Zahlung im Zusammenhang mit der Flucht in die Zufluchtsstadt oder allgemeiner mit dem dortigen Aufenthalt und der Rückkehr bezogen werden.
  rationale: Die Hauptfassung folgt dem naheliegenden rechtlichen Zusammenhang mit der vorzeitigen Rückkehr, während die Fußnote die echte syntaktische Mehrdeutigkeit offenhält und keine engere Lehrdeutung festschreibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Sprache bleibt klar und allgemein verständlich; die im Hebräischen vorhandene syntaktische Spannung wird nicht stillschweigend beseitigt, sondern in einer Fußnote ausgewiesen.
