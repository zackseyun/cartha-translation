id: NUM.35.1
reference: Numbers 35:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: de
  text: 'Und Jahwe redete zu Mose in den Steppen Moabs am Jordan bei Jericho:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Die Waw-Folgeform eröffnet ein neues Redeereignis. „Redete“ gibt die feierliche Erzählformel natürlich wieder und lässt sich im Deutschen ohne ein zusätzliches „indem er sagte“ mit einem Doppelpunkt fortführen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen Form des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Übliche deutsche Namensform.
- source_word: בְּעַרְבֹת
  choice: in den Steppen
  rationale: עֲרָבוֹת bezeichnet die offenen, trockenen Ebenen beziehungsweise Steppengebiete. „Steppen“ ist geografisch präziser als das allgemeinere „Ebenen“ und im Deutschen verständlich.
- source_word: מוֹאָב
  choice: Moabs
  rationale: Die Genitivform bildet die hebräische Status-constructus-Verbindung עַרְבֹת מוֹאָב idiomatisch ab.
- source_word: עַל
  choice: am
  rationale: In der Ortsangabe bezeichnet עַל die Lage unmittelbar beim Jordan; „am“ ist dafür die natürliche deutsche Form.
- source_word: יַרְדֵּן
  choice: Jordan
  rationale: Übliche deutsche Form des Flussnamens; nach „am“ ist kein Zusatz „Fluss“ nötig.
- source_word: יְרֵחוֹ
  choice: bei Jericho
  rationale: Im Hebräischen steht der Ortsname appositionell zur Jordanangabe. „bei Jericho“ macht die räumliche Beziehung im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den folgenden Wortlaut ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als das schwerfällige „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen in der im Deutschen geläufigen wissenschaftlichen Umschrift, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die traditionelle Redeeinleitung bleibt erkennbar, wird aber durch einen Doppelpunkt idiomatisch ins Deutsche übertragen. „Steppen Moabs“ wahrt den geografischen Charakter des hebräischen Ausdrucks.
