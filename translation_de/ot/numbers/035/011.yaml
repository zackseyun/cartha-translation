  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: de
  text: Dann sollt ihr für euch Städte bestimmen[a]; sie sollen für euch Zufluchtsstädte sein. Dorthin soll fliehen, wer unabsichtlich einen Menschen getötet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Städte auswählen« beziehungsweise »Städte aussondern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: sollt ihr … bestimmen
  rationale: Das Hifil von קרה bezeichnet hier das Auswählen beziehungsweise Bestimmen bestimmter Städte. „Bestimmen“ ist im rechtlichen Zusammenhang natürlich und präzise.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: Städte … Zufluchtsstädte
  rationale: Die Wiederholung des hebräischen Begriffs für „Städte“ bleibt erhalten; „Zufluchtsstädte“ gibt die institutionelle Funktion von עָרֵי מִקְלָט knapp und verständlich wieder.
- source_word: מִקְלָט
  choice: Zuflucht
  rationale: Das Wort bezeichnet in diesem Rechtszusammenhang einen geschützten Fluchtort. Im Kompositum „Zufluchtsstädte“ ist dies idiomatisch und sachlich genau.
- source_word: וְנָס שָׁמָּה
  choice: Dorthin soll … fliehen
  rationale: Die Verbform hat in der rechtlichen Abfolge futurisch-normativen Sinn. „Soll … fliehen“ wahrt diesen, ohne bloße Möglichkeit oder absoluten Zwang überzubetonen.
- source_word: רֹצֵחַ
  choice: Totschläger
  rationale: Der unmittelbar folgende Zusatz בִּשְׁגָגָה schließt vorsätzlichen Mord aus. „Totschläger“ bezeichnet hier denjenigen, der einen Menschen getötet hat, ohne ihn als „Mörder“ zu klassifizieren; die heutige deutsche strafrechtliche Spezialbedeutung wird in einer Fußnote eingegrenzt.
- source_word: מַכֵּה נֶפֶשׁ
  choice: der … einen Menschen getötet hat
  rationale: Wörtlich geht es um jemanden, der eine Person beziehungsweise ein Leben schlägt. Im Zusammenhang ist der tödliche Ausgang gemeint; „getötet hat“ ist im Deutschen klarer als eine bildhafte Wiedergabe mit „niederschlagen“.
- source_word: נֶפֶשׁ
  choice: einen Menschen
  rationale: נֶפֶשׁ bezeichnet hier die menschliche Person als Opfer tödlicher Gewalt, nicht eine vom Körper getrennte Seele.
- source_word: בִּשְׁגָגָה
  choice: unabsichtlich
  rationale: Der Ausdruck bezeichnet fehlende Absicht beziehungsweise ein Versehen und markiert die rechtliche Abgrenzung von vorsätzlicher Tötung.
theological_decisions:
- issue: Rechtliche und moralische Einordnung des Tötenden
  choice: רֹצֵחַ wird als „Totschläger“ wiedergegeben und ausdrücklich durch „unabsichtlich“ qualifiziert.
  alternative: „Mörder“ oder das neutralere „jemand, der einen Menschen getötet hat“
  rationale: „Mörder“ würde Vorsatz und Schuld über den Wortlaut hinaus eintragen. Die gewählte Form bewahrt sowohl die Bezeichnung des Tötenden als auch die ausdrückliche Einschränkung, dass die Tötung unabsichtlich geschah.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die hebräische Wiederholung „Städte … Zufluchtsstädte“ bleibt erhalten. „Totschläger“ wahrt die substantivische Täterbezeichnung, wird aber wegen möglicher moderner strafrechtlicher Missverständnisse erläutert.
