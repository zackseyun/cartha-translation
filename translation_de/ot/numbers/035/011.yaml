revisions:
- from: Dann sollt ihr für euch Städte bestimmen[a]; sie sollen für euch Zufluchtsstädte sein. Dorthin soll ein Totschläger fliehen, der unabsichtlich einen Menschen getötet hat.[b]
  to: Dann sollt ihr für euch Städte bestimmen[a]; sie sollen für euch Zufluchtsstädte sein. Dorthin soll fliehen, wer unabsichtlich einen Menschen getötet hat.
  rationale: Die juristisch belastete und im gegenwärtigen Deutsch mit Vorsatz verbundene Bezeichnung „Totschläger“ wurde durch eine neutrale Personenumschreibung ersetzt. Diese gibt רֹצֵחַ zusammen mit der unmittelbar folgenden Bestimmung „der unabsichtlich einen Menschen getötet hat“ kontextgerecht wieder, ohne eine moderne strafrechtliche Kategorie oder weitergehende Schuldzuweisung einzutragen. Die dadurch überflüssige erläuternde Fußnote b wurde entfernt; Fußnote a bleibt am passenden Anker erhalten.
