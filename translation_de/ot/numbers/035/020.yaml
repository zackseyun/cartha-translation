  text: וְ/אִם בְּ/שִׂנְאָ֖ה יֶהְדָּפֶ֑/נּוּ אֽוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו בִּ/צְדִיָּ֖ה וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: de
  text: Wenn er ihn aber aus Hass stößt oder in feindlicher Absicht[a] etwas gegen ihn wirft und er stirbt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während er ihm auflauert“. Der hebräische Ausdruck bezeichnet eine vorsätzliche, feindselige Handlung und kann auch den Gedanken eines Hinterhalts einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Leitet einen Bedingungsfall ein, der im Gegensatz zum vorherigen, unbeabsichtigten Geschehen steht; die deutsche Wortstellung gibt diesen Gegensatz natürlich wieder.
- source_word: בְּשִׂנְאָה
  choice: aus Hass
  rationale: Die Präposition mit dem Substantiv bezeichnet hier das feindselige Motiv. „Aus Hass“ ist im modernen Deutsch natürlicher als das formal nähere „in Hass“.
- source_word: יֶהְדָּפֶנּוּ
  choice: er ihn … stößt
  rationale: Das Verb bezeichnet Stoßen oder Wegdrängen. „Stößt“ wahrt die Breite des Ausdrucks, ohne eine Schlaghandlung hinzuzufügen.
- source_word: אוֹ
  choice: oder
  rationale: Gibt die einfache disjunktive Verbindung der alternativen Handlung wieder.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: ihm … etwas zuwirft
  rationale: Das hebräische Verb bedeutet „werfen“; sein Gegenstand bleibt unausgesprochen und wird im Deutschen zur Verständlichkeit mit „etwas“ ergänzt. „Zuwirft“ bezeichnet hier das gegen die Person gerichtete Werfen.
- source_word: בִּצְדִיָּה
  choice: in feindlicher Absicht
  rationale: Der seltene Ausdruck bezeichnet vorsätzlich-feindseliges Handeln und kann auch das Auflauern einschließen. Die Wiedergabe bewahrt sowohl Vorsatz als auch feindliche Zielrichtung, ohne die mögliche Ambush-Nuance zum alleinigen Sinn zu machen.
- source_word: וַיָּמֹת
  choice: und er stirbt
  rationale: Gibt die erzählte Folge knapp und entsprechend dem deutschen Tempusgebrauch in Rechtssätzen wieder.
