  source_fidelity: Der Entwurf trifft den rückverweisenden Plural אֵלֶּה, den dauerhaften Geltungsanspruch und den umfassenden örtlichen Bereich grundsätzlich. „Überall, wo ihr wohnt“ ist jedoch freier als das ausdrücklich lokative „in allen euren Wohnorten“. „Rechtsordnung“ ist als Wiedergabe von חֻקַּת מִשְׁפָּט vertretbar, sollte aber nicht durch „verbindliche“ zusätzlich verstärkt werden, da die Verbindlichkeit bereits aus der Rechtsformel hervorgeht.
  naturalness: Die revidierte Formulierung bleibt modernes, würdevolles Standarddeutsch. „In allen euren Wohnorten“ ist etwas formeller als die Ausgangsfassung, passt jedoch zum Rechtsregister und bildet den hebräischen Ausdruck präzise ab.
