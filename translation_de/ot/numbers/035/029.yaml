  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: de
  text: Diese Bestimmungen sollen euch für alle eure Generationen in allen euren Wohnorten als Rechtsordnung dienen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »als Satzung des Rechts«; die hebräische Wendung verbindet eine festgesetzte Satzung mit Rechtsprechung beziehungsweise gerichtlichem Verfahren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in allen euren Siedlungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ אֵלֶּה לָכֶם
  choice: Diese Bestimmungen sollen euch … dienen
  rationale: Das Demonstrativpronomen verweist auf die vorausgehenden Rechtsvorschriften. Die deutsche Formulierung gibt den vorschreibenden und dauerhaft geltenden Sinn natürlich wieder.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: als verbindliche Rechtsordnung
  rationale: Die hebräische Wortverbindung vereint eine festgesetzte Satzung mit Rechtsprechung beziehungsweise gerichtlichem Verfahren. „Verbindliche Rechtsordnung“ bildet beide Aspekte in verständlichem modernem Deutsch ab.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Die Wendung bezeichnet die fortdauernde Geltung über die aufeinanderfolgenden Generationen hinweg.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: überall, wo ihr wohnt
  rationale: Dies gibt den umfassenden örtlichen Geltungsbereich idiomatisch wieder, ohne den Begriff unnötig auf organisierte Siedlungen zu verengen.
