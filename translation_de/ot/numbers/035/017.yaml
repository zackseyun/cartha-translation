source:
  edition: WLC
  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: de
  text: Oder wenn er ihn mit einem Stein in der Hand[a], durch den man sterben kann, schlägt und er stirbt, dann ist er ein Mörder. Der Mörder muss gewiss getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit einem Stein der Hand“, das heißt mit einem in der Hand gehaltenen oder als Handwaffe geeigneten Stein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Oder wenn
  rationale: Leitet in der kasuistischen Gesetzesfolge einen weiteren möglichen Fall ein; „Oder wenn“ gibt den anschließenden Charakter im Deutschen natürlich wieder.
- source_word: בְּאֶבֶן יָד
  choice: mit einem Stein in der Hand
  rationale: Bewahrt die konkrete, wörtlich ungewöhnliche Wendung „Stein der Hand“ und bezeichnet einen in der Hand gehaltenen beziehungsweise als Handwaffe geeigneten Stein, ohne dessen Größe näher festzulegen.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: durch den man sterben kann
  rationale: Beschreibt das tödliche Potenzial des Steins. Das unpersönliche „man“ vermeidet eine unnötige Beschränkung auf das konkrete Opfer.
- source_word: הִכָּהוּ
  choice: schlägt
  rationale: Gibt נכה sachlich als „schlagen“ wieder; die Todesfolge wird erst im folgenden Satzglied ausdrücklich genannt.
- source_word: וַיָּמֹת
  choice: und er stirbt
  rationale: Erhält die schlichte hebräische Abfolge, ohne zusätzlich eine ausdrücklich kausale Beziehung zu formulieren.
- source_word: רֹצֵחַ הוּא
  choice: dann ist er ein Mörder
  rationale: רצח bezeichnet hier im rechtlichen Zusammenhang schuldhafte Tötung. „Mörder“ bewahrt die juristische und moralische Einstufung.
- source_word: מוֹת יוּמַת
  choice: muss mit dem Tod bestraft werden
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb drückt eine nachdrückliche, verbindliche Todesstrafe aus. Die Formulierung ist verständlich und würdevoll, ohne eine konkrete Hinrichtungsart hinzuzufügen.
- source_word: הָרֹצֵחַ
  choice: der Mörder
  rationale: Bewahrt die nachdrückliche Wiederholung des Substantivs im Hebräischen.
theological_decisions:
- issue: Rechtliche Einstufung des Tötenden im Zusammenhang der Zufluchtsstädte
  choice: רצח wird mit „Mörder“ wiedergegeben.
  alternative: „Totschläger“ oder „Tötender“
  rationale: Der Zusammenhang unterscheidet schuldhafte Tötung von unbeabsichtigter Tötung. „Mörder“ gibt das rechtliche und moralische Urteil des Verses wieder, ohne eine spätere konfessionelle Deutung einzutragen.
- issue: Nachdrücklichkeit der Todesstrafe in מוֹת יוּמַת
  choice: „muss mit dem Tod bestraft werden“
  alternative: „soll gewiss getötet werden“
  rationale: Die gewählte Formulierung bewahrt den verpflichtenden und emphatischen Charakter der hebräischen Konstruktion, klingt im modernen Standarddeutsch jedoch natürlicher.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die kasuistische Gesetzesform und die Wiederholung von „Mörder“ bleiben erhalten; die ungewöhnliche hebräische Wendung wird im Text relativ eng wiedergegeben und in der Fußnote erläutert.
