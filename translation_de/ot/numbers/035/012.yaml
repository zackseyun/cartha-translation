base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: de
  text: Die Städte sollen euch als Zufluchtsorte vor dem Bluträcher[a] dienen, damit derjenige, der getötet hat, nicht stirbt, bis er vor der Gemeinde zum Gericht tritt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Löser“ oder „Verwandter, der Rache übt“ bedeuten. Hier bezeichnet es den nahen Verwandten, der das vergossene Blut rächt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ לָכֶם הֶעָרִים לְמִקְלָט
  choice: Die Städte sollen euch als Zuflucht ... dienen
  rationale: Die perfektive Form hat in der Rechtsanweisung futurisch-vorschreibende Kraft. „Als Zuflucht dienen“ gibt die hebräische Konstruktion natürlich und würdevoll wieder.
- source_word: מִגֹּאֵל
  choice: vor dem Bluträcher
  rationale: גֹאֵל bezeichnet grundsätzlich einen nahen Verwandten mit Einlösungs- oder Schutzpflichten, hier jedoch konkret denjenigen, der vergossenes Blut rächt. „Bluträcher“ macht diese Funktion im Kontext präzise kenntlich.
- source_word: וְלֹא יָמוּת
  choice: damit ... nicht stirbt
  rationale: Die Verbindung drückt hier den Zweck beziehungsweise die beabsichtigte Folge der Zufluchtsregelung aus. Die Formulierung lässt offen, durch wessen Hand der Tod eintreten würde.
- source_word: הָרֹצֵחַ
  choice: der Totschläger
  rationale: רֹצֵחַ bezeichnet hier den Menschen, der jemanden getötet hat, ohne vor der gerichtlichen Klärung bereits vorsätzlichen Mord festzustellen. „Totschläger“ ist im Deutschen verständlich und weniger vorverurteilend als „Mörder“, kann jedoch moderne strafrechtliche Nebenbedeutungen wecken; dies wird in der Fußnote erläutert.
- source_word: עַד עָמְדוֹ
  choice: bevor er ... gestanden hat
  rationale: Der Infinitiv mit Suffix nach עַד bildet eine zeitliche Grenze. Im Deutschen ist in der verneinten Matrix „bevor“ idiomatisch und gibt den Sinn von „nicht ... bis“ klar wieder.
- source_word: לִפְנֵי הָעֵדָה
  choice: vor der Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft, die hier eine richterliche Aufgabe wahrnimmt. „Gemeinde“ bewahrt den gemeinschaftlichen Charakter, ohne eine moderne staatliche Gerichtsinstanz einzutragen.
- source_word: לַמִּשְׁפָּט
  choice: zum Gericht
  rationale: מִשְׁפָּט meint hier das gerichtliche Verfahren beziehungsweise Urteil. „Zum Gericht“ ist knapp und lässt den Umfang des Rechtsvorgangs offen.
theological_decisions:
- issue: Rechtlicher Status des Täters vor der Entscheidung der Gemeinde
  choice: „Totschläger“ statt „Mörder“
  alternative: „Mörder“ oder „der, der getötet hat“
  rationale: Der Vers setzt die gerichtliche Beurteilung noch voraus. „Mörder“ würde Schuld und Vorsatz vorwegnehmen; die gewählte Bezeichnung wahrt den noch ungeklärten Status, während die Fußnote vor einer Gleichsetzung mit der heutigen deutschen Straftatbestandsbezeichnung schützt.
- issue: Bedeutungsumfang von גֹאֵל im Tötungsrecht
  choice: „Bluträcher“ im Haupttext mit erläuternder Fußnote
  alternative: „Rächer“, „Löser-Rächer“ oder „verwandter Rächer“
  rationale: Im vorliegenden Zusammenhang ist die Blutrache die konkrete Funktion. Die Fußnote erhält zugleich die im hebräischen Wort enthaltene Verwandtschaftsdimension, ohne andere Erlöser- oder Löserkonnotationen unpassend in den Satz zu tragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Rechtsregister. Der Satzbau bleibt nahe an der hebräischen Zweck- und Zeitstruktur. „Totschläger“ wird nicht im engen Sinn des heutigen deutschen Strafrechts verwendet; die Formulierung soll keine Schuldentscheidung vorwegnehmen.
