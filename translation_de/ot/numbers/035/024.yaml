  text: וְ/שָֽׁפְטוּ֙ הָֽ/עֵדָ֔ה בֵּ֚ין הַ/מַּכֶּ֔ה וּ/בֵ֖ין גֹּאֵ֣ל הַ/דָּ֑ם עַ֥ל הַ/מִּשְׁפָּטִ֖ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/024.yaml
  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: de
  text: Dann soll die Gemeinde zwischen dem, der zugeschlagen hat, und dem Bluträcher[a] nach diesen Rechtsbestimmungen[b] urteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Rächer des Blutes«. Der hebräische Ausdruck bezeichnet den Angehörigen, dem die Aufgabe zukam, das Blut eines getöteten Verwandten zu rächen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »nach diesen Rechtssätzen« oder »nach diesen Rechtsentscheidungen«. Das hebräische Wort kann rechtliche Bestimmungen wie auch richterliche Entscheidungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Dann soll ... urteilen
  rationale: Die Form mit וְ führt im gesetzlichen Ablauf zum nächsten Verfahrensschritt; „soll ... urteilen“ gibt zugleich die richterliche Funktion von שׁפט wieder.
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels in ihrer gemeinschaftlich-richterlichen Funktion. „Gemeinde“ bewahrt den korporativen und formellen Sinn.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und
  rationale: Die im Hebräischen wiederholte Präposition wird im natürlichen Deutschen mit „zwischen ... und“ wiedergegeben.
- source_word: הַמַּכֶּה
  choice: dem, der zugeschlagen hat
  rationale: Das substantivierte Partizip bezeichnet denjenigen, der den tödlichen Schlag geführt hat. Die Formulierung bleibt näher am Verb als die rechtlich stärker festlegenden Wörter „Totschläger“ oder „Mörder“ und ergänzt kein im Vers ausdrücklich genanntes Objekt.
- source_word: גֹּאֵל הַדָּם
  choice: dem Bluträcher
  rationale: „Bluträcher“ ist die knappe, im Deutschen verständliche Bezeichnung für die rechtliche Rolle dessen, der das Blut eines Angehörigen rächt; die Fußnote erläutert den idiomatischen Ausdruck.
- source_word: עַל
  choice: nach
  rationale: Im rechtlichen Zusammenhang bezeichnet עַל den Maßstab, nach dem das Urteil ergeht. „Nach“ ist dafür im Deutschen natürlich und präzise.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: diesen Rechtsbestimmungen
  rationale: מִשְׁפָּטִים kann rechtliche Entscheidungen, Rechtssätze oder Bestimmungen bezeichnen. „Rechtsbestimmungen“ macht hier deutlich, dass die zuvor genannten Regeln den Maßstab des Verfahrens bilden, ohne die Bedeutung auf bloße Urteile zu verengen.
theological_decisions:
- issue: Richterliche Rolle der Gemeinde bei der Beurteilung einer Tötung
  choice: Die Gemeinde urteilt verfahrensmäßig zwischen demjenigen, der zugeschlagen hat, und dem Bluträcher.
  alternative: Die Gemeinde als engeres Gerichtsgremium zu deuten oder den Schlagenden bereits als „Mörder“ beziehungsweise „Totschläger“ zu bezeichnen.
  rationale: Der hebräische Text weist der עֵדָה eine richterliche Aufgabe zu, legt in diesem Vers aber weder ihre genaue institutionelle Zusammensetzung fest noch erklärt er den Beschuldigten bereits zum vorsätzlichen Mörder. Die Übersetzung wahrt diese Verfahrensneutralität.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit formellem Rechtsregister. „Gemeinde“ entspricht dem korporativen Charakter von עֵדָה; „dem, der zugeschlagen hat“ vermeidet eine vorweggenommene rechtliche Schuldzuweisung.
