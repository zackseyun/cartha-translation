source:
  edition: WLC
  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: de
  text: Ihr sollt kein Lösegeld für das Leben eines Mörders annehmen, der des Todes schuldig ist; denn er muss gewiss getötet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »denn sterben muss er«; das finite Verb ist passiv: »er wird getötet werden«. Die Verbindung eines Infinitivs mit dem Verb betont die Gewissheit und Verbindlichkeit der Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: annehmen
  rationale: Im rechtlichen Zusammenhang mit כֹּפֶר bezeichnet das Verb nicht bloß das Nehmen, sondern die Annahme einer Zahlung.
- source_word: כֹּפֶר
  choice: Lösegeld
  rationale: Das Wort bezeichnet eine Zahlung, durch die eine Strafe abgewendet oder eine Freilassung erwirkt werden soll. »Lösegeld« bewahrt hier den Gedanken, das Leben durch Zahlung auszulösen.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: für das Leben eines Mörders
  rationale: נֶפֶשׁ kann »Leben« oder »Person« bedeuten. Im Kontext geht es um eine Zahlung, die das Leben des Mörders verschonen soll.
- source_word: רֹצֵחַ
  choice: Mörder
  rationale: Das Kapitel unterscheidet unabsichtliche Tötung von schuldhafter Tötung; hier ist ausdrücklich ein zum Tod verpflichteter Täter gemeint.
- source_word: רָשָׁע לָמוּת
  choice: der den Tod verdient hat
  rationale: Die Wendung hat gerichtlichen Sinn und bezeichnet die Schuld beziehungsweise Strafwürdigkeit des Täters. Die Formulierung ist im heutigen Deutsch klarer als »des Todes schuldig«.
- source_word: כִּי מוֹת יוּמָת
  choice: er muss unbedingt getötet werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Verpflichtung beziehungsweise Gewissheit. »Unbedingt« gibt diese Emphase natürlich wieder.
theological_decisions:
- issue: Rechtsverbindlichkeit des Todesurteils
  choice: Der Vers verbietet verbindlich, die Todesstrafe eines schuldigen Mörders gegen Zahlung umzuwandeln.
  alternative: Der Vers beschreibt lediglich eine übliche Rechtspraxis ohne strenge Vorschriftskraft.
  rationale: Das Verbot לֹא תִקְחוּ und die emphatische Wendung מוֹת יוּמָת kennzeichnen eine bindende Rechtsvorschrift.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ihr dürft nicht« gibt das direkte Verbot natürlich wieder; »Lösegeld« und »für das Leben« halten die rechtliche Bildsprache des Hebräischen fest.
