  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִגְרְשֵׁי֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/לְוִיִּ֑ם מִ/קִּ֤יר הָ/עִיר֙ וָ/ח֔וּצָ/ה אֶ֥לֶף אַמָּ֖ה סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: de
  text: Und die Weideflächen der Städte, die ihr den Leviten gebt, sollen sich von der Stadtmauer nach außen tausend Ellen weit ringsum erstrecken.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeindeland“ beziehungsweise „Freiflächen“ für das Land rings um die Städte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von der Mauer der Stadt“; manche verstehen dies allgemeiner als „von der Stadtgrenze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: Weideflächen
  rationale: Das Wort bezeichnet hier das offene Nutzland um die levitischen Städte. „Weideflächen“ gibt seine praktische Funktion verständlich wieder; der weitere Bedeutungsumfang wird in einer Fußnote genannt.
- source_word: הֶעָרִים
  choice: der Städte
  rationale: עִיר kann Stadt oder Ortschaft bedeuten; „Städte“ entspricht dem Kontext der Levitenstädte und ist im Abschnitt konsistent.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: die ihr … gebt
  rationale: Die Formulierung gibt den Relativsatz natürlich wieder und bewahrt im gesetzlichen Kontext den Anweisungscharakter.
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Dies bezeichnet unmittelbar die Empfänger der Städte und der zugehörigen Flächen.
- source_word: מִקִּיר הָעִיר
  choice: von der Stadtmauer
  rationale: קִיר bedeutet gewöhnlich „Mauer“. Die kompakte Formulierung ist im Deutschen natürlich; eine mögliche allgemeinere Auffassung als Stadtgrenze wird in einer Fußnote festgehalten.
- source_word: וָחוּצָה
  choice: nach außen
  rationale: Die Richtungsform wird im Deutschen idiomatisch mit „nach außen“ wiedergegeben.
- source_word: אֶלֶף אַמָּה
  choice: tausend Ellen weit
  rationale: Die antike Maßeinheit bleibt erhalten. „weit“ verdeutlicht natürlich, dass es sich um die räumliche Ausdehnung vom Ausgangspunkt aus handelt.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ drückt knapp aus, dass die Abmessung die Stadt auf allen Seiten betrifft.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „sollen sich … erstrecken“ die im nominalen hebräischen Satz gemeinte räumliche Ausdehnung natürlich ausdrückt. Die Fußnoten bewahren die lexikalische Spannweite und die mögliche Deutung des Messpunkts.
