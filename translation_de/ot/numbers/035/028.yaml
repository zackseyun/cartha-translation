  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: de
  text: Denn er muss in seiner Zufluchtsstadt bis zum Tod des Hohepriesters bleiben. Nach dem Tod des Hohepriesters darf der, der getötet hat[a], auf seinen eigenen Landbesitz[b] zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Tötende“. Der hebräische Ausdruck bezeichnet hier eine rechtliche Kategorie im Gesetz über die Zufluchtsstädte und bedeutet nicht automatisch „Mörder“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in das Land seines Eigentums“ oder „auf seinen eigenen Grundbesitz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Rechtsfolge. „Denn“ gibt diese erklärende Funktion am Satzanfang im Deutschen natürlich wieder.
- source_word: בְעִיר מִקְלָטוֹ
  choice: in seiner Zufluchtsstadt
  rationale: Die Wendung bezeichnet die dem Betreffenden zugewiesene Stadt, die als Zufluchtsort dient. „Zufluchtsstadt“ ist im Deutschen prägnant und entspricht dem rechtlichen Begriff.
- source_word: יֵשֵׁב
  choice: muss … bleiben
  rationale: Das Verb bedeutet grundsätzlich „sitzen, wohnen, bleiben“, hat hier im Gesetzeskontext aber verpflichtende Kraft. „Muss bleiben“ macht sowohl den Aufenthalt als auch die rechtliche Bindung deutlich.
- source_word: עַד מוֹת
  choice: bis zum Tod
  rationale: Die nominale hebräische Konstruktion wird bewahrt und klingt im Deutschen natürlich.
- source_word: הַכֹּהֵן הַגָּדֹל
  choice: der Hohe Priester
  rationale: Dies ist die etablierte deutsche Bezeichnung des Amtes. Die Großschreibung kennzeichnet den festen Amtstitel.
- source_word: וְאַחֲרֵי מוֹת
  choice: Nach dem Tod
  rationale: Die zeitliche Abfolge und die im Hebräischen wiederholte nominale Formulierung werden beibehalten. Die Verbindung mit „und“ muss im Deutschen nach dem Satzpunkt nicht eigens wiedergegeben werden.
- source_word: הָרֹצֵחַ
  choice: der Totschläger
  rationale: Der Ausdruck bezeichnet hier eine rechtliche Kategorie für jemanden, der einen Menschen getötet hat. „Totschläger“ vermeidet die in diesem Zusammenhang zu enge Festlegung auf vorsätzlichen Mord.
- source_word: יָשׁוּב
  choice: darf … zurückkehren
  rationale: Das Verb bedeutet „zurückkehren“. Im Kontext wird nach einer zuvor geltenden Beschränkung die Rückkehr rechtlich wieder ermöglicht; „darf“ bringt diese Erlaubnis angemessen zum Ausdruck.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: in das Land seines Besitzes
  rationale: אֲחֻזָּה bezeichnet einen dauerhaften Land- oder Grundbesitz. Die Formulierung bewahrt den rechtlichen Besitzaspekt, ohne den stärker theologisch geprägten Begriff „Erbteil“ einzutragen.
theological_decisions:
- issue: Ob הָרֹצֵחַ als „Mörder“ oder mit einem moralisch weniger festlegenden Rechtsbegriff wiederzugeben ist
  choice: der Totschläger
  alternative: derjenige, der getötet hat; der Täter; der Mörder
  rationale: Das Gesetz über die Zufluchtsstädte unterscheidet Mord von anderen Fällen der Tötung. „Mörder“ würde hier ein Urteil vorwegnehmen, das der Vers selbst nicht ausspricht. „Totschläger“ hält die rechtliche Kategorie offen, während die Fußnote eine noch neutralere Wiedergabe nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Wiederholung von „Tod des Hohen Priesters“ bleibt entsprechend der hebräischen Gesetzesformulierung erhalten. Der lange hebräische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
