source:
  edition: WLC
  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: de
  text: Wenn er ihn aber plötzlich und ohne Feindschaft stößt oder irgendeinen Gegenstand nach ihm wirft, ohne ihm aufzulauern[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Hinterhalt“; sinngemäß auch: „ohne vorherige Absicht“. Wörtlich geht es darum, dass er ihm nicht aufgelauert hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn ... aber
  rationale: Leitet gegenüber den vorangehenden Fällen einen kontrastierenden Bedingungssatz ein und klingt im Deutschen natürlich.
- source_word: בְּפֶתַע
  choice: plötzlich
  rationale: Gibt die unvermittelte, abrupte Art des Geschehens knapp und idiomatisch wieder.
- source_word: בְּלֹא אֵיבָה
  choice: ohne Feindschaft
  rationale: אֵיבָה bezeichnet persönliche Feindschaft oder feindselige Gesinnung; „Feindschaft“ bewahrt diesen zwischenmenschlichen Sinn.
- source_word: הֲדָפוֹ
  choice: ihn ... stößt
  rationale: Das Verb bezeichnet ein Stoßen oder Wegdrängen; „stößt“ ist im rechtlichen Zusammenhang klar und nicht unnötig deutend.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: nach ihm wirft
  rationale: Die Verbindung aus „werfen“ und עַל bezeichnet hier das Werfen eines Gegenstands auf die betreffende Person zu.
- source_word: כָּל כְּלִי
  choice: irgendeinen Gegenstand
  rationale: כְּלִי ist ein weiter Begriff für Gegenstand, Gerät oder Utensil; „Gegenstand“ hält die Formulierung allgemein.
- source_word: בְּלֹא צְדִיָּה
  choice: ohne ihm aufzulauern
  rationale: Bewahrt das konkrete Bild des Auflauerns und vermeidet, den Ausdruck vorschnell mit dem weiter gefassten modernen Rechtsbegriff „Vorsatz“ gleichzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich klarer Satzstruktur. Die Wiederholung von „ohne“ entspricht den beiden getrennten Unschuldsmerkmalen des Hebräischen. Nur die weniger unmittelbar verständliche Wendung zum Auflauern wird erläutert.
