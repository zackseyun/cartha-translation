lexical_decisions:
- source_word: "\x12\x05\x11\0\f \x04\x03\x1D"
  choice: "Blutr\x1Cher"
  rationale: "Die feste deutsche Rechtsbezeichnung gibt die Rolle des zur Ahndung der Blutschuld Befugten knapp und transparent wieder, ohne eine im Vers nicht ausdr\x1Cklich genannte Verwandtschaft hinzuzuf\x1Cgen."
- source_word: "\f\a\x15\x19 \v\x12\x01\x06\v"
  choice: "au\x1Ferhalb der Grenze"
  rationale: "Die Wendung bezeichnet die r\x1Eumliche und rechtliche Grenze des gesch\x1Ctzten Bereichs."
- source_word: "\x1F\a\x12 \f\a\v\x06\x12"
  choice: seiner Zufluchtsstadt
  rationale: "Dies ist eine nat\x1Crliche, institutionell eindeutige Wiedergabe der Stadt, in der der Totschl\x1Ager Schutz findet."
- source_word: "\x15\x12\x17"
  choice: "t\x1Ctet"
  rationale: "Das neutrale Verb vermeidet die falsche Aussage eines rechtswidrigen Mordes, da der folgende Satz ausdr\x1Cklich keine Blutschuld feststellt."
- source_word: "\x04\x12\x17\x15"
  choice: "der Totschl\x1Ager"
  rationale: "Im Zusammenhang der Zufluchtsst\x1Dte bezeichnet das Wort den Menschen, der einen anderen get\x1Ctet hat, ohne hier vors\x1E4tzlichen Mord vorauszusetzen."
- source_word: "\x1C\v\f \x14\x03 \x04\x03"
  choice: "l\x1Dt er keine Blutschuld auf sich"
  rationale: "Die idiomatische Rechtsformel wird verst\x1E4ndlich wiedergegeben und ihr Bezug auf den Blutr\x1E4cher im Deutschen verdeutlicht."
theological_decisions:
- issue: "Rechtlich-moralische Bedeutung von \x12\x17 im Zusammenhang einer straflosen T\x1Ctung"
  choice: "Neutral mit \x10t\x1Ctet\x11 wiedergeben."
  alternative: "Mit \x10ermordet\x11 wiedergeben, um das hebr\x1E4ische Wort an anderen Stellen einheitlicher abzubilden."
  rationale: "Die ausdr\x1Ckliche Feststellung, dass keine Blutschuld entsteht, schlie\x1Ft ein deutsches Verb aus, das die T\x1Ctung bereits als verbrecherisch bewertet."
- issue: "Bezug der Formel \x1C\v\f \x14\x03 \x04\x03"
  choice: "Das Pronomen auf den Blutr\x1E4cher beziehen: Er l\x1E4dt keine Blutschuld auf sich."
  alternative: "Die hebr\x1E4ische Form w\x1Crtlicher und weniger explizit als \x10f\x1Cr ihn besteht keine Blutschuld\x11 wiedergeben."
  rationale: "Syntax und Rechtszusammenhang beziehen die Straffreiheit auf den Blutr\x1E4cher; die deutsche Explizierung verhindert ein unklares Pronomen, ohne den Sinn zu erweitern."
translation_notes:
  register: "Modernes, w\x1Crdiges Standarddeutsch mit pr\x1E4ziser Rechtssprache. \x10Zufluchtsstadt\x11 und \x10Blutr\x1E4cher\x11 bewahren die institutionellen Begriffe; die Satzstruktur folgt dem hebr\x1E4ischen Bedingungszusammenhang, bleibt aber gut lesbar."
