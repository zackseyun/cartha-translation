source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אַ֥רְצָ/ה כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: de
  text: 'Rede zu den Israeliten und sag ihnen: »Wenn ihr den Jordan überquert und in das Land Kanaan kommt,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Rede zu
  rationale: Der Piel-Imperativ von דבר mit אֶל fordert Mose unmittelbar auf, die Angesprochenen anzureden; »Rede zu« bewahrt Form und Befehlscharakter.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Wörtlich »den Söhnen Israels«; im heutigen Deutschen bezeichnet »die Israeliten« die Volksgemeinschaft natürlich und schließt hier das ganze Volk ein, ohne eine ausschließlich männliche Gruppe nahezulegen.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sag ihnen
  rationale: Die Wiedergabe beider hebräischen Redeverben erhält die charakteristische Befehlsfolge; »sag« ist modernes Standarddeutsch.
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: Wenn ihr … überquert
  rationale: כִּי leitet hier den bevorstehenden zeitlichen Umstand ein; die Verbindung aus Pronomen und Partizip bezeichnet die künftige Überschreitung.
- source_word: אֶת הַיַּרְדֵּן
  choice: den Jordan
  rationale: Die übliche deutsche Bezeichnung des Flusses; das Verb »überqueren« macht die Bewegung über ihn hinweg deutlich.
- source_word: אַרְצָה כְּנָעַן
  choice: und in das Land Kanaan kommt
  rationale: Der Richtungsakkusativ mit lokativem He zeigt die Bewegung in das Gebiet hinein. Die koordinierte deutsche Formulierung vermeidet das schwerfällige »den Jordan in das Land Kanaan überqueren« und macht das Ziel eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht im Plural. »Israeliten« ist gegenüber dem wörtlichen, im Deutschen missverständlich männlich klingenden »Söhne Israels« idiomatisch und referenziell genauer. Der Vers bleibt syntaktisch offen, da die direkte Rede im Folgevers weitergeht.
