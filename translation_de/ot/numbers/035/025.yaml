source:
  edition: WLC
  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: de
  text: Dann soll die Gemeinde denjenigen, der getötet hat, aus der Hand des Bluträchers[a] retten, und die Gemeinde soll ihn in seine Zufluchtsstadt zurückbringen, in die er geflohen ist. Dort soll er bis zum Tod des Hohen Priesters[b] bleiben, den er mit dem heiligen Öl gesalbt hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Rächers des Blutes“. Gemeint ist derjenige, dem die rechtliche Pflicht zukam, vergossenes Blut zu rächen, gewöhnlich ein naher Verwandter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „bis zum Tod des großen Priesters“. „Hoher Priester“ ist die übliche Amtsbezeichnung.'
    reason: lexical_clarification
  - marker: c
    text: 'Hebräisch: „den er mit dem heiligen Öl gesalbt hat“. Das Subjekt von „gesalbt hat“ wird nicht ausdrücklich genannt. Viele Übersetzungen geben die Stelle deshalb passiv wieder: „der mit dem heiligen Öl gesalbt worden war“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: retten
  rationale: Das Hifil von נצל bezeichnet hier die Befreiung aus der Gewalt eines anderen; „retten“ ist im rechtlichen Schutzkontext klar und natürlich.
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: Der Ausdruck bezeichnet in Numeri die Gemeinschaft, die hier richterlich handelt. „Gemeinde“ bewahrt den formellen gemeinschaftlichen Sinn.
- source_word: הָרֹצֵחַ
  choice: der Totschläger
  rationale: Das Wort bezeichnet in diesem Kapitel einen Menschen, der einen anderen getötet hat, ohne bereits vorsätzlichen Mord vorauszusetzen. „Totschläger“ wahrt diese rechtliche Offenheit besser als „Mörder“.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die konkrete hebräische Wendung ist im Deutschen verständlich und bewahrt das Bild der Gewalt beziehungsweise Verfügungsgewalt.
- source_word: גֹּאֵל הַדָּם
  choice: Bluträcher
  rationale: Dies ist die gebräuchliche knappe Bezeichnung für den rechtlich zuständigen Rächer des vergossenen Blutes. Die häufig vorausgesetzte Verwandtschaft wird nicht in den Haupttext eingefügt.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: ihn ... zurückbringen
  rationale: Das Hifil von שוב bedeutet, jemanden zurückkehren zu lassen beziehungsweise zurückzubringen; die deutsche Formulierung ist natürlich und präzise.
- source_word: עִיר מִקְלָטוֹ
  choice: seine Zufluchtsstadt
  rationale: „Zufluchtsstadt“ gibt die feststehende rechtliche Einrichtung knapp und verständlich wieder.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: in die er geflohen ist
  rationale: Das Richtungsadverb שמה wird durch „in die“ ausdrücklich wiedergegeben; das Perfekt bezeichnet die vorausliegende Flucht.
- source_word: וְיָשַׁב בָּהּ
  choice: Dort soll er ... bleiben
  rationale: ישב kann wohnen, sich aufhalten oder bleiben bedeuten. Im Zusammenhang ist das vorgeschriebene Verbleiben in der Zufluchtsstadt gemeint; „bleiben“ ist idiomatisch und vermeidet eine unnötige Festlegung auf bloßes Wohnen.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: bis zum Tod des Hohen Priesters
  rationale: Die nominale hebräische Konstruktion wird eng und in etablierter deutscher Terminologie wiedergegeben.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: den er ... gesalbt hat
  rationale: Der masoretische Text hat ein aktives Verb in der 3. Person Singular maskulin mit dem Hohen Priester als Objekt. Das ungenannte Subjekt bleibt daher auch im Haupttext unbestimmt.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: mit dem heiligen Öl
  rationale: Die bestimmte hebräische Wortgruppe bezeichnet das heilige Salböl; die Wiedergabe ist eng und natürlich.
theological_decisions:
- issue: Rechtlicher Status von הָרֹצֵחַ
  choice: „Totschläger“ statt „Mörder“
  alternative: „Mörder“ oder neutraler „derjenige, der getötet hat“
  rationale: Das Kapitel unterscheidet vorsätzliche Tötung von unbeabsichtigter Tötung. „Mörder“ würde Schuld vorwegnehmen; „Totschläger“ hält die rechtliche Einordnung an dieser Stelle offen.
- issue: Subjekt von מָשַׁח אֹתוֹ
  choice: 'Aktiv wiedergegeben: „den er ... gesalbt hat“'
  alternative: 'Passiv: „der ... gesalbt worden war“'
  rationale: Im Hebräischen steht ausdrücklich eine aktive Verbform, deren Subjekt nicht genannt wird. Die aktive Wiedergabe bewahrt diese syntaktische Spannung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich präziser Terminologie. Der Satz wurde zur besseren Lesbarkeit nach der Rückführung in die Zufluchtsstadt geteilt. Die ungewöhnliche aktive Schlusskonstruktion des Hebräischen bleibt erhalten und wird in einer Fußnote erläutert.
