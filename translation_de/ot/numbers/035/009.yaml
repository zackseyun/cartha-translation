  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Verb דבר mit narrativem וַ führt einen neuen Redeschritt ein. „Redete“ entspricht der geläufigen deutschen Bibelformel und hält es vom folgenden לֵאמֹר („sprach“) unterscheidbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet hier den Adressaten der Rede; „zu Mose“ ist idiomatisches Standarddeutsch.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die im Deutschen etablierte Namensform.
- source_word: לֵאמֹר
  choice: und sprach
  rationale: Der Infinitiv leitet formelhaft den folgenden Redeinhalt ein. Im Deutschen gibt „und sprach:“ diese Funktion natürlich und würdevoll wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; „der HERR“ ersetzt ihn durch einen Titel, während „Jehova“ auf einer späteren Mischlesung beruht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Redeeinleitungsformel „redete … und sprach“ bewahrt die zweigliedrige hebräische Struktur, ohne altertümliche Formen wie „zu ihm sprechend“ zu verwenden.
