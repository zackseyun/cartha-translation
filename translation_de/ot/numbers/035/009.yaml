  source_fidelity: Der hebräische Redeeinleitungssatz lautet wörtlich „Und Jahwe sprach zu Mose, indem er sagte/zu sagen“. Das einleitende וַיְדַבֵּר und לֵאמֹר bilden eine feste Formel; im Deutschen wird ihre Funktion idiomatisch durch „sprach ...:“ wiedergegeben. „Jahwe“, „Mose“ und „zu Mose“ entsprechen dem Ausgangstext.
  naturalness: „Redete zu Mose und sprach“ ist eine traditionelle Bibelformel, wirkt in modernem Standarddeutsch jedoch unnötig doppelt und archaisierend. „Und Jahwe sprach zu Mose:“ ist klar, idiomatisch und leitet den in der folgenden Verseinsatz fortgesetzten Redeinhalt korrekt ein.
