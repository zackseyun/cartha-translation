  text: וְ/הַ/חֹנִים֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: de
  text: An der Ostseite, gegen Sonnenaufgang, lagert das Feldzeichen des Lagers Juda nach seinen Abteilungen; und der Fürst der Söhne Judas ist Nachschon, der Sohn Amminadabs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: Feldzeichen
  rationale: Bezeichnet hier das Kennzeichen einer größeren Lager- und Heeresabteilung; „Feldzeichen“ ist im Deutschen präziser als das enger bildhafte „Banner“.
- source_word: לְצִבְאֹתָם
  choice: die Abteilungen
  rationale: צָבָא bezeichnet geordnete, insbesondere militärisch organisierte Verbände. Im Zusammenhang der Lagerordnung gibt „Abteilungen“ die Struktur natürlich wieder.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Bezeichnet das führende Oberhaupt eines Stammes; „Anführer“ ist verständlich und bewahrt die Funktion, ohne einen modernen Amtstitel einzutragen.
- source_word: בְנֵי יְהוּדָה
  choice: Nachkommen Judas
  rationale: Das idiomatische בְּנֵי kann in einem Stammeskontext die Angehörigen beziehungsweise Nachkommen Judas bezeichnen, nicht nur unmittelbare Söhne.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Richtungsangabe „an der Ostseite, gegen Sonnenaufgang“ bleibt erhalten. Der hebräische Nominalaufbau wurde zu zwei klaren deutschen Sätzen geordnet, ohne sachliche Ergänzungen.
