  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: de
  text: Seine Heerschar[a] und die bei ihr Gemusterten[b] zählten 57.400.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Heer“ oder „seine Abteilung“. Das hebräische Wort צָבָא kann hier eine militärisch geordnete Einheit oder einen organisierten Verband im Lager bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die bei ihr Gezählten“ oder „ihre registrierten Männer“. Gemeint sind die bei der Zählung amtlich erfassten Angehörigen der Heerschar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Seine Heerschar
  rationale: צָבָא bezeichnet hier den geordneten, wehrfähigen Stammesverband im Lager. „Heerschar“ bewahrt den militärisch-organisatorischen Sinn, ohne ein bereits kämpfendes Heer vorauszusetzen.
- source_word: וּפְקֻדָיו
  choice: die bei ihm Gemusterten
  rationale: Die Form von פקד bezeichnet in dieser Zählungsformel die amtlich erfassten beziehungsweise gemusterten Männer. „Bei ihm“ gibt den maskulinen Suffixbezug wieder, ohne ihn unnötig genauer festzulegen.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '57.400'
  rationale: Die genaue Zahl wird in der heute üblichen deutschen Schreibweise wiedergegeben.
