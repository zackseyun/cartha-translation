- from: Das Banner des Lagers Ephraims soll mit seinen Heeresverbänden im Westen stehen. Der Stammesführer der Nachkommen Ephraims ist Elischama, der Sohn Ammihuds.
  to: Das Banner des Lagers Ephraim soll nach seinen Heeresabteilungen im Westen stehen. Das Stammesoberhaupt der Nachkommen Ephraims soll Elischama, der Sohn Ammihuds, sein.
