base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: de
  text: Das Banner des Lagers Ephraim soll nach seinen Heeresabteilungen im Westen stehen. Das Stammesoberhaupt der Nachkommen Ephraims soll Elischama, der Sohn Ammihuds, sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: Banner
  rationale: Bezeichnet hier das Erkennungszeichen, unter dem ein Stammeslager geordnet ist; „Banner“ ist im modernen Deutschen klar und würdevoll.
- source_word: מַחֲנֵה
  choice: Lager
  rationale: Gibt die organisierte Lagerformation des Stammes natürlich und sachgerecht wieder.
- source_word: לְצִבְאֹתָם
  choice: mit seinen Heeresverbänden
  rationale: Bewahrt den militärisch-organisatorischen Sinn von צָבָא, ohne notwendig einen aktuellen Kriegseinsatz auszudrücken. Der Singularbezug richtet sich im Deutschen natürlich nach „Lager Ephraims“.
- source_word: יָמָּה
  choice: im Westen
  rationale: Die Form bedeutet wörtlich „meerwärts“, in israelitischer Orientierung idiomatisch „nach Westen“; im Kontext der Lagerordnung ist „im Westen“ natürlich.
- source_word: וְנָשִׂיא
  choice: Der Stammesführer
  rationale: נָשִׂיא bezeichnet hier das Oberhaupt eines Stammes. „Stammesführer“ ist präziser als das möglicherweise dynastisch verstandene „Fürst“.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: der Nachkommen Ephraims
  rationale: Gibt die hebräische Verwandtschafts- und Stammesbezeichnung in natürlichem modernem Deutsch wieder.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elischama, der Sohn Ammihuds
  rationale: Die Personennamen werden deutsch transliteriert; בֶּן wird unmittelbar mit „Sohn“ wiedergegeben.
