  source_fidelity: 'Die Grundbegriffe sind angemessen wiedergegeben: „Israeliten“, die distributive Einzahl „jeder“, „Banner“, die Kennzeichen der Vaterhaus-/Sippeneinheiten und „Zelt der Begegnung“ entsprechen dem Hebräischen gut. Die räumliche Wendung sollte jedoch die Verbindung von מִנֶּגֶד („in einiger Entfernung/gegenüber“) und סָבִיב („ringsum“) klarer wiedergeben.'
  naturalness: 'Der zweite Satz der Fassung „Rings um das Zelt der Begegnung, ihm gegenüber“ wirkt im Deutschen räumlich spannungsvoll: Wer rings um etwas lagert, kann nicht insgesamt diesem einen Punkt „gegenüber“ sein. „In einiger Entfernung rings um das Zelt der Begegnung“ ist idiomatisch und bildet beide Ortsangaben verständlich ab.'
