  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: de
  text: Die Israeliten sollen sich lagern, jeder bei seinem Banner[a], bei den Zeichen ihrer Vaterhäuser. In einiger Entfernung rings um das Zelt der Begegnung[b] sollen sie sich lagern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feldzeichen“ oder „Standarte“. Das hebräische Wort bezeichnet ein Erkennungsbanner einer Stammes- oder Heeresabteilung.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „Stiftshütte“; auch „Zelt der Zusammenkunft“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: jeder
  rationale: Die distributive Einzahl bezeichnet hier jeweils den einzelnen Angehörigen Israels; „jeder“ gibt dies im Deutschen natürlich wieder.
- source_word: דִּגְלוֹ
  choice: bei seinem Banner
  rationale: דֶּגֶל bezeichnet das Erkennungszeichen einer Stammes- oder Heeresabteilung. „Banner“ ist verständlich und bewahrt die konkrete Bildlichkeit.
- source_word: בְאֹתֹת
  choice: bei den Zeichen
  rationale: Die Zeichen dienen der Zuordnung zu den jeweiligen Großfamilien. „Bei“ lässt die genaue Art dieser Kennzeichen offen und passt zur räumlichen Lagerordnung.
- source_word: לְבֵית אֲבֹתָם
  choice: seiner Großfamilie
  rationale: בֵּית אָב bezeichnet die väterlich bestimmte größere Familien- beziehungsweise Sippeneinheit. Die distributive deutsche Einzahl stimmt mit „jeder“ überein.
- source_word: יַחֲנוּ
  choice: sollen sich lagern
  rationale: Der Imperfekt steht in einem anweisenden Zusammenhang; „sollen“ gibt die Vorschrift in natürlichem modernem Deutsch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Die Israeliten
  rationale: Die feste hebräische Volksbezeichnung wird im heutigen Deutsch idiomatisch und ohne Bedeutungsverlust mit „die Israeliten“ wiedergegeben.
- source_word: מִנֶּגֶד
  choice: ihm gegenüber
  rationale: Der Ausdruck bezeichnet eine Lage gegenüber beziehungsweise mit Abstand vor dem Bezugspunkt; das Pronomen bezieht sich eindeutig auf das Zelt.
- source_word: סָבִיב
  choice: rings um
  rationale: Das Adverb beschreibt die Anordnung auf allen Seiten des Zeltes.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die transparente Wiedergabe bewahrt sowohl den Zeltcharakter als auch die Funktion des Ortes; „Stiftshütte“ wäre traditioneller, aber weniger unmittelbar verständlich.
theological_decisions:
- issue: Wiedergabe der familiären Volksbezeichnung
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: בְּנֵי יִשְׂרָאֵל ist hier die übliche Bezeichnung des ganzen Volkes. „Die Israeliten“ ist im Deutschen natürlich und schließt die angesprochene Gemeinschaft ein, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Wiedergabe des kultischen Ausdrucks אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  alternative: Stiftshütte / Zelt der Zusammenkunft
  rationale: „Zelt der Begegnung“ übersetzt die Bestandteile transparent und lässt offen, ob מוֹעֵד hier stärker die Begegnung oder die festgesetzte Zusammenkunft hervorhebt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die räumliche Anordnung um das Zelt klar heraus. „Großfamilie“ vermittelt die soziale Einheit von בֵּית אָב verständlicher als das wörtliche, heute missverständliche „Vaterhaus“.
