  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: de
  text: Die Gesamtzahl aller für das Lager Juda Gemusterten betrug nach ihren Heeresverbänden[a] 186.400. Sie sollen als Erste aufbrechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren Abteilungen“ beziehungsweise „nach ihren Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Alle Gemusterten
  rationale: Das passive Partizip von פקד bezeichnet hier die bei der Volks- und Heereszählung Erfassten. „Gemusterte“ bewahrt den militärischen Zusammenhang prägnanter als das allgemeinere „Gezählte“.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: des Lagers von Juda
  rationale: Die Zugehörigkeitsbeziehung lässt sich im Deutschen natürlich mit dem Genitiv ausdrücken.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: '186.400'
  rationale: Die Ziffernschreibweise gibt die exakte Summe in diesem Zählungsabschnitt übersichtlich wieder.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צָבָא bezeichnet hier die geordneten militärischen Einheiten des Lagers. „Heeresverbände“ erhält diesen Sinn, ohne moderne Kompaniestrukturen vorauszusetzen.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: Sie sollen als Erste aufbrechen
  rationale: נסע bezeichnet im Lagerkontext das Aufbrechen beziehungsweise Losziehen; רִאשֹׁנָה gibt die Reihenfolge an. „Als Erste“ bezieht sich natürlich auf die zuvor genannten Angehörigen des Lagers.
