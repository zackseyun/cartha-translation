  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: de
  text: Alle Gemusterten des Lagers von Dan waren 157.600. Sie sollen als Letzte nach ihren Feldzeichen[a] aufbrechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter ihren Bannern“. Das hebräische Wort bezeichnet die Feldzeichen beziehungsweise die durch sie gekennzeichneten Stammesgruppen in Israels Lagerordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Alle Gemusterten
  rationale: Das passive Partizip von פקד bezeichnet hier die bei der Zählung erfassten Personen. „Gemusterte“ gibt den Zählungs- und Heerlagerkontext knapp wieder, ohne das im Vers nicht ausdrücklich wiederholte Wort „Männer“ hinzuzufügen.
- source_word: לְמַחֲנֵה דָן
  choice: des Lagers von Dan
  rationale: Die Präposition kennzeichnet die Zugehörigkeit zur Lagerabteilung Dans; die Formulierung ist im Deutschen natürlich und eindeutig.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '157.600'
  rationale: Die hebräische Zahl entspricht genau 157.600; die Ziffernschreibweise mit deutschem Tausenderpunkt dient der schnellen Lesbarkeit.
- source_word: לָאַחֲרֹנָה
  choice: als Letzte
  rationale: Das Adverb bezeichnet die letzte Position in der Aufbruch- beziehungsweise Marschordnung. Der Plural bezieht sich auf die Angehörigen des Lagers.
- source_word: יִסְעוּ
  choice: sollen … aufbrechen
  rationale: נסע bezeichnet im Wüstenwanderungskontext regelmäßig das Aufbrechen eines Lagers zur Weiterreise. „Sollen“ wahrt den anordnenden Charakter der Verbform im Kontext.
- source_word: לְדִגְלֵיהֶם
  choice: nach ihren Feldzeichen
  rationale: דגל bezeichnet das Feldzeichen und zugleich die dadurch geordnete Lager- oder Stammesgruppe. „Nach ihren Feldzeichen“ bewahrt sowohl das Bild als auch den ordnenden Sinn der Präposition, ohne die räumliche Deutung „unter“ zwingend festzulegen.
