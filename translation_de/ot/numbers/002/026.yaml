lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: und seine Heerschar
  rationale: צָבָא bezeichnet hier im Zusammenhang der Lagerordnung das militärisch organisierte Aufgebot des Stammes. „Heerschar“ wahrt sowohl den militärischen als auch den gegliederten kollektiven Sinn; das Suffix der 3. Person Singular wird mit „seine“ wiedergegeben.
- source_word: וּפְקֻדֵיהֶם
  choice: ihre Gemusterten
  rationale: Die Form von פקד bezeichnet in diesem Zählungskontext die erfassten beziehungsweise gemusterten Männer der Gruppe. „Ihre Gemusterten“ gibt den Personenbezug und das pluralische Suffix knapp wieder.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: '62.700'
  rationale: Die genaue Summe wird in der im modernen Deutschen üblichen Zahlenschreibweise wiedergegeben.
