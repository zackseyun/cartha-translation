base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: de
  text: Neben ihm lagert der Stamm Issachar. Das Oberhaupt der Söhne Issachars[a] ist Netanel, der Sohn Zuars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Issachars“. Die Wendung ist eine übliche Stammesbezeichnung und meint die Nachkommen beziehungsweise Angehörigen Issachars, nicht ausschließlich männliche Einzelpersonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: lagert
  rationale: Das substantivierte Partizip bezeichnet hier kollektiv den in der Lagerordnung stationierten Stamm. Im Deutschen ergibt die Verbindung mit „der Stamm Issachar“ natürlich den Singular.
- source_word: עָלָיו
  choice: Neben ihm
  rationale: Im Zusammenhang der Lagerordnung bezeichnet die Präposition räumliche Nachbarschaft zum zuvor genannten Lagerverband, nicht eine Lage „auf“ ihm.
- source_word: מַטֵּה יִשָּׂשכָר
  choice: der Stamm Issachar
  rationale: מַטֶּה ist hier die übliche Bezeichnung für einen Stamm, nicht für einen Stab. Die deutsche Wendung ist klar und idiomatisch.
- source_word: נָשִׂיא
  choice: Oberhaupt
  rationale: Das Wort bezeichnet den anerkannten führenden Vertreter des Stammes. „Oberhaupt“ ist in diesem Kontext würdig und vermeidet die königlichen Nebenbedeutungen von „Fürst“.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: der Söhne Issachars
  rationale: Die Wiedergabe bewahrt die hebräische Abstammungs- und Stammesformel; gemeint sind die Nachkommen beziehungsweise Angehörigen Issachars.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Der Eigenname wird nach einer im Deutschen geläufigen bibelnahen Transliteration wiedergegeben.
- source_word: בֶּן צוּעָר
  choice: der Sohn Zuars
  rationale: Die hebräische Vatersnamensformel wird im Deutschen natürlich und eindeutig wiedergegeben.
