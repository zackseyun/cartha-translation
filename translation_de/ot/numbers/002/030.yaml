  text: 'and his company[a], even those numbered of them: fifty-three thousand four hundred.'
translation:
  language: de
  text: 'Seine Abteilung[a] und ihre Gemusterten: 53.400.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Heerschar“ oder „Heer“; das hebräische Wort kann einen militärisch gegliederten Stammesverband bezeichnen.
