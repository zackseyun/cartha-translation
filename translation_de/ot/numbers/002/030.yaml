lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Seine Abteilung
  rationale: צָבָא bezeichnet hier den geordneten Stammesverband, wobei ein militärischer Beiklang mitschwingt. „Abteilung“ gibt die organisatorische Bedeutung natürlich wieder, ohne einen aktuellen Kriegseinsatz anzudeuten.
- source_word: וּפְקֻדֵיהֶם
  choice: mit ihren Gemusterten
  rationale: Die Form von פקד bezeichnet die bei der Zählung erfassten beziehungsweise gemusterten Angehörigen. Das pluralische Suffix wird mit „ihren“ bewahrt; „mit“ macht das appositionale Verhältnis im Deutschen verständlich.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '53.400'
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise als 53.400 wiedergegeben und entspricht genau dreiundfünfzigtausendvierhundert.
theological_decisions: []
