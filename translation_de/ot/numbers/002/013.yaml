  language: de
  text: 'und seine Heerschar, ihre Gemusterten: 59.300.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: und seine Heerschar
  rationale: צָבָא bezeichnet hier im Zusammenhang der Lager- und Heeresordnung den einem Stammesführer zugeordneten militärischen Verband. „Heerschar“ bewahrt diesen organisatorisch-militärischen Sinn und das maskuline Singularsuffix wird mit „seine“ wiedergegeben.
- source_word: וּפְקֻדֵיהֶם
  choice: ihre Gemusterten
  rationale: Die Form bezeichnet die bei der Zählung beziehungsweise Musterung erfassten Personen. „Gemusterte“ ist im militärischen Zensuskontext präzise; das Suffix im Plural wird als „ihre“ bewahrt. Der hebräische Anschluss mit וּ wird wegen der deutschen Zeichensetzung nicht durch ein zusätzliches „und“ wiedergegeben.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: '59.300'
  rationale: Die hebräische Zahl „neun und fünfzigtausend und dreihundert“ wird nach heutiger deutscher Zahlenkonvention als 59.300 wiedergegeben; der genaue Wert bleibt unverändert.
