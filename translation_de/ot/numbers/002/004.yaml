  text: 'and his division[b][a], those numbered from them: seventy-four thousand six hundred.'
translation:
  language: de
  text: 'Seine Heeresabteilung[a] und die Erfassten des Stammes[b]: 74.600.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »sein Heer« beziehungsweise »seine Heerschar«; das hebräische Wort kann militärisch verstanden werden, bezeichnet hier aber wahrscheinlich die im Lager angeordnete Abteilung des Stammes.
    reason: lexical_alternative
  - marker: b
    text: Oder »die Gemusterten des Stammes« oder »seine gezählten Angehörigen«. Im Hebräischen steht ein Ausdruck aus der Sprache der Zählung und militärischen Musterung; die Endung bezieht sich auf die Angehörigen des Stammes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Seine Heeresabteilung
  rationale: צָבָא kann »Heer« oder »Heerschar« bedeuten; im Zusammenhang der Lager- und Stammesordnung bezeichnet es die militärisch organisierte Abteilung des Stammes. »Heeresabteilung« bewahrt sowohl den militärischen als auch den organisatorischen Sinn.
- source_word: וּפְקֻדֵיהֶם
  choice: die aus ihnen Gemusterten
  rationale: Die Form von פקד gehört zur Sprache der Zählung beziehungsweise Musterung und bezeichnet die erfassten Angehörigen. »Aus ihnen« gibt den pluralischen Suffixbezug wieder, ohne das im Teilsatz nicht ausdrücklich stehende Wort »Männer« einzufügen.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '74.600'
  rationale: Die genaue Gesamtzahl wird in der im modernen Deutschen üblichen Zahlenschreibweise wiedergegeben.
