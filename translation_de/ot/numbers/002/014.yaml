  text: וְ/מַטֵּ֖ה גָּ֑ד וְ/נָשִׂיא֙ לִ/בְנֵ֣י גָ֔ד אֶלְיָסָ֖ף בֶּן רְעוּאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/014.yaml
  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: de
  text: Und der Stamm Gad; der Anführer der Söhne Gads war Eljasaf, der Sohn Reguëls[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften oder Parallelstellen nennen den Vater Dëuël (siehe 4. Mose 1,14).
    reason: textual_variant
lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: Und der Stamm
  rationale: מַטֶּה bezeichnet im Zusammenhang der Lagerordnung einen Stamm, nicht einen wörtlichen Stab. Das וְ führt die Aufzählung fort.
- source_word: גָּד
  choice: Gad
  rationale: Der Stammesname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: וְ/נָשִׂיא
  choice: der Anführer
  rationale: נָשִׂיא meint hier das anerkannte Oberhaupt des Stammes. „Anführer“ ist gegenwärtig und vermeidet die mögliche dynastische Bedeutung von „Fürst“.
- source_word: לִ/בְנֵי
  choice: der Söhne
  rationale: Die Verbindung bezeichnet die Stammesangehörigen als Söhne beziehungsweise Nachkommen Gads; die traditionelle biblische Ausdrucksweise bleibt verständlich erhalten.
- source_word: אֶלְיָסָף
  choice: Eljasaf
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die übliche patronymische Formel wird direkt wiedergegeben.
- source_word: רְעוּאֵל
  choice: Reguël
  rationale: Der masoretische Text von Numeri 2,14 liest רְעוּאֵל. Die abweichende Namensform „Dëuël“ in der Parallelstelle wird nicht harmonisierend in den Haupttext übernommen, sondern in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der elliptische hebräische Listenstil wird durch „war“ leicht ergänzt, damit der Satz natürlich verständlich ist; das Semikolon bewahrt zugleich die Gliederung der Aufzählung.
