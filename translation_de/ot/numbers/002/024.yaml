base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: de
  text: Die Gesamtzahl der Gemusterten[a] im Lager Efraims betrug nach ihren Heeresverbänden[b] 108.100. Als Dritte sollen sie aufbrechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gezählten“. Das hebräische Wort kann sowohl die Zählung als auch die militärische Musterung hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach ihren Heerscharen“ beziehungsweise „nach ihren Abteilungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: alle … Gemusterten
  rationale: Das Partizip von פקד bezeichnet hier die bei der Zählung erfassten und zugleich für den Heeresdienst eingeteilten Personen. „Gemusterte“ bewahrt diese doppelte Nuance knapp und idiomatisch.
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: für das Lager Efraims
  rationale: Die Präposition לְ ordnet die Gemusterten dem von Efraim geführten Lagerverband zu; „für“ gibt diese Zuordnung im Deutschen natürlich wieder.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: '108.100'
  rationale: Die hebräische Zahl ergibt exakt 108.100; die Ziffernschreibung mit deutschem Tausenderpunkt ist übersichtlich und modern.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צָבָא kann Heer, Heerschar oder militärisch geordneten Verband bezeichnen. „Heeresverbände“ macht die organisierte Gliederung deutlich, ohne eine moderne konkrete Einheitsgröße vorauszusetzen.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: Sie sollen an dritter Stelle aufbrechen
  rationale: Der Ordinalausdruck bezeichnet die Reihenfolge beim Aufbruch; „an dritter Stelle“ ist im Deutschen eindeutiger und natürlicher als eine substantivierte Personenbezeichnung.
