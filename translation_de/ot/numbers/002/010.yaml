base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: de
  text: Das Banner des Lagers Ruben soll im Süden stehen, nach ihren Heerscharen[a]. Der Anführer der Söhne Rubens ist Elizur, der Sohn Schedeurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach ihren Heeresverbänden«; das hebräische Wort bezeichnet geordnete militärische Verbände.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: Banner
  rationale: Bezeichnet das sichtbare Feld- oder Stammeszeichen, unter dem das Lager geordnet ist; »Banner« ist modern, verständlich und wahrt den militärisch-organisatorischen Zusammenhang.
- source_word: מַחֲנֵה
  choice: Lager
  rationale: Bezeichnet hier den geordneten Lagerverband des Stammes Ruben.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Eingebürgerte deutsche Namensform.
- source_word: תֵּימָנָה
  choice: im Süden
  rationale: Die Richtungsform bezeichnet hier die Lage an der Südseite des Gesamtlagerplatzes.
- source_word: לְצִבְאֹתָם
  choice: geordnet nach ihren Heerscharen
  rationale: צָבָא bezeichnet geordnete, wehrfähige Verbände; »Heerscharen« bewahrt den militärischen Sinn, während »geordnet nach« die Funktion der Präposition im Lageraufbau natürlich wiedergibt.
- source_word: וְנָשִׂיא
  choice: Der Anführer
  rationale: נָשִׂיא ist hier das Oberhaupt des Stammes; »Anführer« ist verständlich und vermeidet die monarchische Nebenbedeutung von »Fürst«.
- source_word: לִבְנֵי רְאוּבֵן
  choice: der Söhne Rubens
  rationale: Bewahrt die hebräische Verwandtschaftsbezeichnung für die Angehörigen des Stammes.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizur, der Sohn Schedëurs
  rationale: Verwendet deutsche Transliterationen der Eigennamen und gibt das Patronym direkt wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der elliptische Nominalsatz des Hebräischen wird für klare deutsche Syntax mit »soll … stehen« wiedergegeben; der zweite Satz bleibt im Präsens. Militärische Ordnungssprache wird bewahrt, ohne unnötig altertümlich zu klingen.
