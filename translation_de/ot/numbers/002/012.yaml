id: NUM.2.12
reference: Numbers 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: de
  text: Neben ihm[a] lagert der Stamm Simeon; Oberhaupt der Söhne Simeons ist Schelumiël, der Sohn Zurischaddais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „daneben“. Das hebräische Verhältniswort bezeichnet hier die räumliche Nähe innerhalb der Lagerordnung; der genaue Bezug des Pronomens bleibt offen.'
    reason: lexikalische und referenzielle Alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: lagert
  rationale: Das substantivisch gebrauchte Partizip von חנה bezeichnet hier die lagernde Stammesgruppe. Im Deutschen gibt die kollektive Singularform mit „der Stamm Simeon“ den Sinn natürlich wieder.
- source_word: עָלָיו
  choice: neben ihm
  rationale: עַל bezeichnet in der Lagerordnung räumliche Nähe, nicht ein wörtliches Lagern „auf“ etwas. Das maskuline Suffix bleibt als „ihm“ erhalten; sein genauer Bezug ist im unmittelbaren Zusammenhang nicht völlig eindeutig.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: der Stamm Simeon
  rationale: מַטֶּה bezeichnet in den Musterungs- und Lagertexten eine Stammesgruppe, nicht einen Stab.
- source_word: וְנָשִׂיא
  choice: Oberhaupt
  rationale: נָשִׂיא meint hier den anerkannten Leiter eines Stammes. „Oberhaupt“ ist würdig und vermeidet die königliche Nebenbedeutung von „Fürst“.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: der Söhne Simeons
  rationale: Die Formulierung bewahrt die ausdrücklich männliche Verwandtschaftsbezeichnung des Hebräischen und ist im Deutschen verständlich.
- source_word: שְׁלֻמִיאֵל
  choice: Schelumiël
  rationale: Der Personenname wird nach geläufiger deutscher biblischer Namensform transliteriert; das Trema kennzeichnet die getrennte Aussprache der Vokale.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: der Sohn Zurischaddais
  rationale: Die patronymische Konstruktion wird direkt wiedergegeben; Zurischaddai wird als ein zusammengehöriger Personenname transliteriert.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftssprache in לִבְנֵי שִׁמְעוֹן
  choice: Söhne Simeons
  alternative: Nachkommen Simeons / Angehörige Simeons
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Plural „Söhne“. Die wörtlichere Wiedergabe erhält diese Form, ohne den Sinn im Deutschen zu verdunkeln.
- issue: Bezugswort des maskulinen Suffixes in עָלָיו
  choice: neben ihm
  alternative: daneben / neben ihm beziehungsweise ihm zur Seite
  rationale: Die maskuline Pronominalform wird nicht stillschweigend versachlicht. Zugleich weist die Fußnote darauf hin, dass die deutsche Form den im Kontext möglichen räumlichen Bezug auf die Lagerordnung nicht vollständig festlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist gegenüber dem Hebräischen leicht geglättet, während die Stammesbezeichnung, die männliche Verwandtschaftssprache und die mögliche Unbestimmtheit des Pronominalbezugs erhalten bleiben.
