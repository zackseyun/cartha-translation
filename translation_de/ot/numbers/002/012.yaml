  source_fidelity: 'Der deutsche Text gibt die zentralen Elemente des Hebräischen zuverlässig wieder: die in der Lagerordnung räumlich zugeordnete Gruppe, den Stamm Simeon, das Stammesoberhaupt, die Bezeichnung „Söhne Simeons“ sowie Schelumiël als Sohn Zurischaddais. „Neben ihm“ bewahrt das maskuline Suffix von עָלָיו, ohne einen umstrittenen konkreten Bezug festzulegen.'
  naturalness: „Neben ihm lagert der Stamm Simeon; Oberhaupt der Söhne Simeons ist Schelumiël, der Sohn Zurischaddais“ ist idiomatisches, modernes und zugleich würdiges Standarddeutsch. Die kollektive Singularform „der Stamm ... lagert“ ist im Deutschen für die substantivische hebräische Partizipialkonstruktion natürlich.
