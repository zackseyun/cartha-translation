  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: de
  text: 'Die Söhne Israels[a] handelten nach allem, was Jahwe Mose geboten hatte: So lagerten sie bei ihren Feldzeichen[b], und so brachen sie auf, jeder nach seinen Sippen, nach seinem Vaterhaus[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Israeliten«. Wörtlich steht im Hebräischen »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unter ihren Bannern«. Gemeint sind die Kennzeichen der geordneten Stammesabteilungen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »nach dem Haus seiner Väter«; gemeint ist die väterliche Abstammungsgruppe.'
    reason: source_clarity
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: handelten
  rationale: Das Verb עשה fasst hier zusammen, dass Israel die vorausgehenden Anweisungen ausführte. »Handelten« gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Formulierung bildet den hebräischen Ausdruck transparent ab; die geläufigere kollektive Wiedergabe »die Israeliten« steht in der Fußnote.
- source_word: כְּכֹל אֲשֶׁר
  choice: nach allem, was
  rationale: Diese Wendung bewahrt den umfassenden Gehorsam gegenüber sämtlichen Anweisungen und ist zugleich idiomatisches Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: Mose geboten hatte
  rationale: Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass das Gebot dem Handeln Israels vorausging.
- source_word: כֵּן ... וְכֵן
  choice: so ... und so
  rationale: Die Wiederholung bewahrt die betonte Übereinstimmung zwischen Gottes Weisung und Israels Verhalten.
- source_word: חָנוּ
  choice: lagerten
  rationale: »Lagerten« ist die natürliche deutsche Bezeichnung für das Verweilen im geordneten Lager.
- source_word: לְדִגְלֵיהֶם
  choice: bei ihren Feldzeichen
  rationale: דגל bezeichnet hier das Kennzeichen einer geordneten Stammesabteilung. »Feldzeichen« wahrt den organisatorischen und lagerbezogenen Sinn.
- source_word: נָסָעוּ
  choice: brachen sie auf
  rationale: Im Zusammenhang mit dem Lager bezeichnet נסע den Aufbruch zur Weiterreise; »aufbrechen« ist dafür im Deutschen präzise und idiomatisch.
- source_word: אִישׁ
  choice: jeder
  rationale: Das maskuline Singularwort wird hier distributiv gebraucht. »Jeder« erhält diese Struktur, ohne ein zusätzliches Substantiv einzuführen.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: nach seinen Sippen
  rationale: מִשְׁפָּחָה bezeichnet in diesem Stammes- und Lagerzusammenhang eher größere verwandtschaftliche Gruppen als moderne Kernfamilien.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: nach seinem Vaterhaus
  rationale: »Vaterhaus« bezeichnet die väterlich bestimmte Abstammungs- und Haushaltsgruppe und hält die Formulierung knapp und quellennah.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im hebräischen Text steht der Gottesname selbst. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt die zweimalige Entsprechungsformel »so ... und so« sowie den distributiven Singular »jeder ... seinen ... seinem«. Fachlich historische Begriffe wie »Feldzeichen«, »Sippen« und »Vaterhaus« werden wegen ihrer Genauigkeit beibehalten und nötigenfalls durch Fußnoten erläutert.
