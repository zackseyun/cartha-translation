  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose und zu Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; die genaue antike Aussprache ist nicht vollständig gesichert. Traditionell wird der Name auch mit „HERR“ wiedergegeben.'
    reason: Erläuterung des Gottesnamens und seiner überlieferten Wiedergabe.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר bezeichnet hier in der fortlaufenden Erzählung einen neuen Sprechakt; „sprach“ entspricht der würdevollen göttlichen Redeeinleitungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: zu Mose und zu Aaron
  rationale: Das wiederholte אֶל kennzeichnet Mose und Aaron ausdrücklich als zwei Adressaten; die Wiederholung von „zu“ bewahrt diese Struktur.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel verweist auf den folgenden Redeinhalt. Im heutigen Deutschen leitet ein Doppelpunkt die anschließende direkte Rede natürlicher ein als das formelhafte „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, während „HERR“ eine traditionelle Ersatzlesung und „Jehova“ eine spätere Mischform darstellt. Die genaue antike Aussprache ist nicht vollständig sicher.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Redeeinleitungsformel לֵאמֹר idiomatisch wieder und verbindet den Vers mit der folgenden Rede.
