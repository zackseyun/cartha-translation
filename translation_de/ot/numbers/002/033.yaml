reference: Numbers 2:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: de
  text: Die Leviten aber wurden nicht unter den Söhnen Israels[a] gezählt, wie Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“; traditionell: „den Kindern Israels“. Wörtlich steht im Hebräischen: „den Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: Die Leviten aber
  rationale: Das ו markiert hier im Anschluss an die zuvor genannten Gesamtzahlen einen Gegensatz. Die Nachstellung von „aber“ gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: לֹא הָתְפָּקְדוּ
  choice: wurden nicht … gezählt
  rationale: Der Hitpael von פקד bezeichnet in diesem Zusammenhang die Erfassung bei einer Zählung beziehungsweise Musterung. „Gezählt“ ist verständlich und passt zum unmittelbaren Kontext; die passive Form wahrt die Perspektive des hebräischen Ausdrucks.
- source_word: בְּ/תוֹךְ
  choice: unter
  rationale: Die Präposition bezeichnet hier die Einordnung in die größere Gruppe. „Unter“ ist dafür die natürliche deutsche Entsprechung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die Wiedergabe bewahrt die konkrete hebräische Formulierung. Das idiomatischere „Israeliten“ wird in einer Fußnote als Alternative genannt.
- source_word: כַּ/אֲשֶׁר
  choice: wie
  rationale: Das Wort leitet hier die Übereinstimmung des berichteten Handelns mit dem vorherigen göttlichen Befehl ein.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt macht deutlich, dass der Befehl der hier berichteten Zählung vorausging. „Gebieten“ entspricht dem würdevollen biblischen Kontext, ohne unverständlich zu sein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Der Eigenname ist das direkte Objekt von „geboten hatte“ und wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Die Leviten aber“ hält den Kontrast zum vorausgehenden Zählungsbericht fest. „Gezählt“ ist gegenüber „gemustert“ allgemein verständlicher, ohne den Zählungskontext abzuschwächen.
