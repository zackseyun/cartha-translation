base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: de
  text: Das Banner des Lagers von Dan soll im Norden stehen, nach ihren Heeresverbänden[a]; und der Anführer der Söhne Dans soll Ahieser sein, der Sohn Ammischaddais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren Abteilungen“ oder „nach ihren Scharen“.'
    reason: Lexikalische Alternativen für לְצִבְאֹתָם; der Ausdruck kann geordnete militärische beziehungsweise lagernde Verbände bezeichnen.
lexical_decisions:
- source_word: דֶּגֶל
  choice: Banner
  rationale: Bezeichnet das Feldzeichen, unter dem der Stammesverband lagert; „Banner“ ist im Deutschen klar und kontextgerecht.
- source_word: מַחֲנֵה דָן
  choice: Lager Dan
  rationale: Gibt die knappe hebräische Status-constructus-Verbindung wieder und bezeichnet den geordneten Lagerverband des Stammes Dan.
- source_word: צָפֹנָה
  choice: im Norden
  rationale: Die Richtungsform bezeichnet hier die Lage an der Nordseite der Lagerordnung.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צָבָא bezeichnet in diesem Zusammenhang geordnete, wehrfähige Verbände; die Wiedergabe bewahrt den militärisch-organisatorischen Klang.
- source_word: וְנָשִׂיא
  choice: und der Anführer
  rationale: נָשִׂיא bezeichnet hier den anerkannten Stammesführer; „Anführer“ vermeidet den heute leicht monarchisch verstandenen Ausdruck „Fürst“.
- source_word: לִבְנֵי דָן
  choice: der Söhne Dans
  rationale: Bewahrt die formale, maskuline Stammesbezeichnung des Hebräischen.
- source_word: אֲחִיעֶזֶר
  choice: Ahiëser
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamentradition transliteriert.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: der Sohn Ammischaddais
  rationale: Die patronymische Konstruktion wird direkt und in natürlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische Stammesbezeichnung בְנֵי
  choice: Söhne Dans
  alternative: Nachkommen Dans / Angehörigen des Stammes Dan
  rationale: Die maskuline Pluralform ist hier eine feste Stammesbezeichnung. Die Hauptübersetzung bewahrt diese Form, ohne sie interpretierend zu verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe an der formelhaften Lagerordnung des Hebräischen, ist jedoch idiomatisch geglättet.
