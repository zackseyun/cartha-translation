  - severity: low
    issue: Die explizite Ergänzung »Mann« geht über den Wortlaut des Verses hinaus.
    rationale: Der Kontext der Zählung kann die gemeinte Personengruppe erkennen lassen; eine ausdrückliche Geschlechtsbezeichnung ist in diesem Vers nicht notwendig.
  revised_text: Seine Heerschar, nämlich die darin Gemusterten, umfasste 35.400.
