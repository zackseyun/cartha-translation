translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Gemusterte« erhält den Zusammenhang von Zählung und militärisch organisierter Lagerordnung; »Mann« verdeutlicht, dass die Zahl die gemusterten Männer bezeichnet.
