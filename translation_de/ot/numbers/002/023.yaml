  text: Seine Heerschar, nämlich die darin Gemusterten, umfasste 35.400.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Seine Heerschar
  rationale: צָבָא bezeichnet hier den militärisch gegliederten Stammesverband. »Heerschar« bewahrt diesen organisatorisch-militärischen Sinn, ohne einen aktuellen Kampfeinsatz zu behaupten.
- source_word: וּפְקֻדֵיהֶם
  choice: nämlich die von ihnen Gemusterten
  rationale: Die Form von פקד bezeichnet im Kontext der Volkszählung die erfassten beziehungsweise zum Stammesaufgebot gemusterten Männer. Der Pluralsuffix wird mit »von ihnen« wiedergegeben.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '35.400'
  rationale: Die hebräische Zahl entspricht 35.400; die Ziffernschreibweise ist im Deutschen klar und natürlich.
