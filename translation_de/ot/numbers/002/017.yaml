base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: de
  text: 'Dann soll das Zelt der Begegnung aufbrechen, das Lager der Leviten inmitten der Lager. So, wie sie lagern, sollen sie aufbrechen: jeder an seinem Platz[a], bei ihren Feldzeichen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an seiner Position“. Die hebräische Wendung lautet wörtlich etwa „bei/auf seiner Hand“ und bezeichnet hier den zugewiesenen Platz in der Marschordnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach ihren Bannern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Dann soll ... aufbrechen
  rationale: נָסַע bezeichnet im Zusammenhang eines Lagers das Abbrechen und anschließende Losziehen. „Aufbrechen“ ist im Deutschen natürlich und wahrt die zeitliche Abfolge.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wiedergabe bewahrt sowohl den konkreten Begriff „Zelt“ als auch die Funktion als Ort der Begegnung, ohne eine spätere Fachbezeichnung einzutragen.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: das Lager der Leviten
  rationale: Die hebräische Genitivverbindung wird direkt und verständlich wiedergegeben.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: in der Mitte der anderen Lager
  rationale: בְּתוֹךְ bezeichnet hier die zentrale Stellung. „Der anderen Lager“ verdeutlicht im Deutschen, dass das Levitenlager selbst nicht zugleich eines der umgebenden Lager ist.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: So, wie sie lagern, sollen sie aufbrechen
  rationale: Die parallele Formulierung bewahrt die Entsprechung zwischen Lagerordnung und Marschordnung, ohne das im Kontext mitgemeinte Wort „Ordnung“ ausdrücklich in den Text einzufügen.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ wird hier distributiv gebraucht und meint jede Person beziehungsweise Einheit innerhalb der Marschordnung.
- source_word: עַל יָדוֹ
  choice: an seinem Platz
  rationale: Die wörtlich mit „Hand/Seite“ gebildete Wendung bezeichnet hier die zugewiesene Position in der Ordnung. „An seinem Platz“ gibt diesen Sinn idiomatisch wieder.
- source_word: לְדִגְלֵיהֶם
  choice: bei ihren Feldzeichen
  rationale: דֶּגֶל bezeichnet das sichtbare Zeichen einer Stammes- oder Lagerabteilung. „Feldzeichen“ passt zum geordneten Lager- und Marschverband und bleibt konkreter als eine rein abstrakte Ordnungsangabe.
