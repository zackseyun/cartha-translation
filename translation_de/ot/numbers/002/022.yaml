base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: de
  text: Der Stamm Benjamin; sein Anführer war Abidan, der Sohn Gideonis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Anführer für die Söhne Benjamins.“ Das hebräische לְ kann hier die Zuordnung auch mit „für“ ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: Stamm
  rationale: Im Zusammenhang der Lagerordnung in Numeri bezeichnet das Wort die Stammeseinheit, nicht einen wörtlichen Stab.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Der Eigenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: Das Wort bezeichnet hier das anerkannte Oberhaupt eines Stammes. „Anführer“ ist gegenwärtig und verständlich und vermeidet die königlichen Nebenbedeutungen von „Fürst“.
- source_word: לִבְנֵי בִנְיָמִן
  choice: der Benjaminiter
  rationale: Die Wendung bezeichnet die zu Benjamin gehörenden Nachkommen beziehungsweise Stammesangehörigen. „der Benjaminiter“ gibt die Beziehung natürlich und knapp wieder.
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Der Eigenname wird in der üblichen deutschen biblischen Form wiedergegeben.
- source_word: בֶּן גִּדְעֹנִי
  choice: der Sohn Gideonis
  rationale: Die hebräische Vatersnamenform wird mit der natürlichen deutschen Genitivkonstruktion wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Das einleitende וּ wird als anschließendes „Dazu“ wiedergegeben, weil der Vers Teil einer fortlaufenden Aufzählung ist. Die knappe nominale Struktur des Hebräischen bleibt erkennbar, wird aber in idiomatisches Deutsch überführt.
