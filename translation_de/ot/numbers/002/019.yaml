  text: 'And his division[a], those numbered from them: forty thousand and five hundred.'
translation:
  language: de
  text: 'Seine Heeresabteilung und die von ihnen Gemusterten: 40.500.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Seine Heeresabteilung
  rationale: צָבָא bezeichnet hier im Zusammenhang der Lager- und Heeresordnung die dem Stamm zugeordnete militärische Abteilung. „Heeresabteilung“ bewahrt diesen organisierten militärischen Sinn, ohne wie „Heer“ eine selbstständige Gesamtstreitmacht nahezulegen.
- source_word: וּפְקֻדֵיהֶם
  choice: die von ihnen Gemusterten
  rationale: Die Form von פקד bezeichnet im Zensuszusammenhang die für den Dienst Erfassten beziehungsweise Gemusterten. „Von ihnen“ gibt den pluralischen Suffixbezug wieder, ohne das im Hebräischen hier nicht ausdrücklich stehende „Männer“ einzufügen.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '40.500'
  rationale: Die Kardinalzahl wird in einer heutigen, übersichtlichen deutschen Zahlenschreibweise wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch entsprechend der listenartigen Zensusformel. Die nominale Satzstruktur des Hebräischen bleibt erhalten; die beiden mit וּ verbundenen Angaben werden im Deutschen ohne ein unnatürliches doppeltes „und“ nebeneinandergestellt.
