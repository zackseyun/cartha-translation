lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: und sein Heeresverband
  rationale: צָבָא bezeichnet hier im Rahmen der Lagerordnung den militärisch geordneten Verband des zuvor genannten Stammes. »Heeresverband« wahrt den militärischen Sinn und klingt im heutigen Deutsch natürlicher und genauer als »Heer« oder »Heerschar«. Das Präfix וּ־ wird als »und«, das Suffix der 3. Person Singular als »sein« wiedergegeben.
- source_word: וּפְקֻדָיו
  choice: und dessen Gemusterte
  rationale: Die Form von פקד bezeichnet die im Rahmen der Zählung erfassten beziehungsweise gemusterten Männer. »Dessen« bezieht das Wort grammatisch eindeutig auf den Heeresverband zurück; das zweite »und« gibt das zweite וּ־ ausdrücklich wieder.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '54.400'
  rationale: Die hebräische Zahl entspricht vierundfünfzigtausendvierhundert und wird nach heutiger deutscher Zahlenschreibweise wiedergegeben.
theological_decisions: []
