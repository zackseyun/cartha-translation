  text: And his company, even those numbered from it, was forty-six thousand five hundred.
translation:
  language: de
  text: 'Und die Gemusterten seiner Abteilung: 46.500.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: seine Heerschar
  rationale: צָבָא bezeichnet hier im Zusammenhang der Zählung und Lagerordnung den militärisch gegliederten Stammesverband. „Heerschar“ bewahrt diesen Sinn, ohne einen laufenden Kampfeinsatz vorauszusetzen.
- source_word: פְקֻדָיו
  choice: die aus ihr Gemusterten
  rationale: Die Form von פקד bezeichnet im Zählungskontext die erfassten beziehungsweise gemusterten Männer des Verbandes. Das feminine Pronomen in „aus ihr“ bezieht sich sinngemäß auf „Heerschar“.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '46.500'
  rationale: Die hebräische Zahlfolge wird nach heutiger deutscher Schreibweise als 46.500 wiedergegeben; „Mann“ verdeutlicht natürlich, dass es sich um die gezählten Angehörigen des Verbandes handelt.
