base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/028.yaml
  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: de
  text: 'Und seine Heerschar[a], die aus ihnen Gemusterten[b]: 41.500.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »sein Heer« beziehungsweise »sein Truppenverband«; das hebräische Wort kann eine militärisch organisierte Einheit oder einen geordneten Verband im Lager bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und ihre Gemusterten« oder »und die aus ihnen Gezählten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Und seine Heerschar
  rationale: צָבָא bezeichnet im Zusammenhang der Zählung und Lagerordnung den militärisch organisierten Stammesverband. »Heerschar« bewahrt diesen Sinn, ohne einen aktuellen Kampfeinsatz zu behaupten; das Suffix der 3. Person Singular wird mit »seine« wiedergegeben.
- source_word: וּפְקֻדֵיהֶם
  choice: die aus ihnen Gemusterten
  rationale: Die Form von פקד bezeichnet hier die bei der Zählung erfassten beziehungsweise gemusterten Angehörigen. »Die aus ihnen Gemusterten« gibt den Wechsel vom singularischen Suffix in וּצְבָאוֹ zum pluralischen Bezug in וּפְקֻדֵיהֶם wieder und fügt »Männer« nicht ausdrücklich hinzu.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '41.500'
  rationale: Die Zahl wird in der im modernen Deutschen üblichen Schreibweise wiedergegeben.
