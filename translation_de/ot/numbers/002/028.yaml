  source_fidelity: 'Die Übersetzung bildet die hebräische Listenformel genau ab: וּצְבָאוֹ ist mit „seine Heerschar“ als organisierter militärischer Stammesverband wiedergegeben, und וּפְקֻדֵיהֶם mit „die aus ihnen Gemusterten“ als die aus dem Verband gezählten bzw. gemusterten Personen. Der Wechsel vom singularischen Suffix bei „seine“ zum pluralischen Bezug bei „ihnen“ bleibt erhalten. Die Zahl 41.500 entspricht אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת exakt.'
