lexical_decisions:
- source_word: מַטֵּה
  choice: Stamm
  rationale: Im Zusammenhang der Lagerordnung bezeichnet מַטֶּה eine Stammesabteilung und keinen wörtlichen Stab.
- source_word: זְבוּלֻן
  choice: Sebulon
  rationale: Der Eigenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: וְנָשִׂיא
  choice: und der Anführer
  rationale: נָשִׂיא bezeichnet hier das anerkannte Oberhaupt des Stammes. „Anführer“ ist verständlich und vermeidet den irreführend monarchischen Beiklang von „Fürst“.
- source_word: לִבְנֵי זְבוּלֻן
  choice: der Söhne Sebulons
  rationale: Die Präposition ל kennzeichnet in dieser verwaltungssprachlichen Formel die Zugehörigkeit beziehungsweise Zuständigkeit. Die Wiedergabe bleibt nah am hebräischen Stammesausdruck und bewahrt dessen männliche Abstammungssprache.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Der Personenname wird in seiner üblichen deutschen biblischen Form wiedergegeben.
- source_word: בֶּן חֵלֹן
  choice: der Sohn Helons
  rationale: Die hebräische Vatersnamensformel wird in natürlichem Deutsch wiedergegeben.
