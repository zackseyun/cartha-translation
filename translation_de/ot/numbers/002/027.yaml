base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: de
  text: Neben ihm lagert der Stamm Ascher[a]. Der Anführer der Söhne Aschers ist Pagiël, der Sohn Ochrans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An seiner Seite lagert der Stamm Ascher.“ Die hebräische Präposition bezeichnet hier im Lageraufbau eine Position daneben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: lagert
  rationale: Das substantivierte Partizip bezeichnet die dort Lagernden. Im Deutschen ergibt die auf den Stamm bezogene Singularform eine natürliche und sachlich genaue Formulierung.
- source_word: עָלָיו
  choice: Neben ihm
  rationale: עַל mit Suffix bezeichnet in dieser Lagerordnung die räumliche Nähe beziehungsweise Anordnung an der Seite; „neben ihm“ gibt dies idiomatisch wieder und bewahrt den Rückbezug.
- source_word: מַטֵּה
  choice: Stamm
  rationale: Im Kontext der Zählung und Lagerordnung bezeichnet מַטֶּה eine Stammesabteilung Israels.
- source_word: אָשֵׁר
  choice: Ascher
  rationale: Der Stammes- und Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: נָשִׂיא
  choice: Anführer
  rationale: נָשִׂיא bezeichnet hier das anerkannte Oberhaupt eines Stammes; „Anführer“ ist verständlich und vermeidet den irreführend dynastischen Klang von „Fürst“.
- source_word: לִבְנֵי אָשֵׁר
  choice: der Söhne Aschers
  rationale: Die Formulierung bewahrt die hebräische Abstammungsbezeichnung und gibt die Zugehörigkeit des Anführers idiomatisch wieder.
- source_word: פַּגְעִיאֵל
  choice: Pagiël
  rationale: Transliteration des Eigennamens; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: בֶּן עָכְרָן
  choice: der Sohn Ochrans
  rationale: Direkte und natürliche Wiedergabe der hebräischen Vatersohnangabe.
