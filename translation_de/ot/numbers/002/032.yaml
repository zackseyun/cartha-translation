base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: de
  text: Dies sind die gemusterten Männer der Israeliten nach ihren Vaterhäusern.[a] Die Gesamtzahl aller gemusterten Männer der Lager nach ihren Heeresverbänden[b] betrug 603.550.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach ihren Vaterhäusern«, das heißt nach ihren väterlichen Sippenverbänden.'
    reason: Die Fußnote erläutert den institutionellen, patrilinearen Sinn von »Vaterhäusern«.
  - marker: b
    text: 'Oder: »nach ihren Abteilungen« beziehungsweise »nach ihren Heerscharen«.'
    reason: Die Alternativen zeigen die Bedeutungsbreite von צְבָאוֹת zwischen organisatorischer Gliederung und militärischem Verband.
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: die gemusterten Männer
  rationale: Die Form bezeichnet hier die bei der Zählung erfassten Personen. Aus dem unmittelbaren Zusammenhang von Numeri 1–2 geht hervor, dass wehrfähige Männer gezählt wurden; »gemustert« bewahrt zugleich den militärisch-organisatorischen Bezug.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Das natürliche moderne Deutsch gibt die hebräische Volksbezeichnung verständlich wieder, ohne mit »Söhne Israels« im Deutschen ausschließlich leibliche Söhne nahezulegen.
- source_word: לְבֵית אֲבֹתָם
  choice: geordnet nach ihren Großfamilien
  rationale: בֵּית אָב bezeichnet hier einen patrilinearen Sippen- beziehungsweise Großfamilienverband, nicht bloß ein einzelnes Elternhaus. »Großfamilien« ist im heutigen Deutsch verständlich; eine Fußnote hält die wörtlichere Wiedergabe fest.
- source_word: הַמַּחֲנֹת
  choice: in den Lagern
  rationale: Gemeint sind die geordneten Stammeslager rund um das Heiligtum.
- source_word: לְצִבְאֹתָם
  choice: geordnet nach ihren Heeresverbänden
  rationale: צְבָאוֹת bezeichnet organisierte, militärisch geprägte Verbände. »Heeresverbände« wahrt diesen Sinn, ohne einen aktuellen Kampfeinsatz zu behaupten.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: '603.550'
  rationale: Die Ziffernschreibung ist im modernen Deutschen bei einer großen exakten Zählung klar und gut erfassbar; der Punkt entspricht der deutschen Tausendergliederung.
theological_decisions:
- issue: Geschlecht der bei der Musterung Erfassten
  choice: gemusterte Männer
  alternative: die Gemusterten; die Gezählten
  rationale: Obwohl in diesem Vers kein eigenes Wort für »Männer« steht, bestimmt der unmittelbare Zählungskontext die Erfassten als Männer ab zwanzig Jahren, die zum Heer ausziehen konnten. Die Ergänzung macht den historisch gemeinten Personenkreis sichtbar.
- issue: Militärischer Sinn von צְבָאוֹת
  choice: Heeresverbände
  alternative: Abteilungen; Scharen
  rationale: Der Ausdruck trägt in diesem Kontext einen militärisch-organisatorischen Sinn. Die gewählte Formulierung bewahrt ihn, ohne daraus eine Aussage über eine gegenwärtige Kriegshandlung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Lesbarkeit leicht geglättet; »insgesamt belief sich die Zahl … auf« gibt die hebräische Summenformel natürlich wieder. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
