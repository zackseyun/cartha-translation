base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: de
  text: Neben ihm war der Stamm Manasse. Der Anführer der Söhne Manasses war Gamliel, Sohn Pedazurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָיו
  choice: Neben ihm lagerte
  rationale: עַל mit Pronominalsuffix bezeichnet im Zusammenhang der Lagerordnung die räumliche Nachbarschaft. Das Verb „lagerte“ wird aus dem Kontext ergänzt und ergibt im Deutschen einen natürlichen, präzisen Satz.
- source_word: מַטֵּה מְנַשֶּׁה
  choice: der Stamm Manasse
  rationale: מַטֶּה bezeichnet hier die organisierte Stammeseinheit, nicht einen Stab. Der Stammesname bleibt in der üblichen deutschen Form unübersetzt.
- source_word: וְנָשִׂיא
  choice: Der Anführer
  rationale: נָשִׂיא bezeichnet hier das eingesetzte Oberhaupt des Stammes. „Anführer“ ist modern und vermeidet die monarchische Nebenbedeutung von „Fürst“.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: der Söhne Manasses
  rationale: Die Wendung wird entsprechend dem hebräischen בנים als Abstammungsbezeichnung wiedergegeben; der Genitiv ist nach „Anführer“ idiomatisch.
- source_word: גַּמְלִיאֵל
  choice: Gamliël
  rationale: Der Eigenname wird nach geläufiger deutscher biblischer Namensform transliteriert; das Trema verdeutlicht die getrennte Aussprache.
- source_word: בֶּן פְּדָהצוּר
  choice: der Sohn Pedazurs
  rationale: Die Patronymformel wird in natürlichem Deutsch mit Artikel wiedergegeben; Pedazur folgt der geläufigen deutschen Transkription.
