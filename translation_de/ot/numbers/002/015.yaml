  text: 'Seine Heerschar[a] und die von ihnen Gemusterten[b]: 45.650 Mann.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „sein Heer“ oder „seine Abteilung“; das hebräische Wort kann einen organisierten militärischen Verband bezeichnen.
