  naturalness: „Seine Heerschar … zählte 45.650 Mann“ ist verständlich, doch die Verbindung mit „also die von ihnen Gemusterten“ klingt syntaktisch schwer und verschiebt die koordinierende Listenform. Eine knappe Formulierung mit Doppelpunkt ist im Kontext der Zählungsauflistung natürlich und klar.
