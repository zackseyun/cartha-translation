source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֞ים לְ/מַחֲנֵ֣ה רְאוּבֵ֗ן מְאַ֨ת אֶ֜לֶף וְ/אֶחָ֨ד וַ/חֲמִשִּׁ֥ים אֶ֛לֶף וְ/אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים לְ/צִבְאֹתָ֑/ם וּ/שְׁנִיִּ֖ם יִסָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: de
  text: Alle Gemusterten des Lagers Rubens waren 151.450, nach ihren Heeresverbänden.[a] Sie sollen als Zweite aufbrechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nach ihren Heerscharen; auch: nach ihren Truppenverbänden.'
    reason: Das hebräische צְבָאוֹת kann militärische Heere, Scharen oder gegliederte Truppenverbände bezeichnen; die genaue organisatorische Größenordnung bleibt offen.
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Alle Gemusterten
  rationale: הַפְּקֻדִים bezeichnet die bei der Zählung erfassten beziehungsweise zum Heeresdienst gemusterten Personen. „Alle Gemusterten“ ist knapp, sachgerecht und passt zum militärischen Kontext.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: des Lagers Rubens
  rationale: Die Zugehörigkeitsbeziehung wird im Deutschen natürlich mit dem Genitiv wiedergegeben.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: '151.450'
  rationale: Die Ziffernschreibung gibt die genaue Summe übersichtlich wieder; der Punkt entspricht der deutschen Schreibkonvention für Tausendergruppen.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צְבָאוֹת bezeichnet hier die militärisch geordneten Einheiten des Lagers. „Heeresverbände“ wahrt den militärischen Sinn, ohne eine bestimmte Größe wie bei „Kompanien“ vorauszusetzen.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: Sie sollen als Zweite aufbrechen
  rationale: Die ungewöhnliche hebräische Kardinalform hat im Zusammenhang ordinalen Sinn und bezeichnet die zweite Stelle in der Aufbruchordnung. „Aufbrechen“ gibt נסע im Kontext der Wüstenwanderung natürlich wieder.
