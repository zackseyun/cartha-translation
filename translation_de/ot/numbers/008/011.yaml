    rationale: Das hebräische וְהָיוּ mit לַעֲבֹד kann den vorgesehenen Dienst bzw. die Folge der Darbringung ausdrücken. Eine koordinierte Soll-Aussage bewahrt diese Offenheit besser.
  - severity: low
    issue: Die Fußnote verwendet „vonseiten der Israeliten“ als erste Alternative.
    rationale: Für die Herkunfts-/Entnahmebedeutung von מֵאֵת ist „von den Israeliten“ die direkte und idiomatische deutsche Alternative. Die mögliche repräsentative Nuance kann weiterhin vorsichtig als „für die Israeliten“ erläutert werden.
