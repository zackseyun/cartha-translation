revisions:
- from: Aaron soll die Leviten als Schwingopfer vor Jahwe darbringen, aus der Mitte der Israeliten[a], damit sie den Dienst für Jahwe verrichten.
  to: Aaron soll die Leviten als Schwingopfer vor Jahwe darbringen, von den Israeliten[a], und sie sollen den Dienst für Jahwe verrichten.
  rationale: Die Revision hält die kultische Terminologie und die knappe, würdige Satzführung bei. „Von den Israeliten“ gibt מֵאֵת בְּנֵי יִשְׂרָאֵל unmittelbarer wieder; die kontextuell naheliegende Lesart „aus der Mitte“ sowie die mögliche stellvertretende Nuance bleiben in der Fußnote erhalten. Der Schluss wird als koordinierte Soll-Aussage übersetzt, um die im Hebräischen mögliche Zweck-/Folgebeziehung nicht einseitig als untergeordneten Zweck festzulegen.
