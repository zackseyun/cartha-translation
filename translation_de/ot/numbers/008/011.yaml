source:
  edition: WLC
  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: de
  text: Aaron soll die Leviten als Schwingopfer vor Jahwe darbringen, von den Israeliten[a], und sie sollen den Dienst für Jahwe verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Mitte der Israeliten“. Die hebräische Wendung bezeichnet ihre Herkunft aus Israel; im Zusammenhang kann zugleich anklingen, dass die Leviten den Dienst für die Israeliten vor Jahwe verrichten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: als Schwingopfer darbringen
  rationale: Das Verb נוף und das verwandte Substantiv תְּנוּפָה bezeichnen eine rituelle Darbringung. „Schwingopfer“ bewahrt den kultischen Fachbegriff; „darbringen“ vermeidet die missverständliche Vorstellung, die Leviten selbst würden körperlich hin- und hergeschwenkt.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche deutsche Bezeichnung für diese Stammes- und Dienstgruppe.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet die Gegenwart Jahwes; „vor“ gibt die feste hebräische Raum- und Kultformel knapp wieder.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: aus der Mitte der Israeliten
  rationale: מֵאֵת kann hier die Herkunft beziehungsweise Entnahme aus der Gemeinschaft bezeichnen. Die Formulierung ist im modernen Deutschen natürlich und lässt den repräsentativen Zusammenhang erkennen, ohne ihn zur alleinigen Deutung zu machen.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: damit sie den Dienst für Jahwe verrichten
  rationale: Die Zweck- beziehungsweise Ergebnisbeziehung wird idiomatisch mit „damit“ ausgedrückt. „Den Dienst verrichten“ bildet die hebräische Verbindung des Verbs עבד mit dem verwandten Substantiv עֲבֹדָה in natürlichem Deutsch ab.
theological_decisions:
- issue: Die Leviten als menschliches תְּנוּפָה-Schwingopfer
  choice: „als Schwingopfer darbringen“
  alternative: „als Schwingopfer schwingen“ oder allgemeiner „als Opfer darbringen“
  rationale: Die gewählte Fassung erhält die kultische Opferkategorie, ohne anzudeuten, die Leviten würden getötet oder notwendig körperlich geschwenkt.
- issue: Bedeutung von מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: „aus der Mitte der Israeliten“
  alternative: „von den Israeliten“ beziehungsweise „für die Israeliten“
  rationale: Der Kontext spricht dafür, dass die Leviten aus Israel genommen und Jahwe übergeben werden; zugleich kann ihre stellvertretende Funktion mitschwingen. Die Fußnote bewahrt diese Deutungsmöglichkeit.
- issue: Verhältnis des letzten Satzteils zum Darbringungsritus
  choice: 'Zweckangabe: „damit sie … verrichten“'
  alternative: 'Folge/Futur: „und sie sollen … verrichten“'
  rationale: לַעֲבֹד bezeichnet den Zweck ihrer rituellen Darbringung. Die deutsche Zweckkonstruktion gibt den Zusammenhang klar wieder, ohne eine weitergehende theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der traditionelle kultische Fachausdruck „Schwingopfer“ bleibt erhalten, wird jedoch mit dem natürlichen Verb „darbringen“ verbunden. „Israeliten“ gibt den kollektiven Ausdruck בְּנֵי יִשְׂרָאֵל im heutigen Deutsch verständlich wieder.
