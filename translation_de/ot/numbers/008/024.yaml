base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: de
  text: 'Für die Leviten gilt Folgendes: Von fünfundzwanzig Jahren an soll jeder von ihnen zum Dienst antreten[a], um am Zelt der Begegnung Dienst zu leisten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit einer hebräischen Dienstformel: „um Dienst zu leisten“. Die Wendung hat militärische Anklänge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: Für die Leviten gilt Folgendes
  rationale: Die Formulierung leitet eine verbindliche Regelung für die Leviten ein. Diese deutsche Wendung gibt den rechtlich-anweisenden Charakter natürlich und präzise wieder.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: Vom Alter von fünfundzwanzig Jahren an
  rationale: Die hebräische Altersformel bezeichnet die Untergrenze. Die gewählte Fassung ist in modernem Standarddeutsch klar und wahrt den Ausgangspunkt von fünfundzwanzig Jahren.
- source_word: יָבוֹא
  choice: soll ... antreten
  rationale: Das Verb bedeutet grundsätzlich „kommen/eintreten“. In Verbindung mit der folgenden Dienstformel gibt „antreten“ den Eintritt in den geregelten Dienst idiomatisch wieder.
- source_word: לִצְבֹא צָבָא
  choice: zum Dienst ... antreten
  rationale: Die figura etymologica bezeichnet die Übernahme eines geordneten Dienstes und trägt militärische Anklänge. „Zum Dienst antreten“ bewahrt diese Färbung, ohne den kultischen Zusammenhang als eigentlichen Kriegsdienst misszuverstehen.
- source_word: בַּעֲבֹדַת
  choice: bei der Arbeit
  rationale: עֲבֹדָה bezeichnet hier die zugewiesene Arbeit beziehungsweise den Dienst am Heiligtum. „Arbeit“ vermeidet eine schwerfällige Wiederholung von „Dienst“ und hält den Aufgabencharakter fest.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Diese etablierte und quellennahe Wiedergabe bezeichnet das Heiligtumszelt als Ort der Begegnung.
theological_decisions:
- issue: Singularisches Verb bei kollektivem Bezug auf die Leviten
  choice: jeder von ihnen soll ... antreten
  alternative: sie sollen ... antreten
  rationale: Das Hebräische verwendet ein Verb im Singular innerhalb einer Vorschrift für die Leviten als Gruppe. „Jeder von ihnen“ macht den distributiven Einzelsinn im Deutschen deutlich und bewahrt zugleich den Singular.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-anweisendem Ton. Die Formulierung ist für heutige Leser verständlich, wahrt aber die dienstlich-militärische Färbung der hebräischen Wendung.
