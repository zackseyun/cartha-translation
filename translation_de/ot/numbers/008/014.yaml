  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: de
  text: So sollst du die Leviten aus der Mitte der Söhne Israels[a] aussondern[b], und die Leviten sollen mir gehören[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Israeliten“; wörtlich: „der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „absondern“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Leviten sollen mein sein“; wörtlich: „und die Leviten werden/sollen mir sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: So sollst du … aussondern
  rationale: Das Hifil von בדל bezeichnet das Trennen beziehungsweise Aussondern. „Aussondern“ gibt die gezielte Herausnahme aus einer größeren Gruppe natürlich und präzise wieder; das einleitende וְ wird im Verfahrenszusammenhang mit „So“ wiedergegeben.
- source_word: אֶת הַלְוִיִּם
  choice: die Leviten
  rationale: Der bestimmte Plural wird mit der im Deutschen üblichen Bezeichnung „die Leviten“ wiedergegeben.
- source_word: מִתּוֹךְ
  choice: aus der Mitte
  rationale: Die Wendung bezeichnet die Herausnahme aus einer größeren Gemeinschaft und entspricht der räumlich-gruppierenden Ausdrucksweise des Hebräischen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die familiäre hebräische Formulierung wird bewahrt, statt sie im Haupttext zu „Israeliten“ zu verallgemeinern.
- source_word: וְהָיוּ לִי
  choice: und … sollen mir gehören
  rationale: היה mit לִי drückt Zugehörigkeit aus. „Mir gehören“ ist im modernen Deutschen natürlicher als „mein sein“ und fügt keine ausdrücklich kultische Terminologie hinzu.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die Wiederholung des Substantivs im Hebräischen wird zur Wahrung der Betonung beibehalten und nicht durch ein Pronomen ersetzt.
theological_decisions:
- issue: Ob die Stellung der Leviten als Zugehörigkeit oder ausdrücklich als kultische Weihe wiederzugeben ist
  choice: die Leviten sollen mir gehören
  alternative: die Leviten sollen mir geweiht sein
  rationale: Die Konstruktion לִי mit היה bezeichnet unmittelbar Zugehörigkeit. Der kultische Kontext ist relevant, doch der Vers verwendet hier kein ausdrückliches Weihevokabular; daher wird diese Deutung nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt entsprechend dem hebräischen Singular „du“. Die Wiederholung von „die Leviten“ wahrt die emphatische Struktur des Ausgangstextes.
