  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: de
  text: Von fünfzig Jahren an soll er aus dem Dienst bei der Arbeit ausscheiden und nicht mehr dienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „soll er aus dem Dienst der Arbeit zurückkehren“; das hebräische Verb bedeutet „zurückkehren, umkehren“ und bezeichnet hier das Ausscheiden aus dem aktiven Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: Mit fünfzig Jahren aber
  rationale: Die hebräische Altersformel bezeichnet den Zeitpunkt, ab dem die Regel gilt. „Mit fünfzig Jahren“ ist im modernen Deutschen natürlich und präzise; „aber“ gibt den hier abgrenzenden Anschluss von וּ angemessen wieder.
- source_word: יָשׁוּב
  choice: soll er … ausscheiden
  rationale: שׁוב bedeutet wörtlich „zurückkehren/umkehren“, bezeichnet hier mit מִן jedoch das Zurücktreten aus dem aktiven Dienst. „Ausscheiden“ vermittelt diese administrative Bedeutung, ohne einen endgültigen Ausschluss von jeder unterstützenden Tätigkeit zu behaupten.
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: aus dem Arbeitsdienst
  rationale: צָבָא bezeichnet in diesem Zusammenhang den geordneten Dienst der Leviten, nicht Kriegsdienst; עֲבֹדָה bezeichnet die zu verrichtende Arbeit. Das deutsche Kompositum „Arbeitsdienst“ bewahrt beide Sinnkomponenten knapp und verständlich.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: und nicht länger dienen
  rationale: עבד bezeichnet hier die Ausübung des zugewiesenen Dienstes. „Nicht länger dienen“ gibt das Ende des aktiven Pflichtdienstes natürlich wieder und passt zum kultischen Zusammenhang.
theological_decisions:
- issue: Umfang des altersbedingten Ausscheidens
  choice: Ausscheiden aus dem Arbeitsdienst
  alternative: vollständiges Ende jeder Tätigkeit am Heiligtum
  rationale: Der Vers beendet den regulären aktiven Dienst, sagt aber für sich genommen nicht, dass keinerlei unterstützende Mitwirkung mehr möglich sei; der folgende Vers unterscheidet diese Bereiche ausdrücklich. Die Übersetzung vermeidet daher eine weitergehende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Arbeitsdienst“ gibt die hebräische Verbindung zweier Dienstbegriffe kompakt wieder; die Formulierung vermeidet sowohl militärische Assoziationen als auch konfessionell geprägtes Fachvokabular.
