  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: de
  text: Danach kamen die Leviten, um ihren Dienst im Zelt der Begegnung vor Aaron und vor seinen Söhnen zu verrichten. Ganz wie Jahwe Mose in Bezug auf die Leviten geboten hatte, so verfuhren sie mit ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „So taten sie ihnen.“ Gemeint kann sein, dass die vorgeschriebenen Handlungen an den Leviten beziehungsweise für sie vollzogen wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Kennzeichnet natürlich und prägnant die zeitliche Abfolge nach den zuvor geschilderten Reinigungs- und Einsetzungsriten.
- source_word: בָּאוּ הַלְוִיִּם לַעֲבֹד אֶת עֲבֹדָתָם
  choice: kamen die Leviten, um ihren Dienst … zu verrichten
  rationale: „Kamen“ wahrt das gewöhnliche Bewegungsverb, ohne ein Hineingehen ausdrücklich vorauszusetzen. „Den Dienst verrichten“ gibt die kultische Bedeutung wieder und vermeidet im Deutschen die unnatürliche Wiederholung „dienen ihren Dienst“.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Entspricht der Präposition und gibt die feste Heiligtumsbezeichnung מוֹעֵד als Ort der Begegnung wieder.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: vor Aaron und vor seinen Söhnen
  rationale: Bewahrt die wiederholte, wörtliche Orts- beziehungsweise Verhältnisangabe, ohne sie deutend als priesterliche Aufsicht festzulegen.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Ganz wie Jahwe Mose … geboten hatte
  rationale: Gibt den Vergleich von Art und Weise sowie die zeitlich vorausgehende Anordnung idiomatisch wieder.
- source_word: עַל הַלְוִיִּם
  choice: in Bezug auf die Leviten
  rationale: Bezeichnet die Leviten als Gegenstand der an Mose gerichteten Weisung, ohne die Präposition unnötig enger zu bestimmen.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: so verfuhren sie mit ihnen
  rationale: Natürliches Deutsch für die knappe hebräische Wendung; es wahrt sowohl den ungenannten Subjektbezug als auch den Bezug der Handlung auf die Leviten, ohne eine bestimmte Einzelhandlung einzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ gibt ihn in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Mehrdeutigkeit von כֵּן עָשׂוּ לָהֶם
  choice: so verfuhren sie mit ihnen
  alternative: so taten sie es für sie / so handelten sie an ihnen
  rationale: Das Hebräische nennt das Subjekt nicht erneut und lässt das Verhältnis der Handlung zu den Leviten knapp. Die gewählte Formulierung bewahrt diese Offenheit, statt die Handelnden oder die genaue Art der Riten ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Fachsprache wird verständlich wiedergegeben; die knappe Mehrdeutigkeit des letzten hebräischen Satzteils bleibt erhalten.
