source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ כֵּן֙ אַהֲרֹ֔ן אֶל מוּל֙ פְּנֵ֣י הַ/מְּנוֹרָ֔ה הֶעֱלָ֖ה נֵרֹתֶ֑י/הָ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: de
  text: 'Aaron tat es so: Zur Vorderseite des Leuchters hin richtete er seine Lampen aus[a] – genauso, wie Jahwe es Mose geboten hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »setzte er seine Lampen ein«; möglicherweise auch: »zündete er seine Lampen an«. Das hebräische Verb bedeutet wörtlich, dass er die Lampen hinaufgehen ließ, und kann hier ihr Anbringen oder ihr Anzünden bezeichnen. Die Richtungsangabe kann auch mit »gegenüber der Vorderseite« oder »der Vorderseite zugewandt« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן אַהֲרֹן
  choice: Aaron tat es so
  rationale: Die Wendung nimmt die vorherige Anweisung auf und erklärt, dass Aaron ihr entsprechend handelte; die deutsche Formulierung ist natürlich und bewahrt diesen Rückbezug.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: zur Vorderseite des Leuchters hin
  rationale: Die zusammengesetzte Präposition bezeichnet die Ausrichtung auf die Vorderseite beziehungsweise Front des Leuchters, ohne die genaue räumliche Anordnung stärker festzulegen als der hebräische Text.
- source_word: הַמְּנוֹרָה
  choice: Leuchter
  rationale: Im Heiligtumskontext ist dies eine geläufige und verständliche deutsche Bezeichnung für den Lampenträger; eine bloße Umschrift als »Menora« ist nicht erforderlich.
- source_word: הֶעֱלָה נֵרֹתֶיהָ
  choice: richtete er seine Lampen aus
  rationale: Das Hifil von עלה kann bei Lampen ihr Anbringen beziehungsweise Aufsetzen und kontextuell auch ihr Anzünden bezeichnen. Zusammen mit der Richtungsangabe wird im Deutschen die in Vers 2 verlangte Ausrichtung natürlich wiedergegeben, während die alternative Deutung in der Fußnote erhalten bleibt.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: genauso, wie Jahwe es Mose geboten hatte
  rationale: Die Formulierung betont die genaue Übereinstimmung mit dem zuvor erteilten göttlichen Gebot; das Plusquamperfekt verdeutlicht die zeitliche Folge.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den Charakter als persönlicher Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הֶעֱלָה im Zusammenhang mit den Lampen
  choice: richtete ... aus
  alternative: setzte ... ein; zündete ... an
  rationale: Der unmittelbare Zusammenhang handelt von der Richtung, in die die Lampen leuchten sollen. Die Übersetzung stellt diese Funktion in den Vordergrund, lässt die lexikalisch mögliche Deutung als Anzünden jedoch ausdrücklich offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält Aarons Gehorsam und die Ausrichtung der Lampen im Vordergrund. Die echte lexikalische und räumliche Mehrdeutigkeit wird nicht im Haupttext überladen, sondern in einer unmittelbar markierten Fußnote bewahrt.
