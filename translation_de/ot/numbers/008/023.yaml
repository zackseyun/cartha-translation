  yaml_path: translation/ot/numbers/008/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Dann sprach Jahwe zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählung ein. „Dann sprach“ gibt sowohl die zeitliche Abfolge als auch das Verb דבר in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die idiomatische deutsche Wiedergabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird vor der in Vers 24 folgenden direkten Rede im heutigen Deutsch natürlich durch einen Doppelpunkt ausgedrückt; „indem er sagte“ wäre unnötig schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift; „der HERR“ ersetzt den Namen durch einen Titel, während „Jehova“ auf einer späteren Mischlesung beruht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitung bleibt erhalten, während לֵאמֹר idiomatisch durch den Doppelpunkt vertreten wird. Da „Jahwe“ im Haupttext steht, ist keine Fußnote zu einer abweichenden Wiedergabe erforderlich.
