base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: de
  text: Dann sollen sie einen jungen Stier und sein Speiseopfer aus mit Öl vermengtem Feinmehl nehmen; und du sollst einen zweiten jungen Stier als Sündopfer[a] nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Der hebräische Ausdruck חַטָּאת kann im Zusammenhang priesterlicher Rituale das Sünd- beziehungsweise Reinigungsopfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Dann sollen sie ... nehmen
  rationale: Das Qal-Perfekt mit vorangestelltem Waw führt die rituelle Anweisung fort. „Dann“ gibt die Abfolge natürlich wieder; „sollen“ drückt den anweisenden Charakter aus.
- source_word: פַּר בֶּן בָּקָר
  choice: einen jungen Stier
  rationale: Die wörtliche Wendung „Stier, Sohn des Rindes“ bezeichnet einen jungen Stier. Der unbestimmte Artikel genügt im Deutschen; der später genannte „zweite“ Stier macht die Zählung deutlich.
- source_word: וּמִנְחָתוֹ
  choice: und das dazugehörige Speiseopfer
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang ein Speise- beziehungsweise Getreideopfer. Das maskuline Suffix verweist auf den ersten Stier; „dazugehörig“ macht diese Zuordnung idiomatisch deutlich.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Übliche deutsche Wiedergabe des kultischen Begriffs für fein gemahlenes Mehl.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: das mit Öl vermengt ist
  rationale: Die Formulierung bewahrt die rituelle Zubereitungsangabe und klingt würdig sowie gegenwärtig.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: und du sollst einen zweiten jungen Stier ... nehmen
  rationale: Der Wechsel zur zweiten Person Singular wird ausdrücklich bewahrt. שֵׁנִי wird mit „zweiten“ wiedergegeben.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: „Sündopfer“ ist die vertraute Bezeichnung dieser priesterlichen Opferart; die mögliche funktionsbezogene Wiedergabe „Reinigungsopfer“ wird in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der priesterlichen Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der hebräische Ausdruck ist traditionell als „Sündopfer“ bekannt, kann im priesterlichen Ritual aber besonders die reinigende Funktion des Opfers bezeichnen. Der Haupttext wahrt die geläufige Benennung; die Fußnote erhält die sachlich relevante Alternative, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der Wechsel von der dritten Person Plural („sie“) zur zweiten Person Singular („du“) bleibt erhalten. „Speiseopfer“ ist als etablierter kultischer Fachausdruck gewählt; „dazugehörig“ verdeutlicht den Bezug des Pronominalsuffixes auf den ersten Stier.
