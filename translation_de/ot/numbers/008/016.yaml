  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: de
  text: Denn sie sind mir ganz und gar gegeben, aus der Mitte der Söhne Israels[c]. Anstelle eines jeden Erstgeborenen unter den Söhnen Israels, das den Mutterschoß öffnet[b], habe ich sie für mich genommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Den Mutterschoß öffnen“ ist eine hebräische Ausdrucksweise für das zuerst Geborene.
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „Israeliten“ oder „Volk Israel“; wörtlich: „Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: ganz und gar gegeben
  rationale: Die Wiederholung des passiven Partizips verstärkt die Aussage. „Ganz und gar gegeben“ gibt diese Betonung in natürlichem Deutsch wieder, ohne die im Deutschen schwerfällige Wortwiederholung nachzuahmen.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: aus der Mitte der Söhne Israels
  rationale: מִתּוֹךְ bezeichnet die Auswahl aus einer Gruppe; „aus der Mitte“ bewahrt dieses räumlich-korporative Bild. „Söhne Israels“ gibt die hebräische Familienbezeichnung formal wieder.
- source_word: תַּחַת
  choice: anstelle
  rationale: 'Die Präposition bezeichnet hier Stellvertretung beziehungsweise Ersetzung: Die Leviten werden anstelle der Erstgeborenen genommen.'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: jedes, das den Mutterschoß öffnet
  rationale: Die Formulierung bewahrt das hebräische Bild für das zuerst aus dem Mutterleib Hervorgehende; die folgende Apposition erklärt es als das Erstgeborene.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: jedes Erstgeborenen unter den Söhnen Israels
  rationale: Die appositionelle Wendung erläutert das vorausgehende Bild. Der Genitiv wird durch „anstelle“ verlangt und „unter“ gibt die Zugehörigkeit zur Gesamtgruppe verständlich wieder.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: habe ich sie für mich genommen
  rationale: Das Perfekt bezeichnet die vollzogene Inanspruchnahme; das abschließende לִי hebt Gottes persönlichen Anspruch hervor, den „für mich“ idiomatisch ausdrückt.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die formale Familienbezeichnung des Hebräischen bleibt sichtbar, ohne ihren korporativen Bezug auf Israel zu leugnen; eine Fußnote nennt geläufige sinngemäße Wiedergaben.
- issue: Verhältnis der Leviten zu den Erstgeborenen
  choice: anstelle
  alternative: im Austausch für
  rationale: תַּחַת drückt im Kontext eine stellvertretende Zuordnung aus. „Anstelle“ benennt diese klar, ohne über den Vers hinaus eine bestimmte Sühne- oder Opfertheorie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Wiederholung wird idiomatisch wiedergegeben; das hebräische Bild vom Öffnen des Mutterschoßes und die formale Bezeichnung „Söhne Israels“ bleiben erhalten und werden durch Fußnoten erläutert.
