source:
  edition: WLC
  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: de
  text: Dann sollen die Leviten ihre Hände auf die Köpfe der Stiere legen. Bringe den einen als Sündopfer[a] und den anderen als Brandopfer für Jahwe dar, um für die Leviten Sühne zu erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann in priesterlichen Zusammenhängen das mit Sünde und Reinigung verbundene Opfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: sollen … ihre Hände … legen
  rationale: Die Wendung bezeichnet im Opferkontext das rituelle Auflegen der Hände; die konkrete körperliche Handlung bleibt ausdrücklich erhalten.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: auf die Köpfe der Stiere
  rationale: Obwohl רֹאשׁ formal im Singular steht, ist bei mehreren Stieren distributiv jeder einzelne Kopf gemeint; der deutsche Plural gibt dies natürlich wieder.
- source_word: וַעֲשֵׂה
  choice: Bringe … dar
  rationale: Der singularische Imperativ richtet sich an den Amtsträger; mit Opfern als Objekt ist „darbringen“ die natürliche kultische Entsprechung.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Dies ist die geläufige deutsche Bezeichnung für das betreffende Opfer; die ebenfalls mögliche funktionale Wiedergabe „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte und verständliche deutsche Wiedergabe des vollständig verbrannten Opfers.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier den Empfänger beziehungsweise die Widmung des Opfers; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: um für die Leviten Sühne zu erwirken
  rationale: Die Formulierung wahrt den kultischen Sinn von כפר, ohne eine bestimmte Theorie der Sühne festzulegen; „für“ bezeichnet die Begünstigten der Handlung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im modernen Deutschen direkt und in einer verbreiteten wissenschaftlichen Form wieder.
- issue: Bedeutung von חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck kann sowohl auf Sünde als auch auf kultische Reinigung bezogen sein. Die Hauptübersetzung verwendet die traditionelle Opferbezeichnung, während die Fußnote die sachlich mögliche Alternative offenhält.
- issue: Bedeutung von כפר
  choice: Sühne erwirken
  alternative: entsühnen; Sühne schaffen
  rationale: Die Übersetzung erhält die kultisch-theologische Spannung des Verbs und legt weder dessen genaue Wirkungsweise noch eine spätere dogmatische Sühnetheorie fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom pluralischen Auftrag an die Leviten zum singularischen Imperativ an den Amtsträger bleibt erhalten. Etablierte kultische Begriffe werden verwendet, während echte lexikalische Mehrdeutigkeit durch die Fußnote sichtbar bleibt.
