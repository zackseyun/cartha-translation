  terminology: „Leviten“, „Zelt der Begegnung“, „Sühne erwirken“, „Plage“ und „Heiligtum“ sind im kultischen Kontext sachgerecht. Die Fußnote zu „Heiligtum“ bewahrt sinnvoll die Reichweitenoffenheit von הַקֹּדֶשׁ. Die Fußnote zur Wiederholung von נתן erklärt die im Deutschen nur teilweise nachbildbare hebräische Wortwiederholung angemessen.
