source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: de
  text: Und ich habe die Leviten als Gabe Aaron und seinen Söhnen aus der Mitte der Söhne Israels gegeben[a], damit sie den Dienst der Söhne Israels am Zelt der Begegnung verrichten und für die Söhne Israels Sühne erwirken, sodass keine Plage über die Söhne Israels kommt, wenn die Söhne Israels sich dem Heiligtum nähern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht zweimal dieselbe Wortwurzel: „Ich habe die Leviten als Gegebene … gegeben.“ Dadurch wird nachdrücklich hervorgehoben, dass die Leviten selbst als Gabe übergeben werden.'
    reason: Die deutsche Formulierung „als Gabe … gegeben“ bildet das hebräische Wortspiel natürlich, aber nicht vollständig formal ab.
  - marker: b
    text: „Heiligtum“ kann hier auch mit „das Heilige“ beziehungsweise „der heilige Bereich“ wiedergegeben werden.
    reason: Das hebräische הַקֹּדֶשׁ lässt den genauen Umfang des bezeichneten heiligen Bereichs offen.
lexical_decisions:
- source_word: וָאֶתְּנָה ... נְתֻנִים
  choice: habe ... als Gabe ... gegeben
  rationale: Die Verbindung bewahrt die Wiederholung der Wurzel נתן und gibt zugleich in natürlichem Deutsch den Nachdruck wieder, dass die Leviten selbst als Gabe übergeben werden.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Aaron und seinen Söhnen
  rationale: Der Dativ gibt den indirekten Empfänger beziehungsweise Nutznießer ohne zusätzliche Präposition idiomatisch wieder.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: aus der Mitte der Söhne Israels
  rationale: Die Wendung macht deutlich, dass die Leviten aus Israel ausgewählt werden, und bewahrt die formale Bezeichnung בני ישראל.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: damit sie den Dienst ... verrichten
  rationale: Die Zweckangabe und die kultische Dienstleistung werden klar und würdig ausgedrückt; die hebräische Verbindung von Verb und stammverwandtem Substantiv lässt sich im Deutschen nicht natürlich wörtlich nachbilden.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: Das ב kann im Kontext den Dienstort bezeichnen. „Am“ vermeidet die missverständliche Behauptung, sämtliche Aufgaben würden im Inneren des Zeltes ausgeübt.
- source_word: וּלְכַפֵּר עַל
  choice: und ... Sühne erwirken
  rationale: כפר bezeichnet hier eine kultische Sühnfunktion. „Sühne erwirken“ bewahrt diese Aussage, ohne den genauen Mechanismus über den Wortlaut hinaus festzulegen.
- source_word: נֶגֶף
  choice: Plage
  rationale: Im Zusammenhang mit unerlaubter Annäherung an das Heilige bezeichnet das Wort eine von Gott verhängte schwere oder tödliche Heimsuchung; „Plage“ ist knapp und sachgerecht.
- source_word: בְּגֶשֶׁת
  choice: wenn ... sich ... nähern
  rationale: Die Präposition ב mit dem Infinitiv constructus wird als temporaler Nebensatz natürlich wiedergegeben.
- source_word: הַקֹּדֶשׁ
  choice: Heiligtum
  rationale: Im Kontext bezeichnet das substantivierte „Heilige“ den heiligen Bereich beziehungsweise das Heiligtum. Die konkrete räumliche Bedeutung wird gewahrt.
theological_decisions:
- issue: Sühnfunktion der Leviten
  choice: Der Wortlaut weist den Leviten im Zusammenhang mit ihrem Dienst eine Funktion zu, durch die für Israel Sühne erwirkt wird.
  alternative: Die Leviten leisten lediglich praktische Hilfe, während keinerlei Sühnfunktion mit ihrem Dienst verbunden ist.
  rationale: Der Infinitiv לְכַפֵּר steht parallel zum Dienstauftrag. Die Übersetzung bewahrt diese theologische Spannung, ohne die levitische Rolle mit priesterlichen Opferriten gleichzusetzen.
- issue: Bedeutung von עֲבֹדַת בְּנֵי יִשְׂרָאֵל
  choice: „den Dienst der Söhne Israels“
  alternative: „anstelle der Söhne Israels dienen“
  rationale: Der Genitiv kann eine Israel zugehörige beziehungsweise Israel obliegende Dienstaufgabe bezeichnen. Die formale Wiedergabe erhält die Mehrdeutigkeit, statt die Stellvertretung ausdrücklich in den Haupttext einzutragen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die traditionelle Bundesbezeichnung wird formal und geschlechtsgenau bewahrt; im Kontext bezeichnet sie das gesamte Bundesvolk.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der wiederholte Ausdruck „Söhne Israels“ wird trotz stilistischer Schwere beibehalten, weil er die markante Wiederholung des hebräischen Textes und dessen formale Bundesbezeichnung trägt. Die Satzstruktur wurde behutsam gegliedert, ohne die Zweck- und Folgezusammenhänge aufzulösen.
