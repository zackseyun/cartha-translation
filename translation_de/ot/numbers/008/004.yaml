  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: de
  text: 'Und dies war die Machart des Leuchters: aus getriebenem Gold[a]; von seinem Fuß bis zu seinem Blütenwerk war er getrieben. Nach dem Vorbild, das Jahwe Mose gezeigt hatte[b], so fertigte er den Leuchter an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gehämmert« oder »getriebene Arbeit aus Gold«. Das hebräische Wort betont die Bearbeitung durch Hämmern; es kann auch die Vorstellung eines zusammenhängend gearbeiteten Stückes einschließen.'
    reason: lexical_alternative
  - marker: b
    text: »Nach dem Vorbild« kann auch mit »nach der Erscheinung« oder »nach dem Anblick« wiedergegeben werden, die Jahwe Mose gezeigt hatte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: war … gearbeitet
  rationale: Gibt hier die Machart beziehungsweise handwerkliche Ausführung natürlich wieder.
- source_word: הַמְּנֹרָה
  choice: der Leuchter
  rationale: Eine verständliche deutsche Sachbezeichnung für den kultischen Lampenständer.
- source_word: מִקְשָׁה
  choice: getrieben
  rationale: Bezeichnet Metallarbeit, die durch Hämmern geformt wurde; die Wiederholung im Hebräischen bleibt erhalten.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: von seinem Fuß bis zu seiner Blüte
  rationale: Das doppelte עַד bezeichnet den gesamten Umfang; יָרֵךְ meint hier den unteren Fuß, פֶּרַח die blütenförmige Verzierung.
- source_word: כַּמַּרְאֶה
  choice: nach dem Vorbild
  rationale: Im Zusammenhang bezeichnet das Wort die Mose gezeigte Gestalt oder Ausführung; die mögliche Bedeutung »Erscheinung/Ansicht« wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in geläufiger deutscher Form wieder.
- source_word: כֵּן עָשָׂה
  choice: fertigte man … an
  rationale: Bewahrt das aktive Verb, ohne einen im Hebräischen nicht ausdrücklich genannten männlichen Einzeltäter festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Nicht ausdrücklich genanntes Subjekt von עָשָׂה
  choice: man fertigte den Leuchter an
  alternative: er fertigte den Leuchter an
  rationale: Die dritte Person Singular hat im unmittelbaren Satz kein ausdrücklich genanntes menschliches Subjekt. Das unpersönliche »man« wahrt diese Offenheit; »er« wäre ebenfalls grammatisch möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Getrieben« ist der übliche metallhandwerkliche Ausdruck. Die eröffnende Verbindung וְ wird knapp mit »Und so« aufgenommen; die zweimalige Aussage über die getriebene Arbeit bleibt entsprechend der hebräischen Betonung erhalten.
