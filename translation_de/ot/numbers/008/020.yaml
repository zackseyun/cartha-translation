base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: de
  text: So handelten Mose und Aaron und die ganze Gemeinde der Söhne Israels[a] mit den Leviten ganz nach allem, was Jahwe Mose in Bezug auf die Leviten geboten hatte; genauso handelten die Söhne Israels mit ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Israeliten“. Wörtlich steht im Hebräischen „Söhne Israels“, eine feste Bezeichnung für die Gemeinschaft Israels.
    reason: Lexikalische Alternative und Erläuterung der hebräischen Gemeinschaftsbezeichnung.
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: taten / taten es
  rationale: עָשָׂה ist ein weit gefasstes Verb („tun, machen“). Die allgemeine Wiedergabe bewahrt, dass der Vers die zuvor angeordneten Handlungen nicht nochmals einzeln benennt.
- source_word: עֲדַת
  choice: Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Bundesgemeinschaft Israels. „Gemeinde“ gibt diesen gemeinschaftlichen und zugleich formellen Sinn im Pentateuch angemessen wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Die familiäre Formulierung des Hebräischen wird beibehalten. Die geläufigere Wiedergabe „Israeliten“ wird in einer Fußnote genannt.
- source_word: לַלְוִיִּם / לָהֶם
  choice: an den Leviten / an ihnen
  rationale: Die Präposition ל bezeichnet die Leviten als diejenigen, an denen beziehungsweise für die die angeordneten Handlungen vollzogen wurden. „An“ wahrt diese Beziehung, ohne sie ausschließlich als Begünstigung zu deuten.
- source_word: כְּכֹל אֲשֶׁר
  choice: alles, was
  rationale: Im Deutschen drückt die Verbindung mit „alles, was“ die vollständige Übereinstimmung mit dem göttlichen Gebot natürlich aus.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass das Gebot den hier berichteten Handlungen vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: Mose in Bezug auf die Leviten
  rationale: Die Formulierung macht deutlich, dass Jahwes an Mose gerichtetes Gebot die Leviten betraf, ohne die Funktion der Präposition enger festzulegen.
- source_word: כֵּן
  choice: genauso
  rationale: כֵּן hebt die genaue Entsprechung zwischen Gebot und Ausführung hervor; „genauso“ macht diesen Rückbezug im Deutschen klar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die gewählte Fassung erhält die ausdrücklich familiäre und maskuline Form des Ausgangstextes. Die idiomatischere Alternative wird transparent in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Leviten“ und „Söhne Israels“ sowie der zusammenfassende Charakter des hebräischen Verses bleiben erhalten; das Semikolon bildet den nachdrücklichen abschließenden Rückbezug ab.
