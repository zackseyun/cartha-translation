source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: de
  text: Du sollst die Leviten vor Aaron und seine Söhne stellen und sie als Schwingopfer für Jahwe darbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Du sollst sie als Schwingopfer für Jahwe schwingen.« Im Hebräischen stehen das Verb für das rituelle Schwingen beziehungsweise Darbringen und das dazugehörige Substantiv »Schwingopfer« zusammen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Du sollst … stellen
  rationale: 'Der Hifil von עמד ist hier kausativ: Die Leviten werden an ihren Platz vor Aaron und seinen Söhnen gestellt.'
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die bestimmte Bezeichnung der Stammesgruppe wird im Deutschen konventionell so wiedergegeben.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier die räumliche und zeremonielle Stellung in der Gegenwart Aarons und seiner Söhne.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: Das Suffix bezieht sich auf Aaron; בנים meint in diesem priesterlichen Zusammenhang seine Söhne.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: sie als Schwingopfer … darbringen
  rationale: Verb und Substantiv gehören zur kultischen Sprache des Schwingens beziehungsweise der rituellen Darbringung. Die Formulierung ist im Deutschen verständlich und bewahrt mit „Schwingopfer“ den Fachbegriff.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: ל kennzeichnet hier den Empfänger beziehungsweise den, dem die rituelle Darbringung gilt; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Bundesname wird als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Rituelle Handlung an den Leviten
  choice: als Schwingopfer darbringen
  alternative: als Schwingopfer schwingen
  rationale: Die gewählte Fassung wahrt die kultische Opferkategorie, ohne eine bestimmte konkrete Bewegung stärker festzulegen, als es für heutige Leser sicher verständlich ist; die wörtlichere Ausdrucksweise wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Fachbezeichnung „Schwingopfer“ bleibt erhalten; die schwerfällige hebräische Wortwiederholung wird im Haupttext idiomatisch und in der Fußnote transparent wiedergegeben.
