source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: de
  text: Danach sollen die Leviten kommen, um am Zelt der Begegnung zu dienen. Du sollst sie reinigen[a] und sie als Schwingopfer darbringen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rituell rein machen“. Das hebräische Verb bezeichnet hier eine kultische Reinigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Sie sollen in einer zeremoniellen Handlung vor dem HERRN als Schwingopfer präsentiert werden.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Gibt die ausdrückliche zeitliche Abfolge knapp und natürlich wieder.
- source_word: יָבֹאוּ הַלְוִיִּם
  choice: sollen die Leviten kommen
  rationale: Das Verb בוא bezeichnet ihr Kommen beziehungsweise Herantreten; „sollen“ passt zum anweisenden Zukunftsbezug des Zusammenhangs.
- source_word: לַעֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: um am Zelt der Begegnung zu dienen
  rationale: עבד bezeichnet hier den kultischen Dienst. Da אֵת syntaktisch das Zelt als Objekt markiert, im Deutschen aber „dem Zelt dienen“ missverständlich wäre, gibt „am Zelt ... dienen“ Funktion und Ort idiomatisch wieder.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: Du sollst sie reinigen
  rationale: טהר bezeichnet im Kontext eine rituelle Reinigung; „reinigen“ ist verständlich und bewahrt die kultische Bedeutung.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: und sie als Schwingopfer darbringen
  rationale: Die Konstruktion bezeichnet die rituelle Schwingung beziehungsweise Darbringung. „Darbringen“ klingt im Deutschen natürlich, während „Schwingopfer“ das auffällige kultische Bild bewahrt.
theological_decisions:
- issue: Rituelle Sprache bei der Einsetzung der Leviten
  choice: Die konkreten Begriffe „reinigen“ und „Schwingopfer“ bleiben erhalten.
  alternative: Allgemein mit „weihen“ oder „in den Dienst stellen“ umschreiben.
  rationale: Der Vers beschreibt bestimmte kultische Handlungen und nicht nur eine allgemeine Beauftragung. Die Übersetzung bewahrt diesen rituellen Rahmen, ohne ihn durch spätere theologische Kategorien zu erklären.
- issue: Die Leviten selbst als Gegenstand der Schwinghandlung
  choice: „sie als Schwingopfer darbringen“
  alternative: „sie vor dem HERRN präsentieren“
  rationale: Der hebräische Text macht ausdrücklich die Leviten zum direkten Objekt der Schwinghandlung. Die gewählte Formulierung erhält diese ungewöhnliche Aussage; die Fußnote erläutert den zeremoniellen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent wieder; „Schwingopfer“ bewahrt die traditionelle kultische Bildsprache, wird aber zur Verständlichkeit durch eine Fußnote erläutert.
