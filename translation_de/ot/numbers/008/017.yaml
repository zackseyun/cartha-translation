source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: de
  text: Denn jede Erstgeburt unter den Israeliten, sowohl unter Menschen als auch unter Tieren, gehört mir.[a] An dem Tag, als ich jede Erstgeburt im Land Ägypten schlug, habe ich sie für mich geheiligt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Erstgeburt unter den Israeliten, bei Mensch und Tier“. Im Hebräischen stehen „Mensch“ und „Tier“ als Kollektivsingulare einander gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für mich ausgesondert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt die erklärende Funktion im Zusammenhang natürlich wieder.
- source_word: לִי
  choice: mir gehört
  rationale: Die Präpositionalfügung bezeichnet hier Besitz beziehungsweise Anspruch; die deutsche Prädikatsform ist idiomatisch und präzise.
- source_word: כָל בְּכוֹר
  choice: jede Erstgeburt
  rationale: Bewahrt den kollektiven Singular, ohne das im Vers nicht ausdrücklich genannte Wort „männlich“ hinzuzufügen.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: unter den Israeliten
  rationale: Gibt die Zugehörigkeit zum Volk Israel in natürlichem modernem Deutsch wieder; die wörtlichere Form „unter den Söhnen Israels“ wäre hier unnötig schwerfällig und könnte den umfassenden Volksbezug verengen.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: bei Mensch und Tier
  rationale: Erhält den knappen Gegensatz der beiden hebräischen Kollektivbegriffe und bildet die wiederholte Präposition sinngemäß ab.
- source_word: בְּיוֹם
  choice: An dem Tag, als
  rationale: Gibt die zeitliche Einleitung in flüssigem Deutsch wieder, ohne sie zu einem bloßen unbestimmten „als“ zu verkürzen.
- source_word: הַכֹּתִי
  choice: ich … schlug
  rationale: Entspricht dem Verb נכה unmittelbar. „Tötete“ würde die im Kontext klare Folge ausdrücklich in das Verb hineintragen.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Bewahrt das ausdrücklich vorhandene אֶרֶץ und zugleich die geläufige deutsche biblische Wendung.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: habe ich sie für mich geheiligt
  rationale: „Geheiligt“ bewahrt die sakrale Bedeutung des Hifil von קדשׁ; „für mich“ gibt den göttlichen Anspruch aus לִי deutlich wieder.
theological_decisions:
- issue: Mensch-Tier-Gegensatz in אָדָם und בְּהֵמָה
  choice: bei Mensch und Tier
  alternative: unter den Menschen und unter den Tieren
  rationale: Die gewählte Form bewahrt den kollektiven, kategorischen Gegensatz und ist zugleich natürliches, würdiges Deutsch.
- issue: Sakrale Aussage von הִקְדַּשְׁתִּי
  choice: für mich geheiligt
  alternative: für mich ausgesondert
  rationale: „Geheiligt“ erhält den ausdrücklichen Heiligkeitsbezug des hebräischen Stammes. Die Alternative erklärt den Vorgang verständlich, schwächt aber dessen sakrale Dimension ab.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung stellt wie der hebräische Text Gottes Anspruch heraus. Fachsprachlich-konfessionelle Zusätze werden vermieden; die Heiligkeitsaussage bleibt ausdrücklich erhalten.
