  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: de
  text: Die Leviten reinigten sich und wuschen ihre Gewänder. Dann brachte Aaron sie vor Jahwe als Schwingopfer[a] dar und erwirkte für sie Sühne, um sie zu reinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „schwang sie als Schwingopfer“. Das Hebräische gebraucht die übliche Ritualformel für die Darbringung einer תְּנוּפָה vor Jahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: reinigten sich
  rationale: Der Hitpael von חטא bezeichnet hier im priesterlichen Zusammenhang die Selbstreinigung beziehungsweise rituelle Entsündigung. „Reinigten sich“ gibt den reflexiven Sinn natürlich wieder, ohne ausdrücklich „von Sünde“ hinzuzufügen, was im hebräischen Satz nicht eigens genannt wird.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: wuschen ihre Gewänder
  rationale: „Gewänder“ entspricht בְּגָדִים und passt zum rituellen Zusammenhang, ohne altertümlich zu wirken.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: brachte ... als Schwingopfer dar
  rationale: Die Verbindung von נוף und תְּנוּפָה ist eine feste Ritualformel. „Als Schwingopfer darbringen“ bewahrt den herkömmlichen Kultbegriff, vermeidet aber die missverständliche Vorstellung, Aaron habe die Leviten körperlich hin und her geschwenkt.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי wird knapp und idiomatisch mit „vor“ wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: erwirkte für sie Sühne
  rationale: כפר mit עַל bezeichnet im priesterlichen Kontext eine sühnende Handlung zugunsten von Personen. „Sühne erwirken“ ist verständlich und wahrt den kultisch-theologischen Gehalt.
- source_word: לְטַהֲרָם
  choice: um sie zu reinigen
  rationale: Der Infinitiv bezeichnet Zweck beziehungsweise Ergebnis der sühnenden Handlung. „Um sie zu reinigen“ erhält die Sprache ritueller Reinheit.
theological_decisions:
- issue: Verhältnis von Selbstreinigung, Sühne und abschließender Reinigung
  choice: Die drei Aussagen werden mit „reinigten sich“, „erwirkte ... Sühne“ und „um sie zu reinigen“ unterschieden.
  alternative: Alle drei Vorgänge mit demselben deutschen Reinigungsbegriff umschreiben oder die erste Handlung ausdrücklich als Reinigung „von Sünde“ deuten.
  rationale: Der Vers verbindet verwandte, aber nicht identische priesterliche Begriffe. Die Formulierung hält sowohl die aktive Selbstreinigung der Leviten als auch Aarons sühnende Vermittlung und deren reinigenden Zweck fest, ohne eine spätere dogmatische Systematik einzutragen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Rituelle Darstellung der Leviten als תְּנוּפָה
  choice: als Schwingopfer darbringen
  alternative: als Schwingopfer schwingen
  rationale: Die gewählte Formulierung wahrt die kultische Kategorie, legt aber nicht fest, welche konkrete körperliche Bewegung mit den Leviten ausgeführt wurde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt klar und nah am Hebräischen; „Dann“ gliedert die aufeinanderfolgenden Handlungen natürlich. Der Fußnotenmarker steht unmittelbar beim einschlägigen Ausdruck „Schwingopfer“.
