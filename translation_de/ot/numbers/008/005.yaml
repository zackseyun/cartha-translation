  yaml_path: translation/ot/numbers/008/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“; traditionell mit „der HERR“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Die Form mit konsekutivem וַ führt die übliche erzählende Redeeinleitung fort. „Sprach“ gibt das Verb דבר präzise und in dieser Formel natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Verbindung mit „sprach“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den folgenden direkten Redeinhalt ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Redeeinleitungsformel knapp und idiomatisch wieder; der folgende Redeinhalt steht im nächsten Vers.
