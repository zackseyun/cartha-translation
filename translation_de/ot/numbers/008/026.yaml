base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: de
  text: Er darf jedoch seinen Brüdern im Zelt der Begegnung dienen, indem er den Dienstauftrag wahrnimmt; Arbeit aber soll er nicht verrichten.[a] So sollst du für die Leviten hinsichtlich ihrer Dienstaufgaben verfahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische unterscheidet zwischen dem weiterhin erlaubten „Dienen“ und der „Arbeit“, die der ältere Levit nicht verrichten soll. „Den Dienstauftrag wahrnehmen“ gibt die Wendung „eine anvertraute Aufgabe bewahren/erfüllen“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת אֶת־אֶחָיו
  choice: Er kann jedoch seinen Brüdern … dienen
  rationale: שרת bezeichnet hier weiterhin erlaubten Dienst. „Jedoch“ gibt den Gegensatz zur zuvor angeordneten Beendigung des regulären Dienstes wieder; „seinen Brüdern dienen“ bewahrt die hebräische Konstruktion, ohne eine bloße Zusammenarbeit ausdrücklich festzulegen.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: Die feste Kultbezeichnung wird wörtlich und im Deutschen idiomatisch wiedergegeben; „am“ bezeichnet den Dienstort, ohne ihn unnötig auf das Innere des Zeltes zu begrenzen.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: indem er den Dienstauftrag wahrnimmt
  rationale: Die Verbindung aus שמר und משמרת meint das zuverlässige Erfüllen einer anvertrauten Aufgabe. „Dienstauftrag wahrnehmen“ ist natürliches modernes Deutsch und erhält den Verantwortungscharakter.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: die eigentliche Arbeit aber soll er nicht mehr verrichten
  rationale: Die figura etymologica betont, dass der reguläre Arbeitsdienst endet. „Eigentliche Arbeit“ unterscheidet diesen von der weiterhin erlaubten unterstützenden Tätigkeit, ohne eine bestimmte körperliche Schwere in den Text hineinzulesen.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם
  choice: So sollst du mit den Leviten … verfahren
  rationale: Idiomatiche Wiedergabe der abschließenden Anweisung; der singularische Adressat bleibt erhalten.
- source_word: בְּמִשְׁמְרֹתָם
  choice: hinsichtlich ihrer Dienstaufgaben
  rationale: משמרות bezeichnet die den Leviten zugewiesenen Verantwortungsbereiche. Die Formulierung stellt den Bezug zur früheren Wendung her und klingt im modernen Deutsch natürlich.
theological_decisions:
- issue: Verhältnis zwischen weiterhin erlaubtem Dienst und verbotener Arbeit nach Erreichen der Altersgrenze
  choice: Der Levit darf weiterhin einen unterstützenden beziehungsweise verantwortungsbezogenen Dienst ausüben, verrichtet aber nicht mehr die reguläre Arbeit.
  alternative: Nach Erreichen der Altersgrenze ist jeder Dienst vollständig untersagt; oder erlaubt bleibt ausschließlich Wachdienst im engen Sinn.
  rationale: Der Text stellt שרת dem Ausdruck עֲבֹדָה לא יעבד gegenüber. Diese bewusste lexikalische Spannung spricht für unterschiedliche Arten oder Ebenen des Dienstes, legt deren praktische Abgrenzung jedoch nicht vollständig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung vermeidet das missverständliche „Gottesdienst“ und wahrt durch verschiedene Ausdrücke die hebräische Unterscheidung zwischen שרת und עבד/עבודה. Der Fußnotenmarker [a] steht im Haupttext.
