source:
  edition: WLC
  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: de
  text: Nimm die Leviten aus der Mitte der Söhne Israels und reinige sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Mitte der Israeliten“ beziehungsweise „aus der Mitte des Volkes Israel“. Wörtlich: „aus der Mitte der Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Nimm
  rationale: Der Imperativ richtet sich an Mose und bezeichnet hier, dass er die Leviten aus Israel herausnehmen beziehungsweise aussondern soll. „Nimm“ gibt die Grundbedeutung direkt und natürlich wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Gemeint ist die für den Dienst am Heiligtum bestimmte Stammesgruppe. „Die Leviten“ ist die geläufige und genaue deutsche Bezeichnung.
- source_word: מִתּוֹךְ
  choice: aus der Mitte
  rationale: Die Wendung bezeichnet die Herausnahme aus einer größeren Gemeinschaft. „Aus der Mitte“ bewahrt das räumlich-gemeinschaftliche Bild des Hebräischen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die wörtliche familiäre und bundesbezogene Bezeichnung des Hebräischen bleibt erhalten; eine idiomatischere Wiedergabe wäre „der Israeliten“ oder „des Volkes Israel“.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: und reinige sie
  rationale: טהר bezeichnet in diesem Zusammenhang rituelle Reinigung. „Reinige sie“ ist verständlich und bewahrt diesen kultischen Sinn, ohne ihn unnötig auszudeuten.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Volk Israel
  rationale: Die grammatisch maskuline, familiäre Bundesbezeichnung wird im Haupttext formal bewahrt. Die Fußnote nennt natürliche deutsche Alternativen, ohne den Ausdruck stillschweigend zu verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Der Ausdruck „Söhne Israels“ ist bewusst formal; idiomatischere Alternativen werden in der Fußnote angeboten.
