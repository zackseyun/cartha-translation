  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: de
  text: Du sollst die Leviten vor Jahwe bringen, und die Israeliten[a] sollen ihre Hände auf die Leviten legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“, eine übliche Sammelbezeichnung für das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Du sollst … bringen
  rationale: Der Hifil von קרב bedeutet „heranbringen“ oder „darbringen/präsentieren“. Zusammen mit „vor Jahwe“ gibt „bringen“ die räumliche und rituelle Bedeutung klar und natürlich wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche deutsche Bezeichnung für die Angehörigen Levis im bestimmten Plural.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier das Bringen in Jahwes Gegenwart; „vor Jahwe“ ist im rituellen Zusammenhang prägnant und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְסָמְכוּ
  choice: sollen … legen
  rationale: סמך mit „Hände“ und עַל bezeichnet die rituelle Handauflegung. „Die Hände auf … legen“ bewahrt die konkrete Handlung.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Formulierung bildet den hebräischen Ausdruck transparent ab; eine Fußnote erläutert seinen üblichen kollektiven Sinn.
- source_word: יְדֵיהֶם
  choice: ihre Hände
  rationale: Der hebräische Text hat ausdrücklich den Plural „Hände“ mit einem Pronomen der 3. Person Plural.
- source_word: עַל הַלְוִיִּם
  choice: auf die Leviten
  rationale: עַל wird in der deutschen Wendung für die Handauflegung natürlich mit „auf“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptübersetzung wahrt die ausdrücklich männliche Form des hebräischen Bundes- und Kollektivausdrucks. Die Fußnote hält fest, dass damit das Volk Israel kollektiv bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Wortlaut und Satzbau des Hebräischen. Das zweimalige „die Leviten“ bleibt zur Klarheit und entsprechend der Wiederholung im Ausgangstext erhalten.
