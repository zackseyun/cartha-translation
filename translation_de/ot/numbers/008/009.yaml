id: NUM.8.9
reference: Numbers 8:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: de
  text: Dann sollst du die Leviten vor das Zelt der Begegnung bringen und die ganze Gemeinde der Söhne Israels[a] versammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Israeliten“. Hebräisch: „der Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Dann sollst du … bringen
  rationale: Der Hifil von קרב bedeutet „heranbringen“ oder „vorführen“. „Bringen“ klingt im Deutschen natürlich und bewahrt die räumliche Bewegung; „Dann“ gibt das fortführende וְ in der Abfolge der Anweisungen wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche deutsche Bezeichnung für die Angehörigen des Stammes Levi, die für den Dienst am Heiligtum bestimmt sind.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet eine Stellung vor oder im Angesicht von etwas; „vor“ ist hier räumlich und im rituellen Zusammenhang passend.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Diese etablierte Wiedergabe bezeichnet das Heiligtum als Ort der Begegnung und bleibt nahe an der kultischen Bedeutung des hebräischen Ausdrucks.
- source_word: וְהִקְהַלְתָּ
  choice: und … versammeln
  rationale: Der Hifil von קהל bedeutet, eine Gruppe zusammenzurufen oder zu versammeln. Die deutsche Satzverbindung mit gemeinsamem Modalverb ist natürlich und gibt die koordinierte Anweisung vollständig wieder.
- source_word: כָּל עֲדַת
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die Gemeinschaft Israels als versammelte Körperschaft; „die ganze Gemeinde“ gibt כָּל und den gemeinschaftlichen Charakter klar wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die formale, ausdrücklich familiale und maskuline Ausdrucksweise des Hebräischen wird bewahrt. Eine idiomatischere deutsche Wiedergabe steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  alternative: der Israeliten
  rationale: Der hebräische Ausdruck ist formal maskulin und familial, bezeichnet hier aber das Bundesvolk als Ganzes. Der Haupttext bewahrt die Quellform, ohne ihren kollektiven Bezug zu verengen; die geläufigere Wiedergabe wird als Alternative genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der knappen Abfolge einer rituellen Anweisung. Der Fußnotenmarker steht bei dem Ausdruck, auf den sich die Variante tatsächlich bezieht.
