  source_fidelity: 'Der Entwurf gibt die beiden aufeinanderfolgenden Hifil-Anweisungen sachgerecht wieder: Mose soll die Leviten vor das Zelt der Begegnung bringen und die gesamte עֵדָה der בני ישראל versammeln. „Vor“ entspricht לִפְנֵי, und „die ganze Gemeinde“ bildet כָּל עֲדַת angemessen ab.'
  naturalness: Der Satz ist klares, modernes Standarddeutsch mit einem dem rituell-instruktiven Kontext angemessenen würdevollen Register. Die Verbindung der beiden Prädikate unter einem gemeinsamen „sollst du“ ist idiomatisch. „Söhne Israels“ ist bewusst formnah und daher etwas weniger idiomatisch, wird aber durch die Fußnote sinnvoll erläutert.
  terminology: „Leviten“ und „Zelt der Begegnung“ sind etablierte, verständliche und quellentreue Bezeichnungen. „Gemeinde“ ist für עֵדָה in diesem Pentateuchkontext passend. Die Haupttextform „Söhne Israels“ bewahrt die familiale maskuline Form des Hebräischen, ohne eine nicht im Ausgangstext vorhandene Auslegung hinzuzufügen.
