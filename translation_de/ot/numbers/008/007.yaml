  terminology: „Reinigung“ wahrt den rituellen Charakter von טהר. Die Fußnote erläutert die ungewöhnliche und auslegungsrelevante hebräische Bezeichnung מֵי חַטָּאת, ohne sie einseitig als Sündopfer oder ausschließlich moralische Reinigung zu bestimmen.
