source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: de
  text: 'Und so sollst du mit ihnen verfahren, um sie zu reinigen: Du sollst Wasser zur Reinigung[a] über sie sprengen. Sie sollen ein Schermesser über ihren ganzen Körper führen[b], ihre Kleider waschen und sich reinigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wasser der Sünde“; auch: „Reinigungswasser“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Sie sollen ihren ganzen Körper rasieren.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: Und so sollst du mit ihnen verfahren
  rationale: Gibt die einleitende Verfahrensanweisung natürlich und würdig wieder; „mit ihnen verfahren“ entspricht dem Deutschen besser als das wörtliche „ihnen tun“.
- source_word: לְטַהֲרָם
  choice: um sie zu reinigen
  rationale: Bewahrt den rituellen Sinn von טהר, ohne die Reinigung auf eine rein moralische Bedeutung einzuengen.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: Sprenge auf sie
  rationale: „Sprengen“ ist im Deutschen die klare kultische Bezeichnung für das Aufbringen von Wasser in Tropfen.
- source_word: מֵי חַטָּאת
  choice: Entsündigungswasser
  rationale: Die knappe kultische Bezeichnung bewahrt die Verbindung von חטאת mit Sünde beziehungsweise Reinigung, ohne ein im Vers nicht ausdrücklich genanntes Sündopfer einzuführen.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: Dann sollen sie mit einem Schermesser über ihren ganzen Körper fahren
  rationale: Bewahrt das konkrete hebräische Bild vom Darüberführen des Messers; „ganzer Körper“ gibt den gemeinten Sinn von „alles Fleisch“ in natürlichem Deutsch wieder.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: ihre Kleider waschen
  rationale: Direkte und gegenwärtig verständliche Wiedergabe des Waschens von Textilien.
- source_word: וְהִטֶּהָרוּ
  choice: und sich so reinigen
  rationale: Gibt die reflexive Form und den abschließenden Ergebnischarakter wieder.
theological_decisions:
- issue: Bedeutung der Reinigungssprache bei der Einsetzung der Leviten
  choice: Die Begriffe werden als konkrete rituelle Reinigung wiedergegeben.
  alternative: Die Reinigung ausschließlich moralisch deuten oder מֵי חַטָּאת ausdrücklich als Wasser eines Sündopfers bezeichnen.
  rationale: Der unmittelbare Zusammenhang beschreibt einen kultischen Reinigungsvorgang. Die Übersetzung wahrt zugleich die offene semantische Beziehung von חטאת zu Sünde, Reinigung und gegebenenfalls Sündopfer, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, verständlichem Ton. Die kultische Fachsprache bleibt erkennbar; ungewöhnliche hebräische Wendungen werden im Haupttext natürlich wiedergegeben und in den Fußnoten erläutert.
