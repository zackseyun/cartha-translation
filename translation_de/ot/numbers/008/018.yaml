id: NUM.8.18
reference: Numbers 8:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: de
  text: Und ich nahm die Leviten anstelle jedes Erstgeborenen unter den Söhnen Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Israeliten“. Wörtlich: „unter den Söhnen Israels“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Und ich nahm
  rationale: Das Qal-Wajjiqtol der 1. Person Singular von לקח trägt die gewöhnliche konkrete Bedeutung „nehmen“. Im Zusammenhang bezeichnet es Gottes Inanspruchnahme der Leviten, ohne dies durch „erwählen“ oder „bestimmen“ stärker auszudeuten.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Der bestimmte Plural bezeichnet die Angehörigen Levis in ihrer besonderen Aufgabe; „die Leviten“ ist die präzise und geläufige Wiedergabe.
- source_word: תַּחַת
  choice: anstelle
  rationale: תַּחַת bezeichnet hier Stellvertretung beziehungsweise Ersatz, nicht eine räumliche Lage.
- source_word: כָּל בְּכוֹר
  choice: jedes Erstgeborenen
  rationale: כָּל hat vor dem singularischen בְּכוֹר distributive Bedeutung. Nach „anstelle“ steht im Deutschen der Genitiv.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: unter den Söhnen Israels
  rationale: Die Wiedergabe bewahrt die wörtliche männliche Form des Hebräischen. „Unter“ gibt die Präposition בְּ in ihrem sozialen beziehungsweise partitiven Sinn natürlich wieder.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Der hebräische Ausdruck lautet ausdrücklich „Söhne Israels“. Die Hauptübersetzung bewahrt diese Form, während die Fußnote die im Deutschen natürlichere kollektive Wiedergabe nennt. Damit wird weder der Wortlaut neutralisiert noch die korporative Bedeutung bestritten.
- issue: Stellvertretende Zuordnung der Leviten
  choice: anstelle jedes Erstgeborenen
  alternative: für alle Erstgeborenen
  rationale: Die Formulierung erhält den Substitutionsgedanken von תַּחַת und die distributive Kraft von כָּל, ohne die kultische Bedeutung über den Vers hinaus dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Wortlaut; „anstelle jedes Erstgeborenen“ ist idiomatisch und bewahrt zugleich die stellvertretende Aussage.
