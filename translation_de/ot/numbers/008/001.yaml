lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Verbform führt die Erzählung weiter. „Und … sprach“ bewahrt den hebräischen Erzählungsstil und unterscheidet das Sprechen von der anschließenden Einleitung des Wortlauts.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten des Sprechens; im Deutschen ist „zu Mose sprechen“ die natürliche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel kündigt den folgenden Wortlaut an. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion präzise und ohne das schwerfällige „und sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ erhält den persönlichen Gottesnamen; die traditionelle Ersatzwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitung wird idiomatisch durch einen Doppelpunkt wiedergegeben; der eröffnende Erzählungsanschluss „Und“ bleibt erhalten.
