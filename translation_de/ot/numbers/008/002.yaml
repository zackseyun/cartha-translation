translation_notes:
  register: Moderne, würdevolle Standardsprache. Die doppelte Redeeinleitung des Hebräischen bleibt als »Rede … und sag« erhalten. Die mehrdeutige Handlung an den Lampen wird im Haupttext räumlich und in der Fußnote als mögliche Zündung wiedergegeben.
