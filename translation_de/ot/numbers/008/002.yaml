base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: de
  text: 'Rede zu Aaron und sag zu ihm: »Wenn du die Lampen anbringst[a], sollen die sieben Lampen zur Vorderseite des Leuchters hin leuchten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn du die Lampen anzündest.« Das hebräische Verb bedeutet wörtlich »hinaufbringen« beziehungsweise »aufsteigen lassen« und kann hier sowohl das Anbringen oder Ausrichten als auch das Anzünden der Lampen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Imperativ leitet eine direkte göttliche Anweisung ein; »Rede« wahrt den gehobenen Befehlsstil.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: und sag zu ihm
  rationale: Die beiden hebräischen Verben des Redens bleiben unterschieden, ohne im Deutschen unnatürlich zu klingen.
- source_word: בְּהַעֲלֹתְךָ
  choice: Wenn du die Lampen anbringst
  rationale: Der Hifil von עלה bedeutet wörtlich »hinaufbringen/aufsteigen lassen« und kann hier das Einsetzen beziehungsweise Ausrichten der Lampen bezeichnen. »Anbringst« bewahrt diese räumliche Nuance, ohne die ebenfalls mögliche Bedeutung »anzündest« auszuschließen; diese steht in der Fußnote.
- source_word: הַנֵּרֹת
  choice: die Lampen
  rationale: נֵר bezeichnet hier die einzelnen Öllampen des Heiligtums, nicht abstraktes Licht.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: vor dem Leuchter
  rationale: Die Häufung der Richtungs- und Lageausdrücke bezeichnet den Bereich gegenüber beziehungsweise vor der Vorderseite des Leuchters. Die knappe deutsche Formulierung gibt die räumliche Orientierung natürlich wieder, ohne eine technisch ungesicherte genaue Ausrichtung festzulegen.
- source_word: יָאִירוּ
  choice: ihr Licht … verbreiten
  rationale: 'Der Hifil von אור hat kausativen Sinn: Licht geben beziehungsweise einen Bereich erhellen.'
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: die sieben Lampen
  rationale: Die Zahl und der bestimmte Bezug der hebräischen Konstruktverbindung werden direkt wiedergegeben.
- source_word: הַמְּנוֹרָה
  choice: der Leuchter
  rationale: Die Sachbezeichnung wird bedeutungsbezogen übersetzt statt als »Menora« transliteriert; im Kontext ist der siebenarmige Leuchter gemeint.
