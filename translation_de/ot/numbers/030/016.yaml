  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: de
  text: Wenn er sie aber tatsächlich aufhebt[a], nachdem er von ihnen gehört hat, wird er ihre Schuld tragen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hebt sie gewiss auf“ beziehungsweise „hebt sie vollständig auf“. Im Hebräischen wird die Verbform durch einen absoluten Infinitiv verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: '„Ihre Schuld tragen“ kann auch bedeuten: „die Verantwortung für ihr Vergehen tragen“ oder „die Strafe für ihre Schuld tragen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die bedingte Wendung wird durch „wenn“ wiedergegeben; das nachgestellte „aber“ bringt den Gegensatz zum vorherigen Fall natürlich zum Ausdruck.
- source_word: הָפֵר יָפֵר
  choice: tatsächlich aufhebt
  rationale: „Aufheben“ passt zum rechtlichen Ungültigmachen von Gelübden. „Tatsächlich“ gibt die Verstärkung durch den absoluten Infinitiv mit finitem Verb wieder.
- source_word: אֹתָם
  choice: sie
  rationale: Das Pluralpronomen verweist auf die zuvor genannten Gelübde beziehungsweise bindenden Verpflichtungen.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: nachdem er von ihnen gehört hat
  rationale: Die Form bezeichnet eine Handlung nach seinem Hören beziehungsweise Kenntniserlangen. Die Formulierung wahrt den Bezug auf die Gelübde und klingt im Deutschen natürlich.
- source_word: וְנָשָׂא
  choice: muss … tragen
  rationale: Im rechtlich-moralischen Zusammenhang drückt die Wendung die daraus folgende Verantwortlichkeit aus; „muss“ vermittelt diese Konsequenz idiomatisch.
- source_word: עֲוֺנָהּ
  choice: ihre Schuld
  rationale: Die Wendung lässt offen, ob vor allem Schuld, Haftung oder die daraus folgende Strafe gemeint ist. „Ihre Schuld tragen“ bewahrt diese verdichtete Ausdrucksweise.
theological_decisions:
- issue: Bedeutung des Tragens von Schuld im rechtlichen Zusammenhang
  choice: Der Mann muss ihre Schuld tragen.
  alternative: Er trägt die Verantwortung für ihr Vergehen oder die dafür fällige Strafe.
  rationale: Die hebräische Wendung נָשָׂא עָוֹן kann das Tragen von Schuld, Verantwortlichkeit oder Schuldfolge bezeichnen. Der Haupttext bewahrt diese theologisch-rechtliche Mehrdeutigkeit, statt den genauen Mechanismus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Sprache bleibt klar, ohne unnötig fachsprachlich zu wirken; die Betonung der Aufhebung und die Mehrdeutigkeit der Schuldformel werden bewahrt.
