base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: de
  text: Das sind die Satzungen, die Jahwe Mose geboten hat, betreffend einen Mann und seine Frau sowie einen Vater und seine Tochter, solange sie noch jung und im Haus ihres Vaters lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihrer Jugend [im] Haus ihres Vaters“. Gemeint ist die Zeit, in der die Tochter noch im Haushalt ihres Vaters lebt.'
    reason: Die Fußnote macht die knappe hebräische Nominalform und die im Deutschen ergänzte Verbform transparent, ohne den rechtlich-kulturellen Bezug über das Hebräische hinaus festzulegen.
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Das sind die Satzungen
  rationale: Die nominale Zusammenfassungsformel wird im Deutschen idiomatisch mit der Kopula wiedergegeben; „Satzungen“ bewahrt den rechtlichen Charakter von חֻקִּים.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: die Jahwe Mose geboten hat
  rationale: צוה mit direktem Personenobjekt bezeichnet hier, dass Jahwe Mose diese Bestimmungen auftrug. „Geboten hat“ ist würdig und im Deutschen natürlich.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: für das Verhältnis zwischen einem Mann und seiner Frau
  rationale: בֵּין bedeutet wörtlich „zwischen“. Der Zusatz „für das Verhältnis“ macht die rechtliche Bezugssphäre auf Deutsch verständlich, ohne die relationale Formulierung einzuebnen.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: und zwischen einem Vater und seiner Tochter
  rationale: Die parallele Konstruktion des Hebräischen wird beibehalten; die geschlechtsspezifischen Verwandtschaftsbegriffe werden genau wiedergegeben.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: solange sie in ihrer Jugend im Haus ihres Vaters lebt
  rationale: „In ihrer Jugend“ gibt den zeitlichen Ausdruck formal wieder. Das im verblosen Hebräisch kontextuell vorausgesetzte Wohnen im väterlichen Haushalt wird für natürliches und klares Deutsch mit „lebt“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Rechtliche Geschlechter- und Beziehungsbegriffe
  choice: ein Mann und seine Frau; ein Vater und seine Tochter
  alternative: ein Ehemann und seine Frau; ein Elternteil und sein Kind
  rationale: Die konkreten männlichen und weiblichen Bezeichnungen des Ausgangstextes bleiben erhalten. „Mann“ wahrt zudem die mögliche Bedeutungsbreite von אִישׁ, während der Possessivbezug die eheliche Beziehung deutlich macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlichem Ton. Die zweimalige Zwischen-Formulierung des Hebräischen bleibt erkennbar; die Ergänzung „für das Verhältnis“ verhindert dabei eine unnatürliche deutsche Satzfügung.
