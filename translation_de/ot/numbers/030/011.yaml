  verdict: approve
  source_fidelity: Der Entwurf gibt die hebräische Fallkonstruktion וְאִם angemessen mit „Und wenn“ wieder. „Im Haus ihres Mannes“ entspricht בֵּית אִישָׁהּ, und die beiden Alternativen – ein Gelübde ablegen bzw. sich selbst eine Verpflichtung auferlegen – bleiben klar unterschieden. „Mit einem Eid“ gibt בִּשְׁבֻעָה sachgerecht als die begleitende bzw. bekräftigende Schwurform wieder.
  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch und bewahrt den rechtssprachlich-kasuistischen Charakter. Die Stellung von „mit einem Eid“ ist verständlich und natürlich; das abschließende Komma entspricht dem syntaktisch unvollständigen Anschluss des Verses.
  terminology: „Gelübde“ ist für נֶדֶר etabliert. „Sich … eine bindende Verpflichtung auferlegen“ gibt die Selbstbindung von אָסְרָה אִסָּר und עַל־נַפְשָׁהּ klar wieder, ohne „נפש“ unangemessen als „Seele“ zu verengen. Es sind keine theologischen oder konfessionell geprägten Begriffe eingeführt.
