source:
  edition: WLC
  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: de
  text: Und wenn sie im Haus ihres Mannes ein Gelübde abgelegt oder sich mit einem Eid eine bindende Verpflichtung auferlegt hat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Die Verbindung aus Konjunktion und Konditionalpartikel führt innerhalb der Rechtsbestimmungen einen weiteren Fall ein; „Und wenn“ erhält diesen fortlaufenden Zusammenhang.
- source_word: בֵּית אִישָׁהּ
  choice: im Haus ihres Mannes
  rationale: Die Wendung bezeichnet wörtlich das Haus ihres Mannes und damit den räumlichen wie sozialen Bereich ihrer Ehe, ohne diesen weiter auszudeuten.
- source_word: נָדָרָה
  choice: ein Gelübde abgelegt
  rationale: נדר bezeichnet das Ablegen eines Gelübdes; diese Formulierung ist im modernen Deutschen natürlich und rechtlich eindeutig.
- source_word: אוֹ
  choice: oder
  rationale: Die disjunktive Konjunktion verbindet zwei eng verwandte Möglichkeiten.
- source_word: אָסְרָה אִסָּר
  choice: sich … eine bindende Verpflichtung auferlegt
  rationale: Die figura etymologica aus Verb und Substantiv bezeichnet eine Selbstbindung. „Eine bindende Verpflichtung auferlegt“ gibt sowohl den Nachdruck als auch den rechtlichen Sinn verständlich wieder.
- source_word: עַל נַפְשָׁהּ
  choice: sich
  rationale: נפש bezeichnet hier die eigene Person, nicht speziell die „Seele“; das reflexive „sich“ bildet die Selbstverpflichtung idiomatisch ab.
- source_word: בִּשְׁבֻעָה
  choice: mit einem Eid
  rationale: Die Präposition bezeichnet das Mittel oder den begleitenden Umstand der Selbstbindung; „mit einem Eid“ wahrt den förmlichen Charakter.
