  text: וְ/אִם הָי֤וֹ תִֽהְיֶה֙ לְ/אִ֔ישׁ וּ/נְדָרֶ֖י/הָ עָלֶ֑י/הָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: de
  text: Wenn sie aber einen Mann heiratet[a] und ihre Gelübde auf ihr liegen oder eine unbedachte Äußerung ihrer Lippen, mit der sie sich selbst gebunden hat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit einem Mann verheiratet ist«. Wörtlich lautet die hebräische Wendung etwa: »einem Mann ist/wird«; sie bezeichnet den Ehestatus beziehungsweise den Eintritt in die Ehe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine Äußerung ihrer Lippen«. Gemeint ist wahrscheinlich eine ausgesprochene, möglicherweise vorschnelle Selbstverpflichtung, die von einem formellen Gelübde unterschieden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Formulierung leitet einen weiteren Bedingungsfall ein und markiert zugleich einen leichten Gegensatz zum vorherigen Fall.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: sie einem Mann angehört
  rationale: Die Konstruktion היה לְאִישׁ bezeichnet hier das Bestehen oder Eingehen einer ehelichen Zuordnung. Die Wiedergabe bewahrt die rechtlich-relationale Ausdrucksweise, ohne den hebräischen Wortlaut auf einen einzigen zeitlichen Aspekt festzulegen.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: und ihre Gelübde auf ihr liegen
  rationale: Die räumliche Metapher von Verpflichtungen, die auf einer Person liegen, bleibt erhalten; zugleich wird nicht vorweggenommen, wie ihre rechtliche Gültigkeit in den Folgeversen beurteilt wird.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: eine unbedachte Äußerung ihrer Lippen
  rationale: מִבְטָא bezeichnet eine ausgesprochene Äußerung; im Kontext einer Selbstverpflichtung kann sie unbedacht oder vorschnell sein. „Äußerung“ hält sie von einem formellen Gelübde unterscheidbar.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: mit der sie sich selbst gebunden hat
  rationale: אָסַר bezeichnet im Gelübdekontext das Binden beziehungsweise Verpflichten; נֶפֶשׁ wird hier idiomatisch-reflexiv auf die Person selbst bezogen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im rechtlichen Gelübdekontext
  choice: sich selbst
  alternative: ihre Seele / ihr Leben
  rationale: Gemeint ist die Person als Trägerin einer selbst auferlegten Verpflichtung, nicht eine Aussage über die Beschaffenheit der Seele oder über ihr biologisches Leben.
- issue: Eheliche Wendung היה לְאִישׁ
  choice: einem Mann angehört
  alternative: die Frau eines Mannes wird / mit einem Mann verheiratet ist
  rationale: Die gewählte Fassung erhält die rechtlich-relationale Spannung der hebräischen Wendung und entscheidet nicht unnötig zwischen dem Eintritt in die Ehe und dem bestehenden Ehestand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt wegen des anschließenden Hauptsatzes im Folgevers bewusst offen. „Angehört“ ist rechtssprachlich-relationell gemeint und wird durch Fußnote [a] erläutert; die hebräischen Bilder „auf ihr liegen“ und „sich binden“ bleiben erhalten.
