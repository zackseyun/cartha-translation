  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: de
  text: Mose sagte zu den Söhnen Israels gemäß allem, was Jahwe Mose geboten hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Kindern Israels« beziehungsweise »zu den Israeliten«. Wörtlich steht im Hebräischen »die Söhne Israels«, eine feststehende Bezeichnung des Volkes Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: redete
  rationale: Das Verb bedeutet grundsätzlich »sagen«. Da hier keine direkte Rede folgt, gibt »redete zu« den zusammenfassenden Sprechakt im Deutschen natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche hebräische Wendung wird als feststehende Bezeichnung des Bundesvolkes beibehalten; geläufigere deutsche Alternativen werden in der Fußnote genannt.
- source_word: כְּכֹל אֲשֶׁר
  choice: genauso, wie
  rationale: Die Formulierung bringt die durch כְּ bezeichnete Übereinstimmung mit dem gesamten Auftrag zum Ausdruck, ohne im Deutschen schwerfällig zu wirken.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass Jahwes Gebot an Mose dessen Rede an Israel vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Mose ist das direkte Objekt des hebräischen Verbs »gebieten«; im Deutschen steht die Person bei »gebieten« idiomatisch im Dativ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen; »Jahwe« bewahrt ihn als persönlichen Bundesnamen.
- issue: Geschlechtsspezifische Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die maskuline hebräische Form wird im Haupttext bewahrt, ohne ihre Funktion als Bezeichnung des ganzen Volkes zu leugnen; die idiomatische Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Redete zu« vermeidet den Eindruck eines anschließenden wörtlichen Zitats; »genauso, wie« gibt die vollständige Übereinstimmung mit Jahwes Auftrag natürlich wieder.
