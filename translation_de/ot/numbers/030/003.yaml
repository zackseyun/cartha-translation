revisions:
- from: Wenn ein Mann Jahwe ein Gelübde ablegt oder einen Eid schwört, um sich selbst durch eine Verpflichtung zu binden[a], darf er sein Wort nicht brechen[b]. Alles, was aus seinem Mund hervorgegangen ist, soll er tun.
  to: Wenn ein Mann Jahwe ein Gelübde ablegt oder einen Eid schwört, um sich zu einer Verpflichtung zu binden[a], darf er sein Wort nicht brechen[b]. Alles, was aus seinem Mund hervorgeht, muss er erfüllen.
  rationale: Die Revision präzisiert die Selbstbindung an eine Verpflichtung, beseitigt ein unnötiges reflexives „selbst“ und ersetzt die im Deutschen unübliche Aufforderung, ausgesprochene Worte zu „tun“, durch die rechtssprachlich natürliche Pflicht, sie zu „erfüllen“. Der Gottesname, die rechtliche Modalität und die wörtlichen Alternativen in den Fußnoten bleiben erhalten.
