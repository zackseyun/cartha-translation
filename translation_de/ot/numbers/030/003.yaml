  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: de
  text: Wenn ein Mann Jahwe ein Gelübde ablegt oder einen Eid schwört, um sich zu einer Verpflichtung zu binden[a], darf er sein Wort nicht brechen[b]. Alles, was aus seinem Mund hervorgeht, muss er erfüllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „um eine bindende Verpflichtung auf sich zu legen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „darf er sein Wort nicht entweihen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das maskuline Singularnomen wird in dieser Rechtsbestimmung entsprechend der konkreten Form des Ausgangstextes wiedergegeben.
- source_word: כִּי
  choice: wenn
  rationale: Die Konjunktion leitet hier einen kasuistischen Rechtsfall ein; „wenn“ ist dafür im Deutschen natürlich.
- source_word: יִדֹּר נֶדֶר
  choice: ein Gelübde ablegt
  rationale: Die hebräische Verbindung aus stammverwandtem Verb und Substantiv wird idiomatisch wiedergegeben, ohne ihre rechtlich-feierliche Bedeutung abzuschwächen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: einen Eid schwört
  rationale: Die stammverwandte Verb-Substantiv-Verbindung lässt sich so natürlich und zugleich feierlich ins Deutsche übertragen.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: um sich selbst durch eine Verpflichtung zu binden
  rationale: Die Formulierung bewahrt sowohl das Bild des Bindens als auch den Sinn einer selbst auferlegten Verpflichtung; eine mögliche wörtlichere Fassung steht in der Fußnote.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: darf er sein Wort nicht brechen
  rationale: חלל bezeichnet hier wörtlich ein Entweihen, im Zusammenhang eines Eides idiomatisch jedoch das Verletzen oder Brechen des eigenen Wortes.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: Alles, was aus seinem Mund hervorgegangen ist, soll er tun
  rationale: Die konkrete hebräische Redeweise vom Hervorgehen aus dem Mund bleibt erhalten; „soll“ drückt die rechtliche Verpflichtung aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ gibt es als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- issue: Bedeutung von חלל in Bezug auf das eigene Wort
  choice: sein Wort nicht brechen
  alternative: sein Wort nicht entweihen
  rationale: Die idiomatische Rechtsbedeutung wird im Haupttext verständlich ausgedrückt, während die sakrale Grundbedeutung „entweihen“ in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Satzstruktur. Die konkreten hebräischen Bilder vom Binden und vom aus dem Mund hervorgegangenen Wort bleiben erhalten, ohne im Deutschen unnötig sperrig zu wirken.
