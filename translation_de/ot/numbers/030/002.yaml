  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: de
  text: 'Mose sprach zu den Oberhäuptern der Stämme der Söhne Israels[a]: »Dies ist das Wort, das Jahwe geboten hat[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „der Israeliten“. Wörtlich steht im Hebräischen „der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dies hat Jahwe geboten“. Wörtlich: „Dies ist das Wort, das Jahwe geboten hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da redete
  rationale: Das narrative וַ führt die Handlung fort. „Da redete“ gibt diese Abfolge in würdigem, natürlichem Deutsch wieder.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: die Oberhäupter der Stämme
  rationale: „Oberhäupter“ bewahrt das Bild von רֹאשׁ und bezeichnet hier treffend die leitenden Männer der israelitischen Stämme; מַטּוֹת meint in diesem Zusammenhang die Stammesverbände.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die Formulierung gibt den hebräischen Ausdruck formal wieder und bewahrt dessen familiäre, bundesgeschichtliche Prägung. Eine Fußnote nennt die idiomatische kollektive Wiedergabe.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der Infinitiv leitet die direkte Rede ein. „Und sagte“ ist im heutigen Deutschen natürlicher als das formal mögliche „indem er sagte“.
- source_word: זֶה הַדָּבָר
  choice: Dies ist das Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. „Wort“ bewahrt hier die formale Gestalt einer autoritativen göttlichen Mitteilung.
- source_word: צִוָּה
  choice: geboten hat
  rationale: Das Perfekt bezeichnet den bereits erteilten Befehl, den Mose nun weitergibt. Das deutsche Perfekt ist in dieser Einleitungsformel natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ macht diesen Namen im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektiver Bundesausdruck בְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die wörtlich-familiäre Ausdrucksweise wird im Haupttext bewahrt, ohne zu leugnen, dass die Wendung das Volk Israel insgesamt bezeichnen kann; darauf weist die Fußnote hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede wird mit deutschen Anführungszeichen eröffnet; der abschließende Doppelpunkt zeigt an, dass das göttliche Gebot im folgenden Vers weitergeführt wird.
