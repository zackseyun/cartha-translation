  text: כָּל נֵ֛דֶר וְ/כָל שְׁבֻעַ֥ת אִסָּ֖ר לְ/עַנֹּ֣ת נָ֑פֶשׁ אִישָׁ֥/הּ יְקִימֶ֖/נּוּ וְ/אִישָׁ֥/הּ יְפֵרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: de
  text: Jedes Gelübde und jeden bindenden Eid zur Selbstkasteiung kann ihr Mann bestätigen oder aufheben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Seele/das Selbst zu bedrücken“. Gemeint sein kann auch, sich selbst etwas zu versagen oder zu fasten.'
    reason: Die Fußnote gibt die hebräische Idiomatik ohne unzutreffendes Possessivpronomen wieder und bewahrt die möglichen kontextuellen Konkretisierungen.
lexical_decisions:
- source_word: נֵדֶר
  choice: Gelübde
  rationale: Im kultisch-rechtlichen Zusammenhang bezeichnet נֵדֶר eine feierliche, bindende Verpflichtung, typischerweise gegenüber Gott; „Gelübde“ ist dafür die präzise deutsche Entsprechung.
- source_word: שְׁבֻעַת אִסָּר
  choice: bindender Eid
  rationale: Die Verbindung bezeichnet einen Eid, der eine verpflichtende oder einschränkende Bindung auferlegt. „Bindender Eid“ gibt beide Bestandteile knapp und verständlich wieder.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: sich selbst zu kasteien
  rationale: Die hebräische Wendung bezeichnet Selbstkasteiung oder Selbstverzicht, häufig im Zusammenhang mit Fasten. „Sich selbst zu kasteien“ bewahrt die Härte der Formulierung, ohne נֶפֶשׁ im Deutschen unnatürlich mit „Seele“ wiederzugeben.
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: Im ehe- und familienrechtlichen Zusammenhang bedeutet אִישׁ mit dem Suffix der 3. Person Femininum Singular eindeutig „ihr Mann“.
- source_word: יְקִימֶנּוּ
  choice: kann ... bestätigen
  rationale: Der Hifil von קום bedeutet hier, eine Verpflichtung bestehen zu lassen beziehungsweise als gültig zu bestätigen. Die Modalität „kann“ entspricht der beschriebenen rechtlichen Befugnis.
- source_word: יְפֵרֶנּוּ
  choice: kann ... aufheben
  rationale: Der Hifil von פרר bezeichnet im Gelübderecht das Ungültigmachen einer Verpflichtung. „Aufheben“ ist im modernen Deutschen eine natürliche rechtliche Formulierung.
- source_word: כָּל ... וְכָל
  choice: Jedes ... und jeden ...
  rationale: Die Wiederholung von כָּל unterstreicht, dass beide Arten von Verpflichtungen umfassend gemeint sind; die unterschiedliche Kasusform folgt der deutschen Syntax.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich klarer Satzführung. „Kasteien“ ist gehoben, aber allgemein verständlich und bildet die starke hebräische Wendung besser ab als eine zu enge Festlegung auf Fasten.
