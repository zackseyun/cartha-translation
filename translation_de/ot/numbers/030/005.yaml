source:
  edition: WLC
  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: de
  text: Und wenn ihr Vater von ihrem Gelübde und von der Verpflichtung hört, mit der sie sich selbst gebunden hat, und ihr Vater ihr gegenüber schweigt[a], dann bleiben alle ihre Gelübde gültig[b], und jede Verpflichtung, mit der sie sich selbst gebunden hat, bleibt gültig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ihr Vater schweigt ihr gegenüber“. Sein Schweigen bedeutet in diesem Rechtsfall, dass er keinen Einspruch erhebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „stehen“. Gemeint ist, dass die Gelübde rechtlich in Kraft bleiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: ihr Gelübde / ihre Gelübde
  rationale: נדר bezeichnet im rechtlich-kultischen Zusammenhang ein vor Gott abgelegtes Gelübde; „Gelübde“ ist dafür die klare und etablierte deutsche Entsprechung.
- source_word: אֱסָרָהּ / אִסָּר
  choice: Verpflichtung
  rationale: אִסָּר bezeichnet eine selbst auferlegte Bindung oder Einschränkung und wird bewusst von נדר („Gelübde“) unterschieden. „Verpflichtung“ bewahrt den rechtlichen Sinn in natürlichem Deutsch.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: mit der sie sich selbst gebunden hat
  rationale: Die Formulierung erhält das hebräische Bild des Bindens sowie den reflexiven Sinn einer selbst auferlegten Verpflichtung.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: ihr gegenüber schweigt
  rationale: Die Wendung bedeutet wörtlich, dass der Vater ihr gegenüber schweigt. Diese Wiedergabe bewahrt das Schweigen als rechtlich bedeutsame Nichtbeanstandung, ohne die Folgerung in den Haupttext einzutragen.
- source_word: וְקָמוּ ... יָקוּם
  choice: bleiben ... gültig / bleibt gültig
  rationale: קום bezeichnet hier das rechtliche Bestehen beziehungsweise die fortdauernde Gültigkeit. „Gültig bleiben“ ist im modernen Deutschen natürlicher und präziser als das wörtliche „bestehen“.
- source_word: כָּל
  choice: alle / jede
  rationale: „Alle“ beim Plural „Gelübde“ und „jede“ beim singularischen „Verpflichtung“ geben die jeweilige distributive Kraft idiomatisch wieder.
- source_word: וְ־ am Versanfang
  choice: Und wenn
  rationale: Das einfache וְ setzt den kasuistischen Bedingungssatz aus dem Zusammenhang fort. „Und wenn“ macht diese syntaktische Funktion im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Unterscheidung zwischen „Gelübde“ und der verwandten selbst auferlegten „Verpflichtung“ bleibt erhalten; die Wiederholung des hebräischen Rechtstextes wird nicht unnötig geglättet.
