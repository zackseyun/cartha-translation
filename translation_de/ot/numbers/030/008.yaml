  text: וְ/שָׁמַ֥ע אִישָׁ֛/הּ בְּ/י֥וֹם שָׁמְע֖/וֹ וְ/הֶחֱרִ֣ישׁ לָ֑/הּ וְ/קָ֣מוּ נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֻֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: de
  text: Und wenn ihr Mann an dem Tag, an dem er davon hört, ihr gegenüber schweigt[a], bleiben ihre Gelübde in Kraft, und ihre bindenden Verpflichtungen, die sie sich selbst auferlegt hat, bleiben in Kraft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr gegenüber schweigt“. Gemeint ist, dass der Mann keinen Einspruch erhebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Der wiederholte Rechtsausdruck kann auch mit „stehen“ wiedergegeben werden: Ihre Gelübde und selbst auferlegten Bindungen behalten ihre Gültigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Und wenn ... hört
  rationale: Das Perfekt mit וְ führt hier den kasuistischen Bedingungssatz fort; im Deutschen gibt dies ein Konditionalsatz im Präsens natürlich wieder.
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: Im Zusammenhang des Eherechts bezeichnet אִישׁ mit Suffix eindeutig den Ehemann.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: noch an dem Tag, an dem er davon hört
  rationale: Die Formulierung bewahrt die rechtlich maßgebliche Tagesfrist; „davon“ gibt den im Hebräischen vorausgesetzten Gegenstand des Hörens idiomatisch wieder.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: dazu schweigt
  rationale: Die Wendung bezeichnet, dass der Mann keinen Einspruch erhebt. „Dazu schweigt“ ist im modernen Deutsch natürlicher als das wörtliche „ihr gegenüber schweigt“, ohne den rechtlichen Sinn auszudeuten.
- source_word: וְקָמוּ
  choice: dann bleiben ... gültig
  rationale: קוּם bedeutet in diesem Rechtszusammenhang, dass die Gelübde in Kraft bleiben. Bei „Gelübden“ drückt „gültig bleiben“ dies klar und natürlich aus.
- source_word: נְדָרֶיהָ
  choice: ihre Gelübde
  rationale: „Gelübde“ ist die übliche und sachgerechte Wiedergabe von נדר im kultisch-rechtlichen Kontext.
- source_word: וֶאֱסָרֶהָ
  choice: ihre bindenden Verpflichtungen
  rationale: Das Substantiv bezeichnet selbst auferlegte Bindungen oder Verpflichtungen; die Übersetzung erhält sowohl das Bindungsmotiv als auch die rechtliche Verbindlichkeit.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: die sie sich selbst auferlegt hat
  rationale: Die idiomatische deutsche Formulierung gibt die hebräische Vorstellung einer auf die eigene Person gelegten Bindung verständlich wieder.
- source_word: נַפְשָׁהּ
  choice: sich selbst
  rationale: נֶפֶשׁ dient in dieser Wendung als Bezug auf die ganze Person und bedeutet nicht speziell „Seele“.
- source_word: יָקֻמוּ
  choice: bleiben bestehen
  rationale: Die Wiederholung von קוּם wird semantisch erhalten. Die leichte deutsche Variation vermeidet Schwerfälligkeit, während der rechtliche Sinn des Fortbestands deutlich bleibt.
