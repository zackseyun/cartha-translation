source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: de
  text: Wenn aber ihr Mann an dem Tag, an dem er davon hört, ihr widerspricht und ihr Gelübde, das auf ihr liegt, und die unbedachte Äußerung ihrer Lippen[a], durch die sie sich selbst gebunden hat, außer Kraft setzt, dann wird Jahwe ihr vergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Äußerung ihrer Lippen“ oder „die bindende Erklärung ihrer Lippen“.'
    reason: 'Lexikalische Alternative: מִבְטָא kann neutral eine Äußerung bezeichnen; die Nuance „unbedacht“ ist im Zusammenhang plausibel, aber nicht eindeutig.'
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Leitet einen bedingten Gegensatz zum vorausgehenden Fall ein und gibt sowohl die konditionale als auch die kontrastierende Funktion wieder.
- source_word: בְּיוֹם שְׁמֹעַ
  choice: an dem Tag, an dem er davon hört
  rationale: Gibt die hebräische Zeitangabe verständlich wieder; „davon“ bezeichnet den aus dem Zusammenhang erschlossenen Inhalt des Hörens.
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: אִישׁ mit dem Suffix der 3. Person Singular feminin bezeichnet in diesem ehe- und gelübterechtlichen Zusammenhang ihren Ehemann.
- source_word: יָנִיא אֹתָהּ
  choice: es ihr untersagt
  rationale: Der Hifil von נוא bezeichnet hier das Verhindern oder Untersagen der von ihr übernommenen Verpflichtung. Die Formulierung bleibt knapp und lässt das aus dem Kontext erschlossene Objekt unausgesprochen.
- source_word: וְהֵפֵר
  choice: und … außer Kraft setzt
  rationale: הפר bezeichnet im rechtlichen Zusammenhang die Aufhebung der Gültigkeit eines Gelübdes, nicht ein buchstäbliches Zerbrechen.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: ihr Gelübde, das auf ihr liegt
  rationale: Bewahrt das hebräische Bild einer auf der Person liegenden Verpflichtung und bleibt im Deutschen verständlich.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: die unbedachte Äußerung ihrer Lippen
  rationale: מִבְטָא bezeichnet eine ausgesprochene Erklärung; im Gelübdekontext ist die Nuance einer unbedachten Selbstverpflichtung möglich. Da sie lexikalisch nicht sicher ist, nennt die Fußnote neutralere Alternativen.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: durch die sie sich selbst gebunden hat
  rationale: Die Wendung bedeutet, dass sie sich durch ihre Worte einer Verpflichtung unterstellt hat; „sich selbst gebunden“ bewahrt die rechtliche und reflexive Kraft.
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen יהוה als Eigennamen wieder.
- source_word: יִסְלַח לָהּ
  choice: wird ihr vergeben
  rationale: סלח bezeichnet Vergebung; die Zukunftsform entspricht der hier genannten rechtlichen Folge.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottesnamen. „Jahwe“ gibt diesen Namen direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsnuance von מִבְטָא שְׂפָתֶיהָ
  choice: die unbedachte Äußerung ihrer Lippen
  alternative: die Äußerung ihrer Lippen; die bindende Erklärung ihrer Lippen
  rationale: Eine unbedachte oder impulsive Äußerung passt zum Gelübdekontext, ist aber nicht völlig lexikalisch gesichert. Deshalb wird die Mehrdeutigkeit durch eine Fußnote offengehalten.
- issue: Vergebung nach der Aufhebung des Gelübdes
  choice: dann wird Jahwe ihr vergeben
  alternative: dann wird Jahwe ihr verzeihen
  rationale: Die Aussage des Textes wird ohne zusätzliche Erklärung darüber bewahrt, worin ihre Vergebungsbedürftigkeit besteht; die vorhandene theologische Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher gelübde- und rechtsbezogener Sprache. Das hebräische Bild „das auf ihr liegt“ bleibt erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung, auf die sich die Fußnote bezieht.
