id: NUM.30.4
reference: Numbers 30:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: de
  text: Wenn eine Frau Yahweh ein Gelübde ablegt[a] und sich im Haus ihres Vaters, solange sie noch jung ist, eine bindende Verpflichtung auferlegt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Gelübde gelobt“. Das Hebräische verbindet ein Verb mit einem stammverwandten Substantiv und hebt so den förmlichen Akt des Gelobens hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sich mit einer bindenden Verpflichtung bindet“. Auch hier verwendet das Hebräische ein Verb und ein verwandtes Substantiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: Wenn eine Frau
  rationale: Die Wendung leitet im Rechtszusammenhang einen neuen Fall ein. „Wenn“ gibt die konditionale Funktion von כִּי im modernen Deutschen natürlich wieder; das einleitende וְ muss dabei nicht eigens mit „und“ übersetzt werden.
- source_word: תִדֹּר נֶדֶר
  choice: ein Gelübde ablegt
  rationale: Die hebräische Verbindung aus stammverwandtem Verb und Substantiv bezeichnet den förmlichen Akt des Gelobens. Die idiomatische deutsche Rechts- und Sakralsprache gibt dies mit „ein Gelübde ablegen“ angemessen wieder.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als Eigenname „Yahweh“ wiedergegeben.
- source_word: וְאָסְרָה אִסָּר
  choice: sich eine bindende Verpflichtung auferlegt
  rationale: Verb und verwandtes Substantiv bezeichnen, dass die Frau sich selbst unter eine bindende Zusage oder Einschränkung stellt. Die Formulierung bewahrt den rechtlichen Nachdruck und unterscheidet diese Wendung vom zuvor genannten Gelübde.
- source_word: בְּבֵית אָבִיהָ
  choice: im Haus ihres Vaters
  rationale: Die direkte Ortsangabe bewahrt den Haushalt als rechtlichen und sozialen Rahmen des Falles.
- source_word: בִּנְעֻרֶיהָ
  choice: solange sie noch jung ist
  rationale: Die Wendung bezeichnet ihre Jugendzeit. Diese Übersetzung ist natürlich und vermeidet es, einen Familienstand ausdrücklich in den Text einzutragen, der nur aus dem Zusammenhang erschlossen werden kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Yahweh“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Rechtliche Bedeutung von בִּנְעֻרֶיהָ
  choice: solange sie noch jung ist
  alternative: solange sie unverheiratet ist
  rationale: Der unmittelbare Wortlaut spricht von ihrer Jugend. Der Kontext kann die Zugehörigkeit zum väterlichen Haushalt und einen unverheirateten Stand voraussetzen, doch diese Deutung wird nicht ausdrücklich in die Übersetzung aufgenommen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem rechtlichem Ton. Der Vers bleibt als konditionaler Vordersatz offen, wie im hebräischen Satzbau und im gegebenen Einzelvers. Die beiden hebräischen stammverwandten Ausdrücke werden im Haupttext idiomatisch wiedergegeben und in den Fußnoten sichtbar gemacht.
