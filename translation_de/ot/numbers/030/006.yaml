  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: de
  text: Doch wenn ihr Vater ihr an dem Tag, an dem er davon hört, widerspricht, haben weder ihre Gelübde noch ihre bindenden Verpflichtungen[a], mit denen sie sich selbst gebunden hat, Bestand[b]. Der HERR wird ihr vergeben, weil ihr Vater ihr widersprochen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Selbstbindungen“. Gemeint sind Verpflichtungen, mit denen jemand sich selbst bindet, besonders durch ein Gelübde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „treten nicht in Kraft“. Wörtlich heißt es: „stehen nicht“; gemeint ist, dass sie nicht als bindend bestehen bleiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Kennzeichnet im Zusammenhang den Gegensatz zum zuvor behandelten Fall und leitet zugleich die Bedingung ein.
- source_word: הֵנִיא
  choice: ihr entgegentritt
  rationale: Das Hifil von נוא bezeichnet hier das wirksame Widersprechen des Vaters, durch das die Verpflichtung nicht bestehen bleibt. Die Formulierung bewahrt, dass im Hebräischen die Tochter selbst das direkte Objekt ist; „annulliert“ würde dagegen eher das Gelübde zum Objekt machen.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: an dem Tag, an dem er davon hört
  rationale: Bewahrt die rechtlich bedeutsame zeitliche Bestimmung des hebräischen Ausdrucks.
- source_word: כָּל נְדָרֶיהָ וֶאֱסָרֶיהָ
  choice: weder ihre Gelübde noch ihre bindenden Verpflichtungen
  rationale: Die Negation des Prädikats wird im natürlichen Deutschen mit „weder ... noch“ auf beide Nominalgruppen bezogen. אֱסָרִים sind selbst auferlegte Bindungen, besonders im Zusammenhang mit Gelübden.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: mit denen sie sich selbst gebunden hat
  rationale: Gibt die reflexive Selbstbindung des hebräischen Idioms verständlich und zugleich formnah wieder.
- source_word: לֹא יָקוּם
  choice: haben ... keinen Bestand
  rationale: Bewahrt das Bild des hebräischen Verbs „stehen/bestehen“ und drückt dessen rechtliche Wirkung aus, ohne sie übermäßig auszudeuten.
- source_word: וַיהוָה
  choice: der HERR
  rationale: Traditionelle deutsche Wiedergabe des Gottesnamens JHWH in Kapitälchenform.
- source_word: יִסְלַח לָהּ
  choice: wird ihr vergeben
  rationale: Direkte und geläufige Wiedergabe von סלח mit persönlichem Objekt; die Art einer möglichen Schuld wird nicht näher bestimmt.
- source_word: כִּי
  choice: weil
  rationale: Leitet ausdrücklich die im Text genannte Begründung ein.
theological_decisions:
- issue: Bedeutung der Vergebung bei einem nicht mehr bindenden Gelübde
  choice: Die Aussage „der HERR wird ihr vergeben“ bleibt ohne nähere dogmatische Erklärung stehen.
  alternative: Die Vergebung ausdrücklich als Erlass der Schuld wegen eines nicht erfüllten Gelübdes zu erklären.
  rationale: Der unmittelbare Zusammenhang betrifft die rechtliche Wirksamkeit von Gelübden. Der Text spricht zugleich von Vergebung, bestimmt aber Art und Umfang der vorausgesetzten Schuld nicht ausdrücklich; diese Spannung soll erhalten bleiben.
- issue: Wirkung des väterlichen Widerspruchs
  choice: Der Vater tritt der Tochter entgegen, worauf ihre Verpflichtungen keinen Bestand haben.
  alternative: Der Vater annulliert unmittelbar ihre Gelübde.
  rationale: Die gewählte Fassung folgt der hebräischen Syntax, in der die Tochter Objekt von הֵנִיא ist, und lässt die anschließende Aussage über die fehlende Bestandskraft der Gelübde ihre rechtliche Wirkung erläutern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich klarer, aber nicht unnötig technischer Ausdrucksweise. Die Wiederholung „ihr entgegentritt/entgegengetreten“ bildet die Wiederholung des hebräischen Verbs ab. Beide Fußnotenmarker erscheinen im Haupttext.
