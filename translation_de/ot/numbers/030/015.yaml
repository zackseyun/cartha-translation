  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die rechtliche Folge des hebräischen Textes im Wesentlichen zutreffend wieder: fortgesetztes Schweigen des Ehemanns bewirkt das Bestehen aller Gelübde bzw. bindenden Verpflichtungen. Die zeitliche Angabe und die begründende Schlussklausel sind erhalten. „Beharrlich“ kann jedoch im Deutschen eine wertende Nuance von Starrsinn haben, die der hebräische Infinitivus absolutus nicht verlangt; im Zusammenhang mit „von einem Tag zum andern“ ist „weiterhin“ genauer.'
  naturalness: „Die auf ihr liegen“ ist zwar verständlich, klingt im heutigen Standarddeutsch aber unidiomatisch. „Die sie binden“ ist eine natürliche rechtssprachliche Formulierung und gibt die Metapher sowie die Bindungswirkung des Hebräischen angemessen wieder. Die Wiederaufnahme von „ihr gegenüber“ in der Begründung macht das hebräische לָהּ natürlich und ohne Überladung sichtbar.
  terminology: „Mann“, „Gelübde“ und „bindende Verpflichtungen“ sind passend. „Bestätigt“ gibt das rechtliche Hifil von קום präzise und idiomatisch wieder. Die Fußnote bietet mit „Selbstverpflichtungen“ eine geeignete lexikalische Alternative.
