revisions:
- from: Wenn aber ihr Mann ihr gegenüber von einem Tag zum andern beharrlich schweigt, lässt er damit alle ihre Gelübde oder alle ihre bindenden Verpflichtungen[a], die auf ihr liegen, bestehen. Er hat sie bestehen lassen, weil er an dem Tag, als er davon hörte, schwieg.
  to: Wenn aber ihr Mann ihr gegenüber von einem Tag zum andern weiterhin schweigt, bestätigt er damit alle ihre Gelübde oder alle ihre bindenden Verpflichtungen[a], die sie binden. Er hat sie bestätigt, weil er ihr gegenüber an dem Tag schwieg, als er davon hörte.
  rationale: Die Überarbeitung verbessert idiomatisches modernes Deutsch und bewahrt zugleich die rechtliche und zeitliche Präzision des hebräischen Textes. „Weiterhin“ verbindet die verbale Verstärkung mit dem fortgesetzten Schweigen über mehrere Tage; „bestätigt“ und „die sie binden“ geben die Rechtswirkung klar wieder. Der Bezug des Schweigens auf die Frau bleibt in beiden einschlägigen Klauseln erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:10:09Z'
