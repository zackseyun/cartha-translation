  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: de
  text: Wenn aber ihr Mann ihr gegenüber von einem Tag zum andern weiterhin schweigt, bestätigt er damit alle ihre Gelübde oder alle ihre bindenden Verpflichtungen[a], die sie binden. Er hat sie bestätigt, weil er ihr gegenüber an dem Tag schwieg, als er davon hörte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle ihre Selbstverpflichtungen«. Das hebräische Wort bezeichnet Verpflichtungen, durch die sich jemand bindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: beharrlich schweigt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Verbalbegriff. »Beharrlich schweigt« gibt sowohl die Betonung als auch das fortgesetzte Nichtwidersprechen im rechtlichen Zusammenhang natürlich wieder.
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: Im ehe- und familienrechtlichen Kontext bezeichnet אִישׁ mit dem Suffix der 3. Person feminin Singular den Ehemann.
- source_word: מִיּוֹם אֶל יוֹם
  choice: von einem Tag zum andern
  rationale: Die deutsche Wendung bleibt nah am hebräischen Ausdruck und bezeichnet das über den ersten Tag hinaus fortgesetzte Schweigen.
- source_word: וְהֵקִים
  choice: lässt er damit ... bestehen
  rationale: 'Das Hifil von קום hat hier rechtliche Bedeutung: Der Mann lässt die Gelübde wirksam bleiben. »Bestehen lassen« ist im Deutschen natürlicher als »bestätigen« und bewahrt den Rechtscharakter.'
- source_word: נְדָרֶיהָ
  choice: ihre Gelübde
  rationale: »Gelübde« ist die übliche und sachlich genaue Wiedergabe von נדר in rechtlichen und kultischen Zusammenhängen.
- source_word: אֱסָרֶיהָ
  choice: ihre bindenden Verpflichtungen
  rationale: Das von אסר, »binden«, abgeleitete Substantiv bezeichnet hier freiwillig eingegangene Verpflichtungen, die für die Gelobende bindend sind.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: die auf ihr liegen
  rationale: Die Formulierung bewahrt das hebräische Bild einer Verpflichtung, die auf einer Person liegt, und ist im Deutschen verständlich.
- source_word: הֵקִים אֹתָם
  choice: Er hat sie bestehen lassen
  rationale: Das Perfekt fasst die durch sein vorheriges Schweigen eingetretene und fortbestehende Rechtswirkung zusammen.
- source_word: כִּי
  choice: weil
  rationale: 'Die Konjunktion begründet die Wirksamkeit: Sein Schweigen am maßgeblichen Tag ließ die Verpflichtungen bestehen.'
- source_word: הֶחֱרִשׁ לָהּ
  choice: schwieg
  rationale: Das Dativobjekt ist im Deutschen in der Wiederholung entbehrlich; der Zusammenhang macht deutlich, dass er ihr gegenüber keinen Widerspruch erhob.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: an dem Tag, als er davon hörte
  rationale: Die Wiedergabe erhält die für den Abschnitt wichtige Tagesfrist und ergänzt idiomatisch »davon« als Bezug auf Gelübde und Verpflichtungen.
theological_decisions:
- issue: Rechtswirkung des Schweigens des Ehemanns
  choice: »lässt er damit ... bestehen«
  alternative: »bestätigt er«
  rationale: Die Übersetzung beschreibt die im Text genannte rechtliche Folge, ohne eine weitergehende theologische oder konfessionelle Deutung der ehelichen Autorität einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich klarer Ausdrucksweise. Die Wiederholung von »bestehen lassen« bewahrt die Struktur und den Nachdruck des hebräischen Textes; »ihr gegenüber« verdeutlicht im ersten Satz das rechtlich bedeutsame Nichtwidersprechen.
