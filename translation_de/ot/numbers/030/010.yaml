source:
  edition: WLC
  text: וְ/נֵ֥דֶר אַלְמָנָ֖ה וּ/גְרוּשָׁ֑ה כֹּ֛ל אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָק֥וּם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: de
  text: Und das Gelübde einer Witwe oder einer geschiedenen Frau – alles, womit sie sich selbst gebunden hat – bleibt für sie verbindlich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „steht auf ihr“; auch: „hat für sie Bestand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: Gelübde
  rationale: In diesem rechtlich-kultischen Zusammenhang bezeichnet נדר ein gegenüber Gott abgelegtes Gelübde; „Gelübde“ ist dafür die präzise und geläufige deutsche Entsprechung.
- source_word: אַלְמָנָה
  choice: Witwe
  rationale: Direkte und natürliche Entsprechung für eine Frau, deren Ehemann gestorben ist.
- source_word: גְרוּשָׁה
  choice: geschiedene Frau
  rationale: Das passive Partizip bezeichnet eine Frau, die fortgeschickt beziehungsweise geschieden wurde; die Formulierung ist klar und dem rechtlichen Kontext angemessen.
- source_word: כֹּל אֲשֶׁר
  choice: alles, womit
  rationale: Die Wendung hat umfassende Kraft und bezieht neben dem genannten Gelübde jede entsprechende Selbstverpflichtung ein.
- source_word: אָסְרָה עַל נַפְשָׁהּ
  choice: sie sich selbst gebunden hat
  rationale: Die Übersetzung bewahrt das hebräische Bild des Bindens und gibt נֶפֶשׁ hier idiomatisch reflexiv als „sich selbst“ wieder.
- source_word: יָקוּם עָלֶיהָ
  choice: bleibt für sie verbindlich
  rationale: קום bezeichnet im rechtlichen Gebrauch das Fortbestehen beziehungsweise die Gültigkeit; zusammen mit עָלֶיהָ geht es darum, dass die Verpflichtung auf ihr liegt und für sie bindend bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Rechtssprache. „Doch“ gibt das anschließende וְ im kontrastierenden Zusammenhang des Abschnitts wieder. Gedankenstriche bilden die erläuternde Struktur des hebräischen Satzes ab.
