base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: de
  text: Wenn aber ihr Mann davon hört, ihr gegenüber schweigt und ihre Gelübde nicht aufhebt[a], bleiben alle ihre Gelübde gültig; und jede bindende Verpflichtung, die sie sich selbst auferlegt hat, bleibt gültig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische hat als direktes Objekt wörtlich „sie“. Im rechtlichen Zusammenhang bedeutet dies, dass er ihre Gelübde und bindenden Verpflichtungen nicht aufhebt oder außer Kraft setzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע אִישָׁהּ
  choice: Wenn aber ihr Mann davon hört
  rationale: Die Bedingung ergibt sich aus dem kasuistischen Rechtsstil des Zusammenhangs. אִישָׁהּ bezeichnet hier den Ehemann; „davon“ nimmt natürlich auf ihre Gelübde und Verpflichtungen Bezug.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: ihr gegenüber schweigt
  rationale: Die Wendung bezeichnet sein Schweigen als Reaktion auf das Gehörte. Die Formulierung ist quellennah und im Deutschen verständlich.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: sie nicht daran hindert
  rationale: Die Übersetzung bewahrt den weiblichen Personenbezug des hebräischen direkten Objekts. Im rechtlichen Zusammenhang bedeutet das, dass der Mann ihre Gelübde und Verpflichtungen nicht außer Kraft setzt; dies wird in der Fußnote erläutert.
- source_word: וְקָמוּ כָּל נְדָרֶיהָ
  choice: bleiben alle ihre Gelübde gültig
  rationale: קום bezeichnet hier das rechtliche Fortbestehen. „Gültig bleiben“ vermittelt diesen Sinn im modernen Deutschen klarer als das wörtlichere „bestehen“.
- source_word: וְכָל אִסָּר
  choice: auch jede bindende Verpflichtung
  rationale: אִסָּר bezeichnet in diesem Kapitel eine selbst auferlegte Bindung oder Einschränkung. „Bindende Verpflichtung“ gibt den rechtlichen und verpflichtenden Sinn wieder.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: die sie sich selbst auferlegt hat
  rationale: Die natürliche deutsche Wendung gibt das hebräische Bild einer auf die eigene Person gelegten Bindung sinngemäß wieder, ohne den selbstverpflichtenden Charakter abzuschwächen.
- source_word: יָקוּם
  choice: bleibt gültig
  rationale: Die Wiederholung wahrt den parallelen Aufbau des Hebräischen und bringt die fortbestehende Rechtskraft zum Ausdruck.
