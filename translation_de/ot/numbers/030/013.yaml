  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: de
  text: Wenn ihr Mann sie aber an dem Tag, an dem er davon hört, tatsächlich aufhebt, hat nichts von dem, was über ihre Lippen gekommen ist, Bestand – weder ihre Gelübde noch die Verpflichtung, die sie sich selbst auferlegt hat.[a] Ihr Mann hat sie aufgehoben, und der HERR wird ihr vergeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alles, was über ihre Lippen hervorgeht – in Bezug auf ihre Gelübde und auf die Bindung, die sie sich selbst auferlegt hat“; gemeint sind ihre ausgesprochenen bindenden Verpflichtungen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht hier der Gottesname JHWH, häufig als „Jahwe“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die bedingte Aussage wird aufgenommen; „aber“ gibt den Gegensatz zum vorherigen Rechtsfall natürlich wieder.
- source_word: הָפֵר יָפֵר
  choice: ausdrücklich aufhebt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Handlung. „Ausdrücklich“ vermittelt den Nachdruck in natürlichem juristischem Deutsch.
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: Im ehe- und rechtsbezogenen Zusammenhang bezeichnet אִישָׁהּ den Ehemann; „ihr Mann“ ist im modernen Deutschen natürlich und eindeutig.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: an dem Tag, an dem er davon hört
  rationale: Bewahrt die rechtlich bedeutsame Tagesfrist. „Davon“ bezieht sich auf die zuvor genannten Verpflichtungen, ohne den hebräischen Sinn einzuengen.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: nichts von dem, was über ihre Lippen gekommen ist
  rationale: Die wörtliche Wendung „alles Hervorgehen ihrer Lippen“ bezeichnet sämtliche ausgesprochenen Verpflichtungen. Zusammen mit der Verneinung ist diese deutsche Formulierung natürlich und umfassend.
- source_word: לִנְדָרֶיהָ
  choice: ihre Gelübde
  rationale: „Gelübde“ ist die etablierte und sachgerechte Wiedergabe von נדר im religiös-rechtlichen Kontext.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: die Verpflichtung, die sie sich selbst auferlegt hat
  rationale: Gibt den reflexiven Gedanken einer bindenden Selbstverpflichtung verständlich wieder, ohne נֶפֶשׁ hier unnatürlich mit „Seele“ zu übersetzen.
- source_word: לֹא יָקוּם
  choice: hat … keinen Bestand
  rationale: Entspricht dem juristischen Sinn, dass eine Erklärung nicht gültig beziehungsweise nicht in Kraft bleibt.
- source_word: הֲפֵרָם
  choice: hat sie aufgehoben
  rationale: Das Perfekt fasst die wirksame Aufhebung der Gelübde und Verpflichtungen zusammen.
- source_word: וַיהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens JHWH mit Kapitälchen wird im Klartext als „HERR“ dargestellt; eine Fußnote nennt die Form des hebräischen Textes.
- source_word: יִסְלַח לָהּ
  choice: wird ihr vergeben
  rationale: Direkte Wiedergabe der göttlichen Vergebung, ohne den genauen Gegenstand der Vergebung über den Text hinaus festzulegen.
theological_decisions:
- issue: Bezug der göttlichen Vergebung nach der Aufhebung
  choice: Die Aussage über die Vergebung folgt unmittelbar auf die Aufhebung und das Außerkrafttreten der Verpflichtungen, ohne den Grund näher auszudeuten.
  alternative: Die Vergebung ausschließlich auf die Nichterfüllung oder ausschließlich auf eine unbedachte Äußerung beziehen.
  rationale: Der hebräische Text nennt Vergebung, legt aber nicht ausdrücklich fest, ob sie sich auf eine mögliche Nichterfüllung, auf Unbedachtheit beim Gelübde oder auf beides bezieht. Diese Spannung bleibt erhalten.
- issue: Reichweite der Vollmacht des Ehemanns
  choice: Nur die im Vers formulierte rechtliche Wirkung wird wiedergegeben.
  alternative: Aus dem Vers eine allgemeine Lehre über eheliche Autorität abzuleiten.
  rationale: Die Übersetzung beschränkt sich auf den konkreten Rechtsfall und importiert keine weitergehende konfessionelle oder systematische Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit juristisch klarer Satzführung. „Aufheben“ und „Bestand haben“ vermitteln die rechtliche Wirkung, ohne unnötig fachsprachlich zu klingen. Sämtliche Fußnotenmarker stehen im Haupttext.
