  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: de
  text: Die Männer, die Mose ausgesandt hatte, um das Land zu erkunden[a], kehrten zurück und brachten die ganze Gemeinde dazu, gegen ihn zu murren, indem sie einen schlechten Bericht über das Land verbreiteten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: um das Land auszukundschaften.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: indem sie einen schlechten Bericht über das Land herausbrachten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Die Männer
  rationale: Der Vers nimmt die zuvor erwähnten Männer wieder auf. Das einfache „Die Männer“ ist im Deutschen ein natürlicher Anschluss; die hebräische Konjunktion muss hier nicht eigens mit „und“ wiedergegeben werden.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: die Mose ausgesandt hatte
  rationale: Der Relativsatz wird idiomatisch wiedergegeben. Das Plusquamperfekt macht deutlich, dass die Aussendung vor ihrer Rückkehr lag, ohne den Sinn zu verändern.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: um das Land zu erkunden
  rationale: תור bezeichnet hier die untersuchende Erkundung Kanaans. „Erkunden“ ist modernes, neutrales Deutsch und legt sich weniger stark als „ausspionieren“ auf eine feindliche Spionagetätigkeit fest.
- source_word: וַיָּשֻׁבוּ
  choice: kehrten zurück
  rationale: Eine knappe und dem Erzählstil angemessene Wiedergabe von שוב.
- source_word: וילונו עָלָיו
  choice: brachten … dazu, gegen ihn zu murren
  rationale: 'Form und Satzbau weisen auf eine verursachende Bedeutung: Die Männer veranlassten die ganze Gemeinde zum Murren gegen Mose. „Murren“ bewahrt das wiederkehrende Motiv der Wüstenberichte.'
- source_word: אֶת כָּל־הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die israelitische Gemeinschaft als Gesamtheit. „Gemeinde“ ist verständlich und wahrt den korporativen Sinn.
- source_word: לְהוֹצִיא דִבָּה
  choice: indem sie einen schlechten Bericht … verbreiteten
  rationale: Der Infinitiv kann das Mittel beziehungsweise den Umstand angeben. דִבָּה bezeichnet einen abträglichen, diskreditierenden Bericht; „schlechter Bericht“ bleibt nahe am Ausdruck, während „verbreiteten“ die idiomatische Bedeutung von הוציא in dieser Verbindung wiedergibt.
- source_word: עַל־הָאָרֶץ
  choice: über das Land
  rationale: עַל bezeichnet hier den Gegenstand des Berichts. „Über das Land“ ist die natürliche deutsche Formulierung.
theological_decisions:
- issue: Bezug des Pronomens in עָלָיו
  choice: gegen ihn, das heißt gegen Mose
  alternative: gegen ihn ohne ausdrückliche Auflösung des Bezugs
  rationale: Das maskuline Singularpronomen bezieht sich im unmittelbaren Satz am natürlichsten auf Mose. Im Haupttext bleibt entsprechend dem Hebräischen das Pronomen „ihn“ stehen, sodass keine unnötige Explizierung eingeführt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählsyntax. Die verursachende Bedeutung des Verbs bei „murren“ wird ausdrücklich bewahrt; konfessionell geprägte Zusätze werden vermieden.
