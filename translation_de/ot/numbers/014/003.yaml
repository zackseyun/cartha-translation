source:
  edition: WLC
  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: de
  text: Und warum bringt Jahwe uns in dieses Land, damit wir durch das Schwert fallen? Unsere Frauen und unsere kleinen Kinder werden zur Beute[a]. Wäre es nicht besser für uns, nach Ägypten zurückzukehren?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Raub anheimfallen“; das hebräische Wort bezeichnet Kriegsbeute und kann hier die Gefangennahme durch Feinde einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Und warum
  rationale: Das einleitende וְ führt die Klage aus dem vorherigen Vers fort; „Und warum“ bewahrt diesen Gesprächszusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die geläufige deutsche Umschrift.
- source_word: מֵבִיא
  choice: bringt
  rationale: Das Partizip bezeichnet hier den als gegenwärtig bzw. unmittelbar bevorstehend empfundenen Vorgang; das deutsche Präsens gibt dies natürlich wieder.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: damit wir durch das Schwert fallen
  rationale: Die hebräische Wendung bezeichnet den Tod im Kampf. Die bildhafte Formulierung bleibt erhalten; die eigenständige Frage bildet die anklagende rhetorische Zuspitzung natürlich ab.
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: unsere Frauen und unsere kleinen Kinder
  rationale: נָשִׁים meint im familiären Zusammenhang die Frauen bzw. Ehefrauen; טַף hebt besonders die kleinen, schutzbedürftigen Kinder hervor.
- source_word: יִהְיוּ לָבַז
  choice: werden zur Beute
  rationale: בַּז bezeichnet im Krieg erbeutete Menschen oder Güter. „Zur Beute werden“ ist im Deutschen idiomatisch und lässt offen, ob Gefangennahme oder allgemeine Ausplünderung im Vordergrund steht.
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: Wäre es nicht besser für uns, nach Ägypten zurückzukehren?
  rationale: Die verneinte Frage ist rhetorisch; der deutsche Konjunktiv gibt den erwogenen Gegenvorschlag natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt dies, ohne einen Titel einzusetzen.
- issue: Sinnbeziehung des Infinitivs לִנְפֹּל
  choice: 'als anklagende Zweck-/Folgefrage: „Damit wir … fallen?“'
  alternative: 'in einem Satz: „… in dieses Land, um durch das Schwert zu fallen?“'
  rationale: Der Infinitiv kann Zweck oder erwartete Folge ausdrücken. Die deutsche Frageform bewahrt die rhetorische Spannung, ohne Gott ausdrücklich eine Tötungsabsicht zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Fragen bewahren den erregten, anklagenden Ton der Klage; „kleine Kinder“ ist heute verständlicher als das altertümliche „die Kleinen“.
