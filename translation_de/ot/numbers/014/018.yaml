source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: de
  text: Jahwe ist langsam zum Zorn und reich an beständiger Liebe[a]. Er vergibt Schuld und Auflehnung[b], doch er spricht die Schuldigen keineswegs frei[c]. Er sucht die Schuld der Väter an den Kindern heim, bis in die dritte und vierte Generation[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „reich an Bundestreue“, „reich an Güte“ oder „voller verlässlicher Liebe“.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „vergibt“ übersetzte hebräische Wort bedeutet wörtlich „trägt“ oder „trägt weg“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „doch lässt er keineswegs ungestraft“. Wörtlich steht eine nachdrückliche Verbindung von „freisprechen“ mit sich selbst: „freisprechend spricht er nicht frei“.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „an den Dritten und an den Vierten“; gemeint sind Generationen.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „lang der Nase“ und bezeichnet verzögerten Zorn; die gewählte Formulierung gibt das Bild idiomatisch wieder.
- source_word: רַב חֶסֶד
  choice: reich an beständiger Liebe
  rationale: חֶסֶד umfasst treue, verlässliche und erbarmende Zuwendung, oft im Bundesverhältnis. „Beständige Liebe“ bewahrt den relationalen und dauerhaften Sinn, während „reich an“ רַב wiedergibt.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: Er vergibt Schuld und Auflehnung
  rationale: נשא kann bei Verfehlungen „tragen“, „wegtragen“ und daher „vergeben“ bedeuten. „Schuld“ wahrt die Bedeutungsbreite von עָוֺן, „Auflehnung“ den rebellischen Zug von פָשַׁע.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: doch lässt er keineswegs ungestraft
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Verneinung. Diese deutsche Wendung erhält den gerichtlichen Sinn, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt einzufügen.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: Er sucht die Schuld der Väter an den Kindern heim
  rationale: פקד bezeichnet hier das ahndende Aufsuchen beziehungsweise Wirksamwerdenlassen von Schuld. „Heimsuchen“ wahrt die gerichtliche Aussage, ohne ihren Mechanismus näher festzulegen.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: bis in die dritte und vierte Generation
  rationale: Das Hebräische nennt elliptisch die „Dritten“ und „Vierten“; „Generation“ wird für verständliches Deutsch ergänzt. „Bis in“ drückt die generationenübergreifende Reichweite natürlich aus.
theological_decisions:
- issue: Göttliche Vergebung und nicht aufgehobene Ahndung
  choice: Die Spannung zwischen Vergebung und sicherer Ahndung bleibt ausdrücklich stehen.
  alternative: Die Ahndung als bloße natürliche Folge abzuschwächen oder die Aussage mit späteren Texten zur individuellen Verantwortung harmonisierend umzudeuten.
  rationale: Der hebräische Text stellt beide Aussagen unmittelbar nebeneinander; die Übersetzung darf diese theologische Spannung nicht eigenmächtig auflösen.
- issue: Schuld der Väter an nachfolgenden Generationen
  choice: Die generationenübergreifende Gerichtsformel wird ohne Erklärung ihres genauen Wirkmechanismus beibehalten.
  alternative: Ausdrücklich zu formulieren, dass Kinder nur für eigene gleichartige Sünden bestraft werden, oder ausschließlich von sozialen Folgewirkungen zu sprechen.
  rationale: Solche Deutungen können Auslegungsfragen betreffen, sind aber in diesem Vers nicht ausdrücklich formuliert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit geläufiger biblischer Ausdrucksweise. „Jahwe“, „langsam zum Zorn“ und „heimsuchen“ bewahren den feierlichen Charakter; Satzteilung und heutige Syntax sichern zugleich gute Verständlichkeit. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
