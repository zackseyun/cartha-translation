  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: de
  text: 'Ich, Jahwe, habe gesprochen: Ganz gewiss werde ich dies der ganzen bösen Gemeinschaft antun, die sich gegen mich versammelt hat: In dieser Wüste werden sie zugrunde gehen, und dort werden sie sterben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch den Titel „der HERR“ ersetzt.
- source_word: דִּבַּרְתִּי
  choice: habe gesprochen
  rationale: Das Perfekt bezeichnet die feierlich abgeschlossene göttliche Aussage mit fortwirkender Geltung.
- source_word: אִם לֹא
  choice: So wahr ich lebe
  rationale: Die verkürzte hebräische Schwurformel drückt höchste Gewissheit aus; die deutsche Fassung ergänzt jedoch einen im Hebräischen nicht ausdrücklich genannten Schwurgegenstand und wird deshalb in einer Fußnote erläutert.
- source_word: זֹאת אֶעֱשֶׂה
  choice: genau das werde ich … antun
  rationale: „Genau das“ bewahrt die Hervorhebung des Demonstrativpronomens; „antun“ passt im Deutschen natürlich zum betroffenen Objekt und zum Gerichtskontext.
- source_word: הָעֵדָה
  choice: Gemeinschaft
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels; „Gemeinschaft“ ist gegenwärtig und vermeidet eine vorschnelle kirchliche Färbung.
- source_word: הָרָעָה
  choice: böse
  rationale: Das Adjektiv enthält in diesem Zusammenhang ein moralisches Urteil über die rebellierende Gemeinschaft.
- source_word: הַנּוֹעָדִים עָלַי
  choice: die sich gegen mich zusammengerottet hat
  rationale: Die Form beschreibt ein gemeinsames Zusammenkommen in feindlicher Absicht; „zusammenrotten“ gibt sowohl den kollektiven als auch den gegnerischen Sinn wieder.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: in dieser Wüste
  rationale: „Wüste“ ist die natürliche deutsche Wiedergabe von מִדְבָּר in diesem geografischen Zusammenhang.
- source_word: יִתַּמּוּ
  choice: werden sie zugrunde gehen
  rationale: Die Form meint, dass sie vollständig ein Ende finden; „zugrunde gehen“ hält die Aussage vom folgenden ausdrücklichen Sterben unterscheidbar, ohne hölzern zu wirken.
- source_word: וְשָׁם יָמֻתוּ
  choice: und hier werden sie sterben
  rationale: Das hebräische שָׁם verweist auf den zuvor genannten Ort. Im unmittelbaren Sprechen innerhalb der Wüste ist deutsches „hier“ deiktisch natürlich, während „dort“ formnäher wäre.
theological_decisions:
- issue: Wiedergabe der Schwurformel אִם לֹא
  choice: 'Als feierliche Gewissheitsformel: „So wahr ich lebe“'
  alternative: „Ganz gewiss werde ich …“ bzw. wörtlich „wenn nicht“
  rationale: Die Konstruktion ist keine offene Bedingung, sondern eine abgekürzte Schwurformel. Die Hauptfassung vermittelt deren feierlichen Nachdruck; die Fußnote macht kenntlich, dass „ich lebe“ nicht ausdrücklich im masoretischen Text steht.
- issue: Korporative Bezeichnung עֵדָה
  choice: „Gemeinschaft“
  alternative: „Versammlung“ oder „Gemeinde“
  rationale: Gemeint ist Israel als versammeltes Kollektiv unter Gericht. „Gemeinschaft“ bewahrt diesen korporativen Sinn, ohne die Stelle auf eine spätere kirchliche Institution festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Gerichtston. Der Satzbau bleibt der hebräischen Abfolge nahe, wird aber für natürliche deutsche Lesbarkeit gegliedert. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Schwurformel.
