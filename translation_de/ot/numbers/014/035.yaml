  to: 'Ich, Jahwe, habe gesprochen: Ganz gewiss werde ich dies der ganzen bösen Gemeinschaft antun, die sich gegen mich versammelt hat: In dieser Wüste werden sie zugrunde gehen, und dort werden sie sterben.'
