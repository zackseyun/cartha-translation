  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: de
  text: Eure Söhne werden vierzig Jahre lang Hirten in der Wüste sein[a] und eure Hurerei tragen[b], bis es mit euren Leichnamen in der Wüste zu Ende ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden vierzig Jahre lang als Umherziehende in der Wüste leben“. Das hebräische Wort bedeutet wörtlich „Hirten“ beziehungsweise „Weidende“, kann hier aber das unstete Umherziehen einschließen.'
    reason: lexical_alternative
  - marker: b
    text: „Hurerei“ bezeichnet hier mit sexueller Bildsprache Untreue und Abkehr vom HERRN.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „bis zum Ende eurer Leichname in der Wüste“. Gemeint ist, dass die verurteilte Generation dort vollständig stirbt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: Eure Söhne
  rationale: בנים bezeichnet hier dem gewöhnlichen Wortsinn nach die Söhne der verurteilten Generation; eine Erweiterung zu „Kinder“ ist nicht zwingend.
- source_word: רֹעִים
  choice: Hirten
  rationale: Das Partizip von רעה gehört wörtlich zum Hüten beziehungsweise Weiden. „Hirten“ bewahrt das Bild eines unsteten Hirtenlebens in der Wüste; die kontextuelle Deutung „Umherziehende“ steht in der Fußnote.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר meint unbesiedeltes Weide- und Wüstenland; „Wüste“ ist hier die natürliche und traditionelle deutsche Entsprechung.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: Die deutsche Zeitangabe gibt die Dauer idiomatisch und genau wieder.
- source_word: וְנָשְׂאוּ
  choice: und ... tragen
  rationale: נשא bezeichnet hier das Tragen der Folgen beziehungsweise Last der Schuld. Die konkrete Metapher bleibt erhalten, ohne sie auf eine einzige dogmatische Erklärung festzulegen.
- source_word: אֶת זְנוּתֵיכֶם
  choice: eure Hurerei
  rationale: זְנוּת trägt ausdrücklich sexuelle Bildsprache und bezeichnet im Kontext zugleich treulose Abkehr. „Hurerei“ bewahrt diese anstößige Metapher besser als das allgemeinere „Untreue“; die übertragene Bedeutung wird in der Fußnote erläutert.
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: bis eure Leichname ... vollständig vergangen sind
  rationale: תֹּם bezeichnet das vollständige Zu-Ende-Gehen, während פגרים die Leichname beziehungsweise Körper der Toten bezeichnet. Die Formulierung vermittelt das vollständige Sterben der verurteilten Generation, ohne das Verb unnötig kausativ wiederzugeben.
theological_decisions:
- issue: Sexuelle oder bundestheologische Bedeutung von זְנוּתֵיכֶם
  choice: „eure Hurerei“ im Haupttext, mit Erklärung der übertragenen Untreue in der Fußnote
  alternative: „eure Untreue“ oder „eure Abtrünnigkeit“
  rationale: Der Zusammenhang betrifft Israels Auflehnung gegen den HERRN, doch das hebräische Wort formuliert diese als sexuelle Untreue. Die Übersetzung erhält sowohl die Metapher als auch ihre covenantale Stoßrichtung, ohne sie auf buchstäbliche sexuelle Handlungen zu verengen.
- issue: Ob רֹעִים als Tätigkeit von Hirten oder als Umherwandern wiederzugeben ist
  choice: „Hirten“
  alternative: „Umherziehende“ oder „Wandernde“
  rationale: Die unmittelbare lexikalische Bedeutung gehört zum Hüten und Weiden. Das langjährige Umherziehen ist eine plausible kontextuelle Folgerung, sollte aber die Bildsprache des Ausgangstextes nicht im Haupttext ersetzen.
- issue: Bezug des Tragens in וְנָשְׂאוּ
  choice: Die Söhne tragen die Last beziehungsweise Folgen der Untreue ihrer Eltern
  alternative: Die Söhne büßen unmittelbar die Schuld ihrer Eltern
  rationale: Der Text beschreibt eine generationenübergreifende Folge des Gerichts, bestimmt aber hier nicht abschließend das Verhältnis von Schuld, Strafe und Mitbetroffenheit. „tragen“ wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftige und bewusst anstößige Metapher „Hurerei“ bleibt erhalten; Fußnoten erklären mögliche kontextuelle Wiedergaben. „Leichname“ wahrt den ernsten Ton von פגרים, ohne das gröbere „Kadaver“ zu verwenden.
