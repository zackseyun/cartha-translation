id: NUM.14.17
reference: Numbers 14:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: de
  text: 'Und nun lass doch die Macht des Herrn groß werden[a], wie du gesagt hast:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: lass die Macht des Herrn sich als groß erweisen.'
    reason: Lexikalisch und kontextuell mögliche Deutung von יִגְדַּל, die nicht ein tatsächliches Anwachsen der göttlichen Macht voraussetzt.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion ו als auch den zeitlich-diskursiven Ausdruck עַתָּה und leitet Moses’ Bitte natürlich ein.
- source_word: יִגְדַּל
  choice: lass … groß werden
  rationale: Der Qal-Jussiv drückt hier eine Bitte aus. Die Formulierung bleibt nahe am Bild des Hebräischen und lässt offen, ob von Entfaltung, Offenbarung oder Anerkennung der göttlichen Macht die Rede ist.
- source_word: נָא
  choice: doch
  rationale: Die deutsche Modalpartikel gibt den bittenden, eindringlichen Ton in diesem Gebetszusammenhang natürlicher wieder als ein ausdrücklich eingeschobenes „bitte“.
- source_word: כֹּחַ
  choice: Macht
  rationale: כֹּחַ bezeichnet Kraft beziehungsweise Macht; „Macht“ passt hier zur Fähigkeit des Herrn, in Gericht und Barmherzigkeit zu handeln.
- source_word: אֲדֹנָי
  choice: des Herrn
  rationale: Das hebräische Wort ist der Gottestitel אֲדֹנָי, nicht das Tetragramm. „Herr“ gibt den Titel in idiomatischem Deutsch wieder.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Vergleichskonjunktion stellt die erbetene Handlung in Übereinstimmung mit Gottes vorheriger Aussage.
- source_word: דִּבַּרְתָּ
  choice: du gesagt hast
  rationale: Das Perfekt bezeichnet Gottes vorausgegangene, weiterhin maßgebliche Aussage. „Gesagt hast“ ist im Deutschen für die Einführung des folgenden Zitats natürlicher als „gesprochen hast“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Zitateinleiter wird im Deutschen vor dem unmittelbar folgenden Wortlaut idiomatisch durch einen Doppelpunkt wiedergegeben; ein zusätzliches „indem du sprachst“ wäre unnötig schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: des Herrn
  alternative: Adonai
  rationale: „Herr“ gibt den Titel wieder, ohne ihn mit der besonderen Wiedergabe des Gottesnamens JHWH gleichzusetzen.
- issue: Sinn von יִגְדַּל in Verbindung mit Gottes Macht
  choice: lass … groß werden
  alternative: lass … sich als groß erweisen
  rationale: Die Hauptfassung bewahrt die ungewöhnliche und theologisch spannungsreiche Ausdrucksweise des Hebräischen, ohne zu bestimmen, ob Gottes Macht zunimmt oder in ihrem Handeln sichtbar beziehungsweise anerkannt wird.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. „Doch“ trägt die bittende Nuance von נָא; der Doppelpunkt kündigt das in Vers 18 folgende Zitat an.
