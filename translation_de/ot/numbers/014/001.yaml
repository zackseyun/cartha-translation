  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: de
  text: Da erhob die ganze Gemeinschaft ihre Stimme, und sie schrien laut auf,[a] und das Volk weinte in jener Nacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die ganze Gemeinschaft erhob [die Stimme] … und sie gaben ihre Stimme«; eine hebräische Wendung für einen lauten gemeinsamen Aufschrei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא כָּל־הָעֵדָה
  choice: Da erhob die ganze Gemeinschaft
  rationale: נשׂא bedeutet wörtlich »heben, erheben«; zusammen mit der folgenden Wendung über die Stimme bezeichnet es den Beginn eines lauten gemeinschaftlichen Aufschreis. »Die ganze Gemeinschaft« gibt כָּל־הָעֵדָה natürlich wieder und bezeichnet hier die versammelte Gemeinschaft Israels.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: ihre Stimme und schrie laut auf
  rationale: Die hebräische Wendung lautet wörtlich »sie gaben ihre Stimme«. In Verbindung mit dem vorausgehenden »erhob« beschreibt sie einen lauten gemeinsamen Aufschrei. Der Singular »Stimme« bewahrt die kollektive Ausdrucksweise des Hebräischen; »schrie laut auf« vermittelt idiomatisch ihre Bedeutung.
- source_word: הָעָם
  choice: das Volk
  rationale: Die Wiedergabe erhält den Wechsel von »Gemeinschaft« zu »Volk« im hebräischen Text, obwohl beide Bezeichnungen sich hier auf dieselben Menschen beziehen.
- source_word: וַיִּבְכּוּ
  choice: weinte
  rationale: בכה bezeichnet Weinen. »Weinte« unterscheidet dieses anhaltende Klagen vom vorherigen lauten Aufschrei.
- source_word: בַּלַּיְלָה הַהוּא
  choice: in jener Nacht
  rationale: Eine natürliche und zugleich leicht feierliche Wiedergabe der Zeitangabe »in dieser/jener Nacht«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gemeinschaft« vermeidet eine unnötig kirchliche Färbung von עֵדָה; die kollektive »Stimme« und der Wechsel zu »Volk« bewahren markante Züge des hebräischen Ausdrucks.
