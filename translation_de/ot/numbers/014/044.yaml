source:
  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: de
  text: Doch sie maßen sich an, auf den Gipfel des Berges hinaufzusteigen[a]. Aber die Bundeslade Jahwes[b] und Mose wichen nicht aus der Mitte des Lagers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch sie handelten vermessen, indem sie hinaufstiegen.“ Das hebräische Verb bezeichnet hier eigenmächtiges, vermessenes Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Lade des Bundes Jahwes“; auch: „die Lade von Jahwes Bund“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: sie wagten es in vermessenem Trotz
  rationale: Das seltene Verb bezeichnet hier nicht bloß Wagemut, sondern ein eigenmächtiges, vermessenes Handeln gegen die zuvor ergangene Weisung. Die Formulierung bewahrt sowohl das bewusste Wagen als auch die negative moralische Wertung.
- source_word: לַעֲלוֹת
  choice: hinaufzusteigen
  rationale: Gibt die aufwärts gerichtete Bewegung idiomatisch und präzise wieder.
- source_word: אֶל רֹאשׁ הָהָר
  choice: auf den Gipfel des Berges
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, hier idiomatisch „Gipfel“ oder „oberster Teil“. Der Singular הָהָר wird als „der Berg“ bewahrt.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: Aber die Lade des Bundes Jahwes
  rationale: Die hebräische Konstruktverbindung wird verständlich als „Lade des Bundes Jahwes“ wiedergegeben. Das וַ erhält hier wegen des inhaltlichen Gegensatzes die deutsche Entsprechung „Aber“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא מָשׁוּ
  choice: wichen nicht
  rationale: מוש bezeichnet hier das Sichentfernen oder Weichen von einem Ort. „Wichen nicht“ ist knapp, natürlich und macht deutlich, dass weder die Lade noch Mose das Lager verließen.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: aus der Mitte des Lagers
  rationale: Bewahrt die räumliche Aussage von קֶרֶב und verbindet sich idiomatisch mit „wichen nicht“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt dessen Funktion als Gottes persönlicher Bundesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Schuldhafte Eigenmächtigkeit in וַיַּעְפִּלוּ
  choice: sie wagten es in vermessenem Trotz
  alternative: sie gingen vermessen hinauf
  rationale: Die Wiedergabe hält fest, dass der Aufstieg nicht bloß kühn, sondern vorsätzlich und entgegen der göttlichen Weisung geschah, ohne ein über den Kontext hinausgehendes Motiv festzulegen.
- issue: Verhältnis zwischen Aufstieg und Zurückbleiben der Lade und Moses
  choice: Aber
  alternative: und
  rationale: Das hebräische ו kann schlicht verbinden, doch der Satz stellt den eigenmächtigen Aufstieg deutlich dem Zurückbleiben der Lade und Moses gegenüber. „Aber“ macht diesen im Kontext vorhandenen Gegensatz natürlich sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In vermessenem Trotz“ vermittelt die negative, willentliche Nuance des seltenen hebräischen Verbs, während „Gipfel“ und „aus der Mitte des Lagers“ die räumlichen Angaben klar wiedergeben.
