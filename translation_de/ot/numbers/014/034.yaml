  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: de
  text: Entsprechend der Zahl der Tage, an denen ihr das Land ausgekundschaftet habt – vierzig Tage, einen Tag für ein Jahr, einen Tag für ein Jahr –, sollt ihr vierzig Jahre lang eure Vergehen tragen, und ihr werdet meinen Widerstand erfahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „meine Abkehr“, „meine Feindschaft“, „mein Missfallen“ oder, in traditioneller Deutung, „mein Wortbruch“. Der seltene hebräische Ausdruck ist in seiner genauen Bedeutung umstritten und kann eine Haltung der Entfremdung oder des Widerstands bezeichnen.'
    reason: Lexikalische Alternative bei einem seltenen und semantisch umstrittenen hebräischen Ausdruck.
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: Entsprechend der Zahl der Tage
  rationale: Die Präposition ב mit מִסְפָּר bezeichnet hier die proportionale Entsprechung zwischen den Tagen der Erkundung und den Jahren des Gerichts.
- source_word: תַּרְתֶּם
  choice: ihr ... ausgekundschaftet habt
  rationale: תור bezeichnet in diesem Zusammenhang die gezielte Erkundungsmission in Kanaan. „Auskundschaften“ ist im Deutschen präziser als das neutralere „erkunden“.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Der Ausdruck bezeichnet im Kontext das verheißene Land, ohne dass dies im Text ausdrücklich ergänzt werden muss.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: einen Tag für ein Jahr, einen Tag für ein Jahr
  rationale: Die auffällige Wiederholung des Hebräischen bleibt erhalten und unterstreicht die Entsprechung von vierzig Tagen und vierzig Jahren.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: sollt ihr ... eure Vergehen tragen
  rationale: Die Wendung נשא עון umfasst Schuld und deren Folgen. „Vergehen tragen“ bewahrt das konkrete Bild des Tragens und die Mehrzahl des hebräischen Ausdrucks, ohne die Aussage auf bloßes Erleiden zu reduzieren.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr ... erfahren
  rationale: ידע meint hier ein Erkennen durch persönliche Erfahrung. „Erfahren“ gibt diesen Vollzug im Deutschen natürlicher wieder als das rein kognitive „wissen“.
- source_word: תְּנוּאָתִי
  choice: meinen Widerstand
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich Gottes ablehnende oder entgegenstehende Haltung gegenüber der rebellischen Generation. „Widerstand“ wahrt die Härte des Gerichts und vermeidet die irreführende Vorstellung eines göttlichen Wortbruchs.
theological_decisions:
- issue: Deutung des seltenen Ausdrucks תְּנוּאָתִי
  choice: meinen Widerstand
  alternative: meine Abkehr; meine Feindschaft; mein Missfallen; meinen Wortbruch
  rationale: Der Ausdruck ist lexikalisch unsicher und kann Opposition oder Entfremdung bezeichnen. „Widerstand“ passt zum Gerichtskontext, ohne Gott einen Bruch seiner Verheißung zuzuschreiben; die echte Bedeutungsbreite wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung „einen Tag für ein Jahr“ und das hebräische Bild des Tragens bleiben erhalten; Gedankenstriche gliedern die lange Zeitangabe für bessere Verständlichkeit.
