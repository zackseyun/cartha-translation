  text: אִם יִרְאוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לַ/אֲבֹתָ֑/ם וְ/כָל מְנַאֲצַ֖/י לֹ֥א יִרְאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/023.yaml
  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: de
  text: Sie werden das Land, das ich ihren Vätern mit einem Eid zugesagt habe, ganz gewiss nicht sehen[a]; und keiner, der mich verachtet, wird es sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „wenn sie das Land sehen“. In dieser Schwurformel bedeutet das eine nachdrückliche Verneinung: „Sie werden das Land ganz gewiss nicht sehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: Sie werden … ganz gewiss nicht sehen
  rationale: אִם eröffnet hier im Zusammenhang mit der vorausgehenden Schwurformel keinen gewöhnlichen Bedingungssatz, sondern drückt eine nachdrückliche Verneinung aus. Die deutsche Wiedergabe macht diese idiomatische Kraft ausdrücklich.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang ist das Israel verheißene Land gemeint. „Das Land“ bewahrt zugleich die knappe biblische Ausdrucksweise.
- source_word: נִשְׁבַּעְתִּי
  choice: zugeschworen habe
  rationale: Der Niphal von שבע bezeichnet das Schwören. „Zugeschworen“ gibt hier natürlich und präzise wieder, dass Gott den Vätern das Land durch einen Eid zugesagt hat.
- source_word: לַאֲבֹתָם
  choice: ihren Vätern
  rationale: Die hebräische Form bezeichnet ausdrücklich „ihre Väter“ und verweist hier auf Israels Vorväter. Die konkrete männliche Bezeichnung bleibt erhalten.
- source_word: מְנַאֲצַי
  choice: die mich verachtet haben
  rationale: Das Partizip von נאץ bezeichnet verächtliches Zurückweisen oder Missachten, besonders gegenüber Gott. „Verachtet“ ist klar, gewichtig und im modernen Deutsch natürlich.
- source_word: לֹא יִרְאוּהָ
  choice: wird es sehen
  rationale: Das Suffix bezieht sich auf „das Land“. In Verbindung mit „keiner“ steht das Verb im Deutschen ohne zusätzliches „nicht“; die Wiederholung von „sehen“ bleibt wie im Hebräischen erhalten.
theological_decisions:
- issue: Aussagekraft der einleitenden Schwurformel
  choice: 'Nachdrückliche Verneinung: „ganz gewiss nicht sehen“'
  alternative: 'Wörtlich: „wenn sie das Land sehen“'
  rationale: Im Kontext der göttlichen Eidesrede fungiert אִם idiomatisch als Selbstverwünschungs- beziehungsweise Schwurformel mit emphatisch negativer Aussage. Eine bloß bedingende Wiedergabe würde das Gerichtswort im Deutschen verdunkeln.
- issue: Wiedergabe von אָבוֹת
  choice: „ihren Vätern“ im Haupttext
  alternative: „ihren Vorfahren“
  rationale: Der Ausgangstext verwendet die konkrete männliche Verwandtschaftsbezeichnung. „Väter“ wahrt diese Form und den Bezug auf die patriarchalen Vorväter Israels, ohne den Ausdruck zu verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlichem Gerichtston. Die doppelte Aussage „sehen“ bleibt erhalten; „ganz gewiss nicht“ vermittelt die Stärke der hebräischen Schwurformel, ohne eine im Deutschen missverständliche wörtliche Bedingung zu erzeugen.
