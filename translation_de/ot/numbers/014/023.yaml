- from: Sie werden das Land, das ich ihren Vätern zugeschworen habe, ganz gewiss nicht sehen[a]; und keiner von denen, die mich verachtet haben, wird es sehen.
  to: Sie werden das Land, das ich ihren Vätern mit einem Eid zugesagt habe, ganz gewiss nicht sehen[a]; und keiner, der mich verachtet, wird es sehen.
  rationale: Die Änderung von „verachtet haben“ zu „verachtet“ gibt den partizipialen, personencharakterisierenden Ausdruck מְנַאֲצַי genauer wieder. Der gestraffte Relativsatz ist idiomatischer. „Mit einem Eid zugesagt“ entfaltet die in „schwor“ enthaltene Eidesaussage in natürlichem Deutsch, ohne den Sinn zu erweitern. Die Fußnote zur idiomatischen Schwurformel bleibt sachgerecht und am passenden Satzteil verankert.
