  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/כָלֵב֙ בֶּן יְפֻנֶּ֔ה מִן הַ/תָּרִ֖ים אֶת הָ/אָ֑רֶץ קָרְע֖וּ בִּגְדֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: de
  text: Josua, der Sohn Nuns, und Kaleb, der Sohn Jefunnes, die zu denen gehörten, die das Land erkundet hatten, zerrissen ihre Kleider.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zerreißen der eigenen Kleider war ein übliches Zeichen tiefer Trauer, Bestürzung oder Erschütterung.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: Josua, der Sohn Nuns
  rationale: Die Konjunktion eröffnet im Hebräischen den fortlaufenden Satzanschluss, muss im Deutschen nach der vorangehenden Satzstruktur aber nicht eigens mit „und“ wiedergegeben werden. Das Patronym wird klar und würdig als „der Sohn Nuns“ formuliert.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: und Kaleb, der Sohn Jefunnes
  rationale: Die Konjunktion verbindet Kaleb mit Josua als gemeinsames Subjekt. Die Namen folgen den geläufigen deutschen Bibelformen.
- source_word: מִן הַתָּרִים אֶת הָאָרֶץ
  choice: die zu denen gehörten, die das Land erkundet hatten
  rationale: מִן ist hier partitiv und ordnet Josua und Kaleb der größeren Gruppe der Kundschafter zu. Die Umschreibung macht diese Zugehörigkeit im Deutschen eindeutig; das Plusquamperfekt bezeichnet die vorausgegangene Erkundung.
- source_word: קָרְעוּ
  choice: zerrissen
  rationale: Das Verb bezeichnet das Zerreißen von Stoff. „Zerrissen“ ist die natürliche moderne Wiedergabe und bewahrt die kräftige Handlung.
- source_word: בִּגְדֵיהֶם
  choice: ihre Kleider
  rationale: „Kleider“ ist im Deutschen eine natürliche und zugleich würdevolle Bezeichnung für die getragenen Kleidungsstücke.
