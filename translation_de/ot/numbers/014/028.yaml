source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: de
  text: 'Sag zu ihnen: ›So wahr ich lebe – Ausspruch des HERRN –, ich werde mit euch genauso verfahren, wie ihr vor meinen Ohren gesprochen habt.‹'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָ֨נִי
  choice: So wahr ich lebe
  rationale: Die idiomatische deutsche Schwurformel gibt die wörtliche Wendung »Ich lebe« natürlich und mit ihrer feierlichen Bekräftigung wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch des HERRN
  rationale: »Ausspruch« bewahrt die formelhafte, autoritative Redeankündigung; das Tetragramm wird der etablierten deutschen Bibelkonvention entsprechend mit »HERR« wiedergegeben.
- source_word: אִם לֹא
  choice: '[durch die deutsche Schwurformel ausgedrückt]'
  rationale: Nach »So wahr ich lebe« fungiert אִם לֹא als bekräftigende Schwurpartikel. Eine zusätzliche Wiedergabe mit »gewiss« wäre im Deutschen möglich, aber stilistisch redundant.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: genauso ..., wie ...
  rationale: Die korrelative Entsprechung zwischen den Worten des Volkes und Gottes Handeln bleibt ausdrücklich erhalten.
- source_word: דִּבַּרְתֶּם בְּאָזְנָי
  choice: ihr es vor meinen Ohren gesagt habt
  rationale: Die konkrete hebräische Körpermetapher wird bewahrt und ist im Deutschen verständlich.
- source_word: אֶעֱשֶׂה לָכֶם
  choice: werde ich mit euch ... verfahren
  rationale: Im Kontext bezeichnet עשה ל־ das Handeln an beziehungsweise gegenüber Personen; »mit euch verfahren« ist natürlich und wahrt den drohenden Sinn.
theological_decisions:
- issue: Göttlicher Schwur und angekündigtes Gericht
  choice: Die Aussage wird als feierlicher, sicher eintretender göttlicher Schwur wiedergegeben.
  alternative: Eine bloße Vorhersage ohne Schwurcharakter.
  rationale: חַי אָנִי zusammen mit אִם לֹא bildet eine Schwurformel und unterstreicht die Gewissheit des angekündigten Handelns.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH oder Jahwe
  rationale: »HERR« folgt der verbreiteten deutschsprachigen Lesetradition, ohne eine unsichere Rekonstruktion der Aussprache in den Haupttext einzutragen.
translation_notes:
  register: Feierlich und bestimmt, zugleich in modernem Standarddeutsch. Die direkte Rede und die Parallelstruktur des Hebräischen bleiben erhalten; es sind keine Fußnoten erforderlich.
