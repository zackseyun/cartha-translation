  text: וַ/יִּפֹּ֥ל מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פְּנֵי/הֶ֑ם לִ/פְנֵ֕י כָּל קְהַ֥ל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: de
  text: Da warfen sich Mose und Aaron vor der ganzen Versammlung der Gemeinde der Söhne Israels mit dem Gesicht zur Erde nieder.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da fielen Mose und Aaron auf ihre Gesichter.“ Die hebräische Wendung bezeichnet eine Niederwerfung.'
    reason: lexical_alternative
  - marker: b
    text: „Versammlung der Gemeinde“ gibt zwei verwandte hebräische Gemeinschaftsbegriffe wieder. „Söhne Israels“ kann hier auch mit „Israeliten“ oder „Kinder Israels“ wiedergegeben werden und bezeichnet das Volk Israel insgesamt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: warfen sich … zu Boden
  rationale: Die Erzählform von נפל bezeichnet wörtlich ein Fallen. Zusammen mit עַל־פְּנֵיהֶם beschreibt sie hier jedoch die bewusste Niederwerfung; die gewählte deutsche Wendung gibt die Handlung natürlich und klar wieder, ohne ein versehentliches Stürzen nahezulegen.
- source_word: עַל־פְּנֵיהֶם
  choice: mit dem Gesicht zu Boden
  rationale: Die hebräische Wendung lautet wörtlich „auf ihre Gesichter“ und bezeichnet eine Niederwerfung. Die deutsche Formulierung ist gegenwärtig, anschaulich und weniger altertümlich als „auf ihr Angesicht“.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet die räumliche und öffentliche Gegenwart der versammelten Gemeinschaft; „vor“ ist knapp und genau.
- source_word: כָּל
  choice: der ganzen
  rationale: Bei einem Kollektivum gibt „der ganzen“ die umfassende Bedeutung natürlich wieder.
- source_word: קְהַל
  choice: Versammlung
  rationale: קָהָל bezeichnet die zusammengekommene Körperschaft; „Versammlung“ bewahrt den konkreten Versammlungscharakter.
- source_word: עֲדַת
  choice: Gemeinde
  rationale: עֵדָה bezeichnet die organisierte Gemeinschaft. „Gemeinde“ unterscheidet den Ausdruck von קָהָל und erhält so beide verwandten Gemeinschaftsbegriffe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Dies entspricht der ausdrücklich maskulinen hebräischen Form und bewahrt zugleich die traditionelle Bezeichnung des Volkes; gemeint ist das Volk Israel als Ganzes.
theological_decisions:
- issue: Ob die beiden verwandten Gemeinschaftsbegriffe קְהַל עֲדַת zu einem einzigen deutschen Ausdruck geglättet werden sollen
  choice: Beide Begriffe als „Versammlung der Gemeinde“ beibehalten
  alternative: „die ganze Gemeinde“ oder „die versammelte Gemeinde“
  rationale: Die hebräische Konstruktion setzt zwei verwandte Substantive zusammen und verleiht der öffentlichen Szene feierliches Gewicht. Die Übersetzung bewahrt diese Doppelung, obwohl sie im Deutschen ungewöhnlicher klingt.
- issue: Ob בְּנֵי יִשְׂרָאֵל geschlechtsneutral wiedergegeben werden soll
  choice: „Söhne Israels“
  alternative: „Israeliten“ oder „Kinder Israels“
  rationale: Die Übersetzung hält sich an die grammatisch maskuline und ethnisch bestimmte Form des Ausgangstextes. Die Fußnote stellt klar, dass die feste Bezeichnung hier das Volk Israel insgesamt meint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die körperliche Geste wird idiomatisch wiedergegeben; die auffällige Doppelbezeichnung der Gemeinschaft und die quellensprachliche Form „Söhne Israels“ bleiben bewusst erhalten.
