source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: de
  text: Weil Jahwe nicht imstande war, dieses Volk in das Land zu bringen, das er ihnen zugeschworen hatte[a], schlachtete er sie in der Wüste ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das er ihnen zu geben geschworen hatte«.'
    reason: Die Gabe des Landes ist im Zusammenhang gemeint, wird in diesem Vers aber nicht ausdrücklich genannt.
lexical_decisions:
- source_word: מִבִּלְתִּי יְכֹלֶת
  choice: Weil … nicht imstande war
  rationale: Die Verbindung bezeichnet hier als angebliche Begründung die fehlende Fähigkeit Jahwes. Die deutsche Formulierung gibt den kausalen Sinn natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְהָבִיא
  choice: zu bringen
  rationale: Der Hifil von בוא bezeichnet das Veranlassen des Hineingehens; zusammen mit dem Ziel ist »in das Land zu bringen« idiomatisch.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Bewahrt den kollektiven Singular und klingt im Deutschen natürlich.
- source_word: אֶל הָאָרֶץ
  choice: in das Land
  rationale: Mit »bringen« bezeichnet die Präposition hier den Eintritt in das Land.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: das er ihnen zugeschworen hatte
  rationale: Die Formulierung bewahrt, dass im Hebräischen kein ausdrückliches »zu geben« steht, und gibt zugleich die Zusage unter Eid idiomatisch wieder.
- source_word: וַיִּשְׁחָטֵם
  choice: schlachtete er sie … ab
  rationale: שׁחט ist stärker als ein neutrales »töten« und bezeichnet ein Niedermetzeln bzw. Abschlachten; die trennbare Form ist im modernen Deutsch natürlich und erhält die Härte.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: »Wüste« ist die geläufige deutsche Wiedergabe für die unbewohnte Wildnis des Pentateuchs.
theological_decisions:
- issue: Behauptete Unfähigkeit Jahwes im Urteil der Völker
  choice: Weil Jahwe nicht imstande war …
  alternative: Weil Jahwe dieses Volk nicht … bringen konnte …
  rationale: Der Vers gibt im Zusammenhang die von den Völkern erwartete Anschuldigung wieder. Die Übersetzung wahrt diese theologische Spannung, ohne sie als tatsächliche Begrenzung Gottes zu erklären oder abzuschwächen.
- issue: Gegenstand des Schwurs
  choice: das er ihnen zugeschworen hatte
  alternative: das er ihnen zu geben geschworen hatte
  rationale: Die gewählte Fassung lässt die im Hebräischen knappe Konstruktion stehen, während die Alternative das kontextuell naheliegende Geben ausdrücklich ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Nicht imstande« erhält den Vorwurfscharakter; »schlachtete … ab« gibt die drastische Wortwahl wieder. Der Fußnotenmarker [a] steht unmittelbar an der betreffenden Wendung.
