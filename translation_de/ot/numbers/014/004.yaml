  text: וַ/יֹּאמְר֖וּ אִ֣ישׁ אֶל אָחִ֑י/ו נִתְּנָ֥ה רֹ֖אשׁ וְ/נָשׁ֥וּבָה מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: de
  text: 'Da sagten sie zueinander[a]: »Lasst uns einen Anführer[b] einsetzen und nach Ägypten zurückkehren!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Mann zu seinem Bruder«. Die hebräische Wendung bedeutet hier, dass sie untereinander sprachen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ein Haupt«. Gemeint ist eine Person, die als Oberhaupt über die Gruppe eingesetzt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Das Wayyiqtol führt die Erzählung weiter. »Da sagten sie« gibt die zeitlich-fortschreitende Funktion im Deutschen natürlich wieder.
- source_word: אִישׁ אֶל־אָחִיו
  choice: zueinander
  rationale: Wörtlich steht »ein Mann zu seinem Bruder«; die distributive Wendung bezeichnet hier das wechselseitige Reden innerhalb der Gruppe.
- source_word: נִתְּנָה
  choice: Lasst uns … einsetzen
  rationale: Die Kohortativform von נתן drückt eine gemeinsame Aufforderung aus. Zusammen mit רֹאשׁ bedeutet sie, jemanden als Oberhaupt einzusetzen.
- source_word: רֹאשׁ
  choice: einen Anführer
  rationale: Das Wort bedeutet wörtlich »Kopf« oder »Haupt«, bezeichnet hier aber funktional eine Person, die die Gruppe führen soll.
- source_word: וְנָשׁוּבָה
  choice: und … zurückkehren
  rationale: Auch diese Kohortativform drückt den gemeinsamen Entschluss beziehungsweise Vorschlag aus; die einmalige Wiedergabe durch »Lasst uns« umfasst beide koordinierten Verben.
- source_word: מִצְרָיְמָה
  choice: nach Ägypten
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf Ägypten zu. Das vorangehende »zurückkehren« macht die Rückbewegung bereits deutlich.
