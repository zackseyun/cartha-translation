  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: de
  text: 'Da sagte Jahwe: »Ich habe vergeben, wie du gesagt hast.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe verziehen, deinem Wort entsprechend.«'
    reason: Lexikalisch und formal mögliche Wiedergabe von סָלַחְתִּי כִּדְבָרֶךָ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Consecutivum führt die Erzählung weiter. »Da sagte« gibt diesen Fortgang in natürlichem modernem Deutsch wieder, ohne eine stärkere Folgerung auszudrücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: סָלַחְתִּי
  choice: Ich habe vergeben
  rationale: Das Verb סלח bezeichnet Vergebung oder Begnadigung. Das Perfekt wird als vollzogene Handlung mit gegenwärtiger Bedeutung wiedergegeben.
- source_word: כִּדְבָרֶךָ
  choice: wie du gesagt hast
  rationale: Wörtlich bedeutet die Wendung »gemäß deinem Wort«. Die gewählte Form ist natürliches Deutsch und bewahrt den Bezug auf Moses vorausgehende Fürbitte, ohne die Aussage näher zu bestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova
  rationale: Im hebräischen Text steht unmittelbar das Tetragramm יהוה. Die Wiedergabe »Jahwe« bewahrt den persönlichen Gottesnamen.
- issue: Reichweite der zugesagten Vergebung
  choice: Die knappe Aussage bleibt ohne erklärenden Zusatz stehen.
  alternative: Ausdrückliche Einschränkung der Vergebung auf bestimmte Folgen oder Personen
  rationale: Der Vers sagt lediglich, dass Jahwe Moses Bitte entsprechend vergeben hat. Wie sich dies zu den anschließend angekündigten Folgen verhält, wird im weiteren Kontext entfaltet und soll hier nicht vorwegnehmend aufgelöst werden.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und entspricht der Prägnanz des Hebräischen.
