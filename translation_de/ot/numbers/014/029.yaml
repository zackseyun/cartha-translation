base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: de
  text: In dieser Wüste werden eure Leichen fallen[a] – alle von euch, die bei der Zählung erfasst wurden[b], eure gesamte Zahl, von zwanzig Jahren an und darüber, die ihr gegen mich gemurrt habt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Leichname werden fallen“. Das Hebräische formuliert bewusst konkret und körperlich.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die bei der Zählung erfassten Personen; im Zusammenhang kann dies eine Musterung für den Heeresdienst einschließen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die ihr euch gegen mich beklagt habt“. „Murren“ bezeichnet hier aufbegehrendes Klagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: In dieser Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Wildnis- oder Wüstenland. „Wüste“ ist im Deutschen natürlich und bewahrt den geographischen Zusammenhang.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: werden eure Leichen fallen
  rationale: נפל bedeutet wörtlich „fallen“, und פֶּגֶר bezeichnet den Leichnam. Die konkrete, harte Bildsprache des Gerichts bleibt so erhalten, statt sie zu „ihr werdet sterben“ zu glätten.
- source_word: וְכָל פְּקֻדֵיכֶם
  choice: ihr alle, die ihr gemustert worden seid
  rationale: פְּקוּדִים meint hier die bei der Volkszählung beziehungsweise militärischen Musterung Erfassten. „Gemustert“ bildet diesen Zusammenhang genauer ab als das allgemeinere „gezählt“.
- source_word: לְכָל מִסְפַּרְכֶם
  choice: eure ganze Zahl
  rationale: Die Wendung unterstreicht die Vollständigkeit der erfassten Gruppe. Die knappe Apposition bewahrt diese Verstärkung, ohne im Deutschen unnötig schwerfällig zu werden.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: von zwanzig Jahren an und darüber
  rationale: Die Formulierung gibt die hebräische Altersgrenze eng wieder und ist in gehobenem modernem Deutsch verständlich.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: die ihr gegen mich gemurrt habt
  rationale: Das Hifil von לון bezeichnet in den Wüstenerzählungen wiederholtes, aufbegehrendes Klagen. „Murren“ wahrt diesen biblisch geprägten, aber weiterhin verständlichen Sinn.
theological_decisions:
- issue: Konkretheit der Gerichtsaussage
  choice: Die körperliche Wendung „eure Leichen werden fallen“ wird beibehalten.
  alternative: „Ihr werdet in dieser Wüste sterben.“
  rationale: Der hebräische Text betont den leiblichen Tod als Gericht. Eine bloße Sterbeformel würde die drastische Bildsprache abschwächen.
- issue: Bezug der gezählten Gruppe
  choice: Die Aussage wird auf sämtliche Gemusterten ab zwanzig Jahren bezogen.
  alternative: Eine Verallgemeinerung auf das ganze Volk ohne Bezug zur Musterung.
  rationale: פְּקֻדֵיכֶם und die Altersformel verweisen ausdrücklich auf die erfasste Zensus- beziehungsweise Musterungsgruppe; darüber hinausgehende Präzisierungen werden nicht eingeführt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die drastische Bildsprache des Hebräischen und der Musterungsbezug bleiben erhalten; der Gedankenfluss wird durch einen Gedankenstrich gegliedert.
