base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: de
  text: Die Amalekiter und die Kanaaniter wohnen im Tal. Morgen wendet euch und brecht auf in die Wüste, auf dem Weg zum Roten Meer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Schilfmeer“. Traditionell als „Rotes Meer“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: Die Amalekiter und die Kanaaniter
  rationale: Die bestimmten singularischen Volksbezeichnungen sind kollektiv gebraucht und werden im natürlichen Deutschen als Plural wiedergegeben. Das erste וְ verbindet den Satz mit dem Kontext, muss hier aber nicht eigens mit „und“ wiedergegeben werden.
- source_word: יוֹשֵׁב בָּעֵמֶק
  choice: wohnen im Tal
  rationale: Das Partizip bezeichnet einen andauernden Aufenthalt; „wohnen“ gibt diesen Sinn knapp und idiomatisch wieder. עֵמֶק wird in seinem üblichen topografischen Sinn als „Tal“ übersetzt.
- source_word: מָחָר פְּנוּ
  choice: Morgen wendet euch
  rationale: מָחָר bedeutet „morgen“. פנה fordert hier zu einem Richtungswechsel auf; „wendet euch“ wahrt den Grundsinn, ohne das im Kontext mögliche „zurück“ in den Text einzutragen.
- source_word: וּסְעוּ לָכֶם הַמִּדְבָּר
  choice: und brecht in die Wüste auf
  rationale: נסע bezeichnet beim Reisen häufig das Aufbrechen und Weiterziehen. „Aufbrechen“ ist im Deutschen natürlich. מִדְבָּר meint das unbewohnte Wildnis- beziehungsweise Wüstengebiet. Das ethische Dativpronomen לָכֶם wird nicht hölzern eigens wiedergegeben, da die reflexive Wendung und der Imperativ den Bezug auf die Angesprochenen bereits ausdrücken.
- source_word: דֶּרֶךְ יַם סוּף
  choice: auf dem Weg zum Roten Meer[a]
  rationale: דֶּרֶךְ bezeichnet hier Weg oder Richtung. יַם סוּף wird als etablierte geografische Bezeichnung traditionell mit „Rotes Meer“ wiedergegeben; die wörtlichere Wiedergabe steht transparent in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Imperative bleiben deutlich; die hebräische Knappheit wird bewahrt, ohne unnatürliche deutsche Satzbildung. Der Fußnotenmarker steht unmittelbar bei der geografischen Bezeichnung, auf die sich die Anmerkung bezieht.
