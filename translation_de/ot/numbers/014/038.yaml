  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/כָלֵ֖ב בֶּן יְפֻנֶּ֑ה חָיוּ֙ מִן הָ/אֲנָשִׁ֣ים הָ/הֵ֔ם הַֽ/הֹלְכִ֖ים לָ/ת֥וּר אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: de
  text: Doch von jenen Männern, die ausgezogen waren, um das Land zu erkunden, blieben Josua, der Sohn Nuns, und Kaleb, der Sohn Jefunnes, am Leben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Land auszukundschaften« oder »das Land zu erforschen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Doch Josua
  rationale: Das Präfix וְ wird im Zusammenhang adversativ wiedergegeben, da Josuas und Kalebs Überleben dem Tod der übrigen Kundschafter gegenübersteht.
- source_word: בִּן נוּן
  choice: der Sohn Nuns
  rationale: Die hebräische Abstammungsangabe wird in natürlichem, würdigem Deutsch bewahrt.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: und Kaleb, der Sohn Jefunnes
  rationale: Die Konjunktion verbindet den zweiten Überlebenden mit Josua; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: חָיוּ
  choice: blieben ... am Leben
  rationale: 'Die Wendung gibt den kontextuellen Gegensatz präzise wieder: Anders als die übrigen Männer starben Josua und Kaleb nicht.'
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: von jenen Männern
  rationale: מִן bezeichnet hier die Gruppe, aus der diese beiden als Überlebende hervorgingen; die deutsche Formulierung bleibt nah am Hebräischen.
- source_word: הַהֹלְכִים
  choice: die ausgezogen waren
  rationale: Das Partizip beschreibt rückblickend die Männer, die sich auf den Erkundungsauftrag begeben hatten; das Plusquamperfekt entspricht dem Erzählzusammenhang.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: um das Land zu erkunden
  rationale: תור bezeichnet hier die Erkundung beziehungsweise Auskundschaftung Kanaans. »Erkunden« ist im modernen Deutsch natürlich und vermeidet eine unnötige Verengung auf verdeckte Spionage.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Namen folgen den im Deutschen üblichen biblischen Formen Josua, Kaleb, Nun und Jefunne; die leichte Wiederholung der Abstammungsangaben bewahrt die Struktur des hebräischen Textes.
