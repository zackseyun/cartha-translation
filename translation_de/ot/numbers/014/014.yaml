revisions:
- from: Und sie werden es den Bewohnern dieses Landes erzählen. Diese haben gehört, dass du, Jahwe, mitten unter diesem Volk bist, dass du, Jahwe, Auge in Auge zu sehen bist[a], dass deine Wolke über ihnen steht und dass du tagsüber in einer Wolkensäule und nachts in einer Feuersäule vor ihnen hergehst.
  to: Und sie werden es den Bewohnern dieses Landes erzählen, die gehört haben, dass du, Jahwe, mitten unter diesem Volk bist, dass du, Jahwe, Auge in Auge sichtbar bist[a], dass deine Wolke über ihnen steht und dass du tagsüber in einer Wolkensäule und nachts in einer Feuersäule vor ihnen hergehst.
  rationale: Die Revision korrigiert die potenziell modale Nuance von „zu sehen bist“ zu „sichtbar bist“ und verbindet den Satz wieder als Relativsatz. Sie ändert weder die Aussage noch die bewusst erhaltene Ambiguität der Wendung „Auge in Auge“.
