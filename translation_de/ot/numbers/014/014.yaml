  revision_rationale: Die Revision korrigiert die potenziell modale Nuance von „zu sehen bist“ zu „sichtbar bist“ und verbindet den Satz wieder als Relativsatz. Sie ändert weder die Aussage noch die bewusst erhaltene Ambiguität der Wendung „Auge in Auge“.
