source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: de
  text: Und sie werden es den Bewohnern dieses Landes erzählen, die gehört haben, dass du, Jahwe, mitten unter diesem Volk bist, dass du, Jahwe, Auge in Auge sichtbar bist[a], dass deine Wolke über ihnen steht und dass du tagsüber in einer Wolkensäule und nachts in einer Feuersäule vor ihnen hergehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich von Angesicht zu Angesicht zeigst“; wörtlich: „Auge in Auge gesehen wirst“.'
    reason: Die hebräische Wendung עַיִן בְּעַיִן und das Niphal נִרְאָה lassen sich sowohl näher am passiven Wortlaut als auch idiomatischer als sichtbares Erscheinen wiedergeben.
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: die Bewohner dieses Landes
  rationale: Das substantivierte Partizip im Singular hat kollektiven Sinn; der deutsche Plural gibt die ansässige Bevölkerung natürlich wieder.
- source_word: שָׁמְעוּ
  choice: Diese haben gehört
  rationale: Das Perfekt bezeichnet hier eine bereits erlangte Kenntnis. Der eigenständige Satz bildet zudem die hebräische Satzfolge klarer ab als ein schwerer deutscher Relativsatz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift des göttlichen Eigennamens bewahrt den Namen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: בְּקֶרֶב
  choice: mitten unter
  rationale: Die Wendung gibt Gottes Gegenwart innerhalb des Volkes natürlich und konkret wieder.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: Auge in Auge zu sehen bist
  rationale: Die Formulierung bewahrt sowohl das Bild „Auge in Auge“ als auch den Wahrnehmungsaspekt des Niphal von ראה, ohne die Aussage eindeutig als „von Angesicht zu Angesicht erscheinen“ auszulegen.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: deine Wolke über ihnen steht
  rationale: Die konkrete Bildsprache von עמד על wird eng und in verständlichem Deutsch wiedergegeben.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: vor ihnen hergehst
  rationale: Dies entspricht dem konkreten Verb הלך und vermeidet die stärker deutende Wiedergabe „sie führst“.
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: in einer Wolkensäule ... in einer Feuersäule
  rationale: Die lokativ-modale Wiedergabe wahrt die Aussage, dass Jahwe in diesen sichtbaren Erscheinungsformen vor dem Volk hergeht.
- source_word: יוֹמָם ... לָיְלָה
  choice: tagsüber ... nachts
  rationale: Dies sind die natürlichen modernen deutschen Entsprechungen der adverbialen Zeitangaben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht den Gottesnamen selbst. „Jahwe“ bewahrt ihn in gebräuchlicher deutscher Umschrift, statt einen Titel einzusetzen.
- issue: Bedeutung von עַיִן בְּעַיִן נִרְאָה
  choice: Auge in Auge zu sehen bist
  alternative: dich von Angesicht zu Angesicht zeigst
  rationale: Die gewählte Fassung erhält die ungewöhnliche Bildsprache und die Spannung zwischen Sichtbarwerden und Gesehenwerden, anstatt sie auf eine bestimmte Vorstellung unmittelbarer Gottesschau festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die wiederholten dass-Sätze bewahren den Nachdruck des Hebräischen. Der ungewöhnliche Ausdruck „Auge in Auge“ bleibt bewusst stehen und wird durch eine Fußnote erläutert.
