  to: Ganz gewiss werdet ihr nicht in das Land kommen, über das ich meine Hand erhoben habe, um euch darin wohnen zu lassen[a] – mit Ausnahme von Kaleb, dem Sohn Jefunnes, und Josua, dem Sohn Nuns.
