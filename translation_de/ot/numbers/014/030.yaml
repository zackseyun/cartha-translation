  source_fidelity: Die nachdrückliche Verneinung der einleitenden hebräischen Schwurformel ist zutreffend wiedergegeben. Auch die Ausnahmen, Namen und die kausative Aussage von לְשַׁכֵּן sind sachgerecht erfasst. Die Beziehung der Handerhebung zum Land sollte jedoch im Deutschen nicht mit „bei dem“ ausgedrückt werden, da dies die hebräische Schwurformel semantisch verunklart.
  naturalness: „Bei dem ich meine Hand erhoben habe“ ist im modernen Standarddeutsch keine natürliche oder verständliche Formulierung für einen Schwur in Bezug auf das Land. „Über das ich meine Hand erhoben habe“ bewahrt das Bild und ist im biblisch-würdigen Register idiomatischer. Die Ausnahmen werden mit „mit Ausnahme von“ grammatisch klar angeschlossen.
  terminology: „Land“, „Hand erhoben“, „wohnen zu lassen“, „Kaleb“, „Jefunne“ und „Josua“ sind angemessen. Die Fußnote erklärt die Schwurgeste ohne eine konfessionell einengende Auslegung.
