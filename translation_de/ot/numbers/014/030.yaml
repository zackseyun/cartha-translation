base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: de
  text: Ganz gewiss werdet ihr nicht in das Land kommen, über das ich meine Hand erhoben habe, um euch darin wohnen zu lassen[a] – mit Ausnahme von Kaleb, dem Sohn Jefunnes, und Josua, dem Sohn Nuns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Land, über das ich meine Hand erhoben habe, um euch darin wohnen zu lassen“. Das Erheben der Hand war eine Schwurgeste; Gott hatte geschworen, ihnen das Land als Wohnort zu geben.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: Ganz gewiss werdet ihr nicht … kommen
  rationale: Das einleitende אִם hat in dieser Schwurformel stark verneinende Kraft. Die ausdrückliche deutsche Verneinung gibt die idiomatische Bedeutung und den Nachdruck des Gerichtswortes wieder.
- source_word: אֶל הָאָרֶץ
  choice: in das Land
  rationale: Bei בוא bezeichnet אֶל hier das Hineinkommen in ein Gebiet; „in das Land kommen“ ist im Deutschen natürlich.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: bei dem ich meine Hand erhoben habe
  rationale: Die Formulierung bewahrt das hebräische Bild des Handerhebens als Schwurgeste, ohne den Sinn im Haupttext vollständig auszudeuten.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: um euch darin wohnen zu lassen
  rationale: Der Kausativ von שׁכן bedeutet, jemanden wohnen zu lassen beziehungsweise anzusiedeln. Die gewählte Formulierung ist klar und bewahrt sowohl die kausative Bedeutung als auch den Rückbezug von בָּהּ auf das Land.
- source_word: כִּי אִם
  choice: ausgenommen
  rationale: Die Verbindung führt nach der Verneinung die einzigen beiden Ausnahmen ein.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Kaleb, der Sohn Jefunnes
  rationale: Die Namen folgen gebräuchlichen deutschen Bibelnamensformen; das Patronym wird ausdrücklich wiedergegeben.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: und Josua, der Sohn Nuns
  rationale: Die Konjunktion und das Patronym werden direkt und in natürlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe der Schwurformel und ihres Gerichtswortes
  choice: Ganz gewiss werdet ihr nicht in das Land kommen
  alternative: Wenn ihr in das Land kommt …
  rationale: Im Kontext einer göttlichen Schwur- und Gerichtsrede ist אִם idiomatisch als nachdrückliche Verneinung zu verstehen. Eine wörtlich-konditionale Wiedergabe wäre im Deutschen unvollständig und könnte den Sinn verdunkeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurgeste bleibt im Haupttext als hebräisches Bild erhalten und wird in der Fußnote erklärt; der starke verneinende Sinn der Schwurformel wird idiomatisch verdeutlicht.
