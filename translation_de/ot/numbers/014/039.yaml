source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּֽתְאַבְּל֥וּ הָ/עָ֖ם מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: de
  text: Mose teilte allen Israeliten[a] diese Worte mit, und das Volk trauerte sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „allen Söhnen Israels“; traditionell auch: „allen Kindern Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: teilte … mit
  rationale: Die Piel-Form bezeichnet hier, dass Mose den Israeliten den zuvor empfangenen göttlichen Urteilsspruch übermittelt. „Teil­te … mit“ ist im Deutschen natürlicher als „sprach diese Worte zu“, ohne eine zusätzliche Deutung einzutragen.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten. Da Mose den vorausgehenden Ausspruch Gottes weitergibt, bewahrt „diese Worte“ den sprachlichen Bezug.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: allen Israeliten
  rationale: בְּנֵי יִשְׂרָאֵל ist die übliche Bezeichnung des Volkes Israel. „Allen Israeliten“ gibt sie im modernen Standarddeutsch natürlich und einschließlich des gesamten Volkes wieder.
- source_word: וַיִּתְאַבְּלוּ
  choice: trauerte
  rationale: Die Hitpael-Form von אבל bezeichnet das Eintreten in beziehungsweise Äußern von Trauer. Das kollektive Singularverb „trauerte“ stimmt im Deutschen natürlich mit „das Volk“ überein.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet hier Israel als kollektive Gemeinschaft; „das Volk“ ist die direkte und kontextgerechte Wiedergabe.
- source_word: מְאֹד
  choice: sehr
  rationale: מְאֹד verstärkt die Trauer. „Sehr“ ist in Verbindung mit „trauerte“ klares, gegenwärtiges Deutsch und bewahrt die Intensivierung.
theological_decisions: []
translation_notes:
