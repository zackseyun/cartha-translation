source:
  edition: WLC
  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: de
  text: Wie lange noch wird diese böse Gemeinschaft[a] gegen mich murren? Das Murren der Israeliten[b], mit dem sie gegen mich murren, habe ich gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinde“ beziehungsweise „Versammlung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhne Israels“; auch: „Kinder Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Wie lange noch
  rationale: Die idiomatische Zeitfrage drückt Ungeduld und Entrüstung aus; „noch“ gibt diese Nuance im Deutschen natürlich wieder.
- source_word: לָעֵדָה
  choice: Gemeinschaft
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinschaft“ ist im modernen Deutsch verständlich und weniger konfessionell geprägt als „Gemeinde“.
- source_word: הָרָעָה הַזֹּאת
  choice: diese böse
  rationale: רָעָה ist hier eine scharfe moralische Wertung und nicht bloß „schlecht“ oder „unangenehm“.
- source_word: מַלִּינִים
  choice: murrt / murren
  rationale: Im Wüstenkontext bezeichnet das Verb aufbegehrendes, gegen Gott gerichtetes Klagen. „Murren“ bewahrt diese besondere Bedeutung und die Wiederholung des hebräischen Ausdrucks.
- source_word: עָלַי
  choice: gegen mich
  rationale: Die Präposition bezeichnet hier die feindselige Ausrichtung des Murrens gegen Gott.
- source_word: תְּלֻנּוֹת
  choice: das Murren
  rationale: Das Substantiv bezeichnet die geäußerten Beschwerden. „Das Murren“ erhält die enge lexikalische Verbindung zum wiederholten Verb und klingt im Deutschen natürlicher als „die Murrereien“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die etablierte deutsche Volksbezeichnung gibt den kollektiven Bezug natürlich und eindeutig wieder; die wörtliche Form wird in einer Fußnote genannt.
- source_word: שָׁמָעְתִּי
  choice: Ich habe … gehört
  rationale: Das deutsche Perfekt hebt passend hervor, dass Gott das fortgesetzte Murren vernommen hat und nun darauf reagiert.
theological_decisions:
- issue: Elliptischer erster Satzteil nach עַד מָתַי
  choice: „soll ich … ertragen“ als sinngemäße Ergänzung, mit Fußnote
  alternative: Die Ellipse wörtlich als „Wie lange noch mit dieser bösen Gemeinschaft …?“ stehen lassen
  rationale: Der hebräische Text nennt kein ausdrückliches Verb des Ertragens. Der Zusammenhang verlangt jedoch eine Reaktion auf die Dauer des Murrens. Die Ergänzung ergibt einen verständlichen deutschen Satz, während die Fußnote die formale Offenheit des Hebräischen sichtbar hält.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / die Kinder Israels
  rationale: Die Wendung ist eine übliche kollektive Bezeichnung für das Volk und schließt im Kontext nicht nur männliche Personen ein. „Israeliten“ vermeidet eine unbeabsichtigte Verengung, ohne die Identität der bezeichneten Gruppe zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Murren“ ist bewusst etwas gehobener als „meckern“ oder „sich beschweren“, weil es den wiederkehrenden, aufbegehrenden Charakter des Ausdrucks in den Wüstenerzählungen trägt. Die hebräische Wiederholung von Substantiv und Verb bleibt erhalten.
