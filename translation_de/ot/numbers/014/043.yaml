  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: de
  text: Denn die Amalekiter und die Kanaaniter stehen euch dort gegenüber, und ihr werdet durch das Schwert fallen. Weil ihr euch abgewandt habt, Jahwe zu folgen, wird Jahwe nicht mit euch sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die Warnung des vorhergehenden Verses; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: die Amalekiter und die Kanaaniter
  rationale: Die morphologisch singularischen Volksbezeichnungen sind kollektiv gebraucht; im Deutschen ist der Plural für die Volksgruppen idiomatisch.
- source_word: שָׁם לִפְנֵיכֶם
  choice: stehen euch dort gegenüber
  rationale: „Dort“ bewahrt die Ortsangabe; „euch gegenüberstehen“ vermittelt zugleich die räumliche Lage und den feindlichen Kontext, ohne diesen weiter auszudeuten.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: und ihr werdet durch das Schwert fallen
  rationale: „Fallen“ erhält das konkrete Kampfwort נפל; „durch das Schwert“ bezeichnet die Todes- beziehungsweise Niederlageursache.
- source_word: כִּי עַל כֵּן
  choice: Weil
  rationale: Die Wendung leitet den Grund für die angekündigte Niederlage ein. Das deutsche „Weil“ gibt die kausale Kraft klar und knapp wieder.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: ihr euch davon abgewandt habt, Jahwe zu folgen
  rationale: Die Formulierung bewahrt das Bild des Aufhörens, hinter Jahwe herzugehen, in natürlichem modernem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: wird Jahwe nicht mit euch sein
  rationale: Die Formulierung erhält das Motiv der göttlichen Gegenwart und den Zukunftsbezug ohne erklärenden Zusatz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „Jahwe wird nicht mit euch sein“
  choice: wörtlich als Aussage über Jahwes fehlende Gegenwart beziehungsweise Unterstützung belassen
  alternative: „Jahwe wird euch nicht beistehen“
  rationale: Die wörtlichere Form bewahrt die theologische Weite des Gegenwartsmotivs und legt es nicht allein auf militärischen Beistand fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit an der kausalen Zäsur geteilt. Keine Fußnoten erforderlich.
