id: NUM.14.42
reference: Numbers 14:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: de
  text: Geht nicht hinauf; denn Jahwe ist nicht in eurer Mitte. Sonst werdet ihr vor euren Feinden geschlagen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: Geht nicht hinauf
  rationale: Die Verneinung אַל mit der folgenden Verbform drückt ein Verbot aus. „Hinaufgehen“ bewahrt die räumliche und militärische Bedeutung von עלה im Zusammenhang.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für das Verbot ein und entspricht der warnenden Satzstruktur.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּקִרְבְּכֶם
  choice: in eurer Mitte
  rationale: Entspricht der räumlich-konkreten Grundbedeutung und bezeichnet Jahwes Gegenwart innerhalb der Gemeinschaft.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: Sonst werdet ihr ... geschlagen
  rationale: Das formal koordinierte „und nicht“ bezeichnet hier im Zusammenhang die drohende Folge des verbotenen Handelns. Das Nifal von נגף kann im Kampf das Geschlagen- oder Besiegtwerden ausdrücken.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: vor euren Feinden
  rationale: Natürliche und genaue deutsche Wiedergabe der Wendung im militärischen Zusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussage über Jahwes Gegenwart in בְּקִרְבְּכֶם
  choice: Jahwe ist nicht in eurer Mitte
  alternative: Jahwe ist nicht bei euch
  rationale: „In eurer Mitte“ wahrt die konkrete gemeinschaftsbezogene Formulierung des Hebräischen und vermeidet eine weitergehende Auslegung.
- issue: Verhältnis von וְלֹא zum vorausgehenden Verbot
  choice: Sonst werdet ihr vor euren Feinden geschlagen
  alternative: damit ihr nicht vor euren Feinden geschlagen werdet
  rationale: Im Kontext warnt die Formulierung vor der Folge eines eigenmächtigen Hinaufziehens. „Sonst“ gibt diese Folgerelation im Deutschen natürlich wieder, ohne die Niederlage als beabsichtigten Zweck erscheinen zu lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Warnung und der militärische Zusammenhang bleiben erhalten; „in eurer Mitte“ bewahrt die konkrete Bildlichkeit des Hebräischen.
