source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: de
  text: 'Doch Mose sagte zu Jahwe: „Dann werden die Ägypter es hören[a]; denn durch deine Macht hast du dieses Volk aus ihrer Mitte heraufgeführt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Ägypter haben gehört, dass du dieses Volk durch deine Macht aus ihrer Mitte heraufgeführt hast.“ Die hebräische Verbform kann hier rückblickend oder als zukünftige Folge innerhalb von Moses Fürbitte verstanden werden; der Haupttext folgt der zum Zusammenhang passenden, vorausblickenden Deutung.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch Mose sagte
  rationale: Das narrative וַ führt die Handlung fort; „doch“ macht zugleich den Gegensatz zu Jahwes angekündigtem Gericht im vorhergehenden Vers deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וְשָׁמְעוּ מִצְרַיִם
  choice: Dann werden die Ägypter es hören
  rationale: Im Zusammenhang von Moses Fürbitte ist die Verbform am besten prospektiv als Folge des angekündigten Gerichts zu verstehen. Das ergänzte „es“ ergibt im Deutschen einen vollständigen, natürlichen Satz und verweist auf das drohende Geschehen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier plausibel die Begründung dafür ein, weshalb Ägypten von dem Geschehen hören wird. Die ebenfalls mögliche Wiedergabe als „dass“ wird durch die Fußnote zur alternativen Satzauffassung mit erfasst.
- source_word: הֶעֱלִיתָ
  choice: hast du … heraufgeführt
  rationale: Die Kausativform von עלה bedeutet „heraufführen/heraufbringen“. „Heraufgeführt“ bewahrt das hebräische Bild und ist in Verbindung mit dem Auszug verständlich.
- source_word: בְכֹחֲךָ
  choice: durch deine Macht
  rationale: בְ bezeichnet hier das Mittel; „durch deine Macht“ gibt den Gedanken idiomatisch und mit dem Nachdruck auf Gottes Wirken wieder.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Die kollektive Singularform עם samt Demonstrativ wird im Deutschen direkt und natürlich mit „dieses Volk“ wiedergegeben.
- source_word: מִקִּרְבּוֹ
  choice: aus ihrer Mitte
  rationale: Das maskuline Singularsuffix bezieht sich wahrscheinlich kollektiv auf Ägypten. Da im deutschen Hauptsatz „die Ägypter“ steht, nimmt „ihrer“ diesen Personenbezug natürlich auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Einordnung von וְשָׁמְעוּ
  choice: 'prospektiv: „Dann werden … hören“'
  alternative: 'retrospektiv: „Die Ägypter haben gehört“'
  rationale: Die prospektive Deutung passt zu Moses Argument über die Folgen einer Vernichtung Israels. Da die hebräische Form auch rückblickend verstanden werden kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Bild des Heraufführens, während Satzbau und Pronomen für heutige Leser natürlich gestaltet sind.
