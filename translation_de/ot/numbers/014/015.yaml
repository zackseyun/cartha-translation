source:
  edition: WLC
  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: de
  text: 'Und wenn du dieses Volk wie einen einzigen Mann[a] tötest, werden die Völker, die von deinem Ruf gehört haben[b], sagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „wie einen Mann“; gemeint ist das ganze Volk gemeinsam oder alle auf einmal.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die die Nachricht über dich gehört haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: Und wenn du … tötest
  rationale: Der Hifil von מות bedeutet „sterben lassen, töten“. Das einfache Waw wird im fortlaufenden Gedankengang aus Vers 14 konditional wiedergegeben; „wenn“ macht den im Kontext vorausgesetzten Zusammenhang im Deutschen natürlich verständlich.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: עָם bezeichnet Israel als geschlossene Gemeinschaft; „dieses Volk“ bewahrt sowohl den kollektiven als auch den demonstrativen Sinn.
- source_word: כְּאִישׁ אֶחָד
  choice: wie einen einzigen Mann
  rationale: Die hebräische Wendung wird formal bewahrt. Sie beschreibt hier, dass das gesamte Volk gemeinsam beziehungsweise auf einmal getötet würde.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: גּוֹיִם bezeichnet hier die anderen Völker im Gegensatz zu Israel. „Völker“ vermeidet spätere Nebenbedeutungen von „Heiden“.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: die von deinem Ruf gehört haben
  rationale: שֵׁמַע kann „Nachricht, Bericht, Ruf“ bedeuten. „Von deinem Ruf gehört“ ist im modernen Deutschen natürlich und bringt zur Geltung, dass die Völker von JHWHs Taten und Ansehen gehört haben; die formalere Alternative bleibt in der Fußnote erhalten.
- source_word: לֵאמֹר
  choice: 'werden … sagen:'
  rationale: Der Infinitiv leitet die im nächsten Vers folgende Rede ein. Im Deutschen wird dies idiomatisch als finites Verb mit Doppelpunkt wiedergegeben.
theological_decisions:
- issue: Wiedergabe der anthropologischen Wendung mit maskulinem Substantiv
  choice: wie einen einzigen Mann
  alternative: alle auf einmal
  rationale: אִישׁ steht im maskulinen Singular, doch die Wendung bezeichnet nicht ausschließlich männliche Personen, sondern das gemeinsame Geschick des ganzen Volkes. Die gewählte Form bewahrt Bild und rhetorische Kraft, während die Fußnote den idiomatischen Sinn erläutert.
- issue: Bedeutungsumfang von שִׁמְעֲךָ
  choice: dein Ruf
  alternative: die Nachricht über dich
  rationale: Der Ausdruck kann sowohl eine Nachricht über Gott als auch seinen unter den Völkern verbreiteten Ruf bezeichnen. Der Haupttext wählt die natürliche deutsche Formulierung, ohne den Gegenstand des Gehörten näher festzulegen; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanschluss bleibt konditional, die kollektive hebräische Bildsprache wird im Haupttext erhalten, und der Doppelpunkt weist auf die in Vers 16 folgende Rede voraus.
