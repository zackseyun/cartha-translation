  source_fidelity: 'Die Übersetzung gibt die hebräische Struktur und Aussage zuverlässig wieder: die zweimalige rhetorische Frage עַד־אָנָה als „Wie lange noch“, den kollektivischen und distanzierenden Singular „dieses Volk“, die Verachtung in יְנַאֲצֻנִי sowie die Zeichen „unter ihnen“. „Mir nicht vertrauen“ ist für לֹא יַאֲמִינוּ בִי eine kontextgerecht präzise deutsche Wiedergabe; die mögliche Formulierung „an mich glauben“ ist zutreffend in der Fußnote dokumentiert. „Trotz all der Zeichen“ macht die im Kontext naheliegende konzessive Funktion von בְּכֹל idiomatisch sichtbar.'
