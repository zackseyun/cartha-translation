id: NUM.14.11
reference: Numbers 14:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Wie lange noch wird dieses Volk mich verachten[a]? Und wie lange noch werden sie mir nicht vertrauen[b], trotz all der Zeichen, die ich unter ihnen[c] vollbracht habe?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich mit Verachtung zurückweisen“ beziehungsweise „mich verschmähen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nicht an mich glauben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in seiner Mitte“; das Einzahlpronomen bezieht sich auf das Volk als Kollektiv.'
    reason: source_form
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift des göttlichen Eigennamens bewahrt das Tetragramm als Namen, statt es durch einen Titel zu ersetzen.
- source_word: עַד־אָנָה
  choice: wie lange noch
  rationale: Gibt die drängende rhetorische Frage idiomatisch und mit ihrer zeitlichen Zuspitzung wieder.
- source_word: יְנַאֲצֻנִי
  choice: mich verachten
  rationale: Das Verb bezeichnet verächtliche Missachtung bis hin zur Zurückweisung. „Verachten“ ist knapp, kraftvoll und im modernen Deutsch verständlich.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Bewahrt den kollektiven Singular und den distanzierenden Ton des hebräischen Ausdrucks.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: mir nicht vertrauen
  rationale: אמן im Hifil mit ב bezeichnet hier ein glaubendes Sich-Verlassen auf eine Person. „Vertrauen“ macht den relationalen Sinn im Deutschen deutlicher als die möglicherweise nur auf Gottes Existenz bezogene Wendung „an mich glauben“.
- source_word: בְּכֹל הָאֹתוֹת
  choice: trotz all der Zeichen
  rationale: 'Die Präposition wird im Zusammenhang konzessiv verstanden: Die vielen Zeichen hätten Vertrauen hervorrufen sollen, doch das Volk verweigert es weiterhin.'
- source_word: הָאֹתוֹת
  choice: die Zeichen
  rationale: „Zeichen“ entspricht dem weiten Bedeutungsumfang von אוֹת, ohne das im Kontext erkennbare Wunderhafte ausdrücklich in das Substantiv einzutragen.
- source_word: עָשִׂיתִי
  choice: vollbracht habe
  rationale: Bei „Zeichen“ ist „vollbringen“ natürliches, würdevolles Deutsch und bringt die bis in die Gegenwart relevante vorausgehende Handlung zum Ausdruck.
- source_word: בְּקִרְבּוֹ
  choice: unter ihnen
  rationale: Die natürliche deutsche Wendung bezieht sich auf die Menschen des kollektiv-singularischen „Volkes“; die formale Einzahl des hebräischen Suffixes wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die deutsche Form „Jahwe“ bewahrt ihn als Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung von לֹא יַאֲמִינוּ בִי
  choice: mir nicht vertrauen
  alternative: nicht an mich glauben
  rationale: Die Konstruktion kann Glauben und Vertrauen ausdrücken. Im Zusammenhang der trotz erfahrener Zeichen verweigerten Abhängigkeit steht das personale Vertrauen im Vordergrund; die alternative Glaubensformulierung bleibt in der Fußnote erhalten.
- issue: Bezug von בְּקִרְבּוֹ
  choice: unter ihnen
  alternative: in seiner Mitte
  rationale: Das Suffix steht grammatisch im Singular und bezieht sich auf das kollektiv-singularische „Volk“. Die Hauptfassung folgt natürlichem Deutsch, während die Fußnote die hebräische Form transparent macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „wie lange noch“ erhält die rhetorische Dringlichkeit. Der Wechsel vom kollektiven Singular „dieses Volk“ zum pluralischen „sie“ folgt dem hebräischen Sinn und bleibt im Deutschen gut verständlich.
