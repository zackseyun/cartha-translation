  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: de
  text: 'Sie standen früh am Morgen auf und stiegen zum Gipfel des Berges hinauf. Sie sagten: »Hier sind wir! Wir wollen zu dem Ort hinaufziehen, von dem Jahwe gesprochen hat[a], denn wir haben gesündigt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu dem Ort, den Jahwe gesagt hat«; die knappe hebräische Formulierung ist elliptisch. Das Verb bedeutet einfach »sagen/sprechen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Sie standen früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet frühes Aufstehen oder Aufbrechen. Zusammen mit בַבֹּקֶר gibt die Wendung den zeitlichen Nachdruck natürlich und ohne unnötige Erweiterung wieder.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: und stiegen zum Gipfel des Berges hinauf
  rationale: עלה bedeutet gewöhnlich „hinaufgehen“ oder „hinaufsteigen“; רֹאשׁ הָהָר bezeichnet wörtlich den „Kopf“ und idiomatisch den Gipfel beziehungsweise die Höhe des Berges.
- source_word: לֵאמֹר
  choice: Sie sagten
  rationale: Der Infinitiv leitet die direkte Rede ein. Ein neuer deutscher Hauptsatz ist hier natürlicher als das partizipiale „sagend“.
- source_word: הִנֶּנּוּ
  choice: Hier sind wir!
  rationale: Die Präsentationsformel mit dem Suffix der ersten Person Plural wird idiomatisch wiedergegeben, ohne sie bereits als ausdrückliche Bereitschaftserklärung auszudeuten.
- source_word: וְעָלִינוּ
  choice: Wir wollen … hinaufziehen
  rationale: Die formal perfektive Verbform bezeichnet im Zusammenhang die nun beabsichtigte Handlung. „Wir wollen“ bewahrt den voluntativen Sinn besser als eine rein zukünftige Aussage.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר יְהוָה
  choice: zu dem Ort …, von dem Jahwe gesprochen hat
  rationale: מָקוֹם ist das gewöhnliche Wort für „Ort“. Die knappe hebräische Relativkonstruktion mit אמר wird in natürlichem Deutsch als „von dem … gesprochen hat“ wiedergegeben, ohne sie stärker als „verheißen“ zu deuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי חָטָאנוּ
  choice: denn wir haben gesündigt
  rationale: כִּי begründet hier ihr Vorhaben; חטא bezeichnet Sünde beziehungsweise Schuld und soll nicht zum bloßen „Wir hatten unrecht“ abgeschwächt werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. „Jahwe“ bewahrt diesen als Namen und entspricht der üblichen deutschen Form.
- issue: Charakter des Schuldbekenntnisses חָטָאנוּ
  choice: wir haben gesündigt
  alternative: wir hatten unrecht
  rationale: Die Übersetzung wahrt das moralisch-theologische Gewicht des Verbs, ohne über das ausdrückliche Eingeständnis des Verses hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und entschlossen; die Spannung zwischen Schuldbekenntnis und eigenmächtigem Aufbruch wird nicht erklärend aufgelöst.
