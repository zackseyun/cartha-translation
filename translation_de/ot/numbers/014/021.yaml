  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: de
  text: 'Doch so wahr ich lebe: Die ganze Erde[a] wird von der Herrlichkeit Jahwes erfüllt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das ganze Land“; das hebräische Wort אֶרֶץ kann sowohl die Erde als auch ein bestimmtes Land bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Die adversative und zugleich nachdrückliche Partikel setzt Gottes feierliche Erklärung in deutlichen Gegensatz zum Vorhergehenden.
- source_word: חַי אָנִי
  choice: so wahr ich lebe
  rationale: Diese natürliche deutsche Schwurformel gibt den feierlichen Charakter des göttlichen Eides wieder.
- source_word: וְיִמָּלֵא
  choice: wird … erfüllen
  rationale: 'Die aktive deutsche Formulierung gibt das Ergebnis des hebräischen Ausdrucks klar und natürlich wieder: Jahwes Herrlichkeit wird den gesamten bezeichneten Raum erfüllen.'
- source_word: כְבוֹד
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist im Zusammenhang mit Gott die geläufige und sachlich umfassende Wiedergabe; sie kann seine machtvolle Gegenwart, Majestät und Anerkennung einschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Namensform gibt den im hebräischen Text stehenden Eigennamen ausdrücklich wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶת כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: Im Zusammenhang der feierlichen Aussage über Jahwes Herrlichkeit liegt die umfassende Bedeutung „Erde“ nahe; die mögliche lokale Bedeutung „Land“ bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: universale Reichweite („die ganze Erde“)
  alternative: lokale Reichweite („das ganze Land“)
  rationale: Der feierliche Eid und die Aussage über Jahwes Herrlichkeit sprechen für einen universalen Bezug. Da אֶרֶץ jedoch auch „Land“ bedeuten kann, wird diese echte lexikalische Mehrdeutigkeit nicht ausgeschlossen, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die Schwurformel verständlich, ohne ihren feierlichen Nachdruck abzuschwächen. Der Gottesname wird als „Jahwe“ wiedergegeben.
