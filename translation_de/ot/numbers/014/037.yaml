source:
  edition: WLC
  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: de
  text: Da starben jene Männer, die einen üblen Bericht über das Land verbreitet hatten, durch die Plage vor Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: Da starben
  rationale: Das Qal-Wayyiqtol von מות führt die Erzählfolge fort. „Da starben“ gibt sowohl die zeitlich-folgernde Verknüpfung als auch das schlichte Sterben natürlich wieder.
- source_word: הָאֲנָשִׁים
  choice: jene Männer
  rationale: Der bestimmte Plural verweist im Zusammenhang auf die zuvor genannten Kundschafter. „Jene Männer“ macht diesen rückbezüglichen Charakter deutlich.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: die einen üblen Bericht über das Land verbreitet hatten
  rationale: Die Partizipialfügung kennzeichnet die Männer durch ihre vorausgegangene Handlung. דִבָּה bezeichnet einen nachteiligen, verleumderischen Bericht; „verbreitet hatten“ ist im Deutschen für das Herausbringen eines Berichts idiomatisch, und das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
- source_word: רָעָה
  choice: üblen
  rationale: רָעָה charakterisiert hier den Bericht als schädlich und verwerflich. „Übel“ bewahrt stärker als das blasse „schlecht“ die negative moralische Färbung, ohne die Aussage unnötig festzulegen.
- source_word: בַּמַּגֵּפָה
  choice: durch die Plage
  rationale: מַגֵּפָה bezeichnet eine Plage beziehungsweise einen tödlichen Schlag. Die Präposition בְּ mit Artikel wird hier instrumental verstanden; „durch die Plage“ gibt Todesursache und Bestimmtheit wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet das Geschehen in Jahwes Gegenwart. „Vor Jahwe“ ist knapp, würdig und wahrt den offen genannten Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm unmittelbar. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לִפְנֵי יְהוָה im Gerichtszusammenhang
  choice: vor Jahwe
  alternative: in der Gegenwart Jahwes
  rationale: Die knappe Formulierung bewahrt sowohl die räumlich-präsentische Grundbedeutung als auch den Zusammenhang des göttlichen Gerichts, ohne ausdrücklich eine zusätzliche Kausalbehauptung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem erzählerischem Stil. Die Formulierung ist verständlich, vermeidet konfessionelle Sonderbegriffe und erhält die knappe Feierlichkeit des hebräischen Satzes.
