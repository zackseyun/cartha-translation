  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose und Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol von דבר eröffnet ein neues Redeereignis; „sprach“ entspricht der feierlichen göttlichen Redeeinleitung und ist im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: zu Mose und Aaron
  rationale: אל kennzeichnet die Adressaten. Im Deutschen genügt bei verbundenen Namen ein gemeinsames „zu“, obwohl das Hebräische die Präposition wiederholt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der formelhafte Infinitiv leitet die nachfolgende direkte Rede ein. Da diese erst im nächsten Vers folgt, gibt ein Doppelpunkt seine Funktion im natürlichen Deutschen präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel bleibt erkennbar; לֵאמֹר wird idiomatisch durch den Doppelpunkt dargestellt.
