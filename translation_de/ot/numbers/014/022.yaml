source:
  edition: WLC
  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: de
  text: Denn alle Männer, die meine Herrlichkeit gesehen haben und die Zeichen, die ich in Ägypten und in der Wüste getan habe, und die mich diese zehn Male auf die Probe gestellt und nicht auf meine Stimme gehört haben[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mir nicht gehorcht haben“. Die hebräische Wendung „auf meine Stimme hören“ kann bedeuten, auf mich zu hören oder mir zu gehorchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für den zuvor ausgesprochenen göttlichen Schwur beziehungsweise das Gericht ein.
- source_word: כָל הָאֲנָשִׁים
  choice: alle Männer
  rationale: Das hebräische אֲנָשִׁים bezeichnet hier im Erzählzusammenhang die Männer der unter das Gericht fallenden Generation; eine geschlechtsneutrale Wiedergabe würde diese Präzision abschwächen.
- source_word: הָרֹאִים
  choice: die ... gesehen haben
  rationale: Das substantivisch gebrauchte Partizip beschreibt die Männer aufgrund ihrer bisherigen Erfahrung; das deutsche Perfekt bringt deren fortdauernde Relevanz natürlich zum Ausdruck.
- source_word: כְּבֹדִי
  choice: meine Herrlichkeit
  rationale: Herrlichkeit ist die sachgerechte und etablierte Wiedergabe für die sichtbar offenbarte göttliche כָּבוֹד.
- source_word: אֹתֹתַי
  choice: meine Zeichen
  rationale: Zeichen bewahrt die Hinweis- und Beweisfunktion der Taten, ohne sie durch eine stärker deutende Bezeichnung wie Wunder zu ersetzen.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: die ich ... getan habe
  rationale: Gibt das gewöhnliche Verb עשה direkt und in natürlichem Deutsch wieder.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: in Ägypten und in der Wüste
  rationale: Wüste ist im modernen Deutschen die natürliche und im Exoduszusammenhang etablierte Wiedergabe von מִדְבָּר.
- source_word: וַיְנַסּוּ אֹתִי
  choice: die mich ... auf die Probe gestellt haben
  rationale: Die feste deutsche Wendung gibt נסה in diesem anklagenden Zusammenhang klar und idiomatisch wieder.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: nun schon zehnmal
  rationale: Die Formulierung bringt die deiktische und kumulative Betonung von זֶה עֶשֶׂר פְּעָמִים in natürlichem Deutsch zum Ausdruck, ohne eine mathematisch genaue Zählung zusätzlich festzulegen.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: und nicht auf meine Stimme gehört haben
  rationale: Bewahrt das hebräische Sprachbild; die Wendung bedeutet im Zusammenhang zugleich, Gottes Stimme zu beachten und ihr zu gehorchen.
theological_decisions:
- issue: Göttliche Selbstrede
  choice: Die erste Person bleibt in „meine Herrlichkeit“, „meine Zeichen“ und „meine Stimme“ unverändert erhalten.
  alternative: Die Aussagen durch erklärende Gottesbezeichnungen oder theologische Zusätze erweitern.
  rationale: Der hebräische Text ist direkte Gottesrede und bietet keinen Anlass für eine dogmatische Ausweitung.
- issue: Geschlechtsbezug von הָאֲנָשִׁים
  choice: alle Männer
  alternative: alle Menschen / alle Leute
  rationale: Der Ausdruck ist hier männlich und bezieht sich im Kontext auf die Männer der gerichteten Generation; die konkrete Referenz soll nicht neutralisiert werden.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: auf meine Stimme gehört
  alternative: mir gehorcht
  rationale: Die Hauptfassung erhält das hebräische Bild und lässt zugleich dessen Gehorsamsdimension erkennen; die Fußnote nennt die ausdrücklichere Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bleibt stehen, weil der Satz syntaktisch in Vers 23 weitergeführt wird. Die Wiederholung der Relativkonstruktion sorgt trotz des langen Satzes für Klarheit.
