revisions:
- from: Denn alle Männer, die meine Herrlichkeit und meine Zeichen gesehen haben, die ich in Ägypten und in der Wüste getan habe, und die mich nun schon zehnmal auf die Probe gestellt und nicht auf meine Stimme gehört haben[a] —
  to: Denn alle Männer, die meine Herrlichkeit gesehen haben und die Zeichen, die ich in Ägypten und in der Wüste getan habe, und die mich diese zehn Male auf die Probe gestellt und nicht auf meine Stimme gehört haben[a] —
  rationale: Die Revision beseitigt die im Deutschen entstandene syntaktische Mehrdeutigkeit, sodass eindeutig nur die Zeichen als die in Ägypten und in der Wüste vollbrachten Taten bezeichnet werden. „Diese zehn Male“ gibt die demonstrative Hervorhebung des Hebräischen wieder, ohne die zeitliche Zuspitzung von „nun schon“ zusätzlich einzutragen. Der Gedankenstrich bleibt erhalten, da der Satz in Vers 23 fortgesetzt wird.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:02:04Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundwiedergabe ist weitgehend quellentreu. Allerdings kann der Relativsatz „die ich in Ägypten und in der Wüste getan habe“ im Deutschen grammatisch sowohl „meine Herrlichkeit“ als auch „meine Zeichen“ bestimmen, während אֲשֶׁר עָשִׂיתִי im Hebräischen nur auf „meine Zeichen“ bezogen ist. Außerdem ist „nun schon“ als Auslegung der deiktischen Verstärkung von זֶה möglich, aber stärker idiomatisierend als erforderlich.
  naturalness: Der Satz ist würdig und verständlich. Eine Umstellung trennt „Herrlichkeit“ sauber von den von Gott getanen „Zeichen“ und verbessert damit zugleich die syntaktische Klarheit. „Diese zehn Male“ bewahrt den demonstrativen Nachdruck ohne die zusätzliche zeitliche Nuance von „nun schon“.
  terminology: „Herrlichkeit“, „Zeichen“, „Wüste“, „auf die Probe gestellt“ und „auf meine Stimme gehört“ sind angemessen und konsistent. Die Fußnote sollte die idiomatische Bedeutung von שׁמע בקול präziser als „auf mich hören“ bzw. „gehorchen“ erklären.
  issues:
  - severity: medium
    issue: Mehrdeutiger Bezug des Relativsatzes
    rationale: In „meine Herrlichkeit und meine Zeichen ..., die ich ... getan habe“ kann „die“ sich grammatisch auf beide vorangehenden Substantive beziehen. Im hebräischen Text betrifft אֲשֶׁר עָשִׂיתִי nur die Zeichen.
  - severity: low
    issue: Zusätzliche zeitliche Nuance in „nun schon“
    rationale: זֶה עֶשֶׂר פְּעָמִים hebt diese zehn Fälle deiktisch hervor. „Nun schon“ ist vertretbar, fügt aber eine stärker zeitlich-kumulative Nuance hinzu, die nicht für die deutsche Wiedergabe nötig ist.
  - severity: low
    issue: Fußnotenformulierung zur Idiombedeutung
    rationale: „Einer Stimme Folge leisten“ ist im heutigen Deutsch weniger idiomatisch. Die Erklärung kann unmittelbarer auf „auf mich hören“ und „gehorchen“ verweisen.
  revised_text: Denn alle Männer, die meine Herrlichkeit gesehen haben und die Zeichen, die ich in Ägypten und in der Wüste getan habe, und die mich diese zehn Male auf die Probe gestellt und nicht auf meine Stimme gehört haben[a] —
  revised_footnotes:
