base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: de
  text: Doch eure kleinen Kinder[a], von denen ihr gesagt habt, sie würden zur Beute werden[b], werde ich sie hineinbringen. Sie werden das Land kennen[c], das ihr abgelehnt habt.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „eure Kleinen“; gemeint sind eure Kinder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Feind als Beute zufallen“; auch „zum Plündergut werden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Land erleben“. Das hebräische Wort für „kennen“ kann hier persönliches Erleben einschließen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „verschmäht“ beziehungsweise „verworfen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: eure kleinen Kinder
  rationale: טַף bezeichnet hier die kleinen, schutzbedürftigen Kinder der Israeliten. „Eure kleinen Kinder“ ist im heutigen Deutsch klarer und natürlicher als die wörtlichere Form „eure Kleinen“.
- source_word: לָבַז
  choice: zur Beute werden
  rationale: בַּז bezeichnet im militärischen Zusammenhang Beute oder Plündergut. Die Wendung greift die Befürchtung der Eltern idiomatisch auf.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: werde ich hineinbringen
  rationale: Der Hifil von בוא bedeutet hier, jemanden hineinzubringen; das Ziel, das Land, ist aus dem Kontext eindeutig und muss im Deutschen nicht vorweggenommen werden.
- source_word: וְיָדְעוּ
  choice: sie werden … kennenlernen
  rationale: ידע bedeutet grundsätzlich „kennen/erkennen“, kann hier aber das persönliche Erleben und Inbesitznehmen des Landes einschließen. „Kennenlernen“ bewahrt den Erkenntnisbegriff und klingt zugleich erfahrungsbezogen.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Der hebräische Text nennt schlicht „das Land“. Der Kontext identifiziert es, ohne dass „verheißen“ oder „Kanaan“ ergänzt werden muss.
- source_word: מְאַסְתֶּם בָּהּ
  choice: das ihr abgelehnt habt
  rationale: מאס kann „ablehnen“, „verwerfen“ oder „verschmähen“ bedeuten. „Abgelehnt“ gibt die bewusste Zurückweisung wieder, ohne den emotional stärkeren Nebensinn von „verachten“ zwingend festzulegen.
theological_decisions:
- issue: Soll das Land ausdrücklich als das verheißene Land oder als Kanaan bezeichnet werden?
  choice: Im Haupttext steht nur „das Land“.
  alternative: „das verheißene Land“ oder „das Land Kanaan“
  rationale: Der hebräische Vers enthält keine solche nähere Bestimmung. Der Zusammenhang macht den Bezug deutlich; eine Ergänzung würde Erklärung in den Text eintragen.
- issue: Wie weit soll das Erfahrungsgewicht von ידע ausdrücklich gemacht werden?
  choice: „kennenlernen“ mit einer Fußnote zur möglichen erfahrungsbezogenen Wiedergabe
  alternative: „erleben“ oder „in Besitz nehmen“
  rationale: „Kennenlernen“ bleibt näher am Grundwort „kennen“, während die Fußnote die im Kontext mögliche Erfahrungskomponente offenhält. „In Besitz nehmen“ wäre eine stärkere Auslegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält Gottes Gegenüberstellung zu den ängstlichen Eltern deutlich fest. „Doch“ gibt den einleitenden Kontrast wieder; „hineinbringen“ lässt das im Kontext klare Ziel unausgesprochen, wie es auch die hebräische Konstruktion erlaubt.
