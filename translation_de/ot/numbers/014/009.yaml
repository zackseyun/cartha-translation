  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: de
  text: Lehnt euch nur nicht gegen Jahwe auf! Habt keine Angst vor dem Volk des Landes, denn sie sind unser Brot.[a] Ihr Schutz ist von ihnen gewichen,[b] und Jahwe ist mit uns. Habt keine Angst vor ihnen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Bild lautet: „Denn sie sind unser Brot.“ Gemeint ist wohl, dass sie leicht überwunden oder gleichsam verzehrt werden können.'
    reason: Die Anmerkung erläutert die im Haupttext bewusst beibehaltene Metapher, ohne sie auf eine einzige Deutung festzulegen.
  - marker: b
    text: 'Wörtlich: „Ihr Schatten ist von ihnen gewichen.“ „Schatten“ bezeichnet hier wahrscheinlich Schutz oder Zuflucht.'
    reason: Die Fußnote dokumentiert das konkrete hebräische Bild hinter der sinngemäßen Wiedergabe „Schutz“.
lexical_decisions:
- source_word: אַךְ
  choice: Nur
  rationale: Die Partikel schränkt die vorausgehende Aufforderung nachdrücklich ein. „Nur“ bewahrt diese knappe, emphatische Kraft.
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: lehnt euch nicht gegen Jahwe auf
  rationale: Bei מרד bezeichnet ב die Person, gegen die sich die Auflehnung richtet. „Sich auflehnen“ ist im heutigen Deutsch natürlich und trifft den Widerstand gegen göttliche Autorität.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die Wiedergabe folgt der hebräischen Formulierung eng und bleibt im Kontext verständlich; „Bewohner des Landes“ wäre eine mögliche Verdeutlichung.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: denn sie sind unser Brot
  rationale: Die bewusst knappe und drastische Metapher des Hebräischen bleibt erhalten, ohne sie als „wir werden sie verschlingen“ auszudeuten.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: Ihr Schutz ist von ihnen gewichen
  rationale: צֵל bedeutet wörtlich „Schatten“, bezeichnet hier aber bildlich Schutz oder schützenden Beistand. Die deutsche Fassung vermittelt den Sinn und bewahrt mit „gewichen“ die Bewegung des hebräischen Verbs.
- source_word: וַיהוָה אִתָּנוּ
  choice: doch Jahwe ist mit uns
  rationale: Das einfache waw erhält hier im Kontrast zum gewichenen Schutz der Gegner eine natürliche adversative Wiedergabe. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אַל תִּירְאוּ / אַל תִּירָאֻם
  choice: Habt keine Angst / Habt keine Angst vor ihnen
  rationale: Die Formulierung ist gegenwärtiges, idiomatisches Deutsch. Die nachdrückliche Wiederholung am Versende bleibt bestehen.
theological_decisions:
- issue: Metapher für den erwarteten Sieg in כִּי לַחְמֵנוּ הֵם
  choice: „sie sind unser Brot“ im Haupttext
  alternative: „sie sind unsere Nahrung“ oder „wir werden sie verschlingen“
  rationale: Die wörtliche Bildsprache ist verständlich und lässt offen, wie genau die leichte Überwindung bzw. Vernichtung der Gegner gedacht ist.
- issue: Bild des Schattens in צִלָּם
  choice: sinngemäß „ihr Schutz“
  alternative: wörtlich „ihr Schatten“ oder „ihr schützender Schatten“
  rationale: „Schatten“ steht im Kontext für Schutz oder Beistand. Die Hauptfassung erschließt das Bild für heutige Leser; die Fußnote bewahrt den genauen Wortlaut.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den im Ausgangstext ausdrücklich verwendeten persönlichen Bundesnamen, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die wiederholten Verbote und die knappe Siegesmetapher bleiben erhalten. „Doch“ macht den im Kontext naheliegenden Gegensatz idiomatisch sichtbar.
