  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: de
  text: Doch weil mein Diener Kaleb einen anderen Geist hatte[a] und mir völlig gefolgt ist[b], werde ich ihn in das Land bringen, das er betreten hat; seine Nachkommen werden es in Besitz nehmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine andere Gesinnung“ beziehungsweise „eine andere Haltung“. Das hebräische Wort kann „Geist“, „Gesinnung“ oder „Haltung“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräische Wendung, wörtlich etwa: „er erfüllte hinter mir“. Gemeint ist, dass Kaleb dem HERRN völlig oder von ganzem Herzen folgte.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „werden es erben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי כָלֵב
  choice: Doch mein Diener Kaleb
  rationale: Das einleitende וְ ist wegen des Gegensatzes zur ungläubigen Generation adversativ mit „Doch“ wiedergegeben. עֶבֶד bezeichnet hier Gottes loyalen Diener; „Sklave“ würde einen im Kontext nicht hervorgehobenen Aspekt betonen.
- source_word: עֵקֶב
  choice: weil
  rationale: Die Präposition leitet den Grund für Gottes Zusage an Kaleb ein.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: ein anderer Geist mit ihm war
  rationale: Die Formulierung bleibt nahe am Hebräischen und bewahrt die Offenheit von רוּחַ zwischen Geist, innerer Haltung und Gesinnung.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: und er mir völlig nachfolgte
  rationale: Die hebräische Wendung bedeutet, jemandem vollständig beziehungsweise von ganzem Herzen zu folgen. Die idiomatische Bedeutung wird verständlich wiedergegeben, ohne die Intensität abzuschwächen.
- source_word: וַהֲבִיאֹתִיו
  choice: werde ich ihn ... bringen
  rationale: Die Form bezeichnet in dieser göttlichen Zusage eine künftige, fest zugesagte Handlung.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: in das Land, in das er gekommen ist
  rationale: Die Wiedergabe bewahrt die konkrete Bewegungsrichtung von בוא und bezieht sich auf Kalebs vorheriges Betreten des Landes als Kundschafter.
- source_word: וְזַרְעוֹ
  choice: und seine Nachkommen
  rationale: זֶרַע ist kollektiv gebraucht. „Nachkommen“ ist im modernen Deutsch natürlicher als das wörtliche „Same“.
- source_word: יוֹרִשֶׁנָּה
  choice: werden es in Besitz nehmen
  rationale: ירשׁ kann sowohl erben als auch in Besitz nehmen bedeuten. Im Zusammenhang mit der Landzusage gibt „in Besitz nehmen“ den aktiven Bedeutungsanteil gut wieder.
theological_decisions:
- issue: Bedeutung von „ein anderer Geist“ bei Kaleb
  choice: Die offene Formulierung „ein anderer Geist war mit ihm“ bleibt erhalten.
  alternative: „Er hatte eine andere Gesinnung“ oder eine ausdrückliche Identifikation mit Gottes Geist.
  rationale: רוּחַ kann Geist, Gesinnung oder innere Haltung bezeichnen. Der hebräische Text legt den genauen Referenten nicht ausdrücklich fest; deshalb wird weder eine rein psychologische noch eine spezifisch pneumatologische Deutung in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wahrt den feierlichen Charakter der göttlichen Zusage, bleibt aber für heutige Leser verständlich. Das ungewöhnliche Bild vom „anderen Geist“ wird bewusst nicht zu einer eindeutigen Lehrformel verengt.
