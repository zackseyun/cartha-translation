source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: de
  text: Vergib doch die Schuld dieses Volkes nach der Größe deiner beständigen Liebe, so wie du dieses Volk seit Ägypten bis hierher getragen hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „so wie du diesem Volk seit Ägypten bis hierher vergeben hast.“ Das hebräische Verb kann „tragen“ und in Schuldzusammenhängen auch „vergeben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: Vergib doch
  rationale: Der Imperativ von סלח mit נָא ist eine eindringliche Bitte. „Vergib doch“ gibt Bitte, Dringlichkeit und respektvollen Ton in natürlichem Deutsch wieder.
- source_word: לַעֲוֺן
  choice: die Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder Schuldfolge bezeichnen. „Schuld“ bewahrt hier das moralische Gewicht und eignet sich als Gegenstand der Vergebung, ohne den Sinn unnötig einzuengen.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: עַם ist ein singularisches Kollektiv und bezeichnet hier die Bundesgemeinschaft; „dieses Volk“ entspricht Form und Sinn.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: nach der Größe deiner beständigen Liebe
  rationale: גֹּדֶל bedeutet „Größe“; חֶסֶד bezeichnet häufig Gottes verlässliche, loyale Güte und Liebe. „Beständige Liebe“ erhält diesen Beziehungs- und Treueaspekt.
- source_word: וְכַאֲשֶׁר
  choice: so wie
  rationale: Die Wendung führt den Vergleich mit Gottes bisherigem Handeln ein und klingt im Deutschen natürlich.
- source_word: נָשָׂאתָה
  choice: du ... getragen hast
  rationale: נשא bedeutet grundlegend „heben, tragen“ und kann im Zusammenhang mit Schuld auch „vergeben“ heißen. Da hier das Volk selbst direktes Objekt ist, bewahrt „getragen“ das Bild von Gottes anhaltendem Tragen und Ertragen, ohne den möglichen Vergebungssinn auszuschließen.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: von Ägypten bis jetzt
  rationale: Die Wendung bezeichnet die Kontinuität seit dem Auszug bis zur gegenwärtigen Situation. „Bis jetzt“ gibt den im Kontext vorherrschenden zeitlichen Sinn idiomatisch wieder; wörtlicher wäre „bis hierher“.
theological_decisions:
- issue: Bedeutung von נָשָׂאתָה in Moses’ Bitte
  choice: Gottes bisheriges Handeln wird als Tragen des Volkes beschrieben; dies schließt geduldiges Ertragen und Vergebung ein, wird aber nicht auf Vergebung verengt.
  alternative: „so wie du diesem Volk von Ägypten bis jetzt vergeben hast“
  rationale: Das direkte Objekt ist „dieses Volk“, nicht dessen Schuld. Daher liegt der breitere Sinn „tragen/ertragen“ nahe. Zugleich kann נשא in Schuldzusammenhängen „vergeben“ bedeuten; die Fußnote hält diese echte Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Bittgebet, ist aber flüssig und allgemein verständlich. Der Fußnotenmarker steht unmittelbar nach der mehrdeutigen Wendung.
