revisions:
- from: Vergib doch die Schuld dieses Volkes nach der Größe deiner beständigen Liebe, so wie du dieses Volk von Ägypten bis jetzt getragen hast.[a]
  to: Vergib doch die Schuld dieses Volkes nach der Größe deiner beständigen Liebe, so wie du dieses Volk seit Ägypten bis hierher getragen hast.[a]
  rationale: Die Änderung ersetzt allein die weniger natürliche und enger gefasste Wendung „von Ägypten bis jetzt“ durch „seit Ägypten bis hierher“. Dadurch bleibt die räumlich-zeitliche Reichweite des Hebräischen erhalten, ohne die bewusst beibehaltene Mehrdeutigkeit von „getragen“ aufzulösen. Die Fußnote wird entsprechend angeglichen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:02:01Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Bitte um Vergebung, עָוֹן als „Schuld“, die Größe von Gottes חֶסֶד sowie die Mehrdeutigkeit von נָשָׂאתָה insgesamt zutreffend wieder. Bei מִמִּצְרַיִם וְעַד־הֵנָּה sollte jedoch die im Hebräischen mögliche und im Kontext naheliegende räumlich-zeitliche Perspektive („seit Ägypten bis hierher“) nicht auf rein zeitliches „bis jetzt“ eingeengt werden.
  naturalness: „Von Ägypten bis jetzt getragen“ ist im modernen Standarddeutsch weniger idiomatisch und lässt offen, in welchem Sinn „von Ägypten“ angeschlossen ist. „Seit Ägypten bis hierher getragen“ ist klarer, natürlich und bewahrt die hebräische Formulierung.
  terminology: „Vergib doch“, „Schuld“, „dieses Volk“ und „beständige Liebe“ sind angemessen und im würdigen Register stimmig. „Getragen“ bewahrt beim direkten Objekt „dieses Volk“ die Bildlichkeit von נשא; die Fußnote hält die kontextuell mögliche Bedeutung „vergeben“ sachgerecht offen.
  issues:
  - severity: low
    issue: „von Ägypten bis jetzt“ verengt מִמִּצְרַיִם וְעַד־הֵנָּה auf eine rein zeitliche Angabe und klingt mit „getragen“ etwas holprig.
    rationale: הֵנָּה kann „hierher“ bedeuten und verweist in der vorliegenden Erzählung zugleich auf den bisherigen Weg seit Ägypten. „Seit Ägypten bis hierher“ erhält diese Offenheit und ist idiomatischer.
  revised_text: Vergib doch die Schuld dieses Volkes nach der Größe deiner beständigen Liebe, so wie du dieses Volk seit Ägypten bis hierher getragen hast.[a]
