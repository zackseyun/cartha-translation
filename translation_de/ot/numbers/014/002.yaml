source:
  edition: WLC
  text: וַ/יִּלֹּ֨נוּ֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם כָּל הָ/עֵדָ֗ה לוּ מַ֨תְנוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּ/מִּדְבָּ֥ר הַ/זֶּ֖ה לוּ מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: de
  text: 'Und alle Israeliten murrten gegen Mose und Aaron, und die ganze Gemeinde sagte zu ihnen: „Wären wir doch im Land Ägypten gestorben! Oder wären wir doch in dieser Wüste gestorben!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: murrten
  rationale: Das Verb לון bezeichnet hier das gemeinschaftliche, aufbegehrende Klagen gegen die Führer. „Murrten“ ist im Deutschen prägnant, würdevoll und in diesem biblischen Zusammenhang weiterhin verständlich.
- source_word: עַל
  choice: gegen
  rationale: In Verbindung mit „murren“ kennzeichnet עַל die Personen, gegen die sich die Klage richtet; „gegen“ bewahrt den konfrontativen Sinn.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: alle Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet in diesem Zusammenhang das gesamte Volk. „Alle Israeliten“ gibt die gemeinte Referenz im modernen Standarddeutsch natürlich wieder, ohne sie auf männliche Nachkommen einzuengen.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet in Numeri häufig die versammelte Gemeinschaft Israels. „Gemeinde“ bewahrt den korporativen Charakter; כָּל wird idiomatisch mit „die ganze“ wiedergegeben.
- source_word: לוּ
  choice: wären ... doch
  rationale: לוּ leitet einen irrealen Wunsch ein. Die deutsche Konstruktion „Wären wir doch ...“ drückt den rückwärtsgewandten, unerfüllten Wunsch natürlich aus.
- source_word: מַתְנוּ / מָתְנוּ
  choice: gestorben
  rationale: Zusammen mit לוּ bilden die Perfektformen einen irrealen Wunsch über die Vergangenheit; der deutsche Konjunktiv II der Vorvergangenheit „wären ... gestorben“ trifft diesen Sinn.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe erhält das ausdrücklich genannte אֶרֶץ und entspricht zugleich natürlichem, gehobenem Deutsch.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: in dieser Wüste
  rationale: מִדְבָּר bezeichnet hier die unwirtliche Wildnis der Wanderung. „Wüste“ ist die übliche, klare deutsche Bezeichnung und bewahrt den konkreten Schauplatz.
theological_decisions:
- issue: Geschlechtlich markierte Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: alle Israeliten
  alternative: alle Söhne Israels
  rationale: Obwohl בְּנֵי formal „Söhne“ lautet, fungiert בְּנֵי יִשְׂרָאֵל hier als nationale Gesamtbezeichnung, wie die anschließende „ganze Gemeinde“ bestätigt. „Alle Israeliten“ gibt die inklusive Referenz präzise und im Deutschen ohne missverständliche Beschränkung auf Männer wieder.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die Wiederholung von „Wären wir doch ... gestorben“ folgt der emphatischen Parallelstruktur des Hebräischen; „murrten“ erhält den rebellischen Unterton.
