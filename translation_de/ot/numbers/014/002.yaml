  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und Aussage vollständig wieder: das Murren des ganzen Volkes richtet sich gegen Mose und Aaron; die ganze Gemeinde äußert den zweifachen irrealen Todeswunsch. „Wären wir doch … gestorben“ bildet לוּ mit dem Perfekt treffend als rückblickenden Wunsch ab. „Im Land Ägypten“ und „in dieser Wüste“ entsprechen den beiden Ortsangaben.'
