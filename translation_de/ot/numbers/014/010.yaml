base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: de
  text: Doch die ganze Gemeinde sagte, man solle sie mit Steinen steinigen. Da erschien die Herrlichkeit Jahwes im Zelt der Begegnung allen Israeliten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „allen Söhnen Israels“.'
    reason: Die hebräische feste Wendung בְּנֵי יִשְׂרָאֵל lautet wörtlich „Söhne Israels“, bezeichnet hier aber das ganze Volk Israel.
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Die ganze Gemeinde“ gibt den kollektiven und formellen Sinn natürlich wieder.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: man solle sie mit Steinen steinigen
  rationale: Die Infinitivkonstruktion wird als Inhalt des Gesagten wiedergegeben. „Mit Steinen“ bewahrt die ausdrückliche Angabe des Mittels; „zu Tode“ wird nicht ergänzt.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet hier die sichtbar hervortretende Herrlichkeit beziehungsweise Gegenwart Gottes; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: נִרְאָה
  choice: erschien
  rationale: Der Niphal von ראה bezeichnet hier ein sichtbares Offenbarwerden. „Erschien“ ist im Deutschen natürlich und entspricht dem Erscheinungskontext.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Die Präposition בְּ wird örtlich mit „im“ wiedergegeben; „Zelt der Begegnung“ ist eine transparente und geläufige Bezeichnung des Heiligtums.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: vor allen Israeliten
  rationale: אֶל bezeichnet hier die Ausrichtung der Erscheinung auf die versammelten Israeliten. „Israeliten“ gibt die feste nationale Bezeichnung בְּנֵי יִשְׂרָאֵל im modernen Deutschen idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift und bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- issue: Nationale Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels; Kinder Israels
  rationale: Die Wendung ist eine feste Bezeichnung für das Volk insgesamt. „Israeliten“ vermeidet im modernen Deutschen das Missverständnis, nur männliche Personen oder Minderjährige seien gemeint, während die wörtliche Form in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas konkrete Formulierung „mit Steinen steinigen“ bewahrt die ausdrückliche hebräische Mittelangabe, ohne den nicht ausdrücklich genannten Zusatz „zu Tode“ einzuführen.
