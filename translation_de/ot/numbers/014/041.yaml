  terminology: „Jahwe“ ist eine sachgerechte deutsche Wiedergabe des Tetragramms. „Befehl“ und „übertreten“ geben den verpflichtenden Charakter der göttlichen Weisung in diesem Kontext präzise wieder, ohne über den Text hinauszugehen.
