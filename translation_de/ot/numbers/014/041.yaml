source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: de
  text: 'Doch Mose sagte: „Warum übertretet ihr denn den Befehl Jahwes[a][b]? Das wird nicht gelingen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Mund Jahwes“; eine hebräische Wendung für das, was Jahwe gesagt oder befohlen hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Wort Jahwes“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Das wird keinen Erfolg haben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch Mose sagte
  rationale: Das Waw führt die nächste Äußerung ein; im Zusammenhang steht Moses Warnung im Gegensatz zum Vorhaben des Volkes, weshalb „Doch“ den adversativen Sinn natürlich wiedergibt.
- source_word: לָמָה זֶּה
  choice: Warum … denn
  rationale: Die Partikel „denn“ gibt die leicht nachdrückliche, idiomatische Wendung לָמָה זֶּה in natürlichem modernem Deutsch wieder.
- source_word: אַתֶּם עֹבְרִים
  choice: übertretet ihr
  rationale: עבר bezeichnet mit פִּי יְהוָה nicht ein räumliches Überschreiten, sondern das Zuwiderhandeln gegen Gottes Weisung.
- source_word: אֶת פִּי יְהוָה
  choice: den Befehl Jahwes
  rationale: Wörtlich steht „den Mund Jahwes“; die Wendung meint hier das von Jahwe Gesagte beziehungsweise Gebotene. „Befehl“ passt zum unmittelbaren Kontext des bewussten Ungehorsams.
- source_word: וְהִוא
  choice: Das
  rationale: Das feminine Pronomen verweist wahrscheinlich auf das aus dem Zusammenhang erschlossene Vorhaben. „Das“ ist dafür im Deutschen die natürliche anaphorische Wiedergabe.
- source_word: לֹא תִצְלָח
  choice: wird nicht gelingen
  rationale: צלח bezeichnet hier den Erfolg eines beabsichtigten Unternehmens; „gelingen“ ist klar, idiomatisch und kontextgerecht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen in der im Deutschen üblichen wissenschaftlichen Form wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des femininen Pronomens וְהִוא
  choice: Das Vorhaben wird nicht gelingen
  alternative: Der Befehl wird nicht gelingen
  rationale: Inhaltlich bezieht sich das Pronomen am ehesten auf den geplanten Feldzug beziehungsweise das Unternehmen. Da das Bezugswort nur aus dem Kontext hervorgeht, wahrt „Das“ die knappe Unbestimmtheit des Hebräischen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Denn“ erhält den Nachdruck von לָמָה זֶּה, ohne eine im Deutschen unnatürliche wörtliche Konstruktion zu erzeugen. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Formulierungen.
