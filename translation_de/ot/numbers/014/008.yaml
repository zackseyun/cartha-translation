  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: de
  text: Wenn Jahwe Gefallen an uns hat[a], wird er uns in dieses Land bringen und es uns geben – ein Land, in dem Milch und Honig fließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns wohlgesinnt ist“ oder „Freude an uns hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet hier einen realen Bedingungssatz ein; „wenn“ bewahrt die im Hebräischen vorhandene Bedingtheit.
- source_word: חָפֵץ בָּנוּ
  choice: Gefallen an uns hat
  rationale: Gibt die persönliche, positive Zuwendung von חפץ natürlich und würdevoll wieder, ohne sie auf bloße Begünstigung zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: wird er uns in dieses Land bringen
  rationale: Der Folgesatz beschreibt die erwartete Konsequenz; „in dieses Land“ entspricht dem Kontext des Einzugs.
- source_word: וּנְתָנָהּ לָנוּ
  choice: und es uns geben
  rationale: Das Suffix bezieht sich auf das Land; „geben“ ist die direkte und übliche Wiedergabe von נתן.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Bewahrt die appositionelle Wiederaufnahme von „Land“ und gibt das hebräische Bild der reichen Fruchtbarkeit idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Bedingtheit der angekündigten Landgabe
  choice: Wenn Jahwe Gefallen an uns hat
  alternative: Da Jahwe Gefallen an uns hat
  rationale: אִם ist als Bedingung formuliert. Die Übersetzung wahrt diese sprachliche und theologische Spannung, statt die Aussage zu einer Begründung oder Gewissheit umzudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der traditionelle Ausdruck „Milch und Honig fließen“ bleibt als anschauliches Bild erhalten.
