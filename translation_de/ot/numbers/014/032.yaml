  terminology: „Leichen“ ist für פֶּגֶר bei menschlichen Verstorbenen die beste natürliche moderne Wahl. Es bewahrt die Konkretheit, ohne die abwertende Nebenbedeutung von „Kadaver“ einzutragen. „Wüste“ ist im Kontext von Numeri für מִדְבָּר etabliert und passend.
