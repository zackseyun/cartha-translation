  source_fidelity: 'Die Übersetzung gibt die hebräische Aussage vollständig wieder: Das vorangestellte und durch אַתֶּם verstärkte Gegenüber wird mit „Ihr aber“ kontrastiv hervorgehoben; פִגְרֵיכֶם wird treffend und konkret als „eure Leichen“ wiedergegeben. „werden ... fallen“ bildet die angekündigte Zukunft von יִפְּלוּ ab, und „in dieser Wüste“ entspricht בַּמִּדְבָּר הַזֶּה. Die Reihenfolge ist im Deutschen zugunsten der Verständlichkeit leicht umgestellt, ohne Bedeutungsverlust.'
