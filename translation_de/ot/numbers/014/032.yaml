  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: de
  text: Ihr aber – eure Leichen werden in dieser Wüste fallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִגְרֵיכֶם
  choice: eure Leichen
  rationale: פֶּגֶר bezeichnet einen toten Körper bzw. Leichnam. „Eure Leichen“ gibt die konkrete und schonungslose Aussage des Gerichts im modernen Deutschen knapp und natürlich wieder.
- source_word: אַתֶּם
  choice: ihr aber
  rationale: Das selbstständige Pronomen ist hervorgehoben und steht im Kontrast zum vorausgehenden Zusammenhang. Die Voranstellung „Ihr aber“ bildet diese kontrastive Betonung idiomatisch ab; der Gedankenstrich markiert die nachfolgende Wiederaufnahme durch „eure“.
- source_word: יִפְּלוּ
  choice: werden fallen
  rationale: נפל bedeutet hier „fallen“, wobei der Tod bereits durch „Leichen“ eindeutig ist. Die Zukunftsform gibt die angekündigte Folge des Gerichts wieder.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: in dieser Wüste
  rationale: מִדְבָּר bezeichnet hier die unbewohnte Wüstenlandschaft, in der Israel sich befindet; הַזֶּה weist auf eben diese konkrete Wüste.
theological_decisions:
- issue: Konkretheit und Härte des Gerichtsbildes in פִגְרֵיכֶם
  choice: eure Leichen
  alternative: eure leblosen Körper
  rationale: Die Übersetzung bewahrt die körperliche und ernste Aussage des angekündigten Gerichts, ohne sie abzuschwächen. „Kadaver“ wäre im Deutschen bei Menschen unnötig entmenschlichend, während „leblose Körper“ den Ausdruck mildert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bildet die emphatische und kontrastive Struktur des Hebräischen ab; die drastische Bildsprache bleibt erhalten.
