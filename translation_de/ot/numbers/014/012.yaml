review_pass:
  verdict: revise
  source_fidelity: Die kollektive Wiedergabe des hebräischen maskulinen Singulars durch „dieses Volk“ ist sachgerecht. „Pest“ ist für דֶּבֶר in diesem Gerichtszusammenhang möglich. Die Hauptformulierung „aus seinem Erbbesitz verdrängen“ engt jedoch den Sinn von הוֹרִישׁ unangemessen auf eine Vertreibung aus bereits besessenem Land ein; Israel befindet sich im Kontext noch nicht im Land. Der Verbgebrauch kann vielmehr auch das Enterben bzw. Berauben eines Erbes/Besitzes ausdrücken.
  naturalness: Der Satz ist insgesamt flüssig und hat einen angemessen würdevollen modernen Registerton. „Aus seinem Erbbesitz verdrängen“ wirkt im Deutschen jedoch schwerfällig und sachlich zu konkret. „Es enterben“ ist idiomatisch, knapp und im Kontext der Ersetzung Israels durch Mose gut verständlich.
  terminology: „Nation“ gibt גּוֹי angemessen wieder. „Größer und mächtiger“ gibt die durch מִמֶּנּוּ bestimmte vergleichende Aussage natürlich wieder. Die Fußnote sollte bei einer Hauptlesart „enterben“ die ebenso mögliche Besitz-/Beraubungsnuance als Alternative dokumentieren.
  issues:
  - severity: medium
    issue: Die Wendung „aus seinem Erbbesitz verdrängen“ legt eine räumliche Vertreibung aus gegenwärtigem Landbesitz nahe.
    rationale: Diese Konkretisierung ist im unmittelbaren Kontext problematisch, da das bedrohte Volk das verheißene Land noch nicht in Besitz hat. Sie bildet zudem die mögliche Bedeutung „enterben“ nicht als eigenständige Hauptlesart ab. Eine idiomatische Hauptlesart mit Fußnotenalternative bewahrt die lexikalische Spannweite besser.
  revised_text: Ich werde dieses Volk mit der Pest schlagen und es enterben[a]. Dich aber werde ich zu einer Nation machen, die größer und mächtiger ist als dieses Volk.
