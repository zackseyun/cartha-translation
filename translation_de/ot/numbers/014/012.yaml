  text: אַכֶּ֥/נּוּ בַ/דֶּ֖בֶר וְ/אוֹרִשֶׁ֑/נּוּ וְ/אֶֽעֱשֶׂה֙ אֹֽתְ/ךָ֔ לְ/גוֹי גָּד֥וֹל וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: de
  text: Ich werde dieses Volk mit der Pest schlagen und es enterben[a]. Dich aber werde ich zu einer Nation machen, die größer und mächtiger ist als dieses Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es seines Besitzes berauben“. Das hebräische Verb kann sowohl das Entziehen eines Erbes als auch den Verlust von Besitz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: Ich werde dieses Volk … schlagen
  rationale: Das Hifil von נכה bedeutet hier „schlagen“. Der maskuline Singularsuffix bezieht sich kollektiv auf Israel; die Wiederaufnahme als „dieses Volk“ ist im Deutschen klarer als ein isoliertes Pronomen.
- source_word: בַדֶּבֶר
  choice: mit der Pest
  rationale: דֶּבֶר bezeichnet besonders in Gerichtszusammenhängen eine Pest beziehungsweise verheerende Seuche. „Pest“ ist knapp, geläufig und bewahrt die Wucht der Aussage.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: und aus seinem Erbbesitz verdrängen
  rationale: Das Hifil von ירשׁ kann das Entziehen von Besitz oder Erbe ausdrücken. Die Formulierung bewahrt sowohl den Gedanken der Vertreibung aus dem Besitz als auch den Erb-Bezug; „enterben“ wird als knappe Alternative in der Fußnote genannt.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: Dich aber werde ich zu einer Nation machen
  rationale: עשה mit Objekt und לְ bezeichnet hier das Machen zu etwas. Die Voranstellung von „Dich“ gibt den hebräischen Kontrast zwischen dem bedrohten Volk und Mose natürlich wieder.
- source_word: גָּדוֹל וְעָצוּם מִמֶּנּוּ
  choice: die größer und mächtiger ist als dieses Volk
  rationale: מן verleiht der Beschreibung vergleichende Kraft. עָצוּם kann Stärke, Macht oder zahlenmäßige Größe bezeichnen; „mächtiger“ hält diese Bedeutungsbreite eher offen als „zahlreicher“.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe
  choice: Israel wird als kollektive Einheit mit „dieses Volk“ beziehungsweise „seinem“ wiedergegeben.
  alternative: Pluralische Wiedergabe mit „sie/ihrem“ oder formal-pronominale Wiedergabe mit „ihn“.
  rationale: Die hebräischen Suffixe stehen im maskulinen Singular und behandeln Israel rhetorisch als ein einziges Volk. „Dieses Volk“ bewahrt den kollektiven Singular und bleibt in modernem Deutsch natürlich.
- issue: Bedeutung von ירשׁ im Hifil
  choice: „aus seinem Erbbesitz verdrängen“ im Haupttext
  alternative: „enterben“
  rationale: Der Zusammenhang trägt sowohl Besitz- und Vertreibungs- als auch Erbvorstellungen. Der Haupttext hält beide Aspekte zusammen, während die Fußnote die knappere erbrechtliche Lesart dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nation“ gibt גּוֹי präzise wieder. Die Wiederholung von „dieses Volk“ vermeidet ein unnatürliches oder missverständliches deutsches Singularpronomen und erhält zugleich die kollektive Einheit Israels.
