revisions:
- from: Ich werde dieses Volk mit der Pest schlagen und aus seinem Erbbesitz verdrängen[a]. Dich aber werde ich zu einer Nation machen, die größer und mächtiger ist als dieses Volk.
  to: Ich werde dieses Volk mit der Pest schlagen und es enterben[a]. Dich aber werde ich zu einer Nation machen, die größer und mächtiger ist als dieses Volk.
  rationale: Die Revision ersetzt die semantisch zu enge und im Kontext räumlich missverständliche Formulierung „aus seinem Erbbesitz verdrängen“ durch das natürliche „es enterben“. Die Fußnote hält die alternative Besitznuance des hebräischen Verbs offen. Kollektiver Singular, Vergleich und übrige Terminologie bleiben erhalten.
