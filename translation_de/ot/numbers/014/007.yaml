id: NUM.14.7
reference: Numbers 14:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֗רֶץ אֲשֶׁ֨ר עָבַ֤רְנוּ בָ/הּ֙ לָ/ת֣וּר אֹתָ֔/הּ טוֹבָ֥ה הָ/אָ֖רֶץ מְאֹ֥ד מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: de
  text: 'Und sie sagten zur ganzen Gemeinde der Israeliten[a]: »Das Land, das wir durchzogen haben, um es auszukundschaften[b], ist sehr, sehr gut.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur ganzen Versammlung der Israeliten«; wörtlicher: »zur ganzen Gemeinde der Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um es zu erkunden« oder »um es auszuspähen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Und sie sagten
  rationale: Die narrative Verbform führt die direkte Rede fort; »sagten« ist im Deutschen die natürliche Wiedergabe von אמר.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: zur ganzen Gemeinde der Israeliten
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft. »Gemeinde« wahrt den gemeinschaftlichen Charakter, während »Israeliten« die hebräische Wendung בְּנֵי יִשְׂרָאֵל in natürlichem modernem Deutsch wiedergibt.
- source_word: לֵאמֹר
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Infinitiv leitet idiomatisch die folgende direkte Rede ein; im Deutschen ist dafür neben Doppelpunkt und Anführungszeichen kein eigenes Wort erforderlich.
- source_word: הָאָרֶץ אֲשֶׁר עָבַרְנוּ בָהּ
  choice: Das Land, das wir durchzogen haben
  rationale: עבר mit ב bezeichnet das Hindurchgehen durch ein Gebiet. »durchzogen haben« ist prägnant und bewahrt den Bewegungssinn.
- source_word: לָתוּר אֹתָהּ
  choice: um es auszukundschaften
  rationale: תור bezeichnet in diesem Zusammenhang eine gezielte Erkundung des Landes. »auskundschaften« lässt den Charakter einer Erkundungsmission erkennen, ohne den Ausdruck unnötig auf feindliche Spionage festzulegen.
- source_word: טוֹבָה ... מְאֹד מְאֹד
  choice: ist sehr, sehr gut
  rationale: »gut« entspricht dem Grundsinn von טוֹבָה; die Wiederholung »sehr, sehr« bildet die doppelte Verstärkung מְאֹד מְאֹד sichtbar und nachdrücklich ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert; die auffällige hebräische Doppelung »sehr, sehr« bleibt zur Wahrung ihrer rhetorischen Kraft erhalten.
