  text: וַ/יֵּ֤רֶד הָ/עֲמָלֵקִי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/הָ֣ר הַ/ה֑וּא וַ/יַּכּ֥וּ/ם וַֽ/יַּכְּת֖וּ/ם עַד הַֽ/חָרְמָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: de
  text: Da kamen die Amalekiter und die Kanaaniter, die in jenem Bergland wohnten, herab, schlugen sie und zerschmetterten sie bis nach Horma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Horma ist ein Ortsname. Der hebräische Name hängt mit einem Wort für „Vernichtung“ oder „Bannweihung“ zusammen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: da kamen … herab
  rationale: Das Verb bezeichnet eine Abwärtsbewegung aus dem Bergland. Der Singular vor dem zusammengesetzten kollektiven Subjekt entspricht üblichem hebräischem Sprachgebrauch; im Deutschen steht das Prädikat natürlich im Plural.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: die Amalekiter und die Kanaaniter
  rationale: Die morphologisch singularischen Volksbezeichnungen sind hier kollektiv gebraucht; moderne deutsche Standardsprache gibt sie idiomatisch im Plural wieder.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: die in jenem Bergland wohnten
  rationale: יֹשֵׁב bezeichnet ansässiges Wohnen; הָר meint im Zusammenhang eher die gebirgige Region als einen einzelnen Berg. „Jenes“ bewahrt den deiktischen Wert von הַהוּא.
- source_word: וַיַּכּוּם
  choice: schlugen sie
  rationale: נכה hat ein breites Bedeutungsspektrum von schlagen bis besiegen. „Schlugen“ erhält die konkrete Aussage, ohne den Grad der Niederlage vorwegzunehmen.
- source_word: וַיַּכְּתוּם
  choice: zerschmetterten sie
  rationale: Das seltene Verb כתת bezeichnet ein vernichtendes Zerschlagen oder Zermalmen und steigert die vorherige Aussage. „Zerschmetterten“ bewahrt diese starke militärische Bildlichkeit.
- source_word: עַד הַחָרְמָה
  choice: bis nach Horma
  rationale: עַד gibt die räumliche Grenze der Verfolgung beziehungsweise Niederlage an. „Bis nach“ ist bei einem Ortsnamen natürliches Deutsch.
- source_word: הַחָרְמָה
  choice: Horma
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form wiedergegeben; seine bedeutungstragende Verbindung mit חרם wird in einer Fußnote erläutert.
