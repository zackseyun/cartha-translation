  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: de
  text: Die Israeliten taten es und schickten sie aus dem Lager hinaus. So wie Jahwe zu Mose geredet hatte, so taten die Israeliten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: handelten danach
  rationale: Die Wendung עשה + כן bezeichnet die Befolgung der vorausgehenden Anweisung. „Handelten danach“ ist im Deutschen natürlich und stellt den Bezug zum Gebot klar her.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Familienbezeichnung bedeutet wörtlich „Söhne Israels“, bezeichnet hier jedoch kollektiv das Volk. „Die Israeliten“ gibt diese Funktion in modernem Standarddeutsch natürlich und ohne eine sachlich unbeabsichtigte Beschränkung auf Männer wieder.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: schickten sie
  rationale: שׁלח bezeichnet hier das Wegschicken der zuvor genannten Personen; die folgende Richtungsangabe bringt den Ausschluss aus dem Lager ausdrücklich zum Ausdruck.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die Formulierung gibt die gerichtete Bewegung an einen Ort außerhalb des Lagers idiomatisch wieder.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: Genauso, wie … geredet hatte
  rationale: כַּאֲשֶׁר bezeichnet die genaue Übereinstimmung des Handelns mit der zuvor ergangenen göttlichen Weisung; das Plusquamperfekt wahrt die zeitliche Abfolge.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im Deutschen üblichen Transkription des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: כֵּן עָשׂוּ
  choice: handelten die Israeliten
  rationale: Die Schlusswendung nimmt die erste Aussage wieder auf und betont den Gehorsam. Die Wiederholung bleibt erhalten, ohne im Deutschen steif zu wirken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen; „der HERR“ wäre eine traditionelle Ersatzlesung, steht aber nicht als Titel im hebräischen Konsonantentext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Wendung בְּנֵי יִשְׂרָאֵל wird idiomatisch mit „die Israeliten“ wiedergegeben. Die resumptive Wiederholung des hebräischen Verses bleibt zur Betonung ihres Gehorsams erhalten.
