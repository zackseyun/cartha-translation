  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: de
  text: 'Dann soll der Priester die Frau mit dem Flucheid schwören lassen[a] und zu der Frau sagen: »Yahweh mache dich inmitten deines Volkes zu einem Fluch und zu einem Schwur[b], wenn Yahweh deinen Oberschenkel verkümmern und deinen Bauch anschwellen lässt.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Eid des Fluches schwören lassen“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann bedeuten, dass ihr Schicksal im Volk als Beispiel in Flüchen und Schwüren angeführt wird.
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Wendung ist schwer zu deuten. „Oberschenkel“ kann verhüllend auf die Fortpflanzungsorgane weisen; „Bauch“ kann auch „Leib“ oder „Mutterleib“ bedeuten. Welche körperliche oder reproduktive Schädigung gemeint ist, bleibt umstritten.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: unter ... schwören lassen
  rationale: 'Der Hifil von שׁבע ist kausativ: Der Priester veranlasst die Frau zum Schwur. Die Formulierung ist im Deutschen verständlich und bewahrt den rechtlich-rituellen Charakter.'
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: unter dem Flucheid
  rationale: Das deutsche Kompositum gibt die Verbindung von שְׁבֻעָה („Eid, Schwur“) und אָלָה („Fluch“) knapp und in einem würdigen rituellen Register wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: zu einem Fluch und zu einer Schwurformel
  rationale: „Fluch“ bewahrt die konkrete hebräische Aussage; „Schwurformel“ verdeutlicht, dass ihr Schicksal unter dem Volk sprichwörtlich beziehungsweise in Verwünschungen angeführt werden soll, ohne beide Glieder gleichzusetzen.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: inmitten deines Volkes
  rationale: Die Wendung bleibt der räumlich-sozialen Bildlichkeit des Hebräischen nahe und klingt dennoch natürlich.
- source_word: בְּתֵת
  choice: indem ... lässt
  rationale: Das ב mit Infinitiv constructus bezeichnet hier das Mittel beziehungsweise den Umstand, durch den sie zum Fluchbeispiel wird.
- source_word: יְרֵכֵךְ נֹפֶלֶת
  choice: deine Hüfte schwinden lässt
  rationale: יָרֵךְ kann Hüfte, Oberschenkel oder verhüllend den Genital- und Fortpflanzungsbereich bezeichnen. „Hüfte“ hält die Körpermetapher offen; „schwinden“ gibt die im Kontext gemeinte Wirkung von נפל natürlicher wieder als das wörtliche „fallen“.
- source_word: בִּטְנֵךְ צָבָה
  choice: deinen Bauch anschwellen lässt
  rationale: בֶּטֶן kann Bauch, Leib oder Mutterleib bedeuten. „Bauch“ ist konkret, allgemeinverständlich und legt die umstrittene medizinische beziehungsweise reproduktive Bedeutung nicht vorschnell fest.
theological_decisions:
- issue: Wie genau die körperliche Wirkung des Fluches zu bestimmen ist
  choice: Die körperlichen Bilder werden relativ wörtlich als Schwinden der Hüfte und Anschwellen des Bauches wiedergegeben.
  alternative: Die Wendung ausdrücklich als Fehlgeburt, Unfruchtbarkeit oder Schädigung der Gebärmutter deuten.
  rationale: Der schwierige hebräische Wortlaut nennt keine eindeutige medizinische Diagnose. Die Übersetzung bewahrt daher die mögliche reproduktive Bedeutung, ohne sie im Haupttext zur einzig möglichen Auslegung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-rituellem Klang. Der Satzbau folgt der hebräischen Fluchformel, ohne im Deutschen unnötig steif zu wirken. Medizinisch oder theologisch strittige Einzelheiten werden nicht vereindeutigt.
