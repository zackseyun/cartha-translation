source:
  edition: WLC
  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: de
  text: und ein Geist der Eifersucht über ihn kommt und er auf seine Frau eifersüchtig wird, und sie hat sich verunreinigt; oder ein Geist der Eifersucht über ihn kommt und er auf seine Frau eifersüchtig wird, sie aber hat sich nicht verunreinigt,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ist die Verbindung jeweils „und“; im zweiten Fall verdeutlicht „aber“ den Gegensatz. „Sich verunreinigen“ gibt die hebräische Reinheitssprache wieder, die hier auf die vermutete sexuelle Untreue bezogen ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: über ihn kommt
  rationale: Die Verbindung עָבַר עַל mit רוּחַ bezeichnet hier, dass ein innerer Antrieb den Mann erfasst. „Über ihn kommt“ gibt das hebräische Bild in natürlichem Deutsch wieder.
- source_word: רוּחַ קִנְאָה
  choice: ein Geist der Eifersucht
  rationale: רוּחַ kann Geist, Wind oder innere Regung bezeichnen; קִנְאָה meint in diesem ehelichen Zusammenhang Eifersucht. Die wörtlich geprägte Formulierung bewahrt die mögliche Personifikation beziehungsweise Beschreibung einer Gemütsregung.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: und er auf seine Frau eifersüchtig wird
  rationale: Das Piel von קנא bezeichnet die einsetzende eifersüchtige Reaktion des Mannes. „eifersüchtig wird“ wahrt die Handlungsfolge und ist mit „auf seine Frau“ idiomatisches Standarddeutsch.
- source_word: נִטְמָאָה
  choice: hat sich verunreinigt
  rationale: Das Verb gehört zur Sprache von Reinheit und Unreinheit, bezeichnet hier aber im Kontext den durch sexuelle Untreue eingetretenen Zustand. „sich verunreinigt“ bewahrt die Reinheitsterminologie und den kontextuellen moralischen Bezug, ohne ihn enger auszulegen als der hebräische Ausdruck.
- source_word: אוֹ
  choice: oder
  rationale: Die Partikel eröffnet schlicht den alternativen Rechtsfall. Ein zusätzliches „wenn“ ist im Deutschen nicht nötig, da die fortgeführte Satzstruktur die Bedingung erkennen lässt.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: sie aber hat sich nicht verunreinigt
  rationale: Das hebräische וְ ist formal „und“, trägt hier im alternativen Fall jedoch einen klaren Gegensatz. „aber“ macht diesen Kontrast natürlich sichtbar, ohne eine konzessive Beziehung stärker festzulegen.
theological_decisions:
- issue: Bedeutung der Unreinheitssprache im Gesetz über den Verdacht auf Ehebruch
  choice: „hat sich verunreinigt“
  alternative: „ist unrein geworden“ oder „hat sich entehrt“
  rationale: Die Übersetzung erhält den kultisch-moralischen Wortbereich von טמא und lässt zugleich durch den Zusammenhang erkennen, dass sexuelle Untreue gemeint ist. Sie beschränkt den Ausdruck weder auf bloß rituelle Unreinheit noch ersetzt sie ihn vollständig durch eine moralisch interpretierende Umschreibung.
- issue: Natur des „Geistes der Eifersucht“
  choice: „ein Geist der Eifersucht“
  alternative: „Eifersucht ergreift ihn“ oder „ein eifersüchtiger Verdacht kommt über ihn“
  rationale: Die substantivische Wiedergabe bewahrt die Mehrdeutigkeit von רוּחַ zwischen Geist und innerer Regung und entscheidet nicht, ob eine eigenständige geistige Macht oder ausschließlich eine Gemütsverfassung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in fortlaufender Rechtssatz-Syntax. Die Wiederholung des hebräischen Satzbaus bleibt erhalten. Der Vers beginnt als Fortsetzung des vorhergehenden Satzes mit „und“ und endet deshalb mit einem Komma.
