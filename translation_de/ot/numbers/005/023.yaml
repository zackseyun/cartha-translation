id: NUM.5.23
reference: Numbers 5:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/כָתַב אֶת הָ/אָלֹ֥ת הָ/אֵ֛לֶּה הַ/כֹּהֵ֖ן בַּ/סֵּ֑פֶר וּ/מָחָ֖ה אֶל מֵ֥י הַ/מָּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: de
  text: Dann soll der Priester diese Flüche[a] auf die Schriftrolle schreiben und sie in das bittere Wasser abwaschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Eidesflüche“. Das hebräische Wort kann einen mit einem Eid verbundenen Fluch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie darin auslöschen“ beziehungsweise „sie hineinwischen“. Gemeint ist, dass die geschriebenen Worte von der Schriftrolle entfernt werden und in das Wasser gelangen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: Dann soll … schreiben
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt in dieser fortlaufenden Ritualanweisung den nächsten vorgeschriebenen Handlungsschritt aus.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: diese Flüche
  rationale: אָלָה bezeichnet hier die zuvor ausgesprochenen, eidlich bekräftigten Fluchfolgen; „Flüche“ ist im Haupttext klar und die eidbezogene Nuance wird in einer Fußnote bewahrt.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich passende Bezeichnung für den kultischen Amtsträger.
- source_word: בַּסֵּפֶר
  choice: auf die Schriftrolle
  rationale: סֵפֶר meint hier den Schriftträger beziehungsweise das Schriftstück, nicht ein modernes gebundenes Buch. Im Deutschen schreibt man idiomatisch „auf“ eine Schriftrolle.
- source_word: וּמָחָה
  choice: und sie … abwaschen
  rationale: מחה bezeichnet das Wegwischen oder Tilgen der Schrift. Im gegebenen Ritual macht „abwaschen“ verständlich, dass die geschriebenen Worte durch das Wasser von der Rolle gelöst werden.
- source_word: אֶל
  choice: in
  rationale: Die gerichtete Präposition bezeichnet hier die Überführung der abgewaschenen Schrift in das Wasser.
- source_word: מֵי הַמָּרִים
  choice: das bittere Wasser
  rationale: Die hebräische Fügung bedeutet wörtlich „Wasser der Bitterkeit“ beziehungsweise „bitteres Wasser“; der deutsche Singular ist für die Flüssigkeit natürlich.
