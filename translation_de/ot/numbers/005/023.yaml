  source_fidelity: Die Übersetzung gibt die sequenzielle, verpflichtende Handlung im Ritual korrekt mit „Dann soll“ wieder. „Diese Flüche“ trifft הָאָלֹת angemessen; die mögliche eidliche Konnotation wird in der Fußnote sachgerecht vermerkt. „Auf die Schriftrolle“ ist für בַּסֵּפֶר materiell und idiomatisch passend. „Sie in das bittere Wasser abwaschen“ bildet die auf das Wasser gerichtete Tilgung bzw. das Abwaschen der Schrift (וּמָחָה אֶל) sinnvoll ab, ohne den genauen materiellen Vorgang übermäßig festzulegen.
