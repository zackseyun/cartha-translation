source:
  edition: WLC
  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: de
  text: Wenn die Frau sich aber nicht verunreinigt hat und rein ist, wird sie als unschuldig gelten und schwanger werden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Samen besät werden“; eine hebräische Wendung für Empfängnis beziehungsweise das Erlangen von Nachkommen.'
    reason: Die Fußnote dokumentiert das ungewöhnliche hebräische Bild, während der Haupttext dessen Sinn in verständlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Bedingung steht im Gegensatz zum Fall des vorhergehenden Verses; die deutsche Nachstellung von „aber“ gibt diesen Kontrast natürlich wieder.
- source_word: לֹא נִטְמְאָה
  choice: sich nicht verunreinigt hat
  rationale: Das Nifal von טמא bezeichnet hier im Zusammenhang des Ehebruchs die eingetretene moralisch-sexuelle Verunreinigung. Die reflexive Formulierung ist im Deutschen natürlich, ohne eine bloß rituelle Unreinheit nahezulegen.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: וּטְהֹרָה הִוא
  choice: und rein ist
  rationale: טָהוֹר bezeichnet Reinheit beziehungsweise Unversehrtheit; „rein“ bewahrt den rituell-moralischen Bedeutungsbereich und ist hier idiomatisch.
- source_word: וְנִקְּתָה
  choice: wird sie frei ausgehen
  rationale: Das Nifal von נקה kann Freisein, Straffreiheit oder Entlastung bezeichnen. „frei ausgehen“ lässt sowohl die Bestätigung ihrer Unschuld als auch das Ausbleiben der angedrohten Folgen anklingen, ohne den Vorgang unnötig zu einem Gerichtsverfahren zu machen.
- source_word: וְנִזְרְעָה זָרַע
  choice: und schwanger werden
  rationale: Die wörtlich schwer verständliche Wendung „mit Samen besät werden“ bezeichnet Empfängnis beziehungsweise Fruchtbarkeit. „schwanger werden“ gibt den idiomatischen Sinn klar wieder, ohne bereits eine erfolgreiche Geburt auszusagen.
theological_decisions:
- issue: Folge der erwiesenen Unschuld
  choice: Die Frau geht frei aus und wird schwanger werden.
  alternative: Die Frau wird lediglich als unschuldig erklärt oder behält allgemein ihre Fruchtbarkeit.
  rationale: Der Vers verbindet נקה mit einer ausdrücklichen Empfängnis- beziehungsweise Fruchtbarkeitsaussage. Die Übersetzung lässt offen, ob der Schwerpunkt bei Entlastung, Bewahrung vor der Fluchfolge oder beidem liegt, gibt die abschließende Zusage aber direkt wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist klar und mündlich verständlich; „frei ausgehen“ bewahrt die Bedeutungsbreite von נקה, und die Fußnote macht die Bildsprache der Schlusswendung transparent.
