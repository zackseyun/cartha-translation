source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: de
  text: Hat der Mann aber keinen Löser aus seiner Verwandtschaft, dem die Wiedergutmachung für die Schuld zurückzuzahlen ist[a], so fällt die Wiedergutmachung für die Schuld, die dem HERRN zurückerstattet wird, dem Priester zu[b], zusätzlich zu dem Widder zur Sühne, mit dem für den Mann Sühne erwirkt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »keinen nächsten Verwandten«. Das hebräische Wort bezeichnet einen Angehörigen, der in Fragen der Auslösung oder Wiedergutmachung rechtliche Verantwortung trägt.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet hier die wegen der Schuld zu leistende Wiedergutmachung, nicht den Widder selbst; dieser wird anschließend eigens genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: Löser aus seiner Verwandtschaft
  rationale: Der Ausdruck bezeichnet einen nahen Verwandten mit rechtlicher Verantwortung, Ansprüche der Familie wahrzunehmen oder eine Leistung entgegenzunehmen. Die Formulierung bewahrt sowohl den familiären als auch den rechtlichen Sinn.
- source_word: הָאָשָׁם
  choice: Wiedergutmachung für die Schuld
  rationale: Im Zusammenhang ist die geschuldete Ersatzleistung gemeint, nicht der Opferwidder; dieser wird anschließend gesondert genannt.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: die Wiedergutmachung für die Schuld, die ... zurückerstattet wird
  rationale: Das passive Partizip von שוב hebt die Rückerstattung hervor und wird deshalb ausdrücklich wiedergegeben.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname JHWH wird in der deutschen Bibeltradition würdig und gut verständlich mit »der HERR« wiedergegeben.
- source_word: לַכֹּהֵן
  choice: fällt dem Priester zu
  rationale: Die im Hebräischen knappe Zuordnung wird im Deutschen durch ein natürliches rechtliches Prädikat verdeutlicht.
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Die Präposition zeigt, dass der Widder neben der Wiedergutmachungsleistung erforderlich ist und nicht mit ihr gleichgesetzt werden darf.
- source_word: אֵיל הַכִּפֻּרִים
  choice: Widder zur Sühne
  rationale: Die Wiedergabe bezeichnet knapp und verständlich die kultische Funktion des Widders.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: mit dem für den Mann Sühne erwirkt wird
  rationale: Der Widder wird als Mittel der Sühne bezeichnet. Die passive Form vermeidet es, ein im Satz nicht ausdrücklich genanntes Subjekt einzuführen.
- source_word: לָאִישׁ / עָלָיו
  choice: der Mann / für den Mann
  rationale: Die grammatisch maskuline Einzahl wird beibehalten; die Wiederholung von »der Mann« macht den Bezug des abschließenden Pronomens im Deutschen eindeutig.
theological_decisions:
- issue: Verhältnis von Wiedergutmachung und Opfer
  choice: Die materielle Wiedergutmachung und der Opferwidder werden als zwei unterschiedliche, zusätzlich zueinander tretende Leistungen wiedergegeben.
  alternative: אָשָׁם könnte an dieser Stelle als kultisches Schuldopfer verstanden werden.
  rationale: מִלְּבַד (»zusätzlich zu«) und die anschließende gesonderte Nennung des Widders zeigen, dass hier die Wiedergutmachungsleistung nicht mit dem Opfertier identisch ist.
- issue: Wiedergabe des Gottesnamens JHWH
  choice: der HERR
  alternative: Jahwe
  rationale: »Der HERR« entspricht einer etablierten deutschen Bibelkonvention; die typografische Hervorhebung zeigt an, dass im hebräischen Text der Gottesname steht.
- issue: Bedeutung von כפר
  choice: Sühne erwirken
  alternative: Versöhnung schaffen / Sühne vollziehen
  rationale: »Sühne« wahrt die kultisch-theologische Aussage, ohne den genauen Wirkmechanismus über den hebräischen Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-kultischer Präzision. »Löser aus seiner Verwandtschaft« vermeidet das im Deutschen missverständliche »Verwandten-Erlöser«. »Wiedergutmachung« und »Sühne« unterscheiden die materielle Ersatzleistung klar vom Opfergeschehen.
