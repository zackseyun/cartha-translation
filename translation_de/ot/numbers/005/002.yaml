source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: de
  text: Befiehl den Israeliten, dass sie jeden, der an einer Hauterkrankung leidet[a], jeden, der einen Ausfluss hat, und jeden, der durch einen Toten unrein geworden ist[b], aus dem Lager wegschicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »Aussatz«. Der hebräische Ausdruck bezeichnet in den Reinheitsvorschriften verschiedene Hauterkrankungen, nicht ausschließlich die heute als Lepra bekannte Krankheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »unrein durch eine Person/eine Seele«. In diesem Zusammenhang ist damit die durch einen verstorbenen Menschen beziehungsweise dessen Leichnam verursachte Unreinheit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Befiehl
  rationale: Der Singularimperativ richtet sich an Mose und bezeichnet eine verbindliche Anordnung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Wörtlich steht »den Söhnen Israels«; »den Israeliten« gibt die kollektive Bezeichnung im heutigen Standarddeutsch natürlich und ohne Bedeutungsverlust wieder.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: aus dem Lager wegzuschicken
  rationale: Die Form von שלח fordert dazu auf, die Betroffenen aus dem Lager hinauszusenden; die deutsche Infinitivkonstruktion schließt sich natürlich an »Befiehl« an.
- source_word: כָּל צָרוּעַ
  choice: jeden …, der an einer schweren Hautkrankheit leidet
  rationale: צָרוּעַ bezeichnet im Kontext der Reinheitsgesetze einen von צָרַעַת Betroffenen. »Schwere Hautkrankheit« vermeidet die medizinisch zu enge Gleichsetzung mit moderner Lepra.
- source_word: וְכָל זָב
  choice: jeden, der einen Ausfluss hat
  rationale: זָב bezeichnet in den Reinheitsvorschriften eine Person mit einem körperlichen, insbesondere genitalen Ausfluss; die knappe Wiedergabe wahrt die Zurückhaltung des Hebräischen.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: jeden, der durch einen Toten unrein geworden ist
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch einen verstorbenen Menschen beziehungsweise dessen Leichnam. Die Formulierung macht die durch einen Toten verursachte kultische Unreinheit verständlich, ohne ausdrücklich einen im Vers nicht genannten Kontakt hinzuzufügen.
theological_decisions:
- issue: Wiedergabe kultischer Unreinheit
  choice: unrein
  alternative: verunreinigt; kultisch unrein
  rationale: טָמֵא beschreibt hier einen kultisch-rechtlichen Status und nicht notwendig moralische Schuld. »Unrein« bewahrt den etablierten Schlüsselbegriff, ohne die Aussage zu moralisieren.
- issue: Bedeutung von צָרַעַת
  choice: schwere Hautkrankheit mit erklärender Fußnote
  alternative: Aussatz; Lepra
  rationale: Die traditionelle Wiedergabe »Aussatz« kann fälschlich ausschließlich an Hansen-Krankheit denken lassen. Der allgemeinere Ausdruck wahrt den Umfang des antiken Reinheitsbegriffs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die aufzählende Struktur des hebräischen Rechtstextes bleibt erhalten; fachlich missverständliche traditionelle Begriffe werden im Haupttext verständlich wiedergegeben und in Fußnoten erläutert.
