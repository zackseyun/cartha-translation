base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben. Eine weitere deutsche Wiedergabe ist „Jehova“.'
    reason: Alternative Wiedergaben des Gottesnamens.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Waw mit der Verbform von דבר eröffnet ein neues Redeereignis. „sprach“ entspricht der feierlichen, im Deutschen etablierten Formel für göttliche Rede, ohne altertümlich zu wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu Mose sprechen“ ist die natürliche deutsche Verbindung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel kündigt den unmittelbar folgenden Wortlaut an. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion präziser als das schwerfällige „und sagte“ oder „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Redeeröffnung bleibt erkennbar; לֵאמֹר wird idiomatisch durch den Doppelpunkt dargestellt.
