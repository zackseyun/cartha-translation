base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: de
  text: Dann soll der Priester vom Speiseopfer eine Handvoll als dessen Gedenkanteil nehmen und sie auf dem Altar in Rauch aufgehen lassen. Danach soll er die Frau das Wasser[a] trinken lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im weiteren Zusammenhang wird dieses Wasser als das bittere Wasser bezeichnet; hier steht im Hebräischen jedoch nur »das Wasser«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמַץ
  choice: Dann soll … eine Handvoll nehmen
  rationale: קמץ bezeichnet im Opferkontext das Nehmen einer Handvoll; die Satzfolge wird als rechtliche Anweisung wiedergegeben.
- source_word: מִן הַמִּנְחָה
  choice: von dem Speiseopfer
  rationale: מִנְחָה bezeichnet hier das kultische Speiseopfer; der im Deutschen geläufige Fachausdruck bleibt verständlich und präzise.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: den davon bestimmten Gedenkanteil
  rationale: אַזְכָּרָה ist der Teil des Speiseopfers, der auf dem Altar dargebracht wird. Die Formulierung macht den Rückbezug des femininen Suffixes auf das Speiseopfer deutlich, ohne die Funktion weiter auszudeuten.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: und ihn auf dem Altar in Rauch aufgehen lassen
  rationale: הקטיר bezeichnet im Opferkontext das Verbrennen beziehungsweise In-Rauch-Aufgehen-Lassen einer Opfergabe; die Zielendung an מִזְבֵּחָה wird idiomatisch mit „auf dem Altar“ wiedergegeben.
- source_word: וְאַחַר
  choice: Danach
  rationale: Das Wort markiert die zeitliche Abfolge der rituellen Handlungen.
- source_word: יַשְׁקֶה אֶת הָאִשָּׁה
  choice: soll er die Frau … trinken lassen
  rationale: Der Hifil von שׁקה hat kausative Bedeutung; „trinken lassen“ bewahrt diese, ohne unnötig Zwang über den Wortlaut hinaus zu betonen.
- source_word: אֶת הַמָּיִם
  choice: das Wasser
  rationale: Der Vers selbst sagt lediglich „das Wasser“; die nähere Kennzeichnung aus dem Kontext wird nicht in den Haupttext eingefügt.
theological_decisions:
- issue: Soll das Wasser aufgrund des weiteren Ritualkontexts als „bitteres Wasser“ bezeichnet werden?
  choice: Im Haupttext steht schlicht „das Wasser“.
  alternative: „das bittere Wasser“
  rationale: הַמָּיִם enthält in diesem Vers kein Adjektiv. Die schlichtere Wiedergabe bewahrt den unmittelbaren Wortlaut und vermeidet eine kontextuelle Ergänzung im Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultischer Fachsprache. „Speiseopfer“ und „Gedenkanteil“ bewahren die terminologische Genauigkeit; „in Rauch aufgehen lassen“ gibt die kultische Nuance von הקטיר deutlicher wieder als das allgemeinere „verbrennen“.
