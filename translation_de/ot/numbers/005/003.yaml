  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: de
  text: Männer wie Frauen sollt ihr aus dem Lager hinausschicken[a]. Ihr sollt sie hinausschicken, damit sie ihre Lager[b] nicht verunreinigen, in deren Mitte ich wohne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Männlichen bis zum Weiblichen“; das heißt: Männer wie Frauen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text hat den Plural „ihre Lager“; möglicherweise sind damit die verschiedenen Bereiche oder Abteilungen des Gesamtlagers gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „unter denen ich wohne“. Der hebräische Ausdruck kann sich auf die Lager oder auf die zu ihnen gehörenden Menschen beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: Männliche wie weibliche Personen
  rationale: Die hebräische Wendung bezeichnet inklusiv beide Geschlechter. Diese Formulierung gibt זָכָר und נְקֵבָה genau wieder und klingt im Deutschen natürlicher als das wörtliche „vom Männlichen bis zum Weiblichen“.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: sollt ihr ... hinausschicken / Ihr sollt sie hinausschicken
  rationale: Die Wiederholung des Piel von שלח wird bewahrt. „Hinausschicken“ bezeichnet den Ausschluss aus dem Lager, ohne den Vorgang unnötig als Strafmaßnahme zuzuspitzen.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die räumliche Bewegung über die Grenze des Lagers hinaus wird in natürlichem Deutsch ausgedrückt.
- source_word: יְטַמְּאוּ
  choice: verunreinigen
  rationale: טמא bezeichnet hier im priesterlichen Kontext kultische Unreinheit. „Verunreinigen“ ist verständlich und bewahrt diese Bedeutung.
- source_word: מַחֲנֵיהֶם
  choice: ihre Lager
  rationale: Der hebräische Text hat einen Plural mit Suffix der dritten Person Plural. Der deutsche Plural bewahrt die Form und lässt offen, ob die verschiedenen Lagerbereiche oder Abteilungen des Gesamtlagers gemeint sind.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: in deren Mitte ich wohne
  rationale: Die Formulierung bewahrt den Pluralbezug und die Aussage von Gottes gegenwärtigem Wohnen, ohne endgültig festzulegen, ob sich der Ausdruck sachlich auf die Lager oder auf die darin versammelten Menschen bezieht.
theological_decisions:
- issue: Bezugswort des Relativsatzes אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: „in deren Mitte ich wohne“ mit grammatischem Bezug auf den Plural „Lager“
  alternative: „unter ihnen wohne“ mit persönlichem Bezug auf die Menschen
  rationale: Das maskuline Pluralsuffix kann die Lager als gegliederte Gesamtheit oder die mit ihnen verbundenen Menschen bezeichnen. Der Haupttext wahrt die hebräische Struktur; eine Fußnote nennt die persönliche Deutung und erhält so die theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die imperativische Verpflichtung wird mit „sollt“ wiedergegeben; die auffällige Wiederholung des Verbs und der hebräische Plural „Lager“ bleiben erhalten.
