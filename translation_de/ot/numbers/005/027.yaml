revisions:
- from: Wenn er sie das Wasser trinken lässt[a] und sie sich tatsächlich verunreinigt und ihrem Mann die Treue gebrochen hat, dann wird das fluchbringende Wasser in sie eindringen und bittere Wirkung entfalten; ihr Bauch wird anschwellen und ihre Hüfte wird verfallen[b]. So wird die Frau inmitten ihres Volkes zum Fluch werden.
  to: Wenn er sie das Wasser trinken lässt[a] und sie unrein geworden ist und ihrem Mann die Treue gebrochen hat, dann wird das fluchbringende Wasser in sie gelangen und bitter werden[b]; ihr Bauch wird anschwellen und ihre Hüfte wird verfallen[c]. Die Frau wird so inmitten ihres Volkes zum Fluch werden.
  rationale: Die Revision entfernt die unbelegte Verstärkung „tatsächlich“, bewahrt bei „unrein geworden“ die kultische und moralische Offenheit und bindet die schwierige Wendung לְמָרִים enger an das fluchbringende Wasser. Die Fußnoten vermerken sowohl die syntaktische als auch die lexikalische Unsicherheit, ohne eine konkrete medizinische oder reproduktive Deutung festzulegen.
  reviewer_model: gpt-5.6-terra
