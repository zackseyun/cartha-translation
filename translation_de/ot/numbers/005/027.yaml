source:
  edition: WLC
  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: de
  text: Wenn er sie das Wasser trinken lässt[a] und sie unrein geworden ist und ihrem Mann die Treue gebrochen hat, dann wird das fluchbringende Wasser in sie gelangen und bitter werden[b]; ihr Bauch wird anschwellen und ihre Hüfte wird verfallen[c]. Die Frau wird so inmitten ihres Volkes zum Fluch werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem er ihr das Wasser zu trinken gegeben hat.“ Die hebräische Satzfolge kann zeitlich aufgefasst werden.'
    reason: grammatical_alternative
  - marker: b
    text: 'Oder: „… wird in sie gelangen, um Bitterkeit zu bewirken“ oder „… als bitteres Wasser“. Die hebräische Wendung ist schwierig und kann die Beschaffenheit des Wassers oder seine schmerzliche Wirkung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ihre Hüfte wird fallen“. Die Wendung bezeichnet vermutlich eine schwere körperliche Schädigung, möglicherweise im Bereich der Fortpflanzungsorgane; ihre genaue Bedeutung ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: Wenn er sie das Wasser trinken lässt
  rationale: 'Die Hifil-Form von שׁקה ist kausativ: jemanden trinken lassen bzw. zu trinken geben. Die temporale Einleitung gibt den Zusammenhang der hebräischen Satzfolge natürlich wieder.'
- source_word: נִטְמְאָה
  choice: sie sich tatsächlich verunreinigt
  rationale: Das Niphal bezeichnet hier das Unreinwerden; die reflexive deutsche Form bewahrt im Zusammenhang sowohl die moralische als auch die rituelle Dimension. „Tatsächlich“ verdeutlicht die Bedingung, ohne den Tatbestand näher auszugestalten.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: ihrem Mann die Treue gebrochen hat
  rationale: Die figura etymologica mit מעל betont einen schweren Treuebruch. Die deutsche Wendung ist verständlich und wahrt den relationalen Sinn; אִישָׁהּ bezeichnet hier ihren Ehemann.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: das fluchbringende Wasser
  rationale: Das Partizip von ארר kennzeichnet das Wasser als Träger oder Vollstrecker des Fluches. „Fluchbringend“ ist knapp und bildet diese Wirksamkeit ab.
- source_word: לְמָרִים
  choice: und bittere Wirkung entfalten
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich Ergebnis oder Wirkung. Diese Fassung ist im Deutschen verständlich, legt aber nicht fest, ob das Wasser selbst bitter ist oder bitteres Leiden hervorruft.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: ihr Bauch wird anschwellen
  rationale: בטן bedeutet unmittelbar Bauch oder Unterleib. „Bauch“ bleibt konkret und vermeidet die nicht ausdrücklich genannte Festlegung auf den Mutterleib.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: ihre Hüfte wird verfallen
  rationale: יָרֵךְ bezeichnet wörtlich Hüfte bzw. Oberschenkel und kann euphemistisch den Fortpflanzungsbereich meinen; נפל heißt wörtlich fallen. „Verfallen“ signalisiert eine schwere körperliche Schädigung, ohne eine bestimmte medizinische Diagnose zu behaupten.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: So wird die Frau inmitten ihres Volkes zum Fluch werden
  rationale: אָלָה ist ein Fluch, besonders im Rahmen eines Schwurs. „Zum Fluch werden“ erhält die Aussage, dass die Frau innerhalb der Gemeinschaft selbst zum abschreckenden Beispiel oder Gegenstand einer Fluchformel wird.
theological_decisions:
- issue: Die körperliche Folge des Fluches ohne medizinische oder reproduktive Überpräzisierung wiedergeben
  choice: „ihr Bauch wird anschwellen und ihre Hüfte wird verfallen“ im Haupttext
  alternative: „ihr Mutterleib wird eine Fehlgeburt erleiden“, „ihre Geschlechtsteile werden verkümmern“ oder wörtlich „ihre Hüfte wird fallen“
  rationale: Der hebräische Wortlaut ist körperlich konkret, aber in seiner genauen physiologischen Bedeutung umstritten und möglicherweise euphemistisch. Die gewählte Fassung bleibt nahe an den Körperbezeichnungen und wahrt die Ungewissheit.
- issue: Die Mehrdeutigkeit von לְמָרִים bewahren
  choice: „und bittere Wirkung entfalten“
  alternative: „als bitteres Wasser“ oder „zum bitteren Leiden“
  rationale: Die Präpositionalfügung kann die Beschaffenheit des Wassers oder dessen schmerzliche Wirkung bezeichnen. Der Haupttext gibt die wahrscheinliche resultative Bedeutung wieder, während die Fußnote die andere Möglichkeit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert. „Hüfte“ wahrt den konkreten, möglicherweise euphemistischen Ausdruck des Hebräischen; die Fußnote dokumentiert die wörtliche und unsichere Bedeutung.
