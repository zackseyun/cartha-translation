    issue: „tatsächlich“ in „sie sich tatsächlich verunreinigt“
    rationale: Das Hebräische enthält keine Entsprechung für eine solche Bekräftigung. Sie kann den konditionalen Befund über das im Text Ausgedrückte hinaus akzentuieren.
  - severity: medium
    issue: „und bittere Wirkung entfalten“ für לְמָרִים
    rationale: Die schwierige hebräische Präpositionalfügung ist enger mit dem Eintreten des Wassers verbunden. Die Formulierung macht daraus eine zusätzliche, selbständige Aussage und legt die Wirkung stärker fest als nötig.
  - severity: low
    issue: „in sie eindringen“
    rationale: Für das Eintreten getrunkenen Wassers ist „in sie gelangen“ im heutigen Deutsch natürlicher und weniger unnötig suggestiv, ohne die körperliche Bezugsrichtung aufzugeben.
  - severity: low
