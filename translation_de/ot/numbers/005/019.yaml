  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: de
  text: 'Dann soll der Priester sie unter Eid stellen und zu der Frau sagen: »Wenn kein Mann mit dir geschlafen hat und wenn du nicht zur Unreinheit abgeirrt bist, während du mit deinem Mann verheiratet bist,[a] dann bleib frei von diesem bitteren, fluchbringenden Wasser.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter deinem Mann«; gemeint ist ihr Stand und ihre Bindung innerhalb der Ehe.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich steht im Hebräischen die Mehrzahl: »von diesen bitteren, fluchbringenden Wassern«; gemeint ist das Wasser des Rituals.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ אֹתָהּ
  choice: soll sie unter Eid stellen
  rationale: Der Hifil von שבע bedeutet hier, jemanden schwören zu lassen bzw. unter Eid zu stellen. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt den rechtlich-rituellen Charakter.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: wenn kein Mann mit dir geschlafen hat
  rationale: שכב bezeichnet hier euphemistisch Geschlechtsverkehr. „Mit dir geschlafen“ ist im modernen Deutsch verständlich, zurückhaltend und idiomatisch.
- source_word: וְאִם לֹא שָׂטִית טֻמְאָה
  choice: und wenn du nicht in Unreinheit vom Weg abgekommen bist
  rationale: שׂטה trägt das Bild des Abweichens oder Abirrens; טֻמְאָה bezeichnet Unreinheit. Die Wiedergabe wahrt sowohl die Metapher als auch die rituell-moralische Offenheit des Begriffs.
- source_word: תַּחַת אִישֵׁךְ
  choice: während du mit deinem Mann verheiratet warst
  rationale: Wörtliches „unter deinem Mann“ wäre im heutigen Deutsch missverständlich. Die Wendung bezeichnet hier ihren Stand innerhalb der Ehe; die Übersetzung macht diesen idiomatischen Sinn deutlich, ohne eine bestimmte Lehre über eheliche Autorität einzutragen.
- source_word: הִנָּקִי
  choice: dann bleib … unversehrt
  rationale: Die Form von נקה drückt hier aus, dass die Frau von der schädlichen Wirkung des Fluchwassers frei bzw. verschont bleiben soll. „Unversehrt bleiben“ gibt das Ergebnis im Deutschen klar wieder.
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים הָאֵלֶּה
  choice: von diesem bitteren, fluchbringenden Wasser
  rationale: מַיִם steht im Hebräischen formal im Plural, wird im Deutschen aber gewöhnlich als Stoffbezeichnung im Singular wiedergegeben. Das Partizip הַמְאָרֲרִים kennzeichnet das Wasser als ein Mittel, das den Fluch wirksam werden lässt; „fluchbringend“ bewahrt diese Aussage knapp.
theological_decisions:
- issue: Bezeichnung des vermuteten Vergehens
  choice: Die hebräischen Bilder von Geschlechtsverkehr, Abweichen und Unreinheit bleiben erhalten.
  alternative: Das Vergehen ausdrücklich als Ehebruch bezeichnen.
  rationale: Der Zusammenhang betrifft vermutete eheliche Untreue, doch der Vers selbst verwendet eine abgestufte, rituell-rechtliche Ausdrucksweise. „Ehebruch“ würde diese stärker festlegen, als es der Wortlaut hier tut.
- issue: Wirkung des bitteren Wassers
  choice: Das Wasser wird als „fluchbringend“ bezeichnet, und die unschuldige Frau soll davon unversehrt bleiben.
  alternative: Das Wasser als bloß symbolisch bezeichnen oder den genauen Wirkmechanismus ausformulieren.
  rationale: Das Partizip aus ארר verbindet das Wasser mit der Wirksamkeit des Fluches, ohne in diesem Vers dessen Mechanismus näher zu erklären. Diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-rituellem Ton. Archaische Wendungen und ein im Deutschen missverständliches wörtliches „unter deinem Mann“ werden vermieden; die Bildsprache von Abweichen, Unreinheit und Fluchwirkung bleibt erhalten.
