  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: de
  text: Dies ist die Weisung für Eifersuchtsfälle:[a] wenn eine Frau ihrem Mann untreu wird[b] und unrein wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet hier den Plural; wahrscheinlich ist dies eine feste Bezeichnung für die durch Eifersucht ausgelösten Rechtsfälle und das dazugehörige Verfahren.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wenn eine Frau unter ihrem Mann abweicht«. Die Wendung bezeichnet ihr Abweichen innerhalb der ehelichen Bindung.'
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Dies ist die Weisung für
  rationale: Die Formel leitet die zusammenfassende Bestimmung ein. »Weisung« gibt תּוֹרָה im gesetzlichen Kontext wieder; »für« verbindet sie im Deutschen natürlich mit der technischen Fallbezeichnung.
- source_word: הַקְּנָאֹת
  choice: Eifersuchtsfälle
  rationale: Der hebräische Plural bezeichnet hier wahrscheinlich die durch Eifersucht ausgelösten Rechtsfälle beziehungsweise das entsprechende Verfahren. »Eifersuchtsfälle« bewahrt den Plural und klingt natürlicher als »Eifersüchte«.
- source_word: אֲשֶׁר
  choice: wenn
  rationale: Die Relativpartikel führt den Fall ein, auf den sich die Weisung bezieht; konditionales »wenn« ist im Deutschen idiomatisch.
- source_word: תִּשְׂטֶה אִשָּׁה תַּחַת אִישָׁהּ
  choice: wenn eine Frau ihrem Mann untreu wird
  rationale: אִשָּׁה bezeichnet im Zusammenhang die Ehefrau. שׂטה beschreibt ein Abweichen im ehelichen Verhältnis; תַּחַת אִישָׁהּ ist eine Wendung für ihre Bindung an den Ehemann. Die Übersetzung gibt den Sinn natürlich wieder, ohne ausdrücklich »Ehebruch begehen« zu sagen.
- source_word: וְנִטְמָאָה
  choice: und sich verunreinigt
  rationale: Der Niphal von טמא bezeichnet das Eintreten von Verunreinigung. Die reflexive Form wahrt die Unbestimmtheit zwischen moralisch-sexueller und kultischer Verunreinigung.
theological_decisions:
- issue: Bedeutung der Verunreinigung im Verfahren bei Eifersucht
  choice: sich verunreinigt
  alternative: Ehebruch begeht / unrein wird
  rationale: Der Zusammenhang betrifft sexuelle Untreue, doch der hebräische Text verwendet Verunreinigungssprache und nicht den ausdrücklichen Begriff für Ehebruch. Die gewählte Formulierung erhält diese theologische und rechtliche Spannung.
- issue: Grad der Feststellung ehelicher Untreue
  choice: ihrem Mann untreu wird
  alternative: von ihrem Mann abweicht / unter ihrem Mann auf Abwege gerät
  rationale: שׂטה ist metaphorisch, bezeichnet in diesem Kontext aber eheliche beziehungsweise sexuelle Abweichung. »Untreu wird« ist verständlich, ohne die Aussage auf den juristischen Tatbestand des nachgewiesenen Ehebruchs einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sachlich-rechtliche Formulierung »Weisung für Eifersuchtsfälle« bildet den hebräischen Plural verständlich ab. Die Fußnoten bewahren die ungewöhnliche Ausgangsform und das Bild des Abweichens.
