source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: de
  text: 'Rede zu den Israeliten: Wenn ein Mann oder eine Frau irgendeine der Sünden begeht, die Menschen begehen[a], und dabei dem HERRN die Treue bricht, wird diese Person schuldig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „irgendeine von allen Sünden des Menschen“. „Mensch“ ist hier generisch und bezeichnet Menschen allgemein.'
    reason: Der hebräische Ausdruck ist generisch. Die Fußnote dokumentiert die formnähere Wiedergabe, ohne die im Deutschen weniger natürliche Haupttextformulierung zu erzwingen.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ wird in der göttlichen Anredeformel knapp und würdig mit „Rede“ wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche deutsche Volksbezeichnung gibt die gemeinte Gemeinschaft präzise wieder; das wörtliche „Söhne Israels“ könnte im heutigen Deutsch fälschlich nur männliche Personen bezeichnen.
- source_word: אִישׁ אֽוֹ אִשָּׁה
  choice: ein Mann oder eine Frau
  rationale: Die ausdrücklich genannte männliche und weibliche Person wird im Deutschen vollständig bewahrt.
- source_word: כִּי יַעֲשׂוּ
  choice: Wenn ... begeht
  rationale: „Wenn“ entspricht dem kasuistischen Rechtsstil. Der hebräische Plural steht distributiv nach „ein Mann oder eine Frau“ und wird idiomatisch im Singular wiedergegeben.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: irgendeine menschliche Sünde
  rationale: אָדָם bezeichnet hier die Menschheit allgemein, nicht einen Mann im Unterschied zu einer Frau. „Menschliche Sünde“ erhält diesen generischen Sinn in natürlichem Deutsch.
- source_word: לִמְעֹל מַעַל
  choice: dadurch ... die Treue bricht
  rationale: Die Verbindung aus Infinitiv und stammverwandtem Substantiv bezeichnet einen schweren Treuebruch. Die deutsche Formulierung macht zugleich den Zusammenhang zwischen menschlicher Verfehlung und Untreue gegenüber Gott deutlich.
- source_word: בַּיהוָה
  choice: dem HERRN
  rationale: Die Präposition bezeichnet bei מעל die Person, der gegenüber Treue gebrochen wird. Der Gottesname wird nach ehrwürdiger deutscher Bibelkonvention als „HERR“ wiedergegeben.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: wird dieser Mensch schuldig
  rationale: נפש meint hier die betreffende Person, nicht technisch eine vom Körper getrennte Seele. Das Verb beschreibt ihren Eintritt in den Schuldzustand.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: „HERR“ folgt der etablierten jüdischen Lesetradition und der verbreiteten deutschen Bibelkonvention, ohne eine unsichere Rekonstruktion der Aussprache in den Haupttext zu setzen.
- issue: Generischer Sinn von הָאָדָם
  choice: menschlich
  alternative: des Menschen / der Menschheit
  rationale: Der Ausdruck umfasst Menschen allgemein. Die gewählte Form wahrt diesen Umfang und vermeidet eine irreführende Beschränkung auf Männer.
- issue: Verhältnis der Sünde zum Treuebruch gegenüber Gott
  choice: und dadurch dem HERRN die Treue bricht
  alternative: um dem HERRN untreu zu werden
  rationale: Der hebräische Infinitiv kann als Ergebnis beziehungsweise nähere Bestimmung der Tat verstanden werden. „Dadurch“ bewahrt den Gedanken, dass die zwischenmenschliche Verfehlung zugleich Untreue gegenüber dem HERRN ist, ohne eine Absicht des Täters vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Rechtssatz bleibt knapp; „die Treue brechen“ vermittelt den Bundes- und Beziehungsaspekt von מעל verständlich, ohne altertümliches Fachvokabular.
