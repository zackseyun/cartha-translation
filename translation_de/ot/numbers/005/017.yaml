source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: de
  text: Dann soll der Priester heiliges Wasser[a] in ein Tongefäß[b] nehmen. Danach soll er etwas von dem Staub nehmen, der auf dem Boden[c] der Stiftshütte liegt, und ihn in das Wasser geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „geheiligtes Wasser“. Das Hebräische bezeichnet Wasser, das für den heiligen rituellen Gebrauch ausgesondert ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ein Gefäß aus Ton“ oder „ein irdenes Gefäß“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „auf dem Erdboden“. Das hebräische Wort kann sowohl die Bodenfläche als auch den Erdboden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: heiliges Wasser
  rationale: Die Wendung bezeichnet unmittelbar Wasser, das für einen heiligen beziehungsweise rituellen Gebrauch bestimmt ist. Die geläufige deutsche Formulierung bleibt trotz möglicher späterer kirchlicher Assoziationen sachlich passend.
- source_word: בִּכְלִי חָרֶשׂ
  choice: in ein Tongefäß
  rationale: כְּלִי bezeichnet ein Gefäß, חָרֶשׂ Ton beziehungsweise Töpferware. „Tongefäß“ ist im heutigen Deutsch natürlich und bewahrt die Materialangabe.
- source_word: מִן הֶעָפָר
  choice: etwas von dem Staub
  rationale: עָפָר kann Staub, trockene Erde oder lockeren Boden bezeichnen. מִן ist hier partitiv; der Priester nimmt nur einen Teil davon.
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: auf dem Boden der Stiftshütte
  rationale: קַרְקַע bezeichnet die Bodenfläche beziehungsweise den Erdboden. Im Inneren der Stiftshütte ist „Boden“ die natürliche, zugleich nicht unnötig präzisierende Wiedergabe.
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: soll ... nehmen ... soll ... nehmen ... und ... geben
  rationale: Die Formen stehen in einer rituellen Verfahrensanweisung. „Soll“ gibt den vorgeschriebenen Handlungsablauf im modernen Deutschen angemessen wieder; נָתַן אֶל wird hier idiomatisch mit „in ... geben“ übersetzt.
- source_word: הַמִּשְׁכָּן
  choice: Stiftshütte
  rationale: „Stiftshütte“ ist die etablierte deutsche Bezeichnung für das tragbare Heiligtum und in diesem kultischen Zusammenhang verständlich.
