  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: de
  text: Dann soll der Priester das Eifersuchts-Speiseopfer aus der Hand der Frau nehmen, das Speiseopfer vor Jahwe schwingen und es an den Altar heranbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll … nehmen
  rationale: Das Waw mit Qatal führt die vorgeschriebene rituelle Handlungsfolge fort; „Dann soll“ gibt den nächsten Verfahrensschritt im Deutschen natürlich wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Bezeichnung des kultischen Amtsträgers; der bestimmte Artikel bleibt erhalten.
- source_word: מִיַּד הָאִשָּׁה
  choice: aus der Hand der Frau
  rationale: Die konkrete hebräische Wendung bezeichnet die unmittelbare Übergabe durch die Frau und lässt sich im Deutschen ebenso idiomatisch ausdrücken.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: das Eifersuchts-Speiseopfer
  rationale: מִנְחָה bezeichnet hier ein Speiseopfer; das Bestimmungswort „Eifersuchts-“ bewahrt die ritualbezogene Genitivverbindung knapp und verständlich.
- source_word: וְהֵנִיף
  choice: schwingen
  rationale: Der Hifil von נוף bezeichnet im Opferkontext die rituelle Schwingbewegung. „Schwingen“ wahrt die kultische Handlung, ohne sie ausdeutend zu umschreiben.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: Die Wiederholung bewahrt die genaue Opferkategorie und die lexikalische Kohärenz des Hebräischen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ gibt die feste kultische Wendung לִפְנֵי knapp und natürlich wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: und es an den Altar heranbringen
  rationale: Der Hifil von קרב trägt die Bedeutung „nahebringen/heranbringen“. Die Formulierung erhält diese kultische Nuance und das Ziel אֶל הַמִּזְבֵּחַ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen im modernen Standarddeutsch transparent wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִנְחַת הַקְּנָאֹת
  choice: Eifersuchts-Speiseopfer
  alternative: Speiseopfer der Eifersucht; Eifersuchtsopfer
  rationale: Die gewählte Form bewahrt sowohl die besondere Opferart מִנְחָה als auch den Bezug zur Eifersucht, ohne den Genitiv theologisch weiter festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Verfahrenssprache. Die Satzstruktur bleibt nahe an der dreiteiligen rituellen Abfolge des Hebräischen. Keine Fußnote ist erforderlich.
