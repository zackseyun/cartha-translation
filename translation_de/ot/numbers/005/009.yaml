  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: de
  text: Und jede Abgabe von allen heiligen Gaben[a] der Söhne Israels[b], die die Söhne Israels dem Priester darbringen[c], soll ihm gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heiligen Dingen“ oder „geweihten Gaben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Israeliten“ oder „Kinder Israels“. Wörtlich steht im Hebräischen „Söhne Israels“.'
    reason: lexical_alternative
  - marker: c
    text: Das Verb kann in Opferzusammenhängen auch mit „heranbringen“ oder „präsentieren“ wiedergegeben werden; wörtlich bezeichnet es ein Näherbringen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: Abgabe
  rationale: Das Wort bezeichnet eine ausgesonderte und übergebene Gabe, häufig einen dem Priester zustehenden Anteil. „Abgabe“ ist gegenwärtig und verständlich, ohne den hier nicht ausdrücklich genannten Ritus eines „Hebopfers“ vorauszusetzen.
- source_word: קָדְשֵׁי
  choice: heilige Gaben
  rationale: Der konstruktus-plurale Ausdruck bezeichnet geheiligte Dinge beziehungsweise Gaben. „Heilige Gaben“ ist im kultischen Zusammenhang natürlich und bewahrt den Gedanken ihrer Weihe.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Die Wiedergabe erhält die familiäre und grammatisch maskuline Ausdrucksweise des Hebräischen; die geläufigere ethnische Bezeichnung „Israeliten“ bleibt als Alternative in der Fußnote genannt.
- source_word: יַקְרִיבוּ
  choice: darbringen
  rationale: Der Hifil von קרב bedeutet im kultischen Zusammenhang, etwas heranzubringen beziehungsweise zu präsentieren. „Darbringen“ gibt diese kultische Nuance in natürlichem Deutsch wieder.
- source_word: לַכֹּהֵן
  choice: dem Priester
  rationale: Der Priester ist der Empfänger der dargebrachten Gabe. Der deutsche Dativ gibt die hebräische Präpositionalverbindung idiomatisch wieder.
- source_word: לוֹ יִהְיֶה
  choice: soll ihm gehören
  rationale: Die Wendung bezeichnet rechtlichen Besitz. „Soll ihm gehören“ ist im Deutschen klarer und natürlicher als das formal nähere „soll sein sein“.
theological_decisions:
- issue: Bezeichnung der Bundesgemeinschaft בְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Kinder Israels
  rationale: Die hebräische Verwandtschaftsbezeichnung wird bewahrt, ohne sie zu einer rein ethnischen Bezeichnung zu glätten. Eine besondere Lehrentscheidung ist damit nicht verbunden.
- issue: Reichweite von „ihm gehören“
  choice: Der jeweilige dem Priester dargebrachte heilige Anteil gehört ihm
  alternative: Alle heiligen Dinge gehören unterschiedslos dem Priester
  rationale: Die Syntax verbindet den Besitzanspruch mit der Abgabe, die aus den heiligen Gaben dargebracht wird. Die Übersetzung erweitert diesen Anspruch nicht über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Abgabe“ vermeidet das altertümlich-technische „Hebopfer“, während „darbringen“ den kultischen Zusammenhang erkennen lässt. Die rechtliche Schlussformel wird idiomatisch mit „soll ihm gehören“ wiedergegeben.
