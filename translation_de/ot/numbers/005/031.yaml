  text: וְ/נִקָּ֥ה הָ/אִ֖ישׁ מֵ/עָוֺ֑ן וְ/הָ/אִשָּׁ֣ה הַ/הִ֔וא תִּשָּׂ֖א אֶת עֲוֺנָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: de
  text: Dann wird der Mann[a] frei von Schuld sein; jene Frau aber wird ihre Schuld tragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Ehemann“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird die Folgen ihrer Schuld tragen“. Die hebräische Wendung kann sowohl das Tragen der Schuld als auch ihrer Folgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: wird … frei … sein
  rationale: Das Nifal von נקה bezeichnet hier das Freisein von Schuld oder Haftung. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt zusammen mit מִן die Bedeutung „frei von“.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: אִישׁ bedeutet formal „Mann“; im Zusammenhang ist der Ehemann gemeint. Der Haupttext bleibt nah am Wortlaut, während die kontextuelle Alternative in einer Fußnote genannt wird.
- source_word: מֵעָוֺן
  choice: von Schuld
  rationale: עָוֹן kann Vergehen, Schuld und die daraus erwachsende Haftung oder Folge bezeichnen. In Verbindung mit נקה gibt „von Schuld frei“ den rechtlich-moralischen Sinn knapp wieder.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: jene Frau aber
  rationale: הַהִוא wird durch „jene“ wiedergegeben. Das nachgestellte „aber“ macht den im ו liegenden sachlichen Gegensatz zum Freisein des Mannes in natürlichem Deutsch sichtbar.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: wird ihre Schuld tragen
  rationale: Die feste Verbindung נשׂא עָוֹן wird idiomnah mit „Schuld tragen“ übersetzt. Sie kann zugleich das Tragen der aus der Schuld entstehenden Folgen einschließen, ohne dass dies im Haupttext vereindeutigt wird.
theological_decisions:
- issue: Bedeutung von עָוֹן in beiden Satzteilen
  choice: In beiden Fällen „Schuld“, um die rechtlich-moralische Entsprechung zwischen dem Freisein des Mannes und dem Tragen der Schuld durch die Frau zu erhalten.
  alternative: „Vergehen“ beziehungsweise „Strafe/Folgen des Vergehens“
  rationale: Das hebräische Wort umfasst Tat, Schuld und mögliche Folgen. Die einheitliche Wiedergabe mit „Schuld“ bewahrt die Parallelität und lässt beim Ausdruck „Schuld tragen“ offen, in welchem Maß auch die Folgen gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „jene Frau aber“ wahrt den betonten Gegensatz, ohne unnötig juristische oder konfessionell geprägte Sprache einzuführen.
