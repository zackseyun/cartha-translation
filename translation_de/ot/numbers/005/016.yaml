base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: de
  text: Dann soll der Priester sie heranführen und sie vor Jahwe[a] hinstellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH. Traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: Dann soll … sie heranführen
  rationale: Das Hifil von קרב bedeutet hier, jemanden heranzubringen oder vorzuführen. „Heranführen“ bewahrt den räumlichen Sinn und vermeidet, die Frau sprachlich als Opfergabe darzustellen.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachgerechte Wiedergabe von כֹּהֵן im kultisch-rechtlichen Zusammenhang.
- source_word: וְהֶעֱמִדָהּ
  choice: und sie … hinstellen
  rationale: 'Das Hifil von עמד hat kausative Bedeutung: Der Priester veranlasst, dass die Frau dort steht. „Sie hinstellen“ ist im modernen Deutsch natürlich und erhält diesen Sinn.'
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier die Stellung in der Gegenwart Jahwes; „vor“ ist knapp, idiomatisch und in diesem Kontext eindeutig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm JHWH. Die Übersetzung „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Rechtstext, während „heranführen“ und „hinstellen“ natürlich verständlich sind.
