  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: de
  text: Dann sollen sie die Sünde bekennen, die sie begangen haben. Der Schuldige soll den geschuldeten Betrag vollständig erstatten, ein Fünftel hinzufügen[a] und alles dem geben, dem gegenüber er schuldig geworden ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Zusätzlich zum vollständig erstatteten Grundbetrag waren zwanzig Prozent zu zahlen.'
    reason: clarification
  - marker: b
    text: 'Oder idiomatischer: „dem, den er geschädigt hat“. Wörtlich bezeichnet das Hebräische den Empfänger als denjenigen, dem gegenüber der Täter schuldig geworden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Dann sollen sie … bekennen
  rationale: Der Hitpael von ידה bezeichnet hier das offene Eingestehen einer Verfehlung. „Sollen“ wahrt den rechtlich-vorschreibenden Charakter; „dann“ gibt die Abfolge im Zusammenhang wieder.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: die Sünde, die sie begangen haben
  rationale: חַטָּאת bezeichnet hier die begangene Sünde beziehungsweise Verfehlung; mit „Sünde begehen“ wird עשה im Deutschen idiomatisch wiedergegeben.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: den geschuldeten Betrag vollständig erstatten
  rationale: שוב im Hifil bezeichnet in diesem Zusammenhang Rückgabe oder Erstattung. אָשָׁם meint hier die aus der Schuld erwachsene Ersatzpflicht, während בְּרֹאשׁוֹ den Haupt- beziehungsweise Grundbetrag bezeichnet. Die Formulierung macht deutlich, dass kein Schuldopfer gemeint ist.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: ein Fünftel hinzufügen
  rationale: Die Wendung verlangt einen Zuschlag von einem Fünftel zum vollständig erstatteten Grundbetrag.
- source_word: וְנָתַן
  choice: und alles … geben
  rationale: נתן bezeichnet die konkrete Übergabe. „Alles“ verdeutlicht, dass sowohl der Grundbetrag als auch der Zuschlag übergeben werden, ohne den Sinn zu erweitern.
- source_word: לַאֲשֶׁר אָשַׁם לוֹ
  choice: dem, dem gegenüber er schuldig geworden ist
  rationale: Die relativische Formulierung bewahrt den hebräischen Bezug auf Schuld und Haftung. Gemeint ist die geschädigte Person, ohne dies lediglich paraphrasierend wiederzugeben.
theological_decisions:
- issue: Bedeutung von אָשָׁם im Zusammenhang der Wiedergutmachung
  choice: Schuld beziehungsweise daraus entstandene Ersatzpflicht, konkret der geschuldete Betrag
  alternative: Schuldopfer
  rationale: Der unmittelbare Zusammenhang spricht von vollständiger Erstattung, einem zusätzlichen Fünftel und der Übergabe an die geschädigte Person. Daher bezeichnet אָשָׁם hier nicht das Opfer, sondern die aus der Schuld folgende materielle Ersatzleistung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Numeruswechsel des Hebräischen von „sie“ beim Bekenntnis zu „er“ bei der Erstattung wird durch „der Schuldige“ verständlich gemacht, ohne die rechtliche Einzelverantwortung aufzulösen. Die Übersetzung wahrt die Schuldterminologie, erläutert aber den wirtschaftlich-rechtlichen Sinn von אָשָׁם im Haupttext.
