translation:
  language: de
  text: Die heiligen Gaben jedes Mannes sollen ihm gehören[a]; was ein Mann dem Priester gibt, soll ihm gehören[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die heiligen Dinge jedes Mannes sollen ihm gehören.« Das abschließende »ihm« wird häufig auf den jeweiligen Mann bezogen; im Zusammenhang mit den priesterlichen Abgaben wird auch ein Bezug auf den Priester erwogen.'
    reason: lexical_alternative_and_ambiguity
  - marker: b
    text: 'Wörtlich: »soll ihm gehören«. Wegen des unmittelbaren Zusammenhangs mit dem Priester wird »ihm« gewöhnlich auf den Priester bezogen.'
    reason: pronoun_reference
lexical_decisions:
- source_word: אִישׁ
  choice: jeder Mann / ein Mann
  rationale: Das maskuline Singularnomen wird in diesem Rechtssatz zunächst distributiv und danach allgemein gebraucht. Die Wiedergabe wahrt die konkrete grammatische Form des Hebräischen.
- source_word: קֳדָשָׁיו
  choice: seine heiligen Gaben
  rationale: Der Ausdruck bezeichnet hier Dinge, die als heilige Abgaben oder Opfer ausgesondert sind. »Heilige Gaben« ist im Deutschen natürlich und vermittelt den kultischen Sinn.
- source_word: לוֹ יִהְיוּ
  choice: gehören ihm
  rationale: Die Konstruktion drückt Besitz oder Zugehörigkeit aus. »Gehören ihm« gibt dies in natürlichem Deutsch wieder, ohne ein zeitliches »bleiben« hinzuzufügen.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: was ein Mann dem Priester gibt
  rationale: Der Relativsatz hat verallgemeinernde rechtliche Geltung. Die Formulierung ist knapp und bewahrt den bestimmten Singular »dem Priester«.
- source_word: לוֹ יִהְיֶה
  choice: gehört diesem
  rationale: Die zweite Besitzformel bezieht sich im unmittelbaren Satzbau auf den Priester. Das Demonstrativpronomen macht den Bezug im Deutschen verständlich, während eine Fußnote die knappe hebräische Form ausweist.
theological_decisions:
- issue: Bezug der ersten Besitzangabe לוֹ יִהְיוּ
  choice: »ihm« wird im Haupttext auf den jeweiligen Mann bezogen
  alternative: Bezug auf den Priester
  rationale: Der nächstliegende grammatische Bezug ist אִישׁ, doch der Zusammenhang mit priesterlichen Abgaben lässt eine andere Deutung zu. Die Spannung wird nicht dogmatisch entschieden; die mögliche Alternative wird in der Fußnote genannt.
- issue: Bezug der letzten Besitzangabe לוֹ יִהְיֶה
  choice: expliziter Bezug auf den Priester durch »diesem«
  alternative: 'wörtlich und mehrdeutig: »gehört ihm«'
  rationale: Der Priester ist der unmittelbar vorausgehende Empfänger; daher ist dieser Bezug syntaktisch am wahrscheinlichsten. Die Fußnote dokumentiert die Pronomenform des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Rechtssprache. Die parallelen Besitzformulierungen des Hebräischen werden inhaltlich bewahrt; echte Bezugsambiguität wird durch Fußnoten sichtbar gemacht.
