  to: Wenn du aber deinem Mann untreu geworden bist[a], obwohl du an ihn gebunden warst[b], und dich verunreinigt hast und ein Mann außer deinem Mann mit dir geschlechtlich verkehrt hat[c] —
  rationale: Die Revision stellt die drei hebräischen Aussageglieder wieder nebengeordnet dar, glättet die ausschließende Wendung für modernes Deutsch und präzisiert die Fußnote zur hebräischen Euphemie. Der offene Gedankenstrich bleibt erhalten, da der Satz im folgenden Vers weitergeführt wird.
