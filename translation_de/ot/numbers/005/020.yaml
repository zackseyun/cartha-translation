  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: eheliche Untreue, die kultisch-rechtliche Verunreinigung und Geschlechtsverkehr eines Mannes außerhalb der Ehe mit dem Ehemann. Die mit „indem“ gebildete Unterordnung verschiebt jedoch die hebräische Reihung unabhängiger Aussageglieder und kann den Geschlechtsverkehr fälschlich als bloße Art und Weise der Verunreinigung darstellen.'
  naturalness: Modernes Standarddeutsch und der gewählte sachliche Registerton sind weitgehend gelungen. „Ein anderer Mann als dein Mann“ ist jedoch unnötig schwerfällig; „ein Mann außer deinem Mann“ gibt den Ausschluss idiomatischer wieder. Die koordinierende Satzfügung ist zudem dem offenen hebräischen Satzanschluss näher.
  terminology: „Untreu geworden“, „an ihn gebunden“, „verunreinigt“ und „geschlechtlich verkehrt“ sind im Kontext tragfähige Wiedergaben. Die Fußnote zur sexuellen Umschreibung sollte „bei/mit dir“ statt des zu körperlich-lokalisierenden „in dich“ sagen; בָּךְ gehört zur idiomatischen Wendung und bedeutet hier nicht ausdrücklich „in dich“.
