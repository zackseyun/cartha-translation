  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: de
  text: Wenn du aber deinem Mann untreu geworden bist[a], obwohl du an ihn gebunden warst[b], und dich verunreinigt hast und ein Mann außer deinem Mann mit dir geschlechtlich verkehrt hat[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „abgeirrt bist“. Das hebräische Verb beschreibt Untreue mit dem Bild des Abweichens vom richtigen Weg.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier „unter deinem Mann“. Gemeint ist das bestehende Eheverhältnis.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich etwa: „ein Mann sein Beilager bei dir gegeben hat“; eine hebräische Umschreibung für Geschlechtsverkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: untreu geworden bist
  rationale: Das Verb bezeichnet hier ein Abweichen von der ehelichen Treue. Die Wendung gibt im modernen Deutschen den kontextuellen Sinn klar wieder; das Bild des Abirrens bleibt in der Fußnote sichtbar.
- source_word: תַּחַת אִישֵׁךְ
  choice: obwohl du an ihn gebunden warst
  rationale: Wörtliches „unter deinem Mann“ wäre im heutigen Deutschen missverständlich. Die Formulierung bewahrt den Bezug auf das bestehende Eheverhältnis, ohne eine weitergehende Herrschaftsaussage einzutragen.
- source_word: נִטְמֵאת
  choice: dich verunreinigt hast
  rationale: Das Nifal von טמא trägt hier eine rechtlich-rituelle Bedeutung im Zusammenhang mit sexuellem Fehlverhalten. „Verunreinigt“ bewahrt diese Kategorie besser als eine rein moralische Umschreibung.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: ein Mann mit dir geschlechtlich verkehrt hat
  rationale: Die hebräische euphemistische Wendung bezeichnet Geschlechtsverkehr. Die deutsche Fassung ist eindeutig, sachlich und nicht unnötig derb.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: ein anderer Mann als dein Mann
  rationale: Die Formulierung bringt den ausschließenden Sinn von מִבַּלְעֲדֵי klar zum Ausdruck und hält den Ehemann als Bezugspunkt ausdrücklich fest.
theological_decisions:
- issue: Wiedergabe der ehelichen Untreue, ohne den hebräischen Text moralisch oder lehrmäßig auszubauen
  choice: „deinem Mann untreu geworden“ im Haupttext, mit Hinweis auf das Bild des Abirrens in der Fußnote
  alternative: „von deinem Mann abgeirrt“ oder wörtlich „unter deinem Mann abgeirrt“
  rationale: Die gewählte Fassung vermittelt den im Kontext eindeutigen Sinn natürlich. Zugleich dokumentiert die Fußnote die bildhafte Ausdrucksweise und verhindert, dass ihre Nuance verloren geht.
- issue: Bedeutung von תַּחַת im ehelichen Zusammenhang
  choice: „obwohl du an ihn gebunden warst“
  alternative: „während du unter deinem Mann warst“
  rationale: Die Alternative wäre formal näher, könnte im modernen Deutschen aber als bloße räumliche oder pauschal hierarchische Aussage missverstanden werden. Die gewählte Fassung bezeichnet nüchtern den bestehenden ehelichen Bund.
- issue: Explizitheit der sexuellen Euphemie
  choice: „mit dir geschlechtlich verkehrt hat“
  alternative: „bei dir gelegen hat“
  rationale: Die klare, zurückhaltende Formulierung überträgt den gemeinten Vorgang, ohne zusätzliche Einzelheiten oder eine konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Der Vers bleibt wie im Hebräischen syntaktisch offen und endet deshalb mit einem Gedankenstrich; die Fortsetzung folgt im nächsten Vers. Die rechtlich-rituelle Sprache wird bewahrt, während missverständliche hebräische Idiome im Haupttext behutsam verdeutlicht und in den Fußnoten dokumentiert werden.
