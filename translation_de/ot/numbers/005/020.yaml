    rationale: Die hebräische Konstruktion ist eine Umschreibung für Geschlechtsverkehr; eine deutsche wörtliche Annäherung mit „bei dir“ bzw. „mit dir“ vermeidet eine überpräzise körperliche Lokalisierung.
