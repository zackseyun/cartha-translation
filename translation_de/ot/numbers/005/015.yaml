  to: 'Dann soll der Mann seine Frau zum Priester bringen und ihre Opfergabe für sie darbringen: ein Zehntel eines Efa Gerstenmehl. Er soll weder Öl darauf gießen noch Weihrauch darauflegen; denn es ist ein Speiseopfer der Eifersucht, ein Erinnerungsopfer, das Schuld[a] in Erinnerung bringt.'
