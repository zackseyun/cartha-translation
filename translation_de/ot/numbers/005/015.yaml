source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: de
  text: 'Dann soll der Mann seine Frau zum Priester bringen und ihre Opfergabe für sie darbringen: ein Zehntel eines Efa Gerstenmehl. Er soll weder Öl darauf gießen noch Weihrauch darauflegen; denn es ist ein Speiseopfer der Eifersucht, ein Erinnerungsopfer, das Schuld[a] in Erinnerung bringt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann eine Verfehlung, die daraus entstehende Schuld oder die dafür bestehende Strafhaftung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת־אִשְׁתּוֹ
  choice: Dann soll der Mann seine Frau … bringen
  rationale: Die injunktive Form wird im deutschen Rechtssatz natürlich mit „soll“ wiedergegeben. „Der Mann“ bewahrt den Wortlaut; „seine Frau“ verdeutlicht den ehelichen Zusammenhang.
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: für sie ihre Opfergabe darbringen
  rationale: Das feminine Suffix wird mit „ihre“ bewahrt; עָלֶיהָ bezeichnet hier die Beziehung beziehungsweise das Handeln für sie.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: ein Zehntel Efa
  rationale: Die antike Maßeinheit wird transliteriert und nicht durch eine unsichere moderne Umrechnung ersetzt.
- source_word: קֶמַח שְׂעֹרִים
  choice: Gerstenmehl
  rationale: Natürliche deutsche Wiedergabe der Constructusverbindung; קֶמַח bezeichnet Mehl.
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: Er darf kein Öl darauf gießen und keinen Weihrauch darauflegen
  rationale: Die Verbote werden in modernem Deutsch mit „darf … kein“ ausgedrückt. לְבֹנָה bezeichnet das als Räucherstoff verwendete Weihrauchharz.
- source_word: מִנְחַת קְנָאֹת
  choice: ein Speiseopfer der Eifersucht
  rationale: מִנְחָה ist im priesterlichen Opferkontext ein Speiseopfer; „Eifersucht“ lässt den weiten Sinn von קְנָאֹת stehen, ohne Schuld oder Unschuld vorwegzunehmen.
- source_word: מִנְחַת זִכָּרוֹן מַזְכֶּרֶת עָוֹן
  choice: ein Erinnerungsopfer, das Schuld in Erinnerung bringt
  rationale: Die Wortverwandtschaft von זִכָּרוֹן und מַזְכֶּרֶת wird im Deutschen erkennbar gehalten. „Schuld“ kann sowohl Verfehlung als auch daraus erwachsende Schuldhaftigkeit bezeichnen.
theological_decisions:
- issue: Ob die Opferbezeichnung die Schuld der Frau bereits voraussetzt
  choice: Die Funktion des Opfers wird beschrieben, ohne ein Urteil über Schuld oder Unschuld vorwegzunehmen.
  alternative: Die Formulierung ausdrücklich auf die bereits feststehende Verfehlung der Frau beziehen.
  rationale: Der Vers nennt das Opfer „Erinnerungsopfer“ und verbindet es mit עָוֹן, entscheidet an dieser Stelle jedoch nicht über den Ausgang des Verfahrens.
- issue: Bedeutungsumfang von עָוֹן
  choice: Schuld
  alternative: Vergehen / Sünde / Strafschuld
  rationale: „Schuld“ bewahrt im Deutschen am ehesten die mögliche Spannung zwischen Verfehlung, Schuldzustand und Haftung für eine Verfehlung; die Fußnote weist auf diesen Umfang hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. „Efa“ bleibt als antike Maßeinheit stehen. „Speiseopfer“ ist der verständliche etablierte Kultbegriff; die syntaktische und theologische Spannung des Schlusses wird nicht aufgelöst.
