  terminology: „Priester“, „Opfergabe“, „Gerstenmehl“, „Weihrauch“, „Speiseopfer“, „Eifersucht“ und „Erinnerungsopfer“ sind sachgerecht. „Schuld“ lässt die im Hebräischen mögliche Bandbreite von Verfehlung, Schuld und daraus folgender Haftung offen; die Fußnote erläutert dies angemessen.
