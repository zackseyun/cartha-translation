base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/005.yaml
  text: And Yahweh spoke to Moses, saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol von דבר eröffnet eine neue göttliche Rede; „sprach“ entspricht der gehobenen, aber allgemein verständlichen deutschen Erzählformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Fügung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Rede einleitende Infinitiv wird im heutigen Deutsch idiomatisch durch einen Doppelpunkt dargestellt, weil der Inhalt im folgenden Vers einsetzt; ein zusätzliches „und sagte“ wäre schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen; „Jehova“ beruht auf einer späteren Mischlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Einleitungsformel wird natürlich wiedergegeben; der Doppelpunkt signalisiert die unmittelbar folgende Rede.
