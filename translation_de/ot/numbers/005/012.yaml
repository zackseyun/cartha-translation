id: NUM.5.12
reference: Numbers 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֥ישׁ אִישׁ֙ כִּֽי תִשְׂטֶ֣ה אִשְׁתּ֔/וֹ וּ/מָעֲלָ֥ה ב֖/וֹ מָֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: de
  text: 'Rede zu den Israeliten[a] und sage zu ihnen: Wenn die Frau eines Mannes vom rechten Weg abweicht und ihm die Treue bricht[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“. Gemeint sind die Israeliten als Volk.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische verwendet hier ein Verb und ein stammverwandtes Substantiv und betont so den Treuebruch.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Imperativ leitet die göttliche Weisung an Mose ein; „Rede“ entspricht der üblichen feierlich-sachlichen Gesetzessprache.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung gibt den Bezug auf das Volk Israel klar und natürlich wieder; die wörtliche Form wird in einer Fußnote bewahrt.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sage zu ihnen
  rationale: Bewahrt die zweigliedrige Redeeinleitung und ihren formellen Ton.
- source_word: אִישׁ אִישׁ
  choice: eines Mannes
  rationale: Die Wiederholung hat distributive Bedeutung („irgendein/jeder Mann“); im deutschen Bedingungssatz wird dies natürlich durch die unbestimmte Form ausgedrückt.
- source_word: כִּי
  choice: Wenn
  rationale: In dieser kasuistischen Rechtsbestimmung führt כִּי einen möglichen Fall ein.
- source_word: תִשְׂטֶה
  choice: vom rechten Weg abweicht
  rationale: Bewahrt das bildhafte Abweichen, ohne die Art des Vergehens vorwegzunehmen; der Zusammenhang wird durch den folgenden Ausdruck präzisiert.
- source_word: אִשְׁתּוֹ
  choice: die Frau eines Mannes
  rationale: אִשָּׁה bezeichnet hier aufgrund des Possessivsuffixes und des ehelichen Zusammenhangs die Ehefrau; die deutsche Genitivfügung gibt die Zugehörigkeit natürlich wieder.
- source_word: וּמָעֲלָה ... מָעַל
  choice: die Treue bricht
  rationale: Die deutsche Wendung gibt den relationalen Verrat natürlich und nachdrücklich wieder. Die hebräische Verbindung aus stammverwandtem Verb und Substantiv wird in der Fußnote erläutert.
- source_word: בּוֹ
  choice: ihm
  rationale: Der Ehemann ist der von dem Treuebruch Betroffene; der deutsche Dativ in „ihm die Treue brechen“ drückt dies idiomatisch aus.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung des Bundesvolkes
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische Wendung ist formal maskulin und wörtlich „Söhne Israels“, bezeichnet hier jedoch idiomatisch das Volk Israel. Der Haupttext verwendet verständliches Standarddeutsch, während die wörtliche Form in der Fußnote sichtbar bleibt.
- issue: Charakter des ehelichen Vergehens
  choice: ihm die Treue bricht
  alternative: einen Treuebruch gegen ihn begeht
  rationale: Die Formulierung bezeichnet eheliche Untreue, ohne über den Vers hinaus Einzelheiten festzulegen. Zugleich hält sie den relationalen und moralischen Ernst des hebräischen Ausdrucks fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der für Gesetzestexte passenden direkten Anrede. Die Satzstruktur bleibt nahe am Hebräischen, vermeidet jedoch unnatürliche deutsche Wiederholungen.
