  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: de
  text: Dann soll der Priester die Frau vor Yahweh stellen, ihr Haar lösen[a] und ihr das Speiseopfer der Erinnerung in die Hände legen – es ist ein Speiseopfer der Eifersucht –, während er das bittere, fluchbringende Wasser in der Hand hält[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Kopf entblößen“ beziehungsweise „ihr Haar offen hängen lassen“. Die hebräische Wendung nennt wörtlich den Kopf der Frau und kann hier das Lösen oder Freimachen ihres Haars im Rahmen des Rituals bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das bittere Wasser, das den Fluch bringt“. Das hebräische Partizip beschreibt das Wasser als einen Fluch bewirkend oder herbeiführend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: soll … stellen
  rationale: Der Hifil von עמד bezeichnet hier das Veranlassen zum Stehen beziehungsweise die förmliche Aufstellung im rituellen Rahmen. „Vor Yahweh stellen“ ist natürlich und bleibt nahe am konkreten Vorgang.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: Die kultische Wendung bezeichnet das Stehen in der Gegenwart Yahwehs; der Gottesname wird als „Yahweh“ wiedergegeben.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: ihr Haar lösen
  rationale: Die Wendung nennt wörtlich den Kopf der Frau; פרע kann das Freimachen beziehungsweise Lösen bezeichnen. Im Ritual dürfte das Aufbinden oder Offenlassen ihres Haars gemeint sein. Die Fußnote bewahrt die echte lexikalische Alternative „ihren Kopf entblößen“.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: ihr … in die Hände legen
  rationale: Wörtlich steht „auf ihre Handflächen“; „in die Hände legen“ gibt die konkrete Geste idiomatisch auf Deutsch wieder.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: das Erinnerungs-Speiseopfer
  rationale: מִנְחָה ist im priesterlichen Zusammenhang ein Speiseopfer; זִכָּרוֹן bezeichnet Erinnerung oder Gedenken. Das Kompositum bleibt knapp und transparent.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: es ist ein Speiseopfer der Eifersucht
  rationale: קְנָאֹת steht formal im Plural, kann hier aber abstrakt gebraucht sein. „Der Eifersucht“ wahrt die theologische Spannung, ohne festzulegen, wessen Eifersucht gemeint ist.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: In der Hand des Priesters aber soll … sein
  rationale: Die singularische Wendung „in der Hand“ wird beibehalten. „Aber“ markiert den begleitenden beziehungsweise gegenüberstellenden Charakter des Satzteils natürlich.
- source_word: מֵי הַמָּרִים
  choice: das bittere … Wasser
  rationale: Das Hebräische verwendet die formale Pluralbildung „Wasser von Bitterkeit“; im Deutschen ist „das bittere Wasser“ die natürliche Wiedergabe.
- source_word: הַמְאָרֲרִים
  choice: fluchbringende
  rationale: Das Partizip von ארר beschreibt das Wasser als einen Fluch bewirkend oder mitführend. „Fluchbringend“ ist knapp und erhält diese Wirksamkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR / Jahwe
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Yahweh“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Eifersucht in מִנְחַת קְנָאֹת
  choice: Speiseopfer der Eifersucht
  alternative: Eifersuchtsopfer
  rationale: Die Genitivform lässt offen, ob menschliche Eifersucht, göttlicher Eifer oder die gesamte Verdachtssituation im Vordergrund steht. Die gewählte Form löst diese Spannung nicht auf.
- issue: Wirkung des bitteren Wassers
  choice: fluchbringendes Wasser
  alternative: Wasser, das den Fluch bringt / das verfluchte Wasser
  rationale: Das aktive Partizip wird wirkungsbezogen wiedergegeben. „Verfluchtes Wasser“ könnte dagegen fälschlich nur einen Zustand des Wassers ausdrücken.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit erkennbar rituellem Ton. „Soll“ bildet die Vorschrift ab; konkrete Körper- und Opferterminologie bleibt erhalten. Der Gedankenstrich gliedert die Apposition, ohne den hebräischen Zusammenhang aufzubrechen.
