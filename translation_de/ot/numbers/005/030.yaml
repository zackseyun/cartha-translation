  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: de
  text: oder wenn ein Mann von einem Geist der Eifersucht erfasst wird[a] und auf seine Frau eifersüchtig ist, dann soll er die Frau vor Jahwe bringen, und der Priester soll an ihr diese ganze Weisung[b] ausführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn ein Geist der Eifersucht über ihn hinweggeht“; auch: „über ihn kommt“.'
    reason: lexical_alternative
  - marker: b
    text: Für „Weisung“ sind hier auch „Gesetz“, „Verfahren“ oder „Ritual“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: oder wenn
  rationale: Leitet die zweite Alternative des bereits zuvor begonnenen Rechtssatzes ein; „oder wenn“ gibt die disjunktive Funktion im Deutschen natürlich wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Entspricht dem allgemeinen hebräischen Ausdruck; dass er Ehemann ist, ergibt sich aus „seine Frau“.
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: von einem Geist der Eifersucht erfasst wird
  rationale: Gibt die bildhafte Wendung idiomatisch wieder, ohne festzulegen, ob eine innere Regung oder eine geistliche Macht gemeint ist.
- source_word: רוּחַ
  choice: Geist
  rationale: Bewahrt die Mehrdeutigkeit zwischen Geist, innerer Haltung und überwältigendem Impuls.
- source_word: קִנְאָה / וְקִנֵּא
  choice: Eifersucht / eifersüchtig ist
  rationale: Im Kontext vermuteter ehelicher Untreue ist „Eifersucht“ sachgerecht; die Wortwiederholung bildet die hebräische Stammverwandtschaft ab.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: Er soll die Frau vor Jahwe bringen
  rationale: Das Hifil von עמד bedeutet „hinstellen, vorführen, präsentieren“; „vor ... bringen“ ist für die formelle Vorstellung im Ritual natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im modernen deutschen Standard wieder.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: der Priester soll an ihr ... vollziehen
  rationale: „Vollziehen“ entspricht dem rituell-rechtlichen Zusammenhang und bewahrt mit „an ihr“ den Bezug von לָהּ.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: diese ganze Weisung
  rationale: תורה bezeichnet hier die vorgeschriebene Anweisung beziehungsweise Verfahrensordnung; „Weisung“ wahrt den weiteren Bedeutungsumfang besser als ausschließlich „Gesetz“.
theological_decisions:
- issue: Wesen des „Geistes der Eifersucht“
  choice: Die Formulierung „Geist der Eifersucht“ bleibt erhalten.
  alternative: Eifersuchtsanfall; eifersüchtiger Impuls
  rationale: Der hebräische Ausdruck kann eine überwältigende innere Regung bezeichnen, bestimmt aber keine dämonische oder göttliche Urheberschaft. Die Übersetzung wahrt diese Spannung.
- issue: Bedeutung von תּוֹרָה im Ritualzusammenhang
  choice: Weisung
  alternative: Gesetz; Verfahren; Ritual
  rationale: Der Vers verweist auf die gesamte zuvor angeordnete Handlung. „Weisung“ lässt sowohl den rechtlichen als auch den rituell-prozeduralen Sinn offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-rituellem Ton. Der Doppelpunkt gliedert den langen hebräischen Satz, ohne die inhaltliche Verbindung zu lösen. Alle Fußnotenmarker stehen im Haupttext.
