  yaml_path: translation/ot/numbers/005/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Waw-Konsekutiv mit דבר eröffnet eine neue göttliche Rede. „sprach“ ist in dieser Einleitungsformel präzise und im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Eigenname erhalten bleibt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu“ ist die idiomatische deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des Namens מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר kündigt den Inhalt der folgenden Rede an. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst und nicht einen Titel. „Jahwe“ bewahrt diese Unterscheidung; die traditionelle Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Doppelpunkt gibt die hebräische Redeeinleitungsformel לֵאמֹר idiomatisch wieder und verbindet den Vers unmittelbar mit der folgenden Rede.
