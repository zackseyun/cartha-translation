  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: de
  text: und ein Mann mit ihr schläft und dabei einen Samenerguss hat[a], es aber den Augen ihres Mannes verborgen bleibt und sie verborgen bleibt und unrein geworden ist, ohne dass es einen Zeugen gegen sie gibt[b], und sie nicht ertappt worden ist[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ein Liegen von Samen“; gemeint ist Geschlechtsverkehr mit Samenerguss.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Zeugen in ihrer Sache“ beziehungsweise „einen Zeugen, der sie betrifft“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „nicht gepackt worden ist“. Manche verstehen dies im Sinn von: „nicht überwältigt beziehungsweise nicht zum Geschlechtsverkehr gezwungen worden ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: und ein Mann mit ihr schläft
  rationale: Die feste Verbindung שׁכב את bezeichnet hier eindeutig Geschlechtsverkehr. „Mit ihr schläft“ ist im modernen Deutschen natürlich, klar und nicht unnötig derb.
- source_word: שִׁכְבַת זֶרַע
  choice: und dabei Samen ergießt
  rationale: Die Wendung bezeichnet wörtlich ein „Liegen/Samenlager des Samens“ und hebt den Samenerguss beim Geschlechtsverkehr hervor. Die Wiedergabe wahrt diese für das Reinheitsrecht bedeutsame Konkretheit.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: es aber den Augen ihres Mannes verborgen bleibt
  rationale: Bewahrt sowohl die passive Bedeutung von נעלם als auch das hebräische Bild „vor den Augen“, das auf die fehlende Kenntnis des Ehemanns zielt.
- source_word: וְנִסְתְּרָה
  choice: und sie im Verborgenen handelt
  rationale: Das Nifal kann ein verborgenes beziehungsweise heimliches Geschehen oder ein Sich-Verbergen ausdrücken. Die Formulierung ist natürlich und lässt offen, ob der Akzent auf ihrer Heimlichkeit oder dem unbemerkten Geschehen liegt.
- source_word: וְהִיא נִטְמָאָה
  choice: und unrein geworden ist
  rationale: „Unrein“ erhält die rechtlich-kultische Begrifflichkeit von טמא und vermeidet die stärker wertende Festlegung „geschändet“ oder „befleckt“.
- source_word: וְעֵד אֵין בָּהּ
  choice: ohne dass es einen Zeugen gegen sie gibt
  rationale: בָּהּ kann „gegen sie“ oder allgemeiner „in ihrer Sache/ihretwegen“ bedeuten. Im rechtlichen Zusammenhang ist „gegen sie“ idiomatisch; die weitere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: und sie nicht ertappt worden ist
  rationale: Im Zusammenhang fehlender Beweise bezeichnet נתפשׂ am ehesten das Ertappt- oder Gefasstwerden. Die mögliche Bedeutung „gepackt/überwältigt“ wird wegen ihrer Auswirkung auf die Frage nach Zwang nicht stillschweigend ausgeschlossen.
theological_decisions:
- issue: Reinheitssprache bei נִטְמָאָה
  choice: unrein geworden ist
  alternative: befleckt worden ist
  rationale: „Unrein“ wahrt die Kategorie des Reinheitsrechts und legt nicht über den Wortlaut hinaus fest, ob ausschließlich kultische, sittliche oder soziale Verunreinigung im Blick ist.
- issue: Bedeutung von לֹא נִתְפָּשָׂה
  choice: nicht ertappt worden ist
  alternative: nicht gepackt beziehungsweise nicht überwältigt worden ist
  rationale: Der unmittelbare Kontext von Verborgenheit und fehlenden Zeugen spricht für fehlende Entdeckung. Da das Verb auch ein Ergreifen bezeichnen kann und deshalb teils auf fehlenden Zwang bezogen wird, bleibt diese Spannung in der Fußnote sichtbar.
- issue: Subjekt und Nuance von וְנִסְתְּרָה
  choice: sie im Verborgenen handelt
  alternative: sie sich verborgen hat / die Sache verborgen blieb
  rationale: Die feminine Verbform bezieht sich grammatisch auf die Frau, doch das Nifal lässt passive und reflexive Nuancen zu. Die Hauptfassung vermeidet eine unnötig präzise Behauptung über ihre Absicht.
translation_notes:
  register: Moderner, würdiger Rechtstext in einem fortlaufenden Bedingungssatz. Die Formulierung bleibt konkret, ohne klinisch oder beschönigend zu werden. Der Gedankenstrich zeigt an, dass der Satz im folgenden Vers weitergeht.
