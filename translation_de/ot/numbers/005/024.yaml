base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: de
  text: Dann soll er die Frau das bittere, fluchbringende Wasser trinken lassen[a], und das fluchbringende Wasser wird in sie eindringen und ihr zur Bitterkeit werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Wasser der Bitterkeit, das Fluch bringt“. Im Hebräischen steht „Wasser“ in einer üblichen Pluralform.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, formaler: „und das fluchbringende Wasser wird bitter in sie eindringen“. Die hebräische Schlusswendung kann die Art des Eindringens oder dessen Ergebnis bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: Dann soll er … trinken lassen
  rationale: Der Hifil von שׁקה bezeichnet das Veranlassen oder Geben zu trinken. „trinken lassen“ gibt die kausative Bedeutung im Deutschen natürlich wieder.
- source_word: מֵי הַמָּרִים
  choice: das bittere … Wasser
  rationale: Die hebräische Konstruktverbindung bedeutet wörtlich „Wasser der Bitterkeit“. Der Singular „Wasser“ ist im Deutschen für den Stoff idiomatisch; „bitter“ bewahrt den Sinn.
- source_word: הַמְאָרֲרִים
  choice: fluchbringend
  rationale: Das Partizip von ארר beschreibt hier die Wirkung beziehungsweise Funktion des Wassers als Träger des Fluches, nicht zwingend das Wasser als selbst verflucht.
- source_word: וּבָאוּ בָהּ
  choice: wird in sie eindringen
  rationale: בוא mit ב bezeichnet das Hineingelangen in die Frau. „in sie eindringen“ ist verständlich und wahrt den körperbezogenen Ausdruck.
- source_word: לְמָרִים
  choice: Bitterkeit bewirken
  rationale: Die Wendung ist knapp und mehrdeutig; ל kann hier Ergebnis oder Wirkung bezeichnen. Die Übersetzung gibt diese resultative Bedeutung natürlich wieder, ohne eine konkrete körperliche Folge vorwegzunehmen.
theological_decisions:
- issue: Art der Fluchwirkung des Wassers
  choice: Das Wasser wird als „fluchbringend“ bezeichnet.
  alternative: „verfluchtes Wasser“
  rationale: 'Das Partizip lässt sich wirkungsbezogen verstehen: Das Wasser vermittelt im Ritual den Fluch. So wird weder eine magische Eigenkraft behauptet noch die gerichtliche Spannung des Textes abgeschwächt.'
- issue: Bedeutung des abschließenden לְמָרִים
  choice: „Bitterkeit bewirken“
  alternative: „bitter in sie eindringen“ oder „ihr zur Bitterkeit werden“
  rationale: Die hebräische Formulierung bleibt offen, ob die Bitterkeit die Art des Eindringens oder dessen Wirkung bezeichnet. Der Haupttext stellt die wahrscheinliche resultative Bedeutung dar; die Fußnote bewahrt die formalere Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „fluchbringendes Wasser“ entspricht der betonten Wiederholung im Hebräischen; die Fußnoten erhalten die Mehrdeutigkeit der Konstruktverbindung und des Schlussausdrucks.
