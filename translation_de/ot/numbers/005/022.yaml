base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: de
  text: 'Mögen diese fluchbringenden Wasser in dein Inneres eindringen, sodass dein Bauch anschwillt und dein Oberschenkel verkümmert.[a] Die Frau soll sagen: »Amen, amen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »sodass der Bauch anschwillt und der Oberschenkel fällt«. Die schwierige hebräische Wendung kann eine verhüllende Bezeichnung für eine Schädigung der Fortpflanzungsorgane sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: und … sollen … eindringen
  rationale: Im Zusammenhang des Fluchschwurs hat die Form volitiven beziehungsweise performativen Charakter. Die Formulierung mit »sollen« gibt die Verwünschung wieder, ohne sie als bloße Zukunftsaussage zu verstehen.
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: diese fluchbringenden Wasser
  rationale: Der Plural und das Demonstrativ werden bewahrt; »fluchbringend« bezeichnet die Wasser als Träger beziehungsweise Vollstrecker des Fluches und vermeidet die sachlich unzutreffende Wiedergabe »bitter«.
- source_word: בְּמֵעַיִךְ
  choice: in dein Inneres
  rationale: מֵעֶה bezeichnet die inneren Körperteile beziehungsweise Organe. »Inneres« ist im modernen Deutsch verständlich, körperlich konkret und weniger klinisch als »Bauchhöhle«.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: sodass der Bauch anschwillt
  rationale: Die resultative Bedeutung des Infinitivs wird natürlich wiedergegeben. »Bauch« entspricht hier dem unmittelbaren Wortsinn von בֶּטֶן, ohne die mögliche Bedeutung »Mutterleib« festzuschreiben.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: und die Hüfte dahinschwindet
  rationale: נפל bedeutet wörtlich »fallen«, bildet hier aber eine schwierige, vermutlich euphemistische Wendung. »Dahinschwinden« vermittelt eine körperliche Schädigung, ohne eine bestimmte medizinische Diagnose einzutragen.
- source_word: יָרֵךְ
  choice: Hüfte
  rationale: יָרֵךְ kann Hüfte oder Oberschenkel und euphemistisch den Fortpflanzungsbereich bezeichnen. »Hüfte« bewahrt die verhüllende Ausdrucksweise und ist im Deutschen für die genannte Körperregion idiomatischer als »Schenkel«.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: Die Frau soll sagen
  rationale: Die Formulierung gibt die vorgeschriebene rituelle Antwort in einem natürlichen, würdigen Rechtsstil wieder.
- source_word: אָמֵן אָמֵן
  choice: Amen, amen
  rationale: Die verdoppelte feierliche Zustimmung wird unverändert als vertraute liturgische Formel bewahrt.
theological_decisions:
- issue: Deutung der körperlichen Auswirkungen des Fluches
  choice: 'Die Wirkungen werden körperlich konkret, aber ohne Festlegung auf eine bestimmte Fortpflanzungsstörung wiedergegeben: »der Bauch anschwillt und die Hüfte dahinschwindet«.'
  alternative: Mögliche Deutungen wären eine Fehlgeburt, Unfruchtbarkeit, ein Gebärmuttervorfall oder eine Schädigung der Geschlechtsorgane.
  rationale: Die hebräische Wendung ist schwierig und wahrscheinlich euphemistisch. Sie weist auf eine schwere, wohl den Fortpflanzungsbereich betreffende körperliche Folge hin, benennt deren genaue medizinische Art jedoch nicht eindeutig. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit rituellem Ernst. Die ungewöhnliche Körpermetaphorik bleibt erkennbar, wird aber nicht unnötig archaisch oder medizinisch präzisiert.
