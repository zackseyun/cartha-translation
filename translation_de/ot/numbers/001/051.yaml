source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: de
  text: Wenn die Stiftshütte aufbrechen soll, sollen die Leviten sie abbauen; und wenn sie lagern soll, sollen die Leviten sie aufrichten. Ein Unbefugter[a], der sich nähert, soll getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Außenstehender oder Fremder. Das hebräische Wort bezeichnet hier jemanden, der nicht befugt ist, sich dem Heiligtum zu nähern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: Wenn die Stiftshütte aufbrechen soll
  rationale: Die Präposition בְּ mit dem Infinitivus constructus von נסע bildet einen Temporalsatz. „Aufbrechen soll“ bezeichnet den bevorstehenden Ortswechsel und macht deutlich, dass der Abbau vor dem Weiterzug geschieht.
- source_word: הַמִּשְׁכָּן
  choice: die Stiftshütte
  rationale: מִשְׁכָּן bezeichnet hier das transportable Heiligtum. „Stiftshütte“ ist im Deutschen die geläufige, kultisch eindeutige Bezeichnung.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: sollen ... sie abbauen
  rationale: Der Hifil von ירד bezeichnet in diesem Zusammenhang das Herunternehmen beziehungsweise Zerlegen der Stiftshütte für den Transport. „Abbauen“ gibt die konkrete Handlung natürlich wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Dies ist die übliche Wiedergabe der Bezeichnung für die zum Dienst eingesetzte Gruppe.
- source_word: וּבַחֲנֹת
  choice: wenn sie wieder lagern soll
  rationale: Der Infinitivus constructus von חנה bezeichnet das Lagern beziehungsweise das Beziehen eines Lagerplatzes. Das ergänzte „wieder“ stellt natürlich den Gegensatz zwischen Aufbruch und erneutem Lagern her, ohne den Inhalt zu verändern.
- source_word: יָקִימוּ אֹתוֹ
  choice: sollen ... sie aufrichten
  rationale: Der Hifil von קום bedeutet hier, die Stiftshütte am Lagerplatz wieder zu errichten. „Aufrichten“ ist präzise und stilistisch angemessen.
- source_word: וְהַזָּר
  choice: Ein Unbefugter
  rationale: זָר bezeichnet im Heiligtumskontext jemanden, der nicht zum betreffenden heiligen Dienst berechtigt ist. „Unbefugter“ vermeidet die irreführende ethnische Festlegung von „Fremder“.
- source_word: הַקָּרֵב
  choice: der sich nähert
  rationale: Das Partizip von קרב bezeichnet das Herantreten an den geschützten heiligen Bereich. Die deutsche Formulierung bewahrt die knappe Warnformel.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Der Hofal von מות ist kausativ-passiv und bezeichnet eine verhängte Tötung, nicht lediglich die Vorhersage, dass jemand sterben werde.
theological_decisions:
- issue: Art der in יוּמָת bezeichneten Strafe
  choice: 'passiv-rechtlich: „soll getötet werden“'
  alternative: 'folgenbezogen: „wird sterben“'
  rationale: Die Hofal-Form bezeichnet gewöhnlich eine zugefügte Tötung. Die Übersetzung bewahrt den rechtlichen Ernst der Heiligkeitsgrenze, ohne festzulegen, ob Menschen oder Gott die Strafe vollziehen.
- issue: Bedeutung von זָר
  choice: eine zum Heiligtumsdienst nicht befugte Person
  alternative: ein ethnischer Fremder oder ausnahmslos jeder Nichtlevit
  rationale: In priesterlich-kultischen Zusammenhängen bezeichnet זָר vor allem jemanden außerhalb des autorisierten heiligen Dienstes. Die Formulierung vermeidet eine unbegründete ethnische Deutung und lässt den genauen Kreis der Ausgeschlossenen offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stiftshütte“ wahrt den geläufigen kultischen Fachbegriff; „abbauen“ und „aufrichten“ sind zugleich klar und konkret. Die wiederholte Soll-Form gibt den regelnden Charakter des Satzes wieder.
