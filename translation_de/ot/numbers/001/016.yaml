  terminology: „Gemeinde“, „Oberhäupter“, „Stämme“ und „Tausendschaften“ passen zum administrativ-genealogischen Kontext. „Berufene“ bleibt hier funktional und wird durch die Fußnote gegen eine zu enge Deutung als formale Berufung oder Auswahl abgesichert.
