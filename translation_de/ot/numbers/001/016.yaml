  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: de
  text: Das waren die Berufenen der Gemeinde[a], die Oberhäupter der Stämme ihrer Väter, die Häupter der Tausendschaften Israels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Einberufenen der Versammlung“. Das hebräische Partizip kann Menschen bezeichnen, die gerufen, einberufen oder bestimmt wurden.'
    reason: lexical_alternative
  - marker: b
    text: „Tausendschaften Israels“ kann Gruppen von jeweils tausend bezeichnen, aber auch allgemeiner Sippenverbände oder militärische Einheiten innerhalb Israels.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Der pluralische Demonstrativausdruck identifiziert rückblickend die genannten Männer; im Deutschen wird die Kopula natürlich ergänzt.
- source_word: קריאי הָעֵדָה
  choice: die aus der Gemeinde Berufenen
  rationale: Das passive Partizip bezeichnet Berufene, Gerufene oder Einberufene. Die Formulierung bewahrt sowohl den Partizipialcharakter als auch die mögliche Zugehörigkeits- beziehungsweise Auswahlbeziehung zur Gemeinde.
- source_word: נְשִׂיאֵי
  choice: die Oberhäupter
  rationale: נָשִׂיא bezeichnet hier die führenden Repräsentanten der Stämme. „Oberhäupter“ ist würdig und vermeidet die monarchische Nebenbedeutung von „Fürsten“.
- source_word: מַטּוֹת אֲבוֹתָם
  choice: ihrer väterlichen Stämme
  rationale: Die Wendung bezeichnet die durch die Väter beziehungsweise Abstammung bestimmten Stammesverbände. „Väterlich“ hält den ausdrücklichen Bezug zu den Vätern fest, ohne ihn allgemein zu „angestammt“ abzuschwächen.
- source_word: רָאשֵׁי
  choice: die Häupter
  rationale: Die wörtliche Körpermetapher für führende Personen bleibt erhalten und passt zum gehobenen biblischen Register.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: der Tausendschaften Israels
  rationale: אֶלֶף kann eine Zahlengruppe von tausend oder eine soziale beziehungsweise militärische Einheit bezeichnen. „Tausendschaften“ bewahrt die Zahlenbezeichnung und lässt die genaue Organisationsform offen.
- source_word: הֵם
  choice: waren
  rationale: Das abschließende selbstständige Pronomen dient der Identifizierung und Hervorhebung; im natürlichen Deutschen wird diese Funktion durch die eröffnende Kopulakonstruktion wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Oberhäupter“ und „Häupter“ spiegeln die zwei unterschiedlichen hebräischen Leitungsbegriffe; „Tausendschaften“ erhält die sachliche Mehrdeutigkeit des Originals.
