lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Darauf sprach
  rationale: Das narrative וַ führt die Handlung weiter; „darauf“ macht die zeitliche Abfolge im heutigen Deutsch natürlich deutlich. „Sprach“ gibt דבר in dieser Redeeinleitung würdig und knapp wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im natürlichen Deutschen erfüllt der Doppelpunkt diese Funktion, ohne die schwerfällige Doppelung „sprach … und sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm JHWH. „Jahwe“ bewahrt den Charakter als Eigenname; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die formelhafte hebräische Redeeinleitung wird idiomatisch als ein einziger deutscher Redeeinsatz mit Doppelpunkt wiedergegeben.
