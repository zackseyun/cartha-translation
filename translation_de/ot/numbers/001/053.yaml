  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: de
  text: Doch die Leviten sollen rings um die Wohnstätte des Zeugnisses lagern, damit kein Zorn über die Gemeinde der Israeliten kommt.[a] Und die Leviten sollen den Dienst an der Wohnstätte des Zeugnisses versehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit kein Zorn gegen die Gemeinde der Israeliten kommt“.'
    reason: Die Präposition עַל und die knappe hebräische Wendung lassen im Deutschen sowohl die Vorstellung zu, dass Zorn über die Gemeinde kommt, als auch, dass er sich gegen sie richtet.
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Doch die Leviten
  rationale: Das einleitende וְ verbindet den Satz mit dem vorangehenden Abschnitt und markiert zugleich den Gegensatz zwischen den übrigen Stämmen und den Leviten. „Doch“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: יַחֲנוּ סָבִיב
  choice: sollen rings um … lagern
  rationale: Der Imperfekt hat hier anweisenden Charakter. „Rings um“ gibt die räumliche Bedeutung von סָבִיב prägnant wieder.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Wohnstätte des Zeugnisses
  rationale: „Wohnstätte“ bewahrt den Grundsinn von מִשְׁכָּן als Ort des Wohnens Gottes, ohne den Begriff auf das Zeltmaterial zu verengen. „Zeugnis“ erhält die kultisch-bundestheologische Offenheit von עֵדוּת, statt sie ausdrücklich als Gesetzestafeln oder Bundesurkunde festzulegen.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: damit kein Zorn … kommt
  rationale: Die Wendung drückt im Zusammenhang eine abzuwendende Folge beziehungsweise einen Zweck aus. „Zorn“ bewahrt das Gewicht eines drohenden göttlichen Gerichts.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: über die Gemeinde der Israeliten
  rationale: עַל bezeichnet hier das Kommen des Zorns über die Gemeinschaft. עֵדָה wird im kultischen Zusammenhang als „Gemeinde“ wiedergegeben; „Israeliten“ ist im heutigen Deutschen die natürliche kollektive Entsprechung zu בְּנֵי יִשְׂרָאֵל.
- source_word: וְשָׁמְרוּ הַלְוִיִּם אֶת מִשְׁמֶרֶת
  choice: Und die Leviten sollen den Wachdienst … versehen
  rationale: Die Verbindung von שׁמר und מִשְׁמֶרֶת bezeichnet eine anvertraute Bewachungs- und Schutzaufgabe. „Den Wachdienst versehen“ bildet sowohl die Pflicht als auch die bewahrende Funktion idiomatisch ab.
theological_decisions:
- issue: Bedeutung von קֶצֶף im Heiligtumskontext
  choice: „Zorn“ als drohender göttlicher Zorn beziehungsweise gerichtliches Eingreifen
  alternative: allgemeiner Ärger oder menschlicher Unmut
  rationale: Der Zusammenhang der bewachten Heiligtumsgrenzen in Numeri weist auf die Gefahr göttlichen Gerichts hin. Die Übersetzung benennt „Zorn“, fügt aber weder Ursache noch Form des Gerichts über den Wortlaut hinaus hinzu.
- issue: Referenz von הָעֵדֻת
  choice: „das Zeugnis“ ohne nähere Festlegung
  alternative: „Bundeszeugnis“, „Gesetzestafeln“ oder „Bundesurkunde“
  rationale: Der Ausdruck hat im Pentateuch einen bundestheologischen und kultischen Bezug, doch der Vers selbst erläutert den konkreten Gegenstand nicht. Die offene Formulierung erhält diese Spannung.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: „Israeliten“
  alternative: „Söhne Israels“
  rationale: Die hebräische feste Volksbezeichnung umfasst hier die israelitische Gemeinschaft. Im modernen Standarddeutsch vermittelt „Israeliten“ den kollektiven Sinn klar, ohne die Referenz auf männliche Nachkommen zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Schlüsselbegriffe werden bewusst konsistent und ohne konfessionelle Zusatzdeutung wiedergegeben. „Wohnstätte“ ist verständlicher als ein rein historischer Fachausdruck und hält zugleich die Bedeutung des hebräischen מִשְׁכָּן fest.
