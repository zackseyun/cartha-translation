  naturalness: Die formelhafte Syntax ist für den Kontext angemessen. „Abstammungslinien“ und „von zwanzig Jahren an aufwärts“ sind klarer und idiomatischer. Die Fußnote sollte nicht behaupten, die deutsche Formulierung sei eine wörtliche Wiedergabe, wenn sie zugleich ihren idiomatischen Sinn paraphrasiert.
