base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: de
  text: 'Für die Söhne Aschers, nach ihren Abstammungslinien, nach ihren Sippen, nach ihren Vaterhäusern, nach der Zahl der Namen: alle von zwanzig Jahren an aufwärts, die zum Heer ausziehen:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „alle, die zum Heer ausziehen“; eine militärische Zensusformel für die zum Kriegsdienst Erfassten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: Für die Nachkommen Aschers
  rationale: Die Formulierung bezeichnet in der Überschrift des Zensus die Stammesangehörigen. „Nachkommen“ gibt den genealogischen Sinn im Deutschen natürlicher wieder als das wörtliche „Söhne“, ohne die Abstammungsbeziehung aufzugeben.
- source_word: תּוֹלְדֹתָם
  choice: nach ihren Geschlechterfolgen
  rationale: Das Wort bezeichnet hier genealogische Abstammungslinien beziehungsweise Gliederungen. „Geschlechterfolgen“ bewahrt diesen Sinn, ohne schriftliche Register vorauszusetzen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה meint im Rahmen der Stammeszählung eine untergeordnete verwandtschaftliche Einheit; „Sippen“ ist genauer als das breitere „Familien“.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Die traditionelle israelitische Verwandtschaftsbezeichnung wird eng am Ausgangstext und zugleich verständlich wiedergegeben.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: nach der Zahl der Namen
  rationale: Die Wendung beschreibt eine namentliche Erfassung der Einzelnen und wahrt die wiederkehrende Zensusformel.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an und darüber
  rationale: Die Formulierung bewahrt die Altersgrenze und den formelhaften Klang des Hebräischen.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Heer auszieht
  rationale: Die Übersetzung bleibt nahe am hebräischen Ausdruck und lässt dessen militärische Bedeutung erkennen; der idiomatische Sinn der Wehrdiensttauglichkeit wird in der Fußnote erläutert.
