lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die Gemusterten
  rationale: Die Form bezeichnet in der Volkszählung die erfassten beziehungsweise gezählten Angehörigen. „Die Gemusterten“ gibt den amtlichen Zählungskontext knapp wieder, ohne das im Ausdruck selbst nicht ausdrücklich stehende Wort „Männer“ hinzuzufügen.
- source_word: לְמַטֵּה דָן
  choice: vom Stamm Dan
  rationale: לְ mit מַטֶּה kennzeichnet in dieser Zählungsformel die Stammeszugehörigkeit; „vom Stamm Dan“ ist natürliches modernes Deutsch.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: '62.700'
  rationale: Die hebräische Zahl entspricht zweiundsechzigtausendsiebenhundert. Die Ziffernschreibung ist in einer langen Zählung übersichtlich und im Deutschen mit Punkt als Tausendertrennzeichen eindeutig.
