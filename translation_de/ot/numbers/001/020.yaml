  terminology: „Sippen“ und „Vaterhäuser“ sind im Kontext angemessene, voneinander unterscheidbare Fachbegriffe. „Erstgeborener Israels“ und „Kopf für Kopf“ sind idiomatisch und quellentreu. Die Fußnote erklärt die konkrete Bildsprache und die idiomatische Funktion ohne eine ungesicherte Zusatzbedeutung einzutragen.
