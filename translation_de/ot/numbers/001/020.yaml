  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: de
  text: 'Die Söhne Rubens, des Erstgeborenen Israels, nach ihren Abstammungslinien, nach ihren Sippen und nach ihren Vaterhäusern, entsprechend der Zahl der Namen, Kopf für Kopf[a], alle männlichen Personen von zwanzig Jahren an aufwärts, jeder, der zum Heer auszog:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach ihren Schädeln/Köpfen“; gemeint ist, dass jeder Einzelne gezählt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: als einleitende Überschriftskonstruktion aufgenommen
  rationale: Das Verb eröffnet die Zählungsformel, deren Zahlenangabe im folgenden Vers steht. Eine wörtliche Wiedergabe mit „waren“ wäre im Deutschen innerhalb dieses Verses schwerfällig; die nominale Konstruktion bewahrt den formelhaften, zum nächsten Vers hin offenen Charakter.
- source_word: בְנֵי רְאוּבֵן
  choice: Die Söhne Rubens
  rationale: „Söhne“ gibt בְּנֵי transparent wieder und passt zum genealogisch-stammesbezogenen Zusammenhang; gemeint sind hier Rubens männliche Nachkommen.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: des Erstgeborenen Israels
  rationale: Die Genitivapposition bezieht die Bezeichnung eindeutig auf Ruben und klingt im Deutschen natürlicher als eine nachgestellte Nominativapposition.
- source_word: תּוֹלְדֹתָם
  choice: nach ihren Abstammungslinien
  rationale: תּוֹלְדוֹת bezeichnet hier die genealogische Herkunft beziehungsweise Gliederung. „Abstammungslinien“ wahrt diesen Sinn, ohne schriftliche Register vorauszusetzen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: „Sippen“ bezeichnet die Untergliederung des Stammes und bleibt von den anschließend genannten Vaterhäusern unterscheidbar.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ bewahrt den technischen Verwandtschaftsbegriff und die patriarchale Sozialstruktur des Ausgangstextes.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: entsprechend der Zahl der Namen
  rationale: Die Wendung beschreibt die Erfassung namentlich gezählter Einzelpersonen und bleibt eng an der hebräischen Formulierung.
- source_word: לְגֻלְגְּלֹתָם
  choice: Kopf für Kopf
  rationale: Die deutsche Redewendung bewahrt das konkrete Bild des hebräischen Ausdrucks und vermittelt zugleich die Einzelzählung.
- source_word: כָּל זָכָר
  choice: alle männlichen Personen
  rationale: Die Formulierung gibt die Geschlechtsangabe präzise wieder, ohne allein aufgrund dieses Ausdrucks Erwachsenenstatus vorauszusetzen; die Altersgrenze folgt ausdrücklich.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Dies gibt die inklusive Altersgrenze in natürlichem, formelhaftem Deutsch wieder.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Heer auszog
  rationale: Die partizipiale Form wird eng am Wortlaut als tatsächliches beziehungsweise übliches Ausziehen zum Heer wiedergegeben. Eine Übersetzung mit „wehrfähig“ oder „diensttauglich“ würde die funktionale Deutung stärker festlegen als der Text.
theological_decisions:
- issue: Bedeutung der militärischen Schlussformel כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Heer auszog
  alternative: jeder, der zum Kriegsdienst fähig war
  rationale: Der hebräische Wortlaut spricht vom Ausziehen zum Heer, kann im Zählungskontext aber militärische Eignung bezeichnen. Die gewählte Fassung bewahrt diese Spannung und vermeidet eine ausdrückliche Tauglichkeitsaussage, die im Text nicht lexikalisch markiert ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst formelhafter Reihung. Der Doppelpunkt erhält den offenen Zensusaufbau, dessen Zahlenangabe im folgenden Vers steht. Technische Verwandtschaftsbegriffe werden soweit möglich transparent beibehalten.
