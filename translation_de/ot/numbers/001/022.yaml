  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: de
  text: 'Für die Söhne Simeons: nach ihren Abstammungslinien, nach ihren Sippen, nach ihren Vaterhäusern, die von ihnen Erfassten[a], nach der Zahl der Namen, Kopf für Kopf[b], alle männlichen Personen im Alter von zwanzig Jahren und darüber, alle, die zum Heer ausziehen konnten[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die von ihnen Gemusterten“. Das zugrunde liegende hebräische Wort kann in diesem militärischen Zählungskontext sowohl das Erfassen bei einer Volkszählung als auch das Mustern bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach ihren Schädeln/Köpfen“; gemeint ist die Zählung jedes Einzelnen.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „alle, die zum Heer ausziehen“. Die hebräische Wendung ist im Zensuskontext eine Formel für die zum militärischen Auszug fähigen Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: Für die Söhne Simeons
  rationale: „Söhne“ bewahrt die formale Verbindung zum Stammvater und passt zum männlichen Kontext der Zählung.
- source_word: תּוֹלְדֹתָם
  choice: ihre Nachkommen
  rationale: Im genealogischen Zählungskontext bezeichnet das Wort die aus Simeon hervorgegangenen Abstammungslinien beziehungsweise Stammesangehörigen; „Nachkommen“ ist im modernen Deutsch klarer als das wörtlichere „Generationen“.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftliche Untergliederung des Stammes; „Sippen“ gibt diese Ebene präziser wieder als das allgemeinere „Familien“.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ bewahrt die konkrete patriarchale Sozialstruktur des hebräischen Ausdrucks und ist als biblischer Verwaltungsbegriff verständlich.
- source_word: פְּקֻדָיו
  choice: die von ihnen Erfassten
  rationale: Die passive Form von פקד bezeichnet die bei der Zählung registrierten beziehungsweise gemusterten Personen; „Erfassten“ hält die Zählungsbedeutung offen, ohne die militärische Nuance zu früh festzulegen.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: nach der Zahl der Namen
  rationale: Die formale Wendung bezeichnet eine namentliche Einzelzählung und bleibt in dieser nahen Wiedergabe verständlich.
- source_word: לְגֻלְגְּלֹתָם
  choice: Kopf für Kopf
  rationale: Der Ausdruck lautet konkret „nach ihren Schädeln/Köpfen“ und ist ein Idiom für die Erfassung jedes Einzelnen; „Kopf für Kopf“ bewahrt Bild und Sinn.
- source_word: כָּל זָכָר
  choice: alle männlichen Personen
  rationale: זָכָר bezeichnet ausdrücklich das männliche Geschlecht. Die Wiedergabe vermeidet, den Begriff lediglich als Bezeichnung erwachsener Männer zu verstehen.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Dies gibt die Altersgrenze der hebräischen Formel natürlich und zugleich quellennah wieder.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Heer auszog
  rationale: Die Wiedergabe folgt dem konkreten Bild des Hebräischen und lässt offen, ob tatsächliches Ausrücken oder allgemeine militärische Dienstfähigkeit im Vordergrund steht.
