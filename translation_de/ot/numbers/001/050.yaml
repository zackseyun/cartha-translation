source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: de
  text: Du aber sollst die Leviten mit der Verantwortung für die Stiftshütte des Zeugnisses[a] betrauen, für alle ihre Geräte und für alles, was zu ihr gehört. Sie sollen die Stiftshütte und alle ihre Geräte tragen, an ihr Dienst verrichten[b] und rings um die Stiftshütte lagern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wohnung des Zeugnisses“. Gemeint ist das transportable Heiligtum.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ihr dienen“ oder „sie betreuen“. Das Verb bezeichnet hier den Dienst am Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion hebt den besonderen Auftrag für die Leviten gegenüber den zuvor genannten Stämmen kontrastiv hervor.
- source_word: הַפְקֵד ... עַל
  choice: mit der Verantwortung für ... betrauen
  rationale: Das Hifil von פקד zusammen mit עַל bezeichnet hier die verbindliche Zuweisung eines Verantwortungsbereichs. Die deutsche Wendung ist natürlicher als ein formales „über ... einsetzen“.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Stiftshütte des Zeugnisses
  rationale: „Stiftshütte“ ist der geläufige deutsche Fachausdruck für das transportable Heiligtum; die Genitivverbindung „des Zeugnisses“ bewahrt die offene und knappe Form des Hebräischen.
- source_word: כֵּלָיו
  choice: ihre Geräte
  rationale: כֵּלִים umfasst hier die zum Heiligtum gehörenden Geräte und Gegenstände. „Geräte“ ist breit genug und im Deutschen für diesen Zusammenhang gebräuchlich.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: alles, was zu ihr gehört
  rationale: Die Formulierung gibt die umfassende Zugehörigkeit wieder, ohne den Bestand der betreffenden Dinge näher festzulegen.
- source_word: יִשְׂאוּ
  choice: tragen
  rationale: נשא bezeichnet hier das tatsächliche Tragen beziehungsweise Befördern des transportablen Heiligtums und seiner Geräte.
- source_word: יְשָׁרְתֻהוּ
  choice: an ihr Dienst tun
  rationale: Das Piel von שרת bezeichnet einen geordneten, hier kultischen Dienst. Die Formulierung bewahrt den Bezug des Objektsuffixes auf die Stiftshütte, ohne zusätzliche priesterliche Aussagen einzutragen.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: rings um die Stiftshütte lagern
  rationale: Die Wendung bezeichnet das angeordnete Lagern in einem Umkreis um das Heiligtum; „rings um“ macht den räumlichen Sinn klar.
theological_decisions:
- issue: Bezeichnung des transportablen Heiligtums
  choice: Stiftshütte
  alternative: Wohnung; Zeltheiligtum
  rationale: „Stiftshütte“ erhält den kultischen Fachbezug und bezeichnet das transportable Heiligtum, während die Fußnote die wörtliche Grundbedeutung von מִשְׁכָּן transparent macht.
- issue: Bedeutung von הָעֵדֻת
  choice: Zeugnis
  alternative: Bundeszeugnis; Bundesurkunde
  rationale: Das formal offene „Zeugnis“ vermeidet es, den Bezug im Haupttext deutend auf eine bestimmte Urkunde oder Bundesformel einzuengen.
- issue: Art des levitischen Dienstes
  choice: an ihr Dienst tun
  alternative: ihr dienen; sie betreuen
  rationale: Die gewählte Fassung lässt den sakralen Dienstcharakter erkennen, ohne den Leviten an dieser Stelle weitergehende priesterliche Funktionen zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Traditionelle Kultbegriffe werden dort beibehalten, wo sie den Gegenstand präzise benennen; ungebräuchliche wörtliche Formulierungen werden in den Fußnoten erläutert.
