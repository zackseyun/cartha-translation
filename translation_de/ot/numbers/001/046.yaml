lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: So betrug ... die Gesamtzahl
  rationale: Die fortführende Verbform mit היה fasst das Ergebnis der Zählung zusammen. Die deutsche Formulierung gibt diesen resultativen Sinn natürlich wieder.
- source_word: כָּל הַפְּקֻדִים
  choice: aller Gemusterten
  rationale: הַפְּקֻדִים bezeichnet die im Rahmen der Erhebung registrierten beziehungsweise gezählten Personen. „Gemusterte“ passt zum militärischen Zensus des Kontextes, ohne im Vers ausdrücklich „Männer“ hinzuzufügen.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: '603.550'
  rationale: Die additive hebräische Zahlenfolge wird nach üblicher deutscher Schreibweise eindeutig und gut lesbar als Gesamtzahl wiedergegeben.
