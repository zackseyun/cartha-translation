base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: de
  text: Das sind die Gemusterten[a], die Mose, Aaron und die Führer Israels musterten; es waren zwölf Männer, je einer für sein Vaterhaus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gezählten“. Das Hebräische kann hier die erfassten Personen oder ihre Aufnahme in die Zählung hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Ein „Vaterhaus“ war eine durch die väterliche Abstammung bestimmte Großfamilien- oder Sippeneinheit innerhalb der Stammesordnung Israels.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: die Gemusterten
  rationale: Das passive Partizip bezeichnet im Zusammenhang der wehrfähigen Volkszählung die erfassten Männer. „Gemusterte“ bewahrt den Personenbezug und den militärischen Kontext.
- source_word: פָּקַד
  choice: musterten
  rationale: Das Verb bezeichnet hier die Erfassung bei einer Volkszählung beziehungsweise Musterung; „mustern“ verbindet den Zählvorgang mit dessen militärischem Zweck.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: die Führer Israels
  rationale: נָשִׂיא bezeichnet hier die führenden Vertreter der Stämme; „Führer“ ist sachlich und vermeidet die dynastische Nebenbedeutung von „Fürsten“.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: zwölf Männer
  rationale: Der hebräische Text nennt ausdrücklich zwölf männliche Personen; die Übersetzung gibt dies geschlechtsgenau wieder.
- source_word: אִישׁ אֶחָד
  choice: je einer
  rationale: Die knappe distributive Wendung gibt wieder, dass jedes Vaterhaus durch genau einen Mann vertreten war.
- source_word: לְבֵית אֲבֹתָיו
  choice: für sein Vaterhaus
  rationale: „Vaterhaus“ bewahrt den israelitischen Fachausdruck für die patrilineare Großfamilien- oder Sippeneinheit; לְ bezeichnet hier die Zuordnung beziehungsweise Vertretung.
- source_word: הָיוּ
  choice: waren
  rationale: Das finite Verb wird ausdrücklich in „Bei ihnen waren“ wiedergegeben und bezieht sich auf die zwölf Führer.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gemusterte“ und „Vaterhaus“ sind bewusst präzise Kontextbegriffe; die Satzteilung macht die hebräische Konstruktion verständlich, ohne הָיוּ auszulassen.
