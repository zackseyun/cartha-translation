lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die Zahl der gemusterten Männer
  rationale: Das substantivierte Passiv von פקד bezeichnet im Zusammenhang der Volkszählung die erfassten beziehungsweise gemusterten Männer. Die Formulierung gibt zugleich den numerischen Charakter der Aussage natürlich wieder.
- source_word: לְמַטֵּה
  choice: aus dem Stamm
  rationale: לְ mit מַטֶּה kennzeichnet in dieser Zählformel die Zugehörigkeit zum Stamm; im Deutschen ist „aus dem Stamm“ idiomatisch.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Der Eigenname folgt der etablierten deutschen Bibelschreibung.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: '32.200'
  rationale: Die Zahl wird nach moderner deutscher Schreibweise wiedergegeben und bewahrt den exakten Wert von zweiunddreißigtausendzweihundert.
