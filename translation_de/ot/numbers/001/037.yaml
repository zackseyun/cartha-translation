lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die Zahl der Gemusterten
  rationale: Die Form bezeichnet im wiederkehrenden Zensusformular die erfassten beziehungsweise gemusterten Personen als Gesamtzahl. „Gemusterte“ gibt den militärischen Zensuskontext prägnant wieder, ohne das im Vers selbst nicht ausdrücklich stehende Wort „Männer“ hinzuzufügen.
- source_word: לְמַטֵּה
  choice: aus dem Stamm
  rationale: לְ mit מַטֶּה kennzeichnet hier die Stammeszugehörigkeit; im Deutschen ist „aus dem Stamm“ in diesem Zensusformular natürlich.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Eingebürgerte deutsche Form des Personen- und Stammesnamens.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '35.400'
  rationale: Die hebräische Zahlenangabe wird ihrem exakten Wert entsprechend in moderner deutscher Schreibweise wiedergegeben.
