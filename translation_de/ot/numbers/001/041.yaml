  rationale: Die im Deutschen gebräuchliche biblische Namensform wird beibehalten.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '41.500'
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise wiedergegeben; der Zahlenwert 41.500 bleibt genau erhalten.
