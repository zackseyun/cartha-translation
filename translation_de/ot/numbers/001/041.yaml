- source_word: לְמַטֵּה
  choice: aus dem Stamm
  rationale: לְ mit מַטֶּה kennzeichnet in dieser Zählungsformel die Stammeszugehörigkeit; „aus dem Stamm“ ist im modernen Deutschen natürlich.
- source_word: אָשֵׁר
