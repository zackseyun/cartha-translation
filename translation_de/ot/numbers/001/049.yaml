source:
  edition: WLC
  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: de
  text: Nur den Stamm Levi sollst du nicht mustern und seine Zahl nicht unter den Söhnen Israels[a] mitrechnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“ oder „den Kindern Israels“. Wörtlich steht im Hebräischen: „den Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Nur
  rationale: Die Partikel kennzeichnet Levi als Ausnahme von den vorausgehenden Anweisungen zur Volkszählung; „nur“ gibt diese einschränkende Kraft präzise wieder.
- source_word: מַטֵּה לֵוִי
  choice: den Stamm Levi
  rationale: מַטֶּה bezeichnet im Zusammenhang der Volkszählung einen Stamm, nicht den wörtlichen Stab.
- source_word: תִפְקֹד
  choice: mustern
  rationale: פקד meint hier die amtliche Erfassung im Rahmen einer militärisch geprägten Volkszählung. „Mustern“ bewahrt diesen Kontext besser als das allgemeinere „zählen“.
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: seine Gesamtzahl ... erheben
  rationale: Die Verbindung ist eine Zählungsformel. „Gesamtzahl erheben“ gibt den idiomatischen Sinn verständlich wieder, ohne das wörtliche Bild von „Kopf“ und „emporheben“ unnatürlich nachzuahmen.
- source_word: בְּתוֹךְ
  choice: zusammen mit
  rationale: Die Präposition bezeichnet hier die Einbeziehung Levis in die Zählung der größeren Gruppe; „zusammen mit“ macht den gemeinten Ausschluss natürlich verständlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die Wiedergabe bewahrt die grammatisch maskuline und traditionelle Bundesbezeichnung des hebräischen Textes.
theological_decisions:
- issue: Geschlechtsspezifische Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  alternative: den Israeliten / den Kindern Israels
  rationale: Der hebräische Ausdruck lautet formal „Söhne Israels“ und dient zugleich als Bezeichnung des Volkes. Die Übersetzung bewahrt die Form, während die Fußnote geläufige sinngemäße Wiedergaben nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mustern“ und „Gesamtzahl erheben“ entsprechen dem amtlichen Zählungskontext; die Satzstellung bleibt nahe am hebräischen Ausnahmegebot, ohne im Deutschen sperrig zu wirken.
