base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: de
  text: 'Für die Nachkommen Judas: nach ihren Geschlechtern, nach ihren Sippen, nach ihren Vaterhäusern, nach der Zahl der Namen, von zwanzig Jahren an aufwärts, jeder, der zum Heer auszieht[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Idiom bezeichnet hier die Männer, die für den Kriegsdienst infrage kamen; auch: »jeder wehrfähige Mann«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: Für die Nachkommen Judas
  rationale: בני bedeutet wörtlich »Söhne«, bezeichnet in der Zählungsformel jedoch die Stammesangehörigen als Nachkommen Judas. »Nachkommen« gibt diesen kollektiven Sinn im heutigen Deutsch natürlich wieder.
- source_word: תּוֹלְדֹתָם
  choice: nach ihren Geschlechtern
  rationale: תולדות bezeichnet hier genealogische Abstammungsverbände beziehungsweise Generationenfolgen. »Geschlechter« bewahrt den genealogischen und formelhaften Charakter.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: משפחה bezeichnet im Stammesaufbau eine Untergliederung des Stammes und ist enger als die moderne Kleinfamilie; »Sippen« bildet diese soziale Einheit angemessen ab.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Die Wendung bedeutet wörtlich »nach dem Haus ihrer Väter« und bezeichnet patrilineare Hausverbände. »Vaterhäuser« ist knapp, verständlich und quellennah.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: nach der Zahl der Namen
  rationale: Die wörtliche Formel weist auf eine namentliche Erfassung hin. Die Wiedergabe vermeidet eine stärker deutende Glättung wie »nach Köpfen«.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Die Formulierung gibt die Altersgrenze der Zählung formell und im Deutschen idiomatisch wieder.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Heer auszieht
  rationale: Die Wendung lautet nahezu wörtlich »jeder zum Heer Ausziehende«. Sie bezeichnet im Zusammenhang die zum Kriegsdienst herangezogenen Männer, ohne das im Ausdruck nicht eigens stehende »fähig« in den Haupttext einzutragen.
theological_decisions:
- issue: Geschlechtsspezifische Sprache der Heereszählung
  choice: jeder, der zum Heer auszieht
  alternative: jeder wehrfähige Mann
  rationale: Das maskuline Singularpartizip steht im Kontext einer Zählung der Männer im militärdienstfähigen Alter. Die gewählte Form bewahrt das grammatische Maskulinum und den unmittelbaren Wortlaut, während die Fußnote die kontextuelle Bedeutung erklärt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst formelhafter Satzstruktur. Der Doppelpunkt wahrt den Listencharakter des Abschnitts. »Geschlechter«, »Sippen« und »Vaterhäuser« unterscheiden die genealogischen Ebenen, ohne sie modernisierend einzuebnen.
