lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die Zahl der Gemusterten
  rationale: Das passive Partizip von פקד bezeichnet in dieser Volkszählungsformel die erfassten beziehungsweise registrierten Personen. „Gemusterte“ bewahrt den amtlichen Zählungskontext, ohne das hier nicht ausdrücklich stehende Wort „Männer“ hinzuzufügen.
- source_word: לְמַטֵּה
  choice: aus dem Stamm
  rationale: Die Verbindung kennzeichnet hier die Zugehörigkeit zum Stamm; „aus dem Stamm“ ist im Deutschen natürlich und passt zur wiederkehrenden Zählungsformel.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '74.600'
  rationale: Die hebräische Zahlenfolge entspricht in heutiger deutscher Schreibweise vierundsiebzigtausendsechshundert.
