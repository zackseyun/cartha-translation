source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose in der Wüste Sinai, im Zelt der Begegnung[a], am ersten Tag des zweiten Monats, im zweiten Jahr nach ihrem Auszug aus dem Land Ägypten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch übersetzt: „Zelt der Zusammenkunft“; traditionell: „Stiftshütte“.'
    reason: Die Fußnote dokumentiert eine gebräuchliche alternative sowie die traditionelle deutsche Wiedergabe von אֹהֶל מוֹעֵד, ohne eine von ihnen unzutreffend als ebenso wörtlich zu bezeichnen.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Verb דבר leitet hier in erzählender Standardsprache eine göttliche Rede ein. „Redete“ gibt den Vorgang natürlich wieder und lässt sich gut mit der abschließenden Redeeinleitung verbinden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen gebräuchlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּמִדְבַּר סִינַי
  choice: in der Wüste Sinai
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Steppengebiet. „Wüste Sinai“ ist die geläufige und klare deutsche Ortsbezeichnung.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Die Wiedergabe bildet die Bestandteile אֹהֶל („Zelt“) und מוֹעֵד („festgesetzte Begegnung/Zusammenkunft“) transparent ab, ohne den weniger verständlichen Traditionsbegriff „Stiftshütte“ in den Haupttext zu setzen.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: am ersten Tag des zweiten Monats
  rationale: Die hebräische Datumsformel wird in klarem modernem Deutsch ausdrücklich als Monatstag wiedergegeben.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: im zweiten Jahr
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: לְצֵאתָם
  choice: nach ihrem Auszug
  rationale: Der Infinitiv mit Suffix bezeichnet Israels Herausgehen aus Ägypten. Die nominale deutsche Form ist knapp, natürlich und bewahrt den zeitlichen Bezug.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: „Land“ wird entsprechend dem ausdrücklich vorhandenen אֶרֶץ beibehalten.
- source_word: לֵאמֹר
  choice: 'Er sprach:'
  rationale: Die formelhafte hebräische Redeeinleitung verweist auf den folgenden Wortlaut. Ein eigenständiger deutscher Satz mit Doppelpunkt ist natürlicher als das Partizip „sagend“ und macht deutlich, dass die Rede im nächsten Vers folgt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und verwendet die im modernen Deutschen übliche Form, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge „Er sprach:“ gibt die hebräische Redeeinleitungsformel natürlich wieder und öffnet auf die in Vers 2 folgende Rede. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, den die Fußnote erläutert.
