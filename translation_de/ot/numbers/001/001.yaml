  terminology: „Jahwe“, „Mose“, „Wüste Sinai“, „Zelt der Begegnung“ und „Land Ägypten“ sind angemessen. Die Fußnote sollte „Zelt der Zusammenkunft“ nicht als gleichermaßen wörtliche Formulierung bezeichnen, sondern als alternative Übersetzung ausweisen.
