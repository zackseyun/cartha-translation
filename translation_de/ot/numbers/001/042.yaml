base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: de
  text: 'Die Söhne Naftalis, nach ihrer Abstammung, nach ihren Sippen und nach ihren Vaterhäusern, nach der Zahl der Namen, von zwanzig Jahren an aufwärts, jeder, der zum Kriegsdienst ausrücken konnte[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „jeder, der zum Heer auszieht“. Die hebräische Wendung bezeichnet hier diejenigen, die für den Kriegsdienst infrage kamen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Die Söhne Naftalis
  rationale: Die wörtliche genealogische Bezeichnung „Söhne“ passt zum männlichen Stammesaufgebot und bewahrt die Geschlechtsangabe des Zusammenhangs.
- source_word: תּוֹלְדֹתָם
  choice: nach ihrer Abstammung
  rationale: Das Wort bezeichnet hier die genealogische Zuordnung. „Abstammung“ ist im heutigen Deutsch natürlicher als das missverständliche „nach ihren Generationen“.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: „Sippen“ bezeichnet die größeren verwandtschaftlichen Verbände genauer als das moderne, oft auf die Kernfamilie bezogene „Familien“.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Die traditionelle und transparente Wiedergabe bewahrt die im Hebräischen ausdrücklich väterlich bestimmte Gliederung.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: nach der Zahl der Namen
  rationale: Die formale Wendung lässt erkennen, dass die einzelnen namentlich erfassten Personen gezählt wurden.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an und darüber
  rationale: Die Formulierung bildet die Altersgrenze eng am Hebräischen ab und bleibt verständlich.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Kriegsdienst ausrücken konnte
  rationale: Wörtlich ist von jedem die Rede, der zum Heer beziehungsweise Krieg auszieht. Im Volkszählungskontext bezeichnet die Wendung die Eignung oder Berechtigung zum Militärdienst; „konnte“ macht diese idiomatische Bedeutung deutlich, ohne den militärischen Sinn abzuschwächen.
