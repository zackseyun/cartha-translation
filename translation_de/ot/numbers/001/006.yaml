  rationale: Der Personenname wird nach etablierter deutscher Bibeltradition transliteriert. Das Trema macht kenntlich, dass i und e getrennt gesprochen werden.
- source_word: בֶּן
  choice: der Sohn
  rationale: In dieser genealogischen Identifikationsformel bezeichnet בֶּן unmittelbar den Sohn. Der bestimmte Artikel ergibt im Deutschen eine natürliche Namensapposition.
- source_word: צוּרִישַׁדָּי
  choice: Zurischaddai
  rationale: Der Personenname wird transliteriert; „Zurischaddai“ entspricht einer geläufigen deutschen biblischen Namensform und gibt den Bestandteil Schaddai erkennbar wieder.
