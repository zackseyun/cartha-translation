id: NUM.1.54
reference: Numbers 1:54
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: de
  text: Und die Söhne Israels taten alles so, wie Jahwe es Mose geboten hatte; genau so taten sie es.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ beziehungsweise „die Kinder Israels“. Wörtlich steht im Hebräischen „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: taten
  rationale: Das breite Verb עשה bedeutet „tun/machen“. „Taten“ bewahrt hier die schlichte zusammenfassende Aussage und greift die Wiederholung am Versende auf.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche Form des hebräischen maskulinen Plurals wird beibehalten. Eine idiomatischere kollektive Wiedergabe wäre „die Israeliten“.
- source_word: כְּכֹל אֲשֶׁר
  choice: alles so, wie
  rationale: Diese natürliche deutsche Formulierung gibt sowohl die Vollständigkeit („alles“) als auch die Übereinstimmung mit dem Gebot („so, wie“) wieder.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass Jahwes Gebot der Ausführung durch Israel vorausging; „gebieten“ entspricht dem würdevollen biblischen Register.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֶת מֹשֶׁה
  choice: es Mose
  rationale: Mose ist grammatisch das direkte Objekt des hebräischen Verbs „gebieten“. Im Deutschen verlangt die natürliche Konstruktion „jemandem etwas gebieten“ den Dativ und ein ergänzendes „es“.
- source_word: כֵּן עָשׂוּ
  choice: genau so taten sie es
  rationale: Die Formulierung bewahrt die nachdrückliche Wiederholung des hebräischen Verbs und hebt die genaue Entsprechung zwischen Gebot und Ausführung hervor.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt dessen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; die Kinder Israels
  rationale: Die gewählte Fassung erhält die ausdrücklich maskuline und wörtliche Form des Hebräischen. Die Fußnote nennt die im Deutschen geläufigere kollektive Alternative, ohne die Form im Haupttext stillschweigend zu neutralisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich deutsch, während die hebräische Vollständigkeitsformel und die emphatische Wiederholung des Verbs erhalten bleiben.
