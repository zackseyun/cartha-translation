  register: Modernes, gut verständliches Standarddeutsch mit würdigem Listenstil. »Zur Seite stehen« vermeidet ein hölzernes »mit euch stehen«, ohne die amtlich-repräsentative Funktion genauer festzulegen, als es der Kontext erlaubt.
