source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר יַֽעַמְד֖וּ אִתְּ/כֶ֑ם לִ/רְאוּבֵ֕ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: de
  text: 'Und dies sind die Namen der Männer, die euch zur Seite stehen sollen: für Ruben[a] Elizur, der Sohn Schedeurs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus Ruben: Elizur, der Sohn Schedeurs«. Die hebräische Präposition kann die Zugehörigkeit zum Stamm oder dessen Vertretung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Und dies sind
  rationale: Das וְ wahrt den Anschluss an den vorausgehenden Zusammenhang; die präsentierende Formel klingt im Deutschen natürlich und würdevoll.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: die Namen der Männer
  rationale: Die hebräische Genitivverbindung wird direkt wiedergegeben; אֲנָשִׁים bezeichnet hier die ausdrücklich genannten männlichen Stammesvertreter.
- source_word: אֲשֶׁר יַעַמְדוּ אִתְּכֶם
  choice: die euch zur Seite stehen sollen
  rationale: Die Wendung gibt das wörtliche »mit euch stehen« idiomatisch wieder und bewahrt zugleich den Sinn unterstützender beziehungsweise repräsentativer Mitwirkung. Das pluralische »euch« entspricht dem hebräischen Suffix.
- source_word: לִרְאוּבֵן
  choice: für Ruben
  rationale: Die Präposition ל kann hier die Zuordnung zum Stamm oder dessen Vertretung markieren; »für Ruben« lässt den repräsentativen Sinn erkennen, ohne ihn unnötig auszudeuten.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizur, der Sohn Schedeurs
  rationale: Die Personennamen werden nach geläufiger deutscher Bibelnamenform wiedergegeben; בֶּן erscheint als natürliche genealogische Formel.
theological_decisions: []
