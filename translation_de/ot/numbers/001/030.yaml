  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: de
  text: 'Für die Söhne Sebulons, nach ihren Geschlechtern, nach ihren Sippen, nach ihren Vaterhäusern, nach der Zahl der Namen: alle Männer von zwanzig Jahren an und darüber, die zum Kriegsdienst ausziehen konnten[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die zum Heer ausziehen; gemeint sind Männer, die zum Kriegsdienst tauglich waren.'
    reason: Die Fußnote bewahrt die konkrete hebräische militärische Wendung und erläutert ihre funktionale Bedeutung im Zensuskontext.
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: Für die Nachkommen Sebulons
  rationale: Das ל leitet die Stammesrubrik ein. „Nachkommen“ gibt בְּנֵי im genealogischen Zählungskontext natürlicher wieder als das missverständliche „Söhne“ und bewahrt zugleich den Bezug auf Sebulon.
- source_word: תּוֹלְדֹתָם
  choice: nach ihren Geschlechtern
  rationale: Das Wort bezeichnet hier genealogische Abstammungsordnungen. „Geschlechter“ ist im Deutschen für diesen Zusammenhang verständlich und erhält die formelhafte Struktur.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet die größeren verwandtschaftlichen Untergruppen des Stammes; „Sippen“ grenzt sie von den engeren Haushalten beziehungsweise Vaterhäusern ab.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ gibt den technischen patrilinearen Verwandtschaftsbegriff formal und knapp wieder.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: entsprechend der Zahl der Namen
  rationale: Die Wendung beschreibt die namentliche Erfassung der Einzelnen. Die Wiedergabe wahrt das Bild des hebräischen Ausdrucks, ohne es zu „Kopfzahl“ umzudeuten.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: alle Männer von zwanzig Jahren an
  rationale: „Von zwanzig Jahren an“ ist eine natürliche deutsche Wiedergabe der Altersgrenze „vom Zwanzigjährigen und darüber“; „Männer“ macht den im Kontext männlichen Personenkreis deutlich.
- source_word: כֹּל יֹצֵא צָבָא
  choice: die zum Kriegsdienst ausziehen konnten
  rationale: Die wörtliche Wendung „jeder, der zum Heer/Krieg auszieht“ bezeichnet hier die militärdienstfähigen Männer. „Konnte“ bringt die Eignung im Zählungskontext zum Ausdruck; die Fußnote bewahrt die wörtlichere Lesart.
theological_decisions:
- issue: Geschlechtsspezifischer Umfang der militärischen Zählung
  choice: alle Männer …, die zum Kriegsdienst ausziehen konnten
  alternative: alle, die zum Kriegsdienst ausziehen konnten
  rationale: Obwohl כֹּל grammatisch „jeder/alle“ bedeutet, begrenzen Altersformel, Stammeszählung und militärischer Kontext den erfassten Personenkreis auf Männer. Die Übersetzung macht diese kontextuelle Referenz sichtbar, ohne eine weitergehende Aussage über Geschlechterrollen einzutragen.
- issue: Bedeutung der militärischen Wendung יֹצֵא צָבָא
  choice: zum Kriegsdienst ausziehen konnten
  alternative: zum Heer auszogen / zum Krieg auszogen
  rationale: Die Formulierung kann formal das Ausziehen mit dem Heer bezeichnen, fungiert in der Zählungsformel aber als Kriterium militärischer Dienstfähigkeit. Der Haupttext gibt die kontextuelle Funktion wieder; die Fußnote hält die wörtliche Bildsprache offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst formelhafter Reihung, passend zum Verwaltungs- und Zählungsstil des Kapitels. „Vaterhäuser“ bleibt als sachsprachlicher biblischer Verwandtschaftsbegriff erhalten; „Nachkommen“ vermeidet das im Deutschen zu enge Verständnis leiblicher Söhne.
