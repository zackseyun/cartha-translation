lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: So waren
  rationale: Die Wayyiqtol-Form von היה führt die zusammenfassende Feststellung aus dem vorangehenden Zählungsbericht fort; „So“ gibt den folgernden Charakter natürlich wieder.
- source_word: כָּל פְּקוּדֵי
  choice: alle Gemusterten
  rationale: פקד bezeichnet hier die Erfassung im Rahmen einer militärisch ausgerichteten Volkszählung. „Gemusterte“ verbindet den Zählungs- und Militärkontext knapp und treffend.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Die formnahe Wiedergabe bewahrt die in diesem ausdrücklich männlich-militärischen Zensus bedeutsame Geschlechtsbezeichnung.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ wahrt die patrilineare soziale Gliederung des hebräischen Ausdrucks; „nach“ bezeichnet die Ordnung der Musterung.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Natürliche und genaue Wiedergabe der festen hebräischen Altersformel.
- source_word: כָּל יֹצֵא צָבָא
  choice: alle, die ... zum Heer auszogen
  rationale: Die Wiedergabe bleibt nahe beim partizipialen Ausdruck „jeder, der zum Heer auszieht“, ohne die Bedeutung ausdrücklich als bloße Fähigkeit oder Tauglichkeit festzulegen.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Direkte und im Deutschen natürliche Wiedergabe der korporativ-lokalen Wendung.
