  text: So waren alle gemusterten Söhne Israels[a], nach ihren Vaterhäusern, von zwanzig Jahren an aufwärts, alle, die in Israel zum Kriegsdienst ausziehen konnten[b],
  philosophy: optimal-equivalence
  footnotes:
