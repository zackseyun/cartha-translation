  register: Modernes, würdiges Standarddeutsch. „Gemusterte“ passt zum militärischen Zensus und ist verständlicher als eine substantivierte Form von „Gezählte“. Das Satzschlusskomma bleibt stehen, weil Vers 45 syntaktisch erst mit der Gesamtzahl in Vers 46 abgeschlossen wird.
