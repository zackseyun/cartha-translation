lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die Zahl der Gemusterten
  rationale: Die Form von פקד bezeichnet hier die bei der Zählung erfassten Personen. „Gemusterte“ passt zum Kontext der Erhebung wehrfähiger Männer; die Wendung „die Zahl der … betrug“ gibt die hebräische Zählungsformel natürlich wieder.
- source_word: לְמַטֵּה
  choice: aus dem Stamm
  rationale: לְ mit מַטֶּה kennzeichnet in dieser Zensusformel die Stammeszugehörigkeit; „aus dem Stamm“ ist im Deutschen idiomatisch.
- source_word: אֶפְרָיִם
  choice: Efraïm
  rationale: Gebräuchliche deutsche Wiedergabe des Namens; das Trema verdeutlicht, dass a und i getrennt gesprochen werden.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '40.500'
  rationale: Die Zahl entspricht vierzigtausendfünfhundert. Die Ziffernschreibweise ist in modernem Deutsch bei großen Zensuszahlen gut lesbar.
