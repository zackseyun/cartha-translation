  text: Die Zahl der Erfassten aus dem Stamm Issachar betrug 54.400.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Zahl“ oder „die Zahl der Registrierten“. Der hebräische Ausdruck bezeichnet die bei der Volkszählung Erfassten beziehungsweise Gezählten.'
