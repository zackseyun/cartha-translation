lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die Zahl der Gemusterten
  rationale: Die Form von פקד mit Suffix bezeichnet im Zusammenhang der Volkszählung die erfassten beziehungsweise gezählten Personen als Gesamtzahl. „Gemusterte“ bewahrt den amtlichen Zählungscharakter, ohne das im Vers nicht ausdrücklich stehende Wort „Männer“ hinzuzufügen.
- source_word: לְמַטֵּה
  choice: aus dem Stamm
  rationale: לְ mit מַטֶּה ordnet die erfassten Personen dem Stamm zu; „aus dem Stamm“ ist im Deutschen idiomatisch und entspricht der Zählungsformel.
- source_word: יִשָּׂשכָר
  choice: Issachar
  rationale: Der Eigenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '54.400'
  rationale: Die hebräische Zahlenfolge wird in üblicher moderner deutscher Zahlenschreibweise wiedergegeben; die genaue Menge bleibt unverändert.
