translation_notes:
  register: Moderner, würdiger Listen- und Verwaltungston. Die wiederholten Zuordnungsformeln des hebräischen Zensus werden beibehalten, zugleich werden „Abstammung“, „Sippen“ und „Vaterhäuser“ zur verständlichen Unterscheidung der sozialen Ebenen verwendet. Der Doppelpunkt wahrt den Anschluss an die im folgenden Vers genannte Zahl.
