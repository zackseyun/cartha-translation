  text: לִ/בְנֵ֣י בִנְיָמִ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: de
  text: 'Für die Nachkommen Benjamins: nach ihrer Abstammung, nach ihren Sippen und ihren Vaterhäusern, nach der Zahl der Namen, von zwanzig Jahren an und darüber, jeder, der zum Heer auszieht[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder, der zum Heer auszieht“; gemeint sind die zum Kriegsdienst tauglichen Männer.'
    reason: Der hebräische militärische Ausdruck wird im Haupttext formal bewahrt; die Fußnote erklärt seine kontextuelle Bedeutung.
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: Für die Nachkommen Benjamins
  rationale: Das לְ leitet innerhalb der Volkszählung den Stammesabschnitt ein. „Nachkommen“ gibt בְּנֵי im Stammeszusammenhang natürlich wieder, ohne es auf unmittelbare Söhne zu beschränken.
- source_word: תּוֹלְדֹתָם
  choice: nach ihrer Abstammung
  rationale: תּוֹלְדֹת bezeichnet hier die genealogische Zuordnung. „Abstammung“ ist im Deutschen verständlicher als das missverständliche „Generationen“ und bleibt nahe am hebräischen Ordnungsbegriff.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet in der Stammesgliederung eine Sippe beziehungsweise einen Clan und wird dadurch von Stamm und Vaterhaus unterschieden.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ bewahrt den konkreten israelitischen Verwandtschaftsbegriff und dessen patriarchale Form, statt ihn allgemein zu „Familien“ umzudeuten.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: nach der Zahl der Namen
  rationale: Die formelhafte Wendung bezeichnet die namentliche Erfassung der gezählten Einzelpersonen; die relativ wörtliche Wiedergabe passt zum Registercharakter des Abschnitts.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an und darüber
  rationale: Die Formulierung gibt die untere Altersgrenze samt allen höheren Altersstufen wieder und wahrt den formelhaften Ton der Zählung.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Heer auszieht
  rationale: Die Wiedergabe bildet das hebräische Partizip und den militärischen Ausdruck eng ab. Die gemeinte Eignung beziehungsweise Verpflichtung zum Militärdienst wird in der Fußnote erläutert, ohne sie stillschweigend in den Haupttext einzutragen.
