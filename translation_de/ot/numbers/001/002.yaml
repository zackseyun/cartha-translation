  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: de
  text: 'Erfasst die ganze Gemeinde der Israeliten nach ihren Sippen, nach ihren Vaterhäusern, nach der Zahl der Namen: alle männlichen Personen, Kopf für Kopf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt der Vers: »Erhebt den Kopf der ganzen Gemeinde der Söhne Israels«; gemeint ist, sie für eine Zählung zu erfassen. »Kopf für Kopf« lautet wörtlich »nach ihren Schädeln/Köpfen« und bezeichnet die einzelne Erfassung jeder männlichen Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: Erfasst
  rationale: Die Wendung bedeutet wörtlich »den Kopf erheben«, bezeichnet hier aber die amtliche Erfassung beziehungsweise Zählung. »Erfasst« gibt den Verwaltungsvorgang knapp und natürlich wieder.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: die ganze Gemeinde der Israeliten
  rationale: עֵדָה bezeichnet Israel als gemeinschaftlichen Verband. »Gemeinde« bewahrt diesen korporativen Sinn; »Israeliten« gibt die Zugehörigkeit sachgemäß wieder, ohne den deutschen Ausdruck »Söhne Israels« unnötig als ausschließlich erwachsene Söhne missverständlich erscheinen zu lassen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier größere verwandtschaftliche Untergruppen; »Sippen« ist im Kontext der Stammesgliederung präziser als das moderne »Familien«.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Die Wendung bezeichnet Abstammungs- und Haushaltsverbände väterlicher Linie. »Vaterhäuser« erhält diese historische Sozialstruktur.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: anhand der Zahl der Namen
  rationale: Die formale Verwaltungsformulierung verweist auf eine namentliche Erfassung und wird möglichst nah am Hebräischen wiedergegeben.
- source_word: כָּל זָכָר
  choice: alle männlichen Personen
  rationale: זָכָר bezeichnet ausdrücklich das männliche Geschlecht. »Männliche Personen« ist präzise und schließt dem Ausdruck nach nicht nur erwachsene Männer ein; die nähere Altersbegrenzung folgt erst in Vers 3.
- source_word: לְגֻלְגְּלֹתָם
  choice: Kopf für Kopf
  rationale: Wörtlich steht »nach ihren Schädeln/Köpfen«; gemeint ist die individuelle Zählung. »Kopf für Kopf« bewahrt sowohl das Bild als auch den idiomatischen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht administrativem Ton entsprechend dem Zählungskontext. Historische Sozialbegriffe wie »Sippen« und »Vaterhäuser« bleiben erhalten. Der Fußnotenmarker steht unmittelbar nach dem Satz, dessen beide hebräischen Zählungsidiome er erläutert.
