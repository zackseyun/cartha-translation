    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Die Leviten aber
  rationale: Das וְ markiert hier im Zusammenhang den Gegensatz zu den zuvor gezählten Stämmen. „Die Leviten aber“ gibt diesen Kontrast in natürlichem Deutsch wieder.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: nach dem Stamm ihrer Vorfahren
  rationale: מַטֶּה bezeichnet im Zusammenhang der Volkszählung den Stamm; אֲבֹתָם verweist auf die väterliche beziehungsweise vorfahrenschaftliche Abstammung. Die Formulierung bleibt nahe am Hebräischen und ist zugleich verständlich.
- source_word: לֹא הָתְפָּקְדוּ
  choice: wurden nicht erfasst
  rationale: Der Hitpael von פקד bezeichnet hier die Aufnahme in die amtliche Zählung. „Erfasst“ lässt sowohl das Zählen als auch das Registrieren anklingen.
- source_word: בְּתוֹכָם
  choice: nicht zusammen mit ihnen
  rationale: בְּתוֹכָם bedeutet wörtlich „in ihrer Mitte/unter ihnen“ und bezeichnet hier die Nichtaufnahme in die Zählung der übrigen Stämme.
