  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: de
  text: Die Leviten jedoch wurden nach dem Stamm ihrer Väter[a] nicht unter ihnen gezählt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach ihrem väterlichen Stamm«.'
