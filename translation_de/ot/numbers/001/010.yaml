  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: de
  text: 'Für die Söhne Josefs: für Ephraim Elischama, Sohn Ammihuds; für Manasse Gamaliel, Sohn Pedazurs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Für die Söhne Josefs
  rationale: לְ führt in der Zählliste die Stammeszuordnung ein; בְּנֵי bedeutet wörtlich »Söhne«. Die Formulierung bewahrt die hebräische Gestalt und bezeichnet hier die durch Ephraim und Manasse vertretenen Zweige Josefs.
- source_word: לְאֶפְרַיִם
  choice: für Ephraim
  rationale: Das wiederholte לְ kennzeichnet die konkrete Zuordnung innerhalb der Söhne Josefs. Der Kontext macht deutlich, dass Ephraims Stamm gemeint ist, sodass »Stamm« nicht ergänzt werden muss.
- source_word: אֱלִישָׁמָע
  choice: Elischama
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenschreibung transkribiert.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die Ergänzung des deutschen Artikels ergibt eine natürliche appositionelle Namensformel, ohne den Sinn der hebräischen Status-constructus-Verbindung zu verändern.
- source_word: עַמִּיהוּד
  choice: Ammihud
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenschreibung transkribiert.
- source_word: לִמְנַשֶּׁה
  choice: für Manasse
  rationale: Parallel zu »für Ephraim« bezeichnet לְ die Zuordnung zum zweiten josefitischen Stamm; eine ausdrückliche Ergänzung von »Stamm« ist nicht erforderlich.
- source_word: גַּמְלִיאֵל
  choice: Gamliël
  rationale: Die Schreibung gibt den hebräischen Namen in einer im Deutschen gut lesbaren Form wieder; das Trema zeigt, dass i und e getrennt gesprochen werden.
- source_word: פְּדָהצוּר
  choice: Pedazur
  rationale: Der Personenname wird in einer geläufigen deutschen Transkription wiedergegeben.
