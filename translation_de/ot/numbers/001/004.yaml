  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: de
  text: Und mit euch soll aus jedem Stamm je ein Mann sein, ein Mann, der das Oberhaupt seines Vaterhauses ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Mann, der der Anführer seiner väterlichen Sippe ist“. Wörtlich steht im Hebräischen „ein Mann, Haupt seines Vaterhauses“. Gemeint ist der führende männliche Vertreter eines patrilinearen Hausverbandes oder einer Sippe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתְּכֶם
  choice: Und bei euch
  rationale: Die Präpositionalphrase bezeichnet die Männer, die Mose und Aaron bei der Zählung begleiten sollen. „Bei euch“ ist natürlich und gibt die begleitende Anwesenheit wieder.
- source_word: יִהְיוּ
  choice: soll … sein
  rationale: Das Imperfekt hat im Zusammenhang anordnende bzw. zukünftige Kraft. Die Singularform im Deutschen entspricht der distributiven Formulierung „aus jedem Stamm ein Mann“.
- source_word: אִישׁ אִישׁ
  choice: aus jedem Stamm ein Mann
  rationale: Die Wiederholung von אִישׁ ist distributiv und bezeichnet je einen Vertreter aus jedem Stamm; im Deutschen wird dies natürlich mit „aus jedem Stamm ein Mann“ ausgedrückt.
- source_word: לַמַּטֶּה
  choice: Stamm
  rationale: מַטֶּה bezeichnet hier im Zusammenhang der Volkszählung einen israelitischen Stamm, nicht einen wörtlichen Stab.
- source_word: אִישׁ רֹאשׁ
  choice: jeweils das Oberhaupt
  rationale: Die Apposition bestimmt jeden ausgewählten Mann als führenden Vertreter. „Oberhaupt“ bewahrt die Leitungsbedeutung von רֹאשׁ und klingt im Deutschen natürlicher als das wörtliche „Kopf“.
- source_word: לְבֵית אֲבֹתָיו
  choice: seines Vaterhauses
  rationale: „Vaterhaus“ ist ein etablierter, relativ formnaher Ausdruck für die patrilineare Großfamilie beziehungsweise Sippenordnung Israels und vermeidet die Verflachung zu bloß „Familie“.
- source_word: הוּא
  choice: jeweils
  rationale: Das selbstständige Pronomen wirkt hervorhebend beziehungsweise wiederaufnehmend. Seine Funktion wird im Deutschen durch „jeweils“ ausgedrückt, ohne eine schwerfällige Wiederholung mit „er“ zu erzeugen.
