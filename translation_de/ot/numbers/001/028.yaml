base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: de
  text: 'Für die Söhne Issachars: nach ihren Abstammungslinien, nach ihren Sippen, nach ihren Vaterhäusern, nach der Zahl der Namen, von zwanzig Jahren an und darüber, jeder, der zum Heeresdienst auszieht[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jeder, der wehrfähig ist«. Wörtlich: »jeder, der zum Heer auszieht«; gemeint sind hier die wehrfähigen Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: Für die Söhne Issachars
  rationale: Die Präposition לְ leitet hier die Stammesrubrik ein und wird idiomatisch mit »für« wiedergegeben. »Söhne« bewahrt die männliche und genealogische Aussage; gemeint sind die männlichen Angehörigen des Stammes.
- source_word: תּוֹלְדֹתָם
  choice: ihre Nachkommen, geordnet
  rationale: תּוֹלְדֹת bezeichnet hier die Abstammungs- beziehungsweise Generationenordnung. Die Formulierung bindet das Wort natürlich an die folgenden Gliederungen an, ohne schriftliche Genealogien vorauszusetzen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet innerhalb des Stammes eine größere verwandtschaftliche Einheit; »Sippe« ist hier genauer als das moderne »Familie«.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: »Vaterhäuser« gibt die feste israelitische Verwandtschafts- und Haushaltsbezeichnung eng am Hebräischen wieder.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: nach der Zahl der Namen
  rationale: Die wörtlich-nahe Wendung bewahrt das Bild einer namentlichen Erfassung der einzelnen Personen.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Dies ist eine natürliche deutsche Wiedergabe der Altersgrenze und schließt das zwanzigste Lebensjahr ein.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Heer auszieht
  rationale: Die Wiedergabe folgt der hebräischen Formulierung enger als eine ausdrückliche Deutung als Dienstfähigkeit und bewahrt zugleich den militärischen Sinn von צָבָא.
theological_decisions:
- issue: Geschlechtsspezifische Sprache der Volkszählung
  choice: jeder, der zum Heer auszieht
  alternative: alle, die Heeresdienst leisten können
  rationale: Das Hebräische ist grammatisch männlich, und der Kontext zählt wehrpflichtige Männer. »Jeder« bewahrt diesen Bezug, ohne die im Partizip nicht ausdrücklich genannte Fähigkeit als Haupttext festzuschreiben.
- issue: Militärische Eignung oder tatsächliches Ausziehen
  choice: der zum Heer auszieht
  alternative: der zum Heeresdienst fähig ist
  rationale: Das Partizip יֹצֵא bedeutet wörtlich »ausziehend«. Im Zählungskontext ist militärische Eignung wahrscheinlich gemeint, doch die wörtliche Ausdrucksweise bleibt im Haupttext erhalten und die funktionale Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Zählungsformel bleibt erkennbar, wird aber durch »geordnet« syntaktisch gegliedert. Der Doppelpunkt bewahrt den Charakter einer fortlaufenden Aufzählung.
