base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: de
  text: 'Von den Söhnen Gads[a], nach ihren Geschlechtern, nach ihren Sippen, nach ihren Vaterhäusern, nach der Zahl der Namen, von zwanzig Jahren an aufwärts, jeder, der zum Heer auszieht[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne Gads“. Gemeint sind hier die männlichen Angehörigen des Stammes, die bei der Zählung erfasst wurden.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „jeder, der zum Kriegsdienst auszieht“; die Wendung bezeichnet im Zusammenhang der Zählung Männer für den militärischen Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: Von den Söhnen Gads
  rationale: Die Präposition ל leitet hier innerhalb der Zählungsformel die Stammesgruppe ein. „Söhne Gads“ bewahrt den hebräischen Verwandtschaftsausdruck und den männlichen Bezug der gemusterten Personen.
- source_word: תּוֹלְדֹתָם
  choice: nach ihren Geschlechtern
  rationale: תולדות bezeichnet hier Abstammungs- beziehungsweise genealogische Gliederungen. „Geschlechter“ gibt die formelhafte Wendung wieder, ohne ausdrücklich schriftliche Register vorauszusetzen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: משׁפחות sind Untergliederungen des Stammes nach Verwandtschaft; „Sippen“ unterscheidet sie im Deutschen von der engeren modernen Familie.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Der technische Verwandtschaftsausdruck bezeichnet die väterlich bestimmten Hausverbände. „Vaterhäuser“ erhält die historische Sozialstruktur des Ausgangstextes.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: nach der Zahl der Namen
  rationale: Die Wendung beschreibt die namentliche Erfassung. Die nahe Wiedergabe lässt offen, ob der Nachdruck auf der Namensliste oder der daraus gewonnenen Anzahl liegt.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Dies ist eine natürliche deutsche Wiedergabe der Altersgrenze, ohne das hebräische „Sohn von zwanzig Jahren“ unidiomatisch nachzubilden.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder, der zum Heer auszieht
  rationale: Die Formulierung bleibt eng bei der Partizipialkonstruktion und vermeidet, die im Kontext naheliegende Wehrfähigkeit ausdrücklich als „fähig“ einzutragen. צבא kann Heer, Kriegsdienst oder militärischen Dienst bezeichnen.
