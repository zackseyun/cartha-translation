base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: de
  text: Sie versammelten die ganze Gemeinde am ersten Tag des zweiten Monats und ließen sich nach ihren Sippen und Vaterhäusern erfassen[a], entsprechend der Zahl der Namen, von zwanzig Jahren an und darüber, Kopf für Kopf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gaben ihre Abstammung an“ beziehungsweise „ließen sich nach ihrer Abstammung in die Geschlechtsregister eintragen“. Das seltene hebräische Verb bezeichnet hier eine Registrierung auf der Grundlage der Abstammung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach ihren Köpfen“ oder „nach ihren Schädeln“; ein Idiom dafür, dass jeder Einzelne gezählt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: sie versammelten
  rationale: Der Hifil von קהל bezeichnet das Veranlassen einer Versammlung. „Sie versammelten“ gibt die aktive Einberufung der ganzen Gemeinde natürlich und genau wieder.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die gemeinschaftlich verfasste Gesamtheit Israels. „Die ganze Gemeinde“ ist im Deutschen verständlich und bewahrt den korporativen Sinn.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: am ersten Tag des zweiten Monats
  rationale: Die hebräische Datumsformel bedeutet idiomatisch den ersten Tag des zweiten Monats.
- source_word: וַיִּתְיַלְדוּ
  choice: ließen sie sich … registrieren
  rationale: Der seltene Hitpael von ילד bezeichnet hier eine genealogisch begründete Erfassung. Die reflexive Formulierung wahrt die Beteiligung der Erfassten; die folgenden Angaben machen die Abstammungsordnung ausdrücklich.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im Stammes- und Zählungskontext eine größere verwandtschaftliche Gruppe; „Sippe“ ist sozial präziser als das allgemeinere „Familie“.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhaus“ bewahrt den technischen Ausdruck für die väterlich bestimmte Abstammungs- und Haushaltsgruppe, ohne ihn zu verallgemeinern.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: entsprechend der Zahl der Namen
  rationale: Die Wendung betont die namentliche Erfassung der einzelnen Personen und behält den Verwaltungscharakter der Zählung bei.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: alle, die zwanzig Jahre oder älter waren
  rationale: Diese natürliche deutsche Altersformel gibt die untere Altersgrenze des Hebräischen genau wieder.
- source_word: לְגֻלְגְּלֹתָם
  choice: Kopf für Kopf
  rationale: Die wörtliche Körpermetapher „nach ihren Schädeln/Köpfen“ ist ein Idiom für die Einzelzählung. „Kopf für Kopf“ bewahrt das Bild und bleibt verständlich.
