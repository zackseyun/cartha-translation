  text: וַ/יִּקַּ֥ח מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן אֵ֚ת הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: de
  text: Da nahmen Mose und Aaron diese Männer, die namentlich bestimmt worden waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahmen
  rationale: לקח bedeutet hier in der fortlaufenden Erzählung am natürlichsten „nehmen“. Das einleitende „Da“ gibt den narrativen Anschluss wieder, ohne eine stärkere Folgerung wie „also“ einzutragen.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Mose und Aaron
  rationale: Die Personennamen folgen den im Deutschen etablierten biblischen Namensformen.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: diese Männer
  rationale: אֲנָשִׁים bezeichnet hier die zuvor einzeln aufgeführten männlichen Vertreter. „Führer“ wäre zwar kontextuell möglich, würde aber eine im Ausdruck selbst nicht ausdrücklich enthaltene Funktion eintragen.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das deutsche Relativpronomen bezieht sich natürlich auf „diese Männer“.
- source_word: נִקְּבוּ
  choice: bestimmt worden waren
  rationale: Der Niphal von נקב bezeichnet hier eine ausdrückliche Identifizierung beziehungsweise Benennung. „Bestimmt“ gibt im administrativen Zusammenhang sowohl die namentliche Identifizierung als auch die Auswahl wieder.
- source_word: בְּשֵׁמוֹת
  choice: namentlich
  rationale: Das Adverb gibt die Wendung „mit/durch Namen“ idiomatisch und präzise als individuelle Identifizierung nach Namen wieder.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die Formulierung bleibt nahe an der hebräischen Erzählstruktur; „namentlich bestimmt“ bewahrt den formellen Charakter der Auswahl, ohne die Männer ausdrücklich als „Führer“ zu bezeichnen.
