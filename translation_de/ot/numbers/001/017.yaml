  terminology: „Mose und Aaron“ folgt den etablierten deutschen biblischen Namensformen. „Männer“ ist hier quellensprachlich und kontextuell passend. Die Formulierung „namentlich bestimmt“ wahrt den formellen Charakter, ohne eine konfessionell geprägte oder übermäßig enge Deutung einzutragen.
