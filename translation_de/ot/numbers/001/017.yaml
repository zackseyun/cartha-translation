  source_fidelity: Die Übersetzung gibt וַיִּקַּח sachgerecht mit „nahmen“ wieder und bewahrt die konkrete Referenz von אֵת הָאֲנָשִׁים הָאֵלֶּה als „diese Männer“. „Namentlich bestimmt worden waren“ trifft den Sinn von נִקְּבוּ בְּשֵׁמוֹת als ausdrücklich bzw. individuell identifiziert und ist im administrativen Kontext vertretbar, ohne die Männer interpretierend als Führer zu bezeichnen.
