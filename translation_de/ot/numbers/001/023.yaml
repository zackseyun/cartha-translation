lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die … Gemusterten
  rationale: Das Substantiv aus der Wurzel פקד bezeichnet in diesem Volkszählungskontext die erfassten beziehungsweise zum Heeresdienst gemusterten Personen. „Gemusterten“ gibt den Kontext knapp und natürlich wieder; das Suffix der 3. Person Plural wird im Deutschen nicht eigens mit „ihre“ wiederholt, weil die Zugehörigkeit im formelhaften Zusammenhang bereits klar ist.
- source_word: לְמַטֵּה שִׁמְעוֹן
  choice: für den Stamm Simeon
  rationale: לְ kennzeichnet hier innerhalb der wiederkehrenden Zählungsformel die Zuordnung zum Stamm. „Für den Stamm Simeon“ entspricht der hebräischen Konstruktion und ist idiomatisches Deutsch.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: '59.300'
  rationale: Die hebräische Zahlenfolge ergibt exakt neunundfünfzigtausenddreihundert; die Ziffernschreibung mit deutschem Tausenderpunkt ist klar und zeitgemäß.
