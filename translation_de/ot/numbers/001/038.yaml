base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: de
  text: 'Von den Söhnen Dans, nach ihren Geschlechterfolgen, ihren Sippen und ihren Vaterhäusern, nach der Zahl der Namen, von zwanzig Jahren an und darüber, jeder Mann, der zum Heer ausziehen konnte[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder Wehrdienstfähige“. Wörtlich: „jeder, der zum Heer auszieht“; die hebräische Wendung bezeichnet im Zusammenhang die zum Kriegsdienst Heranziehbaren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: Die Nachkommen Dans
  rationale: בני bezeichnet hier die männlichen Stammesangehörigen Dans. „Nachkommen“ ist im Deutschen für einen Stammesverband natürlicher als „Söhne“, während „jeder Mann“ später den männlichen Bezug des Heeresaufgebots ausdrücklich wahrt.
- source_word: תּוֹלְדֹתָם
  choice: nach ihrer Geschlechterfolge
  rationale: תולדות meint im Zählungskontext die genealogische Zuordnung beziehungsweise Abstammungsfolge, nicht lediglich biologische Nachkommen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet innerhalb des Stammes eine Sippe und wird so von den anschließenden Vaterhäusern unterschieden.
- source_word: לְבֵית אֲבֹתָם
  choice: ihren Vaterhäusern
  rationale: Der Ausdruck ist eine feste Bezeichnung für die väterlich geordneten Großfamilien beziehungsweise Abstammungsverbände Israels; „Vaterhäuser“ erhält diese soziale Gliederung.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: nach der Zahl der Namen
  rationale: Die formelhafte Wendung beschreibt die namentliche Erfassung der Einzelnen und bleibt in dieser Wiedergabe nahe am Hebräischen.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an
  rationale: Dies gibt die untere Altersgrenze einschließlich aller Älteren in natürlichem modernem Deutsch wieder.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder Mann, der zum Heer ausziehen konnte
  rationale: Die Wendung bezeichnet im Kontext die zum Heeresdienst heranziehbaren Männer. „Zum Heer ausziehen“ bewahrt das Bild des hebräischen Idioms, während „konnte“ seine funktionale Bedeutung ausdrückt.
theological_decisions:
- issue: Geschlechtsspezifische Sprache bei der Heereszählung
  choice: jeder Mann, der zum Heer ausziehen konnte
  alternative: jeder, der zum Heer ausziehen konnte
  rationale: Obwohl כֹּל יוֹצֵא kein eigenes Substantiv für „Mann“ enthält, beziehen sich die maskuline Form, בני und der Zusammenhang der Zählung auf männliche, zum Heeresdienst heranziehbare Stammesangehörige. Die Übersetzung macht diesen Kontextbezug sichtbar, ohne darüber hinauszugehen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst formelhafter Reihung. Der Doppelpunkt bewahrt den syntaktischen Anschluss an den folgenden Vers; die Aufzählung wird nicht durch ein im Hebräischen fehlendes finites Verb zu einem selbstständigen Satz umgestaltet.
