base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: de
  text: Du und Aaron sollt alle Männer in Israel von zwanzig Jahren an, die zum Heer ausziehen,[a] nach ihren Heeresverbänden[b] zählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder, der zum Heer auszieht“. Die hebräische Wendung bezeichnet diejenigen, die für den Heeresdienst infrage kommen; der Zusammenhang dieses Kapitels beschränkt die Zählung auf Männer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach ihren Abteilungen“ beziehungsweise „nach ihren militärischen Einheiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an
  rationale: Die deutsche Wendung gibt die untere Altersgrenze natürlich und präzise wieder; וָמַעְלָה ist darin sinngemäß eingeschlossen.
- source_word: כָּל יֹצֵא צָבָא
  choice: alle Männer …, die … zum Heer ausziehen
  rationale: Der militärische Ausdruck wird anschaulich bewahrt. „Männer“ entspricht dem maskulinen Ausdruck und dem ausdrücklich männlichen Musterungskontext des Kapitels.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Zugehörigkeit zum Volk Israel.
- source_word: תִּפְקְדוּ אֹתָם
  choice: sollt ihr … mustern
  rationale: פקד bezeichnet hier nicht bloß ein Zählen, sondern die amtliche Erfassung für den Heeresdienst; „mustern“ bündelt beide Aspekte passend zum Kontext.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: Die Formulierung wahrt den militärischen Sinn von צבא und drückt die Erfassung gemäß den jeweiligen Einheiten aus.
- source_word: אַתָּה וְאַהֲרֹן
  choice: du und Aaron
  rationale: Die ausdrücklich genannten Beauftragten werden hervorgehoben; Gedankenstriche ergeben im Deutschen eine klare Satzführung.
theological_decisions:
- issue: Geschlechtsspezifische Sprache bei der Eignung zum Heeresdienst
  choice: alle Männer …, die … zum Heer ausziehen
  alternative: alle, die … zum Heer ausziehen
  rationale: Der weitere Zusammenhang der Volkszählung nennt ausdrücklich männliche Personen. „Männer“ macht diese kontextuell und grammatisch begründete Einschränkung sichtbar, ohne darüber hinausgehende Voraussetzungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mustern“ und „Heeresverbände“ halten den militärischen Zusammenhang deutlich, ohne archaisches „Heerscharen“ zu verwenden. Die konkrete hebräische Rede vom Ausziehen zum Heer bleibt im Haupttext erhalten und wird in der Fußnote als militärische Eignungsformel erläutert.
