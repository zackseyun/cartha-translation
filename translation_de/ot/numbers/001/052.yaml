  text: וְ/חָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל מַחֲנֵ֛/הוּ וְ/אִ֥ישׁ עַל דִּגְל֖/וֹ לְ/צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: de
  text: Die Israeliten sollen sich lagern, jeder bei seinem Lager und jeder bei seinem Feldzeichen, nach ihren Heeresverbänden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָנוּ
  choice: sollen sich lagern
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im anweisenden Kontext präskriptiven Sinn. „Sollen sich lagern“ gibt diesen Sinn in natürlichem, würdigem Deutsch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung gibt den referenziellen Sinn von „Söhne Israels“ klar wieder; eine wörtliche Wiedergabe wäre im modernen Deutschen unnötig sperrig und könnte enger verstanden werden als die Gruppenbezeichnung.
- source_word: אִישׁ ... וְאִישׁ
  choice: jeder ... und jeder
  rationale: Die Wiederholung bewahrt die distributive Betonung des Hebräischen. Im Deutschen ist „jeder“ hier natürlich und bezieht sich im militärischen Musterungskontext auf die erfassten Männer.
- source_word: עַל מַחֲנֵהוּ
  choice: bei seinem Lager
  rationale: עַל bezeichnet hier räumliche beziehungsweise organisatorische Zuordnung. „Bei seinem Lager“ wahrt diese Offenheit, ohne eine genaue Position festzulegen.
- source_word: דִּגְלוֹ
  choice: bei seinem Feldzeichen
  rationale: דֶּגֶל bezeichnet das Kennzeichen beziehungsweise die Standarte einer militärisch oder stammesmäßig geordneten Gruppe. „Feldzeichen“ ist präzise, verständlich und weniger modern-flaggenhaft als „Flagge“.
- source_word: לְצִבְאֹתָם
  choice: nach ihren Heeresverbänden
  rationale: צָבָא bezeichnet hier die gemusterten, militärisch geordneten Verbände. „Heeresverbände“ erhält diesen organisatorisch-militärischen Zug, ohne unmittelbar Kampfhandlungen auszusagen.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, anweisendem Ton. Die parallele Struktur „jeder ... und jeder“ und die Zuordnung durch zweimaliges „bei“ spiegeln die hebräische Satzführung, ohne unnatürlich zu wirken.
