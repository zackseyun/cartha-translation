  text: לִ/בְנֵ֤י יוֹסֵף֙ לִ/בְנֵ֣י אֶפְרַ֔יִם תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: de
  text: 'Von den Nachkommen Josefs, von den Nachkommen Ephraims: nach ihren Geschlechtern, nach ihren Sippen, nach ihren Vaterhäusern, nach der Zahl der Namen, von zwanzig Jahren an und darüber, alle Männer, die zum Kriegsdienst ausziehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle, die zum Heeresdienst ausrücken“. Wörtlich spricht das Hebräische von allen, die „zum Heer“ beziehungsweise zum Kriegsdienst hinausgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף / לִבְנֵי אֶפְרַיִם
  choice: Von den Nachkommen Josefs / Von den Nachkommen Ephraims
  rationale: בְּנֵי bezeichnet hier die Stammesnachkommen. „Nachkommen“ gibt den genealogischen Sinn im heutigen Deutsch natürlicher wieder als das missverständliche „Söhne“.
- source_word: תּוֹלְדֹתָם
  choice: nach ihren Geschlechtern
  rationale: Das Wort bezeichnet in dieser Zählungsformel die genealogische Gliederung beziehungsweise Abstammung; „Geschlechter“ bewahrt den formellen Charakter.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה meint innerhalb der Stammesordnung eine größere Verwandtschaftsgruppe und nicht bloß die moderne Kernfamilie.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Die sachsprachliche Wiedergabe erhält die im Hebräischen ausdrücklich väterliche Abstammungsordnung.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: die Namen … einzeln gezählt
  rationale: Die idiomatische deutsche Formulierung vermittelt die namentliche Einzelzählung, die mit der hebräischen Wendung gemeint ist.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: die zwanzig Jahre alt oder älter waren
  rationale: Dies gibt die Altersgrenze klar und natürlich wieder.
- source_word: כֹּל יֹצֵא צָבָא
  choice: alle Männer …, die … zum Kriegsdienst auszogen
  rationale: Der Kontext bezeichnet Männer im wehrfähigen Alter. „Zum Kriegsdienst ausziehen“ bewahrt sowohl den militärischen Sinn von צָבָא als auch das Bewegungsverb יֹצֵא.
theological_decisions:
- issue: Geschlechtsspezifischer Bezug der Zählung
  choice: alle Männer
  alternative: alle / jeder, der
  rationale: Die Altersangabe „vom Sohn von zwanzig Jahren an“ und die militärische Musterung beziehen sich im Kontext ausdrücklich auf männliche Stammesangehörige; eine geschlechtsneutrale Wiedergabe würde diesen Bezug verwischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarisch-elliptische Listenstil des Hebräischen wurde für einen verständlichen deutschen Satz mit „wurden … gezählt“ ergänzt; die traditionellen Gliederungsbegriffe „Geschlechter“, „Sippen“ und „Vaterhäuser“ bleiben erhalten.
