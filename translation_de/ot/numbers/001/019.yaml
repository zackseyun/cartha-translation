  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַֽ/יִּפְקְדֵ֖/ם בְּ/מִדְבַּ֥ר סִינָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: de
  text: Wie Jahwe Mose geboten hatte, so musterte[a] er sie in der Wüste Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zählte er sie“ beziehungsweise „nahm er sie in die Zählung auf“. Das hebräische Verb kann das Mustern, Registrieren oder Zählen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: wie … so
  rationale: Die deutsche Korrelativkonstruktion gibt die Übereinstimmung der Musterung mit dem vorausgehenden göttlichen Gebot natürlich und deutlich wieder.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Verb bedeutet „gebieten, befehlen“; das Plusquamperfekt macht deutlich, dass das Gebot der Musterung vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: אֶת kennzeichnet das direkte Objekt und erhält im Deutschen keine eigene Entsprechung.
- source_word: וַיִּפְקְדֵם
  choice: musterte er sie
  rationale: Im Zusammenhang der Erfassung Israels bezeichnet פקד nicht bloß ein allgemeines Zählen, sondern das geordnete Erfassen beziehungsweise Registrieren der Wehrfähigen; „mustern“ wahrt diese Nuance.
- source_word: בְּמִדְבַּר סִינָי
  choice: in der Wüste Sinai
  rationale: Die feste geografische Wendung ist im modernen Deutschen natürlich und bewahrt die hebräische Genitivverbindung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mustern“ trifft den Zensus- und Heereskontext präziser als das allgemeinere „zählen“; die Fußnote bewahrt die Bedeutungsbreite. Der masoretische Abschnittsschluss nach dem Vers erfordert keine Darstellung im Fließtext.
