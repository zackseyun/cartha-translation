base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: de
  text: 'Von den Söhnen Manasses: nach ihren Geschlechtern, nach ihren Sippen, nach ihren Vaterhäusern, nach der Zahl der Namen, von zwanzig Jahren an aufwärts, jeder Mann, der zum Heeresdienst auszieht:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder Mann, der zum Krieg auszieht“. Die hebräische Formel bezeichnet im Zusammenhang die Männer, die für den Heeresdienst erfasst wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: Von den Söhnen Manasses
  rationale: Das Präfix ל leitet in der wiederkehrenden Zählungsformel die Stammesgruppe ein. „Von den Söhnen Manasses“ bewahrt den genealogischen Ausdruck und schließt natürlich an den elliptischen Kontext an.
- source_word: תּוֹלְדֹתָם
  choice: ihre Geschlechterfolge
  rationale: תּוֹלְדוֹת bezeichnet hier die genealogische Abstammungs- beziehungsweise Gliederungsfolge. „Geschlechterfolge“ gibt diesen Sinn knapp wieder, ohne ihn auf bloße Generationenabstände zu verengen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im Zusammenhang der Stammeszählung eine größere verwandtschaftliche Untergruppe; „Sippe“ ist präziser als das moderne, oft eng verstandene „Familie“.
- source_word: לְבֵית אֲבֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Die feste israelitische Verwandtschaftsbezeichnung wird sachlich und strukturell nah mit „Vaterhäuser“ wiedergegeben.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: nach der Zahl der Namen
  rationale: Die Wendung beschreibt die namentliche Erfassung und Zählung der Einzelnen; die formelhafte Zählungssprache bleibt erhalten.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Die hebräische Altersformel setzt die Untergrenze bei zwanzig Jahren. Die Wiedergabe ist im Deutschen verständlich und bleibt der Formulierung des Ausgangstextes nahe.
- source_word: כֹּל יֹצֵא צָבָא
  choice: jeder Mann, der zum Heer auszieht
  rationale: Die Wendung bezeichnet im Kontext die wehrfähigen Männer. „Zum Heer auszieht“ bewahrt das konkrete Bild von יצא und die militärische Bedeutung von צבא, ohne die Wendung ausschließlich als Teilnahme an einem einzelnen Krieg zu deuten.
theological_decisions:
- issue: Geschlechtsspezifische Sprache der Musterung
  choice: jeder Mann, der zum Heer auszieht
  alternative: jeder, der zum Heer auszieht
  rationale: Der Zusammenhang zählt männliche Israeliten ab zwanzig Jahren für den Heeresdienst. „Jeder Mann“ macht den kontextuell spezifischen männlichen Bezug deutlich, statt ihn geschlechtsneutral wiederzugeben.
- issue: Bedeutungsumfang von צָבָא
  choice: zum Heer auszieht
  alternative: zum Kriegsdienst auszieht
  rationale: צָבָא kann Heer, Heeresdienst oder Kriegszug bezeichnen. Die gewählte Formulierung erhält die militärische Bedeutung und lässt offen, ob primär Zugehörigkeit zum Heer, Dienstfähigkeit oder konkreter Kriegszug im Vordergrund steht.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst formelhafter Zählungssyntax. Der Doppelpunkt wahrt den Charakter des Verses als Stammesüberschrift innerhalb der fortlaufenden Aufzählung.
