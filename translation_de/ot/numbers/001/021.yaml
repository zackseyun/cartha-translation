lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: die Gemusterten
  rationale: Die Form bezeichnet hier die bei der Zählung erfassten wehrfähigen Männer. „Die Gemusterten“ gibt die amtliche Erfassung knapp und im Deutschen natürlich wieder; der unmittelbare Kontext erklärt, wer gemeint ist.
- source_word: לְמַטֵּה
  choice: aus dem Stamm
  rationale: Die Präposition לְ kennzeichnet in dieser Zählungsformel die Stammeszugehörigkeit. „Aus dem Stamm“ ist idiomatisch und bewahrt den Bezug der Erfassten zu Ruben.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Gebräuchliche deutsche Form des Personen- und Stammesnamens.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '46.500'
  rationale: Die Zahl wird in heutiger deutscher Schreibweise wiedergegeben und bewahrt den exakten Gesamtwert von sechsundvierzigtausendfünfhundert.
