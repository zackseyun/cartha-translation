  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: de
  text: Und die Israeliten sollen sich dem Zelt der Begegnung nicht mehr nähern, damit sie nicht Schuld auf sich laden und sterben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sünde tragen“. Der hebräische priesterlich-rechtliche Ausdruck kann bedeuten, Schuld beziehungsweise die Haftung für eine Verfehlung und deren Folgen zu tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: sich ... nähern
  rationale: Das Verb קרב bezeichnet das Nahen oder Herantreten; „sich nähern“ ist im modernen Deutschen natürlich und bewahrt zugleich den kultischen Sinn des Herantretens an den heiligen Bereich.
- source_word: עוֹד
  choice: nicht mehr
  rationale: Zusammen mit לֹא bedeutet עוֹד idiomatisch „nicht mehr“ beziehungsweise „nicht wieder“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bildet den hebräischen Ausdruck formal ab. Gemeint ist Israel als Gemeinschaft; die Quellform wird bewahrt, ohne sie durch eine interpretierende Verallgemeinerung zu ersetzen.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Diese transparente Wiedergabe entspricht den Bestandteilen des hebräischen Heiligtumsbegriffs und ist verständlicher als das traditionelle Fremdwort „Stiftshütte“.
- source_word: לָשֵׂאת חֵטְא
  choice: damit sie nicht Sünde tragen
  rationale: Die Formulierung bewahrt das konkrete priesterlich-rechtliche Bild des Hebräischen. Es kann das Tragen von Schuld beziehungsweise der Haftung und Folgen für eine Verfehlung bezeichnen; diese Bedeutungsbreite wird in der Fußnote erläutert.
- source_word: לָמוּת
  choice: und sterben
  rationale: Der zweite Infinitiv führt die tödliche Folge des unerlaubten Nahens knapp fort und entspricht der hebräischen Reihung.
theological_decisions:
- issue: Ob der unerlaubte Charakter des Nahens und die daraus entstehende Schuld ausdrücklich erklärt werden sollen
  choice: 'Die knappe hebräische Formulierung wird beibehalten: Sie sollen sich dem Zelt der Begegnung nicht mehr nähern, damit sie nicht Sünde tragen und sterben.'
  alternative: Sie sollen sich dem Zelt der Begegnung nicht mehr unbefugt nähern, sonst laden sie Schuld auf sich und sterben.
  rationale: Der unmittelbare Zusammenhang betrifft das den Leviten und Priestern zugewiesene Nahen zum Heiligtum. Der Vers selbst sagt jedoch weder ausdrücklich „unbefugt“ noch ersetzt er das Bild des Sündetragens durch eine abstrakte Erklärung. Die Übersetzung wahrt daher die rechtlich-theologische Spannung des Wortlauts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zelt der Begegnung“ ist transparent und gegenwärtig verständlich; „Sünde tragen“ bewahrt bewusst die markante Bildsprache des Ausgangstextes und wird durch die Fußnote erschlossen.
