id: NUM.18.30
reference: Numbers 18:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בַּ/הֲרִֽימְ/כֶ֤ם אֶת חֶלְבּ/וֹ֙ מִמֶּ֔/נּוּ וְ/נֶחְשַׁב֙ לַ/לְוִיִּ֔ם כִּ/תְבוּאַ֥ת גֹּ֖רֶן וְ/כִ/תְבוּאַ֥ת יָֽקֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: de
  text: 'Und du sollst zu ihnen sagen: »Wenn ihr das Beste[a] davon als Abgabe erhebt, wird es den Leviten wie der Ertrag der Tenne und wie der Ertrag der Kelter angerechnet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sein Fett«; der Ausdruck bezeichnet hier bildlich den reichsten oder besten Anteil des Ertrags.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: Und du sollst zu ihnen sagen
  rationale: Die direkte Anweisung an Mose im maskulinen Singular wird klar und in würdigem, modernem Deutsch wiedergegeben.
- source_word: בַּהֲרִימְכֶם
  choice: Wenn ihr … als Abgabe erhebt
  rationale: Der Hifil von רום bezeichnet hier das Abheben beziehungsweise Darbringen eines Abgabenanteils. Die Formulierung wahrt das Bild des Heraushebens und verdeutlicht zugleich den kultisch-rechtlichen Zusammenhang.
- source_word: חֶלְבּוֹ
  choice: das Beste[a]
  rationale: Wörtlich bedeutet der Ausdruck „sein Fett“, bezeichnet bei Erzeugnissen jedoch idiomatisch den reichsten oder besten Anteil. „Das Beste“ ist im Deutschen natürlich und sachlich passend.
- source_word: מִמֶּנּוּ
  choice: davon
  rationale: Das Pronomen verweist auf die zuvor genannte Abgabe beziehungsweise den Zehnten, aus dem der beste Anteil herausgenommen wird.
- source_word: וְנֶחְשַׁב
  choice: wird … angerechnet
  rationale: 'Die passive Form von חשב hat einen rechtlich-buchhalterischen Sinn: Der Anteil wird als entsprechender landwirtschaftlicher Ertrag gewertet.'
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Der Dativ bezeichnet diejenigen, denen der erhobene Anteil angerechnet wird.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: wie der Ertrag der Tenne
  rationale: תבואה bezeichnet Ertrag oder Erzeugnis; „Ertrag der Tenne“ bewahrt das landwirtschaftliche Bild und die knappe Parallelstruktur.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: und wie der Ertrag der Kelter
  rationale: יֶקֶב bezeichnet eine Wein- beziehungsweise Saftkelter. „Kelter“ ist präzise, geläufig und entspricht der parallelen Wendung mit der Tenne.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede wechselt entsprechend dem Hebräischen vom Singular („du“, Mose) zum Plural („ihr“, die Leviten). Die kultisch-rechtliche Bedeutung von רום wird mit „als Abgabe erheben“ verständlich gemacht, ohne den Vorgang auf eine bestimmte spätere Opferterminologie festzulegen.
