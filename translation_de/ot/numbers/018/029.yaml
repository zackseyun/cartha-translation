source:
  edition: WLC
  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: de
  text: 'Von allen euren Gaben sollt ihr die ganze Abgabe für Jahwe absondern: von allem Besten daran[a] den daraus geheiligten Anteil[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von all seinem Fett“, das heißt: von seinem reichsten oder besten Teil.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen heiligen Anteil“. Das hebräische Wort kann sonst auch „Heiligtum“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: Von allen euren Gaben
  rationale: מִן mit כֹּל bezeichnet die Gesamtheit, aus der etwas entnommen wird. „Gaben“ gibt מַתָּנוֹת weit und kultisch passend wieder.
- source_word: תָּרִימוּ
  choice: sollt ihr … absondern
  rationale: Der Hifil von רוּם gehört hier zur kultischen Abgabensprache. „Absondern“ vermittelt in natürlichem Deutsch, dass ein Anteil herausgenommen und für Gott bestimmt wird; das wörtliche Bild des Emporhebens wäre im Deutschen missverständlich.
- source_word: כָּל תְּרוּמַת יְהוָה
  choice: jede Abgabe für Jahwe
  rationale: תְּרוּמָה bezeichnet einen herausgehobenen beziehungsweise ausgesonderten Beitrag. „Abgabe für Jahwe“ drückt ihre kultische Bestimmung aus, ohne eine bestimmte Ritualform hinzuzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִכָּל חֶלְבּוֹ
  choice: von allem Besten daran
  rationale: חֵלֶב bedeutet wörtlich „Fett“, bezeichnet aber übertragen den reichsten oder besten Teil. Da hier verschiedene Gaben gemeint sind, ist die übertragene Bedeutung im Haupttext sachgerecht; die konkrete Bildsprache bleibt in der Fußnote sichtbar.
- source_word: אֶת מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: den daraus geheiligten Anteil
  rationale: מִקְדָּשׁ bezeichnet hier im Zusammenhang den heiligen beziehungsweise geheiligten Teil der Gabe. „daraus“ gibt מִמֶּנּוּ wieder und macht die Entnahme aus der jeweiligen Gabe verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname. Die Umschrift „Jahwe“ bewahrt den Unterschied zwischen Eigenname und Herrentitel.
- issue: Bezug und Bedeutung von מִקְדְּשׁוֹ
  choice: der daraus geheiligte Anteil
  alternative: sein heiliger Anteil / sein Heiligtum
  rationale: Der Kontext verlangt einen aus den Gaben ausgesonderten Teil. Die Übersetzung wahrt den kultischen Heiligkeitsbegriff, ohne das Wort räumlich als Heiligtum festzulegen; die formnähere Alternative wird angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Absondern“ wahrt die kultische Handlung, ohne das im Deutschen unklare wörtliche „emporheben“ zu verwenden. Der Doppelpunkt bildet die erläuternde Apposition des zweiten Halbverses ab.
