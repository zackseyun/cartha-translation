  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: de
  text: 'Denn den Zehnten der Israeliten, den sie dem HERRN als Abgabe darbringen, habe ich den Leviten als Erbbesitz gegeben. Darum habe ich zu ihnen gesagt: »Inmitten der Israeliten sollen sie keinen Erbbesitz erhalten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: Zehnten
  rationale: Die etablierte deutsche Bezeichnung gibt die kultisch-rechtliche Abgabe präzise und verständlich wieder.
- source_word: יָרִימוּ
  choice: darbringen
  rationale: Das Verb bedeutet wörtlich „erheben“, bezeichnet hier aber idiomatisch das Absondern und Darbringen einer Abgabe; „darbringen“ ist im Deutschen natürlich und bewahrt den kultischen Sinn.
- source_word: תְּרוּמָה
  choice: Abgabe
  rationale: „Abgabe“ ist eine sachlich passende, allgemein verständliche Wiedergabe für die dem HERRN ausgesonderte Gabe.
- source_word: נַחֲלָה
  choice: Erbbesitz
  rationale: Der Ausdruck bezeichnet den zugeteilten, bleibenden Besitz beziehungsweise Erbanteil; „Erbbesitz“ hält diesen Zusammenhang an beiden Stellen fest.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: Inmitten der Israeliten
  rationale: Bewahrt die räumlich-soziale Formulierung des Hebräischen, ohne sie unnötig als bloßen Besitzvergleich umzudeuten.
theological_decisions:
- issue: Das Tetragramm יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wahrt die Unterscheidung des Gottesnamens, ohne eine unsichere Aussprache festzulegen.
- issue: Art des levitischen Erbteils
  choice: Der Zehnte wird ausdrücklich als Erbbesitz der Leviten bezeichnet.
  alternative: Der Zehnte wird lediglich als Unterhalt oder Entlohnung bezeichnet.
  rationale: Die Übersetzung erhält die theologisch und rechtlich bedeutsame Wiederholung von נַחֲלָה und erklärt sie nicht weiter als der Ausgangstext.
- issue: Bezug von אָמַרְתִּי לָהֶם
  choice: „Darum habe ich über sie gesagt“
  alternative: „Darum habe ich zu ihnen gesagt“
  rationale: ל mit אמר kann den Adressaten oder die Person bezeichnen, über die etwas gesagt wird. Da der folgende Satz in der dritten Person steht, passt „über sie“ syntaktisch besser, ohne den Inhalt zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Wiederholung von „Erbbesitz“ spiegelt bewusst die hebräische Leitwortstruktur; „Israeliten“ ist die natürliche moderne Wiedergabe von „Söhne Israels“.
