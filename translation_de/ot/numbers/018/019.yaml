source:
  edition: WLC
  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: de
  text: Alle Abgaben von den heiligen Gaben, die die Israeliten für den HERRN darbringen, habe ich dir und deinen Söhnen und Töchtern bei dir als ewige Ordnung gegeben. Es ist ein ewiger Salzbund vor dem HERRN für dich und deine Nachkommen bei dir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּרוּמֹת
  choice: Abgaben
  rationale: Bezeichnet hier kultische Anteile, die für den HERRN ausgesondert und den Priestern zugewiesen werden; „Abgaben“ ist im Deutschen klarer als das missverständliche „Hebopfer“.
- source_word: יָרִימוּ
  choice: abheben
  rationale: Bewahrt das Bild des hebräischen Verbs „erheben/abheben“ und seinen kultischen Sinn, ohne eine bestimmte Opferhandlung stärker festzulegen als der Ausgangstext.
- source_word: חָק עוֹלָם
  choice: ewige Ordnung
  rationale: Gibt die dauerhaft festgesetzte Regelung würdig und verständlich wieder; „ewig“ bewahrt die Zeitangabe עוֹלָם.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: ewiger Salzbund
  rationale: Behält die markante und kulturell geprägte Metapher wörtlich bei, statt ihre möglicherweise mit Dauerhaftigkeit und Verbindlichkeit verbundene Bedeutung in den Text einzutragen.
- source_word: זַרְעֲךָ
  choice: deine Nachkommen
  rationale: Natürliche deutsche Wiedergabe des kollektiv gebrauchten „Samen“ im Sinn der Nachkommenschaft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wahrt die erkennbare Besonderheit des Gottesnamens und entspricht dem konsultierten POB-Text, ohne eine unsichere Aussprache festzuschreiben.
- issue: Bedeutung des Salzbundes
  choice: Metapher unverändert stehen lassen
  alternative: als unauflöslichen oder dauerhaften Bund ausdeuten
  rationale: Der Text selbst erklärt die Metapher nicht; ihre theologische und kulturelle Spannung soll nicht durch eine interpretierende Paraphrase aufgelöst werden.
- issue: Reichweite von עוֹלָם
  choice: ewig
  alternative: dauerhaft / für alle Zeiten
  rationale: Die knappe, starke Zeitbestimmung des Hebräischen wird beibehalten, ohne hier systematisch-theologische Folgerungen über die spätere Geltung der priesterlichen Ordnung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung wurde für natürliche Lesbarkeit geglättet, während die Wiederholung „bei dir“ und die ungewöhnliche Wendung „Salzbund“ als Merkmale des Ausgangstextes erhalten bleiben.
