  source_fidelity: 'Die Grundstruktur und die wesentlichen Begriffe sind zutreffend wiedergegeben: die kultischen Abgaben, die Zuweisung an Aaron und seine Söhne und Töchter, die dauerhafte Satzung sowie der nicht ausgelegte „Salzbund“. „Abheben“ ist jedoch im heutigen Deutsch für das kultische Erheben/Darbringen missverständlich und unidiomatisch; es wird meist mit Geldabhebung oder dem Abnehmen eines Gegenstands verbunden.'
  naturalness: Der Satzbau ist insgesamt klar und dem würdigen Register angemessen. Die Verbindung „Abgaben ... abheben“ klingt allerdings unnötig technisch und im modernen Standarddeutsch sachfremd. „Darbringen“ ist in diesem kultischen Zusammenhang natürlich und verständlich.
  terminology: „Abgaben“, „ewige Ordnung“, „Salzbund“, „der HERR“ und „Nachkommen“ sind tragfähige Entscheidungen. Der Salzbund soll ohne interpretierende Erklärung stehen bleiben.
