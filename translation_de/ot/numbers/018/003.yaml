source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: de
  text: Sie sollen deinen Dienst und den Dienst für das ganze Zelt versehen. Doch den Geräten des Heiligtums[a] und dem Altar dürfen sie nicht nahekommen, damit weder sie noch ihr sterbt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den heiligen Geräten“ oder „den heiligen Gegenständen“.'
    reason: כְּלֵי הַקֹּדֶשׁ kann als „Geräte des Heiligtums“ oder als „heilige Geräte/Gegenstände“ verstanden werden.
  - marker: b
    text: 'Wörtlich: „und sie sollen nicht sterben, auch sie, auch ihr“. Im negativen Zusammenhang bedeutet dies idiomatisch: „damit weder sie noch ihr sterbt“.'
    reason: Die Fußnote macht die hebräische Konstruktion גַם … גַם und ihre idiomatische deutsche Wiedergabe transparent.
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: Sie sollen den ihnen von dir übertragenen Dienst … wahrnehmen
  rationale: Die Verbindung von שׁמר und מִשְׁמֶרֶת bezeichnet das zuverlässige Wahrnehmen einer anvertrauten Aufgabe. Die Formulierung gibt zugleich den Bezug des Suffixes der 2. Person Singular auf Aaron natürlich wieder.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: und den Dienst am ganzen Zelt
  rationale: Die Wiederholung von מִשְׁמֶרֶת wird durch „Dienst“ bewahrt; כָּל und die einfache Bedeutung von אֹהֶל erscheinen als „ganzes Zelt“, ohne vorschnell „Stiftshütte“ einzusetzen.
- source_word: אַךְ
  choice: Doch
  rationale: Das Wort grenzt die zuvor genannte Zuständigkeit deutlich ein und leitet die folgende Ausnahme beziehungsweise Beschränkung ein.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: den Geräten des Heiligtums
  rationale: כְּלֵי kann Geräte, Gegenstände oder Gefäße bezeichnen. „Geräte des Heiligtums“ wahrt die konstruktive Verbindung und legt die Gegenstände nicht unnötig auf Gefäße fest.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יִקְרָבוּ
  choice: und dem Altar dürfen sie nicht nahekommen
  rationale: קרב behält seine räumliche Bedeutung „nahekommen“; „dürfen nicht“ drückt das Verbot in modernem Deutsch klar aus.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: damit weder sie noch ihr sterbt
  rationale: Im negativen Zusammenhang wird גַם … גַם idiomatisch mit „weder … noch“ wiedergegeben. Der finale beziehungsweise konsequenzvermeidende Zusammenhang wird mit „damit“ natürlich ausgedrückt.
theological_decisions:
- issue: Adressat und Aufgabenverteilung
  choice: Aaron wird in der 2. Person Singular als Verantwortlicher angesprochen; die Leviten nehmen einen ihnen von ihm übertragenen Dienst wahr.
  alternative: Eine undifferenzierte Anrede an die Priesterschaft insgesamt.
  rationale: Das Suffix in מִשְׁמַרְתְּךָ ist maskulin Singular und bezieht sich im Kontext auf Aaron; die Übersetzung erhält die Unterscheidung zwischen seinem Verantwortungsbereich und dem Dienst der Leviten.
- issue: Reichweite der Todeswarnung
  choice: 'Die Todesgefahr betrifft ausdrücklich beide Gruppen: die Leviten und die angesprochenen Priester um Aaron.'
  alternative: Die Warnung betreffe nur die Leviten.
  rationale: גַם הֵם גַּם אַתֶּם nennt ausdrücklich „sie“ ebenso wie „ihr“ und darf nicht auf nur eine Gruppe verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dienst wahrnehmen“ ist verständlich und trägt den kultischen Pflichtcharakter, ohne archaisches „Obhut halten“. „Zelt“ folgt dem hebräischen אֹהֶל; „Geräte des Heiligtums“ wahrt die lexikalische Offenheit von כְּלֵי.
