  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: de
  text: Und ihr werdet deswegen keine Schuld auf euch laden, wenn ihr das Beste davon als Abgabe absondert[a]. Ihr sollt die heiligen Gaben der Israeliten[b] nicht entweihen, und ihr werdet nicht sterben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann חֶלֶב „Fett“ bedeuten; bei Abgaben bezeichnet das Wort oft den reichsten oder besten Teil.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „die heiligen Dinge der Söhne Israels“; gemeint sind hier die geheiligten Gaben des Volkes Israel.
    reason: lexical_alternative
  - marker: c
    text: Die Schlusswendung kann dem Zusammenhang nach auch als „damit ihr nicht sterbt“ oder als Warnung vor dem Tod verstanden werden; das Hebräische verbindet sie lediglich mit „und“.
    reason: ambiguity
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: keine Schuld auf euch laden
  rationale: Die Verbindung von נשׂא mit חטא bezeichnet das Tragen beziehungsweise Auf-sich-Laden von Schuld. Die deutsche Wendung gibt den haftungsbezogenen Sinn natürlich und zugleich quellennah wieder.
- source_word: עָלָיו
  choice: deswegen
  rationale: Die Präposition mit Suffix verweist auf die zuvor behandelte Abgabe und bezeichnet die Schuldhaftung in dieser Angelegenheit.
- source_word: בַּהֲרִימְכֶם
  choice: wenn ihr ... als Abgabe absondert
  rationale: Das Hifil von רום kann im kultischen Zusammenhang das Herausheben beziehungsweise Darbringen einer Abgabe bezeichnen. „Als Abgabe absondern“ vermittelt Funktion und Bild in verständlichem Deutsch.
- source_word: חֶלְבּוֹ
  choice: das Beste davon
  rationale: חלב bedeutet wörtlich „Fett“, bezeichnet bei Abgaben aber idiomatisch den reichsten oder besten Teil. Da hier auch Erzeugnisse gemeint sind, vermeidet „das Beste“ eine irreführende Beschränkung auf Tierfett.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: die heiligen Gaben der Israeliten
  rationale: קדשים bezeichnet hier die geheiligten Dinge beziehungsweise Gaben des Volkes. „Israeliten“ gibt den festen hebräischen Volksnamen בני ישראל im modernen Deutsch natürlich wieder.
- source_word: תְחַלְּלוּ
  choice: entweihen
  rationale: Das Piel von חלל bezeichnet, etwas Heiliges zu entweihen oder wie etwas Gewöhnliches zu behandeln. „Entweihen“ bewahrt den Gegensatz zwischen heilig und profan.
- source_word: וְלֹא תָמֻתוּ
  choice: und ihr werdet nicht sterben
  rationale: Die Wiedergabe hält die hebräische Koordination und die Verbform fest, ohne die Beziehung ausdrücklich als Zweck oder Warnung festzulegen.
theological_decisions:
- issue: Bedeutung von חלב bei der Abgabe
  choice: das Beste davon
  alternative: sein Fett / seinen erlesensten Teil
  rationale: Der Zusammenhang betrifft den besten Anteil einer Abgabe und nicht ausschließlich tierisches Fett. Die idiomatische Wiedergabe bewahrt den Gedanken, dass der hochwertigste Teil ausgesondert wird.
- issue: Wiedergabe von בני ישראל
  choice: die Israeliten
  alternative: die Söhne Israels / die Kinder Israels
  rationale: Die Wendung ist hier ein üblicher kollektiver Volksname. „Die Israeliten“ ist in modernem Deutsch präzise und schließt das ganze Volk ein, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Verhältnis des abschließenden וְלֹא תָמֻתוּ zum Verbot
  choice: und ihr werdet nicht sterben
  alternative: damit ihr nicht sterbt / sonst werdet ihr sterben
  rationale: Das Hebräische verbindet die Aussage schlicht mit וְ. Die gewählte Fassung vermeidet es, die mögliche Folge-, Zweck- oder Warnbeziehung eindeutiger zu bestimmen, als der Wortlaut erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Fachsprache wird verständlich wiedergegeben, ohne die konkrete Abgabepraxis zu verallgemeinern. Der Satzbau bleibt der hebräischen Abfolge nahe, während „Schuld auf sich laden“ und „als Abgabe absondern“ idiomatisches Deutsch gewährleisten.
