reference: Numbers 18:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: de
  text: Der Levit selbst soll den Dienst am Zelt der Begegnung verrichten, und sie sollen ihre Schuld tragen.[a] Das ist eine ewige Ordnung für alle eure Generationen. Mitten unter den Söhnen Israels[b] sollen sie keinen Erbbesitz erhalten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für ihr Vergehen einstehen“. Die hebräische Wendung kann das Tragen von Schuld wie auch die damit verbundene Verantwortlichkeit oder deren Folgen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „unter den Israeliten“. Wörtlich steht im Hebräischen: „unter den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „sollen sie kein Erbe erben“. Die Wiederholung desselben Wortstamms unterstreicht, dass sie keinen eigenen Stammesanteil am Land erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: soll … verrichten
  rationale: Die Verbform hat im rechtlichen Zusammenhang vorschreibende bzw. futurische Kraft. „Soll … verrichten“ gibt diese angemessen und in Verbindung mit „Dienst“ in natürlichem Deutsch wieder.
- source_word: הַלֵּוִי הוּא
  choice: der Levit selbst
  rationale: Das selbstständige Pronomen הוּא hebt den Leviten hervor. „Selbst“ bewahrt diese Betonung, ohne darüber hinaus Ausschließlichkeit auszudrücken.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: den Dienst am Zelt der Begegnung
  rationale: עֲבֹדָה bezeichnet hier den kultischen Dienst bzw. die damit verbundene Aufgabe. „Dienst am Zelt der Begegnung“ ist präzise und im Deutschen natürlicher als eine Genitivkonstruktion.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: und sie sollen ihre Schuld tragen
  rationale: Die feste rechtlich-kultische Wendung נשא עון kann Schuld, Vergehen oder die daraus erwachsende Haftung und deren Folgen bezeichnen. Die bildhafte Formulierung bleibt erhalten.
- source_word: חֻקַּת עוֹלָם
  choice: eine ewige Ordnung
  rationale: Die Wendung bezeichnet eine dauerhaft geltende Satzung. „Ewige Ordnung“ bewahrt die zeitliche Weite von עוֹלָם und klingt im Deutschen würdig und verständlich.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Die Formulierung drückt die fortdauernde Geltung über die aufeinanderfolgenden Generationen hinweg aus.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: mitten unter den Söhnen Israels
  rationale: Die Übersetzung folgt sowohl der räumlich-sozialen Wendung בְּתוֹךְ als auch dem ausdrücklich maskulinen בְּנֵי יִשְׂרָאֵל.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: sollen sie keinen Erbbesitz erhalten
  rationale: Verb und Substantiv gehören im Hebräischen zum selben Wortstamm. Im Deutschen vermittelt „Erbbesitz erhalten“ den Bezug auf den Stammeslandanteil klar; eine Fußnote weist auf die betonte Wiederholung hin.
theological_decisions:
- issue: Bedeutungsumfang der Wendung נשא עון
  choice: ihre Schuld tragen
  alternative: für ihr Vergehen einstehen / dessen Folgen tragen
  rationale: Die knappe Wendung lässt offen, ob Schuld, Verantwortlichkeit oder die Folgen des Vergehens im Vordergrund stehen. Die Übersetzung bewahrt diese theologische und rechtliche Spannung, statt sie auf Strafe oder Haftung einzuengen.
- issue: Dauer der Satzung in חֻקַּת עוֹלָם
  choice: eine ewige Ordnung
  alternative: eine dauerhafte Ordnung
  rationale: „Ewig“ bildet עוֹלָם unmittelbar ab, ohne im Text festzulegen, wie die Geltungsdauer innerhalb der Bundesordnung systematisch zu bestimmen ist.
- issue: Art des den Leviten verweigerten Erbteils
  choice: keinen Erbbesitz erhalten
  alternative: kein Erbe haben
  rationale: Der Zusammenhang betrifft den Anteil am Landbesitz Israels. „Erbbesitz“ macht diesen konkreten Sinn kenntlich, ohne eine weitergehende theologische Aussage über jedes denkbare Erbe der Leviten einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Die hebräische Betonung in „der Levit selbst“ sowie die idiomatische Spannung von „Schuld tragen“ bleiben erhalten; die im Deutschen schwerfällige Stammwiederholung beim Erben wird verständlich wiedergegeben und in der Fußnote dokumentiert.
