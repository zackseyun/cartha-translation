  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: de
  text: Ihr sollt den Dienst am Heiligtum und den Dienst am Altar versehen, damit kein Zorn mehr über die Israeliten[a] kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“. Gemeint ist das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: Ihr sollt die Aufsicht … wahrnehmen
  rationale: Die Verbindung von שׁמר mit מִשְׁמֶרֶת bezeichnet hier die verantwortliche Bewachung und Wahrnehmung einer priesterlichen Aufgabe. „Die Aufsicht wahrnehmen“ gibt sowohl den Schutz- als auch den Amtsaspekt in natürlichem modernem Deutsch wieder.
- source_word: הַקֹּדֶשׁ
  choice: das Heiligtum
  rationale: Im Zusammenhang mit dem priesterlichen Dienst und dem Altar bezeichnet der Ausdruck den heiligen Bereich, nicht abstrakte Heiligkeit.
- source_word: הַמִּזְבֵּחַ
  choice: der Altar
  rationale: Dies ist die übliche und sachlich genaue deutsche Wiedergabe.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: damit kein … mehr … kommt
  rationale: Die Formulierung macht den im Kontext naheliegenden Zweck- beziehungsweise Folgezusammenhang verständlich; עוֹד wird durch „mehr“ wiedergegeben.
- source_word: קֶצֶף
  choice: Zorn
  rationale: Das Wort bezeichnet hier schweren, im Kontext göttlichen Zorn. Die Übersetzung nennt Gott nicht ausdrücklich, da auch der hebräische Satz dies nicht tut.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung lautet wörtlich „die Söhne Israels“, bezeichnet hier jedoch das Volk Israel als Ganzes. „Die Israeliten“ ist im Deutschen die natürliche inklusive Wiedergabe; die wörtliche Form wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Verhältnis des abschließenden Zornsatzes zur priesterlichen Aufsicht
  choice: 'Zweck beziehungsweise Folge: Die Aufsicht soll verhindern, dass erneut Zorn über Israel kommt.'
  alternative: 'Bloße Zukunftsaussage: „und es wird keinen Zorn mehr … geben“'
  rationale: Der unmittelbare Zusammenhang weist den Priestern und Leviten Schutz- und Dienstpflichten zu, um unbefugte Annäherung und das daraus folgende Gericht abzuwenden. „Damit“ bringt diesen Zusammenhang zum Ausdruck, ohne Ursache und Wirkung weiter auszudeuten.
- issue: Urheber des Zorns
  choice: Der Zorn bleibt wie im Hebräischen ohne ausdrücklich genanntes göttliches Genitivattribut.
  alternative: „Gottes Zorn“
  rationale: Aus dem Kontext ist göttlicher Zorn gemeint; der vorliegende Satz nennt Gott jedoch nicht ausdrücklich. Diese Zurückhaltung wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „die Aufsicht“ bildet die hebräische Wiederholung von מִשְׁמֶרֶת ab; „wahrnehmen“ vermeidet eine bürokratisch oder altertümlich klingende Formulierung.
