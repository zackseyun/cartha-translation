    issue: Lokalangabe »an hochheiliger Stätte«
    rationale: Das hebräische בְּ bedeutet hier »in«. Die deutsche Präposition »an« kann einen Ort lediglich als Aufenthaltsort beziehungsweise dessen Nähe bezeichnen und ist daher weniger genau.
  - severity: medium
    issue: »Jeder männliche Angehörige«
    rationale: »Angehörige« ist im hebräischen Ausdruck כָּל־זָכָר nicht enthalten und kann im Deutschen speziell Verwandtschaft oder institutionelle Zugehörigkeit nahelegen. »Jede männliche Person« gibt die Geschlechtsbeschränkung wieder, ohne diese Zusatzinformation einzutragen.
