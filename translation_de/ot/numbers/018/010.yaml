  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: de
  text: In einem hochheiligen Bereich[a] sollst du es essen. Jede männliche Person darf davon essen. Es soll dir heilig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »im Heiligen der Heiligkeiten«. Die hebräische Wendung bezeichnet hier den für den Verzehr bestimmten hochheiligen Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: an hochheiliger Stätte
  rationale: Die Konstruktion bezeichnet wörtlich das »Heilige der Heiligkeiten«, dient hier aber als Superlativ und hat durch בְּ lokalen Sinn. »An hochheiliger Stätte« gibt den für den Verzehr bestimmten heiligen Bereich wieder, ohne ihn vorschnell mit dem innersten Heiligtum gleichzusetzen.
- source_word: תֹּאכֲלֶנּוּ
  choice: sollst du es essen
  rationale: Die zweite Person Singular richtet sich an Aaron als Vertreter der Priesterschaft. »Sollst« wahrt den anweisenden, rechtlichen Ton des Verses.
- source_word: כָּל זָכָר
  choice: jeder männliche Angehörige
  rationale: זָכָר bezeichnet ausdrücklich eine männliche Person. »Angehörige« macht im Deutschen natürlich verständlich, dass der Kreis der angesprochenen priesterlichen Gemeinschaft gemeint ist, ohne die Aussage auf erwachsene Männer einzuengen.
- source_word: יֹאכַל אֹתוֹ
  choice: darf davon essen
  rationale: Der Imperfekt bezeichnet hier die Berechtigung zum Verzehr. »Darf« bringt diesen erlaubenden Sinn klar zum Ausdruck; »davon« ist bei Speise im Deutschen idiomatischer als »es«.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: Es soll dir heilig sein
  rationale: Die Formulierung bewahrt das zentrale Kultwort קֹדֶשׁ und den Singular der Anrede. Sie bezeichnet den heiligen Status der Gabe in ihrem Verhältnis zu Aaron.
theological_decisions:
- issue: Adressat und Geltungsbereich der priesterlichen Anweisung
  choice: Die Singularanrede gilt Aaron als Vertreter der Priesterschaft; die Erlaubnis erstreckt sich auf die dazu berechtigten männlichen Angehörigen.
  alternative: Die Singularform könnte ausschließlich als persönliche Anweisung an Aaron verstanden werden.
  rationale: Der unmittelbare Zusammenhang handelt von den Aaron und seinen Söhnen zugewiesenen Priesteranteilen. Der Singular »du« bleibt erhalten, während der folgende Satz den weiteren berechtigten Personenkreis nennt.
- issue: Bedeutung von בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: Die Wendung bezeichnet eine hochheilige Stätte beziehungsweise den vorgeschriebenen hochheiligen Bereich für den Verzehr.
  alternative: Die Wendung könnte unmittelbar als »im Allerheiligsten« verstanden werden.
  rationale: Der lokale Sinn ist deutlich, doch eine Wiedergabe mit »Allerheiligstes« würde im Deutschen gewöhnlich ausschließlich den innersten Raum des Heiligtums bezeichnen und damit die kultische Ortsangabe möglicherweise zu eng festlegen.
translation_notes:
  register: Moderner, würdiger Rechtstext mit klarer Singularanrede an Aaron. »Hochheilig« erhält die kultische Abstufung, während »Stätte« den lokalen Sinn natürlich ausdrückt.
