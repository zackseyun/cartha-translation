  source_fidelity: Die Singularanrede und die deontisch-erlaubende Unterscheidung sind zutreffend wiedergegeben. »An hochheiliger Stätte« schwächt jedoch den durch בְּ ausgedrückten Sinn von »in« ab; »Jeder männliche Angehörige« fügt eine nicht ausdrücklich im hebräischen Wortlaut enthaltene Zugehörigkeitsbezeichnung hinzu.
  naturalness: »In einem hochheiligen Bereich« ist modernes, verständliches Deutsch und bezeichnet einen abgegrenzten kultischen Ort, ohne den innersten Heiligtumsraum zu behaupten. »Jede männliche Person« ist klarer und idiomatischer als die nominale Formulierung mit »Angehörige«.
  terminology: »hochheilig« bewahrt die kultische Steigerung von קֹדֶשׁ הַקֳּדָשִׁים; »heilig« für קֹדֶשׁ bleibt konsistent. Die Fußnote wahrt die mögliche wörtliche Wendung, ohne sie mit dem technisch verstandenen »Allerheiligsten« gleichzusetzen.
  issues:
