source:
  edition: WLC
  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: de
  text: Alles Beste vom Öl[a] und alles Beste vom jungen Wein und vom Getreide – ihre Erstlingsgaben, die sie Jahwe geben – habe ich dir gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „Fett“ des Öls, des jungen Weins und des Getreides – eine bildliche Bezeichnung für den reichsten oder besten Anteil.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: das Beste
  rationale: Wörtlich „Fett“; bei landwirtschaftlichen Erzeugnissen bezeichnet das Wort bildlich den reichsten oder besten Anteil. „Das Beste“ gibt diese Bedeutung im Deutschen natürlich wieder.
- source_word: יִצְהָר
  choice: Öl
  rationale: Das Wort bezeichnet frisches Öl, im israelitischen Kontext gewöhnlich Olivenöl. Da die Ölsorte nicht ausdrücklich genannt wird, bleibt die Übersetzung bei „Öl“.
- source_word: תִּירוֹשׁ
  choice: junger Wein
  rationale: Das Wort bezeichnet neuen beziehungsweise frisch erzeugten Wein und wird so von allgemeineren Bezeichnungen für Wein unterschieden.
- source_word: דָגָן
  choice: Getreide
  rationale: Der Sammelbegriff umfasst Getreideerzeugnisse allgemein; „Getreide“ ist die klare und übliche deutsche Entsprechung.
- source_word: רֵאשִׁיתָם
  choice: ihre Erstlingsgaben
  rationale: Im kultisch-landwirtschaftlichen Zusammenhang bezeichnet רֵאשִׁית den ersten Anteil der Erzeugnisse. Der deutsche Plural bezieht sich natürlich auf Öl, Wein und Getreide.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: die sie Jahwe geben
  rationale: Die Formulierung folgt dem schlichten Verb נתן („geben“) und gibt den Gottesnamen יהוה als „Jahwe“ wieder.
- source_word: לְךָ נְתַתִּים
  choice: habe ich dir gegeben
  rationale: Die Perfektform stellt die Zuweisung als vollzogene und geltende Gabe dar; das vorangestellte Akkusativobjekt macht ein zusätzliches Pronomen im Deutschen unnötig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht im hebräischen Text; „Jahwe“ wahrt seinen Charakter als Name und entspricht hier der konsultierten POB-Fassung, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „alles Beste“ bewahrt die Struktur und Hervorhebung des Hebräischen; Gedankenstriche markieren die erläuternde Apposition, ohne den Satzfluss unnötig zu glätten.
