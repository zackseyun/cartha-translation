  terminology: „auslösen“, „heilig“, „an den Altar sprengen“, „in Rauch aufgehen lassen“, „Feueropfer“ und „Jahwe“ sind sachgerecht. „Feueropfer“ ist als vorsichtige Wiedergabe von אִשֶּׁה vertretbar; eine Fußnote ist nicht erforderlich, weil der Haupttext keine unzulässige dogmatische Festlegung enthält.
