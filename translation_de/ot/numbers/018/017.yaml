source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: de
  text: Doch das erstgeborene Rind, Schaf oder die erstgeborene Ziege darfst du nicht auslösen; sie sind heilig. Ihr Blut sollst du an den Altar sprengen und ihr Fett als Feueropfer in Rauch aufgehen lassen, als wohlgefälligen Duft für Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Markiert die einschränkende Ausnahme gegenüber der vorangehenden Regelung in natürlichem juristischem Deutsch.
- source_word: בְּכוֹר
  choice: Erstgeburt
  rationale: Bezeichnet hier das zuerst geborene Tier als kultisch-rechtliche Kategorie; das Substantiv passt zu den drei Tierarten.
- source_word: שׁוֹר
  choice: Rind
  rationale: Gibt die generische Rinderkategorie wieder, ohne das Geschlecht enger festzulegen, als es der Kontext verlangt.
- source_word: כֶּשֶׂב
  choice: Schaf
  rationale: Die Tierart ist in der Aufzählung generisch gemeint; „Schaf“ ist daher angemessener als „Lamm“.
- source_word: עֵז
  choice: Ziege
  rationale: Direkte, allgemein verständliche Bezeichnung der Tierart.
- source_word: לֹא תִפְדֶּה
  choice: darfst du nicht auslösen
  rationale: „Auslösen“ ist der etablierte deutschsprachige Begriff für die kultisch-rechtliche Freigabe durch Ersatz oder Zahlung.
- source_word: קֹדֶשׁ הֵם
  choice: sie sind heilig
  rationale: Bewahrt die kultische Aussage und ihre Begründungsfunktion, ohne sie zu paraphrasieren.
- source_word: תִּזְרֹק
  choice: sollst du … sprengen
  rationale: Im Opferritus bezeichnet זרק das gezielte Anbringen beziehungsweise Schleudern des Blutes an den Altar; „sprengen“ ist im deutschen Kultwortschatz präziser als „besprengen“ oder „gießen“.
- source_word: חֶלְבָּם
  choice: ihr Fett
  rationale: Bezeichnet die für die Verbrennung bestimmten Fettstücke; eine explizierende Erweiterung ist im Vers nicht nötig.
- source_word: תַּקְטִיר
  choice: in Rauch aufgehen lassen
  rationale: Gibt die kausative kultische Bedeutung von קטר genauer wieder als das allgemeinere „verbrennen“.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Die formale kultische Bezeichnung bewahrt den Bezug auf ein durch Feuer dargebrachtes Opfer, ohne die umstrittene Deutung als „Speiseopfer“ in den Haupttext einzutragen.
- source_word: רֵיחַ נִיחֹחַ
  choice: wohlgefälliger Duft
  rationale: Gibt die feste kultische Wendung idiomatisch wieder und bewahrt den Gedanken göttlichen Wohlgefallens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen im Deutschen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kultischer Ausdruck אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die genaue Etymologie und Nuance des Ausdrucks ist diskutiert. „Feueropfer“ hält sich eng an die Darbringung durch Feuer und vermeidet eine unnötige Festlegung auf die Deutung als Nahrung für Gott.
- issue: Rituelle Handlung זרק am Altar
  choice: Blut an den Altar sprengen
  alternative: Blut auf den Altar sprengen
  rationale: Die Präposition עַל kann räumlich „auf“ oder „an/gegen“ bedeuten. Beim Blutritus lässt „an den Altar“ offen, ob insbesondere die Seiten beziehungsweise die Oberfläche gemeint sind, und passt zur rituellen Handlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch-rechtlicher Präzision. Die singularische Anrede des Priesters bleibt erhalten. Der Satzbau folgt dem hebräischen Kontrast und der anschließenden Opferanweisung, ohne unnötige Archaismen.
