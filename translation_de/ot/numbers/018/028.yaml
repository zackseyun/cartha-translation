id: NUM.18.28
reference: Numbers 18:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: de
  text: Ebenso sollt auch ihr von allen euren Zehnten, die ihr von den Söhnen Israels[a] empfangt, eine Abgabe für Jahwe absondern; und davon sollt ihr die Abgabe für Jahwe dem Priester Aaron geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Israeliten“. Wörtlich steht im Hebräischen „von den Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Knüpft die Anweisung entsprechend und folgernd an den vorausgehenden Auftrag an.
- source_word: תָּרִימוּ
  choice: sollt … absondern
  rationale: Der Hifil von רום bezeichnet in Verbindung mit תְּרוּמָה das Herausheben beziehungsweise Absondern einer für Gott bestimmten Gabe; „absondern“ gibt die kultische Funktion natürlich wieder.
- source_word: גַם אַתֶּם
  choice: auch ihr
  rationale: Bewahrt die Betonung, dass auch die Leviten von dem Empfangenen eine Abgabe leisten müssen.
- source_word: תְּרוּמַת יְהוָה
  choice: eine Abgabe für Jahwe
  rationale: תְּרוּמָה bezeichnet einen ausgesonderten Anteil oder eine Abgabe. Das לְ bei Aaron zeigt später den tatsächlichen Empfänger; daher gibt „für Jahwe“ die Widmung klar wieder, ohne einen Opferakt vorauszusetzen.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: von all euren Zehnten
  rationale: Gibt die partitive Präposition, den Plural und den etablierten kultischen Begriff מַעֲשֵׂר präzise wieder.
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: die ihr von den Söhnen Israels empfangt
  rationale: לקח bedeutet grundsätzlich „nehmen“, bezeichnet hier aber den rechtmäßigen Empfang der Zehnten. „Söhne Israels“ bewahrt die konkrete hebräische Bundesbezeichnung; eine geläufigere Alternative wird in der Fußnote genannt.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: und davon sollt ihr … geben
  rationale: 'Bewahrt den partitiven Sinn: Aus dem empfangenen Zehnten ist die Abgabe weiterzugeben.'
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: dem Priester Aaron
  rationale: Der Dativ gibt לְ als Kennzeichnung des Empfängers idiomatisch wieder; die deutsche Wortstellung ist natürlich und bewahrt Aarons Titel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die wörtliche Bundesbezeichnung und ihre männliche Form bleiben im Haupttext erhalten; die idiomatische kollektivische Wiedergabe wird als Alternative ausgewiesen.
- issue: Verhältnis der Abgabe zu Jahwe und Aaron
  choice: für Jahwe … dem Priester Aaron geben
  alternative: Jahwes Abgabe … Aaron geben
  rationale: Die Formulierung wahrt die Spannung, dass die Abgabe Jahwe geweiht ist und zugleich Aaron als Priester übergeben wird, ohne beide Beziehungen gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe „Zehnt“ und „Abgabe“ bleiben verständlich; „absondern“ macht den Vorgang des Auswählens und Weihens eines Anteils deutlich. Der Fußnotenmarker steht am Versende, da die Anmerkung eine Formulierung innerhalb des Satzes erläutert.
