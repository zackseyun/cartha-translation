source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: de
  text: 'Und zu den Leviten sollst du sprechen und ihnen sagen: Wenn ihr von den Söhnen Israels[a] den Zehnten nehmt, den ich euch von ihnen als euer Erbteil gegeben habe, dann sollt ihr davon eine Abgabe für Jahwe[b] darbringen: einen Zehnten vom Zehnten[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“ oder „dem Volk Israel“. Wörtlich steht im Hebräischen: „den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwes Abgabe“; traditionell: „ein Hebopfer für Jahwe“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: ein Zehntel von dem Zehnten, den die Leviten empfangen.'
    reason: clarification
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche und natürliche deutsche Bezeichnung für die Angehörigen des Stammes Levi.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: sollst du reden und ihnen sagen
  rationale: Bewahrt die zweigliedrige hebräische Anweisungsformel, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: כִּי תִקְחוּ
  choice: Wenn ihr ... nehmt
  rationale: כִּי leitet hier den erwarteten Umstand ein, unter dem die folgende Anweisung gilt; „wenn“ passt besser als ein kausales „denn“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Gibt die ausdrücklich maskuline hebräische Wendung formal wieder; eine Fußnote nennt die im Deutschen geläufigen kollektiven Alternativen.
- source_word: הַמַּעֲשֵׂר
  choice: der Zehnte
  rationale: Eingebürgerte und präzise Bezeichnung für den vorgeschriebenen zehnten Teil.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם
  choice: den ich euch von ihnen ... gegeben habe
  rationale: Bewahrt sowohl die göttliche Gabe als auch deren Herkunft aus den Abgaben Israels.
- source_word: בְּנַחֲלַתְכֶם
  choice: als euer Erbteil
  rationale: Bezeichnet den den Leviten von Gott zugewiesenen Anteil und entspricht der prädikativen Funktion der Wendung.
- source_word: וַהֲרֵמֹתֶם ... תְּרוּמַת
  choice: sollt ihr ... eine Abgabe ... abheben
  rationale: „Abheben“ greift den Grundgedanken des Aussonderns beziehungsweise Erhebens auf; „Abgabe“ bezeichnet den für den kultischen Zweck ausgesonderten Anteil in verständlichem modernem Deutsch.
- source_word: תְּרוּמַת יְהוָה
  choice: eine Abgabe für Jahwe
  rationale: Gibt die kultische Bestimmung natürlich wieder. Die hebräische Genitivverbindung kann auch als „Jahwes Abgabe“ verstanden werden; diese Mehrdeutigkeit wird in der Fußnote offengelegt.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: einen Zehnten vom Zehnten
  rationale: Bewahrt die partitive Konstruktion mit מִן und verdeutlicht, dass ein Zehntel des empfangenen Zehnten abzugeben ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Wendung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; das Volk Israel
  rationale: Die Hauptübersetzung bewahrt die grammatisch maskuline Form des Ausgangstextes; die idiomatischen kollektiven Wiedergaben stehen in der Fußnote.
- issue: Genitivverhältnis in תְּרוּמַת יְהוָה
  choice: eine Abgabe für Jahwe
  alternative: Jahwes Abgabe
  rationale: Im kultischen Zusammenhang liegt die Bestimmung für Jahwe nahe. Da die hebräische Status-constructus-Verbindung auch Zugehörigkeit ausdrücken kann, wird die Alternative ausdrücklich genannt und die Spannung nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer Rechtssprache. Die Anrede wechselt dem hebräischen Text entsprechend vom Singular „du“ für Mose zum Plural „ihr“ für die Leviten. „Abgabe ... abheben“ erhält den kultischen Charakter und die Wortbeziehung von הרים und תרומה, bleibt aber für heutige Leser verständlich.
