    rationale: Der hebräische Ausdruck לכם מתנה נתנים ליהוה enthält parallel wiederholtes „gegeben“. Die Aufteilung in zwei deutsche Sätze („Euch sind sie ... übergeben, Jahwe übergeben“) stört diese Parallelität und lässt den Anschluss von „Jahwe“ unnötig unscharf werden.
