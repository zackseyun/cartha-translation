source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: de
  text: Und ich – siehe –, ich habe eure Brüder, die Leviten, aus der Mitte der Söhne Israels genommen und euch als Gabe gegeben, Jahwe gegeben, damit sie den Dienst am Zelt der Begegnung verrichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Und ich, siehe
  rationale: Bewahrt sowohl den Anschluss durch וַ als auch die hervorgehobene erste Person und die feierlich-aufmerksamkeitslenkende Kraft von הִנֵּה.
- source_word: לָקַחְתִּי
  choice: ich habe … genommen
  rationale: Gibt das Qal-Perfekt grundlegend wieder und lässt die gegenwärtige Bedeutung der bereits vollzogenen Auswahl erkennen, ohne das Verb mit „ausgewählt“ zu interpretieren.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: eure Brüder, die Leviten
  rationale: Erhält die familiäre Bezeichnung und identifiziert die gemeinten Brüder durch die Apposition.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: aus der Mitte der Söhne Israels
  rationale: Folgt der konkreten hebräischen Formulierung und macht die Herausnahme aus der Gesamtgemeinschaft deutlich.
- source_word: לָכֶם מַתָּנָה נְתֻנִים
  choice: Euch sind sie als Gabe übergeben
  rationale: Bewahrt den Dativ, den Gabe-Gedanken und die passive Form, während die deutsche Wortstellung den Bezug verständlich macht.
- source_word: לַיהוָה
  choice: Jahwe übergeben
  rationale: Gibt den Gottesnamen als Jahwe wieder und versteht den Dativ im Zusammenhang mit נְתֻנִים als Übergabe beziehungsweise Hingabe an Jahwe.
- source_word: לַעֲבֹד אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: um den Dienst am Zelt der Begegnung zu verrichten
  rationale: Das deutsche „Dienst verrichten“ bildet Verb und verwandtes Substantiv natürlich ab; „am Zelt der Begegnung“ bezeichnet den kultischen Aufgabenbereich idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die formnahe Wiedergabe erhält die genealogisch-bundestheologische Ausdrucksweise des Hebräischen; der Kontext bezeichnet die Gesamtgemeinschaft Israels.
- issue: Doppelte Zuordnung der Leviten
  choice: Euch sind sie als Gabe übergeben, Jahwe übergeben
  alternative: euch als Gabe gegeben, dem HERRN gegeben
  rationale: Die Formulierung wahrt die Spannung, dass die Leviten Aaron und seinen Söhnen als Gabe zugewiesen und zugleich Jahwe hingegeben sind, statt beide Beziehungen miteinander zu verschmelzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst leicht feierlichem „siehe“. Die Wiederholung „übergeben … übergeben“ spiegelt מַתָּנָה נְתֻנִים und die zweifache Zuordnung, ohne im Deutschen unverständlich zu wirken. Keine Fußnote erforderlich.
