revisions:
- from: Und ich, siehe, ich habe eure Brüder, die Leviten, aus der Mitte der Söhne Israels genommen. Euch sind sie als Gabe übergeben, Jahwe übergeben, um den Dienst am Zelt der Begegnung zu verrichten.
  to: Und ich – siehe –, ich habe eure Brüder, die Leviten, aus der Mitte der Söhne Israels genommen und euch als Gabe gegeben, Jahwe gegeben, damit sie den Dienst am Zelt der Begegnung verrichten.
  rationale: Die Revision verbindet die syntaktisch zusammengehörigen Aussagen in einem Satz und gibt die zweimalige hebräische Partizipform bewusst parallel mit „gegeben ... gegeben“ wieder. „Damit sie“ macht im Deutschen ausdrücklich, dass die Leviten die Handelnden beim Dienst sind, ohne eine im Ausgangstext nicht vorhandene theologische Deutung einzutragen.
