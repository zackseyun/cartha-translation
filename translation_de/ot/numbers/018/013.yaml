  variant: modern standard German
source:
  edition: WLC
  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: de
  text: Die Erstlinge von allem, was in ihrem Land wächst und was sie dem HERRN bringen, sollen dir gehören. Jeder in deinem Haus, der rein ist,[a] darf davon essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: kultisch rein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: die Erstlinge
  rationale: Bezeichnet die ersten Erträge, die als Gabe dargebracht werden. „Erstlinge“ ist im kultischen Zusammenhang prägnant und würdevoll.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: von allem, was in ihrem Land wächst
  rationale: Der Zusatz „wächst“ macht im Deutschen den Bezug der Erstlinge zu den Erträgen des Landes natürlich verständlich, ohne eine bestimmte Erzeugnisart festzulegen.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: was sie dem HERRN bringen
  rationale: Gibt das konkrete Verb „bringen“ eng wieder; der Opfercharakter ergibt sich aus dem kultischen Kontext.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Das Tetragramm wird nach der vorgegebenen Konvention mit „HERR“ wiedergegeben.
- source_word: לְךָ יִהְיֶה
  choice: sollen dir gehören
  rationale: Drückt die Zuweisung an Aaron idiomatisch und klar aus.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: jeder in deinem Haus, der rein ist
  rationale: Bewahrt die knappe Formulierung des Hebräischen; „Haus“ kann hier die Hausgemeinschaft bezeichnen. Der rituelle Sinn von „rein“ wird in der Fußnote erläutert.
- source_word: יֹאכֲלֶנּוּ
  choice: darf davon essen
  rationale: Der Kontext bezeichnet eine Erlaubnis beziehungsweise Berechtigung. „Davon“ bezieht sich im Deutschen natürlich auf die genannten Erstlinge.
theological_decisions:
- issue: Bedeutung von טָהוֹר in der priesterlichen Gesetzgebung
  choice: rituell reine Angehörige von Aarons Haus dürfen von der priesterlichen Zuteilung essen
  alternative: allgemein moralisch reine Menschen dürfen davon essen
  rationale: Im Zusammenhang von Numeri 18 bezeichnet טָהוֹר kultische beziehungsweise rituelle Reinheit. Die Hauptübersetzung bleibt nah am Wortlaut, während die Fußnote diesen Kontext verdeutlicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Erstlinge“ bewahrt den etablierten kultischen Begriff; Satzbau und Modalverb sind natürlich und klar.
