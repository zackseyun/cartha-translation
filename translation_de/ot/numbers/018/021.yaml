  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: de
  text: 'Siehe, den Nachkommen Levis habe ich den gesamten Zehnten in Israel als Erbbesitz gegeben, als Gegenleistung für ihren Dienst, den sie verrichten: den Dienst am Zelt der Begegnung.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  choice: Den Nachkommen Levis aber
  rationale: Die genealogische Formulierung bleibt erhalten; „Nachkommen“ ist im heutigen Deutsch natürlicher und schließt den levitischen Stamm ein. Das vorangestellte וְ wird im Zusammenhang als fortführendes „aber“ wiedergegeben.
- source_word: הִנֵּה נָתַתִּי
  choice: habe ich hiermit … gegeben
  rationale: „Hiermit“ bewahrt die hervorhebende und deklarative Funktion von הִנֵּה natürlicher als das heute markierte „siehe“; das Perfekt stellt die Zuweisung als vollzogen und gültig dar.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: den gesamten Zehnten in Israel
  rationale: מַעֲשֵׂר ist der Zehnte; כָּל kann hier kollektiv die Gesamtheit der Zehntabgaben bezeichnen. Die Formulierung ist idiomatisch und lässt den umfassenden Geltungsbereich erkennen.
- source_word: לְנַחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet einen erblich zugewiesenen Anteil oder Besitz. „Erbbesitz“ passt besonders zum Kontext der Stammesanteile und vermeidet die mögliche Verengung von „Erbe“ auf einen Todesfall.
- source_word: חֵלֶף עֲבֹדָתָם
  choice: als Gegenleistung für ihren Dienst
  rationale: חֵלֶף bezeichnet Ersatz, Austausch oder Entgelt. „Als Gegenleistung“ erhält den Vergütungscharakter, ohne einen rein kommerziellen Ton anzunehmen.
- source_word: אֲשֶׁר הֵם עֹבְדִים אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: den sie am Zelt der Begegnung verrichten
  rationale: Die Wiedergabe vermeidet die im Deutschen schwerfällige Wiederholung von עבד/עֲבֹדָה und macht deutlich, dass es um die mit dem Zelt verbundenen Dienstpflichten geht. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent und verständlich wieder.
theological_decisions:
- issue: Verhältnis von Zehnt, Erbbesitz und levitischem Dienst
  choice: Der Zehnte wird den Nachkommen Levis zugleich als ihr zugewiesener Erbbesitz und als Gegenleistung für ihren Dienst gegeben.
  alternative: Der Zehnte wird lediglich als Stammesanteil zugewiesen, ohne dass der Vers einen Vergütungscharakter hervorhebt.
  rationale: Der hebräische Text verbindet ausdrücklich לְנַחֲלָה mit חֵלֶף עֲבֹדָתָם. Beide Aspekte werden bewahrt, ohne zu behaupten, der Vers erkläre den Zehnten erschöpfend oder ausschließlich als Lohn.
- issue: Ort beziehungsweise Zuordnung des Dienstes
  choice: „am Zelt der Begegnung“ bezeichnet die dort ausgeübten beziehungsweise darauf bezogenen Pflichten.
  alternative: „den Dienst des Zeltes der Begegnung“ folgt der hebräischen Genitivverbindung formaler, ist im Deutschen jedoch missverständlich, als diene das Zelt selbst.
  rationale: Die lokale Wiedergabe bringt die sachliche Beziehung idiomatisch zum Ausdruck, ohne spätere kirchliche Amtsbegriffe einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-deklarativem Ton. Die Satzstellung hebt wie im Hebräischen zunächst die Empfänger hervor. Archaisches „siehe“ und kirchlich vorgeprägtes „Dienstamt“ werden vermieden.
