  - severity: low
    issue: Die abschließende Bestimmung des Dienstes ist im Deutschen zu stark verschmolzen.
    rationale: Der hebräische Text sagt ausdrücklich zunächst „ihren Dienst, den sie verrichten“ und bestimmt ihn dann als „den Dienst des Zeltes der Begegnung“. Eine Apposition erhält diese Struktur und verdeutlicht den Bezug, ohne den deutschen Satz schwerfällig zu machen.
