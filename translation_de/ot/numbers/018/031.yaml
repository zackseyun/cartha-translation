base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: de
  text: Ihr und euer Haushalt dürft es an jedem Ort essen[a], denn es ist euer Lohn für euren Dienst am Zelt der Begegnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollt es essen“ beziehungsweise „könnt es essen“. Die hebräische Verbform kann in diesem rechtlichen Zusammenhang eine Anweisung oder eine erlaubte Handlung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: dürft es essen
  rationale: Die Verbform bezeichnet im rechtlichen Zusammenhang keine vergangene Handlung, sondern eine eingeräumte Möglichkeit beziehungsweise Anweisung. „Dürft“ macht die hier gemeinte Erlaubnis natürlich und klar.
- source_word: בְּכָל מָקוֹם
  choice: an jedem Ort
  rationale: Die Wendung hebt eine fehlende Beschränkung auf den Heiligtumsbereich hervor. „An jedem Ort“ bewahrt den distributiven Sinn des Hebräischen.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: ihr und eure Hausgemeinschaft
  rationale: בַּיִת bezeichnet hier nicht das Gebäude, sondern die zum Haus gehörende soziale und häusliche Gemeinschaft. „Hausgemeinschaft“ ist weiter als „Familie“ und vermeidet das Missverständnis eines physischen Hauses.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die Erlaubnis ein; „denn“ verbindet die beiden Satzteile in würdigem, natürlichem Deutsch.
- source_word: שָׂכָר
  choice: Lohn
  rationale: Das Wort bezeichnet eine Vergütung für geleistete Arbeit. „Lohn“ ist im Deutschen prägnant und passt zum levitischen Dienst.
- source_word: חֵלֶף
  choice: als Gegenleistung für
  rationale: Hier bezeichnet das Wort eine entsprechende Vergütung für den geleisteten Dienst. „Als Gegenleistung für“ macht diesen Zusammenhang deutlich, ohne bloßen Ersatz anzudeuten.
- source_word: עֲבֹדַתְכֶם
  choice: euren Dienst
  rationale: Das Substantiv meint die den Leviten übertragene kultische Arbeit. „Dienst“ erhält diesen amtlich-religiösen Klang.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: am Zelt der Begegnung
  rationale: Die Präposition ב kann bei einer Tätigkeit den Ort beziehungsweise Wirkungsbereich bezeichnen. „Am Zelt der Begegnung“ ist im Deutschen natürlicher und umfasst den dort und in dessen Zusammenhang verrichteten Dienst.
theological_decisions:
- issue: Art des Anteils der Leviten
  choice: Der essbare Anteil wird als rechtmäßiger Lohn für den levitischen Dienst dargestellt und darf ohne Beschränkung auf einen heiligen Ort verzehrt werden.
  alternative: Der Anteil könnte enger als heilige Mahlzeit verstanden werden, deren Verzehr an den Heiligtumsbereich gebunden ist.
  rationale: Die ausdrückliche Bestimmung בְּכָל־מָקוֹם („an jedem Ort“) hebt eine örtliche Heiligtumsbeschränkung auf. Die Übersetzung wahrt diesen rechtlich-theologischen Gegensatz, ohne weitergehende Aussagen über den Status der Gabe einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hausgemeinschaft“ gibt den sozialen Sinn von בַּיִת genauer wieder als das engere „Familie“. Nur die tatsächlich erklärungsbedürftige modale Mehrdeutigkeit der Verbform wird in einer Fußnote bewahrt; der Marker steht unmittelbar nach der betreffenden Aussage.
