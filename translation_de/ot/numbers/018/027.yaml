  text: וְ/נֶחְשַׁ֥ב לָ/כֶ֖ם תְּרוּמַתְ/כֶ֑ם כַּ/דָּגָן֙ מִן הַ/גֹּ֔רֶן וְ/כַֽ/מְלֵאָ֖ה מִן הַ/יָּֽקֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: de
  text: Und eure Abgabe wird euch angerechnet werden wie das Korn von der Tenne und wie der Ertrag aus der Kelter.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird euch zugerechnet werden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie die Fülle aus der Kelter“, das heißt, wie der volle Ertrag der Kelter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: wird euch angerechnet werden
  rationale: Das Nifal von חשׁב bezeichnet hier, dass etwas als gleichwertig angesehen bzw. entsprechend verbucht wird. „Angerechnet“ bewahrt den rechtlich-kultischen Sinn.
- source_word: תְּרוּמַתְכֶם
  choice: eure Abgabe
  rationale: תְּרוּמָה bezeichnet hier den ausgesonderten Anteil, den die Leviten vom Zehnten abgeben. „Abgabe“ ist modern und kontextuell präzise; „Hebopfer“ wäre traditionsgebunden und heute schwer verständlich.
- source_word: כַּדָּגָן מִן הַגֹּרֶן
  choice: wie das Korn von der Tenne
  rationale: Die Wendung wahrt den Vergleich und das landwirtschaftliche Bild; גֹּרֶן ist die Tenne als Ort des Dreschens.
- source_word: וְכַמְלֵאָה מִן הַיָּקֶב
  choice: und wie der Ertrag aus der Kelter
  rationale: מְלֵאָה bedeutet wörtlich „Fülle“, bezeichnet hier parallel zum Korn jedoch den vollen Ertrag bzw. das Erzeugnis der Kelter. „Ertrag“ gibt den kontextuellen Sinn in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Terminologie wird verständlich wiedergegeben, ohne die traditionelle, aber missverständliche Bezeichnung „Hebopfer“ in den Haupttext zu übernehmen. Das zweimalige „wie“ erhält den hebräischen Parallelismus.
