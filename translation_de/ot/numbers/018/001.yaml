  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Aaron: „Du, deine Söhne und das Haus deines Vaters mit dir sollt die Schuld am Heiligtum tragen[a]; und du und deine Söhne mit dir sollt die Schuld eures Priestertums tragen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schuld des Heiligtums tragen“. Die hebräische Wendung kann auch bedeuten, für Vergehen im Zusammenhang mit dem Heiligtum verantwortlich zu sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Schuld eures Priesteramtes tragen“. Die hebräische Wendung kann auch bedeuten, für Vergehen im Zusammenhang mit eurem priesterlichen Amt verantwortlich zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung fort; „Da sagte“ ist im modernen Deutschen natürlich und wahrt die Abfolge.
- source_word: בֵית אָבִיךָ
  choice: das Haus deines Vaters
  rationale: Die hebräische Verwandtschaftsbezeichnung meint den väterlichen Familien- bzw. Sippenverband; die idiomnahe Form bleibt im Kontext verständlich.
- source_word: אִתָּךְ
  choice: mit dir
  rationale: Die zweimalige Begleitformel wird beibehalten, um Struktur und Nachdruck des Hebräischen zu bewahren.
- source_word: תִּשְׂאוּ אֶת עֲוֺן
  choice: sollt die Schuld … tragen
  rationale: Die deutsche Wendung bewahrt den hebräischen Zusammenhang von Schuld, Haftung und Verantwortlichkeit, ohne ihn auf nur eine Bedeutung festzulegen.
- source_word: הַמִּקְדָּשׁ
  choice: das Heiligtum
  rationale: „Heiligtum“ ist die geläufige deutsche Bezeichnung für den heiligen Bereich, für den Aarons Haus Verantwortung trägt.
- source_word: כְּהֻנַּתְכֶם
  choice: euer Priesterdienst
  rationale: Das Wort bezeichnet das Aaron und seinen Söhnen zukommende Priesteramt bzw. den priesterlichen Dienst; „Priesterdienst“ ist natürlich und konkret, ohne den institutionellen Sinn auszuschließen.
theological_decisions:
- issue: Bedeutung von „die Schuld tragen“ im priesterlichen Zusammenhang
  choice: Die hebräische Redewendung wird als „die Schuld … tragen“ erhalten.
  alternative: „für Vergehen am Heiligtum bzw. im Priesterdienst verantwortlich sein“
  rationale: Die Wendung kann Schuld, Haftung für Folgen und Verantwortung für Verfehlungen im heiligen Dienst umfassen. Die idiomnahe Übersetzung wahrt diese theologische Spannung.
- issue: Bezug der Genitivverbindungen „Schuld des Heiligtums/Priestertums“
  choice: „Schuld am Heiligtum“ und „Schuld eures Priesterdienstes“
  alternative: „Schuld des Heiligtums“ und „Schuld eures Priestertums“
  rationale: „Am Heiligtum“ macht im Deutschen deutlich, dass nicht das Heiligtum selbst moralisch schuldig ist, während die Fußnote die mögliche Verantwortungsnuance offenhält. Beim Priesterdienst bleibt die enge formale Zuordnung gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzparallelität und die wiederholte Formulierung „mit dir“ folgen bewusst dem Hebräischen. „Schuld tragen“ erhält die Mehrdeutigkeit zwischen eigener bzw. zugerechneter Schuld, Haftung und amtlicher Verantwortung.
