  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: de
  text: Sie sollen sich dir anschließen und den ihnen übertragenen Dienst am Zelt der Begegnung versehen, bei allen Arbeiten am Zelt. Doch kein Unbefugter[a] darf sich euch nähern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kein Außenstehender. Das hebräische Wort bezeichnet hier jemanden außerhalb des zugelassenen Dienstes am Heiligtum, nicht unbedingt einen Fremden anderer Herkunft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: sie sollen sich dir anschließen
  rationale: Das Nifal von לוה mit עַל bezeichnet hier die Zuordnung der Leviten zu Aaron für ihren unterstützenden Dienst. „Sich dir anschließen“ gibt sowohl die Beziehung als auch die Funktion natürlich wieder.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: den ihnen übertragenen Dienst versehen
  rationale: שׁמר mit מִשְׁמֶרֶת bezeichnet im priesterlichen Zusammenhang das Wahrnehmen einer anvertrauten Aufgabe. Diese Wiedergabe vermeidet das im Deutschen unnatürliche „eine Wache bewahren“ und erhält den Gedanken verbindlicher Verantwortung.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die traditionelle Bezeichnung wird in verständlicher, wörtlich naher Form wiedergegeben; מוֹעֵד bezeichnet hier den von Gott bestimmten Ort der Begegnung.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: bei allen Arbeiten am Zelt
  rationale: עֲבֹדָה umfasst hier die praktischen und kultischen Dienstleistungen am Heiligtum. „Arbeiten“ vermeidet eine schwerfällige Wiederholung von „Dienst“ und bewahrt den umfassenden Sinn von כֹּל.
- source_word: וְזָר
  choice: doch kein Unbefugter
  rationale: זָר meint in diesem Heiligtumskontext jemanden außerhalb des zugelassenen priesterlichen beziehungsweise levitischen Aufgabenbereichs, nicht notwendig einen ethnischen Fremden. „Unbefugter“ macht diesen Zugangsaspekt deutlich.
- source_word: יִקְרַב אֲלֵיכֶם
  choice: darf sich euch nähern
  rationale: קרב bezeichnet in Heiligtumsvorschriften das Herantreten in den heiligen Zuständigkeitsbereich. Das pluralische אֲלֵיכֶם wird mit „euch“ ausdrücklich bewahrt.
theological_decisions:
- issue: Bedeutung von זָר in der Heiligtumsgesetzgebung
  choice: Unbefugter, also jemand außerhalb der zugelassenen priesterlichen beziehungsweise levitischen Rolle
  alternative: Außenstehender; Fremder
  rationale: Der Zusammenhang regelt den Zugang zum Heiligtumsdienst und nicht die ethnische Herkunft. Die Übersetzung vermeidet daher den irreführenden Eindruck, das Verbot richte sich lediglich gegen Ausländer, während die Fußnote die lexikalische Alternative offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der kultischen Rechtssprache, vermeidet jedoch unnatürliche Wendungen wie „die Obhut bewahren“. Der Wechsel von Singular „dir“ zu Plural „euch“ folgt ausdrücklich dem hebräischen Text.
