review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen wieder: die Anrede an Aaron, die emphatische Selbstnennung, die priesterliche Zuweisung der תרומות, den Bezug auf die heiligen Gaben Israels, לְמָשְׁחָה und die Dauerformel לְחָק עוֹלָם. Die Formulierung „Verantwortung für meine Abgaben, für alle heiligen Gaben“ bildet die syntaktische Beziehung jedoch unklar und unnötig doppelt mit „für“ ab. „Salbungsanteil“ gibt die knappe und fachsprachlich geprägte Wendung לְמָשְׁחָה quellennäher wieder als „Anteil aufgrund der Salbung“, ohne ihre genaue Deutung im Haupttext festzulegen.'
  naturalness: „Dann sprach Jahwe“ und die markierte Redeformel „Und ich, siehe, ich“ sind in würdigem modernem Standarddeutsch möglich. Die überarbeitete Fassung glättet lediglich die schwer verständliche Reihung nach „Abgaben“ und lässt die Wiederaufnahme „sie“ klar auf die heiligen Gaben bezogen sein.
  terminology: „Jahwe“, „Aaron“, „Söhne Israels“ und „ewige Ordnung“ sind konsistent und angemessen. „Obhut über“ trifft מִשְׁמֶרֶת als anvertraute Aufsicht/Verwahrung in diesem kultischen Kontext präziser als das allgemeinere „Verantwortung für“. „Salbungsanteil“ bewahrt die lexikalische und auslegungsfähige Kürze von לְמָשְׁחָה; die Fußnote erläutert die wahrscheinliche Funktionsbedeutung, ohne sie dem Text aufzuzwingen.
  issues:
  - severity: medium
    issue: Unklare Konstruktion „die Verantwortung für meine Abgaben ..., für alle heiligen Gaben“
    rationale: Das zweimalige „für“ lässt offen, ob die heiligen Gaben eine Erläuterung der Abgaben sind oder einen weiteren Gegenstand der Verantwortung darstellen. Der hebräische Zusammenhang behandelt die heiligen Gaben als die Aaron zugewiesenen kultischen Gaben; eine appositionale bzw. wiederaufnehmende Gestaltung ist im Deutschen klarer.
  - severity: low
    issue: „Anteil aufgrund der Salbung“ ist stärker explizierend als die hebräische Wendung
    rationale: לְמָשְׁחָה kann den aufgrund der Salbung zustehenden priesterlichen Anteil bezeichnen, ist aber knapp und lexikalisch nicht vollständig ausdeutbar. „Dein Salbungsanteil“ erhält die Ambiguität besser; die Erläuterung gehört in die Fußnote.
  revised_text: 'Dann sprach Jahwe zu Aaron: »Und ich, siehe, ich habe dir die Obhut über meine Abgaben[a] übertragen, über alle heiligen Gaben der Söhne Israels[b]. Als deinen Salbungsanteil[c] habe ich sie dir und deinen Söhnen als ewige Ordnung gegeben.«'
