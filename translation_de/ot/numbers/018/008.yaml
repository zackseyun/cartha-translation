revisions:
- from: 'Dann sprach Jahwe zu Aaron: »Und ich, siehe, ich habe dir die Verantwortung für meine Abgaben[a] übertragen, für alle heiligen Gaben der Söhne Israels[b]. Ich habe sie dir als Anteil aufgrund der Salbung[c] und deinen Söhnen als ewige Ordnung gegeben.«'
  to: 'Dann sprach Jahwe zu Aaron: »Und ich, siehe, ich habe dir die Obhut über meine Abgaben[a] übertragen, über alle heiligen Gaben der Söhne Israels[b]. Als deinen Salbungsanteil[c] habe ich sie dir und deinen Söhnen als ewige Ordnung gegeben.«'
  rationale: Die Revision klärt die Beziehung zwischen den Abgaben und den heiligen Gaben, ohne den Umfang der Zuweisung zu verändern. Sie ersetzt die stärker interpretierende Haupttextformulierung „Anteil aufgrund der Salbung“ durch „deinen Salbungsanteil“ und bewahrt die Erläuterung der wahrscheinlichen Bedeutung in der Fußnote.
  reviewer_model: gpt-5.6-terra
