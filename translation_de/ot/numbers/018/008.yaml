source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: de
  text: 'Dann sprach Jahwe zu Aaron: »Und ich, siehe, ich habe dir die Obhut über meine Abgaben[a] übertragen, über alle heiligen Gaben der Söhne Israels[b]. Als deinen Salbungsanteil[c] habe ich sie dir und deinen Söhnen als ewige Ordnung gegeben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Opfergaben“; genauer auch: „meine Hebegaben“.'
    reason: lexical_alternative
  - marker: b
    text: „Söhne Israels“ ist die übliche bundesbezogene Bezeichnung für das Volk Israel.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich etwa: „zur Salbung“. Gemeint ist wahrscheinlich der Anteil, der Aaron aufgrund seiner Salbung zum priesterlichen Amt zusteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den offenbarten Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַאֲנִי הִנֵּה
  choice: Und ich, siehe
  rationale: Bewahrt sowohl das betonte Personalpronomen als auch den aufmerksamkeitslenkenden Ausdruck הִנֵּה; die bewusst markierte Form entspricht der feierlichen Gottesrede.
- source_word: מִשְׁמֶרֶת
  choice: die Verantwortung
  rationale: Bezeichnet hier eine Aaron anvertraute Aufgabe beziehungsweise Obhut. „Verantwortung“ ist im heutigen Deutsch verständlicher als „Wache“ oder „Hut“.
- source_word: תְּרוּמֹתַי
  choice: meine Abgaben
  rationale: תְּרוּמָה bezeichnet eine für Jahwe ausgesonderte und dargebrachte Gabe. „Abgaben“ erfasst hier den geregelten kultischen Charakter, ohne eine bestimmte Opferhandlung vorauszusetzen.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: für alle heiligen Gaben der Söhne Israels
  rationale: Im Zusammenhang sind mit den „heiligen Dingen“ geweihte Gaben gemeint. „Söhne Israels“ erhält die formale Bundesbezeichnung des Hebräischen.
- source_word: לְמָשְׁחָה
  choice: als Anteil aufgrund der Salbung
  rationale: Die knappe hebräische Wendung verbindet die Zuweisung wahrscheinlich mit Aarons Salbung und priesterlichem Amt. Die Übersetzung macht diese Beziehung verständlich, ohne eine erneute Salbungshandlung zu behaupten.
- source_word: לְחָק עוֹלָם
  choice: als ewige Ordnung
  rationale: חֹק bezeichnet eine festgesetzte Regelung oder Zuweisung; עוֹלָם drückt ihre bleibende Geltung aus. „Ewige Ordnung“ wahrt den rechtlichen und dauerhaften Charakter.
theological_decisions:
- issue: Bedeutung von לְמָשְׁחָה für Aarons Anspruch auf die heiligen Gaben
  choice: als Anteil aufgrund der Salbung
  alternative: zur Salbung; als Salbungsanteil
  rationale: Der Kontext handelt von den Aaron und seinen Söhnen dauerhaft zugewiesenen heiligen Gaben. Die Formulierung stellt den Bezug zu Aarons gesalbtem Priesteramt her, ohne weitergehende Amtslehren einzutragen.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Volk Israel
  rationale: Die formale Wendung ist eine traditionelle nationale und bundesbezogene Bezeichnung. Ihre wörtliche Wiedergabe bewahrt die Ausdrucksweise des Ausgangstextes.
- issue: Reichweite von עוֹלָם
  choice: ewige Ordnung
  alternative: dauerhafte Ordnung; immerwährende Ordnung
  rationale: Die Übersetzung bewahrt die starke Dauerformel des hebräischen Rechtstextes und legt nicht eigenmächtig fest, wie ihre Geltung innerhalb späterer theologischer Ordnungen zu bestimmen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Ton der Gottesrede. Die Satzstruktur bleibt quellennah, wird jedoch durch „Verantwortung übertragen“ und „Anteil aufgrund der Salbung“ für heutige Leser verständlich gemacht. Alle Fußnotenmarker stehen unmittelbar bei den erklärungsbedürftigen Ausdrücken.
