revisions:
- from: Du aber und deine Söhne mit dir, ihr sollt euren Priesterdienst wahrnehmen bei allem, was den Altar betrifft, und bei allem innerhalb des Vorhangs; dort sollt ihr dienen. Als einen geschenkten Dienst übertrage ich euch das Priesteramt.[a] Wer aber als Unbefugter hinzutritt,[b] soll getötet werden.
  to: Du aber und deine Söhne mit dir sollt über euer Priesteramt wachen, für alles, was den Altar betrifft, und innerhalb des Vorhangs; ihr sollt Dienst tun. Als einen geschenkten Dienst übertrage ich euch das Priesteramt.[a] Wer aber als Unbefugter hinzutritt,[b] soll getötet werden.
  rationale: Die Revision entfernt nicht im Hebräischen ausgedrückte Zusätze zum Bereich innerhalb des Vorhangs und zum Ort des Dienstes. Zugleich wird שׁמר mit der idiomatischen, aber weiterhin custodialen Wendung „über ... wachen“ wiedergegeben. Die bewusst knappe Formulierung zu „geschenktem Dienst“ und die erläuternden Fußnoten bewahren die syntaktische Mehrdeutigkeit von עֲבֹדַת מַתָּנָה.
