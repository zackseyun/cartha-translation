  text: וְ/אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִ֠תְּ/ךָ תִּשְׁמְר֨וּ אֶת כְּהֻנַּתְ/כֶ֜ם לְ/כָל דְּבַ֧ר הַ/מִּזְבֵּ֛חַ וּ/לְ/מִ/בֵּ֥ית לַ/פָּרֹ֖כֶת וַ/עֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת כְּהֻנַּתְ/כֶ֔ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: de
  text: Du aber und deine Söhne mit dir sollt über euer Priesteramt wachen, für alles, was den Altar betrifft, und innerhalb des Vorhangs; ihr sollt Dienst tun. Als einen geschenkten Dienst übertrage ich euch das Priesteramt.[a] Wer aber als Unbefugter hinzutritt,[b] soll getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Als Gabe für den Dienst übertrage ich euch das Priesteramt.“ Die knappe hebräische Formulierung kann den Dienst selbst oder das für den Dienst verliehene Priesteramt als Gabe hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Fremde“. Gemeint ist hier jemand, der nicht zum priesterlichen Dienst befugt ist, nicht ein Ausländer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ אֶת־כְּהֻנַּתְכֶם
  choice: euren Priesterdienst wahrnehmen
  rationale: שׁמר bezeichnet hier das sorgfältige Hüten und Erfüllen einer anvertrauten priesterlichen Aufgabe. „Wahrnehmen“ gibt diese Verantwortung im Deutschen natürlicher wieder als das wörtliche „bewahren“.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: bei allem, was den Altar betrifft
  rationale: דָּבָר bezeichnet in dieser Verbindung umfassend alle Angelegenheiten und Pflichten am Altar, ohne sie auf einzelne Verrichtungen zu beschränken.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: bei allem innerhalb des Vorhangs
  rationale: Die knappe hebräische Wendung weist auf den Bereich an der Innenseite des trennenden Vorhangs. Die Ergänzung „bei allem“ folgt dem Satzbezug und ergibt klares Deutsch.
- source_word: וַעֲבַדְתֶּם
  choice: dort sollt ihr dienen
  rationale: עבד bezeichnet im kultischen Zusammenhang den priesterlichen Dienst. „Dort“ verdeutlicht den räumlichen Bezug des unmittelbar vorausgehenden Ausdrucks, ohne eine neue inhaltliche Bestimmung einzuführen.
- source_word: עֲבֹדַת מַתָּנָה אֶתֵּן אֶת־כְּהֻנַּתְכֶם
  choice: Als einen geschenkten Dienst übertrage ich euch das Priesteramt
  rationale: Die verdichtete Konstruktion verbindet Dienst, Gabe und die göttliche Übertragung des Priesteramts. Die Formulierung bewahrt diese Elemente und lässt per Fußnote die alternative syntaktische Zuordnung erkennen.
- source_word: הַזָּר
  choice: Unbefugter
  rationale: זָר meint hier keinen ethnisch Fremden, sondern jemanden, der nicht zum betreffenden heiligen Dienst berechtigt ist.
- source_word: הַקָּרֵב
  choice: hinzutritt
  rationale: קרב bezeichnet das Herantreten an den geschützten heiligen Bereich beziehungsweise Dienst; „hinzutritt“ bewahrt sowohl die räumliche als auch die kultisch-rechtliche Bedeutung.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Die Hophal-Form ist passiv-kausativ und bezeichnet die Vollstreckung der Todesstrafe, nicht lediglich ein Sterben.
theological_decisions:
- issue: Bedeutung von זָר im Priestergesetz
  choice: Unbefugter
  alternative: Außenstehender; Fremder; Nichtpriester
  rationale: Der Kontext grenzt den von Gott übertragenen Priesterdienst ab. „Unbefugter“ vermeidet ein ethnisches Missverständnis und bezeichnet die fehlende kultische Berechtigung, ohne sie weiter als der Text zu definieren.
- issue: Bezug von עֲבֹדַת מַתָּנָה
  choice: Der übertragene Priesterdienst wird als Gabe bezeichnet
  alternative: Das Priesteramt wird als Gabe für den Dienst verliehen
  rationale: Die hebräische Konstruktion ist syntaktisch gedrängt und kann den Gabecharakter stärker auf den Dienst oder auf das Priesteramt beziehen. Der Haupttext bietet eine natürliche Lesart; die Fußnote bewahrt die andere Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Priesterdienst wahrnehmen“ vermeidet eine unnatürliche wörtliche Wiedergabe von שׁמר, während „Priesteramt“ im zweiten Satz die von Gott verliehene Stellung bezeichnet. Die hebräische Spannung in עֲבֹדַת מַתָּנָה wird nicht dogmatisch aufgelöst, sondern in einer Fußnote offengelegt.
