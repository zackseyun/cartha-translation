  naturalness: Der Ton ist modernes, würdiges Standarddeutsch. „Über euer Priesteramt wachen“ gibt die bewahrende Verantwortlichkeit von שׁמר idiomatisch wieder. „Innerhalb des Vorhangs“ ist als kultischer Bereich verständlich, ohne die hebräische Ellipse unnötig auszuweiten.
  terminology: „Priesteramt“ gibt כְּהֻנָּה als verliehene priesterliche Stellung gut wieder; „Unbefugter“ trifft זָר im kultisch-rechtlichen Kontext besser als ein ethnisch verstandenes „Fremder“. „Soll getötet werden“ bildet die rechtliche, passiv-kausative Aussage von יוּמָת angemessen ab.
