source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: de
  text: 'Dies soll dir von den hochheiligen Gaben zustehen, und zwar von dem, was vom Feuer ausgespart wird[a]: jede ihrer Opfergaben, alle ihre Speisopfer, alle ihre Sündopfer[b] und alle ihre Schuldopfer[c], die sie mir zurückgeben[d]. Es ist hochheilig für dich und deine Söhne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Feuer“. Gemeint sein kann der Anteil der Opfergaben, der nicht auf dem Altar verbrannt wird.'
    reason: lexical_alternative
  - marker: b
    text: „Sündopfer“ kann auch mit „Reinigungsopfer“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: „Schuldopfer“ kann auch mit „Wiedergutmachungsopfer“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „die sie mir erstatten“ beziehungsweise „die sie mir darbringen“. Das hebräische Verb bezeichnet grundsätzlich ein Zurückbringen oder Zurückgeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: von den hochheiligen Gaben
  rationale: Die superlativische Wendung bezeichnet hier die höchste kultische Heiligkeitsstufe von Opfergaben, nicht den innersten Raum des Heiligtums.
- source_word: מִן הָאֵשׁ
  choice: von dem, was vom Feuer zurückbehalten wird
  rationale: Der hebräische Ausdruck lautet wörtlich „vom Feuer“. Im Zusammenhang sind die hochheiligen Anteile gemeint, die nicht verbrannt werden, sondern den Priestern zustehen; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: קָרְבָּנָם
  choice: jede ihrer Opfergaben
  rationale: קָרְבָּן ist der allgemeine Ausdruck für eine vor Gott gebrachte Gabe; „Opfergabe“ ist im Deutschen klar und kontextgerecht.
- source_word: מִנְחָתָם
  choice: alle ihre Speisopfer
  rationale: מִנְחָה bezeichnet in der priesterlichen Opferordnung gewöhnlich das aus pflanzlichen Erzeugnissen bestehende Speisopfer.
- source_word: חַטָּאתָם
  choice: alle ihre Sündopfer
  rationale: In der Aufzählung bezeichnet חַטָּאת die Opferart. „Sündopfer“ ist die geläufige Wiedergabe; die Deutung als Reinigungsopfer wird in einer Fußnote bewahrt.
- source_word: אֲשָׁמָם
  choice: alle ihre Schuldopfer
  rationale: אָשָׁם bezeichnet hier das Schuldopfer; die mögliche Betonung von Wiedergutmachung wird in einer Fußnote genannt.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: die sie mir zurückgeben
  rationale: Die Hifil-Form von שוב trägt den Gedanken des Zurückbringens oder Erstattens. Die ungewöhnliche, aber verständliche Formulierung bewahrt dieses Bild, ohne den Bezug ausschließlich auf Wiedergutmachungsfälle zu beschränken.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die Wendung bezeichnet prädikativ den höchsten kultischen Heiligkeitsgrad der genannten Gaben.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: für dich und deine Söhne
  rationale: Der Text redet Aaron und ausdrücklich seine Söhne als männliche Träger des Priesterdienstes an; eine geschlechtsneutrale Wiedergabe wäre hier ungenau.
theological_decisions:
- issue: Kultische Heiligkeit im Unterschied zum innersten Heiligtumsraum
  choice: hochheilige Gaben / hochheilig
  alternative: Allerheiligstes / Heiliges der Heiligen
  rationale: Im Vers klassifiziert die hebräische Wendung Opferanteile nach ihrem Heiligkeitsgrad. Eine räumliche Wiedergabe könnte fälschlich an den innersten Heiligtumsraum denken lassen.
- issue: Deutung von חַטָּאת als Opferbezeichnung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ bleibt die allgemein verständliche traditionelle Bezeichnung, während „Reinigungsopfer“ einen wichtigen rituellen Aspekt hervorhebt; diese Spannung wird nicht stillschweigend aufgelöst, sondern in der Fußnote dokumentiert.
- issue: Deutung von אָשָׁם als Opferbezeichnung
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer
  rationale: „Schuldopfer“ wahrt die geläufige Bezeichnung, während die alternative Wiedergabe den mit dem Opfer verbundenen Wiedergutmachungsaspekt stärker betont.
- issue: Geschlechtsspezifische Bezeichnung der priesterlichen Nachkommen Aarons
  choice: Söhne
  alternative: Kinder / Nachkommen
  rationale: Das Hebräische nennt ausdrücklich die Söhne; im Zusammenhang des männlichen Priesterdienstes ist die Bezeichnung nicht bloß generisch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hochheilig“ gibt die kultische Höchststufe knapp wieder. Die Aufzählung folgt der hebräischen Struktur, bleibt aber im Deutschen flüssig. Das ungewohnte „zurückgeben“ wurde bewusst beibehalten und durch eine Fußnote erläutert, um das Bild des hebräischen Verbs nicht zu glätten.
