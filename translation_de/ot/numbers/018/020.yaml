  source_fidelity: 'Der Entwurf gibt die drei parallelen Aussagen des Hebräischen präzise wieder: Aaron erhält keinen Erbbesitz im Land und keinen Anteil innerhalb Israels; Jahwe selbst ist sein Anteil und Erbbesitz. Die Wiederaufnahme von „Anteil“ für חֵלֶק und von „Erbbesitz“ für נַחֲלָה wahrt die sprachlichen Verknüpfungen. „In ihrem Land“, „unter ihnen“ und „inmitten der Söhne Israels“ decken die jeweiligen Orts- bzw. Gemeinschaftsbezüge angemessen ab.'
