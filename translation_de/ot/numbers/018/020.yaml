source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: de
  text: 'Und Jahwe sprach zu Aaron: »In ihrem Land sollst du keinen Erbbesitz erhalten, und unter ihnen sollst du keinen Anteil haben. Ich bin dein Anteil und dein Erbbesitz inmitten der Söhne Israels[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »inmitten der Israeliten« beziehungsweise »inmitten des Volkes Israel«. Wörtlich steht im Hebräischen: »inmitten der Söhne Israels«.'
    reason: Lexikalische Alternative zum festen hebräischen Ausdruck בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes, statt ihn durch den Titel »der HERR« zu ersetzen.
- source_word: בְּאַרְצָם
  choice: in ihrem Land
  rationale: אֶרֶץ bezeichnet hier das Landgebiet Israels, in dem die Stämme ihren Erbbesitz erhalten.
- source_word: תִנְחָל
  choice: sollst du keinen Erbbesitz erhalten
  rationale: Das Verb נחל bezeichnet hier den Empfang eines erblich zugewiesenen Besitzes. Die Wiedergabe ist im Deutschen eindeutig und bewahrt den Bezug auf die Landverteilung.
- source_word: חֵלֶק
  choice: Anteil
  rationale: »Anteil« bezeichnet einen zugewiesenen Teil und lässt sich sowohl für Landbesitz als auch für Jahwes Selbstbezeichnung verwenden.
- source_word: בְּתוֹכָם
  choice: unter ihnen
  rationale: Die Formulierung bezeichnet Aarons Stellung innerhalb der Gemeinschaft Israels und klingt im Deutschen natürlich.
- source_word: אֲנִי חֶלְקְךָ
  choice: Ich bin dein Anteil
  rationale: Die knappe Formulierung bewahrt die theologisch gewichtige Gleichsetzung und die lexikalische Verbindung zum zuvor genannten Anteil.
- source_word: נַחֲלָתְךָ
  choice: dein Erbbesitz
  rationale: נַחֲלָה bezeichnet besonders im Zusammenhang der Landverteilung den als Erbe zugewiesenen Besitz. »Erbbesitz« vermeidet die deutsche Mehrdeutigkeit von »Erbe« als erbender Person.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: inmitten der Söhne Israels
  rationale: Die Wiedergabe bewahrt sowohl die lokale bzw. gemeinschaftliche Nuance von בְּתוֹךְ als auch die wörtliche familiäre Form des festen Ausdrucks בְּנֵי יִשְׂרָאֵל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Jahwe als Anteil und Erbbesitz Aarons
  choice: Ich bin dein Anteil und dein Erbbesitz
  alternative: Ich gebe dir deinen Anteil und dein Erbe
  rationale: Der Text setzt Jahwe selbst mit Aarons Anteil und Erbbesitz gleich. Diese theologische Spannung darf nicht zu einer bloßen Aussage über Gottes Versorgung abgeschwächt werden.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die formale Wiedergabe erhält das im Hebräischen vorhandene familiäre und bundesgeschichtliche Bild; eine geläufige kollektive Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die Wiederaufnahme von »Anteil« und »Erbbesitz« erhalten die Rechts- und Erbterminologie sowie den theologischen Höhepunkt des hebräischen Verses.
