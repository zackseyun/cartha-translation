  terminology: „Jahwe“ gibt den Gottesnamen wieder. „Anteil“ und „Erbbesitz“ sind konsistent und kontextgerecht. Die formale Wiedergabe „Söhne Israels“ ist vertretbar; die Fußnote nennt idiomatischere kollektive Alternativen, ohne den Textsinn zu verändern.
