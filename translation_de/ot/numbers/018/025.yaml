  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Verbform führt den nächsten Erzählschritt ein; „Und … sprach“ gibt sowohl die Verknüpfung als auch den feierlichen, wiederkehrenden Redeeinleitungsstil natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: אֶל kennzeichnet hier den Adressaten des Sprechens; „zu Mose“ ist die idiomatische deutsche Form.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Formel leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird idiomatisch mit einem Doppelpunkt wiedergegeben, da die angekündigte Rede im folgenden Vers beginnt.
