  variant: modern standard German
source:
  edition: WLC
  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: de
  text: 'Und den, der ausgelöst werden muss, sollst du vom Alter eines Monats an auslösen, entsprechend deiner Schätzung: fünf Schekel Silber nach dem Schekel des Heiligtums; er[a] beträgt zwanzig Gera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklich: »Der Schekel beträgt zwanzig Gera.« Das hebräische Pronomen »er« bezieht sich auf den Schekel des Heiligtums als Gewichtsstandard.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: Und den, der ausgelöst werden muss
  rationale: Die schwierige passive Nominalform mit Suffix bezeichnet im Zusammenhang den auslösungspflichtigen Erstgeborenen. Die deutsche singularische Form gibt die generische Rechtsanweisung natürlich wieder, ohne die syntaktische Schwierigkeit künstlich aufzulösen.
- source_word: מִבֶּן חֹדֶשׁ
  choice: vom Alter eines Monats an
  rationale: Die Wendung bezeichnet die Altersgrenze, ab der die Auslösung erfolgen soll.
- source_word: תִּפְדֶּה
  choice: sollst du … auslösen
  rationale: Das Imperfekt der 2. Person Singular drückt in dieser Rechtsbestimmung eine verbindliche Anweisung aus.
- source_word: בְּעֶרְכְּךָ
  choice: entsprechend deiner Schätzung
  rationale: Die Formulierung bewahrt den rechtlich-priesterlichen Sinn eines festgesetzten Wertes und das Suffix der 2. Person Singular.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: fünf Schekel Silber
  rationale: Dies ist eine natürliche deutsche Wiedergabe der Gewichts- beziehungsweise Wertangabe samt Material.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Wendung bezeichnet den beim Heiligtum geltenden Gewichtsstandard; die traditionelle Sachbezeichnung bleibt erkennbar.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: er beträgt zwanzig Gera
  rationale: Das maskuline Pronomen wird formal mit „er“ wiedergegeben und bezieht sich im Zusammenhang auf den Schekel des Heiligtums.
theological_decisions: []
