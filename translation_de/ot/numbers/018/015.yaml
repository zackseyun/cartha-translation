language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: de
  text: Alles, was den Mutterleib öffnet,[a] von jedem Lebewesen, das man Jahwe darbringt, sei es Mensch oder Tier, soll dir gehören. Doch die Erstgeburt des Menschen musst du auf jeden Fall auslösen, und die Erstgeburt eines unreinen Tieres musst du ebenfalls auslösen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alles, was den Mutterleib öffnet«. Die hebräische Wendung bezeichnet den ersten Nachwuchs, der aus dem Mutterleib hervorgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: Erstgeburt, die den Mutterschoß öffnet
  rationale: Die hebräische Wendung bezeichnet den ersten Nachwuchs, der aus dem Mutterleib hervorgeht. Die Formulierung bewahrt das Bild und ist im Deutschen verständlich.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: Jede ... von allem Fleisch
  rationale: Die Konstruktion drückt einen umfassenden Geltungsbereich aus. »Alles Fleisch« hält die breite hebräische Kategorie lebender Wesen fest.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: das man Jahwe darbringt
  rationale: הקריב bedeutet im kultischen Zusammenhang »heranbringen« oder »darbringen«. »Darbringen« wahrt den kultischen Bezug, ohne zu behaupten, Menschen und alle Tiere würden geopfert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: sei es Mensch oder Tier
  rationale: Die idiomatische deutsche Wendung gibt die beiden Bereiche prägnant wieder, für die die Erstgeburtsregel gilt.
- source_word: יִהְיֶה לָּךְ
  choice: soll dir gehören
  rationale: Die Wendung bezeichnet den Anspruch des angesprochenen Priesters.
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel leitet eine einschränkende Gegenbestimmung zum vorher genannten Anspruch ein.
- source_word: פָּדֹה תִפְדֶּה
  choice: musst du auf jeden Fall auslösen
  rationale: Infinitivus absolutus und finite Verbform verstärken die Verpflichtung. »Auf jeden Fall« bildet die nachdrückliche hebräische Konstruktion natürlich ab.
- source_word: בְּכוֹר הָאָדָם
  choice: die Erstgeburt des Menschen
  rationale: אָדָם bezeichnet hier den Menschen im Gegensatz zum Tier. Die Formulierung ist präzise und im modernen Deutschen natürlich.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: die Erstgeburt eines unreinen Tieres
  rationale: Gemeint ist ein kultisch unreines, für das Opfer ungeeignetes Tier, dessen Erstgeburt deshalb ausgelöst wird.
theological_decisions:
- issue: Bedeutung von אָדָם im Gegensatz zum Tier
  choice: Mensch
  alternative: Mann; Menschheit
  rationale: Der Kontext unterscheidet menschliche von tierischer Erstgeburt. »Mensch« gibt diese Artbezeichnung im heutigen Deutsch ohne unnötige Geschlechtsspezifizierung wieder.
- issue: Art des priesterlichen Anspruchs auf die Erstgeburt
  choice: Die Erstgeburt gehört dem Priester; menschliche Erstgeburt und die Erstgeburt unreiner Tiere werden jedoch ausgelöst.
  alternative: »Darbringen« so zu verstehen, als werde jede Erstgeburt tatsächlich geopfert
  rationale: Die ausdrückliche Einschränkung im selben Vers schließt aus, dass alle genannten Erstgeburten wörtlich als Opfer getötet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Schlüsselbegriffe wie »darbringen« und »auslösen« bleiben erhalten; der Satzbau wurde für gute Verständlichkeit maßvoll geglättet. Der Singular »man« gibt das unbestimmte hebräische Subjekt natürlich wieder.
