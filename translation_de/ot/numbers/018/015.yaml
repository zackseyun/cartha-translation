  naturalness: „Jede Erstgeburt ... von allem Fleisch“ ist im Deutschen schwerfällig und die Relativsatzbeziehung ist missverständlich. „Alles, was den Mutterleib öffnet, von jedem Lebewesen ...“ gibt die hebräische Konstruktion verständlich und in würdigem modernem Standarddeutsch wieder.
  terminology: „Jahwe“, „darbringen“ und „auslösen“ sind hier sachgerecht. „Unreines Tier“ bewahrt die kultische Kategorie, ohne sie ausdeutend zu paraphrasieren.
