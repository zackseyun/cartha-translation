  language: de
  text: Alles, was in Israel unwiderruflich geweiht ist, soll dir gehören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alles in Israel, was dem Bann verfallen ist“. Das hebräische Wort bezeichnet etwas, das Gott unwiderruflich geweiht ist; in manchen Zusammenhängen ist es zur Vernichtung bestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Alles, was
  rationale: Der Quantor bezeichnet die Gesamtheit der unter חֵרֶם fallenden Dinge; die deutsche Konstruktion ist natürlich und bewahrt den kollektiven Sinn.
- source_word: חֵרֶם
  choice: unwiderruflich geweiht
  rationale: Der Ausdruck bezeichnet etwas, das Gott endgültig übereignet und gewöhnlicher menschlicher Verfügung entzogen ist; je nach Zusammenhang kann dies auch die Vernichtung einschließen. Die Formulierung gibt den kultisch-rechtlichen Kern wieder, ohne die Vernichtungsbedeutung im Haupttext festzulegen.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition bezeichnet hier den Bereich, innerhalb dessen diese rechtliche Regelung gilt.
- source_word: לְךָ
  choice: dir gehören
  rationale: Die Präposition mit Suffix weist Aaron das Betreffende als rechtmäßigen Besitz beziehungsweise Anteil zu.
- source_word: יִהְיֶה
  choice: soll ... gehören
  rationale: Das Imperfekt hat im Gesetzeskontext zuweisenden, normativen Sinn; „soll gehören“ klingt im modernen Deutschen natürlich und rechtlich bestimmt.
theological_decisions:
- issue: Wiedergabe des kultisch-rechtlichen Fachbegriffs חֵרֶם
  choice: unwiderruflich geweiht
  alternative: dem Bann verfallen / zur Vernichtung geweiht
  rationale: חֵרֶם kann eine endgültige Übereignung an Gott bezeichnen und in bestimmten Zusammenhängen Vernichtung einschließen. Der Haupttext wahrt den weiteren Sinn; die stärkere Alternative wird in der Fußnote dokumentiert, damit die Spannung nicht stillschweigend aufgelöst wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sachlich-rechtliche Formulierung passt zum priesterlichen Gesetzeskontext; der technische hebräische Begriff wird verständlich wiedergegeben und zugleich in der Fußnote erläutert.
