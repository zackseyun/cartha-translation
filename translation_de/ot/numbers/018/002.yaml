  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: de
  text: Führe auch deine Brüder, den Stamm Levi, den Stamm deines Vaters, zu dir heran, damit sie sich dir anschließen[a] und dir dienen, während du und deine Söhne vor dem Zelt des Zeugnisses[b] seid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich dir zugesellen« oder »dir zugeordnet werden«; das hebräische Verb klingt zugleich an den Namen Levi an.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Zelt des Zeugnisses«. Viele Übersetzungen geben hier in Anlehnung an verwandte Bezeichnungen des Heiligtums »Zelt der Begegnung« wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: auch
  rationale: Gibt die additive Bedeutung am Satzanfang natürlich und knapp wieder.
- source_word: אַחֶיךָ
  choice: deine Brüder
  rationale: Bewahrt die familiäre Ausdrucksweise des Hebräischen; gemeint sind im Zusammenhang Aarons levitische Stammesbrüder.
- source_word: מַטֵּה לֵוִי
  choice: den Stamm Levi
  rationale: מַטֶּה bezeichnet hier eindeutig den Stamm und keinen Stab.
- source_word: שֵׁבֶט אָבִיךָ
  choice: den Stamm deines Vaters
  rationale: Die appositionelle Bestimmung wird formal nah am Hebräischen bewahrt und bezeichnet Aarons väterlichen Stamm.
- source_word: הַקְרֵב אִתָּךְ
  choice: Bring … zu dir
  rationale: Gibt den Hifil-Imperativ von קרב und die Zuordnung zu Aaron idiomatisch wieder; die kultische Heranführung bleibt im Zusammenhang erkennbar.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: Sie sollen sich dir anschließen
  rationale: Bewahrt den Gedanken des Sich-Anschließens beziehungsweise der festen Zuordnung und lässt zugleich die Anspielung auf den Namen Levi erkennbar werden.
- source_word: וִישָׁרְתוּךָ
  choice: und dir dienen
  rationale: שרת bezeichnet den Dienst; „dienen“ ist im modernen Deutschen klarer und weniger kirchensprachlich als „Dienst tun“ oder „amtieren“.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: während du und deine Söhne mit dir … seid
  rationale: Bringt die gleichzeitige, aber unterschiedene Stellung Aarons und seiner Söhne gegenüber dem Dienst der Leviten natürlich zum Ausdruck.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: vor dem Zelt des Zeugnisses
  rationale: Folgt dem tatsächlich überlieferten Ausdruck „Zelt des Zeugnisses“ und harmonisiert ihn nicht mit dem geläufigeren „Zelt der Begegnung“.
theological_decisions:
- issue: Wiedergabe von אֹהֶל הָעֵדֻת
  choice: Zelt des Zeugnisses
  alternative: Zelt der Begegnung
  rationale: Der hebräische Text hat hier ausdrücklich עֵדֻת, „Zeugnis“. Die Übersetzung bewahrt diese Bundes- und Zeugnisvorstellung, statt die Formulierung an eine geläufigere Bezeichnung des Heiligtums anzugleichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Stamm … Stamm“ bewahrt die appositionelle Struktur und die Betonung der Herkunft. Der lange hebräische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert; „während“ stellt den sachlichen Zusammenhang der Satzteile her.
