source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: de
  text: 'Und dies gehört dir: die Abgabe von ihren Gaben[a] samt allen Schwingopfern der Israeliten. Ich habe sie dir sowie deinen Söhnen und deinen Töchtern, die bei dir sind, als dauernde Ordnung gegeben. Jeder in deinem Haus, der rein ist[b], darf davon essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der als heilige Gabe ausgesonderte Anteil“. Das hebräische Wort bezeichnet eine für den heiligen Gebrauch bestimmte Abgabe und wird traditionell auch mit „Hebopfer“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: „Rein“ bedeutet hier kultisch beziehungsweise rituell rein, nicht bloß körperlich sauber oder moralisch rechtschaffen.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: die Abgabe von ihren Gaben
  rationale: תְּרוּמָה bezeichnet einen für den heiligen Gebrauch ausgesonderten Anteil bzw. eine Abgabe; מַתָּנָם bedeutet wörtlich „ihre Gaben“. Die Wiedergabe wahrt beide Begriffe, ohne einen zusätzlichen technischen Opferbegriff einzutragen.
- source_word: תְּנוּפֹת
  choice: Schwingopfer
  rationale: תְּנוּפָה ist der kultische Fachausdruck für eine Gabe, die in einem rituellen Präsentationsakt geschwungen wurde. „Schwingopfer“ ist im Deutschen die geläufige präzise Bezeichnung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung ist hier eine konventionelle Kollektivbezeichnung für das Volk Israel. „Die Israeliten“ ist im modernen Deutschen natürlich und inhaltlich genau.
- source_word: נְתַתִּים
  choice: Ich habe sie … gegeben
  rationale: Das Perfekt bezeichnet die vollzogene Zuweisung der genannten heiligen Anteile. Das Pronomen nimmt die zuvor genannten Gaben beziehungsweise Schwingopfer auf.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: sowie deinen Söhnen und deinen Töchtern, die bei dir sind
  rationale: Söhne und Töchter werden im Hebräischen ausdrücklich genannt. „Die bei dir sind“ gibt אִתָּךְ verständlich als Zugehörigkeit zu Aarons Haushaltssphäre wieder.
- source_word: לְחָק עוֹלָם
  choice: als dauernde Ordnung
  rationale: חֹק bezeichnet eine festgesetzte Ordnung oder Rechtsbestimmung; עוֹלָם betont ihre fortdauernde Geltung. „Dauernde Ordnung“ klingt gegenwärtig und bewahrt den rechtlichen Charakter.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: Jeder in deinem Haus, der rein ist
  rationale: טָהוֹר bezeichnet im priesterlichen Kontext kultische Reinheit. Die knappe Haupttextformulierung wird in einer Fußnote gegen ein bloß körperliches oder moralisches Verständnis abgegrenzt.
- source_word: יֹאכַל אֹתוֹ
  choice: darf davon essen
  rationale: Der Imperfekt drückt hier die rechtlich gewährte Erlaubnis aus. „Davon“ ist im Deutschen bei den zuvor genannten Speiseanteilen natürlicher als ein singularisches „es“ und lässt den kollektiven Bezug des hebräischen אֹתוֹ bestehen.
theological_decisions:
- issue: Rituelle Reinheit
  choice: „rein“ wird als kultische beziehungsweise rituelle Reinheit verstanden.
  alternative: moralisch lauter oder lediglich körperlich sauber
  rationale: Der Zusammenhang regelt innerhalb des priesterlichen Rechts, wer von heiligen Anteilen essen darf; daher ist der Status kultischer Reinheit gemeint.
- issue: Zeitliche Tragweite von חָק עוֹלָם
  choice: „dauernde Ordnung“
  alternative: „ewige Satzung“
  rationale: עוֹלָם kennzeichnet hier die fortgeltende Ordnung innerhalb des beschriebenen Bundes- und Kultzusammenhangs. „Dauernd“ bewahrt diesen Anspruch, ohne die theologische Frage nach seiner heilsgeschichtlichen Reichweite im Übersetzungstext vorzuentscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Satzführung. Kultische Fachbegriffe werden nur dort verwendet, wo der hebräische Text selbst technisch ist; „Schwingopfer“ bleibt deshalb erhalten und „Abgabe“ wird in der Fußnote erläutert.
