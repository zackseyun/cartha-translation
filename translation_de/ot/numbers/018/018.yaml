  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: de
  text: Doch ihr Fleisch[a] soll dir gehören; wie die Brust des Schwingopfers[b] und wie die rechte Keule soll es dir gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr Fleisch“. Gemeint ist der essbare Anteil des Opfertiers.'
    reason: lexical_alternative
  - marker: b
    text: 'Beim „Schwingopfer“ wurde der betreffende Anteil in einer rituellen Bewegung vor dem HERRN dargebracht; daher auch: „Präsentationsopfer“.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: Doch ihr Fleisch
  rationale: בָּשָׂר bezeichnet wörtlich „Fleisch“ und meint hier den essbaren Anteil des Opfertiers. „Doch“ gibt den sachlichen Übergang vom für Gott bestimmten Blut und Fett im vorherigen Vers zum Anteil des Priesters wieder.
- source_word: יִהְיֶה לָּךְ
  choice: soll dir gehören
  rationale: Die Verbindung היה + ל drückt Besitz beziehungsweise rechtmäßige Zuweisung aus. „Soll dir gehören“ bewahrt den rechtlich-kultischen Charakter.
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: wie die Brust des Schwingopfers
  rationale: חָזֶה ist die Brustpartie; תְּנוּפָה bezeichnet die rituelle Darbringung durch eine präsentierende Bewegung. „Schwingopfer“ ist der geläufige deutsche Fachausdruck.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: und wie die rechte Keule
  rationale: שׁוֹק bezeichnet den als Opferanteil zugeteilten oberen Bein- beziehungsweise Keulenbereich. „Keule“ ist im Deutschen für ein Schlachttier natürlicher und genauer als „Schenkel“.
- source_word: לְךָ יִהְיֶה
  choice: soll es dir gehören
  rationale: Die wiederholte Besitzformel wird beibehalten, damit die hebräische Betonung der priesterlichen Zuweisung erkennbar bleibt.
theological_decisions:
- issue: Bezug der Anredeformen
  choice: Beide Formen werden mit dem singularischen „dir“ wiedergegeben und auf Aaron als angesprochenen Repräsentanten des Priestertums bezogen.
  alternative: Die Zuweisung ausdrücklich auf Aaron und seine priesterliche Familie ausweiten oder im Plural formulieren.
  rationale: Der Kontext richtet die Rede an Aaron, während die Zuweisung seinem priesterlichen Haus zugutekommt. Die hebräischen Suffixe wechseln formal zwischen einer femininen und einer maskulinen Form; die deutsche Wiedergabe sollte daraus ohne weitere Textsignale keinen Referentenwechsel ableiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „soll dir gehören“ folgt der Betonung des Hebräischen; die kultischen Fachbegriffe werden durch knappe Fußnoten erschlossen.
