  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בִּלְעָ֑ם וַ/יַּ֨עַל בָּלָ֧ק וּ/בִלְעָ֛ם פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: de
  text: Balak tat, wie Bileam gesagt hatte, und Balak und Bileam opferten[a] einen Stier und einen Widder auf dem Altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ließ hinaufsteigen“; im Opferzusammenhang bedeutet dies „opferte“ oder „brachte als Opfer dar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: In der Wendung עשה כאשר דבר bezeichnet das Verb das Ausführen einer zuvor erteilten Anweisung; „tat“ ist im Deutschen natürlich und präzise.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: was Bileam gesagt hatte
  rationale: Die Formulierung drückt aus, dass Balak sich nach Bileams vorausgehender Anweisung richtete. Das Plusquamperfekt bewahrt die zeitliche Abfolge.
- source_word: וַיַּעַל
  choice: opferten
  rationale: Der Hifil von עלה bezeichnet bei Opfertieren und in Verbindung mit einem Altar das Darbringen eines Opfers. Der Plural folgt dem zusammengesetzten Subjekt Balak und Bileam.
- source_word: בָּלָק וּבִלְעָם
  choice: Balak und Bileam
  rationale: Die beiden Namen bilden unmittelbar das zusammengesetzte Subjekt des Opferns.
- source_word: פָּר
  choice: einen Stier
  rationale: פָּר bezeichnet im Opferkontext einen Stier; ein bestimmtes Alter wird hier nicht ausdrücklich genannt.
- source_word: וָאַיִל
  choice: und einen Widder
  rationale: אַיִל ist die übliche Bezeichnung für einen Widder.
- source_word: בַּמִּזְבֵּחַ
  choice: auf dem Altar
  rationale: Die Präposition ב wird in diesem Opferkontext im Deutschen natürlich mit „auf“ wiedergegeben.
