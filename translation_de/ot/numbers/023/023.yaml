source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: de
  text: 'Denn gegen Jakob gibt es keine Zeichendeutung und gegen Israel keine Wahrsagerei.[a] Zu dieser Zeit[b] wird über Jakob und Israel gesagt werden: »Was Gott getan hat!«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn in Jakob gibt es keine Zeichendeutung und in Israel keine Wahrsagerei.“ Die hebräische Präposition kann sowohl örtlich („in“) als auch im Sinn von „gegen“ verstanden werden; der Zusammenhang spricht eher für „gegen“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Jetzt“; die Wendung kann auch „zu gegebener Zeit“ verstanden werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch als Frage auffassbar: „Was hat Gott getan?“'
    reason: alternative_reading
lexical_decisions:
- source_word: נַחַשׁ
  choice: Zeichendeutung
  rationale: Das Substantiv bezeichnet hier eine mantische Praxis, besonders das Deuten von Vorzeichen. „Zeichendeutung“ ist verständlich und lässt sich von קֶסֶם unterscheiden.
- source_word: קֶסֶם
  choice: Wahrsagerei
  rationale: Der Ausdruck bezeichnet eine okkulte Form der Zukunfts- oder Orakeldeutung. „Wahrsagerei“ gibt dies in gegenwärtigem Deutsch klar wieder.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: gegen Jakob / gegen Israel
  rationale: Im Zusammenhang von Bileams Spruch liegt der Akzent darauf, dass mantische Praktiken Israel nicht treffen oder überwältigen können. Die hebräische Präposition bleibt jedoch mehrdeutig; die örtliche Wiedergabe „in“ wird deshalb in einer Fußnote genannt.
- source_word: כָּעֵת
  choice: zu gegebener Zeit
  rationale: Die Wendung bezeichnet den passenden Zeitpunkt, zu dem Gottes Handeln erkannt und ausgerufen wird. Die näher am üblichen Zeitdeiktikum liegende Wiedergabe „jetzt/zu dieser Zeit“ bleibt als Alternative in der Fußnote erhalten.
- source_word: יֵאָמֵר
  choice: wird verkündet werden
  rationale: Der Niphal-Imperfekt ist unpersönlich-passiv. „Wird verkündet werden“ bewahrt diese Form und passt zum feierlichen Charakter des Orakels.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: Jakob und Israel
  rationale: Der Dativ gibt die beiden als Empfänger der Verkündigung wieder, ohne sie durch ein zusätzliches „über“ ausdrücklich zum Gegenstand der Aussage zu machen.
- source_word: מַה פָּעַל אֵל
  choice: Was Gott getan hat!
  rationale: Die Wortfolge lässt sich im Zusammenhang am besten als bewundernder Ausruf über Gottes vollbrachte Tat verstehen. Formal ist auch eine Frage möglich; diese Alternative wird in einer Fußnote bewahrt.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die übliche Gottesbezeichnung; eine Erweiterung wie „der mächtige Gott“ ist im unmittelbaren Wortlaut nicht erforderlich.
theological_decisions:
- issue: Verneint der Vers mantische Praktiken innerhalb Israels oder ihre Wirksamkeit gegen Israel?
  choice: Der Haupttext sagt aus, dass Zeichendeutung und Wahrsagerei gegen Jakob beziehungsweise Israel nichts vermögen.
  alternative: In Jakob gibt es keine Zeichendeutung und in Israel keine Wahrsagerei.
  rationale: Bileams Spruch handelt von Gottes Segen und davon, dass Israel nicht durch Fluch oder mantische Mittel bezwungen werden kann. Da בְּ zugleich örtlich verstanden werden kann, wird diese echte Mehrdeutigkeit ausdrücklich vermerkt.
- issue: Ist מַה פָּעַל אֵל eine Frage oder ein Ausruf?
  choice: 'Bewundernder Ausruf: „Was Gott getan hat!“'
  alternative: 'Frage: „Was hat Gott getan?“'
  rationale: Der prophetische Spruch erreicht hier den Höhepunkt in der anerkennenden Verkündigung von Gottes Handeln. Die hebräische Form kann jedoch auch interrogativ gelesen werden, weshalb die Alternative dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden hebräischen Begriffe für mantische Praktiken werden mit „Zeichendeutung“ und „Wahrsagerei“ unterschieden. „Verkündet werden“ erhält den prophetisch-feierlichen Ton, ohne altertümlich zu wirken.
