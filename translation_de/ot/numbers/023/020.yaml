translation:
  language: de
  text: Sieh, ich habe den Auftrag[a] erhalten, zu segnen; er hat gesegnet[b], und ich kann es nicht rückgängig machen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „Ich habe empfangen, zu segnen.“ Was empfangen wurde, bleibt im Hebräischen unausgesprochen; „den Auftrag“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
  - marker: b
    text: Das Subjekt von „er hat gesegnet“ wird im Hebräischen nicht ausdrücklich genannt; der Zusammenhang weist auf Gott.
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „ich kann es nicht widerrufen“ oder „ich kann es nicht zurücknehmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet die Aussage nachdrücklich ein. „Sieh“ ist gegenwärtiges, würdevolles Standarddeutsch und bewahrt die hinweisende Kraft.
- source_word: בָרֵךְ
  choice: zu segnen
  rationale: Die Form bezeichnet hier in Verbindung mit לָקָחְתִּי den empfangenen Auftrag beziehungsweise Inhalt. Die bewusst knappe Infinitivkonstruktion bewahrt, dass das Objekt von „empfangen“ im Hebräischen unausgesprochen bleibt.
- source_word: לָקָחְתִּי
  choice: ich habe empfangen
  rationale: לקח kann „nehmen“ oder „empfangen“ bedeuten. Im Zusammenhang prophetischer Rede passt „empfangen“, ohne ein im Ausgangstext nicht ausdrücklich genanntes Substantiv wie „Auftrag“ oder „Weisung“ einzufügen.
- source_word: וּבֵרֵךְ
  choice: er hat gesegnet
  rationale: Das Perfekt 3. Person maskulin Singular bezeichnet eine vollzogene Segnung. Das Subjekt bleibt wie im Hebräischen unausgesprochen; im Zusammenhang ist Gott gemeint.
- source_word: אֲשִׁיבֶנָּה
  choice: ich kann es nicht rückgängig machen
  rationale: Der Hifil von שוב bedeutet hier, etwas zurückzuwenden oder aufzuheben. „Rückgängig machen“ gibt die Unmöglichkeit wieder, die ausgesprochene Segnung zu widerrufen oder umzukehren.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וּבֵרֵךְ
  choice: „er hat gesegnet“, ohne Gott im Haupttext ausdrücklich einzusetzen
  alternative: „Gott hat gesegnet“ oder unpersönlich „man hat gesegnet“
  rationale: Der unmittelbare Zusammenhang weist deutlich auf Gott als Subjekt, doch der hebräische Text nennt ihn in diesem Satz nicht ausdrücklich. Das Pronomen erhält sowohl den Kontextbezug als auch die Knappheit und formale Offenheit des Ausgangstextes.
- issue: Unausgesprochenes Objekt bei „empfangen“
  choice: Die knappe Konstruktion „ich habe empfangen, zu segnen“ bleibt im Haupttext erhalten
  alternative: „ich habe den Auftrag empfangen, zu segnen“
  rationale: Ein Auftrag ist sachlich naheliegend, aber kein entsprechendes Substantiv steht im Hebräischen. Die gewählte Fassung vermeidet eine unnötige Festlegung und lässt die ungewöhnliche, aber verständliche Struktur erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Formulierung „empfangen, zu segnen“ ist bewusst beibehalten, um das im Hebräischen unausgesprochene Objekt nicht stillschweigend durch „Auftrag“ oder „Weisung“ zu ergänzen. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Textteilen.
