  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: de
  text: 'Dann sagte Bileam zu Balak: »Stell dich neben dein Brandopfer, und ich will gehen. Vielleicht begegnet mir Jahwe; was immer er mir zeigt, werde ich dir mitteilen.« Dann ging er auf eine kahle Anhöhe[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der seltene hebräische Ausdruck ist nicht ganz sicher. Wahrscheinlich bezeichnet er eine kahle oder unbewachsene Anhöhe; er wird auch im Sinn von »allein« verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: Stell dich neben dein Brandopfer
  rationale: Der Hitpael-Imperativ bezeichnet das Einnehmen einer Position. עַל ist hier räumlich als »neben/bei« zu verstehen, nicht so, als solle Balak auf dem Opfer stehen.
- source_word: וְאֵלְכָה
  choice: und ich will gehen
  rationale: Der Kohortativ drückt Bileams beabsichtigtes Handeln aus; »ich will gehen« gibt diesen Willens- und Absichtsaspekt knapp wieder.
- source_word: אוּלַי יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: Vielleicht begegnet mir Jahwe
  rationale: אוּלַי bewahrt die Unsicherheit. Die Verbindung von קרה und לקראת bezeichnet hier die erhoffte Begegnung, ohne dass im Deutschen eine zufällige Begegnung behauptet werden muss.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: was immer er mir zeigt
  rationale: Die gedrängte hebräische Wendung bezeichnet den Inhalt der Offenbarung. Die Wiedergabe ist natürlich und erhält die inhaltliche Offenheit von מַה.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: werde ich dir mitteilen
  rationale: נגד im Hifil bedeutet mitteilen, berichten oder kundtun; »mitteilen« passt zum angekündigten Weitergeben der Offenbarung.
- source_word: שֶׁפִי
  choice: eine kahle Anhöhe
  rationale: Das seltene Wort wird wahrscheinlich topografisch als kahle, unbewachsene oder exponierte Höhe verstanden. »Anhöhe« klingt im modernen Deutsch natürlicher als das substantivierte »Höhe«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als Eigenname bewahrt diese Form, statt sie durch einen Titel zu ersetzen.
- issue: Art der erwarteten Gottesbegegnung
  choice: Vielleicht begegnet mir Jahwe
  alternative: Vielleicht wird Jahwe mir zufällig begegnen
  rationale: Die Formulierung erhält Bileams Unsicherheit durch »vielleicht«, legt jedoch theologisch nicht fest, dass die Begegnung aus Gottes Sicht zufällig wäre.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und nahe an der hebräischen Satzführung; altertümliche Opferterminologie wird nur beim etablierten Wort »Brandopfer« beibehalten.
