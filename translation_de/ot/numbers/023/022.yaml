  text: אֵ֖ל מוֹצִיאָ֣/ם מִ/מִּצְרָ֑יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: de
  text: Gott führt sie aus Ägypten heraus; ihm ist Kraft eigen wie einem Wildrind[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder unter Bewahrung der konkreten Bildsprache: „ihm sind die aufragenden Hörner eines Wildrinds eigen“. Der hebräische Ausdruck ist schwierig; er kann Hörner oder Stärke meinen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier die Einzahl „ihm“. Der Bezug des Singulars nach „sie“ bleibt offen; er kann Israel als Einheit meinen.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier das Subjekt des ersten Satzteils. „Gott“ gibt dies schlicht und ohne zusätzliche Bedeutungspräzisierung wieder.
- source_word: מוֹצִיאָם
  choice: führt sie heraus
  rationale: Das Hifil-Partizip von יצא mit Suffix der 3. Person Plural bezeichnet Gott als den, der sie hinausführt. Das Präsens bewahrt die lebendige, poetische Darstellung des Exodus.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten heraus
  rationale: In Verbindung mit dem Bewegungsverb gibt diese Formulierung die Richtung aus Ägypten im natürlichen modernen Deutsch klar wieder.
- source_word: כְּתוֹעֲפֹת
  choice: die aufragenden Hörner
  rationale: Das seltene תּוֹעֲפֹת kann auf Erhebungen, hornartige Spitzen oder daraus abgeleitet auf Kraft hinweisen. Die konkrete Tiermetapher wird im Haupttext bewahrt; die abstraktere Deutung steht in der Fußnote.
- source_word: רְאֵם
  choice: Wildrind
  rationale: רְאֵם bezeichnet wahrscheinlich ein mächtiges wildes Rind, möglicherweise den Auerochsen. „Wildrind“ ist verständlich und vermeidet die sachlich unwahrscheinliche traditionelle Wiedergabe „Einhorn“.
- source_word: לוֹ
  choice: ihm … zu eigen
  rationale: Die hebräische Form ist Singular. Die deutsche Formulierung erhält diesen Numerus und lässt den wahrscheinlich kollektiv auf Israel bezogenen Rückverweis bestehen, ohne ihn im Haupttext ausdrücklich festzulegen.
theological_decisions:
- issue: Bildsprache von רְאֵם
  choice: Wildrind
  alternative: 'Auerochse; traditionell: Einhorn'
  rationale: Die Aussage verwendet das Bild eines starken wilden Rindes und macht keine mythologische Behauptung. „Wildrind“ entspricht dem wahrscheinlichen Sinn und bleibt allgemein verständlich.
- issue: Konkrete oder abstrakte Wiedergabe von תּוֹעֲפֹת
  choice: aufragende Hörner
  alternative: Kraft
  rationale: Das Hebräische ist schwierig. Die konkrete Wiedergabe wahrt die Tier- und Hornbildsprache; „Kraft“ bleibt als mögliche Sinnwiedergabe in der Fußnote erhalten.
- issue: Bezug des singularischen לוֹ nach dem pluralischen מוֹצִיאָם
  choice: singularisches „ihm“ beibehalten
  alternative: explizit „Israel“ oder pluralisch „ihnen“
  rationale: Der Numeruswechsel im masoretischen Text wird nicht geglättet. Wahrscheinlich ist Israel als kollektive Einheit gemeint, doch die Übersetzung macht diese Deutung nicht zwingend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildhaftigkeit. Die ungewöhnliche Wendung „ihm … zu eigen“ bewahrt den singularischen Rückbezug und vermeidet eine vorschnelle Auflösung der hebräischen Mehrdeutigkeit.
