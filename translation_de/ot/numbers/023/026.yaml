source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: de
  text: 'Bileam antwortete und sagte zu Balak: »Habe ich dir nicht gesagt: Alles, was Jahwe sagt, werde ich tun?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר אֶל בָּלָק
  choice: Bileam antwortete und sagte zu Balak
  rationale: Die hebräische Doppelwendung aus ענה und אמר wird beibehalten. Obwohl im Deutschen auch schlicht »Bileam antwortete Balak« möglich wäre, bildet diese Fassung die Erzählformel genauer ab und bleibt verständlich.
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: Habe ich dir nicht gesagt
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. »Gesagt« gibt דבר mit dem folgenden Zitat im Deutschen natürlicher wieder als »gesprochen«.
- source_word: לֵאמֹר
  choice: '[durch den Doppelpunkt vor dem Zitat wiedergegeben]'
  rationale: Der hebräische Zitateinleiter wird im natürlichen modernen Deutsch durch einen Doppelpunkt ausgedrückt, statt mit dem schwerfälligen »indem ich sagte«.
- source_word: כֹּל אֲשֶׁר יְדַבֵּר יְהוָה
  choice: Alles, was Jahwe sagt
  rationale: »Alles, was« bewahrt den umfassenden Sinn von כֹּל אֲשֶׁר. Das Imperfekt יְדַבֵּר bezeichnet hier allgemein das, was Jahwe jeweils sagt; deutsches Präsens gibt diesen Sinn angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: werde ich tun
  rationale: Das vorangestellte Objekt אֹתוֹ verweist zusammenfassend auf alles zuvor Genannte. Im Deutschen ist dieser Bezug bereits durch »Alles, was …« deutlich; eine zusätzliche Wiederholung mit »das« wäre möglich, aber weniger flüssig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Umschrift »Jahwe« bewahrt den Eigennamen, ohne ihn in einen Titel umzudeuten.
- issue: Reichweite von Bileams Verpflichtung
  choice: Alles, was Jahwe sagt, werde ich tun
  alternative: Was immer Jahwe sagt, muss ich tun
  rationale: Der Text enthält eine Willens- beziehungsweise Zukunftsform (אֶעֱשֶׂה), aber kein ausdrückliches Modalverb für Zwang. Daher wird kein »muss« ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Antwortformel bleibt sichtbar, während der Zitateinleiter idiomatisch durch Interpunktion wiedergegeben wird. Die rhetorische Frage und die umfassende Verpflichtung Bileams werden ohne zusätzliche Deutung bewahrt.
