id: NUM.23.5
reference: Numbers 23:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: de
  text: 'Da legte Jahwe Bileam ein Wort in den Mund und sagte: »Kehre zu Balak zurück, und so sollst du reden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: legte
  rationale: שׂוּם bedeutet hier „legen, setzen“. „Legte ... in den Mund“ bewahrt das konkrete hebräische Bild und ist im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דָּבָר
  choice: ein Wort
  rationale: Das singularische דָּבָר bezeichnet hier die von Gott eingegebene Rede beziehungsweise Botschaft. „Ein Wort“ wahrt Zahl und Bildlichkeit des Hebräischen.
- source_word: בְּפִי בִלְעָם
  choice: Bileam ... in den Mund
  rationale: Die deutsche Wortstellung gibt die Wendung wörtlich und zugleich natürlich wieder.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: Die übliche deutsche Erzählform gibt das Wayyiqtol angemessen wieder; Jahwe bleibt aus dem vorhergehenden Satzteil eindeutig das Subjekt.
- source_word: שׁוּב אֶל בָּלָק
  choice: Kehre zu Balak zurück
  rationale: שׁוּב ist ein Imperativ mit der Bedeutung „zurückkehren“; die gewählte Form ist klar, würdig und gegenwärtig.
- source_word: וְכֹה תְדַבֵּר
  choice: und so sollst du reden
  rationale: כֹה bedeutet „so, auf diese Weise“ und תְדַבֵּר „du sollst reden“. Die Formulierung bewahrt den Anweisungscharakter, ohne unnötig altertümlich zu wirken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der persönliche Gottesname. Die Transliteration „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Mitteilung an Bileam
  choice: ein Wort in den Mund legen
  alternative: eine Botschaft eingeben
  rationale: Die konkrete Redeweise des Hebräischen bleibt erhalten. Sie sagt aus, dass Gott Bileams auszusprechendes Wort bestimmt, ohne die genaue Wirkungsweise weiter auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Das konkrete hebräische Bild vom Wort im Mund bleibt erhalten; „so sollst du reden“ wahrt die knappe Anweisung von וְכֹה תְדַבֵּר.
