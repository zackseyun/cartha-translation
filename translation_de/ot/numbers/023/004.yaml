source:
  edition: WLC
  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: de
  text: 'Und Gott begegnete Bileam[a]. Bileam sagte zu ihm: »Die sieben Altäre habe ich hergerichtet und auf dem Altar einen Stier und einen Widder als Opfer dargebracht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott traf auf Bileam«; das hebräische Verb bezeichnet eine Begegnung und kann in manchen Zusammenhängen auch die Nuance eines unvermuteten Zusammentreffens haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: begegnete
  rationale: Das Verb קָרָה bezeichnet hier eine Begegnung. »Begegnete« gibt den Vorgang natürlich wieder, ohne ihn als zufälliges Zusammentreffen zu deuten; die mögliche Bedeutungsnuance wird in der Fußnote genannt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht hier mit einem Verb im Singular und bezeichnet eindeutig den einen Gott.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Die im Deutschen gebräuchliche Form des Personennamens.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Der sagte zu ihm
  rationale: Der Sprecher ist Bileam, wie die anschließenden Verben in der ersten Person zeigen. Das Demonstrativpronomen macht den Subjektwechsel im Deutschen eindeutig.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: die sieben Altäre
  rationale: Der bestimmte Ausdruck verweist auf die sieben bereits zuvor errichteten Altäre.
- source_word: עָרַכְתִּי
  choice: habe ich hergerichtet
  rationale: ערך bedeutet anordnen, in Ordnung bringen oder herrichten. Im Zusammenhang mit Altären ist »herrichten« natürlich und bewahrt den Gedanken gezielter Vorbereitung.
- source_word: וָאַעַל
  choice: als Opfer dargebracht
  rationale: עלה bezeichnet im Opferkontext das Hinaufbringen beziehungsweise Darbringen eines Opfers. Die Formulierung macht den kultischen Sinn im heutigen Deutsch deutlich.
- source_word: פָּר
  choice: einen Stier
  rationale: »Stier« ist die übliche deutsche Wiedergabe für פר im Opferkontext; eine Altersangabe ist hier nicht ausdrücklich gefordert.
- source_word: וָאַיִל
  choice: und einen Widder
  rationale: »Widder« ist die übliche Wiedergabe von איל im Opferkontext.
- source_word: בַּמִּזְבֵּחַ
  choice: auf dem Altar
  rationale: Die hebräische Form steht ausdrücklich im Singular mit Artikel. Daher wird sie nicht ohne Kennzeichnung zu »auf jedem Altar« erweitert.
theological_decisions:
- issue: Art der Gottesbegegnung in וַיִּקָּר
  choice: Als wirkliche Begegnung wiedergeben, ohne Zufälligkeit auszudrücken
  alternative: »Gott traf zufällig auf Bileam« oder »Gott widerfuhr Bileam«
  rationale: Die Wurzel kann in anderen Zusammenhängen das zufällige Eintreten oder Zusammentreffen bezeichnen. Hier handelt Gott jedoch als Subjekt und spricht im Fortgang gezielt mit Bileam. »Begegnete« wahrt die lexikalische Breite, ohne eine theologisch sachfremde Zufälligkeit festzuschreiben.
- issue: Singular בַּמִּזְבֵּחַ nach sieben Altären
  choice: Den formalen Singular »auf dem Altar« bewahren
  alternative: Distributiv »auf jedem Altar«
  rationale: Der Kontext aus Vers 1 legt nahe, dass auf jedem der sieben Altäre ein Stier und ein Widder geopfert wurden. Der vorliegende hebräische Text verwendet hier jedoch den Singular; die Hauptübersetzung bewahrt diese Spannung, statt den distributiven Sinn ausdrücklich einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wird nach »Bileam« geteilt, und »Der sagte« klärt den im Hebräischen nur aus der folgenden Ich-Rede erkennbaren Subjektwechsel. Die Voranstellung »Die sieben Altäre« bildet die hebräische Objektbetonung ab. Der Singular »auf dem Altar« bleibt trotz des möglichen distributiven Kontexts erhalten.
