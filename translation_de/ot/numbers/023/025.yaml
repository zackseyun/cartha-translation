  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: de
  text: 'Und Balak sagte zu Bileam: »Verfluche ihn keinesfalls und segne ihn keinesfalls!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Verfluchen sollst du ihn nicht … segnen sollst du ihn nicht.« In beiden Satzteilen steht im Hebräischen vor der gebeugten Verbform eine zusätzliche Verbform, die die Aussage stark betont.'
    reason: Die Fußnote erläutert die hebräische Konstruktion aus Infinitivus absolutus und finitem Verb, deren Nachdruck im Haupttext durch »keinesfalls« wiedergegeben wird.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und ... sagte
  rationale: Die übliche deutsche Wiedergabe der fortlaufenden hebräischen Erzählform wahrt den Anschluss an den vorherigen Zusammenhang.
- source_word: בָּלָק ... בִּלְעָם
  choice: Balak ... Bileam
  rationale: Die Personennamen folgen den im Deutschen geläufigen biblischen Namensformen.
- source_word: גַּם ... גַּם
  choice: weder ... noch
  rationale: In den beiden parallelen verneinten Aufforderungen bildet »weder ... noch« die Funktion der wiederholten Partikel idiomatisch ab.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: du sollst ihn ... nicht verfluchen
  rationale: Das Verb קבב bezeichnet im Bileam-Zusammenhang das Aussprechen eines Fluches. Die deutsche Konstruktion mit »sollst« gibt Balaks nachdrückliche direkte Anweisung natürlich wieder.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: noch segnen
  rationale: ברך bedeutet hier »segnen«; die parallele Formulierung erhält die ausgewogene Struktur des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Du sollst« wahrt den befehlenden Nachdruck; »weder ... noch« gibt die parallelen verneinten Glieder natürlich wieder. Der Fußnotenmarker steht unmittelbar nach der gesamten direkten Rede, auf die er sich bezieht.
