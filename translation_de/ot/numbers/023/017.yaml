    rationale: Die Bezeichnung kann im modernen Deutschen vorrangig einen militärischen Dienstgrad hervorrufen. Der hebräische Ausdruck bezeichnet allgemein Fürsten, führende Amtsträger oder Anführer. „Fürsten“ ist im erzählerisch-höfischen Kontext die naheliegendere Hauptlesart.
  - severity: low
    issue: „Was hat Jahwe gesprochen?“
    rationale: Die Formulierung ist zwar verständlich und quellennahe, aber im modernen Deutsch unidiomatisch. „Was hat Jahwe gesagt?“ gibt דבר in direkter Rede natürlich wieder.
