  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Elemente des Hebräischen zuverlässig wieder: Bileam kommt zu Balak; Balak steht bei seinem Brandopfer, die שָׂרֵי מוֹאָב sind bei ihm, und Balak fragt nach Jahwes Rede. „Bei seinem Brandopfer“ ist für עַל עֹלָתוֹ eine sachgerechte räumliche Wiedergabe. Die Pronomen bewahren die im Ausgangstext gegebene Verweisstruktur.'
  naturalness: „Obersten“ ist in heutigem Standarddeutsch ohne weiteren Kontext stark militärisch geprägt und daher für שָׂרִים weniger natürlich. „Fürsten“ ist hier als traditionelle und weiterhin verständliche Bezeichnung für hochrangige politische Würdenträger passend. Bei der Frage klingt „Was hat Jahwe gesagt?“ im Deutschen deutlich idiomatischer als „Was hat Jahwe gesprochen?“, ohne den Sinn von דִּבֶּר zu verändern.
  terminology: „Jahwe“ gibt den Gottesnamen יהוה korrekt als Eigenname wieder. „Brandopfer“ ist der etablierte deutsche Terminus für עֹלָה. Für שָׂרִים wird „Fürsten“ als Haupttext gewählt; die Fußnote hält mit „führende Amtsträger“ die mögliche weniger dynastische Nuance fest.
