  rationale: Die Revision vermeidet die modern deutschsprachig naheliegende militärische Nebenbedeutung von „Obersten“, ordnet die lexikalische Alternative in der Fußnote sachgerecht zu und glättet die abschließende Frage idiomatisch. Der Sinn, die Referenzstruktur und die kultische sowie politische Terminologie des hebräischen Textes bleiben erhalten.
