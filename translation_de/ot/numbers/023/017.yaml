  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: de
  text: 'Er kam zu ihm, und siehe, er stand bei seinem Brandopfer, und die Fürsten Moabs[a] waren bei ihm. Balak sagte zu ihm: „Was hat Jahwe gesagt?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die führenden Amtsträger Moabs.'
    reason: שָׂרִים kann Fürsten, führende Amtsträger oder Anführer bezeichnen; die Fußnote bewahrt diese lexikalische Bandbreite.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: Er kam zu ihm
  rationale: בוא bedeutet unmittelbar „kommen“. Dass Bileam hier von der Begegnung mit Jahwe zurückkehrt, ergibt sich aus dem Zusammenhang, wird aber nicht eigens in das Verb hineingetragen.
- source_word: וְהִנּוֹ
  choice: und siehe
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Szene anschaulich hervor; „siehe“ bewahrt diese Funktion und den abrupten Erzählton.
- source_word: נִצָּב
  choice: er stand
  rationale: Das Partizip bezeichnet den anhaltenden Zustand, in dem Balak bei Bileams Ankunft angetroffen wird. Im Deutschen gibt „stand“ dies natürlich wieder.
- source_word: עַל עֹלָתוֹ
  choice: bei seinem Brandopfer
  rationale: עַל kann hier die räumliche Nähe bezeichnen. „Bei“ ist natürlich und vermeidet die missverständliche Vorstellung, Balak stehe auf dem Opfer.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: und die Obersten Moabs waren bei ihm
  rationale: שָׂרִים bezeichnet hochrangige Amtsträger, Anführer oder Fürsten. „Obersten“ wahrt den hohen Rang, ohne eine bestimmte erbliche Stellung festzulegen; die hebräische Aussage אִתּוֹ wird ausdrücklich wiedergegeben.
- source_word: מַה דִּבֶּר
  choice: Was hat … gesprochen?
  rationale: Die Formulierung gibt das Verb דבר direkt wieder und betont die soeben ergangene göttliche Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. Die Wiedergabe „Jahwe“ lässt dies sichtbar und vermeidet die Ersetzung durch den Titel „der HERR“.
- issue: Bezug der männlichen Pronomen
  choice: Die Pronomen bleiben als „er/ihm/sein“ stehen
  alternative: Bileam und Balak zur Verdeutlichung namentlich einsetzen
  rationale: Der hebräische Text verwendet Pronomen, deren Bezug sich aus dem Zusammenhang ergibt. Die Übersetzung wahrt diese Ausdrucksweise, statt die Referenten im Vers selbst interpretierend auszuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Aufmerksamkeitspartikel „siehe“. Die Satzstruktur folgt dem hebräischen Erzählfluss, wird aber durch ein ausdrückliches „waren“ im letzten Satzglied idiomatisch gestaltet.
