  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: de
  text: 'Und er sagte zu Balak: „Stell dich hier neben dein Brandopfer; ich aber werde ihm dort begegnen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „ich werde dort begegnen“. Das Gegenüber wird im Hebräischen in diesem Vers nicht ausdrücklich genannt; aus dem Zusammenhang wird es gewöhnlich als Gott verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: Und er sagte zu Balak
  rationale: Der Wayyiqtol führt in üblicher hebräischer Erzählweise die direkte Rede ein. „Und“ bewahrt den fortlaufenden Erzählfluss.
- source_word: הִתְיַצֵּב
  choice: Stell dich
  rationale: Der Hitpael-Imperativ bezeichnet das Einnehmen beziehungsweise Beibehalten eines Standorts. „Stell dich“ ist im modernen Deutschen natürlich und gibt die Aufforderung knapp wieder.
- source_word: כֹּה
  choice: hier
  rationale: Im Zusammenhang mit der Ortsangabe beim Opfer ist כֹּה deiktisch zu verstehen. „Hier“ bezeichnet den Platz, an dem Balak bleiben soll.
- source_word: עַל עֹלָתֶךָ
  choice: neben dein Brandopfer
  rationale: עַל kann eine Lage bei oder neben etwas bezeichnen. עֹלָה ist das vollständig verbrannte Opfer, daher „Brandopfer“.
- source_word: וְאָנֹכִי
  choice: ich aber
  rationale: Das ausdrücklich gesetzte Pronomen hebt Bileam gegenüber Balak hervor. „Ich aber“ bildet den milden Kontrast idiomatisch ab.
- source_word: אִקָּרֶה
  choice: werde ihm begegnen
  rationale: Die knappe Niphalform von קרה bezeichnet hier im Erzählzusammenhang eine erwartete Begegnung. Das Objekt ist im Hebräischen nicht genannt; das deutsche Pronomen macht die Aussage verständlich, ohne den Gemeinten ausdrücklich als Gott zu benennen.
- source_word: כֹּה
  choice: dort
  rationale: Das zweite כֹּה verweist auf den anderen Ort der erwarteten Begegnung. „Dort“ erhält den räumlichen Gegensatz zu „hier“.
theological_decisions:
- issue: Ungenanntes Gegenüber der erwarteten Begegnung
  choice: Das kontextuell vorausgesetzte persönliche Gegenüber wird mit „ihm“ wiedergegeben, aber nicht ausdrücklich als der HERR bezeichnet.
  alternative: „Ich werde dort einer Begegnung entgegensehen“ oder „ich werde dort begegnen“ ohne genanntes Gegenüber.
  rationale: Im Bileam-Zusammenhang ist eine Begegnung mit Gott zu erwarten, doch dieser Vers nennt das Gegenüber nicht. „Ihm“ ergibt einen natürlichen deutschen Satz und bewahrt durch die Fußnote die sprachliche Offenheit des Hebräischen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Gegensatz zwischen Balaks Standort („hier“) und Bileams erwartetem Begegnungsort („dort“) bleibt erhalten; die echte Unbestimmtheit des hebräischen Verbs wird in einer Fußnote kenntlich gemacht.
