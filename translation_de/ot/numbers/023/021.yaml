base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: de
  text: Er hat kein Unheil in Jakob erblickt und kein Elend in Israel gesehen.[a] Jahwe, sein Gott, ist mit ihm, und der Jubelruf eines Königs erschallt in ihrer Mitte.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat keine Schuld in Jakob erblickt und keine Mühsal (oder: Verkehrtheit) in Israel gesehen.“ Die hebräischen Wörter können moralisch oder im Sinn von Unheil, Leid und Bedrängnis verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „in ihm“; Israel wird in diesem Vers als kollektive Einzelperson bezeichnet.'
    reason: lexical_alternative
  - marker: c
    text: Der „Jubelruf eines Königs“ kann die Huldigung eines Königs in Israels Mitte bezeichnen und möglicherweise auf Jahwes königliche Gegenwart anspielen.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: erblickt
  rationale: Das Verb bezeichnet ein aufmerksames Hinschauen oder Wahrnehmen. „Erblickt“ bewahrt das Bild des Sehens und bildet zugleich einen natürlichen poetischen Parallelismus mit „sieht“.
- source_word: אָוֶן
  choice: Unheil
  rationale: Das Wort kann moralische Schuld, Bosheit, Mühsal oder Unheil bezeichnen. Im Segensspruch passt „Unheil“, ohne die ebenfalls mögliche moralische Lesart auszuschließen; diese wird in der Fußnote genannt.
- source_word: רָאָה
  choice: sieht
  rationale: Eine direkte und idiomatische Wiedergabe des gewöhnlichen Verbs für „sehen“, parallel zu הִבִּיט.
- source_word: עָמָל
  choice: Elend
  rationale: Das Wort umfasst Mühsal, Leid, Bedrückung und Unheil. „Elend“ unterscheidet es im Deutschen von אָוֶן und erhält den parallelen Sinnbereich.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: in Jakob / in Israel
  rationale: Die Präposition wird in beiden parallelen Gliedern örtlich beziehungsweise gemeinschaftsbezogen verstanden. Die Namen bezeichnen das Volk.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו
  choice: sein Gott
  rationale: Das hebräische Suffix ist maskulin Singular und entspricht der kollektiven Personifizierung Jakobs beziehungsweise Israels.
- source_word: עִמּוֹ
  choice: ist mit ihm
  rationale: Der Singular des hebräischen Suffixes wird bewahrt, da Israel als kollektive Einzelperson dargestellt ist.
- source_word: תְרוּעַת מֶלֶךְ
  choice: der Jubelruf eines Königs
  rationale: תְרוּעָה kann Jubel-, Signal-, Kampf- oder Huldigungsruf bedeuten. „Jubelruf“ passt zum königlichen Zusammenhang, während „eines Königs“ die fehlende Bestimmtheit und die mögliche Zuordnung offenhält.
- source_word: בּוֹ
  choice: in ihrer Mitte
  rationale: Wörtlich steht ein maskuliner Singular („in ihm“), der sich auf Israel als Kollektiv bezieht. Im Deutschen gibt „in ihrer Mitte“ den gemeinschaftlichen Sinn natürlich wieder; die Form des Hebräischen wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Bezeichnet der Vers Israels moralische Schuldlosigkeit oder das Ausbleiben von Unheil und Elend?
  choice: Der Haupttext spricht von Unheil und Elend.
  alternative: „Er erblickt keine Schuld in Jakob und sieht keine Mühsal/Verkehrtheit in Israel.“
  rationale: אָוֶן und עָמָל besitzen sowohl leidbezogene als auch teilweise moralische Bedeutungen. Der Segenskontext stützt die Rede vom Ausbleiben des Unheils; die moralische Lesart bleibt jedoch sprachlich möglich und wird deshalb ausdrücklich in der Fußnote bewahrt.
- issue: Ist mit dem König ausdrücklich Jahwe gemeint?
  choice: Die Formulierung „Jubelruf eines Königs“ identifiziert den König nicht ausdrücklich.
  alternative: „Jubelruf für den König“ oder „Jubel über den göttlichen König“
  rationale: Der Zusammenhang mit Jahwes Gegenwart kann auf sein Königtum anspielen, doch der hebräische Wortlaut benennt den König nicht ausdrücklich als Jahwe. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. „Erblickt“ und „sieht“ spiegeln die beiden unterschiedlichen hebräischen Seh-Verben. Die kollektive Personifizierung Israels bleibt bei „sein Gott“ und „mit ihm“ erhalten; beim abschließenden בּוֹ dient „in ihrer Mitte“ der natürlichen Verständlichkeit, begleitet von einer formalen Fußnote.
