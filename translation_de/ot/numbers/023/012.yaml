  text: וַ/יַּ֖עַן וַ/יֹּאמַ֑ר הֲ/לֹ֗א אֵת֩ אֲשֶׁ֨ר יָשִׂ֤ים יְהוָה֙ בְּ/פִ֔/י אֹת֥/וֹ אֶשְׁמֹ֖ר לְ/דַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: de
  text: 'Er antwortete und sagte[a]: »Muss ich nicht sorgfältig darauf achten, das zu sagen, was Jahwe mir in den Mund legt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Muss ich nicht darauf achten, das zu reden, was Jahwe mir in den Mund legt?« Das hebräische Verb kann das sorgfältige Befolgen beim Reden betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: Er antwortete und sagte
  rationale: Die in hebräischen Erzählungen übliche Doppelformel wird in natürlichem, würdigem Deutsch beibehalten.
- source_word: הֲלֹא
  choice: Muss ich nicht
  rationale: Die rhetorische Frage erwartet Zustimmung und drückt im Zusammenhang eine Verpflichtung aus.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: das, was
  rationale: Das wiederaufgenommene Objekt wird im Deutschen natürlich als Relativkonstruktion wiedergegeben.
- source_word: יָשִׂים ... בְּפִי
  choice: mir in den Mund legt
  rationale: Die hebräische Wendung für von Gott eingegebene Worte bleibt als verständliches deutsches Bild erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: sorgfältig darauf achten, ... zu sagen
  rationale: שׁמר mit Infinitiv bezeichnet hier wachsames, genaues Befolgen beim Reden; die Formulierung bewahrt diesen Bedeutungsanteil, ohne mechanischen Zwang zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; »Jahwe« wahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Art der Verpflichtung Bileams
  choice: Muss ich nicht sorgfältig darauf achten, ... zu sagen
  alternative: Muss ich nicht sagen
  rationale: Die Übersetzung verbindet die rhetorisch ausgedrückte Verpflichtung mit dem Aspekt sorgfältiger Befolgung in אֶשְׁמֹר, ohne die Aussage als mechanische Diktierung festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählton. Die hebräische Doppelformel und das Bild »in den Mund legen« bleiben erhalten; die rhetorische Frage klingt natürlich und bewahrt die Spannung zwischen Verpflichtung und sorgfältigem Gehorsam.
