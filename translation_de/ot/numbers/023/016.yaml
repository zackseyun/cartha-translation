source:
  edition: WLC
  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: de
  text: 'Und Jahwe begegnete Bileam[a], legte ihm ein Wort in den Mund und sagte: »Kehre zu Balak zurück, und so sollst du reden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »traf Bileam« oder »kam zu Bileam«.'
    reason: Lexikalische Alternativen für וַיִּקָּר; die genaue Art der Begegnung bleibt im Hebräischen offen.
lexical_decisions:
- source_word: וַיִּקָּר
  choice: begegnete
  rationale: קָרָה bezeichnet hier ein Zusammentreffen bzw. eine Begegnung. „Begegnete“ ist im Deutschen natürlich und wahrt die Offenheit des Ausdrucks, ohne eine Erscheinung ausdrücklich vorauszusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: legte ihm ein Wort in den Mund
  rationale: Die Formulierung bildet das hebräische Bild einer von Gott eingegebenen Rede eng und zugleich idiomatisch ab; der Singular von דָּבָר bleibt erhalten.
- source_word: דָּבָר
  choice: Wort
  rationale: Im Zusammenhang bezeichnet דָּבָר die zu übermittelnde Äußerung oder Botschaft. „Wort“ wahrt den hebräischen Ausdruck und die prophetische Redeformel.
- source_word: שׁוּב
  choice: Kehre ... zurück
  rationale: Der Imperativ fordert Bileam auf, zu Balak zurückzugehen. „Kehre zurück“ entspricht dem gehobenen, aber modernen Erzählton.
- source_word: וְכֹה תְדַבֵּר
  choice: und so sollst du reden
  rationale: כֹה bezeichnet hier die Weise beziehungsweise den Inhalt der folgenden Rede. Die Wiedergabe bleibt nahe am Hebräischen und ist im heutigen Deutsch verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Begegnung zwischen Jahwe und Bileam
  choice: begegnete
  alternative: trat Bileam entgegen / stieß auf Bileam
  rationale: Der hebräische Ausdruck legt eine Begegnung nahe, bestimmt aber deren genaue Art nicht. „Begegnete“ vermeidet eine theologische Festlegung auf eine sichtbare Erscheinung oder ein zufälliges Zusammentreffen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht gehobenem Erzählton. Der Satzbau folgt dem hebräischen Ablauf, ohne im Deutschen schwerfällig zu wirken; die traditionelle Bildsprache „ein Wort in den Mund legen“ bleibt erhalten.
