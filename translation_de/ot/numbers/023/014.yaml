  text: וַ/יִּקָּחֵ֨/הוּ֙ שְׂדֵ֣ה צֹפִ֔ים אֶל רֹ֖אשׁ הַ/פִּסְגָּ֑ה וַ/יִּ֨בֶן֙ שִׁבְעָ֣ה מִזְבְּחֹ֔ת וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: de
  text: Da nahm er ihn mit zum Feld der Späher[a], auf den Gipfel des Pisga. Dort baute er sieben Altäre und brachte auf jedem Altar einen Stier und einen Widder dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Feld Zofim“. Der hebräische Ausdruck kann entweder als beschreibende Bezeichnung („Feld der Späher/Ausguckposten“) oder als Ortsname verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: Da nahm er ihn mit
  rationale: Die Wayyiqtol-Form führt die Erzählung fort. „Da“ gibt die zeitlich-folgernde Verknüpfung im modernen Deutschen natürlich wieder; das Subjekt bleibt wie im Hebräischen aus dem Kontext erschließbar.
- source_word: שְׂדֵה צֹפִים
  choice: zum Feld der Späher
  rationale: Die Konstruktverbindung bezeichnet wörtlich ein Feld von Beobachtern, Spähern oder Ausguckposten. Die Bedeutungsübersetzung bleibt verständlich; da zugleich ein Ortsname möglich ist, wird diese Alternative in einer Fußnote bewahrt.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: auf den Gipfel des Pisga
  rationale: רֹאשׁ bezeichnet in geografischem Zusammenhang den Gipfel beziehungsweise höchsten Punkt. פִּסְגָּה wird hier als der Ortsname Pisga verstanden.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: Dort baute er sieben Altäre
  rationale: Die Wendung wird direkt wiedergegeben. „Dort“ stellt im Deutschen einen flüssigen Bezug zum zuvor genannten Ort her.
- source_word: וַיַּעַל
  choice: brachte … dar
  rationale: עלה bezeichnet im Opferkontext das Darbringen eines Opfers. „Darbringen“ ist im Deutschen idiomatisch und bewahrt den kultischen Sinn.
- source_word: פָּר וָאַיִל
  choice: einen Stier und einen Widder
  rationale: Die beiden singularischen Tierbezeichnungen werden mit den natürlichen deutschen unbestimmten Artikeln wiedergegeben.
- source_word: בַּמִּזְבֵּחַ
  choice: auf jedem Altar
  rationale: Obwohl der hebräische Ausdruck formal im Singular steht, ist nach den sieben Altären und entsprechend dem wiederholten Ritual im Kontext ein distributiver Sinn gemeint.
