base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: de
  text: 'Dann trug er seinen Spruch[a] vor und sagte:


    »Aus Aram hat mich Balak hergeführt,


    der König von Moab, aus den Bergen des Ostens[b]:


    ›Komm, verfluche Jakob für mich!


    Und komm, verwünsche Israel!‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Orakelspruch“. Wörtlich steht hier die hebräische Wendung „er erhob seinen Maschal“, die einen feierlichen poetischen Ausspruch einleitet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus den östlichen Bergen“. Der hebräische Ausdruck kann eine östlich gelegene Bergregion bezeichnen; die genaue geografische Zuordnung bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Dann trug er seinen Spruch vor
  rationale: Die hebräische Wendung leitet einen feierlichen poetischen Ausspruch ein. „Spruch“ ist im Deutschen natürlich und umfasst hier mehr als ein Sprichwort, ohne die prophetische Funktion durch „Orakel“ stärker festzulegen, als der Ausdruck selbst es tut.
- source_word: מִן אֲרָם
  choice: Aus Aram
  rationale: Aram bleibt als historischer Ortsname erhalten; die Präposition bezeichnet den Ausgangsort.
- source_word: יַנְחֵנִי
  choice: hat ... mich hergeführt
  rationale: Der Hifil von נחה bedeutet führen oder geleiten. „Hergeführt“ bewahrt die gerichtete Bewegung aus Balaams Perspektive und klingt in diesem poetischen Zusammenhang natürlich.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: aus den Bergen des Ostens
  rationale: קֶדֶם ist hier im geografischen Sinn „Osten“ zu verstehen, parallel zu Aram als Herkunftsregion. Die Formulierung bewahrt die hebräische Bildgestalt.
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ fungiert als auffordernder Ruf und wird im Deutschen idiomatisch mit „Komm“ wiedergegeben.
- source_word: אָרָה
  choice: verfluche
  rationale: Das Verb bezeichnet eindeutig das Aussprechen eines Fluches; „verfluchen“ ist präzise und allgemein verständlich.
- source_word: לִּי
  choice: mir
  rationale: Der Dativ bezeichnet Balak als Nutznießer beziehungsweise Auftraggeber der verlangten Handlung. Das deutsche „mir“ bildet dies knapp und direkt ab.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Personen- und Volksname wird in seiner etablierten deutschen Form beibehalten.
- source_word: זֹעֲמָה
  choice: verwünsche
  rationale: Das zweite Verb unterscheidet sich von אָרָה. „Verwünschen“ wahrt diese lexikalische Unterscheidung und vermittelt die feindselige, fluchartige Äußerung in verständlichem Deutsch.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Personen- und Volksname wird in seiner etablierten deutschen Form beibehalten.
theological_decisions:
- issue: Verhältnis von Jakob und Israel in Balaks zitierter Aufforderung
  choice: Beide Namen werden als parallele Bezeichnungen für das Bundesvolk gesondert wiedergegeben.
  alternative: Beide Namen durch eine einzige Kollektivbezeichnung wie „die Israeliten“ ersetzen.
  rationale: Der hebräische Text setzt „Jakob“ und „Israel“ bewusst in poetischen Parallelismus. Diese literarische und bundestheologische Resonanz bleibt erhalten, ohne sie durch eine zusätzliche Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. „Spruch“ ist bewusst breit gewählt; „verfluchen“ und „verwünschen“ erhalten die Unterscheidung der beiden hebräischen Verben. Die direkte Rede innerhalb von Balaams Spruch wird mit einfachen Anführungszeichen kenntlich gemacht.
