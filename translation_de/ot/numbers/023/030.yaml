  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר אָמַ֣ר בִּלְעָ֑ם וַ/יַּ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: de
  text: Da tat Balak, was Bileam gesagt hatte, und opferte einen Stier und einen Widder auf dem Altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עשה steht hier idiomatisch mit כַּאֲשֶׁר und bezeichnet die Ausführung der zuvor gegebenen Anweisung; „tat“ ist im Deutschen natürlich und präzise.
- source_word: כַּאֲשֶׁר
  choice: was
  rationale: In der deutschen Verbindung „tat, was … gesagt hatte“ gibt das Relativpronomen die Übereinstimmung mit Bileams Anweisung idiomatisch wieder.
- source_word: אָמַר
  choice: gesagt hatte
  rationale: Das Plusquamperfekt macht natürlich deutlich, dass Bileams Anweisung Balaks Handlung vorausging, ohne den Sinn des hebräischen Textes zu verändern.
- source_word: וַיַּעַל
  choice: opferte
  rationale: עלה bezeichnet im Opferkontext das Darbringen auf dem Altar. „Opferte“ ist im modernen Deutschen klar; ein zusätzliches „hinauf“ wäre unnatürlich.
- source_word: פָּר
  choice: einen Stier
  rationale: „Stier“ ist die klare, moderne Bezeichnung für das männliche Rind als Opfertier.
- source_word: אַיִל
  choice: einen Widder
  rationale: „Widder“ ist die übliche und genaue deutsche Wiedergabe des männlichen Schafes.
- source_word: בַּמִּזְבֵּחַ
  choice: auf dem Altar
  rationale: Die Präposition ב bezeichnet hier im Opferkontext den Ort des Darbringens; „auf dem Altar“ ist die natürliche deutsche Formulierung.
- source_word: וַ
  choice: Da
  rationale: Das einleitende Waw führt die Erzählung fort und markiert hier zugleich die Umsetzung der vorausgehenden Anweisung. „Da“ gibt diesen Zusammenhang in natürlichem Erzählstil wieder.
