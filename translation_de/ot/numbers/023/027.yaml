  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: de
  text: 'Da sagte Balak zu Bileam: „Komm doch, ich will dich an einen anderen Ort bringen. Vielleicht wird es in Gottes Augen recht sein[a], und verfluche ihn mir von dort aus.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vielleicht gefällt es Gott.“ Die hebräische Wendung bedeutet wörtlich, dass etwas in jemandes Augen recht ist, und kann auch ausdrücken, dass es ihm gefällt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: Komm doch
  rationale: Der Imperativ von הלך dient hier als Aufforderung; נָא mildert sie ab. „Komm doch“ klingt im Deutschen natürlich und gibt die bittende Nuance wieder.
- source_word: אֶקָּחֲךָ
  choice: ich will dich … bringen
  rationale: Das Imperfekt hat im Zusammenhang einen voluntativen Sinn. „Ich will dich … bringen“ gibt Balaks angebotene Handlung idiomatisch wieder.
- source_word: מָקוֹם אַחֵר
  choice: einen anderen Ort
  rationale: Direkte und natürliche Wiedergabe des Ortswechsels.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Bewahrt Balaks unsichere Hoffnung, ohne Gewissheit auszudrücken.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: es ist in den Augen Gottes recht
  rationale: Bewahrt das hebräische Bild und die mögliche Bedeutungsbreite zwischen „recht sein“ und „gefallen“. Das unpersönliche „es“ entspricht dem fehlenden ausdrücklichen Subjekt.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang ist der Gott gemeint, den Bileam befragt; „Gott“ ist im Deutschen die natürliche Wiedergabe.
- source_word: וְקַבֹּתוֹ לִי
  choice: und du verfluchst ihn mir
  rationale: Gibt Balaks beabsichtigte Folge beziehungsweise erneute Aufforderung wieder, ohne das Verhältnis der mit וְ angeschlossenen Aussage unnötig eng festzulegen. Das maskuline Singularpronomen bewahrt die kollektive Bezugnahme auf Israel.
- source_word: מִשָּׁם
  choice: von dort aus
  rationale: Bewahrt den räumlichen Ausgangspunkt des Fluchs und den Bezug auf den neuen Standort.
theological_decisions:
- issue: Bezug von הָאֱלֹהִים in Balaks Rede
  choice: Gott
  alternative: der Gott / ein Gott
  rationale: Der unmittelbare Zusammenhang verweist auf den Gott, der Bileams Worte bestimmt. Die Wiedergabe „Gott“ benennt diesen Erzählreferenten, ohne Balak eine weitergehende theologische Einsicht zuzuschreiben.
- issue: Verhältnis zwischen Gottes Zustimmung und dem Fluch
  choice: 'Nebenordnung: „und du verfluchst ihn mir“'
  alternative: 'Zwecksatz oder Inhaltssatz: „damit/dass du ihn … verfluchst“'
  rationale: Das hebräische וְ lässt das genaue logische Verhältnis offen. Die Nebenordnung bewahrt diese Spannung besser als eine eindeutige Festlegung auf Zweck, Folge oder Inhalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Komm doch“ vermittelt die höflich-bittende Aufforderung; die Augen-Wendung bleibt im Haupttext erhalten. Die Satzverbindung wird bewusst nicht zu einem eindeutigen Zweck- oder Inhaltssatz umgeformt.
