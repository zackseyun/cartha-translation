  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: de
  text: 'Da sagte Balak zu Bileam: „Was hast du mir angetan? Ich habe dich holen lassen, um meine Feinde zu verfluchen, und nun hast du sie sogar gesegnet!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und siehe, du hast sie nachdrücklich gesegnet“; im Hebräischen wird die Verbform durch einen Infinitiv derselben Wurzel verstärkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: מֶה עָשִׂיתָ לִי
  choice: Was hast du mir angetan?
  rationale: „Antun“ bringt die nachteilige Betroffenheit Balaks idiomatisch zum Ausdruck, die im hebräischen לִי in diesem vorwurfsvollen Kontext mitschwingt.
- source_word: לָקֹב
  choice: zu verfluchen
  rationale: קבב bezeichnet hier das Aussprechen eines Fluches; „verfluchen“ ist die klare und kontextgerechte Wiedergabe.
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: Direkte und natürliche Wiedergabe des Substantivs im Possessivplural.
- source_word: לְקַחְתִּיךָ
  choice: ich habe dich holen lassen
  rationale: לקח bedeutet grundsätzlich „nehmen/holen“. Im Kontext hatte Balak Bileam durch Boten kommen lassen; „holen lassen“ ist im Deutschen natürlicher als „dich genommen“ und legt anders als „angeheuert“ kein bestimmtes Vertragsverhältnis fest.
- source_word: וְהִנֵּה
  choice: und nun
  rationale: Die Wendung markiert Balaks überraschten, vorwurfsvollen Hinweis auf das eingetretene Ergebnis. „Und nun“ bewahrt diese deiktische und kontrastierende Funktion in modernem Deutsch.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: hast du sie sogar gesegnet
  rationale: Die Verbindung aus finitem Verb und Infinitivus absolutus verstärkt die Aussage. „Sogar“ vermittelt den Nachdruck und den Gegensatz zum beabsichtigten Fluch knapp und idiomatisch; „sie“ ergänzt das im Hebräischen unausgesprochene, aus „meine Feinde“ erschließbare Objekt.
