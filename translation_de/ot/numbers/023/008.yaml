base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: de
  text: Wie könnte ich verfluchen, wen Gott nicht verflucht hat? Und wie könnte ich verwünschen, wen Jahwe nicht verwünscht hat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie könnte ich einem zürnen, dem Jahwe nicht zürnt?“ Das hebräische Verb kann sowohl den Zorn als auch dessen Ausdruck in einer feindseligen Verurteilung oder Verwünschung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Wie könnte
  rationale: In der rhetorischen Frage drückt מָה hier Unmöglichkeit aus. „Wie könnte“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: אֶקֹּב / קַבֹּה
  choice: verfluchen / verflucht hat
  rationale: Die Wiedergabe mit demselben deutschen Verbstamm bewahrt die lexikalische Entsprechung und den poetischen Parallelismus.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier Gott; die Übersetzung als gebräuchlicher Gottestitel ist im Deutschen klar und angemessen.
- source_word: וּמָה
  choice: Und wie könnte
  rationale: Die Formulierung führt die parallele rhetorische Frage fort und bringt die Unmöglichkeit zum Ausdruck.
- source_word: אֶזְעֹם / זָעַם
  choice: verwünschen / verwünscht hat
  rationale: זעם kann zornige Missbilligung oder deren sprachlichen Ausdruck bezeichnen. „Verwünschen“ erhält hier den feindseligen Sprechakt und unterscheidet das Verb zugleich von „verfluchen“; die Ambiguität wird in der Fußnote kenntlich gemacht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und vom Titel אֵל („Gott“) unterschieden.
theological_decisions:
- issue: Unterscheidung der Gottesbezeichnungen אֵל und יְהוָה im poetischen Parallelismus
  choice: אֵל als „Gott“ und יְהוָה als „Jahwe“
  alternative: Beide Bezeichnungen mit „Gott“ wiedergeben oder יְהוָה durch „der HERR“ ersetzen
  rationale: Die unterschiedliche Wortwahl des hebräischen Textes bleibt sichtbar, ohne den Eigennamen durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von זעם
  choice: Im Haupttext als „verwünschen“ wiedergeben und die Bedeutung „zürnen“ in einer Fußnote nennen
  alternative: „Wie könnte ich einem zürnen, dem Jahwe nicht zürnt?“
  rationale: Der Kontext betrifft Bileams beabsichtigte feindselige Rede; zugleich kann זעם stärker den Zorn selbst bezeichnen. Die Fußnote bewahrt diese echte lexikalische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die beiden verschiedenen hebräischen Verben werden soweit möglich bewahrt; die zweite Verbgruppe bleibt durch eine Fußnote bewusst mehrdeutig.
