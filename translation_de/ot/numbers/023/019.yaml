source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: de
  text: Gott ist kein Mensch, der lügt, kein Menschenkind[a], das seine Meinung ändert.[b] Hat er etwas gesagt und wird es nicht tun? Hat er etwas gesprochen und wird es nicht in Erfüllung gehen lassen?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sohn eines Menschen“ beziehungsweise „Menschensohn“. Gemeint ist hier schlicht ein Mensch, nicht ein messianischer Titel.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „der es sich anders überlegt“ oder „nachgibt“. Das hebräische Verb kann ein Bereuen, Nachgeben oder Ändern der Absicht bezeichnen; hier geht es um Gottes Verlässlichkeit, nicht um moralische Reue.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „es zum Stehen bringen“; das heißt: es bestätigen, erfüllen oder verwirklichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier Israels Gott. „Gott“ ist im Deutschen die natürliche Wiedergabe und wahrt den Gegensatz zum Menschen.
- source_word: אִישׁ
  choice: Mensch
  rationale: Im Deutschen gibt „Mensch“ den Gegensatz zwischen Gott und dem fehlbaren Menschen natürlicher und umfassender wieder als „Mann“.
- source_word: וִיכַזֵּב
  choice: der lügen könnte
  rationale: כזב bedeutet hier „lügen“ beziehungsweise sich als unwahr erweisen. Die modale Formulierung beschreibt, was Gottes Wesen widerspricht.
- source_word: בֶן אָדָם
  choice: Menschenkind
  rationale: Die poetische Bezeichnung meint einen menschlichen Nachkommen und damit einen Menschen. „Menschenkind“ bewahrt die Bildstruktur besser als die im Deutschen christologisch leicht missverständliche Form „Menschensohn“.
- source_word: וְיִתְנֶחָם
  choice: das seinen Entschluss ändern müsste
  rationale: נחם im Hitpael bezeichnet hier ein Bereuen, Umlenken oder Ändern der Absicht. Die Formulierung vermeidet den irreführenden Eindruck moralischer Reue und lässt die Aussage auf Gottes Verlässlichkeit bezogen.
- source_word: הַהוּא אָמַר
  choice: Sollte er etwas sagen
  rationale: Die hebräische Aussage wird durch den parallelen Folgesatz zur rhetorischen Frage. „Sollte er …?“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: יַעֲשֶׂה
  choice: es nicht tun
  rationale: עשה bedeutet allgemein „tun, ausführen“. Das Pronomen nimmt den Inhalt des Gesagten auf.
- source_word: וְדִבֶּר
  choice: Sollte er etwas aussprechen
  rationale: דבר bezeichnet hier das geäußerte Wort beziehungsweise die Zusage und bildet die Parallele zu „sagen“.
- source_word: יְקִימֶנָּה
  choice: es nicht wahr machen
  rationale: Das Hifil von קום bedeutet wörtlich „zum Stehen bringen“ und im Kontext ein Wort bestätigen, erfüllen oder verwirklichen. „Wahr machen“ ist idiomatisch und bewahrt den Gedanken, dass Gottes Wort Bestand erhält.
theological_decisions:
- issue: Aussage über Gottes Sinnesänderung in וְיִתְנֶחָם
  choice: seinen Entschluss ändern müsste
  alternative: es sich anders überlegen / nachgeben / bereuen
  rationale: Der Vers betont Gottes Verlässlichkeit im Gegensatz zu menschlicher Unbeständigkeit. Die Übersetzung vermeidet sowohl moralische Reue als auch eine über den Text hinausgehende philosophische Festlegung und bewahrt so die biblische Spannung.
- issue: Bedeutung von בֶן אָדָם
  choice: gewöhnliche poetische Bezeichnung für einen Menschen
  alternative: Menschensohn als messianischer Titel
  rationale: In diesem Kontext steht die Wendung parallel zu אִישׁ und bezeichnet einen Menschen, nicht einen messianischen Titel.
- issue: Wiedergabe von יְקִימֶנָּה
  choice: sein ausgesprochenes Wort wahr machen
  alternative: es aufrichten / bestätigen / erfüllen
  rationale: Die Formulierung beschreibt die zuverlässige Verwirklichung des göttlichen Wortes, ohne eine engere Kategorie wie ausschließlich Verheißung oder Prophetie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. Die beiden Schlusszeilen sind als rhetorische Fragen gestaltet. „Menschenkind“ verhindert eine unbeabsichtigte Titellesung, während die Fußnote die wörtliche Form offenlegt. Die modalen Wendungen „könnte“ und „müsste“ drücken die hebräischen Folgeformen nach den verneinten Nominalsätzen idiomatisch aus.
