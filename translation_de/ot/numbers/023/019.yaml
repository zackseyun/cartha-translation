  terminology: „Gott“, „Mensch“ und „Menschenkind“ erhalten den Gegensatz und die poetische Steigerung. Die bisherige Fußnote zu Menschenkind sollte nicht „Sohn Adams“ als primäre wörtliche Erklärung nennen, da בן־אדם hier die gewöhnliche idiomatische Bedeutung „Sohn eines Menschen / Mensch“ hat und nicht notwendig den Eigennamen Adam meint. „In Erfüllung gehen lassen“ gibt יְקִימֶנָּה im Kontext treffend wieder.
