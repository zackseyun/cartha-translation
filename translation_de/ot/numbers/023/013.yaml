  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: de
  text: 'Da sagte Balak zu ihm: »Komm doch mit mir an einen anderen Ort, von wo aus du es sehen kannst. Du wirst nur seinen Rand[a] sehen, aber nicht das Ganze; und verfluche es für mich von dort aus!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen äußersten Teil«. Gemeint ist, dass nur ein Teil Israels zu sehen sein wird.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen beziehen sich die Pronomen in der Einzahl auf Israel als ein einziges Volk; sinngemäß könnte man auch mit Pluralformen übersetzen.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: Komm doch mit mir
  rationale: Der Imperativ von הלך bezeichnet hier die gemeinsame Ortsveränderung; im Deutschen ist bei einer Einladung zum Mitgehen »komm mit mir« natürlich. נָא wird durch das höflich-abmildernde »doch« wiedergegeben.
- source_word: מָקוֹם אַחֵר
  choice: einen anderen Ort
  rationale: Konkrete und natürliche Wiedergabe des neuen Standorts, zu dem Balak Bileam führen will.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: von wo aus du es sehen kannst
  rationale: Die Formulierung gibt den neuen Aussichtspunkt und die auf Israel bezogene singularische Objektform wieder. »kannst« bezeichnet die dort bestehende Sichtmöglichkeit.
- source_word: אֶפֶס קָצֵהוּ
  choice: nur seinen Rand
  rationale: אֶפֶס wirkt einschränkend; קָצֶה bezeichnet Rand, Ende oder äußersten Teil. »Rand« bewahrt das räumliche Bild und bleibt im Deutschen verständlich.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: aber nicht das Ganze
  rationale: Das adversative »aber« macht den Gegensatz zwischen dem sichtbaren Rand und der nicht sichtbaren Gesamtheit deutlich, ohne den Sinn zu erweitern.
- source_word: וְקָבְנוֹ לִי
  choice: und verfluche es für mich
  rationale: קבב bezeichnet im Bileambericht das Verfluchen. »für mich« gibt den Benefaktiv לִי in natürlichem Deutsch wieder.
- source_word: מִשָּׁם
  choice: von dort aus
  rationale: Die Ortsangabe wird ausdrücklich bewahrt, weil Balaks Plan vom veränderten Aussichtspunkt abhängt.
theological_decisions:
- issue: Singularische Pronomen mit Israel als kollektivem Bezugswort
  choice: Wiedergabe mit »es«, »seinen« und »das Ganze«
  alternative: Wiedergabe im Plural mit »sie«, »ihren Rand« und »sie nicht alle«
  rationale: Der hebräische Text betrachtet Israel durchgehend als eine kollektive Einheit und verwendet singularische Suffixe. Das deutsche Neutrum passt zu dem mitgedachten »Volk Israel« und bewahrt die Einheit des Bezugs, ohne ein männliches Einzelwesen nahezulegen.
- issue: Reichweite von קָצֵהוּ
  choice: seinen Rand
  alternative: seinen äußersten Teil / einen Teil davon
  rationale: Die konkrete räumliche Metapher bleibt im Haupttext erhalten. Die Fußnote nennt die mögliche Bedeutung »äußerster Teil« und erklärt, dass nur ein Teil Israels sichtbar sein soll.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Komm doch« gibt die höfliche Bitte idiomatisch wieder; räumliche Wiederholungen und das Bild vom Rand bleiben erhalten.
