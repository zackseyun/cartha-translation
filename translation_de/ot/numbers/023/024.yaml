  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: de
  text: Sieh, ein Volk steht auf wie eine Löwin[a] und richtet sich auf wie ein Löwe. Es wird sich nicht niederlegen, bis es Beute gefressen und das Blut Erschlagener getrunken hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie ein Löwe«. Das hebräische Wort לָבִיא kann allgemein einen Löwen bezeichnen; »Löwin« erhält hier die mögliche Unterscheidung vom folgenden Wort אֲרִי (»Löwe«).'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sieh
  rationale: Die hinweisende Interjektion leitet eine nachdrückliche Beobachtung ein. »Sieh« bewahrt ihre unmittelbare Kraft in natürlichem, würdigem Deutsch.
- source_word: עָם
  choice: ein Volk
  rationale: Bezeichnet hier Israel als Gemeinschaft; »Volk« entspricht dem kollektiven Sinn und passt zum poetischen Orakelspruch.
- source_word: כְּלָבִיא
  choice: wie eine Löwin
  rationale: לָבִיא kann allgemein einen Löwen, im poetischen Sprachgebrauch aber auch eine Löwin bezeichnen. »Löwin« erhält die mögliche lexikalische Unterscheidung zum folgenden אֲרִי, ohne die andere Deutung zu verschweigen.
- source_word: יָקוּם
  choice: steht auf
  rationale: Das Qal-Imperfekt von קום schildert im Bild des Raubtiers das Aufstehen beziehungsweise Sich-Erheben. Das Präsens macht die poetische Schau im Deutschen lebendig.
- source_word: וְכַאֲרִי
  choice: wie ein Löwe
  rationale: אֲרִי ist eine geläufige Bezeichnung für den Löwen. Die Wiedergabe vermeidet unbelegte Zusätze zu Größe oder Alter.
- source_word: יִתְנַשָּׂא
  choice: richtet sich auf
  rationale: Die Hitpael-Form von נשׂא bezeichnet hier ein Sich-Erheben. »Richtet sich auf« bleibt konkret und passt zur Haltung des Löwen im Bild.
- source_word: לֹא יִשְׁכַּב
  choice: Es wird sich nicht niederlegen
  rationale: Das Imperfekt lässt sich im prophetisch-poetischen Zusammenhang zukunftsbezogen verstehen. »Sich niederlegen« bewahrt das konkrete Tierbild.
- source_word: עַד יֹאכַל טֶרֶף
  choice: bis es Beute gefressen hat
  rationale: אכל bedeutet grundlegend »essen/fressen«, טֶרֶף bezeichnet Beute. »Fressen« ist beim Löwen natürlich und verstärkt das Verb nicht unnötig zu »verschlingen«.
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: und das Blut Erschlagener getrunken hat
  rationale: חֲלָלִים bezeichnet in diesem gewaltsamen beziehungsweise militärischen Zusammenhang Erschlagene. Die drastische Bildsprache des Hebräischen bleibt ungemildert erhalten.
theological_decisions:
- issue: Gewaltbild im Orakelspruch Bileams
  choice: Das Bild von Beute und vom Trinken des Blutes Erschlagener wird als drastische Darstellung unwiderstehlicher militärischer Stärke beibehalten.
  alternative: Die Bildsprache zu einer allgemeinen Aussage über Sieg oder Stärke abschwächen.
  rationale: Der hebräische Text verwendet bewusst eine schroffe Raubtiermetaphorik. Eine Abschwächung würde die Aussage und ihre Spannung glätten; zugleich wird keine wörtliche Aufforderung zum Bluttrinken in den Text hineingelesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetischer Würde. Das Präsens im ersten Satz vergegenwärtigt die prophetische Schau; der anschließende Zukunftsausdruck gibt die noch nicht abgeschlossene Handlung wieder. Die drastische Bildsprache und die mögliche Mehrdeutigkeit von לָבִיא bleiben erhalten.
