  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: de
  text: 'Da kehrte er zu ihm zurück, und siehe: Er stand bei seinem Brandopfer, zusammen mit allen Fürsten Moabs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: Dann kehrte er zu ihm zurück
  rationale: Gibt die Erzählfolge und die pronominale Unbestimmtheit des Hebräischen direkt wieder; aus dem Zusammenhang sind Bileam und Balak erkennbar, ohne dass ihre Namen in den Vers eingefügt werden.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt das hebräische Aufmerksamkeitssignal in einer würdigen, bibelsprachlich vertrauten Form.
- source_word: נִצָּב עַל עֹלָתוֹ
  choice: er stand bei seinem Brandopfer
  rationale: נִצָּב bezeichnet ein festes Stehen; עַל kann hier räumlich als „bei“ verstanden werden. „Brandopfer“ ist die etablierte und sachlich genaue Wiedergabe von עֹלָה.
- source_word: שָׂרֵי מוֹאָב
  choice: Fürsten Moabs
  rationale: שָׂרִים bezeichnet hochrangige Amtsträger oder Würdenträger; „Fürsten“ ist im Kontext knapp und traditionsgemäß.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Ton. Die pronomenreiche Struktur und das Aufmerksamkeitssignal des Ausgangstextes bleiben erhalten; der Gedankenstrich der englischen Konsultationsfassung wird nicht benötigt, da die hebräische Koordination im Deutschen natürlich mit Komma fortgeführt werden kann.
