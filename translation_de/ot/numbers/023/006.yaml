  source_fidelity: Die Personenbezüge, die Erzählfolge und die räumliche Aussage von וְהִנֵּה נִצָּב עַל עֹלָתוֹ sind zutreffend wiedergegeben. „bei seinem Brandopfer“ ist für עַל in diesem Kontext eine vertretbare, nicht überinterpretierende räumliche Wiedergabe und entspricht dem englischen „beside“.
  naturalness: Die Wiederholung „er stand …, er und alle Fürsten Moabs“ ist im modernen Deutsch syntaktisch schwerfällig und lässt die koordinierte Stellung aller Anwesenden weniger klar hervortreten. Eine Konstruktion mit „zusammen mit“ macht die im Hebräischen mitgemeinte gemeinsame Stellung natürlich deutlich.
  terminology: „Brandopfer“ gibt עֹלָה sachgerecht wieder; „Fürsten Moabs“ ist für שָׂרֵי מוֹאָב angemessen und im Register des Textes natürlich. „Siehe“ bewahrt das Aufmerksamkeitssignal וְהִנֵּה.
