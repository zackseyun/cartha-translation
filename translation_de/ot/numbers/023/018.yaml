  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר ק֤וּם בָּלָק֙ וּֽ/שֲׁמָ֔ע הַאֲזִ֥ינָ/ה עָדַ֖/י בְּנ֥/וֹ צִפֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: de
  text: 'Da trug er seinen Spruch[a] vor und sagte: »Steh auf, Balak, und höre! Hör mir zu, Sohn Zippors!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Rede«, »seinen Orakelspruch« oder »sein Sprichwort«. Das hebräische Wort מָשָׁל kann einen sprichwortartigen Ausspruch oder eine feierliche poetische Rede bezeichnen; hier leitet es Bileams gehobenen Ausspruch ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Da trug er seinen Spruch vor
  rationale: Die Verbindung von נשׂא mit מָשָׁל leitet idiomatisch einen feierlichen poetischen Ausspruch ein. »Trug ... vor« ist im Deutschen natürlich und bewahrt den formellen Charakter.
- source_word: מְשָׁלוֹ
  choice: seinen Spruch
  rationale: מָשָׁל kann einen Spruch, ein Sprichwort oder eine gehobene poetische Rede bezeichnen. Im Zusammenhang der Bileamreden passt »Spruch«, ohne den Ausdruck ausdrücklich als göttlichen »Orakelspruch« festzulegen.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Natürliche deutsche Wiedergabe der narrativen Redeeinleitung.
- source_word: קוּם
  choice: Steh auf
  rationale: Der Imperativ fordert Balak zum Aufstehen beziehungsweise Sich-Erheben auf. »Steh auf« ist modern, würdig und unmittelbarer als das gehobenere »Erhebe dich«.
- source_word: וּשֲׁמָע
  choice: und höre
  rationale: »Höre« bewahrt im Zusammenspiel mit הַאֲזִינָה die rhetorische Parallelität zweier Aufforderungen zum Hören.
- source_word: הַאֲזִינָה עָדַי
  choice: Horch auf mich
  rationale: Das Hiphil von אזן bezeichnet aufmerksames Hinhören. »Horch auf mich« gibt die Verstärkung gegenüber »höre« knapp und idiomatisch wieder.
- source_word: בְּנוֹ צִפֹּר
  choice: Sohn Zippors
  rationale: Die patronymische Anrede wird in natürlicher deutscher Genitivform bewahrt und trägt zum feierlichen Ton bei.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetisch-feierlichem Ton. Die beiden Hörimperative werden unterschieden, um den hebräischen Parallelismus und seine Steigerung zu erhalten.
