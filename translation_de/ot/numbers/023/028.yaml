  text: וַ/יִּקַּ֥ח בָּלָ֖ק אֶת בִּלְעָ֑ם רֹ֣אשׁ הַ/פְּע֔וֹר הַ/נִּשְׁקָ֖ף עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: de
  text: Dann nahm Balak Bileam mit auf den Gipfel des Peor, der die Ödnis[a] überblickt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der den Jeschimon überblickt“. Das Hebräische kann entweder eine öde Wüstenlandschaft bezeichnen oder als Ortsname verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm ... mit
  rationale: Das Waw-Konsekutiv führt die Erzählung fort. Im Deutschen gibt „Dann“ die zeitliche Abfolge natürlich wieder; „nahm ... mit“ entspricht in diesem Bewegungskontext idiomatisch dem Sinn von לקח.
- source_word: בָּלָק
  choice: Balak
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֶת בִּלְעָם
  choice: Bileam
  rationale: Die direkte Objektmarkierung אֶת bleibt unübersetzt; der Personenname folgt der etablierten deutschen Form.
- source_word: רֹאשׁ
  choice: Gipfel
  rationale: In topografischem Zusammenhang bezeichnet רֹאשׁ die Spitze beziehungsweise höchste Stelle einer Erhebung. „Gipfel“ ist hier natürlich und präzise.
- source_word: הַפְּעוֹר
  choice: des Peor
  rationale: Peor wird als Orts- beziehungsweise Bergname wiedergegeben; der hebräische Artikel wird nicht gesondert abgebildet. Der Genitiv ist im Deutschen nach „Gipfel“ idiomatisch.
- source_word: הַנִּשְׁקָף
  choice: der ... hinwegblickt
  rationale: Das Nifal-Partizip von שׁקף beschreibt eine Höhe, die über ein Gebiet hinausschaut beziehungsweise es überragt. Die Formulierung bewahrt das geografische Bild.
- source_word: עַל־פְּנֵי
  choice: über ... hinweg
  rationale: Die hebräische Wendung bedeutet wörtlich „über/auf dem Angesicht von“. Im Deutschen vermittelt „über ... hinweg“ die räumliche Perspektive natürlich, ohne ein unidiomatisches Bild zu erzwingen.
- source_word: הַיְשִׁימֹן
  choice: die Ödnis
  rationale: יְשִׁימֹן kann eine öde, wüstenartige Landschaft bezeichnen, möglicherweise aber auch als Ortsname „Jeschimon“ verstanden werden. „Ödnis“ gibt im Haupttext die lexikalische Bedeutung knapp wieder; die Namensdeutung steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdevolle Erzählsprache. Die topografische Bildhaftigkeit des Hebräischen bleibt erhalten; die mögliche Deutung von הַיְשִׁימֹן als Landschaftsbezeichnung oder Eigenname wird nicht stillschweigend aufgelöst.
