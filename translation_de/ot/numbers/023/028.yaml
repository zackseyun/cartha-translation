  naturalness: „Dann nahm Balak Bileam mit auf den Gipfel des Peor“ ist natürliches modernes Deutsch. „Der die Ödnis überblickt“ ist idiomatischer und topografisch präziser als „der über die Ödnis hinwegblickt“.
  terminology: Die etablierten deutschen Namensformen Balak und Bileam sind angemessen. „Ödnis“ gibt יְשִׁימֹן gut wieder; die Fußnote wahrt sachgerecht die mögliche Auffassung als Ortsname „Jeschimon“.
