base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: de
  text: 'Da sagte Bileam zu Balak: „Baue mir hier sieben Altäre und stelle mir hier sieben Stiere und sieben Widder bereit.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: אֶל בָּלָק
  choice: zu Balak
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Balak“ ist die idiomatische deutsche Wiedergabe.
- source_word: בְּנֵה לִי בָזֶה
  choice: Baue mir hier
  rationale: Der Imperativ von בנה wird direkt mit „baue“ wiedergegeben; לִי bezeichnet den Begünstigten, und בָזֶה verweist auf den gegenwärtigen Ort.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: sieben Altäre
  rationale: Die Zahlenangabe und das Substantiv werden unmittelbar und präzise wiedergegeben.
- source_word: וְהָכֵן לִי בָזֶה
  choice: und stelle mir hier … bereit
  rationale: Das Hifil von כון bedeutet hier, etwas für den vorgesehenen Gebrauch bereitzumachen. Die Wiederholung von „mir hier“ bewahrt die Struktur und Ortsbetonung des Hebräischen.
- source_word: שִׁבְעָה פָרִים
  choice: sieben Stiere
  rationale: פַּר bezeichnet im Opferkontext einen männlichen Vertreter des Rindes; „Stiere“ ist präzise, ohne ein im Text nicht ausdrücklich genanntes Alter hinzuzufügen.
- source_word: וְשִׁבְעָה אֵילִים
  choice: und sieben Widder
  rationale: אֵילִים bezeichnet männliche Schafe und wird im Opferkontext sachgerecht mit „Widder“ übersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Ortsangabe בָזֶה wird jeweils mit „hier“ wiedergegeben, sodass die hebräische Wiederholung ohne unnötige Schwerfälligkeit erhalten bleibt.
