  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: de
  text: Denn vom Gipfel der Felsen sehe ich es, und von den Hügeln aus erblicke ich es. Siehe, ein Volk, das für sich allein wohnt und sich nicht zu den Nationen zählt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und nicht zu den Nationen gerechnet wird«. Das hebräische Verb kann sowohl passiv als auch reflexiv bzw. medial verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Erklärung innerhalb von Bileams Spruch ein und bewahrt die verbindende, begründende Funktion, ohne sie zu überspezifizieren.
- source_word: מֵרֹאשׁ צֻרִים
  choice: vom Gipfel der Felsen
  rationale: רֹאשׁ bezeichnet im topografischen Zusammenhang die Spitze bzw. den Gipfel; die Formulierung erhält das Bild des erhöhten Aussichtspunkts.
- source_word: אֶרְאֶנּוּ
  choice: sehe ich es
  rationale: Das maskuline Singularsuffix verweist kollektiv auf עָם, »Volk«. Im Deutschen ist »Volk« grammatisch sächlich, daher ist »es« die natürliche Entsprechung.
- source_word: וּמִגְּבָעוֹת אֲשׁוּרֶנּוּ
  choice: und von den Hügeln aus schaue ich es
  rationale: גְּבָעוֹת bedeutet »Hügel«; אשׁור bezeichnet aufmerksames Schauen und wird zur Wahrung der poetischen Variation anders als ראה wiedergegeben.
- source_word: הֶן
  choice: Siehe
  rationale: Die hinweisende Partikel lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. »Siehe« ist würdevoll und in poetisch-prophetischer Rede weiterhin verständlich.
- source_word: עָם לְבָדָד יִשְׁכֹּן
  choice: ein Volk, das für sich allein wohnt
  rationale: לְבָדָד beschreibt Abgesondertheit bzw. Eigenständigkeit. Das Imperfekt kann einen charakteristischen oder zukünftigen Sachverhalt ausdrücken; das deutsche Präsens wahrt hier den spruchhaften Charakter.
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: und sich nicht zu den Nationen zählt
  rationale: Der Hitpael von חשׁב lässt eine reflexive bzw. mediale Deutung zu. »Sich zu … zählen« ist natürliches Deutsch und erhält diese Lesart; die ebenfalls mögliche passive Deutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Reflexive oder passive Deutung von לֹא יִתְחַשָּׁב
  choice: und sich nicht zu den Nationen zählt
  alternative: und nicht zu den Nationen gerechnet wird
  rationale: Die Hitpael-Form kann reflexiv/medial oder passiv verstanden werden. Der Haupttext gibt die reflexive Möglichkeit wieder, ohne aus der Abgesondertheit eine Aussage über Überlegenheit abzuleiten; die verbreitete passive Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Parallelität. »Siehe« markiert bewusst den erhöhten Stil des Orakels, ohne insgesamt archaische Syntax zu verwenden. Das kollektiv gemeinte Volk wird gemäß dem deutschen Genus mit »es« aufgenommen.
