base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: de
  text: 'Da sagte Bileam zu Balak: „Baue mir hier sieben Altäre und stelle mir hier sieben Stiere und sieben Widder bereit.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ־ führt die Handlung fort; „Da sagte“ gibt die zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: אֶל בָּלָק
  choice: zu Balak
  rationale: Bei einem Verb des Sagens ist „zu“ die natürliche deutsche Entsprechung von אֶל; der Name Balak folgt der etablierten deutschen Form.
- source_word: בְּנֵה לִי בָזֶה
  choice: Baue mir hier
  rationale: Der Imperativ von בנה bedeutet „bauen“; לִי bezeichnet den Begünstigten und בָזֶה den Ort, idiomatisch „mir hier“.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: sieben Altäre
  rationale: Direkte und kontextgerechte Wiedergabe der Zahlwortfügung.
- source_word: וְהָכֵן לִי בָזֶה
  choice: und stelle mir hier … bereit
  rationale: Der Hifil-Imperativ von כון bezeichnet hier das Bereitmachen beziehungsweise Bereitstellen der Opfertiere.
- source_word: שִׁבְעָה פָרִים
  choice: sieben Stiere
  rationale: פָר bezeichnet im Opferkontext einen männlichen Rinderbestand; „Stiere“ ist präzise, ohne ein nicht ausdrücklich markiertes Alter hinzuzufügen.
- source_word: וְשִׁבְעָה אֵילִים
  choice: und sieben Widder
  rationale: אֵילִים bezeichnet männliche Schafe, im Opferkontext regulär „Widder“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „mir hier“ bleibt erhalten, um die parallele Struktur und Betonung des hebräischen Textes zu bewahren.
