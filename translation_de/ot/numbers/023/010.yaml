  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: de
  text: Wer kann den Staub Jakobs zählen oder ein Viertel Israels zählen[a]? Möge ich den Tod der Aufrichtigen sterben[b], und möge mein Ende dem eines Aufrichtigen gleichen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Viertel Israels“. Wörtlich steht „ein Viertel Israels“; die genaue Bezugnahme der schwierigen Wendung ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Tod der Gerechten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „wie seines“ beziehungsweise „wie er“. Das Hebräische verwendet die männliche Einzahl, obwohl „die Aufrichtigen“ in der Mehrzahl steht; sie kann einen repräsentativen Aufrichtigen meinen.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מִי מָנָה
  choice: Wer kann … zählen
  rationale: Die rhetorische Frage bezeichnet die Unmöglichkeit des Zählens; „kann“ macht den im Hebräischen vorausgesetzten Sinn im Deutschen natürlich deutlich.
- source_word: עֲפַר יַעֲקֹב
  choice: den Staub Jakobs
  rationale: Bewahrt das poetische Bild der unzählbaren Nachkommenschaft und den Namen Jakob im Parallelismus mit Israel.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: oder auch nur ein Viertel Israels beziffern
  rationale: רֹבַע wird in seiner naheliegenden Bedeutung „Viertel“ wiedergegeben. „auch nur“ verdeutlicht knapp den hyperbolischen Sinn, ohne die schwierige Wendung durch „Menge“ zu ersetzen; „beziffern“ bildet den numerischen Parallelismus ab.
- source_word: תָּמֹת נַפְשִׁי
  choice: Möge ich … sterben
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch die eigene Person. Das natürliche deutsche „ich“ bewahrt den Wunschcharakter besser als das missverständliche „meine Seele sterbe“.
- source_word: מוֹת יְשָׁרִים
  choice: den Tod der Aufrichtigen
  rationale: „Aufrichtige“ entspricht der Grundbedeutung von יְשָׁרִים und vermeidet eine unnötige dogmatische Präzisierung durch „Gerechte“.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: und möge mein Ende … sein
  rationale: אַחֲרִית bezeichnet hier im Parallelismus mit dem Tod das Ende beziehungsweise den Ausgang des Lebens.
- source_word: כָּמֹהוּ
  choice: wie das ihre
  rationale: Der hebräische Suffix ist maskulin Singular und kann sich auf einen repräsentativen Aufrichtigen innerhalb der kollektiv gebrauchten Mehrzahl beziehen. Im Deutschen ist der pluralische Rückbezug natürlicher; die formale Abweichung wird vermerkt.
theological_decisions:
- issue: Bedeutung von יְשָׁרִים
  choice: die Aufrichtigen
  alternative: die Gerechten
  rationale: Die Übersetzung folgt dem unmittelbaren lexikalischen Sinn und lässt offen, wie die moralische und religiöse Stellung dieser Menschen theologisch genauer zu bestimmen ist.
- issue: Deutung von רֹבַע יִשְׂרָאֵל
  choice: auch nur ein Viertel Israels
  alternative: die Menge Israels / die Lagerabteilungen Israels
  rationale: Die Wiedergabe hält an der gut belegten Bedeutung „Viertel“ fest und bringt die wahrscheinliche hyperbolische Aussage vorsichtig zum Ausdruck, ohne eine unsichere Deutung als „Menge“ in den Text einzutragen.
- issue: Numerus des Rückbezugs in כָּמֹהוּ
  choice: wie das ihre
  alternative: wie das seine / wie er
  rationale: Die Mehrzahl ist im Deutschen der verständliche Rückbezug auf „die Aufrichtigen“. Der hebräische Singular bleibt als echte grammatische Spannung in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die beiden Wunschformeln werden parallel mit „Möge …“ gestaltet. Das schwer verständliche רֹבַע bleibt im Haupttext nahe am Wortsinn; seine Deutungsbreite wird in der Fußnote offengelegt.
