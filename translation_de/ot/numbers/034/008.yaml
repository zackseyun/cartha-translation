  text: מֵ/הֹ֣ר הָ/הָ֔ר תְּתָא֖וּ לְבֹ֣א חֲמָ֑ת וְ/הָי֛וּ תּוֹצְאֹ֥ת הַ/גְּבֻ֖ל צְדָֽדָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: de
  text: Vom Berg Hor aus sollt ihr die Grenze bis Lebo-Hamat[a] abstecken; die Endpunkte der Grenze sollen bei Zedad liegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »bis zum Eingang von Hamat«; wahrscheinlich handelt es sich um den festen Ortsnamen Lebo-Hamat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: Vom Berg Hor aus
  rationale: Die hebräische Verbindung bezeichnet den Ortsnamen »Berg Hor«; מִן gibt den Ausgangspunkt an.
- source_word: תְּתָאוּ
  choice: sollt ihr … abstecken
  rationale: Im Zusammenhang einer Grenzbeschreibung meint das Verb das Festlegen bzw. Markieren des Grenzverlaufs; »abstecken« ist im Deutschen präzise und natürlich.
- source_word: לְבֹא חֲמָת
  choice: bis Lebo-Hamat
  rationale: Wörtlich steht »bis zum Eingang von Hamat«, doch die Wendung wird wahrscheinlich als feste geografische Bezeichnung gebraucht. Die Umschrift bewahrt diesen Ortsnamencharakter; die wörtliche Möglichkeit wird in einer Fußnote genannt.
- source_word: וְהָיוּ
  choice: sollen … liegen
  rationale: Die Form führt die rechtlich-geografische Anweisung fort; »sollen … liegen« gibt den deutschen Satz idiomatisch wieder.
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: die Endpunkte der Grenze
  rationale: In Grenzbeschreibungen bezeichnet תּוֹצְאֹת die äußersten beziehungsweise abschließenden Punkte eines Grenzverlaufs.
- source_word: צְדָדָה
  choice: bei Zedad
  rationale: Das Richtungs-ה verbindet den Grenzabschluss mit dem Ort Zedad. »Bei Zedad« gibt die Lage natürlich wieder, ohne eine übergenaue räumliche Beziehung zu behaupten.
theological_decisions: []
