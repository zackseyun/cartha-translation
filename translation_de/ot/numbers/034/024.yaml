lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Und für den Stamm
  rationale: מַטֶּה bezeichnet wörtlich einen Stab, meint in dieser administrativen Stammesliste jedoch idiomatisch den Stamm; Präposition und Konjunktion werden mit „Und für“ wiedergegeben.
- source_word: בְנֵי אֶפְרַיִם
  choice: der Söhne Ephraims
  rationale: Die formale hebräische Wendung „Söhne Ephraims“ wird bewahrt; gemeint sind die Nachkommen beziehungsweise Angehörigen des Stammes Ephraim.
- source_word: נָשִׂיא
  choice: ein Anführer
  rationale: Hier bezeichnet נָשִׂיא den bestellten führenden Vertreter des Stammes. „Anführer“ ist verständlich und vermeidet die königlichen Nebenbedeutungen von „Fürst“.
- source_word: קְמוּאֵל
  choice: Kemuël
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention transliteriert; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die übliche patronymische Verbindung wird im Deutschen natürlich mit „der Sohn“ wiedergegeben.
- source_word: שִׁפְטָן
  choice: Schiftan
  rationale: Der Personenname wird in einer der hebräischen Lautgestalt angenäherten, im Deutschen lesbaren Form transliteriert.
