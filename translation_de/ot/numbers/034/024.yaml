  text: 'Und für den Stamm der Söhne Ephraims[a] ein Anführer: Kemuel, Sohn Schiftans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Söhne Ephraims“; gemeint sind die Angehörigen beziehungsweise Nachkommen des Stammes Ephraim.
