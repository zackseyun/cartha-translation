  verdict: revise
  source_fidelity: 'Die syntaktische Gliederung bildet die hebräische Listenform gut ab: וּלְ wird mit „und für“ wiedergegeben, und die Stammesbezeichnung sowie das Patronym bleiben erhalten. „Fürst“ ist für נָשִׂיא in diesem administrativen Kontext möglich, kann im heutigen Deutsch aber unnötig einen dynastisch-monarchischen Rang nahelegen; „Oberhaupt“ trifft die Funktion des ernannten Stammesvertreters genauer.'
  naturalness: Die knappe elliptische Form ist im Kontext der fortlaufenden Liste natürlich. „Paltiël, Sohn Azzans“ ist als deutscher Name-Personenstandsausdruck etwas flüssiger als „Paltiël, der Sohn Asans“, ohne den Inhalt zu verändern.
  terminology: '„Stamm der Söhne Issachars“ bewahrt die formale Bezeichnung בני יששכר. Für נשיא ist „Oberhaupt“ ein sachgerechter, nicht-dynastischer Terminus. Der Name עזן sollte nicht als „Asan“ erscheinen: Das זּ ist ein verdoppeltes Zajin; „Azzan“ bildet dies verlässlich ab und stimmt mit der englischen POB-Namensform überein. „Paltiël“ ist als etablierte deutsche Bibelnamensform vertretbar.'
