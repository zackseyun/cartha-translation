  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: und für den Stamm
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang der Landverteilung einen Stamm; die Präfixe וּ und לְ werden mit »und für« wiedergegeben.
- source_word: בְנֵי יִשָׂשכָר
  choice: der Söhne Issachars
  rationale: Die formale Stammesbezeichnung »Söhne Issachars« bleibt erhalten; der deutsche Genitiv gibt die hebräische Status-constructus-Verbindung natürlich wieder.
- source_word: נָשִׂיא
  choice: ein Fürst
  rationale: נָשִׂיא bezeichnet hier den bevollmächtigten führenden Vertreter des Stammes. »Fürst« bewahrt die traditionelle Würdebezeichnung, ohne ein erbliches Königtum zu behaupten.
- source_word: פַּלְטִיאֵל
  choice: Paltiël
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamensform wiedergegeben; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: בֶּן
  choice: der Sohn
  rationale: Der Patronymmarker wird direkt und im Deutschen syntaktisch natürlich als »der Sohn« wiedergegeben.
- source_word: עַזָּן
  choice: Asan
  rationale: Der Personenname wird in einer etablierten deutschen Transkriptionsform wiedergegeben; das hebräische Zajin entspricht dabei deutschem stimmhaftem s.
