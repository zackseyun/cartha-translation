  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: de
  text: Dann soll eure Grenze südlich von der Akrabbim-Steige[a] abbiegen und nach Zin hinüberführen. Ihr Ende soll südlich von Kadesch-Barnea liegen. Von dort soll sie nach Hazar-Addar weiterführen und nach Azmon hinübergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akrabbim bedeutet wahrscheinlich „Skorpione“; der Ortsname könnte auch mit „Anstieg der Skorpione“ oder „Skorpionpass“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב לָכֶם הַגְּבוּל
  choice: Dann soll eure Grenze … abbiegen
  rationale: נָסַב bezeichnet in Grenzbeschreibungen eine Richtungsänderung. „Eure Grenze“ gibt לָכֶם idiomatisch und zugleich genau wieder.
- source_word: מִנֶּגֶב
  choice: südlich vom
  rationale: Die Wendung bestimmt die Lage der Grenzlinie auf der Südseite des folgenden Geländepunkts.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: vom Aufstieg Akrabbim
  rationale: מַעֲלֶה bezeichnet einen Anstieg oder eine Steige; Akrabbim bleibt als Ortsname transliteriert. Die Bedeutung des Namens wird in der Fußnote genannt.
- source_word: וְעָבַר צִנָה
  choice: und nach Zin hinüberführen
  rationale: עָבַר beschreibt hier den Verlauf der Grenzlinie; die Richtungsendung an צִנָה zeigt die Bewegung nach Zin an.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: Ihr Endpunkt soll … liegen
  rationale: Das morphologisch plurale תּוֹצְאוֹת bezeichnet in Grenzlisten idiomatisch den Ausgang beziehungsweise Endpunkt einer Grenzstrecke. Der deutsche Singular vermeidet die missverständliche Vorstellung mehrerer verschiedener Endpunkte.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: südlich von Kadesch-Barnea
  rationale: Die Grenzlage wird relativ zur Südseite von Kadesch-Barnea angegeben.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: Von dort soll sie nach Hazar-Addar weiterführen
  rationale: יָצָא bezeichnet in Grenzbeschreibungen das weitere Auslaufen oder Fortführen der Linie zu einem Ort. „Von dort“ stellt den deutschen Satzanschluss klar her.
- source_word: וְעָבַר עַצְמֹנָה
  choice: und nach Azmon hinübergehen
  rationale: עָבַר beschreibt erneut den weiteren Grenzverlauf; die Richtungsendung am Ortsnamen wird mit „nach“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholten Verben des hebräischen Grenzverlaufs werden im Deutschen leicht variiert, ohne die Abfolge der genannten Orte oder Richtungsangaben zu verändern. Ortsnamen sind in gebräuchlicher deutscher Transliteration wiedergegeben.
