  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: de
  text: 'Und für den Stamm der Söhne Aschers: ein Oberhaupt, Ahihud, der Sohn Schelomis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Und für den Stamm
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang einen israelitischen Stamm, nicht einen Stab; וּלְ wird natürlich mit „Und für“ wiedergegeben.
- source_word: בְנֵי אָשֵׁר
  choice: der Söhne Aschers
  rationale: Die formale Stammesbezeichnung „Söhne Aschers“ bewahrt die genderbezogene Ausdrucksweise des Hebräischen und ist im Deutschen verständlich.
- source_word: נָשִׂיא
  choice: ein führender Mann
  rationale: נָשִׂיא bezeichnet hier den offiziell bestimmten Vertreter des Stammes bei der Landverteilung. „Führender Mann“ gibt die Funktion verständlich wieder, ohne die königlichen Assoziationen von „Fürst“ einzutragen.
- source_word: אֲחִיהוּד
  choice: Ahihud
  rationale: Der Personenname wird nach üblicher deutscher Bibelnamenschreibung transliteriert.
- source_word: בֶּן שְׁלֹמִי
  choice: der Sohn Schelomis
  rationale: Die hebräische Vatersnamensformel wird in natürlichem, würdevollem Deutsch wiedergegeben.
