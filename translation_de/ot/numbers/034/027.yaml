translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Listenstruktur des Hebräischen bleibt durch den Doppelpunkt erkennbar; „ein führender Mann“ klingt dabei natürlicher und funktionsbezogener als „ein Fürst“.
