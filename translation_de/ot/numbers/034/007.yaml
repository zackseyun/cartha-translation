  text: וְ/זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֣וּל צָפ֑וֹן מִן הַ/יָּם֙ הַ/גָּדֹ֔ל תְּתָא֥וּ לָ/כֶ֖ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: de
  text: 'Und dies soll eure Nordgrenze sein: Vom Großen Meer aus sollt ihr euch die Grenze bis zum Berg Hor abstecken.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »sollt ihr die Grenzlinie bis zum Berg Hor ziehen«. Das Verb kann in diesem geografischen Zusammenhang das Ziehen oder Markieren einer Grenze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das »Große Meer« ist das Mittelmeer.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה יִהְיֶה לָכֶם
  choice: Und dies soll eure … sein
  rationale: Bewahrt den fortlaufenden, rechtlich-geografischen Ton und gibt den Dativ לָכֶם im Deutschen idiomatisch als Besitzangabe wieder.
- source_word: גְּבוּל צָפוֹן
  choice: Nordgrenze
  rationale: Das geläufige deutsche Kompositum gibt die attributive Verbindung präzise und natürlich wieder.
- source_word: מִן הַיָּם הַגָּדֹל
  choice: Vom Großen Meer aus
  rationale: Bewahrt die hebräische geografische Bezeichnung, statt den modernen Namen in den Haupttext einzusetzen.
- source_word: תְּתָאוּ לָכֶם
  choice: sollt ihr euch die Grenze … abstecken
  rationale: Das seltene Verb bezeichnet hier wahrscheinlich das Ziehen oder Markieren einer Grenzlinie; „euch“ bildet den wiederholten Dativ לָכֶם ab.
- source_word: הֹר הָהָר
  choice: Berg Hor
  rationale: Gibt den überlieferten Ortsnamen in der im Deutschen üblichen Form wieder.
