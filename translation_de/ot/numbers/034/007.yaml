  source_fidelity: 'Der Entwurf gibt die hebräische Grenzformel präzise wieder: die Nordgrenze wird vom „Großen Meer“ her bis zum Berg Hor bestimmt. „abstecken“ ist in diesem Kontext eine tragfähige Wiedergabe von תתאו; die Richtungsangabe „bis zum“ macht die im Hebräischen kontextuell mitgemeinte Grenzführung verständlich. Das wiederholte לָכֶם ist mit „euch“ angemessen berücksichtigt.'
