  source_fidelity: 'Der Entwurf gibt die hebräische Einleitungsformel vollständig und treffend wieder: וַיְדַבֵּר als narrativ fortführendes „Dann sprach“, יהוה als „Jahwe“, אֶל מֹשֶׁה als „zu Mose“ und לֵאמֹר idiomatisch durch den auf die folgende Rede verweisenden Doppelpunkt. Der Doppelpunkt ist hier eine angemessene deutsche Entsprechung, obwohl לֵאמֹר im Hebräischen ausdrücklich vorliegt.'
