base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Dann sprach Jahwe zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Dann“ gibt die Abfolge natürlich wieder, und „sprach“ bewahrt den feierlichen Charakter der Einleitungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Dies ist die natürliche standarddeutsche Wiedergabe der Präposition אֶל mit dem Namen מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende wörtliche Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitung wird idiomatisch durch einen Doppelpunkt wiedergegeben; der folgende Vers enthält den Wortlaut.
