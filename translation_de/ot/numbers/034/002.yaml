source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי אַתֶּ֥ם בָּאִ֖ים אֶל הָ/אָ֣רֶץ כְּנָ֑עַן זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּפֹּ֤ל לָ/כֶם֙ בְּֽ/נַחֲלָ֔ה אֶ֥רֶץ כְּנַ֖עַן לִ/גְבֻלֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: de
  text: 'Befiehl den Israeliten[a] und sprich zu ihnen: »Wenn ihr in das Land Kanaan kommt, ist dies das Land, das euch als Erbbesitz zufallen wird[b]: das Land Kanaan nach seinen Grenzen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“. Gemeint sind die Israeliten als Volk.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort bedeutet wörtlich „fallen“. Bei der Landverteilung bezeichnet es das Gebiet, das jemandem als Anteil zugewiesen wird; daher auch: „das euch als Erbbesitz zugeteilt wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Befiehl
  rationale: Der Imperativ von צוה bezeichnet eine verbindliche, autoritative Anweisung; „Befiehl“ bewahrt diese Stärke knapp und natürlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die hebräische Wendung lautet wörtlich „den Söhnen Israels“, bezeichnet hier aber das Volk als Gesamtheit. „Den Israeliten“ ist im modernen Deutschen klar und idiomatisch; die wörtliche Form bleibt in einer Fußnote erhalten.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sprich zu ihnen
  rationale: Die Form gibt einen anschließenden Befehl wieder. „Sprich zu ihnen“ wahrt den feierlich-rechtlichen Ton, ohne altertümlich zu wirken.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: Wenn ihr … kommt
  rationale: כִּי leitet hier den Umstand des bevorstehenden Eintritts ein; das Partizip בָּאִים hat im Zusammenhang futurisch-prospektiven Sinn. Die deutsche Wenn-Konstruktion gibt dies natürlich wieder.
- source_word: הָאָרֶץ כְּנָעַן
  choice: das Land Kanaan
  rationale: Die appositionelle hebräische Verbindung wird im Deutschen am klarsten mit „das Land Kanaan“ wiedergegeben.
- source_word: זֹאת הָאָרֶץ
  choice: ist dies das Land
  rationale: Die demonstrative Formulierung leitet die nun folgende förmliche Bestimmung des Gebiets ein.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם
  choice: das euch … zufallen wird
  rationale: נפל bedeutet wörtlich „fallen“, wird bei Landzuteilungen aber idiomatisch für das durch Los oder Zuweisung erhaltene Gebiet gebraucht. „Zufallen“ bewahrt sowohl das Bild als auch den Zuteilungssinn.
- source_word: בְּנַחֲלָה
  choice: als Erbbesitz
  rationale: נחלה bezeichnet einen erblich zugewiesenen Besitzanteil. „Erbbesitz“ ist im Landverteilungskontext präziser und kompakter als das stärker abstrakte „Erbe“.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: das Land Kanaan nach seinen Grenzen
  rationale: Die Präpositionalwendung bezeichnet das Land entsprechend seinen im Folgenden festgelegten Grenzlinien. „Nach seinen Grenzen“ erhält die formale, abgrenzende Ausdrucksweise des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit dem knappen und förmlichen Ton einer göttlichen Rechtsanweisung. Die hebräische Zuteilungsmetapher wird durch „zufallen“ im Haupttext bewahrt; schwer verständliche Wörtlichkeit wird in Fußnoten erläutert.
