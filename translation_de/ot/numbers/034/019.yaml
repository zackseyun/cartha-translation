  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: de
  text: 'Und dies sind die Namen der Männer: für den Stamm Juda: Kaleb, der Sohn Jefunnes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Das וְ führt die vorausgehende Anweisung fort; אֵלֶּה leitet die namentliche Aufzählung ein. Die deutsche Form ergänzt idiomatisch die im Hebräischen fehlende Kopula.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: die Namen der Männer
  rationale: שְׁמוֹת steht im Status constructus vor הָאֲנָשִׁים. „Männer“ gibt die maskuline Bezeichnung für die konkret benannten männlichen Vertreter präzise wieder.
- source_word: לְמַטֵּה יְהוּדָה
  choice: Für den Stamm Juda
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang einen Stamm, nicht einen Stab. Die Präposition לְ kennzeichnet hier die Zuordnung beziehungsweise Vertretung.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בֶּן יְפֻנֶּה
  choice: der Sohn Jefunnes
  rationale: Die Patronymform wird in natürlichem Deutsch mit „der Sohn“ wiedergegeben; „Jefunne“ folgt der gebräuchlichen deutschen Namensform und erhält im Genitiv die Endung -s.
