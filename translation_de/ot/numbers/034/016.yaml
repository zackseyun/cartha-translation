  text: 'Dann sprach Jahwe zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann redete
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann“ gibt diese Abfolge in natürlichem Deutsch wieder. „redete“ entspricht דבר in der feierlichen Einleitungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Umschrift.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Verbindung mit „reden“.
- source_word: לֵאמֹר
  choice: 'und sagte:'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Das idiomatische „und sagte:“ bewahrt diese Funktion, ohne die im Deutschen schwerfällige Formel „indem er sagte“ zu verwenden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ erhält den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Rede-Einleitung bleibt erkennbar, wird aber idiomatisch formuliert.
