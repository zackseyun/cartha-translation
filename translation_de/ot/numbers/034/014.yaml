  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: de
  text: Denn der Stamm der Rubeniter, entsprechend ihren Großfamilien[a], und der Stamm der Gaditer, entsprechend ihren Großfamilien[a], sowie der halbe Stamm Manasse haben ihr Erbteil in Besitz genommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach ihren Vaterhäusern“; gemeint sind die angestammten Großfamilien beziehungsweise Sippen innerhalb des jeweiligen Stammes.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zur vorausgehenden Aussage über die Landzuteilung ein.
- source_word: מַטֵּה
  choice: Stamm
  rationale: Bezeichnet in diesem Zusammenhang die israelitische Stammeseinheit, nicht einen Stab.
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: Rubeniter / Gaditer
  rationale: Die deutschen Volksbezeichnungen geben die genealogisch formulierten Gruppenbezeichnungen natürlich und präzise wieder.
- source_word: לְבֵית אֲבֹתָם
  choice: entsprechend ihren Großfamilien
  rationale: Die Wendung bezeichnet die väterlich-ancestralen Familienverbände innerhalb eines Stammes; „entsprechend“ bewahrt den Gedanken der Gliederung beziehungsweise Zuteilung nach diesen Einheiten.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: sowie der halbe Stamm Manasse
  rationale: Gibt knapp und eindeutig wieder, dass nur eine Hälfte des Stammes Manasse gemeint ist.
- source_word: לָקְחוּ נַחֲלָתָם
  choice: haben ihr Erbteil in Besitz genommen
  rationale: Bewahrt den aktiven Sinn von לקח und gibt נַחֲלָה im Kontext der territorialen Landzuteilung als „Erbteil“ wieder.
