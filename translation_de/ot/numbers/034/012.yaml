  text: וְ/יָרַ֤ד הַ/גְּבוּל֙ הַ/יַּרְדֵּ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו יָ֣ם הַ/מֶּ֑לַח זֹאת֩ תִּהְיֶ֨ה לָ/כֶ֥ם הָ/אָ֛רֶץ לִ/גְבֻלֹתֶ֖י/הָ סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: de
  text: Dann verläuft die Grenze hinab zum Jordan, und ihre Ausläufer liegen am Salzmeer.[a] Das soll euer Land sein, mit seinen Grenzen ringsum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Salzmeer“ ist das Gewässer, das heute meist Totes Meer genannt wird.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Dann führt ... hinab
  rationale: ירד bezeichnet ein Hinabführen oder Hinabgehen. Bei einer Grenzlinie klingt im Deutschen „führt … hinab“ natürlich; וְ wird im fortlaufenden Grenzverlauf mit „Dann“ wiedergegeben.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: גְּבוּל bezeichnet hier die Grenzlinie des Landes; „Grenze“ ist die natürliche moderne deutsche Entsprechung.
- source_word: הַיַּרְדֵּנָה
  choice: zum Jordan
  rationale: Die Richtungsendung bezeichnet die Bewegung zum Jordan hin. Der Flussname ist im Deutschen ohne ergänzendes „Fluss“ eindeutig.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: und ihr Endpunkt liegt
  rationale: תּוֹצָאוֹת kann in Grenzbeschreibungen Endpunkte, Ausläufe oder äußerste Enden bezeichnen. Der grammatisch plurale Ausdruck wird aufgrund des singularischen Bezugs auf den Abschluss der Grenzlinie idiomatisch als „ihr Endpunkt“ wiedergegeben; das präsentische „liegt“ entspricht einer natürlichen deutschen Grenzbeschreibung.
- source_word: יָם הַמֶּלַח
  choice: Salzmeer
  rationale: Die wörtliche Bezeichnung „Salzmeer“ bewahrt den hebräischen Namen; das heute sogenannte Tote Meer wird in der Fußnote identifiziert.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: Das soll euer Land sein
  rationale: Die Formulierung gibt die Festlegung des Landes als zugewiesenes Gebiet klar und würdig wieder.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: mit seinen Grenzen ringsum
  rationale: Die Wendung beschreibt das Land anhand seiner es ringsum umschließenden Grenzen. „Mit seinen Grenzen ringsum“ bleibt quellennah und ist zugleich verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Stil. Die rechtlich-geografische Grenzbeschreibung bleibt knapp; das Präsens bei „liegt“ ist im Deutschen idiomatischer als eine durchgehend futurische Form.
