source:
  edition: WLC
  text: אֵ֕לֶּה אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה לְ/נַחֵ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: de
  text: Das sind die Männer, denen Jahwe gebot, den Israeliten im Land Kanaan ihren Erbbesitz zuzuteilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das sind die Männer, denen Jahwe gebot, die Israeliten im Land Kanaan in ihren Erbbesitz einzusetzen.“'
    reason: Das Hifil von נחל kann sowohl das Zuteilen des Erbbesitzes als auch das Einsetzen der Empfänger in ihren Erbbesitz bezeichnen.
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Das sind die Männer, denen
  rationale: Die Wendung verweist abschließend auf die zuvor genannten männlichen Beauftragten. „Die Männer“ macht diesen Kontext im Deutschen natürlich und eindeutig sichtbar.
- source_word: צִוָּה
  choice: gebot
  rationale: Das Verb צוה bezeichnet ein verbindliches Gebot; „gebot“ wahrt den gehobenen, würdigen Ton und passt zur folgenden Infinitivkonstruktion.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְנַחֵל
  choice: ihren Erbbesitz zuzuteilen
  rationale: Der Hifil von נחל bezeichnet hier das Zuteilen des Landes als Erbbesitz. Die Formulierung bewahrt sowohl den Erbgedanken als auch den Vorgang der Aufteilung.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: In diesem Kontext bezeichnet „Söhne Israels“ das Volk Israel. „Den Israeliten“ ist im modernen Deutschen idiomatisch und schließt die Empfänger der Landzuteilung als Gemeinschaft ein.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Die Formulierung gibt sowohl אֶרֶץ als auch den geografischen Namen natürlich und knapp wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, während „der HERR“ die traditionelle ersetzende Lesung darstellt.
- issue: Bedeutung von לְנַחֵל
  choice: den Israeliten ihren Erbbesitz zuzuteilen
  alternative: die Israeliten in ihren Erbbesitz einzusetzen
  rationale: 'Beide Deutungen sind grammatisch möglich: Das Hifil kann das Zuteilen eines Erbbesitzes oder das Einsetzen von Personen in ihr Erbe ausdrücken. Im unmittelbaren Kontext der beauftragten Männer steht die Landverteilung im Vordergrund; die Alternative wird deshalb in einer Fußnote erhalten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; „Erbbesitz“ erhält den land- und bundestheologischen Gehalt von נחל.
