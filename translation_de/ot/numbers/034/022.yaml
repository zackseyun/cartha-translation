  text: וּ/לְ/מַטֵּ֥ה בְנֵי דָ֖ן נָשִׂ֑יא בֻּקִּ֖י בֶּן יָגְלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: de
  text: 'Und für den Stamm der Daniter: ein Oberhaupt, Bukki, Sohn Joglis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְמַטֵּה
  choice: Und für den Stamm
  rationale: מַטֶּה bezeichnet im Zusammenhang der Landverteilung einen Stamm; וּ und לְ werden natürlich mit „Und für“ wiedergegeben.
- source_word: בְנֵי דָן
  choice: der Daniter
  rationale: Wörtlich „der Söhne Dans“; in der deutschen Bibelsprache bezeichnet „Daniter“ die Stammesangehörigen klar und natürlich.
- source_word: נָשִׂיא
  choice: ein führender Mann
  rationale: Das Wort bezeichnet hier den bevollmächtigten Vertreter des Stammes bei der Landverteilung. „Führender Mann“ ist verständlich und vermeidet die monarchische Nebenbedeutung von „Fürst“.
- source_word: בֻּקִּי
  choice: Bukki
  rationale: Der Personenname wird nach gebräuchlicher deutscher biblischer Umschrift wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die direkte Vater-Sohn-Beziehung wird mit der üblichen genealogischen Formulierung wiedergegeben.
- source_word: יָגְלִי
  choice: Joglis
  rationale: Der Personenname wird entsprechend der etablierten deutschen Bibeltradition als „Jogli“ wiedergegeben und nach „Sohn“ in den Genitiv gesetzt.
