  text: שְׁנֵ֥י הַ/מַּטּ֖וֹת וַ/חֲצִ֣י הַ/מַּטֶּ֑ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֛בֶר לְ/יַרְדֵּ֥ן יְרֵח֖וֹ קֵ֥דְמָ/ה מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: de
  text: Die beiden Stämme und der halbe Stamm haben ihren Erbbesitz jenseits des Jordan bei Jericho erhalten, ostwärts, dem Sonnenaufgang entgegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Formulierung verbindet zwei Richtungsangaben („ostwärts“ und „zum Sonnenaufgang hin“) und betont so die östliche Seite.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: die beiden Stämme
  rationale: מַטֶּה bedeutet wörtlich auch »Stab«, bezeichnet im Zusammenhang der Landverteilung aber idiomatisch einen Stamm.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: und der halbe Stamm
  rationale: Die Wendung bezeichnet die anerkannte Einheit des halben Stammes Manasse; diese knappe Form ist im Deutschen natürlich.
- source_word: לָקְחוּ
  choice: haben … genommen
  rationale: Das Qal-Perfekt bezeichnet eine abgeschlossene Handlung; das Perfekt passt zum erklärenden Rückblick des Zusammenhangs und gibt לקח unmittelbar wieder.
- source_word: נַחֲלָתָם
  choice: ihren Erbbesitz
  rationale: נַחֲלָה bezeichnet hier den erblich zugeteilten Landbesitz. »Erbbesitz« bewahrt sowohl den Erb- als auch den Besitzaspekt.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: jenseits des Jordan
  rationale: Die idiomatische Wendung bezeichnet das Gebiet auf der anderen Seite des Jordan aus dem jeweiligen Blickwinkel.
- source_word: יְרֵחוֹ
  choice: bei Jericho
  rationale: Der Ortsname bestimmt die betreffende Jordangegend näher; »bei Jericho« ist natürlich und vermeidet eine zu punktgenaue Lokalisierung.
- source_word: קֵדְמָה מִזְרָחָה
  choice: nach Osten hin, zum Sonnenaufgang
  rationale: Die zwei Richtungsangaben werden getrennt wiedergegeben, damit die verstärkende Doppelung und das konkrete Bild des Sonnenaufgangs erhalten bleiben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erbbesitz« ist bibelsprachlich vertraut, aber weiterhin allgemein verständlich. Die hebräische Doppelung am Versende bleibt im Haupttext sichtbar und wird in der Fußnote erläutert.
