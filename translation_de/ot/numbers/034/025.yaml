  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי זְבוּלֻ֖ן נָשִׂ֑יא אֱלִיצָפָ֖ן בֶּן פַּרְנָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: de
  text: 'Und für den Stamm der Söhne Sebulons ein Stammesoberhaupt: Elizafan, der Sohn Parnachs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Und für den Stamm
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang der Stammeszuteilung einen Stamm; die Präfixe וּ und לְ werden als „Und für“ wiedergegeben.
- source_word: בְנֵי זְבוּלֻן
  choice: der Söhne Sebulons
  rationale: Die formale genealogische Wendung בְנֵי wird als „Söhne“ bewahrt; der Eigenname זְבוּלֻן erscheint in der im Deutschen üblichen biblischen Form „Sebulon“.
- source_word: נָשִׂיא
  choice: ein Stammesoberhaupt
  rationale: נָשִׂיא meint hier den anerkannten Vertreter beziehungsweise Vorsteher eines Stammes. „Stammesoberhaupt“ ist im administrativen Kontext präziser als „Fürst“ und natürlicher als das allgemeinere „Anführer“.
- source_word: אֱלִיצָפָן
  choice: Elizafan
  rationale: Der Personenname wird quellenah in deutscher Lautgestalt transliteriert.
- source_word: בֶּן פַּרְנָךְ
  choice: der Sohn Parnachs
  rationale: בֶּן ist die übliche genealogische Angabe „Sohn von“. Die deutsche Genitivkonstruktion ist knapp und natürlich; der Personenname wird als „Parnach“ transliteriert.
