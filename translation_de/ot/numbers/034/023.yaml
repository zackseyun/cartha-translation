  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/מַטֵּ֥ה בְנֵֽי מְנַשֶּׁ֖ה נָשִׂ֑יא חַנִּיאֵ֖ל בֶּן אֵפֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: de
  text: 'Für die Söhne Josefs[a], für den Stamm der Söhne Manasses: das Oberhaupt Hanniel, Sohn Efods.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nachkommen Josefs … Nachkommen Manasses«. Das Hebräische verwendet in dieser stammesgenealogischen Ausdrucksweise jeweils wörtlich »Söhne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Für die Söhne Josefs
  rationale: בְּנֵי bedeutet wörtlich »Söhne«, bezeichnet hier im stammesgeschichtlichen Zusammenhang aber die Nachkommen. Die formnahe Wiedergabe bewahrt den genealogischen Sprachgebrauch; die Alternative wird in einer Fußnote genannt.
- source_word: לְמַטֵּה
  choice: für den Stamm
  rationale: מַטֶּה bedeutet zwar auch »Stab«, ist hier in der Liste der für die Landverteilung bestimmten Vertreter jedoch die übliche Bezeichnung für einen Stamm.
- source_word: בְנֵי מְנַשֶּׁה
  choice: der Söhne Manasses
  rationale: Die Wiedergabe folgt der wiederholten hebräischen genealogischen Formel und wahrt die Parallelität zu »Söhne Josefs«.
- source_word: נָשִׂיא
  choice: ein führender Mann
  rationale: נָשִׂיא bezeichnet hier den maßgeblichen Vertreter eines Stammes. »Ein führender Mann« ist gegenwärtig und verständlich und vermeidet die königlichen Nebenbedeutungen von »Fürst«.
- source_word: חַנִּיאֵל
  choice: Hanniël
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamenkonvention transliteriert; das Trema kennzeichnet die getrennte Aussprache der Vokale.
- source_word: בֶּן אֵפֹד
  choice: der Sohn Efods
  rationale: Die hebräische Vatersnamenformel wird unmittelbar wiedergegeben. Efod ist hier ein Personenname, nicht die Bezeichnung des priesterlichen Kleidungsstücks.
