base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: de
  text: Die Grenze soll sich von Schefam nach Ribla hinabziehen, östlich von Ajin[a]. Dann soll die Grenze sich hinabziehen und die östliche Seite des Sees Kinneret erreichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von Osten von Ajin“; gemeint ist die Lage östlich von Ajin.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Schulter des Sees Kinneret im Osten berühren“. „Schulter“ bezeichnet hier geografisch die Seite oder Flanke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: soll … hinabführen
  rationale: ירד bezeichnet ein Hinabgehen oder Herabführen. In der Grenzbeschreibung wird damit der topografische Verlauf der Grenzlinie angegeben; „hinabführen“ ist im Deutschen natürlich und bewahrt diese Richtung.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: die Grenze
  rationale: גְּבוּל bezeichnet eine territoriale Grenze oder Grenzlinie. „Die Grenze“ ist präzise und im Deutschen für geografische Beschreibungen idiomatisch.
- source_word: מִשְּׁפָם
  choice: von Schefam
  rationale: Der Ortsname wird nach üblicher deutscher Bibelnamenschreibung als „Schefam“ wiedergegeben.
- source_word: הָרִבְלָה
  choice: nach Ribla
  rationale: Der Ortsname wird als „Ribla“ transliteriert; die Form bezeichnet hier das Ziel des Grenzverlaufs.
- source_word: מִקֶּדֶם לָעָיִן
  choice: östlich von Ajin
  rationale: Die Wendung lokalisiert Ribla beziehungsweise den Grenzverlauf östlich von Ajin. Die knappe Wiedergabe wahrt die geografische Beziehung, während eine Fußnote die wörtlichere Ausdrucksweise nennt.
- source_word: וּמָחָה
  choice: erreichen
  rationale: מחה hat hier im Grenzkontext die Bedeutung, dass die Linie auf ein geografisches Merkmal trifft oder es berührt. „Erreichen“ gibt dies in verständlichem modernem Deutsch wieder.
- source_word: עַל כֶּתֶף
  choice: den Hang an
  rationale: כֶּתֶף bedeutet wörtlich „Schulter“, bezeichnet geografisch aber eine Seite, Flanke oder einen Hang. „Hang“ vermittelt das Geländebild, ohne den im Deutschen missverständlichen Körperbegriff in den Haupttext zu übernehmen.
- source_word: יָם כִּנֶּרֶת
  choice: des Sees Kinneret
  rationale: יָם kann ein Meer oder einen größeren See bezeichnen. Für dieses Binnengewässer ist „See Kinneret“ im Deutschen klar; der hebräische Eigenname bleibt erhalten.
- source_word: קֵדְמָה
  choice: an der Ostseite
  rationale: Das Richtungswort bezeichnet die östliche Lage beziehungsweise Ausrichtung. Zusammen mit dem geografischen „Hang“ ergibt „an der Ostseite“ eine natürliche und genaue deutsche Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Nennung der Grenze folgt der hebräischen Grenzbeschreibung; Ortsnamen werden in geläufiger deutscher Transliteration wiedergegeben. Die schwer verständliche geografische Metapher „Schulter“ wird im Haupttext funktional als „Hang“ ausgedrückt und in der Fußnote offengelegt.
