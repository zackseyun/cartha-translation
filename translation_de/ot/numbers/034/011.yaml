revisions:
- from: Die Grenze soll von Schefam nach Ribla hinabführen, östlich von Ajin[a]. Dann soll die Grenze weiter hinabführen und den Hang an der Ostseite des Sees Kinneret erreichen[b].
  to: Die Grenze soll sich von Schefam nach Ribla hinabziehen, östlich von Ajin[a]. Dann soll die Grenze sich hinabziehen und die östliche Seite des Sees Kinneret erreichen[b].
  rationale: Die Revision gibt den Eigenverlauf der Grenzlinie mit „sich hinabziehen“ wieder und vermeidet mit „östliche Seite“ eine übermäßig spezifische Festlegung von כֶּתֶף als „Hang“. Die Fußnoten bewahren die hebräische Bildsprache und erläutern die Ortsangabe korrekt.
