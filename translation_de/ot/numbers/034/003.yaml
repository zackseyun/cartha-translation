  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: de
  text: Eure Südseite soll von der Wüste Zin an Edom entlang verlaufen. Eure Südgrenze soll vom östlichen Ende[a] des Salzmeeres[b] ausgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vom Ende des Salzmeeres ostwärts.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: Totes Meer; wörtlich: Salzmeer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: Südseite
  rationale: פֵּאָה bezeichnet in dieser Grenzbeschreibung die Seite beziehungsweise den Rand eines Gebietes; נֶגֶב wird hier als Himmelsrichtung gebraucht.
- source_word: מִמִּדְבַּר צִן
  choice: von der Wüste Zin
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Land; „Wüste Zin“ ist die geläufige und sachlich passende geografische Wiedergabe.
- source_word: עַל יְדֵי אֱדוֹם
  choice: an Edom entlang
  rationale: Die räumliche Wendung bedeutet hier „an der Seite von“ beziehungsweise „entlang“ und wird ohne zusätzliche Festlegung auf eine förmliche Staatsgrenze wiedergegeben.
- source_word: גְּבוּל נֶגֶב
  choice: Südgrenze
  rationale: גְּבוּל bezeichnet im Zusammenhang der Landabgrenzung eine territoriale Grenze; zusammen mit נֶגֶב ergibt sich natürlich „Südgrenze“.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: am Ende des Salzmeeres
  rationale: קָצֶה bezeichnet ein Ende oder einen äußersten Punkt. „Salzmeer“ gibt den hebräischen Gewässernamen יָם הַמֶּלַח direkt wieder.
- source_word: קֵדְמָה
  choice: im Osten
  rationale: Die Richtungsform kann hier den östlich gelegenen Ausgangspunkt kennzeichnen. Die alternative adverbiale Auffassung „ostwärts“ bleibt in einer Fußnote erhalten.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: soll ... verlaufen; soll ... beginnen
  rationale: Die wiederholte Grenzformel wird in idiomatischem Deutsch funktionsgerecht wiedergegeben; „verlaufen“ und „beginnen“ verdeutlichen den räumlichen Zusammenhang, ohne den Grenzverlauf inhaltlich auszubauen.
