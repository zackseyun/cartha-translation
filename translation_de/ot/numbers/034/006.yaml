  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: de
  text: Als Westgrenze[a] soll euch das Große Meer mit seiner Küste gelten; das soll eure Westgrenze sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Grenze des Meeres“ bzw. „Meeresgrenze“. In dieser Grenzbeschreibung kann das hebräische Wort für „Meer“ zugleich die Richtung Westen bezeichnen; daher „Westgrenze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: Grenze
  rationale: Das Substantiv bezeichnet hier die Grenzlinie eines Gebietes. „Grenze“ ist im Deutschen natürlich und passt zur wiederholten Grenzbeschreibung des Abschnitts.
- source_word: יָם
  choice: West-
  rationale: In der Verbindung גְּבוּל יָם bezeichnet יָם wörtlich das Meer, dient in dieser Grenzbeschreibung aber zugleich als Richtungsangabe für die dem Meer zugewandte Westseite.
- source_word: הַיָּם הַגָּדוֹל
  choice: das Große Meer
  rationale: Dies ist die biblische geografische Bezeichnung für das Mittelmeer. Die Großschreibung bewahrt den Charakter eines geografischen Namens.
- source_word: וְהָיָה לָכֶם
  choice: soll ... eure ... sein
  rationale: Die Formulierung beschreibt, was für Israel als Grenze gelten soll, und gibt die zuweisende Bedeutung in natürlichem Deutsch wieder.
- source_word: וּגְבוּל
  choice: als Grenze
  rationale: Die Wendung erläutert die Funktion des Großen Meeres als Grenzlinie; „als Grenze“ macht diesen appositionellen Sinn klar.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: das soll eure ... sein
  rationale: Die abschließende Wiederaufnahme wird knapp und idiomatisch wiedergegeben, ohne ihre bekräftigende Funktion zu verlieren.
- source_word: גְּבוּל יָם
  choice: Westgrenze
  rationale: Im Kontext bezeichnet die wörtliche „Meeresgrenze“ die westliche, am Meer gelegene Grenze. „Westgrenze“ vermittelt diese Richtungsfunktion klar.
