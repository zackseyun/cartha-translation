  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: de
  text: 'Da gebot Mose den Israeliten: »Dies ist das Land, das ihr durch das Los als Erbbesitz erhalten sollt und das der HERR den neun Stämmen und dem halben Stamm zu geben geboten hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt den kollektiven Ausdruck »Söhne Israels« sachgerecht wieder.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: das ihr … als Erbbesitz erhalten sollt
  rationale: Die Verbform bezeichnet die Inbesitznahme als erblich zugeteilten Besitz; »erben« allein könnte im Deutschen fälschlich an einen Todesfall denken lassen.
- source_word: בְּגוֹרָל
  choice: durch das Los
  rationale: Bewahrt das konkrete Verfahren der Landzuteilung.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens wird in Versalien beibehalten.
- source_word: לָתֵת
  choice: zu geben
  rationale: Gibt den Infinitiv aktiv und formal nah wieder, ohne das im Hebräischen nicht ausdrücklich genannte Subjekt der Übergabe zu ergänzen.
- source_word: תִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: den neun Stämmen und dem halben Stamm
  rationale: Bewahrt die auffällige biblische Zählweise und den Singular »Stamm« in der zweiten Wendung.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: der HERR
  alternative: Jahwe
  rationale: »der HERR« entspricht einer etablierten deutschsprachigen Bibelkonvention und kennzeichnet den Gottesnamen typografisch, ohne eine unsichere Ausspracheentscheidung in den Haupttext zu setzen.
- issue: Agens von »zu geben«
  choice: aktive Infinitivkonstruktion ohne ergänztes Objekt oder Agens
  alternative: »das den neun Stämmen und dem halben Stamm gegeben werden sollte«
  rationale: Die aktive Form wahrt die hebräische Syntax und lässt die im Kontext vorausgesetzte Ausführung der Landvergabe offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Formel לֵאמֹר wird idiomatisch durch einen Doppelpunkt wiedergegeben; unnötige Archaismen werden vermieden.
