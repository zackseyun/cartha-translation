lexical_decisions:
- source_word: וּלְמַטֵּה
  choice: Und für den Stamm
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang der Landverteilung einen Stamm, nicht den konkreten Stab; וּ und לְ werden natürlich mit „Und für“ wiedergegeben.
- source_word: בְנֵי נַפְתָּלִי
  choice: der Söhne Naftalis
  rationale: Die hebräische Wendung lautet wörtlich „Söhne Naftalis“ und dient als übliche Bezeichnung seiner Nachkommen beziehungsweise des Stammes.
- source_word: נָשִׂיא
  choice: ein Anführer
  rationale: Das Wort bezeichnet hier das bestellte Oberhaupt beziehungsweise den Vertreter des Stammes; „Anführer“ ist verständlich und vermeidet monarchische Anklänge von „Fürst“.
- source_word: פְּדַהְאֵל
  choice: Pedahel
  rationale: Der Eigenname wird nach üblicher deutscher biblischer Namensform wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die übliche patronymische Formel wird direkt als „Sohn“ wiedergegeben.
- source_word: עַמִּיהוּד
  choice: Ammihud
  rationale: Der Eigenname wird nach üblicher deutscher biblischer Namensform wiedergegeben.
