  yaml_path: translation/ot/numbers/034/028.yaml
  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
translation:
  language: de
  text: 'Und für den Stamm der Söhne Naftalis[a] ein Anführer: Pedahel, Sohn Ammihuds.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Söhne Naftalis“; dies ist eine übliche Stammesbezeichnung für die Nachkommen Naftalis.
