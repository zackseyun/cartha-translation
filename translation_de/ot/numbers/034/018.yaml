  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: de
  text: Und ihr sollt aus jedem Stamm je einen Stammesführer nehmen, um das Land als Erbbesitz zuzuteilen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: Stammesführer
  rationale: Das Wort bezeichnet einen anerkannten Führer oder Vorsteher. Im Zusammenhang der Landverteilung macht „Stammesführer“ seine administrative und repräsentative Funktion deutlich, ohne den königlichen Beiklang von „Fürst“.
- source_word: אֶחָד נָשִׂיא אֶחָד מִמַּטֶּה
  choice: aus jedem Stamm je einen Stammesführer
  rationale: Die Wiederholung von אֶחָד drückt distributiv aus, dass jeder Stamm genau einen Vertreter stellt. Die gewählte Formulierung gibt dies in natürlichem Deutsch wieder.
- source_word: מִמַּטֶּה
  choice: aus jedem Stamm
  rationale: מַטֶּה kann wörtlich „Stab“ bedeuten, bezeichnet hier aber eindeutig eine Stammesgruppe Israels.
- source_word: תִּקְחוּ
  choice: ihr sollt … nehmen
  rationale: Das Imperfekt hat hier anweisenden Charakter und richtet sich an mehrere Angesprochene.
- source_word: לִנְחֹל
  choice: damit sie … als Erbbesitz zuteilen
  rationale: Die Infinitivform von נחל steht hier im Hifil. Im unmittelbaren Zusammenhang sollen die ausgewählten Männer das Land den Israeliten als Erbbesitz zuweisen, nicht es lediglich selbst erben. Die explizite Mehrzahl „sie“ verdeutlicht den sachlich gemeinten Bezug auf die Stammesführer.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist das Israel als Erbbesitz zuzuweisende Land; „das Land“ ist dafür die natürliche und etablierte Wiedergabe.
theological_decisions:
- issue: Rolle der Stammesführer beim Erbbesitz
  choice: Die Führer teilen das Land als Erbbesitz zu.
  alternative: Die Führer erben das Land selbst.
  rationale: Die Hifil-Form לִנְחֹל und der Kontext von Numeri 34,17–29 sprechen für das Veranlassen beziehungsweise Zuweisen des Erbbesitzes. Die Übersetzung vermeidet daher den missverständlichen Eindruck, nur die genannten Führer würden das Land erben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stammesführer“ ist für den heutigen Leser präziser als „Fürst“. Die Konstruktion „aus jedem Stamm je einen“ bewahrt die distributive Betonung des Hebräischen, ohne dessen Wiederholung unnatürlich nachzubilden.
