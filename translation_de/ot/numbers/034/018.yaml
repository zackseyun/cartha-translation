review_pass:
  verdict: revise
  source_fidelity: Der hebräische Infinitiv לִנְחֹל steht hier im Hifil und bezeichnet im Kontext von Numeri 34 die Zuteilung des Landes als Erbbesitz. Die Wiedergabe „zuteilen“ ist daher sachgerecht, während „erben“ die Form und die administrative Funktion der ernannten Männer weniger genau träfe. „Aus jedem Stamm je einen Stammesführer“ gibt die distributive Wiederholung angemessen wieder.
  naturalness: „Damit sie das Land ... zuteilen“ ist verständlich, doch das im Hebräischen nicht eigens ausgedrückte Subjekt „sie“ kann ohne Verlust vermieden werden. Die Infinitivkonstruktion mit „um ... zuzuteilen“ ist im modernen Standarddeutsch unmittelbar, klar und nah am Satzbau der Vorlage.
  terminology: „Stammesführer“ ist eine natürliche, nicht monarchisch missverständliche Wiedergabe von נָשִׂיא. „Erbbesitz“ und „das Land“ passen zum landrechtlichen Kontext. Eine Fußnote, die die Hifil-Bedeutung als bloße mögliche Grundbedeutung behandelt und „Erben/Inbesitznehmen“ gleichrangig nahelegt, ist hier nicht erforderlich und könnte die durch Form und Kontext bestimmte Bedeutung verwischen.
  issues:
  - severity: low
    issue: Explizites Subjekt „sie“ in der Zweckangabe
    rationale: Das Hebräische formuliert die Zweckbestimmung infinitivisch, ohne an dieser Stelle ein Subjekt auszuweisen. Zwar legt der Kontext die Stammesführer nahe, aber „um das Land als Erbbesitz zuzuteilen“ ist enger am Wortlaut und stilistisch flüssiger.
  - severity: medium
    issue: Lexikalische Fußnote stellt eine im Kontext nicht gleichwertige Alternative heraus
    rationale: לִנְחֹל ist hier Hifil; zusammen mit Numeri 34,17–29 ist das Zuteilen/als Erbbesitz Zuweisen gemeint. Die Fußnote vermischt dies mit Qal-nahen Vorstellungen von Erben oder Inbesitznehmen und ist daher eher irreführend als hilfreich.
  revised_text: Und ihr sollt aus jedem Stamm je einen Stammesführer nehmen, um das Land als Erbbesitz zuzuteilen.
