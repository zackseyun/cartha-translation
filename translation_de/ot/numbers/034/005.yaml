  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: de
  text: Dann soll sich die Grenze von Azmon zum Bach Ägyptens[a] wenden, und ihr Endpunkt[b] soll am Meer liegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Wadi Ägyptens“. Das hebräische Wort נַחַל bezeichnet häufig einen saisonalen Wasserlauf oder ein Wadi.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen die Mehrzahl: „ihre Ausgänge“ beziehungsweise „ihre Endpunkte“. Gemeint ist das Ende der Grenzlinie.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: וְנָסַב
  choice: Dann wendet sich
  rationale: נסב bezeichnet hier die Richtungsänderung der Grenzlinie. Das Präsens ist in einer modernen deutschen Grenzbeschreibung natürlich; „Dann“ gibt die Abfolge der Grenzpunkte wieder.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: גְּבוּל bezeichnet in diesem Zusammenhang die territoriale Grenzlinie.
- source_word: מֵעַצְמוֹן
  choice: von Azmon
  rationale: Der Ortsname wird transliteriert; die Präposition מִן bezeichnet den Ausgangspunkt der Richtungsänderung.
- source_word: נַחְלָה מִצְרָיִם
  choice: zum Bach Ägyptens
  rationale: נַחַל kann einen Bach, ein saisonales Fließgewässer oder dessen Talbett bezeichnen. „Bach Ägyptens“ ist verständlich und vermeidet die mögliche Verwechslung mit dem Nil; die topografisch präzisere Alternative „Wadi Ägyptens“ steht in der Fußnote.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: und ihr Endpunkt liegt
  rationale: תּוֹצָאוֹת bezeichnet in Grenzbeschreibungen den Ausgang beziehungsweise Endpunkt einer Grenzlinie. Der deutsche Singular ist idiomatisch; die formale Mehrzahl des Hebräischen wird in der Fußnote kenntlich gemacht.
- source_word: הַיָּמָּה
  choice: am Meer
  rationale: Die Richtungsform bedeutet wörtlich „zum Meer hin“; zusammen mit dem Endpunkt der Grenze ergibt sich natürlich „am Meer“. Das Hebräische nennt das Meer hier nicht ausdrücklich Mittelmeer.
