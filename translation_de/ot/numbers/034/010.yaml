  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: de
  text: Dann sollt ihr für euch die Ostgrenze von Hazar-Enan bis Schefam abstecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dann sollt ihr für euch die Ostgrenze von Hazar-Enan in Richtung Schefam ziehen.« Das hier verwendete hebräische Verb ist ungewöhnlich und bezeichnet in diesem Zusammenhang das Markieren oder Ziehen einer Grenzlinie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: Dann sollt ihr … abstecken
  rationale: Das ungewöhnliche Verb bezeichnet in diesem Zusammenhang das Ziehen beziehungsweise Markieren einer Grenzlinie. »Abstecken« ist im Deutschen für die Festlegung eines Gebietsverlaufs natürlich und präzise.
- source_word: לָכֶם
  choice: für euch
  rationale: Die dativische Wendung bewahrt den benefaktiven Bezug auf die Israeliten, ohne im Deutschen eine unnatürlich starke Reflexivität zu erzeugen.
- source_word: לִגְבוּל קֵדְמָה
  choice: die Ostgrenze
  rationale: גְּבוּל bezeichnet hier die territoriale Grenze; קֵדְמָה bestimmt sie als östliche Seite. Die Zusammensetzung »Ostgrenze« ist knapp und idiomatisch.
- source_word: מֵחֲצַר עֵינָן
  choice: von Hazar-Enan
  rationale: Der Ortsname wird transliteriert und bezeichnet den Ausgangspunkt dieses Grenzabschnitts.
- source_word: שְׁפָמָה
  choice: bis Schefam
  rationale: Der Ortsname wird nach deutscher Lautkonvention transliteriert. Das hebräische Direktiv -ָה zeigt die Richtung auf Schefam zu an; im Zusammenhang einer Grenzlinie gibt »bis« den Zielpunkt natürlich wieder.
