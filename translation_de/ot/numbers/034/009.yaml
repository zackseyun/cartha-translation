  text: וְ/יָצָ֤א הַ/גְּבֻל֙ זִפְרֹ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו חֲצַ֣ר עֵינָ֑ן זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל צָפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: de
  text: Dann wird die Grenze bis Zifron verlaufen, und ihr Endpunkt wird Hazar-Enan sein.[a] Das soll eure Nordgrenze sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ihre Ausgänge werden Hazar-Enan sein.“ Im Hebräischen steht für das Ende der Grenzlinie eine Mehrzahlform.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: wird … verlaufen
  rationale: In Grenzbeschreibungen bezeichnet יצא den Verlauf beziehungsweise die Erstreckung einer Grenzlinie; „verlaufen“ ist dafür im Deutschen natürlich.
- source_word: הַגְּבֻל
  choice: die Grenze
  rationale: גְּבוּל bezeichnet hier die territoriale Grenzlinie.
- source_word: זִפְרֹנָה
  choice: bis Zifron
  rationale: Der Ortsname wird transliteriert; die Richtungsendung bezeichnet die Erstreckung bis zu beziehungsweise auf diesen Ort zu.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: und ihr Endpunkt wird … sein
  rationale: תוֹצָאוֹת bezeichnet in Grenztexten den Ausgang oder Endpunkt der Grenzlinie. Der deutsche Singular gibt den kollektiven Sinn idiomatisch wieder; die formale Mehrzahl wird in der Fußnote kenntlich gemacht.
- source_word: חֲצַר עֵינָן
  choice: Hazar-Enan
  rationale: Der zusammengesetzte Ortsname wird transliteriert und mit Bindestrich wiedergegeben.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: Das soll eure … sein
  rationale: Die Wendung fasst die zuvor beschriebene Linie als Israels festgelegte Grenze zusammen.
- source_word: גְּבֻל צָפוֹן
  choice: Nordgrenze
  rationale: Die Konstruktverbindung bezeichnet die Grenze an der Nordseite; „Nordgrenze“ ist prägnantes, natürliches Deutsch.
