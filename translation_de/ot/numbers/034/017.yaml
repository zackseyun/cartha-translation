id: NUM.34.17
reference: Numbers 34:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: de
  text: 'Das sind die Namen der Männer, die euch das Land als Erbbesitz zuteilen sollen: der Priester Eleasar und Josua, der Sohn Nuns.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die euch das Land als Erbbesitz geben sollen“ beziehungsweise „die dafür sorgen sollen, dass ihr das Land erbt“. Das hebräische Verb bezeichnet hier das Veranlassen oder Zuteilen eines Erbbesitzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Das sind die Namen
  rationale: Die verblos formulierte hebräische Identifikation wird im Deutschen natürlich mit „sind“ wiedergegeben.
- source_word: הָאֲנָשִׁים
  choice: der Männer
  rationale: Das maskuline Pluralwort bezeichnet hier die ausdrücklich genannten männlichen Amtsträger.
- source_word: אֲשֶׁר יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: die euch das Land als Erbbesitz zuteilen sollen
  rationale: 'Die Hifil-Form von נחל hat hier einen veranlassenden beziehungsweise administrativen Sinn: Die Männer sorgen dafür, dass Israel das Land als Erbbesitz erhält. „zuteilen“ passt zum Kontext der Landverteilung und „als Erbbesitz“ bewahrt den Erbwortlaut.'
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: der Priester Eleasar
  rationale: Diese im Deutschen natürliche Stellung bewahrt Name und Amtsbezeichnung.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: und Josua, der Sohn Nuns
  rationale: Die Namensformen entsprechen dem üblichen deutschen Bibelgebrauch; der Beiname wird klar und würdig wiedergegeben.
theological_decisions:
- issue: Rolle der genannten Männer bei der Landvergabe
  choice: Sie teilen Israel das Land als Erbbesitz zu.
  alternative: Sie geben Israel das Land als Erbbesitz beziehungsweise lassen Israel es erben.
  rationale: Die Übersetzung hält fest, dass Eleasar und Josua die Zuteilung verwalten, ohne sie als Ursprung oder eigentliche Geber des verheißenen Landes darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbbesitz“ erhält den sachlichen und theologischen Zusammenhang des hebräischen Erbwortfeldes; „zuteilen“ macht die administrative Aufgabe der genannten Männer verständlich.
