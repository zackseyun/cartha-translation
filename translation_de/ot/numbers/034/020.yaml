  text: וּ/לְ/מַטֵּה֙ בְּנֵ֣י שִׁמְע֔וֹן שְׁמוּאֵ֖ל בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: de
  text: 'und für den Stamm der Söhne Simeons: Samuel, Sohn Ammihuds.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: und für den Stamm
  rationale: In diesem Zusammenhang der Landzuteilung bezeichnet מַטֶּה eine Stammesgemeinschaft, nicht wörtlich einen Stab oder Zweig. Konjunktion und Präposition werden zusammen natürlich mit „und für“ wiedergegeben.
- source_word: בְּנֵי
  choice: der Nachkommen
  rationale: Wörtlich steht „Söhne“. In der Stammesbezeichnung sind jedoch die Angehörigen beziehungsweise Nachkommen Simeons gemeint; „Nachkommen“ ist im modernen Deutschen klar und natürlich.
- source_word: שִׁמְעוֹן
  choice: Simeons
  rationale: Die etablierte deutsche Namensform wird in der durch den Genitiv bestimmten Stammesformel verwendet.
- source_word: שְׁמוּאֵל
  choice: Schemuël
  rationale: Die Umschrift folgt der hebräischen Namensform שְׁמוּאֵל und unterscheidet sie bewusst von der im Deutschen traditionell gebräuchlichen Form „Samuel“.
- source_word: בֶּן
  choice: der Sohn
  rationale: בֶּן bezeichnet in dieser Personenliste unmittelbar den Sohn; die Wiedergabe ist eindeutig und idiomatisch.
- source_word: עַמִּיהוּד
  choice: Ammihuds
  rationale: Der Personenname wird in der üblichen deutschen Umschrift wiedergegeben und nach „Sohn“ idiomatisch in den Genitiv gesetzt.
