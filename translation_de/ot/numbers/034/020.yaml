  naturalness: Die knappe, listenartige Form mit Doppelpunkt ist natürlich und dem Kontext angemessen. „Samuel, Sohn Ammihuds“ ist idiomatischer und prägnanter als „Samuel, der Sohn Ammihuds“.
  terminology: „Stamm“ ist im Kontext von מַטֶּה korrekt. „Söhne Simeons“ bewahrt die formelhafte hebräische Stammesbezeichnung; „Samuel“ folgt der modernen deutschen Standardnamensform. „Ammihud“ ist als Umschrift angemessen.
