  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: de
  text: Und sie luden das Volk zu den Opfern ihrer Götter ein, und das Volk aß und warf sich vor ihren Göttern nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „betete ihre Götter an“. Das hebräische Verb bezeichnet wörtlich das Sich-Niederwerfen, häufig als Ausdruck der Anbetung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: sie luden … ein
  rationale: Das Qal Wayyiqtol 3. Person feminin Plural von קרא bezeichnet mit לְ bei Personen hier idiomatisch eine Einladung. Das feminine Subjekt sind die im vorherigen Vers genannten moabitischen Frauen.
- source_word: לָעָם
  choice: das Volk
  rationale: Gibt den bestimmten Ausdruck עָם wieder, ohne das im Kontext erkennbare Israel ausdrücklich in den Text einzufügen.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: zu den Opfermahlzeiten ihrer Götter
  rationale: זֶבַח kann das Schlachtopfer und im Zusammenhang mit dem anschließenden Essen auch das damit verbundene Opfermahl bezeichnen. „Opfermahlzeiten“ macht den narrativen Zusammenhang im Deutschen natürlich verständlich.
- source_word: וַיֹּאכַל
  choice: Das Volk aß
  rationale: Der hebräische Kollektivsingular wird im Deutschen natürlich mit dem singularischen „Volk“ verbunden.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: warf sich … nieder
  rationale: Die Form bezeichnet die körperliche Niederwerfung, häufig als Kulthandlung. Diese konkrete Bedeutung bleibt erhalten, statt sie ausschließlich als „anbeten“ auszulegen.
- source_word: לֵאלֹהֵיהֶן
  choice: vor ihren Göttern
  rationale: לְ kennzeichnet nach השתחוה das Ziel der Huldigung. „Vor“ ist bei der deutschen Wendung „sich niederwerfen“ idiomatisch und bezeichnet die Ausrichtung auf die Götter.
theological_decisions:
- issue: Wiedergabe der götzendienerischen Handlung וַיִּשְׁתַּחֲווּ
  choice: warf sich vor ihren Göttern nieder
  alternative: betete ihre Götter an
  rationale: Die konkrete körperliche Handlung wird bewahrt, während der kultische Sinn durch den Kontext deutlich wird. Die Fußnote nennt die mögliche sinngemäße Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Opfermahlzeiten“ verdeutlicht den Zusammenhang zwischen den Opfern und dem anschließenden Essen; „warf sich … nieder“ bewahrt die konkrete Bildlichkeit des Hebräischen.
