base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: de
  text: Er ging dem Israeliten in die Kammer[a] nach und durchbohrte sie beide – den Israeliten und die Frau – bis in ihren Bauch[b]. Da wurde die Plage unter den Söhnen Israels aufgehalten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den abgetrennten Innenraum“, „in die Zeltkammer“ oder „in den Pavillon“. Das seltene hebräische Wort bezeichnet einen inneren beziehungsweise abgetrennten Raum.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis in ihren Unterleib“ oder „bis in ihre Bauchhöhle“. Das hebräische Wort bezeichnet den Bauch oder die Bauchhöhle.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „von/weg über den Söhnen Israels“. „Söhne Israels“ ist eine feste Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: die Kammer
  rationale: Das seltene Substantiv bezeichnet einen abgetrennten Innenraum. „Kammer“ wahrt die lexikalische Unbestimmtheit, ohne ausdrücklich ein Zelt oder eine bestimmte Bauform vorauszusetzen.
- source_word: וַיִּדְקֹר
  choice: durchbohrte
  rationale: „Durchbohrte“ gibt den gewaltsamen, eindringenden Stoß von דקר konkret wieder und passt dazu, dass beide Personen getroffen werden.
- source_word: שְׁנֵיהֶם
  choice: sie beide
  rationale: Die Form bezeichnet ausdrücklich beide Personen und wird im folgenden Zusatz näher bestimmt.
- source_word: אֶל קֳבָתָהּ
  choice: durch ihren Unterleib
  rationale: קֳבָה bezeichnet den Bauch beziehungsweise die Bauchhöhle. „Unterleib“ ist im Deutschen konkret und würdevoll; die Präposition wird im Zusammenhang mit „durchbohrte“ idiomatisch als „durch“ wiedergegeben.
- source_word: וַתֵּעָצַר
  choice: wurde abgewendet
  rationale: Der Nifal drückt aus, dass die Plage aufgehalten wurde. „Wurde abgewendet“ bewahrt den passiven Ergebnissinn und verbindet sich im Deutschen natürlich mit מֵעַל.
- source_word: הַמַּגֵּפָה
  choice: die Plage
  rationale: „Plage“ ist in diesem Gerichtskontext die geläufige und sachlich passende Wiedergabe von מַגֵּפָה.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: von den Söhnen Israels
  rationale: Die Verbindung bewahrt mit „von“ die Bedeutung von מֵעַל und gibt בְּנֵי יִשְׂרָאֵל formal als „Söhne Israels“ wieder.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: der israelitische Mann
  rationale: Die Wiedergabe bewahrt sowohl die ausdrückliche männliche Personenbezeichnung אִישׁ als auch seine Zugehörigkeit zu Israel.
theological_decisions:
- issue: Korporative Geschlechtsbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die traditionelle Bundesbezeichnung wird ihrer hebräischen Form entsprechend wiedergegeben. Eine Fußnote stellt klar, dass damit hier das Volk Israel als Ganzes gemeint ist.
- issue: Konkrete anatomische Einzelheit im Gerichtsgeschehen
  choice: durch ihren Unterleib
  alternative: durch ihren Bauch / in ihre Bauchhöhle
  rationale: Die körperliche Einzelheit des hebräischen Textes wird weder abgeschwächt noch ausgeschmückt. „Unterleib“ gibt den bezeichneten Bereich in natürlichem, würdevollem Deutsch wieder.
- issue: Agens der aufgehaltenen Plage
  choice: 'Passiv: „wurde ... abgewendet“'
  alternative: „hörte ... auf“
  rationale: Das Passiv wahrt die Form des hebräischen Nifal und benennt kein im Vers unausgesprochenes Agens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Satzbau und Bildlichkeit des Hebräischen. Das seltene Raumwort und die anatomische Bezeichnung werden im Haupttext verständlich wiedergegeben, während die Fußnoten ihre lexikalische Spannweite offenhalten. Die Gewalt wird konkret, aber ohne zusätzliche Drastik dargestellt.
