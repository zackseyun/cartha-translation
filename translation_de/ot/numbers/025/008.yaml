revisions:
- from: Er folgte dem israelitischen Mann in die Kammer[a] und durchbohrte sie beide, den israelitischen Mann und die Frau, durch ihren Unterleib[b]. Da wurde die Plage von den Söhnen Israels abgewendet[c].
  to: Er ging dem Israeliten in die Kammer[a] nach und durchbohrte sie beide – den Israeliten und die Frau – bis in ihren Bauch[b]. Da wurde die Plage unter den Söhnen Israels aufgehalten[c].
  rationale: Die Revision ersetzt das ungenau resultative „abgewendet“ durch „aufgehalten“, das den Nifal von עצר und den Kontext einer laufenden Plage besser abbildet. „Dem Israeliten ... nachgehen“ ist eine natürliche deutsche Entsprechung für die Verfolgungsbewegung hinter dem Mann her. Die Formulierung „bis in ihren Bauch“ erhält die konkrete Richtungs- und Körperangabe אֶל קֳבָתָהּ, ohne eine über das Hebräische hinausgehende anatomische Deutung vorzunehmen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:12:02Z'
