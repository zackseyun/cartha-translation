  text: וְ/שֵׁ֨ם הָֽ/אִשָּׁ֧ה הַ/מֻּכָּ֛ה הַ/מִּדְיָנִ֖ית כָּזְבִּ֣י בַת צ֑וּר רֹ֣אשׁ אֻמּ֥וֹת בֵּֽית אָ֛ב בְּ/מִדְיָ֖ן הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: de
  text: Und die getötete Midianiterin hieß Kosbi, die Tochter Zurs[a]. Er war das Oberhaupt der Sippen eines Vaterhauses in Midian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Zur, nicht Kosbi.
    reason: Die maskuline Form des hebräischen Pronomens zeigt, dass sich der folgende Satz auf Zur bezieht.
  - marker: b
    text: „Vaterhaus“ bezeichnet eine Großfamilie beziehungsweise einen angestammten Familienverband. Das mit „Sippen“ wiedergegebene hebräische Wort kann auch „Völker“ bedeuten.
    reason: Erläutert den kulturellen Verwandtschaftsbegriff und bewahrt die lexikalische Alternative von אֻמּוֹת.
lexical_decisions:
- source_word: וְשֵׁם
  choice: Und … hieß
  rationale: Die deutsche Namensformel mit „hieß“ gibt „und der Name … war“ natürlich wieder und bewahrt durch „Und“ die Verknüpfung mit dem vorherigen Vers.
- source_word: הָאִשָּׁה הַמֻּכָּה הַמִּדְיָנִית
  choice: die getötete Midianiterin
  rationale: Das passive Partizip von נכה bezeichnet hier aufgrund des unmittelbaren Kontextes die getötete beziehungsweise erschlagene Frau; „getötet“ ist im heutigen Deutsch klar und würdig.
- source_word: כָּזְבִּי
  choice: Kosbi
  rationale: Die Schreibung folgt einer üblichen deutschen Transliteration des hebräischen Namens.
- source_word: בַת צ֑וּר
  choice: die Tochter Zurs
  rationale: Die hebräische Status-constructus-Verbindung wird mit einer natürlichen deutschen Genitivfügung wiedergegeben.
- source_word: רֹאשׁ
  choice: das Oberhaupt
  rationale: רֹאשׁ bezeichnet hier einen führenden Mann; „Oberhaupt“ bewahrt die Leitungsbedeutung und passt zum verwandtschaftlich-sozialen Zusammenhang.
- source_word: אֻמּוֹת
  choice: Sippen
  rationale: Obwohl das Wort auch „Völker“ bedeuten kann, legt die Verbindung mit בֵּית אָב hier verwandtschaftlich organisierte Gruppen nahe. Eine Fußnote erhält die lexikalische Alternative.
- source_word: בֵּית אָב
  choice: Vaterhaus
  rationale: Der technische hebräische Verwandtschaftsbegriff wird knapp und relativ formal wiedergegeben; eine Fußnote erläutert seine Bedeutung.
- source_word: בְּמִדְיָן
  choice: in Midian
  rationale: Die Präposition wird in diesem Zusammenhang am natürlichsten lokal beziehungsweise sozialräumlich verstanden.
- source_word: הוּא
  choice: Er war
  rationale: Das selbstständige Pronomen nimmt Zur wieder auf. Ein neuer Satz macht diesen Bezug im Deutschen eindeutig, ohne die Aussage inhaltlich zu erweitern.
