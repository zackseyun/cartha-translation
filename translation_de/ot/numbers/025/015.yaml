  terminology: '„Kosbi“, „Zur“, „Midianiterin“, „Oberhaupt“ und „Vaterhaus“ sind passende deutsche Wiedergaben. „Sippen“ ist als kontextuelle Wiedergabe von אֻמּוֹת vertretbar; die Fußnote bewahrt sachgerecht die mögliche Bedeutung „Völker“. Die Marker sind sinnvoll verankert: [a] beim Bezugspunkt Zur und [b] bei der Aussage, die „Sippen“ und „Vaterhaus“ betrifft.'
