lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Waw-Konsekutiv führt ein neues Erzählereignis ein; „sprach“ gibt die formelhafte göttliche Rede würdig und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel für die folgende direkte Rede wird im modernen Deutschen idiomatisch durch einen Doppelpunkt ausgedrückt; ein zusätzliches „und sagte“ wäre unnötig schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Eröffnung bleibt erhalten, während לֵאמֹר entsprechend deutscher Erzählkonvention durch den Doppelpunkt wiedergegeben wird.
