  language: de
  text: 'Dann redete Jahwe zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben, alternativ als „Jahwe“ transkribiert.
