lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann redete
  rationale: Das wayyiqtol führt die Erzählung zeitlich weiter; „Dann“ gibt diese Abfolge in natürlichem Deutsch wieder, während „redete“ דבר angemessen und würdevoll wiedergibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in seiner im Deutschen gebräuchlichen wissenschaftlichen Umschrift wiedergegeben, statt durch einen Titel ersetzt zu werden.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet hier den Adressaten des Redens; im Deutschen lautet die natürliche Verbindung „zu Mose reden“.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Dies ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die Infinitivformel führt den Inhalt der folgenden direkten Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als das formelhafte „und sprach“ oder „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Doppelpunkt bildet die hebräische Redeeinleitungsformel idiomatisch ab und verweist auf den in Vers 11 folgenden Redeinhalt.
