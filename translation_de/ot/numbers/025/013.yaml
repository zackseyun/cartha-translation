id: NUM.25.13
reference: Numbers 25:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: de
  text: Und ihm und seinen Nachkommen nach ihm soll der Bund eines immerwährenden Priestertums gehören,[a] weil er für seinen Gott geeifert[b] und für die Söhne Israels Sühne erwirkt hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Bund eines ewigen Priestertums“.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Verb kann sowohl Eifer als auch Eifersucht im Einsatz für Gottes Ehre ausdrücken.
    reason: lexical_alternative
  - marker: c
    text: „Söhne Israels“ ist die traditionelle hebräische Bezeichnung für das Volk Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: Und ihm und seinen Nachkommen nach ihm soll ... gehören
  rationale: Die Formulierung gibt die zugesprochene, bleibende Bundesverheißung natürlich wieder. „Nachkommen“ vermittelt den kollektiven Sinn von זֶרַע im Deutschen verständlicher als das wörtliche „Same“; „nach ihm“ bewahrt den Gedanken der Nachfolge.
- source_word: בְּרִית
  choice: Bund
  rationale: „Bund“ ist die sachlich und theologisch angemessene Standardwiedergabe für בְּרִית in einer göttlichen Zusage.
- source_word: כְּהֻנַּת עוֹלָם
  choice: eines immerwährenden Priestertums
  rationale: „Immerwährend“ bezeichnet die fortdauernde institutionelle Geltung, ohne עוֹלָם unnötig als philosophisch-abstrakte Ewigkeit festzulegen.
- source_word: תַּחַת אֲשֶׁר
  choice: weil
  rationale: Die Wendung führt hier den Grund für die Bundeszusage ein; „weil“ ist knapp und idiomatisch.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: für seinen Gott geeifert
  rationale: „Eifern für“ ist im Deutschen natürlich und kann den leidenschaftlichen Einsatz für Gottes Ehre ausdrücken. Die ebenfalls mögliche Nuance der Eifersucht wird in der Fußnote bewahrt.
- source_word: וַיְכַפֵּר
  choice: Sühne erwirkt hat
  rationale: Die Wiedergabe bezeichnet verständlich die sühnende Wirkung der Handlung. Sie vermeidet die mögliche Fehlvorstellung, Pinhas habe hier selbst ein reguläres Opfer dargebracht.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: für die Söhne Israels
  rationale: Die traditionelle nationale Bezeichnung wird entsprechend der grammatisch maskulinen Ausgangsform beibehalten; eine Fußnote erläutert ihren kollektiven Bezug.
theological_decisions:
- issue: Bedeutung von קנא im Blick auf die Handlung des Pinhas
  choice: für seinen Gott geeifert
  alternative: für seinen Gott eifersüchtig gewesen / in Eifersucht für seinen Gott eingetreten
  rationale: Das hebräische Verb umfasst Eifer und bundestheologisch geprägte Eifersucht. Der Haupttext verwendet das im Deutschen verständlichere „geeifert“, während die Fußnote die echte Bedeutungsbreite offenhält.
- issue: Tragweite von עוֹלָם in der Priestertumsverheißung
  choice: immerwährendes Priestertum
  alternative: ewiges Priestertum
  rationale: „Immerwährend“ bewahrt den Gedanken dauerhafter Fortgeltung, ohne eine über den Kontext hinausgehende metaphysische Aussage zu erzwingen.
- issue: Referenz von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Volk Israel / Israeliten
  rationale: Die maskuline Form und die traditionelle Abstammungsbezeichnung bleiben sichtbar; zugleich erklärt die Fußnote, dass die Gesamtgemeinschaft Israels gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die Bundeszusage im Vordergrund; kultische Fachsprache wird nur dort verwendet, wo sie für den Sinn erforderlich ist. Alle Mehrdeutigkeiten von קנא und עוֹלָם werden knapp durch Fußnoten bewahrt.
