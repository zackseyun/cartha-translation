  source_fidelity: 'Der Entwurf gibt alle tragenden Elemente des Hebräischen zuverlässig wieder: die Zuwendung an Pinhas und seine Nachkommenschaft, den Bund eines dauerhaften Priestertums, die begründende Wendung תַּחַת אֲשֶׁר, den Eifer für Gott und die Sühne zugunsten der Söhne Israels. „Sühne erwirkt“ ist für וַיְכַפֵּר sachlich angemessen und behauptet keine bestimmte kultische Handlung, die der Vers nicht ausdrücklich benennt.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Formulierung „ihm und seinen Nachkommen nach ihm“ ist leicht bibelnah, bleibt aber verständlich und gibt die ausdrücklich markierte Nachfolge wieder. „Für seinen Gott geeifert“ ist idiomatisch und dem Register angemessen.
  terminology: „Bund“, „immerwährendes Priestertum“ und „Sühne“ sind terminologisch treffend. Die Fußnoten bewahren die relevante Spannweite von עוֹלָם und קנא. „Söhne Israels“ folgt der hebräischen Nationalbezeichnung und wird zutreffend erläutert.
