id: NUM.25.4
reference: Numbers 25:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose[a]: »Nimm alle Anführer des Volkes und pfähle sie für Jahwe am helllichten Tag[b], damit sich Jahwes glühender Zorn von Israel abwendet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nimm alle Anführer des Volkes und lass sie die Schuldigen vor Jahwe am helllichten Tag hinrichten.« Das hebräische Pronomen »sie« bezieht sich grammatisch am unmittelbarsten auf die Anführer; manche verstehen die Anführer jedoch als diejenigen, die das Urteil vollstrecken sollen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »vor der Sonne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קַח
  choice: Nimm
  rationale: Die direkte Imperativform gibt Moses Auftrag natürlich und quellennah wieder.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: alle Anführer des Volkes
  rationale: רָאשֵׁי bezeichnet hier die führenden Personen; »Anführer« wahrt den Sinn, ohne im Deutschen das missverständliche wörtliche »Köpfe« zu verwenden.
- source_word: וְהוֹקַע אֹתָם
  choice: und pfähle sie
  rationale: Die Hifil-Form von יקע bezeichnet eine öffentliche, exemplarische Hinrichtung beziehungsweise Zurschaustellung; »pfählen« wahrt die Härte und Konkretheit, während der Bezug des Pronomens in einer Fußnote als strittig ausgewiesen wird.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier am ehesten die Ausrichtung beziehungsweise Widmung der Strafhandlung auf Jahwe; »für« vermeidet die unzutreffende Gleichsetzung mit לִפְנֵי, »vor«.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: am helllichten Tag
  rationale: Die wörtliche Wendung »vor der Sonne« meint eine offene, öffentliche Vollstreckung im Tageslicht.
- source_word: וְיָשֹׁב
  choice: damit sich … abwendet
  rationale: Nach dem Imperativ drückt die Verbform Zweck beziehungsweise beabsichtigte Folge aus.
- source_word: חֲרוֹן אַף יְהוָה
  choice: Jahwes glühender Zorn
  rationale: »Glühender Zorn« bewahrt das hebräische Bild intensiver, brennender Erregung und klingt zugleich natürlich.
- source_word: מִיִּשְׂרָאֵל
  choice: von Israel
  rationale: Die Präposition מן bezeichnet die Trennung; zusammen mit »sich abwendet« ergibt sich eine natürliche deutsche Formulierung.
theological_decisions:
- issue: Bezugswort von אֹתָם (»sie«)
  choice: Das Pronomen bezieht sich im Haupttext syntaktisch auf »alle Anführer des Volkes«.
  alternative: Mose soll die Anführer versammeln und sie die schuldigen Männer vor Jahwe öffentlich hinrichten lassen.
  rationale: Der nächstliegende grammatische Bezug sind die Anführer. Vers 5 lässt jedoch die Richter die Baal-Peor-Verehrer töten und ermöglicht daher eine andere Deutung. Diese echte Spannung wird nicht stillschweigend aufgelöst, sondern in Fußnote [a] bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Anführer« ist klarer als das wörtliche »Köpfe«. »Am helllichten Tag« gibt das hebräische Idiom natürlich wieder; die wörtliche Form bleibt in der Fußnote erhalten. Die brutale Konkretheit von »pfählen« und die syntaktisch-narrative Mehrdeutigkeit werden nicht abgeschwächt.
