base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: de
  text: Während Israel in Schittim blieb, begann das Volk, mit den Töchtern Moabs Hurerei zu treiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begann das Volk, mit den Töchtern Moabs sexuelle Unmoral zu begehen“; hebräisch wörtlich: „begann das Volk, mit den Töchtern Moabs Hurerei zu treiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann sitzen, wohnen, bleiben oder sich aufhalten bedeuten. Im Zusammenhang des israelitischen Lagers gibt „blieb“ den vorübergehenden Aufenthalt natürlich wieder, ohne eine dauerhafte Ansiedlung anzudeuten.
- source_word: בַּשִּׁטִּים
  choice: in Schittim
  rationale: Der Ortsname wird in seiner etablierten deutschen Form „Schittim“ wiedergegeben; die Präposition ב wird hier natürlich mit „in“ übersetzt.
- source_word: וַיָּחֶל
  choice: begann
  rationale: Die Verbform bezeichnet hier idiomatisch den Beginn einer Handlung; „begann“ ist klar und formnah.
- source_word: הָעָם
  choice: das Volk
  rationale: הָעָם bezeichnet Israel kollektiv. „Das Volk“ wahrt diesen Bezug und entspricht dem singularischen Kollektiv im Hebräischen.
- source_word: לִזְנוֹת
  choice: Hurerei zu treiben
  rationale: זנה bezeichnet unerlaubte sexuelle Beziehungen und trägt die scharfe Bildsprache des Hurens beziehungsweise der Prostitution. „Hurerei treiben“ bewahrt diese Stärke besser als das allgemeinere „sexuelle Unmoral begehen“, ohne zwingend einen geschäftsmäßigen Vorgang zu behaupten.
- source_word: אֶל
  choice: mit
  rationale: אֶל bedeutet grundsätzlich „zu“ oder „hin zu“, bezeichnet in Verbindung mit זנה und Personen hier jedoch idiomatisch die Beteiligten der sexuellen Beziehungen; im Deutschen ist „mit“ sachgerecht.
- source_word: בְּנוֹת מוֹאָב
  choice: die Töchter Moabs
  rationale: Die formnahe Wendung bewahrt das hebräische Bild und ist im Deutschen verständlich; „moabitische Frauen“ wäre eine dynamischere Alternative.
theological_decisions:
- issue: Art der Sünde Israels im Eröffnungssatz
  choice: Die sexuelle Verfehlung mit der ausdrücklichen Sprache der Hurerei wiedergeben.
  alternative: „Das Volk begann, mit den Töchtern Moabs sexuelle Unmoral zu begehen.“
  rationale: Das Verb זנה ist anschaulicher und schärfer als eine allgemeine moralische Umschreibung. Die gewählte Fassung wahrt die sexuelle und mögliche bundesbezogene Konnotation, ohne eine über den Vers hinausgehende Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einer bewusst kräftigen, leicht biblisch geprägten Wendung für זנה. Der Ortsname erscheint in der etablierten deutschen Form „Schittim“. Der Fußnotenmarker steht unmittelbar bei der erläuterungsbedürftigen Wendung.
