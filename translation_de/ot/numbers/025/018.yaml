  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: de
  text: Denn sie sind euch feindlich gesinnt; mit ihren Machenschaften[b] haben sie euch getäuscht – in der Sache mit Peor[a] und in der Sache mit Kosbi, der Tochter eines Anführers von Midian, ihrer Schwester[c], die am Tag der Plage wegen der Sache mit Peor erschlagen wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peor bezieht sich auf den zuvor in diesem Kapitel geschilderten Vorfall um Baal-Peor.
    reason: cross_reference
  - marker: b
    text: 'Auch: „durch ihre listigen Anschläge“ oder „durch ihre Heimtücke“.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich „ihre Schwester“; gemeint sein kann auch eine Frau aus ihrem eigenen Volk oder ihrer Sippe.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: sie sind euch feind
  rationale: Das Partizip bezeichnet eine fortdauernde feindselige Haltung. „Sie sind euch feind“ gibt die prädikative Aussage knapp und idiomatisch wieder, ohne sie auf militärische Gegnerschaft einzuengen.
- source_word: בְּנִכְלֵיהֶם
  choice: durch ihre Ränke
  rationale: Das Substantiv bezeichnet listige, täuschende Machenschaften; „durch“ bildet das instrumentale ב ab. „Ränke“ wahrt den feindseligen und planvollen Charakter.
- source_word: נִכְּלוּ
  choice: haben euch überlistet
  rationale: Das mit dem vorangehenden Substantiv verwandte Verb beschreibt listiges beziehungsweise täuschendes Vorgehen gegen Israel. „Überlistet“ ist im Deutschen natürlich und hält die Zielrichtung gegen die Angeredeten fest.
- source_word: עַל דְּבַר פְּעוֹר
  choice: in der Sache mit Peor / wegen der Sache mit Peor
  rationale: Die Wendung kann sowohl einen sachlichen Bezug als auch einen ursächlichen Zusammenhang ausdrücken. Beim ersten Vorkommen steht die Angelegenheit im Vordergrund, beim letzten der Anlass der Plage.
- source_word: כָּזְבִּי
  choice: Kosbi
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: Tochter eines Anführers von Midian
  rationale: נָשִׂיא bezeichnet einen führenden beziehungsweise ranghohen Mann. „Anführer“ ist verständlich und vermeidet die möglicherweise irreführende dynastische Bedeutung von „Fürst“.
- source_word: אֲחֹתָם
  choice: ihre Schwester
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten. Ob eine leibliche Schwester oder allgemeiner eine Angehörige ihres Volkes beziehungsweise ihrer Sippe gemeint ist, wird nicht im Haupttext entschieden.
- source_word: הַמֻּכָּה
  choice: die ... erschlagen wurde
  rationale: Das passive Partizip von נכה bewahrt das Bild des Niederschlagens und macht im Kontext den tödlichen Ausgang deutlich.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: am Tag der Plage
  rationale: Die konkrete Zeitangabe wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezug von „Peor“
  choice: „Peor“ bleibt als Eigenname im Haupttext stehen.
  alternative: „Baal-Peor“ als erklärende Erweiterung
  rationale: Im hebräischen Text steht lediglich „Peor“. Eine Erweiterung zu „Baal-Peor“ wäre sachlich erklärend, ginge aber über den Wortlaut hinaus.
- issue: Bedeutungsnuance der wiederholten Wendung עַל דְּבַר פְּעוֹר
  choice: Zuerst „in der Sache mit Peor“, zuletzt „wegen der Sache mit Peor“.
  alternative: An beiden Stellen dieselbe deutsche Formulierung
  rationale: Die erste Stelle bezeichnet den Zusammenhang, in dem die Überlistung geschah; die zweite benennt den Anlass der Plage. Die unterschiedliche Wiedergabe wahrt die kontextuelle Spannung derselben hebräischen Wendung.
- issue: Bedeutung von „ihre Schwester“
  choice: Die wörtliche Formulierung bleibt im Haupttext erhalten.
  alternative: „ihre Stammesgenossin“ oder „eine Frau aus ihrem Volk“
  rationale: Der Text lässt offen, ob eine engere Verwandtschaft oder die Zugehörigkeit zur eigenen Volks- beziehungsweise Sippengruppe gemeint ist; die Fußnote weist auf diese Möglichkeit hin, ohne sie festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Gedankengang, wird aber durch Gedankenstrich und Perfekt natürlich lesbar. „Ränke“ ist leicht gehoben, jedoch allgemein verständlich und dem ernsten Register angemessen.
