source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: de
  text: Als Pinhas, der Sohn Eleasars und Enkel Aarons, des Priesters, das sah[a], erhob er sich aus der Mitte der Gemeinde[b] und nahm einen Speer in die Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sah“; der Gegenstand des Sehens ergibt sich aus dem vorhergehenden Zusammenhang. Auch möglich: „dies sah“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „aus der Mitte der Gemeinde“ oder „aus der Versammlung heraus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: das sah
  rationale: Das hebräische Verb bedeutet schlicht „sah“; sein Objekt ergibt sich aus dem vorhergehenden Vers. Das deutsche „das“ macht diesen Bezug idiomatisch deutlich, ohne den Gegenstand näher auszudeuten.
- source_word: פִּינְחָס
  choice: Pinhas
  rationale: Gebräuchliche deutsche Umschrift des Personennamens.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: ein Sohn Eleasars und Enkel des Priesters Aaron
  rationale: Die natürliche deutsche Wiedergabe macht die im Hebräischen durch zweimaliges בֶּן ausgedrückte Abstammungsfolge verständlich. „Priester“ wird ausdrücklich auf Aaron bezogen; „Hohepriester“ wird nicht ergänzt.
- source_word: וַיָּקָם
  choice: stand … auf
  rationale: Die Wendung gibt das Aufstehen als Beginn entschlossenen Handelns wieder, ohne die Intensität über den hebräischen Wortlaut hinaus zu steigern.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: inmitten der Gemeinde
  rationale: תּוֹךְ bezeichnet die Mitte beziehungsweise das Innere, und עֵדָה die versammelte Gemeinschaft Israels. Die Formulierung ist im Deutschen natürlich und bewahrt das räumlich-korporative Bild.
- source_word: וַיִּקַּח
  choice: und nahm
  rationale: Das häufige Verb bezeichnet hier schlicht das Nehmen; eine stärkere Wiedergabe wie „ergriff“ oder „packte“ wäre nicht zwingend.
- source_word: רֹמַח
  choice: einen Speer
  rationale: רֹמַח bezeichnet eine Speer- oder Lanzenwaffe; „Speer“ ist die klare und allgemein verständliche deutsche Entsprechung.
- source_word: בְּיָדוֹ
  choice: in die Hand
  rationale: Im Zusammenhang mit „nahm“ verlangt natürliches Deutsch die Richtungsangabe „in die Hand“, während der hebräische Ausdruck wörtlicher „in seiner Hand“ lautet.
theological_decisions:
- issue: Wiedergabe von הָעֵדָה
  choice: Gemeinde
  alternative: Versammlung; Gemeinschaft
  rationale: „Gemeinde“ bezeichnet hier die versammelte Gemeinschaft Israels und wahrt den korporativen Sinn des Pentateuchs, ohne eine spätere kirchliche Organisationsform vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte hebräische Abstammungsformel wird zur besseren Verständlichkeit mit „Sohn … und Enkel …“ wiedergegeben; der knappe, handlungsorientierte Erzählstil bleibt erhalten.
