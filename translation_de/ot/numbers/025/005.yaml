base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: de
  text: 'Und Mose sagte zu den Richtern Israels: „Jeder von euch soll jeweils seine Männer töten, die sich dem Baal von Peor angeschlossen haben.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Tötet, jeder seine Männer, die sich dem Baal von Peor angeschlossen haben.“ Die genaue Art der Zuordnung in „seine Männer“ wird im Hebräischen nicht näher bestimmt. Statt „Baal von Peor“ ist auch die traditionelle Namensform „Baal-Peor“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: Richter
  rationale: Das Substantiv bezeichnet hier Männer mit richterlicher beziehungsweise leitender Amtsgewalt in Israel; „Richter“ gibt die Funktion unmittelbar wieder.
- source_word: הִרְגוּ
  choice: soll ... töten
  rationale: Der pluralische Imperativ ist ein direkter Befehl. „Soll ... töten“ gibt dessen Verbindlichkeit in natürlichem Deutsch wieder, ohne die im Verb selbst nicht ausdrücklich enthaltene juristische Nuance von „hinrichten“ einzutragen.
- source_word: אִישׁ אֲנָשָׁיו
  choice: Jeder von euch ... die Männer, die seiner Verantwortung unterstehen
  rationale: Die distributive Wendung lautet wörtlich etwa „jeder Mann seine Männer“. Die Übersetzung verdeutlicht, dass jeder Richter gegen die ihm zugeordneten Männer vorgehen soll, und vermeidet das im Deutschen missverständliche „seine Männer“.
- source_word: הַנִּצְמָדִים
  choice: die ... sich ... angeschlossen haben
  rationale: Das Nifal-Partizip von צמד bezeichnet ein enges Sich-Anschließen oder Sich-Binden. „Sich angeschlossen haben“ ist natürlich und wahrt den freiwilligen Bezug zum fremden Kult.
- source_word: לְבַעַל פְּעוֹר
  choice: dem Baal von Peor
  rationale: Die Formulierung bezeichnet den mit Peor verbundenen Baal. „Baal von Peor“ macht diesen Zusammenhang im Deutschen transparent; die traditionelle Zusammenschreibung bleibt als Fußnotenalternative erhalten.
theological_decisions:
- issue: Art der angeordneten Tötung
  choice: Moses befiehlt den Richtern unmittelbar, die ihrer Verantwortung unterstehenden Abtrünnigen zu töten.
  alternative: Mit „hinrichten“ den gerichtlichen Charakter ausdrücklich hervorheben oder die Formulierung als Bundesgericht ausbauen.
  rationale: Der Vers enthält einen direkten Tötungsbefehl im Zusammenhang mit dem Götzendienst, erläutert hier aber weder das Verfahren noch die theologischen Kategorien. Die Übersetzung bewahrt die Härte des Wortlauts, ohne zusätzliche rechtliche oder dogmatische Deutung einzutragen.
- issue: Bezug von אִישׁ אֲנָשָׁיו
  choice: Der maskuline Personenbezug wird mit „Jeder von euch“ und „die Männer“ bewahrt.
  alternative: Geschlechtsneutral mit „alle, die euch unterstehen“ wiedergeben.
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und bezeichnet im Kontext männliche Täter; dies soll nicht neutralisiert werden.
- issue: Zuordnung der Männer zu den Richtern
  choice: „die seiner Verantwortung unterstehen“ verdeutlicht die distributive Zuordnung.
  alternative: Wörtlicher „jeder seine Männer“, was im Deutschen Besitz, Gefolgschaft oder militärische Untergebene nahelegen könnte.
  rationale: Die hebräische Kürze ist mehrdeutig hinsichtlich der genauen institutionellen Zuordnung. Die Übersetzung gibt den naheliegenden Verantwortungsbereich wieder, ohne ein bestimmtes Verwaltungsmodell festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung macht den Adressatenbezug des distributiven Befehls verständlich. Der harte Befehl wird nicht beschönigt; zugleich werden weder „hinrichten“ noch zusätzliche rechtliche oder kultische Erklärungen in den Haupttext aufgenommen.
