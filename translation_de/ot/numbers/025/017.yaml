  text: צָר֖וֹר אֶת הַ/מִּדְיָנִ֑ים וְ/הִכִּיתֶ֖ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/017.yaml
  text: Harass the Midianites and strike them down,[a]
translation:
  language: de
  text: Bedrängt die Midianiter und schlagt sie nieder![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Behandelt die Midianiter als Feinde und schlagt sie!« Das hebräische Verb צָרוֹר kann bedeuten, jemandem feindlich zu begegnen oder ihn als Feind zu behandeln.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: Bedrängt
  rationale: Das als Aufforderung gebrauchte Qal von צרר bezeichnet feindseliges Vorgehen gegen jemanden beziehungsweise dessen Behandlung als Gegner. »Bedrängt« ist im Deutschen verständlich und gibt die anhaltende feindliche Einwirkung wieder, ohne eine bestimmte militärische Taktik festzulegen.
- source_word: הַמִּדְיָנִים
  choice: die Midianiter
  rationale: Die herkömmliche deutsche Bezeichnung für das Volk Midian.
- source_word: וְהִכִּיתֶם
  choice: und schlagt sie nieder
  rationale: Das Hifil von נכה kann schlagen, niederschlagen oder besiegen bedeuten. »Schlagt sie nieder« bewahrt die gewaltsame Aussage und bleibt zugleich weiter als das spezifischere »tötet sie«.
- source_word: אוֹתָם
  choice: sie
  rationale: Das direkte Objekt bezieht sich auf die Midianiter und wird regulär mit »sie« wiedergegeben.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion zeigt sich in der Satzstellung.
theological_decisions:
- issue: Wiedergabe eines göttlichen Befehls zu Feindschaft und Gewalt ohne Abschwächung oder Ausweitung
  choice: Bedrängt die Midianiter und schlagt sie nieder!
  alternative: Behandelt die Midianiter als Feinde und schlagt sie!
  rationale: Die beiden Aufforderungen gebieten feindseliges und gewaltsames Vorgehen. Die Übersetzung wahrt diese Härte, ohne eine im Vers nicht genannte Rechtfertigung oder vollständige Vernichtung hinzuzufügen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, knappem Befehlsstil. »Bedrängt« vermeidet das altertümlichere »befehdet«; »schlagt sie nieder« erhält die starke, gewaltsame Bedeutung, ohne das Verb auf »tötet« zu verengen.
