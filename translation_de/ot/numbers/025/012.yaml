  text: לָ/כֵ֖ן אֱמֹ֑ר הִנְנִ֨/י נֹתֵ֥ן ל֛/וֹ אֶת בְּרִיתִ֖/י שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: de
  text: 'Darum sage: »Sieh, ich gebe ihm meinen Friedensbund.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »meinen Bund des Friedens«; »Frieden« kann hier umfassendes Wohlergehen und Heil einschließen.'
    reason: Bewahrt die mögliche syntaktische und semantische Spannweite von בְּרִיתִי שָׁלוֹם.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Handeln des Pinhas knapp und natürlich wieder.
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: Bewahrt die hervorhebende Präsentationsformel des Hebräischen; »Sieh« ist im modernen Deutsch verständlich und würdevoll.
- source_word: נֹתֵן
  choice: gebe
  rationale: Das Partizip bezeichnet hier Gottes gegenwärtig erklärte bzw. unmittelbar wirksame Gabe.
- source_word: בְּרִיתִי שָׁלוֹם
  choice: meinen Friedensbund
  rationale: Gibt die enge hebräische Verbindung idiomatisch wieder, ohne den inhaltlichen Umfang von שָׁלוֹם auf bloße Abwesenheit von Streit zu verengen.
theological_decisions:
- issue: Verhältnis von »Bund« und »Frieden«
  choice: Friedensbund
  alternative: meinen Bund des Friedens
  rationale: Das kompakte deutsche Kompositum bewahrt die sachliche Zuordnung, ohne genauer festzulegen, ob שָׁלוֹם den Inhalt, die Wirkung oder die Art des Bundes bezeichnet; diese Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, klares und zugleich feierliches Standarddeutsch. Die direkte Gottesrede wird mit deutschen Anführungszeichen gesetzt; »Sieh« erhält die markierte Hervorhebung des hebräischen הִנְנִי.
