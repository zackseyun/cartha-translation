  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: de
  text: So schloss sich Israel dem Baal von Peor an[a], und Jahwes Zorn entbrannte gegen Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verband sich mit dem Baal von Peor“ oder „band sich an den Baal von Peor“. Der Name kann auch als „Baal-Peor“ wiedergegeben werden.'
    reason: Lexikalische und namensbezogene Übersetzungsalternativen zu וַיִּצָּמֶד und בַעַל פְּעוֹר; die unidiomatische und als „wörtlicher“ missverständliche Jochformulierung wurde entfernt.
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: schloss sich … an
  rationale: Das Nifal von צמד bezeichnet ein enges Sichverbinden oder Anschließen. Die reflexive deutsche Form gibt dies natürlich wieder, ohne das bildhafte, aber stärker deutende „sich anjochen“ in den Haupttext zu setzen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Übliche deutsche Form des Volksnamens.
- source_word: לְבַעַל פְּעוֹר
  choice: dem Baal von Peor
  rationale: Die Wendung bezeichnet Baal in seiner örtlichen Verbindung mit Peor. „Baal von Peor“ wahrt die hebräische Beziehung und ist im modernen Deutsch verständlich.
- source_word: וַיִּחַר אַף
  choice: der Zorn … entbrannte
  rationale: Die deutsche Wendung bewahrt das hebräische Bild des heiß oder brennend werdenden Zorns und klingt zugleich natürlich und würdevoll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: בְּיִשְׂרָאֵל
  choice: gegen Israel
  rationale: Bei der Zornesformel bezeichnet בְּ das Ziel beziehungsweise den Gegenstand des Zorns; „gegen Israel“ ist die idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ erhält den persönlichen Gottesnamen, ohne ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Art der Bindung Israels an Baal
  choice: schloss sich … an
  alternative: jochte sich … an; hing … an
  rationale: Die Formulierung lässt die enge, schuldhafte kultische Bindung erkennen, legt sich jedoch nicht auf das konkrete Bild eines Jochs fest, das im Verb mitschwingen kann.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „Israel“ folgt dem hebräischen Text; das Bild des entbrennenden Zorns bleibt erhalten.
