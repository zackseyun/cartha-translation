source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: de
  text: Und siehe, einer der Söhne Israels kam und führte eine Midianiterin[b] zu seinen Brüdern[a] heran, vor den Augen Moses und vor den Augen der ganzen Gemeinde der Söhne Israels, während sie am Eingang des Zeltes der Begegnung weinten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu seinen Verwandten“ beziehungsweise „zu seinen israelitischen Volksgenossen“. Wörtlich steht im Hebräischen: „zu seinen Brüdern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Midianiterin“. Bei der Einführung einer Person ist im Deutschen meist „eine Midianiterin“ üblich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt den hebräischen Aufmerksamkeitsmarker und die plötzliche, anstößige Wendung der Erzählung, ohne ihn wegzuglätten.
- source_word: אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: ein Mann von den Söhnen Israels
  rationale: Gibt das männliche Singularnomen und die familiäre hebräische Wendung formal genau wieder.
- source_word: וַיַּקְרֵב
  choice: führte … heran
  rationale: Gibt den Hifil von קרב als verursachte Annäherung wieder und klingt im Deutschen natürlicher als das wörtlichere „brachte … nahe“.
- source_word: אֶל אֶחָיו
  choice: zu seinen Brüdern
  rationale: Bewahrt die wörtliche familiäre Bezeichnung; der Kontext kann Verwandte oder israelitische Volksgenossen meinen, was in der Fußnote offengehalten wird.
- source_word: הַמִּדְיָנִית
  choice: eine Midianiterin
  rationale: Das feminine substantivierte Adjektiv bezeichnet eine midianitische Frau. Trotz des hebräischen Artikels ist bei ihrer Einführung der unbestimmte Artikel im Deutschen idiomatisch.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: vor den Augen … und vor den Augen
  rationale: Erhält die auffällige Wiederholung und hebt den demonstrativ öffentlichen Charakter der Handlung hervor.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: der ganzen Gemeinde der Söhne Israels
  rationale: „Gemeinde“ gibt עֵדָה als versammelte Gemeinschaft wieder; die familiäre Bezeichnung „Söhne Israels“ bleibt erhalten.
- source_word: וְהֵמָּה בֹכִים
  choice: während sie … weinten
  rationale: Die Pronomen-Partizip-Konstruktion bezeichnet eine andauernde Hintergrundhandlung, die gleichzeitig mit dem Heranführen geschieht.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: Gibt den Ort klar wieder und bewahrt die kultische Bezeichnung אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Geschlechtlich markierte Bundes- und Verwandtschaftssprache in בְּנֵי יִשְׂרָאֵל und אֶחָיו
  choice: „Söhne Israels“ und „Brüder“ im Haupttext beibehalten
  alternative: „Israeliten“, „Verwandte“ oder „Volksgenossen“
  rationale: Der hebräische Text verwendet männliche familiäre Begriffe. Die Übersetzung bewahrt diese sprachliche Gestalt, ohne den möglichen weiteren Bezug von אֶחָיו dogmatisch einzuengen; Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener biblischer Erzählformel „Und siehe“. Die Wiederholung „vor den Augen“ und die familiären Ausdrücke des Hebräischen bleiben erhalten; „führte … heran“ sorgt zugleich für natürlichen deutschen Satzbau.
