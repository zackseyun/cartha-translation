  text: וַ/יִּהְי֕וּ הַ/מֵּתִ֖ים בַּ/מַּגֵּפָ֑ה אַרְבָּעָ֥ה וְ/עֶשְׂרִ֖ים אָֽלֶף׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/009.yaml
  text: And those who died in the plague were twenty-four thousand.
translation:
  language: de
  text: Und die Zahl derer, die an der Plage starben, betrug vierundzwanzigtausend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: betrug
  rationale: Das Verb היה führt hier zusammen mit der folgenden Zahl die Gesamtsumme ein. Im Deutschen gibt „betrug“ diese Funktion in einer zahlenmäßigen Feststellung natürlich und präzise wieder.
- source_word: הַמֵּתִים
  choice: die Zahl derer, die … starben
  rationale: Das substantivierte Partizip bezeichnet die Verstorbenen. In Verbindung mit „betrug“ macht die Ergänzung „die Zahl“ die im Hebräischen knappe Zahlenkonstruktion idiomatisch verständlich, während „derer, die … starben“ den verbalen Charakter wahrt.
- source_word: בַּמַּגֵּפָה
  choice: an der Plage
  rationale: מַגֵּפָה bezeichnet eine tödliche Plage. Beim deutschen Verb „sterben“ bezeichnet „an“ idiomatisch die Todesursache; die mögliche ereignisbezogene Nuance von ב wird dadurch in diesem Zusammenhang sachgerecht wiedergegeben.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: vierundzwanzigtausend
  rationale: Die hebräische Zahlform entspricht 24.000 und wird nach modernem deutschen Sprachgebrauch als „vierundzwanzigtausend“ wiedergegeben.
