source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: de
  text: Pinhas, der Sohn Eleasars, des Sohnes Aarons, des Priesters, hat meinen Zorn von den Israeliten abgewendet, indem er mitten unter ihnen mit meinem Eifer eiferte.[a] Darum habe ich die Israeliten in meinem Eifer nicht vernichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Formulierung verbindet mit derselben Wortwurzel Pinhas’ Eifern und Gottes Eifer: wörtlich etwa: „indem er unter ihnen meinen Eifer eiferte“. Auch möglich: „indem er unter ihnen mit meiner Eifersucht eifersüchtig war“.'
    reason: Die ungewöhnliche hebräische Konstruktion und die Bedeutungsbreite von קנא lassen sich im deutschen Haupttext nicht zugleich natürlich und vollständig nachbilden.
lexical_decisions:
- source_word: הֵשִׁיב
  choice: hat … abgewendet
  rationale: Das Hifil von שוב bezeichnet hier das Abwenden des göttlichen Zorns. Diese Formulierung ist im modernen Deutschen natürlich und bewahrt den kausativen Sinn.
- source_word: חֲמָתִי
  choice: meinen Zorn
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Zorn“ ist würdig, verständlich und trägt hier die nötige Intensität.
- source_word: מֵעַל
  choice: von den Israeliten
  rationale: Wörtlich steht „von über/auf“. Im Deutschen drückt „den Zorn von jemandem abwenden“ dasselbe Bild idiomatisch aus, ohne eine unnatürliche Präpositionsfolge.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung umfasst hier die ganze Gemeinschaft. „Israeliten“ ist im modernen Deutschen genauer und natürlicher als das missverständliche „Söhne Israels“.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: indem er … für mich eiferte, wie ich selbst eifere
  rationale: Verb und Substantiv derselben Wurzel קנא werden durch die Wiederholung von „eifern“ erkennbar verbunden. Die Formulierung gibt den schwierigen inneren Akkusativ sinngemäß wieder und vermeidet das im Deutschen irreführende „mit meiner Eifersucht eifersüchtig sein“.
- source_word: בְּתוֹכָם
  choice: mitten unter ihnen
  rationale: Die Wendung bezeichnet sein Handeln innerhalb der Gemeinschaft und wird mit einer geläufigen deutschen Formulierung wiedergegeben.
- source_word: כִלִּיתִי
  choice: habe … nicht vernichtet
  rationale: Das Piel von כלה kann vollständiges Aufreiben oder Vernichten bezeichnen. „Vernichtet“ gibt die angedrohte völlige Auslöschung klar wieder.
- source_word: בְּקִנְאָתִי
  choice: in meinem Eifer
  rationale: Die erneute Verwendung von קִנְאָה wird konsistent ausgedrückt und bewahrt die Verbindung zwischen Pinhas’ Handeln und Gottes Reaktion.
- source_word: הַכֹּהֵן
  choice: des Priesters
  rationale: Der Titel ist wahrscheinlich auf Aaron bezogen. Die genitivische Apposition hält diese syntaktische Zuordnung offen genug und klingt würdig.
theological_decisions:
- issue: Wiedergabe der Wortfamilie קנא / קִנְאָה bei Pinhas und Gott
  choice: eifern / Eifer
  alternative: eifersüchtig sein / Eifersucht
  rationale: Die Wurzel kann sowohl Eifer als auch Eifersucht bezeichnen. In diesem Handlungskontext ist „Eifer“ im Deutschen natürlicher; die gemeinsame Wortwurzel bleibt durch „eifern/Eifer“ sichtbar. Die mögliche Bedeutung „Eifersucht“ und die exakte hebräische Wiederholung werden in der Fußnote festgehalten.
- issue: Bezug von הַכֹּהֵן
  choice: Aaron, der Priester
  alternative: Pinhas, der Priester
  rationale: Nach der unmittelbaren Wortstellung kann der Titel zu Aaron gehören und entspricht seiner geläufigen Bezeichnung. Die deutsche Genitivkette bildet diese Lesart ab, ohne eine zusätzliche dogmatische Aussage einzuführen.
- issue: Umfang von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung fungiert hier als Volksbezeichnung und meint die Gemeinschaft Israels, nicht ausschließlich männliche Nachkommen. Die idiomatische Wiedergabe vermeidet eine sachlich unbeabsichtigte Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Genealogie, wird aber bei Präpositionen und der inneren Akkusativkonstruktion idiomatisch geglättet. Der Gottesname erscheint in diesem Vers nicht ausdrücklich; die Ich-Rede bleibt daher unverändert.
