source:
  edition: WLC
  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: de
  text: Der Name des erschlagenen Israeliten, der zusammen mit der Midianiterin erschlagen worden war,[a] war Simri, Sohn Salus, ein Oberhaupt eines Vaterhauses bei den Simeonitern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische wiederholt das Verb „erschlagen“.
    reason: lexical_alternative
  - marker: b
    text: Ein „Vaterhaus“ war eine patrilineare Familien- oder Sippeneinheit innerhalb des Stammes.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם אִישׁ יִשְׂרָאֵל
  choice: Der Israelit … hieß
  rationale: Die deutsche Namensformel gibt die hebräische Konstruktion natürlich und vollständig wieder; אִישׁ יִשְׂרָאֵל bezeichnet hier einen israelitischen Mann.
- source_word: הַמֻּכֶּה אֲשֶׁר הֻכָּה
  choice: der … erschlagen wurde
  rationale: Die passive Tötung wird im Deutschen klar ausgedrückt. Die wörtliche Wiederholung desselben Verbs wäre hier schwerfällig und wird daher nicht im Haupttext nachgebildet.
- source_word: אֶת הַמִּדְיָנִית
  choice: zusammen mit der Midianiterin
  rationale: In dieser passiven Konstruktion bezeichnet אֶת die Frau, mit der zusammen er getötet wurde; die feminine Volksbezeichnung kann im Deutschen substantivisch als „Midianiterin“ stehen.
- source_word: זִמְרִי בֶּן סָלוּא
  choice: Simri, ein Sohn Salus
  rationale: Die Namen folgen geläufigen deutschen Bibelnamensformen; בֶּן wird als Abstammungsangabe wiedergegeben.
- source_word: נְשִׂיא
  choice: Oberhaupt
  rationale: Das Wort bezeichnet hier den führenden Repräsentanten einer sozialen Einheit, nicht einen königlichen Prinzen.
- source_word: בֵית אָב
  choice: Vaterhaus
  rationale: Der technische Verwandtschaftsbegriff bezeichnet eine patrilineare Familien- oder Sippeneinheit und bleibt in der knappen deutschen Fachbezeichnung erkennbar.
- source_word: לַשִּׁמְעֹנִי
  choice: unter den Simeonitern
  rationale: Die Wendung ordnet das Vaterhaus dem Stamm Simeon zu und klingt in Verbindung mit „Oberhaupt“ natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung wird wegen ihrer Schwerfälligkeit nicht in den Haupttext übernommen, aber in der Fußnote transparent gemacht. „Vaterhaus“ bewahrt den historischen Sozialbegriff und wird dort erläutert.
