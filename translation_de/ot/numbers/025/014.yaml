  naturalness: Der Entwurf ist überwiegend modernes, würdiges Deutsch. „Simri, ein Sohn Salus“ ist jedoch als Namens- und Abstammungsformel weniger idiomatisch als „Simri, Sohn Salus“. Die überarbeitete Formulierung bleibt trotz der quellentreuen Wiederaufnahme von „erschlagen“ gut lesbar.
  terminology: „Israelit“, „Midianiterin“, „Oberhaupt“ und „Vaterhaus“ sind angemessen. „Vaterhaus“ bewahrt den historischen Fachbegriff und benötigt eine knappe Erläuterung. „bei den Simeonitern“ gibt die Stammeszugehörigkeit idiomatisch und ohne unnötige Einengung wieder.
