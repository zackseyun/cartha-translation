lexical_decisions:
- source_word: וַיְהִי
  choice: Und … geschah Folgendes
  rationale: Die Wayyiqtol-Form von היה dient hier als erzählerische Übergangsformel. Die gewählte Wendung ist modernes, natürliches Deutsch und lässt erkennen, dass der Satz zum Folgenden überleitet.
- source_word: אַחֲרֵי
  choice: nach
  rationale: Die Präposition bezeichnet schlicht die zeitliche Abfolge; „nach“ ist die direkte und idiomatische Wiedergabe.
- source_word: הַמַּגֵּפָה
  choice: der Plage
  rationale: מַגֵּפָה bezeichnet hier die tödliche Plage im Zusammenhang des göttlichen Gerichts in Numeri 25. „Plage“ ist präzise, verständlich und kontextgerecht.
theological_decisions:
- issue: Erzählformel als eigenständiger Vers
  choice: Die kurze Übergangsklausel wird entsprechend der masoretischen Verseinteilung als eigener Satz wiedergegeben.
  alternative: Die Klausel als unvollständigen Auftakt des folgenden Verses behandeln.
  rationale: Der Vers besteht im WLC nur aus dieser Übergangsformel. „Geschah Folgendes“ wahrt ihre vorausweisende Funktion, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung vermeidet das altertümliche „Und es begab sich“, bewahrt aber die knappe erzählerische Übergangsfunktion des Hebräischen.
