base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: de
  text: 'Achisch antwortete und sagte zu David: „Ich weiß, dass du in meinen Augen so gut bist wie ein Engel Gottes[a]. Doch die Befehlshaber der Philister haben gesagt: ‚Er soll nicht mit uns in den Kampf ziehen.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Bote Gottes“. Das hebräische Wort מַלְאָךְ kann sowohl „Bote“ als auch „Engel“ bedeuten; in dieser Wendung liegt „Engel Gottes“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן … וַיֹּאמֶר
  choice: antwortete und sagte
  rationale: Bewahrt die zweigliedrige hebräische Redeeinleitung, ohne ihren erzählerischen Charakter abzuschwächen.
- source_word: יָדַעְתִּי
  choice: Ich weiß
  rationale: Das Perfekt bezeichnet hier Achischs feststehende Einschätzung in der gegenwärtigen Gesprächssituation.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: du in meinen Augen gut bist
  rationale: Gibt die breite Wertung und das hebräische Bild wörtlich und zugleich verständlich wieder, ohne sie einengend als Loyalität oder Wohlgefallen auszulegen.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: wie ein Engel Gottes
  rationale: In dieser festen Vergleichsformulierung liegt der übernatürliche Sinn nahe; die mögliche Bedeutung „Bote“ wird in einer Fußnote bewahrt.
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zwischen Achischs persönlichem Urteil und der Entscheidung der philistäischen Befehlshaber.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: die Befehlshaber der Philister
  rationale: Im militärischen Zusammenhang bezeichnet שָׂרִים die führenden Männer; „Befehlshaber“ ist präziser und moderner als „Fürsten“.
- source_word: לֹא יַעֲלֶה
  choice: Er darf nicht … ziehen
  rationale: Der Imperfekt mit Verneinung gibt in der wiedergegebenen Rede ein Verbot beziehungsweise eine verbindliche Entscheidung wieder. „In den Kampf ziehen“ ist im Deutschen die natürliche militärische Entsprechung.
- source_word: עִמָּנוּ בַּמִּלְחָמָה
  choice: mit uns in den Kampf
  rationale: Gibt Gemeinschaft und Zielrichtung der Bewegung idiomatisch wieder; der bestimmte Artikel des Hebräischen erscheint in „in den Kampf“.
theological_decisions:
- issue: Bedeutung von מַלְאַךְ אֱלֹהִים im Vergleich Achischs
  choice: „wie ein Engel Gottes“ als Ausdruck außergewöhnlich hoher Wertschätzung, ohne eine Aussage über Davids Wesen zu unterstellen
  alternative: „wie ein Bote Gottes“
  rationale: מַלְאַךְ kann sowohl einen menschlichen Boten als auch einen Engel bezeichnen. In der Wendung מַלְאַךְ אֱלֹהִים ist „Engel Gottes“ naheliegend; da David nur verglichen wird, ist keine ontologische oder weitergehende dogmatische Aussage enthalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Redeeinleitung und das Bild „in meinen Augen“ bleiben erhalten; die militärische Aussage wird mit der geläufigen Wendung „in den Kampf ziehen“ natürlich formuliert.
