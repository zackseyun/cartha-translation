    issue: Der Vergleich ist im Deutschen stilistisch nicht eindeutig genug angebunden.
    rationale: „du in meinen Augen gut bist wie ein Engel Gottes“ ist möglich, aber „so gut bist wie“ ist die geläufigere und klarere Vergleichskonstruktion, ohne die Aussage einzuengen.
  - severity: low
    issue: „Er darf nicht“ kann als bloße Verweigerung einer Erlaubnis verstanden werden.
    rationale: Die Negation des Imperfekts in der zitierten Aussage der Befehlshaber vermittelt hier deren verbindlichen Beschluss. „Er soll nicht“ gibt diese deontische Nuance idiomatisch wieder.
