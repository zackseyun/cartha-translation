source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם דָּוִ֜ד ה֤וּא וַֽ/אֲנָשָׁי/ו֙ לָ/לֶ֣כֶת בַּ/בֹּ֔קֶר לָ/שׁ֖וּב אֶל אֶ֣רֶץ פְּלִשְׁתִּ֑ים וּ/פְלִשְׁתִּ֖ים עָל֥וּ יִזְרְעֶֽאל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: de
  text: So machte sich David früh am Morgen mit seinen Männern auf, um in das Land der Philister zurückzukehren. Die Philister aber zogen nach Jesreel hinauf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zogen nach Jesreel« beziehungsweise »rückten nach Jesreel vor«. Das hebräische »hinaufziehen« kann eine topografische oder militärische Färbung haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: machte sich früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet frühes Aufstehen bzw. frühes Aufbrechen. Zusammen mit בַּבֹּקֶר gibt die deutsche Wendung den zeitlichen Nachdruck natürlich wieder, ohne ein schwerfälliges doppeltes »früh … am Morgen«.
- source_word: הוּא וַאֲנָשָׁיו
  choice: David … mit seinen Männern
  rationale: אֲנָשָׁיו meint hier Davids Männer, seine bewaffnete Gefolgschaft. Die deutsche Begleitkonstruktion ist natürlich und bewahrt, wer gemeinsam aufbricht.
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: machte sich früh am Morgen auf, um … zurückzukehren
  rationale: Die beiden Infinitive beschreiben das Aufbrechen und dessen Ziel. Die Wiedergabe vermeidet im Deutschen die unnatürliche Häufung »um am Morgen zu gehen, um zurückzukehren«, ohne den Zweckzusammenhang aufzugeben.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: in das Land der Philister
  rationale: Die konkrete Bezeichnung »Land der Philister« bleibt erhalten; bei »zurückkehren« ist »in das Land« idiomatisches Standarddeutsch.
- source_word: וּפְלִשְׁתִּים
  choice: Die Philister aber
  rationale: Das »aber« kennzeichnet den Wechsel von Davids Rückkehr zur gegenläufigen Bewegung des Philisterheeres, ohne einen starken Gegensatz hinzuzufügen.
- source_word: עָלוּ
  choice: zogen … hinauf
  rationale: עלה bedeutet »hinaufgehen/hinaufziehen« und kann hier zugleich topografische und militärische Färbung haben. »zogen hinauf« bewahrt diese Offenheit.
- source_word: יִזְרְעֶאל
  choice: Jesreel
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
theological_decisions: []
