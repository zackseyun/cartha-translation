base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/002.yaml
  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: de
  text: Die Fürsten der Philister zogen zu Hunderten und zu Tausenden vorbei[a], und David und seine Männer zogen mit Achisch ganz hinten vorbei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Hundertschaften und Tausendschaften“. Wahrscheinlich ist eine Gliederung in militärische Verbände von Hunderten und Tausenden gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: Fürsten
  rationale: סֶרֶן bezeichnet die ranghohen politisch-militärischen Herrscher der philistäischen Stadtstaaten. „Fürsten“ gibt diesen besonderen Rang im Deutschen knapp und würdig wieder.
- source_word: פְלִשְׁתִּים
  choice: Philister
  rationale: Übliche deutsche Bezeichnung für diese Volksgruppe.
- source_word: עֹבְרִים
  choice: zogen … vorbei
  rationale: Das Partizip schildert eine im Gang befindliche Bewegung im Rahmen des Heeresaufmarschs. „zogen vorbei“ ist im Deutschen natürlich und lässt den militärischen Zusammenhang erkennen.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: in Hundertschaften und Tausendschaften
  rationale: Die Wendung bezeichnet wahrscheinlich militärische Gliederungen nach Hunderten und Tausenden. Diese Wiedergabe ist verständlich und wahrt zugleich die konkrete Zahlenstruktur des Hebräischen; die formal mögliche distributive Lesart wird in der Fußnote genannt.
- source_word: אֲנָשָׁיו
  choice: seine Männer
  rationale: Gemeint sind Davids männliche Gefolgsleute beziehungsweise Kämpfer. „Seine Männer“ ist kontextgerecht, ohne die Gruppe unnötig eng als reguläre Soldaten zu bestimmen.
- source_word: בָּאַחֲרֹנָה
  choice: ganz hinten
  rationale: Die Form bezeichnet die hinterste Position im Zug. „Ganz hinten“ ist gegenwärtiges, anschauliches Deutsch und gibt die räumliche Bedeutung klar wieder.
- source_word: עִם אָכִישׁ
  choice: zusammen mit Achisch
  rationale: Die Präposition bezeichnet schlichte Begleitung; „zusammen mit“ macht diese Beziehung im Satz eindeutig und natürlich.
