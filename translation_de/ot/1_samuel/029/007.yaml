  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: de
  text: Und nun kehr um und geh in Frieden, und tu nichts Böses[a] in den Augen der Fürsten der Philister.
  philosophy: optimal-equivalence
  footnotes:
