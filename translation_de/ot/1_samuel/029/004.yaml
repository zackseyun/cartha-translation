source:
  edition: WLC
  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: de
  text: 'Doch die Heerführer der Philister wurden zornig auf ihn und sagten zu ihm: »Schick den Mann zurück! Er soll an den Ort zurückkehren, den du ihm zugewiesen hast. Er darf nicht mit uns in die Schlacht hinabziehen, damit er uns in der Schlacht nicht zum Gegner wird.[a] Denn womit könnte dieser Mann sich wieder die Gunst seines Herrn erwerben?[b] Doch wohl mit den Köpfen dieser Männer!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שָׂטָן bedeutet hier »Gegner« oder »Widersacher« und ist nicht der Eigenname »Satan«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sich mit seinem Herrn wieder versöhnen«. Gemeint ist, dass David bei seinem Herrn wieder Annahme und Gunst finden könnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: wurden zornig auf ihn
  rationale: קצף bezeichnet heftigen Zorn. Die Formulierung ist im modernen Deutschen würdig und deutlich, ohne die Intensität unnötig zu steigern.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: die Heerführer der Philister
  rationale: שָׂרִים bezeichnet hier im unmittelbaren militärischen Zusammenhang die führenden Befehlshaber; »Heerführer« verbindet politische Rangstellung und militärische Funktion.
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: Schick den Mann zurück
  rationale: 'Der Hifil-Imperativ von שוב ist kausativ: Der Angesprochene soll veranlassen, dass der Mann zurückkehrt. »Schick ... zurück« ist dafür natürliches Deutsch.'
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: Er soll an den Ort zurückkehren
  rationale: Die mit וְ angeschlossene Verbform drückt nach dem Imperativ die beabsichtigte Folge beziehungsweise Aufforderung aus.
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: den du ihm zugewiesen hast
  rationale: הפקיד kann einsetzen, beauftragen, zuweisen oder stationieren bedeuten. »zugewiesen« lässt die genaue Art von Achischs Anordnung angemessen offen.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: Er darf nicht mit uns in die Schlacht hinabziehen
  rationale: »hinabziehen« bewahrt die konkrete Bewegungsrichtung von ירד und passt zugleich zum Aufbruch eines Heeres; die modale Wendung gibt das Verbot klar wieder.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: damit er uns ... nicht zum Gegner wird
  rationale: שָׂטָן ist hier ein Gattungswort für einen Gegner oder Widersacher. »Gegner« ist verständlich und vermeidet den unzutreffenden Eindruck des Eigennamens Satan.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: könnte dieser Mann sich wieder die Gunst seines Herrn erwerben
  rationale: Das Hitpael von רצה bezeichnet hier, sich bei einem Höhergestellten wieder annehmbar zu machen beziehungsweise dessen Gunst zurückzugewinnen. Die deutsche Wendung gibt diesen praktischen Sinn natürlich wieder.
- source_word: אֲדֹנָיו
  choice: seines Herrn
  rationale: אָדוֹן bezeichnet Davids politischen Herrn, Saul. »Herr« wahrt die damalige Rangbeziehung, ohne ein Sklavenverhältnis nahezulegen.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: Doch wohl mit den Köpfen dieser Männer!
  rationale: Die rhetorische Frage erwartet Zustimmung. Das elliptische Bild besagt, dass David durch das Töten philistäischer Soldaten Sauls Gunst zurückgewinnen könnte; die Übersetzung bewahrt die drastische Bildsprache.
theological_decisions:
- issue: Bedeutung von שָׂטָן
  choice: Gattungswort »Gegner«
  alternative: Eigenname »Satan«
  rationale: Im historischen und militärischen Zusammenhang bezeichnet das Wort einen menschlichen Gegner. Ein Eigenname würde eine dämonologische Aussage in den Text eintragen, die hier nicht vorliegt.
- issue: Bedeutung von יִתְרַצֶּה אֶל אֲדֹנָיו
  choice: sich wieder die Gunst seines Herrn erwerben
  alternative: sich mit seinem Herrn versöhnen
  rationale: Die Form kann eine Wiederannäherung ausdrücken, zielt hier aber konkret darauf, bei Saul erneut Annahme und Wohlwollen zu finden. Die gewählte Fassung erhält diesen Sinn, ohne eine förmliche Versöhnungslehre einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Rede. Militärische Begriffe werden verständlich wiedergegeben; »hinabziehen« erhält zugleich die räumliche Färbung des Hebräischen. Die rhetorische Schlussfrage erscheint als idiomatische, nachdrückliche Feststellung mit Ausrufezeichen.
