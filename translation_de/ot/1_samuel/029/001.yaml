source:
  edition: WLC
  text: וַ/יִּקְבְּצ֧וּ פְלִשְׁתִּ֛ים אֶת כָּל מַחֲנֵי/הֶ֖ם אֲפֵ֑קָ/ה וְ/יִשְׂרָאֵ֣ל חֹנִ֔ים בַּ/עַ֖יִן אֲשֶׁ֥ר בְּ/יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: de
  text: Die Philister versammelten alle ihre Heerlager[a] bei Afek, während Israel an der Quelle[b] in Jesreel lagerte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle ihre Truppen“ oder „alle ihre Heere“; wörtlicher: „alle ihre Lager“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Brunnen“; das hebräische Wort kann eine Quelle oder einen Brunnen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: versammelten
  rationale: קבץ bezeichnet hier im fortlaufenden Erzählzusammenhang das Zusammenziehen beziehungsweise Sammeln; „versammelten“ ist natürlich und legt kein spezielles militärisches Verfahren fest.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Eingebürgerte deutsche Bezeichnung der Volksgruppe.
- source_word: כָּל מַחֲנֵיהֶם
  choice: alle ihre Heerlager
  rationale: מַחֲנֶה bedeutet wörtlich „Lager“ und bezeichnet im Kontext militärische Lager oder Heeresabteilungen. „Heerlager“ bewahrt sowohl den konkreten Lagerbezug als auch den militärischen Zusammenhang.
- source_word: אֲפֵקָה
  choice: bei Afek
  rationale: Der Ortsname wird in üblicher deutscher Form wiedergegeben; das Richtungs-He wird im Zusammenhang idiomatisch durch „bei“ ausgedrückt.
- source_word: וְיִשְׂרָאֵל חֹנִים
  choice: während Israel … lagerte
  rationale: Die Verbindung beschreibt eine gleichzeitige, kontrastierende Situation. Das kollektive „Israel“ wird im Deutschen idiomatisch mit einem Verb im Singular verbunden.
- source_word: בַּעַיִן
  choice: an der Quelle
  rationale: עַיִן kann eine Quelle oder einen Brunnen bezeichnen; „Quelle“ ist für die geografische Angabe die naheliegende Wiedergabe.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: bei Jesreel
  rationale: Die hebräische Relativkonstruktion lokalisiert die Quelle. Die knappe deutsche Ortsangabe gibt den Sinn natürlich wieder, ohne die Quelle zwingend innerhalb einer Stadt zu verorten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heerlager“ macht den militärischen Kontext deutlich, ohne die konkrete Lagermetapher des Hebräischen aufzugeben. Die Satzverknüpfung mit „während“ bildet die Gleichzeitigkeit und den Kontrast idiomatisch ab.
