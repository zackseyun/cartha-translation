  edition: WLC
  text: הֲ/לוֹא זֶ֣ה דָוִ֔ד אֲשֶׁ֧ר יַעֲנוּ ל֛/וֹ בַּ/מְּחֹל֖וֹת לֵ/אמֹ֑ר הִכָּ֤ה שָׁאוּל֙ בַּֽ/אֲלָפָ֔י/ו וְ/דָוִ֖ד ב/רבבת/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: de
  text: Ist das nicht David, von dem sie bei den Reigentänzen im Wechsel sangen:[a] »Saul hat seine Tausende erschlagen und David seine Zehntausende«?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von dem sie bei den Reigentänzen antworteten“. Gemeint ist offenbar responsorisches oder antiphonales Singen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch allgemeiner „Myriaden“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: Ist das nicht David
  rationale: Bewahrt die rhetorische Frage, die Zustimmung erwartet, und die nachdrückliche Identifizierung Davids.
- source_word: יַעֲנוּ לוֹ
  choice: von dem sie … im Wechsel sangen
  rationale: ענה bezeichnet in diesem festlichen Zusammenhang responsorisches beziehungsweise antiphonales Singen. „Von dem“ gibt den Bezug auf David natürlich wieder, ohne ein Antworten an David selbst zu unterstellen.
- source_word: בַּמְּחֹלוֹת
  choice: bei den Reigentänzen
  rationale: Das Substantiv bezeichnet festliche Tänze oder Tanzreigen; „Reigentänze“ hält den konkreten, gemeinschaftlichen Charakter fest.
- source_word: הִכָּה
  choice: hat … erschlagen
  rationale: Im militärischen Kontext bezeichnet נכה das tödliche Niederschlagen von Gegnern. „Erschlagen“ ist prägnant, würdig und erhält die Bildkraft.
- source_word: בַּאֲלָפָיו
  choice: seine Tausende
  rationale: Die idiomatische Zahlenangabe bezeichnet die Saul zugerechneten besiegten Gegner und wahrt den Parallelismus.
- source_word: בְרִבְבֹתָיו
  choice: seine Zehntausende
  rationale: רבבה kann zehntausend oder allgemeiner eine Myriade bezeichnen. „Zehntausende“ bewahrt die zahlenmäßige Steigerung gegenüber „Tausende“.
