  text: וְ/עַתָּה֙ הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/עַבְדֵ֥י אֲדֹנֶ֖י/ךָ אֲשֶׁר בָּ֣אוּ אִתָּ֑/ךְ וְ/הִשְׁכַּמְתֶּ֣ם בַּ/בֹּ֔קֶר וְ/א֥וֹר לָ/כֶ֖ם וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: de
  text: Nun steh früh am Morgen auf, du und die Diener deines Herrn, die mit dir gekommen sind. Wenn ihr früh am Morgen aufsteht und es für euch hell ist,[a] dann geht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sobald es hell wird, geht“; auch möglich: „bei Tagesanbruch geht“. Wörtlich lautet die hebräische Wendung: „und es ist hell für euch“.'
    reason: Die knappe hebräische Zeitangabe lässt mehrere natürliche Wiedergaben zu.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Leitet die unmittelbar folgende Anweisung als natürlicher deutscher Diskursmarker ein und gibt den Übergang wieder, ohne das וְ eigens mit „und“ zu überladen.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: steh morgen früh auf
  rationale: Der Hifil-Imperativ von שׁכם bezeichnet frühes Aufstehen oder einen frühen Aufbruch. „Morgen früh“ gibt im Erzählzusammenhang den nächsten Morgen natürlich wieder.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: du und die Diener deines Herrn
  rationale: Die Diener werden als weitere Angesprochene zum singularischen Imperativ hinzugenommen. „Herr“ bezeichnet hier einen menschlichen Vorgesetzten, keinen Gottestitel.
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: die mit dir gekommen sind
  rationale: Der Relativsatz bestimmt die Diener näher; das Perfekt wird im Deutschen dem fortwirkenden Ergebnis entsprechend wiedergegeben.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: Wenn ihr morgen früh aufsteht
  rationale: Die pluralische Form nimmt David und seine Begleiter gemeinsam auf. Die temporale Wiedergabe bildet den Ablauf der Anweisung verständlich ab und bewahrt die Wiederholung des frühen Aufstehens.
- source_word: וְאוֹר לָכֶם
  choice: und es für euch hell ist
  rationale: Bleibt nahe bei der knappen und ungewöhnlichen hebräischen Formulierung („Licht/hell für euch“) und lässt offen, ob lediglich Tagesanbruch oder ausreichende Helligkeit zum Aufbruch gemeint ist.
- source_word: וָלֵכוּ
  choice: dann geht
  rationale: Der pluralische Imperativ von הלך fordert die ganze Gruppe direkt zum Aufbruch auf; „dann“ verdeutlicht im Deutschen die zeitliche Folge.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Die Wiederholung von „morgen früh“ folgt bewusst der Wiederholung im Hebräischen; die ungewöhnliche Wendung „für euch hell“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
