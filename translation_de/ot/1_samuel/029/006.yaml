source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: de
  text: 'Da rief Achisch David zu sich und sagte zu ihm: »So wahr Jahwe lebt: Du bist aufrichtig, und ich bin damit zufrieden, wie du mit mir im Lager aus- und eingehst[a]. Denn von dem Tag an, an dem du zu mir gekommen bist, bis heute habe ich nichts Böses an dir gefunden. Doch in den Augen der Fürsten[b] bist du nicht annehmbar[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dein Ausgehen und dein Eingehen mit mir im Lager ist gut in meinen Augen«; die Wendung kann das gesamte Verhalten oder den Dienst bezeichnen.'
    reason: lexikalische Alternative
  - marker: b
    text: Hebräisch seranim, der besondere Titel der philistäischen Herrscher. Gemeint sind hier die Fürsten der Philister.
    reason: kulturelle Erläuterung
  - marker: c
    text: 'Wörtlich: »du bist nicht gut«; gemeint sein kann: »du bist nicht akzeptabel« oder »du gefällst ihnen nicht«.'
    reason: Bewahrung einer knappen, mehrdeutigen Wertung
lexical_decisions:
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Die feste Schwurformel wird im Deutschen idiomatisch und zugleich eng am hebräischen Wortlaut wiedergegeben.
- source_word: יָשָׁר
  choice: aufrichtig
  rationale: Das Wort bezeichnet Geradheit beziehungsweise persönliche Integrität; »aufrichtig« ist in diesem Zusammenhang natürlich und bewahrt die ethische Wertung.
- source_word: טוֹב בְּעֵינַי
  choice: ich bin damit zufrieden
  rationale: Die hebräische Wendung bedeutet, dass etwas im Urteil des Sprechers gut beziehungsweise wohlgefällig ist. Die natürliche deutsche Formulierung gibt diese Bewertung wieder.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: wie du … aus- und eingehst
  rationale: Das Wortpaar wird sichtbar bewahrt, kann im Kontext aber idiomatisch das gesamte Verhalten beziehungsweise die Tätigkeit im Lager bezeichnen.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: mit mir im Lager
  rationale: מַחֲנֶה bezeichnet hier das militärische Lager; »mit mir« wahrt Achischs persönliche Perspektive.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: ich habe nichts Böses an dir gefunden
  rationale: Die Formulierung bleibt nahe an der gerichtlichen beziehungsweise moralischen Sprache des Hebräischen, ohne David darüber hinaus ausdrücklich für schuldlos zu erklären.
- source_word: מִיּוֹם בֹּאֲךָ אֵלַי עַד הַיּוֹם הַזֶּה
  choice: von dem Tag an, an dem du zu mir gekommen bist, bis heute
  rationale: Dies ist eine natürliche deutsche Wiedergabe der vollständigen Zeitspanne im hebräischen Text.
- source_word: סְרָנִים
  choice: Fürsten
  rationale: Der Ausdruck ist ein besonderer Titel für die führenden philistäischen Herrscher. Im unmittelbaren Kontext sind die Philister eindeutig bestimmt; eine Fußnote erläutert den Titel.
- source_word: לֹא טוֹב אָתָּה
  choice: du bist nicht annehmbar
  rationale: Das wörtliche »du bist nicht gut« ist im Deutschen missverständlich. Im Kontext bezeichnet die knappe Wendung das ablehnende Urteil der Fürsten, ohne einen moralischen Befund festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in einem Schwur des Philisterkönigs Achisch
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Gottesnamen wieder und lässt die auffällige Verwendung durch Achisch bestehen, ohne sie harmonisierend umzudeuten.
- issue: Charakterurteil über David im Spannungsfeld des Erzählzusammenhangs
  choice: Achischs Aussagen als sein Urteil formuliert
  alternative: David objektiv als schuldlos oder moralisch vollkommen darstellen
  rationale: Der Vers berichtet Achischs Einschätzung. Die Übersetzung wahrt diese Sprecherperspektive und entscheidet nicht über die weitergehende moralische Bewertung von Davids Verhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerisch natürlicher Syntax. Die direkte Rede bewahrt den feierlichen Schwur, während hebräische Idiome dort erläutert werden, wo eine rein wörtliche Wiedergabe im Deutschen missverständlich wäre.
