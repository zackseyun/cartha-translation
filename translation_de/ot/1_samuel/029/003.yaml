  to: 'Da sagten die Befehlshaber der Philister: „Was sollen diese Hebräer hier?“ Achisch antwortete den Befehlshabern der Philister: „Ist das nicht David, der Diener Sauls, des Königs von Israel? Er ist seit Tagen oder Jahren bei mir, und ich habe nichts gegen ihn gefunden – von dem Tag an, als er zu mir übergelaufen ist[a], bis zum heutigen Tag.“'
  rationale: Die Revision entfernt eine nicht ausdrücklich im Grundtext liegende Steigerung und berichtigt die Fußnote zu מִיּוֹם נָפְלוֹ. Die Übersetzung hält an „übergelaufen“ als kontextuell plausibler Hauptwiedergabe fest, während die Anmerkung die wörtliche Form und weniger spezifische Deutungsmöglichkeiten ohne dogmatische oder übermäßige Festlegung dokumentiert.
