  verdict: revise
  source_fidelity: Die Übersetzung gibt Sprecher, militärische Bezeichnung, ethnische Fremdbezeichnung, rhetorische Frage, Davids Verhältnis zu Saul und die Schlussaussage insgesamt zuverlässig wieder. „Was sollen diese Hebräer hier?“ ist eine natürliche Wiedergabe der elliptischen und argwöhnischen Frage. Bei מִיּוֹם נָפְלוֹ ist jedoch das Ziel des Überlaufens im hebräischen Suffix bereits enthalten; die Fußnote sollte dies nicht auf das bloße „er fiel“ verkürzen.
  naturalness: Modernes, gut lesbares Standarddeutsch. „seit Tagen oder sogar Jahren“ fügt mit „sogar“ eine im Grundtext nicht ausdrücklich markierte Steigerung hinzu; „seit Tagen oder Jahren“ ist ebenso idiomatisch und näher am Text.
  terminology: „Befehlshaber“, „Hebräer“, „Diener“ und „übergelaufen“ passen zum militärisch-politischen Kontext. Die Deutung von נפל als Überlaufen ist vertretbar, sollte aber in der Anmerkung als idiomatische Bedeutung samt der möglichen weniger spezifischen Alternative kenntlich bleiben.
