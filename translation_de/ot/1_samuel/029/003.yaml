  text: וַ/יֹּֽאמְרוּ֙ שָׂרֵ֣י פְלִשְׁתִּ֔ים מָ֖ה הָ/עִבְרִ֣ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר אָכִ֜ישׁ אֶל שָׂרֵ֣י פְלִשְׁתִּ֗ים הֲ/לֽוֹא זֶ֨ה דָוִ֜ד עֶ֣בֶד שָׁא֣וּל מֶֽלֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הָיָ֤ה אִתִּ/י֙ זֶ֤ה יָמִים֙ אוֹ זֶ֣ה שָׁנִ֔ים וְ/לֹֽא מָצָ֤אתִי ב/וֹ֙ מְא֔וּמָה מִ/יּ֥וֹם נָפְל֖/וֹ עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: de
  text: 'Da sagten die Befehlshaber der Philister: „Was sollen diese Hebräer hier?“ Achisch antwortete den Befehlshabern der Philister: „Ist das nicht David, der Diener Sauls, des Königs von Israel? Er ist seit Tagen oder Jahren bei mir, und ich habe nichts gegen ihn gefunden – von dem Tag an, als er zu mir übergelaufen ist[a], bis zum heutigen Tag.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „von dem Tag seines Fallens zu mir“. Gemeint sein kann, dass David zu Achisch überlief, zu ihm kam oder sich ihm anschloss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: die Befehlshaber der Philister
  rationale: Im militärischen Zusammenhang bezeichnet שָׂרִים hochrangige Führer; „Befehlshaber“ ist präzise und gegenwärtig.
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: Was sollen diese Hebräer hier?
  rationale: 'Die hebräische Frage ist elliptisch: wörtlich etwa „Was [sind] diese Hebräer?“ Die deutsche Wendung gibt ihren misstrauischen pragmatischen Sinn natürlich wieder, ohne eine konkrete Tätigkeit einzutragen.'
- source_word: הָעִבְרִים
  choice: Hebräer
  rationale: Bewahrt die ethnische Fremdbezeichnung aus philistäischer Perspektive, statt sie durch „Israeliten“ zu ersetzen.
- source_word: הֲלוֹא
  choice: Ist das nicht
  rationale: Gibt die rhetorische Frage wieder, die Zustimmung erwartet.
- source_word: עֶבֶד
  choice: Diener
  rationale: Bezeichnet hier Davids politisch-höfische Beziehung zu Saul; „Sklave“ wäre kontextuell irreführend.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: nun schon seit Tagen oder sogar Jahren
  rationale: Gibt die ungewöhnliche, wohl unbestimmte Zeitangabe verständlich wieder und bewahrt die Spannweite zwischen Tagen und Jahren.
- source_word: מְאוּמָה
  choice: nichts gegen ihn
  rationale: Das unbestimmte „irgendetwas/nichts“ meint im Kontext keinen Grund zu Beanstandung oder Anklage.
- source_word: מִיּוֹם נָפְלוֹ
  choice: von dem Tag an, als er zu mir überlief
  rationale: נפל kann im militärisch-politischen Zusammenhang das Überlaufen zu einer Partei bezeichnen. Das deutsche „überlaufen“ erhält diesen Sinn; das im Hebräischen nicht ausdrücklich wiederholte Ziel ergibt sich aus אִתִּי und Achischs Rede.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Natürliche deutsche Wiedergabe der betonten Zeitformel.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Eingangsfrage wird idiomatisch, aber weiterhin knapp wiedergegeben. Die schwerfällige hebräische Zeitformel bleibt in ihrer auffälligen Spannweite erhalten. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wiedergabe.
