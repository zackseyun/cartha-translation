source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: de
  text: 'David sagte zu Achisch: „Aber was habe ich getan? Und was hast du an deinem Diener gefunden, seit dem Tag, an dem ich in deinen Dienst trat, bis zum heutigen Tag[a], dass ich nicht mitziehen und gegen die Feinde meines Herrn, des Königs, kämpfen darf?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „seit dem Tag, an dem ich vor dir war, bis zum heutigen Tag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Aber was habe ich getan?
  rationale: כִּי leitet hier Davids Einwand gegen die zuvor getroffene Entscheidung ein. Das deutsche „Aber“ gibt diese diskursive und adversative Funktion natürlich wieder.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: Und was hast du an deinem Diener gefunden
  rationale: מצא mit ב bezeichnet hier das Feststellen eines Mangels oder eines belastenden Grundes. „An deinem Diener gefunden“ bleibt der hebräischen Konstruktion nahe und ist im Deutschen idiomatisch verständlich.
- source_word: בְעַבְדְּךָ
  choice: deinem Diener
  rationale: עבד dient in dieser höfischen Rede als ehrerbietige Selbstbezeichnung; „Diener“ wahrt das soziale Register besser als „Sklave“.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: seit dem Tag, an dem ich in deinen Dienst trat, bis zum heutigen Tag
  rationale: Wörtlich heißt es „seit dem Tag, an dem ich vor dir war“. Im Zusammenhang bezeichnet die Wendung die Zeit, in der David Achisch zugeordnet war; „in deinen Dienst trat“ gibt dies in natürlichem Deutsch wieder, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: dass ich nicht mitziehen und … kämpfen darf
  rationale: Der Satz formuliert Davids Beschwerde darüber, dass er nicht zum Kampf mitgehen soll beziehungsweise darf. „Mitziehen“ nimmt den militärischen Kontext von אָבוֹא natürlich auf, ohne das Ziel näher zu bestimmen.
- source_word: בְּאֹיְבֵי
  choice: gegen die Feinde
  rationale: Bei נלחם kennzeichnet ב den Gegner; „gegen … kämpfen“ ist die klare deutsche Entsprechung.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meines Herrn, des Königs
  rationale: אֲדֹנִי ist hier eine menschliche Ehrenbezeichnung. Die appositionelle Form wahrt sowohl den höfischen Ton als auch die im Erzählzusammenhang mögliche Mehrdeutigkeit des Bezuges.
theological_decisions:
- issue: Bezug und rhetorische Wirkung von „die Feinde meines Herrn, des Königs“
  choice: Die Wendung bleibt ohne ausdrückliche Identifizierung des gemeinten Königs stehen.
  alternative: Sie könnte als eindeutige, aufrichtige Bezeichnung Achischs verstanden oder als bewusst mehrdeutige Formulierung mit einem anderen möglichen Bezug gelesen werden.
  rationale: Der hebräische Text legt Davids innere Absicht nicht offen. Die unverdeutete Wiedergabe erhält die erzählerische und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit höfischer Selbstbezeichnung. Davids Einwand klingt natürlich und bestimmt, ohne die mögliche Doppelbödigkeit seiner Worte aufzulösen.
