base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: de
  text: 'Der König sagte zu ihr: »Hab keine Angst! Was hast du gesehen?[a]« Die Frau antwortete Saul: »Ich sehe göttliche Wesen[b] aus der Erde heraufsteigen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich entsprechend der hebräischen Verbform: »Was hast du gesehen?« Im unmittelbaren Zusammenhang ist auch der gegenwärtige Sinn »Was siehst du?« möglich.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort אֱלֹהִים und das zugehörige Partizip stehen hier in der Mehrzahl; daher ist auch die Wiedergabe »Götter« möglich. Der weitere Zusammenhang kann jedoch auf eine einzelne Erscheinung hindeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der hebräische Text verwendet das bestimmte Gattungswort und nennt Saul erst im folgenden Satzteil beim Namen.
- source_word: אַל תִּירְאִי
  choice: Hab keine Angst!
  rationale: Eine natürliche, gegenwärtige deutsche Wiedergabe des verneinten Imperativs, die den beruhigenden Ton wahrt.
- source_word: כִּי מָה רָאִית
  choice: Was hast du gesehen?
  rationale: Das Perfekt רָאִית wird formal als deutsche Perfektfrage wiedergegeben; כִּי muss hier in natürlichem Deutsch nicht eigens übersetzt werden.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der Vers bezeichnet sie schlicht als »die Frau«; eine Bezeichnung als Totenbeschwörerin würde Kontextwissen in den Wortlaut eintragen.
- source_word: אֱלֹהִים
  choice: ein göttliches Wesen
  rationale: Die Form ist grammatisch pluralisch, bezeichnet hier aber im unmittelbaren Erzählzusammenhang offenbar eine übermenschliche Erscheinung. Die Wiedergabe wahrt diesen Sinn, ohne die Gestalt mit Gott gleichzusetzen; die formale Mehrzahl wird in der Fußnote offengelegt.
- source_word: עֹלִים
  choice: heraufsteigen
  rationale: Das Partizip von עלה bezeichnet eine Aufwärtsbewegung. »Heraufsteigen« gibt sowohl die Bewegung als auch die Perspektive der Schauenden natürlich wieder.
- source_word: מִן הָאָרֶץ
  choice: aus der Erde
  rationale: Diese Wiedergabe bleibt nahe am hebräischen Ausdruck und bewahrt das Bild eines Hervorkommens von unten.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים im Bericht der Frau
  choice: ein göttliches Wesen
  alternative: Götter; göttliche Wesen; Gott
  rationale: Der Satz gibt die Wahrnehmung der Frau wieder und formuliert keine vom Erzähler erklärte Lehraussage. Die gewählte Fassung lässt die übernatürliche Identität offen, während die Fußnote die grammatische Mehrzahl des Hebräischen bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; grammatische und theologische Mehrdeutigkeit wird nicht im Haupttext überladen, sondern transparent in den Fußnoten bewahrt.
