  text: וַ/יִּקָּבְצ֣וּ פְלִשְׁתִּ֔ים וַ/יָּבֹ֖אוּ וַ/יַּחֲנ֣וּ בְ/שׁוּנֵ֑ם וַ/יִּקְבֹּ֤ץ שָׁאוּל֙ אֶת כָּל יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/גִּלְבֹּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: de
  text: Die Philister sammelten sich, kamen und schlugen bei Schunem ihr Lager auf. Saul versammelte ganz Israel, und sie schlugen auf dem Gilboa[a] ihr Lager auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Gilboa“ oder „auf dem Gilboa-Gebirge“. Gilboa bezeichnet das dortige Bergland.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: sammelten sich
  rationale: קבץ bezeichnet das Zusammenkommen beziehungsweise Sammeln. Die reflexive Formulierung ist im Deutschen natürlich und bewahrt den Sinn eines militärischen Zusammenziehens, ohne ihn durch „musterten“ zu präzisieren.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Eingebürgerte deutsche Bezeichnung der Volksgruppe.
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: Die schlichte Bedeutung von בוא wird beibehalten; militärisch stärker deutende Wiedergaben wie „rückten vor“ wären nicht ausdrücklich im Verb enthalten.
- source_word: וַיַּחֲנוּ
  choice: schlugen … ihr Lager auf
  rationale: חנה bezeichnet das Lagern beziehungsweise Aufschlagen eines Lagers. Diese Wendung ist modern, anschaulich und für beide Vorkommen passend.
- source_word: בְשׁוּנֵם
  choice: bei Schunem
  rationale: Die Präposition ב lokalisiert das Lager im Bereich des Ortes. „Bei Schunem“ klingt im militärischen Zusammenhang natürlich, ohne ein Lagern innerhalb der Siedlung zu behaupten.
- source_word: וַיִּקְבֹּץ
  choice: versammelte
  rationale: Dasselbe Verbum קבץ wie am Versanfang wird mit einer nahen deutschen Entsprechung wiedergegeben. „Versammelte“ passt natürlich zum transitiven Gebrauch mit Saul als handelndem Subjekt.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die kollektive hebräische Wendung bleibt erhalten und wird nicht ausdrücklich auf Männer oder Soldaten eingeengt.
- source_word: בַּגִּלְבֹּעַ
  choice: auf dem Gilboa
  rationale: Die Präposition ב kann hier aufgrund der gebirgigen Landschaft mit „auf“ wiedergegeben werden. „Gilboa“ bleibt entsprechend dem hebräischen Wortlaut ohne ergänzendes „Gebirge“ oder „Berg“ stehen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die Abfolge der hebräischen Wayyiqtol-Formen wird in flüssige deutsche Hauptsätze übertragen. Die Wiederholung von חנה bleibt durch dieselbe Wendung sichtbar; die mehrfache Satzverknüpfung mit „und“ wird teilweise durch Zeichensetzung geglättet.
