base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: de
  text: 'Und Jahwe hat für ihn gehandelt[a], wie er durch meine Hand[b] geredet hat: Jahwe hat das Königtum aus deiner Hand gerissen und es deinem Nächsten, David, gegeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „für ihn“; möglich ist, den Bezug reflexiv als „für sich“ zu verstehen. Viele Übersetzungen geben sinngemäß „an dir“ oder „für dich“ wieder; im masoretischen Text steht jedoch die Form der 3. Person Singular.'
    reason: alternative_reading
  - marker: b
    text: 'Das hebräische „durch meine Hand“ bedeutet hier auch: „durch mich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH als im Deutschen geläufige wissenschaftliche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיַּעַשׂ ... לוֹ
  choice: hat für sich getan
  rationale: Das masoretische לוֹ ist die Präposition לְ mit einem Suffix der 3. Person Singular („für ihn“); da Jahwe Subjekt ist, bewahrt „für sich“ die naheliegende reflexive Beziehung und glättet den schwierigen Wortlaut nicht zu „an dir“.
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: wie er durch meine Hand geredet hat
  rationale: Bewahrt das hebräische Bild בְּיַדִי („durch meine Hand“), das hier Samuel als prophetischen Vermittler bezeichnet.
- source_word: וַיִּקְרַע
  choice: hat ... gerissen
  rationale: Erhält die anschauliche Bedeutung von קָרַע („reißen, zerreißen“) und knüpft an das Motiv des entrissenen Königtums an.
- source_word: הַמַּמְלָכָה
  choice: das Königtum
  rationale: Bezeichnet hier Sauls königliche Herrschaft und lässt sich im Deutschen natürlicher aus jemandes Hand reißen und einem anderen geben als „Königreich“.
- source_word: מִיָּדֶךָ
  choice: aus deiner Hand
  rationale: Bewahrt das hebräische Bild für den Entzug von Besitz, Gewalt und Herrschaft.
- source_word: וַיִּתְּנָהּ
  choice: und es ... gegeben
  rationale: Das Pronomen „es“ nimmt das sächliche deutsche Wort „Königtum“ auf; die Perfektkonstruktion verbindet die beiden vollzogenen Handlungen.
- source_word: לְרֵעֲךָ
  choice: deinem Nächsten
  rationale: רֵעַ kann einen Nächsten, Gefährten oder Mitmenschen bezeichnen; der folgende Name David bestimmt die Person eindeutig.
- source_word: לְדָוִד
  choice: David
  rationale: Der Personenname steht als Apposition zu „deinem Nächsten“; die deutsche Kasusbeziehung macht ein zweites „an“ oder „zu“ unnötig.
theological_decisions:
- issue: Masoretische Lesart לוֹ im ersten Satzteil
  choice: „für sich“ als direkte Wiedergabe der überlieferten Lesart
  alternative: „an dir“ oder „für dich“
  rationale: Der vorgelegte masoretische Text hat לוֹ („für ihn/für sich“), nicht לְךָ („für dich“). Die ungewöhnliche Formulierung wird daher im Haupttext erhalten und durch eine Fußnote transparent gemacht, statt sie aus dem Zusammenhang heraus stillschweigend auf Saul umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „für sich getan“ und das Bild „durch meine Hand“ bleiben aus Gründen der Texttreue stehen; Fußnoten erläutern beide Stellen. „Königtum“ ist im Herrschaftskontext natürlicher und präziser als „Königreich“.
