base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: de
  text: 'Doch er weigerte sich und sagte: »Ich will nicht essen.« Da redeten seine Diener und auch die Frau eindringlich auf ihn ein[a], und er hörte auf sie[b]. So stand er vom Boden auf und setzte sich auf das Lager[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »sie drangen in ihn«; die hebräische Wendung bezeichnet beharrliches, nachdrückliches Einwirken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Er hörte auf ihre Stimme.«'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann ein Bett, ein Ruhelager oder eine Liege bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: er weigerte sich
  rationale: מָאֵן bezeichnet eine ausdrückliche Weigerung. Die Wendung ist im modernen deutschen Erzählstil direkt und natürlich.
- source_word: לֹא אֹכַל
  choice: Ich will nicht essen
  rationale: Die verneinte Imperfektform bringt hier Sauls entschiedene Weigerung zum Ausdruck, ohne ein im Hebräischen nicht genanntes Objekt hinzuzufügen.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: redeten eindringlich auf ihn ein
  rationale: Die idiomatische Verbindung פרץ ב bezeichnet hier nachdrängendes, beharrliches Einwirken und kein wörtliches Durchbrechen. Die deutsche Formulierung bewahrt die Intensität des Ausdrucks.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Im königlichen Zusammenhang sind damit die Männer in Sauls Dienst gemeint; ihr rechtlicher Status steht hier nicht im Vordergrund.
- source_word: וְגַם הָאִשָּׁה
  choice: und auch die Frau
  rationale: 'Die additive Bedeutung von וְגַם wird ausdrücklich bewahrt: Neben den Dienern wirkt auch die Frau auf Saul ein.'
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: er hörte auf sie
  rationale: Die deutsche idiomatische Wendung gibt das responsive Hören wieder, ohne es unnötig stark als Gehorsam festzulegen. Die wörtliche Bildsprache wird in einer Fußnote dokumentiert.
- source_word: מֵהָאָרֶץ
  choice: vom Boden
  rationale: אֶרֶץ bezeichnet in diesem Zusammenhang den Boden, auf dem Saul lag.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: setzte sich auf das Lager
  rationale: מִטָּה kann ein Bett, Ruhelager oder eine Liege bezeichnen. »Lager« wahrt die sachliche Offenheit und passt zum häuslichen Kontext.
