base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: de
  text: 'Er sagte zu ihr: „Wie sieht er aus?“ Sie antwortete: „Ein alter Mann steigt herauf[a]; er ist in einen Mantel gehüllt[b].“ Da erkannte Saul, dass es Samuel war. Er verneigte sich mit dem Gesicht zur Erde und warf sich nieder.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kommt herauf“. Das hebräische Partizip hebt die gerade stattfindende Aufwärtsbewegung hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „trägt einen Mantel“. Das Hebräische zeichnet anschaulicher das Bild eines Menschen, der darin eingehüllt ist.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann auch mit „verbeugte sich“, „huldigte“ oder in manchen Zusammenhängen „betete an“ wiedergegeben werden. Hier bezeichnet es zunächst eine tiefe ehrerbietige Niederwerfung vor der als Samuel erkannten Gestalt.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: Wie sieht er aus?
  rationale: תֹּאַר bezeichnet die sichtbare Gestalt oder das Aussehen. Die idiomatische Frage gibt Sauls Bitte um eine Beschreibung im modernen Deutsch klar wieder.
- source_word: אִישׁ זָקֵן
  choice: ein alter Mann
  rationale: Die Wendung bezeichnet unmittelbar einen Mann fortgeschrittenen Alters und wird schlicht und natürlich wiedergegeben.
- source_word: עֹלֶה
  choice: steigt herauf
  rationale: Das Partizip beschreibt eine gerade ablaufende Aufwärtsbewegung. „Steigt herauf“ bewahrt sowohl den Verlauf als auch die räumliche Richtung.
- source_word: עֹטֶה מְעִיל
  choice: ist in einen Mantel gehüllt
  rationale: עֹטֶה bezeichnet das Umhüllen oder Bedecken, nicht nur das Tragen; מְעִיל ist ein Mantel beziehungsweise mantelartiges Obergewand.
- source_word: וַיֵּדַע
  choice: Da erkannte Saul
  rationale: ידע bedeutet grundsätzlich „wissen/erkennen“; hier erkennt Saul aufgrund der gegebenen Beschreibung, um wen es sich handelt.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: dass es Samuel war
  rationale: Diese deutsche Identifikationsformel ist idiomatisch und wahrt die Aussage des Hebräischen, ohne mehr über die Erscheinung zu behaupten, als der Text ausdrücklich sagt.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: Er verneigte sich mit dem Gesicht zur Erde
  rationale: Die Formulierung bewahrt das konkrete Bild der tiefen Verbeugung, bei der das Gesicht zur Erde gerichtet ist.
- source_word: וַיִּשְׁתָּחוּ
  choice: und warf sich nieder
  rationale: Das Verb bezeichnet eine ehrerbietige Niederwerfung. Die Übersetzung unterscheidet die Handlung vom vorhergehenden Verneigen, ohne ausdrücklich kultische Anbetung zu behaupten.
theological_decisions:
- issue: Ob Sauls Gebärde gegenüber Samuel ausdrücklich als Anbetung bezeichnet werden soll
  choice: „warf sich nieder“
  alternative: „betete ihn an“, „huldigte ihm“ oder „verbeugte sich“
  rationale: שׁחה kann je nach Zusammenhang Anbetung, Huldigung oder eine ehrerbietige Niederwerfung bezeichnen. Hier schildert der Text zunächst die körperliche Gebärde gegenüber der als Samuel erkannten Gestalt. „Warf sich nieder“ bewahrt diese Handlung und die theologische Spannung, ohne eine kultische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt schlicht und anschaulich; konkrete Körperhaltung und Aufwärtsbewegung werden bewahrt. Die Formulierung vermeidet sowohl altertümliche Sprache als auch eine theologisch vereindeutigende Wiedergabe von שׁחה.
