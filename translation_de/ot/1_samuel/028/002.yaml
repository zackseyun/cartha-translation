base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: de
  text: 'David sagte zu Achisch: „Dann wirst du selbst erfahren, was dein Diener tun wird.[a]“ Achisch sagte zu David: „Gut, dann werde ich dich auf Dauer zu meinem Leibwächter machen.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wozu dein Diener fähig ist“. Davids Worte sind bewusst mehrdeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zum Wächter für meinen Kopf“, das heißt zu einem persönlichen Wächter oder Leibwächter Achischs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Dann / Gut, dann
  rationale: Das erste לָכֵן zieht die Folgerung aus Achischs vorheriger Aussage; „Dann“ gibt dies natürlich wieder. In Achischs Antwort signalisiert das Wort zustimmende Folgerung, daher „Gut, dann“.
- source_word: אַתָּה תֵדַע
  choice: du selbst wirst erfahren
  rationale: ידע bedeutet „wissen, erkennen, erfahren“. Das ausdrücklich gesetzte Pronomen אַתָּה wird durch „selbst“ betont; „erfahren“ klingt in dieser Ankündigung im Deutschen natürlich.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: was … tun wird
  rationale: Die Formulierung entspricht eng dem hebräischen Futur und bewahrt Davids Zurückhaltung darüber, was er tatsächlich tun wird.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: Hier ist עבד eine höfische Selbstbezeichnung der Unterordnung und keine eindeutige Aussage über den rechtlichen Status als Sklave.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: mein Leibwächter
  rationale: Wörtlich „Wächter für meinen Kopf“; die Wendung bezeichnet einen persönlichen Wächter, der Achischs Person schützt.
- source_word: אֲשִׂימְךָ
  choice: ich werde dich … machen
  rationale: שׂים bedeutet „setzen, einsetzen, bestimmen“; zusammen mit der Rollenbezeichnung ist „zu … machen“ idiomatisches Deutsch.
- source_word: כָּל הַיָּמִים
  choice: für alle Zeit
  rationale: Wörtlich „alle Tage“; die Wendung bezeichnet hier eine dauerhafte Einsetzung und wird im Deutschen natürlich mit „für alle Zeit“ wiedergegeben.
theological_decisions:
- issue: Davids mehrdeutige Zusage
  choice: Die Aussage bleibt bei „was dein Diener tun wird“ offen und wird nicht als ausdrückliches Versprechen militärischer Treue erklärt.
  alternative: „wozu dein Diener fähig ist“ oder eine eindeutige Zusage, für Achisch zu kämpfen
  rationale: Der hebräische Wortlaut benennt Davids künftiges Tun, lässt aber angesichts des Erzählzusammenhangs offen, gegen wen oder in wessen Interesse er handeln wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die höfische Selbstbezeichnung „dein Diener“ und die Betonung durch „du selbst“ bleiben erhalten; die ungewöhnliche hebräische Wendung für den persönlichen Wächter wird im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
