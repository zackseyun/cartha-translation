  - severity: low
    issue: „für alle Zeit“ ist stärker und weniger idiomatisch als nötig.
    rationale: כָּל הַיָּמִים meint fortdauernd bzw. alle Tage. „auf Dauer“ gibt die beabsichtigte permanente Bestellung natürlich wieder, ohne eine metaphysisch absolute Dauer zu suggerieren.
