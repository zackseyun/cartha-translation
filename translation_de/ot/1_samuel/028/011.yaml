source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה אֶת מִ֖י אַֽעֲלֶה לָּ֑/ךְ וַ/יֹּ֕אמֶר אֶת שְׁמוּאֵ֖ל הַֽעֲלִי לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: de
  text: 'Da sagte die Frau: „Wen soll ich für dich heraufbringen[a]?“ Er sagte: „Bring mir Samuel herauf.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heraufbeschwören“. Das hebräische Verb bedeutet wörtlich „heraufbringen“ oder „heraufkommen lassen“ und steht hier im Zusammenhang mit der Befragung eines Toten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da“ gibt die zeitliche und narrative Folge im modernen Deutschen natürlich wieder.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה bezeichnet hier die zuvor genannte Frau von En-Dor; „die Frau“ ist die schlichte, kontextgemäße Wiedergabe.
- source_word: אֶת מִי
  choice: Wen
  rationale: Die Objektpartikel אֶת kennzeichnet das Fragewort als direktes Objekt; daher ist „wen“ grammatisch präzise.
- source_word: אַעֲלֶה
  choice: soll ich ... heraufbringen
  rationale: Der Hifil von עלה bedeutet „hinauf-/heraufbringen, heraufkommen lassen“. „Heraufbringen“ bewahrt das räumliche Bild und bleibt gegenüber den behaupteten Vorgängen zurückhaltend.
- source_word: לָךְ
  choice: für dich
  rationale: 'Die Präposition ל ist hier benefaktiv: Die Handlung soll zugunsten Sauls erfolgen.'
- source_word: וַיֹּאמֶר
  choice: Er sagte
  rationale: Die einfache Fortführung des Dialogs ist im Deutschen ohne ein zusätzliches „und“ natürlich; die narrative Abfolge bleibt klar.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: Die Objektpartikel bleibt unübersetzt; der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: הַעֲלִי
  choice: Bring ... herauf
  rationale: Der feminine Singular des Hifil-Imperativs richtet sich an die Frau. Die Wiedergabe hält die Wortwahl gegenüber אַעֲלֶה konsequent bei.
- source_word: לִי
  choice: mir
  rationale: Der deutsche Dativ „mir“ drückt die benefaktive Bedeutung von ל idiomatisch und knapp aus.
theological_decisions:
- issue: Wiedergabe des nekromantischen Sprachgebrauchs von עלה
  choice: heraufbringen
  alternative: heraufbeschwören; heraufkommen lassen
  rationale: „Heraufbringen“ entspricht der Grundbedeutung des hebräischen Verbs und bewahrt dessen Bildsprache, ohne die Art oder Wirksamkeit des Vorgangs theologisch zu erklären. „Heraufbeschwören“ wäre kontextuell möglich, aber stärker deutend.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „heraufbringen/herauf“ spiegelt bewusst die lexikalische Wiederholung im Hebräischen; „Bring mir Samuel herauf“ ist idiomatischer als „Bring Samuel für mich herauf“.
