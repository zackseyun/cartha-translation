  text: וְ/לָ/אִשָּׁ֤ה עֵֽגֶל מַרְבֵּק֙ בַּ/בַּ֔יִת וַ/תְּמַהֵ֖ר וַ/תִּזְבָּחֵ֑/הוּ וַ/תִּקַּח קֶ֣מַח וַ/תָּ֔לָשׁ וַ/תֹּפֵ֖/הוּ מַצּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: de
  text: Die Frau hatte ein gemästetes Kalb im Haus[a]. Sie beeilte sich, schlachtete es[b], nahm Mehl, knetete es und backte daraus ungesäuerte Brote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein im Stall gemästetes Kalb“.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „schlachten“ wiedergegebene Verb kann in anderen Zusammenhängen auch das Schlachten eines Opfertieres bezeichnen; hier dient das Tier jedoch als Mahlzeit.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ungesäuerte Fladen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: gemästetes Kalb
  rationale: עֵגֶל bezeichnet ein junges Rind; מַרְבֵּק beschreibt ein zur Mast gehaltenes beziehungsweise im Stall gefüttertes Tier. „Gemästetes Kalb“ ist präzise und in modernem Deutsch natürlich.
- source_word: בַּבַּיִת
  choice: im Haus
  rationale: Die Wendung ist konkret örtlich zu verstehen. „Im Haus“ bewahrt diese Bedeutung besser als das allgemeinere „zu Hause“.
- source_word: וַתְּמַהֵר
  choice: sie beeilte sich
  rationale: Das Verb bezeichnet rasches, eiliges Handeln und trägt zur Dringlichkeit der Erzählung bei.
- source_word: וַתִּזְבָּחֵהוּ
  choice: schlachtete es
  rationale: Das Verb kann je nach Kontext auch eine Opferschlachtung bezeichnen; hier geht es jedoch um das Schlachten eines Tieres zur Zubereitung einer Mahlzeit.
- source_word: קֶמַח
  choice: Mehl
  rationale: Das Substantiv bezeichnet Mehl, das zum Backen verwendet wird.
- source_word: וַתָּלָשׁ
  choice: knetete es
  rationale: Das Verb bezeichnet das Kneten; das Pronomen gibt den vorbereiteten Teig beziehungsweise das verarbeitete Mehl idiomatisch wieder.
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: backte daraus ungesäuerte Brote
  rationale: Die Formulierung bewahrt den Vorgang des Backens und gibt den morphologischen Plural מַצּוֹת als „ungesäuerte Brote“ wieder. „Daraus“ stellt im Deutschen den natürlichen Bezug zum zuvor genannten Mehl beziehungsweise Teig her.
theological_decisions:
- issue: Mögliche kultische Bedeutung von זבח
  choice: schlachtete
  alternative: opferte
  rationale: Der unmittelbare Zusammenhang beschreibt die Zubereitung einer Mahlzeit. Daher ist keine Opferhandlung anzunehmen; zugleich wird die in anderen Kontexten mögliche kultische Verwendung des Verbs in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die aufeinanderfolgenden Handlungen bleiben knapp und zügig. Ein einleitendes „Nun“ wurde vermieden, da im Hebräischen kein ausdrückliches Zeitadverb steht; die narrative Verknüpfung ergibt sich aus dem Zusammenhang.
