source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בַּֽ/יהוָ֔ה וְ/לֹ֥א עָנָ֖/הוּ יְהוָ֑ה גַּ֧ם בַּ/חֲלֹמ֛וֹת גַּ֥ם בָּ/אוּרִ֖ים גַּ֥ם בַּ/נְּבִיאִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: de
  text: Saul befragte Jahwe, aber Jahwe antwortete ihm nicht – weder durch Träume noch durch die Urim[a] noch durch die Propheten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Urim waren ein priesterliches Mittel, mit dem man göttliche Weisung suchte.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: befragte Jahwe
  rationale: שׁאל mit ב und dem Gottesnamen bezeichnet hier das Einholen göttlicher Weisung. „Jahwe befragen“ ist im Deutschen prägnant und macht deutlicher als das allgemeinere „fragen“, dass Saul eine göttliche Auskunft suchte.
- source_word: וְלֹא עָנָהוּ יְהוָה
  choice: aber Jahwe antwortete ihm nicht
  rationale: ענה bezeichnet hier die ausbleibende Antwort auf Sauls Anfrage. „Aber“ gibt den sachlichen Gegensatz im Deutschen natürlich wieder.
- source_word: גַּם ... גַּם ... גַּם
  choice: weder ... noch ... noch
  rationale: Nach der verneinten Hauptaussage drückt diese deutsche Reihung klar aus, dass auf keinem der drei genannten Wege eine Antwort kam.
- source_word: בַּחֲלֹמוֹת
  choice: durch Träume
  rationale: Die Präposition ב bezeichnet in der Aufzählung das Mittel beziehungsweise den Offenbarungsweg.
- source_word: בָּאוּרִים
  choice: durch die Urim
  rationale: Der überlieferte Fachbegriff bleibt unübersetzt, weil seine genaue Beschaffenheit und Funktionsweise nicht sicher genug sind, um ihn genauer zu übertragen.
- source_word: בַּנְּבִיאִם
  choice: durch die Propheten
  rationale: „Durch“ kennzeichnet die Propheten parallel zu Träumen und Urim als mögliche Vermittler göttlicher Antwort.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Grund für das Ausbleiben der Antwort
  choice: Keine Begründung hinzugefügt
  alternative: Das Schweigen als ausdrückliche Verwerfung oder Strafe erklären
  rationale: Der Vers stellt nur fest, dass Jahwe auf keinem der genannten Wege antwortete; den Grund dafür nennt er hier nicht. Diese Spannung bleibt bestehen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Gedankenstrich gliedert die dreifache, nachdrückliche Verneinung; der kultische Fachbegriff „Urim“ wird knapp in einer Fußnote erläutert.
