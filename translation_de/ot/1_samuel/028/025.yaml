  yaml_path: translation/ot/1_samuel/028/025.yaml
  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: de
  text: Dann setzte sie Saul und seinen Dienern das Essen vor[a], und sie aßen. Danach standen sie auf und gingen in jener Nacht fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dann brachte sie [es] vor Saul und vor seine Diener.“ Das Objekt ist nicht ausdrücklich genannt; aus dem vorherigen Zusammenhang ist das zubereitete Essen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: Dann stellte sie … das Essen hin
  rationale: Das Hifil von נגשׁ bezeichnet hier das Heranbringen beziehungsweise Vorsetzen. Das im Hebräischen nicht ausdrücklich genannte Objekt wird aus dem vorherigen Zusammenhang als das zubereitete Essen ergänzt, damit der deutsche Satz natürlich und eindeutig ist.
- source_word: לִפְנֵי שָׁאוּל וְלִפְנֵי עֲבָדָיו
  choice: Saul und seinen Dienern
  rationale: Wörtlich steht zweimal „vor“. Beim Vorsetzen von Speisen gibt die deutsche Dativkonstruktion den Sinn idiomatisch wieder; die Wiederholung muss nicht nachgebildet werden.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עבד kann je nach Zusammenhang Diener, Knecht, Sklave oder Gefolgsmann bedeuten. Hier sind Sauls begleitende Männer in seinem Dienst gemeint; „Diener“ bleibt nah am Grundwort, ohne einen rechtlichen Sklavenstatus festzulegen.
- source_word: וַיֹּאכֵלוּ
  choice: und sie aßen
  rationale: Das Verb nennt kein ausdrückliches Objekt; dieses ist aus dem Zusammenhang klar und kann auch im Deutschen unausgesprochen bleiben.
- source_word: וַיָּקֻמוּ
  choice: Danach standen sie auf
  rationale: Die Form führt die Erzählfolge weiter. „Standen sie auf“ ist natürliches modernes Deutsch und bewahrt die konkrete Bedeutung.
- source_word: וַיֵּלְכוּ
  choice: und gingen … fort
  rationale: הלך bedeutet grundsätzlich „gehen“. Der Zusammenhang zeigt, dass Saul und seine Männer den Ort verlassen; „fortgehen“ drückt dies im Deutschen idiomatisch aus.
- source_word: בַּלַּיְלָה הַהוּא
  choice: noch in derselben Nacht
  rationale: Die Wendung bedeutet wörtlich „in jener Nacht“. „Noch in derselben Nacht“ gibt in diesem Rückbezug den zeitlichen Zusammenhang natürlich wieder, ohne eine zusätzliche Handlung einzuführen.
