  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: de
  text: 'Da schwor Saul ihr bei Jahwe und sagte: »So wahr Jahwe lebt: In dieser Sache wird dich keine Strafe treffen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »In dieser Sache wird dich keine Schuld treffen.« Das hebräische Wort kann eine Verfehlung, die daraus entstehende Schuld oder deren strafende Folge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Das Nifal von שׁבע bezeichnet das Schwören eines Eides; »schwor« ist im Deutschen natürlich und bewahrt den feierlichen Charakter.
- source_word: לָהּ
  choice: ihr
  rationale: Der indirekte Bezug wird im Deutschen idiomatisch mit dem Dativpronomen wiedergegeben.
- source_word: בַּיהוָה
  choice: bei Jahwe
  rationale: Die Präposition kennzeichnet hier die angerufene Instanz des Eides; »bei Jahwe schwören« ist die natürliche deutsche Formulierung.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Diese feste deutsche Eidesformel gibt die hebräische Wendung idiomatisch und mit ihrer vollen Bekräftigung wieder.
- source_word: אִם
  choice: keine
  rationale: In einer Eidesformel leitet אִם eine verkürzte Selbstverwünschung und damit eine nachdrückliche Verneinung ein; eine wörtliche Wiedergabe mit »wenn« wäre im Deutschen missverständlich.
- source_word: יִקְּרֵךְ
  choice: wird ... auf dich kommen
  rationale: קרא bezeichnet hier, dass etwas jemanden trifft oder ihm widerfährt; die Formulierung bleibt nahe am hebräischen Bild und ist verständlich.
- source_word: עָוֺן
  choice: Schuld
  rationale: עָוֺן kann Verfehlung, Schuld oder deren Straffolge bezeichnen. »Schuld« bewahrt die lexikalische und theologische Spannung des Ausdrucks; die mögliche Bedeutung »Strafe« wird in der Fußnote genannt.
- source_word: בַּדָּבָר הַזֶּה
  choice: in dieser Sache
  rationale: Die Formulierung gibt דָּבָר in diesem Zusammenhang natürlich wieder und verweist auf die gerade verlangte Handlung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Gottesname erkennbar bleibt.
- issue: Bedeutung von עָוֺן in Sauls Eid
  choice: Schuld
  alternative: Strafe; Verfehlung
  rationale: Der Kontext legt zwar eine zugesicherte Straffreiheit nahe, doch עָוֺן selbst kann sowohl Schuld als auch die daraus folgende Strafe bezeichnen. Die Hauptübersetzung bewahrt diese Mehrdeutigkeit, statt Saul ausdrücklich erklären zu lassen, die Handlung sei moralisch unschuldig; die Fußnote nennt die kontextuell naheliegende Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Nennung »Jahwe« folgt dem hebräischen Text und erhält die feierliche Eidesformel. »Da« verbindet den Satz erzählerisch mit dem vorausgehenden Geschehen.
