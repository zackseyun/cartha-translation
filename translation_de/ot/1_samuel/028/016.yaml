source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: de
  text: 'Samuel sagte: „Warum fragst du dann mich? Jahwe hat sich doch von dir abgewandt und ist dein Gegner[a] geworden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: Samuel sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. Im modernen deutschen Erzählstil ist die unmarkierte Formulierung „Samuel sagte“ natürlicher als ein stets ausdrücklich wiedergegebenes „Und“.
- source_word: וְלָמָּה
  choice: Warum … dann
  rationale: „Dann“ gibt die verbindende und folgernde Kraft von וְ in der zugespitzten Gegenfrage wieder.
- source_word: תִּשְׁאָלֵנִי
  choice: fragst du … mich
  rationale: 'שׁאל bedeutet hier „fragen“ beziehungsweise „befragen“. Die Stellung von „mich“ nach „dann“ betont den Gegensatz: Saul wendet sich an Samuel, obwohl Jahwe sich von ihm abgewandt hat.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen übliche wissenschaftlich begründete Form.
- source_word: סָר מֵעָלֶיךָ
  choice: hat sich doch von dir abgewandt
  rationale: סור mit מֵעַל bezeichnet hier das Sich-Abwenden beziehungsweise Entfernen von einer Person. „Doch“ macht den begründenden, rhetorisch vorwurfsvollen Zusammenhang im Deutschen natürlich deutlich, ohne den Sachgehalt zu verändern.
- source_word: וַיְהִי עָרֶךָ
  choice: ist dein Gegner geworden
  rationale: עָר bezeichnet einen Gegner oder Feind. „Gegner“ bewahrt die Vorstellung aktiver Gegnerschaft, ohne die Aussage abzuschwächen; das Verb היה wird als eingetretener Zustand „ist … geworden“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich der Eigenname יהוה. Seine Wiedergabe als „Jahwe“ lässt erkennen, dass Samuel vom Gott Israels mit seinem Namen spricht.
- issue: Jahwes Verhältnis zu Saul
  choice: ist dein Gegner geworden
  alternative: ist dein Feind geworden
  rationale: Die scharfe Aussage des hebräischen Textes wird nicht zu bloßem Missfallen abgeschwächt. „Gegner“ bezeichnet wirkliche Gegnerschaft; „Feind“ ist ebenfalls lexikalisch möglich und wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Schärfe der Frage und die ernste Aussage über Jahwes Gegnerschaft bleiben erhalten. „Doch“ stellt den im Hebräischen durch den Satzanschluss ausgedrückten Begründungszusammenhang idiomatisch her.
