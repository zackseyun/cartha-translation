  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: de
  text: Weil du nicht auf die Stimme Jahwes gehört und seinen glühenden Zorn nicht an Amalek vollstreckt hast,[a] deshalb hat Jahwe dir dies heute getan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Zornesglut nicht an Amalek ausgeführt hast“.'
    reason: Lexikalische Alternative für die ungewöhnliche hebräische Wendung עָשִׂיתָ חֲרוֹן אַפּוֹ.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Weil
  rationale: Die Konjunktion begründet hier das angekündigte Gericht über Saul; „weil“ gibt diese kausale Funktion natürlich wieder.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: auf die Stimme Jahwes gehört
  rationale: Die hebräische Wendung bezeichnet gehorsames Hören. Die Formulierung bewahrt das Bild der „Stimme“ und lässt den Gehorsam im Kontext deutlich werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: seinen glühenden Zorn … vollstreckt
  rationale: Die ungewöhnliche Verbindung aus „tun“ und „Zornesglut“ meint hier, den gegen Amalek angeordneten Zorn zu vollziehen. „Vollstrecken“ macht den gerichtlichen Handlungssinn deutlich, während „glühend“ das hebräische Hitze-Bild bewahrt.
- source_word: בַּעֲמָלֵק
  choice: an Amalek
  rationale: „An“ bezeichnet im Deutschen natürlich denjenigen, an dem das Strafgericht vollstreckt wird.
- source_word: עַל כֵּן
  choice: darum
  rationale: Das Wort markiert die Folge von Sauls Ungehorsam und wird mit einem klaren kausalen Anschluss wiedergegeben.
- source_word: הַדָּבָר הַזֶּה
  choice: das
  rationale: Das Demonstrativpronomen verweist natürlich auf das unmittelbar zuvor angekündigte Geschehen; „diese Sache“ wäre im modernen Deutschen unnötig schwerfällig.
- source_word: עָשָׂה לְךָ יְהוָה
  choice: hat Jahwe dir … angetan
  rationale: Das Verb עשה mit לְךָ bezeichnet hier das von Jahwe über Saul gebrachte Gericht. „Dir angetan“ wahrt die nachteilige Zielrichtung der Konstruktion.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: „Heute“ ist die natürliche moderne Entsprechung und bewahrt den zeitlichen Nachdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Ausführung von Jahwes Zorn gegen Amalek
  choice: seinen glühenden Zorn an Amalek vollstreckt
  alternative: seine Zornesglut an Amalek ausgeführt
  rationale: Die Formulierung beschreibt Sauls unterlassene Ausführung des zuvor ergangenen Gerichtsbefehls, ohne die Spannung abzumildern. Zugleich bleibt das Hitze-Bild von חֲרוֹן אַף erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die kausale Doppelstruktur „Weil …, darum …“. „Auf die Stimme … gehört“ erhält das hebräische Sprachbild, während „vollstreckt“ den gerichtlichen Kontext verständlich macht.
