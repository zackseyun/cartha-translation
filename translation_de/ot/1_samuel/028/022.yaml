  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: de
  text: Und nun höre doch auch du auf deine Magd[a][b]. Lass mich dir ein Stück Brot[c] vorsetzen und iss, damit du Kraft hast; denn du wirst dich auf den Weg machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienerin“. Das hebräische Wort bezeichnet ausdrücklich eine weibliche Dienstperson beziehungsweise Magd.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Höre auf die Stimme deiner Magd.“ Die hebräische Wendung bedeutet, auf sie zu hören oder ihr Folge zu leisten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „einen Bissen Brot“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss an das Vorhergehende als auch die einleitende Dringlichkeit des hebräischen Gesprächssignals.
- source_word: שְׁמַע נָא גַם אַתָּה
  choice: höre doch auch du
  rationale: „Doch“ gibt die höflich-dringliche Bitte נָא wieder; „auch du“ bewahrt den nachdrücklichen wechselseitigen Bezug von גַם אַתָּה.
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: auf deine Magd
  rationale: „Auf jemanden hören“ gibt die hebräische Wendung idiomatisch wieder. „Magd“ wahrt das ausdrücklich feminine und sozial untergeordnete Selbstverständnis der Sprecherin.
- source_word: וְאָשִׂמָה לְפָנֶיךָ
  choice: Lass mich dir … vorsetzen
  rationale: Die Kohortativform drückt ein Angebot beziehungsweise eine höfliche Absicht aus; „vorsetzen“ ist im Zusammenhang mit Speise natürlich.
- source_word: פַּת לֶחֶם
  choice: ein Stück Brot
  rationale: פַּת bezeichnet ein Stück oder einen Bissen; „ein Stück Brot“ ist genau und in modernem Deutsch geläufig.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: damit du Kraft hast
  rationale: Gibt die gewünschte Folge beziehungsweise den Zweck knapp und natürlich wieder, ohne die körperliche Kraft näher auszudeuten.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: denn du musst dich auf den Weg machen
  rationale: Gibt den begründenden Anschluss mit כִּי und die im Kontext unmittelbar bevorstehende Weiterreise idiomatisch wieder. Das praktische Müssen liegt im Zusammenhang, auch wenn die hebräische Verbform selbst Zukunft beziehungsweise bevorstehendes Handeln bezeichnet.
theological_decisions: []
