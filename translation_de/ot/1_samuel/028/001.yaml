base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: de
  text: 'In jener Zeit zogen die Philister ihre Heerlager zum Krieg zusammen, um gegen Israel zu kämpfen. Achisch sagte zu David: »Du weißt doch ganz genau, dass du mit mir im Heer ausziehen musst[a] – du und deine Männer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass du mit mir im Heerlager ausziehen wirst“. Das hebräische Wort kann das Lager selbst oder die dort versammelte Streitmacht bezeichnen; die Verbform kann als Zukunft oder im Zusammenhang als verbindliche Erwartung verstanden werden.'
    reason: Lexikalische und modale Alternative des hebräischen Ausdrucks.
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: In jener Zeit
  rationale: Die hebräische Erzählformel leitet eine neue Szene ein. „In jener Zeit“ gibt den zeitlichen Bezug natürlich wieder, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes „Nun“ einzuführen.
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם לַצָּבָא
  choice: zogen die Philister ihre Heerlager zum Krieg zusammen
  rationale: מַחֲנֶה bezeichnet zunächst ein Lager oder Heerlager und kann metonymisch die dort versammelte Streitmacht meinen. „Heerlager“ bleibt bildlich nahe am Hebräischen; „zusammenziehen“ ist im militärischen Zusammenhang natürlich.
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: um gegen Israel zu kämpfen
  rationale: Die Zweckangabe und die feindliche Ausrichtung werden unmittelbar und idiomatisch wiedergegeben.
- source_word: יָדֹעַ תֵּדַע
  choice: Du weißt doch ganz genau
  rationale: Der absolute Infinitiv verstärkt die finite Verbform. „Doch ganz genau“ vermittelt sowohl die Emphase als auch Achischs nachdrückliche Erwartung.
- source_word: אִתִּי תֵּצֵא
  choice: dass du mit mir … ausziehen musst
  rationale: Wörtlich steht eine Zukunftsform („du wirst ausziehen“); im Zusammenhang äußert Achisch damit eine verbindliche Erwartung. „Musst“ gibt diese pragmatische Kraft im Deutschen klar wieder.
- source_word: בַּמַּחֲנֶה
  choice: im Heer
  rationale: Das Wort bezeichnet wörtlich das Lager oder Heerlager, kann hier aber die ausziehende Streitmacht meinen. „Im Heer ausziehen“ ist im Deutschen verständlicher als „im Lager ausziehen“; die engere Wiedergabe steht in der Fußnote.
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: du und deine Männer
  rationale: Die ausdrückliche Nennung des Pronomens hebt David selbst neben seinen Männern hervor; die Nachstellung bewahrt diesen Nachdruck auf natürliche Weise.
- source_word: אָכִישׁ
  choice: Achisch
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Militärische Begriffe bleiben anschaulich und quellennah; die etwas sperrige hebräische Wortstellung wird für flüssiges Deutsch geordnet, während Davids ausdrückliche Hervorhebung erhalten bleibt.
