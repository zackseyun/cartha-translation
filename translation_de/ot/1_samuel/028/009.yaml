base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: de
  text: 'Doch die Frau sagte zu ihm: „Du weißt doch selbst, was Saul getan hat: Er hat die Totenbeschwörer und Wahrsager[a] aus dem Land ausgerottet. Warum stellst du mir also eine Falle, um meinen Tod herbeizuführen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Geisterbeschwörer und die mit einem Wahrsagegeist“; die genaue Abgrenzung der beiden hebräischen Bezeichnungen ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה אֵלָיו
  choice: Doch die Frau sagte zu ihm
  rationale: Das narrative וַ wird hier wegen des vorsichtigen Widerspruchs der Frau adversativ mit „Doch“ wiedergegeben; Subjekt und Adressat bleiben ausdrücklich erhalten.
- source_word: הִנֵּה אַתָּה יָדַעְתָּ
  choice: Du weißt doch selbst
  rationale: „doch“ gibt die aufmerksamkeitslenkende und nachdrückliche Funktion von הִנֵּה idiomatisch wieder; „selbst“ bewahrt die Betonung durch das ausdrückliche Pronomen אַתָּה.
- source_word: אֵת אֲשֶׁר עָשָׂה שָׁאוּל
  choice: was Saul getan hat
  rationale: Natürliche deutsche Wiedergabe des Objektsatzes, ohne die zeitliche Einordnung unnötig zu präzisieren.
- source_word: הִכְרִית
  choice: ausgerottet
  rationale: Das Verb bezeichnet hier die entschlossene Beseitigung der betreffenden Personen aus dem Land; „ausgerottet“ bewahrt die Schärfe, ohne zwingend festzulegen, ob jeder Einzelne getötet wurde.
- source_word: הָאֹבוֹת
  choice: die Totenbeschwörer
  rationale: Im Kontext bezeichnet אוֹב Personen, die Tote beziehungsweise Geister befragen. „Totenbeschwörer“ ist im modernen Deutsch verständlich und lässt die ontologische Frage nach dem Vorgang offen.
- source_word: הַיִּדְּעֹנִי
  choice: Wahrsager
  rationale: Der Ausdruck bezeichnet okkulte Wissenspraktiker. „Wahrsager“ ist zugänglich, vermeidet die märchenhafte Färbung von „Zauberer“ und bleibt bewusst allgemein.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: Gemeint ist in diesem Zusammenhang das Herrschafts- beziehungsweise Landesgebiet Israels, nicht die ganze Erde.
- source_word: וְלָמָה אַתָּה מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: Warum stellst du mir also eine Falle
  rationale: „also“ bildet die Folgerung ab; „eine Falle stellen“ bewahrt die Bildsprache von מִתְנַקֵּשׁ in natürlichem Deutsch. Das hebräische נֶפֶשׁ wird zusammen mit dem Folgesatz als Bedrohung ihres Lebens ausgedrückt.
- source_word: לַהֲמִיתֵנִי
  choice: und bringst mich damit in Lebensgefahr
  rationale: Der Infinitiv bezeichnet den tödlichen Zweck beziehungsweise die tödliche Folge der Falle. Die Formulierung ist idiomatisch und bewahrt, dass ihr Leben auf dem Spiel steht, ohne den Besucher ausdrücklich selbst zum Vollstrecker zu machen.
theological_decisions:
- issue: Bezeichnungen für verbotene okkulte Praktiker
  choice: Totenbeschwörer und Wahrsager
  alternative: Geisterbeschwörer und Leute mit einem Wahrsagegeist
  rationale: Die gewählten Begriffe benennen die Praktiken verständlich, ohne zu entscheiden, ob tatsächlich Tote oder Geister erschienen oder wie die behauptete Erkenntnis zustande kam.
- issue: Bedeutung von Sauls Maßnahme
  choice: aus dem Land ausgerottet
  alternative: aus dem Land entfernt / vertrieben
  rationale: הִכְרִית ist stärker als bloßes Vertreiben. Die Übersetzung bewahrt diese Härte, legt aber nicht über den Text hinaus fest, auf welche Weise jeder Betroffene beseitigt wurde.
- issue: Absicht hinter der Falle
  choice: bringst mich damit in Lebensgefahr
  alternative: um mich töten zu lassen / um mich zu töten
  rationale: Das Hebräische nennt als Ziel das Töten der Frau, lässt jedoch offen, ob der vermeintliche Kunde sie selbst töten oder ihre Hinrichtung veranlassen würde. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, mündlich glaubwürdiger Rede. Die Satzstruktur ist gut verständlich; die Bildsprache der Falle und die Schärfe von Sauls Vorgehen bleiben erhalten.
