translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Die weibliche Selbstbezeichnung wird mit »Dienerin« bewahrt; eine schwer verständliche wörtliche Übertragung der Lebensgefahr steht nur in der Fußnote.
