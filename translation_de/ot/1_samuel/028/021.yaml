source:
  edition: WLC
  text: וַ/תָּב֤וֹא הָֽ/אִשָּׁה֙ אֶל שָׁא֔וּל וַ/תֵּ֖רֶא כִּי נִבְהַ֣ל מְאֹ֑ד וַ/תֹּ֣אמֶר אֵלָ֗י/ו הִנֵּ֨ה שָׁמְעָ֤ה שִׁפְחָֽתְ/ךָ֙ בְּ/קוֹלֶ֔/ךָ וָ/אָשִׂ֤ים נַפְשִׁ/י֙ בְּ/כַפִּ֔/י וָֽ/אֶשְׁמַע֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: de
  text: 'Die Frau kam zu Saul. Als sie sah, dass er sehr erschrocken war, sagte sie zu ihm: »Sieh doch, deine Dienerin hat auf deine Stimme gehört[a]. Ich habe mein Leben aufs Spiel gesetzt[b] und auf die Worte gehört, die du zu mir gesprochen hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deine Dienerin hat auf deine Stimme gehört«; die hebräische Wendung bedeutet hier, dass sie Sauls Aufforderung befolgt hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ich habe mein Leben in meine Hand gelegt« – eine hebräische Redewendung für »mein Leben riskiert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל שָׁאוּל
  choice: Die Frau kam zu Saul
  rationale: Die Erzählform führt die Handlung fort; »kam zu Saul« gibt die Bewegung schlicht wieder, ohne die Frau durch eine aus dem Kontext ergänzte Bezeichnung näher zu bestimmen.
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: Als sie sah, dass er sehr erschrocken war
  rationale: נבהל bezeichnet hier starkes Erschrecken oder Bestürztsein; מְאֹד wird direkt mit »sehr« wiedergegeben. Die temporale Verbindung ist im Deutschen natürlicher als eine rein aneinandergereihte Satzfolge.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Der Aufmerksamkeitsruf leitet den nachdrücklichen Appell der Frau ein. »Sieh doch« ist gegenwärtig, würdig und weniger altertümlich als »Siehe«.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: deine Dienerin hat auf deine Stimme gehört
  rationale: שִׁפְחָה ist eine weibliche Dienerin und dient hier als demütige Selbstbezeichnung. Die deutsche Wendung »auf deine Stimme gehört« bewahrt das Bild und vermittelt zugleich die idiomatische Bedeutung »gehorcht«.
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: Ich habe mein Leben aufs Spiel gesetzt
  rationale: Die hebräische Redewendung bedeutet, das eigene Leben bewusst einer Gefahr auszusetzen. Die idiomatische deutsche Wiedergabe vermittelt den Sinn klar; das hebräische Bild bleibt in der Fußnote erhalten.
- source_word: וָאֶשְׁמַע אֶת דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: und auf die Worte gehört, die du zu mir gesprochen hast
  rationale: שמע mit direktem Objekt kann Hören beziehungsweise Beachten ausdrücken. »auf die Worte gehört« lässt die im Zusammenhang mitschwingende Folgsamkeit erkennen, ohne sie eindeutiger festzulegen als der Ausgangstext.
