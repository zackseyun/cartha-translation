  source_fidelity: 'Die Übersetzung gibt die Erzählfolge sowie die wesentlichen hebräischen Ausdrücke zuverlässig wieder: die Frau kommt zu Saul, erkennt seinen starken Schrecken, bezeichnet sich als seine Dienerin, verweist auf ihre Befolgung seiner Aufforderung, ihr Lebensrisiko und ihr Hören auf seine Worte. »Sehr erschrocken« ist für נִבְהַל מְאֹד im Kontext vertretbar, ohne die Nuance unzulässig zu verengen.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem Erzählton. »Sieh doch« ist als einleitender Aufmerksamkeitsruf natürlich; die Satzgliederung ist klar und flüssig.
  terminology: »Dienerin« bewahrt die weibliche Selbstbezeichnung שִׁפְחָתְךָ. »Auf deine Stimme gehört« bildet die hebräische Wendung erkennbar ab und wird durch die Fußnote zutreffend als Befolgen erläutert. »Mein Leben aufs Spiel gesetzt« gibt das idiomatische Lebensrisiko idiomatisch wieder; die Fußnote erhält das hebräische Bild. Die Fußnotenmarker sind im deutschen Text jeweils am passenden Ausdruck verankert.
