source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: de
  text: 'Da sagte Samuel zu Saul: „Warum hast du mich beunruhigt, indem du mich heraufgeholt hast?“ Saul antwortete: „Ich bin in großer Bedrängnis. Die Philister kämpfen gegen mich, und Gott hat sich von mir abgewandt. Er antwortet mir nicht mehr, weder durch die Propheten[a] noch durch Träume. Darum habe ich dich gerufen, damit du mir sagst, was ich tun soll.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand der Propheten“; dies ist eine hebräische Wendung für „durch die Propheten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: hast du mich beunruhigt
  rationale: Das Verb רגז bezeichnet hier das Versetzen in Unruhe oder Aufregung. „Beunruhigt“ ist im Deutschen natürlich und wahrt die Aussage, ohne den Vorgang näher zu deuten.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: indem du mich heraufgeholt hast
  rationale: Die Hifil-Form von עלה bedeutet wörtlich „heraufbringen/heraufholen“. „Heraufgeholt“ bewahrt die räumliche Bildsprache des Textes und vermeidet die mögliche Auferstehungsassoziation von „auferweckt“.
- source_word: צַר לִי מְאֹד
  choice: Ich bin in großer Bedrängnis
  rationale: Die Wendung beschreibt schweren Druck und große persönliche Not. „In großer Bedrängnis“ gibt dies klar, würdig und idiomatisch wieder.
- source_word: נִלְחָמִים בִּי
  choice: kämpfen gegen mich
  rationale: לחם mit ב bezeichnet hier feindliches militärisches Vorgehen gegen Saul. Die Wiedergabe bleibt nah am Bild des Ausgangstextes.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: Gott hat sich von mir abgewandt
  rationale: סור מעל bezeichnet ein Sich-Entfernen oder Abwenden. Diese Formulierung gibt den relationalen Rückzug wieder, ohne über den Text hinauszugehen.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: Er antwortet mir nicht mehr
  rationale: ענה bedeutet „antworten“, und עוד bezeichnet hier das Aufhören der Antwort. Ein neuer deutscher Satz stellt den Subjektbezug natürlich und eindeutig her.
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: weder durch die Propheten noch durch Träume
  rationale: 'Die doppelte גם-Konstruktion wird im Zusammenhang mit der vorausgehenden Verneinung idiomatisch durch „weder … noch“ wiedergegeben. ביד bezeichnet die Vermittlung beziehungsweise Urheberschaft: „durch die Propheten“.'
- source_word: וָאֶקְרָאֶה לְךָ
  choice: Darum habe ich dich gerufen
  rationale: קרא mit ל kann „jemanden rufen“ oder „zu jemandem rufen“ bedeuten. Im Kontext vermittelt „gerufen“ den Vorgang des Herbeirufens, ohne zusätzliche okkulte Fachsprache einzutragen.
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: damit du mir sagst, was ich tun soll
  rationale: Das Hifil von ידע bedeutet „wissen lassen/bekannt machen“. Die deutsche Formulierung ist natürlich und bewahrt Sauls Bitte um Handlungsanweisung.
theological_decisions:
- issue: Identität und Status Samuels in der Totenbeschwörungserzählung
  choice: 'Die Erzählstimme wird unmittelbar wiedergegeben: Samuel spricht zu Saul.'
  alternative: Die Gestalt ausdrücklich als vermeintlichen Samuel, Erscheinung oder täuschenden Geist bezeichnen.
  rationale: Der hebräische Text sagt ohne Einschränkung „Samuel sagte zu Saul“. Die Übersetzung folgt dieser Darstellung, entscheidet aber keine weitergehende theologische Frage über Art oder Mechanismus des Geschehens.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die räumliche Bildsprache „heraufgeholt“ und die narrative Benennung Samuels bleiben erhalten. Der einzige Fußnotenhinweis erläutert das im Deutschen nicht unmittelbar verständliche hebräische Idiom ביד.
