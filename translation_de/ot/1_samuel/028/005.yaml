source:
  edition: WLC
  text: וַ/יַּ֥רְא שָׁא֖וּל אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֑ים וַ/יִּרָ֕א וַ/יֶּחֱרַ֥ד לִבּ֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/005.yaml
  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: de
  text: Als Saul das Lager der Philister sah, bekam er Angst, und sein Herz zitterte heftig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und sein Herz zitterte sehr“. Das Hebräische bewahrt das Bild des Herzens als Sitz der inneren Angst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Die gewöhnliche Bedeutung von ראה ist hier die unmittelbare visuelle Wahrnehmung; „sah“ ist im deutschen Erzählstil natürlich und quellennah.
- source_word: מַחֲנֵה
  choice: Lager
  rationale: מַחֲנֶה bezeichnet hier konkret das militärische Lager beziehungsweise Heerlager; „Lager“ bewahrt dieses Bild, ohne bereits mit „Heer“ zu interpretieren.
- source_word: פְלִשְׁתִּים
  choice: der Philister
  rationale: Dies ist die im Deutschen etablierte Bezeichnung der Volksgruppe und gibt die hebräische Genitivverbindung natürlich wieder.
- source_word: וַיִּרָא
  choice: bekam er Angst
  rationale: Das Verb ירא bezeichnet Sauls Furcht als Reaktion auf das Gesehene. „bekam Angst“ bildet den narrativen Fortgang idiomatisch ab.
- source_word: וַיֶּחֱרַד
  choice: zitterte
  rationale: חרד kann Zittern, Erschrecken oder starke innere Erregung ausdrücken. „zitterte“ wahrt das konkrete Bild und vermeidet eine psychologisch stärker deutende Wiedergabe.
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: Der hebräische Text nennt ausdrücklich das Herz als Sitz des inneren Erlebens; das Bild bleibt im Deutschen verständlich und sollte nicht paraphrasiert werden.
- source_word: מְאֹד
  choice: heftig
  rationale: מְאֹד verstärkt das Zittern. „heftig“ verbindet sich im modernen Deutsch natürlicher mit „zitterte“ als das wörtlichere „sehr“.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Die konkrete Bildsprache des Hebräischen („Lager“, „sein Herz zitterte“) bleibt erhalten; „bekam Angst“ und „heftig“ sorgen für natürliche Verständlichkeit.
