base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: de
  text: Sofort fiel Saul der Länge nach zu Boden und fürchtete sich sehr wegen der Worte Samuels. Auch hatte er keine Kraft, denn er hatte den ganzen Tag und die ganze Nacht kein Brot[a] gegessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Brot“ kann auch allgemeiner „Nahrung“ bedeuten; die Übersetzung behält „Brot“ bei, um den Wortlaut der Quelle wiederzugeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: sofort
  rationale: Das Verb bezeichnet eigentlich ein Eilen oder schnelles Handeln; hier gibt „sofort“ den plötzlichen Eintritt des Sturzes natürlich wieder, ohne eine zielgerichtete Eile anzudeuten.
- source_word: וַיִּפֹּל מְלֹא קוֹמָתוֹ אַרְצָה
  choice: fiel … der Länge nach zu Boden
  rationale: „Fiel“ bewahrt den Grundsinn von נפל; „der Länge nach“ gibt die gesamte Körperlänge wieder, und „zu Boden“ entspricht der Richtungsform אַרְצָה.
- source_word: וַיִּרָא מְאֹד
  choice: geriet … in große Angst
  rationale: Die Formulierung gibt die intensive Furcht in natürlichem modernem Deutsch wieder und lässt den erzählerischen Übergang in diesen Zustand erkennen.
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: wegen Samuels Worten
  rationale: Die Präposition bezeichnet hier den ursächlichen Anlass der Angst.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: Auch hatte er keine Kraft mehr
  rationale: „Auch“ bildet die additive Partikel גַּם ab. „Keine Kraft mehr“ ist im Deutschen idiomatisch und bezeichnet im Kontext die durch das Fasten eingetretene Erschöpfung.
- source_word: לֹא אָכַל לֶחֶם
  choice: kein Brot gegessen
  rationale: „Brot“ bewahrt die konkrete Ausgangsbedeutung von לֶחֶם, obwohl das Wort auch Nahrung allgemein bezeichnen kann.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: den ganzen Tag und die ganze Nacht
  rationale: Diese Formulierung bewahrt die zeitliche Gesamtheit und klingt in modernem Deutsch natürlich.
