  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: de
  text: 'Als die Frau Samuel[a] sah, schrie sie laut auf. Dann sagte die Frau zu Saul: »Warum hast du mich getäuscht? Du bist Saul!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was wie Samuel erschien«. Der hebräische Text sagt schlicht »Samuel«, ohne die Art der Erscheinung zu erklären.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: sah
  rationale: ראה bezeichnet hier im fortlaufenden Erzählstil ein Sehen; »sah« ist die direkte und natürliche deutsche Wiedergabe, ohne das Geschehen als bloße Wahrnehmung umzudeuten.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der hebräische Text verwendet hier die gewöhnliche Bezeichnung »die Frau«, nicht ausdrücklich ihre Rolle als Totenbeschwörerin.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: Der Text nennt Samuel unmittelbar als Objekt ihres Sehens. Eine Deutung als Erscheinung oder Geist wird nicht in den Haupttext eingefügt.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: schrie sie laut auf
  rationale: זעק mit בְּקוֹל גָּדוֹל beschreibt einen heftigen, lauten Aufschrei. Die Formulierung ist im modernen Deutsch natürlich und erhält die Intensität.
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: Dann sagte
  rationale: Die hebräische Redeeinleitung mit dem zusätzlichen Infinitiv »sagend« wird idiomatisch mit einem einfachen deutschen Redeverb wiedergegeben; »Dann« führt den Erzählfortgang fort.
- source_word: רִמִּיתָנִי
  choice: hast du mich getäuscht
  rationale: Das Piel von רמה bezeichnet Täuschung oder Irreführung. Das deutsche Perfekt passt zur unmittelbar aufgedeckten Täuschung.
- source_word: וְאַתָּה שָׁאוּל
  choice: Du bist Saul!
  rationale: Das ausdrückliche Pronomen trägt Nachdruck. Der Ausruf gibt diesen im Deutschen natürlich wieder; das einleitende ו muss hier nicht eigens als »und« übersetzt werden.
theological_decisions:
- issue: Ob »Samuel« im Haupttext als Erscheinung, Geist oder vermeintlicher Samuel qualifiziert werden soll
  choice: Die direkte Bezeichnung »Samuel« bleibt ohne interpretierenden Zusatz stehen.
  alternative: »die Erscheinung Samuels«, »Samuels Geist« oder »jemanden, der wie Samuel aussah«
  rationale: Der hebräische Erzähltext sagt schlicht, dass die Frau Samuel sah, und erklärt in diesem Vers nicht die Natur der Erscheinung. Die direkte Wiedergabe bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »schrie sie laut auf« ist idiomatischer als die formnahe Wendung »schrie mit lauter Stimme«. Die Wiederholung »die Frau« bleibt entsprechend dem hebräischen Text erhalten.
