base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: de
  text: 'Da sagte Saul zu seinen Dienern: „Sucht mir eine Frau, die ein Medium ist[a], damit ich zu ihr gehen und durch sie Auskunft einholen kann.“ Seine Diener antworteten ihm: „In En-Dor gibt es eine Frau, die ein Medium ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort אוֹב bezeichnet eine mit einer Praxis oder Macht der Toten- bzw. Geisterbefragung verbundene Größe; seine genaue Bedeutung ist umstritten. Traditionell wird die Frau auch als „Totenbeschwörerin“ wiedergegeben.
    reason: Erläutert die umstrittene Bezeichnung, ohne ihre ontologische Deutung oder die Art der Praxis vorwegzunehmen.
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: eine Frau, die als Medium dient
  rationale: Die Wendung bezeichnet eine Frau, die mit einem אוֹב verbunden ist beziehungsweise mittels eines solchen Geistes Auskunft erteilt. „Medium“ ist im heutigen Deutsch verständlich und vermeidet die stärkere Festlegung von „Totenbeschwörerin“.
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: und durch sie Auskunft suchen
  rationale: Die Präposition בְּ wird instrumental wiedergegeben („durch sie“). „Auskunft suchen“ bewahrt den Sinn von דרש im Kontext einer Befragung, ohne den Erfolg oder die Legitimität des Vorgangs vorauszusetzen.
- source_word: הִנֵּה
  choice: In En-Dor gibt es
  rationale: Statt eines im Deutschen steifen „Siehe“ wird die hinweisende Funktion idiomatisch in die Existenzkonstruktion aufgenommen.
theological_decisions:
- issue: Art und Wirklichkeit des אוֹב
  choice: Die Hauptübersetzung verwendet den funktionalen Ausdruck „Medium“ und erläutert die lexikalische Unschärfe in einer Fußnote.
  alternative: „Totenbeschwörerin“, „Geisterbeschwörerin“ oder „Herrin eines Totengeistes“
  rationale: Der Vers beschreibt Sauls Absicht, entscheidet hier aber nicht ausdrücklich, wie das bezeichnete Phänomen ontologisch zu verstehen ist. Die Übersetzung soll weder die Wirklichkeit eines beschworenen Toten noch eine rein betrügerische Praxis vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Direkte Rede bleibt klar und natürlich; „Diener“ entspricht dem höfischen Kontext. Der Ortsname wird als „En-Dor“ geschrieben.
