  terminology: „Medium“ ist als funktionale, nicht konfessionell festgelegte Wiedergabe vertretbar. Die Erläuterung sollte offenlassen, ob אוֹב einen Geist, einen Toten oder eine Praxis bzw. Technik bezeichnet; „Totenbeschwörerin“ kann als traditionelle, aber enger deutende Alternative genannt werden.
