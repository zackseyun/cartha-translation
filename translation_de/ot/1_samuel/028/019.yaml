id: 1SA.28.19
reference: 1 Samuel 28:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: de
  text: Und Jahwe wird auch Israel zusammen mit dir in die Hand der Philister geben. Morgen werdet ihr, du und deine Söhne, bei mir sein.[a] Auch das Lager Israels wird Jahwe in die Hand der Philister geben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit mir“. Gemeint sein kann: „mit mir im Tod“ oder „mit mir im Totenreich“. Der hebräische Text legt den genauen Sinn nicht ausdrücklich fest.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „das Heer Israels“. Das hebräische Wort kann sowohl das Lager als auch das dort versammelte Heer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Namen JHWH als Eigennamen wieder und entspricht der im Deutschen geläufigen Form.
- source_word: וְיִתֵּן / יִתֵּן
  choice: wird geben
  rationale: Bewahrt die Grundbedeutung von נתן; zusammen mit „in die Hand“ bezeichnet die Wendung die Auslieferung in fremde Gewalt.
- source_word: גַּם
  choice: auch
  rationale: Gibt in beiden Sätzen den hinzufügenden und steigernden Sinn wieder.
- source_word: עִמְּךָ
  choice: zusammen mit dir
  rationale: Drückt aus, dass Israel Sauls Schicksal teilen wird, ohne den knappen hebräischen Ausdruck unnötig auszudeuten.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: in die Hand der Philister
  rationale: Erhält das hebräische Bild für die Übergabe in die Gewalt der Philister und ist in gehobenem modernem Deutsch verständlich.
- source_word: וּמָחָר
  choice: Morgen
  rationale: Die zeitliche Angabe steht im Deutschen natürlich am Satzanfang; der Zusammenhang der Weissagung bleibt erhalten.
- source_word: וּבָנֶיךָ
  choice: und deine Söhne
  rationale: בנים bezeichnet hier konkret Sauls Söhne und nicht allgemein seine Kinder.
- source_word: עִמִּי
  choice: bei mir
  rationale: Bewahrt die Kürze und Offenheit des Hebräischen, ohne ausdrücklich „im Tod“ oder „im Totenreich“ einzufügen.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: das Lager Israels
  rationale: „Lager“ ist die unmittelbarste Wiedergabe; im militärischen Zusammenhang kann damit zugleich das versammelte Heer gemeint sein.
theological_decisions:
- issue: Bedeutung der Aussage, Saul und seine Söhne würden morgen bei Samuel sein
  choice: „bei mir sein“ ohne nähere Bestimmung des Zustands oder Ortes
  alternative: „mit mir im Tod“ oder „bei mir im Totenreich sein“
  rationale: Der Vers kündigt ihren Tod an, benennt aber mit עִמִּי lediglich das Zusammensein mit Samuel. Die Übersetzung lässt die genaue Vorstellung vom Zustand der Toten daher offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. Die feierliche Folge der Ankündigungen bleibt erhalten; die knappe Aussage über Sauls Tod wird nicht dogmatisch ausgedeutet.
