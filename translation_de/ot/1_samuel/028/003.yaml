  to: Samuel war gestorben, und ganz Israel hatte um ihn getrauert und ihn in Rama, seiner eigenen Stadt, begraben. Und Saul hatte die Totenbeschwörer und Geisterkundigen[a] aus dem Land entfernt.
  rationale: Die rückblickende Zeitstufe, die nationale Kollektivbezeichnung, der Ortsname und die vorsichtige Wiedergabe von Sauls Maßnahme bleiben erhalten. „Auch“ wird entfernt, da es über die schlichte hebräische Verknüpfung hinausgeht. Die zweite Bezeichnung der Praktizierenden wird enger an die feste hebräische Wortpaarung angebunden, während die Fußnote die wissenschaftlich unsichere lexikalische Abgrenzung transparent macht.
