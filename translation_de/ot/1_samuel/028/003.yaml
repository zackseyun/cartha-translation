base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: de
  text: Samuel war gestorben, und ganz Israel hatte um ihn getrauert und ihn in Rama, seiner eigenen Stadt, begraben. Und Saul hatte die Totenbeschwörer und Geisterkundigen[a] aus dem Land entfernt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die beiden hebräischen Bezeichnungen meinen Praktizierende mit Bezug zu Geistern; ihre genaue Bedeutung und Unterscheidung ist unsicher. Auch möglich: »Medien und Spiritisten« oder »Totenbeschwörer und Wahrsager«.'
    reason: lexikalische Alternative und begriffliche Unsicherheit
lexical_decisions:
- source_word: מֵת
  choice: war gestorben
  rationale: Das Plusquamperfekt stellt Samuels Tod als bereits eingetretenen Hintergrund für die folgende Handlung dar.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: hatte um ihn getrauert
  rationale: ספד bezeichnet öffentliche, besonders mit einem Todesfall verbundene Trauer; die Formulierung ist im modernen Deutsch natürlich.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die kollektive nationale Bezeichnung wird entsprechend dem hebräischen Ausdruck knapp beibehalten.
- source_word: וַיִּקְבְּרֻהוּ
  choice: ihn … begraben
  rationale: Die einfache Bedeutung von קבר wird direkt wiedergegeben; das gemeinsame Hilfsverb trägt auch diese koordinierte Hintergrundhandlung.
- source_word: בָרָמָה
  choice: in Rama
  rationale: Der Ortsname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: וּבְעִירוֹ
  choice: in seiner eigenen Stadt
  rationale: Die Wendung steht appositionell zu Rama; „eigenen“ macht den Possessivbezug im Deutschen idiomatisch deutlich, ohne eine darüber hinausgehende Deutung einzuführen.
- source_word: הֵסִיר
  choice: hatte … entfernt
  rationale: Das Plusquamperfekt kennzeichnet auch Sauls Maßnahme als vorausgesetzte frühere Handlung; „entfernt“ lässt offen, auf welche Weise sie durchgesetzt wurde.
- source_word: הָאֹבוֹת
  choice: die Totenbeschwörer
  rationale: אוֹב bezeichnet hier Personen, die mit der Befragung von Totengeistern verbunden sind. „Totenbeschwörer“ vermittelt diese Funktion verständlich, ohne den Begriff als moderne Berufsbezeichnung zu behandeln.
- source_word: הַיִּדְּעֹנִים
  choice: Wahrsager
  rationale: יִדְּעֹנִי bezeichnet einen okkulten Kundigen und steht regelmäßig neben אוֹב. „Wahrsager“ ist verständlich, bleibt aber wegen der nicht völlig deckungsgleichen Begriffsfelder durch eine Fußnote qualifiziert.
- source_word: מֵהָאָרֶץ
  choice: aus dem Land
  rationale: Die direkte Wiedergabe passt zum nationalen Zusammenhang und legt nicht unnötig „Staat“ oder „Gebiet“ fest.
theological_decisions:
- issue: Bezeichnung der okkulten Praktizierenden ohne Eintragung späterer Folklore
  choice: Totenbeschwörer und Wahrsager
  alternative: Geisterbeschwörer und Geisterkundige; Medien und Spiritisten
  rationale: Die hebräischen Begriffe bezeichnen verbotene Praktizierende, ihre genaue Abgrenzung entspricht aber keiner modernen okkulten Taxonomie. Die gewählte Formulierung vermittelt die Grundfunktion und die Fußnote bewahrt die lexikalische Unschärfe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Plusquamperfektformen geben den rückblickenden Hintergrundcharakter des Verses wieder. „Auch“ verbindet Sauls frühere Maßnahme mit der einleitenden Situationsbeschreibung, ohne ein im Hebräischen nicht vorhandenes zeitliches „nun“ einzuführen.
