    issue: „Wahrsager“ für יִּדְּעֹנִים
    rationale: Der Ausdruck kann allgemein Wahrsagepraktiker bezeichnen und verwischt damit den in der Paarung mit אֹבוֹת naheliegenden Geisterbezug. „Geisterkundige“ ist als vorsichtige, moderne Annäherung geeigneter; die Fußnote soll die umstrittene genaue Abgrenzung offenhalten.
  - severity: low
    issue: Fußnotentext bestimmt die Tätigkeit beider Gruppen zu eng als Befragung von Totengeistern oder anderen Geistern.
    rationale: Die genaue Bedeutung und Unterscheidung der beiden hebräischen Fachbegriffe ist nicht sicher. Die Erläuterung sollte daher von Praktizierenden mit Bezug zu Geistern sprechen, ohne eine einheitliche Handlung für beide festzulegen.
