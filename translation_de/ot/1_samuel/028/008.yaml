base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: de
  text: 'Da machte Saul sich unkenntlich und zog andere Kleider an. Dann ging er mit zwei Männern los. Bei Nacht kamen sie zu der Frau, und Saul sagte: »Wahrsage mir bitte mithilfe eines Totengeistes[a] und bring mir den herauf, den ich dir nennen werde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann einen Totengeist oder ein mit Totenbefragung verbundenes Medium bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: machte sich unkenntlich
  rationale: Das Hitpael bezeichnet Sauls bewusstes Verändern seines Erscheinungsbildes, um seine Identität zu verbergen. Die Formulierung ist natürlich und gibt den reflexiven Sinn präzise wieder.
- source_word: בְּגָדִים אֲחֵרִים
  choice: andere Kleider
  rationale: Die schlichte Wendung bezeichnet den Kleidungswechsel als Teil der Verkleidung und entspricht dem unmarkierten Hebräisch.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: Dann ging er mit zwei Männern los
  rationale: Die Beteiligten werden vollständig genannt; die im Deutschen schwerfällige Nachbildung »er, und zwei Männer mit ihm« wird vermieden.
- source_word: לָיְלָה
  choice: Bei Nacht
  rationale: Die adverbiale Zeitangabe bewahrt sowohl die nächtliche Situation als auch den knappen Erzählstil.
- source_word: קָסֳמִי נָא לִי
  choice: Wahrsage mir bitte
  rationale: קסם bezeichnet das Ausüben von Wahrsagerei; נָא wird als höfliche beziehungsweise dringliche Bitte wiedergegeben.
- source_word: בָּאוֹב
  choice: mithilfe eines Totengeistes
  rationale: אוֹב bezeichnet hier das mit Totenbefragung verbundene Medium beziehungsweise den Totengeist. Im unmittelbaren Satz, der an die Frau selbst gerichtet ist, gibt »Totengeist« das bezeichnete Mittel verständlich wieder; die lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: וְהַעֲלִי לִי
  choice: und lass mir den heraufkommen
  rationale: Der Hifil von עלה enthält das Bild des Heraufbringens eines Verstorbenen. Die Übersetzung erhält dieses räumliche Bild, ohne die behauptete Wirksamkeit des Vorgangs zusätzlich zu bestätigen oder zu bestreiten.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: den ich dir nennen werde
  rationale: Die Wendung bezeichnet die Person, die Saul anschließend angeben will; »nennen« ist im Deutschen knapp und idiomatisch.
theological_decisions:
- issue: Darstellung der Totenbefragung, ohne über ihre Wirksamkeit zu entscheiden
  choice: 'Sauls Aufforderung wird in der Vorstellungs- und Bildsprache des Erzähltextes wiedergegeben: »Wahrsage«, »Totengeist« und »heraufkommen«.'
  alternative: Die Vorgänge skeptisch als Täuschung kennzeichnen oder sie ausdrücklich als tatsächlichen Kontakt mit einem Verstorbenen bestätigen.
  rationale: Der Vers berichtet Sauls Bitte, erklärt aber an dieser Stelle nicht die metaphysischen Vorgänge. Die Übersetzung bewahrt diese theologische Spannung und fügt weder Zustimmung noch Widerlegung hinzu.
- issue: Mehrdeutigkeit von אוֹב
  choice: Im Haupttext »Totengeist«, mit einer Fußnote zur möglichen Bezeichnung eines mit Totenbefragung verbundenen Mediums.
  alternative: Im Haupttext ausschließlich »Medium« oder traditionell »Wahrsagegeist« verwenden.
  rationale: Das hebräische Wort kann den Totengeist beziehungsweise die damit verbundene Beschwörung und metonymisch eine entsprechende Person bezeichnen. Kontext und Satzbau begünstigen hier die instrumentale Wiedergabe mit »Totengeist«, ohne die weitere Möglichkeit zu verschweigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; die hebräische Bildsprache des Heraufkommens wird erhalten. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck.
