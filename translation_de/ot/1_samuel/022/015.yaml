base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: de
  text: Habe ich etwa heute zum ersten Mal für ihn Gott befragt?[a] Das sei fern von mir! Der König lege weder seinem Diener noch meinem ganzen Vaterhaus etwas zur Last; denn dein Diener wusste von all dem nichts, weder Kleines noch Großes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Habe ich heute begonnen, für ihn Gott zu befragen?“ Die rhetorische Frage deutet darauf hin, dass Ahimelech dies nicht zum ersten Mal getan hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: Habe ich etwa heute zum ersten Mal
  rationale: Die rhetorische Frage bedeutet im Zusammenhang, dass Ahimelech David nicht erstmals an diesem Tag Gottes Weisung erfragt hatte. „Etwa“ kennzeichnet die erwartete Verneinung, während „zum ersten Mal“ die idiomatische Funktion von החל wiedergibt.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: für ihn Gott befragt
  rationale: שאל בֵאלֹהִים bezeichnet das Einholen göttlicher Auskunft oder Weisung; לוֹ nennt David als den Begünstigten. „Gott befragen“ ist im Deutschen prägnant und sachlich.
- source_word: חָלִילָה לִּי
  choice: Das sei fern von mir!
  rationale: Die feste Zurückweisungsformel wird würdevoll und mit ihrer starken emphatischen Wirkung wiedergegeben.
- source_word: אַל יָשֵׂם ... בְּ
  choice: lege ... etwas zur Last
  rationale: שים mit ב und דָבָר bezeichnet hier das Anrechnen beziehungsweise Zuschreiben einer belastenden Sache. Die deutsche Wendung bewahrt den forensischen Sinn.
- source_word: בְּעַבְדּוֹ ... בְּכָל בֵּית אָבִי
  choice: weder seinem Diener noch meinem ganzen Vaterhaus
  rationale: Die parallelen Präpositionalgruppen bezeichnen diejenigen, denen nichts angelastet werden soll. „Vaterhaus“ wahrt den umfassenden Familien- oder Sippenbezug.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: dein Diener wusste von all dem nichts
  rationale: Die ehrerbietige Selbstbezeichnung bleibt erhalten; die Wortstellung ist natürliches modernes Deutsch.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: weder Kleines noch Großes
  rationale: Das Größenpaar ist ein Merismus für völlige Unkenntnis und wird in einer geläufigen deutschen Paarformel bewahrt.
