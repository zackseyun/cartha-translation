  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: de
  text: 'Da sagte der König zu den Läufern[a], die um ihn herumstanden: „Wendet euch um und tötet die Priester Jahwes! Denn auch sie halten zu David[b]; sie wussten, dass er auf der Flucht war, und teilten mir nichts davon mit[c].“ Doch die Diener des Königs waren nicht bereit, Hand an die Priester Jahwes zu legen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Läufern“ sind königliche Hofbedienstete gemeint, die als Boten und auch als Leibwächter dienen konnten.
    reason: historical_context
  - marker: b
    text: 'Wörtlich: „Auch ihre Hand ist mit David“; gemeint ist, dass sie ihn unterstützen oder auf seiner Seite stehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Sie haben sein Ohr nicht aufgedeckt“; das ist eine hebräische Wendung für „sie haben ihn nicht informiert“. Gemeint ist hier das Ohr des Königs, der selbst spricht.'
    reason: idiom
lexical_decisions:
- source_word: לָרָצִים
  choice: zu den Läufern
  rationale: Das Partizip von רוץ bezeichnet wörtlich „Läufer“. Im königlichen Umfeld sind damit Hofbedienstete gemeint, die auch als Boten oder Leibwächter dienen konnten. Die Fußnote erläutert diese historische Amtsbezeichnung.
- source_word: הַנִּצָּבִים עָלָיו
  choice: die um ihn herumstanden
  rationale: נצב mit על bezeichnet hier das Stehen bei einer Person beziehungsweise den Dienst in ihrer unmittelbaren Umgebung. Die Formulierung gibt sowohl die räumliche als auch die höfische Situation natürlich wieder.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: Wendet euch um und tötet
  rationale: סבב fordert zum Umwenden beziehungsweise Sich-Zuwenden auf; der Hifil von מות bedeutet „töten“ oder „zu Tode bringen“. Die direkte Formulierung bewahrt die Härte von Sauls Befehl, ohne durch „hinrichten“ eine rechtmäßige Gerichtsentscheidung anzudeuten.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: Denn auch sie halten zu David
  rationale: Die Wendung „ihre Hand ist mit David“ ist ein Bild für Unterstützung oder Parteinahme. „Zu David halten“ gibt dieses Bild im natürlichen heutigen Deutsch wieder; der hebräische Wortlaut bleibt in der Fußnote sichtbar.
- source_word: כִּי בֹרֵחַ הוּא
  choice: dass er auf der Flucht war
  rationale: בֹרֵחַ ist ein Partizip und beschreibt David als fliehend beziehungsweise auf der Flucht. Die Wiedergabe vermeidet die Festlegung auf eine bereits vollständig abgeschlossene Flucht.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: und haben mir nichts davon mitgeteilt
  rationale: „Das Ohr aufdecken“ ist ein hebräisches Idiom für das Mitteilen oder Offenbaren. Da Saul selbst spricht, ist „mir“ im Deutschen die natürliche sinngemäße Wiedergabe.
- source_word: וְלֹא אָבוּ
  choice: waren nicht bereit
  rationale: אבה bezeichnet Bereitschaft oder Einwilligung. Die Verneinung wird als bewusste Weigerung wiedergegeben, ohne einen zusätzlichen Beweggrund einzutragen.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: Hand an … zu legen
  rationale: Die Verbindung von „die Hand ausstrecken“ und פגע bezeichnet hier einen gewaltsamen Angriff. Die deutsche Wendung „Hand an jemanden legen“ bewahrt das Handbild und macht die beabsichtigte Gewalt deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Sauls Vorwurf einer Unterstützung Davids
  choice: als Sauls Begründung in direkter Rede wiedergegeben
  alternative: als objektiv feststehende Schuld der Priester formulieren
  rationale: Der Text berichtet Sauls Anschuldigung, bestätigt an dieser Stelle jedoch nicht seine moralische Bewertung. Die direkte Rede bewahrt diese narrative Distanz.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Sauls Befehl bleibt knapp und brutal. Historisch oder bildhaft auffällige hebräische Wendungen werden entweder im Haupttext bewahrt oder in Fußnoten transparent gemacht.
