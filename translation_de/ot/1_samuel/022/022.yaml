base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: de
  text: 'David sagte zu Abjatar: „Ich wusste an jenem Tag, als Doëg, der Edomiter, dort war, dass er es Saul ganz gewiss melden würde.[a] Ich bin schuld am Tod aller Angehörigen deines Vaterhauses.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich wusste an jenem Tag, dass Doëg, der Edomiter, dort war und dass er es Saul ganz gewiss melden würde.“ Das hebräische Bindewort kann den Inhalt von Davids Wissen einleiten statt einen zeitlichen Umstand anzugeben. Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage: Er würde es Saul gewiss melden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Ich habe gegen jedes Leben deines Vaterhauses etwas verursacht/herbeigeführt.“ Dem Zusammenhang nach ist der Tod der Angehörigen gemeint; daher auch: „Ich habe den Tod aller Angehörigen deines Vaterhauses verursacht“ oder „Ich bin dafür verantwortlich.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: ich wusste
  rationale: Das Perfekt von ידע bezeichnet Davids damaliges Wissen; die direkte Wiedergabe wahrt den rückblickenden Sinn.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe des bestimmten zeitlichen Ausdrucks.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: als Doëg, der Edomiter, dort war
  rationale: כִּי wird hier als temporaler bzw. begleitender Umstand verstanden; die mögliche Lesart als Inhalt des Wissens wird in Fußnote [a] bewahrt.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: dass er es Saul ganz gewiss melden würde
  rationale: Infinitivus absolutus und finite Verbform verstärken die Aussage. „Melden“ passt zu Doëgs Bericht an den König; „es“ ist im Deutschen idiomatisch, obwohl im Hebräischen kein ausdrückliches Objekt steht.
- source_word: אָנֹכִי סַבֹּתִי
  choice: Ich bin schuld am Tod
  rationale: Die betonte Selbstzuschreibung und die kausative Bedeutung von סבב drücken Davids Übernahme persönlicher Verantwortung aus. Der Tod ist durch den Kontext eindeutig, aber im Hebräischen nur sinngemäß enthalten; deshalb wird die Alternative in Fußnote [b] dokumentiert.
- source_word: בְּכָל נֶפֶשׁ
  choice: aller Angehörigen
  rationale: נֶפֶשׁ bezeichnet hier die einzelnen Menschen bzw. ihr Leben. Zusammen mit בית אביך ist „alle Angehörigen“ im Deutschen natürlich und konkret.
- source_word: בֵּית אָבִיךָ
  choice: deines Vaterhauses
  rationale: „Vaterhaus“ bewahrt den familiären und haushaltsbezogenen Sinn der hebräischen Wendung in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Umfang und Art von Davids Schuldeingeständnis
  choice: Ich bin schuld am Tod aller Angehörigen deines Vaterhauses
  alternative: Ich bin die Ursache für jedes Leben deines Vaterhauses / Ich habe den Tod aller Angehörigen verursacht
  rationale: Die Übersetzung gibt die im Kontext gemeinte Verantwortung für die Todesfälle wieder, ohne eine weitergehende dogmatische Aussage über Schuld oder Zurechenbarkeit einzutragen. Die sprachliche Spannweite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vaterhaus“ erhält das biblische Familienbild, bleibt aber verständlich. „Ganz gewiss“ bildet die hebräische emphatische Verbverbindung natürlich ab. Die Namensform „Doëg“ nutzt das Trema, um die getrennte Aussprache der Vokale anzuzeigen.
