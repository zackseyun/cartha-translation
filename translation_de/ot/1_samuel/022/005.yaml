  text: וַ/יֹּאמֶר֩ גָּ֨ד הַ/נָּבִ֜יא אֶל דָּוִ֗ד לֹ֤א תֵשֵׁב֙ בַּ/מְּצוּדָ֔ה לֵ֥ךְ וּ/בָֽאתָ לְּ/ךָ֖ אֶ֣רֶץ יְהוּדָ֑ה וַ/יֵּ֣לֶךְ דָּוִ֔ד וַ/יָּבֹ֖א יַ֥עַר חָֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: de
  text: 'Da sagte der Prophet Gad zu David: „Bleib nicht in der Festung. Geh und begib dich ins Land Juda[a].“ Da ging David fort und kam in den Wald von Haret.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Geh und komm in das Land Juda.“ Das hebräische Verb kann je nach Blickrichtung „kommen“, „hineingehen“ oder „zu einem Ort gehen“ bedeuten. Das hier mit „begib dich“ wiedergegebene Element kann die Aufforderung idiomatisch verstärken.'
    reason: lexikalische Alternative und Bewahrung der Perspektivmehrdeutigkeit von בוא sowie des idiomatischen Charakters von לְךָ
lexical_decisions:
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: נָבִיא ist die übliche Bezeichnung für einen Propheten; eine Wiedergabe als „Seher“ wäre hier lexikalisch nicht begründet.
- source_word: לֹא תֵשֵׁב
  choice: Bleib nicht
  rationale: יָשַׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Im Zusammenhang einer Anweisung über Davids Aufenthaltsort ist „Bleib nicht“ natürlich und präzise.
- source_word: בַּמְּצוּדָה
  choice: in der Festung
  rationale: מְצוּדָה bezeichnet einen befestigten oder schwer zugänglichen Zufluchtsort. „Festung“ bewahrt den räumlichen und schützenden Sinn, ohne zusätzliche Einzelheiten einzutragen.
- source_word: לֵךְ וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: Geh und begib dich ins Land Juda
  rationale: Die beiden Bewegungsverben הלך und בוא werden im Deutschen durch „geh“ und „begib dich“ natürlich wiedergegeben. Das idiomatische לְךָ verstärkt die persönliche Handlungsaufforderung und klingt in „begib dich“ mit. Da בוא je nach Perspektive „kommen“, „hineingehen“ oder allgemein das Erreichen eines Ziels bezeichnen kann, wird die Alternative in einer Fußnote erhalten.
- source_word: אֶרֶץ יְהוּדָה
  choice: das Land Juda
  rationale: Die Verbindung von אֶרֶץ mit dem Stammesnamen bezeichnet ausdrücklich das Gebiet Judas; „Land Juda“ erhält diesen territorialen Sinn.
- source_word: וַיֵּלֶךְ דָּוִד
  choice: Da ging David fort
  rationale: „Ging fort“ macht im Deutschen deutlich, dass David der Aufforderung entsprechend seinen bisherigen Aufenthaltsort verließ, ohne über den hebräischen Erzählzusammenhang hinauszugehen.
- source_word: יַעַר חָרֶת
  choice: der Wald von Haret
  rationale: יַעַר bedeutet „Wald“ oder „Waldgebiet“. חָרֶת wird als Ortsname in einer dem Hebräischen nahen deutschen Form mit „Haret“ wiedergegeben.
