base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: de
  text: 'Da sagte der König zu Doeg: »Wende dich um und schlag die Priester nieder[a]!« Da wandte sich Doeg, der Edomiter, um und schlug die Priester nieder. An jenem Tag tötete er fünfundachtzig Männer, die ein leinenes Efod trugen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Greif die Priester an« beziehungsweise »Fall über die Priester her«. Das hebräische Verb kann allgemein einen gewaltsamen Angriff bezeichnen. »Niederschlagen« entspricht hier dem Zusammenhang der angeordneten Hinrichtung, ohne bereits das spätere »tötete« vorwegzunehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב
  choice: Wende dich gegen
  rationale: Der Imperativ bezeichnet hier die Hinwendung zum befohlenen Ziel. »Wende dich gegen« klingt im Deutschen natürlich und macht die feindliche Ausrichtung deutlich, ohne das folgende Tätigkeitswort vorwegzunehmen.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: schlag sie nieder / schlug … nieder
  rationale: פגע kann ein Zusammentreffen, einen Angriff oder einen gewaltsamen Schlag bezeichnen. »Niederschlagen« passt zum Hinrichtungskontext, bewahrt aber gegenüber dem späteren וַיָּמֶת (»tötete«) die Unterscheidung zwischen Handlung und Ergebnis.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte und im Kontext eindeutige Wiedergabe des bestimmten Plurals.
- source_word: הָאֲדֹמִי
  choice: der Edomiter
  rationale: Die Herkunftsbezeichnung wird als gängige deutsche Volksbezeichnung wiedergegeben.
- source_word: וַיָּמֶת
  choice: tötete er
  rationale: 'Die Hifil-Form von מות ist kausativ: Doeg verursachte ihren Tod. »Tötete« ist im Deutschen klar und natürlich und fasst das Ergebnis der zuvor beschriebenen Gewalttat zusammen.'
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: fünfundachtzig Männer
  rationale: איש nach der Zahl bezeichnet hier männliche Personen; die Genannten sind Priester. »Männer« ist daher sachlich genau.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: die ein leinenes Efod trugen
  rationale: נשא kann bei einem Kleidungsstück »tragen« bedeuten. Das Efod ist hier ein priesterliches Kleidungsstück, und בָּד bezeichnet Leinen.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Da sagte der König
  rationale: Das narrative וַ führt die Handlung fort. »Da« bewahrt die zeitliche Abfolge in natürlichem deutschem Erzählstil.
