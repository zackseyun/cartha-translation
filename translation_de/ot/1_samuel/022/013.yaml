  text: וַ/יֹּ֤אמֶר אל/ו שָׁא֔וּל לָ֚/מָּה קְשַׁרְתֶּ֣ם עָלַ֔/י אַתָּ֖ה וּ/בֶן יִשָׁ֑י בְּ/תִתְּ/ךָ֨ ל֜/וֹ לֶ֣חֶם וְ/חֶ֗רֶב וְ/שָׁא֥וֹל ל/וֹ֙ בֵּֽ/אלֹהִ֔ים לָ/ק֥וּם אֵלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: de
  text: 'Saul sagte zu ihm: „Warum habt ihr euch gegen mich verschworen, du und der Sohn Isais, indem du ihm Brot und ein Schwert gegeben und für ihn Gott befragt hast[a], sodass er sich gegen mich erhoben hat, um mir aufzulauern – wie es heute der Fall ist?[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und für ihn bei Gott Rat eingeholt“.'
    reason: Lexikalische Alternative für die priesterliche Befragung Gottes.
  - marker: b
    text: 'Oder: „damit er sich gegen mich erhebt und mir auflauert – wie es heute der Fall ist“.'
    reason: Die hebräische Infinitivkonstruktion kann Zweck statt eingetretener Folge ausdrücken.
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: habt ihr euch gegen mich verschworen
  rationale: קשר bezeichnet hier eine Verschwörung gegen den König. „Sich gegen jemanden verschwören“ gibt den politischen und feindseligen Sinn im Deutschen natürlich wieder.
- source_word: בֶן־יִשָׁי
  choice: der Sohn Isais
  rationale: Saul nennt David bewusst nicht beim Namen. Die patronymische Bezeichnung wahrt die rhetorische Distanz und den abwertenden Unterton des Hebräischen.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: Du hast ihm Brot und ein Schwert gegeben
  rationale: Der Infinitiv mit ב erläutert, worin Saul die vermeintliche Verschwörung sieht. Ein neuer deutscher Satz bewahrt diesen Zusammenhang, ohne die Anklage in eine schwerfällige Konstruktion zu zwängen.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: und für ihn Gott befragt
  rationale: שׁאל באלהים bezeichnet das Einholen göttlicher Weisung, besonders im priesterlich-orakelhaften Zusammenhang. „Gott befragen“ ist dafür eine klare und sachlich passende deutsche Wendung.
- source_word: בֵּאלֹהִים
  choice: Gott
  rationale: Im hebräischen Text steht אֱלֹהִים und nicht der Gottesname JHWH; deshalb wird nicht mit „der HERR“ wiedergegeben.
- source_word: לָקוּם אֵלַי
  choice: sodass er sich gegen mich erhoben hat
  rationale: Der Infinitiv kann Zweck oder Folge ausdrücken. Der Haupttext versteht Sauls Worte als Behauptung einer inzwischen sichtbar gewordenen Folge; die Alternative wird in Fußnote [b] bewahrt.
- source_word: לְאֹרֵב
  choice: um mir aufzulauern
  rationale: ארב bezeichnet das verborgene Lauern auf jemanden. Die deutsche Infinitivkonstruktion gibt Form und feindselige Absicht natürlich wieder.
- source_word: כַּיּוֹם הַזֶּה
  choice: so wie es heute der Fall ist
  rationale: Die Wendung verweist auf die aus Sauls Sicht gegenwärtig bestehende Lage. Diese Formulierung ist im modernen Deutschen verständlich und wahrt den Gegenwartsbezug.
theological_decisions:
- issue: Gottesbezeichnung in בֵּאלֹהִים
  choice: Gott
  alternative: der HERR
  rationale: Die Übersetzung folgt der tatsächlichen Gottesbezeichnung אֱלֹהִים und ersetzt sie nicht durch den an dieser Stelle nicht stehenden Gottesnamen.
- issue: Zweck oder Folge in לָקוּם אֵלַי לְאֹרֵב
  choice: sodass er sich gegen mich erhoben hat, um mir aufzulauern
  alternative: damit er sich gegen mich erhebt und mir auflauert
  rationale: Die hebräische Infinitivfolge lässt sowohl Sauls behauptete Absicht als auch die von ihm behauptete Folge anklingen. Der Haupttext liest sie im Licht von „heute“ als eingetretene Folge, während die Fußnote die finale Lesart offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „du und der Sohn Isais“ bewahrt Sauls scharfen, anklagenden Ton. Die Satzteilung verbessert die Verständlichkeit, ohne den inhaltlichen Zusammenhang der hebräischen Infinitivkonstruktionen aufzulösen.
