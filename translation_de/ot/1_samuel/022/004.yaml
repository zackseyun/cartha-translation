base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/004.yaml
  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: de
  text: Er brachte sie vor den König von Moab[a], und sie blieben bei ihm, solange David in der Festung war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er führte sie vor den König von Moab.« Das hebräische Verb kann hier sowohl das Hinbringen als auch das Hinführen in die Gegenwart des Königs bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Er brachte sie
  rationale: Die Verbform mit dem Suffix der 3. Person Plural bezeichnet im Zusammenhang das Hinbringen beziehungsweise Hinführen von Davids Eltern zum König. »Brachte sie« ist im modernen Deutschen natürlich und lässt die Nuance des Führens durch die Fußnote erkennen.
- source_word: אֶת פְּנֵי
  choice: vor
  rationale: Die Wendung bezeichnet hier das Gelangen in die Gegenwart einer Person. »Vor« gibt das hebräische Idiom knapp und idiomatisch wieder.
- source_word: מֶלֶךְ מוֹאָב
  choice: den König von Moab
  rationale: Die Status-constructus-Verbindung wird direkt und natürlich wiedergegeben.
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: und sie blieben bei ihm
  rationale: ישׁב kann wohnen, bleiben oder sich aufhalten bedeuten. »Blieben bei ihm« passt zur zeitlich begrenzten Unterbringung im Erzählzusammenhang.
- source_word: כָּל יְמֵי הֱיוֹת דָּוִד
  choice: solange David … war
  rationale: Die Zeitangabe meint die gesamte Dauer von Davids Aufenthalt. »Solange« ist eine natürliche deutsche Wiedergabe, ohne den Sinn zu verkürzen.
- source_word: בַּמְּצוּדָה
  choice: in der Bergfeste
  rationale: מְצוּדָה bezeichnet hier einen befestigten Zufluchtsort. »Bergfeste« entspricht dem Erzählkontext der Davidüberlieferung und ist würdevoll sowie verständlich; »Festung« bleibt als allgemeinere Alternative möglich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte hebräische Zeitformel wird idiomatisch mit »solange« wiedergegeben. »Bergfeste« bewahrt den Charakter eines befestigten Zufluchtsorts im Davidbericht.
