base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: de
  text: 'Ahimelech antwortete dem König: »Und wer unter all deinen Dienern ist so treu wie David, der Schwiegersohn des Königs, der deinen Weisungen folgt[a] und in deinem Haus[b] hohes Ansehen genießt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung kann auch bedeuten: »der dir gehorcht« oder »der auf deinen Befehl hin handelt«.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Haus« kann hier genauer der königliche Haushalt oder Hof gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: 'Ahimelech antwortete dem König:'
  rationale: Die in hebräischen Erzählungen übliche Doppelung »antwortete … und sagte« wird im natürlichen Deutschen durch das redeeinleitende Verb mit Doppelpunkt wiedergegeben.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ
  choice: Und wer unter all deinen Dienern
  rationale: »Unter« gibt die partitive Konstruktion idiomatisch wieder; »Diener« lässt Rang und Funktion offen.
- source_word: כְדָוִד נֶאֱמָן
  choice: so treu wie David
  rationale: נֶאֱמָן bezeichnet Verlässlichkeit und Loyalität; »treu« bewahrt im höfischen Zusammenhang beide Aspekte.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: der Schwiegersohn des Königs
  rationale: Die konstruktusartige Verbindung benennt Davids familiäre Beziehung zu Saul unmittelbar.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: der deinen Weisungen folgt
  rationale: Die schwierige Wendung verbindet ein Sich-Hinwenden mit Hören, Gehorsam oder Weisung. Die Übersetzung gibt den naheliegenden Sinn bereiter Folgsamkeit wieder, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: und in deinem Haus hohes Ansehen genießt
  rationale: נִכְבָּד bezeichnet eine geehrte oder angesehene Stellung. »Haus« bewahrt das hebräische Bild und kann zugleich Haushalt oder Hof bezeichnen.
theological_decisions:
- issue: Charakterisierung Davids durch נֶאֱמָן
  choice: treu
  alternative: zuverlässig / vertrauenswürdig
  rationale: »Treu« wahrt die Aussage über Davids Loyalität, ohne daraus eine über den höfischen Kontext hinausgehende dogmatische Wertung zu machen.
- issue: Deutung von וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: der deinen Weisungen folgt
  alternative: der Zugang zu deinem Rat hat
  rationale: Der masoretisch vokalisierte Text legt eine Wendung zu Gehorsam beziehungsweise Befehlsbereitschaft nahe; da auch ein Bezug auf Audienz oder königlichen Rat vertreten wird, bleibt diese echte Unsicherheit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage und das einleitende »Und« bleiben erhalten. Hebräische Reihungen werden leicht geglättet, ohne Aussageelemente auszulassen; die Mehrdeutigkeit der schwierigen Wendung וְסָר אֶל־מִשְׁמַעְתֶּךָ wird in der Fußnote bewahrt.
