  text: וְ/אֵ֨ת נֹ֤ב עִיר הַ/כֹּֽהֲנִים֙ הִכָּ֣ה לְ/פִי חֶ֔רֶב מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מֵ/עוֹלֵ֖ל וְ/עַד יוֹנֵ֑ק וְ/שׁ֧וֹר וַ/חֲמ֛וֹר וָ/שֶׂ֖ה לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: de
  text: 'Auch Nob, die Stadt der Priester, schlug er mit der Schneide des Schwertes[a]: Männer und Frauen, Kinder und Säuglinge, Rinder, Esel und Schafe – mit der Schneide des Schwertes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: »nach dem Mund des Schwertes«; eine feste Wendung für das Töten mit dem Schwert. Die Formel wird am Versende wiederholt. Das mit »Schafe« wiedergegebene Wort kann auch Kleinvieh, einschließlich Ziegen, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: Nob
  rationale: Der Ortsname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: עִיר הַכֹּהֲנִים
  choice: die Stadt der Priester
  rationale: Die Genitivverbindung kennzeichnet Nob als die Stadt, die den Priestern zugeordnet beziehungsweise durch sie geprägt war.
- source_word: הִכָּה
  choice: schlug er
  rationale: Die Grundbedeutung von נכה bleibt erhalten; die folgende Schwertformel macht deutlich, dass es sich um tödliche Gewalt handelt.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die hebräische Wendung bedeutet wörtlich ungefähr »mit/nach dem Mund des Schwertes« und bezeichnet das Töten mit dem Schwert. »Mit der Schärfe des Schwertes« bewahrt das konkrete Bild in verständlichem Deutsch.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: Männer und Frauen
  rationale: Die Konstruktion »von … bis …« ist eine umfassende Paarformel. Im Deutschen gibt »Männer und Frauen« ihren Sinn natürlich wieder, ohne die Geschlechtsbezeichnungen zu neutralisieren.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: kleine Kinder und Säuglinge
  rationale: עוֹלֵל bezeichnet ein kleines Kind, יוֹנֵק ein noch gestilltes Kind. Die Wiedergabe wahrt die erschütternde Aussage unterschiedsloser Tötung.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: dazu Rinder, Esel und Schafe
  rationale: Die Singularformen stehen in der Aufzählung kollektiv für die jeweiligen Haustierarten. שֶׂה kann ein Schaf oder eine Ziege bezeichnen; »Schafe« ist hier eine natürliche, jedoch nicht erschöpfende Wiedergabe.
theological_decisions:
- issue: Geschlechtsspezifische Personenbezeichnungen in einer umfassenden Paarformel
  choice: Männer und Frauen
  alternative: vom Mann bis zur Frau
  rationale: Die Geschlechtsbezeichnungen des Hebräischen bleiben erhalten; zugleich wird die idiomatische Gesamtbedeutung der Merismusformel in natürlichem Deutsch ausgedrückt.
- issue: Formale Bewahrung der Massakerformel
  choice: Die wiederholte Wendung »mit der Schärfe des Schwertes« wird beibehalten.
  alternative: Die Aussage einmalig zu »mit dem Schwert töten« zusammenziehen.
  rationale: Die Wiederholung gehört zur eindringlichen Rhetorik des hebräischen Verses und unterstreicht die umfassende Vernichtung, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die harte, aufzählende Wirkung und die Wiederholung des Hebräischen bleiben erhalten; ein Doppelpunkt und ein Gedankenstrich gliedern den langen Satz für heutige Leser.
