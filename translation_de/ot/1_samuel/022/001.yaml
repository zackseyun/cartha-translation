base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: de
  text: David ging von dort weg und rettete sich[a] in die Höhle von Adullam. Als seine Brüder und die ganze Familie seines Vaters davon hörten, zogen sie dorthin zu ihm hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „floh“. Das hebräische Verb kann sowohl das Entkommen als auch die Flucht aus einer Gefahr bezeichnen. „Rettete sich“ hebt hervor, dass David der Gefahr erfolgreich entkam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: ging von dort weg
  rationale: Die gewöhnliche Erzählform von הלך bezeichnet das Fortgehen; „von dort weg“ gibt sowohl die Bewegung als auch den Ausgangspunkt natürlich wieder.
- source_word: וַיִּמָּלֵט
  choice: rettete sich
  rationale: Der Nifal von מלט bezeichnet das Entkommen beziehungsweise Sich-in-Sicherheit-Bringen. „Rettete sich“ bewahrt den reflexiv-resultativen Sinn, ohne das Verb lediglich als Ortsbewegung wiederzugeben.
- source_word: מְעָרַת עֲדֻלָּם
  choice: die Höhle von Adullam
  rationale: Die Status-constructus-Verbindung wird direkt und in der im Deutschen geläufigen Form wiedergegeben.
- source_word: וַיִּשְׁמְעוּ
  choice: davon hörten
  rationale: Das ergänzte „davon“ macht im Deutschen natürlich deutlich, dass die Familie von Davids Aufenthalt beziehungsweise Flucht erfuhr, ohne einen zusätzlichen Inhalt festzulegen.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: Die maskuline Pluralform bezeichnet hier Davids Brüder und wird geschlechtsgenau wiedergegeben.
- source_word: כָּל בֵּית אָבִיו
  choice: die ganze Familie seines Vaters
  rationale: „Haus“ bezeichnet in dieser Verbindung den Familien- und Haushaltsverband. „Familie“ ist im modernen Deutsch verständlicher als das stärker traditionelle „Vaterhaus“.
- source_word: וַיֵּרְדוּ
  choice: zogen … hinab
  rationale: ירד enthält eine räumliche Abwärtsbewegung. „Zogen hinab“ bewahrt diese topografische Nuance und klingt in der Erzählung natürlich.
- source_word: אֵלָיו שָׁמָּה
  choice: zu ihm dorthin
  rationale: Die Formulierung erhält sowohl die Richtung auf David als auch den ausdrücklichen Ortsbezug „dorthin“.
