base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: de
  text: Da ließ der König den Priester Ahimelech, den Sohn Ahitubs, rufen, dazu sein ganzes Vaterhaus[a], die Priester in Nob. Sie alle kamen zum König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Vaterhaus“ ist hier die größere väterliche Großfamilie oder Sippe gemeint, nicht nur die unmittelbare Familie.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: ließ ... rufen
  rationale: Die deutsche Kausativform gibt die hebräische Verbindung aus שׁלח und dem Infinitiv קרא natürlich wieder und bewahrt den Sinn einer königlichen Vorladung.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב הַכֹּהֵן
  choice: den Priester Ahimelech, den Sohn Ahitubs
  rationale: Die Apposition bezeichnet Ahimelechs Amt; die deutsche Wortstellung ist klar und würdevoll, während die Abstammungsangabe direkt erhalten bleibt.
- source_word: כָּל בֵּית אָבִיו
  choice: sein ganzes Vaterhaus
  rationale: „Vaterhaus“ bewahrt den kulturellen und sozialen Begriff des Hebräischen; eine Fußnote erklärt, dass damit mehr als die unmittelbare Familie gemeint ist.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: die Priester in Nob
  rationale: Die Wendung identifiziert das Vaterhaus näher als die in Nob ansässige Priestergemeinschaft; „in Nob“ ist im Deutschen die natürliche Ortsangabe.
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: Sie alle kamen zum König
  rationale: „Sie alle“ erhält die ausdrückliche Betonung der Vollständigkeit; „zum König“ gibt die Bewegungsrichtung von אֶל wieder, ohne eine Audienzformel hinzuzufügen.
theological_decisions: []
