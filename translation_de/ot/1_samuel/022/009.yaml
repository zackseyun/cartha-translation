source:
  edition: WLC
  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: de
  text: 'Da antwortete Doëg, der Edomiter, der bei Sauls Dienern stand,[a] und sagte: »Ich sah, wie der Sohn Isais nach Nob zu Ahimelech, dem Sohn Ahitubs, kam.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der über Sauls Diener eingesetzt war«. Die hebräische Wendung kann entweder Doëgs Stellung bei Sauls Dienern oder eine Aufsichtsfunktion über sie bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: ענה führt hier einen Redebeitrag als Erwiderung ein; »antwortete« bewahrt die hebräische Erzählweise, auch wenn unmittelbar keine ausdrückliche Frage vorausgeht.
- source_word: הָאֲדֹמִי
  choice: der Edomiter
  rationale: Der Artikel kennzeichnet die Herkunftsbezeichnung, die als Apposition zu Doëg steht.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: der bei Sauls Dienern stand
  rationale: נצב bezeichnet ein Stehen oder Stationiertsein; על kann hier die Stellung bei der Gruppe oder eine Aufsicht über sie ausdrücken. Der Haupttext vermeidet es, einen amtlichen Rang festzulegen, die Alternative bleibt in der Fußnote erhalten.
- source_word: עַבְדֵי שָׁאוּל
  choice: Sauls Dienern
  rationale: עבדים kann Diener, Gefolgsleute oder Hofbeamte bezeichnen. »Diener« ist direkt und lässt den genauen gesellschaftlichen Status offen.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Wiedergabe erhält neben »antwortete« auch das zweite hebräische Redeverb.
- source_word: רָאִיתִי ... בָּא
  choice: Ich sah, wie ... kam
  rationale: Diese natürliche deutsche Konstruktion gibt das vergangene Wahrnehmen und die als Partizip dargestellte beobachtete Bewegung wieder.
- source_word: בֶּן יִשַׁי
  choice: der Sohn Isais
  rationale: Die relationale Bezeichnung wird bewusst beibehalten und nicht durch den Namen David ersetzt.
- source_word: נֹבֶה
  choice: nach Nob
  rationale: Das direktionale He bezeichnet die Bewegung auf Nob zu; bei Ortsnamen ist »nach« im Deutschen idiomatisch.
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: zu Ahimelech, dem Sohn Ahitubs
  rationale: אל bezeichnet die Person, zu der sich der Sohn Isais begab; die Abstammungsangabe wird in natürlichem Deutsch appositionell wiedergegeben.
theological_decisions: []
