  text: 'Da sagte Saul: »Hör bitte zu, Sohn Ahitubs.« Er antwortete: »Hier bin ich, mein Herr.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: Hör mir bitte zu
  rationale: שׁמע ist hier als Aufforderung zum aufmerksamen Zuhören gebraucht; נָא mildert die Aufforderung und wird natürlich mit »bitte« wiedergegeben.
- source_word: בֶּן אֲחִיטוּב
  choice: Sohn Ahitubs
  rationale: Die hebräische Abstammungsbezeichnung wird knapp und idiomatisch als Genitivverbindung wiedergegeben.
- source_word: הִנְנִי
  choice: Hier bin ich
  rationale: Die feste Bereitschafts- und Antwortformel wird in ihrer geläufigen, formnahen deutschen Entsprechung bewahrt.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die respektvolle Anrede an den König bezeichnet hier einen menschlichen Herrn und nicht den Gottesnamen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; »bitte« bewahrt die höflich beziehungsweise eindringlich abtönende Funktion von נָא, ohne den angespannten Kontext auszudeuten.
