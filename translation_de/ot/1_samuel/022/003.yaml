  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד מִ/שָּׁ֖ם מִצְפֵּ֣ה מוֹאָ֑ב וַ/יֹּ֣אמֶר אֶל מֶ֣לֶךְ מוֹאָ֗ב יֵֽצֵא נָ֞א אָבִ֤/י וְ/אִמִּ/י֙ אִתְּ/כֶ֔ם עַ֚ד אֲשֶׁ֣ר אֵדַ֔ע מַה יַּֽעֲשֶׂה לִּ֖/י אֱלֹהִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: de
  text: 'David ging von dort nach Mizpe in Moab. Er sagte zum König von Moab: »Bitte lass meinen Vater und meine Mutter zu euch kommen und bei euch bleiben[a], bis ich weiß, was Gott für mich tun wird[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „hinausgehen“ bzw. je nach Blickrichtung „herauskommen“; ein ausdrückliches „zu euch“ steht im Hebräischen nicht. Gemeint ist hier offenbar, dass Davids Eltern sich unter den Schutz des Königs von Moab begeben und bei ihm bleiben.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „was Gott an mir tun wird“ oder „was Gott mit mir tun wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... מִשָּׁם
  choice: ging von dort
  rationale: Die erzählende Verbform bezeichnet die nächste Bewegung in der Handlung; „ging von dort“ ist im modernen deutschen Erzählstil natürlich und quellennah.
- source_word: מִצְפֵּה מוֹאָב
  choice: Mizpe in Moab
  rationale: Der Ortsname wird gemäß der Vokalisierung als „Mizpe“ wiedergegeben. „In Moab“ verdeutlicht die geografische Zuordnung im natürlichen Deutschen.
- source_word: מֶלֶךְ מוֹאָב
  choice: König von Moab
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet den Herrscher Moabs und wird idiomatisch mit „von“ wiedergegeben.
- source_word: יֵצֵא נָא ... אִתְּכֶם
  choice: Bitte lass ... zu euch kommen und bei euch bleiben
  rationale: יֵצֵא bedeutet wörtlich „hinausgehen/herauskommen“. Im Zusammenhang bittet David darum, dass seine Eltern zu dem König und dessen Umfeld gelangen und dort Schutz finden. Die Wiedergabe erhält die Bewegung und macht zugleich den beabsichtigten Aufenthalt verständlich. Das plurale „euch“ bewahrt die Numerusform von אִתְּכֶם.
- source_word: אָבִי וְאִמִּי
  choice: meinen Vater und meine Mutter
  rationale: Die ausdrückliche Nennung beider Elternteile wird beibehalten, statt sie zu „meine Eltern“ zusammenzufassen.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: bis ich weiß
  rationale: Die Wendung bezeichnet die zeitliche Grenze ihres Aufenthalts und lässt sich direkt und idiomatisch so wiedergeben.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: was Gott für mich tun wird
  rationale: Das לִי kann hier „für mich“, „an mir“ oder sinngemäß „mit mir“ bedeuten. „Für mich“ passt zu Davids Erwartung göttlichen Handelns, ohne die Offenheit des Ausgangs vollständig aufzulösen; Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in Davids Rede
  choice: Gott
  alternative: Götter; ein Gott
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, steht das zugehörige Verb im Singular. Im Erzählzusammenhang bezeichnet das Wort daher Israels Gott.
- issue: Richtung und Wirkung des erwarteten göttlichen Handelns
  choice: was Gott für mich tun wird
  alternative: was Gott an mir tun wird; was Gott mit mir tun wird
  rationale: Die Präposition לְ lässt mehrere Bezüge zu. Der Haupttext gibt den wahrscheinlichen Sinn wieder, während die Fußnote die echte sprachliche Offenheit wahrt.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Die direkte Rede ist natürlich formuliert; „bitte“ gibt נָא wieder. Das plurale „euch“ spiegelt die hebräische Form und bezieht neben dem König auch dessen Haus oder Hof ein.
