revisions:
- from: Denn ihr alle habt euch gegen mich verschworen, und niemand öffnet mir das Ohr[a], wenn mein Sohn mit dem Sohn Isais[b] einen Bund schließt. Niemand von euch hat Mitleid mit mir[c] oder öffnet mir das Ohr darüber, dass mein Sohn meinen Knecht gegen mich aufgebracht hat, damit er mir auflauert[d] – so, wie es heute der Fall ist.
  to: Denn ihr alle habt euch gegen mich verschworen, und niemand teilt mir mit[a], dass mein Sohn mit dem Sohn Isais[b] einen Bund geschlossen hat. Niemand von euch nimmt Anteil an mir[c] oder teilt mir mit, dass mein Sohn meinen Knecht gegen mich aufgewiegelt hat, damit er mir auflauert[d] – so, wie es heute der Fall ist.
  rationale: Die Änderung beseitigt die unidiomatische wörtliche Wiedergabe des hebräischen Ohren-Idioms im Haupttext, ohne dessen Bildlichkeit oder Bedeutung zu verlieren; beides wird in Anmerkung a dokumentiert. Die überarbeitete Satzfügung macht deutlich, dass Saul seinen Leuten vorwirft, ihn über Jonatans Bund mit David und dessen angebliche Anstiftung Davids nicht informiert zu haben. Die Anschuldigungen bleiben als Sauls Rede formuliert.
