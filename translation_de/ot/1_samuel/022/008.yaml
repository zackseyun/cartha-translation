base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: de
  text: Denn ihr alle habt euch gegen mich verschworen, und niemand teilt mir mit[a], dass mein Sohn mit dem Sohn Isais[b] einen Bund geschlossen hat. Niemand von euch nimmt Anteil an mir[c] oder teilt mir mit, dass mein Sohn meinen Knecht gegen mich aufgewiegelt hat, damit er mir auflauert[d] – so, wie es heute der Fall ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „enthüllt mein Ohr“; eine Redewendung für „teilt mir etwas mit“ oder „weiht mich ein“.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Sohn Isais“ ist David gemeint. Saul nennt ihn nicht beim Namen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Niemand von euch sorgt sich um mich“ beziehungsweise „empfindet Schmerz um meinetwillen“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „meinen Knecht gegen mich hat aufstehen lassen, um mir einen Hinterhalt zu legen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: habt euch verschworen
  rationale: Das Verb bezeichnet hier eine feindliche Verschwörung gegen Saul; die reflexive Formulierung gibt zugleich den Gedanken eines gemeinsamen Zusammenschlusses wieder.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: öffnet mir das Ohr
  rationale: Die hebräische Wendung bedeutet, jemandem etwas vertraulich mitzuteilen oder zu offenbaren. Die im Deutschen verständliche Bildsprache bleibt im Text erhalten und wird in einer Fußnote erklärt.
- source_word: בִּכְרָת
  choice: wenn ... einen Bund schließt
  rationale: Die Präposition mit dem Infinitiv bezeichnet hier den zeitlichen beziehungsweise begleitenden Umstand. „Einen Bund schließen“ entspricht der hebräischen Bundesformel natürlich.
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: mein Sohn mit dem Sohn Isais
  rationale: „Mein Sohn“ bezeichnet Jonatan; Sauls distanzierende Bezeichnung Davids als „Sohn Isais“ wird bewahrt.
- source_word: חֹלֶה ... עָלַי
  choice: hat Mitleid mit mir
  rationale: חלה bezeichnet hier keine körperliche Krankheit, sondern schmerzliche Anteilnahme oder Sorge um Saul. „Mitleid haben“ ist im modernen Deutsch natürlich und lässt Sauls selbstbezogene Klage hervortreten.
- source_word: הֵקִים
  choice: hat ... aufgebracht
  rationale: Das Hifil von קום bedeutet wörtlich „aufstehen lassen“ beziehungsweise „erheben“. Im feindlichen Zusammenhang vermittelt „gegen mich aufgebracht“ den kausativen Sinn, ohne die Behauptung als Tatsache über den Erzählzusammenhang hinaus zu bestätigen.
- source_word: עַבְדִּי
  choice: meinen Knecht
  rationale: Saul bezeichnet David als seinen Untergebenen. „Knecht“ bewahrt den königlich-höfischen und hier herabsetzenden Klang besser als das moderne, dienstleistungsbezogene „Diener“.
- source_word: לְאֹרֵב
  choice: damit er mir auflauert
  rationale: Die Form bezeichnet das Lauern auf jemanden beziehungsweise einen Hinterhalt. Der deutsche Finalsatz macht den Bezug auf Sauls Knecht als den Lauernden deutlich.
- source_word: כַּיּוֹם הַזֶּה
  choice: so, wie es heute der Fall ist
  rationale: Die Wendung verweist auf den gegenwärtigen, von Saul behaupteten Zustand; die Wiedergabe ist würdig und im heutigen Deutsch verständlich.
theological_decisions:
- issue: Status von Sauls Anschuldigung gegen Jonatan und David
  choice: Die Aussage bleibt als Sauls Vorwurf formuliert, ohne sie durch erklärende Zusätze als objektiv wahr zu bestätigen.
  alternative: Die feindliche Absicht Jonatans und Davids ausdrücklich als tatsächliche Verschwörung darstellen.
  rationale: Der Vers gibt Sauls an seine Gefolgsleute gerichtete Anklage wieder. Die Übersetzung soll seine Perspektive klar vermitteln, aber die erzählerische und theologische Spannung nicht eigenmächtig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter höfisch-politischer Schärfe. Sauls anklagender Ton bleibt durch „verschworen“, „Sohn Isais“ und „meinen Knecht“ hörbar. Das hebräische Ohren-Idiom wird bewusst im Haupttext erhalten und erläutert; schwer verständliche Wörtlichkeit wird sonst vermieden.
