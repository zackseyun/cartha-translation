  text: שְׁבָ֤/ה אִתִּ/י֙ אַל תִּירָ֔א כִּ֛י אֲשֶׁר יְבַקֵּ֥שׁ אֶת נַפְשִׁ֖/י יְבַקֵּ֣שׁ אֶת נַפְשֶׁ֑/ךָ כִּֽי מִשְׁמֶ֥רֶת אַתָּ֖ה עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: de
  text: Bleib bei mir und hab keine Angst! Denn wer mir nach dem Leben trachtet, trachtet auch dir nach dem Leben. Bei mir bist du in sicherer Obhut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn eine Bewahrung/ein Schutz bist du bei mir.“ Die genaue Nuance der knappen hebräischen Wendung ist unsicher; möglich ist auch: „Bei mir stehst du unter Schutz.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: Bleib bei mir
  rationale: Das Imperativgefüge fordert Abiatar auf, weiterhin bei David zu bleiben; „Bleib bei mir“ ist natürlich und kontextgerecht.
- source_word: אַל תִּירָא
  choice: hab keine Angst
  rationale: Gibt das hebräische Verbot in heutigem, gut verständlichem Deutsch wieder.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: wer mir nach dem Leben trachtet
  rationale: Die deutsche Redewendung bezeichnet wie das hebräische Idiom den Versuch, jemanden zu töten; „wer“ bewahrt die offene relative Formulierung.
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: trachtet auch dir nach dem Leben
  rationale: Die Wiederholung wird bewahrt; „auch“ verdeutlicht die im Parallelismus enthaltene Zuordnung, ohne den Sinn zu verändern.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: Bei mir bist du in sicherer Obhut
  rationale: מִשְׁמֶרֶת kann Bewahrung, Gewahrsam oder Schutz bezeichnen. Die Formulierung gibt Davids Zusicherung idiomatisch wieder, ohne die ungewöhnliche hebräische Nominalkonstruktion zu verdecken.
theological_decisions:
- issue: Art von Davids Zusicherung
  choice: „in sicherer Obhut“ als Schutz- und Bewahrungszusage
  alternative: „unter meinem Schutz“ oder wörtlicher „du bist bei mir eine Bewahrung“
  rationale: Der Kontext spricht für Davids persönliche Schutzverantwortung. Die Übersetzung macht daraus weder eine absolute Heilszusage noch eine besondere theologische Schutzlehre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden kurzen Aufforderungen werden direkt formuliert; das hebräische Idiom „die Person/das Leben suchen“ erscheint als geläufiges „nach dem Leben trachten“. Der Fußnotenmarker steht unmittelbar bei der idiomatisch wiedergegebenen, lexikalisch mehrdeutigen Schlussaussage.
