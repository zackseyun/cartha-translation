source:
  edition: WLC
  text: וַ/יִּשְׁאַל ל/וֹ֙ בַּֽ/יהוָ֔ה וְ/צֵידָ֖ה נָ֣תַן ל֑/וֹ וְ/אֵ֗ת חֶ֛רֶב גָּלְיָ֥ת הַ/פְּלִשְׁתִּ֖י נָ֥תַן לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: de
  text: Und er holte für ihn bei Yahweh Rat ein[a], gab ihm Proviant und gab ihm das Schwert Goliats, des Philisters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erkundigte sich für ihn bei Yahweh“.'
    reason: Lexikalische Alternative für שׁאל ב mit göttlichem Bezugswort; sie bewahrt die Bedeutung des Einholens göttlicher Auskunft und die Nuance des Handelns für David.
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: er befragte Yahweh für ihn
  rationale: שׁאל mit ב und dem Gottesnamen bezeichnet hier das Einholen göttlicher Auskunft; לּוֹ wird als Handeln für David beziehungsweise in seinem Interesse wiedergegeben. Die knappe Form wahrt den kultischen Sinn und die mögliche Nuance von »Rat einholen«.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname יהוה wird als »Yahweh« wiedergegeben.
- source_word: צֵידָה
  choice: Wegzehrung
  rationale: צֵידָה bezeichnet Vorrat beziehungsweise Verpflegung für den Weg. »Wegzehrung« ist im Zusammenhang präzise und im Deutschen verständlich.
- source_word: נָתַן לוֹ
  choice: gab ihm
  rationale: Die beiden Vorkommen von נתן mit indirektem Objekt werden gleichlautend übersetzt, sodass die wiederholende Anklageform des Hebräischen erhalten bleibt.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: und das Schwert des Philisters Goliat
  rationale: Die deutsche Wortstellung ist natürlich und bewahrt zugleich die Identifikation Goliats als Philister.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als solcher sichtbar gemacht, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Befragung Yahwehs
  choice: befragte Yahweh für ihn
  alternative: holte für ihn bei Yahweh Rat ein
  rationale: Die gewählte Fassung lässt offen, auf welche konkrete kultische Weise die göttliche Auskunft eingeholt wurde, und bewahrt die Stellvertretungsnuance von לּוֹ.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »gab ihm« folgt bewusst dem hebräischen Satzrhythmus; »Wegzehrung« konkretisiert den Reisevorrat, ohne ihn nur auf eine einzelne Speise zu verengen.
