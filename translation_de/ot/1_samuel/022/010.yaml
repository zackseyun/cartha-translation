  source_fidelity: 'Die Satzglieder und die wiederholten Verben נתן („gab ihm“) sind zutreffend wiedergegeben. לּוֹ bezeichnet das Handeln zugunsten bzw. im Auftrag Davids. Die Formulierung „befragte Yahweh für ihn“ bildet dies zwar formal ab, ist im Deutschen jedoch semantisch und syntaktisch missverständlich: Sie kann nahelegen, Yahweh sei für David befragt worden, ohne den gemeinten Vorgang des Einholens göttlicher Auskunft idiomatisch auszudrücken.'
  naturalness: „Holte für ihn bei Yahweh Rat ein“ ist modernes, verständliches Standarddeutsch und gibt die idiomatische Bedeutung von שאל ביהוה wieder. „Proviant“ ist gegenüber „Wegzehrung“ geläufiger und bezeichnet angemessen die mitgegebene Verpflegung bzw. Reisevorräte.
  terminology: „Yahweh“ folgt der angegebenen theologischen Entscheidung und gibt יהוה als Eigenname wieder. „Goliat, der Philister“ ist die im Deutschen übliche Namensform und bewahrt die hebräische Bezeichnung.
