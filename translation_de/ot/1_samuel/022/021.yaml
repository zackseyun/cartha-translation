source:
  edition: WLC
  text: וַ/יַּגֵּ֥ד אֶבְיָתָ֖ר לְ/דָוִ֑ד כִּ֚י הָרַ֣ג שָׁא֔וּל אֵ֖ת כֹּהֲנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/021.yaml
  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: de
  text: Abjatar berichtete David, dass Saul die Priester Jahwes getötet hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: berichtete
  rationale: Der Hifil von נגד bedeutet hier, etwas mitzuteilen oder bekannt zu machen. „Berichtete“ passt natürlich zu der Nachricht, die Abjatar David überbringt.
- source_word: אֶבְיָתָר
  choice: Abjatar
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: לְדָוִד
  choice: David
  rationale: Die Präposition לְ kennzeichnet den Empfänger der Mitteilung; im Deutschen wird dies bei „jemandem berichten“ durch den Dativ ausgedrückt.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt von Abjatars Bericht ein.
- source_word: הָרַג
  choice: getötet hatte
  rationale: Das Töten geschah vor Abjatars Bericht. Das deutsche Plusquamperfekt macht diese zeitliche Abfolge klar, ohne die Aussage auszudeuten.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Der Personenname wird in seiner üblichen deutschen biblischen Form wiedergegeben.
- source_word: כֹּהֲנֵי יְהוָה
  choice: die Priester Jahwes
  rationale: Die Genitivverbindung gibt die Zugehörigkeit der Priester zu Jahwe knapp und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben, statt es durch einen Titel wie „der HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Eigenname und entspricht der im Deutschen etablierten Form.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die knappe Satzstruktur des Hebräischen bleibt erhalten; das Plusquamperfekt verdeutlicht die im Kontext vorausliegende Handlung.
