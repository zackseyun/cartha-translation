id: 1SA.22.20
reference: 1 Samuel 22:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּמָּלֵ֣ט בֵּן אֶחָ֗ד לַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֲחִט֔וּב וּ/שְׁמ֖/וֹ אֶבְיָתָ֑ר וַ/יִּבְרַ֖ח אַחֲרֵ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: de
  text: Doch ein Sohn Ahimelechs, des Sohnes Ahitubs, entkam. Er hieß Abjatar und floh David nach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und floh zu David«. Wörtlich heißt es im Hebräischen: »und floh David nach«; gemeint sein kann, dass er David folgte, um sich ihm anzuschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: entkam
  rationale: Das Nifal von מלט bezeichnet hier das erfolgreiche Entkommen aus dem unmittelbar zuvor berichteten Massaker.
- source_word: בֵּן אֶחָד
  choice: ein Sohn
  rationale: Wörtlich »ein Sohn«; im genealogischen Zusammenhang bezeichnet בֵּן eine familiäre Beziehung und betont, dass ein Sohn entkam.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  choice: Ahimelechs, des Sohnes Ahitubs
  rationale: Das Präfix לְ kennzeichnet hier die Zugehörigkeit. Die deutsche Genitivkonstruktion gibt sowohl die Beziehung zu Ahimelech als auch dessen Abstammung natürlich wieder.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: Er hieß Abjatar
  rationale: Diese natürliche deutsche Namensformel gibt den hebräischen Satz »und sein Name war Abjatar« knapp und vollständig wieder.
- source_word: וַיִּבְרַח
  choice: und floh
  rationale: ברח bedeutet »fliehen«. Die Wiedergabe unterscheidet das Verb vom zuvor verwendeten מלט »entkommen«.
- source_word: אַחֲרֵי דָוִד
  choice: David nach
  rationale: Die Formulierung bewahrt die wörtliche räumliche Bedeutung »hinter/nach David«, kann im Kontext aber zugleich ausdrücken, dass Abjatar David folgte, um sich ihm anzuschließen.
- source_word: אֶבְיָתָר
  choice: Abjatar
  rationale: Gebräuchliche deutsche Transkription des Personennamens.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelech
  rationale: Gebräuchliche deutsche Transkription des Personennamens.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Gebräuchliche deutsche Transkription des Personennamens.
- source_word: וַ
  choice: Doch
  rationale: 'Das einleitende Waw verbindet den Vers mit dem vorangehenden Massaker und trägt hier eine leichte kontrastive Funktion: Trotz des Tötens entkam ein Sohn.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze sorgen für natürliche Lesbarkeit; »David nach« bewahrt zugleich die Mehrdeutigkeit der hebräischen Präposition.
