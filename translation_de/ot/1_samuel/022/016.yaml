  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: de
  text: 'Doch der König sagte: »Du musst sterben, Ahimelech, du und das ganze Haus deines Vaters.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Sterben wirst du«; die hebräische Verbverbindung verleiht dem Todesurteil besonderen Nachdruck. »Das Haus deines Vaters« bezeichnet den väterlichen Haushalt oder Familienverband.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Doch der König sagte
  rationale: Die narrative Verbform von אמר wird natürlich mit »sagte« wiedergegeben. »Doch« nimmt den Gegensatz zu Ahimelechs vorausgehender Verteidigung auf.
- source_word: מוֹת תָּמוּת
  choice: Du musst sterben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Todesaussage. Im richterlichen Kontext gibt »musst sterben« sowohl Nachdruck als auch Urteilscharakter in modernem Deutsch wieder.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelech
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form transliteriert.
- source_word: אַתָּה וְכָל בֵּית אָבִיךָ
  choice: du und deine ganze Sippe väterlicherseits
  rationale: Das ausdrücklich gesetzte אַתָּה wird beibehalten. בֵּית אָבִיךָ bezeichnet hier nicht bloß ein Gebäude, sondern den väterlichen Haushalt beziehungsweise Familienverband.
theological_decisions:
- issue: Reichweite von בֵּית אָבִיךָ
  choice: Sippe väterlicherseits
  alternative: Haus deines Vaters; ganze Familie
  rationale: Die Formulierung bezeichnet den väterlichen Familien- und Haushaltsverband. »Sippe väterlicherseits« bewahrt diese kulturelle Bestimmung, ohne die Aussage auf ein Wohnhaus zu verengen oder unbestimmt auf jede denkbare Verwandtschaft auszuweiten.
translation_notes:
  register: Modernes, würdevolles Erzähl- und Urteilsregister. Der Gedankenstrich macht das im Hebräischen ausdrücklich gesetzte »du« hörbar; die Fußnote wahrt die emphatische Form und erklärt das kulturelle Familienidiom.
