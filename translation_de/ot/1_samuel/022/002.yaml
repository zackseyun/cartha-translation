base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: de
  text: Zu ihm sammelten sich alle, die in Bedrängnis waren, alle, die einen Gläubiger hatten[a], und alle, deren Seele verbittert war[b]. Er wurde ihr Befehlshaber. Etwa vierhundert Mann waren bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „alle, die verschuldet waren“. Wörtlich spricht das Hebräische von jedem, der einen Gläubiger beziehungsweise Forderungseintreiber hatte.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „bitter der Seele“; gemeint ist tiefe innere Verbitterung oder Bedrückung.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: Zu ihm sammelten sich
  rationale: Die Form bezeichnet das Zusammenkommen einer Gruppe bei David; „zu ihm“ bewahrt dabei die durch אֶל ausgedrückte Ausrichtung auf ihn.
- source_word: כָּל אִישׁ
  choice: alle, die
  rationale: Die dreimalige distributive Wendung wird im Deutschen natürlich und unter Wahrung der parallelen Struktur wiedergegeben.
- source_word: מָצוֹק
  choice: in Bedrängnis
  rationale: Der Ausdruck umfasst Druck, Not und bedrängte Lebensumstände, ohne die Ursache unnötig einzuengen.
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  choice: die einen Gläubiger hatten
  rationale: Diese relativ formnahe Wiedergabe erhält die elliptische hebräische Aussage, wonach jemand einen Gläubiger beziehungsweise Forderungseintreiber gegen sich hatte.
- source_word: מַר נֶפֶשׁ
  choice: deren Seele verbittert war
  rationale: Die Wiedergabe bewahrt das hebräische Bild von der Bitterkeit der נֶפֶשׁ und bleibt im modernen Deutschen verständlich.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: Er wurde ihr Befehlshaber
  rationale: שַׂר kann einen Obersten, Anführer oder Befehlshaber bezeichnen; im Zusammenhang mit Davids bewaffneter Gefolgschaft passt „Befehlshaber“, ohne einen bestimmten militärischen Rang festzulegen.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: Etwa vierhundert Mann
  rationale: Das Präfix כְּ bezeichnet hier eine ungefähre Zahl; „Mann“ entspricht der Zählung erwachsener männlicher Gefolgsleute.
