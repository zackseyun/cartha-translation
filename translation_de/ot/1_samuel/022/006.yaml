base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: de
  text: Saul erfuhr, wo David und die Männer, die bei ihm waren, sich aufhielten.[a] Saul aber saß in Gibea unter der Tamariske auf der Anhöhe,[b] den Speer in der Hand, und alle seine Diener standen um ihn herum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass David und die Männer, die bei ihm waren, bekannt geworden waren“. Das hebräische Verb kann auch „entdeckt werden“ bedeuten und meint hier wohl, dass ihr Aufenthaltsort bekannt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Möglicherweise: „bei Rama“, falls das hebräische Wort hier als Ortsname und nicht als „Anhöhe“ verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Die Grundbedeutung von שׁמע bezeichnet hier das Empfangen einer Nachricht; „hörte“ bewahrt die hebräische Erzählweise und ist im Deutschen natürlich.
- source_word: כִּי נוֹדַע דָּוִד וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: dass David und die Männer bei ihm bekannt geworden waren
  rationale: Der Nifal von ידע kann „bekannt werden“ oder „entdeckt werden“ bedeuten. Die gewählte Formulierung bleibt nahe am Wortlaut und lässt offen, ob besonders ihr Aufenthaltsort bekannt wurde.
- source_word: יוֹשֵׁב
  choice: saß damals
  rationale: Das Partizip zeichnet eine andauernde Hintergrundszene. „Saß damals“ gibt diesen szenischen Übergang in natürlichem Deutsch wieder.
- source_word: בַּגִּבְעָה
  choice: in Gibea
  rationale: גבעה wird hier als Ortsname verstanden; bei einer Stadt ist „in Gibea“ im Deutschen idiomatisch.
- source_word: תַּחַת הָאֶשֶׁל
  choice: unter der Tamariske
  rationale: אשל wird gewöhnlich als Tamariske bestimmt. Der deutsche Pflanzenname ist verständlicher als eine Transliteration; ein zusätzliches „Baum“ ist nicht erforderlich.
- source_word: בָּרָמָה
  choice: auf der Anhöhe
  rationale: Artikel und Zusammenhang begünstigen die Gattungsbezeichnung „Anhöhe“ gegenüber dem Ortsnamen Rama. Die räumliche Formulierung passt zur erhöhten Lage.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: den Speer in der Hand
  rationale: Die verblosen hebräischen Worte beschreiben Sauls Haltung. Die knappe deutsche Begleitkonstruktion bewahrt das Bild.
- source_word: וְכָל עֲבָדָיו
  choice: alle seine Diener
  rationale: עבדים kann am Königshof Diener, Gefolgsleute oder Amtsträger bezeichnen. „Diener“ ist die breiteste und textnächste Wiedergabe.
- source_word: נִצָּבִים עָלָיו
  choice: standen um ihn herum
  rationale: Das Partizip bezeichnet die positionierten Diener in Sauls Gegenwart. „Um ihn herum“ vermittelt die höfische Szene ohne das räumlich missverständliche „über ihm“.
