    rationale: Die formal nahe Formulierung ist im modernen Standarddeutsch als Stammesanrede unidiomatisch. »ihr Benjaminiter« überträgt die hebräische Kollektivbezeichnung natürlich und ohne Bedeutungsverlust.
  - severity: low
