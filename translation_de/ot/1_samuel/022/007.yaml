base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: de
  text: 'Da sagte Saul zu seinen Dienern, die bei ihm standen: »Hört doch, ihr Benjaminiter! Wird der Sohn Isais etwa auch euch allen Felder und Weinberge geben? Wird er euch alle zu Anführern über Tausend und zu Anführern über Hundert machen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: Das Wort bezeichnet hier Sauls Gefolgsleute beziehungsweise Amtsträger; »Diener« bewahrt die soziale Beziehung, ohne sie unnötig auf Beamte oder Soldaten einzuengen.
- source_word: הַנִּצָּבִים עָלָיו
  choice: die um ihn standen
  rationale: Im Kontext bezeichnet die Wendung die bei Saul stehenden Gefolgsleute. Die natürliche deutsche Formulierung wahrt das räumliche Bild.
- source_word: שִׁמְעוּ נָא
  choice: Hört doch
  rationale: נא verleiht der Aufforderung Nachdruck beziehungsweise werbenden Ton; »doch« klingt im Deutschen natürlicher als ein wörtliches »bitte« in Sauls rhetorischem Appell.
- source_word: בְּנֵי יְמִינִי
  choice: ihr Söhne Benjamins
  rationale: Die Stammesbezeichnung wird formal bewahrt, da Saul seine Stammesgenossen gezielt anspricht und damit an ihre Loyalität appelliert.
- source_word: בֶּן יִשַׁי
  choice: der Sohn Isais
  rationale: Sauls distanzierende Bezeichnung Davids wird beibehalten, statt den Namen erklärend einzusetzen.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: Obersten über Tausend und Obersten über Hundert
  rationale: Die militärisch-administrativen Rangbezeichnungen und ihre zahlenbezogene Struktur werden erhalten.
theological_decisions:
- issue: Sauls rhetorische Fragen und Stammesappell
  choice: Die Fragen bleiben offen rhetorisch formuliert, einschließlich »etwa auch« und der Anrede »Söhne Benjamins«.
  alternative: Die implizite Antwort ausdrücklich als Verneinung formulieren oder die Anrede zu »Benjaminiter« glätten.
  rationale: Der hebräische Text lässt Saul durch Fragen Misstrauen gegen David schüren und zugleich stammesbezogene Patronage ansprechen; diese Spannung soll nicht erklärend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die Wiederholung »euch alle/euch allen« und die parallele Rangformel spiegeln Sauls zugespitzte Rhetorik.
