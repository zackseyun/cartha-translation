id: 1SA.21.16
reference: 1 Samuel 21:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: de
  text: Fehlt es mir etwa an Verrückten, dass ihr diesen da zu mir gebracht habt, damit er sich vor mir wie ein Verrückter aufführt?[a] Soll dieser da in mein Haus kommen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit er sich in meiner Gegenwart verrückt benimmt“. Der hebräische Ausdruck bezeichnet ein Verhalten wie das eines Wahnsinnigen; aus dem Zusammenhang geht hervor, dass David den Wahnsinn nur vortäuschte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: Fehlt es mir etwa an Verrückten
  rationale: Die prädikative Wendung wird als scharf-sarkastische rhetorische Frage wiedergegeben. „Verrückte“ bewahrt den abwertenden Ton, ohne altertümlich zu klingen.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: ihr diesen da zu mir gebracht habt
  rationale: „Diesen da“ gibt den geringschätzigen demonstrativen Ausdruck natürlich wieder; „zu mir“ verdeutlicht im Deutschen das Ziel des Bringens, das im folgenden עָלָי konkretisiert wird.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: damit er sich … wie ein Verrückter aufführt
  rationale: Der Hitpael-Infinitiv bezeichnet ein Verhalten wie das eines Wahnsinnigen. Die Formulierung lässt offen, ob der Zustand echt oder gespielt ist, während der Erzählkontext auf Davids Verstellung weist.
- source_word: עָלָי
  choice: vor mir
  rationale: Hier bezeichnet die Präposition ein Verhalten in Gegenwart beziehungsweise vor den Augen des Königs, nicht notwendig einen Angriff gegen ihn.
- source_word: הֲזֶה
  choice: dieser da
  rationale: Die Wiederholung des Demonstrativs bewahrt Achischs verächtlichen, abweisenden Ton.
- source_word: יָבֹא אֶל־בֵּיתִי
  choice: in mein Haus kommen
  rationale: Die Formulierung gibt die Bewegung in das Haus beziehungsweise den königlichen Haushalt hinein wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Verrückte“ ist bewusst direkt und spiegelt die verächtliche Rede des Königs; „diesen da“ erhält die demonstrative Geringschätzung. Der Fußnotenmarker steht unmittelbar bei der betroffenen Wendung.
