base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/001.yaml
  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: de
  text: Dann stand er auf und ging fort, und Jonatan kam in die Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Jonatan ging in die Stadt.“ Wörtlich steht im Hebräischen „kam in die Stadt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Dann stand er auf
  rationale: Das Qal-Wayyiqtol von קום führt die Erzählung fort und bezeichnet hier das Aufstehen; „Dann“ gibt die zeitliche Abfolge natürlich wieder.
- source_word: וַיֵּלַךְ
  choice: und ging fort
  rationale: Das Qal-Wayyiqtol von הלך bedeutet „gehen“. Im Zusammenhang des Abschieds bringt „ging fort“ die Trennung natürlich zum Ausdruck, ohne mehr als der Kontext auszusagen.
- source_word: וִיהוֹנָתָן
  choice: und Jonatan
  rationale: Der Eigenname wird in der im Deutschen üblichen biblischen Form „Jonatan“ wiedergegeben.
- source_word: בָּא
  choice: kam in
  rationale: Das Qal-Perfekt von בוא bedeutet hier wörtlich „kam“. Diese deiktische Perspektive bleibt im Haupttext erhalten; das im Deutschen ebenfalls mögliche „ging in“ wird in der Fußnote genannt.
- source_word: הָעִיר
  choice: die Stadt
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft; mit dem bestimmten Artikel ist „die Stadt“ die direkte und übliche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die knappe hebräische Satzfolge wird bewahrt; „stand auf“ ist im heutigen Deutsch natürlicher als das gehobenere „erhob sich“. Der Fußnotenmarker steht nach dem Satzteil, auf den sich die deiktische Alternative bezieht.
