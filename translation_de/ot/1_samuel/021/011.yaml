  text: וַ/יָּ֣קָם דָּוִ֔ד וַ/יִּבְרַ֥ח בַּ/יּוֹם הַ/ה֖וּא מִ/פְּנֵ֣י שָׁא֑וּל וַ/יָּבֹ֕א אֶל אָכִ֖ישׁ מֶ֥לֶךְ גַּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/011.yaml
  text: So David arose and fled that day from Saul, and he came to Achish king of Gath.
translation:
  language: de
  text: Da machte David sich auf und floh an jenem Tag vor Saul. Er kam zu Achisch, dem König von Gat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich auf
  rationale: קום bedeutet wörtlich „aufstehen/sich erheben“. Im Zusammenhang leitet es Davids Aufbruch ein; „machte sich auf“ bewahrt die Handlung, ohne ein bloß körperliches Aufstehen nahezulegen.
- source_word: וַיִּבְרַח
  choice: floh
  rationale: ברח bezeichnet unmittelbar die Flucht und gibt die Dringlichkeit der Handlung knapp und idiomatisch wieder.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die feste Zeitangabe wird in natürlichem, leicht gehobenem Standarddeutsch präzise wiedergegeben.
- source_word: מִפְּנֵי שָׁאוּל
  choice: vor Saul
  rationale: Die Wendung bedeutet wörtlich „vom Angesicht Sauls weg“ und bezeichnet hier Saul als denjenigen, vor dem David flieht. „Vor Saul fliehen“ ist die idiomatische deutsche Entsprechung.
- source_word: וַיָּבֹא אֶל
  choice: Er kam zu
  rationale: בוא mit אֶל bezeichnet das Kommen beziehungsweise Gelangen zu einer Person. „Kam zu“ folgt der Erzählperspektive des Hebräischen.
- source_word: אָכִישׁ
  choice: Achisch
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: מֶלֶךְ גַּת
  choice: dem König von Gat
  rationale: Die Konstruktverbindung bezeichnet Achischs Amt. Im Deutschen wird die Apposition nach „zu Achisch“ entsprechend flektiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper narrativer Satzfolge. Der erste Satz beginnt mit „Da“, um die fortlaufende hebräische Erzählstruktur natürlich anzudeuten; ein altertümliches „und es geschah“ wird vermieden.
