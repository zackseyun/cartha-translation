  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: de
  text: An jenem Tag war dort ein Mann von den Dienern Sauls, der vor Jahwe festgehalten wurde[a]. Sein Name war Doëg, der Edomiter, der Oberste von Sauls Hirten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Jahwe zurückgehalten“ oder „vor Jahwe aufgehalten“. Der hebräische Text sagt nicht, weshalb Doëg dort festgehalten wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל
  choice: dort ein Mann von den Dienern Sauls
  rationale: Gibt die Ortsangabe und die partitive Zugehörigkeit direkt wieder. „Diener“ bewahrt den breiten Bedeutungsumfang von עֶבֶד im königlichen Dienst.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche deutsche Wiedergabe der bestimmten Zeitangabe.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: der vor Jahwe festgehalten wurde
  rationale: „Festgehalten“ bewahrt die passive Bedeutung und lässt offen, ob eine kultische, rituelle oder andere Ursache gemeint ist.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: Sein Name war Doëg, der Edomiter
  rationale: Natürliche Wiedergabe der Namensformel; die Schreibung „Doëg“ macht im Deutschen die getrennte Aussprache der Vokale kenntlich.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: der Oberste von Sauls Hirten
  rationale: Im administrativen Zusammenhang bezeichnet אַבִּיר wahrscheinlich Vorrang oder Leitungsrang. Die Zugehörigkeit der Hirten zu Saul wird kompakt ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; „Jahwe“ gibt ihn im modernen Standarddeutsch als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von נֶעְצָר לִפְנֵי יְהוָה
  choice: vor Jahwe festgehalten
  alternative: vor Jahwe zurückgehalten / aufgehalten
  rationale: Der Text nennt weder Grund noch genaue Art des Festgehaltenwerdens. Die Übersetzung vermeidet daher eine nicht ausdrücklich genannte kultische Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Lesbarkeit geteilt; die erzählerische Nebeninformation und die Mehrdeutigkeit des hebräischen Partizips bleiben erhalten.
