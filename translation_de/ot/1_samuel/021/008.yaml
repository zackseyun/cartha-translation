  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des hebräischen Textes wieder: Doëg gehört zu Sauls Dienern, befand sich an jenem Tag dort und war „vor Jahwe“ festgehalten. Der Grund und die genaue Art dieses Festgehaltenwerdens bleiben angemessen offen. „Der Oberste von Sauls Hirten“ gibt אַבִּיר הָרֹעִים im administrativen Zusammenhang plausibel und idiomatisch wieder.'
