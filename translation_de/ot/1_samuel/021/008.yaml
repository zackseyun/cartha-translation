  terminology: „Jahwe“ folgt der vorgegebenen Wiedergabe des Tetragramms. „Dienern Sauls“, „Doëg, der Edomiter“ und „Sauls Hirten“ sind terminologisch treffend. Die Namensschreibung „Doëg“ ist im Deutschen nachvollziehbar und etabliert.
