  text: וַ/יֹּ֥אמֶר אָכִ֖ישׁ אֶל עֲבָדָ֑י/ו הִנֵּ֤ה תִרְאוּ֙ אִ֣ישׁ מִשְׁתַּגֵּ֔עַ לָ֛/מָּה תָּבִ֥יאוּ אֹת֖/וֹ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: de
  text: 'Und Achisch sagte zu seinen Dienern: „Da seht ihr einen Mann, der sich wie ein Wahnsinniger aufführt.[a] Warum bringt ihr ihn zu mir?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Mann, der wahnsinnig ist“ / „einen Wahnsinnigen“. Das hebräische Partizip kann sowohl tatsächlichen Wahnsinn als auch ein Verhalten bezeichnen, mit dem Wahnsinn dargestellt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Gibt die fortlaufende hebräische Erzählform schlicht wieder, ohne den Zusammenhang stärker auszudeuten.
- source_word: אָכִישׁ
  choice: Achisch
  rationale: Übliche deutsche Transliteration des Personennamens.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עבד bezeichnet hier Männer im Dienst des Königs; „Diener“ ist direkt und im Hofkontext verständlich.
- source_word: הִנֵּה תִרְאוּ
  choice: Seht, ihr seht
  rationale: Bewahrt sowohl den aufmerksamkeitslenkenden Ausruf הִנֵּה als auch die ausdrückliche Verbform תִרְאוּ, obwohl die Wiederholung im Deutschen markant wirkt.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Entspricht der konkreten Bezeichnung אִישׁ, ohne sie zu „jemand“ zu verallgemeinern.
- source_word: מִשְׁתַּגֵּעַ
  choice: der sich wie ein Wahnsinniger aufführt
  rationale: Die Hitpael-Partizipialform beschreibt ein fortdauerndes Verhalten und lässt im Kontext offen, ob der Mann tatsächlich wahnsinnig ist oder Wahnsinn vorspielt.
- source_word: לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי
  choice: Warum bringt ihr ihn zu mir?
  rationale: Gibt Frage, Imperfektform, Objekt und Zielrichtung unmittelbar und in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wiederholung „Seht, ihr seht“ wurde zur formnahen Wiedergabe von הִנֵּה תִרְאוּ beibehalten; die Mehrdeutigkeit des dargestellten beziehungsweise tatsächlichen Wahnsinns wird in der Fußnote offengehalten.
