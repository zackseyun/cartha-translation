  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: de
  text: 'David kam nach Nob zu dem Priester Ahimelech. Ahimelech zitterte, als er David entgegenging, und fragte ihn: »Warum bist du allein und niemand ist bei dir?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: zitterte
  rationale: Gibt die starke, körperlich wahrnehmbare Bestürzung oder Angst des hebräischen Verbs wieder, ohne ihren Grund näher festzulegen.
- source_word: לִקְרַאת דָּוִד
  choice: als er David entgegenging
  rationale: Bewahrt die Bewegungsrichtung der Wendung und klingt im Deutschen natürlicher als eine substantivische Wiedergabe.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: und warum ist niemand bei dir?
  rationale: Das wörtliche »und kein Mann ist bei dir« ist hier idiomatisch als Hinweis auf das Fehlen jeglicher Begleitung zu verstehen; »niemand« gibt dies in modernem Deutsch klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »warum« macht die koordinierte hebräische Frage im Deutschen verständlich, ohne ihren Sinn zu verändern.
