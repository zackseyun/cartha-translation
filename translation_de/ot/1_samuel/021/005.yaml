base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: de
  text: 'Der Priester antwortete David: „Ich habe kein gewöhnliches Brot zur Hand, sondern es gibt heiliges Brot – vorausgesetzt, die jungen Männer haben sich zumindest von Frauen ferngehalten.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von einer Frau“; gemeint ist sexuelle Enthaltsamkeit im Zusammenhang mit ritueller Reinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: gewöhnliches Brot
  rationale: חֹל bezeichnet im Gegensatz zu קֹדֶשׁ nicht geweihtes, alltägliches Brot; „gewöhnlich“ gibt den kultischen Gegensatz natürlich wieder, ohne eine moralische Abwertung anzudeuten.
- source_word: אֶל תַּחַת יָדִי
  choice: zur Hand
  rationale: Die Wendung bedeutet idiomatisch „verfügbar“ oder „in meinem Besitz“; „zur Hand“ ist im Deutschen knapp und natürlich.
- source_word: כִּי אִם לֶחֶם קֹדֶשׁ יֵשׁ
  choice: sondern nur heiliges Brot
  rationale: כִּי אִם führt nach der Verneinung die Ausnahme ein. „Sondern nur“ bildet die Aussage verständlich ab, während „heiliges Brot“ den kultischen Status direkt wiedergibt.
- source_word: אִם נִשְׁמְרוּ
  choice: vorausgesetzt, … haben sich … ferngehalten
  rationale: Die Nifalform bezeichnet hier, dass die Männer sich selbst von etwas zurückgehalten haben. „Vorausgesetzt“ macht den konditionalen Charakter deutlich.
- source_word: הַנְּעָרִים
  choice: die jungen Männer
  rationale: נְעָרִים kann junge Männer oder Begleiter bezeichnen. Die gewählte Form wahrt die lexikalische Offenheit, ohne ihre Stellung näher festzulegen.
- source_word: אַךְ מֵאִשָּׁה
  choice: von Frauen ferngehalten
  rationale: אַךְ begrenzt die Bedingung auf diesen Gesichtspunkt; dies wird im Deutschen durch die Konstruktion hinreichend ausgedrückt. Der Singular אִשָּׁה kann kollektiv verstanden werden.
theological_decisions:
- issue: Bedingung ritueller Reinheit für den Empfang des heiligen Brotes
  choice: Die Bedingung wird als Fernhalten von Frauen formuliert und in der Fußnote als sexuelle Enthaltsamkeit im Zusammenhang kultischer Reinheit erläutert.
  alternative: Explizit im Haupttext von sexuellen Beziehungen oder ritueller Reinheit sprechen.
  rationale: Der Haupttext bleibt nahe an der zurückhaltenden Formulierung des Hebräischen und vermeidet den Eindruck einer allgemeinen Abwertung von Frauen oder Sexualität; die kontextuelle Bedeutung wird in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas formelhafte Doppelung „antwortete … und sagte“ wurde natürlich zu „antwortete“ gestrafft. Der kultische Gegensatz zwischen gewöhnlichem und heiligem Brot bleibt klar erhalten.
