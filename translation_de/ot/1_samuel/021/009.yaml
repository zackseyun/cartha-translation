source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לַ/אֲחִימֶ֔לֶךְ וְ/אִ֛ין יֶשׁ פֹּ֥ה תַֽחַת יָדְ/ךָ֖ חֲנִ֣ית אוֹ חָ֑רֶב כִּ֣י גַם חַרְבִּ֤/י וְ/גַם כֵּלַ/י֙ לֹֽא לָקַ֣חְתִּי בְ/יָדִ֔/י כִּֽי הָיָ֥ה דְבַר הַ/מֶּ֖לֶךְ נָחֽוּץ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: de
  text: 'Und David sagte zu Ahimelech: »Hast du hier nicht einen Speer oder ein Schwert zur Hand?[a] Denn ich habe weder mein Schwert noch meine Ausrüstung[b] mitgenommen, weil die Angelegenheit des Königs[c] dringend war.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter deiner Hand«; gemeint sein kann »zu deiner Verfügung« oder »in deinem Besitz«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »meine Geräte« beziehungsweise »meine Waffen«. Das hebräische Wort kann allgemein Gegenstände, Gerät oder Ausrüstung bezeichnen, hier vermutlich militärische Ausrüstung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »der Auftrag des Königs« beziehungsweise »der Befehl des Königs«. Das hebräische Wort bedeutet sowohl »Wort« als auch »Sache« oder »Angelegenheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Gibt die übliche hebräische Erzählverknüpfung wieder und leitet die direkte Rede natürlich ein.
- source_word: וְאִין יֶשׁ פֹּה
  choice: Hast du hier nicht
  rationale: Natürliche deutsche Wiedergabe der idiomatischen negativen Existenzfrage im Zusammenhang mit etwas, das Ahimelech verfügbar haben könnte.
- source_word: תַחַת יָדְךָ
  choice: zur Hand
  rationale: Bewahrt das Bild der Hand in einer geläufigen deutschen Wendung und vermittelt zugleich »verfügbar/in deinem Besitz«.
- source_word: חֲנִית אוֹ חָרֶב
  choice: einen Speer oder ein Schwert
  rationale: Direkte Wiedergabe der beiden singularischen Waffenbezeichnungen.
- source_word: גַם חַרְבִּי וְגַם כֵּלַי
  choice: weder mein Schwert noch meine Ausrüstung
  rationale: Im negativen deutschen Satz gibt »weder … noch« die wiederholte Verknüpfung idiomatisch wieder. כְּלִי ist weiter als »Waffen« und kann Ausrüstung oder Gerät bezeichnen.
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: habe … nicht mitgenommen
  rationale: Die hebräische Wendung bedeutet hier natürlich, dass David die Gegenstände nicht bei sich führte; eine wörtliche Wiedergabe mit »in meine Hand« wäre im modernen Deutsch missverständlich.
- source_word: דְבַר הַמֶּלֶךְ
  choice: die Angelegenheit des Königs
  rationale: Bewahrt die Bedeutungsbreite von דָּבָר zwischen Angelegenheit, Auftrag und Befehl, ohne die Aussage unnötig festzulegen.
- source_word: נָחוּץ
  choice: dringend
  rationale: Klare moderne Wiedergabe für etwas Drängendes oder Eiliges.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Hand-Wendung wird mit dem geläufigen »zur Hand« aufgenommen; die Mehrdeutigkeit von כְּלִי und דְּבַר bleibt durch Fußnoten sichtbar.
