source:
  edition: WLC
  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: de
  text: Da gab ihm der Priester heiliges Brot; denn dort war kein anderes Brot als das Brot der Gegenwart[a], das vor Jahwe weggenommen worden war, um am Tag seiner Wegnahme heißes Brot hinzulegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Schaubrot“; wörtlich: „Brot des Angesichts“ beziehungsweise „Brot der Gegenwart“.'
    reason: Der traditionelle deutsche Fachausdruck ist geläufig, gibt die Bildsprache des hebräischen Ausdrucks jedoch weniger durchsichtig wieder.
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: heiliges Brot
  rationale: Das Substantiv bedeutet wörtlich „Heiliges“; im Zusammenhang ist damit eindeutig das geheiligte Brot gemeint. Die explizite Wiedergabe ist im Deutschen natürlich und kontextgemäß.
- source_word: לֶחֶם הַפָּנִים
  choice: das Brot der Gegenwart
  rationale: Die kultische Bezeichnung meint das vor Jahwe aufgelegte Brot. „Brot der Gegenwart“ bewahrt den Bezug auf die göttliche Gegenwart und ist für heutige Leser verständlicher als der traditionelle Ausdruck „Schaubrot“.
- source_word: הַמּוּסָרִים
  choice: das … weggenommen worden war
  rationale: Das passive Partizip beschreibt das Brot nach seiner rituellen Entfernung. Wegen des deutschen Singulars „Brot“ wird der im Hebräischen formal plurale Bezug idiomatisch im Singular wiedergegeben.
- source_word: מִלִּפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet die Entfernung aus dem Bereich vor Jahwe und bewahrt den räumlich-kultischen Sinn knapp und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָשׂוּם
  choice: hinzulegen
  rationale: 'Der Infinitiv bezeichnet den Zweck der Entfernung: Neues Brot sollte hingelegt werden.'
- source_word: לֶחֶם חֹם
  choice: heißes Brot
  rationale: חֹם bedeutet wörtlich „heiß“. Obwohl damit frisch gebackenes Brot gemeint sein kann, lässt „heiß“ die konkrete Ausdrucksweise des Hebräischen stehen.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: an dem Tag, an dem es weggenommen wurde
  rationale: Die temporale Wendung wird als natürlicher deutscher Relativsatz wiedergegeben und behält den Bezug auf den Tag der Wegnahme bei.
- source_word: כִּי לֹא הָיָה שָׁם לֶחֶם כִּי אִם
  choice: denn dort war kein anderes Brot als
  rationale: Die Formulierung gibt sowohl die begründende Funktion von כִּי als auch die ausschließende Bedeutung von כִּי אִם idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Deutung von לֶחֶם הַפָּנִים
  choice: Brot der Gegenwart
  alternative: Schaubrot
  rationale: Die gewählte Form bewahrt den Bezug des Ausdrucks auf Gottes Gegenwart, ohne eine weitergehende kultische Deutung einzutragen; die traditionelle Benennung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der begründenden und rituell-prozeduralen Struktur des Hebräischen, ohne unnötige Altertümlichkeit. Die Wiederholung von „weggenommen“ wurde beibehalten, weil sie der Wiederaufnahme des hebräischen Verbs entspricht.
