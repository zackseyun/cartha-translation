  - severity: low
    issue: „gewöhnlicher Weg“ ist im Deutschen semantisch und idiomatisch weniger passend.
    rationale: Im Kontext bezeichnet דֶּרֶךְ am ehesten die Unternehmung bzw. Reise. „Gewöhnliche Reise“ wahrt den Gegensatz zu „heilig“ und klingt natürlicher.
  - severity: low
