review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die kultische Gegenüberstellung von heilig und gewöhnlich sowie die Mehrdeutigkeit von כְּלִי grundsätzlich angemessen wieder. Jedoch schwächt „wie auch sonst, wenn ich ausziehe“ die rückblickende Zeitangabe und den abgeschlossenen Aufbruch des hebräischen Textes zu einer allgemeinen Gewohnheitsaussage ab. „Gewöhnlicher Weg“ ist außerdem im Deutschen weniger treffend als „gewöhnliche Reise“.
  naturalness: Der Satzbau ist überwiegend verständlich, doch „wie auch sonst, wenn ich ausziehe“ klingt unnötig gegenwärtig-habitual. Die Schlussklausel bleibt auch nach einer vorsichtigen Glättung bewusst sperrig, weil der hebräische Wortlaut selbst schwer deutbar ist.
  terminology: „Heilig“ und „gewöhnlich“ geben קֹדֶשׁ und חֹל sachgerecht und ohne nachträgliche Moralisierung wieder. „Geräte“ bewahrt die lexikalische und referenzielle Offenheit besser als eine Festlegung auf Körper oder Ausrüstung; die Fußnote erläutert die möglichen Bezüge. Die temporale Fußnote soll die deutsche Hauptfassung und die hebräische Wendung genauer aufeinander beziehen.
