base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: de
  text: 'David antwortete dem Priester: „Frauen sind uns tatsächlich seit gestern und vorgestern[a] vorenthalten, seit ich aufgebrochen bin[b]. Die Geräte der jungen Männer sind heilig[c], obwohl es eine gewöhnliche Reise ist. Um wie viel mehr wird es heute im Gerät geheiligt sein.“[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wie gestern, vorgestern“. Die hebräische Wendung verweist auf frühere Tage; manche verstehen sie genauer als „seit ungefähr drei Tagen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei meinem Aufbruch“. Die hebräische Form bezeichnet den Zeitpunkt oder Umstand von Davids Aufbruch.'
    reason: lexical_alternative
  - marker: c
    text: Mit den „Geräten“ kann die Ausrüstung der jungen Männer gemeint sein; manche verstehen das Wort hier verhüllend als Hinweis auf ihre Körper oder Personen.
    reason: lexical_alternative
  - marker: d
    text: 'Der hebräische Wortlaut der letzten Satzteile ist schwer verständlich. Möglich ist auch: „Obwohl die Reise gewöhnlich ist, wird es heute hinsichtlich des Geräts geheiligt sein“, oder ähnlich.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: Frauen sind uns vorenthalten gewesen
  rationale: Die Formulierung bewahrt die passive Gestalt des Hebräischen und bezeichnet im Zusammenhang sexuelle Enthaltsamkeit als Voraussetzung ritueller Bereitschaft. Der Singular אִשָּׁה kann hier generisch beziehungsweise kollektiv verstanden werden.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: wie auch sonst
  rationale: Die wörtlich auf frühere Tage verweisende hebräische Wendung bezeichnet hier wahrscheinlich die übliche vorherige Enthaltsamkeit. Die idiomatische Wiedergabe vermeidet eine nicht sichere Festlegung auf genau drei Tage; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: בְּצֵאתִי
  choice: wenn ich ausziehe
  rationale: Der Infinitiv mit בְּ gibt den Zeitpunkt beziehungsweise Begleitumstand des Aufbruchs an. Das Präsens entspricht der Aussage über das übliche Vorgehen.
- source_word: כְלֵי הַנְּעָרִים
  choice: die Geräte der jungen Männer
  rationale: כְּלִי kann Gefäß, Gegenstand, Gerät oder Ausrüstung bedeuten. „Geräte“ bleibt relativ formal und lässt offen, ob Ausrüstung oder euphemistisch die Körper beziehungsweise Personen der Männer gemeint sind.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: Das Wort bezeichnet einen ausgesonderten, geheiligten Status. „Heilig“ gibt den kultischen Gegensatz zu חֹל unmittelbar wieder, ohne ihn auf bloße Reinheit zu verengen.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: obwohl es sich um einen gewöhnlichen Weg handelt
  rationale: חֹל bedeutet hier „gewöhnlich, nicht heilig“, nicht sittlich verwerflich. דֶּרֶךְ wird im Kontext als Weg beziehungsweise Reise verstanden; die konzessive Verknüpfung bildet den schwierigen Gegensatz sinnvoll ab.
- source_word: וְאַף כִּי
  choice: Wie viel mehr
  rationale: Die Wendung hat häufig steigernde beziehungsweise folgernde Kraft. Die Wiedergabe wahrt diese Argumentationsbewegung, ohne die schwierige Syntax aufzulösen.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: wird es heute geheiligt sein
  rationale: Die Form kann im Zusammenhang passiv oder reflexiv verstanden werden. „Geheiligt sein“ erhält sowohl den verbalen Gedanken des Heiligens als auch den resultierenden heiligen Zustand.
- source_word: בַּכֶּלִי
  choice: im Gerät
  rationale: Die Präpositionalverbindung ist dunkel. Die Wiederaufnahme von „Gerät“ wahrt die lexikalische Verbindung zu כְלֵי und entscheidet nicht, ob Ausrüstung, Körper oder ein kultischer Gegenstand gemeint ist.
theological_decisions:
- issue: Rituelle Reinheit im Zusammenhang mit sexueller Enthaltsamkeit und heiligem Brot
  choice: Die Aussage wird in den Kategorien von Heiligkeit und gewöhnlichem Status wiedergegeben, ohne sie als sittliches Urteil auszuweiten.
  alternative: Die Passage ausschließlich als moralische Reinheit oder lediglich als praktische Sauberkeit verstehen.
  rationale: Der Zusammenhang betrifft die Eignung zum Empfang geheiligten Brotes. Das Hebräische stellt Heiliges und Gewöhnliches einander gegenüber und setzt wahrscheinlich sexuelle Enthaltsamkeit als rituelle Vorbereitung voraus.
- issue: Deutung der schwierigen Schlussklausel
  choice: Die grammatische und sachliche Spannung bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
  alternative: Die Klausel eindeutig auf die Körper der Männer, ihre Ausrüstung oder das Brot beziehen.
  rationale: Wortlaut und Syntax erlauben keine hinreichend sichere Festlegung. Eine eindeutige Deutung würde mehr behaupten, als der überlieferte Text erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bezeichnung „Geräte“ und die etwas spröde Schlussklausel sind bewusst beibehalten, weil der hebräische Text an diesen Stellen mehrdeutig und syntaktisch schwierig ist. Alle Erläuterungen stehen an markierten Stellen im Haupttext.
