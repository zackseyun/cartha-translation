  to: 'David antwortete dem Priester: „Frauen sind uns tatsächlich seit gestern und vorgestern[a] vorenthalten, seit ich aufgebrochen bin[b]. Die Geräte der jungen Männer sind heilig[c], obwohl es eine gewöhnliche Reise ist. Um wie viel mehr wird es heute im Gerät geheiligt sein.“[d]'
