  text: וַ/יֹּ֣אמֶר הַ/כֹּהֵ֗ן חֶרֶב֩ גָּלְיָ֨ת הַ/פְּלִשְׁתִּ֜י אֲשֶׁר הִכִּ֣יתָ בְּ/עֵ֣מֶק הָאֵלָ֗ה הִנֵּה הִ֞יא לוּטָ֣ה בַ/שִּׂמְלָה֮ אַחֲרֵ֣י הָ/אֵפוֹד֒ אִם אֹתָ֤/הּ תִּֽקַּח לְ/ךָ֙ קָ֔ח כִּ֣י אֵ֥ין אַחֶ֛רֶת זוּלָתָ֖/הּ בָּ/זֶ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אֵ֥ין כָּמ֖וֹ/הָ תְּנֶ֥/נָּה לִּֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: de
  text: 'Und der Priester sagte: »Das Schwert des Philisters Goliat, den du im Tal Elah erschlagen hast – sieh, es ist hinter dem Efod in ein Gewand eingewickelt.[a] Wenn du es für dich nehmen willst, dann nimm es; denn außer diesem ist hier kein anderes.« David sagte: »Keines ist ihm gleich. Gib es mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann ein Gewand, Obergewand oder einen Mantel bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: das Schwert des Philisters Goliat
  rationale: Gibt die hebräische Genitivverbindung natürlich wieder und bewahrt die ethnische Bezeichnung als Apposition zu Goliat.
- source_word: הִכִּיתָ
  choice: du ... erschlagen hast
  rationale: נכה bezeichnet im Kampfzusammenhang ein Niederschlagen und kann den Tod einschließen; hier bestätigt der Erzählkontext Goliats Tötung.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: im Tal Elah
  rationale: Klare moderne Wiedergabe der Ortsbezeichnung; der Eigenname wird transliteriert.
- source_word: הִנֵּה
  choice: sieh
  rationale: Bewahrt die aufmerksamkeitslenkende Funktion der deiktischen Partikel in würdigem, noch verständlichem Deutsch.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: in ein Gewand eingewickelt
  rationale: Das passive Partizip bezeichnet ein Umhüllen; שׂמלה meint gewöhnlich ein Kleidungsstück bzw. Obergewand und nicht bloß ein neutrales Tuch.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: hinter dem Efod
  rationale: Der räumliche Sinn von אַחֲרֵי passt hier zum Aufbewahrungsort des Schwertes.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: Wenn du es für dich nehmen willst, dann nimm es
  rationale: Gibt die bedingte, zugleich erlaubende Formulierung idiomatisch wieder und bewahrt לְךָ als »für dich«.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: denn außer diesem ist hier kein anderes
  rationale: Die feminine Form bezieht sich auf das Schwert; im Deutschen wird entsprechend das Neutrum verwendet. בָּזֶה wird kontextuell als Ortsangabe »hier« verstanden.
- source_word: אֵין כָּמוֹהָ
  choice: Keines ist ihm gleich
  rationale: Bewahrt die knappe Aussage der Unvergleichlichkeit und den Bezug auf das grammatisch neutrale deutsche Wort »Schwert«.
- source_word: תְּנֶנָּה לִּי
  choice: Gib es mir!
  rationale: Direkte und natürliche Wiedergabe des Imperativs mit dem auf »Schwert« bezogenen Pronomen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Efod« bleibt als etablierter kultischer Fachbegriff erhalten. Die direkte Rede ist klar gegliedert; das deiktische »sieh« wahrt die Funktion von הִנֵּה ohne das altertümlichere »siehe«.
