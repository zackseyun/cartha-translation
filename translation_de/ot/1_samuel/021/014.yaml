  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: de
  text: Da veränderte er vor ihren Augen sein Verhalten und stellte sich wahnsinnig an[a], während er in ihrer Gewalt war. Er machte Zeichen[b] auf die Torflügel und ließ seinen Speichel auf seinen Bart hinablaufen.
  philosophy: optimal-equivalence
  footnotes:
