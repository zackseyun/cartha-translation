    text: 'Oder: „benahm sich wie ein Wahnsinniger“. Das hebräische Verb beschreibt wahnsinniges Verhalten; aus dem Zusammenhang geht hervor, dass David es absichtlich vortäuschte.'
    reason: lexical_alternative
  - marker: b
    text: Die Bedeutung des hebräischen Verbs ist unsicher. Möglich sind auch „kratzte“ oder „kritzelte“ auf die Torflügel.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: veränderte er … sein Verhalten
  rationale: טַעַם bezeichnet hier Davids nach außen wahrnehmbare Haltung beziehungsweise sein Auftreten, nicht eindeutig seinen inneren Verstand. Die Wiedergabe wahrt diesen erzählerischen Bezug.
- source_word: בְּעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die geläufige hebräische Wendung wird anschaulich und im Deutschen verständlich wiedergegeben.
- source_word: וַיִּתְהֹלֵל
  choice: stellte sich wahnsinnig
  rationale: Der Hitpael bezeichnet hier wahnsinniges Verhalten; der Kontext zeigt, dass David es absichtlich vortäuscht. Die Formulierung gibt sowohl das Verhalten als auch seinen gespielten Charakter wieder.
- source_word: בְּיָדָם
  choice: während er in ihrer Gewalt war
  rationale: Wörtlich ‚in ihrer Hand‘; idiomatisch bezeichnet die Wendung hier, dass David sich in ihrer Macht oder Obhut befand.
- source_word: ויתו
  choice: kritzelte
  rationale: Die Textform und Bedeutung des seltenen Verbs sind unsicher. Im Zusammenhang ist eine Tätigkeit an den Torflügeln gemeint; ‚kritzelte‘ ist eine plausible, aber nicht alternativlose Wiedergabe.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: die Torflügel
  rationale: Die Wendung bezeichnet die beweglichen Türflügel des Tores; ‚Torflügel‘ ist im Deutschen präzise und natürlich.
- source_word: וַיּוֹרֶד רִירוֹ אֶל־זְקָנוֹ
  choice: ließ seinen Speichel in seinen Bart hinablaufen
  rationale: Die kausative Verbform und die Bewegungsrichtung werden natürlich wiedergegeben. אֶל kann hier das Herablaufen bis in beziehungsweise auf den Bart bezeichnen.
