base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: de
  text: 'Da sagten die Diener Achischs zu ihm: „Ist das nicht David, der König des Landes? Ist das nicht der, von dem sie bei den Tänzen sangen[a]: ›Saul hat seine Tausende erschlagen, David aber seine Zehntausende[b]‹?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einander bei den Tänzen antworteten“, das heißt, im Wechselgesang sangen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „seine Myriaden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: Diener
  rationale: Der Ausdruck bezeichnet Angehörige von Achischs Haushalt oder Hofstaat. „Diener“ gibt den weiten hebräischen Begriff unmittelbar wieder, ohne ihn unnötig auf „Beamte“ oder „Hofleute“ einzuengen.
- source_word: הֲלוֹא
  choice: Ist das nicht
  rationale: Die Form bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: der König des Landes
  rationale: Die formnahe Wiedergabe erhält die mögliche Übertreibung oder Wahrnehmung der Philister, ohne David hier ausdrücklich einen formalen Königstitel über Israel zuzuschreiben oder diesen auszuschließen.
- source_word: יַעֲנוּ
  choice: sangen
  rationale: Im Zusammenhang mit Tanz und Siegesfeier bezeichnet das Verb das Singen beziehungsweise Wechselgesang. „Sangen“ ist im Haupttext klar und natürlich; die responsive Nuance wird in der Fußnote bewahrt.
- source_word: בַמְּחֹלוֹת
  choice: bei den Tänzen
  rationale: Die Wendung bezeichnet Tanzfeiern, bei denen das Lied gesungen wurde. „Bei den Tänzen“ ist im Deutschen natürlicher als das formale „in den Tänzen“.
- source_word: הִכָּה
  choice: hat ... erschlagen
  rationale: Im Siegeslied bezieht sich das Verb auf das Töten im Kampf. „Erschlagen“ ist prägnant, verständlich und dem militärischen Kontext angemessen.
- source_word: באלפו
  choice: seine Tausende
  rationale: Die traditionelle und idiomatische Zahlenangabe gibt die Saul zugerechnete Zahl wieder und wahrt den Parallelismus.
- source_word: ברבבתו
  choice: seine Zehntausende
  rationale: רבבה bezeichnet zehntausend beziehungsweise eine sehr große, nach Zehntausenden gezählte Menge. „Zehntausende“ wahrt den poetischen Gegensatz zu „Tausende“ und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Ob „König des Landes“ als objektiver Herrschertitel oder als Wahrnehmung der philistäischen Diener zu verstehen ist
  choice: der König des Landes
  alternative: der König des Landes, ausdrücklich als übertriebene oder nur wahrgenommene Bezeichnung erklärt
  rationale: Der hebräische Text gibt die Worte der Diener wieder, ohne zu klären, ob sie David für den tatsächlichen König halten oder seine herausragende Stellung überspitzt bezeichnen. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede und der poetische Parallelismus des bekannten Siegesliedes bleiben erhalten; altertümliche Wendungen und unnötige politische Präzisierungen werden vermieden.
