  text: וַ/יָּ֧שֶׂם דָּוִ֛ד אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בִּ/לְבָב֑/וֹ וַ/יִּרָ֣א מְאֹ֔ד מִ/פְּנֵ֖י אָכִ֥ישׁ מֶֽלֶךְ גַּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: de
  text: David nahm sich diese Worte zu Herzen[a] und hatte große Angst vor Achisch, dem König von Gat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »David legte diese Worte in sein Herz.« Die hebräische Wendung besagt, dass er sie ernst nahm und innerlich bedachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: nahm sich ... zu Herzen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Herzbild und vermittelt, dass David die Worte ernst nahm und innerlich bedachte.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים kann »Worte«, »Dinge« oder »Angelegenheiten« bedeuten. Hier bezieht es sich am ehesten auf die unmittelbar zuvor wiedergegebene Äußerung der Diener.
- source_word: וַיִּרָא מְאֹד
  choice: hatte große Angst
  rationale: Die natürliche moderne Formulierung gibt die starke Intensivierung durch מְאֹד klar wieder.
- source_word: מִפְּנֵי
  choice: vor
  rationale: In Verbindung mit Angst entspricht die deutsche Konstruktion »Angst vor« idiomatisch dem hebräischen Ausdruck.
- source_word: אָכִישׁ
  choice: Achisch
  rationale: Der Personenname wird nach verbreiteter deutscher Bibelkonvention transkribiert.
- source_word: מֶלֶךְ גַּת
  choice: dem König von Gat
  rationale: Die hebräische Status-constructus-Verbindung wird als erklärende Apposition natürlich ins Deutsche übertragen.
