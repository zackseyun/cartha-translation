base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: de
  text: 'Und nun: Was hast du zur Hand?[a] Gib mir[b] fünf Brote[c] oder was sonst verfügbar ist.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Was ist unter deiner Hand?« Gemeint ist: Was hast du unmittelbar verfügbar oder in deinem Besitz?'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Gib in meine Hand.«'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Hebräischen die Sammelbezeichnung »Brot«; gemeint sind fünf einzelne Brote.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: »oder das Vorhandene / Gefundene«; gemeint ist, was gerade verfügbar ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die anknüpfende Konjunktion als auch den Übergang zu Davids unmittelbarer Bitte.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: Was hast du zur Hand?
  rationale: Gibt die hebräische Besitz- und Verfügbarkeitswendung natürlich wieder, ohne ihren praktischen Sinn zu verengen.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: fünf Brote
  rationale: Das kollektiv gebrauchte לֶחֶם wird wegen der Zahl im Deutschen konkret als zählbare Brote ausgedrückt.
- source_word: תְּנָה בְיָדִי
  choice: Gib mir
  rationale: Die wörtliche Wendung »gib in meine Hand« entspricht im natürlichen Deutschen dem Dativ »mir«.
- source_word: אוֹ הַנִּמְצָא
  choice: oder was sonst zu finden ist
  rationale: Bewahrt die passive Form von מצא und die Offenheit der Bitte; »sonst« verdeutlicht idiomatisch die Alternative zu den fünf Broten.
