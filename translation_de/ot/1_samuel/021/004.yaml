  register: Modernes, würdiges Standarddeutsch. Die direkte Bitte und die knappe Erzählweise des Hebräischen bleiben erhalten; hebräische Wendungen werden im Haupttext natürlich wiedergegeben und in den Fußnoten transparent gemacht.
