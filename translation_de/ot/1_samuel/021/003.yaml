  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/אֲחִימֶ֣לֶךְ הַ/כֹּהֵ֗ן הַ/מֶּלֶךְ֮ צִוַּ֣/נִי דָבָר֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אִ֣ישׁ אַל יֵ֧דַע מְא֛וּמָה אֶת הַ/דָּבָ֛ר אֲשֶׁר אָנֹכִ֥י שֹׁלֵֽחֲ/ךָ֖ וַ/אֲשֶׁ֣ר צִוִּיתִ֑/ךָ וְ/אֶת הַ/נְּעָרִ֣ים יוֹדַ֔עְתִּי אֶל מְק֥וֹם פְּלֹנִ֖י אַלְמוֹנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: de
  text: 'David sagte zu dem Priester Ahimelech: »Der König hat mir eine Angelegenheit aufgetragen und zu mir gesagt: Niemand soll irgendetwas über die Angelegenheit wissen, wegen der ich dich sende und die ich dir aufgetragen habe. Den jungen Männern aber habe ich einen bestimmten Ort genannt[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »den Ort Soundso«; die hebräische Wendung bezeichnet einen nicht näher genannten oder nicht offengelegten Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: hat mir eine Angelegenheit aufgetragen
  rationale: צוה bezeichnet ein Befehlen oder Auftragen; zusammen mit דָבָר ist eine anvertraute beziehungsweise befohlene Angelegenheit gemeint. Die Wiedergabe erhält sowohl den verbindlichen Charakter als auch den sachlichen Bezug.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: Niemand soll irgendetwas … wissen
  rationale: אִישׁ steht hier in einer verneinten, allgemein-menschlichen Aussage. Das moderne deutsche »niemand« gibt diesen Sinn genau und natürlich wieder, ohne den Personenkreis einzuschränken.
- source_word: הַדָּבָר
  choice: die Angelegenheit
  rationale: דָבָר bezeichnet hier den Auftrag beziehungsweise die Sache, um die es geht, nicht lediglich ein gesprochenes Wort.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: wegen der ich dich sende
  rationale: Das Relativpronomen bezieht sich auf die Angelegenheit. »Wegen der« drückt im Deutschen natürlich aus, dass diese Angelegenheit der Anlass für Davids Sendung ist.
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: und die ich dir aufgetragen habe
  rationale: Die Wiederholung von צוה wird entsprechend der ersten Verwendung ebenfalls mit »auftragen« wiedergegeben.
- source_word: וְאֶת־הַנְּעָרִים
  choice: Den jungen Männern aber
  rationale: נְעָרִים kann junge Männer, Diener oder Begleiter bezeichnen. »Junge Männer« ist die direkte Wiedergabe und lässt ihre genaue soziale Funktion offen.
- source_word: יוֹדַעְתִּי
  choice: habe ich … genannt
  rationale: Der Hifil von ידע bedeutet grundsätzlich »wissen lassen/bekannt machen«. In Verbindung mit einem Ort ist gemeint, dass David den jungen Männern den Treffpunkt mitgeteilt hat; »einen Ort genannt« bewahrt diesen Mitteilungsaspekt und klingt im Deutschen natürlich.
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: einen bestimmten Ort
  rationale: Die feste Paarformel bezeichnet einen nicht näher genannten oder bewusst nicht offengelegten Ort. »Einen bestimmten Ort« ist im Haupttext klar und idiomatisch; die wörtlichere Ausdrucksweise steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp und förmlich; die Wiederholung von »aufgetragen« spiegelt die Wiederholung des hebräischen צוה. Das allgemeine »niemand« gibt die verneinte Konstruktion idiomatisch und ohne unnötige geschlechtliche Verengung wieder.
