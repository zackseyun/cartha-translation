  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: de
  text: Doch wenn ihr nicht auf die Stimme Jahwes hört und euch dem Befehl Jahwes widersetzt, dann wird die Hand Jahwes gegen euch und gegen eure Väter sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „eure Väter“. Einige alte Übersetzungen und viele Ausleger lesen „euren König“; das passt zum unmittelbaren Zusammenhang, in dem Samuel sowohl das Volk als auch dessen König warnt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Leitet im Gegensatz zum vorherigen Vers die negative Bedingung ein; „Doch wenn“ gibt sowohl die Verknüpfung als auch den Kontrast natürlich wieder.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: ihr nicht auf die Stimme Jahwes hört
  rationale: Bewahrt die hebräische Wendung vom Hören auf eine Stimme und lässt zugleich deren Sinn des gehorchenden Hörens erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וּמְרִיתֶם אֶת פִּי יְהוָה
  choice: und euch dem Befehl Jahwes widersetzt
  rationale: מרה bezeichnet trotzigen Widerstand beziehungsweise Auflehnung; „Befehl“ gibt das idiomatische „Mund Jahwes“ verständlich wieder.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: dann wird die Hand Jahwes … sein
  rationale: Behält das biblische Bild der wirksamen Macht Jahwes im Gericht bei; „dann“ kennzeichnet den Folgesatz der Bedingung.
- source_word: בָּכֶם
  choice: gegen euch
  rationale: Im Gerichtskontext hat die Präposition gegnerische Bedeutung.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: und gegen eure Väter
  rationale: Folgt dem masoretischen Text der WLC wörtlich; die textkritisch erwogene Lesart „euren König“ wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der Eigenname wird als Eigenname erhalten, ohne ihn durch einen Titel oder eine konfessionell geprägte Form zu ersetzen.
- issue: Schlussphrase וּבַאֲבֹתֵיכֶם
  choice: und gegen eure Väter
  alternative: und gegen euren König
  rationale: Der Haupttext folgt der vorgegebenen masoretischen Quelle. Die alternative Lesart passt zum unmittelbaren Zusammenhang, ist jedoch nicht stillschweigend in den Haupttext zu übernehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder „auf die Stimme hören“ und „Hand Jahwes“ bleiben erhalten, während „Mund Jahwes“ idiomatisch als „Befehl Jahwes“ wiedergegeben wird.
