revisions:
- from: Und nun tretet an[a]! Ich will vor Jahwe mit euch rechten[b] über all die gerechten Taten[c], die Jahwe an euch und euren Vorfahren getan hat.
  to: Und nun tretet an! Ich will vor Jahwe mit euch einen Rechtsstreit führen über alle gerechten Taten, die Jahwe euch und euren Vorfahren erwiesen hat.
  rationale: Die Revision modernisiert zwei Formulierungen, deren Sinn zwar grundsätzlich richtig ist, die aber im heutigen Deutsch entweder ungebräuchlich („mit euch rechten“) oder missverständlich („an euch ... getan“) sind. Der rechtliche Charakter der Rede Samuels, die Ambiguität hinsichtlich eines bloßen Erörterns gegenüber einem Richten und die konkrete Bedeutung von צִדְקוֹת bleiben erhalten. Die Fußnotenanker bleiben an den jeweils erläuterten Ausdrücken.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:25:52Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die rhetorische Wendung, den imperativischen Aufruf zum Auftreten, den forensischen Charakter von וְאִשָּׁפְטָה אִתְּכֶם sowie die konkreten צִדְקוֹת Jahwes insgesamt zutreffend wieder. Die Wendung „Taten, die Jahwe an euch ... getan hat“ ist jedoch im heutigen Deutsch semantisch weniger klar und kann auch belastendes Handeln nahelegen. „erwiesen hat“ gibt die auf die Adressaten bezogenen gerechten Erweise idiomatischer wieder, ohne die hebräische Aussage einzuengen.
  naturalness: „Mit euch rechten“ ist verständlich, aber außerhalb bewusst altertümlicher oder juristischer Sprache kaum noch gebräuchlich. „Mit euch einen Rechtsstreit führen“ ist modernes Standarddeutsch und bewahrt die forensische, nicht notwendig verurteilende Nuance. Der Satz bleibt würdig und klar.
  terminology: „Jahwe“ gibt יְהוָה konsistent wieder. „Gerechte Taten“ ist für צִדְקוֹת angemessen und lässt die konkrete, gerechte beziehungsweise bundestreue Qualität der Taten erkennen, ohne sie auf Rettungstaten zu beschränken. „Vorfahren“ ist als moderne Wiedergabe von אֲבוֹתֵיכֶם passend.
  issues:
  - severity: low
    issue: „mit euch rechten“ wirkt im modernen Standarddeutsch veraltet.
    rationale: Die Wendung trifft den rechtlichen Sinn, ist aber für die Zielvariante weniger natürlich als „mit euch einen Rechtsstreit führen“.
  - severity: low
    issue: „Taten, die Jahwe an euch und euren Vorfahren getan hat“ ist idiomatisch und semantisch weniger präzise.
    rationale: „An jemandem tun“ kann im Deutschen auch nachteiliges Handeln bezeichnen. Bei gerechten, auf die Betroffenen bezogenen Taten ist „euch ... erwiesen hat“ die deutlichere und natürliche Formulierung.
  revised_text: Und nun tretet an! Ich will vor Jahwe mit euch einen Rechtsstreit führen über alle gerechten Taten, die Jahwe euch und euren Vorfahren erwiesen hat.
