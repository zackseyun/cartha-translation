source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: de
  text: Und nun tretet an! Ich will vor Jahwe mit euch einen Rechtsstreit führen über alle gerechten Taten, die Jahwe euch und euren Vorfahren erwiesen hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Wendung markiert sowohl den Übergang als auch die Folgerung innerhalb von Samuels Rede; „Und nun“ gibt beides im Deutschen natürlich wieder.
- source_word: הִתְיַצְּבוּ
  choice: tretet an
  rationale: Der pluralische Imperativ fordert die Zuhörer auf, für eine förmliche Verhandlung ihren Platz einzunehmen. „Tretet an“ bewahrt diesen formellen Zug, ohne einen bestimmten Standort in den Text einzutragen.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: Ich will ... mit euch rechten
  rationale: 'Die Form von שפט hat hier einen voluntativen und forensischen Sinn: Samuel eröffnet vor Jahwe eine Streitsache, statt lediglich ein Urteil über das Volk zu verkünden. „Mit euch rechten“ bewahrt diese rechtliche Bedeutung und die Spannung des Ausdrucks.'
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ gibt die Vorstellung einer Verhandlung in Jahwes Gegenwart knapp und idiomatisch wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: über all die gerechten Taten ... Jahwes
  rationale: Der Plural צִדְקוֹת bezeichnet konkrete Taten, in denen sich Jahwes Gerechtigkeit und Bundestreue zeigen. „Gerechte Taten“ bleibt näher am hebräischen Begriff als das engere „Rettungstaten“.
- source_word: אֲשֶׁר עָשָׂה אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: die Jahwe an euch und euren Vorfahren getan hat
  rationale: „An jemandem tun“ gibt in diesem Zusammenhang das Handeln zugunsten der gegenwärtigen und früheren Generationen idiomatisch wieder. „Vorfahren“ vermittelt den hier gemeinten genealogischen Sinn von אָבוֹת in modernem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ macht den Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צִדְקוֹת יְהוָה
  choice: gerechte Taten Jahwes
  alternative: Rettungstaten Jahwes
  rationale: Der Ausdruck umfasst Jahwes gerechtes und bundestreues Handeln, zu dem auch Rettung gehört. Die gewählte Fassung vermeidet es, die Bedeutung vorschnell auf Rettung allein zu verengen.
- issue: Forensischer Sinn von שפט
  choice: mit euch rechten
  alternative: euch richten
  rationale: Samuel ruft zu einer Streitsache vor Jahwe auf. Die Übersetzung lässt offen, wohin die Beweisführung führt, und legt nicht vorab eine Verurteilung des Volkes fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „mit euch rechten“ bewahrt den gerichtlichen Charakter des hebräischen Ausdrucks; die Fußnote erläutert sie für heutige Leser. „Vorfahren“ ist gegenüber „Vätern“ im heutigen Deutsch eindeutiger und schließt die früheren Generationen ein.
