source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: de
  text: 'Als ihr saht, dass Nahasch, der König der Ammoniter, gegen euch heranzog, sagtet ihr zu mir: »Nein, ein König soll über uns herrschen!« Dabei war doch der HERR, euer Gott, euer König.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dabei ist der HERR, euer Gott, euer König.« Der hebräische Satz enthält kein ausdrückliches Verb; aus dem Zusammenhang kann sowohl die Vergangenheit als auch die Gegenwart ergänzt werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ כִּי
  choice: Als ihr saht, dass
  rationale: Die Konstruktion beschreibt den zeitlichen Anlass für Israels Reaktion; כִּי leitet hier den Inhalt der Wahrnehmung ein.
- source_word: נָחָשׁ מֶלֶךְ בְּנֵי עַמּוֹן
  choice: Nahasch, der König der Ammoniter
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert; die Volksbezeichnung wird idiomatisch wiedergegeben.
- source_word: בָּא עֲלֵיכֶם
  choice: gegen euch heranzog
  rationale: בוא mit עַל bezeichnet im militärischen Zusammenhang ein feindliches Heranrücken. Das deutsche Präteritum fügt sich natürlich in den Rückblick ein.
- source_word: לֹא כִּי
  choice: Nein, ein König soll
  rationale: לֹא weist die vorausgesetzte Ordnung entschieden zurück; כִּי führt die entgegengesetzte Forderung ein. Im Deutschen vermittelt die direkte Fortsetzung nach »Nein« diesen Kontrast natürlich.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: ein König soll über uns herrschen
  rationale: Die Verbindung von Substantiv und gleichstämmigem Verb betont die entschiedene Forderung nach einem menschlichen König.
- source_word: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: Dabei war doch der HERR, euer Gott, euer König
  rationale: Die hebräische Nominalklausel enthält keine ausdrückliche Kopula. Das Präteritum passt zum erzählenden Rückblick; »doch« macht den tadelnden Gegensatz sichtbar, ohne zusätzlichen Sachgehalt einzuführen.
theological_decisions:
- issue: Zeitbezug der verblosen Nominalklausel וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: war ... euer König
  alternative: ist ... euer König
  rationale: Der Rückblick auf Israels damalige Forderung legt die Vergangenheit nahe. Da das Hebräische keine ausdrückliche Zeitform enthält und auch eine fortdauernde Aussage möglich ist, wird die Präsenslesart in einer Fußnote bewahrt.
- issue: Gegensatz zwischen menschlichem Königtum und Gottes Königtum
  choice: Dabei war doch
  alternative: obwohl
  rationale: Die Formulierung bewahrt Samuels Vorwurf und stellt beide Aussagen gegeneinander, ohne daraus eine weitergehende konfessionelle Lehre über das Königtum abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt nachdrücklich, aber nicht archaisch. Der Gottesname wird gemäß verbreiteter deutscher Bibelkonvention als »der HERR« wiedergegeben.
