  text: וְ/עַתָּ֞ה הִנֵּ֥ה הַ/מֶּ֣לֶךְ מִתְהַלֵּ֣ךְ לִ/פְנֵי/כֶ֗ם וַ/אֲנִי֙ זָקַ֣נְתִּי וָ/שַׂ֔בְתִּי וּ/בָנַ֖/י הִנָּ֣/ם אִתְּ/כֶ֑ם וַ/אֲנִי֙ הִתְהַלַּ֣כְתִּי לִ/פְנֵי/כֶ֔ם מִ/נְּעֻרַ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: de
  text: 'Und nun: Seht, der König geht vor euch her[a], und ich bin alt und grau geworden[b], und hier sind meine Söhne bei euch. Und ich bin von meiner Jugend an bis zum heutigen Tag vor euch hergegangen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Vor euch hergehen“ kann hier auch bedeuten: „euch führen“. Dieselbe hebräische Wendung verwendet Samuel im letzten Satz auch für seinen eigenen öffentlichen Dienst.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ich bin alt geworden und ergraut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verknüpfende Kraft von ו als auch die zeitlich-diskursive Funktion von עַתָּה.
- source_word: הִנֵּה
  choice: Seht
  rationale: Gibt die aufmerksamkeitslenkende Partikel in gegenwärtigem, verständlichem Deutsch wieder, ohne das altertümliche „siehe“ zu verwenden.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: geht vor euch her
  rationale: Die natürliche deutsche Wendung wahrt das Bild des Vorangehens und lässt zugleich dessen möglichen Sinn öffentlicher Führung offen. Das Präsens entspricht dem hebräischen Partizip.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: ich bin alt und grau geworden
  rationale: Gibt die beiden erreichten Zustände wieder und bewahrt beim zweiten Verb das Bild des Ergrauens.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: und hier sind meine Söhne bei euch
  rationale: „Hier sind“ bringt die präsentierende Hervorhebung durch הִנָּם idiomatisch zum Ausdruck.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: ich bin … vor euch hergegangen
  rationale: Wiederholt bewusst dieselbe Wendung wie beim König und erhält dadurch Samuels rhetorischen Vergleich ihrer öffentlichen Rollen.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: von meiner Jugend an bis zum heutigen Tag
  rationale: Eine natürliche deutsche Zeitangabe, die den gesamten Zeitraum bis zur gegenwärtigen Rede umfasst.
theological_decisions:
- issue: Bedeutung von „vor euch hergehen“
  choice: Das räumliche Bild wird in beiden Satzteilen beibehalten.
  alternative: „euch führen“ oder „euer Anführer sein“
  rationale: Die Wendung kann öffentliche Führung bezeichnen, doch eine ausdrückliche Übersetzung mit „führen“ würde die im Hebräischen erhaltene Bildsprache und ihre Mehrdeutigkeit stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ vermeidet das altertümliche „siehe“, während „bis zum heutigen Tag“ den feierlichen Charakter der öffentlichen Rede wahrt. Die wiederholte Formulierung „vor euch hergehen“ erhält die strukturelle Parallele des Hebräischen.
