  rationale: Die Revision ersetzt die expandierende Doppelung zweier deutscher Verben durch eine natürliche Konstruktion, die das hebräische „sich nach etwas abwenden“ als Zuwendung zu nichtigen Dingen wiedergibt. Die allgemeine Ausdrucksweise für תֹהוּ, die Wiederholung des Begriffs und die Unfähigkeit dieser Dinge zu nützen oder zu retten bleiben erhalten.
