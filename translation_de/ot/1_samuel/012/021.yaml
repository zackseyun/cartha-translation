  text: וְ/לֹ֖א תָּס֑וּרוּ כִּ֣י אַחֲרֵ֣י הַ/תֹּ֗הוּ אֲשֶׁ֧ר לֹֽא יוֹעִ֛ילוּ וְ/לֹ֥א יַצִּ֖ילוּ כִּי תֹ֥הוּ הֵֽמָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: de
  text: Und wendet euch nicht nichtigen Dingen[a] zu, die nichts nützen und nicht retten[b] können; denn sie sind nichtig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „leeren Dingen“, „vergeblichen Dingen“ oder „Götzen“. Das hebräische Wort bezeichnet, was leer, nichtig oder substanzlos ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „befreien“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: weicht ... ab
  rationale: סור bezeichnet das Abweichen oder Sich-Abwenden. „Abweichen“ bewahrt das Bild, den rechten Weg beziehungsweise die rechte Treue zu verlassen.
- source_word: אַחֲרֵי
  choice: folgt ... den
  rationale: אַחֲרֵי bedeutet wörtlich „hinter/nach“. Mit „folgt“ wird die hebräische Vorstellung in natürlichem Deutsch wiedergegeben.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: die nichtigen Dinge / nichtig
  rationale: תֹהוּ bezeichnet Leere, Nichtigkeit oder Vergeblichkeit. „Nichtig“ hält die Aussage allgemein und legt den Bezug nicht ausdrücklich auf Götzen fest; zugleich bleibt die Wiederholung des hebräischen Begriffs erhalten.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: die nichts nützen ... können
  rationale: Die Formulierung drückt aus, dass diese Dinge keinen Nutzen zu bringen vermögen. Das gemeinsame Modalverb „können“ erfasst zusammen mit dem folgenden Verb ihre Unfähigkeit.
- source_word: וְלֹא יַצִּילוּ
  choice: und nicht retten können
  rationale: נצל im Hifil bedeutet „retten, befreien“. „Retten“ ist hier verständlich und lässt offen, aus welcher Not Rettung erwartet wird.
- source_word: הֵמָּה
  choice: sie
  rationale: Das maskuline Pluralpronomen verweist auf die zuvor genannten nichtigen Dinge; „sie“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Bezug von הַתֹּהוּ („das Nichtige“)
  choice: Allgemeine Bezeichnung für nichtige Dinge beziehungsweise leere Gegenstände falschen Vertrauens
  alternative: Ausdrückliche Wiedergabe mit „Götzen“
  rationale: Im Zusammenhang sind wahrscheinlich Götzen oder andere falsche Gegenstände des Vertrauens gemeint. Da der hebräische Ausdruck jedoch allgemeiner von Leere und Nichtigkeit spricht, wird die mögliche Bezugnahme nicht als ausdrückliche Identifikation in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Formulierung „weicht nicht ab und folgt nicht“ bildet sowohl das Abweichen als auch das Hinterhergehen ab. Die Wiederholung von תֹהוּ wird durch „nichtig“ bewahrt; die wahrscheinliche Anspielung auf Götzen bleibt bewusst unausgesprochen.
