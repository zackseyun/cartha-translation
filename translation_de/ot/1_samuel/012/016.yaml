  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: de
  text: Nun denn, stellt euch hin und seht dieses große Geschehen, das Jahwe[a] vor euren Augen vollbringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Nun aber
  rationale: Die Wortverbindung leitet mit Nachdruck zum angekündigten Zeichen über. „Nun aber“ gibt diese Übergangs- und Hervorhebungsfunktion in natürlichem Deutsch wieder.
- source_word: הִתְיַצְּבוּ
  choice: stellt euch hin
  rationale: Der Hitpael-Imperativ von יצב fordert die Angesprochenen auf, ihre Stellung einzunehmen und aufmerksam zu bleiben. „Stellt euch hin“ bewahrt sowohl die konkrete Körperhaltung als auch den auffordernden Ton.
- source_word: וּרְאוּ
  choice: und seht
  rationale: Der Imperativ ruft dazu auf, das folgende Geschehen unmittelbar wahrzunehmen und selbst zu bezeugen.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: diese große Tat
  rationale: דבר kann „Wort“, „Sache“, „Angelegenheit“ oder „Geschehen“ bezeichnen. Im Kontext ist ein außergewöhnliches göttliches Handeln gemeint; „Tat“ ist verständlich und treffend, ohne die Art des Zeichens näher festzulegen.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: die Jahwe vollbringt
  rationale: Das Partizip עֹשֶׂה stellt das Handeln anschaulich als unmittelbar bevorstehend beziehungsweise bereits einsetzend dar. Das deutsche Präsens bewahrt diese Gegenwärtigkeit; „vollbringt“ passt idiomatisch zu „Tat“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעֵינֵיכֶם
  choice: vor euren Augen
  rationale: Die bildhafte hebräische Wendung wird direkt und idiomatisch wiedergegeben und betont, dass das Zeichen öffentlich und unmittelbar wahrnehmbar ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm als Gottesnamen. „Jahwe“ bewahrt den Charakter als Eigenname; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Zeitbezug des Partizips עֹשֶׂה
  choice: vollbringt
  alternative: vollbringen wird
  rationale: Das Präsens erhält die Spannung des hebräischen Partizips, das die angekündigte Tat als unmittelbar einsetzend oder aus Sprecherperspektive bereits im Vollzug darstellt, ohne sie ausschließlich in die Zukunft zu verlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die imperative Rede bleibt direkt und feierlich; die Satzstruktur ist klar und für heutige Leser gut verständlich.
