source:
  edition: WLC
  text: וַ/יִּקְרָ֤א שְׁמוּאֵל֙ אֶל יְהוָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה קֹלֹ֥ת וּ/מָטָ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּירָ֨א כָל הָ/עָ֥ם מְאֹ֛ד אֶת יְהוָ֖ה וְ/אֶת שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: de
  text: Da rief Samuel zu Jahwe, und Jahwe sandte an jenem Tag Donner[a] und Regen. Da fürchtete sich das ganze Volk sehr vor Jahwe und vor Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Stimmen“ oder „Laute“; im Zusammenhang des Unwetters sind Donnerschläge gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: rief ... zu Jahwe
  rationale: קרא mit אֶל bezeichnet hier Samuels an Jahwe gerichteten Gebetsruf. „Rief zu“ ist natürlich und wahrt die Direktheit, ohne die Art des Rufens näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּתֵּן
  choice: sandte
  rationale: Wörtlich steht „gab“. Im Zusammenhang eines von Gott bewirkten Unwetters gibt „sandte“ die hebräische Aussage im Deutschen idiomatisch wieder.
- source_word: קֹלוֹת
  choice: Donner
  rationale: Das Mehrzahlwort קֹלוֹת bedeutet grundsätzlich „Stimmen/Laute“, bezeichnet im Wetterzusammenhang jedoch Donnerschläge beziehungsweise Donner.
- source_word: וּמָטָר
  choice: und Regen
  rationale: מָטָר bezeichnet schlicht Regen; eine stärkere Wiedergabe wie „Wolkenbruch“ wäre nicht ausdrücklich im Text begründet.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Formulierung wahrt den bestimmten zeitlichen Rückverweis des Hebräischen und klingt in erzählendem Standarddeutsch würdig und natürlich.
- source_word: וַיִּירָא כָל־הָעָם מְאֹד
  choice: Da fürchtete sich das ganze Volk sehr
  rationale: Die Wiedergabe erhält sowohl die kollektive Aussage als auch die Verstärkung durch מְאֹד und lässt den durch das Zeichen ausgelösten Schrecken erkennen.
- source_word: אֶת־יְהוָה וְאֶת־שְׁמוּאֵל
  choice: vor Jahwe und vor Samuel
  rationale: Das wiederholte Objektzeichen verbindet dasselbe Verb mit beiden Bezugsgrößen. Die Wiederholung von „vor“ ist klares, natürliches Deutsch und bewahrt diese Parallelität.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration „Jahwe“ bewahrt den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Das Volk fürchtet sowohl Jahwe als auch Samuel
  choice: fürchtete sich ... vor Jahwe und vor Samuel
  alternative: fürchtete Jahwe und achtete Samuel
  rationale: Im Hebräischen gilt dasselbe Verb ירא beiden Objekten. Die Übersetzung bewahrt diese auffällige Spannung und deutet sie nicht stillschweigend als zwei verschiedene Haltungen aus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau folgt der hebräischen Ereignisfolge, ohne unnatürlich wörtlich zu wirken. Die Fußnotenmarkierung steht unmittelbar bei „Donner“, dem tatsächlich erläuterten Ausdruck.
