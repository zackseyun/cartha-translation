  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und Aussage zuverlässig wieder: Samuel ruft zu Jahwe; Jahwe bewirkt an diesem Tag Donner und Regen; das ganze Volk fürchtet sich sehr vor Jahwe und Samuel. „Sandte“ ist für וַיִּתֵּן im Wetterzusammenhang idiomatisch und sachgerecht. Die gemeinsame Zuordnung des Furchtverbs zu beiden Objekten bleibt erhalten.'
