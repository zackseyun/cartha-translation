base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: de
  text: 'Da schrien sie zum HERRN und sagten: »Wir haben gesündigt, denn wir haben den HERRN verlassen und den Baalen und den Astarten gedient. Und nun rette uns aus der Hand unserer Feinde, und wir wollen dir dienen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens ist im Fließtext verständlich und würdevoll; der bestimmte Artikel wird entsprechend der deutschen Syntax verwendet.
- source_word: הַבְּעָלִים
  choice: den Baalen
  rationale: Der hebräische Plural bezeichnet die verschiedenen lokalen Erscheinungsformen beziehungsweise Kultbilder des Baal; die deutsche Pluralform bewahrt dies.
- source_word: הָעַשְׁתָּרוֹת
  choice: den Astarten
  rationale: Der Plural wird als eingedeutschter Plural des Namens Astarte wiedergegeben und bezeichnet entsprechende Göttinnen beziehungsweise Kultgestalten.
- source_word: מִיַּד אֹיְבֵינוּ
  choice: aus der Hand unserer Feinde
  rationale: Die körperhafte hebräische Wendung ist auch im Deutschen verständlich und bewahrt das Bild von Macht und Gewalt.
- source_word: וְנַעַבְדֶךָּ
  choice: dann wollen wir dir dienen
  rationale: Die Kohortativbedeutung drückt die zugesagte künftige Hinwendung aus; „wollen“ gibt den Willens- und Verpflichtungscharakter natürlich wieder.
theological_decisions:
- issue: Zusammenhang zwischen Sünde und Verlassen des HERRN
  choice: „denn“
  alternative: „weil“
  rationale: כִּי kann kausal verstanden werden. „Denn“ wahrt den bekennenden, erläuternden Ton, ohne eine weitergehende dogmatische Deutung einzutragen.
- issue: Gottesname
  choice: „der HERR“
  alternative: „JHWH“ oder „Jahwe“
  rationale: Die traditionelle Wiedergabe entspricht dem vorgegebenen konsultierten Text und gängiger deutscher Bibelsprache, ohne eine konfessionelle Sonderdeutung einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die Parallelität von „gedient“ und „dienen“ sowie das hebräische Bild „aus der Hand“ bleiben erhalten.
