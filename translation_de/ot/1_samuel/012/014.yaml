source:
  edition: WLC
  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: de
  text: Wenn ihr Jahwe fürchtet, ihm dient, auf seine Stimme hört[b] und euch nicht gegen den Befehl Jahwes auflehnt, dann werdet sowohl ihr als auch der König, der über euch herrscht, Jahwe, eurem Gott, folgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dann werdet ihr sein, sowohl ihr als auch der König, der über euch herrscht, hinter Jahwe, eurem Gott.“ Gemeint ist wahrscheinlich, dass Volk und König Jahwe weiterhin treu folgen.'
    reason: alternative_reading
  - marker: b
    text: „Auf seine Stimme hören“ kann auch „seiner Stimme gehorchen“ bedeuten; die hebräische Wendung bezeichnet oft ein Hören, das zum Gehorsam führt.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet den Bedingungssatz ein und bewahrt dessen klaren konditionalen Sinn.
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: Jahwe fürchtet
  rationale: „Fürchten“ bewahrt das Gewicht von ירא, das gegenüber Gott Furcht und Ehrfurcht umfasst; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: ihm dient
  rationale: עבד bezeichnet hier den umfassenden, gottesdienstlichen Dienst an Gott; „dienen“ bleibt näher am hebräischen Ausdruck als das engere „anbeten“.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: auf seine Stimme hört
  rationale: Bewahrt das hebräische Bild des Hörens; die Wendung schließt häufig gehorsames Hören ein, was in einer Fußnote kenntlich gemacht wird.
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: euch nicht gegen den Befehl Jahwes auflehnt
  rationale: מרה bezeichnet widersetzliche Auflehnung; „Mund Jahwes“ ist hier eine Metonymie für seinen ausgesprochenen Befehl.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: sowohl ihr als auch der König
  rationale: Gibt die korrelative Konstruktion גַּם ... וְגַם natürlich und vollständig wieder.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: der über euch herrscht
  rationale: Das Perfekt bezeichnet hier den amtierenden König; die deutsche Präsensform gibt diesen gegenwärtigen Zustand natürlich wieder.
- source_word: וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: dann werdet ... Jahwe, eurem Gott, folgen
  rationale: Die schwerfällige wörtliche Form „dann werdet ihr ... hinter Jahwe sein“ wird im Zusammenhang als fortdauernde Gefolgschaft beziehungsweise Treue verstanden; die formale Mehrdeutigkeit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Sinn der Schlusswendung וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: „dann werdet sowohl ihr als auch der König ... Jahwe, eurem Gott, folgen“
  alternative: 'Wörtlich: „dann werdet ihr sein, sowohl ihr als auch der König ... hinter Jahwe, eurem Gott“; die genaue Ergänzung beziehungsweise Folgerung bleibt formal unausgesprochen.'
  rationale: „Folgen“ gibt den im Kontext naheliegenden Sinn der Treue zu Jahwe verständlich wieder, ohne die ungewöhnliche hebräische Konstruktion zu verschweigen; die Fußnote erhält deren Spannung.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration „Jahwe“ unterscheidet ihn vom Titel אֲדֹנָי und bewahrt diese lexikalische Unterscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Bedingungsgefüge, wird aber durch „dann“ klar gegliedert. „Sich auflehnen“ erhält den starken Sinn von מרה; „folgen“ macht die Schlusswendung verständlich, während Fußnote [a] ihre ungewöhnliche wörtliche Form dokumentiert.
