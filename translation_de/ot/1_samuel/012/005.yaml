  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Jahwe ist heute Zeuge gegen euch, und sein Gesalbter ist Zeuge, dass ihr nichts in meiner Hand gefunden habt.« Da sagten sie[a]: »Er ist Zeuge.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht das abschließende Verb im Singular: »Da sagte er.« Im Zusammenhang handelt es sich jedoch um die gemeinsame Antwort des Volkes.'
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: Zeuge
  rationale: Das Substantiv bezeichnet hier einen Zeugen im rechtlichen beziehungsweise bundesrechtlichen Sinn und passt zu Samuels öffentlicher Rechtfertigung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּכֶם
  choice: gegen euch
  rationale: In Verbindung mit עֵד hat die Präposition im forensischen Zusammenhang den Sinn, dass Jahwe als Zeuge in der sie betreffenden Sache auftritt. Die wörtlicheren Möglichkeiten »bei euch« oder »unter euch« bleiben semantisch möglich.
- source_word: מְשִׁיחוֹ
  choice: sein Gesalbter
  rationale: Gemeint ist hier der gesalbte König Saul. »Gesalbter« bewahrt die hebräische Bezeichnung, ohne unmittelbar den späteren messianischen Titel einzutragen.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Im modernen Deutschen gibt »heute« die Zeitangabe natürlich und vollständig wieder; ihre Stellung bezieht sich sinnvoll auf das öffentliche Zeugnis an diesem Tag.
- source_word: בְּיָדִי
  choice: in meiner Hand
  rationale: Die verständliche hebräische Wendung wird bewahrt und bezeichnet etwas, das Samuel unrechtmäßig an sich gebracht oder in seinem Besitz gehalten hätte.
- source_word: מְאוּמָה
  choice: nichts
  rationale: Mit der Verneinung bedeutet das Wort »irgendetwas« beziehungsweise idiomatisch »nichts«.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: er sagte ... sie sagten
  rationale: Das erste Verb bezeichnet Samuel. Die abschließende singularische Form des masoretischen Textes gibt im Zusammenhang die gemeinsame Antwort des Volkes wieder und wird deshalb im Deutschen pluralisch übersetzt.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחוֹ im königlichen, nicht unmittelbar endzeitlich-messianischen Kontext
  choice: sein Gesalbter
  alternative: sein Messias; sein König
  rationale: Der Ausdruck bezieht sich im unmittelbaren Zusammenhang auf Saul als den von Jahwe gesalbten König. »Sein Gesalbter« bewahrt zugleich die lexikalische und theologische Verbindung des Begriffs, ohne die konkrete Referenz auf Saul zu verdecken.
- issue: Forensische Bedeutung von עֵד ... בָּכֶם
  choice: Zeuge gegen euch
  alternative: Zeuge bei euch; Zeuge unter euch
  rationale: Der Abschnitt hat den Charakter einer öffentlichen Rechts- und Unschuldserklärung. »Gegen euch« macht diese forensische Funktion deutlich, auch wenn die Präposition für sich genommen breiter verstanden werden kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die juristische Färbung von »Zeuge« und das verständliche Bild »in meiner Hand« bleiben erhalten. Der Gottesname wird mit »Jahwe« wiedergegeben.
