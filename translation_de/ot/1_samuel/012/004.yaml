base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: de
  text: 'Da sagten sie: „Du hast uns nicht unterdrückt und uns nicht misshandelt und du hast von niemandem irgendetwas angenommen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nichts aus der Hand irgendeines Mannes genommen“. Gemeint ist wahrscheinlich, dass Samuel von niemandem eine Zahlung, ein Geschenk oder eine Bestechung angenommen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Der Wayyiqtol führt die Erzählfolge fort. „Da sagten sie“ gibt diesen Anschluss in natürlichem Deutsch wieder.
- source_word: עֲשַׁקְתָּנוּ
  choice: du hast uns nicht unterdrückt
  rationale: עשׁק bezeichnet Unterdrückung, Ausbeutung oder Erpressung durch Machtmissbrauch. „Unterdrückt“ wahrt hier die breite Bedeutung im öffentlichen Rechenschaftskontext.
- source_word: רַצּוֹתָנוּ
  choice: du hast uns nicht misshandelt
  rationale: רצץ bedeutet wörtlich „zerschlagen, zerdrücken“ und bezeichnet hier bildlich eine gewaltsame oder ungerechte Behandlung. „Misshandelt“ bewahrt die Schärfe, ohne körperliches Zermalmen zu unterstellen.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: du hast auch von niemandem irgendetwas angenommen
  rationale: Die hebräische Wendung lautet konkret „etwas aus der Hand eines Mannes nehmen“. Im Zusammenhang meint sie wahrscheinlich das Annehmen einer Zahlung, eines Geschenks oder einer Bestechung; die idiomatische deutsche Wiedergabe bleibt bewusst allgemein, während die Fußnote das Sprachbild erhält.
- source_word: אִישׁ
  choice: niemandem
  rationale: 'Das maskuline Singularwort אִישׁ hat unter der Verneinung verallgemeinernde Bedeutung: „von keinem Menschen“ beziehungsweise „von niemandem“.'
- source_word: מְאוּמָה
  choice: irgendetwas
  rationale: מְאוּמָה bezeichnet in einer verneinten Aussage „irgendetwas“ oder „auch nur das Geringste“. „Irgendetwas“ ist gegenwartssprachlich und erhält die uneingeschränkte Verneinung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele Verneinung des Hebräischen bleibt erhalten; das Semikolon gliedert die letzte, ausführlichere Aussage. Das konkrete hebräische Bild „aus der Hand nehmen“ wird zugunsten natürlichen Deutschen in die Fußnote verlegt.
