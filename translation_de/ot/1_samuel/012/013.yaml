base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: de
  text: 'Und nun: Hier ist der König, den ihr erwählt habt, um den ihr gebeten habt. Seht, Jahwe hat einen König über euch eingesetzt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jahwe hat über euch einen König gegeben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch die zeitlich-diskursive Wendung, mit der Samuel seine gegenwärtige Schlussfolgerung einleitet.
- source_word: הִנֵּה הַמֶּלֶךְ
  choice: Hier ist der König
  rationale: Gibt die hinweisende Funktion von הִנֵּה in natürlichem, modernem Deutsch wieder und lenkt die Aufmerksamkeit auf den anwesenden König.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: den ihr erwählt habt
  rationale: Bewahrt die abgeschlossene Handlung und die ausdrückliche Aussage, dass das Volk diesen König erwählt hat, ohne die Spannung zum weiteren Erzählzusammenhang aufzulösen.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: um den ihr gebeten habt
  rationale: שׁאל bezeichnet hier das Bitten um beziehungsweise Verlangen nach einem König; die Formulierung ist idiomatisch und würdevoll.
- source_word: וְהִנֵּה
  choice: Seht
  rationale: Erhält den erneuten Aufmerksamkeitsruf, ohne die erste Wiedergabe „Hier ist“ unbeholfen zu wiederholen.
- source_word: נָתַן ... עֲלֵיכֶם מֶלֶךְ
  choice: hat einen König über euch eingesetzt
  rationale: נתן bedeutet grundsätzlich „geben“, bezeichnet mit עַל in diesem Zusammenhang jedoch das Einsetzen einer Person in eine Herrschaftsstellung. Die wörtlichere Lesart wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen geläufige Transkription wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt diesen als Namen und vermeidet die Ersetzung durch den Titel „der HERR“.
- issue: Verhältnis zwischen der Wahl des Volkes und Jahwes Handeln
  choice: Sowohl „den ihr erwählt habt“ als auch „Jahwe hat ... eingesetzt“ werden ausdrücklich beibehalten.
  alternative: Die Wahl des Volkes als bloßen Wunsch oder Jahwes Handeln als alleinige Auswahl umzuformulieren.
  rationale: Der Vers stellt beide Aussagen nebeneinander. Die Übersetzung wahrt diese theologische und erzählerische Spannung, statt sie zu harmonisieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Hier ist“ und „Seht“ geben die beiden Vorkommen von הִנֵּה abwechslungsreich, aber erkennbar nachdrücklich wieder.
