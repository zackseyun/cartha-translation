base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: de
  text: Auch mir sei es fern, gegen Jahwe zu sündigen, indem ich aufhöre, für euch zu beten. Und ich werde euch den guten und rechten Weg lehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch auf dem guten und geraden Weg unterweisen“. Das hebräische Verb kann sowohl Lehren als auch wegweisende Anleitung bezeichnen; „gerade“ kann im ethischen Sinn auch „recht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Auch mir
  rationale: Bewahrt die hervorgehobene erste Person und den anschließenden Kontrast zu Samuels eigenem Verhalten in natürlichem Deutsch.
- source_word: חָלִילָה לִּי
  choice: sei es fern
  rationale: Die feste deutsche Wendung gibt die entschiedene Zurückweisung des hebräischen Idioms würdig und verständlich wieder.
- source_word: מֵחֲטֹא לַיהוָה
  choice: gegen Jahwe zu sündigen
  rationale: Gibt die persönliche Verfehlung gegenüber Gott ausdrücklich wieder und bewahrt den Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Transliteriert den im hebräischen Text stehenden Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: indem ich aufhöre, für euch zu beten
  rationale: Macht deutlich, dass gerade das Einstellen der Fürbitte die genannte Sünde wäre.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: Vielmehr werde ich euch … lehren
  rationale: Das Hifil von ירה bezeichnet hier Unterweisung und wegweisende Anleitung; „lehren“ ist dafür im Deutschen klar und natürlich. „Vielmehr“ verdeutlicht den sachlichen Gegensatz, der sich aus dem Zusammenhang ergibt.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: den guten und geraden Weg
  rationale: Bewahrt das Wegbild und die beiden moralischen Eigenschaften. „Gerade“ erhält das konkrete Bild von ethischer Geradheit, ohne den Sinn auf eine einzige Deutung einzuengen.
theological_decisions:
- issue: Ob das Unterlassen der Fürbitte nur als Pflichtversäumnis oder ausdrücklich als Sünde gegen Gott gilt
  choice: ausdrücklich als Sünde gegen Jahwe
  alternative: bloßes Versäumnis einer Leitungsaufgabe
  rationale: Der hebräische Text nennt das Aufhören zu beten unmittelbar ein Sündigen gegen Jahwe; diese theologische Schärfe darf nicht abgeschwächt werden.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Fürbitte und Unterweisung
  choice: Beides bleibt Samuels fortdauernde Verantwortung
  alternative: Die Unterweisung ersetzt die Fürbitte
  rationale: Die koordinierte Aussage verbindet das fortgesetzte Gebet mit der künftigen Unterweisung, ohne das eine gegen das andere auszuspielen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „sei es fern“ bewahrt die starke Abwehr des Originals; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich. Der Fußnotenmarker [a] steht im Haupttext.
