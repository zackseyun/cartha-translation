  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe des Tetragramms und entspricht der getroffenen Entscheidung, den Gottesnamen auszuschreiben. Die Namen Jakob, Mose und Aaron sind standardsprachlich. „Vorfahren“ ist als verständliche historische Wiedergabe von אבותיכם vertretbar; die Fußnote sichert die wörtliche Formulierung „eure Väter“.
