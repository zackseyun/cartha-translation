id: 1SA.12.8
reference: 1 Samuel 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּֽ/אֲשֶׁר בָּ֥א יַעֲקֹ֖ב מִצְרָ֑יִם וַ/יִּזְעֲק֤וּ אֲבֽוֹתֵי/כֶם֙ אֶל יְהוָ֔ה וַ/יִּשְׁלַ֨ח יְהוָ֜ה אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֗ן וַ/יּוֹצִ֤יאוּ אֶת אֲבֹֽתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/יֹּשִׁב֖וּ/ם בַּ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: de
  text: Als Jakob nach Ägypten kam, schrien eure Vorfahren[a] zu Jahwe um Hilfe. Da sandte Jahwe Mose und Aaron. Sie führten eure Vorfahren aus Ägypten heraus und siedelten sie an diesem Ort an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eure Väter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ließen sie an diesem Ort wohnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Als
  rationale: Leitet hier einen temporalen Nebensatz ein und gibt den geschichtlichen Zusammenhang im Deutschen natürlich wieder.
- source_word: בָּא יַעֲקֹב מִצְרָיִם
  choice: Jakob nach Ägypten kam
  rationale: בוא bezeichnet das Kommen beziehungsweise Hineingehen; mit einem Ländernamen ist „nach Ägypten kommen“ im Deutschen idiomatisch.
- source_word: וַיִּזְעֲקוּ
  choice: schrien … um Hilfe
  rationale: זעק bezeichnet einen dringlichen Hilferuf. Der Zusatz „um Hilfe“ macht die im Verb enthaltene Notlage und Bitte im Deutschen deutlich.
- source_word: אֲבוֹתֵיכֶם
  choice: eure Vorfahren
  rationale: Wörtlich steht „eure Väter“; im geschichtlichen Rückblick bezeichnet die Wendung die früheren Generationen Israels. „Vorfahren“ ist in modernem Deutsch klar und schließt Jakob im weiteren Erzählzusammenhang nicht aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen in der im Deutschen geläufigen Form wieder.
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das Verb bedeutet „senden“. „Da“ bringt die erzählerische Folge auf den Hilferuf hin zum Ausdruck, ohne einen stärkeren Kausalzusammenhang zu behaupten.
- source_word: וַיּוֹצִיאוּ
  choice: Sie führten … heraus
  rationale: Die Hifil-Form von יצא bedeutet, jemanden herauszubringen beziehungsweise herauszuführen. Das pluralische Subjekt verweist grammatisch auf Mose und Aaron.
- source_word: וַיֹּשִׁבוּם
  choice: siedelten sie … an
  rationale: Die Hifil-Form von ישׁב bedeutet, jemanden wohnen zu lassen oder anzusiedeln. „Ansiedeln“ bewahrt den kausativen Sinn in natürlichem Deutsch.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Entspricht der räumlichen Wendung und bewahrt Samuels Bezug auf das Land beziehungsweise den gegenwärtigen Aufenthaltsort seiner Hörer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen in geläufiger deutscher Form wieder, während „der HERR“ der traditionellen Ersatzlesung entspräche.
- issue: Handelnde beim Auszug und bei der Ansiedlung
  choice: Das pluralische „sie“ bezieht sich unmittelbar auf Mose und Aaron als beauftragte Werkzeuge
  alternative: Jahwe allein als unausgesprochenes Subjekt
  rationale: Die hebräischen Verben וַיּוֹצִיאוּ und וַיֹּשִׁבוּם stehen im Plural und schließen grammatisch direkt an Mose und Aaron an. Zugleich bleibt durch ihre Sendung klar, dass Jahwe hinter dem Rettungshandeln steht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Kurze Hauptsätze vermeiden eine schwerfällige Kettenstruktur; „Jahwe“ wahrt den Eigennamencharakter des Tetragramms.
