  source_fidelity: 'Der deutsche Text gibt die Abfolge und die wesentlichen Aussagen des Hebräischen zuverlässig wieder: Jakobs Kommen nach Ägypten, der Hilferuf der Vorfahren zu Jahwe, die Sendung von Mose und Aaron sowie das Herausführen aus Ägypten und Ansiedeln an diesem Ort. „schrien … um Hilfe“ vermittelt die dringliche Nuance von זעק angemessen; „ansiedelten“ bewahrt den kausativen Sinn von וַיֹּשִׁבוּם. Das pluralische „Sie“ hat mit Mose und Aaron einen klaren unmittelbaren Bezug, wie auch die hebräische Pluralform.'
