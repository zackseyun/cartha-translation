  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: de
  text: 'Und Samuel sagte zum Volk: „Habt keine Angst! Ihr habt all dieses Böse getan. Doch wendet euch nicht von Jahwe ab, sondern dient Jahwe von ganzem Herzen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: Und Samuel sagte zum Volk
  rationale: Bewahrt den hebräischen Erzählanschluss und gibt הָעָם im Zusammenhang natürlich als die versammelte israelitische Gemeinschaft wieder.
- source_word: אַל תִּירָאוּ
  choice: Habt keine Angst!
  rationale: Gängige, heutige Wiedergabe des verneinten Imperativs von ירא; der Plural der Anrede bleibt erkennbar.
- source_word: אַתֶּם עֲשִׂיתֶם אֵת כָּל הָרָעָה הַזֹּאת
  choice: Ihr habt all dieses Böse getan
  rationale: Das ausdrücklich gesetzte Pronomen אַתֶּם wird durch „Ihr“ bewahrt; „das Böse“ erhält die moralische Schwere von רָעָה.
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet die starke einschränkende und zugleich kontrastierende Wendung nach dem Eingeständnis ihrer Schuld.
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: wendet euch nicht davon ab, Jahwe nachzufolgen
  rationale: Gibt das Bild von סור mit מֵאַחֲרֵי verständlich wieder, ohne die im Hebräischen enthaltene Vorstellung des Nachfolgens zu verlieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: sondern dient Jahwe
  rationale: „Dienen“ wahrt die Breite von עבד im Bundeskontext; „sondern“ macht den positiven Gegensatz zum vorausgehenden Verbot im Deutschen deutlich.
- source_word: בְּכָל לְבַבְכֶם
  choice: von ganzem Herzen
  rationale: Natürliche deutsche Entsprechung des hebräischen Ausdrucks für ungeteilte innere Hingabe und Treue.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; „Jahwe“ bewahrt diese Namensfunktion, ohne einen bloßen Titel einzusetzen.
- issue: Moralische Bedeutung von רָעָה
  choice: das Böse
  alternative: das Unrecht
  rationale: „Das Böse“ erhält die ausdrückliche moralische Wertung von Israels Handeln und schwächt sie nicht zu einem bloßen Fehler ab.
- issue: Verhältnis von Schuld und fortgesetztem Dienst
  choice: Die Schuld wird uneingeschränkt benannt, gefolgt von der Aufforderung, nicht von Jahwes Nachfolge abzuweichen.
  alternative: Die Aufforderung als Relativierung oder Aufhebung der Schuld zu formulieren.
  rationale: 'Der Text hält beides spannungsvoll zusammen: Israel hat Böses getan, soll sich aber dennoch nicht von Jahwe abwenden.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, allgemein verständlicher Anrede. Die Satzstruktur folgt dem hebräischen Gedankengang, wird jedoch idiomatisch deutsch formuliert. Es sind keine Fußnoten nötig, da keine für die Veröffentlichung wesentliche Mehrdeutigkeit verloren geht.
