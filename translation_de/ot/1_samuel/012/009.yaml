source:
  edition: WLC
  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: de
  text: Doch sie vergaßen Jahwe, ihren Gott. Da verkaufte er sie[a] in die Hand Siseras, des Befehlshabers des Heeres von Hazor, in die Hand der Philister und in die Hand des Königs von Moab; und sie kämpften gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gab sie preis“. Wörtlich heißt es im Hebräischen: „verkaufte sie“ – ein Bild dafür, dass Jahwe sein Volk als Gericht der Gewalt seiner Feinde überließ.'
    reason: Lexikalische Alternative und Erklärung der hebräischen Gerichtsmetapher.
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: sie vergaßen
  rationale: שׁכח bedeutet wörtlich „vergessen“. Der Ausdruck kann im Bundeszusammenhang schuldhafte Missachtung und Untreue einschließen; die direkte Wiedergabe bewahrt jedoch Wortlaut und Bedeutungsweite.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Gott
  rationale: 'Die Konstruktion mit Suffix bezeichnet die Bundesbeziehung ausdrücklich: Jahwe ist „ihr Gott“.'
- source_word: וַיִּמְכֹּר
  choice: da verkaufte er
  rationale: מכר heißt wörtlich „verkaufen“. Hier bezeichnet das Bild die richterliche Preisgabe Israels an feindliche Mächte; das deutsche „verkaufte“ erhält diese zugespitzte Metapher.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt eines anderen. „In die Hand“ bewahrt das Quellenbild und ist in diesem feierlich-biblischen Zusammenhang verständlich.
- source_word: שַׂר צְבָא חָצוֹר
  choice: Befehlshaber des Heeres von Hazor
  rationale: שַׂר צְבָא bezeichnet einen militärischen Befehlshaber; die Genitivfügung gibt die Beziehung zu Hazor ohne unnötige Ausdeutung wieder.
- source_word: וַיִּלָּחֲמוּ בָם
  choice: und sie kämpften gegen sie
  rationale: לחם mit ב bedeutet „gegen jemanden kämpfen“. Die Pronomenstruktur des Hebräischen bleibt erhalten; im Zusammenhang sind die zuvor genannten feindlichen Mächte das Subjekt und Israel das Objekt.
theological_decisions:
- issue: Subjekt von „verkaufte“
  choice: Das unausgesprochene Subjekt ist Jahwe.
  alternative: Eine unpersönliche Wiedergabe wie „sie wurden verkauft“.
  rationale: Der unmittelbar zuvor genannte „Jahwe, ihr Gott“ ist das natürliche Subjekt des folgenden singularischen Verbs. So bleibt die Aussage erhalten, dass Jahwe Israel als Gericht den Feinden preisgab.
- issue: Bedeutungsgehalt von „Jahwe vergessen“
  choice: Wörtlich „vergaßen“, mit möglichem Beiklang bundeswidriger Untreue.
  alternative: Deutender „verließen“ oder „wurden Jahwe untreu“.
  rationale: Die stärkere Bundesbedeutung liegt im Kontext nahe, sollte aber nicht an die Stelle des konkreten hebräischen Ausdrucks treten.
- issue: Bezug der Pronomen in der Schlussklausel
  choice: Die genannten feindlichen Mächte kämpften gegen Israel.
  alternative: Formale Offenlassung ohne kontextuelle Bestimmung der Bezüge.
  rationale: Der Numerus und der Erzählzusammenhang weisen am natürlichsten auf die zuvor aufgezählten Unterdrücker als Subjekt und Israel als Objekt. Die deutsche Pronomenfolge bleibt dennoch eng am Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. „Jahwe“ gibt den Gottesnamen wieder; „in die Hand“ und „verkaufte“ erhalten die hebräischen Metaphern, während „Befehlshaber“ gegenwärtig und klar formuliert ist.
