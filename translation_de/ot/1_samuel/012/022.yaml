  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Volk“, „großer Name“ und „verlassen“ sind sachgerecht und vermeiden unnötige dogmatische Zuspitzungen. Die Fußnoten bieten tragfähige lexikalische Alternativen; „verwerfen“ ist für נטש etwas stärker, jedoch als mögliche kontextuelle Alternative noch vertretbar.
