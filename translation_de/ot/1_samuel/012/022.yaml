source:
  edition: WLC
  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: de
  text: Denn Jahwe wird sein Volk nicht verlassen[a], um seines großen Namens willen; denn es hat Jahwe gefallen[b], euch zu seinem Volk zu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Stich lassen; oder: verwerfen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: denn Jahwe hat sich entschlossen, euch zu einem Volk für sich zu machen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: wird … nicht verlassen
  rationale: Das Verb נטש bezeichnet hier das Aufgeben oder Verlassen eines Volkes. „Nicht verlassen“ ist im heutigen Deutsch klar und bewahrt das Gewicht der Bundesbeziehung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם bezeichnet hier Israel in seiner gemeinschaftlichen und bundesbezogenen Identität.
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: um seines großen Namens willen
  rationale: Die Formulierung gibt den Beweggrund an und bewahrt die hebräische Rede von Gottes „großem Namen“, die seine offenbarte Ehre und seinen Ruf umfasst.
- source_word: הוֹאִיל
  choice: es hat … gefallen
  rationale: הוֹאִיל kann willige, wohlgefällige Entschlossenheit ausdrücken. Die Formulierung erhält sowohl den Aspekt des freien Willens als auch den positiven Ton, ohne ihn auf eine technische Lehrformel festzulegen.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: euch zu seinem Volk zu machen
  rationale: Die Wendung beschreibt, dass Jahwe Israel als das ihm zugehörige Volk eingesetzt beziehungsweise konstituiert hat. „Seinem Volk“ gibt das לֹו knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ wahrt diese Namensform, statt sie durch einen Titel zu ersetzen.
- issue: Bedeutungsnuance von הוֹאִיל
  choice: es hat Jahwe gefallen
  alternative: Jahwe hat sich entschlossen
  rationale: Die gewählte Fassung bewahrt die Spannung zwischen Gottes freiem Entschluss und seinem Wohlgefallen. Die Alternative ist sachlich möglich, hebt jedoch stärker den Beschluss als das Wohlgefallen hervor.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wendung „um seines großen Namens willen“ bewahrt den hebräischen Ausdruck, während Satzbau und Wortwahl allgemein verständlich bleiben.
