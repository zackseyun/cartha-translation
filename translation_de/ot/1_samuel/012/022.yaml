  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: die Verneinung mit Zukunftsbezug („wird ... nicht verlassen“), „sein Volk“, den Motivgrund „um seines großen Namens willen“ sowie die vollendete, wohlwollende Willensentscheidung in הוֹאִיל („es hat Jahwe gefallen“), euch zu seinem Volk zu machen. Das לוֹ ist durch „seinem Volk“ angemessen aufgenommen.'
