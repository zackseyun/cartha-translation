  text: וַ/יֹּאמְר֨וּ כָל הָ/עָ֜ם אֶל שְׁמוּאֵ֗ל הִתְפַּלֵּ֧ל בְּעַד עֲבָדֶ֛י/ךָ אֶל יְהוָ֥ה אֱלֹהֶ֖י/ךָ וְ/אַל נָמ֑וּת כִּֽי יָסַ֤פְנוּ עַל כָּל חַטֹּאתֵ֨י/נוּ֙ רָעָ֔ה לִ/שְׁאֹ֥ל לָ֖/נוּ מֶֽלֶךְ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: de
  text: 'Da sagte das ganze Volk zu Samuel: „Bete zu Jahwe, deinem Gott, für deine Diener, damit wir nicht sterben; denn zu all unseren Sünden haben wir noch dieses Böse hinzugefügt: dass wir für uns einen König erbeten haben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: Da sagte das ganze Volk
  rationale: Das narrative וַיֹּאמְרוּ führt die Handlung weiter; „Da“ gibt die Abfolge natürlich wieder. Das kollektiv gebrauchte כָל הָעָם wird im Deutschen idiomatisch mit dem singularischen „das ganze Volk“ verbunden.
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: Bete für deine Diener
  rationale: התפלל bedeutet hier „beten“; בְּעַד kennzeichnet das Eintreten zugunsten anderer. „Für deine Diener“ bewahrt zugleich die ehrerbietige Selbstbezeichnung des Volkes.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. Die zweite Person Singular bleibt erhalten und wahrt die auffällige Anrede an Samuel.
- source_word: וְאַל נָמוּת
  choice: damit wir nicht sterben
  rationale: Die negative Verbform bezeichnet im Zusammenhang des Gebets den erhofften Ausgang. Die finale Wiedergabe ist im Deutschen natürlich und vermeidet das im Hebräischen nicht ausdrücklich genannte kausative „lass uns nicht sterben“.
- source_word: כִּי יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: denn zu all unseren Sünden haben wir noch dieses Böse hinzugefügt
  rationale: יסף mit עַל beschreibt eine weitere Hinzufügung zu bereits Vorhandenem. „Noch“ verdeutlicht knapp die kumulative Bedeutung; רָעָה bleibt mit dem gewichtigen „dieses Böse“ erhalten.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: dass wir für uns einen König verlangt haben
  rationale: Der Infinitiv benennt den Inhalt des hinzugefügten Bösen. שׁאל bedeutet hier, um etwas zu bitten bzw. es zu verlangen; „verlangt“ passt zur bereits erfolgten Forderung des Volkes und gibt לָנוּ ausdrücklich mit „für uns“ wieder.
theological_decisions:
- issue: Beziehungsgehalt von „Jahwe, deinem Gott“
  choice: Die zweite Person „deinem Gott“ bleibt unverändert stehen.
  alternative: „Jahwe, unserem Gott“ oder eine erklärende Erweiterung
  rationale: Das Volk wendet sich nach der Aufdeckung seiner Schuld an Samuel als Fürbitter. Die Formulierung erzeugt eine bewusste rhetorische und geistliche Spannung, ohne zu bestreiten, dass Jahwe Israels Gott ist.
- issue: Bewertung des Wunsches nach einem König
  choice: Die Bitte um einen König wird entsprechend dem Bekenntnis des Volkes als „dieses Böse“ bezeichnet.
  alternative: Abschwächung zu „dieses Unrecht“ oder eine Erklärung, unter welchen Bedingungen Königtum legitim sein kann
  rationale: Der Vers gibt das konkrete Schuldbekenntnis des Volkes wieder. Eine systematische Einordnung des Königtums würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die ehrerbietige Selbstbezeichnung „deine Diener“, der Gottesname „Jahwe“ und die theologische Spannung von „deinem Gott“ bleiben erhalten. Keine Fußnote ist erforderlich, da der Fürbittecharakter durch „Bete für“ im Kontext hinreichend deutlich ist.
