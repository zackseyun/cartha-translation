id: 1SA.12.11
reference: 1 Samuel 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: de
  text: Und JHWH sandte Jerubbaal[a], Bedan[b], Jiftach und Samuel und rettete euch aus der Hand eurer Feinde ringsum, und ihr wohntet in Sicherheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jerubbaal ist ein anderer Name für Gideon (siehe Richter 6,32; 7,1).
    reason: cross_reference
  - marker: b
    text: Hebräisch „Bedan“. Wer damit gemeint ist, ist unsicher; manche Ausleger verstehen den Namen als Barak, seltener als Abdon.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: JHWH
  rationale: Der Gottesname wird entsprechend dem hebräischen Text als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: שׁלח bedeutet hier schlicht „senden“; „sandte“ ist im erzählenden Rückblick natürlich und würdig.
- source_word: יְרֻבַּעַל
  choice: Jerubbaal
  rationale: Der im masoretischen Text stehende Name wird beibehalten; die Identifizierung mit Gideon wird in einer Fußnote erläutert.
- source_word: בְּדָן
  choice: Bedan
  rationale: Die überlieferte hebräische Namensform wird trotz unsicherer Identität nicht stillschweigend zu Barak oder Abdon geändert.
- source_word: יִפְתָּח
  choice: Jiftach
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Personennamens.
- source_word: וַיַּצֵּל
  choice: rettete
  rationale: נצל bezeichnet die Befreiung aus einer Bedrohung; „rettete“ ist im modernen Deutschen klar und trifft den Zusammenhang.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: aus der Hand eurer Feinde
  rationale: Das verständliche hebräische Bild von Hand als Macht- und Gewaltbereich bleibt erhalten.
- source_word: מִסָּבִיב
  choice: ringsum
  rationale: Das Wort bezeichnet die Feinde in der gesamten Umgebung; „ringsum“ gibt die räumliche Bedeutung knapp wieder.
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: und ihr lebtet in Sicherheit
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise Leben im Land, בטח einen Zustand der Sicherheit. Die nebenordnende Verbindung wahrt das hebräische „und“, ohne ausdrücklich einen Zweck oder eine Folge einzutragen.
theological_decisions:
- issue: Identität von בְּדָן
  choice: „Bedan“ bleibt als Name im Haupttext stehen.
  alternative: Barak oder, seltener, Abdon
  rationale: Der masoretische Text liest Bedan. Da die Identität umstritten ist, wird die Schwierigkeit nicht durch eine unbezeichnete Angleichung an einen anderen Richter beseitigt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: JHWH
  alternative: der HERR
  rationale: Die Konsonantenform kennzeichnet im Deutschen den persönlichen Gottesnamen und vermeidet, den Eigennamen im Haupttext durch den Titel „Herr“ zu ersetzen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählstil. Die Satzverknüpfung bleibt parataktisch; die anschauliche Wendung „aus der Hand“ wird bewahrt. Die Fußnotenmarker stehen unmittelbar bei den Namen, auf die sich die Erläuterungen beziehen.
