  terminology: „Jahwe“ gibt יְהוָה konsistent als Eigennamen wieder. „Donner“ ist für קֹלוֹת im Gewitterkontext korrekt. „Unrecht“ gibt רָעָה als moralisches Übel wieder, ohne die Aussage über die konkrete Königsforderung lehrhaft auszuweiten.
