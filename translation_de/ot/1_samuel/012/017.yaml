base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: de
  text: Ist nicht heute Weizenernte? Ich werde zu Jahwe rufen, und er wird Donner und Regen senden. Erkennt und seht, dass euer Unrecht groß ist, das ihr in den Augen Jahwes begangen habt, indem ihr für euch einen König verlangt habt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא קְצִיר חִטִּים הַיּוֹם
  choice: Ist heute nicht Weizenernte?
  rationale: Bewahrt die rhetorische Frage und gibt die hebräische Nominalfügung in natürlichem, knappem Deutsch wieder.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: Ich werde zu Jahwe rufen
  rationale: קרא אל bezeichnet hier das an Gott gerichtete Rufen; „zu ... rufen“ hält die Richtung der Präposition sichtbar. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְיִתֵּן קֹלוֹת וּמָטָר
  choice: und er wird Donner und Regen senden
  rationale: נתן bedeutet wörtlich „geben“, doch bei Wettererscheinungen ist „senden“ im Deutschen idiomatisch. קֹלוֹת meint im Gewitterzusammenhang Donner.
- source_word: וּדְעוּ וּרְאוּ
  choice: Dann werdet ihr erkennen und sehen
  rationale: Die koordinierten Imperative folgen als Konsequenz des angekündigten Zeichens. „Erkennen“ gibt den nachdrücklichen Erkenntnischarakter von ידע wieder, während „sehen“ die Doppelung erhält.
- source_word: כִּי רָעַתְכֶם רַבָּה
  choice: wie groß das Böse ist
  rationale: רָעָה bezeichnet hier moralisch verwerfliches Handeln; die Konstruktion mit רַבָּה wird im Deutschen natürlich als Ausruf über dessen Größe formuliert.
- source_word: אֲשֶׁר עֲשִׂיתֶם בְּעֵינֵי יְהוָה
  choice: das ihr in den Augen Jahwes getan habt
  rationale: Bewahrt den Relativsatz und das hebräische Bild „in den Augen“, das Gottes wertendes Urteil ausdrückt.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: indem ihr für euch einen König verlangt habt
  rationale: Der Infinitiv benennt, worin das Böse bestand. „Verlangt“ passt zum vorausgehenden Begehren des Volkes; „für euch“ erhält לָכֶם.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Moralische Bewertung der Königsforderung
  choice: „das Böse ..., das ihr ... getan habt“
  alternative: „eure Bosheit“ oder „euer Unrecht“
  rationale: Die Formulierung bewahrt Samuels scharfe Bewertung, ohne über den Vers hinaus eine allgemeine Lehre über jedes Königtum zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am hebräischen Aufbau; „Donner“ wird kontextgemäß statt des wörtlichen „Stimmen“ verwendet. Keine Fußnoten erforderlich.
