  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: de
  text: 'Da sagte Samuel zum Volk: „Jahwe ist es, der Mose und Aaron eingesetzt hat[a] und der eure Väter[b] aus dem Land Ägypten heraufgeführt hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Mose und Aaron gemacht hat“. Gemeint ist hier wahrscheinlich, dass Jahwe sie in ihre Aufgaben eingesetzt oder in ihrer Stellung begründet hat.'
    reason: lexical_alternative
  - marker: b
    text: „Eure Väter“ kann hier weiter gefasst auch „eure Vorfahren“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte Samuel
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da“ gibt die Abfolge in natürlichem modernem Deutsch wieder, während „sagte“ dem Grundsinn von אמר entspricht.
- source_word: אֶל הָעָם
  choice: zum Volk
  rationale: Direkte und idiomatische Wiedergabe der Präposition mit dem bestimmten Substantiv.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: der Mose und Aaron eingesetzt hat
  rationale: Das wörtliche „Mose und Aaron gemacht hat“ wäre im Deutschen missverständlich. Im Zusammenhang bezeichnet עשה wahrscheinlich Gottes Handeln, durch das Mose und Aaron in ihre Aufgaben eingesetzt beziehungsweise in ihrer Stellung begründet wurden; die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: und der ... heraufgeführt hat
  rationale: Die Hifil-Form von עלה bedeutet „heraufführen“ und bewahrt die für den Exodus typische räumliche Ausdrucksweise.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: eure Väter
  rationale: Dies entspricht der konkreten maskulinen Form des Hebräischen; im Zusammenhang kann der Ausdruck weiter gefasst „eure Vorfahren“ bedeuten.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Formnahe Wiedergabe der hebräischen Exodusformel; „Land Ägypten“ klingt im Deutschen würdig und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עָשָׂה in Bezug auf Mose und Aaron
  choice: eingesetzt hat
  alternative: gemacht hat
  rationale: Der Vers spricht wahrscheinlich von Gottes Handeln, durch das Mose und Aaron ihre von ihm bestimmte Stellung erhielten, nicht von ihrer Erschaffung als Menschen. Weil die hebräische Formulierung wörtlich auch „gemacht“ lautet, wird diese Spannung durch eine Fußnote bewahrt.
- issue: Verbloser Satz mit יְהוָה als hervorgehobenem Handelnden
  choice: Jahwe ist es, der ...
  alternative: Jahwe, der ...
  rationale: „Jahwe ist es“ bringt die Identifizierung und Hervorhebung des göttlichen Handelnden im verblosen hebräischen Satz natürlich zum Ausdruck, ohne ein zusätzliches theologisches Prädikat einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Jahwe ist es, der ...“ bildet die Hervorhebung des Handelnden natürlich ab. „Heraufgeführt“ bewahrt die traditionelle räumliche Exodusformulierung, ohne altertümlich zu wirken.
