base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: de
  text: Fürchtet nur Jahwe und dient ihm treu mit eurem ganzen Herzen; denn bedenkt, was er Großes an euch[a] getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit euch“; sinngemäß auch: „für euch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: nur
  rationale: Die Partikel schränkt die geforderte Reaktion nachdrücklich ein; „nur“ gibt diesen exhortativen Akzent knapp und natürlich wieder.
- source_word: יְרְאוּ
  choice: fürchtet
  rationale: „Fürchten“ bewahrt die biblische Ausdrucksweise und umfasst hier ehrfürchtige, gehorsame Anerkennung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: und dient ihm
  rationale: עבד bezeichnet hier den umfassenden treuen Dienst gegenüber Gott; „dienen“ ist weiter als bloß kultisches „anbeten“.
- source_word: בֶּאֱמֶת
  choice: treu
  rationale: Im Zusammenhang des Gottesdienstes bezeichnet אֱמֶת Wahrhaftigkeit, Verlässlichkeit und loyale Treue; das adverbiale „treu“ ist prägnant und idiomatisch.
- source_word: בְּכָל לְבַבְכֶם
  choice: mit eurem ganzen Herzen
  rationale: Die hebräische Wendung bezeichnet ungeteilte innere Hingabe und lässt sich im Deutschen unmittelbar so wiedergeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die vorausgehende Aufforderung ein.
- source_word: רְאוּ
  choice: bedenkt
  rationale: Das wörtliche „seht“ fordert hier zur bewussten Wahrnehmung und Erwägung von Jahwes Handeln auf; „bedenkt“ drückt diesen Sinn natürlich aus.
- source_word: אֵת אֲשֶׁר הִגְדִּיל
  choice: was er Großes … getan hat
  rationale: Die Hifil-Form von גדל bezeichnet idiomatisch das Vollbringen großer Taten.
- source_word: עִמָּכֶם
  choice: an euch
  rationale: „An euch“ bezeichnet im Deutschen natürlich Gottes machtvolles Handeln in Bezug auf Israel, ohne die Beziehungsaussage der hebräischen Präposition auf einen bloßen Nutzen zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Bundesnamen. Die Wiedergabe als „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von בֶּאֱמֶת
  choice: treu
  alternative: in Wahrheit
  rationale: „Treu“ hebt im Kontext die aufrichtige und beständige Hingabe hervor. „In Wahrheit“ wäre formnäher, könnte im heutigen Deutsch aber vorwiegend als Gegensatz zu Unwahrheit verstanden werden.
- issue: Bezug von עִמָּכֶם
  choice: an euch
  alternative: mit euch / für euch
  rationale: Das Hebräische lautet formal „mit euch“, kann aber Gottes Handeln zugunsten oder im Ergehen Israels bezeichnen. „An euch“ bewahrt diese Offenheit besser als das eindeutig benefaktive „für euch“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Anrede an das Volk. Die Satzstruktur bleibt nahe am hebräischen Mahnwort, während „bedenkt“ und „an euch“ idiomatisches Deutsch sichern. Der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
