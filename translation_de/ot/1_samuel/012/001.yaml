  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: de
  text: 'Da sagte Samuel zu ganz Israel: »Seht, ich habe auf euch gehört, in allem, was ihr mir gesagt habt, und habe einen König über euch eingesetzt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden Ausdruck würdig und natürlich wieder; im Deutschen ist hier eine an die Gesamtheit gerichtete Pluralform angemessen.
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: ich habe … gehört, was ihr … gesagt habt
  rationale: Die hebräische Wendung bedeutet, auf die Forderung beziehungsweise Stimme anderer zu hören. Zusammen mit dem folgenden Relativsatz ergibt diese Wiedergabe natürliches Deutsch, ohne den Sinn zu erweitern.
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: und habe einen König über euch eingesetzt
  rationale: Das Hifil von מלך bezeichnet hier das Einsetzen beziehungsweise Herrschenlassen eines Königs. „Eingesetzt“ ist idiomatisch und bewahrt Samuels aktive Rolle.
theological_decisions:
- issue: Samuels Rolle bei der Einsetzung des Königs
  choice: habe einen König über euch eingesetzt
  alternative: habe einen König über euch herrschen lassen
  rationale: Die gewählte Formulierung hält fest, dass Samuel die Einsetzung vollzog, ohne daraus eine Aussage über die letzte göttliche Urheberschaft oder Billigung abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp und nachdrücklich; keine Fußnoten erforderlich.
