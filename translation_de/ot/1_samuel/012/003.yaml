source:
  edition: WLC
  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: de
  text: 'Hier bin ich. Legt gegen mich Zeugnis ab vor Yahweh und vor seinem Gesalbten: Wessen Rind habe ich genommen, und wessen Esel habe ich genommen? Wen habe ich unterdrückt? Wen habe ich misshandelt[a]? Aus wessen Hand habe ich Bestechungsgeld[b] angenommen, um deswegen die Augen zu verschließen? Ich werde es euch erstatten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende hebräische Verb ist schwierig. Es kann allgemein bedeuten, jemanden hart zu behandeln, ihm Gewalt anzutun oder ihm Unrecht zuzufügen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch »Lösegeld«, »Sühnezahlung« oder »Ausgleichszahlung« bedeuten. Das anschließende Bild vom Verschließen der Augen spricht hier für eine Bestechung, durch die Unrecht übersehen wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Hier bin ich
  rationale: Natürliche deutsche Selbstvorstellung, die Samuels öffentliche Bereitschaft zur Rechenschaft wiedergibt.
- source_word: עֲנוּ בִי
  choice: Sagt gegen mich aus
  rationale: Der öffentliche Rechtsrahmen vor Yahweh und dem König verlangt hier die forensische Bedeutung »gegen jemanden aussagen«, nicht nur »antworten«.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen als Eigennamen wieder.
- source_word: מְשִׁיחוֹ
  choice: seinem Gesalbten
  rationale: Bezeichnet im unmittelbaren historischen Zusammenhang den gesalbten König und bewahrt zugleich die Grundbedeutung des hebräischen Titels.
- source_word: שׁוֹר
  choice: Rind
  rationale: Im Zusammenhang mit Besitz und möglicher widerrechtlicher Aneignung ist »Rind« die natürliche, hinreichend genaue deutsche Bezeichnung.
- source_word: חֲמוֹר
  choice: Esel
  rationale: Direkte und gegenwärtig verständliche Entsprechung.
- source_word: לָקַחְתִּי
  choice: habe ich genommen / habe ich angenommen
  rationale: Die Wiederholung von »genommen« bleibt bei den Tieren erhalten; bei Bestechungsgeld ist »angenommen« im Deutschen idiomatischer, ohne den Grundsinn zu verändern.
- source_word: עָשַׁקְתִּי
  choice: habe ich unterdrückt
  rationale: Bewahrt den breiten sozialrechtlichen Sinn von Bedrückung und Ausbeutung.
- source_word: רַצּוֹתִי
  choice: habe ich misshandelt
  rationale: Das schwierige Verb bezeichnet wahrscheinlich ein hartes, schädigendes Vorgehen. »Misshandelt« ist verständlich, unterscheidet sich von »unterdrückt« und legt die genaue Art des Unrechts nicht unnötig fest.
- source_word: כֹפֶר
  choice: Bestechungsgeld
  rationale: Das Wort kann Lösegeld oder Ausgleichszahlung bedeuten; die anschließende Wendung vom Verschließen der Augen spricht hier jedoch für eine Zahlung, die gerechtes Urteilen verhindert.
- source_word: וְאַעְלִים עֵינַי בּוֹ
  choice: sodass ich deswegen die Augen verschlossen hätte
  rationale: Bewahrt das Bild der verschlossenen Augen und macht den naheliegenden Zusammenhang zwischen der Zahlung und dem absichtlichen Übersehen von Unrecht verständlich.
- source_word: וְאָשִׁיב לָכֶם
  choice: Ich werde es euch erstatten
  rationale: Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch »es« aufgenommen; »erstatten« passt zu widerrechtlich genommenem Besitz oder Geld.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Namensform wahrt diese Eigenart, statt sie durch einen Titel zu ersetzen.
- issue: Bedeutung von מְשִׁיחוֹ im historischen Kontext
  choice: seinem Gesalbten
  alternative: seinem Messias
  rationale: Gemeint ist hier unmittelbar der von Yahweh gesalbte König. »Gesalbter« bewahrt die königliche Bedeutung, ohne den Vers ausschließlich als direkte messianische Aussage festzulegen.
- issue: Moralisch-rechtlicher Sinn von כֹפֶר
  choice: Bestechungsgeld
  alternative: Lösegeld oder Ausgleichszahlung
  rationale: Die Verbindung mit dem Verschließen der Augen weist auf eine korrumpierende Zahlung hin. Die grundsätzlich weitere Wortbedeutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit öffentlichem und rechtlichem Ton. Die rhetorischen Fragen und die Wiederholungen des Hebräischen bleiben weitgehend erhalten. Schwierige oder kontextabhängige Begriffe werden nicht dogmatisch vereindeutigt, sondern durch Fußnoten transparent gemacht.
