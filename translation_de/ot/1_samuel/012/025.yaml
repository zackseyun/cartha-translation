  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: de
  text: Wenn ihr aber wirklich Böses tut[a], werdet sowohl ihr als auch euer König hinweggerafft werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Böses tut“ oder „böse handelt“. Im Hebräischen wird das Verb durch einen vorangestellten absoluten Infinitiv nachdrücklich verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „umkommen“ oder „vernichtet werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Wendung leitet eine Bedingung ein und steht zugleich im Gegensatz zur vorausgehenden Verheißung; die deutsche Nachstellung von „aber“ gibt beides natürlich wieder.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: wirklich Böses tut
  rationale: Der vorangestellte absolute Infinitiv verstärkt die finite Verbform. „Wirklich“ bildet diese Hervorhebung verständlich ab, ohne aus der Konstruktion zwingend ein fortgesetztes Handeln abzuleiten.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: sowohl ihr als auch euer König
  rationale: Das wiederholte גַּם schließt ausdrücklich beide Seiten in die Warnung ein; die sowohl-als-auch-Konstruktion bewahrt diese Verteilung idiomatisch.
- source_word: תִּסָּפוּ
  choice: werdet … hinweggerafft werden
  rationale: Der Nifal von ספה bezeichnet hier das Beseitigt- oder Vernichtetwerden im Gericht. „Hinweggerafft werden“ erhält den passiven Charakter und lässt die genaue Gestalt des Gerichts offen.
theological_decisions:
- issue: Art des angekündigten Gerichts über Volk und König
  choice: Eine umfassende Warnung vor Gericht und Beseitigung, die sowohl das Volk als auch seinen König betrifft
  alternative: Ausschließlich militärische Niederlage oder ausschließlich geistlicher Untergang
  rationale: Der Vers nennt die konkrete Form des Gerichts nicht. „Hinweggerafft werden“ bewahrt die Schwere der Aussage, ohne sie auf eine bestimmte Art des Untergangs festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische hebräische Verbkonstruktion wird mit „wirklich“ wiedergegeben; die Gerichtsformulierung bleibt bewusst weit und bildhaft.
