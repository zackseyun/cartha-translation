  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ לְ/נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָ֠בוֹאוּ הָ/עֲרֵלִ֨ים הָ/אֵ֤לֶּה וּ/דְקָרֻ֨/נִי֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: de
  text: 'Da sagte Saul zu seinem Waffenträger: »Zieh dein Schwert und durchbohr mich damit! Sonst kommen diese Unbeschnittenen, durchbohren mich und misshandeln mich[a].« Doch sein Waffenträger wollte nicht, denn er hatte große Angst. Da nahm Saul das Schwert und fiel in sein Schwert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihren Spott mit mir treiben« oder »mich schändlich behandeln«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die feste deutsche Militärbezeichnung gibt den königlichen Begleiter wieder, der Sauls Waffen und Ausrüstung trug.
- source_word: שְׁלֹף
  choice: Zieh
  rationale: Im Zusammenhang mit einem Schwert bezeichnet das Verb dessen Ziehen aus der Scheide; die knappe Form ist im Deutschen idiomatisch.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: durchbohr mich damit / durchbohren mich
  rationale: „Durchbohren“ vermittelt den tödlichen Stoß mit dem Schwert und bewahrt die Wiederholung desselben hebräischen Verbs.
- source_word: פֶּן
  choice: Sonst
  rationale: „Sonst“ leitet in natürlichem modernem Deutsch den von Saul befürchteten Ausgang ein.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: diese Unbeschnittenen
  rationale: Die wörtliche, abwertende Bundesbezeichnung bleibt erhalten; „Philister“ wäre trotz des Kontexts eine Verdeutlichung über den Wortlaut hinaus.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: und misshandeln mich
  rationale: Die Form bezeichnet demütigende, üble Behandlung, ohne deren genaue Art festzulegen. „Misshandeln“ wahrt diese inhaltliche Breite.
- source_word: וְלֹא אָבָה
  choice: wollte nicht
  rationale: Die Wendung gibt die Weigerung beziehungsweise mangelnde Bereitschaft knapp und natürlich wieder.
- source_word: כִּי יָרֵא מְאֹד
  choice: denn er hatte große Angst
  rationale: Die Formulierung gibt sowohl die Begründung als auch die Verstärkung durch מְאֹד in geläufigem Deutsch wieder.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: und stürzte sich hinein
  rationale: Dies ist die natürliche deutsche Wendung für das absichtliche Fallen in ein Schwert; sie entspricht dem hebräischen „fiel darauf“, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Genaue Art der von Saul befürchteten entwürdigenden Behandlung
  choice: misshandeln mich
  alternative: ihren Spott mit mir treiben; mich schändlich behandeln
  rationale: Das hebräische Verb lässt offen, ob körperliche Misshandlung, Verspottung oder eine andere Form der Demütigung gemeint ist. Die Übersetzung wahrt diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, knapper Rede. Der Ausdruck „Unbeschnittene“ bleibt als markierte historische Bezeichnung stehen. Der Fußnotenmarker ist unmittelbar an der mehrdeutigen Wendung angebracht, auf die sich die Fußnote bezieht.
