  source_fidelity: 'Der deutsche Text gibt die hebräische Abfolge und die konkreten Begriffe präzise wieder: „ihre Gebeine“ entspricht עַצְמֹתֵיהֶם, „begruben“ dem gewöhnlichen קבר, und „unter der Tamariske“ bewahrt die spezifische Baumbezeichnung אֶשֶׁל. „in Jabesch“ ist als Ortsangabe korrekt; der Bezug auf Jabesch-Gilead wird sachgerecht erläutert. „sieben Tage“ gibt die Zeitangabe unmittelbar wieder.'
