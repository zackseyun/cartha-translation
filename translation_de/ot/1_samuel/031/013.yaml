source:
  edition: WLC
  text: וַ/יִּקְחוּ֙ אֶת עַצְמֹ֣תֵי/הֶ֔ם וַ/יִּקְבְּר֥וּ תַֽחַת הָ/אֶ֖שֶׁל בְּ/יָבֵ֑שָׁ/ה וַ/יָּצֻ֖מוּ שִׁבְעַ֥ת יָמִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: de
  text: Sie nahmen ihre Gebeine und begruben sie unter der Tamariske in Jabesch[a][b]. Dann fasteten sie sieben Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter dem Tamariskenbaum“; das Hebräische nennt die Baumart ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: „Jabesch“ ist hier die Kurzform von „Jabesch-Gilead“ aus dem vorhergehenden Zusammenhang.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: ihre Gebeine
  rationale: עֶצֶם bezeichnet konkret einen Knochen. Nach der Verbrennung der Leichname in Vers 12 bleibt diese konkrete Aussage erhalten; „Gebeine“ ist im Deutschen für die Knochen eines Verstorbenen natürlich und würdig.
- source_word: וַיִּקְבְּרוּ
  choice: und begruben
  rationale: קבר ist das gewöhnliche Verb für „begraben“; die schlichte Form entspricht dem Erzählstil.
- source_word: תַחַת
  choice: unter
  rationale: תַחַת bedeutet hier räumlich „unter“ und wird direkt wiedergegeben.
- source_word: הָאֶשֶׁל
  choice: der Tamariske
  rationale: אֶשֶׁל bezeichnet spezifisch eine Tamariske. Der bestimmte Artikel wird bewahrt; das zusätzliche Wort „Baum“ ist im Deutschen nicht nötig.
- source_word: בְּיָבֵשָׁה
  choice: in Jabesch
  rationale: Die Präposition בְּ ist hier lokativ. „Jabesch“ ist die im unmittelbaren Zusammenhang verkürzte Bezeichnung für Jabesch-Gilead.
- source_word: וַיָּצֻמוּ
  choice: Dann fasteten sie
  rationale: צום bedeutet „fasten“. „Dann“ bildet die Fortsetzung der hebräischen Erzählfolge natürlich ab.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage
  rationale: Die Zeitangabe wird unmittelbar und idiomatisch wiedergegeben.
- source_word: וַיִּקְחוּ
  choice: Sie nahmen
  rationale: לקח bedeutet „nehmen“; die einfache Vergangenheitsform entspricht der fortlaufenden Erzählung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit schlichtem erzählerischem Satzbau. „Gebeine“ bewahrt den konkreten Bezug auf Knochen und klingt im Bestattungskontext natürlicher als das allgemeinere „Überreste“.
