id: 1SA.31.10
reference: 1 Samuel 31:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּשִׂ֨מוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית עַשְׁתָּר֑וֹת וְ/אֶת גְּוִיָּת/וֹ֙ תָּקְע֔וּ בְּ/חוֹמַ֖ת בֵּ֥ית שָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: de
  text: Sie legten seine Waffen[a] in den Tempel der Astarten[b] und befestigten seinen Leichnam an der Mauer von Bet-Schean.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Rüstung“ beziehungsweise allgemeiner: „seine Ausrüstung“. Das hebräische Wort kann verschiedene militärische Geräte und Gegenstände bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in das Haus der Astarten“. Möglich ist auch: „in den Tempel der Astarte“. Die hebräische Bezeichnung steht formal im Plural.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und spießten seinen Leichnam an der Mauer von Bet-Schean auf“. Das hebräische Verb kann „hineintreiben“ oder „festmachen“ bedeuten; die genaue Art der Zurschaustellung bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Sie legten
  rationale: שׂים bedeutet „setzen, legen, stellen“. Bei Gegenständen, die in einem Tempel deponiert werden, ist „legten“ im Deutschen natürlich.
- source_word: כֵּלָיו
  choice: seine Waffen
  rationale: כְּלִי bezeichnet je nach Zusammenhang Gerät, Ausrüstung oder Waffen. Hier geht es um Sauls erbeutete militärische Gegenstände; „Waffen“ ist verständlich, ohne den Ausdruck ausschließlich auf eine Rüstung zu verengen.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: den Tempel der Astarten
  rationale: בֵּית heißt wörtlich „Haus“, bezeichnet in diesem kultischen Zusammenhang aber einen Tempel. עַשְׁתָּרוֹת ist formal pluralisch; „Astarten“ bewahrt diese Form, auch wenn möglicherweise die Göttin Astarte gemeint ist.
- source_word: גְּוִיָּתוֹ
  choice: seinen Leichnam
  rationale: גְּוִיָּה bezeichnet hier den Körper eines Toten. „Leichnam“ macht den Sinn eindeutig und entspricht dem würdigen Erzählregister.
- source_word: תָּקְעוּ
  choice: befestigten
  rationale: תקע kann „hineintreiben“, „festmachen“ oder „befestigen“ bedeuten. „Befestigten“ beschreibt das Ergebnis, ohne die nicht genau angegebene Art der öffentlichen Zurschaustellung festzulegen.
- source_word: בְּחוֹמַת
  choice: an der Mauer
  rationale: Die Präposition ב mit תקע wird hier im Deutschen idiomatisch als Befestigung „an“ der Mauer wiedergegeben.
- source_word: בֵּית שָׁן
  choice: Bet-Schean
  rationale: Der Ortsname wird in einer im deutschen Bibelgebrauch geläufigen Transliteration wiedergegeben.
theological_decisions:
- issue: Identität und Numerus von עַשְׁתָּרוֹת
  choice: der Astarten
  alternative: der Astarte
  rationale: Die Übersetzung bewahrt den morphologischen Plural und vermeidet es, die Form stillschweigend auf eine einzelne Göttin festzulegen; eine idiomatische Singularlesart bleibt in der Fußnote sichtbar.
- issue: Art der Befestigung des Leichnams
  choice: befestigten
  alternative: spießten … auf
  rationale: Der hebräische Ausdruck lässt eine gewaltsame Befestigung oder ein Hineintreiben zu, bestimmt die konkrete Methode jedoch nicht präzise. Die Hauptfassung wahrt diese Unbestimmtheit.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. „Leichnam“ entspricht dem ernsten Kontext; die Fußnoten erhalten die lexikalische und formale Mehrdeutigkeit des Hebräischen.
