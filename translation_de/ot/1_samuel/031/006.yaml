source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֡וּל וּ/שְׁלֹ֣שֶׁת בָּנָי/ו֩ וְ/נֹשֵׂ֨א כֵלָ֜י/ו גַּ֧ם כָּל אֲנָשָׁ֛י/ו בַּ/יּ֥וֹם הַ/ה֖וּא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: de
  text: So starben Saul, seine drei Söhne, sein Waffenträger und alle seine Männer[a] an jenem Tag gemeinsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle seine Soldaten«. Im Hebräischen steht »alle seine Männer«; im Zusammenhang der Schlacht sind damit wahrscheinlich Sauls Kämpfer oder Gefolgsleute gemeint. Einige griechische Textzeugen lesen stattdessen »seine ganze Rüstung«; der hebräische Text bietet »alle seine Männer«.'
    reason: Lexikalische Alternative und Textvariante
lexical_decisions:
- source_word: וַיָּמָת
  choice: So starben
  rationale: Das konsekutive וַ führt die Erzählung fort und stellt Sauls Tod als Folge des unmittelbar zuvor Berichteten dar; der deutsche Plural nimmt die gesamte nachfolgende Subjektgruppe auf.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: seine drei Söhne
  rationale: Natürliche und genaue Wiedergabe der Zahlverbindung mit Possessivsuffix.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die Wendung bezeichnet wörtlich den Träger seiner Waffen beziehungsweise Ausrüstung; »Waffenträger« ist im militärischen Zusammenhang präzise und geläufig.
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: und alle seine Männer
  rationale: גַּם fügt das letzte Glied der Aufzählung hinzu; im Deutschen gibt »und« dies hier ohne unnatürliche Überbetonung wieder. אֲנָשָׁיו meint im Schlachtzusammenhang wahrscheinlich Sauls Männer beziehungsweise Kampftruppe, ohne dass »Soldaten« ausdrücklich im Hebräischen steht.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Klare, idiomatische Wiedergabe der bestimmten Zeitangabe.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Bewahrt die Aussage, dass die Genannten am selben Tag zusammen den Tod fanden.
