source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ כָּל אִ֣ישׁ חַיִל֮ וַ/יֵּלְכ֣וּ כָל הַ/לַּיְלָה֒ וַ/יִּקְח֞וּ אֶת גְּוִיַּ֣ת שָׁא֗וּל וְ/אֵת֙ גְּוִיֹּ֣ת בָּנָ֔י/ו מֵ/חוֹמַ֖ת בֵּ֣ית שָׁ֑ן וַ/יָּבֹ֣אוּ יָבֵ֔שָׁ/ה וַ/יִּשְׂרְפ֥וּ אֹתָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: de
  text: Da machten sich alle tapferen Männer auf und gingen die ganze Nacht hindurch. Sie nahmen den Leichnam Sauls und die Leichname seiner Söhne[a] von der Mauer Bet-Scheans, kamen nach Jabesch[b] und verbrannten sie dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet ausdrücklich tote Körper.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Jabesch-Gilead; der hebräische Text verwendet hier die Kurzform Jabesch.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: alle tapferen Männer
  rationale: Die feste Verbindung bezeichnet hier Männer, die sich durch Tüchtigkeit und Mut im militärischen Handeln auszeichnen. „Tapfere Männer“ ist im Deutschen natürlich, wahrt den männlichen Bezug und legt keine bestimmte militärische Dienststellung fest.
- source_word: וַיָּק֜וּמוּ
  choice: Da machten sich ... auf
  rationale: Das Verb bedeutet wörtlich „sie standen auf“, dient in Erzählungen aber häufig der Einleitung entschlossenen Handelns. „Machten sich auf“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: gingen die ganze Nacht hindurch
  rationale: Die Formulierung beschreibt eine die ganze Nacht andauernde Wegbewegung. „Gingen“ bleibt nahe am hebräischen Verb, ohne zusätzliche Angaben zu Route oder Transportmittel einzutragen.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: den Leichnam ... die Leichname
  rationale: גְּוִיָּה bezeichnet hier ausdrücklich einen toten Körper. „Leichnam“ ist präzise, würdig und im Deutschen weniger missverständlich als das allgemeinere „Körper“.
- source_word: מֵחוֹמַת בֵּית שָׁן
  choice: von der Mauer Bet-Scheans
  rationale: Die Präposition מִן bezeichnet die Entfernung von der Mauer. Die Genitivfügung ist idiomatisches Deutsch und bewahrt den Ortsnamen.
- source_word: יָבֵשָׁה
  choice: nach Jabesch
  rationale: Die Richtungsendung bezeichnet die Bewegung nach Jabesch. Der Grundtext nennt an dieser Stelle nur die Kurzform des Ortsnamens.
- source_word: וַיִּשְׂרְפוּ אֹתָם שָׁם
  choice: und verbrannten sie dort
  rationale: Die direkte Wiedergabe bewahrt sowohl das Verb „verbrennen“ als auch das auf die Leichname bezogene Pronomen, ohne den ungewöhnlichen Vorgang erklärend umzudeuten.
theological_decisions:
- issue: Männlicher Bezug der handelnden Gruppe
  choice: alle tapferen Männer
  alternative: alle Tapferen
  rationale: אִישׁ sowie die militärische Situation bezeichnen hier männliche Handelnde. Die Übersetzung bewahrt diese Textangabe, ohne eine weitergehende gesellschaftliche oder kirchliche Aussage daraus abzuleiten.
- issue: Art der Behandlung der Leichname
  choice: verbrannten sie dort
  alternative: verbrannten sie dort vollständig / äscherten sie dort ein
  rationale: Der hebräische Text sagt lediglich, dass sie verbrannt wurden. Die Übersetzung lässt Umfang, Zweck und genaue Form des Verbrennens offen und vermeidet dadurch eine harmonisierende oder kulturell-theologische Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. „Machten sich auf“ vermeidet das steife „erhoben sich“, während „Leichnam“ die sachliche Genauigkeit und den ernsten Ton des Abschnitts wahrt. Die Ortsnamen folgen einer geläufigen deutschen Transliteration.
