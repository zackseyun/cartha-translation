  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל חַרְבּ֖/וֹ וַ/יָּ֥מָת עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/005.yaml
  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: de
  text: Als sein Waffenträger sah, dass Saul tot war[a], fiel auch er in sein Schwert und starb mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gestorben war«. Das Hebräische kann sowohl Sauls Zustand als auch sein bereits eingetretenes Sterben als Grundlage für die Handlung des Waffenträgers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die Konstruktverbindung bezeichnet wörtlich den Träger seiner Ausrüstung beziehungsweise Waffen. »Waffenträger« ist im militärischen Zusammenhang die geläufige und treffende deutsche Rollenbezeichnung.
- source_word: כִּי
  choice: dass
  rationale: 'כִּי leitet hier den Inhalt der Wahrnehmung ein: Der Waffenträger sah, dass Saul tot war.'
- source_word: מֵת
  choice: tot war
  rationale: Die Form kann Sauls festgestellten Zustand bezeichnen. »Tot war« gibt diesen stativischen Sinn natürlich wieder; »gestorben war« bleibt als mögliche ereignisbezogene Auffassung in der Fußnote erhalten.
- source_word: גַּם הוּא
  choice: auch er
  rationale: Die Wendung hebt hervor, dass der Waffenträger entsprechend Saul dasselbe tat; »auch er« bewahrt diese additive Betonung knapp und natürlich.
- source_word: עַל חַרְבּוֹ
  choice: stürzte sich in sein Schwert
  rationale: Das Deutsche verwendet für diese Handlung idiomatisch »sich in sein Schwert stürzen«. Dies gibt das Fallen auf das eigene Schwert klar wieder, ohne die Handlung abzuschwächen.
- source_word: וַיָּמָת עִמּוֹ
  choice: und starb mit ihm
  rationale: עִם bezeichnet Begleitung beziehungsweise Gemeinsamkeit. »Starb mit ihm« bleibt nah am Hebräischen und fügt keine räumliche Aussage hinzu.
- source_word: וַיַּרְא
  choice: Als ... sah
  rationale: Die Satzverknüpfung führt die Erzählung weiter. Die temporale Fassung mit »Als« verbindet Wahrnehmung und anschließende Handlung im Deutschen flüssig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Waffenträger« wahrt den historischen militärischen Kontext; »stürzte sich in sein Schwert« ist die natürliche deutsche Wiedergabe der hebräischen Handlungsschilderung.
