    issue: Die Fußnote b bezeichnet „im Haus ihrer Götzen“ als wörtliche Wiedergabe.
    rationale: Wörtlich ist wegen לְ- nicht „im Haus“, sondern „dem/zu dem Haus ihrer Götzen“ gemeint. Die Fußnote muss die Zielrichtung und die mögliche Bedeutung von „Haus“ als Kultstätte korrekt erläutern.
