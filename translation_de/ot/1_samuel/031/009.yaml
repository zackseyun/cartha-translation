revisions:
- from: Sie schlugen ihm den Kopf ab, nahmen ihm seine Rüstung[a] ab und sandten Boten ringsum durch das Land der Philister, um die gute Nachricht im Tempel ihrer Götzen[b] und unter dem Volk zu verkünden.
  to: Sie schlugen ihm den Kopf ab, nahmen ihm seine Rüstung[a] ab und sandten Boten im ganzen Land der Philister aus, um die gute Nachricht dem Haus ihrer Götzen[b] und dem Volk zu verkünden.
  rationale: Die Revision korrigiert die syntaktische Funktion von „Haus ihrer Götzen“ und „Volk“ zu parallelen Adressaten der Siegesmeldung. Zugleich ersetzt sie die etwas schwerfällige räumliche Wiedergabe von סָבִיב durch „im ganzen Land“, ohne den Verbreitungsumfang abzuschwächen. Die Fußnote zu der Kultstätte wird an die hebräische Präposition angepasst.
