source:
  edition: WLC
  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: de
  text: Sie schlugen ihm den Kopf ab, nahmen ihm seine Rüstung[a] ab und sandten Boten im ganzen Land der Philister aus, um die gute Nachricht dem Haus ihrer Götzen[b] und dem Volk zu verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Waffen« oder »seine Ausrüstung«.'
    reason: כֵּלִים kann je nach Zusammenhang Rüstung, Waffen oder allgemein Ausrüstung bezeichnen.
  - marker: b
    text: 'Wörtlich: »dem Haus ihrer Götzen«. »Haus« kann hier eine Kultstätte, also einen Tempel oder Schrein, bezeichnen.'
    reason: בֵּית bedeutet grundlegend »Haus« und kann im kultischen Zusammenhang einen Tempel oder Schrein meinen; die Präposition לְ kennzeichnet das Haus zusammen mit dem Volk als Ziel der Verkündigung.
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: Sie schlugen ihm den Kopf ab
  rationale: כרת bezeichnet mit »Kopf« als Objekt eindeutig das Abtrennen. Die deutsche Wendung ist natürlich und gibt die Gewalttat präzise wieder.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: nahmen ihm seine Rüstung ab
  rationale: פשׁט bezeichnet hier das Abstreifen beziehungsweise Abnehmen, während כֵּלִים im Schlachtzusammenhang die militärische Ausrüstung, besonders die Rüstung, meint.
- source_word: וַיְשַׁלְּחוּ
  choice: sandten Boten
  rationale: Das Hebräische sagt wörtlich nur »sie sandten«. Aus dem folgenden Zwecksatz ergibt sich, dass ausgesandte Personen die Nachricht verbreiten sollten; »Boten« macht die Ellipse im Deutschen verständlich.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: ringsum durch das Land der Philister
  rationale: »Ringsum« bewahrt סָבִיב ausdrücklich; »durch das Land« gibt die weite Verbreitung innerhalb des Philistergebiets idiomatisch wieder.
- source_word: לְבַשֵּׂר
  choice: um die gute Nachricht … zu verkünden
  rationale: Das Piel von בשׂר bezeichnet das Überbringen oder Verkünden einer guten Nachricht. Der positive Charakter gilt aus Sicht der siegreichen Philister und ist keine Zustimmung des Erzählers.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: im Tempel ihrer Götzen
  rationale: בַּיִת bedeutet wörtlich »Haus«, bezeichnet in kultischem Zusammenhang aber einen Tempel oder Schrein. עֲצַבִּים meint Götzen beziehungsweise Götzenbilder.
- source_word: וְאֶת־הָעָם
  choice: und unter dem Volk
  rationale: Der Akkusativ ist nach »verkünden« elliptisch als weiterer Adressatenbereich zu verstehen. »Unter dem Volk« ist im Deutschen idiomatisch und hält die Verkündigung an die Bevölkerung fest.
theological_decisions:
- issue: Bezeichnung der philistäischen Kultstätte und Kultbilder
  choice: Tempel ihrer Götzen
  alternative: Haus ihrer Götzen / Haus ihrer Götzenbilder
  rationale: »Tempel« gibt die kultische Bedeutung von בֵּית verständlich wieder; »Götzen« wahrt die wertende Bezeichnung עֲצַבִּים, ohne den fremden Göttern reale Göttlichkeit zuzuschreiben.
- issue: Positive Färbung der Siegesmeldung
  choice: gute Nachricht
  alternative: Nachricht / Siegesnachricht
  rationale: בשׂר trägt die Bedeutung einer guten oder erfreulichen Nachricht. Die Formulierung bewahrt, dass Sauls Tod für die Philister eine Freudenbotschaft war, ohne diese Perspektive theologisch zu billigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Handlung wird klar, aber nicht ausgeschmückt wiedergegeben. »Boten« verdeutlicht eine im Hebräischen unausgesprochene Ergänzung; die kultische und lexikalische Mehrdeutigkeit wird in den Fußnoten offengelegt.
