    rationale: Das Hebräische hat לְבַשֵּׂר („um zu verkünden/zu melden“) mit „dem Haus ihrer Götzen und dem Volk“ als den beiden angeschlossenen Zielen. Die Übersetzung soll diese Parallelität erhalten, ohne zu behaupten, die Nachricht sei nur innerhalb eines Tempels verkündet worden.
