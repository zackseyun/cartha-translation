base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: de
  text: Am nächsten Tag kamen die Philister, um die Erschlagenen auszuplündern[a]. Da fanden sie Saul und seine drei Söhne, die auf dem Berg Gilboa gefallen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um die Erschlagenen zu plündern“. Das hebräische Verb bezeichnet hier das Abnehmen von Kleidung oder Ausrüstung von im Kampf Getöteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Am nächsten Tag
  rationale: Die hebräische Zeitangabe bezeichnet den Tag nach den zuvor erzählten Kampfereignissen; diese Wiedergabe ist im Deutschen natürlich und wahrt die Erzählfolge.
- source_word: לְפַשֵּׁט
  choice: auszuplündern
  rationale: Das Verb bezeichnet hier das Abnehmen von Kleidung, Waffen oder Rüstung bei den Gefallenen. „Ausplündern“ gibt Zweck und Situation idiomatisch wieder; die genauere körperliche Handlung wird in der Fußnote erläutert.
- source_word: הַחֲלָלִים
  choice: die Erschlagenen
  rationale: Das Wort bezeichnet im Kampf Getötete. „Die Erschlagenen“ bewahrt den kriegerischen Kontext deutlicher als das allgemeinere „die Toten“.
- source_word: וַיִּמְצְאוּ
  choice: Da fanden sie
  rationale: Die schlichte narrative Fortsetzung wird in natürlichem deutschem Erzählstil mit „Da“ wiedergegeben.
- source_word: נֹפְלִים
  choice: die … gefallen waren
  rationale: Die Wiedergabe bewahrt das hebräische Bild des Gefallenseins und macht im Deutschen zugleich deutlich, dass Saul und seine Söhne bereits tot am Ort lagen.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: auf dem Gebirge Gilboa
  rationale: „Gebirge Gilboa“ ist eine etablierte deutsche geografische Bezeichnung und gibt die Ortsangabe idiomatisch wieder.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: seine drei Söhne
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
