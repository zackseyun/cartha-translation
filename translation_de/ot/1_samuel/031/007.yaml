  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: de
  text: Als die Männer Israels, die jenseits des Tals waren, und die, die jenseits des Jordans waren, sahen, dass die Männer Israels geflohen waren und dass Saul und seine Söhne tot waren, verließen sie die Städte und flohen. Da kamen die Philister und ließen sich in ihnen nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wohnten in ihnen“. Das hebräische Verb kann sowohl das Wohnen als auch das Sich-Niederlassen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: sahen
  rationale: ראה bedeutet grundlegend „sehen“. Die konkrete Wahrnehmung bleibt erhalten, ohne sie deutend als bloßes Erkennen wiederzugeben.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Die wörtliche, im militärischen Zusammenhang passende Bezeichnung wird beibehalten; sie unterscheidet die betroffenen Männer von einer pauschalen Aussage über das ganze Volk.
- source_word: בְּעֵבֶר הָעֵמֶק / בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Tals / jenseits des Jordans
  rationale: עֵבֶר bezeichnet die andere beziehungsweise gegenüberliegende Seite. „Jenseits“ ist knapp, räumlich offen und bewahrt die Wiederholung des Hebräischen.
- source_word: כִּי נָסוּ
  choice: dass ... geflohen
  rationale: Der mit כִּי eingeleitete Satz gibt den Inhalt der Wahrnehmung wieder. Das Perfekt bezeichnet im Deutschen angemessen die bereits eingetretene Flucht.
- source_word: מֵתוּ
  choice: tot waren
  rationale: מות stellt den Tod fest, ohne hier ausdrücklich dessen Art zu benennen. „Tot waren“ vermeidet die Ergänzung „getötet worden waren“.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: verließen sie die Städte
  rationale: עזב kann „verlassen“ oder „aufgeben“ bedeuten. „Verließen“ ist natürlich und wird durch die anschließende Flucht eindeutig als Aufgabe der Städte verstanden.
- source_word: וַיָּנֻסוּ
  choice: und flohen
  rationale: נוס ist das gewöhnliche Verb für die Flucht und wird direkt wiedergegeben.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: ließen sich darin nieder
  rationale: ישב kann wohnen, sich niederlassen oder siedeln bedeuten. Im Zusammenhang mit den aufgegebenen Städten bringt „sich niederlassen“ die Übernahme als Wohnort natürlich zum Ausdruck, ohne zwingend dauerhafte Besiedlung zu behaupten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählprosa. Die parallele Ortsangabe „jenseits ... und jenseits ...“ sowie die zweimalige Wendung „die Männer Israels“ bleiben erhalten. Die geographische Bezugsperspektive von „jenseits“ wird nicht unnötig festgelegt.
