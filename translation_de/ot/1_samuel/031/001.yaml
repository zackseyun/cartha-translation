source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֖ים נִלְחָמִ֣ים בְּ/יִשְׂרָאֵ֑ל וַ/יָּנֻ֜סוּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר הַ/גִּלְבֹּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: de
  text: Die Philister kämpften gegen Israel, und die Männer Israels flohen vor den Philistern und fielen erschlagen auf dem Berg Gilboa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Die Philister
  rationale: Das einleitende ו verbindet mit dem vorherigen Erzählzusammenhang, erfordert im Deutschen aber kein ausdrücklich vorangestelltes „Und“. „Philister“ ist die etablierte deutsche Bezeichnung.
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: kämpften gegen Israel
  rationale: Das Partizip beschreibt das andauernde Kampfgeschehen als Hintergrund; das deutsche Präteritum gibt dies im Erzählstil natürlich wieder. ב ist bei לחם adversativ und wird mit „gegen“ wiedergegeben.
- source_word: וַ/יָּנֻסוּ
  choice: flohen
  rationale: „Flohen“ ist die präzise und natürliche Wiedergabe von נוּס in einem militärischen Zusammenhang.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Die Form bezeichnet ausdrücklich die Männer Israels; die Wiedergabe bewahrt diese sprachliche Bestimmtheit, ohne „Heer“ ergänzend einzutragen.
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: vor den Philistern
  rationale: Die hebräische Wendung bedeutet wörtlich „vom Angesicht der Philister weg“. Das deutsche „vor den Philistern fliehen“ gibt sowohl die Fluchtbewegung als auch die Gegenwart beziehungsweise Bedrohung des Feindes idiomatisch wieder.
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: und fielen erschlagen
  rationale: Die Verbindung bezeichnet im Kampf Gefallene. „Fielen erschlagen“ bewahrt sowohl das Verb „fallen“ als auch den tödlichen Ausgang, ohne das Bild zu verflachen.
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: auf dem Berg Gilboa
  rationale: הַר mit dem Ortsnamen wird im Deutschen natürlich als „Berg Gilboa“ wiedergegeben; „auf“ bezeichnet den Schauplatz.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Die Satzstruktur bleibt eng am Hebräischen, während „vor den Philistern fliehen“ die hebräische Raumwendung natürlich ausdrückt. Keine Fußnote ist nötig, da keine bedeutungstragende Alternative oder theologische Spannung verloren geht.
