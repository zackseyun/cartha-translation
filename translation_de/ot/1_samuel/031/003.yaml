  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: de
  text: Der Kampf gegen Saul wurde immer heftiger. Die Bogenschützen[b] fanden ihn, und er geriet durch die Schützen in große Bedrängnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er wurde von den Bogenschützen schwer verwundet.“ Das hier verwendete hebräische Verb ist schwierig und kann starke Bedrängnis, Schmerz, Zittern oder Angst bezeichnen, ohne ausdrücklich von einer körperlichen Verwundung zu sprechen.'
    reason: lexical_alternative
  - marker: b
