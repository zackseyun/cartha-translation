lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: Der Kampf gegen Saul wurde immer heftiger
  rationale: כבד bezeichnet wörtlich ein Schwerwerden und beschreibt hier idiomatisch, dass der Kampf Saul zunehmend hart bedrängte. Die Wiedergabe bewahrt die Steigerung und klingt im Deutschen natürlich.
- source_word: וַיִּמְצָאֻהוּ
  choice: fanden ihn
  rationale: Die Grundbedeutung von מצא ist „finden“. Im Kampfzusammenhang können auch „erreichen“ oder „aufspüren“ gemeint sein; die direkte Wiedergabe lässt diese Nuance offen.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: die Bogenschützen
  rationale: Die appositionale Formulierung lautet wörtlich etwa „die Schützen, Männer mit dem Bogen“. „Bogenschützen“ gibt den vollständigen Sinn ohne im Deutschen schwerfällige Wiederholung wieder.
- source_word: וַיָּחֶל מְאֹד מֵהַמּוֹרִים
  choice: er geriet wegen der Schützen in große Angst
  rationale: Das schwierige Verb wird hier im Sinn heftiger Angst, Qual oder Erschütterung verstanden; מן bezeichnet entsprechend den Anlass. Da auch eine Deutung als schwere Verwundung möglich ist, wird diese im Fußnotenapparat ausdrücklich bewahrt.
theological_decisions:
- issue: Sauls Zustand angesichts der Bogenschützen
  choice: große Angst
  alternative: schwere Verwundung
  rationale: Die hebräische Verbform ist lexikalisch schwierig und kann starke Angst, Qual oder Zittern bezeichnen; die Auslegung als Verwundung passt zwar zum Kampfzusammenhang und zur verbreiteten Deutung der Parallelstelle in 1. Chronik 10,3, ist aber nicht eindeutig. Die Hauptzeile folgt der wahrscheinlich unmittelbareren Bedeutung und hält die andere Deutung in der Fußnote offen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Kurze Hauptsätze erhalten das Tempo des Kampfberichts; die schwerfällige hebräische Apposition wird im Haupttext idiomatisch zusammengezogen. Die echte Mehrdeutigkeit des letzten Verbs bleibt durch die Fußnote sichtbar.
