  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אֶת שָׁא֖וּל וְ/אֶת בָּנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יְהוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: de
  text: Die Philister holten Saul und seine Söhne ein[a]. Dann schlugen die Philister Jonatan, Abinadab und Malkischua nieder[b], die Söhne Sauls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erreichten Saul und seine Söhne“ oder „verfolgten Saul und seine Söhne dicht“. Das hebräische Verb bezeichnet eine enge Verfolgung, bei der die Verfolger ihr Ziel erreichen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „töteten Jonatan, Abinadab und Malkischua“. Das hebräische Verb bedeutet wörtlich „schlagen“, bezeichnet in diesem Kampfzusammenhang aber sehr wahrscheinlich tödliche Gewalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: holten … ein
  rationale: דבק bezeichnet hier eine so enge Verfolgung, dass die Verfolger ihr Ziel erreichen. „Einholen“ gibt diesen militärischen Zusammenhang im Deutschen natürlich wieder, ohne das im Kontext unpassende Grundbild „sich anheften“ zu übernehmen.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die geläufige deutsche Bezeichnung der Volksgruppe.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: Saul und seine Söhne
  rationale: בָּנָיו bezeichnet hier ausdrücklich Sauls Söhne; die folgenden Namen bestätigen diese Bedeutung.
- source_word: וַיַּכּוּ
  choice: schlugen … nieder
  rationale: נכה bedeutet grundsätzlich „schlagen“ und bezeichnet im Kampf häufig tödliche Gewalt. „Niederschlagen“ bewahrt die Bildhaftigkeit und lässt die vom Kontext nahegelegte Todesfolge erkennen, ohne sie durch das eindeutigere „töten“ vollständig auszudeuten.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Geläufige deutsche Wiedergabe des hebräischen Personennamens.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Geläufige deutsche Wiedergabe des hebräischen Personennamens.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkischua
  rationale: Die zusammengeschriebene Form ist eine geläufige deutsche Wiedergabe des hebräischen Namens und bildet dessen Aussprache verständlich ab.
- source_word: בְּנֵי שָׁאוּל
  choice: die Söhne Sauls
  rationale: Die Apposition identifiziert die drei Genannten ausdrücklich als Sauls Söhne und bewahrt die hebräische Wiederholung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „die Philister“ und die abschließende Apposition bleiben entsprechend der hebräischen Erzählstruktur erhalten. „Dann“ stellt den erzählerischen Fortgang natürlich dar.
