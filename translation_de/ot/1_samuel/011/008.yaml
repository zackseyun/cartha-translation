  text: וַֽ/יִּפְקְדֵ֖/ם בְּ/בָ֑זֶק וַ/יִּהְי֤וּ בְנֵֽי יִשְׂרָאֵל֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וְ/אִ֥ישׁ יְהוּדָ֖ה שְׁלֹשִׁ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: de
  text: Er musterte sie in Besek. Die Israeliten[a] zählten 300.000 Mann, die Männer von Juda 30.000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: Er musterte sie
  rationale: פקד bezeichnet im militärischen Zusammenhang das Erfassen beziehungsweise Mustern der zum Kampf versammelten Männer, nicht bloß ein abstraktes Zählen.
- source_word: בְּבָזֶק
  choice: bei Besek
  rationale: Der Ortsname wird als „Besek“ wiedergegeben; die Präposition ב bezeichnet hier idiomatisch den Ort der Musterung.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ dient hier als Volksbezeichnung. „Israeliten“ ist im modernen Deutschen natürlich und schließt in diesem militärischen Zählkontext die gemusterten Männer ein.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 300.000 Mann
  rationale: Die Zahl wird direkt wiedergegeben; „Mann“ verdeutlicht aus dem militärischen Zusammenhang, dass es sich um die Stärke des Aufgebots handelt.
- source_word: וְאִישׁ יְהוּדָה
  choice: die Männer von Juda
  rationale: Das singularische אִישׁ wird kollektiv gebraucht und bezeichnet die zu Juda gehörenden Männer.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: '30.000'
  rationale: Die Kardinalzahl wird direkt und in moderner deutscher Zahlenschreibung wiedergegeben.
theological_decisions:
- issue: Wiedergabe der korporativen Bezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Es steht keine Lehrfrage auf dem Spiel. Die idiomatische Wiedergabe ist im modernen Deutschen klarer, während die Fußnote die hebräische Ausdrucksweise transparent bewahrt und die literarische Gegenüberstellung zu Juda nicht verdeckt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe militärische Zählsprache des Hebräischen bleibt erhalten; „zählten“ verbindet die beiden Zahlenangaben natürlich, ohne die vorangehende Musterung mit einem bloßen Zählvorgang gleichzusetzen.
