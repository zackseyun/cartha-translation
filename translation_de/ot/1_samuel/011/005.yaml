  to: 'Und siehe: Saul kam gerade vom Feld hinter den Rindern her. Saul fragte: »Was ist mit dem Volk, dass sie weinen?« Da berichteten sie ihm die Worte der Männer von Jabesch.[b]'
  rationale: Die Revision beschränkt sich auf stilistisch und syntaktisch sichere Anpassungen. „Und siehe“ wahrt die szenenmarkierende Funktion von וְהִנֵּה in einem etablierten deutschen Erzählregister. Die Stellung „vom Feld hinter den Rindern her“ verdeutlicht die Bewegungsrichtung, ohne die lexikalische Mehrdeutigkeit von אַחֲרֵי aufzulösen; diese bleibt in Fußnote a erhalten. Der Plural „sie weinen“ entspricht dem hebräischen Verb und ist im Deutschen bei „Volk“ idiomatischer.
