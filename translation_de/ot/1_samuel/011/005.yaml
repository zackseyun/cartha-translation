  terminology: „Saul“, „Rinder“, „Volk“, „Männer von Jabesch“ und „Worte“ sind angemessen. „Jabesch“ ist die etablierte deutsche Namensform. Die Fußnoten bewahren die relevante Möglichkeit, אַחֲרֵי als „folgend/hinterher“ aufzufassen, sowie die dynamischere Wiedergabe von דִּבְרֵי als „Botschaft“.
