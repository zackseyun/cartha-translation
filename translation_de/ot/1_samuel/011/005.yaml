base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: de
  text: 'Und siehe: Saul kam gerade vom Feld hinter den Rindern her. Saul fragte: »Was ist mit dem Volk, dass sie weinen?« Da berichteten sie ihm die Worte der Männer von Jabesch.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „die Botschaft der Männer von Jabesch“. Wörtlich: „die Worte der Männer von Jabesch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh da
  rationale: Bewahrt den szenenöffnenden, vergegenwärtigenden Erzählakzent von הִנֵּה in einer verständlichen deutschen Wendung.
- source_word: בָּא
  choice: kam gerade
  rationale: Das Partizip bezeichnet eine im Gang befindliche Handlung; „kam gerade“ gibt diesen Hintergrundaspekt im Deutschen natürlich wieder.
- source_word: אַחֲרֵי הַבָּקָר
  choice: hinter den Rindern
  rationale: אַחֲרֵי kann hier räumlich „hinter“ bedeuten. בָּקָר bezeichnet Rinder bzw. Großvieh und ist nicht zwingend auf Ochsen beschränkt.
- source_word: מִן הַשָּׂדֶה
  choice: vom Feld her
  rationale: Gibt den Ausgangspunkt und die Bewegungsrichtung knapp und idiomatisch wieder.
- source_word: מַה לָעָם
  choice: Was ist mit dem Volk
  rationale: Die hebräische Wendung fragt idiomatisch, was mit jemandem los ist; die deutsche Form bleibt nah am Wortlaut und klingt natürlich.
- source_word: כִּי יִבְכּוּ
  choice: dass es weint
  rationale: כִּי führt hier den beobachteten Anlass der Frage an. Der Singular entspricht dem Kollektiv „Volk“, während das imperfektive Verb das andauernde Weinen ausdrückt.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: Da berichteten sie ihm
  rationale: „Berichteten“ entspricht dem Erzählen bzw. Mitteilen des eingetroffenen Geschehens und passt zum narrativen Zusammenhang.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: die Worte der Männer von Jabesch
  rationale: Bewahrt die formale Bedeutung von דִּבְרֵי („Worte“); „Männer“ gibt אַנְשֵׁי im Kontext der männlichen Abgesandten bzw. Einwohner genau wieder.
