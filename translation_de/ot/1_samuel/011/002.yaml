source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: de
  text: 'Der Ammoniter Nahasch sagte zu ihnen: »Unter dieser Bedingung werde ich einen Bund mit euch schließen: Ich steche jedem von euch das rechte Auge aus und bringe damit Schande über ganz Israel.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּזֹאת אֶכְרֹת לָכֶם
  choice: Unter dieser Bedingung werde ich einen Bund mit euch schließen
  rationale: בְּזֹאת bezeichnet hier die Bedingung, unter der Nahasch כרת ברית implizit vollziehen will; »einen Bund schließen« gibt die feste hebräische Verbindung natürlich und würdig wieder.
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: Ich steche jedem von euch das rechte Auge aus
  rationale: נקר bezeichnet das Ausstechen bzw. Ausbohren eines Auges. Das distributive כָּל־עֵין יָמִין wird im Deutschen idiomatisch auf jede betroffene Person bezogen.
- source_word: וְשַׂמְתִּיהָ חֶרְפָּה עַל כָּל־יִשְׂרָאֵל
  choice: und bringe damit Schande über ganz Israel
  rationale: Das feminine Suffix in וְשַׂמְתִּיהָ nimmt wahrscheinlich die Handlung bzw. Verstümmelung auf. »damit« bildet diesen Rückbezug natürlich ab, ohne ein ungenanntes Substantiv einzuführen.
theological_decisions:
- issue: Art der Vereinbarung
  choice: Bund
  alternative: Vertrag
  rationale: כרת wird ohne ausdrückliches בְּרִית gebraucht, setzt aber die geläufige Wendung »einen Bund schließen« voraus. »Bund« bewahrt die breite politische und zwischenmenschliche Bedeutung, ohne eine besondere heilsgeschichtliche Qualität zu behaupten.
- issue: Handelnder beim Ausstechen
  choice: Nahasch spricht als handelnder Veranlasser in der ersten Person
  alternative: 'Passiv: »jedem von euch wird das rechte Auge ausgestochen«'
  rationale: Der Infinitiv mit לָכֶם beschreibt Nahaschs auferlegte Bedingung; die aktive Wiedergabe entspricht seinem Drohwort und dem anschließenden וְשַׂמְתִּי.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte, brutale Sprache des hebräischen Textes wird weder abgeschwächt noch ausgeschmückt.
