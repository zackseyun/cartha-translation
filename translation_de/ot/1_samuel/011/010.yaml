base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/010.yaml
  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: de
  text: 'Da sagten die Männer von Jabesch: »Morgen werden wir zu euch hinausgehen[a], und dann könnt ihr mit uns tun, was immer in euren Augen gut ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu euch herauskommen«. Das Hebräische sagt nicht ausdrücklich »wir werden uns ergeben«, auch wenn der Zusammenhang Unterwerfung nahelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das konsekutive Waw führt die Erzählung weiter; »Da« gibt den zeitlich-folgernden Zusammenhang im Deutschen natürlich wieder.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: die Männer von Jabesch
  rationale: אַנְשֵׁי bezeichnet ausdrücklich die Männer; der Vers selbst nennt den Ort nur »Jabesch«, nicht »Jabesch-Gilead«.
- source_word: מָחָר
  choice: Morgen
  rationale: Das temporale Adverb bezeichnet eindeutig den folgenden Tag.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: wir werden zu euch hinausgehen
  rationale: יצא bedeutet »hinausgehen/herauskommen«. Die Formulierung bewahrt die konkrete Aussage des Hebräischen, ohne die aus dem Kontext naheliegende Ergebung ausdrücklich in den Text einzutragen.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: und dann könnt ihr mit uns tun
  rationale: Im Zusammenhang drückt die Form aus, was die Belagerer anschließend mit den Männern tun können; »könnt« klingt im Deutschen natürlich, ohne daraus einen Befehl zu machen.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: was immer in euren Augen gut ist
  rationale: Die Wiedergabe erhält die hebräische Redewendung und deren Perspektivbindung; das glattere »was euch gefällt« wäre weniger formnah.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wendung »in euren Augen gut« bleibt bewusst erhalten; die implizierte Ergebung wird nicht explizit in den Haupttext aufgenommen.
