reference: 1 Samuel 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: de
  text: 'Und es geschah am nächsten Tag: Saul teilte das Volk in drei Abteilungen[a]. Während der Morgenwache[b] drangen sie mitten in das Lager ein und schlugen die Ammoniter bis zur Hitze des Tages[c]. Die Überlebenden wurden so zerstreut, dass nicht einmal zwei von ihnen beieinanderblieben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in drei Häupter«; gemeint sind drei militärische Abteilungen oder Verbände.'
    reason: lexical_alternative
  - marker: b
    text: Die Morgenwache war der frühmorgendliche Wachabschnitt, etwa vor und um die Morgendämmerung.
    reason: cultural_note
  - marker: c
    text: 'Oder: »bis der Tag heiß wurde«; wahrscheinlich ist die Zeit gegen Mittag gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: am nächsten Tag
  rationale: Die Zeitangabe bezeichnet den Tag nach den zuvor erzählten Ereignissen; die Formulierung ist natürlich und wahrt die zeitliche Abfolge.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: teilte das Volk in drei Abteilungen
  rationale: Wörtlich steht »drei Häupter«; im militärischen Zusammenhang sind drei gegliederte Verbände gemeint. »Abteilungen« gibt das Idiom klar wieder.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: drangen sie mitten in das Lager ein
  rationale: Die Präposition mit der Bewegungsform וַיָּבֹאוּ bezeichnet das Eindringen in das Innere des feindlichen Lagers.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: während der Morgenwache
  rationale: Gemeint ist der frühmorgendliche, militärisch gegliederte Wachabschnitt; »während« lässt den Angriff innerhalb dieses Zeitraums stattfinden.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: schlugen die Ammoniter
  rationale: »Ammon« steht kollektiv für die ammonitische Streitmacht. »schlugen« bewahrt die Breite des Verbs נכה, ohne es unnötig auf »töteten« oder »besiegten« festzulegen.
- source_word: עַד חֹם הַיּוֹם
  choice: bis zur Hitze des Tages
  rationale: Die bildhafte Zeitangabe wird nahe am Hebräischen bewahrt; sie weist wahrscheinlich auf den späten Vormittag bis gegen Mittag.
- source_word: הַנִּשְׁאָרִים
  choice: die Überlebenden
  rationale: Im Zusammenhang der Schlacht bezeichnet der Ausdruck diejenigen, die nach dem Angriff übrig blieben.
- source_word: וַיָּפֻצוּ
  choice: wurden so zerstreut
  rationale: Die Form beschreibt ihre vollständige Zerstreuung nach der Niederlage; »so« verbindet sie natürlich mit dem folgenden Ergebnissatz.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: dass nicht einmal zwei von ihnen beieinanderblieben
  rationale: Die Formulierung bewahrt das eindrückliche Bild der restlosen Auflösung des Heeres und gibt die Folgebeziehung idiomatisch wieder.
- source_word: וַיְהִי ... וַיְהִי
  choice: Und es geschah ... [zweite Formel im Deutschen geglättet]
  rationale: Die erste Erzählformel wird zur Wahrung des hebräischen Erzähltons beibehalten. Die zweite wird in den Satzfluss integriert, da eine wörtliche Wiederholung im modernen Deutschen schwerfällig wäre.
