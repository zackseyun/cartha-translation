source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/עָם֙ אֶל שְׁמוּאֵ֔ל מִ֣י הָ/אֹמֵ֔ר שָׁא֖וּל יִמְלֹ֣ךְ עָלֵ֑י/נוּ תְּנ֥וּ הָ/אֲנָשִׁ֖ים וּ/נְמִיתֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: de
  text: 'Da sagte das Volk zu Samuel: »Wer hat gesagt: ›Soll Saul über uns herrschen?‹[a] Gebt die Männer heraus, und wir wollen sie töten!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wird Saul über uns herrschen?« Der hebräische Imperfekt kann als Frage mit unterschiedlicher modaler Nuance oder, hier weniger wahrscheinlich, als Aussage verstanden werden: »Saul soll über uns herrschen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Da“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: Die übliche kollektive Bezeichnung für das hier versammelte Volk Israel.
- source_word: אֶל שְׁמוּאֵל
  choice: zu Samuel
  rationale: אֶל bezeichnet hier den Adressaten der Rede; „Samuel“ entspricht der etablierten deutschen Namensform.
- source_word: מִי הָאֹמֵר
  choice: Wer hat gesagt
  rationale: Artikel plus Partizip bezeichnet denjenigen, der die Äußerung getan hat. Das deutsche Perfekt ist in direkter Rede natürlich und fragt nach der Identität der früheren Widersacher.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: Soll Saul über uns herrschen?
  rationale: Der Imperfekt kann hier als skeptische Frage verstanden werden, die den früheren Widerstand gegen Sauls Königtum aufgreift; „herrschen“ bewahrt die königliche Bedeutung von מלך.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: Gebt diese Männer heraus
  rationale: Der Imperativ verlangt die Auslieferung der betreffenden Männer. Das demonstrative „diese“ identifiziert im Deutschen natürlich die soeben erwähnten Gegner.
- source_word: וּנְמִיתֵם
  choice: damit wir sie töten
  rationale: Der mit וְ verbundene Kohortativ drückt hier die beabsichtigte Folge der Auslieferung aus; der Hifil von מות bedeutet, jemanden zu Tode zu bringen.
theological_decisions:
- issue: Modalität von יִמְלֹךְ in der zitierten früheren Äußerung
  choice: 'als Frage: „Soll Saul über uns herrschen?“'
  alternative: '„Wird Saul über uns herrschen?“ oder als Aussage: „Saul soll über uns herrschen.“'
  rationale: Der Zusammenhang mit der Ablehnung Sauls in 1 Samuel 10,27 spricht deutlich für eine skeptische Frage. Da der hebräische Imperfekt die genaue modale Nuance offenlässt, werden die anderen Möglichkeiten in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. „Gebt … heraus“ vermittelt die geforderte Auslieferung; „damit wir sie töten“ bildet die beabsichtigte Folge natürlich ab. Der Fußnotenmarker steht nach dem gesamten Vers, da er die eingebettete Frage erläutert.
