  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: de
  text: 'Doch Saul sagte: »An diesem Tag soll niemand getötet werden; denn heute hat Jahwe in Israel Rettung bewirkt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch Saul sagte
  rationale: Das Waw führt die Erzählung fort; »doch« gibt zugleich den unmittelbaren Gegensatz zum Tötungsvorschlag im vorigen Vers natürlich wieder.
- source_word: לֹא יוּמַת אִישׁ
  choice: soll niemand getötet werden
  rationale: Die kausativ-passive Form von מות bezeichnet hier eine angeordnete Hinrichtung beziehungsweise Tötung. Das generische אִישׁ wird im modernen Deutschen idiomatisch mit »niemand« wiedergegeben.
- source_word: בַּיּוֹם הַזֶּה
  choice: an diesem Tag
  rationale: Die volle Zeitangabe wird formal und zugleich natürlich wiedergegeben; das folgende הַיּוֹם erscheint davon unterschieden als »heute«.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet Sauls Begründung für die Verschonung ein.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die knappe Zeitangabe wird idiomatisch mit »heute« übersetzt.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: hat Jahwe … Rettung verschafft
  rationale: Die Wendung bezeichnet das Bewirken von Rettung oder Befreiung. »Rettung verschafft« wahrt Gottes handelnde Rolle und passt sowohl zum militärischen Zusammenhang als auch zur weiteren theologischen Bedeutung von תְּשׁוּעָה.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
- source_word: בְּיִשְׂרָאֵל
  choice: Israel
  rationale: Im Deutschen verbindet sich »Rettung verschaffen« natürlich mit dem betroffenen Volk als Dativobjekt. So wird die auf Israel bezogene Rettung klar ausgedrückt, ohne die Präposition unnötig wörtlich nachzubilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. »Jahwe« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von תְּשׁוּעָה im militärischen Zusammenhang
  choice: Rettung
  alternative: Befreiung oder Sieg
  rationale: Der Kontext umfasst einen militärischen Sieg, doch תְּשׁוּעָה bezeichnet umfassender die von Gott bewirkte Rettung. »Rettung« erhält diese Bedeutungsbreite, ohne den Sinn auf den Schlachterfolg zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aussage behält den rechtlich-feierlichen Ton von Sauls Verbot bei, vermeidet jedoch die im Deutschen schwerfällige Formulierung »kein Mann«. Die beiden Zeitangaben des Hebräischen bleiben als »an diesem Tag« und »heute« erkennbar.
