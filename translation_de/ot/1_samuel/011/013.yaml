- from: 'Doch Saul sagte: »An diesem Tag soll niemand getötet werden; denn heute hat Jahwe Israel Rettung verschafft.«'
  to: 'Doch Saul sagte: »An diesem Tag soll niemand getötet werden; denn heute hat Jahwe in Israel Rettung bewirkt.«'
