  source_fidelity: 'Der Entwurf gibt den hebräischen Satzbau und Sinn zuverlässig wieder: Die Ältesten erbitten eine Frist von sieben Tagen, wollen Boten im gesamten israelitischen Gebiet aussenden und kündigen für den Fall ausbleibender Hilfe an, zu Nahasch hinauszugehen. „Lass uns sieben Tage Zeit“ vermittelt הֶרֶף לָנוּ idiomatisch als Bitte um Aufschub. Die offene personale Bedeutung von מוֹשִׁיעַ bleibt gewahrt.'
  naturalness: Modernes, flüssiges Standarddeutsch mit einer dem Verhandlungskontext angemessen knappen, würdigen Redeweise. „Boten“ und „zu dir hinausgehen“ sind in diesem Kontext klar und natürlich.
  terminology: „Jabesch“ ist die im Deutschen etablierte Namensform. „Boten“ trifft מַלְאָכִים im politischen Kontext. „Gebiet Israels“ ist für גְּבוּל יִשְׂרָאֵל angemessen, ohne die mögliche Nuance von Grenzbezirk unzulässig einzuengen. „jemand ..., der uns rettet“ vermeidet eine theologische oder militärische Überinterpretation.
