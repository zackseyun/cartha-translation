  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: de
  text: 'Die Ältesten von Jabesch sagten zu ihm: „Lass uns sieben Tage Zeit, damit wir Boten in das ganze Gebiet Israels schicken können. Wenn dann niemand da ist, der uns rettet, werden wir zu dir hinausgehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: Lass uns … Zeit
  rationale: Das Verb bedeutet hier, von ihnen abzulassen beziehungsweise ihnen Aufschub zu gewähren. Die deutsche Wendung gibt die im Zusammenhang gemeinte Frist natürlich wieder, ohne ein zusätzliches Rechtsverhältnis einzutragen.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage
  rationale: Direkte Wiedergabe der ausdrücklich genannten Frist.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im militärisch-politischen Zusammenhang sind menschliche Abgesandte gemeint, nicht Engel.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: in das ganze Gebiet Israels
  rationale: גְּבוּל kann Grenze oder Gebiet bezeichnen; mit dem Senden von Boten ist hier das gesamte Territorium gemeint.
- source_word: מוֹשִׁיעַ
  choice: jemand …, der uns rettet
  rationale: Bewahrt die offene personale Form des Partizips und legt nicht fest, ob ein einzelner Retter oder eine helfende Streitmacht erwartet wird.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: werden wir zu dir hinausgehen
  rationale: Formnahe Wiedergabe der Kapitulation durch das Verlassen der Stadt und das Hinausgehen zum Belagerer; die implizite Unterwerfung wird nicht erklärend in den Haupttext eingefügt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt knapp und verhandlungsmäßig; die Aussage über mögliche Rettung wird nicht theologisch präzisiert.
