  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: de
  text: Da ging das ganze Volk nach Gilgal, und dort machten sie Saul vor Jahwe in Gilgal zum König. Dort brachten sie vor Jahwe Friedensopfer[a] dar, und Saul und alle Männer Israels freuten sich dort sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gemeinschaftsopfer“ oder „Heilsopfer“. Der hebräische Ausdruck bezeichnet eine Opferart, die mit Frieden, Wohlergehen und einer gemeinsamen Feier verbunden war.
    reason: Lexikalisch mögliche Wiedergaben des Opferbegriffs שְׁלָמִים werden offengehalten.
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: Da ging das ganze Volk
  rationale: Die gewöhnliche Erzählform von הלך bezeichnet hier die Bewegung nach Gilgal; עָם meint das versammelte Volk als Gesamtheit.
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: Gilgal / in Gilgal
  rationale: Der Ortsname wird in der im Deutschen üblichen Form wiedergegeben; seine Wiederholung entspricht dem hebräischen Text.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: sie machten Saul ... zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen. Die Übersetzung fügt keine im Vers nicht erwähnte Salbung hinzu.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier das Handeln in Gottes Gegenwart und bewahrt zugleich den öffentlichen und kultischen Bezug.
- source_word: וַיִּזְבְּחוּ ... זְבָחִים שְׁלָמִים
  choice: sie brachten ... Friedensopfer dar
  rationale: Die deutsche Wendung ist für einen Opferakt natürlich; שְׁלָמִים bezeichnet eine Opferkategorie, die mit Frieden, Wohlergehen und gemeinschaftlichem Feiern verbunden ist.
- source_word: וַיִּשְׂמַח ... עַד מְאֹד
  choice: freuten sich ... sehr
  rationale: Die singularische Verbform steht vor dem nachfolgenden zusammengesetzten Subjekt; im Deutschen wird das Verb entsprechend im Plural wiedergegeben. עַד מְאֹד verstärkt die Freude.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: und alle Männer Israels
  rationale: אַנְשֵׁי ist die Status-constructus-Form von אִישׁ und wird hier seinem ausdrücklich männlichen Wortlaut entsprechend übersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ ist die im Deutschen geläufige Wiedergabe des persönlichen Gottesnamens und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutungsumfang von אַנְשֵׁי יִשְׂרָאֵל
  choice: alle Männer Israels
  alternative: alle Israeliten
  rationale: Die Übersetzung bewahrt die lexikalisch männliche Form des Hebräischen. Die allgemeinere Alternative wäre im Zusammenhang möglich, würde diese Form jedoch einebnen.
- issue: Bezeichnung der שְׁלָמִים-Opfer
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer / Heilsopfer
  rationale: „Friedensopfer“ bewahrt den Bezug des Wortes zu Frieden und Ganzsein; eine Fußnote hält weitere sachlich mögliche Bezeichnungen offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählsyntax. Die Wiederholungen von „Gilgal“ und „dort“ bleiben erhalten, weil sie die Struktur und Hervorhebung des hebräischen Verses prägen.
