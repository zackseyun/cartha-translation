  text: וַ/יֹּאמְר֞וּ לַ/מַּלְאָכִ֣ים הַ/בָּאִ֗ים כֹּ֤ה תֹֽאמְרוּ/ן֙ לְ/אִישׁ֙ יָבֵ֣ישׁ גִּלְעָ֔ד מָחָ֛ר תִּהְיֶֽה לָ/כֶ֥ם תְּשׁוּעָ֖ה ב/חם הַ/שָּׁ֑מֶשׁ וַ/יָּבֹ֣אוּ הַ/מַּלְאָכִ֗ים וַ/יַּגִּ֛ידוּ לְ/אַנְשֵׁ֥י יָבֵ֖ישׁ וַ/יִּשְׂמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: de
  text: 'Sie sagten zu den Boten, die gekommen waren: »So sollt ihr zu den Bewohnern von Jabesch-Gilead[a] sagen: Morgen, wenn die Sonne heiß brennt[b], wird euch Rettung zuteil.« Da kamen die Boten und berichteten es den Männern von Jabesch, und sie freuten sich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu dem Mann von Jabesch-Gilead«; der hebräische Singular ist hier wahrscheinlich kollektiv für die Bewohner der Stadt gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in der Hitze der Sonne«; gemeint ist wahrscheinlich der heiße Teil des Tages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: Boten
  rationale: Im Erzählzusammenhang sind menschliche Überbringer einer Nachricht gemeint, nicht himmlische Wesen.
- source_word: הַבָּאִים
  choice: die gekommen waren
  rationale: Das Partizip bezeichnet hier die Boten, die eingetroffen und nun anwesend waren; die deutsche Vorzeitigkeit gibt den Zusammenhang natürlich wieder.
- source_word: כֹּה תֹאמְרוּן
  choice: So sollt ihr … sagen
  rationale: Diese geläufige deutsche Formel entspricht der hebräischen Einleitung einer direkten Rede und bewahrt deren leicht formellen Ton.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: zu den Bewohnern von Jabesch-Gilead
  rationale: Das formal singularische אִישׁ wird hier kollektiv für die Bewohner der bedrohten Stadt gebraucht. „Bewohner“ gibt diese Funktion verständlich wieder, ohne einen einzelnen Mann anzunehmen.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: wird euch Rettung zuteil
  rationale: תְּשׁוּעָה bezeichnet in diesem militärischen Zusammenhang die Befreiung aus akuter Bedrohung. „Rettung“ bewahrt den Grundsinn, ohne die Aussage auf Sieg oder eine ausschließlich geistliche Bedeutung festzulegen.
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: wenn die Sonne heiß brennt
  rationale: Die Wendung bezeichnet die Zeit der Sonnenhitze, wahrscheinlich den heißen Teil des Tages. Die Wiedergabe erhält das Bild und klingt im Deutschen natürlich.
- source_word: וַיַּגִּידוּ
  choice: berichteten es
  rationale: Das Verb bezeichnet das Übermitteln beziehungsweise Bekanntmachen der zuvor genannten Botschaft; das Pronomen stellt im Deutschen den Bezug klar her.
- source_word: לְאַנְשֵׁי יָבֵישׁ
  choice: den Männern von Jabesch
  rationale: אַנְשֵׁי bedeutet wörtlich „Männer von“ und bezeichnet hier die Männer beziehungsweise Einwohner der Stadt.
- source_word: וַיִּשְׂמָחוּ
  choice: sie freuten sich
  rationale: Die schlichte deutsche Form gibt die Freude über die angekündigte Rettung natürlich und mit der passenden erzählerischen Zurückhaltung wieder.
