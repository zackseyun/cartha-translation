base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: de
  text: 'Dann zog der Ammoniter Nahasch herauf und schlug sein Lager gegen Jabesch-Gilead auf. Alle Männer von Jabesch sagten zu Nahasch: »Schließ mit uns einen Bund[a], dann werden wir dir dienen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Schneide mit uns einen Bund.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog ... herauf
  rationale: עלה bezeichnet hier im erzählenden militärischen Zusammenhang das Heraufziehen; die Formulierung bewahrt die Bewegungsrichtung, ohne eine förmliche Belagerung vorauszusetzen.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: der Ammoniter Nahasch
  rationale: Der Personenname wird als „Nahasch“ transliteriert; das Gentilizium wird in natürlichem deutschen Satzbau als „der Ammoniter“ wiedergegeben.
- source_word: וַיִּחַן עַל
  choice: schlug sein Lager vor ... auf
  rationale: חנה mit עַל beschreibt das militärische Lagern gegen beziehungsweise vor einem Ort. „Vor ... aufschlagen“ ist idiomatisches Deutsch und vermeidet die stärkere, nicht ausdrücklich geforderte Deutung „belagern“.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Jabesch in Gilead
  rationale: Die Ortsbezeichnung wird verständlich als Jabesch in der Landschaft Gilead wiedergegeben; dies entspricht der sachlichen Beziehung der beiden Namenselemente.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: alle Männer von Jabesch
  rationale: אַנְשֵׁי bedeutet ausdrücklich „Männer von“; die geschlechtsspezifische Form bleibt im Kontext einer politischen und militärischen Verhandlung erhalten.
- source_word: כְּרָת לָנוּ בְרִית
  choice: Schließ mit uns einen Bund
  rationale: Das hebräische Idiom lautet wörtlich „einen Bund schneiden“. „Einen Bund schließen“ ist die natürliche deutsche Entsprechung und bewahrt den Begriff בְּרִית.
- source_word: וְנַעַבְדֶךָּ
  choice: dann werden wir dir dienen
  rationale: עבד mit persönlichem Objekt bedeutet direkt „jemandem dienen“. „Dann“ gibt den sachlichen Folgecharakter der mit וְ verbundenen Zusage im Deutschen natürlich wieder.
