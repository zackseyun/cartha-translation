    rationale: Die Präposition על markiert im militärischen Kontext die Ausrichtung gegen den Ort. „Gegen ... sein Lager aufschlagen“ gibt dies wieder, ohne die nicht explizite Bedeutung „belagern“ hinzuzufügen.
