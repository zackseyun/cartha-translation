base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: de
  text: Da kam der Geist Gottes mit Macht über Saul,[a] als er diese Worte hörte, und sein Zorn entbrannte heftig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Geist Gottes überkam Saul mit Macht.“ Das hebräische Verb kann ein plötzliches, kraftvolles Überkommen durch den Geist bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Da brannte seine Nase sehr“ – eine hebräische Redewendung für heftigen Zorn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: kam … mit Macht über
  rationale: Das Verb צלח bezeichnet beim Geist Gottes ein kraftvolles Kommen über einen Menschen beziehungsweise eine wirksame Befähigung. Die Wiedergabe ist natürlich und bewahrt die Stärke des Ausdrucks.
- source_word: רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  rationale: Die Status-constructus-Verbindung bezeichnet hier Gottes Geist und bewahrt das Gewicht der göttlichen Befähigung.
- source_word: עַל
  choice: über
  rationale: In Verbindung mit dem kraftvollen Kommen des Geistes ist „über Saul“ im Deutschen idiomatisch und quellennah.
- source_word: בְשָׁמְעוֹ
  choice: als er … hörte
  rationale: Die Präposition ב mit Infinitivus constructus und Suffix hat hier temporale Bedeutung.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דברים kann auch „Dinge“ oder „Angelegenheiten“ bedeuten; im unmittelbaren Zusammenhang einer übermittelten Rede passt „Worte“ am besten.
- source_word: וַיִּחַר אַפּוֹ
  choice: sein Zorn entbrannte
  rationale: Die deutsche Wendung bewahrt das hebräische Bild des Brennens, ohne den wörtlichen Bezug auf die Nase unverständlich in den Haupttext zu übernehmen.
- source_word: מְאֹד
  choice: heftig
  rationale: Das Adverb verstärkt den Zorn. „Heftig“ klingt mit „entbrannte“ in modernem Deutsch natürlicher als „sehr“ oder „überaus“.
theological_decisions:
- issue: Bedeutung von רוּחַ אֱלֹהִים in der Erzählung
  choice: Gottes Geist kommt mit Macht über Saul und befähigt ihn
  alternative: ein Geist von Gott kommt über Saul
  rationale: Im Zusammenhang mit Sauls Führung und seinem entschlossenen Einsatz zur Rettung bezeichnet die Wendung am ehesten Gottes eigenen Geist. Die Übersetzung vermeidet zugleich Aussagen über Art oder Dauer dieser Befähigung, die über den Text hinausgingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kam … mit Macht über“ vermittelt die kraftvolle Einwirkung des Geistes ohne unnötig archaische Sprache. Die hebräische Zornesmetapher bleibt im Haupttext teilweise erhalten und wird in der Fußnote wörtlich erläutert.
