  terminology: „Samuel“, „Volk“ und „Gilgal“ folgen dem üblichen deutschen biblischen Sprachgebrauch. „Königtum“ ist hier eine tragfähige Wiedergabe von מְלוּכָה und vermeidet die räumliche Einengung von „Königreich“. Die Fußnote nennt sachgerecht „bestätigen“ und „Königsherrschaft“ als mögliche Nuancierungen.
