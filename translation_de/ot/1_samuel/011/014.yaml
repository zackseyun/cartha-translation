id: 1SA.11.14
reference: 1 Samuel 11:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: de
  text: 'Da sagte Samuel zum Volk: „Kommt, lasst uns nach Gilgal gehen und dort das Königtum erneuern[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bestätigen“; oder: „die Königsherrschaft erneuern“.'
    reason: Das hebräische Verb kann in diesem Zusammenhang eine Erneuerung oder Bekräftigung bezeichnen; zudem kann מְלוּכָה sowohl das Königtum als auch die Königsherrschaft meinen.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: אֶל הָעָם
  choice: zum Volk
  rationale: עָם bezeichnet hier am naheliegendsten das versammelte Volk Israel; „Volk“ ist im Deutschen präzise und idiomatisch.
- source_word: לְכוּ
  choice: Kommt
  rationale: Der Imperativ von הלך bildet mit dem folgenden Kohortativ eine Aufforderung zu gemeinsamem Handeln. „Kommt, lasst uns gehen“ ist im Deutschen natürlicher als das wörtliche „Geht, und lasst uns gehen“.
- source_word: וְנֵלְכָה
  choice: lasst uns … gehen
  rationale: Der Kohortativ der ersten Person Plural drückt die Aufforderung zu einer gemeinsamen Handlung aus.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Übliche deutsche Wiedergabe des Ortsnamens; der hebräische Artikel wird bei Eigennamen im Deutschen nicht eigens wiedergegeben.
- source_word: וּנְחַדֵּשׁ
  choice: erneuern
  rationale: Das Piel von חדש bedeutet „erneuern“ beziehungsweise „wieder neu machen“. Die Wiedergabe bewahrt die Offenheit zwischen Erneuerung und öffentlicher Bestätigung.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf Gilgal und wird idiomatisch mit „dort“ wiedergegeben.
- source_word: הַמְּלוּכָה
  choice: das Königtum
  rationale: מְלוּכָה kann die Königsherrschaft, das Königsamt oder das Königreich bezeichnen. „Königtum“ passt hier zur erneuten Anerkennung von Sauls Herrschaft, ohne den Ausdruck auf das Staatsgebiet zu verengen.
theological_decisions:
- issue: Bedeutung der Erneuerung des Königtums
  choice: Die Formulierung „das Königtum erneuern“ bleibt nahe am Hebräischen und lässt eine öffentliche Erneuerung beziehungsweise Bestätigung von Sauls Königsherrschaft erkennen.
  alternative: „Das Königtum bestätigen“ oder „das Königreich erneuern“
  rationale: Nach Sauls Rettung von Jabesch in Gilead findet seine Herrschaft neue öffentliche Zustimmung. Der Vers benennt jedoch kein bestimmtes Krönungsritual und lässt offen, ob vor allem Sauls Amt oder die Königsherrschaft als Institution gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Einladung „Kommt, lasst uns …“ gibt die hebräische Verbindung aus Imperativ und Kohortativ natürlich wieder. Die zentrale Mehrdeutigkeit von „erneuern“ und „Königtum“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
