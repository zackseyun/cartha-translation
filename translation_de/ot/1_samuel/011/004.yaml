  naturalness: „Gibea-Saul“ ist im modernen Deutschen keine geläufige Ortsbezeichnung, und „vor den Ohren des Volkes“ wirkt als wörtlicher Hebraismus unnötig steif. „Gibea Sauls“ und „vor dem Volk“ sind idiomatisch und bewahren den Sinn.
  terminology: „Boten“ ist kontextgerecht. „Gibea Sauls“ gibt die Zugehörigkeitsverbindung des Ortsnamens verständlich wieder. Die kollektive Reaktion wird mit „alle Leute“ natürlich und quellennah ausgedrückt.
