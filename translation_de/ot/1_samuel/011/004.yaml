  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: de
  text: Als die Boten nach Gibea Sauls kamen und diese Worte vor dem Volk aussprachen, erhoben alle Leute ihre Stimmen und weinten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: die Boten
  rationale: מַלְאָךְ bezeichnet hier menschliche Überbringer einer Nachricht; „Boten“ ist im Kontext eindeutig und natürlich.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea-Saul
  rationale: Die deutsche Namensform gibt die hebräische Konstruktverbindung knapp wieder und unterscheidet diesen Ort von anderen Orten namens Gibea.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: sprachen diese Worte aus
  rationale: Die Formulierung bewahrt das konkrete hebräische „die Worte reden“ und klingt mit „aussprechen“ im Deutschen natürlich.
- source_word: בְּאָזְנֵי הָעָם
  choice: vor den Ohren des Volkes
  rationale: Die Wiedergabe erhält das anschauliche hebräische Höridiom und bezeichnet eine öffentliche Mitteilung in Gegenwart des Volkes.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  choice: erhob ... seine Stimme
  rationale: Die geläufige deutsche Wendung entspricht dem hebräischen Idiom und wahrt den kollektiven Singular „seine Stimme“ beim singularischen Kollektiv „Volk“.
- source_word: וַיִּבְכּוּ
  choice: und weinte
  rationale: בכה bezeichnet Weinen aus Trauer oder Bestürzung; der Singular stimmt im Deutschen mit „das ganze Volk“ überein.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: Dies ist die natürliche deutsche Wiedergabe der Gesamtheit, die durch כָל mit dem Kollektivnomen ausgedrückt wird.
