- from: Als die Boten nach Gibea-Saul kamen und diese Worte vor den Ohren des Volkes aussprachen, erhob das ganze Volk seine Stimme und weinte.[a]
  to: Als die Boten nach Gibea Sauls kamen und diese Worte vor dem Volk aussprachen, erhoben alle Leute ihre Stimmen und weinten.
  rationale: Die Revision ersetzt eine unübliche Namensbildung und einen harten Hebraismus durch natürliches Deutsch. Zugleich gibt „alle Leute erhoben ihre Stimmen und weinten“ die pluralischen Formen des hebräischen Satzes transparent wieder; die missverständliche Fußnote entfällt.
