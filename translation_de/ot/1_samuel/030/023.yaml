  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: de
  text: 'David aber sagte: »So dürft ihr nicht handeln, meine Brüder, mit dem, was Jahwe uns gegeben hat. Er hat uns bewahrt und die Plündererschar, die gegen uns heranzog, in unsere Hand gegeben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: So dürft ihr nicht handeln
  rationale: Gibt das direkte Verbot an eine Mehrzahl von Angesprochenen in natürlichem, nachdrücklichem Deutsch wieder.
- source_word: אֶחָי
  choice: meine Brüder
  rationale: Bewahrt die wörtliche brüderliche Anrede Davids an seine Männer.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: mit dem, was Jahwe uns gegeben hat
  rationale: Die knappe hebräische Konstruktion führt den Gegenstand des beanstandeten Handelns ein; „mit dem“ passt zum Zusammenhang der Beuteverteilung, ohne die Syntax unnötig auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen gebräuchliche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: Er hat uns bewahrt
  rationale: שׁמר bezeichnet hier Gottes schützendes Bewahren während des Kampfes.
- source_word: הַגְּדוּד
  choice: die Plündererschar
  rationale: Bezeichnet in diesem Zusammenhang den feindlichen Verband, der als plündernde Überfalltruppe auftrat.
- source_word: הַבָּא עָלֵינוּ
  choice: die gegen uns heranzog
  rationale: Bewahrt sowohl die Bewegung als auch die feindliche Ausrichtung der Partizipialkonstruktion.
- source_word: בְּיָדֵנוּ
  choice: in unsere Hand
  rationale: Erhält das hebräische Bild für das Ausliefern in die Gewalt beziehungsweise Verfügungsgewalt einer Personengruppe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Transkription bewahrt den persönlichen Gottesnamen und vermeidet die Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt bestimmt, aber nicht unnötig schroff. Die hebräischen Bilder „bewahrt“ und „in unsere Hand gegeben“ werden beibehalten; die syntaktische Spannung der Wendung אֵת אֲשֶׁר wird mit dem natürlichen, dennoch relativ formnahen „mit dem, was“ wiedergegeben.
