  source_fidelity: 'Der Entwurf gibt die hebräische Aussage vollständig und sachgerecht wieder: das Verbot, die Anrede „meine Brüder“, die komprimierte Wendung zum von Jahwe Gegebenen, das Bewahren, die Übergabe des feindlichen Verbands sowie das Bild „in unsere Hand“ sind erhalten. Die Perfektformen sind in deutscher direkter Rede für die rückblickend geschilderten Ereignisse angemessen.'
  naturalness: Modernes, würdiges Standarddeutsch. „So dürft ihr nicht handeln“ und „die gegen uns heranzog“ sind klar und idiomatisch. „In unsere Hand gegeben“ ist bewusst bildhaft und im biblischen Register verständlich; eine Glättung zu „in unsere Gewalt“ wäre möglich, aber nicht erforderlich.
  terminology: „Jahwe“ entspricht der festgelegten Wiedergabe von יהוה und ist im Deutschen gebräuchlich. „Meine Brüder“ wahrt die männlich-fraternale Anrede; „Plündererschar“ trifft den Kontext eines feindlichen Raidverbands, ohne unnötig zu spezifizieren.
