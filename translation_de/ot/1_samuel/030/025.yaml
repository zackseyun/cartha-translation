  yaml_path: translation/ot/1_samuel/030/025.yaml
  text: 'And it was so from that day onward: he made it a statute and an ordinance for Israel to this day[a].'
translation:
  language: de
  text: 'Von jenem Tag an war es so: David machte dies für Israel zu einer Satzung und zu einer Rechtsbestimmung bis auf den heutigen Tag.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „David setzte dies für Israel als Satzung und Rechtsregel fest.“'
    reason: 'Lexikalische Alternative: שׂים kann „festsetzen“ bedeuten; מִשְׁפָּט kann in diesem normativen Zusammenhang auch mit „Rechtsregel“ wiedergegeben werden.'
lexical_decisions:
- source_word: וַיְהִי
  choice: war es so
  rationale: Die Wendung bezeichnet hier den eingetretenen und fortgeltenden Zustand. „War es so“ bleibt nah am hebräischen Erzählstil, während der folgende Zeitausdruck die Dauer erkennen lässt.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: von jenem Tag an
  rationale: Die hebräische Zeitangabe bezeichnet den Ausgangspunkt einer fortdauernden Regelung. „Von jenem Tag an“ ist im heutigen Standarddeutsch natürlich und präzise.
- source_word: וַיְשִׂמֶהָ
  choice: David machte dies
  rationale: שׂים bedeutet „setzen, festlegen, machen“. Der feminine Rückverweis bezieht sich auf die zuvor beschriebene Regelung; „dies“ gibt ihn idiomatisch wieder. David wird als Subjekt aus dem unmittelbaren Zusammenhang ausdrücklich genannt, um im Deutschen Klarheit zu schaffen.
- source_word: לְחֹק
  choice: zur Satzung
  rationale: חֹק bezeichnet eine festgesetzte, verbindliche Bestimmung. „Satzung“ wahrt den formellen und normativen Charakter.
- source_word: וּלְמִשְׁפָּט
  choice: zur Rechtsordnung
  rationale: מִשְׁפָּט kann Urteil, Recht, Rechtsentscheid oder verbindliche Rechtsnorm bedeuten. Im Parallelismus mit חֹק bezeichnet es hier am ehesten eine rechtlich bindende Ordnung.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Die Präposition ל kennzeichnet Israel als den Geltungsbereich beziehungsweise die Gemeinschaft, für die die Regelung bestimmt ist.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Die feste Wendung besagt, dass die Regelung aus der Perspektive des Erzählers weiterhin bestand. Die gewählte Formulierung ist eine geläufige, würdige deutsche Entsprechung.
