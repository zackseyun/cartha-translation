source:
  edition: WLC
  text: אֲנַ֡חְנוּ פָּשַׁ֜טְנוּ נֶ֧גֶב הַ/כְּרֵתִ֛י וְ/עַל אֲשֶׁ֥ר לִֽ/יהוּדָ֖ה וְ/עַל נֶ֣גֶב כָּלֵ֑ב וְ/אֶת צִקְלַ֖ג שָׂרַ֥פְנוּ בָ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: de
  text: Wir haben das Negevgebiet der Keretiter[a] überfallen, das Gebiet, das zu Juda gehört, und das Negevgebiet Kalebs; und Ziklag haben wir niedergebrannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Kreter.'
    reason: Namensvariante; die hebräische Volksbezeichnung wird im Deutschen auch mit „Kreter“ wiedergegeben.
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: wir haben … überfallen
  rationale: Im militärischen Zusammenhang bezeichnet das Verb einen plündernden Einfall. „Überfallen“ ist im Deutschen knapp und natürlich.
- source_word: נֶגֶב
  choice: Negevgebiet
  rationale: Gemeint ist hier wahrscheinlich die südliche Trockenregion als geografisches Gebiet, nicht bloß die Himmelsrichtung. „Negevgebiet“ verbindet den Eigennamen mit einer für heutige Leser verständlichen Gebietsangabe.
- source_word: הַכְּרֵתִי
  choice: der Kereter
  rationale: Das Wort bezeichnet eine Volksgruppe. „Kereter“ ist die in deutschen Bibelübersetzungen verbreitete, dem hebräischen Namen entsprechende Form.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: das Gebiet, das zu Juda gehört
  rationale: Die Präposition führt ein weiteres Ziel des Überfalls an; die Relativkonstruktion bezeichnet das zu Juda gehörende Gebiet. Die Wiedergabe ist natürlich und bewahrt das Besitzverhältnis.
- source_word: נֶגֶב כָּלֵב
  choice: das Negevgebiet Kalebs
  rationale: Die Wendung bezeichnet wohl den südlichen Bezirk, der mit Kaleb beziehungsweise dessen Sippe verbunden war. Die deutsche Genitivkonstruktion erhält diese Zuordnung.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: haben wir niedergebrannt
  rationale: Das Deutsche drückt das vollständige Verbrennen einer Ortschaft idiomatisch mit „niederbrennen“ aus. Das ausdrücklich genannte Feuer ist dabei semantisch enthalten; „mit Feuer verbrannt“ wäre unnötig redundant.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Übliche deutsche Umschrift des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Aufzählung der drei überfallenen Gebiete bleibt erhalten; die Voranstellung von „Ziklag“ im letzten Satzteil gibt dem Ortsnamen das Gewicht der hebräischen Konstruktion.
