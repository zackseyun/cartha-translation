  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: de
  text: David geriet in große Bedrängnis, denn das Volk sprach davon, ihn zu steinigen, weil alle tief verbittert[a] waren, jeder wegen seiner Söhne und Töchter. Doch David stärkte sich in Jahwe, seinem Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Seele des ganzen Volkes war bitter.« Das heißt: Alle waren zutiefst verbittert.'
    reason: lexikalische Alternative und Erklärung des hebräischen Idioms
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: David geriet in große Bedrängnis
  rationale: Die unpersönliche Konstruktion mit לְדָוִד bezeichnet eine äußerst bedrängende Lage für David; die deutsche Formulierung ist natürlich und gibt die Verstärkung durch מְאֹד wieder.
- source_word: הָעָם
  choice: die Leute / das ganze Volk
  rationale: Der Kontext meint Davids Männer, doch der hebräische Ausdruck lautet »Volk«. »Leute« klingt beim ersten Vorkommen natürlich, während »das ganze Volk« den kollektiven Nachdruck von כָּל הָעָם bewahrt.
- source_word: לְסָקְלוֹ
  choice: davon, ihn zu steinigen
  rationale: Der Infinitiv nach אָמְרוּ bezeichnet die erwogene beziehungsweise besprochene Handlung, ohne bereits ihre Ausführung auszudrücken.
- source_word: מָרָה נֶפֶשׁ
  choice: war tief verbittert
  rationale: Die wörtliche Wendung »die Seele war bitter« beschreibt tiefe Verbitterung. Eine idiomatische Wiedergabe im Deutschen vermittelt den emotionalen Gehalt, während die Fußnote das hebräische Bild festhält.
- source_word: אִישׁ
  choice: jeder
  rationale: Das distributive אִישׁ bezieht sich auf jeden einzelnen Mann der Gruppe. Im Deutschen ist »jeder« im gegebenen Zusammenhang präzise und natürlicher als »jeder Mann«.
- source_word: עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: wegen seiner Söhne und Töchter
  rationale: עַל bezeichnet hier den Anlass der Verbitterung beziehungsweise Trauer; »wegen« gibt diese Beziehung idiomatisch wieder.
- source_word: וַיִּתְחַזֵּק
  choice: stärkte sich
  rationale: Der Hitpael hat reflexive beziehungsweise mediale Bedeutung und stellt Davids aktive Hinwendung zur Kraftquelle heraus, ohne die Art näher auszudeuten.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: in Jahwe, seinem Gott
  rationale: Die Präposition wird mit »in« bewahrt; der Gottesname יהוה wird als »Jahwe« wiedergegeben, und אֱלֹהָיו als »seinem Gott«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« gibt den offenbarten Bundesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Davids Stärkung in Gott
  choice: David stärkte sich in Jahwe, seinem Gott
  alternative: David fasste neuen Mut durch Jahwe, seinen Gott
  rationale: Die gewählte Form bewahrt sowohl die reflexive Gestalt des Verbs als auch die Präposition בְּ und lässt offen, auf welche konkrete Weise David Kraft gewann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache wird dort idiomatisch wiedergegeben, wo eine streng wörtliche Form im Deutschen unnatürlich wäre; die Fußnote dokumentiert das zugrunde liegende Bild. Der Kontrast zwischen der Bedrohung durch das Volk und Davids Stärkung in Jahwe bleibt deutlich.
