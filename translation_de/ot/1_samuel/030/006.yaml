  terminology: „Jahwe“ ist eine angemessene Wiedergabe von יהוה. „Söhne und Töchter“, „steinigen“ und die reflexive Wendung „stärkte sich“ sind quellennah. Die Fußnote bewahrt die hebräische Bildformulierung „die Seele ... war bitter“, ohne sie im Haupttext unidiomatisch nachzubilden.
