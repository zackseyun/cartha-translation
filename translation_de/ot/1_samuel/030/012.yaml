base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: de
  text: Sie gaben ihm ein Stück Feigenkuchen und zwei Rosinenkuchen[a]. Er aß, und sein Geist kehrte zu ihm zurück[b]; denn er hatte drei Tage und drei Nächte lang kein Brot gegessen und kein Wasser getrunken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „zwei Bündel Rosinen“. Die genaue Form der zwei Einheiten ist unsicher; bei Feigen- und Rosinenvorräten handelte es sich häufig um gepresste Kuchen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „er kam wieder zu Kräften“; wörtlich: „sein Geist kehrte zu ihm zurück“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: ein Stück Pressfeigenkuchen
  rationale: פֶלַח bezeichnet ein Stück oder einen Abschnitt; דְּבֵלָה ist eine zu einem Kuchen gepresste Feigenmasse. „Pressfeigenkuchen“ gibt das antike Nahrungsmittel knapp und genauer wieder als bloß „Feigenkuchen“.
- source_word: שְׁנֵי צִמֻּקִים
  choice: zwei Rosinenkuchen
  rationale: צִמֻּקִים bezeichnet getrocknete beziehungsweise zusammengeschrumpfte Trauben. Da zwei zählbare Einheiten genannt werden, liegt eine Wiedergabe als gepresste Rosinenkuchen nahe; die genaue Form bleibt jedoch unsicher und wird in der Fußnote offengehalten.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: sein Lebensgeist kehrte zu ihm zurück
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom zurückkehrenden רוּחַ und macht im Deutschen zugleich deutlich, dass hier Belebung und wiederkehrende Lebenskraft gemeint sind.
- source_word: לֶחֶם
  choice: Brot
  rationale: Das konkrete Wort „Brot“ entspricht לֶחֶם und bildet mit „Wasser“ das natürliche Begriffspaar des hebräischen Textes.
- source_word: שָׁתָה מַיִם
  choice: Wasser getrunken
  rationale: Die konkrete Angabe des hebräischen Textes wird ohne Verallgemeinerung beibehalten.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: drei Tage und drei Nächte lang
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe; „lang“ stellt im Deutschen den Zeitraum klar heraus.
theological_decisions:
- issue: Bedeutung von רוּחַ in der Wendung וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: Lebensgeist
  alternative: Kraft; Atem; er kam wieder zu Kräften
  rationale: „Lebensgeist“ erhält die Bildsprache und die semantische Weite von רוּחַ, ohne die Wendung ausschließlich körperlich oder ausdrücklich metaphysisch zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze folgen dem erzählerischen Rhythmus des Hebräischen. Seltene, aber verständliche Sachbegriffe werden dort verwendet, wo sie die antike Speise genauer bezeichnen; echte lexikalische Unsicherheit wird in den Fußnoten bewahrt.
