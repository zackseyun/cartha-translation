base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: de
  text: David schlug sie von der Dämmerung bis zum Abend des nächsten Tages[a] nieder. Keiner von ihnen entkam, außer vierhundert jungen Männern, die auf den Kamelen ritten und flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Morgendämmerung an“; das hebräische Wort kann die Dämmerung am Morgen oder am Abend bezeichnen. Manche verstehen es hier als Morgendämmerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: schlug sie … nieder
  rationale: נכה bezeichnet im militärischen Zusammenhang gewaltsames Schlagen beziehungsweise Besiegen. „Schlug sie nieder“ bewahrt die Stärke des Verbs und ist im heutigen Deutsch natürlich.
- source_word: מֵהַנֶּשֶׁף
  choice: von der Dämmerung
  rationale: נשף kann die Dämmerung am Abend oder am Morgen bezeichnen. „Dämmerung“ erhält diese echte lexikalische Mehrdeutigkeit im Haupttext.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: bis zum Abend des nächsten Tages
  rationale: Die Formulierung gibt den Endpunkt am Abend des folgenden Tages idiomatisch und quellennah wieder.
- source_word: וְלֹא נִמְלַט מֵהֶם אִישׁ
  choice: Keiner von ihnen entkam
  rationale: Der distributiv gebrauchte Singular אִישׁ drückt aus, dass kein einziger Mann entkam. „Keiner von ihnen“ vermittelt diese Gesamtaussage in natürlichem Deutsch.
- source_word: כִּי אִם
  choice: außer
  rationale: Die Wendung führt eine Ausnahme von der unmittelbar vorausgehenden Gesamtaussage ein.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: vierhundert jungen Männern
  rationale: נַעַר kann Junge, junger Mann oder Diener bedeuten. Bei kampffähigen Kamelreitern passt „junge Männer“ am besten, ohne Minderjährigkeit oder einen Dienerstatus festzulegen.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: auf die Kamele stiegen
  rationale: רכב mit עַל kann das Aufsteigen beziehungsweise Reiten auf Tieren bezeichnen. In der Fluchtszene ist „auf die Kamele stiegen“ idiomatisch und macht den Beginn ihrer Flucht anschaulich, ohne zusätzliche Sachinformation einzuführen.
- source_word: וַיָּנֻסוּ
  choice: und flohen
  rationale: נוס bedeutet „fliehen“. „Flohen“ unterscheidet dieses Verb passend vom vorausgehenden נמלט („entkommen“).
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Mehrdeutigkeit von נֶשֶׁף bleibt durch „Dämmerung“ im Haupttext erhalten und wird in der Fußnote erläutert; archaische oder konfessionell geprägte Formulierungen wurden vermieden.
