source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל צִ֣קְלַ֔ג וַ/יְשַׁלַּ֧ח מֵֽ/הַ/שָּׁלָ֛ל לְ/זִקְנֵ֥י יְהוּדָ֖ה לְ/רֵעֵ֣/הוּ לֵ/אמֹ֑ר הִנֵּ֤ה לָ/כֶם֙ בְּרָכָ֔ה מִ/שְּׁלַ֖ל אֹיְבֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: de
  text: 'Als David nach Ziklag kam, schickte er einen Teil der Beute an die Ältesten von Juda, seine Freunde, und ließ ihnen sagen: „Seht, hier ist ein Geschenk[a] für euch aus der Beute der Feinde Jahwes.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Segen für euch“. Das hebräische Wort kann „Segen“ bedeuten, bezeichnet hier aber eine materielle Gabe aus der Beute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Als David … kam
  rationale: Die mit וַ fortgeführte Erzählung verbindet Davids Ankunft zeitlich mit dem anschließenden Versenden der Beute. Die deutsche Als-Konstruktion gibt diese Abfolge natürlich wieder.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Der Ortsname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: schickte er einen Teil der Beute
  rationale: מִן bezeichnet hier eine Teilmenge der gesamten Beute. „Beute“ ist im heutigen Deutsch natürlich und bewahrt den militärischen Zusammenhang.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: an die Ältesten von Juda
  rationale: „Älteste“ bezeichnet die anerkannten führenden Männer Judas; die Präposition wird idiomatisch mit „an“ wiedergegeben.
- source_word: לְרֵעֵהוּ
  choice: seine Freunde
  rationale: רֵעַ kann Freund, Gefährte oder Nächster bedeuten. Im Zusammenhang sind mit David verbundene Älteste gemeint; „seine Freunde“ bewahrt die relationale Aussage, ohne eine amtliche Bündnisbezeichnung einzuführen.
- source_word: לֵאמֹר
  choice: und ließ ihnen sagen
  rationale: Die Form leitet die folgende Botschaft ein. Diese Wiedergabe ist im Deutschen bei einer übersandten Gabe natürlicher als ein bloßes „sagend“.
- source_word: הִנֵּה לָכֶם
  choice: Seht, hier ist … für euch
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die überreichte Gabe. „Seht“ erhält diese hinweisende Kraft in würdigem, verständlichem Deutsch.
- source_word: בְּרָכָה
  choice: ein Geschenk
  rationale: Das Wort bedeutet grundsätzlich „Segen“, bezeichnet hier jedoch konkret eine Gabe aus der Beute. „Geschenk“ macht den unmittelbaren Sachbezug verständlich; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: מִשְּׁלַל
  choice: aus der Beute
  rationale: Die Wiederholung von שָׁלָל wird entsprechend der ersten Stelle konsequent mit „Beute“ wiedergegeben.
- source_word: אֹיְבֵי יְהוָה
  choice: die Feinde Jahwes
  rationale: Die Constructusverbindung wird als Genitivverbindung wiedergegeben und bewahrt Davids theologische Einordnung der Gegner.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der gebräuchlichen deutschen Transkription „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen; „der HERR“ wäre eine traditionelle Ersetzung durch einen Titel.
- issue: Konkrete oder wörtliche Wiedergabe von בְּרָכָה
  choice: Geschenk im Haupttext
  alternative: Segen
  rationale: Der unmittelbare Zusammenhang handelt von einem materiellen Anteil an der erbeuteten Habe. Dennoch bleibt die Bedeutung „Segen“ lexikalisch und theologisch hörbar und wird deshalb in einer Fußnote angegeben, statt stillschweigend ausgeschlossen zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Beute“ und „Seht“ vermeiden sowohl unnötig altertümliche Formulierungen als auch einen zu umgangssprachlichen Ton. Die Satzfügung bleibt nah an der hebräischen Erzählfolge, ohne im Deutschen schwerfällig zu wirken.
