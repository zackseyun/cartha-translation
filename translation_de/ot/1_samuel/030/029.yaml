  text: וְ/לַ/אֲשֶׁ֣ר בְּ/רָכָ֗ל וְ/לַֽ/אֲשֶׁר֙ בְּ/עָרֵ֣י הַ/יְּרַחְמְאֵלִ֔י וְ/לַ/אֲשֶׁ֖ר בְּ/עָרֵ֥י הַ/קֵּינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/029.yaml
  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: de
  text: und an diejenigen in Rakal und an diejenigen in den Städten der Jerachmeëliter und an diejenigen in den Städten der Keniter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: und an die
  rationale: Die wiederholte Verbindung aus ו, ל und Relativpartikel bezeichnet in dieser Liste die Empfänger der Gaben. „Und an die“ gibt den Dativcharakter knapp und natürlich wieder.
- source_word: בְּרָכָל
  choice: in Rakal
  rationale: Der Ortsname wird nach den hebräischen Konsonanten als „Rakal“ transkribiert.
- source_word: בְּעָרֵי
  choice: in den Städten von / in den Städten der
  rationale: עִיר kann je nach Größe „Stadt“ oder „Ortschaft“ bedeuten. „Städte“ ist hier eine natürliche, nicht übermäßig spezifizierende Wiedergabe; vor den Volksnamen wird der Genitiv idiomatisch mit dem bestimmten Artikel gebildet.
- source_word: הַיְּרַחְמְאֵלִי
  choice: der Jerachmeëliter
  rationale: Das morphologisch singularische Gentilizium wird nach „Städte“ kollektiv verstanden und im Deutschen als pluralischer Volksname wiedergegeben. Die Schreibung mit Trema macht die getrennte Aussprache von e und ë sichtbar.
- source_word: הַקֵּינִי
  choice: der Keniter
  rationale: Das singularische Gentilizium bezeichnet hier kollektiv die Volksgruppe; im Deutschen steht daher der pluralische Volksname „Keniter“.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Standardstil. Die dreifache parallele Struktur des Hebräischen bleibt erhalten. Da „Rakal“ im Deutschen keine verbreitete konkurrierende Schreibtradition erfordert, ist keine Fußnote nötig.
