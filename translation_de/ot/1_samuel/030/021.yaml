  text: וַ/יָּבֹ֣א דָוִ֗ד אֶל מָאתַ֨יִם הָ/אֲנָשִׁ֜ים אֲשֶֽׁר פִּגְּר֣וּ מִ/לֶּ֣כֶת אַחֲרֵ֣י דָוִ֗ד וַ/יֹּֽשִׁיבֻ/ם֙ בְּ/נַ֣חַל הַ/בְּשׂ֔וֹר וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את דָּוִ֔ד וְ/לִ/קְרַ֖את הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וַ/יִּגַּ֤שׁ דָּוִד֙ אֶת הָ/עָ֔ם וַ/יִּשְׁאַ֥ל לָ/הֶ֖ם לְ/שָׁלֽוֹם־־׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: de
  text: David kam zu den zweihundert Männern, die zu erschöpft gewesen waren, um David weiter zu folgen,[a] und die man am Bach Besor zurückgelassen hatte. Sie gingen hinaus, um David und den Leuten, die bei ihm waren, entgegenzugehen. David trat zu den Männern und fragte sie, wie es ihnen ging.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die nicht mehr imstande gewesen waren, David weiter zu folgen“ oder „die zurückgeblieben waren“. Das hebräische Verb bezeichnet hier Ermattung beziehungsweise die Unfähigkeit weiterzugehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „fragte sie nach ihrem Frieden“, das heißt nach ihrem Wohlergehen.'
    reason: hebrew_idiom
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  choice: die zu erschöpft gewesen waren, um David weiter zu folgen
  rationale: פּגר bezeichnet hier, dass die Männer ermattet beziehungsweise nicht mehr imstande waren weiterzugehen. „Weiter zu folgen“ gibt die Verbindung mit מן und אַחֲרֵי im Deutschen natürlich wieder.
- source_word: וַיֹּשִׁיבֻם
  choice: die man … zurückgelassen hatte
  rationale: Der Hifil von ישׁב kann bedeuten, jemanden an einem Ort bleiben zu lassen. Das unpersönliche „man“ bildet das nicht ausdrücklich genannte pluralische Subjekt ab, ohne David allein als Handelnden festzulegen.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: am Bach Besor
  rationale: נחל kann einen Bach, ein Wadi oder ein Bachtal bezeichnen. „Bach Besor“ ist verständlich und als Ortsbezeichnung angemessen.
- source_word: וַיֵּצְאוּ לִקְרַאת
  choice: sie zogen … entgegen
  rationale: Die Wendung bezeichnet das Hinausgehen, um jemandem zu begegnen. „Entgegenziehen“ bewahrt sowohl die Bewegung als auch die Begegnungsabsicht.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: den Leuten, die bei ihm waren
  rationale: עָם meint hier Davids begleitende Gruppe. „Leute“ ist im Kontext natürlich und vermeidet eine unnötige Verengung auf eine formell organisierte Truppe.
- source_word: וַיִּגַּשׁ דָּוִד אֶת הָעָם
  choice: David trat zu den Männern
  rationale: נגשׁ bedeutet „sich nähern/herantreten“. „Trat zu“ hält diese Handlung von der anschließenden Erkundigung nach ihrem Befinden getrennt; „Männer“ macht den kontextuellen Bezug des Kollektivworts העם deutlich.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: fragte sie, wie es ihnen ging
  rationale: Die hebräische Wendung bedeutet, sich nach dem Frieden beziehungsweise Wohlergehen einer Person zu erkundigen. Die gewählte Formulierung ist idiomatisches modernes Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Das wiederholte „David“ bleibt wie im Hebräischen erhalten. Die nicht ausdrücklich benannte handelnde Gruppe bei וַיֹּשִׁיבֻם wird mit unpersönlichem „man“ wiedergegeben.
