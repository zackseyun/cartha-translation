  naturalness: »Alles Kleinvieh und alle Rinder« ist modernes, verständliches Standarddeutsch und bewahrt die im Hebräischen vorhandene Unterscheidung. »Vor jenem Vieh her« ist im erzählerischen Register natürlich genug und vermeidet eine unnötige Festlegung.
  terminology: »Beute« trifft שָׁלָל angemessen. Die Fußnote kann mit »Plündergut« eine mögliche lexikalische Alternative bieten, ohne den Haupttext zu belasten. Die Namenform »David« und der possessive Genitiv »Davids« sind korrekt.
