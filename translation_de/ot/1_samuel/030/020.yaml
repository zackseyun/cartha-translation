base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: de
  text: 'David nahm alles Kleinvieh und alle Rinder. Sie trieben sie vor jenem Vieh her[a] und sagten: »Das ist Davids Beute.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor jenem Vieh her«. Wahrscheinlich wurden die gerade erbeuteten Tiere vor dem zuvor zurückgewonnenen Vieh hergetrieben.'
    reason: textual_and_contextual_clarification
  - marker: b
    text: 'Oder: »Das ist Davids Plündergut.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet in dieser fortlaufenden Erzählung gewöhnlich »nehmen«; stärker wertende Wiedergaben wie »beschlagnahmen« wären unnötig interpretierend.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: die Schafe und Rinder
  rationale: צאן bezeichnet Kleinvieh, besonders Schafe und Ziegen, בקר dagegen Rinder. Die konkrete Formulierung ist im Deutschen natürlicher als »Kleinvieh und Großvieh«, wobei »Schafe« hier wie häufig die Herden zusammenfassend bezeichnet.
- source_word: נָהֲגוּ
  choice: sie trieben
  rationale: נהג bezeichnet hier das Vorantreiben von Tieren und wird daher sachgerecht mit »treiben« wiedergegeben.
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: vor dem übrigen Vieh her
  rationale: לִפְנֵי gibt die räumliche Stellung »vor« an; הַמִּקְנֶה הַהוּא lautet wörtlich »jenem Vieh«. Im Zusammenhang ist damit wahrscheinlich das bereits zurückgewonnene Vieh im Unterschied zu den zusätzlich erbeuteten Tieren gemeint.
- source_word: וַיֹּאמְרוּ
  choice: und sagten
  rationale: Die Pluralform bleibt erhalten. Das Hebräische nennt die Sprecher nicht ausdrücklich; der Zusammenhang weist auf Davids Leute beziehungsweise die anwesenden Menschen.
- source_word: זֶה שְׁלַל דָּוִד
  choice: Das ist Davids Beute
  rationale: Der Singular זֶה wird mit »Das ist« bewahrt. שְׁלַל bezeichnet im Krieg oder bei einem Überfall erlangte Beute; der Genitiv wird natürlich als »Davids« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. »Schafe und Rinder« ist konkret und idiomatisch; die Fußnote bewahrt die wörtlichere, im Deutschen jedoch weniger natürliche Form des Demonstrativausdrucks. Die nicht ausdrücklich genannten Sprecher werden nicht näher bestimmt.
