  verdict: revise
  source_fidelity: Die Satzstruktur, die kausale Begründung, der auffällige Wechsel von „mit mir“ zu „wir“ sowie die Ausnahme für Frau und Kinder sind im Wesentlichen zutreffend wiedergegeben. „Gewissenlos“ ist für בְלִיַּעַל jedoch zu spezifisch moralpsychologisch; der Ausdruck bezeichnet hier abwertend Menschen als nichtsnutzig bzw. niederträchtig, ohne notwendig eine Aussage über ihr Gewissen zu machen.
  naturalness: Der Entwurf ist überwiegend modernes Standarddeutsch. Die Stellung „Nur seine Frau und seine Kinder darf jeder“ ist zwar verständlich, aber weniger klar als eine Formulierung mit „Jeder“ als Satzsubjekt. Die Überarbeitung verdeutlicht außerdem, dass „sie“ Frau und Kinder gemeinsam meint.
  terminology: „Beute“ ist für שָׁלָל treffend; die Fußnote mit „Plündergut“ ist eine sinnvolle lexikalische Alternative. „Nichtsnutzig“ gibt בְלִיַּעַל hier angemessener wieder als „gewissenlos“ und vermeidet sowohl die spätere Eigennamendeutung „Belial“ als auch eine unnötige Einengung.
  issues:
  - severity: medium
    issue: „gewissenlosen“ für בְלִיַּעַל
    rationale: Die Wiedergabe verengt die abwertende Charakterisierung auf Skrupellosigkeit bzw. fehlendes Gewissen. Im Kontext ist „nichtsnutzig“ eine näherliegende, traditionsunabhängige und moderne Entsprechung für die wertende Bezeichnung.
  - severity: low
    issue: Unklare und etwas markierte Wortstellung in der Ausnahmeformulierung
    rationale: „Nur seine Frau und seine Kinder darf jeder …“ ist möglich, doch „Jeder darf nur seine Frau und seine Kinder …“ ist im heutigen Deutsch klarer. Das Pronomen wird durch „mit ihnen“ eindeutig auf beide Familienangehörigen bezogen.
