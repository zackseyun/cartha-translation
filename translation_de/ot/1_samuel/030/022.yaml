- from: 'Da entgegneten alle bösen und gewissenlosen Männer unter denen, die mit David gezogen waren: „Weil sie nicht mit mir gegangen sind,[a] geben wir ihnen nichts von der Beute,[b] die wir zurückgewonnen haben. Nur seine Frau und seine Kinder darf jeder mitnehmen, sie wegführen und gehen.“'
  to: 'Da entgegneten alle bösen und nichtsnutzigen Männer unter denen, die mit David gezogen waren: „Weil sie nicht mit mir gegangen sind,[a] geben wir ihnen nichts von der Beute,[b] die wir zurückgewonnen haben. Jeder darf nur seine Frau und seine Kinder mitnehmen, sie wegführen und mit ihnen gehen.“'
  rationale: Die Änderung von „gewissenlos“ zu „nichtsnutzig“ wahrt die abwertende Bedeutung von בְלִיַּעַל, ohne sie unnötig zu präzisieren. Die Schlussformulierung wird idiomatischer und bezieht das Weggehen eindeutig auf die mitgenommenen Familienangehörigen, während die beiden hebräischen Verben für Wegführen und Gehen erhalten bleiben.
