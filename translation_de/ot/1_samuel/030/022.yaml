source:
  edition: WLC
  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: de
  text: 'Da entgegneten alle bösen und nichtsnutzigen Männer unter denen, die mit David gezogen waren: „Weil sie nicht mit mir gegangen sind,[a] geben wir ihnen nichts von der Beute,[b] die wir zurückgewonnen haben. Jeder darf nur seine Frau und seine Kinder mitnehmen, sie wegführen und mit ihnen gehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „mit mir“; obwohl mehrere Männer sprechen, steht im überlieferten Text hier die Einzahl.
    reason: source_ambiguity
  - marker: b
    text: 'Oder: „von dem Plündergut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: Da entgegneten ...
  rationale: Die beiden hebräischen Redeeinleitungsformeln werden im natürlichen Deutschen gebündelt; „Da“ führt die Erzählung weiter, „entgegneten“ kennzeichnet die Reaktion.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: alle bösen und gewissenlosen Männer
  rationale: רָע bezeichnet ihre moralische Bosheit; בְלִיַּעַל charakterisiert sie hier als skrupel- bzw. gewissenlos, nicht als Träger des späteren Eigennamens „Belial“.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: unter denen, die mit David gezogen waren
  rationale: Gibt den partitiven Sinn von מִן idiomatisch wieder und ordnet die Sprecher als Teil von Davids Begleitern ein.
- source_word: יַעַן אֲשֶׁר לֹא הָלְכוּ עִמִּי
  choice: Weil sie nicht mit mir gegangen sind
  rationale: Bewahrt den kausalen Zusammenhang und ausdrücklich den überraschenden Singular „mit mir“ des masoretischen Textes.
- source_word: לֹא נִתֵּן לָהֶם
  choice: geben wir ihnen nichts
  rationale: Der Imperfekt drückt hier den festen Entschluss der Gruppe aus; die deutsche Präsensform gibt dies direkt und natürlich wieder.
- source_word: מֵהַשָּׁלָל אֲשֶׁר הִצַּלְנוּ
  choice: von der Beute, die wir zurückgewonnen haben
  rationale: „Beute“ ist die übliche heutige Wiedergabe von שָׁלָל; im Zusammenhang bezeichnet נצל die Rückgewinnung des zuvor geraubten Besitzes.
- source_word: כִּי אִם אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: Nur seine Frau und seine Kinder darf jeder mitnehmen
  rationale: כִּי אִם führt die einzige zugestandene Ausnahme ein. בָּנָיו wird im Familienzusammenhang inklusiv als „Kinder“ wiedergegeben.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: sie wegführen und gehen
  rationale: 'Bewahrt beide Verben: Die Familien sollen mitgeführt werden, danach sollen die Männer fortgehen.'
theological_decisions:
- issue: Bedeutung von בְלִיַּעַל
  choice: gewissenlos
  alternative: nichtsnutzig; gesetzlos; Belial
  rationale: Das Wort ist hier eine abwertende Charakterisierung von Menschen. „Gewissenlos“ vermittelt den moralischen Gehalt, ohne den späteren Eigennamen „Belial“ oder eine besondere dogmatische Deutung einzutragen.
- issue: Numeruswechsel in der direkten Rede
  choice: „mit mir“ im Singular, danach „wir“ im Plural
  alternative: angleichend „mit uns“
  rationale: Der masoretische Text enthält ausdrücklich עִמִּי („mit mir“). Die Spannung zwischen einem einzelnen Wortführer und der als Gruppe sprechenden Menge bleibt daher erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sperrige doppelte Redeeinleitung des Hebräischen wurde idiomatisch gebündelt; der auffällige Wechsel von Singular zu Plural in der Rede bleibt erhalten.
