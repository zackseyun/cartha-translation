base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/031.yaml
  text: and to those in Hebron[a], and to all the places where David and his men had gone about.
translation:
  language: de
  text: und an die in Hebron und an alle Orte, an denen David und seine Männer umhergezogen waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unterwegs gewesen waren« oder »umhergewandert waren«. Das hebräische Verb kann wiederholte Bewegung von Ort zu Ort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: und an die
  rationale: Die Präposition mit dem Relativwort führt die Empfängerliste aus dem vorherigen Vers fort; im Deutschen ist der personale Plural aus dem Zusammenhang zu ergänzen.
- source_word: בְּחֶבְרוֹן
  choice: in Hebron
  rationale: Natürliche lokative Wiedergabe des Ortsnamens.
- source_word: וּלְכָל הַמְּקֹמוֹת
  choice: und an alle Orte
  rationale: Bewahrt die Fortsetzung der Empfängerliste und gibt כָל mit dem Plural מְקֹמוֹת natürlich wieder.
- source_word: אֲשֶׁר ... שָׁם
  choice: an denen
  rationale: Beim lokalen Bezugswort »Orte« fasst der deutsche Relativanschluss die hebräische Verbindung aus Relativwort und »dort« idiomatisch zusammen.
- source_word: הִתְהַלֶּךְ
  choice: umhergezogen waren
  rationale: Der Hitpael von הלך bezeichnet hier wiederholte Bewegung beziehungsweise Aufenthalte an verschiedenen Orten, nicht bloß einen einzelnen Gang.
- source_word: דָּוִד הוּא וַאֲנָשָׁיו
  choice: David und seine Männer
  rationale: Das selbstständige Pronomen nach »David« wird hier als appositionelle Wiederaufnahme verstanden und im natürlichen Deutschen nicht eigens wiedergegeben; אֲנָשָׁיו bezeichnet im Kontext Davids Männer beziehungsweise Gefolgsleute.
theological_decisions: []
