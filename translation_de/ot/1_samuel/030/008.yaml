base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: de
  text: 'Und David befragte den HERRN: »Soll ich diesen Plündertrupp verfolgen? Werde ich ihn einholen?« Er antwortete ihm: »Verfolge ihn! Du wirst ihn ganz gewiss einholen und die Verschleppten retten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁאל ביהוה
  choice: den HERRN befragen
  rationale: Gibt die feststehende Wendung für das Einholen göttlicher Weisung natürlich und würdig wieder.
- source_word: הַגְּדוּד
  choice: Plündertrupp
  rationale: Im Kontext bezeichnet das Wort die amalekitische Schar, die Ziklag überfallen und Menschen verschleppt hat; »Plündertrupp« ist präziser als das allgemeinere »Trupp«.
- source_word: השׂיג
  choice: einholen
  rationale: Bewahrt die Verfolgungssituation und die Wiederholung desselben Verbs in Frage und Antwort.
- source_word: הצל
  choice: die Verschleppten retten
  rationale: Das hebräische Verb bedeutet retten beziehungsweise entreißen; das im Deutschen ergänzte Objekt ergibt sich eindeutig aus dem unmittelbaren Kontext, ohne den Erfolg nur abstrakt auszudrücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschen Bibelkonvention und der konsultierten POB-Fassung, ohne eine bestimmte Aussprache des Gottesnamens festzulegen.
- issue: Intensivkonstruktionen הַשֵּׂג תַּשִּׂיג und הַצֵּל תַּצִּיל
  choice: »ganz gewiss« auf beide zugesagten Erfolge beziehen
  alternative: beide Verben einzeln mit »ganz gewiss« verstärken
  rationale: Die hebräischen Infinitiv-absolute-Konstruktionen bekräftigen sowohl das Einholen als auch das Retten. Die deutsche Satzstellung drückt diese doppelte Gewissheit flüssig aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp gehalten; die im Hebräischen idiomatische Einleitung לֵאמֹר wird nicht mit einem unnötigen »indem er sagte« nachgebildet.
