base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/003.yaml
  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: de
  text: 'Als David und seine Männer zur Stadt kamen, sahen sie: Sie war niedergebrannt worden, und ihre Frauen, ihre Söhne und ihre Töchter waren verschleppt worden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 'sahen sie:'
  rationale: Das hebräische Präsentativ hebt den überraschenden Anblick hervor. Im modernen Deutschen vermittelt „sahen sie:“ diese Funktion natürlicher als das archaische „siehe“.
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: niedergebrannt worden
  rationale: Die Konstruktion bezeichnet den durch Feuer herbeigeführten Zustand der Stadt; „niedergebrannt“ gibt dies idiomatisch wieder, ohne das im Deutschen redundante „mit Feuer“.
- source_word: נִשְׁבּוּ
  choice: waren verschleppt worden
  rationale: Das Verb bedeutet, als Gefangene weggeführt zu werden. „Verschleppt“ bewahrt sowohl die gewaltsame Wegführung als auch den resultierenden Zustand.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Satzfolge und der hervorgehobene überraschende Anblick bleiben erhalten, während unnötig wörtliche Hebraismen vermieden werden.
