source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: de
  text: Als David und seine Männer am dritten Tag nach Ziklag kamen, waren die Amalekiter in den Negev[a] und nach Ziklag eingefallen. Sie hatten Ziklag angegriffen und mit Feuer niedergebrannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Südland“. Das hebräische Wort Negev kann sowohl den Süden allgemein als auch eine bestimmte Region, den Negev, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: Als … kamen
  rationale: Die Konstruktion führt den zeitlichen Rahmen der Erzählung ein. „Als … kamen“ gibt diese Funktion in natürlichem modernem Deutsch wieder, ohne eine im Hebräischen nicht ausdrücklich vorhandene Jetzt-Angabe einzufügen.
- source_word: וַאֲנָשָׁיו
  choice: und seine Männer
  rationale: Im Kontext bezeichnet אֲנָשִׁים Davids Gefolgsleute beziehungsweise Kampftruppe, nicht allgemein sein Volk.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Der Ortsname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: וַעֲמָלֵקִי
  choice: die Amalekiter
  rationale: Obwohl die Volksbezeichnung formal singularisch erscheint, zeigen die folgenden Verben im Plural, dass sie kollektiv gemeint ist.
- source_word: פָשְׁטוּ
  choice: hatten … einen Raubzug … unternommen
  rationale: פשט bezeichnet hier einen militärischen Überfall oder Raubzug. Das Plusquamperfekt macht deutlich, dass der Angriff bereits vor Davids Ankunft stattgefunden hatte.
- source_word: אֶל נֶגֶב
  choice: gegen den Negev
  rationale: נֶגֶב kann sowohl „Süden/Südland“ als auch die bestimmte südliche Region bezeichnen. Im Text steht wahrscheinlich die geografische Region im Blick; die alternative Bedeutung bleibt in der Fußnote erhalten.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: Sie hatten Ziklag angegriffen
  rationale: נכה hat ein breites Bedeutungsspektrum von „schlagen“ bis „angreifen“. Bei einer Stadt ist „angreifen“ im modernen Deutschen klar und kontextgerecht.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: und mit Feuer niedergebrannt
  rationale: Die Wiedergabe bewahrt die ausdrückliche Erwähnung des Feuers und bezeichnet zugleich idiomatisch die Zerstörung der Stadt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Das Plusquamperfekt ordnet den Überfall als bereits abgeschlossenes Geschehen vor Davids Ankunft ein. Der Fußnotenmarker steht unmittelbar bei „Negev“, auf das die lexikalische Alternative tatsächlich bezogen ist.
