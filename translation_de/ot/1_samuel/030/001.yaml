  rationale: Die Revision ersetzt die im Deutschen sperrige Verbindung „einen Raubzug gegen ... unternommen“ durch die idiomatische militärische Formulierung „in ... eingefallen“. Das Plusquamperfekt bewahrt die Vorzeitigkeit gegenüber Davids Ankunft. Die Fußnote erhält die lexikalische Mehrdeutigkeit von נגב und wird sprachlich präzisiert.
