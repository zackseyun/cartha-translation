  naturalness: „In den Negev und nach Ziklag eingefallen“ ist für einen militärischen Überfall auf Gebiete und einen Ort idiomatischer als „einen Raubzug gegen den Negev und gegen Ziklag unternommen“.
  terminology: „Amalekiter“, „Negev“ und „Ziklag“ sind angemessen. Die Fußnote sollte von „einer bestimmten Region“ sprechen; „die bestimmte Region“ ist hier sprachlich unglücklich.
