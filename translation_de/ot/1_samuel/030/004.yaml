base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/004.yaml
  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: de
  text: Da erhoben David und die Menschen, die bei ihm waren, ihre Stimmen und weinten, bis sie keine Kraft mehr zum Weinen hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „… erhoben … ihre Stimme …“; im Hebräischen steht „Stimme“ im Singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  choice: erhoben ... ihre Stimmen
  rationale: Die Verbindung נָשָׂא + קוֹל bezeichnet das Erheben der Stimme. Der deutsche Plural gibt die gemeinsame Handlung mehrerer Personen natürlich wieder.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: die Menschen, die bei ihm waren
  rationale: עָם bedeutet hier die bei David befindliche Gruppe. „Menschen“ bleibt näher am allgemeinen Ausdruck des Hebräischen als die kontextuell möglichen Konkretisierungen „Männer“ oder „Krieger“.
- source_word: וַיִּבְכּוּ
  choice: weinten
  rationale: בכה bezeichnet Weinen; „weinten“ ist in modernem Deutsch klar und dem würdevollen Erzählton angemessen.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: bis sie keine Kraft mehr ... hatten
  rationale: Die natürliche deutsche Wendung drückt die im Hebräischen beschriebene völlige Erschöpfung aus.
- source_word: לִבְכּוֹת
  choice: zum Weinen
  rationale: Die Wiederholung von בכה wird beibehalten und dadurch die Intensität ihres Weinens gewahrt.
