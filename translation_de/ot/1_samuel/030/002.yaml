source:
  edition: WLC
  text: וַ/יִּשְׁבּ֨וּ אֶת הַ/נָּשִׁ֤ים אֲשֶׁר בָּ/הּ֙ מִ/קָּטֹ֣ן וְ/עַד גָּד֔וֹל לֹ֥א הֵמִ֖יתוּ אִ֑ישׁ וַ/יִּֽנְהֲג֔וּ וַ/יֵּלְכ֖וּ לְ/דַרְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: de
  text: Sie nahmen die Frauen, die dort waren, gefangen, vom Geringen bis zum Großen.[a] Sie töteten niemanden, sondern führten sie fort und zogen ihres Weges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Jungen bis zum Alten“. Die hebräische Wendung „vom Geringen bis zum Großen“ kann die Gesamtheit ohne Ausnahme bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: nahmen ... gefangen
  rationale: Das Verb שׁבה bezeichnet hier die Gefangennahme von Menschen im Krieg; die deutsche Wendung gibt diesen Sinn klar und natürlich wieder.
- source_word: הַנָּשִׁים
  choice: die Frauen
  rationale: נָשִׁים bedeutet allgemein „Frauen“. „Ehefrauen“ wäre im Zusammenhang möglich, würde den hebräischen Ausdruck aber unnötig verengen.
- source_word: אֲשֶׁר בָּהּ
  choice: die dort waren
  rationale: Das feminine Suffix verweist auf die zuvor genannte Stadt Ziklag. „Dort“ stellt den Rückbezug im Deutschen flüssig her, ohne den Stadtnamen zu wiederholen.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: vom Geringen bis zum Großen
  rationale: Die nahe Wiedergabe wahrt die Mehrdeutigkeit der hebräischen umfassenden Formel, die Alter, Rang oder Bedeutung bezeichnen kann.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: Sie töteten niemanden
  rationale: אִישׁ wird hier indefinit gebraucht und meint nicht ausschließlich einen erwachsenen Mann. „Niemanden“ gibt den Gesamtsinn idiomatisch wieder.
- source_word: וַיִּנְהֲגוּ
  choice: führten sie fort
  rationale: נהג kann „führen“ oder „treiben“ bedeuten. „Fortführen“ macht die erzwungene Wegführung der zuvor genannten Gefangenen deutlich, ohne die Bewegungsart zu stark festzulegen.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: zogen ihres Weges
  rationale: Die idiomatische deutsche Wendung entspricht der hebräischen Aussage, dass sie auf ihrem Weg weiterzogen, und passt zum würdevollen Erzählstil.
