  text: וּ/שְׁתֵּ֥י נְשֵֽׁי דָוִ֖ד נִשְׁבּ֑וּ אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: de
  text: 'Auch Davids beide Frauen waren gefangen genommen worden: Ahinoam aus Jesreel und Abigail, die Frau Nabals aus Karmel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist, dass Nabal aus dem Ort Karmel stammte, nicht dass er einem späteren religiösen Orden angehörte.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: Auch Davids beide Frauen
  rationale: Das Waw verbindet den Vers mit dem vorherigen Bericht; im Deutschen gibt „auch“ den einbeziehenden Zusammenhang natürlich wieder. Die Konstruktion bezeichnet Davids zwei Frauen.
- source_word: נִשְׁבּוּ
  choice: waren gefangen genommen worden
  rationale: Das Nifal Perfekt von שׁבה bezeichnet das Erleiden der Gefangennahme. Das Plusquamperfekt macht deutlich, dass dies bei dem zuvor geschilderten Überfall geschehen war.
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: Ahinoam aus Jesreel
  rationale: Das feminine Herkunftswort bezeichnet Ahinoam als Frau aus Jesreel; die natürliche deutsche Herkunftsangabe bewahrt diesen Sinn.
- source_word: וַ/אֲבִיגַיִל
  choice: und Abigail
  rationale: Die Konjunktion und der Personenname werden schlicht wiedergegeben.
- source_word: אֵשֶׁת נָבָל
  choice: die Frau Nabals
  rationale: Die Status-constructus-Verbindung identifiziert Abigail durch ihre Ehe mit Nabal; die deutsche Genitivfügung ist klar und würdevoll.
- source_word: הַֽ/כַּרְמְלִי
  choice: aus Karmel
  rationale: Das Herkunftswort bezeichnet Nabal als Mann aus Karmel. Diese Wiedergabe vermeidet die im Deutschen mögliche irreführende Assoziation mit dem späteren Karmelitenorden.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Herkunftsbezeichnungen werden natürlich mit „aus“ wiedergegeben; die zeitliche Vorordnung der Gefangennahme bleibt durch das Plusquamperfekt erhalten.
