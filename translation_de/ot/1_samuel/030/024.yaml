base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: de
  text: Und wer wird in dieser Sache auf euch hören? Denn derselbe Anteil, den der bekommt, der in den Kampf hinabzieht, soll auch dem gehören, der beim Gepäck bleibt[a]. Sie sollen miteinander teilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei der Ausrüstung« beziehungsweise »bei den Sachen«. Das hebräische Wort kann Gepäck, Geräte, Ausrüstung oder sonstige Gegenstände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי יִשְׁמַע לָכֶם
  choice: Und wer wird ... auf euch hören?
  rationale: Die rhetorische Frage weist den Vorschlag zurück. שׁמע mit ל bezeichnet hier das Hören auf beziehungsweise das Beachten einer Person; die deutsche Wendung bewahrt diese Bedeutungsbreite.
- source_word: לַדָּבָר הַזֶּה
  choice: in dieser Sache
  rationale: דבר bezeichnet hier die strittige Angelegenheit oder den vorgebrachten Vorschlag, nicht lediglich ein einzelnes Wort.
- source_word: כְּחֵלֶק הַיֹּרֵד בַּמִּלְחָמָה
  choice: derselbe Anteil, den der bekommt, der in den Kampf hinabzieht
  rationale: חלק ist der Anteil an der Beute. Die ungewöhnliche Bewegungsangabe »hinabzieht« gibt das hebräische ירד wieder, ohne sie zum bloßen »kämpft« zu verflachen.
- source_word: וּכְחֵלֶק הַיֹּשֵׁב עַל הַכֵּלִים
  choice: soll auch dem gehören, der beim Gepäck bleibt
  rationale: ישׁב bedeutet hier situationsgerecht »bleiben«. כלים bezeichnet die mitgeführten Sachen, Geräte oder Ausrüstung; »Gepäck« passt zum militärischen Kontext und bleibt konkret.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: Sie sollen miteinander teilen
  rationale: יחדו betont die gemeinsame beziehungsweise gleiche Beteiligung; חלק bezeichnet hier das Aufteilen der zurückgewonnenen Beute. Die Soll-Form gibt den normativen Charakter der Aussage im Kontext wieder.
theological_decisions:
- issue: Gleichheit der Beuteanteile
  choice: Die parallele Formulierung stellt denselben Anteil für Kämpfende und Zurückbleibende fest.
  alternative: Das abschließende »miteinander« könnte nur gemeinsames, nicht ausdrücklich gleiches Teilen bezeichnen.
  rationale: Die zweimalige Konstruktion כְּחֵלֶק ... וּכְחֵלֶק stellt die Anteile direkt gleich; dies wird im Deutschen durch »derselbe Anteil ... soll auch« sichtbar gemacht, ohne darüber hinaus eine allgemeine theologische Regel zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und der parallele Aufbau bleiben erkennbar; »hinabzieht« bewahrt bewusst das konkrete hebräische Bewegungsverb. Die Formulierung ist verständlich, ohne den militärischen und rechtsetzenden Ton zu glätten.
