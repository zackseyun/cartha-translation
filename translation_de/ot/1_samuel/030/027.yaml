  text: to those in Bethel[a], to those in Ramoth-negeb, and to those in Jattir—
translation:
  language: de
  text: an die in Bethel, an die in Ramot im Negev[a] und an die in Jattir —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Süd-Ramot“.'
    reason: Das hebräische רָמוֹת נֶגֶב kann als Ortsname mit regionaler Bestimmung („Ramot im Negev“) oder als „Süd-Ramot“ verstanden werden.
lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: an die
  rationale: Die Verbindung aus ל und אֲשֶׁר bezeichnet in der Empfängerliste idiomatisch die jeweiligen Adressaten. „An die“ ist im Deutschen natürlich und passt zum vorausgesetzten Senden von Gaben.
- source_word: בְּבֵית אֵל
  choice: in Bethel
  rationale: בֵית אֵל ist hier der Ortsname Bethel; בְּ bezeichnet den Aufenthalts- beziehungsweise Wohnort.
- source_word: בְּרָמוֹת נֶגֶב
  choice: in Ramot im Negev
  rationale: Die Wiedergabe behandelt Ramot als Ortsnamen und Negev als regionale Bestimmung. Sie bleibt nahe an der hebräischen Wortfolge, ohne die mögliche Bedeutung „Süd-Ramot“ im Haupttext festzuschreiben.
- source_word: בְּיַתִּר
  choice: in Jattir
  rationale: יַתִּר ist ein Ortsname; „Jattir“ entspricht der geläufigen deutschen Transkription.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet den letzten Eintrag mit der vorausgehenden Empfängerliste.
