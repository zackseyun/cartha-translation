  text: und an die in Aroër, und an die in Sifmot und an die in Eschtemoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an die Bewohner von Aroër, ... von Sifmot ... von Eschtemoa«. Das Hebräische wiederholt vor jedem Ortsnamen dieselbe Wendung und hebt so die jeweiligen Empfänger hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: und an die Bewohner von
  rationale: Die wiederholte Verbindung aus Konjunktion, Präposition und Relativpartikel bezeichnet hier innerhalb einer Ortsliste die Empfänger. »An die Bewohner von« gibt den gemeinten Personenbezug im Deutschen natürlich und ausdrücklich wieder.
- source_word: בַּעֲרֹעֵר
  choice: von Aroër
  rationale: Der hebräische Ortsname wird transliteriert. Nach »Bewohner« wird die lokale Zugehörigkeit im Deutschen idiomatisch mit »von« ausgedrückt.
- source_word: בְּשִׂפְמוֹת
  choice: von Sifmot
  rationale: Der Ortsname wird nach seiner hebräischen Form transliteriert; die Präposition ist in der deutschen Wendung »Bewohner von« enthalten.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: von Eschtemoa
  rationale: Der Ortsname wird nach seiner hebräischen Form transliteriert; »von« bezeichnet in Verbindung mit »Bewohner« die Ortszugehörigkeit.
