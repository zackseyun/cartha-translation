  text: וְ/לַ/אֲשֶׁ֧ר בְּ/חָרְמָ֛ה וְ/לַ/אֲשֶׁ֥ר בְּ/בוֹר עָשָׁ֖ן וְ/לַ/אֲשֶׁ֥ר בַּ/עֲתָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/030.yaml
  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: de
  text: und an diejenigen in Horma und an diejenigen in Bor-Aschan[a] und an diejenigen in Atach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bor-Aschan ist ein Ortsname. Seine Bestandteile können wörtlich etwa „Brunnen/Grube des Rauchs“ bedeuten; der Name wird jedoch in Umschrift wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: und an die
  rationale: Die Verbindung aus וְ, der Präposition לְ und אֲשֶׁר bezeichnet in dieser Empfängerliste idiomatisch diejenigen, an die David etwas sandte. „An die“ bewahrt die Empfängerrichtung und klingt im Satzzusammenhang natürlich.
- source_word: בְּחָרְמָה
  choice: in Horma
  rationale: בְּ ist lokativ; חָרְמָה ist ein Ortsname. Die im Deutschen geläufige Namensform „Horma“ wird nicht bedeutungsmäßig übersetzt.
- source_word: בְּבוֹר עָשָׁן
  choice: in Bor-Aschan
  rationale: Die Wortgruppe fungiert als Ortsname. Die Bindestrichschreibung macht die Einheit des zweiteiligen Namens deutlich; seine möglichen Namenselemente werden nicht in eine Sachbezeichnung aufgelöst.
- source_word: בַּעֲתָךְ
  choice: in Atach
  rationale: Die Präposition ist lokativ, und עֲתָךְ wird als Ortsname in deutscher Umschrift wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, schlichte und würdige Listensprache. Die dreifache Verbindung mit „und an die“ bildet die wiederholte hebräische Konstruktion ab, ohne die nicht ausdrücklich genannten „Bewohner“ in den Haupttext einzufügen.
