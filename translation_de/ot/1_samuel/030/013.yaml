base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: de
  text: 'David fragte ihn: »Wem gehörst du, und woher kommst du?« Er antwortete: »Ich bin ein junger Ägypter, der Sklave eines Amalekiters. Mein Herr hat mich zurückgelassen, weil ich vor drei Tagen krank geworden bin.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: Wem gehörst du?
  rationale: Die Frage bezeichnet Zugehörigkeit beziehungsweise Dienstverhältnis; die natürliche deutsche Form bewahrt diesen Sinn.
- source_word: נַעַר מִצְרִי
  choice: ein junger Ägypter
  rationale: נַעַר bezeichnet hier einen jungen Mann; die knappe Wiedergabe entspricht dem Kontext.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Im Kontext eines Besitz- und Abhängigkeitsverhältnisses ist „Sklave“ präziser als das weiter gefasste „Diener“.
- source_word: וַיַּעַזְבֵנִי
  choice: hat mich zurückgelassen
  rationale: Das Verb bezeichnet hier das Verlassen beziehungsweise Zurücklassen des Erkrankten.
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: weil ich vor drei Tagen krank geworden bin
  rationale: Die hebräische Zeitangabe bedeutet idiomatisch, dass die Erkrankung drei Tage zurückliegt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache; direkte Rede natürlich formuliert, ohne die soziale Härte des Sklavenverhältnisses abzuschwächen.
