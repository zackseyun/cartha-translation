  text: David recovered all that Amalek had taken[a], and David rescued his two wives.
translation:
  language: de
  text: David holte alles zurück, was Amalek genommen hatte,[a] und David rettete seine beiden Frauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht in beiden Satzteilen dasselbe Verb. Es kann je nach Gegenstand „zurückholen“ oder „retten“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: entriss / rettete
  rationale: Dasselbe hebräische Verb steht in beiden Satzteilen und bezeichnet hier das Befreien beziehungsweise Zurückgewinnen aus fremder Gewalt. Im ersten Satzteil passt „entriss“ zu allem Geraubten und lässt Personen wie Besitz offen; im zweiten ist bei Davids Frauen „rettete“ natürlich.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: alles, was es genommen hatte
  rationale: כָּל אֲשֶׁר bedeutet natürlich „alles, was“. Das Plusquamperfekt gibt die Vorzeitigkeit im deutschen Erzählzusammenhang wieder. Das Pronomen „es“ nimmt den kollektiv gebrauchten Namen Amalek auf.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der hebräische Text verwendet den Eigennamen singularisch und kollektiv. „Amalek“ wahrt diese Ausdrucksweise genauer als „die Amalekiter“.
- source_word: שְׁתֵּי נָשָׁיו
  choice: seine beiden Frauen
  rationale: Die Wendung nennt ausdrücklich zwei Frauen. „Seine beiden Frauen“ ist idiomatisches modernes Deutsch und bewahrt die bestimmte Zweizahl.
- source_word: דָּוִד ... דָּוִד
  choice: David ... David
  rationale: Die Wiederholung des Namens im Hebräischen wird zur Wahrung von Nachdruck und Klarheit beibehalten.
theological_decisions: []
