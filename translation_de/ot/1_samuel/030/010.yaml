base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: de
  text: David verfolgte sie weiter, er und vierhundert Mann. Zweihundert Mann aber blieben zurück, die zu erschöpft waren[a], um den Bach Besor[b] zu überqueren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „so entkräftet waren“ beziehungsweise „vor Erschöpfung zurückblieben“. Das hebräische Verb kann sowohl das Ermatten als auch das dadurch verursachte Zurückbleiben ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Bach Besor“. Das hebräische Wort נחל kann einen Bach, ein Wadi oder ein nur zeitweise wasserführendes Flussbett bezeichnen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: setzte die Verfolgung fort
  rationale: רדף bezeichnet das Verfolgen oder Nachsetzen. Im Erzählzusammenhang macht „setzte die Verfolgung fort“ natürlich deutlich, dass David den zuvor begonnenen Aufbruch mit den verbliebenen Männern weiterführte.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: er und vierhundert Mann
  rationale: Das Pronomen הוּא greift David nachdrücklich beziehungsweise appositionell wieder auf. Die bewusst leicht markierte Formulierung „er und vierhundert Mann“ bewahrt diese Struktur.
- source_word: וַיַּעַמְדוּ
  choice: blieben zurück
  rationale: עמד bedeutet grundsätzlich „stehen“ oder „stehen bleiben“. Hier bezeichnet es die zweihundert Männer, die die Verfolgung nicht fortsetzen konnten; „blieben zurück“ gibt die erzählerische Funktion idiomatisch wieder.
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: weil sie zu erschöpft waren, um … zu überqueren
  rationale: פגר bezeichnet hier ein Ermatten oder erschöpftes Zurückbleiben; die Konstruktion mit מִן und dem Infinitiv עֲבֹר nennt, wozu sie nicht mehr imstande waren. Die deutsche Wendung gibt Zustand und Folge wieder, ohne die Ursache näher festzulegen.
- source_word: נַחַל הַבְּשׂוֹר
  choice: den Bach Besor
  rationale: נחל kann einen Bach, einen zeitweise wasserführenden Lauf oder ein Wadi bezeichnen. „Bach Besor“ ist verständlich und wahrt den Eigennamen; die größere Bedeutungsbreite wird in einer Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Mann“ wird in der traditionellen Zählwendung für eine militärische Gruppe verwendet. Die appositionelle Form „er und vierhundert Mann“ spiegelt die Hervorhebung des hebräischen Pronomens, ohne altertümliche Syntax zu erzwingen.
