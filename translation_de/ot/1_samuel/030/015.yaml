base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: de
  text: 'David fragte ihn: „Willst du mich zu diesem Plündertrupp[a] hinunterführen?“ Er antwortete: „Schwöre mir bei Gott, dass du mich weder tötest noch meinem Herrn auslieferst; dann werde ich dich zu diesem Plündertrupp hinunterführen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Schar“ oder „Trupp“; das hebräische Wort bezeichnet hier eine umherziehende Gruppe von Plünderern.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי / וְאוֹרִדְךָ
  choice: hinunterführen
  rationale: Der Hifil von ירד hat verursachende und richtungsbezogene Bedeutung. „Hinunterführen“ gibt beides wieder und passt dazu, dass der ägyptische Knecht David den Weg zu der Gruppe zeigen soll.
- source_word: הַגְּדוּד
  choice: Plündertrupp
  rationale: גדוד bezeichnet hier eine umherziehende bewaffnete Gruppe, die Beutezüge unternimmt. „Plündertrupp“ macht den räuberischen Charakter im Zusammenhang deutlich, ohne eine reguläre militärische Einheit zu suggerieren.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: Schwöre mir bei Gott
  rationale: Die Wendung bezeichnet einen feierlichen Eid unter ausdrücklicher Anrufung Gottes. Die gewählte Formulierung ist im Deutschen direkt und idiomatisch.
- source_word: אִם תְּמִיתֵנִי וְאִם תַּסְגִּרֵנִי
  choice: dass du mich weder tötest noch … auslieferst
  rationale: אִם steht hier in einer verkürzten hebräischen Eidesformel. Im Deutschen muss der verneinte Inhalt des verlangten Eides ausdrücklich formuliert werden; „weder … noch“ verbindet die beiden Bedingungen natürlich.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: meinem Herrn auslieferst
  rationale: Das Hifil von סגר bedeutet hier, jemanden der Gewalt eines anderen zu übergeben. „Ausliefern“ gibt diesen Sinn idiomatisch wieder; „meinem Herrn“ bewahrt die Bezeichnung des menschlichen Dienstherrn, ohne die hebräische Hand-Metapher künstlich nachzubilden.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Gemeint ist der menschliche Herr beziehungsweise Besitzer des ägyptischen Knechts. „Herr“ ist in diesem historischen Dienstverhältnis eine natürliche und würdevolle Wiedergabe.
theological_decisions:
- issue: Verneinung in der Eidesformel mit אִם
  choice: 'als Inhalt des verlangten Eides ausdrücklich verneint: „dass du mich weder tötest noch … auslieferst“'
  alternative: 'wörtlich-formelhaft: „Wenn du mich tötest und wenn du mich auslieferst …“'
  rationale: In hebräischen Eidesformeln kann אִם eine elliptische Selbstverwünschung einleiten und dadurch faktisch „nicht“ bedeuten. Eine unergänzte Nachbildung wäre im modernen Deutschen missverständlich; die Übersetzung gibt den pragmatisch eindeutigen Sinn wieder, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede bleibt knapp. Der Fußnotenmarker steht unmittelbar bei „Plündertrupp“, auf den sich die lexikalische Anmerkung bezieht.
