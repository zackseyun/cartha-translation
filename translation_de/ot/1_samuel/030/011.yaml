  text: וַֽ/יִּמְצְא֤וּ אִישׁ מִצְרִי֙ בַּ/שָּׂדֶ֔ה וַ/יִּקְח֥וּ אֹת֖/וֹ אֶל דָּוִ֑ד וַ/יִּתְּנוּ ל֥/וֹ לֶ֨חֶם֙ וַ/יֹּ֔אכַל וַ/יַּשְׁקֻ֖/הוּ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: de
  text: Sie fanden einen ägyptischen Mann auf dem Feld und brachten ihn zu David. Sie gaben ihm Brot, und er aß; dann gaben sie ihm Wasser zu trinken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Sie fanden
  rationale: Die Wayyiqtol-Erzählform wird im natürlichen deutschen Erzählstil mit dem Präteritum wiedergegeben; die einleitende Konjunktion muss nicht eigens ausgedrückt werden.
- source_word: אִישׁ מִצְרִי
  choice: einen ägyptischen Mann
  rationale: Bewahrt sowohl das Substantiv אִישׁ als auch die Herkunftsbezeichnung מִצְרִי.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שָׂדֶה bezeichnet hier ein Feld beziehungsweise freies Gelände; „auf dem Feld“ ist quellennah und im Deutschen idiomatisch.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: und brachten ihn zu David
  rationale: לקח kann bei einer Person mit Zielangabe im Deutschen kontextgemäß mit „bringen“ wiedergegeben werden; die Bewegung ist auf David zu gerichtet.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: Sie gaben ihm Brot
  rationale: לֶחֶם wird konkret und ohne unnötige Verallgemeinerung als „Brot“ wiedergegeben.
- source_word: וַיֹּאכַל
  choice: und er aß
  rationale: Wie im Hebräischen bleibt das Objekt unausgesprochen; der Bezug auf das Brot ist aus dem Kontext klar.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: dann gaben sie ihm Wasser zu trinken
  rationale: Die Hifil-Form von שׁקה bedeutet „zu trinken geben“; diese deutsche Wendung bewahrt den kausativen Sinn natürlich.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Die kurzen Handlungsschritte des Hebräischen bleiben erhalten; ein Semikolon und „dann“ gliedern die im Deutschen sonst schwerfällige Reihung, ohne den Sinn zu verändern.
