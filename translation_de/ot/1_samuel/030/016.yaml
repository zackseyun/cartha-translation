  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. »Und siehe« ist bewusst leicht gehoben, um die Blicklenkung des hebräischen הִנֵּה zu erhalten; ansonsten wurde eine natürliche gegenwärtige Ausdrucksweise gewählt.
