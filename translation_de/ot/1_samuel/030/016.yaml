  text: וַ/יֹּ֣רִדֵ֔/הוּ וְ/הִנֵּ֥ה נְטֻשִׁ֖ים עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ אֹכְלִ֤ים וְ/שֹׁתִים֙ וְ/חֹ֣גְגִ֔ים בְּ/כֹל֙ הַ/שָּׁלָ֣ל הַ/גָּד֔וֹל אֲשֶׁ֥ר לָקְח֛וּ מֵ/אֶ֥רֶץ פְּלִשְׁתִּ֖ים וּ/מֵ/אֶ֥רֶץ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: de
  text: Da führte er ihn hinab. Und siehe, sie waren über die ganze Gegend hin verteilt[a], aßen und tranken und feierten wegen all der großen Beute[b], die sie aus dem Land der Philister und aus dem Land Juda mitgenommen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über die ganze Gegend hin verstreut«. Das hebräische Partizip kann sowohl die weite Verteilung als auch die Zerstreuung hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bei all der großen Beute«. Die hebräische Präposition kann den Anlass beziehungsweise die Grundlage ihres Feierns bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: Da führte er ihn hinab
  rationale: Die Hifil-Form von ירד bedeutet »hinabführen« oder »hinabbringen«. »Führte … hinab« passt zum ägyptischen Wegführer und bewahrt die Richtungsangabe.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: הִנֵּה lenkt den Blick unvermittelt auf die nun sichtbare Szene. »Und siehe« bewahrt diese erzählerische Unmittelbarkeit in würdigem Deutsch.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: sie waren über die ganze Gegend hin verteilt
  rationale: Das passive Partizip bezeichnet ein Ausgebreitet- oder Verstreutsein. »Gegend« gibt אֶרֶץ hier lokal und kontextgerecht wieder; »über … hin« bildet die räumliche Weite von עַל־פְּנֵי ab.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: aßen und tranken und feierten
  rationale: Die drei Partizipien schildern gleichzeitig andauernde Handlungen. Die Reihung mit »und« erhält die anschauliche Struktur des Hebräischen.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: wegen all der großen Beute
  rationale: Die Präposition בְּ kann hier den Anlass oder Grund der Feier bezeichnen. »Beute« ist im militärischen Zusammenhang natürlich und präzise.
- source_word: אֲשֶׁר לָקְחוּ
  choice: die sie … mitgenommen hatten
  rationale: Das Plusquamperfekt macht deutlich, dass die Wegnahme der Beute dem Feiern vorausging. »Mitgenommen« gibt לקח in diesem Plünderungszusammenhang natürlich wieder.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: aus dem Land der Philister und aus dem Land Juda
  rationale: Die parallele Wiedergabe erhält beide territorialen Herkunftsangaben und die Wiederholung der Präposition.
theological_decisions: []
