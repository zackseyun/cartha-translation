base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: de
  text: 'Ihnen fehlte nichts: weder Klein noch Groß, weder Söhne noch Töchter, weder von der Beute noch irgendetwas von allem, was sie an sich genommen hatten[a]. Alles brachte David zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alles, was sie für sich genommen hatten“. „Sie“ bezeichnet im Zusammenhang die Amalekiter.'
    reason: Das Subjekt von „genommen hatten“ wird im hebräischen Satz nicht ausdrücklich genannt, ergibt sich aber aus dem Kontext.
lexical_decisions:
- source_word: נֶעְדַּר
  choice: fehlte
  rationale: Das Nifal von עדר bezeichnet hier, dass nach der Rückgewinnung niemand und nichts vermisst wurde. „Fehlte“ ist natürlich und bewahrt diesen Sinn.
- source_word: לָהֶם
  choice: von dem, was ihnen gehörte
  rationale: Der Dativ bezeichnet im Zusammenhang die Zugehörigkeit. Die deutsche Formulierung gibt den Besitzsinn idiomatisch wieder.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: vom Kleinsten bis zum Größten
  rationale: Die substantivierten Adjektive bleiben nahe am Hebräischen und lassen offen, ob Alter, Rang oder allgemeine Gesamtheit im Vordergrund steht.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne noch Töchter
  rationale: Die ausdrücklich genannten männlichen und weiblichen Nachkommen werden im Deutschen ebenfalls ausdrücklich wiedergegeben.
- source_word: מִשָּׁלָל
  choice: Beute
  rationale: „Beute“ ist die natürliche heutige Bezeichnung für bei einem Raubzug weggenommene Güter.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: irgendetwas von allem, was sie für sich genommen hatten
  rationale: Die Formulierung wahrt das wörtliche „was sie für sich genommen hatten“ und lässt das Subjekt aus dem Kontext erschließen, statt die Opfer ausdrücklich in den hebräischen Satz einzutragen.
- source_word: הַכֹּל הֵשִׁיב
  choice: Alles brachte ... zurück
  rationale: Der Hifil von שוב bezeichnet konkret das Zurückbringen; die Voranstellung von „Alles“ betont wie im Hebräischen die vollständige Wiedergewinnung.
- source_word: דָּוִד
  choice: David
  rationale: Übliche deutsche Namensform.
