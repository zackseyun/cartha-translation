  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: de
  text: Da zog David mit den sechshundert Männern los, die bei ihm waren. Sie kamen bis zum Bach Besor[b]; dort blieben die Übriggebliebenen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Übriggebliebenen standen.“ Auch möglich: „Die Zurückbleibenden machten dort halt.“'
    reason: lexical_alternative
  - marker: b
    text: „Bach Besor“ kann auch mit „Wadi Besor“ wiedergegeben werden; gemeint ist ein meist zeitweise trockenes Flussbett oder Tal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד הוּא
  choice: Da zog David … los
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ gibt diesen Fortgang natürlich wieder; das selbstständige Pronomen הוּא hebt David als Teil der gemeinsam aufbrechenden Gruppe hervor, ohne dass im Deutschen ein schwerfälliges „er“ ergänzt werden muss.
- source_word: וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: mit den sechshundert Männern …, die bei ihm waren
  rationale: אִישׁ bezeichnet hier die männlichen Angehörigen von Davids Truppe. Die bekannte Gruppe wird im Deutschen idiomatisch mit dem bestimmten Artikel bezeichnet.
- source_word: וַיָּבֹאוּ עַד
  choice: Sie kamen bis zu
  rationale: Die Pluralform bezieht David und seine Männer gemeinsam ein. עַד bezeichnet das erreichte Ziel beziehungsweise die Grenze ihres Weges.
- source_word: נַחַל הַבְּשׂוֹר
  choice: Bach Besor
  rationale: נַחַל kann einen Bach, ein Flusstal oder ein zeitweise trockenes Wadi bezeichnen. „Bach Besor“ ist verständlich und bewahrt den Eigennamen; die landschaftliche Bedeutungsbreite wird in der Fußnote erläutert.
- source_word: וְהַנּוֹתָרִים עָמָדוּ
  choice: dort machten die Zurückbleibenden halt
  rationale: הַנּוֹתָרִים bezeichnet diejenigen, die zurück- beziehungsweise übrigblieben. עמד bedeutet wörtlich „stehen“, kann im Zusammenhang einer Reise aber das Anhalten ausdrücken. „Halt machen“ ist natürliches Deutsch und vermeidet die missverständliche Vorstellung, sie hätten lediglich aufrecht gestanden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählbewegung bleibt knapp; die zweiteilige Satzgestaltung erhöht die Verständlichkeit, ohne Informationen hinzuzufügen. Das im Deutschen ergänzte „dort“ nimmt den unmittelbar zuvor genannten Bach Besor auf.
