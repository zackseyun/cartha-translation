  source_fidelity: 'Der Text gibt die hebräische Satzfolge und die wesentlichen Elemente zuverlässig wieder: David spricht Abjatar als Priester und Sohn Ahimelechs an, fordert ihn mit der Höflichkeitspartikel נָא auf, das Efod herzubringen, und Abjatar führt dies aus. „Da sagte“ und „Da brachte“ geben die fortschreitende Erzählfolge des Waw-Konsekutivs angemessen wieder. Das deutsche Dativobjekt in „brachte Abjatar David das Efod“ ist eine natürliche Entsprechung von אֶל־דָּוִד.'
