  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל אֶבְיָתָ֤ר הַ/כֹּהֵן֙ בֶּן אֲחִימֶ֔לֶךְ הַגִּֽישָׁ/ה נָּ֥א לִ֖/י הָ/אֵפֹ֑ד וַ/יַּגֵּ֧שׁ אֶבְיָתָ֛ר אֶת הָ/אֵפֹ֖ד אֶל דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: de
  text: 'Da sagte David zu dem Priester Abjatar, dem Sohn Ahimelechs: „Bring mir bitte das Efod[a][b].“ Da brachte Abjatar David das Efod.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leg mir bitte das Efod vor.“ Das hebräische Verb bedeutet „heranbringen“ oder „vorlegen“.'
    reason: lexical_alternative
  - marker: b
    text: Das Efod war ein heiliger priesterlicher Gegenstand oder ein Gewand, das im Gottesdienst Israels verwendet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ führt die Handlung fort; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der bestimmte Titel bezeichnet Abjatars Amt und wird direkt wiedergegeben.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: dem Sohn Ahimelechs
  rationale: Die Konstruktverbindung bezeichnet die Abstammung; der Dativ entspricht der Apposition zu „dem Priester Abjatar“.
- source_word: הַגִּישָׁה נָּא לִי
  choice: Bring mir bitte
  rationale: Der Hifil-Imperativ von נגשׁ bedeutet hier „heranbringen“ oder „vorlegen“; „bitte“ gibt die Höflichkeitspartikel נָא idiomatisch wieder.
- source_word: הָאֵפֹד
  choice: das Efod
  rationale: Der kultische Fachbegriff hat keine hinreichend genaue deutsche Entsprechung; die eingedeutschte Transliteration bewahrt die historische Besonderheit des Gegenstands.
- source_word: וַיַּגֵּשׁ
  choice: Da brachte
  rationale: Die Form bezeichnet die anschließende Ausführung der Aufforderung. „Da brachte“ wahrt den Zusammenhang mit dem vorangehenden Imperativ und klingt im Deutschen natürlich.
- source_word: אֶל דָּוִד
  choice: David
  rationale: Die Bewegung auf David zu wird im Deutschen idiomatisch durch das Dativobjekt bei „bringen“ ausgedrückt.
theological_decisions:
- issue: Bedeutung und Funktion des אֵפוֹד
  choice: Der Fachbegriff „Efod“ bleibt im Haupttext stehen.
  alternative: Priestergewand; heiliges Gewand; priesterlicher Kultgegenstand
  rationale: An dieser Stelle bezeichnet der Begriff einen priesterlichen Gegenstand, der im folgenden Zusammenhang mit der Befragung Gottes verbunden ist. Ob hier besonders das Gewand oder ein damit verbundener Kultgegenstand im Blick steht, wird nicht ausdrücklich geklärt; die Transliteration vermeidet eine unbelegte Festlegung.
translation_notes:
  register: Moderner, würdiger Erzählstil. Die Namensformen „Abjatar“ und „Ahimelech“ sowie der Fachbegriff „Efod“ folgen geläufiger deutscher Bibelschreibung. Die knappe Satzstruktur des Hebräischen bleibt erhalten, ohne im Deutschen steif zu wirken.
