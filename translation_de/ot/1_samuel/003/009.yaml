  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: de
  text: 'Da sagte Eli zu Samuel: „Geh und leg dich hin. Wenn er dich ruft, dann sag: ›Rede, Jahwe[a], denn dein Diener hört zu.‹“ Samuel ging und legte sich an seinen Platz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht der Gottesname JHWH; traditionell wird er im Deutschen mit „HERR“ wiedergegeben.
    reason: Erläuterung zur Wiedergabe des Tetragramms
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: לֵךְ שְׁכָב
  choice: Geh und leg dich hin
  rationale: Die beiden aufeinanderfolgenden Imperative bleiben direkt; „schlafen“ wird nicht ergänzt, da es nur aus dem Zusammenhang hervorgeht.
- source_word: וְהָיָה אִם
  choice: Wenn
  rationale: Die Wendung leitet eine Bedingung ein. „Wenn“ ist im Deutschen idiomatisch und lässt offen, ob der Ruf tatsächlich erfolgen wird.
- source_word: יִקְרָא אֵלֶיךָ
  choice: er dich ruft
  rationale: Das Subjekt der dritten Person Singular bleibt im Hebräischen unausgesprochen. „Er“ entspricht der kontextuellen Erkenntnis Elis, ohne den Gottesnamen in diesen Satzteil einzufügen.
- source_word: וְאָמַרְתָּ
  choice: dann sag
  rationale: Nach der Bedingung bezeichnet die Verbform die angewiesene Folge; „dann sag“ gibt diesen Zusammenhang klar und natürlich wieder.
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der einfache Imperativ wahrt die knappe, unmittelbare Anrede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die Aufforderung und wird in der feierlichen direkten Rede knapp mit „denn“ wiedergegeben.
- source_word: שֹׁמֵעַ
  choice: hört zu
  rationale: Das Partizip bezeichnet hier die gegenwärtige, aufmerksame Bereitschaft zu hören; „hört zu“ bringt dies im modernen Deutschen natürlich zum Ausdruck.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: Die Selbstbezeichnung drückt Unterordnung und Ehrerbietung aus; „Diener“ ist hier sachgerechter als „Sklave“.
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: Samuel ging und legte sich
  rationale: Die aufeinanderfolgenden Wayyiqtol-Formen setzen die Handlung in schlichter Erzählfolge fort.
- source_word: בִּמְקוֹמוֹ
  choice: an seinen Platz
  rationale: Die Formulierung bezeichnet Samuels vorgesehenen Liegeplatz, ohne zusätzliche Angaben wie „gewohnt“ einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Namen; eine Fußnote nennt die traditionelle deutsche Wiedergabe.
- issue: Unausgesprochenes Subjekt von יִקְרָא
  choice: er dich ruft
  alternative: dich jemand ruft
  rationale: Die Grammatik nennt das Subjekt nicht ausdrücklich. Im unmittelbaren Zusammenhang hat Eli jedoch erkannt, dass der Ruf von Jahwe kommt; das Pronomen bewahrt diese kontextuelle Aussage, ohne den Namen zu wiederholen.
- issue: Bedeutungsnuance von שֹׁמֵעַ
  choice: hört zu
  alternative: hört
  rationale: Beides ist lexikalisch möglich. Im Zusammenhang steht die aufmerksame Bereitschaft des Dieners im Vordergrund; „hört zu“ gibt diese Nuance wieder, ohne einen ausdrücklichen Gehorsamsbegriff hinzuzufügen.
translation_notes:
  register: Moderne, klare Standardsprache mit würdigem Erzählton. Die direkte Rede bleibt knapp und mündlich natürlich; weder altertümliche Formen noch konfessionell geprägte Zusätze werden verwendet.
