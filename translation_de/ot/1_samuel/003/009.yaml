  terminology: „Jahwe“ entspricht dem ausdrücklich genannten Tetragramm und ist innerhalb der vorgegebenen Terminologie konsistent. „Diener“ ist als ehrerbietige Selbstbezeichnung kontextgerecht. Die Fußnote ist korrekt am Gottesnamen verankert und erläutert knapp die traditionelle deutsche Ersatzlesung „HERR“.
