base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: de
  text: 'Da kam Jahwe, stellte sich hin und rief wie zuvor: »Samuel, Samuel!« Samuel antwortete: »Rede, denn dein Diener hört zu.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form der Umschrift gibt den Gottesnamen als Eigennamen wieder und folgt damit der konkreten Benennung im hebräischen Text.
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bezeichnet hier schlicht das Kommen; »kam« ist im Erzählzusammenhang unmittelbar und natürlich.
- source_word: וַיִּתְיַצַּב
  choice: stellte sich hin
  rationale: Der Hitpael von יצב beschreibt, dass jemand seinen Platz einnimmt beziehungsweise dasteht. Die Wiedergabe bewahrt die konkrete, körperhafte Erzählweise.
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא bezeichnet hier den hörbaren persönlichen Ruf an Samuel, ohne dass eine besonders laute oder erregte Stimme vorausgesetzt wird.
- source_word: כְפַעַם בְּפַעַם
  choice: wie die Male zuvor
  rationale: Die idiomatische Wendung vergleicht diesen Ruf mit den wiederholten früheren Rufen. Die deutsche Formulierung macht diesen Rückbezug natürlich verständlich.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: Samuel, Samuel
  rationale: Die Wiederholung des Namens bleibt als eindringlicher persönlicher Ruf vollständig erhalten.
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der einfache Imperativ wird knapp und würdig wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Samuels Aufforderung ein; »denn« bewahrt diesen Zusammenhang prägnant.
- source_word: שֹׁמֵעַ
  choice: hört zu
  rationale: Das Partizip bezeichnet Samuels gegenwärtige aufmerksame Hörbereitschaft. »Hört zu« drückt diese aktive Aufmerksamkeit im heutigen Deutsch deutlicher aus als bloßes »hört«.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: עבד ist hier eine demütige Selbstbezeichnung gegenüber Gott. »Diener« wahrt Unterordnung und Dienstbereitschaft, ohne im Deutschen unpassend eine rechtliche Sklavenstellung in den Vordergrund zu rücken.
theological_decisions:
- issue: Konkrete, anthropomorphe Beschreibung von Jahwes Gegenwart
  choice: »kam und stellte sich hin«
  alternative: »erschien« oder »machte sich gegenwärtig«
  rationale: Der hebräische Text schildert Jahwes Handeln mit konkreten Verben. Diese Spannung wird nicht durch eine abstraktere, theologisch glättende Formulierung aufgelöst.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als »Jahwe« lässt erkennen, dass im Ausgangstext ein persönlicher Gottesname steht. Sie vermeidet sowohl die Ersetzung durch einen Titel als auch die weniger quellennah gebildete Form »Jehova«.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; die konkrete Darstellung von Jahwes Kommen und Stehen wird nicht abgeschwächt.
