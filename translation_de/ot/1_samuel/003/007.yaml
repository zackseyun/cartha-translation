id: 1SA.3.7
reference: 1 Samuel 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֕ל טֶ֖רֶם יָדַ֣ע אֶת יְהוָ֑ה וְ/טֶ֛רֶם יִגָּלֶ֥ה אֵלָ֖י/ו דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: de
  text: Samuel kannte[a] Jahwe[b] noch nicht, und das Wort Jahwes war ihm noch nicht offenbart worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatte Jahwe noch nicht erkannt“. Das hebräische Wort für „kennen“ kann erfahrungsbezogenes oder personales Erkennen bezeichnen, besonders im Zusammenhang mit göttlicher Offenbarung.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: טֶרֶם
  choice: noch nicht
  rationale: Die Wendung bezeichnet einen Zustand, der zu diesem Zeitpunkt noch nicht eingetreten war. „Noch nicht“ gibt den zeitlichen Sinn im Deutschen natürlich wieder.
- source_word: יָדַע אֶת־יְהוָה
  choice: kannte Jahwe
  rationale: יָדַע mit persönlichem Objekt kann relationale oder erfahrungsbezogene Kenntnis bezeichnen. „Kannte“ bewahrt die knappe hebräische Formulierung, ohne die im Zusammenhang näher bestimmte Bedeutung vorwegzunehmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: יִגָּלֶה
  choice: war … offenbart worden
  rationale: 'Der Nifal von גלה ist hier passiv: Das Wort war Samuel noch nicht enthüllt beziehungsweise offenbart worden. Das Plusquamperfekt passt zur rückblickenden Erklärung im Erzählzusammenhang.'
- source_word: אֵלָיו
  choice: ihm
  rationale: Der deutschen Konstruktion „jemandem etwas offenbaren“ entsprechend wird die Präposition mit Pronominalsuffix idiomatisch durch den Dativ wiedergegeben.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Wendung wird in ihrer biblischen Prägnanz bewahrt; „Botschaft“ wäre stärker deutend.
- source_word: וּשְׁמוּאֵל
  choice: Samuel
  rationale: Das prefigierte ו leitet hier eine erläuternde Aussage ein. Im Deutschen ist dafür kein ausdrückliches „Und“ oder „Nun“ am Satzanfang erforderlich.
theological_decisions:
- issue: Bedeutung von „Samuel kannte Jahwe noch nicht“
  choice: Die mehrdeutige Formulierung „kannte Jahwe noch nicht“ bleibt stehen und wird durch den parallelen Hinweis auf die noch ausstehende Offenbarung eingeordnet.
  alternative: „Samuel hatte Jahwe noch nicht erkannt“ oder eine ausdrückliche Festlegung darauf, dass Samuel noch keine persönliche prophetische Begegnung erlebt hatte.
  rationale: Der Zusammenhang verbindet Samuels Nichtkennen mit der noch nicht erfolgten Offenbarung des Wortes Jahwes. Dennoch sollte die Übersetzung weder völlige Unwissenheit noch eine Aussage über seinen geistlichen Heilsstand hineinlesen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Satzstruktur bewahrt die enge Parallelität der beiden mit „noch nicht“ formulierten Aussagen; der Gottesname wird konsistent als „Jahwe“ wiedergegeben.
