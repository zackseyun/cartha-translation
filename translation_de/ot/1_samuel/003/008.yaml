  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: de
  text: 'Und Jahwe rief Samuel zum dritten Mal. Da stand er auf, ging zu Eli und sagte: »Hier bin ich, denn du hast mich gerufen.« Nun verstand Eli, dass Jahwe den Jungen rief.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: rief ... zum dritten Mal
  rationale: Die Verbindung von יסף mit dem Infinitiv bezeichnet die Wiederholung einer Handlung. Im Deutschen drückt »zum dritten Mal« diese Wiederholung bereits natürlich und vollständig aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּקָם
  choice: stand er auf
  rationale: Eine natürliche, gegenwartssprachliche Wiedergabe der erzählten Handlung.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: ging zu Eli
  rationale: Gibt die Bewegung zu Eli schlicht und genau wieder.
- source_word: הִנְנִי
  choice: Hier bin ich
  rationale: Im Ruf-und-Antwort-Zusammenhang ist dies die geläufige deutsche Wiedergabe und vermittelt Samuels Bereitschaft.
- source_word: כִּי קָרָאתָ לִי
  choice: denn du hast mich gerufen
  rationale: כִּי begründet hier Samuels Kommen; das Perfekt ist im deutschen Dialog idiomatisch.
- source_word: וַיָּבֶן
  choice: verstand
  rationale: Das Verb bezeichnet Elis nun eintretende Erkenntnis der Situation, ohne zusätzliche Deutung einzutragen.
- source_word: קֹרֵא
  choice: rief
  rationale: Das Partizip beschreibt den in der Szene wiederholt erfolgenden Ruf. Das deutsche Präteritum ist im Erzählzusammenhang natürlich; »am Rufen war« wäre unnötig schwerfällig.
- source_word: לַנָּעַר
  choice: den Jungen
  rationale: נַעַר bezeichnet hier den jungen Samuel unter Elis Obhut; »Junge« passt zum Kontext und ist modernes Standarddeutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. »Jahwe« bewahrt diesen Namenscharakter, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die hebräische Erzählfolge wird flüssig wiedergegeben; direkte Rede bleibt knapp und natürlich.
