base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: de
  text: An jenem Tag werde ich an Eli alles in Erfüllung bringen[a], was ich über sein Haus[b] gesagt habe, vom Anfang bis zum Ende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an Eli alles wahr machen, was ich über sein Haus gesagt habe“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Haus“ kann hier den Haushalt, die Familie beziehungsweise Nachkommenschaft oder das priesterliche Haus Elis bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die Wendung bezeichnet einen bestimmten künftigen Zeitpunkt; „an jenem Tag“ bewahrt die demonstrative Kraft und klingt im Deutschen natürlich.
- source_word: אָקִים
  choice: werde ich … ausführen
  rationale: Das Hifil von קום bedeutet hier, dass Gott sein zuvor gesprochenes Wort bestehen beziehungsweise eintreten lässt. Im Gerichtszusammenhang gibt „ausführen“ die Verwirklichung der Ankündigung natürlich wieder, ohne die Grundbedeutung unnötig einzuengen.
- source_word: אֶל עֵלִי
  choice: an Eli
  rationale: אֶל bezeichnet Eli als Ziel der angekündigten Handlung. „An Eli … ausführen“ lässt den nachteiligen Gerichtssinn erkennen und bleibt zugleich näher an der offenen Präpositionsbedeutung als „gegen Eli“.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: alles …, was ich … gesagt habe
  rationale: Die Formulierung bewahrt die umfassende Bedeutung von כָּל אֲשֶׁר und gibt das vorausgegangene, weiterhin maßgebliche Reden Gottes idiomatisch wieder.
- source_word: אֶל בֵּיתוֹ
  choice: über sein Haus
  rationale: Bei דבר kann אֶל den Gegenstand des Redens bezeichnen. „Über“ ist hier natürlich und vermeidet die unzutreffende Vorstellung, Gott habe zu einem Gebäude gesprochen.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: „Haus“ bewahrt die Bedeutungsbreite von בַּיִת, die Haushalt, Familie, Nachkommenschaft und im Zusammenhang auch Elis priesterliches Haus umfassen kann.
- source_word: הָחֵל וְכַלֵּה
  choice: vom Anfang bis zum Ende
  rationale: Die verbale Paarung drückt umfassende Durchführung beziehungsweise Vollendung aus. Die deutsche Wendung gibt diesen Totalitätssinn klar und würdig wieder.
theological_decisions:
- issue: Reichweite des Gerichts über Eli und sein Haus
  choice: „sein Haus“ bleibt im Haupttext stehen und bezeichnet offen Elis familiäres und priesterliches Haus.
  alternative: Die Formulierung ausdrücklich auf Elis unmittelbare Familie oder auf das gesamte Priestertum beschränken.
  rationale: Das hebräische בֵּיתוֹ lässt eine weitere familiär-dynastische Bedeutung zu, legt aber keine der engeren Deutungen allein fest. Die Übersetzung bewahrt diese theologische und historische Offenheit.
- issue: Art der Verwirklichung des zuvor gesprochenen Wortes
  choice: „an Eli alles ausführen“ gibt im Zusammenhang die Durchführung des angekündigten Gerichts wieder.
  alternative: „für Eli alles erfüllen“ beziehungsweise „alles bestehen lassen“.
  rationale: Der Zusammenhang ist eindeutig gerichtlicher Art; dennoch wird die lexikalische Möglichkeit des Erfüllens in einer Fußnote sichtbar gehalten, statt sie vollständig auszuschließen.
translation_notes:
  register: Modernes, standarddeutsches und würdiges Bibeldeutsch. „An jenem Tag“ und „vom Anfang bis zum Ende“ sind verständlich und idiomatisch; „sein Haus“ erhält bewusst die bildhafte und theologisch relevante Bedeutungsbreite des Hebräischen.
