  terminology: „sein Haus“ bewahrt die breite Bedeutung von בֵּיתוֹ angemessen; die Fußnote erläutert Haushalt, Familie/Nachkommenschaft und priesterliches Haus ausgewogen. Die Fußnote zu [a] sollte an die überarbeitete Hauptformulierung angepasst werden und keine missverständliche Alternative mit „für Eli“ bieten.
