base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: de
  text: 'Da sagte der HERR zu Samuel: »Sieh, ich werde in Israel etwas tun, bei dem jedem, der davon hört, beide Ohren klingen werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt die erzählende Fortführung natürlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der etablierten deutschen Bibeltradition, den Gottesnamen JHWH durch HERR wiederzugeben.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt das aufmerksamkeitslenkende Signal des hebräischen Ausdrucks in knapper, würdiger Form.
- source_word: אָנֹכִי עֹשֶׂה דָבָר
  choice: ich werde … etwas tun
  rationale: Das hebräische Partizip bezeichnet hier eine unmittelbar bevorstehende göttliche Handlung; ‚etwas‘ gibt דָבָר im Kontext idiomatisch wieder.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: beide Ohren klingen werden
  rationale: Bewahrt das körperhafte hebräische Bild für eine erschütternde Nachricht, ohne dessen Wirkung deutend auszuschreiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle Ersatzlesung ist im modernen deutschen Bibelgebrauch verständlich und vermeidet eine unsichere Vokalisierung des Namens.
- issue: Zeitbezug von אָנֹכִי עֹשֶׂה
  choice: ich werde … tun
  alternative: ich bin dabei, … zu tun
  rationale: Der Kontext kündigt Gottes bevorstehendes Gerichtshandeln an; die futurische Wiedergabe wahrt diese Ankündigungsfunktion, ohne den genauen Zeitpunkt näher festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das markante Ohren-Bild des Hebräischen bleibt erhalten; keine erläuternde Fußnote ist nötig.
