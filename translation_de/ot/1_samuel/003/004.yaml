lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Da rief
  rationale: Das Qal-Wayyiqtol von קרא führt die Erzählung fort. „Da rief“ gibt den Handlungsfortschritt natürlich wieder und bezeichnet hier einen hörbaren Ruf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen wissenschaftlichen Transkription des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל שְׁמוּאֵל
  choice: Samuel
  rationale: Bei „rufen“ kann das Deutsche den Angerufenen ohne Entsprechung für אֶל als direktes Objekt ausdrücken. Der Personenname שְׁמוּאֵל wird konventionell als „Samuel“ wiedergegeben.
- source_word: וַיֹּאמֶר
  choice: und er antwortete
  rationale: Wörtlich steht „und er sagte“. Im Zusammenhang ist die Äußerung Samuels Reaktion auf den Ruf; „antwortete“ macht diese Funktion idiomatisch deutlich, während das Pronomen die im Hebräischen nicht ausdrücklich genannte, aus dem Kontext erschlossene Person wiedergibt.
- source_word: הִנֵּנִי
  choice: Hier bin ich!
  rationale: Die feste Antwortformel drückt Anwesenheit und Bereitschaft aus. „Hier bin ich!“ ist im Deutschen natürlich und bewahrt den prägnanten biblischen Ton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen in der im modernen Deutschen verbreiteten Form; die Fußnote nennt die Form des hebräischen Namens und die alternative Wiedergabe „Jehova“.
- issue: Bezugswort des unausgedrückten Subjekts bei וַיֹּאמֶר
  choice: Samuel antwortet
  alternative: Jahwe spricht weiter
  rationale: Die Antwortformel הִנֵּנִי („Hier bin ich!“) und der folgende Erzählzusammenhang weisen darauf, dass Samuel auf den Ruf reagiert. Die deutsche Fassung lässt dies mit „er“ erkennen, ohne den Namen erneut einzusetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Da“ bildet die hebräische Erzählfolge knapp ab; die direkte Rede bleibt prägnant. Der Fußnotenmarker steht unmittelbar beim Gottesnamen.
