  text: וַ/יִּקְרָ֧א יְהוָ֛ה אֶל שְׁמוּאֵ֖ל וַ/יֹּ֥אמֶר הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/004.yaml
  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: de
  text: 'Da rief Jahwe Samuel[a], und er sagte: »Hier bin ich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; auch als »Jehova« wiedergegeben.'
