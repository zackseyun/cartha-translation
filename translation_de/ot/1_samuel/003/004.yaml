  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe des Tetragramms und wahrt den Eigennamen. „Samuel“ ist die übliche deutsche Namensform. Die Fußnote ist sachlich passend und der Marker korrekt verankert.
