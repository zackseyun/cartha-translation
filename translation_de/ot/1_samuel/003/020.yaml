source:
  edition: WLC
  text: וַ/יֵּ֨דַע֙ כָּל יִשְׂרָאֵ֔ל מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כִּ֚י נֶאֱמָ֣ן שְׁמוּאֵ֔ל לְ/נָבִ֖יא לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: de
  text: Und ganz Israel, von Dan bis Beerscheba, erkannte, dass Samuel als Prophet Jahwes anerkannt war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass Samuel sich als zuverlässiger Prophet Jahwes erwiesen hatte“. Das hebräische Wort kann ausdrücken, dass jemand sich als zuverlässig erwiesen, bestätigt oder als echt ausgewiesen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: erkannte
  rationale: Das Verb bezeichnet hier ein öffentliches Erkennen beziehungsweise Anerkennen aufgrund dessen, dass Samuels Worte eintrafen. „Erkannte“ gibt diesen Vorgang natürlicher wieder als das bloß statische „wusste“.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die kollektive Bezeichnung des Volkes bleibt erhalten und ist im Deutschen als „ganz Israel“ idiomatisch.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: von Dan bis Beerscheba
  rationale: Die geografische Paarformel bezeichnet das ganze Land von Norden bis Süden. Die Ortsnamen werden bewahrt, statt die Wendung erklärend aufzulösen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was ganz Israel erkannte.
- source_word: נֶאֱמָן
  choice: bestätigt war
  rationale: Das Nifal-Partizip von אמן kann ausdrücken, dass jemand sich als zuverlässig erwiesen hat beziehungsweise als echt oder feststehend bestätigt ist. Im Zusammenhang wird Samuels prophetischer Status durch das Eintreffen seiner Worte öffentlich bestätigt.
- source_word: לְנָבִיא
  choice: als Prophet
  rationale: Die Präposition לְ kennzeichnet hier Rolle oder Stellung; „als Prophet“ ist die natürliche deutsche Wiedergabe.
- source_word: לַיהוָה
  choice: Jahwes
  rationale: 'Die Zugehörigkeit beziehungsweise Beauftragung wird im Deutschen idiomatisch durch den Genitiv ausgedrückt: Samuel ist ein Prophet Jahwes.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נֶאֱמָן für Samuels prophetische Stellung
  choice: als Prophet bestätigt war
  alternative: sich als zuverlässiger Prophet erwiesen hatte
  rationale: Der unmittelbare Zusammenhang betont, dass Samuels Worte eintrafen und dadurch seine prophetische Stellung öffentlich feststand. Die Übersetzung vermeidet sowohl eine rein moralische Deutung als „treu“ als auch die Eintragung einer technisch verstandenen Amtseinsetzung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die traditionelle geografische Formel „von Dan bis Beerscheba“ bleibt erhalten; die Satzstellung ist für heutiges Deutsch leicht lesbar. Der Fußnotenmarker steht unmittelbar nach der von der lexikalischen Alternative betroffenen Aussage.
