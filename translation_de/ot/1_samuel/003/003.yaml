  text: וְ/נֵ֤ר אֱלֹהִים֙ טֶ֣רֶם יִכְבֶּ֔ה וּ/שְׁמוּאֵ֖ל שֹׁכֵ֑ב בְּ/הֵיכַ֣ל יְהוָ֔ה אֲשֶׁר שָׁ֖ם אֲר֥וֹן אֱלֹהִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: de
  text: Die Lampe Gottes war noch nicht erloschen, und Samuel lag im Heiligtum Jahwes[a], wo die Lade Gottes stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel Jahwes“. Das hebräische Wort הֵיכָל kann einen Tempel oder ein Heiligtum bezeichnen; hier ist Jahwes Wohnstätte in Schilo gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: die Lampe Gottes
  rationale: נֵר bezeichnet konkret eine Lampe, nicht allgemein Licht. Die Genitivverbindung bleibt erhalten und wahrt den kultischen Bezug.
- source_word: טֶרֶם יִכְבֶּה
  choice: war noch nicht erloschen
  rationale: טֶרֶם bezeichnet ein noch nicht eingetretenes Geschehen; bei einer Lampe gibt „noch nicht erloschen“ die intransitive Bedeutung von כבה natürlich wieder.
- source_word: שֹׁכֵב
  choice: lag
  rationale: Das Partizip beschreibt Samuels liegende Haltung. „Schlief“ würde über den Wortlaut hinaus ausdrücklich Schlaf behaupten.
- source_word: הֵיכַל יְהוָה
  choice: im Heiligtum Jahwes
  rationale: הֵיכָל kann Tempel, Palast oder Heiligtum bezeichnen. „Heiligtum“ passt zum vorstaatlichen Heiligtum in Schilo und vermeidet, ohne die räumliche Aussage abzuschwächen, eine vorschnelle Gleichsetzung mit dem späteren salomonischen Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: wo die Lade Gottes stand
  rationale: „Wo“ gibt die örtliche Funktion von שָׁם natürlich wieder. Bei einem aufgestellten Kultgegenstand ist „stand“ im Deutschen idiomatischer als das bloße „war“, ohne eine zusätzliche Handlung einzutragen.
theological_decisions:
- issue: Wiedergabe von הֵיכַל יְהוָה im Heiligtum von Schilo
  choice: im Heiligtum Jahwes
  alternative: im Tempel Jahwes
  rationale: Der Ausdruck kann lexikalisch „Tempel“ bedeuten, doch die erzählte Situation liegt vor dem Bau des salomonischen Tempels. „Heiligtum“ wahrt den historischen Kontext; die ebenfalls mögliche Wiedergabe „Tempel“ bleibt in der Fußnote sichtbar.
- issue: Räumliche Nähe Samuels zur Lade
  choice: Die relative Ortsangabe wird unverändert auf das Heiligtum bezogen
  alternative: Eine Präzisierung, Samuel habe nur in einem Nebenraum oder im Heiligtumsbezirk gelegen
  rationale: Der hebräische Satz sagt, Samuel habe in dem הֵיכַל gelegen, wo die Lade war. Eine architektonische Präzisierung würde eine mögliche Spannung des Textes interpretierend auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau folgt der fortlaufenden hebräischen Szene, bleibt aber idiomatisch. Der Gottesname erscheint als „Jahwe“.
