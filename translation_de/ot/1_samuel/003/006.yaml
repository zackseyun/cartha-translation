base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: de
  text: 'Da rief der HERR Samuel noch einmal. Samuel stand auf, ging zu Eli und sagte: »Hier bin ich, denn du hast mich gerufen.« Eli antwortete: »Ich habe dich nicht gerufen, mein Sohn. Geh zurück und leg dich hin.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף יְהוָה קְרֹא עוֹד
  choice: Da rief der HERR Samuel noch einmal
  rationale: Die Kombination aus יסף und עוד bezeichnet die Wiederholung des Rufens. »Der HERR« gibt den Gottesnamen יהוה in der im deutschen Bibelgebrauch vertrauten Form wieder.
- source_word: הִנְנִי
  choice: Hier bin ich
  rationale: Natürliche und traditionsnahe Wiedergabe der Bereitschafts- und Anwesenheitsformel.
- source_word: כִּי קָרָאתָ לִי
  choice: du hast mich doch gerufen
  rationale: כִּי begründet Samuels Kommen. Das deutsche »doch« bringt in diesem Dialog seine sichere Annahme idiomatisch zum Ausdruck, ohne einen zusätzlichen theologischen Gehalt einzutragen.
- source_word: שׁוּב שְׁכָב
  choice: Geh wieder und leg dich hin
  rationale: שׁוּב hat hier die adverbiale Bedeutung »wieder/zurück«, gefolgt vom Imperativ »leg dich hin«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die Übersetzung folgt der etablierten deutschen Kennzeichnung des Tetragramms durch »HERR« in Großbuchstaben, ohne eine unsichere Aussprache festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge und natürlicher direkter Rede. Das väterliche »mein Sohn« bleibt erhalten.
