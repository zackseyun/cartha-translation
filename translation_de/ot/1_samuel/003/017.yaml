  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: de
  text: 'Und er sagte: „Was ist das Wort, das er zu dir gesprochen hat? Verheimliche es mir bitte nicht! Gott soll dir dies antun und noch mehr, wenn du mir auch nur ein Wort von allem verheimlichst, was er zu dir gesprochen hat.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: Was ist das für ein Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. »Wort« bewahrt hier die Verbindung zum göttlichen Reden im Zusammenhang; die deutsche Wendung »Was ist das für ein Wort?« klingt natürlicher als das rein formale »Was ist das Wort?«.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: das er zu dir gesprochen hat
  rationale: »Gesprochen« gibt דבר wieder und erhält die sprachliche Verbindung zwischen dem »Wort« und dem Reden.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: Verheimliche es mir bitte nicht
  rationale: כחד bezeichnet das Verbergen oder Verheimlichen; »bitte« gibt die bittende Partikel נָא wieder, ohne den nachdrücklichen Ton des Satzes aufzuheben. »Es« nimmt das zuvor genannte Wort auf.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: Gott soll dir dies und noch mehr antun
  rationale: Die feste Schwur- und Fluchformel wird in verständlichem, feierlichem Deutsch wiedergegeben. »Dies und noch mehr« bewahrt die absichtlich unbestimmte Androhung.
- source_word: אִם
  choice: wenn
  rationale: In dieser Schwurformel leitet אִם die Bedingung ein, unter der der zuvor ausgesprochene Fluch gelten soll.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר
  choice: wenn du mir auch nur ein Wort verheimlichst
  rationale: »Ein Wort« erhält den Singular דָּבָר und dessen Wiederholung; »auch nur« bringt den Sinn zum Ausdruck, dass nicht der geringste Teil verschwiegen werden darf.
- source_word: מִכָּל הַדָּבָר
  choice: von dem ganzen Wort
  rationale: Die bewusst markante Formulierung bewahrt den Singular und die Wiederholung von דָּבָר. Eine glattere deutsche Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Schwurformel
  choice: Gott
  alternative: die Götter
  rationale: Im Zusammenhang beschwört Eli den Gott Israels. Obwohl אֱלֹהִים seiner Form nach pluralisch ist, bezeichnet es hier nach dem üblichen hebräischen Sprachgebrauch den einen Gott und nicht mehrere Götter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformel bleibt feierlich und in ihrer Androhung bewusst unbestimmt. Die ungewöhnliche Wiederholung von »Wort« ist quellenbedingt und wird durch eine flüssigere Fußnotenalternative ergänzt.
