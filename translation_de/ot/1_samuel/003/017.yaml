revisions:
- from: 'Und er sagte: „Was ist das für ein Wort, das er zu dir gesprochen hat? Verheimliche es mir bitte nicht! Gott soll dir dies und noch mehr antun, wenn du mir auch nur ein Wort von dem ganzen Wort[a] verheimlichst, das er zu dir gesprochen hat.“'
  to: 'Und er sagte: „Was ist das Wort, das er zu dir gesprochen hat? Verheimliche es mir bitte nicht! Gott soll dir dies antun und noch mehr, wenn du mir auch nur ein Wort von allem verheimlichst, was er zu dir gesprochen hat.“'
  rationale: Die Revision beseitigt eine deutsche Bedeutungsverschiebung in der Eingangsfrage und ersetzt eine unnatürliche, potenziell missverständliche Nachbildung des hebräischen Singulars durch eine idiomatische partitive Konstruktion. Sie bewahrt den Bezug auf das „Wort“, die Wiederaufnahme durch „ein Wort“, die wiederholte Redehandlung sowie die feierliche Schwur- und Fluchformel.
