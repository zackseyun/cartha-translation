source:
  edition: WLC
  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: de
  text: 'Und ich habe ihm angekündigt, dass ich sein Haus für immer richte wegen der Schuld, von der er wusste: Seine Söhne zogen einen Fluch auf sich[a], doch er hielt sie nicht zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer abweichenden Lesart, die sich in einigen alten Textzeugen und vielen Übersetzungen widerspiegelt: „Seine Söhne verfluchten Gott“ oder „lästerten Gott“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: Und ich habe ihm angekündigt
  rationale: Das Hifil von נגד bezeichnet ein Bekanntmachen oder Ankündigen. Das deutsche Perfekt gibt die bereits ergangene, weiterhin gültige Ankündigung natürlich wieder.
- source_word: שֹׁפֵט אֲנִי
  choice: dass ich ... richte
  rationale: Das Partizip mit ausdrücklich gesetztem Pronomen beschreibt ein gegenwärtiges beziehungsweise unmittelbar bevorstehendes Gericht. Die Präsensform bewahrt diese feierliche Unmittelbarkeit.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: Das hebräische Bild kann sowohl Elis Haushalt als auch seine fortdauernde Familienlinie umfassen. „Haus“ erhält diese Bedeutungsbreite.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet eine fortdauernde, nicht begrenzte Geltung und wird in klarem modernem Deutsch mit „für immer“ wiedergegeben.
- source_word: בַּעֲוֺן אֲשֶׁר יָדַע
  choice: wegen der Schuld, von der er wusste
  rationale: עָוֹן umfasst schuldhaftes Unrecht und dessen Schuldcharakter; die Formulierung macht zugleich Elis schuldbegründendes Wissen deutlich, ohne den Gegenstand übermäßig zu präzisieren.
- source_word: מְקַלְלִים לָהֶם
  choice: zogen einen Fluch auf sich
  rationale: Der masoretische Konsonantentext lässt sich als eine auf die Söhne selbst zurückwirkende Aussage verstehen. Diese Wiedergabe ist im Deutschen verständlich und folgt dem überlieferten Haupttext; die wichtige abweichende Lesart wird in der Fußnote genannt.
- source_word: כִהָה בָּם
  choice: hielt sie nicht zurück
  rationale: Das seltene Verb kann ein Schwächen, Dämpfen oder Einschränken bezeichnen. Im Zusammenhang drückt es aus, dass Eli dem Verhalten seiner Söhne keinen wirksamen Einhalt gebot.
theological_decisions:
- issue: Ob die schwierige Wendung von einem Fluch über die Söhne selbst oder vom Verfluchen beziehungsweise Lästern Gottes spricht
  choice: 'Im Haupttext steht nach dem masoretischen Text: „Seine Söhne zogen einen Fluch auf sich.“'
  alternative: „Seine Söhne verfluchten Gott“ beziehungsweise „lästerten Gott“
  rationale: Die überlieferte masoretische Formulierung unterstützt die selbstbezügliche Aussage, während einige alte Textzeugen und zahlreiche Übersetzungen eine Lesart mit Gott als Gegenstand widerspiegeln. Der Haupttext wahrt die Priorität des hebräischen Textes; die textgeschichtlich bedeutsame Alternative bleibt in der Fußnote sichtbar.
- issue: Reichweite des Gerichts über Elis „Haus“
  choice: Die offene Bildsprache „sein Haus“ bleibt erhalten.
  alternative: „seinen Haushalt“ oder „seine Familienlinie“
  rationale: Das hebräische בַּיִת kann hier die unmittelbare Hausgemeinschaft und die weiterbestehende Familie beziehungsweise Linie einschließen. Eine engere Festlegung würde die Aussage unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der feierlichen Gerichtsankündigung des Hebräischen, wird aber durch den Doppelpunkt übersichtlich gegliedert. Der seltene Ausdruck für Elis unterlassene Reaktion wird verständlich als fehlendes Zurückhalten wiedergegeben.
