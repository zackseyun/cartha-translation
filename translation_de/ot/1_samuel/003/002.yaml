  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: de
  text: An jenem Tag lag Eli an seinem Platz. Seine Augen begannen zu ermatten, und er konnte nicht sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[nicht eigens wiedergegeben]'
  rationale: Die Form führt die erzählerische Situation ein. Im modernen Deutschen wird diese Funktion durch den Satzbeginn natürlich getragen; ein zusätzliches „Und es geschah“ wäre unnötig schwerfällig.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Direkte und natürliche Wiedergabe der Präposition mit „Tag“ und Demonstrativpronomen.
- source_word: שֹׁכֵב
  choice: lag
  rationale: Das Partizip bezeichnet Elis andauernde Lage. Im Deutschen gibt das Präteritum „lag“ diesen Zustand in einer Erzählung idiomatisch wieder.
- source_word: בִּמְקֹמוֹ
  choice: an seinem Platz
  rationale: Bewahrt die unbestimmte Ortsangabe des Hebräischen, ohne sie unbegründet als Zimmer oder Schlafraum zu präzisieren.
- source_word: וְעֵינוֹ
  choice: Seine Augen
  rationale: Obwohl die überlieferte Form formal als Singular „sein Auge“ gelesen werden kann, bezieht sie sich hier auf das Sehvermögen; im Deutschen ist der Plural in diesem Zusammenhang natürlich.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: hatten angefangen, schwach zu werden
  rationale: Die Wiedergabe erhält sowohl den Beginn als auch die fortschreitende Abnahme der Sehkraft.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: sodass er nicht mehr sehen konnte
  rationale: Gibt die praktische Folge der nachlassenden Sehkraft in natürlichem Deutsch wieder. „Nicht mehr“ ist im Zusammenhang des beginnenden Erblindens idiomatisch, ohne vollständige Blindheit über den Satz hinaus festzuschreiben.
