reference: 1 Samuel 3:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: de
  text: Samuel legte sich bis zum Morgen hin. Dann öffnete er die Türen des Hauses Jahwes. Doch Samuel fürchtete sich, Eli von der Vision[a] zu berichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erscheinung“. Das hebräische Wort kann eine Erscheinung oder eine visionäre Offenbarung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich hin
  rationale: Das Verb שׁכב bedeutet hier zunächst „sich hinlegen“. Die Übersetzung vermeidet die nicht ausdrücklich gemachte Aussage, Samuel habe bis zum Morgen geschlafen.
- source_word: עַד הַבֹּקֶר
  choice: bis zum Morgen
  rationale: Gibt die zeitliche Grenze natürlich und genau wieder.
- source_word: וַיִּפְתַּח
  choice: Dann öffnete er
  rationale: „Dann“ bildet die hebräische Erzählfolge idiomatisch ab, ohne eine im Verb nicht enthaltene Bewegung hinzuzufügen.
- source_word: דַּלְתוֹת
  choice: die Türen
  rationale: Die Pluralform wird direkt wiedergegeben; gemeint sind die Türen des Heiligtums beziehungsweise seines Eingangs.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Bezeichnung „Haus Jahwes“ wahrt den historischen Schauplatz; „Tempel“ wäre hier zu spezifisch und könnte an den späteren Jerusalemer Tempel denken lassen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Form des göttlichen Eigennamens gibt das Tetragramm ausdrücklich wieder.
- source_word: יָרֵא
  choice: fürchtete sich
  rationale: Die Form bezeichnet Samuels Furcht; die reflexive deutsche Wendung ist natürlich und bewahrt deren emotionale Stärke.
- source_word: מֵהַגִּיד
  choice: zu berichten
  rationale: Nach ירא bezeichnet מִן mit Infinitiv die gefürchtete Handlung. „Sich fürchten, … zu berichten“ ist idiomatisches Deutsch.
- source_word: הַמַּרְאָה
  choice: die Vision
  rationale: מַרְאָה kann eine Erscheinung oder visionäre Offenbarung bezeichnen. Im Zusammenhang der nächtlichen Offenbarung passt „Vision“ am besten, während die Fußnote die lexikalische Alternative offenhält.
- source_word: אֶל עֵלִי
  choice: Eli von … zu berichten
  rationale: Die deutsche Konstruktion „jemandem von etwas berichten“ gibt die Zielrichtung der Mitteilung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn in der im Deutschen üblichen Form, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Offenbarung מַרְאָה
  choice: Vision
  alternative: Erscheinung
  rationale: Der unmittelbare Kontext beschreibt Samuels nächtliche Offenbarung. „Vision“ gibt diesen Zusammenhang treffend wieder, ohne die mögliche Grundbedeutung „Erscheinung“ zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze erhalten den ruhigen Erzählfluss. „Legte sich hin“ vermeidet die interpretierende Ergänzung, Samuel habe tatsächlich geschlafen; „Haus Jahwes“ vermeidet die historisch möglicherweise irreführende Bezeichnung „Tempel“.
