source:
  edition: WLC
  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: de
  text: Und Jahwe erschien weiterhin in Silo; denn Jahwe offenbarte sich Samuel in Silo durch das Wort Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Wort Jahwes“.'
    reason: Die Präposition ב kann neben dem instrumentalen „durch“ auch als „in“ verstanden werden.
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: weiterhin
  rationale: Die Verbindung von יָסַף mit einem Infinitiv bezeichnet hier die Fortsetzung beziehungsweise Wiederholung eines Geschehens. „erschien weiterhin“ gibt die hebräische Wendung natürlich und knapp wieder.
- source_word: לְהֵרָאֹה
  choice: erschien
  rationale: Der Nifal von ראה bezeichnet hier das Sichtbarwerden beziehungsweise Sichzeigen in einer göttlichen Offenbarung. „erschien“ ist im Deutschen idiomatisch, ohne die genaue Erscheinungsweise festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen gebräuchlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: in Silo
  rationale: Die Präposition ב ist hier lokal gebraucht. Bei einem Ortsnamen ist „in Silo“ im Deutschen die natürliche Form.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier eine Begründung oder Erläuterung der vorausgehenden Aussage ein; „denn“ bewahrt diesen Zusammenhang.
- source_word: נִגְלָה
  choice: offenbarte sich
  rationale: Der Nifal von גלה bezeichnet hier Selbstmitteilung oder Offenbarwerden. „offenbarte sich“ wahrt gegenüber „erschien“ die unterschiedliche Wortwahl des Hebräischen.
- source_word: אֶל שְׁמוּאֵל
  choice: Samuel
  rationale: Bei „sich jemandem offenbaren“ steht die betreffende Person im Deutschen idiomatisch im Dativ; daher ist keine ausdrückliche Präposition nötig.
- source_word: בִּדְבַר יְהוָה
  choice: durch das Wort Jahwes
  rationale: 'ב wird hier am ehesten instrumental verstanden: Jahwes Wort ist das Mittel seiner Offenbarung. Die knappe Formulierung bewahrt zugleich die enge Verbindung zwischen Erscheinung und Wort.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Erscheinung
  choice: Die wirkliche Selbstoffenbarung Jahwes wird ausgesagt, ihre genaue Erscheinungsweise jedoch offengelassen.
  alternative: Festlegung auf eine rein visionäre oder eine körperlich-theophanische Erscheinung
  rationale: Der Vers verbindet „erschien“ mit „offenbarte sich ... durch das Wort Jahwes“. Die Übersetzung erhält beide Aussagen, ohne über den Text hinaus die konkrete Form der Offenbarung festzulegen.
- issue: Bedeutung der Präposition ב in בִּדְבַר יְהוָה
  choice: durch das Wort Jahwes
  alternative: im Wort Jahwes
  rationale: Die instrumentale Deutung ist im Zusammenhang naheliegend, doch die hebräische Präposition lässt auch eine stärker sphärische Wiedergabe zu; diese wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Gottesnamens und des Ortsnamens wird entsprechend der markanten hebräischen Formulierung beibehalten; „erschien weiterhin“ vermeidet eine schwerfällige wörtliche Nachbildung von „fügte hinzu zu erscheinen“.
