base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: de
  text: Der Junge Samuel diente Jahwe vor Eli, und das Wort Jahwes war in jenen Tagen selten; Visionen waren nicht weit verbreitet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es gab keine häufige Vision“ oder, bildhaft: „Eine Vision brach nicht hervor“. Die hebräische Wendung besagt, dass Offenbarungsvisionen damals ungewöhnlich waren und nicht verbreitet auftraten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/נַּעַר שְׁמוּאֵל
  choice: Der Junge Samuel
  rationale: הַנַּעַר bezeichnet einen Jungen oder jungen Menschen. Im Erzählzusammenhang passt „der Junge“; das vorangestellte וְ wird im Deutschen nicht eigens wiedergegeben, weil ein bloßes „und“ am Versanfang hier unnatürlich wäre.
- source_word: מְשָׁרֵת אֶת יְהוָה
  choice: diente Jahwe
  rationale: Das Partizip bezeichnet Samuels fortdauernden Dienst. „Diente“ ist natürlich und kann hier den Dienst am Heiligtum einschließen. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לִפְנֵי עֵלִי
  choice: unter Elis Aufsicht
  rationale: לִפְנֵי bedeutet wörtlich „vor/in Gegenwart von“. Im Zusammenhang bezeichnet es zugleich Elis Anwesenheit und Aufsicht; die deutsche Wendung gibt diese Funktion verständlich wieder.
- source_word: וּ/דְבַר יְהוָה
  choice: und das Wort Jahwes
  rationale: Die Formulierung bewahrt den biblischen Ausdruck für eine von Gott ausgehende Offenbarung.
- source_word: יָקָר
  choice: war selten
  rationale: יָקָר kann „kostbar“ bedeuten, bezeichnet hier angesichts des folgenden Satzes jedoch die Seltenheit göttlicher Offenbarung.
- source_word: בַּ/יָּמִים הָ/הֵם
  choice: in jenen Tagen
  rationale: Natürliche und zugleich würdevolle Wiedergabe der Zeitangabe.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: eine Vision brach nicht häufig hervor
  rationale: Die Formulierung bewahrt das Bild des Verbs פרץ („hervorbrechen, sich ausbreiten“) und macht aus dem Zusammenhang deutlich, dass Offenbarungsvisionen nicht oft auftraten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den Gottesnamen direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug von לִפְנֵי עֵלִי
  choice: unter Elis Aufsicht
  alternative: vor Eli; in Elis Gegenwart
  rationale: Die Wendung kann räumliche Gegenwart ausdrücken, bezeichnet im Erzählzusammenhang aber wahrscheinlich auch Samuels Dienst unter Elis Aufsicht. Die gewählte Fassung macht diesen Zusammenhang verständlich, ohne Eli zum Empfänger des Dienstes zu machen.
- issue: Deutung von אֵין חָזוֹן נִפְרָץ
  choice: eine Vision brach nicht häufig hervor
  alternative: Visionen waren nicht weit verbreitet; es gab keine häufige Vision
  rationale: Die hebräische Wendung ist bildhaft und nicht völlig eindeutig. Die Übersetzung erhält das Bild des Hervorbrechens und drückt zugleich die Seltenheit von Offenbarungsvisionen aus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau bleibt nahe am Hebräischen, während „unter Elis Aufsicht“ den Zusammenhang für heutige Leser verdeutlicht. Die ungewöhnliche Bildsprache des letzten Satzteils wird im Haupttext bewahrt und in der Fußnote erklärt.
