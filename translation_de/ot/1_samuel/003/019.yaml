  text: וַ/יִּגְדַּ֖ל שְׁמוּאֵ֑ל וַֽ/יהוָה֙ הָיָ֣ה עִמּ֔/וֹ וְ/לֹֽא הִפִּ֥יל מִ/כָּל דְּבָרָ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: de
  text: Und Samuel wuchs heran. Jahwe war mit ihm und ließ keines seiner Worte zu Boden fallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Er ließ keines seiner Worte unerfüllt oder fehlschlagen. Wörtlich lautet die hebräische Wendung: »Er ließ keines seiner Worte zu Boden fallen.«'
    reason: Erläuterung des hebräischen Idioms und Angabe sinngemäßer Alternativen.
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: wuchs heran
  rationale: Das Verb גדל bezeichnet hier Samuels Wachstum und Heranreifen. »Wuchs heran« ist im Deutschen natürlich und legt den Sinn weder ausschließlich auf körperliches Wachstum noch auf zunehmendes Ansehen fest.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: »Jahwe« ist die gebräuchliche deutsche Wiedergabe des Tetragramms als Eigenname und ersetzt ihn nicht durch einen Titel.
- source_word: הָיָה עִמּוֹ
  choice: war mit ihm
  rationale: Die Wendung wird unmittelbar wiedergegeben und bewahrt die Aussage von Gottes Gegenwart und Beistand.
- source_word: וְלֹא הִפִּיל
  choice: und ließ keines … fallen
  rationale: Die Hifil-Form von נפל mit Verneinung besagt, dass Jahwe Samuels Worte nicht fallen beziehungsweise scheitern ließ. Die Formulierung erhält die kausative Nuance.
- source_word: מִכָּל דְּבָרָיו
  choice: keines seiner Worte
  rationale: Die hebräische Formulierung »von allen seinen Worten« bedeutet im verneinten Satz idiomatisch »keines seiner Worte«. »Worte« bleibt bewusst weiter gefasst als »Prophezeiungen« oder »Botschaften«.
- source_word: אָרְצָה
  choice: zu Boden
  rationale: Die Richtungsform bedeutet »zur Erde/zum Boden« und gehört zum bildhaften Ausdruck für Worte, die nicht wirkungslos bleiben oder sich nicht als falsch erweisen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als Eigennamen in einer im Deutschen geläufigen Form, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn der Wendung, dass kein Wort zu Boden fiel
  choice: Das hebräische Bild im Haupttext bewahren
  alternative: ließ keines seiner Worte unerfüllt; ließ keines seiner Worte fehlschlagen
  rationale: Der Zusammenhang bestätigt Samuel als Propheten, doch der hebräische Wortlaut verwendet ein anschauliches Idiom. Seine Beibehaltung wahrt die literarische Gestalt und vermeidet eine unnötige Verengung; die Fußnote erklärt den Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Hauptsätze werden zur besseren deutschen Lesbarkeit getrennt; die enge inhaltliche Verbindung bleibt erhalten. Das hebräische Bild wird im Text beibehalten und knapp erläutert.
