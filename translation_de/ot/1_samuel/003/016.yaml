  yaml_path: translation/ot/1_samuel/003/016.yaml
  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: de
  text: 'Da rief Eli Samuel und sagte: »Samuel, mein Sohn.« Und er sagte: »Hier bin ich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Da rief
  rationale: קרא bezeichnet hier Elis mündlichen Ruf an Samuel. »Da rief« gibt sowohl die Handlung als auch den erzählerischen Fortgang der Wayyiqtol-Form natürlich wieder.
- source_word: עֵלִי
  choice: Eli
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition als »Eli« wiedergegeben.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: Die direkte Objektmarkierung אֶת wird im Deutschen nicht eigens wiedergegeben; der Personenname erscheint in seiner üblichen deutschen Form.
- source_word: וַיֹּאמֶר
  choice: und sagte / Er antwortete
  rationale: אמר ist das gewöhnliche hebräische Redeverb. Beim ersten Vorkommen ist »sagte« formal nah; beim zweiten macht »antwortete« die im Zusammenhang eindeutige Gesprächsfunktion in natürlichem Deutsch sichtbar.
- source_word: שְׁמוּאֵל בְּנִי
  choice: Samuel, mein Sohn!
  rationale: בְּנִי bedeutet wörtlich »mein Sohn« und bewahrt hier die persönliche, wohl zugewandte Anrede Elis, ohne sie weiter auszudeuten.
- source_word: הִנְנִי
  choice: Hier bin ich.
  rationale: הִנְנִי ist eine feste Bereitschafts- und Anwesenheitsformel. »Hier bin ich« ist die geläufige, bedeutungsnahe deutsche Entsprechung.
- source_word: וַ
  choice: Da / und
  rationale: Die Verbindungen führen die Erzählung weiter. Unterschiedliche natürliche deutsche Anschlüsse vermeiden eine schwerfällige Reihung, ohne die Abfolge zu verändern.
