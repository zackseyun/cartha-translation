base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: de
  text: 'Da teilte Samuel ihm alles mit und verschwieg ihm nichts. Eli sagte: »Er ist Jahwe. Er tue, was in seinen Augen gut ist.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er wird tun, was in seinen Augen gut ist.« Der hebräische Imperfekt kann hier entweder als Ausdruck ergebener Zustimmung (»er tue«) oder als Zukunftsaussage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ שְׁמוּאֵל
  choice: Da teilte Samuel ihm ... mit
  rationale: נגד im Hifil bedeutet hier »mitteilen/berichten«. »Mitteilte« ist natürlich und gibt die persönliche Weitergabe an Eli klar wieder.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: alles
  rationale: דברים kann je nach Zusammenhang »Worte« oder »Dinge/Sachen« bedeuten. Hier bezeichnet die Wendung den gesamten Inhalt der Offenbarung; »alles« ist im Deutschen idiomatisch und wahrt die Vollständigkeit.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: und verschwieg ihm nichts
  rationale: כחד bezeichnet das Verheimlichen oder Zurückhalten. »Verschwieg ihm nichts« ist präzise und natürlich.
- source_word: יְהוָה הוּא
  choice: Er ist Jahwe
  rationale: Die ungewöhnliche pronomenbetonte Wortfolge wird eng nachgebildet. Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: was in seinen Augen gut ist
  rationale: Die bildhafte hebräische Wendung bleibt erhalten; sie bezeichnet, was nach Jahwes eigenem Urteil gut ist.
- source_word: יַעֲשֶׂה
  choice: er tue
  rationale: Der deutsche Konjunktiv I gibt die im Kontext naheliegende zulassend-unterwerfende Nuance knapp und würdig wieder, ohne die formal mögliche Zukunftsbedeutung zu verschweigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. »Jahwe« bewahrt diese Funktion, statt ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft von יַעֲשֶׂה
  choice: 'Unterwerfender Wunsch: »Er tue ...«'
  alternative: 'Zukunftsaussage: »Er wird ... tun«'
  rationale: Elis Reaktion auf die Gerichtsbotschaft legt eine zustimmende Ergebung nahe. Da der hebräische Imperfekt auch als einfache Zukunft verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote festgehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildrede »in seinen Augen« bleibt bewusst erhalten; ihr Sinn ist »nach seinem Urteil«. Der Sprecher wird zur Klarheit als Eli benannt, da der unmittelbare Kontext ihn eindeutig identifiziert.
