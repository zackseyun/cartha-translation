id: 1SA.3.14
reference: 1 Samuel 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: de
  text: 'Darum habe ich über das Haus Elis geschworen: Die Schuld des Hauses Eli soll durch Schlachtopfer oder Speiseopfer niemals gesühnt werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich folgt auf „habe ich geschworen“ das Wort „wenn“. In dieser hebräischen Schwurformel drückt es eine nachdrückliche Verneinung aus: „ganz gewiss nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Darum
  rationale: Leitet die Folgerung aus der zuvor angekündigten Gerichtsentscheidung natürlich und prägnant ein.
- source_word: נִשְׁבַּעְתִּי לְבֵית עֵלִי
  choice: habe ich über das Haus Elis geschworen
  rationale: Das Perfekt bezeichnet einen vollzogenen Eid mit fortdauernder Geltung; „über“ gibt den Gegenstand des inhaltlich gegen Elis Haus gerichteten Eides im Deutschen idiomatisch wieder.
- source_word: אִם ... עַד עוֹלָם
  choice: soll ... niemals
  rationale: אִם dient nach dem Schwurverb als starke Verneinungsformel; עַד עוֹלָם unterstreicht deren dauernde Geltung.
- source_word: יִתְכַּפֵּר
  choice: gesühnt werden
  rationale: Gibt die passive beziehungsweise reflexive Bedeutung von כפר im kultischen Zusammenhang wieder und bewahrt den Bezug auf die Beseitigung von Schuld.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann sowohl das Vergehen als auch die daraus erwachsende Schuld bezeichnen; hier passt „Schuld“ besonders zur Frage der Sühne.
- source_word: בְּזֶבַח
  choice: durch Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer; die Präposition בְּ markiert hier das Mittel.
- source_word: וּבְמִנְחָה
  choice: oder Speiseopfer
  rationale: מִנְחָה bezeichnet im kultischen Kontext häufig das unblutige, meist aus Getreide bestehende Speiseopfer; „oder“ gibt die deutsche Verknüpfung in einer verneinten Aussage idiomatisch wieder.
theological_decisions:
- issue: Reichweite des Gerichts über Elis Haus
  choice: Der Vers erklärt, dass die Schuld des Hauses Eli durch Schlacht- oder Speiseopfer niemals gesühnt werden wird.
  alternative: Die Aussage könnte über die genannten kultischen Mittel hinaus als absolute Verneinung jeder denkbaren Vergebung verstanden werden.
  rationale: Der hebräische Text nennt ausdrücklich Opfermittel. Die Übersetzung bewahrt die Endgültigkeit des Eides, erweitert sie aber nicht zu einer Aussage über jede mögliche Form göttlicher Vergebung.
- issue: Bedeutung der Schwurformel mit אִם
  choice: Als nachdrückliche Verneinung „niemals“ wiedergegeben.
  alternative: Die Form wörtlich mit „wenn“ stehen lassen.
  rationale: Nach einem Schwurverb ist אִם eine idiomatische Schwurformel, deren sinngemäße deutsche Entsprechung eine starke Verneinung ist. Die Fußnote macht die hebräische Form transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus Elis“ bezeichnet seine Familie beziehungsweise sein Geschlecht. Die kultisch präzisen Begriffe „Schlachtopfer“ und „Speiseopfer“ sind verständlich und bilden die Unterscheidung zwischen זֶבַח und מִנְחָה ab.
