  text: וַ/יּ֤וֹסֶף יְהֽוֹנָתָן֙ לְ/הַשְׁבִּ֣יעַ אֶת דָּוִ֔ד בְּ/אַהֲבָת֖/וֹ אֹת֑/וֹ כִּֽי אַהֲבַ֥ת נַפְשׁ֖/וֹ אֲהֵבֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/017.yaml
  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: de
  text: Und Jonatan ließ David noch einmal bei seiner Liebe zu ihm schwören[a]; denn er liebte ihn so, wie er sein eigenes Leben liebte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jonatan nahm David aus Liebe zu ihm noch einmal einen Eid ab.“'
    reason: Die hebräische Formulierung kann sowohl mit „ließ … schwören“ als auch idiomatisch mit „nahm … einen Eid ab“ wiedergegeben werden; בְּאַהֲבָתוֹ kann zudem die Grundlage oder das Motiv bezeichnen.
  - marker: b
    text: 'Wörtlich: „denn er liebte ihn mit der Liebe seiner Seele.“ Das hebräische נֶפֶשׁ kann „Seele“, „Leben“ oder „Selbst“ bedeuten; die Wendung beschreibt tiefe persönliche Hingabe.'
    reason: Die Anmerkung gibt die Bildsprache und Bedeutungsbreite der hebräischen Wendung wieder, ohne ihre Formulierung als eine wörtliche deutsche Umschreibung von „eigenes Leben“ auszugeben.
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: noch einmal
  rationale: יסף mit folgendem Infinitiv bezeichnet hier die Wiederholung der Handlung; „noch einmal“ gibt dies im Deutschen klar und natürlich wieder.
- source_word: לְהַשְׁבִּיעַ
  choice: ließ … schwören
  rationale: 'Der Hifil von שבע hat kausative Bedeutung: Jonatan veranlasste David zu einem Schwur beziehungsweise nahm ihm einen Eid ab.'
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: bei seiner Liebe zu ihm
  rationale: Die kompakte Wendung mit ב kann die Grundlage oder den Bezug des Schwurs ausdrücken. Die Übersetzung bewahrt diese Formulierung, ohne sie eindeutig auf bloßes Motiv oder Ursache festzulegen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Jonatans Handeln ein.
- source_word: אַהֲבַת נַפְשׁוֹ אֲהֵבוֹ
  choice: er liebte ihn wie sein eigenes Leben
  rationale: נפשׁ bezeichnet hier die eigene Person beziehungsweise das eigene Leben. Die deutsche idiomatische Wiedergabe bewahrt die Aussage tiefer persönlicher Hingabe.
theological_decisions:
- issue: Art von Jonatans Liebe zu David
  choice: Die starke Liebesaussage bleibt ausdrücklich als „liebte“ erhalten, ohne ihre Art näher festzulegen.
  alternative: Die Liebe ausdrücklich als bloße Freundschaft, romantische Liebe oder sexuelle Beziehung zu deuten.
  rationale: Der hebräische Text betont die Intensität von Jonatans Liebe, benennt aber keine solche moderne Kategorie. Die Übersetzung wahrt diese Offenheit und vermeidet sowohl Abschwächung als auch interpretative Zusätze.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jonatan“ folgt der heute geläufigen deutschen Namensform. Die Satzstruktur bleibt nahe am Hebräischen, während „wie sein eigenes Leben“ die zugrunde liegende Wendung idiomatisch verständlich macht.
