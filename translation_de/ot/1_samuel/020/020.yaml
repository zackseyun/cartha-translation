revisions:
- from: Und ich werde die drei Pfeile seitlich davon[a] abschießen, als würde ich für mich auf ein Ziel schießen.[b]
  to: Und ich werde die drei Pfeile seitwärts schießen, als wollte ich auf ein Ziel schießen.[a]
  rationale: Die Revision entfernt den nicht im Hebräischen vorhandenen anaphorischen Bezug und gibt צִדָּה richtungsbezogen wieder. Die idiomatische Schlusswendung wird in natürlichem Deutsch kontextgerecht ausgedrückt; die Fußnote erläutert den verbleibenden Auslegungsspielraum, ohne eine zusätzliche Bedeutung in den Haupttext einzutragen.
