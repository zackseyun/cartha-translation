base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/020.yaml
  text: And I will shoot the three arrows to the side of it[c][b][a], as though I were shooting for myself at a target.
translation:
  language: de
  text: Und ich werde die drei Pfeile seitwärts schießen, als wollte ich auf ein Ziel schießen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist idiomatisch; im Zusammenhang beschreibt sie ein Schießen, das wie eine Zielübung aussehen soll.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Und ich
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt Jonatans eigene Handlung innerhalb des vereinbarten Plans hervor.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: die drei Pfeile
  rationale: Die bestimmte Nominalverbindung bezeichnet die drei Pfeile, die als verabredetes Signal dienen sollen.
- source_word: צִדָּה
  choice: seitlich davon
  rationale: Die Form enthält ein Suffix der 3. Person Singular feminin und bezeichnet eine Richtung zur Seite des zuvor erwähnten Gegenstands hin. »Davon« bewahrt den Rückbezug, ohne sein Bezugswort im Haupttext festzulegen.
- source_word: אוֹרֶה
  choice: werde … abschießen
  rationale: ירה bezeichnet im Bogenschützenkontext das Abschießen von Pfeilen; die Zukunftsform entspricht der angekündigten Handlung.
- source_word: לְשַׁלַּח לִי
  choice: als würde ich für mich … schießen
  rationale: 'Die hebräische Wendung beschreibt, wie Jonatans Handlung nach außen erscheinen soll: wie gewöhnliches Schießen beziehungsweise eine Zielübung. Die Wiedergabe erhält zugleich den reflexiv-dativischen Ausdruck לִי.'
- source_word: לְמַטָּרָה
  choice: auf ein Ziel
  rationale: מַטָּרָה bezeichnet hier die Zielscheibe oder das Ziel beim Bogenschießen; die unbestimmte deutsche Form passt zum dargestellten Übungsschießen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Seitlich davon« bewahrt den im Hebräischen vorhandenen Rückbezug, ohne den Gegenstand im Haupttext ausdrücklich zu bestimmen. Die etwas markierte Wendung »für mich« bleibt stehen, weil sie לִי abbildet; die Fußnote erläutert den idiomatischen Sinn.
