source:
  edition: WLC
  text: וְ/שִׁלַּשְׁתָּ֙ תֵּרֵ֣ד מְאֹ֔ד וּ/בָאתָ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁר נִסְתַּ֥רְתָּ שָּׁ֖ם בְּ/י֣וֹם הַֽ/מַּעֲשֶׂ֑ה וְ/יָ֣שַׁבְתָּ֔ אֵ֖צֶל הָ/אֶ֥בֶן הָ/אָֽזֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: de
  text: Am dritten Tag[a] geh schnell hinunter und komm an den Ort, an dem du dich am Tag des Geschehens[b] versteckt hast. Halte dich neben dem Stein Asel[c] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Form ist ungewöhnlich und kann wörtlicher auch im Sinn von »wenn du es zum dritten Mal tust« verstanden werden. Im Zusammenhang ist wahrscheinlich der dritte Tag gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »am Tag der Tat/Angelegenheit«. Gemeint ist vermutlich der Tag des zuvor verabredeten Vorgangs oder Anlasses; der genaue Bezug bleibt unsicher.'
    reason: lexical_alternative
  - marker: c
    text: »Asel« ist wahrscheinlich ein Ortsname oder eine feste Bezeichnung des Steins. Das zugrunde liegende hebräische Wort kann mit »gehen« oder »Fortgang« zusammenhängen; die genaue Bedeutung ist ungewiss.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: Am dritten Tag
  rationale: Die Piel-Form von שלשׁ ist hier idiomatisch und bezeichnet im Erzählzusammenhang am ehesten den dritten Tag. Die zeitliche Einordnung wird natürlich wiedergegeben, ohne die schwierige Form mechanisch nachzubilden.
- source_word: תֵּרֵד מְאֹד
  choice: geh schnell hinunter
  rationale: ירד bedeutet »hinuntergehen«; מְאֹד verstärkt die Aufforderung. »Schnell« gibt die im Kontext naheliegende Dringlichkeit idiomatisch wieder, auch wenn die Verstärkung wörtlicher »sehr/weit hinunter« lauten könnte.
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: und komm an den Ort
  rationale: בוא bezeichnet das Kommen oder Gelangen zu einem Ort. Die deutsche Wendung ist direkt und natürlich.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: an dem du dich … versteckt hast
  rationale: 'Die Nifal-Form wird dem Zusammenhang entsprechend reflexiv verstanden: David hatte sich selbst verborgen.'
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: am Tag des Geschehens
  rationale: מַעֲשֶׂה kann Tat, Vorgang, Angelegenheit oder Geschehen bedeuten. »Geschehen« bleibt im Deutschen verständlich und lässt den unklaren Bezug der hebräischen Wendung offen.
- source_word: וְיָשַׁבְתָּ
  choice: Halte dich … auf
  rationale: ישׁב kann »sitzen«, »bleiben« oder »sich aufhalten« bedeuten. Hier geht es darum, wartend am vereinbarten Ort zu bleiben.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: neben dem Stein Asel
  rationale: אֵצֶל bedeutet »neben« und אֶבֶן »Stein«. הָאָזֶל wird als feste Bezeichnung beziehungsweise Ortsname transliteriert, da seine genaue Bedeutung unsicher ist.
