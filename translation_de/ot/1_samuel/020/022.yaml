id: 1SA.20.22
reference: 1 Samuel 20:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: de
  text: 'Wenn ich aber zu dem jungen Mann sage: »Sieh, die Pfeile liegen hinter dir[a]«, dann geh, denn Jahwe hat dich fortgeschickt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »von dir aus weiter hinaus«, also über den jungen Mann hinaus.'
    reason: Die hebräische Raumangabe ist anschaulicher und weniger perspektivisch festgelegt als das idiomatische deutsche »hinter dir«.
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Wendung leitet den gegensätzlichen zweiten Fall von Jonatans verabredetem Zeichen ein; die Nachstellung von »aber« ist im Deutschen natürlich.
- source_word: כֹּה אֹמַר
  choice: ich … sage
  rationale: כֹּה weist auf die folgende wörtliche Rede voraus. Im Deutschen ist eine schlichte Redeeinleitung natürlicher als ein ausdrückliches »so sage«.
- source_word: לָעֶלֶם
  choice: zu dem jungen Mann
  rationale: עֶלֶם bezeichnet einen männlichen Jugendlichen oder jungen Mann. Die Übersetzung vermeidet sowohl das möglicherweise zu kindlich klingende »Junge« als auch das im Substantiv nicht ausdrücklich enthaltene »Diener«.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird als unmittelbarer, gegenwärtig verständlicher Hinweis wiedergegeben.
- source_word: הַחִצִּים
  choice: die Pfeile
  rationale: Direkte Wiedergabe des bestimmten Plurals von חֵץ.
- source_word: מִמְּךָ וָהָלְאָה
  choice: hinter dir
  rationale: Die räumliche Wendung bezeichnet den Bereich über den jungen Mann hinaus. »Hinter dir« gibt das vereinbarte Signal knapp und idiomatisch wieder; die wörtlichere Raumvorstellung wird in der Fußnote erläutert.
- source_word: לֵךְ
  choice: geh
  rationale: Der Imperativ wird direkt wiedergegeben; im Zusammenhang bedeutet er, dass David aufbrechen soll.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für den Befehl ein.
- source_word: שִׁלַּחֲךָ
  choice: hat dich fortgeschickt
  rationale: Das Verb steht in einer Perfektform und bezeichnet hier das Wegsenden Davids. »Fortgeschickt« bewahrt sowohl die Sendungsvorstellung als auch die Richtung weg vom gegenwärtigen Ort.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird in seiner im Deutschen geläufigen Form als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst und nicht einen Titel. »Jahwe« bewahrt diesen Unterschied, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Göttliche Veranlassung von Davids Aufbruch
  choice: Jahwe hat dich fortgeschickt
  alternative: Jahwe schickt dich fort
  rationale: Die Perfektform wird beibehalten. Damit bleibt Jonatans Aussage bestehen, dass Davids notwendiger Aufbruch als bereits von Gott verfügt verstanden wird, ohne den zeitlichen oder theologischen Gehalt zu glätten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die direkte Rede bleibt unmittelbar; veraltete Formen und unnötige Rollenzuschreibungen werden vermieden.
