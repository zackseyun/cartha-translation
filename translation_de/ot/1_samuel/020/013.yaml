  text: כֹּֽה יַעֲשֶׂה֩ יְהוָ֨ה לִֽ/יהוֹנָתָ֜ן וְ/כֹ֣ה יֹסִ֗יף כִּֽי יֵיטִ֨ב אֶל אָבִ֤/י אֶת הָֽ/רָעָה֙ עָלֶ֔י/ךָ וְ/גָלִ֨יתִי֙ אֶת אָזְנֶ֔/ךָ וְ/שִׁלַּחְתִּ֖י/ךָ וְ/הָלַכְתָּ֣ לְ/שָׁל֑וֹם וִ/יהִ֤י יְהוָה֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אָבִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: de
  text: Möge Jahwe Jonatan dies antun und noch mehr, wenn mein Vater Böses gegen dich im Sinn hat und ich es dir nicht mitteile[a] und dich nicht fortschicke, damit du in Frieden gehen kannst. Jahwe sei mit dir, wie er mit meinem Vater gewesen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dein Ohr enthülle“. Das ist eine hebräische Redewendung für „dir etwas mitteilen“ oder „dich davon in Kenntnis setzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: So soll Jahwe es mit Jonatan machen und noch Schlimmeres hinzufügen
  rationale: Die feststehende Schwur- und Fluchformel wird in verständlichem Deutsch wiedergegeben. Die dritte Person „Jonatan“ bleibt entsprechend dem Hebräischen erhalten; „noch Schlimmeres“ bringt die steigernde, selbstverfluchende Kraft der Formel zum Ausdruck.
- source_word: כִּי יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: wenn mein Vater Böses gegen dich im Sinn hat
  rationale: Die elliptische Wendung bedeutet wörtlich ungefähr, dass das Böse gegen David Sauls Gefallen findet. Die gewählte Formulierung gibt die feindliche Absicht natürlich wieder, ohne Freude am Bösen stärker zu behaupten, als der Kontext verlangt.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: und ich es dir nicht mitteile
  rationale: '„Das Ohr enthüllen“ ist ein hebräisches Idiom für das Mitteilen oder Offenbaren. Die Verneinung ist im komprimierten Schwursatz sinngemäß ergänzt: Jonatan ruft den Fluch für den Fall auf sich herab, dass er David nicht warnt.'
- source_word: וְשִׁלַּחְתִּיךָ וְהָלַכְתָּ לְשָׁלוֹם
  choice: und dich fortschicke, sodass du in Frieden gehen kannst
  rationale: Das Kausativ bezeichnet Jonatans aktives Wegschicken beziehungsweise Freigeben Davids. „In Frieden gehen“ bewahrt die traditionelle hebräische Friedensformel; „sodass“ verdeutlicht das Ergebnis.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: Jahwe sei mit dir
  rationale: Der Jussiv wird mit dem deutschen Wunschkonjunktiv wiedergegeben. Der Gottesname wird als „Jahwe“ transliteriert.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: wie er mit meinem Vater gewesen ist
  rationale: Das Perfekt bezeichnet Jahwes bisheriges Mitsein mit Saul; das Perfekt „gewesen ist“ lässt dessen gegenwärtige Fortdauer bewusst offen.
theological_decisions:
- issue: Sinngemäße Verneinung innerhalb von Jonatans Schwur
  choice: Der Haupttext ergänzt „nicht“, sodass der Selbstfluch gilt, falls Jonatan David nicht warnt und fortschickt.
  alternative: 'Den hebräischen Wortlaut ohne ausdrückliche Verneinung wiedergeben: „Wenn mein Vater Böses gegen dich im Sinn hat, werde ich es dir mitteilen und dich fortschicken.“'
  rationale: Der hebräische Schwursatz ist stark verdichtet. Im Zusammenhang kann Jonatan nicht dafür einen Fluch auf sich rufen, dass er David tatsächlich warnt. Die ergänzte Verneinung macht die pragmatische Funktion des Selbstfluchs verständlich, ohne die Zusage inhaltlich zu verändern.
- issue: Jahwes Mitsein mit Saul
  choice: „wie er mit meinem Vater gewesen ist“
  alternative: „wie er mit meinem Vater ist“
  rationale: Die Vergangenheitsform bewahrt die zeitliche Perspektive des hebräischen Perfekts und vermeidet eine theologische Vorentscheidung darüber, ob Gottes Beistand für Saul zu diesem Zeitpunkt noch fortbesteht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurformel bleibt feierlich und deutlich, während die idiomatische Wendung vom Enthüllen des Ohres im Haupttext natürlich wiedergegeben und in der Fußnote erläutert wird.
