source:
  edition: WLC
  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: de
  text: 'Und was die Sache betrifft, über die du und ich gesprochen haben[a]: Sieh, Jahwe ist für immer zwischen mir und dir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Wort, das du und ich gesprochen haben«. Das hebräische Wort דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten; hier bezieht es sich auf die zuvor besprochene Vereinbarung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: Und was die Sache betrifft
  rationale: דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. Im Zusammenhang bezeichnet es die zuvor besprochene Vereinbarung; die deutsche Wendung markiert zugleich die Fortführung und Hervorhebung des Themas.
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: über die du und ich gesprochen haben
  rationale: Die Formulierung gibt den Rückbezug auf das gemeinsame Gespräch natürlich wieder. »Du und ich« entspricht im Deutschen der üblichen Reihenfolge, ohne die ausdrückliche Gegenseitigkeit des Hebräischen aufzugeben.
- source_word: הִנֵּה
  choice: Sieh
  rationale: הִנֵּה lenkt feierlich die Aufmerksamkeit auf die folgende Aussage. »Sieh« bewahrt diese Funktion in einer knappen, verständlichen Form.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֵּינִי וּבֵינְךָ
  choice: zwischen mir und dir
  rationale: Die wörtliche räumliche Formulierung bleibt erhalten und lässt im Zusammenhang die Bedeutung Jahwes als Zeuge beziehungsweise Garant der Vereinbarung erkennen, ohne sie in den Text einzutragen.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die geläufige deutsche Wendung gibt die unbegrenzte, fortdauernde Geltung klar und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. »Jahwe« bewahrt dessen Charakter als persönlichen Namen.
- issue: Jahwe ist »zwischen« den beiden Männern
  choice: Die bildhafte Aussage bleibt wörtlich stehen.
  alternative: Jahwe ist für immer Zeuge oder Garant zwischen uns.
  rationale: Der Kontext legt die Rolle als Zeuge beziehungsweise Garant des Bundes nahe, doch der Ausgangstext benennt sie nicht ausdrücklich. Die wörtliche Fassung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Aufmerksamkeitspartikel wird mit »Sieh« wiedergegeben; Satzbau und Wortwahl bleiben gut verständlich, ohne den Bundescharakter erklärend in den Haupttext einzutragen.
