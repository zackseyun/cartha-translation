  text: וַ/יָּבֹ֤א הַ/נַּ֨עַר֙ עַד מְק֣וֹם הַ/חֵ֔צִי אֲשֶׁ֥ר יָרָ֖ה יְהוֹנָתָ֑ן וַ/יִּקְרָ֨א יְהוֹנָתָ֜ן אַחֲרֵ֤י הַ/נַּ֨עַר֙ וַ/יֹּ֔אמֶר הֲ/ל֥וֹא הַ/חֵ֖צִי מִמְּ/ךָ֥ וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: de
  text: 'Als der Junge an die Stelle kam, an der Jonatan den Pfeil geschossen hatte, rief Jonatan dem Jungen nach: »Ist der Pfeil nicht weiter von dir weg[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weiter an dir vorbei«; wörtlich: »von dir und weiter«.'
    reason: Die hebräische Wendung מִמְּךָ וָהָלְאָה bezeichnet räumlich ein Weitergehen über die angesprochene Person hinaus. Die Fußnote hält diese Nuance fest, ohne die Aussage über den Kontext hinaus zu deuten.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das narrative Wayyiqtol von בוא wird im deutschen Erzählstil natürlich mit dem Präteritum wiedergegeben.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר kann einen Jungen, jungen Mann oder Diener bezeichnen. Im unmittelbaren Zusammenhang ist Jonatans junger Gehilfe gemeint; »der Junge« ist natürlich und wahrt die Altersbezeichnung.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: zu der Stelle, wo der Pfeil lag
  rationale: עַד bezeichnet das Erreichen eines Ortes und מְקוֹם die Stelle. Die idiomatische Formulierung macht deutlich, dass es um den Fundort des Pfeils geht.
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: den Jonatan abgeschossen hatte
  rationale: ירה bezeichnet hier das Abschießen eines Pfeils. Das Plusquamperfekt ordnet die Handlung zeitlich vor dem Ankommen des Jungen ein.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: rief ... nach
  rationale: קרא mit אַחֲרֵי bedeutet, jemandem hinterher- beziehungsweise nachzurufen. Im Deutschen ist »dem Jungen nachrufen« idiomatisch.
- source_word: הֲלוֹא
  choice: nicht
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet; dies wird mit »nicht« bewahrt.
- source_word: הַחֵצִי
  choice: der Pfeil
  rationale: חֵץ bezeichnet im Kontext eindeutig einen Pfeil.
- source_word: מִמְּךָ וָהָלְאָה
  choice: noch weiter von dir entfernt
  rationale: Die Wendung bedeutet wörtlich etwa »von dir aus und weiter«. Die gewählte Formulierung gibt die räumliche Aussage natürlich wieder und erhält den Signalcharakter, ohne eine unnötig starre deutsche Konstruktion.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Syntax. Der rhetorische Zuruf bleibt als direkte Rede erhalten. Der Name יְהוֹנָתָן wird in der im modernen deutschen Bibelgebrauch verbreiteten Form »Jonatan« wiedergegeben.
