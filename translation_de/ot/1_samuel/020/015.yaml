source:
  edition: WLC
  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: de
  text: Und entziehe meinem Haus deine treue Liebe niemals, auch nicht, wenn Jahwe Davids Feinde, jeden Einzelnen, vom Erdboden ausrottet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Bundestreue“ beziehungsweise „deine beständige Liebe“. Das hebräische Wort חֶסֶד bezeichnet oft verlässliche Liebe und Treue innerhalb einer Bundesbeziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: entziehe / ausrottet
  rationale: Im ersten Satzteil bezeichnet כרת das Beenden loyaler Zuwendung, im zweiten die Vernichtung von Feinden. Unterschiedliche deutsche Verben geben beide Bedeutungen natürlich und präzise wieder; eine erzwungene gleiche Wiedergabe wäre im Deutschen missverständlich.
- source_word: חַסְדְּךָ
  choice: deine beständige Liebe
  rationale: חסד bezeichnet hier eine verlässliche, im Bundeskontext bewährte Liebe und Treue. „Beständige Liebe“ wahrt den Beziehungscharakter, ohne den Ausdruck auf einen technischen Bundesbegriff zu verengen.
- source_word: מֵעִם בֵּיתִי
  choice: meinem Haus
  rationale: „Haus“ bewahrt den familiären und dynastischen Sinn von בית; gemeint ist Jonatans Familie beziehungsweise Nachkommenschaft.
- source_word: עַד עוֹלָם
  choice: niemals
  rationale: In Verbindung mit der Verneinung gibt „niemals“ die dauerhafte Forderung idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: אֹיְבֵי דָוִד
  choice: Davids Feinde
  rationale: Die hebräische Genitivverbindung wird im Deutschen knapp und natürlich wiedergegeben.
- source_word: אִישׁ
  choice: jeden Einzelnen
  rationale: Das distributive אִישׁ hebt hervor, dass die Feinde ausnahmslos, einer nach dem anderen, betroffen sind.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: von der Erde
  rationale: Dies gibt die hebräische Wendung in natürlichem modernem Deutsch wieder, ohne den Sinn auf ein bestimmtes Land zu beschränken.
- source_word: וְלֹא ... וְלֹא
  choice: Und ... niemals ... auch dann nicht
  rationale: Die zweite Verneinung verstärkt und erweitert Jonatans Bitte auf die Zeit, in der Jahwe Davids Feinde beseitigt.
theological_decisions:
- issue: Bedeutung von חסד im Bundeskontext
  choice: „beständige Liebe“ mit dem Hinweis auf Bundestreue in der Fußnote
  alternative: „Bundestreue“, „treue Liebe“ oder „Güte“
  rationale: Der Bundeskontext verleiht חסד den Sinn verlässlicher Loyalität, doch der Ausdruck umfasst zugleich persönliche Liebe und Güte. Die Übersetzung hält diese Bedeutungsbreite offen.
- issue: Bezug des zweiten Satzteils
  choice: Jonatans Bitte gilt auch für die Zeit, in der Jahwe Davids Feinde ausrottet.
  alternative: Der zweite Satzteil ist eine nur lose verbundene oder parenthetische Aussage.
  rationale: Die wiederholte Verneinung und die Infinitivkonstruktion verbinden den Satzteil eng mit der Bitte und betonen, dass Jonatans Haus trotz des Gerichts an Davids Feinden verschont bleiben soll.
- issue: Distributive Funktion von אִישׁ
  choice: „jeden Einzelnen“
  alternative: „jeden Mann“ oder „sie alle“
  rationale: „Jeden Einzelnen“ bewahrt die individuelle und ausnahmslose Aussage des Hebräischen, ohne im Deutschen unnötig das Geschlecht zu betonen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den feierlichen Charakter der Bitte, bleibt aber ohne unnötige Hebraismen gut verständlich.
