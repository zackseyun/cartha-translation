  source_fidelity: Die Satzglieder und der zeitlich-emphatische Anschluss des zweiten Teils sind grundsätzlich zutreffend erfasst. Die unterschiedliche Wiedergabe von כרת ist im Deutschen vertretbar, doch „vom Erdboden ausrotten“ bildet die räumliche Wendung מֵעַל פְּנֵי הָאֲדָמָה genauer und idiomatischer ab als das im Entwurf etwas locker angehängte „von der Erde“.
