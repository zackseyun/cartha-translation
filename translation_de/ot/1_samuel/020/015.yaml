- from: Und entziehe meinem Haus niemals deine beständige Liebe[a], auch dann nicht, wenn Jahwe Davids Feinde ausrottet, jeden Einzelnen von der Erde.
  to: Und entziehe meinem Haus deine treue Liebe niemals, auch nicht, wenn Jahwe Davids Feinde, jeden Einzelnen, vom Erdboden ausrottet.[a]
  rationale: Die Revision verwendet für חסד die im Deutschen natürliche und den Bundeskontext angemessen offenhaltende Wendung „treue Liebe“. „Vom Erdboden ausrotten“ gibt die hebräische Bildsprache präziser wieder. Die Kommas markieren „jeden Einzelnen“ als distributive Apposition zu „Davids Feinde“. Die Fußnote wird an die neue Haupttextwahl angepasst.
