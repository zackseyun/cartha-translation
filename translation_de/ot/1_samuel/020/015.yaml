  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe des Tetragramms. „Treue Liebe“ gibt חסד im Bundeskontext natürlich wieder, ohne es auf einen rein technischen Begriff einzuengen. Die Fußnote bewahrt die tragfähige Alternative „Bundestreue“.
