base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: de
  text: Als der Junge angekommen war, erhob sich David von der Südseite her[a]. Er fiel mit dem Gesicht auf die Erde und verbeugte sich dreimal. Dann küssten sie einander und weinten miteinander, bis David mehr weinte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „von neben dem Süden/Negev“. Die hebräische Ortsangabe ist schwierig; manche verstehen sie im Zusammenhang als Hinweis auf den Erdhügel oder Stein bei Davids Versteck.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „bis David mehr weinte“. Die Wendung kann bedeuten, dass sein Weinen Jonatans Weinen übertraf oder noch stärker wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: Als der Junge angekommen war
  rationale: נַעַר bezeichnet hier Jonatans jungen Diener aus dem vorangehenden Zusammenhang. בָּא bedeutet wörtlich „kam/war gekommen“; die temporale Wiedergabe fügt sich natürlich in den deutschen Erzählfluss ein, ohne die schwierige Form in „fort war“ umzudeuten.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: von der Südseite her
  rationale: Die hebräische Ortsangabe ist schwierig. נֶגֶב bedeutet gewöhnlich „Süden“ oder „Negev“, und מֵאֵצֶל bezeichnet eine Bewegung von der Nähe beziehungsweise Seite eines Ortes weg. Die Übersetzung wahrt die räumliche Grundbedeutung; eine Fußnote nennt die kontextuell erwogene Deutung als Erdhügel oder Stein.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: Er fiel mit dem Gesicht zur Erde
  rationale: Die konkrete hebräische Wendung beschreibt, wie David sich mit dem Gesicht erdwärts niederwirft. Die Formulierung ist im Deutschen verständlich und bewahrt die körperliche Haltung.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: und verbeugte sich dreimal
  rationale: שׁחה bezeichnet hier ein ehrerbietiges Sich-Niederbeugen. „Verbeugte sich“ lässt den sozialen Sinn offen und vermeidet die stärker deutende Formulierung „huldigte“.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: Dann küssten sie einander
  rationale: Die reziproke Konstruktion wird idiomatisch mit „einander“ wiedergegeben. Der Kuss bleibt als übliche Geste der Zuneigung und des Abschieds ausdrücklich erhalten.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: und weinten miteinander
  rationale: Die reziproke Wendung wird in natürlichem Deutsch als gemeinsames, gegenseitig geteiltes Weinen ausgedrückt.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: bis David noch heftiger weinte
  rationale: גדל bedeutet grundsätzlich „groß werden/zunehmen“ und bezieht sich hier elliptisch auf das Weinen. Die Wiedergabe bringt die Steigerung zum Ausdruck, ohne ausdrücklich festzulegen, ob Davids Weinen das Jonatans übertraf oder lediglich an Intensität zunahm.
