  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יֵּצֵ֧א יְהוֹנָתָ֛ן הַ/שָּׂדֶ֖ה לְ/מוֹעֵ֣ד דָּוִ֑ד וְ/נַ֥עַר קָטֹ֖ן עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: de
  text: Am Morgen ging Jonatan hinaus aufs Feld zu der mit David vereinbarten Zeit[a], und ein kleiner Junge war bei ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dem vereinbarten Treffen mit David“. Das hebräische Wort kann sowohl eine festgesetzte Zeit als auch eine vereinbarte Zusammenkunft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein junger Diener“. Das hebräische Wort kann je nach Zusammenhang einen Jungen, jungen Mann oder Diener bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Am Morgen
  rationale: Die Erzählformel וַיְהִי führt das nächste Geschehen ein; im Deutschen genügt zusammen mit der Zeitangabe die natürliche Eröffnung „Am Morgen“.
- source_word: וַיֵּצֵא
  choice: ging … hinaus
  rationale: Bewahrt die Richtungsbedeutung von יצא und klingt im deutschen Erzählstil natürlich.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Gebräuchliche deutsche Schreibweise des hebräischen Namens.
- source_word: הַשָּׂדֶה
  choice: aufs Feld
  rationale: Gibt das bestimmte offene Gelände des erzählten Zusammenhangs knapp und idiomatisch wieder.
- source_word: לְמוֹעֵד דָּוִד
  choice: zu der mit David vereinbarten Zeit
  rationale: מוֹעֵד kann einen festgesetzten Zeitpunkt oder eine vereinbarte Zusammenkunft bezeichnen. Die zeitliche Wiedergabe ist syntaktisch gut möglich und lässt die kontextuell mitgemeinte Verabredung erkennen.
- source_word: וְנַעַר קָטֹן
  choice: ein kleiner Junge
  rationale: נַעַר bezeichnet je nach Zusammenhang einen Jungen, jungen Mann oder Diener; קָטֹן hebt hier seine geringe Jugend beziehungsweise Größe hervor.
- source_word: עִמּוֹ
  choice: begleitete ihn
  rationale: Die idiomatische deutsche Verbform gibt wieder, dass der Junge bei Jonatan war, ohne zusätzliche Handlung zu behaupten.
