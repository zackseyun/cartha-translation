  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen genau wieder: Jonatan ruft dem נער nach, die beiden dringlichen Eilaufforderungen bleiben getrennt, אַל תַּעֲמֹד wird kontextgerecht als „Bleib nicht stehen!“ wiedergegeben, und der Junge sammelt die im Kontext pluralisch gemeinten Pfeile ein und kehrt zu seinem Herrn zurück.'
