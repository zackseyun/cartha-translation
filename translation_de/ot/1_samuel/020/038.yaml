  terminology: „Jonatan“ entspricht der üblichen deutschen Namensform. „Junge“ und „Herr“ geben das soziale Verhältnis ohne unnötige Festlegung auf eine bestimmte Dienerbezeichnung wieder. „Pfeile“ ist angesichts des unmittelbaren Kontextes die sachlich richtige Wiedergabe der problematischen schriftlichen Form.
