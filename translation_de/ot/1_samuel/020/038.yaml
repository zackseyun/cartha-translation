source:
  edition: WLC
  text: וַ/יִּקְרָ֤א יְהֽוֹנָתָן֙ אַחֲרֵ֣י הַ/נַּ֔עַר מְהֵרָ֥ה ח֖וּשָׁ/ה אַֽל תַּעֲמֹ֑ד וַ/יְלַקֵּ֞ט נַ֤עַר יְהֽוֹנָתָן֙ אֶת ה/חצי וַ/יָּבֹ֖א אֶל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: de
  text: 'Und Jonatan rief dem Jungen nach: „Schnell! Beeil dich! Bleib nicht stehen![a]“ Da sammelte Jonatans Junge die Pfeile[b] ein und kam zu seinem Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Steh nicht!“ Gemeint ist hier: Halte nicht an.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Form für „Pfeile“ ist so geschrieben, dass sie wie ein Singular aussehen kann; der Zusammenhang spricht jedoch von den Pfeilen, die Jonatan abgeschossen hatte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא bezeichnet hier ein lautes Zurufen über eine gewisse Entfernung; „rief“ ist im Deutschen natürlich und lässt die Dringlichkeit durch die direkte Rede hervortreten.
- source_word: אַחֲרֵי הַנַּעַר
  choice: dem Jungen nach
  rationale: Die Verbindung mit קרא bedeutet idiomatisch, jemandem nachzurufen. „Junge“ bewahrt die Alters- und Rangnuance von נַעַר; seine Dienerrolle ergibt sich aus dem Zusammenhang.
- source_word: מְהֵרָה
  choice: Schnell!
  rationale: Das Adverb hat hier die Kraft einer dringenden Aufforderung. „Schnell!“ ist knapp und gegenwartssprachlich.
- source_word: חוּשָׁה
  choice: Beeil dich!
  rationale: Der Imperativ von חושׁ fordert zu raschem Handeln auf. Eine eigene Wiedergabe erhält die doppelte Dringlichkeit des Hebräischen.
- source_word: אַל תַּעֲמֹד
  choice: Bleib nicht stehen!
  rationale: Die Formulierung bleibt nahe am wörtlichen Bild von עמד und ist zugleich natürliches Deutsch; im Zusammenhang bedeutet sie, dass der Junge nicht anhalten soll.
- source_word: וַיְלַקֵּט
  choice: sammelte … ein
  rationale: לקט bezeichnet das Auflesen oder Einsammeln einzelner Gegenstände und passt zum Bergen der abgeschossenen Pfeile.
- source_word: נַעַר יְהוֹנָתָן
  choice: Jonatans Junge
  rationale: Die Genitivkonstruktion ordnet den Jungen Jonatan als seinem Herrn zu. Die Wiederholung von „Junge“ gibt die Wiederholung von נַעַר wieder, ohne ausdrücklich „Diener“ einzutragen.
- source_word: החצי
  choice: die Pfeile
  rationale: Obwohl die überlieferte Schreibform wie ein Singular erscheinen kann, verlangt der Erzählzusammenhang mehrere von Jonatan abgeschossene Pfeile.
- source_word: אֶל אֲדֹנָיו
  choice: zu seinem Herrn
  rationale: אָדוֹן bezeichnet hier den menschlichen Herrn des Jungen, nämlich Jonatan. „Herr“ ist im deutschen historischen Erzählregister die natürliche Bezeichnung für dieses Dienstverhältnis.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit knappen, dringlichen Zurufen. Die doppelte Aufforderung zur Eile und die Wiederholung von „Junge“ bleiben erhalten; altertümliche Wendungen wie „eile“ oder „säume nicht“ werden vermieden.
