  text: וְ/עָשִׂ֤יתָ חֶ֨סֶד֙ עַל עַבְדֶּ֔/ךָ כִּ֚י בִּ/בְרִ֣ית יְהוָ֔ה הֵבֵ֥אתָ אֶֽת עַבְדְּ/ךָ֖ עִמָּ֑/ךְ וְ/אִם יֶשׁ בִּ֤/י עָוֺן֙ הֲמִיתֵ֣/נִי אַ֔תָּה וְ/עַד אָבִ֖י/ךָ לָ/מָּה זֶּ֥ה תְבִיאֵֽ/נִי־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: de
  text: Erweise deinem Diener also Güte[a], denn du hast deinen Diener mit dir in den Bund Jahwes aufgenommen. Wenn aber Schuld an mir ist, dann töte du mich selbst. Warum solltest du mich zu deinem Vater bringen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erweise deinem Diener loyale Güte.“ Das hebräische Wort kann beständige Güte und Treue innerhalb einer verbindlichen, hier ausdrücklich bundeshaften Beziehung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד עַל עַבְדֶּךָ
  choice: Erweise deinem Diener also Güte
  rationale: חֶסֶד bezeichnet hier gütiges, loyales Handeln innerhalb einer verbindlichen Beziehung. „Güte erweisen“ ist natürliches, würdiges Deutsch; der folgende Bundessatz macht den Loyalitätsaspekt deutlich. Das einleitende וְ wird im Zusammenhang folgernd mit „also“ wiedergegeben.
- source_word: עַבְדֶּךָ
  choice: deinem/deinen Diener
  rationale: עֶבֶד dient hier als ehrerbietige Selbstbezeichnung Davids gegenüber Jonatan. „Diener“ bewahrt diese pragmatische Funktion besser als „Sklave“.
- source_word: בִּבְרִית יְהוָה
  choice: in den Bund Jahwes
  rationale: Die Präposition ב mit dem Hifil von בוא lässt sich zielgerichtet als Aufnahme „in den Bund“ ausdrücken. Der Bund steht unter Jahwes Namen und Autorität.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: du hast deinen Diener mit dir … aufgenommen
  rationale: Das Hifil von בוא bedeutet „bringen/hineinbringen“; im Deutschen gibt „in einen Bund aufnehmen“ den Vorgang idiomatisch wieder. עִמָּךְ („mit dir“) bleibt ausdrücklich erhalten.
- source_word: וְאִם יֶשׁ בִּי עָוֹן
  choice: Wenn aber Schuld an mir ist
  rationale: עָוֹן kann Vergehen, Schuld oder Schuldfolge bezeichnen. Hier geht es um Davids mögliche Schuld; die substantivische Form bewahrt die Ausdrucksweise und ihre leichte Offenheit.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: dann töte du mich selbst
  rationale: Der Hifil-Imperativ fordert die Tötung, während das ausdrücklich gesetzte אַתָּה die handelnde Person betont. „du … selbst“ bildet diesen Nachdruck ab.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: Warum solltest du mich zu deinem Vater bringen?
  rationale: Die rhetorische Frage fordert Jonatan auf, David gegebenenfalls selbst zu töten, statt ihn Saul auszuliefern. וְעַד hat hier die räumliche Bedeutung „bis zu/zu“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den persönlichen Bundesnamen; die deutsche Form „Jahwe“ ist verständlich und etabliert.
- issue: Bedeutungsumfang von חֶסֶד im Bundeskontext
  choice: Güte, mit Fußnote zur loyalen Bundestreue
  alternative: Bundestreue
  rationale: „Güte“ bewahrt den zwischenmenschlichen Charakter der Bitte, ohne חֶסֶד ausschließlich auf einen theologischen Fachbegriff festzulegen. Die Fußnote weist auf den durch den Folgesatz aktivierten Bundeskontext hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Davids ehrerbietige Selbstbezeichnung „dein Diener“ bleibt erhalten. Die Satzführung ist klar und mündlich nachvollziehbar; die Spannung zwischen persönlicher Güte und Bundestreue wird nicht einseitig aufgelöst.
