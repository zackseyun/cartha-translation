source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהֽוֹנָתָן֙ אֶל דָּוִ֔ד לְכָ֖/ה וְ/נֵצֵ֣א הַ/שָּׂדֶ֑ה וַ/יֵּצְא֥וּ שְׁנֵי/הֶ֖ם הַ/שָּׂדֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: de
  text: 'Da sagte Jonatan zu David[a]: »Komm, lass uns aufs Feld hinausgehen.« Und die beiden gingen aufs Feld hinaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Geh, lass uns aufs Feld hinausgehen.« Der Imperativ לְכָה bedeutet grundsätzlich »geh«, wird hier jedoch als Einladung zu einer gemeinsamen Bewegung gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; »Da sagte« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: אֶל דָּוִד
  choice: zu David
  rationale: Die Präposition אֶל bezeichnet hier die Ausrichtung der Rede auf David; »zu David« ist die natürliche deutsche Wiedergabe.
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ bedeutet formal »geh«, dient hier aber als Aufforderung an David, Jonatan zu begleiten; im Deutschen gibt »Komm« diese einladende Funktion natürlich wieder.
- source_word: וְנֵצֵא
  choice: lass uns ... hinausgehen
  rationale: Der Kohortativ der ersten Person Plural drückt einen gemeinsamen Vorschlag aus. »Lass uns« bewahrt diesen auffordernden Sinn.
- source_word: הַשָּׂדֶה
  choice: aufs Feld
  rationale: שָׂדֶה bezeichnet Feld oder freies Gelände. In Verbindung mit hinausgehen ist »aufs Feld« eine natürliche, knappe Wiedergabe; die Wiederholung des Zielorts bleibt erhalten.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: Und die beiden gingen ... hinaus
  rationale: Das narrative Waw setzt die Handlung fort. »Die beiden« wahrt die ausdrückliche Betonung, dass Jonatan und David gemeinsam hinausgingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählfolge und die Wiederholung von »aufs Feld« wurden bewahrt; direkte Rede steht in deutschen Anführungszeichen.
