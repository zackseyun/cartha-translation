base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: de
  text: 'Jonatan sagte: „Das sei dir fern! Wenn ich sicher wüsste, dass vonseiten meines Vaters feststand, dass Unheil über dich kommen sollte[a], würde ich es dir dann nicht mitteilen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „dass das Unheil vonseiten meines Vaters vollendet/festgelegt war, über dich zu kommen“. Der hebräische Ausdruck kann besagen, dass Sauls schädliche Absicht feststand oder vollständig ausgereift war.'
    reason: Bewahrt die lexikalische und syntaktische Mehrdeutigkeit von כָלְתָה הָרָעָה, ohne die Art des drohenden Unheils festzulegen.
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: Das sei dir fern!
  rationale: Die feste deutsche Wendung gibt die nachdrückliche Zurückweisung wieder und bewahrt zugleich den Dativ der zweiten Person לָּךְ, ohne ihn unbemerkt in „mir“ umzudeuten.
- source_word: כִּי אִם
  choice: Wenn
  rationale: Die Partikelfolge leitet hier den Bedingungssatz ein; „wenn“ ist im Deutschen klar und natürlich.
- source_word: יָדֹעַ אֵדַע
  choice: ich sicher wüsste
  rationale: Der Infinitivus absolutus verstärkt das finite Verb. „sicher“ bildet diesen Nachdruck in idiomatischem Deutsch ab; der Konjunktiv passt zur hypothetischen Aussage.
- source_word: כָלְתָה הָרָעָה
  choice: fest beschlossen hätte, Unheil … zu bringen
  rationale: Die Wiedergabe drückt im Kontext aus, dass die schädliche Absicht einen festen, ausgereiften Stand erreicht hat. Eine Fußnote bewahrt die ungewöhnlichere wörtliche Ausdrucksweise und ihre Bedeutungsbreite.
- source_word: מֵעִם אָבִי
  choice: mein Vater
  rationale: מֵעִם kennzeichnet den Vater als Ursprung der drohenden Schädigung. Die aktive deutsche Satzform macht diesen Zusammenhang natürlich verständlich.
- source_word: לָבוֹא עָלֶיךָ
  choice: Unheil über dich zu bringen
  rationale: Die Formulierung erhält die Bewegungsvorstellung von „über dich kommen“, macht aber im Deutschen deutlich, dass die Bedrohung von Sauls Absicht ausgeht.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: würde ich es dir dann nicht mitteilen?
  rationale: Als rhetorische Frage erwartet der Satz Zustimmung. „mitteilen“ gibt נגד in diesem persönlichen Zusammenhang angemessen wieder; „es“ nimmt das angekündigte Unheil auf.
theological_decisions:
- issue: Grad und Art von Sauls schädlicher Absicht
  choice: fest beschlossen hätte, Unheil über dich zu bringen
  alternative: das Böse sei von meinem Vater her vollendet / festgelegt, über dich zu kommen
  rationale: Der Haupttext gibt den wahrscheinlichen kontextuellen Sinn wieder, ohne die Bedrohung genauer als Tötungsplan oder bestimmte Tat festzulegen. Die Fußnote erhält die lexikalische und syntaktische Spannung des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das sei dir fern“ bewahrt den biblisch-feierlichen Nachdruck, bleibt aber verständlich. Der übrige Satz ist bewusst natürlich und mündlich formuliert; die ungewöhnliche Bildlichkeit und Mehrdeutigkeit der hebräischen Wendung wird in der Fußnote dokumentiert.
