  text: וַ/יֹּֽאמֶר ל֥/וֹ יְהוֹנָתָ֖ן מָחָ֣ר חֹ֑דֶשׁ וְ/נִפְקַ֕דְתָּ כִּ֥י יִפָּקֵ֖ד מוֹשָׁבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/018.yaml
  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: de
  text: 'Jonatan sagte zu ihm: „Morgen ist Neumond, und man wird dich vermissen, denn dein Platz wird leer sein.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und deine Abwesenheit wird auffallen, denn dein Platz wird unbesetzt sein.“ Im Hebräischen steht in beiden Satzteilen dasselbe Verb (פקד), wodurch ein Wortspiel entsteht, das sich im Deutschen nicht glatt nachbilden lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: sagte zu ihm
  rationale: Die übliche deutsche Wiedergabe des narrativen Wayyiqtol von אמר mit indirektem Objekt.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: מָחָר
  choice: Morgen
  rationale: Das Zeitadverb bezeichnet den folgenden Tag.
- source_word: חֹדֶשׁ
  choice: Neumond
  rationale: Im Zusammenhang des königlichen Festmahls bezeichnet das Wort die Neumondfeier, nicht bloß einen Monat.
- source_word: וְנִפְקַדְתָּ
  choice: man wird dich vermissen
  rationale: Der Nifal von פקד zeigt hier, dass Davids Abwesenheit bemerkt werden wird; die deutsche Formulierung ist natürlich und bewahrt den passiven Sinn.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung dafür ein, weshalb Davids Abwesenheit auffallen wird.
- source_word: יִפָּקֵד
  choice: wird leer sein
  rationale: Mit מוֹשָׁבֶךָ als Subjekt beschreibt die Form, dass Davids Platz unbesetzt sein wird. Eine wörtliche Wiederholung desselben deutschen Verbs wäre unnatürlich.
- source_word: מוֹשָׁבֶךָ
  choice: dein Platz
  rationale: Im Kontext des Mahls ist Davids Platz am Tisch gemeint; „Platz“ klingt hier natürlicher und ist etwas weniger eng als „Sitz“.
