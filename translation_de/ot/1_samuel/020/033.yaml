  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
translation:
  language: de
  text: Da schleuderte Saul den Speer nach ihm, um ihn zu treffen, und Jonatan erkannte, dass sein Vater entschlossen war[a], David zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass die Sache bei seinem Vater beschlossen war“. Die hebräische Wendung beschreibt einen von Saul gefassten, feststehenden Entschluss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּטֶל
  choice: schleuderte
  rationale: Das Verb bezeichnet Werfen; „schleuderte“ gibt hier die kraftvolle, feindselige Handlung natürlich wieder.
- source_word: הַחֲנִית
  choice: den Speer
  rationale: „Speer“ ist die geläufige und hinreichend breite deutsche Bezeichnung für die genannte Waffe.
- source_word: עָלָיו
  choice: nach ihm
  rationale: Bei einem Wurfgeschoss bezeichnet „nach ihm“ im Deutschen idiomatisch die feindselige Zielrichtung.
- source_word: לְהַכֹּתוֹ
  choice: um ihn zu treffen
  rationale: Der Infinitiv drückt den Zweck aus. „Treffen“ bewahrt hier die unmittelbare Bedeutung des beabsichtigten Schlages, ohne bereits ausdrücklich den Tod als Ergebnis zu nennen.
- source_word: וַיֵּדַע
  choice: erkannte
  rationale: Im erzählerischen Zusammenhang beschreibt das Verb, dass Jonatan aus Sauls Angriff Gewissheit über dessen Entschluss gewann; „erkannte“ ist dafür natürlicher als das statische „wusste“.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt von Jonatans Erkenntnis ein.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: es bei seinem Vater feststand
  rationale: Die hebräische Wendung stellt die Sache als von Sauls Seite aus abgeschlossen und entschieden dar. Die unpersönliche Formulierung bewahrt die Bildstruktur des Idioms besser als eine völlig aufgelöste Wiedergabe.
- source_word: לְהָמִית אֶת דָּוִד
  choice: David zu töten
  rationale: Dies gibt die kausative Tötungsabsicht direkt, klar und ohne unnötige Umschreibung wieder.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Übliche moderne deutsche Namensform.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Übliche deutsche Namensform.
- source_word: דָּוִד
  choice: David
  rationale: Übliche deutsche Namensform.
