  yaml_path: translation/ot/1_samuel/020/010.yaml
  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: de
  text: 'Da sagte David zu Jonatan: „Wer wird es mir sagen? Oder was, wenn dein Vater dir hart antwortet?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch sehr knapp: „Wer wird mir berichten? Oder was wird dein Vater dir hart antworten?“ Die zweite Frage ist syntaktisch verkürzt; die Übersetzung gibt ihren wahrscheinlichen Sinn in natürlichem Deutsch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter. „Da sagte“ gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: דָּוִד אֶל־יְהוֹנָתָן
  choice: David zu Jonatan
  rationale: Die Personennamen folgen der üblichen deutschen Schreibweise; אֶל bezeichnet hier den Adressaten der Rede.
- source_word: מִי יַגִּיד לִי
  choice: Wer wird es mir sagen?
  rationale: Das Hifil von נגד bedeutet „mitteilen, berichten, sagen“. Das Pronomen „es“ macht im Deutschen den aus dem Zusammenhang erschließbaren Inhalt idiomatisch kenntlich, ohne ihn näher festzulegen.
- source_word: אוֹ
  choice: Oder
  rationale: Die gewöhnliche disjunktive Bedeutung von אוֹ bleibt erhalten, obwohl der folgende hebräische Satz stark verkürzt ist.
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: was, wenn dein Vater dir hart antwortet?
  rationale: ענה bedeutet „antworten“; קָשָׁה („hart, streng“) beschreibt hier die Art der Antwort. „Was, wenn“ bewahrt מַה und macht die elliptische Sorge Davids in natürlichem Deutsch verständlich.
