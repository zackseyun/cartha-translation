source:
  edition: WLC
  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: de
  text: Und wenn ich noch lebe, wirst du mir nicht Jahwes Bundestreue[a] erweisen, damit ich nicht sterbe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwes Güte“ beziehungsweise „Jahwes beständige Liebe“. Die hebräische Verbindung kann auch unmittelbarer Jahwes eigene loyale Liebe bezeichnen, statt eine Bundestreue, die David in Jahwes Namen erweist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אִם
  choice: Und wenn
  rationale: Die ungewöhnliche Verbindung steht hier im Zusammenhang einer eindringlichen, als Frage formulierten Bitte. „Und wenn“ gibt den bedingenden Sinn natürlich wieder, ohne das Hebräische als bloße Verneinung misszuverstehen.
- source_word: עוֹדֶנִּי חָי
  choice: ich dann noch lebe
  rationale: „Noch lebe“ bewahrt die zeitliche Bedeutung von עוֹד; „dann“ verbindet die Bedingung im Deutschen natürlich mit der vorausgesetzten künftigen Situation.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: mir … erweisen
  rationale: Die Wendung bedeutet wörtlich etwa „mit mir tun/handeln“. Zusammen mit חֶסֶד ist „mir … erweisen“ idiomatisches, würdevolles Deutsch.
- source_word: חֶסֶד
  choice: Bundestreue
  rationale: Im Zusammenhang des Bundes zwischen Jonatan und David bezeichnet חֶסֶד verlässliche, loyale Güte. „Bundestreue“ hält diese Beziehungs- und Verpflichtungsdimension fest, ohne sie auf bloße Freundlichkeit zu reduzieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְלֹא אָמוּת
  choice: damit ich nicht sterbe
  rationale: Die negative Schlusswendung wird als Zweck beziehungsweise erhoffte Folge von Jonatans Bitte verstanden; „damit“ ist dafür im Deutschen klar und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text verwendet den persönlichen Gottesnamen; die Transliteration „Jahwe“ bewahrt dies sichtbar.
- issue: Bedeutung von חֶסֶד יְהוָה
  choice: Jahwes Bundestreue
  alternative: Jahwes Güte / beständige Liebe
  rationale: „Bundestreue“ entspricht dem konkreten Loyalitätszusammenhang zwischen Jonatan und David. Die Genitivverbindung kann jedoch auch unmittelbarer auf Jahwes eigene loyale Güte bezogen werden; diese Spannung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Bitte bleibt als Frage erhalten; die im Hebräischen ungewöhnliche Satzfügung wird lesbar gestaltet, ohne die in חֶסֶד יְהוָה liegende Deutungsbreite zu verdecken.
