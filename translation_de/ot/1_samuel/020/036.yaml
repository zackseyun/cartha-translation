  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ רֻ֗ץ מְצָ֥א נָא֙ אֶת הַ֣/חִצִּ֔ים אֲשֶׁ֥ר אָנֹכִ֖י מוֹרֶ֑ה הַ/נַּ֣עַר רָ֔ץ וְ/הֽוּא יָרָ֥ה הַ/חֵ֖צִי לְ/הַעֲבִרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: de
  text: 'Er sagte zu seinem jungen Diener: „Lauf und such bitte die Pfeile, die ich abschieße.“ Der junge Diener lief los, und er schoss den Pfeil an ihm vorbei.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über ihn hinaus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: zu seinem jungen Diener / der junge Diener
  rationale: נַעַר kann einen Jungen, jungen Mann oder Bediensteten bezeichnen. Im Erzählzusammenhang handelt es sich um Jonatans Begleiter; „junger Diener“ gibt sowohl Funktion als auch Altersnuance wieder.
- source_word: רוּץ
  choice: Lauf
  rationale: 'Der Imperativ bezeichnet konkret das Laufen und wird unmittelbar wieder aufgenommen: Der junge Diener lief los.'
- source_word: מְצָא נָא
  choice: such bitte
  rationale: מצא bedeutet hier, die abgeschossenen Pfeile zu suchen beziehungsweise aufzufinden; נא verleiht der Aufforderung eine höfliche oder leicht dringliche Nuance.
- source_word: הַחִצִּים
  choice: die Pfeile
  rationale: Der hebräische Ausdruck steht im Plural und wird direkt wiedergegeben.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: die ich abschieße
  rationale: Das Partizip von ירה bezeichnet die gegenwärtige beziehungsweise unmittelbar bevorstehende Handlung; das deutsche Präsens passt natürlich zum Ablauf.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: und er schoss den Pfeil
  rationale: Der Wechsel vom vorausgehenden Plural zum bestimmten Singular wird bewahrt. Das Pronomen bezieht sich im Zusammenhang auf Jonatan.
- source_word: לְהַעֲבִרוֹ
  choice: über ihn hinaus
  rationale: Die Hifil-Form von עבר mit Suffix drückt aus, dass der Pfeil den jungen Diener passieren und jenseits von ihm landen sollte. „Über ihn hinaus“ bewahrt die für das verabredete Signal wichtige Richtung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Junger Diener“ vermeidet das heute missverständliche „Junge“ und legt den Status nicht so stark fest wie „Knecht“. Die Wiederholung der Bezeichnung sowie der auffällige Wechsel von „Pfeile“ zu „den Pfeil“ folgen dem Hebräischen.
