- from: 'Er sagte zu seinem jungen Diener: „Lauf und such bitte die Pfeile, die ich abschieße.“ Der junge Diener lief los, und er schoss den Pfeil über ihn hinaus.[a]'
  to: 'Er sagte zu seinem jungen Diener: „Lauf und such bitte die Pfeile, die ich abschieße.“ Der junge Diener lief los, und er schoss den Pfeil an ihm vorbei.[a]'
  rationale: Die Hauptfassung ersetzt die potenziell missverständliche räumliche Wendung „über ihn hinaus“ durch „an ihm vorbei“, entsprechend der Bewegungsrichtung von לְהַעֲבִירוֹ. Die alternative deutsche Umschreibung bleibt als Fußnote erhalten. Sonst ist keine sichere Änderung erforderlich.
