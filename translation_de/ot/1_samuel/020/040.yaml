  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהֽוֹנָתָן֙ אֶת כֵּלָ֔י/ו אֶל הַ/נַּ֖עַר אֲשֶׁר ל֑/וֹ וַ/יֹּ֣אמֶר ל֔/וֹ לֵ֖ךְ הָבֵ֥יא הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: de
  text: 'Da gab Jonatan seine Waffen[a] dem jungen Diener[b] und sagte zu ihm: »Geh, bring sie[c] in die Stadt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann allgemeiner auch »Ausrüstung« oder »Gerät« bedeuten; der Zusammenhang mit Jonatans Bogen und Pfeilen spricht für »Waffen«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dem jungen Mann, der zu ihm gehörte«. Das Hebräische bezeichnet einen jungen Begleiter, der in Jonatans Dienst stand.'
    reason: lexical_alternative
  - marker: c
    text: Das Objekt von »bringen« bleibt im Hebräischen unausgesprochen. »Sie« ist aus dem Zusammenhang ergänzt und bezieht sich auf Jonatans Waffen beziehungsweise Ausrüstung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Die Erzählform von נתן wird neutral und unmittelbar mit dem deutschen Präteritum wiedergegeben.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Der Personenname folgt der im modernen Deutschen üblichen biblischen Schreibweise.
- source_word: כֵּלָיו
  choice: seine Waffen
  rationale: כְּלִי kann allgemein Gerät oder Ausrüstung bezeichnen; im unmittelbaren Zusammenhang mit Bogen und Pfeilen ist »Waffen« die treffendste Wiedergabe.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: dem jungen Diener
  rationale: נַעַר bezeichnet je nach Zusammenhang einen Jungen, jungen Mann oder Diener. אֲשֶׁר לוֹ kennzeichnet ihn als Jonatans persönlichen Untergebenen; »junger Diener« gibt diese Beziehung natürlich wieder, ohne einen bestimmten Rang festzulegen.
- source_word: וַיֹּאמֶר לוֹ
  choice: und sagte zu ihm
  rationale: אמר ist das gewöhnliche Verb für »sagen« und wird transparent wiedergegeben.
- source_word: לֵךְ
  choice: Geh
  rationale: Der Imperativ von הלך bedeutet schlicht »Geh«.
- source_word: הָבֵיא
  choice: bring sie
  rationale: Der Hifil von בוא bedeutet gewöhnlich »bringen«. Das im Hebräischen unausgesprochene Objekt wird im Deutschen aus dem Kontext als »sie« ergänzt.
- source_word: הָעִיר
  choice: in die Stadt
  rationale: Das bestimmte Substantiv bezeichnet die nahe gelegene Stadt; eine genauere Identifizierung bietet der Vers nicht.
