source:
  edition: WLC
  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: de
  text: 'Und sieh, ich werde den jungen Mann losschicken: »Geh und such die Pfeile!« Wenn ich dem jungen Mann ausdrücklich sage: »Sieh, die Pfeile liegen auf dieser Seite von dir; hol sie und komm her!«, dann bist du in Sicherheit, und es besteht keine Gefahr – so wahr Jahwe lebt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich: »Jahwe lebt«; eine hebräische Schwurformel, mit der die Zusicherung feierlich bekräftigt wird.'
    reason: kulturelle_anmerkung
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und dann
  rationale: הִנֵּה lenkt hier die Aufmerksamkeit auf den nächsten Schritt in Jonatans Plan. Im modernen deutschen Erzählfluss gibt „Und dann“ diese hinweisende und fortführende Funktion natürlicher wieder als das altertümliche „siehe“.
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: schicke ich den jungen Mann los
  rationale: נַעַר kann einen Jungen, jungen Mann oder Diener bezeichnen. „junger Mann“ bewahrt die Alters- beziehungsweise Statusangabe, ohne seine Funktion stärker festzulegen, als der Text es tut.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: Geh und such die Pfeile!
  rationale: Die beiden Imperativformen werden als natürliche deutsche Aufforderung wiedergegeben; מָצָא bezeichnet hier das Auffinden der abgeschossenen Pfeile.
- source_word: אִם אָמֹר אֹמַר
  choice: Wenn ich ihm ausdrücklich sage
  rationale: Der Infinitivus absolutus vor der finiten Verbform verstärkt die Aussage. „ausdrücklich“ gibt diese Hervorhebung idiomatisch wieder.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: Sieh, die Pfeile liegen diesseits von dir
  rationale: Die Wendung bezeichnet im Gegensatz zum folgenden Vers Pfeile, die aus Sicht des jungen Mannes auf Jonatans Seite beziehungsweise vor ihm liegen. „diesseits von dir“ erhält diese räumliche Signalwirkung.
- source_word: קָחֶנּוּ
  choice: hol sie
  rationale: Das Suffix ist formal singularisch, bezieht sich aber sachlich auf die zuvor genannten Pfeile; im Deutschen ist der Plural nötig. „hol“ passt zur Aufgabe, die abgeschossenen Pfeile einzusammeln.
- source_word: וָבֹאָה
  choice: dann komm
  rationale: Der Imperativ mit Richtungsendung bezeichnet eine Bewegung zum Sprecher hin. Im Zusammenhang ist die Aufforderung am plausibelsten an David gerichtet; die mögliche syntaktische Zuordnung wird in einer Fußnote offengelegt.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: denn du bist in Sicherheit
  rationale: שָׁלוֹם bezeichnet hier Davids unversehrtes Wohlergehen und damit seine Sicherheit. Die deutsche Formulierung macht die konkrete Bedeutung im Signalplan verständlich.
- source_word: וְאֵין דָּבָר
  choice: und dir droht nichts
  rationale: Wörtlich steht „und es gibt keine Sache/Angelegenheit“. Im Kontext ist gemeint, dass keine feindliche Absicht oder Gefahr vorliegt.
- source_word: חַי יְהוָה
  choice: so wahr Jahwe lebt
  rationale: Dies ist die übliche hebräische Schwurformel, die Jonatans Zusicherung feierlich bekräftigt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen und vermeidet, ihn ohne textliche Kennzeichnung durch einen Titel zu ersetzen.
- issue: Bezug der Aufforderung וָבֹאָה
  choice: 'als Aufforderung Jonatans an David: „dann komm“'
  alternative: 'als Teil der an den jungen Mann gerichteten Rede: „hol sie und komm“'
  rationale: Der Signalplan soll David anzeigen, ob er gefahrlos hervorkommen kann; daher passt die Aufforderung inhaltlich zu David. Da das Hebräische den Adressaten nicht ausdrücklich nennt, bleibt die alternative Abgrenzung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Direkte Rede und kurze Imperative erhalten die Anschaulichkeit des Signalplans. Altertümliche Wendungen wie „siehe“ und unnötig abstrakte Formulierungen wie „es liegt keine Sache vor“ werden vermieden; die syntaktische Mehrdeutigkeit beim Adressaten von וָבֹאָה wird nicht stillschweigend beseitigt, sondern durch Fußnote [a] dokumentiert.
