    rationale: Die Formulierung gibt vor allem zeitliche Abfolge wieder; וְהִנֵּה lenkt die Aufmerksamkeit auf den folgenden Schritt. „Und sieh“ bewahrt diese Funktion besser, ohne archaisch zu wirken.
