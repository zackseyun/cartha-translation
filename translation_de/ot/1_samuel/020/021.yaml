  terminology: „junger Mann“, „Pfeile“, „Sicherheit“ und „Jahwe“ sind angemessen. „so wahr Jahwe lebt“ gibt die Eidformel חַי־יְהוָה idiomatisch und inhaltlich zutreffend wieder. „Keine Gefahr“ erschließt das kontextuelle וְאֵין דָּבָר ohne unzulässige Lehrfestlegung.
