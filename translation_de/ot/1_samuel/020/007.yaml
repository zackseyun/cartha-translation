revisions:
- from: 'Wenn er sagt: »Gut«, dann ist dein Diener in Sicherheit. Wenn er aber sehr zornig wird, dann wisse: Das Unheil steht für ihn fest.[a]'
  to: 'Wenn er sagt: »Gut«, dann geht es deinem Diener gut. Wenn er aber sehr zornig wird, dann wisse: Er hat das Unheil fest beschlossen.[a]'
  rationale: Die Revision gibt שָׁלוֹם mit dem weiteren, im Deutschen idiomatischen »geht es ... gut« wieder und macht im Schlusssatz klar, dass das Unheil Sauls fest gefasster Entschluss ist. Die Fußnote hält die ungewöhnliche quellenbezogene Formulierung des Hebräischen fest. »Dein Diener« bleibt als Jonathans höfische Selbstbezeichnung erhalten.
