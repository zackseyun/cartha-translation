  text: אִם כֹּ֥ה יֹאמַ֛ר ט֖וֹב שָׁל֣וֹם לְ/עַבְדֶּ֑/ךָ וְ/אִם חָרֹ֤ה יֶֽחֱרֶה֙ ל֔/וֹ דַּ֕ע כִּֽי כָלְתָ֥ה הָ/רָעָ֖ה מֵ/עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: de
  text: 'Wenn er sagt: »Gut«, dann geht es deinem Diener gut. Wenn er aber sehr zornig wird, dann wisse: Er hat das Unheil fest beschlossen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Das Unheil ist von ihm her vollendet/beschlossen.« Gemeint ist, dass Saul fest entschlossen ist, Unheil anzurichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Gut
  rationale: Das prädikativ und elliptisch gebrauchte Adjektiv bildet hier eine knappe zustimmende Antwort Sauls; »Gut« ist im Deutschen natürlich und bewahrt die Kürze.
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: dann ist dein Diener in Sicherheit
  rationale: שָׁלוֹם bezeichnet hier Davids Wohlergehen und besonders seine Sicherheit vor Saul. Die präsentische Formulierung hat im konditionalen Zusammenhang folgernden, zukunftsbezogenen Sinn.
- source_word: לְעַבְדֶּךָ
  choice: dein Diener
  rationale: Jonathan bezeichnet David gegenüber sich selbst demütig in der dritten Person; »Diener« gibt diese höfische Redeweise angemessen wieder.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: er aber sehr zornig wird
  rationale: Infinitivus absolutus und finites Verb verstärken gemeinsam die Aussage. »Sehr zornig wird« gibt diese Intensivierung verständlich wieder.
- source_word: דַּע
  choice: dann wisse
  rationale: Der Imperativ fordert David auf, aus Sauls Reaktion eine sichere Folgerung zu ziehen.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: Das Unheil steht für ihn fest
  rationale: כָלְתָה beschreibt hier einen zum Abschluss gekommenen, festen Entschluss; הָרָעָה bezeichnet das von Saul ausgehende beabsichtigte Unheil. Die Formulierung bewahrt dabei die ungewöhnliche Quellenangabe מֵעִמּוֹ, ohne sie völlig zu glätten.
theological_decisions:
- issue: Ob der Satz Sauls moralische Bosheit, einen fest beschlossenen Schaden oder bereits feststehendes Unheil bezeichnet
  choice: Das Unheil steht für ihn fest
  alternative: Er ist fest entschlossen, dir Böses anzutun
  rationale: Der hebräische Text nennt ausdrücklich הָרָעָה und lässt das konkrete Tun unausgesprochen. Die Übersetzung erhält diese Offenheit, während die Fußnote den kontextuellen Sinn erläutert.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede bleibt knapp; »dein Diener« bewahrt Jonathans demütige Selbstbezeichnung. Die Fußnotenmarke steht unmittelbar bei der erklärungsbedürftigen Schlussaussage.
