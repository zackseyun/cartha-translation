base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/024.yaml
  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: de
  text: David versteckte sich da auf dem Feld. Als der Neumond kam, setzte sich der König zum Essen nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „setzte sich über das Brot, um zu essen“; „Brot“ steht hier für die Mahlzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: versteckte sich
  rationale: 'Der Nifal von סתר ist hier im Zusammenhang reflexiv beziehungsweise intransitiv zu verstehen: David bringt sich absichtlich in ein Versteck.'
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שָׂדֶה bezeichnet gewöhnlich ein Feld oder freies Gelände. „Auf dem Feld“ ist die direkte und im Deutschen natürliche Wiedergabe.
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: Als der Neumond kam
  rationale: הַחֹדֶשׁ bezeichnet hier den Neumond beziehungsweise den dadurch markierten Festtag. Die temporale Formulierung fügt sich natürlich in die Erzählung ein, ohne ausdrücklich mehr als den hebräischen Text festzulegen.
- source_word: וַיֵּשֶׁב
  choice: setzte sich … nieder
  rationale: ישׁב bezeichnet hier das Einnehmen des Sitzplatzes zum Essen; „sich niedersetzen“ gibt diesen Vorgang idiomatisch wieder.
- source_word: עַל הַלֶּחֶם
  choice: zum Essen
  rationale: Wörtlich steht „über/bei dem Brot“. „Brot“ bezeichnet hier metonymisch die Mahlzeit; „zum Essen“ gibt den gemeinten Vorgang in natürlichem Deutsch wieder.
- source_word: לֶאֱכֹל
  choice: zum Essen
  rationale: Der Infinitiv bezeichnet den Zweck des Niedersetzens. Im Deutschen lässt er sich zusammen mit der vorangehenden Wendung knapp als „zum Essen“ ausdrücken.
- source_word: דָּוִד
  choice: David
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel verweist im Zusammenhang auf Saul; da der hebräische Text den Titel verwendet, wird er nicht durch den Eigennamen ersetzt.
