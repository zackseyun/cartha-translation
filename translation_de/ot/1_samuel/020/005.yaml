  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוֹנָתָ֗ן הִֽנֵּה חֹ֨דֶשׁ֙ מָחָ֔ר וְ/אָנֹכִ֛י יָשֹׁב אֵשֵׁ֥ב עִם הַ/מֶּ֖לֶךְ לֶ/אֱכ֑וֹל וְ/שִׁלַּחְתַּ֨/נִי֙ וְ/נִסְתַּרְתִּ֣י בַ/שָּׂדֶ֔ה עַ֖ד הָ/עֶ֥רֶב הַ/שְּׁלִשִֽׁית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: de
  text: 'David sagte zu Jonatan: „Sieh, morgen ist Neumond[b], und ich soll mit dem König beim Essen sitzen. Doch lass mich gehen, damit ich mich bis zum dritten Abend[a] auf dem Feld verstecken kann.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Abend des dritten Tages“. Die hebräische Wendung ist verkürzt.'
    reason: lexical_alternative
  - marker: b
    text: Der Neumond wurde jeden Monat begangen und war häufig mit einem besonderen Mahl verbunden.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel weist Jonatan nachdrücklich auf die unmittelbar bevorstehende Situation hin; „Sieh“ bewahrt diese Funktion in knapper, würdiger Form.
- source_word: חֹדֶשׁ מָחָר
  choice: morgen ist Neumond
  rationale: חֹדֶשׁ bezeichnet hier im Zusammenhang mit dem königlichen Mahl den Neumond beziehungsweise dessen monatliche Feier, nicht lediglich einen neuen Kalendermonat.
- source_word: יָשֹׁב אֵשֵׁב
  choice: ich soll … sitzen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb unterstreicht die feste Erwartung, dass David am Mahl teilnimmt. „Ich soll“ gibt diese soziale Verpflichtung wieder, ohne daraus ausdrücklich ein moralisches Gebot zu machen.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: mit dem König beim Essen sitzen
  rationale: Die Formulierung bewahrt sowohl das Sitzen beim König als auch den Zweck beziehungsweise Anlass des Essens und klingt im Deutschen natürlich.
- source_word: וְשִׁלַּחְתַּנִי
  choice: Doch lass mich gehen
  rationale: Wörtlich steht „und schicke mich fort“. Im Kontext bittet David Jonatan um die Erlaubnis, dem Mahl fernzubleiben; „lass mich gehen“ gibt die pragmatische Bedeutung idiomatisch wieder.
- source_word: וְנִסְתַּרְתִּי
  choice: damit ich mich … verstecken kann
  rationale: Die Verbfolge kann nach der vorausgehenden Bitte zielgerichtet beziehungsweise volitiv verstanden werden. „Damit“ macht Davids beabsichtigtes Handeln deutlich, ohne mehr als den Kontext festzulegen.
- source_word: בַשָּׂדֶה
  choice: auf dem Feld
  rationale: „Auf dem Feld“ ist die natürliche deutsche Entsprechung und bewahrt das konkrete Ortsbild.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: bis zum dritten Abend
  rationale: Die hebräische Wendung ist elliptisch. Die knappe, formnahe Wiedergabe erhält diese Eigenart; die wahrscheinlich gemeinte zeitliche Einordnung wird in der Fußnote erläutert.
