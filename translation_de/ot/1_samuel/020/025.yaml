base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: de
  text: Der König setzte sich wie gewöhnlich auf seinen Platz an der Wand. Jonatan stand auf, und Abner setzte sich neben Saul; Davids Platz aber blieb leer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Davids Platz fehlte“, das heißt, sein vorgesehener Platz beim Mahl war unbesetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der hebräische Text verwendet den bestimmten Titel und nennt Saul an dieser Stelle nicht beim Namen.
- source_word: מוֹשָׁבוֹ
  choice: seinen Platz
  rationale: Im Zusammenhang des gemeinsamen Essens bezeichnet das Wort den Sitzplatz des Königs, nicht seinen Wohnort.
- source_word: כְּפַעַם בְּפַעַם
  choice: wie gewöhnlich
  rationale: Die idiomatische Wendung verweist auf das bei früheren Gelegenheiten übliche Verhalten.
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: an der Wand
  rationale: Die Wendung lokalisiert den Platz des Königs bei der Wand; die knappe deutsche Formulierung vermeidet die unnatürliche Wiederholung „auf dem Platz an der Wand“.
- source_word: וַיָּקָם יְהוֹנָתָן
  choice: Jonatan stand auf
  rationale: Die einfache Erzählform von קום wird direkt wiedergegeben, ohne den im masoretischen Text nicht erklärten Anlass zu ergänzen.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: Abner setzte sich neben Saul
  rationale: מִצַּד bezeichnet die räumliche Lage an Sauls Seite; „neben“ ist die natürliche deutsche Entsprechung.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: Davids Platz aber blieb leer
  rationale: Die passive Form von פקד besagt hier, dass Davids erwarteter Platz beziehungsweise dessen Inhaber fehlte. „Blieb leer“ gibt die Situation beim Mahl natürlich wieder, während die wörtlichere Alternative in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die beiden Formen von ישב werden im Deutschen idiomatisch mit „setzte sich“ wiedergegeben. Die auffällige Aussage, dass Jonatan aufstand, bleibt ohne harmonisierende Erklärung stehen.
