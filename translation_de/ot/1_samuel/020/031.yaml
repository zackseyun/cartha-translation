  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: de
  text: Denn solange der Sohn Isais auf der Erde lebt, werden weder du noch dein Königtum Bestand haben. Darum schick jetzt jemanden los und lass ihn zu mir bringen; denn er ist ein Sohn des Todes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräische Redewendung für jemanden, der den Tod verdient oder dem Tod verfallen ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Sauls Begründung für seinen Zorn und seinen anschließenden Befehl ein.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: solange
  rationale: Gibt die hebräische Zeitdauer idiomatisch und präzise wieder.
- source_word: בֶּן יִשַׁי
  choice: der Sohn Isais
  rationale: Bewahrt Sauls distanzierende und verächtliche Bezeichnung Davids durch den Namen seines Vaters.
- source_word: חַי עַל הָאֲדָמָה
  choice: auf der Erde lebt
  rationale: Folgt dem räumlichen Ausdruck des Hebräischen, ohne ihn unnötig auf das Land Israel einzuengen.
- source_word: לֹא תִכּוֹן
  choice: wirst … Bestand haben
  rationale: Gibt die resultative Bedeutung von כון im Nifal natürlich wieder und lässt sich im Deutschen auf Jonathan und sein Königtum beziehen.
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: weder du noch dein Königtum
  rationale: Die koordinierte Verneinung ist im Deutschen idiomatisch; „Königtum“ bezeichnet hier besonders Jonatans dynastische Königsherrschaft.
- source_word: וְעַתָּה
  choice: Darum … jetzt
  rationale: Macht sowohl die Folgerung aus dem Vorhergehenden als auch die Dringlichkeit des Befehls deutlich.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: schick … jemanden los und lass ihn zu mir bringen
  rationale: Gibt die Abfolge von Aussenden und Herbeibringen in natürlichem Deutsch wieder; das Objekt des Aussendens bleibt im Hebräischen unausgesprochen und wird im Deutschen nur grammatisch ergänzt.
- source_word: בֶּן מָוֶת הוּא
  choice: er ist ein Sohn des Todes
  rationale: Bewahrt das markante hebräische Bild und damit die mögliche Spannung zwischen Todeswürdigkeit und dem Verfallensein an den Tod; die Fußnote erläutert die Bedeutung.
theological_decisions:
- issue: Bedeutung von בֶּן מָוֶת
  choice: Das Bild „Sohn des Todes“ bleibt im Haupttext stehen.
  alternative: „Er verdient den Tod“ oder „Er ist dem Tod verfallen“.
  rationale: Die idiomatischen Alternativen legen jeweils stärker entweder Schuld beziehungsweise Todeswürdigkeit oder ein bevorstehendes Schicksal fest. Die wörtlichere Fassung bewahrt die Bedeutungsbreite des Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Der Sohn Isais“ erhält Sauls rhetorische Distanzierung. „Königtum“ betont die dynastische Herrschaft stärker als das territorial klingende „Königreich“. Die ungewöhnliche Wendung „Sohn des Todes“ wird wegen ihrer Mehrdeutigkeit bewahrt und in der Fußnote erklärt.
