source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: de
  text: 'Er sagte: »Lass mich bitte gehen, denn wir haben in der Stadt ein Familienopfer, und mein Bruder selbst hat mir den Auftrag gegeben. Wenn ich nun Gunst in deinen Augen gefunden habe, lass mich bitte fortkommen[a] und meine Brüder[b] sehen.« Darum ist er nicht an den Tisch des Königs gekommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »lass mich bitte entkommen«. Das hebräische Verb kann ein Entrinnen oder ein unauffälliges Fortgehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit »meine Brüder« können Davids leibliche Brüder oder weiter gefasst seine männlichen Verwandten innerhalb der Sippe gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: Lass mich bitte gehen
  rationale: Die Bitte mit שׁלח und dem Höflichkeitspartikel נָא wird im modernen Deutschen natürlich als Bitte um Erlaubnis zum Weggehen wiedergegeben.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: Familienopfer
  rationale: Bewahrt sowohl den kultischen Sinn von זֶבַח als auch die Zuordnung zur Familie beziehungsweise Sippe.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe; welche Stadt gemeint ist, wird nicht ergänzt.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: und mein Bruder hat es mir ausdrücklich aufgetragen
  rationale: Das selbstständige Pronomen הוּא setzt Nachdruck; „ausdrücklich“ macht diese Betonung im Deutschen hörbar, ohne ein unnatürliches „selbst“ zu erzwingen. צוה wird als verbindliches Auftragen wiedergegeben.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: wenn ich nun Gunst in deinen Augen gefunden habe
  rationale: Die hebräische Höflichkeitsformel und ihr Bild bleiben erhalten; וְעַתָּה wird knapp durch „nun“ aufgenommen.
- source_word: אִמָּלְטָה נָּא
  choice: lass mich bitte fortkommen
  rationale: מלט kann Entrinnen oder diskretes Fortgehen bezeichnen. „Fortkommen“ wahrt hier die Bitte um ein Weggehen, ohne zwingend eine akute Fluchtlage festzulegen.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: und meine Brüder sehen
  rationale: Folgt dem wörtlichen Sinn von ראה und bewahrt die mögliche Bedeutung von אחים als leibliche Brüder oder männliche Verwandte.
- source_word: עַל כֵּן לֹא בָא
  choice: Darum ist er nicht ... gekommen
  rationale: Gibt die Folgerung und den vollendeten Vorgang mit gegenwärtigem Ergebnis natürlich wieder.
- source_word: אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: an den Tisch des Königs
  rationale: Im Deutschen ist „an den Tisch kommen“ für die Teilnahme am königlichen Mahl idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt nah an der hebräischen Satzführung, wird aber idiomatisch gegliedert. Die kultische Bezeichnung „Familienopfer“ sowie die traditionelle Höflichkeitsformel „Gunst in deinen Augen“ bewahren zentrale Bilder des Ausgangstextes.
