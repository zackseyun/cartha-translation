  to: 'Er sagte: »Lass mich bitte gehen, denn wir haben in der Stadt ein Familienopfer, und mein Bruder selbst hat mir den Auftrag gegeben. Wenn ich nun Gunst in deinen Augen gefunden habe, lass mich bitte fortkommen[a] und meine Brüder[b] sehen.« Darum ist er nicht an den Tisch des Königs gekommen.'
