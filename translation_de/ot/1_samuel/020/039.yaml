id: 1SA.20.39
reference: 1 Samuel 20:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/נַּ֖עַר לֹֽא יָדַ֣ע מְא֑וּמָה אַ֤ךְ יְהֽוֹנָתָן֙ וְ/דָוִ֔ד יָדְע֖וּ אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: de
  text: Doch der Junge wusste von nichts; nur Jonatan und David wussten, worum es ging.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Sache“. Das hebräische Wort דָּבָר kann eine Sache, eine Angelegenheit oder hier auch die getroffene Absprache bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Doch der Junge
  rationale: נַעַר bezeichnet hier Jonatans jungen Begleiter. Das וְ wird wegen des Gegensatzes zwischen seiner Unkenntnis und dem Wissen Jonatans und Davids adversativ mit „Doch“ wiedergegeben.
- source_word: לֹא יָדַע מְאוּמָה
  choice: wusste von nichts
  rationale: In der Verneinung bedeutet מְאוּמָה „irgendetwas/überhaupt etwas“. „Von nichts wissen“ ist eine natürliche deutsche Wiedergabe und bewahrt den Gegensatz zum folgenden יָדְעוּ.
- source_word: אַךְ
  choice: nur
  rationale: 'אַךְ hat hier einschränkende, ausschließende Funktion: Nur Jonatan und David kannten den Sachverhalt.'
- source_word: יְהוֹנָתָן וְדָוִד
  choice: Jonatan und David
  rationale: Die Namen werden nach gebräuchlicher deutscher Bibeltradition wiedergegeben.
- source_word: יָדְעוּ
  choice: wussten
  rationale: Dasselbe deutsche Verb wie im ersten Satzteil erhält die deutliche Gegenüberstellung des hebräischen יָדַע und יָדְעוּ.
- source_word: אֶת־הַדָּבָר
  choice: worum es ging
  rationale: דָּבָר ist semantisch weit und bezeichnet hier die nur Jonatan und David bekannte Sache beziehungsweise Absprache. Die idiomatische Formulierung vermeidet eine unnatürliche Übersetzung mit „das Ding“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Gegenüberstellung zwischen dem unwissenden Jungen und den beiden Eingeweihten bleibt erhalten.
