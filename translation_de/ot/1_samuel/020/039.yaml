  source_fidelity: 'Der Text gibt die hebräische Gegenüberstellung präzise wieder: Der junge Begleiter wusste nichts, während ausschließlich Jonatan und David die betreffende Sache kannten. „Doch“ gibt die kontextuell adversative Funktion von וְ angemessen wieder; „nur“ trifft die Exklusivität von אַךְ.'
