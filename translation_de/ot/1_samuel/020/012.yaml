base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: de
  text: 'Jonatan sagte zu David: »So wahr Jahwe, der Gott Israels, lebt:[a] Wenn ich morgen um diese Zeit oder am dritten Tag[b] meinen Vater ausgefragt habe und sich zeigt, dass er David wohlgesinnt ist, werde ich dir dann nicht Nachricht schicken und es dir mitteilen?[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Satz ist an dieser Stelle verkürzt und schwierig. Gemeint ist offenbar eine feierliche Schwur- oder Bekräftigungsformel, die Jahwe als Zeugen anruft.
    reason: textual_difficulty
  - marker: b
    text: 'Oder: „morgen um diese Zeit, am dritten Tag“. Die hebräische Zeitangabe ist stark verdichtet.'
    reason: alternative_reading
  - marker: c
    text: 'Hebräisch wörtlich: „dein Ohr aufdecken“, eine Redewendung für „es dir sagen“ oder „es dir offenbaren“. Die negierte Form kann auch als Teil des Schwurs verstanden werden: „wenn ich dann nicht Nachricht zu dir schicke und es dir mitteile …“'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי
  choice: So wahr … lebt
  rationale: Das כִּי steht hier in einer elliptischen Schwurformel nach der Anrufung Gottes; die gewählte Form gibt ihren feierlichen Zusagecharakter idiomatisch wieder.
- source_word: אֶחְקֹר אֶת אָבִי
  choice: meinen Vater ausgefragt habe
  rationale: חקר bezeichnet hier Jonatans behutsames Erkunden der Haltung Sauls. Das deutsche Perfekt im Nebensatz drückt aus, dass dieses Erkunden vor der anschließenden Mitteilung abgeschlossen sein wird.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: morgen um diese Zeit oder am dritten Tag
  rationale: Die hebräische Zeitangabe ist stark verdichtet. Die Übersetzung macht die im Kontext naheliegende zeitliche Staffelung verständlich, ohne die alternative syntaktische Deutung zu verschweigen.
- source_word: וְהִנֵּה טוֹב אֶל דָּוִד
  choice: und sich zeigt, dass er David wohlgesinnt ist
  rationale: הִנֵּה markiert das sich ergebende Resultat; טוֹב אֶל beschreibt in diesem Zusammenhang Sauls günstige Haltung gegenüber David.
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: werde ich dann nicht nach dir schicken
  rationale: Die rhetorische Frage wahrt die schwierige masoretische Formulierung mit לֹא und bringt Jonatans feste Zusicherung zum Ausdruck.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: und es dir mitteilen
  rationale: Die wörtliche Wendung „dein Ohr aufdecken“ ist ein hebräisches Idiom für vertrauliches Offenbaren oder Mitteilen; eine idiomatische deutsche Wiedergabe ist im Haupttext klarer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als solcher erkennbar gehalten und nicht durch einen Herrschaftstitel ersetzt.
- issue: Elliptische Schwurformel nach der Anrufung Gottes
  choice: So wahr Jahwe, der Gott Israels, lebt
  alternative: Jahwe, der Gott Israels, sei Zeuge
  rationale: Der überlieferte hebräische Satz lässt einen Bestandteil der Schwurformel unausgesprochen. Die gewählte Ergänzung entspricht einem geläufigen biblischen Schwurtyp, während die Ellipse in einer Fußnote kenntlich gemacht wird.
- issue: Negierte Zusage וְלֹא אָז אֶשְׁלַח
  choice: 'rhetorische Frage: „werde ich dann nicht …?“'
  alternative: 'Schwurbedingung: „wenn ich dann nicht …“'
  rationale: Beide Analysen sind grammatisch möglich. Die rhetorische Frage passt zum Gesprächsfluss, ohne die alternative Einbindung in die Schwurformel als sicher auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt feierlich, wird aber durch natürliche deutsche Wendungen verständlich gehalten. Die Ellipse der Schwurformel, die verdichtete Zeitangabe und die schwierige Negation werden nicht stillschweigend vereindeutigt, sondern in den Fußnoten offengelegt.
