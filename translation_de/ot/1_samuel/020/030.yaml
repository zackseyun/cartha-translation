base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: de
  text: 'Da entbrannte Sauls Zorn gegen Jonatan, und er sagte zu ihm: »Du Sohn einer verkehrten, widerspenstigen Frau![a] Weiß ich nicht, dass du dich für den Sohn Isais entschieden hast[b] – zu deiner eigenen Schande und zur Schande der Blöße deiner Mutter?[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du Sohn der Verkehrtheit und Widerspenstigkeit!« Die hebräische Beschimpfung ist schwierig und stark idiomatisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: »dass du auf der Seite des Sohnes Isais stehst«.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung »die Schande der Blöße deiner Mutter« ist ein besonders grober hebräischer Ausdruck für die Entehrung der Familie.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: Da entbrannte Sauls Zorn gegen Jonatan
  rationale: Die hebräische Wendung bezeichnet aufflammenden Zorn. „Entbrannte“ bewahrt das anschauliche Bild, ohne das idiomatische אַף wörtlich als „Nase“ wiederzugeben; בְּ bezeichnet hier die Zielrichtung des Zorns.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: Du Sohn einer verkehrten, widerspenstigen Frau!
  rationale: Die schwierige, stark idiomatische Beschimpfung verbindet Verkehrtheit und Auflehnung. Die Ergänzung „Frau“ macht den im Kontext folgenden Angriff auf Jonatans Mutter im Deutschen verständlich, ohne die genaue Bedeutung als sicherer auszugeben, als sie ist.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Weiß ich nicht
  rationale: Die rhetorische Negativfrage wird beibehalten und erhält so Sauls konfrontativen Ton.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: du dich für den Sohn Isais entschieden hast
  rationale: בחר bedeutet grundsätzlich „wählen/sich entscheiden“. Die reflexive Formulierung gibt im Deutschen zugleich den kontextuellen Sinn des Partei-Ergreifens wieder, ohne ihn zur einzigen möglichen Deutung zu machen.
- source_word: לְבָשְׁתְּךָ
  choice: zu deiner eigenen Schande
  rationale: Die Wendung bezeichnet das Ergebnis als persönliche Schande; „eigenen“ verdeutlicht den Bezug auf Jonatan.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: und zur Schande der Blöße deiner Mutter
  rationale: „Blöße“ bewahrt den konkreten und anstößigen Gehalt von עֶרְוָה sowie den Gedanken familiärer Entehrung. Die ungewöhnliche Härte des Hebräischen wird nicht geglättet.
