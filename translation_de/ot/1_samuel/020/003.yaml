  text: וַ/יִּשָּׁבַ֨ע ע֜וֹד דָּוִ֗ד וַ/יֹּ֨אמֶר֙ יָדֹ֨עַ יָדַ֜ע אָבִ֗י/ךָ כִּֽי מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וַ/יֹּ֛אמֶר אַל יֵֽדַע זֹ֥את יְהוֹנָתָ֖ן פֶּן יֵֽעָצֵ֑ב וְ/אוּלָ֗ם חַי יְהוָה֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ כִּ֣י כְ/פֶ֔שַׂע בֵּינִ֖/י וּ/בֵ֥ין הַ/מָּֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: de
  text: 'Doch David schwor noch einmal und sagte: „Dein Vater weiß ganz genau, dass ich in deinen Augen Gunst gefunden habe, und er hat gesagt: ‚Jonatan soll das nicht erfahren, damit er nicht betrübt wird.‘ Doch so wahr der HERR lebt und so wahr du lebst: Zwischen mir und dem Tod liegt nur ein Schritt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: weiß ganz genau
  rationale: Der absolute Infinitiv mit finitem Verb verstärkt die Aussage; die idiomatische deutsche Wiedergabe bewahrt diesen Nachdruck.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: ich in deinen Augen Gunst gefunden habe
  rationale: Bewahrt das hebräische Bild und ist im gehobenen modernen Deutsch verständlich.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: Jonatan darf das nicht erfahren
  rationale: Gibt den verneinten Jussiv natürlich wieder; „erfahren“ entspricht in diesem Zusammenhang dem Bekanntwerden einer Sache besser als bloßes „wissen“.
- source_word: חַי יְהוָה
  choice: so wahr der HERR lebt
  rationale: Traditionelle und natürliche deutsche Schwurformel; das Tetragramm wird entsprechend deutscher Bibelkonvention mit HERR wiedergegeben.
- source_word: וְחֵי נַפְשֶׁךָ
  choice: und so wahr du lebst
  rationale: Die idiomatische deutsche Schwurformel vermittelt den Sinn von נֶפֶשׁ als Leben bzw. lebende Person, ohne unnatürlich „deine Seele lebt“ zu formulieren.
- source_word: כְפֶשַׂע בֵּינִי וּבֵין הַמָּוֶת
  choice: Zwischen mir und dem Tod liegt nur ein Schritt
  rationale: פֶּשַׂע bezeichnet hier einen Schritt bzw. sehr geringen Abstand; „nur“ macht die durch כְּ ausgedrückte unmittelbare Nähe idiomatisch deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschen Bibelkonvention, ohne eine unsichere Aussprache des Tetragramms festzulegen.
- issue: Sauls unausgesprochene Begründung
  choice: 'Deshalb denkt er: „Jonatan darf das nicht erfahren, sonst wäre er betrübt.“'
  alternative: 'und er hat gesagt: „Jonatan soll das nicht erfahren, damit er nicht betrübt wird.“'
  rationale: וַיֹּאמֶר kann inneres Sprechen bzw. Denken bezeichnen. Der Zusammenhang legt nahe, dass David Sauls Motiv erschließt; die Übersetzung vermeidet den Eindruck eines ausdrücklich überlieferten Zitats, ohne die Aussage stärker zu erklären als der Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Rede. Die feierliche Doppelschwurformel bleibt erhalten; unnötig altertümliche Wendungen werden vermieden.
