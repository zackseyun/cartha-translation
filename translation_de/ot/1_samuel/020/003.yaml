  to: 'Doch David schwor noch einmal und sagte: „Dein Vater weiß ganz genau, dass ich in deinen Augen Gunst gefunden habe, und er hat gesagt: ‚Jonatan soll das nicht erfahren, damit er nicht betrübt wird.‘ Doch so wahr der HERR lebt und so wahr du lebst: Zwischen mir und dem Tod liegt nur ein Schritt.“'
  rationale: Die Revision entfernt die zusätzliche kausale und psychologische Auslegung in „Deshalb denkt“ und gibt וַיֹּאמֶר neutral als „und er hat gesagt“ wieder. Die übrigen Formulierungen bleiben erhalten, da sie den hebräischen Sinn und ein natürliches modernes Bibeldeutsch zuverlässig wiedergeben.
