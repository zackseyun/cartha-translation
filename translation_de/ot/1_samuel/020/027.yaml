base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: de
  text: 'Am folgenden Tag, dem zweiten Tag des Neumondfestes, blieb Davids Platz leer. Da sagte Saul zu seinem Sohn Jonatan: »Warum ist der Sohn Isais weder gestern noch heute zum Essen[a] gekommen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zum Brot«; damit ist hier die gemeinsame Mahlzeit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת הַחֹדֶשׁ הַשֵּׁנִי
  choice: Am folgenden Tag, dem zweiten Tag des Neumondfestes
  rationale: Die Wendung bezeichnet den Folgetag, näher bestimmt als den zweiten Tag der Neumondfeier. »Neumondfest« macht den kultisch-gesellschaftlichen Kontext verständlich, ohne lediglich »Monat« zu lesen.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: blieb Davids Platz leer
  rationale: Das Niphal von פקד bezeichnet hier, dass Davids Platz als unbesetzt vorgefunden wurde. Die deutsche Formulierung ist natürlich und kontextgerecht.
- source_word: בְּנוֹ
  choice: seinem Sohn
  rationale: Die ausdrückliche Verwandtschaftsbezeichnung wird beibehalten.
- source_word: בֶן יִשַׁי
  choice: der Sohn Isais
  rationale: Sauls patronymische Bezeichnung statt des Namens David bleibt erhalten und bewahrt ihre mögliche distanzierende Wirkung.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: weder gestern noch heute
  rationale: In der verneinten Frage gibt diese deutsche Paarformel den zweitägigen Umfang idiomatisch wieder.
- source_word: אֶל הַלָּחֶם
  choice: zum Essen
  rationale: לֶחֶם bedeutet wörtlich »Brot«, steht hier aber metonymisch für die gemeinsame Mahlzeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählung bleibt knapp; Sauls distanzierende Bezeichnung Davids als »Sohn Isais« wird nicht geglättet.
