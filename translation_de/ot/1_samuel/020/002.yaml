base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: de
  text: 'Er sagte zu ihm: „Auf keinen Fall! Du wirst nicht sterben. Sieh doch: Mein Vater tut nichts, weder Großes noch Kleines, ohne mich davon wissen zu lassen.[a] Warum sollte mein Vater also diese Sache vor mir verbergen? Das ist nicht so.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und mein Ohr enthüllt“; eine hebräische Redewendung für „mich davon wissen lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: Auf keinen Fall!
  rationale: Die Wendung drückt eine entschiedene Zurückweisung aus. Diese deutsche Formulierung ist natürlich und fügt keinen im Hebräischen ausdrücklich genannten Gottesbezug hinzu.
- source_word: לֹא תָמוּת
  choice: Du wirst nicht sterben
  rationale: Gibt Jonatans direkte Versicherung in natürlichem modernem Deutsch wieder.
- source_word: הִנֵּה
  choice: 'Sieh doch:'
  rationale: Lenkt die Aufmerksamkeit auf die folgende Begründung; „doch“ unterstützt hier den eindringlichen Gesprächston.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: nichts, weder Großes noch Kleines
  rationale: Bewahrt den Merismus, der sämtliche Angelegenheiten umfasst, und klingt im Deutschen idiomatisch.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: ohne mich davon wissen zu lassen
  rationale: Gibt die Bedeutung der hebräischen Redewendung verständlich wieder, statt das im Deutschen unklare Bild wörtlich zu übertragen.
- source_word: יַסְתִּיר
  choice: verbergen
  rationale: Eine direkte und im Zusammenhang natürliche Wiedergabe des Hiphil.
- source_word: הַדָּבָר הַזֶּה
  choice: gerade diese Sache
  rationale: „Sache“ bezeichnet hier den behaupteten Plan bzw. Vorgang; „gerade“ verdeutlicht den Kontrast der rhetorischen Frage, ohne ihren Sinn aufzulösen.
- source_word: אֵין זֹאת
  choice: Das kann nicht sein
  rationale: Gibt Jonatans abschließende entschiedene Zurückweisung in natürlichem Deutsch wieder.
- source_word: אָבִי
  choice: mein Vater
  rationale: Die ausdrückliche Wiederholung des Hebräischen bleibt zur Betonung und relationalen Klarheit erhalten.
