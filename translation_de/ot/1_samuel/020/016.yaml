source:
  edition: WLC
  text: וַ/יִּכְרֹ֥ת יְהוֹנָתָ֖ן עִם בֵּ֣ית דָּוִ֑ד וּ/בִקֵּ֣שׁ יְהוָ֔ה מִ/יַּ֖ד אֹיְבֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: de
  text: Da schloss Jonatan mit dem Haus Davids einen Bund. Der HERR möge die Feinde Davids zur Rechenschaft ziehen![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und der HERR möge es von der Hand der Feinde Davids fordern.« Das Hebräische nennt nicht ausdrücklich, was gefordert wird; die Verbform kann auch als Aussage verstanden werden: »Und der HERR forderte es von der Hand der Feinde Davids.«'
    reason: Die Fußnote bewahrt sowohl die Leerstelle beim Objekt als auch die mögliche Mehrdeutigkeit der Verbform und der Wendung »von der Hand fordern«.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: schloss ... einen Bund
  rationale: Wörtlich steht »schnitt mit«; בְּרִית (»Bund«) ist als feststehender Bestandteil der hebräischen Wendung ausgelassen und wird im Deutschen ergänzt.
- source_word: בֵּית דָּוִד
  choice: Haus Davids
  rationale: Bezeichnet David und seine Nachkommenschaft beziehungsweise Dynastie; die traditionelle Wendung bewahrt diesen umfassenden Sinn.
- source_word: וּבִקֵּשׁ יְהוָה מִיַּד
  choice: Der HERR möge ... zur Rechenschaft ziehen
  rationale: Die Verbindung von בקש mit מיד kann ausdrücken, dass Gott etwas von jemandes Hand fordert und ihn damit zur Verantwortung zieht. Die Wunschform passt zum Schwur- und Bundeskontext.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt von וּבִקֵּשׁ
  choice: Kein ergänztes Pronomen im Haupttext; Wiedergabe als »zur Rechenschaft ziehen«
  alternative: »Der HERR möge es aus der Hand der Feinde Davids einfordern«
  rationale: Der hebräische Text nennt kein ausdrückliches Objekt. Die gewählte Formulierung vermeidet, »es« eindeutig auf den Bund zu beziehen, und wahrt den Charakter einer Fluch- beziehungsweise Vergeltungsformel.
- issue: Aussage oder Wunschform
  choice: »möge«
  alternative: »und der HERR forderte ...«
  rationale: Im Kontext des Bundesschlusses ist die Form am natürlichsten als Wunsch beziehungsweise Selbstverpflichtungsformel zu verstehen; die rein indikativische Deutung bleibt grammatisch erwägenswert und wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Haus Davids« bleibt als geläufige biblische Bezeichnung für Familie und Dynastie erhalten; »zur Rechenschaft ziehen« macht die hebräische Rechts- und Vergeltungsformel verständlich, ohne ein nicht genanntes Objekt festzulegen.
