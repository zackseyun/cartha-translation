base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: de
  text: 'Doch Saul sagte an jenem Tag nichts, denn er dachte: »Es ist etwas vorgefallen. Er ist nicht rein[a] – ja, er ist nicht rein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: rituell unrein. Im Zusammenhang des Mahls geht es um rituelle Reinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: sagte … nichts
  rationale: Die hebräische Verbindung bedeutet idiomatisch, dass Saul keine Bemerkung machte. »Sagte nichts« ist natürliches, prägnantes Deutsch.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die übliche deutsche Wiedergabe des temporalen Ausdrucks bewahrt den erzählerischen Rückverweis.
- source_word: כִּי אָמַר
  choice: denn er dachte
  rationale: Wörtlich steht »denn er sagte«; im Zusammenhang wird jedoch Sauls inneres Sprechen wiedergegeben. »Dachte« drückt dies im Deutschen klar aus.
- source_word: מִקְרֶה
  choice: Es ist etwas vorgefallen
  rationale: Das Substantiv bezeichnet ein Geschehen oder einen Zufall. Die unpersönliche Formulierung bewahrt, dass im Hebräischen kein ausdrückliches »ihm« steht.
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: Er ist nicht rein
  rationale: Die Formulierung bleibt eng an der verneinten hebräischen Wendung und lässt den rituellen Sinn aus dem Zusammenhang hervorgehen.
- source_word: כִּי לֹא טָהוֹר
  choice: ja, er ist nicht rein
  rationale: Die Wiederholung bekräftigt Sauls Schlussfolgerung. »Ja« gibt die verstärkende Kraft natürlich wieder, ohne die Aussage stärker als nötig festzulegen.
theological_decisions:
- issue: Art der mit טָהוֹר bezeichneten Reinheit
  choice: Im Haupttext »nicht rein«, mit Hinweis auf rituelle Reinheit in der Fußnote
  alternative: »kultisch unrein« beziehungsweise moralische Unreinheit
  rationale: Im Zusammenhang des Neumondmahls ist rituelle Unreinheit gemeint. Der Haupttext bewahrt dennoch die allgemeinere Ausdrucksweise des Hebräischen und vermeidet, die Deutung in den Wortlaut einzubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; die hebräische Wiederholung zur Bekräftigung bleibt erhalten.
