revisions:
- from: 'Wenn dein Vater mein Fehlen ausdrücklich bemerkt[a], dann sag: »David hat mich dringend um Erlaubnis gebeten[b], schnell nach Bethlehem, in seine Stadt, zu gehen[c]; denn dort findet für die ganze Sippe das jährliche Opfer statt[d].«'
  to: 'Wenn dein Vater mein Fehlen sicherlich bemerkt[a], dann sag: »David hat mich dringend um Erlaubnis gebeten[b], nach Bethlehem, seiner Stadt, zu eilen[c]; denn dort findet für die ganze Sippe das jährliche Opfer statt[d].«'
  rationale: Die Revision korrigiert die Apposition „seiner Stadt“, verbessert die deutsche Wiedergabe der emphatischen Wahrnehmung und ordnet die Fußnotenanker den jeweiligen Ausdrücken eindeutig zu. Sie bewahrt sowohl den Kontext der bemerkt werdenden Abwesenheit als auch die mögliche Nuance „vermissen“ in der Fußnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:00:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft den situativen Sinn von פקד („das Fehlen bemerken“) und gibt die beiden emphatischen Infinitiv-absolute angemessen wieder. Die Wiedergabe von לָרוּץ als „schnell ... zu gehen“ ist vertretbar, doch „eilen“ bewahrt die Bewegungs- und Eilnuance knapper. „Bethlehem, in seine Stadt“ bildet עִירוֹ grammatisch und stilistisch nicht idiomatisch ab; erforderlich ist die Apposition im Dativ: „Bethlehem, seiner Stadt“.'
  naturalness: Der Satz ist insgesamt verständlich, aber „Bethlehem, in seine Stadt, zu gehen“ wirkt im modernen Standarddeutsch syntaktisch holprig. „Nach Bethlehem, seiner Stadt, zu eilen“ ist natürlich und zugleich quellennah. „Sicherlich“ gibt die hebräische Verstärkung bei „bemerkt“ idiomatischer wieder als „ausdrücklich“, das eher eine ausdrücklich formulierte Handlung bezeichnet.
  terminology: „Sippe“ ist für מִשְׁפָּחָה möglich und wahrt den weiteren Familienverband. „Jährliches Opfer“ ist eine angemessene Wiedergabe von זֶבַח הַיָּמִים; die Alternative „alljährlich“ kann in der Fußnote stehen. Die Fußnoten sollten die Verstärkung präzise als emphatische Konstruktion erklären und ihre Anker direkt bei den betreffenden Wiedergaben haben.
  issues:
  - severity: medium
    issue: Unidiomatische und grammatisch problematische Wiedergabe von עִירוֹ
    rationale: „Bethlehem, in seine Stadt, zu gehen“ setzt „in seine Stadt“ fälschlich als Richtungsbestimmung neben den Ortsnamen. עִירוֹ ist eine Apposition zu Bethlehem. Deutsch verlangt hier etwa „nach Bethlehem, seiner Stadt“.
  - severity: low
    issue: „ausdrücklich bemerkt“ trifft die Art der hebräischen Verstärkung weniger genau
    rationale: Die Konstruktion פקד יפקדני verstärkt das Wahrnehmen bzw. Bemerken; „ausdrücklich“ bezeichnet im Deutschen eher explizites Äußern oder Benennen. „Sicherlich bemerkt“ erhält den emphatischen Sinn natürlicher.
  - severity: low
    issue: Fußnotenanker sind nicht unmittelbar der jeweiligen Wiedergabe zugeordnet
    rationale: Die Anker b und c stehen nicht bei „gebeten“ bzw. dem Bewegungsverb. Eine unmittelbare Platzierung erleichtert die Zuordnung, ohne den Sinn zu ändern.
