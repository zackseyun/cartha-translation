base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: de
  text: 'Wenn dein Vater mein Fehlen sicherlich bemerkt[a], dann sag: »David hat mich dringend um Erlaubnis gebeten[b], nach Bethlehem, seiner Stadt, zu eilen[c]; denn dort findet für die ganze Sippe das jährliche Opfer statt[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich sicherlich vermisst“. Die hebräische Verbindung aus einem Infinitivus absolutus und einem finiten Verb dient der Verstärkung.'
    reason: lexical_alternative
  - marker: b
    text: Die entsprechende hebräische Verstärkungsform kann auch mit „hat mich eindringlich um Erlaubnis gebeten“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nach Bethlehem zu laufen“; gemeint ist, eilig dorthin zu gehen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „das alljährliche Opfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: mein Fehlen ausdrücklich bemerkt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt פקד. Im Zusammenhang geht es darum, dass Saul Davids Abwesenheit bei der Mahlzeit wahrnimmt. Die Ergänzung „mein Fehlen“ macht den kontextuellen Bezug im Deutschen natürlich deutlich, ohne die mögliche Nuance „mich vermissen“ festzuschreiben.
- source_word: אָבִיךָ
  choice: dein Vater
  rationale: Direkte Wiedergabe der Anrede an Jonatan.
- source_word: נִשְׁאֹל נִשְׁאַל מִמֶּנִּי
  choice: hat mich dringend um Erlaubnis gebeten
  rationale: Auch hier verleiht der Infinitivus absolutus dem Verb Nachdruck. „Dringend“ gibt diesen wieder; „um Erlaubnis bitten“ entspricht der Situation und ist idiomatisches Deutsch.
- source_word: לָרוּץ
  choice: schnell ... zu gehen
  rationale: רוּץ bedeutet wörtlich „laufen“, bezeichnet hier aber das eilige Aufbrechen nach Bethlehem. Die idiomatische Wiedergabe bewahrt den Aspekt der Eile.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: Bethlehem, in seine Stadt
  rationale: Die Apposition עִירוֹ wird eng am Hebräischen als „seine Stadt“ wiedergegeben; gemeint ist Davids Heimatstadt.
- source_word: זֶבַח הַיָּמִים
  choice: das jährliche Opfer
  rationale: Die Wendung bezeichnet ein regelmäßig im Jahreslauf wiederkehrendes Opfer.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: für die ganze Sippe
  rationale: מִשְׁפָּחָה kann Familie oder Sippe bezeichnen. Im Zusammenhang eines gemeinsamen Opfers in der Herkunftsstadt erfasst „Sippe“ den weiteren Familienverband genauer.
