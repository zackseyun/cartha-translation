translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die emphatischen hebräischen Konstruktionen werden im Haupttext natürlich wiedergegeben und in den Fußnoten erläutert. „Sippe“ bezeichnet hier den weiteren Familienverband.
