  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: de
  text: 'Da sagte Jonatan zu David: „Was wünschst du dir[a]? Das werde ich für dich tun.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Was sagt deine Seele?“'
