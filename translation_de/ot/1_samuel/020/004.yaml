lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ entspricht natürlichem deutschem Erzählstil.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Übliche deutsche Form des hebräischen Personennamens.
- source_word: אֶל דָּוִד
  choice: zu David
  rationale: Die Präposition kennzeichnet den Angeredeten; „zu David“ ist die natürliche deutsche Entsprechung.
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: Was immer dein Herz begehrt
  rationale: Wörtlich etwa „Was sagt deine Seele?“. Im Kontext bildet die Wendung ein uneingeschränktes Hilfsangebot. „Herz“ und „begehrt“ geben das innere Wollen im heutigen Deutsch natürlich und würdig wieder, ohne die Aussage inhaltlich einzuengen.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: das werde ich für dich tun
  rationale: „Tun“ entspricht עשה; „für dich“ gibt den begünstigenden Sinn von לְ wieder. Das Demonstrativpronomen „das“ nimmt den vorausgehenden Wunsch idiomatisch auf.
