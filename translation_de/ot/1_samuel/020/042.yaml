base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: de
  text: 'Jonatan sagte zu David: »Geh in Frieden! Denn wir beide haben im Namen des HERRN geschworen: ›Der HERR sei zwischen mir und dir und zwischen meinen Nachkommen und deinen Nachkommen für immer.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: Geh in Frieden!
  rationale: Die geläufige deutsche Wendung gibt den hebräischen Abschiedssegen natürlich und würdig wieder.
- source_word: אֲשֶׁר
  choice: Denn
  rationale: Die Konjunktion leitet hier die Begründung für den friedlichen Abschied ein, ohne die Beziehung unnötig zu präzisieren.
- source_word: זַרְעִי / זַרְעֲךָ
  choice: meinen Nachkommen / deinen Nachkommen
  rationale: „Nachkommen“ gibt das kollektive זֶרַע im heutigen Deutsch verständlich wieder und lässt Zahl und Generationenfolge offen.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Dies entspricht der zeitlich unbegrenzten Geltung des Schwurs in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wahrt die Erkennbarkeit des Gottesnamens und entspricht breitem Bibelgebrauch, ohne eine unsichere Aussprache festzulegen.
- issue: Bedeutung von יהוה יהיה ביני ובינך
  choice: Der HERR sei zwischen mir und dir
  alternative: Der HERR wird zwischen mir und dir sein
  rationale: Die deutsche Wunschform wahrt die im nicht punktuell markierten hebräischen Kontext mögliche eidliche bzw. segnende Nuance; die Aussage beschreibt den HERRN als Zeugen und Garanten des Bundes, ohne dies ausdrücklich hinzuzufügen.
translation_notes:
  register: Modernes, standarddeutsches und würdiges Bibeldeutsch. Die direkte Rede ist klar gegliedert; die Wiederholung „zwischen … und …“ bleibt zur Wahrung der hebräischen Feierlichkeit erhalten.
