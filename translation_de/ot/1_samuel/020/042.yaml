  terminology: „HERR“ markiert den Gottesnamen יהוה in etablierter deutscher Bibelkonvention. „Nachkommen“ bildet das kollektiv verstandene זַרַע angemessen ab, ohne eine künstliche Singular- oder Pluralfestlegung. „Für immer“ gibt עַד עוֹלָם verständlich und sachgerecht wieder.
