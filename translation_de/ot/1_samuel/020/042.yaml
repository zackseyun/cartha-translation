  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des hebräischen Textes zutreffend wieder: Jonatans Anrede an David, den Friedensabschied, den von beiden im Namen JHWHs geleisteten Schwur sowie dessen Geltung zwischen ihnen und ihren Nachkommen auf Dauer. Die Wunschform „Der HERR sei“ ist für יִהְיֶה im eidlich-segnenden Zusammenhang gut vertretbar und stimmt mit der englischen Audit-Fassung („May the LORD be“) überein.'
