  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: de
  text: 'Jonatan antwortete seinem Vater Saul und sagte zu ihm: „Warum soll er getötet werden?[a] Was hat er getan?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum muss er umgebracht werden?“ Das hebräische Verb bezeichnet hier ausdrücklich, dass jemand zu Tode gebracht wird, nicht lediglich, dass er stirbt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet in dieser Erzählformel das Antworten oder Entgegnen; „antwortete“ ist im Deutschen natürlich und wahrt den dialogischen Zusammenhang.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition wiedergegeben.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: seinem Vater Saul
  rationale: Die Formulierung bezeichnet Saul als Adressaten und zugleich als Jonatans Vater; die deutsche Wortstellung ist natürlich und eindeutig.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: und sagte zu ihm
  rationale: Das im Hebräischen ausdrücklich genannte indirekte Objekt wird zur Texttreue beibehalten.
- source_word: לָמָּה
  choice: Warum
  rationale: Die direkte Fragepartikel wird schlicht und idiomatisch mit „Warum“ wiedergegeben.
- source_word: יוּמַת
  choice: soll er getötet werden
  rationale: 'Der Hofal-Imperfekt von מות hat kausativ-passiven Sinn: Jemand soll zu Tode gebracht werden, nicht lediglich sterben. „Soll“ gibt hier die fragende Infragestellung der beabsichtigten Hinrichtung angemessen wieder.'
- source_word: מֶה עָשָׂה
  choice: Was hat er getan?
  rationale: Die Frage zielt auf eine begangene Tat beziehungsweise Schuld; das deutsche Perfekt klingt in direkter Rede natürlich und betont ihre gegenwärtige Relevanz.
