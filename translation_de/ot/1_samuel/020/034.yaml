base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: de
  text: Da stand Jonatan in glühendem Zorn vom Tisch auf. Am zweiten Tag des Monats[a] aß er nichts, denn er war um David bekümmert, weil sein Vater ihn gedemütigt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am zweiten Tag des Neumonds“. Das hebräische Wort kann sowohl „Monat“ als auch „Neumond“ bedeuten; hier geht es um das königliche Mahl zum Neumond.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand ... auf
  rationale: Das übliche deutsche Erzählverb „aufstehen“ gibt das Wayyiqtol von קום natürlich und präzise wieder.
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: vom Tisch
  rationale: Die Präposition bezeichnet hier die Bewegung weg vom Ort beziehungsweise von der Tischgemeinschaft; „vom Tisch aufstehen“ ist idiomatisches Deutsch.
- source_word: בָּחֳרִי אָף
  choice: in glühendem Zorn
  rationale: Die Wendung bezeichnet die Hitze beziehungsweise das Entbrennen des Zorns. „Glühender Zorn“ bewahrt dieses Bild und seine Intensität.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: aß er nichts
  rationale: לֶחֶם kann konkret Brot oder im Mahlkontext allgemein Nahrung bezeichnen. Die deutsche Wendung macht deutlich, dass Jonatan die Mahlzeit vollständig verweigerte.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: am zweiten Tag des Monats
  rationale: חֹדֶשׁ kann „Monat“ oder „Neumond“ bedeuten. Die Hauptübersetzung folgt der naheliegenden kalendarischen Lesart; die kontextuell mögliche Festbezeichnung steht in der Fußnote.
- source_word: נֶעְצַב
  choice: war ... bekümmert
  rationale: Der Niphal von עצב beschreibt inneren Schmerz oder Kummer. „Bekümmert“ ist im Deutschen natürlich und passt zur Sorge um David.
- source_word: אֶל דָּוִד
  choice: um David
  rationale: Die Präposition kennzeichnet hier den Bezug beziehungsweise Gegenstand von Jonatans Kummer; „um David bekümmert“ ist idiomatisch.
- source_word: הִכְלִמוֹ
  choice: ihn gedemütigt hatte
  rationale: Der Hiphil von כלם bedeutet, jemanden zu beschämen oder zu demütigen. „Gedemütigt“ erfasst die persönliche und öffentliche Entehrung im Zusammenhang.
- source_word: אָבִיו
  choice: sein Vater
  rationale: Das Suffix bezieht sich grammatisch am unmittelbarsten auf Jonatan; die Wiedergabe bewahrt die familiäre Spannung des hebräischen Textes.
theological_decisions:
- issue: Bezugswort des Pronomens in הִכְלִמוֹ
  choice: „ihn“ bezieht sich auf Jonatan
  alternative: „ihn“ bezieht sich auf David
  rationale: Das hebräische maskuline Suffix ist formal mehrdeutig. Der unmittelbar folgende Ausdruck „sein Vater“ und Sauls vorherige Beschimpfung Jonatans stützen den Bezug auf Jonatan, ohne dass daraus eine besondere theologische Aussage abgeleitet wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das hebräische Zornbild bleibt in natürlicher Form erhalten; die Mehrdeutigkeit von חֹדֶשׁ wird durch eine Fußnote sichtbar gemacht.
