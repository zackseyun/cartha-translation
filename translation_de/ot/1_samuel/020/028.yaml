  text: וַ/יַּ֥עַן יְהוֹנָתָ֖ן אֶת שָׁא֑וּל נִשְׁאֹ֨ל נִשְׁאַ֥ל דָּוִ֛ד מֵ/עִמָּדִ֖/י עַד בֵּ֥ית לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: de
  text: 'Jonatan antwortete Saul: „David bat mich dringend um Erlaubnis, nach Bethlehem zu gehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Die übliche deutsche Wiedergabe der narrativen Verbform von ענה in einem Dialog.
- source_word: אֶת שָׁאוּל
  choice: Saul
  rationale: Die Akkusativmarkierung kennzeichnet Saul als die Person, der Jonatan antwortet; im Deutschen ist „Saul antworten“ idiomatisch.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: bat … dringend um Erlaubnis
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Vorgang des Bittens. „dringend“ gibt diese Emphase natürlich wieder; „um Erlaubnis bitten“ entspricht dem Zusammenhang.
- source_word: מֵעִמָּדִי
  choice: mich
  rationale: In der deutschen Wendung „jemanden um Erlaubnis bitten“ wird Jonatan als die um Erlaubnis gebetene Person idiomatisch durch den Akkusativ ausgedrückt.
- source_word: עַד בֵּית לָחֶם
  choice: nach Bethlehem zu gehen
  rationale: Das Ziel Bethlehem setzt im Zusammenhang eine Bewegung voraus. Die Ergänzung „zu gehen“ macht den gemeinten Sinn im Deutschen klar, ohne den Inhalt zu verändern.
- source_word: בֵּית לָחֶם
  choice: Bethlehem
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische hebräische Konstruktion wird knapp und natürlich mit „dringend“ wiedergegeben.
