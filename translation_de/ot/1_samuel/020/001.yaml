  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: de
  text: 'Da floh David aus Najot in Rama[a], kam zu Jonatan und sagte: »Was habe ich getan? Was ist meine Schuld, und was ist meine Sünde vor deinem Vater, dass er mir nach dem Leben trachtet?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus Najot bei Rama«. Das Hebräische bezeichnet wahrscheinlich den bekannten Ort Najot, der mit Rama verbunden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: floh
  rationale: Das Verb bezeichnet Flucht oder Entkommen; »floh« gibt die Dringlichkeit knapp und ohne zusätzliche Deutung wieder.
- source_word: מִנָּוֹת בָּרָמָה
  choice: aus Najot in Rama
  rationale: Najot wird im Zusammenhang als Ortsname verstanden und entsprechend transkribiert. »in Rama« bewahrt die räumliche Zuordnung des hebräischen Ausdrucks.
- source_word: וַיָּבֹא
  choice: kam
  rationale: Die einfache Erzählform von בוא beschreibt Davids Bewegung zu Jonatan hin; »kam« ist hier natürlich und quellennah.
- source_word: לִפְנֵי יְהוֹנָתָן
  choice: zu Jonatan
  rationale: Wörtlich steht »vor Jonatan/in Jonatans Gegenwart«. Im Deutschen gibt »zu Jonatan« die Bewegung in seine Gegenwart idiomatisch wieder, ohne eine förmliche Audienz anzudeuten.
- source_word: מֶה עָשִׂיתִי
  choice: Was habe ich getan?
  rationale: Das Perfekt wird in der rhetorischen Frage natürlich mit dem deutschen Perfekt wiedergegeben.
- source_word: עֲוֺנִי
  choice: meine Schuld
  rationale: עָוֹן kann Verfehlung und die daraus erwachsende Schuld bezeichnen. »Schuld« passt zu Davids Rechtfertigungsfrage und bleibt von »Sünde« unterscheidbar.
- source_word: חַטָּאתִי
  choice: meine Sünde
  rationale: »Sünde« bewahrt den moralischen Gehalt von חַטָּאת und erhält die im Hebräischen bestehende Doppelung mit עָוֹן.
- source_word: לִפְנֵי אָבִיךָ
  choice: vor deinem Vater
  rationale: Die Formulierung bewahrt die mögliche Bedeutung »in den Augen deines Vaters« ebenso wie die relationale Bedeutung, ohne sie auf »gegen« festzulegen.
- source_word: כִּי
  choice: dass
  rationale: 'כִּי verbindet hier die vorausgehende Frage mit Sauls Reaktion: Welche Schuld liegt vor, dass er David töten will?'
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: er mir nach dem Leben trachtet
  rationale: Die deutsche Wendung gibt das hebräische Idiom, jemandes Leben zu suchen, verständlich und mit seiner tödlichen Absicht wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen rhetorischen Fragen und die Unterscheidung zwischen »Schuld« und »Sünde« bleiben erhalten; die abschließende hebräische Redewendung wird durch ein geläufiges deutsches Idiom wiedergegeben.
