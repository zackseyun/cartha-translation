base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: de
  text: Lade Isai zum Opfer ein[a], und ich werde dir mitteilen[b], was du tun sollst; dann sollst du für mich den salben, den ich dir nennen werde.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rufe Isai zum Opfer.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde dir kundtun, was du tun sollst.“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht hier das Verb „sagen“: „den, den ich dir sagen werde“. Gemeint ist die Person, die Gott Samuel angeben wird.'
    reason: source_clarity
lexical_decisions:
- source_word: וְקָרָאתָ לְיִשַׁי בַּזָּבַח
  choice: Lade Isai zum Opfer ein
  rationale: קרא bezeichnet in Verbindung mit einer Opferfeier das Rufen beziehungsweise Einladen zur Teilnahme. „Einladen“ gibt den Zusammenhang in natürlichem Deutsch wieder; „zum Opfer“ bewahrt die allgemeinere Bedeutung von זבח, ohne ausdrücklich ein Opfermahl einzutragen.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: Dann werde ich dir mitteilen
  rationale: Der Hifil von ידע bedeutet „wissen lassen, kundtun, mitteilen“. „Mitteilen“ ist modernes, natürliches Deutsch; das selbstständige Pronomen אָנֹכִי hebt Gottes eigenes Handeln hervor, ohne dass im Deutschen zwingend „ich selbst“ ergänzt werden muss.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: was du tun sollst
  rationale: Die Form bezeichnet hier nicht bloß eine Vorhersage, sondern die Handlung, zu der Samuel angewiesen werden wird. „Sollst“ gibt diesen anweisenden Zukunftssinn angemessen wieder.
- source_word: וּמָשַׁחְתָּ לִי
  choice: Du sollst für mich … salben
  rationale: משׁח ist der übliche Ausdruck für die Salbung zur Einsetzung oder Weihe. לִי zeigt, dass Samuel die Salbung für Gott beziehungsweise in seinem Auftrag vollzieht.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: den, den ich dir nennen werde
  rationale: Wörtlich steht eine Relativkonstruktion mit „sagen“. Im Zusammenhang wird die Person bezeichnet, die Gott Samuel angeben wird. „Nennen“ macht die im Hebräischen knappe Formulierung in natürlichem Deutsch verständlich, ohne ein Amt hinzuzufügen.
theological_decisions:
- issue: Bedeutung der Salbung
  choice: Die Handlung wird schlicht als „salben“ wiedergegeben.
  alternative: Die Handlung ausdrücklich als Einsetzung zum König zu bezeichnen.
  rationale: Der Erzählzusammenhang weist auf eine Königssalbung, doch der Vers selbst nennt das Amt nicht. Die Übersetzung lässt diese Aussage beim Kontext und fügt sie nicht in den Vers ein.
- issue: Gottes Bestimmung der zu salbenden Person
  choice: „den, den ich dir nennen werde“ bewahrt, dass Gott selbst die Person bestimmt.
  alternative: „wen auch immer ich dir nenne“, was die Formulierung stärker verallgemeinern könnte.
  rationale: Der bestimmte Singular im Deutschen passt zur erzählten Auswahl einer konkreten Person und vermeidet den möglichen Eindruck einer beliebigen offenen Gruppe.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze Hauptsätze bilden die Abfolge der hebräischen Anweisungen klar ab. Das einleitende „Dann“ gibt den fortführenden Zusammenhang idiomatisch wieder; weder das Königsamt noch eine weitergehende Deutung der Salbung wird in den Vers eingetragen.
