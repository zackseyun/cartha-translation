  naturalness: Der Text ist insgesamt modernes, verständliches Standarddeutsch. Die Satzfolge wird mit einer Komma- und Semikolonverbindung näher am hebräischen Ablauf und zugleich flüssig gestaltet. Die Alternative »dich wissen lassen« in Fußnote b ist ohne Ergänzung unidiomatisch.
  terminology: »Isai«, »Opfer« und »salben« sind angemessen. »Für mich« gibt לִי sachgerecht wieder, ohne das im Kontext naheliegende Königsamt vorwegzunehmen. »Nennen« ist für das elliptische »sagen« in diesem Kontext eine natürliche, nicht überdeutende deutsche Wiedergabe.
