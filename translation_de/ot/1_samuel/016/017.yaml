  text: וַ/יֹּ֥אמֶר שָׁא֖וּל אֶל עֲבָדָ֑י/ו רְאוּ נָ֣א לִ֗/י אִ֚ישׁ מֵיטִ֣יב לְ/נַגֵּ֔ן וַ/הֲבִיאוֹתֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: de
  text: 'Da sagte Saul zu seinen Dienern: „Sucht mir bitte einen Mann, der gut spielen kann, und bringt ihn zu mir.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עֶבֶד bezeichnet Diener; im höfischen Zusammenhang sind Sauls Bedienstete beziehungsweise Hofdiener gemeint. „Diener“ bleibt nah am Hebräischen.
- source_word: רְאוּ נָא
  choice: Sucht ... bitte
  rationale: ראה mit dem Höflichkeitspartikel נָא ist hier idiomatisch als höfliche Aufforderung zu verstehen, einen geeigneten Mann ausfindig zu machen.
- source_word: לִי
  choice: mir
  rationale: Der Dativ bezeichnet Sauls Interesse beziehungsweise den Zweck der Suche und entspricht idiomatischem Deutsch.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das hebräische Substantiv ist ausdrücklich maskulin und singular; „einen Mann“ bewahrt diese Form.
- source_word: מֵיטִיב לְנַגֵּן
  choice: der gut spielen kann
  rationale: Wörtlich etwa „der es beim Spielen gut macht“; gemeint ist musikalisches Können. „Gut spielen kann“ ist natürlich und legt kein in diesem Vers ungenanntes Instrument fest.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: und bringt ihn zu mir
  rationale: Die pluralische Aufforderung richtet sich an Sauls Diener; das Objekt „ihn“ greift den zuvor genannten einzelnen Mann auf.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die höfliche Nuance von נָא wird durch „bitte“ bewahrt; die Tätigkeit נגן bleibt ohne ergänzte Instrumentenangabe.
