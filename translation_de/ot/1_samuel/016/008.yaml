  source_fidelity: Die kausative Wiedergabe „ließ ihn vor Samuel vorübergehen“ gibt den Hifil von עבר sachgerecht wieder; „Auch diesen hat Jahwe nicht erwählt“ bewahrt die additive Verneinung und das resultative Perfekt. Das einleitende „Doch“ entspricht jedoch dem narrativen וַ nicht. Außerdem wird das im Hebräischen nur kontextuell erschließbare Subjekt von וַיֹּאמֶר im Deutschen mit „er“ nach dem unmittelbar vorangehenden Subjekt Isai missverständlich und legt eher Isai als Sprecher nahe; der Kontext identifiziert Samuel als Sprecher.
  naturalness: „Da rief Isai Abinadab und ließ ihn vor Samuel vorübergehen“ ist moderne, würdige und gut verständliche Erzählsprache. „Und Samuel sagte“ ist hier natürlicher und eindeutiger als „Doch er sagte“.
  terminology: „Isai“, „Abinadab“, „Samuel“ und „Jahwe“ sind passende deutsche Namens- und Gottesnamensformen. „erwählt“ trifft בחר im Kontext der göttlichen Auswahl präzise.
