  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: de
  text: 'Da rief Isai Abinadab und ließ ihn vor Samuel vorübergehen. Und Samuel sagte: „Auch diesen hat Jahwe nicht erwählt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: Da rief Isai Abinadab
  rationale: קרא mit אֶל bezeichnet hier das Herbeirufen. „rief“ ist im Deutschen natürlich; „Da“ führt die fortlaufende Erzählung idiomatisch weiter.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: und ließ ihn vor Samuel vorübergehen
  rationale: Der Hifil von עבר mit Objektsuffix drückt Veranlassung aus. „ließ ihn … vorübergehen“ bewahrt sowohl die kausative Form als auch die räumliche Vorstellung von לִפְנֵי.
- source_word: וַיֹּאמֶר
  choice: Doch er sagte
  rationale: Das Hebräische nennt das Subjekt nicht ausdrücklich. Das Pronomen bewahrt diese Form; „doch“ gibt hier den inhaltlichen Gegensatz zur Vorstellung einer möglichen Erwählung natürlich wieder.
- source_word: גַּם בָּזֶה
  choice: Auch diesen
  rationale: Die additive Partikel גַּם bezieht den nächsten Sohn in die Reihe der Abgewiesenen ein. Im Deutschen ist „Auch diesen … nicht“ knapp und idiomatisch.
- source_word: לֹא בָחַר
  choice: hat … nicht erwählt
  rationale: Das Perfekt bezeichnet hier eine feststehende, für die gegenwärtige Prüfung maßgebliche Entscheidung. Das deutsche Perfekt gibt diesen Ergebnisbezug natürlich wieder; „erwählt“ passt zum Kontext göttlicher Auswahl.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da im Ausgangstext der Eigenname JHWH steht, wird er als „Jahwe“ wiedergegeben. So bleibt der Unterschied zwischen Gottes Namen und einem Titel sichtbar.
- issue: Nicht ausdrücklich genanntes Subjekt von וַיֹּאמֶר
  choice: er sagte
  alternative: Samuel sagte
  rationale: Der Zusammenhang legt Samuel als Sprecher nahe, doch der hebräische Satz nennt ihn nicht ausdrücklich. Das Pronomen bewahrt diese leichte formale Unbestimmtheit, ohne den Sinn zu verdunkeln.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Isai“ und „Jahwe“ folgen gebräuchlichen deutschen Bibelnamensformen. Die Satzstruktur bleibt nah am hebräischen Erzählfluss, ohne unnötig wörtlich zu klingen.
