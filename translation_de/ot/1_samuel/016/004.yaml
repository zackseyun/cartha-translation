source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: de
  text: 'Samuel tat, was Jahwe gesagt hatte, und kam nach Bethlehem. Die Ältesten der Stadt gingen ihm zitternd entgegen und fragten[a]: »Kommst du in Frieden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen folgt auf das pluralische Subjekt »die Ältesten« ein Verb im Singular: »und er sagte«. Es kann einen einzelnen Sprecher der Ältesten oder ihre gemeinsam vorgebrachte Frage bezeichnen.'
    reason: Der hebräische Numeruswechsel wird korrekt wiedergegeben, ohne die formale Bedeutung von ויאמר (»und er sagte«) mit der kontextuellen deutschen Wiedergabe als Frage zu verwechseln.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: Die schlichte Wiedergabe entspricht dem üblichen erzählenden Gebrauch von עשה und bringt Samuels Gehorsam zum Ausdruck, ohne den Sinn durch »führte aus« oder »befolgte« zu verstärken.
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: was Jahwe gesagt hatte
  rationale: Das Plusquamperfekt verweist natürlich auf die vorausgegangene Rede Gottes. »Gesagt« ist im heutigen Deutsch idiomatischer als »gesprochen« und fügt anders als »befohlen« keine zusätzliche Bedeutungsnuance ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: kam nach Bethlehem
  rationale: בוא bezeichnet hier die Ankunft am Ziel; »kam nach Bethlehem« ist eine natürliche und knappe deutsche Erzählform.
- source_word: וַיֶּחֶרְדוּ ... לִקְרָאתוֹ
  choice: gingen ihm zitternd entgegen
  rationale: Die Formulierung verbindet die von חרד bezeichnete Furcht oder Erschütterung eng mit dem Entgegengehen (לקראת), bewahrt das anschauliche Zittern und klingt im Deutschen natürlicher als »zitterten bei seiner Ankunft«.
- source_word: זִקְנֵי הָעִיר
  choice: die Ältesten der Stadt
  rationale: Dies bezeichnet die anerkannten führenden Vertreter der Stadt und gibt die hebräische Fügung klar wieder.
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: Kommst du in Frieden?
  rationale: Die knappe hebräische Nominalkonstruktion fragt, ob Samuels Kommen friedlich beziehungsweise mit guten Absichten erfolgt; die gewählte Form ist idiomatisch und wahrt die direkte Frage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Numeruswechsel zwischen den Ältesten und וַיֹּאמֶר
  choice: fragten
  alternative: er fragte / man fragte
  rationale: Das Subjekt »die Ältesten« steht im Plural, während das folgende Verb formal Singular ist. Im Haupttext wird die kollektiv verstandene Rede natürlich wiedergegeben; die formale Abweichung bleibt in der Fußnote sichtbar, ohne einen einzelnen, im Text nicht genannten Sprecher festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Gingen ihm zitternd entgegen« erhält sowohl die Bewegung als auch die furchtsame Erschütterung des hebräischen Ausdrucks. Die direkte Rede verwendet deutsche Anführungszeichen.
