base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: de
  text: Unser Herr möge doch deinen Dienern, die vor dir stehen, auftragen, einen Mann zu suchen, der die Leier zu spielen versteht. Wenn dann ein schädlicher Geist von Gott über dich kommt[a], wird er darauf spielen, und es wird dir gut gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein böser Geist von Gott. Hebräisch: ein schädlicher/böser Geist Gottes beziehungsweise von Gott.'
    reason: Das Adjektiv רָעָה kann sowohl »böse« als auch »schädlich« bedeuten; zudem lässt die hebräische Genitivverbindung die Nuance »Gottes« oder »von Gott« zu.
lexical_decisions:
- source_word: יֹאמַר נָא אֲדֹנֵינוּ
  choice: Unser Herr möge doch … auftragen
  rationale: Der Jussiv mit נָא formuliert eine höfliche, ehrerbietige Bitte. Im Zusammenhang ist mit dem »Sagen« ein Auftrag an die Diener gemeint; »möge doch … auftragen« gibt dies in natürlichem Deutsch wieder.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: seinen Dienern, die vor dir stehen
  rationale: Die Wendung bezeichnet Sauls Diener, die in seiner Gegenwart Dienst tun. Der Wechsel zwischen »seinen« und »dir« entspricht der direkten Anrede Sauls und bewahrt das höfische Bild.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: einen Mann zu suchen
  rationale: Der Plural bezeichnet die Diener als diejenigen, die gezielt nach einer geeigneten Person suchen sollen.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: der … zu spielen versteht
  rationale: Die Partizipialkonstruktion drückt Fähigkeit beziehungsweise Könnerschaft aus. Die Formulierung ist gehoben, aber gegenwärtig und gut verständlich.
- source_word: כִּנּוֹר
  choice: Leier
  rationale: כִּנּוֹר bezeichnet ein antikes Saiteninstrument, das genauer als Leier und nicht mit der traditionellen, aber weniger präzisen Bezeichnung Harfe wiedergegeben wird.
- source_word: וְהָיָה בִּהְיוֹת
  choice: Wenn dann
  rationale: Die hebräische Konstruktion leitet den zeitlichen Umstand ein, unter dem das anschließende Spielen erfolgen soll.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: ein schädlicher Geist von Gott
  rationale: רָעָה kann hier die schädigende Wirkung bezeichnen, während »von Gott« die im Text ausgesagte Herkunft beziehungsweise Zuordnung wahrt. Die ebenfalls mögliche Wiedergabe »böser Geist« wird in der Fußnote erhalten.
- source_word: עָלֶיךָ
  choice: über dich kommt
  rationale: Bei רוּחַ bezeichnet עַל hier das bedrängende Kommen des Geistes über Saul; diese dynamische Formulierung ist im Deutschen natürlicher als »auf dir ist«.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: soll er darauf spielen
  rationale: Wörtlich steht »mit seiner Hand spielen«. Im Hebräischen bezeichnet dies idiomatisch das Spielen des Instruments; »darauf spielen« gibt den Sinn in natürlichem Deutsch wieder.
- source_word: וְטוֹב לָךְ
  choice: es wird dir besser gehen
  rationale: Die Wendung kündigt eine Besserung von Sauls bedrängtem Zustand an. »Besser gehen« ist im Deutschen idiomatisch und legt die Art der Erleichterung nicht enger fest.
theological_decisions:
- issue: Wiedergabe von רוּחַ אֱלֹהִים רָעָה ohne Auflösung der theologischen Spannung
  choice: ein schädlicher Geist von Gott
  alternative: ein böser Geist von Gott; ein schädlicher/böser Geist Gottes
  rationale: Der Haupttext versteht רָעָה als Bezeichnung der schädigenden Wirkung, ohne die stärkere moralische Lesart auszuschließen. »Von Gott« bewahrt die ausdrückliche Zuordnung zu Gott, ohne durch eine erklärende Ergänzung festzulegen, wie diese theologisch zu verstehen ist. Die alternative Lesart »böser Geist« bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit höfischem Ton. »Leier« folgt der historischen Instrumentenbezeichnung. Die Satzstruktur wurde für flüssiges Deutsch leicht geglättet, ohne die direkte Anrede, die Handlungsfolge oder die theologische Spannung der Geist-Aussage zu beseitigen.
