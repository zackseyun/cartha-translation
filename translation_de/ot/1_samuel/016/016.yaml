revisions:
- from: Unser Herr möge doch seinen Dienern, die vor dir stehen, auftragen, einen Mann zu suchen, der die Leier zu spielen versteht. Wenn dann ein schädlicher Geist von Gott über dich kommt[a], soll er darauf spielen, und es wird dir besser gehen.
  to: Unser Herr möge doch deinen Dienern, die vor dir stehen, auftragen, einen Mann zu suchen, der die Leier zu spielen versteht. Wenn dann ein schädlicher Geist von Gott über dich kommt[a], wird er darauf spielen, und es wird dir gut gehen.
  rationale: Die Revision stellt die direkte höfische Anrede wieder her, vermeidet die im Ausgangstext nicht ausgedrückte Vergleichsform und kennzeichnet das Leierspiel als erwartete Folge der Bedingung. Die Aussage über den Geist und die zugehörige Fußnotenambiguität bleiben unverändert erhalten.
