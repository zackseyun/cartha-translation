review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft die zentrale Aussage weitgehend: die höfische Bitte, die Suche nach einem kundigen Leierspieler und die belastende Geist-Aussage bleiben erhalten. Allerdings ist »es wird dir besser gehen« gegenüber וְטוֹב לָךְ unnötig komparativ; der hebräische Text sagt allgemein, dass es Saul gut ergehen wird. Außerdem sollte die Anrede in der höfischen Rede konsequent direkt bleiben: »deinen Dienern« statt »seinen Dienern«.'
  naturalness: Die Syntax ist modernes, würdiges Standarddeutsch. »Wenn dann« ist möglich, aber »Wenn … über dich kommt, wird …« bildet die Bedingung und Folge klarer ab. »Darauf spielen« ist natürlich und macht das im Hebräischen nur durch »mit seiner Hand« ausgedrückte Instrument verständlich.
  terminology: »Leier« ist für כִּנּוֹר treffend. »Ein schädlicher Geist von Gott« ist als kontextuelle Hauptlesart vertretbar; die Fußnote bewahrt die mögliche Wiedergabe »böser Geist« sowie die grammatisch mögliche Zuordnung »Gottes« bzw. »von Gott«, ohne die Spannung aufzulösen.
  issues:
  - severity: medium
    issue: Wechsel von direkter zu indirekter Anrede
    rationale: »Unser Herr« und »deinen Dienern, die vor dir stehen« entspricht der höfischen direkten Anrede des hebräischen Textes. »Seinen Dienern« verschiebt ohne Anlass in die indirekte Referenz und steht neben »dir« uneinheitlich.
  - severity: medium
    issue: Unbegründete Vergleichsform in »besser gehen«
    rationale: וְטוֹב לָךְ bedeutet wörtlich etwa »und es wird gut für dich sein«. Zwar liegt Besserung im Kontext nahe, doch eine Vergleichsaussage ist nicht explizit markiert und sollte nicht in den Haupttext eingeführt werden.
  - severity: low
    issue: Folgesatz mit »soll«
    rationale: »Soll er darauf spielen« kann im Deutschen erneut wie ein Vorschlag oder Auftrag klingen. Der hebräische Satz beschreibt die erwartete Folge; »wird er darauf spielen« bildet dies eindeutiger ab.
  revised_text: Unser Herr möge doch deinen Dienern, die vor dir stehen, auftragen, einen Mann zu suchen, der die Leier zu spielen versteht. Wenn dann ein schädlicher Geist von Gott über dich kommt[a], wird er darauf spielen, und es wird dir gut gehen.
  revised_footnotes:
