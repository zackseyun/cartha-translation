base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: de
  text: Da nahm Isai einen mit Brot beladenen Esel[a], einen Weinschlauch und ein Ziegenjunges und schickte alles durch seinen Sohn David[b] zu Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Esel, Brot“; gemeint ist wahrscheinlich ein Esel, der das Brot trägt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Hand Davids, seines Sohnes“; dies ist eine hebräische Wendung für die Vermittlung oder Überbringung durch jemanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm Isai
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ gibt den Fortgang im modernen deutschen Erzählstil natürlich wieder.
- source_word: חֲמוֹר לֶחֶם
  choice: einen mit Brot beladenen Esel
  rationale: Im Hebräischen stehen „Esel“ und „Brot“ ohne ausdrückliche Angabe ihrer Beziehung nebeneinander. Im Zusammenhang ist der Esel das Lasttier, das das Brot trägt; die Fußnote bewahrt den knappen Wortlaut.
- source_word: נֹאד יַיִן
  choice: einen Schlauch Wein
  rationale: נֹאד bezeichnet einen Behälter aus Tierhaut. „Schlauch Wein“ gibt Behälter und Inhalt knapp und in verständlichem Deutsch wieder.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: ein Ziegenjunges
  rationale: Die Wendung bezeichnet ein einzelnes junges Tier aus der Ziegenherde. „Ziegenjunges“ vermeidet eine unbegründete Festlegung auf das Geschlecht.
- source_word: וַיִּשְׁלַח
  choice: und schickte alles
  rationale: Das Objekt ist im Hebräischen aus den zuvor genannten Gaben zu ergänzen. „Alles“ macht diesen Bezug im Deutschen eindeutig.
- source_word: בְּיַד דָּוִד בְּנוֹ
  choice: durch seinen Sohn David
  rationale: Wörtlich steht „durch die Hand Davids, seines Sohnes“; die Wendung bezeichnet hier Vermittlung beziehungsweise Überbringung. Die natürliche deutsche Form steht im Text, der hebräische Ausdruck in der Fußnote.
- source_word: אֶל שָׁאוּל
  choice: zu Saul
  rationale: Die Präposition bezeichnet das Ziel der Sendung; „zu Saul“ ist die natürliche deutsche Wiedergabe.
