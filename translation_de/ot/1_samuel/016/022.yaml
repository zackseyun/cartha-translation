base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/022.yaml
  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: de
  text: 'Da sandte Saul zu Isai und ließ ihm sagen: »Lass David doch vor mir stehen[a], denn er hat Gunst in meinen Augen gefunden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lass David doch weiter vor mir stehen.« Im höfischen Zusammenhang kann dies bedeuten, dass David weiterhin in Sauls persönlichem Dienst sein soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte Saul
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da“ gibt die zeitlich-fortschreitende Verknüpfung in natürlichem Deutsch wieder.
- source_word: אֶל יִשַׁי לֵאמֹר
  choice: zu Isai und ließ ihm sagen
  rationale: Die Wendung bezeichnet das Senden einer Botschaft an Isai und führt die direkte Rede ein. Die deutsche Formulierung macht den impliziten Boten verständlich, ohne den Inhalt zu erweitern.
- source_word: יַעֲמָד נָא
  choice: Lass David doch … bleiben
  rationale: Der Jussiv mit נָא formuliert eine höfliche Bitte. עמד bedeutet wörtlich „stehen“, bezeichnet hier im höfischen Zusammenhang aber das fortgesetzte Verweilen beziehungsweise Dienen vor Saul.
- source_word: לְפָנַי
  choice: in meinem Dienst
  rationale: Wörtlich „vor mir“; im Kontext des Königshofes ist damit die persönliche Aufwartung beziehungsweise der Dienst bei Saul gemeint.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für Sauls Bitte ein.
- source_word: מָצָא חֵן בְּעֵינָי
  choice: er hat Gunst in meinen Augen gefunden
  rationale: Die hebräische Wendung wird bildnah wiedergegeben und bezeichnet Sauls persönliche Anerkennung und Wohlwollen.
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: David / Saul / Isai
  rationale: Die Eigennamen folgen den im Deutschen gebräuchlichen biblischen Namensformen.
