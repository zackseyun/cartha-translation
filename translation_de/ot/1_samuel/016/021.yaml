base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/021.yaml
  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: de
  text: So kam David zu Saul und stand vor ihm. Saul liebte ihn sehr, und David wurde sein Waffenträger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Träger von Waffen/Ausrüstung“. Wörtlich: „Träger von Geräten/Ausrüstungsgegenständen“; gemeint ist jemand, der die militärische Ausrüstung eines Kriegers trägt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bezeichnet hier die Bewegung zu Saul hin; „kam zu Saul“ ist im Deutschen natürlich und legt nicht unnötig fest, ob David einen bestimmten Raum betrat.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: trat in seinen Dienst
  rationale: Die Wendung עמד לפני bezeichnet im höfischen Zusammenhang das Dienen beziehungsweise Aufwarten vor einem Höhergestellten. Die funktionale Wiedergabe klingt im modernen Deutsch natürlicher als das missverständliche wörtliche „stand vor ihm“.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: Saul gewann ihn sehr lieb
  rationale: Der Kontext weist Saul als Subjekt und David als Objekt aus. „gewann ihn sehr lieb“ gibt die starke persönliche Zuneigung beziehungsweise Gunst wieder, ohne sie unnötig zu spezifizieren.
- source_word: וַיְהִי לוֹ
  choice: David wurde sein
  rationale: Die Konstruktion bezeichnet den eintretenden Zustand beziehungsweise die neue Funktion; die ausdrückliche Nennung Davids beseitigt im Deutschen eine mögliche Pronomenunklarheit.
- source_word: נֹשֵׂא כֵלִים
  choice: Waffenträger
  rationale: Die feste Bezeichnung meint einen Träger militärischer Ausrüstung. „Waffenträger“ ist die geläufige deutsche Funktionsbezeichnung und vermeidet die Verengung von כֵלִים allein auf Rüstung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Dienstbedeutung von וַיַּעֲמֹד לְפָנָיו wird verständlich ausgedrückt; die starke, aber nicht näher bestimmte Zuneigung Sauls bleibt erhalten. Der Fußnotenmarker steht unmittelbar nach „Waffenträger“.
