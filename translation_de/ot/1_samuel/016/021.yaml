  naturalness: „Stand vor ihm“ ist im erzählenden, würdevollen modernen Standarddeutsch natürlich und verständlich. „Saul liebte ihn sehr“ ist unmittelbarer und idiomatischer als „Saul gewann ihn sehr lieb“.
  terminology: „Waffenträger“ ist für נֹשֵׂא כֵלִים eine etablierte und passende Funktionsbezeichnung. Die Fußnote erläutert die weitere Bedeutung von כֵלִים als militärische Ausrüstung sachgerecht.
