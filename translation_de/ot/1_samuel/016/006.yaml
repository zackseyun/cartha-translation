base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: de
  text: 'Als sie ankamen, sah Samuel Eliab und sagte: »Gewiss, sein Gesalbter ist vor Jahwe[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Messias«. Das hebräische Wort bezeichnet einen »Gesalbten«; aus demselben Wort stammt die Bezeichnung »Messias«. Hier meint Samuel den Mann, den Jahwe seiner Annahme nach zum König erwählt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: Als sie eintraten
  rationale: Die Verbindung aus וַיְהִי und בְּ mit Infinitiv bildet den zeitlichen Rahmen der folgenden Handlung. Die moderne deutsche Nebensatzkonstruktion gibt diese Erzählfunktion natürlich wieder; »eintraten« passt zur Ankunft Isais und seiner Söhne vor Samuel.
- source_word: וַיַּרְא אֶת אֱלִיאָב
  choice: sah Samuel Eliab
  rationale: ראה wird direkt mit »sah« wiedergegeben. Das im Hebräischen nur durch die Verbform bezeichnete Subjekt wird im Deutschen als »Samuel« genannt, damit der Bezug nach dem pluralischen Nebensatz eindeutig bleibt.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: אמר bedeutet hier schlicht »sagen«. Ob Samuel laut sprach oder bei sich dachte, wird im Hebräischen nicht ausdrücklich entschieden; daher wird keine innere Rede ergänzt.
- source_word: אַךְ
  choice: Gewiss
  rationale: אַךְ drückt hier Samuels feste, aber voreilige Überzeugung aus. »Gewiss« wahrt den nachdrücklichen Ton in würdigem, gegenwärtigem Deutsch.
- source_word: נֶגֶד יְהוָה
  choice: vor Jahwe steht
  rationale: נֶגֶד bezeichnet die Gegenwart beziehungsweise Position vor jemandem. Das im Hebräischen fehlende Kopulaverb wird im Deutschen durch »steht« natürlich ergänzt, ohne die Aussage inhaltlich auszubauen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: מְשִׁיחוֹ
  choice: sein Gesalbter
  rationale: מָשִׁיחַ bezeichnet hier den zum Königtum Gesalbten beziehungsweise den von Jahwe dafür Erwählten. Das Suffix wird mit »sein« bewahrt; der unmittelbare historische Sinn spricht für »Gesalbter« statt für den später als festen Titel gebrauchten Ausdruck »Messias«.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחוֹ im Zusammenhang der Königsauswahl
  choice: sein Gesalbter
  alternative: sein Messias
  rationale: »Gesalbter« gibt den unmittelbaren königlichen Kontext wieder, ohne vorschnell eine spätere messianische Titulatur einzutragen. Die echte lexikalische Verbindung zu »Messias« wird in der Fußnote sichtbar gemacht.
- issue: Bezug von נֶגֶד יְהוָה
  choice: vor Jahwe
  alternative: vor ihm
  rationale: Da יְהוָה ausdrücklich im hebräischen Text steht, wird der Gottesname auch in dieser Präpositionalphrase genannt. So bleibt die ungewöhnliche und theologisch spannungsvolle Aussage erhalten, statt den Bezug durch ein Pronomen abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung »vor Jahwe steht sein Gesalbter« bewahrt die Hervorhebung und Knappheit des Hebräischen. Der Name Samuel wird zur eindeutigen Subjektzuordnung ergänzt; die im Ausgangstext vorhandene Spannung zwischen Samuels Gewissheit und seinem Irrtum bleibt bestehen.
