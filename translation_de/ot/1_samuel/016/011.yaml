  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֣ל אֶל יִשַׁי֮ הֲ/תַ֣מּוּ הַ/נְּעָרִים֒ וַ/יֹּ֗אמֶר ע֚וֹד שָׁאַ֣ר הַ/קָּטָ֔ן וְ/הִנֵּ֥ה רֹעֶ֖ה בַּ/צֹּ֑אן וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל יִשַׁי֙ שִׁלְחָ֣/ה וְ/קָחֶ֔/נּוּ כִּ֥י לֹא נָסֹ֖ב עַד בֹּא֥/וֹ פֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: de
  text: 'Da sagte Samuel zu Isai: »Sind das alle jungen Männer?« Er antwortete: »Der Jüngste ist noch übrig; er hütet gerade die Schafe.[a]« Da sagte Samuel zu Isai: »Schick nach ihm und lass ihn holen; denn wir werden uns nicht setzen,[b] bis er hierherkommt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Er weidet die Herde.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wir werden nicht Platz nehmen«. Gemeint ist wahrscheinlich, dass das Mahl oder die förmliche Zusammenkunft erst nach seiner Ankunft beginnen sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: Sind das alle jungen Männer?
  rationale: Die Frage mit תמם zielt darauf, ob alle Söhne vollständig versammelt beziehungsweise vorgestellt sind. Die idiomatische deutsche Frage bewahrt diesen Sinn; נְעָרִים wird angesichts des Alters und der Aufgaben der Söhne als »junge Männer« wiedergegeben.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: Der Jüngste ist noch übrig
  rationale: Im familiären Zusammenhang bezeichnet הַקָּטָן den jüngsten Sohn. »Noch übrig« bewahrt die Betonung, dass einer bisher nicht vorgestellt wurde.
- source_word: וְהִנֵּה רֹעֶה בַּצֹּאן
  choice: er hütet gerade die Schafe
  rationale: Das Partizip bezeichnet eine andauernde Tätigkeit. »Gerade« vermittelt hier die aufmerksamkeitslenkende und situationsbezogene Funktion von הִנֵּה natürlicher als das im heutigen Deutsch gehobene »siehe«; צֹאן wird kollektiv als »die Schafe« wiedergegeben.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: Schick nach ihm und lass ihn holen
  rationale: Die zwei Handlungen des Sendens und Herbeibringens bleiben erkennbar, ohne im Deutschen den missverständlichen Eindruck zu erwecken, Isai solle selbst gehen.
- source_word: לֹא נָסֹב
  choice: wir werden uns nicht setzen
  rationale: Im Zusammenhang bezeichnet die Wendung wahrscheinlich das Platznehmen zum Mahl oder zur förmlichen Zusammenkunft. Die wörtlich mögliche Vorstellung des Sich-Wendens wäre hier unverständlich.
- source_word: עַד בֹּאוֹ פֹה
  choice: bis er hierherkommt
  rationale: Die temporale Konstruktion wird direkt und idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. »Isai« folgt der etablierten deutschen Namensform. Das altertümliche »siehe« wurde vermieden; die deiktische Funktion von הִנֵּה wird kontextgemäß durch »gerade« vermittelt. Sämtliche Fußnotenmarker stehen unmittelbar an den betreffenden Wendungen.
