  variant: modern standard German
source:
  edition: WLC
  text: וְ/ר֧וּחַ יְהוָ֛ה סָ֖רָה מֵ/עִ֣ם שָׁא֑וּל וּ/בִֽעֲתַ֥תּ/וּ רֽוּחַ רָעָ֖ה מֵ/אֵ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: de
  text: Der Geist des HERRN war von Saul gewichen, und ein böser Geist[a] vom HERRN versetzte ihn in Schrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein schädlicher Geist« oder »ein bedrängender Geist«. Das hebräische Eigenschaftswort kann etwas Böses, Schädliches oder Unheilvolles bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: Der Geist des HERRN
  rationale: רוּחַ kann »Geist«, »Wind« oder »Atem« bedeuten. Im Erzählzusammenhang ist die zuvor an Saul wirksam gewordene göttliche Gegenwart gemeint; daher ist »Geist« die naheliegende Wiedergabe. יְהוָה wird nach deutscher Bibelkonvention mit »der HERR« wiedergegeben.
- source_word: סָרָה מֵעִם
  choice: war von … gewichen
  rationale: סוּר bezeichnet ein Weichen, Sich-Entfernen oder Fortgehen. Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass dieser Entzug den folgenden Schrecken voraussetzt.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Übliche deutsche Form des Eigennamens.
- source_word: וּבִעֲתַתּוּ
  choice: versetzte ihn in Schrecken
  rationale: בעת bezeichnet heftiges Erschrecken oder Entsetzen. Die Formulierung bewahrt diesen Bedeutungskern, ohne das Verb weitergehend als »quälen« auszulegen.
- source_word: רוּחַ רָעָה
  choice: ein böser Geist
  rationale: רָעָה kann moralisch »böse«, aber auch »schädlich«, »unheilvoll« oder in seiner Wirkung »bedrängend« bedeuten. »Böser Geist« ist die direkte, knappe Hauptübersetzung; die weitere Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: מֵאֵת יְהוָה
  choice: vom HERRN
  rationale: מֵאֵת bezeichnet Herkunft oder Ausgangspunkt. »Vom HERRN« gibt dies knapp wieder; »vom HERRN gesandt« wäre bereits eine erklärende Erweiterung.
theological_decisions:
- issue: Die Herkunft des bösen beziehungsweise unheilvollen Geistes vom HERRN
  choice: ein böser Geist vom HERRN
  alternative: ein schädlicher oder bedrängender Geist vom HERRN; ein vom HERRN gesandter böser Geist
  rationale: Der hebräische Text führt den Geist ausdrücklich auf den HERRN als Herkunft zurück. Diese theologische Spannung wird weder abgeschwächt noch durch den Zusatz »gesandt« näher erklärt. Zugleich bleibt die semantische Spannweite von רָעָה in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »War … gewichen« und »versetzte ihn in Schrecken« sind gut verständlich und bewahren den ernsten Erzählton. Die Wiederholung »vom HERRN« folgt bewusst der ausdrücklichen Herkunftsangabe des Hebräischen.
