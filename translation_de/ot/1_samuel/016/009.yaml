  text: וַ/יַּעֲבֵ֥ר יִשַׁ֖י שַׁמָּ֑ה וַ/יֹּ֕אמֶר גַּם בָּ/זֶ֖ה לֹא בָחַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: de
  text: 'Dann ließ Isai Schamma vorübergehen, und Samuel sagte: »Auch diesen hat Jahwe nicht erwählt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: ließ … vorübergehen
  rationale: 'Der Hifil von עבר ist kausativ: Isai veranlasste, dass Schamma vor Samuel vorüberging. Die deutsche Formulierung bewahrt diesen Sinn natürlich.'
- source_word: יִשַׁי
  choice: Isai
  rationale: Gebräuchliche deutsche Namensform.
- source_word: שַׁמָּה
  choice: Schamma
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: וַיֹּאמֶר
  choice: er sagte
  rationale: Das Hebräische nennt den Sprecher nur mit einem Pronomen. Im Zusammenhang ist Samuel gemeint; die Übersetzung bewahrt die Ausdrucksweise des Ausgangstextes.
- source_word: גַּם בָּזֶה
  choice: auch diesen
  rationale: גַּם hat hier additive Bedeutung und reiht Schamma in die zuvor nicht Erwählten ein; בָּזֶה bezeichnet die gerade vorgestellte Person.
- source_word: לֹא בָחַר
  choice: hat … nicht erwählt
  rationale: בחר bedeutet wählen oder erwählen. Das Perfekt passt zur gegenwärtigen Feststellung über Gottes Entscheidung; „erwählt“ ist im biblischen Zusammenhang würdig und verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Identität des Sprechers
  choice: er sagte
  alternative: Samuel sagte
  rationale: Aus dem Kontext ergibt sich Samuel als Sprecher, doch der hebräische Vers selbst nennt ihn hier nicht ausdrücklich. Das Pronomen bewahrt diese formale Zurückhaltung.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. „Doch“ markiert idiomatisch den Gegensatz zwischen dem Vorführen Schammas und der erneuten Ablehnung, ohne den Aussagegehalt zu verändern.
