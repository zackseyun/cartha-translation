  text: וַ/יֹּאמְר֥וּ עַבְדֵֽי שָׁא֖וּל אֵלָ֑י/ו הִנֵּה נָ֧א רֽוּחַ אֱלֹהִ֛ים רָעָ֖ה מְבַעִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: de
  text: 'Da sagten Sauls Diener zu ihm: „Sieh doch, ein böser Geist von Gott versetzt dich in Schrecken.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein schädlicher, Unheil bringender Geist von Gott“. Das hebräische Wort kann den Geist als böse oder als Schaden und Bedrängnis verursachend bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da sagten“ gibt die Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: עַבְדֵי שָׁאוּל
  choice: Sauls Diener
  rationale: Im königlichen Hofkontext bezeichnet עֶבֶד hier Diener beziehungsweise Bedienstete; „Diener“ ist würdig und verständlich, ohne den Schwerpunkt auf Sklavenstatus zu legen.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Direkte Wiedergabe der Präposition mit pronominalem Suffix.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: Die Verbindung lenkt nachdrücklich die Aufmerksamkeit auf die gegenwärtige Lage. „Sieh doch“ ist modern und bewahrt den auffordernden Diskurswert.
- source_word: רוּחַ אֱלֹהִים
  choice: ein Geist von Gott
  rationale: „Von Gott“ bezeichnet Gott als Ursprung oder Auftraggeber, ohne den Geist mit Gottes eigenem Geist gleichzusetzen.
- source_word: רָעָה
  choice: böser
  rationale: רָעָה kann moralisch „böse“ oder funktional „schädlich, Unheil bringend“ bedeuten. Die direkte Wiedergabe steht im Text; die echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: מְבַעִתֶּךָ
  choice: versetzt dich in Schrecken
  rationale: Das Partizip beschreibt ein anhaltendes Geschehen; die Formulierung gibt die starke Bedeutung von בעת als Schrecken oder Entsetzen wieder.
theological_decisions:
- issue: Wiedergabe von רוּחַ אֱלֹהִים רָעָה, ohne die Aussage über Gottes Verhältnis zu dem Geist abzuschwächen oder später dogmatisch aufzulösen
  choice: ein böser Geist von Gott
  alternative: ein schädlicher / Unheil bringender Geist von Gott; ein böser Geist Gottes
  rationale: Der hebräische Text bringt den Geist ausdrücklich mit Gott in Verbindung. „Von Gott“ bewahrt diese Spannung, ohne ihn sprachlich mit Gottes eigenem Geist zu identifizieren. Die mögliche funktionale Bedeutung von רָעָה wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh doch“ vermeidet das altertümliche „Siehe“; „versetzt dich in Schrecken“ bewahrt die Stärke des hebräischen Verbs. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den er sich bezieht.
