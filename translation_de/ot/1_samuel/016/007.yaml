  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: de
  text: 'Doch Jahwe sagte zu Samuel: „Sieh nicht auf sein Aussehen und seine hohe Gestalt, denn ich habe ihn verworfen. Denn Jahwe sieht nicht so, wie der Mensch sieht:[a] Der Mensch sieht, was vor Augen ist,[b] Jahwe aber sieht das Herz.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Denn nicht, was der Mensch sieht.“ Der hebräische Satz ist elliptisch; die Übersetzung ergänzt aus dem Zusammenhang, dass Jahwes Sehen nicht dem menschlichen Sehen entspricht.'
    reason: Die Ellipse des hebräischen Textes lässt mehrere sinngemäße Ergänzungen zu.
  - marker: b
    text: „Der Mensch“ ist hier allgemein gemeint und bezeichnet Menschen insgesamt.
    reason: Der generische Gebrauch des hebräischen Singulars soll verdeutlicht werden.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תַּבֵּט
  choice: sieh nicht auf
  rationale: Die Wendung bezeichnet hier, dass Samuel sich bei seinem Urteil nicht an sichtbaren Merkmalen orientieren soll.
- source_word: מַרְאֵהוּ
  choice: sein Aussehen
  rationale: Die Formulierung gibt die sichtbare Erscheinung natürlich und präzise wieder.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: seine hohe Gestalt
  rationale: Dies bewahrt den Hinweis auf die auffällige Körpergröße, ohne im Deutschen schwerfällig zu klingen.
- source_word: מְאַסְתִּיהוּ
  choice: ich habe ihn verworfen
  rationale: Im Zusammenhang der Königsauswahl bezeichnet das Verb die Zurückweisung des Kandidaten.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Der Singular ist generisch und bezeichnet den Menschen im Gegensatz zu Jahwe.
- source_word: לֹא אֲשֶׁר יִרְאֶה הָאָדָם
  choice: es kommt nicht darauf an, was der Mensch sieht
  rationale: Der hebräische Ausdruck ist elliptisch. Die Wiedergabe bleibt nahe an seinem Wortlaut und vermeidet es, ein im Satz nicht ausdrücklich genanntes Subjekt einzusetzen.
- source_word: לַעֵינַיִם
  choice: was vor Augen ist
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild der Augen und bezeichnet das äußerlich Sichtbare.
- source_word: לַלֵּבָב
  choice: das Herz
  rationale: „Herz“ wahrt das biblische Bild für das innere Zentrum von Denken, Wollen und Gesinnung.
theological_decisions:
- issue: Gegensatz zwischen menschlichem und göttlichem Sehen
  choice: 'Denn es kommt nicht darauf an, was der Mensch sieht: Der Mensch sieht, was vor Augen ist, Jahwe aber sieht das Herz.'
  alternative: 'Denn Jahwe sieht nicht so, wie der Mensch sieht: Der Mensch sieht auf das Äußere, Jahwe aber sieht das Herz.'
  rationale: Der hebräische erste Vergleichssatz ist elliptisch. Die gewählte Fassung bewahrt diese Offenheit stärker, während der folgende Gegensatz klar erkennen lässt, dass Gottes Urteil nicht vom äußerlich Sichtbaren bestimmt wird.
- issue: Bedeutungsumfang von „Herz“
  choice: das Herz
  alternative: das Innere des Menschen
  rationale: Die konkrete Metapher des Ausgangstextes bleibt erhalten; sie ist nicht auf Gefühle beschränkt, sondern umfasst auch Denken, Wollen und Gesinnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gottesname erscheint als „Jahwe“. Die idiomatische Wendung „was vor Augen ist“ bewahrt das Bild des Hebräischen; „Herz“ bleibt als zentrale biblische Metapher stehen.
