  yaml_path: translation/ot/1_samuel/016/019.yaml
  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: de
  text: 'Da sandte Saul Boten zu Isai und sagte: „Schick deinen Sohn David zu mir, der bei der Herde ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Das Wayyiqtol von שׁלח bezeichnet hier eine einfache, fortschreitende Erzählhandlung; „sandte“ entspricht dem würdevollen deutschen Erzählstil.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im menschlichen Kontext bezeichnet מַלְאָכִים gewöhnlich Überbringer einer Nachricht; „Boten“ ist klar und vermeidet die unnötig diplomatische Färbung von „Gesandte“.
- source_word: אֶל יִשָׁי
  choice: zu Isai
  rationale: אֶל gibt die Richtung beziehungsweise den Adressaten an; „zu Isai“ ist im Deutschen natürlich.
- source_word: וַיֹּאמֶר
  choice: ließ ihm sagen
  rationale: Wörtlich steht „und sagte“. Da Saul durch die unmittelbar zuvor genannten Boten zu Isai spricht, gibt „ließ ihm sagen“ die kommunikative Situation im Deutschen eindeutig und idiomatisch wieder.
- source_word: שִׁלְחָה אֵלַי
  choice: Schick … zu mir
  rationale: Der Imperativ von שׁלח mit אֵלַי fordert Isai auf, David zu Saul zu schicken; die Richtungsangabe wird ausdrücklich bewahrt.
- source_word: אֶת דָּוִד בִּנְךָ
  choice: deinen Sohn David
  rationale: Die hebräische Apposition wird in natürlicher deutscher Wortfolge wiedergegeben.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: der bei der Herde ist
  rationale: בַּצֹּאן kann die Nähe zu beziehungsweise den Aufenthalt bei den Schafen oder der Herde bezeichnen. „Bei der Herde“ ist natürlich und bewahrt die räumliche Offenheit, ohne ausdrücklich eine Tätigkeit wie Hüten einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Erzählregister. „Isai“ folgt der etablierten deutschen Namensform. Die direkte Rede bleibt knapp; „ließ ihm sagen“ verdeutlicht ohne Bedeutungszusatz, dass Saul durch die Boten spricht.
