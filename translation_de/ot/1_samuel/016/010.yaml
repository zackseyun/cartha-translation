  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: de
  text: 'Da ließ Isai sieben seiner Söhne vor Samuel vorübergehen. Samuel sagte zu Isai: »Keinen von ihnen hat Jahwe erwählt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: ließ … vorbeigehen
  rationale: 'Der Hifil von עבר ist kausativ: Isai veranlasste, dass seine Söhne einzeln an Samuel vorbeigingen. Die deutsche Formulierung bewahrt diesen Sinn natürlich.'
- source_word: שִׁבְעַת בָּנָיו
  choice: sieben seiner Söhne
  rationale: Die Konstruktion bezeichnet sieben von Isais Söhnen und behauptet für sich genommen nicht, dass dies alle seine Söhne waren.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: an Samuel vorbei
  rationale: Im Zusammenhang einer nacheinander erfolgenden Begutachtung gibt dies die räumlich-relationale Bedeutung von לִפְנֵי idiomatisch wieder.
- source_word: לֹא בָחַר
  choice: hat … nicht erwählt
  rationale: בחר bedeutet wählen oder erwählen. »Erwählt« bewahrt hier die besondere göttliche Bestimmung, ohne über den Text hinauszugehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּאֵלֶּה
  choice: keinen von ihnen
  rationale: Die Verbindung der Präposition ב mit dem Demonstrativ bezeichnet hier idiomatisch die verneinte Auswahl aus der vorgestellten Gruppe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Nuance von בחר
  choice: erwählt
  alternative: ausgewählt
  rationale: »Erwählt« lässt den theologischen Klang göttlicher Bestimmung bestehen, ohne die Art oder Grundlage der Wahl näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht den Ablauf klar; »doch« markiert natürlich den Gegensatz zwischen der Vorstellung der sieben Söhne und Samuels ablehnendem Urteil.
