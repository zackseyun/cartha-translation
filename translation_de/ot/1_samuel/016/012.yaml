base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: de
  text: 'Da schickte er nach ihm und ließ ihn herbeibringen. Er war von rötlichem Aussehen, hatte schöne Augen und sah gut aus. Da sagte Jahwe: »Steh auf und salbe ihn, denn er ist es[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »denn dieser ist es.«'
    reason: Die hebräische Wendung כִּי זֶה הוּא ist knapp und nachdrücklich; die Fußnote zeigt ihre formnähere Struktur.
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: Da ließ er ihn holen
  rationale: Die beiden aufeinanderfolgenden Erzählformen bedeuten wörtlich, dass Isai sandte und ihn herbringen ließ. Die deutsche Kausativform gibt den Vorgang natürlich wieder, ohne zu behaupten, Isai habe David persönlich hereingeführt.
- source_word: אַדְמוֹנִי
  choice: von rötlichem Aussehen
  rationale: Das Wort bezeichnet eine rötliche Färbung beziehungsweise einen rötlichen Teint. Die Formulierung vermeidet die unbelegte Festlegung auf rote Haare.
- source_word: עִם יְפֵה עֵינַיִם
  choice: hatte schöne Augen
  rationale: Dies gibt die körperliche Beschreibung idiomatisch und ihrem unmittelbaren Sinn entsprechend wieder.
- source_word: וְטוֹב רֹאִי
  choice: sah gut aus
  rationale: Die Wendung bezeichnet ein ansprechendes äußeres Erscheinungsbild. Die Übersetzung ist modernes, natürliches Deutsch und überhöht die Aussage nicht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קוּם מְשָׁחֵהוּ
  choice: Steh auf und salbe ihn
  rationale: Die beiden Imperative werden knapp, direkt und würdig wiedergegeben; „salben“ ist im Zusammenhang der Königserwählung der präzise Ausdruck.
- source_word: כִּי זֶה הוּא
  choice: denn er ist es
  rationale: Die kurze, nachdrückliche Identifizierung bleibt erhalten. Natürliches Deutsch verlangt hier keine wörtliche Wiedergabe beider Demonstrativ- und Personalformen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Davids äußere Beschreibung
  choice: Die körperlichen Merkmale werden ohne symbolische oder moralische Deutung wiedergegeben.
  alternative: אַדְמוֹנִי auf rote Haare festlegen oder die Merkmale als Hinweise auf innere Eigenschaften deuten
  rationale: Der Vers beschreibt Davids Aussehen, legt aber weder die genaue Art der rötlichen Färbung noch eine geistliche Symbolik fest. Diese Offenheit bleibt gewahrt.
- issue: Nachdrückliche Identifizierung in כִּי זֶה הוּא
  choice: denn er ist es
  alternative: denn dieser ist der Richtige
  rationale: „Er ist es“ bewahrt die knappe göttliche Identifizierung. „Der Richtige“ würde die Aussage erklärend erweitern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bestimmt; unnötig altertümliche Formen werden vermieden.
