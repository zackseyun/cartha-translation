  source_fidelity: 'Der Text gibt die hebräische Satzfolge und alle zentralen Elemente zutreffend wieder: Samuel nimmt das Ölhorn, salbt David inmitten seiner Brüder, Jahwes Geist kommt von jenem Tag an kraftvoll über David, und Samuel geht nach Rama. „Ölhorn“, „mitten unter seinen Brüdern“, „von diesem Tag an“ und „nach Rama“ sind sachgerecht. Für וַתִּצְלַח ist „erfasste David mit Macht“ eine idiomatische, nachdrückliche Wiedergabe, ohne die theologische Deutung über den hebräischen Befund hinaus festzulegen.'
  naturalness: Die vorgeschlagene Revision ist modernes, würdiges Standarddeutsch. „Erfasste David von jenem Tag an mit Macht“ vermeidet die etwas sperrige Stellung von „kam von diesem Tag an mit Macht über David“, wahrt aber deren Aussage. „Jahwe“ und „Rama“ sind im Deutschen etablierte Formen.
  terminology: „Jahwe“ gibt יהוה konsequent als Namen wieder. „Geist Jahwes“ wahrt die hebräische Formulierung; die deutsche Substantivgroßschreibung soll dabei nicht als Festlegung einer weitergehenden systematisch-theologischen Lesart gelten. „Salbte“ und „Ölhorn“ bewahren den rituellen beziehungsweise konkreten Wortlaut.
