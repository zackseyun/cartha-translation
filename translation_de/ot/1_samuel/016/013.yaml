  to: Da nahm Samuel das Ölhorn und salbte David mitten unter seinen Brüdern. Und der Geist Jahwes[b] erfasste David von jenem Tag an mit Macht[a]. Dann machte sich Samuel auf und ging nach Rama.
  rationale: 'Die Übersetzung wird nur behutsam überarbeitet: Die Aussage von וַתִּצְלַח wird mit „erfasste … mit Macht“ natürlich und kraftvoll wiedergegeben, und beide Fußnoten erhalten eindeutige, inhaltlich passende Anker. Die übrigen Formulierungen bleiben erhalten, weil sie den hebräischen Text präzise und idiomatisch abbilden.'
