  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת קֶ֣רֶן הַ/שֶּׁ֗מֶן וַ/יִּמְשַׁ֣ח אֹת/וֹ֮ בְּ/קֶ֣רֶב אֶחָי/ו֒ וַ/תִּצְלַ֤ח רֽוּחַ יְהוָה֙ אֶל דָּוִ֔ד מֵ/הַ/יּ֥וֹם הַ/ה֖וּא וָ/מָ֑עְלָ/ה וַ/יָּ֣קָם שְׁמוּאֵ֔ל וַ/יֵּ֖לֶךְ הָ/רָמָֽתָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: de
  text: Da nahm Samuel das Ölhorn und salbte David mitten unter seinen Brüdern. Und der Geist Jahwes[b] erfasste David von jenem Tag an mit Macht[a]. Dann machte sich Samuel auf und ging nach Rama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kam machtvoll über David“. Das hebräische Verb kann ein kraftvolles, befähigendes Kommen des Geistes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische unterscheidet nicht durch Groß- und Kleinschreibung, ob „Geist“ als besondere Bezeichnung für Gottes Geist verstanden werden soll; im Deutschen werden Substantive ohnehin großgeschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: das Ölhorn
  rationale: קֶרֶן bezeichnet wörtlich ein Horn, hier ein als Ölbehälter verwendetes Tierhorn. „Ölhorn“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: וַיִּמְשַׁח אֹתוֹ
  choice: und salbte David
  rationale: משׁח ist das übliche Verb für die rituelle Salbung. Der Name „David“ stellt im Deutschen den eindeutigen Bezug des hebräischen Pronomens her, ohne den Sinn zu erweitern.
- source_word: בְּקֶרֶב אֶחָיו
  choice: mitten unter seinen Brüdern
  rationale: בְּקֶרֶב bedeutet „inmitten“; die Formulierung wahrt sowohl den familiären Rahmen als auch die Anwesenheit der Brüder, ohne weitergehende Öffentlichkeit vorauszusetzen.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: der Geist Jahwes kam mit Macht über David
  rationale: צלח bezeichnet in dieser Verbindung ein kraftvolles, wirksames Kommen. „Kam mit Macht über“ gibt die Dynamik idiomatisch wieder, ohne die Wirkung näher auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Umschrift „Jahwe“ gibt den Gottesnamen wieder, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: von diesem Tag an
  rationale: Die Wendung bezeichnet den Beginn eines fortdauernden Zustands; „von diesem Tag an“ ist präzise und idiomatisch.
- source_word: וַיָּקָם שְׁמוּאֵל
  choice: Dann machte sich Samuel auf
  rationale: קום leitet hier den anschließenden Aufbruch ein. „Machte sich auf“ ist würdevoll, verständlich und passt zur folgenden Ortsbewegung.
- source_word: וַיֵּלֶךְ הָרָמָתָה
  choice: und ging nach Rama
  rationale: Das direktionale ה zeigt die Bewegung nach Rama an; „nach Rama“ ist die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Bedeutung von רוּחַ יְהוָה
  choice: der Geist Jahwes
  alternative: der Geist bzw. die Geisteskraft Jahwes
  rationale: Der Kontext spricht von Jahwes wirksamer, befähigender Gegenwart. Die Übersetzung lässt offen, wie diese Aussage systematisch-theologisch einzuordnen ist; im Deutschen kann Großschreibung die Deutungsfrage nicht markieren, da „Geist“ als Substantiv stets großgeschrieben wird.
- issue: Art des Kommens des Geistes in וַתִּצְלַח ... אֶל
  choice: kam mit Macht über David
  alternative: drang machtvoll auf David ein
  rationale: Die gewählte Fassung bewahrt den kraftvollen Charakter des Verbs, ohne eine bestimmte Lehre über Art oder Dauer der Geistmitteilung einzutragen.
- issue: Rahmen der Salbung
  choice: mitten unter seinen Brüdern
  alternative: im Kreis seiner Brüder
  rationale: Der Wortlaut nennt ausdrücklich Davids Brüder als anwesenden Rahmen. Die Übersetzung leitet daraus weder eine völlig private noch eine umfassend öffentliche Anerkennung ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählstruktur. Der Gottesname wird als „Jahwe“ wiedergegeben. Das konkrete Bild des Ölhorns bleibt erhalten; ungebräuchliche Wörtlichkeit und konfessionell festgelegte Deutungen werden vermieden.
