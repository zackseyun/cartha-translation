  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֗ה בִּֽ/הְי֤וֹת רֽוּחַ אֱלֹהִים֙ אֶל שָׁא֔וּל וְ/לָקַ֥ח דָּוִ֛ד אֶת הַ/כִּנּ֖וֹר וְ/נִגֵּ֣ן בְּ/יָד֑/וֹ וְ/רָוַ֤ח לְ/שָׁאוּל֙ וְ/ט֣וֹב ל֔/וֹ וְ/סָ֥רָה מֵ/עָלָ֖י/ו ר֥וּחַ הָ/רָעָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: de
  text: Und sooft der Geist Gottes über Saul kam, nahm David die Leier[a] und spielte sie mit seiner Hand. Dann fand Saul Erleichterung, und es ging ihm gut; der böse[b] Geist wich von ihm.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Harfe“. Das hebräische kinnor bezeichnet ein antikes Saiteninstrument, das wahrscheinlich eher einer Leier als einer modernen Harfe ähnelte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „schädliche“ beziehungsweise „unheilvolle“. Das hebräische Wort kann sowohl „böse“ als auch „schädlich, unheilvoll“ bedeuten; hier kann besonders die quälende Wirkung auf Saul gemeint sein.'
    reason: lexical_alternative
  - marker: c
    text: Am Anfang des Verses steht wörtlich „der Geist Gottes“, am Ende dagegen „der böse Geist“. Die Übersetzung bewahrt diesen Unterschied im hebräischen Wortlaut, statt beide Wendungen einander anzugleichen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: Und sooft ... kam
  rationale: Die Konstruktion mit היה und Infinitivus constructus beschreibt hier einen wiederkehrenden Vorgang. „Sooft“ gibt diesen iterativen Sinn natürlich wieder.
- source_word: רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  rationale: Der hebräische Text lautet an dieser Stelle schlicht „Geist Gottes“; die nähere Bestimmung als böse beziehungsweise schädlich steht erst am Versende.
- source_word: אֶל שָׁאוּל
  choice: über Saul kam
  rationale: Die Formulierung beschreibt das Einsetzen einer Saul erfassenden Einwirkung. „Über Saul kam“ ist im Deutschen idiomatisch und wahrt die Bewegungsrichtung von אֶל.
- source_word: הַכִּנּוֹר
  choice: die Leier
  rationale: כִּנּוֹר bezeichnet ein antikes Saiteninstrument, das eher einer Leier als einer modernen Harfe entsprach.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: und spielte sie mit seiner Hand
  rationale: נגן bezeichnet das Spielen eines Saiteninstruments. Das Pronomen „sie“ nimmt die Leier natürlich wieder auf; „mit seiner Hand“ bewahrt die ausdrückliche hebräische Wendung.
- source_word: וְרָוַח לְשָׁאוּל
  choice: Dann fand Saul Erleichterung
  rationale: Das Verb bezeichnet Erleichterung oder Aufatmen. Die deutsche Formulierung gibt Saul klar als den Betroffenen wieder.
- source_word: וְטוֹב לוֹ
  choice: und es ging ihm gut
  rationale: Die Wendung bezeichnet eine Besserung seines Zustands. „Es ging ihm gut“ ist modernes, verständliches Deutsch, ohne die Art der Besserung enger festzulegen.
- source_word: רוּחַ הָרָעָה
  choice: der böse Geist
  rationale: רָעָה kann moralisch „böse“ oder wirkungsbezogen „schädlich, unheilvoll“ bedeuten. „Böse“ bewahrt die grundlegende Mehrdeutigkeit; eine Fußnote nennt die kontextuell mögliche Alternative.
- source_word: וְסָרָה מֵעָלָיו
  choice: wich von ihm
  rationale: סור bezeichnet hier das Sichentfernen beziehungsweise Weichen. „Wich von ihm“ ist knapp, natürlich und dem erzählerischen Register angemessen.
theological_decisions:
- issue: Verhältnis von רוּחַ אֱלֹהִים am Anfang und רוּחַ הָרָעָה am Ende
  choice: Die erste Wendung wird als „der Geist Gottes“, die zweite als „der böse Geist“ wiedergegeben.
  alternative: Die erste Wendung kontextuell als „der böse/schädliche Geist von Gott“ harmonisieren oder die zweite ausschließlich als „der schädliche Geist“ deuten.
  rationale: Der hebräische Vers verwendet bewusst unterschiedliche Ausdrücke. Die Übersetzung bewahrt diese Spannung und importiert die ausführlichere Formulierung benachbarter Verse nicht in den ersten Satzteil.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. „Sooft“ macht den wiederkehrenden Vorgang sichtbar. Die ausdrückliche Wendung „mit seiner Hand“ bleibt trotz ihrer leichten Fremdheit erhalten, da sie im Hebräischen hervorgehoben ist. Die Satzzeichen ordnen die Handlungsfolge, ohne zusätzliche Kausalität einzutragen.
