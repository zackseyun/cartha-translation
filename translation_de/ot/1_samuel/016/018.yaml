  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: de
  text: 'Da antwortete einer der jungen Männer: „Siehe, ich habe einen Sohn Isais aus Bethlehem gesehen: Er kann gut spielen, ist ein tapferer Mann und ein Krieger, spricht mit Umsicht und sieht gut aus; und Jahwe ist mit ihm.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵהַנְּעָרִים וַיֹּאמֶר
  choice: Da antwortete einer der jungen Männer
  rationale: Die übliche hebräische Dialogformel wird im natürlichen Deutschen ohne das redundante „antwortete und sagte“ wiedergegeben. נְעָרִים bleibt als „junge Männer“ lexikalisch offen, auch wenn im Hofkontext Bedienstete gemeint sein können.
- source_word: הִנֵּה רָאִיתִי
  choice: Ich habe … gesehen
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die folgende Empfehlung; im Deutschen leistet die präsentische Relevanz des Perfekts dies bereits natürlich, sodass ein zusätzliches „Sieh“ schwerfällig wäre.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: einen Sohn Isais aus Bethlehem
  rationale: Der Gentilbegriff bezeichnet hier die Herkunft aus Bethlehem. „Aus Bethlehem“ ist im modernen Deutsch klarer und natürlicher als „den Bethlehemiter“.
- source_word: יֹדֵעַ נַגֵּן
  choice: Er kann gut spielen
  rationale: Die Wendung bezeichnet musikalisches Können, nennt in diesem Vers aber kein Instrument. „Spielen“ bewahrt diese Offenheit; „gut“ vermittelt die Kompetenz.
- source_word: גִּבּוֹר חַיִל וְאִישׁ מִלְחָמָה
  choice: ein tapferer und kampferprobter Mann
  rationale: גִּבּוֹר חַיִל kann Tüchtigkeit, Stärke oder Tapferkeit bezeichnen; zusammen mit אִישׁ מִלְחָמָה liegt hier eine militärische Beschreibung nahe. Die Wiedergabe vermeidet die unnatürliche wörtliche Doppelung „Held der Kraft und Mann des Krieges“.
- source_word: וּנְבוֹן דָּבָר
  choice: spricht mit Umsicht
  rationale: Die Wendung verbindet Einsicht mit Wort oder Rede. Diese Übersetzung wahrt den wahrscheinlichen Bezug auf besonnenes Sprechen, ohne sie auf bloße Beredsamkeit zu verengen.
- source_word: וְאִישׁ תֹּאַר
  choice: sieht gut aus
  rationale: תֹּאַר bezeichnet Gestalt bzw. äußere Erscheinung. Die Formulierung ist aktuell und würdig, ohne übermäßig körperliche Einzelheiten einzutragen.
- source_word: וַיהוָה עִמּוֹ
  choice: Und Jahwe ist mit ihm
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die verblos formulierte Aussage bezeichnet Gottes Gegenwart und Beistand.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Eigennamen ausdrücklich. „Jahwe“ lässt den Bundesnamen als Namen erkennbar und folgt der konsultierten POB-Entscheidung.
- issue: Bedeutung von „Jahwe ist mit ihm“
  choice: Wörtlich-offene Aussage über Gottes Gegenwart und Beistand
  alternative: Jahwe gibt ihm Erfolg
  rationale: Die knappe hebräische Formulierung kann Gunst und wirksamen Beistand einschließen, nennt Erfolg jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Reihe der Eigenschaften wurde syntaktisch geglättet, ohne das im Hebräischen nicht genannte Musikinstrument zu ergänzen. Keine Fußnoten sind für das Verständnis dieses Einzelverses zwingend erforderlich.
