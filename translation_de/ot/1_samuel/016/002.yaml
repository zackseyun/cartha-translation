source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: de
  text: 'Samuel sagte: „Wie soll ich gehen? Wenn Saul davon hört, wird er mich töten.“ Yahweh sagte: „Nimm eine junge Kuh[a] mit und sage: ‚Ich bin gekommen, um Yahweh ein Opfer darzubringen.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Färse“.'
    reason: Lexikalische Alternative für ein junges weibliches Rind.
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: Wie soll ich gehen?
  rationale: Die Frage betrifft die praktische Möglichkeit angesichts der Gefahr. Die deutsche Wendung ist natürlich und bewahrt Samuels besorgten Einwand.
- source_word: וְשָׁמַע שָׁאוּל
  choice: Wenn Saul davon hört
  rationale: Das formal mit וְ angeschlossene Perfekt hat hier im Zusammenhang konditionalen Sinn. „Davon“ bezeichnet Samuels Vorhaben, ohne zusätzliche Einzelheiten einzutragen.
- source_word: וַהֲרָגַנִי
  choice: wird er mich töten
  rationale: Die Verbform bezeichnet die von Samuel erwartete Folge für den Fall, dass Saul davon erfährt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֶגְלַת בָּקָר
  choice: eine junge Kuh
  rationale: Die Wortverbindung bezeichnet ein junges weibliches Rind. „Junge Kuh“ ist im heutigen Deutsch allgemein verständlich; die fachsprachlich präzisere Alternative steht in der Fußnote.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Nimm ... mit
  rationale: Die wörtliche Wendung „in deine Hand nehmen“ bedeutet idiomatisch, das Tier mitzunehmen.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: um Yahweh ein Opfer darzubringen
  rationale: Die Formulierung gibt die kultische Opferhandlung klar und würdig wieder, ohne den Ablauf näher zu bestimmen.
- source_word: בָּאתִי
  choice: Ich bin gekommen
  rationale: Das Perfekt bezeichnet hier das vollzogene Kommen, dessen Zweck unmittelbar genannt wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen. Die Umschrift „Yahweh“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bildet Samuels Sorge sowie Yahwehs Anweisung ohne erklärende Zusätze ab.
