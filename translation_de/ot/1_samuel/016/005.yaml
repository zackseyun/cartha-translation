source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם לִ/זְבֹּ֤חַ לַֽ/יהוָה֙ בָּ֔אתִי הִֽתְקַדְּשׁ֔וּ וּ/בָאתֶ֥ם אִתִּ֖/י בַּ/זָּ֑בַח וַ/יְקַדֵּ֤שׁ אֶת יִשַׁי֙ וְ/אֶת בָּנָ֔י/ו וַ/יִּקְרָ֥א לָ/הֶ֖ם לַ/זָּֽבַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: de
  text: 'Er antwortete[a]: »In Frieden. Ich bin gekommen, um Jahwe ein Opfer darzubringen. Heiligt euch und kommt mit mir zum Opfer.« Dann heiligte er Isai und seine Söhne und lud sie zum Opfer ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Alles ist gut.« Wörtlich steht hier nur »Frieden«; Samuel versichert damit, dass er in friedlicher und nicht in feindlicher Absicht gekommen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: In Frieden
  rationale: Das alleinstehende Substantiv antwortet auf die Frage aus Vers 4, ob Samuel in friedlicher Absicht kommt. »In Frieden« bewahrt die knappe hebräische Ausdrucksweise und ist im Deutschen verständlicher als das isolierte »Frieden«.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: um Jahwe ein Opfer darzubringen
  rationale: Der Infinitiv bezeichnet den Zweck von Samuels Kommen. Die idiomatische deutsche Wendung gibt den kultischen Vorgang klar wieder, ohne ihn näher zu bestimmen.
- source_word: הִתְקַדְּשׁוּ
  choice: Heiligt euch
  rationale: Der Hitpael bezeichnet hier die rituelle Vorbereitung auf das Opfer. »Heiligt euch« erhält den kultischen und reflexiven Sinn; »reinigt euch« wäre enger.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: und kommt mit mir zum Opfer
  rationale: Die Form wirkt im Zusammenhang als Aufforderung beziehungsweise Einladung. Die Übersetzung bewahrt sowohl die Bewegung als auch den Bezug auf das konkrete Opfer.
- source_word: וַיְקַדֵּשׁ
  choice: heiligte er
  rationale: Der Piel beschreibt, dass Samuel Isai und seine Söhne für die Teilnahme am heiligen Geschehen rituell vorbereitete beziehungsweise aussonderte. Die Wiederholung des Stammes קדשׁ bleibt im Deutschen sichtbar.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: lud sie zum Opfer ein
  rationale: קרא mit ל kann ein Rufen oder Einladen bezeichnen. Hier passt »einladen«, weil Samuel sie nach ihrer Heiligung in die Opferhandlung einbezieht.
- source_word: יִשַׁי
  choice: Isai
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das Hebräische bezeichnet ausdrücklich die männlichen Nachkommen, was für den Fortgang der Erzählung wichtig ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. »Jahwe« gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Wortverbindung zwischen »heiligt euch« und »heiligte er« wird bewusst erhalten; erklärende Ausweitungen im Haupttext werden vermieden.
