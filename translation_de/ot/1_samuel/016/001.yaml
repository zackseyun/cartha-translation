source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Samuel: „Wie lange willst du noch um Saul trauern? Ich habe ihn doch als König über Israel verworfen. Füll dein Horn mit Öl und geh! Ich sende dich zu Isai aus Betlehem, denn unter seinen Söhnen habe ich mir einen König ersehen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gesehen“. Das hebräische Verb kann hier im Sinn von „ausgewählt“ oder „bereitgestellt“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: מִתְאַבֵּל
  choice: trauern
  rationale: Das Verb bezeichnet anhaltendes Trauern; „noch“ bringt zusammen mit „wie lange“ den fortdauernden Aspekt im natürlichen Deutschen zum Ausdruck.
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל יִשְׂרָאֵל
  choice: ich habe ihn doch als König über Israel verworfen
  rationale: „Verworfen“ entspricht dem Sinn von מאס; die Formulierung begrenzt die Aussage kontextgemäß auf Sauls Königtum, ohne weitergehende theologische Folgerungen einzutragen.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: Füll dein Horn mit Öl
  rationale: Das konkrete Bild des als Gefäß verwendeten Horns bleibt erhalten.
- source_word: אֶשְׁלָחֲךָ
  choice: Ich sende dich
  rationale: Das hebräische Imperfekt bezeichnet hier den unmittelbar geltenden göttlichen Auftrag; das deutsche Präsens gibt dies knapp und natürlich wieder.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: Isai aus Betlehem
  rationale: Die Herkunftsbezeichnung wird in allgemein verständlichem modernem Deutsch wiedergegeben.
- source_word: רָאִיתִי לִי
  choice: habe ich mir ... ersehen
  rationale: „Ersehen“ bewahrt den Anklang an die Grundbedeutung „sehen“ und kann zugleich eine bewusste Auswahl ausdrücken; die Fußnote hält die lexikalische Spannweite offen.
- source_word: בְּבָנָיו
  choice: unter seinen Söhnen
  rationale: Die Präposition bezeichnet hier die Auswahl eines Königs innerhalb der Gruppe von Isais Söhnen.
- source_word: מֶלֶךְ
  choice: einen König
  rationale: Das Nomen ist unbestimmt und bezeichnet den noch nicht namentlich genannten König.
theological_decisions:
- issue: Umfang der Verwerfung Sauls
  choice: als König über Israel verworfen
  alternative: vollständig verworfen
  rationale: Der unmittelbare Gegenstand der Verwerfung ist Sauls Herrschaft über Israel. Die Übersetzung weitet dies nicht zu einer Aussage über sein endgültiges persönliches oder geistliches Geschick aus.
- issue: Bedeutung von רָאִיתִי im Blick auf den künftigen König
  choice: mir einen König ersehen
  alternative: mir einen König ausgewählt / bereitgestellt
  rationale: Die gewählte Wiedergabe wahrt sowohl das Bild des Sehens als auch den kontextuellen Sinn göttlicher Auswahl, ohne die genuine Bedeutungsbreite stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Imperative und direkte Rede erhalten die Dringlichkeit des Auftrags; „ersehen“ ist bewusst leicht gehoben, aber verständlich und trägt die Bildsprache des Hebräischen.
