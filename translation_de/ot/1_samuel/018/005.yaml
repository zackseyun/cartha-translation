base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: de
  text: Bei allem, wozu Saul ihn sandte, zog David aus und handelte klug[a]. Da setzte Saul ihn über die Soldaten. Das war gut in den Augen des ganzen Volkes und auch in den Augen von Sauls Dienern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatte Erfolg“ beziehungsweise „war erfolgreich“. Das hebräische Verb kann sowohl kluges, umsichtiges Handeln als auch den daraus hervorgehenden Erfolg bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Er gefiel dem ganzen Volk und auch Sauls Dienern“ oder „Das gefiel dem ganzen Volk und auch Sauls Dienern“. Das Hebräische lässt offen, ob sich die Aussage auf David selbst, auf seine Einsetzung oder auf die gesamte zuvor geschilderte Lage bezieht.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … hin
  rationale: Das Verb יצא bedeutet wörtlich „hinausgehen“. Im Erzählzusammenhang geht es um Davids wiederholtes Ausziehen zu den Aufträgen oder Unternehmungen, auf die Saul ihn sandte.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: überallhin, wohin Saul ihn sandte
  rationale: Die räumlich-distributive Wiedergabe ist im Deutschen natürlich und passt zu Davids wiederholten Einsätzen; wörtlicher wäre „bei allem, wozu Saul ihn sandte“.
- source_word: יַשְׂכִּיל
  choice: handelte klug
  rationale: Der Hifil von שׂכל kann kluges, umsichtiges Handeln und den daraus hervorgehenden Erfolg bezeichnen. „Handelte klug“ bewahrt den lexikalischen Kern, während die Fußnote die Erfolgsnuance offenhält.
- source_word: וַיְשִׂמֵהוּ
  choice: setzte … über
  rationale: שׂים mit עַל bezeichnet hier das Einsetzen in eine Leitungsstellung. „Setzte ihn über“ bleibt nah an der hebräischen Formulierung und ist zugleich verständlich.
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: über die Kriegsleute
  rationale: Die Wendung bezeichnet die zum Krieg gehörenden Männer beziehungsweise Kämpfer. „Kriegsleute“ bewahrt die kollektive und militärische Bedeutung, ohne einen modernen militärischen Dienstgrad einzutragen.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Das war gut in den Augen
  rationale: Die Wiedergabe erhält das hebräische Bewertungsidiom und vermeidet es im Haupttext, den nicht ausdrücklich genannten Bezug von „das/es“ auf David, seine Ernennung oder die gesamte geschilderte Lage festzulegen.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: עָם bezeichnet hier am ehesten das Volk insgesamt; eine Beschränkung auf das Heer ist nicht ausdrücklich gegeben.
- source_word: עַבְדֵי שָׁאוּל
  choice: Sauls Diener
  rationale: עֲבָדִים kann am Königshof Diener, Gefolgsleute oder Amtsträger bezeichnen. „Diener“ ist die direkteste Wiedergabe und lässt den genauen gesellschaftlichen Rang offen.
