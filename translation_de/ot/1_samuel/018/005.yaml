translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräischen Wendungen „über jemanden setzen“ und „gut in den Augen“ bleiben erkennbar, ohne dass der Satz unverständlich wird. Die Wiederholung von „in den Augen“ folgt bewusst dem Ausgangstext; die beiden echten Bedeutungs- beziehungsweise Bezugsalternativen werden in Fußnoten bewahrt.
