base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: de
  text: 'Da sagte Saul: »Ich werde sie ihm geben, damit sie ihm zur Falle wird und die Hand der Philister sich gegen ihn richtet.« Dann sagte Saul zu David: »Mit der zweiten[a] kannst du heute mein Schwiegersohn werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zum zweiten Mal kannst du heute mein Schwiegersohn werden.« Die hebräische Wendung ist verkürzt und kann entweder Sauls zweite Tochter oder eine zweite Gelegenheit für David bezeichnen, in Sauls Familie einzuheiraten.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: Ich werde sie ihm geben
  rationale: Im Heiratszusammenhang bedeutet die Wendung, eine Tochter zur Frau zu geben. Die knappe Form bewahrt den hebräischen Wortlaut; der Zusammenhang macht den Eheschließungssinn deutlich.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: damit sie ihm zur Falle wird
  rationale: מוֹקֵשׁ bezeichnet eine Falle oder Schlinge. »Falle« ist im heutigen Deutsch natürlich und erhält das Bild; der Kontext legt eine Absichtsangabe nahe.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: und die Hand der Philister gegen ihn ist
  rationale: Die Hand steht bildhaft für Macht beziehungsweise feindliches Vorgehen. Die Formulierung bewahrt das hebräische Bild und verdeutlicht zugleich die feindliche Ausrichtung.
- source_word: בִּשְׁתַּיִם
  choice: Durch die zweite
  rationale: Die elliptische Wendung kann sich im Kontext auf Sauls zweite Tochter beziehen. »Durch die zweite« gibt den möglichen instrumentalen Sinn wieder, ohne die im Hebräischen nicht ausdrücklich wiederholte Tochter einzufügen.
- source_word: תִּתְחַתֵּן בִּי
  choice: kannst du mein Schwiegersohn werden
  rationale: Das Hitpael von חתן mit ב bezeichnet das Eingehen einer Heiratsverbindung; hier geht es konkret darum, Sauls Schwiegersohn zu werden.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die gewöhnliche Bedeutung ist »heute«; sie passt auch zur unmittelbaren, rhetorischen Zusage Sauls.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Da sagte Saul ... Dann sagte Saul
  rationale: Die zweifache Redeeinleitung bleibt erhalten und unterscheidet Sauls geäußerte Absicht von seiner anschließenden direkten Rede an David.
theological_decisions: []
