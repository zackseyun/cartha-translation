  text: וַ/יְהִ֗י בְּ/עֵ֥ת תֵּ֛ת אֶת מֵרַ֥ב בַּת שָׁא֖וּל לְ/דָוִ֑ד וְ/הִ֧יא נִתְּנָ֛ה לְ/עַדְרִיאֵ֥ל הַ/מְּחֹלָתִ֖י לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: de
  text: Doch als die Zeit kam, Merab, Sauls Tochter, David zur Frau zu geben, wurde sie Adriel aus Mehola zur Frau gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Doch als die Zeit kam
  rationale: Die Verbindung leitet eine neue, gegenüber der Erwartung kontrastierende Erzählentwicklung ein; zusammen mit der Zeitangabe ergibt sich im Deutschen natürlich diese temporale Formulierung.
- source_word: תֵּת אֶת מֵרַב בַּת שָׁאוּל לְדָוִד
  choice: Merab, Sauls Tochter, David zur Frau zu geben
  rationale: Die Apposition identifiziert Merab klar. Im Zusammenhang einer Heiratsvereinbarung gibt die Wendung „jemandem zur Frau geben“ sowohl נתן als auch den Empfänger mit לְ idiomatisch wieder.
- source_word: וְהִיא נִתְּנָה
  choice: wurde sie … gegeben
  rationale: Das Passiv und das ausdrücklich gesetzte Pronomen rücken Merab und den unerwarteten Ausgang in den Mittelpunkt; die deutsche Passivkonstruktion bewahrt diesen Fokus.
- source_word: לְעַדְרִיאֵל
  choice: Adriel
  rationale: Übliche deutsche Wiedergabe des Personennamens; die Präposition wird durch den Dativ in „Adriel … gegeben“ ausgedrückt.
- source_word: הַמְּחֹלָתִי
  choice: aus Mehola
  rationale: Das Gentiliz bezeichnet Adriels Herkunft bzw. Zugehörigkeit zu Abel-Mehola/Mehola. „aus Mehola“ ist im heutigen Deutsch natürlicher und verständlicher als „der Meholatiter“.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Dies ist eine geläufige hebräische Heiratsformel. „Zur Frau“ ist würdig, knapp und im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung „zur Frau … zur Frau“ spiegelt die beabsichtigte Heirat und ihren unerwarteten Ausgang klar wider, ohne den Text auszudeuten.
