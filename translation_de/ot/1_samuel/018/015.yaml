  text: וַ/יַּ֣רְא שָׁא֔וּל אֲשֶׁר ה֖וּא מַשְׂכִּ֣יל מְאֹ֑ד וַ/יָּ֖גָר מִ/פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/015.yaml
  text: When Saul saw that he was very successful[b][a], he was afraid of him.
translation:
  language: de
  text: Als Saul sah, dass David sehr erfolgreich war[a], fürchtete er sich vor ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sehr klug handelte“ oder „großes Gelingen hatte“. Das hebräische Wort kann umsichtiges Handeln und den daraus entstehenden Erfolg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als Saul sah
  rationale: Das narrative וַ leitet die nächste Handlung ein; zusammen mit dem folgenden Wahrnehmungsinhalt gibt „als“ den zeitlich-kausalen Zusammenhang im Deutschen natürlich wieder.
- source_word: אֲשֶׁר הוּא
  choice: dass David
  rationale: אֲשֶׁר führt den Inhalt von Sauls Wahrnehmung ein. Der Eigenname „David“ klärt den im Hebräischen aus dem Kontext erschlossenen Bezug des Pronomens, ohne den Sinn zu verändern.
- source_word: מַשְׂכִּיל
  choice: erfolgreich war
  rationale: Das Hifil-Partizip von שׂכל kann sowohl kluges beziehungsweise umsichtiges Handeln als auch den daraus folgenden Erfolg bezeichnen. Im Kontext steht Davids sichtbares Gelingen im Vordergrund; eine Fußnote bewahrt die semantische Breite.
- source_word: מְאֹד
  choice: sehr
  rationale: Das gewöhnliche deutsche Intensivierungswort entspricht dem hebräischen Adverb.
- source_word: וַיָּגָר
  choice: fürchtete er sich
  rationale: גור bezeichnet hier Furcht oder Scheu. „Sich fürchten“ ist natürliches, würdiges Standarddeutsch und lässt offen, ob ein momentaner Schrecken oder eine anhaltende Furcht gemeint ist.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die wörtliche Wendung „von seinem Angesicht her“ ist hier eine idiomatische Bezeichnung für die Person, vor der Saul Angst hat; „vor ihm“ entspricht zugleich der natürlichen deutschen Rektion.
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Der Personenbezug wird durch „David“ verdeutlicht; die Bedeutungsbreite von מַשְׂכִּיל bleibt in der Fußnote erhalten.
