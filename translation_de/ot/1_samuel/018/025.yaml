source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל כֹּֽה תֹאמְר֣וּ לְ/דָוִ֗ד אֵֽין חֵ֤פֶץ לַ/מֶּ֨לֶךְ֙ בְּ/מֹ֔הַר כִּ֗י בְּ/מֵאָה֙ עָרְל֣וֹת פְּלִשְׁתִּ֔ים לְ/הִנָּקֵ֖ם בְּ/אֹיְבֵ֣י הַ/מֶּ֑לֶךְ וְ/שָׁא֣וּל חָשַׁ֔ב לְ/הַפִּ֥יל אֶת דָּוִ֖ד בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: de
  text: 'Da sagte Saul: „So sollt ihr zu David sagen: ‚Der König verlangt keinen Brautpreis[a], sondern hundert Vorhäute von Philistern, um an den Feinden des Königs Rache zu nehmen.‘“ Saul aber hatte vor, David durch die Hand der Philister zu Fall zu bringen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Brautpreis“ war eine im Zusammenhang mit der Heirat vom Bräutigam oder seiner Familie an die Familie der Braut erbrachte Leistung; er ist nicht mit einer Mitgift gleichzusetzen.
    reason: cultural_note
  - marker: b
    text: „Zu Fall bringen“ kann hier bedeuten, Davids Tod herbeizuführen; der hebräische Ausdruck sagt dies jedoch nicht ausdrücklich.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: Brautpreis
  rationale: Das hebräische Wort bezeichnet die im Zusammenhang mit einer Heirat üblicherweise vom Bräutigam beziehungsweise seiner Familie erbrachte Zahlung; „Brautpreis“ ist daher genauer als „Mitgift“.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ ... כִּי
  choice: Der König verlangt keinen …, sondern
  rationale: Die deutsche Gegenüberstellung gibt im Zusammenhang einer geforderten Heiratsleistung den Sinn der hebräischen Wendung natürlich wieder, ohne חֵפֶץ mechanisch mit „Gefallen“ zu übersetzen.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: hundert Vorhäute von Philistern
  rationale: Die direkte Formulierung bewahrt die drastische Konkretheit der Forderung und macht deutlich, dass die Vorhäute von Philistern stammen sollen.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: um an den Feinden des Königs Rache zu nehmen
  rationale: Die Zweckangabe und Sauls auffällige Rede von sich selbst als „dem König“ bleiben erhalten; die idiomatische deutsche Wendung lässt den im Kontext erschließbaren Handelnden unausgesprochen.
- source_word: חָשַׁב
  choice: hatte vor
  rationale: Im Kontext bezeichnet das Verb Sauls absichtsvollen Plan und nicht lediglich einen Gedanken.
- source_word: לְהַפִּיל אֶת דָּוִד
  choice: David … zu Fall zu bringen
  rationale: Die Wendung bewahrt das Bild des hebräischen Kausativs und legt nicht ausdrücklich fest, ob nur Davids Sturz oder sein Tod gemeint ist.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: durch die Hand der Philister
  rationale: Die Formulierung erhält das hebräische Bild und bezeichnet zugleich die Philister als die vorgesehenen Ausführenden.
theological_decisions: []
