base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: de
  text: Da teilten seine Diener David diese Worte[a] mit. Der Gedanke, Schwiegersohn des Königs zu werden[b], gefiel David; und die festgesetzte Zeit war noch nicht abgelaufen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Dinge“ beziehungsweise „diese Angelegenheit“. Das hebräische Wort kann sowohl Worte als auch Sachverhalte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sich mit dem König durch Heirat zu verschwägern“. Gemeint ist hier, der Schwiegersohn des Königs zu werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und die Tage waren noch nicht voll geworden“. Gemeint ist, dass die dafür festgesetzte Zeit noch nicht abgelaufen war.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: teilten … mit
  rationale: Der Hifil von נגד bedeutet hier, etwas bekannt zu machen oder mitzuteilen. Die Formulierung ist im Deutschen natürlich und passt zur mündlichen Übermittlung.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Gemeint sind im Zusammenhang Sauls Bedienstete beziehungsweise Hofdiener. „Diener“ gibt den Ausdruck direkt wieder, ohne unnötig den sozialen Status „Sklaven“ festzulegen.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דברים kann „Worte“ oder „Dinge/Angelegenheiten“ bedeuten. Da hier eine Botschaft weitergegeben wird, passt „Worte“ zum unmittelbaren Zusammenhang; die weitere Bedeutung bleibt in einer Fußnote sichtbar.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: David sagte der Gedanke zu
  rationale: Die hebräische Wendung bezeichnet etwas, das in jemandes Augen recht, passend oder erfreulich ist. Die deutsche Formulierung gibt den Sinn natürlich wieder, ohne daraus ein moralisches Urteil zu machen.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: der Schwiegersohn des Königs zu werden
  rationale: Die reflexive Form von חתן bezeichnet das Eingehen einer verwandtschaftlichen Beziehung durch Heirat. Im Erzählzusammenhang geht es konkret darum, dass David durch die Heirat mit der Königstochter Sauls Schwiegersohn wird.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: und die festgesetzte Zeit war noch nicht abgelaufen
  rationale: Wörtlich sind „die Tage noch nicht voll geworden“. Gemeint ist, dass der vorgesehene Zeitraum beziehungsweise die Frist noch nicht zu Ende war.
