  text: וַ/יְהִ֥י דָוִ֛ד לְ/כָל דָּרְכָ֖/ו מַשְׂכִּ֑יל וַֽ/יהוָ֖ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: de
  text: David handelte auf allen seinen Wegen klug[a], und Jahwe war mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »war auf allen seinen Wegen erfolgreich« beziehungsweise »hatte bei allem, was er tat, Erfolg«. Das hebräische Wort kann kluges, umsichtiges Handeln und den daraus entstehenden Erfolg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דָוִד
  choice: David handelte
  rationale: Die hebräische Konstruktion führt Davids fortdauerndes Verhaltensmuster ein. Im Deutschen gibt eine verbale Formulierung den Satz natürlicher wieder als eine wörtliche Kopulakonstruktion.
- source_word: לְכָל דָּרְכָו
  choice: auf allen seinen Wegen
  rationale: Die Wendung bewahrt das hebräische Bild und bezeichnet zugleich Davids gesamtes Verhalten beziehungsweise seine Unternehmungen.
- source_word: מַשְׂכִּיל
  choice: klug
  rationale: Das Hifil-Partizip von שכל kann einsichtiges oder umsichtiges Handeln und den daraus erwachsenden Erfolg bezeichnen. „klug handeln“ bewahrt den Schwerpunkt auf Davids Verhalten, ohne die mögliche Erfolgsbedeutung auszuschließen.
- source_word: וַיהוָה
  choice: und Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: עִמּוֹ
  choice: war mit ihm
  rationale: Die Präposition עִם bezeichnet hier Gottes Gegenwart und Beistand; „war mit ihm“ ist die natürliche und sachlich offene deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe „Jahwe“ macht den im Ausgangstext verwendeten Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Klugheit und Erfolg in מַשְׂכִּיל
  choice: handelte … klug, mit Fußnote zur Erfolgsbedeutung
  alternative: war erfolgreich / hatte Erfolg
  rationale: Der Text kann sowohl umsichtiges Verhalten als auch dessen erfolgreichen Ausgang anklingen lassen. Die Hauptfassung hält am lexikalischen Kern des verständigen Handelns fest; die Fußnote bewahrt die echte Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Wendung „auf allen seinen Wegen“ bleibt erhalten; die Satzstruktur ist zugleich natürlich und leicht verständlich.
