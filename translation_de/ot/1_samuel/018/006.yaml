  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/ם בְּ/שׁ֤וּב דָּוִד֙ מֵ/הַכּ֣וֹת אֶת הַ/פְּלִשְׁתִּ֔י וַ/תֵּצֶ֨אנָה הַ/נָּשִׁ֜ים מִ/כָּל עָרֵ֤י יִשְׂרָאֵל֙ ל/שור וְ/הַ/מְּחֹל֔וֹת לִ/קְרַ֖את שָׁא֣וּל הַ/מֶּ֑לֶךְ בְּ/תֻפִּ֥ים בְּ/שִׂמְחָ֖ה וּ/בְ/שָׁלִשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: de
  text: 'Und es geschah: Als sie ankamen, als David zurückkehrte, nachdem er den Philister niedergeschlagen hatte, zogen die Frauen aus allen Städten Israels singend und tanzend König Saul entgegen, mit Handtrommeln, mit Freude und mit Dreisaiteninstrumenten[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes ist unsicher. Es kann sich auf dreisaitige Instrumente, Lauten oder eine andere Art musikalischer Begleitung beziehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Bewahrt die hebräische Erzählungsformel in würdigem, noch verständlichem Deutsch und eröffnet die neue Szene.
- source_word: בְּבוֹאָם
  choice: Als sie heimkamen
  rationale: Die temporale Infinitivkonstruktion mit pluralischem Suffix bleibt erhalten. „Heimkamen“ gibt im Zusammenhang die Ankunft des zurückkehrenden Heeres natürlich wieder, ohne den im Vers ungenannten Bezug ausdrücklich festzulegen.
- source_word: בְּשׁוּב דָּוִד מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: als David von seinem Sieg über den Philister zurückkehrte
  rationale: נכה kann schlagen, niederstrecken oder besiegen bezeichnen. „Sieg über“ bildet das Ergebnis im Kontext idiomatisch ab; der Singular „den Philister“ bleibt gewahrt und verweist wahrscheinlich auf den zuvor genannten Vorkämpfer.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים מִכָּל עָרֵי יִשְׂרָאֵל
  choice: zogen die Frauen aus allen Städten Israels
  rationale: יצא beschreibt ihr Herauskommen aus den Städten; „zogen … entgegen“ ergibt zusammen mit לִקְרַאת eine natürliche deutsche Bewegungsangabe.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: singend und tanzend
  rationale: Die Zweck- beziehungsweise Begleithandlung wird idiomatisch als gleichgeordnetes deutsches Partizippienpaar wiedergegeben.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: König Saul entgegen
  rationale: Gibt die Bewegung zum Empfang Sauls knapp und natürlich wieder; Titel und Name stehen in der üblichen deutschen Reihenfolge.
- source_word: בְּתֻפִּים
  choice: mit Handtrommeln
  rationale: תֹּף bezeichnet eine mit der Hand gespielte Rahmentrommel. „Handtrommeln“ ist anschaulich und vermeidet die möglicherweise irreführende Gleichsetzung mit dem modernen Tamburin samt Schellen.
- source_word: בְּשִׂמְחָה
  choice: mit Jubel
  rationale: Im festlichen musikalischen Kontext drückt „Jubel“ die hör- und sichtbare Freude natürlicher aus als das abstraktere „Freude“.
- source_word: וּבְשָׁלִשִׁים
  choice: mit Dreisaiteninstrumenten
  rationale: Die genaue Bedeutung des seltenen Ausdrucks ist unsicher. Die Wiedergabe folgt einer verbreiteten Herleitung von „drei“, markiert die Unsicherheit jedoch durch eine Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte hebräische Zeitangabe bleibt erkennbar, wird aber durch Zeichensetzung und idiomatische Bewegungsverben lesbar gestaltet. Die unklare Instrumentenbezeichnung wird nicht ohne Hinweis vereindeutigt.
