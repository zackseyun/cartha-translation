- from: 'Und es geschah: Als sie heimkamen, als David von seinem Sieg über den Philister zurückkehrte, zogen die Frauen aus allen Städten Israels singend und tanzend König Saul entgegen, mit Handtrommeln, mit Jubel und mit Dreisaiteninstrumenten[a].'
  to: 'Und es geschah: Als sie ankamen, als David zurückkehrte, nachdem er den Philister niedergeschlagen hatte, zogen die Frauen aus allen Städten Israels singend und tanzend König Saul entgegen, mit Handtrommeln, mit Freude und mit Dreisaiteninstrumenten[a].'
  rationale: Die Revision entfernt die zusätzlichen Implikationen von „heimkamen“ und „Sieg“, hält den im Hebräischen offenen pluralischen Bezug bei „sie“ aufrecht und gibt נכה konkret, aber ohne eine über das Verb hinausgehende Spezifizierung wieder. „Mit Freude“ entspricht dem allgemeinen Sinn von בְּשִׂמְחָה. Die strittige Instrumentenbezeichnung bleibt im Text als plausible Möglichkeit und wird in der Fußnote ausdrücklich abgesichert.
