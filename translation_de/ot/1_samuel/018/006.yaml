  naturalness: Die Formulierung ist überwiegend modernes, würdiges Standarddeutsch. Die doppelte temporale Einleitung ist wegen der hebräischen Konstruktion vertretbar; mit „ankamen“ statt „heimkamen“ bleibt sie zugleich idiomatisch und weniger einengend.
  terminology: „König Saul“, „Handtrommeln“ und „singend und tanzend“ sind angemessen. Für בְּשִׂמְחָה ist „mit Freude“ semantisch näher als „mit Jubel“. Die unsichere Bedeutung von שָׁלִשִׁים muss, wie im Entwurf, durch eine Fußnote kenntlich bleiben; „Dreisaiteninstrumente“ sollte daher nicht als sichere Identifikation erscheinen.
