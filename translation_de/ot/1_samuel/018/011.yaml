  yaml_path: translation/ot/1_samuel/018/011.yaml
  text: Saul hurled the spear and said, “I will pin David to the wall.” But David dodged away from him twice.
translation:
  language: de
  text: 'Saul schleuderte den Speer und sagte: »Ich will David an die Wand spießen!« Doch David wich ihm zweimal aus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: schleuderte
  rationale: Das Verb bezeichnet hier das kraftvolle Werfen des Speers; »schleuderte« gibt die gezielte Gewalttat natürlich wieder.
- source_word: וַיֹּאמֶר
  choice: dachte
  rationale: Hebräisch אָמַר kann auch inneres Sprechen bezeichnen. Der Satz gibt Sauls Absicht wieder, ohne ausdrücklich einen Adressaten zu nennen.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: Ich will David an die Wand spießen
  rationale: Die knappe Konstruktion bedeutet wörtlich etwa »Ich werde David und die Wand treffen«. Im Zusammenhang bezeichnet sie das Durchbohren beziehungsweise Festspießen Davids an der Wand.
- source_word: וַיִּסֹּב ... מִפָּנָיו
  choice: wich ihm ... aus
  rationale: Die Wendung beschreibt Davids Ausweichbewegung weg von Saul; »wich ihm aus« ist im Deutschen idiomatisch und wahrt den Handlungssinn.
- source_word: פַּעֲמָיִם
  choice: zweimal
  rationale: Direkte Wiedergabe der dualischen Zahlform.
