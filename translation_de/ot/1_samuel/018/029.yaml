  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אסֶף שָׁא֗וּל לֵ/רֹ֛א מִ/פְּנֵ֥י דָוִ֖ד ע֑וֹד וַ/יְהִ֥י שָׁא֛וּל אֹיֵ֥ב אֶת דָּוִ֖ד כָּל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/029.yaml
  text: Saul continued to fear David even more[b][a], and Saul was David’s enemy all his days.
translation:
  language: de
  text: Saul fürchtete sich noch mehr vor David[a], und er war Davids Feind sein Leben lang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Saul fürchtete sich weiterhin vor David“ beziehungsweise „Saul fürchtete sich noch weiter vor David“. Die hebräische Wendung verbindet „hinzufügen/fortfahren“ mit „sich fürchten“; עוֹד kann den Gedanken des Fortdauerns oder der Steigerung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „alle Tage“. Die Wendung kann auch eine ununterbrochene Dauer betonen, ohne ausdrücklich auf Sauls gesamte Lebenszeit festgelegt zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף
  choice: noch mehr
  rationale: In Verbindung mit dem Infinitiv bezeichnet יָסַף ein Fortfahren oder eine weitere Steigerung. Zusammen mit עוֹד gibt „noch mehr“ die zunehmende Furcht in diesem Zusammenhang natürlich wieder.
- source_word: לֵרֹא מִפְּנֵי דָוִד
  choice: fürchtete sich … vor David
  rationale: Die Verbindung von ירא mit מִפְּנֵי ist idiomatisch als Furcht vor einer Person zu verstehen; die deutsche Wendung bewahrt sowohl den Sinn als auch die Satzstruktur.
- source_word: עוֹד
  choice: noch mehr
  rationale: עוֹד kann „noch“, „weiterhin“ oder „weiter“ bedeuten. Im erzählerischen Zusammenhang verstärkt es Sauls bereits erwähnte Furcht.
- source_word: וַיְהִי
  choice: war
  rationale: היה beschreibt hier Sauls anhaltende Haltung gegenüber David. „War“ bewahrt die Zustandsaussage, ohne ausdrücklich einen erst jetzt eintretenden Wandel zu behaupten.
- source_word: אֹיֵב אֶת דָּוִד
  choice: Davids Feind
  rationale: אֹיֵב bezeichnet einen Feind oder Widersacher; David ist das Ziel von Sauls Feindschaft. Die Genitivkonstruktion ist im Deutschen knapp und natürlich.
- source_word: כָּל הַיָּמִים
  choice: sein Leben lang
  rationale: Wörtlich „alle Tage“; die gewählte Formulierung gibt die wahrscheinlich gemeinte dauerhafte Feindschaft idiomatisch wieder, während die mögliche allgemeinere Dauerbedeutung in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die Wiederholung des Namens Saul im zweiten Satzteil wurde durch „er“ ersetzt, da die Referenz eindeutig bleibt; die semantische Spannung zwischen fortdauernder und zunehmender Furcht wird in der Fußnote offengehalten.
