  terminology: „Seele“ ist hier als konsequente Wiedergabe von נֶפֶשׁ angemessen, auch wenn das deutsche Wort kontextuell Deutungsassoziationen haben kann. „Liebte ihn wie seine eigene Seele“ bewahrt sowohl die Wiederholung als auch die unbestimmte Art der intensiven Bindung, ohne sie romantisch oder politisch festzulegen.
