source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: de
  text: 'Und es geschah, als er aufgehört hatte, zu Saul zu reden: Jonatans Seele war mit Davids Seele verbunden,[a] und Jonatan liebte ihn wie seine eigene Seele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jonatans Seele wurde an Davids Seele gebunden.«'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht in diesem Vers dreimal dasselbe Wort: »Jonatans Seele … Davids Seele … seine eigene Seele.«'
    reason: lexical_repetition
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische Erzählformel wird erkennbar bewahrt, ohne einen altertümlichen Ausdruck wie »es begab sich« zu verwenden.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: als er aufgehört hatte, zu reden
  rationale: כְּ mit Infinitivus constructus und Suffix bezeichnet hier die zeitliche Folge; das Plusquamperfekt fügt sich natürlich in den deutschen Erzählfluss ein.
- source_word: אֶל שָׁאוּל
  choice: zu Saul
  rationale: אֶל bezeichnet gewöhnlich die Ausrichtung auf jemanden hin und wird im Redekontext direkt wiedergegeben.
- source_word: נֶפֶשׁ
  choice: Seele
  rationale: Die dreifache Wiederholung von נֶפֶשׁ prägt den Vers. »Seele« bewahrt diese Wiederholung und die Intensität der persönlichen Verbundenheit.
- source_word: נִקְשְׁרָה
  choice: verband sich
  rationale: Das Nifal von קשר beschreibt ein Gebunden- oder Verknüpftwerden. »Verband sich« gibt das Bild in natürlichem Deutsch wieder, ohne die Aussage auszudeuten.
- source_word: בְּנֶפֶשׁ דָּוִד
  choice: mit Davids Seele
  rationale: Die Präposition בְּ wird hier im Rahmen der Bindungsmetapher passend mit »mit« wiedergegeben; zugleich bleibt das wiederholte Wort »Seele« ausdrücklich erhalten.
- source_word: וַיֶּאֱהָבוֹ
  choice: und Jonatan liebte ihn
  rationale: אהב bezeichnet Liebe beziehungsweise tiefe Zuneigung; das Objektsuffix verweist auf David. Der Name Jonatan macht das im Deutschen eindeutige Subjekt klar.
- source_word: כְּנַפְשׁוֹ
  choice: wie seine eigene Seele
  rationale: Die Formulierung bewahrt das dritte Vorkommen von נֶפֶשׁ und damit die bewusste Wortwiederholung des Hebräischen.
theological_decisions:
- issue: Art von Jonatans Liebe zu David
  choice: Die starke persönliche Verbundenheit wird ohne weitere Qualifizierung als Liebe wiedergegeben.
  alternative: Die Liebe ausdrücklich als politisch-bündnishaft oder als romantisch-sexuell bestimmen.
  rationale: נֶפֶשׁ und אהב bezeichnen eine tiefe Bindung und Zuneigung. Der Vers selbst legt deren genauere Art nicht fest; die Übersetzung soll ihre Stärke weder abschwächen noch eine nicht ausdrücklich genannte Deutung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Erzählformel bleibt sichtbar; die dreifache Wiederholung von »Seele« und die Bindungsmetapher werden bewahrt. Der Bezug des nicht ausdrücklich genannten Subjekts in »als er aufgehört hatte« wird entsprechend dem Hebräischen nicht im Haupttext aufgelöst.
