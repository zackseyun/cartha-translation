  rationale: Die Revision beschränkt sich auf die Wiedergabe von נִקְשְׁרָה. „War ... verbunden“ ist eine natürliche passive Formulierung und gibt die hebräische Bindungsmetapher ohne Bedeutungszuwachs wieder. Die syntaktische Ambiguität des nicht genannten Subjekts von „als er aufgehört hatte“ bleibt erhalten; im Kontext ist David gemeint, aber der deutsche Haupttext expliziert dies nicht.
