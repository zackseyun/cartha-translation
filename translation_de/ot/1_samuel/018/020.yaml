  text: וַ/תֶּאֱהַ֛ב מִיכַ֥ל בַּת שָׁא֖וּל אֶת דָּוִ֑ד וַ/יַּגִּ֣דוּ לְ/שָׁא֔וּל וַ/יִּשַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/020.yaml
  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: de
  text: Michal, Sauls Tochter, liebte David. Man berichtete Saul davon, und die Sache gefiel ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Sache war recht in seinen Augen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: liebte
  rationale: אהב bezeichnet hier unmittelbar Liebe. „Liebte“ bleibt näher am hebräischen Verb als das stärker inchoative „verliebte sich“.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Michal, Sauls Tochter
  rationale: Der Eigenname folgt der üblichen deutschen Form; die Konstruktverbindung wird als natürliche deutsche Apposition wiedergegeben.
- source_word: אֶת דָּוִד
  choice: David
  rationale: Der direkte Objektmarker אֶת bleibt unübersetzt; der Name erscheint in seiner üblichen deutschen Form.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Als man Saul davon berichtete
  rationale: Das Hifil von נגד bedeutet „mitteilen, berichten“. Das unbestimmte Subjekt der dritten Person Plural wird im Deutschen idiomatisch mit „man“ wiedergegeben; „davon“ bezieht den Bericht klar auf Michals Liebe.
- source_word: הַדָּבָר
  choice: die Sache
  rationale: דבר bezeichnet hier den berichteten Sachverhalt, nicht notwendig ein gesprochenes Wort.
- source_word: וַיִּשַׁר ... בְּעֵינָיו
  choice: gefiel ihm
  rationale: Die hebräische Wendung bedeutet, dass etwas in Sauls Einschätzung gut oder erfreulich war. „Gefiel ihm“ gibt dies in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen hebräischen Erzählformen werden in zwei Sätzen wiedergegeben; „als“ macht den sachlichen Zusammenhang natürlich, ohne ein ausdrückliches Zeitwort wie „nun“ einzuführen.
