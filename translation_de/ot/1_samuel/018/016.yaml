base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/016.yaml
  text: But all Israel and Judah loved David[a], because he went out and came in before them.
translation:
  language: de
  text: Doch ganz Israel und Juda liebten David[a], denn er vor ihnen auszog und einzog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „führte sie hinaus und führte sie herein“; das heißt, er trat als ihr öffentlicher Anführer auf, besonders im Kampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Doch ganz
  rationale: Das וְ knüpft kontrastiv an Sauls Furcht und Feindschaft im vorigen Zusammenhang an; „doch“ gibt diese Diskursfunktion natürlich wieder, während „ganz“ den umfassenden Sinn von כָל bewahrt.
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: Israel und Juda
  rationale: Die direkte Wiedergabe erhält die im Samuelbuch übliche Unterscheidung zwischen Israel und Juda, ohne sie im Haupttext auszudeuten.
- source_word: אֹהֵב
  choice: liebten
  rationale: Das singularische Partizip beim zusammengesetzten Subjekt bezeichnet einen anhaltenden beziehungsweise allgemeinen Zustand. Im Deutschen verlangt das mehrteilige Subjekt den Plural; das Präteritum passt zum Erzählstil.
- source_word: אֶת דָּוִד
  choice: David
  rationale: Der Akkusativmarker אֶת bleibt unübersetzt; der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier den Grund für die Liebe des Volkes an. „Denn“ ist im deutschen Erzählstil natürlich und wahrt die kausale Beziehung.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen wird als ausdrückliches Subjekt des folgenden Verbenpaares beibehalten.
- source_word: יוֹצֵא וָ/בָא
  choice: zog … aus und ein
  rationale: Die transparente Wiedergabe bewahrt die hebräische Paarformel und ihren militärisch-öffentlichen Klang, ohne die im Text nicht ausdrücklich genannten Objekte „sie“ einzufügen. Die mögliche Führungsbedeutung wird in der Fußnote erläutert.
- source_word: לִ/פְנֵי/הֶם
  choice: vor ihnen
  rationale: Dies entspricht dem wörtlichen Sinn und lässt zugleich offen, ob die Wendung sichtbares Auftreten in ihrer Gegenwart oder Führung an ihrer Spitze bezeichnet.
