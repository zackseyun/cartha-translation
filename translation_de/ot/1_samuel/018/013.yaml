translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärisch-öffentliche Wendung wird im Haupttext weitgehend formal bewahrt; die mögliche idiomatische Bedeutung wird in der Fußnote erklärt. Der Eigenname »David« wird zur natürlichen deutschen Bezugsklärung verwendet, obwohl das Hebräische an dieser Stelle ein Pronomen hat.
