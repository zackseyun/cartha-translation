  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: de
  text: Da entfernte Saul ihn von sich und setzte ihn zum Befehlshaber über tausend Mann ein. Er ging vor dem Volk aus und ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Er ging aus und ein vor dem Volk.« Die hebräische Wendung kann öffentliches oder militärisches Handeln bezeichnen, möglicherweise auch das Führen des Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: entfernte ihn
  rationale: Die Hifil-Form von סוּר bezeichnet hier das Entfernen beziehungsweise Wegnehmen; die Formulierung wahrt die konkrete Handlung, ohne Sauls Beweggrund weiter auszudeuten.
- source_word: מֵעִמּוֹ
  choice: aus seiner Nähe
  rationale: Das hebräische »von bei ihm« bezeichnet hier Sauls unmittelbares Umfeld beziehungsweise seine Gegenwart. »Aus seiner Nähe« ist natürliches Deutsch und erhält den räumlich-relationalen Sinn.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: setzte ihn ... ein
  rationale: שׂוּם mit indirektem Objekt bezeichnet die Zuweisung eines Amtes; »einsetzen« gibt den offiziellen Charakter natürlich wieder.
- source_word: שַׂר אָלֶף
  choice: Obersten über tausend Mann
  rationale: שַׂר bezeichnet einen militärischen oder administrativen Führer. »Oberster über tausend Mann« bewahrt sowohl Rang als auch Größenangabe.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: zog ... aus und ein
  rationale: Die wörtliche Wendung bleibt erhalten, da sie öffentliches oder militärisches Handeln und möglicherweise Führerschaft bezeichnen kann. »Zog« passt zum militärischen Zusammenhang, ohne die Aussage auf einzelne Feldzüge zu verengen.
- source_word: לִפְנֵי הָעָם
  choice: vor dem Volk
  rationale: Die Wiedergabe bleibt nahe am Hebräischen und lässt offen, ob Sichtbarkeit, Auftreten oder Führung im Vordergrund steht.
