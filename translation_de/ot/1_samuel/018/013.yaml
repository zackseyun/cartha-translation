  - severity: low
    issue: Die Fußnote bezeichnet eine vom Haupttext abweichende Formulierung als wörtlich.
    rationale: Der Haupttext verwendet »zog«, die Fußnote »ging«. Die Fußnote sollte die hebräische Wortfolge genau wiedergeben und die idiomatische Deutung davon unterscheiden.
