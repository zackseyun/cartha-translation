  source_fidelity: Der Entwurf gibt die Abfolge der drei hebräischen Verben und die militärisch-öffentliche Wendung im Wesentlichen zutreffend wieder. »Darum« legt jedoch eine ausdrückliche logische Folgerung stärker fest, als das einfache erzählende וַ nahelegt. Die Einfügung von »David« ist zwar kontextuell eindeutig, aber für die pronominale Vorlage nicht erforderlich.
  naturalness: »Saul entfernte ihn aus seiner Nähe« ist verständlich, aber »Saul entfernte ihn von sich« ist im Deutschen idiomatischer und zugleich näher an מֵעִמּוֹ. Die Formel »zog ... aus und ein« ist in diesem Kontext möglich, doch »ging ... aus und ein« bewahrt die bewusst offene hebräische Wendung besser.
  terminology: »Oberster« kann im heutigen Deutsch leicht den modernen militärischen Rang »Oberst« hervorrufen. »Befehlshaber über tausend Mann« ist verständlich, wahrt die militärische Funktion von שַׂר und behauptet keine präzise moderne Rangentsprechung.
