base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: de
  text: 'Da befahl Saul seinen Dienern: „Sprecht David heimlich an und sagt ihm: ‚Sieh, der König hat Gefallen an dir, und alle seine Diener lieben dich. Nun werde der Schwiegersohn des Königs[a].‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Geh mit dem König eine Heiratsverbindung ein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl
  rationale: צוה bezeichnet hier eine verbindliche Anweisung; „befahl“ gibt deren Nachdruck knapp und natürlich wieder.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עבד kann am Königshof Diener, Bedienstete oder Amtsträger bezeichnen. „Diener“ bewahrt die breite Bedeutung, ohne einen bestimmten Rang festzulegen.
- source_word: בַּלָּט
  choice: im Vertrauen
  rationale: Das Adverb bezeichnet eine verborgene, unauffällige oder vertrauliche Mitteilung. „Im Vertrauen“ passt zur beabsichtigten diskreten Ansprache Davids.
- source_word: הִנֵּה
  choice: Sieh
  rationale: הנה lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage; „Sieh“ erhält diese Diskursfunktion in würdigem, verständlichem Deutsch.
- source_word: חָפֵץ בְּךָ
  choice: hat Gefallen an dir
  rationale: חפץ mit ב bezeichnet Wohlgefallen oder Freude an jemandem. Die Wendung vermeidet eine im Deutschen mögliche romantische Nebenbedeutung von „begehrt dich“.
- source_word: אֲהֵבוּךָ
  choice: lieben dich
  rationale: אהב bedeutet unmittelbar „lieben“. Auch wenn im höfischen Zusammenhang Zuneigung oder Wohlwollen gemeint sein kann, sollte die Stärke des hebräischen Ausdrucks erhalten bleiben.
- source_word: וְעַתָּה
  choice: Nun
  rationale: Die Wendung leitet aus der zugesicherten Gunst zur Aufforderung über. „Nun“ bildet diesen Übergang idiomatisch ab.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: werde der Schwiegersohn des Königs
  rationale: Der Hitpael von חתן bezeichnet das Eingehen einer Heiratsverwandtschaft. Im Kontext wird David aufgefordert, durch die Ehe mit Sauls Tochter dessen Schwiegersohn zu werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die höfische Perspektive bleiben erhalten. „Im Vertrauen“ gibt die diskrete Art der Ansprache wieder; „Schwiegersohn des Königs“ formuliert die im Hebräischen allgemein als Heiratsverbindung bezeichnete Beziehung im Kontext natürlich aus.
