  text: וַ/יִּתְפַּשֵּׁ֣ט יְהוֹנָתָ֗ן אֶֽת הַ/מְּעִיל֙ אֲשֶׁ֣ר עָלָ֔י/ו וַֽ/יִּתְּנֵ֖/הוּ לְ/דָוִ֑ד וּ/מַדָּ֕י/ו וְ/עַד חַרְבּ֥/וֹ וְ/עַד קַשְׁתּ֖/וֹ וְ/עַד חֲגֹרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: de
  text: Da zog Jonatan den Mantel aus, den er trug, und gab ihn David, ebenso seine Kleidung[a] und sogar sein Schwert, seinen Bogen und seinen Gürtel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Gewänder“ oder „seine militärische Kleidung“. Das hebräische Wort bezeichnet Kleidung, häufig amtliche oder militärische Gewandung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: zog … aus
  rationale: Das Hitpael von פשט bezeichnet hier das Ablegen eines Kleidungsstücks am eigenen Körper. Die natürliche deutsche Wendung bewahrt den reflexiven Sinn, ohne vollständiges Entkleiden anzudeuten.
- source_word: הַמְּעִיל
  choice: den Mantel
  rationale: מְעִיל bezeichnet ein mantelartiges Obergewand, möglicherweise auch von Rangbedeutung. „Mantel“ ist im modernen Deutschen klar und würdevoll.
- source_word: אֲשֶׁר עָלָיו
  choice: den er trug
  rationale: Die idiomatische Formulierung gibt präzise wieder, dass Jonatan den Mantel am Körper hatte.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: und gab ihn David
  rationale: Das Pronomen bezieht sich auf den Mantel; נתן wird als schlichtes narratives „geben“ wiedergegeben.
- source_word: וּמַדָּיו
  choice: ebenso seine Kleidung
  rationale: מַדִּים bezeichnet Kleidung beziehungsweise Gewandung, teils in amtlichem oder militärischem Zusammenhang. „Kleidung“ bewahrt den lexikalisch weiteren Sinn; der folgende Waffenbestand macht den militärischen Kontext deutlich.
- source_word: וְעַד
  choice: und sogar
  rationale: Das wiederholte עַד erweitert die Aufzählung bis zu den einzelnen Waffen und dem Gürtel. „Sogar“ vermittelt diese steigernde beziehungsweise einschließende Funktion natürlich.
- source_word: חַרְבּוֹ
  choice: sein Schwert
  rationale: Direkte und kontextgemäße Wiedergabe von חֶרֶב.
- source_word: קַשְׁתּוֹ
  choice: seinen Bogen
  rationale: Direkte und kontextgemäße Wiedergabe von קֶשֶׁת.
- source_word: חֲגֹרוֹ
  choice: seinen Gürtel
  rationale: חֲגוֹר bezeichnet etwas, das um die Hüfte gegürtet wird. „Gürtel“ ist die klare moderne Entsprechung.
theological_decisions:
- issue: Erzählerische Bedeutung von Jonatans Gaben
  choice: Der Vers wird rein beschreibend übersetzt, ohne die Handlung ausdrücklich als königliche Übergabe, Unterordnung oder bloßes Freundschaftszeichen zu deuten.
  alternative: Die Gaben ausdrücklich als Anerkennung Davids als künftigem König oder ausschließlich als Zeichen des Bundes der Freundschaft auslegen.
  rationale: Der hebräische Text berichtet die konkrete Handlung, erklärt ihre Symbolik in diesem Vers jedoch nicht. Die offene erzählerische und theologische Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes Standarddeutsch mit natürlichem, würdigem Erzählton. „Da“ setzt die fortlaufende hebräische Erzählung knapp fort. Die Satzstruktur bleibt übersichtlich; archaische Wörter wie „Gewand“ oder „Leibgurt“ werden im Haupttext vermieden.
