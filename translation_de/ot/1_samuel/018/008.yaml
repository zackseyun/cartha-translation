base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: de
  text: 'Da wurde Saul sehr zornig, und diese Sache missfiel ihm. Er sagte: »David haben sie die Zehntausende zugeschrieben, mir aber die Tausende; ihm bleibt nur noch das Königtum[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und stärker verkürzt: »Und noch bleibt ihm nur das Königtum.« Möglich ist auch die rhetorische Wiedergabe: »Was fehlt ihm noch außer dem Königtum?«'
    reason: Die hebräische Schlussklausel ist elliptisch und kann im Deutschen entweder als zugespitzte Feststellung oder als rhetorische Frage wiedergegeben werden.
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: Da wurde Saul sehr zornig
  rationale: Die Wendung bezeichnet wörtlich ein heftiges Entbrennen des Zorns; »wurde sehr zornig« gibt das hebräische Bild in natürlichem modernem Deutsch wieder, wobei מְאֹד durch »sehr« ausgedrückt wird.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: missfielen ihm
  rationale: Das hebräische Idiom lautet wörtlich »war böse/schlecht in seinen Augen« und bezeichnet hier Sauls ablehnende Reaktion.
- source_word: הַדָּבָר הַזֶּה
  choice: diese Worte
  rationale: דָּבָר kann Sache, Wort oder Äußerung bedeuten. Im unmittelbaren Zusammenhang bezieht es sich auf den zuvor wiedergegebenen Gesang; »diese Worte« stellt diesen Bezug natürlich her.
- source_word: נָתְנוּ
  choice: haben sie … zugeschrieben
  rationale: Das Grundverb bedeutet »geben«; im Kontext geht es jedoch um die im Lied öffentlich zugeschriebenen Siege. »Zugeschrieben« macht diesen kontextuellen Sinn deutlich.
- source_word: רְבָבוֹת / הָאֲלָפִים
  choice: die Zehntausende / die Tausende
  rationale: Die substantivierten Zahlbegriffe und ihre rhetorische Parallelität werden bewahrt; »Zehntausende« ist im Deutschen natürlicher als »Zehntausendschaften« oder eine wörtlich-plurale Konstruktion.
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: Jetzt fehlt ihm nur noch das Königtum!
  rationale: 'Die hebräische Aussage ist stark verkürzt: Für David bleibt nach Sauls Auffassung nur noch das Königtum übrig. Die deutsche Fassung bewahrt die zugespitzte Folgerung, ohne sie als neutrale Tatsachenbehauptung darzustellen.'
- source_word: הַמְּלוּכָה
  choice: das Königtum
  rationale: Hier steht nicht vorrangig das territoriale Reich, sondern die Königsherrschaft beziehungsweise das Königsamt im Blick. »Königtum« bildet diese Bedeutung genauer ab als »Königreich«.
theological_decisions:
- issue: Sauls Schlussfolgerung über Davids künftige Herrschaft
  choice: Als emotional zugespitzte Äußerung Sauls wiedergegeben
  alternative: 'Als sachliche Vorhersage formulieren: »Was kann er noch bekommen außer dem Königreich?«'
  rationale: Der Vers berichtet Sauls neidische Reaktion. Die Übersetzung sollte seine Befürchtung weder als göttliche Zusage kennzeichnen noch ihre erzählerische Bedeutung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählweise. Der Parallelismus zwischen »Zehntausenden« und »Tausenden« bleibt erhalten. Die Ausrufung im letzten Satz vermittelt Sauls erregte Schlussfolgerung; die genuine syntaktische Mehrdeutigkeit der komprimierten hebräischen Klausel wird in der Fußnote bewahrt.
