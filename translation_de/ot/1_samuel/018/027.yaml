base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: de
  text: Da machte sich David auf und zog los, er und seine Männer. Sie erschlugen zweihundert Philister. Dann brachte David ihre Vorhäute, und sie übergaben sie dem König in voller Zahl[a], um Schwiegersohn des Königs zu werden. Darauf gab Saul ihm seine Tochter Michal zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie zählten sie dem König vollständig vor“. Das hebräische Verb ist schwierig und kann entweder das vollständige Abzählen oder die Übergabe der geforderten Gesamtzahl bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich ... auf
  rationale: Das Qal wayyiqtol von קום leitet hier entschlossenes Handeln ein; die deutsche Wendung gibt diese narrative Funktion natürlich wieder.
- source_word: וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: zog mit seinen Männern los
  rationale: Die Formulierung bewahrt den gemeinsamen Aufbruch Davids und seiner Männer in natürlichem modernem Deutsch; הוּא hebt David als handelnde Hauptperson hervor.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  choice: erschlug zweihundert Männer von den Philistern
  rationale: נכה bezeichnet im militärischen Zusammenhang das tödliche Schlagen; אִישׁ wird ausdrücklich als „Männer“ wiedergegeben.
- source_word: עָרְלֹתֵיהֶם
  choice: ihre Vorhäute
  rationale: Die direkte anatomische Bezeichnung entspricht dem klaren Sinn des Hebräischen und verschleiert den geforderten Brautpreis nicht.
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: man übergab sie dem König in voller Zahl
  rationale: Die schwierige Form kann das vollständige Abzählen oder Vorlegen bezeichnen. Diese Wiedergabe verbindet die Übergabe mit der Erfüllung der verlangten Zahl, ohne den Vorgang unnötig festzulegen.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: damit David der Schwiegersohn des Königs werden konnte
  rationale: Der Hitpael von חתן bezeichnet das Eingehen einer Heiratsverbindung; im Kontext ist die konkrete Beziehung als Schwiegersohn gemeint.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: Darauf gab Saul ihm seine Tochter Michal zur Frau
  rationale: Die Formulierung bewahrt die formale Heiratsübergabe und klingt zugleich in modernem Deutsch natürlich.
