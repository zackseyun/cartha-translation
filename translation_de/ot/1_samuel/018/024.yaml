  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: Sauls Diener berichten ihm den Inhalt von Davids vorheriger Äußerung. „So etwa“ bildet die vergleichende bzw. annähernde Nuance von כַּדְּבָרִים הָאֵלֶּה angemessen ab, ohne eine stärkere Behauptung über einen wörtlichen Wortlaut zu machen.'
  naturalness: '„Die Diener Sauls berichteten ihm: ‚So etwa hat David gesprochen.‘“ ist idiomatisches, modernes Standarddeutsch. Die vorangestellte Wendung „So etwa“ ist in einem knappen berichtenden Satz natürlich und bewahrt einen würdevollen Registerton.'
