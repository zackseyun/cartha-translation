  edition: WLC
  text: וַ/יַּגִּ֜דוּ עַבְדֵ֥י שָׁא֛וּל ל֖/וֹ לֵ/אמֹ֑ר כַּ/דְּבָרִ֥ים הָ/אֵ֖לֶּה דִּבֶּ֥ר דָּוִֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/024.yaml
  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: de
  text: 'Die Diener Sauls berichteten ihm: „So etwa hat David gesprochen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Diesen Worten entsprechend hat David gesprochen.«'
    reason: Die Formulierung כַּדְּבָרִים הָאֵלֶּה kann eine sinngemäße oder annähernde Wiedergabe bezeichnen.
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: berichteten
  rationale: Der Hifil von נגד bedeutet hier »mitteilen/berichten«. »Berichteten« passt natürlich zur Weitergabe von Davids Antwort an Saul.
- source_word: עַבְדֵי שָׁאוּל
  choice: die Diener Sauls
  rationale: עבד bezeichnet im höfischen Zusammenhang Diener, Bedienstete oder Amtsträger. »Diener« bleibt bewusst breit und quellennah.
- source_word: לוֹ
  choice: ihm
  rationale: Das Pronomen bezieht sich auf Saul und wird im Deutschen idiomatisch als Dativobjekt wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv führt den Inhalt der Mitteilung ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion, ohne ein schwerfälliges »indem sie sagten«.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: so etwa
  rationale: 'Die Präposition כְּ bezeichnet hier Entsprechung oder ungefähre Wiedergabe: »diesen Worten entsprechend / Worte wie diese«. »So etwa« bewahrt diesen Näherungscharakter idiomatisch.'
- source_word: דִּבֶּר
  choice: hat ... gesprochen
  rationale: דבר wird mit »sprechen« wiedergegeben; das Perfekt ist in modernem Deutsch für den Bericht über die vorausgehende Äußerung natürlich.
- source_word: דָּוִד
  choice: David
  rationale: Übliche deutsche Form des Eigennamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der höfische Kontext bleibt durch »Diener Sauls« erkennbar; die knappe Berichtssyntax des Hebräischen wird natürlich wiedergegeben.
