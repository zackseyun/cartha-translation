  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל מִ֤י אָֽנֹכִי֙ וּ/מִ֣י חַיַּ֔/י מִשְׁפַּ֥חַת אָבִ֖/י בְּ/יִשְׂרָאֵ֑ל כִּֽי אֶהְיֶ֥ה חָתָ֖ן לַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: de
  text: 'Da sagte David zu Saul: »Wer bin ich, und was ist schon mein Leben[a] oder die Familie meines Vaters in Israel, dass ich der Schwiegersohn des Königs werden sollte?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wer ist mein Leben?“ Die ungewöhnliche hebräische Wendung kann Davids geringe Bedeutung hervorheben; im Zusammenhang wird sie auch auf seine Familie oder seinen gesellschaftlichen Stand bezogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; »Da sagte« gibt den Fortgang im modernen deutschen Erzählstil natürlich wieder.
- source_word: מִי אָנֹכִי
  choice: Wer bin ich
  rationale: Die direkte rhetorische Frage bewahrt Davids selbstzurücknehmenden Ton.
- source_word: וּמִי חַיַּי
  choice: und was ist mein Leben
  rationale: Die ungewöhnliche hebräische Formulierung wird möglichst formnah wiedergegeben, ohne ihre mögliche Bedeutung vorschnell auf Verwandtschaft oder gesellschaftlichen Rang festzulegen.
- source_word: מִשְׁפַּחַת אָבִי
  choice: was ist die Familie meines Vaters
  rationale: מִשְׁפָּחָה bezeichnet den Familien- oder Sippenverband. Die Wiederaufnahme von »was ist« macht die elliptische hebräische Reihung im Deutschen verständlich.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Bewahrt die soziale und nationale Einordnung der Familie innerhalb Israels.
- source_word: כִּי אֶהְיֶה
  choice: dass ich ... werden sollte
  rationale: Gibt die Folge der rhetorischen Fragen sowie den zukünftigen und selbstzurücknehmenden Sinn natürlich wieder.
- source_word: חָתָן לַמֶּלֶךְ
  choice: der Schwiegersohn des Königs
  rationale: Im Kontext bezeichnet חָתָן den durch die Heirat mit der Königstochter entstehenden Schwiegersohn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wendung »was ist mein Leben« bleibt erhalten, um die echte lexikalische Unschärfe und Davids Ausdruck seiner Unbedeutsamkeit nicht durch eine eindeutige Deutung als »Verwandtschaft« oder »gesellschaftlicher Rang« zu ersetzen.
