base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: de
  text: Dann zogen die Heerführer der Philister aus. Und sooft sie auszogen, handelte David klüger[a] als alle Diener Sauls; so gewann sein Name sehr hohes Ansehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatte mehr Erfolg“ beziehungsweise „war erfolgreicher“. Das hebräische Verb kann kluges, umsichtiges Handeln und den daraus entstehenden Erfolg bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sein Name wurde sehr kostbar/geehrt“; gemeint ist, dass David sehr hohes Ansehen gewann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: die Heerführer der Philister
  rationale: שָׂרִים bezeichnet führende Amtsträger und im militärischen Zusammenhang besonders Befehlshaber; „Heerführer“ gibt diesen Sinn natürlich und würdig wieder.
- source_word: וַיֵּצְאוּ
  choice: zogen ... aus
  rationale: יצא bezeichnet das Hinausziehen; „ausziehen“ bewahrt hier den militärischen Anklang, ohne die Bewegung unnötig genauer zu bestimmen.
- source_word: מִדֵּי צֵאתָם
  choice: sooft sie auszogen
  rationale: 'Die Konstruktion drückt ein wiederholtes Geschehen aus: jedes Mal, wenn die Heerführer auszogen.'
- source_word: שָׂכַל
  choice: handelte ... klüger
  rationale: Das Verb verbindet verständiges beziehungsweise umsichtiges Handeln mit dem daraus erwachsenden Erfolg. „Handelte klüger“ wahrt den Grundsinn; eine Fußnote nennt die mögliche erfolgsbezogene Wiedergabe.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: als alle Diener Sauls
  rationale: עֲבָדִים meint hier Personen im königlichen Dienst und nicht notwendig Sklaven. „Diener Sauls“ bleibt breit genug und entspricht der höfischen Ausdrucksweise.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: sein Name stand in sehr hohem Ansehen
  rationale: Wörtlich wird Davids „Name“ als sehr kostbar beziehungsweise geehrt bezeichnet. Die deutsche Wendung bewahrt das Bild vom Namen und vermittelt zugleich den Sinn seines hohen Ansehens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Heerführer“ macht den militärischen Zusammenhang deutlich; „sooft“ bildet die wiederholte Handlung knapp ab. Die Satzverknüpfung „deshalb“ gibt die erzählerische Folge natürlich wieder, ohne eine zusätzliche theologische Aussage einzutragen.
