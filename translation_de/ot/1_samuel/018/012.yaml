  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: de
  text: Saul fürchtete sich vor David[a], denn Jahwe war mit ihm und war von Saul gewichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Saul fürchtete David.“ Wörtlich steht im Hebräischen: „Saul fürchtete sich von vor David.“ Die Wendung bezeichnet David als denjenigen, vor dem Saul Angst hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: fürchtete sich
  rationale: Das Verb ירא bezeichnet hier Sauls Furcht. Die reflexive Form ist im modernen Deutschen natürlich und bewahrt die emotionale Aussage.
- source_word: מִלִּפְנֵי
  choice: vor
  rationale: Wörtlich steht eine Wendung mit der Bedeutung „von vor dem Angesicht“. In Verbindung mit ירא bezeichnet sie die Person, vor der man sich fürchtet; „vor David“ entspricht dem deutschen Sprachgebrauch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Sauls Furcht ein. „Denn“ verbindet die Aussagen in einem würdigen, natürlichen Erzählstil.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen gebräuchliche Form.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Das Pronomen bezieht sich im Zusammenhang auf David. Die pronominale Form des Hebräischen bleibt erhalten, ohne den Bezug unklar werden zu lassen.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: hatte sich aber von Saul abgewandt
  rationale: סור kann „weichen“, „sich entfernen“ oder „sich abwenden“ bedeuten. Das Plusquamperfekt macht deutlich, dass dieser Zustand Sauls Furcht zugrunde lag; „aber“ bildet den im Hebräischen erkennbaren Gegensatz zwischen David und Saul natürlich ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Gottes Abwendung von Saul
  choice: Jahwe hatte sich von Saul abgewandt
  alternative: Der Geist Jahwes war von Saul gewichen; Jahwes Gunst hatte Saul verlassen
  rationale: Der Vers nennt weder ausdrücklich den Geist noch lediglich die göttliche Gunst. Die Übersetzung bleibt bei der Formulierung des Verses und bewahrt so seine theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bildet den begründenden Zusammenhang und den Gegensatz zwischen David und Saul klar ab.
