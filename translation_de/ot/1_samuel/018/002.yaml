  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: de
  text: Saul nahm ihn an jenem Tag und erlaubte ihm nicht, in das Haus seines Vaters zurückzukehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ließ ihn nicht in das Haus seines Vaters zurückkehren“. Wörtlich etwa: „und gab ihm nicht zurückzukehren“; נתן wird hier mit dem Infinitiv idiomatisch im Sinn von „erlauben, zulassen“ gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: nahm ihn … zu sich
  rationale: לקח bedeutet grundsätzlich »nehmen«. »Zu sich nehmen« klingt im Deutschen natürlich und lässt im Zusammenhang erkennen, dass Saul David an seinen Hof beziehungsweise in seinen Dienst nahm, ohne dies ausdrücklich in den Text hineinzutragen.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: בַּיּוֹם הַהוּא
  choice: noch an diesem Tag
  rationale: Die Wendung bezeichnet den betreffenden Tag. »Noch an diesem Tag« gibt die unmittelbare zeitliche Einordnung im Deutschen idiomatisch wieder.
- source_word: וְלֹא נְתָנוֹ לָשׁוּב
  choice: ließ ihn nicht mehr … zurückkehren
  rationale: נתן mit folgendem Infinitiv bezeichnet hier idiomatisch Erlaubnis beziehungsweise Zulassung. Die Verbindung mit »nicht mehr« gibt im Deutschen natürlich wieder, dass David fortan nicht zurückkehren durfte.
- source_word: בֵּית אָבִיו
  choice: in das Haus seines Vaters
  rationale: Die Formulierung bewahrt das hebräische Bild des väterlichen Hauses und kann zugleich den väterlichen Haushalt beziehungsweise das Elternhaus bezeichnen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zu sich nehmen« wahrt die knappe Aussage des Hebräischen, während die Fußnote das Erlaubnisidiom transparent macht.
