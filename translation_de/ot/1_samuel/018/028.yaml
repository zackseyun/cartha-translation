id: 1SA.18.28
reference: 1 Samuel 18:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: de
  text: Saul sah und erkannte, dass Jahwe mit David war und Michal, Sauls Tochter, ihn liebte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das gewöhnliche Verb ראה bedeutet „sehen“. „Sah“ bewahrt den erzählerischen Fortgang von der Wahrnehmung zur Erkenntnis.
- source_word: וַיֵּדַע
  choice: erkannte
  rationale: ידע bezeichnet hier Sauls gefestigte Einsicht aufgrund dessen, was er beobachtete. „Erkannte“ ist im Deutschen natürlicher als „wusste“ nach „sah“ und erhält dennoch die Abfolge beider Verben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt von Sauls Erkenntnis ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Eigenname Gottes wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִם דָּוִד
  choice: mit David war
  rationale: Die Wendung gibt Gottes Gegenwart und Beistand wieder, ohne diese Bedeutung weiter auszudeuten.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: und Michal, Sauls Tochter
  rationale: Die deutsche Apposition gibt die hebräische Status-constructus-Verbindung natürlich und genau wieder. Das eine „dass“ kann im Deutschen beide koordinierten Sachverhalte einleiten.
- source_word: אֲהֵבַתְהוּ
  choice: ihn liebte
  rationale: Die Partizipialform bezeichnet einen anhaltenden Zustand; im deutschen Erzählstil gibt „liebte“ diesen idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Abfolge von Wahrnehmung und Erkenntnis bleibt durch „sah und erkannte“ erhalten; die beiden Erkenntnisinhalte stehen natürlich unter einem gemeinsamen „dass“.
