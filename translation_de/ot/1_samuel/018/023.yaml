  source_fidelity: 'Der Sinn wird insgesamt zuverlässig wiedergegeben: Sauls Diener übermitteln David die genannten Worte, und David reagiert mit einer rhetorischen Frage sowie seiner Selbsteinschätzung als arm und sozial gering geachtet. Die konkrete Wiedergabe von הִתְחַתֵּן בַּמֶּלֶךְ als Eintritt in das Verhältnis eines königlichen Schwiegersohns ist im unmittelbaren Kontext zutreffend.'
