  terminology: „Schwiegersohn des Königs“, „armer Mann“ und „gering geachtet“ sind sachgerecht und im würdigen modernen Register formuliert. Eine Fußnote zur weiteren Grundbedeutung von חתן ist hier nicht erforderlich, weil der Kontext mit Sauls Tochter die konkrete Beziehung bestimmt.
