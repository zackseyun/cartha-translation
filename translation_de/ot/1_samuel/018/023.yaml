  text: וַֽ/יְדַבְּר֞וּ עַבְדֵ֤י שָׁאוּל֙ בְּ/אָזְנֵ֣י דָוִ֔ד אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֣אמֶר דָּוִ֗ד הַֽ/נְקַלָּ֤ה בְ/עֵֽינֵי/כֶם֙ הִתְחַתֵּ֣ן בַּ/מֶּ֔לֶךְ וְ/אָנֹכִ֖י אִֽישׁ רָ֥שׁ וְ/נִקְלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: de
  text: 'Da sagten Sauls Diener David diese Worte, und David sagte: »Haltet ihr es für eine Kleinigkeit, der Schwiegersohn des Königs zu werden? Ich bin doch ein armer und gering geachteter Mann.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: redeten
  rationale: Gibt דבר im erzählenden Kontext schlicht und natürlich wieder und passt zum pluralischen Subjekt.
- source_word: בְּאָזְנֵי דָוִד
  choice: vor David
  rationale: Die hebräische Wendung lautet wörtlich »in Davids Ohren«; »vor David« vermittelt idiomatisch, dass die Worte in seiner Gegenwart und für ihn hörbar gesprochen wurden.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Bewahrt den unmittelbaren Bezug auf die zuvor übermittelte Rede, ohne daraus eine förmliche Botschaft zu machen.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: Haltet ihr es für eine Kleinigkeit
  rationale: Gibt die rhetorische Frage und das Bewertungsidiom »in euren Augen« in natürlichem Deutsch wieder.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: der Schwiegersohn des Königs zu werden
  rationale: Der Hitpael von חתן bezeichnet hier das Eingehen einer Heiratsverbindung mit dem König durch die Ehe mit dessen Tochter; die gewählte Formulierung macht die konkrete Beziehung klar.
- source_word: וְאָנֹכִי
  choice: Ich bin doch
  rationale: Das Waw leitet Davids kontrastierende Selbsteinschätzung ein; »doch« bringt diesen Einwand im Deutschen natürlich zum Ausdruck, ohne eine ausdrücklich kausale Konjunktion einzuführen.
- source_word: אִישׁ רָשׁ
  choice: ein armer Mann
  rationale: Direkte und geschlechtsgenaue Wiedergabe von Davids wirtschaftlich und sozial niedriger Stellung.
- source_word: וְנִקְלֶה
  choice: gering geachtet
  rationale: Bezeichnet jemanden von geringem Ansehen. Die Formulierung wahrt zugleich die semantische Verbindung zu הַנְקַלָּה, ohne das stärkere »verachtet« zu wählen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt erhalten; die anschließende Selbsteinschätzung wird als kontrastiver Einwand formuliert. Keine Fußnote ist nötig, da die mögliche allgemeinere Bedeutung »sich mit dem König verschwägern« im Kontext eindeutig durch die Stellung als Schwiegersohn konkretisiert wird.
