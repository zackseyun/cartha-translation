base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: de
  text: 'Die feiernden Frauen[b] sangen im Wechsel[a]:


    „Saul hat seine Tausende erschlagen[c]

    und David seine Zehntausende.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „antworteten einander“. Hier ist wahrscheinlich Wechselgesang gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch festliches Spielen, Tanzen oder ausgelassenes Feiern bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „geschlagen“; im militärischen Zusammenhang kann damit „niedergestreckt“ oder „getötet“ gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: sangen einander im Wechsel zu
  rationale: Das Verb ענה bedeutet grundsätzlich „antworten“. Im Zusammenhang eines vorgetragenen Siegesliedes bezeichnet es wahrscheinlich responsorisches oder wechselndes Singen; die Wiedergabe bewahrt sowohl den Antwortcharakter als auch den musikalischen Kontext.
- source_word: הַנָּשִׁים
  choice: die Frauen
  rationale: Direkte und natürliche Wiedergabe des bestimmten Plurals.
- source_word: הַמְשַׂחֲקוֹת
  choice: die feiernden
  rationale: Das Partizip von שׂחק kann hier festliches Spielen, Tanzen oder ausgelassenes Feiern bezeichnen. „feiernd“ ist im modernen Deutsch natürlich und legt die konkrete Ausdrucksform nicht unnötig fest.
- source_word: וַתֹּאמַרְןָ
  choice: '[durch den Doppelpunkt vor dem Lied wiedergegeben]'
  rationale: Das anschließende Sprechen wird im Deutschen idiomatisch durch den Doppelpunkt und das direkte Zitat ausgedrückt; ein zusätzliches „und sagten“ wäre nach „sangen“ schwerfällig.
- source_word: הִכָּה
  choice: hat … erschlagen
  rationale: נכה bedeutet wörtlich „schlagen“ und bezeichnet in diesem militärischen Zusammenhang das Töten beziehungsweise Niederstrecken von Gegnern. „erschlagen“ gibt die militärische Aussage klar wieder.
- source_word: באלפו
  choice: seine Tausende
  rationale: Die Präposition ב mit der Zahl wird hier idiomatisch als Größenangabe der militärischen Erfolge verstanden. Der possessive Ausdruck erhält die poetische Parallelstruktur.
- source_word: בְּרִבְבֹתָיו
  choice: seine Zehntausende
  rationale: רבבה bezeichnet zehntausend beziehungsweise eine sehr große Menge. Der Plural „Zehntausende“ bewahrt die gesteigerte Gegenüberstellung zu Sauls „Tausenden“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Zweizeiligkeit und die zahlenmäßige Steigerung des hebräischen Siegesrufs bleiben erhalten. „Sangen einander im Wechsel zu“ macht den wahrscheinlichen Aufführungscharakter verständlich, während die Fußnote die wörtlichere Alternative dokumentiert.
