source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/תִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים רָעָ֤ה אֶל שָׁאוּל֙ וַ/יִּתְנַבֵּ֣א בְ/תוֹךְ הַ/בַּ֔יִת וְ/דָוִ֛ד מְנַגֵּ֥ן בְּ/יָד֖/וֹ כְּ/י֣וֹם בְּ/י֑וֹם וְ/הַ/חֲנִ֖ית בְּ/יַד שָׁאֽוּל׀׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: de
  text: 'Am folgenden Tag geschah es: Ein böser Geist von Gott fiel mit Macht über Saul[a], und Saul geriet im Haus in prophetische Ekstase[b]. David spielte wie jeden Tag mit der Hand Musik[c], und Saul hatte den Speer in der Hand.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »ein böser Geist Gottes«; möglich ist ferner: »ein unheilbringender Geist von Gott«.'
    reason: Die hebräische Wortverbindung kann Zugehörigkeit oder Herkunft ausdrücken, und רָעָה kann sowohl moralisch »böse« als auch wirkungsbezogen »unheilbringend« bedeuten.
  - marker: b
    text: 'Oder: »weissagte«; im Zusammenhang auch: »geriet in prophetische Raserei«. Das hebräische Verb kann prophetisches Reden oder ekstatisches Verhalten bezeichnen.'
    reason: Die Verbform lässt offen, ob der Schwerpunkt auf prophetischem Auftreten, Ekstase oder gestörtem Rasen liegt.
  - marker: c
    text: Das Instrument wird in diesem Vers nicht genannt; aus dem Zusammenhang geht hervor, dass David ein Saiteninstrument spielte.
    reason: Die Übersetzung macht den musikalischen Sinn des Verbs deutlich, ergänzt aber im Haupttext kein ausdrücklich ungenanntes Instrument.
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: am folgenden Tag
  rationale: Die Zeitangabe bezeichnet den Tag nach den zuvor erzählten Ereignissen und wird im Deutschen natürlich als »am folgenden Tag« wiedergegeben.
- source_word: וַתִּצְלַח ... אֶל שָׁאוּל
  choice: fiel mit Macht über Saul
  rationale: Das Verb beschreibt hier das plötzliche, machtvolle Einwirken des Geistes auf Saul. Die Formulierung bewahrt die Heftigkeit des Vorgangs.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: ein böser Geist von Gott
  rationale: »Böser Geist« gibt רוּחַ ... רָעָה direkt wieder; »von Gott« wahrt die im Hebräischen ausgedrückte Zuordnung zu Gott, ohne sie erklärend abzuschwächen.
- source_word: וַיִּתְנַבֵּא
  choice: geriet in prophetische Ekstase
  rationale: Die reflexive Verbform gehört zum Wortfeld prophetischen Verhaltens, kann hier im Zusammenhang aber auch einen ekstatischen oder rasenden Zustand bezeichnen. Die Wiedergabe hält beides erkennbar und verweist für Alternativen auf die Fußnote.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: mitten im Haus
  rationale: Die Wendung bezeichnet Sauls Verhalten im Inneren des Hauses; »mitten im Haus« entspricht der räumlichen Formulierung und klingt im Deutschen natürlich.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: spielte mit der Hand Musik
  rationale: נגן bezeichnet musikalisches Spielen, während »mit seiner Hand« ausdrücklich im Text steht. Das Instrument wird nicht ergänzt, da es in diesem Vers nicht genannt ist.
- source_word: כְּיוֹם בְּיוֹם
  choice: wie jeden Tag
  rationale: Die hebräische idiomatische Wiederholung bezeichnet eine regelmäßig ausgeübte Gewohnheit; »wie jeden Tag« gibt dies in natürlichem Deutsch wieder.
- source_word: הַחֲנִית בְּיַד שָׁאוּל
  choice: Saul hielt den Speer in der Hand
  rationale: Die deutsche Verbformulierung gibt die lokale Besitzangabe idiomatisch wieder und bewahrt das für den Fortgang bedrohliche Detail.
theological_decisions:
- issue: Zuordnung des bösen Geistes zu Gott
  choice: ein böser Geist von Gott
  alternative: ein unheilbringender Geist von Gott; ein böser Geist Gottes
  rationale: Der hebräische Text ordnet den Geist ausdrücklich Gott zu. Die Übersetzung bewahrt diese theologische Spannung, ohne Gottes Verhältnis zu dem Geist durch zusätzliche Begriffe wie bloße Zulassung oder Sendung festzulegen.
- issue: Art von Sauls prophetischem Verhalten
  choice: geriet in prophetische Ekstase
  alternative: weissagte; geriet in prophetische Raserei; gebärdete sich wie ein Prophet
  rationale: Das Verb kann tatsächliches prophetisches Auftreten bezeichnen, doch der unmittelbare Zusammenhang legt ein unkontrolliertes, bedrohliches Verhalten nahe. Die Hauptfassung wahrt den Bezug zur Prophetie und lässt die genaue Bewertung offen; die Fußnote nennt die Spannweite.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzfolge wahrt den abrupten Beginn und das bedrohliche Schlussdetail. Unnatürliche Hebraismen werden idiomatisch wiedergegeben, ohne die Mehrdeutigkeit bei Geist und prophetischem Verhalten aufzulösen.
