base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: de
  text: 'Da sagte Saul zu David: »Sieh, meine älteste Tochter Merab! Sie will ich dir zur Frau geben. Sei mir nur ein tüchtiger Kämpfer und kämpfe in den Kriegen des HERRN.« Saul sagte sich nämlich: »Meine Hand soll nicht gegen ihn sein, sondern die Hand der Philister soll gegen ihn sein.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגְּדוֹלָה
  choice: älteste
  rationale: Bei zwei namentlich bekannten Töchtern bezeichnet das Adjektiv hier idiomatisch die ältere beziehungsweise erstgeborene Tochter; „älteste“ ist im Deutschen natürlich.
- source_word: בֶן חַיִל
  choice: tüchtiger Kämpfer
  rationale: Die Wendung bezeichnet hier einen tapferen, kampffähigen Mann. Die militärische Bedeutung wird durch den folgenden Auftrag ausdrücklich gestützt.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: die Kriege des HERRN
  rationale: Der Plural wird bewahrt; der Gottesname wird nach verbreiteter deutscher Bibelkonvention mit HERR wiedergegeben.
- source_word: אָמַר
  choice: dachte
  rationale: Im zweiten Satz leitet das Verb Sauls unausgesprochene Absicht ein. „Dachte“ gibt die erzählerische Funktion im Deutschen klar wieder, ohne den Inhalt zu verändern.
- source_word: יָד ... בּוֹ
  choice: Hand ... gegen ihn
  rationale: Das Bild der handelnden beziehungsweise tötenden Hand wird erhalten; „sich gegen ihn erheben“ macht die feindliche Zielrichtung natürlich verständlich.
theological_decisions:
- issue: Bezeichnung der Kämpfe als Kriege JHWHs
  choice: die Kriege des HERRN
  alternative: die Kämpfe des HERRN
  rationale: „Kriege“ bewahrt den lexikalischen Plural und die Spannung zwischen Sauls religiöser Begründung und seiner verborgenen mörderischen Absicht.
- issue: Sauls innerer Vorsatz
  choice: Saul dachte nämlich
  alternative: Saul sagte nämlich
  rationale: Der Kontext kennzeichnet die Worte als inneren Plan. Die Wiedergabe macht dies deutlich, ohne Sauls Verantwortung oder die erzählerische Ironie abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. „Sieh“ bewahrt den aufmerksamkeitslenkenden Charakter von הִנֵּה; die Wiederholung von „Hand“ erhält das markante hebräische Bild und Sauls indirekte Mordabsicht.
