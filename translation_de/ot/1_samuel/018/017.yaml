  to: 'Da sagte Saul zu David: »Sieh, meine älteste Tochter Merab! Sie will ich dir zur Frau geben. Sei mir nur ein tüchtiger Kämpfer und kämpfe in den Kriegen des HERRN.« Saul sagte sich nämlich: »Meine Hand soll nicht gegen ihn sein, sondern die Hand der Philister soll gegen ihn sein.«'
