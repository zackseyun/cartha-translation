source:
  edition: WLC
  text: וַ/יִּכְרֹ֧ת יְהוֹנָתָ֛ן וְ/דָוִ֖ד בְּרִ֑ית בְּ/אַהֲבָת֥/וֹ אֹת֖/וֹ כְּ/נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: de
  text: Und Jonatan schloss mit David einen Bund[a], weil er ihn liebte wie sein eigenes Leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »schnitt einen Bund«; dies ist die hebräische Ausdrucksweise für das Schließen eines Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »in seiner Liebe zu ihm«. Die hebräischen Pronomen sind der Form nach mehrdeutig; der Zusammenhang spricht dafür, dass Jonatan David liebte wie sein eigenes Leben. Für »Leben« steht hier das Wort, das auch »Seele« oder »Selbst« bedeuten kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: schloss
  rationale: Die feste hebräische Wendung כרת ברית lautet wörtlich »einen Bund schneiden«; im natürlichen Deutschen wird ein Bund jedoch »geschlossen«.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Die Namensform entspricht der etablierten deutschen Bibeltradition und gibt den hebräischen Namen angemessen wieder.
- source_word: וְדָוִד
  choice: mit David
  rationale: Obwohl וְ formal »und« bedeutet, bezeichnet »Jonatan und David« nach dem singularischen Verb idiomatisch die Parteien des Bundesschlusses. »mit David« macht diese syntaktische Beziehung im Deutschen klar, ohne einen pluralischen Handlungsträger einzuführen.
- source_word: בְּרִית
  choice: Bund
  rationale: »Bund« bewahrt den feierlichen, bindenden und relationalen Charakter von בְּרִית besser als »Vereinbarung« oder »Vertrag«.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: weil er ihn liebte
  rationale: Die Präposition בְּ wird hier kontextgemäß kausal verstanden. Die deutschen Pronomen bilden die formale Mehrdeutigkeit des Hebräischen ab; der Zusammenhang legt Jonatan als Liebenden und David als Geliebten nahe.
- source_word: כְּנַפְשׁוֹ
  choice: wie sein eigenes Leben
  rationale: נֶפֶשׁ kann »Leben«, »Seele« oder »Selbst« bedeuten. »Wie sein eigenes Leben« ist im heutigen Deutschen natürlich und bewahrt die Aussage von tiefster persönlicher Verbundenheit.
theological_decisions:
- issue: Bezug der Pronomen in »weil er ihn liebte wie sein eigenes Leben«
  choice: Im Zusammenhang ist Jonatan das Subjekt der Liebe und David ihr Objekt; die Übersetzung lässt die Pronomen dennoch formal stehen.
  alternative: Isoliert betrachtet könnten die Pronomen anders zugeordnet werden; möglich wäre auch die explizite Wiedergabe »weil Jonatan David liebte«.
  rationale: Der unmittelbare Kontext, besonders 1 Samuel 18,1 und die Wortstellung dieses Verses, spricht deutlich für Jonatan als Subjekt. Eine explizite Namenswiederholung würde zwar klären, aber die formale Mehrdeutigkeit des hebräischen Ausdrucks beseitigen.
- issue: Bedeutung von נֶפֶשׁ
  choice: Leben
  alternative: Seele; sich selbst
  rationale: »Leben« gibt hier die persönliche Selbstbezogenheit und Intensität der Liebe natürlich wieder, ohne eine bestimmte Lehre über die Beschaffenheit des Menschen in den Ausdruck hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schloss einen Bund« ist idiomatisch und bewahrt den feierlichen Charakter. Die Satzfolge folgt weitgehend dem Hebräischen; die Fußnoten dokumentieren das zugrunde liegende Idiom, die Pronomenmehrdeutigkeit und das Bedeutungsspektrum von נֶפֶשׁ.
