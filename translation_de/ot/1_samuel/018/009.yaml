  text: And Saul eyed David from that day forward[a].
translation:
  language: de
  text: Von diesem Tag an beäugte Saul David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Von diesem Tag an beobachtete Saul David argwöhnisch.« Das seltene Verb meint hier offenbar ein von Misstrauen oder Neid geprägtes Beobachten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: beäugte
  rationale: Die Erzählform von היה verbindet sich hier mit dem folgenden Ausdruck zu einer fortdauernden Haltung. Im Deutschen wird sie idiomatisch durch das finite Verb wiedergegeben, ohne die schwerfällige Wendung »und es geschah«.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: עון
  choice: beäugte
  rationale: Die seltene beziehungsweise defektiv geschriebene Form bezeichnet in diesem Zusammenhang kein neutrales Sehen, sondern ein anhaltendes, feindselig oder argwöhnisch gefärbtes Beobachten. »Beäugte« wahrt diese Bedeutungsnuance, ohne Neid ausdrücklich in den Haupttext einzutragen.
- source_word: אֶת
  choice: —
  rationale: Hebräisches Akkusativzeichen; im Deutschen nicht eigens wiedergegeben.
- source_word: דָּוִד
  choice: David
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: Von diesem Tag an
  rationale: Natürliche deutsche Wiedergabe des zeitlichen Ausgangspunkts und der fortdauernden Geltung.
