  text: וַ/תֹּ֤אמֶר לִ/נְעָרֶ֨י/הָ֙ עִבְר֣וּ לְ/פָנַ֔/י הִנְ/נִ֖י אַחֲרֵי/כֶ֣ם בָּאָ֑ה וּ/לְ/אִישָׁ֥/הּ נָבָ֖ל לֹ֥א הִגִּֽידָה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: de
  text: 'Sie sagte zu ihren jungen Männern: »Geht mir voraus. Seht, ich komme hinter euch her.« Ihrem Mann Nabal aber sagte sie nichts.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sie sagte
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählung ein; im natürlichen Deutschen muss die Satzverbindung nicht eigens wiedergegeben werden.
- source_word: לִנְעָרֶיהָ
  choice: zu ihren jungen Männern
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. »Junge Männer« bewahrt hier die lexikalische Grundbedeutung und passt zu den Männern, die die Vorräte transportieren.
- source_word: עִבְרוּ לְפָנַי
  choice: Geht mir voraus
  rationale: עבר bezeichnet hier in Verbindung mit לְפָנַי die Bewegung vor Abigail her; die gewählte Formulierung ist präzise und idiomatisch.
- source_word: הִנְנִי אַחֲרֵיכֶם בָּאָה
  choice: Ich komme gleich hinter euch her
  rationale: הִנְנִי lenkt die Aufmerksamkeit auf Abigajils unmittelbar bevorstehendes Handeln. Im Deutschen gibt »gleich« diese pragmatische Unmittelbarkeit natürlicher wieder als das altertümliche »Siehe«; »hinter euch her« bewahrt die räumliche Bedeutung von אַחֲרֵיכֶם.
- source_word: וּלְאִישָׁהּ נָבָל לֹא הִגִּידָה
  choice: Ihrem Mann Nabal aber sagte sie nichts
  rationale: אִישׁ bezeichnet mit dem Suffix in diesem Zusammenhang ihren Ehemann. »Aber« macht den Kontrast zum vorher Gesagten deutlich, und »sagte sie nichts« gibt לֹא הִגִּידָה in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Erzählweise. Keine Fußnote ist erforderlich; die im englischen Konsultationstext angegebene Alternative gehört sachlich zu הִנְנִי אַחֲרֵיכֶם בָּאָה, ist jedoch keine bedeutende inhaltliche Variante und wird im Deutschen idiomatisch im Haupttext wiedergegeben.
