base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: de
  text: Möge Gott den Feinden Davids[a] dies antun und noch mehr, wenn ich bis zum Morgen von allem, was ihm gehört, auch nur einen Mann[b] übrig lasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Ausleger verstehen „den Feinden Davids“ als euphemistische Ersatzform für „David“ oder „mir“, da diese Schwurformel gewöhnlich eine Selbstverwünschung enthält.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „einen, der gegen die Wand uriniert“; eine derbe hebräische Redewendung für einen Mann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: dies antun und noch mehr
  rationale: Die Wendung ist eine feste hebräische Schwur- und Fluchformel. Die deutsche Formulierung bewahrt ihren selbstverwünschenden Charakter, ohne die hebräische Wiederholung unnatürlich nachzubilden.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der morphologisch pluralischen Form steht das Verb im Singular; gemeint ist Gott im Rahmen einer Schwurformel.
- source_word: לְאֹיְבֵי דָוִד
  choice: den Feinden Davids
  rationale: Die masoretische Lesart wird beibehalten und nicht stillschweigend zu „David“ oder „mir“ geändert, obwohl die übliche Schwurformel eine Selbstverwünschung erwarten lässt.
- source_word: אִם
  choice: wenn
  rationale: In der Schwurformel leitet אִם die Bedingung ein; die vorausgehende Verwünschung verleiht ihr sinngemäß eine verneinende Kraft.
- source_word: אַשְׁאִיר
  choice: übrig lasse
  rationale: Der Hifil von שׁאר bezeichnet das Zurück- oder Übriglassen. „Übrig lasse“ ist im Deutschen natürlich und weniger deutend als „verschone“.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: von allen, die zu ihm gehören
  rationale: Der folgende Ausdruck bezeichnet männliche Personen; deshalb wird die umfassende Possessivformulierung hier personenbezogen wiedergegeben.
- source_word: עַד הַבֹּקֶר
  choice: bis zum Morgen
  rationale: Die Formulierung bewahrt die im Hebräischen gesetzte zeitliche Grenze.
- source_word: מַשְׁתִּין בְּקִיר
  choice: auch nur einen Mann
  rationale: Die derbe hebräische Redewendung bezeichnet verächtlich einen männlichen Menschen. Der Haupttext gibt den gemeinten Referenten verständlich wieder; der wörtliche Ausdruck wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Masoretische Formulierung „Davids Feinden“ innerhalb der Schwurformel
  choice: Die masoretische Lesart „den Feinden Davids“ steht im Haupttext.
  alternative: Die Formulierung könnte als abschreiberbedingte oder ehrfürchtige Ersatzform für „David“ beziehungsweise „mir“ verstanden und entsprechend geändert werden.
  rationale: Der vorgegebene hebräische Text nennt ausdrücklich Davids Feinde. Die ungewöhnliche Spannung zur sonst selbstverwünschenden Schwurformel wird nicht stillschweigend aufgelöst, sondern in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurformel bleibt knapp und eindringlich; die derbe Bildsprache des hebräischen Ausdrucks wird zugunsten unmittelbarer Verständlichkeit in die Fußnote verlegt. Sämtliche Fußnotenmarker stehen an der jeweils sachlich passenden Stelle im Haupttext.
