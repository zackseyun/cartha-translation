  source_fidelity: 'Der Entwurf gibt die Aussagefolge des Hebräischen zuverlässig wieder: Davids Bewachung war »wirklich umsonst«, nichts aus Nabals Besitz ging verloren, und Nabal erwiderte Gutes mit Bösem. »Umsonst« bewahrt angemessen die mögliche Nuance von vergeblich bzw. ohne Gegenleistung. Die Wiedergabe von לֹא נִפְקַד ... מְאוּמָה als »wurde nicht das Geringste vermisst« trifft den Sinn, dass keinerlei Verlust zu verzeichnen war.'
