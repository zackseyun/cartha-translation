source:
  edition: WLC
  text: וְ/דָוִ֣ד אָמַ֗ר אַךְ֩ לַ/שֶּׁ֨קֶר שָׁמַ֜רְתִּי אֶֽת כָּל אֲשֶׁ֤ר לָ/זֶה֙ בַּ/מִּדְבָּ֔ר וְ/לֹא נִפְקַ֥ד מִ/כָּל אֲשֶׁר ל֖/וֹ מְא֑וּמָה וַ/יָּֽשֶׁב לִ֥/י רָעָ֖ה תַּ֥חַת טוֹבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: de
  text: 'David hatte gesagt: »Ich habe wirklich umsonst alles bewacht, was diesem Mann in der Wüste gehört. Von allem, was ihm gehört, wurde nicht das Geringste vermisst. Doch er hat mir Gutes mit Bösem vergolten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: wirklich umsonst
  rationale: אַךְ verstärkt Davids verbitterte Feststellung; לַשֶּׁקֶר bezeichnet hier ein vergebliches, ohne Gegenleistung gebliebenes Handeln. »Wirklich umsonst« gibt beides natürlich wieder.
- source_word: שָׁמַרְתִּי
  choice: habe ... bewacht
  rationale: Das Verb bezeichnet den schützenden Wachdienst Davids für Nabals Besitz.
- source_word: לֹא נִפְקַד ... מְאוּמָה
  choice: wurde nicht das Geringste vermisst
  rationale: נִפְקַד kann in diesem Zusammenhang das Fehlen oder Vermisstwerden ausdrücken; מְאוּמָה verstärkt dies zu »nicht das Geringste«.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: Doch er hat mir Gutes mit Bösem vergolten
  rationale: Die idiomatische deutsche Wendung bewahrt den Gegensatz zwischen רָעָה und טוֹבָה sowie den Gedanken der Erwiderung beziehungsweise Vergeltung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Plusquamperfekt »hatte gesagt« ordnet Davids Äußerung als Hintergrund zu der im Kontext bereits laufenden Handlung ein. Die direkte Rede bleibt emotional zugespitzt, ohne Davids Urteil durch zusätzliche Deutung zu bestätigen.
