  terminology: »bewacht«, »das Geringste«, und »Gutes mit Bösem vergolten« sind idiomatisch und semantisch präzise. Es gibt keine problematischen theologischen Fachbegriffe oder Namensfragen. Fußnoten sind nicht erforderlich.
