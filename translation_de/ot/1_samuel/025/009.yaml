source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ נַעֲרֵ֣י דָוִ֔ד וַ/יְדַבְּר֧וּ אֶל נָבָ֛ל כְּ/כָל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/שֵׁ֣ם דָּוִ֑ד וַ/יָּנֽוּחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: de
  text: Als Davids junge Männer ankamen, richteten sie Nabal im Namen Davids alle diese Worte aus. Dann hielten sie inne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann ruhten sie.“ Das hebräische Verb kann „ruhen“ oder „zur Ruhe kommen“ bedeuten. Hier kann gemeint sein, dass die Männer nach dem Ausrichten der Botschaft schwiegen und auf Nabals Antwort warteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי דָוִד
  choice: Davids junge Männer
  rationale: נַעַר kann einen jungen Mann, Diener oder Gefolgsmann bezeichnen. „Junge Männer“ bewahrt die konkrete hebräische Bezeichnung, ohne die Boten ausschließlich über ihre Funktion als Diener zu bestimmen.
- source_word: וַיָּבֹאוּ
  choice: ankamen
  rationale: בוא bezeichnet das Kommen beziehungsweise Eintreffen. „Ankamen“ passt im Deutschen natürlich zum Auftreten der Boten bei Nabal.
- source_word: וַיְדַבְּרוּ אֶל נָבָל
  choice: richteten sie Nabal … aus
  rationale: דבר mit אֶל bezeichnet hier das an Nabal gerichtete Sprechen. Zusammen mit „alle diese Worte“ gibt „ausrichten“ die Übermittlung einer Botschaft idiomatisch wieder.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: Die Wendung lautet formal „gemäß all diesen Worten“. „Alle diese Worte“ bewahrt den sprachlichen Bezug von דְּבָרִים und bezeichnet den vollständigen Inhalt der vorausgehenden Botschaft.
- source_word: בְּשֵׁם דָּוִד
  choice: im Namen Davids
  rationale: Die Präposition mit שֵׁם drückt hier Vertretung und Bevollmächtigung aus. „Im Namen Davids“ wahrt diese formale Bedeutung.
- source_word: וַיָּנוּחוּ
  choice: Dann hielten sie inne
  rationale: נוח bedeutet gewöhnlich „ruhen“ oder „zur Ruhe kommen“. Im Zusammenhang kann das Verb das Ende ihrer Rede und eine anschließende Pause bezeichnen. „Hielten inne“ bewahrt diesen Zusammenhang, ohne eindeutig zwischen Ausruhen, Schweigen und Warten zu entscheiden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am hebräischen Erzählstil; die ungewöhnliche Schlussformulierung wird im Haupttext nicht auf die Deutung „warteten“ verengt.
