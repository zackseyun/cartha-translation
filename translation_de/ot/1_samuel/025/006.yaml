  text: וַ/אֲמַרְתֶּ֥ם כֹּ֖ה לֶ/חָ֑י וְ/אַתָּ֤ה שָׁלוֹם֙ וּ/בֵיתְ/ךָ֣ שָׁל֔וֹם וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: de
  text: 'Und sagt ihm Folgendes: »Langes Leben dir![a] Frieden sei dir, Frieden sei deinem Haus und Frieden sei allem, was dir gehört.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung lautet wörtlich etwa „zum Leben“ oder „dem Lebenden“. Wahrscheinlich ist sie als Gruß oder Segenswunsch zu verstehen. Möglich sind daher auch „Sei gegrüßt!“ oder „Dem Lebenden“.
    reason: alternative_reading
  - marker: b
    text: Das hier dreimal mit „Frieden“ wiedergegebene hebräische Wort schalom kann auch Wohlergehen, Unversehrtheit und Gedeihen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Und sagt
  rationale: Das Waw mit Perfekt setzt Davids Anweisung mit imperativischer Kraft fort. „Und sagt“ ist im modernen Deutschen natürlich und wahrt den Befehlscharakter.
- source_word: כֹּה
  choice: zu ihm
  rationale: כֹּה führt die folgende Botschaft im Sinn von „so/folgendermaßen“ ein. Im Deutschen wird dies zusammen mit dem vorausgesetzten Adressaten natürlich durch „sagt zu ihm“ wiedergegeben; der anschließende Doppelpunkt markiert den Wortlaut.
- source_word: לֶחָי
  choice: Langes Leben dir!
  rationale: Die schwierige Wendung lautet wörtlich etwa „zum Leben“ beziehungsweise „dem Lebenden“. Im Zusammenhang ist sie wahrscheinlich ein Gruß oder Segenswunsch. Die Wiedergabe bewahrt den Lebensbezug, ohne die unsichere hebräische Konstruktion vorschnell als bloßes „Sei gegrüßt“ einzuebnen.
- source_word: וְאַתָּה שָׁלוֹם
  choice: Frieden sei mit dir
  rationale: Der verblosen hebräischen Wunschformel entspricht im Deutschen die idiomatische Segensformel „Frieden sei mit dir“.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: Frieden mit deinem Haus
  rationale: „Haus“ bewahrt das hebräische Bild und kann zugleich den gesamten Haushalt beziehungsweise die Hausgemeinschaft einschließen. Das ausgelassene „sei“ erhält die knappe dreifache Parallelstruktur.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: und Frieden mit allem, was dir gehört
  rationale: Die Formulierung umfasst Besitz, Angehörige und alles, was unter Nabals Verantwortung steht, ohne den Sinn unnötig einzuengen.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die prägnante und traditionsfähige Entsprechung; der weitere Bedeutungsumfang von Wohlergehen, Unversehrtheit und Gedeihen wird in einer Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „Frieden“ bildet die hebräische Segensstruktur nach. Die ungewöhnliche Wendung לֶחָי wird verständlich wiedergegeben, während ihre echte textliche und idiomatische Unsicherheit in Fußnote [a] sichtbar bleibt.
