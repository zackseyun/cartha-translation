  text: וְ/אֶת אֲחִינֹ֛עַם לָקַ֥ח דָּוִ֖ד מִֽ/יִּזְרְעֶ֑אל וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן ל֖/וֹ לְ/נָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: de
  text: David nahm auch Ahinoam aus Jesreel, und die beiden wurden seine Frauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח
  choice: nahm
  rationale: Das Verb bedeutet wörtlich »nehmen«. Der anschließende Satz macht den ehelichen Sinn eindeutig, sodass die hebräische Ausdrucksweise bewahrt werden kann.
- source_word: אֲחִינֹעַם
  choice: Ahinoam
  rationale: Der Personenname wird nach geläufiger deutscher Konvention wiedergegeben.
- source_word: מִיִּזְרְעֶאל
  choice: aus Jesreel
  rationale: Die Präposition מִן vor dem Ortsnamen bezeichnet hier die Herkunft; »aus Jesreel« gibt die hebräische Form direkt und natürlich wieder.
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: und die beiden wurden
  rationale: Das feminine Verb im Plural und »die beiden« beziehen sich auf Ahinoam und die zuvor genannte Abigajil. »Wurden« bewahrt den verbalen Charakter von היה.
- source_word: לְנָשִׁים לֹו
  choice: seine Frauen
  rationale: Die Konstruktion bedeutet wörtlich etwa »ihm zu Frauen«; »seine Frauen« ist im Deutschen idiomatisch und gibt den pluralischen Ehesinn klar wieder.
- source_word: גַּם
  choice: auch
  rationale: Die Partikel kennzeichnet die Hinzufügung Ahinoams zu der zuvor genannten Abigajil.
theological_decisions:
- issue: Beschreibung einer Vielehe
  choice: Der Vers wird sachlich so wiedergegeben, dass beide Frauen Davids Ehefrauen wurden.
  alternative: Eine abschwächende oder wertende Formulierung, die den Plural verdeckt oder moralisch kommentiert.
  rationale: Der hebräische Text nennt beide ausdrücklich Davids Frauen. Die Übersetzung beschreibt dies, ohne es über den Wortlaut hinaus zu billigen oder zu verurteilen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur folgt dem Hebräischen, bleibt aber für heutige Leser natürlich und verständlich.
