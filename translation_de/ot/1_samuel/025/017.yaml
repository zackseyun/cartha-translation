source:
  edition: WLC
  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: de
  text: Nun erkenne die Lage und überlege, was du tun sollst. Denn es steht fest, dass Unheil über unseren Herrn und sein ganzes Haus kommt. Er ist ein nichtsnutziger Mensch[a], mit dem man nicht reden kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Sohn der Nichtsnutzigkeit“; traditionell: „ein Sohn Belials“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Markiert natürlich und knapp den dringlichen Übergang zur Aufforderung.
- source_word: דְּעִי וּרְאִי
  choice: erkenne die Lage und überlege
  rationale: Die beiden femininen Singularimperative bedeuten wörtlich „erkenne und sieh“. Im Zusammenhang fordert die Verbindung Abigail dazu auf, die Lage zu erfassen und wohlüberlegt zu handeln; beide Verben bleiben in natürlichem Deutsch erkennbar.
- source_word: מַה תַּעֲשִׂי
  choice: was du tun sollst
  rationale: Das Imperfekt bezeichnet hier die erwogene künftige Handlung. „Sollst“ gibt den dringlichen Rat wieder, ohne den Wortlaut zu einem ausdrücklichen Befehl zu verschärfen.
- source_word: כָלְתָה הָרָעָה
  choice: das Unheil … ist beschlossen
  rationale: Die Wendung bezeichnet hier ein feststehendes beziehungsweise beschlossenes schädliches Geschehen. „Unheil“ passt zur drohenden Gewalttat, während „ist beschlossen“ die Entschiedenheit des Ausgangs ausdrückt.
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: über unseren Herrn und sein ganzes Haus
  rationale: „Herr“ bezeichnet hier den Hausherrn Nabal; „Haus“ umfasst im biblischen Sprachgebrauch seinen gesamten Haushalt. Die Präposition „über“ verbindet sich im Deutschen idiomatisch mit hereinbrechendem Unheil.
- source_word: בֶּן בְּלִיַּעַל
  choice: ein nichtsnutziger Mensch
  rationale: Die hebräische Idiomatik beschreibt einen moralisch verkommenen, unzugänglichen Menschen. Die Übersetzung gibt die Bedeutung wieder, ohne „Belial“ anachronistisch als Eigennamen eines dämonischen Wesens zu verstehen.
- source_word: מִדַּבֵּר אֵלָיו
  choice: mit dem man nicht reden kann
  rationale: Die Konstruktion bezeichnet die praktische Unmöglichkeit, vernünftig mit ihm zu sprechen. Die unbestimmte Formulierung mit „man“ entspricht dem allgemeinen Sinn.
theological_decisions:
- issue: Deutung von בְּלִיַּעַל
  choice: nichtsnutziger Mensch
  alternative: Sohn der Nichtsnutzigkeit; Sohn Belials
  rationale: An dieser Stelle ist בְּלִיַּעַל eine wertende Personenbezeichnung und verlangt nicht die spätere Auffassung als dämonischer Eigenname. Eine Fußnote bewahrt die konkrete hebräische Ausdrucksweise und die traditionelle Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dringliche Rede des Dieners bleibt direkt, ohne altertümliche Imperativformen. „Haus“ bewahrt die biblische Haushaltsmetapher; die Fußnote steht unmittelbar bei der Wendung, die sie erläutert.
