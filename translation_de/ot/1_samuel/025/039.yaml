  to: 'Als David hörte, dass Nabal tot war, sagte er: »Gepriesen sei Jahwe, der mir wegen der Schmach, die Nabal mir zugefügt hat, Recht verschafft[a] und seinen Diener vor bösem Handeln bewahrt hat[b]. Jahwe hat Nabals böse Tat auf seinen eigenen Kopf zurückfallen lassen[c].« Dann sandte David Boten zu Abigajil und ließ ihr sagen, dass er sie sich zur Frau nehmen wolle[d].'
  rationale: Die Revision ersetzt die missverständliche und weniger natürliche Formulierung zum Rechtsstreit durch „mir ... Recht verschafft“, das die forensische Funktion des hebräischen Ausdrucks im Deutschen klar wiedergibt. Die Alternative mit dem Rechtsstreit bleibt in der Fußnote erhalten. Ferner wird die übermittelte Heiratsabsicht mit Konjunktiv I idiomatisch markiert. Die Aussage bleibt auf Davids Deutung beschränkt und fügt keine weitergehende theologische Behauptung hinzu.
