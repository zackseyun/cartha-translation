source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: de
  text: 'Als David hörte, dass Nabal tot war, sagte er: »Gepriesen sei Jahwe, der mir wegen der Schmach, die Nabal mir zugefügt hat, Recht verschafft[a] und seinen Diener vor bösem Handeln bewahrt hat[b]. Jahwe hat Nabals böse Tat auf seinen eigenen Kopf zurückfallen lassen[c].« Dann sandte David Boten zu Abigajil und ließ ihr sagen, dass er sie sich zur Frau nehmen wolle[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »der meine Sache wegen der von Nabal zugefügten Schmach geführt hat« oder »der meine Beleidigung gerächt hat«. Im Hebräischen steht die Sprache eines Rechtsstreits.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »der seinen Diener davon zurückgehalten hat, Böses zu tun«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Jahwe hat Nabals böse Tat auf seinen Kopf zurückgebracht«; dies ist ein Bild dafür, dass die Folgen des Bösen auf den Täter zurückfallen.'
    reason: cultural_note
  - marker: d
    text: 'Wörtlich: »um sie sich zur Frau zu nehmen«; gemeint ist, sie zu heiraten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Gepriesen sei Jahwe
  rationale: Die herkömmliche Segensformel wird im Deutschen natürlich und doxologisch wiedergegeben; der Gottesname bleibt als Eigenname erhalten.
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  choice: der meinen Rechtsstreit wegen der Schmach, die Nabal mir zugefügt hat, geführt hat
  rationale: Die Wiedergabe bewahrt das forensische Bild von ריב und macht zugleich verständlich, worin die Schmach bestand. Die im Hebräischen mögliche Nuance von Rechtverschaffung beziehungsweise Vergeltung bleibt in der Fußnote sichtbar.
- source_word: מִיַּד נָבָל
  choice: die Nabal mir zugefügt hat
  rationale: Die wörtliche Wendung „aus der Hand Nabals“ bezeichnet hier Nabal als Urheber; eine natürliche deutsche Formulierung gibt diese Funktion klar wieder.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: und seinen Diener vor bösem Handeln bewahrt hat
  rationale: חשׂך bezeichnet Zurückhalten oder Bewahren. „Böses Handeln“ erhält die moralische Aussage von רעה und verdeutlicht, dass David selbst der Diener ist.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: Jahwe hat Nabals Bosheit auf seinen eigenen Kopf zurückfallen lassen
  rationale: Die Formulierung bewahrt das hebräische Vergeltungsbild, wonach das Böse auf den Täter selbst zurückkommt.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: Dann sandte David Boten zu Abigajil und ließ ihr sagen
  rationale: Das nicht genannte Objekt von „sandte“ sind dem Zusammenhang nach Boten. Die Wiedergabe vermeidet die unnatürliche Vorstellung, David habe zugleich gesandt und persönlich gesprochen, ohne das Folgende als förmlichen Heiratsantrag überzuinterpretieren.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: dass er sie zur Frau nehmen wollte
  rationale: Die standardmäßige hebräische Eheformel wird quellennah und zugleich in natürlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Göttliches Gericht und Vorsehung bei Nabals Tod
  choice: Davids Aussage schreibt Jahwe seine Rechtverschaffung und die Rückkehr von Nabals Bosheit auf ihn selbst zu.
  alternative: Ausdrücklich formulieren, Jahwe habe Nabal unmittelbar getötet, oder die Vergeltungsaussage abschwächen.
  rationale: Der Vers enthält Davids theologische Deutung ausdrücklich, sagt an dieser Stelle jedoch nicht in einer zusätzlichen allgemeinen Lehrformel, wie jedes Leiden oder jeder Tod zu verstehen ist.
- issue: Moralische Bewertung von Davids beabsichtigtem Handeln
  choice: „vor bösem Handeln bewahrt“
  alternative: „vor Schaden bewahrt“ oder „von der Rache abgehalten“
  rationale: רעה hat hier moralische Kraft; zugleich sollte die Übersetzung nicht mehr spezifizieren, als der Ausdruck selbst sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jahwe“ gibt das Tetragramm als Gottesnamen wieder. Die rechtssprachliche Bildwelt und das Vergeltungsbild des Hebräischen bleiben erhalten; syntaktisch unnatürliche Hebraismen werden behutsam idiomatisiert.
