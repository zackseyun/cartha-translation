source:
  edition: WLC
  text: וְ/שָׁא֗וּל נָתַ֛ן אֶת מִיכַ֥ל בִּתּ֖/וֹ אֵ֣שֶׁת דָּוִ֑ד לְ/פַלְטִ֥י בֶן לַ֖יִשׁ אֲשֶׁ֥ר מִ/גַּלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: de
  text: Saul hatte seine Tochter Michal, Davids Frau, Palti, dem Sohn Lajischs, zur Frau gegeben, der aus Gallim stammte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: Saul aber
  rationale: Das ו verbindet den Satz mit dem vorausgehenden Zusammenhang; „aber“ gibt den erzählerischen Kontrast im Deutschen natürlich wieder, ohne ein nicht vorhandenes zeitliches „nun“ einzuführen.
- source_word: נָתַן
  choice: hatte … zur Frau gegeben
  rationale: Das Plusquamperfekt kennzeichnet die Handlung als bereits vollzogen. „Zur Frau geben“ gibt in diesem Zusammenhang die Heiratsübergabe natürlich wieder, ohne den Tatbestand weiter auszudeuten.
- source_word: מִיכַל בִּתּוֹ
  choice: seine Tochter Michal
  rationale: Die Apposition wird in eine im modernen Deutschen natürliche Wortfolge gebracht.
- source_word: אֵשֶׁת דָּוִד
  choice: Davids Frau
  rationale: Die knappe Genitivverbindung bewahrt ausdrücklich Michals Beziehung zu David, obwohl Saul sie einem anderen Mann gegeben hatte.
- source_word: לְ/פַלְטִי
  choice: Palti
  rationale: Der Personenname wird entsprechend der masoretischen Form פַלְטִי als „Palti“ wiedergegeben.
- source_word: בֶן לַיִשׁ
  choice: dem Sohn des Lajisch
  rationale: Die übliche deutsche Wiedergabe der Abstammungsangabe; לַיִשׁ wird nach deutscher Bibelnamenkonvention „Lajisch“ transkribiert.
- source_word: אֲשֶׁר מִ/גַּלִּים
  choice: aus Gallim
  rationale: Die Herkunftsangabe wird knapp und idiomatisch wiedergegeben; der Relativsatz wird in die Apposition eingebettet.
theological_decisions:
- issue: Michals fortbestehende Bezeichnung als Davids Frau
  choice: „Davids Frau“ bleibt ausdrücklich stehen.
  alternative: Die Bezeichnung abschwächen oder nur als frühere Ehebeziehung ausdrücken.
  rationale: Der hebräische Text nennt Michal trotz Sauls Handlung weiterhin אֵשֶׁת דָּוִד. Die rechtliche und erzählerische Spannung darf nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ineinander geschobenen Appositionen bleiben übersichtlich; „zur Frau gegeben“ ist eine natürliche deutsche Wiedergabe des im Kontext gemeinten Vorgangs.
