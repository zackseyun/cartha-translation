base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: de
  text: Am Morgen, als der Wein Nabal verlassen hatte[a], erzählte ihm seine Frau, was geschehen war. Da starb sein Herz in ihm[b], und er wurde wie ein Stein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „als der Wein aus Nabal hinausgegangen war“; gemeint ist, dass er wieder nüchtern war beziehungsweise die Wirkung des Weins nachgelassen hatte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Da versagte sein Herz in ihm.“ Das Hebräische verwendet ein eindringliches Bild und keine genaue medizinische Bezeichnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: Am Morgen
  rationale: Die übliche und natürliche Wiedergabe der hebräischen Zeitangabe.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: als der Wein von Nabal gewichen war
  rationale: Bewahrt das konkrete hebräische Bild, klingt im Deutschen jedoch natürlicher als die streng wörtliche Formulierung „aus Nabal hinausgegangen war“. Gemeint ist, dass sein Rausch vorüber war.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: erzählte ihm seine Frau
  rationale: נגד im Hifil bedeutet hier „mitteilen, erzählen“. Die gewählte Form ist natürlich und passt zum berichtenden Zusammenhang.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: was geschehen war
  rationale: דברים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bezeichnen. Hier berichtet Abigail die vorausgegangenen Ereignisse; die kontextuelle Wiedergabe ist im Deutschen klarer als „diese Dinge“.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: Da starb sein Herz in seinem Innern
  rationale: Bewahrt die eindringliche Bildsprache des Hebräischen und vermeidet eine medizinische Festlegung, die der Text selbst nicht trifft.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: und er wurde wie ein Stein
  rationale: Gibt die hebräische Vergleichsaussage idiomatisch wieder, ohne sie medizinisch auszudeuten.
theological_decisions:
- issue: Ob Nabals Zustand medizinisch zu bestimmen oder die Bildsprache des Erzähltextes zu bewahren ist
  choice: Die Bilder „sein Herz starb in seinem Innern“ und „er wurde wie ein Stein“ bleiben erhalten.
  alternative: Er erlitt einen Herzinfarkt oder Schlaganfall und wurde gelähmt.
  rationale: Der hebräische Text nennt keine technische Diagnose. Die offene, bildhafte Beschreibung kann Schock, Zusammenbruch oder einen schlaganfallähnlichen Zustand nahelegen, legt sich aber nicht eindeutig fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche hebräische Bildsprache wird bewusst bewahrt; die Fußnoten erläutern sie, ohne eine medizinische Diagnose in den Text einzutragen.
