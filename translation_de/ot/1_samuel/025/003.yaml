source:
  edition: WLC
  text: וְ/שֵׁ֤ם הָ/אִישׁ֙ נָבָ֔ל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ אֲבִגָ֑יִל וְ/הָ/אִשָּׁ֤ה טֽוֹבַת שֶׂ֨כֶל֙ וִ֣/יפַת תֹּ֔אַר וְ/הָ/אִ֥ישׁ קָשֶׁ֛ה וְ/רַ֥ע מַעֲלָלִ֖ים וְ/ה֥וּא כ/לב/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: de
  text: Der Mann hieß Nabal, und seine Frau hieß Abigail. Die Frau war verständig und von schöner Gestalt, der Mann aber war hart und böse in seinem Handeln; er war ein Kalebiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wahrscheinlich „ein Kalebiter“, also ein Angehöriger der Sippe Kalebs; die Schreibform ist ungewöhnlich, weshalb auch andere Lesungen erwogen werden.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: Nabal
  rationale: Eigenname; in der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: אֲבִגָיִל
  choice: Abigail
  rationale: Eigenname; in der etablierten deutschen Form wiedergegeben.
- source_word: טוֹבַת שֶׂכֶל
  choice: verständig
  rationale: Die Wendung bezeichnet guten Verstand beziehungsweise Einsicht. „Verständig“ ist natürlich, würdevoll und bewahrt den positiven Sinn.
- source_word: וִיפַת תֹּאַר
  choice: von schöner Gestalt
  rationale: Die Konstruktion beschreibt körperliche Schönheit beziehungsweise ein schönes Erscheinungsbild. Die gewählte Formulierung erhält diesen konkreten Bezug.
- source_word: קָשֶׁה
  choice: hart
  rationale: Bezeichnet hier Nabals schwierige, unnachgiebige Wesensart. „Hart“ bleibt nahe am hebräischen Ausdruck, ohne ihn unnötig auszudeuten.
- source_word: רַע מַעֲלָלִים
  choice: böse in seinem Handeln
  rationale: מַעֲלָלִים bezeichnet Taten, Verhalten oder Handlungsweisen. Die Formulierung gibt die moralische Bewertung klar und idiomatisch wieder.
- source_word: כלבו
  choice: ein Kalebiter
  rationale: 'Die ungewöhnliche Konsonantenform wird traditionell als Herkunftsbezeichnung verstanden: Nabal gehörte zur Sippe Kalebs. Da die Form textlich auffällig ist, wird die Unsicherheit in einer Fußnote kenntlich gemacht.'
theological_decisions:
- issue: Deutung von וְהוּא כלבו
  choice: er war ein Kalebiter
  alternative: Die ungewöhnliche Schreibform könnte anders gelesen oder gedeutet werden.
  rationale: Die traditionelle Lesart als Sippen- oder Herkunftsbezeichnung passt zum Zusammenhang und wird durch alte Überlieferung gestützt. Da es sich um eine echte textlich-lexikalische Schwierigkeit handelt, wird sie nicht stillschweigend beseitigt, sondern in der Fußnote vermerkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Gegenüberstellung der positiven Beschreibung Abigails und der negativen Charakterisierung Nabals bleibt durch „aber“ deutlich erhalten.
