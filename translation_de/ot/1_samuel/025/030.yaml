  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: de
  text: Und wenn Jahwe meinem Herrn all das Gute erwiesen hat, das er über dich gesagt hat[a], und dich zum Herrscher über Israel eingesetzt hat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all das Gute, das er dir zugesagt hat“. Wörtlich: „all das Gute, das er über dich geredet hat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und dich beauftragt hat, Herrscher über Israel zu sein“. Das Verb bedeutet häufig „befehlen“ oder „beauftragen“, kann hier aber die Einsetzung in das Herrscheramt bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die hebräische Zukunftsformel leitet hier einen erwarteten künftigen Zeitpunkt ein; „Und wenn“ gibt sie natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לַאדֹנִי
  choice: meinem Herrn
  rationale: Abigajil redet David ehrerbietig an; „mein Herr“ bewahrt diesen höfischen Respekt im Deutschen.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: all das Gute …, das er dir zugesagt hat
  rationale: Das Hebräische spricht wörtlicher von dem Guten, das Jahwe über David geredet hat. „zugesagt“ vermittelt im Kontext den Verheißungscharakter, ohne das Gemeinte auf einzelne Güter einzuengen.
- source_word: וְצִוְּךָ לְנָגִיד
  choice: und dich zum Herrscher … eingesetzt hat
  rationale: צוה bedeutet gewöhnlich „befehlen“, bezeichnet mit לְנָגִיד hier aber wahrscheinlich die Beauftragung beziehungsweise Einsetzung in ein Leitungsamt.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: Die Präposition bezeichnet hier den Herrschaftsbereich beziehungsweise die Autorität über Israel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Umschrift „Jahwe“ bewahrt den persönlichen Gottesnamen.
- issue: Bedeutung von וְצִוְּךָ im Zusammenhang mit לְנָגִיד
  choice: dich … eingesetzt hat
  alternative: dir geboten hat, Herrscher zu sein
  rationale: Die Grundbedeutung „befehlen/beauftragen“ bleibt möglich, doch die Verbindung mit dem Amt des נָגִיד legt hier eine Einsetzung oder Beauftragung zum Herrscher nahe; die Alternative wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt entsprechend dem hebräischen Kontext und der Versabgrenzung syntaktisch offen, da er im folgenden Vers fortgesetzt wird.
