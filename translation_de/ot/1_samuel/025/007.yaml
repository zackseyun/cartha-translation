  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die zweimalige hebräische Wiederholung von עתה wird nicht mechanisch als zweites »nun« wiedergegeben, da dies im Deutschen schwerfällig wäre; der unmittelbare Übergang bleibt durch die Satzfolge erhalten.
