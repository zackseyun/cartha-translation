source:
  edition: WLC
  text: וְ/עַתָּ֣ה שָׁמַ֔עְתִּי כִּ֥י גֹזְזִ֖ים לָ֑/ךְ עַתָּ֗ה הָ/רֹעִ֤ים אֲשֶׁר לְ/ךָ֙ הָי֣וּ עִמָּ֔/נוּ לֹ֣א הֶכְלַמְנ֗וּ/ם וְ/לֹֽא נִפְקַ֤ד לָ/הֶם֙ מְא֔וּמָה כָּל יְמֵ֖י הֱיוֹתָ֥/ם בַּ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: de
  text: Und nun habe ich gehört, dass bei dir die Schafe geschoren werden. Nun, deine Hirten, die bei uns waren, haben wir nicht schlecht behandelt[a], und ihnen ist nichts abhandengekommen, solange sie in Karmel waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »haben wir sie nicht beschämt«. Das hebräische Verb kann bedeuten, jemanden zu beschämen oder ihm übel mitzuspielen; hier geht es im Zusammenhang darum, dass Nabals Hirten nicht geschädigt oder misshandelt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die hebräische Verknüpfung als auch den zeitlichen Übergang in Davids Rede.
- source_word: שָׁמַעְתִּי כִּי
  choice: habe ich gehört, dass
  rationale: Das Perfekt bezeichnet hier eine Nachricht mit gegenwärtiger Relevanz; der deutsche dass-Satz gibt den berichteten Inhalt natürlich wieder.
- source_word: גֹזְזִים לָךְ
  choice: bei dir die Schafe geschoren werden
  rationale: Die knappe hebräische Wendung bezeichnet Nabals Schafschur. Die passive deutsche Form macht das mitgemeinte Objekt verständlich, ohne einen Besitz an Scherern zu behaupten.
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  choice: deine Hirten
  rationale: Die Zugehörigkeitskonstruktion wird im Deutschen idiomatisch mit einem Possessiv ausgedrückt.
- source_word: הָיוּ עִמָּנוּ
  choice: die bei uns waren
  rationale: Entspricht der einfachen räumlich-sozialen Aussage, ohne Aufenthalt oder Dienstverhältnis näher festzulegen.
- source_word: לֹא הֶכְלַמְנוּם
  choice: haben wir nicht schlecht behandelt
  rationale: Der Hifil von כלם kann Beschämung, Kränkung oder schädigende Behandlung ausdrücken. Im Zusammenhang schützt diese Formulierung den praktischen Sinn, während die Fußnote die wörtlichere Bedeutungsnähe nennt.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: ihnen ist nichts abhandengekommen
  rationale: Gibt den Sinn von נפקד als fehlen beziehungsweise vermisst werden idiomatisch wieder und lässt offen, welche konkrete Habe gemeint ist.
- source_word: כָּל יְמֵי הֱיוֹתָם
  choice: solange sie … waren
  rationale: Natürliches modernes Deutsch für die hebräische Zeitangabe „alle Tage ihres Seins“.
- source_word: בַּכַּרְמֶל
  choice: in Karmel
  rationale: Behandelt Karmel zutreffend als Ortsnamen in Juda.
