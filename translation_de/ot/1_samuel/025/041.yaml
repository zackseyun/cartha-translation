  naturalness: Die Revision ist modernes, würdiges Standarddeutsch. »Sieh« ist als direkte Wiedergabe von הִנֵּה möglich; die Formulierung »ist bereit, als Magd ... zu waschen« löst die hebräische Ellipse natürlich, ohne deren Demutsgeste zu verwischen.
  terminology: »Dienerin« und »Magd« geben die zwei unterschiedlichen, semantisch überlappenden weiblichen Dienstbezeichnungen wieder, ohne eine nicht gesicherte rechtliche Rangdifferenz zu behaupten. »Mein Herr« bewahrt die höfisch-unterwürfige Anrede. Die Fußnote ist unmittelbar an »Magd« verankert.
