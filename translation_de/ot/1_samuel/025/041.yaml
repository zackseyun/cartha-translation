base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: de
  text: 'Sie stand auf, warf sich mit dem Gesicht zur Erde nieder und sagte: »Sieh, deine Dienerin ist bereit, als Magd[a] den Dienern meines Herrn die Füße zu waschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Sieh, deine Dienerin als Magd, um den Dienern meines Herrn die Füße zu waschen.« Die beiden hebräischen Wörter bezeichnen weibliche Personen in dienender oder unfreier Stellung; sie sind eng verwandt, aber nicht identisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Sie stand auf
  rationale: Das Qal-Wayyiqtol von קום setzt die Erzählfolge fort; »stand auf« ist direkt und natürlich.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: verneigte sich mit dem Gesicht bis zur Erde
  rationale: Die Wendung bezeichnet eine tiefe Ehrerbietung und bewahrt sowohl die Körperhaltung als auch die Richtung zur Erde.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Interjektion leitet Abigajils demütige Selbstaussage ein; »Sieh« ist würdevoll, verständlich und weniger altertümlich als »siehe«.
- source_word: אֲמָתְךָ
  choice: deine Dienerin
  rationale: אָמָה bezeichnet eine weibliche Dienerin beziehungsweise Sklavin und dient hier als demütige Selbstbezeichnung; die feminine Form bleibt erhalten.
- source_word: לְשִׁפְחָה
  choice: will eine Magd sein
  rationale: שִׁפְחָה ist ein zweiter Ausdruck für eine weibliche Person in dienender oder unfreier Stellung. »Magd« unterscheidet ihn von אמה, ohne im Deutschen eine nicht eindeutig festgelegte Statusabstufung zu behaupten; »will … sein« gibt die prädikative Konstruktion idiomatisch wieder.
- source_word: לִרְחֹץ
  choice: die … wäscht
  rationale: Der Infinitiv mit לְ bezeichnet hier die vorgesehene Aufgabe beziehungsweise den Zweck; ein deutscher Relativsatz klingt natürlicher als eine substantivische Zweckfügung.
- source_word: רַגְלֵי עַבְדֵי אֲדֹנִי
  choice: den Dienern meines Herrn die Füße
  rationale: 'Die deutsche Dativkonstruktion ist idiomatisch und bewahrt das Verhältnis: Es sind die Füße der Diener ihres Herrn.'
theological_decisions:
- issue: Verhältnis der weiblichen Dienstbezeichnungen אָמָה und שִׁפְחָה
  choice: Als »Dienerin« und »Magd« unterschiedlich wiedergeben
  alternative: Beide mit »Dienerin« wiedergeben oder die zweite Bezeichnung ausdrücklich als »Sklavin« übersetzen
  rationale: Der hebräische Text verwendet zwei eng verwandte, aber verschiedene feminine Bezeichnungen. Die unterschiedliche Wiedergabe bewahrt diese Variation und Abigajils tiefe Selbsterniedrigung, ohne eine sichere Rangordnung oder einen ausschließlich rechtlichen Sklavenstatus in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Anrede »mein Herr« und die demütige Selbstbezeichnung bleiben erhalten. Der Satzbau wurde leicht idiomatisiert, während die auffällige Doppelung der weiblichen Dienstbegriffe in Haupttext und Fußnote sichtbar bleibt.
