source:
  edition: WLC
  text: וַ/יָּ֣מָת שְׁמוּאֵ֔ל וַ/יִּקָּבְצ֤וּ כָל יִשְׂרָאֵל֙ וַ/יִּסְפְּדוּ ל֔/וֹ וַ/יִּקְבְּרֻ֥/הוּ בְּ/בֵית֖/וֹ בָּ/רָמָ֑ה וַ/יָּ֣קָם דָּוִ֔ד וַ/יֵּ֖רֶד אֶל מִדְבַּ֥ר פָּארָֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: de
  text: Samuel starb, und ganz Israel versammelte sich und hielt Totenklage um ihn[a]. Sie begruben ihn bei seinem Haus in Rama. Danach brach David auf und zog hinab in die Wüste Paran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »trauerte um ihn«. Das hebräische Verb bezeichnet die Totenklage beziehungsweise die Trauerriten für einen Verstorbenen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: Samuel starb
  rationale: Die einfache Erzählform wird ohne ein im Hebräischen nicht ausdrücklich vorhandenes »nun« wiedergegeben.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: ganz Israel versammelte sich
  rationale: Die kollektive nationale Bezeichnung »ganz Israel« bewahrt die hebräische Ausdrucksweise; der deutsche Singular entspricht dem Kollektivsubjekt.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: hielt die Totenklage um ihn
  rationale: ספד bezeichnet hier ausdrücklich die rituelle Klage um einen Verstorbenen; die Formulierung ist präziser als das allgemeinere »trauerte«.
- source_word: וַיִּקְבְּרֻהוּ בְּבֵיתוֹ
  choice: Sie begruben ihn bei seinem Haus
  rationale: »Bei seinem Haus« bewahrt den Wortlaut, ohne zwingend eine Bestattung im Inneren des Wohngebäudes zu behaupten.
- source_word: בָּרָמָה
  choice: in Rama
  rationale: Der Ortsname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
- source_word: וַיָּקָם דָּוִד
  choice: Danach brach David auf
  rationale: קום leitet hier Davids anschließende Bewegung ein; »brach auf« ist im modernen Deutschen natürlicher als das wörtliche »stand auf«.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: zog hinab in die Wüste Paran
  rationale: »zog hinab« erhält die topografische Bewegungsangabe von ירד; »Wüste Paran« gibt die hebräische Konstruktverbindung knapp und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht den Wechsel von der Bestattung Samuels zu Davids Aufbruch klar, ohne den Erzählzusammenhang zu verändern.
