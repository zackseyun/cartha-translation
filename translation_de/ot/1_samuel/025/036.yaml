base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: de
  text: Als Abigail zu Nabal kam, da hielt er gerade in seinem Haus ein Festmahl ab wie das Festmahl eines Königs. Nabal war guter Dinge, und er war sehr betrunken. Sie erzählte ihm jedoch überhaupt nichts – weder Kleines noch Großes[a] – bis zum Morgenlicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »kein Wort, weder klein noch groß«; eine hebräische Ausdrucksweise für »überhaupt nichts«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bis zum Tagesanbruch«. Wörtlich: »bis zum Licht des Morgens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Als Abigail zu Nabal kam
  rationale: Die temporale Einleitung verbindet Abigails Ankunft natürlich mit der beim Eintreffen vorgefundenen Szene.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: Bewahrt die aufmerksamkeitslenkende, szenisch vergegenwärtigende Funktion des hebräischen Ausdrucks in würdigem, verständlichem Deutsch.
- source_word: מִשְׁתֶּה בְּבֵיתוֹ
  choice: in seinem Haus ein Festmahl
  rationale: „Festmahl“ gibt das Mahl mit reichlichem Trinken wieder; die folgende Aussage nennt die Trunkenheit ausdrücklich.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: wie das Festmahl eines Königs
  rationale: Erhält den Vergleich und den Eindruck königlicher Pracht, ohne einen bestimmten König vorauszusetzen.
- source_word: וְלֵב נָבָל טוֹב עָלָיו
  choice: Nabal war in ausgelassener Stimmung
  rationale: Gibt die hebräische Wendung vom guten beziehungsweise frohen Herzen situationsgerecht wieder; im Zusammenhang von Fest und Trunkenheit bezeichnet sie seine gehobene, enthemmte Stimmung.
- source_word: וְהוּא שִׁכֹּר עַד מְאֹד
  choice: und er war sehr betrunken
  rationale: Klare und natürliche Wiedergabe des Adjektivs mit starker Intensivierung.
- source_word: וְלֹא הִגִּידָה לּוֹ
  choice: Deshalb erzählte sie ihm überhaupt nichts
  rationale: Der deutsche Folgesatz macht den durch seine Trunkenheit motivierten Handlungszusammenhang deutlich, ohne zusätzliche Information einzuführen.
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: überhaupt nichts – weder Kleines noch Großes
  rationale: Die Bedeutung „gar nichts“ wird verständlich ausgedrückt, während die hebräische Merismus-Formel sichtbar bleibt.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: bis zum Morgenlicht
  rationale: Bewahrt das Bild vom Licht des Morgens; „bis zum Tagesanbruch“ ist eine mögliche idiomatischere Wiedergabe.
