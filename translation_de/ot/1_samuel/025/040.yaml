source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַבְדֵ֥י דָוִ֛ד אֶל אֲבִיגַ֖יִל הַ/כַּרְמֶ֑לָ/ה וַ/יְדַבְּר֤וּ אֵלֶ֨י/הָ֙ לֵ/אמֹ֔ר דָּוִד֙ שְׁלָחָ֣/נוּ אֵלַ֔יִ/ךְ לְ/קַחְתֵּ֥/ךְ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: de
  text: 'Da kamen Davids Diener zu Abigail nach Karmel und sagten zu ihr: »David hat uns zu dir gesandt, um dich für sich zur Frau zu nehmen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: בוא kann je nach Perspektive »kommen« oder »gehen« bedeuten. Die Erzählperspektive richtet sich hier auf Abigails Aufenthaltsort; »kamen« ist daher natürlich.
- source_word: עַבְדֵי דָוִד
  choice: Davids Diener
  rationale: עֶבֶד kann Diener, Sklave oder Amtsträger bezeichnen. Hier treten die Männer als Davids Abgesandte auf, ohne dass ihr rechtlicher Status betont wird.
- source_word: הַכַּרְמֶלָה
  choice: nach Karmel
  rationale: Die Richtungsendung -ה bezeichnet eine Bewegung auf Karmel zu. »Nach Karmel« gibt diese Zielrichtung im Deutschen präzise wieder.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: sagten zu ihr
  rationale: Die hebräische Redeeinleitung wird in natürlichem modernem Deutsch knapp wiedergegeben; ein zusätzliches »und sprachen ... folgendermaßen« wäre unnötig schwerfällig.
- source_word: שְׁלָחָנוּ
  choice: hat uns ... gesandt
  rationale: Das Perfekt bezeichnet die abgeschlossene Sendung mit gegenwärtiger Relevanz für den Auftrag der Boten.
- source_word: לְקַחְתֵּךְ
  choice: um dich ... zu nehmen
  rationale: לקח bezeichnet in Verbindung mit לְאִשָּׁה die Aufnahme einer Frau in die Ehe. Die konkrete Bildlichkeit des hebräischen Ausdrucks bleibt erhalten.
- source_word: לוֹ
  choice: für sich
  rationale: Das Pronomen verweist auf David zurück; »für sich« gibt den reflexiven Bezug idiomatisch wieder.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: »Jemanden zur Frau nehmen« ist die natürliche deutsche Entsprechung der festen hebräischen Heiratsformel.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Heiratsformel wird mit der im Deutschen geläufigen Wendung »zur Frau nehmen« wiedergegeben; dadurch ist keine Fußnote erforderlich.
