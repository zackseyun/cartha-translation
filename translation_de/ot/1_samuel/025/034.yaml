source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: de
  text: 'Doch so wahr Jahwe, der Gott Israels, lebt, der mich davon abgehalten hat, dir Böses zu tun: Wenn du dich nicht beeilt hättest und mir entgegengekommen wärst, wäre von Nabal bis zum Morgenlicht kein einziger Mann[a] übrig geblieben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einer, der gegen die Wand uriniert“; eine derbe hebräische Redewendung für eine männliche Person.'
    reason: Die Fußnote bewahrt die markante, grobe Bildsprache des Ausgangstextes, während der Haupttext ihre gemeinte Bedeutung verständlich wiedergibt.
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Die adversative Diskurspartikel leitet Davids feierliche, kontrastierende Feststellung natürlich ein.
- source_word: חַי יְהוָה
  choice: so wahr Jahwe ... lebt
  rationale: Die geläufige deutsche Schwurformel gibt die hebräische Eidesformel idiomatisch und feierlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen etablierte Wiedergabe des ausdrücklich gebrauchten Gottesnamens bewahrt dessen Eigennamecharakter.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: der mich davon abgehalten hat
  rationale: מנע bezeichnet hier das Verhindern beziehungsweise Zurückhalten von einer beabsichtigten Handlung.
- source_word: מֵהָרַע אֹתָךְ
  choice: dir Böses zu tun
  rationale: Diese Wiedergabe bleibt näher an der moralisch wertenden Formulierung des Hebräischen als das enger gefasste „dir zu schaden“ und passt zugleich zum konkreten Gewaltkontext.
- source_word: כִּי לוּלֵי
  choice: Wenn ... nicht
  rationale: Leitet eine irreale Bedingung der Vergangenheit ein; der deutsche Konjunktiv II bildet sie natürlich ab.
- source_word: מִהַרְתְּ
  choice: du dich ... beeilt hättest
  rationale: Bewahrt die feminine Singularanrede an Abigail und die irreale Vorzeitigkeit.
- source_word: וַתָּבֹאתִי לִקְרָאתִי
  choice: mir entgegengekommen wärst
  rationale: Gibt die feste Wendung für das Entgegengehen beziehungsweise Zusammentreffen idiomatisch wieder; der Kontext verlangt die Anrede an Abigail trotz der auffälligen überlieferten Konsonantenform.
- source_word: נוֹתַר לְנָבָל
  choice: wäre Nabal ... übrig geblieben
  rationale: Die Konstruktion bezeichnet, dass von den zu Nabals Haushalt Gehörenden niemand der genannten Gruppe verschont geblieben wäre.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: bis zum Morgenlicht
  rationale: Bewahrt das konkrete Bild vom Licht des Morgens genauer als das allgemeinere „bis zum Morgen“.
- source_word: מַשְׁתִּין בְּקִיר
  choice: kein einziger Mann
  rationale: Die wörtlich grobe Umschreibung „einer, der gegen die Wand uriniert“ ist ein Idiom für männliche Personen; im Haupttext wird seine gemeinte Referenz natürlich ausgedrückt und die Bildsprache in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Eigennamen. „Jahwe“ macht diesen sichtbar, ohne den Namen durch einen Titel zu ersetzen.
- issue: Moralische Bewertung von Davids beabsichtigter Tat in מֵהָרַע אֹתָךְ
  choice: dir Böses zu tun
  alternative: dir zu schaden
  rationale: 'Die breitere Formulierung bewahrt die mögliche moralische Spannung: Jahwe hielt David nicht nur von einer schädigenden Handlung, sondern vom Bösen gegenüber Abigail beziehungsweise ihrem Haus ab.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformel bleibt feierlich; die irreale Bedingung wird mit Konjunktiv II klar wiedergegeben. Die derbe hebräische Wendung wird im Haupttext sinngemäß und in der Fußnote wörtlich erschlossen.
