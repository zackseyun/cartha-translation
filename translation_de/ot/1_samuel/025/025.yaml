base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: de
  text: 'Bitte, mein Herr, schenk diesem nichtswürdigen Mann, diesem Nabal, keine Beachtung! Denn wie sein Name, so ist er: Nabal heißt er, und Torheit ist bei ihm.[a] Ich aber, deine Dienerin, habe die jungen Männer meines Herrn, die du gesandt hast, nicht gesehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Nabal“ steht im Hebräischen in einem Wortspiel mit einem Wort für „töricht“ bzw. „Torheit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Bitte
  rationale: Gibt die höflich-dringende Bitte der hebräischen Verneinung mit נָא natürlich wieder.
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: sich jemanden zu Herzen nehmen
  rationale: Bewahrt das hebräische Herzbild und bezeichnet hier, jemandem ernstes Gewicht beziehungsweise Beachtung zu geben.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: nichtswürdiger Mann
  rationale: בְּלִיַּעַל ist hier eine moralische Charakterisierung und kein Eigenname; „nichtswürdig“ wahrt die Schärfe ohne unnötige Konfessionalisierung.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: Denn wie sein Name, so ist er
  rationale: Erhält die knappe sprichwörtliche Struktur und die ausdrückliche Verbindung von Name und Wesen.
- source_word: נָבָל ... וּנְבָלָה
  choice: Nabal ... Torheit
  rationale: Der Personenname wird transliteriert; „Torheit“ macht das beabsichtigte hebräische Wortspiel im Deutschen erkennbar, das zusätzlich in der Fußnote erläutert wird.
- source_word: אֲמָתְךָ
  choice: deine Dienerin
  rationale: Gibt die weibliche Form ausdrücklich, zugleich idiomatisch und ohne altertümliche Sprache wieder.
- source_word: נַעֲרֵי
  choice: die jungen Männer
  rationale: Bleibt nahe an der lexikalischen Bedeutung; aus dem Zusammenhang ergibt sich ihre Funktion als Gesandte Davids.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Entspricht der respektvollen Anrede Abigajils an David und klingt im Deutschen würdig und natürlich.
