    issue: »höre auf die Worte deiner Dienerin« ist im Deutschen semantisch mehrdeutig.
    rationale: Die Konstruktion »auf etwas hören« kann bedeuten, einer Aufforderung Folge zu leisten. Das hebräische שמע mit »Worten« bittet hier um Anhören. »Höre die Worte deiner Dienerin an« bewahrt den Bezug auf die Worte und vermeidet die unbeabsichtigte Gehorsamsnuance.
