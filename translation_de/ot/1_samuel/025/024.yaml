base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: de
  text: 'Sie fiel ihm zu Füßen und sagte: »Mich, mein Herr, treffe die Schuld.[a] Lass doch deine Dienerin vor dir reden, und höre die Worte deiner Dienerin an.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Schuld liegt bei mir, mein Herr.« Wörtlich knapp: »Auf mir, mein Herr, die Schuld.« Abigail nimmt damit die Schuld auf sich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל־רַגְלָיו
  choice: Sie fiel ihm zu Füßen
  rationale: Die natürliche deutsche Wendung bewahrt sowohl die Körperhaltung als auch die Geste demütiger Bitte.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: Mich, mein Herr, treffe die Schuld
  rationale: Die knappe Konstruktion übernimmt die Schuld ausdrücklich auf Abigail; der Konjunktiv gibt den bittenden Charakter wieder und bleibt näher an der hebräischen Präposition als eine bloße Feststellung.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Hier ist eine ehrerbietige Anrede an David gemeint, nicht eine Gottesbezeichnung.
- source_word: וּתְדַבֶּר נָא
  choice: Lass doch ... reden
  rationale: Der Jussiv mit נָא formuliert eine höfliche, dringliche Bitte; »doch« gibt diese Nuance in natürlichem Deutsch wieder.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: deine Dienerin
  rationale: Das feminine Substantiv und Abigails demütige Selbstbezeichnung werden bewahrt; die Wiederholung folgt dem Hebräischen.
- source_word: בְּאָזְנֶיךָ
  choice: vor dir
  rationale: Wörtlich »in deinen Ohren«; »vor dir reden« ist im Deutschen eine natürliche Wiedergabe für das Reden in jemandes Hörweite, ohne eine unübliche Körpermetapher.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: und höre auf die Worte
  rationale: »Auf ... hören« vermittelt hier die Bitte, nicht nur akustisch wahrzunehmen, sondern der Rede Gehör zu schenken, und erhält zugleich das hebräische Substantiv »Worte«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Abigails ehrerbietiger und demütiger Ton wird durch »mein Herr«, »deine Dienerin« und die Bitte mit »doch« erhalten; die feminine Selbstbezeichnung bleibt ausdrücklich sichtbar.
