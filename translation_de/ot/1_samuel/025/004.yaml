  text: וַ/יִּשְׁמַ֥ע דָּוִ֖ד בַּ/מִּדְבָּ֑ר כִּֽי גֹזֵ֥ז נָבָ֖ל אֶת צֹאנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: de
  text: David hörte in der Wildnis, dass Nabal seine Schafe[a] schor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „seine Herde“. Das hebräische Wort צֹאן bezeichnet kollektiv kleinere Nutztiere, besonders Schafe und Ziegen; im Zusammenhang mit dem Scheren passt „Schafe“ am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Das Wayyiqtol von שׁמע berichtet hier ein Ereignis der Vergangenheit. „Hörte“ gibt die Form unmittelbar wieder; „erfuhr“ wäre möglich, aber stärker deutend.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר bezeichnet häufig unbesiedeltes Weide- oder Steppenland und nicht notwendig eine Sandwüste. Die Formulierung gibt wahrscheinlich Davids Aufenthaltsort beim Empfang der Nachricht an.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was David hörte.
- source_word: גֹזֵז
  choice: schor
  rationale: Das Partizip bezeichnet eine zu diesem Zeitpunkt stattfindende Tätigkeit. Im Deutschen kann das Präteritum „schor“ diesen erzählerischen Sachverhalt natürlich ausdrücken; die Verlaufsform „beim Scheren war“ wäre schwerfälliger.
- source_word: נָבָל
  choice: Nabal
  rationale: Der Personenname wird transliteriert und nicht übersetzt.
- source_word: אֶת צֹאנוֹ
  choice: seine Schafe
  rationale: צֹאן ist eine Kollektivbezeichnung für Kleinvieh, besonders Schafe und Ziegen. Im Zusammenhang mit dem Scheren ist „Schafe“ die natürlichste konkrete Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. „Wildnis“ vermeidet die zu enge Vorstellung einer Sandwüste; „schor“ klingt im deutschen Erzählstil natürlicher als eine ausdrücklich progressive Umschreibung.
