  variant: modern standard German
source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: de
  text: Vergib doch das Vergehen deiner Dienerin! Denn Jahwe wird meinem Herrn ganz gewiss ein beständiges Haus[a] errichten, weil mein Herr die Kämpfe Jahwes führt. Und nichts Böses wird sich an dir finden, solange du lebst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein fest gegründetes Haus« beziehungsweise »eine dauerhafte Dynastie«. Mit »Haus« ist hier eine beständige Familienlinie gemeint, nicht nur ein Gebäude oder Haushalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: Vergib doch das Vergehen
  rationale: Die Wendung »tragen/aufheben« mit לְפֶשַׁע bedeutet idiomatisch, ein Vergehen zu vergeben. »doch« gibt die bittende Kraft von נָא natürlich wieder.
- source_word: אֲמָתֶךָ
  choice: deiner Dienerin
  rationale: אמה bezeichnet ausdrücklich eine weibliche Dienerin. Die Formulierung bewahrt Abigajils demütige Selbstbezeichnung, ohne das heute altertümlich wirkende »Magd« zu verlangen.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: wird … ganz gewiss … errichten
  rationale: Infinitivus absolutus und finites Verb verstärken gemeinsam die Aussage; »ganz gewiss« bildet diese Bekräftigung ab.
- source_word: לַאדֹנִי
  choice: meinem Herrn
  rationale: Abigajil redet David respektvoll als ihren Herrn an. Die Kleinschreibung würde im Deutschen eher eine allgemeine Anrede nahelegen; »Herrn« ist hier die reguläre Substantivschreibung, nicht die Wiedergabe des Gottesnamens.
- source_word: בַּיִת נֶאֱמָן
  choice: ein beständiges Haus
  rationale: »Haus« bezeichnet hier über den Haushalt hinaus eine dauerhaft bestehende Familie beziehungsweise Dynastie. »Beständig« verdeutlicht נֶאֱמָן, während die biblische Haus-Metapher erhalten bleibt.
- source_word: מִלְחֲמוֹת יְהוָה … נִלְחָם
  choice: die Kämpfe Jahwes führt
  rationale: Das Partizip beschreibt Davids kennzeichnendes beziehungsweise fortdauerndes Handeln. »Kämpfe führen« ist natürliches Deutsch und bewahrt den Bezug auf Jahwes Sache.
- source_word: וְרָעָה לֹא תִמָּצֵא בְךָ
  choice: Und nichts Böses wird sich an dir finden
  rationale: רָעָה kann Böses, Unheil oder Schuld bezeichnen. »Nichts Böses« wahrt diese Weite; »sich an dir finden« lässt sowohl moralisches Fehlverhalten als auch anhaftendes Unheil anklingen, ohne vorschnell festzulegen.
- source_word: מִיָּמֶיךָ
  choice: solange du lebst
  rationale: Die hebräische Wendung bezeichnet idiomatisch die gesamte Lebenszeit. Die deutsche Formulierung ist klar und gegenwärtig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch den Titel »HERR« ersetzt.
theological_decisions:
- issue: Dynastische Bedeutung von »Haus«
  choice: ein beständiges Haus
  alternative: eine dauerhafte Dynastie
  rationale: Der Kontext weist auf eine bleibende Linie beziehungsweise ein künftiges Königshaus Davids. Die Übersetzung erhält jedoch die hebräische Metapher und damit ihre innerbiblischen Bezüge, statt sie vollständig auszudeuten.
- issue: Bedeutungsweite von רָעָה
  choice: nichts Böses
  alternative: kein Unheil / kein Fehlverhalten
  rationale: Das Wort kann moralisch Böses und widerfahrendes Unheil bezeichnen. Die allgemeinere Wiedergabe bewahrt die Spannung im Zusammenhang von Davids Verhalten und Zukunft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die respektvolle Rede Abigajils bleibt durch »meinem Herrn« und »deiner Dienerin« erkennbar. Der Gottesname wird konsequent als »Jahwe« wiedergegeben; die Haus-Metapher und die Bedeutungsweite von רָעָה bleiben erhalten.
