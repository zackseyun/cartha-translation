  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: de
  text: 'David sagte zu Abigajil: „Gepriesen sei Jahwe, der Gott Israels, der dich heute[a] gesandt hat, um mir zu begegnen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an diesem Tag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das Narrativ-Waw führt die nächste Handlung ein. Im modernen deutschen Erzählstil muss das verbindende וַ nicht eigens mit „und“ wiedergegeben werden.
- source_word: לַאֲבִיגַל
  choice: zu Abigajil
  rationale: Die Präposition לְ bezeichnet hier die Person, an die David seine Worte richtet. „Zu Abigajil“ ist idiomatisches Deutsch; der Name wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Das passive Partizip steht in einer feierlichen Lobpreisungsformel. „Gepriesen sei“ gibt sowohl den doxologischen Charakter als auch den gehobenen Ton natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen JHWH. „Jahwe“ ist dessen geläufige deutsche Wiedergabe und ersetzt den Namen nicht durch einen Titel.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung bezeichnet Jahwe als Israels Gott. Die Apposition mit Artikel ist im Deutschen natürlich und eindeutig.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen bezieht sich auf Jahwe und leitet den Satz über sein Handeln ein.
- source_word: שְׁלָחֵךְ
  choice: dich … geschickt hat
  rationale: Das Qal-Perfekt mit femininem Objektsuffix bezeichnet Gottes bereits vollzogene Sendung Abigajils. Das deutsche Perfekt fügt sich natürlich in die direkte Rede ein.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Die Wendung bedeutet wörtlich „an diesem Tag“. „Heute“ gibt ihren zeitlichen Sinn in modernem Deutsch knapp und natürlich wieder.
- source_word: לִקְרָאתִי
  choice: zu mir
  rationale: לִקְרַאת bezeichnet die Bewegung auf eine Begegnung mit jemandem hin. Zusammen mit „geschickt“ bringt „zu mir“ diesen Zweck idiomatisch zum Ausdruck, ohne eine zusätzliche Nuance in die Begegnung hineinzulesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der persönliche Gottesname JHWH und nicht der Titel אֲדֹנָי. Die Form „Jahwe“ bewahrt diesen Unterschied im Deutschen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem Ton. Die Lobpreisungsformel „Gepriesen sei“ bewahrt die feierliche Ausdrucksweise, während „heute“ und „zu mir geschickt“ natürlich und gegenwärtig klingen.
