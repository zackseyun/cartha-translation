  text: שְׁאַ֨ל אֶת נְעָרֶ֜י/ךָ וְ/יַגִּ֣ידוּ לָ֗/ךְ וְ/יִמְצְא֨וּ הַ/נְּעָרִ֥ים חֵן֙ בְּ/עֵינֶ֔י/ךָ כִּֽי עַל י֥וֹם ט֖וֹב בָּ֑נוּ תְּנָ/ה נָּ֗א אֵת֩ אֲשֶׁ֨ר תִּמְצָ֤א יָֽדְ/ךָ֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְ/בִנְ/ךָ֖ לְ/דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: de
  text: Frag deine jungen Männer; sie werden es dir sagen. Mögen die jungen Männer bei dir Gunst finden, denn wir sind an einem Festtag gekommen.[a] Bitte gib deinen Dienern und deinem Sohn David, was deine Hand findet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Festtag“ gibt den festlichen Anlass der Schafschur wieder; wörtlich steht hier „guter Tag“.
    reason: cultural_note
  - marker: b
    text: 'Das heißt: was du erübrigen kannst; wörtlich: „was deine Hand findet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל אֶת נְעָרֶיךָ
  choice: Frag deine jungen Männer
  rationale: Der Imperativ שְׁאַל wird direkt mit „Frag“ wiedergegeben. נְעָרִים kann junge Männer, Diener oder Begleiter bezeichnen; „junge Männer“ wahrt die lexikalische Verbindung zur folgenden Wiederaufnahme.
- source_word: וְיַגִּידוּ לָךְ
  choice: dann werden sie es dir sagen
  rationale: Das Hifil von נגד bedeutet hier „mitteilen/sagen“. „Dann“ gibt den folgerichtigen Zusammenhang im Deutschen natürlich wieder; „es“ verweist auf die von ihnen erwartete Auskunft.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: So lass die jungen Männer Gunst in deinen Augen finden
  rationale: Die feste Wendung מצא חן בעיני wird mit ihrem hebräischen Bild bewahrt. „Lass“ vermittelt die auffordernde beziehungsweise jussivische Nuance; „So“ nimmt die verbindende Folgerung des ו auf.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: denn wir sind an einem Festtag gekommen
  rationale: יוֹם טוֹב heißt wörtlich „guter Tag“, bezeichnet im Zusammenhang der Schafschur aber einen festlichen, zum Geben passenden Anlass. „Festtag“ macht diesen Kontext verständlich, ohne den Grundgedanken zu verändern.
- source_word: תְּנָה נָּא
  choice: Bitte gib
  rationale: Der Imperativ mit נָא ist eine höfliche Bitte. „Bitte gib“ ist gegenwärtiges, klares Deutsch.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: was deine Hand findet
  rationale: Die Übersetzung bewahrt das konkrete hebräische Bild. Gemeint ist das, was verfügbar ist beziehungsweise was Nabal erübrigen kann; diese idiomatische Bedeutung wird in einer Fußnote erläutert.
- source_word: לַעֲבָדֶיךָ
  choice: deinen Dienern
  rationale: עֶבֶד kann „Diener“ oder „Sklave“ bedeuten. Hier bezeichnet David sich und seine Leute in einer höflich-demütigen Bitte als Nabals Diener; „Diener“ trifft diese rhetorische Funktion.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: und deinem Sohn David
  rationale: David nennt sich aus Höflichkeit und Unterordnung Nabals „Sohn“; eine tatsächliche Verwandtschaft wird damit nicht behauptet. Die Formulierung wahrt diese demütige Selbstdarstellung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Bezeichnung „junge Männer“ und das hebräische Bild „Gunst in deinen Augen finden“ bleiben bewusst erhalten. Davids Anrede als „dein Sohn“ wird nicht geglättet, da sie seine höfliche, demütige Haltung ausdrückt.
