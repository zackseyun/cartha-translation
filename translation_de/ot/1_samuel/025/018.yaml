  text: וַ/תְּמַהֵ֣ר אבוגיל וַ/תִּקַּח֩ מָאתַ֨יִם לֶ֜חֶם וּ/שְׁנַ֣יִם נִבְלֵי יַ֗יִן וְ/חָמֵ֨שׁ צֹ֤אן עשוות וְ/חָמֵ֤שׁ סְאִים֙ קָלִ֔י וּ/מֵאָ֥ה צִמֻּקִ֖ים וּ/מָאתַ֣יִם דְּבֵלִ֑ים וַ/תָּ֖שֶׂם עַל הַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: de
  text: Da beeilte sich Abigail und nahm zweihundert Brote, zwei Weinschläuche, fünf bereits zubereitete Schafe, fünf Sea[a] geröstetes Getreide, hundert Rosinenbündel[b] und zweihundert Feigenkuchen. Das alles lud sie auf die Esel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Sea war ein antikes Trockenmaß.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: hundert Rosinen. Die genaue Form der gezählten Einheiten wird nicht näher bezeichnet; wahrscheinlich waren Rosinen zu Bündeln oder ähnlichen Einheiten zusammengefasst.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַתְּמַהֵר אבוגיל
  choice: Da beeilte sich Abigajil
  rationale: Das Verb bezeichnet hastiges Handeln; „Da“ gibt die fortlaufende Erzählfolge natürlich wieder. „Abigajil“ folgt der üblichen deutschen Wiedergabe des hebräischen Namens.
- source_word: וַתִּקַּח
  choice: nahm
  rationale: Die direkte Grundbedeutung von לקח passt zur anschließenden Aufzählung der Vorräte.
- source_word: מָאתַיִם לֶחֶם
  choice: zweihundert Brote
  rationale: Das zählbare „Brote“ gibt לֶחֶם in diesem Versorgungskontext knapp und idiomatisch wieder.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: zwei Schläuche Wein
  rationale: נֵבֶל bezeichnet hier einen antiken Flüssigkeitsbehälter, wahrscheinlich einen Lederschlauch; „Schläuche“ vermeidet das anachronistische „Flaschen“.
- source_word: חָמֵשׁ צֹאן עשוות
  choice: fünf bereits zubereitete Schafe
  rationale: Das Partizip bezeichnet zum Verzehr bereitgemachte Tiere, ohne eindeutig festzulegen, ob sie vollständig gekocht oder nur küchenfertig waren.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: fünf Sea geröstetes Getreide
  rationale: Sea ist die konkrete antike Maßeinheit; קָלִי bezeichnet geröstetes beziehungsweise gedörrtes Getreide. Eine Fußnote erklärt das unbekannte Maß.
- source_word: מֵאָה צִמֻּקִים
  choice: hundert Rosinenportionen
  rationale: צִמֻּקִים bezeichnet Rosinen; bei der Zahl hundert sind abgezählte oder zusammengepresste Einheiten naheliegend. „Portionen“ macht den Zählgebrauch verständlich, ohne die Form sicher als Kuchen festzulegen; die Fußnote weist auf den knapperen hebräischen Wortlaut hin.
- source_word: מָאתַיִם דְּבֵלִים
  choice: zweihundert Feigenkuchen
  rationale: דְּבֵלָה bezeichnet einen aus gepressten Feigen geformten Kuchen.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: Das alles lud sie auf die Esel
  rationale: Wörtlich steht „sie legte [es] auf die Esel“. „Lud … auf“ ist im Deutschen die natürliche Beschreibung des Vorgangs und nimmt den Sammelbezug auf die aufgezählten Vorräte auf.
