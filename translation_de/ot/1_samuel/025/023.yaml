source:
  edition: WLC
  text: וַ/תֵּ֤רֶא אֲבִיגַ֨יִל֙ אֶת דָּוִ֔ד וַ/תְּמַהֵ֕ר וַ/תֵּ֖רֶד מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/תִּפֹּ֞ל לְ/אַפֵּ֤י דָוִד֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: de
  text: Als Abigail David sah, beeilte sie sich, stieg vom Esel, fiel vor David mit dem Gesicht zur Erde und beugte sich zur Erde nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warf sich zur Erde nieder“. Das hebräische Verb kann eine tiefe Verbeugung oder ein Sich-Niederwerfen bezeichnen. Hier geht es um Abigails Ehrerweisung gegenüber David, nicht notwendigerweise um Anbetung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: sah
  rationale: ראה ist hier das gewöhnliche Verb für das Sehen; „sah“ ist die schlichte und natürliche deutsche Entsprechung.
- source_word: וַתְּמַהֵר
  choice: beeilte sie sich
  rationale: מהר bezeichnet schnelles, unverzügliches Handeln. Die Formulierung bewahrt die erzählerische Dringlichkeit in modernem Deutsch.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: stieg vom Esel
  rationale: ירד bedeutet wörtlich hinabsteigen; bei einem Reittier ist „vom Esel steigen“ die natürliche deutsche Wiedergabe.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל פָּנֶיהָ
  choice: warf sich vor David mit dem Gesicht zur Erde nieder
  rationale: Die Wendung beschreibt eine körperliche Unterwerfungsgeste vor David. „Vor David“ vermeidet das nicht im Hebräischen stehende „zu Davids Füßen“, während „mit dem Gesicht zur Erde“ die konkrete Lage von עַל־פָּנֶיהָ wiedergibt.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: verneigte sich bis zum Boden
  rationale: שׁחה bezeichnet hier eine tiefe Verbeugung beziehungsweise Prostration als Ehrerweisung gegenüber einem Menschen. Die Übersetzung macht die Geste deutlich, ohne göttliche Anbetung zu unterstellen.
theological_decisions:
- issue: Wiedergabe von שׁחה bei einer Begegnung zwischen Menschen
  choice: verneigte sich bis zum Boden
  alternative: warf sich zu Boden; betete an
  rationale: Da sich die Handlung auf David richtet, bezeichnet das Verb hier eine ehrerbietige Unterwerfungsgeste. „Betete an“ würde eine theologische Bedeutung eintragen, die der Zusammenhang nicht verlangt; die mögliche Stärke der Geste bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die aufeinanderfolgenden Körperbewegungen des Hebräischen bleiben erkennbar; unnötig altertümliche Wendungen wie „fiel auf ihr Angesicht“ werden vermieden.
