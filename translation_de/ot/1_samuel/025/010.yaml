  text: וַ/יַּ֨עַן נָבָ֜ל אֶת עַבְדֵ֤י דָוִד֙ וַ/יֹּ֔אמֶר מִ֥י דָוִ֖ד וּ/מִ֣י בֶן יִשָׁ֑י הַ/יּוֹם֙ רַבּ֣וּ עֲבָדִ֔ים הַ/מִּתְפָּ֣רְצִ֔ים אִ֖ישׁ מִ/פְּנֵ֥י אֲדֹנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: de
  text: 'Nabal antwortete den Dienern Davids: „Wer ist David? Und wer ist der Sohn Isais? Heutzutage gibt es viele[a] Diener, die sich losreißen, jeder von seinem Herrn weg.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alternativ: „Heutzutage sind viele Diener zahlreich geworden, die sich losreißen, jeder von seinem Herrn weg.“'
    reason: Das Verb רַבּוּ kann sowohl den entstandenen Zustand („es gibt viele“) als auch das Werden beziehungsweise Zunehmen („sind zahlreich geworden“) hervorheben.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete ...
  rationale: Die beiden hebräischen Redeeinleitungsformeln werden im natürlichen Deutschen knapp mit „antwortete“ wiedergegeben; der Inhalt der direkten Rede bleibt unverändert.
- source_word: עַבְדֵי דָוִד
  choice: Diener Davids
  rationale: עבד bezeichnet hier Davids Boten beziehungsweise Gefolgsleute. „Diener“ ist im Deutschen verständlich und vermeidet die an dieser Stelle zu starke Festlegung auf rechtliche Sklaverei.
- source_word: מִי דָוִד וּמִי בֶן־יִשָׁי
  choice: Wer ist David? Und wer ist der Sohn Isais?
  rationale: Die wiederholte Frageform bewahrt Nabals verächtliche Rhetorik. „Sohn Isais“ erhält die hebräische Bezeichnung, statt sie durch Davids Namen zu ersetzen.
- source_word: הַיּוֹם
  choice: Heutzutage
  rationale: Im Zusammenhang einer verallgemeinernden Aussage bezeichnet das Wort nicht nur den einzelnen heutigen Tag, sondern die gegenwärtige Zeit.
- source_word: רַבּוּ
  choice: gibt es viele
  rationale: Das Verb bedeutet wörtlich „zahlreich geworden sein“ beziehungsweise „sich vermehren“. Die Hauptfassung gibt den resultierenden Zustand in natürlichem Deutsch wieder; die Fußnote bewahrt die verbale Nuance.
- source_word: עֲבָדִים
  choice: Knechte
  rationale: In Nabals allgemeiner Bemerkung geht es um Abhängige unter einem Herrn. „Knechte“ bewahrt diese soziale Unterordnung deutlicher als das neutralere „Diener“, ohne zwingend eine genaue Rechtsform festzulegen.
- source_word: הַמִּתְפָּרְצִים
  choice: die sich losreißen
  rationale: Der Hitpael-Partizip von פרץ beschreibt ein kraftvolles Sich-Loslösen. „Sich losreißen“ erhält diese Stärke, ohne ausdrücklich eine organisierte Rebellion zu behaupten.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: jeder von seinem Herrn weg
  rationale: אישׁ ist distributiv („jeder“); מִפְּנֵי bezeichnet hier die Trennung aus der Gegenwart beziehungsweise dem Machtbereich des Herrn. „Weg“ macht diese Richtung im Deutschen idiomatisch deutlich.
