base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: de
  text: Wenn sich auch ein Mann erhebt, um dich zu verfolgen und dir nach dem Leben zu trachten, so soll doch das Leben meines Herrn im Bündel der Lebenden[a] bei Jahwe, deinem Gott, eingebunden sein. Das Leben deiner Feinde aber wird er aus der Tasche einer Schleuder wegschleudern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Bündel des Lebens“. Das hebräische Bild bezeichnet etwas, das zum sicheren Aufbewahren fest eingebunden ist.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bezeichnet ausdrücklich das Schleudern mit einer Schleuder; die „Tasche“ ist deren Teil, in dem das Geschoss liegt.
    reason: lexical_image
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: Wenn sich auch ein Mann erhebt
  rationale: Die Form leitet hier im Zusammenhang von Abigajils Rede einen einräumenden Umstand ein. „Mann“ gibt den grammatisch männlichen Singular und den konkreten Verfolger wieder.
- source_word: לִרְדָפְךָ
  choice: um dich zu verfolgen
  rationale: רדף bezeichnet hier feindliches Verfolgen; der deutsche Infinitivsatz gibt Zweck und Bedrohung natürlich wieder.
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: und dir nach dem Leben zu trachten
  rationale: נֶפֶשׁ meint in diesem Zusammenhang das bedrohte Leben. Die deutsche Wendung macht die tödliche Absicht klar, ohne „Seele“ als spätere anthropologische Festlegung einzutragen.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: das Leben meines Herrn
  rationale: „Leben“ entspricht der kontextuellen Bedeutung von נֶפֶשׁ; „mein Herr“ bewahrt Abigajils respektvolle Anrede an David.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: im Bündel der Lebenden eingebunden
  rationale: Die konkrete Metapher eines sicher verschnürten und verwahrten Gegenstands bleibt erhalten. „Der Lebenden“ spiegelt die substantivierte Pluralform הַחַיִּים.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: bei Jahwe, deinem Gott
  rationale: אֵת drückt hier Nähe beziehungsweise Gemeinschaft aus. „Bei“ klingt im Deutschen natürlich und wahrt die Vorstellung, dass Davids Leben in Gottes Gegenwart sicher verwahrt ist.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: Das Leben deiner Feinde aber
  rationale: Der Singular נֶפֶשׁ wird kollektiv auf die mehreren Feinde bezogen. „Aber“ verdeutlicht den im Hebräischen angelegten scharfen Gegensatz zu Davids bewahrtem Leben.
- source_word: יְקַלְּעֶנָּה
  choice: wird er ... wegschleudern
  rationale: Das Verb קלע bezeichnet ausdrücklich das Schleudern mit einer Schleuder. Das Pronomen „er“ nimmt Jahwe als den aus dem vorigen Satzteil erschließbaren Handelnden auf.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: aus der Mulde der Schleuder
  rationale: כַּף bezeichnet Handfläche beziehungsweise Höhlung und hier die muldenförmige Tasche der Schleuder. Die Formulierung erhält das anschauliche Bild des herausgeschleuderten Geschosses.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Gegensatz zwischen der Bewahrung Davids und der Beseitigung seiner Feinde
  choice: Die Bilder vom eingebundenen Leben und vom Wegschleudern bleiben konkret stehen.
  alternative: Die Bilder als ausdrückliche Lehre vom ewigen Leben deuten oder zu allgemeinem Schutz und Sieg verflachen.
  rationale: Der hebräische Text spricht bildhaft von göttlicher Bewahrung und gewaltsamer Entfernung, entwickelt hier aber keine ausdrückliche Lehre über das Leben nach dem Tod.
- issue: Bedeutung von נֶפֶשׁ
  choice: Jeweils mit „Leben“ wiedergegeben.
  alternative: „Seele“
  rationale: Im Zusammenhang ist die bedrohte beziehungsweise bewahrte Lebensexistenz gemeint; „Seele“ könnte eine im Vers nicht festgelegte Leib-Seele-Unterscheidung nahelegen.
- issue: Unausgesprochenes Subjekt von יְקַלְּעֶנָּה
  choice: „er“ bezieht sich auf Jahwe.
  alternative: Unpersönliche oder passive Wiedergabe.
  rationale: Jahwe ist die nächstliegende Bezugsgröße und wird als der Handelnde verstanden, ohne dass der deutsche Text darüber hinaus eine Erklärung einfügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einräumende Satzführung („Wenn sich auch … so soll doch“) bildet den Gedankengang klar ab. Konkrete Bilder des hebräischen Textes werden bewahrt, während idiomatisches „nach dem Leben trachten“ die tödliche Bedrohung verständlich ausdrückt.
