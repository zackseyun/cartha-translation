  text: וְ/לַ/אֲבִיגַ֨יִל֙ אֵ֣שֶׁת נָבָ֔ל הִגִּ֧יד נַֽעַר אֶחָ֛ד מֵ/הַ/נְּעָרִ֖ים לֵ/אמֹ֑ר הִנֵּ֣ה שָׁלַח֩ דָּוִ֨ד מַלְאָכִ֧ים מֵֽ/הַ/מִּדְבָּ֛ר לְ/בָרֵ֥ךְ אֶת אֲדֹנֵ֖י/נוּ וַ/יָּ֥עַט בָּ/הֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: de
  text: 'Doch einer von den jungen Männern berichtete Abigajil, Nabals Frau: »David hat Boten aus der Wüste geschickt, um unseren Herrn zu grüßen[a]; aber er fuhr sie heftig an[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »um unseren Herrn zu segnen«. Das hebräische Verb kann hier eine ehrerbietige Begrüßung oder einen Segensgruß bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Verb ist sehr bildhaft und kann ein aggressives Losfahren, Anfahren oder Herfallen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: Doch ... Abigajil
  rationale: Das ו führt die Erzählung fort und markiert hier zugleich den Gegensatz zwischen Nabals Abweisung und der nun erfolgenden Mitteilung an Abigajil.
- source_word: הִגִּיד נַעַר אֶחָד מֵהַנְּעָרִים
  choice: einer von den jungen Männern berichtete
  rationale: הִגִּיד bezeichnet ein Mitteilen oder Berichten; נַעַר bleibt als »junger Mann« wiedergegeben, ohne die kontextuell mögliche Dienerrolle in den Text einzutragen.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der formelhafte hebräische Redeeinleiter wird im natürlichen modernen Deutsch typografisch ausgedrückt.
- source_word: הִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: Die aufmerksamkeitslenkende Funktion von הִנֵּה liegt im Deutschen bereits in der unvermittelten, dringlichen Meldung; ein zusätzliches »Sieh« oder »Schau« klänge hier weniger natürlich.
- source_word: מַלְאָכִים מֵהַמִּדְבָּר
  choice: Boten aus der Wüste
  rationale: מַלְאָכִים meint in diesem menschlichen Handlungskontext Boten; מִדְבָּר bezeichnet die unbesiedelte Wüsten- beziehungsweise Wildnisregion.
- source_word: לְבָרֵךְ אֶת אֲדֹנֵינוּ
  choice: um unseren Herrn zu grüßen
  rationale: ברך bedeutet grundsätzlich »segnen«, kann bei einer Begegnung jedoch eine ehrerbietige Begrüßung bezeichnen. »grüßen« gibt hier die kommunikative Funktion wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten. »Herr« bezeichnet im Haushaltskontext den Dienstherrn.
- source_word: וַיָּעַט בָּהֶם
  choice: aber er fuhr sie heftig an
  rationale: Das seltene, bildhafte Verb vermittelt ein aggressives Losfahren oder einen heftigen Ausbruch. Die deutsche Wendung bewahrt diese Dynamik, ohne sie unnötig auf bloße Lautstärke festzulegen.
