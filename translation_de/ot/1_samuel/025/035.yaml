  text: וַ/יִּקַּ֤ח דָּוִד֙ מִ/יָּדָ֔/הּ אֵ֥ת אֲשֶׁר הֵבִ֖יאָה ל֑/וֹ וְ/לָ֣/הּ אָמַ֗ר עֲלִ֤י לְ/שָׁלוֹם֙ לְ/בֵיתֵ֔/ךְ רְאִי֙ שָׁמַ֣עְתִּי בְ/קוֹלֵ֔/ךְ וָ/אֶשָּׂ֖א פָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: de
  text: 'Da nahm David aus ihrer Hand, was sie ihm gebracht hatte, und sagte zu ihr: „Geh in Frieden nach Hause hinauf. Sieh, ich habe auf deine Stimme gehört und dir Gunst erwiesen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich angenommen“; wörtlich: „dein Angesicht erhoben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Gibt die konkrete Grundbedeutung von לקח wieder; ein deutenderes „empfing“ ist im Zusammenhang möglich, aber nicht nötig.
- source_word: מִיָּדָהּ
  choice: aus ihrer Hand
  rationale: Bewahrt das ausdrückliche und anschauliche Bild des hebräischen Textes.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: was sie ihm gebracht hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Abigail die Gaben zuvor zu David gebracht hatte.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: Zieh in Frieden hinauf zu deinem Haus
  rationale: „Hinaufziehen“ wahrt die Richtungsangabe von עלה; „in Frieden“ bezeichnet die zugesicherte friedliche und sichere Rückkehr.
- source_word: רְאִי
  choice: Sieh
  rationale: Entspricht dem aufmerksamkeitslenkenden Imperativ, ohne auf das altertümliche „Siehe“ zurückzugreifen.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: ich habe auf deine Stimme gehört
  rationale: Bewahrt die hebräische Wendung und lässt zugleich erkennen, dass David Abigails Einspruch Gehör geschenkt hat.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: und dir deine Bitte gewährt
  rationale: Die wörtliche Wendung „dein Angesicht erhoben“ bezeichnet hier, dass David Abigail wohlwollend annimmt und ihrem Anliegen stattgibt. Die kontextbezogene Wiedergabe ist im modernen Deutsch klar; die Bildsprache bleibt in der Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung der idiomatischen Wendung וָאֶשָּׂא פָּנָיִךְ
  choice: dir deine Bitte gewährt
  alternative: dir Gunst erwiesen / dich angenommen / dein Angesicht erhoben
  rationale: Die Formulierung bezeichnet in diesem Zusammenhang Davids wohlwollende Annahme Abigails und die Gewährung ihres Anliegens. Die Übersetzung legt keine besondere Lehre in die Wendung hinein, sondern gibt ihre konkrete Funktion in der Erzählung wieder und weist auf die wörtliche Bildsprache hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschaulichen Wendungen „aus ihrer Hand“, „hinauf zu deinem Haus“ und „auf deine Stimme gehört“ bleiben erhalten; die im Deutschen missverständliche Schlusswendung wird sinngemäß wiedergegeben und in einer Fußnote erläutert.
