  to: 'Da nahm David aus ihrer Hand, was sie ihm gebracht hatte, und sagte zu ihr: „Geh in Frieden nach Hause hinauf. Sieh, ich habe auf deine Stimme gehört und dir Gunst erwiesen[a].“'
