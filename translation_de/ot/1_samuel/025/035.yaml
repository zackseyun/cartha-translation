  source_fidelity: Die Wiedergabe trifft den Handlungsablauf und die meisten hebräischen Ausdrücke gut. Die Schlusswendung וָאֶשָּׂא פָּנָיִךְ bedeutet jedoch idiomatisch, dass David Abigail Gunst bzw. wohlwollende Anerkennung erweist. Zwar folgt daraus im Kontext, dass er ihre Bitte erhört, doch „dir deine Bitte gewährt“ übersetzt die Wendung selbst zu eng und lässt die koordinierte Aussage über seine Haltung ihr gegenüber entfallen.
  naturalness: „Geh in Frieden nach Hause hinauf“ ist modernes, verständliches Standarddeutsch und bewahrt die Richtungsangabe. „Ich habe auf deine Stimme gehört“ ist als bewusst quellennahes, dennoch natürliches Deutsch möglich. „Dir Gunst erwiesen“ hat einen leicht gehobenen, zur direkten Rede der Erzählung passenden Registerton.
  terminology: „Gunst erwiesen“ gibt die hebräische Gesichts-/Gunstidiomatik angemessener wieder als die ausschließlich kontextuelle Paraphrase „deine Bitte gewährt“. Die Fußnote dokumentiert sowohl die wörtliche Bildsprache als auch sinnnahe deutsche Alternativen.
