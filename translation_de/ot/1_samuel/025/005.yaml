  text: וַ/יִּשְׁלַ֥ח דָּוִ֖ד עֲשָׂרָ֣ה נְעָרִ֑ים וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/נְּעָרִ֗ים עֲל֤וּ כַרְמֶ֨לָ/ה֙ וּ/בָאתֶ֣ם אֶל נָבָ֔ל וּ/שְׁאֶלְתֶּם ל֥/וֹ בִ/שְׁמִ֖/י לְ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: de
  text: 'Da sandte David zehn junge Männer aus und sagte zu ihnen: »Geht hinauf nach Karmel, geht zu Nabal und erkundigt euch in meinem Namen nach seinem Wohlergehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte … aus
  rationale: Die übliche erzählende Bedeutung von שׁלח wird in natürlichem Deutsch mit »aussenden« wiedergegeben.
- source_word: עֲשָׂרָה נְעָרִים
  choice: zehn junge Männer
  rationale: נְעָרִים kann junge Männer oder Diener bezeichnen. »Junge Männer« bewahrt die primäre Bezeichnung, ohne ihren sozialen Status über den Text hinaus festzulegen.
- source_word: עֲלוּ כַרְמֶלָה
  choice: Geht hinauf nach Karmel
  rationale: עלה bezeichnet hier die Bewegung hinauf beziehungsweise die übliche Reiserichtung; die Richtungsendung an Karmel wird mit »nach« ausgedrückt.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: geht zu Nabal
  rationale: בוא bedeutet wörtlich »kommen«, doch in Davids Auftrag an die Boten entspricht »geht zu« der natürlichen deutschen Perspektive.
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: erkundigt euch … nach seinem Wohlergehen
  rationale: שׁאל mit לְשָׁלוֹם bezeichnet idiomatisch die höfliche Erkundigung nach dem Ergehen beziehungsweise Wohlergehen einer Person.
- source_word: בִשְׁמִי
  choice: in meinem Namen
  rationale: Die wörtliche und im Deutschen geläufige Wendung bewahrt sowohl Davids Autorisierung als auch die persönliche Übermittlung seines Grußes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »David« im Hebräischen wurde im zweiten Satzteil durch »ihnen« natürlich aufgelöst; der Bezug bleibt eindeutig. Die Grußformel wurde idiomatisch als Erkundigung nach dem Wohlergehen wiedergegeben.
