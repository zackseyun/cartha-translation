  source_fidelity: 'Der Text gibt die hebräische Abfolge und den Sinn zuverlässig wieder: David sendet zehn junge Männer, befiehlt ihnen, nach Karmel zu gehen, Nabal aufzusuchen und sich in seinem Namen nach dessen Wohlergehen zu erkundigen. Die Grußformel וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם wird idiomatisch und sachgerecht wiedergegeben, ohne sie auf ein bloßes abstraktes „Frieden“ zu verengen.'
  naturalness: „Da sandte David zehn junge Männer aus und sagte zu ihnen“ sowie die anschließende direkte Rede sind flüssiges modernes Standarddeutsch mit angemessen würdigem Erzählregister. Die Auflösung der hebräischen Wiederholung von „David“ durch „ihnen“ ist eindeutig und natürlich.
  terminology: „Junge Männer“ wahrt die Grundbedeutung von נְעָרִים, ohne ungesichert „Diener“ einzutragen. „Hinauf nach Karmel“, „zu Nabal“ und „in meinem Namen“ sind treffend. „Nach seinem Wohlergehen“ entspricht dem hier gemeinten Erfragen des Wohlergehens und steht im Einklang mit der im englischen Audit dokumentierten lexikalischen Entscheidung.
