  text: וְ/הָיָ֞ה הִ֣יא רֹכֶ֣בֶת עַֽל הַ/חֲמ֗וֹר וְ/יֹרֶ֨דֶת֙ בְּ/סֵ֣תֶר הָ/הָ֔ר וְ/הִנֵּ֤ה דָוִד֙ וַ/אֲנָשָׁ֔י/ו יֹרְדִ֖ים לִ/קְרָאתָ֑/הּ וַ/תִּפְגֹּ֖שׁ אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: de
  text: Als sie auf dem Esel ritt und im Schutz des Berges hinabstieg[a], da kamen David und seine Männer ihr bergab entgegen, und sie traf auf sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der verborgenen Seite des Berges“. Der hebräische Ausdruck bezeichnet einen verborgenen oder geschützten Bereich des Berges.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: Als sie
  rationale: Die Konstruktion mit היה führt die begleitende Situation ein. Der temporale Anschluss „Als sie“ gibt ihre erzählerische Funktion in natürlichem Deutsch wieder.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: auf dem Esel ritt
  rationale: רכב bezeichnet das Reiten, חמור den Esel; die schlichte moderne Formulierung entspricht dem fortdauernden Geschehen des Partizips.
- source_word: וְיֹרֶדֶת בְּסֵתֶר הָהָר
  choice: im Schutz des Berges hinabstieg
  rationale: ירד bedeutet „hinabgehen“, während סתר einen verborgenen, geschützten oder abgeschirmten Ort bezeichnet. „Im Schutz des Berges“ bewahrt den räumlichen Gedanken der Deckung, ohne die genaue Geländelage festzulegen.
- source_word: וְהִנֵּה
  choice: da
  rationale: הנה lenkt lebhaft auf die nun eintretende Begegnung. Das erzählerische „da“ vermittelt diesen Umschlag in idiomatischem, würdigem Deutsch.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: kamen ihr bergab entgegen
  rationale: Das Partizip von ירד beschreibt die abwärts gerichtete Bewegung; לקראת bezeichnet die Bewegung auf eine Person zu beziehungsweise ihr entgegen. Die Formulierung vermeidet eine unnötig starke Aussage über eine beabsichtigte Verabredung.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: und sie traf auf sie
  rationale: פגש bezeichnet das Zusammentreffen oder Begegnen. „Auf sie treffen“ erhält die ausdrückliche abschließende Feststellung des hebräischen Textes.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Erzählsprache mit würdigem Ton. Das doppelte Zusammentreffen („entgegenkamen“ / „traf auf sie“) wurde trotz leichter Wiederholung beibehalten, weil es die Abfolge des hebräischen Textes abbildet.
