- from: 'Dann wird dir dies nicht zum Anlass für Gewissensnot und meinem Herrn nicht zum Stolperstein des Herzens werden: dass du ohne Grund Blut vergossen oder mein Herr sich selbst Recht verschafft hätte.[a] Und wenn Jahwe meinem Herrn Gutes getan hat, dann denk an deine Magd.[b]'
  to: 'Dann wird dies dir weder Anlass zur Gewissensnot noch ein Stolperstein für das Herz meines Herrn sein: dass du ohne Grund Blut vergossen hast und mein Herr sich selbst Recht verschafft hat.[a] Und wenn Jahwe meinem Herrn Gutes getan hat, dann denk an deine Magd.[b]'
  rationale: Die Revision behebt den grammatischen Bruch, gibt die beiden parallelen hebräischen Infinitivkonstruktionen mit „und“ wieder und verbessert die Lesbarkeit der bildhaften Wendung. Die Fußnote bewahrt die lexikalische Spannweite von לְהוֹשִׁיעַ ... לוֹ, ohne die kontextuelle Deutung dogmatisch festzulegen.
