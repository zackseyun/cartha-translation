base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: de
  text: 'Dann wird dies dir weder Anlass zur Gewissensnot noch ein Stolperstein für das Herz meines Herrn sein: dass du ohne Grund Blut vergossen hast und mein Herr sich selbst Recht verschafft hat.[a] Und wenn Jahwe meinem Herrn Gutes getan hat, dann denk an deine Magd.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „dass mein Herr sich selbst Rettung verschafft hat“. Im Zusammenhang kann dies eigenmächtige, gewaltsame Selbsthilfe meinen.'
    reason: lexical_alternative
  - marker: b
    text: „Magd“ ist Abigajils demütige Selbstbezeichnung.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: Anlass für Gewissensnot
  rationale: Das seltene Wort bezeichnet wohl einen Anstoß oder etwas, das später schmerzliche Reue hervorruft. „Gewissensnot“ gibt im Zusammenhang die erwartete innere Belastung wieder, ohne die Unsicherheit des Ausdrucks völlig einzuebnen.
- source_word: מִכְשׁוֹל לֵב
  choice: Stolperstein des Herzens
  rationale: Die konkrete hebräische Metapher wird bewahrt. Gemeint ist ein inneres moralisches Hindernis beziehungsweise ein belastetes Gewissen.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: mein Herr
  rationale: Dies entspricht Abigajils ehrerbietiger Anrede an David und bezeichnet hier keinen göttlichen Titel.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: ohne Grund Blut vergossen
  rationale: חִנָּם bezeichnet hier ungerechtfertigtes, grundloses Blutvergießen.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: sich selbst Recht verschafft
  rationale: Das Verb bedeutet gewöhnlich „retten“. In diesem Zusammenhang bezeichnet die reflexive Wendung jedoch Davids eigenmächtiges gewaltsames Vorgehen zur Durchsetzung seines Rechts; die Formulierung vermeidet die stärkere Festlegung auf „rächen“.
- source_word: וְהֵיטִב יְהוָה
  choice: wenn Jahwe ... Gutes getan hat
  rationale: Die Verbfolge ist hier zukunftsbezogen und lässt sich natürlich als temporaler Nebensatz wiedergeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֲמָתֶךָ
  choice: deine Magd
  rationale: Das ausdrücklich feminine Substantiv und Abigajils demütige Selbstbezeichnung werden im Deutschen direkt bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes; „Jahwe“ bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְהוֹשִׁיעַ ... לוֹ
  choice: sich selbst Recht verschaffen
  alternative: sich selbst retten / sich rächen
  rationale: Die ungewöhnliche reflexive Wendung steht im Kontext eigenmächtiger Vergeltung. Die gewählte Formulierung erhält die Spannung zwischen der Grundbedeutung „retten“ und der kontextuellen Bedeutung gewaltsamer Selbsthilfe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die seltene Wendung לְפוּקָה und das Bild vom „Stolperstein des Herzens“ werden mit einer verständlichen Deutung beziehungsweise in bildnaher Form wiedergegeben. Die ehrerbietige Anrede „mein Herr“ bleibt erhalten; „Jahwe“ bezeichnet den Gottesnamen.
