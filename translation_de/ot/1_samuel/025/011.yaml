  text: וְ/לָקַחְתִּ֤י אֶת לַחְמִ/י֙ וְ/אֶת מֵימַ֔/י וְ/אֵת֙ טִבְחָתִ֔/י אֲשֶׁ֥ר טָבַ֖חְתִּי לְ/גֹֽזְזָ֑/י וְ/נָֽתַתִּי֙ לַֽ/אֲנָשִׁ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתִּי אֵ֥י מִ/זֶּ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: de
  text: Sollte ich[a] etwa mein Brot, mein Wasser und das Fleisch nehmen, das ich für meine Schafscherer[b] geschlachtet habe, und es Männern geben, von denen ich nicht weiß, woher sie kommen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Und ich werde … nehmen und … geben“; das Hebräische verwendet in dieser rhetorischen Frage Perfektformen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die Arbeiter, die seine Schafe schoren.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי ... וְנָתַתִּי
  choice: Sollte ich ... nehmen und ... geben
  rationale: Die mit וְ verbundenen Perfektformen stehen hier im Rahmen einer entrüsteten rhetorischen Frage. Die deutsche Konstruktion mit „Sollte ich etwa“ gibt diese Funktion natürlich wieder, ohne die formale Besonderheit des Hebräischen zu verschweigen.
- source_word: לַחְמִי
  choice: mein Brot
  rationale: „Brot“ bewahrt den konkreten Ausdruck und die wiederholte Besitzbetonung in Nabals Aufzählung.
- source_word: מֵימַי
  choice: mein Wasser
  rationale: Die wörtliche Wiedergabe passt zur konkreten Liste der Vorräte und erhält das Possessivpronomen.
- source_word: טִבְחָתִי אֲשֶׁר טָבַחְתִּי
  choice: das Fleisch, das ich ... geschlachtet habe
  rationale: „Fleisch“ gibt das zum Verzehr Geschlachtete natürlich wieder; „geschlachtet habe“ bewahrt zugleich die Wiederaufnahme derselben hebräischen Wortwurzel.
- source_word: לְגֹזְזָי
  choice: für meine Schafscherer
  rationale: Das substantivierte Partizip bezeichnet die Scherer; „Schafscherer“ macht den im Erzählzusammenhang eindeutigen Bezug für heutige Leser unmittelbar verständlich.
- source_word: לַאֲנָשִׁים
  choice: Männern
  rationale: Die maskuline Pluralbezeichnung wird direkt wiedergegeben und entspricht Nabals abweisender Bezugnahme auf Davids Leute.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי אֵי מִזֶּה הֵמָּה
  choice: von denen ich nicht weiß, woher sie kommen
  rationale: Diese idiomatische deutsche Formulierung bewahrt sowohl Nabals behauptete Unkenntnis als auch die Frage nach der Herkunft der Männer.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Etwa“ macht die entrüstete rhetorische Frage natürlich hörbar. Die konkrete Aufzählung und die auffällige Häufung von „mein“ bleiben erhalten.
