  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֖י כַּ/עֲשֶׂ֣רֶת הַ/יָּמִ֑ים וַ/יִּגֹּ֧ף יְהוָ֛ה אֶת נָבָ֖ל וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: de
  text: Und etwa zehn Tage später[a] schlug Jahwe Nabal, und er starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach etwa zehn Tagen«. Der hebräische Ausdruck bezeichnet einen ungefähren Zeitraum von zehn Tagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und ... später
  rationale: Die Form führt das nächste Ereignis in der Erzählfolge ein. Die deutsche Wendung verbindet den Satz natürlich mit dem vorherigen Geschehen, ohne das schwerfällige »Und es geschah«.
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: etwa zehn Tage später
  rationale: Das Präfix כ־ kennzeichnet die Zeitangabe als ungefähr. »Etwa zehn Tage später« gibt sowohl die Annäherung als auch den zeitlichen Fortgang idiomatisch wieder.
- source_word: וַיִּגֹּף
  choice: schlug
  rationale: נגף bezeichnet hier ein von Gott ausgehendes Schlagen. »Schlug« bewahrt die Direktheit des Hebräischen, ohne die Art des Schlages näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת נָבָל
  choice: Nabal
  rationale: Die direkte Objektmarkierung אֶת bleibt unübersetzt; der Personenname wird als »Nabal« wiedergegeben.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: Die schlichte Erzählfolge wird direkt wiedergegeben. Dadurch wird der Zusammenhang mit dem göttlichen Schlagen festgehalten, ohne beide Verben zur stärker deutenden Formulierung »schlug ihn tot« zusammenzuziehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Grad der ausgedrückten Kausalität bei Gottes Gericht
  choice: Jahwe schlug Nabal, und er starb
  alternative: Jahwe schlug Nabal tot
  rationale: Im Hebräischen stehen zwei aufeinanderfolgende Verben. Die Übersetzung bewahrt diese Folge und die klare Zuschreibung des Geschehens an Gott, ohne sie zu einer stärker interpretierenden Einzelformulierung zu verdichten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählweise des Hebräischen und die nicht näher erklärte Art des göttlichen Schlages bleiben erhalten.
