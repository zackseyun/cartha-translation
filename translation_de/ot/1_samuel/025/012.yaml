  text: וַ/יַּהַפְכ֥וּ נַעֲרֵֽי דָוִ֖ד לְ/דַרְכָּ֑/ם וַ/יָּשֻׁ֨בוּ֙ וַ/יָּבֹ֔אוּ וַ/יַּגִּ֣דוּ ל֔/וֹ כְּ/כֹ֖ל הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/012.yaml
  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: de
  text: Da wandten Davids junge Männer sich um und machten sich auf den Rückweg. Sie kehrten zurück, kamen zu David und berichteten ihm alle diese Worte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle diese Dinge“. Das hebräische Wort kann sowohl gesprochene Worte als auch Dinge oder Angelegenheiten bezeichnen; hier sind Nabals zuvor geäußerte Worte gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: kehrten … um
  rationale: הפך bezeichnet hier im Zusammenhang einer Reise die Umkehr der Bewegungsrichtung. „umkehren“ ist im Deutschen idiomatisch und wahrt den erzählerischen Vorgang.
- source_word: נַעֲרֵי דָוִד
  choice: Davids junge Männer
  rationale: נַעַר kann einen jungen Mann, Diener oder Gefolgsmann bezeichnen. „junge Männer“ bewahrt den lexikalischen Grundton, ohne ihren Status enger festzulegen.
- source_word: לְדַרְכָּם
  choice: auf ihrem Weg
  rationale: Die Präpositionalverbindung bezeichnet den Weg, auf den sie bei ihrer Umkehr zurückkehrten. „auf ihrem Weg“ ist natürliches Deutsch.
- source_word: וַיָּשֻׁבוּ
  choice: Sie gingen zurück
  rationale: Die ausdrückliche Rückkehr wird trotz der vorausgehenden Umkehr beibehalten, um die hebräische Erzählfolge nicht unnötig zu verkürzen.
- source_word: וַיָּבֹאוּ
  choice: kamen zu David
  rationale: Das Ziel ist durch das anschließende לוֹ kontextuell David. Die Ergänzung „zu David“ macht den deutschen Satz verständlich, ohne den Sinn zu verändern.
- source_word: וַיַּגִּדוּ לוֹ
  choice: berichteten ihm
  rationale: נגד bedeutet hier, eine empfangene Antwort mitzuteilen. „berichteten ihm“ passt zum Auftrag der Boten und klingt in modernem Deutsch natürlich.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: דְּבָרִים kann sowohl „Worte“ als auch „Dinge/Angelegenheiten“ bedeuten. Da hier Nabals mündliche Antwort überbracht wird, ist „Worte“ im Haupttext vorzuziehen; die echte lexikalische Alternative bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Abfolge mehrerer Bewegungsverben bleibt erkennbar, wird aber durch Satzteilung und die kontextuell klare Ergänzung „zu David“ natürlich lesbar gemacht.
