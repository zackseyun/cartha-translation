source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: de
  text: 'Und nun, mein Herr: So wahr Jahwe lebt und so wahr du selbst lebst: Jahwe hat dich davor bewahrt, Blutschuld auf dich zu laden und dir selbst mit eigener Hand zu helfen.[a] Nun sollen deine Feinde und die, die meinem Herrn Böses wollen, wie Nabal sein.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang auch: „und dir selbst mit eigener Hand Rache zu verschaffen“.'
    reason: lexical_alternative
  - marker: b
    text: „Wie Nabal“ bezieht sich wahrscheinlich auf den Mann namens Nabal; zugleich klingt in seinem Namen das hebräische Wort für „Tor“ an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun / Nun
  rationale: 'Die Wendung ist im WLC ausdrücklich vorhanden und strukturiert Abigajils Aussage: zunächst die feierliche Feststellung, dann der Wunsch über Davids Feinde.'
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Respektvolle Anrede an David; im Deutschen würdevoll und im Zusammenhang klar nicht als Gottesbezeichnung gemeint.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: So wahr Jahwe lebt und so wahr du selbst lebst
  rationale: Gibt die Schwurformel natürlich wieder. „Du selbst“ vermittelt den idiomatischen Personenbezug von נֶפֶשׁ besser als das im heutigen Deutsch missverständliche „deine Seele“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Bewahrt den in der hebräischen Vorlage stehenden persönlichen Gottesnamen.
- source_word: מְנָעֲךָ יְהוָה מִבּוֹא בְדָמִים
  choice: Jahwe hat dich davor bewahrt, Blutschuld auf dich zu laden
  rationale: Der Ausdruck bezeichnet im Kontext nicht nur Blutvergießen, sondern die dadurch entstehende Schuld. Die deutsche Formulierung macht diesen moralisch-rechtlichen Sinn verständlich.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: und dir mit eigener Hand selbst zu helfen
  rationale: Hält die Grundbedeutung von ישׁע („retten, helfen“) fest und bewahrt zugleich die schwierige Bildsprache. Die kontextuell naheliegende Deutung als eigenhändige Rache wird in der Fußnote genannt.
- source_word: יִהְיוּ כְנָבָל
  choice: sollen ... wie Nabal werden
  rationale: Nabal ist hier primär der Name von Abigajils Mann; zugleich klingt im Hebräischen die Bedeutung „Tor“ an.
- source_word: אֹיְבֶיךָ וְהַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: deine Feinde und alle, die meinem Herrn Böses wollen
  rationale: Natürliches modernes Deutsch für die feste Wendung des Hebräischen, ohne den Gedanken beabsichtigten Schadens abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den persönlichen Namen der hebräischen Vorlage, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des verhinderten Handelns Davids
  choice: Jahwe bewahrt David vor Blutschuld und davor, sich mit eigener Hand selbst zu helfen.
  alternative: Jahwe bewahrt David davor, sich mit eigener Hand zu rächen.
  rationale: Der Haupttext bleibt näher am Verb ישׁע, während die Fußnote die im Erzählzusammenhang plausible Bedeutung „sich rächen“ offenlegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die feierliche Schwurformel bleibt erkennbar; schwer verständliche Hebraismen werden behutsam idiomatisch wiedergegeben. Alle Fußnotenmarker stehen im Haupttext.
