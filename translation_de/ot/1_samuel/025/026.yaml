  naturalness: Die Satzzeichen und die Stellung von „selbst“ werden geglättet. „Dir mit eigener Hand selbst zu helfen“ ist im Deutschen unnötig doppelt und weniger flüssig. „Die, die“ entspricht dem hebräischen Partizipialausdruck genauer als das hinzugesetzte „alle, die“.
  terminology: „Jahwe“, „mein Herr“, „Blutschuld“ und „Nabal“ sind angemessen. Die Namens- und Wortspielanmerkung ist sachlich und wahrt die Unsicherheit der Deutung.
