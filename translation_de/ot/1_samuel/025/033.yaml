  text: וּ/בָר֥וּךְ טַעְמֵ֖/ךְ וּ/בְרוּכָ֣ה אָ֑תְּ אֲשֶׁ֨ר כְּלִתִ֜/נִי הַ/יּ֤וֹם הַ/זֶּה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הֹשֵׁ֥עַ יָדִ֖/י לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: de
  text: Und gesegnet sei deine Besonnenheit[a], und gesegnet seist du, die du mich heute davor bewahrt hast, Blut zu vergießen[b] und mir selbst durch meine eigene Hand Hilfe zu verschaffen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »deine Urteilskraft« oder »deine Einsicht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »in Bluttaten zu kommen«; die Wendung kann auch bedeuten, Blutschuld auf sich zu laden.'
    reason: lexical_alternative
  - marker: c
    text: 'Das kann hier auch heißen: »mich eigenhändig zu rächen« oder »mir mit eigener Hand Recht zu verschaffen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Und gepriesen sei
  rationale: Die prädikative Segensformel wird als würdiger Ausruf wiedergegeben; das einleitende וּ bleibt als „Und“ erhalten.
- source_word: טַעְמֵךְ
  choice: deine Besonnenheit
  rationale: טַעַם bezeichnet hier Abigajils verständiges, umsichtiges Urteil, durch das sie David von Gewalt abhält. „Besonnenheit“ ist im Deutschen natürlich und umfasst Urteilskraft wie Selbstbeherrschung.
- source_word: וּבְרוּכָה אָתְּ
  choice: und gepriesen seist du
  rationale: Die feminine direkte Anrede an Abigajil und die parallele Segensformel bleiben erhalten.
- source_word: אֲשֶׁר כְּלִתִנִי
  choice: die du mich … davor bewahrt hast
  rationale: Das Relativpronomen bezieht sich auf Abigajil; כלה bezeichnet hier das Zurückhalten beziehungsweise Verhindern.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Das betonte hebräische Zeitwortgefüge wird in natürlichem modernem Deutsch knapp mit „heute“ wiedergegeben.
- source_word: מִבּוֹא בְדָמִים
  choice: Blut zu vergießen
  rationale: Wörtlich steht „in Bluttaten/Blut kommen“. Im Zusammenhang bezeichnet die Wendung Davids beabsichtigtes gewaltsames Töten; die mögliche Nuance der Blutschuld wird in der Fußnote bewahrt.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: und mir mit eigener Hand selbst zu helfen
  rationale: Die Wiedergabe hält an der Grundbedeutung von ישׁע („helfen/retten“) und am Bild der eigenen Hand fest. Zugleich lässt die deutsche Wendung erkennen, dass David sein Recht eigenmächtig durchsetzen wollte, ohne die Aussage vollständig auf „rächen“ festzulegen.
theological_decisions:
- issue: דָּמִים zwischen Blutvergießen und Blutschuld
  choice: Blut zu vergießen
  alternative: Blutschuld auf mich zu laden
  rationale: Der unmittelbare Erzählzusammenhang stellt die geplante Tötung in den Vordergrund. Der hebräische Plural kann zugleich die daraus entstehende Blutschuld bezeichnen; diese Spannung wird durch eine Fußnote offengehalten.
- issue: הֹשֵׁעַ יָדִי לִי als Selbsthilfe oder Rache
  choice: mir mit eigener Hand selbst zu helfen
  alternative: mich mit eigener Hand zu rächen / mir mit eigener Hand Recht zu verschaffen
  rationale: Die Hauptfassung bewahrt die Rettungs- beziehungsweise Hilfssemantik von ישׁע und die eigenhändige Handlung. Die kontextuell naheliegende Deutung als Rache wird nicht stillschweigend zur einzigen Lesart gemacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die parallele Segensformel und die feminine Anrede bleiben sichtbar; schwer verständliche Hebraismen werden natürlich wiedergegeben, während echte Bedeutungsalternativen in den Fußnoten erhalten bleiben.
