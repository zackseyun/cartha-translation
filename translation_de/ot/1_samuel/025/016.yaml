  text: חוֹמָה֙ הָי֣וּ עָלֵ֔י/נוּ גַּם לַ֖יְלָה גַּם יוֹמָ֑ם כָּל יְמֵ֛י הֱיוֹתֵ֥/נוּ עִמָּ֖/ם רֹעִ֥ים הַ/צֹּֽאן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/016.yaml
  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: de
  text: Sie waren Tag und Nacht eine Mauer um uns[a], all die Tage, an denen wir bei ihnen waren und die Herde[b] hüteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „eine Mauer über uns“. Gemeint ist ihre schützende Gegenwart.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine Kleinviehherde und kann Schafe und Ziegen umfassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: wie eine Mauer
  rationale: Das konkrete Bild der Mauer bleibt erhalten; im Zusammenhang bezeichnet es den Schutz, den Davids Männer gewährten.
- source_word: הָיוּ
  choice: sie waren
  rationale: Das Qal-Perfekt von היה dient hier als kopulative Vergangenheitsform und beschreibt die fortdauernde Rolle der Männer.
- source_word: עָלֵינוּ
  choice: um uns
  rationale: על bedeutet grundsätzlich „auf/über“; zusammen mit „Mauer“ vermittelt „um uns“ im Deutschen natürlich den gemeinten schützenden Beistand.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: Tag und Nacht
  rationale: Die korrelative Konstruktion גם ... גם betont den ununterbrochenen Schutz während des gesamten Tages- und Nachtverlaufs.
- source_word: כָּל יְמֵי
  choice: die ganze Zeit
  rationale: Die idiomatische deutsche Zeitangabe gibt den gesamten bezeichneten Zeitraum wieder, ohne den Sinn auszuweiten.
- source_word: הֱיוֹתֵנוּ עִמָּם
  choice: in der wir bei ihnen waren
  rationale: Der Infinitivus constructus mit Suffix bezeichnet den zeitlichen Rahmen; ein deutscher Relativsatz gibt ihn klar und natürlich wieder.
- source_word: רֹעִים
  choice: hüteten
  rationale: Das Partizip von רעה bezeichnet das Hüten beziehungsweise Weiden der Tiere; „hüteten“ ist im Kontext präzise und geläufig.
- source_word: הַצֹּאן
  choice: die Herde
  rationale: צאן ist eine Sammelbezeichnung für Kleinvieh und kann Schafe wie Ziegen umfassen; „Herde“ bewahrt diese Offenheit besser als „Schafe“.
