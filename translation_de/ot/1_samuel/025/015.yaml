  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: de
  text: Die Männer aber waren sehr gut zu uns. Wir wurden nicht schlecht behandelt[a], und uns kam nichts abhanden[b], während der ganzen Zeit, in der wir mit ihnen draußen auf dem Feld umherzogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Wir wurden nicht beschämt«; auch: »Wir wurden nicht beleidigt.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Nichts ging verloren.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Die Männer aber
  rationale: אֲנָשִׁים bezeichnet »Männer«. Das nachgestellte »aber« gibt den im Zusammenhang erkennbaren Gegensatz wieder, ohne das hebräische וְ überzubetonen.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: waren sehr gut zu uns
  rationale: טוֹב mit לְ beschreibt hier ein ausgesprochen wohlwollendes Verhalten gegenüber den Hirten; die schlichte Formulierung bewahrt die Ausdrucksweise des Hebräischen.
- source_word: וְלֹא הָכְלַמְנוּ
  choice: Wir wurden nicht schlecht behandelt[a]
  rationale: Die passive Verbform von כלם bedeutet grundsätzlich, beschämt, entehrt oder beleidigt zu werden. Im Zusammenhang fasst »schlecht behandelt« die praktische Wirkung natürlich zusammen; die Fußnote bewahrt die engere lexikalische Bedeutung.
- source_word: וְלֹא פָקַדְנוּ מְאוּמָה
  choice: und uns kam nichts abhanden[b]
  rationale: Die verneinte Wendung mit פקד und מְאוּמָה besagt hier, dass keinerlei Verlust festgestellt wurde. »Uns kam nichts abhanden« ist im Deutschen natürlich und passt zum Besitz der Hirten.
- source_word: כָּל יְמֵי הִתְהַלַּכְנוּ אִתָּם
  choice: während der ganzen Zeit, in der wir mit ihnen … umherzogen
  rationale: כָּל יְמֵי bezeichnet die gesamte Dauer; der Hitpael von הלך drückt fortgesetztes Umherziehen beziehungsweise regelmäßige Gemeinschaft aus.
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: draußen auf dem Feld
  rationale: Die temporale Wendung verortet das gemeinsame Umherziehen im offenen Weidegebiet. »Draußen auf dem Feld« ist verständlich und bildet den Gegensatz zum Siedlungsbereich ab.
