  text: וַ/יֹּאמֶר֩ דָּוִ֨ד לַ/אֲנָשָׁ֜י/ו חִגְר֣וּ אִ֣ישׁ אֶת חַרְבּ֗/וֹ וַֽ/יַּחְגְּרוּ֙ אִ֣ישׁ אֶת חַרְבּ֔/וֹ וַ/יַּחְגֹּ֥ר גַּם דָּוִ֖ד אֶת חַרְבּ֑/וֹ וַֽ/יַּעֲל֣וּ אַחֲרֵ֣י דָוִ֗ד כְּ/אַרְבַּ֤ע מֵאוֹת֙ אִ֔ישׁ וּ/מָאתַ֖יִם יָשְׁב֥וּ עַל הַ/כֵּלִֽים׀־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: de
  text: 'Da sagte David zu seinen Männern: »Jeder schnalle sich sein Schwert um!« Da schnallte sich jeder sein Schwert um, und auch David schnallte sich sein Schwert um. Etwa vierhundert Mann zogen hinter David hinauf; zweihundert aber blieben bei der Ausrüstung[a] zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beim Gepäck«; möglicherweise auch: »bei den Vorräten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: sich … umschnallen
  rationale: חגר bezeichnet hier das Befestigen eines Schwertes am Körper. »Sich umschnallen« ist im modernen Deutschen konkret und natürlich, ohne die altertümliche Wirkung von »umgürten«.
- source_word: לַאֲנָשָׁיו
  choice: zu seinen Männern
  rationale: Im Zusammenhang sind Davids männliche Gefolgsleute und Kämpfer gemeint; »Männer« gibt dies präziser wieder als das allgemeinere »Leute«.
- source_word: אִישׁ ... אֶת־חַרְבּוֹ
  choice: jeder … sein Schwert
  rationale: 'Die distributive Konstruktion wird bewahrt: Jeder einzelne Mann soll sein eigenes Schwert anlegen.'
- source_word: חַרְבּוֹ
  choice: sein Schwert
  rationale: חֶרֶב bezeichnet hier ausdrücklich ein Schwert, nicht nur allgemein eine Waffe.
- source_word: גַּם
  choice: auch
  rationale: Das Adverb hebt hervor, dass David selbst sich ebenso bewaffnete.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: zogen hinter David hinauf
  rationale: Die Formulierung bewahrt sowohl die Aufwärtsbewegung von עלה als auch das Folgen hinter David, ohne den Ausdruck unnötig militärisch auszudeuten.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: etwa vierhundert Mann
  rationale: Das Präfix כ־ kennzeichnet hier eine ungefähre Zahl; »etwa« gibt diese Nuance wieder.
- source_word: יָשְׁבוּ
  choice: blieben … zurück
  rationale: ישב bedeutet wörtlich unter anderem »sitzen«, bezeichnet hier aber idiomatisch das Zurückbleiben eines Teils der Männer.
- source_word: עַל־הַכֵּלִים
  choice: bei der Ausrüstung
  rationale: כֵּלִים ist ein weiter Begriff für Geräte, Gegenstände oder Gepäck. »Ausrüstung« bewahrt diese Breite; die im Kontext ebenfalls möglichen Bedeutungen werden in der Fußnote genannt.
