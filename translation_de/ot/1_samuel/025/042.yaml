  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: de
  text: Abigajil machte sich schnell auf und ritt auf dem Esel; fünf ihrer jungen Dienerinnen gingen hinter ihr her. Sie folgte den Boten Davids und wurde seine Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: machte sich schnell auf
  rationale: Gibt sowohl die Eile als auch das Aufstehen beziehungsweise Aufbrechen in natürlichem modernem Deutsch wieder.
- source_word: נַעֲרֹתֶיהָ
  choice: ihre jungen Dienerinnen
  rationale: נַעֲרָה bezeichnet hier im Gefolge Abigajils am ehesten junge weibliche Bedienstete, nicht lediglich junge Frauen ohne Funktionsangabe.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: gingen hinter ihr her
  rationale: Die Wendung bedeutet wörtlich, dass sie zu ihren Füßen beziehungsweise in ihrem Gefolge gingen; die gewählte Formulierung bewahrt das räumliche Bild natürlich.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: wurde seine Frau
  rationale: Entspricht der üblichen hebräischen Ausdrucksweise für das Eingehen einer Ehe, ohne zusätzliche Einzelheiten einzutragen.
