  yaml_path: translation/ot/1_samuel/025/027.yaml
  text: And now, let this gift that your servant has brought to my lord be given to the young men who follow my lord.
translation:
  language: de
  text: Und nun soll dieses Geschenk, das deine Dienerin meinem Herrn gebracht hat, den jungen Männern gegeben werden, die meinem Herrn auf Schritt und Tritt folgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die zu Füßen meines Herrn umhergehen«.'
    reason: Die Fuß-Metapher des Hebräischen ist in der idiomatischen Übersetzung nur sinngemäß erkennbar und wird deshalb dokumentiert.
lexical_decisions:
- source_word: הַבְּרָכָה
  choice: Geschenk
  rationale: Wörtlich bezeichnet das Wort einen »Segen«; im Kontext meint es jedoch die mitgebrachte Gabe, mit der Abigajil David besänftigen und seine Männer versorgen will.
- source_word: שִׁפְחָתְךָ
  choice: deine Dienerin
  rationale: Gibt Abigajils demütige Selbstbezeichnung natürlich und zugleich würdevoll wieder.
- source_word: הַמִּתְהַלְּכִים בְּרַגְלֵי אֲדֹנִי
  choice: die meinem Herrn auf Schritt und Tritt folgen
  rationale: Bewahrt das anschauliche Bild des Gehens bei jemandes Füßen und vermittelt idiomatisch, dass die Männer David begleiten.
theological_decisions: []
translation_notes:
  register: Moderne, höfliche und würdige Rede. Die wiederholte Anrede »mein Herr« und die Selbstbezeichnung »deine Dienerin« erhalten Abigajils bewusst demütigen Ton.
