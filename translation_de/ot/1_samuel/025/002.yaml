base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: de
  text: In Maon lebte ein Mann, dessen Besitz in Karmel lag.[a] Der Mann war sehr reich[b] und besaß dreitausend Schafe und tausend Ziegen. Er war gerade dabei, seine Schafe in Karmel zu scheren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dessen Arbeit/Betrieb in Karmel war«. Das hebräische Wort kann die Arbeit, die Geschäfte oder den Besitz eines Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »sehr groß«, das heißt gesellschaftlich oder wirtschaftlich bedeutend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּמָעוֹן
  choice: In Maon lebte ein Mann
  rationale: Natürliche deutsche Erzähleinleitung; sie bewahrt den unbestimmten Charakter von אִישׁ und gibt den Wohnort idiomatisch wieder.
- source_word: מַעֲשֵׂהוּ
  choice: dessen Besitz ... lag
  rationale: Das Wort kann Werk, Tätigkeit, Angelegenheiten oder Besitz bezeichnen. Der Zusammenhang mit den großen Viehbeständen legt hier den wirtschaftlichen Besitz beziehungsweise Betrieb nahe; die Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: Der Mann war sehr reich
  rationale: Wörtlich bedeutet die Wendung »sehr groß«; die unmittelbar folgenden Viehzahlen konkretisieren dies als wirtschaftlichen und gesellschaftlichen Rang.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: und besaß dreitausend Schafe und tausend Ziegen
  rationale: Die hebräische Besitzkonstruktion mit ל wird im Deutschen natürlich mit »besaß« wiedergegeben; die Zahlen bleiben unverändert.
- source_word: וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ
  choice: Damals ließ er ... seine Schafe scheren
  rationale: Die Konstruktion bezeichnet die gerade stattfindende beziehungsweise saisonale Schafschur. Bei einem Besitzer dieser Größe ist das deutsche Kausativ »ließ ... scheren« idiomatisch, ohne auszuschließen, dass er die Arbeiten leitete oder daran beteiligt war.
- source_word: בַכַּרְמֶל
  choice: in Karmel
  rationale: Karmel ist hier ein Ortsname und wird transliteriert; die zweimalige Ortsangabe des Hebräischen bleibt erhalten.
theological_decisions: []
