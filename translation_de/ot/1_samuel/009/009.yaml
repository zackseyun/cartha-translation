  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: de
  text: 'Früher sagte man in Israel, wenn man hinging, um Gott zu befragen[a]: »Kommt, lasst uns zum Seher gehen!« Denn wer heute Prophet genannt wird, wurde früher Seher genannt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gott zu suchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: früher
  rationale: Die temporale Angabe bezeichnet frühere Zeiten; »früher« ist natürlich und stellt an beiden Stellen den Gegensatz zu »heute« her.
- source_word: כֹּה אָמַר הָאִישׁ
  choice: sagte man
  rationale: Die maskuline Einzahl bezeichnet hier generisch den üblichen Sprachgebrauch. Das deutsche unpersönliche »man« gibt diesen Sinn idiomatisch wieder, ohne eine bestimmte Person anzunehmen.
- source_word: בְּלֶכְתּוֹ
  choice: wenn jemand hinging
  rationale: Der Infinitiv mit Suffix ist temporal; »wenn jemand hinging« verdeutlicht den wiederholten Vorgang und liefert einen natürlichen Bezug für das generische »man«.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: um Gott zu befragen
  rationale: דרש bezeichnet hier das Einholen göttlicher Auskunft, offenbar durch einen prophetischen Mittler; »Gott befragen« wahrt diesen konsultativen Sinn.
- source_word: לְכוּ וְנֵלְכָה
  choice: Kommt, lasst uns … gehen!
  rationale: Imperativ und Kohortativ werden als zweiteilige Aufforderung wiedergegeben; der Numerus Plural bleibt erhalten.
- source_word: עַד הָרֹאֶה
  choice: zum Seher
  rationale: עַד bezeichnet hier das Ziel der Bewegung; »Seher« ist die etablierte deutsche Bezeichnung für den älteren prophetischen Titel רֹאֶה.
- source_word: לַנָּבִיא הַיּוֹם יִקָּרֵא
  choice: wer heute Prophet genannt wird
  rationale: Diese syntaktisch natürliche Fassung bewahrt das passive »genannt wird« und den zeitlichen Gegensatz, ohne die schwerfällige Formulierung »der Prophet von heute«.
- source_word: לְפָנִים הָרֹאֶה
  choice: wurde früher Seher genannt
  rationale: Der ältere Titel wird prädikativ wiedergegeben; im Deutschen steht die Berufs- bzw. Titelbezeichnung dabei idiomatisch ohne Artikel.
theological_decisions:
- issue: Bedeutung von דָּרַשׁ אֱלֹהִים im prophetischen Zusammenhang
  choice: Gott befragen
  alternative: Gott suchen
  rationale: Der Zusammenhang beschreibt das Einholen göttlicher Auskunft beim Seher. Die gewählte Fassung bewahrt diesen engeren konsultativen Sinn, ohne eine besondere Lehre über prophetische Vermittlung hinzuzufügen.
- issue: Verhältnis der Titel נָבִיא und רֹאֶה
  choice: Prophet und Seher als zeitlich unterschiedlich gebräuchliche Benennungen derselben Funktion darstellen
  alternative: die beiden Titel als theologisch unterschiedliche Ämter auffassen
  rationale: Der Vers selbst erklärt einen Wandel der Bezeichnung. Die Übersetzung behauptet deshalb keine darüber hinausgehende Amtsunterscheidung.
- issue: Generisches הָאִישׁ
  choice: unpersönlich mit »man« bzw. »jemand« wiedergeben
  alternative: »ein Mann«
  rationale: Im Kontext geht es um eine allgemeine frühere Gewohnheit, nicht um einen bestimmten Mann. Das moderne Deutsche verwendet dafür natürlicherweise »man«; der Sachgehalt wird nicht verändert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erklärende Parenthese des hebräischen Verses bleibt als fortlaufender Satz erhalten. Der Kontrast »heute/früher« und die historischen Titel »Prophet/Seher« werden klar und knapp wiedergegeben.
