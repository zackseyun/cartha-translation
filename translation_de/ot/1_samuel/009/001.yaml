base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: de
  text: Es gab einen Mann aus Benjamin. Sein Name war Kisch, der Sohn Abiëls, des Sohnes Zerors, des Sohnes Bechorats, des Sohnes Afiachs, eines Benjaminiters. Er war ein angesehener Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein tapferer Krieger“, „ein tüchtiger Mann“ oder „ein vermögender, einflussreicher Mann“. Die hebräische Wendung kann je nach Zusammenhang militärische Stärke, allgemeine Tüchtigkeit, gesellschaftliches Ansehen, Einfluss oder Wohlstand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Es gab
  rationale: Die Wayyiqtol-Form von היה eröffnet hier einen neuen Erzählabschnitt. „Es gab“ gibt diese Einführung natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: אִישׁ מִבֶּן־יָמִין
  choice: einen Mann aus Benjamin
  rationale: Die Wendung bezeichnet einen männlichen Angehörigen beziehungsweise jemanden aus dem Stamm Benjamin. „Aus Benjamin“ ist im Deutschen knapp und verständlich.
- source_word: וּשְׁמוֹ
  choice: Sein Name war
  rationale: Die hebräische Namensformel wird in natürlichem modernem Deutsch als eigener Satz wiedergegeben.
- source_word: קִישׁ / אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: Kisch / Abiël / Zeror / Bechorat / Afiach
  rationale: Die Personennamen werden nach geläufigen deutschen Bibelkonventionen transliteriert.
- source_word: בֶּן ... בֶּן ...
  choice: Sohn ... des Sohnes ...
  rationale: Die wiederholte genealogische Formel bleibt ausdrücklich erhalten. Obwohl בֶּן auch einen entfernteren Nachkommen bezeichnen kann, ist „Sohn“ hier die angemessene konventionelle Wiedergabe.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: eines Benjaminiters
  rationale: Die Wendung schließt die Ahnenreihe mit der Stammeszugehörigkeit ab. Im Deutschen ist die verkürzte Einbindung idiomatischer als „Sohn eines benjaminitischen Mannes“.
- source_word: גִּבּוֹר חָיִל
  choice: ein angesehener und vermögender Mann
  rationale: Die mehrdeutige Wendung kann militärische Tüchtigkeit, gesellschaftliches Ansehen, Einfluss oder Besitz bezeichnen. Im Kontext der Einführung Kischs beschreibt sie wahrscheinlich seine herausgehobene gesellschaftliche und wirtschaftliche Stellung; die Fußnote bewahrt die weiteren möglichen Nuancen.
