revisions:
- from: 'Da nahm der Koch die Keule samt dem, was darauf lag, und legte sie Saul vor.[a] Dann sagte Samuel: „Sieh, dies ist das Stück, das aufbewahrt wurde.[b] Nimm es dir und iss! Denn es ist für dich bis zu diesem festgesetzten Zeitpunkt aufbewahrt worden, seit ich sagte: ‚Ich habe das Volk eingeladen.‘“[c] So aß Saul an jenem Tag mit Samuel.'
  to: 'Da hob der Koch die Keule samt dem, was darauf war,[a] auf und setzte sie Saul vor. Samuel sagte: „Sieh, das Aufbewahrte[b] liegt vor dir. Iss! Denn für den festgesetzten Zeitpunkt[c] wurde es für dich aufbewahrt, als ich sagte:[d] ‚Ich habe das Volk eingeladen.‘“ So aß Saul an jenem Tag mit Samuel.'
  rationale: Die Revision beseitigt die sinnverschiebenden Zeitangaben „bis zu“ und „seit“, gibt den Essimperativ unmittelbar wieder, setzt den lexikalischen Fußnotenanker an die betreffende Fleischportion und bewahrt die komprimierte hebräische Syntax durch eine gezielte Anmerkung.
