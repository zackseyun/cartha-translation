base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: de
  text: 'Da hob der Koch die Keule samt dem, was darauf war,[a] auf und setzte sie Saul vor. Samuel sagte: „Sieh, das Aufbewahrte[b] liegt vor dir. Iss! Denn für den festgesetzten Zeitpunkt[c] wurde es für dich aufbewahrt, als ich sagte:[d] ‚Ich habe das Volk eingeladen.‘“ So aß Saul an jenem Tag mit Samuel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Schenkel“. Das hebräische Wort bezeichnet den Beinabschnitt des Tieres; der Begleitbestandteil wird nicht näher benannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Übriggebliebene“. Das hebräische Wort kann entweder etwas bezeichnen, das übrig war, oder etwas, das zurückbehalten wurde; der Zusammenhang spricht für eine eigens für Saul aufbewahrte Portion.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „für den festgesetzten Anlass“. Das hebräische Wort kann einen bestimmten Zeitpunkt oder Anlass bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Der hebräische Satz ist an dieser Stelle stark verkürzt; die genaue Verknüpfung von „für den festgesetzten Zeitpunkt“ und der folgenden Rede bleibt offen. Möglich ist auch: „Denn für den festgesetzten Zeitpunkt wurde es für dich aufbewahrt, indem ich sagte: ‚Ich habe das Volk eingeladen.‘“'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַטַּבָּח
  choice: der Koch
  rationale: Im Zusammenhang des Opfermahls bezeichnet das Wort denjenigen, der das Fleisch zubereitet und aufträgt. „Koch“ passt im Deutschen besser zur Handlung als „Schlachter“.
- source_word: הַשּׁוֹק
  choice: die Keule
  rationale: Das Wort bezeichnet den Beinabschnitt eines Tieres. „Keule“ ist im Zusammenhang einer Fleischportion natürlich; „Schenkel“ wäre ebenfalls möglich.
- source_word: וְהֶעָלֶיהָ
  choice: samt dem, was darauf lag
  rationale: Der hebräische Ausdruck nennt den beigegebenen Bestandteil nicht näher. Die offene Formulierung bewahrt diese Unbestimmtheit.
- source_word: הַנִּשְׁאָר
  choice: das Stück, das aufbewahrt wurde
  rationale: Die Form kann das Übriggebliebene oder das Zurückbehaltene bezeichnen. Der Kontext zeigt, dass die Portion eigens für Saul aufbewahrt worden war.
- source_word: שִׂים לְפָנֶיךָ
  choice: Nimm es dir
  rationale: Der wörtliche Imperativ „Lege es vor dich“ ist im Deutschen in dieser Situation unnatürlich. „Nimm es dir“ gibt die Aufforderung wieder, die bereits vor Saul liegende Portion anzunehmen.
- source_word: לַמּוֹעֵד
  choice: bis zu diesem festgesetzten Zeitpunkt
  rationale: מוֹעֵד bezeichnet einen bestimmten oder festgesetzten Zeitpunkt beziehungsweise Anlass. Die Wiedergabe lässt offen, ob der Zeitpunkt oder der Anlass im Vordergrund steht.
- source_word: שָׁמוּר לְךָ
  choice: für dich ... aufbewahrt worden
  rationale: Das passive Partizip drückt aus, dass die Portion gezielt für Saul zurückgehalten wurde.
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: 'seit ich sagte: „Ich habe das Volk eingeladen“'
  rationale: קרא bedeutet hier im Mahlkontext wahrscheinlich „einladen“. Die zeitliche Verknüpfung ist im Hebräischen knapp und nicht völlig eindeutig; „seit“ ergibt im Zusammenhang einen verständlichen Sinn.
- source_word: עִם שְׁמוּאֵל
  choice: mit Samuel
  rationale: Die schlichte Wiedergabe bezeichnet die gemeinsame Mahlzeit, ohne zusätzliche Deutung.
