base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: de
  text: Dann nahm Samuel Saul und seinen Begleiter[a] mit, brachte sie in den Saal[b] und wies ihnen einen Platz an der Spitze der Geladenen zu; es waren etwa dreißig Männer.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Diener“ beziehungsweise „seinen jungen Mann“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in den Raum“ beziehungsweise „in die Kammer“. Das hebräische Wort kann verschiedene Arten von Räumen bezeichnen; hier ist wohl ein größerer Raum für das Mahl gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und sie waren etwa dreißig Männer“. Gemeint sind wahrscheinlich die anwesenden Geladenen.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: seinen Begleiter
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Im Kontext begleitet und unterstützt er Saul; „Begleiter“ ist im modernen Deutschen natürlich und legt weder sein Alter noch seinen rechtlichen Status unnötig fest.
- source_word: לִשְׁכָּתָה
  choice: in den Saal
  rationale: לִשְׁכָּה bezeichnet einen Raum, eine Kammer oder einen Saal. Der Rahmen eines Mahls mit ungefähr dreißig Männern spricht hier für einen größeren Versammlungs- oder Speiseraum.
- source_word: מָקוֹם בְּרֹאשׁ
  choice: den Ehrenplatz
  rationale: Wörtlich steht „einen Platz an der Spitze“. Im Zusammenhang der Sitzordnung bei einem Mahl bezeichnet die Wendung einen hervorgehobenen Platz; „Ehrenplatz“ gibt diese Funktion idiomatisch wieder.
- source_word: הַקְּרוּאִים
  choice: den Geladenen
  rationale: Das passive Partizip von קרא bezeichnet hier die zum Mahl Gerufenen beziehungsweise Eingeladenen. „Die Geladenen“ ist knapp, klar und dem Festkontext angemessen.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: es waren etwa dreißig Männer
  rationale: Die Klausel nennt wahrscheinlich die ungefähre Zahl der unmittelbar zuvor erwähnten Geladenen. Die unpersönliche deutsche Form ist natürlicher als eine streng formale Wiedergabe mit „sie“.
- source_word: וַיִּקַּח
  choice: nahm … mit
  rationale: לקח bedeutet grundsätzlich „nehmen“. Zusammen mit dem folgenden Hineinbringen bezeichnet es hier das Mitnehmen beziehungsweise Geleiten Sauls und seines Begleiters.
- source_word: וַיְבִיאֵם
  choice: brachte sie
  rationale: Der Hifil von בוא bedeutet „hineinbringen“ oder „hinführen“. Das Ziel „in den Saal“ macht die Bewegungsrichtung im Deutschen deutlich.
theological_decisions: []
