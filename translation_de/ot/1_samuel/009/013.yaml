source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֣ם הָ/עִ֣יר כֵּ֣ן תִּמְצְא֣וּ/ן אֹת֡/וֹ בְּ/טֶרֶם֩ יַעֲלֶ֨ה הַ/בָּמָ֜תָ/ה לֶ/אֱכֹ֗ל כִּ֠י לֹֽא יֹאכַ֤ל הָ/עָם֙ עַד בֹּא֔/וֹ כִּֽי הוּא֙ יְבָרֵ֣ךְ הַ/זֶּ֔בַח אַחֲרֵי כֵ֖ן יֹאכְל֣וּ הַ/קְּרֻאִ֑ים וְ/עַתָּ֣ה עֲל֔וּ כִּֽי אֹת֥/וֹ כְ/הַ/יּ֖וֹם תִּמְצְא֥וּ/ן אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: de
  text: Sobald ihr in die Stadt kommt, werdet ihr ihn finden, noch bevor er zur Kulthöhe[a] hinaufgeht, um zu essen. Denn das Volk wird nicht essen, bis er kommt, weil er das Schlachtopfer segnet[b]; danach essen die Geladenen. Geht jetzt hinauf, denn heute[c] werdet ihr ihn finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine „Kulthöhe“ war eine meist erhöhte Stätte, an der Opfer dargebracht und Opfermahle gehalten wurden.
    reason: cultural_note
  - marker: b
    text: Gemeint ist wahrscheinlich, dass er vor dem Opfermahl den dazugehörigen Segen spricht.
    reason: cultural_note
  - marker: c
    text: 'Oder: „gerade jetzt“. Das hebräische כְהַיּוֹם kann hier die unmittelbare Zeit betonen, nicht nur den Kalendertag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: Sobald ihr in die Stadt kommt
  rationale: Die Präposition כְּ mit dem Infinitiv constructus bezeichnet hier den Zeitpunkt. „Sobald“ gibt im Kontext die unmittelbare zeitliche Abfolge natürlich wieder.
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: werdet ihr ihn finden
  rationale: כֵּן unterstreicht hier Ergebnis beziehungsweise Gewissheit; im Deutschen ist dies durch die Satzfolge hinreichend ausgedrückt.
- source_word: בְּטֶרֶם יַעֲלֶה הַבָּמָתָה
  choice: noch bevor er zur Kulthöhe hinaufgeht
  rationale: בטרם bezeichnet Vorzeitigkeit, und עלה bewahrt mit „hinaufgeht“ die Bewegungsrichtung. „Kulthöhe“ bezeichnet knapp und präzise eine בָּמָה als erhöhte Opfer- und Gottesdienststätte.
- source_word: לֶאֱכֹל
  choice: um zu essen
  rationale: Die einfache Infinitivkonstruktion wird direkt wiedergegeben; der weitere Satz macht den Zusammenhang mit dem Opfermahl deutlich.
- source_word: לֹא יֹאכַל הָעָם עַד בֹּאוֹ
  choice: das Volk wird nicht essen, bis er kommt
  rationale: Der Imperfekt ist in diesem Zusammenhang zukünftig; die Infinitivkonstruktion nach עַד wird im Deutschen natürlich als Nebensatz formuliert.
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: weil er das Schlachtopfer segnet
  rationale: Das ausdrücklich gesetzte הוּא hebt Samuel als den Handelnden hervor. זֶבַח bezeichnet ein Schlachtopfer und schließt hier das damit verbundene Mahl ein, ohne mit diesem identisch gemacht zu werden.
- source_word: אַחֲרֵי כֵן יֹאכְלוּ הַקְּרֻאִים
  choice: danach essen die Geladenen
  rationale: Die Reihenfolge bleibt ausdrücklich erhalten. הַקְּרֻאִים ist das passive Partizip „die Gerufenen/Eingeladenen“; „die Geladenen“ ist im Zusammenhang eines Mahls idiomatisch.
- source_word: וְעַתָּה עֲלוּ
  choice: Geht jetzt hinauf
  rationale: Die Aufforderung wird direkt wiedergegeben; „hinauf“ bewahrt dieselbe räumliche Nuance von עלה wie zuvor.
- source_word: כְהַיּוֹם
  choice: gerade heute
  rationale: Die ungewöhnliche Wendung trägt sowohl den Bezug auf den heutigen Tag als auch eine verstärkende Bedeutung im Sinn von „jetzt/zu dieser Zeit“. „Gerade heute“ lässt beide Aspekte anklingen.
theological_decisions:
- issue: Bedeutung des Segnens beim Schlachtopfer
  choice: „das Schlachtopfer segnet“ im Haupttext, mit Erklärung in der Fußnote
  alternative: „den Segen über dem Opfermahl spricht“
  rationale: Die direkte Wiedergabe wahrt die Formulierung des Hebräischen und legt nicht abschließend fest, ob primär das Opfer, das Mahl oder Gott im Zusammenhang mit dem Opfer gepriesen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kulthöhe“ ist präziser als das missverständliche „Höhe“ und weniger interpretierend als „Heiligtum“. Die knappe erzählerische Syntax und die wiederholte Bewegung „hinauf“ wurden bewahrt.
