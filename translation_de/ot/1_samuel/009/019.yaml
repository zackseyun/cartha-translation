base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: de
  text: 'Samuel antwortete Saul: „Ich bin der Seher.[a] Geh vor mir zur Kulthöhe hinauf. Ihr werdet heute mit mir essen,[b] und am Morgen werde ich dich auf den Weg schicken. Alles, was in deinem Herzen ist, werde ich dir sagen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seher“ ist die ältere Bezeichnung für einen Propheten; siehe 1. Samuel 9,9.
    reason: historical_term
  - marker: b
    text: Im Hebräischen steht „ihr werdet essen“ in der Mehrzahl; wahrscheinlich ist neben Saul auch sein Diener gemeint.
    reason: grammatical_number
lexical_decisions:
- source_word: הָרֹאֶה
  choice: der Seher
  rationale: Die wörtliche Bezeichnung „der Sehende“ meint hier einen prophetischen Seher. „Seher“ bewahrt den älteren, in 1. Samuel 9,9 erklärten Titel, ohne ihn vorschnell mit „Prophet“ gleichzusetzen.
- source_word: הַבָּמָה
  choice: Kulthöhe
  rationale: Das Wort bezeichnet hier eine erhöhte Kult- beziehungsweise Opferstätte. „Kulthöhe“ erhält sowohl den räumlichen als auch den religiösen Sinn und ist im modernen Deutschen verständlicher als die bloße „Höhe“.
- source_word: עֲלֵה לְפָנַי
  choice: Geh vor mir … hinauf
  rationale: Die Formulierung bewahrt sowohl die Aufwärtsbewegung zur Kulthöhe als auch Sauls Position vor Samuel, ohne näher festzulegen, ob Saul ihn anführen soll.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: Ihr werdet heute mit mir essen
  rationale: Das Verb steht trotz der unmittelbaren Anrede Sauls im maskulinen Plural und schließt wahrscheinlich Sauls Diener ein. Das Futur gibt die im Kontext angekündigte gemeinsame Mahlzeit natürlich wieder.
- source_word: וְשִׁלַּחְתִּיךָ בַבֹּקֶר
  choice: am Morgen werde ich dich weiterziehen lassen
  rationale: Das Verb bezeichnet hier Sauls Entlassung zur Weiterreise. „Weiterziehen lassen“ ist natürlich und vermeidet den abweisenden Beiklang von „wegschicken“.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: Alles, was in deinem Herzen ist
  rationale: „Herz“ bewahrt das hebräische Bild für das Innere des Menschen, einschließlich seiner Gedanken, Anliegen und Absichten, ohne es auf den Verstand zu verengen.
- source_word: אַגִּיד לָךְ
  choice: werde ich dir sagen
  rationale: Die Hifil-Form bedeutet, etwas mitzuteilen oder bekannt zu machen. „Dir sagen“ ist in diesem Gespräch natürlich und inhaltlich hinreichend genau.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig gestaltet, während die ältere Amtsbezeichnung „Seher“, die Kultbezeichnung „Kulthöhe“, der Numeruswechsel von Singular zu Plural und das hebräische Herzbild erhalten bleiben.
