base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: de
  text: Und er hatte einen Sohn namens Saul. Er war ein junger, gutaussehender Mann; unter den Israeliten gab es keinen, der besser aussah als er.[a] Von den Schultern an überragte er das ganze Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter den Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵן
  choice: Sohn
  rationale: Im unmittelbaren familiären Zusammenhang bezeichnet das Wort den Sohn des Kisch.
- source_word: וּשְׁמוֹ שָׁאוּל
  choice: namens Saul
  rationale: Die knappe deutsche Wendung gibt die hebräische Namensformel natürlich und vollständig wieder.
- source_word: בָּחוּר
  choice: junger … Mann
  rationale: Das Wort bezeichnet hier einen jungen Mann im kräftigen Erwachsenenalter.
- source_word: טוֹב / וָטוֹב
  choice: stattlich
  rationale: טוֹב kann hier gutes Aussehen oder eine insgesamt eindrucksvolle äußere Erscheinung bezeichnen. „Stattlich“ passt zum anschließenden Hinweis auf Sauls außergewöhnliche Körpergröße, ohne die Bedeutung ausschließlich auf Schönheit einzuengen.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: unter den Israeliten
  rationale: Dies ist im modernen Deutsch die natürliche Entsprechung von „unter den Söhnen Israels“; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה גָּבֹהַּ
  choice: Von den Schultern an überragte er
  rationale: Die Wiedergabe vermittelt idiomatisch, dass Saul um Kopf und Schultern größer war als die übrigen Menschen, und bleibt zugleich nahe am hebräischen Körperbezug.
- source_word: מִכָּל הָעָם
  choice: das ganze Volk
  rationale: Die kollektive Vergleichsgröße הָעָם wird direkt als „das ganze Volk“ wiedergegeben.
