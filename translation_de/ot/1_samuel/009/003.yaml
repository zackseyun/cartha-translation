base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: de
  text: 'Die Eselinnen, die Kisch, Sauls Vater, gehörten, waren verschwunden. Da sagte Kisch zu seinem Sohn Saul: »Nimm bitte einen der jungen Männer[a] mit, mach dich auf und geh die Eselinnen suchen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen von den Knechten« beziehungsweise »einen von den Begleitern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: waren verschwunden
  rationale: אבד bezeichnet hier, dass die Tiere nicht mehr aufzufinden waren. »Waren verschwunden« ist im modernen Deutschen natürlich und vermeidet die mögliche Fehlbedeutung, sie seien verendet.
- source_word: הָאֲתֹנוֹת
  choice: die Eselinnen
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich weibliche Esel; »Eselinnen« gibt diese Information im Deutschen natürlich und präzise wieder.
- source_word: לְקִישׁ
  choice: Kischs
  rationale: Das לְ kennzeichnet hier den Besitz. Der deutsche Genitiv drückt dies knapp und idiomatisch aus.
- source_word: אֲבִי שָׁאוּל
  choice: des Vaters Sauls
  rationale: Die Apposition identifiziert Kisch ausdrücklich als Sauls Vater und wird in einer würdigen, gut verständlichen Genitivkonstruktion bewahrt.
- source_word: קַח נָא אִתְּךָ
  choice: Nimm bitte … mit
  rationale: נָא mildert die Aufforderung; »bitte« gibt diesen höflichen beziehungsweise eindringlichen Ton wieder. Das trennbare Verb »mitnehmen« erfasst אִתְּךָ idiomatisch.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: einen von den jungen Männern
  rationale: נְעָרִים kann junge Männer, Knechte oder Begleiter bezeichnen. Die Hauptübersetzung bleibt bei der grundlegenden Altersbezeichnung und lässt die soziale Funktion offen.
- source_word: וְקוּם לֵךְ
  choice: mach dich auf und geh
  rationale: Die beiden Imperative werden als natürliche deutsche Aufforderungsfolge wiedergegeben; »mach dich auf« bewahrt den Impuls von קוּם, ohne altertümlich zu klingen.
- source_word: בַּקֵּשׁ
  choice: suchen
  rationale: בקש bedeutet hier, nach den vermissten Tieren zu suchen. Die deutsche Infinitivkonstruktion »suchen gehen« ist idiomatisch.
