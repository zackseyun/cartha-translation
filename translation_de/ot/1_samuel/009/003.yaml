  terminology: „Eselinnen“ gibt das hebräische feminine Substantiv präzise wieder. „Sauls Vater“ ist die natürliche moderne deutsche Wiedergabe. Die Alternativen „Knechte“ und „Begleiter“ in der Fußnote sind sachgerecht.
