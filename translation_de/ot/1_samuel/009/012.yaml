  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: de
  text: 'Sie antworteten ihnen: „Ja, sieh nur, er ist vor dir. Beeil dich jetzt! Er ist nämlich heute in die Stadt gekommen, denn heute findet für das Volk auf der Kulthöhe[a] ein Opfer statt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine „Kulthöhe“ war eine örtliche, häufig erhöht gelegene Stätte, an der Opfer dargebracht und religiöse Feiern gehalten wurden.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: Sie antworteten ihnen
  rationale: Die beiden femininen Pluralformen beziehen sich auf die jungen Frauen. Die im Hebräischen übliche Verbindung „antworteten und sagten“ wird im heutigen Deutsch natürlich mit „antworteten“ wiedergegeben.
- source_word: יֵשׁ הִנֵּה
  choice: Ja, seht nur
  rationale: יֵשׁ dient hier als bejahende Antwort; הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf Samuel.
- source_word: לְפָנֶיךָ
  choice: gleich vor euch
  rationale: Wörtlich „vor dir“. Da Saul mit seinem Diener angesprochen wird und der Kontext räumliche Nähe ausdrückt, ist der idiomatische Plural „vor euch“ passend; „gleich“ vermittelt die kontextuelle Unmittelbarkeit.
- source_word: מַהֵר עַתָּה
  choice: Beeilt euch jetzt
  rationale: Der hebräische Imperativ steht formal im maskulinen Singular, richtet sich im Zusammenhang aber an Saul und seine Begleitung; natürliches Deutsch verwendet hier den Plural.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: Er ist nämlich heute in die Stadt gekommen
  rationale: Das Perfekt bezeichnet Samuels bereits erfolgte Ankunft am selben Tag. Das deutsche Perfekt klingt in direkter Rede natürlich; „nämlich“ gibt die begründende Funktion von כִּי wieder.
- source_word: זֶבַח הַיּוֹם לָעָם
  choice: heute findet für das Volk ... ein Opfer statt
  rationale: זֶבַח bezeichnet zunächst ein Opfer; ein damit verbundenes Opfermahl ist im Kontext möglich, wird aber nicht in den Text hineingetragen.
- source_word: בַּבָּמָה
  choice: auf der Kulthöhe
  rationale: במה bezeichnet eine örtliche, oft erhöht gelegene Kultstätte. „Kulthöhe“ bewahrt den historischen Fachsinn und ist im Deutschen verständlicher als die missverständliche bloße „Höhe“.
theological_decisions:
- issue: Wertung der בָּמָה im vorstaatlichen Opferkontext
  choice: Kulthöhe
  alternative: Höhenheiligtum; Opferstätte auf der Anhöhe
  rationale: Die Wiedergabe bezeichnet die Kultstätte, ohne die später in manchen biblischen Texten erkennbare polemische Wertung in diesen Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist flüssig gestaltet, während Wiederholung und Begründungsstruktur des Hebräischen weitgehend erhalten bleiben.
