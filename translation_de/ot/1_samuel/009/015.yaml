  text: Yahweh had revealed to Samuel one day before Saul came[a], saying,
translation:
  language: de
  text: 'Jahwe hatte Samuel einen Tag vor Sauls Ankunft etwas offenbart[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hatte Samuels Ohr entblößt“; eine hebräische Redewendung dafür, jemandem etwas zu offenbaren oder mitzuteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben. Das vorangestellte Waw verbindet den Satz mit dem Erzählzusammenhang, erfordert hier im Deutschen aber kein eigenes „und“ oder „nun“.
- source_word: גָּלָה אֶת־אֹזֶן שְׁמוּאֵל
  choice: hatte Samuel offenbart
  rationale: Die wörtliche Wendung „Samuels Ohr entblößen“ ist ein hebräisches Idiom für das vertrauliche Mitteilen oder Offenbaren. Das Plusquamperfekt kennzeichnet das Geschehen als zeitlich vorgeordnet.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: einen Tag vor Sauls Ankunft
  rationale: Die Zeitangabe und die Präposition mit Infinitiv werden in natürlichem Deutsch knapp und genau wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die Formel leitet die folgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als „indem er sagte“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Eigenname, ohne eine traditionelle Ersatztitulatur in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Erzählregister. Der Doppelpunkt bereitet die in Vers 16 folgende Gottesrede vor; der Vers bleibt daher bewusst syntaktisch offen.
