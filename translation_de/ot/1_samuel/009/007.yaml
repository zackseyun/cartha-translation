base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: de
  text: 'Da sagte Saul zu seinem jungen Begleiter: „Aber sieh, wenn wir hingehen, was bringen wir dann dem Mann mit? Das Brot in unseren Taschen[a] ist aufgebraucht, und wir haben kein Geschenk[b], das wir dem Mann Gottes mitbringen könnten. Was haben wir bei uns?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Das Brot ist aus unseren Gefäßen/Behältern aufgebraucht.“ Das hebräische Wort bezeichnet allgemein Gefäße oder Behälter; „Taschen“ konkretisiert es im Reisekontext.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gabe“. Das hebräische Wort bezeichnet etwas, das man einer angesehenen Person als Geschenk oder Aufmerksamkeit mitbringt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: junger Begleiter
  rationale: Das Wort kann einen jungen Mann oder einen jungen Bediensteten bezeichnen. „Junger Begleiter“ bewahrt sowohl den Altersbezug als auch seine Funktion im Erzählzusammenhang, ohne ihn ausdrücklich als Sklaven oder bloßen Diener einzuordnen.
- source_word: וְהִנֵּה
  choice: Aber sieh
  rationale: Die Wendung lenkt die Aufmerksamkeit auf Sauls praktischen Einwand. „Aber sieh“ gibt sowohl den hinweisenden als auch den leicht adversativen Sinn in gegenwärtigem Deutsch wieder.
- source_word: נֵלֵךְ
  choice: wenn wir hingehen
  rationale: Im Zusammenhang führt die Verbform die angenommene Handlung ein, auf die Sauls Frage folgt. Die konditionale Wiedergabe ist im Deutschen natürlich und entspricht dem Gedankengang.
- source_word: נָּבִיא
  choice: mitbringen
  rationale: Der Hifil von בוא bezeichnet hier das Bringen einer Sache zu einer Person. „Mitbringen“ passt besonders zur Reise- und Besuchssituation.
- source_word: לָאִישׁ
  choice: dem Mann
  rationale: Die maskuline Singularform bezieht sich auf Samuel. Die folgende Bezeichnung „Mann Gottes“ verdeutlicht seine Identität.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Grundbedeutung wird beibehalten, auch wenn Brot hier zugleich für den Reiseproviant stehen kann.
- source_word: אָזַל
  choice: ist aufgebraucht
  rationale: Das Verb bezeichnet etwas, das verbraucht oder zu Ende gegangen ist. „Ist aufgebraucht“ gibt dies präzise und idiomatisch wieder.
- source_word: כְּלִי
  choice: Taschen
  rationale: Das Wort bezeichnet allgemein Gefäße oder Behälter. Im Reisekontext sind „Taschen“ eine natürliche konkrete Wiedergabe für die Behältnisse ihres Proviants.
- source_word: תְּשׁוּרָה
  choice: Geschenk
  rationale: Gemeint ist eine Gabe, die man einer angesehenen Person mitbringt. „Geschenk“ vermeidet die kultischen Nebenbedeutungen, die „Opfergabe“ haben könnte.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Die anerkannte hebräische Bezeichnung für einen von Gott beauftragten Menschen wird wörtlich bewahrt und nicht verengend durch „Prophet“ ersetzt.
- source_word: מָה אִתָּנוּ
  choice: Was haben wir noch bei uns?
  rationale: Die hebräische Wendung fragt nach dem, was ihnen gegenwärtig zur Verfügung steht. „Bei uns“ erhält den räumlich-praktischen Aspekt; „noch“ verdeutlicht im Deutschen den Zusammenhang mit den aufgebrauchten Vorräten.
theological_decisions:
- issue: Bezeichnung Samuels als אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  alternative: Prophet
  rationale: Der Quelltext verwendet den Titel „Mann Gottes“. Obwohl Samuel ein Prophet ist, soll die Übersetzung die hier tatsächlich gebrauchte Bezeichnung nicht durch eine kontextuelle Identifikation ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt lebendig, ohne altertümliche Formen wie „siehe!“ oder unnötig kultische Begriffe zu verwenden. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
