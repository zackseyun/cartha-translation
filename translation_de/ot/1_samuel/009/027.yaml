base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: de
  text: 'Als sie zum Rand der Stadt hinabgingen, sagte Samuel zu Saul: »Sag dem jungen Mann[a], er soll uns vorausgehen.« Und er ging voraus. »Du aber bleib jetzt stehen[b], und ich werde dich das Wort Gottes hören lassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Diener«. Das hebräische Wort kann einen jungen Mann, Begleiter oder Diener bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist idiomatisch und in ihrer genauen Nuance unsicher; sie fordert Saul auf, zunächst stehen zu bleiben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה יֹרְדִים
  choice: Als sie … hinabgingen
  rationale: Das Partizip bezeichnet die im Verlauf befindliche Bewegung; die deutsche Nebensatzform gibt den erzählerischen Hintergrund natürlich wieder.
- source_word: בִּקְצֵה הָעִיר
  choice: zum Rand der Stadt
  rationale: קָצֶה bezeichnet das äußerste Ende oder den Rand. Diese Wiedergabe bleibt näher am Hebräischen als das stärker deutende „Stadtrandgebiet“.
- source_word: אֱמֹר לַנַּעַר
  choice: Sag dem jungen Mann
  rationale: נַעַר kann einen jungen Mann, Begleiter oder Diener bezeichnen. „Junger Mann“ bewahrt die lexikalische Breite; die kontextuell mögliche Bedeutung „Diener“ wird in der Fußnote genannt.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: er soll uns vorausgehen
  rationale: עבר mit לִפְנֵי bezeichnet hier das Vorangehen vor anderen; „vorausgehen“ ist präzise und natürlich.
- source_word: וַיַּעֲבֹר
  choice: Und er ging voraus
  rationale: Die Erzählform berichtet unmittelbar, dass der Begleiter der Aufforderung folgte, und greift deren Wortlaut knapp auf.
- source_word: עֲמֹד כַּיּוֹם
  choice: bleib jetzt stehen
  rationale: Die schwierige idiomatische Wendung fordert Saul auf, für den gegenwärtigen Augenblick anzuhalten. „Bleib jetzt stehen“ gibt diese Funktion wieder, ohne ein nicht ausdrücklich genanntes „hier“ einzufügen.
- source_word: וְאַשְׁמִיעֲךָ
  choice: ich werde dich … hören lassen
  rationale: Der Hifil von שׁמע ist kausativ. „Hören lassen“ erhält diese Nuance und ist im Deutschen verständlich.
- source_word: דְּבַר אֱלֹהִים
  choice: das Wort Gottes
  rationale: Die traditionelle und transparente Formulierung bewahrt sowohl die Bedeutung „Wort/Botschaft“ als auch das Gewicht prophetischer Offenbarung.
theological_decisions:
- issue: Wiedergabe der Offenbarungsformel דְּבַר אֱלֹהִים
  choice: das Wort Gottes
  alternative: die Botschaft Gottes
  rationale: „Das Wort Gottes“ erhält die prophetisch-theologische Resonanz, ohne den Inhalt der folgenden Mitteilung näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlicher direkter Rede. Der Satzbau folgt dem hebräischen Erzählablauf, vermeidet jedoch unnötige Wörtlichkeit. Die Anrede unterscheidet den vorausgehenden Begleiter von Saul durch „Du aber“.
