base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/025.yaml
  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: de
  text: Als sie von der Kulthöhe in die Stadt hinabgestiegen waren, sprach er mit Saul auf dem Dach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Als sie … hinabgestiegen waren
  rationale: Die Narrativform führt die Handlung weiter. Der temporale Anschluss gibt im Deutschen den Übergang zum folgenden Singular natürlich wieder, ohne die im Verb enthaltene Abwärtsbewegung zu verlieren.
- source_word: מֵהַבָּמָה
  choice: von der Kulthöhe
  rationale: בָּמָה bezeichnet hier im Zusammenhang mit dem Opfermahl eine erhöhte Kultstätte. „Kulthöhe“ ist im Deutschen präziser als das missverständliche „Höhe“ und deutet nicht lediglich einen Hügel an.
- source_word: הָעִיר
  choice: in die Stadt
  rationale: In Verbindung mit dem Bewegungsverb und dem Ausgangspunkt bezeichnet der Ausdruck die Bewegung hinein in die Stadt.
- source_word: וַיְדַבֵּר
  choice: sprach er
  rationale: Der Wechsel vom pluralischen zum singularischen Verb bleibt erhalten. Das schlichte „sprach“ fügt weder einen ausdrücklich genannten Sprecher noch einen Gesprächsinhalt hinzu.
- source_word: עִם שָׁאוּל
  choice: mit Saul
  rationale: עִם bedeutet gewöhnlich „mit“ und lässt eher ein Gespräch als eine ausschließlich einseitige Anrede erkennen.
- source_word: עַל הַגָּג
  choice: auf dem Dach
  rationale: גָּג bezeichnet das begehbare Flachdach eines Hauses; „auf dem Dach“ ist gegenwärtiges, natürliches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfügung mit „Als“ macht den zeitlichen Übergang natürlich; das ungenannte Subjekt des singularischen Verbs wird entsprechend dem Hebräischen nur durch „er“ wiedergegeben.
