  text: וַ/יִּגַּ֥שׁ שָׁא֛וּל אֶת שְׁמוּאֵ֖ל בְּ/ת֣וֹךְ הַ/שָּׁ֑עַר וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵי זֶ֖ה בֵּ֥ית הָ/רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: de
  text: 'Da trat Saul mitten im Tor[a] an Samuel heran und sagte: »Sag mir bitte, wo das Haus des Sehers[b] ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Tor« kann hier der gesamte Torbereich der Stadt gemeint sein, nicht nur die Toröffnung.
    reason: historical_context
  - marker: b
    text: »Seher« ist eine ältere Bezeichnung für jemanden, der später gewöhnlich »Prophet« genannt wurde; siehe 1. Samuel 9,9.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: trat … zu
  rationale: Das Verb bezeichnet das Herantreten an eine Person. »Trat zu Samuel« gibt die Bewegung idiomatisch und zugleich eng am Hebräischen wieder.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: mitten im Tor
  rationale: Die Wendung bedeutet wörtlich »inmitten des Tores«. Im damaligen städtischen Kontext kann »Tor« den gesamten Torbereich bezeichnen.
- source_word: הַגִּידָה נָּא לִי
  choice: Sag mir bitte
  rationale: Der Imperativ mit נָא formuliert eine höfliche Bitte. Die gewählte Formulierung ist natürliches, gegenwärtiges Deutsch.
- source_word: אֵי זֶה
  choice: wo … ist
  rationale: Die Frage zielt im Zusammenhang auf den Ort. Die deutsche Wo-Frage gibt dies idiomatisch wieder.
- source_word: בֵּית הָרֹאֶה
  choice: das Haus des Sehers
  rationale: Die Genitivverbindung bildet die hebräische Konstruktverbindung genau und natürlich ab. »Seher« bewahrt die ältere Bezeichnung, die in 1. Samuel 9,9 erläutert wird.
theological_decisions: []
