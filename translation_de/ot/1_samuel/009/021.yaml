  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: de
  text: 'Saul antwortete: »Bin ich nicht ein Benjaminiter, aus einem der kleinsten Stämme Israels? Und ist meine Sippe nicht die geringste unter allen Sippen des Stammes Benjamin? Warum hast du dann so zu mir gesprochen?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum hast du dann so etwas zu mir gesagt?«'
    reason: Lexikalische Alternative für כַּדָּבָר הַזֶּה, das sowohl die Art als auch den Inhalt des Gesagten bezeichnen kann.
lexical_decisions:
- source_word: הֲלוֹא בֶן־יְמִינִי אָנֹכִי
  choice: Bin ich nicht ein Benjaminiter
  rationale: Die rhetorische Frage erwartet Zustimmung; „Benjaminiter“ gibt die Stammeszugehörigkeit natürlich und präzise wieder.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: aus einem der kleinsten Stämme Israels
  rationale: Die hebräische Pluralform mit מִן bezeichnet die Zugehörigkeit zur Gruppe der kleinsten beziehungsweise unbedeutendsten Stämme. Die Formulierung bewahrt diese Nuance, ohne Benjamin eindeutig als den absolut kleinsten Stamm festzulegen.
- source_word: וּמִשְׁפַּחְתִּי
  choice: meine Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftliche Untereinheit des Stammes; „Sippe“ ist genauer als die moderne Kernfamilie.
- source_word: הַצְּעִרָה
  choice: die geringste
  rationale: Das Wort kann geringe Größe, Rangstellung oder Bedeutung ausdrücken. „Die geringste“ bewahrt die soziale Wertung und vermeidet eine rein zahlenmäßige Festlegung.
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: unter allen Sippen des Stammes Benjamin
  rationale: Gemeint ist der Vergleich mit den Sippen innerhalb Benjamins. Obwohl der masoretische Text formal „Stämme Benjamins“ bietet, verlangt der Kontext im Deutschen eine verständliche Wiedergabe mit dem kollektiven Singular.
- source_word: וְלָמָּה
  choice: Warum ... dann
  rationale: „Dann“ macht den folgernden Zusammenhang zwischen Sauls Selbsteinschätzung und seiner Frage idiomatisch deutlich.
- source_word: דִּבַּרְתָּ אֵלַי כַּדָּבָר הַזֶּה
  choice: hast du dann so zu mir gesprochen
  rationale: Die Wiedergabe ist natürlich und kann sowohl die Art als auch den Inhalt von Samuels Worten bezeichnen; die wörtlichere inhaltliche Alternative steht in der Fußnote.
theological_decisions: []
