base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/023.yaml
  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: de
  text: 'Da sagte Samuel zu dem Koch[a]: »Bring die Portion, die ich dir gegeben habe und von der ich dir gesagt habe: ›Behalte sie bei dir.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schlachter«. Wörtlicher können die Verben mit »Gib die Portion … lege sie bei dir hin« wiedergegeben werden.'
    reason: Das hebräische טַבָּח kann einen Schlachter beziehungsweise den für das Fleisch Verantwortlichen bezeichnen. תְּנָה bedeutet grundlegend „gib“; שִׂים אֹתָהּ עִמָּךְ lautet knapp „lege sie bei dir hin“ und meint hier das Zurückhalten der Portion.
lexical_decisions:
- source_word: טַּבָּח
  choice: Koch
  rationale: In diesem Festmahlkontext bezeichnet das Wort den für die Zubereitung und Ausgabe des Fleisches Verantwortlichen. »Koch« ist im modernen Deutschen natürlicher als das lexikalisch mögliche »Schlachter«.
- source_word: תְּנָה
  choice: Bring
  rationale: Die Grundbedeutung ist »gib«. Hier soll der Koch jedoch die zuvor verwahrte Portion herbeibringen beziehungsweise vorlegen; »Bring« gibt diese kontextuelle Bedeutung idiomatisch wieder.
- source_word: מָּנָה
  choice: Portion
  rationale: Das Substantiv bezeichnet einen zugeteilten Anteil an einer Mahlzeit. »Portion« bewahrt sowohl den Zuteilungscharakter als auch den konkreten Bezug zum Essen.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: die ich dir gegeben habe
  rationale: Die Formulierung bildet die einfache rückblickende Aussage des Hebräischen eng und natürlich ab.
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: von der ich zu dir sagte
  rationale: Die wiederholte Relativkonstruktion wird bewahrt, ohne die Portion mit dem Inhalt des anschließenden Zitats gleichzusetzen.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: Behalte sie bei dir
  rationale: Wörtlich steht »Lege sie zu/bei dir«. Im Zusammenhang ist das Verwahren der Portion gemeint; »Behalte sie bei dir« ist verständlich und bleibt nahe am hebräischen Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Relativkonstruktion des Hebräischen bleibt erkennbar; die direkte Rede wird natürlich formuliert.
