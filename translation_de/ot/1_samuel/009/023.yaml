  - severity: low
    issue: Die Fußnotenformulierung „Lege sie zu dir“ ist nicht idiomatisch
    rationale: Sie sollte nicht als deutsche wörtlichere Alternative angeboten werden. Das Hebräische kann knapp als „lege/stell sie bei dir hin“ umschrieben werden; kontextuell ist „behalte sie bei dir“ passend.
