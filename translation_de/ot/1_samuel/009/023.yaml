  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Elemente des Hebräischen zuverlässig wieder: Samuel spricht den für die Mahlzeit zuständigen Koch an, verlangt die zuvor übergebene Portion und verweist auf seine frühere Anweisung, sie bei sich zu behalten. „Bring“ ist im Kontext eine vertretbare idiomatische Wiedergabe von תְּנָה („gib“).'
  naturalness: Der Text ist insgesamt klar und würdevoll. „von der ich zu dir sagte“ klingt im modernen Standarddeutsch jedoch unnötig schwerfällig; „von der ich dir gesagt habe“ ist natürlicher, ohne den Bezug der zweiten Relativkonstruktion zu verlieren.
  terminology: „Koch“ und „Portion“ sind treffend. Die Fußnotenalternative „Lege sie zu dir“ ist im Deutschen nicht idiomatisch und bildet das Hebräische auch nicht besser ab. Eine sachliche Anmerkung zu „Schlachter“ sowie zu den wörtlicheren Verben ist ausreichend.
