source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֖ל רָאָ֣ה אֶת שָׁא֑וּל וַ/יהוָ֣ה עָנָ֔/הוּ הִנֵּ֤ה הָ/אִישׁ֙ אֲשֶׁ֣ר אָמַ֣רְתִּי אֵלֶ֔י/ךָ זֶ֖ה יַעְצֹ֥ר בְּ/עַמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: de
  text: 'Als Samuel Saul sah, antwortete ihm Jahwe: „Sieh, das ist der Mann, von dem ich zu dir gesprochen habe. Dieser wird über mein Volk herrschen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Dieser wird mein Volk zurückhalten / in Schranken halten.“ Das hebräische Verb kann „zurückhalten“, „unter Kontrolle halten“ oder in diesem Zusammenhang „herrschen, regieren“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: sah
  rationale: Das Verb bezeichnet hier in der fortlaufenden Erzählung schlicht das visuelle Wahrnehmen.
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im Deutschen geläufigen Form des Namens.
- source_word: עָנָהוּ
  choice: antwortete ihm
  rationale: Die Wiedergabe bewahrt die Grundbedeutung von ענה als „antworten/erwidern“, auch wenn im unmittelbaren Vers keine Frage vorausgeht.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die aufmerksamkeitslenkende Partikel wird mit einer natürlichen, würdevollen deutschen Aufforderung wiedergegeben.
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: der Mann, von dem ich zu dir gesprochen habe
  rationale: Die Formulierung gibt den bestimmten Ausdruck und den Rückverweis auf Jahwes frühere Mitteilung eng und idiomatisch wieder.
- source_word: זֶה
  choice: Dieser
  rationale: Das ausdrücklich gesetzte Demonstrativpronomen wird beibehalten und hebt Saul als den bezeichneten Mann hervor.
- source_word: יַעְצֹר
  choice: wird … herrschen
  rationale: Im Zusammenhang mit Sauls bevorstehender königlicher Leitungsfunktion bezeichnet עצר die Ausübung kontrollierender Herrschaft. Die wörtlichere Bedeutung „zurückhalten/in Schranken halten“ bleibt in der Fußnote sichtbar.
- source_word: בְּעַמִּי
  choice: über mein Volk
  rationale: In Verbindung mit עצר bezeichnet die Präposition hier den Bereich beziehungsweise Gegenstand der ausgeübten Herrschaft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen und entspricht der geläufigen deutschen Form.
- issue: Bedeutung von יַעְצֹר im Blick auf Sauls Königtum
  choice: wird über mein Volk herrschen
  alternative: wird mein Volk zurückhalten / in Schranken halten
  rationale: Der königliche Kontext legt die übertragene Bedeutung des Regierens nahe. Da das Verb zugleich das Zurückhalten oder Kontrollieren bezeichnen kann, wird diese Spannung nicht beseitigt, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Sieh“ erhält die hinweisende Kraft von הִנֵּה ohne das altertümlichere „Siehe“. Die Wiederholung „der Mann … Dieser“ bewahrt die Hervorhebung des hebräischen Textes.
