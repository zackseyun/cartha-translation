source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֧וּל לְ/נַעֲר֛/וֹ ט֥וֹב דְּבָרְ/ךָ֖ לְכָ֣/ה נֵלֵ֑כָה וַ/יֵּֽלְכוּ֙ אֶל הָ/עִ֔יר אֲשֶׁר שָׁ֖ם אִ֥ישׁ הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: de
  text: 'Da sagte Saul zu seinem jungen Begleiter: „Was du sagst, ist gut.[a] Komm, lass uns gehen!“ So gingen sie in die Stadt, in der der Mann Gottes[b] war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dein Wort ist gut“, das heißt: „Was du sagst, ist gut.“'
    reason: lexical_alternative
  - marker: b
    text: „Mann Gottes“ ist eine hebräische Bezeichnung, die häufig für einen Propheten oder einen Menschen gebraucht wird, der im Auftrag Gottes spricht.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: junger Begleiter
  rationale: Das Wort bezeichnet zunächst einen jungen Mann; im Zusammenhang ist er Saul untergeordnet und begleitet ihn. „Junger Begleiter“ bewahrt beide Aspekte, ohne vorschnell eine förmliche Dienerstellung festzulegen.
- source_word: טוֹב דְּבָרְךָ
  choice: Was du sagst, ist gut
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Vorschlag“ bedeuten. Saul stimmt hier dem zuvor geäußerten Vorschlag seines Begleiters zu; die gewählte Formulierung gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: לְכָה נֵלֵכָה
  choice: Komm, lass uns gehen
  rationale: Die Verbindung drückt eine Aufforderung beziehungsweise gemeinsame Entschlossenheit aus. Diese deutsche Wendung erhält den einladenden, hortativen Charakter.
- source_word: הָעִיר
  choice: die Stadt
  rationale: עִיר kann eine Stadt oder Ortschaft bezeichnen. „Stadt“ ist die übliche, dem bestimmten hebräischen Ausdruck entsprechende Wiedergabe.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die hebräische Bezeichnung ist ein geläufiger Titel für einen Propheten oder Gottesboten. Die direkte Wiedergabe erhält die Ausdrucksweise und theologische Prägung des Ausgangstextes.
- source_word: אֲשֶׁר שָׁם
  choice: in der ... war
  rationale: Die Verbindung aus Relativwort und Ortsadverb bezeichnet hier den Ort, an dem sich der Mann Gottes befand; „in der ... war“ ist im Deutschen natürlich und passt zur Stadt als Bezugswort.
theological_decisions:
- issue: Wiedergabe des Titels אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  alternative: der Prophet
  rationale: Obwohl der Ausdruck gewöhnlich einen Propheten oder einen Menschen bezeichnet, der für Gott spricht, verwendet der hebräische Text ausdrücklich diesen Titel. Die direkte Übersetzung vermeidet eine interpretierende Ersetzung und bewahrt die eigene theologische Sprache des Textes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die direkte Rede klingt natürlich, während der traditionelle und theologisch geprägte Titel „Mann Gottes“ erhalten bleibt.
