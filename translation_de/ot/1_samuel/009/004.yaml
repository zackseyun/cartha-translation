  register: Moderne, würdige Standardsprache. Die wiederholte Wegfolge und der auffällige Wechsel zwischen Singular („er zog“) und Plural („sie zogen/fanden“) des hebräischen Textes wurden bewahrt. Die Ortsnamen folgen einer gut lesbaren deutschen Umschrift.
