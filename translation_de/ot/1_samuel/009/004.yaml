  text: וַ/יַּעֲבֹ֧ר בְּ/הַר אֶפְרַ֛יִם וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ שָׁלִ֖שָׁה וְ/לֹ֣א מָצָ֑אוּ וַ/יַּעַבְר֤וּ בְ/אֶֽרֶץ שַׁעֲלִים֙ וָ/אַ֔יִן וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ יְמִינִ֖י וְ/לֹ֥א מָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: de
  text: Er zog durch das Bergland Ephraims und weiter durch das Gebiet von Schalischa, aber sie fanden sie[a] nicht. Dann zogen sie durch das Gebiet von Schaalim, doch sie waren nicht dort[b]. Danach zog er durch das Gebiet Benjamins, aber sie fanden sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Objekt steht im Hebräischen nicht ausdrücklich da; gemeint sind die im vorausgehenden Zusammenhang erwähnten verlorenen Eselinnen.
    reason: implicit_object
  - marker: b
    text: 'Wörtlich etwa: „doch da war nichts“ oder „doch es war nicht“; gemeint ist, dass die Eselinnen nicht dort waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: zog / zogen durch
  rationale: עבר mit בְ bezeichnet hier die Bewegung durch mehrere Gebiete. „Durchziehen“ gibt die fortlaufende Suche natürlich wieder; der Wechsel zwischen Singular und Plural bleibt erhalten.
- source_word: בְּהַר אֶפְרַיִם
  choice: durch das Bergland Ephraims
  rationale: הַר bezeichnet in dieser geografischen Verbindung kein einzelnes Gebirge oder einen einzelnen Berg, sondern das hügelige Bergland Ephraims.
- source_word: אֶרֶץ שָׁלִשָׁה / אֶרֶץ שַׁעֲלִים
  choice: das Gebiet von Schalischa / das Gebiet von Schaalim
  rationale: אֶרֶץ bezeichnet hier jeweils eine nach einem Ortsnamen benannte Landschaft oder Region. „Gebiet“ ist im modernen Deutschen natürlich und legt keinen politischen Status fest.
- source_word: וְלֹא מָצָאוּ
  choice: aber sie fanden sie nicht
  rationale: Das Subjekt ist pluralisch und umfasst Saul und seinen Begleiter. Das im Hebräischen unausgesprochene Objekt sind aufgrund des vorausgehenden Zusammenhangs die verlorenen Eselinnen; das Pronomen macht den Satz im Deutschen vollständig, ohne das Bezugswort erneut einzusetzen.
- source_word: וָאַיִן
  choice: doch sie waren nicht dort
  rationale: Die knappe elliptische Wendung bedeutet wörtlich etwa „und da war nichts/nicht“. Im Zusammenhang bezieht sie sich auf die gesuchten Eselinnen; die gewählte Formulierung gibt diesen Sinn idiomatisch wieder.
- source_word: אֶרֶץ יְמִינִי
  choice: das Gebiet Benjamins
  rationale: יְמִינִי ist eine zu Benjamin gehörige gentilizische Form. Im geografischen Zusammenhang ist „Gebiet Benjamins“ die klare und natürliche deutsche Wiedergabe.
theological_decisions: []
