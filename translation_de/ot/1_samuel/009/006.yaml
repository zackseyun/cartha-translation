  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: de
  text: 'Er sagte zu ihm: »Sieh doch, in dieser Stadt ist ein Mann Gottes. Der Mann steht in hohem Ansehen; alles, was er sagt, trifft ganz sicher ein. Lass uns jetzt dorthin gehen. Vielleicht wird er uns sagen, welchen Weg wir gehen sollen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unseren Weg, auf dem wir gegangen sind«. Die ungewöhnliche Formulierung kann sich auf den bereits eingeschlagenen Weg beziehen, meint im Zusammenhang aber wahrscheinlich den weiteren Weg oder die Richtung, die sie einschlagen sollen.'
    reason: Die Fußnote wahrt die auffällige hebräische Form mit »wir gegangen sind« und erläutert die im Kontext naheliegende zukunftsbezogene Bedeutung, ohne die Ambiguität zu verbergen.
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: Mann Gottes
  rationale: Die feste hebräische Bezeichnung wird mit der entsprechenden geläufigen deutschen Wendung wiedergegeben.
- source_word: נִכְבָּד
  choice: steht in hohem Ansehen
  rationale: Gibt die Bedeutung »geehrt, angesehen« natürlich und würdig wieder.
- source_word: בּוֹא יָבוֹא
  choice: trifft ganz sicher ein
  rationale: Die Verbindung aus Infinitiv und finitem Verb verstärkt die Gewissheit, dass seine Worte eintreffen.
- source_word: אֶת דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: etwas über den Weg sagen, den wir eingeschlagen haben
  rationale: Bewahrt die rückblickende Form des hebräischen Perfekts und lässt offen, ob Auskunft über den bisherigen Weg, den Fortgang der Reise oder die einzuschlagende Richtung gemeint ist.
theological_decisions:
- issue: Zuverlässigkeit der Worte des Mannes Gottes
  choice: »alles, was er sagt, trifft ganz sicher ein«
  alternative: »jedes seiner Worte wird gewiss kommen«
  rationale: Die deutsche Formulierung bewahrt die nachdrückliche Aussage, ohne eine zusätzliche Lehre über Prophetie einzutragen.
- issue: Bedeutung von דַּרְכֵּנוּ im letzten Satz
  choice: den eingeschlagenen Weg als bewusst offene Reiseaussage wiedergeben
  alternative: »welchen Weg wir gehen sollen«
  rationale: Der hebräische Wortlaut verwendet »wir sind gegangen« und bezeichnet nicht ausdrücklich eine Verpflichtung oder Weisung; die Fußnote nennt die im Kontext mögliche Zielbedeutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Sieh doch« nimmt הִנֵּה נָא idiomatisch auf; »Lass uns« ist natürliches Gegenwartsdeutsch. Die ungewöhnliche Schlusswendung wird im Text quellennahe und in der Fußnote transparent erläutert.
