    issue: Die Wiedergabe von יַגִּיד לָנוּ als »kann er uns etwas über ... sagen« ist abgeschwächt und zu unbestimmt.
    rationale: Das Verb bezeichnet ein Mitteilen bzw. Sagen, nicht bloß eine unverbindliche Auskunft »über« etwas. Der Kontext spricht für eine erbetene Wegweisung. Die textliche Mehrdeutigkeit der anschließenden Wegformulierung bleibt durch eine Fußnote kenntlich.
