source:
  edition: WLC
  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: de
  text: Morgen um diese Zeit werde ich einen Mann aus dem Gebiet Benjamins zu dir senden. Du sollst ihn zum Oberhaupt[a] über mein Volk Israel salben. Er wird mein Volk aus der Hand der Philister retten. Denn ich habe mein Volk gesehen, denn sein Hilfeschrei ist zu mir gekommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort nagid bezeichnet einen eingesetzten Regierenden oder Anführer; traditionell wird es auch mit „Fürst“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen „sein Hilfeschrei“; das singularische Fürwort bezieht sich auf das als Einheit aufgefasste „mein Volk“.
    reason: collective_singular
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: Morgen um diese Zeit
  rationale: Die Wendung bezeichnet denselben ungefähren Zeitpunkt am folgenden Tag; diese Formulierung ist im Deutschen natürlich und bewahrt die zeitliche Bestimmtheit.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: werde ich … zu dir senden
  rationale: Die Präposition אֶל bezeichnet die Richtung auf Samuel hin; „zu dir senden“ gibt sie ausdrücklich wieder.
- source_word: מֵאֶרֶץ בִּנְיָמִן
  choice: aus dem Gebiet Benjamins
  rationale: אֶרֶץ meint hier das Stammesgebiet Benjamins; „Gebiet“ ist im modernen Deutschen geografisch eindeutig.
- source_word: וּמְשַׁחְתּוֹ
  choice: Du sollst ihn … salben
  rationale: Das mit waw verbundene Perfekt hat in der göttlichen Anweisung an Samuel verpflichtenden Zukunfts- beziehungsweise Befehlscharakter.
- source_word: לְנָגִיד
  choice: zum Oberhaupt
  rationale: נָגִיד bezeichnet einen von Gott eingesetzten Regierenden oder Anführer, ohne an dieser Stelle einfach mit dem vollen Königstitel gleichgesetzt werden zu müssen.
- source_word: וְהוֹשִׁיעַ
  choice: Er wird … retten
  rationale: Die Form bezeichnet die aus der Einsetzung folgende künftige Rettung; „retten“ bewahrt sowohl den konkreten Befreiungssinn als auch die theologische Resonanz.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: aus der Hand der Philister
  rationale: Die hebräische Metapher der Hand für Macht und Gewalt ist auch im Deutschen verständlich und wird daher bewahrt.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: Denn ich habe mein Volk angesehen
  rationale: „angesehen“ bezeichnet hier Gottes aufmerksames Wahrnehmen der Not und vermeidet den im Deutschen missverständlichen Eindruck bloßen Sehens.
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: weil sein Hilfeschrei zu mir gedrungen ist
  rationale: Das singularische Suffix bezieht sich grammatisch auf das kollektive Singular „mein Volk“. „Hilfeschrei“ verdeutlicht den Notruf, während „zu mir gedrungen“ die Bewegung zu Gott natürlich wiedergibt.
theological_decisions:
- issue: Amtsbezeichnung נָגִיד bei Sauls Einsetzung
  choice: Oberhaupt
  alternative: Anführer; Fürst; Herrscher
  rationale: „Oberhaupt“ vermittelt die über Israel ausgeübte Leitungsgewalt, ohne נָגִיד vorschnell mit „König“ gleichzusetzen oder den modernen erbmonarchischen Beiklang von „Fürst“ einzutragen.
- issue: Gottes Sehen des Volkes
  choice: ich habe mein Volk angesehen
  alternative: ich habe mein Volk gesehen; ich habe auf mein Volk geblickt
  rationale: Die Übersetzung wahrt die Aussage, dass Gott die Not seines Volkes wahrnimmt, ohne eine weitergehende theologische Deutung in den Wortlaut einzubauen.
- issue: Singularisches Suffix in צַעֲקָתוֹ
  choice: sein Hilfeschrei
  alternative: ihr Hilfeschrei
  rationale: Der deutsche Singular nimmt das unmittelbar vorausgehende kollektive „mein Volk“ grammatisch genau auf. Eine Fußnote erklärt die Konstruktion, damit „sein“ nicht fälschlich auf eine einzelne männliche Person bezogen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, wird aber zur besseren Verständlichkeit in mehrere Hauptsätze gegliedert. „Oberhaupt“ vermeidet sowohl eine vorschnelle Gleichsetzung mit „König“ als auch den heute missverständlichen Titel „Fürst“.
