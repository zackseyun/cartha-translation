base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: de
  text: 'Als sie in das Gebiet von Zuf kamen, sagte Saul zu dem jungen Mann, der bei ihm war: »Komm, lass uns umkehren! Sonst hört mein Vater noch auf, sich um die Eselinnen zu kümmern, und macht sich Sorgen um uns.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: in das Gebiet von Zuf kamen
  rationale: בוא mit ב bezeichnet hier das Hineingelangen in eine Gegend. »Gebiet« gibt אֶרֶץ bei dieser regionalen Bezeichnung natürlicher wieder als »Land«.
- source_word: נַעַר
  choice: junger Mann
  rationale: נַעַר kann einen jungen Mann oder Diener bezeichnen. Die Wiedergabe bewahrt die Grundbedeutung, ohne seinen sozialen Status genauer festzulegen, als der Text es tut.
- source_word: לְכָה וְנָשׁוּבָה
  choice: Komm, lass uns umkehren
  rationale: Imperativ und Kohortativ bilden eine Aufforderung. »Umkehren« passt zur beabsichtigten Rückkehr von der Suche.
- source_word: פֶּן
  choice: sonst ... noch
  rationale: פֶּן leitet die befürchtete Folge ein; die deutsche Wendung »sonst ... noch« gibt diesen warnenden Sinn natürlich wieder.
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: aufhört, sich um die Eselinnen zu kümmern
  rationale: חדל mit מן bedeutet, eine Beschäftigung mit etwas einzustellen. אֲתֹנוֹת bezeichnet ausdrücklich weibliche Esel.
- source_word: וְדָאַג לָנוּ
  choice: und macht sich Sorgen um uns
  rationale: דאג bezeichnet Besorgnis oder Angst; mit לָנוּ ist die Gruppe um Saul Gegenstand der Sorge.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher direkter Rede. Die koordinierte hebräische Verbfolge wird idiomatisch wiedergegeben; die konkrete Geschlechtsangabe der Tiere bleibt als »Eselinnen« erhalten.
