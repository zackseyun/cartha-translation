  naturalness: Die deutsche Sprache ist insgesamt modern und flüssig. „Da kam Samuel gerade heraus, ihnen entgegen“ ist ebenso natürlich und bildet die gleichzeitige erzählerische Bewegung präziser ab. Die Fußnote ist verständlich, sollte die als Alternative mögliche Lesart „im Inneren der Stadt“ knapp und ohne die irreführende Gleichsetzung mit einer zwingenden Stadtmitte formulieren.
  terminology: „Stadt“ und „Kulthöhe“ sind angemessen. „Kulthöhe“ gibt במה als kultisch geprägten, erhöhten Ort wieder, ohne eine spätere wertende Beurteilung einzutragen.
