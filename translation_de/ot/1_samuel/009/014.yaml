  text: וַֽ/יַּעֲל֖וּ הָ/עִ֑יר הֵ֗מָּה בָּאִים֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וְ/הִנֵּ֤ה שְׁמוּאֵל֙ יֹצֵ֣א לִ/קְרָאתָ֔/ם לַ/עֲל֖וֹת הַ/בָּמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: de
  text: So gingen sie zur Stadt hinauf. Als sie gerade in die Stadt hineinkamen[a], kam Samuel heraus, ihnen entgegen, um zur Kulthöhe hinaufzugehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Inneren der Stadt«; wörtlich auch: »mitten in der Stadt«.'
    reason: בְּתוֹךְ הָעִיר bezeichnet den Bereich innerhalb der Stadt und kann je nach Kontext auch „mitten in der Stadt“ bedeuten. Die Übersetzung fasst die Verbindung mit dem Vorgang des Hineinkommens idiomatisch auf.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: So gingen sie … hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „hinaufgehen“ ist im Deutschen natürlich und bewahrt die topografische Nuance.
- source_word: הָעִיר
  choice: die Stadt
  rationale: עיר kann Stadt oder Ortschaft bezeichnen; „Stadt“ ist hier die übliche, kontextgerechte Wiedergabe.
- source_word: הֵמָּה בָּאִים
  choice: Als sie gerade … kamen
  rationale: Das selbstständige Pronomen mit Partizip stellt den Vorgang als im Verlauf befindlich dar; „gerade“ macht diese Gleichzeitigkeit im Deutschen deutlich.
- source_word: בְּתוֹךְ הָעִיר
  choice: in die Stadt kamen
  rationale: Wörtlich steht „inmitten/in der Mitte der Stadt“. Im Zusammenhang mit באים ist idiomatisch das Hineinkommen in die Stadt gemeint; die wörtlichere räumliche Möglichkeit bleibt in der Fußnote erhalten.
- source_word: וְהִנֵּה
  choice: kam ihnen … entgegen
  rationale: הנה lenkt den Blick auf das überraschende Zusammentreffen. Statt des im modernen Deutschen auffälligen „siehe“ vermittelt die unmittelbare Satzgestaltung die narrative Anschaulichkeit.
- source_word: יֹצֵא לִקְרָאתָם
  choice: kam ihnen Samuel entgegen
  rationale: Das Partizip יצא und לקראת beschreiben Samuel, wie er herauskommt und sich ihnen entgegenbewegt. Die deutsche Wendung gibt den Vorgang flüssig wieder.
- source_word: לַעֲלוֹת
  choice: auf dem Weg hinauf
  rationale: Der Infinitiv bezeichnet den Zweck beziehungsweise das Ziel von Samuels Herausgehen. Die Formulierung bewahrt sowohl Absicht als auch Aufwärtsrichtung.
- source_word: הַבָּמָה
  choice: die Kulthöhe
  rationale: במה bezeichnet hier eine erhöhte Kult- und Opferstätte. „Kulthöhe“ ist im Deutschen präziser und verständlicher als das missverständliche „Höhe“, ohne die Stätte wertend als illegitim einzuordnen.
theological_decisions:
- issue: Wiedergabe der Kultstätte במה
  choice: Kulthöhe
  alternative: Heiligtum auf der Höhe; Höhe
  rationale: „Kulthöhe“ bewahrt die historische Kultbezeichnung, macht die religiöse Funktion deutlich und trägt keine spätere theologische Verurteilung in den Vers ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah an der hebräischen Erzählbewegung, während unnatürliches „siehe“ vermieden wird. Die Wiederholung von עלה wird durch „hinauf“ an beiden Stellen erkennbar gehalten.
