  text: וְ/לָ/אֲתֹנ֞וֹת הָ/אֹבְד֣וֹת לְ/ךָ֗ הַ/יּוֹם֙ שְׁלֹ֣שֶׁת הַ/יָּמִ֔ים אַל תָּ֧שֶׂם אֶֽת לִבְּ/ךָ֛ לָ/הֶ֖ם כִּ֣י נִמְצָ֑אוּ וּ/לְ/מִי֙ כָּל חֶמְדַּ֣ת יִשְׂרָאֵ֔ל הֲ/ל֣וֹא לְ/ךָ֔ וּ/לְ/כֹ֖ל בֵּ֥ית אָבִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: de
  text: 'Was aber die Eselinnen betrifft, die dir vor drei Tagen verloren gegangen sind: Mach dir um sie keine Gedanken, denn sie sind gefunden worden. Und wem gilt all das Verlangen Israels?[a] Gilt es nicht dir und dem ganzen Haus deines Vaters?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und wem gehört alles Begehrenswerte in Israel?“ Die hebräische Wendung kann sowohl das bezeichnen, was Israel begehrt, als auch das, was in Israel kostbar oder begehrenswert ist.'
    reason: lexical_alternative
  - marker: b
    text: „Haus deines Vaters“ bezeichnet hier nicht nur die unmittelbare Kernfamilie, sondern einen größeren Familien- oder Sippenverband.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: Eselinnen
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich weibliche Esel. Im Deutschen ist „Eselinnen“ natürlich und bewahrt diese Einzelheit ohne Umständlichkeit.
- source_word: הָאֹבְדוֹת לְךָ
  choice: die dir … verloren gegangen sind
  rationale: Die Form beschreibt die Tiere als vermisst beziehungsweise verloren; die deutsche Wendung gibt zugleich den Bezug zu Saul idiomatisch wieder.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: vor drei Tagen
  rationale: Die wörtlich ungewöhnliche hebräische Zeitangabe bezeichnet idiomatisch einen Zeitpunkt drei Tage zuvor.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: Mach dir um sie keine Gedanken
  rationale: Die hebräische Herz-Wendung meint, seine innere Aufmerksamkeit oder Sorge auf etwas zu richten. Die gewählte Formulierung ist im heutigen Deutsch klar und natürlich.
- source_word: נִמְצָאוּ
  choice: sie sind gefunden worden
  rationale: Das Nifal Perfekt wird als passives Geschehen mit gegenwärtigem Ergebnis wiedergegeben.
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: Und wem gilt all das Verlangen Israels?
  rationale: חֶמְדַּת kann das Verlangen Israels oder das in Israel Begehrenswerte bezeichnen. Die Hauptfassung bewahrt die knappe, feierliche Aussage und macht durch eine Fußnote auf die echte lexikalische Alternative aufmerksam.
- source_word: הֲלוֹא
  choice: Gilt es nicht
  rationale: Die rhetorische Frage, die Zustimmung erwartet, bleibt als Frage erhalten und knüpft im Deutschen klar an „Verlangen“ an.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: dir und dem ganzen Haus deines Vaters
  rationale: „Haus des Vaters“ bezeichnet im Hebräischen einen größeren Familien- und Sippenverband. Die traditionelle Sozialbezeichnung bleibt im Haupttext sichtbar.
theological_decisions:
- issue: Bedeutung von Samuels Aussage über חֶמְדַּת יִשְׂרָאֵל
  choice: Die Aussage bleibt als gehobene, mehrdeutige rhetorische Anspielung auf Saul und sein Vaterhaus formuliert.
  alternative: Die Wendung könnte ausdrücklich auf das von Israel begehrte Königtum oder auf alles Wertvolle und Begehrenswerte in Israel bezogen werden.
  rationale: Der Zusammenhang bereitet Sauls Berufung vor, doch der Vers nennt das Königtum nicht ausdrücklich. Die Übersetzung trägt diese Deutung daher nicht zusätzlich in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verlorenen Tiere werden konkret als „Eselinnen“ bezeichnet. Die Sorgeformel ist idiomatisch wiedergegeben; die verdichtete und theologisch bedeutsame Mehrdeutigkeit von חֶמְדַּת יִשְׂרָאֵל bleibt erhalten und wird in der Fußnote erläutert.
