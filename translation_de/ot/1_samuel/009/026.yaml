source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֗מוּ וַ/יְהִ֞י כַּ/עֲל֤וֹת הַ/שַּׁ֨חַר֙ וַ/יִּקְרָ֨א שְׁמוּאֵ֤ל אֶל שָׁאוּל֙ ה/גג לֵ/אמֹ֔ר ק֖וּמָ/ה וַ/אֲשַׁלְּחֶ֑/ךָּ וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּצְא֧וּ שְׁנֵי/הֶ֛ם ה֥וּא וּ/שְׁמוּאֵ֖ל הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: de
  text: 'Sie standen früh auf. Als die Morgendämmerung heraufzog[a], rief Samuel Saul auf dem Dach zu: »Steh auf, ich will dich auf den Weg schicken[b].« Da stand Saul auf, und die beiden, er und Samuel, gingen hinaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »als die Morgendämmerung aufstieg«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ich will dich entlassen«. Das hebräische Verb kann bedeuten, jemanden zu entlassen oder ihn aufbrechen zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: Sie standen früh auf
  rationale: Die Hifil-Form von שׁכם bezeichnet hier das frühe Aufstehen beziehungsweise den frühen Tagesbeginn. Die deutsche Wiedergabe ist natürlich und bewahrt den zeitlichen Akzent.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: Als die Morgendämmerung heraufzog
  rationale: Die Wendung bedeutet wörtlich etwa »beim Aufsteigen der Morgendämmerung«. »Heraufzog« bewahrt das Bild und klingt zugleich in modernem Deutsch natürlich.
- source_word: הַגָּג
  choice: auf dem Dach
  rationale: Gemeint ist das flache Hausdach, auf dem Saul nach dem vorhergehenden Vers übernachtet hatte. Die knappe Ortsangabe entspricht dem Kontext, ohne zusätzliche Einzelheiten einzutragen.
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ fordert Saul zum Aufstehen auf. »Steh auf« ist gegenwärtiges, klares Deutsch und passt zur direkten Rede.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: ich will dich auf den Weg schicken
  rationale: שׁלח kann hier das Entlassen oder Verabschieden eines Gastes bezeichnen. Die Formulierung gibt den höflichen Aufbruchssinn wieder, ohne das mögliche Bedeutungsspektrum zu verschweigen.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: gingen hinaus
  rationale: Verb und Richtungsangabe bezeichnen das Hinausgehen. Die Übersetzung bleibt knapp und legt kein im Hebräischen ungenanntes Ziel fest.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: die beiden, er und Samuel
  rationale: Die auffällige hebräische Apposition wird bewahrt. Das Pronomen »er« verweist im Zusammenhang eindeutig auf Saul und erhält die emphatische Struktur des Ausgangstextes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Syntax. Die direkte Rede ist alltagstauglich, ohne umgangssprachlich zu wirken. Die im Hebräischen betonte Apposition »er und Samuel« bleibt erhalten.
