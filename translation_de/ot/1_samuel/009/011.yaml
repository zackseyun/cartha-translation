base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: de
  text: 'Als sie den Weg zur Stadt hinaufgingen, trafen sie junge Frauen, die herauskamen, um Wasser zu schöpfen. Sie fragten diese: »Ist der Seher[a] hier?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Prophet«. Im Hebräischen steht ausdrücklich »Seher«, eine ältere Bezeichnung für das, was später »Prophet« genannt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: hinaufgingen
  rationale: Das Partizip bezeichnet hier eine im Verlauf befindliche Handlung; zusammen mit »als« gibt »hinaufgingen« dies im Deutschen natürlich wieder.
- source_word: בְּמַעֲלֵה הָעִיר
  choice: den Weg zur Stadt hinauf
  rationale: מַעֲלֶה bezeichnet den Aufstieg beziehungsweise den ansteigenden Zugang. Die Formulierung bewahrt die topografische Vorstellung und klingt zugleich natürlich.
- source_word: מָצְאוּ
  choice: begegneten ihnen
  rationale: Das Verb bedeutet grundsätzlich »finden«, bezeichnet in diesem Zusammenhang aber das Zusammentreffen auf dem Weg; »begegneten ihnen« ist im modernen Deutsch idiomatischer.
- source_word: נְעָרוֹת
  choice: junge Frauen
  rationale: Der Ausdruck bezeichnet weibliche Jugendliche beziehungsweise junge Frauen. Diese Wiedergabe ist modern und vermeidet sowohl das möglicherweise zu junge »Mädchen« als auch altertümliche Bezeichnungen.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: die herauskamen, um Wasser zu schöpfen
  rationale: Partizip und Infinitiv drücken eine laufende Bewegung mit Zweck aus. »Wasser schöpfen« entspricht dem Vorgang am Brunnen.
- source_word: הֲיֵשׁ בָּזֶה
  choice: Ist ... hier?
  rationale: Die hebräische Wendung fragt knapp nach der Anwesenheit einer Person an diesem Ort; »hier« ist die natürliche deutsche Entsprechung.
- source_word: הָרֹאֶה
  choice: der Seher
  rationale: Der hebräische Text verwendet ausdrücklich die ältere Bezeichnung »Seher«. Sie wird beibehalten, statt sie stillschweigend mit »Prophet« gleichzusetzen.
theological_decisions:
- issue: Historische Amtsbezeichnung הָרֹאֶה
  choice: Seher
  alternative: Prophet
  rationale: »Seher« wahrt die besondere Terminologie des hebräischen Textes und die im Kontext erkennbare begriffsgeschichtliche Spannung, ohne eine spätere Bezeichnung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für einen flüssigen Erzählstil leicht geglättet; die historische Bezeichnung »Seher« und die topografische Aufwärtsbewegung bleiben erhalten.
