base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: de
  text: 'Der junge Mann antwortete Saul noch einmal: „Sieh, ich habe einen Viertelschekel Silber bei mir. Den gebe ich dem Mann Gottes, und er wird uns über unseren Weg Auskunft geben.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unseren Weg“. Gemeint sein kann sowohl der vor ihnen liegende Weg als auch das weitere Vorgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַעֲנוֹת
  choice: antwortete ... noch einmal
  rationale: Die Verbindung von יסף mit dem Infinitiv bezeichnet eine wiederholte oder fortgesetzte Handlung. Im Zusammenhang reagiert der junge Mann erneut auf Saul.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נער kann einen Jungen, jungen Mann oder Diener bezeichnen. Hier bewahrt „junger Mann“ die Grundbedeutung, ohne seine soziale Rolle ausdrücklich in den Text einzutragen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Interjektion lenkt die Aufmerksamkeit auf das nun vorgezeigte Silber; „Sieh“ ist knapp, gegenwärtig und würdevoll.
- source_word: נִמְצָא בְיָדִי
  choice: ich habe ... bei mir
  rationale: Wörtlich steht „befindet sich in meiner Hand“. Die deutsche Wendung gibt den Besitz idiomatisch wieder, ohne eine tatsächlich ausgestreckte Hand vorauszusetzen.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: einen Viertelschekel Silber
  rationale: Die Formulierung bezeichnet ein Viertel eines Schekels als Silbergewicht beziehungsweise Zahlungsmittel. „Viertelschekel“ ist präzise und knapp.
- source_word: וְנָתַתִּי
  choice: Den gebe ich
  rationale: Das Perfekt drückt hier im Gespräch eine beabsichtigte, unmittelbar vorgeschlagene Handlung aus. Das vorangestellte „Den“ nimmt den genannten Silberbetrag natürlich auf.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: dem Mann Gottes
  rationale: „Mann Gottes“ ist die transparente und etablierte deutsche Wiedergabe dieses hebräischen Titels.
- source_word: וְהִגִּיד לָנוּ
  choice: und er wird uns sagen
  rationale: Der Hifil von נגד bedeutet hier „mitteilen, sagen, kundtun“. „Uns sagen“ passt natürlich zur Erzählung.
- source_word: אֶת דַּרְכֵּנוּ
  choice: welchen Weg wir gehen sollen
  rationale: Wörtlich lautet die Wendung „unseren Weg“. Im Kontext geht es um den zu nehmenden Weg beziehungsweise das weitere Vorgehen; die Wiedergabe macht diesen Sinn im Deutschen verständlich, während die Fußnote die wörtliche Form und ihre Spannweite bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp. Das altertümliche „Siehe“ wird vermieden; „Sieh“ bewahrt dennoch die aufmerksamkeitslenkende Funktion von הִנֵּה.
