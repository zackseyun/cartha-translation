  text: וַ/יֹּ֨אמֶר לַ/אֲנָשָׁ֜י/ו חָלִ֧ילָ/ה לִּ֣/י מֵֽ/יהוָ֗ה אִם אֶעֱשֶׂה֩ אֶת הַ/דָּבָ֨ר הַ/זֶּ֤ה לַֽ/אדֹנִ/י֙ לִ/מְשִׁ֣יחַ יְהוָ֔ה לִ/שְׁלֹ֥חַ יָדִ֖/י בּ֑/וֹ כִּֽי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: de
  text: 'Und er sagte zu seinen Männern: »Yahweh bewahre mich davor[a], meinem Herrn, dem Gesalbten Yahwehs, so etwas anzutun, nämlich meine Hand gegen ihn auszustrecken; denn er ist der Gesalbte Yahwehs.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Fern sei es mir, von Yahweh her«; sinngemäß auch: »Fern sei es mir um Yahwehs willen.« Die hebräische Wendung drückt entschiedene Abscheu vor einer solchen Tat in Bezug auf Yahweh aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Yahweh bewahre mich davor
  rationale: Die hebräische Wendung drückt eine entschiedene, auf Yahweh bezogene Abscheu und Zurückweisung aus. Die natürliche deutsche Idiomatik wahrt diesen Sinn besser als eine räumlich missverständliche Wiedergabe mit „von Yahweh her“.
- source_word: אִם אֶעֱשֶׂה
  choice: … anzutun
  rationale: Nach חָלִילָה gehört אִם zu einer formelhaften Zurückweisung; im Deutschen wird sie natürlich durch „davor, … zu tun“ wiedergegeben, nicht als reale Bedingung mit „wenn“.
- source_word: הַדָּבָר הַזֶּה
  choice: so etwas
  rationale: דָּבָר bezeichnet hier die erwogene Tat. „So etwas“ ist gegenwärtiges, natürliches Deutsch und lässt den Ausdruck ebenso allgemein wie das Hebräische.
- source_word: לַאדֹנִי
  choice: meinem Herrn
  rationale: Die respektvolle Anrede für Saul wird bewahrt. Das deutsche „Herrn“ ist hier ein menschlicher Hoheitstitel und wird daher großgeschrieben.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: dem Gesalbten Yahwehs
  rationale: מָשִׁיחַ bezeichnet Saul als den von Yahweh zum König Gesalbten. „Gesalbter“ bewahrt den königlich-sakralen Sinn, ohne die spätere messianische Bedeutung vorschnell einzutragen.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: meine Hand gegen ihn auszustrecken
  rationale: Die körperliche Bildsprache des hebräischen Gewaltidioms bleibt erhalten; „gegen ihn“ macht seine feindliche Richtung deutlich.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: denn er ist der Gesalbte Yahwehs
  rationale: כִּי begründet Davids Weigerung. Die Wiederholung des Titels entspricht dem hebräischen Nachdruck.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחַ in Bezug auf Saul
  choice: der Gesalbte Yahwehs
  alternative: der Messias Yahwehs
  rationale: Im Kontext bezeichnet das Wort Saul als den durch Salbung eingesetzten König. „Messias“ könnte hier unbeabsichtigt spätere christologische Vorstellungen in den Text eintragen.
- issue: Bezug der Wendung חָלִילָה לִּי מֵיְהוָה
  choice: Yahweh bewahre mich davor
  alternative: Fern sei es von mir um Yahwehs willen
  rationale: Die Hauptfassung gibt die auf Yahweh bezogene Zurückweisung idiomatisch wieder, ohne abschließend festzulegen, ob מֵיְהוָה vor allem Ursprung, Verbot oder ehrfürchtige Begründung bezeichnet; die Fußnote macht die formnähere Alternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber der hebräischen Reihung leicht geglättet, während die Wiederholung von „der Gesalbte Yahwehs“ und das Bild vom Ausstrecken der Hand erhalten bleiben.
