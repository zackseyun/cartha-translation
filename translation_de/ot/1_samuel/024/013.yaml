id: 1SA.24.13
reference: 1 Samuel 24:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִשְׁפֹּ֤ט יְהוָה֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/נְקָמַ֥/נִי יְהוָ֖ה מִמֶּ֑/ךָּ וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: de
  text: Yahweh möge zwischen mir und dir richten und für mich an dir Rache nehmen.[a] Doch ich werde nicht Hand an dich legen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und mich an dir rächen“. Gemeint ist, dass Yahweh selbst David rächt beziehungsweise für ihn Vergeltung übt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Doch meine Hand soll nicht gegen dich sein.“ Die hebräische Wendung bezeichnet den Verzicht auf eigenes feindliches oder gewaltsames Handeln.'
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: möge … richten
  rationale: Das Yiqtol hat hier im Zusammenhang von Davids Anrufung wahrscheinlich jussivischen Sinn. „Möge … richten“ gibt den Wunsch beziehungsweise Appell wieder, ohne ihn als bloße Zukunftsaussage festzulegen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: zwischen mir und dir
  rationale: Die direkte Formulierung bewahrt den rechtlichen Klang und den ausdrücklichen Gegensatz zwischen den beiden Personen.
- source_word: וּנְקָמַנִי … מִמֶּךָּ
  choice: und für mich an dir Rache nehmen
  rationale: נקם bezeichnet Vergeltung beziehungsweise Rache; das Objektsuffix wird im Deutschen natürlich mit „für mich“ wiedergegeben, während מן die Person bezeichnet, an der die Vergeltung vollzogen wird.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: Doch ich werde nicht Hand an dich legen
  rationale: Die natürliche deutsche Wendung gibt das hebräische Bild der „Hand“ als Ausdruck eigenen feindlichen Handelns wieder. „Doch“ macht den sachlichen Gegensatz zwischen Yahwehs Vergeltung und Davids Verzicht auf Gewalt deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Yahweh“ bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Davids Bitte um נקם
  choice: für mich an dir Rache nehmen
  alternative: mich dir gegenüber ins Recht setzen
  rationale: 'Der Ausdruck wird nicht zur bloßen Rechtfertigung abgeschwächt. Zugleich bleibt durch den folgenden Satz der entscheidende Gegensatz erhalten: David überlässt die Vergeltung Yahweh und verzichtet selbst auf einen Angriff.'
- issue: Modalität von יִשְׁפֹּט und וּנְקָמַנִי
  choice: als Wunsch beziehungsweise Anrufung mit „möge“
  alternative: als Zukunftsaussage mit „wird“
  rationale: Der Kontext stützt eine jussivische Lesart. Die Übersetzung behauptet daher nicht, David spreche lediglich eine sichere Zukunftsprognose aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die jussivische Anrufung wird mit „möge“ ausgedrückt; die idiomatische Wendung „Hand an jemanden legen“ hält das Bild der Hand lebendig und bleibt für heutige Leser verständlich.
