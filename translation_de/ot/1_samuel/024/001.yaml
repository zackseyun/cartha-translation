  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „zog … hinauf“ gibt die Richtung in natürlichem deutschem Erzählstil wieder.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die Wendung entspricht dem deiktischen Ausdruck präzise und idiomatisch.
- source_word: וַיֵּשֶׁב
  choice: hielt sich … auf
  rationale: ישב kann sitzen, wohnen, bleiben oder sich aufhalten bedeuten. Im Zusammenhang von Davids Flucht bezeichnet „hielt sich … auf“ einen vorübergehenden Aufenthalt, ohne eine dauerhafte Ansiedlung nahezulegen.
- source_word: בִּמְצָדוֹת
  choice: in den Bergfesten
  rationale: מְצָדוֹת bezeichnet befestigte oder natürlich geschützte Zufluchtsorte. „Bergfesten“ bewahrt den defensiven Charakter, ohne zwingend vollständig ausgebaute Festungsanlagen vorauszusetzen.
- source_word: עֵין גֶּדִי
  choice: En-Gedi
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition transliteriert und mit Bindestrich geschrieben.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. „Bergfesten“ ist anschaulich und im biblisch-historischen Kontext verständlich; die Formulierung vermeidet das altertümliche „wohnte“ sowie die mögliche Dauerhaftigkeit von „ließ sich nieder“.
