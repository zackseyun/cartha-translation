  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: de
  text: Danach schlug Davids Herz[a] ihn, weil er den Zipfel von Sauls Gewand[b] abgeschnitten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Davids Herz schlug ihn“; die hebräische Wendung beschreibt ein beunruhigtes Gewissen.'
    reason: lexical_alternative
  - marker: b
    text: Auch „Rand“ oder „Saum“; das hebräische Wort bezeichnet hier einen äußersten Teil des Kleidungsstücks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die knappe Zeitangabe gibt die Abfolge natürlich wieder, ohne die hebräische Erzählungsformel unnötig nachzubilden.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: schlug David das Herz
  rationale: Die Formulierung bewahrt das Herz als handelndes Subjekt und die Bildkraft des hebräischen Ausdrucks. Im Deutschen lässt sie innere Unruhe erkennen; die Fußnote erläutert die wörtliche Konstruktion und den Gewissensbezug.
- source_word: עַל אֲשֶׁר
  choice: weil
  rationale: Die Konjunktion gibt den Grund für Davids innere Reaktion klar und idiomatisch wieder.
- source_word: כָּרַת
  choice: abgeschnitten hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass das Abschneiden der anschließenden Gewissensreaktion vorausging; „abschneiden“ entspricht der Bedeutung des Verbs.
- source_word: כָּנָף
  choice: Zipfel
  rationale: Das Substantiv bezeichnet wörtlich einen Flügel und übertragen einen äußersten Teil eines Kleidungsstücks. „Zipfel“ ist im Zusammenhang natürlich, ohne die Bedeutung auf einen Saum festzulegen.
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: den Zipfel von Sauls Gewand
  rationale: „Gewand“ ist aus dem unmittelbaren Kontext ergänzt und macht den Bezug im Deutschen verständlich; der hebräische Ausdruck nennt den Saul gehörenden Zipfel.
theological_decisions:
- issue: Davids innere Reaktion
  choice: Das Bild vom schlagenden Herzen bleibt im Haupttext erhalten.
  alternative: „David bekam Gewissensbisse“ oder „sein Gewissen schlug ihn“
  rationale: Der hebräische Text spricht vom Herzen und lässt dessen innere, moralische Funktion bildhaft erkennen. Eine direkte Ersetzung durch „Gewissen“ wäre deutlicher, aber stärker auslegend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht bildhafte Wendung „schlug David das Herz“ hält die hebräische Ausdrucksweise erkennbar, während die Fußnote ihre moralische Bedeutung erläutert.
