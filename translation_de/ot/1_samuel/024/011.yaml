base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: de
  text: 'Sieh, an diesem Tag haben deine eigenen Augen gesehen, dass Jahwe dich heute in der Höhle in meine Hand gegeben hat. Da sagte jemand, ich solle dich töten,[a] doch mein Auge schonte dich.[b] Ich sagte: »Ich werde meine Hand nicht gegen meinen Herrn ausstrecken, denn er ist der Gesalbte Jahwes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und er sagte, man solle dich töten“, „und es hieß, ich solle dich töten“ oder „und ich sagte, ich wolle dich töten“. Im Hebräischen steht ein Verb in der Einzahl, dessen Subjekt nicht ausdrücklich genannt wird.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich steht ein Verb in der 3. Person Singular feminin; wahrscheinlich ist „mein Auge“ mitzudenken. Auch möglich: „doch ich verschonte dich“ oder „doch ich hatte Mitleid mit dir“. Das hebräische Verb kann ein aus Erbarmen gewährtes Verschonen ausdrücken.'
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Leitet einen nachdrücklichen Hinweis ein; „Sieh“ ist modern und bewahrt die hinweisende Kraft.
- source_word: רָאוּ עֵינֶיךָ
  choice: deine eigenen Augen haben gesehen
  rationale: Bewahrt das hebräische Bild der Augen als unmittelbare Zeugen und dessen Nachdruck.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: Jahwe hat dich ... in meine Hand gegeben
  rationale: Die Wendung bezeichnet die Übergabe in Davids Gewalt; die bildhafte Ausdrucksweise bleibt transparent erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: und es hieß, ich solle dich töten
  rationale: Das singularische Verb hat kein ausdrücklich genanntes Subjekt. Die unpersönliche deutsche Form bewahrt die unbestimmte Urheberschaft, ohne stillschweigend David oder eine bestimmte andere Person einzusetzen.
- source_word: וַתָּחָס עָלֶיךָ
  choice: aber ich verschonte dich
  rationale: Im Zusammenhang bezeichnet das Verb das Schonung gewährende Absehen vom Töten; die erste Person ergibt sich aus Davids Redezusammenhang.
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: ich werde meine Hand nicht ... ausstrecken
  rationale: Bewahrt die hebräische Redewendung für einen feindlichen oder gewaltsamen Angriff und bleibt im Deutschen verständlich.
- source_word: בַּאדֹנִי
  choice: gegen meinen Herrn
  rationale: Bezeichnet Saul als Davids menschlichen König und Vorgesetzten; „Herr“ erhält den höfisch-politischen Sinn.
- source_word: מְשִׁיחַ יְהוָה
  choice: der Gesalbte Jahwes
  rationale: Bezeichnet hier den von Jahwe zum König Gesalbten und vermeidet eine vorschnelle Gleichsetzung mit einem später verselbstständigten messianischen Titel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen; die Umschrift bewahrt ihn als Eigennamen.
- issue: Bedeutung von מְשִׁיחַ יְהוָה im königlichen Erzählzusammenhang
  choice: der Gesalbte Jahwes
  alternative: Jahwes Messias
  rationale: Gemeint ist Saul in seiner durch Salbung verliehenen Königswürde. „Gesalbter“ erhält diesen unmittelbaren Kontext, ohne die Wendung auf eine spätere messianische Titelfunktion festzulegen.
- issue: Unbestimmtes Subjekt in וְאָמַר
  choice: es hieß, ich solle dich töten
  alternative: ich sagte, ich wolle dich töten
  rationale: Das masoretische Verb ist dritte Person Singular und nennt kein Subjekt. Die gewählte unpersönliche Form bewahrt diese textliche Schwierigkeit, statt sie theologisch oder erzählerisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „heute“ und das Bild „in meine Hand gegeben“ bleiben wegen ihres Nachdrucks und ihrer erzählerischen Bedeutung erhalten. Die schwierige unbestimmte Verbform wird im Haupttext nicht auf eine bestimmte handelnde Person festgelegt.
