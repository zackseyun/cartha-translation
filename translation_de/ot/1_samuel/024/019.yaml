    rationale: Das hebräische Perfekt schildert das Übergeben als vorausliegende Voraussetzung dafür, dass David Saul nicht tötete. Das deutsche Plusquamperfekt („gegeben hatte“) bildet dieses Verhältnis klar und natürlich ab.
