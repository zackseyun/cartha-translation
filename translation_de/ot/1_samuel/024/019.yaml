  text: ו/את הִגַּ֣דְתָּ הַ/יּ֔וֹם אֵ֛ת אֲשֶׁר עָשִׂ֥יתָה אִתִּ֖/י טוֹבָ֑ה אֵת֩ אֲשֶׁ֨ר סִגְּרַ֧/נִי יְהוָ֛ה בְּ/יָדְ/ךָ֖ וְ/לֹ֥א הֲרַגְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: de
  text: 'Und du hast heute gezeigt, wie gut du an mir gehandelt hast: Als Jahwe mich in deine Hand gegeben hatte[a], hast du mich nicht getötet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als Jahwe mich dir auslieferte“ beziehungsweise „mich in deine Gewalt gab“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: hast erkennen lassen
  rationale: Das Hifil von נגד bedeutet „mitteilen, kundtun, erkennen lassen“. Im Zusammenhang wird Davids gutes Handeln durch seine Tat offenkundig; „erkennen lassen“ bewahrt den Aussagecharakter und klingt im Deutschen natürlich.
- source_word: הַיּוֹם
  choice: heute
  rationale: Direkte und gegenwärtige Wiedergabe der Zeitangabe.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: wie gut du an mir gehandelt hast
  rationale: Die Wendung bezeichnet gutes beziehungsweise wohltätiges Handeln an Saul. Diese Fassung gibt die ungewöhnliche hebräische Verbindung natürlich wieder, ohne sie auf einen bestimmten theologischen Begriff wie „Gnade“ festzulegen.
- source_word: סִגְּרַנִי
  choice: mich ... gab
  rationale: סגר kann hier das Ausliefern oder Übergeben in die Gewalt eines anderen bezeichnen. Zusammen mit „in deine Hand“ ist „gab“ knapp, idiomatisch und wahrt das hebräische Bild; die Alternativen werden in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיָדְךָ
  choice: in deine Hand
  rationale: Die hebräische Metapher für Macht und Verfügungsgewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: hast du mich nicht getötet
  rationale: Klare, moderne und genaue Wiedergabe des verneinten Verbs הרג.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt dessen Eigennamecharakter, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
- issue: Göttliches Übergeben Sauls in Davids Gewalt
  choice: Als Jahwe mich in deine Hand gab
  alternative: Als Jahwe mich dir auslieferte
  rationale: Die Formulierung hält Sauls Deutung des Geschehens als Handeln Jahwes fest. „Gab“ bewahrt zugleich die Metapher „in deine Hand“ und legt die Art des göttlichen Handelns nicht stärker fest als der Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des Hebräischen, während „wie gut du an mir gehandelt hast“ die hebräische Wendung natürlich ausdrückt. Der traditionelle Hand-Metapher wird bewahrt.
