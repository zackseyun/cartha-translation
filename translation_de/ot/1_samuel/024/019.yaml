  rationale: Die Revision ersetzt die potenziell missverständliche Wendung „erkennen lassen“ durch „gezeigt“, die die demonstrative Kraft von הִגַּדְתָּ im erzählerischen Kontext besser wiedergibt. „Gegeben hatte“ verdeutlicht das im Satz vorausgesetzte zeitliche Verhältnis, ohne den Sinn zu verändern. Die übrigen Entscheidungen, einschließlich der Gottesnamenswiedergabe und der Fußnote, bleiben erhalten.
