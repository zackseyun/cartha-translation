  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird getroffen: Saul würdigt Davids gutes Handeln, obwohl Jahwe ihn in Davids Gewalt gegeben hatte. „Erkennen lassen“ ist für הִגַּדְתָּ jedoch weniger präzise, da es im Deutschen nahelegt, David habe Saul etwas zu einer Einsicht verholfen. Der Kontext meint, dass David sein gutes Handeln durch die Tat offenbar bzw. gezeigt hat.'
  naturalness: Der Satz ist insgesamt verständlich und würdig. „Du hast heute gezeigt“ ist im modernen Standarddeutsch unmittelbarer und idiomatischer als „du hast heute erkennen lassen“. Das Plusquamperfekt in der Zeitangabe macht zudem die sachliche Vorzeitigkeit des Übergebens gegenüber Davids Unterlassen des Tötens klar.
  terminology: „Jahwe“, „in deine Hand“ und „getötet“ sind sachgerecht. Die Handmetapher bleibt erhalten, ohne ihre Bedeutung dogmatisch einzuengen. Die Fußnote bietet passende lexikalische Alternativen für סגר.
