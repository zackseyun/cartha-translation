source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: de
  text: 'Und mein Vater, sieh! Ja, sieh den Zipfel deines Obergewandes in meiner Hand! Denn als ich den Zipfel deines Obergewandes abschnitt, habe ich dich nicht getötet. Erkenne und sieh: In meiner Hand ist weder Bosheit noch Auflehnung[a], und ich habe mich nicht an dir versündigt. Du aber jagst mir nach, um mir das Leben zu nehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Übertretung; auch: Rebellion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבִי
  choice: Und, mein Vater
  rationale: Bewahrt die verbindende Konjunktion und Davids ehrerbietige, familiär-politische Anrede an Saul.
- source_word: רְאֵה גַּם רְאֵה
  choice: sieh! Ja, sieh
  rationale: Gibt die emphatische Wiederholung mit גַּם eindringlich und zugleich natürlich auf Deutsch wieder.
- source_word: כְּנַף מְעִילְךָ
  choice: den Zipfel deines Obergewandes
  rationale: כָּנָף bezeichnet hier das äußerste Stück beziehungsweise den Saum eines Kleidungsstücks; „Zipfel“ ist konkret und passt zum abgeschnittenen Beweisstück, „Obergewand“ gibt מְעִיל sachlich wieder.
- source_word: בְּיָדִי
  choice: in meiner Hand
  rationale: Bewahrt sowohl den sichtbaren Gegenstand in Davids Hand als auch beim zweiten Vorkommen die Aussage über sein Handeln und seine Gewalt.
- source_word: כִּי בְּכָרְתִי
  choice: Denn als ich … abschnitt
  rationale: כִּי leitet die Begründung ein; die Konstruktion mit בְּ wird im Deutschen natürlich temporal wiedergegeben.
- source_word: וְלֹא הֲרַגְתִּיךָ
  choice: habe ich dich nicht getötet
  rationale: Direkte, moderne Wiedergabe des negierten Verbs הרג ohne archaische Färbung.
- source_word: דַּע וּרְאֵה
  choice: Erkenne und sieh
  rationale: „Erkenne“ bringt neben dem Wahrnehmen auch die geforderte Einsicht zum Ausdruck; beide hebräischen Verben bleiben erhalten.
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: In meiner Hand ist weder Bosheit noch Auflehnung
  rationale: Die konkrete Hand-Metapher wird bewahrt. רָעָה bezeichnet moralisch Böses; פֶשַׁע kann Übertretung oder Auflehnung meinen und erhält hier gegenüber dem König eine politische Nuance.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: und ich habe mich nicht an dir versündigt
  rationale: Bewahrt das moralisch-religiöse Gewicht von חטא und gibt die persönliche Zielrichtung mit לָךְ idiomatisch wieder.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: Du aber jagst mir nach dem Leben, um es mir zu nehmen
  rationale: „Nach dem Leben jagen“ bewahrt das Jagdbild von צדה und ist im Deutschen idiomatisch; das Pronomen bezieht sich klar auf „Leben“ zurück.
theological_decisions:
- issue: Moralisch-politische Bedeutung von פֶשַׁע in Davids Unschuldsbeteuerung gegenüber Saul
  choice: Auflehnung
  alternative: Übertretung; Vergehen; Rebellion
  rationale: Im Kontext weist David den Verdacht zurück, sich gegen den König erhoben zu haben. „Auflehnung“ bewahrt diese politische Dimension, ohne den Begriff ausschließlich als vollzogene Rebellion festzulegen; die allgemeinere Bedeutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eindringlichen Wiederholungen und die zweimalige Wendung „in meiner Hand“ bleiben bewusst erhalten. „Mein Vater“ wahrt Davids respektvolle Anrede; „Obergewand“ vermeidet archaisches „Mantelkleid“.
