  - severity: medium
    issue: »Als Saul sich nach ihm umsah« ist semantisch missverständlich.
    rationale: Im modernen Deutsch bedeutet »sich nach jemandem umsehen« gewöhnlich, jemanden zu suchen oder nach ihm Ausschau zu halten. אַחֲרָיו bezeichnet hier den Blick hinter sich bzw. rückwärts zu David.
