base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: de
  text: 'Danach stand David auf, ging aus der Höhle hinaus und rief Saul hinterher: »Mein Herr, der König!« Als Saul hinter sich blickte, verneigte sich David mit dem Gesicht zur Erde und warf sich nieder.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verneigte sich tief«. Das hebräische Verb bezeichnet eine tiefe Niederwerfung als Ausdruck von Ehrerbietung oder Unterordnung; hier ist keine Anbetung im religiösen Sinn gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand auf
  rationale: Das Qal von קום bezeichnet hier das Aufstehen und leitet Davids nächste Handlung in der Erzählfolge ein.
- source_word: אַחֲרֵי כֵן
  choice: Danach
  rationale: Die knappe temporale Wendung gibt die Abfolge natürlich und sachlich wieder.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: ging aus der Höhle hinaus
  rationale: יצא bezeichnet das Hinausgehen; die Formulierung folgt der Perspektive des Erzählers und ist im Deutschen eindeutig.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: rief Saul hinterher
  rationale: קרא mit אַחֲרֵי bezeichnet den Ruf hinter einer sich entfernenden Person her; »hinterherrufen« ist die natürliche deutsche Entsprechung.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mein Herr und König
  rationale: Die Anrede wahrt sowohl Davids persönliche Ehrerbietung als auch Sauls Königstitel. Das verbindende »und« ergibt im modernen Deutschen eine natürliche direkte Anrede.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: Als Saul sich nach ihm umsah
  rationale: Die temporale Satzverknüpfung stellt den natürlichen Zusammenhang zur folgenden Handlung her; »sich nach ihm umsehen« gibt den Blick nach hinten idiomatisch wieder.
- source_word: וַיִּקֹּד
  choice: verneigte sich
  rationale: קדד bezeichnet das Beugen des Körpers. »Verneigte sich« hält diese Bewegung von der anschließenden, stärkeren Niederwerfung unterscheidbar.
- source_word: אַפַּיִם אַרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die wörtlich körperbezogene Wendung beschreibt eine tiefe Ehrerbietung; die deutsche Formulierung bewahrt das konkrete Bild.
- source_word: וַיִּשְׁתָּחוּ
  choice: warf sich nieder
  rationale: Das Verb bezeichnet eine tiefe körperliche Niederwerfung als Zeichen von Ehrerbietung oder Unterordnung. Die Wiedergabe wahrt die Intensität, ohne in diesem menschlichen Kontext Gottesverehrung anzudeuten.
theological_decisions:
- issue: Davids Niederwerfung vor Saul
  choice: Als körperlicher Ausdruck tiefer Ehrerbietung und Unterordnung wiedergegeben
  alternative: »betete ihn an« oder »huldigte ihm«
  rationale: שׁחה kann je nach Gegenüber kultische Anbetung oder zwischenmenschliche Huldigung bezeichnen. Da sich David hier vor Saul niederwirft, darf die Übersetzung keine göttliche Verehrung nahelegen; zugleich soll die Tiefe seiner Ehrerbietung sichtbar bleiben.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die direkte Anrede klingt respektvoll, aber nicht altertümlich. Die beiden aufeinanderfolgenden Körperbewegungen werden sprachlich unterschieden, damit die Steigerung des hebräischen Textes erhalten bleibt.
