  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: de
  text: Hinter wem ist der König von Israel hergezogen? Hinter wem bist du her[a]? Hinter einem toten Hund, hinter einem einzigen Floh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gegen wen ist der König von Israel ausgezogen? Wen verfolgst du?“ Im Hebräischen steht dreimal אַחֲרֵי („hinter/nach“) im Sinn einer Verfolgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: Hinter wem
  rationale: אַחֲרֵי bezeichnet hier das Verfolgen. „Hinter wem“ bewahrt die dreifache Wiederholung und den rhetorischen Rhythmus des Hebräischen; die idiomatischeren Möglichkeiten „gegen wen“ und „wem nach“ würden diese Verbindung abschwächen.
- source_word: יָצָא
  choice: ist ... ausgezogen
  rationale: יצא bedeutet „hinausgehen/ausziehen“ und bezeichnet hier das Ausrücken des Königs zu einem Feldzug oder einer Verfolgung. Das Perfekt entspricht in diesem Rückblick natürlichem modernem Deutsch.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die direkte Wiedergabe erhält den würdevollen Titel und damit den ironischen Gegensatz zur Geringfügigkeit des Verfolgten.
- source_word: אַתָּה רֹדֵף
  choice: bist du her
  rationale: In Verbindung mit „hinter wem“ gibt „hinter jemandem her sein“ eine anhaltende Verfolgung wieder. Die Formulierung ermöglicht zugleich, das wiederholte אַחֲרֵי sichtbar zu erhalten.
- source_word: כֶּלֶב מֵת
  choice: einem toten Hund
  rationale: Die wörtliche Wendung ist im Deutschen verständlich und bewahrt Davids drastische Selbsterniedrigung.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: einem einzigen Floh
  rationale: „Einzigen“ bringt die durch אֶחָד betonte Bedeutungslosigkeit natürlicher zum Ausdruck als das hölzerne „einem Floh“ oder „einem Floh allein“.
