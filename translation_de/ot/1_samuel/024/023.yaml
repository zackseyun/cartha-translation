base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: de
  text: Da schwor David Saul einen Eid. Dann ging Saul nach Hause, und David und seine Männer zogen zur Festung hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע דָּוִד לְשָׁאוּל
  choice: So schwor David Saul den Eid
  rationale: Das Nifal von שׁבע bezeichnet das Schwören eines Eides. Die Verbindung mit לְשָׁאוּל nennt Saul als den Empfänger der Zusage; „Saul den Eid schwören“ ist im Deutschen natürlich und macht den Bezug zum vorangehenden Vers deutlich.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל־בֵּיתוֹ
  choice: Dann ging Saul nach Hause
  rationale: בֵּיתוֹ kann sein Haus oder sein Zuhause bezeichnen. „Nach Hause“ ist in diesem Erzählzusammenhang die natürliche deutsche Wendung.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: David aber und seine Männer
  rationale: Die hebräische Konjunktion bedeutet grundsätzlich „und“. Das nachgestellte „aber“ gibt den im Zusammenhang klaren Gegensatz zwischen Sauls Heimkehr und Davids Rückzug wieder, ohne einen scharfen Widerspruch zu behaupten. אֲנָשָׁיו bezeichnet hier Davids Gefolgsleute.
- source_word: עָלוּ
  choice: zogen … hinauf
  rationale: עלה bewahrt die aufwärts gerichtete Bewegung. „Hinaufziehen“ ist für eine Gruppe in erzählendem Deutsch idiomatisch.
- source_word: הַמְּצוּדָה
  choice: die Bergfeste
  rationale: מְצוּדָה bezeichnet einen befestigten, schwer zugänglichen Zufluchtsort. „Bergfeste“ verbindet den Festungscharakter mit dem durch עָלוּ und den Wüstenkontext nahegelegten erhöhten Gelände.
