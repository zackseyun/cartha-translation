source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: de
  text: 'Und er sagte zu David: »Du bist gerechter als ich[a], denn du hast mir Gutes erwiesen, ich aber habe dir Böses erwiesen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du bist mehr im Recht als ich.«'
    reason: Lexikalische Alternative für צַדִּיק in diesem vergleichenden Kontext.
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל דָּוִד
  choice: Und er sagte zu David
  rationale: Das narrative Wayyiqtol wird schlicht im Präteritum wiedergegeben. Das im Hebräischen stehende Pronomen »er« bleibt erhalten, statt den aus dem Kontext bekannten Sprecher Saul ausdrücklich einzusetzen.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: Du bist gerechter als ich
  rationale: צַדִּיק bezeichnet hier moralische Gerechtigkeit beziehungsweise das Im-Recht-Sein; die Komparativkonstruktion mit מִן wird natürlich mit »gerechter als« wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für Sauls Urteil ein; »denn« wahrt diese erklärende Funktion in gehobenem, natürlichem Deutsch.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: du hast mir Gutes erwiesen
  rationale: גמל mit dem Objekt הַטּוֹבָה beschreibt, wie jemand an einem anderen handelt beziehungsweise ihm etwas erweist. »Gutes erwiesen« ist idiomatisch und bewahrt den Gegensatz zu »Böses«.
- source_word: וַאֲנִי
  choice: ich aber
  rationale: Das wörtliche »und ich« hat hier deutlich kontrastive Kraft; »ich aber« bringt den Gegensatz der beiden Handlungen natürlich zum Ausdruck.
- source_word: גְּמַלְתִּיךָ הָרָעָה
  choice: ich habe dir Böses erwiesen
  rationale: Die Wiederholung von גמל wird mit demselben deutschen Verb wiedergegeben. »Böses« erhält die moralische Weite von רָעָה und bildet den direkten Gegenpol zu »Gutes«.
theological_decisions:
- issue: Bedeutung von צַדִּיק im vergleichenden Bekenntnis Sauls
  choice: gerechter als ich
  alternative: mehr im Recht als ich
  rationale: Die Hauptfassung bewahrt die moralisch-theologische Färbung von צַדִּיק, ohne absolute Sündlosigkeit zu behaupten, da der hebräische Vergleich ausdrücklich relativ formuliert ist. Die stärker forensische Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und der scharfe Gegensatz zwischen »Gutes« und »Böses« werden bewahrt; zugleich vermeidet »erwiesen« das im Deutschen missverständliche Bild einer mechanischen Vergeltung.
