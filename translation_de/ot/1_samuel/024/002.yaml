base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: de
  text: 'Als Saul von der Verfolgung der Philister zurückkehrte, sagten sie ihm: »Sieh, David ist in der Wüste von En-Gedi.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: von der Verfolgung der Philister
  rationale: Die Wendung bezeichnet hier idiomatisch Sauls Rückkehr von der Verfolgung beziehungsweise dem Nachsetzen hinter den Philistern; die deutsche Formulierung ist natürlich und wahrt den Sinn.
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: berichtete man ihm
  rationale: Das unbestimmte Subjekt der Pluralform wird im Deutschen passend durch »man« wiedergegeben. Das formelhafte לֵאמֹר muss vor direkter Rede nicht eigens mit »indem man sagte« abgebildet werden.
- source_word: הִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die folgende Mitteilung. Im natürlichen modernen Deutsch erfüllt die direkte Rede diese Funktion bereits; »Siehe« wäre hier unnötig altertümlich, »Schau« in einer Meldung weniger idiomatisch.
- source_word: בְּמִדְבַּר עֵין גֶּדִי
  choice: in der Wüste En-Gedi
  rationale: מִדְבָּר bezeichnet eine unbewohnte, trockene Wildnis; »Wüste« ist die etablierte und kontextgerechte Wiedergabe. Der Ortsname wird in geläufiger deutscher Schreibweise wiedergegeben.
