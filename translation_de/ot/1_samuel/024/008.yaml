source:
  edition: WLC
  text: וַ/יְשַׁסַּ֨ע דָּוִ֤ד אֶת אֲנָשָׁי/ו֙ בַּ/דְּבָרִ֔ים וְ/לֹ֥א נְתָנָ֖/ם לָ/ק֣וּם אֶל שָׁא֑וּל וְ/שָׁא֛וּל קָ֥ם מֵ/הַ/מְּעָרָ֖ה וַ/יֵּ֥לֶךְ בַּ/דָּֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: de
  text: David hielt seine Männer mit Worten zurück und ließ nicht zu, dass sie sich gegen Saul erhoben.[a] Saul aber stand auf, verließ die Höhle und ging seines Weges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „David wies seine Männer mit scharfen Worten zurecht.“ Das hebräische Verb ist selten und kann eine stärkere Bedeutung haben als bloßes Zurückhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: hielt … zurück
  rationale: Das seltene und schwierige Verb bezeichnet hier im Zusammenhang Davids energisches Eingreifen, durch das er seine Männer an einer Tat gegen Saul hindert. Die Wiedergabe nennt die praktische Wirkung, während die möglicherweise schärfere Bedeutung in der Fußnote erhalten bleibt.
- source_word: אֲנָשָׁיו
  choice: seine Männer
  rationale: Gemeint sind Davids männliche Gefolgsleute in der Höhle; „seine Männer“ ist im Deutschen natürlich und kontextgenau.
- source_word: בַּדְּבָרִים
  choice: mit Worten
  rationale: Die Wendung bezeichnet das Mittel seines Eingreifens und wird instrumental sowie nah an der hebräischen Form wiedergegeben.
- source_word: וְלֹא נְתָנָם
  choice: ließ nicht zu
  rationale: נתן mit folgendem Infinitiv drückt hier Erlauben oder Zulassen aus; die Formulierung ist klar und modern.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: dass sie sich gegen Saul erhoben
  rationale: Die Formulierung bewahrt das Bild von קום und gibt die feindliche Ausrichtung von אֶל im Kontext wieder, ohne die konkrete Handlung vorschnell als Angriff festzulegen.
- source_word: קָם מֵהַמְּעָרָה
  choice: stand auf, verließ die Höhle
  rationale: Das Hebräische sagt wörtlich, Saul sei „von/aus der Höhle aufgestanden“. Im Deutschen macht die koordinierte Wiedergabe den natürlichen Sinn deutlich, dass er aufstand und aus der Höhle hinausging.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: ging seines Weges
  rationale: Die idiomatische deutsche Wendung gibt das Fortgehen und Weiterziehen wieder, ohne unnötig eine bestimmte Straße hervorzuheben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die seltene Verbform wird im Haupttext kontextgerecht und verständlich wiedergegeben; ihre stärkere mögliche Nuance bleibt durch die Fußnote sichtbar. Die Wiederholung von קום wird soweit möglich erhalten, wobei Sauls Verlassen der Höhle natürlich deutsch formuliert ist.
