  text: כַּ/אֲשֶׁ֣ר יֹאמַ֗ר מְשַׁל֙ הַ/קַּדְמֹנִ֔י מֵ/רְשָׁעִ֖ים יֵ֣צֵא רֶ֑שַׁע וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: de
  text: 'Wie das alte Sprichwort sagt[a]: »Von Gottlosen geht Gottlosigkeit aus.« Doch meine Hand wird sich nicht gegen dich erheben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie das Sprichwort der Alten sagt.« Das hebräische Adjektiv kann »alt« bedeuten oder sich auf »die Alten« beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: Wie ... sagt
  rationale: Die Wendung leitet ein überliefertes Sprichwort ein; das hebräische Imperfekt hat hier allgemeinen, sprichwörtlichen Sinn.
- source_word: מְשַׁל
  choice: Sprichwort
  rationale: Gemeint ist hier ein kurzer, überlieferter Weisheitsspruch, nicht ein ausführliches Gleichnis.
- source_word: הַקַּדְמֹנִי
  choice: alt
  rationale: Das Adjektiv kann das Sprichwort als aus früherer Zeit stammend bezeichnen. Die mögliche personenbezogene Deutung wird in der Fußnote bewahrt.
- source_word: מֵרְשָׁעִים ... רֶשַׁע
  choice: Von Gottlosen geht Gottlosigkeit aus
  rationale: Die Wiedergabe bewahrt die etymologische Wiederholung und den sprichwörtlichen Klang; מִן bezeichnet den Ursprung.
- source_word: וְיָדִי
  choice: Doch meine Hand
  rationale: Das Bild der Hand als Ausdruck persönlichen Handelns oder gewaltsamen Zugreifens bleibt erhalten; die Konjunktion wird wegen des Gegensatzes adversativ wiedergegeben.
- source_word: לֹא תִהְיֶה בָּךְ
  choice: wird sich nicht gegen dich erheben
  rationale: Die idiomatische deutsche Formulierung verdeutlicht die feindliche Handlung, ohne das im Hebräischen verwendete Bild der Hand aufzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelklang von »Gottlosen« und »Gottlosigkeit« sowie das hebräische Bild der Hand werden bewahrt.
