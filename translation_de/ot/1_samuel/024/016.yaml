  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: de
  text: Möge der HERR Richter sein und zwischen mir und dir entscheiden. Möge er hinsehen, für meine Sache eintreten und mir Recht verschaffen gegenüber deiner Gewalt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mich aus deiner Hand richten“. „Hand“ bezeichnet hier Macht oder Gewalt; die Wendung kann einschließen, dass Gott David aus Sauls Gewalt rettet.'
    reason: Die Fußnote erläutert die hebräische Hand-Metapher und bewahrt die Verbindung von richterlicher Rechtsprechung und möglicher Befreiung, ohne den Haupttext unidiomatisch zu machen.
lexical_decisions:
- source_word: וְהָיָה יְהוָה לְדַיָּן
  choice: Der HERR soll Richter sein
  rationale: Die jussivische Aussage wird als Wunsch beziehungsweise Anrufung wiedergegeben; der Gottesname יהוה erscheint gemäß verbreiteter deutscher Bibelkonvention als HERR.
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: und zwischen mir und dir entscheiden
  rationale: שׁפט bezeichnet hier das richterliche Entscheiden zwischen zwei Parteien; „entscheiden“ vermeidet die im Deutschen schwerfällige Wiederholung von „richten“.
- source_word: וְיָרֵב אֶת רִיבִי
  choice: meinen Rechtsstreit führen
  rationale: Die figura etymologica aus ריב wird sachgerecht als Übernahme und Führung einer Rechtssache wiedergegeben.
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: und mir Recht verschaffen gegen deine Hand
  rationale: שׁפט im Objektbezug kann hier das richterliche Rechtverschaffen beziehungsweise die Rechtfertigung bezeichnen. „Deine Hand“ bewahrt das konkrete hebräische Bild für Sauls Macht und Gewalt.
theological_decisions:
- issue: Gottes Rolle im Streit zwischen David und Saul
  choice: Gott wird als Richter angerufen, der entscheidet, Davids Sache führt und ihm Recht verschafft.
  alternative: 'Die Aussage als sichere Zukunftsprognose formulieren: „Der HERR wird Richter sein“.'
  rationale: Die Verbformen stehen in einer Wunsch- beziehungsweise Aufforderungsfolge. Die deutsche Soll-Form bewahrt den appellativen Charakter, ohne Gottes Urteil inhaltlich vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bitten des Hebräischen bleiben erhalten; die ungewöhnliche Wendung „gegen deine Hand“ bewahrt bewusst das Quellbild und wird durch eine Fußnote erschlossen.
