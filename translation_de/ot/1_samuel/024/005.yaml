review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die erzählerische Abfolge, die zweimalige deiktische Hervorhebung, die als Männerrede berichtete Berufung auf Jahwe, die Auslieferungsmetapher und das heimliche Abschneiden von Sauls Gewandzipfel insgesamt zutreffend wieder. Für כַּאֲשֶׁר יִיטַב בְּעֵינֶיךָ ist jedoch die indikativische Formulierung „was in deinen Augen gut ist“ im Deutschen weniger präzise: Der hebräische Imperfekt-Ausdruck bezeichnet, was David als gut erscheint.'
  naturalness: „Sieh“ und „Da stand David auf“ sind verständlich, aber in modernem Standarddeutsch leicht literarisch; dies ist im vorliegenden würdevollen Erzählregister vertretbar. „Was in deinen Augen gut ist“ klingt dagegen unnötig hebraisierend und ist in der direkten Rede weniger natürlich als „was dir gut erscheint“.
  terminology: „Jahwe“, „Davids Männer“, „Feind“, „in deine Hand“, „Obergewand“ und „Zipfel“ sind sachgerecht. Die Formulierung „du kannst mit ihm tun“ bewahrt die nicht zwingend gebietende Lesart angemessen. Der Gottesname und die berichtende, nicht kommentierende Darstellung der Männeraussage bleiben erhalten.
  issues:
  - severity: medium
    issue: Die Wiedergabe von כַּאֲשֶׁר יִיטַב בְּעֵינֶיךָ als „was in deinen Augen gut ist“ verfehlt die modale bzw. perspektivische Nuance des hebräischen Imperfekts.
    rationale: יַטַּב bedeutet hier nicht schlicht „gut ist“, sondern „gut erscheint/gefällt“. „Was dir gut erscheint“ ist zugleich quellentreuer und natürliches modernes Deutsch. Die bisherige Fußnote enthält diese Kernbedeutung nur als alternative Glättung.
  revised_text: 'Da sagten Davids Männer zu ihm: »Sieh, das ist der Tag, von dem Jahwe zu dir gesagt hat: ›Sieh, ich gebe deinen Feind in deine Hand, und du kannst mit ihm tun, was dir gut erscheint.‹« Da stand David auf und schnitt heimlich einen Zipfel von Sauls Obergewand ab.'
