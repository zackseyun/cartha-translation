  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: de
  text: 'Da sagten Davids Männer zu ihm: »Sieh, das ist der Tag, von dem Jahwe zu dir gesagt hat: ›Sieh, ich gebe deinen Feind in deine Hand, und du kannst mit ihm tun, was dir gut erscheint.‹« Da stand David auf und schnitt heimlich einen Zipfel von Sauls Obergewand ab.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: אַנְשֵׁי דָוִד
  choice: Davids Männer
  rationale: Die Status-constructus-Verbindung bezeichnet Davids Gefolgsleute; die gewählte Form ist knapp und idiomatisch.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die zweimalige Hinweispartikel wird als direkte Aufforderung wiedergegeben und behält dadurch ihren Nachdruck, ohne altertümlich zu wirken.
- source_word: הַיּוֹם
  choice: das ist der Tag
  rationale: Zusammen mit הִנֵּה bezeichnet die Form den gegenwärtigen Tag als den angekündigten entscheidenden Zeitpunkt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens bewahrt ihn als Eigennamen.
- source_word: נֹתֵן
  choice: ich gebe
  rationale: Das Partizip bezeichnet hier eine unmittelbar gegenwärtige beziehungsweise bevorstehende Übergabe; das deutsche Präsens wahrt diese Lebendigkeit.
- source_word: איבי/ך
  choice: deinen Feind
  rationale: Der Kontext und die folgenden singularischen Bezüge weisen eindeutig auf Saul als einzelnen Feind.
- source_word: בְּיָדֶךָ
  choice: in deine Hand
  rationale: Die hebräische Metapher für die Auslieferung in jemandes Gewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: und du kannst mit ihm tun
  rationale: Im Kontext drückt die Form die eröffnete Handlungsmöglichkeit aus, nicht zwingend einen Befehl; „kannst“ lässt diesen Sinn erkennen.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: was in deinen Augen gut ist
  rationale: Die Wiedergabe bewahrt das hebräische Bild und die subjektive Perspektive; eine idiomatischere Alternative steht in der Fußnote.
- source_word: וַיָּקָם
  choice: Da stand David auf
  rationale: Die Form bezeichnet das Aufstehen zur anschließenden Handlung und führt zugleich die Erzählung weiter.
- source_word: וַיִּכְרֹת אֶת כְּנַף הַמְּעִיל
  choice: schnitt einen Zipfel von Sauls Obergewand ab
  rationale: כרת bezeichnet das Abschneiden; כנף ist hier der Zipfel beziehungsweise Rand des Kleidungsstücks, und מעיל ein Obergewand.
- source_word: בַּלָּט
  choice: heimlich
  rationale: Das Adverb bezeichnet eine unbemerkte, verstohlene Ausführung der Handlung.
theological_decisions:
- issue: Ob die von Davids Männern angeführte Gottesrede als tatsächlich ergangene frühere Offenbarung oder als ihre Deutung der Lage verstanden werden soll
  choice: 'Die Aussage bleibt ausdrücklich als Rede der Männer stehen: „der Tag, von dem Jahwe zu dir gesagt hat“'
  alternative: Die Formulierung durch eine Distanzierung wie „der Tag, von dem eure Männer meinen, Jahwe habe ihn angekündigt“ abschwächen oder sie als unbestrittene göttliche Verheißung erläutern
  rationale: Der hebräische Text berichtet die Behauptung der Männer, bewertet sie hier aber nicht ausdrücklich. Die Übersetzung wahrt diese erzählerische und theologische Spannung.
- issue: Ob וְעָשִׂיתָ als Befehl, Vorhersage oder Erlaubnis wiederzugeben ist
  choice: „du kannst mit ihm tun“
  alternative: „du sollst mit ihm tun“ oder „du wirst mit ihm tun“
  rationale: Der Zusammenhang beschreibt die nach Auffassung der Männer eröffnete Möglichkeit, mit Saul nach Davids Ermessen zu verfahren. Ein ausdrücklicher göttlicher Tötungsbefehl soll nicht in die mehrdeutige Form hineingelesen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die direkte Rede bleibt lebendig, die hebräische Bildsprache wird dort bewahrt, wo sie im Deutschen verständlich ist; stärker idiomatische Glättung wird in der Fußnote angeboten.
