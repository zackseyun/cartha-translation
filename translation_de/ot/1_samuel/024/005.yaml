- from: 'Da sagten Davids Männer zu ihm: »Sieh, das ist der Tag, von dem Jahwe zu dir gesagt hat: ›Sieh, ich gebe deinen Feind in deine Hand, und du kannst mit ihm tun, was in deinen Augen gut ist.[a]‹« Da stand David auf und schnitt heimlich einen Zipfel von Sauls Obergewand ab.'
  to: 'Da sagten Davids Männer zu ihm: »Sieh, das ist der Tag, von dem Jahwe zu dir gesagt hat: ›Sieh, ich gebe deinen Feind in deine Hand, und du kannst mit ihm tun, was dir gut erscheint.‹« Da stand David auf und schnitt heimlich einen Zipfel von Sauls Obergewand ab.'
  rationale: Die Übersetzung wird nur bei der idiomatischen und semantischen Wiedergabe von כַּאֲשֶׁר יִיטַב בְּעֵינֶיךָ korrigiert. „Was dir gut erscheint“ gibt die subjektive Beurteilung und die verbale Nuance wieder, ohne die Aussage zu einem Befehl oder einer theologischen Bewertung umzudeuten. Da die Hauptfassung nun die natürliche präzise Wiedergabe bietet, ist die bisherige Alternativfußnote entbehrlich.
