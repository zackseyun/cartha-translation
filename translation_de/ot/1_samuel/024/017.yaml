  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת דָּוִ֗ד לְ/דַבֵּ֞ר אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֶל שָׁא֔וּל וַ/יֹּ֣אמֶר שָׁא֔וּל הֲ/קֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יִּשָּׂ֥א שָׁא֛וּל קֹל֖/וֹ וַ/יֵּֽבְךְּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: de
  text: 'Als David diese Worte zu Saul zu Ende gesprochen hatte, sagte Saul: »Ist das deine Stimme, mein Sohn David?« Da erhob Saul seine Stimme und weinte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Als … aufgehört hatte
  rationale: Die Konstruktion aus וַיְהִי und כְּ mit Infinitiv bildet einen temporalen Nebensatz. Diese Wiedergabe ist natürliches modernes Deutsch und wahrt den Abschluss von Davids Rede vor Sauls Reaktion.
- source_word: לְדַבֵּר אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte … zu sprechen
  rationale: דְּבָרִים bezeichnet hier angesichts der vorausgehenden Rede konkret die gesprochenen Worte. Die Formulierung bildet zugleich die hebräische Verbindung mit לְדַבֵּר angemessen ab.
- source_word: אֶל־שָׁאוּל
  choice: zu Saul
  rationale: Gibt die gewöhnliche Zielrichtung der Präposition אֶל klar und idiomatisch wieder.
- source_word: הֲקֹלְךָ זֶה
  choice: Ist das deine Stimme
  rationale: קוֹל bezeichnet hier die erkennbare menschliche Stimme. Im Deutschen ist »das« beim Erkennen einer gehörten Stimme idiomatischer als das formal nähere »dies«.
- source_word: בְּנִי דָוִד
  choice: mein Sohn David
  rationale: Bewahrt Sauls väterlich-emotionale Anrede und folgt einer natürlichen deutschen Wortstellung.
- source_word: וַיִּשָּׂא … קֹלוֹ
  choice: erhob … seine Stimme
  rationale: Gibt die hebräische Redewendung relativ formnah und in würdigem Deutsch wieder, ohne sie vorschnell als eigenes Verb des Weinens aufzulösen.
- source_word: וַיֵּבְךְּ
  choice: weinte
  rationale: Das Verb bezeichnet konkret das Weinen; »weinte« ist im heutigen Deutsch präzise und natürlich.
theological_decisions:
- issue: Sauls Anrede »mein Sohn David«
  choice: Als relationale und emotionale Anrede unverändert bewahrt
  alternative: Als bloße politische Gunst- oder Patronatsformel abschwächen
  rationale: Der hebräische Text verwendet ausdrücklich die Sohnesanrede. Die Übersetzung erhält ihre soziale und emotionale Spannung, ohne eine buchstäbliche Abstammung oder eine besondere Lehrbedeutung daraus abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerisch natürlichem Satzbau. Die Wiederholung des Namens Saul und die hebräische Wendung »seine Stimme erheben« bleiben erhalten. Keine Fußnote ist nötig, da בְּנִי דָוִד im Deutschen eindeutig und natürlich als »mein Sohn David« wiedergegeben werden kann.
