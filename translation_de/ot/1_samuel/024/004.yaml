source:
  edition: WLC
  text: וַ֠/יָּבֹא אֶל גִּדְר֨וֹת הַ/צֹּ֤אן עַל הַ/דֶּ֨רֶךְ֙ וְ/שָׁ֣ם מְעָרָ֔ה וַ/יָּבֹ֥א שָׁא֖וּל לְ/הָסֵ֣ךְ אֶת רַגְלָ֑י/ו וְ/דָוִד֙ וַ/אֲנָשָׁ֔י/ו בְּ/יַרְכְּתֵ֥י הַ/מְּעָרָ֖ה יֹשְׁבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: de
  text: Er kam zu den Schafhürden am Weg. Dort war eine Höhle, und Saul ging hinein, um seine Notdurft zu verrichten.[a] David aber und seine Männer saßen im hintersten Teil der Höhle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um seine Füße zu bedecken“; ein hebräischer Ausdruck dafür, seine Notdurft zu verrichten.'
    reason: Der wörtliche hebräische Euphemismus wäre im Haupttext für heutige Leser missverständlich, soll aber als sprachliches Bild sichtbar bleiben.
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: Schafhürden
  rationale: Die Verbindung bezeichnet umfriedete Plätze für Schafe. „Schafhürden“ gibt die konkrete Örtlichkeit knapp und im Deutschen verständlich wieder.
- source_word: עַל הַדֶּרֶךְ
  choice: am Weg
  rationale: Die Wendung lokalisiert die Schafhürden an der Route; „am Weg“ ist natürlich und bewahrt die räumliche Aussage.
- source_word: מְעָרָה
  choice: eine Höhle
  rationale: Dies ist die übliche und kontextgemäße Bedeutung des Nomens.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: um seine Notdurft zu verrichten
  rationale: Die wörtliche Formulierung „seine Füße bedecken“ ist ein hebräischer Euphemismus. Die gewählte deutsche Wendung vermittelt den Sinn würdevoll und verständlich; das Sprachbild wird in der Fußnote erhalten.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: im hintersten Teil der Höhle
  rationale: יַרְכְּתֵי bezeichnet den abgelegenen, innersten Bereich. Die Formulierung macht die räumliche Distanz zu Saul deutlich, ohne mehr auszusagen als der Ausgangstext.
- source_word: יֹשְׁבִים
  choice: saßen
  rationale: Das Partizip beschreibt hier die unmittelbare Haltung beziehungsweise Situation Davids und seiner Männer in der Höhle.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: Er kam ... Saul ging hinein
  rationale: Die erste Form setzt die Bewegung der Erzählung fort, die zweite bezeichnet Sauls Eintritt in die Höhle. Die deutsche Variation vermeidet schwerfällige Wiederholung und erhält die Abfolge.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Der Euphemismus wird im Haupttext sinngemäß wiedergegeben; die wörtliche hebräische Form steht in der Fußnote. Das adversative וְ vor David wird mit „aber“ wiedergegeben, um den Szenenwechsel und den verborgenen Gegensatz kenntlich zu machen.
