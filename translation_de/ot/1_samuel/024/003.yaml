base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: de
  text: Da nahm Saul dreitausend ausgewählte Männer aus ganz Israel mit und zog aus, um David und seine Männer bei den Felsen der Wildziegen[a] zu suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei den Klippen der Steinböcke“. Die Ortsangabe kann auch „vor den Felsklippen“ bedeuten. Bei den Tieren handelt es sich wahrscheinlich um Steinböcke.'
    reason: Lexikalische Alternativen für צוּרֵי und die räumlich nicht eindeutig festgelegte Wendung עַל־פְּנֵי; wahrscheinlich genauere Tierbezeichnung für יְעֵלִים.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm … mit
  rationale: Im Erzählzusammenhang bezeichnet לקח das Mitnehmen beziehungsweise Aufbieten der Männer für Sauls Unternehmung. „Nahm … mit“ ist im Deutschen natürlicher als das bloße „nahm“.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: dreitausend ausgewählte Männer
  rationale: Die Wendung zählt Personen und kennzeichnet sie mit בָּחוּר als ausgesuchte, ausgewählte Männer; die militärische Rolle ergibt sich aus dem Zusammenhang.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: aus ganz Israel
  rationale: Die Formulierung wahrt den Gedanken, dass die Männer aus dem gesamten Israel ausgewählt wurden.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: zog aus, um … zu suchen
  rationale: Der Infinitiv bezeichnet den Zweck. „Zog aus“ passt zur militärischen Unternehmung, während „um … zu suchen“ die Zielrichtung ausdrücklich erhält.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: David und seine Männer
  rationale: „Seine Männer“ ist eine knappe und natürliche Bezeichnung für Davids Gefolgsleute.
- source_word: עַל פְּנֵי
  choice: vor
  rationale: „Vor“ bildet die räumliche Grundbedeutung der Wendung knapp und natürlich ab, ohne die Ortsangabe stärker zu präzisieren, als es der hebräische Text tut.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: die Felsen der Wildziegen
  rationale: צוּרֵי bezeichnet Felsen beziehungsweise Felsklippen; יְעֵלִים meint Wildziegen, wahrscheinlich genauer Steinböcke. Die allgemein verständliche Haupttextfassung bewahrt das hebräische Bild, die zoologische Präzisierung steht in der Fußnote.
