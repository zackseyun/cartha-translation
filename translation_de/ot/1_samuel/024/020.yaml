base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: de
  text: Denn wenn jemand seinen Feind antrifft und ihn unversehrt seines Weges ziehen lässt, möge Jahwe dir das Gute vergelten[a], das du heute an mir getan hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe wird dir das Gute vergelten.“ Die hebräische Verbform kann sowohl als Wunsch beziehungsweise Segen als auch als Zukunftsaussage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי יִמְצָא אִישׁ אֶת־אֹיְבוֹ
  choice: Denn wenn jemand seinen Feind antrifft
  rationale: וְכִי knüpft begründend an den Zusammenhang an; אִישׁ ist hier generisch und wird im natürlichen modernen Deutsch mit „jemand“ wiedergegeben.
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
  choice: lässt er ihn dann unversehrt seines Weges ziehen?
  rationale: Die wörtliche Wendung „auf einem guten Weg“ bezeichnet im Kontext das sichere, unversehrte Entlassen. Als rhetorische Frage formuliert, bringt der Satz Sauls verwundertes Eingeständnis natürlich zum Ausdruck, ohne den Aussagegehalt zu verändern.
- source_word: וַיהוָה
  choice: Möge Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; das einleitende וַ wird entsprechend dem deutschen Satzbau nicht eigens abgebildet.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: dir das Gute vergelten
  rationale: שׁלם bezeichnet hier eine entsprechende Vergeltung beziehungsweise Belohnung; „das Gute“ bewahrt die positive Bedeutung und den lexikalischen Bezug zu טוֹבָה.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: das du heute an mir getan hast
  rationale: Die kompakte hebräische Vergeltungsformel wird idiomatisch dem Verb „vergelten“ zugeordnet; „an mir“ gibt לִי in diesem Zusammenhang natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen; die Transliteration „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Modalität von יְשַׁלֶּמְךָ
  choice: 'Wunsch beziehungsweise Segensspruch: „Möge Jahwe … vergelten“'
  alternative: 'Vorhersage: „Jahwe wird … vergelten“'
  rationale: Die Yiqtol-Form kann im Redekontext als Wunsch oder als Zukunftsaussage verstanden werden. Der Haupttext folgt der naheliegenden Wunschlesart; die echte Mehrdeutigkeit wird in einer Fußnote festgehalten.
- issue: Satzfunktion der ersten Hälfte
  choice: rhetorische Frage
  alternative: 'allgemeine Feststellung: „Denn wenn jemand …, lässt er ihn unversehrt ziehen“'
  rationale: Im Kontext hebt Saul den außergewöhnlichen Charakter von Davids Handeln hervor. Das Hebräische besitzt kein eigenes Fragezeichen, lässt die rhetorische Lesart jedoch zu; sie ergibt im Deutschen einen klaren, natürlichen Gedankengang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unversehrt seines Weges ziehen lassen“ gibt die hebräische Wendung idiomatisch wieder und bewahrt zugleich ihr Wegmotiv. Das generische אִישׁ wird natürlich mit „jemand“ übersetzt.
