  source_fidelity: 'Der Entwurf gibt die hebräische Eidesbitte sachgerecht wieder: וְעַתָּה als „Und nun“, den Imperativ „schwöre mir“, die Anrufung „bei Jahwe“, die durch אִם eingeführten negativen Verpflichtungen sowie beide Anliegen Sauls (Nachkommen und Name/Familienhaus). Die expliziten deutschen Negationen geben die in der hebräischen Eidesformel kontextuell erschlossene Bedeutung korrekt wieder.'
  naturalness: „Und nun schwöre mir bei Jahwe, dass du …“ ist klares, modernes Standarddeutsch mit angemessen würdigem biblischem Register. „Nach mir“, „ausrotten“ und „den Namen … tilgen“ sind idiomatisch und bewahren die knappe, eindringliche Aussage.
  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe des Tetragramms. „Nachkommen“ trifft זַרְעִי im dynastischen Kontext; „Name“ und „Haus meines Vaters“ bewahren die familial-soziale Bildsprache. Die Anmerkungen erklären sowohl die elliptische Eidesformel als auch die kulturelle Tragweite von „Name“ angemessen.
