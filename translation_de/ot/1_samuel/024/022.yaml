id: 1SA.24.22
reference: 1 Samuel 24:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֤בְעָ/ה לִּ/י֙ בַּֽ/יהוָ֔ה אִם תַּכְרִ֥ית אֶת זַרְעִ֖/י אַֽחֲרָ֑/י וְ/אִם תַּשְׁמִ֥יד אֶת שְׁמִ֖/י מִ/בֵּ֥ית אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: de
  text: Und nun schwöre mir bei Jahwe, dass du meine Nachkommen nach mir nicht ausrottest[a] und meinen Namen nicht aus dem Haus meines Vaters tilgst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „wenn du meine Nachkommenschaft nach mir abschneidest“. In dieser Eidesformel führt „wenn“ den Inhalt dessen ein, was David nicht tun soll. Für „Nachkommen“ steht wörtlich „Same“.'
    reason: lexical_alternative
  - marker: b
    text: Der „Name“ bezeichnet hier Sauls fortbestehende Erinnerung und Familienlinie innerhalb seines väterlichen Hauses.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt den anschließenden Diskursmarker und leitet Sauls abschließende Bitte natürlich ein.
- source_word: הִשָּׁבְעָה לִּי
  choice: schwöre mir
  rationale: Die direkte, idiomatische Wiedergabe des Nifal-Imperativs mit indirektem Objekt.
- source_word: בַּיהוָה
  choice: bei Jahwe
  rationale: Entspricht der deutschen Eidesformel und gibt den ausdrücklich genannten Gottesnamen wieder.
- source_word: אִם ... וְאִם
  choice: dass ... und
  rationale: אִם führt hier innerhalb der Eidesbitte den Inhalt der verlangten Verpflichtung ein; ein konditionales „wenn“ wäre im Deutschen missverständlich.
- source_word: תַּכְרִית אֶת זַרְעִי
  choice: meine Nachkommen ... nicht ausrottest
  rationale: זֶרַע bezeichnet hier Sauls Nachkommenschaft; כרת im Hifil meint die Beseitigung beziehungsweise Auslöschung seiner Linie.
- source_word: אַחֲרָי
  choice: nach mir
  rationale: Bewahrt die knappe zeitliche Wendung, die auf die Zeit nach Sauls Tod zielt.
- source_word: תַּשְׁמִיד אֶת שְׁמִי
  choice: meinen Namen nicht ... tilgst
  rationale: „Den Namen tilgen“ wahrt das Bild der Auslöschung von familiärer Erinnerung und Fortbestand.
- source_word: מִבֵּית אָבִי
  choice: aus dem Haus meines Vaters
  rationale: Bewahrt die hebräische Verwandtschaftsbezeichnung für den väterlichen Familien- beziehungsweise Sippenverband.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der Eidesformel
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich; „Jahwe“ gibt den Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Negation in der mit אִם eingeleiteten Eidesbitte
  choice: dass du ... nicht ... und ... nicht
  alternative: wenn du ...
  rationale: Die hebräische Eidesformel ist elliptisch und verwendet אִם; im Kontext bittet Saul um ein Versprechen, seine Nachkommen und seinen Namen nicht auszulöschen. Die deutsche Form macht diese pragmatische Bedeutung deutlich, ohne daraus eine gewöhnliche Bedingung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ausrotten“ erhält die Härte von כרת im dynastischen Zusammenhang; „den Namen tilgen“ bewahrt das hebräische Bild. Die Satzstruktur bleibt eng am Ausgangstext, ohne die elliptische Eidesformel unverständlich wörtlich nachzubilden.
