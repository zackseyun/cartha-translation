source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: de
  text: 'Und David sagte zu Saul: „Warum hörst du auf die Worte eines Mannes, der sagt: ‚Sieh[a], David will dir Böses antun[b]‘?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Siehe“ oder „Schau“. Das hebräische Wort lenkt die Aufmerksamkeit nachdrücklich auf die folgende Behauptung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „David sucht dein Unheil“ beziehungsweise „David will dir schaden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der Erzählform führt die Handlung weiter; „Und … sagte“ bewahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: לְשָׁאוּל
  choice: zu Saul
  rationale: Die Präposition ל kennzeichnet den Angesprochenen; „Saul“ ist die übliche deutsche Namensform.
- source_word: לָמָּה
  choice: Warum
  rationale: Die direkte Frage wird im modernen Deutsch schlicht und treffend mit „Warum“ wiedergegeben.
- source_word: תִשְׁמַע
  choice: hörst du auf
  rationale: שׁמע bezeichnet hier nicht bloß akustisches Hören, sondern das Beachten oder Glauben einer Aussage. „Auf jemanden hören“ gibt diesen Sinn idiomatisch wieder.
- source_word: אֶת דִּבְרֵי אָדָם
  choice: die Worte eines Mannes
  rationale: אָדָם steht im Singular und lässt sich hier am ehesten als unbestimmte Bezeichnung eines männlichen Anklägers verstehen. Die Formulierung bewahrt zugleich die Bildlichkeit von „Worten“.
- source_word: לֵאמֹר
  choice: der sagt
  rationale: Der Infinitiv führt den Inhalt der fremden Behauptung ein. Nach „eines Mannes“ ist ein Relativsatz im Deutschen natürlicher als ein bloßes „indem er sagt“.
- source_word: הִנֵּה
  choice: Pass auf
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die folgende Behauptung. „Pass auf“ ist gegenwärtiges, mündliches Deutsch, ohne das archaische „Siehe“ zu verwenden.
- source_word: מְבַקֵּשׁ
  choice: will
  rationale: Das Partizip bezeichnet ein anhaltendes Bestreben. Im Zusammenhang mit רָעָתֶךָ drückt „will dir … antun“ die behauptete feindliche Absicht idiomatisch aus.
- source_word: רָעָתֶךָ
  choice: dir Böses antun
  rationale: רָעָה kann Böses, Unheil oder Schaden bezeichnen. Die verbale deutsche Wendung ist natürlich und bewahrt mit „Böses“ die lexikalische und moralische Offenheit des hebräischen Ausdrucks.
theological_decisions:
- issue: Bedeutung von אָדָם
  choice: eines Mannes
  alternative: menschliche Worte / Worte von Leuten
  rationale: Der hebräische Ausdruck steht im Singular. Der Kontext erlaubt zwar grundsätzlich einen allgemein-menschlichen oder kollektiven Sinn, legt jedoch die Rede eines Anklägers nahe; deshalb bleibt der Singular im Haupttext erhalten.
- issue: Bedeutung von רָעָתֶךָ
  choice: dir Böses antun
  alternative: dir schaden / dein Unheil suchen
  rationale: „Böses“ erhält die mögliche moralische Färbung von רָעָה, während die Wendung im Kontext zugleich konkret als beabsichtigter Schaden verstanden werden kann. Die Fußnote nennt diese sachlich engere Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter mündlicher Rede. „Hörst du auf“ gibt das Beachten einer Anschuldigung idiomatisch wieder. Der singuläre Ausdruck „eines Mannes“ und die Bedeutungsbreite von רָעָה bleiben erhalten; Alternativen werden in den Fußnoten ausgewiesen.
