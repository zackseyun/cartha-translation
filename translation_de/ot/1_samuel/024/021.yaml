source:
  edition: WLC
  text: וְ/עַתָּה֙ הִנֵּ֣ה יָדַ֔עְתִּי כִּ֥י מָלֹ֖ךְ תִּמְל֑וֹךְ וְ/קָ֨מָה֙ בְּ/יָ֣דְ/ךָ֔ מַמְלֶ֖כֶת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/021.yaml
  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: de
  text: 'Und nun, sieh: Ich weiß, dass du ganz gewiss König sein wirst und dass das Königtum über Israel in deiner Hand Bestand haben wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: sieh
  rationale: Gibt den aufmerksamkeitslenkenden Diskurspartikel knapp und natürlich wieder.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: du wirst ganz gewiss König sein
  rationale: Die Verbindung von Infinitiv absolutus und finitem Verb verstärkt die Gewissheit; „ganz gewiss“ bildet diese Emphase ab.
- source_word: מַמְלֶכֶת יִשְׂרָאֵל
  choice: das Königtum über Israel
  rationale: Im Zusammenhang bezeichnet מַמְלֶכֶת die Königsherrschaft; „über Israel“ vermeidet die im Deutschen mögliche Lesart, Israel selbst sei das Königreich als Gebiet.
- source_word: וְקָמָה בְּיָדְךָ
  choice: wird in deiner Hand Bestand haben
  rationale: Bewahrt sowohl das Bild von Herrschaft in Davids Hand als auch die Bedeutung des festen Bestehens.
theological_decisions:
- issue: Gewissheit von Davids künftigem Königtum
  choice: ganz gewiss
  alternative: sicherlich
  rationale: Die emphatische hebräische Konstruktion wird deutlich wiedergegeben, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Art der Herrschaft
  choice: das Königtum über Israel
  alternative: das Königreich Israel
  rationale: Der Vers spricht im Kontext von der gefestigten Königsherrschaft Davids; die Formulierung lässt politische und dynastische Aspekte offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ erhält den markanten Aufmerksamkeitsruf, während „in deiner Hand Bestand haben“ die hebräische Bildsprache in verständlicher Form bewahrt.
