  source_fidelity: 'Der Haupttext folgt dem masoretischen Hebräisch: Saul richtet die Bitte an Jahwe, den Gott Israels; הָבָה תָמִים wird angemessen als Bitte um ein eindeutiges Los wiedergegeben. Die passive Auswahl von Jonatan und Saul sowie das im Kontrast stehende Freiausgehen des Volkes entsprechen dem Losentscheid-Kontext von וַיִּלָּכֵד und יָצָאוּ.'
