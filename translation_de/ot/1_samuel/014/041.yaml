source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֗וּל אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הָ֣בָ/ה תָמִ֑ים וַ/יִּלָּכֵ֧ד יוֹנָתָ֛ן וְ/שָׁא֖וּל וְ/הָ/עָ֥ם יָצָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: de
  text: 'Da sagte Saul zu Jahwe, dem Gott Israels: »Gib ein eindeutiges Los!«[a] Da wurden Jonatan und Saul getroffen, während das Volk frei ausging.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Gib Vollkommenes/Untadeliges.« Gemeint ist wahrscheinlich die Bitte um eine unanfechtbare Entscheidung durch das Los. Eine längere alte Lesart, die in der Septuaginta erhalten ist, lautet sinngemäß: »Warum hast du deinem Diener heute nicht geantwortet? Wenn diese Schuld bei mir oder bei meinem Sohn Jonatan liegt, Jahwe, Gott Israels, dann gib Urim; wenn sie aber bei deinem Volk Israel liegt, dann gib Tummim.«'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: הָבָה
  choice: Gib
  rationale: Die direkte Bitte an Gott entspricht der imperativischen Form des Hebräischen.
- source_word: תָמִים
  choice: ein eindeutiges Los
  rationale: תָמִים bedeutet wörtlich »vollständig, unversehrt, untadelig«. Im Zusammenhang der Losentscheidung bezeichnet die knappe Wendung wahrscheinlich die Bitte um ein klares, unanfechtbares Ergebnis; »Los« ist sinngemäß ergänzt.
- source_word: וַיִּלָּכֵד
  choice: wurden ... getroffen
  rationale: לכד kann bei einer Ermittlung durch das Los das Identifiziert- oder Ausgewähltwerden bezeichnen. Die deutsche Wendung »vom Los getroffen werden« macht den Zusammenhang natürlich verständlich.
- source_word: יָצָאוּ
  choice: ging ... frei aus
  rationale: Wörtlich steht »gingen hinaus«. Im Gegensatz zu den vom Los Getroffenen bedeutet es hier, dass das Volk nicht ausgewählt beziehungsweise entlastet wurde.
theological_decisions:
- issue: Textform von Sauls Gebet
  choice: 'Die kurze masoretische Lesart bildet den Haupttext: »Gib ein eindeutiges Los!«'
  alternative: Die Septuaginta bewahrt eine längere Fassung mit der Frage, warum Gott nicht geantwortet habe, und mit der Bitte um Urim beziehungsweise Tummim.
  rationale: Die vorgegebene hebräische Textgrundlage ist der masoretische Text. Seine schwierige Kürze wird nicht stillschweigend durch die längere alte Lesart ersetzt; diese wird jedoch wegen ihrer textgeschichtlichen Bedeutung in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe und schwierige Ausdrucksweise des masoretischen Textes bleibt erkennbar; notwendige Kontextverdeutlichungen werden sparsam vorgenommen. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Bitte.
