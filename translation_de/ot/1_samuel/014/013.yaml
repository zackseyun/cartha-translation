base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: de
  text: Da kletterte Jonatan auf Händen und Füßen hinauf, und sein Waffenträger folgte ihm. Sie fielen vor Jonatan, und sein Waffenträger tötete sie hinter ihm her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »war hinter ihm her dabei, sie zu töten«. Das hebräische Partizip kann den fortdauernden Verlauf der Handlung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: kletterte … hinauf
  rationale: Das Verb bedeutet grundsätzlich »hinaufgehen«; zusammen mit »auf Händen und Füßen« bezeichnet es hier anschaulich das Erklettern des steilen Aufstiegs.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: auf Händen und Füßen
  rationale: Die körperliche Haltung wird nahe am hebräischen Wortlaut und zugleich in natürlichem Deutsch wiedergegeben.
- source_word: נֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die feste deutsche militärische Bezeichnung gibt die Rolle des Mannes wieder, der Jonatans Waffen beziehungsweise Ausrüstung trug.
- source_word: אַחֲרָיו
  choice: folgte ihm / hinter ihm
  rationale: Das zweimalige Wort bezeichnet hier sowohl das Folgen als auch die räumliche Position hinter Jonatan. Die unterschiedlichen deutschen Formulierungen ergeben einen natürlichen Satz und bewahren beide Vorkommen.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: Sie fielen vor Jonatan
  rationale: Die Wendung lässt offen, ob das Fallen im Kampf, die Niederlage oder das unmittelbare Zusammenbrechen im Vordergrund steht; die knappe deutsche Form bewahrt diese Offenheit.
- source_word: מְמוֹתֵת
  choice: tötete sie
  rationale: Das Partizip beschreibt die tödliche Handlung des Waffenträgers. Die einfache Vergangenheitsform ist im deutschen Erzählfluss natürlich; eine stärker verlaufsbezogene Wiedergabe bleibt als Fußnotenalternative erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholung der räumlichen Beziehung zu Jonatan bleibt erhalten; »Sie fielen vor Jonatan« wird nicht zu »wurden erschlagen« vereindeutigt.
