  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ לַֽ/אֲחִיָּ֔ה הַגִּ֖ישָׁ/ה אֲר֣וֹן הָ/אֱלֹהִ֑ים כִּֽי הָיָ֞ה אֲר֧וֹן הָ/אֱלֹהִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא וּ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: de
  text: 'Da sagte Saul zu Ahija: „Bring die Lade Gottes herbei[a]!“ Denn die Lade Gottes war an jenem Tag bei den Israeliten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Textzeugen und Ausleger lesen hier: „Bring das Efod herbei!“ Der hebräische Text dieser Ausgabe lautet: „die Lade Gottes“.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „bei den Söhnen Israels“.'
    reason: translation_clarity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit Imperfekt führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: לַאֲחִיָּה
  choice: zu Ahija
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הַגִּישָׁה
  choice: Bring ... herbei
  rationale: Der Hifil-Imperativ von נגשׁ bedeutet hier, etwas heranzubringen; „herbeibringen“ ist idiomatisch und bewahrt den Richtungssinn.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Der masoretische Text sagt ausdrücklich „Lade Gottes“ und nicht „Bundeslade Gottes“; die Übersetzung fügt keine Bezeichnung aus anderen Zusammenhängen hinzu.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die erklärende Bemerkung des Erzählers ein.
- source_word: הָיָה
  choice: war
  rationale: Die einfache Vergangenheitsform entspricht dem hebräischen Verb; die Ortsbeziehung wird bereits durch „bei den Israeliten“ ausgedrückt.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Wendung gibt den bestimmten vergangenen Zeitpunkt natürlich und genau wieder.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: bei den Israeliten
  rationale: „Israeliten“ ist die natürliche moderne deutsche Entsprechung für „Söhne Israels“ als Bezeichnung des Volkes; die Präposition wird mit „bei“ wiedergegeben.
theological_decisions:
- issue: „Lade Gottes“ gegenüber der textgeschichtlichen Lesart „Efod“
  choice: die Lade Gottes
  alternative: das Efod
  rationale: Der vorgegebene masoretische hebräische Text liest an beiden Stellen „Lade Gottes“. Die abweichende Lesart wird nicht in den Haupttext übernommen, aber transparent in einer Fußnote genannt.
- issue: Bezug der Lade zu Israel am genannten Tag
  choice: war an jenem Tag bei den Israeliten
  alternative: war dort an jenem Tag bei den Israeliten
  rationale: Das Hebräische enthält kein eigenes Wort für „dort“. Die räumliche Beziehung wird durch die Präposition vor „Israeliten“ ausgedrückt; die knappere Wiedergabe vermeidet eine unnötige Festlegung.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. „Lade Gottes“ folgt eng dem Ausgangstext; „Israeliten“ vermeidet das im heutigen Deutsch missverständliche generische „Söhne Israels“. Alle Fußnotenmarker stehen an den jeweils einschlägigen Stellen im Haupttext.
