source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: de
  text: 'Und Saul sagte: „Geht durch das Volk und sagt ihnen: ›Jeder soll seinen Stier und jeder sein Schaf zu mir bringen. Schlachtet sie hier und esst, damit ihr euch nicht an Jahwe versündigt, indem ihr Fleisch mit dem Blut esst.[a]‹“ Da brachte das ganze Volk noch in jener Nacht jeder seinen Stier an der Hand[b], und sie schlachteten die Tiere dort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mit dem Blut“ oder „über dem Blut essen“; gemeint ist offenbar, Fleisch zu essen, bevor das Blut ordnungsgemäß abgelaufen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt vermutlich: Jeder führte seinen Stier an der Hand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: Geht durch das Volk
  rationale: Der Imperativ von פוץ fordert die Angesprochenen auf, sich unter dem Volk zu verteilen. Die deutsche Wiedergabe bezeichnet den Vorgang natürlich, ohne ein bloßes Zerstreuen des Volkes nahezulegen.
- source_word: הַגִּישׁוּ אֵלַי
  choice: soll ... zu mir bringen
  rationale: Der Hifil von נגשׁ bedeutet hier »heranbringen«; die modale Form gibt den innerhalb der direkten Rede weitergegebenen Befehl idiomatisch wieder.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: Jeder soll seinen Stier und jeder sein Schaf
  rationale: Das wiederholte אִישׁ wird distributiv wiedergegeben. שֶׂה kann ein Schaf oder eine Ziege beziehungsweise Kleinvieh bezeichnen; »Schaf« wahrt die traditionelle konkrete Lesart, ohne die breitere Wortbedeutung dogmatisch festzulegen.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: Schlachtet sie hier
  rationale: שׁחט bezeichnet das Schlachten von Tieren, nicht ein allgemeines Töten. בָּזֶה wird entsprechend seiner wahrscheinlichen lokalen Bedeutung mit »hier« wiedergegeben.
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: damit ihr euch nicht an Jahwe versündigt
  rationale: Die Formulierung bringt den vorbeugenden Zweck der Anweisung zum Ausdruck. לַיהוָה bezeichnet den, gegen den sich die Sünde richtet.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: indem ihr Fleisch mit dem Blut esst
  rationale: Die ungewöhnliche Wendung lautet wörtlich etwa »mit/über dem Blut essen«. »Fleisch« ist als verständliches Bezugswort aus dem Kontext ergänzt; eine Fußnote erklärt die gemeinte Praxis, ohne die hebräische Präposition zu überbestimmen.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: jeder seinen Stier an der Hand
  rationale: Die konkrete hebräische Ausdrucksweise bleibt erhalten. Gemeint sein dürfte, dass jeder seinen Stier persönlich an der Hand führte; diese Deutung wird in der Fußnote ausgewiesen.
- source_word: הַלַּיְלָה
  choice: noch in jener Nacht
  rationale: Der temporale Ausdruck bezeichnet die betreffende Nacht; »noch« vermittelt im Deutschen den unmittelbaren Vollzug im Erzählzusammenhang, ohne den Sachgehalt zu verändern.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: und sie schlachteten die Tiere dort
  rationale: Das im Hebräischen implizite Objekt wird zur Klarheit aus dem unmittelbaren Kontext ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als »Jahwe« wiedergegeben. So bleibt der Charakter als Gottesname sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Sünde beim Essen אֶל־הַדָּם
  choice: Fleisch mit dem Blut essen
  alternative: über dem Blut essen
  rationale: Der Zusammenhang deutet auf Fleisch hin, dessen Blut nicht ordnungsgemäß abgelaufen war. Weil die hebräische Präposition ungewöhnlich ist, wird die wörtlichere Spannweite in der Fußnote bewahrt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und befehlend. »Stier« gibt שׁוֹר konkret wieder; »Schaf« ist leserfreundlich, obwohl שֶׂה auch eine Ziege oder allgemeiner ein Stück Kleinvieh bezeichnen kann. Alle Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
