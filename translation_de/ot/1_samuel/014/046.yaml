    rationale: Der Genitiv kann sowohl »die Verfolgung, die Saul an den Philistern vollzieht« als auch »die Verfolgung, die von den Philistern ausgeht« bedeuten. Der hebräische Text meint eindeutig Sauls Verfolgung der Philister.
