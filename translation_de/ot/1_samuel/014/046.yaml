revisions:
- from: Da ließ Saul von der Verfolgung der Philister ab,[a] und die Philister zogen an ihren Ort.
  to: Da hörte Saul auf, die Philister zu verfolgen,[a] und die Philister gingen an ihren Ort.
  rationale: Die explizite Infinitivkonstruktion macht eindeutig, dass Saul die Philister nicht länger verfolgt. Die Fußnote bewahrt die auffällige Bildlichkeit von »hinaufgehen« und »von hinter ...«, ohne daraus eine ungrammatische deutsche Pseudo-Wörtlichkeit zu machen. »Gingen an ihren Ort« bleibt bei der neutralen Aussage von הלך und trägt kein nicht ausdrücklich genanntes Zurückkehren ein.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:26:17Z'
review_pass:
