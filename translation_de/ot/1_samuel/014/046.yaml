  text: וַ/יַּ֣עַל שָׁא֔וּל מֵ/אַחֲרֵ֖י פְּלִשְׁתִּ֑ים וּ/פְלִשְׁתִּ֖ים הָלְכ֥וּ לִ/מְקוֹמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/046.yaml
  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: de
  text: Da hörte Saul auf, die Philister zu verfolgen,[a] und die Philister gingen an ihren Ort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Da ging Saul von hinter den Philistern herauf.« Die hebräische Wendung bezeichnet hier das Beenden der Verfolgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ließ … ab
  rationale: עלה bedeutet gewöhnlich »hinaufgehen«, bildet hier aber zusammen mit מֵאַחֲרֵי eine Wendung für das Beenden beziehungsweise Aufgeben der Verfolgung. Eine wörtliche Wiedergabe mit »hinaufgehen« wäre im Deutschen missverständlich.
- source_word: מֵאַחֲרֵי
  choice: von der Verfolgung der Philister
  rationale: Die Verbindung bedeutet wörtlich »von hinter den Philistern her« und bezeichnet im militärischen Zusammenhang das Ablassen von ihrer Verfolgung.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Übliche deutsche Bezeichnung dieses Volkes.
- source_word: הָלְכוּ
  choice: zogen
  rationale: הלך heißt grundsätzlich »gehen«. »Zogen« passt natürlich zu einer militärischen Gruppe, ohne das im Hebräischen nicht ausdrücklich enthaltene »kehrten zurück« einzutragen.
- source_word: לִמְקוֹמָם
  choice: an ihren Ort
  rationale: מָקוֹם bedeutet »Ort, Platz«; das Suffix bezeichnet ihren eigenen Ort. »Nach Hause« wäre zu spezifisch.
