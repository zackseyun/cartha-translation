    rationale: »weg hinter den Philistern her« ist im Deutschen keine tragfähige wörtliche Entsprechung von מֵאַחֲרֵי. Die Fußnote sollte die wörtlichen Elemente nachvollziehbar, aber als ungewöhnliche Ausdrucksweise kennzeichnen.
