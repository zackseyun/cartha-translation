  source_fidelity: 'Die Wiedergabe trifft den idiomatischen Sinn von וַיַּעַל מֵאַחֲרֵי im militärischen Kontext: Saul beendet die Verfolgung. Die Formulierung »Verfolgung der Philister« ist im Deutschen jedoch semantisch doppeldeutig und kann auch die von den Philistern ausgehende Verfolgung bezeichnen. »zogen an ihren Ort« gibt הָלְכוּ לִמְקוֹמָם angemessen wieder, ist aber weniger natürlich als »gingen an ihren Ort«.'
  naturalness: Die vorgeschlagene Haupttextkorrektur ist modernes, klares Standarddeutsch. Sie beseitigt die Genitivmehrdeutigkeit, ohne den knappen Stil des Verses aufzugeben. Die vorhandene Fußnote ist in ihrer wörtlichen Formulierung nicht idiomatisch deutsch und bildet die hebräische Präpositionenkonstruktion unpräzise ab.
  terminology: »Philister« ist die etablierte deutsche Volksbezeichnung. Es sind keine besonderen theologischen Begriffe betroffen.
