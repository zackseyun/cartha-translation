base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/007.yaml
  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: de
  text: 'Sein Waffenträger sagte zu ihm: »Tu alles, was du im Sinn hast. Geh nur; sieh, ich bin bei dir, ganz nach deinem Herzen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die feste Bezeichnung meint den persönlichen Träger der Waffen; »Waffenträger« ist im Deutschen präzise und geläufig.
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: Tu alles, was du im Herzen hast
  rationale: Bewahrt das hebräische Herz-Bild als Sitz von Absicht und Entschluss, ohne es erklärend auf »was du vorhast« zu verengen.
- source_word: נְטֵה לָךְ
  choice: Geh nur
  rationale: Das knappe נְטֵה kann hier zum Sich-Hinwenden beziehungsweise Vorangehen auffordern. »Geh nur« gibt den ermutigenden Impuls im Zusammenhang natürlich wieder, ohne ein bestimmtes Bewegungsbild unnötig festzulegen.
- source_word: הִנְנִי עִמְּךָ כִּלְבָבֶךָ
  choice: sieh, ich bin bei dir, ganz nach deinem Herzen
  rationale: »Sieh« bildet הִנְנִי sichtbar ab; »ganz nach deinem Herzen« erhält die ungewöhnliche Wiederholung des Herz-Motivs und die Zusage uneingeschränkter Unterstützung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und entschlossen; die zweimalige Erwähnung des Herzens wird entsprechend dem Hebräischen bewahrt.
