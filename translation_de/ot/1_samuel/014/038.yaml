  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: de
  text: 'Da sagte Saul: »Kommt her, ihr führenden Männer des Volkes[a], und erkennt und seht, wodurch es heute zu dieser Sünde gekommen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alle Ecken des Volkes«; gemeint sind die führenden Männer oder Vertreter des Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: Kommt her
  rationale: Der pluralische Imperativ mit הֲלֹם fordert die Angesprochenen auf, an Sauls Standort heranzutreten; „Kommt her“ ist im modernen Deutsch natürlich und präzise.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: ihr führenden Männer des Volkes
  rationale: Wörtlich steht „alle Ecken des Volkes“. Das bildhafte Wort bezeichnet hier offenbar die maßgeblichen Männer beziehungsweise Repräsentanten des Volkes. „Führende Männer“ gibt diesen Sinn verständlich wieder, ohne eine bestimmte Amtsbezeichnung einzutragen.
- source_word: וּדְעוּ וּרְאוּ
  choice: untersucht genau
  rationale: Die beiden Imperative „erkennt und seht“ bilden eine nachdrückliche Aufforderung, den Sachverhalt festzustellen. Im Deutschen gibt „untersucht genau“ die kombinierte investigative Bedeutung natürlich wieder.
- source_word: בַּמָּה
  choice: wodurch
  rationale: Die Verbindung aus ב und מה fragt hier nach dem Mittel oder Umstand, durch den die Sünde zustande kam. „Wodurch“ wahrt diesen Bezug genauer als das allgemeinere „wie“.
- source_word: הָיְתָה
  choice: geschehen ist
  rationale: Das Verb bezeichnet hier das Zustandekommen beziehungsweise Geschehen der Sünde. „Geschehen ist“ entspricht der hebräischen Form und klingt im Kontext angemessen.
- source_word: הַחַטָּאת הַזֹּאת
  choice: diese Sünde
  rationale: חטאת bezeichnet im Erzählzusammenhang die Verfehlung vor Gott. „Sünde“ bewahrt das moralische und theologische Gewicht.
- source_word: הַיּוֹם
  choice: heute
  rationale: Dies ist die übliche moderne deutsche Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Bildhafte Wendung „alle Ecken des Volkes“
  choice: ihr führenden Männer des Volkes
  alternative: 'alle Oberhäupter des Volkes; alle Vertreter des Volkes; wörtlich: alle Ecken des Volkes'
  rationale: Die Wendung meint keine buchstäblichen Ecken, sondern hervorgehobene beziehungsweise repräsentative Männer des Volkes. Die Übersetzung vermeidet zugleich, eine im Hebräischen nicht ausdrücklich genannte institutionelle Rangordnung festzulegen.
- issue: Moralische Bedeutung von חטאת
  choice: Sünde
  alternative: Verfehlung; Schuld; Unrecht
  rationale: Der Kontext handelt von einer Verfehlung, die das Verhältnis zu Gott betrifft. „Sünde“ erhält diese theologische Tragweite, ohne den konkreten Täter oder die genaue Art der Tat vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und befehlend. Die hebräische Doppelaufforderung „erkennt und seht“ wird ihrer Gesamtbedeutung nach mit „untersucht genau“ wiedergegeben; die ungewöhnliche Metapher „Ecken des Volkes“ wird im Haupttext idiomatisch übersetzt und in der Fußnote offengelegt.
