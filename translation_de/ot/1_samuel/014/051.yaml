base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: de
  text: Kisch war der Vater Sauls, und Ner, der Vater Abners, war ein Sohn Abiëls.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Kisch, Vater Sauls, und Ner, Vater Abners, Sohn Abiëls.“ Die knappe hebräische Form ergänzt die Kopula nicht ausdrücklich; „Sohn Abiëls“ bezieht sich auf Ner.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: Kisch
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben; die einleitende Konjunktion wird im Satzbau berücksichtigt.
- source_word: אֲבִי שָׁאוּל
  choice: war der Vater Sauls
  rationale: Die hebräische Nominalfügung bedeutet wörtlich „Vater Sauls“. Für einen vollständigen, natürlichen deutschen Satz wird die Kopula „war“ ergänzt.
- source_word: וְ/נֵר
  choice: und Ner
  rationale: Die Konjunktion verbindet die beiden genealogischen Angaben; der Personenname wird in der gebräuchlichen deutschen Form wiedergegeben.
- source_word: אֲבִי אַבְנֵר
  choice: der Vater Abners
  rationale: Die Konstruktion wird als Apposition zu Ner wiedergegeben. Der deutsche Genitiv bewahrt die knappe genealogische Ausdrucksweise.
- source_word: בֶּן אֲבִיאֵל
  choice: war ein Sohn Abiëls
  rationale: 'Die Wendung wird syntaktisch auf Ner bezogen: Ner ist Vater Abners und Sohn Abiëls. Die Kopula wird für klares, natürliches Deutsch ergänzt; „ein Sohn“ vermeidet die unbelegte Aussage, er sei der einzige Sohn gewesen.'
