  text: וַ/תְּהִ֞י הַ/מַּכָּ֣ה הָ/רִאשֹׁנָ֗ה אֲשֶׁ֨ר הִכָּ֧ה יוֹנָתָ֛ן וְ/נֹשֵׂ֥א כֵלָ֖י/ו כְּ/עֶשְׂרִ֣ים אִ֑ישׁ כְּ/בַ/חֲצִ֥י מַעֲנָ֖ה צֶ֥מֶד שָׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: de
  text: Bei diesem ersten Angriff erschlugen Jonathan und sein Waffenträger etwa zwanzig Mann auf einer Fläche von ungefähr einer halben Furche eines Jochs Ackerland.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „auf ungefähr der Hälfte einer Furche eines Jochs Feld“. Die hebräische Maß- bzw. Ortsangabe ist unsicher; „Joch“ kann die Fläche bezeichnen, die ein Ochsengespann pflügen konnte.'
    reason: Die ungewöhnliche und nicht sicher zu deutende hebräische Angabe wird im Haupttext lesbar wiedergegeben und in der Fußnote näher am Wortlaut erläutert, ohne ihre genaue Bedeutung festzulegen.
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: bei diesem ersten Angriff
  rationale: מַכָּה kann einen Schlag, Angriff oder dessen tödliches Ergebnis bezeichnen. Im Deutschen gibt „erster Angriff“ den militärischen Vorgang natürlich wieder, während „erschlugen“ den tödlichen Ausgang ausdrücklich macht.
- source_word: אֲשֶׁר הִכָּה
  choice: erschlugen
  rationale: נכה bezeichnet hier im Zusammenhang mit den gefallenen Gegnern ein tödliches Niederschlagen. Der deutsche Plural bezieht Jonathan und seinen Waffenträger gemeinsam ein.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: und sein Waffenträger
  rationale: Dies ist die übliche und verständliche deutsche Bezeichnung für den militärischen Begleiter, der Waffen beziehungsweise Ausrüstung trägt.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: etwa zwanzig Mann
  rationale: Die Präposition כְּ kennzeichnet eine ungefähre Zahl; „etwa“ bewahrt diese Näherungsangabe.
- source_word: כְּבַחֲצִי מַעֲנָה
  choice: auf einer Strecke von ungefähr der halben Furchenlänge
  rationale: מַעֲנָה bezeichnet wahrscheinlich eine Pflugfurche oder einen gepflügten Streifen. „Furchenlänge“ macht verständlich, dass die schwer deutbare Angabe hier eine räumliche Ausdehnung beschreibt; „ungefähr“ gibt das vorangestellte כְּ wieder.
- source_word: צֶמֶד שָׂדֶה
  choice: eines Jochs Ackerland
  rationale: צֶמֶד bedeutet wörtlich „Paar/Joch“ und kann als Flächenmaß das Land bezeichnen, das ein Ochsengespann pflügen kann. Die historische Maßbezeichnung „Joch Ackerland“ hält das landwirtschaftliche Bild fest, ohne eine unsichere moderne Flächenumrechnung einzuführen.
