base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: de
  text: 'Denn so wahr Jahwe lebt, der Israel rettet: Selbst wenn es bei meinem Sohn Jonatan ist, soll er gewiss sterben!« Doch niemand aus dem ganzen Volk antwortete ihm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: so wahr Jahwe lebt
  rationale: Die feste hebräische Schwurformel wird mit der entsprechenden natürlichen und feierlichen deutschen Wendung wiedergegeben.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: der Israel rettet
  rationale: Das substantivierte Partizip beschreibt Jahwe als denjenigen, der Israel rettet; das Präsens bewahrt diesen charakterisierenden Sinn.
- source_word: כִּי אִם
  choice: selbst wenn
  rationale: Im Schwur leitet die Verbindung einen zugespitzten hypothetischen Fall ein.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: es sich bei meinem Sohn Jonatan findet
  rationale: Die Formulierung bewahrt das im Hebräischen unausgesprochene Bezugswort, klingt im Deutschen aber verständlich. Aus dem Zusammenhang ist eine Schuld oder Verfehlung gemeint.
- source_word: מוֹת יָמוּת
  choice: muss er sterben
  rationale: Infinitivus absolutus und finite Verbform verstärken die sichere beziehungsweise unabwendbare Todesfolge; die deutsche Formulierung wahrt den feierlich-richterlichen Nachdruck ohne archaisch zu wirken.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: Doch niemand aus dem ganzen Volk antwortete ihm
  rationale: „Doch“ macht den erzählerischen Gegensatz deutlich; „niemand aus dem ganzen Volk“ gibt den partitiven Sinn natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen als Namen wieder und folgt der Projektvorgabe, ohne ihn durch einen Titel zu ersetzen.
- issue: Unausgesprochener Gegenstand in יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: Das Bezugswort bleibt im Haupttext unausgesprochen.
  alternative: die Schuld ist bei meinem Sohn Jonatan
  rationale: Der Zusammenhang legt Schuld oder Verfehlung nahe, doch der hebräische Wortlaut benennt sie nicht ausdrücklich. Die Fußnote erklärt die Ellipse, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformel bleibt feierlich; die hebräische Ellipse wird im Haupttext erhalten und in der Fußnote erläutert.
