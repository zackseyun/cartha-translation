  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: de
  text: 'Da sagte Jonatan: „Mein Vater hat das Land in Bedrängnis gebracht. Seht doch, wie meine Augen hell geworden sind[a], weil ich ein wenig von diesem Honig gekostet habe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Augen sind hell“; eine hebräische Ausdrucksweise für neue Kraft und Wachheit nach dem Essen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: hat … in Bedrängnis gebracht
  rationale: Das Verb bezeichnet das Stören, Aufwühlen oder Ins-Unglück-Bringen. „In Bedrängnis gebracht“ gibt die verursachende Bedeutung natürlich wieder, ohne das Ausmaß unnötig zu verstärken.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Die direkte Wiedergabe lässt offen, ob vor allem das Gebiet oder seine Bevölkerung als betroffen gedacht ist.
- source_word: רְאוּ נָא
  choice: Seht doch
  rationale: Der Imperativ mit נָא ist eine nachdrückliche, zugleich abgemilderte Aufforderung. „Seht doch“ klingt im modernen Deutschen natürlich.
- source_word: אֹרוּ עֵינַי
  choice: meine Augen wieder hell geworden sind
  rationale: Die hebräische Wendung bewahrt das Bild heller Augen und bezeichnet hier erkennbar neu gewonnene Kraft oder Wachheit.
- source_word: טָעַמְתִּי
  choice: ich … gekostet habe
  rationale: „Kosten“ entspricht dem spezifischen Sinn „schmecken/probieren“ und passt zur ausdrücklich kleinen Menge.
- source_word: מְעַט
  choice: ein wenig
  rationale: Die knappe Mengenangabe wird präzise und idiomatisch wiedergegeben.
- source_word: דְּבַשׁ הַזֶּה
  choice: von diesem Honig
  rationale: „Honig“ entspricht dem Substantiv; der Text nennt an dieser Stelle nicht ausdrücklich eine Honigwabe. Das im Deutschen nötige „von“ verbindet die Mengenangabe natürlich mit dem Stoffwort.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jonatan“ folgt der im Deutschen gebräuchlichen biblischen Namensform. Das hebräische Augenbild bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
