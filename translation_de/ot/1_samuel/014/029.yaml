    issue: „wieder“ in „meine Augen wieder hell geworden sind“
    rationale: Das Hebräische sagt, dass Jonatans Augen hell geworden bzw. hell sind, und verwendet das Bild für neue Wachheit/Kraft. Ein ausdrückliches „wieder“ steht nicht im Text und sollte nicht ergänzt werden.
  - severity: low
    issue: Die Fußnote bezeichnet „meine Augen hell geworden sind“ als wörtlich.
    rationale: „Geworden sind“ ist im Deutschen eine sinnvolle resultative Wiedergabe, aber keine streng wörtliche Entsprechung. Die Anmerkung sollte das hebräische Bild als „meine Augen sind hell“ ausweisen und anschließend dessen idiomatische Bedeutung erläutern.
