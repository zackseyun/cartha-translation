  source_fidelity: Der Text gibt den fortdauernden, heftigen Krieg gegen die Philister sowie Sauls wiederholte Heranziehung geeigneter Männer zutreffend wieder. „Sooft“ gibt den im Kontext iterativen Sinn von וְרָאָה angemessen wieder. „Solange Saul lebte“ ist eine natürliche Entfaltung der Zeitformel כָּל־יְמֵי שָׁאוּל; die wörtliche Form bleibt in Fußnote a dokumentiert.
