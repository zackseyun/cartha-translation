source:
  edition: WLC
  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ חֲזָקָ֣ה עַל פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֣י שָׁא֑וּל וְ/רָאָ֨ה שָׁא֜וּל כָּל אִ֤ישׁ גִּבּוֹר֙ וְ/כָל בֶּן חַ֔יִל וַ/יַּאַסְפֵ֖/הוּ אֵלָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: de
  text: Der Krieg gegen die Philister war heftig, solange Saul lebte.[a] Und sooft Saul einen starken oder tapferen Mann sah,[b] nahm er ihn in seinen Dienst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Tage Sauls“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeden starken Mann und jeden Sohn der Tapferkeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „sammelte er ihn zu sich“; gemeint ist die Aufnahme in Sauls Streitmacht.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  choice: Der Krieg ... war
  rationale: Die Form führt die Erzählung fort; מִלְחָמָה bezeichnet hier den andauernden Kriegszustand, nicht nur eine einzelne Schlacht.
- source_word: חֲזָקָה
  choice: heftig
  rationale: Das Adjektiv bedeutet wörtlich „stark“; auf einen Krieg bezogen gibt „heftig“ dessen anhaltende Intensität natürlich wieder.
- source_word: עַל פְּלִשְׁתִּים
  choice: gegen die Philister
  rationale: עַל bezeichnet zusammen mit „Krieg“ die gegnerische Partei.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: solange Saul lebte
  rationale: Die hebräische Wendung „alle Tage Sauls“ bezeichnet die gesamte Lebens- beziehungsweise Regierungszeit Sauls; die gewählte Form ist im heutigen Deutsch klar und natürlich.
- source_word: וְרָאָה
  choice: Und sooft ... sah
  rationale: Im Zusammenhang bezeichnet die Form eine wiederholt eintretende Handlung, auf die jeweils Sauls Reaktion folgt.
- source_word: כָּל אִישׁ גִּבּוֹר וְכָל בֶּן חַיִל
  choice: einen starken oder tapferen Mann
  rationale: גִּבּוֹר bezeichnet einen starken beziehungsweise kriegstüchtigen Mann; בֶּן־חַיִל ist wörtlich ein „Sohn der Tüchtigkeit/Tapferkeit“. Im militärischen Zusammenhang gibt „stark oder tapfer“ beide Beschreibungen verständlich wieder.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: nahm er ihn in seinen Dienst
  rationale: Wörtlich sammelte Saul den Mann „zu sich“; im Kontext ist damit die Aufnahme in seine persönliche Streitmacht beziehungsweise seinen Dienst gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die iterative Aussage wird mit „sooft“ ausgedrückt; die wörtliche hebräische Bildsprache wird, wo sie im Haupttext unnatürlich wäre, in den Fußnoten bewahrt.
