  terminology: „Philister“ ist die etablierte Namensform. Die Wiedergabe „starken oder tapferen Mann“ macht die beiden hebräischen Kategorien verständlich; die Fußnote hält die wörtlichere idiomatische Formulierung בן־חיל transparent fest. Die Deutung von אסף אליו als Aufnahme in den Dienst ist durch Fußnote c ausreichend abgesichert.
