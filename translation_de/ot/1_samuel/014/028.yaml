base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: de
  text: 'Da antwortete einer aus dem Volk: „Dein Vater hat das Volk eindringlich schwören lassen: ‚Verflucht ist, wer heute Nahrung[a] zu sich nimmt!‘“ Da war das Volk erschöpft.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brot“; hier ist Nahrung allgemein gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „war matt“ beziehungsweise „war entkräftet“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן אִישׁ מֵהָעָם וַיֹּאמֶר
  choice: Da antwortete einer aus dem Volk und sagte
  rationale: Bewahrt die hebräische Erzählformel und gibt den unbestimmten einzelnen Sprecher natürlich wieder.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: hat ... nachdrücklich unter Eid gestellt
  rationale: Die Verbindung von Infinitivus absolutus und finitem Hifil verstärkt die Aussage; die Formulierung wahrt sowohl den verursachenden Sinn als auch den Nachdruck.
- source_word: אָרוּר הָאִישׁ אֲשֶׁר יֹאכַל
  choice: Verflucht ist, wer ... zu sich nimmt
  rationale: Die feierliche Fluchformel bleibt erhalten; das deutsche „wer“ gibt den allgemein geltenden maskulinen Singular idiomatisch wieder.
- source_word: לֶחֶם
  choice: Nahrung
  rationale: Wörtlich bedeutet das Wort „Brot“, bezeichnet hier im Zusammenhang jedoch Essen beziehungsweise Nahrung allgemein.
- source_word: וַיָּעַף הָעָם
  choice: Und das Volk war erschöpft
  rationale: Das Verb bezeichnet Müdigkeit oder Entkräftung. Die kollektive Einzahl von „Volk“ wird im Deutschen entsprechend singularisch wiedergegeben; das einfache „und“ vermeidet eine stärkere kausale Festlegung als im Hebräischen.
