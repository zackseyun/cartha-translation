revisions:
- from: 'Da antwortete einer aus dem Volk und sagte: „Dein Vater hat das Volk nachdrücklich unter Eid gestellt und gesagt: ‚Verflucht ist, wer heute Nahrung[a] zu sich nimmt!‘“ Und das Volk war erschöpft.[b]'
  to: 'Da antwortete einer aus dem Volk: „Dein Vater hat das Volk eindringlich schwören lassen: ‚Verflucht ist, wer heute Nahrung[a] zu sich nimmt!‘“ Da war das Volk erschöpft.[b]'
  rationale: Die Revision beschränkt sich auf eine idiomatischere Wiedergabe der emphatischen kausativen Eidesformel und eine leichte Glättung der Redeeinleitung. Bedeutung, Register, Ambiguität des Schlussverbs sowie beide Fußnotenanker bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:26:10Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Sprecher, Bezug auf Jonathans Vater, die emphatische Eidesverpflichtung, die Fluchformel, den heutigen Verzicht auf Nahrung und die Erschöpfung des Volkes insgesamt zutreffend wieder. Die Wiedergabe „hat ... unter Eid gestellt“ ist jedoch im modernen Deutsch weniger idiomatisch und kann rechtlich-technisch wirken; „hat ... schwören lassen“ bildet den kausativen Sinn von הִשְׁבִּיעַ klarer ab. Der Anschluss des Schlusssatzes wird mit „Da“ narrativ wiedergegeben, ohne eine über das Hebräische hinausgehende Kausalität festzulegen.
  naturalness: „Da antwortete einer aus dem Volk und sagte“ ist verständlich, aber „antwortete ... und sagte“ wirkt im Deutschen leicht formelhaft. Die minimal geglättete Fassung bewahrt den biblisch-würdigen Registerton. „Nahrung zu sich nimmt“ ist natürlich und präzise; „erschöpft“ ist ein tragfähiges modernes Äquivalent für וַיָּעַף.
  terminology: „Verflucht“ wahrt die feierliche Fluchformel אָרוּר. „Nahrung“ ist kontextgerecht für לֶחֶם; die Fußnote legt die Grundbedeutung „Brot“ transparent offen. Die Alternativen zu וַיָּעַף bleiben sachgerecht als „matt“ bzw. „entkräftet“ kenntlich.
  issues:
  - severity: low
    issue: Die Formulierung „hat das Volk nachdrücklich unter Eid gestellt“ ist nicht die natürlichste moderne Wiedergabe.
    rationale: Das hebräische Hifil הַשְׁבֵּעַ הִשְׁבִּיעַ bedeutet, das Volk schwören zu lassen bzw. es durch einen Eid zu verpflichten; die vorgeschlagene Fassung macht dies idiomatischer und ebenso nachdrücklich deutlich.
