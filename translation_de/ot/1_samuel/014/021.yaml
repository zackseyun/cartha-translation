base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: de
  text: Die Hebräer aber, die schon früher bei den Philistern gewesen waren[a] und mit ihnen in das Lager ringsumher hinaufgezogen waren[b], hielten sich nun ebenfalls zu Israel, das bei Saul und Jonatan war.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wie gestern, vorgestern“; eine hebräische Redewendung für „früher“ oder „vormals“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Formulierung für die Lage des Lagers ist schwer verständlich. Möglich ist auch: „mit ihnen in das Lager ringsum“; die genaue räumliche Zuordnung bleibt unsicher.'
    reason: textual_difficulty
  - marker: c
    text: 'Wörtlich steht hier: „auch sie, bei Israel zu sein“. Der Zusammenhang legt einen Wechsel ihrer Zuordnung nahe, ohne dessen Art näher zu bestimmen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: Die Hebräer aber
  rationale: „Hebräer“ bewahrt die Bezeichnung des Ausgangstextes, statt sie mit „Israeliten“ gleichzusetzen. „Aber“ gibt den narrativen Anschluss und den Kontrast zur bisherigen Lage natürlich wieder.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: die ... bei den Philistern gewesen waren
  rationale: Die Konstruktion bezeichnet hier Zugehörigkeit oder Verbindung mit den Philistern, ohne zwingend Besitz oder dauerhafte Loyalität auszudrücken.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: schon früher
  rationale: Die wörtliche Wendung „wie gestern, vorgestern“ ist ein Idiom für die frühere Zeit. „Schon früher“ ist natürlich und stellt den zeitlichen Gegensatz heraus.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: und mit ihnen ... hinaufgezogen waren
  rationale: „Hinaufgezogen“ bewahrt die Richtungsbedeutung von עלה; das Plusquamperfekt ordnet das Geschehen vor der nun beschriebenen Veränderung ein.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: in das ringsum gelagerte Heerlager
  rationale: Die schwierige räumliche Wendung wird so verstanden, dass das Lager der Philister ringsum beziehungsweise in der Umgebung aufgeschlagen war. Die Formulierung bleibt nahe am räumlichen Bild.
- source_word: וְגַם הֵמָּה
  choice: nun ebenfalls
  rationale: „Ebenfalls“ gibt die hervorgehobene Einbeziehung dieser Hebräer wieder; „nun“ macht den im Zusammenhang erkennbaren Wechsel zeitlich verständlich, ohne ein eigenständiges hebräisches Zeitwort zu behaupten.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: hielten sich ... zu Israel
  rationale: Der Infinitiv lautet wörtlich „bei Israel zu sein“. Im Zusammenhang ist ein Wechsel der Zuordnung nahegelegt. „Sich zu jemandem halten“ drückt diesen Anschluss aus, ohne eine formelle oder endgültige Bekehrung beziehungsweise Loyalitätserklärung einzutragen.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: das bei Saul und Jonatan war
  rationale: Der Relativsatz wird grammatisch auf das kollektiv verstandene „Israel“ bezogen. „Bei“ wahrt die schlichte Ausdrucksweise des Hebräischen.
theological_decisions:
- issue: Art des Wechsels zu Israel
  choice: hielten sich nun ebenfalls zu Israel
  alternative: schlossen sich Israel an / wechselten zu Israel über
  rationale: Der Kontext legt einen Wechsel der Seite nahe, doch der hebräische Wortlaut sagt lediglich „bei Israel zu sein“. Die gewählte Formulierung lässt die Art und Dauer dieses Wechsels offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem komplexen hebräischen Satz erkennbar verpflichtet, wird aber durch eine natürliche deutsche Relativsatzfolge lesbar gemacht. „Heerlager“ verdeutlicht den militärischen Kontext; „Jonatan“ folgt der üblichen modernen deutschen Namensform.
