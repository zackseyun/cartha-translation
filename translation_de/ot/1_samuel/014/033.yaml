base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: de
  text: 'Da berichteten sie Saul: »Sieh nur, das Volk sündigt gegen Jahwe, indem es Fleisch samt dem Blut isst.[a]« Er sagte: »Ihr habt treulos gehandelt. Wälzt heute einen großen Stein zu mir her.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf/über dem Blut essen«. Gemeint ist offenbar, Fleisch zu essen, aus dem das Blut nicht ordnungsgemäß abgelassen worden war.'
    reason: Die wörtliche hebräische Wendung ist im Deutschen missverständlich; die Fußnote bewahrt ihr Bild und kennzeichnet die kontextuelle Deutung.
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: Da berichteten sie Saul
  rationale: Die Erzählform führt das nächste Geschehen ein; »berichteten« gibt נגד sachgerecht wieder. Die einleitende Redeformel לֵאמֹר wird im Deutschen natürlich durch den Doppelpunkt ausgedrückt.
- source_word: הִנֵּה
  choice: Sieh nur
  rationale: Die aufmerksamkeitslenkende Partikel wird modern und mit ihrem nachdrücklichen Ton wiedergegeben, ohne das altertümliche »Siehe« zu verwenden.
- source_word: חֹטִאים לַיהוָה
  choice: sündigt gegen Jahwe
  rationale: חטא mit ל bezeichnet hier ein Vergehen gegen Gott; der deutsche Singular entspricht dem kollektiven Subjekt »das Volk«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Form des in der hebräischen Vorlage ausdrücklich stehenden Gottesnamens.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: indem es Fleisch samt dem Blut isst
  rationale: Die hebräische Wendung lautet wörtlich »auf/über dem Blut essen«, bezeichnet im Zusammenhang aber den Verzehr von Fleisch, dessen Blut nicht ordnungsgemäß abgelassen wurde. Die Wiedergabe ist verständlich und macht die im Hebräischen nur vorausgesetzte Speise deutlich; die Bildform bleibt in der Fußnote dokumentiert.
- source_word: בְּגַדְתֶּם
  choice: Ihr habt treulos gehandelt
  rationale: בגד bezeichnet schwerwiegendes treuloses oder pflichtwidriges Handeln; »treulos gehandelt« bewahrt die moralische Schärfe.
- source_word: גֹּלּוּ אֵלַי הַיּוֹם אֶבֶן גְּדוֹלָה
  choice: Wälzt heute einen großen Stein zu mir her
  rationale: Der Pluralimperativ von גלל bedeutet konkret »wälzen/rollen«. »Zu mir her« gibt die Richtung אֵלַי im Deutschen natürlich wieder; »heute« entspricht unmittelbar הַיּוֹם.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. »Jahwe« bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Art der Sünde beim Essen mit Blut
  choice: Fleisch samt dem Blut essen
  alternative: über dem Blut essen
  rationale: Der Text beschreibt einen Verstoß beim Fleischverzehr, ohne dessen genaue kultische Ausführung ausführlich zu erklären. Die Übersetzung gibt den kontextuellen Sinn wieder, während die Fußnote den ungewöhnlichen hebräischen Wortlaut und dessen Deutung offenlegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählton. Kurze direkte Rede und konkrete Verben bewahren die Dringlichkeit der Szene; altertümliche Formeln werden vermieden.
