base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: de
  text: 'Da sagte Saul zu Jonatan: „Sag mir, was du getan hast!“ Jonatan berichtete ihm: „Ich habe tatsächlich mit der Spitze des Stabes, den ich in der Hand hatte, ein wenig Honig gekostet, und nun werde ich sterben.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, als rhetorische Frage: „… und nun muss ich sterben?“ Das Hebräische bekräftigt das Verb „kosten“ durch seine Wiederholung; die Schlusswendung kann als resignierte Feststellung oder als rhetorischer Protest verstanden werden.'
    reason: Bewahrt die Betonung der hebräischen Verbform und vermerkt die kontextuell mögliche rhetorische Lesart, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Sag mir
  rationale: Der Imperativ von נגד mit Dativpronomen wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: מֶה עָשִׂיתָה
  choice: was du getan hast
  rationale: Das Perfekt bezeichnet eine abgeschlossene Handlung mit unmittelbarer gegenwärtiger Folge.
- source_word: וַיַּגֶּד לוֹ
  choice: berichtete es ihm
  rationale: Greift dieselbe Wortwurzel wie Sauls Aufforderung auf, vermeidet aber im Deutschen die schwerfällige Wiederholung „sagte es ihm“.
- source_word: טָעֹם טָעַמְתִּי
  choice: Ich habe tatsächlich … gekostet
  rationale: Infinitivus absolutus und finites Verb bekräftigen die Handlung. „Tatsächlich“ bewahrt diese emphatische beziehungsweise einräumende Kraft, ohne die kontextuelle Deutung „nur“ in den Haupttext einzutragen.
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: mit der Spitze des Stabes
  rationale: ב bezeichnet hier das Mittel; קצה ist das Ende beziehungsweise die Spitze des getragenen Stabes.
- source_word: מְעַט דְּבַשׁ
  choice: ein wenig Honig
  rationale: Direkte, natürliche Wiedergabe der kleinen Menge.
- source_word: הִנְנִי אָמוּת
  choice: und nun soll ich sterben
  rationale: „Nun“ vermittelt die unmittelbare Konsequenz von הִנְנִי; „soll ich sterben“ bewahrt im Deutschen die mögliche Spannung zwischen resignierter Feststellung und rhetorischem Protest.
theological_decisions:
- issue: Aussage oder rhetorische Frage in הִנְנִי אָמוּת
  choice: Ausruf mit „soll ich sterben“
  alternative: „und nun werde ich sterben“ oder „und nun muss ich sterben?“
  rationale: Der unpunktierte hebräische Wortlaut legt den Satzmodus nicht eindeutig fest. Die gewählte deutsche Form lässt sowohl betroffene Feststellung als auch protestierende Frage anklingen; die Fußnote macht die Ambiguität ausdrücklich.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Jonatan“ folgt der im heutigen deutschen Bibeldeutsch verbreiteten Namensform. Der Haupttext vermeidet sowohl das altertümliche „Siehe“ als auch eine vorschnelle Festlegung auf Aussage oder Frage.
