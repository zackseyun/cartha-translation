base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/035.yaml
  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: de
  text: Und Saul baute einen Altar für Yahweh. Dies war der erste Altar, den er für Yahweh baute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er begann, ihn als einen Altar für Yahweh zu bauen.“ Die hebräische Formulierung ist ungewöhnlich und wird gewöhnlich so verstanden, dass dies der erste Altar war, den Saul für Yahweh baute.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: בנה bezeichnet hier schlicht das Errichten eines Altars; „baute“ ist die natürliche und präzise deutsche Wiedergabe.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Übliche deutsche Form des hebräischen Personennamens.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: Etablierte deutsche Entsprechung für מזבח, eine Stätte für Opfergaben.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Die Präposition ל bezeichnet hier die Widmung beziehungsweise Zuordnung des Altars. Der Satzbau „Yahweh einen Altar bauen“ gibt dies im Deutschen idiomatisch wieder; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: Dies war der erste Altar, den er … baute
  rationale: Die ungewöhnliche hebräische Wendung wird weithin als Aussage verstanden, dass dies Sauls erster für Yahweh gebauter Altar war. Die Wiedergabe macht diesen idiomatischen Sinn klar, während die wörtlichere Deutung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Yahweh“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von אֹתוֹ הֵחֵל לִבְנוֹת
  choice: Dies war der erste Altar, den er Yahweh baute.
  alternative: Er begann, ihn als Altar für Yahweh zu bauen.
  rationale: הֵחֵל bedeutet für sich genommen „begann“, doch die gesamte Konstruktion kann idiomatisch den ersten derartigen Bau Sauls bezeichnen. Da die Syntax mehrdeutig beziehungsweise ungewöhnlich ist, steht die verbreitete kontextuelle Deutung im Haupttext und die wörtlichere Möglichkeit in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur folgt dem erzählenden Stil des Hebräischen; die genuine Schwierigkeit der zweiten Satzhälfte wird durch eine Fußnote sichtbar gehalten.
