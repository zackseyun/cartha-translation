  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: de
  text: 'Wenn sie zu uns Folgendes sagen: »Bleibt[a], wo ihr seid, bis wir zu euch kommen«, dann bleiben wir an unserem Platz[b] und gehen nicht zu ihnen hinauf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seid still« oder »Wartet«. Das hebräische Verb kann bedeuten, still beziehungsweise schweigend an Ort und Stelle zu bleiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »unter uns«; die hebräische Wendung bedeutet, am eigenen Platz zu bleiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die übliche deutsche Entsprechung für die Konditionalpartikel, die hier das von Jonatan vorgeschlagene Zeichen einleitet.
- source_word: כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: sie zu uns sagen
  rationale: כֹּה führt den unmittelbar folgenden Wortlaut ein; im natürlichen Deutschen muss »so/folgendermaßen« vor direkter Rede nicht ausdrücklich wiedergegeben werden.
- source_word: דֹּמּוּ
  choice: Bleibt dort
  rationale: Der Imperativ von דמם kann Stillsein, Schweigen oder Verharren bezeichnen. Im militärischen Zusammenhang steht das Verbleiben am Ort im Vordergrund; die Fußnote bewahrt die lexikalische Spannweite.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: bis wir zu euch kommen
  rationale: Gibt das Erreichen der beiden Männer durch die Philister natürlich und richtungsgerecht wieder.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: dann bleiben wir an unserem Platz
  rationale: Die Folge des Bedingungssatzes wird mit »dann« verdeutlicht. Das wörtlich ungewöhnliche תַחְתֵּינוּ ist idiomatisch als Verbleiben am eigenen Standort zu verstehen.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: und steigen nicht zu ihnen hinauf
  rationale: Bewahrt die topografische Bedeutung von עלה, da sich die Philister oberhalb ihrer Position befinden, ohne vorschnell »angreifen« einzutragen.
