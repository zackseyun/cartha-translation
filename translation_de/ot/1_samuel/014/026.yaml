base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: de
  text: Als das Volk in den Wald kam, siehe, da floss Honig[a]. Doch niemand brachte seine Hand an seinen Mund[b], denn das Volk fürchtete den Schwur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „siehe, ein Fließen von Honig“; auch möglich: „der Honig floss“ oder „ein Strom von Honig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Niemand brachte seine Hand an seinen Mund“; das heißt, niemand aß von dem Honig.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist Sauls zuvor ausgesprochener Schwur, der jeden mit einem Fluch bedrohte, der vor dem Abend etwas essen würde; siehe 1. Samuel 14,24.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das Wayyiqtol von בוא bezeichnet hier die fortschreitende Handlung der Erzählung; „kam“ ist mit „in den Wald“ natürlich und quellennah.
- source_word: הָעָם
  choice: das Volk
  rationale: עם bedeutet grundsätzlich „Volk“. Obwohl im Zusammenhang das Kriegsvolk gemeint ist, bewahrt „das Volk“ die Breite und die Wiederholung des hebräischen Ausdrucks.
- source_word: הַיַּעַר
  choice: der Wald
  rationale: יער bezeichnet ein bewaldetes Gebiet; „Wald“ ist die klare standarddeutsche Entsprechung.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: הנה lenkt lebhaft die Aufmerksamkeit auf das unerwartete Bild. „Siehe“ erhält diese Erzählwirkung in würdigem Deutsch.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: da floss Honig
  rationale: Die ungewöhnliche nominale Wendung bezeichnet ein Gehen beziehungsweise Fließen von Honig. Die verbale Wiedergabe ist im Deutschen natürlich und wahrt den Sinn, ohne einen eigentlichen „Strom“ vorauszusetzen.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: Doch niemand führte seine Hand zum Mund
  rationale: Die konkrete hebräische Ausdrucksweise wird bewahrt; gemeint ist, dass niemand von dem Honig aß. „Doch“ gibt den sachlichen Gegensatz zum vorhandenen Honig natürlich wieder.
- source_word: כִּי יָרֵא הָעָם
  choice: denn das Volk fürchtete
  rationale: כי begründet das Verhalten, und ירא bezeichnet hier die Furcht vor den Folgen einer Übertretung.
- source_word: הַשְּׁבֻעָה
  choice: den Schwur
  rationale: שבועה bedeutet „Schwur/Eid“. „Schwur“ passt hier natürlich zu Sauls zuvor ausgesprochener Verpflichtung; die damit verbundene Fluchandrohung wird nicht anstelle des Quellwortes in den Haupttext eingesetzt.
theological_decisions:
- issue: Verhältnis von Schwur und Fluchandrohung
  choice: Im Haupttext steht „Schwur“.
  alternative: „Fluch“ oder „Verwünschung“
  rationale: Der Kontext aus 1 Samuel 14,24 zeigt eine mit Fluch bewehrte Verpflichtung, doch das Wort שבועה in diesem Vers bezeichnet ausdrücklich den Schwur. Die Anmerkung erläutert den Zusammenhang, ohne beides gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das erzählerische „siehe“ bewahrt die Aufmerksamkeitspartikel הנה. Die konkrete Hand-zum-Mund-Bildlichkeit bleibt erhalten und wird in der Fußnote erklärt.
