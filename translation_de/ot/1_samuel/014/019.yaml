  text: וַ/יְהִ֗י עַ֣ד דִּבֶּ֤ר שָׁאוּל֙ אֶל הַ/כֹּהֵ֔ן וְ/הֶ/הָמ֗וֹן אֲשֶׁר֙ בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים וַ/יֵּ֥לֶךְ הָל֖וֹךְ וָ/רָ֑ב וַ/יֹּ֧אמֶר שָׁא֛וּל אֶל הַ/כֹּהֵ֖ן אֱסֹ֥ף יָדֶֽ/ךָ־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: de
  text: 'Während Saul noch mit dem Priester redete, nahm das Getöse im Lager der Philister immer weiter zu. Da sagte Saul zum Priester: »Zieh deine Hand zurück[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Sammle deine Hand ein.« Saul fordert den Priester auf, seine gerade ausgeführte Handlung abzubrechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: Während Saul noch … redete
  rationale: Die Konstruktion beschreibt eine gleichzeitig andauernde Handlung, die von der folgenden Entwicklung unterbrochen wird. Im Deutschen gibt »während … noch redete« diesen Verlauf natürlich wieder; וַיְהִי dient hier der narrativen Verknüpfung und muss nicht eigens mit »und es geschah« abgebildet werden.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die bestimmte Form bezeichnet den bereits aus dem Zusammenhang bekannten Priester.
- source_word: הֶהָמוֹן
  choice: das Getöse
  rationale: הָמוֹן bezeichnet hier den lauten, ungeordneten Aufruhr im Lager und nicht bloß ein neutrales Geräusch.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: im Lager der Philister
  rationale: Natürliche und genaue Wiedergabe der hebräischen Genitivverbindung.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: nahm … immer weiter zu
  rationale: Die Verbindung aus finitem Verb und Infinitivus absolutus drückt eine fortschreitende Steigerung aus. Die gewählte Formulierung erhält diesen Verlauf in idiomatischem Deutsch.
- source_word: אֱסֹף יָדֶךָ
  choice: Zieh deine Hand zurück
  rationale: Die Wendung lautet wörtlich etwa »Sammle deine Hand ein«. Die gewählte Übersetzung bewahrt das konkrete Bild und macht zugleich verständlich, dass der Priester seine gerade ausgeführte Handlung abbrechen soll.
theological_decisions:
- issue: Art der priesterlichen Handlung
  choice: Die Handlung wird nicht näher bestimmt.
  alternative: Die Wendung ausdrücklich auf das Befragen Gottes durch Urim und Tummim oder auf eine andere konkrete Kulthandlung beziehen.
  rationale: Der Vers sagt nicht ausdrücklich, welche Handlung der Priester mit seiner Hand vollzog. Die Übersetzung vermeidet daher eine über den Wortlaut hinausgehende kultische Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die fortschreitende Unruhe wird idiomatisch ausgedrückt; das konkrete Bild des hebräischen Befehls bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
