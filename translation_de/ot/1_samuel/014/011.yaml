source:
  edition: WLC
  text: וַ/יִּגָּל֣וּ שְׁנֵי/הֶ֔ם אֶל מַצַּ֖ב פְּלִשְׁתִּ֑ים וַ/יֹּאמְר֣וּ פְלִשְׁתִּ֔ים הִנֵּ֤ה עִבְרִים֙ יֹֽצְאִ֔ים מִן הַ/חֹרִ֖ים אֲשֶׁ֥ר הִתְחַבְּאוּ שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: de
  text: 'Als die beiden sich dem Posten der Philister[a] zeigten, sagten die Philister: »Seht, die Hebräer[b] kommen aus den Löchern hervor, in denen sie sich versteckt hatten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Stellung der Philister« bzw. »dem Außenposten der Philister«.'
    reason: lexical_alternative
  - marker: b
    text: »Hebräer« ist hier die ethnische Bezeichnung, mit der die Philister die Israeliten benennen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: zeigten sich
  rationale: Das Nifal von גלה bezeichnet hier im Zusammenhang ein absichtliches Sichtbarwerden. »Zeigten sich« gibt die reflexive Bedeutung natürlich wieder, ohne ein bloß passives Entdecktwerden nahezulegen.
- source_word: שְׁנֵיהֶם
  choice: die beiden
  rationale: Die Form hebt ausdrücklich Jonathan und seinen Waffenträger als Zweiergruppe hervor.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: Posten der Philister
  rationale: מַצָּב kann in diesem militärischen Zusammenhang sowohl die stationierte Truppe als auch ihren Standort bezeichnen. »Posten« ist im Deutschen natürlich und wahrt diese Bedeutungsbreite weitgehend.
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Aufmerksamkeitsruf wird in direkter Rede knapp und gegenwärtig wiedergegeben; »siehe« wäre heute deutlich altertümlicher.
- source_word: עִבְרִים
  choice: die Hebräer
  rationale: Die ethnische Fremdbezeichnung der Philister bleibt erhalten und wird nicht durch »Israeliten« ersetzt.
- source_word: יֹצְאִים
  choice: kommen … hervor
  rationale: Das Partizip beschreibt den aus Sicht der Philister gerade ablaufenden Vorgang. Die getrennte Formulierung klingt im Deutschen anschaulich und natürlich.
- source_word: מִן הַחֹרִים
  choice: aus den Löchern
  rationale: חֹרִים bezeichnet konkret Löcher oder Hohlräume. »Höhlen« wäre enger und würde den Ausdruck unnötig spezifizieren.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: in denen sie sich versteckt hatten
  rationale: Das Hitpael wird reflexiv wiedergegeben; das Plusquamperfekt stellt das Verstecken als der beobachteten Bewegung vorausgehend dar.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt lebendig; altertümliche Wendungen werden vermieden. Die konkrete, möglicherweise geringschätzige Rede von den »Löchern« bleibt erhalten.
