source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: de
  text: 'Da sagte Jonatan zu dem jungen Mann, der seine Waffen trug: „Komm, lass uns zum Posten[a] dieser Unbeschnittenen[b] hinübergehen. Vielleicht wird Jahwe für uns handeln; denn nichts kann Jahwe daran hindern, durch viele oder wenige zu retten.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Garnison“ beziehungsweise „zur Stellung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dieser Unbeschnittenen“; eine vom Zeichen des Bundes her geprägte, verächtliche Bezeichnung.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: „Denn für Jahwe gibt es kein Hindernis, durch viele oder durch wenige zu retten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: der seine Waffen trug
  rationale: Die partizipiale Wendung bezeichnet wörtlich den, der Jonatans Ausrüstung beziehungsweise Waffen trägt. Die ausgeschriebene Form gibt die hebräische Konstruktion verständlich wieder; „Waffenträger“ wäre ebenfalls möglich.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Komm, lass uns … hinübergehen
  rationale: Imperativ und Kohortativ verbinden Aufforderung und gemeinsamen Entschluss. „Hinübergehen“ passt zur Bewegung auf die feindliche Stellung zu.
- source_word: מַצַּב
  choice: Posten
  rationale: Das Wort bezeichnet hier eine militärische Stellung. „Posten“ ist im modernen Deutschen natürlich und lässt offen, ob eine kleinere Stellung oder eine stärker besetzte Garnison gemeint ist.
- source_word: הָעֲרֵלִים
  choice: diese Unbeschnittenen
  rationale: Das substantivierte Adjektiv wird wörtlich bewahrt. Es ist hier eine vom Bundeszeichen her geprägte, abwertende Bezeichnung und nicht lediglich ein neutraler Volksname.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Das Wort drückt Hoffnung aus, ohne Gottes Handeln als sicher vorauszusetzen.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: Jahwe wird für uns handeln
  rationale: Das allgemein gehaltene Verb „tun/handeln“ bezeichnet im Zusammenhang ein Eingreifen Gottes, ohne dessen genaue Form näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: מַעְצוֹר
  choice: nichts kann … daran hindern
  rationale: Das Substantiv bezeichnet ein Hindernis oder eine Beschränkung. Die verbale deutsche Fassung ist natürlich und gibt die Aussage von Jahwes unbeschränkter Fähigkeit zu retten wieder.
- source_word: לְהוֹשִׁיעַ
  choice: zu retten
  rationale: Der Hifil-Infinitiv kann militärische Befreiung bezeichnen; „retten“ wahrt zugleich die breitere Bedeutung des hebräischen Verbs.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: durch viele oder durch wenige
  rationale: Die Präposition bezeichnet hier das Mittel beziehungsweise die Zahl derer, durch die Jahwe rettet. Die knappe Gegenüberstellung bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Hebräischen steht ausdrücklich das Tetragramm. „Jahwe“ bewahrt in deutscher Form den persönlichen Bundesnamen.
- issue: Unsicherheit und Vertrauen in Jonatans Aussage
  choice: „Vielleicht“ bleibt uneingeschränkt stehen
  alternative: eine Gewissheit ausdrückende Formulierung
  rationale: אוּלַי kennzeichnet echte Ungewissheit über das konkrete Eingreifen Jahwes. Jonatans Zuversicht betrifft Gottes unbeschränkte Macht zu retten, nicht die Gewissheit, dass er in diesem Fall handeln wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Direkte Rede bleibt knapp und entschlossen. Der militärische Zusammenhang wird klar wiedergegeben, ohne מַצַּב übermäßig präzise festzulegen; die Spannung zwischen Jonatans vorsichtiger Hoffnung und seinem festen Vertrauen in Jahwes Macht bleibt erhalten.
