    issue: Die Haupttextformulierung „das ganze Land kam in den Wald“ ist im Deutschen semantisch irreführend.
    rationale: Das hebräische „Land“ funktioniert hier metonymisch und wird durch das Pluralverb als menschliche Gruppe erkennbar. Deutsch sollte diese Metonymie nicht so wörtlich abbilden, dass der Satz ein unbelebtes Land als Handelnden darstellt.
  - severity: low
