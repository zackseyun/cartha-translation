  text: Und alle Menschen des Landes kamen in den Wald[a], und Honig lag auf dem Erdboden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das ganze Land«. Das hebräische Verb steht im Plural und weist hier auf die kollektive Bedeutung »alle Menschen des Landes« hin.'
