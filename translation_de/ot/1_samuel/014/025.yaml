    rationale: Der Plural weist auf eine kollektive Lesart; die Fußnote soll dies erläutern, ohne eine weitergehende Präzisierung der Personengruppe zu behaupten.
  revised_text: Und alle Menschen des Landes kamen in den Wald[a], und Honig lag auf dem Erdboden[b].
