lexical_decisions:
- source_word: וְ/כָל הָ/אָ֖רֶץ
  choice: das ganze Land
  rationale: Die Wiedergabe bewahrt zunächst die auffällige hebräische Metonymie. Da das folgende Verb im Plural steht, sind offenbar die Menschen des Landes beziehungsweise das versammelte Volk gemeint; dies wird in der Fußnote erläutert.
- source_word: בָּ֣אוּ בַ/יָּ֑עַר
  choice: kam in den Wald
  rationale: בוא mit der Richtungsangabe bezeichnet das Hineinkommen in den Wald. Das deutsche Singularverb folgt grammatisch dem Kollektivausdruck »das ganze Land«, während der hebräische Plural dessen kollektiven Sinn erkennen lässt.
- source_word: דְבַ֖שׁ
  choice: Honig
  rationale: דבש bedeutet hier schlicht »Honig«. »Wilder Honig« wäre im Waldkontext denkbar, wird vom hebräischen Ausdruck jedoch nicht ausdrücklich gesagt.
- source_word: עַל פְּנֵ֥י הַ/שָּׂדֶֽה
  choice: auf dem Boden
  rationale: עַל־פני bezeichnet die Oberfläche; שדה kann zwar »Feld« heißen, bezeichnet hier im Waldzusammenhang wahrscheinlich die sichtbare Bodenfläche. Natürliches Deutsch gibt dies mit »auf dem Boden« wieder.
