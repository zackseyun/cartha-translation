  terminology: »Saul« und »Jonatan« entsprechen der üblichen deutschen Bibelschreibung. »Los« ist der angemessene Begriff. Die Revision fügt keine Aussage über eine göttliche Lenkung oder Bewertung des Losentscheids hinzu.
