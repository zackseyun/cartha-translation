base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: de
  text: 'Da sagte Saul: »Werft das Los[a] zwischen mir und meinem Sohn Jonatan.« Und Jonatan wurde ausgelost.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Lasst es zwischen mir und Jonatan, meinem Sohn, fallen«; gemeint ist die Entscheidung durch das Los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte Saul
  rationale: Das narrative Wayyiqtol führt die Handlung fort; »Da sagte« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: הַפִּילוּ
  choice: Werft das Los
  rationale: Der Hifil-Imperativ Plural von נפל bedeutet wörtlich »lasst fallen«. Im Zusammenhang des Losverfahrens ist »werft das Los« die natürliche idiomatische Wiedergabe; das im Hebräischen unausgesprochene Objekt wird aus dem Kontext ergänzt.
- source_word: בֵּינִי וּבֵין
  choice: zwischen mir und
  rationale: Die paarige Präposition bezeichnet hier die Auswahl zwischen zwei Personen und wird im Deutschen direkt mit »zwischen … und …« wiedergegeben.
- source_word: בְּנִי
  choice: meinem Sohn
  rationale: בֵּן mit dem Suffix der ersten Person Singular bezeichnet ausdrücklich Sauls Sohn.
- source_word: וַיִּלָּכֵד
  choice: wurde getroffen
  rationale: Das Nifal von לכד bedeutet grundsätzlich »ergriffen/gefangen werden«, bezeichnet in einem Losverfahren aber die Person, auf die das Los fällt. Die deutsche Wendung »vom Los getroffen werden« bewahrt das Bild und ist im Kontext verständlich.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Der Personenname wird nach geläufiger deutscher Bibelkonvention als »Jonatan« wiedergegeben.
theological_decisions:
- issue: Art und Wirkung des Losentscheids
  choice: Die Übersetzung beschreibt knapp, dass Jonatan vom Los getroffen wurde.
  alternative: »Jonatan wurde durch das Los bestimmt/ermittelt.«
  rationale: Der Text sagt nicht ausdrücklich, wie das Los göttlich gelenkt wurde oder welche theologische Bewertung daraus folgt. Die bildnahe Formulierung vermeidet eine zusätzliche Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Werft das Los« ist idiomatisch und zugleich quellennah; die Fußnote bewahrt die wörtliche Bildsprache des hebräischen Verbs.
