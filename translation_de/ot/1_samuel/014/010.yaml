  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: de
  text: 'Wenn sie aber sagen: »Kommt zu uns herauf!«, [a]dann werden wir hinaufgehen; denn Jahwe hat sie in unsere Hand[b] gegeben. Das wird für uns das Zeichen sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zieht gegen uns herauf!« Das Hebräische bezeichnet zunächst die Bewegung hinauf zum Standort der Philister; im militärischen Zusammenhang kann zugleich ein feindliches Vorgehen gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: »In unsere Hand« ist eine hebräische Wendung für »in unsere Gewalt«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung setzt die zweite Bedingung der ersten Möglichkeit in Vers 9 gegenüber. Die deutsche Satzstellung mit »aber« gibt diesen Kontrast natürlich wieder.
- source_word: כֹּה יֹאמְרוּ
  choice: sie sagen
  rationale: כֹּה leitet hier die folgende direkte Rede ein und muss im Deutschen nicht eigens mit »so« wiedergegeben werden. Das Imperfekt erhält im Bedingungssatz natürlich Präsensbedeutung.
- source_word: עֲלוּ עָלֵינוּ
  choice: Kommt zu uns herauf
  rationale: Das Verb bezeichnet die Bewegung hinauf zum erhöhten Standort der Philister. Die Präposition עַל kann im militärischen Zusammenhang auch feindliche Bewegung gegen jemanden ausdrücken; diese Möglichkeit bleibt in der Fußnote erhalten.
- source_word: וְעָלִינוּ
  choice: dann werden wir hinaufgehen
  rationale: Das mit וְ verbundene Perfekt bezeichnet hier die Folge, die beim Eintreten der Bedingung eintreten soll. »Dann« macht diesen Zusammenhang im Deutschen klar.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt Jonatans Begründung für das Hinaufgehen ein.
- source_word: נְתָנָם
  choice: hat sie … gegeben
  rationale: Das Perfekt stellt die Übergabe aus Jonatans glaubensgewisser Perspektive als feststehend dar. Die Wiedergabe mit Perfekt bewahrt diesen Aspekt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיָדֵנוּ
  choice: in unsere Hand
  rationale: Die singularische hebräische Wendung wird bildnah bewahrt; sie bezeichnet die Übergabe in Gewalt oder Verfügungsgewalt.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: Das soll für uns das Zeichen sein
  rationale: Im Zusammenhang ist das Zeichen noch zukünftig. »Soll … sein« gibt seine vorgesehene bestätigende Funktion idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. Die Transliteration wahrt den Unterschied zwischen einem Eigennamen und einem Herrschaftstitel.
- issue: Zeitbezug von נְתָנָם
  choice: hat sie gegeben
  alternative: wird sie geben
  rationale: Das hebräische Perfekt kann hier die sichere Vorwegnahme des Sieges ausdrücken. Die deutsche Perfektform bewahrt Jonatans Gewissheit, ohne die Aussage lediglich als Zukunftsprognose wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und herausfordernd; das militärische Bild der »Hand« wird im Haupttext bewahrt und in der Fußnote erläutert.
