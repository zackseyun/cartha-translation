  text: וַ/יַּכּ֞וּ בַּ/יּ֤וֹם הַ/הוּא֙ בַּ/פְּלִשְׁתִּ֔ים מִ/מִּכְמָ֖שׂ אַיָּלֹ֑נָ/ה וַ/יָּ֥עַף הָ/עָ֖ם מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: de
  text: An jenem Tag schlugen sie die Philister von Michmas bis nach Ajalon, und das Volk war sehr erschöpft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: schlugen sie
  rationale: נכה bezeichnet hier im militärischen Erzählzusammenhang das Schlagen der Philister. „Schlugen“ bewahrt die Aussage des Verbs, ohne ausdrücklich zu behaupten, alle seien getötet worden.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche und würdevolle Wiedergabe der hebräischen Zeitangabe.
- source_word: בַּפְּלִשְׁתִּים
  choice: die Philister
  rationale: Die Präposition ב markiert hier die von der militärischen Handlung Betroffenen; im Deutschen genügt das direkte Objekt.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: von Michmas bis nach Ajalon
  rationale: Das מִן bezeichnet den Ausgangspunkt; die Richtungsendung an אַיָּלֹנָה zeigt die Bewegung auf Ajalon zu. „Bis nach“ gibt die geografische Strecke idiomatisch wieder.
- source_word: וַיָּעַף הָעָם מְאֹד
  choice: und das Volk war völlig erschöpft
  rationale: יעף bezeichnet starke Ermüdung; מְאֹד intensiviert sie. „Völlig erschöpft“ ist im modernen Deutschen natürlicher als „sehr müde“ und passt zum militärischen Kontext.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Erzählprosa. Die traditionellen deutschen Ortsnamen „Michmas“ und „Ajalon“ werden verwendet. Der kollektive Singular „das Volk war“ entspricht der hebräischen Grammatik und klingt im Deutschen natürlich.
