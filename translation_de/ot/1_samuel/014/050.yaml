source:
  edition: WLC
  text: וְ/שֵׁם֙ אֵ֣שֶׁת שָׁא֔וּל אֲחִינֹ֖עַם בַּת אֲחִימָ֑עַץ וְ/שֵׁ֤ם שַׂר צְבָא/וֹ֙ אֲבִינֵ֔ר בֶּן נֵ֖ר דּ֥וֹד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: de
  text: Sauls Frau hieß Ahinoam, eine Tochter Ahimaaz’. Der Befehlshaber seines Heeres hieß Abner, ein Sohn Ners, der Sauls Onkel[a] war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verwandter“. Das hebräische Wort kann allgemeiner einen nahen männlichen Verwandten bezeichnen; im genealogischen Zusammenhang passt „Onkel“ jedoch am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: hieß
  rationale: Die hebräische Nominalformel nennt den Namen einer Person. Das deutsche „hieß“ gibt sie natürlich, knapp und vollständig wieder.
- source_word: אֵשֶׁת
  choice: Frau
  rationale: In der Verbindung mit Saul bezeichnet das Wort eindeutig seine Ehefrau; „Sauls Frau“ ist im modernen Standarddeutsch natürlich und präzise.
- source_word: בַּת
  choice: eine Tochter
  rationale: Die genealogische Angabe wird im Deutschen idiomatisch mit „eine Tochter“ samt Genitiv des Vaternamens wiedergegeben.
- source_word: שַׂר צְבָאוֹ
  choice: der Befehlshaber seines Heeres
  rationale: שַׂר bezeichnet hier den militärischen Leiter, צְבָאוֹ Sauls Streitmacht. „Befehlshaber seines Heeres“ ist würdig, klar und gegenwartssprachlich.
- source_word: בֶּן
  choice: ein Sohn
  rationale: Die übliche genealogische Beziehung wird natürlich als „ein Sohn Ners“ ausgedrückt.
- source_word: דּוֹד
  choice: Onkel
  rationale: Im genealogischen Zusammenhang ist die Verwandtschaftsbedeutung „Onkel“ am wahrscheinlichsten. Die deutsche Formulierung macht deutlich, dass Ner als Sauls Onkel bezeichnet wird.
theological_decisions:
- issue: Bedeutung und Bezug von דּוֹד in Sauls Genealogie
  choice: Ner war Sauls Onkel
  alternative: Ner war ein Verwandter Sauls
  rationale: דּוֹד steht als Apposition zu Ner und bezeichnet in diesem genealogischen Zusammenhang am ehesten Sauls Onkel. Da das Verwandtschaftswort auch weiter verstanden werden kann, bleibt die Alternative in einer Fußnote sichtbar; eine lehrmäßige Festlegung ist damit nicht verbunden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die beiden hebräischen Namensformeln werden idiomatisch mit „hieß“ wiedergegeben. Der letzte Relativsatz löst die im Deutschen sonst mögliche Bezugsunklarheit und ordnet „Sauls Onkel“ eindeutig Ner zu.
