base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: de
  text: 'Da wurden Saul und alle Leute, die bei ihm waren, zusammengerufen, und sie kamen bis zum Kampfplatz.[a] Und sieh: Das Schwert eines jeden war gegen seinen Gefährten gerichtet. Die Verwirrung war überaus groß.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da schrien Saul und alle Leute, die bei ihm waren, auf“; auch möglich: „Da sammelten sich Saul und alle Leute, die bei ihm waren.“ Das hebräische Verb lässt hier mehrere Deutungen zu.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Panik“ oder „Getümmel“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: wurden … zusammengerufen
  rationale: 'Der Nifal kann hier passiv beziehungsweise reflexiv verstanden werden: Saul und seine Leute werden zum gemeinsamen Handeln aufgeboten. Die passive Wiedergabe bewahrt diese Form und den Erzählzusammenhang, ohne die ebenfalls mögliche Bedeutung „schrien auf“ zu verschweigen.'
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: alle Leute, die bei ihm waren
  rationale: „Leute“ gibt עָם in diesem militärischen Zusammenhang natürlich wieder, ohne durch „Soldaten“ stärker zu präzisieren als der hebräische Text.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: sie kamen bis zum Kampfplatz
  rationale: בוא mit עַד bezeichnet das Herankommen bis zu dem Ort, an dem gekämpft wurde. „Kampfplatz“ macht das räumliche Ziel im Deutschen verständlich, ohne bereits eine aktive Teilnahme am Kampf zu behaupten.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Wendung erhält den überraschenden, die Aufmerksamkeit lenkenden Charakter von הִנֵּה in einer heutigen, würdigen Form.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: Das Schwert eines jeden war gegen den anderen gerichtet
  rationale: Die Formulierung bleibt nahe bei dem bildhaften hebräischen Satz und bringt zugleich verständlich zum Ausdruck, dass die Gegner sich gegenseitig bekämpften.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: eine überaus große Verwirrung
  rationale: מְהוּמָה kann Verwirrung, Panik oder Getümmel bezeichnen. „Verwirrung“ wahrt die Bedeutungsbreite und passt zu dem chaotischen Kampf gegeneinander.
