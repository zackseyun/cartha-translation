base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/005.yaml
  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: de
  text: Die eine Felszacke[a] erhob sich auf der Nordseite gegenüber von Michmas, die andere auf der Südseite gegenüber von Geba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen »der Zahn« – ein Bild für einen scharf vorspringenden Felsen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁן
  choice: Felszacke
  rationale: Wörtlich »der Zahn«; im topografischen Zusammenhang bezeichnet das Wort bildhaft einen scharf vorspringenden Felsen. »Felszacke« bewahrt sowohl das Bild als auch den natürlichen deutschen Sinn.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: die eine ... die andere
  rationale: Die wiederholte distributive Form unterscheidet die beiden Felsvorsprünge; diese Wiedergabe entspricht natürlichem deutschem Sprachgebrauch.
- source_word: מָצוּק
  choice: erhob sich
  rationale: Die Form beschreibt hier offenbar die steile beziehungsweise markante Lage des Felsens. »Erhob sich« gibt die topografische Aussage idiomatisch wieder, ohne eine unsichere technische Bedeutung festzulegen.
- source_word: מִצָּפוֹן ... מִנֶּגֶב
  choice: auf der Nordseite ... auf der Südseite
  rationale: Die Ausdrücke bezeichnen die einander gegenüberliegenden Seiten des Passes und werden im Deutschen räumlich eindeutig wiedergegeben.
- source_word: מוּל
  choice: gegenüber von
  rationale: Das Wort bezeichnet eine räumlich gegenüberliegende oder zugewandte Position.
- source_word: מִכְמָשׂ
  choice: Michmas
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: גָּבַע
  choice: Geba
  rationale: Der hebräische Ortsname lautet Geba und ist vom ähnlich geschriebenen Gibea zu unterscheiden.
