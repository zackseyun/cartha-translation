base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: de
  text: Ja, wenn das Volk heute doch von der Beute seiner Feinde gegessen hätte, die es gefunden hatte! Dann wäre der Schlag gegen die Philister viel größer gewesen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: Wie viel größer wäre der Erfolg gewesen, wenn
  rationale: Die Wortfolge leitet einen verstärkten irrealen Rückblick ein. Im Deutschen macht eine explizite Vergleichsformulierung den argumentativen Schluss Jonatans natürlich verständlich, ohne die Gegenwirklichkeit aufzulösen.
- source_word: אָכֹל אָכַל
  choice: gegessen hätte
  rationale: Infinitivus absolutus und finites Verb betonen das Essen. Eine zusätzliche Wiedergabe wie „ausgiebig“ wäre hier kontextuell möglich, würde aber mehr festlegen, als der hebräische Ausdruck allein verlangt.
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: von der Beute seiner Feinde
  rationale: שָׁלָל bezeichnet Kriegsbeute. Der Singularsuffix an „Feinde“ wird formal als „seiner“ wiedergegeben und auf das kollektiv gebrauchte „Volk“ bezogen.
- source_word: אֲשֶׁר מָצָא
  choice: die es fand
  rationale: Das Verb steht im Singular und stimmt mit dem kollektiven Subjekt „das Volk“ überein; modernes Standarddeutsch kann diese Kongruenz natürlich bewahren.
- source_word: מַכָּה
  choice: Niederlage
  rationale: מַכָּה kann im militärischen Zusammenhang Schlag, Niederlage oder Gemetzel bezeichnen. „Niederlage“ ist würdig und verständlich, ohne ausdrücklich ein Blutbad festzulegen.
- source_word: לֹא רָבְתָה
  choice: wäre ... viel größer gewesen
  rationale: Die rhetorische Verneinung wird im Deutschen als nachdrückliche irreale Folgerung wiedergegeben. „viel größer“ vermittelt die Steigerung von רבה.
- source_word: בַּפְּלִשְׁתִּים
  choice: unter den Philistern
  rationale: ב bezeichnet hier den Bereich, in dem der militärische Schlag erfolgt; „unter den Philistern“ bewahrt diese räumlich-kollektive Nuance.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Singularform „das Volk … es“ folgt der hebräischen Grammatik und ist im Deutschen natürlich. Die Hauptfassung gibt den verstärkten irrealen Vergleich idiomatisch wieder; die Fußnote bewahrt eine formalere Alternative.
