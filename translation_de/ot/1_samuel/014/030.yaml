  source_fidelity: 'Die Hauptfassung verschiebt die Satzstruktur und den Sinnakzent: „Wie viel größer wäre der Erfolg gewesen, wenn“ macht den größeren Erfolg zur einleitenden Vergleichsbedingung, während אַף כִּי לוּא natürlicher als nachdrückliche Wunsch-/Einräumungsformel („Ja, wenn ... doch“) zu verstehen ist. „Erfolg“ ist zudem im hebräischen Text nicht ausdrücklich vorhanden. מַכָּה bezeichnet hier den gegen die Philister erlittenen bzw. ihnen zugefügten Schlag; „Niederlage unter den Philistern“ ist semantisch weniger präzise und im Deutschen unnatürlich.'
