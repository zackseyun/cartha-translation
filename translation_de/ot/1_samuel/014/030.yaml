  terminology: „Beute“ gibt שָׁלָל treffend wieder. „Schlag gegen die Philister“ bildet מַכָּה בַּפְּלִשְׁתִּים eng und ohne die stärkere, aber mögliche Festlegung „Gemetzel/Schlachtung“ ab. Die kollektive Bezugnahme „das Volk ... es“ bleibt erhalten.
