base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: de
  text: 'Und Sauls Wachposten in Gibea in Benjamin blickten hin, und siehe: Die Menge löste sich auf und bewegte sich hierhin und dorthin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Heer löste sich auf und bewegte sich hin und her.“ Der hebräische Wortlaut ist knapp; „Menge“ kann hier die versammelte Streitmacht bezeichnen, und die genaue Nuance der Schlusswendung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: Wachen
  rationale: Das substantivierte Partizip von צפה bezeichnet hier die zur Beobachtung eingesetzten Männer. „Wachen“ ist im militärischen Zusammenhang natürlich und prägnant.
- source_word: לְשָׁאוּל
  choice: Sauls
  rationale: Die Präposition ל kennzeichnet hier Zugehörigkeit beziehungsweise Zuordnung; der deutsche Genitiv gibt dies idiomatisch wieder.
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: in Gibea in Benjamin
  rationale: Die Formulierung gibt den Ortsnamen und seine Lage im Gebiet Benjamin wieder, ohne „Benjamin“ als Bestandteil eines erweiterten Eigennamens festzulegen.
- source_word: וַיִּרְאוּ
  choice: sahen hin
  rationale: Das Verb ראה bezeichnet das gezielte Wahrnehmen der Wachen. „sahen hin“ bewahrt sowohl die Beobachtungshandlung als auch den Übergang zu dem, was sie bemerkten.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: „Und siehe“ erhält die aufmerksamkeitslenkende, anschauliche Funktion von הִנֵּה und passt zum würdevollen biblischen Erzählregister.
- source_word: הֶהָמוֹן
  choice: die Menge
  rationale: הָמוֹן kann eine Menschenmenge, ein Heer oder ein lärmendes Gewimmel bezeichnen. „Die Menge“ wahrt den kollektiven und bewusst wenig spezifizierten Ausdruck des Hebräischen.
- source_word: נָמוֹג
  choice: löste sich auf
  rationale: מוג bedeutet wörtlich „schmelzen“ und beschreibt bildlich den Verlust von Zusammenhalt. „löste sich auf“ überträgt dieses Bild im militärischen Kontext verständlich, ohne ausdrücklich Panik oder Flucht hinzuzufügen.
- source_word: וַיֵּלֶךְ וַהֲלֹם
  choice: lief hierhin und dorthin
  rationale: Die knappe Verbindung beschreibt die ungeordnete Bewegung der kollektiv verstandenen Menge. „hierhin und dorthin“ macht die sichtbare Verwirrung verständlich, ohne ein konkretes Ziel zu ergänzen.
