  text: וְ/אִֽישׁ יִשְׂרָאֵ֥ל נִגַּ֖שׂ בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּאֶל֩ שָׁא֨וּל אֶת הָ/עָ֜ם לֵ/אמֹ֗ר אָר֣וּר הָ֠/אִישׁ אֲשֶׁר יֹ֨אכַל לֶ֜חֶם עַד הָ/עֶ֗רֶב וְ/נִקַּמְתִּי֙ מֵ/אֹ֣יְבַ֔/י וְ/לֹֽא טָעַ֥ם כָּל הָ/עָ֖ם לָֽחֶם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: de
  text: 'Die Männer Israels waren an jenem Tag schwer bedrängt. Saul verpflichtete das Volk durch einen Schwur und sagte: »Verflucht sei der Mann, der vor dem Abend etwas isst[a], ehe ich mich an meinen Feinden gerächt habe!« So aß niemand vom Volk etwas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier »Brot«, ebenso am Ende des Verses; gemeint ist wahrscheinlich Nahrung im Allgemeinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל נִגַּשׂ
  choice: Die Männer Israels waren … schwer bedrängt
  rationale: אִישׁ יִשְׂרָאֵל bezeichnet hier kollektiv die israelitischen Männer beziehungsweise Kämpfer. Das Niphal נִגַּשׂ beschreibt im Zusammenhang ihre Bedrängnis, nicht eine räumliche Annäherung.
- source_word: וַיֹּאֶל שָׁאוּל אֶת הָעָם
  choice: Saul verpflichtete das Volk durch einen Schwur
  rationale: Die folgende Fluchformel zeigt, dass Saul dem Volk eine eidliche Verpflichtung auferlegte. Die Formulierung ist im modernen Deutsch verständlich und bewahrt den zwingenden Charakter.
- source_word: הָעָם
  choice: das Volk
  rationale: Der allgemeine Ausdruck bezeichnet in diesem militärischen Zusammenhang Sauls kämpfende Leute; »das Volk« bleibt jedoch näher am hebräischen Wortlaut.
- source_word: אָרוּר הָאִישׁ
  choice: Verflucht sei der Mann
  rationale: Die formelhafte Flucherklärung und der generische maskuline Singular werden unmittelbar wiedergegeben.
- source_word: יֹאכַל לֶחֶם / טָעַם … לָחֶם
  choice: etwas isst / aß … etwas
  rationale: לֶחֶם bedeutet wörtlich »Brot«, bezeichnet hier aber idiomatisch Nahrung beziehungsweise Essen allgemein. Natürliches Deutsch gibt den Sinn mit »etwas essen« wieder; die wörtliche Bedeutung wird in der Fußnote genannt.
- source_word: עַד הָעֶרֶב
  choice: vor dem Abend
  rationale: Im Verbot bezeichnet עַד die zeitliche Grenze, vor deren Erreichen niemand essen darf.
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: ehe ich mich an meinen Feinden gerächt habe
  rationale: Die Übersetzung wahrt Sauls persönliche Vergeltungsperspektive und macht die zeitliche Beziehung zum Essverbot im Deutschen klar.
- source_word: וְלֹא טָעַם כָּל הָעָם
  choice: So aß niemand vom Volk
  rationale: Der negierte Gesamtausdruck wird idiomatisch mit »niemand« wiedergegeben. Das hebräische »kosten« bezeichnet hier das Essen; »aß« klingt im Deutschen natürlicher.
theological_decisions: []
