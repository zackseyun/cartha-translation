source:
  edition: WLC
  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: de
  text: Zwischen den Übergängen, durch die Jonathan zum Posten der Philister hinüberzugelangen suchte, ragte auf der einen Seite eine Felszacke[a] und auf der anderen Seite eine Felszacke auf. Die eine hieß Bozez, die andere Senne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Zahn des Felsens … und ein Zahn des Felsens“; gemeint sind scharf vorspringende Felszacken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: die Übergänge
  rationale: Das Substantiv bezeichnet Stellen oder Wege des Hinübergehens. „Übergänge“ bewahrt die räumliche Offenheit des Hebräischen, ohne einen Wasserübergang oder ausdrücklich einen Gebirgspass vorauszusetzen.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: hinüberzugelangen suchte
  rationale: בקשׁ mit Infinitiv bezeichnet hier Absicht beziehungsweise zielgerichtetes Bemühen. Die Formulierung gibt beides wieder und passt zum erzählenden Register.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: zum Posten der Philister
  rationale: מַצָּב bezeichnet im militärischen Zusammenhang einen stationierten Posten beziehungsweise einen Stützpunkt. „Posten“ lässt offen, ob vor allem die Stellung oder die dort stationierte Truppe gemeint ist.
- source_word: שֵׁן הַסֶּלַע
  choice: eine Felszacke
  rationale: Wörtlich steht „Zahn des Felsens“. „Felszacke“ überträgt das Bild einer scharf vorspringenden Felsformation knapp und natürlich.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: auf der einen Seite ... auf der anderen Seite
  rationale: Die wiederholte Wendung stellt die beiden gegenüberliegenden Seiten des Durchgangs einander gegenüber.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: Die eine hieß ... die andere
  rationale: Die natürliche deutsche Namensformel gibt die parallele hebräische Struktur klar und knapp wieder.
- source_word: בּוֹצֵץ
  choice: Bozez
  rationale: Der Eigenname wird in einer im Deutschen verständlichen Form transliteriert.
- source_word: סֶנֶּה
  choice: Senne
  rationale: Der Eigenname wird entsprechend der geläufigen deutschen Namensform wiedergegeben.
- source_word: וּבֵין
  choice: Zwischen
  rationale: Die Präposition wird unmittelbar wiedergegeben; das vorangestellte ו verbindet den Satz mit dem Kontext, erfordert im natürlichen Deutschen jedoch kein eigenes einleitendes Wort.
theological_decisions: []
translation_notes:
