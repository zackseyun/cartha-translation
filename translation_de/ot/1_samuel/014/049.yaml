base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: de
  text: Sauls Söhne waren Jonatan, Jischwi und Malkischua; die Namen[a] seiner beiden Töchter waren Merab, die Erstgeborene[b], und Michal, die jüngere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Name seiner beiden Töchter«; anschließend werden zwei Namen genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die ältere«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: Sauls Söhne waren
  rationale: Die hebräische Konstruktion wird im Deutschen natürlich und ohne einen nicht ausdrücklich vorhandenen zeitlichen Diskursmarker wiedergegeben.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Im Deutschen gebräuchliche Transliteration des Personennamens.
- source_word: יִשְׁוִי
  choice: Jischwi
  rationale: Transliteration der masoretischen Konsonanten- und Vokalgestalt nach deutschen Lautkonventionen.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkischua
  rationale: Die beiden hebräischen Namenselemente werden nach gängiger deutscher Bibelnamensform als ein Personenname wiedergegeben.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: Seine beiden Töchter hießen
  rationale: Das Hebräische verwendet wörtlich den Singular »der Name« bei zwei Töchtern; die verbale deutsche Formulierung gibt die Aufzählungsfunktion idiomatisch und eindeutig wieder.
- source_word: הַבְּכִירָה
  choice: die Erstgeborene
  rationale: Die Wiedergabe bewahrt den Bezug zur Geburtsfolge; die ebenfalls mögliche Bedeutung »die ältere« wird in einer Fußnote genannt.
- source_word: מֵרַב
  choice: Merab
  rationale: Gebräuchliche deutsche Transliteration des Personennamens.
- source_word: הַקְּטַנָּה
  choice: die jüngere
  rationale: Im Zusammenhang zweier Schwestern bezeichnet das Wort das relative Alter, nicht die Körpergröße.
- source_word: מִיכַל
  choice: Michal
  rationale: Gebräuchliche deutsche Transliteration des Personennamens.
