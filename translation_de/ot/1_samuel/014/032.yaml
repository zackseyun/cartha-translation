source:
  edition: WLC
  text: ו/יעש הָ/עָם֙ אֶל שלל וַ/יִּקְח֨וּ צֹ֧אן וּ/בָקָ֛ר וּ/בְנֵ֥י בָקָ֖ר וַ/יִּשְׁחֲטוּ אָ֑רְצָ/ה וַ/יֹּ֥אכַל הָ/עָ֖ם עַל הַ/דָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: de
  text: Da stürzte sich das Volk auf die Beute[a], nahm Schafe, Rinder und Kälber und schlachtete sie auf dem Boden. Dann aß das Volk das Fleisch mit dem Blut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da fiel das Volk über die Beute her.“'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt vermutlich: Sie aßen das Fleisch, ohne das Blut zuvor ordnungsgemäß ablaufen zu lassen.'
    reason: interpretive_clarification
lexical_decisions:
- source_word: וַיַּעַשׂ הָעָם אֶל־שָׁלָל
  choice: Da stürzte sich das Volk auf die Beute
  rationale: Die ungewöhnliche Wendung עשה אל beschreibt hier im Zusammenhang mit dem ausgehungerten Volk ein ungestümes Herfallen über die Kriegsbeute. „Sich auf die Beute stürzen“ gibt diese Dynamik in natürlichem Deutsch wieder.
- source_word: שָׁלָל
  choice: Beute
  rationale: „Beute“ ist im Deutschen der geläufige militärische Ausdruck und entspricht dem hebräischen Begriff präzise.
- source_word: צֹאן
  choice: Schafe
  rationale: In der konkreten Aufzählung der geschlachteten Tiere ist „Schafe“ natürlicher als das kollektivere „Kleinvieh“.
- source_word: בָּקָר
  choice: Rinder
  rationale: Der Begriff bezeichnet Rindvieh allgemein; „Rinder“ ist die passende moderne Sammelbezeichnung.
- source_word: בְּנֵי בָקָר
  choice: Kälber
  rationale: Wörtlich „Junge der Rinder“; „Kälber“ gibt die idiomatische Bedeutung knapp und natürlich wieder.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: und schlachtete sie auf dem Boden
  rationale: אָרְצָה bezeichnet hier das Schlachten unmittelbar auf dem Boden. Das Objekt „sie“ wird aus der vorausgehenden Tierliste ergänzt.
- source_word: עַל־הַדָּם
  choice: mit dem Blut
  rationale: Die knappe Formulierung bleibt nahe am Hebräischen und bewahrt dessen Schärfe, ohne die Art des Vergehens bereits im Haupttext vollständig auszudeuten.
theological_decisions:
- issue: Wie ausdrücklich עַל־הַדָּם im Blick auf das Verbot des Blutgenusses wiederzugeben ist
  choice: mit dem Blut
  alternative: während das Blut noch darin war
  rationale: Der Haupttext bewahrt die knappe, theologisch gewichtige Ausdrucksweise des Hebräischen. Die Fußnote erläutert die im Zusammenhang naheliegende Bedeutung, ohne sie zur einzig möglichen Formulierung des Ausgangstextes zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich auf die Beute stürzen“ vermittelt die ungestüme Handlung; die Wiederholung von „das Volk“ greift die hebräische Wiederaufnahme auf und vermeidet einen unklaren Pronomenbezug. Die Blutformulierung bleibt im Haupttext bewusst knapp.
