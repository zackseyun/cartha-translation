base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: de
  text: 'Saul festigte seine Königsherrschaft über Israel und kämpfte ringsum gegen alle seine Feinde: gegen Moab, gegen die Ammoniter, gegen Edom, gegen die Könige von Zoba und gegen die Philister. Wohin er sich auch wandte, bestrafte er sie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »sprach er schuldig« oder »verurteilte er sie«. Das hebräische Verb kann bedeuten, jemanden für schuldig zu erklären; hier ist vermutlich gemeint, dass Saul seinen Feinden eine strafende Niederlage zufügte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה
  choice: festigte seine Königsherrschaft
  rationale: לכד bedeutet grundsätzlich »ergreifen/einnehmen«. In Verbindung mit der Königsherrschaft über Israel bezeichnet es hier am ehesten, dass Saul seine Herrschaft fest in die Hand bekam beziehungsweise konsolidierte. »Festigte« gibt diesen kontextuellen Sinn wieder, ohne eine illegitime Machtergreifung anzudeuten.
- source_word: הַמְּלוּכָה
  choice: Königsherrschaft
  rationale: Das Substantiv bezeichnet hier eher das Königtum beziehungsweise die Ausübung königlicher Herrschaft als ein geografisches Königreich.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: kämpfte ringsum gegen alle seine Feinde
  rationale: Die mit לחם verbundene Präposition ב kennzeichnet die Gegner. סָבִיב beschreibt die Feinde beziehungsweise Kämpfe auf allen Seiten; »ringsum« ist knapp und natürlich.
- source_word: בִּבְנֵי עַמּוֹן
  choice: gegen die Ammoniter
  rationale: Wörtlich steht »gegen die Söhne Ammons«; die gewöhnliche moderne Volksbezeichnung lautet »Ammoniter«.
- source_word: בְּמַלְכֵי צוֹבָה
  choice: gegen die Könige von Zoba
  rationale: Der masoretische Text hat ausdrücklich den Plural »Könige«, der nicht zum Singular geglättet wird.
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: Wohin er sich auch wandte
  rationale: 'Die Formulierung gibt den distributiven Sinn wieder: in jede Richtung beziehungsweise gegen jeden Gegner, dem Saul sich zuwandte.'
- source_word: יַרְשִׁיעַ
  choice: vollstreckte er das Strafgericht
  rationale: Der Hifil von רשע ist schwierig und kann »für schuldig erklären/verurteilen« bedeuten. Im militärischen Zusammenhang bezeichnet er wahrscheinlich die strafende Niederlage der Feinde. Die gewählte Formulierung bewahrt den Gerichtsaspekt, ohne die Art des militärischen Erfolgs näher festzulegen.
theological_decisions:
- issue: Gerichts- und Strafbedeutung von יַרְשִׁיעַ
  choice: vollstreckte er das Strafgericht
  alternative: er siegte / er handelte erfolgreich
  rationale: 'Der schwierige hebräische Ausdruck enthält wahrscheinlich mehr als eine allgemeine Aussage über Erfolg: Seine Grundbedeutung verweist auf Schuldigerklärung beziehungsweise Verurteilung. Die Übersetzung wahrt diese Spannung, ohne ausdrücklich zu behaupten, Saul habe dabei als göttlicher Richter gehandelt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Königsherrschaft« vermeidet die territoriale Bedeutung von »Königreich«. Die wiederholte Präposition »gegen« hält die Aufzählung klar und bewahrt ihre rhetorische Struktur.
