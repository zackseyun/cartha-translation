base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: de
  text: 'Eines Tages sagte Jonatan, der Sohn Sauls, zu dem jungen Mann, der seine Waffen trug: »Komm, wir wollen zu dem Posten der Philister hinübergehen, der auf der anderen Seite liegt.[a][b]« Seinem Vater aber sagte er nichts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu der Truppe der Philister«. Das hebräische Wort kann einen militärischen Posten oder eine dort aufgestellte Truppe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich etwa: »der jenseits von diesem dort ist«. Worauf sich »diesem dort« bezieht, wird im Vers nicht ausdrücklich gesagt.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Eines Tages
  rationale: Die hebräische Erzählungsformel mit Zeitangabe eröffnet eine einzelne Begebenheit; »Eines Tages« gibt sie in natürlichem modernem Deutsch wieder.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר kann einen Jungen, jungen Mann oder Diener bezeichnen. Da er als Waffenträger militärisch eingesetzt wird, passt »junger Mann« am besten.
- source_word: נֹשֵׂא כֵלָיו
  choice: der seine Waffen trug
  rationale: Die Wendung bezeichnet wörtlich denjenigen, der Jonatans Ausrüstung beziehungsweise Waffen trägt. Die beschreibende Übersetzung bewahrt die hebräische Konstruktion und klingt verständlich.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Komm, wir wollen … hinübergehen
  rationale: לְכָה ist eine Aufforderung, gefolgt von einem Kohortativ. »Wir wollen … hinübergehen« gibt den gemeinsamen Entschluss und die Richtungsangabe wieder.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: der Posten der Philister
  rationale: מַצָּב kann hier einen militärischen Posten oder die dort aufgestellte Truppe bezeichnen. »Posten« wahrt diese gewisse Offenheit besser als das stärker festgelegte »Garnison«.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: der auf der anderen Seite liegt
  rationale: Die deiktische hebräische Wendung weist auf die gegenüberliegende Seite, ohne den Bezug ausdrücklich als Pass zu benennen. Die Übersetzung vermeidet daher eine nicht im Vers stehende Präzisierung.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: Seinem Vater aber sagte er nichts
  rationale: Die Voranstellung von »seinem Vater« und »aber« bildet die kontrastierende Nachbemerkung ab; »sagte er nichts« ist natürliches Deutsch für das unterlassene Mitteilen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. »Jonatan« und »Philister« folgen geläufigen deutschen Bibelnamen. Die nicht ausdrücklich genannte Bezeichnung »Pass« wurde nicht in den Haupttext aufgenommen; die räumliche Deixis bleibt bewusst allgemein.
