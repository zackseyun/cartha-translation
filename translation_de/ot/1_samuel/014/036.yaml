  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: de
  text: 'Da sagte Saul: „Lasst uns bei Nacht den Philistern nach hinabziehen und sie bis zum Morgenlicht ausplündern. Keinen einzigen Mann von ihnen wollen wir übrig lassen.“ Sie sagten: „Tu, was dir gut erscheint.“ Doch der Priester sagte: „Lasst uns hier Gott nahen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Nahen zu Gott schließt hier wahrscheinlich ein, vor dem weiteren Vorgehen Gottes Weisung zu suchen; die genaue priesterliche Handlung wird jedoch nicht genannt.
    reason: Kontextuelle Erläuterung bei bewahrter lexikalischer Offenheit.
lexical_decisions:
- source_word: נֵרְדָה אַחֲרֵי פְלִשְׁתִּים
  choice: Lasst uns den Philistern nach hinabziehen
  rationale: Der Kohortativ gibt Sauls Aufforderung wieder. „Hinabziehen“ bewahrt die Richtungsangabe von ירד, während „den Philistern nach“ die militärische Verfolgung ausdrückt, ohne das neutralere אַחֲרֵי ausdrücklich als „gegen“ wiederzugeben.
- source_word: לַיְלָה
  choice: bei Nacht
  rationale: Die adverbiale Zeitangabe wird natürlich wiedergegeben, ohne das im Hebräischen nicht ausdrücklich stehende „heute Nacht“ hinzuzufügen.
- source_word: וְנָבֹזָה בָהֶם
  choice: und sie ausplündern
  rationale: בזז bezeichnet das Plündern oder Erbeuten. „Sie ausplündern“ ist im Deutschen natürlich und gibt die auf die Philister gerichtete Handlung trotz der hebräischen Präposition idiomatisch wieder.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: bis zum Morgenlicht
  rationale: Die Formulierung bewahrt das Bild vom Licht des Morgens und bleibt zugleich verständlich und knapp.
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: Keinen einzigen Mann von ihnen wollen wir übrig lassen
  rationale: Die volitive Fortsetzung wird mit „wollen wir“ bewahrt. „Keinen einzigen Mann“ macht den distributiven und umfassenden Sinn von אִישׁ deutlich, ohne das nur implizite „am Leben“ hinzuzusetzen.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: Tu alles, was in deinen Augen gut ist
  rationale: Die geläufige hebräische Wendung für das eigene Urteil wird in ihrer Bildsprache erhalten und bleibt im Deutschen verständlich.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: Lasst uns hier Gott nahen
  rationale: Der Kohortativ von קרב wird als gemeinsame Aufforderung wiedergegeben; „hier“ übersetzt הֲלֹם ausdrücklich. „Gott nahen“ bewahrt die offene Formulierung, ohne vorschnell eine bestimmte priesterliche Befragung zu benennen.
theological_decisions:
- issue: Mögliche Befragung Gottes vor dem Kampf
  choice: Die Worte des Priesters werden als Aufforderung wiedergegeben, sich Gott zu nahen.
  alternative: Lasst uns hier Gott befragen.
  rationale: Im Zusammenhang liegt das Einholen göttlicher Weisung nahe, doch der hebräische Text verwendet das Verb „nahen“ und nicht ausdrücklich ein Verb für „befragen“. Die Übersetzung lässt diese inhaltliche Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt kraftvoll und verständlich; die leicht gehobene Wendung „Gott nahen“ ist aufgrund ihrer theologischen Offenheit und Quellennähe bewusst beibehalten.
