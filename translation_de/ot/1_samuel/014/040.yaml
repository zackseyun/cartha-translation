base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: de
  text: 'Dann sagte er zu ganz Israel: »Ihr sollt auf der einen Seite sein, ich aber und mein Sohn Jonatan werden auf der anderen Seite sein.« Das Volk sagte zu Saul: »Tu, was in deinen Augen gut ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: auf der einen Seite / auf der anderen Seite
  rationale: עֵבֶר bezeichnet eine Seite bzw. den jenseitigen Bereich. Im Zusammenhang der Losentscheidung werden zwei einander gegenübergestellte Gruppen bezeichnet; die deutsche Wendung gibt sowohl das räumliche Bild als auch den Kontrast natürlich wieder.
- source_word: תִּהְיוּ / נִהְיֶה
  choice: sollt … sein / werden … sein
  rationale: Die Formen von היה bedeuten grundsätzlich »sein«. Mit der Seitenangabe beschreiben sie hier die jeweilige Stellung der beiden Parteien. Die Übersetzung bewahrt das Verb, ohne das im Hebräischen nicht ausdrücklich genannte »stehen« einzuführen.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Natürliche deutsche Wiedergabe der kollektiven Bezeichnung für das versammelte Israel.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die ausdrückliche Verwandtschaftsbezeichnung bleibt entsprechend dem Hebräischen erhalten.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: was in deinen Augen gut ist
  rationale: Die Übersetzung bewahrt das hebräische Bild und ist im Deutschen klar verständlich.
- source_word: עֲשֵׂה
  choice: Tu
  rationale: Der knappe Imperativ entspricht der Form und Wirkung des hebräischen Befehls.
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: Dann sagte er / Das Volk sagte
  rationale: Die fortschreitende hebräische Erzählform wird in natürlichem modernem Deutsch wiedergegeben; »Dann« macht beim ersten Satz die Abfolge deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die bildhafte Wendung »in deinen Augen« bleiben erhalten. Jonatan folgt der im Deutschen etablierten biblischen Namensform.
