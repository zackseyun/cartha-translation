base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: de
  text: Jonatan aber hatte nicht gehört, dass sein Vater das Volk unter Eid gestellt hatte. So streckte er die Spitze des Stabes aus, den er in der Hand hielt, tauchte sie in die Honigwabe[a], führte seine Hand zum Mund, und seine Augen leuchteten auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »in den Wald/das Dickicht des Honigs«; der ungewöhnliche hebräische Ausdruck meint wahrscheinlich eine Honigwabe oder eine dichte Honigmasse.'
    reason: lexical_alternative
  - marker: b
    text: »Seine Augen leuchteten auf« ist eine hebräische Redewendung dafür, dass jemand nach dem Essen wieder zu Kräften kommt und wacher wird.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: hatte nicht gehört
  rationale: Im Zusammenhang geht es darum, dass Jonatan von dem Eid nichts wusste, nicht darum, dass er einer Anweisung absichtlich nicht gehorchte. Das Plusquamperfekt verdeutlicht die zeitliche Abfolge.
- source_word: בְּהַשְׁבִּיעַ
  choice: wie sein Vater das Volk unter einen Eid stellte
  rationale: Der Hifil von שבע bezeichnet das Auferlegen eines Eides. Diese Formulierung ist gegenwärtiges, verständliches Deutsch und bewahrt den verpflichtenden Charakter.
- source_word: וַיִּשְׁלַח
  choice: streckte er ... aus
  rationale: Mit der Stabspitze als Objekt bezeichnet das Verb hier das Ausstrecken des Stabes.
- source_word: קְצֵה הַמַּטֶּה
  choice: die Spitze des Stabes
  rationale: Die Formulierung bezeichnet das Ende des in der Hand gehaltenen Stabes, das in den Honig getaucht wird.
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: tauchte sie
  rationale: Das feminine Pronomen bezieht sich auf die Stabspitze; die deutsche Wiedergabe erhält diesen Bezug.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: in die Honigwabe
  rationale: Der ungewöhnliche hebräische Ausdruck enthält das Bild eines Waldes oder Dickichts, bezeichnet hier aber wahrscheinlich eine Wabe oder dichte Honigmasse. Die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: führte seine Hand zum Mund
  rationale: Die Wiedergabe folgt dem hebräischen Körperbild, ohne den Vorgang unnötig auszudeuten.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: seine Augen leuchteten auf
  rationale: Die deutsche Wendung bewahrt das konkrete Bild und lässt zugleich die idiomatische Bedeutung neu gewonnener Kraft und Wachheit erkennen.
