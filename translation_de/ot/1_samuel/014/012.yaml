source:
  edition: WLC
  text: וַ/יַּעֲנוּ֩ אַנְשֵׁ֨י הַ/מַּצָּבָ֜ה אֶת יוֹנָתָ֣ן וְ/אֶת נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּֽאמְרוּ֙ עֲל֣וּ אֵלֵ֔י/נוּ וְ/נוֹדִ֥יעָה אֶתְ/כֶ֖ם דָּבָ֑ר וַ/יֹּ֨אמֶר יוֹנָתָ֜ן אֶל נֹשֵׂ֤א כֵלָי/ו֙ עֲלֵ֣ה אַחֲרַ֔/י כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יַ֥ד יִשְׂרָאֵֽל־׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: de
  text: 'Die Männer des Vorpostens[a] antworteten Jonatan und seinem Waffenträger: »Kommt zu uns herauf, dann werden wir euch etwas sagen!« Da sagte Jonatan zu seinem Waffenträger: »Steig hinter mir herauf! Denn Jahwe hat sie in Israels Hand gegeben[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Garnison« beziehungsweise »des Wachpostens«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung »in Israels Hand gegeben« bedeutet: der Macht Israels ausgeliefert.'
    reason: idiom_explanation
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: die Männer des Vorpostens
  rationale: מַצָּבָה bezeichnet hier im militärischen Zusammenhang einen besetzten Posten. „Vorposten“ ist im Deutschen präzise und natürlich; „Garnison“ könnte eher die gesamte Truppe oder den Standort bezeichnen.
- source_word: נֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die Wendung bedeutet wörtlich den Träger seiner Geräte beziehungsweise Waffen. „Waffenträger“ ist die geläufige und sachlich passende deutsche Bezeichnung.
- source_word: עֲלוּ אֵלֵינוּ
  choice: Kommt zu uns herauf
  rationale: Der Imperativ bezeichnet die Bewegung hinauf zur erhöhten Stellung der Philister und wahrt zugleich die Perspektive der Sprechenden.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: dann werden wir euch etwas sagen
  rationale: Die Hifil-Form von ידע bedeutet „wissen lassen, mitteilen“. Das unbestimmte דָּבָר bleibt durch „etwas“ bewusst vage; der drohende Unterton wird nicht erklärend in den Haupttext eingetragen.
- source_word: עֲלֵה אַחֲרַי
  choice: Steig hinter mir herauf
  rationale: Der Singular des Imperativs und sowohl die Aufwärtsbewegung als auch das Folgen hinter Jonatan werden ausdrücklich wiedergegeben.
- source_word: בְּיַד יִשְׂרָאֵל
  choice: in Israels Hand
  rationale: Die hebräische Redewendung für das Ausliefern in die Gewalt eines anderen bleibt als verständliches biblisches Bild erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי und folgt der geläufigen deutschen Transkription.
- issue: Perfekt נְתָנָם als Gewissheitsaussage vor dem Kampf
  choice: hat sie gegeben
  alternative: wird sie geben
  rationale: Die vollendete hebräische Verbform wird beibehalten. Damit bleibt Jonatans feste Gewissheit sprachlich erhalten, ohne sie in eine bloße Zukunftsaussage umzudeuten.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die direkte Rede ist knapp und lebendig. Die hebräische Wiederholung „antworteten … und sagten“ wird im Deutschen idiomatisch zu „antworteten …:“ zusammengezogen; die inhaltliche Abfolge bleibt erhalten.
