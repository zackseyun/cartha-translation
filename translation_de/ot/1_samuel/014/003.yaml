source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: de
  text: Ahija, der Sohn Ahitubs, der Bruder Ikabods, des Sohnes des Pinhas, des Sohnes Elis, war Priester Jahwes in Schilo und trug ein Efod.[a] Das Volk aber wusste nicht, dass Jonatan weggegangen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führte ein Efod mit sich“ beziehungsweise „hatte ein Efod an“. Wörtlich steht im Hebräischen: „trug ein Efod“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: Ahija
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben; das vorangestellte Waw bindet den Vers an den Erzählzusammenhang an, ohne dass im Deutschen zwingend ein einleitendes „Und“ stehen muss.
- source_word: בֶן אֲחִטוּב
  choice: der Sohn Ahitubs
  rationale: Die genealogische Konstruktion wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: אֲחִי אִיכָבוֹד
  choice: der Bruder Ikabods
  rationale: אֲחִי bedeutet hier seinem gewöhnlichen Sinn nach „Bruder“; für die allgemeinere Bedeutung „Verwandter“ gibt der Kontext keinen zwingenden Anlass.
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: des Sohnes des Pinhas, des Sohnes Elis
  rationale: Die Abstammungskette wird vollständig bewahrt; durch die Genitivkonstruktion bleibt klar, dass Ikabod ein Sohn des Pinhas und Pinhas ein Sohn Elis ist.
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלֹה
  choice: war Priester Jahwes in Schilo
  rationale: Die appositionelle Angabe wird als deutsches Prädikat formuliert. „In Schilo“ gibt die Ortsangabe schlicht wieder, ohne genauer festzulegen, ob ausschließlich das Heiligtum oder der Ort gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: נֹשֵׂא אֵפוֹד
  choice: trug ein Efod
  rationale: נשא bezeichnet grundsätzlich das Tragen. Das Deutsche „trug“ bewahrt die mögliche Mehrdeutigkeit zwischen Mitführen und Tragen am Körper; die Fußnote erläutert sie.
- source_word: וְ/הָ/עָם לֹא יָדַע
  choice: Das Volk aber wusste nicht
  rationale: Der Singular des hebräischen Kollektivnomens wird im Deutschen beibehalten. „Aber“ markiert den erzählerischen Gegensatz zu Jonatans unbemerktem Aufbruch natürlich.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: dass Jonatan weggegangen war
  rationale: כִּי leitet den Inhalt des Nichtwissens ein. Das Plusquamperfekt zeigt, dass Jonatans Weggang dem Nichtwissen des Volkes vorauslag.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als Eigenname wahrt diese Unterscheidung gegenüber dem Titel „Herr“.
- issue: Funktion des Efods
  choice: trug ein Efod
  alternative: hatte ein Efod an
  rationale: Der Vers sagt nicht ausdrücklich, ob Ahija das Efod am Körper trug oder mit sich führte. Die Übersetzung wahrt diese sachlich und theologisch relevante Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Genealogie bleibt erhalten, wird aber durch Relativ- und Genitivfügungen lesbar gegliedert. Etablierte deutsche Namensformen werden verwendet.
