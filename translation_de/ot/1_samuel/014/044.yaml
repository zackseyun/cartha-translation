  yaml_path: translation/ot/1_samuel/014/044.yaml
  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: de
  text: 'Und Saul sagte[a]: »So möge Gott handeln und noch mehr hinzufügen; denn du wirst gewiss sterben, Jonatan!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die hebräische Schwurformel: »So möge Gott handeln und so möge er hinzufügen.« Wem oder was Gott tun soll, bleibt im Hebräischen unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das narrative Waw mit Imperfekt führt die Handlung fort; »Und« bewahrt den hebräischen Erzählfluss.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Übliche deutsche Namensform.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: Gott soll mir dies antun und noch mehr
  rationale: Natürliche deutsche Wiedergabe der festen Schwur- und Fluchformel. Das im Hebräischen nicht ausdrücklich genannte Objekt wird im Deutschen idiomatisch durch »mir« ergänzt und in der Fußnote kenntlich gemacht.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Bezeichnet hier den einen Gott, der in Sauls Schwur angerufen wird.
- source_word: כִּי
  choice: wenn … nicht
  rationale: Nach der Schwurformel lässt sich כִּי idiomatisch als Einleitung des Schwurinhalts wiedergeben; die deutsche Schwurformel mit »wenn nicht« vermittelt die bekräftigende Funktion.
- source_word: מוֹת תָּמוּת
  choice: sterben musst
  rationale: Infinitivus absolutus plus finite Verb betont die Gewissheit des Todes. In Verbindung mit der deutschen Schwurformel drückt »wenn du nicht sterben musst« diese nachdrückliche Festlegung natürlich aus.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Übliche moderne deutsche Transkription des hebräischen Namens.
theological_decisions:
- issue: Wiedergabe der Schwurformel bei unausgesprochenem Objekt
  choice: Gott soll mir dies antun und noch mehr
  alternative: So soll Gott handeln und noch mehr hinzufügen
  rationale: Die Ergänzung »mir« entspricht der im Kontext vorausgesetzten Selbstverwünschung und ergibt eine verständliche deutsche Schwurformel; die Fußnote macht transparent, dass das Objekt im Hebräischen unausgesprochen bleibt.
- issue: Verhältnis von Schwurformel und Todesurteil
  choice: wenn du nicht sterben musst
  alternative: denn du wirst ganz gewiss sterben
  rationale: Die gewählte deutsche Konstruktion bewahrt die Kraft eines Selbstverwünschungsschwurs, ohne Sauls Entschlossenheit abzuschwächen. Die Alternative bildet die hebräische Satzform unmittelbarer ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt feierlich und scharf; »Jonatan« steht als direkte Anrede am Satzende.
