  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: de
  text: Saul hielt sich am Rand von Gibea unter dem Granatapfelbaum[b] bei Migron auf[a]; die Leute, die bei ihm waren, zählten etwa sechshundert Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Saul saß am Rand von Gibea.“ Das hebräische Partizip kann sowohl das Sitzen als auch das Verweilen an einem Ort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unter dem Granatapfel“; gemeint ist hier ein Granatapfelbaum.'
    reason: lexical_clarification
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: hielt sich … auf
  rationale: Das Partizip kann Sitzen, Wohnen oder Verweilen bezeichnen. Im militärischen Erzählzusammenhang gibt „hielt sich … auf“ Sauls fortdauernden Standort natürlich wieder, ohne seine Körperhaltung festzulegen.
- source_word: בִּקְצֵה הַגִּבְעָה
  choice: am Rand von Gibea
  rationale: קָצֶה bezeichnet Rand, Ende oder äußersten Bereich; „am Rand“ bewahrt diese räumliche Offenheit. הַגִּבְעָה ist hier aufgrund des Zusammenhangs als Ortsname Gibea zu verstehen.
- source_word: תַּחַת הָרִמּוֹן
  choice: unter dem Granatapfelbaum
  rationale: רִמּוֹן bedeutet wörtlich „Granatapfel“, bezeichnet in diesem Ortsausdruck aber den entsprechenden Baum. „Granatapfelbaum“ ist im Deutschen eindeutig und idiomatisch.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: bei Migron
  rationale: Die Relativkonstruktion lokalisiert den Granatapfelbaum. Die knappe deutsche Fügung „bei Migron“ gibt den Ortsbezug natürlich wieder.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: bei ihm waren
  rationale: Das Substantiv עָם wird im anschließenden Zahlenausdruck durch אִישׁ als eine Gruppe von Männern konkretisiert. Die deutsche Formulierung vermeidet die schwerfällige Wiederholung „das Volk, das bei ihm war“, ohne die Gruppe ausdrücklich als Soldaten enger zu bestimmen.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: etwa sechshundert Mann
  rationale: Das Präfix כ־ kennzeichnet eine ungefähre Zahl. „Sechshundert Mann“ ist die natürliche deutsche Wiedergabe von Zahlwort plus אִישׁ.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem Hebräischen leicht geglättet; das Semikolon hält die beiden Aussagen eng verbunden. Keine einleitende Zeitpartikel wurde ergänzt, da der hebräische Text kein ausdrückliches „nun“ enthält.
