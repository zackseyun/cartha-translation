  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: de
  text: 'Da befragte Saul Gott: »Soll ich hinabziehen, den Philistern nach? Wirst du sie in die Hand Israels geben[a]?« Doch er antwortete ihm an jenem Tag nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wirst du sie in die Hand Israels ausliefern?'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: Da befragte Saul Gott
  rationale: שׁאל mit בֵּאלֹהִים bezeichnet hier das Einholen göttlicher Weisung. „Gott befragen“ gibt diesen förmlichen Vorgang im Deutschen natürlicher und genauer wieder als ein bloßes „Gott fragen“.
- source_word: הַאֵרֵד
  choice: Soll ich ... hinabziehen?
  rationale: Die Fragepartikel mit dem Imperfekt drückt eine Bitte um Weisung aus. „Soll ich“ wahrt diesen abwägenden Charakter; „hinabziehen“ erhält zudem die durch ירד bezeichnete Abwärtsbewegung und passt zum militärischen Zusammenhang.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: den Philistern nach
  rationale: אַחֲרֵי bedeutet wörtlich „hinter/nach“. Im militärischen Zusammenhang ist eine Verfolgung gemeint; „den Philistern nach“ bewahrt die knappe Bildlichkeit des Hebräischen, ohne sie unnötig auszudeuten.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: Wirst du sie in die Hand Israels geben?
  rationale: Die Formulierung bildet die hebräische Wendung für die Übergabe in die Gewalt eines anderen eng nach. Das biblische Handbild ist auch im modernen Deutschen verständlich.
- source_word: וְלֹא עָנָהוּ
  choice: Doch er antwortete ihm ... nicht
  rationale: „Doch“ bringt den Gegensatz zur erwarteten göttlichen Antwort zum Ausdruck. Das Pronomen bewahrt wie im Hebräischen das nur aus dem Zusammenhang erschließbare Subjekt.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist eine natürliche und zugleich würdevolle Wiedergabe der hebräischen Zeitangabe.
theological_decisions:
- issue: Unausgesprochenes Subjekt der ausbleibenden Antwort
  choice: Das Subjekt bleibt im Haupttext mit „er“ unausgesprochen; aus dem Zusammenhang ist Gott gemeint.
  alternative: „Doch Gott antwortete ihm an jenem Tag nicht.“
  rationale: Der unmittelbare Zusammenhang weist eindeutig auf Gott, doch der hebräische Text wiederholt das Subjekt nicht. Die Übersetzung erhält diese Knappheit und macht die Aussage nicht ausdrücklicher als die Vorlage.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. „Befragte“ und „hinabziehen“ bewahren den Charakter einer göttlichen Weisungsfrage sowie die räumliche Bewegung; die Wendung „in die Hand Israels geben“ erhält das hebräische Bild.
