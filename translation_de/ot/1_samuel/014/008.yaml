  language: de
  text: 'Jonathan sagte: „Sieh, wir gehen jetzt zu den Männern hinüber und zeigen uns ihnen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche deutsche Wiedergabe der narrativen Redeeinleitung mit אמר.
- source_word: יְהוֹנָתָן
  choice: Jonathan
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufforderung lenkt die Aufmerksamkeit des Waffenträgers auf Jonathans unmittelbar folgenden Plan; „Sieh“ wahrt diese Diskursfunktion in knapper, würdiger Sprache.
- source_word: אֲנַחְנוּ עֹבְרִים
  choice: wir gehen jetzt … hinüber
  rationale: Das ausdrücklich gesetzte Pronomen bleibt erhalten; das Partizip bezeichnet hier das unmittelbar bevorstehende beziehungsweise einsetzende Handeln. „Jetzt“ macht diesen Aspekt im Deutschen natürlich deutlich.
- source_word: אֶל הָאֲנָשִׁים
  choice: zu den Männern
  rationale: Die bestimmte Bezeichnung verweist auf die bereits im Kontext erkennbaren Männer des philistäischen Postens.
- source_word: וְנִגְלִינוּ אֲלֵיהֶם
  choice: und zeigen uns ihnen
  rationale: Der Nifal von גלה bezeichnet hier das absichtliche Sichtbarwerden vor den Gegnern. Die reflexive deutsche Form ist natürlich und bewahrt den konkreten Sinn.
theological_decisions: []
