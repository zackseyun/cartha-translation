  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: Jonathans Redeeröffnung, die aufmerksamkeitslenkende Partikel הִנֵּה, das ausdrückliche „wir“, das bevorstehende Hinübergehen zu den Männern und das absichtliche Sichzeigen vor ihnen. „Jetzt“ macht die durch das Partizip nahegelegte Unmittelbarkeit idiomatisch sichtbar, ohne den Sinn zu verändern.'
  naturalness: '„Jonathan sagte: ‚Sieh, wir gehen jetzt zu den Männern hinüber und zeigen uns ihnen.‘“ ist verständliches modernes Standarddeutsch. „Sieh“ ist leicht gehoben, aber nicht archaisch und passt zur knappen, entschlossenen Rede. Die Verbindung „sich jemandem zeigen“ ist idiomatisch.'
  terminology: „Jonathan“ entspricht der etablierten deutschen Namensform. „Männer“ wahrt die bestimmte, männliche Personenbezeichnung des hebräischen הָאֲנָשִׁים und vermeidet eine unnötige Spezifizierung. Die reflexive Wiedergabe von וְנִגְלִינוּ trifft den Kontext des bewussten Sichtbarwerdens.
