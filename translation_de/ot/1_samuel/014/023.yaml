  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: de
  text: An jenem Tag rettete Jahwe Israel, und der Kampf ging über Bet-Awen hinaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Kampf zog an Bet-Awen vorbei“; auch möglich: „Der Kampf rückte über Bet-Awen hinaus vor.“'
    reason: Die Verbindung von עבר mit אֶת und einem Ortsnamen kann das Vorbeiziehen an einem Ort oder die Bewegung über ihn hinaus bezeichnen; die genaue räumlich-militärische Nuance bleibt offen.
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: rettete
  rationale: Das Hifil von ישׁע bezeichnet das Retten oder Befreien. „Rettete“ ist knapp, natürlich und bewahrt Jahwe als handelndes Subjekt; „verhalf zum Sieg“ wäre enger und stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der zeitlichen Wendung mit dem im Hebräischen ausgedrückten Rückverweis.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier kollektiv das Volk beziehungsweise dessen Streitmacht; das direkte Objekt wird im Deutschen ohne besondere Markierung wiedergegeben.
- source_word: וְהַמִּלְחָמָה
  choice: und der Kampf
  rationale: מִלְחָמָה kann Krieg, Schlacht oder Kampf bedeuten. Im unmittelbaren Erzählzusammenhang bezeichnet „Kampf“ das laufende Kampfgeschehen und verbindet sich im Deutschen natürlich mit einer räumlichen Verlagerung.
- source_word: עָבְרָה אֶת בֵּית אָוֶן
  choice: ging über Bet-Awen hinaus
  rationale: עבר bezeichnet ein Hinüber-, Vorbei- oder Weitergehen. Mit dem folgenden Ortsnamen bleibt offen, ob das Kampfgeschehen Bet-Awen passierte oder sich über den Ort hinaus verlagerte; die Hauptfassung gibt die wahrscheinlich räumliche Ausdehnung wieder, ohne ausdrücklich eine militärische Vorstoßrichtung einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה. Seine Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch den traditionellen Ersatztitel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Erzählstil, während „ging über … hinaus“ idiomatisch verständlich ist. Der Ortsname wird in der im Deutschen gut lesbaren Form „Bet-Awen“ wiedergegeben.
