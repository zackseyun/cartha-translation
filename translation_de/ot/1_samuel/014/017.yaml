  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: de
  text: 'Da sagte Saul zu den Leuten, die bei ihm waren: „Zählt bitte nach[a] und seht, wer von uns weggegangen ist.“ Sie zählten nach, und siehe, Jonatan und sein Waffenträger waren nicht da.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Überprüft die Anwesenden“; das hebräische Verb kann hier bedeuten, die Anwesenden zu überprüfen oder zu zählen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: zählt bitte nach / sie zählten nach
  rationale: פקד bezeichnet hier die Überprüfung der anwesenden Mannschaft, um festzustellen, wer fehlt. „Nachzählen“ ist im modernen Deutschen natürlich und wird für Aufforderung und Ausführung konsequent verwendet.
- source_word: נָא
  choice: bitte
  rationale: Die Partikel mildert die Aufforderung ab; „bitte“ gibt diese höflich-auffordernde Nuance idiomatisch wieder.
- source_word: וּרְאוּ
  choice: und stellt fest
  rationale: Wörtlich „und seht“; im Zusammenhang geht es darum, durch das Nachzählen zu ermitteln, wer fortgegangen ist. „Stellt fest“ gibt diese kontextuelle Bedeutung natürlich wieder.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: wer von uns weggegangen ist
  rationale: Die Formulierung wahrt den Gedanken des Weggehens aus der Gemeinschaft und klingt im Deutschen natürlicher als „wer aus unserer Mitte gegangen ist“.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה hebt die überraschende oder bedeutsame Feststellung erzählerisch hervor. Das würdevolle „siehe“ bewahrt dieses Signal.
- source_word: נֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die Wendung bezeichnet den Mann, der Jonatans Waffen beziehungsweise Ausrüstung trug; „Waffenträger“ ist die etablierte und verständliche deutsche Bezeichnung.
