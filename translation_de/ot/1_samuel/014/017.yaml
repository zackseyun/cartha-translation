  register: Modernes, würdevolles Standarddeutsch. „Männer“ gibt הָעָם in diesem militärischen Zusammenhang präziser wieder als das allgemeinere „Volk“. Die leicht gehobene Erzählformel „und siehe“ bleibt erhalten, ohne den übrigen Satz archaisch zu gestalten.
