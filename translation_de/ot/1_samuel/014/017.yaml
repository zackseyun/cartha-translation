  - severity: low
    issue: Unklare Fußnotenformulierung „Mustert sie“
    rationale: Das Pronomen hat keinen eindeutigen Bezug, und „mustern“ ist im modernen Deutschen weniger klar. Die Fußnote sollte die Alternative als Überprüfung der Anwesenden formulieren.
