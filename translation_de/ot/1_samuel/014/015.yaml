  text: וַ/תְּהִי֩ חֲרָדָ֨ה בַ/מַּחֲנֶ֤ה בַ/שָּׂדֶה֙ וּ/בְ/כָל הָ/עָ֔ם הַ/מַּצָּב֙ וְ/הַ/מַּשְׁחִ֔ית חָרְד֖וּ גַּם הֵ֑מָּה וַ/תִּרְגַּ֣ז הָ/אָ֔רֶץ וַ/תְּהִ֖י לְ/חֶרְדַּ֥ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: de
  text: Da entstand ein Zittern im Lager, auf dem Feld und unter dem ganzen Volk; auch die Besatzung und der Plündertrupp zitterten. Und die Erde erbebte, sodass es zu einem Zittern von Gott wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass ein gewaltiges Zittern entstand“ oder „sodass göttlicher Schrecken entstand“. Die hebräische Wendung kann entweder die Herkunft von Gott oder eine außergewöhnliche Stärke bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חרד
  choice: Zittern / zitterten
  rationale: Die Wiedergabe bewahrt das konkrete Bild des angstbedingten Zitterns und macht die Wiederholung desselben hebräischen Wortstamms im Deutschen hörbar.
- source_word: בַמַּחֲנֶה
  choice: im Lager
  rationale: Direkte und im militärischen Zusammenhang natürliche Ortsangabe.
- source_word: בַשָּׂדֶה
  choice: auf dem Feld
  rationale: Gibt die gewöhnliche Bedeutung von שׂדה knapp wieder; auch „im offenen Land“ wäre möglich.
- source_word: וּבְכָל הָעָם
  choice: und unter dem ganzen Volk
  rationale: Bewahrt die Grundbedeutung von עם, ohne die im Kontext mögliche militärische Nuance ausdrücklich auf „Truppen“ einzuengen.
- source_word: הַמַּצָּב
  choice: die Besatzung
  rationale: Bezeichnet hier die an einem militärischen Posten stationierte Einheit; „Besatzung“ ist im Deutschen knapp und kontextgerecht.
- source_word: הַמַּשְׁחִית
  choice: der Plünderungstrupp
  rationale: Das substantivierte Hifil-Partizip bezeichnet im militärischen Zusammenhang wahrscheinlich eine verwüstende oder plündernde Einheit; die kollektive Funktion bleibt gewahrt.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: Und die Erde erbebte
  rationale: רגז bezeichnet hier eine heftige Erschütterung; „erbebte“ bildet die Steigerung vom menschlichen Zittern zur Bewegung der Erde natürlich ab.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: zu einem Zittern von Gott
  rationale: Die Formulierung hält sich eng an die mögliche Herkunftsangabe und vermeidet eine überdeutliche Auslegung als unmittelbar von Gott bewirkt. Die ebenfalls mögliche verstärkende Lesart wird in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von לְחֶרְדַּת אֱלֹהִים
  choice: zu einem Zittern von Gott
  alternative: zu einem gewaltigen Zittern; zu göttlichem Schrecken
  rationale: Die Genitivverbindung kann Gott als Ursprung bezeichnen, aber auch idiomatisch höchste Intensität ausdrücken. Der Haupttext bewahrt die Herkunftslesart in zurückhaltender Form; die Fußnote macht die echte Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wortstammwiederholung „Zittern – zitterten – Zittern“ bildet die auffällige hebräische Wiederaufnahme von חרד/חרדה nach. Der etwas markierte Ausdruck „Zittern von Gott“ ist bewusst beibehalten, um die theologische und grammatische Mehrdeutigkeit nicht im Haupttext zu glätten.
