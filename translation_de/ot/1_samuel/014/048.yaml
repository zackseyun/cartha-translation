base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/048.yaml
  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: de
  text: Er handelte tapfer und schlug Amalek[a], und er befreite Israel aus der Hand seines Plünderers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Amalek“ bezeichnet hier kollektiv das Volk der Amalekiter.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seines Plünderers“. Der Singular kann kollektiv die Feinde bezeichnen, die Israel ausplünderten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: Er bewies seine Stärke
  rationale: Die Wendung עשה חיל bezeichnet kraftvolles, tapferes oder militärisch erfolgreiches Handeln. Die gewählte Formulierung gibt das Idiom natürlich wieder, ohne es auf bloße Tapferkeit oder einen bestimmten Sieg zu verengen.
- source_word: וַיַּךְ
  choice: schlug
  rationale: נכה kann schlagen, niederschlagen oder besiegen bedeuten. „Schlug“ bewahrt die Bildsprache und lässt den genauen Umfang des militärischen Erfolgs offen.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der hebräische Text verwendet den singularischen Volksnamen Amalek, der hier kollektiv für die Amalekiter steht.
- source_word: וַיַּצֵּל
  choice: befreite
  rationale: Das Hifil von נצל bedeutet entreißen, retten oder befreien. „Befreite“ passt zur folgenden Wendung von der Gewalt des Plünderers.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Wendung bezeichnet Gewalt oder Herrschaft, bleibt aber auch im Deutschen als verständliches Bild erhalten.
- source_word: שֹׁסֵהוּ
  choice: seines Plünderers
  rationale: Das Partizip bezeichnet einen Plünderer; das Suffix ist grammatisch Singular und bezieht sich auf das kollektiv verstandene Israel. Die formal nahe Wiedergabe bewahrt diese Numerusspannung.
