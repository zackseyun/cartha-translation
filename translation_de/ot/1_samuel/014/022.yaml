  text: וְ/כֹל֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מִּֽתְחַבְּאִ֤ים בְּ/הַר אֶפְרַ֨יִם֙ שָֽׁמְע֔וּ כִּֽי נָ֖סוּ פְּלִשְׁתִּ֑ים וַֽ/יַּדְבְּק֥וּ גַם הֵ֛מָּה אַחֲרֵי/הֶ֖ם בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: de
  text: Alle Männer Israels, die sich im Bergland Ephraim versteckt hatten, hörten, dass die Philister flohen. Da setzten auch sie ihnen im Kampf dicht nach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »... und auch sie hingen ihnen im Kampf nach.« Das Verb beschreibt hier ein enges Verfolgen der fliehenden Philister.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: Auch alle Männer Israels
  rationale: כֹל אִישׁ ist eine kollektiv-distributive Wendung. Im Deutschen gibt »alle Männer Israels« die Verbindung mit dem pluralischen Partizip und den folgenden Pluralformen natürlich wieder. Das einleitende וְ wird im Zusammenhang passend mit »Auch« wiedergegeben.
- source_word: הַמִּתְחַבְּאִים
  choice: die sich ... versteckt hatten
  rationale: Das Partizip bezeichnet die Männer als diejenigen, die sich verborgen hielten; das Plusquamperfekt ordnet ihr Verstecken verständlich vor dem Hören und dem anschließenden Eingreifen ein.
- source_word: בְּהַר אֶפְרַיִם
  choice: im Bergland Ephraim
  rationale: הַר bezeichnet hier die gebirgige Region Ephraims, nicht einen einzelnen Berg. »Bergland Ephraim« ist eine knappe, geografisch passende Wiedergabe.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: hörten, dass die Philister flohen
  rationale: נָסוּ bezeichnet die Flucht der Philister. Das deutsche Präteritum lässt offen, ob die Männer von einer bereits begonnenen oder vollzogenen Flucht hörten, und vermeidet eine unnötige zeitliche Präzisierung.
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵיהֶם
  choice: Da setzten ... sie ihnen ... dicht nach
  rationale: דבק mit אַחֲרֵי ist im militärischen Zusammenhang idiomatisch als enges, hartnäckiges Verfolgen zu verstehen. »jemandem dicht nachsetzen« bewahrt sowohl das Verfolgungsmotiv als auch die Intensität des Verbs.
- source_word: גַם הֵמָּה
  choice: auch sie
  rationale: Die Wendung hebt hervor, dass nun ebenfalls die zuvor versteckten Israeliten in den Kampf eingriffen.
- source_word: בַּמִּלְחָמָה
  choice: im Kampf
  rationale: מִלְחָמָה bezeichnet hier das laufende Kampfgeschehen, nicht den gesamten Krieg. »im Kampf« ist im modernen Deutschen knapp und präzise.
theological_decisions: []
