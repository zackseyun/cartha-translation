  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: de
  text: 'Doch das Volk sagte zu Saul: »Soll Jonatan sterben, der diesen großen Sieg in Israel errungen hat?[a] Niemals! So wahr Jahwe lebt: Kein einziges Haar von seinem Kopf soll zu Boden fallen, denn er hat heute mit Gott gewirkt.[b]« So befreite das Volk Jonatan,[c] und er starb nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese große Rettung« beziehungsweise »dieses große Heil«. Das hebräische Wort kann Rettung, Heil oder im militärischen Zusammenhang Sieg bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »denn mit Gott hat er heute gehandelt«. Gemeint ist ein Handeln in Verbindung mit Gottes Wirken oder Beistand, ohne dass der hebräische Wortlaut diese Beziehung genauer bestimmt.'
    reason: theological_ambiguity
  - marker: c
    text: 'Oder: »So löste das Volk Jonatan aus« oder: »So rettete das Volk Jonatan«. Das hebräische Verb bezeichnet das Auslösen oder Befreien aus einem Anspruch beziehungsweise Urteil; eine tatsächlich gezahlte Summe wird hier nicht erwähnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: Soll Jonatan sterben
  rationale: Die Fragepartikel mit dem Imperfekt bildet eine empörte rhetorische Frage; die deutsche Form bewahrt Frage und Protest.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: diesen großen Sieg
  rationale: יְשׁוּעָה kann Rettung, Heil oder Sieg bezeichnen. Im unmittelbaren militärischen Zusammenhang ist »Sieg« natürlich, während eine Fußnote die weiteren Bedeutungsnuancen offenhält.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die lokale beziehungsweise soziale Sphäre der Tat wird entsprechend der Präposition ב bewahrt.
- source_word: חָלִילָה
  choice: Niemals!
  rationale: Die knappe, starke Zurückweisung wird in natürlichem modernem Deutsch wiedergegeben, ohne einen im Hebräischen nicht genannten Gottesbezug einzufügen.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Dies entspricht der hebräischen Schwurformel und gibt den Gottesnamen ausdrücklich als Jahwe wieder.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: Kein einziges Haar von seinem Kopf soll zu Boden fallen
  rationale: Nach der Schwurformel hat אִם emphatisch verneinenden Sinn; die idiomatische Aussage völligen Schutzes bleibt erhalten.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: denn er hat heute mit Gott gehandelt
  rationale: »Mit Gott« bildet עִם אֱלֹהִים formal ab und bewahrt die offene Aussage über göttliches Mitwirken; »gehandelt« eignet sich hier für das weit gefasste עשה.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: So löste das Volk Jonatan aus
  rationale: פדה bezeichnet die Befreiung aus einem Anspruch oder einer drohenden Strafe. »Auslösen« erhält diesen Rechts- und Erlösungsaspekt besser als das allgemeinere »retten«.
- source_word: וְלֹא מֵת
  choice: und er starb nicht
  rationale: Die schlichte koordinierte Ergebnisaussage des Hebräischen wird ohne Passivierung oder zusätzliche Deutung wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עִם אֱלֹהִים bei Jonatans Handeln
  choice: mit Gott gehandelt
  alternative: mit Gottes Hilfe gehandelt; für Gott gehandelt
  rationale: Die Präposition עִם bedeutet unmittelbar »mit«. Diese Wiedergabe bewahrt die theologische Spannung hinsichtlich des Zusammenwirkens von Gott und Jonatan, ohne dessen genaue Art festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und mündlich verständlich. Der Gottesname wird als »Jahwe« wiedergegeben; die ungewöhnliche Wendung »mit Gott gehandelt« bleibt bewusst erhalten und wird in einer Fußnote erläutert.
