  text: וַ/יֹּאמֶר֩ דּ֨וֹד שָׁא֥וּל אֵלָ֛י/ו וְ/אֶֽל נַעֲר֖/וֹ אָ֣ן הֲלַכְתֶּ֑ם וַ/יֹּ֕אמֶר לְ/בַקֵּשׁ֙ אֶת הָ֣/אֲתֹנ֔וֹת וַ/נִּרְאֶ֣ה כִי אַ֔יִן וַ/נָּב֖וֹא אֶל שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: de
  text: 'Da sagte Sauls Onkel zu ihm und seinem Begleiter[a]: „Wo seid ihr hingegangen?“ Er antwortete: „Um die Eselinnen[b] zu suchen. Als wir sahen, dass sie nirgends zu finden waren, gingen wir zu Samuel.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem jungen Mann“ beziehungsweise „seinem Diener“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet ausdrücklich weibliche Esel.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „kamen wir zu Samuel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: Sauls Onkel
  rationale: דּוֹד bezeichnet in diesem erzählerischen Verwandtschaftskontext am natürlichsten den Onkel; das allgemeinere „Verwandter“ ist möglich, hier aber weniger wahrscheinlich.
- source_word: אֶלָיו וְאֶל נַעֲרוֹ
  choice: zu ihm und seinem Begleiter
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. „Begleiter“ gibt seine Rolle auf der Reise natürlich wieder, ohne ein Dienstverhältnis festzulegen.
- source_word: אָן הֲלַכְתֶּם
  choice: Wo seid ihr hingegangen?
  rationale: Die Frage betrifft das Ziel beziehungsweise den Weg der beiden; das deutsche Perfekt klingt in direkter Rede natürlich.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: Wir wollten die Eselinnen suchen
  rationale: Der hebräische elliptische Infinitivausdruck nennt den Zweck ihres Weges. Die Ergänzung „Wir wollten“ ergibt im Deutschen eine natürliche vollständige Antwort; אֲתֹנוֹת bezeichnet weibliche Esel.
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: Als wir sahen, dass sie nirgends zu finden waren
  rationale: Wörtlich steht etwa „und wir sahen, dass keine da waren“. Die gewählte Formulierung macht den Bezug auf die erfolglose Suche klar, ohne den Sinn zu verändern.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: gingen wir zu Samuel
  rationale: בוא bezeichnet eine Bewegung zu Samuel hin und kann je nach Perspektive mit „kommen“ oder „gehen“ wiedergegeben werden. In Sauls rückblickendem Bericht ist „gingen“ idiomatisches Deutsch.
