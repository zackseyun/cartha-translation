base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: de
  text: Auch Saul ging nach Hause, nach Gibea. Mit ihm gingen die tapferen Männer[a], deren Herzen Gott berührt hatte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Männer von Tatkraft“ oder „die Krieger“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deren Herzen Gott berührt hatte“; die Wendung kann ausdrücken, dass Gott ihre innere Haltung bewegte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Kennzeichnet die Fortsetzung und Hinzufügung innerhalb der Erzählung knapp und natürlich.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: ging nach Hause, nach Gibea
  rationale: Gibt sowohl das eigene Zuhause als auch das durch die Richtungsform bezeichnete Ziel Gibea wieder, ohne das Verhältnis beider Angaben unnötig festzulegen.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: Mit ihm gingen
  rationale: Bewahrt die hervorgehobene Begleitung und klingt zugleich idiomatisch im Deutschen.
- source_word: הַחַיִל
  choice: die tapferen Männer
  rationale: Das substantivierte Kollektiv bezeichnet hier fähige, tatkräftige beziehungsweise wehrhafte Männer. Die gewählte Form ist verständlich und lässt sich durch die Fußnote um die stärker militärische Lesart ergänzen.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: deren Herzen Gott berührt hatte
  rationale: Bewahrt das hebräische Bild göttlicher Einwirkung auf das Innere der Männer, ohne deren Art oder Mechanismus näher zu bestimmen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Bezeichnet in diesem Zusammenhang eindeutig den Gott Israels.
- source_word: לֵב
  choice: Herzen
  rationale: Das hebräische Wort umfasst Denken, Wollen und innere Haltung; „Herzen“ erhält das Bild und ist im Deutschen transparent.
theological_decisions:
- issue: Art des göttlichen Handelns beim Berühren der Herzen
  choice: Die Metapher wird unmittelbar als „deren Herzen Gott berührt hatte“ wiedergegeben.
  alternative: deren Herzen Gott bewegt hatte / die Gott innerlich dazu bewegt hatte
  rationale: Der Text behauptet göttliche Initiative und Einfluss auf die innere Haltung, erklärt aber weder den genauen Vorgang noch eine weitergehende dogmatische Bedeutung. Die bildhafte Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederaufnahme „nach Hause, nach Gibea“ wahrt beide Zielangaben des Hebräischen. Die Herz-Metapher bleibt im Haupttext erhalten; die Fußnote erläutert sie, ohne sie dogmatisch festzulegen.
