  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: de
  text: Dann ließ Samuel alle Stämme Israels vortreten, und der Stamm Benjamin wurde ausgewählt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wurde ergriffen« oder »wurde genommen«. Im Zusammenhang bezieht sich dies auf die Auswahl durch das Los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ließ … vortreten
  rationale: Der Hifil von קרב bedeutet, jemanden heranzubringen bzw. vortreten zu lassen. Im Zusammenhang des Losverfahrens ist „ließ … vortreten“ natürliches Deutsch und bewahrt den Vorgang, dass Samuel die Stämme zur Auswahl vorführt.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Übliche deutsche Form des Personennamens.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: alle Stämme Israels
  rationale: Direkte und idiomatische Wiedergabe der hebräischen Genitivverbindung mit כָּל.
- source_word: וַיִּלָּכֵד
  choice: wurde ausgelost
  rationale: Der Nifal von לכד heißt wörtlich „wurde ergriffen/gefangen“. Hier bezeichnet er jedoch das Ergebnis einer Auswahl durch das Los. „Wurde ausgelost“ gibt diese kontextuelle Bedeutung im Deutschen klar wieder; die wörtliche Bildsprache bleibt in der Fußnote sichtbar.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: der Stamm Benjamin
  rationale: Natürliche deutsche Wiedergabe der Verbindung aus „Stamm“ und dem Eigennamen Benjamin.
theological_decisions:
- issue: Art und Urheber der Auswahl
  choice: Das Passiv „wurde ausgelost“ bleibt erhalten, ohne ausdrücklich zu benennen, wer die Auswahl bewirkt.
  alternative: „Das Los fiel auf den Stamm Benjamin“ oder „der HERR wählte den Stamm Benjamin aus“.
  rationale: Der hebräische Text verwendet ein Passiv und nennt in diesem Satz weder das Los ausdrücklich noch den göttlichen Urheber. Die Übersetzung macht das aus dem Kontext erkennbare Verfahren deutlich, ohne die theologische Spannung durch eine zusätzliche Subjektangabe aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vortreten lassen“ ist anschaulich und allgemein verständlich; „ausgelost“ vermeidet das im Deutschen missverständliche „wurde genommen“, während die Fußnote die wörtliche Ausdrucksweise dokumentiert.
