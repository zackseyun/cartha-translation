  source_fidelity: Die Wiedergabe trifft die Abfolge der Gottesbefragung, die wiederholte Anfrage, die indirekte Bezeichnung Sauls als „der Mann“ und dessen Verbergen zutreffend. Bei אֶל הַכֵּלִים bezeichnet die Präposition jedoch nicht spezifisch ein räumliches „zwischen“; eine weniger einengende Wiedergabe ist vorzuziehen.
  naturalness: „Da befragten sie Jahwe noch einmal“ und die Frage sind modernes, verständliches Deutsch. „beim Gepäck“ ist idiomatischer und semantisch vorsichtiger als „zwischen den Gepäckstücken“.
  terminology: „Jahwe“ gibt יְהוָה konsequent wieder. „Gepäck“ ist im Kontext eine gute Hauptlesart für כֵּלִים, sollte aber durch eine Fußnote als kontextuelle Einengung des breiteren hebräischen Begriffs kenntlich bleiben.
