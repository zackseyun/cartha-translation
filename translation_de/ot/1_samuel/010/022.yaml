  text: וַ/יִּשְׁאֲלוּ עוֹד֙ בַּֽ/יהוָ֔ה הֲ/בָ֥א ע֖וֹד הֲלֹ֣ם אִ֑ישׁ וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּה ה֥וּא נֶחְבָּ֖א אֶל הַ/כֵּלִֽים־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: de
  text: 'Da befragten sie Jahwe noch einmal: „Ist der Mann schon hierhergekommen?“ Und Jahwe sagte: „Seht, er hat sich beim Gepäck[a] versteckt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet allgemein Gegenstände, Gefäße, Geräte oder Ausrüstung. Im Zusammenhang ist wahrscheinlich das Gepäck der Versammelten gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: Da befragten sie Jahwe noch einmal
  rationale: שׁאל mit בְּ bei Jahwe bezeichnet hier eine förmliche Befragung Gottes; „befragten“ gibt diesen konsultativen Sinn wieder. Das erste עוֹד zeigt die Wiederholung an.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: Ist der Mann schon hierhergekommen?
  rationale: Das Perfekt von בוא fragt, ob die Ankunft bereits erfolgt ist. „Schon“ gibt das zweite עוֹד idiomatisch wieder; אִישׁ meint im Kontext den gesuchten Mann, ohne ihn ausdrücklich als Saul zu benennen.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Und Jahwe sagte
  rationale: Das schlichte „sagte“ bewahrt das hebräische אמר, obwohl die Aussage funktional eine Antwort ist. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: הִנֵּה
  choice: Seht
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die folgende Auskunft. „Seht“ ist gegenwärtig und verständlich, ohne die hervorhebende Funktion aufzugeben.
- source_word: נֶחְבָּא
  choice: er hat sich … versteckt
  rationale: 'Der Niphal von חבא ist im Zusammenhang reflexiv zu verstehen: Der Mann hat sich selbst verborgen.'
- source_word: אֶל הַכֵּלִים
  choice: zwischen den Gepäckstücken
  rationale: כֵּלִים ist ein weiter Begriff für Gegenstände, Gerät oder Ausrüstung. Im Zusammenhang der versammelten Menschen bezeichnet er wahrscheinlich ihr Gepäck; „zwischen“ bringt das Verbergen inmitten dieser Dinge anschaulich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Befragten“ wahrt den formellen Charakter der Gottesbefragung; „Seht“ erhält den aufmerksamkeitslenkenden Nachdruck von הִנֵּה. Die indirekte Bezeichnung Sauls als „der Mann“ bleibt erhalten.
