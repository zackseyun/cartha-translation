source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: de
  text: Dann ließ er den Stamm Benjamin nach seinen Sippen[a] herantreten. Da wurde die Sippe der Matriter getroffen[b]; dann wurde Saul, der Sohn des Kisch, getroffen. Doch als man ihn suchte, war er nicht zu finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nach seinen Familien“. Das hebräische Wort kann größere Familienverbände beziehungsweise Sippen innerhalb eines Stammes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: '„Getroffen“ bedeutet hier: durch das Los ermittelt oder ausgewählt; von einer Gefangennahme ist nicht die Rede. Dasselbe hebräische Verb wird anschließend auch für Saul gebraucht.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ließ … herantreten
  rationale: Der Hifil von קרב bedeutet hier, jemanden oder eine Gruppe heranzubringen beziehungsweise vortreten zu lassen. „Herantreten lassen“ gibt den Vorgang in natürlichem Deutsch wieder.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: den Stamm Benjamin
  rationale: שֵׁבֶט bezeichnet hier die politische und verwandtschaftliche Einheit des Stammes.
- source_word: לְמִשְׁפַּחְתּוֹ
  choice: nach seinen Sippen
  rationale: מִשְׁפָּחָה bezeichnet innerhalb eines Stammes eine größere Verwandtschaftsgruppe. Der deutsche Plural gibt den verteilenden Sinn der Präposition לְ in diesem Auswahlverfahren wieder.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: wurde getroffen
  rationale: Der Nifal von לכד bezeichnet hier das durch das Los ermittelte Ergebnis, nicht eine militärische Gefangennahme. „Vom Los getroffen werden“ ist im Deutschen verständlich und bewahrt die passive Form sowie die wiederholte Wortwahl.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: die Sippe der Matriter
  rationale: Die gentilizische Bezeichnung הַמַּטְרִי wird als Gruppenname wiedergegeben, ohne sie zu einem nicht ausdrücklich genannten Stammvater umzudeuten.
- source_word: שָׁאוּל בֶּן־קִישׁ
  choice: Saul, der Sohn des Kisch
  rationale: Die hebräische Abstammungsangabe wird in einer geläufigen deutschen Form wiedergegeben; die traditionellen deutschen Namensformen bleiben erhalten.
- source_word: וַיְבַקְשֻׁהוּ
  choice: als man ihn suchte
  rationale: בקשׁ bedeutet hier „suchen“. Das unpersönliche „man“ entspricht dem nicht ausdrücklich genannten pluralischen Subjekt in idiomatischem Deutsch.
- source_word: וְלֹא נִמְצָא
  choice: war er nicht zu finden
  rationale: Die passive Form von מצא beschreibt das erfolglose Ergebnis der Suche und wird mit einer natürlichen deutschen Passivumschreibung wiedergegeben.
theological_decisions:
- issue: Nicht genannter Handelnder bei der Auswahl
  choice: Die passive Form „wurde getroffen“ bleibt im Haupttext erhalten.
  alternative: „Das Los fiel auf …“ oder „der HERR erwählte …“
  rationale: Der hebräische Text nennt in diesen Verbformen weder ausdrücklich das Los noch Gott als Handelnden. Der Zusammenhang legt ein Losverfahren nahe, doch der Haupttext soll die grammatische Offenheit nicht unnötig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „wurde … getroffen“ bildet die wiederholte hebräische Verbform ab; die Fußnote erklärt den im Deutschen sonst möglicherweise missverständlichen Ausdruck.
