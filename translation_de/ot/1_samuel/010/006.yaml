revisions:
- from: Dann wird der Geist des HERRN mit Macht über dich kommen[a]. Du wirst zusammen mit ihnen prophetisch reden und in einen anderen Menschen verwandelt werden.
  to: Dann wird der Geist des HERRN mit Macht über dich kommen[a], und du wirst zusammen mit ihnen als Prophet auftreten und zu einem anderen Mann werden.
  rationale: Die Revision bewahrt die Kraft von צלח in Verbindung mit dem Geist des HERRN, gibt die gemeinsame prophetische Aktivität idiomatisch und ohne Festlegung auf eine bestimmte ekstatische Ausdrucksform wieder und übersetzt לְאִישׁ אַחֵר geschlechts- und bedeutungstreu. Die koordinierte Satzstruktur entspricht zudem besser der hebräischen Ereignisfolge.
