base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: de
  text: Dann wird der Geist des HERRN mit Macht über dich kommen[a], und du wirst zusammen mit ihnen als Prophet auftreten und zu einem anderen Mann werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird über dich kommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה עָלֶיךָ
  choice: wird … mit Macht über dich kommen
  rationale: Bei רוּחַ יְהוָה als Subjekt bezeichnet צלח ein machtvolles, wirksames Kommen über jemanden. Die Formulierung ist im Deutschen natürlich und vermeidet die mögliche Fehlvorstellung, der Geist stürze sich räumlich auf Saul.
- source_word: רוּחַ יְהוָה
  choice: der Geist des HERRN
  rationale: רוּחַ bezeichnet hier Gottes Geist. Die Wiedergabe des Gottesnamens als HERR entspricht einer etablierten deutschsprachigen Bibelkonvention.
- source_word: וְהִתְנַבִּיתָ
  choice: du wirst … prophetisch reden
  rationale: Der Hitpael von נבא bezeichnet hier Sauls Beteiligung an der prophetischen Tätigkeit der Prophetengruppe. „Prophetisch reden“ ist verständlich und lässt die konkrete Erscheinungsform offen.
- source_word: עִמָּם
  choice: zusammen mit ihnen
  rationale: עִם bezeichnet die gemeinsame Tätigkeit mit der zuvor genannten Prophetengruppe.
- source_word: וְנֶהְפַּכְתָּ
  choice: du wirst … verwandelt werden
  rationale: Der Nifal von הפך drückt eine bewirkte Zustandsänderung aus. „Verwandelt werden“ bewahrt die passive Bedeutung, ohne Art oder Dauer der Veränderung festzulegen.
- source_word: לְאִישׁ אַחֵר
  choice: in einen anderen Menschen
  rationale: אִישׁ bezeichnet hier Saul als Person; die idiomatische deutsche Wiedergabe „Mensch“ vermittelt die Veränderung seiner Person natürlicher als „Mann“, ohne den männlichen Bezug auf Saul aufzuheben.
theological_decisions:
- issue: Art und Dauer von Sauls Veränderung
  choice: Eine wirkliche, vom Geist bewirkte Veränderung wird ausgesagt, ihr genauer Umfang und ihre Dauer bleiben offen.
  alternative: Die Aussage entweder auf einen bloß äußeren ekstatischen Zustand zu beschränken oder als vollständige innere Erneuerung zu bestimmen.
  rationale: Der hebräische Text verbindet Sauls prophetisches Reden mit seiner Verwandlung in einen anderen Menschen, erläutert aber weder deren moralisch-geistlichen Umfang noch ihre Dauer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bilden die Abfolge des Hebräischen klar ab; die Übersetzung bewahrt die theologische Offenheit der angekündigten Veränderung.
