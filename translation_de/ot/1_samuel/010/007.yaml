id: 1SA.10.7
reference: 1 Samuel 10:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֥י תבאינה הָ/אֹת֥וֹת הָ/אֵ֖לֶּה לָ֑/ךְ עֲשֵׂ֤ה לְ/ךָ֙ אֲשֶׁ֣ר תִּמְצָ֣א יָדֶ֔/ךָ כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: de
  text: Wenn diese Zeichen bei dir eintreffen, dann tu, was immer sich dir zu tun bietet[a], denn Gott ist mit dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was immer in deiner Macht steht“. Wörtlich: „was deine Hand findet“.'
    reason: Die hebräische Redewendung kann sowohl die sich bietende Gelegenheit als auch das im eigenen Vermögen Liegende bezeichnen; die Fußnote bewahrt zudem das konkrete Bild des Ausgangstextes.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Wenn
  rationale: Die Konstruktion leitet einen zukünftigen zeitlichen Umstand ein; „Wenn“ gibt dies im modernen Deutschen knapp und natürlich wieder.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: diese Zeichen bei dir eintreffen
  rationale: בוא bezeichnet hier das Eintreten beziehungsweise Eintreffen der angekündigten Zeichen. „Bei dir eintreffen“ ist natürliches Deutsch und bewahrt den Bezug auf Saul.
- source_word: עֲשֵׂה לְךָ
  choice: dann tu
  rationale: Der Imperativ fordert Saul zum eigenständigen Handeln auf. Das לְךָ trägt eine persönliche beziehungsweise reflexive Nuance, die im Deutschen durch den Zusammenhang hinreichend vermittelt wird; „tu für dich selbst“ wäre missverständlich und unnatürlich.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: was immer sich dir zu tun bietet
  rationale: Die hebräische Wendung sagt wörtlich, was Sauls Hand findet, und bezeichnet die Handlungsmöglichkeit, die sich ihm bietet beziehungsweise in seiner Macht liegt. Die gewählte Fassung gibt den idiomatischen Sinn verständlich wieder; die konkrete Bildsprache wird in der Fußnote bewahrt.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die Aufforderung. „Denn“ entspricht dieser kausalen Funktion in einem würdigen, gut lesbaren Register.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Trotz des Artikels bezeichnet הָאֱלֹהִים hier bestimmt den Gott Israels und wird im Deutschen idiomatisch als „Gott“ wiedergegeben.
- source_word: עִמָּךְ
  choice: ist mit dir
  rationale: Die Wendung bezeichnet Gottes unterstützende Gegenwart und lässt sich direkt und natürlich so wiedergeben.
theological_decisions:
- issue: Wiedergabe von הָאֱלֹהִים mit Artikel
  choice: Gott
  alternative: der Gott
  rationale: Der hebräische Artikel verlangt hier im Deutschen keinen Artikel. „Gott ist mit dir“ bewahrt die bestimmte Bezugnahme auf Israels Gott, ohne eine im Deutschen ungewöhnliche Formulierung einzuführen.
- issue: Reichweite der Handlungsaufforderung
  choice: was immer sich dir zu tun bietet
  alternative: was immer in deiner Macht steht
  rationale: Die Formulierung lässt sowohl die sich bietende Gelegenheit als auch Sauls Handlungsmacht anklingen und vermeidet es, den Auftrag als schrankenlose Ermächtigung zu deuten; seine Begründung bleibt Gottes Gegenwart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und mündlich gut verständlich; die ungewöhnliche hebräische Hand-Metapher wird wegen ihrer Fremdheit im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
