lexical_decisions:
- source_word: וַיְכַל
  choice: Als er aufgehört hatte
  rationale: Das Verb כלה mit מן bezeichnet hier das Ende der unmittelbar vorausgehenden Tätigkeit. Die temporale Formulierung gibt die Abfolge im Deutschen natürlich wieder.
- source_word: מֵהִתְנַבּוֹת
  choice: zu weissagen
  rationale: Der Infinitiv von נבא bezeichnet die prophetische Tätigkeit. „Weissagen“ ist im biblischen Zusammenhang verständlich und lässt offen, welche konkrete Form diese Tätigkeit annahm.
- source_word: וַיָּבֹא
  choice: kam er
  rationale: בוא kann je nach Erzählperspektive „kommen“, „gehen“ oder „ankommen“ bedeuten. „Kam“ bewahrt die übliche Bewegungsangabe, ohne sie näher auszudeuten.
- source_word: הַבָּמָה
  choice: zur Kulthöhe
  rationale: במה bezeichnet hier eine erhöhte Kult- beziehungsweise Gottesdienststätte. „Kulthöhe“ ist im Deutschen präziser als das missverständliche bloße „Höhe“, ohne die Legitimität des Ortes zu bewerten.
theological_decisions:
- issue: Kultische Bedeutung von הַבָּמָה
  choice: Kulthöhe
  alternative: Höhe; Höhenheiligtum
  rationale: Die Wiedergabe macht die Funktion als religiöse Stätte deutlich, lässt aber die im weiteren biblischen Zusammenhang bestehende Spannung hinsichtlich solcher Orte unangetastet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Ereignisfolge in natürlicher deutscher Form; „Kulthöhe“ wahrt den kultischen Sinn ohne konfessionelle Wertung.
