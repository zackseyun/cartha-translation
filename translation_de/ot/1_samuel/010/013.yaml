  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: de
  text: Als er aufgehört hatte zu weissagen, kam er zur Kulthöhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Höhenheiligtum“; das hebräische Wort bezeichnet eine meist erhöht gelegene Kultstätte.'
