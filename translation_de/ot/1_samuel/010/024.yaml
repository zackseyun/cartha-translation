base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: de
  text: 'Da sagte Samuel zum ganzen Volk: »Seht ihr[a] den, den Jahwe erwählt hat? Im ganzen Volk gibt es keinen wie ihn.« Da erhob das ganze Volk einen lauten Ruf und rief: »Es lebe der König![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Habt ihr den gesehen, den Jahwe erwählt hat?«'
    reason: Die hebräische Verbform ist formal ein Perfekt; im Zusammenhang kann sie entweder als rückblickende Frage oder als gegenwärtiger Hinweis auf Saul verstanden werden.
  - marker: b
    text: 'Wörtlich: »Der König lebe!«'
    reason: Die hebräische Jussivform ist im Haupttext mit der geläufigen deutschen Akklamationsformel wiedergegeben.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das waw-consecutivum führt die Erzählung weiter; »Da sagte« gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: הַרְּאִיתֶם
  choice: Seht ihr
  rationale: Die Form ist morphologisch Perfekt, dient hier aber als aufmerksamkeitslenkende Frage, während Saul sichtbar vor dem Volk steht. Die wörtlichere Zeitform bleibt in der Fußnote erhalten.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: den, den Jahwe erwählt hat
  rationale: Der erste Relativanschluss bezeichnet Saul, der zweite gibt die Erwählung durch Jahwe wieder. Das deutsche Perfekt betont die gegenwärtige Bedeutung der vollzogenen Wahl.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als persönlicher Name wiedergegeben; »Jahwe« ist die im Deutschen übliche Form.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: Im ganzen Volk gibt es keinen wie ihn
  rationale: כִּי leitet hier eine begründende bzw. hervorhebende Aussage ein. Der Satzanschluss macht diesen Zusammenhang natürlich deutlich, ohne die Bedeutung auf eine einzige Konjunktion festzulegen.
- source_word: בְּכָל הָעָם
  choice: im ganzen Volk
  rationale: 'Die Wendung bezeichnet den Vergleichsbereich: Unter dem gesamten Volk findet sich niemand, der Saul gleicht.'
- source_word: וַיָּרִעוּ
  choice: erhob ... ein lautes Freudengeschrei
  rationale: Das Verb bezeichnet einen kräftigen gemeinschaftlichen Ruf. Im Zusammenhang der Königsakklamation ist der Ruf freudig; die Formulierung bewahrt seine Lautstärke und kollektive Wirkung.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Es lebe der König!
  rationale: Die Jussivform äußert den Wunsch, der König möge leben. »Es lebe der König!« ist die entsprechende feste deutsche Akklamationsformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage über Sauls Einzigartigkeit
  choice: Im ganzen Volk gibt es keinen wie ihn
  alternative: Denn im ganzen Volk gibt es keinen wie ihn
  rationale: Die Aussage bezieht sich im unmittelbaren Zusammenhang auf Sauls herausragende Stellung im Volk. Auf ein ausdrücklich kausales »Denn« wird verzichtet, damit die mögliche begründende oder hervorhebende Funktion von כִּי nicht unnötig verengt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und volksnah formuliert. »Volk« bleibt als kollektive Bezeichnung erhalten; der Gottesname erscheint in der üblichen deutschen Form »Jahwe«.
