  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: de
  text: Samuel erklärte dem Volk die Ordnung des Königtums[a]. Er schrieb sie in dem Buch nieder und legte es vor Jahwe. Dann entließ Samuel das ganze Volk, jeden in sein Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Rechte/Ansprüche des Königtums“ oder „die Verfahrensweise des Königtums“. Der hebräische Ausdruck kann rechtliche Regelungen, Ansprüche oder die festgelegte Praxis königlicher Herrschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeden in sein Haus“; die hebräische Wendung besagt, dass die Menschen jeweils in ihren eigenen Haushalt zurückkehrten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: erklärte
  rationale: דבר mit אֶל und einem Inhaltsobjekt bezeichnet hier die Mitteilung und Darlegung einer Sache; „erklärte“ ist im Deutschen natürlich und passt zur Bekanntgabe der königlichen Ordnung.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: die Rechte und Pflichten des Königtums
  rationale: מִשְׁפָּט kann Recht, Rechtsordnung, Anspruch oder festgelegte Verfahrensweise bedeuten; die Formulierung gibt den rechtlich geordneten Rahmen des Königtums wieder, ohne ihn auf bloße Gewohnheit zu verengen.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: Er schrieb sie in dem Buch nieder
  rationale: Das ergänzte Pronomen „sie“ bezieht sich idiomatisch auf die zuvor genannten Rechte und Pflichten. סֵפֶר kann Buch, Schriftstück oder Schriftrolle bezeichnen; „Buch“ wahrt die Offenheit hinsichtlich der materiellen Form.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: und legte es vor Jahwe
  rationale: Das singularische „es“ bezeichnet das schriftliche Dokument; „vor Jahwe“ bewahrt die Vorstellung, dass es in Gottes Gegenwart niedergelegt wurde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen etablierte Form.
- source_word: וַיְשַׁלַּח
  choice: entließ
  rationale: Im Zusammenhang bedeutet das Verb, dass Samuel die versammelten Menschen fortgehen ließ, nicht dass er sie mit einem Auftrag aussandte.
- source_word: אִישׁ לְבֵיתוֹ
  choice: jeden in sein Haus
  rationale: 'Die distributive Einzahl wird knapp und formnah wiedergegeben: Die Angehörigen des Volkes gingen jeweils in ihr eigenes Haus zurück.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִשְׁפַּט הַמְּלֻכָה
  choice: die Rechte und Pflichten des Königtums
  alternative: die Ordnung / Verfahrensweise des Königtums
  rationale: Der Ausdruck lässt sowohl rechtliche Satzungen als auch die festgelegte Praxis des Königtums anklingen. Der Haupttext betont den rechtlichen Rahmen; die Fußnote hält die weitere Bedeutungsbreite offen.
- issue: Distributive maskuline Form אִישׁ לְבֵיתוֹ
  choice: jeden in sein Haus
  alternative: alle jeweils nach Hause
  rationale: Die Übersetzung bewahrt die singularische, maskuline Verteilungsaussage des Ausgangstextes, ohne daraus eine zusätzliche theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, wird aber für natürliche deutsche Lesbarkeit in zwei Hauptsätze gegliedert. „Königtum“ bezeichnet die Institution, nicht ein Staatsgebiet.
