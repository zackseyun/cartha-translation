  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: de
  text: 'Wenn du heute von mir fortgehst, wirst du beim Grab Rahels im Gebiet Benjamins[a], bei Zelzach, zwei Männer treffen. Sie werden zu dir sagen: »Die Eselinnen, nach denen du gesucht hast, sind gefunden worden. Und sieh: Dein Vater hat die Angelegenheit mit den Eselinnen beiseitegelegt[b] und sorgt sich um euch[c] und sagt: ›Was soll ich für meinen Sohn tun?‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an der Grenze Benjamins«. Das hebräische Wort kann sowohl »Grenze« als auch »Gebiet« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »hat die Sache der Eselinnen verlassen«.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische »euch« steht im Plural und bezieht sich wahrscheinlich auf Saul und seinen Begleiter.
    reason: grammatical_clarification
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: Wenn du heute von mir fortgehst
  rationale: Die Präposition ב mit dem Infinitivus constructus leitet einen Temporalsatz ein. »Von mir fortgehen« gibt die Entfernung aus Samuels unmittelbarer Gegenwart natürlich und genau wieder.
- source_word: וּמָצָאתָ
  choice: wirst du … treffen
  rationale: Das Perfekt setzt in Samuels Vorhersage die künftig eintretende Handlung fort. Bei Personen ist »treffen« im Deutschen natürlicher als »finden«.
- source_word: עִם קְבֻרַת רָחֵל
  choice: beim Grab Rahels
  rationale: עִם hat hier lokale Bedeutung (»bei, nahe«); קְבֻרָה bezeichnet Rahels Grab beziehungsweise Grabstätte.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: im Gebiet Benjamins
  rationale: גְּבוּל kann sowohl eine Grenze als auch das von ihr umschlossene Gebiet bezeichnen. Im Haupttext wird die flüssige Ortsangabe gewählt; die mögliche Grenzbedeutung bleibt in einer Fußnote erhalten.
- source_word: בְּצֶלְצַח
  choice: bei Zelzach
  rationale: Der Ortsname wird in einer dem Deutschen angemessenen Form transliteriert; »bei« eignet sich für die punktuelle Ortsangabe.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: Die Eselinnen, nach denen du gesucht hast, sind gefunden worden
  rationale: אֲתֹנוֹת bezeichnet ausdrücklich weibliche Esel. Das deutsche resultative Passiv entspricht dem hebräischen Perfekt in der berichteten Rede.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Wendung lenkt nachdrücklich auf eine neue Entwicklung. »Sieh« wahrt diese Diskursfunktion in würdiger, noch verständlicher Sprache.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: Dein Vater hat die Angelegenheit mit den Eselinnen beiseitegelegt
  rationale: דִּבְרֵי meint hier die Sache oder Angelegenheit, nicht bloß gesprochene Worte. »Beiseitegelegt« bewahrt das Bild des Aufgebens, ohne fälschlich Gleichgültigkeit gegenüber den Tieren auszudrücken.
- source_word: וְדָאַג לָכֶם
  choice: und sorgt sich um euch
  rationale: דאג bezeichnet besorgte oder ängstliche Anteilnahme. Das pluralische לָכֶם wird ausdrücklich mit »euch« wiedergegeben und dürfte Saul und seinen Begleiter einschließen.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: Was soll ich wegen meines Sohnes tun?
  rationale: Die Präposition ל bezeichnet hier den Gegenstand der Sorge. »Wegen meines Sohnes« erhält die offene Frage, ohne eine konkrete Handlung vorwegzunehmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Direkte Rede ist übersichtlich gestaffelt; konkrete hebräische Merkmale wie »Eselinnen« und das pluralische »euch« bleiben erhalten. Lexikalische Mehrdeutigkeiten werden nicht stillschweigend aufgelöst, sondern in Fußnoten ausgewiesen.
