base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: de
  text: 'Und es geschah: Als er Samuel den Rücken kehrte, um von ihm fortzugehen,[a] gab Gott ihm ein anderes Herz.[b] Alle diese Zeichen trafen an jenem Tag ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „als er seine Schulter wandte, um von Samuel wegzugehen“. Gemeint ist, dass er sich von Samuel abwandte und aufbrach.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Gott veränderte ihm ein anderes Herz“. Das Hebräische verbindet das Verb für „wenden, verändern“ mit der Wendung „ein anderes Herz“; „gab ihm ein anderes Herz“ gibt dies im Deutschen idiomatisch wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es geschah
  rationale: Die hebräische Erzählformel wird in einer würdigen, gut verständlichen deutschen Wendung wiedergegeben und syntaktisch mit dem folgenden Temporalsatz verbunden.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: als er … den Rücken kehrte
  rationale: Wörtlich ist vom Wenden der Schulter die Rede; die deutsche Redewendung „den Rücken kehren“ gibt die hier gemeinte Abwendung natürlich wieder.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: um wegzugehen
  rationale: Die Infinitivkonstruktion bezeichnet Sauls Absicht, sich von Samuel zu entfernen. Samuel bleibt durch „Samuel den Rücken kehrte“ ausdrücklich genannt.
- source_word: וַיַּהֲפָךְ
  choice: verwandelte
  rationale: Das Verb bezeichnet ein Wenden oder Verändern. „Verwandelte … in“ wahrt diesen Vorgang deutlicher als das interpretativ glattere „gab“.
- source_word: לֵב אַחֵר
  choice: das Herz in ein anderes
  rationale: Die ungewöhnliche hebräische Formulierung „ein anderes Herz“ bleibt erhalten, ohne sie als Bekehrung, Wiedergeburt oder bloßen Mut auszudeuten.
- source_word: וַיָּבֹאוּ כָּל הָאֹתוֹת הָאֵלֶּה
  choice: Alle diese Zeichen trafen … ein
  rationale: „Eintreffen“ ist im Deutschen bei vorhergesagten Zeichen idiomatisch und gibt ihr tatsächliches Eintreten wieder, ohne ausdrücklich „Erfüllung“ in den Text einzutragen.
- source_word: בַּיּוֹם הַהוּא
  choice: noch an jenem Tag
  rationale: „An jenem Tag“ entspricht der Zeitangabe; „noch“ verdeutlicht im Deutschen idiomatisch, dass sämtliche angekündigten Zeichen innerhalb dieses Tages eintrafen.
theological_decisions:
- issue: Art der von Gott bewirkten Veränderung von Sauls Herz
  choice: Gott „verwandelte ihm das Herz in ein anderes“
  alternative: Gott gab ihm ein neues Herz / Gott machte ihm Mut für das Königtum
  rationale: Der Text bezeugt eine wirkliche, von Gott bewirkte Veränderung, bestimmt aber weder ihre genaue psychologische Art noch ihre heilsgeschichtliche Bedeutung. Die Formulierung bewahrt diese Spannung und vermeidet es, spätere Aussagen über ein „neues Herz“ einzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz folgt der hebräischen Erzählstruktur, bleibt aber flüssig; die ungewöhnliche Aussage über das „andere Herz“ wird bewusst nicht dogmatisch präzisiert.
