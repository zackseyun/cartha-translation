source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: de
  text: Als sie dort zu dem Hügel[a] kamen, siehe, da kam ihm eine Schar von Propheten entgegen. Der Geist Gottes kam mit Macht über ihn, und er prophezeite unter ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Gibea«. Die hebräische Form kann als Ortsname oder als »zu dem Hügel« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: zu dem Hügel
  rationale: Die Form bezeichnet mit Richtungsendung entweder den Hügel oder den Ort Gibea. Der Artikel spricht hier eher für das Gattungswort; die mögliche Ortsbezeichnung bleibt in der Fußnote erhalten.
- source_word: חֶבֶל נְבִאִים
  choice: eine Schar von Propheten
  rationale: חֶבֶל bezeichnet hier eine zusammengehörige Gruppe. »Schar« ist natürlich, würdig und lässt den Grad ihrer Organisation offen.
- source_word: וְהִנֵּה
  choice: auf einmal
  rationale: Die Wendung lenkt die Aufmerksamkeit auf ein plötzlich eintretendes Geschehen. »Auf einmal« gibt diese Erzählfunktion in gegenwärtigem Deutsch natürlich wieder.
- source_word: לִקְרָאתוֹ
  choice: kam ihnen … entgegen
  rationale: Die Konstruktion bezeichnet eine Bewegung auf Saul beziehungsweise die Ankommenden zu. Das deutsche »entgegenkommen« bildet dies idiomatisch ab; der Numeruswechsel im hebräischen Satz bleibt inhaltlich ohne Auswirkung.
- source_word: רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  rationale: Im Zusammenhang des von Gott gegebenen Zeichens und der Befähigung Sauls liegt der bestimmte Bezug auf Gottes Geist näher als die Lesart »ein Geist von Gott«.
- source_word: וַתִּצְלַח עָלָיו
  choice: kam … mit Macht über ihn
  rationale: צלח mit רוּחַ beschreibt in Samuel das kraftvolle, wirksame Kommen des Geistes über einen Menschen. Die Formulierung bewahrt die Intensität, ohne eine räumliche Bewegung überzubetonen.
- source_word: וַיִּתְנַבֵּא
  choice: er redete prophetisch
  rationale: Der Hitpael von נבא bezeichnet hier prophetische Betätigung. »Redete prophetisch« ist verständlich und legt weder Inhalt noch genaue Erscheinungsform zusätzlich fest.
- source_word: בְּתוֹכָם
  choice: mitten unter ihnen
  rationale: Die Wendung stellt Saul innerhalb der Prophetengruppe dar und betont seine Teilnahme an ihrem Geschehen.
theological_decisions:
- issue: Wiedergabe von רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  alternative: ein Geist von Gott
  rationale: Der Kontext beschreibt ein zuvor angekündigtes göttliches Zeichen und Sauls Befähigung. Daher ist Gottes eigener Geist der wahrscheinlichste Bezug; spätere dogmatische Präzisierungen werden nicht in den Text eingetragen.
- issue: Art von Sauls prophetischer Betätigung
  choice: er redete prophetisch
  alternative: er geriet in prophetische Verzückung
  rationale: Das hebräische Verb benennt prophetische Betätigung, bestimmt aber deren konkrete Form nicht eindeutig. Die Übersetzung vermeidet daher eine Festlegung auf Ekstase.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Aufmerksamkeitspartikel הִנֵּה wird idiomatisch mit »auf einmal« wiedergegeben. Die echte Mehrdeutigkeit zwischen »dem Hügel« und »Gibea« wird durch eine Fußnote bewahrt.
