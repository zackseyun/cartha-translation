revisions:
- from: Als sie dort zu dem Hügel[a] kamen, kam ihnen auf einmal eine Schar von Propheten entgegen. Da kam der Geist Gottes mit Macht über ihn, und er redete prophetisch mitten unter ihnen.
  to: Als sie dort zu dem Hügel[a] kamen, siehe, da kam ihm eine Schar von Propheten entgegen. Der Geist Gottes kam mit Macht über ihn, und er prophezeite unter ihnen.
  rationale: Die Revision stellt den singularischen Bezug von »ihm« zu לִקְרָאתוֹ wieder her, ohne den vorausgehenden Plural »sie« zu verändern. »Siehe, da« gibt die Diskurspartikel וְהִנֵּה wieder, und »er prophezeite« übersetzt וַיִּתְנַבֵּא direkt, ohne die Art des prophetischen Geschehens näher festzulegen. Die Fußnote zur möglichen Lesung als Ortsname bleibt bestehen.
