  text: וְ/יָרַדְתָּ֣ לְ/פָנַ/י֮ הַ/גִּלְגָּל֒ וְ/הִנֵּ֤ה אָֽנֹכִי֙ יֹרֵ֣ד אֵלֶ֔י/ךָ לְ/הַעֲל֣וֹת עֹל֔וֹת לִ/זְבֹּ֖חַ זִבְחֵ֣י שְׁלָמִ֑ים שִׁבְעַ֨ת יָמִ֤ים תּוֹחֵל֙ עַד בּוֹאִ֣/י אֵלֶ֔י/ךָ וְ/הוֹדַעְתִּ֣י לְ/ךָ֔ אֵ֖ת אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: de
  text: Du sollst vor mir nach Gilgal hinabgehen. Sieh, ich werde zu dir hinabkommen, um Brandopfer darzubringen und Heilsopfer[a] zu schlachten. Sieben Tage sollst du warten, bis ich zu dir komme und dir mitteile, was du tun sollst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Friedensopfer“ oder „Gemeinschaftsopfer“. Der hebräische Ausdruck bezeichnet Opfer, die mit Frieden, Wohlergehen, Ganzsein und gemeinschaftlicher Teilhabe verbunden sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתָּ
  choice: Du sollst … hinabgehen
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt die anweisende beziehungsweise vorausblickende Folge fort. „Du sollst“ bewahrt diesen verpflichtenden Zukunftssinn; „hinabgehen“ erhält die räumliche Bedeutung von ירד.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Wörtlich „vor meinem Angesicht“; die Formulierung kann sowohl den räumlichen als auch den zeitlichen Sinn ausdrücken, dass Saul Samuel vorausgeht.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Der Ortsname wird nach üblicher deutscher Form transliteriert.
- source_word: וְהִנֵּה
  choice: Sieh
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. „Sieh“ ist gegenwärtiges, würdevolles Deutsch und bewahrt die deiktische Kraft.
- source_word: יֹרֵד
  choice: ich werde … hinabkommen
  rationale: Das Partizip bezeichnet hier eine bevorstehende beziehungsweise beabsichtigte Bewegung. Aus der Perspektive des Angesprochenen ist „kommen“ im Deutschen idiomatisch; „hinab“ erhält die räumliche Komponente.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: um Brandopfer darzubringen
  rationale: Die feste Opferformel bezeichnet das Darbringen von Ganzbrandopfern. „Brandopfer darbringen“ ist im Deutschen klar und terminologisch angemessen.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: Heilsopfer zu schlachten
  rationale: זבח bezeichnet ausdrücklich das Schlachten beziehungsweise Opfern; שְׁלָמִים benennt Opfer, die mit Heil, Frieden, Ganzsein und gemeinschaftlicher Mahlzeit verbunden sind. „Heilsopfer“ lässt diese Bedeutungsbreite offen; geläufige Alternativen stehen in der Fußnote.
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: Sieben Tage sollst du warten
  rationale: יחל kann „warten“ oder „hoffen“ bedeuten. In dieser konkreten zeitlichen Anweisung ist „warten“ gemeint.
- source_word: עַד בּוֹאִי אֵלֶיךָ
  choice: bis ich zu dir komme
  rationale: Der Infinitiv mit Suffix nach עַד wird im Deutschen natürlich als finiter Temporalsatz wiedergegeben.
- source_word: וְהוֹדַעְתִּי לְךָ
  choice: und dir mitteile
  rationale: Der Hifil von ידע bedeutet „wissen lassen/bekannt machen“. „Mitteilen“ gibt den kausativen Sinn in natürlichem Deutsch wieder.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: was du tun sollst
  rationale: Die Relativkonstruktion wird idiomatisch wiedergegeben; „sollst“ wahrt den anweisenden Charakter.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Der hebräische Ausdruck umfasst Vorstellungen von Frieden, Wohlergehen, Ganzsein und gemeinschaftlicher Teilhabe. „Heilsopfer“ vermeidet eine Verengung auf nur einen dieser Aspekte; die anderen etablierten Wiedergaben werden als echte lexikalische Alternativen dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „du sollst“ erhält den anweisenden Ton. „Sieh“ bewahrt die Hervorhebung durch הִנֵּה, ohne das altertümlichere „siehe“ zu verwenden.
