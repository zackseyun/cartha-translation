source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: de
  text: 'Und er sagte zu den Israeliten[a]: »So spricht Jahwe, der Gott Israels: Ich habe Israel aus Ägypten heraufgeführt und euch aus der Gewalt der Ägypter und aus der Gewalt all der Königreiche gerettet, die euch unterdrückten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Söhnen Israels«; traditionell auch: »zu den Kindern Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung lautet wörtlich »Söhne Israels«, dient hier aber als geläufige Volksbezeichnung. »Israeliten« gibt den gemeinten Gesamtverband im modernen Deutsch natürlich und präzise wieder; die formale Alternative wird in einer Fußnote genannt.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Boten- und Prophetenformel wird mit der im Deutschen würdigen und vertrauten Formel »So spricht« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen übliche wissenschaftliche Form.
- source_word: הֶעֱלֵיתִי
  choice: habe ... heraufgeführt
  rationale: Der Hifil von עלה bezeichnet hier das Heraufführen aus Ägypten. »Heraufgeführt« bewahrt die räumliche Exodus-Bildsprache.
- source_word: וָאַצִּיל
  choice: gerettet
  rationale: Der Hifil von נצל bezeichnet die Befreiung oder Rettung aus fremder Gewalt. »Gerettet« ist im heutigen Deutsch klar und bewahrt die heilsgeschichtliche Aussage.
- source_word: מִיַּד
  choice: aus der Gewalt
  rationale: Wörtlich steht »aus der Hand«. In diesem Zusammenhang bezeichnet die Hand Herrschaft oder Macht; »aus der Gewalt« überträgt das hebräische Idiom natürlich und genau.
- source_word: מִצְרַיִם
  choice: der Ägypter
  rationale: Nach »aus der Gewalt« ist die ägyptische Macht beziehungsweise deren Träger gemeint. »Der Ägypter« ist im Deutschen natürlicher als »Ägyptens« und entspricht dem Sinn im Kontext.
- source_word: כָּל הַמַּמְלָכוֹת
  choice: all der Königreiche
  rationale: Die Wiedergabe erhält den umfassenden Plural, ohne nicht ausdrücklich genannte geografische Angaben hinzuzufügen.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: die euch unterdrückten
  rationale: Das Partizip beschreibt die Königreiche als fortdauernd oder charakteristisch bedrängend. Im deutschen Rückblick gibt »unterdrückten« diesen Sinn flüssig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. Seine Wiedergabe als »Jahwe« bewahrt den Unterschied zwischen Name und Titel, ohne eine konfessionelle Sonderdeutung einzuführen.
- issue: Wiedergabe der Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Obwohl die Formulierung morphologisch »Söhne Israels« lautet, fungiert sie hier als Bezeichnung des versammelten Volkes. »Israeliten« vermeidet im modernen Deutsch den unbeabsichtigten Eindruck, nur männliche Nachkommen seien angesprochen; die wörtliche Form bleibt als Fußnote sichtbar.
- issue: Bedeutung des Exodus als göttliches Handeln
  choice: Ich habe Israel aus Ägypten heraufgeführt
  alternative: Ich führte Israel aus Ägypten hinauf
  rationale: Die Übersetzung wahrt sowohl Gottes ausdrücklich hervorgehobenes Handeln als auch die räumliche Bildsprache, ohne zusätzliche theologische Erklärung in den Text einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede behält mit »So spricht« ihren feierlichen Botenformel-Charakter. Hebräische Machtmetaphorik wird dort idiomatisch übertragen, wo eine wörtliche Wiedergabe im Deutschen unnötig fremd klänge.
