base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: de
  text: 'Aber niederträchtige Männer sagten: „Wie soll der uns retten?“ Sie verachteten ihn und brachten ihm kein Geschenk. Er aber war wie einer, der schwieg.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er war wie ein Tauber.“ Der hebräische Ausdruck kann ein Schweigen beziehungsweise Nichtreagieren angesichts einer Provokation bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: gewissenlose Männer
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne der Nichtswürdigkeit“ und bezeichnet moralisch verkommene oder gewissenlose Menschen. Die gewählte Formulierung gibt den idiomatischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: Wie soll der uns retten?
  rationale: Die Frage stellt Sauls Fähigkeit zur Rettung verächtlich in Zweifel. Das betonte „der“ gibt die Geringschätzung des hebräischen זֶה knapp und idiomatisch wieder.
- source_word: וַיִּבְזֻהוּ
  choice: Sie verachteten ihn
  rationale: בזה bezeichnet Verachtung beziehungsweise die Geringschätzung einer Person. Die direkte Formulierung entspricht dem knappen Erzählstil.
- source_word: מִנְחָה
  choice: Geschenk
  rationale: Im königlichen Zusammenhang bezeichnet מִנְחָה eine Gabe, die einem Herrscher überreicht wird. „Geschenk“ wahrt die Bedeutungsbreite, ohne die politisch mögliche Nuance „Tribut“ zwingend festzulegen.
- source_word: כְּמַחֲרִישׁ
  choice: wie einer, der schweigt
  rationale: Das Partizip von חרשׁ bezeichnet hier am ehesten das Schweigen beziehungsweise bewusste Nichtreagieren. Das vergleichende כ wird durch „wie“ ausdrücklich erhalten.
- source_word: וַיְהִי
  choice: er verhielt sich
  rationale: Im Zusammenhang beschreibt היה Sauls Haltung angesichts der Verachtung. „Er verhielt sich“ verbindet die Vergleichsform natürlich mit seinem bewussten Schweigen, ohne ein Motiv hinzuzufügen.
theological_decisions:
- issue: Darstellung von Sauls Reaktion
  choice: Saul reagiert auf die Verachtung mit Schweigen.
  alternative: Saul tut so, als sei er taub beziehungsweise als habe er die Beleidigung nicht gehört.
  rationale: כְּמַחֲרִישׁ lässt sich als Schweigen oder idiomatisch als Verhalten wie ein Tauber verstehen. Der Haupttext bewahrt den direkten Sinn des Schweigens; die Fußnote nennt die echte lexikalische Alternative, ohne Sauls Beweggrund festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem Erzählstil. Das umgangssprachlich-abwertende „der“ in der direkten Rede spiegelt die Verachtung der Sprecher, während die Erzählerstimme sachlich bleibt.
