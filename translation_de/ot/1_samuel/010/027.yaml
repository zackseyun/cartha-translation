  naturalness: Der Text ist überwiegend natürliches modernes Standarddeutsch. „Wie soll der uns retten?“ vermittelt die demonstrative Geringschätzung von זֶה knapp und idiomatisch. „Er aber war wie einer, der schwieg“ ist etwas unmittelbarer am hebräischen Vergleich als „verhielt sich wie einer, der schweigt“ und vermeidet eine mögliche Andeutung absichtlichen Verhaltens.
