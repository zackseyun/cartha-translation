base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/004.yaml
  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: de
  text: Sie werden dich nach deinem Wohlergehen fragen[a] und dir zwei Brote[b] geben, und du sollst sie aus ihrer Hand annehmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie werden dich grüßen.« Wörtlich geht es im Hebräischen darum, nach Frieden beziehungsweise Wohlergehen zu fragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zwei Brot«; sinngemäß sind zwei Brote gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »du sollst sie aus ihrer Hand nehmen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: Sie werden dich nach deinem Wohlergehen fragen
  rationale: Die Verbindung mit שָׁלוֹם bezeichnet die Erkundigung nach dem persönlichen Befinden und kann zugleich als Grußformel verstanden werden. Die gewählte Formulierung bewahrt den Bildgehalt des hebräischen Ausdrucks und ist im Deutschen verständlich.
- source_word: שְׁתֵּי לֶחֶם
  choice: zwei Brote
  rationale: Obwohl לֶחֶם grundsätzlich »Brot« bedeutet, verlangt die Mengenangabe im Deutschen eine zählbare Form. »Zwei Brote« ist natürlich und entspricht den gemeinten Einheiten.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: und du sollst sie aus ihrer Hand annehmen
  rationale: לקח bedeutet wörtlich »nehmen«, bezeichnet hier aber das Annehmen dessen, was gegeben wird. »Annehmen« gibt den sozialen Vorgang natürlich wieder; »aus ihrer Hand« bewahrt das hebräische Bild.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zukunftsfolge der hebräischen Erzählform wird mit »werden« wiedergegeben, die anschließende Anweisung mit »sollst«. Das kollektive hebräische Bild »aus ihrer Hand« bleibt erhalten.
