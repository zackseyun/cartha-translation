base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/015.yaml
  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: de
  text: 'Da sagte Sauls Onkel: „Bitte erzähl mir, was Samuel euch gesagt hat.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter. „Da“ gibt diese zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: דּוֹד שָׁאוּל
  choice: Sauls Onkel
  rationale: דּוֹד bezeichnet in diesem Verwandtschaftskontext den Onkel; die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung idiomatisch wieder.
- source_word: הַגִּידָה נָּא לִי
  choice: Bitte erzähl mir
  rationale: Der Hifil-Imperativ von נגד bedeutet hier „erzählen, mitteilen“. נָא verleiht der Aufforderung einen höflich-bittenden Ton, den „bitte“ natürlich ausdrückt.
- source_word: מָה אָמַר
  choice: was … gesagt hat
  rationale: מָה leitet die indirekte Frage ein; אמר bleibt mit dem gewöhnlichen deutschen Redeverb „sagen“ eng am Ausgangstext.
- source_word: לָכֶם
  choice: euch
  rationale: Die hebräische Form steht in der zweiten Person maskulin Plural. Anders als das englische „you“ kennzeichnet „euch“ den Plural bereits eindeutig, sodass keine Fußnote nötig ist.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
theological_decisions: []
