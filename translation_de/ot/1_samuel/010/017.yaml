  text: וַ/יַּצְעֵ֤ק שְׁמוּאֵל֙ אֶת הָ/עָ֔ם אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: de
  text: Dann rief Samuel das Volk zu Jahwe in Mizpa zusammen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dann berief Samuel das Volk zu Jahwe in Mizpa ein.« Das hebräische Verb kann das Rufen oder Einberufen einer Versammlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: rief … zusammen
  rationale: Das Verb צעק bedeutet häufig »rufen/schreien«, bezeichnet hier aber mit direktem Objekt das Zusammenrufen beziehungsweise Einberufen des Volkes. »rief … zusammen« gibt diese Funktion natürlich und präzise wieder.
- source_word: אֶת הָעָם
  choice: das Volk
  rationale: עָם bezeichnet hier das Volk Israel, das Samuel versammelt; »das Volk« ist die direkte und kontextgemäße Wiedergabe.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bedeutet grundsätzlich »zu/auf … hin«. Die ungewöhnliche Formulierung wird bewahrt und nicht stillschweigend zu »vor Jahwe« umgedeutet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname »Jahwe« wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: הַמִּצְפָּה
  choice: nach Mizpa
  rationale: מִצְפָּה ist hier der Ortsname Mizpa. Da der hebräische Text den Ort als Ziel der Zusammenrufung formuliert, entspricht »nach Mizpa« der Richtungsaussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname.
- issue: Verhältnis der Versammlung zu Jahwe
  choice: zu Jahwe
  alternative: vor Jahwe
  rationale: »Vor Jahwe« wäre im Kontext gut verständlich, würde jedoch eine Deutung der Präposition אֶל vorwegnehmen. »Zu Jahwe« erhält die auffällige und möglicherweise kultisch beziehungsweise bundesbezogen gemeinte Formulierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung hält »zu Jahwe« und »nach Mizpa« unterscheidbar und bewahrt damit die Spannung der beiden hebräischen Zielangaben.
