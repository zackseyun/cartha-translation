base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: de
  text: Dann wirst du von dort weiterziehen und bis zur Tabor-Eiche kommen[a]. Dort werden dir drei Männer begegnen, die zu Gott nach Bethel hinaufgehen[b]. Einer trägt drei junge Ziegen, ein anderer drei Laibe Brot und der dritte einen Schlauch mit Wein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zur Tabor-Terebinthe“. Das hebräische Wort kann einen großen Baum wie eine Eiche oder Terebinthe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die zu Gott hinaufgehen, Bethel“. Gemeint ist wahrscheinlich der Weg zu einer Kultstätte in Bethel.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „einen Weinschlauch“. Das hebräische Wort bezeichnet hier wahrscheinlich einen aus Tierhaut gefertigten Flüssigkeitsbehälter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: Dann gehst du von dort aus weiter
  rationale: Die Formulierung gibt sowohl die fortgesetzte Bewegung von dem vorher genannten Ort als auch וָהָלְאָה („weiter, darüber hinaus“) in natürlichem Deutsch wieder.
- source_word: אֵלוֹן תָּבוֹר
  choice: Tabor-Eiche
  rationale: אֵלוֹן bezeichnet einen großen Baum und kann je nach Bestimmung als Eiche oder Terebinthe verstanden werden. „Tabor-Eiche“ eignet sich als verständliche Bezeichnung des bekannten Orientierungspunktes; die Alternative wird in einer Fußnote bewahrt.
- source_word: וּמְצָאוּךָ
  choice: begegnen dir
  rationale: Das Verb bedeutet wörtlich „sie werden dich finden“, bezeichnet hier aber idiomatisch das Zusammentreffen unterwegs.
- source_word: עֹלִים אֶל־הָאֱלֹהִים בֵּית אֵל
  choice: die zu Gott nach Bethel hinaufgehen
  rationale: Die Wiedergabe wahrt die ungewöhnliche hebräische Verbindung von „zu Gott hinaufgehen“ und „Bethel“, ohne das nicht ausdrücklich genannte Verb „anbeten“ in den Haupttext einzufügen.
- source_word: גְדָיִים
  choice: junge Ziegen
  rationale: Die Bezeichnung meint Ziegenjunge. „Junge Ziegen“ ist im modernen Deutsch klarer und würdevoller als das mögliche, aber missverständliche „Zicklein“.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: Laibe Brot
  rationale: כִּכָּר bezeichnet hier einen Brotlaib, wahrscheinlich von runder Form. „Laibe Brot“ ist natürlich und vermeidet eine unnötige Festlegung auf die genaue Form.
- source_word: נֵבֶל יָיִן
  choice: einen Schlauch mit Wein
  rationale: נֵבֶל bezeichnet hier ein Flüssigkeitsgefäß, wahrscheinlich einen Lederschlauch; יָיִן nennt dessen Inhalt. Die Formulierung ist präzise und im Deutschen natürlicher als „einen Schlauch Wein“.
theological_decisions:
- issue: Bedeutung von „zu Gott … Bethel hinaufgehen“
  choice: Die Männer gehen in religiöser Ausrichtung zu Gott nach Bethel hinauf; der knappe und spannungsreiche Wortlaut bleibt erhalten.
  alternative: Die Männer gehen nach Bethel hinauf, um Gott anzubeten.
  rationale: Der Zusammenhang legt den Weg zu einer Kultstätte in Bethel nahe, doch das Hebräische nennt in diesem Satz weder „anbeten“ noch „opfern“ ausdrücklich. Daher wird diese Deutung nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Anrede steht entsprechend dem hebräischen Singular in der Du-Form. Die Aufzählung wird mit „einer – ein anderer – der dritte“ idiomatisch gegliedert, ohne den Inhalt zu verändern.
