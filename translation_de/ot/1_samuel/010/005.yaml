source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: de
  text: Danach wirst du nach Gibea Gottes[a] kommen, wo sich der Stützpunkt der Philister[b] befindet. Wenn du dort in die Stadt kommst, wirst du einer Schar von Propheten begegnen, die von der Kulthöhe herabkommen. Vor ihnen her erklingen Harfe, Handtrommel, Flöte und Leier[c], und sie werden weissagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Hügel Gottes“. Der hebräische Ausdruck kann als Ortsname („Gibea Gottes“) oder als beschreibende Bezeichnung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wo die Statthalter der Philister sind“. Das hebräische Wort kann sowohl einen militärischen Posten als auch eingesetzte Amtsträger bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: Die genaue Bestimmung der antiken Instrumente ist unsicher. Das mit „Harfe“ wiedergegebene Instrument könnte auch eine Laute gewesen sein, und bei der „Flöte“ kann es sich um eine Pfeife gehandelt haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: Gibea Gottes
  rationale: Die Wendung wird im Haupttext als Ortsname verstanden. Die teilweise Übersetzung wahrt die im Hebräischen erkennbare Bedeutung und entspricht natürlichem deutschem Namensgebrauch; die mögliche rein beschreibende Lesart wird in der Fußnote erhalten.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: Stützpunkt der Philister
  rationale: נְצִיב kann einen eingesetzten Amtsträger oder einen militärisch besetzten Posten bezeichnen. Der örtliche und erzählerische Zusammenhang spricht eher für einen militärischen Stützpunkt, ohne zwingend eine große Garnison vorauszusetzen.
- source_word: חֶבֶל נְבִיאִים
  choice: eine Schar von Propheten
  rationale: חֶבֶל bezeichnet hier eine gemeinsam auftretende Gruppe. „Schar“ ist knapp, verständlich und dem feierlichen Erzählton angemessen.
- source_word: הַבָּמָה
  choice: Kulthöhe
  rationale: בָּמָה meint eine erhöhte Kultstätte. „Kulthöhe“ macht die religiöse Funktion im Deutschen deutlicher als das rein räumliche „Höhe“, ohne sie als Tempel oder Heiligtum näher festzulegen.
- source_word: נֵבֶל וְתֹף וְחָלִיל וְכִנּוֹר
  choice: Harfe, Handtrommel, Flöte und Leier
  rationale: Die Wiedergaben sind verständliche moderne Annäherungen an antike Instrumente. „Handtrommel“ vermeidet die möglicherweise irreführende Vorstellung eines modernen Tamburins; „Harfe“ und „Leier“ unterscheiden die beiden Saiteninstrumente.
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: und sie werden weissagen
  rationale: „Weissagen“ bewahrt den direkten Bezug zur prophetischen Tätigkeit und lässt offen, ob diese aus Rede, Gesang, ekstatischem Verhalten oder einer Verbindung davon besteht.
theological_decisions:
- issue: Art der prophetischen Tätigkeit in מִתְנַבְּאִים
  choice: „sie werden weissagen“ ohne nähere Bestimmung
  alternative: „sie werden in prophetische Begeisterung geraten“ oder „sie werden prophetisch singen“
  rationale: Das Verb bezeichnet eindeutig prophetische Betätigung, legt aber deren konkrete Erscheinungsform nicht abschließend fest. Die offene Formulierung vermeidet eine psychologische oder liturgische Festlegung.
- issue: Funktion von נְצִבֵי פְלִשְׁתִּים
  choice: militärischer „Stützpunkt“
  alternative: philistäische Statthalter oder Beamte
  rationale: Der Kontext begünstigt eine militärisch-räumliche Deutung, doch die mögliche personenbezogene Bedeutung des hebräischen Ausdrucks bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „Kulthöhe“ und „weissagen“ sind bibelsprachlich geprägt, bleiben aber allgemein verständlich. „Vor ihnen her erklingen“ gibt die knappe hebräische Instrumentenangabe natürlich wieder, ohne ausdrücklich festzulegen, wer die Instrumente spielt.
