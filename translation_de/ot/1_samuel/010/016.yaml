  - severity: low
    issue: „erzählte er ihm nichts“
    rationale: Die Wendung ist idiomatisch, kann aber bedeuten, dass gar nichts erzählt wurde. Der hebräische Text bezieht die Verneinung gezielt auf die Angelegenheit des Königtums; „teilte er ihm nicht mit“ macht diesen Bezug klarer.
