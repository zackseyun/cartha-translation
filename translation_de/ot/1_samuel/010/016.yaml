  source_fidelity: 'Der Entwurf gibt die wesentlichen hebräischen Elemente zutreffend wieder: Saul spricht zu seinem Onkel, die Aussage über die wiedergefundenen Eselinnen ist hervorgehoben, und Saul verschweigt die von Samuel angesprochene Angelegenheit des Königtums. Die spezifisch weibliche Tierbezeichnung „Eselinnen“ ist quellentreu. Für דְּבַר הַמְּלוּכָה ist „Angelegenheit des Königtums“ näher an der sachlichen hebräischen Konstruktion als die umgangssprachliche Wendung „Sache mit dem Königtum“.'
