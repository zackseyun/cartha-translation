  terminology: „Königtum“ ist im Kontext eine geeignete Wiedergabe von מְלוּכָה. Die Fußnote bewahrt mit „Königsherrschaft“ und „Königreich“ die lexikalische Spannweite, ohne die kontextuelle Deutung als Sauls Königtum zu überzeichnen.
