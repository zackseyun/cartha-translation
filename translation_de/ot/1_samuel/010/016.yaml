base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: de
  text: 'Saul sagte zu seinem Onkel: „Er hat uns ganz klar gesagt, dass die Eselinnen gefunden worden sind.“ Doch die Angelegenheit des Königtums[a], über die Samuel gesprochen hatte, teilte er ihm nicht mit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Königsherrschaft“. Das hebräische Wort kann auch „Königreich“ bedeuten, bezeichnet hier aber wahrscheinlich Sauls Königtum.'
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: seinem Onkel
  rationale: Im erzählerischen Zusammenhang bezeichnet דּוֹד hier den Verwandtschaftsgrad „Onkel“, nicht einen Geliebten.
- source_word: הַגֵּד הִגִּיד
  choice: hat uns ganz klar gesagt
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage; „ganz klar“ gibt diese Hervorhebung in natürlichem Deutsch wieder.
- source_word: נִמְצְאוּ
  choice: gefunden worden sind
  rationale: Die passive Bedeutung passt zur Auffindung der zuvor verlorenen Tiere; im Deutschen ist das Perfekt in der direkten Rede natürlich.
- source_word: הָאֲתֹנוֹת
  choice: die Eselinnen
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich weibliche Esel; „Eselinnen“ ist im Deutschen natürlich und bewahrt diese Einzelheit.
- source_word: דְּבַר הַמְּלוּכָה
  choice: von der Sache mit dem Königtum
  rationale: דָּבָר bezeichnet hier eine Sache oder Angelegenheit, מְלוּכָה im Kontext Sauls königliche Würde beziehungsweise Herrschaft.
- source_word: לֹא הִגִּיד לוֹ
  choice: erzählte er ihm nichts
  rationale: Die Formulierung gibt die Verneinung und das indirekte Objekt idiomatisch wieder; Saul bleibt das Subjekt.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: über die Samuel gesprochen hatte
  rationale: Der Relativsatz bezieht sich auf die Angelegenheit des Königtums und wird ohne zusätzliche inhaltliche Festlegung wiedergegeben.
theological_decisions:
- issue: Bedeutung von מְלוּכָה
  choice: Königtum
  alternative: Königsherrschaft; Königreich
  rationale: Der unmittelbare Zusammenhang betrifft Sauls Einsetzung und königliche Würde, nicht vorrangig ein Gebiet; die Fußnote hält die mögliche Bedeutungsbreite offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die emphatische hebräische Verbverbindung wird idiomatisch verstärkt; die weibliche Form der Tierbezeichnung bleibt erhalten.
