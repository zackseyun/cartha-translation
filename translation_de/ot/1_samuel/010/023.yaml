base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: de
  text: Da liefen sie hin und holten ihn von dort[a]. Er stellte sich mitten unter das Volk. Er überragte das ganze Volk von seinen Schultern an aufwärts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlich: „nahmen ihn von dort“. Im Zusammenhang kann dies bedeuten, dass sie Saul aus seinem Versteck holten (siehe Vers 22).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: Da liefen sie hin
  rationale: Das Verb רוץ bezeichnet Laufen oder Eilen. Die Wiedergabe bewahrt die lebendige Erzählweise und klingt im Deutschen natürlich.
- source_word: וַיִּקָּחֻהוּ
  choice: holten ihn
  rationale: לקח bedeutet gewöhnlich „nehmen“. Im Zusammenhang holen die Leute Saul aus seinem Versteck; „holten ihn“ gibt diese kontextuelle Bedeutung natürlich wieder, ohne mehr hinzuzufügen.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die Ortsangabe wird direkt und idiomatisch wiedergegeben.
- source_word: וַיִּתְיַצֵּב
  choice: Er stellte sich
  rationale: Der Hitpael von יצב bedeutet, sich hinzustellen oder seinen Platz einzunehmen. „Er stellte sich“ wahrt die aktive Nuance besser als das bloße „er stand“.
- source_word: בְּתוֹךְ הָעָם
  choice: mitten unter das Volk
  rationale: בְּתוֹךְ bezeichnet die Mitte beziehungsweise das Innere einer Gruppe. In Verbindung mit dem Bewegungsverb „sich stellen“ ist „mitten unter“ natürliches Deutsch.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: überragte alle anderen
  rationale: גבהּ bezeichnet hier im Vergleich körperliche Größe. „überragte“ drückt knapp und idiomatisch aus, dass Saul größer war als alle im Volk.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: vom Schulterbereich an aufwärts
  rationale: 'Die hebräische Wendung beschreibt, um wie viel Saul die anderen überragte: Sein Oberkörper ragte ab Schulterhöhe über sie hinaus. Die Formulierung bewahrt das anschauliche Bild.'
