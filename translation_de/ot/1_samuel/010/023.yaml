    issue: „alle anderen“ statt „das ganze Volk“
    rationale: Das Hebräische vergleicht Saul mit „dem ganzen Volk“. „Alle anderen“ ist kontextuell verständlich, lässt den ausdrücklichen Bezug auf das Volk aber zurücktreten.
  - severity: medium
    issue: „vom Schulterbereich an aufwärts“
    rationale: „Schulterbereich“ ist modern-technisch und die Wendung bleibt semantisch unklar. Die hebräische Formulierung nennt Sauls Schultern und das, was darüber liegt; „von seinen Schultern an aufwärts“ bewahrt dieses Bild ohne zusätzliche Deutung.
  - severity: low
    issue: Fußnote formuliert die Kontextdeutung zu bestimmt
    rationale: Dass Saul aus dem Versteck geholt wird, ergibt sich aus Vers 22, doch das Verb selbst bedeutet zunächst „nehmen“. Die Anmerkung sollte dies als kontextuelle Erklärung und die wörtlichere Alternative klar ausweisen.
