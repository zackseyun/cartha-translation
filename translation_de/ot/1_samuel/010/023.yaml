  rationale: Die Revision präzisiert den Vergleich mit dem ganzen Volk, ersetzt eine technisch-unklare Formulierung der hebräischen Größenangabe durch eine quellennähere deutsche Wendung und fasst die lexikalische Fußnote vorsichtiger.
