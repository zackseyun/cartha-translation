revisions:
- from: 'Ihr aber habt heute euren Gott verworfen, der euch aus all eurem Unglück und all euren Bedrängnissen rettet.[a] Ihr habt zu ihm gesagt: »Nein, setze einen König über uns!«[b] Nun tretet vor Jahwe an, geordnet nach euren Stämmen und euren Tausendschaften.[c]'
  to: 'Ihr aber habt heute euren Gott verworfen, der euch aus all eurem Unglück und all euren Bedrängnissen rettet.[a] Ihr habt zu ihm gesagt: »Nein, sondern setze einen König über uns!«[b] Stellt euch nun vor Jahwe auf, nach euren Stämmen und Tausendschaften.[c]'
  rationale: Die Revision bewahrt die beabsichtigte adversative Deutung von כִּי, ohne „Nein“ als alleinige Entsprechung der Partikel auszugeben, und formuliert die abschließende Aufforderung idiomatischer sowie enger am Hitpael von יצב. Die Fußnoten bleiben vollständig verankert und erläutern die jeweiligen lexikalischen beziehungsweise syntaktischen Alternativen.
