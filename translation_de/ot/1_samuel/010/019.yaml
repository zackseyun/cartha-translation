    rationale: Der Kontext rechtfertigt einen Gegensatz, doch כִּי kann auch den Inhalt der Forderung einleiten bzw. nachdrücklich markieren. „Nein, sondern“ gibt die gewählte kontextuelle Lesart verständlich wieder und die Fußnote wahrt die verbleibende Offenheit.
  - severity: low
    issue: „Tretet vor Jahwe an, geordnet nach ...“ ist leicht erklärend und weniger idiomatisch.
    rationale: הִתְיַצְּבוּ bezeichnet das förmliche Sich-Aufstellen. „Stellt euch nun vor Jahwe auf, nach euren Stämmen und Tausendschaften“ trifft dies direkt, ohne „geordnet“ zusätzlich einzuführen.
