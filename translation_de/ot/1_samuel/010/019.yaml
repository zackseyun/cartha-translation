source:
  edition: WLC
  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: de
  text: 'Ihr aber habt heute euren Gott verworfen, der euch aus all eurem Unglück und all euren Bedrängnissen rettet.[a] Ihr habt zu ihm gesagt: »Nein, sondern setze einen König über uns!«[b] Stellt euch nun vor Jahwe auf, nach euren Stämmen und Tausendschaften.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Wörter können auch mit „aus all euren Übeln und Nöten“, „aus all eurem Unheil und euren Bedrängnissen“ oder ähnlich wiedergegeben werden. Gemeint sein kann erlittenes Unheil, Unglück, Not oder Bedrängnis.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Setze einen König über uns!“ beziehungsweise: „Einen König sollst du über uns setzen!“ Die Funktion des hebräischen כִּי ist hier nicht völlig eindeutig; im Zusammenhang kann sie den Gegensatz zu Gottes Rettung und die nachdrückliche Forderung des Volkes hervorheben.'
    reason: textual_ambiguity
  - marker: c
    text: 'Oder: „nach euren Sippen“ beziehungsweise „nach euren Tausenderverbänden“. Das hebräische Wort für „Tausend“ kann auch eine soziale, administrative oder militärische Untereinheit bezeichnen und muss hier nicht lediglich eine genaue Anzahl meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: habt … verworfen
  rationale: מָאַס bezeichnet ein Zurückweisen oder Verwerfen. „Verworfen“ bewahrt hier den nachdrücklichen, bundesbezogenen Vorwurf und klingt im Deutschen würdig und verständlich.
- source_word: אֱלֹהֵיכֶם
  choice: euren Gott
  rationale: אֱלֹהִים ist der Form nach pluralisch, bezeichnet hier mit singularischem Bezug jedoch eindeutig den einen Gott Israels.
- source_word: מוֹשִׁיעַ
  choice: rettet
  rationale: Das Partizip beschreibt Gottes kennzeichnendes beziehungsweise fortdauerndes Handeln. „Rettet“ ist umfassend und natürlich; „befreit“ wäre ebenfalls möglich, aber enger.
- source_word: מִכָּל רָעוֹתֵיכֶם
  choice: aus all eurem Unglück
  rationale: רָעוֹת kann erlittenes Unheil, Unglück, Not oder Böses bezeichnen. „Unglück“ vermeidet im Kontext die mögliche Fehlannahme, Gott rette Israel aus dessen eigenen bösen Taten, ohne die Bedeutungsbreite vollständig festzulegen.
- source_word: וְצָרֹתֵיכֶם
  choice: und all euren Bedrängnissen
  rationale: צָרוֹת bezeichnet Nöte, Bedrängnisse oder Drangsale. „Bedrängnisse“ hält den zweiten Ausdruck vom allgemeineren „Unglück“ unterscheidbar.
- source_word: כִּי
  choice: Nein
  rationale: כִּי leitet hier im Zusammenhang die nachdrückliche Forderung des Volkes ein und kann adversativ verstanden werden. „Nein“ macht den Gegensatz zu Gottes rettendem Königtum deutlich; die grammatisch weniger festgelegten Möglichkeiten werden in einer Fußnote genannt.
- source_word: תָּשִׂים
  choice: setze
  rationale: שׂוּם bedeutet setzen, einsetzen oder bestimmen. „Setze einen König über uns“ bleibt nahe am hebräischen Bild und ist im Deutschen verständlich.
- source_word: הִתְיַצְּבוּ
  choice: tretet … an
  rationale: Die Hitpael-Form fordert dazu auf, sich förmlich vor Jahwe aufzustellen. „Tretet … an“ passt zum geordneten Auswahlverfahren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְשִׁבְטֵיכֶם
  choice: geordnet nach euren Stämmen
  rationale: Die Präposition לְ kennzeichnet hier die Gliederung der Versammlung. Der Zusatz „geordnet“ macht diese Funktion im Deutschen natürlich deutlich.
- source_word: וּלְאַלְפֵיכֶם
  choice: und euren Tausendschaften
  rationale: אֶלֶף kann außer der Zahl Tausend auch eine soziale, administrative oder militärische Untereinheit bezeichnen. „Tausendschaften“ hält den Bezug zum hebräischen Ausdruck sichtbar; eine Fußnote erläutert die mögliche Sachbedeutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft der Volksforderung mit כִּי
  choice: »Nein, setze einen König über uns!«
  alternative: »Setze vielmehr einen König über uns!« / »Einen König sollst du über uns setzen!«
  rationale: Im Kontext steht die Forderung im scharfen Gegensatz zu Gottes rettendem Handeln. „Nein“ gibt diese nachdrückliche Zurückweisung wieder, während die Fußnote darauf hinweist, dass כִּי selbst unterschiedlich gefasst werden kann.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer direkter Rede. „Ihr aber“ erhält den einleitenden Kontrast; „tretet … an“ vermittelt die förmliche Aufstellung. „Tausendschaften“ ist bewusst quellennah und wird wegen seiner heutigen Ungewöhnlichkeit erläutert.
