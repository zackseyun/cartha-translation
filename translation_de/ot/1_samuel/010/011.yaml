  text: וַ/יְהִ֗י כָּל יֽוֹדְע/וֹ֙ מֵ/אִתְּמ֣וֹל שִׁלְשׁ֔וֹם וַ/יִּרְא֕וּ וְ/הִנֵּ֥ה עִם נְבִאִ֖ים נִבָּ֑א וַ/יֹּ֨אמֶר הָ/עָ֜ם אִ֣ישׁ אֶל רֵעֵ֗/הוּ מַה זֶּה֙ הָיָ֣ה לְ/בֶן קִ֔ישׁ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: de
  text: 'Und es geschah: Alle, die ihn von früher kannten, sahen ihn, und siehe, er prophezeite zusammen mit den Propheten. Da sagten die Leute zueinander: „Was ist mit dem Sohn Kischs geschehen? Ist auch Saul unter den Propheten?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Wendung führt das folgende Ereignis als Fortgang der Erzählung ein; die knappe deutsche Form wahrt den biblisch-erzählenden Ton, ohne unnötig altertümlich zu wirken.
- source_word: כָל יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: Alle, die ihn schon früher gekannt hatten
  rationale: Die wörtliche Zeitangabe „seit gestern und vorgestern“ ist eine hebräische Wendung für frühere Bekanntschaft. „Schon früher“ gibt den idiomatischen Sinn und den Gegensatz zu Sauls überraschendem Verhalten natürlich wieder.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: sahen, wie er auf einmal
  rationale: וְהִנֵּה signalisiert hier eine überraschende, unmittelbar wahrgenommene Situation. „Auf einmal“ bewahrt diese Überraschungswirkung in natürlichem modernem Deutsch.
- source_word: עִם נְבִאִים
  choice: zusammen mit den Propheten
  rationale: „Zusammen mit“ gibt עִם als Begleitung wieder und lässt den Unterschied zum abschließenden בַּנְּבִיאִים, „unter den Propheten“, erkennen.
- source_word: נִבָּא
  choice: prophetisch redete
  rationale: Die Form bezeichnet eine beobachtbare prophetische Tätigkeit. Die Wiedergabe behauptet weder bloß ekstatisches Verhalten noch ein dauerhaftes Prophetenamt.
- source_word: הָעָם אִישׁ אֶל רֵעֵהוּ
  choice: Da sagte einer zum anderen
  rationale: Die deutsche distributive Redewendung gibt das wechselseitige Gespräch innerhalb der Leute idiomatisch wieder, ohne das generische Maskulinum des Hebräischen unnötig schwerfällig nachzubilden.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: Was ist mit dem Sohn des Kisch geschehen?
  rationale: Die Formulierung bewahrt das erstaunte Fragen nach Sauls verändertem Zustand, ohne durch „Was ist über ihn gekommen?“ eine zusätzliche Deutung einzutragen.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: Ist etwa auch Saul unter den Propheten?
  rationale: „Etwa auch“ bringt sowohl die Fragepartikel als auch גַּם und den überraschten Unterton zum Ausdruck. „Unter den Propheten“ entspricht der idiomatischen Bedeutung von בְּ.
theological_decisions:
- issue: Prophetische Tätigkeit und Prophetenamt
  choice: prophetisch redete
  alternative: in prophetische Verzückung geriet; als Prophet auftrat
  rationale: Der Text beschreibt Sauls Teilnahme an prophetischer Tätigkeit, legt aber nicht fest, dass er dauerhaft in ein Prophetenamt eingesetzt wurde. Die gewählte Form lässt diese Spannung bestehen.
- issue: Überraschung in der Schlussfrage
  choice: Ist etwa auch Saul unter den Propheten?
  alternative: Ist sogar Saul unter den Propheten?
  rationale: „Etwa auch“ bewahrt die offene Frage und den erstaunten Ton, ohne ausdrücklich festzulegen, ob die Sprecher Saul geringschätzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Die hebräische Überraschungsmarkierung wird idiomatisch durch „auf einmal“ wiedergegeben; die Schlussfrage behält ihren sprichwortartig zugespitzten Klang. Keine konfessionelle Deutung wird ergänzt.
