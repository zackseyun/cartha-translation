  text: וַ/יַּ֨עַן אִ֥ישׁ מִ/שָּׁ֛ם וַ/יֹּ֖אמֶר וּ/מִ֣י אֲבִי/הֶ֑ם עַל כֵּן֙ הָיְתָ֣ה לְ/מָשָׁ֔ל הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: de
  text: 'Da antwortete ein Mann von dort: „Und wer ist ihr Vater?[a]“ Daher wurde es zum Sprichwort: „Ist auch Saul unter den Propheten?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer verbreiteten Deutung: „Und wer ist sein Vater?“ Der masoretische Text lautet jedoch „ihr Vater“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: ענה im Wayyiqtol leitet hier eine Reaktion auf das zuvor Gesagte ein. „Da antwortete“ bewahrt den erzählenden Anschluss und klingt im Deutschen natürlich.
- source_word: אִישׁ מִשָּׁם
  choice: ein Mann von dort
  rationale: Die Wendung bezeichnet einen nicht namentlich genannten Mann aus dem betreffenden Ort; die direkte Wiedergabe erhält diese örtliche Zuordnung.
- source_word: וּמִי אֲבִיהֶם
  choice: Und wer ist ihr Vater?
  rationale: Der masoretische Text hat ein Suffix der 3. Person Plural. Die Übersetzung bewahrt diese Form und damit die naheliegende Bezugnahme auf die Prophetengruppe, ohne die Aussage auf Saul allein zu verengen.
- source_word: עַל כֵּן
  choice: Daher
  rationale: Die Wendung kennzeichnet die Folge beziehungsweise den Ursprung des anschließend genannten Sprichworts. „Daher“ ist prägnant und idiomatisch.
- source_word: הָיְתָה לְמָשָׁל
  choice: wurde es zum Sprichwort
  rationale: מָשָׁל bezeichnet hier einen sprichwörtlichen Ausspruch. Die Formulierung gibt sowohl das Entstehen als auch die feste sprichwörtliche Verwendung wieder.
- source_word: הֲגַם
  choice: Ist auch
  rationale: Die Verbindung aus Fragepartikel und גַּם drückt erstaunte Einbeziehung aus; „Ist auch Saul …?“ erhält diese rhetorische Wirkung.
- source_word: בַּנְּבִאִים
  choice: unter den Propheten
  rationale: Die Präposition bezeichnet hier die Zugehörigkeit beziehungsweise Einordnung in eine Gruppe. „Unter den Propheten“ ist im Deutschen idiomatisch und präzise.
theological_decisions:
- issue: Bezug von „ihr Vater“ in der rhetorischen Frage
  choice: Der masoretische Plural „ihr Vater“ bleibt im Haupttext erhalten und bezieht sich am ehesten auf die Propheten als Gruppe.
  alternative: „sein Vater“, mit ausschließlichem Bezug auf Saul.
  rationale: Die vokalisierte masoretische Form unterstützt eindeutig das Pluralsuffix. Dadurch bleibt die mögliche Aussage erhalten, dass prophetisches Auftreten nicht durch die väterliche Abstammung der Gruppe bestimmt wird. Die verbreitete Singularauffassung wird wegen ihrer Auslegungsgeschichte in einer Fußnote genannt, aber nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper narrativer Syntax. Die traditionelle und im Deutschen natürliche Wendung „unter den Propheten“ bleibt erhalten; die morphologische Mehrdeutigkeit in der Auslegung wird nicht stillschweigend geglättet.
