  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: de
  text: 'Dann nahm Samuel das Ölgefäß, goss das Öl auf Sauls Kopf und küsste ihn. Er sagte: »Hat Jahwe dich nicht zum Herrscher[a] über sein Erbteil gesalbt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch »Anführer« oder »Fürst«. Das hebräische Wort bezeichnet einen zum Regieren Eingesetzten und ist in seiner Bedeutung nicht völlig mit dem Titel »König« gleichzusetzen.
    reason: Lexikalische Alternative und Abgrenzung des hebräischen Amtstitels.
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: das Ölgefäß
  rationale: פַּךְ bezeichnet ein kleines Behältnis für Flüssigkeit. »Ölgefäß« gibt den Gegenstand verständlich wieder, ohne eine in Form oder Material nicht näher bestimmte Flasche oder einen Krug vorauszusetzen.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: goss das Öl auf Sauls Kopf
  rationale: יצק bedeutet »gießen«. Das ausdrücklich wiederholte »das Öl« und der Name »Saul« machen die pronominalen Bezüge im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: וַיִּשָּׁקֵהוּ
  choice: küsste ihn
  rationale: נשׁק bedeutet hier eindeutig »küssen«; die konkrete Geste der Einsetzungsszene bleibt unverändert erhalten.
- source_word: הֲלוֹא כִּי
  choice: Hat ... nicht
  rationale: Die Verbindung leitet eine rhetorische Frage mit bejahender Erwartung ein. Die deutsche Formulierung bewahrt diese Fragekraft.
- source_word: מְשָׁחֲךָ
  choice: dich ... gesalbt
  rationale: משׁח ist der übliche Ausdruck für die Salbung und trägt hier sowohl die rituelle als auch die politische Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt; »Jahwe« ist die geläufige deutsche Form.
- source_word: נַחֲלָתוֹ
  choice: sein Erbe
  rationale: נַחֲלָה bezeichnet Erbe beziehungsweise zugeteilten Besitz. »Sein Erbe« bewahrt die Aussage, dass Israel Jahwe zugehört.
- source_word: לְנָגִיד
  choice: zum Herrscher
  rationale: נָגִיד bezeichnet einen eingesetzten Leiter oder Regierenden. »Herrscher« drückt die Regierungsfunktion aus, ohne den Ausdruck vorschnell mit dem förmlichen Titel »König« gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt den persönlichen Bundesnamen.
- issue: Bedeutung von נָגִיד bei Sauls Einsetzung
  choice: Herrscher
  alternative: Anführer; Fürst; König
  rationale: Saul wird hier mit נָגִיד bezeichnet, nicht mit dem eindeutigen Königstitel מֶלֶךְ. »Herrscher« erhält die politische Leitungsfunktion und zugleich den Unterschied der Bezeichnungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Erzählsätze folgen dem hebräischen Ablauf, während explizite deutsche Bezugswörter Mehrdeutigkeit bei den Pronomen vermeiden. Der Fußnotenmarker steht unmittelbar bei »Herrscher«, auf das sich die Anmerkung bezieht.
