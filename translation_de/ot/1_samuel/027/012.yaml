base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: de
  text: 'Und Achisch vertraute David und sagte: »Er hat sich bei seinem Volk, den Israeliten, gründlich verhasst gemacht[a]. Darum wird er für immer mein Diener sein[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er hat sich bei seinem Volk, den Israeliten, gründlich einen üblen Geruch verschafft.“ Das hebräische Bild bedeutet, dass jemand verabscheut oder verhasst geworden ist.'
    reason: lexical_alternative
  - marker: b
    text: „Diener“ kann hier auch mit „Sklave“ wiedergegeben werden. Im Zusammenhang ist wahrscheinlich eine dauerhafte, einem Vasallen ähnliche Dienstbarkeit gegenüber Achisch gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן ... בְּדָוִד
  choice: Achisch vertraute David
  rationale: Das Hifil von אמן mit ב bezeichnet hier Vertrauen in eine Person. „Vertraute David“ gibt den zwischenmenschlichen Sinn natürlicher wieder als das stärker auf eine Aussage bezogene „glaubte David“.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der quotative Infinitiv leitet Achischs Äußerung beziehungsweise Überlegung ein. Die formnahe Wiedergabe lässt offen, ob er dies laut aussprach oder bei sich dachte.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: hat sich ... gründlich verhasst gemacht
  rationale: Infinitivus absolutus und finites Verb verstärken gemeinsam die Aussage. Die natürliche deutsche Wendung bewahrt die soziale Bedeutung des hebräischen Bildes; dessen wörtliche Ebene wird in der Fußnote genannt.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: bei seinem Volk in Israel
  rationale: „Bei seinem Volk“ bezeichnet Davids Ansehen innerhalb der Gemeinschaft; „in Israel“ bewahrt die zusätzliche nationale beziehungsweise örtliche Bestimmung.
- source_word: וְהָיָה לִי
  choice: Darum wird er ... mein ... sein
  rationale: Das Waw führt hier die von Achisch erwartete Folge aus Davids vermeintlicher Entfremdung von Israel ein.
- source_word: לְעֶבֶד
  choice: Diener
  rationale: עבד kann sowohl einen Diener als auch einen Sklaven bezeichnen. Im Zusammenhang steht vor allem Davids erwartete dauerhafte Abhängigkeit und Dienstbarkeit gegenüber Achisch im Vordergrund.
- source_word: עוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet hier eine unbegrenzt und dauerhaft gedachte Zukunft; „für immer“ gibt Achischs Erwartung idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Hauptfassung gibt das hebräische Geruchsbild idiomatisch wieder, während die Fußnote die konkrete Metapher bewahrt. Die ungewöhnliche Verbindung „sagte“ nach „vertraute“ bleibt bewusst relativ formnah, damit nicht entschieden wird, ob Achisch laut sprach oder innerlich urteilte.
