    rationale: Das Hebräische sagt »eines Tages« und drückt Davids Befürchtung aus, enthält aber kein ausdrückliches »am Ende trotz allem/doch noch«. Die Ergänzung sollte zur Wahrung der Quellenaussage entfallen.
  - severity: medium
    issue: »als in das Land der Philister zu fliehen – ja, zu fliehen«
    rationale: Die wörtlichkeitsnahe Wiederholung ist im Deutschen stilistisch künstlich und bildet die hebräische Verbindung aus Infinitivus absolutus und finitem Verb nicht sinnvoll ab. Eine natürliche finite Konstruktion ist im Haupttext vorzuziehen; die Betonung bleibt in der Fußnote erläutert.
  - severity: low
    issue: Formulierung der grammatischen Fußnote b
    rationale: '»mit finiter Verbform« benötigt idiomatisch den Artikel: »mit einer finiten Verbform«.'
