revisions:
- from: 'Da sagte David zu sich selbst: »Eines Tages werde ich doch noch durch Sauls Hand umkommen.[a] Für mich gibt es nichts Besseres, als in das Land der Philister zu fliehen – ja, zu fliehen.[b] Dann wird Saul es aufgeben, mich weiterhin im ganzen Gebiet Israels zu suchen,[c] und ich werde seiner Hand entkommen.«'
  to: 'Da sagte David zu sich selbst: »Eines Tages werde ich durch Sauls Hand umkommen.[a] Für mich gibt es nichts Besseres, als dass ich in das Land der Philister fliehe.[b] Dann wird Saul es aufgeben, mich weiterhin im ganzen Gebiet Israels zu suchen,[c] und ich werde seiner Hand entkommen.«'
  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext enthaltene Nuance »doch noch« und ersetzt die im Deutschen unnatürliche Verbwiederholung durch eine reguläre Konstruktion mit finitem Verb. Die durch Infinitivus absolutus bewirkte Betonung bleibt transparent in der dazugehörigen Fußnote vermerkt. Alle übrigen lexikalischen Entscheidungen und Anker bleiben erhalten.
  reviewer_model: gpt-5.6-terra
