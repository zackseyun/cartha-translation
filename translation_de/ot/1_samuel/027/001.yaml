source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: de
  text: 'Da sagte David zu sich selbst: »Eines Tages werde ich durch Sauls Hand umkommen.[a] Für mich gibt es nichts Besseres, als dass ich in das Land der Philister fliehe.[b] Dann wird Saul es aufgeben, mich weiterhin im ganzen Gebiet Israels zu suchen,[c] und ich werde seiner Hand entkommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eines Tages werde ich durch Sauls Hand weggerafft werden.« Das hebräische Verb kann allgemein »umkommen« oder bildhafter »weggerafft werden« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen eine verstärkende Verbindung: »fliehend werde ich fliehen« (Infinitivus absolutus mit einer finiten Verbform).'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Dann wird Saul die Hoffnung aufgeben, mich weiterhin im ganzen Gebiet Israels zu suchen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: zu sich selbst
  rationale: Die hebräische Wendung bezeichnet inneres Reden. »Zu sich selbst« gibt ihre kommunikative Funktion in natürlichem modernem Deutsch wieder.
- source_word: אֶסָּפֶה
  choice: umkommen
  rationale: Das Nifal von ספה kann hier das Weggerafftwerden bzw. Umkommen bezeichnen. »Umkommen« passt zur tödlichen Bedrohung durch Saul, ohne die Bildlichkeit stärker festzulegen als der Kontext.
- source_word: יוֹם אֶחָד
  choice: eines Tages
  rationale: Die idiomatische Zeitangabe bezeichnet einen unbestimmten künftigen Zeitpunkt.
- source_word: בְּיַד שָׁאוּל
  choice: durch Sauls Hand
  rationale: Die Wiedergabe bewahrt das hebräische Bild der Hand als Mittel und Machtbereich.
- source_word: אֵין לִי טוֹב כִּי
  choice: Für mich gibt es nichts Besseres, als
  rationale: Diese Formulierung erhält den vergleichenden und abwägenden Charakter der hebräischen Konstruktion.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: zu fliehen – ja, zu fliehen
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam den Fluchtgedanken. Die Wiederaufnahme mit »ja« bildet diese Betonung sichtbar ab, ohne eine zusätzliche Modalität einzuführen.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: in das Land der Philister
  rationale: Direkte und verständliche Wiedergabe der geografischen Bezeichnung.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל
  choice: Dann wird Saul es aufgeben
  rationale: יאשׁ bezeichnet das Aufgeben bzw. den Verlust der Hoffnung. Im Zusammenhang ist gemeint, dass Saul die weitere Suche einstellt.
- source_word: לְבַקְשֵׁנִי עוֹד
  choice: mich weiterhin ... zu suchen
  rationale: עוֹד bezeichnet hier die Fortsetzung der bereits andauernden Suche.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: im ganzen Gebiet Israels
  rationale: גְּבוּל meint hier das gesamte Territorium und nicht nur die Grenzlinie.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: und ich werde seiner Hand entkommen
  rationale: Die Formulierung erhält sowohl das Fluchtmotiv als auch das Bild der Hand für Sauls Gewalt und Zugriff.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die innerhebräische Redeform wird idiomatisch als »zu sich selbst« wiedergegeben. Das wiederholte »Hand«-Bild bleibt erhalten; die ungewöhnliche emphatische Verbverbindung beim Fliehen wird im Haupttext erkennbar gemacht und in einer Fußnote erläutert.
