source:
  edition: WLC
  text: וְ/אִ֨ישׁ וְ/אִשָּׁ֜ה לֹֽא יְחַיֶּ֣ה דָוִ֗ד לְ/הָבִ֥יא גַת֙ לֵ/אמֹ֔ר פֶּן יַגִּ֥דוּ עָלֵ֖י/נוּ לֵ/אמֹ֑ר כֹּֽה עָשָׂ֤ה דָוִד֙ וְ/כֹ֣ה מִשְׁפָּט֔/וֹ כָּל הַ֨/יָּמִ֔ים אֲשֶׁ֥ר יָשַׁ֖ב בִּ/שְׂדֵ֥ה פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: de
  text: 'David ließ weder Mann noch Frau am Leben, um sie nach Gat zu bringen, denn er dachte: »Sonst könnten sie über uns berichten und sagen: ›So hat David gehandelt, und das war seine Gewohnheit[a] während der ganzen Zeit, in der er im Gebiet der Philister lebte.[b]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und so war seine Vorgehensweise«; wörtlich kann מִשְׁפָּט hier auch eine feststehende Regel oder übliche Art des Handelns bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »im Feld der Philister«; gemeint ist das Gebiet oder Land der Philister.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: weder Mann noch Frau
  rationale: Das hebräische Singularpaar ist distributiv und bezeichnet ausnahmslos jeden möglichen Überlebenden; die deutsche Form bewahrt die eindringliche Ausdrucksweise.
- source_word: לֹא יְחַיֶּה
  choice: ließ … nicht am Leben
  rationale: Das Piel von חיה bedeutet hier, jemanden am Leben zu lassen bzw. zu verschonen. Diese Wendung ist im modernen Deutsch natürlich und präzise.
- source_word: לְהָבִיא גַת
  choice: um sie nach Gat zu bringen
  rationale: Der Infinitiv bezeichnet den Zweck. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch „sie“ verdeutlicht, ohne ein zusätzliches „lebend“ einzufügen.
- source_word: לֵאמֹר
  choice: Denn er dachte
  rationale: Wörtlich steht „indem er sagte“. Im Kontext führt die Formel Davids Beweggrund bzw. Überlegung ein; „Denn er dachte“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: פֶּן
  choice: Sonst könnten
  rationale: Die Wiedergabe bringt den vorbeugenden Sinn und die befürchtete Möglichkeit klar zum Ausdruck.
- source_word: יַגִּדוּ עָלֵינוּ
  choice: über uns berichten
  rationale: נגד im Hiphil bedeutet „mitteilen, berichten“; עַל bezeichnet hier den Gegenstand des Berichts. Die Formulierung bleibt neutral und legt nicht unnötig „anklagen“ nahe.
- source_word: כֹּה עָשָׂה דָוִד
  choice: So hat David gehandelt
  rationale: כֹּה hat demonstrativ-modalen Sinn. „So hat … gehandelt“ ist würdig und entspricht dem berichteten Inhalt.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: und so war es seine Gewohnheit
  rationale: מִשְׁפָּט kann unter anderem „Recht, Regel, Brauch, Verfahrensweise“ bedeuten. Hier bezeichnet es Davids wiederholte Vorgehensweise; die Fußnote bewahrt die lexikalische Spannweite.
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: während der ganzen Zeit, in der er … lebte
  rationale: Die idiomatische deutsche Zeitangabe gibt die Dauer seines Aufenthalts wieder, ohne das hebräische „alle Tage“ steif nachzuahmen.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: im Gebiet der Philister
  rationale: שָׂדֶה heißt wörtlich „Feld“, bezeichnet in dieser Verbindung aber das Land bzw. Territorium der Philister; die Fußnote nennt den Wortlaut.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die indirekte Einleitung „Denn er dachte“ verdeutlicht Davids im Hebräischen durch לֵאמֹר eingeführte Überlegung; die darin enthaltene direkte Rede bleibt erhalten. Die drastische Aussage wird weder abgeschwächt noch moralisch kommentiert.
