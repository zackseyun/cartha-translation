source:
  edition: WLC
  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: de
  text: David überfiel das Land und ließ weder Mann noch Frau am Leben[a]. Schafe, Rinder, Esel, Kamele und Kleidung nahm er mit. Dann kehrte er zurück und kam zu Achisch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ keinen Mann und keine Frau am Leben“.'
    reason: Lexikalisch-syntaktische Alternative für וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה; sie bewahrt die gleiche Aussage mit einer anderen deutschen Negationsstruktur.
lexical_decisions:
- source_word: וְהִכָּה
  choice: schlug
  rationale: Das Hifil von נכה bezeichnet hier das gewaltsame Schlagen beziehungsweise Niederschlagen bei einem Überfall. „Schlug“ bleibt knapp und gibt die Härte wieder, ohne den Vorgang auszuschmücken.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier das betroffene Gebiet beziehungsweise Land; „das Land“ ist die direkte und kontextgemäße Wiedergabe.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: ließ weder Mann noch Frau am Leben
  rationale: Das Hifil von חיה bedeutet „am Leben lassen/erhalten“. Die deutsche Formulierung ist natürlich und bewahrt die ausdrücklich genannte Paarung von Mann und Frau.
- source_word: וְלָקַח
  choice: nahm er mit
  rationale: לקח bedeutet grundsätzlich „nehmen“. „Nahm ... mit“ macht im Deutschen den Abtransport der Beute deutlich, ohne ein stärkeres Verb in den Ausgangstext hineinzulesen.
- source_word: צֹאן
  choice: Schafe
  rationale: צֹאן kann Kleinvieh oder eine Herde bezeichnen. In der konkreten Aufzählung ist „Schafe“ verständlich und passend.
- source_word: בָקָר
  choice: Rinder
  rationale: בָּקָר bezeichnet Rindvieh; „Rinder“ ist die übliche moderne deutsche Entsprechung.
- source_word: חֲמֹרִים
  choice: Esel
  rationale: Direkte moderne Entsprechung des hebräischen Tiernamens.
- source_word: גְמַלִּים
  choice: Kamele
  rationale: Direkte lexikalische Entsprechung.
- source_word: בְגָדִים
  choice: Kleidung
  rationale: בְּגָדִים bezeichnet Kleidungsstücke beziehungsweise Kleidung. „Kleidung“ passt als Sammelbegriff in die Beuteliste.
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: Dann kehrte er zurück und kam
  rationale: 'Beide aufeinanderfolgenden Verben werden bewahrt: David kehrte vom Überfall zurück und kam zu Achisch.'
- source_word: אָכִישׁ
  choice: Achisch
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert.
theological_decisions:
- issue: Darstellung der tödlichen Gewalt
  choice: Der Vers sagt ungeschönt, dass David weder Mann noch Frau am Leben ließ.
  alternative: Eine abschwächende Formulierung, die das Töten verdeckt, oder eine ausschmückende Formulierung, die über den hebräischen Wortlaut hinausgeht.
  rationale: Die moralisch schwierige Handlung wird weder beschönigt noch dramatisierend erweitert; die knappe Härte des Erzähltextes bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, während die hebräische Handlungsfolge erhalten bleibt. Die Gewalt wird sachlich und ohne Euphemismus wiedergegeben.
