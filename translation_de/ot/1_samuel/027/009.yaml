  naturalness: Mit Ausnahme von „schlug das Land“ ist der Text klar, sachlich und modernes Standarddeutsch. „überfiel das Land“ gibt die Handlung idiomatisch wieder, ohne sie über den hebräischen Befund hinaus auszumalen.
