base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: de
  text: 'Da sagte David zu Achisch: »Wenn ich nun Gunst in deinen Augen gefunden habe, dann soll man mir einen Ort in einer der Städte auf dem Land[a] geben, damit ich dort wohnen kann[b]. Warum sollte dein Diener bei dir in der Königsstadt[c] wohnen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in einer der Städte des Feldes«; gemeint sind Städte im ländlichen Gebiet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und ich werde dort wohnen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Stadt des Königreichs«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Gunst in deinen Augen gefunden habe
  rationale: Bewahrt die hebräische Höflichkeitsformel und ihr Bild; „Gunst“ ist im höfischen Zusammenhang natürlich und würdevoll.
- source_word: נָא
  choice: doch
  rationale: Die Partikel mildert die Bitte ab. „doch“ gibt diese höflich-bittende Nuance in der deutschen Wenn-Konstruktion idiomatisch wieder.
- source_word: יִתְּנוּ לִי
  choice: soll man mir … geben
  rationale: Der unbestimmte Plural bezeichnet nicht näher genannte Personen unter Achischs Verfügung; das unpersönliche „man“ bildet dies im Deutschen natürlich ab.
- source_word: מָקוֹם
  choice: einen Ort
  rationale: Entspricht dem allgemeinen Sinn von מקום, ohne bereits eine konkrete Siedlung oder Unterkunft hineinzulesen.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: in einer der Landstädte
  rationale: Gibt wörtlichnahe den Gegensatz zwischen den Städten des Landes beziehungsweise Umlands und der Königsstadt wieder. Eine Fußnote erläutert die konkrete Bildsprache.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: damit ich dort wohnen kann
  rationale: ישב bedeutet hier wohnen beziehungsweise sich niederlassen; „damit“ bringt den im Zusammenhang naheliegenden Zweck der Zuweisung zum Ausdruck.
- source_word: לָמָּה יֵשֵׁב
  choice: Warum sollte … wohnen?
  rationale: Bewahrt die rhetorische Frage und gibt die modale Aussage des Imperfekts natürlich wieder.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Es handelt sich um Davids ehrerbietige Selbstbezeichnung in höfischer Rede, nicht um eine Hervorhebung seines rechtlichen Status als Sklave.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: in der Königsstadt
  rationale: Gibt „Stadt des Königtums/Königreichs“ prägnant wieder, ohne mit „Hauptstadt“ mehr zu bestimmen, als der Ausdruck ausdrücklich sagt.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: „Bei dir“ drückt im Deutschen die räumliche und persönliche Nähe zum König in diesem Zusammenhang natürlicher aus als „mit dir“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Davids ehrerbietiger Ton gegenüber Achisch bleibt durch die Höflichkeitsformel und die Selbstbezeichnung „dein Diener“ erhalten. Die direkte Rede ist natürlich formuliert, während Fußnoten die wörtlicheren Alternativen und die Bildsprache sichern.
