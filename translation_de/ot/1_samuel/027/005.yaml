- from: 'Da sagte David zu Achisch: »Wenn ich doch Gunst in deinen Augen gefunden habe, soll man mir einen Ort in einer der Landstädte[a] geben, damit ich dort wohnen kann[b]. Warum sollte dein Diener bei dir in der Königsstadt[c] wohnen?«'
  to: 'Da sagte David zu Achisch: »Wenn ich nun Gunst in deinen Augen gefunden habe, dann soll man mir einen Ort in einer der Städte auf dem Land[a] geben, damit ich dort wohnen kann[b]. Warum sollte dein Diener bei dir in der Königsstadt[c] wohnen?«'
  rationale: Die Revision beseitigt die potenziell irreführende Wunschbedeutung von „doch“, verwendet für ערי השדה eine natürlichere und breitere moderne deutsche Formulierung und präzisiert die Fußnoten näher am hebräischen Wortlaut. Die Aussage, der höfische Registerton und die rhetorische Frage bleiben unverändert.
