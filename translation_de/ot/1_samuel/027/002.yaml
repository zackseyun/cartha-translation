  text: וַ/יָּ֣קָם דָּוִ֔ד וַ/יַּעֲבֹ֣ר ה֔וּא וְ/שֵׁשׁ מֵא֥וֹת אִ֖ישׁ אֲשֶׁ֣ר עִמּ֑/וֹ אֶל אָכִ֥ישׁ בֶּן מָע֖וֹךְ מֶ֥לֶךְ גַּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/002.yaml
  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: de
  text: Da machte David sich auf und zog mit den sechshundert Männern, die bei ihm waren, zu Achisch, dem Sohn Maochs, dem König von Gat, hinüber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich auf
  rationale: Das Qal-Wayyiqtol von קום leitet hier eine entschlossene Handlung ein. „Machte sich auf“ bewahrt die hebräische Erzählweise und klingt im Deutschen natürlich und würdevoll.
- source_word: וַיַּעֲבֹר
  choice: zog hinüber
  rationale: עבר bezeichnet ein Hinübergehen oder Überschreiten. „Zog hinüber“ wahrt die räumliche Richtungsangabe und passt zur Bewegung Davids mit seiner Truppe in philistäisches Gebiet.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen hebt David innerhalb der nachgestellten Fügung hervor. Die Wiedergabe „er und …“ erhält diese Struktur, ohne sie durch „er selbst“ unnötig zu verstärken.
- source_word: וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: und die sechshundert Männer
  rationale: Der bestimmte Artikel entspricht im Deutschen der bereits bekannten Gruppe von Männern, die David begleitet.
- source_word: אֲשֶׁר עִמּוֹ
  choice: die bei ihm waren
  rationale: Die direkte Wiedergabe erhält die relative Bestimmung der Männer und vermeidet das stärker deutende „die ihn begleiteten“.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet hier die Bewegung zu einer Person als Ziel.
- source_word: אָכִישׁ
  choice: Achisch
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶּן מָעוֹךְ
  choice: dem Sohn Maochs
  rationale: Die patronymische Konstruktion wird direkt wiedergegeben; die Apposition erhält im Deutschen den durch „zu“ verlangten Dativ.
- source_word: מֶלֶךְ גַּת
  choice: dem König von Gat
  rationale: Die Status-constructus-Verbindung bezeichnet Achischs Amt und Herrschaftsort. „König von Gat“ ist die natürliche deutsche Entsprechung.
