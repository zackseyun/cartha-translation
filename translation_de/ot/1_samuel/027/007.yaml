  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר יָשַׁ֥ב דָּוִ֖ד בִּ/שְׂדֵ֣ה פְלִשְׁתִּ֑ים יָמִ֖ים וְ/אַרְבָּעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/007.yaml
  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: de
  text: David lebte insgesamt ein Jahr und vier Monate[a] im Gebiet der Philister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Tage und vier Monate“; in dieser Zeitdauerformel bezeichnet „Tage“ offenbar ein Jahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: insgesamt
  rationale: Die hebräische Zusammenfassungsformel bezeichnet hier die gesamte Aufenthaltsdauer. „Insgesamt“ gibt sie im Deutschen natürlich und prägnant wieder.
- source_word: אֲשֶׁר יָשַׁב דָּוִד
  choice: David lebte
  rationale: יָשַׁב bezeichnet in diesem Zusammenhang ein längeres Wohnen beziehungsweise Sich-Aufhalten, nicht das wörtliche Sitzen.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: im Gebiet der Philister
  rationale: שָׂדֶה bedeutet wörtlich „Feld“, bezeichnet hier aber idiomatisch das Land oder Territorium der Philister.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: ein Jahr und vier Monate
  rationale: יָמִים kann in einer Zeitdauerformel idiomatisch „ein Jahr“ bedeuten. Die Fußnote bewahrt den wörtlichen Wortlaut.
