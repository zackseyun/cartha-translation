  yaml_path: translation/ot/1_samuel/027/004.yaml
  text: When it was reported to Saul that David had fled to Gath[b][a], he no longer continued to seek him.
translation:
  language: de
  text: Als Saul berichtet wurde, dass David nach Gat geflohen war, suchte er nicht länger nach ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräische Wendung: „Er fuhr nicht fort, weiter nach ihm zu suchen.“'
    reason: Die Wendung mit יסף und עוד hebt hervor, dass Saul die Suche nicht fortsetzte.
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: Als Saul berichtet wurde
  rationale: Die unpersönliche Passivform lässt offen, wer Saul die Nachricht überbrachte; die deutsche Formulierung bewahrt diese Offenheit.
- source_word: כִּי בָרַח דָּוִד גַּת
  choice: dass David nach Gat geflohen war
  rationale: כִּי leitet den Inhalt der Meldung ein. Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass Davids Flucht der Meldung vorausging; „nach“ macht die im Hebräischen ohne Präposition ausgedrückte Zielrichtung deutlich.
- source_word: וְלֹא יֹסֶף עוֹד
  choice: suchte er nicht länger
  rationale: Die Verbindung von יסף und עוד bezeichnet hier das Aufhören beziehungsweise Nichtfortsetzen einer Handlung. „nicht länger“ gibt diese Bedeutung in natürlichem Deutsch wieder.
- source_word: לְבַקְשׁוֹ
  choice: nach ihm suchen
  rationale: בקש bedeutet hier, David ausfindig zu machen. „nach ihm suchen“ bleibt näher am Grundwort und ist weniger deutend als „ihn verfolgen“.
theological_decisions: []
