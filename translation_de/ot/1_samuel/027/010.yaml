  text: וַ/יֹּ֣אמֶר אָכִ֔ישׁ אַל פְּשַׁטְתֶּ֖ם הַ/יּ֑וֹם וַ/יֹּ֣אמֶר דָּוִ֗ד עַל נֶ֤גֶב יְהוּדָה֙ וְ/עַל נֶ֣גֶב הַ/יַּרְחְמְאֵלִ֔י וְ/אֶל נֶ֖גֶב הַ/קֵּינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: de
  text: 'Da sagte Achisch[a]: »Wo seid ihr heute eingefallen?« David antwortete: »In den Negev[b] von Juda, in den Negev der Jerachmeëliter und in den Negev der Keniter.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte hebräische Wortlaut ist schwierig und lautet wörtlich etwa: »Seid ihr heute nicht eingefallen?« Im Zusammenhang und nach alten Übersetzungen wird dies als Frage nach dem Ziel des Beutezugs verstanden: »Wo seid ihr heute eingefallen?«'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Südland« beziehungsweise »Süden« von Juda, der Jerachmeëliter und der Keniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: Wo seid ihr heute eingefallen?
  rationale: Der überlieferte Konsonantentext enthält אַל, gewöhnlich »nicht«, doch die Frage ist im Zusammenhang als Erkundigung nach dem Ziel des Beutezugs zu verstehen; so wird sie auch von alten Übersetzungen aufgefasst. פשט bezeichnet hier das Einfallen zu einem Plünderungszug. Die deutsche Formulierung ist idiomatisch und bewahrt den militärischen Sinn.
- source_word: נֶגֶב
  choice: Negev
  rationale: Das Wort kann »Süden«, »Südland« oder die aride südliche Landschaft Negev bezeichnen. In Verbindung mit Juda und den genannten Volksgruppen bleibt durch »Negev« der geografische Bezug erhalten; die mögliche Bedeutungsalternative wird in einer Fußnote genannt.
- source_word: עַל / אֶל
  choice: in
  rationale: Die Präpositionen bezeichnen in Davids Antwort die angeblichen Zielgebiete seiner Beutezüge. Deutsches »in« passt natürlich zu »einfallen« und vermeidet die unidiomatische Wendung »gegen den Negev«.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Im Deutschen gebräuchliche Form des Stammes- und Gebietsnamens.
- source_word: הַיַּרְחְמְאֵלִי
  choice: die Jerachmeëliter
  rationale: Das Gentiliz bezeichnet die Angehörigen der von Jerachmeël hergeleiteten Sippe; »Jerachmeëliter« bildet dies im Deutschen transparent ab.
- source_word: הַקֵּינִי
  choice: die Keniter
  rationale: Das Gentiliz bezeichnet das Volk beziehungsweise die Sippe der Keniter; dies ist die übliche deutsche Namensform.
- source_word: וַיֹּאמֶר
  choice: sagte / antwortete
  rationale: Beim ersten Sprecher wird das allgemeine Verb formal mit »sagte« wiedergegeben; bei David macht »antwortete« die Gesprächsfunktion im natürlichen Deutschen deutlich, ohne den Inhalt zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Einfallen« vermittelt den militärischen Beutezug prägnant. Die Eigennamen folgen gebräuchlichen deutschen Bibelformen. Die genuine Schwierigkeit des hebräischen Fragesatzes sowie die Bedeutungsbreite von נֶגֶב werden in den Fußnoten offengelegt.
