  text: וַ/יִּתֶּן ל֥/וֹ אָכִ֛ישׁ בַּ/יּ֥וֹם הַ/ה֖וּא אֶת צִֽקְלָ֑ג לָ/כֵ֞ן הָיְתָ֤ה צִֽקְלַג֙ לְ/מַלְכֵ֣י יְהוּדָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: de
  text: Da gab Achisch ihm an jenem Tag Ziklag. Deshalb gehört Ziklag den Königen von Juda bis auf den heutigen Tag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: bis in die Gegenwart des Erzählers.'
    reason: historical_perspective
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: gab
  rationale: נתן bedeutet in diesem Erzählzusammenhang schlicht „geben“; „überließ“ wäre als kontextuelle Nuance möglich, ist aber weniger unmittelbar.
- source_word: לּוֹ
  choice: ihm
  rationale: Das maskuline Singularsuffix verweist im unmittelbaren Kontext auf David.
- source_word: אָכִישׁ
  choice: Achisch
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Zeitangabe wird natürlich und mit ihrer bestimmten Rückverweisung wiedergegeben.
- source_word: אֶת צִקְלָג
  choice: Ziklag
  rationale: אֶת kennzeichnet das direkte Objekt und bleibt unübersetzt; der Ortsname wird in der üblichen deutschen Form wiedergegeben.
- source_word: לָכֵן
  choice: Deshalb
  rationale: Das Wort bezeichnet die aus Achischs Gabe folgende Konsequenz.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: gehört ... den Königen von Juda
  rationale: Die Verbindung von היה mit ל drückt hier einen fortbestehenden Besitz- oder Zuordnungsstatus aus. Das deutsche Präsens mit „bis auf den heutigen Tag“ gibt diese Fortdauer natürlich wieder.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Die feste Wendung bezeichnet die Fortdauer bis in die Gegenwart des Erzählers.
theological_decisions:
- issue: Historische Perspektive der Wendungen „bis auf den heutigen Tag“ und „Könige von Juda“
  choice: Die rückblickende Notiz des Erzählers bleibt ohne Erklärung im Haupttext stehen.
  alternative: Ausdrücklich erläutern, dass die Aussage eine spätere judäische Königsperspektive widerspiegelt.
  rationale: Der hebräische Text nennt lediglich den fortbestehenden Sachverhalt. Eine bestimmte Theorie zu Verfasserschaft oder Redaktion sollte nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Achisch“ und „Ziklag“ folgen den etablierten deutschen Namensformen. Die Besitzkonstruktion wird idiomatisch wiedergegeben, ohne die rückblickende historische Notiz auszudeuten.
