revisions:
- from: David zog mit seinen Männern hinauf und unternahm Raubzüge gegen die Geschuriter, die Girsiter[a] und die Amalekiter. Diese Völker bewohnten das Land seit alters her, bis dorthin, wo man nach Schur kommt, und bis zum Land Ägypten.[b]
  to: David zog mit seinen Männern hinauf und unternahm Raubzüge gegen die Geschuriter, die Girziter[a] und die Amalekiter; denn diese Völker bewohnten das Land seit alters her, auf dem Weg nach Schur bis zum Land Ägypten.[b]
  rationale: Die Revision beseitigt die im Deutschen missverständliche doppelte „bis“-Konstruktion und gibt die hebräische geografische Formel natürlicher wieder. Die räumliche und syntaktische Restunsicherheit bleibt durch die Fußnote kenntlich. Die Aussage über die ansässigen Volksgruppen und die militärischen Raubzüge wird nicht verändert.
