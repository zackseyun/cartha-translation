base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: de
  text: David zog mit seinen Männern hinauf und unternahm Raubzüge gegen die Geschuriter, die Girziter[a] und die Amalekiter; denn diese Völker bewohnten das Land seit alters her, auf dem Weg nach Schur bis zum Land Ägypten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Volksname ist textlich und in seiner Wiedergabe unsicher; andere Wiedergaben sind etwa „Gesriter“ oder „Gersiter“.
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Grenzangabe ist syntaktisch schwierig. Die Wendung kann auch wiedergegeben werden: „wenn man nach Schur kommt, bis zum Land Ägypten“.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog ... hinauf
  rationale: Bewahrt die gewöhnliche narrative Bedeutung von עלה, auch wenn im Deutschen der Zielpunkt nicht ausdrücklich genannt wird.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: unternahm Raubzüge gegen
  rationale: פשט bezeichnet hier militärische Plünderungszüge; „gegen“ gibt die feindliche Zielrichtung von אֶל im Deutschen idiomatisch wieder. Das Verb steht im Hebräischen im Plural, doch die deutsche Konstruktion mit dem singularischen Subjekt „David“ und der Begleitung „mit seinen Männern“ verlangt den Singular.
- source_word: הַגְּשׁוּרִי
  choice: die Geschuriter
  rationale: Geläufige deutsche Bildung des Volksnamens zu Geschur.
- source_word: הגרזי
  choice: die Girsiter
  rationale: Eine lautnahe Wiedergabe des im vorliegenden Konsonantentext bezeugten Volksnamens; wegen textlicher und traditioneller Varianten wird eine Fußnote gesetzt.
- source_word: הָעֲמָלֵקִי
  choice: die Amalekiter
  rationale: Im Deutschen geläufiger Volksname.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: Diese Völker bewohnten das Land
  rationale: Gibt das demonstrative הֵנָּה ausdrücklich wieder. „Völker“ macht den kollektiv verstandenen Bezug der auffälligen femininen Pluralformen im Deutschen verständlich.
- source_word: מֵעוֹלָם
  choice: seit alters her
  rationale: Bezeichnet hier eine lange Vergangenheit beziehungsweise alteingesessene Bevölkerung, nicht metaphysische Ewigkeit.
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: bis dorthin, wo man nach Schur kommt
  rationale: Die konventionelle geografische Wendung mit der 2. Person Singular wird unpersönlich und natürlich deutsch wiedergegeben, ohne einen konkreten Adressaten vorauszusetzen.
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: und bis zum Land Ägypten
  rationale: Bewahrt die Angabe der räumlichen Ausdehnung; die genaue syntaktische Beziehung zur vorherigen Grenzangabe bleibt unsicher und wird angemerkt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Raubzüge“ bildet den militärischen und plündernden Charakter ab. Die zweimalige Formulierung mit „bis“ erhält die Grenzstruktur, während Fußnote [b] die syntaktische Unsicherheit offenlegt.
