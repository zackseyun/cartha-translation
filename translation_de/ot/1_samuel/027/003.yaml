source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ דָּוִ֨ד עִם אָכִ֥ישׁ בְּ/גַ֛ת ה֥וּא וַ/אֲנָשָׁ֖י/ו אִ֣ישׁ וּ/בֵית֑/וֹ דָּוִד֙ וּ/שְׁתֵּ֣י נָשָׁ֔י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית וַ/אֲבִיגַ֥יִל אֵֽשֶׁת נָבָ֖ל הַֽ/כַּרְמְלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: de
  text: So blieb David bei Achisch in Gat[a], er und seine Männer, jeder mit seinem Hausstand[b] – David mit seinen beiden Frauen Ahinoam aus Jesreel und Abigajil, der Frau Nabals aus Karmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So wohnte David bei Achisch in Gat.“ Das hebräische Verb kann sowohl ein Wohnen als auch ein zeitweiliges Bleiben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Mann und sein Haus“; eine verteilende Ausdrucksweise für jeden Mann samt den Menschen, die zu seinem Haus gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann sitzen, wohnen oder sich für eine gewisse Zeit aufhalten bedeuten. Im Erzählzusammenhang bezeichnet „blieb“ Davids zeitweiligen Aufenthalt bei Achisch, ohne eine dauerhafte Ansiedlung vorauszusetzen.
- source_word: עִם אָכִישׁ בְּגַת
  choice: bei Achisch in Gat
  rationale: עִם bezeichnet Gemeinschaft bzw. Aufenthalt bei jemandem; בְּ mit dem Stadtnamen gibt den Ort an. Die deutsche Fügung ist natürlich und hält beide Beziehungen auseinander.
- source_word: הוּא וַאֲנָשָׁיו
  choice: er und seine Männer
  rationale: אֲנָשָׁיו bedeutet wörtlich „seine Männer“. Im Kontext sind bewaffnete Gefolgsleute gemeint, doch die allgemeinere Wiedergabe bewahrt den Wortlaut.
- source_word: אִישׁ וּבֵיתוֹ
  choice: jeder mit seinem Hausstand
  rationale: 'אִישׁ wird hier distributiv gebraucht: „jeder“. בַּיִת meint in diesem Zusammenhang nicht das Gebäude, sondern die zum jeweiligen Mann gehörende Hausgemeinschaft.'
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: mit seinen beiden Frauen
  rationale: Die Wendung erläutert Davids eigenen Hausstand. „Mit“ macht den Anschluss im Deutschen klar; „Frauen“ ist die natürliche Wiedergabe für Ehefrauen in diesem eindeutig bestimmten Zusammenhang.
- source_word: הַיִּזְרְעֵאלִית
  choice: aus Jesreel
  rationale: Das feminine Herkunftsadjektiv kennzeichnet Ahinoam als Frau aus Jesreel. Die Umschreibung ist im modernen Deutsch natürlicher als eine substantivierte Herkunftsbezeichnung.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: der Frau Nabals aus Karmel
  rationale: אֵשֶׁת נָבָל bedeutet „Frau Nabals“. Das feminine הַכַּרְמְלִית bezieht sich grammatisch auf Abigajil und bezeichnet ihre Herkunft aus Karmel; die deutsche Stellung wahrt diesen Bezug.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Hausstand“ bewahrt den sozialen Sinn von בַּיִת, ohne ein Gebäude nahezulegen. Die Herkunftsbezeichnungen werden zur besseren Verständlichkeit mit „aus Jesreel“ und „aus Karmel“ wiedergegeben.
