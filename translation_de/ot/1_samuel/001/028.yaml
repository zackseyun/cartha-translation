  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: de
  text: Auch ich habe ihn Jahwe anvertraut[a]; solange er lebt, ist er Jahwe anvertraut.« Und er[b] warf sich dort vor Jahwe nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht beide Male derselbe Wortstamm wie zuvor beim Erbitten des Kindes. Daher kann die Wendung auch mit »habe ich ihn Jahwe geliehen« und »er ist Jahwe geliehen« wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Und sie warfen sich dort vor Jahwe nieder.« Das Hebräische nennt das Subjekt nicht ausdrücklich; die Verbform beziehungsweise ihre Lesung wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: habe ich ihn … überlassen
  rationale: Das Hifil von שׁאל bezeichnet hier Hannas Übergabe Samuels an Jahwe. »Überlassen« ist im Deutschen natürlicher als »verliehen« und lässt sich im folgenden Passiv wiederholen; das Wortspiel mit Hannas Bitten kann jedoch nur in einer Fußnote kenntlich gemacht werden.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition bezeichnet den Empfänger beziehungsweise den, dem Samuel anvertraut wird; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: Solange er lebt
  rationale: Natürliche deutsche Wiedergabe der auf Samuels gesamte Lebenszeit bezogenen hebräischen Wendung.
- source_word: שָׁאוּל
  choice: ist … überlassen
  rationale: Die Wiederholung von שׁאל wird durch dasselbe deutsche Verb wie im ersten Satz sichtbar gemacht. Im Zusammenhang drückt das Wort die dauerhafte Hingabe an Jahwe aus.
- source_word: וַיִּשְׁתַּחוּ
  choice: warf sich … nieder
  rationale: Das Verb bezeichnet ein körperliches Niederwerfen, hier als Akt der Verehrung vor Jahwe. Die konkrete Formulierung bewahrt sowohl die körperliche als auch die kultische Dimension.
- source_word: שָׁם
  choice: dort
  rationale: Direkte und natürliche Wiedergabe des Ortsadverbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Bundesname erkennbar bleibt.
- issue: Subjekt von וַיִּשְׁתַּחוּ
  choice: er warf sich dort vor Jahwe nieder
  alternative: sie warfen sich dort vor Jahwe nieder
  rationale: Die masoretische Verbform ist Singular, doch ihr konkreter Bezug ist im Zusammenhang nicht ausdrücklich genannt; außerdem bezeugt die Übersetzungstradition auch ein plurales Verständnis. Daher steht die Alternative in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Überlassen« hält die zweifache Verwendung desselben hebräischen Wortstamms im Haupttext zusammen, ohne im Deutschen den möglicherweise missverständlichen Eindruck eines zeitlich begrenzten Leihgeschäfts zu erwecken. Die Fußnote bewahrt das Wortspiel mit Hannas Bitte.
