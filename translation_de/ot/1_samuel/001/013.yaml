base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: de
  text: Hanna sprach in ihrem Herzen; nur ihre Lippen bewegten sich[a], doch ihre Stimme war nicht zu hören. Da hielt Eli sie für betrunken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sprach bei sich selbst“ / „betete im Stillen“. Wörtlich: „sprach in ihrem Herzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: redete in ihrem Herzen
  rationale: Die Wendung bezeichnet inneres, nicht hörbares Reden. Die Formulierung bewahrt das hebräische Bild und bleibt im Deutschen verständlich; der Kontext macht deutlich, dass Hanna betete.
- source_word: רַק
  choice: nur
  rationale: 'רַק schränkt ein: Sichtbar war lediglich die Bewegung ihrer Lippen.'
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: ihre Lippen bewegten sich
  rationale: נוּעַ bezeichnet hier die sichtbare Bewegung der Lippen und steht im Gegensatz zur unhörbaren Stimme.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: doch ihre Stimme war nicht zu hören
  rationale: Der Nifal von שׁמע ist hier passiv zu verstehen. „Doch“ gibt den im Zusammenhang liegenden Gegensatz zur Lippenbewegung natürlich wieder.
- source_word: וַיַּחְשְׁבֶהָ
  choice: hielt … sie für
  rationale: חשב mit Objektsuffix und prädikativer Ergänzung bedeutet, jemanden für etwas zu halten.
- source_word: לְשִׁכֹּרָה
  choice: betrunken
  rationale: Das feminine Adjektiv bezeichnet eine betrunkene beziehungsweise berauschte Frau; nach „für“ ist „betrunken“ idiomatisches Deutsch.
- source_word: וְחַנָּה הִיא
  choice: Hanna
  rationale: Das Pronomen הִיא hebt Hanna als Thema hervor. Im Deutschen genügt hier der Name; ein zusätzliches „nun“ würde ein nicht ausdrücklich vorhandenes Zeit- oder Gliederungssignal nahelegen.
