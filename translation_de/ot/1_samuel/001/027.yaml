lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: Um diesen Jungen
  rationale: אֶל bezeichnet bei התפלל hier den Gegenstand, um den Hanna betete. „Um diesen Jungen“ ist im Deutschen natürlich und bewahrt den Bezug auf das männliche Kind.
- source_word: הִתְפַּלָּלְתִּי
  choice: habe ich gebetet
  rationale: Das Perfekt entspricht natürlicher deutscher direkter Rede und stellt das frühere Gebet in Beziehung zur gegenwärtigen Erfüllung.
- source_word: וַיִּתֵּן יְהוָה לִי
  choice: und Jahwe hat mir … erfüllt
  rationale: Wörtlich steht „und Jahwe gab mir“. Zusammen mit שְׁאֵלָתִי ist „hat mir meine Bitte erfüllt“ idiomatisches Deutsch und bringt Gabe und gegenwärtiges Ergebnis zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שְׁאֵלָתִי
  choice: meine Bitte
  rationale: Das Substantiv bezeichnet Hannas Bitte beziehungsweise Gesuch; das Possessivsuffix wird mit „meine“ ausdrücklich wiedergegeben.
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: die ich an ihn gerichtet habe
  rationale: Die Wendung gibt den Inhalt der Bitte und ihre Ausrichtung auf Jahwe in natürlichem Deutsch wieder; eine formalere, stärker wurzelgleiche Wiedergabe wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Hannas Gebet und der Gabe des Kindes
  choice: Um diesen Jungen habe ich gebetet
  alternative: Wegen dieses Jungen habe ich gebetet
  rationale: Die Präposition kann das Anliegen beziehungsweise den Gegenstand des Gebets markieren. „Um“ lässt offen, ob der Akzent auf dem Erbitten oder allgemeiner auf dem Beten in Bezug auf das Kind liegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Junge“ wahrt die männliche Bezeichnung נַעַר; „Bitte erfüllt“ vermeidet die im Deutschen unnatürliche Verbindung „eine Bitte geben“. Die Fußnoten dokumentieren die Präpositionsnuance und die wörtlichere Wortfolge.
