  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: de
  text: Um diesen Jungen habe ich gebetet[a], und Jahwe hat mir meine Bitte gewährt, die ich von ihm erbeten habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wegen dieses Jungen habe ich gebetet.“'
