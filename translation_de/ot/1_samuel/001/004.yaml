  yaml_path: translation/ot/1_samuel/001/004.yaml
  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: de
  text: Wenn der Tag kam[a], an dem Elkana Opfer darbrachte, gab er seiner Frau Peninna und all ihren Söhnen und Töchtern Portionen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und es geschah an dem Tag“. Im Zusammenhang ist wahrscheinlich der jeweils wiederkehrende Tag des Opfermahls gemeint.'
    reason: Die hebräische Zeitformel kann eine einzelne Erzählzeit markieren; der weitere Zusammenhang legt zugleich eine wiederkehrende Handlung nahe.
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: wenn der Tag kam
  rationale: Die hebräische Erzählungsformel setzt den zeitlichen Rahmen. Die deutsche Wendung ist natürlich und lässt im Zusammenhang die wiederkehrende Handlung erkennen.
- source_word: וַיִּזְבַּח
  choice: brachte ... das Schlachtopfer dar
  rationale: זבח bezeichnet das Schlachten beziehungsweise Darbringen eines Opfers. „Das Schlachtopfer darbringen“ gibt den kultischen Sinn klar wieder, ohne den Vorgang unnötig auszudeuten.
- source_word: וְנָתַן
  choice: gab
  rationale: Die Form beschreibt in der Erzählfolge eine vergangene Handlung; der weitere Zusammenhang zeigt, dass sie sich regelmäßig wiederholte. Der einfache deutsche Präteritumstil bewahrt die grammatische Nähe, ohne die Gewohnheitsbedeutung auszuschließen.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: seiner Frau Peninna
  rationale: Diese Wortstellung klingt im modernen Deutsch natürlicher als „Peninna, seiner Frau“, ohne den Inhalt zu verändern.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: und allen ihren Söhnen und Töchtern
  rationale: Die Übersetzung bewahrt die ausdrückliche Nennung sowohl der Söhne als auch der Töchter.
- source_word: מָנוֹת
  choice: Anteile
  rationale: מָנוֹת bezeichnet zugeteilte Portionen beziehungsweise Anteile am Opfermahl. „Anteile“ hebt die Zuteilung hervor und passt in den kultischen Zusammenhang.
