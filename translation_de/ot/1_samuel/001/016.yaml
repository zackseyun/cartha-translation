  text: אַל תִּתֵּן֙ אֶת אֲמָ֣תְ/ךָ֔ לִ/פְנֵ֖י בַּת בְּלִיָּ֑עַל כִּֽי מֵ/רֹ֥ב שִׂיחִ֛/י וְ/כַעְסִ֖/י דִּבַּ֥רְתִּי עַד הֵֽנָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: de
  text: Halte deine Dienerin nicht für eine verwerfliche Frau[a]; denn aus der Fülle meiner Klage und meines Kummers habe ich bis jetzt geredet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »eine Tochter der Nichtswürdigkeit«; eine idiomatische Bezeichnung für eine sittlich verwerfliche oder ehrlose Frau.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Denn wegen meiner vielen Klage und meines Kummers habe ich bis jetzt geredet.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: Halte ... nicht für
  rationale: Die Verbindung ist idiomatisch im Sinn von »jemanden als etwas ansehen/einstufen« zu verstehen; die deutsche Wendung ist natürlich und wahrt den Sinn.
- source_word: אֲמָתְךָ
  choice: deine Dienerin
  rationale: Die feminine Selbstbezeichnung drückt Hannas demütige Anrede aus und wird im Deutschen ausdrücklich bewahrt.
- source_word: בַּת בְּלִיָּעַל
  choice: eine gewissenlose Frau
  rationale: Wörtlich steht »Tochter der Nichtswürdigkeit«. Gemeint ist idiomatisch eine sittlich verwerfliche oder ehrlose Frau; »gewissenlos« gibt die moralische Wertung wieder, ohne eine Aussage über ihren bloßen Nutzen oder Wert als Person nahezulegen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet Hannas Begründung für ihre Bitte ein.
- source_word: מֵרֹב שִׂיחִי וְכַעְסִי
  choice: aus großem Kummer und großer Verzweiflung
  rationale: שִׂיח kann Klage, sorgende Zwiesprache oder bekümmertes Sinnen bezeichnen; כעס meint hier innere Bedrängnis, Kränkung oder Verdruss. Die Paarung wird kontextgerecht als tiefe seelische Not wiedergegeben.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: habe ich bis jetzt geredet
  rationale: Das Perfekt mit der Zeitangabe beschreibt Hannas Reden beziehungsweise Beten bis zu diesem Augenblick.
theological_decisions:
- issue: Bedeutung von בְּלִיָּעַל
  choice: 'als moralische Charakterisierung: »gewissenlose Frau«'
  alternative: 'als Eigenname: »Tochter Belials«'
  rationale: Im althebräischen Kontext ist der Ausdruck ein Idiom für Verworfenheit beziehungsweise Nichtsnutzigkeit und noch kein eindeutiger Eigenname für eine übernatürliche Gestalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Hannas demütige Selbstbezeichnung bleibt erhalten. Die schwer eindeutig festzulegende Wortverbindung für ihre innere Not wird im Haupttext verständlich wiedergegeben und in der Fußnote mit einer näher am hebräischen Ausdruck liegenden Alternative offengehalten.
