    issue: Die Wiedergabe von בַּת־בְּלִיַּעַל als »gewissenlose Frau« ist zu eng.
    rationale: Das hebräische Idiom bezeichnet eine verwerfliche, niederträchtige oder ehrlose Person; es spezifiziert nicht gerade Gewissenlosigkeit.
  - severity: medium
    issue: »Aus großem Kummer und großer Verzweiflung« verwischt die lexikalische Differenzierung von שִׂיחִי und וְכַעְסִי.
    rationale: שִׂיחִי bezeichnet hier Hannas Klage bzw. bekümmertes Reden; כַּעְסִי ihre Bedrängnis, Verstimmung oder ihren Kummer. »Verzweiflung« ist stärker und nicht ausdrücklich angelegt.
  - severity: low
    issue: Die Fußnotenalternative zu b enthält »so lange«, obwohl עַד הֵנָּה primär den Zeitpunkt »bis jetzt/bis hierher« markiert.
    rationale: Die Formulierung kann zwar kontextuell nahe liegen, fügt aber eine Dauerakzentuierung hinzu, die besser vermieden wird.
