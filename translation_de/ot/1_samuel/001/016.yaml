  to: Halte deine Dienerin nicht für eine verwerfliche Frau[a]; denn aus der Fülle meiner Klage und meines Kummers habe ich bis jetzt geredet.[b]
  rationale: Die Revision bewahrt die idiomatische Bedeutung der hebräischen Wendung für eine moralisch verwerfliche Frau, ohne sie auf einen bestimmten Charakterzug zu verengen. Sie stellt zugleich die »Klage« und die intensive innere Bedrängnis der Sprecherin deutlicher wieder her und lässt die Nuance der Wendung מֵרֹב in einer Fußnote offen.
