  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: de
  text: 'Und so geschah es Jahr für Jahr[a]: Sooft sie zum Haus Jahwes[b] hinaufging, kränkte Peninna sie, und sie weinte und aß nichts.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und so pflegte er es Jahr für Jahr zu tun.“ Das hebräische Verb steht im maskulinen Singular und kann sich auf Elkana beziehen; die Wendung kann jedoch auch den wiederkehrenden Ablauf insgesamt zusammenfassen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „im Haus Jahwes“. Die hebräische Präposition bedeutet wörtlich „in/bei“; mit „hinaufgehen“ kann sie hier das Ziel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: Und so geschah es
  rationale: Das maskuline Singularverb bedeutet wörtlich „er tat/handelte“, kann hier jedoch idiomatisch die regelmäßig wiederkehrende Situation zusammenfassen. Die alternative personale Deutung wird in Fußnote [a] bewahrt.
- source_word: שָׁנָה בְשָׁנָה
  choice: Jahr für Jahr
  rationale: Die distributive Wendung bezeichnet ein alljährlich wiederkehrendes Geschehen; „Jahr für Jahr“ ist im Deutschen natürlich und erhält den iterativen Nachdruck.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: Sooft sie … hinaufging
  rationale: מִדֵּי mit dem Infinitiv bezeichnet wiederholte Anlässe. Das feminine Suffix verweist auf Hanna.
- source_word: בְּבֵית יְהוָה
  choice: zum Haus Jahwes
  rationale: Obwohl בְּ wörtlich „in/an“ bedeutet, wird es beim Hinaufgehen kontextgemäß als Zielangabe verstanden. Die wörtlichere örtliche Lesart bleibt in Fußnote [b] sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: כֵּן תַּכְעִסֶנָּה
  choice: reizte Peninna sie
  rationale: Der Hifil von כעס bezeichnet hier feindseliges Reizen oder Kränken. Das zweite כֵּן nimmt die wiederkehrende Weise auf; dieser Bezug ist im deutschen Gesamtgefüge bereits durch „Und so“ und „Sooft“ ausgedrückt. Peninna wird zur eindeutigen Zuordnung aus dem unmittelbaren Kontext namentlich aufgenommen.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: sodass sie weinte und nichts aß
  rationale: Die Verbformen schildern im Rahmen der Jahreswiederholung die regelmäßig eintretende Folge. „Sodass“ macht den im Zusammenhang klaren Folgezusammenhang natürlich verständlich; „nichts aß“ entspricht idiomatischem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als Eigenname bewahrt diese Besonderheit, ohne sie durch einen Titel zu ersetzen.
- issue: Subjekt von יַעֲשֶׂה
  choice: 'unpersönliche Zusammenfassung: „geschah es“'
  alternative: „er tat es“, bezogen auf Elkana
  rationale: Die maskuline Singularform lässt Elkana als implizites Subjekt zu, doch der Satz fasst zugleich den gesamten jährlich wiederkehrenden Ablauf zusammen. Die Hauptfassung erhält diesen idiomatischen Sinn; die personale Lesart wird nicht ausgeschlossen, sondern in Fußnote [a] genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Vergangenheit wird durch „Jahr für Jahr“ und „Sooft“ klar markiert; schwerfällige Wiederholungen von „würde“ werden vermieden. Alle Fußnotenmarker stehen an der jeweils sachlich passenden Textstelle.
