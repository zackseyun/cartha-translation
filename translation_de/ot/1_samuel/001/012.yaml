  text: וְ/הָיָה֙ כִּ֣י הִרְבְּתָ֔ה לְ/הִתְפַּלֵּ֖ל לִ/פְנֵ֣י יְהוָ֑ה וְ/עֵלִ֖י שֹׁמֵ֥ר אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: de
  text: Und während sie lange vor Jahwe betete, beobachtete Eli ihren Mund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und es geschah, als sie lange vor Jahwe betete: Eli beobachtete ihren Mund.“'
    reason: Die Fußnote bewahrt die formellere hebräische Erzählformel וְהָיָה כִּי, die im Haupttext idiomatisch wiedergegeben ist.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und während
  rationale: Die hebräische Erzählformel leitet den zeitlichen Begleitumstand der folgenden Handlung ein; „Und während“ gibt ihn in natürlichem modernem Deutsch wieder.
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: sie lange … betete
  rationale: Die Hifil-Form von רבה in Verbindung mit dem Infinitiv bezeichnet hier ausgedehntes beziehungsweise anhaltendes Beten. „Lange betete“ bewahrt diesen Aspekt knapp und würdig.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ gibt das Gebet in der Gegenwart Gottes idiomatisch wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: שֹׁמֵר
  choice: beobachtete
  rationale: Das Qal-Partizip bezeichnet eine andauernde aufmerksame Wahrnehmung. Im deutschen Nebensatz vermittelt das Präteritum den fortlaufenden Hintergrund ausreichend.
- source_word: אֶת־פִּיהָ
  choice: ihren Mund
  rationale: פֶּה bedeutet wörtlich „Mund“. Diese Wiedergabe bleibt gegenüber dem folgenden Vers, der ausdrücklich ihre Lippen erwähnt, textlich präzise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur ist flüssig, während die Dauer des Gebets und die wörtliche Bezeichnung „Mund“ erhalten bleiben.
