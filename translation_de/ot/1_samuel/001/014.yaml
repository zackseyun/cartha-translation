  verdict: revise
  source_fidelity: Die Anrede, der Name Eli, die zeitliche Frage und der Imperativ sind grundsätzlich zutreffend wiedergegeben. »Wie lange willst du noch betrunken sein?« bewahrt die im hebräischen Hitpael mögliche Lesart eines anhaltenden betrunkenen Zustands; die Fußnote weist angemessen auf die alternative inchoative/reflexive Nuance hin. »Sieh zu, dass du deinen Wein loswirst« ist jedoch umgangssprachlicher und deutet stärker als der hebräische Imperativ auf ein Sich-Befreien von einer Wirkung. Die direkte Formulierung »Entferne deinen Wein von dir« erhält die auffällige Präpositionalwendung und bleibt offen.
  naturalness: Der erste Satz ist modernes, natürliches Standarddeutsch. »Sieh zu, dass du … loswirst« wirkt gegenüber Elis schroffem, aber würdig erzähltem Redeton zu salopp. »Entferne deinen Wein von dir« ist zwar leicht formell, in direkter Rede eines biblischen Verweises aber klar und angemessen.
  terminology: Eli ist korrekt wiedergegeben. »betrunken« und »Wein« sind sachlich und terminologisch passend. Die Revision vermeidet eine über das Hebräische hinausgehende Festlegung, ob der Wein als Gegenstand entfernt oder seine Wirkung abgestreift werden soll.
