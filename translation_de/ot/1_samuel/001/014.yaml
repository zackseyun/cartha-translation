  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ עֵלִ֔י עַד מָתַ֖י תִּשְׁתַּכָּרִ֑י/ן הָסִ֥ירִי אֶת יֵינֵ֖/ךְ מֵ/עָלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/014.yaml
  text: And Eli said to her[b][a], “How long will you be drunk? Put away your wine from you.”
translation:
  language: de
  text: 'Da sagte Eli zu ihr: »Wie lange willst du noch betrunken sein?[a] Entferne deinen Wein von dir![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann sowohl bedeuten, sich zu betrinken, als auch, sich in einem betrunkenen Zustand zu befinden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Entferne deinen Wein von dir.« Die Wendung kann das Wegstellen des Weins oder das Befreien von seiner Wirkung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ עֵלִי
  choice: Da sagte Eli zu ihr
  rationale: Das Wayyiqtol führt die Erzählung weiter; »Da sagte« ist im Deutschen natürlich und wahrt den narrativen Anschluss.
- source_word: עַד מָתַי
  choice: Wie lange ... noch
  rationale: Idiomatic German rendering of the temporal question; »noch« conveys the accusatory expectation that the alleged condition has continued too long.
- source_word: תִּשְׁתַּכָּרִין
  choice: willst du noch betrunken sein
  rationale: The Hitpael imperfect can refer to becoming drunk or remaining in a drunken condition. In Eli's rebuke, the German formulation is natural while leaving that aspectual ambiguity to the footnote.
- source_word: הָסִירִי אֶת יֵינֵךְ מֵעָלָיִךְ
  choice: Sieh zu, dass du deinen Wein loswirst
  rationale: This renders the imperative force and the idiom literally meaning to remove the wine »from upon« oneself. It can suggest putting the wine away or ridding oneself of its influence without unnaturally reproducing the Hebrew prepositional image.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Elis schroffer, unbegründeter Vorwurf bleibt erkennbar; die Mehrdeutigkeit des hebräischen Verbs und der ungewöhnlichen Wendung מֵעָלָיִךְ wird nicht dogmatisch aufgelöst.
