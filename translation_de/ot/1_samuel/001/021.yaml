base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: de
  text: Dann zog der Mann Elkana mit seinem ganzen Haus hinauf, um Jahwe das jährliche Schlachtopfer darzubringen und sein Gelübde einzulösen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen knapp: „und sein Gelübde“; das Verb für das Einlösen des Gelübdes ist nur mitgemeint.'
    reason: lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: עלה bezeichnet ein Hinaufgehen; im Zusammenhang der Wallfahrt zum Heiligtum bewahrt „hinaufziehen“ sowohl die räumliche als auch die kultische Nuance.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: der Mann Elkana
  rationale: אִישׁ bedeutet wörtlich „Mann“. Die Wiedergabe bleibt eng am Hebräischen, ohne die kontextuell mögliche Bedeutung „Ehemann“ festzuschreiben.
- source_word: וְכָל־בֵּיתוֹ
  choice: mit seinem ganzen Haus
  rationale: בַּיִת bezeichnet hier das Haus im Sinn der Hausgemeinschaft. Diese im Deutschen geläufige biblische Wendung wahrt den korporativen Sinn und meint nicht bloß das Gebäude.
- source_word: לִזְבֹּחַ
  choice: darzubringen
  rationale: זבח bezeichnet im Kultzusammenhang das Schlachten beziehungsweise Darbringen eines Opfers. Mit „Schlachtopfer … darzubringen“ wird die Handlung natürlich und sachlich präzise ausgedrückt.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und damit als Eigenname erkennbar gehalten.
- source_word: זֶבַח הַיָּמִים
  choice: das jährliche Schlachtopfer
  rationale: Die wörtlich schwerfällige Verbindung „Opfer der Tage“ bezeichnet im Kontext das regelmäßig jedes Jahr dargebrachte Opfer.
- source_word: וְאֶת־נִדְרוֹ
  choice: und sein Gelübde
  rationale: Die Formulierung bewahrt die knappe hebräische Koordination und ihre Ellipse, statt das gemeinte Einlösen des Gelübdes stillschweigend in den Haupttext einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ erhält den Charakter des offenbarten Eigennamens, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Beziehung von „sein Gelübde“ zum Verb des Opferns
  choice: knappe Koordination mit erläuternder Fußnote
  alternative: „und sein Gelübde zu erfüllen/einzulösen“
  rationale: Der hebräische Text setzt וְאֶת־נִדְרוֹ als weiteres Akkusativobjekt, ohne ein eigenes Verb auszudrücken. Die Übersetzung wahrt diese formale Spannung; die Fußnote erklärt den wahrscheinlich elliptischen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hinaufziehen“ passt zur Wallfahrtssprache; „ganzes Haus“ bezeichnet verständlich die gesamte Hausgemeinschaft. Die ungewöhnlich knappe Wendung zum Gelübde bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
