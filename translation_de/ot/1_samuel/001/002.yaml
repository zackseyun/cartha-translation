id: 1SA.1.2
reference: 1 Samuel 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: de
  text: Er hatte zwei Frauen.[a] Die eine hieß Hanna, die andere Peninna. Peninna hatte Kinder, Hanna aber hatte keine Kinder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und er hatte zwei Frauen«; die hebräische Formulierung lautet sinngemäß: »Und ihm waren zwei Frauen.«'
    reason: Die Fußnote macht die hebräische Besitzkonstruktion und das im Haupttext aus Gründen natürlichen Deutschen nicht eigens wiedergegebene Bindewort sichtbar.
lexical_decisions:
- source_word: וְלֹו
  choice: Er hatte
  rationale: Die hebräische Besitzkonstruktion lautet wörtlich »und ihm [waren/gehörten]«; modernes Deutsch drückt sie natürlich mit »er hatte« aus. Das einleitende וְ wird im fortlaufenden Erzählzusammenhang nicht eigens wiedergegeben.
- source_word: שְׁתֵּי נָשִׁים
  choice: zwei Frauen
  rationale: Im Zusammenhang bezeichnet נָשִׁים Elkanas Ehefrauen. »Zwei Frauen« ist im Deutschen die natürliche Bezeichnung und bewahrt die ausdrücklich dargestellte polygynische Familiensituation.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: Die eine hieß ... die andere ...
  rationale: Die knappe deutsche Namensformel gibt die parallele Identifizierung beider Frauen idiomatisch wieder, ohne den Sinn des wiederholten hebräischen שֵׁם zu verändern.
- source_word: חַנָּה
  choice: Hanna
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: פְּנִנָּה
  choice: Peninna
  rationale: Der Personenname wird in einer im Deutschen etablierten, quellennahen Form wiedergegeben.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: Peninna hatte Kinder
  rationale: Die hebräische Existenz- und Besitzkonstruktion wird idiomatisch wiedergegeben. יְלָדִים bedeutet allgemein »Kinder« und legt hier kein Geschlecht fest.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: Hanna aber hatte keine Kinder
  rationale: אֵין bezeichnet das Nichtvorhandensein. Die Stellung von »aber« bildet den deutlichen Gegensatz zu Peninna ab, ohne zusätzliche Aussage einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die knappen Gegensätze und die polygynische Familiensituation des Ausgangstextes bleiben unverändert sichtbar.
