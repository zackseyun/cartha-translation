base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: de
  text: 'Da sagte ihr Mann Elkana zu ihr: „Hanna, warum weinst du? Und warum isst du nicht? Und warum ist dein Herz betrübt?[a] Bin ich dir nicht besser als zehn Söhne?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum ist dein Herz traurig/schwer?“ Wörtlich: „Warum ist dein Herz schlecht?“'
    reason: lexikalische Alternative und Erläuterung der hebräischen Redewendung
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Folge im modernen Deutschen natürlich wieder.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: ihr Mann Elkana
  rationale: אִישָׁהּ bezeichnet hier eindeutig ihren Ehemann; die deutsche Wortstellung ist natürlich und hält die Identifikation ausdrücklich fest.
- source_word: לָמֶה
  choice: warum
  rationale: Das dreimalige Fragewort wird jeweils wiedergegeben, um die eindringliche rhetorische Wiederholung zu bewahren.
- source_word: תִבְכִּי
  choice: weinst du
  rationale: Die Form beschreibt Hannas gegenwärtiges Weinen; das deutsche Präsens gibt dies ohne unnötige Zusatzdeutung wieder.
- source_word: לֹא תֹאכְלִי
  choice: isst du nicht
  rationale: Die schlichte Verneinung bleibt erhalten; eine willentliche Nuance wie „willst du nicht essen“ wird nicht hinzugefügt.
- source_word: יֵרַע לְבָבֵךְ
  choice: ist dein Herz betrübt
  rationale: Wörtlich wird das Herz „schlecht“; im Zusammenhang bezeichnet die Wendung innere Trauer oder Bedrückung. „Betrübt“ bewahrt das Herzbild und gibt den idiomatischen Sinn verständlich wieder.
- source_word: הֲלוֹא אָֽנֹכִי טוֹב לָךְ
  choice: Bin ich dir nicht mehr wert
  rationale: Die hebräische rhetorische Frage erwartet Zustimmung. „Mehr wert“ vermittelt den gemeinten Vergleich im Deutschen natürlicher als das missverständliche „besser für dich“.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: als zehn Söhne
  rationale: Der hebräische Text nennt ausdrücklich Söhne; sowohl das Geschlecht als auch die Zahl werden ohne Verallgemeinerung beibehalten.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von בָּנִים
  choice: Söhne
  alternative: Kinder
  rationale: Das hebräische Substantiv ist ausdrücklich maskulin und verweist im Erzählzusammenhang auf Söhne; eine geschlechtsneutrale Wiedergabe würde diese Aussage abschwächen.
- issue: Elkanas vergleichende Selbstaussage
  choice: Bin ich dir nicht mehr wert als zehn Söhne?
  alternative: Bin ich nicht besser für dich als zehn Söhne?
  rationale: Die gewählte Formulierung erhält den anspruchsvollen, möglicherweise selbstbezogenen Charakter seiner Frage, ohne sie als tröstlich, richtig oder theologisch normativ zu bewerten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Warum-Frage und das hebräische Herzbild bleiben erhalten; idiomatisch missverständliche Wörtlichkeit wird in der Hauptzeile vermieden und in der Fußnote dokumentiert.
