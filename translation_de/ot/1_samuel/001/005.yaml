  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: de
  text: Hanna aber gab er jeweils einen doppelten Anteil[a], denn er liebte Hanna, und Jahwe hatte ihren Mutterleib verschlossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »einen Anteil von zwei Gesichtern/Nasen«. Die hebräische Wendung ist schwierig und kann einen doppelten oder einen besonders bevorzugten Anteil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחַנָּה
  choice: Hanna aber
  rationale: Die Verbindung aus Konjunktion und Präposition lautet wörtlich »und für Hanna«. »Hanna aber« gibt den Gegensatz zu den Anteilen für Peninna und ihre Kinder im vorhergehenden Vers natürlich wieder.
- source_word: יִתֵּן
  choice: gab er jeweils
  rationale: Das Imperfekt bezeichnet im erzählenden Vergangenheitskontext wahrscheinlich Elkanas wiederkehrendes Handeln beim jährlichen Opfermahl. »Jeweils« macht diesen gewohnheitsmäßigen Sinn im Deutschen deutlich.
- source_word: מָנָה
  choice: Anteil
  rationale: Gemeint ist der zugeteilte Anteil am Opfermahl. »Anteil« ist präzise, verständlich und stilistisch angemessen.
- source_word: אַחַת אַפָּיִם
  choice: einen doppelten Anteil
  rationale: Die schwer verständliche Wendung bedeutet wörtlich ungefähr »einen Anteil von zwei Gesichtern/Nasen«. Wahrscheinlich ist ein doppelter oder besonders bevorzugter Anteil gemeint; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier den Grund für Elkanas besondere Zuwendung zu Hanna ein.
- source_word: אֶת־חַנָּה אָהֵב
  choice: er liebte Hanna
  rationale: Die schlichte Aussage des Hebräischen wird ohne Erweiterung wiedergegeben.
- source_word: וַיהוָה
  choice: obwohl Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben. Das hebräische ו verbindet die Aussage formal mit »und«; im Zusammenhang liegt eine konzessive Beziehung nahe, die im Deutschen mit »obwohl« natürlich ausgedrückt wird.
- source_word: סָגַר רַחְמָהּ
  choice: ihren Mutterleib verschlossen hatte
  rationale: Das Verb bedeutet »verschließen«. Das Plusquamperfekt kennzeichnet den Zustand als Hintergrund zu Elkanas wiederholtem Handeln; »Mutterleib« gibt רֶחֶם würdig und verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Elkanas Liebe und Hannas Unfruchtbarkeit
  choice: obwohl Jahwe ihren Mutterleib verschlossen hatte
  alternative: und Jahwe hatte ihren Mutterleib verschlossen
  rationale: 'Das hebräische ו bedeutet formal »und«, doch die Gegenüberstellung legt hier einen konzessiven Zusammenhang nahe: Elkana liebte Hanna trotz ihrer Kinderlosigkeit. Da die formale Alternative möglich bleibt, wird sie ausdrücklich dokumentiert und nicht als theologisch bedeutungslos behandelt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Jeweils« vermittelt den wiederholten Vorgang ohne schwerfällige Umschreibung. Der Haupttext bleibt flüssig; die echte lexikalische Unsicherheit bei אַחַת אַפָּיִם wird in der Fußnote bewahrt.
