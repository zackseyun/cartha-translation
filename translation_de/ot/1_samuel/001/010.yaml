source:
  edition: WLC
  text: וְ/הִ֖יא מָ֣רַת נָ֑פֶשׁ וַ/תִּתְפַּלֵּ֥ל עַל יְהוָ֖ה וּ/בָכֹ֥ה תִבְכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/010.yaml
  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: de
  text: Sie war bitteren Herzens[a], betete zu Jahwe und weinte heftig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »bitter an der Seele«; gemeint ist tiefe innere Qual.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verstärkt das Verb: wörtlich »weinend weinte sie«; auch möglich: »weinte unaufhörlich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: bitteren Herzens
  rationale: Die hebräische Wendung bedeutet wörtlich etwa »bitter an der Seele«. »Bitteren Herzens« bewahrt das Bild und bezeichnet hier tiefe innere Qual, ohne im Deutschen unnatürlich zu wirken.
- source_word: וַתִּתְפַּלֵּל
  choice: betete
  rationale: Das Hitpael von פלל bedeutet hier schlicht »beten«. Die Eindringlichkeit ergibt sich aus der Seelennot und dem Weinen und wird nicht zusätzlich in das Verb eingetragen.
- source_word: עַל יְהוָה
  choice: zu Jahwe
  rationale: In Verbindung mit »beten« bezeichnet עַל hier die Ausrichtung des Gebets. »Zu Jahwe« ist im Deutschen klar und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּבָכֹה תִבְכֶּה
  choice: weinte heftig
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Vorgang des Weinens. »Weinte heftig« gibt diese Intensivierung natürlich wieder, ohne die bereits genannte Bitterkeit nochmals ausdrücklich in das Verb hineinzulesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. »Jahwe« erhält diesen Namenscharakter, statt ihn durch einen Hoheitstitel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Bitteren Herzens« bewahrt die hebräische Bildsprache, während die Fußnote ihre Bedeutung verdeutlicht. Der knappe Satzbau entspricht der konzentrierten Darstellung des Ausgangstextes.
