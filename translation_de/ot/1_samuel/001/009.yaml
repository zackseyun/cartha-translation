source:
  edition: WLC
  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: de
  text: Nachdem sie in Schilo gegessen und getrunken hatte, stand Hanna auf. Der Priester Eli saß unterdessen auf dem Sitz am Türpfosten des Tempels[a] Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Heiligtums Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: stand Hanna auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet hier das Aufstehen als Beginn der folgenden Handlung; „stand … auf“ ist im modernen Deutsch natürlich.
- source_word: אַחֲרֵי אָכְלָה בְשִׁלֹה וְאַחֲרֵי שָׁתֹה
  choice: Nach dem Essen und Trinken in Schilo
  rationale: Die beiden parallelen Zeitangaben werden knapp und idiomatisch wiedergegeben. Die nominale Formulierung legt nicht ausdrücklich fest, ob Hanna allein oder die Tischgemeinschaft gemeint ist, und bewahrt so die im Hebräischen mögliche Unbestimmtheit.
- source_word: וְעֵלִי הַכֹּהֵן יֹשֵׁב
  choice: Der Priester Eli saß unterdessen
  rationale: Das Partizip יֹשֵׁב schildert einen andauernden Hintergrundzustand. „Unterdessen“ macht die szenische Funktion der mit וְ eingeleiteten Angabe deutlich.
- source_word: עַל הַכִּסֵּא
  choice: auf dem Stuhl
  rationale: כִּסֵּא kann Sitz, Stuhl oder Thron bezeichnen. „Stuhl“ ist hier konkret und verständlich, ohne eine königliche Funktion Elis vorauszusetzen.
- source_word: עַל מְזוּזַת
  choice: neben dem Türpfosten
  rationale: מְזוּזָה bezeichnet den Türpfosten; עַל hat in diesem räumlichen Zusammenhang die Bedeutung „bei/neben“.
- source_word: הֵיכַל יְהוָה
  choice: des Tempels Jahwes
  rationale: הֵיכָל bezeichnet ein großes Heiligtumsgebäude und kann mit „Tempel“ wiedergegeben werden; die kontextuell passende Alternative „Heiligtum“ wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen, nicht den Titel אֲדֹנָי; die Wiedergabe als Eigenname wahrt diesen Unterschied.
- issue: Bezeichnung des Heiligtums in Schilo (הֵיכָל)
  choice: Tempel
  alternative: Heiligtum
  rationale: „Tempel“ gibt die übliche Bedeutung von הֵיכָל wieder, darf aber nicht als Aussage über den späteren salomonischen Tempel missverstanden werden. Daher wird „Heiligtum“ als lexikalische Alternative in der Fußnote bewahrt.
- issue: Subjekt des Essens und Trinkens
  choice: Nach dem Essen und Trinken
  alternative: Nachdem sie gegessen und getrunken hatte / hatten
  rationale: Die hebräischen Formen und der Zusammenhang lassen die ausdrückliche Zuordnung zu Hanna beziehungsweise zur Tischgemeinschaft unterschiedlich verstehen. Die deutsche nominale Formulierung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die zeitliche Einleitung und die anschließende Hintergrundbeschreibung klar auseinander; unnötige Archaismen werden vermieden.
