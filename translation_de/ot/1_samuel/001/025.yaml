  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: de
  text: Dann schlachteten sie den Stier[a] und brachten den Jungen[b] zu Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „töteten“. Das hebräische Verb kann allgemeiner wiedergegeben werden; „schlachteten“ entspricht jedoch besser dem Opferkontext.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Kind“. Das hebräische Wort kann je nach Zusammenhang einen Jungen, ein Kind oder einen jungen Mann bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Dann schlachteten sie
  rationale: Das Wayyiqtol führt die Erzählung zeitlich weiter. „Schlachteten“ gibt im Opferkontext die Bedeutung genauer wieder als das allgemeinere „töteten“.
- source_word: הַפָּר
  choice: den Stier
  rationale: פַּר bezeichnet häufig einen Stier, besonders im Opferkontext. Der Vers selbst nennt weder Alter noch nähere Bestimmung des Tieres.
- source_word: וַיָּבִיאוּ
  choice: und brachten
  rationale: Das zweite Wayyiqtol setzt die Handlungsfolge fort; die Koordination mit „und“ ist im Deutschen natürlich.
- source_word: הַנַּעַר
  choice: den Jungen
  rationale: נַעַר kann je nach Kontext Kind, Junge oder junger Mann bedeuten. Da Samuel hier noch sehr jung ist, passt „Junge“ am besten, ohne die lexikalische Spannweite zu verschweigen.
- source_word: אֶל עֵלִי
  choice: zu Eli
  rationale: אֶל bezeichnet hier die Bewegung auf eine Person zu; „zu Eli“ ist die direkte und natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Opferbezogene Bedeutung des Schlachtens
  choice: „schlachteten“
  alternative: „töteten“
  rationale: Der unmittelbare Zusammenhang handelt von Gottesdienst und Opfergaben in Schilo. „Schlachteten“ bewahrt diesen kultischen Anklang, ohne dem hebräischen Text eine zusätzliche Erklärung hinzuzufügen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Satzstruktur des Hebräischen bleibt erhalten; echte lexikalische Alternativen werden in Fußnoten genannt.
