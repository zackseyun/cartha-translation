  text: וַ/יְהִי֙ לִ/תְקֻפ֣וֹת הַ/יָּמִ֔ים וַ/תַּ֥הַר חַנָּ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תִּקְרָ֤א אֶת שְׁמ/וֹ֙ שְׁמוּאֵ֔ל כִּ֥י מֵ/יְהוָ֖ה שְׁאִלְתִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: de
  text: 'Als die Zeit gekommen war[a], wurde Hanna schwanger und brachte einen Sohn zur Welt. Sie gab ihm den Namen Samuel[b], denn sie sagte: »Ich habe ihn von Jahwe erbeten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »beim Umlauf/bei der Wende der Tage«; gemeint ist der Zeitpunkt, als die dafür bestimmte Zeit gekommen war.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Name »Samuel« wird hier durch ein hebräisches Wortspiel mit dem Verb שׁאל (»bitten, erfragen«) erklärt: »Ich habe ihn von Jahwe erbeten.« Die genaue Herkunft des Namens ist jedoch nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: Als die Zeit gekommen war
  rationale: Die hebräische Wendung bezeichnet wörtlich den Umlauf oder die Wende der Tage und meint hier das Eintreten des vorgesehenen Zeitpunkts. Die gewählte Formulierung gibt den idiomatischen Sinn natürlich wieder.
- source_word: וַתַּהַר
  choice: wurde Hanna schwanger
  rationale: Die Formulierung gibt das Verb הרה im Zusammenhang einer Geburtsgeschichte klar und in heutigem Deutsch wieder.
- source_word: וַתֵּלֶד בֵּן
  choice: brachte einen Sohn zur Welt
  rationale: Dies ist eine natürliche und genaue deutsche Wiedergabe der hebräischen Geburtsformel.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: Sie gab ihm den Namen
  rationale: Die deutsche Namensformel ist verständlich und bewahrt ausdrücklich den Akt der Namengebung.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Der Personenname wird in seiner im Deutschen herkömmlichen biblischen Form wiedergegeben.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: 'denn sie sagte: »Ich habe ihn von Jahwe erbeten.«'
  rationale: „Erbeten“ bewahrt den Sinn einer an Gott gerichteten Bitte und lässt zugleich den Wortklang zwischen שְׁמוּאֵל und שׁאל erkennen. „Sie sagte“ macht die im Hebräischen implizite Erklärung der Namensgebung im Deutschen kenntlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname wahrt diese Unterscheidung; die deutsche Standardform lautet „Jahwe“.
- issue: Erklärung des Namens Samuel durch שׁאל („bitten, erfragen“)
  choice: Das Wortspiel im Haupttext durch „erbeten“ anklingen lassen und in einer Fußnote erläutern
  alternative: Den Namen als eindeutige wörtliche Ableitung von שׁאל darstellen
  rationale: Der Vers verbindet den Namen Samuel klanglich mit dem Verb שׁאל, doch die genaue Etymologie des Namens ist nicht eindeutig. Die Übersetzung bewahrt die Verbindung, ohne eine umstrittene Namensdeutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Erzählweise. Die hebräische Zeitangabe wird idiomatisch wiedergegeben; das Namenswortspiel bleibt im Ausdruck „erbeten“ hörbar und wird in der Fußnote erläutert.
