base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: de
  text: 'Elkana, ihr Mann, sagte zu ihr: „Tu, was du für richtig hältst. Bleib, bis du ihn entwöhnt hast. Jahwe möge nur sein Wort bestätigen.[a]“ So blieb die Frau und stillte ihren Sohn, bis sie ihn entwöhnt hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Wort bekräftigen“ beziehungsweise „sein Wort erfüllen“. Das Hebräische kann sich auf eine Zusage Jahwes oder auf die gerade besprochene Angelegenheit beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: Im Zusammenhang bezeichnet אִישׁ mit Suffix Hannas Ehemann; „ihr Mann“ ist im modernen Deutsch natürlich und präzise.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: Tu, was du für richtig hältst
  rationale: Die hebräische Wendung bezeichnet das, was nach dem eigenen Urteil gut erscheint. Die deutsche Formulierung gibt den Sinn idiomatisch wieder.
- source_word: שְׁבִי
  choice: Bleib hier
  rationale: ישׁב bedeutet hier nicht körperlich „sitzen“, sondern am bisherigen Ort bleiben. „Hier“ verdeutlicht den im Kontext vorausgesetzten Ortsbezug.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: bis du ihn entwöhnt hast / bis sie ihn entwöhnt hatte
  rationale: Im Zusammenhang mit der Versorgung des Kindes bezeichnet גמל eindeutig das Entwöhnen.
- source_word: אַךְ
  choice: nur
  rationale: אַךְ schränkt die vorausgehende Zustimmung ein beziehungsweise fügt ihr einen nachdrücklichen Wunsch hinzu; „nur“ bewahrt diese Diskursfunktion.
- source_word: יָקֵם
  choice: möge … bestätigen
  rationale: Die jussivische Form drückt einen Wunsch aus. „Bestätigen“ gibt den Hifil-Sinn von קום bei einem Wort natürlich wieder, ohne bereits festzulegen, ob Erfüllung oder Bekräftigung gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דְּבָרוֹ
  choice: sein Wort
  rationale: דבר kann hier Wort, Zusage oder Angelegenheit bedeuten. „Sein Wort“ ist quellennah und bewahrt den unklaren Bezug.
- source_word: וַתֵּינֶק
  choice: stillte
  rationale: Das Verb bezeichnet hier das Ernähren des Kindes an der Brust; „stillte“ ist die natürliche moderne deutsche Wiedergabe.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der hebräische Text verwendet das bestimmte Gattungswort und nicht den Eigennamen Hanna.
theological_decisions:
- issue: Bezug und Bedeutung von „sein Wort“
  choice: „sein Wort“ mit der Verbwiedergabe „bestätigen“; der Bezug bleibt offen
  alternative: „seine Zusage erfüllen“ oder „die eben besprochene Angelegenheit wahr machen“
  rationale: Der hebräische Ausdruck אֶת־דְּבָרוֹ legt nicht eindeutig fest, ob eine göttliche Zusage, die Angelegenheit um Samuel oder das zuvor Gesagte gemeint ist. Der Haupttext bewahrt diese interpretative und theologische Spannung; die Fußnote nennt die Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Augen-Redewendung wird zugunsten natürlicher Verständlichkeit idiomatisch wiedergegeben. „Zu Hause“ ist eine kontextuelle Verdeutlichung für das Bleiben, während die Mehrdeutigkeit von „sein Wort“ ausdrücklich erhalten bleibt.
