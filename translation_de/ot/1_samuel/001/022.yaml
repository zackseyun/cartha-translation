  to: 'Hanna aber ging nicht hinauf, denn sie sagte zu ihrem Mann: »Erst wenn der Junge entwöhnt ist, werde ich ihn hinbringen, damit er vor Jahwe erscheint[a] und für immer dort bleibt.[b]«'
  rationale: Die Revision ersetzt das missverständliche deontische »soll« durch eine finale Konstruktion. Dadurch wird Hannas Aussage als beabsichtigtes Hinbringen Samuels zum Erscheinen vor Jahwe und zu seinem bleibenden Aufenthalt verständlich wiedergegeben. Die dokumentierte alternative Subjektdeutung bleibt unverändert zugänglich.
