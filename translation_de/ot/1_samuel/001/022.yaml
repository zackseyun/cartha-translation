source:
  edition: WLC
  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: de
  text: 'Hanna aber ging nicht hinauf, denn sie sagte zu ihrem Mann: »Erst wenn der Junge entwöhnt ist, werde ich ihn hinbringen, damit er vor Jahwe erscheint[a] und für immer dort bleibt.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer anderen Deutung beziehungsweise Texttradition: »Dann werde ich vor Jahwe erscheinen, und er wird dort für immer bleiben.«'
    reason: alternative_reading
  - marker: b
    text: »Für immer« bezeichnet hier Samuels dauerhafte Hingabe an den Dienst für Jahwe, also für den Rest seines Lebens.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: ging nicht hinauf
  rationale: Das Verb עלה bedeutet gewöhnlich »hinaufgehen« und bezeichnet hier den Weg zum Heiligtum in Schilo. Die räumliche und kultische Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: כִּי אָמְרָה
  choice: denn sie sagte
  rationale: כִּי leitet hier die Begründung dafür ein, dass Hanna nicht mit hinaufging.
- source_word: לְאִישָׁהּ
  choice: zu ihrem Mann
  rationale: אִישׁ bezeichnet mit dem Suffix in diesem Zusammenhang eindeutig Hannas Ehemann.
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: Erst wenn der Junge entwöhnt ist
  rationale: Die Wendung gibt die durch עַד gesetzte zeitliche Grenze und den Aufschub bis zur Entwöhnung im natürlichen Deutschen präzise wieder.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נַעַר kann je nach Zusammenhang Kind, Junge oder junger Mann bedeuten; hier ist der noch kleine Samuel gemeint.
- source_word: וַהֲבִאֹתִיו
  choice: werde ich ihn hinbringen
  rationale: Das Verb bezeichnet Hannas beabsichtigtes Hinbringen Samuels zum Heiligtum nach seiner Entwöhnung.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: Dann soll er vor Jahwe erscheinen
  rationale: Die Nifalform von ראה bezeichnet in dieser kultischen Wendung das Erscheinen vor Gott. Als Subjekt wird im Haupttext Samuel verstanden; die andere mögliche Deutung wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְיָשַׁב שָׁם
  choice: und … dort bleiben
  rationale: ישׁב kann »sitzen«, »wohnen« oder »bleiben« bedeuten. Hier geht es um Samuels dauerhaften Aufenthalt und Dienst am Heiligtum.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die traditionelle knappe Wiedergabe bewahrt die Weite von עוֹלָם; im Zusammenhang bezeichnet sie Samuels lebenslange, dauerhafte Hingabe.
theological_decisions:
- issue: Subjekt von »vor Jahwe erscheinen« und »dort bleiben«
  choice: 'Samuel ist das Subjekt: »Dann soll er vor Jahwe erscheinen und … dort bleiben.«'
  alternative: 'Nach einer anderen Deutung beziehungsweise Texttradition spricht Hanna beim ersten Verb von sich selbst: »Dann werde ich vor Jahwe erscheinen, und er wird dort bleiben.«'
  rationale: Nach »ich werde ihn hinbringen« liegt Samuel als Subjekt der folgenden Aussagen nahe, und dies entspricht dem Ziel seiner Übergabe an den Dienst am Heiligtum. Da eine andere Deutung beziehungsweise Texttradition belegt ist, wird sie nicht verschwiegen, sondern in Fußnote [a] dokumentiert.
- issue: Bedeutung von »für immer«
  choice: Die wörtlich weite Zeitangabe bleibt im Haupttext erhalten.
  alternative: »sein Leben lang«
  rationale: עַד עוֹלָם wird nicht vorschnell eingeengt. Eine Fußnote erklärt jedoch, dass die Formulierung hier im Erzählzusammenhang Samuels bleibende, lebenslange Hingabe an Jahwes Dienst bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erst wenn« gibt den Aufschub durch עַד idiomatisch und zugleich genau wieder. »Hinaufgehen« bewahrt die biblische Wegbeschreibung zum Heiligtum; »dort bleiben« ist verständlich und weniger altertümlich als »dort wohnen« oder »verweilen«.
