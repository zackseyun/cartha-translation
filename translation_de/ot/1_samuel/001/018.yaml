base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: de
  text: 'Sie sagte: „Möge deine Dienerin Gunst in deinen Augen finden.“ Dann ging die Frau ihres Weges und aß. Ihr Gesicht war nicht mehr wie zuvor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ihr Gesicht war ihr nicht mehr.“ Die knappe hebräische Formulierung meint offenbar, dass ihr Gesicht nicht mehr denselben Ausdruck zeigte wie zuvor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: Möge ... finden
  rationale: Die Imperfektform hat in dieser höflichen Anrede den Sinn eines Wunsches; „Möge … finden“ gibt ihn im Deutschen angemessen wieder.
- source_word: שִׁפְחָתְךָ
  choice: deine Dienerin
  rationale: Das ausdrücklich feminine Substantiv bezeichnet hier Hannas demütige Selbstbezeichnung gegenüber Eli. „Dienerin“ bewahrt Geschlecht und respektvollen Ton, ohne unnötig altertümlich zu wirken.
- source_word: חֵן בְּעֵינֶיךָ
  choice: Gunst in deinen Augen finden
  rationale: Die geläufige hebräische Wendung bezeichnet wohlwollende Anerkennung. Die deutsche Formulierung erhält das Bild des Ausgangstextes und bleibt verständlich.
- source_word: לְדַרְכָּהּ
  choice: ging ... ihres Weges
  rationale: Die Wendung beschreibt ihr Fortgehen und die Fortsetzung ihres Weges. „Ihres Weges gehen“ ist eine natürliche, leicht gehobene deutsche Entsprechung.
- source_word: וַתֹּאכַל
  choice: aß
  rationale: Das narrative Verb bezeichnet schlicht die nächste Handlung; der Kontext macht ihre neu gewonnene Ruhe bedeutsam.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: Ihr Gesicht war nicht mehr wie zuvor
  rationale: Der hebräische Satz ist auffällig knapp und lässt den früheren Gesichtsausdruck unausgesprochen. Die Wiedergabe erhält diese Offenheit, deutet aber den erkennbaren Wandel natürlich an.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfliche Wunschformel und das hebräische Bild „in deinen Augen“ bleiben erhalten; die elliptische Schlusswendung wird im Haupttext verständlich, aber nicht ausdrücklich als „traurig“ oder „niedergeschlagen“ festgelegt.
