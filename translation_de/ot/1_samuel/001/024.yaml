base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: de
  text: Als sie ihn entwöhnt hatte, nahm sie ihn mit sich hinauf, zusammen mit drei Stieren[a], einem Efa Mehl und einem Schlauch Wein, und brachte ihn zum Haus Jahwes in Schilo. Der Junge aber war noch jung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „drei Stiere“; einige alte Textzeugen und Ausleger lesen „einen dreijährigen Stier“.
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: nahm sie ihn mit hinauf
  rationale: Das Hifil von עלה bewahrt die Richtung des Hinaufziehens zum Heiligtum; „mit“ gibt עִמָּהּ natürlich wieder.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: Als sie ihn entwöhnt hatte
  rationale: גמל bezeichnet hier das Abstillen beziehungsweise Entwöhnen des Kindes; das Plusquamperfekt verdeutlicht den zeitlichen Ablauf.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: drei Stiere
  rationale: Der masoretische Text lautet eindeutig „drei Stiere“. Die abweichende alte Überlieferung wird in einer Fußnote genannt.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: ein Efa Mehl
  rationale: Die antike Maßeinheit אֵיפָה wird transliteriert, statt ungenau in ein modernes Maß umgerechnet zu werden.
- source_word: וְנֵבֶל יַיִן
  choice: einen Schlauch Wein
  rationale: נֵבֶל bezeichnet hier ein Behältnis für Wein, wahrscheinlich einen Lederschlauch; die knappe deutsche Wendung ist verständlich und sachgerecht.
- source_word: וַתְּבִאֵהוּ
  choice: brachte ihn
  rationale: Das Hifil von בוא bedeutet „bringen“ und bezeichnet hier die Ankunft am Heiligtum.
- source_word: בֵית יְהוָה
  choice: Haus Jahwes
  rationale: Die Wendung bezeichnet das Heiligtum; der Gottesname wird als persönlicher Name wiedergegeben.
- source_word: שִׁלוֹ
  choice: in Schilo
  rationale: Der Ortsname wird in der im Deutschen üblichen Form „Schilo“ wiedergegeben.
- source_word: וְהַנַּעַר נָעַר
  choice: Der Junge aber war noch sehr jung
  rationale: Die Wiederholung von נַעַר hebt sein geringes Alter hervor. Eine wortgleiche Wiederholung wäre im Deutschen unnatürlich; „sehr jung“ bewahrt die Betonung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden verschiedenen Verben für das Hinaufziehen und das Bringen werden unterschieden. Der Fußnotenmarker steht unmittelbar bei der textkritisch betroffenen Wendung „drei Stiere“.
