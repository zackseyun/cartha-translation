  naturalness: „Sie nahm drei Stiere … mit“ unmittelbar nach „nahm sie ihn mit hinauf“ klingt im Deutschen wiederholend und syntaktisch weniger geschlossen. Eine zusammenhängende Satzgestaltung mit „mit sich“ und „zusammen mit“ ist modern, klar und bewahrt die Richtungsnuance.
