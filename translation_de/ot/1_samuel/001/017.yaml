base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: de
  text: 'Da antwortete Eli und sagte: „Geh in Frieden! Der Gott Israels möge dir die Bitte[a] gewähren, die du von ihm erbeten hast.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Anliegen“. Das hebräische Wort bezeichnet hier das, worum im Gebet gebeten wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete ... und sagte
  rationale: Die beiden hebräischen Redeverben werden sichtbar wiedergegeben. Die im Deutschen leicht formelhafte Doppelung bewahrt den schlichten Erzählstil des Ausgangstextes.
- source_word: לְכִי לְשָׁלוֹם
  choice: Geh in Frieden!
  rationale: Der feminine Singular richtet sich an Hanna. „In Frieden gehen“ gibt die hebräische Segens- und Abschiedsformel natürlich und würdig wieder.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: Der Gott Israels
  rationale: Die deutsche Genitivverbindung entspricht der hebräischen Constructusverbindung und bezeichnet Israels Gott.
- source_word: יִתֵּן
  choice: möge ... gewähren
  rationale: Der Wunschcharakter der Äußerung wird durch „möge“ ausgedrückt; „gewähren“ passt idiomatisch zu einer im Gebet vorgebrachten Bitte.
- source_word: שֵׁלָתֵךְ
  choice: deine Bitte
  rationale: Das Substantiv bezeichnet hier das im Gebet Erbetene beziehungsweise das Anliegen. „Bitte“ ist im modernen Deutsch natürlich und wahrt den Gebetskontext.
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: die du an ihn gerichtet hast
  rationale: Die Wendung gibt das an Gott gerichtete Erbitten idiomatisch wieder und behält das hebräische Pronomen „ihn“ bei.
theological_decisions:
- issue: Bezug des Pronomens in מֵעִמּוֹ
  choice: „ihn“ bezieht sich im Kontext auf den Gott Israels.
  alternative: Das Pronomen könnte formal ohne ausdrückliche Bestimmung seines Bezugs stehen bleiben.
  rationale: Unmittelbar zuvor wird der Gott Israels genannt, und Hanna hat erklärt, ihr Herz vor dem HERRN ausgeschüttet zu haben. Das Pronomen selbst bleibt in der Übersetzung erhalten, während der Kontext seinen Bezug erkennen lässt.
- issue: Aussage oder Wunsch bei יִתֵּן
  choice: 'Wunsch: „möge ... gewähren“'
  alternative: 'Zusage: „wird ... gewähren“'
  rationale: In Elis Segenswort ist die Wunsch- beziehungsweise Segenskraft der Imperfektform besonders naheliegend. Die Übersetzung macht daraus keine unbedingte prophetische Zusage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die hebräische Redeeinleitung und die Segensformel bleiben erkennbar, ohne altertümliche Ausdrucksweise zu verwenden.
