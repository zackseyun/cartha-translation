    rationale: Die hebräische Verbindung nennt Wein und שכר nebeneinander, ohne das Wort „anderes“ zu verwenden. Die Unterscheidung bleibt auch ohne diese Ergänzung verständlich und wird quellentreuer wiedergegeben.
