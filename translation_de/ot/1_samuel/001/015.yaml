base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: de
  text: 'Hanna aber antwortete: „Nein, mein Herr! Ich bin eine Frau, die tief bekümmert ist.[a] Weder Wein noch berauschendes Getränk habe ich getrunken, sondern ich habe meine Seele vor Yahweh ausgeschüttet.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Frau mit bedrücktem Geist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: Hanna aber antwortete
  rationale: Die im Hebräischen übliche Doppelwendung „antwortete und sagte“ wird in natürlichem Deutsch knapp mit „antwortete“ wiedergegeben; „aber“ macht den Gegensatz zu Elis Vorwurf deutlich.
- source_word: לֹא אֲדֹנִי
  choice: Nein, mein Herr!
  rationale: אֲדֹנִי ist hier die respektvolle Anrede an Eli, kein Gottestitel. „Mein Herr“ bewahrt Höflichkeit und Possessivform.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: eine Frau, die tief bekümmert ist
  rationale: Die Wendung bezeichnet Hannas schwere innere Bedrängnis. Die deutsche Formulierung ist verständlich und natürlich; die zugrunde liegende Bildsprache mit רוּחַ wird in einer Fußnote erhalten.
- source_word: וְיַיִן וְשֵׁכָר לֹא שָׁתִיתִי
  choice: Weder Wein noch ein anderes berauschendes Getränk habe ich getrunken
  rationale: שֵׁכָר bezeichnet ein berauschendes Getränk neben Wein, ohne zwingend eine bestimmte Getränkeart oder besonders hohen Alkoholgehalt festzulegen. „Ein anderes“ verdeutlicht die sachliche Beziehung beider Begriffe.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: ich habe meine Seele … ausgeschüttet
  rationale: Die Formulierung bewahrt das hebräische Bild für rückhaltloses, inniges Beten und folgt נֶפֶשׁ enger als das interpretierende „Herz“.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: לִפְנֵי bezeichnet das Handeln in Gottes Gegenwart; der im Ausgangstext stehende Gottesname wird als „Yahweh“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als „Yahweh“ wiedergegeben, damit der im hebräischen Text ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Bedeutung von „meine Seele ausschütten“
  choice: Die Bildsprache bleibt ohne dogmatische Ausdeutung stehen.
  alternative: „mein Herz im Gebet ausschütten“
  rationale: Der Kontext zeigt inniges Beten, doch der Text selbst verwendet נֶפֶשׁ („Seele/Leben/Selbst“). Die Übersetzung bewahrt diese offene anthropologische Ausdrucksweise.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Erzählformel wurde idiomatisch gestrafft, während zentrale Bilder wie „die Seele ausschütten“ erhalten bleiben. Die Fußnote steht am zugehörigen Ausdruck; fehlerhaft zugeordnete Marker der englischen Konsultationsschicht wurden nicht übernommen.
