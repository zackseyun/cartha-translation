revisions:
- from: 'Sie legte ein Gelübde ab und sagte: »Jahwe der Heerscharen, wenn du das Elend deiner Dienerin wirklich ansiehst, an mich denkst und deine Dienerin nicht vergisst, sondern deiner Dienerin einen männlichen Nachkommen[a] schenkst, dann werde ich ihn Jahwe geben für alle Tage seines Lebens, und kein Schermesser soll an sein Haupt kommen.«[b]'
  to: 'Sie legte ein Gelübde ab und sagte: »Jahwe der Heerscharen, wenn du das Elend deiner Dienerin wirklich ansiehst, an mich denkst und deine Dienerin nicht vergisst, sondern deiner Dienerin ein männliches Kind[a] schenkst, dann werde ich ihn Jahwe geben für alle Tage seines Lebens, und kein Rasiermesser soll auf sein Haupt kommen.«[b]'
  rationale: Die Revision ersetzt die im Deutschen potenziell mehrdeutige Bezeichnung »männlicher Nachkomme« durch das kontextgenaue »männliches Kind« und glättet die Rasierformel zu einer natürlichen, zugleich quellennahen deutschen Wendung. Die Fußnotenanker bleiben unmittelbar an den jeweils erläuterten Textstellen; die zurückhaltende Behandlung des möglichen Nasiräerbezugs bleibt erhalten.
