source:
  edition: WLC
  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: de
  text: 'Sie legte ein Gelübde ab und sagte: »Jahwe der Heerscharen, wenn du das Elend deiner Dienerin wirklich ansiehst, an mich denkst und deine Dienerin nicht vergisst, sondern deiner Dienerin ein männliches Kind[a] schenkst, dann werde ich ihn Jahwe geben für alle Tage seines Lebens, und kein Rasiermesser soll auf sein Haupt kommen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Nachkommenschaft von Männern«; gemeint ist hier ein männliches Kind.'
    reason: lexical_alternative
  - marker: b
    text: Das Verbot, ein Rasiermesser auf sein Haupt kommen zu lassen, erinnert an die besondere Weihe, die mit einem Nasiräergelübde verbunden war. Der Vers nennt jedoch nur diese konkrete Haarvorschrift und bezeichnet ihn nicht ausdrücklich als Nasiräer.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: Sie legte ein Gelübde ab
  rationale: Die figura etymologica »gelobte ein Gelübde« bezeichnet einen feierlichen Gelübdeakt; die gewählte Formulierung ist im modernen Deutschen natürlich und wahrt dessen Förmlichkeit.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; »Heerscharen« bewahrt die bewusst offene militärische beziehungsweise himmlische Titelprägung von צְבָאוֹת.
- source_word: אִם רָאֹה תִרְאֶה
  choice: wenn du … wirklich ansiehst
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam das Sehen; »wirklich« gibt diese Hervorhebung idiomatisch wieder.
- source_word: בָּעֳנִי
  choice: das Elend
  rationale: עֳנִי kann Not, Bedrängnis oder Erniedrigung bezeichnen. »Elend« umfasst Hannas persönliches Leid und ihre soziale Kränkung, ohne den Grund enger festzulegen.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: deine Dienerin
  rationale: Das Substantiv bezeichnet ausdrücklich eine weibliche Dienende. »Dienerin« ist geschlechtsgenau, gegenwärtig und für die demütige Gebetssprache passend.
- source_word: וּזְכַרְתַּנִי וְלֹא תִשְׁכַּח
  choice: an mich denkst und … nicht vergisst
  rationale: Die parallelen Bitten werden erhalten. »An mich denken« ist hier natürliches Deutsch für das wirksame göttliche Erinnern, ohne dessen Bedeutung auszudeuten.
- source_word: זֶרַע אֲנָשִׁים
  choice: einen männlichen Nachkommen
  rationale: Wörtlich steht »Nachkommenschaft/Same von Männern«. Im Kontext ist ein männliches Kind gemeint; »männlicher Nachkomme« bewahrt sowohl das Abstammungswort als auch die Geschlechtsangabe. Eine Fußnote nennt die wörtliche Wendung.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: dann werde ich ihn Jahwe geben
  rationale: Die einfache Bedeutung »geben« bleibt erhalten; »weihen« wäre zwar kontextuell möglich, würde den Vorgang aber stärker interpretieren.
- source_word: כָּל יְמֵי חַיָּיו
  choice: für alle Tage seines Lebens
  rationale: Die Formulierung bildet die hebräische Zeitangabe eng ab und betont die lebenslange Dauer des Gelübdes.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: und kein Schermesser soll an sein Haupt kommen
  rationale: Die konkrete hebräische Bildsprache und der Gelübdecharakter bleiben gewahrt. »Schermesser« bezeichnet das Werkzeug zum Abschneiden des Haares, ohne den Satz bloß als allgemeines Haareschneiden zu paraphrasieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen, nicht das Wort אֲדֹנָי. »Jahwe« gibt den Namen transparent wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Möglicher Nasiräerbezug des Verbots, ein Schermesser an sein Haupt kommen zu lassen
  choice: Nur die ausdrücklich genannte lebenslange Übergabe und das Schermesserverbot im Haupttext wiedergeben
  alternative: Samuel im Haupttext ausdrücklich als Nasiräer bezeichnen
  rationale: Die Wendung erinnert deutlich an die besondere Weihe eines Nasiräers, doch der Vers verwendet diese Bezeichnung nicht. Die Anspielung wird daher in einer Fußnote erläutert, nicht als eindeutige Identifikation in den Text eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlichem Gebetston. Die Wiederholung »deine Dienerin« und die kumulative Satzstruktur wurden als Merkmale der inständigen Bitte bewahrt. »Haupt« und »Heerscharen« sind leicht gehoben, im biblisch-feierlichen Zusammenhang jedoch verständlich und sachlich präzise.
