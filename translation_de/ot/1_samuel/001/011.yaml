    rationale: Die Übersetzung ist verständlich, klingt aber weniger idiomatisch als die etablierte deutsche Formel »kein Rasiermesser soll auf sein Haupt kommen«. Die Änderung bewahrt das konkrete Bild und erhöht die Natürlichkeit.
