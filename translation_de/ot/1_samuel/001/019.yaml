  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: frühes Aufstehen, Niederwerfen vor Jahwe, Rückkehr zum Haus in Rama, das euphemistische ידע im Blick auf Hanna und Jahwes „Erinnern“ an sie. Die körperliche Bedeutung von וַיִּשְׁתַּחֲווּ bleibt mit „warfen sich ... nieder“ angemessen konkret.'
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Früh am Morgen standen sie auf“ sowie „kehrten sie zurück und kamen zu ihrem Haus in Rama“ sind natürlich. Die bewusst bibelsprachliche Wendung „erkannte seine Frau Hanna“ wird durch die Fußnote ausreichend erklärt und bewahrt den Euphemismus des Ausgangstextes.
  terminology: „Jahwe“ ist als deutsche Wiedergabe des Tetragramms konsequent. Die Namen Elkana, Hanna und Rama sind passend wiedergegeben. Die Fußnoten erläutern sowohl das sexuelle Euphemismusfeld von ידע als auch die wirksame Nuance von זכר, ohne den Haupttext übermäßig auszudeuten.
