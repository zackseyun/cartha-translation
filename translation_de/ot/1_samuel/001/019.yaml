source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֗קֶר וַ/יִּֽשְׁתַּחֲווּ֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֛בוּ וַ/יָּבֹ֥אוּ אֶל בֵּיתָ֖/ם הָ/רָמָ֑תָ/ה וַ/יֵּ֤דַע אֶלְקָנָה֙ אֶת חַנָּ֣ה אִשְׁתּ֔/וֹ וַ/יִּֽזְכְּרֶ֖/הָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: de
  text: Früh am Morgen standen sie auf und warfen sich vor Jahwe nieder. Dann kehrten sie zurück und kamen zu ihrem Haus in Rama. Elkana erkannte seine Frau Hanna[a], und Jahwe erinnerte sich an sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erkannte“ ist im Hebräischen eine übliche zurückhaltende Umschreibung für ehelichen Geschlechtsverkehr.
    reason: lexical_alternative
  - marker: b
    text: 'Wenn es im Hebräischen heißt, Gott „erinnere sich“ an jemanden, meint das oft mehr als bloßes Zurückdenken: Gott wendet sich dieser Person treu und wirksam zu.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Früh am Morgen standen sie auf
  rationale: Die Hifil-Form von שׁכם bezeichnet frühes Aufstehen. Die deutsche Wortstellung gibt Verb und Zeitangabe natürlich und ohne Archaismus wieder.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: und warfen sich vor Jahwe nieder
  rationale: השתחוה bezeichnet eine körperliche Verbeugung bis hin zum Niederwerfen. Die Formulierung bewahrt die konkrete Handlung und zugleich ihren verehrenden Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird nach üblicher deutscher Transliterationsform als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: Dann kehrten sie zurück und kamen zu ihrem Haus in Rama
  rationale: Beide aufeinanderfolgenden Bewegungsverben bleiben erhalten. Die Ortsangabe wird im Deutschen natürlich mit „in Rama“ an das Haus gebunden.
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: Elkana erkannte seine Frau Hanna
  rationale: ידע ist hier ein bewusst zurückhaltender Euphemismus für ehelichen Geschlechtsverkehr. „Erkannte“ bewahrt Bildsprache und Register des Hebräischen; eine Fußnote erklärt den heutigen Lesern die Bedeutung.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: und Jahwe erinnerte sich an sie
  rationale: זכר wird wörtlich als Erinnern wiedergegeben. Im hebräischen Erzählzusammenhang schließt dies wirksame, zugewandte Beachtung ein, ohne dass der Vers das Ergebnis bereits ausdrücklich nennt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliterierung bewahrt den Unterschied zwischen Eigenname und Titel.
- issue: Explizitheit des sexuellen Euphemismus ידע
  choice: Den Euphemismus mit „erkannte“ im Haupttext bewahren
  alternative: hatte ehelichen Verkehr mit
  rationale: Die zurückhaltende Ausdrucksweise gehört zur literarischen Gestalt des hebräischen Textes. Die Fußnote stellt sicher, dass die Bedeutung verständlich bleibt.
- issue: Bedeutung von Gottes Erinnern
  choice: „Jahwe erinnerte sich an sie“ bewahren
  alternative: Jahwe wandte sich ihr helfend zu
  rationale: Das hebräische זכר meint hier mehr als bloßes gedankliches Erinnern und deutet wirksame Zuwendung an. Eine ausdeutende Wiedergabe im Haupttext würde jedoch vorwegnehmen, was erst der Fortgang erzählt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkreten hebräischen Bilder des Niederwerfens, Erkennens und Erinnerns bleiben erhalten; zwei kurze Fußnoten erklären Ausdrücke, die im heutigen Deutschen missverstanden oder zu eng aufgefasst werden könnten.
