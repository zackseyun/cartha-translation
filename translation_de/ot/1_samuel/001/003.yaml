  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: de
  text: Jahr für Jahr zog jener Mann aus seiner Stadt hinauf nach Silo, um sich vor Jahwe der Heerscharen niederzuwerfen und ihm Opfer darzubringen. Dort waren die beiden Söhne Elis, Hofni und Pinhas, Priester Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: zog … hinauf
  rationale: Das Qatal mit vorangestelltem Waw bezeichnet hier zusammen mit der Zeitangabe eine regelmäßig wiederkehrende Handlung in der Vergangenheit. „Jahr für Jahr zog … hinauf“ gibt sowohl die Gewohnheit als auch die wörtliche Aufwärtsbewegung einer Wallfahrt wieder.
- source_word: הָאִישׁ הַהוּא
  choice: jener Mann
  rationale: Das Demonstrativum verweist bestimmt auf den zuvor genannten Elkana. „Jener Mann“ bewahrt diese rückbezügliche Funktion.
- source_word: מֵעִירוֹ
  choice: aus seiner Stadt
  rationale: עִיר kann Stadt oder Ortschaft bedeuten; „Stadt“ ist die direkte, kontextuell mögliche Wiedergabe.
- source_word: מִיָּמִים יָמִימָה
  choice: Jahr für Jahr
  rationale: Die hebräische Wendung bezeichnet die regelmäßige jährliche Wiederkehr und wird so in natürlichem Deutsch idiomatisch wiedergegeben.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: sich … niederzuwerfen
  rationale: Das Hitpael bezeichnet konkret das Sich-Niederwerfen und im kultischen Zusammenhang zugleich Anbetung. Die konkrete Formulierung bewahrt beide Aspekte.
- source_word: וְלִזְבֹּחַ
  choice: ihm Opfer darzubringen
  rationale: Das Verb bezeichnet das Schlachten beziehungsweise Darbringen eines Opfers. Die deutsche Wendung ist kultisch klar und natürlich; das Pronomen macht den bereits genannten Empfänger deutlich.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: Herr der Heere
  rationale: צְבָאוֹת bedeutet „Heere/Heerscharen“. In der festen Gottesbezeichnung macht „Herr der Heere“ die gemeinte Herrschaftsbeziehung im Deutschen verständlich; eine Fußnote nennt die traditionelle Wiedergabe.
- source_word: בְּשִׁלֹה
  choice: nach Silo
  rationale: Da das Hinaufziehen auf ein Ziel gerichtet ist, gibt „nach Silo“ den syntaktischen und sachlichen Zusammenhang im Deutschen natürlich wieder.
- source_word: וְשָׁם
  choice: Dort waren
  rationale: Die Ortsangabe eröffnet den zweiten Satz und wird mit der im Deutschen nötigen Kopula verbunden.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: die beiden Söhne Elis
  rationale: Die Formulierung bewahrt die Hervorhebung der beiden Söhne und verwendet den im Deutschen natürlichen Genitiv.
- source_word: חָפְנִי וּפִנְחָס
  choice: Hofni und Pinhas
  rationale: Die Eigennamen folgen den im Deutschen gebräuchlichen biblischen Formen.
- source_word: כֹּהֲנִים לַיהוָה
  choice: Priester Jahwes
  rationale: Die knappe Nominalfügung gibt die kultische Zugehörigkeit beziehungsweise den Dienst für Jahwe wieder, ohne zusätzliche Tätigkeitsangaben einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Charakter als Gottesname; „der HERR“ ist die traditionelle Ersatzlesung.
- issue: Wiedergabe des Titels יהוה צבאות
  choice: Jahwe, der Herr der Heere
  alternative: Jahwe der Heerscharen; der HERR der Heerscharen
  rationale: Die Formulierung bewahrt den Gottesnamen und gibt צבאות lexikalisch als „Heere“ wieder. Das ergänzende „Herr“ macht die im deutschen Titel gemeinte Beziehung verständlich, ohne „Allmächtiger“ als weitergehende Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die habitualisierte Vergangenheit wird ohne schwerfälliges „pflegte“ durch „Jahr für Jahr zog“ ausgedrückt. Das konkrete „sich niederwerfen“ bewahrt die körperliche wie kultische Bedeutung des hebräischen Verbs.
