base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: de
  text: Und ihre Rivalin[a] reizte sie immer wieder heftig, um sie aufzuwühlen, denn Jahwe hatte ihren Mutterschoß verschlossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Mitfrau“. Das hebräische Wort bezeichnet hier eine Frau, die innerhalb derselben Ehe- und Hausgemeinschaft zu ihr in einem rivalisierenden Verhältnis steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: reizte sie immer wieder
  rationale: Das Piel von כעס bezeichnet ein Verärgern oder Provozieren. Der Zusammenhang schildert ein wiederholtes, gewohnheitsmäßiges Verhalten; „immer wieder“ macht diesen iterativen Sinn im Deutschen deutlich.
- source_word: צָרָתָהּ
  choice: ihre Rivalin
  rationale: צָרָה bezeichnet hier Peninna als Hannas Rivalin innerhalb der Ehe- und Hausgemeinschaft. „Rivalin“ ist natürlich und bewahrt den feindseligen Beziehungsaspekt; die genauere kulturelle Einordnung steht in der Fußnote.
- source_word: גַּם כַּעַס
  choice: heftig
  rationale: Die Verbindung verstärkt das provozierende Handeln. „Heftig“ gibt die emphatische Wirkung idiomatisch wieder, ohne die Wortwurzel im Deutschen schwerfällig zu verdoppeln.
- source_word: בַּעֲבוּר
  choice: um
  rationale: Die Präposition leitet hier den Zweck des Reizens ein.
- source_word: הַרְּעִמָהּ
  choice: sie aufzuwühlen
  rationale: Die seltene Verbform bezeichnet hier wahrscheinlich das Versetzen in innere Erregung, Unruhe oder Kummer. „Aufwühlen“ bewahrt diese Breite besser als das schwächere „ärgern“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den begründenden Umstand ein, den die Rivalin für ihre Kränkungen ausnutzte.
- source_word: סָגַר
  choice: hatte … verschlossen
  rationale: סגר bedeutet „schließen, verschließen“. Das Plusquamperfekt kennzeichnet den Zustand als bereits bestehenden Hintergrund der wiederholten Handlung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּעַד רַחְמָהּ
  choice: ihren Mutterschoß verschlossen
  rationale: רֶחֶם bezeichnet den Mutterschoß. Mit סגר und בְּעַד entsteht die Wendung für das Ausbleiben einer Empfängnis; die deutsche Formulierung erhält das konkrete Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diese Namensfunktion, ohne sie durch einen Titel zu ersetzen.
- issue: Göttliches Handeln an Hannas Fruchtbarkeit
  choice: „Jahwe hatte ihren Mutterschoß verschlossen“ als direkte Aussage beibehalten
  alternative: eine abschwächende Formulierung wie „sie konnte keine Kinder bekommen“
  rationale: Der hebräische Text schreibt den Zustand ausdrücklich Jahwes Handeln zu. Die Übersetzung bewahrt diese theologische Spannung, statt sie kausal abzuschwächen oder zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Immer wieder“ verdeutlicht den wiederholten Charakter der Handlung; „Mutterschoß“ erhält das konkrete hebräische Bild und vermeidet eine rein medizinische Ausdrucksweise.
