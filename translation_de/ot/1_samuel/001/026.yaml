  text: וַ/תֹּ֨אמֶר֙ בִּ֣י אֲדֹנִ֔/י חֵ֥י נַפְשְׁ/ךָ֖ אֲדֹנִ֑/י אֲנִ֣י הָ/אִשָּׁ֗ה הַ/נִּצֶּ֤בֶת עִמְּ/כָה֙ בָּ/זֶ֔ה לְ/הִתְפַּלֵּ֖ל אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: de
  text: 'Und sie sagte: „Bitte, mein Herr! So wahr du lebst,[a] mein Herr: Ich bin die Frau, die hier bei dir stand, um zu Jahwe zu beten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlicher: „So wahr deine Seele lebt“; eine Schwurformel, mit der Hanna ihre Aussage nachdrücklich bekräftigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Bitte
  rationale: Die Partikel dient in der direkten Anrede als höfliche, eindringliche Bitte; „Bitte“ gibt diese Funktion im heutigen Deutsch natürlich wieder.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die ehrerbietige Anrede gilt Eli und ist hier kein Gottesname. „Mein Herr“ bewahrt die soziale Ehrerbietung des Hebräischen.
- source_word: חֵי נַפְשְׁךָ
  choice: So wahr du lebst
  rationale: Die hebräische Schwurformel lautet wörtlicher „So wahr deine Seele lebt“. Die gewählte deutsche Formel vermittelt ihren bekräftigenden Sinn idiomatisch.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der bestimmte Ausdruck bezeichnet Hanna als die konkrete Frau, die Eli zuvor gesehen hatte.
- source_word: הַנִּצֶּבֶת
  choice: die … stand
  rationale: Das Partizip beschreibt Hannas damaliges Stehen an diesem Ort. Im Deutschen gibt ein Relativsatz im Präteritum dies natürlich wieder.
- source_word: עִמְּכָה
  choice: bei dir
  rationale: Die Präposition bezeichnet hier räumliche Nähe, nicht notwendig gemeinschaftliches Handeln. „Bei dir“ passt idiomatisch zur Szene.
- source_word: בָּזֶה
  choice: hier
  rationale: Die Verbindung aus Präposition und Demonstrativ verweist auf den Ort des früheren Geschehens; „hier“ ist die natürliche deutsche Wiedergabe.
- source_word: לְהִתְפַּלֵּל
  choice: um … zu beten
  rationale: Der Infinitiv bezeichnet den Zweck ihres dortigen Stehens. Die deutsche Konstruktion „um … zu“ macht diesen Zusammenhang klar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ wahrt den Charakter als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Anrede „mein Herr“ bleibt entsprechend der hebräischen Wiederholung erhalten; die Zeichensetzung macht die eindringliche Bitte und Bekräftigung gut lesbar.
