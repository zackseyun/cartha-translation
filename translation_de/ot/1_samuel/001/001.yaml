  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: de
  text: Es war ein Mann aus Ramatajim-Zofim im Bergland Ephraim. Er hieß Elkana, der Sohn Jerohams, des Sohnes Elihus, des Sohnes Tohus, des Sohnes Zufs, ein Efratiter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „ein Ephraimiter“. Im Hebräischen steht „Efratiter“; hier kann die Bezeichnung jedoch regional auf Ephraim bezogen sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Da war
  rationale: Die narrative Verbform eröffnet die Erzählung und führt die Hauptfigur ein. „Da war“ gibt diese Eröffnungsfunktion in natürlichem Deutsch wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: אִישׁ אֶחָד
  choice: ein Mann
  rationale: Wörtlich steht „ein Mann“. Im Zusammenhang führt die Wendung eine bestimmte, unmittelbar danach benannte Person ein; der deutsche unbestimmte Artikel vermittelt dies natürlich, ohne das Zahlwort unnötig zu betonen.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: aus Ramatajim-Zofim
  rationale: Die Wortgruppe wird als zusammengesetzter Ortsname verstanden und transliteriert, statt ihre Bestandteile deutend zu übersetzen.
- source_word: מֵהַר אֶפְרָיִם
  choice: aus dem Bergland Ephraim
  rationale: הַר bezeichnet in solchen geografischen Wendungen ein Berg- beziehungsweise Hügelland und nicht notwendig einen einzelnen Berg.
- source_word: וּשְׁמוֹ
  choice: Er hieß
  rationale: Dies ist eine natürliche deutsche Wiedergabe von „und sein Name war“. Der neue Satz vermeidet eine schwerfällige Kette, ohne Information oder Erzählfolge zu verändern.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: der Sohn ... des Sohnes ... des Sohnes ... des Sohnes
  rationale: Die wiederholte Abstammungsformel wird als Vater-Sohn-Folge wiedergegeben. Obwohl biblische Genealogien Generationen auslassen können, gibt der Kontext keinen Anlass, allgemeiner mit „Nachkomme“ zu übersetzen.
- source_word: אֶפְרָתִי
  choice: ein Efratiter
  rationale: Die formale Bedeutung des hebräischen Adjektivs wird im Haupttext bewahrt. Die kontextuell mögliche regionale Deutung „Ephraimiter“ wird in der Fußnote genannt.
theological_decisions:
- issue: Ethnische oder geografische Zuordnung durch אֶפְרָתִי
  choice: ein Efratiter
  alternative: ein Ephraimiter
  rationale: Die hebräische Form spricht unmittelbar für „Efratiter“. Da die vorherige Ortsangabe auf das Bergland Ephraim verweist, kann die Bezeichnung hier auch regional im Sinn von „Ephraimiter“ verstanden werden. Diese echte Mehrdeutigkeit wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze Eröffnungsformel und die genealogische Reihung bewahren den hebräischen Erzählcharakter; die Satzteilung sorgt für gute Verständlichkeit. Personennamen und der Ortsname werden in geläufiger deutscher Umschrift wiedergegeben.
