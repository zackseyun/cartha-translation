source:
  edition: WLC
  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: de
  text: Seid stark und zeigt euch als Männer[a], ihr Philister, sonst werdet ihr den Hebräern dienen, wie sie euch gedient haben.[b] Zeigt euch als Männer und kämpft!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Seid Männer.« Die hebräische Wendung ist eine geschlechtlich markierte Aufforderung zu entschlossenem Mut im Kampf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sonst werdet ihr zu Sklaven der Hebräer, wie sie eure Sklaven gewesen sind.« Das hebräische Verb kann gewöhnliches Dienen, hier aber auch erzwungene Unterwerfung oder Sklaverei bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: Seid stark
  rationale: Der Hitpael-Imperativ Plural von חזק fordert im unmittelbaren Kampfzusammenhang zu Stärke und Mut auf. »Seid stark« ist knapp, natürlich und bewahrt die Form der Aufforderung.
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: zeigt euch als Männer
  rationale: Die zweimal wiederholte, ausdrücklich geschlechtlich markierte Wendung fordert die männlichen Krieger zu entschlossenem Mut auf. »Zeigt euch als Männer« klingt im Deutschen natürlicher als das wörtlichere »Seid Männer« und erhält Wiederholung und rhetorische Kraft.
- source_word: פְּלִשְׁתִּים
  choice: ihr Philister
  rationale: Die Anrede wird im Deutschen durch »ihr« eindeutig und natürlich wiedergegeben; ein feierliches »o« ist nicht erforderlich.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet die befürchtete Folge ein. »Sonst« gibt diese Warnung in modernem, direktem Deutsch prägnant wieder.
- source_word: תַּעַבְדוּ ... עָבְדוּ
  choice: dienen ... gedient haben
  rationale: עבד bezeichnet hier Dienst unter politisch-militärischer Unterwerfung und kann bis zur Versklavung reichen. Die gleiche deutsche Wortwurzel bewahrt die Wiederholung und lässt die im Hebräischen vorhandene Bedeutungsbreite offen; die stärkere mögliche Nuance wird in der Fußnote genannt.
- source_word: לָעִבְרִים
  choice: den Hebräern
  rationale: Der Quelltext verwendet ausdrücklich עִבְרִים, »Hebräer«, eine häufige Fremdbezeichnung; dies wird nicht zu »Israeliten« harmonisiert.
- source_word: וְנִלְחַמְתֶּם
  choice: und kämpft
  rationale: Die Verbform setzt die Aufforderung im Kontext idiomatisch fort. »Kämpft« ist unmittelbar und entspricht der bevorstehenden Schlacht.
theological_decisions:
- issue: Geschlechtlich markierte Kampfaufforderung לַאֲנָשִׁים
  choice: zeigt euch als Männer
  alternative: seid Männer; beweist Mut
  rationale: Die Adressaten sind philistäische Krieger, und der hebräische Ausdruck ist ausdrücklich männlich formuliert. Eine rein neutrale Wiedergabe wie »beweist Mut« würde diese rhetorische Markierung beseitigen; die gewählte Form erhält sie in natürlichem Deutsch.
- issue: Bedeutungsstärke von עבד bei militärischer Unterwerfung
  choice: dienen
  alternative: Sklaven sein; untertan sein
  rationale: Das Verb kann sowohl dienen als auch in Knechtschaft beziehungsweise Sklaverei stehen bedeuten. »Dienen« bewahrt die lexikalische Spannung und die Wiederholung, während die Fußnote verdeutlicht, dass erzwungene Unterwerfung gemeint sein kann, ohne die Ambiguität im Haupttext einseitig aufzulösen.
translation_notes:
  register: Modernes, direktes und würdiges Standarddeutsch. Die zweimalige Kampfaufforderung wird bewusst identisch wiederholt. »Ihr Philister« kennzeichnet die direkte Anrede ohne archaisierendes »o«; »sonst« hält die Warnung verständlich und energisch.
