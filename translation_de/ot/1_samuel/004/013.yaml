  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּב֗וֹא וְ/הִנֵּ֣ה עֵ֠לִי יֹשֵׁ֨ב עַֽל הַ/כִּסֵּ֜א יך דֶּ֨רֶךְ֙ מְצַפֶּ֔ה כִּֽי הָיָ֤ה לִבּ/וֹ֙ חָרֵ֔ד עַ֖ל אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/הָ/אִ֗ישׁ בָּ֚א לְ/הַגִּ֣יד בָּ/עִ֔יר וַ/תִּזְעַ֖ק כָּל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: de
  text: Als er kam, saß Eli dort auf dem Sitz am Wegesrand[a] und hielt Ausschau; denn sein Herz zitterte[b] um die Lade Gottes. Der Mann kam in die Stadt, um Bericht zu erstatten, und die ganze Stadt schrie auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „an der Hand/Seite des Weges“; gemeint ist ein Platz neben dem Weg.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „war voller Angst“ beziehungsweise „war beunruhigt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא וְהִנֵּה
  choice: Als er kam, saß Eli dort
  rationale: Das narrative וַיָּבוֹא führt die Handlung fort; וְהִנֵּה lenkt den Blick unvermittelt auf die vorgefundene Szene. Die deutsche Fassung gibt diesen Übergang natürlich wieder, ohne ein altertümliches „siehe“ zu erzwingen.
- source_word: יֹשֵׁב עַל הַכִּסֵּא
  choice: saß … auf dem Sitz
  rationale: כִּסֵּא bezeichnet einen Sitz beziehungsweise Stuhl, kann aber auch einen erhöhten oder amtlichen Sitz meinen. „Sitz“ bleibt gegenüber „Stuhl“ bewusst neutral.
- source_word: יַד דֶּרֶךְ
  choice: am Straßenrand
  rationale: Die Wendung bedeutet wörtlich etwa „an der Hand/Seite des Weges“ und bezeichnet idiomatisch einen Platz neben dem Weg.
- source_word: מְצַפֶּה
  choice: hielt Ausschau
  rationale: Das Partizip beschreibt anhaltendes, erwartungsvolles Beobachten und passt zu Elis banger Erwartung von Nachrichten.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: denn sein Herz zitterte
  rationale: חָרֵד kann körperliches Zittern ebenso wie Angst und innere Unruhe ausdrücken. Die konkrete hebräische Bildsprache bleibt erhalten.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: um die Lade Gottes
  rationale: עַל bezeichnet hier den Gegenstand von Elis Sorge. Im Deutschen drückt „um“ diese Sorge idiomatisch aus.
- source_word: לְהַגִּיד בָּעִיר
  choice: kam in die Stadt, um Bericht zu erstatten
  rationale: נגד im Hifil bedeutet mitteilen oder berichten; der Inhalt ist aus dem Zusammenhang als Nachricht von der Schlacht erschließbar. בָּעִיר bezeichnet hier den Ort der Meldung.
- source_word: וַתִּזְעַק כָּל הָעִיר
  choice: und die ganze Stadt schrie auf
  rationale: זעק bezeichnet einen lauten Not- oder Alarmschrei. „Schrie auf“ vermittelt die unmittelbare gemeinschaftliche Reaktion.
theological_decisions:
- issue: Art von Elis Reaktion auf die Lade Gottes
  choice: sein Herz zitterte um die Lade Gottes
  alternative: sein Herz war wegen der Lade Gottes voller Angst
  rationale: Die Übersetzung bewahrt sowohl die körperlich-bildhafte als auch die emotionale Bedeutung von חָרֵד und legt Elis Sorge nicht näher aus, als der Text es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hielt Ausschau“ und „schrie auf“ geben die lebendige Erzählbewegung natürlich wieder; „Lade Gottes“ bewahrt den etablierten biblischen Ausdruck. Die Fußnoten stehen an den jeweils sachlich passenden Textstellen.
