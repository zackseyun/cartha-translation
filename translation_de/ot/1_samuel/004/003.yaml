source:
  edition: WLC
  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: de
  text: 'Als das Volk ins Lager kam, sagten die Ältesten Israels: »Warum hat Jahwe uns heute vor den Philistern geschlagen? Holen wir die Lade des Bundes Jahwes aus Schilo zu uns, damit sie in unsere Mitte kommt[a] und uns aus der Hand unserer Feinde rettet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit er in unsere Mitte kommt und uns rettet«; dann beziehen sich die Verben im Singular unmittelbarer auf Jahwe, dessen Gegenwart mit der Lade verbunden ist.'
    reason: Alternative Deutung des nicht ausdrücklich genannten Subjekts der Verben im Singular; die Mehrdeutigkeit zwischen der Lade und Jahwes mit ihr verbundener Gegenwart bleibt erhalten.
lexical_decisions:
- source_word: הָעָם
  choice: das Volk
  rationale: Bewahrt die übliche Bedeutung des hebräischen Substantivs; der Zusammenhang des Lagers macht deutlich, dass hier die israelitische Streitmacht gemeint ist.
- source_word: הַמַּחֲנֶה
  choice: das Lager
  rationale: Im militärischen Zusammenhang die natürliche und präzise deutsche Entsprechung.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Bezeichnet in geläufiger biblischer Sprache die anerkannten führenden Männer Israels.
- source_word: נְגָפָנוּ
  choice: hat uns geschlagen
  rationale: Gibt sowohl Jahwes ausdrücklich genannte Urheberschaft als auch die militärische Niederlage wieder, ohne das kräftige Bild des hebräischen Verbs abzuflachen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder und ersetzt es nicht durch einen Titel.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: vor den Philistern
  rationale: Entspricht der hebräischen Präposition wörtlich und ist im Zusammenhang einer Niederlage verständlich.
- source_word: נִקְחָה אֵלֵינוּ
  choice: Holen wir ... zu uns
  rationale: Der Kohortativ formuliert einen Vorschlag. „Holen“ bezeichnet natürlich die beabsichtigte Bewegung der Lade von Schilo zum Lager; „zu uns“ bewahrt אֵלֵינוּ.
- source_word: מִשִּׁלֹה
  choice: aus Schilo
  rationale: Natürliche deutsche Wiedergabe der Herkunftsangabe mit dem Ortsnamen.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Folgt der hebräischen Genitivverbindung eng und bewahrt den Bundesbezug.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: damit sie in unsere Mitte kommt
  rationale: Die Lade ist das unmittelbar vorausgehende grammatische Bezugswort; die Zweckbeziehung und die räumliche Wendung בְקִרְבֵּנוּ bleiben erhalten.
- source_word: וְיֹשִׁעֵנוּ
  choice: und uns ... rettet
  rationale: Gibt den Hifil von ישׁע breit und theologisch offen wieder; die folgende Wendung bestimmt die Rettung als Befreiung aus Feindesgewalt.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: aus der Hand unserer Feinde
  rationale: Bewahrt das hebräische Bild der Hand als Macht- oder Herrschaftsbereich in verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezugswort der singularischen Verben וְיָבֹא und וְיֹשִׁעֵנוּ
  choice: „sie“ als Bezug auf die Lade
  alternative: „er“ als Bezug auf Jahwe
  rationale: Die Lade ist das unmittelbar vorausgehende grammatische Bezugswort und im Deutschen feminin. Zugleich kann die Aussage Jahwes mit der Lade verbundene Gegenwart meinen; diese theologisch bedeutsame Mehrdeutigkeit wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischer Sprachprägung. „Holen wir ... zu uns“ ist als natürlicher Vorschlag formuliert; „aus der Hand“ bewahrt bewusst das hebräische Bild. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
