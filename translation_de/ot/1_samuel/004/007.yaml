source:
  edition: WLC
  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: de
  text: 'Da fürchteten sich die Philister, denn sie sagten: »Gott[a] ist ins Lager gekommen!« Und sie sagten: »Wehe uns! Denn so etwas ist noch nie geschehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Gott ist ins Lager gekommen.« Das hebräische Wort für »Gott« hat eine pluralische Form, das zugehörige Verb steht jedoch im Singular und stützt daher die Wiedergabe im Haupttext.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: Da fürchteten sich
  rationale: Das Wayyiqtol von ירא bezeichnet die unmittelbare Reaktion der Philister. „Da fürchteten sich“ ist natürliches Erzähldeutsch und bewahrt den zeitlichen Fortgang.
- source_word: הַפְּלִשְׁתִּים
  choice: die Philister
  rationale: Etablierte deutsche Bezeichnung der Volksgruppe.
- source_word: כִּי אָמְרוּ
  choice: denn sie sagten
  rationale: כִּי führt hier die Begründung ihrer Furcht ein; „denn“ gibt diesen Zusammenhang klar und würdig wieder.
- source_word: בָּא אֱלֹהִים
  choice: Gott ist … gekommen
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, steht בָּא im Singular. Daher ist eine singularische Wiedergabe am stärksten begründet; die mögliche indefinite Deutung wird in der Fußnote erhalten.
- source_word: אֶל הַמַּחֲנֶה
  choice: ins Lager
  rationale: Die Präposition אֶל bezeichnet hier die Bewegung zum beziehungsweise in das israelitische Heerlager. „Ins Lager“ ist im Deutschen knapp und idiomatisch.
- source_word: אוֹי לָנוּ
  choice: Wehe uns!
  rationale: Die Wendung ist ein Ausruf von Angst und drohendem Unheil; „Wehe uns!“ bewahrt ihre starke, ernste Wirkung.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: so etwas ist … nicht geschehen
  rationale: Die idiomatische deutsche Formulierung drückt aus, dass ein solches Ereignis bislang ohne Beispiel war.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: noch nie
  rationale: Die Wortverbindung bedeutet idiomatisch „früher, bisher“ und ist nicht auf die beiden unmittelbar vorausgehenden Tage zu beschränken. Zusammen mit der Negation gibt „noch nie“ den Sinn natürlich wieder.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Rede der Philister
  choice: Gott
  alternative: ein Gott
  rationale: Das singularische Verb בָּא spricht deutlich für einen einzelnen Referenten. Zugleich stammt die Aussage von Philistern, sodass „ein Gott“ als mögliche Wahrnehmung der Sprecher nicht ausgeschlossen und deshalb in einer Fußnote bewahrt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt eindringlich, ohne unnötig archaisch zu wirken.
