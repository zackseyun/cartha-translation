  yaml_path: translation/ot/1_samuel/004/022.yaml
  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: de
  text: 'Und sie sagte: „Die Herrlichkeit ist von Israel gewichen[a], denn[b] die Lade Gottes ist weggenommen worden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Herrlichkeit ist aus Israel ins Exil gegangen.“ Das hebräische Verb kann Fortgehen oder Entferntwerden bezeichnen und auch die Nuance des Exils haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil die Lade Gottes weggenommen worden ist.“ Das hebräische Bindewort führt hier den Grund für die Aussage an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Und sie sagte
  rationale: Das Waw mit der Erzählform führt die Handlung fort. „Und sie sagte“ gibt dies schlicht und in würdigem modernem Deutsch wieder.
- source_word: גָּלָה
  choice: ist … gewichen
  rationale: Das Verb bezeichnet ein Fortgehen oder Entferntwerden und kann besonders auch das Gehen ins Exil ausdrücken. Bei „Herrlichkeit“ ist „ist … gewichen“ natürlich, ohne die im Hebräischen vorhandene Exilbedeutung auszuschließen; diese wird in der Fußnote genannt.
- source_word: כָבוֹד
  choice: die Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt hier das theologische Gewicht des Ausdrucks und den Zusammenhang mit Gottes Gegenwart und Ehre, ohne ihn auf Israels nationale Ehre zu verengen.
- source_word: מִיִּשְׂרָאֵל
  choice: von Israel
  rationale: Die Präposition bezeichnet Trennung beziehungsweise Entfernung; „von Israel“ ist die natürliche deutsche Wiedergabe.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier den Grund für die vorausgehende Aussage an. „Denn“ wahrt den Satzfluss und den begründenden Zusammenhang.
- source_word: נִלְקַח
  choice: ist weggenommen worden
  rationale: Die Nifalform ist passiv. „Weggenommen“ bleibt näher am allgemeinen Sinn von לקח als das stärker deutende „erbeutet“ oder „gefangen genommen“.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Die traditionelle und verständliche Wendung gibt die hebräische Genitivverbindung direkt wieder, ohne zusätzliche Bezeichnungen in den Text einzutragen.
theological_decisions:
- issue: Bedeutung der „Herrlichkeit“ im Verhältnis zu Israel und zur Lade
  choice: Die Formulierung bezeichnet den Verlust beziehungsweise das Weichen der mit Gottes Gegenwart verbundenen Herrlichkeit aus Israel, ohne eine technische Lehre über Gottes Gegenwart in der Lade festzulegen.
  alternative: „Herrlichkeit“ könnte ausschließlich Israels nationale Ehre bezeichnen oder als unmittelbare Umschreibung dafür verstanden werden, dass Gott selbst fortgegangen sei.
  rationale: Der unmittelbare Zusammenhang verbindet die Aussage mit der Wegnahme der Lade und verleiht ihr mehr als nur militärische Bedeutung. Zugleich definiert der Vers nicht metaphysisch, wie Gottes Gegenwart zur Lade steht; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Lade Gottes“ und „Herrlichkeit“ bewahren die vertraute Ausdrucksweise; passive und kausale Beziehungen des Hebräischen bleiben ausdrücklich erhalten.
