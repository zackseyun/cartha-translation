  text: וַ/יִּשְׁלַ֤ח הָ/עָם֙ שִׁלֹ֔ה וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם אֵ֣ת אֲר֧וֹן בְּרִית יְהוָ֛ה צְבָא֖וֹת יֹשֵׁ֣ב הַ/כְּרֻבִ֑ים וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י עִם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים חָפְנִ֖י וּ/פִֽינְחָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: de
  text: Da sandte das Volk nach Schilo, und man holte von dort die Bundeslade Jahwes der Heerscharen, der über den Kerubim thront.[a] Dort waren die beiden Söhne Elis, Hofni und Pinhas, bei der Bundeslade Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der bei/auf den Kerubim sitzt«; im Kontext auch: »der zwischen den Kerubim thront«. Das Hebräische bestimmt die räumliche Beziehung nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: Da sandte das Volk nach Schilo
  rationale: Das kollektive Subjekt bleibt im Singular; ein nicht ausdrücklich genanntes Objekt wie »Männer« wird nicht ergänzt. »Da« führt die Erzählung natürlich fort.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: und man holte von dort
  rationale: נשא bezeichnet hier das Aufnehmen und Befördern der Lade. »holte« gibt die zielgerichtete Bewegung aus Schilo im Deutschen natürlich wieder, ohne ein unausgedrücktes Objekt der Sendung einzufügen.
- source_word: אֲרוֹן בְּרִית
  choice: die Bundeslade
  rationale: »Bundeslade« ist die geläufige, transparente deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwes der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; »Heerscharen« bewahrt die Breite von צְבָאוֹת und die etablierte Titelform.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: der über den Kerubim thront
  rationale: »thront« bringt die königliche Bedeutung der kultischen Formel zum Ausdruck. Die Präposition »über« ist eine kontextuelle Deutung und wird deshalb durch eine Fußnote als nicht ausdrücklich im Hebräischen markiert.
- source_word: וְשָׁם שְׁנֵי בְנֵי עֵלִי
  choice: Dort waren auch die beiden Söhne Elis
  rationale: Die Ortsangabe wird als natürlicher deutscher Satzanfang beibehalten; »auch« stellt den begleitenden Anschluss her.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: bei der Bundeslade Gottes
  rationale: עִם bedeutet grundsätzlich »mit«; im gegebenen Ortszusammenhang drückt idiomatisches »bei« die Anwesenheit an der Lade aus, ohne eine präzisere räumliche Position festzulegen.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni und Pinhas
  rationale: Die Eigennamen folgen geläufigen deutschen Bibelschreibungen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה im Titel יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen / Jahwe der Heere
  rationale: Die Wiedergabe »Jahwe« bewahrt den im Ausgangstext stehenden Eigennamen. »Heerscharen« lässt offen, ob himmlische oder irdische Heere im Vordergrund stehen.
- issue: Deutung der Formel יֹשֵׁב הַכְּרֻבִים
  choice: der über den Kerubim thront
  alternative: der zwischen den Kerubim thront / der bei den Kerubim thront
  rationale: Der Kontext der Lade legt eine Thronvorstellung nahe, doch die genaue räumliche Beziehung bleibt im Hebräischen offen. Die Hauptfassung ist idiomatisch; die Fußnote bewahrt die Ambiguität.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Terminologie. Der Satzbau bleibt erzählerisch klar; unnötig altertümliche Formen werden vermieden. Der Gottesname wird als »Jahwe« wiedergegeben.
