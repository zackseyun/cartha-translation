  text: וּ/כְ/עֵ֣ת מוּתָ֗/הּ וַ/תְּדַבֵּ֨רְנָה֙ הַ/נִּצָּב֣וֹת עָלֶ֔י/הָ אַל תִּֽירְאִ֖י כִּ֣י בֵ֣ן יָלָ֑דְתְּ וְ/לֹ֥א עָנְתָ֖ה וְ/לֹא שָׁ֥תָה לִבָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: de
  text: 'Als sie im Sterben lag, sagten die Frauen, die bei ihr standen: »Fürchte dich nicht, denn du hast einen Sohn geboren.« Doch sie antwortete nicht und beachtete es nicht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie richtete ihr Herz nicht darauf«; das heißt, sie schenkte dem Gesagten keine Beachtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: Als sie im Sterben lag
  rationale: Die hebräische Zeitangabe bezeichnet den Zeitpunkt beziehungsweise die Phase ihres Sterbens. Die deutsche Formulierung ist natürlich und bewahrt den Vorgangscharakter von מוּת.
- source_word: וַתְּדַבֵּרְנָה
  choice: sagten
  rationale: Die feminine Pluralform führt die direkte Rede der anwesenden Frauen ein; »sagten« ist im Deutschen die natürliche Erzählform.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: die Frauen, die bei ihr standen
  rationale: Die substantivisch gebrauchte feminine Pluralform bezeichnet die bei ihr stehenden beziehungsweise sie betreuenden Frauen. Die Übersetzung bewahrt das konkrete Bild, ohne eine besondere Funktion vorauszusetzen.
- source_word: אַל תִּירְאִי
  choice: Fürchte dich nicht
  rationale: Die verneinte Aufforderung wird knapp, würdevoll und in geläufiger biblischer Ausdrucksweise wiedergegeben.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: denn du hast einen Sohn geboren
  rationale: כִּי begründet den Zuspruch; ילד bezeichnet hier unmittelbar das Gebären eines Sohnes.
- source_word: וְלֹא עָנְתָה
  choice: Doch sie antwortete nicht
  rationale: ענה bedeutet in diesem Zusammenhang »antworten«. »Doch« macht im Deutschen den Gegensatz zwischen dem Zuspruch und ihrer ausbleibenden Reaktion deutlich.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: und nahm es sich nicht zu Herzen
  rationale: Die Wiedergabe erhält die hebräische Herz-Metaphorik. Das Idiom kann zugleich bedeuten, dass sie dem Gesagten keine Beachtung schenkte; diese Bedeutungsweite wird in der Fußnote erläutert.
