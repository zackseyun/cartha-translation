  text: וַ/יָּ֤רָץ אִישׁ בִּנְיָמִן֙ מֵ/הַ/מַּ֣עֲרָכָ֔ה וַ/יָּבֹ֥א שִׁלֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וּ/מַדָּ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: de
  text: Da lief ein Benjaminiter von der Schlachtlinie[a] und kam noch am selben Tag nach Schilo, mit zerrissenen Kleidern und Erde auf dem Kopf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Schlachtfeld“ oder „aus den Reihen“. Das hebräische Wort bezeichnet genauer die Schlachtordnung beziehungsweise die Kampflinie.'
    reason: lexical_alternative
  - marker: b
    text: Zerrissene Kleider und Erde auf dem Kopf waren übliche Zeichen von Trauer, Bestürzung oder schwerem Unglück.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: lief
  rationale: Das Verb רוץ bezeichnet schnelles Laufen. „Lief“ gibt die Bewegung wieder, ohne wie „floh“ ein im Verb nicht ausdrücklich genanntes Motiv hinzuzufügen.
- source_word: אִישׁ בִּנְיָמִן
  choice: ein Benjaminiter
  rationale: Die Wendung bezeichnet einen Mann aus dem Stamm Benjamin. „Ein Benjaminiter“ ist im Deutschen knapp, natürlich und eindeutig.
- source_word: מֵהַמַּעֲרָכָה
  choice: von der Schlachtreihe
  rationale: מַעֲרָכָה bezeichnet hier die militärische Aufstellung beziehungsweise die Linie des Kampfgeschehens und ist genauer als das allgemeinere „Schlacht“.
- source_word: וַיָּבֹא שִׁלֹה
  choice: kam … nach Schilo
  rationale: בוא mit Zielangabe wird im Deutschen idiomatisch mit „nach Schilo kommen“ wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: noch am selben Tag
  rationale: Wörtlich heißt die Wendung „an jenem Tag“. Im Zusammenhang bringt „noch am selben Tag“ die zeitliche Unmittelbarkeit natürlich zum Ausdruck, ohne den Sinn zu verändern.
- source_word: וּמַדָּיו
  choice: seine Kleider
  rationale: Das pluralische מַדִּים bezeichnet Kleidung beziehungsweise Gewänder. „Kleider“ ist verständlich und dem erzählerischen Register angemessen.
- source_word: קְרֻעִים
  choice: waren zerrissen
  rationale: Das passive Partizip von קרע beschreibt den Zustand der Kleidung und wird im Deutschen klar mit „waren zerrissen“ wiedergegeben.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: auf seinem Kopf lag Erde
  rationale: אֲדָמָה bedeutet Erde oder Erdboden. „Erde“ bleibt näher am konkreten hebräischen Wort als das kontextuell mögliche „Staub“.
