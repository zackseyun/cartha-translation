  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: de
  text: 'Und die Lade Gottes wurde erbeutet, und die beiden Söhne Elis starben: Hofni und Pinhas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: die Lade Gottes
  rationale: Die deutsche Konstruktion gibt die hebräische Status-constructus-Verbindung genau und in der etablierten biblischen Bezeichnung natürlich wieder.
- source_word: נִלְקָח
  choice: wurde erbeutet
  rationale: Der Nifal drückt hier passives Ergriffenwerden aus; im unmittelbaren Kriegskontext bezeichnet „erbeutet“ präzise die Wegnahme durch den Feind.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: und die beiden Söhne Elis
  rationale: „Die beiden“ macht die kontextuelle Bestimmtheit des bekannten Brüderpaars deutlich; „Elis“ ist im Deutschen die natürliche Genitivform.
- source_word: מֵתוּ
  choice: starben
  rationale: Das Qal-Perfekt von מות berichtet schlicht ihren Tod, ohne zusätzliche Bildsprache.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni und Pinhas
  rationale: Die Namen folgen gebräuchlichen deutschen Bibelschreibungen und bleiben wie im Hebräischen als nachgestellte Apposition erhalten.
