id: 1SA.4.6
reference: 1 Samuel 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: de
  text: 'Als die Philister den Klang des Jubelgeschreis[a] hörten, sagten sie: »Was ist das für ein lautes Jubelgeschrei im Lager der Hebräer?« Da erfuhren sie, dass die Lade Jahwes[b] ins Lager gekommen war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des lauten Rufes“ bzw. im militärischen Zusammenhang „des Kriegsgeschreis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „des HERRN“. Im Hebräischen steht der Gottesname יהוה (JHWH).'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: Klang
  rationale: Das Wort bezeichnet hier das hörbare Geräusch des israelitischen Jubels, nicht eine einzelne Stimme. „Klang“ lässt sich in beiden Satzteilen sinngemäß natürlich wiedergeben.
- source_word: תְּרוּעָה
  choice: Jubelgeschrei
  rationale: Das Substantiv kann einen lauten Ruf, Alarm- oder Kriegsschrei bezeichnen. Im unmittelbaren Zusammenhang mit der freudigen Reaktion Israels in Vers 5 gibt „Jubelgeschrei“ den Sinn wieder, ohne einen militärischen Signalruf vorauszusetzen.
- source_word: מֶה
  choice: Was ist das für ein
  rationale: Die idiomatische deutsche Frage erkundigt sich wie das Hebräische nach Art oder Bedeutung des auffälligen Geräuschs.
- source_word: הַגְּדוֹלָה
  choice: laut
  rationale: Wörtlich bedeutet das Adjektiv „groß“; auf ein Geräusch bezogen bezeichnet es hier dessen Stärke. „Laut“ ist im modernen Deutschen die natürliche Wiedergabe.
- source_word: מַחֲנֶה
  choice: Lager
  rationale: Der Ausdruck bezeichnet in diesem Erzählzusammenhang ein militärisches Lager und wird an beiden Stellen einheitlich wiedergegeben.
- source_word: הָעִבְרִים
  choice: die Hebräer
  rationale: Die ethnische Bezeichnung der Philister wird bewahrt und nicht zu „Israeliten“ vereinheitlicht.
- source_word: וַיֵּדְעוּ
  choice: Da erfuhren sie
  rationale: Die Form bezeichnet hier das Erlangen neuer Kenntnis. „Erfuhren“ bringt diesen ingressiven Sinn natürlicher zum Ausdruck als das statische „wussten“.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: אֲרוֹן wird als „Lade“ und der Gottesname יהוה als „Jahwe“ wiedergegeben; der Genitiv bildet die hebräische Verbindung knapp und klar ab.
- source_word: בָּא
  choice: ins Lager gekommen war
  rationale: Die Handlung war zu dem Zeitpunkt, als die Philister davon erfuhren, bereits abgeschlossen; das deutsche Plusquamperfekt macht diese zeitliche Abfolge deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und lebendig; „Hebräer“ wahrt die Perspektive der Philister.
