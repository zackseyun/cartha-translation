base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: de
  text: 'Der Bote antwortete: „Israel ist vor den Philistern geflohen, und unter dem Volk hat es eine schwere Niederlage[a] gegeben. Auch deine beiden Söhne, Hofni und Pinhas, sind tot, und die Lade Gottes ist weggenommen worden[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen schweren Schlag“ beziehungsweise „ein großes Gemetzel“. Das hebräische Wort kann einen schweren Schlag, eine Plage oder ein Gemetzel bezeichnen; hier geht es um eine militärische Katastrophe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ist erbeutet worden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: der Bote
  rationale: Das Partizip bezeichnet hier den Überbringer der Nachricht. „Der Bote“ ist im Deutschen natürlich und dem Erzählzusammenhang angemessen.
- source_word: נָס
  choice: ist geflohen
  rationale: Das Verb bedeutet „fliehen“. Das deutsche Perfekt passt zur unmittelbaren Meldung über das soeben Geschehene, ohne bereits ausdrücklich eine vernichtende Flucht oder Aufreibung auszudeuten.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: vor den Philistern
  rationale: Die Wendung bezeichnet die Flucht vor einem feindlichen Heer. „Vor den Philistern“ ist knapp, idiomatisch und quellennah.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: eine schwere Niederlage
  rationale: מַגֵּפָה bezeichnet einen schweren Schlag, der je nach Zusammenhang auch Plage oder Gemetzel bedeuten kann. Im militärischen Kontext ist „schwere Niederlage“ verständlich, wahrt aber mehr von der lexikalischen Offenheit als „Gemetzel“.
- source_word: בָעָם
  choice: unter dem Volk
  rationale: Die Übersetzung erhält das allgemeine „Volk“, obwohl im Zusammenhang die israelitischen Kämpfer gemeint sind.
- source_word: שְׁנֵי בָנֶיךָ
  choice: deine beiden Söhne
  rationale: „Beide“ gibt die bestimmte Zweizahl im natürlichen Deutschen wieder.
- source_word: מֵתוּ
  choice: sind tot
  rationale: Das hebräische Perfekt meldet den eingetretenen Tod. Im Deutschen klingt „sind tot“ in dieser Nachricht unmittelbar und natürlich.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni und Pinhas
  rationale: Die Namen folgen geläufigen deutschen Bibelschreibungen und bilden die hebräischen Namen erkennbar ab.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Dies ist die traditionelle und weiterhin verständliche deutsche Wiedergabe der bezeichneten heiligen Truhe; der Genitiv bleibt unverändert erhalten.
- source_word: נִלְקָחָה
  choice: ist weggenommen worden
  rationale: Die passive Form wird bewahrt. Im Kontext ist auch „erbeutet“ oder „gefangen genommen“ möglich, doch „weggenommen“ bleibt näher am Grundverb.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die gestufte Hiobsbotschaft wird durch kurze, aneinandergereihte Meldungen bewahrt. Das formelhafte hebräische „antwortete und sagte“ wird natürlich zu „antwortete“ verdichtet; die inhaltliche Mehrdeutigkeit von מַגֵּפָה und נִלְקָחָה wird in den Fußnoten offengehalten.
