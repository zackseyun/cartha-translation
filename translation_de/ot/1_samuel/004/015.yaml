  yaml_path: translation/ot/1_samuel/004/015.yaml
  text: Eli was ninety-eight years old[a], and his eyes were fixed so that he could not see.
translation:
  language: de
  text: Eli war achtundneunzig Jahre alt. Seine Augen waren starr geworden[a], sodass er nicht sehen konnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fest/unbeweglich geworden. Das Hebräische beschreibt den Zustand seiner Augen mit einem ungewöhnlichen Ausdruck, der hier seine Blindheit bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה
  choice: war achtundneunzig Jahre alt
  rationale: Die hebräische Wendung »Sohn von achtundneunzig Jahren« bezeichnet idiomatisch das Lebensalter und wird im modernen Deutschen natürlich wiedergegeben.
- source_word: וְעֵינָיו
  choice: Seine Augen
  rationale: Direkte Wiedergabe des Plurals mit Suffix der 3. Person Singular; ein neuer deutscher Satz sorgt für einen klaren, natürlichen Erzählfluss.
- source_word: קָמָה
  choice: waren starr geworden
  rationale: Die ungewöhnliche Zustandsbeschreibung der Augen wird konkret bewahrt. »Starr geworden« ist im Deutschen verständlich und vermeidet die stärker deutende Wiedergabe »trüb geworden«.
- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: sodass er nicht mehr sehen konnte
  rationale: »Sodass« macht den aus dem Zusammenhang hervorgehenden Zusammenhang zwischen dem Zustand seiner Augen und seiner Blindheit deutlich. »Nicht mehr« entspricht in diesem Alterskontext natürlichem Deutsch, ohne den Sinn wesentlich zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete und etwas ungewöhnliche Bildsprache für Elis Augen bleibt im Haupttext erhalten; die geläufigeren lexikalischen Möglichkeiten stehen in der Fußnote. Auf einen einleitenden deutschen Diskursmarker wie »Nun« wurde verzichtet, da im Hebräischen kein entsprechendes Zeitadverb steht.
