  text: וַ/יִּלָּחֲמ֣וּ פְלִשְׁתִּ֗ים וַ/יִּנָּ֤גֶף יִשְׂרָאֵל֙ וַ/יָּנֻ֨סוּ֙ אִ֣ישׁ לְ/אֹהָלָ֔י/ו וַ/תְּהִ֥י הַ/מַּכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שְׁלֹשִׁ֥ים אֶ֖לֶף רַגְלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: de
  text: Da kämpften die Philister, und Israel wurde geschlagen. Jeder floh zu seinem Zelt[a]. Die Niederlage war überaus schwer[b], und von Israel fielen dreißigtausend Fußsoldaten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jeder floh nach Hause.“ Wörtlich steht im Hebräischen „zu seinem Zelt“; die Wendung kann allgemein den eigenen Wohnort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Das Gemetzel war überaus groß.“ Wörtlich: „Der Schlag war überaus groß.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: Da kämpften die Philister
  rationale: Die narrative Verbform führt das Geschehen unmittelbar fort; „kämpften“ gibt die militärische Handlung knapp und natürlich wieder.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: Israel wurde geschlagen
  rationale: נגף bezeichnet im Kampf die erlittene Niederlage. „Wurde geschlagen“ bewahrt zugleich das Bild des hebräischen Verbs und ist im Deutschen als militärische Wendung verständlich.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: Jeder floh zu seinem Zelt
  rationale: אישׁ wird distributiv mit „jeder“ wiedergegeben. „Zelt“ wahrt die konkrete Formulierung des Hebräischen, kann hier aber auch allgemein die jeweilige Unterkunft oder Heimat bezeichnen.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: Die Niederlage war überaus schwer
  rationale: מכה bedeutet wörtlich „Schlag“ und bezeichnet hier den schweren militärischen Verlust. „Niederlage“ ist im Kontext natürlich, ohne die Wendung ausschließlich auf das Töten zu verengen.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: von Israel fielen
  rationale: נפל ist die übliche militärische Ausdrucksweise für den Tod im Kampf; „fielen“ bewahrt diesen würdevollen und knappen Sprachgebrauch.
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: dreißigtausend Fußsoldaten
  rationale: רגלי bezeichnet Kämpfer zu Fuß. „Fußsoldaten“ ist transparentes modernes Deutsch und unterscheidet sie von berittenen Truppen.
theological_decisions: []
