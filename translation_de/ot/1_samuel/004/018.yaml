  text: וַ/יְהִ֞י כְּ/הַזְכִּיר֣/וֹ אֶת אֲר֣וֹן הָ/אֱלֹהִ֗ים וַ/יִּפֹּ֣ל מֵֽ/עַל הַ֠/כִּסֵּא אֲחֹ֨רַנִּ֜ית בְּעַ֣ד יַ֣ד הַ/שַּׁ֗עַר וַ/תִּשָּׁבֵ֤ר מַפְרַקְתּ/וֹ֙ וַ/יָּמֹ֔ת כִּֽי זָקֵ֥ן הָ/אִ֖ישׁ וְ/כָבֵ֑ד וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל אַרְבָּעִ֥ים שָׁנָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: de
  text: 'Und es geschah: Als er die Lade Gottes erwähnte, fiel Eli rückwärts vom Sitz neben dem Tor. Dabei brach er sich das Genick und starb; denn der Mann war alt und schwer[a]. Er richtete Israel vierzig Jahre lang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schwer“. Das Wort kann darauf hinweisen, dass Elis Körpergewicht zusammen mit seinem Alter zum tödlichen Ausgang des Sturzes beitrug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: als er … erwähnte
  rationale: Der Hifil von זכר bedeutet hier „erwähnen“; כְּ markiert den zeitlichen Zusammenhang.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Direkte und im biblischen Erzählzusammenhang geläufige Wiedergabe der Status-constructus-Verbindung.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: fiel … rückwärts
  rationale: Gibt Verb und Richtungsadverb knapp und natürlich wieder.
- source_word: הַכִּסֵּא
  choice: der Sitz
  rationale: כִּסֵּא kann Sitz, Stuhl oder Thron bedeuten; hier ist „Sitz“ die neutrale, kontextgerechte Wahl.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: neben dem Tor
  rationale: Natürliche deutsche Wiedergabe der örtlichen Wendung, die wörtlich etwa „an/bei der Hand des Tores“ lautet.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: Dabei brach er sich das Genick
  rationale: מַפְרֶקֶת bezeichnet Hals beziehungsweise Genick; die deutsche Wendung drückt die tödliche Verletzung idiomatisch aus.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: denn der Mann war alt und schwer
  rationale: „Schwer“ bewahrt den einfachen Sinn von כָבֵד, ohne ihn interpretierend auf „übergewichtig“ einzuengen.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: hatte Israel … als Richter geführt
  rationale: שׁפט bezeichnet hier Elis Amt als Richter; die Formulierung ist im modernen Deutsch verständlicher als „Israel richten“ und bewahrt die Amtsfunktion.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: Direkte Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Referenz von אֱלֹהִים in אֲרוֹן הָאֱלֹהִים
  choice: Gott
  alternative: Götter
  rationale: Im Erzählzusammenhang ist eindeutig Israels Gott gemeint; daher ist die Singularwiedergabe erforderlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze erhalten den raschen Erzählfluss. „Als Richter geführt“ macht die institutionelle Bedeutung von שׁפט verständlich, ohne Eli als König oder bloßen Rechtsentscheider darzustellen.
