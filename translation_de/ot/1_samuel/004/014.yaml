  terminology: Eli ist die übliche deutsche Namensform. »Geschrei« für צְעָקָה und »Lärm« für הָמוֹן sind kontextgerecht; die Wiederholung ist im Deutschen hier verständlich und spiegelt die zwei unterschiedlichen hebräischen Klangbezeichnungen hinreichend wider.
