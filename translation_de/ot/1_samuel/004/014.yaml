base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: de
  text: 'Als Eli den Klang des Geschreis[a] hörte, sagte er: »Was ist das für ein Lärm?« Der Mann eilte herbei und berichtete Eli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Klang des Aufschreis«.'
    reason: Lexikalische Alternative für קוֹל הַצְּעָקָה; der Marker ist bei der entsprechenden Wendung gesetzt.
lexical_decisions:
- source_word: קוֹל הַצְּעָקָה
  choice: das laute Geschrei
  rationale: קוֹל bezeichnet das hörbare Geräusch, während צְעָקָה einen lauten, oft von Not geprägten Aufschrei meint. Im Deutschen gibt »das laute Geschrei« beide Aspekte natürlich wieder.
- source_word: מֶה קוֹל הֶהָמוֹן הַזֶּה
  choice: Was bedeutet dieser Lärm?
  rationale: Wörtlich etwa »Was ist der Schall dieses Getümmels?« Die Frage zielt im Kontext auf den Anlass beziehungsweise die Bedeutung des hörbaren Tumults. Die gewählte Formulierung ist idiomatisch, ohne dessen Ursache vorwegzunehmen.
- source_word: הֶהָמוֹן
  choice: Lärm
  rationale: הָמוֹן bezeichnet hier eine hörbare Unruhe oder ein Getümmel. »Lärm« ist gegenwärtiges, allgemein verständliches Deutsch; mögliche Alternativen werden in der Fußnote genannt.
- source_word: וְהָאִישׁ
  choice: Da ... der Mann
  rationale: Der hebräische Text sagt ausdrücklich »der Mann« und identifiziert ihn hier nicht erneut als Boten. »Da« bildet den narrativen Fortgang natürlich ab.
- source_word: מִהַר וַיָּבֹא
  choice: eilte ... herbei
  rationale: Die beiden Verben bezeichnen sein eiliges Kommen. »eilte herbei« gibt dies knapp und ohne die im Deutschen schwerfällige Doppelung »beeilte sich und kam« wieder.
- source_word: וַיַּגֵּד לְעֵלִי
  choice: berichtete Eli alles
  rationale: נגד im Hifil bedeutet mitteilen oder berichten. Das deutsche Verb »berichten« kann ohne ausdrückliches Objekt stehen; »alles« verdeutlicht idiomatisch den Inhalt, ist aber im Hebräischen nicht eigens ausgedrückt.
- source_word: עֵלִי
  choice: Eli
  rationale: Der Personenname wird nach der geläufigen deutschen biblischen Form wiedergegeben.
