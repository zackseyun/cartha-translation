base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: de
  text: Die Philister stellten sich Israel zum Kampf entgegen, und die Schlacht weitete sich aus[a]. Israel wurde von den Philistern besiegt; die Philister erschlugen in der Schlachtreihe auf dem Feld etwa viertausend Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und es kam zur Schlacht“. Das hebräische Verb kann hier den Beginn des Kampfes oder dessen Ausbreitung zum Gefecht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ פְלִשְׁתִּים לִקְרַאת יִשְׂרָאֵל
  choice: Die Philister stellten sich Israel zum Kampf entgegen
  rationale: ערך bezeichnet im militärischen Zusammenhang das Aufstellen der Truppen; לִקְרַאת drückt die Bewegung beziehungsweise Ausrichtung zur Begegnung aus. Die Formulierung ist im Deutschen natürlich und macht den militärischen Kontext deutlich.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: die Schlacht breitete sich aus
  rationale: Die ungewöhnliche Verbindung mit נטש kann das Sich-Ausbreiten oder Einsetzen des Kampfgeschehens bezeichnen. Die bildnahe Wiedergabe erhält die Mehrdeutigkeit; die geläufigere Alternative wird in der Fußnote genannt.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל לִפְנֵי פְלִשְׁתִּים
  choice: Israel wurde von den Philistern besiegt
  rationale: Das Niphal von נגף bezeichnet hier eine militärische Niederlage. Das deutsche Passiv mit „von“ gibt den idiomatischen Sinn von לִפְנֵי klar wieder, ohne ihn unnatürlich wörtlich als „vor“ abzubilden.
- source_word: וַיַּכּוּ
  choice: erschlugen sie
  rationale: נכה bezeichnet in diesem Kampf- und Verlustkontext tödliches Niederschlagen. Das Subjekt sind dem Zusammenhang nach die Philister.
- source_word: בַמַּעֲרָכָה
  choice: in der Schlachtreihe
  rationale: מַעֲרָכָה bezeichnet die militärische Aufstellung beziehungsweise Schlachtreihe. Die Wahl bewahrt den konkreten militärischen Bezug.
- source_word: בַשָּׂדֶה
  choice: auf dem Feld
  rationale: Die schlichte Wiedergabe entspricht dem hebräischen Ausdruck, ohne die nicht ausdrücklich vorhandene Vorstellung eines „offenen“ Feldes hinzuzufügen.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: etwa viertausend Mann
  rationale: כְּ vor der Zahl bezeichnet eine ungefähre Angabe. אִישׁ ist hier die Zählbezeichnung für die männlichen Kämpfer.
