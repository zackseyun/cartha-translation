  source_fidelity: Die Wiedergabe trifft die militärische Aufstellung, die unsichere Aussage über den Verlauf der Schlacht, Israels Niederlage und die ungefähre Zahl der Getöteten insgesamt gut. Das im Hebräischen nur erschlossene Subjekt von וַיַּכּוּ sind im Kontext die Philister; im Deutschen kann das nach dem Passivsatz folgende „sie“ jedoch kurz auf Israel bezogen werden.
