  terminology: „Schlachtreihe“, „auf dem Feld“ und „etwa viertausend Mann“ sind sachgerecht. Die Fußnote markiert die lexikalische Unsicherheit von וַתִּטֹּשׁ angemessen, ohne sie dogmatisch aufzulösen.
