reference: 1 Samuel 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: א֣וֹי לָ֔/נוּ מִ֣י יַצִּילֵ֔/נוּ מִ/יַּ֛ד הָ/אֱלֹהִ֥ים הָ/אַדִּירִ֖ים הָ/אֵ֑לֶּה אֵ֧לֶּה הֵ֣ם הָ/אֱלֹהִ֗ים הַ/מַּכִּ֧ים אֶת מִצְרַ֛יִם בְּ/כָל מַכָּ֖ה בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: de
  text: Wehe uns! Wer wird uns aus der Hand dieser mächtigen Götter retten? Das sind die Götter, die Ägypten in der Wüste mit jeder Plage schlugen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieses mächtigen Gottes«. Die Philister sprechen in pluralischen Formen und geben damit ihr eigenes Verständnis von Israels Gott wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in der Wüste«. Die Wendung ist in diesem Zusammenhang schwierig, weil die Plagen Ägypten vor Israels Wüstenwanderung trafen. Die Übersetzung folgt dem masoretischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: Wehe uns!
  rationale: Die feste deutsche Wendung bewahrt den eindringlichen Ausdruck von Angst und drohendem Unheil.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: Wer wird uns … retten?
  rationale: נצל im Hifil bedeutet „retten, entreißen“. Das Futur erhält die Form der hebräischen Frage, deren Verzweiflung sich aus dem Zusammenhang ergibt.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die verständliche deutsche Wendung bewahrt das hebräische Bild für Macht und Gewalt.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: diese mächtigen Götter
  rationale: Der Plural von Adjektiv und Demonstrativ sowie die Perspektive der Philister sprechen für den Plural; „mächtig“ gibt אַדִּירִים natürlich wieder.
- source_word: אֵלֶּה הֵם
  choice: Das sind
  rationale: Natürliche deutsche Identifikationsformel, die den Sinn der hebräischen Konstruktion wiedergibt.
- source_word: הַמַּכִּים אֶת מִצְרַיִם
  choice: die Ägypten … schlugen
  rationale: Das Partizip wird als Relativsatz über eine bekannte vergangene Handlung wiedergegeben; „Ägypten“ kann Land und Volk kollektiv bezeichnen.
- source_word: בְּכָל מַכָּה
  choice: mit jeder Plage
  rationale: Die Wiedergabe bleibt eng bei „mit jeder Plage/jedem Schlag“ und vermeidet den nicht ausdrücklich vorhandenen Zusatz „Art von“.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Die masoretische Lesart wird trotz ihrer sachlichen Schwierigkeit direkt wiedergegeben und nicht harmonisiert.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Rede der Philister
  choice: Götter
  alternative: Gott / Gott (mit grammatisch pluralischen Bezügen)
  rationale: Die ausdrücklich pluralischen Begleitformen spiegeln die polytheistische Deutung der Philister. Die Übersetzung bewahrt diese Sprecherperspektive, ohne sie als Aussage des Erzählers zu bestätigen.
- issue: Sachlich schwierige Ortsangabe בַּמִּדְבָּר
  choice: in der Wüste
  alternative: Auslassung, Umstellung oder harmonisierende Deutung
  rationale: Der masoretische Text enthält die Wendung, obwohl die Plagen Ägypten vor Israels Wüstenwanderung trafen. Diese Spannung wird im Text erhalten und in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ausrufe- und Fragesätze bewahren die panische Redeweise der Philister; die ungewöhnliche theologische und historische Spannung wird nicht geglättet.
