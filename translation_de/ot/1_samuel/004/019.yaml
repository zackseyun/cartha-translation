translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Erzählweise. „Lade Gottes“ folgt dem etablierten biblischen Sprachgebrauch; „Pinhas“ entspricht der heute verbreiteten deutschen Umschrift. Die idiomatische Schlusswendung wird verständlich wiedergegeben und zugleich in der Fußnote wörtlich erschlossen.
