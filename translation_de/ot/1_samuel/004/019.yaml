base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: de
  text: Seine Schwiegertochter, die Frau des Pinhas, war schwanger und stand kurz vor der Entbindung. Als sie die Nachricht hörte, dass die Lade Gottes erbeutet worden war[a] und dass ihr Schwiegervater und ihr Mann tot waren[b], sank sie nieder und gebar, denn ihre Wehen kamen über sie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Erbeutung der Lade Gottes“. Die hebräische Konstruktion kann entweder den Inhalt der Nachricht oder deren Gegenstand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und dass ihr Schwiegervater und ihr Mann gestorben waren“. Das Hebräische kann sowohl als Zustandsangabe als auch ereignishaft wiedergegeben werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „denn ihre Wehen wandten sich über sie“. Die Wendung bedeutet, dass die Geburtswehen über sie kamen bzw. einsetzten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: Seine Schwiegertochter
  rationale: כַּלָּה bezeichnet hier Elis Schwiegertochter; das anknüpfende וְ wird im Deutschen durch den Erzählzusammenhang ausreichend wiedergegeben.
- source_word: אֵשֶׁת פִּינְחָס
  choice: die Frau des Pinhas
  rationale: Die hebräische Apposition wird eng und natürlich nachgebildet.
- source_word: הָרָה לָלַת
  choice: war schwanger und stand kurz vor der Entbindung
  rationale: Die Formulierung bewahrt sowohl den Zustand der Schwangerschaft als auch die unmittelbar bevorstehende Geburt.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: Als sie die Nachricht hörte
  rationale: שְׁמוּעָה bedeutet hier Nachricht oder Bericht; ein temporaler Nebensatz ergibt einen natürlichen deutschen Erzählfluss.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: dass die Lade Gottes erbeutet worden war
  rationale: Der passive Infinitiv bezeichnet die Wegnahme der Lade durch den Feind; „erbeutet“ ist im Kriegskontext präziser als das allgemeinere „weggenommen“.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: und dass ihr Schwiegervater und ihr Mann tot waren
  rationale: מֵת lässt sich hier als resultierender Zustand ausdrücken; die alternative ereignishafte Wiedergabe bleibt in einer Fußnote erhalten.
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: sank sie nieder und gebar
  rationale: כרע bezeichnet ein Niederbeugen oder Niedersinken. Im Geburtszusammenhang ist „sank nieder“ natürlich, ohne eine bestimmte Gebärhaltung festzulegen; ילד bedeutet „gebären“.
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: denn ihre Wehen hatten sie plötzlich überfallen
  rationale: Die wörtliche Wendung „ihre Wehen wandten sich gegen/auf sie“ ist idiomatisch zu verstehen. „Überfallen“ bewahrt die Vorstellung eines unvermittelten, überwältigenden Einsetzens.
