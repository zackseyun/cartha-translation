  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֜ישׁ אֶל עֵלִ֗י אָֽנֹכִי֙ הַ/בָּ֣א מִן הַ/מַּעֲרָכָ֔ה וַ/אֲנִ֕י מִן הַ/מַּעֲרָכָ֖ה נַ֣סְתִּי הַ/יּ֑וֹם וַ/יֹּ֛אמֶר מֶֽה הָיָ֥ה הַ/דָּבָ֖ר בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: de
  text: 'Der Mann sagte zu Eli: „Ich bin der, der von der Schlachtreihe[a] gekommen ist; ich bin heute aus der Schlachtreihe geflohen.“ Da fragte Eli: „Was ist geschehen, mein Sohn?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „von der Kampfformation“, „aus den Reihen“ oder „vom Schlachtfeld“; das hebräische Wort bezeichnet eine militärische Aufstellung oder Schlachtreihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: Der Mann
  rationale: Das gewöhnliche hebräische Wort bezeichnet einen Mann. Obwohl er im Zusammenhang als Überbringer einer Nachricht auftritt, steht hier kein spezieller Ausdruck für „Bote“.
- source_word: הַבָּא
  choice: der, der … gekommen ist
  rationale: Das Partizip identifiziert zusammen mit אָנֹכִי den Sprecher. Das Perfekt „gekommen ist“ entspricht der Situation, da er bereits bei Eli eingetroffen ist.
- source_word: מִן הַמַּעֲרָכָה
  choice: von der Schlachtreihe
  rationale: מַעֲרָכָה bezeichnet hier die militärische Aufstellung oder Kampfformation. „Schlachtreihe“ bewahrt diesen konkreten Sinn.
- source_word: נַסְתִּי
  choice: ich bin … geflohen
  rationale: נוּס bedeutet unmittelbar „fliehen“. Die Wiedergabe vermeidet die zusätzliche Erfolgsnuance von „entkommen“.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die natürliche moderne deutsche Zeitangabe gibt den hebräischen Ausdruck genau wieder.
- source_word: מֶה הָיָה הַדָּבָר
  choice: Was ist geschehen?
  rationale: Wörtlich etwa „Was war die Sache?“. Im Kontext fragt Eli nach dem eingetretenen Ereignis; „Was ist geschehen?“ ist idiomatisch und sachlich genau.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Das Possessivsuffix ist ausdrücklich vorhanden. Die Anrede bewahrt den zugewandten beziehungsweise höflichen Ton gegenüber dem jüngeren Mann.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leichte Wiederholung von „Schlachtreihe“ bleibt erhalten, weil sie auch im Hebräischen vorkommt; die Sprecherwechsel werden zur Klarheit ausdrücklich mit „Eli“ gekennzeichnet.
