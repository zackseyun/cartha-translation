  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: de
  text: 'Und sie gab dem Jungen den Namen Ikabod[a] und sagte: »Die Herrlichkeit ist aus Israel gewichen«, weil die Lade Gottes weggenommen worden war und weil ihr Schwiegervater und ihr Mann gestorben waren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Ikabod lässt sich mit hebräischen Bestandteilen verbinden, die etwa »keine Herrlichkeit« oder möglicherweise »Wo ist die Herrlichkeit?« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: sie gab dem Jungen den Namen
  rationale: קרא mit ל bezeichnet in diesem Zusammenhang die Namensgebung. Die gewählte deutsche Wendung ist eindeutig und natürlich.
- source_word: אִי כָבוֹד
  choice: Ikabod
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren Transliteration wiedergegeben; seine mehrdeutige mögliche Wortbedeutung wird in der Fußnote erläutert.
- source_word: גָּלָה
  choice: ist … gewichen
  rationale: Das Verb kann Weggehen, Entfernen oder Exilierung ausdrücken. Bei »Herrlichkeit« als Subjekt gibt »gewichen« den Trennungsgedanken würdig wieder, ohne das Exilmotiv zwingend festzulegen.
- source_word: כָבוֹד
  choice: die Herrlichkeit
  rationale: Die Wiedergabe bewahrt die theologische Dichte des Ausdrucks, der sowohl Gottes offenbarte Gegenwart als auch Israels Ehre berühren kann.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: weil die Lade Gottes weggenommen worden war
  rationale: אֶל wird hier im Kontext kausal verstanden; die passive Infinitivkonstruktion wird als deutsche Vorzeitigkeit wiedergegeben.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: und wegen ihres Schwiegervaters und ihres Mannes
  rationale: Das wiederholte אֶל führt die Gründe fort. אִישָׁהּ bezeichnet hier eindeutig ihren Ehemann.
theological_decisions:
- issue: Bedeutung der Herrlichkeit in ihrem Verhältnis zu Israel
  choice: »Die Herrlichkeit ist aus Israel gewichen«
  alternative: »Gottes Herrlichkeit ist aus Israel gewichen« oder »Israels Ehre ist dahin«
  rationale: Der hebräische Text bestimmt nicht ausdrücklich, ob Gottes gegenwärtige Herrlichkeit, Israels Ehre oder beides gemeint ist. Die knappe Formulierung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensgebung wird idiomatisch formuliert; die Bildsprache von der weichenden Herrlichkeit und die Mehrdeutigkeit des Namens bleiben erhalten.
