  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: de
  text: Als die Lade des Bundes Jahwes ins Lager kam, stieß ganz Israel einen gewaltigen Schrei aus, und die Erde dröhnte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Erde erbebte.“ Das hebräische Verb kann lautes Tosen oder Getöse, aber auch ein Erzittern oder Erbeben bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Als … kam
  rationale: Die Konstruktion leitet einen temporalen Nebensatz ein. „Als … kam“ gibt den Erzählfluss im Deutschen natürlich wieder, ohne das formelhafte וַיְהִי unnötig mit „und es geschah“ auszubauen.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Wiedergabe bewahrt die hebräische Genitivkette und bezeichnet die Lade ausdrücklich als die Lade des Bundes, der zu Jahwe gehört.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַמַּחֲנֶה
  choice: das Lager
  rationale: Im militärischen Erzählzusammenhang ist „Lager“ die natürliche und genaue deutsche Entsprechung.
- source_word: וַיָּרִיעוּ כָל יִשְׂרָאֵל תְּרוּעָה גְדוֹלָה
  choice: stieß ganz Israel einen gewaltigen Schrei aus
  rationale: Das Verb und das stammverwandte Substantiv bilden eine verstärkende Verbindung. „Einen gewaltigen Schrei ausstoßen“ gibt deren Nachdruck idiomatisch wieder, ohne den Schrei enger als Jubel oder Schlachtruf festzulegen.
- source_word: וַתֵּהֹם הָאָרֶץ
  choice: und die Erde hallte wider
  rationale: Das Verb kann lautes Tosen, Aufruhr oder Erbeben bezeichnen. „Hallte wider“ passt zur Wirkung des gewaltigen Schreis, ohne eindeutig ein Erdbeben zu behaupten; die mögliche körperliche Erschütterung bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Art des Schreis Israels
  choice: gewaltiger Schrei
  alternative: Jubelruf; Schlachtruf
  rationale: Der unmittelbare Zusammenhang legt freudige beziehungsweise kämpferische Begeisterung nahe, doch das hebräische תְּרוּעָה bezeichnet allgemeiner einen lauten Ruf. Die Übersetzung vermeidet daher eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem knappen Erzählstil des Hebräischen; „gewaltig“ bewahrt die Intensität, während „Schrei“ die Art des Rufes bewusst offenlässt.
