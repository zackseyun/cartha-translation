  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: de
  text: Und Samuels Wort erging an ganz Israel.[a] Israel zog den Philistern zum Kampf entgegen und lagerte bei Eben-Eser,[b] während die Philister bei Afek lagerten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und die Kunde von Samuel verbreitete sich in ganz Israel.« Der hebräische Ausdruck kann Samuels Wort beziehungsweise Botschaft bezeichnen und meint im Zusammenhang wahrscheinlich sein prophetisches Wort.'
    reason: alternative_reading
  - marker: b
    text: Eben-Eser bedeutet »Stein der Hilfe«. Hier ist es ein Ortsname.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: Und Samuels Wort erging an ganz Israel
  rationale: „Erging an“ gibt die idiomatische Verbindung von וַיְהִי mit דְבַר und לְ wieder und bewahrt zugleich den möglichen Bezug auf Samuels prophetisches Wort.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: Israel zog … entgegen
  rationale: „Zog“ ist im militärischen Zusammenhang natürlich, ohne über die durch den folgenden Ausdruck bezeichnete Kampfabsicht hinauszugehen.
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: den Philistern zum Kampf entgegen
  rationale: Die Formulierung erhält sowohl die Bewegungsrichtung von לִקְרַאת als auch den Zweck beziehungsweise Anlass des Auszugs in לַמִּלְחָמָה.
- source_word: וַיַּחֲנוּ עַל הָאֶבֶן הָעֵזֶר
  choice: und lagerte bei Eben-Eser
  rationale: Das kollektive „Israel“ wird im Deutschen mit Singular fortgeführt. Der hebräische Ausdruck wird als Ortsname wiedergegeben; „bei“ ist für einen Lagerplatz idiomatisch.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: während die Philister bei Afek lagerten
  rationale: „Während“ stellt die beiden gleichzeitig beschriebenen Heerlager natürlich gegenüber; Afek wird als Ortsname transliteriert.
theological_decisions:
- issue: Bedeutung von דְבַר שְׁמוּאֵל
  choice: Samuels Wort, das an ganz Israel erging
  alternative: Die Kunde beziehungsweise der Ruf Samuels verbreitete sich in ganz Israel
  rationale: Der vorausgehende Zusammenhang in Kapitel 3 legt Samuels prophetisches Wort nahe. Die wörtlich offene Wiedergabe „Samuels Wort“ wahrt jedoch die im Hebräischen verbleibende Deutungsmöglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt erzählerisch knapp; traditionelle, aber verständliche Namensformen werden beibehalten.
