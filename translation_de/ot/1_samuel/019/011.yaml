base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: de
  text: 'Da schickte Saul Boten zum Haus Davids, um ihn zu überwachen und ihn am Morgen zu töten. Und Michal, seine Frau, sagte zu David: »Wenn du heute Nacht nicht dein Leben rettest[a], wirst du morgen getötet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn du dich heute Nacht nicht in Sicherheit bringst«.'
    reason: Lexikalische Alternative für die hebräische Wendung, die sowohl die Rettung des Lebens als auch das Entkommen mit dem eigenen Leben ausdrücken kann.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im Erzählzusammenhang bezeichnet das Wort menschliche Abgesandte Sauls, nicht Engel. »Boten« ist die übliche und klare deutsche Wiedergabe.
- source_word: לְשָׁמְרוֹ
  choice: um ihn zu überwachen
  rationale: Das Verb bezeichnet hier feindliche Beobachtung mit dem Ziel, David zu töten. »Überwachen« vermeidet den schützenden Beiklang, den »bewachen« haben kann.
- source_word: וְלַהֲמִיתוֹ
  choice: und ihn … zu töten
  rationale: Der Hifil von מות bedeutet, den Tod herbeizuführen. »Töten« gibt die geplante Gewalttat direkt und verständlich wieder.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Die Präpositionalverbindung nennt den vorgesehenen Zeitpunkt der Tötung; »am Morgen« ist im Deutschen idiomatisch.
- source_word: וַתַּגֵּד
  choice: sagte
  rationale: נגד führt hier Michals Mitteilung beziehungsweise Warnung an David ein. Das schlichte »sagte« bewahrt die Erzählweise, während die direkte Rede selbst die Dringlichkeit ausdrückt.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: Michal, seine Frau
  rationale: Die Apposition des Hebräischen wird beibehalten und zugleich in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: dein Leben rettest
  rationale: Die Wendung bezeichnet die Rettung des eigenen Lebens beziehungsweise der eigenen Person aus unmittelbarer Todesgefahr. »Dein Leben rettest« ist prägnant und wahrt das Bild des Ausgangstextes.
- source_word: הַלַּיְלָה
  choice: heute Nacht
  rationale: Die Zeitangabe meint die unmittelbar bevorstehende beziehungsweise gegenwärtige Nacht. »Heute Nacht« ist die natürliche moderne Wiedergabe.
- source_word: מוּמָת
  choice: wirst du … getötet
  rationale: Die passive Form kündigt Davids Tötung durch Sauls Boten an. Das Passiv des Ausgangstextes und die erkennbare menschliche Einwirkung bleiben erhalten.
