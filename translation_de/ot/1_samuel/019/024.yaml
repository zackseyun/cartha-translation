  text: וַ/יִּפְשַׁ֨ט גַּם ה֜וּא בְּגָדָ֗י/ו וַ/יִּתְנַבֵּ֤א גַם הוּא֙ לִ/פְנֵ֣י שְׁמוּאֵ֔ל וַ/יִּפֹּ֣ל עָרֹ֔ם כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה עַל כֵּן֙ יֹֽאמְר֔וּ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: de
  text: 'Auch er zog seine Kleider aus[a], und auch er weissagte vor Samuel. Er lag den ganzen Tag und die ganze Nacht nackt da.[b] Deshalb sagt man: »Ist auch Saul unter den Propheten?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »legte seine Gewänder ab«.'
    reason: lexical_alternative
  - marker: b
    text: »Nackt« kann völlige Nacktheit oder das Ablegen der Obergewänder bezeichnen; das Hebräische macht hierzu keine genaueren Angaben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: zog seine Kleider aus
  rationale: פשט mit בגד bezeichnet das Ablegen von Kleidung. Die Formulierung ist im modernen Deutschen natürlich und gibt den Vorgang klar wieder.
- source_word: גַּם הוּא
  choice: auch er
  rationale: Die zweimalige Wiederholung hebt hervor, dass Saul selbst ebenso wie seine Boten von dem prophetischen Geschehen erfasst wurde.
- source_word: וַיִּתְנַבֵּא
  choice: weissagte
  rationale: Die Wiedergabe bewahrt den Bezug auf prophetische Tätigkeit, ohne festzulegen, ob es sich um Vorhersage, prophetisches Reden oder ekstatisches Verhalten handelte.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: vor Samuel
  rationale: לפני bezeichnet hier Samuels Gegenwart; »vor Samuel« ist knapp, idiomatisch und textnah.
- source_word: וַיִּפֹּל עָרֹם
  choice: Er lag ... nackt da
  rationale: נפל bedeutet wörtlich »fallen«, bezeichnet im Zusammenhang mit der langen Zeitangabe aber den daraus folgenden liegenden Zustand. עָרֹם wird direkt als »nackt« wiedergegeben.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: den ganzen Tag und die ganze Nacht
  rationale: Die Formulierung gibt die betonte vollständige Dauer natürlich wieder; der konkrete Bezug ist im Deutschen aus dem Zusammenhang klar.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Deshalb sagt man
  rationale: Die unpersönliche deutsche Wendung führt idiomatisch eine sprichwörtliche Redensart ein und entspricht dem generischen hebräischen Plural.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: Ist auch Saul unter den Propheten?
  rationale: Die traditionelle und zugleich klare Formulierung bewahrt die rhetorische Frage und die Zugehörigkeitsbezeichnung des Hebräischen.
theological_decisions:
- issue: Bedeutung von Sauls unbekleidetem Zustand (עָרֹם)
  choice: Im Haupttext steht ungemildert »nackt«.
  alternative: Nur teilweise entkleidet oder lediglich ohne Obergewänder.
  rationale: Das hebräische Adjektiv bezeichnet grundsätzlich Nacktheit, legt hier aber nicht ausdrücklich deren Umfang fest. Die direkte Wiedergabe bewahrt die Kraft des Textes; die mögliche Einschränkung wird in einer Fußnote genannt.
- issue: Art von Sauls prophetischer Tätigkeit
  choice: וַיִּתְנַבֵּא wird mit »weissagte« wiedergegeben, ohne die Erscheinungsform näher zu bestimmen.
  alternative: Er geriet in prophetische Ekstase oder verhielt sich wie ein Prophet.
  rationale: Der Vers benennt prophetische Tätigkeit, erklärt jedoch nicht, ob sie aus prophetischem Reden, Ekstase oder beidem bestand. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung »auch er« und die sprichwörtliche Schlussfrage bleiben erhalten. »Weissagte« wird als geläufiger biblischer Fachausdruck verwendet, ohne die Art des prophetischen Geschehens auszudeuten.
