base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: de
  text: 'Da schickte Saul die Boten, um nach David zu sehen, und befahl: »Bringt ihn im Bett[a] zu mir herauf, damit ich ihn töte!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem Bett« beziehungsweise »mit dem Bett«. Die hebräische Präposition lässt mehrere Deutungen zu; wahrscheinlich sollte David so getragen werden, wie er dalag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickte Saul
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da« bewahrt die zeitliche Abfolge in natürlichem deutschem Erzählstil.
- source_word: הַמַּלְאָכִים
  choice: die Boten
  rationale: מַלְאָךְ bezeichnet hier die von Saul ausgesandten Männer, nicht übernatürliche Engel.
- source_word: לִרְאוֹת אֶת דָּוִד
  choice: um nach David zu sehen
  rationale: Die Formulierung bleibt nahe bei ראה, klingt im Deutschen aber natürlicher als »um David zu sehen« und lässt offen, ob die Boten seine Anwesenheit oder seinen Zustand prüfen sollten.
- source_word: לֵאמֹר
  choice: und befahl
  rationale: Der Infinitiv leitet die direkte Rede ein. Im Kontext enthält sie einen ausdrücklichen Befehl; »und befahl« gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: הַעֲלוּ אֹתוֹ
  choice: Bringt ihn ... herauf
  rationale: Der Hifil von עלה bedeutet, jemanden hinaufzubringen. »Herauf« bewahrt die Richtung auf den Sprecher Saul zu.
- source_word: בַמִּטָּה
  choice: im Bett
  rationale: Die Präposition ב ist hier mehrdeutig. »Im Bett« gibt die naheliegende Vorstellung wieder, David solle so, wie er darin liege, getragen werden; Alternativen werden in der Fußnote genannt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Wendung bezeichnet Saul als Ziel der Bewegung.
- source_word: לַהֲמִתוֹ
  choice: damit ich ihn töte
  rationale: Der Infinitiv mit ל drückt den Zweck aus. Die direkte, ernste Formulierung entspricht Sauls Tötungsabsicht, ohne sie abzuschwächen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die Mehrdeutigkeit von בַמִּטָּה wird nicht im Haupttext überladen, sondern durch die Fußnote offengehalten.
