  text: וַ/תּ֥וֹסֶף הַ/מִּלְחָמָ֖ה לִֽ/הְי֑וֹת וַ/יֵּצֵ֨א דָוִ֜ד וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יַּ֤ךְ בָּ/הֶם֙ מַכָּ֣ה גְדוֹלָ֔ה וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: de
  text: Der Krieg brach erneut aus[a]. David zog aus, kämpfte gegen die Philister und brachte ihnen eine schwere Niederlage bei, sodass sie vor ihm flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Krieg dauerte an“ beziehungsweise „Es kam wieder zum Krieg“. Die hebräische Wendung kann erneute wie auch fortgesetzte Kriegshandlungen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: Der Krieg brach erneut aus
  rationale: Die Verbindung von יסף mit dem Infinitiv von היה bezeichnet hier das erneute oder fortgesetzte Eintreten des Krieges. Die Formulierung ist im modernen Deutschen natürlich; die mögliche Bedeutung einer Fortdauer wird in der Fußnote bewahrt.
- source_word: וַיֵּצֵא דָוִד
  choice: David zog aus
  rationale: יצא bedeutet wörtlich „hinausgehen“. „Zog aus“ gibt im militärischen Zusammenhang die Bewegung knapp und natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Ziel hinzuzufügen.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: kämpfte gegen die Philister
  rationale: לחם bezeichnet das Kämpfen; die Präposition ב markiert hier die feindliche Auseinandersetzung. „Gegen“ ist im Deutschen eindeutig.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: brachte ihnen eine schwere Niederlage bei
  rationale: Die figura etymologica aus נכה und מכה bezeichnet einen schweren Schlag beziehungsweise eine empfindliche Niederlage. Die deutsche Wendung gibt die militärische Wirkung natürlich wieder, ohne ein Blutbad oder eine bestimmte Zahl von Toten vorauszusetzen.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: sie vor ihm flohen
  rationale: מִפָּנָיו bedeutet wörtlich „von seinem Angesicht weg“ und bezeichnet hier die Flucht vor David. „Vor ihm flohen“ bewahrt die räumliche und militärische Bildhaftigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah an der knappen hebräischen Erzählweise; idiomatische deutsche Wendungen vermeiden unnötige Wörtlichkeit. Die echte Mehrdeutigkeit zwischen erneutem Ausbruch und Fortdauer des Krieges wird durch die Fußnote erhalten.
