source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: de
  text: Da sandte Saul Boten, um David festzunehmen. Als sie die Schar der Propheten[a], die prophezeiten, sahen[b] und Samuel, der über ihnen stand, kam der Geist Gottes über Sauls Boten, und auch sie prophezeiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Gruppe“ oder „Versammlung der Propheten“. Das hebräische Wort bezeichnet eine zusammengekommene Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb „sah“ steht in der Einzahl, obwohl zuvor mehrere Boten genannt werden. Der Zusammenhang legt nahe, dass die Boten als Gruppe gemeint sind. Samuel wird wörtlich als „stehend, aufgestellt, über ihnen“ beschrieben; dies kann eine hervorgehobene oder leitende Stellung andeuten, ohne sie ausdrücklich festzulegen.
    reason: textual_grammar
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: Boten
  rationale: Im erzählerischen Zusammenhang sind menschliche Abgesandte Sauls gemeint, nicht Engel.
- source_word: לָקַחַת
  choice: festzunehmen
  rationale: Das allgemeinere Verb „nehmen“ bezeichnet hier das gewaltsame Ergreifen Davids; „festzunehmen“ gibt die feindliche Absicht natürlich und präzise wieder.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: die Schar der Propheten
  rationale: Das seltene Substantiv bezeichnet eine versammelte Gruppe; „Schar“ ist im Deutschen knapp, verständlich und lässt die genaue Organisationsform offen.
- source_word: נִבְּאִים / וַיִּתְנַבְּאוּ
  choice: prophezeiten
  rationale: Die einheitliche Wiedergabe bewahrt die Wiederholung und macht deutlich, dass Sauls Boten an derselben prophetischen Tätigkeit teilnahmen.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: während Samuel ihnen vorstand
  rationale: Die Formulierung vermittelt Samuels feste, hervorgehobene Stellung gegenüber der Gruppe in natürlichem Deutsch; die mögliche rein räumliche Deutung wird in der Fußnote erhalten.
- source_word: רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  rationale: Die bestimmte Wendung bringt Gottes wirksame Gegenwart zum Ausdruck, ohne spätere dogmatische Präzisierungen in den Text einzutragen.
- source_word: וַתְּהִי עַל
  choice: kam ... über
  rationale: Diese idiomatische Formulierung bewahrt den ereignishaften Charakter des göttlichen Einwirkens.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: auch sie prophezeiten
  rationale: „Auch sie“ erhält die Hervorhebung durch גַּם und den überraschenden Anschluss der Boten an das prophetische Geschehen.
theological_decisions:
- issue: Bedeutung von רוּחַ אֱלֹהִים in dieser Erzählung
  choice: „der Geist Gottes kam über Sauls Boten“
  alternative: „ein Geist von Gott kam über Sauls Boten“
  rationale: Die gewählte Fassung gibt die Wendung als Gottes wirksame geistliche Gegenwart wieder und wahrt die göttliche Urheberschaft, ohne dem Vers eine über seinen Wortlaut hinausgehende trinitarische Ausformulierung aufzuerlegen.
- issue: Art des prophetischen Geschehens
  choice: „prophezeiten“
  alternative: „gerieten in prophetische Begeisterung“
  rationale: Der hebräische Text benennt prophetische Tätigkeit, beschreibt aber weder ihren konkreten Inhalt noch ausdrücklich einen ekstatischen Zustand. Die neutralere Wiedergabe erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, ohne einen nicht ausdrücklich markierten Gegensatz einzufügen. „Prophezeiten“ bewahrt die wiederholte Verbwurzel und vermeidet eine Festlegung auf bloße Rede oder Ekstase.
