  text: וְ/דָוִ֨ד בָּרַ֜ח וַ/יִּמָּלֵ֗ט וַ/יָּבֹ֤א אֶל שְׁמוּאֵל֙ הָ/רָמָ֔תָ/ה וַ/יַּ֨גֶּד ל֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה ל֖/וֹ שָׁא֑וּל וַ/יֵּ֤לֶךְ הוּא֙ וּ/שְׁמוּאֵ֔ל וַ/יֵּשְׁב֖וּ ב/נוית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: de
  text: David floh und entkam. Er kam zu Samuel nach Rama und erzählte ihm alles, was Saul ihm angetan hatte. Dann gingen er und Samuel fort und blieben in Najot[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Najot; ein Ortsname, der möglicherweise mit „Wohnstätten“ zusammenhängt und wohl eine Ansiedlung bei Rama bezeichnet.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: floh und entkam
  rationale: Die beiden Verben bezeichnen zunächst die Flucht und dann deren erfolgreichen Ausgang. Die Wiedergabe bewahrt diese Abfolge, ohne eine im Vers nicht ausdrücklich genannte göttliche Rettung einzutragen.
- source_word: הָרָמָתָה
  choice: nach Rama
  rationale: 'Das direktionale He bezeichnet die Bewegung auf Rama zu. In natürlichem Deutsch heißt es daher: zu Samuel nach Rama kommen.'
- source_word: וַיַּגֶּד לוֹ
  choice: erzählte ihm
  rationale: Das Hifil von נגד bedeutet hier im Erzählzusammenhang mitteilen oder berichten; „erzählte ihm“ ist verständlich und idiomatisch.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: alles, was Saul ihm angetan hatte
  rationale: „Angetan hatte“ gibt den persönlichen, schädigenden Charakter von Sauls Handeln im Kontext natürlich wieder und bewahrt die umfassende Aussage von כָּל.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: Dann gingen er und Samuel fort
  rationale: Das ausdrücklich gesetzte Pronomen הוּא wird durch „er und Samuel“ erhalten. „Dann“ bildet die erzählerische Folge ab; „fort“ verdeutlicht den Ortswechsel.
- source_word: וַיֵּשְׁבוּ
  choice: blieben
  rationale: ישׁב kann sitzen, wohnen oder sich aufhalten bedeuten. Im Reisebericht bezeichnet es hier den Aufenthalt am neuen Ort; „blieben“ ist dafür natürliches modernes Deutsch.
- source_word: בְנוית
  choice: in Najot
  rationale: Der Ausdruck wird als Ortsname transliteriert. Die Präposition ב wird regulär mit „in“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählweise. Die Verbfolge „floh und entkam“ sowie der ausdrückliche Subjektverbund „er und Samuel“ bleiben erhalten. Der Ortsname נוית wird in der im Deutschen naheliegenden Form „Najot“ wiedergegeben.
