  text: וַ/אֲנִ֨י אֵצֵ֜א וְ/עָמַדְתִּ֣י לְ/יַד אָבִ֗/י בַּ/שָּׂדֶה֙ אֲשֶׁ֣ר אַתָּ֣ה שָׁ֔ם וַ/אֲנִ֕י אֲדַבֵּ֥ר בְּ/ךָ֖ אֶל אָבִ֑/י וְ/רָאִ֥יתִי מָ֖ה וְ/הִגַּ֥דְתִּי לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: de
  text: Ich aber werde hinausgehen und auf dem Feld neben meinem Vater stehen, auf dem du bist. Ich werde mit meinem Vater über dich sprechen. Dann werde ich sehen, was geschieht,[a] und es dir sagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich werde sehen, was“. Der hebräische Ausdruck ist verkürzt und kann auch bedeuten: „Ich werde sehen, wie die Lage ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: werde hinausgehen
  rationale: Das Qal-Imperfekt 1. Person Singular von יצא bezeichnet Jonatans beabsichtigtes Handeln. „Hinausgehen“ gibt die Bewegungsrichtung natürlich wieder.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: und mich neben meinen Vater … stellen
  rationale: עמד mit לְיַד beschreibt hier das Einnehmen eines Platzes an der Seite des Vaters. Die reflexive Formulierung ist im Deutschen für eine geplante Handlung idiomatisch.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: auf das Feld …, auf dem du bist
  rationale: Die Relativkonstruktion bezeichnet das Feld als Davids Aufenthaltsort. Das hebräische שָׁם wird im deutschen Relativausdruck bereits sinngemäß erfasst.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: mit meinem Vater über dich sprechen
  rationale: דבר ב bezeichnet in diesem Zusammenhang das Sprechen über oder hinsichtlich einer Person. Die deutsche Formulierung gibt sowohl den Gesprächspartner als auch das Thema klar wieder.
- source_word: וְרָאִיתִי מָה
  choice: Dann werde ich sehen, was geschieht
  rationale: 'Der hebräische Ausdruck ist elliptisch: wörtlich „und ich werde sehen, was“. „Was geschieht“ ergänzt den im Zusammenhang gemeinten Ausgang, ohne ihn näher festzulegen.'
- source_word: וְהִגַּדְתִּי לָךְ
  choice: und es dir sagen
  rationale: Das Hifil von נגד bedeutet „mitteilen, kundtun, berichten“. „Es dir sagen“ ist hier natürlich und bezieht sich auf das zuvor Erkannte.
