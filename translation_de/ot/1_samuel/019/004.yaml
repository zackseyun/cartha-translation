  text: וַ/יְדַבֵּ֨ר יְהוֹנָתָ֤ן בְּ/דָוִד֙ ט֔וֹב אֶל שָׁא֖וּל אָבִ֑י/ו וַ/יֹּ֣אמֶר אֵ֠לָי/ו אַל יֶחֱטָ֨א הַ/מֶּ֜לֶךְ בְּ/עַבְדּ֣/וֹ בְ/דָוִ֗ד כִּ֣י ל֤וֹא חָטָא֙ לָ֔/ךְ וְ/כִ֥י מַעֲשָׂ֖י/ו טוֹב לְ/ךָ֥ מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: de
  text: 'Jonatan sprach bei seinem Vater Saul gut von David[a] und sagte zu ihm: »Der König soll sich nicht an seinem Diener, an David[b], versündigen; denn er hat sich nicht an dir versündigt, und seine Taten haben dir sehr gutgetan.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »redete Gutes über David«; gemeint ist, dass Jonatan sich günstig für David aussprach.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »an seinem Diener, an David«; die Wiederholung hebt David als den betreffenden Diener hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... בְּדָוִד טוֹב
  choice: sprach ... gut über David
  rationale: Die Wendung bedeutet, sich positiv oder günstig über jemanden zu äußern. »Sprach gut über David« ist natürliches modernes Deutsch und bleibt zugleich nahe am hebräischen Ausdruck.
- source_word: אֶל שָׁאוּל אָבִיו
  choice: bei seinem Vater Saul
  rationale: Im Deutschen wird positives Reden zugunsten einer Person idiomatisch als »bei jemandem gut über jemanden sprechen« formuliert; zugleich bleiben Sauls Name und sein Verhältnis zu Jonatan ausdrücklich erhalten.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: Der König soll sich nicht ... versündigen
  rationale: Die Konstruktion mit אַל und Jussiv drückt ein Verbot aus. Die respektvolle Anrede in der dritten Person wird mit »Der König soll nicht« bewahrt.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: an seinem Diener, an David
  rationale: חטא mit ב bezeichnet hier ein Sichversündigen an jemandem. Die Wiederholung der Präposition wird beibehalten und »David« als erläuternde Apposition kenntlich gemacht.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: denn er hat sich nicht an dir versündigt
  rationale: Die Wiedergabe bewahrt die Wurzelentsprechung zu Sauls möglicher Sünde und damit Jonatans rhetorischen Gegensatz.
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: und seine Taten sind für dich sehr gut gewesen
  rationale: Die Formulierung bleibt eng beim Hebräischen und bringt zum Ausdruck, dass Davids Handlungen Saul erheblich zugutekamen.
