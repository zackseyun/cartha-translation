translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Anrede Sauls in der dritten Person und die wiederholte Sünden-Terminologie sind bewahrt. Der zweite Fußnotenmarker steht am Satzende, da er die innerhalb der Rede erhaltene hebräische Wiederholung erläutert.
