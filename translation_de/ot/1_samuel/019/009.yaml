base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: de
  text: Da kam ein böser Geist von Jahwe[a] über Saul. Saul saß in seinem Haus, den Speer in der Hand, während David mit der Hand spielte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein schädlicher« beziehungsweise »Unheil bringender Geist von Jahwe«. Das hebräische Adjektiv kann »böse«, »schädlich« oder »Unheil bringend« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »David spielte mit der Hand«. Das Instrument wird in diesem Vers nicht genannt; aus dem Zusammenhang ist bekannt, dass David auf der Leier spielte.'
    reason: source_clarification
lexical_decisions:
- source_word: וַתְּהִי ... אֶל שָׁאוּל
  choice: Da kam ... über Saul
  rationale: Die Ereignisfolge und die auf Saul gerichtete Bewegung werden im Deutschen idiomatisch mit »kam über« wiedergegeben.
- source_word: רוּחַ יְהוָה רָעָה
  choice: ein böser Geist von Jahwe
  rationale: רוּחַ bezeichnet hier einen Geist; רָעָה kann »böse«, »schädlich« oder »Unheil bringend« bedeuten. »Von Jahwe« gibt die Herkunftsbeziehung wieder, ohne die Spannung des Textes aufzulösen.
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: Saul saß in seinem Haus
  rationale: Das Partizip beschreibt die andauernde Hintergrundhandlung; die explizite Wiederaufnahme des Namens sorgt im Deutschen für klare Bezüge.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: und hielt seinen Speer in der Hand
  rationale: Die hebräische Nominalkonstruktion lautet wörtlich »und sein Speer war in seiner Hand«; »hielt« ist eine natürliche deutsche Zustandsbeschreibung.
- source_word: מְנַגֵּן בְּיָד
  choice: mit der Hand auf seinem Instrument spielte
  rationale: Das Piel-Partizip von נגן bezeichnet Instrumentalspiel. Der Vers nennt das Instrument nicht ausdrücklich; daher wird kein bestimmtes Instrument wie die Leier in den Haupttext eingesetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, damit der im hebräischen Text ausdrücklich stehende Gottesname erkennbar bleibt.
- issue: Bedeutung von רוּחַ יְהוָה רָעָה
  choice: ein böser Geist von Jahwe
  alternative: ein schädlicher beziehungsweise Unheil bringender Geist von Jahwe
  rationale: Die direkte Bedeutung »böse« bleibt im Haupttext erhalten. Eine Fußnote weist auf die ebenfalls möglichen Bedeutungen »schädlich« und »Unheil bringend« hin, ohne die theologische Spannung der Herkunftsangabe abzuschwächen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die kurzen Hauptsätze bilden die hebräische Szenenfolge klar ab; sachlich nötige Ergänzungen werden durch Fußnoten offengelegt.
