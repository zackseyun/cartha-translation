  source_fidelity: Die Wiedergabe des ersten Angriffs („David mit dem Speer an die Wand zu spießen“) trifft die elliptische hebräische Zielverbindung im Kontext gut. Allerdings hat im folgenden Satz nach dem hebräischen Text weiterhin Saul das Subjekt von „schlug/stieß den Speer in die Wand“. Die Formulierung „sodass der Speer in die Wand fuhr“ ersetzt die Handlung Sauls durch einen bloßen Ergebnisvorgang und verwischt damit die explizite Verbhandlung. Die Flucht und das Entkommen in jener Nacht sind zutreffend wiedergegeben.
  naturalness: Die Erzählung ist klar und modernes Standarddeutsch. „David entzog sich Saul“ ist hier natürlich und knapp; die ausdrückliche Wiederholung von „Saul“ verhindert beim zweiten Verb einen falschen Subjektbezug.
  terminology: „Speer“, „an die Wand spießen“, „floh“ und „entkam“ sind angemessen. Es sind keine besonderen theologischen oder namensbezogenen Entscheidungen erforderlich.
