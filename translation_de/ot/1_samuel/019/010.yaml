  text: וַ/יְבַקֵּ֨שׁ שָׁא֜וּל לְ/הַכּ֤וֹת בַּֽ/חֲנִית֙ בְּ/דָוִ֣ד וּ/בַ/קִּ֔יר וַ/יִּפְטַר֙ מִ/פְּנֵ֣י שָׁא֔וּל וַ/יַּ֥ךְ אֶֽת הַ/חֲנִ֖ית בַּ/קִּ֑יר וְ/דָוִ֛ד נָ֥ס וַ/יִּמָּלֵ֖ט בַּ/לַּ֥יְלָה הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: de
  text: Saul versuchte, David mit dem Speer an die Wand zu spießen, doch David entzog sich Saul, und Saul stieß den Speer in die Wand. David floh und entkam in jener Nacht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבַקֵּשׁ ... לְהַכּוֹת
  choice: versuchte ... zu spießen
  rationale: בקש mit Infinitiv bezeichnet hier den Versuch bzw. die Absicht; הכה in Verbindung mit Speer und Wand meint einen tödlichen Stoß oder Wurf. „Zu spießen“ gibt das konkrete Bild natürlich wieder.
- source_word: בְּדָוִד וּבַקִּיר
  choice: David ... an die Wand
  rationale: Die knappe hebräische Fügung verbindet David und die Wand als Zielrichtung. Im Kontext ist gemeint, David mit dem Speer an der Wand festzuspießen.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: Doch David wich Saul aus
  rationale: פטר bezeichnet hier Davids Entkommen bzw. Ausweichen aus Sauls unmittelbarer Reichweite. Die explizite Nennung Davids verhindert ein missverständliches Pronomen.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: sodass der Speer in die Wand fuhr
  rationale: Wörtlich ist die Konstruktion ungewöhnlich („er schlug den Speer in/an die Wand“). Die deutsche Fassung bewahrt das Ergebnis des fehlgegangenen Angriffs, ohne anzudeuten, Saul habe anschließend bewusst mit dem Speer auf die Wand eingeschlagen.
- source_word: נָס וַיִּמָּלֵט
  choice: floh und entkam
  rationale: 'Die beiden aufeinanderfolgenden Verben werden erhalten: zuerst die Flucht, dann das erfolgreiche Entkommen.'
- source_word: בַּלַּיְלָה הוּא
  choice: noch in derselben Nacht
  rationale: Die Wendung bedeutet idiomatisch „in jener/derselben Nacht“; „noch“ unterstreicht im Deutschen den unmittelbaren zeitlichen Ablauf.
