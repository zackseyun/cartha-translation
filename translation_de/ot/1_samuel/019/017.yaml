base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: de
  text: 'Da sagte Saul zu Michal: „Warum hast du mich so getäuscht und meinen Feind fortgeschickt, sodass er entkam?“ Michal antwortete Saul: „Er sagte zu mir: ‚Schick mich fort! Warum sollte ich dich töten?‘“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß möglicherweise: „Lass mich gehen, sonst töte ich dich.“ Wörtlich steht im Hebräischen: „Schick mich fort! Warum sollte ich dich töten?“'
    reason: Die hebräische Formulierung kann im Zusammenhang als indirekt ausgedrückte Drohung verstanden werden, enthält aber kein ausdrückliches „sonst“.
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: hast du mich … getäuscht
  rationale: Das Verb bezeichnet hier täuschendes Handeln. „Getäuscht“ gibt Sauls Vorwurf natürlich wieder, ohne ihn durch „verraten“ zu verschärfen.
- source_word: כָּכָה
  choice: so
  rationale: Das adverbiale „so“ bezeichnet die Art und Weise und entspricht in gegenwärtigem Deutsch natürlich dem hebräischen Ausdruck.
- source_word: וַתְּשַׁלְּחִי
  choice: fortgeschickt
  rationale: שלח bedeutet „schicken/fortschicken“. Die Wiedergabe wahrt die kräftigere Handlungsbeschreibung und stellt zugleich den Zusammenhang mit dem späteren Imperativ her.
- source_word: אֹיְבִי
  choice: meinen Feind
  rationale: Die direkte Bezeichnung bewahrt Sauls feindselige Sicht auf David und die Spannung der Erzählung.
- source_word: וַיִּמָּלֵט
  choice: sodass er entkommen konnte
  rationale: Der Niphal bezeichnet das Entkommen. „Sodass“ macht die im Satz liegende Folgebeziehung idiomatisch deutlich; „konnte“ beschreibt das durch Michals Handeln ermöglichte Entkommen.
- source_word: שַׁלְּחִנִי
  choice: Schick mich fort!
  rationale: Der Imperativ wird direkt wiedergegeben und wahrt durch „fortschicken“ die Wiederholung desselben hebräischen Stammes wie zuvor.
- source_word: לָמָה אֲמִיתֵךְ
  choice: Warum sollte ich dich töten?
  rationale: Dies entspricht der wörtlichen Form der Frage mit einem Verb in der ersten Person und einem Objekt in der zweiten Person Femininum. Die vermutlich drohende Funktion wird nicht als ausdrücklich vorhandener Bedingungssatz ausgegeben.
- source_word: מִיכַל / שָׁאוּל
  choice: Michal / Saul
  rationale: Die Personennamen werden nach etablierter deutscher Bibeltradition wiedergegeben.
theological_decisions:
- issue: Die Michal zugeschriebene Wiedergabe von Davids Worten
  choice: „Schick mich fort! Warum sollte ich dich töten?“
  alternative: „Lass mich gehen, sonst töte ich dich.“
  rationale: Der hebräische Text enthält einen Imperativ und danach eine mit „warum“ eingeleitete Frage, aber kein ausdrückliches „sonst“. Die Hauptübersetzung bewahrt diese sprachliche Form und damit ihre Spannung; die vermutlich gemeinte Drohung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und angespannt. Die Wiederholung von שלח wird mit „fortgeschickt/Schick mich fort“ sichtbar gehalten; die ungewöhnliche Drohfrage wird nicht stillschweigend geglättet.
