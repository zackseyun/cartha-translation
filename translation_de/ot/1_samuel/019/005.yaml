source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: de
  text: Denn er setzte sein Leben aufs Spiel[a] und erschlug den Philister. Und Jahwe erwirkte für ganz Israel eine große Rettung[b]. Du hast es gesehen und dich darüber gefreut. Warum willst du dich also an unschuldigem Blut versündigen, indem du David ohne Grund[c] tötest?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er legte sein Leben in seine Handfläche.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen großen Sieg“ oder „eine große Befreiung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „grundlos“, auch im Sinn von „ohne berechtigten Anlass“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: er setzte sein Leben aufs Spiel
  rationale: Die hebräische Wendung lautet bildlich, dass er sein Leben in seine Handfläche legte, und bezeichnet eine tödliche Selbstgefährdung. Die natürliche deutsche Entsprechung gibt ihren Sinn klar wieder; die wörtliche Bildsprache bleibt in der Fußnote erhalten.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: erschlug den Philister
  rationale: נכה bezeichnet hier Davids tödlichen Sieg über Goliat. „Erschlug“ ist prägnant und entspricht dem erzählten Ausgang.
- source_word: וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: So schenkte Jahwe … eine große Rettung
  rationale: עשה mit תְּשׁוּעָה beschreibt, dass Jahwe die Rettung bewirkte. „Schenkte“ drückt seine wirksame Initiative idiomatisch aus, ohne den militärischen und theologischen Sinn von תְּשׁוּעָה auf bloßen Sieg zu verengen.
- source_word: לְכָל־יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Das ל bezeichnet hier die Begünstigten der Rettung. „Ganz Israel“ ist knappes, natürliches Deutsch.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: Du hast es gesehen und dich darüber gefreut
  rationale: Das im Hebräischen nicht ausgesprochene Objekt wird aus dem Kontext ergänzt. „Darüber“ macht den Bezug der Freude im Deutschen deutlich.
- source_word: וְלָמָּה תֶחֱטָא בְּדָם נָקִי
  choice: Warum willst du dich also an unschuldigem Blut versündigen
  rationale: Die rhetorische Frage blickt auf Sauls beabsichtigte Tat. Die feste deutsche Verbindung „sich an unschuldigem Blut versündigen“ bewahrt den rechtlich-moralischen Gedanken der Blutschuld.
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: und David ohne Grund töten
  rationale: Der Infinitiv erläutert die beabsichtigte Versündigung; חִנָּם bedeutet hier grundlos beziehungsweise ohne berechtigten Anlass.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die im modernen Deutschen übliche wissenschaftliche Umschrift „Jahwe“ bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תְּשׁוּעָה im militärischen Zusammenhang
  choice: eine große Rettung
  alternative: einen großen Sieg / eine große Befreiung
  rationale: Der unmittelbare Zusammenhang ist der Sieg über den Philister, doch תְּשׁוּעָה bezeichnet die dadurch bewirkte Rettung Israels und kann zugleich theologische Resonanz tragen. „Rettung“ hält diesen Bedeutungsumfang offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Risikowendung wird im Haupttext idiomatisch übersetzt und in der Fußnote wörtlich dokumentiert. Der Gottesname erscheint als „Jahwe“. Die Formulierung zur Blutschuld bewahrt den rechtlich-moralischen Ernst des Originals.
