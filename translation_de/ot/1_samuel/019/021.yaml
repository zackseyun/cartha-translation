revisions:
- from: Als man Saul davon berichtete, schickte er andere Boten; doch auch sie gerieten in prophetische Begeisterung.[a] Darauf schickte Saul zum dritten Mal Boten, und auch sie gerieten in prophetische Begeisterung.[b]
  to: Als man Saul davon berichtete, schickte er andere Boten, und auch sie gerieten in einen prophetischen Zustand.[a] Saul schickte erneut Boten, zum dritten Mal, und auch sie gerieten in einen prophetischen Zustand.[b]
  rationale: Die Revision entfernt den nicht ausdrücklich markierten Gegensatz und ersetzt die interpretierende, modern potenziell missverständliche „prophetische Begeisterung“ durch eine neutrale Umschreibung. Sie bewahrt damit die im Hebräischen und im englischen Audit Trail gewahrte Offenheit über die konkrete Form des prophetischen Geschehens. Die zweite Fußnote wird sprachlich und sachlich präzisiert.
