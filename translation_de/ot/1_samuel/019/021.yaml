base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: de
  text: Als man Saul davon berichtete, schickte er andere Boten, und auch sie gerieten in einen prophetischen Zustand.[a] Saul schickte erneut Boten, zum dritten Mal, und auch sie gerieten in einen prophetischen Zustand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Auch sie weissagten« oder »auch sie verhielten sich wie Propheten«. Das Hebräische lässt offen, wie sich dieser prophetische Zustand äußerte.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »dritte«; gemeint ist, dass Saul zum dritten Mal Boten schickte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Als man Saul davon berichtete
  rationale: נגד im Hifil bedeutet „berichten, mitteilen“. Die unpersönliche Form ist im Deutschen natürlich, und „davon“ stellt den im Zusammenhang vorausgesetzten Inhalt her.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Gemeint sind hier menschliche Abgesandte Sauls; „Boten“ ist die klare, kontextgerechte Wiedergabe.
- source_word: אֲחֵרִים
  choice: andere
  rationale: Das Adjektiv steht im Plural und bezeichnet weitere Boten nach der ersten Gruppe.
- source_word: וַיִּתְנַבְּאוּ
  choice: gerieten in prophetische Begeisterung
  rationale: Der Hitpael von נבא bezeichnet hier ein vom Geist ausgelöstes prophetisches Geschehen. Die Formulierung gibt den zuständlichen Vorgang natürlicher wieder als das im heutigen Deutsch leicht missverständliche „prophezeiten“, ohne seine konkrete Erscheinungsform festzulegen.
- source_word: גַּם הֵמָּה
  choice: auch sie
  rationale: Die Wendung betont, dass es dieser Gruppe ebenso erging wie der vorherigen.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: Darauf schickte Saul ... zum dritten Mal
  rationale: יסף kennzeichnet die Wiederholung der Handlung. Zusammen mit שְׁלִשִׁים wird idiomatisch ausgedrückt, dass Saul ein drittes Mal Boten aussandte.
- source_word: שְׁלִשִׁים
  choice: zum dritten Mal
  rationale: Die ungewöhnliche Form ist im Kontext ordinal zu verstehen und bezeichnet die dritte Aussendung, nicht die Zahl dreißig.
theological_decisions:
- issue: Art des prophetischen Geschehens bei Sauls Boten
  choice: „gerieten in prophetische Begeisterung“ ohne nähere Bestimmung der Erscheinungsform
  alternative: „prophezeiten“ / „verhielten sich wie Propheten“
  rationale: Der Text beschreibt ein prophetisches, im Kontext geistgewirktes Geschehen, legt aber nicht fest, ob es aus Rede, Lobpreis, Ekstase oder anderem Verhalten bestand. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Prophetische Begeisterung“ wird im älteren, religiösen Sinn eines ergriffenen Zustands gebraucht, nicht im Sinn bloßer emotionaler Begeisterung. Die Satzverknüpfung mit „doch“ macht den Gegensatz zwischen Sauls Absicht und dem Ergebnis behutsam sichtbar, ohne dem Vers zusätzliche Handlungselemente hinzuzufügen.
