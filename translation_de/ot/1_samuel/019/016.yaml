  text: וַ/יָּבֹ֨אוּ֙ הַ/מַּלְאָכִ֔ים וְ/הִנֵּ֥ה הַ/תְּרָפִ֖ים אֶל הַ/מִּטָּ֑ה וּ/כְבִ֥יר הָ/עִזִּ֖ים מְרַאֲשֹׁתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: de
  text: Als die Boten hineinkamen, da lagen die Terafim[a] im Bett, mit einem Geflecht aus Ziegenhaar[b] an ihrem Kopfende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Hausgötzenbilder« oder »die Götzenbilder«. Das hebräische Wort Terafim bezeichnet kultische Bilder oder Gegenstände aus dem häuslichen Bereich.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »Geflecht« wiedergegebene hebräische Wort ist selten. Es kann allgemeiner einen gewebten oder geflochtenen Überzug bezeichnen; wahrscheinlich bestand er hier aus Ziegenhaar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: die Boten
  rationale: Im Erzählzusammenhang sind Sauls ausgesandte Männer gemeint. »Boten« ist die übliche, hinreichend breite Wiedergabe für menschliche מַלְאָכִים und vermeidet jede Assoziation mit Engeln.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: Bewahrt die anschauliche, überraschende Entdeckungsfunktion der hebräischen Erzählpartikel; die Verbindung mit »da lag« klingt im Deutschen natürlich und würdevoll.
- source_word: הַתְּרָפִים
  choice: der Terafim
  rationale: Die Transliteration erhält die kulturspezifische Bezeichnung des kultischen Bildes, ohne Größe oder genaue Funktion festzulegen. Der deutsche Singular folgt dem Erzählzusammenhang, in dem ein einzelner Gegenstand als Attrappe dient.
- source_word: אֶל הַמִּטָּה
  choice: im Bett
  rationale: 'Obwohl אֶל gewöhnlich eine Richtung bezeichnet, verlangt die Entdeckungsszene hier idiomatisch eine Ortsangabe: Der Gegenstand liegt als Ersatz für David im Bett.'
- source_word: וּכְבִיר
  choice: das Geflecht
  rationale: Das seltene Wort bezeichnet wahrscheinlich einen gewebten oder geflochtenen Gegenstand. »Geflecht« bewahrt die lexikalische Unsicherheit besser als das stärker funktionsbestimmende »Decke«.
- source_word: הָעִזִּים
  choice: aus Ziegenhaar
  rationale: Im Zusammenhang ist wahrscheinlich das Material des geflochtenen Gegenstands gemeint; »aus Ziegenhaar« gibt diesen natürlichen Sinn klar wieder.
- source_word: מְרַאֲשֹׁתָיו
  choice: an seinem Kopfende
  rationale: Das Wort bezeichnet den Platz am Kopf. »An seinem Kopfende« wahrt den Bezug auf die als Körperersatz hingelegte Figur, ohne einen wirklichen Menschen im Bett vorauszusetzen.
theological_decisions:
- issue: Wiedergabe von תְּרָפִים als kultischem Gegenstand der Hausreligion
  choice: der Terafim
  alternative: das Hausgötzenbild / das Götzenbild
  rationale: Der Vers benennt den Gegenstand, ohne ihn an dieser Stelle ausdrücklich zu bewerten. Die Transliteration bewahrt die kulturelle Eigenart und vermeidet eine über den Wortlaut hinausgehende Festlegung; eine Fußnote erläutert die Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe, da« erhält die lebhafte Entdeckungsszene, ohne insgesamt altertümlich zu wirken. Die seltenen Sachbegriffe werden im Text knapp und in Fußnoten genauer erläutert.
