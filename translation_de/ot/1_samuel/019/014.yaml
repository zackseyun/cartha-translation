base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: de
  text: 'Darauf schickte Saul Boten, um David festzunehmen. Sie[a] sagte: „Er ist krank.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht lediglich „sie sagte“; aus dem Zusammenhang ergibt sich, dass Michal gemeint ist.
    reason: implicit_subject
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Darauf schickte
  rationale: Das Waw-Konsekutiv führt die Handlung weiter. „Darauf“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Hier sind menschliche Abgesandte Sauls gemeint; „Boten“ ist im Deutschen klar und idiomatisch.
- source_word: לָקַחַת
  choice: festzunehmen
  rationale: Das Verb bedeutet grundsätzlich „nehmen“, bezeichnet im Zusammenhang jedoch die beabsichtigte Ergreifung Davids. „Festzunehmen“ gibt dies präzise wieder, ohne ein späteres Ergebnis vorwegzunehmen.
- source_word: אֶת דָּוִד
  choice: David
  rationale: Die Akkusativpartikel kennzeichnet den Eigennamen als direktes Objekt und wird im Deutschen nicht eigens wiedergegeben.
- source_word: וַתֹּאמֶר
  choice: Sie sagte
  rationale: Die feminine Singularform verweist im Zusammenhang auf Michal. Ein adversatives „aber“ wird nicht ergänzt, da die hebräische Konjunktion zunächst nur die Erzählfolge markiert.
- source_word: חֹלֶה הוּא
  choice: Er ist krank
  rationale: Die Verbindung aus prädikativem Adjektiv und Pronomen wird schlicht und idiomatisch wiedergegeben.
theological_decisions: []
