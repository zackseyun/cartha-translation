  register: Moderner, klarer und würdevoller Erzählstil. Die Handlungsfolge wird natürlich wiedergegeben; der im Hebräischen nur grammatisch markierte feminine Bezug bleibt im Haupttext als Pronomen erhalten und wird in der Fußnote erläutert.
