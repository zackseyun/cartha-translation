  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר שָׁא֗וּל אֶל יוֹנָתָ֤ן בְּנ/וֹ֙ וְ/אֶל כָּל עֲבָדָ֔י/ו לְ/הָמִ֖ית אֶת דָּוִ֑ד וִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל חָפֵ֥ץ בְּ/דָוִ֖ד מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: de
  text: Saul sagte zu seinem Sohn Jonatan und zu allen seinen Dienern, sie sollten David töten[a]. Jonatan, der Sohn Sauls, hatte David jedoch sehr gern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „David zu Tode bringen“. Gemeint ist, dass Jonatan und Sauls Diener David töten sollten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hatte großes Wohlgefallen an David“ beziehungsweise „hing sehr an David“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sagte
  rationale: דבר bezeichnet hier im Erzählzusammenhang das Sprechen; mit dem folgenden Inhaltssatz ist „sagte“ im modernen Deutschen natürlicher als „sprach“.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עבד kann am Königshof Diener, Gefolgsleute oder Beamte bezeichnen. „Diener“ bewahrt die Grundbedeutung, ohne ihre genaue Funktion festzulegen.
- source_word: לְהָמִית אֶת דָּוִד
  choice: sie sollten David töten
  rationale: Der Infinitiv mit ל gibt hier Ziel beziehungsweise Inhalt von Sauls Äußerung an. Der deutsche Inhaltssatz macht deutlich, dass Jonatan und die Diener David töten sollten; „töten“ gibt die kontextuelle Bedeutung der kausativen Form von מות natürlich wieder.
- source_word: וִיהוֹנָתָן
  choice: Jonatan … jedoch
  rationale: Das Waw leitet einen deutlichen Gegensatz zwischen Sauls Tötungsabsicht und Jonatans Zuneigung zu David ein; „jedoch“ bildet diese Diskursfunktion ab.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: hatte David sehr gern
  rationale: חפץ ב bezeichnet Wohlgefallen oder starke Zuneigung. „hatte … sehr gern“ ist natürlich und wahrt den Unterschied zum ausdrücklich verwendeten Verb אהב („lieben“) an anderen Stellen.
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: seinem Sohn / der Sohn Sauls
  rationale: Beide Verwandtschaftsangaben des Hebräischen werden beibehalten; die Wiederholung stellt Jonatans Loyalitätskonflikt heraus.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der erste Satz wird als indirekte Aufforderung formuliert, um die im Hebräischen knappe Infinitivkonstruktion eindeutig und natürlich wiederzugeben. Die stärkere Wiedergabe „liebte David sehr“ wird vermieden, weil hier חפץ und nicht אהב steht.
