source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע שָׁא֖וּל בְּ/ק֣וֹל יְהוֹנָתָ֑ן וַ/יִּשָּׁבַ֣ע שָׁא֔וּל חַי יְהוָ֖ה אִם יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: de
  text: 'Saul hörte auf Jonathan und schwor: „So wahr Jahwe lebt: Er wird nicht getötet werden.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die hebräische Schwurformel: „So wahr Jahwe lebt, wenn er getötet wird …“ Die mit „wenn“ eingeleitete Selbstverwünschung bleibt unausgesprochen und drückt hier eine nachdrückliche Verneinung aus: Er wird keinesfalls getötet werden.'
    reason: Erläuterung der elliptischen hebräischen Schwurformel und ihrer starken negativen Bedeutung.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte auf
  rationale: שׁמע bezeichnet hier nicht bloß akustisches Hören, sondern dass Saul Jonatans Bitte Gehör schenkt; „auf ... hören“ gibt diesen responsiven Sinn wieder.
- source_word: בְּקוֹל יְהוֹנָתָן
  choice: auf Jonatans Stimme
  rationale: Die hebräische Wendung שׁמע בקול bedeutet „auf die Stimme hören“ beziehungsweise „jemandem Folge leisten“. Die Formulierung bewahrt das Bild des Ausgangstextes und ist im Deutschen verständlich.
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Das Verb bezeichnet das Ablegen eines Eides; „schwor“ ist knapp, natürlich und dem feierlichen Kontext angemessen.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Dies ist eine feste hebräische Schwurformel. „So wahr ... lebt“ vermittelt ihre feierliche und bindende Kraft idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אִם יוּמָת
  choice: Er soll nicht getötet werden
  rationale: אִם steht in dieser elliptischen Schwurformel für eine nachdrückliche Verneinung. Der Hoph’al von מות ist passiv-kausativ und bedeutet „getötet werden“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Elliptische Schwurformel אִם יוּמָת
  choice: 'als starke Verneinung: „Er soll nicht getötet werden!“'
  alternative: 'wörtlich-formal: „wenn er getötet wird ...“'
  rationale: Im Hebräischen bleibt die Selbstverwünschung des Schwurs unausgesprochen. Im Deutschen würde die bloße Wenn-Konstruktion unvollständig oder missverständlich wirken; deshalb wird die beabsichtigte starke Verneinung im Haupttext ausgedrückt und die Form in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auf Jonatans Stimme hören“ bewahrt bewusst die hebräische Ausdrucksweise, bleibt aber gut verständlich. Das Ausrufezeichen unterstreicht die Entschiedenheit des Eides, ohne zusätzlichen Inhalt einzutragen.
