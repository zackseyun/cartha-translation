base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: de
  text: 'Auch er ging nach Rama und kam bis zu der großen Zisterne[a] in Sechu. Er fragte: »Wo sind Samuel und David?« Jemand[b] antwortete: »Sieh, sie sind in Najot in Rama.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem großen Brunnen« beziehungsweise »der großen Grube« (בּוֹר הַגָּדוֹל).'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Und er sagte«; wer die Antwort gibt, bleibt ungenannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: nach Rama
  rationale: Das an den Ortsnamen angefügte Richtungs-h bezeichnet eine Bewegung auf Rama zu; im Deutschen wird dies natürlich mit »nach Rama« wiedergegeben.
- source_word: בּוֹר הַגָּדוֹל
  choice: die große Zisterne
  rationale: בּוֹר bezeichnet eine ausgehobene Grube und häufig eine Zisterne. Da hier ein bekannter Orientierungspunkt gemeint ist, passt »Zisterne« gut; die ebenfalls möglichen Bedeutungen werden in einer Fußnote genannt.
- source_word: בַּשֶּׂכוּ
  choice: bei Sechu
  rationale: Der Ortsname wird transliteriert; »bei« gibt die Lage des Orientierungspunkts im Bereich von Sechu idiomatisch wieder.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: Er fragte
  rationale: Die hebräische Verbindung »er fragte und sagte« leitet eine direkte Frage ein. Das einfache deutsche »Er fragte« gibt die Funktion natürlich und vollständig wieder.
- source_word: אֵיפֹה
  choice: Wo sind
  rationale: Das Fragewort bedeutet »wo«; wegen des zusammengesetzten Subjekts »Samuel und David« steht im Deutschen der Plural.
- source_word: הִנֵּה
  choice: Sieh
  rationale: »Sieh« bewahrt die hinweisende, Aufmerksamkeit lenkende Funktion von הִנֵּה, ohne das altertümlichere »siehe« zu verwenden.
- source_word: בנוית
  choice: in Najot
  rationale: Der Ortsname wird in einer im Deutschen üblichen Form transliteriert; die Präposition bezeichnet den Aufenthaltsort.
- source_word: בָּרָמָה
  choice: bei Rama
  rationale: Die Ortsangabe bestimmt die Lage Najots näher. »Bei Rama« ist im Deutschen natürlich und vermeidet die möglicherweise missverständliche Aussage, Najot sei zwingend ein Stadtteil innerhalb Ramas.
- source_word: וַיֹּאמֶר
  choice: Jemand antwortete
  rationale: Das hebräische Verb steht im Singular, nennt aber kein ausdrückliches Subjekt. »Jemand« macht diese Unbestimmtheit im Deutschen deutlich; »antwortete« entspricht der Funktion im Gespräch.
