base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/019.yaml
  text: And it was reported to Saul[a], saying, “Look, David is at Naioth in Ramah.”
translation:
  language: de
  text: 'Und es wurde Saul berichtet: „Siehe, David ist in Najot bei Rama.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: wurde berichtet
  rationale: Die passive Erzählform lässt offen, wer Saul die Nachricht überbrachte; die deutsche Formulierung bewahrt diese Unbestimmtheit.
- source_word: לְשָׁאוּל
  choice: Saul
  rationale: Die Präposition kennzeichnet den Empfänger der Mitteilung; im deutschen Passiv steht dieser natürlich ohne zusätzliche Präposition.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeintroduktor wird im natürlichen modernen Deutsch durch einen Doppelpunkt wiedergegeben.
- source_word: הִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: Die aufmerksamkeitslenkende Funktion ist innerhalb der kurzen Meldung im Deutschen durch die direkte Anführung ausreichend vermittelt; ein ausdrückliches „Siehe“ klänge hier unnötig altertümlich.
- source_word: דָוִד
  choice: David
  rationale: Übliche deutsche Form des Personennamens.
- source_word: בְּנוָיֹת
  choice: in Najot
  rationale: Die Präposition bezeichnet einen Ort; „in“ ist hier die naheliegende deutsche Wiedergabe. Der Ortsname folgt der im Deutschen üblichen biblischen Form „Najot“.
- source_word: בָּרָמָה
  choice: bei Rama
  rationale: Rama bezeichnet den größeren Bezugsort; „bei“ drückt verständlich aus, dass Najot zu Rama gehört oder in dessen Bereich liegt, ohne die genaue räumliche Beziehung stärker festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die hebräische passive Mitteilungsform und die direkte Rede bleiben erhalten; altertümliches „Siehe“ wird vermieden.
