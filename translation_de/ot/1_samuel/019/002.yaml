source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד יְהוֹנָתָן֙ לְ/דָוִ֣ד לֵ/אמֹ֔ר מְבַקֵּ֛שׁ שָׁא֥וּל אָבִ֖/י לַ/הֲמִיתֶ֑/ךָ וְ/עַתָּה֙ הִשָּֽׁמֶר נָ֣א בַ/בֹּ֔קֶר וְ/יָשַׁבְתָּ֥ בַ/סֵּ֖תֶר וְ/נַחְבֵּֽאתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: de
  text: 'Jonatan berichtete David: „Mein Vater Saul ist darauf aus, dich zu töten. Sei deshalb am Morgen bitte auf der Hut. Halte dich an einem verborgenen Ort auf und versteck dich.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Bleib im Verborgenen“ oder „Bleib versteckt.“ Im Hebräischen folgt auf „sich an einem verborgenen Ort aufhalten“ noch „sich verstecken“; die Wiederholung verstärkt die Aufforderung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: berichtete
  rationale: Der Hifil von נגד bedeutet hier „mitteilen“ oder „berichten“. „Berichtete“ gibt die gezielte Warnung natürlich wieder, ohne einen förmlichen Ton zu erzwingen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird im modernen Deutschen idiomatisch durch einen Doppelpunkt wiedergegeben; ein zusätzliches „und sagte“ wäre unnötig schwerfällig.
- source_word: מְבַקֵּשׁ ... לַהֲמִיתֶךָ
  choice: ist darauf aus, dich zu töten
  rationale: Das Partizip bezeichnet Sauls gegenwärtige, fortdauernde Absicht. „Ist darauf aus“ bewahrt diesen Verlaufssinn, ohne wie „versucht“ bereits einen konkreten Tötungsversuch vorauszusetzen.
- source_word: הִשָּׁמֶר נָא
  choice: sei ... bitte auf der Hut
  rationale: Der Imperativ von שמר fordert David auf, sich selbst in Acht zu nehmen. „Auf der Hut sein“ ist im Deutschen idiomatisch; „bitte“ gibt die abmildernde Partikel נָא wieder.
- source_word: בַבֹּקֶר
  choice: am Morgen
  rationale: Dies entspricht der zeitlichen Angabe des Hebräischen, ohne das nicht ausdrücklich vorhandene „morgen früh“ in den Text einzutragen.
- source_word: וְיָשַׁבְתָּ בַסֵּתֶר
  choice: Halte dich an einem verborgenen Ort auf
  rationale: ישב kann „sitzen“, „bleiben“ oder „sich aufhalten“ bedeuten; im Zusammenhang des Versteckens ist „sich aufhalten“ natürlich. סֵתֶר kann einen verborgenen Ort oder das Verborgensein bezeichnen; die Übersetzung wahrt hier den örtlichen Sinn.
- source_word: וְנַחְבֵּאתָ
  choice: und versteck dich
  rationale: חבא bezeichnet das Sichverbergen. Die direkte Formulierung erhält sowohl den reflexiven Sinn als auch die nachdrückliche Wiederholung nach „verborgenen Ort“.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: Jonatan ... David ... Mein Vater Saul
  rationale: Die Namen folgen den im Deutschen gebräuchlichen biblischen Formen. Das ausdrücklich genannte „mein Vater“ bleibt erhalten und macht die persönliche Spannung in Jonatans Warnung sichtbar.
theological_decisions: []
