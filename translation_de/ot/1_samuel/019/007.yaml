base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: de
  text: Da rief Jonatan David zu sich und berichtete ihm all dies. Dann brachte Jonatan David zu Saul, und David war in Sauls Gegenwart wie zuvor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie gestern, vorgestern“; eine hebräische Redewendung mit der Bedeutung „wie früher“ oder „wie zuvor“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא יְהוֹנָתָן לְדָוִד
  choice: Da rief Jonatan David zu sich
  rationale: קרא mit לְ und einer Person bezeichnet hier das Herbeirufen. „Zu sich rufen“ ist im Deutschen natürlich und lässt offen, wie förmlich der Ruf war.
- source_word: וַיַּגֶּד לוֹ יְהוֹנָתָן אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: und berichtete ihm alles, was gesagt worden war
  rationale: נגד im Hifil bedeutet „mitteilen/berichten“. דְּבָרִים kann sowohl „Worte“ als auch „Dinge/Angelegenheiten“ bedeuten; die Formulierung gibt im Kontext den gesamten Inhalt der vorangegangenen Rede wieder, ohne nur sachliche Ereignisse zu meinen.
- source_word: וַיָּבֵא יְהוֹנָתָן אֶת דָּוִד אֶל שָׁאוּל
  choice: Dann brachte Jonatan David zu Saul
  rationale: בוא im Hifil hat die kausative Bedeutung „bringen“. Die Wiedergabe bleibt hinsichtlich der Art des Geleits neutral.
- source_word: וַיְהִי לְפָנָיו
  choice: und David war wieder in Sauls Gegenwart
  rationale: לִפְנֵי bezeichnet wörtlich das Sein „vor“ jemandem und kann Gegenwart oder Dienst meinen. „In Sauls Gegenwart“ bewahrt den unmittelbaren Sinn, ohne eine bestimmte Hofstellung ausdrücklich festzulegen. Die Namen lösen die im Hebräischen möglichen Pronomenbezüge natürlich auf.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: wie früher
  rationale: Die wörtlich zeitbezogene Wendung ist ein hebräisches Idiom für den früheren beziehungsweise bisherigen Zustand. „Wie früher“ gibt diese Funktion in natürlichem Deutsch wieder.
