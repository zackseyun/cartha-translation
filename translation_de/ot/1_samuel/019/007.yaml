    issue: „alles, was gesagt worden war“ statt „all dies/alle diese Dinge“
    rationale: Der hebräische Ausdruck דְּבָרִים bezeichnet hier die von Jonatan mitgeteilten Dinge bzw. Angelegenheiten. Die Passivumschreibung beschränkt den Sinn unnötig auf bereits Gesagtes und ist weniger quellennah.
  - severity: low
    issue: Zusätzliches „wieder“
    rationale: Die zeitlich-vergleichende Wendung „wie zuvor“ bildet כְּאֶתְמוֹל שִׁלְשׁוֹם bereits ausreichend ab. Ohne „wieder“ bleibt die Formulierung näher an der Struktur des Ausgangstextes.
