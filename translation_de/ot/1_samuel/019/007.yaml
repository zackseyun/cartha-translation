translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Erzählsprache. Der wiederholte Name Jonatan entspricht der hebräischen Erzählweise; beim anschließenden Satz wurden die mehrdeutigen Pronomen durch David und Saul verdeutlicht. Der Fußnotenmarker steht unmittelbar nach der idiomatisch übersetzten Wendung.
