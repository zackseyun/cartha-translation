base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: de
  text: Er ging dorthin, nach Najot in Rama.[a] Auch über ihn kam der Geist Gottes,[b] und er ging weiter und redete prophetisch, bis er nach Najot in Rama kam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Najot bei Rama«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Auch über ihm war der Geist Gottes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: Najot bei Rama
  rationale: Der Ortsname wird transliteriert. »Bei Rama« gibt die Ortsbeziehung im Deutschen natürlich wieder; »in Rama« bleibt grammatisch möglich.
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: Auch über ihn kam der Geist Gottes
  rationale: Die Wendung היה על mit רוּחַ bezeichnet hier natürlich das Kommen des göttlichen Geistes über eine Person. Die Satzstellung bewahrt die additive Betonung von גַּם הוּא.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: während er weiterging
  rationale: Die Verbindung aus finitem Verb und Infinitivus absolutus drückt einen fortdauernden Vorgang aus; die deutsche Formulierung macht zugleich das Verhältnis zur prophetischen Tätigkeit deutlich.
- source_word: וַיִּתְנַבֵּא
  choice: redete er prophetisch
  rationale: Die Wiedergabe vermeidet die im heutigen Deutsch leicht auf Zukunftsvoraussage verengte Bedeutung von »weissagen«, ohne die nicht näher beschriebene prophetische Tätigkeit psychologisch auszudeuten.
- source_word: עַד בֹּאוֹ
  choice: bis er ... kam
  rationale: Der Infinitiv mit Suffix wird als natürliche deutsche Zeitkonstruktion wiedergegeben.
theological_decisions:
- issue: Bezug und Schreibung von רוּחַ אֱלֹהִים
  choice: der Geist Gottes
  alternative: der geistartige Einfluss Gottes / ein Geist Gottes
  rationale: Im Erzählzusammenhang bezeichnet die Wendung Gottes wirksamen Geist. Die bestimmte deutsche Formulierung ist kontextgemäß, ohne eine weitergehende trinitarische Aussage in den Vers hineinzulesen.
- issue: Art von Sauls prophetischer Tätigkeit
  choice: redete er prophetisch
  alternative: weissagte er / verhielt er sich wie ein Prophet
  rationale: Der Text benennt die Tätigkeit, erklärt aber weder ihren Inhalt noch ihren psychischen oder kultischen Zustand. Die Übersetzung lässt diese Einzelheiten offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, erzählerisch klare Satzführung; Eigennamen nach geläufiger deutscher Transliteration. Die prophetische Tätigkeit wird bewusst nicht als Ekstase oder Zukunftsvoraussage präzisiert.
