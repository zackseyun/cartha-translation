  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: de
  text: Da nahm Michal den Hausgötzen[a] und legte ihn ins Bett. Bei seinem Kopf legte sie ein Geflecht aus Ziegenhaar[b] hin und deckte ihn mit dem Gewand zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Terafim“, „die Hausgötter“ oder „das Kultbild“. Der hebräische Ausdruck bezeichnet häusliche Kultgegenstände und hat eine Pluralform; hier scheint er jedoch eine einzelne, im Bett liegende Figur zu bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bedeutung des seltenen hebräischen Ausdrucks ist unsicher. Gemeint sein könnte ein Geflecht, Netz, Kissen, Polster oder eine ähnliche Arbeit aus Ziegenhaar, die am Kopfende lag.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: den Hausgötzen
  rationale: Das morphologisch pluralische תְּרָפִים bezeichnet häusliche Kultbilder. Der Zusammenhang behandelt den Gegenstand als eine einzelne, ins Bett gelegte Gestalt; „Hausgötze“ vermittelt dies verständlich, während die formale und sachliche Unsicherheit in der Fußnote erhalten bleibt.
- source_word: אֶל הַמִּטָּה
  choice: ins Bett
  rationale: אֶל bezeichnet hier mit שׂים das Hineinlegen beziehungsweise Platzieren im Bett, um eine dort liegende Person vorzutäuschen.
- source_word: כְּבִיר הָעִזִּים
  choice: ein Geflecht aus Ziegenhaar
  rationale: כְּבִיר ist selten und in seiner genauen Bedeutung unsicher. „Geflecht“ bewahrt den wahrscheinlichen Bezug auf einen aus Ziegenhaar gefertigten Gegenstand, ohne ihn unbelegt als Kissen oder Decke festzulegen.
- source_word: מְרַאֲשֹׁתָיו
  choice: an sein Kopfende
  rationale: Der Ausdruck bezeichnet den Bereich am Kopf beziehungsweise das Kopfende. Das maskuline Pronomen bezieht sich im Deutschen natürlich auf den Hausgötzen.
- source_word: בַּבָּגֶד
  choice: mit dem Gewand
  rationale: בֶּגֶד ist die allgemeine Bezeichnung für ein Kleidungsstück oder Gewand; der Artikel wird mit „dem“ wiedergegeben, ohne das Stück genauer als Mantel zu bestimmen.
- source_word: וַתְּכַס
  choice: deckte ihn … zu
  rationale: כסה bedeutet „bedecken“. Die idiomatische deutsche Wendung beschreibt hier anschaulich das Zudecken der im Bett liegenden Figur.
