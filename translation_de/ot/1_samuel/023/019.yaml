base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: de
  text: 'Da zogen die Sifiter zu Saul nach Gibea hinauf und sagten: »Hält sich David nicht bei uns in den Festungen im Waldgebiet[a] verborgen, auf dem Hügel Hachila, der rechts von der Jeschimon liegt[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Horesch«, wenn das hebräische Wort hier als Ortsname verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »rechts von der Jeschimon«; nach hebräischer geografischer Orientierung ist damit wahrscheinlich »südlich von der Jeschimon« gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ זִפִים
  choice: Da zogen die Sifiter … hinauf
  rationale: עלה bezeichnet das Hinaufziehen; זִפִים ist die Einwohnerbezeichnung für die Menschen aus Sif.
- source_word: אֶל שָׁאוּל הַגִּבְעָתָה
  choice: zu Saul nach Gibea
  rationale: Das Richtungs-He an גבעה zeigt eine Bewegung nach Gibea an; die Formulierung macht zugleich deutlich, dass Saul das Ziel der Reise war.
- source_word: לֵאמֹר
  choice: und sagten
  rationale: Das den Redeeinsatz einleitende לֵאמֹר wird in natürlichem modernem Deutsch am besten durch einen finiten Redeeinsatz wiedergegeben.
- source_word: הֲלוֹא דָוִד מִסְתַּתֵּר עִמָּנוּ
  choice: Hält sich David nicht bei uns … verborgen
  rationale: Die rhetorische Frage erwartet Zustimmung. Das Hitpael-Partizip bezeichnet ein andauerndes Sichverbergen; עִמָּנוּ bleibt mit „bei uns“ räumlich und sozial offen.
- source_word: בַמְּצָדוֹת
  choice: in den Bergfesten
  rationale: מְצָדוֹת bezeichnet befestigte oder schwer zugängliche Zufluchtsorte; „Bergfesten“ passt zum topografischen Zusammenhang und zum würdevollen Erzählregister.
- source_word: בַּחֹרְשָׁה
  choice: im Waldgebiet
  rationale: חֹרְשָׁה kann als Bezeichnung eines bewaldeten Geländes verstanden werden; die mögliche Deutung als Ortsname wird in einer Fußnote bewahrt.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: auf dem Hügel Hachila
  rationale: גִּבְעָה bedeutet „Hügel“; die deutsche Namensverbindung ist knapp und natürlich.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: der rechts von der Jeschimon liegt
  rationale: Die Wiedergabe bewahrt das wörtliche Richtungsbild von מִימִין und vermeidet es, die wahrscheinlich gemeinte Himmelsrichtung bereits im Haupttext festzulegen.
