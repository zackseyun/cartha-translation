  to: 'Saul erhielt die Nachricht, dass David nach Keïla gekommen war. Da sagte Saul: »Gott hat ihn in meine Hand ausgeliefert[a]; denn er hat sich eingeschlossen, indem er in eine Stadt mit einem Doppeltor und einem Riegel hineinging[b].«'
