  text: וַ/יֻּגַּ֣ד לְ/שָׁא֔וּל כִּי בָ֥א דָוִ֖ד קְעִילָ֑ה וַ/יֹּ֣אמֶר שָׁא֗וּל נִכַּ֨ר אֹת֤/וֹ אֱלֹהִים֙ בְּ/יָדִ֔/י כִּ֚י נִסְגַּ֣ר לָ/ב֔וֹא בְּ/עִ֖יר דְּלָתַ֥יִם וּ/בְרִֽיחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: de
  text: 'Saul erhielt die Nachricht, dass David nach Keïla gekommen war. Da sagte Saul: »Gott hat ihn in meine Hand ausgeliefert[a]; denn er hat sich eingeschlossen, indem er in eine Stadt mit einem Doppeltor und einem Riegel hineinging[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Gott hat ihn in meine Gewalt gegeben« oder »mir preisgegeben«. Saul deutet Davids Lage als Auslieferung durch Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in eine Stadt mit zwei Torflügeln und einem Riegel«. Gemeint ist eine befestigte Stadt, deren Torflügel mit einem Querbalken verriegelt wurden.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Saul wurde berichtet
  rationale: Die unpersönliche Passivform gibt den Hophal-Sinn wieder und klingt im Deutschen natürlich.
- source_word: בָא דָוִד קְעִילָה
  choice: dass David nach Keïla gekommen war
  rationale: Das Plusquamperfekt ordnet Davids Ankunft zeitlich vor der Meldung an Saul ein; בוא bezeichnet hier das Kommen an einen Zielort.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: Gott hat ihn in meine Hand ausgeliefert
  rationale: נכר hat hier den seltenen Sinn »ausliefern, preisgeben«. Die Wendung »in meine Hand« bewahrt das hebräische Macht- und Gewaltidiom.
- source_word: נִסְגַּר
  choice: er hat sich selbst eingeschlossen
  rationale: Der Niphal kann passiv oder reflexiv verstanden werden. Im Zusammenhang beschreibt Saul Davids Schritt als selbst verursachte Einschließung; die mögliche passive Nuance wird in der Fußnote nicht dogmatisch ausgeschlossen.
- source_word: לָבוֹא
  choice: indem er … gegangen ist
  rationale: Der Infinitiv erläutert, wodurch David nach Sauls Auffassung eingeschlossen ist. Im Deutschen stellt »indem« diesen Zusammenhang klar dar.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: in eine Stadt mit einem Doppeltor und einem Riegel
  rationale: דלתים bezeichnet die beiden Flügel eines Stadttores, בריח den einzelnen Quer- oder Sperrriegel. Die konkrete Befestigungsanlage bleibt sichtbar.
theological_decisions:
- issue: Sauls Deutung von Davids Lage als Handeln Gottes
  choice: Sauls Behauptung wird als direkte Rede ohne kommentierende Distanzierung wiedergegeben.
  alternative: »Saul meinte, Gott habe ihn ihm ausgeliefert.«
  rationale: Der hebräische Text lässt Saul selbst die theologische Deutung aussprechen, bestätigt sie aber nicht ausdrücklich durch den Erzähler. Diese Spannung bleibt erhalten.
- issue: Reflexive oder passive Deutung von נִסְגַּר
  choice: »er hat sich selbst eingeschlossen«
  alternative: »er ist eingeschlossen worden«
  rationale: Sauls Begründung betont, dass David durch das Betreten der befestigten Stadt in eine Falle geraten sei. Die reflexive Wiedergabe passt dazu, ohne eine zusätzliche göttliche Verursachung zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bewahrt Sauls selbstsichere Deutung, ohne sie als Urteil des Erzählers auszugeben. »Keïla« verwendet das Trema zur klaren Aussprache als drei Silben; »Doppeltor und Riegel« vermittelt die antike Befestigung verständlich und konkret.
