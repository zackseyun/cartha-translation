  text: 'Doch da kam ein Bote zu Saul und sagte: »Beeil dich und geh! Denn die Philister sind ins Land eingefallen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: Bote
  rationale: Im militärischen Erzählzusammenhang bezeichnet das Wort einen menschlichen Überbringer einer Nachricht, nicht einen Engel.
- source_word: מַהֲרָה וְלֵכָה
  choice: Beeil dich und komm!
  rationale: Gibt den dringlichen Imperativ idiomatisch wieder; »komm« entspricht der deiktischen Perspektive des Boten.
- source_word: פָשְׁטוּ
  choice: sind … eingefallen
  rationale: Das Verb bezeichnet hier einen feindlichen Überfall beziehungsweise militärischen Einfall und wird im Deutschen natürlich als »einfallen« ausgedrückt.
- source_word: עַל־הָאָרֶץ
  choice: in das Land
  rationale: Bei einem feindlichen Einfall wird die hebräische Präposition עַל im Deutschen idiomatisch mit »in« wiedergegeben; »das Land« bewahrt die im Kontext nicht näher bestimmte Bezeichnung.
