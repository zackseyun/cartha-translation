  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: de
  text: Da kehrte Saul von der Verfolgung Davids um und zog den Philistern entgegen. Deshalb nannte man jenen Ort »Fels der Trennungen«[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fels der Teilungen« beziehungsweise »Fels des Auseinandergehens«. Der Ortsname bezieht sich wahrscheinlich darauf, dass Saul die Verfolgung Davids abbrach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: ließ … ab
  rationale: שׁוב mit מִן und Infinitiv bezeichnet hier die Abkehr von einer laufenden Handlung. Die deutsche Wendung »von der Verfolgung ablassen« gibt den Abbruch der Verfolgung natürlich und präzise wieder.
- source_word: מִרְדֹף אַחֲרֵי דָוִד
  choice: von der Verfolgung Davids
  rationale: רדף bezeichnet im militärisch-narrativen Zusammenhang eine Verfolgung; die Konstruktion mit מִן drückt aus, dass Saul sie beendet.
- source_word: וַיֵּלֶךְ לִקְרַאת פְּלִשְׁתִּים
  choice: zog den Philistern entgegen
  rationale: לקראת bedeutet, jemandem entgegenzugehen, ohne die Art der Begegnung ausdrücklich festzulegen. »zog … entgegen« passt zum militärischen Kontext, ohne bereits »kämpfte gegen« auszusagen.
- source_word: עַל כֵּן
  choice: Deshalb
  rationale: Die Formel leitet die Erklärung des Ortsnamens ein; »Deshalb« ist klar, gegenwärtig und stilistisch angemessen.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: nannte man jenen Ort
  rationale: Der unbestimmte Plural des Hebräischen wird im Deutschen idiomatisch mit dem unpersönlichen »man« wiedergegeben, ohne einen nicht genannten Handlungsträger hinzuzufügen.
- source_word: סֶלַע הַמַּחְלְקוֹת
  choice: Fels der Trennungen
  rationale: סלע bezeichnet einen Felsen oder eine Felsformation. Der Plural הַמַּחְלְקוֹת wird formal als »Trennungen« bewahrt; zugleich bleibt die genaue Bedeutung des erklärenden Ortsnamens offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung bleibt knapp; »ließ … ab« verdeutlicht den Abbruch der Verfolgung, während »entgegenziehen« die im Hebräischen nicht näher bestimmte, hier militärisch geprägte Begegnung bewahrt. Der ungewöhnliche Plural im Ortsnamen wird in Text und Fußnote nicht vorschnell vereindeutigt.
