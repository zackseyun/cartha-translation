  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: de
  text: 'Doch Davids Männer sagten zu ihm: „Sieh doch, schon hier in Juda haben wir Angst. Wie viel mehr erst, wenn wir nach Keïla gegen die Schlachtreihen der Philister ziehen!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… erst recht, wenn wir nach Keïla gegen die Reihen der Philister ziehen!“ Die hebräische Wendung argumentiert vom Geringeren zum Größeren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Doch … sagten
  rationale: 'Das narrative וַ wird im Zusammenhang kontrastiv wiedergegeben: Die Männer reagieren zögernd auf die zuvor erteilte Weisung.'
- source_word: אַנְשֵׁי דָוִד
  choice: Davids Männer
  rationale: Die hebräische Genitivverbindung wird im Deutschen natürlich und präzise wiedergegeben.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die Wendung bewahrt den nachdrücklichen, Aufmerksamkeit heischenden Charakter, ohne altertümlich zu klingen.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: schon hier in Juda haben wir Angst
  rationale: Die Stellung von „schon“ verdeutlicht im Deutschen die im hebräischen Folgesatz vorausgesetzte Steigerung, während Ort und Furcht erhalten bleiben.
- source_word: וְאַף כִּי
  choice: Wie viel mehr dann, wenn
  rationale: Die idiomatische Argumentation vom Geringeren zum Größeren wird verständlich und mit ihrer rhetorischen Kraft wiedergegeben.
- source_word: נֵלֵךְ קְעִלָה
  choice: wir nach Keïla … ziehen
  rationale: „Ziehen“ passt zur Bewegung einer bewaffneten Gruppe; die Ortsangabe bezeichnet das Ziel.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: gegen die Schlachtreihen der Philister
  rationale: מַעַרְכוֹת bezeichnet geordnete militärische Reihen beziehungsweise die Schlachtaufstellung; אֶל hat hier aufgrund der bevorstehenden Konfrontation die Richtung „gegen“.
