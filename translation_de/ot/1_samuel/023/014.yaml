reference: 1 Samuel 23:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: de
  text: David hielt sich in der Wildnis in den Festungen[a] auf und blieb im Bergland der Wildnis von Sif. Saul suchte die ganze Zeit nach ihm, aber Gott gab ihn nicht in seine Hand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an befestigten Zufluchtsorten«.'
    reason: Die Alternative erläutert den defensiven Sinn von מְצָדוֹת, ohne einen im Grundtext nicht ausdrücklich genannten Bergbezug hinzuzufügen.
  - marker: b
    text: 'Das heißt: Gott lieferte David nicht an Saul aus. Hebräisch: »Gott gab ihn nicht in seine Hand«.'
    reason: Die Fußnote erklärt das hebräische Idiom und klärt den Bezug des Pronomens, ohne ihn im Haupttext ausdrücklich zu ersetzen.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: hielt sich auf / blieb
  rationale: ישׁב bezeichnet hier ein anhaltendes Verweilen. Die beiden unterschiedlichen, natürlichen deutschen Wendungen vermeiden eine schwerfällige Wiederholung, ohne den Sinn zu verändern.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר meint häufig unbebautes, dünn besiedeltes Land und nicht zwingend eine Sandwüste. »Wildnis« bewahrt diese geografische Breite.
- source_word: בַּמְּצָדוֹת
  choice: in den Bergfesten
  rationale: מְצָדוֹת bezeichnet befestigte oder schwer zugängliche Zufluchtsorte. »Bergfesten« bewahrt den defensiven Charakter und passt zum Gelände, ohne reguläre Festungsbauten vorauszusetzen.
- source_word: בָּהָר
  choice: im Bergland
  rationale: הַר kann einen Berg oder eine bergige Region bezeichnen. Der regionale Zusammenhang spricht für das natürliche deutsche »Bergland«.
- source_word: בְּמִדְבַּר זִיף
  choice: der Wildnis von Sif
  rationale: Die Status-constructus-Verbindung bezeichnet die zu Sif gehörende beziehungsweise nach Sif benannte Wildnisregion.
- source_word: וַיְבַקְשֵׁהוּ
  choice: suchte nach ihm
  rationale: בקשׁ bezeichnet in diesem Verfolgungskontext das anhaltende Suchen nach David.
- source_word: כָּל הַיָּמִים
  choice: die ganze Zeit
  rationale: Die wörtliche Wendung »alle Tage« drückt fortgesetzte Dauer aus. »Die ganze Zeit« gibt dies in modernem Deutsch idiomatisch wieder, ohne zwingend eine tägliche Einzelhandlung zu behaupten.
- source_word: וְלֹא נְתָנוֹ
  choice: aber Gott gab ihn nicht
  rationale: נתן wird formal mit »geben« wiedergegeben; zusammen mit »in seine Hand« entsteht das hebräische Bild für die Auslieferung an fremde Gewalt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezieht sich hier mit singularischer Bedeutung auf Gott.
- source_word: בְּיָדוֹ
  choice: in seine Hand
  rationale: Die Formulierung bewahrt das hebräische Macht- und Auslieferungsidiom. Das Pronomen bezieht sich im Kontext auf Saul; eine Fußnote macht dies transparent.
theological_decisions:
- issue: Gottes Bewahrung Davids in der Verfolgung
  choice: Gott gab ihn nicht in seine Hand
  alternative: Gott lieferte ihn Saul nicht aus
  rationale: Die Fassung schreibt Davids Bewahrung wie der hebräische Text unmittelbar Gott zu und bewahrt zugleich das Bild »in die Hand geben«, ohne die Aussage über die Vorsehung weiter auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlichem Erzählstil. »Bergfesten« erhält den Geländebezug und den defensiven Sinn, wird aber wegen seiner geringeren Alltagssprachlichkeit erläutert. Die Wiederholung von וַיֵּשֶׁב wird im Deutschen leicht variiert; das hebräische Idiom am Versende bleibt bewusst erhalten.
