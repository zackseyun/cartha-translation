base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: de
  text: Und nun, König, komm herab, ganz wie es deine Seele verlangt[a] – komm herab![b] Es ist an uns, ihn in die Hand des Königs auszuliefern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier das „Verlangen deiner Seele“, eine hebräische Wendung für einen tiefen oder starken Wunsch; sinngemäß auch: „ganz nach deinem Herzenswunsch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen wird das Verb „herabkommen“ durch die Verbindung von Infinitiv und Imperativ nachdrücklich wiederholt: „herabzukommen – komm herab“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Funktion als auch den unmittelbaren Übergang zur Aufforderung natürlich wieder.
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: ganz wie es deine Seele verlangt
  rationale: Bewahrt das hebräische Bild der Seele als Sitz des tiefen Verlangens und gibt לְכָל als vollständige Übereinstimmung mit dem Wunsch des Königs wieder.
- source_word: הַמֶּלֶךְ
  choice: König
  rationale: Der bestimmte Ausdruck dient hier als direkte Anrede. Im Deutschen ist die bloße Anrede „König“ klarer und natürlicher als das altertümliche „o König“.
- source_word: לָרֶדֶת רֵד
  choice: komm herab … ja, komm herab!
  rationale: Die Verbindung aus Infinitiv und Imperativ verstärkt die Aufforderung. Die Wiederholung bleibt sichtbar; „ja“ macht ihre emphatische Funktion im Deutschen deutlich.
- source_word: וְלָנוּ
  choice: An uns ist es
  rationale: Drückt Zuständigkeit und übernommene Verantwortung aus, ohne den Satz vorschnell in eine bloße Zukunftsaussage umzudeuten.
- source_word: הַסְגִּירוֹ
  choice: ihn … auszuliefern
  rationale: Der Hifil von סגר bezeichnet hier die Übergabe eines Menschen in die Gewalt eines anderen; „ausliefern“ ist im Deutschen präzise und kontextgerecht.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: in die Hand des Königs
  rationale: Erhält das hebräische Macht- und Verfügungsbild, statt es zum bloßen „dem König“ abzuflachen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die markante Wiederholung des Hebräischen und das Bild von „Seele“ und „Hand“ bleiben erhalten; zugleich wird die direkte Anrede ohne unnötig altertümliches „o“ formuliert.
