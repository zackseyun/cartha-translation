base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: de
  text: So zog David mit seinen Männern nach Keïla. David kämpfte gegen die Philister, trieb deren Vieh weg und brachte ihnen eine schwere Niederlage bei.[a] So rettete David die Einwohner von Keïla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »versetzte ihnen einen schweren Schlag«; möglich ist auch: »richtete unter ihnen ein großes Blutbad an«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »befreite« beziehungsweise »brachte … in Sicherheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשָׁיו קְעִילָה
  choice: So zog David mit seinen Männern nach Keïla
  rationale: הלך bezeichnet in der fortlaufenden Erzählung die Bewegung zum genannten Ziel. „zog … nach“ klingt im militärischen Zusammenhang natürlich; אֲנָשָׁיו meint Davids Gefolgsleute bzw. Kampftruppe.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: Sie kämpften gegen die Philister
  rationale: לחם mit ב bezeichnet hier den Kampf gegen einen Gegner. Der Plural entspricht im Deutschen natürlich David und seinen Männern, auch wenn das Hebräische die Handlung mit einem Verb im Singular an David weiterführt.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: trieben deren Vieh weg
  rationale: נהג bezeichnet das Treiben bzw. Wegführen von Tieren; מִקְנֶה ist ein Sammelbegriff für Nutzvieh und nicht auf Rinder beschränkt.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: brachten ihnen eine schwere Niederlage bei
  rationale: Die idiomatische Verbindung aus נכה und מַכָּה bezeichnet einen schweren Schlag beziehungsweise eine vernichtende militärische Schädigung. „schwere Niederlage“ ist im modernen Deutschen natürlich und legt den Umfang der Tötungen nicht unnötig fest.
- source_word: וַיֹּשַׁע דָּוִד
  choice: So rettete David
  rationale: ישע bezeichnet hier die Rettung oder Befreiung aus militärischer Gefahr. „rettete“ ist direkt und allgemein verständlich.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: die Einwohner von Keïla
  rationale: Die substantivierte Partizipialform bezeichnet die in Keïla Wohnenden; „Einwohner“ ist präzise und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger militärischer Erzählweise. Der Ortsname wird als „Keïla“ geschrieben, damit die Vokale getrennt gesprochen werden. Die wiederholten hebräischen Erzählungsverknüpfungen werden natürlich gegliedert, ohne die Abfolge der Handlungen zu verändern.
