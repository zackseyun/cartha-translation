  terminology: Eigennamen, Ortsbezeichnung und zentrale Verben sind konsistent und sachgerecht wiedergegeben. „Felsen“ ist eine transparente Wiedergabe von הַסֶּלַע und legt keine spezifischere Geländeform fest. Keine theologischen Begriffe oder strittigen Lehrfragen sind betroffen.
