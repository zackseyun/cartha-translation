  text: וַ/יֵּ֨לֶךְ שָׁא֣וּל וַ/אֲנָשָׁי/ו֮ לְ/בַקֵּשׁ֒ וַ/יַּגִּ֣דוּ לְ/דָוִ֔ד וַ/יֵּ֣רֶד הַ/סֶּ֔לַע וַ/יֵּ֖שֶׁב בְּ/מִדְבַּ֣ר מָע֑וֹן וַ/יִּשְׁמַ֣ע שָׁא֔וּל וַ/יִּרְדֹּ֥ף אַחֲרֵֽי דָוִ֖ד מִדְבַּ֥ר מָעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: de
  text: Da zogen Saul und seine Männer los, um ihn zu suchen. Man berichtete es David, und er ging zum Felsen hinab und blieb in der Wüste Maon. Als Saul davon hörte, verfolgte er David in der Wüste Maon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: um ihn zu suchen
  rationale: Der Infinitiv bezeichnet den Zweck des Aufbruchs. Das im Hebräischen unausgesprochene Objekt David wird im Deutschen aus dem Zusammenhang ergänzt.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Man berichtete es David
  rationale: Die aktive Pluralform hat ein unbestimmtes Subjekt. Die deutsche unpersönliche Form mit „man“ gibt dies natürlich wieder; „es“ nimmt Sauls Vorgehen aus dem Kontext auf.
- source_word: וַיֵּרֶד
  choice: er ging … hinab
  rationale: Die Form bezeichnet eine Abwärtsbewegung; das Subjekt David ergibt sich aus dem unmittelbaren Zusammenhang.
- source_word: הַסֶּלַע
  choice: der Felsen
  rationale: Die bestimmte Nominalform bezeichnet den Felsen beziehungsweise eine bekannte Felsformation. „Felsen“ bewahrt das konkrete Bild, ohne die Geländeform genauer festzulegen.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: Im Erzählzusammenhang bezeichnet das Verb den Aufenthalt an einem Ort. „Blieb“ ist modernes, natürliches Deutsch und vermeidet das hier missverständliche „wohnte“.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: in der Wüste Maon
  rationale: מִדְבָּר bezeichnet unbesiedeltes Weide- oder Wildnisgebiet und nicht zwingend eine Sandwüste. „Wüste“ ist im bibelgeografischen Deutsch verständlich; Maon wird als Ortsname transkribiert.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: verfolgte
  rationale: Die hebräische Verbindung bedeutet, jemandem verfolgend nachzusetzen. Das deutsche Verb „verfolgen“ gibt die Wendung knapp und idiomatisch wieder.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: Da zogen Saul und seine Männer los
  rationale: Die Verbfolge führt die Erzählung weiter und knüpft an den vorangehenden Zusammenhang an. „zogen … los“ bezeichnet den gezielten Aufbruch natürlich und würdevoll.
theological_decisions: []
