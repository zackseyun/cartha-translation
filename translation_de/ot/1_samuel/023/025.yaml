  source_fidelity: 'Die Übersetzung gibt die Handlungskette des Hebräischen zuverlässig wieder: Saul und seine Männer brechen zur Suche nach David auf; David wird durch ein unbestimmtes Plural-Subjekt informiert; er geht zum Felsen hinab und hält sich in der Wüste Maon auf; Saul verfolgt ihn dort. Das ergänzte Objekt „ihn“ ist eindeutig David. Die unpersönliche Wiedergabe „Man berichtete es David“ bewahrt angemessen, dass die Informierenden nicht benannt werden.'
