reference: 1 Samuel 23:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: de
  text: 'Saul sagte: „Jahwe segne euch[a], weil ihr Mitleid mit mir hattet[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Ihr seid von Jahwe gesegnet.“'
    reason: Die hebräische nominale Segensformel kann sowohl als Segenszuspruch als auch als Feststellung wiedergegeben werden.
  - marker: b
    text: Das hebräische Verb kann auch „Erbarmen haben“ oder, in manchen Zusammenhängen, „verschonen“ bedeuten.
    reason: Die Bedeutungsbreite von חמל umfasst inneres Mitleid sowie die daraus hervorgehende Handlung des Verschonens.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das narrative Wayyiqtol von אמר wird im Deutschen idiomatisch als einfache Vergangenheitsform wiedergegeben; das einleitende ו wird im fortlaufenden Erzählstil nicht eigens übersetzt.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: בְּרוּכִים אַתֶּם
  choice: segne euch
  rationale: Die nominale Wendung mit prädikativem Adjektiv und Pronomen ist hier eine Segensformel. Der deutsche Konjunktiv „segne“ gibt ihre performative Kraft natürlich wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Das ל bezeichnet in der Segensformel die Beziehung zum beziehungsweise den Ursprung des Segens. In der natürlichen deutschen Formulierung „Jahwe segne euch“ wird Jahwe als Geber des Segens ausdrücklich genannt.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion führt den Grund für Sauls Segenswunsch an; „weil“ drückt diesen kausalen Zusammenhang in modernem Deutsch klar aus.
- source_word: חֲמַלְתֶּם
  choice: Mitleid ... hattet
  rationale: חמל bezeichnet Mitleid oder Erbarmen und kann je nach Zusammenhang auch ein daraus folgendes Verschonen meinen. Hier passt die zwischenmenschliche Bedeutung „Mitleid haben“ am besten.
- source_word: עָלָי
  choice: mit mir
  rationale: Nach חמל wird על im Deutschen idiomatisch durch die feste Verbindung „Mitleid mit jemandem haben“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussage oder Segenswunsch in בְּרוּכִים אַתֶּם לַיהוָה
  choice: Jahwe segne euch
  alternative: Ihr seid von Jahwe gesegnet
  rationale: Die grammatische Form kann als Feststellung verstanden werden, fungiert im Kontext jedoch wahrscheinlich als ausgesprochener Segenswunsch. Die Fußnote bewahrt die formnähere Alternative.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Segensformel wird idiomatisch formuliert; zwei Fußnoten erhalten die formale und lexikalische Mehrdeutigkeit des Hebräischen.
