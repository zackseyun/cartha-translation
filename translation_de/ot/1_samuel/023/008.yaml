  text: וַ/יְשַׁמַּ֥ע שָׁא֛וּל אֶת כָּל הָ/עָ֖ם לַ/מִּלְחָמָ֑ה לָ/רֶ֣דֶת קְעִילָ֔ה לָ/צ֥וּר אֶל דָּוִ֖ד וְ/אֶל אֲנָשָֽׁי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/008.yaml
  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: de
  text: Da rief Saul das ganze Volk zum Krieg zusammen[a], um nach Keïla hinabzuziehen und David und seine Männer zu belagern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bot Saul das ganze Volk zum Kampf auf«. Das hebräische Verb bedeutet wörtlich »hören lassen« und bezeichnet hier wahrscheinlich das Zusammenrufen zu einer militärischen Aktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: rief … zusammen
  rationale: Die Hifil-Form von שׁמע bedeutet wörtlich etwa »hören lassen«; im militärischen Zusammenhang bezeichnet sie hier das Aufbieten beziehungsweise Zusammenrufen.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Dies gibt den hebräischen Ausdruck formal wieder. Der Zusammenhang macht deutlich, dass die zum Kriegsdienst Aufgebotenen gemeint sind, ohne den Ausdruck ausdrücklich zu »Heer« zu verengen.
- source_word: לַמִּלְחָמָה
  choice: zum Krieg
  rationale: 'Die Wendung bezeichnet den Zweck des Zusammenrufens: militärisches Vorgehen. »Zum Krieg« bewahrt den breiteren Sinn gegenüber dem engeren »zur Schlacht«.'
- source_word: לָרֶדֶת
  choice: hinabzuziehen
  rationale: ירד bezeichnet das Hinabgehen oder Hinabziehen. In einer militärischen Erzählung ist »hinabziehen« natürlich und erhält die Bewegungsrichtung.
- source_word: קְעִילָה
  choice: Keïla
  rationale: Gebräuchliche deutsche Wiedergabe des Ortsnamens; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: לָצוּר
  choice: zu belagern
  rationale: צור bezeichnet hier eine militärische Einschließung. Obwohl Personen und nicht die Stadt als direktes Ziel genannt werden, gibt »belagern« Sauls Absicht sachgerecht wieder.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: David und seine Männer
  rationale: אֶל kennzeichnet in Verbindung mit צור das Ziel der feindlichen Maßnahme. »Seine Männer« bewahrt die allgemeinere hebräische Bezeichnung und vermeidet die präzisierende Einengung auf reguläre Soldaten.
