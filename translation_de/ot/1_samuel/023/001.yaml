source:
  edition: WLC
  text: וַ/יַּגִּ֥דוּ לְ/דָוִ֖ד לֵ/אמֹ֑ר הִנֵּ֤ה פְלִשְׁתִּים֙ נִלְחָמִ֣ים בִּ/קְעִילָ֔ה וְ/הֵ֖מָּה שֹׁסִ֥ים אֶת הַ/גֳּרָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: de
  text: 'Dann berichtete man David: „Siehe, die Philister kämpfen gegen Keïla[a] und plündern die Tennen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Keïla“ beziehungsweise „bei Keïla“. Die hebräische Präposition bedeutet wörtlich „in“; im militärischen Zusammenhang ist wahrscheinlich gemeint, dass die Philister die Stadt angreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Dann berichtete man David
  rationale: Der Hifil-Wajjiqtol von נגד führt das nächste Ereignis der Erzählung ein. Das unpersönliche „man“ gibt das nicht näher bestimmte pluralische Subjekt im Deutschen natürlich wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeformel wird im natürlichen modernen Deutsch durch einen Doppelpunkt vor der direkten Rede ausgedrückt.
- source_word: הִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: Die Aufmerksamkeitspartikel kennzeichnet die Dringlichkeit der Meldung; diese Funktion wird im Deutschen bereits durch die unmittelbare direkte Rede getragen. Ein ausdrückliches „Sieh“ oder „Schau“ klänge hier weniger natürlich.
- source_word: פְלִשְׁתִּים נִלְחָמִים
  choice: Die Philister kämpfen
  rationale: Das Nifal-Partizip bezeichnet eine gerade stattfindende militärische Auseinandersetzung; „kämpfen“ bewahrt die Breite des Ausdrucks, ohne die konkrete Angriffsform festzulegen.
- source_word: בִּקְעִילָה
  choice: gegen Keïla
  rationale: Die Präposition ב bedeutet wörtlich „in/an“, kann hier aber den Ort beziehungsweise das Ziel des militärischen Vorgehens bezeichnen. Der Kontext legt einen Angriff auf die Stadt nahe.
- source_word: וְהֵמָּה שֹׁסִים
  choice: und plündern
  rationale: Das selbstständige Pronomen hebt die Philister als Handelnde hervor; im Deutschen bleibt der Bezug auch ohne wiederholtes Pronomen klar. „Plündern“ trifft den kriegerischen Sinn von שסס/שסה.
- source_word: אֶת הַגֳּרָנוֹת
  choice: die Tennen
  rationale: גֹּרֶן bezeichnet den befestigten Platz, auf dem Getreide gedroschen und geworfelt wurde. „Tennen“ ist die präzise und knappe deutsche Sachbezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdevolles Erzähldeutsch. „Keïla“ nutzt das Trema zur klaren Aussprache als drei Silben. „Tennen“ ist sachlich genau, wenn auch weniger alltagssprachlich; der Kontext macht die landwirtschaftliche Bedeutung verständlich.
