  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: de
  text: 'Er sagte zu ihm: „Hab keine Angst! Denn die Hand meines Vaters Saul wird dich nicht erreichen.[a] Du wirst über Israel als König herrschen, und ich werde der Zweite nach dir sein.[b] Auch mein Vater Saul weiß es.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Denn die Hand meines Vaters Saul wird dich nicht finden.“ Die „Hand“ steht bildlich für Macht oder Zugriff.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde dein Zweiter sein“; gemeint ist die nachgeordnete Stellung unmittelbar nach David.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Hab keine Angst!
  rationale: Natürliche, gegenwärtige Wiedergabe des verneinten Imperativs; sie bewahrt den Zuspruch und seine Dringlichkeit.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: die Hand meines Vaters Saul wird dich nicht erreichen
  rationale: Bewahrt das hebräische Bild der „Hand“ als Ausdruck von Macht oder Zugriff. „Erreichen“ vermittelt im Deutschen die beabsichtigte Bedrohung natürlicher als das wörtliche „finden“, ohne das Bild aufzulösen.
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: Du wirst über Israel als König herrschen
  rationale: Gibt das Verb מלך eindeutig als Ausübung der Königsherrschaft wieder und klingt im modernen Deutschen natürlicher als „über Israel regieren“, das nicht zwingend Königtum bezeichnet.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: ich werde der Zweite nach dir sein
  rationale: Gibt den nachgeordneten Rang von מִשְׁנֶה wieder, ohne einen modernen Amtstitel wie „Stellvertreter“ oder „zweiter Befehlshaber“ einzutragen.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: Auch mein Vater Saul weiß, dass es so kommen wird
  rationale: Bezieht כֵּן verständlich auf die zuvor angekündigte künftige Königsherrschaft und Rangordnung. Die Zukunftsformulierung folgt dem Inhalt der vorausgehenden Aussagen.
theological_decisions:
- issue: Charakter von Jonatans Aussage über Davids künftige Königsherrschaft
  choice: Als bestimmte Erwartung wiedergeben, ohne sie ausdrücklich als göttliche Prophezeiung oder messianische Aussage zu bezeichnen
  alternative: Die Aussage durch Zusätze als ausdrückliche Weissagung göttlicher Einsetzung kennzeichnen
  rationale: Der Vers nennt Gott nicht ausdrücklich. Er bezeugt Jonatans Gewissheit über Davids Königtum und seine eigene nachgeordnete Stellung, lässt aber die theologische Grundlage in diesem Satz unausgesprochen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt persönlich und eindringlich. Das konkrete Bild der „Hand“ bleibt erhalten; ungebräuchliches wörtliches Deutsch wird in der Fußnote dokumentiert.
