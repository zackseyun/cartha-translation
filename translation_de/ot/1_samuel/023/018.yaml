source:
  edition: WLC
  text: וַ/יִּכְרְת֧וּ שְׁנֵי/הֶ֛ם בְּרִ֖ית לִ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֤שֶׁב דָּוִד֙ בַּ/חֹ֔רְשָׁה וִ/יהוֹנָתָ֖ן הָלַ֥ךְ לְ/בֵיתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: de
  text: Und die beiden schlossen vor Jahwe einen Bund.[a] David aber blieb im Waldgebiet[b], und Jonatan ging nach Hause.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »schnitten einen Bund«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in Horesch«; das Hebräische kann hier als Ortsname oder als Bezeichnung für ein Waldgebiet verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: schlossen
  rationale: Die hebräische Wendung כרת ברית lautet wörtlich »einen Bund schneiden«. Im heutigen Standarddeutsch wird ein Bund jedoch natürlich und treffend »geschlossen«; die bildhafte Ausgangsform bleibt in der Fußnote erhalten.
- source_word: שְׁנֵיהֶם
  choice: die beiden
  rationale: Die Form bezeichnet ausdrücklich David und Jonatan zusammen und wird im Deutschen knapp und eindeutig wiedergegeben.
- source_word: בְּרִית
  choice: Bund
  rationale: »Bund« bewahrt den feierlichen und verpflichtenden Beziehungscharakter des hebräischen בְּרִית besser als das schwächere »Vereinbarung« oder das stärker politische »Vertrag«.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die knappe Formulierung entspricht dem Hebräischen und bringt zum Ausdruck, dass der Bund in Gottes Gegenwart und unter seiner Bezeugung geschlossen wurde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen geläufige wissenschaftliche Form.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: Im Zusammenhang bezeichnet das Verb das Verbleiben an einem Ort, nicht das wörtliche Sitzen oder eine dauerhafte Ansiedlung.
- source_word: בַּחֹרְשָׁה
  choice: im Waldgebiet
  rationale: חֹרֶשׁ kann Wald, Gehölz oder Dickicht bezeichnen. Die vokalisierte Form lässt sich hier als Gattungsbezeichnung mit Artikel verstehen; wegen des möglichen Ortsnamens wird die Alternative in einer Fußnote genannt.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: ging nach Hause
  rationale: Dies gibt die Bedeutung der hebräischen Wendung natürlich und vollständig wieder; ein wörtlicheres »ging zu seinem Haus« wäre im Deutschen unnötig steif.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe »Jahwe« bewahrt den Charakter als persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Bundesschlusses vor Jahwe
  choice: vor Jahwe
  alternative: in der Gegenwart Jahwes
  rationale: Die knappe Übersetzung wahrt die Aussage, dass der Bund unter göttlicher Gegenwart beziehungsweise Bezeugung geschlossen wurde, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Satzfluss. »Bund schließen« und »nach Hause gehen« sind idiomatisch; die genuine Mehrdeutigkeit von בַּחֹרְשָׁה wird nicht aufgelöst, sondern in der Fußnote offengehalten.
