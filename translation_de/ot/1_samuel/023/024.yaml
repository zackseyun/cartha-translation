base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: de
  text: Sie machten sich auf und gingen Saul voraus nach Sif. David und seine Männer hielten sich in der Wüste von Maon auf, in der Araba, südlich[a] des Jeschimon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Rechten des Jeschimon“. Bei geographischer Orientierung kann die rechte Seite den Süden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Jeschimon“ kann auch als „Ödland“ oder „Wüste“ verstanden werden; hier ist das Wort wahrscheinlich eine Ortsbezeichnung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֛וּמוּ
  choice: Sie machten sich auf
  rationale: Die Form führt die Erzählung mit der nächsten Handlung fort. „Sich aufmachen“ gibt קום in natürlichem, zugleich gehobenem Erzählstil wieder.
- source_word: וַיֵּלְכ֥וּ
  choice: und gingen
  rationale: הלך bezeichnet hier schlicht die Bewegung zum genannten Ziel; „gingen“ ist direkt und ungekünstelt.
- source_word: זִ֖יפָה
  choice: nach Sif
  rationale: Das Richtungs-He bezeichnet eine Bewegung auf Sif zu; im Deutschen wird dies idiomatisch mit „nach“ ausgedrückt.
- source_word: לִפְנֵ֣י שָׁא֑וּל
  choice: Saul voraus
  rationale: לִפְנֵי bezeichnet hier ein Vorangehen in räumlicher beziehungsweise zeitlicher Hinsicht. „Saul voraus“ bewahrt diese Bedeutung knapp und natürlich.
- source_word: וְדָוִ֨ד וַאֲנָשָׁ֜יו
  choice: David und seine Männer aber hielten sich … auf
  rationale: Der verblosen hebräischen Zustandsangabe wird im Deutschen ein Verb hinzugefügt. „Aber“ markiert den Wechsel von Sauls Leuten zu Davids Aufenthaltsort.
- source_word: בְּמִדְבַּ֤ר מָעוֹן֙
  choice: in der Wüste Maon
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Weideland beziehungsweise Wildnis. „Wüste Maon“ ist eine verständliche und geographisch passende Wiedergabe.
- source_word: בָּ/עֲרָבָ֔ה
  choice: in der Araba
  rationale: Mit Artikel und innerhalb einer Ortsbeschreibung ist עֲרָבָה wahrscheinlich als geographische Regionsbezeichnung zu verstehen. Die Transliteration bewahrt diesen Ortsbezug.
- source_word: אֶ֖ל יְמִ֥ין הַ/יְשִׁימֽוֹן
  choice: südlich des Jeschimon
  rationale: יָמִין bedeutet wörtlich „rechte Seite“, kann bei der antiken Orientierung nach Osten jedoch den Süden bezeichnen. „Südlich“ vermittelt den wahrscheinlichen geographischen Sinn; die wörtliche Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: הַ/יְשִׁימֽוֹן
  choice: der Jeschimon
  rationale: Das Wort kann „Ödland“ bedeuten, dient hier aber wahrscheinlich als geographische Bezeichnung. Die Namensform vermeidet eine vorschnelle Festlegung auf ein Gattungswort.
