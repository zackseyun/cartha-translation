reference: 1 Samuel 23:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: de
  text: 'Da sagte David: »Jahwe[a], Gott Israels, dein Diener hat mit Gewissheit gehört, dass Saul nach Keïla kommen will, um die Stadt meinetwegen zu vernichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit der narrativen Verbform führt die Handlung weiter; »Da sagte« gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Die Status-constructus-Verbindung wird knapp und sachgerecht wiedergegeben.
- source_word: שָׁמֹעַ שָׁמַע
  choice: hat mit Gewissheit gehört
  rationale: Der vorangestellte Infinitivus absolutus verstärkt das finite Verb. »Mit Gewissheit« bewahrt diese Betonung, ohne den Inhalt des Gehörten als erwiesene Tatsache auszugeben.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: David bezeichnet sich im Gebet ehrerbietig als Gottes Diener; »Diener« passt hier besser als das sozial enger gefasste »Sklave«.
- source_word: מְבַקֵּשׁ
  choice: will
  rationale: Das Partizip bezeichnet Sauls gegenwärtiges Bestreben beziehungsweise Vorhaben. »Will« ist im Deutschen natürlicher als das wörtlichere »sucht« und legt den Erfolg nicht fest.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: nach Keïla kommen
  rationale: בוא wird als »kommen« wiedergegeben; »nach Keïla« entspricht bei einem Ortsnamen natürlichem Deutsch.
- source_word: לְשַׁחֵת לָעִיר
  choice: um die Stadt zu vernichten
  rationale: Die Zweckkonstruktion und die starke Bedeutung von שׁחת im militärischen Zusammenhang werden klar bewahrt.
- source_word: בַּעֲבוּרִי
  choice: meinetwegen
  rationale: Die Form bezeichnet David als Ursache beziehungsweise Anlass der drohenden Zerstörung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Transliteration bewahrt den persönlichen Gottesnamen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Intensivierung in שָׁמֹעַ שָׁמַע
  choice: dein Diener hat mit Gewissheit gehört
  alternative: ich habe zuverlässig erfahren
  rationale: Die dritte Person der ehrerbietigen Selbstbezeichnung und die verbale Verstärkung bleiben sichtbar. Zugleich wird nicht entschieden, ob Davids Information objektiv wahr ist; der Satz betont die Gewissheit seines Hörens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetsanrede bleibt feierlich, ohne altertümliches »o«. »Keïla« verwendet das Trema, damit die Vokale getrennt gesprochen werden. Die Formulierung wahrt die emphatische hebräische Konstruktion und Davids ehrerbietige Selbstbezeichnung.
