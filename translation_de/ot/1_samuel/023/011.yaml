source:
  edition: WLC
  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: de
  text: '»Werden die Männer von Keïla mich in seine Hand ausliefern[a]? Wird Saul herabkommen, wie dein Diener gehört hat? Yahweh, Gott Israels, sag es bitte deinem Diener!« Und Yahweh sagte: »Er wird herabkommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »In seine Hand« ist eine hebräische Wendung für »in seine Gewalt«; gemeint ist Sauls Gewalt.
    reason: Hebräisches Machtidiom und Bezug des Pronomens werden erläutert.
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: mich … ausliefern
  rationale: Der Hifil von סגר bezeichnet hier die Übergabe einer Person in die Gewalt eines anderen. »Ausliefern« gibt den feindlichen Charakter dieser Übergabe im Deutschen präzise und natürlich wieder.
- source_word: בַעֲלֵי קְעִילָה
  choice: die Männer von Keïla
  rationale: בעלים kann wörtlich »Herren« oder »Besitzer« bedeuten, bezeichnet hier im städtischen Zusammenhang jedoch die maßgeblichen Männer beziehungsweise Bewohner des Ortes. »Die Männer von Keïla« bewahrt die soziale Unbestimmtheit besser als das engere »Bürger« oder »Anführer«.
- source_word: בְיָדוֹ
  choice: in seine Hand
  rationale: Die Wendung wird bewusst bildhaft wiedergegeben; »Hand« steht im Hebräischen für Macht und Verfügungsgewalt. Das Pronomen bezieht sich im Zusammenhang auf Saul.
- source_word: יֵרֵד
  choice: herabkommen
  rationale: ירד bedeutet »hinabgehen/herabkommen«. Aus Davids Perspektive bezeichnet es Sauls erwartete Bewegung nach Keïla. Dieselbe Formulierung steht in Frage und Antwort.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: wie dein Diener gehört hat
  rationale: Die knappe Formulierung bewahrt Davids Berufung auf die Nachricht, die ihn erreicht hat, und entspricht der hebräischen Vergleichskonstruktion.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: In diesem Gebetszusammenhang ist dies eine demütige Selbstbezeichnung vor Gott; »Diener« trifft den Registerwert besser als »Sklave«.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַגֶּד נָא
  choice: sag es bitte
  rationale: Der Imperativ mit נָא ist eine dringliche, zugleich höflich formulierte Bitte um Auskunft. Das ergänzte »es« ist im Deutschen idiomatisch und nimmt die gestellten Fragen auf.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Und Yahweh sagte
  rationale: »Und« bewahrt den hebräischen Erzählfluss; das Präteritum ist die natürliche deutsche Erzählform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Tetragrammaton als persönlichen Gottesnamen. »Yahweh« bewahrt diesen Namenscharakter, ohne ihn durch einen Titel zu ersetzen.
- issue: Göttliche Antwort auf eine Aussage über ein zukünftiges Ereignis
  choice: Er wird herabkommen
  alternative: Er würde herabkommen
  rationale: Die direkte Antwort gibt die hebräische Form schlicht wieder. Sie wird nicht durch eine deutsche Konjunktivform als bloß hypothetisch abgeschwächt; wie sich die angekündigte Lage weiterentwickelt, bleibt dem Erzählzusammenhang überlassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gebetssprache bleibt eindringlich, aber nicht altertümlich. Die Ortsbezeichnung »Keïla« verwendet das Trema, um die getrennte Aussprache der Vokale kenntlich zu machen.
