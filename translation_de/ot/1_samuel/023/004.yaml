base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/004.yaml
  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: de
  text: 'David befragte den HERRN noch einmal. Der HERR antwortete ihm: „Mach dich auf und zieh nach Keïla hinab, denn ich gebe die Philister in deine Hand.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד ... לִשְׁאֹל
  choice: befragte ... noch einmal
  rationale: Die hebräische Fortsetzungsformel bezeichnet hier eine erneute Anfrage; die knappe deutsche Wendung gibt dies natürlich wieder.
- source_word: בַּיהוָה
  choice: den HERRN
  rationale: Das Tetragramm יהוה wird gemäß verbreiteter deutscher Bibeltradition mit HERR in Kapitälchen wiedergegeben.
- source_word: קוּם
  choice: Mach dich auf
  rationale: Im Zusammenhang ist dies eine Aufforderung zum Aufbruch, nicht lediglich zum körperlichen Aufstehen.
- source_word: רֵד קְעִילָה
  choice: zieh nach Keïla hinab
  rationale: רֵד bezeichnet die Bewegung hinab; die Zielangabe steht ohne Präposition. Die Schreibung Keïla macht die getrennte Aussprache der Vokale deutlich.
- source_word: אֲנִי נֹתֵן
  choice: ich gebe
  rationale: Das Partizip drückt die unmittelbar zugesagte, bereits feststehende Handlung aus; das Präsens bewahrt die Bildhaftigkeit.
- source_word: בְּיָדֶךָ
  choice: in deine Hand
  rationale: Die hebräische Siegesformel wird bewusst formal bewahrt und ist im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: HERR folgt der etablierten deutschen Lesetradition, ohne eine unsichere Aussprache des Gottesnamens festzulegen.
- issue: Gewissheit der göttlichen Zusage נֹתֵן
  choice: 'Präsens: „ich gebe“'
  alternative: 'Futur: „ich werde geben“'
  rationale: 'Das Präsens hält die Spannung der hebräischen Aussage fest: Der Sieg wird als Gottes gegenwärtiges, sicheres Handeln zugesagt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählweise. Die direkte Rede bleibt feierlich, aber gut verständlich; traditionelle biblische Wendungen werden dort erhalten, wo sie die hebräische Form präzise spiegeln.
