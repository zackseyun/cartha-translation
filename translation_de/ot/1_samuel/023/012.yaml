  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/יַסְגִּ֜רוּ בַּעֲלֵ֧י קְעִילָ֛ה אֹתִ֥/י וְ/אֶת אֲנָשַׁ֖/י בְּ/יַד שָׁא֑וּל וַ/יֹּ֥אמֶר יְהוָ֖ה יַסְגִּֽירוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: de
  text: 'Da fragte David: „Werden die Einwohner von Keïla mich und meine Männer an Saul ausliefern[a][b]?“ Jahwe antwortete: „Sie werden dich[c] ausliefern.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „preisgeben“ beziehungsweise „übergeben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in die Hand Sauls“; gemeint ist: in Sauls Gewalt.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht hier ein einzelnes „dich“. David wird als Anführer direkt angesprochen; seine Männer können dabei mitgemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: ausliefern
  rationale: Der Hifil von סגר bezeichnet hier die Übergabe eines Menschen in die Gewalt eines anderen. „Ausliefern“ ist im modernen Deutschen natürlich, passt zum feindlichen Zusammenhang und gibt das wiederholte Verb in Frage und Antwort einheitlich wieder.
- source_word: בַּעֲלֵי קְעִילָה
  choice: die Einwohner von Keïla
  rationale: בַּעֲלֵי kann wörtlich „Besitzer“, „Herren“ oder „Männer“ bedeuten, bezeichnet hier im städtischen Zusammenhang aber die Bewohner beziehungsweise maßgeblichen Bürger des Ortes. „Einwohner“ vermeidet die unbegründete Einschränkung auf eine bestimmte Führungsgruppe.
- source_word: אֹתִי וְאֶת אֲנָשַׁי
  choice: mich und meine Männer
  rationale: Die Wendung bedeutet wörtlich „mich und meine Männer“. „Männer“ bewahrt die offene Bezeichnung für Davids Gefolgsleute, ohne sie enger als Soldaten zu bestimmen.
- source_word: בְּיַד שָׁאוּל
  choice: an Saul
  rationale: Die hebräische Wendung lautet bildlich „in die Hand Sauls“ und meint die Übergabe in seine Gewalt. Zusammen mit „ausliefern“ ist „an Saul“ idiomatisches, klares Deutsch; das Hand-Bild wird in einer Fußnote dokumentiert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: יַסְגִּירוּ
  choice: Sie werden dich ausliefern
  rationale: Die Antwort wiederholt dasselbe Verb wie die Frage. Das hebräische Objekt ist Singular und richtet sich unmittelbar an David; diese Form bleibt erhalten, während seine Männer aus dem Zusammenhang mitgemeint sein können.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ wahrt den Charakter als Eigenname, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Form der göttlichen Antwort
  choice: „Sie werden dich ausliefern“ als direkte Zukunftsaussage
  alternative: „Sie würden dich ausliefern“ als ausdrücklich bedingte Aussage
  rationale: Die hebräische Verbform antwortet unmittelbar mit „Sie werden dich ausliefern“ und markiert die Bedingtheit nicht ausdrücklich. Die Übersetzung fügt daher keine grammatisch unbezeichnete Bedingungsform ein und lässt die Spannung zum weiteren Erzählverlauf bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da fragte“ und „antwortete“ geben die Erzählfolge und die Funktion der Redebeiträge natürlicher wieder als ein mehrfaches „sagte“. Die Ortsform „Keïla“ folgt der gebräuchlichen deutschen Schreibung und macht die getrennte Aussprache der Vokale sichtbar.
