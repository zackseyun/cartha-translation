  text: לְכוּ נָ֞א הָכִ֣ינוּ ע֗וֹד וּ/דְע֤וּ וּ/רְאוּ֙ אֶת מְקוֹמ/וֹ֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה רַגְל֔/וֹ מִ֥י רָאָ֖/הוּ שָׁ֑ם כִּ֚י אָמַ֣ר אֵלַ֔/י עָר֥וֹם יַעְרִ֖ם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: de
  text: 'Geht nun und trefft weitere Vorbereitungen. Erkundigt euch genau und stellt fest, an welchem Ort er sich aufhält[a] und wer ihn dort gesehen hat. Denn mir wurde gesagt[b]: »Er geht äußerst listig vor.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »wo sein Fuß sein wird«; gemeint sind sein Aufenthaltsort oder seine Bewegungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Denn er sagte zu mir.« Das Hebräische nennt das Subjekt von »sagte« nicht ausdrücklich.'
    reason: alternative_reading
  - marker: c
    text: 'Im Hebräischen stehen ein Adjektiv und ein stammverwandtes Verb nebeneinander, wörtlich etwa: »Listig handelt er listig.« Das verstärkt die Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: trefft weitere Vorbereitungen
  rationale: הכין im Hifil bedeutet häufig »vorbereiten« oder »bereitmachen«; עוֹד fordert hier zusätzliche, weitergehende Vorbereitungen.
- source_word: וּדְעוּ וּרְאוּ
  choice: Erkundigt euch genau und stellt fest
  rationale: Die beiden Imperative werden nicht zu einem einzigen Verb eingeebnet, sondern als nachdrückliche Aufforderung zu sorgfältiger Erkundung wiedergegeben.
- source_word: מְקוֹמוֹ אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: an welchem Ort er sich aufhält
  rationale: Die Wendung lautet wörtlich etwa »seinen Ort, wo sein Fuß sein wird« und bezeichnet Davids Aufenthaltsort beziehungsweise seine Bewegungen. Die natürliche deutsche Fassung bewahrt den Ortsbezug; die Bildsprache wird in der Fußnote dokumentiert.
- source_word: מִי רָאָהוּ שָׁם
  choice: wer ihn dort gesehen hat
  rationale: Die Formulierung fragt nach einem konkreten Augenzeugen oder Gewährsmann; das deutsche Perfekt gibt den abgeschlossenen Vorgang mit gegenwärtiger Relevanz natürlich wieder.
- source_word: כִּי אָמַר אֵלַי
  choice: Denn mir wurde gesagt
  rationale: Das hebräische Verb steht in der 3. Person Singular, nennt sein Subjekt jedoch nicht. Die unpersönliche Passivform vermeidet eine unbegründete Festlegung.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: Er geht äußerst listig vor
  rationale: Adjektiv und stammverwandtes Verb verstärken einander. »Äußerst listig« gibt diese emphatische Konstruktion idiomatisch wieder und entspricht Sauls negativer Einschätzung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwerfällige hebräische Ortswendung wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich erläutert. Die nicht ausdrücklich bestimmte Person bei אָמַר bleibt durch die unpersönliche Form offen.
