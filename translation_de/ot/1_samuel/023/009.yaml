  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּ֣י עָלָ֔י/ו שָׁא֖וּל מַחֲרִ֣ישׁ הָ/רָעָ֑ה וַ/יֹּ֨אמֶר֙ אֶל אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן הַגִּ֖ישָׁ/ה הָ/אֵפֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: de
  text: 'Als David erfuhr, dass Saul heimlich Unheil gegen ihn plante[a], sagte er zu dem Priester Abjatar: „Bring den Efod her[b]!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass Saul Böses gegen ihn ersann“.'
    reason: lexical_alternative
  - marker: b
    text: Der Efod war ein priesterlicher Gegenstand, der in diesem Erzählzusammenhang dazu diente, Gottes Weisung zu erfragen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: Als David erfuhr
  rationale: Das narrative wayyiqtol von ידע bezeichnet hier, dass David zu diesem Zeitpunkt Kenntnis von Sauls Vorhaben erhielt; „erfuhr“ ist im modernen Deutschen natürlicher als das statische „wusste“.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was David erfuhr.
- source_word: עָלָיו
  choice: gegen ihn
  rationale: Die Präposition על bezeichnet in Verbindung mit dem feindseligen Vorhaben die gegen David gerichtete Absicht.
- source_word: מַחֲרִישׁ
  choice: heimlich … plante
  rationale: Das Hifil-Partizip von חרש beschreibt hier ein fortdauerndes, verborgenes Planen oder Ersinnen. „Heimlich … plante“ gibt sowohl den konspirativen als auch den durativen Sinn wieder.
- source_word: הָרָעָה
  choice: Unheil
  rationale: רָעָה bezeichnet hier das David zugedachte Schädliche. „Unheil“ bewahrt die Breite des hebräischen Ausdrucks besser als eine zu konkrete Wiedergabe und klingt zugleich natürlich.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: zu dem Priester Abjatar
  rationale: Die Formulierung gibt Name und Amt eindeutig und in natürlicher deutscher Wortstellung wieder.
- source_word: הַגִּישָׁה
  choice: Bring … her
  rationale: Der Hifil-Imperativ von נגש fordert dazu auf, den Gegenstand heranzubringen beziehungsweise bereitzustellen.
- source_word: הָאֵפוֹד
  choice: den Efod
  rationale: „Efod“ ist die etablierte deutsche Wiedergabe des spezifischen priesterlichen Gegenstands; eine verallgemeinernde Übersetzung würde diese Besonderheit verlieren.
theological_decisions:
- issue: Art von Sauls Absicht in מַחֲרִישׁ הָרָעָה
  choice: Saul plante heimlich Unheil gegen David
  alternative: Saul ersann Böses gegen David
  rationale: Die Übersetzung bewahrt sowohl die heimliche Planung als auch die gegen David gerichtete Bedrohung. „Unheil“ vermeidet eine vorschnelle moralisch-theologische Verengung von רָעָה, ohne Sauls feindselige Absicht abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Abjatar“ und „Efod“ folgen den im Deutschen gebräuchlichen biblischen Namens- und Sachbezeichnungen; die Satzstruktur bleibt knapp und nah am hebräischen Erzählfluss.
