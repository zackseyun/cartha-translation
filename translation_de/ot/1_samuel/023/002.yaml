  rationale: Die Revision vermeidet die zusätzliche militärische Spezifizierung in »hinziehen« und gibt ויאמר mit dem neutralen »sagte zu David« wieder. Der Fußnotenanker ist unmittelbar an die erläuterte Wendung gesetzt. Bedeutung, Register, Namensform und die verbale Wiederholung bleiben erhalten.
