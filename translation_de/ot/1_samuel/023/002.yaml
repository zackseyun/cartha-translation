  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֵלֵ֣ךְ וְ/הִכֵּ֔יתִי בַּ/פְּלִשְׁתִּ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל דָּוִ֗ד לֵ֚ךְ וְ/הִכִּ֣יתָ בַ/פְּלִשְׁתִּ֔ים וְ/הוֹשַׁעְתָּ֖ אֶת קְעִילָֽהס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: de
  text: 'Da befragte David Jahwe und sagte: »Soll ich gehen und diese Philister schlagen?« Jahwe sagte zu David: »Geh und schlag die Philister und rette Keïla«[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »befreie Keïla«.'
    reason: Lexikalische Alternative für וְהוֹשַׁעְתָּ im militärischen Zusammenhang.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: befragte ... Jahwe
  rationale: שׁאל mit בּ und dem Gottesnamen bezeichnet hier das Einholen göttlicher Weisung; »befragen« gibt dies präziser wieder als ein bloßes »fragen«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als »Jahwe« wiedergegeben, sodass der im Hebräischen ausdrücklich stehende Bundesname erkennbar bleibt.
- source_word: הַאֵלֵךְ
  choice: Soll ich hinziehen
  rationale: Die Fragepartikel mit der Imperfektform drückt Davids abwägende Bitte um Weisung aus; »hinziehen« passt zum militärischen Kontext.
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ
  choice: schlagen / schlag
  rationale: Die wiederholte Form von נכה wird in Frage und Antwort entsprechend wiederholt. »Schlagen« bewahrt die militärische Kraft, ohne den Ausgang schon als vollständige Niederlage auszudeuten.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: diese Philister
  rationale: Das Demonstrativpronomen wird ausdrücklich bewahrt und bezeichnet die konkrete Gruppe der angreifenden Philister.
- source_word: וְהוֹשַׁעְתָּ
  choice: rette
  rationale: Die Hifil-Form von ישׁע bedeutet retten beziehungsweise aus Gefahr befreien; im Zusammenhang ist die militärische Rettung der Stadt gemeint.
- source_word: קְעִילָה
  choice: Keïla
  rationale: Der Ortsname wird in einer im Deutschen verständlichen Transliteration wiedergegeben; das Trema macht die getrennte Aussprache der Vokale sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen ausdrücklich. »Jahwe« erhält diese Namensform, während »der HERR« die traditionelle jüdisch-christliche Lesekonvention widerspiegelt, aber den Namen durch einen Titel ersetzt.
- issue: Bedeutungsumfang von וְהוֹשַׁעְתָּ
  choice: rette
  alternative: befreie
  rationale: »Rette« bewahrt den breiteren Bedeutungsumfang von ישׁע. Der Zusammenhang konkretisiert dies als Befreiung Keïlas aus militärischer Bedrohung, ohne dass hier geistliches Heil ausgesagt werden muss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Wiederholung zwischen Davids Frage und Jahwes Antwort wird bewahrt. »Hinziehen« signalisiert den militärischen Aufbruch, ohne altertümlich zu wirken.
