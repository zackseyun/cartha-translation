  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist weitgehend getroffen: David holt bei Jahwe Weisung ein, fragt nach einem Vorgehen gegen die Philister, und Jahwe gebietet ihm zu gehen, sie zu schlagen und Keïla zu retten. »Hinziehen« ist im militärischen Kontext möglich, fügt gegenüber הלך („gehen“) jedoch eine spezifischere Nuance hinzu. »antwortete David« deutet stärker als der schlichte hebräische Redeeinleiter ויאמר („sagte zu David“) eine Antwort an.'
  naturalness: Der Text ist flüssiges, modernes Standarddeutsch. Die direkte, knappe Befehlsfolge ist idiomatisch. Die Anpassung zu »gehen/Geh« bewahrt zudem die auffällige Entsprechung zwischen Davids Frage und Jahwes Weisung ohne unnötliche Stilisierung.
  terminology: »Jahwe« gibt den ausdrücklich gebrauchten Gottesnamen יהוה angemessen wieder. »schlagen« erhält die Wiederholung von נכה, ohne bereits „besiegen“ zu behaupten. »retten« ist für וְהוֹשַׁעְתָּ zutreffend; die Fußnote bietet mit »befreie« eine sinnvolle kontextuelle Alternative. »Keïla« ist als deutsche Umschrift vertretbar.
  issues:
  - severity: low
    issue: »hinziehen« für הלך
    rationale: Der hebräische Imperativ und die Frageform bedeuten schlicht „gehen“. Der militärische Zusammenhang kann die Bewegung näher prägen, aber »hinziehen« legt diese Nuance zusätzlich fest.
  - severity: low
    issue: »Jahwe antwortete David« für ויאמר יהוה אל דוד
    rationale: Der Text sagt wörtlich, dass Jahwe „zu David sagte“. Zwar folgt die Rede auf Davids Anfrage, doch der Redeeinleiter selbst markiert nicht ausdrücklich ein Antworten.
  - severity: low
    issue: Position des Fußnotenankers
    rationale: Der Anker sollte unmittelbar auf der erläuterten Wiedergabe »rette Keïla« stehen und nicht erst nach dem Satzpunkt innerhalb des Schlusszeichens.
