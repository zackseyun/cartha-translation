  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: de
  text: Da machte sich Jonatan, der Sohn Sauls, auf, ging zu David nach Horescha und stärkte ihm die Hand in Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »stärkte ihm die Hand in Gott«; die Wendung bedeutet: »ermutigte ihn in Gott« oder »gab ihm in Gott neue Kraft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich … auf
  rationale: קום leitet hier eine zielgerichtete Handlung ein. Die deutsche Wendung ist natürlich und bewahrt den erzählerischen Handlungsbeginn.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: Jonatan, der Sohn Sauls
  rationale: Die Apposition wird direkt wiedergegeben; sie hält zugleich die familiäre und politische Spannung sichtbar.
- source_word: וַיֵּלֶךְ אֶל
  choice: ging zu
  rationale: הלך אל bezeichnet eine gerichtete Bewegung zu einer Person und impliziert im Zusammenhang das Erreichen des Ziels.
- source_word: חֹרְשָׁה
  choice: nach Horescha
  rationale: Die Form wird im Zusammenhang als Ortsname verstanden; die Endung spiegelt zudem die Zielrichtung wider.
- source_word: וַיְחַזֵּק אֶת יָדוֹ
  choice: stärkte er sein Vertrauen
  rationale: Wörtlich heißt es »stärkte seine Hand«. Im Deutschen gibt »sein Vertrauen stärken« die idiomatische Bedeutung verständlich wieder, ohne die Bildsprache zu verschweigen; diese wird in der Fußnote dokumentiert.
- source_word: בֵּאלֹהִים
  choice: auf Gott
  rationale: Bei »Vertrauen« verlangt natürliches Deutsch die Verbindung »auf Gott«. Sie gibt Gott als Grund und Bezugspunkt der Stärkung wieder, ohne ihn ausdrücklich zum handelnden Mittel zu erklären.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים ohne Artikel
  choice: Gott
  alternative: der HERR
  rationale: Im hebräischen Text steht אֱלֹהִים und nicht der Gottesname JHWH. Daher wird keine andere Gottesbezeichnung in den Text eingetragen.
- issue: Bezug von בֵּאלֹהִים innerhalb der Wendung
  choice: sein Vertrauen auf Gott stärken
  alternative: seine Hand in Gott stärken
  rationale: Die idiomatische Hauptübersetzung macht Gott als Grund und Bezugspunkt der Ermutigung deutlich. Die ungewöhnliche, mehrdeutige Bildsprache des Hebräischen bleibt durch die wörtliche Angabe in der Fußnote zugänglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche hebräische Redewendung wird im Haupttext idiomatisch übersetzt und in der Fußnote wörtlich bewahrt.
