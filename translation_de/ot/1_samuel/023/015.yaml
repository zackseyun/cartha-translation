  text: וַ/יַּ֣רְא דָוִ֔ד כִּֽי יָצָ֥א שָׁא֖וּל לְ/בַקֵּ֣שׁ אֶת נַפְשׁ֑/וֹ וְ/דָוִ֥ד בְּ/מִדְבַּר זִ֖יף בַּ/חֹֽרְשָׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: de
  text: David sah, dass Saul ausgezogen war, um ihm nach dem Leben zu trachten, und David hielt sich in der Wildnis von Sif in Horesch[a] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Wald“ beziehungsweise „im bewaldeten Gebiet“. Das hebräische Wort kann als gewöhnliches Substantiv verstanden werden; hier ist jedoch wahrscheinlich der Ortsname Horesch gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Das Grundverb ראה bedeutet „sehen“, kann hier aber auch das Wahrnehmen oder Erkennen einer Lage einschließen. „sah“ bewahrt die konkrete hebräische Ausdrucksweise und ist im Deutschen verständlich.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was David wahrnahm.
- source_word: יָצָא
  choice: ausgezogen war
  rationale: יצא bezeichnet das Hinausgehen oder Aufbrechen. Das Plusquamperfekt ordnet Sauls Aufbruch natürlich vor Davids Wahrnehmung ein; „ausziehen“ vermittelt zudem den gezielten Aufbruch zur Verfolgung.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: um ihm nach dem Leben zu trachten
  rationale: Die hebräische Wendung bedeutet, das Leben eines Menschen zu suchen, gewöhnlich in feindlicher, tödlicher Absicht. Die deutsche Redewendung gibt diesen Sinn natürlich wieder, ohne ihn schlicht zu „um ihn zu töten“ aufzulösen.
- source_word: בְּמִדְבַּר זִיף
  choice: in der Wildnis von Sif
  rationale: מִדְבָּר bezeichnet eine unbewohnte, karge Wildnis oder Steppe und nicht zwingend eine Sandwüste. „Wildnis“ wahrt diese Bedeutungsbreite.
- source_word: בַּחֹרְשָׁה
  choice: bei Horesch
  rationale: חֹרְשָׁה kann ein Wald- oder Gehölzgebiet bezeichnen, wird hier im Zusammenhang jedoch wahrscheinlich als Ortsname gebraucht. „bei Horesch“ kennzeichnet die nähere Lage innerhalb der Wildnis von Sif.
- source_word: וְדָוִד
  choice: während er sich … aufhielt
  rationale: Die mit וְ angeschlossene Wortgruppe beschreibt begleitend Davids Aufenthaltsort. Ein deutscher während-Satz gibt diese umstandsbezogene Funktion flüssig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache der tödlichen Verfolgung wird mit der geläufigen Wendung „jemandem nach dem Leben trachten“ wiedergegeben. Der Ortsname wird im Text beibehalten, die echte lexikalische Alternative aber in der Fußnote ausgewiesen.
