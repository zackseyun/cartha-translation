source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: de
  text: Als Abjatar, der Sohn Ahimelechs, zu David nach Keïla floh, kam er mit einem Efod in seiner Hand hinab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Efod kam in seiner Hand herab.“ Im Hebräischen kann „kam hinab“ sich auf Abjatar oder auf das Efod beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּבְרֹחַ
  choice: Als … floh
  rationale: Die Konstruktion aus וַיְהִי und בְּ mit Infinitivus constructus führt einen zeitlichen Begleitumstand in der Erzählung ein. „Als … floh“ gibt dies in natürlichem modernem Deutsch wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: Abjatar, der Sohn Ahimelechs
  rationale: Die Namen folgen der im Deutschen gebräuchlichen biblischen Schreibweise; die Apposition gibt die hebräische Abstammungsangabe klar wieder.
- source_word: אֶל דָּוִד קְעִילָה
  choice: zu David nach Keïla
  rationale: אֶל bezeichnet die Bewegung zu David; das nachgestellte קְעִילָה nennt im Zusammenhang das Ziel beziehungsweise Davids Aufenthaltsort. „Zu David nach Keïla“ verbindet beides knapp und idiomatisch.
- source_word: אֵפוֹד
  choice: ein Efod
  rationale: Der kultische Fachbegriff wird übernommen, weil weder „Priestergewand“ noch eine andere erklärende Wiedergabe die Bedeutung hier ohne zusätzliche Festlegung vollständig trifft.
- source_word: יָרַד
  choice: kam … hinab
  rationale: Das Verb bezeichnet eine abwärts gerichtete Bewegung. Die Wiedergabe bewahrt diese Richtungsangabe, auch wenn der Text den geografischen Bezug nicht näher erläutert.
- source_word: בְּיָדוֹ
  choice: mit … in der Hand
  rationale: Die konkrete hebräische Wendung „in seiner Hand“ wird bewahrt und im Deutschen idiomatisch mit dem mitgeführten Efod verbunden.
theological_decisions:
- issue: Art und Funktion des אֵפוֹד
  choice: Der Begriff wird als „Efod“ beibehalten, ohne den Gegenstand näher zu bestimmen.
  alternative: Priestergewand; heiliges Gewand
  rationale: Der weitere Erzählzusammenhang verleiht dem Efod priesterliche Bedeutung, doch dieser Vers selbst definiert weder seine genaue Form noch seine Funktion. Eine erklärende Übersetzung würde den Text unnötig festlegen.
- issue: Grammatisches Subjekt von יָרַד
  choice: 'Im Haupttext ist Abjatar das Subjekt: „kam er … hinab“.'
  alternative: 'Der Efod ist das Subjekt: „kam ein Efod in seiner Hand herab“.'
  rationale: Das maskuline Singularverb kann sich grammatisch auf Abjatar oder auf den ebenfalls maskulinen Efod beziehen. Der Erzählzusammenhang und eine natürliche deutsche Satzführung sprechen für Abjatar als Subjekt; die echte syntaktische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Efod“ bleibt als historisch-religiöser Fachbegriff stehen. Die Formulierung ist gut verständlich, wahrt aber durch die Fußnote die syntaktische Mehrdeutigkeit des hebräischen Schlusses.
