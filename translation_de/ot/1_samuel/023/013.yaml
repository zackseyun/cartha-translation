base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: de
  text: Da machten sich David und seine Männer auf, etwa sechshundert Mann. Sie verließen Keïla und zogen umher, wohin sie ziehen konnten.[a] Saul erhielt die Nachricht, dass David aus Keïla entkommen war; daraufhin rückte er nicht mehr aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und zogen von Ort zu Ort, wohin sie jeweils ziehen konnten“. Die hebräische Wendung betont die fortgesetzte Bewegung von einem Ort zum anderen.'
    reason: lexical_alternative
  - marker: b
    text: Dass Saul „nicht mehr ausrückte“, bedeutet wahrscheinlich, dass er nach der Nachricht von Davids Flucht die Verfolgung Davids einstellte.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: Da machte sich David mit seinen Männern auf
  rationale: קום bezeichnet zunächst das Aufstehen bzw. Sich-Erheben und leitet hier das Handeln ein. „Machte sich … auf“ ist im Deutschen natürlich, wahrt den erzählerischen Übergang und nimmt das anschließende Verlassen Keïlas nicht unnötig vorweg.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: etwa sechshundert Mann
  rationale: Die Präposition כְּ kennzeichnet bei der Zahl eine ungefähre Angabe. „Mann“ ist in diesem militärischen Zusammenhang die passende deutsche Zählform.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: Sie verließen Keïla
  rationale: יצא bedeutet wörtlich „hinausgehen“. Mit einem Ortsnamen als Ausgangspunkt gibt „verließen“ die räumliche Bewegung knapp und idiomatisch wieder.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: und zogen umher, wohin sie ziehen konnten
  rationale: Die Hitpael-Form und die Verbwiederholung beschreiben fortgesetzte Bewegung von Ort zu Ort. Die Wiedergabe bewahrt das Umherziehen, ohne eine im Text nicht ausdrücklich ausgesagte Ziellosigkeit zu unterstellen.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: Als Saul gemeldet wurde
  rationale: Die unpersönliche Passivkonstruktion des Hebräischen wird mit einer natürlichen deutschen Passivform wiedergegeben; zugleich stellt „als“ den zeitlichen und folgerichtigen Zusammenhang her.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: dass David aus Keïla entkommen war
  rationale: נמלט bezeichnet das Entkommen oder Sichretten. Das deutsche Plusquamperfekt macht deutlich, dass Davids Flucht der Meldung vorausging.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: rückte er nicht mehr aus
  rationale: חדל mit Infinitiv bedeutet, eine Handlung einzustellen. „Ausrücken“ erhält das Bild des Hinausziehens und passt zum militärischen Kontext, ohne das nicht ausdrücklich genannte Ziel des Unternehmens in den Haupttext einzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. „Keïla“ kennzeichnet durch das Trema, dass e und i getrennt gesprochen werden. Die militärische Färbung von „Mann“ und „ausrücken“ entspricht dem Zusammenhang, während die genaue Art von Sauls Vorhaben in der Fußnote erläutert wird.
