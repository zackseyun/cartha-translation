revisions:
- from: Da machte sich David mit seinen Männern auf, etwa sechshundert Mann. Sie verließen Keïla und zogen umher, wohin sie ziehen konnten.[a] Als Saul gemeldet wurde, dass David aus Keïla entkommen war, rückte er nicht mehr aus.[b]
