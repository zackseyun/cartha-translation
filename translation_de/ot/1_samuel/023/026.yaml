  naturalness: Der Text ist insgesamt idiomatisches, würdiges modernes Standarddeutsch. Die Revision glättet die leicht missverständliche Perfektivität von „einkreisten“ und wahrt zugleich die knappe Erzählweise.
  terminology: Eigennamen und die militärisch-rechtliche Zweckangabe „um sie zu ergreifen“ sind angemessen. „Fortzugehen“ bleibt bei der Grundbedeutung von ללכת, ohne einen Erfolg des Entkommens vorauszusetzen.
