  text: וַ/יֵּ֨לֶךְ שָׁא֜וּל מִ/צַּ֤ד הָ/הָר֙ מִ/זֶּ֔ה וְ/דָוִ֧ד וַ/אֲנָשָׁ֛י/ו מִ/צַּ֥ד הָ/הָ֖ר מִ/זֶּ֑ה וַ/יְהִ֨י דָוִ֜ד נֶחְפָּ֤ז לָ/לֶ֨כֶת֙ מִ/פְּנֵ֣י שָׁא֔וּל וְ/שָׁא֣וּל וַ/אֲנָשָׁ֗י/ו עֹֽטְרִ֛ים אֶל דָּוִ֥ד וְ/אֶל אֲנָשָׁ֖י/ו לְ/תָפְשָֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: de
  text: Saul zog auf der einen Seite des Berges entlang[a], David aber und seine Männer auf der anderen Seite. David beeilte sich, von Saul fortzugehen, während Saul und seine Männer dabei waren, David und seine Männer einzukreisen[b], um sie zu ergreifen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung lautet in beiden Satzteilen wörtlich etwa: „von der Seite des Berges, von dieser Seite“. Die Übersetzung gibt den beabsichtigten Gegensatz mit „auf der einen … auf der anderen Seite“ wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sich David und seinen Männern immer weiter näherten“ oder „David und seine Männer umringten“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „gefangen zu nehmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: zog … entlang
  rationale: Das Wayyiqtol führt die Erzählung weiter; zusammen mit der Ortsangabe beschreibt es Sauls Bewegung an der Bergseite. „zog … entlang“ ist im Deutschen natürlich und passt zur gleichzeitigen Bewegung beider Gruppen.
- source_word: מִצַּד הָהָר מִזֶּה
  choice: auf der einen Seite des Berges
  rationale: Wörtlich steht eine deiktische Wendung wie „von dieser Seite“. Der parallele Satzteil stellt jedoch zwei verschiedene Bergseiten gegenüber; „auf der einen Seite“ gibt diesen räumlichen Kontrast idiomatisch wieder.
- source_word: וְדָוִד וַאֲנָשָׁיו מִצַּד הָהָר מִזֶּה
  choice: David aber und seine Männer auf der anderen Seite
  rationale: Obwohl der hebräische Text erneut „von dieser Seite“ gebraucht, verlangt der dargestellte Gegensatz im Deutschen „auf der anderen Seite“. Das im zweiten Satzteil ausgelassene Bewegungsverb kann natürlich aus dem ersten ergänzt werden.
- source_word: נֶחְפָּז
  choice: beeilte sich
  rationale: Das Nifal-Partizip bezeichnet dringende Eile. „beeilte sich“ bewahrt die Dringlichkeit, ohne zusätzlich Angst oder Panik einzutragen.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: Saul zu entkommen
  rationale: Die Wendung bedeutet wörtlich etwa „von Sauls Angesicht wegzugehen“. Im Verfolgungskontext drückt „entkommen“ das beabsichtigte Sich-Entfernen natürlich aus, ohne bereits einen erfolgreichen Ausgang zu behaupten.
- source_word: עֹטְרִים אֶל
  choice: einkreisten
  rationale: Das Partizip von עטר bezeichnet hier ein Umringen beziehungsweise Einkreisen mit dem Ziel der Gefangennahme. Die Formulierung bleibt nah am Bild des hebräischen Verbs; „rückten … immer näher“ wäre eine stärker kontextuelle Alternative.
- source_word: לְתָפְשָׂם
  choice: um sie zu ergreifen
  rationale: Der Infinitiv mit Suffix bezeichnet den Zweck. „ergreifen“ gibt תפשׂ eng wieder; im militärischen Kontext ist auch „gefangen zu nehmen“ möglich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise und die gleichzeitigen Bewegungen bleiben erhalten. Das wiederholte deiktische מִזֶּה wird wegen des klaren räumlichen Gegensatzes idiomatisch als „die eine … die andere Seite“ wiedergegeben.
