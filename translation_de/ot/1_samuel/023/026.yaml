- from: Saul zog auf der einen Seite des Berges entlang[a], David aber und seine Männer auf der anderen Seite. David beeilte sich, Saul zu entkommen, während Saul und seine Männer David und seine Männer einkreisten[b], um sie zu ergreifen[c].
  to: Saul zog auf der einen Seite des Berges entlang[a], David aber und seine Männer auf der anderen Seite. David beeilte sich, von Saul fortzugehen, während Saul und seine Männer dabei waren, David und seine Männer einzukreisen[b], um sie zu ergreifen[c].
  rationale: Die Übersetzung wahrt die räumliche Gegenüberstellung und den dynamischen Charakter der Verfolgung. „Von Saul fortzugehen“ gibt die Grundbewegung von ללכת מִפְּנֵי wieder, ohne den Erfolg eines Entkommens einzutragen. „Dabei waren, … einzukreisen“ bildet das fortlaufende hebräische Partizip präziser ab. Die Fußnoten bleiben an den einschlägigen Wörtern verankert und erläutern die idiomatischen Entscheidungen.
