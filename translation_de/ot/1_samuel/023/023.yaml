    issue: Unzutreffender und unnatürlicher Relativsatz bei den Verstecken
    rationale: „wo all die Verstecke sind, in denen er sich dort verbirgt“ macht aus den Verstecken zunächst einen Gegenstand der Lokalisierung und erzeugt mit „dort“ eine ungrammatisch wirkende Doppelung. Der hebräische Relativsatz beschreibt die Verstecke als diejenigen, in denen er sich verbirgt.
  - severity: low
    issue: „mit einer sicheren Auskunft“ ist wenig idiomatisch
    rationale: אֶל־נָכוֹן verlangt bestätigte bzw. verlässliche Kenntnis. „Mit verlässlichen Informationen“ formuliert dies im modernen Deutsch natürlicher, ohne den Sinn einzuengen.
