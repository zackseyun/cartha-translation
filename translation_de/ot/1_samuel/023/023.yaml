- from: Seht genau hin und stellt fest, wo all die Verstecke sind, in denen er sich dort verbirgt. Dann kommt mit einer sicheren Auskunft zu mir zurück, und ich werde mit euch gehen. Wenn er im Land ist, werde ich ihn unter allen Sippen Judas[a] aufspüren.
  to: Seht euch genau um und erkundet alle Verstecke, in denen er sich verbirgt. Dann kommt mit verlässlichen Informationen zu mir zurück, und ich werde mit euch gehen. Wenn er im Land ist, werde ich ihn unter allen Sippen Judas[a] aufspüren.
  rationale: Die Revision stellt den Bezug des Relativsatzes zu den Verstecken wieder her und ersetzt die im Deutschen störende, aber im Hebräischen mögliche Wiederaufnahme durch eine natürliche Formulierung. Sie wahrt die investigative Abfolge, die Forderung nach gesicherter Nachricht und die vorsichtige, fußnotengestützte Wiedergabe von אַלְפֵי.
