base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: de
  text: Seht euch genau um und erkundet alle Verstecke, in denen er sich verbirgt. Dann kommt mit verlässlichen Informationen zu mir zurück, und ich werde mit euch gehen. Wenn er im Land ist, werde ich ihn unter allen Sippen Judas[a] aufspüren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter allen Tausendschaften Judas“; gemeint sind wahrscheinlich Sippen oder andere Verbände Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: Seht genau hin und stellt fest
  rationale: Die beiden pluralischen Imperative fordern zum Beobachten und zuverlässigen Ermitteln auf. Die Formulierung gibt den investigativen Zusammenhang natürlich wieder.
- source_word: מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: wo all die Verstecke sind, in denen er sich dort verbirgt
  rationale: מַחֲבֹא bezeichnet ein Versteck. Die Konstruktion mit מִן ist hier im Deutschen am natürlichsten als Ermittlung der Orte wiedergegeben; „dort“ bewahrt die räumliche Wiederaufnahme שָׁם, ohne sie stillschweigend zu beseitigen.
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: Dann kommt mit einer sicheren Auskunft zu mir zurück
  rationale: Die Satzfolge hat auffordernden Charakter. אֶל נָכוֹן verlangt verlässliche, bestätigte Kenntnis; „mit einer sicheren Auskunft“ ist im Deutschen verständlicher als ein abstraktes „mit Gewissheit“.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: und ich werde mit euch gehen
  rationale: Direkte Wiedergabe der zugesagten gemeinsamen Bewegung.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: Wenn er im Land ist
  rationale: וְהָיָה leitet hier idiomatisch die Bedingung ein; eine wörtliche Wiedergabe als „und es wird geschehen“ wäre im modernen Deutsch unnötig schwerfällig.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: werde ich ihn … aufspüren
  rationale: חפשׂ bezeichnet ein sorgfältiges Suchen. „Aufspüren“ wahrt die zielgerichtete Intensität des Verbs.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: unter allen Sippen Judas
  rationale: אַלְפֵי bedeutet wörtlich „Tausendschaften“, kann aber soziale oder militärische Untereinheiten bezeichnen. „Sippen“ vermittelt hier den wahrscheinlich gemeinten Verband; die wörtliche Form bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Befehlsfolge bleibt klar, die räumliche Wiederaufnahme „dort“ wird trotz leichter Redundanz bewahrt, und die historische Bedeutung von אַלְפֵי wird im Text verständlich sowie in der Fußnote transparent wiedergegeben.
