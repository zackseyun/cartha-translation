review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Befehlsfolge, die Bedingung und die Suche durch die judäischen Untereinheiten im Wesentlichen zutreffend wieder. Die Formulierung „wo all die Verstecke sind“ verschiebt jedoch den Bezug: Gemeint sind die Verstecke, in denen David sich verbirgt, nicht bloß die Feststellung, wo Verstecke liegen. Das wörtlich nachgebildete „dort“ ist im Deutschen an dieser Stelle zudem syntaktisch und stilistisch missglückt.'
  naturalness: Modernes Standarddeutsch wird mit einer klaren, knappen Aufforderungsfolge erreicht. „Seht euch genau um und erkundet alle Verstecke“ gibt beide Imperative verständlich wieder. „Mit verlässlichen Informationen“ ist idiomatischer als „mit einer sicheren Auskunft“.
  terminology: „Sippen Judas“ ist als kontextuelle Wiedergabe von אַלְפֵי יְהוּדָה vertretbar, sofern die Fußnote die wörtliche Lesart und die Unsicherheit der genauen institutionellen Bedeutung offenlegt. „Aufspüren“ passt zu חִפֵּשׂ in diesem Verfolgungskontext.
  issues:
