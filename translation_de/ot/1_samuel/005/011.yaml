  verdict: revise
  source_fidelity: Der Singular in der direkten Rede („mich und mein Volk“) gibt den hebräischen Text korrekt wieder. Auch die Bildsprache von Gottes schwer lastender Hand sowie die tödliche Unruhe in der ganzen Stadt sind sachgerecht erhalten. „Boten“ ist im Hebräischen jedoch nicht ausdrücklich genannt; die Formulierung sollte die Entsendung nicht unnötig konkretisieren.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Sie schickten Boten aus und versammelten alle Fürsten“ wirkt jedoch leicht redundant und fügt ein nicht ausgedrücktes Substantiv ein. „Sie schickten zu allen Fürsten … und versammelten sie“ ist idiomatischer und wahrt den Sinn.
  terminology: „Fürsten der Philister“, „Lade des Gottes Israels“ und „die Hand Gottes“ sind angemessen. „Tödliche Panik“ ist als verständliche Wiedergabe von מְהוּמַת מָוֶת vertretbar. Die Fußnote zum Numeruswechsel soll keine nicht belegbare Erklärung bevorzugen, sondern die Ursache offenlassen.
