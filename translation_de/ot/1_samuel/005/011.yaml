  text: וַ/יִּשְׁלְח֨וּ וַ/יַּאַסְפ֜וּ אֶת כָּל סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּֽאמְרוּ֙ שַׁלְּח֞וּ אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ וְ/יָשֹׁ֣ב לִ/מְקֹמ֔/וֹ וְ/לֹֽא יָמִ֥ית אֹתִ֖/י וְ/אֶת עַמִּ֑/י כִּֽי הָיְתָ֤ה מְהֽוּמַת מָ֨וֶת֙ בְּ/כָל הָ/עִ֔יר כָּבְדָ֥ה מְאֹ֛ד יַ֥ד הָ/אֱלֹהִ֖ים שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: de
  text: 'Da schickten sie zu allen Fürsten der Philister und versammelten sie. Sie sagten: »Schickt die Lade des Gottes Israels fort! Sie soll an ihren Ort zurückkehren, damit sie mich und mein Volk nicht tötet.«[a] Denn in der ganzen Stadt herrschte eine tödliche Panik;[b] die Hand Gottes lastete dort sehr schwer.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht hier trotz der Mehrzahl in »sie sagten«: »mich und mein Volk«. Der Grund für diesen Wechsel zum Singular wird nicht genannt.'
    reason: textual_feature
  - marker: b
    text: 'Oder: »ein Todesschrecken«, »eine tödliche Verwirrung« oder »ein todbringender Aufruhr«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Die Hand Gottes war dort sehr schwer« – ein Bild für Gottes machtvolles Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: Fürsten
  rationale: Der Ausdruck bezeichnet die anerkannten Herrscher der Philister. »Fürsten« gibt ihren politischen Rang in verständlichem, würdigem Deutsch wieder.
- source_word: שַׁלְּחוּ
  choice: Schickt … fort
  rationale: Der Imperativ fordert dazu auf, die Lade aus der Stadt zu entfernen; »fortschicken« bringt diesen Sinn natürlich zum Ausdruck.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: die Lade des Gottes Israels
  rationale: Die Genitivverbindung bleibt erhalten und bezeichnet die Lade als dem Gott Israels zugehörig.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: Sie soll an ihren Ort zurückkehren
  rationale: Die deutsche Soll-Form gibt den auffordernden Sinn nach dem Imperativ wieder. Das grammatische Femininum bezieht sich eindeutig auf die Lade.
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: damit sie mich und mein Volk nicht tötet
  rationale: Der Hifil von מות bedeutet »töten«. Die singulären Pronomen des hebräischen Textes werden trotz des vorausgehenden pluralischen Redeeinleiters bewahrt.
- source_word: מְהוּמַת מָוֶת
  choice: eine tödliche Panik
  rationale: Die Wendung bezeichnet einen lebensgefährlichen, todbringenden Schrecken oder Aufruhr. »Tödliche Panik« wahrt die Stärke und bleibt idiomatisch.
- source_word: בְּכָל הָעִיר
  choice: in der ganzen Stadt
  rationale: Diese Formulierung gibt die umfassende räumliche Aussage klar und natürlich wieder.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: die Hand Gottes lastete dort sehr schwer
  rationale: Die biblische Metapher der göttlichen Hand bleibt erhalten; »lastete … sehr schwer« vermittelt zugleich die Intensität des Gerichts in natürlichem Deutsch.
theological_decisions:
- issue: Ob die Metapher »Hand Gottes« beibehalten oder als göttliche Macht beziehungsweise Gericht gedeutet werden soll
  choice: 'Die Metapher wird bewahrt: »die Hand Gottes lastete dort sehr schwer«'
  alternative: Gott suchte die Stadt dort schwer heim
  rationale: Der hebräische Text nennt ausdrücklich Gottes Hand. Ihre Bewahrung erhält die biblische Bildsprache und deren Bezüge, ohne die Bedeutung konfessionell einzuengen.
- issue: Numeruswechsel zwischen den mehreren Sprechern und »mich und mein Volk«
  choice: Der Singular des hebräischen Textes wird beibehalten
  alternative: damit sie uns und unser Volk nicht tötet
  rationale: Die Singularformen können die Stimme eines repräsentativen Sprechers, wahrscheinlich des örtlichen Herrschers, wiedergeben. Eine Angleichung an den Plural würde eine echte Auffälligkeit des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Satzführung. Die markante biblische Metapher »Hand Gottes« und der auffällige Wechsel zum Singular in der direkten Rede bleiben erhalten; erklärende Fußnoten machen beide Stellen zugänglich.
