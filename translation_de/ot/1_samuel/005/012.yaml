source:
  edition: WLC
  text: וְ/הָֽ/אֲנָשִׁים֙ אֲשֶׁ֣ר לֹא מֵ֔תוּ הֻכּ֖וּ ב/עפלים וַ/תַּ֛עַל שַֽׁוְעַ֥ת הָ/עִ֖יר הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/012.yaml
  text: And the men who did not die were struck with tumors[a], and the cry of the city went up to heaven.
translation:
  language: de
  text: Und die Männer, die nicht starben, wurden mit Geschwülsten[a] geschlagen, und das Hilfegeschrei der Stadt stieg zum Himmel empor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schwellungen“. Das hebräische Wort bezeichnet eine körperliche Schwellung oder Geschwulst. Traditionell wird es manchmal genauer mit „Hämorrhoiden“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Und die Männer
  rationale: אֲנָשִׁים bezeichnet hier am natürlichsten die Männer; eine Ausweitung auf „Menschen“ oder „Bewohner“ wäre möglich, aber weniger formal genau.
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: die nicht starben
  rationale: Die schlichte Vergangenheitsform bewahrt den unmittelbaren Gegensatz zu denen, die starben.
- source_word: הֻכּוּ
  choice: wurden … geschlagen
  rationale: Der Hophal von נכה ist passiv. „Geschlagen“ erhält die anschauliche biblische Redeweise, ohne ein handelndes Subjekt hinzuzufügen.
- source_word: בָעֳפָלִים
  choice: mit Geschwülsten
  rationale: Der Ausdruck bezeichnet krankhafte körperliche Schwellungen oder Tumoren. „Geschwülste“ ist verständlich und legt die genaue Erkrankung nicht vorschnell fest.
- source_word: וַתַּעַל
  choice: stieg … empor
  rationale: עלה beschreibt hier das Hinaufsteigen des Hilfeschreis und bewahrt das räumliche Bild des Hebräischen.
- source_word: שַׁוְעַת
  choice: das Hilfegeschrei
  rationale: שַׁוְעָה ist nicht nur ein beliebiger Schrei, sondern ein Not- oder Hilferuf. „Hilfegeschrei“ gibt diesen Sinn knapp und natürlich wieder.
- source_word: הָעִיר
  choice: der Stadt
  rationale: Die direkte Genitivverbindung entspricht dem hebräischen Konstruktus und bezeichnet den gemeinschaftlichen Aufschrei der Stadt.
- source_word: הַשָּׁמָיִם
  choice: zum Himmel
  rationale: Das formal plurale שָׁמַיִם wird in dieser festen räumlichen Wendung im Deutschen idiomatisch mit „Himmel“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur und das Bild des zum Himmel aufsteigenden Hilfegeschreis bleiben nahe am Hebräischen; eine medizinische Überpräzisierung wird vermieden.
