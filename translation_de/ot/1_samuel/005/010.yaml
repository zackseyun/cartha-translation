  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: de
  text: 'Da schickten sie die Lade Gottes nach Ekron. Doch als die Lade Gottes nach Ekron kam, schrien die Ekroniter auf: »Sie haben die Lade des Gottes Israels zu mir herübergebracht, um mich und mein Volk zu töten!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Da schickten sie
  rationale: Gibt die fortlaufende Erzählung natürlich wieder; das Subjekt bleibt wie im Hebräischen aus dem Kontext erschließbar.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Die etablierte und sachlich genaue deutsche Bezeichnung für die heilige Truhe; der bestimmte Gottesbezug bleibt erhalten.
- source_word: וַיִּזְעֲקוּ
  choice: schrien ... auf
  rationale: Vermittelt den lauten, alarmierten Aufschrei der Einwohner stärker als ein neutrales »riefen«.
- source_word: הֵסַבּוּ אֵלַי
  choice: Sie haben ... zu mir herübergebracht
  rationale: Bewahrt die Richtungsaussage und den auffälligen Wechsel zum Singular der überlieferten hebräischen Lesart.
- source_word: לַהֲמִיתֵנִי
  choice: um mich ... zu töten
  rationale: Gibt Infinitiv mit Zweckbedeutung sowie das singularische Objekt wörtlich und verständlich wieder.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Bewahrt die erste Person Singular des masoretischen Textes trotz des vorangehenden pluralischen Sprechers.
theological_decisions:
- issue: Bezeichnung der Lade
  choice: Lade Gottes / Lade des Gottes Israels
  alternative: Bundeslade
  rationale: Der Vers sagt nicht ausdrücklich »Bundeslade«; die kürzere Quellformulierung vermeidet eine erklärende Ergänzung.
- issue: Numeruswechsel in der Rede der Ekroniter
  choice: zu mir ... mich und mein Volk
  alternative: zu uns ... uns und unser Volk
  rationale: Die singularischen Suffixe אֵלַי, הֲמִיתֵנִי und עַמִּי werden gemäß WLC erhalten. Der überraschende Wechsel vom pluralischen Sprecherkollektiv zu einer kollektiv oder repräsentativ gebrauchten ersten Person Singular wird nicht geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Erzählführung. Der markante Numeruswechsel des Hebräischen bleibt bewusst sichtbar; keine konfessionell geprägte Terminologie wurde ergänzt.
