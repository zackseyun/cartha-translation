  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: de
  text: Nachdem sie die Lade weitergebracht hatten, kam die Hand Jahwes über die Stadt und löste eine überaus große Panik aus. Er schlug die Männer der Stadt, vom Kleinsten bis zum Größten, und an ihnen brachen Geschwülste aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: sie sie weitergebracht hatten
  rationale: Das erste Pronomen bezeichnet die Handelnden, das zweite die Bundeslade. Der Hifil von סבב beschreibt hier ihre Verlegung an einen anderen Ort; „weitergebracht“ ist im Zusammenhang natürlich, ohne eine genaue Richtung hinzuzufügen.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Die konkrete hebräische Metapher für Gottes wirksame Macht beziehungsweise sein Gericht bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: eine überaus große Panik
  rationale: מְהוּמָה kann Verwirrung, Aufruhr oder panischen Schrecken bezeichnen. „Panik“ passt zum Gerichtsgeschehen; „überaus groß“ bildet die starke Intensivierung ab.
- source_word: וַיַּךְ
  choice: Er schlug
  rationale: Das maskuline Singularverb nimmt Jahwe als handelndes Subjekt wieder auf. „schlug“ bewahrt die konkrete und gerichtliche Kraft des Ausdrucks.
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: אַנְשֵׁי bezeichnet ausdrücklich die Männer; deshalb wird die geschlechtsspezifische Form nicht zu „Bewohner“ verallgemeinert.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: vom Geringsten bis zum Größten
  rationale: Die idiomatische Wendung bezeichnet die gesamte soziale oder rangmäßige Spannweite, ohne festzulegen, ob Alter, Stellung oder Bedeutung gemeint ist.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: an ihnen brachen Geschwülste aus
  rationale: Die seltene Verbindung beschreibt das Hervortreten körperlicher Schwellungen. „Geschwülste“ bleibt medizinisch hinreichend offen und vermeidet die unsichere Spezifizierung als Hämorrhoiden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als Gottes Eigennamen. „Jahwe“ erhält diesen Charakter, statt den Namen durch einen Titel zu ersetzen.
- issue: Subjekt von וַיַּךְ
  choice: 'Jahwe bleibt das Subjekt: „Er schlug“'
  alternative: 'unpersönlich: „die Männer wurden geschlagen“'
  rationale: Das Verb steht im maskulinen Singular und führt die zuvor genannte Hand Jahwes beziehungsweise Jahwe selbst als handelndes Subjekt fort.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Ablauf des Hebräischen, wurde jedoch für natürliche deutsche Lesbarkeit gegliedert. Die Lade wird im Deutschen mit dem femininen Pronomen „sie“ aufgenommen. Die medizinische Art der Geschwülste bleibt bewusst unbestimmt.
