  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּקֶר֮ מִֽ/מָּחֳרָת֒ וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וְ/רֹ֨אשׁ דָּג֜וֹן וּ/שְׁתֵּ֣י כַּפּ֣וֹת יָדָ֗י/ו כְּרֻתוֹת֙ אֶל הַ/מִּפְתָּ֔ן רַ֥ק דָּג֖וֹן נִשְׁאַ֥ר עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: de
  text: Als sie am nächsten Morgen früh aufstanden, lag Dagon da mit dem Gesicht zur Erde vor der Lade Jahwes. Dagons Kopf und seine beiden Handflächen waren abgehauen und lagen auf der Schwelle; nur Dagon selbst war noch übrig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Nur Dagon blieb an/auf ihm übrig.« Die hebräische Schlussformulierung ist ungewöhnlich und ihr Bezug ist unsicher. Wahrscheinlich ist gemeint, dass nach dem Abhauen von Kopf und Händen nur der Rumpf des Götzenbildes übrig war.'
    reason: Die Fußnote bewahrt die schwierige, mehrdeutige Form des Hebräischen und kennzeichnet die kontextuell naheliegende Deutung ausdrücklich als wahrscheinlich.
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: Als sie am nächsten Morgen früh aufstanden
  rationale: Gibt sowohl das frühe Aufstehen als auch den folgenden Morgen natürlich und vollständig wieder.
- source_word: וְהִנֵּה
  choice: siehe da!
  rationale: Bewahrt den überraschenden, aufmerksamkeitslenkenden Charakter des hebräischen Erzählmarkers.
- source_word: דָגוֹן נֹפֵל לְפָנָיו אַרְצָה
  choice: lag Dagon … mit dem Gesicht zur Erde
  rationale: Der Partizip bezeichnet den vorgefundenen Zustand. לְפָנָיו wird körperlich als Lage auf dem Gesicht verstanden; אַרְצָה bezeichnet die Ausrichtung zur Erde.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: vor der Lade Jahwes
  rationale: Direkte räumliche Wiedergabe; der Gottesname wird als Jahwe wiedergegeben.
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: seine beiden Handflächen
  rationale: Bewahrt die spezifische Bedeutung von כַּף und die Zweizahl.
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: waren abgehauen und lagen auf der Schwelle
  rationale: כְּרֻתוֹת beschreibt den abgetrennten Zustand; die deutsche Ergänzung „lagen“ macht die Ortsangabe idiomatisch verständlich.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: nur Dagon selbst war ihm geblieben
  rationale: Folgt der schwierigen hebräischen Formulierung eng, ohne „Rumpf“ ungekennzeichnet in den Haupttext einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Form.
- issue: Deutung von רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: nur Dagon selbst war ihm geblieben
  alternative: nur Dagons Rumpf war übrig geblieben
  rationale: Die schwer verständliche Formulierung und ihre Mehrdeutigkeit bleiben im Haupttext erhalten; die kontextuell wahrscheinliche Deutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausruf „siehe da!“ erhält die erzählerische Überraschung, ohne durchgehend altertümlich zu wirken. Die ungewöhnliche Schlussaussage wird bewusst nicht stillschweigend vereindeutigt.
