source:
  edition: WLC
  text: וּ/פְלִשְׁתִּים֙ לָֽקְח֔וּ אֵ֖ת אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יְבִאֻ֛/הוּ מֵ/אֶ֥בֶן הָעֵ֖זֶר אַשְׁדּֽוֹדָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: de
  text: Die Philister hatten die Lade Gottes genommen und sie von Eben-Eser nach Aschdod gebracht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich beginnt der hebräische Satz mit »Und die Philister«; das »und« kennzeichnet hier den Übergang in der Erzählung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Die Philister
  rationale: Der Volksname wird in der im Deutschen üblichen Form wiedergegeben. Das einleitende וּ markiert hier den Anschluss beziehungsweise Übergang der Erzählung und muss im natürlichen Deutschen nicht mit »und« ausgedrückt werden.
- source_word: לָקְחוּ
  choice: hatten … genommen
  rationale: Das Qal Perfekt von לקח bezeichnet das Nehmen der Lade. Das Plusquamperfekt macht deutlich, dass der Vers an das Ergebnis der zuvor erzählten Schlacht anknüpft.
- source_word: אֵת
  choice: nicht eigens wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine direkte deutsche Entsprechung.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Die traditionelle und verständliche Wiedergabe »Lade« bewahrt die Genitivverbindung des Hebräischen, ohne zusätzliche Deutung.
- source_word: וַיְבִאֻהוּ
  choice: und sie … gebracht
  rationale: Das Hifil von בוא mit maskulinem Objektsuffix bedeutet »sie brachten sie«. Das Pronomen »sie« bezieht sich im Deutschen grammatisch auf die feminine »Lade«.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: von Eben-Eser
  rationale: Die Präposition מִן wird mit »von« wiedergegeben; der Ortsname wird in einer quellennahen, im deutschen Bibelgebrauch etablierten Form transliteriert.
- source_word: אַשְׁדּוֹדָה
  choice: nach Aschdod
  rationale: Das ה locale bezeichnet die Richtung auf Aschdod zu; bei Städtenamen ist »nach« die natürliche deutsche Wiedergabe.
theological_decisions: []
