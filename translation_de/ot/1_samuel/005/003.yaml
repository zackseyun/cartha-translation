  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: de
  text: Als die Einwohner von Aschdod am nächsten Morgen früh aufstanden, siehe, da lag Dagon mit dem Gesicht zur Erde vor der Lade Jahwes. Da nahmen sie Dagon und stellten ihn wieder an seinen Platz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: früh aufstanden
  rationale: Die Hifil-Form von שׁכם bezeichnet das frühe Aufstehen. Die Formulierung ist im Deutschen natürlich und bewahrt die zeitliche Betonung.
- source_word: אַשְׁדּוֹדִים
  choice: die Einwohner von Aschdod
  rationale: Das hebräische Gentiliz im Plural bezeichnet die Bewohner der Stadt. Diese Wiedergabe ist für heutige Leser unmittelbar verständlich.
- source_word: מִמָּחֳרָת
  choice: am nächsten Morgen
  rationale: Der Ausdruck bezeichnet den folgenden Tag; zusammen mit dem frühen Aufstehen ergibt sich im Deutschen natürlich „am nächsten Morgen“.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf den überraschenden Anblick. „Siehe, da“ erhält diesen lebhaften erzählerischen Impuls in würdigem Deutsch.
- source_word: נֹפֵל
  choice: lag
  rationale: Das Partizip beschreibt Dagon in dem Zustand, in dem man ihn vorfindet. „Lag“ gibt diesen sichtbaren Zustand im Deutschen natürlich wieder, ohne ausdrücklich festzulegen, wie der Sturz geschah.
- source_word: לְפָנָיו אַרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die Wendung beschreibt eine erniedrigende, nach unten gerichtete Lage auf dem Gesicht. Die deutsche Formulierung bewahrt das Bild, ohne unnatürlich wörtlich zu klingen.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: vor der Lade Jahwes
  rationale: לִפְנֵי ist hier räumlich, und אֲרוֹן bezeichnet die heilige Lade. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: da nahmen sie Dagon
  rationale: לקח bedeutet gewöhnlich „nehmen“. Der Zusammenhang macht deutlich, dass das Götterbild angefasst und aufgehoben wird.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: stellten ihn wieder an seinen Platz
  rationale: Das Hifil von שׁוב bedeutet hier, etwas an seinen bisherigen Ort zurückzubringen. „Stellten ihn wieder an seinen Platz“ passt konkret zu einem umgestürzten Götterbild und gibt das maskuline Pronomen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Dagons Lage vor der Lade
  choice: mit dem Gesicht zur Erde vor der Lade Jahwes
  alternative: niedergeworfen vor der Lade Jahwes
  rationale: Die konkrete Körperlage wird beibehalten. Eine Deutung als absichtliche Anbetung wird nicht ausdrücklich in den Text eingetragen, auch wenn die Szene eine solche Unterwerfung bildhaft nahelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Siehe, da“ bewahrt den markanten Überraschungseffekt des hebräischen Erzählstils; ansonsten wurden unnötig altertümliche Formulierungen vermieden.
