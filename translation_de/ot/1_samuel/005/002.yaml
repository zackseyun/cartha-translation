  source_fidelity: 'Der deutsche Text gibt die Abfolge und die semantischen Kernwerte des Hebräischen zuverlässig wieder: Die Philister nehmen die Lade Gottes, bringen sie in Dagons Haus und positionieren sie neben Dagon. „Lade Gottes“ bewahrt אֲרוֹן הָאֱלֹהִים, ohne den im Vers nicht stehenden Gottesnamen JHWH einzusetzen. „Neben Dagon“ erhält die offene, wahrscheinlich metonymische Referenz des hebräischen Textes, ohne „Kultbild“ ergänzend in den Text einzutragen.'
