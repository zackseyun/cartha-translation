  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יָּבִ֥יאוּ אֹת֖/וֹ בֵּ֣ית דָּג֑וֹן וַ/יַּצִּ֥יגוּ אֹת֖/וֹ אֵ֥צֶל דָּגֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: de
  text: Da nahmen die Philister die Lade Gottes, brachten sie in das Haus Dagons[a] und stellten sie neben Dagon auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Tempel Dagons“. Wörtlich: „in das Haus Dagons“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Da nahmen
  rationale: לקח bezeichnet hier im Erzählablauf das gewöhnliche Nehmen. „Da nahmen“ gibt sowohl die Handlung als auch die fortschreitende hebräische Erzählstruktur natürlich wieder, ohne die zusätzliche Gewaltkomponente von „ergriffen“ oder „raubten“ einzutragen.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die im Deutschen etablierte Bezeichnung der Volksgruppe.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: „Lade“ ist im Deutschen die etablierte Bezeichnung für die heilige Lade. הָאֱלֹהִים bedeutet hier „Gott“; der Gottesname JHWH steht in diesem Vers nicht.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: brachten sie
  rationale: Das Hifil von בוא bedeutet gewöhnlich „bringen“. Das deutsche Pronomen „sie“ bezieht sich grammatisch korrekt auf die feminine „Lade“.
- source_word: בֵּית דָּגוֹן
  choice: das Haus Dagons
  rationale: בית bedeutet wörtlich „Haus“ und bezeichnet im Kontext Dagons Heiligtum. Die Formulierung bewahrt das hebräische Bild; „Tempel Dagons“ ist eine sinnentsprechende Alternative und wird in der Fußnote genannt.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: stellten sie … auf
  rationale: Das Hifil von יצג bedeutet „hinstellen, aufstellen, platzieren“. „Stellten … auf“ ist im Deutschen idiomatisch und lässt erkennen, dass die Lade an einem bestimmten Ort positioniert wurde.
- source_word: אֵצֶל דָּגוֹן
  choice: neben Dagon
  rationale: אֵצֶל bezeichnet räumliche Nähe, hier „neben“. Wahrscheinlich ist Dagons Kultbild gemeint, doch der hebräische Text nennt lediglich „Dagon“; diese Offenheit bleibt erhalten.
theological_decisions:
- issue: Gottesbezeichnung in „Lade Gottes“
  choice: „Gott“, nicht „der HERR“
  alternative: „die Lade des HERRN“
  rationale: Der hebräische Text hat הָאֱלֹהִים und nicht den Gottesnamen JHWH. Die Übersetzung bewahrt deshalb die tatsächlich verwendete Gottesbezeichnung.
- issue: Referenz von „Dagon“ am Versende
  choice: Dagon
  alternative: das Standbild Dagons
  rationale: Im Tempelzusammenhang ist wahrscheinlich das Kultbild gemeint. Da der Ausgangstext jedoch schlicht דָּגוֹן sagt, wird die mögliche metonymische Bedeutung nicht ausdrücklich in den Haupttext eingetragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzfolge bleibt knapp und erzählerisch. „Haus Dagons“ wahrt die Bildsprache des Hebräischen, während die Fußnote die kontextuelle Bedeutung erklärt.
