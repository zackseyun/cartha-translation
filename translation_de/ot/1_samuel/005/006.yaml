  text: וַ/תִּכְבַּ֧ד יַד יְהוָ֛ה אֶל הָ/אַשְׁדּוֹדִ֖ים וַ/יְשִׁמֵּ֑/ם וַ/יַּ֤ךְ אֹתָ/ם֙ ב/עפלים אֶת אַשְׁדּ֖וֹד וְ/אֶת גְּבוּלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: de
  text: Und die Hand Jahwes lastete schwer auf den Bewohnern von Aschdod. Er verwüstete sie und schlug sie mit Geschwülsten[a] – Aschdod und sein Gebiet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schwellungen«; traditionell wird das Wort teilweise genauer mit »Hämorrhoiden« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: die Hand Jahwes lastete schwer
  rationale: Bewahrt das konkrete hebräische Bild der schweren Hand und gibt die feindlich-bedrückende Wirkung idiomatisch im Deutschen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen in der im Deutschen geläufigen Form wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: auf den Bewohnern von Aschdod
  rationale: Die Form bezeichnet die Einwohner Aschdods; zusammen mit „lastete schwer“ gibt „auf“ die gegen sie gerichtete Wirkung natürlich wieder.
- source_word: וַיְשִׁמֵּם
  choice: Er verwüstete sie
  rationale: Das Verb bezeichnet ein Verheeren oder Verwüsten und wird stark, aber ohne zusätzliche Spezifizierung wiedergegeben.
- source_word: וַיַּךְ אֹתָם
  choice: schlug sie
  rationale: Entspricht dem häufigen hebräischen Verb für ein direktes Schlagen beziehungsweise Heimsuchen im Gericht.
- source_word: בָּעֳפָלִים
  choice: mit Geschwülsten
  rationale: „Geschwülste“ wahrt die medizinische Unbestimmtheit des seltenen Ausdrucks; die traditionell spezifischere Deutung wird in der Fußnote genannt.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: Aschdod und sein Gebiet
  rationale: 'Die nachgestellte Wendung erläutert den Umfang der Heimsuchung: die Stadt samt ihrem zugehörigen Umland.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname bleibt als solcher erkennbar und wird nicht durch einen Herrschaftstitel ersetzt.
- issue: Genauigkeit der Krankheit בָּעֳפָלִים
  choice: Geschwülste
  alternative: Hämorrhoiden
  rationale: Der hebräische Ausdruck erlaubt eine allgemeinere Bezeichnung von Schwellungen oder Geschwülsten; die engere traditionelle Diagnose ist möglich, aber nicht sicher genug für den Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das hebräische Bild von der schweren Hand bleibt erhalten; der Gedankenstrich macht die nachgestellte Angabe zum betroffenen Gesamtgebiet verständlich, ohne ihre appositionelle Spannung aufzulösen.
