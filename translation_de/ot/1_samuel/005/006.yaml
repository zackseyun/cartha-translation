  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und die wesentlichen Elemente zuverlässig wieder: die schwer lastende Hand Jahwes gegen die Einwohner Aschdods, die Verwüstung, das Schlagen mit עֳפָלִים sowie die abschließende räumliche Ausdehnung auf Aschdod und sein Gebiet. „Geschwülste“ bewahrt die lexikalische Offenheit des seltenen Krankheitsbegriffs.'
