source:
  edition: WLC
  text: עַל כֵּ֡ן לֹֽא יִדְרְכוּ֩ כֹהֲנֵ֨י דָג֜וֹן וְ/כָֽל הַ/בָּאִ֧ים בֵּית דָּג֛וֹן עַל מִפְתַּ֥ן דָּג֖וֹן בְּ/אַשְׁדּ֑וֹד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: de
  text: Darum treten die Priester Dagons und alle, die den Tempel Dagons in Aschdod betreten, bis heute nicht auf Dagons Schwelle.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann man übersetzen: „treten nicht auf die Schwelle Dagons“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „das Haus Dagons“; gemeint ist hier Dagons Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt die Folgerung aus dem unmittelbar zuvor erzählten Geschehen natürlich und knapp wieder.
- source_word: לֹא יִדְרְכוּ
  choice: treten ... nicht auf
  rationale: דרך bezeichnet das Treten bzw. Auftreten; die deutsche Verbindung „auf die Schwelle treten“ ist idiomatisch und bewahrt den konkreten Sinn.
- source_word: כֹהֲנֵי דָגוֹן
  choice: die Priester Dagons
  rationale: Direkte und im Deutschen natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: und alle, die den Tempel Dagons ... betreten
  rationale: בוא mit dem Gebäude als Ziel bezeichnet hier das Hineingehen. „Tempel“ macht die Funktion von „Haus Dagons“ als heidnisches Heiligtum im Deutschen klar.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: auf Dagons Schwelle
  rationale: מִפְתָּן bedeutet „Schwelle“; die possessive Formulierung ist knapp und natürlich, ohne die Wiederholung des Namens auszulassen.
- source_word: בְּאַשְׁדּוֹד
  choice: in Aschdod
  rationale: Gibt die Ortsangabe unmittelbar wieder.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis heute
  rationale: Übliche deutsche Wendung für einen Brauch, der bis in die Gegenwart des Erzählers fortbesteht.
