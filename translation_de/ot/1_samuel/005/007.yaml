  text: וַ/יִּרְא֥וּ אַנְשֵֽׁי אַשְׁדּ֖וֹד כִּֽי כֵ֑ן וְ/אָמְר֗וּ לֹֽא יֵשֵׁ֞ב אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ עִמָּ֔/נוּ כִּֽי קָשְׁתָ֤ה יָד/וֹ֙ עָלֵ֔י/נוּ וְ/עַ֖ל דָּג֥וֹן אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: de
  text: 'Als die Männer von Aschdod sahen, dass es so war, sagten sie: „Die Lade des Gottes Israels darf nicht bei uns bleiben[a], denn seine Hand liegt schwer[b] auf uns und auf Dagon, unserem Gott.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „darf nicht bei uns wohnen“. Das hebräische Verb kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn seine Hand ist schwer gegen uns und gegen Dagon, unseren Gott.“ Das Bild bezeichnet schweres göttliches Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד
  choice: Als die Männer von Aschdod sahen
  rationale: Die Konstruktion führt die Erzählung fort und hat hier natürlichen zeitlichen Sinn. אַנְשֵׁי wird entsprechend seiner Form mit „Männer“ wiedergegeben.
- source_word: כִּי כֵן
  choice: dass es so war
  rationale: Die knappe Wendung verweist auf die zuvor geschilderte Lage, ohne sie näher auszudeuten.
- source_word: לֹא יֵשֵׁב
  choice: darf nicht … bleiben
  rationale: יָשַׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Bei der Lade bezeichnet „bleiben“ natürlich ihren fortgesetzten Aufenthalt; „darf nicht“ gibt den entschiedenen Beschluss der Sprecher wieder.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: die Lade des Gottes Israels
  rationale: Die enge Wiedergabe bewahrt die Bezeichnung der Philister und den Kontrast zu Dagon.
- source_word: עִמָּנוּ
  choice: bei uns
  rationale: Im Deutschen bezeichnet „bei uns“ hier idiomatisch den Verbleib in ihrer Stadt beziehungsweise Gemeinschaft.
- source_word: קָשְׁתָה יָדוֹ
  choice: seine Hand liegt schwer
  rationale: Die Formulierung bewahrt das Bild der göttlichen Hand und vermittelt zugleich idiomatisch den Sinn von harter, bedrückender Machtausübung.
- source_word: עָלֵינוּ וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: auf uns und auf Dagon, unserem Gott
  rationale: Die parallele Präposition bleibt in der deutschen Konstruktion erhalten. „Unserem Gott“ gibt unverändert die Sicht der philistäischen Sprecher wieder.
theological_decisions:
- issue: Bildhafte Rede vom göttlichen Gericht in קָשְׁתָה יָדוֹ
  choice: seine Hand liegt schwer auf uns
  alternative: er hat uns hart getroffen
  rationale: Das Bild von Gottes Hand wird nicht in eine rein deutende Aussage aufgelöst. So bleibt sichtbar, dass der Gott Israels in der Erzählung wirksam gegen Aschdod und Dagon handelt.
- issue: Bezeichnung Dagons als אֱלֹהֵינוּ
  choice: Dagon, unserem Gott
  alternative: Dagon, unserem Götzen
  rationale: Die Übersetzung wahrt die Perspektive der Sprecher, ohne durch „Götze“ eine im Satz nicht ausdrücklich vorhandene Wertung einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzführung bleibt nah am Hebräischen; die Metapher der göttlichen Hand und die philistäische Bezeichnung Dagons werden bewahrt.
