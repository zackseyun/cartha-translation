base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: de
  text: 'Da schickten sie nach allen Fürsten der Philister und versammelten sie bei sich. Sie fragten: »Was sollen wir mit der Lade des Gottes Israels tun?« Diese antworteten: »Die Lade des Gottes Israels soll nach Gat gebracht werden.« So brachten sie die Lade des Gottes Israels nach Gat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So ließen sie die Lade des Gottes Israels nach Gat ziehen.« Das Verb betont die Bewegung oder Überführung, ohne die genaue Art des Transports anzugeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: Da ließen sie ... zu sich rufen
  rationale: Die beiden Verben bezeichnen das Aussenden von Boten und das dadurch bewirkte Zusammenrufen. Die deutsche Formulierung gibt den Vorgang natürlich und knapp wieder.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: Fürsten der Philister
  rationale: סֶרֶן ist der besondere Titel der Herrscher der philistäischen Stadtstaaten. »Fürsten« bewahrt den gewichtigen Amtstitel, ohne sie als Könige zu bezeichnen.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: Was sollen wir mit der Bundeslade ... tun?
  rationale: Der Imperfekt drückt eine beratende Frage aus; ל wird in dieser Verbindung im Deutschen idiomatisch mit »mit« wiedergegeben.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: die Bundeslade des Gottes Israels
  rationale: אֲרוֹן bedeutet wörtlich »Lade«; im deutschen Bibelsprachgebrauch bezeichnet »Bundeslade« den gemeinten heiligen Gegenstand eindeutig, auch wenn »Bund« hier nicht ausdrücklich steht.
- source_word: גַּת יִסֹּב
  choice: soll nach Gat weitergebracht werden
  rationale: סבב bezeichnet ein Sich-Wenden bzw. Herumgehen; im Zusammenhang ist die Verlegung in die nächste Stadt gemeint. »Weitergebracht« gibt die Bewegung wieder, ohne eine besondere Transportweise festzulegen.
- source_word: וַיַּסֵּבּוּ
  choice: So brachten sie ... nach Gat weiter
  rationale: 'Der Hifil ist kausativ: Sie veranlassten, dass die Lade weiterzog. Die Formulierung hält den Anschluss an die vorausgehende Anordnung fest.'
