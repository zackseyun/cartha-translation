  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: de
  text: Saul wählte sich dreitausend Mann aus Israel aus. Zweitausend waren bei Saul in Michmas und im Bergland von Bethel[a], und tausend waren bei Jonatan in Gibea in Benjamin. Den Rest des Volkes entließ er, jeden zu seinem Zelt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem Berg von Bethel«. Das hebräische הַר kann hier entweder das Bergland um Bethel oder eine bestimmte Anhöhe bei Bethel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »jeden zu seinen Zelten«. Dies ist eine geläufige hebräische Wendung für die Rückkehr jedes Einzelnen in seine eigene Unterkunft.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: Saul wählte sich … aus
  rationale: בּחר bedeutet »wählen/auswählen«; das Dativpronomen לוֹ wird durch »sich« bewahrt. Das trennbare Verb »auswählen« ergibt natürliches modernes Deutsch.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: dreitausend Mann aus Israel
  rationale: Die Zahl und die Herkunftsangabe werden unmittelbar wiedergegeben. »Mann« verdeutlicht im militärischen Zusammenhang die gemeinten Personen, ohne das allgemeinere »Israel« einzuengen.
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: waren bei Saul
  rationale: Die Formulierung gibt die Zuordnung und Stationierung der Männer wieder, ohne zusätzlich anzunehmen, dass sie dort »blieben«.
- source_word: וּבְהַר בֵּית אֵל
  choice: und im Bergland von Bethel
  rationale: הַר kann einen Berg, eine Anhöhe oder eine Bergregion bezeichnen. »Bergland« passt zur topografischen und militärischen Ortsangabe; die mögliche engere Deutung wird in einer Fußnote erhalten.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: in Gibea in Benjamin
  rationale: Die masoretische Punktierung stützt den Ortsnamen Gibea. Das zweite »in« gibt die geografische Zuordnung zum Gebiet Benjamin in verständlichem Deutsch wieder.
- source_word: וְיֶתֶר הָעָם שִׁלַּח
  choice: Den Rest des Volkes entließ er
  rationale: יֶתֶר הָעָם heißt wörtlich »der Rest des Volkes«. Im Zusammenhang bezeichnet שִׁלַּח das Wegschicken beziehungsweise Entlassen der übrigen Aufgebotenen.
- source_word: אִישׁ לְאֹהָלָיו
  choice: jeden zu seinem Zelt
  rationale: Die distributive Wendung wird knapp und konkret wiedergegeben. »Zelt« bewahrt das Bild des Hebräischen, auch wenn die feste Wendung allgemein die Rückkehr in die eigene Unterkunft meint.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Erzählweise. Die Ortsnamen folgen gebräuchlichen deutschen Bibelformen; syntaktische Straffung vermeidet unnötig altertümlichen Ton. Echte topografische Mehrdeutigkeit wird in der Fußnote offengehalten.
