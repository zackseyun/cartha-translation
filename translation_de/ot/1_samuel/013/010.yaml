  source_fidelity: 'Die Übersetzung gibt die Abfolge des Hebräischen zuverlässig wieder: Abschluss des Brandopfers, das hervorgehobene Kommen Samuels sowie Sauls Hinausgehen, um ihm zu begegnen und ihn zu segnen. „Kaum … da“ bringt die im Kontext naheliegende unmittelbare zeitliche Folge angemessen zum Ausdruck. Das überraschend-vivide וְהִנֵּה ist durch „da“ zwar idiomatisch statt formal wiedergegeben, aber ausreichend markiert.'
