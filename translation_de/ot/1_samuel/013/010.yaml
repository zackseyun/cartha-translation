  terminology: „Brandopfer“ ist die sachgerechte etablierte Wiedergabe von עֹלָה. „segnen“ erhält den Grundsinn von לְבָרֲכוֹ; die Fußnote nennt zutreffend und ohne Überinterpretation die kontextuell mögliche Bedeutung eines förmlichen Grußes.
