  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/הַעֲל֣וֹת הָ/עֹלָ֔ה וְ/הִנֵּ֥ה שְׁמוּאֵ֖ל בָּ֑א וַ/יֵּצֵ֥א שָׁא֛וּל לִ/קְרָאת֖/וֹ לְ/בָרֲכֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: de
  text: 'Und es geschah: Kaum hatte Saul das Brandopfer dargebracht, da kam Samuel. Saul ging hinaus, ihm entgegen, um ihn zu segnen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn zu begrüßen“. Das hebräische Verb bedeutet wörtlich „segnen“, kann in einer Begegnungssituation aber einen förmlichen Gruß bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische Erzählungsform leitet das nächste Geschehen ein. Die Wiedergabe bewahrt diese Funktion in würdiger, noch verständlicher Sprache.
- source_word: כְּכַלֹּתוֹ לְהַעֲלוֹת
  choice: Kaum hatte Saul … dargebracht
  rationale: כְּ mit dem Infinitiv und dem Suffix bezeichnet hier den Zeitpunkt unmittelbar nach Abschluss der Handlung. Der Name „Saul“ verdeutlicht im Deutschen den nur durch den Kontext bestimmten Rückbezug des Pronomens.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist der feststehende Opferbegriff für ein vollständig auf dem Altar verbranntes Opfer; „Brandopfer“ ist die geläufige deutsche Bezeichnung.
- source_word: וְהִנֵּה שְׁמוּאֵל בָּא
  choice: da kam Samuel
  rationale: הִנֵּה hebt das plötzliche, anschaulich erzählte Eintreffen Samuels hervor. Das deutsche „da“ vermittelt diesen unmittelbaren Umschlag natürlicher als ein isoliertes „siehe“.
- source_word: וַיֵּצֵא שָׁאוּל לִקְרָאתוֹ
  choice: Saul ging hinaus, ihm entgegen
  rationale: Die Formulierung bewahrt sowohl die Bewegung nach draußen als auch das Entgegengehen.
- source_word: לְבָרֲכוֹ
  choice: um ihn zu segnen
  rationale: ברך bedeutet wörtlich „segnen“, kann bei einer Begegnung jedoch als förmlicher Gruß gemeint sein. Die Hauptfassung erhält den lexikalischen Wortlaut; die Fußnote nennt die kontextuelle Möglichkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und es geschah“ erhält den biblischen Erzählton, ohne auf die altertümliche Wendung „es begab sich“ zurückzugreifen. Der Doppelpunkt und „kaum … da“ bilden die unmittelbare zeitliche Abfolge natürlich ab.
