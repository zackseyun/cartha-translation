source:
  edition: WLC
  text: בֶּן שָׁנָ֖ה שָׁא֣וּל בְּ/מָלְכ֑/וֹ וּ/שְׁתֵּ֣י שָׁנִ֔ים מָלַ֖ךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/001.yaml
  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: de
  text: Saul war ein Jahr alt, als er König wurde[a], und er regierte zwei Jahre über Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier schwierig und wahrscheinlich unvollständig. Wörtlich lautet er: »Saul war ein Sohn von einem Jahr, als er König wurde, und er regierte zwei Jahre über Israel.« Einige alte Textzeugen und spätere Rekonstruktionsvorschläge ergänzen höhere Zahlen, etwa »dreißig« für Sauls Alter und »zweiundvierzig« für die Dauer seiner Herrschaft.'
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: war ein Jahr alt
  rationale: Die hebräische Altersangabe bedeutet gewöhnlich »ein Jahr alt«. Diese direkte, natürliche Wiedergabe bewahrt den überlieferten masoretischen Wortlaut, obwohl er hier historisch schwierig ist.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Konstruktion bezeichnet in dieser Königsformel den Zeitpunkt des Regierungsantritts; die Wiedergabe ist idiomatisch und kontextgerecht.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: und … zwei Jahre
  rationale: Die im masoretischen Text überlieferte Zahl und die verbindende Konjunktion werden unmittelbar wiedergegeben.
- source_word: מָלַךְ
  choice: er regierte
  rationale: Das Verb מלך bedeutet im Qal »König sein« oder »regieren«; »regierte« ist in einer deutschen Königsnotiz natürlich.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: Übliche deutsche Verbindung mit einem Verb des Herrschens.
theological_decisions:
- issue: Schwierige oder beschädigte Regierungsformel im masoretischen Text
  choice: Der überlieferte masoretische Wortlaut bleibt im Haupttext ohne ergänzte Zahlen stehen.
  alternative: Mögliche Rekonstruktionen setzen etwa dreißig Jahre für Sauls Alter und zweiundvierzig Jahre für seine Regierungszeit ein oder lassen die fehlenden Zahlen offen.
  rationale: Der vorliegende hebräische Text ist offenbar unvollständig oder gestört. Da keine Rekonstruktion sicher ist, werden keine vermuteten Zahlen in den Haupttext aufgenommen; die Schwierigkeit und wichtige Vorschläge werden in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die unplausible Zahlenangabe des überlieferten Textes wird klar und idiomatisch übersetzt; eine Fußnote erläutert die wahrscheinliche Textlücke, ohne im Haupttext eine unsichere Rekonstruktion einzusetzen.
