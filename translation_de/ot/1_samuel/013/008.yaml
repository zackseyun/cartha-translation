  text: ו/ייחל שִׁבְעַ֣ת יָמִ֗ים לַ/מּוֹעֵד֙ אֲשֶׁ֣ר שְׁמוּאֵ֔ל וְ/לֹא בָ֥א שְׁמוּאֵ֖ל הַ/גִּלְגָּ֑ל וַ/יָּ֥פֶץ הָ/עָ֖ם מֵ/עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: de
  text: Er wartete sieben Tage lang bis zum festgesetzten Zeitpunkt, den Samuel bestimmt hatte.[a] Doch Samuel kam nicht nach Gilgal, und die Leute liefen Saul davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen ein verkürzter Relativsatz: „bis zum festgesetzten Zeitpunkt, den Samuel …“. Aus dem Zusammenhang ergibt sich, dass Samuel diesen Zeitpunkt bestimmt hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: Er wartete
  rationale: Das Verb bezeichnet hier ein Warten über einen bestimmten Zeitraum; der Kontext spricht nicht für abstraktes Hoffen.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die Zeitangabe bezeichnet die Dauer des Wartens; „lang“ ist im modernen Deutschen natürlich.
- source_word: לַמּוֹעֵד אֲשֶׁר שְׁמוּאֵל
  choice: bis zu dem festgesetzten Zeitpunkt, den Samuel bestimmt hatte
  rationale: מוֹעֵד bezeichnet einen vereinbarten oder festgesetzten Zeitpunkt. Der hebräische Relativsatz ist verkürzt; die deutsche Fassung ergänzt den im Zusammenhang vorausgesetzten verbalen Sinn.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: Doch Samuel kam nicht nach Gilgal
  rationale: „Doch“ gibt den kontextuell adversativen Sinn der Konjunktion wieder; das Ziel einer Bewegung wird im Deutschen idiomatisch mit „nach Gilgal“ bezeichnet.
- source_word: וַיָּפֶץ הָעָם
  choice: und das Volk verlief sich
  rationale: Die Form beschreibt das Auseinandergehen beziehungsweise Zerstreuen der Leute. „Verlief sich“ vermittelt hier natürlich, dass sie nach und nach weggingen.
- source_word: מֵעָלָיו
  choice: von ihm weg
  rationale: Das Pronomen bezieht sich im Kontext am ehesten auf Saul; „von ihm weg“ bewahrt die pronominale Ausdrucksweise und verdeutlicht die Trennung.
