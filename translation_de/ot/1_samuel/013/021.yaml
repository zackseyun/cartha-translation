base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: de
  text: Die Gebühr betrug einen Pim für die Pflugscharen, die Hacken, die dreizinkigen Gabeln und die Äxte sowie für das Herrichten der Treiberstachel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung einiger der hier genannten landwirtschaftlichen Geräte ist unsicher.
    reason: translation_note
  - marker: b
    text: Ein Pim war vermutlich ein kleines Gewicht beziehungsweise ein entsprechender Zahlbetrag, meist auf etwa zwei Drittel eines Schekels geschätzt. Der schwierige hebräische Wortlaut kann auch das Feilen oder Schärfen selbst bezeichnen, nicht ausdrücklich die dafür erhobene Gebühr.
    reason: cultural_and_alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה פִים
  choice: für das Schärfen … musste man einen Pim bezahlen
  rationale: Die seltene und schwierige Verbindung wird im Zusammenhang am natürlichsten als Preisangabe für den Schärfdienst verstanden. Die deutsche Satzform macht diesen Sinn verständlich, ohne die Unsicherheit zu verschweigen.
- source_word: פִים
  choice: einen Pim
  rationale: Die spezialisierte Gewichts- bzw. Zahlungseinheit wird transliteriert; ihr wahrscheinlicher Wert wird in einer Fußnote erklärt.
- source_word: מַחֲרֵשֹׁת
  choice: Pflugscharen
  rationale: Bezeichnet hier plausibel die eisernen, zu schärfenden Teile des Pfluges.
- source_word: אֵתִים
  choice: Hacken
  rationale: Ein landwirtschaftliches Gerät zum Graben oder Aufbrechen des Bodens; die genaue Geräteform ist nicht sicher.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: dreizinkigen Gabeln
  rationale: Gibt das Bild eines Geräts mit drei Spitzen klar und nah am Hebräischen wieder.
- source_word: קַּרְדֻּמִּים
  choice: Äxte
  rationale: Eine verständliche Wiedergabe für die genannten Hiebwerkzeuge, auch wenn Dechseln möglicherweise mitgemeint sein können.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: für das Herrichten der Treiberstachel
  rationale: „Herrichten“ bewahrt die Bedeutungsbreite von Ausrichten, Instandsetzen oder Befestigen und legt sich nicht unnötig auf Schärfen fest.
