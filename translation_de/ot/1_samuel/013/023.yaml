lexical_decisions:
- source_word: וַיֵּצֵא
  choice: rückte … vor
  rationale: Das Verb bezeichnet ein Hinaus- oder Hervorgehen. Im militärischen Zusammenhang gibt „rückte … vor“ die gerichtete Bewegung natürlich wieder, ohne einen Kampf vorauszusetzen.
- source_word: מַצַּב
  choice: Vorposten
  rationale: Das Substantiv kann eine aufgestellte militärische Einheit oder deren Posten bezeichnen. „Vorposten“ passt hier gut zu einer Einheit, die sich zum Pass bewegt; „Besatzung“ bleibt möglich.
- source_word: פְּלִשְׁתִּים
  choice: der Philister
  rationale: Übliche deutsche Bezeichnung des Volkes; die hebräische Genitivverbindung wird im Deutschen entsprechend wiedergegeben.
- source_word: אֶל
  choice: zum
  rationale: Die Präposition bezeichnet die Bewegungsrichtung auf ein Ziel hin.
- source_word: מַעֲבַר
  choice: Pass
  rationale: Das Wort bezeichnet einen Übergang oder Durchgang. Im topografischen und militärischen Zusammenhang bei Michmas ist „Pass“ eine natürliche Wiedergabe.
- source_word: מִכְמָשׂ
  choice: Michmas
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
