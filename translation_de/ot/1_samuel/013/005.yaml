  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: de
  text: 'Die Philister versammelten sich, um gegen Israel zu kämpfen: 30.000 Streitwagen[a], 6.000 Reiter und Truppen, so zahlreich wie der Sand am Meeresufer. Sie zogen hinauf und schlugen ihr Lager bei Michmas auf, östlich von Bet-Awen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „30.000 Streitwagen“. Weil diese Zahl im Zusammenhang ungewöhnlich hoch erscheint, vermuten manche Ausleger eine kleinere Zahl, etwa „3.000“; auch einige alte Textzeugen bieten eine kleinere Zahl. Der Haupttext folgt dem masoretischen hebräischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: versammelten sich
  rationale: Der Nifal von אסף bezeichnet hier das Zusammenkommen beziehungsweise Aufgebot zum Kampf; die reflexive Form ist im Deutschen natürlich und bewahrt den militärischen Zusammenhang.
- source_word: לְהִלָּחֵם עִם
  choice: um gegen Israel zu kämpfen
  rationale: לחם mit עִם bezeichnet hier eine feindliche Auseinandersetzung; „gegen … kämpfen“ gibt dies klar und idiomatisch wieder.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: 30.000 Streitwagen
  rationale: רֶכֶב kann Streitwagen beziehungsweise die Streitwagenmacht bezeichnen. Die Hauptlesart folgt dem masoretischen Text trotz der auffällig hohen Zahl; die textkritische Frage wird in der Fußnote ausgewiesen.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: 6.000 Reiter
  rationale: פָּרָשִׁים bezeichnet berittene Kämpfer; „Reiter“ ist präzise, geläufig und stilistisch angemessen.
- source_word: וְעָם
  choice: und Fußtruppen
  rationale: עָם bedeutet wörtlich „Volk/Leute“, bezeichnet in dieser militärischen Aufzählung aber die übrige Streitmacht. „Fußtruppen“ stellt den naheliegenden Gegensatz zu Streitwagen und Reitern her, ist jedoch etwas konkreter als das Hebräische.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: so zahlreich wie der Sand am Meeresufer
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild einer unübersehbaren Menge und gibt לָרֹב sinngemäß durch „so zahlreich“ wieder.
- source_word: וַיַּעֲלוּ
  choice: Sie zogen hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung und kann im militärischen Zusammenhang ein Vorrücken ausdrücken; „zogen hinauf“ bewahrt Richtung und Erzählstil.
- source_word: וַיַּחֲנוּ
  choice: schlugen ihr Lager … auf
  rationale: חנה bedeutet „lagern“. Die deutsche Wendung ist modern, anschaulich und idiomatisch.
- source_word: בְמִכְמָשׂ
  choice: bei Michmas
  rationale: Die Präposition bezeichnet den Ort des Lagers; „bei“ ist für eine militärische Lagerstätte an einem Ort natürlich. Der Ortsname folgt der im Deutschen üblichen biblischen Form.
- source_word: קִדְמַת בֵּית אָוֶן
  choice: östlich von Bet-Awen
  rationale: קִדְמַת bezeichnet hier die Lage auf der Ostseite beziehungsweise östlich des genannten Ortes; diese Wiedergabe ist eindeutig und idiomatisch.
