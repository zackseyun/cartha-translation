base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: de
  text: 'Da sagte ich: »Jetzt werden die Philister gegen mich nach Gilgal herabkommen, und Jahwes Gunst habe ich noch nicht gesucht[a].« So zwang ich mich dazu[b] und brachte das Brandopfer dar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich hatte Jahwes Angesicht nicht angefleht.« Die hebräische Wendung bedeutet, Jahwes Gunst zu suchen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »So beherrschte ich mich.« Das hebräische Verb kann ausdrücken, dass man sich zurückhält oder sich selbst zu etwas zwingt; hier bezieht es sich wahrscheinlich auf Sauls Überwindung zum Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich mir
  rationale: Das Narrativ wird fortgeführt; das ergänzte »mir« macht im Deutschen deutlich, dass Saul seine innere Überlegung wiedergibt, ohne den Aussagecharakter des Verbs aufzugeben.
- source_word: יֵרְדוּ פְלִשְׁתִּים אֵלַי הַגִּלְגָּל
  choice: die Philister werden zu mir nach Gilgal herabkommen
  rationale: »Herabkommen« bewahrt die Bewegungsrichtung von ירד; אֵלַי wird im Zusammenhang der erwarteten feindlichen Annäherung mit »zu mir« wiedergegeben, während »nach Gilgal« das Ziel bezeichnet.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: ich habe Jahwes Gunst noch nicht gesucht
  rationale: Die feste Wendung bedeutet, jemandes Angesicht anzuflehen beziehungsweise seine Gunst zu suchen. »Noch« verdeutlicht den zeitlichen Druck, der durch עַתָּה und Sauls Begründung gegeben ist, ohne den Sinn zu verändern.
- source_word: וָאֶתְאַפַּק
  choice: So zwang ich mich dazu
  rationale: Der Hitpael von אפק kann Selbstbeherrschung beziehungsweise ein Sich-Zwingen ausdrücken. Im Kontext rechtfertigt Saul, dass er sich trotz seines Zögerns zur Opferhandlung gedrängt sah.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: und brachte das Brandopfer dar
  rationale: עלה mit עֹלָה ist kultische Opfersprache. »Das Brandopfer darbringen« ist die geläufige, klare deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen etablierte Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Sauls Selbstdarstellung in וָאֶתְאַפַּק
  choice: So zwang ich mich dazu
  alternative: So beherrschte ich mich / So hielt ich mich zurück
  rationale: Die Form lässt sprachlich eine Nuance von Selbstbeherrschung zu. Der unmittelbare Zusammenhang verbindet sie jedoch mit der anschließend vollzogenen Handlung; daher wird Sauls behauptetes widerwilliges Sich-Überwinden ausgedrückt, ohne seine Rechtfertigung theologisch zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und dringlich. »Brandopfer darbringen« bewahrt den vertrauten kultischen Ausdruck; altertümliche Satzformen werden vermieden.
