  text: וְ/חָרָשׁ֙ לֹ֣א יִמָּצֵ֔א בְּ/כֹ֖ל אֶ֣רֶץ יִשְׂרָאֵ֑ל כִּֽי אמר פְלִשְׁתִּ֔ים פֶּ֚ן יַעֲשׂ֣וּ הָ/עִבְרִ֔ים חֶ֖רֶב א֥וֹ חֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: de
  text: 'Im ganzen Land Israel war kein Schmied zu finden, denn die Philister hatten gesagt: »Sonst würden die Hebräer Schwerter oder Speere anfertigen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alternativ: »damit die Hebräer nicht ein Schwert oder einen Speer anfertigen«; die Einzahl steht im Hebräischen verallgemeinernd.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרָשׁ
  choice: Schmied
  rationale: Im militärischen Zusammenhang bezeichnet das Wort einen Metallhandwerker, der Waffen herstellen und Werkzeuge bearbeiten konnte; »Schmied« ist im Deutschen präzise und natürlich.
- source_word: יִמָּצֵא
  choice: war … zu finden
  rationale: Der Nifal bezeichnet das Vorhanden- beziehungsweise Auffindbarsein. Die deutsche Wendung gibt die tatsächliche Abwesenheit eines Schmieds idiomatisch wieder.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: im ganzen Land Israel
  rationale: Die Formulierung bewahrt den territorialen Sinn und klingt in modernem Standarddeutsch natürlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für das Fehlen von Schmieden ein; »denn« fügt sich hier klar in den deutschen Erzählsatz ein.
- source_word: אמר
  choice: hatten gesagt
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass der zuvor gefasste Entschluss der Philister die bestehende Lage erklärt, ohne die Bedeutung des hebräischen Qatal zu überfrachten.
- source_word: פֶּן
  choice: Sonst könnten
  rationale: פֶּן drückt eine zu verhindernde Möglichkeit aus. »Sonst könnten« ist gegenwärtiges, idiomatisches Deutsch und erhält den präventiven Sinn.
- source_word: הָעִבְרִים
  choice: die Hebräer
  rationale: Die ethnische Bezeichnung des Ausgangstextes wird bewahrt und nicht zu »Israeliten« harmonisiert; sie passt zur Perspektive der Philister.
- source_word: יַעֲשׂוּ
  choice: anfertigen
  rationale: Das Verb bedeutet grundsätzlich »machen«. Bei Waffen bezeichnet »anfertigen« die beabsichtigte Herstellung präzise und natürlich.
- source_word: חֶרֶב אוֹ חֲנִית
  choice: Schwerter oder Speere
  rationale: Die hebräischen Singulare werden generisch gebraucht. Der deutsche Plural bringt die allgemeine Sorge vor Waffenproduktion idiomatisch zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer narrativer Syntax. Die fremdperspektivische Bezeichnung »Hebräer« bleibt erhalten; die generischen Waffenbezeichnungen stehen im idiomatischen deutschen Plural.
