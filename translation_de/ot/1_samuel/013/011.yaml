base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: de
  text: 'Da sagte Samuel: »Was hast du getan?« Saul antwortete: »Denn ich sah, dass das Volk sich von mir zerstreute, dass du nicht zum festgesetzten Zeitpunkt[a] kamst und dass die Philister sich in Michmas sammelten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zum festgesetzten Zeitpunkt der Tage«; gemeint ist wahrscheinlich die zuvor vereinbarte Frist.'
    reason: Die ungewöhnliche hebräische Zeitangabe wird im Haupttext idiomatisch wiedergegeben und hier formal dokumentiert.
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Was hast du getan?
  rationale: Das deutsche Perfekt gibt Samuels scharfe Frage nach einer vollendeten Tat mit gegenwärtigen Folgen natürlich wieder.
- source_word: כִּי רָאִיתִי
  choice: Ich sah
  rationale: Das erste כִּי leitet Sauls Begründung ein; im Deutschen kann diese nach »antwortete« ohne ein schwerfälliges vorangestelltes »weil« als direkte Erklärung folgen. רָאִיתִי wird in seinem gewöhnlichen Sinn wiedergegeben.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: dass das Volk sich von mir zerstreute
  rationale: Die Form beschreibt das Auseinandergehen der Truppen und wahrt mit »von mir« Sauls Perspektive als den Bezugspunkt ihres Weggangs.
- source_word: לֹא בָאתָ
  choice: du nicht … kamst
  rationale: Im koordinierten deutschen dass-Satz ist das Präteritum idiomatisch und gibt Sauls rückblickende Feststellung klar wieder.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: zum festgesetzten Zeitpunkt
  rationale: Die natürliche deutsche Wendung erfasst den vereinbarten beziehungsweise zuvor bestimmten Termin, während eine Fußnote die ungewöhnlichere wörtliche Formulierung bewahrt.
- source_word: נֶאֱסָפִים
  choice: sich … sammelten
  rationale: Das reflexive Verb gibt den medial-passivischen Sinn des Nifal-Partizips und die im Gang befindliche militärische Sammlung natürlich wieder.
- source_word: מִכְמָשׂ
  choice: Michmas
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens.
