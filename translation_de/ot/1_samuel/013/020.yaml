translation_notes:
  register: Moderne, würdige Erzählsprache. Die Verbklammer »ging … hinab« bewahrt die hebräische Bewegungsrichtung; »schärfen zu lassen« macht den im Kontext vorausgesetzten Dienst der Philister idiomatisch deutlich. Die lexikalische Unsicherheit beim letzten Werkzeug bleibt ausdrücklich erhalten.
