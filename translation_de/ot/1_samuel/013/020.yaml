  yaml_path: translation/ot/1_samuel/013/020.yaml
  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: de
  text: Da ging ganz Israel zu den Philistern hinab, jeder, um seine Pflugschar, seine Hacke, seine Axt und sein Pflugmesser[a] zu schärfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Sichel; möglicherweise ist ein anderes Pfluggerät gemeint. Die Bedeutung des hebräischen Wortes ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: ging … hinab
  rationale: Das Qal-Wayyiqtol von ירד bezeichnet eine Abwärtsbewegung; die deutsche Verbklammer gibt den Richtungssinn natürlich wieder.
- source_word: כָל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bewahrt den kollektiven Charakter der hebräischen Wendung und klingt im Deutschen natürlich.
- source_word: הַפְּלִשְׁתִּים
  choice: zu den Philistern
  rationale: Der hebräische Text nennt das Volk, nicht das Land oder ausdrücklich die Schmiede; daher wird nichts ergänzt.
- source_word: לִלְטוֹשׁ
  choice: schärfen zu lassen
  rationale: לטש bezeichnet hier das Schärfen der Metallgeräte. Wegen der Bewegung zu den Philistern und des Kontextes von Vers 19 ist im Deutschen die kausative Formulierung sachgerecht.
- source_word: אִישׁ
  choice: jeder
  rationale: Gibt den distributiven Singular nach dem Kollektivsubjekt knapp und idiomatisch wieder.
- source_word: מַחֲרַשְׁתּוֹ
  choice: seine Pflugschar
  rationale: Das Wort bezeichnet hier wahrscheinlich ein schneidendes Pflugteil; »Pflugschar« ist die präzise und gebräuchliche deutsche Bezeichnung.
- source_word: אֵתוֹ
  choice: seine Hacke
  rationale: אֵת bezeichnet ein Werkzeug zum Hacken oder Graben; »Hacke« ist im heutigen Standarddeutsch verständlicher als fachsprachliche Alternativen.
- source_word: קַרְדֻּמּוֹ
  choice: seine Axt
  rationale: Das Substantiv bezeichnet gewöhnlich ein axtartiges Schneidwerkzeug; »Axt« ist die naheliegende Wiedergabe.
- source_word: מַחֲרֵשָׁתוֹ
  choice: sein Pflugmesser
  rationale: Die genaue Art des letzten Geräts ist umstritten. »Pflugmesser« gibt eine mögliche Bezeichnung für ein weiteres Pflugteil wieder, ohne es mit der ersten Pflugschar gleichzusetzen; die Unsicherheit wird in der Fußnote offengelegt.
