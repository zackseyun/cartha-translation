reference: 1 Samuel 13:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: de
  text: 'Und Samuel sagte zu Saul: „Du hast töricht gehandelt.[a] Du hast das Gebot Jahwes, deines Gottes, das er dir geboten hatte, nicht gehalten. Denn jetzt hätte Jahwe deine Königsherrschaft über Israel für immer gefestigt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast dich töricht verhalten.“'
    reason: Lexikalische Alternative für נִסְכָּלְתָּ; die Form kann als törichtes Handeln oder Verhalten ausgedrückt werden.
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: Du hast töricht gehandelt
  rationale: Der Nifal von סכל bewertet Sauls Verhalten, nicht nur seinen Zustand. „Töricht gehandelt“ ist im modernen Deutschen natürlich und bewahrt die moralische Wertung.
- source_word: שָׁמַרְתָּ
  choice: nicht gehalten
  rationale: שׁמר bezeichnet hier das Beachten beziehungsweise Einhalten eines göttlichen Gebots. „Gehalten“ wahrt die gebots- und bundestheologische Ausdrucksweise, ohne sie erklärend zu „gehorcht“ auszuweiten.
- source_word: מִצְוַת
  choice: das Gebot
  rationale: Der Singular bezeichnet das konkrete göttliche Gebot, das Saul missachtet hat.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Die Genitivfügung ist in der Apposition „Jahwes, deines Gottes“ natürlich und gibt das Possessivsuffix genau wieder.
- source_word: צִוָּךְ
  choice: das er dir geboten hatte
  rationale: צוה bedeutet „gebieten/befehlen“. Das Plusquamperfekt verdeutlicht im Deutschen, dass das Gebot vor Sauls Übertretung ergangen war, ohne den Sachgehalt zu verändern.
- source_word: כִּי עַתָּה
  choice: Denn jetzt
  rationale: כִּי leitet die begründende Erklärung ein; עַתָּה markiert den nun verwirkten Ausgang.
- source_word: הֵכִין
  choice: hätte … gefestigt
  rationale: Der Hifil von כון bezeichnet das feste Aufrichten oder Sichern. Der deutsche Konjunktiv II gibt im Kontext den nicht eingetretenen, kontrafaktischen Ausgang wieder.
- source_word: מַמְלַכְתְּךָ
  choice: deine Königsherrschaft
  rationale: ממלכה kann Reich, Königtum oder Königsherrschaft bezeichnen. Da die Herrschaft „über Israel“ gemeint ist, vermeidet „Königsherrschaft“ die mögliche räumliche Verengung von „Königreich“.
- source_word: אֶל יִשְׂרָאֵל
  choice: über Israel
  rationale: Im Zusammenhang mit Königsherrschaft gibt „über Israel“ die Ziel- beziehungsweise Herrschaftsbeziehung idiomatisch wieder.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die geläufige deutsche Wiedergabe bewahrt die Aussage unbegrenzter Dauer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Kontrafaktische Bedeutung von כִּי עַתָּה הֵכִין יְהוָה
  choice: Denn jetzt hätte Jahwe … gefestigt
  alternative: Denn jetzt hat Jahwe … gefestigt
  rationale: Der weitere Zusammenhang beschreibt die bleibende Festigung von Sauls Königsherrschaft als durch seinen Ungehorsam verwirkte Möglichkeit. Der deutsche Konjunktiv macht diese im Hebräischen kontextuell erschlossene Spannung verständlich, ohne eine zusätzliche Bedingung in den Haupttext einzufügen.
- issue: Bedeutungsumfang von מַמְלָכָה
  choice: Königsherrschaft
  alternative: Königreich
  rationale: Hier steht die Beständigkeit von Sauls dynastischer Herrschaft über Israel im Vordergrund. „Königsherrschaft“ lässt offen, ob besonders das Königtum, die Herrschaftsausübung oder die Dynastie akzentuiert ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusste Wiederholung „Gebot … geboten“ spiegelt die hebräische Wortverbindung und bleibt verständlich. Der Gottesname erscheint als „Jahwe“.
