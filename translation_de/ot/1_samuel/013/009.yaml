source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל הַגִּ֣שׁוּ אֵלַ֔/י הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יַּ֖עַל הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: de
  text: 'Da sagte Saul: „Bringt mir das Brandopfer und die Friedensopfer[a] her!“ Und er brachte das Brandopfer dar.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gemeinschaftsopfer“. Der hebräische Ausdruck kann Opfer bezeichnen, die mit Frieden, Wohlergehen oder gemeinschaftlicher Verbundenheit zusammenhängen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satzteil bedeutet am natürlichsten, dass Saul selbst das Brandopfer darbrachte. Manche verstehen ihn indirekter: Saul ließ das Opfer darbringen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte Saul
  rationale: Das Waw consecutivum führt die Erzählung weiter. „Da“ gibt die zeitlich-folgernde Bewegung im modernen deutschen Erzählstil natürlich wieder.
- source_word: הַגִּשׁוּ אֵלַי
  choice: Bringt mir … her
  rationale: Der Hifil-Imperativ von נגשׁ bezeichnet das Heranbringen bzw. Präsentieren. „Herbringen“ ist natürliches Deutsch und bewahrt die Ausrichtung auf Saul.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist die übliche Bezeichnung für das vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte und präzise deutsche Wiedergabe.
- source_word: וְהַשְּׁלָמִים
  choice: und die Friedensopfer
  rationale: שְׁלָמִים bezeichnet Opfer des Friedens bzw. Wohlergehens, die auch mit gemeinschaftlicher Mahlzeit verbunden sein können. „Friedensopfer“ bleibt eng am hebräischen Ausdruck und ist als kultischer Begriff erkennbar.
- source_word: וַיַּעַל
  choice: Und er brachte … dar
  rationale: עלה bedeutet im Opferkontext idiomatisch „darbringen“. Das maskuline Singularverb nimmt am natürlichsten Saul als handelndes Subjekt wieder auf.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: Die Wiederholung entspricht dem hebräischen Text und bezeichnet ausdrücklich das zuvor genannte Brandopfer.
theological_decisions:
- issue: Subjekt und Handlung im letzten Satzteil
  choice: Saul selbst brachte das Brandopfer dar
  alternative: Saul ließ das Brandopfer darbringen bzw. herbeibringen
  rationale: Die naheliegende grammatische Lesart des singularischen וַיַּעַל setzt Saul als vorheriges Subjekt fort und passt zur anschließenden Zurechtweisung. Eine indirekte bzw. veranlassende Deutung ist im weiteren Opferidiom möglich und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe „Brandopfer“ und „Friedensopfer“ bleiben erhalten; die Satzführung ist knapp und erzählerisch. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
