source:
  edition: WLC
  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: de
  text: Doch nun wird dein Königtum keinen Bestand haben.[a] Jahwe hat sich einen Mann nach seinem Herzen gesucht,[b] und Jahwe hat ihn zum Herrscher über sein Volk[c] eingesetzt, weil du nicht gehalten hast, was Jahwe dir geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wird nicht bestehen“ oder „wird nicht feststehen“. Gemeint ist, dass Sauls Königtum keinen dauerhaften Bestand haben wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach seinem Herzen“. Das Pronomen bezieht sich im Zusammenhang am ehesten auf Jahwe; die Formulierung erklärt nicht näher, in welcher Hinsicht der Mann seinem Herzen entspricht.'
    reason: ambiguity
  - marker: c
    text: Mit „sein Volk“ ist Jahwes Volk gemeint.
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Der Ausdruck markiert im Zusammenhang einen scharfen Gegensatz zu Sauls bisheriger Aussicht; „Doch nun“ gibt diese adversative Wendung natürlich wieder.
- source_word: מַמְלַכְתְּךָ
  choice: dein Königtum
  rationale: Gemeint ist hier nicht primär ein Staatsgebiet, sondern Sauls Königsherrschaft samt ihrem Fortbestand. „Königtum“ trifft diesen Sinn genauer als „Königreich“.
- source_word: לֹא תָקוּם
  choice: wird keinen Bestand haben
  rationale: Das Verb bedeutet wörtlich „nicht stehen/Bestand gewinnen“; im Zusammenhang bezeichnet es den ausbleibenden Fortbestand von Sauls Königtum.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: Jahwe hat sich … gesucht
  rationale: 'Das Perfekt stellt die Suche als vollzogen dar, und „sich“ bewahrt den Bezug von לוֹ: Jahwe sucht den Mann für sich beziehungsweise für seine Absicht.'
- source_word: אִישׁ כִּלְבָבוֹ
  choice: einen Mann nach seinem Herzen
  rationale: Die geläufige, zugleich quellennah formulierte Wendung bewahrt das hebräische Bild und legt nicht aus, in welcher konkreten Hinsicht der Mann Jahwes Herzen entspricht.
- source_word: וַיְצַוֵּהוּ יְהוָה לְנָגִיד
  choice: und Jahwe hat ihn zum Herrscher … eingesetzt
  rationale: In Verbindung mit לְנָגִיד bezeichnet צוה hier die Beauftragung beziehungsweise Einsetzung in ein Leitungsamt; „Herrscher“ gibt die Autoritätsstellung wieder, ohne einen späteren technischen Titel einzutragen.
- source_word: עַל עַמּוֹ
  choice: über sein Volk
  rationale: Das Suffix bezieht sich im unmittelbaren Zusammenhang auf Jahwe. Der deutsche Text bewahrt das Pronomen; eine Fußnote klärt dessen Bezug.
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: weil du nicht gehalten hast, was Jahwe dir geboten hat
  rationale: „Gehalten“ bewahrt die Grundbedeutung von שׁמר im Sinn des Beachtens eines Gebots und vermeidet die stärker auslegende Vereinfachung „nicht gehorcht“.
theological_decisions:
- issue: Bezug des Pronomens in כִּלְבָבוֹ
  choice: „nach seinem Herzen“, wobei „seinem“ im Satz am natürlichsten auf Jahwe verweist
  alternative: Das Pronomen auf den gesuchten Mann beziehen oder die Wendung ausdeutend als „der ganz nach Jahwes Willen handelt“ wiedergeben
  rationale: Syntax und Erzählzusammenhang sprechen für Jahwe als Bezugspunkt. Die knappe Bildsprache bleibt jedoch erhalten und wird nicht durch eine spätere theologische Auslegung ersetzt.
- issue: Bedeutung von נָגִיד
  choice: Herrscher
  alternative: Fürst oder Anführer
  rationale: Das Wort bezeichnet hier eine von Jahwe eingesetzte Leitungsperson. „Herrscher“ wahrt die amtliche Autorität, ohne dem Ausdruck eine dynastische oder messianische Spezialbedeutung aufzuerlegen.
- issue: Reichweite des angekündigten Endes
  choice: „dein Königtum wird keinen Bestand haben“
  alternative: „deine gegenwärtige Regierungszeit endet sofort“
  rationale: Der hebräische Wortlaut kündigt an, dass Sauls Königtum nicht dauerhaft bestehen wird; er legt in diesem Satz nicht ausdrücklich fest, dass seine persönliche Herrschaft augenblicklich endet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Königtum“ vermeidet die irreführende Vorstellung eines bloßen Territoriums; „nach seinem Herzen“ bewahrt die prägnante hebräische Bildsprache. Der Gottesname wird entsprechend der Projektvorgabe als „Jahwe“ wiedergegeben.
