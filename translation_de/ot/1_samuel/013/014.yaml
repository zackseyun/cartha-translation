  source_fidelity: 'Der deutsche Text gibt die zentralen Elemente des hebräischen Satzes zuverlässig wieder: die adversative Wendung, den fehlenden Fortbestand von Sauls Königtum, Jahwes Suche nach einem Mann für sich, dessen Einsetzung zum נָגִיד über Jahwes Volk sowie die kausale Begründung durch Sauls Nichtbeachten des göttlichen Gebots. „Königtum“ trifft den hier gemeinten Fortbestand der Königsherrschaft bzw. Dynastie besser als ein territorial verstandenes „Königreich“.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Doch nun“, „wird keinen Bestand haben“ und „zum Herrscher ... eingesetzt“ sind idiomatisch. Die bewusst knappe Wendung „nach seinem Herzen“ bewahrt die Bildlichkeit ohne unnötige Ausdeutung.
  terminology: „Jahwe“ entspricht der vorgegebenen Namenspraxis. „Herrscher“ ist eine angemessene, nicht übertechnisierte Wiedergabe von נָגִיד. „Gehalten hast, was Jahwe dir geboten hat“ bewahrt die Bedeutung von שׁמר im Zusammenhang eines Gebots und ist im Register des Verses passend.
