  text: וַ/יָּ֣קָם שְׁמוּאֵ֗ל וַ/יַּ֛עַל מִן הַ/גִּלְגָּ֖ל גִּבְעַ֣ת בִּנְיָמִ֑ן וַ/יִּפְקֹ֣ד שָׁא֗וּל אֶת הָ/עָם֙ הַ/נִּמְצְאִ֣ים עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: de
  text: 'Da brach Samuel auf und zog von Gilgal hinauf nach Gibea in Benjamin.[a] Saul zählte das Volk, das bei ihm war: etwa sechshundert Mann.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Textzeugen und alte Übersetzungen lesen hier „Geba in Benjamin“ statt „Gibea in Benjamin“. Der vorliegende hebräische Text lautet „Gibea in Benjamin“.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: brach auf
  rationale: Das Qal-Wayyiqtol von קום bedeutet wörtlich „stand auf“, kann im Reisebericht aber natürlich den Aufbruch bezeichnen. „Brach auf“ gibt hier die einsetzende Bewegung idiomatisch wieder.
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: עלה bezeichnet eine Bewegung nach oben beziehungsweise zu einem höher gelegenen Ort. „Hinaufziehen“ bewahrt diese Richtungsangabe in natürlichem erzählendem Deutsch.
- source_word: מִן הַגִּלְגָּל
  choice: von Gilgal
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt der Reise.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: nach Gibea in Benjamin
  rationale: Der masoretisch vokalisierte Text nennt Gibea. „In Benjamin“ macht die geografische Zuordnung im Deutschen natürlich verständlich, ohne einen Besitzsinn zu erzwingen.
- source_word: וַיִּפְקֹד
  choice: zählte
  rationale: פקד kann in militärischem Zusammenhang „mustern“ oder „zählen“ bedeuten. Hier wird die verbliebene Stärke festgestellt; „zählte“ ist klar und eng am Text.
- source_word: הָעָם
  choice: das Volk
  rationale: עם bedeutet grundsätzlich „Volk“ oder „Leute“. Obwohl hier Sauls militärisches Aufgebot gemeint ist, vermeidet „das Volk“ eine stärkere Eingrenzung als im Hebräischen.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: das bei ihm war
  rationale: Der Niphal-Partizip von מצא bezeichnet idiomatisch die bei Saul Anwesenden. Die deutsche Formulierung ist natürlich und lässt offen, ob sie ausdrücklich als die Verbliebenen hervorgehoben werden sollen.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: etwa sechshundert Mann
  rationale: Das Präfix כ־ kennzeichnet eine ungefähre Zahl. איש steht in dieser Zählformel für männliche Personen im militärischen Zusammenhang; die feste deutsche Wendung „sechshundert Mann“ passt daher.
