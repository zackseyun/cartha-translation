translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit „Saul aber“ erhält den erzählerischen Kontrast; „folgte ihm zitternd“ verbindet die Zugehörigkeit zu Sauls Gefolge mit der im Hebräischen ausdrücklich genannten Furcht.
