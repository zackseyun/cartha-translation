base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: de
  text: Und Hebräer überschritten den Jordan ins Land Gad und Gilead.[a] Saul aber war noch in Gilgal, und das ganze Volk zitterte hinter ihm her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israeliten“. Im hebräischen Text steht „Hebräer“, möglicherweise eine in diesem Erzählzusammenhang besonders markierte ethnische Bezeichnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „folgte ihm zitternd“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: Hebräer
  rationale: Die direkte ethnische Bezeichnung des hebräischen Textes bleibt erhalten; eine Deutung als „Israeliten“ würde die mögliche erzählerische Markierung einebnen.
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: überschritten den Jordan
  rationale: Gibt die Bewegung über den Jordan natürlich und präzise wieder.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: in Richtung des Landes Gad und Gilead
  rationale: Im Hebräischen steht keine ausdrückliche Zielpräposition; die Formulierung macht die naheliegende Zielrichtung deutlich, ohne Gad und Gilead unnötig als zwei getrennte Länder darzustellen.
- source_word: עוֹדֶנּוּ בַגִּלְגָּל
  choice: war noch in Gilgal
  rationale: Die Konstruktion bezeichnet Sauls fortdauernden Aufenthalt; bei einer Ortschaft ist „in Gilgal“ im Deutschen natürlich.
- source_word: חָרְדוּ
  choice: zitternd
  rationale: Bewahrt die körperlich anschauliche Furcht des Verbs חרד.
- source_word: אַחֲרָיו
  choice: folgte ihm
  rationale: Im Zusammenhang mit dem bei Saul verbleibenden Volk bezeichnet אחריו am natürlichsten das Folgen beziehungsweise Sich-hinter-ihm-Halten; die räumlichere Wiedergabe bleibt als Fußnotenalternative erhalten.
