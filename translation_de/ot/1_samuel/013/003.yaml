  text: וַ/יַּ֣ךְ יוֹנָתָ֗ן אֵ֣ת נְצִ֤יב פְּלִשְׁתִּים֙ אֲשֶׁ֣ר בְּ/גֶ֔בַע וַֽ/יִּשְׁמְע֖וּ פְּלִשְׁתִּ֑ים וְ/שָׁאוּל֩ תָּקַ֨ע בַּ/שּׁוֹפָ֤ר בְּ/כָל הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר יִשְׁמְע֖וּ הָ/עִבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: de
  text: 'Jonatan schlug den Philisterposten in Geba[a], und die Philister hörten davon. Saul aber blies im ganzen Land das Schofar[b] und rief aus: »Die Hebräer sollen es hören!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Statthalter der Philister«. Das hebräische Wort kann sowohl einen Amtsträger als auch einen stationierten militärischen Posten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Schofar war ein als Signalinstrument verwendetes Tierhorn; traditionell wird es oft als Widderhorn bezeichnet.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: schlug
  rationale: Das Verb נכה bezeichnet hier einen militärischen Schlag. „Schlug“ wahrt die Offenheit, ob der Posten angegriffen, besiegt oder vernichtet wurde.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: Philisterposten
  rationale: נְצִיב kann einen Amtsträger oder einen stationierten militärischen Posten bezeichnen. Im Zusammenhang der Kampfhandlungen ist „Philisterposten“ die naheliegende Lesart, ohne den Ausdruck unnötig auf ein Gebäude oder ausschließlich auf dessen Besatzung festzulegen.
- source_word: בְּגֶבַע
  choice: in Geba
  rationale: Geba ist der Ortsname; „in Geba“ gibt die hebräische Ortsangabe schlicht und idiomatisch wieder.
- source_word: וַיִּשְׁמְעוּ פְלִשְׁתִּים
  choice: und die Philister hörten davon
  rationale: Der hebräische Text sagt wörtlich, dass die Philister „hörten“; „davon“ macht den im Deutschen erforderlichen Rückbezug auf Jonatans Tat deutlich.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: ließ … das Widderhorn blasen
  rationale: שׁוֹפָר bezeichnet ein als Signalinstrument verwendetes Tierhorn, gewöhnlich ein Widderhorn. Die Konstruktion mit „ließ … blasen“ gibt idiomatisch wieder, dass Sauls Signal im ganzen Land verbreitet wurde, statt ein räumlich unmögliches persönliches Blasen an jedem Ort nahezulegen.
- source_word: בְּכָל הָאָרֶץ
  choice: im ganzen Land
  rationale: הָאָרֶץ meint hier das betreffende Land beziehungsweise Gebiet, nicht die gesamte Erde.
- source_word: לֵאמֹר
  choice: und ausrufen
  rationale: Der Infinitiv führt den Inhalt der öffentlichen Bekanntmachung ein. „Ausrufen“ entspricht in diesem Zusammenhang natürlicher deutscher Erzählweise.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: Die Hebräer sollen es hören!
  rationale: Der Imperfekt hat hier auffordernden Sinn. „Die Hebräer“ bewahrt die ausdrückliche Bezeichnung des Quelltexts und ersetzt sie nicht durch „Israeliten“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper militärischer Erzählweise. Die umstrittene Bedeutung von נְצִיב wird nicht verschwiegen; die alternative Personenbezeichnung steht in der Fußnote. Die öffentliche Signalhandlung wird im Deutschen idiomatisch formuliert.
