  text: וְ/כָל יִשְׂרָאֵ֞ל שָׁמְע֣וּ לֵ/אמֹ֗ר הִכָּ֤ה שָׁאוּל֙ אֶת נְצִ֣יב פְּלִשְׁתִּ֔ים וְ/גַם נִבְאַשׁ יִשְׂרָאֵ֖ל בַּ/פְּלִשְׁתִּ֑ים וַ/יִּצָּעֲק֥וּ הָ/עָ֛ם אַחֲרֵ֥י שָׁא֖וּל הַ/גִּלְגָּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: de
  text: 'Und ganz Israel hörte die Nachricht: »Saul hat die Garnison der Philister geschlagen[a], und Israel ist bei den Philistern verhasst geworden[b].« Da wurde das Volk zusammengerufen, um Saul nach Gilgal zu folgen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Statthalter der Philister« beziehungsweise »den Stützpunkt der Philister«. Das hebräische Wort kann einen Amtsträger oder einen militärischen Posten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Israel ist den Philistern zum Gestank geworden«; gemeint ist, dass Israel ihnen verhasst oder widerwärtig geworden ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »Da wurde das Volk hinter Saul her nach Gilgal zusammengerufen.« Gemeint ist wahrscheinlich das militärische Aufgebot unter Sauls Führung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: hörte die Nachricht
  rationale: Die hebräische Berichtsformel wird in natürlichem Deutsch als das Hören einer verbreiteten Nachricht wiedergegeben.
- source_word: הִכָּה
  choice: hat … geschlagen
  rationale: Die Grundbedeutung ‚schlagen‘ bleibt erhalten; im militärischen Zusammenhang bezeichnet sie einen erfolgreichen Angriff, ohne dessen genaues Ausmaß festzulegen.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: den Posten der Philister
  rationale: נְצִיב kann hier einen Amtsträger oder einen stationierten militärischen Posten bezeichnen. ‚Posten‘ wahrt diese Ambiguität besser als das eindeutig kollektive ‚Garnison‘.
- source_word: נִבְאַשׁ
  choice: ist … verhasst geworden
  rationale: Das Verb bedeutet wörtlich, stinkend zu werden, und idiomatisch, Abscheu hervorzurufen. ‚Verhasst geworden‘ vermittelt die feindselige Bewertung in geläufigem Deutsch.
- source_word: בַּפְּלִשְׁתִּים
  choice: bei den Philistern
  rationale: Die Präposition bezeichnet hier die Gruppe, in deren Wahrnehmung Israel verhasst geworden ist.
- source_word: וַיִּצָּעֲקוּ הָעָם
  choice: Da wurde das Volk zusammengerufen
  rationale: Im militärischen Kontext bezeichnet das Verb hier das Aufbieten beziehungsweise Zusammenrufen des Volkes.
- source_word: אַחֲרֵי שָׁאוּל
  choice: um Saul … zu folgen
  rationale: Wörtlich ‚hinter Saul her‘; im Zusammenhang geht es darum, sich unter seiner Führung zu sammeln.
- source_word: הַגִּלְגָּל
  choice: nach Gilgal
  rationale: Die Richtungsendung am Ortsnamen spricht für eine Bewegung nach Gilgal, nicht lediglich für einen Aufenthalt dort.
