base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: de
  text: Saul, sein Sohn Jonatan und die Leute, die sich bei ihnen befanden[a], hielten sich in Geba in Benjamin[b] auf, während die Philister bei Michmas lagerten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die bei ihnen vorgefunden wurden“; gemeint sein können die Leute, die nach der Zerstreuung der anderen noch bei Saul und Jonatan geblieben waren.'
    reason: lexical_alternative
  - marker: b
    text: Im hebräischen Text steht hier Geba, nicht Gibea. Beide Namen sind verwandt, bezeichnen in diesem Zusammenhang aber verschiedene Orte.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: hielten sich … auf
  rationale: Das Partizip von ישׁב bezeichnet hier im militärischen Zusammenhang den Aufenthalt an einem Ort, nicht lediglich das körperliche Sitzen. „Hielten sich … auf“ ist natürliches Deutsch und wahrt den örtlichen Sinn.
- source_word: הַנִּמְצָא עִמָּם
  choice: die sich bei ihnen befanden
  rationale: Das Nifal-Partizip von מצא bedeutet wörtlich „die bei ihnen vorgefunden wurden“. Die gewählte Formulierung klingt im Deutschen natürlich, ohne die im Kontext mögliche Bedeutung „die bei ihnen verblieben waren“ ausdrücklich festzulegen.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: in Geba in Benjamin
  rationale: Der masoretische Text nennt Geba, nicht Gibea. Das zweite „in“ gibt die Zuordnung zum Gebiet beziehungsweise Stamm Benjamin in verständlichem Deutsch wieder.
- source_word: חָנוּ
  choice: lagerten
  rationale: חנה ist der übliche Ausdruck für das Aufschlagen beziehungsweise Beziehen eines Lagers. Das Präteritum entspricht der erzählerischen Darstellung, ohne gegenüber dem ersten Satzteil eine zusätzliche Vorzeitigkeit einzutragen.
- source_word: בְמִכְמָשׂ
  choice: bei Michmas
  rationale: Bei einem militärischen Lager bezeichnet בְּ die Lage am oder nahe dem genannten Ort. „Bei Michmas“ ist dafür idiomatisches Deutsch.
- source_word: וְ
  choice: während
  rationale: Die Konjunktion verbindet die beiden gleichzeitig beziehungsweise kontrastierend dargestellten Standorte. „Während“ macht diese Beziehung natürlich kenntlich, ohne am Versanfang ein im Hebräischen nicht vorhandenes ausdrückliches „nun“ einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Namensformen „Jonatan“ und „Michmas“ folgen geläufigen deutschen Bibelkonventionen. Die hebräische Satzverknüpfung wird ohne ein zusätzliches einleitendes „Nun“ wiedergegeben.
