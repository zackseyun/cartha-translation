  text: וְ/הָ/רֹ֤אשׁ אֶחָד֙ יִפְנֶ֔ה דֶּ֖רֶךְ בֵּ֣ית חֹר֑וֹן וְ/הָ/רֹ֨אשׁ אֶחָ֤ד יִפְנֶה֙ דֶּ֣רֶךְ הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל גֵּ֥י הַצְּבֹעִ֖ים הַ/מִּדְבָּֽרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: de
  text: Und die eine Abteilung[a] wandte sich dem Weg nach Bet-Horon zu, und die andere Abteilung wandte sich dem Weg an der Grenze zu, die über dem Tal Zeboim[b] liegt, in Richtung der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der eine Kopf“; gemeint ist hier wohl eine Abteilung oder ein Trupp.'
    reason: lexical_alternative
  - marker: b
    text: „Zeboim“ ist wahrscheinlich ein Ortsname; das zugrunde liegende Wort könnte mit „Hyänen“ zusammenhängen.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: die eine Abteilung / die andere Abteilung
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet hier im militärischen Zusammenhang jedoch jeweils eine Abteilung der zuvor genannten Plünderungsschar. Die paarige Wiedergabe „die eine … die andere“ entspricht natürlichem Deutsch.
- source_word: יִפְנֶה
  choice: wandte sich … zu
  rationale: פנה bezeichnet das Sichwenden in eine Richtung und beschreibt hier die Bewegung der Truppen.
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: דֶּרֶךְ bezeichnet hier eine konkrete Route; „Weg“ bewahrt zugleich die übliche Bedeutungsbreite des hebräischen Wortes.
- source_word: בֵּית חֹרוֹן
  choice: Bet-Horon
  rationale: Der Ortsname wird nach gängiger deutscher Bibelnamenform transliteriert.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: גְּבוּל bezeichnet eine Grenze oder ein Grenzgebiet. „Grenze“ ist die direkte und topografisch passende Wiedergabe.
- source_word: הַנִּשְׁקָף
  choice: die über … liegt
  rationale: Das Nifal-Partizip von שׁקף beschreibt eine erhöhte Lage mit Blick über ein Gebiet. Die Formulierung ist im Deutschen natürlich und vermeidet die unpassende Vorstellung, die Grenze selbst „blicke“.
- source_word: גֵּי הַצְּבֹעִים
  choice: das Tal Zeboim
  rationale: Die Wortgruppe fungiert wahrscheinlich als Ortsname. „Zeboim“ wird daher transliteriert; ein möglicher Bezug zu Hyänen wird in der Fußnote genannt.
- source_word: הַמִּדְבָּרָה
  choice: in Richtung der Wüste
  rationale: Das direktionale ה bezeichnet eine Bewegung zur Wüste hin. „In Richtung der Wüste“ erhält diese Nuance.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bedeutung von רֹאשׁ wird verständlich wiedergegeben, während die wörtliche Form in der Fußnote erhalten bleibt. Die hebräische Satzreihung und die topografischen Richtungsangaben werden weitgehend bewahrt.
