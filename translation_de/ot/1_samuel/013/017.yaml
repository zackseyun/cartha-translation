  register: Modernes, würdiges Standarddeutsch. Die militärische Situation wird verständlich wiedergegeben, während die beiden auffälligen hebräischen Ausdrücke in Fußnoten offengelegt werden. Die Wendung »in Richtung« bewahrt die doppelte Richtungsangabe des Hebräischen.
