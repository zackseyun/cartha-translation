  text: וַ/יֵּצֵ֧א הַ/מַּשְׁחִ֛ית מִ/מַּחֲנֵ֥ה פְלִשְׁתִּ֖ים שְׁלֹשָׁ֣ה רָאשִׁ֑ים הָ/רֹ֨אשׁ אֶחָ֥ד יִפְנֶ֛ה אֶל דֶּ֥רֶךְ עָפְרָ֖ה אֶל אֶ֥רֶץ שׁוּעָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: de
  text: Und aus dem Lager der Philister zog ein Plünderungstrupp aus, der in drei Abteilungen gegliedert war.[a][b] Eine Abteilung wandte sich dem Weg nach Ofra zu, in Richtung des Landes Schual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Vernichter« oder »die vernichtende Streitmacht«; gemeint ist hier ein Plünderungstrupp aus dem Lager der Philister.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »drei Köpfe« und anschließend »der eine Kopf«; damit sind militärische Abteilungen oder Gruppen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: ein Plünderungstrupp
  rationale: Wörtlich bezeichnet das Wort »den Vernichter« beziehungsweise »die vernichtende Streitmacht«. Im militärischen Zusammenhang ist es kollektiv gebraucht und meint einen Trupp, der zu zerstörerischen Überfällen auszieht.
- source_word: שְׁלֹשָׁה רָאשִׁים / הָרֹאשׁ אֶחָד
  choice: in drei Abteilungen / die eine Abteilung
  rationale: Das hebräische Bild »drei Köpfe« beziehungsweise »der eine Kopf« bezeichnet hier die Gliederung der Streitmacht in einzelne Gruppen. »Abteilungen« gibt das militärische Bild verständlich und im Singular wie im Plural einheitlich wieder.
- source_word: יִפְנֶה
  choice: wandte sich … zu
  rationale: Das Verb bedeutet »sich wenden« oder »sich ausrichten« und beschreibt hier die Richtung, die eine der Abteilungen einschlug.
- source_word: דֶּרֶךְ עָפְרָה
  choice: dem Weg nach Ofra
  rationale: דֶּרֶךְ bezeichnet einen Weg oder eine Straße; die Formulierung gibt eine Route in Richtung des Ortes Ofra an.
- source_word: אֶרֶץ שׁוּעָל
  choice: des Landes Schual
  rationale: אֶרֶץ kann »Land« oder »Gebiet« bedeuten. »Land Schual« bewahrt die regionale Bezeichnung ohne unnötige Präzisierung.
- source_word: פְלִשְׁתִּים
  choice: Philister
  rationale: Im Deutschen gebräuchliche Form des Volksnamens.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Der Ortsname wird nach geläufiger deutscher Transliterationsweise wiedergegeben.
- source_word: שׁוּעָל
  choice: Schual
  rationale: Der Gebietsname wird transliteriert und nicht nach seiner möglichen Wortbedeutung übersetzt.
