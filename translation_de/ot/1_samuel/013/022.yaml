    rationale: הָעָם bezeichnet in diesem Kontext die bei Saul und Jonathan anwesenden Personen, nicht zwingend das gesamte Volk im modernen politischen Sinn. Die Relativsatzkonstruktion ist zudem schwerfälliger als nötig.
  - severity: low
    issue: Die Fußnote bezeichnet eine geglättete deutsche Wiedergabe als „wörtlicher“ und ergänzt „aus dem Heer“.
    rationale: Der hebräische Satz enthält auch die erzählerische Einleitung „und es geschah/so geschah“ und spricht von den Leuten bei Saul und Jonathan, nicht ausdrücklich von einem „Heer“. Die Erklärung sollte diese zusätzliche Einengung vermeiden.
