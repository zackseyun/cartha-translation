  text: וְ/הָיָה֙ בְּ/י֣וֹם מִלְחֶ֔מֶת וְ/לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙ בְּ/יַ֣ד כָּל הָ/עָ֔ם אֲשֶׁ֥ר אֶת שָׁא֖וּל וְ/אֶת יוֹנָתָ֑ן וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: de
  text: Am Tag der Schlacht hatte keiner von den Leuten, die bei Saul und Jonathan waren, ein Schwert oder einen Speer; nur Saul und sein Sohn Jonathan hatten solche Waffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und es geschah am Tag der Schlacht: In der Hand aller Leute, die bei Saul und Jonathan waren, fand sich weder Schwert noch Speer.“ Die hebräische Ausdrucksweise besagt hier, dass niemand unter diesen Leuten eine solche Waffe hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: So
  rationale: Leitet die aus dem vorherigen Zusammenhang folgende Situation ein und bewahrt den erzählerischen Anschluss, ohne die hebräische Wendung unnötig wörtlich nachzubilden.
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: am Tag der Schlacht
  rationale: Gibt die konkrete Zeitangabe mit בְּ, יוֹם und מִלְחֶמֶת natürlich und nah am Hebräischen wieder.
- source_word: לֹא נִמְצָא
  choice: fand sich ... bei keinem
  rationale: Das Nifal von מצא wird als unpersönlich-passive Feststellung wiedergegeben; zusammen mit „bei keinem“ kommt die verneinte Verfügbarkeit im Deutschen klar zum Ausdruck.
- source_word: חֶרֶב וַחֲנִית
  choice: ein Schwert oder ein Speer
  rationale: Obwohl das Hebräische die Waffen mit „und“ verbindet, verlangt die deutsche Negationskonstruktion idiomatisch „weder ... noch“ oder „nicht ... oder“; hier drückt „bei keinem ... ein Schwert oder ein Speer“ aus, dass keine der beiden Waffen vorhanden war.
- source_word: בְּיַד כָּל הָעָם
  choice: bei keinem aus dem ganzen Volk
  rationale: '„In der Hand“ bezeichnet hier Besitz oder Verfügbarkeit. Unter der Verneinung hat כָּל distributive Kraft: Kein Einzelner aus dem gesamten Volk verfügte über diese Waffen.'
- source_word: אֲשֶׁר אֶת שָׁאוּל וְאֶת יוֹנָתָן
  choice: das bei Saul und Jonathan war
  rationale: Die elliptische Konstruktion mit אֵת bezeichnet Begleitung beziehungsweise Zugehörigkeit; „bei ... war“ gibt dies natürlich wieder.
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: nur Saul und sein Sohn Jonathan besaßen solche Waffen
  rationale: Der feminine Singular nimmt die zuvor genannte Waffenausstattung zusammenfassend auf. Die Lamed-Konstruktion bezeichnet Besitz oder Verfügbarkeit; „nur“ bildet den im Satz liegenden Gegensatz ab, und „solche Waffen“ vermeidet eine missverständliche singularische Rückverweisung.
