revisions:
- from: So fand sich am Tag der Schlacht[a] bei keinem aus dem ganzen Volk, das bei Saul und Jonathan war, ein Schwert oder ein Speer; nur Saul und sein Sohn Jonathan besaßen solche Waffen.
  to: Am Tag der Schlacht hatte keiner von den Leuten, die bei Saul und Jonathan waren, ein Schwert oder einen Speer; nur Saul und sein Sohn Jonathan hatten solche Waffen.[a]
  rationale: Die Überarbeitung bewahrt die vollständige Verneinung sowie den Kontrast zu Saul und Jonathan, ersetzt aber das missverständliche „ganzes Volk“ durch die kontextgerechte, natürliche Bezeichnung „Leute“. Die Fußnote erläutert die hebräische Konstruktion ohne die Gruppe als „Heer“ zu interpretieren.
