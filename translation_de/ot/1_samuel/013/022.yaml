  verdict: revise
  source_fidelity: Die Aussage, dass außer Saul und Jonathan niemand aus den bei ihnen befindlichen Leuten Schwert oder Speer hatte, wird zutreffend wiedergegeben. „Volk“ kann jedoch im modernen Deutschen leicht das gesamte Staatsvolk bezeichnen, während הָעָם hier die bei Saul und Jonathan befindliche Gruppe meint.
  naturalness: Der Entwurf ist insgesamt verständlich. „bei keinem aus dem ganzen Volk, das bei Saul und Jonathan war“ wirkt jedoch unnötig schwerfällig und hat einen etwas unklaren Bezug von „das“.
  terminology: „Schwert“, „Speer“, „Saul“ und „Jonathan“ sind angemessen. „Leute, die bei Saul und Jonathan waren“ gibt die elliptische hebräische Zugehörigkeits-/Begleitkonstruktion idiomatisch und ohne zusätzliche Einengung wieder.
