translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von „Bedrängnis/bedrängt“ hält die semantische Dichte des Hebräischen fest. Die seltenen Bezeichnungen für Verstecke werden lesbar übersetzt, ohne ihre lexikalische Unsicherheit zu verschweigen.
