base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: de
  text: Als die Männer Israels sahen, dass sie in Not waren – denn das Volk war hart bedrängt –, versteckten sie sich in Höhlen, im Dornengestrüpp[a], zwischen Felsen, in unterirdischen Kammern[b] und in Gruben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Dornendickicht“. Das hebräische Wort ist selten und bezeichnet wahrscheinlich dorniges Gestrüpp.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Kellern“ beziehungsweise „in Löchern“. Das hebräische Wort ist selten und seine genaue Bedeutung unsicher; vermutlich sind unterirdische Verstecke gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in Zisternen“ beziehungsweise „in Brunnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Das formal singularische אִישׁ steht mit dem Pluralverb רָאוּ kollektiv beziehungsweise distributiv. „Die Männer Israels“ gibt sowohl den kollektiven als auch den männlichen Bezug natürlich wieder.
- source_word: רָאוּ
  choice: sahen
  rationale: Die Grundbedeutung „sehen“ bleibt erhalten; der folgende Satzinhalt erklärt, was sie erkannten.
- source_word: כִּי צַר לוֹ
  choice: dass sie in Bedrängnis waren
  rationale: Die knappe hebräische Konstruktion enthält nach dem Kollektivsubjekt einen Singularbezug. Im Deutschen gibt der Plural den kollektiven Sinn verständlich wieder, ohne die schwierige Syntax zu glätten.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: weil das Volk hart bedrängt wurde
  rationale: Der Niphal von נגשׂ bezeichnet hier, dass das israelitische Volk beziehungsweise Aufgebot stark unter Druck geraten war. Die Wiederholung von „bedrängt“ spiegelt die hebräische Zuspitzung, auch wenn sie im Deutschen auffällig klingt.
- source_word: וַיִּתְחַבְּאוּ
  choice: versteckten sie sich
  rationale: Die reflexive Form wird im Deutschen natürlich durch „sich verstecken“ wiedergegeben.
- source_word: בַּמְּעָרוֹת
  choice: in Höhlen
  rationale: מְעָרָה bezeichnet eindeutig eine Höhle.
- source_word: וּבַחֲוָחִים
  choice: im Dornengestrüpp
  rationale: Das seltene Wort wird wahrscheinlich auf dorniges Gestrüpp oder Dickicht bezogen. „Dornengestrüpp“ gibt diese wahrscheinliche konkrete Bedeutung wieder.
- source_word: וּבַסְּלָעִים
  choice: zwischen Felsen
  rationale: סֶלַע kann Fels, Felsblock oder Felsklippe bezeichnen. In einer Reihe von Verstecken ist „zwischen Felsen“ natürlich und topografisch nicht unnötig eng.
- source_word: וּבַצְּרִחִים
  choice: in unterirdischen Kammern
  rationale: Das seltene und unsichere Wort wird häufig als unterirdischer Raum, Gewölbe, Keller oder Loch verstanden. „Unterirdische Kammern“ bezeichnet einen plausiblen Versteckort und wahrt durch eine Fußnote die Unsicherheit.
- source_word: וּבַבֹּרוֹת
  choice: in Gruben
  rationale: בּוֹר kann Grube, Zisterne oder Brunnen bezeichnen. „Gruben“ ist im Kontext die offenste Wiedergabe; „Zisternen“ bleibt als Alternative in der Fußnote erhalten.
