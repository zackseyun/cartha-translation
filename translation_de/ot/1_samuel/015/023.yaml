source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: de
  text: Denn Auflehnung ist wie die Sünde der Wahrsagerei[a], und Eigensinn wie Unrecht und Hausgötzen[b]. Weil du das Wort Jahwes verworfen hast, hat er auch dich als König verworfen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sünde der Divination“ oder „die Sünde der Wahrsagekunst“. Das hebräische Wort קֶסֶם bezeichnet den Versuch, auf verbotenen Wegen verborgenes Wissen zu erlangen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch תְּרָפִים (Terafim): kultische Bilder oder Götzen, die oft in Häusern aufbewahrt wurden.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „hat er dich vom Königsein ausgeschlossen“ oder „hat er dich als König zurückgewiesen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Samuels vorausgehenden Tadel ein; das spätere יַעַן wird deutlicher mit „weil“ wiedergegeben.
- source_word: חַטַּאת קֶסֶם
  choice: die Sünde der Wahrsagerei
  rationale: Gibt die Constructusverbindung formal und verständlich wieder. „Wahrsagerei“ bezeichnet hier verbotene Divination, ohne den Ausdruck auf moderne Vorstellungen von Hexerei zu verengen.
- source_word: מֶרִי
  choice: Auflehnung
  rationale: Bezeichnet bewussten Widerstand gegen eine Autorität, hier Sauls Weigerung, Jahwes Weisung zu gehorchen.
- source_word: וְאָוֶן
  choice: Unrecht
  rationale: Bewahrt die moralische Bedeutung des mehrdeutigen Wortes in der Verbindung mit den Terafim, ohne es unnötig zu präzisieren.
- source_word: וּתְרָפִים
  choice: Hausgötzen
  rationale: Die Terafim waren kultische Bilder, die häufig im häuslichen Bereich verwendet wurden. „Hausgötzen“ vermittelt den Sinn unmittelbar; der Fachbegriff steht in der Fußnote.
- source_word: הַפְצַר
  choice: Eigensinn
  rationale: Erfasst das hartnäckige, selbstwillige Beharren und unterscheidet es sprachlich von der offeneren „Auflehnung“ im ersten Halbvers.
- source_word: יַעַן
  choice: Weil
  rationale: Kennzeichnet ausdrücklich den Grund für das über Saul ausgesprochene Urteil.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: du das Wort Jahwes verworfen hast
  rationale: „Verwerfen“ gibt מָאַס wieder und ermöglicht es, die rhetorische Wiederholung desselben Verbs im folgenden Satz zu bewahren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: hat er auch dich als König verworfen
  rationale: Bewahrt die Wiederholung von מָאַס und gibt den Entzug beziehungsweise die Zurückweisung des Königtums in natürlichem Deutsch wieder.
theological_decisions:
- issue: Vergleichsstruktur im ersten Satz
  choice: Auflehnung wird mit der Sünde der Wahrsagerei und Eigensinn mit Unrecht und Hausgötzen verglichen.
  alternative: Auflehnung ist die Sünde der Wahrsagerei, und Eigensinn ist Unrecht und Terafimdienst.
  rationale: Im Hebräischen fehlt ein ausdrückliches Wort für „wie“, doch der parallele, spruchartige Aufbau legt eine vergleichende Gleichsetzung nahe. Die Wiedergabe mit „wie“ macht diese Funktion im Deutschen verständlich, ohne die scharfe moralische Gleichstellung abzuschwächen.
- issue: Bedeutung von מִמֶּלֶךְ beim Urteil über Saul
  choice: als König verworfen
  alternative: vom Königsein ausgeschlossen / aus dem Königtum verworfen
  rationale: Die Präposition מן kann die Entfernung aus dem Königsamt ausdrücken. Die gewählte Formulierung ist idiomatisches Deutsch und lässt offen, wie und wann sich die Verwerfung geschichtlich vollzieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und die Wiederholung von „verwerfen“ bewahren die rhetorische Schärfe des hebräischen Textes; Fachbegriffe werden nur in den Fußnoten genannt.
