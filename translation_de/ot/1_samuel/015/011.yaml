source:
  edition: WLC
  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: de
  text: „Ich bedaure, dass ich Saul zum König gemacht habe[a], denn er hat sich davon abgewandt, mir zu folgen[b], und meine Worte nicht ausgeführt[c].“ Da entbrannte Samuel in Zorn[d], und er schrie die ganze Nacht zu Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es reut mich“ oder „Es tut mir leid“. Das Hebräische bringt Jahwes Bedauern und Schmerz über Sauls Königtum zum Ausdruck.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er ist davon umgekehrt, hinter mir her zu sein“; gemeint ist die Abkehr davon, Jahwe zu folgen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „meine Worte nicht erfüllt“ beziehungsweise „meinen Worten nicht gehorcht“.'
    reason: lexical_alternative
  - marker: d
    text: Hebräische Redewendung für aufflammenden Zorn. Im Zusammenhang kann auch tiefe Betrübnis oder heftige innere Erregung mitschwingen.
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: Ich bedaure
  rationale: Das Nifal von נחם bezeichnet hier Gottes echtes Bedauern und seinen Schmerz über Sauls Königtum. „Ich bedaure“ bewahrt diese Aussage, ohne moralische Schuld oder einen Irrtum Gottes anzudeuten.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: dass ich Saul zum König gemacht habe
  rationale: Die Hifil-Form von מלך bezeichnet, dass Saul als König eingesetzt wurde. Die gewählte Formulierung ist im Deutschen natürlich und bleibt nahe am Bild des hebräischen Textes.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier den Grund für Gottes Bedauern ein. „Denn“ verbindet die Aussagen in einem würdigen, natürlichen Erzählregister.
- source_word: שָׁב מֵאַחֲרַי
  choice: er hat sich davon abgewandt, mir zu folgen
  rationale: Die Wendung bedeutet wörtlich, dass Saul sich vom Hinter-Jahwe-Hergehen abgewandt hat. Die Übersetzung bewahrt sowohl die Abkehr als auch das Motiv des Folgens.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: und meine Worte nicht ausgeführt
  rationale: הקים bedeutet bei „Worten“, sie durch entsprechendes Handeln zu verwirklichen beziehungsweise auszuführen. Dies ist konkreter als das stärker deutende „nicht gehorcht“.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: Da entbrannte Samuel in Zorn
  rationale: Die hebräische Wendung bezeichnet lexikalisch aufflammenden oder brennenden Zorn. Die bildhafte Kraft bleibt erhalten; die kontextuell mögliche Nuance tiefen Schmerzes wird in einer Fußnote genannt.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: er schrie ... zu Jahwe
  rationale: זעק bezeichnet einen eindringlichen Ruf aus Not oder starker innerer Bewegung. „Schrie ... zu“ gibt diese Intensität wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל־הַלַּיְלָה
  choice: die ganze Nacht
  rationale: Die Formulierung gibt die vollständige Dauer idiomatisch und genau wieder.
theological_decisions:
- issue: Gottes נִחַמְתִּי in Bezug auf Sauls Königtum
  choice: Ich bedaure
  alternative: Es reut mich; es tut mir leid; ich habe es mir anders überlegt
  rationale: Die Wiedergabe lässt Gottes Bedauern und Schmerz als echte Aussage stehen, ohne die Spannung durch eine dogmatische Erklärung aufzulösen oder Gott moralisches Fehlverhalten zuzuschreiben.
- issue: Samuels Reaktion in וַיִּחַר לִשְׁמוּאֵל
  choice: Da entbrannte Samuel in Zorn
  alternative: Samuel war tief betrübt; Samuel war sehr aufgebracht
  rationale: Der gewöhnliche lexikalische Sinn der Wendung weist auf Zorn. Weil der Zusammenhang zugleich tiefen Schmerz nahelegen kann, wird diese Deutungsmöglichkeit nicht in den Haupttext eingetragen, sondern in der Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist klar markiert; die anschaulichen hebräischen Wendungen zu Nachfolge, Ausführung der Worte und brennendem Zorn bleiben soweit natürlich möglich erhalten.
