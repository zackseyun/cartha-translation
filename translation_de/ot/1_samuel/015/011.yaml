  source_fidelity: 'Die Übersetzung gibt die hebräischen Aussagen zuverlässig wieder: נִחַמְתִּי als göttliches Bedauern, Sauls Abkehr vom Folgen Jahwes, das Nichtausführen der Worte, Samuels aufflammenden Zorn sowie sein anhaltendes Rufen zu Jahwe. Die kausale Verbindung durch „denn“ und die Dauerangabe „die ganze Nacht“ entsprechen dem Ausgangstext.'
