  text: וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל שְׁמוּאֵל֙ חָטָ֔אתִי כִּֽי עָבַ֥רְתִּי אֶת פִּֽי יְהוָ֖ה וְ/אֶת דְּבָרֶ֑י/ךָ כִּ֤י יָרֵ֨אתִי֙ אֶת הָ/עָ֔ם וָ/אֶשְׁמַ֖ע בְּ/קוֹלָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: de
  text: 'Da sagte Saul zu Samuel: „Ich habe gesündigt; denn ich habe den Befehl Jahwes[a] und deine Worte übertreten. Ich fürchtete nämlich das Volk und hörte auf seine Stimme[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Mund Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und gehorchte ihnen“; wörtlich: „und hörte auf ihre Stimme“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Ich habe gesündigt
  rationale: Das hebräische Perfekt bezeichnet hier eine vollendete Tat, die Saul nun bekennt; das deutsche Perfekt gibt dieses persönliche Schuldbekenntnis natürlich wieder.
- source_word: עָבַרְתִּי
  choice: ich habe … übertreten
  rationale: Das Verb bedeutet wörtlich, eine Grenze zu überschreiten, und bezeichnet hier die Verletzung einer göttlichen Weisung. „Übertreten“ bewahrt den moralisch-rechtlichen Gehalt.
- source_word: פִּי יְהוָה
  choice: den Befehl Jahwes
  rationale: Wörtlich steht „den Mund Jahwes“. Im Zusammenhang ist damit die von Jahwe ausgesprochene Anweisung gemeint; „Befehl“ gibt den idiomatischen Sinn verständlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דְּבָרֶיךָ
  choice: deine Worte
  rationale: Die Pluralform wird bewahrt und bezeichnet Samuels ausgesprochene Weisungen.
- source_word: יָרֵאתִי אֶת הָעָם
  choice: Ich fürchtete nämlich das Volk
  rationale: „Fürchtete“ wahrt die Bedeutung und das moralische Gewicht von Sauls Erklärung; „Volk“ hält den weiteren Bezug des hebräischen Nomens fest.
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: und hörte auf seine Stimme
  rationale: Die hebräische Wendung wird eng nachgebildet. Sie bedeutet im Kontext auch, dem Volk zu gehorchen, und bewahrt den Gegensatz zwischen Gottes Stimme und der Stimme des Volkes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext verwendet den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt diese Funktion, statt einen Titel einzusetzen.
- issue: Idiom פִּי יְהוָה
  choice: den Befehl Jahwes
  alternative: den Mund Jahwes / das Wort Jahwes
  rationale: Die wörtliche Form wäre im Deutschen missverständlich. Im Erzählzusammenhang geht es um eine konkrete göttliche Anweisung, doch die wörtliche Bildsprache wird in einer Fußnote dokumentiert.
- issue: Bedeutung von שׁמע בקול
  choice: auf seine Stimme hören
  alternative: ihm gehorchen
  rationale: 'Die bildhafte Form wahrt die sprachliche und theologische Spannung: Saul hörte auf das Volk statt auf Jahwe. Die Gehorsamsbedeutung wird in der Fußnote genannt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Begründung mit כִּי wird zur Vermeidung schwerfälliger Wiederholung zunächst mit „denn“, dann mit „nämlich“ wiedergegeben. Das kollektiv-singularische „Volk“ wird im Deutschen mit „seine Stimme“ aufgenommen; die hebräische Pluralreferenz „ihre Stimme“ bleibt in der Fußnote sichtbar.
