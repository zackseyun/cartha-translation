source:
  edition: WLC
  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: de
  text: Warum hast du denn nicht auf die Stimme Jahwes gehört, sondern dich auf die Beute gestürzt[a] und getan, was in den Augen Jahwes böse war?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich gierig auf die Beute gestürzt“; das seltene hebräische Verb bezeichnet eine schnelle, zugreifende Bewegung auf die Kriegsbeute zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Warum ... denn
  rationale: Das Fragewort leitet Samuels vorwurfsvollen Rückbezug ein. „Denn“ gibt die verbindende und folgernde Wirkung des vorangestellten וְ im natürlichen Deutschen wieder.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: auf die Stimme ... gehört
  rationale: שׁמע mit בְּקוֹל bezeichnet hier nicht bloßes Hören, sondern das Befolgen eines erteilten Befehls. Die deutsche Wendung „auf die Stimme hören“ bewahrt das hebräische Bild und schließt Gehorsam ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַתַּעַט אֶל
  choice: dich auf ... gestürzt
  rationale: Das seltene Verb bezeichnet eine schnelle, begierige Bewegung auf etwas zu. „Sich auf etwas stürzen“ gibt die Anschaulichkeit und den tadelnden Unterton idiomatisch wieder, ohne die Gier ausdrücklich in den Haupttext einzutragen.
- source_word: הַשָּׁלָל
  choice: die Beute
  rationale: „Beute“ ist im Deutschen die natürliche militärische Bezeichnung für erbeutete Güter und passt zum Erzählzusammenhang.
- source_word: וַתַּעַשׂ הָרַע
  choice: getan, was ... böse war
  rationale: Die Formulierung gibt die hebräische Wendung idiomatisch wieder und berücksichtigt den bestimmten Artikel bei הָרַע, ohne das Deutsche mit „das Böse tun“ unnötig zu verallgemeinern.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die transparente Wiedergabe bewahrt das hebräische Bild für Jahwes sittliche Beurteilung und ist im modernen Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet unmittelbar das Tetragramm. „Jahwe“ bewahrt den offenbarten persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorwurfsvolle Frage bleibt knapp und anschaulich; „auf die Stimme hören“ bewahrt zugleich das konkrete hebräische Sprachbild und dessen Bedeutung „gehorchen“.
