  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: de
  text: 'Da sagte Saul zu den Kenitern[a]: »Geht, zieht euch zurück! Steigt hinab aus der Mitte der Amalekiter, damit ich euch nicht zusammen mit ihnen wegraffe.[b] Denn ihr habt allen Israeliten Güte erwiesen, als sie aus Ägypten heraufzogen.« Da zogen sich die Keniter aus der Mitte der Amalekiter zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »zu dem Keniter«; der Singular bezeichnet hier kollektiv die Keniter als Gruppe.'
    reason: Formaler Singular und sachlicher Gruppenbezug unterscheiden sich.
  - marker: b
    text: 'Oder: »damit ich euch nicht zusammen mit ihnen vernichte«; das hebräische Verb kann hier das Hinwegnehmen im Gericht bezeichnen.'
    reason: Die kontextuelle Gerichtsbedeutung des Verbs lässt mehrere nahe deutsche Wiedergaben zu.
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: die Keniter
  rationale: Der hebräische singularische Volksname ist kollektiv gebraucht. Im Deutschen macht der Plural die Anredeformen לְכוּ, סֻּרוּ und רְדוּ sowie den gemeinten Personenkreis klar und natürlich.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: Geht, zieht euch zurück! Geht fort
  rationale: Die drei Imperative werden als nachdrückliche Bewegungsaufforderung wiedergegeben. »Zieht euch zurück« bewahrt den Sinn von סור; »geht fort« vermittelt ירד im Kontext natürlicher als ein möglicherweise missverständliches topografisches »steigt hinab«.
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: aus der Mitte der Amalekiter
  rationale: Die Wendung bezeichnet das Verlassen des amalekitischen Personenverbands. Die einheitliche Wiedergabe ist im Deutschen klar und bewahrt das Motiv der Absonderung.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: damit ich euch nicht zusammen mit ihnen wegraffe
  rationale: אסף kann im Gerichtszusammenhang das Beseitigen beziehungsweise Hinwegraffen bezeichnen. Die Formulierung wahrt das drastische Bild und den Bezug auf das gemeinsame Geschick.
- source_word: חֶסֶד
  choice: Güte
  rationale: Hier bezeichnet חֶסֶד eine wohlwollende, loyale Tat gegenüber Israel. »Güte« ist würdig und breit genug, ohne einen formellen Bund der Keniter mit Israel vorauszusetzen.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: allen Israeliten
  rationale: »Söhne Israels« ist eine feste nationale Bezeichnung für das Volk. »Israeliten« gibt ihre referenzielle Bedeutung in modernem Deutsch natürlich und vollständig wieder.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: als sie aus Ägypten heraufzogen
  rationale: »Heraufziehen« bewahrt das konkrete Bewegungsverb עלה und entspricht dem biblischen Sprachgebrauch für den Auszug aus Ägypten.
- source_word: וַיָּסַר
  choice: Da zogen sich ... zurück
  rationale: Die Wiederaufnahme desselben Verbs wie im Befehl zeigt unmittelbar, dass die Keniter Sauls Aufforderung befolgten.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד
  choice: Güte
  alternative: Bundestreue; Loyalität; Freundlichkeit
  rationale: Der Text hebt eine historisch erwiesene wohlwollende Loyalität hervor, sagt aber nicht ausdrücklich, dass die Keniter in einem formellen Bund mit Israel standen. »Güte« lässt die relationale Tiefe bestehen, ohne sie dogmatisch festzulegen.
- issue: Kollektiver Singular des Volksnamens קֵינִי
  choice: Plural »die Keniter«
  alternative: Singular »der Keniter«
  rationale: Der Singular kann formal bewahrt werden, doch die pluralischen Imperative zeigen, dass eine Gruppe angesprochen ist. Der deutsche Plural gibt den tatsächlichen Bezug eindeutig wieder, ohne die Aussage theologisch zu verändern.
- issue: Gerichtsbedeutung von אסף
  choice: wegraffen
  alternative: vernichten; hinwegnehmen; einsammeln
  rationale: Die Warnung betrifft das mögliche gemeinsame Ergehen mit den Amalekitern. »Wegraffen« wahrt die Gerichtsschärfe, ohne über die konkrete Art des Todes hinauszugehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich. Kollektive Bezeichnungen und Pronomen sind im Deutschen konsequent pluralisch gefasst.
