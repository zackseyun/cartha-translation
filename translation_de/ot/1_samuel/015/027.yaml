base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/027.yaml
  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: de
  text: Als Samuel sich wandte, um wegzugehen, packte Saul den Rand von Samuels Obergewand[a], und der Rand riss ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „den Zipfel“ oder „den Saum“. Das hebräische Wort bezeichnet den äußersten Teil eines Kleidungsstücks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: sich wandte
  rationale: סבב bezeichnet hier Samuels Wendung in der Absicht wegzugehen. „Sich wandte“ ist knapp, natürlich und wird durch „zum Gehen“ näher bestimmt.
- source_word: לָלֶכֶת
  choice: zum Gehen
  rationale: Der Infinitiv von הלך bezeichnet nach dem Verb des Sichwendens die beabsichtigte Bewegung. „Zum Gehen“ bewahrt diese Konstruktion, ohne stärker als der Ausgangstext „fortzugehen“ oder „aufzubrechen“ festzulegen.
- source_word: וַיַּחֲזֵק
  choice: packte
  rationale: Das Hifil von חזק mit ב kann ein festes Ergreifen oder Festhalten ausdrücken. „Packte“ vermittelt die plötzliche, kräftige Handlung in natürlichem Deutsch.
- source_word: בִּכְנַף
  choice: den Rand
  rationale: כָּנָף bedeutet wörtlich „Flügel“ und bei einem Kleidungsstück dessen äußersten Teil, etwa Rand, Zipfel oder Saum. „Rand“ ist verständlich und lässt die genaue Form offen; Alternativen werden in der Fußnote genannt.
- source_word: מְעִילוֹ
  choice: von Samuels Obergewand
  rationale: מְעִיל bezeichnet ein äußeres Gewand. „Obergewand“ ist präzise und in heutigem Deutsch verständlich. Der Name Samuel verdeutlicht den im Kontext gemeinten Besitzer, da ein bloßes „seines“ im Deutschen leicht fälschlich auf Saul bezogen würde.
- source_word: וַיִּקָּרַע
  choice: und er riss ab
  rationale: Das Nifal von קרע beschreibt intransitiv beziehungsweise passiv das Zerreißen. Das Pronomen „er“ bezieht sich im Deutschen auf den Rand; „riss ab“ gibt in diesem Zusammenhang die Folge des kräftigen Packens idiomatisch wieder.
theological_decisions:
- issue: Nicht ausdrücklich genannter Handelnder bei וַיַּחֲזֵק
  choice: Saul wird als Handelnder genannt.
  alternative: „er packte“
  rationale: Im hebräischen Satz ist der Handelnde nur durch die Verbform ausgedrückt; aus dem Erzählzusammenhang ist Saul gemeint. Ein deutsches „er“ würde wegen des unmittelbar zuvor genannten Samuel sehr wahrscheinlich Samuel als Handelnden erscheinen lassen. Die ausdrückliche Nennung Sauls macht die kontextuelle Referenz klar, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Erzählregister. Wiederholung des Namens Samuel vermeidet eine irreführende deutsche Pronomenzuordnung; die knappe Satzbewegung des Hebräischen bleibt erhalten.
