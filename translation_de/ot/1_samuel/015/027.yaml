- from: Als Samuel sich zum Gehen wandte, packte Saul den Rand von Samuels Obergewand[a], und er riss ab.
  to: Als Samuel sich wandte, um wegzugehen, packte Saul den Rand von Samuels Obergewand[a], und der Rand riss ein.
  rationale: Die Revision beseitigt die nicht vom hebräischen Text gedeckte Implikation, dass der Gewandrand vollständig abgerissen sei. Sie formuliert zugleich Samuels beabsichtigtes Weggehen idiomatischer und erhält die kontextuell notwendige eindeutige Zuordnung von Saul als Handelndem sowie die lexikalische Offenheit von כָּנָף.
