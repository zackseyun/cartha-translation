  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל הֶ֚רֶף וְ/אַגִּ֣ידָה לְּ/ךָ֔ אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֵלַ֖/י הַ/לָּ֑יְלָה ו/יאמרו ל֖/וֹ דַּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: de
  text: 'Da sagte Samuel zu Saul[a]: »Hör auf! Ich will dir sagen, was Jahwe in der vergangenen Nacht zu mir geredet hat.« Saul antwortete ihm: »Rede!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schreibform lautet am Ende des Verses wörtlich: »Und sie sagten zu ihm.« Der Zusammenhang weist jedoch auf Saul als einzelnen Sprecher; daher steht im Text der Singular.'
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: Hör auf!
  rationale: Der Imperativ von רפה ist hier eine scharfe Aufforderung, mit dem Reden aufzuhören beziehungsweise abzulassen. »Hör auf!« gibt Ton und Kürze natürlich wieder.
- source_word: וְאַגִּידָה לְּךָ
  choice: Ich will dir sagen
  rationale: Der Hifil von נגד bedeutet hier »mitteilen/sagen«. Nach dem Imperativ drückt »Ich will dir sagen« Samuels unmittelbar angekündigte Mitteilung würdig und idiomatisch aus.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: was ... geredet hat
  rationale: Die Konstruktion führt den Inhalt der göttlichen Rede ein. »Was ... geredet hat« bleibt dem Verb דבר nahe und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַלָּיְלָה
  choice: in der vergangenen Nacht
  rationale: Zusammen mit der abgeschlossenen Redehandlung bezeichnet der Ausdruck die unmittelbar zuvor vergangene Nacht; die Formulierung ist eindeutig und im modernen Deutsch natürlich.
- source_word: ויאמרו לוֹ
  choice: Saul antwortete ihm
  rationale: Die überlieferte Schreibform ist pluralisch, doch Kontext und erwarteter Sinn verlangen Saul als einzelnen Sprecher. Die explizite Nennung beseitigt im Deutschen eine sonst mögliche Pronomen-Unklarheit; die textliche Auffälligkeit wird in der Fußnote bewahrt.
- source_word: דַּבֵּר
  choice: Rede!
  rationale: Der knappe Imperativ wird ebenso knapp und direkt wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Die Transliteration bewahrt den persönlichen Gottesnamen des hebräischen Textes, ohne ihn durch einen Titel zu ersetzen.
- issue: Numerus des abschließenden Redeeinleiters
  choice: 'Singular: Saul antwortete ihm'
  alternative: 'Plural entsprechend der Schreibform: Sie sagten zu ihm'
  rationale: Der unmittelbare Gesprächszusammenhang kennt Saul als Samuels einzelnen Gesprächspartner. Die sinnentsprechende Singularlesung wird im Text verwendet, während die pluralische Schreibform transparent in der Fußnote dokumentiert bleibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, direktem Dialog. Samuels scharfer Ton und die Kürze von Sauls Antwort bleiben erhalten. Der Wechsel von »sagte« zu »geredet hat« bildet die unterschiedlichen hebräischen Verben angemessen ab.
