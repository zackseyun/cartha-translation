revisions:
- from: Auch die Herrlichkeit Israels[a] wird nicht lügen und nicht nachgeben; denn er ist kein Mensch, dass er nachgeben müsste.[b]
  to: Auch der Ruhm Israels[a] wird nicht lügen und seine Entscheidung nicht ändern[b]; denn er ist kein Mensch, der seine Entscheidung ändert.
  rationale: Die Revision beseitigt den Genuskonflikt beim göttlichen Titel, ersetzt die semantisch ungenaue Formulierung »nachgeben« durch eine kontextgerechte Wiedergabe des wiederholten נחם und entfernt die nicht im Ausgangstext ausgedrückte Modalität. Die Fußnoten bleiben als lexikalische Alternativen erhalten und sind nun an der betreffenden Wendung verankert.
