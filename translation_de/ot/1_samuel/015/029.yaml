  text: וְ/גַם֙ נֵ֣צַח יִשְׂרָאֵ֔ל לֹ֥א יְשַׁקֵּ֖ר וְ/לֹ֣א יִנָּחֵ֑ם כִּ֣י לֹ֥א אָדָ֛ם ה֖וּא לְ/הִנָּחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: de
  text: Auch der Ruhm Israels[a] wird nicht lügen und seine Entscheidung nicht ändern[b]; denn er ist kein Mensch, der seine Entscheidung ändert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Herrlichkeit Israels«, »der Ewige Israels«, »die Stärke Israels« oder »der Sieg Israels«. Der hebräische Titel hat ein breites Bedeutungsspektrum.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wird nicht nachlassen«, »wird seine Meinung nicht ändern« oder »wird es nicht bereuen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Setzt Samuels Aussage als zusätzliche, nachdrückliche Bekräftigung des vorausgehenden Urteils fort; im Deutschen ist „Auch“ hier knapp und natürlich.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: die Herrlichkeit Israels
  rationale: Bewahrt den erhabenen Charakter des Gottesnamens, ohne den breiten Bedeutungsumfang von נֵצַח vorschnell auf Ewigkeit, Stärke oder Sieg festzulegen.
- source_word: יְשַׁקֵּר
  choice: wird nicht lügen
  rationale: Gibt das Piel von שׁקר direkt wieder und betont Gottes Wahrhaftigkeit im Gegensatz zu menschlicher Unzuverlässigkeit.
- source_word: וְלֹא יִנָּחֵם
  choice: und nicht nachgeben
  rationale: נחם im Nifal kann Bedauern, Sinnesänderung oder ein Abgehen von einer angekündigten Handlung bezeichnen. „Nachgeben“ passt zum unwiderruflichen Urteil über Saul, ohne die Mehrdeutigkeit vollständig aufzulösen.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung der vorausgehenden Aussage idiomatisch und würdig ein.
- source_word: לֹא אָדָם הוּא
  choice: er ist kein Mensch
  rationale: 'Gibt den singularischen Vergleich unmittelbar wieder: Gott ist hinsichtlich Unwahrhaftigkeit und Wankelmut nicht wie ein Mensch.'
- source_word: לְהִנָּחֵם
  choice: dass er nachgeben müsste
  rationale: Die Konstruktion wird im Deutschen als Folgesatz wiedergegeben; die Wiederholung von „nachgeben“ wahrt die lexikalische Entsprechung zu יִנָּחֵם.
theological_decisions:
- issue: Aussage über Gottes Beständigkeit angesichts der unterschiedlichen Bedeutungen von נחם
  choice: „wird nicht … nachgeben“ im konkreten Zusammenhang des Urteils über Saul
  alternative: „wird seine Meinung nicht ändern“ oder „wird es nicht bereuen“
  rationale: Die Formulierung betont, dass Gott sein ausgesprochenes Urteil nicht zurücknimmt, ohne daraus eine umfassendere philosophische Behauptung abzuleiten oder die Spannung zu anderen biblischen Verwendungen von נחם aufzulösen.
- issue: Deutung des Gottestitels נֵצַח יִשְׂרָאֵל
  choice: „die Herrlichkeit Israels“
  alternative: „der Ewige Israels“, „die Stärke Israels“ oder „der Sieg Israels“
  rationale: Der Haupttext benötigt eine verständliche, würdevolle Wiedergabe; eine Fußnote hält den tatsächlich breiten und umstrittenen Bedeutungsumfang des hebräischen Titels offen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Der göttliche Titel bleibt gehoben; die Syntax ist bewusst knapp. Beide Fußnotenmarker stehen im Haupttext unmittelbar bei den erklärungsbedürftigen Wendungen.
