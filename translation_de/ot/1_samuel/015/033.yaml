base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: de
  text: 'Samuel sagte: „Wie dein Schwert Frauen kinderlos gemacht hat, so wird deine Mutter unter den Frauen kinderlos sein.“[a] Dann zerhieb Samuel Agag in Gilgal vor Yahweh in Stücke.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wie dein Schwert Frauen ihrer Kinder beraubt hat, so wird auch deine Mutter unter den Frauen ihrer Kinder beraubt sein.“ Im Hebräischen steht in beiden Satzteilen dasselbe Verb; dadurch wird die entsprechende Vergeltung betont.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „zerstückelte Agag“ oder „hieb Agag in Stücke“. Das hebräische Verb ist selten und bezeichnet ein gewaltsames Zerteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל (שׁכל)
  choice: kinderlos gemacht hat / kinderlos sein
  rationale: Das Verb bezeichnet hier den Verlust von Kindern. Die wiederholte Wiedergabe mit „kinderlos“ bewahrt die sprachliche Entsprechung zwischen Agags Taten und der Vergeltung an ihm.
- source_word: חַרְבֶּךָ
  choice: dein Schwert
  rationale: Die wörtliche und im Deutschen natürliche Wiedergabe lässt das Schwert als Bezeichnung für Agags Gewalttaten stehen.
- source_word: מִנָּשִׁים
  choice: unter den Frauen
  rationale: In dieser vergleichenden Wendung gibt „unter den Frauen“ die Präposition מן idiomatisch wieder.
- source_word: וַיְשַׁסֵּף
  choice: zerhieb … in Stücke
  rationale: Das seltene, starke Verb bezeichnet ein Zerteilen oder Zerhauen. „Zerhieb … in Stücke“ wahrt die Härte des Ausdrucks, ohne zusätzliche Einzelheiten einzutragen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: „Vor“ ist die knappe, natürliche Wiedergabe von לִפְנֵי in diesem Zusammenhang; der Gottesname wird als „Yahweh“ wiedergegeben.
- source_word: בַּגִּלְגָּל
  choice: in Gilgal
  rationale: „In Gilgal“ ist im modernen Standarddeutsch die natürliche Ortsangabe.
theological_decisions:
- issue: Die gewaltsame Hinrichtung weder abschwächen noch sensationsheischend ausmalen
  choice: Samuel wird ausdrücklich als Handelnder genannt; Agag wird „in Stücke“ zerhieben.
  alternative: Samuel tötete Agag / Samuel hieb Agag nieder
  rationale: Der hebräische Text schreibt Samuel die Handlung unmittelbar zu und gebraucht ein starkes Verb. Eine bloße Wiedergabe mit „töten“ würde dessen Aussagekraft abschwächen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname im Ausgangstext wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „kinderlos“ bildet die hebräische Wiederaufnahme desselben Verbs ab. Die Gewaltdarstellung bleibt deutlich, wird aber nicht über den Wortlaut hinaus ausgeschmückt.
