base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: de
  text: 'Und Jahwe sandte dich mit einem Auftrag aus und sagte: »Geh, weihe die Sünder, Amalek, dem Bann[a] und kämpfe gegen Amalek, bis du sie vollständig vernichtet hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vernichte die Sünder, Amalek, vollständig«. Das hebräische Verb bezeichnet, jemanden oder etwas dem Bann zu weihen, was hier Vernichtung einschließt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ בְּדָרֶךְ
  choice: sandte dich auf einen Auftrag
  rationale: שלח bedeutet hier „senden“; בְּדָרֶךְ bezeichnet in diesem Zusammenhang nicht bloß einen Reiseweg, sondern den aufgetragenen Weg beziehungsweise Auftrag.
- source_word: וְהַחֲרַמְתָּה
  choice: vollstrecke … den Bann
  rationale: Das Hifil von חרם bezeichnet die Übergabe an den Bann, die hier Vernichtung einschließt. Die Formulierung wahrt den kultisch-rechtlichen Fachcharakter besser als ein bloßes „vernichte“.
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: an den Sündern, an Amalek
  rationale: 'Die appositionale Struktur des Hebräischen wird bewahrt: „Amalek“ identifiziert die zuvor moralisch als „die Sünder“ bezeichnete Gruppe.'
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: kämpfe gegen es
  rationale: Das maskuline Singularsuffix bezieht sich grammatisch auf das kollektiv verstandene „Amalek“. Das deutsche Neutrum folgt dem Namen, während der anschließende Plural den Menschen der Gruppe gilt.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: bis sie vollständig vernichtet sind
  rationale: כלה bezeichnet das Zu-Ende-Bringen beziehungsweise vollständige Aufreiben. Die passive deutsche Fassung gibt das schwierige hebräische Gefüge sinngemäß wieder, ohne einen ausdrücklich genannten Täter einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich stehende Gottesname sichtbar bleibt.
- issue: Bedeutung von חרם
  choice: den Bann vollstrecken
  alternative: vollständig vernichten
  rationale: Die Übersetzung bewahrt sowohl die religiös-rechtliche Vorstellung des Bannes als auch ihren vernichtenden Vollzug; eine Fußnote erläutert die Tragweite.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnliche Apposition „die Sünder, Amalek“ sowie der Wechsel vom kollektiven Singular zum sachbezogenen Plural werden bewusst nicht eingeebnet.
