  verdict: revise
  source_fidelity: 'Die Grundstruktur wird erfasst: Jahwe sendet Saul aus, befiehlt die Bannweihe Amaleks und den Kampf bis zu dessen Ende. Allerdings ist „den Bann an ... vollstrecken“ keine treffende deutsche Rektion für החרים, und die passive Schlussform lässt den im Hebräischen durch die Anrede nahegelegten Handelnden unnötig offen. Das Singularobjekt bei „kämpfe gegen ihn“ sollte als kollektives „Amalek“ verständlich bleiben, während der Schluss auf die Angehörigen der Gruppe im Plural verweist.'
  naturalness: „Sandte dich auf einen Auftrag“ und besonders „vollstrecke an den Sündern ... den Bann“ wirken im modernen Standarddeutsch unidiomatisch. Die Wiederaufnahme „gegen Amalek“ ist klarer als ein sachliches „gegen es“ und vermeidet eine unzutreffende neutrale Referenz auf den Eigennamen.
  terminology: „Jahwe“ ist angemessen. „Dem Bann weihen“ bewahrt den technischen Charakter von חרם und lässt sich in einer Fußnote knapp als auf Vernichtung zielende Bannweihe erläutern. „Die Sünder, Amalek“ gibt die markierte hebräische Apposition wieder; die ungewöhnliche deutsche Form ist hier als quellennahe Kennzeichnung vertretbar.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe von החרים
    rationale: „Den Bann an jemandem vollstrecken“ ist weder die übliche noch eine besonders klare deutsche Wiedergabe. „Jemanden dem Bann weihen“ bildet die Konstruktion und ihren Fachcharakter genauer ab.
  - severity: medium
    issue: „gegen es“ als Bezug auf Amalek
    rationale: Der Eigenname Amalek wird im Deutschen nicht sinnvoll durch ein neutrales „es“ aufgenommen. Die Wiederholung des kollektiven Namens erhält zugleich das hebräische Singularobjekt.
  - severity: low
    issue: Passive Wiedergabe des Schlusssatzes
    rationale: „bis sie vollständig vernichtet sind“ tilgt die auf Saul bezogene Handlungsaufforderung. „bis du sie vollständig vernichtet hast“ gibt die intendierte Vollendung bei Wahrung des pluralischen Bezugs wieder.
