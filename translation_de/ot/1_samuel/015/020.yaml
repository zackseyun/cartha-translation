  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל שְׁמוּאֵ֗ל אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ בְּ/ק֣וֹל יְהוָ֔ה וָ/אֵלֵ֕ךְ בַּ/דֶּ֖רֶךְ אֲשֶׁר שְׁלָחַ֣/נִי יְהוָ֑ה וָ/אָבִ֗יא אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וְ/אֶת עֲמָלֵ֖ק הֶחֱרַֽמְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: de
  text: 'Saul sagte zu Samuel: »Ich habe doch auf die Stimme Jahwes gehört![a] Ich bin den Weg gegangen, auf den Jahwe mich gesandt hat. Ich habe Agag, den König von Amalek, gebracht und Amalek der Vernichtung geweiht.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich habe auf die Stimme Jahwes gehört.« Die hebräische Wendung kann auch mit »Ich habe Jahwe gehorcht« wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Amalek vollständig vernichtet« beziehungsweise »an Amalek den Bann vollstreckt«. Das hebräische Verb bezeichnet das Übergeben von etwas an den Bann und damit an die Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: auf die Stimme … gehört
  rationale: Die Verbindung שׁמע בְּקוֹל bedeutet, auf jemanden zu hören und ihm damit zu gehorchen. Die deutsche Wendung bewahrt das Bild der »Stimme« und lässt zugleich Sauls Behauptung des Gehorsams erkennen.
- source_word: אֲשֶׁר
  choice: doch
  rationale: Am Beginn von Sauls Erwiderung hat אֲשֶׁר hier bekräftigende beziehungsweise widersprechende Kraft. »doch« gibt seinen defensiven Nachdruck im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: Ich bin den Weg gegangen, auf den Jahwe mich gesandt hat
  rationale: Die Übersetzung erhält das hebräische Bild vom Weg und verbindet den Relativsatz im Deutschen eindeutig mit diesem Weg.
- source_word: וָאָבִיא
  choice: hergebracht
  rationale: Der Hifil von בוא bezeichnet das Bringen beziehungsweise Herbeiführen. »hergebracht« ist im Zusammenhang natürlich, ohne ein im Verb nicht ausdrücklich enthaltenes »zurück« hinzuzufügen.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agag, den König von Amalek
  rationale: Die Apposition wird in geläufigem modernem Deutsch wiedergegeben.
- source_word: הֶחֱרַמְתִּי
  choice: der Vernichtung geweiht
  rationale: Der Hifil von חרם bezeichnet, jemanden oder etwas unter den Bann zu stellen und dadurch der Vernichtung zu übergeben. Die Formulierung bewahrt sowohl den Weihe- als auch den Vernichtungsaspekt.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der Eigenname steht kollektiv für das Volk. Die Wiedergabe hält sich an die Form des hebräischen Textes, ohne sie ausdrücklich zu »Amalekiter« aufzulösen.
theological_decisions:
- issue: Bedeutung von חרם im Zusammenhang des Bannkriegs
  choice: Amalek der Vernichtung geweiht
  alternative: Amalek vollständig vernichtet; an Amalek den Bann vollstreckt
  rationale: '»Der Vernichtung geweiht« erhält die kultisch-rechtliche Spannung des Verbs: Es geht nicht lediglich um Töten, sondern um unwiderrufliche Aussonderung zur Vernichtung. Die Übersetzung bestätigt dabei nicht Sauls Behauptung, sondern gibt sie als seine Aussage wieder.'
- issue: Sauls nachdrückliche Selbstverteidigung
  choice: Ich habe doch auf die Stimme Jahwes gehört!
  alternative: Ich habe auf die Stimme Jahwes gehört; Ich habe Jahwe sehr wohl gehorcht
  rationale: »doch« und das Ausrufezeichen vermitteln den widersprechenden Nachdruck seiner Antwort, ohne den Inhalt seiner Behauptung zu verstärken oder ihre Wahrheit vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Sauls defensive Behauptung wird durch »doch« natürlich hörbar. Das Wegbild und der Gottesname Jahwe bleiben erhalten; die Fachbedeutung von חרם wird verständlich formuliert und in der Fußnote erläutert.
