source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: de
  text: 'Samuel sagte zu Saul: „Ich werde nicht mit dir zurückkehren, denn du hast das Wort Jahwes verworfen, und Jahwe hat dich verworfen, sodass du nicht mehr König über Israel sein sollst.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das narrative Wayyiqtol führt die Handlung fort; im modernen deutschen Erzählstil ist eine zusätzliche Wiedergabe von וַ durch „und“ nicht erforderlich.
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: Ich werde nicht mit dir zurückkehren
  rationale: שׁוב bezeichnet hier das Zurückkehren; עִמָּךְ gibt die Begleitung an. Die Formulierung ist direkt und im Deutschen natürlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Samuels Weigerung ein. „Denn“ bewahrt den würdevollen Aussagestil und ist im modernen Deutsch verständlich.
- source_word: מָאַסְתָּה / וַיִּמְאָסְךָ
  choice: du hast … verworfen / Jahwe hat dich verworfen
  rationale: Die Wiederholung von מאס wird mit demselben Verb wiedergegeben und erhält so die beabsichtigte Entsprechung zwischen Sauls Verwerfung des Gotteswortes und seiner eigenen Verwerfung.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דָּבָר kann Wort, Botschaft oder Anordnung bedeuten. „Das Wort Jahwes“ bewahrt die feste biblische Wendung und lässt den konkreten Befehlscharakter aus dem Kontext hervorgehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der etablierten Form „Jahwe“ transliteriert, statt durch einen Titel ersetzt zu werden.
- source_word: מִהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: sodass du nicht mehr König über Israel sein sollst
  rationale: מִן mit dem Infinitiv von היה bezeichnet die Entfernung aus einer Stellung. Die gewählte deutsche Form gibt das idiomatisch wieder; „über Israel“ bewahrt die Bedeutung von עַל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ wahrt diesen als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wechselseitige Verwendung von מאס
  choice: In beiden Satzteilen „verwerfen“
  alternative: Unterschiedliche Verben wie „missachten“ und „verwerfen“
  rationale: Das gleiche hebräische Verb verbindet Sauls Verwerfung des Wortes Jahwes mit Jahwes Verwerfung Sauls. Diese sprachliche und theologische Entsprechung bleibt durch die Wiederholung sichtbar.
- issue: Tragweite von מִהְיוֹת מֶלֶךְ
  choice: sodass du nicht mehr König über Israel sein sollst
  alternative: davon, König über Israel zu sein
  rationale: Die Formulierung bezeichnet Sauls Ausschluss vom Königtum, ohne über den Vers hinaus festzulegen, wann und auf welche Weise seine Herrschaft faktisch endet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und bestimmt. „Jahwe“ gibt den Gottesnamen wieder; „verworfen“ wird bewusst zweimal verwendet, um die hebräische Wiederholung zu erhalten.
