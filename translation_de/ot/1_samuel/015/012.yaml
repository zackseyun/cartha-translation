base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: de
  text: 'Samuel stand früh am Morgen auf, um Saul entgegenzugehen. Da wurde Samuel mitgeteilt: »Saul ist nach Karmel gekommen, und sieh: Er hat sich ein Denkmal[a] errichtet. Dann wandte er sich um, zog weiter und ging nach Gilgal hinab.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Hand für sich“. „Hand“ bezeichnet hier ein Erinnerungszeichen oder Denkmal.'
    reason: Die wörtliche Bedeutung und das zugrunde liegende Bild unterscheiden sich deutlich von der idiomatisch notwendigen Wiedergabe im Haupttext.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: stand früh am Morgen auf
  rationale: Die Hifil-Form bezeichnet idiomatisch das frühe Aufstehen; die Zeitangabe wird ausdrücklich bewahrt.
- source_word: לִקְרַאת שָׁאוּל
  choice: um Saul entgegenzugehen
  rationale: Die Präposition mit Infinitiv drückt den Zweck aus; „entgegengehen“ gibt die Bewegung zu einer Begegnung genauer wieder als ein bloßes „treffen“.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: Da wurde Samuel berichtet
  rationale: Die unpersönliche Passivkonstruktion lässt offen, wer Samuel die Nachricht überbrachte. Der Doppelpunkt gibt לֵאמֹר im Deutschen natürlich wieder.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: Saul ist nach Karmel gekommen
  rationale: Das direktionale ה zeigt die Bewegung nach Karmel an; das Perfekt passt zu einer berichteten, bereits vollzogenen Ankunft.
- source_word: וְהִנֵּה
  choice: und sieh
  rationale: „Sieh“ bewahrt die aufmerksamkeitslenkende Kraft der Partikel in moderner, würdiger Sprache.
- source_word: מַצִּיב לוֹ יָד
  choice: Er hat sich dort ein Denkmal errichtet
  rationale: יָד bedeutet wörtlich „Hand“, bezeichnet hier aber idiomatisch ein Erinnerungs- oder Ehrenzeichen. „Sich ein Denkmal errichten“ wahrt den selbstbezogenen Sinn von לוֹ. „Dort“ macht im Deutschen den Ortsbezug natürlich deutlich, ohne einen neuen Sachgehalt einzuführen.
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: Dann wandte er sich um, zog weiter
  rationale: 'Die beiden aufeinanderfolgenden Bewegungsverben werden unterschieden wiedergegeben: Richtungswechsel und anschließende Weiterreise.'
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: und ging nach Gilgal hinab
  rationale: „Hinabgehen“ bewahrt die topografische beziehungsweise räumliche Nuance von ירד.
