  text: וַ/יִּתְפֹּ֛שׂ אֶת אֲגַ֥ג מֶֽלֶךְ עֲמָלֵ֖ק חָ֑י וְ/אֶת כָּל הָ/עָ֖ם הֶחֱרִ֥ים לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: de
  text: Er nahm Agag, den König von Amalek, lebend gefangen und weihte das ganze Volk mit der Schärfe des Schwertes dem Bann[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vernichtete das ganze Volk vollständig“. Das hebräische Verb bezeichnet, jemanden oder etwas dem Bann und damit der Vernichtung zu übergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: nahm … gefangen
  rationale: Das Verb bezeichnet hier das Ergreifen beziehungsweise Gefangennehmen; im militärischen Zusammenhang ist „nahm … gefangen“ natürlich und präzise.
- source_word: אֲגַג
  choice: Agag
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: den König von Amalek
  rationale: Die hebräische Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: חָי
  choice: lebend
  rationale: Das prädikative Adjektiv hebt hervor, dass Agag nicht getötet, sondern lebend gefangen wurde.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: עָם bedeutet gewöhnlich „Volk“. Die Wiedergabe bewahrt die Breite des Ausdrucks und legt ihn nicht enger als „Truppen“ aus.
- source_word: הֶחֱרִים
  choice: vollstreckte … den Bann
  rationale: Der Hifil von חרם bezeichnet das Unterstellen unter den Bann mit der Folge der Vernichtung. Die Formulierung bewahrt den besonderen kultisch-theologischen Gehalt, ohne den Vorgang nur als gewöhnliches Töten zu beschreiben.
- source_word: לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die Wendung lautet wörtlich „mit/nach dem Mund des Schwertes“. „Mit der Schärfe des Schwertes“ bewahrt das Bild in verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe der Bann-Terminologie חרם
  choice: vollstreckte an dem ganzen Volk den Bann
  alternative: vernichtete das ganze Volk vollständig
  rationale: „Bann“ erhält die besondere Bedeutung des hebräischen Begriffs im Kontext des gebotenen Bannkriegs. Die Alternative macht das Ergebnis unmittelbarer verständlich, lässt aber die kultisch-theologische Dimension weniger deutlich erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Den Bann vollstrecken“ ist leicht gehoben und sachlich passend; die Fußnote erläutert den heute weniger geläufigen theologischen Fachbegriff. Die Satzstruktur bleibt nah am Hebräischen, ohne unnatürlich zu wirken.
