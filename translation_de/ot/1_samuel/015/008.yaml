- from: Er nahm Agag, den König von Amalek, lebend gefangen und vollstreckte an dem ganzen Volk den Bann[a] mit der Schärfe des Schwertes.
  to: Er nahm Agag, den König von Amalek, lebend gefangen und weihte das ganze Volk mit der Schärfe des Schwertes dem Bann[a].
  rationale: Die Revision ersetzt die schwerfällige und leicht verschobene Formulierung „den Bann ... vollstrecken“ durch die im Deutschen für חרם passendere technische Wendung „dem Bann weihen“. Damit bleiben sowohl die besondere Bannterminologie als auch die durch die Schwertwendung bezeichnete Tötungsweise sichtbar. Die alternative Lesart wird beibehalten; nur der Grammatikfehler in ihrer Erläuterung wird bereinigt.
