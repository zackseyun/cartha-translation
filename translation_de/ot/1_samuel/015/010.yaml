  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמוּאֵ֖ל לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/010.yaml
  text: Then the word of Yahweh came to Samuel[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes[a] an Samuel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Wayyiqtol-Form leitet eine neue Entwicklung in der Erzählung ein. Zusammen mit דְּבַר ergibt „Da erging“ eine natürliche, würdige deutsche Wiedergabe ohne die altertümliche Formel „Und es geschah“.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְּבַר יְהוָה bewahrt „das Wort“ den sprachlichen Bezug auf die göttliche Offenbarung; „Botschaft“ wäre verständlich, aber weniger formnah.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der im Hebräischen stehende Gottesname wird als „Jahwe“ wiedergegeben. Der Genitiv „Jahwes“ ist in dieser deutschen Satzkonstruktion erforderlich.
- source_word: אֶל
  choice: an
  rationale: Die Präposition bezeichnet hier den Empfänger des göttlichen Wortes; in der festen deutschen Wendung „das Wort erging an“ ist „an“ idiomatisch.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv führt den Inhalt der folgenden Gottesrede ein. Im modernen Deutschen übernimmt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung darstellt; diese wird in der Fußnote genannt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die feste Wendung „das Wort Jahwes erging an“ wahrt den prophetischen Formelcharakter; der Doppelpunkt kündigt die im nächsten Vers folgende Rede an.
