  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: de
  text: 'Da sagte Samuel zu ihm: »Jahwe hat heute das Königtum über Israel von dir weggerissen und es deinem Nächsten[a] gegeben, der besser ist als du.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinem Gefährten« oder »deinem Mitmenschen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: Da sagte Samuel zu ihm
  rationale: Das narrative וַ־ führt die Handlung weiter. »Da sagte« gibt diesen Fortgang in natürlichem deutschen Erzählstil wieder, ohne eine stärkere zeitliche oder kausale Beziehung zu behaupten.
- source_word: קָרַע
  choice: hat … weggerissen
  rationale: Das Verb bezeichnet ein Zerreißen und greift das Zerreißen von Samuels Gewand im unmittelbaren Zusammenhang auf. »Weggerissen« bewahrt sowohl das anschauliche Bild als auch den Gedanken des Entzugs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: das Königtum über Israel
  rationale: מַמְלְכוּת kann »Königtum«, »Königsherrschaft« oder »Königreich« bezeichnen. Da die königliche Herrschaft Saul entzogen und einem anderen übertragen wird, trifft »Königtum über Israel« den Sinn im Deutschen präzise.
- source_word: מֵעָלֶיךָ
  choice: von dir
  rationale: Die Präposition bezeichnet hier den Entzug aus Sauls Verfügungs- und Herrschaftsbereich. Zusammen mit »weggerissen« wird die Trennung klar ausgedrückt.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die Wiedergabe wahrt die Unmittelbarkeit des Gerichtswortes.
- source_word: וּנְתָנָהּ
  choice: und es … gegeben
  rationale: Die Perfektform stellt die Übertragung in diesem prophetischen Gerichtswort als feststehende, vollzogene göttliche Entscheidung dar.
- source_word: לְרֵעֲךָ
  choice: deinem Nächsten
  rationale: רֵעַ kann einen Nächsten, Gefährten, Mitmenschen oder anderen Zugehörigen bezeichnen. »Deinem Nächsten« wahrt die relationale und zugleich unbestimmte Ausdrucksweise des Hebräischen.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: der besser ist als du
  rationale: Adjektiv und komparatives מִן bedeuten direkt »besser als du«. Der Relativsatz macht im Deutschen deutlich, dass die Aussage die Person bezeichnet, der das Königtum gegeben wird, ohne »würdiger« oder eine andere Deutung einzutragen.
theological_decisions:
- issue: Ist Entzug und Übertragung des Königtums als bereits vollzogen oder als zukünftig wiederzugeben?
  choice: 'Abgeschlossen/dekretiv: »hat … weggerissen und … gegeben«'
  alternative: 'Zukunftsbezogen: »wird … wegreißen und … geben«'
  rationale: Die hebräischen Formen präsentieren Gottes Urteil als entschiedene und feststehende Tat, obwohl sich die geschichtliche Umsetzung erst weiter entfaltet. Das deutsche Perfekt bewahrt diese Spannung zwischen göttlichem Beschluss und späterer Verwirklichung.
translation_notes:
  register: Moderner, würdevoller Erzählstil. »Weggerissen« erhält das konkrete Bild des zerrissenen Gewandes aus dem Zusammenhang; »Königtum über Israel« vermeidet die mögliche Missdeutung, das Land selbst werde Saul an diesem Tag materiell genommen.
