source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: de
  text: 'Und Samuel sagte: „Obwohl du in deinen eigenen Augen gering warst[a], warst du nicht das Oberhaupt der Stämme Israels? Und Jahwe salbte dich zum König über Israel.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch wenn du in deinen eigenen Augen gering bist“. Die hebräische Formulierung lässt eine leicht andere Nuance und Zeitauffassung zu; gemeint ist Sauls geringe Einschätzung seiner selbst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: warst du nicht
  rationale: Die Partikel leitet eine rhetorische Frage ein, die Zustimmung erwartet. Im rückblickenden Zusammenhang gibt „warst du nicht“ ihre Funktion natürlich wieder.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: Obwohl du in deinen eigenen Augen gering warst
  rationale: Die Wiedergabe versteht אִם hier konzessiv und bewahrt zugleich das hebräische Bild der Selbsteinschätzung. Da die Konstruktion auch leicht anders nuanciert werden kann, wird eine Alternative in der Fußnote genannt.
- source_word: קָטֹן
  choice: gering
  rationale: „Gering“ bezeichnet niedrigen Rang oder geringe Bedeutung, ohne die Aussage vorschnell nur als psychologische Bescheidenheit zu deuten.
- source_word: בְּעֵינֶיךָ
  choice: in deinen eigenen Augen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild und macht deutlich, dass es um Sauls eigene Einschätzung geht.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: das Oberhaupt der Stämme Israels
  rationale: „Oberhaupt“ bewahrt die Körpermetapher von רֹאשׁ und bezeichnet zugleich auf natürliche Weise eine leitende Stellung.
- source_word: וַיִּמְשָׁחֲךָ
  choice: salbte dich
  rationale: Das Verb bezeichnet ausdrücklich die Salbung und sollte wegen ihrer königlichen und theologischen Bedeutung nicht zu „ernannte“ verallgemeinert werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: zum König über Israel
  rationale: Diese Formulierung gibt Ziel und Ergebnis der Salbung knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen wieder, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die Wiederholung der Satzverbindung „Und“ bleiben erhalten; „Oberhaupt“ ist verständlich und bewahrt zugleich die hebräische Haupt-Metapher.
