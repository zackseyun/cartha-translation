  text: Then Saul struck Amalek[a], from Havilah as you go to Shur[b], which is opposite Egypt.
translation:
  language: de
  text: Dann schlug Saul Amalek[a], von Hawila bis nach Schur[b], das gegenüber von Ägypten liegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Amalekiter“; im Hebräischen steht „Amalek“, wobei der Name des Stammvaters kollektiv das Volk bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wenn du nach Schur kommst“. Oder zur Lage Schurs: „das östlich von Ägypten liegt“ oder „das vor Ägypten liegt“; die hebräische Wendung kann eine Lage gegenüber oder vor Ägypten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: schlug
  rationale: נכה bezeichnet hier das Schlagen beziehungsweise militärische Angreifen; „schlug“ bewahrt die konkrete Aussage, ohne den Umfang des Sieges stärker festzulegen als der hebräische Wortlaut.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der Name des Stammvaters steht kollektiv für das nach ihm benannte Volk. Die Wiedergabe als „Amalek“ bleibt der hebräischen Form nahe; die mögliche Verdeutlichung „die Amalekiter“ wird in der Fußnote genannt.
- source_word: מֵחֲוִילָה
  choice: von Hawila
  rationale: Die Präposition מִן kennzeichnet den Ausgangspunkt des geografischen Bereichs.
- source_word: בּוֹאֲךָ שׁוּר
  choice: bis dorthin, wo man nach Schur kommt
  rationale: Die idiomatische Verbindung mit dem Infinitiv von בוא bezeichnet die Richtung beziehungsweise den Zugang zu einem Ort. Die unpersönliche deutsche Form gibt das generische hebräische „du“ natürlich wieder.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרָיִם
  choice: das Ägypten gegenüberliegt
  rationale: עַל־פְּנֵי kann eine Lage vor, gegenüber oder östlich von einem Ort bezeichnen. „gegenüberliegt“ wahrt die räumliche Aussage, ohne eine Himmelsrichtung ausdrücklich festzulegen.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
