id: 1SA.15.21
reference: 1 Samuel 15:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח הָ/עָ֧ם מֵ/הַ/שָּׁלָ֛ל צֹ֥אן וּ/בָקָ֖ר רֵאשִׁ֣ית הַ/חֵ֑רֶם לִ/זְבֹּ֛חַ לַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/גִּלְגָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: de
  text: Doch das Volk nahm von der Beute Schafe und Rinder, das Beste von dem, was der Vernichtung geweiht war,[a] um es dem HERRN, deinem Gott, in Gilgal zu opfern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die Wendung auch mit „das Erste/Erlesenste von dem Geweihten“ wiedergegeben werden. Gemeint sind Tiere, die dem Vernichtungsgebot unterlagen und deshalb nicht hätten behalten werden dürfen.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht hier der Gottesname JHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet hier schlicht „nehmen“. „Doch“ gibt den Kontrast zu Sauls vorausgehender Behauptung wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: Die wörtliche Bezeichnung bewahrt Sauls rhetorische Verlagerung der Verantwortung auf das Volk beziehungsweise seine Männer.
- source_word: מֵהַשָּׁלָל
  choice: von der Beute
  rationale: שׁלל bezeichnet Kriegsbeute; „Beute“ ist im modernen Deutschen klar und idiomatisch.
- source_word: צֹאן וּבָקָר
  choice: Schafe und Rinder
  rationale: Die konkrete Benennung der kleineren und größeren Nutztiere entspricht dem hebräischen Wortpaar.
- source_word: רֵאשִׁית
  choice: das Beste
  rationale: רֵאשִׁית kann „Anfang/Erstes“ bedeuten, bezeichnet hier aber wahrscheinlich den besten oder erlesensten Teil der erbeuteten Tiere.
- source_word: הַחֵרֶם
  choice: was der Vernichtung geweiht war
  rationale: חֵרֶם bezeichnet hier das, was Gott unwiderruflich zur Vernichtung bestimmt war. Die Formulierung bewahrt sowohl den Weihe- als auch den Vernichtungsaspekt.
- source_word: לִזְבֹּחַ
  choice: um es … zu opfern
  rationale: Der Infinitiv bezeichnet den von Saul angegebenen Zweck; die deutsche Finalkonstruktion gibt ihn natürlich wieder.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname JHWH wird nach der etablierten deutschen Bibelkonvention mit „HERR“ wiedergegeben und in einer Fußnote kenntlich gemacht.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: 'Das Suffix der zweiten Person Singular ist bedeutsam und wird genau bewahrt: Saul sagt zu Samuel „deinem Gott“.'
- source_word: בַּגִּלְגָּל
  choice: in Gilgal
  rationale: Die Ortsangabe wird im Deutschen bei einer Ortschaft natürlich mit „in“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe von חֵרֶם im Zusammenhang des Vernichtungsgebots
  choice: was der Vernichtung geweiht war
  alternative: was dem Bann verfallen war
  rationale: Die gewählte Fassung macht verständlich, dass diese Tiere keine gewöhnliche Beute waren, sondern aufgrund göttlicher Bestimmung vernichtet werden sollten. Sie vermeidet zugleich den heute erklärungsbedürftigen Fachausdruck „Bann“.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: „HERR“ folgt der im Deutschen vertrauten jüdisch-christlichen Lesetradition; die Fußnote legt offen, dass im Hebräischen der Eigenname JHWH steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ist aber flüssig lesbar. „Doch“ markiert den Gegensatz im Kontext; „deinem Gott“ bewahrt Sauls auffällige Anrede an Samuel. Die theologische Spannung zwischen Weihe, Vernichtungsgebot und beabsichtigtem Opfer wird nicht aufgelöst.
