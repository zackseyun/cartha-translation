base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: de
  text: 'Doch Samuel sagte: „Was ist denn dieses Geräusch von Schafen, das mir in die Ohren dringt, und das Geräusch von Rindern, das ich höre?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch Samuel sagte
  rationale: Das Waw setzt die Erzählung fort; im Zusammenhang widerspricht Samuel jedoch Sauls vorheriger Behauptung, weshalb „Doch“ den adversativen Sinn natürlich wiedergibt.
- source_word: וּמֶה
  choice: Was ist dann das für ein
  rationale: Die Frage verlangt rhetorisch eine Erklärung. „Dann“ nimmt die verbindende Folgerung auf, während die deutsche Wendung den vorwurfsvollen Ton natürlich ausdrückt.
- source_word: קוֹל הַצֹּאן
  choice: Blöken der Schafe
  rationale: קוֹל bezeichnet hier das hörbare Geräusch der Tiere. „Blöken“ ist im Deutschen konkreter und natürlicher als das wörtliche „Stimme“ oder das allgemeinere „Geräusch“.
- source_word: הַזֶּה בְּאָזְנָי
  choice: das mir in die Ohren dringt
  rationale: Die Formulierung bewahrt das anschauliche Bild der Ohren und gibt den unmittelbar wahrnehmbaren Laut in idiomatischem Deutsch wieder.
- source_word: וְקוֹל הַבָּקָר
  choice: und für ein Brüllen der Rinder
  rationale: בָּקָר ist eine Sammelbezeichnung für Rinder. Das wiederholte קוֹל wird entsprechend dem tatsächlichen Tierlaut mit „Brüllen“ wiedergegeben.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: das ich höre
  rationale: Die Relativkonstruktion bezeichnet den hörbaren Beweis gegen Sauls Aussage. Das ausdrücklich gesetzte Pronomen אָנֹכִי kann im Deutschen durch den rhetorischen Zusammenhang hinreichend zur Geltung kommen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkreten Tierlaute machen die rhetorische Anklage unmittelbar verständlich, ohne den Aussagegehalt zu erweitern.
