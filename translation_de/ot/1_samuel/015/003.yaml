  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: de
  text: Nun geh und schlag Amalek[a]. Vollstreckt den Bann an allem, was ihm gehört. Verschone ihn nicht, sondern töte vom Mann bis zur Frau, vom Kind bis zum Säugling, vom Rind bis zum Kleinvieh[b], vom Kamel bis zum Esel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Amalek“ bezeichnet hier das amalekitische Volk als kollektive Einheit; deshalb folgen im Hebräischen die singularischen Bezüge „ihm“ und „ihn“.
    reason: Erläuterung des kollektiven Singulars.
  - marker: b
    text: 'Hebräisch: „Rind und śeh“. Śeh kann ein einzelnes Schaf oder eine Ziege bezeichnen.'
    reason: Die hebräische Tierbezeichnung ist weiter gefasst als „Schaf“.
lexical_decisions:
- source_word: עַתָּה לֵךְ
  choice: Nun geh
  rationale: Gibt den einleitenden Zeit- und Diskursmarker sowie den direkten Imperativ knapp und natürlich wieder.
- source_word: וְהִכִּיתָה אֶת עֲמָלֵק
  choice: und schlag Amalek
  rationale: „Schlagen“ entspricht der Grundbedeutung von נכה und wahrt die direkte, ernste Befehlssprache; „Amalek“ bleibt als kollektiver Singular erhalten.
- source_word: וְהַחֲרַמְתֶּם
  choice: und vollstreckt den Bann
  rationale: חרם bezeichnet hier die unwiderrufliche Aussonderung zur Vernichtung im göttlichen Gericht. „Den Bann vollstrecken“ bewahrt diese sachlich-sakrale Bedeutung besser als ein bloßes „vernichten“. Der Wechsel vom Singular zum Plural im Hebräischen bleibt im Deutschen sichtbar.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: an allem, was ihm gehört
  rationale: Passt idiomatisch zu „den Bann vollstrecken“ und gibt den umfassenden Besitzbezug wieder.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: Verschone ihn nicht
  rationale: חמל kann Mitleid oder Schonung bezeichnen; im Vollzug eines Gerichtsbefehls ist „verschonen“ die präzise und natürliche Wahl.
- source_word: וְהֵמַתָּה
  choice: sondern töte
  rationale: Der Hifil von מות bedeutet „sterben lassen/töten“. „Töte“ gibt den direkten Singularbefehl ohne beschönigende Umschreibung wieder.
- source_word: מֵאִישׁ עַד אִשָּׁה מֵעֹלֵל וְעַד יוֹנֵק
  choice: Mann und Frau, Kind und Säugling
  rationale: Die deutschen Paarformeln geben die umfassenden Merismen natürlich wieder und bewahren die ausdrücklich genannten Kategorien.
- source_word: מִשּׁוֹר וְעַד שֶׂה
  choice: Rind und Stück Kleinvieh
  rationale: שׁוֹר bezeichnet ein Rind, שֶׂה dagegen ein einzelnes Schaf oder eine Ziege. „Stück Kleinvieh“ bewahrt diese Unbestimmtheit, ohne die Tierart auf Schaf zu verengen.
- source_word: מִגָּמָל וְעַד חֲמוֹר
  choice: Kamel und Esel
  rationale: Die singularischen Gattungsbezeichnungen werden direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bedeutung der Bannformel חרם
  choice: den Bann vollstrecken
  alternative: vollständig vernichten; der Vernichtung weihen
  rationale: Die gewählte Fassung erhält sowohl die tatsächliche Vernichtung als auch den kultisch-gerichtlichen Charakter des hebräischen Ausdrucks, ohne die Spannung zu verharmlosen.
- issue: Kollektiver Singular bei Amalek
  choice: Amalek ... ihm
  alternative: die Amalekiter ... ihnen
  rationale: Der hebräische Text personifiziert das Volk als kollektive Einheit. Die deutsche Fassung bewahrt diese Form und erläutert sie in einer Fußnote.
- issue: Numeruswechsel in den Befehlen
  choice: schlag ... vollstreckt ... töte
  alternative: durchgehend Singular oder durchgehend Plural
  rationale: Der masoretische Text wechselt tatsächlich zwischen Singular und Plural. Dieser möglicherweise bedeutsame oder textgeschichtlich bedingte Wechsel wird nicht stillschweigend geglättet.
- issue: Umfassende Aufzählung der Opfer
  choice: Mann und Frau, Kind und Säugling
  alternative: alle Menschen
  rationale: Die ausdrücklich genannten Gruppen und die Härte des Gerichtswortes bleiben unverändert sichtbar; es wird weder verallgemeinert noch abgeschwächt.
translation_notes:
  register: Moderne, würdige und bewusst direkte Befehlssprache. Die drastische Aussage des Ausgangstextes wird weder gemildert noch erweitert. Der ungewöhnliche Numeruswechsel des Hebräischen bleibt erhalten; „Stück Kleinvieh“ ist präzise, wenn auch leicht fachsprachlich.
