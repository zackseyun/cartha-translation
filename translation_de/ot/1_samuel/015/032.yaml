base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: de
  text: 'Dann sagte Samuel: »Bringt Agag, den König von Amalek, zu mir!« Agag kam mit gemessenem Schritt zu ihm[a] und sagte: »Gewiss ist die Bitterkeit des Todes gewichen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes ist unsicher. Es kann ein behutsames oder zierliches Auftreten bezeichnen; andere deuten es als »zuversichtlich« oder »in Fesseln«.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: Bringt ... zu mir
  rationale: Der Hifil-Imperativ im Plural richtet sich an die Anwesenden und fordert sie auf, Agag vor Samuel zu bringen.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agag, den König von Amalek
  rationale: Die Apposition bezeichnet Agags Herrschaftsstellung; die deutsche Kasusmarkierung folgt dem Akkusativobjekt.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: kam zu ihm
  rationale: Vom gerade genannten Standort Samuels aus ist »kam zu ihm« im Deutschen natürlicher als das formal mögliche »ging zu ihm«.
- source_word: מַעֲדַנֹּת
  choice: mit gemessenen Schritten
  rationale: Das seltene und unsichere Wort scheint die Art von Agags Herantreten zu bezeichnen. Die Wiedergabe wahrt eine mögliche Bedeutung im Bereich eines behutsamen oder gezierten Auftretens, ohne die kontextuell möglichen Deutungen »fröhlich«, »zitternd« oder »in Fesseln« im Haupttext festzuschreiben.
- source_word: אָכֵן
  choice: Nun ... gewiss
  rationale: אָכֵן bekräftigt Agags Einschätzung; zusammen mit »nun« gibt die Formulierung seine situationsbezogene Zuversicht natürlich wieder.
- source_word: סָר
  choice: ist ... vorüber
  rationale: Das Qal-Perfekt von סור bezeichnet hier, dass die Todesgefahr nach Agags Einschätzung gewichen beziehungsweise vergangen ist.
- source_word: מַר הַמָּוֶת
  choice: die Bitterkeit des Todes
  rationale: Die formal nahe Wiedergabe bewahrt das markante Bild und lässt offen, ob die bittere Todeserfahrung oder die drohende Todesgefahr gemeint ist.
theological_decisions:
- issue: Agags Einschätzung seiner Todesgefahr
  choice: »Nun ist die Bitterkeit des Todes gewiss vorüber.«
  alternative: »Wahrlich, bitter ist der Tod.«
  rationale: Die masoretische Vokalisierung סָר spricht für »ist gewichen/vorüber« und damit für Agags Annahme, die Todesgefahr sei vorbei. Die alternative syntaktische Auffassung wird nicht in den Haupttext übernommen, da sie weniger unmittelbar zur überlieferten Vokalisierung passt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; die Unsicherheit des seltenen Wortes מַעֲדַנֹּת wird ausdrücklich in einer Fußnote offengehalten.
