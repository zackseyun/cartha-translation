  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: de
  text: 'Er sagte: „Ich habe gesündigt. Nun erweise mir bitte Ehre vor den Ältesten meines Volkes und vor Israel. Kehre mit mir zurück, damit ich mich vor Jahwe, deinem Gott, niederwerfen kann.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich werde mich vor Jahwe, deinem Gott, niederwerfen.“ Die hebräische Verknüpfung kann entweder als Zweckangabe („damit ich …“) oder als einfache Fortsetzung („und ich werde …“) verstanden werden.'
    reason: lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Ich habe gesündigt
  rationale: Das Qal Perfekt 1. Person Singular bezeichnet das vollzogene Sündigen; das deutsche Perfekt gibt die unmittelbare Bedeutung des Eingeständnisses natürlich wieder.
- source_word: עַתָּה
  choice: Doch nun
  rationale: עַתָּה markiert den anschließenden dringlichen Wunsch. „Doch“ macht den auffälligen Übergang vom Schuldbekenntnis zur Bitte um öffentliche Ehre im Deutschen natürlich sichtbar, ohne eine zusätzliche Begründung einzuführen.
- source_word: כַּבְּדֵנִי נָא
  choice: erweise mir bitte Ehre
  rationale: Der Piel-Imperativ von כבד mit Objektsuffix verlangt öffentliche Anerkennung; נָא wird mit „bitte“ wiedergegeben. „Ehre erweisen“ vermeidet hier die mögliche religiöse Nebenbedeutung von „verherrlichen“.
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: vor den Ältesten meines Volkes und vor Israel
  rationale: נֶגֶד bezeichnet die sichtbare Gegenwart beziehungsweise Öffentlichkeit. Die Wiederholung von „vor“ und Sauls Formulierung „mein Volk“ bleiben erhalten.
- source_word: וְשׁוּב עִמִּי
  choice: Kehre mit mir zurück
  rationale: Der Imperativ von שׁוב fordert Samuel auf, Saul wieder zu begleiten; „zurückkehren“ bildet die Bewegungsrichtung genauer ab als ein bloßes „mitkommen“.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: damit ich mich … niederwerfen kann
  rationale: Die Form von חוה/שׁחה bezeichnet das Sich-Niederwerfen. Im Zusammenhang ist dies Anbetung, doch die körperlich-konkrete Ausdrucksweise des Hebräischen wird bewahrt. Die Konjunktion kann nach der vorangehenden Aufforderung final verstanden werden.
- source_word: לַיהוָה
  choice: vor Jahwe
  rationale: Die Präposition ל markiert die Ausrichtung der Niederwerfung auf Jahwe. Im Deutschen ist bei „sich niederwerfen“ die Verbindung „vor“ idiomatisch. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Das Suffix der 2. Person Singular wird ausdrücklich bewahrt; Saul nennt Jahwe gegenüber Samuel „deinen Gott“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Gottesname wiedergegeben statt durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen verbreitete wissenschaftliche Form.
- issue: Sauls Ausdruck אֱלֹהֶיךָ („dein Gott“)
  choice: deinem Gott
  alternative: unserem Gott
  rationale: Der hebräische Text hat ausdrücklich die 2. Person Singular. Diese Formulierung bewahrt die erzählerische und theologische Spannung und wird nicht zu einem gemeinsamen Bekenntnis umgedeutet.
- issue: Funktion von וְ vor הִשְׁתַּחֲוֵיתִי
  choice: 'final: „damit ich … kann“'
  alternative: 'fortführend: „und ich werde mich … niederwerfen“'
  rationale: Nach der Bitte, gemeinsam zurückzukehren, ist eine finale Verknüpfung im Deutschen sehr natürlich. Da die hebräische Verbindung auch schlicht fortführend verstanden werden kann, wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bitte um öffentliche Anerkennung bleibt deutlich, ebenso Sauls auffällige Rede von „meinem Volk“ und „deinem Gott“. Konkretes „sich niederwerfen“ wurde dem abstrakteren „anbeten“ vorgezogen.
