base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/034.yaml
  text: Then Samuel went to Ramah[a], and Saul went up to his house in Gibeah of Saul.
translation:
  language: de
  text: Dann ging Samuel nach Rama, und Saul ging hinauf zu seinem Haus in Gibea Sauls.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gibea von Saul“. Das Hebräische bewahrt den Ortsnamen in der Form „Gibea Sauls“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: הלך im narrativen Wayyiqtol führt die Handlung mit der schlichten Bedeutung „gehen“ fort; „ging“ ist im Deutschen natürlich und quellennah.
- source_word: הָרָמָתָה
  choice: nach Rama
  rationale: Das direktive He bezeichnet die Bewegung auf Rama zu; bei Ortsnamen wird dies im Deutschen idiomatisch mit „nach“ ausgedrückt.
- source_word: עָלָה
  choice: ging hinauf
  rationale: עלה bedeutet gewöhnlich „hinaufgehen“ und kann eine topografische Nuance tragen. Diese bleibt in der natürlichen deutschen Wendung „ging hinauf“ erhalten.
- source_word: בֵּיתוֹ
  choice: seinem Haus
  rationale: בַּיִת mit dem Suffix der 3. Person maskulin Singular bedeutet hier schlicht „sein Haus“; nach „zu“ steht im Deutschen der Dativ.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea-Saul
  rationale: Die hebräische Genitivverbindung bezeichnet den Ort in der überlieferten Form „Gibea Sauls/Gibea-Saul“. Die gekoppelte Namensform bewahrt die Ortsbezeichnung, ohne sie eindeutig als Besitzangabe festzulegen.
