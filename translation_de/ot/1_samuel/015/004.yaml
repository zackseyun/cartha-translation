base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: de
  text: 'Da rief Saul das Volk zusammen und musterte es in Telaïm[a]: 200.000 Fußsoldaten und 10.000 Männer aus Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „mit Lämmern“, wenn בַּטְּלָאִים wörtlich und nicht als Ortsname Telaïm verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: rief … zusammen
  rationale: Der Hifil von שׁמע bedeutet hier im militärischen Zusammenhang idiomatisch, das Volk zusammenzurufen.
- source_word: הָעָם
  choice: das Volk
  rationale: Dies entspricht dem allgemeinen hebräischen Ausdruck; aus dem Zusammenhang wird deutlich, dass die zum Krieg Aufgebotenen gemeint sind.
- source_word: וַיִּפְקְדֵם
  choice: musterte es
  rationale: פקד bezeichnet im militärischen Kontext das Erfassen beziehungsweise Mustern der aufgebotenen Männer.
- source_word: בַּטְּלָאִים
  choice: in Telaïm
  rationale: Die Form wird im Kontext am plausibelsten als Ortsname verstanden. Die mögliche wörtliche Deutung wird in der Fußnote bewahrt.
- source_word: מָאתַיִם אֶלֶף רַגְלִי
  choice: 200.000 Fußsoldaten
  rationale: Die Zahl wird direkt wiedergegeben; רַגְלִי bezeichnet hier Soldaten zu Fuß.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אֶת אִישׁ יְהוּדָה
  choice: und 10.000 Männer aus Juda
  rationale: אִישׁ יְהוּדָה bezeichnet kollektiv die Männer, die zu Juda gehören; „aus Juda“ ist dafür natürliches modernes Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zusammenrufen“ und „mustern“ geben das militärische Geschehen klar wieder, ohne הָעָם unnötig zu „Heer“ oder „Truppen“ zu verengen. Die Schreibung „Telaïm“ macht die getrennte Aussprache der Vokale kenntlich.
