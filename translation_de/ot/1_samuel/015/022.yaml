  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַ/חֵ֤פֶץ לַֽ/יהוָה֙ בְּ/עֹל֣וֹת וּ/זְבָחִ֔ים כִּ/שְׁמֹ֖עַ בְּ/ק֣וֹל יְהוָ֑ה הִנֵּ֤ה שְׁמֹ֨עַ֙ מִ/זֶּ֣בַח ט֔וֹב לְ/הַקְשִׁ֖יב מֵ/חֵ֥לֶב אֵילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: de
  text: 'Und Samuel sagte: „Hat der HERR ebenso viel Gefallen an Brandopfern und Schlachtopfern wie daran, auf die Stimme des HERRN zu hören? Siehe, Gehorchen ist besser als Schlachtopfer, und Hinhören besser als das Fett von Widdern.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: Hat ... Gefallen
  rationale: Gibt die Frage nach dem Wohlgefallen des HERRN natürlich und zugleich eng am hebräischen Ausdruck wieder.
- source_word: עֹלוֹת וּזְבָחִים
  choice: Brandopfer und Schlachtopfer
  rationale: Unterscheidet das vollständig verbrannte Opfer von der allgemeineren Kategorie geschlachteter Opfer.
- source_word: שְׁמֹעַ בְּקוֹל
  choice: auf die Stimme ... hört
  rationale: Bewahrt das hebräische Bild des Hörens auf eine Stimme; im Kontext schließt es Gehorsam ein, ohne die Bildsprache aufzulösen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Markiert den nachdrücklichen Übergang zur Kernaussage in knapper, würdiger Form.
- source_word: לְהַקְשִׁיב
  choice: aufmerksam sein
  rationale: Gibt das aufmerksame Hinhören beziehungsweise Beachten wieder und wahrt die Parallelität zu שְׁמֹעַ.
- source_word: חֵלֶב אֵילִים
  choice: das Fett von Widdern
  rationale: Entspricht konkret der kultischen Opferterminologie des Ausgangstextes.
theological_decisions:
- issue: Verhältnis von Opfer und Gehorsam
  choice: 'Vergleichende Aussage: Hören ist besser als Opfer'
  alternative: Absolute Verwerfung aller Opfer
  rationale: Der Vers setzt rechtmäßige Opfer nicht grundsätzlich außer Kraft, sondern stellt das Hören auf Gottes Stimme über kultische Handlungen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe ist allgemein verständlich und typografisch als Ersatz für den Gottesnamen erkennbar.
- issue: Bedeutungsumfang von שׁמע
  choice: hören
  alternative: gehorchen
  rationale: „Hören“ bewahrt die lexikalische Wiederholung und die theologische Spannung zwischen Wahrnehmen, Beachten und Gehorchen; der Kontext macht die gehorsame Dimension deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität und die Wiederholung des Hörmotivs werden bewahrt; die Formulierung bleibt für gewöhnliche Leser verständlich.
