base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: de
  text: Und nun vergib mir bitte meine Sünde[a] und kehre mit mir zurück, damit ich mich vor Jahwe niederwerfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hebe meine Sünde auf«; die hebräische Wendung bedeutet hier, die Sünde wegzunehmen beziehungsweise zu vergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Konjunktion und der zeitlich-folgernde Übergang werden natürlich und zugleich quellennah wiedergegeben.
- source_word: שָׂא נָא
  choice: vergib mir bitte
  rationale: נשא mit חטאת ist eine feste Wendung für das Wegnehmen beziehungsweise Vergeben von Sünde; נָא kennzeichnet die dringliche Bitte.
- source_word: אֶת חַטָּאתִי
  choice: meine Sünde
  rationale: Im Kontext bezeichnet חטאת Sauls eingestandene Sünde, nicht ein Sündopfer.
- source_word: וְשׁוּב עִמִּי
  choice: und kehre mit mir zurück
  rationale: שׁוב bezeichnet das Zurückkehren; Saul bittet Samuel, ihn erneut zu begleiten.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: damit ich mich … niederwerfe
  rationale: Die Verbform bezeichnet körperliches Niederwerfen und kann im religiösen Zusammenhang zugleich Verehrung ausdrücken; die deutsche Zweckkonstruktion gibt den Zusammenhang mit den vorausgehenden Aufforderungen wieder.
- source_word: לַיהוָה
  choice: vor Jahwe
  rationale: Beim deutschen Verb „sich niederwerfen“ bezeichnet „vor“ idiomatisch die Person, der die Huldigung gilt; der Gottesname wird als Jahwe wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von השתחוה
  choice: sich vor Jahwe niederwerfen
  alternative: Jahwe anbeten
  rationale: Die konkrete körperliche Handlung bleibt sichtbar, während ihr kultischer Charakter aus der Nennung Jahwes hervorgeht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und nun“ bewahrt den erzählerischen Anschluss; „bitte“ gibt die bittende Partikel נָא wieder. Die konkrete Gebärde des Niederwerfens wird nicht vorschnell durch den abstrakteren Ausdruck „anbeten“ ersetzt.
