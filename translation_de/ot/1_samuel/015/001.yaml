source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל אֹתִ֨/י שָׁלַ֤ח יְהוָה֙ לִ/מְשָׁחֳ/ךָ֣ לְ/מֶ֔לֶךְ עַל עַמּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה שְׁמַ֔ע לְ/ק֖וֹל דִּבְרֵ֥י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: de
  text: 'Samuel sagte zu Saul: »Mich hat Jahwe gesandt, um dich zum König über sein Volk, über Israel, zu salben. Höre nun auf die Worte Jahwes[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Höre auf die Stimme der Worte Jahwes.« Die hebräische Wendung fordert dazu auf, nicht nur zu hören, sondern das Gesagte auch zu beachten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das hebräische Narrativ-Waw führt die Handlung weiter. Im modernen Deutschen genügt hier das Präteritum; ein zusätzliches „Dann“ ist für den Zusammenhang nicht erforderlich.
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: Mich hat Jahwe gesandt
  rationale: Die Voranstellung von אֹתִי wird im Deutschen durch „Mich“ bewahrt und hebt Samuels göttlichen Auftrag hervor. Das Perfekt passt zu einer vergangenen Sendung, deren Geltung für die gegenwärtige Mahnung fortbesteht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לִמְשָׁחֳךָ לְמֶלֶךְ
  choice: um dich zum König … zu salben
  rationale: „Salben“ bewahrt die konkrete Handlung und ihre Bedeutung für die Einsetzung in das Königsamt; „zum König“ gibt die Ziel- beziehungsweise Amtsbestimmung idiomatisch wieder.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: über sein Volk, über Israel
  rationale: Die Wiederholung von עַל bleibt erhalten. Dadurch wird Israel nachdrücklich als Jahwes Volk bezeichnet, über das Saul als König eingesetzt wurde.
- source_word: וְעַתָּה
  choice: nun
  rationale: „Nun“ kennzeichnet den Übergang von der Erinnerung an Sauls Berufung zur daraus folgenden Aufforderung.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: Höre … auf die Worte Jahwes
  rationale: Die Wendung fordert nicht bloß akustisches Hören, sondern aufmerksames Beachten und Gehorchen. „Auf die Worte … hören“ ist natürliches Deutsch und bewahrt diese Bedeutungsweite; die ungewöhnliche wörtliche Form wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn erkennbar als Eigennamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Tragweite der Aufforderung שְׁמַע
  choice: Höre … auf
  alternative: Höre
  rationale: Die Verbindung mit לְקוֹל bezeichnet hier ein Hören, das Beachtung und Gehorsam einschließt. Die gewählte Form lässt diesen Anspruch erkennen, ohne das Verb ausschließlich als „gehorchen“ festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die betonte Voranstellung „Mich“ und die Wiederholung „über sein Volk, über Israel“ bewahren zentrale Züge des hebräischen Satzbaus, ohne unnatürlich zu wirken.
