  text: וַ/יָּ֥שָׁב שְׁמוּאֵ֖ל אַחֲרֵ֣י שָׁא֑וּל וַ/יִּשְׁתַּ֥חוּ שָׁא֖וּל לַֽ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: de
  text: Da kehrte Samuel um und folgte Saul. Und Saul warf sich vor dem HERRN nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „betete den HERRN an“. Das hebräische Verb kann je nach Zusammenhang sowohl das Niederwerfen als auch die Anbetung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … um
  rationale: Das Verb שׁוב bezeichnet hier Samuels Umkehr nach seiner vorherigen Weigerung, mit Saul zurückzukehren. „Kehrte um“ gibt die Richtungsänderung im Deutschen natürlich wieder.
- source_word: אַחֲרֵי
  choice: hinter … her
  rationale: אַחֲרֵי bedeutet wörtlich „hinter/nach“. „Ging hinter Saul her“ bewahrt das räumliche Bild und lässt zugleich erkennen, dass Samuel ihn begleitete.
- source_word: וַיִּשְׁתַּחוּ
  choice: warf sich … nieder
  rationale: Die Form von שׁחה bezeichnet ein ehrfürchtiges Sich-Niederwerfen und kann je nach Zusammenhang auch mit „anbeten“ wiedergegeben werden. Die konkrete Körperhandlung bleibt im Haupttext erhalten.
- source_word: לַיהוָה
  choice: vor dem HERRN
  rationale: Die Präposition ל kennzeichnet hier denjenigen, dem die Niederwerfung gilt. „Vor dem HERRN“ ist dafür idiomatisches Deutsch; der Gottesname יהוה wird nach der vorgegebenen Konvention als „der HERR“ wiedergegeben.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Eingebürgerte deutsche Form des Personennamens.
theological_decisions:
- issue: Ob וַיִּשְׁתַּחוּ ausdrücklich als kultische Anbetung oder als körperliche Niederwerfung wiederzugeben ist
  choice: Im Haupttext steht „warf sich vor dem HERRN nieder“.
  alternative: „betete den HERRN an“
  rationale: Da das Verb sowohl die Körperhaltung als auch den damit vollzogenen Akt der Anbetung bezeichnen kann, vermeidet die konkrete Wiedergabe eine unnötige Festlegung. Dass die Handlung dem HERRN gilt, macht ihren religiösen Charakter dennoch deutlich; die alternative Deutung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze parataktische Erzählweise des Hebräischen wird durch zwei Hauptsätze bewahrt; „hinter Saul her“ erhält das räumliche Bild, ohne die gemeinte Begleitung zu verschleiern.
