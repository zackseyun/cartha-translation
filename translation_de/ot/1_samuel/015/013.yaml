id: 1SA.15.13
reference: 1 Samuel 15:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹ֥א שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יֹּ֧אמֶר ל֣/וֹ שָׁא֗וּל בָּר֤וּךְ אַתָּה֙ לַֽ/יהוָ֔ה הֲקִימֹ֖תִי אֶת דְּבַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: de
  text: 'Dann kam Samuel zu Saul. Saul sagte zu ihm: »Gesegnet seist du von Jahwe![a] Ich habe Jahwes Wort ausgeführt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jahwe segne dich!« Die hebräische Segensformel lässt sich unterschiedlich wiedergeben; wörtlicher wäre etwa: »Gesegnet bist du für Jahwe.«'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Ich habe Jahwes Wort erfüllt« oder »in die Tat umgesetzt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dann kam
  rationale: Die Erzählform führt die Handlung fort; »kam« gibt die Bewegung zu Saul in diesem Zusammenhang natürlich wieder.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: Gesegnet seist du von Jahwe!
  rationale: Die gehobene, aber verständliche Segensformel bewahrt den Charakter eines Segenszuspruchs. »Von Jahwe« gibt Jahwe als Quelle des Segens idiomatisch wieder, ohne die Mehrdeutigkeit der hebräischen Präposition ganz zu verdecken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֲקִימֹתִי
  choice: Ich habe … ausgeführt
  rationale: Das Hifil von קום bezeichnet hier, dass Saul nach eigener Aussage Jahwes Wort in die Tat umgesetzt hat. »Ausgeführt« ist im Deutschen natürlich und lässt den unmittelbaren Kontext seine Behauptung beurteilen.
- source_word: דְּבַר יְהוָה
  choice: Jahwes Wort
  rationale: »Wort« bewahrt die Breite des hebräischen דָּבָר, auch wenn hier eine göttliche Anweisung gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich; die Transliteration wahrt den Charakter als Eigenname.
- issue: Sauls Aussage über seinen Gehorsam
  choice: Ich habe Jahwes Wort ausgeführt
  alternative: Ich habe Jahwes Wort erfüllt
  rationale: Die Übersetzung gibt Sauls Anspruch wieder, bestätigt jedoch nicht stillschweigend dessen Wahrheit; die Spannung zum folgenden Erzählverlauf bleibt bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Segensspruch klingt bewusst etwas feierlicher als die Rahmenerzählung; Sauls Behauptung bleibt knapp und nachdrücklich.
