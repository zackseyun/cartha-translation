base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: de
  text: Saul und das Volk verschonten Agag sowie die besten Schafe und Rinder, die Masttiere[a], die Widder und alles, was gut war. Sie waren nicht bereit, sie der Vernichtung zu weihen[b]. Alles aber, was verachtet und wertlos war, weihten sie der Vernichtung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck ist unsicher. Möglich ist auch: »die Tiere zweiter Geburt«; traditionell wird er oft als »Masttiere« verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich im Sinn von »unter den Bann stellen«: etwas der Vernichtung weihen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: verschonten
  rationale: Das Verb bezeichnet hier das praktische Verschonen vor der angeordneten Vernichtung; die mögliche Nuance des Mitleids bleibt dabei im Hintergrund erhalten.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: die besten Schafe und Rinder
  rationale: מֵיטַב bezeichnet den besten beziehungsweise erlesensten Teil des genannten Viehs; die konkrete Wiedergabe ist im Deutschen natürlich.
- source_word: הַמִּשְׁנִים
  choice: die Tiere zweiter Güte
  rationale: Der seltene und schwierige Ausdruck hängt sprachlich mit »zweiter« zusammen. Die Wiedergabe bewahrt diesen Anhaltspunkt, ohne die unsichere traditionelle Deutung als Masttiere in den Text zu setzen.
- source_word: הַכָּרִים
  choice: die Widder
  rationale: Das Wort bezeichnet hier am ehesten männliche Schafe beziehungsweise Widder.
- source_word: לֹא אָבוּ
  choice: sie waren nicht bereit
  rationale: Die Form drückt fehlende Bereitschaft beziehungsweise bewusste Weigerung aus, nicht Unfähigkeit.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: sie der Vernichtung zu weihen / weihten sie der Vernichtung
  rationale: 'Die Wiedergabe erhält den technischen Sinn von חרם: etwas unter den Bann zu stellen, sodass es vernichtet werden muss.'
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: alles Vieh aber, das verachtet und wertlos war
  rationale: מְלָאכָה bezeichnet im Zusammenhang den Bestand beziehungsweise Besitz; wegen der vorangehenden Viehliste konkretisiert »Vieh« den Bezug. Die beiden Attribute kennzeichnen das als gering geschätzte und unbrauchbare Gut.
theological_decisions:
- issue: Wiedergabe von חרם im Kontext des Bannkriegs
  choice: der Vernichtung weihen
  alternative: vollständig vernichten; unter den Bann stellen
  rationale: »Der Vernichtung weihen« bewahrt sowohl den sakral-rechtlichen Charakter als auch die tödliche Konsequenz, ohne die Handlung auf bloßes Töten zu reduzieren oder den Fachbegriff »Bann« unerklärt in den Haupttext zu setzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht die bewusste Weigerung klar. Die Wiederholung von »der Vernichtung weihen« bildet die hebräische Wortwiederholung ab; die schwer deutbare Tierbezeichnung bleibt mit Fußnote transparent.
