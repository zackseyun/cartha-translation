  to: Saul und das Volk verschonten Agag sowie die besten Schafe und Rinder, die Masttiere[a], die Widder und alles, was gut war. Sie waren nicht bereit, sie der Vernichtung zu weihen[b]. Alles aber, was verachtet und wertlos war, weihten sie der Vernichtung.
