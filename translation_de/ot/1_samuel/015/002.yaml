  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: »Ich habe beachtet, was Amalek Israel angetan hat[a]: wie Amalek sich ihm auf dem Weg entgegenstellte[b], als es aus Ägypten heraufzog.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe daran gedacht, was Amalek Israel angetan hat«, beziehungsweise: »Ich ziehe Amalek für das zur Rechenschaft, was es Israel angetan hat.« Das hebräische Verb kann aufmerksames Erinnern, Sich-Kümmern oder ein Einschreiten zum Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie Amalek sich ihm auf dem Weg in den Weg stellte«; möglicherweise: »wie Amalek ihm auf dem Weg auflauerte«. »Ihm« und »es« beziehen sich auf Israel als kollektive Einheit.'
    reason: lexical_alternative_and_grammar_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Gängige, würdevolle Wiedergabe der hebräischen Botenformel; sie bewahrt deren formelhaften Charakter und klingt im modernen Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die etablierte deutsche Wiedergabe wahrt die umfassende Bedeutung des Titels, ohne ihn ausschließlich auf menschliche oder himmlische Heere festzulegen.
- source_word: פָּקַדְתִּי
  choice: Ich habe beachtet
  rationale: פקד kann hier aufmerksames Erinnern beziehungsweise ein ins Auge fassendes Heimsuchen bezeichnen. „Beachtet“ lässt den Zusammenhang mit dem folgenden Gericht erkennen, ohne den Vollzug der Strafe bereits ausdrücklich in das Verb hineinzulegen.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: was Amalek Israel angetan hat
  rationale: „Angetan hat“ gibt die gegen Israel gerichtete Handlung idiomatisch wieder und lässt ihre konkrete Art offen.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: wie Amalek sich ihm auf dem Weg entgegenstellte
  rationale: Die Formulierung drückt die feindliche Behinderung aus, ohne die im Hebräischen nicht eindeutig bezeichnete Taktik als Hinterhalt festzulegen. Die Wiederholung von „Amalek“ vermeidet im Deutschen eine unklare Zuordnung des Subjekts.
- source_word: לוֹ
  choice: ihm
  rationale: Der maskuline Singular entspricht dem hebräischen Pronomen und nimmt Israel als kollektive Einheit auf.
- source_word: בַּעֲלֹתוֹ מִמִּצְרַיִם
  choice: als es aus Ägypten heraufzog
  rationale: „Aus Ägypten heraufziehen“ entspricht dem üblichen hebräischen Ausdruck; das singularische „es“ bezeichnet Israel als kollektive Einheit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heere
  rationale: Der Eigenname bleibt sichtbar, während „Heerscharen“ die Weite des Titels bewahrt und ihn nicht auf rein irdische Streitkräfte verengt.
- issue: Spannung zwischen göttlichem Erinnern und Gericht in פָּקַדְתִּי
  choice: Ich habe beachtet
  alternative: Ich habe daran gedacht / Ich habe heimgesucht
  rationale: Die gewählte Formulierung wahrt, dass Jahwe Amaleks frühere Tat wirksam in den Blick nimmt, ohne das im Folgevers angekündigte Gericht schon als vollzogen darzustellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer prophetischer Botenformel. Die Satzstruktur bleibt nahe am Hebräischen, während Wiederholungen dort eingesetzt werden, wo deutsche Pronomen sonst missverständlich wären. Die Mehrdeutigkeit von פקד und der genaue Charakter von Amaleks feindlichem Vorgehen werden nicht dogmatisch aufgelöst.
