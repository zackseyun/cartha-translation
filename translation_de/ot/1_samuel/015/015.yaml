  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: de
  text: 'Saul sagte: „Sie haben sie von den Amalekitern mitgebracht, denn das Volk hat die besten Schafe und Rinder verschont, um sie Jahwe, deinem Gott, zu opfern. Den Rest aber haben wir der Vernichtung geweiht.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollständig vernichtet“. Das hebräische Verb חָרַם bezeichnet hier, etwas unter den Bann zu stellen und der Vernichtung zu weihen.'
    reason: lexikalische Alternative und Erklärung eines Fachbegriffs
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: sie haben sie mitgebracht
  rationale: Die Hifil-Form von בוא mit Objektsuffix bezeichnet das Herbringen der Tiere. Das deutsche Perfekt klingt in Sauls unmittelbarer Erklärung natürlich; das doppelte „sie“ bewahrt Subjekt und Objekt des Hebräischen.
- source_word: מֵעֲמָלֵקִי
  choice: von den Amalekitern
  rationale: Die gentilizische Form bezeichnet hier das Volk, nicht vorrangig das Gebiet Amalek.
- source_word: חָמַל ... עַל
  choice: verschont
  rationale: Im Zusammenhang des Vernichtungsbanns meint die Wendung, dass das Volk die Tiere nicht vernichtete; „verschont“ gibt die konkrete Handlung wieder, ohne ein bestimmtes Mitgefühl zu unterstellen.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: die besten Schafe und Rinder
  rationale: מֵיטַב bezeichnet den ausgewählten, wertvollsten Teil des Kleinviehs und der Rinder. Die Formulierung ist im Deutschen klar und natürlich.
- source_word: לְמַעַן זְבֹחַ
  choice: um sie ... zu opfern
  rationale: לְמַעַן kennzeichnet den Zweck. Das Objekt „sie“ ist im Hebräischen aus dem Zusammenhang erschließbar und wird im Deutschen zur Klarheit ausgedrückt.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Bundesname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Der Suffix der zweiten Person Singular wird bewahrt. Sauls auffällige Anrede an Samuel als „deinem Gott“ bleibt dadurch erhalten.
- source_word: הַיּוֹתֵר
  choice: den Rest
  rationale: Gemeint ist der verbleibende Teil neben den verschonten Tieren; „den Rest“ ist präzise und idiomatisch.
- source_word: הֶחֱרַמְנוּ
  choice: haben wir der Vernichtung geweiht
  rationale: Das Hifil von חרם ist ein Fachausdruck für die Übergabe unter den Bann zur Vernichtung. Die Wiedergabe erhält sowohl den Weihe- als auch den Vernichtungsaspekt.
theological_decisions:
- issue: Wiedergabe von חרם im Zusammenhang des Vernichtungsbanns
  choice: der Vernichtung geweiht
  alternative: vollständig vernichtet
  rationale: 'Das Verb bezeichnet mehr als gewöhnliches Töten oder Zerstören: Etwas wird unter göttlichem Gericht unwiderruflich zur Vernichtung bestimmt. Die gewählte Formulierung bewahrt diese Spannung.'
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Sauls Wechsel von „das Volk“ zu „wir“ sowie die rhetorisch auffällige Formulierung „deinem Gott“ wurden beibehalten. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wiedergabe von חרם.
