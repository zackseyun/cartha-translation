source:
  edition: WLC
  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: de
  text: Samuel sah Saul bis zum Tag seines Todes nicht wieder; denn Samuel trauerte um Saul. Und Jahwe bereute[a], dass er Saul zum König über Israel gemacht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war betrübt darüber“. Das hebräische Verb kann je nach Zusammenhang unter anderem Bedauern, Betrübnis oder ein Ablassen von etwas ausdrücken. Hier bezeichnet es Jahwes schmerzliches Bedauern darüber, Saul zum König gemacht zu haben.'
    reason: lexikalische Bedeutungsbreite und theologische Spannung
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: sah ... nicht wieder
  rationale: Die verneinte Verbindung von יָסַף mit dem Infinitiv bedeutet, dass eine Handlung nicht noch einmal geschieht. „Sah ... nicht wieder“ gibt die hebräische Wendung natürlich und genau wieder.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: Saul sehen
  rationale: ראה ist das gewöhnliche Verb für „sehen“. Im Zusammenhang ist eine weitere persönliche Begegnung gemeint, doch die Übersetzung bewahrt die schlichte Ausdrucksweise des Hebräischen.
- source_word: עַד יוֹם מוֹתוֹ
  choice: bis zum Tag seines Todes
  rationale: Die formelle Wendung entspricht der hebräischen Genitivkonstruktion und bewahrt zugleich die mögliche Unbestimmtheit des Pronominalbezugs.
- source_word: הִתְאַבֵּל ... אֶל שָׁאוּל
  choice: trauerte um Saul
  rationale: Das Hitpael von אבל bezeichnet Trauern; mit „um“ wird die ungewöhnliche hebräische Präposition אֶל im Deutschen idiomatisch wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נִחָם
  choice: bereute
  rationale: Im Zusammenhang mit dem folgenden Objektsatz bezeichnet das Verb Bedauern beziehungsweise schmerzliche Reue darüber, Saul zum König gemacht zu haben. „Bereute“ bewahrt die persönliche und theologisch spannungsvolle Aussage.
- source_word: הִמְלִיךְ
  choice: zum König gemacht hatte
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen. Das Plusquamperfekt verdeutlicht im Deutschen, dass diese Handlung dem Bedauern vorausging.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: „Über Israel“ ist die natürliche deutsche Bezeichnung für den Herrschaftsbereich eines Königs und entspricht עַל in diesem Zusammenhang.
theological_decisions:
- issue: Die auf Gott bezogene Aussage נִחָם
  choice: bereute
  alternative: war betrübt darüber; ließ davon ab
  rationale: Der Text schreibt Jahwe ausdrücklich נִחָם zu. „Bereute“ passt zum Objektsatz und erhält die anthropopathische sowie theologische Spannung, ohne sie durch eine systematische Erklärung abzuschwächen.
- issue: Bezug von „seines“ in עַד יוֹם מוֹתוֹ
  choice: seines Todes
  alternative: bis Samuel starb; bis Saul starb
  rationale: Das hebräische Suffix ist grammatisch männlicher Singular, nennt seinen Bezug aber nicht ausdrücklich. Die deutsche Formulierung bewahrt diese echte Bezugsmehrdeutigkeit, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Gedankengang, ohne dessen Idiome hölzern nachzubilden. Das Semikolon verbindet die eng zusammengehörenden Aussagen über Samuel; der anschließende Satz mit „Und“ bewahrt die markante hebräische Fortführung.
