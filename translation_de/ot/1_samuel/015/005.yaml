translation:
  language: de
  text: Saul kam bis zur Stadt Amaleks und legte sich im Wadi[a][b][c] auf die Lauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „legte im Wadi einen Hinterhalt“. Das hebräische Verb ist hier schwierig und wurde auch als „stritt“ verstanden; der Zusammenhang spricht jedoch eher für ein Auflauern.'
    reason: lexical_alternative
  - marker: b
    text: Ein Wadi ist ein meist außerhalb der Regenzeit trockenes Flussbett oder eine Schlucht.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Stadt der Amalekiter“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: zog
  rationale: בוא bezeichnet je nach Erzählperspektive Kommen, Gehen oder Ankommen. Im deutschen Erzählfluss gibt „zog“ Sauls Bewegung zum Ziel natürlich wieder.
- source_word: עַד
  choice: bis zu
  rationale: עַד markiert hier das erreichte Ziel beziehungsweise die Grenze der Bewegung; „bis zu“ bildet dies genauer ab als ein bloßes „zu“.
- source_word: עִיר עֲמָלֵק
  choice: die Stadt Amalek
  rationale: Die Status-constructus-Verbindung lässt sich formal als „die Stadt Amalek“ wiedergeben. Da Amalek auch das Volk bezeichnen kann, bleibt „die Stadt der Amalekiter“ als Alternative in der Fußnote erhalten.
- source_word: וַיָּרֶב
  choice: legte sich ... auf die Lauer
  rationale: Die hebräische Form ist schwierig. Der militärische Zusammenhang und alte Auslegungstraditionen sprechen für ein Auflauern beziehungsweise einen Hinterhalt; die natürlich deutsche Wendung lässt die genaue taktische Ausführung offen.
- source_word: בַּנָּחַל
  choice: im Wadi
  rationale: נחל bezeichnet häufig ein zeitweise trockenes Flussbett beziehungsweise eine Schlucht. „Wadi“ ist geografisch präzise und wird durch eine Fußnote erklärt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wadi“ bewahrt die geografische Besonderheit; die idiomatische Wendung „sich auf die Lauer legen“ vermittelt den wahrscheinlichen militärischen Sinn, während die Fußnote die echte lexikalische Unsicherheit offenlegt.
