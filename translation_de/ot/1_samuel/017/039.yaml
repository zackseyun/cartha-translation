base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: de
  text: 'David schnallte sein Schwert über seiner Rüstung[a] um und versuchte zu gehen, denn er hatte sie noch nicht erprobt. Doch David sagte zu Saul: »Ich kann damit nicht gehen, denn ich habe sie noch nicht erprobt.« Da legte David sie ab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »Rüstung« wiedergegebene hebräische Wort kann allgemeiner Kleidung oder Gewandung bezeichnen; hier spricht der militärische Zusammenhang für »Rüstung«. Das abschließende »sie« bezeichnet die zuvor angelegte Ausrüstung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: gürtete … um
  rationale: חגר bezeichnet das Umschnallen beziehungsweise Anlegen eines Ausrüstungsstücks, besonders einer Waffe. „gürtete … um“ ist im Deutschen konkret, würdig und für das Anlegen eines Schwertes idiomatisch.
- source_word: חַרְבּוֹ
  choice: sein Schwert
  rationale: Direkte Wiedergabe von חֶרֶב mit Suffix der 3. Person Singular maskulin.
- source_word: מֵעַל לְמַדָּיו
  choice: über seiner Rüstung
  rationale: מַדִּים kann Kleidung oder Gewandung bezeichnen; im unmittelbaren militärischen Zusammenhang ist Sauls Rüstung gemeint. „über seiner Rüstung“ wahrt zugleich die räumliche Aussage.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: versuchte zu gehen
  rationale: Die Verbindung von יאל mit Infinitiv kann ausdrücken, dass jemand etwas unternimmt oder wagt. Hier passt ein versuchsweises Gehen in der ungewohnten Ausrüstung zum Erzählverlauf.
- source_word: כִּי לֹא נִסָּה / כִּי לֹא נִסִּיתִי
  choice: denn er hatte sie noch nicht erprobt / denn ich habe sie noch nicht erprobt
  rationale: נסה im Piel bedeutet prüfen oder erproben, hier durch praktische Erfahrung. Die im Hebräischen nicht ausgedrückten Objekte werden im Deutschen durch „sie“ verständlich ergänzt; „noch“ gibt den kontextuellen Erfahrungsaspekt natürlich wieder.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: Ich kann damit nicht gehen
  rationale: בָּאֵלֶּה verweist auf die angelegte Ausrüstung. „damit“ ist natürliches modernes Deutsch und lässt offen, ob vor allem das Gehen oder der Einsatz im Kampf gemeint ist.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: Da legte David sie wieder ab
  rationale: Die Hifil-Form von סור bezeichnet das Entfernen. „legte … ab“ ist im Deutschen die natürliche Formulierung für Rüstung und Ausrüstung; „wieder“ ergibt sich aus dem zuvor geschilderten Anlegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „erprobt“ bildet die hebräische Wiederholung desselben Verbs ab. Die Rede ist mit deutschen Anführungszeichen gesetzt.
