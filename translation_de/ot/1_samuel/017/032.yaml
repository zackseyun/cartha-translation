base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: de
  text: 'David sagte zu Saul: „Niemand soll wegen ihm den Mut verlieren.[a] Dein Diener wird hingehen und gegen diesen Philister kämpfen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Das Herz eines Menschen soll wegen ihm nicht fallen.“ Gemeint ist: Niemand soll wegen dieses Philisters den Mut verlieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: David sagte zu Saul
  rationale: Das Waw setzt die Erzählung fort; im modernen deutschen Erzählstil muss dies nicht eigens mit „und“ wiedergegeben werden.
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: Niemand soll den Mut verlieren
  rationale: Die hebräische Wendung lautet wörtlich, das Herz eines Menschen solle nicht fallen. „Den Mut verlieren“ gibt dieses Idiom natürlich und verständlich wieder, ohne das generische אָדָם unnötig geschlechtsspezifisch einzuengen.
- source_word: עָלָיו
  choice: wegen ihm
  rationale: Das Pronomen verweist im Zusammenhang auf den Philister. Die pronominale Form bleibt im Haupttext erhalten; der kontextuell eindeutige Bezug wird in der Fußnote genannt.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Als höfische Selbstbezeichnung Davids gegenüber dem König ist „dein Diener“ kontextgerecht; „Sklave“ würde hier einen nicht hervorgehobenen Aspekt in den Vordergrund rücken.
- source_word: יֵלֵךְ וְנִלְחַם
  choice: wird hingehen und … kämpfen
  rationale: Die Verbformen drücken Davids Entschluss beziehungsweise seine Zusage aus. Die deutsche Konstruktion gibt beide koordinierten Handlungen flüssig wieder.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: mit diesem Philister
  rationale: עִם bedeutet grundsätzlich „mit“ und bezeichnet hier die kämpferische Auseinandersetzung mit einem Gegner. Die formnahe Wiedergabe ist auch im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Selbstbezeichnung „dein Diener“ bleibt erhalten; die hebräische Herz-Metapher wird zugunsten des geläufigen deutschen Idioms in der Fußnote dokumentiert.
