  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: de
  text: David ging immer wieder von Saul fort und kehrte nach Bethlehem zurück, um dort die Herde seines Vaters zu hüten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „David ging und kehrte von Saul zurück, um die Herde seines Vaters in Bethlehem zu weiden.“ Die hebräische Wortstellung kann „in Bethlehem“ unmittelbar mit „die Herde seines Vaters“ verbinden; im Zusammenhang bezeichnet es den Ort, an den David zurückkehrte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: ging immer wieder … zurück
  rationale: Die Verbindung aus Partizip und Verb bezeichnet hier am ehesten ein wiederholtes oder gewohntes Hin- und Hergehen. „Immer wieder“ gibt diesen iterativen Sinn in natürlichem Deutsch wieder.
- source_word: מֵעַל שָׁאוּל
  choice: von Saul
  rationale: מֵעַל bezeichnet hier idiomatisch das Fortgehen aus Sauls Gegenwart oder Dienst. Die knappe Wiedergabe „von Saul“ bewahrt die Offenheit hinsichtlich Davids genauer Dienststellung.
- source_word: לִרְעוֹת
  choice: um … zu hüten
  rationale: Das Verb רעה bezeichnet die Tätigkeit eines Hirten. „Hüten“ ist im Deutschen die natürliche verbale Verbindung mit „Herde“.
- source_word: צֹאן אָבִיו
  choice: die Herde seines Vaters
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, häufig Schafe und Ziegen. „Herde“ vermeidet eine unbegründete Beschränkung auf Schafe.
- source_word: בֵּית לָחֶם
  choice: Bethlehem
  rationale: Verwendet die im Deutschen etablierte Form des Ortsnamens.
- source_word: וְ
  choice: unmarkiert
  rationale: Das deutsche Satzgefüge benötigt hier keinen eigens wiedergegebenen Konnektor; ein „nun“ würde ein im Hebräischen nicht ausdrücklich vorhandenes Zeitsignal nahelegen.
