source:
  edition: WLC
  text: ו/חץ חֲנִית֗/וֹ כִּ/מְנוֹר֙ אֹֽרְגִ֔ים וְ/לַהֶ֣בֶת חֲנִית֔/וֹ שֵׁשׁ מֵא֥וֹת שְׁקָלִ֖ים בַּרְזֶ֑ל וְ/נֹשֵׂ֥א הַ/צִּנָּ֖ה הֹלֵ֥ךְ לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/007.yaml
  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: de
  text: Der Schaft seines Speeres war wie ein Webbaum, und die eiserne Spitze seines Speeres wog sechshundert Schekel. Der Schildträger[a] ging vor ihm her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sein kann ein großer Schild, der den ganzen Körper deckte, nicht nur ein kleiner Handschild.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חֲנִיתוֹ
  choice: der Schaft seines Speeres
  rationale: חץ bezeichnet hier im Zusammenhang mit dem Speer und dem Vergleich mit einem Webbaum den langen Schaft der Waffe, nicht einen Pfeil.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: wie ein Webbaum
  rationale: Die Formulierung bewahrt das anschauliche Bild eines massiven Bauteils am Webstuhl und gibt den Vergleich knapp und idiomatisch wieder.
- source_word: לַהֶבֶת חֲנִיתוֹ
  choice: die Spitze seines Speeres
  rationale: לַהֶבֶת bezeichnet den schneidenden beziehungsweise durchbohrenden Metallteil der Waffe. Bei einem Speer ist „Spitze“ im heutigen Deutsch natürlicher als „Klinge“.
- source_word: שֵׁשׁ מֵאוֹת שְׁקָלִים בַּרְזֶל
  choice: die eiserne Spitze … wog sechshundert Schekel
  rationale: Der hebräische Ausdruck ist elliptisch („sechshundert Schekel Eisen“). „wog“ macht die gemeinte Gewichtsangabe im Deutschen ausdrücklich; „eisern“ bezeichnet das Material der Speerspitze.
- source_word: נֹשֵׂא הַצִּנָּה
  choice: ein Träger des Schildes
  rationale: Die Wendung bezeichnet den Begleiter, der Goliaths Schild trug. Die Formulierung bleibt nah an der hebräischen Struktur und ist gut verständlich.
- source_word: הַצִּנָּה
  choice: der Schild
  rationale: צִנָּה kann speziell einen großen, den Körper deckenden Schild bezeichnen. Im Haupttext steht die allgemeine, natürliche Bezeichnung; die genauere mögliche Nuance wird in der Fußnote genannt.
- source_word: הֹלֵךְ לְפָנָיו
  choice: ging vor ihm her
  rationale: Dies gibt die fortlaufende Bewegung des Begleiters vor Goliath natürlich und eng am Hebräischen wieder.
theological_decisions: []
