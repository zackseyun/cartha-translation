source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל רֹעֶ֨ה הָיָ֧ה עַבְדְּ/ךָ֛ לְ/אָבִ֖י/ו בַּ/צֹּ֑אן וּ/בָ֤א הָֽ/אֲרִי֙ וְ/אֶת הַ/דּ֔וֹב וְ/נָשָׂ֥א שֶׂ֖ה מֵ/הָ/עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: de
  text: 'David sagte zu Saul: »Dein Knecht hütete die Schafe seines Vaters, und wenn ein Löwe oder ein Bär[a] kam und ein Tier[b] aus der Herde wegtrug,«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der Löwe und der Bär«; wahrscheinlich ist die Aussage distributiv gemeint: Das eine oder das andere Raubtier kam.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ein Lamm« oder »ein Schaf«. Das hebräische Wort kann allgemein ein einzelnes Stück Kleinvieh bezeichnen und auch eine Ziege einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: hütete
  rationale: Die Verbindung aus Partizip und היה beschreibt Davids andauernde Tätigkeit als Hirte. Das deutsche Verb „hütete“ gibt dies natürlich und präzise wieder.
- source_word: עַבְדְּךָ
  choice: dein Knecht
  rationale: Im Gespräch mit dem König ist dies eine konventionelle demütige Selbstbezeichnung. „Knecht“ bewahrt den höfischen Ton, ohne hier unnötig den rechtlichen Status eines Sklaven hervorzuheben.
- source_word: לְאָבִיו בַּצֹּאן
  choice: für seinen Vater die Schafe
  rationale: Die Präposition ל bezeichnet hier die Beziehung beziehungsweise den Dienst für den Vater; בַּצֹּאן gehört sachlich zur Hirtentätigkeit. Die deutsche Formulierung ist knapp und idiomatisch.
- source_word: וּבָא
  choice: wenn dann … kam
  rationale: Im Rückblick kann die Form ein wiederkehrendes Geschehen schildern. Die Konstruktion mit „wenn dann“ macht diesen möglichen habituellen Sinn deutlich und führt zugleich natürlich in den unvollständigen, im Folgevers fortgesetzten Satz.
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: ein Löwe oder ein Bär
  rationale: Obwohl der hebräische Text formal „der Löwe und den Bären“ verbindet, ist wahrscheinlich eine distributive Aussage über jeweils einen der beiden möglichen Räuber gemeint. Der unbestimmte Artikel entspricht dem natürlichen Deutschen bei einem typischen Fall.
- source_word: וְנָשָׂא
  choice: fortschleppte
  rationale: נשא bezeichnet hier das Wegtragen eines erbeuteten Tieres. „Fortschleppen“ gibt die räuberische Handlung anschaulich wieder.
- source_word: שֶׂה
  choice: ein Tier
  rationale: שֶׂה kann ein einzelnes Tier aus dem Kleinvieh bezeichnen, nicht ausschließlich ein junges Schaf. „Ein Tier“ hält diese lexikalische Weite offen; die Zugehörigkeit zur Schafherde wird aus dem Zusammenhang klar.
- source_word: מֵהָעֵדֶר
  choice: aus der Herde
  rationale: עֵדֶר bezeichnet hier den gehüteten Tierverband. „Herde“ ist im modernen Deutschen für eine Schafherde geläufig und vermeidet das weniger allgemein verständliche „Trift“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher mündlicher Erzählweise. Die mit dem Folgevers fortgesetzte Satzstruktur bleibt durch das abschließende Komma erhalten. Die Wiederholung „die Schafe … aus der Herde“ spiegelt den Sachzusammenhang, ohne das Hebräische unnötig steif nachzubilden.
