  source_fidelity: 'Die Grundbedeutung ist zutreffend: David bezeichnet sich gegenüber Saul demütig als dessen Knecht, beschreibt seine frühere fortdauernde Hirtentätigkeit für seinen Vater und berichtet von einem Löwen beziehungsweise Bären, der ein Tier aus der Herde nahm. Die distributive Wiedergabe „ein Löwe oder ein Bär“ ist angesichts des Kontextes gut vertretbar und wird sachgerecht erläutert. „Fortschleppte“ legt jedoch ein Ziehen/Schleifen nahe; נשא bezeichnet hier primär das Aufnehmen und Wegtragen der Beute.'
  naturalness: „Dein Knecht hütete die Schafe seines Vaters“ ist im modernen Standarddeutsch idiomatischer und eindeutiger als die Trennung „hütete für seinen Vater die Schafe“. Die Verbindung „und wenn … kam“ gibt eine wiederholte typische Situation natürlicher wieder als „Wenn dann … kam“. „Wegtrug“ ist sowohl natürlich als auch semantisch genauer als „fortschleppte“.
  terminology: „Knecht“ trifft die höfisch-demütige Selbstbezeichnung in diesem königlichen Gespräch angemessen. „Herde“ ist passend. „Ein Tier“ hält die Breite von שֶׂה offen; die Fußnote sollte aber präzise von Kleinvieh sprechen und nicht die Formulierung „auch möglich“ so behandeln, als seien „Lamm“ und „Schaf“ gleichermaßen direkte, uneingeschränkte Entsprechungen.
