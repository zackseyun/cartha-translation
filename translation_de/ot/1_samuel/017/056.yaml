  text: And the king said[a], “You, inquire whose son this young man is.”
translation:
  language: de
  text: 'Und der König sagte: »Erkundige du dich, wessen Sohn dieser junge Mann ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und ... sagte
  rationale: Das narrative Waw führt die Handlung fort; »Und ... sagte« bewahrt den hebräischen Erzählfluss.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird entsprechend dem Hebräischen wiedergegeben, ohne den Namen Saul einzusetzen.
- source_word: שְׁאַל
  choice: Erkundige ... dich
  rationale: Der Imperativ von שׁאל bezeichnet hier das Nachfragen beziehungsweise Einholen einer Auskunft; »sich erkundigen« ist im Deutschen natürlich und wahrt diesen Vorgang.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen trägt Nachdruck; die ungewöhnlichere Stellung »Erkundige du dich« macht diesen im Deutschen hörbar.
- source_word: בֶּן מִי
  choice: wessen Sohn
  rationale: Dies ist die direkte und idiomatische deutsche Entsprechung der Frage nach der väterlichen Abstammung.
- source_word: זֶה
  choice: dieser
  rationale: Das maskuline Demonstrativpronomen verweist unmittelbar auf den gemeinten jungen Mann.
- source_word: הָעָלֶם
  choice: junge Mann
  rationale: Die Bezeichnung meint einen jungen männlichen Menschen; »junger Mann« ist modern, klar und würdevoll.
