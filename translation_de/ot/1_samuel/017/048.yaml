  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Vorwärtsbewegung beider Gegner bleibt erhalten; eine unnötige Ergänzung wie „Vorkämpfer“ wurde vermieden.
