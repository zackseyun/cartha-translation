  text: וְ/הָיָה֙ כִּֽי קָ֣ם הַ/פְּלִשְׁתִּ֔י וַ/יֵּ֥לֶךְ וַ/יִּקְרַ֖ב לִ/קְרַ֣את דָּוִ֑ד וַ/יְמַהֵ֣ר דָּוִ֔ד וַ/יָּ֥רָץ הַ/מַּעֲרָכָ֖ה לִ/קְרַ֥את הַ/פְּלִשְׁתִּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/048.yaml
  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: de
  text: Als der Philister aufstand, losging und sich David näherte, beeilte sich David und lief auf die Schlachtreihe[a] zu, dem Philister entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die Schlachtordnung“ beziehungsweise „auf die Reihen“. Das hebräische Wort kann eine Schlachtreihe oder eine militärische Aufstellung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet das nächste Geschehen mit zeitlicher Bedeutung ein; „Als“ gibt dies im Deutschen natürlich und knapp wieder.
- source_word: קָם
  choice: sich erhob
  rationale: Das Verb bezeichnet das Aufstehen oder Sich-Erheben und bewahrt hier den Beginn der Bewegung.
- source_word: הַפְּלִשְׁתִּי
  choice: der Philister
  rationale: Der Ausgangstext nennt ihn schlicht „den Philister“; „Vorkämpfer“ würde Kontext aus anderen Versen eintragen.
- source_word: וַיֵּלֶךְ וַיִּקְרַב
  choice: herankam
  rationale: Die beiden aufeinanderfolgenden Bewegungsverben beschreiben sein Kommen und Näherkommen. Die gebündelte Wiedergabe vermeidet im Deutschen eine schwerfällige Doppelung, ohne die Bewegungsrichtung zu verlieren.
- source_word: לִקְרַאת דָּוִד
  choice: David entgegenging
  rationale: לִקְרַאת bezeichnet eine Bewegung auf eine Begegnung hin; „entgegenging“ ist hier idiomatisch und lässt den feindlichen Charakter aus dem Kontext hervorgehen.
- source_word: וַיְמַהֵר
  choice: beeilte sich
  rationale: Das Verb drückt schnelles, entschlossenes Handeln aus; die Formulierung ist modern und würdig.
- source_word: וַיָּרָץ
  choice: lief
  rationale: Das Verb bedeutet unmittelbar „laufen/rennen“. Zusammen mit „beeilte sich“ vermittelt „lief“ die rasche Bewegung ohne unnötige Verstärkung.
- source_word: הַמַּעֲרָכָה
  choice: Schlachtreihe
  rationale: Das Substantiv kann eine militärische Aufstellung, Reihe oder Schlachtordnung bezeichnen. „Schlachtreihe“ ist anschaulich und wahrt die lexikalische Mehrdeutigkeit durch eine Fußnote.
- source_word: לִקְרַאת הַפְּלִשְׁתִּי
  choice: dem Philister entgegen
  rationale: Die Wendung bezeichnet Davids gerichtete Bewegung zur Begegnung mit dem Philister; „entgegen“ gibt dies im Deutschen prägnant wieder.
