lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: stellten sich auf
  rationale: ערך bezeichnet hier im militärischen Zusammenhang das geordnete Aufstellen zum Kampf. Die deutsche Wendung ist natürlich und gibt die kollektive Handlung trotz der hebräischen Singularform angemessen wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der überlieferte Volksname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: וּפְלִשְׁתִּים
  choice: und die Philister
  rationale: Die übliche deutsche Bezeichnung der Volksgruppe.
- source_word: מַעֲרָכָה
  choice: Schlachtreihe
  rationale: Das Substantiv bezeichnet hier eine geordnete militärische Aufstellung beziehungsweise Kampflinie. »Schlachtreihe« bewahrt das konkrete militärische Bild.
- source_word: לִקְרַאת
  choice: gegen
  rationale: Wörtlich bezeichnet die Präposition eine Bewegung oder Ausrichtung auf eine Begegnung hin; zwischen zwei Heeresaufstellungen hat sie einen gegenüberstellenden, feindlichen Sinn.
- source_word: מַעֲרָכָה
  choice: Schlachtreihe
  rationale: Die identische Wiedergabe erhält die auffällige Wiederholung des hebräischen Ausdrucks und das Bild zweier einander gegenüberstehender Formationen.
