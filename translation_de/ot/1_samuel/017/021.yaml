  text: And Israel and the Philistines drew up battle line against battle line[a].
translation:
  language: de
  text: Israel und die Philister stellten sich in Schlachtreihe gegen Schlachtreihe auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schlachtordnung gegen Schlachtordnung« oder »Kampfformation gegenüber Kampfformation«.'
