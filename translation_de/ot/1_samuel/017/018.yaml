  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: de
  text: Bring auch diese zehn Käseportionen zum Anführer der Tausendschaft, erkundige dich, wie es deinen Brüdern geht, und nimm ein Zeichen von ihnen mit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nimm ihr Pfand mit“ oder „nimm ein Unterpfand von ihnen mit“. Gemeint ist möglicherweise ein Gegenstand oder Zeichen als Nachweis ihres Wohlergehens; die genaue Bedeutung des hebräischen Wortes ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: Käselaibe
  rationale: Die Wendung bezeichnet geformte beziehungsweise abgeteilte Käseportionen. „Käselaibe“ ist im Deutschen konkret, natürlich und passt zur zählbaren Mehrzahl.
- source_word: שַׂר הָאָלֶף
  choice: Anführer der Tausendschaft
  rationale: שַׂר bezeichnet den militärischen Führer; אֶלֶף ist hier eine Einheit, traditionell eine Tausendschaft. Die Wiedergabe erhält die antike Gliederung, ohne eine moderne exakte Truppenstärke zu behaupten.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: erkundige dich, wie es deinen Brüdern geht
  rationale: Die Verbindung meint hier, ihren Zustand beziehungsweise ihr Wohlergehen festzustellen. Die deutsche Formulierung gibt dies idiomatisch wieder.
- source_word: עֲרֻבָּתָם
  choice: ein Unterpfand von ihnen
  rationale: Das seltene Wort kann ein Pfand, Unterpfand oder Beweiszeichen bezeichnen. „Unterpfand“ bewahrt die konkrete, aber im Kontext nicht völlig eindeutige Bedeutung.
- source_word: וְאֵת
  choice: auch
  rationale: Das einleitende ו setzt die weitere Anweisung additiv fort; „auch“ bildet diesen Zusammenhang natürlich ab.
- source_word: תָּבִיא
  choice: Bring
  rationale: Im Zusammenhang soll David die Lebensmittel zum Lager befördern; „bringen“ ist im Deutschen die natürliche Wiedergabe.
- source_word: תִּקָּח
  choice: nimm … mit
  rationale: לקח bedeutet grundsätzlich „nehmen“. „Mitnehmen“ passt zur Rückkehr zu Isai, ohne die im Verb selbst nicht ausdrücklich markierte Richtung mit „zurückbringen“ zu stark auszudeuten.
