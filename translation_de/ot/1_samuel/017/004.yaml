source:
  edition: WLC
  text: וַ/יֵּצֵ֤א אִֽישׁ הַ/בֵּנַ֨יִם֙ מִ/מַּחֲנ֣וֹת פְּלִשְׁתִּ֔ים גָּלְיָ֥ת שְׁמ֖/וֹ מִ/גַּ֑ת גָּבְה֕/וֹ שֵׁ֥שׁ אַמּ֖וֹת וָ/זָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: de
  text: Da trat ein Vorkämpfer aus den Lagern der Philister hervor[a]. Er hieß Goliat und stammte aus Gat. Er war sechs Ellen und eine Spanne groß[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »ein Mann des Zwischenraums«. Gemeint ist wahrscheinlich ein repräsentativer Kämpfer, der zwischen die Schlachtreihen tritt.'
    reason: lexical_alternative
  - marker: b
    text: Sechs Ellen und eine Spanne entsprechen je nach zugrunde gelegter Ellenlänge ungefähr 3,0 Metern.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: Vorkämpfer
  rationale: Die ungewöhnliche Wendung bedeutet wörtlich etwa »Mann des Zwischenraums« und bezeichnet hier wohl einen repräsentativen Kämpfer, der zwischen die Schlachtreihen tritt. »Vorkämpfer« gibt diese Funktion in natürlichem Deutsch wieder, ohne den möglichen Einzelkampf stärker festzulegen als der Kontext.
- source_word: וַיֵּצֵא
  choice: Da trat … hervor
  rationale: Das Verb bezeichnet das Herausgehen. Im erzählerischen Zusammenhang gibt »trat … hervor« anschaulich und idiomatisch wieder, dass der Kämpfer aus dem philistäischen Lager zwischen die Fronten tritt.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: aus den Lagern der Philister
  rationale: Der hebräische Text verwendet ausdrücklich den Plural »Lager«. Dieser wird bewahrt; »Philister« ist die etablierte deutsche Bezeichnung des Volkes.
- source_word: גָּלְיָת שְׁמוֹ
  choice: Er hieß Goliat
  rationale: Dies ist eine natürliche moderne Wiedergabe der hebräischen Namensformel »sein Name war Goliat«.
- source_word: מִגַּת
  choice: stammte aus Gat
  rationale: Der Herkunftsort wird im Hebräischen direkt mit »aus Gat« angegeben. »Stammte aus Gat« macht die Herkunftsangabe im Deutschen eindeutig.
- source_word: גָּבְהוֹ
  choice: Er war … groß
  rationale: Das Substantiv mit Suffix bezeichnet seine Körperhöhe. Die deutsche Größenkonstruktion ist natürlicher als »Seine Höhe betrug«.
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: sechs Ellen und eine Spanne
  rationale: Die antiken Maßeinheiten bleiben im Haupttext erhalten; eine ungefähre Umrechnung wird in der Fußnote geboten.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der ungewöhnliche hebräische Ausdruck wird funktional mit »Vorkämpfer« wiedergegeben und in einer Fußnote transparent gemacht. Die pluralische Form »Lager« und die antiken Maße bleiben erhalten.
