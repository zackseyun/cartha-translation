  source_fidelity: 'Der Text gibt die beiden hebräischen Nominalangaben vollständig und präzise wieder: מִצְחַת als „Beinschienen“, נְחֹשֶׁת als „bronzen“, עַל־רַגְלָיו als „an den Beinen“ und בֵּין כְּתֵפָיו wörtlich als „zwischen den Schultern“. „Wurfspieß“ ist für כִידוֹן eine gut vertretbare Kontextentscheidung; die Fußnote wahrt die lexikalische Unsicherheit und nennt „Speer“ als Alternative. Die nicht ausdrücklich ausgedrückte Trageweise wird nicht hinzugefügt.'
