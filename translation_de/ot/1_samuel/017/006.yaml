  text: וּ/מִצְחַ֥ת נְחֹ֖שֶׁת עַל רַגְלָ֑י/ו וְ/כִיד֥וֹן נְחֹ֖שֶׁת בֵּ֥ין כְּתֵפָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/006.yaml
  text: And he had bronze greaves on his legs[a], and a bronze javelin between his shoulders.
translation:
  language: de
  text: An den Beinen trug er bronzene Beinschienen und zwischen den Schultern einen bronzenen Wurfspieß.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen bronzenen Speer“. Das hebräische Wort kann eine leichtere, speerartige Waffe bezeichnen. Es wurde auch als eine andere Waffenart verstanden, doch „Wurfspieß“ passt hier am besten zum Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: Beinschienen
  rationale: Das Substantiv bezeichnet einen Schutz für die Unterschenkel. Der deutsche Plural entspricht der natürlichen Bezeichnung für das an beiden Beinen getragene Rüstungsteil.
- source_word: נְחֹשֶׁת
  choice: bronzen
  rationale: Im militärischen Zusammenhang bezeichnet das Wort wahrscheinlich Bronze, den damals üblichen Werkstoff für Waffen und Rüstung; „Messing“ wäre anachronistisch, „Kupfer“ hier weniger wahrscheinlich.
- source_word: עַל רַגְלָיו
  choice: an den Beinen
  rationale: רֶגֶל kann Fuß oder Bein bezeichnen; bei Beinschienen ist eindeutig der Beinbereich gemeint.
- source_word: כִידוֹן
  choice: Wurfspieß
  rationale: Das Wort bezeichnet wahrscheinlich eine leichtere, speerartige Waffe und wird so vom größeren Speer im weiteren Zusammenhang unterschieden. Da die genaue Waffenart unsicher ist, wird die Alternative in einer Fußnote bewahrt.
- source_word: בֵּין כְּתֵפָיו
  choice: zwischen den Schultern
  rationale: Die wörtliche räumliche Angabe wird bewahrt; eine Trageweise wie „über den Rücken gehängt“ ist im Hebräischen nicht ausdrücklich genannt.
theological_decisions: []
translation_notes:
