  text: וּ/כְ/שׁ֣וּב דָּוִ֗ד מֵֽ/הַכּוֹת֙ אֶת הַ/פְּלִשְׁתִּ֔י וַ/יִּקַּ֤ח אֹת/וֹ֙ אַבְנֵ֔ר וַ/יְבִאֵ֖/הוּ לִ/פְנֵ֣י שָׁא֑וּל וְ/רֹ֥אשׁ הַ/פְּלִשְׁתִּ֖י בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: de
  text: Als David zurückkehrte, nachdem er den Philister erschlagen hatte, nahm Abner ihn mit und brachte ihn vor Saul. Dabei hielt David den Kopf des Philisters in der Hand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und der Kopf des Philisters war in seiner Hand.“ Das Hebräische hat hier einen Satz ohne ausgedrücktes Verb, der auch als Begleitumstand wiedergegeben werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: Als David zurückkehrte
  rationale: Die Verbindung aus Konjunktion, כְּ und Infinitivus constructus von שׁוב leitet einen temporalen Nebensatz ein. „Als ... zurückkehrte“ ist im Deutschen natürlich und gibt den zeitlichen Zusammenhang präzise wieder.
- source_word: מֵהַכּוֹת
  choice: nachdem er ... erschlagen hatte
  rationale: נכה bezeichnet hier das tödliche Niederschlagen des Philisters. „Erschlagen“ bewahrt die konkrete und tödliche Bedeutung im Kontext, ohne den Vorgang auf ein bloßes Besiegen abzuschwächen.
- source_word: הַפְּלִשְׁתִּי
  choice: den Philister
  rationale: Der hebräische Text nennt ihn schlicht „den Philister“. Die Übersetzung setzt weder „Goliat“ noch „Vorkämpfer“ ein und bleibt damit bei der Ausdrucksweise der Quelle.
- source_word: וַיִּקַּח אֹתוֹ
  choice: nahm Abner ihn mit
  rationale: לקח bedeutet grundsätzlich „nehmen“. Das deutsche „nahm ... mit“ passt hier natürlich zur anschließenden Bewegung zu Saul, ohne die Bedeutung gewaltsam als „packte“ zuzuspitzen.
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: brachte ihn vor Saul
  rationale: Das Hifil von בוא bedeutet „bringen“, und לִפְנֵי wird in diesem Zusammenhang treffend mit „vor“ wiedergegeben.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: Dabei hielt David den Kopf des Philisters in der Hand
  rationale: Der verblosen hebräischen Begleitsatz wird als natürlicher deutscher Umstandssatz wiedergegeben. David wird zur Vermeidung eines missverständlichen Bezugs ausdrücklich genannt; aus dem Zusammenhang ist er der Träger des Kopfes.
