base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: de
  text: Wenn er imstande ist, mit mir zu kämpfen und mich niederzuschlagen[a], werden wir eure Sklaven[b] sein. Wenn aber ich ihn überwältigen kann[c] und ihn niederschlage, werdet ihr unsere Sklaven sein und uns dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „niederschlagen“ wiedergegebene Verb kann in diesem Zusammenhang auch „töten“ oder „besiegen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Diener“. Das hebräische Wort bezeichnet hier Menschen, die infolge militärischer Unterwerfung zu unfreiem Dienst verpflichtet werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „wenn ich gegen ihn imstande bin“; gemeint ist die Fähigkeit, sich im Kampf gegen ihn durchzusetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל
  choice: imstande ist
  rationale: יכל bezeichnet hier die Fähigkeit, die Herausforderung zum Zweikampf zu bestehen; „imstande ist“ wahrt die konditionale Form.
- source_word: לְהִלָּחֵם אִתִּי
  choice: mit mir zu kämpfen
  rationale: Der Niphal-Infinitiv von לחם mit אִתִּי bezeichnet den gegenseitigen Kampf und wird im Deutschen natürlich mit „mit mir kämpfen“ wiedergegeben.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: mich/ihn niederzuschlagen
  rationale: נכה bezeichnet einen entscheidenden Schlag und kann kontextuell auch Töten oder Besiegen einschließen; „niederschlagen“ erhält diese Offenheit und bildet beide parallelen Aussagen gleich ab.
- source_word: לַעֲבָדִים
  choice: Sklaven
  rationale: עֲבָדִים bezeichnet hier die erzwungene Unterwerfung eines Volkes nach dem Kampf; „Sklaven“ bringt den unfreien Status deutlicher zum Ausdruck als „Diener“.
- source_word: אֲנִי אוּכַל לוֹ
  choice: ich ihm gewachsen bin
  rationale: יכל mit ל kann das Vermögen ausdrücken, sich gegen jemanden durchzusetzen. „Ihm gewachsen sein“ bewahrt den Fähigkeitsaspekt und passt idiomatisch zum Zweikampf, ohne den folgenden entscheidenden Schlag vorwegzunehmen.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: und uns dienen
  rationale: Das Verb עבד bezeichnet den Dienst, den die unterworfene Seite leisten soll; „uns dienen“ ist präzise und natürlich.
