  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erkennbar; „Sklaven“ macht die erzwungene nationale Unterwerfung deutlich, während die Fußnote die traditionelle Alternative „Diener“ dokumentiert.
