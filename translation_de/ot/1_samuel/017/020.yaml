  text: וַ/יַּשְׁכֵּ֨ם דָּוִ֜ד בַּ/בֹּ֗קֶר וַ/יִּטֹּ֤שׁ אֶת הַ/צֹּאן֙ עַל שֹׁמֵ֔ר וַ/יִּשָּׂ֣א וַ/יֵּ֔לֶךְ כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יִשָׁ֑י וַ/יָּבֹא֙ הַ/מַּעְגָּ֔לָ/ה וְ/הַ/חַ֗יִל הַ/יֹּצֵא֙ אֶל הַ/מַּ֣עֲרָכָ֔ה וְ/הֵרֵ֖עוּ בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: de
  text: Da stand David früh am Morgen auf, ließ die Schafe bei einem Hüter, nahm die Vorräte und machte sich auf den Weg, genau wie Isai ihm befohlen hatte. Als er zum Lager[a] kam, zogen die Truppen gerade zur Schlachtreihe hinaus und stießen den Schlachtruf aus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „zum Lagerkreis“ beziehungsweise „zum Wagenwall“. Das hebräische Wort kann genauer die kreisförmige Anlage oder die befestigte Umgrenzung des Lagers bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und sie riefen im beziehungsweise zum Kampf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: Da stand David früh am Morgen auf
  rationale: Die Verbindung bezeichnet frühes Aufstehen beziehungsweise einen frühen Aufbruch. Die deutsche Formulierung bewahrt den zeitlichen Nachdruck und klingt natürlich.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: ließ die Schafe bei einem Hüter
  rationale: Die Wendung besagt, dass David die Schafe der Obhut eines anderen überließ. „Hüter“ passt zum Hirtenkontext und bleibt nahe am hebräischen Ausdruck.
- source_word: וַיִּשָּׂא
  choice: nahm die Vorräte
  rationale: Das Verb bedeutet wörtlich „hob auf/nahm“. Sein unausgesprochenes Objekt ergibt sich aus den im vorherigen Vers genannten Lebensmitteln; „die Vorräte“ macht diesen Bezug verständlich.
- source_word: וַיֵּלֶךְ
  choice: machte sich auf den Weg
  rationale: Diese idiomatische deutsche Wiedergabe drückt den Beginn von Davids Weg klar aus, ohne zusätzliche inhaltliche Bestimmungen einzuführen.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: genau wie Isai ihm befohlen hatte
  rationale: צוה bezeichnet ein Befehlen oder Anweisen. „Genau wie“ gibt כַּאֲשֶׁר wieder und hebt Davids Ausführung des Auftrags hervor.
- source_word: הַמַּעְגָּלָה
  choice: zum Lager
  rationale: Das Substantiv bezeichnet hier den Lagerbereich, möglicherweise genauer dessen kreisförmige oder befestigte Umgrenzung. „Lager“ ist im Haupttext klar; die konkreteren Möglichkeiten stehen in der Fußnote.
- source_word: הַחַיִל
  choice: die Truppen
  rationale: Im militärischen Zusammenhang bezeichnet das Wort die Streitmacht. Der deutsche Plural ermöglicht zugleich einen natürlichen Anschluss an das folgende hebräische Verb im Plural.
- source_word: הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: zogen gerade zur Schlachtreihe hinaus
  rationale: Das Partizip beschreibt eine bei Davids Ankunft ablaufende Handlung. מַעֲרָכָה bezeichnet die geordnete Schlachtaufstellung beziehungsweise Schlachtreihe.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: stießen den Schlachtruf aus
  rationale: Das Hifil von רוע bezeichnet hier lautes Rufen im Kampf. Die gewählte Wendung vermittelt die militärische Funktion des Rufes, während die wörtlichere Konstruktion in der Fußnote erhalten bleibt.
