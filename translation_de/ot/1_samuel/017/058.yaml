  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שָׁא֔וּל בֶּן מִ֥י אַתָּ֖ה הַ/נָּ֑עַר וַ/יֹּ֣אמֶר דָּוִ֔ד בֶּֽן עַבְדְּ/ךָ֥ יִשַׁ֖י בֵּ֥ית הַלַּחְמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: de
  text: 'Saul sagte zu ihm: „Wessen Sohn bist du, junger Mann?“ David sagte: „Ich bin der Sohn deines Dieners Isai aus Bethlehem.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Der Sohn deines Dieners Isai aus Bethlehem.“ Im Hebräischen fehlt das ausdrückliche Verb „bin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: Wessen Sohn
  rationale: Die hebräische Wendung fragt ausdrücklich nach der väterlichen Abstammung. „Wessen Sohn“ ist im Deutschen natürlich und bewahrt diesen genealogischen Schwerpunkt.
- source_word: הַנָּעַר
  choice: junger Mann
  rationale: נַעַר kann je nach Zusammenhang einen Jungen, Jugendlichen oder jungen Mann bezeichnen. Hier gibt „junger Mann“ Davids Jugend wieder, ohne ihn als kleines Kind erscheinen zu lassen.
- source_word: עַבְדְּךָ
  choice: deines Dieners
  rationale: עֶבֶד kann „Sklave“ oder „Diener“ bedeuten; hier ist es eine ehrerbietige höfische Selbstbezeichnung. „Diener“ gibt diese Funktion angemessen wieder.
- source_word: בֵּית הַלַּחְמִי
  choice: aus Bethlehem
  rationale: Die Herkunftsbezeichnung identifiziert Isai als Mann aus Bethlehem. „Aus Bethlehem“ ist im modernen Deutsch natürlicher als „der Bethlehemiter“.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: sagte ... sagte
  rationale: Beide Sätze verwenden dasselbe allgemeine hebräische Verb אמר. Die Wiederholung bleibt quellennah; Frage und Antwort werden durch den Inhalt deutlich.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: Ich bin der Sohn deines Dieners Isai
  rationale: Im Hebräischen steht eine nominale Antwort ohne ausdrücklich formuliertes Verb. Das ergänzte „Ich bin“ ergibt einen vollständigen, natürlichen deutschen Satz, ohne den Sinn zu verändern.
