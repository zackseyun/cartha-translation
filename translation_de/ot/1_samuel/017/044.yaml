  text: וַ/יֹּ֥אמֶר הַ/פְּלִשְׁתִּ֖י אֶל דָּוִ֑ד לְכָ֣/ה אֵלַ֔/י וְ/אֶתְּנָה֙ אֶת בְּשָׂ֣רְ/ךָ֔ לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הַ/שָּׂדֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: de
  text: 'Und der Philister sagte zu David: „Komm her zu mir! Dann werde ich dein Fleisch den Vögeln am Himmel und den Tieren auf dem Feld geben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: der Philister
  rationale: Der bestimmte Ausdruck bezeichnet hier Goliat als Angehörigen und Repräsentanten der Philister; „Krieger“ wäre eine kontextuelle Ergänzung, die im Vers nicht ausdrücklich steht.
- source_word: לְכָה אֵלַי
  choice: Komm her zu mir!
  rationale: Der Imperativ mit Richtungsangabe ist eine direkte, herausfordernde Aufforderung. „Komm her zu mir“ klingt im modernen Deutschen natürlich und bewahrt den höhnischen Ton.
- source_word: וְאֶתְּנָה
  choice: Dann werde ich … geben
  rationale: Die Form drückt hier im Anschluss an die Aufforderung eine entschlossene Drohung aus. „Dann werde ich“ gibt die logische Folge und den starken Zukunftssinn idiomatisch wieder.
- source_word: בְּשָׂרְךָ
  choice: dein Fleisch
  rationale: Die wörtliche Wiedergabe bewahrt die drastische Vorstellung der angekündigten Schändung des Leichnams; „Körper“ wäre weniger bildkräftig, „Kadaver“ stärker interpretierend.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: den Vögeln am Himmel
  rationale: עוֹף bezeichnet hier natürlich die Vögel; „am Himmel“ gibt den hebräischen Ausdruck in geläufigem modernem Deutsch wieder.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: und den Tieren auf dem Feld
  rationale: בְּהֵמָה kann allgemein „Tier“ bedeuten. „Tiere auf dem Feld“ ist verständlich und bildet die räumliche Parallele zu den Vögeln am Himmel ab, ohne „wild“ oder „Raubtiere“ hinzuzufügen.
