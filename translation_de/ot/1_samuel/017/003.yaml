  text: וּ/פְלִשְׁתִּ֞ים עֹמְדִ֤ים אֶל הָ/הָר֙ מִ/זֶּ֔ה וְ/יִשְׂרָאֵ֛ל עֹמְדִ֥ים אֶל הָ/הָ֖ר מִ/זֶּ֑ה וְ/הַ/גַּ֖יְא בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: de
  text: Die Philister standen auf einem Berg[a] auf der einen Seite, und Israel stand auf einem Berg auf der anderen Seite; das Tal[b] lag zwischen ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Hügel“; das hebräische Wort הַר kann je nach Zusammenhang einen Berg oder einen Hügel bezeichnen. Das gilt für beide Vorkommen in diesem Vers.
    reason: lexical_alternative
  - marker: b
    text: Oder „Schlucht“; das hebräische Wort גַּיְא kann ein Tal mit steilen Seiten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Die Philister
  rationale: Der Volksname wird in der üblichen deutschen Form wiedergegeben. Das einleitende ו wird nicht eigens mit „und“ übersetzt, da der Satz im Deutschen als neue Szenenbeschreibung natürlich einsetzt, ohne dass dadurch ein zeitliches Signal hinzugefügt wird.
- source_word: עֹמְדִים
  choice: standen
  rationale: Das Partizip beschreibt die andauernde Stellung der beiden Heere. Das deutsche Präteritum „standen“ gibt diesen Zustand in einer Erzählung natürlich wieder.
- source_word: אֶל הָהָר מִזֶּה
  choice: auf dem Berg auf der einen Seite
  rationale: Bei עמד bezeichnet אֶל hier die räumliche Stellung zum Berg. מִזֶּה wird im Gegenüber der beiden Heere idiomatisch als „auf der einen Seite“ wiedergegeben. הַר kann je nach Gelände Berg oder Hügel bedeuten.
- source_word: וְיִשְׂרָאֵל
  choice: und Israel
  rationale: „Israel“ bleibt entsprechend dem Hebräischen als kollektive Bezeichnung für das Volk beziehungsweise Heer erhalten.
- source_word: עֹמְדִים
  choice: stand
  rationale: Das hebräische Prädikat steht im Plural, weil „Israel“ kollektiv aufgefasst wird. Im Deutschen verlangt der Eigenname als kollektives Singularsubjekt natürlicherweise „stand“.
- source_word: אֶל הָהָר מִזֶּה
  choice: auf dem Berg auf der anderen Seite
  rationale: Die Wiederholung wird parallel zur ersten Ortsangabe wiedergegeben; aus dem Gegensatz ergibt sich im Deutschen „auf der anderen Seite“.
- source_word: וְהַגַּיְא
  choice: das Tal lag
  rationale: גַּיְא kann ein Tal oder eine Schlucht bezeichnen. „Tal“ ist die allgemeinere Wiedergabe. Das ergänzte „lag“ macht den abschließenden hebräischen Nominalsatz im Deutschen vollständig, ohne zusätzliche Sachinformation einzuführen.
- source_word: בֵּינֵיהֶם
  choice: zwischen ihnen
  rationale: Die Präpositionalphrase bezeichnet unmittelbar die Lage des Tals zwischen den beiden Heeren.
