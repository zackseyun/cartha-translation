  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד לֹ֤א תוּכַל֙ לָ/לֶ֨כֶת֙ אֶל הַ/פְּלִשְׁתִּ֣י הַ/זֶּ֔ה לְ/הִלָּחֵ֖ם עִמּ֑/וֹ כִּֽי נַ֣עַר אַ֔תָּה וְ/ה֛וּא אִ֥ישׁ מִלְחָמָ֖ה מִ/נְּעֻרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: de
  text: 'Saul sagte zu David: „Du kannst nicht gegen diesen Philister antreten und mit ihm kämpfen; denn du bist ein junger Mann[a], er aber ist von Jugend an ein Krieger.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Jugendlicher“ oder, je nach Zusammenhang, „Junge“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Du kannst nicht
  rationale: Gibt die im Hebräischen ausgedrückte Unfähigkeit natürlich und direkt wieder, nicht ein bloßes Verbot.
- source_word: לָלֶכֶת אֶל
  choice: gegen … antreten
  rationale: Im militärischen Zusammenhang bezeichnet die Wendung das Vorgehen gegen einen Gegner; „antreten“ ist im Deutschen idiomatisch und bewahrt den kämpferischen Sinn.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: diesen Philister
  rationale: Entspricht der ethnischen Bezeichnung mit Demonstrativpronomen ohne unnötigen Zusatz.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: mit ihm kämpfen
  rationale: Bildet die Präposition עִם sichtbar ab und ist zugleich natürliches Deutsch.
- source_word: כִּי
  choice: denn
  rationale: Leitet Sauls Begründung in würdigem, modernem Erzählstil ein.
- source_word: נַעַר
  choice: noch ein junger Mann
  rationale: נַעַר kann je nach Zusammenhang „Junge“, „Jugendlicher“ oder „junger Mann“ bedeuten. Hier bezeichnet es David als für den Zweikampf zu jung, ohne ihn zwingend als Kind einzuordnen; „noch“ verdeutlicht diese kontextuelle Gegenüberstellung.
- source_word: אִישׁ מִלְחָמָה
  choice: ein Kriegsmann
  rationale: Bewahrt die prägnante hebräische Nominalfügung und bezeichnet einen erfahrenen Kämpfer; das leicht gehobene Wort passt zum würdigen Erzählregister.
- source_word: מִנְּעֻרָיו
  choice: von Jugend an
  rationale: Gibt den seit der Jugend andauernden zeitlichen Ausgangspunkt idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Die militärische Bedeutung von לָלֶכֶת אֶל wird idiomatisch mit „gegen … antreten“ ausgedrückt. Die Wiederholung des Jugendmotivs bleibt durch „junger Mann“ und „von Jugend an“ erhalten.
