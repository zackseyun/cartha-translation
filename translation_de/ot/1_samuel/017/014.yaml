  text: David was the youngest[a], and the three oldest had gone after Saul.
translation:
  language: de
  text: David war der Jüngste, und die drei Ältesten waren Saul gefolgt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִד הוּא
  choice: David aber war
  rationale: Das וְ verbindet den Satz mit dem Kontext; „aber“ gibt hier den Gegensatz zwischen David und den drei ältesten Brüdern natürlich wieder. Das selbstständige Pronomen הוּא hebt David hervor, ohne dass im Deutschen ein zusätzliches „er“ nötig ist.
- source_word: הַ/קָּטָן
  choice: der Jüngste
  rationale: Wörtlich bezeichnet der Ausdruck den Kleinen beziehungsweise Jungen; im Vergleich unter Brüdern ist „der Jüngste“ die natürliche Bedeutung.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: und die drei Ältesten
  rationale: Im familiären Zusammenhang bezeichnet גְּדֹלִים die älteren beziehungsweise ältesten Brüder. „Die drei Ältesten“ entspricht dem bestimmten hebräischen Ausdruck knapp und idiomatisch.
- source_word: הָלְכוּ אַחֲרֵי
  choice: waren … gefolgt
  rationale: Die Wendung bedeutet wörtlich „gingen hinter … her“ und kann Zugehörigkeit oder Gefolgschaft ausdrücken. Das Plusquamperfekt kennzeichnet im deutschen Erzählzusammenhang den bereits erfolgten Anschluss an Saul.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Der Personenname wird nach der üblichen deutschen Bibeltradition wiedergegeben.
