source:
  edition: WLC
  text: וַ/יְּשָּֽׁמְעוּ֙ הַ/דְּבָרִ֔ים אֲשֶׁ֖ר דִּבֶּ֣ר דָּוִ֑ד וַ/יַּגִּ֥דוּ לִ/פְנֵֽי שָׁא֖וּל וַ/יִּקָּחֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/031.yaml
  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: de
  text: Als man hörte, was David gesagt hatte, berichtete man es Saul, und er ließ ihn holen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und er nahm ihn“. Gemeint ist wahrscheinlich, dass Saul David zu sich bringen ließ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: Als man hörte
  rationale: Das unbestimmte deutsche „man“ gibt den nicht genannten pluralischen Handlungsträger natürlich wieder, ohne eine konkrete Personengruppe einzuführen.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: was David gesagt hatte
  rationale: Die Wendung bezeichnet Davids zuvor geäußerte Worte; der Plusquamperfekt verdeutlicht die Erzählfolge, und der deutsche Relativsatz klingt natürlich.
- source_word: וַיַּגִּדוּ
  choice: berichtete man es
  rationale: נגד bezeichnet hier das Weitergeben einer Nachricht. „Berichten“ passt zum Vorgang, Davids Äußerung Saul zur Kenntnis zu bringen.
- source_word: לִפְנֵי שָׁאוּל
  choice: Saul
  rationale: Wörtlich steht „vor Saul“; bei einem Mitteilungsverb bezeichnet die Präposition hier idiomatisch den Empfänger. Im Deutschen ist „Saul berichten“ klarer und natürlicher.
- source_word: וַיִּקָּחֵהוּ
  choice: er ließ ihn holen
  rationale: Das Verb bedeutet grundsätzlich „nehmen/holen“. Im höfischen Zusammenhang ist wahrscheinlich gemeint, dass Saul David zu sich bringen ließ; die Übersetzung gibt diese kontextuelle Bedeutung wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die unbestimmten Handelnden werden idiomatisch mit „man“ wiedergegeben; der Wechsel zu „er“ bezeichnet Saul.
