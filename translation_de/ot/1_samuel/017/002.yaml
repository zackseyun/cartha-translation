base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: de
  text: Saul und die Männer Israels versammelten sich, schlugen ihr Lager im Tal von Ela auf und stellten sich zum Kampf gegen die Philister auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und stellten sich zum Kampf den Philistern gegenüber auf“ oder „und stellten sich zum Kampf auf, um den Philistern zu begegnen“.",'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאוּל וְאִישׁ יִשְׂרָאֵל
  choice: Saul und die Männer Israels
  rationale: אִישׁ steht hier kollektiv für die kampffähigen Männer Israels. Die Formulierung bleibt nah am Hebräischen, ohne sie bereits ausdrücklich als „Heer“ zu deuten. Das einleitende וְ wird im natürlichen deutschen Erzählfluss nicht eigens mit „und“ wiedergegeben.
- source_word: נֶאֶסְפוּ
  choice: versammelten sich
  rationale: Der Nifal bezeichnet hier das Zusammenkommen beziehungsweise Sammeln der Männer; „versammelten sich“ ist im Deutschen natürlich und gibt den militärischen Sammlungsvorgang angemessen wieder.
- source_word: וַיַּחֲנוּ
  choice: schlugen ihr Lager … auf
  rationale: Die Wendung bezeichnet das Lagern beziehungsweise Errichten eines Lagers. „Schlugen ihr Lager auf“ ist gegenwärtiges, idiomatisches Deutsch.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: im Tal von Ela
  rationale: עֵמֶק bedeutet „Tal“; הָאֵלָה wird hier als Ortsname verstanden und als „Ela“ wiedergegeben.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: stellten sich … zum Kampf
  rationale: Die hebräische Verbindung bezeichnet das Ordnen beziehungsweise Aufstellen zur Schlacht. Die gewählte Formulierung vermittelt die militärische Formation in natürlichem Deutsch.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: den Philistern … entgegen
  rationale: לִקְרַאת kann ein Entgegengehen, eine Gegenüberstellung oder im militärischen Zusammenhang eine feindliche Ausrichtung ausdrücken. „Entgegen“ bewahrt diese räumliche und gegnerische Nuance.
