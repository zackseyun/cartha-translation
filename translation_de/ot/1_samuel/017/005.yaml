source:
  edition: WLC
  text: וְ/כ֤וֹבַע נְחֹ֨שֶׁת֙ עַל רֹאשׁ֔/וֹ וְ/שִׁרְי֥וֹן קַשְׂקַשִּׂ֖ים ה֣וּא לָב֑וּשׁ וּ/מִשְׁקַל֙ הַ/שִּׁרְי֔וֹן חֲמֵשֶׁת אֲלָפִ֥ים שְׁקָלִ֖ים נְחֹֽשֶֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: de
  text: Auf dem Kopf hatte er einen Helm aus Bronze, und er war mit einem Schuppenpanzer bekleidet. Der Panzer wog fünftausend Schekel Bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fünftausend Schekel entsprechen ungefähr 57 Kilogramm.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: Helm
  rationale: Im militärischen Zusammenhang bezeichnet das Wort eine schützende Kopfbedeckung; „Helm“ ist die klare, heutige deutsche Entsprechung.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Der Ausdruck kann Kupfer oder eine Kupferlegierung bezeichnen. Bei antiker Bewaffnung ist „Bronze“ die herkömmliche und sachlich naheliegende Wiedergabe.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: Schuppenpanzer
  rationale: Die Verbindung bezeichnet einen Körperpanzer aus überlappenden, schuppenartigen Metallplättchen. „Schuppenpanzer“ gibt Bauart und Funktion präzise wieder und vermeidet die mögliche Verwechslung mit einem Kettenhemd.
- source_word: הוּא לָבוּשׁ
  choice: er war … bekleidet
  rationale: Die Formulierung bewahrt den zustandsbezogenen Charakter der hebräischen Wendung und klingt zugleich würdig und verständlich.
- source_word: מִשְׁקַל
  choice: wog
  rationale: Die verbale Formulierung ist im heutigen Deutsch natürlicher als „das Gewicht betrug“, ohne den Aussagegehalt zu verändern.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: fünftausend Schekel
  rationale: Die antike Maßeinheit bleibt im Haupttext erhalten; eine ungefähre Umrechnung steht in der Fußnote.
theological_decisions: []
translation_notes:
