source:
  edition: WLC
  text: וְ/יֵֽדְעוּ֙ כָּל הַ/קָּהָ֣ל הַ/זֶּ֔ה כִּֽי לֹ֛א בְּ/חֶ֥רֶב וּ/בַ/חֲנִ֖ית יְהוֹשִׁ֣יעַ יְהוָ֑ה כִּ֤י לַֽ/יהוָה֙ הַ/מִּלְחָמָ֔ה וְ/נָתַ֥ן אֶתְ/כֶ֖ם בְּ/יָדֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: de
  text: Und diese ganze Versammlung wird erkennen, dass Jahwe weder durch Schwert noch durch Speer rettet[a]. Denn der Kampf gehört Jahwe[b], und er wird euch in unsere Hand geben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht durch Schwert und Speer befreit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn der Kampf ist Jahwes.“'
    reason: lexical_alternative
  - marker: c
    text: '„In unsere Hand“ bedeutet: „in unsere Gewalt“ oder „uns ausliefern“.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: wird erkennen
  rationale: Das Qal-Imperfekt bezeichnet hier die künftige Erkenntnis als Ergebnis von Jahwes Eingreifen. „Wird erkennen“ gibt diese Aussage natürlich und präzise wieder.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: diese ganze Versammlung
  rationale: קהל bezeichnet die anwesende versammelte Menge. „Versammlung“ ist im Schlachtkontext sachlich und vermeidet eine unnötig kirchliche Färbung.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית
  choice: weder durch Schwert noch durch Speer
  rationale: Die Präposition ב bezeichnet das Mittel. Die deutsche Paarformel „weder … noch“ bildet die verneinte Verbindung der beiden Waffen idiomatisch ab.
- source_word: יְהוֹשִׁיעַ
  choice: rettet
  rationale: Das Hifil von ישׁע kann retten oder befreien bedeuten. „Rettet“ bewahrt sowohl den militärischen Sinn als auch die weitere theologische Tragweite.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: Denn Jahwe gehört der Kampf
  rationale: Das zweite כִּי ist begründend. Die ל-Konstruktion drückt Zugehörigkeit aus; diese Wiedergabe bleibt nah am Hebräischen und klingt im Deutschen natürlich.
- source_word: הַמִּלְחָמָה
  choice: der Kampf
  rationale: Im unmittelbaren Zusammenhang mit dem bevorstehenden Gefecht bezeichnet „Kampf“ die konkrete Auseinandersetzung treffender als das umfassendere „Krieg“.
- source_word: וְנָתַן
  choice: und er wird geben
  rationale: Die Qatal-Form hat in der zukunftsgerichteten Rede voraussagende Funktion und wird daher im Deutschen mit Futur wiedergegeben.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: euch in unsere Hand geben
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt eines anderen. Die wörtlich nahe Form bleibt verständlich; eine Fußnote erklärt das Idiom.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von יְהוֹשִׁיעַ im militärischen Kontext
  choice: rettet
  alternative: befreit / verschafft den Sieg
  rationale: „Rettet“ schließt die konkrete Befreiung aus militärischer Gefahr ein, ohne die breitere Bedeutung des Verbs auf bloßen Schlachterfolg zu verengen.
- issue: Zugehörigkeitsaussage לַיהוָה הַמִּלְחָמָה
  choice: Jahwe gehört der Kampf
  alternative: Der Kampf ist Jahwes
  rationale: Beide Fassungen geben den Besitz- beziehungsweise Zugehörigkeitssinn wieder. Die gewählte Form ist klares modernes Deutsch und lässt die Aussage über Jahwes Verfügung über den Kampf bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am hebräischen Gedankengang, während „weder … noch“ und „Jahwe gehört der Kampf“ natürliches Deutsch bieten. Alle erklärungsbedürftigen wörtlichen Wendungen werden knapp in Fußnoten erläutert.
