base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: de
  text: 'Isai sagte zu seinem Sohn David: »Nimm doch für deine Brüder ein Efa[a] von diesem gerösteten Korn[b] und diese zehn Brote und lauf damit zu deinen Brüdern ins Lager.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Efa war ein antikes Trockenmaß von ungefähr 22 Litern.
    reason: cultural_note
  - marker: b
    text: 'Oder: »parchiertem Korn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: Nimm doch
  rationale: Der Imperativ mit נָא wird im modernen Deutschen natürlich durch »doch« abgemildert, ohne die Dringlichkeit der Aufforderung aufzuheben.
- source_word: לְאַחֶיךָ
  choice: für deine Brüder / zu deinen Brüdern
  rationale: Beim Mitnehmen der Lebensmittel bezeichnet ל die Begünstigten (»für«); beim Lauf ins Lager bezeichnet es das Ziel beziehungsweise die Empfänger (»zu«).
- source_word: אֵיפַת הַקָּלִיא הַזֶּה
  choice: ein Efa von diesem gerösteten Korn
  rationale: '»Efa« bewahrt das konkrete antike Trockenmaß. Die Konstruktion gibt zudem wieder, dass das Demonstrativpronomen im Hebräischen zu קָלִיא gehört: »von diesem gerösteten Korn«.'
- source_word: וַעֲשָׂרָה לֶחֶם הַזֶּה
  choice: und diese zehn Brote
  rationale: לֶחֶם kann Brot allgemein bezeichnen; zusammen mit der Zahl ist »zehn Brote« im Deutschen konkret und idiomatisch. Das Demonstrativ wird ausdrücklich wiedergegeben.
- source_word: וְהָרֵץ
  choice: und lauf damit
  rationale: Die Hifil-Imperativform von רוץ vermittelt eine lebhafte Aufforderung zur Eile. »Lauf« bewahrt dieses Bild; »damit« macht im Deutschen natürlich deutlich, dass David die genannten Lebensmittel mitnehmen soll.
- source_word: הַמַּחֲנֶה
  choice: ins Lager
  rationale: Im militärischen Zusammenhang ist »Lager« die klare und geläufige Entsprechung.
- source_word: בְּנוֹ
  choice: zu seinem Sohn David
  rationale: Die Apposition kennzeichnet David als Isais Sohn und wird in natürlicher deutscher Wortstellung wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das antike Maß »Efa« bleibt erhalten und wird in einer Fußnote erklärt; die anschauliche Aufforderung »lauf« wird nicht zu dem allgemeineren »beeil dich« abgeschwächt.
