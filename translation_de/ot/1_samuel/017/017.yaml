  rationale: Nur Fußnote b wird korrigiert. Die alternative Wiedergabe wird grammatisch korrekt formuliert und gibt die Bedeutung von קָלִיא als geröstetes bzw. par­chiertes Getreide präziser wieder. Der Vers selbst und der Anker der Fußnote bleiben unverändert.
