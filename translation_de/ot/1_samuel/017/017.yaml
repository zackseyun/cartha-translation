    issue: 'Die Fußnote b lautet: »Oder: ›gedörrten Korn‹ beziehungsweise ›Röstkorn‹.«'
    rationale: »gedörrten Korn« ist grammatisch nicht korrekt; zudem bedeutet »gedörrt« primär getrocknet und ist daher keine präzise lexikalische Alternative zu קָלִיא. Eine Fußnote sollte die mögliche Bedeutung als »geröstet/parchiert« korrekt benennen.
