translation_notes:
  register: Moderne, würdige Standardsprache mit enger Bindung an die hebräische Satzstruktur. „Ganz Israel“ bewahrt die kollektive Redeweise der Vorlage; „bestürzt“ klingt natürlich und vermeidet die im Deutschen hier überstarke Metapher „zerschmettert“.
