base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: de
  text: Als Saul und ganz Israel diese Worte des Philisters hörten, erschraken sie und fürchteten sich sehr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörten
  rationale: שׁמע bedeutet im Qal gewöhnlich „hören“. Der deutsche Plural richtet sich nach dem zusammengesetzten Subjekt „Saul und ganz Israel“.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: וְכָל יִשְׂרָאֵל
  choice: und ganz Israel
  rationale: Bewahrt die kollektive Ausdrucksweise des Hebräischen; im Kontext sind die versammelten Israeliten beziehungsweise das Heer gemeint.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: diese Worte des Philisters
  rationale: Eine direkte und natürliche Wiedergabe; der bestimmte Singular bezeichnet den bereits genannten philistäischen Vorkämpfer.
- source_word: וַיֵּחַתּוּ
  choice: waren bestürzt
  rationale: חתת beschreibt hier das Erschrecken beziehungsweise den Verlust des Mutes. „Bestürzt“ ist kontextgemäß und hält diesen Aspekt von der ausdrücklich folgenden Furcht unterscheidbar.
- source_word: וַיִּירְאוּ מְאֹד
  choice: fürchteten sich sehr
  rationale: Gibt ירא mit der üblichen deutschen Wendung und מְאֹד als klare Verstärkung wieder.
