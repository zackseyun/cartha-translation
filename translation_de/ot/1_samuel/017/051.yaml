source:
  edition: WLC
  text: וַ/יָּ֣רָץ דָּ֠וִד וַ/יַּעֲמֹ֨ד אֶל הַ/פְּלִשְׁתִּ֜י וַ/יִּקַּ֣ח אֶת חַ֠רְבּ/וֹ וַֽ/יִּשְׁלְפָ֤/הּ מִ/תַּעְרָ/הּ֙ וַ/יְמֹ֣תְתֵ֔/הוּ וַ/יִּכְרָת בָּ֖/הּ אֶת רֹאשׁ֑/וֹ וַ/יִּרְא֧וּ הַ/פְּלִשְׁתִּ֛ים כִּֽי מֵ֥ת גִּבּוֹרָ֖/ם וַ/יָּנֻֽסוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: de
  text: Da lief David hin und trat zu dem Philister[a]. Er nahm dessen Schwert, zog es aus der Scheide und tötete ihn; dann schlug er ihm damit den Kopf ab. Als die Philister sahen, dass ihr Vorkämpfer[b] tot war, flohen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »stellte sich über den Philister« beziehungsweise »trat neben den Philister«. Der hebräische Ausdruck bezeichnet, dass David bei ihm Stellung nahm; die genaue räumliche Beziehung bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihr starker Mann« beziehungsweise »ihr Krieger«. »Vorkämpfer« berücksichtigt Goliats Rolle im stellvertretenden Zweikampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: lief ... hin
  rationale: Das gewöhnliche Verb רוץ bezeichnet hier Davids rasches Hinlaufen; die deutsche Verbklammer gibt die Bewegung natürlich wieder.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: trat zu dem Philister
  rationale: עמד mit אֶל beschreibt hier, dass David bei dem gefallenen Philister Stellung nimmt. Die Formulierung bleibt gegenüber »über ihm« und »neben ihm« räumlich zurückhaltend.
- source_word: חַרְבּוֹ
  choice: dessen Schwert
  rationale: Das Suffix bezieht sich auf den Philister; »dessen« verhindert im Deutschen eine mögliche Verwechslung mit Davids eigenem Schwert.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: zog es aus der Scheide
  rationale: שלף ist der übliche Ausdruck für das Ziehen einer Waffe, תער bezeichnet hier ihre Scheide.
- source_word: וַיְמֹתְתֵהוּ
  choice: tötete ihn
  rationale: Die kausative Form von מות schildert ausdrücklich die Tötung beziehungsweise den abschließenden Todesstoß und wird trotz der Aussage des vorherigen Verses nicht abgeschwächt.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: schlug er ihm damit den Kopf ab
  rationale: כרת mit ראש bezeichnet die Enthauptung; »damit« verweist eindeutig auf das Schwert.
- source_word: גִּבּוֹרָם
  choice: ihr Vorkämpfer
  rationale: גבור bedeutet einen starken Mann oder Krieger. »Vorkämpfer« gibt hier zugleich Goliats im Kapitel etablierte Rolle im stellvertretenden Zweikampf wieder.
- source_word: וַיָּנֻסוּ
  choice: flohen sie
  rationale: נוס ist das übliche Verb für militärische Flucht; »flohen« ist knapp und idiomatisch.
