base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: de
  text: 'David sagte: »Jahwe, der mich aus der Tatze des Löwen und aus der Tatze des Bären gerettet hat, er wird mich aus der Hand dieses Philisters retten.« Da sagte Saul zu David: »Geh, und Jahwe sei mit dir!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und Jahwe wird mit dir sein.« Das Hebräische kann sowohl als Segenswunsch als auch als einfache Zukunftsaussage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift des göttlichen Namens bewahrt den Eigennamen, statt ihn durch den Titel »der HERR« zu ersetzen.
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: hat mich gerettet / wird mich retten
  rationale: Das Hifil von נצל bezeichnet hier die Rettung aus konkreter Lebensgefahr. Derselbe deutsche Verbstamm bewahrt die Verbindung zwischen der vergangenen Erfahrung und Davids Zukunftsgewissheit.
- source_word: מִיַּד
  choice: aus der Tatze / aus der Hand
  rationale: Das hebräische Bild lautet wörtlich »aus der Hand«. Bei Löwe und Bär ist »Tatze« im Deutschen die natürliche körperbezogene Entsprechung; beim Philister bleibt »Hand« erhalten.
- source_word: הָאֲרִי / הַדֹּב
  choice: des Löwen / des Bären
  rationale: Direkte und natürliche Wiedergabe der bestimmten hebräischen Substantive im Genitiv nach »Tatze«.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Personalpronomen ist im Hebräischen ausdrücklich gesetzt und betont Davids Vertrauen auf Jahwe als den Handelnden.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: dieses Philisters
  rationale: Die demonstrative Wendung wird in natürlicher deutscher Wortstellung wiedergegeben und behält Davids zugespitzten Hinweis auf seinen Gegner bei.
- source_word: לֵךְ
  choice: Geh
  rationale: Der kurze Imperativ entspricht Sauls knapper Aufforderung.
- source_word: יִהְיֶה עִמָּךְ
  choice: Jahwe sei mit dir
  rationale: Der hebräische Imperfekt kann in diesem Zusammenhang als Segenswunsch verstanden werden. Der deutsche Konjunktiv I gibt diese naheliegende Nuance würdig und knapp wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als persönlichen Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Aussageweise von Sauls Schlussworten
  choice: 'Segenswunsch: »Jahwe sei mit dir«'
  alternative: 'Zukunftsaussage: »Jahwe wird mit dir sein«'
  rationale: Die Form יִהְיֶה kann kontextuell entweder als Wunsch beziehungsweise Segen oder als einfache Zukunftsaussage verstanden werden. Der Segenswunsch passt zu Sauls Entlassungswort; die echte grammatische Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung »aus der Tatze ... aus der Tatze« und das betonte »er« bilden die Struktur und Zuversicht des Hebräischen ab. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Schlussformulierung.
