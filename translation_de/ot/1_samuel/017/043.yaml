  text: וַ/יֹּ֤אמֶר הַ/פְּלִשְׁתִּי֙ אֶל דָּוִ֔ד הֲ/כֶ֣לֶב אָנֹ֔כִי כִּֽי אַתָּ֥ה בָֽא אֵלַ֖/י בַּ/מַּקְל֑וֹת וַ/יְקַלֵּ֧ל הַ/פְּלִשְׁתִּ֛י אֶת דָּוִ֖ד בֵּ/אלֹהָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: de
  text: 'Und der Philister sagte zu David: »Bin ich ein Hund, dass du mit Stöcken[a] zu mir kommst?« Und der Philister verfluchte David bei seinen Göttern[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Stäben«. Das hebräische Wort kann Stöcke, Stäbe oder Ruten bezeichnen; hier unterstreicht es die Verachtung des Philisters.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »im Namen seiner Götter«.'
    reason: alternative_rendering
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: der Philister
  rationale: Die Bezeichnung nennt Goliaths Volkszugehörigkeit. »Der Philister« ist die schlichte, erzählerisch passende Wiedergabe, ohne den Zusatz »Krieger« in den Text einzutragen.
- source_word: הֲכֶלֶב אָנֹכִי
  choice: Bin ich ein Hund
  rationale: Die wörtlich bewahrte rhetorische Frage drückt Empörung und Verachtung aus; das kulturell und erzählerisch wichtige Bild des Hundes wird nicht umschrieben.
- source_word: כִּי
  choice: dass
  rationale: כִּי führt hier den Anlass beziehungsweise Inhalt der rhetorischen Frage ein. Im Deutschen verbindet »dass« die beiden Satzteile natürlich.
- source_word: בָא אֵלַי
  choice: du zu mir kommst
  rationale: Das Partizip bezeichnet die gegenwärtige Handlung. Das deutsche Präsens erhält die Unmittelbarkeit der direkten Rede.
- source_word: בַּמַּקְלוֹת
  choice: mit Stöcken
  rationale: Der Plural von מַקֵּל kann Stöcke, Stäbe oder Wanderstäbe bezeichnen. »Stöcke« gibt den verächtlichen Ton wieder, ohne daraus ausdrücklich Waffen zu machen.
- source_word: וַיְקַלֵּל
  choice: verfluchte
  rationale: קלל bezeichnet hier das Aussprechen beziehungsweise Anrufen eines Fluches und ist stärker als ein bloßes Beschimpfen.
- source_word: בֵּאלֹהָיו
  choice: bei seinen Göttern
  rationale: Die Präposition ב bezeichnet hier das Mittel beziehungsweise die angerufene Macht des Fluches. »Bei seinen Göttern« ist im Deutschen idiomatisch und lässt den pluralischen Sinn von אֱלֹהִים erkennen.
theological_decisions:
- issue: Numerus von אֱלֹהִים mit Suffix der 3. Person Singular im philistäischen Zusammenhang
  choice: seinen Göttern
  alternative: seinem Gott
  rationale: אֱלֹהִים kann grammatisch auch einen einzelnen Gott bezeichnen. In diesem nichtisraelitischen Zusammenhang ist jedoch der pluralische Sinn naheliegend und bewahrt den Hinweis auf die philistäische Götterwelt, ohne monotheistische Voraussetzungen in den Text einzutragen.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die direkte Rede bleibt knapp und scharf. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
