base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/019.yaml
  text: Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
translation:
  language: de
  text: Saul, sie und alle Männer Israels befanden sich im Tal Ela[a] und kämpften gegen die Philister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit den Philistern“; bei Kampfhandlungen kann die hebräische Präposition die gegnerische Partei bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל וְ/הֵמָּה וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: Saul, sie und alle Männer Israels
  rationale: Die Aufzählung bewahrt das ausdrücklich gesetzte Pronomen הֵמָּה („sie“), das im Zusammenhang auf Isais Söhne verweist. „Alle Männer Israels“ gibt die kollektive Bedeutung von כָל אִישׁ יִשְׂרָאֵל in natürlichem Deutsch wieder.
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: im Tal Ela
  rationale: עֵמֶק bedeutet „Tal“; Ela wird als Ortsname transliteriert.
- source_word: נִלְחָמִים
  choice: kämpften
  rationale: Das Partizip bezeichnet eine zu diesem Zeitpunkt andauernde Kampfhandlung; das deutsche Präteritum passt zum erzählenden Kontext.
- source_word: עִם פְּלִשְׁתִּים
  choice: gegen die Philister
  rationale: עִם bedeutet grundsätzlich „mit“, bezeichnet bei Verben des Kämpfens jedoch die gegnerische Partei. „Gegen die Philister kämpfen“ ist die eindeutige und natürliche deutsche Wendung.
