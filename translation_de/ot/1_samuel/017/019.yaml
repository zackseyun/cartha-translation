translation_notes:
  register: Modernes, klares Erzählungsdeutsch. Die im Deutschen leicht markierte Reihung „Saul, sie und alle Männer Israels“ bleibt erhalten, um das ausdrückliche hebräische Pronomen nicht zu unterschlagen.
