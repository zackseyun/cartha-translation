  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: de
  text: Da ging ich ihm nach, schlug ihn und rettete das Schaf aus seinem Maul. Als er sich gegen mich erhob, packte ich ihn am Bart[a], schlug ihn und tötete ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „an seinem Bart“; manche Übersetzungen geben dies deutend mit „an seiner Mähne“ oder „am Kiefer“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: Da ging ich ihm nach
  rationale: יצא mit אַחֲרֵי beschreibt Davids Verfolgung des Raubtiers. Das maskuline Pronomen „ihm“ entspricht dem hebräischen Suffix und kann sich im Deutschen natürlich auf Löwe oder Bär beziehen.
- source_word: וְהִכִּתִיו
  choice: schlug es
  rationale: נכה bezeichnet hier das Schlagen; die neutrale Wiedergabe nimmt die später ausdrücklich genannte Tötung nicht vorweg. „Es“ verweist natürlich auf das Tier.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: rettete das Schaf aus seinem Maul
  rationale: Der Hifil von נצל bedeutet „retten, entreißen“. Das im Hebräischen nur mitgedachte Objekt wird aus Vers 34 als „das Schaf“ verdeutlicht; „Maul“ ist für ein Tier im Deutschen natürlicher als „Mund“ und bleibt dem konkreten Bild treu.
- source_word: וַיָּקָם עָלַי
  choice: Als es sich gegen mich erhob
  rationale: קום על bezeichnet ein feindliches Sich-Erheben gegen jemanden. Die temporale Fügung gibt den Zusammenhang idiomatisch wieder, ohne das Verhalten genauer auszudeuten.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: packte ich es am Bart
  rationale: Der Hifil von חזק bezeichnet festes Ergreifen. זָקָן heißt gewöhnlich „Bart“; diese auffällige Bildsprache wird bewahrt statt interpretierend durch „Mähne“ oder „Kiefer“ ersetzt zu werden.
- source_word: וַהֲמִיתִּיו
  choice: tötete es
  rationale: Der Hifil von מות bezeichnet ausdrücklich das Verursachen des Todes und bildet den Abschluss der Handlungsfolge.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die wechselnden Pronomen „ihm/seinem“ und „es“ folgen natürlichem deutschem Gebrauch: grammatisches Maskulinum bei Löwe oder Bär, neutrales „es“ für das Tier als Objekt. Das im Ausgangstext elliptische Rettungsobjekt wird zur Verständlichkeit als „das Schaf“ ergänzt.'
