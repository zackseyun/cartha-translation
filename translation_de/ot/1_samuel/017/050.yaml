  text: וַ/יֶּחֱזַ֨ק דָּוִ֤ד מִן הַ/פְּלִשְׁתִּי֙ בַּ/קֶּ֣לַע וּ/בָ/אֶ֔בֶן וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ וְ/חֶ֖רֶב אֵ֥ין בְּ/יַד דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: de
  text: So war David dem Philister mit der Schleuder und mit einem Stein überlegen. Er schlug den Philister und tötete ihn, obwohl David kein Schwert in der Hand hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und David hatte kein Schwert in der Hand“. Das hebräische Bindewort kann schlicht mit „und“ wiedergegeben werden; im Haupttext verdeutlicht „obwohl“ den konzessiven Sinn im Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: So war David dem Philister … überlegen
  rationale: חזק mit מן bezeichnet hier, dass David sich gegenüber seinem Gegner als stärker erweist bzw. ihn überwindet. „jemandem überlegen sein“ gibt die Konstruktion im Deutschen natürlich wieder.
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: mit der Schleuder und mit einem Stein
  rationale: ב bezeichnet in beiden Fällen das Mittel. Der bestimmte Artikel bei „Schleuder“ und der einzelne Stein werden entsprechend dem Hebräischen wiedergegeben.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: Er schlug den Philister
  rationale: נכה bedeutet in diesem Zusammenhang „schlagen/treffen“. „schlug“ bewahrt die kräftige, zugleich nicht altertümliche Ausdrucksweise.
- source_word: וַיְמִיתֵהוּ
  choice: und tötete ihn
  rationale: Die Hifil-Form von מות bedeutet, den Tod zu verursachen, also „töten“.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: obwohl David kein Schwert in der Hand hatte
  rationale: Das einleitende ו kann hier den begleitenden, im Zusammenhang überraschenden und konzessiven Umstand ausdrücken. Die Wendung „in der Hand“ bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „mit … und mit …“ bewahrt die instrumentale Parallelität des Hebräischen; der abschließende Satz hebt ohne konfessionelle Deutung hervor, dass David ohne Schwert siegte.
