  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: de
  text: 'David sagte: »Was habe ich denn jetzt getan? War es nicht nur ein Wort[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »War es nicht nur eine Angelegenheit?« Das hebräische Wort דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche deutsche Erzählform für das wayyiqtol von אמר, das direkte Rede einleitet.
- source_word: דָּוִד
  choice: David
  rationale: Im Deutschen etablierte Form des Personennamens.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: Was habe ich denn getan?
  rationale: Das Perfekt gibt die unmittelbar relevante Handlung natürlich wieder; »denn« vermittelt in modernem Deutsch den durch עָתָּה im Wortwechsel ausgedrückten protestierenden Ton, ohne ein unnatürliches zeitliches »jetzt« zu erzwingen.
- source_word: הֲלוֹא
  choice: War es nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: דָּבָר
  choice: nur ein Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. Im Zusammenhang liegt nahe, dass David sein Verhalten als bloße Äußerung herunterspielt; die Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: הוּא
  choice: es
  rationale: Das Pronomen verweist auf das soeben Beanstandete und wird in der deutschen Wendung natürlich mit »es« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Partikel »denn« lässt Davids entrüstete Reaktion idiomatisch anklingen; die lexikalische Offenheit von דָּבָר bleibt durch die Fußnote sichtbar.
