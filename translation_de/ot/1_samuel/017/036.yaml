source:
  edition: WLC
  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: de
  text: Dein Diener hat sowohl den Löwen als auch den Bären erschlagen. Und diesem unbeschnittenen Philister wird es genauso ergehen wie einem von ihnen, denn er hat die Schlachtreihen des lebendigen Gottes verhöhnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Heere des lebendigen Gottes“. Das hebräische Wort kann „Schlachtreihen“, „Kampfreihen“ oder im weiteren Sinn „Heere“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: erschlagen
  rationale: נכה bezeichnet schlagen bzw. niederschlagen. Im Zusammenhang mit den lebensgefährlichen Raubtieren ist „erschlagen“ natürlich und gibt die tödliche Überwindung wieder, ohne die konkrete Schlaghandlung zu verlieren.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: In der Anrede Sauls ist dies eine ehrerbietige Selbstbezeichnung. „Diener“ wahrt den höfischen Sprachgebrauch, ohne hier unnötig den Status eines Sklaven hervorzuheben.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: den Löwen ... den Bären
  rationale: Beide Substantive tragen im Hebräischen den Artikel. Die bestimmte Form passt zu Davids Rückblick auf die von ihm bekämpften Tiere.
- source_word: וְהָיָה
  choice: wird es ... ergehen
  rationale: Die Form ist hier im Zusammenhang vorausblickend. Die idiomatische deutsche Wendung drückt Davids Gewissheit aus und verbindet sich natürlich mit dem folgenden Vergleich.
- source_word: הֶעָרֵל
  choice: unbeschnittenen
  rationale: Die wörtliche Bezeichnung bewahrt sowohl den körperlichen Bundesmarker als auch die polemische und theologische Schärfe der Aussage.
- source_word: כְּאַחַד מֵהֶם
  choice: genauso ... wie einem von ihnen
  rationale: Die Wendung vergleicht das bevorstehende Schicksal des Philisters mit dem der beiden Tiere. Die deutsche Form gibt den singularisch-distributiven Vergleich natürlich wieder.
- source_word: חֵרֵף
  choice: verhöhnt
  rationale: חרף kann schmähen, verhöhnen oder herausfordern bedeuten. „Verhöhnt“ bewahrt die offen verächtliche Redehandlung, die sich gegen Gottes Schlachtreihen richtet.
- source_word: מַעַרְכֹת
  choice: Schlachtreihen
  rationale: Der Ausdruck bezeichnet geordnete Kampfaufstellungen, Reihen oder Schlachtordnungen. „Schlachtreihen“ erhält das konkrete militärische Bild und den Plural.
- source_word: אֱלֹהִים חַיִּים
  choice: des lebendigen Gottes
  rationale: Die feste Wendung hebt Gottes lebendige Wirklichkeit hervor. Trotz der morphologischen Pluralform von אֱלֹהִים verlangt der Sinn hier den Singular.
theological_decisions:
- issue: Bundestheologische Aussage von „unbeschnitten“
  choice: Die wörtliche Bezeichnung „unbeschnitten“ bleibt im Haupttext erhalten.
  alternative: „bundesfremd“ oder „gottlos“
  rationale: Der hebräische Text gebraucht den körperlichen Bundesmarker als polemische Bezeichnung. Eine deutende Umschreibung würde die konkrete Bildsprache abschwächen und zusätzliche Interpretation eintragen.
- issue: Bedeutung von מַעַרְכֹת in Bezug auf Gott
  choice: „Schlachtreihen des lebendigen Gottes“
  alternative: „Heere des lebendigen Gottes“ oder „Kampfreihen des lebendigen Gottes“
  rationale: „Schlachtreihen“ wahrt die konkrete militärische Aufstellung und lässt die Aussage stehen, dass Israels aufgestellte Reihen dem lebendigen Gott zugeordnet sind, ohne den Begriff zum institutionellen „Heer“ zu verallgemeinern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt selbstbewusst und rhetorisch kraftvoll. „Erschlagen“, „unbeschnitten“ und „Schlachtreihen“ sind präzise, verständlich und bewahren die konkrete Bildwelt des Hebräischen.
