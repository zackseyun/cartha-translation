  text: וַ/יֵּ֨לֶךְ֙ הַ/פְּלִשְׁתִּ֔י הֹלֵ֥ךְ וְ/קָרֵ֖ב אֶל דָּוִ֑ד וְ/הָ/אִ֛ישׁ נֹשֵׂ֥א הַ/צִּנָּ֖ה לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/041.yaml
  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: de
  text: Der Philister rückte immer näher an David heran[a]; dabei ging der Mann, der den Schild trug, vor ihm her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Der Philister ging, fortwährend gehend und sich David nähernd.« Die hebräische Folge aus einem finiten Verb und Partizipien hebt die anhaltende Vorwärtsbewegung hervor. Das hebräische Wort für »Schild« kann insbesondere einen großen Schild bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי הֹלֵךְ וְקָרֵב
  choice: Der Philister rückte immer näher … heran
  rationale: Die Verbindung aus finitem Verb und den Partizipien הֹלֵךְ וְקָרֵב schildert eine fortgesetzte Vorwärtsbewegung. Die deutsche Formulierung gibt diesen Verlauf natürlich wieder, ohne einen zusätzlichen Begriff wie »Kämpfer« einzuführen.
- source_word: אֶל דָּוִד
  choice: an David
  rationale: אֶל bezeichnet hier die Richtung auf David zu; zusammen mit »heranrücken« ist »an David heran« idiomatisches Deutsch.
- source_word: וְהָאִישׁ
  choice: dabei … der Mann
  rationale: Die Wendung leitet einen begleitenden Umstand ein. »Dabei« macht deutlich, dass der Schildträger den Vormarsch begleitet, bewahrt aber »der Mann« ausdrücklich.
- source_word: נֹשֵׂא הַצִּנָּה
  choice: der den Langschild trug
  rationale: נֹשֵׂא bezeichnet das Tragen; צִנָּה meint einen großen, den Körper deckenden Schild. »Langschild« ist eine knappe, im Deutschen verständliche Bezeichnung für diesen Schildtyp.
- source_word: לְפָנָיו
  choice: vor ihm her
  rationale: Die Präposition bezeichnet die Position vor dem Philister; »vor ihm her« drückt in Verbindung mit der Bewegung natürlich aus, dass der Schildträger vorausging.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. »Rückte immer näher … heran« wahrt den fortschreitenden Charakter des Hebräischen; »Langschild« vermittelt die besondere Größe von צִנָּה ohne umständliche Erklärung im Haupttext.
