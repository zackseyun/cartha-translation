base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: de
  text: Da ließ David das Gepäck, das er bei sich trug, beim Wächter des Gepäcks zurück[a] und lief zur Schlachtreihe[b]. Als er dort ankam, erkundigte er sich, wie es seinen Brüdern ging[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Sachen« beziehungsweise »die Ausrüstung«. Das hebräische Wort כֵּלִים ist ein weiter Begriff für Gegenstände, Geräte oder mitgeführte Habe; hier schließt es wahrscheinlich die von David gebrachten Vorräte ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zur Schlachtordnung« beziehungsweise »zu den Reihen«. Das hebräische מַעֲרָכָה bezeichnet die geordnete Aufstellung der Truppen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »er fragte seine Brüder nach Frieden«. Diese hebräische Redewendung bedeutet, sich nach ihrem Wohlergehen zu erkundigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: ließ … zurück
  rationale: Das Verb kann »verlassen«, »zurücklassen« oder »aufgeben« bedeuten. Hier lässt David die mitgebrachten Gegenstände nur vorübergehend in der Obhut des Wächters; »ließ … zurück« gibt dies natürlich wieder, ohne ein endgültiges Aufgeben anzudeuten.
- source_word: הַכֵּלִים
  choice: das Gepäck
  rationale: כֵּלִים ist ein weiter Begriff für Sachen, Geräte oder Ausrüstung. Im Heerlager bezeichnet er hier am ehesten die mitgeführten Gegenstände einschließlich der von David gebrachten Vorräte. »Gepäck« passt zum Aufbewahrungskontext und vermeidet die irreführende Verengung auf Waffen oder Rüstung.
- source_word: מֵעָלָיו
  choice: das er bei sich trug
  rationale: Die Wendung bedeutet wörtlich »von auf ihm« und zeigt, dass David die Gegenstände selbst getragen hatte. Der Relativsatz bewahrt diese ausdrücklich genannte Information in natürlichem Deutsch.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: beim Gepäckwächter
  rationale: עַל יַד heißt wörtlich »an der Hand von«, bezeichnet hier aber die Obhut desjenigen, der das Gepäck bewacht. »Beim Gepäckwächter« ist knapp, idiomatisch und lässt den Verwahrungscharakter erkennen.
- source_word: וַיָּרָץ
  choice: lief
  rationale: Das Verb bedeutet unmittelbar »laufen/rennen«. »Lief« bewahrt Davids rasche Bewegung, ohne eine zusätzliche Wertung einzutragen.
- source_word: הַמַּעֲרָכָה
  choice: Schlachtreihe
  rationale: Der Ausdruck bezeichnet die geordnete Aufstellung beziehungsweise Frontlinie der Truppen. »Schlachtreihe« gibt den militärischen Zusammenhang präzise und verständlich wieder.
- source_word: וַיָּבֹא
  choice: Als er dort ankam
  rationale: 'Das hebräische Erzähltempus setzt die Handlung mit »und er kam« fort. Die temporale Unterordnung ist im Deutschen natürlicher und bewahrt die Abfolge: David läuft zur Reihe, kommt an und erkundigt sich.'
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: erkundigte er sich, wie es seinen Brüdern ging
  rationale: Die hebräische Wendung lautet wörtlich, nach jemandes »Frieden/Wohlergehen« zu fragen. Die gewählte Formulierung gibt diesen idiomatischen Sinn in heutigem Deutsch wieder und reduziert die Handlung nicht auf einen bloßen Gruß.
