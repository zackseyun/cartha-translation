source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: de
  text: Noch heute wird Jahwe dich in meine Hand ausliefern. Ich werde dich erschlagen und dir den Kopf abnehmen. Noch heute werde ich die Leichen des Lagers der Philister den Vögeln am Himmel und den wilden Tieren der Erde geben. Dann wird die ganze Erde erkennen, dass es einen Gott für Israel gibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass es einen Gott in Israel gibt“. Wörtlich steht im Hebräischen „für Israel“; dies kann eine besondere Beziehung zu Israel oder sein Eintreten für Israel ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: wird dich in meine Hand ausliefern
  rationale: Der Hifil von סגר bezeichnet hier die Übergabe in die Gewalt eines anderen. Die deutsche Wendung bewahrt das hebräische Bild und passt zum Kampfkontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in der im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהִכִּיתִךָ
  choice: Ich werde dich erschlagen
  rationale: נכה kann schlagen oder tödlich treffen bedeuten. Der unmittelbare Kontext mit der anschließenden Enthauptung macht die tödliche Bedeutung deutlich.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: und dir den Kopf abnehmen
  rationale: Die Formulierung gibt das Verb סור, „entfernen, wegnehmen“, natürlich wieder, ohne ein im Ausgangstext nicht ausdrücklich verwendetes Verb für Abschneiden einzusetzen.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: die Leichen des Lagers der Philister
  rationale: Das formal singularische פֶּגֶר wird im Zusammenhang kollektiv verstanden; gemeint sind die Toten der im Lager versammelten Streitmacht.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְחַיַּת הָאָרֶץ
  choice: den Vögeln am Himmel und den wilden Tieren der Erde
  rationale: Die geläufigen hebräischen Naturbezeichnungen werden bildnah und in modernem Deutsch wiedergegeben.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: Dann wird die ganze Erde erkennen
  rationale: Das mit וְ angeschlossene Imperfekt bezeichnet die eintretende Folge von Davids angekündigtem Sieg. „Die ganze Erde“ bewahrt die rhetorische Weite von כָּל־הָאָרֶץ.
- source_word: כִּי יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: dass es einen Gott für Israel gibt
  rationale: „Für Israel“ bildet die Präposition לְ formal ab und lässt eine relationale beziehungsweise Israel zugewandte Bedeutung offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; seine Wiedergabe als „Jahwe“ hält Name und Titel auseinander.
- issue: Bedeutung der Präposition in לְיִשְׂרָאֵל
  choice: einen Gott für Israel
  alternative: einen Gott in Israel
  rationale: Das לְ bezeichnet wörtlich eine Zuordnung zu Israel und kann Beziehung, Zugehörigkeit oder Eintreten für Israel ausdrücken. Die traditionelle Ortsangabe „in Israel“ ist kontextuell möglich und wird deshalb in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, kraftvollem Ton. Die drastische Sprache der Kampfszene wird nicht abgeschwächt; unnötig altertümliche Wendungen werden vermieden.
