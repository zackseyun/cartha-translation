source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ שְׁלֹ֤שֶׁת בְּנֵֽי יִשַׁי֙ הַ/גְּדֹלִ֔ים הָלְכ֥וּ אַחֲרֵי שָׁא֖וּל לַ/מִּלְחָמָ֑ה וְ/שֵׁ֣ם שְׁלֹ֣שֶׁת בָּנָ֗י/ו אֲשֶׁ֤ר הָלְכוּ֙ בַּ/מִּלְחָמָ֔ה אֱלִיאָ֣ב הַ/בְּכ֗וֹר וּ/מִשְׁנֵ֨/הוּ֙ אֲבִ֣ינָדָ֔ב וְ/הַ/שְּׁלִשִׁ֖י שַׁמָּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: de
  text: Die drei ältesten Söhne Isais waren Saul in den Kampf gefolgt.[a] Die drei Söhne Isais, die in den Kampf gezogen waren, hießen Eliab, der Erstgeborene, Abinadab, der zweite, und Schamma, der dritte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: waren hinter Saul her in den Kampf gezogen.'
    reason: Die Fußnote bewahrt das räumliche Bild von אַחֲרֵי, das im Kontext zugleich das Folgen beziehungsweise Mitziehen unter Saul ausdrückt.
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: waren … gefolgt / gezogen waren
  rationale: Die Vorvergangenheit gibt den Hintergrund zum laufenden Erzählgeschehen wieder; die variierte Formulierung entspricht natürlichem Deutsch.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: die drei ältesten Söhne Isais
  rationale: הַגְּדֹלִים bezeichnet im Familienzusammenhang den Altersrang, nicht Körpergröße oder gesellschaftliche Bedeutung.
- source_word: אַחֲרֵי שָׁאוּל
  choice: Saul … gefolgt
  rationale: Die Wendung bedeutet wörtlich „hinter/nach Saul“ und bezeichnet hier das Mitziehen unter seiner Führung; „folgen“ ist im Deutschen natürlich und bewahrt diese Beziehung.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: in den Kampf
  rationale: מִלְחָמָה kann „Krieg“ oder „Kampf“ bedeuten; der konkrete militärische Zusammenstoß im Kontext legt „Kampf“ nahe.
- source_word: וְשֵׁם שְׁלֹשֶׁת בָּנָיו
  choice: Die drei Söhne Isais … hießen
  rationale: Die hebräische Namensformel wird idiomatisch deutsch wiedergegeben; „Isais“ klärt den Bezug des Suffixes.
- source_word: הַבְּכוֹר
  choice: der Erstgeborene
  rationale: בְּכוֹר bezeichnet den familiären Status des Erstgeborenen, nicht nur den Ältesten nach Lebensalter.
- source_word: וּמִשְׁנֵהוּ
  choice: der zweite
  rationale: Das Wort bezeichnet den zweiten Sohn in der genannten Reihenfolge; eine wörtlich possessive Wiedergabe wäre im Deutschen unnatürlich.
- source_word: וְהַשְּׁלִשִׁי
  choice: und … der dritte
  rationale: Die formale Ordinalfolge des Hebräischen bleibt erhalten.
- source_word: שַׁמָּה
  choice: Schamma
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Personennamens.
theological_decisions: []
