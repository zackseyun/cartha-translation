    rationale: Die hebräische Konstruktion lautet „Gott der Schlachtreihen Israels, den du verhöhnt hast“; ihr Kopfwort ist „Gott“. Auch der Kontext charakterisiert Goliats Herausforderung als Schmähung des Gottes Israels. Das unveränderliche אשר rechtfertigt keine Umdeutung des syntaktischen Kopfbezugs in der Hauptfassung.
  - severity: medium
    issue: Fußnote c stellt den Bezug auf die Schlachtreihen als gleichrangige Hauptlesart dar.
    rationale: Eine mitgemeinte Schmähung Israels beziehungsweise seiner Reihen kann kontextuell mitschwingen, doch die Übersetzung sollte den grammatisch und kontextuell vorrangigen Bezug auf Gott im Text führen. Die Fußnote sollte nur die lexikalischen Nuancen von חרף erläutern.
