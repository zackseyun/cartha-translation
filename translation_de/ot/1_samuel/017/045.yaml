  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: de
  text: 'Da sagte David zu dem Philister: »Du kommst zu mir mit Schwert, Speer und Wurfspieß. Ich aber komme zu dir im Namen Jahwes, des Herrn der Heere[a], des Gottes der Schlachtreihen Israels[b], den du verhöhnt hast[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Jahwe der Heere«; traditionell: »der HERR der Heerscharen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »des Gottes der Heere Israels« beziehungsweise »des Gottes der Kampfaufstellungen Israels«.'
    reason: lexical_alternative
  - marker: c
    text: Das Verb kann auch »geschmäht« oder »herausgefordert« bedeuten. Der Relativsatz bezieht sich auf »den Gott der Schlachtreihen Israels«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter. »Da sagte« gibt diese zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: הַפְּלִשְׁתִּי
  choice: der Philister
  rationale: Die Bezeichnung identifiziert Goliat nach seiner Volkszugehörigkeit; ein Zusatz wie »Krieger« steht hier nicht ausdrücklich.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: kommst zu mir / komme zu dir
  rationale: Die Partizipialformen bezeichnen die gegenwärtige beziehungsweise unmittelbar bevorstehende Bewegung. Die feindliche Absicht ergibt sich aus dem Zusammenhang.
- source_word: בְּחֶרֶב וּבַחֲנִית וּבְכִידוֹן
  choice: mit Schwert, Speer und Wurfspieß
  rationale: Die Präposition ב bezeichnet das Mittel. »Wurfspieß« unterscheidet כִּידוֹן verständlich von der חֲנִית, dem Speer.
- source_word: בְּשֵׁם
  choice: im Namen
  rationale: Die feste Wendung bewahrt sowohl den Gedanken der Bevollmächtigung als auch den der Repräsentation.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen bloßen Titel ersetzt.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heere
  rationale: Die Formulierung gibt den Titel in verständlichem, würdigem Deutsch wieder und bewahrt zugleich den ausdrücklich genannten Gottesnamen. Die wörtlichere Konstruktion wird in einer Fußnote genannt.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: der Gott der Schlachtreihen Israels
  rationale: מַעֲרָכוֹת bezeichnet geordnete, zum Kampf aufgestellte Reihen. »Schlachtreihen« wahrt diesen konkreten Sinn und unterscheidet den Ausdruck von צְבָאוֹת.
- source_word: חֵרַפְתָּ
  choice: verhöhnt hast
  rationale: חרף bezeichnet hier eine verächtliche Schmähung und Herausforderung. »Verhöhnt« ist im Deutschen natürlicher als »geschmäht« und bewahrt die beleidigende Schärfe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Relativsatzes אֲשֶׁר חֵרַפְתָּ
  choice: die du verhöhnt hast — Bezug auf die Schlachtreihen Israels
  alternative: den du verhöhnt hast — Bezug auf den Gott Israels
  rationale: Das unveränderliche hebräische Relativpronomen lässt den grammatischen Bezug offen. Die unmittelbar vorausgehenden Schlachtreihen und der weitere Kontext in 1 Samuel 17 stützen den Bezug auf Israels Kampfaufstellung; zugleich kann die Verhöhnung Israels als Verhöhnung seines Gottes verstanden werden. Die Alternative wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Satzstruktur und der Gegensatz zwischen Waffen und dem Namen Jahwes bleiben erhalten. »Schlachtreihen« ist bewusst konkreter als »Heere«, um die beiden unterschiedlichen hebräischen Militärbegriffe nicht einzuebnen.
