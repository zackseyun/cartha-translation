  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד אֶת יָד֜/וֹ אֶל הַ/כֶּ֗לִי וַ/יִּקַּ֨ח מִ/שָּׁ֥ם אֶ֨בֶן֙ וַ/יְקַלַּ֔ע וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י אֶל מִצְח֑/וֹ וַ/תִּטְבַּ֤ע הָ/אֶ֨בֶן֙ בְּ/מִצְח֔/וֹ וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: de
  text: Da griff David in die Tasche[a], nahm einen Stein heraus, schleuderte ihn mit der Schleuder und traf den Philister an der Stirn. Der Stein drang in seine Stirn ein[b], und er fiel mit dem Gesicht zu Boden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Beutel«. Das hebräische Wort bezeichnet allgemein einen Behälter oder Ausrüstungsgegenstand; hier ist der Behälter für Davids Steine gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Der Stein blieb in seiner Stirn stecken.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: Da griff David in die Tasche
  rationale: Die Wendung lautet wörtlich etwa »David sandte seine Hand zu/in den Behälter«. »In die Tasche greifen« gibt die Handlung im Deutschen natürlich und sinngenau wieder.
- source_word: הַכֶּלִי
  choice: die Tasche
  rationale: כְּלִי ist ein weiter Begriff für Gefäß, Gerät oder Ausrüstungsstück. Im Zusammenhang bezeichnet er den Behälter, in dem David die Steine trug; »Tasche« ist daher klar, ohne eine unnötig genaue Form festzulegen.
- source_word: אֶבֶן
  choice: einen Stein
  rationale: »Stein« ist die übliche und präzise Bezeichnung für Davids Geschoss.
- source_word: וַיְקַלַּע
  choice: schleuderte ihn
  rationale: Das Verb bezeichnet das Werfen mit einer Schleuder. »Schleuderte ihn« ist knapp und bewahrt diese spezifische Handlung.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: traf den Philister an der Stirn
  rationale: אֶל kennzeichnet hier die Stelle des Aufpralls. »An der Stirn treffen« ist im Deutschen idiomatisch und eng am Sinn.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: Der Stein drang in seine Stirn ein
  rationale: טבע beschreibt hier ein Einsinken oder Sich-Festsetzen. »Drang … ein« gibt die Wirkung anschaulich wieder, ohne zusätzliche anatomische Einzelheiten einzutragen.
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  choice: er fiel mit dem Gesicht zur Erde
  rationale: Die Formulierung wahrt das hebräische Bild (»auf sein Gesicht, erdwärts«) in natürlichem, würdigem Deutsch.
