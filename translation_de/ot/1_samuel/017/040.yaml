base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: de
  text: Er nahm seinen Stab in die Hand, wählte sich fünf glatte Steine aus dem Bachbett[a] und legte sie in seine Hirtentasche, in den Beutel[b]. Seine Schleuder war in seiner Hand. Dann ging er auf den Philister zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem Bach« beziehungsweise »aus dem Wadi«. Das hebräische Wort נַחַל kann einen Bach, eine Schlucht oder ein zeitweise trockenes Bachbett bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort יַלְקוּט bezeichnet vermutlich einen kleinen Beutel oder eine Tasche. Es kann die zuvor genannte Hirtentasche näher bestimmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: seinen Stab
  rationale: מַקֵּל bezeichnet einen Stab oder Stock; »Stab« ist im Hirtenkontext natürlich und würdevoll.
- source_word: וַיִּבְחַר לוֹ
  choice: suchte sich ... aus
  rationale: Die Formulierung gibt die bewusste Auswahl und die reflexive Nuance von לוֹ idiomatisch wieder.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: fünf glatte Steine
  rationale: חַלֻּקֵי beschreibt die Glätte der Steine; die knappe deutsche Wendung entspricht dem Kontext.
- source_word: מִן הַנַּחַל
  choice: aus dem Bachbett
  rationale: נַחַל kann einen Bach, einen saisonalen Wasserlauf oder dessen Rinne bezeichnen. »Bachbett« passt zum Auflesen glatter Steine und vermeidet das im Deutschen weniger alltägliche »Wadi«.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ וּבַיַּלְקוּט
  choice: in seine Hirtentasche, und zwar in den Beutel
  rationale: כְּלִי ist allgemein ein Behältnis oder Ausrüstungsstück, während יַלְקוּט die Tasche beziehungsweise den Beutel näher bestimmt. »Und zwar« macht die wahrscheinlich erläuternde Beziehung verständlich, ohne sie vollständig einzuebnen.
- source_word: וְקַלְּעוֹ בְיָדוֹ
  choice: Seine Schleuder hielt er in der Hand
  rationale: Der hebräische Nominalsatz wird natürlich deutsch wiedergegeben und bewahrt die konkrete Wiederholung von »in der Hand«.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: Dann ging er auf den Philister zu
  rationale: נגשׁ bezeichnet das Herantreten oder Sichnähern; die Formulierung ist idiomatisch und vermittelt die gerichtete Bewegung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Handlungsschritte und die wiederholte Wendung »in der Hand« bleiben erhalten; die ungewöhnliche Folge zweier Behälterbegriffe wird im Haupttext lesbar gefasst und in der Fußnote als nicht völlig sichere Apposition erläutert.
