  text: וְ/דָוִד֩ בֶּן אִ֨ישׁ אֶפְרָתִ֜י הַ/זֶּ֗ה מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וּ/שְׁמ֣/וֹ יִשַׁ֔י וְ/ל֖/וֹ שְׁמֹנָ֣ה בָנִ֑ים וְ/הָ/אִישׁ֙ בִּ/ימֵ֣י שָׁא֔וּל זָקֵ֖ן בָּ֥א בַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: de
  text: David war der Sohn dieses Efratiters aus Bethlehem in Juda, der Isai hieß und acht Söhne hatte. Zur Zeit Sauls war der Mann alt und hochbetagt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „alt, unter die Männer gekommen“. Die hebräische Wendung ist ungewöhnlich und wird meist als Hinweis auf ein weit fortgeschrittenes Alter verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: Efratiter
  rationale: Im Zusammenhang mit Bethlehem bezeichnet der Ausdruck einen Mann aus Efrata beziehungsweise Bethlehem, nicht einen Angehörigen des Stammes Ephraim. „Efratiter“ bewahrt die geografisch-ethnische Bezeichnung.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: aus Bethlehem in Juda
  rationale: Die natürliche deutsche Ortsangabe unterscheidet Bethlehem in Juda von gleichnamigen Orten und gibt die hebräische Verbindung sachgerecht wieder.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: der Isai hieß
  rationale: Eine idiomatische deutsche Wiedergabe der hebräischen Namensangabe.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: und acht Söhne hatte
  rationale: Gibt die hebräische Besitzkonstruktion natürlich und vollständig wieder.
- source_word: בִּימֵי שָׁאוּל
  choice: Zur Zeit Sauls
  rationale: Natürliche moderne Wiedergabe der temporalen Wendung.
- source_word: זָקֵן בָּא בַאֲנָשִׁים
  choice: alt und hochbetagt
  rationale: Die schwierige idiomatische Wendung bezeichnet wahrscheinlich ein weit fortgeschrittenes Alter. Die ungewöhnliche Bildsprache des Hebräischen wird in der Fußnote kenntlich gemacht.
- source_word: וְהָאִישׁ
  choice: der Mann
  rationale: Bewahrt die ausdrückliche Wiederaufnahme Isais im hebräischen Text, statt sie durch ein bloßes Pronomen zu glätten.
