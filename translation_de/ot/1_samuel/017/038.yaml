  terminology: „Gewänder“, „bronzener Helm“ und „Panzer“ halten die im Hebräischen getrennten Ausrüstungsstücke auseinander. Die Fußnote zum Panzer ist korrekt am betreffenden Wort verankert und legt keine spezifische Bauart fest.
