  text: וַ/יַּלְבֵּ֨שׁ שָׁא֤וּל אֶת דָּוִד֙ מַדָּ֔י/ו וְ/נָתַ֛ן ק֥וֹבַע נְחֹ֖שֶׁת עַל רֹאשׁ֑/וֹ וַ/יַּלְבֵּ֥שׁ אֹת֖/וֹ שִׁרְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/038.yaml
  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: de
  text: Dann kleidete Saul David in Sauls Gewänder[a], setzte ihm einen bronzenen Helm auf und kleidete ihn in einen Panzer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sauls Kriegskleidung“. Das hebräische Wort kann Kleidung bezeichnen, die mit Rang oder Kampf verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen Körperpanzer; die genaue Bauart wird hier nicht genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: kleidete … in
  rationale: Die Hifil-Form von לבשׁ bezeichnet hier, dass Saul David etwas anzieht beziehungsweise ihn damit bekleidet. Die Wiederholung im Hebräischen wird auch im Deutschen beibehalten.
- source_word: מַדָּיו
  choice: seine Gewänder
  rationale: מַד kann Kleidung, besonders Amts- oder Kriegskleidung, bezeichnen. Die allgemeine Wiedergabe vermeidet es, den Ausdruck mit dem später eigens genannten Panzer gleichzusetzen; das Suffix der 3. Person Singular bezieht sich im Kontext auf Saul.
- source_word: קוֹבַע נְחֹשֶׁת
  choice: einen bronzenen Helm
  rationale: קוֹבַע bezeichnet einen Helm; נְחֹשֶׁת wird bei antiker Bewaffnung sachgerecht und idiomatisch mit „Bronze“ wiedergegeben.
- source_word: עַל רֹאשׁוֹ
  choice: setzte ihm … auf
  rationale: Die deutsche Formulierung gibt „auf seinen Kopf“ natürlich wieder, ohne den Sinn zu verändern.
- source_word: שִׁרְיוֹן
  choice: Panzer
  rationale: Das Wort bezeichnet eine den Körper schützende Rüstung. „Panzer“ ist im historischen Zusammenhang verständlich und vermeidet eine unbelegte Festlegung auf eine bestimmte Bauart.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Verwendung des hebräischen Verbs לבשׁ wird bewusst durch die Wiederholung von „kleidete“ abgebildet. „Gewänder“ wahrt die Breite des ersten Kleidungsbegriffs, während „Panzer“ den gesondert genannten Körperschutz bezeichnet.
