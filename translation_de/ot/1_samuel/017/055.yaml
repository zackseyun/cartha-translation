  naturalness: Die Erzählsprache und die direkte Rede sind natürliches modernes Standarddeutsch. »wie David hinausging, dem Philister entgegen« ist leicht gehoben, aber klar und für den Erzählton passend.
  terminology: »Heerführer« ist für שַׂר הַצָּבָא angemessen. »Junger Mann« trifft נַעַר im Kontext. Die idiomatische Schwurformel »So wahr du lebst« gibt חֵי נַפְשְׁךָ gut wieder.
