  text: וְ/כִ/רְא֨וֹת שָׁא֜וּל אֶת דָּוִ֗ד יֹצֵא֙ לִ/קְרַ֣את הַ/פְּלִשְׁתִּ֔י אָמַ֗ר אֶל אַבְנֵר֙ שַׂ֣ר הַ/צָּבָ֔א בֶּן מִי זֶ֥ה הַ/נַּ֖עַר אַבְנֵ֑ר וַ/יֹּ֣אמֶר אַבְנֵ֔ר חֵֽי נַפְשְׁ/ךָ֥ הַ/מֶּ֖לֶךְ אִם יָדָֽעְתִּי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: de
  text: 'Als Saul sah, wie David hinausging, dem Philister entgegen, sagte er zu Abner, dem Heerführer: »Wessen Sohn ist dieser junge Mann, Abner?« Abner sagte: »So wahr du lebst[a], König: Ich weiß es nicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die hebräische Schwurformel: »So wahr deine Seele lebt«; sinngemäß: »So wahr du lebst.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: Als … sah
  rationale: Die Verbindung aus Konjunktion, כִּ und Infinitivus constructus leitet einen temporalen Nebensatz ein. »Als Saul sah« gibt die zeitliche Abfolge natürlich wieder.
- source_word: יֹצֵא לִקְרַאת
  choice: entgegenging
  rationale: Das Partizip יֹצֵא beschreibt Davids gerade stattfindende Bewegung nach draußen; לִקְרַאת bezeichnet die Bewegung auf den Philister zu. »Entgegenging« verbindet beides knapp und ohne den nicht ausdrücklich genannten Gedanken eines Angriffs hinzuzufügen.
- source_word: הַפְּלִשְׁתִּי
  choice: dem Philister
  rationale: Der hebräische Text nennt lediglich die ethnische Bezeichnung im Singular mit Artikel. Die kontextuell mögliche Ergänzung »Kämpfer« oder »Vorkämpfer« wird daher nicht eingefügt.
- source_word: שַׂר הַצָּבָא
  choice: Heerführer
  rationale: Der Titel bezeichnet den militärischen Oberbefehlshaber. »Heerführer« ist prägnant, verständlich und dem historischen Erzählregister angemessen.
- source_word: בֶּן מִי זֶה הַנַּעַר
  choice: Wessen Sohn ist dieser junge Mann?
  rationale: Die deutsche Form bewahrt die Aussage der wörtlichen Frage »Sohn von wem ist dieser junge Mann?« in natürlicher Wortstellung. נַעַר bezeichnet hier einen jungen Mann, nicht notwendig ein Kind.
- source_word: חֵי נַפְשְׁךָ
  choice: So wahr du lebst
  rationale: Die gebräuchliche deutsche Schwurformel vermittelt die Funktion des hebräischen Ausdrucks verständlich. Dessen wörtlicher Bezug auf die »Seele« beziehungsweise das »Leben« des Angeredeten wird in der Fußnote erläutert.
- source_word: אִם יָדָעְתִּי
  choice: Ich weiß es nicht
  rationale: אִם steht hier in einer verkürzten Schwurformel und drückt eine nachdrückliche Verneinung aus. Eine formale Wiedergabe als »wenn ich es weiß« wäre im Deutschen ohne zusätzliche Erklärung missverständlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die direkte Rede ist natürlich formuliert, ohne die hebräische Schwurformel zu glätten oder ihre Funktion abzuschwächen. »Mein König« gibt die Anrede הַמֶּלֶךְ im Deutschen idiomatisch wieder.
