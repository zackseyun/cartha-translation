source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: de
  text: David nahm den Kopf des Philisters und brachte ihn nach Jerusalem.[a] Und seine Waffen legte er in sein Zelt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text sagt unmittelbar, David habe den Kopf nach Jerusalem gebracht. Manche sehen darin eine chronologische Spannung, weil Jerusalem zu diesem Zeitpunkt noch nicht vollständig unter israelitischer Kontrolle stand. Die Übersetzung harmonisiert die Aussage nicht.
    reason: cultural_note
  - marker: b
    text: Wörtlich ist die Zuordnung der Possessivformen nicht völlig eindeutig. Dem Zusammenhang nach sind die Waffen die des Philisters und das Zelt ist Davids. Das mit „Waffen“ übersetzte Wort kann auch Ausrüstung, Gerät oder Rüstungsteile bezeichnen.
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Die schlichte deutsche Erzählform gibt das hebräische Wayyiqtol von לקח natürlich wieder.
- source_word: רֹאשׁ הַפְּלִשְׁתִּי
  choice: den Kopf des Philisters
  rationale: Der konkrete Körperteil ist gemeint; die substantivische Volksbezeichnung bezeichnet hier Goliat.
- source_word: וַיְבִאֵהוּ יְרוּשָׁלִָם
  choice: brachte ihn nach Jerusalem
  rationale: Das maskuline Pronomen „ihn“ bezieht sich im Deutschen wie das hebräische Suffix auf „Kopf“. Die direkte Ortsangabe wird ohne chronologische Harmonisierung bewahrt.
- source_word: כֵּלָיו
  choice: seine Waffen
  rationale: כְּלִי ist breit und kann Geräte, Ausrüstung, Rüstungsteile oder Waffen bezeichnen; im Kampfzusammenhang ist „Waffen“ knapp und verständlich.
- source_word: שָׂם בְּאָהֳלוֹ
  choice: legte er in sein Zelt
  rationale: „Legte“ ist für das Aufbewahren der erbeuteten Gegenstände natürlich; אָהֶל bedeutet gewöhnlich „Zelt“.
theological_decisions:
- issue: Bezug der Possessivsuffixe im letzten Satzteil
  choice: Die Waffen gehören dem Philister, das Zelt David.
  alternative: Beide Suffixe könnten formal auf dieselbe Person bezogen oder das Zelt als ein militärisches beziehungsweise gemeinschaftliches Zelt verstanden werden.
  rationale: 'Der Zusammenhang handelt von Davids Beutestücken: Die Gegenstände sind am natürlichsten die des Philisters, während der Ablageort Davids Zelt ist. Eine Fußnote bewahrt die formale Mehrdeutigkeit.'
- issue: Chronologische Spannung bei Jerusalem
  choice: Die Aussage wird direkt mit „brachte ihn nach Jerusalem“ übersetzt.
  alternative: Man könnte harmonisierend „brachte ihn später nach Jerusalem“ formulieren.
  rationale: Der hebräische Text enthält kein „später“. Die mögliche Spannung dazu, dass Jerusalem zu diesem Zeitpunkt noch nicht vollständig unter israelitischer Kontrolle stand, darf nicht durch einen Zusatz aufgelöst werden.
- issue: Verknüpfung der beiden Aussagen
  choice: Eine neue Satzfügung mit „aber“ markiert den Themenwechsel, ohne einen sachlichen Gegensatz zu behaupten.
  alternative: Beide Aussagen könnten schlicht mit „und“ verbunden werden.
  rationale: Das hebräische וְ ist grundsätzlich additiv; deutsches „aber“ kann hier als fortführender Themenwechsel gelesen werden. Um den Grundsinn transparent zu halten, wird die Alternative in der Begründung berücksichtigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Sachangabe bleibt nüchtern. Kurze Hauptsätze entsprechen dem hebräischen Erzählstil; die Fußnoten bewahren die chronologische und referenzielle Spannung.
