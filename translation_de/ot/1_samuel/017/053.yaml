id: 1SA.17.53
reference: 1 Samuel 17:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/דְּלֹ֖ק אַחֲרֵ֣י פְלִשְׁתִּ֑ים וַ/יָּשֹׁ֖סּוּ אֶת מַחֲנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: de
  text: Die Israeliten kehrten von der Verfolgung der Philister zurück und plünderten deren Lager.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihre Lager«; gemeint sind die Lager der Philister.'
    reason: Die hebräische Form מַחֲנֵיהֶם ist pluralisch, während das deutsche »Lager« hier kollektiv gebraucht wird.
lexical_decisions:
- source_word: וַיָּשֻבוּ
  choice: kehrten … zurück
  rationale: Gibt die Grundbedeutung von שוב im erzählerischen Zusammenhang natürlich und bewegungsbezogen wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich »die Söhne Israels«, bezeichnet hier jedoch idiomatisch das Volk beziehungsweise seine kämpfenden Angehörigen. »Die Israeliten« ist im modernen Deutschen klar und vermeidet eine irreführende Beschränkung auf leibliche Söhne.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: von der Verfolgung
  rationale: Die Verbindung bezeichnet das energische Hinterherjagen. Die substantivische deutsche Wendung passt natürlich zu »kehrten … zurück« und bewahrt den militärischen Sinn.
- source_word: פְלִשְׁתִּים
  choice: der Philister
  rationale: Etablierte deutsche Bezeichnung der Volksgruppe; der Genitiv ist durch »Verfolgung« bedingt.
- source_word: וַיָּשֹׁסּוּ
  choice: und plünderten
  rationale: שסס bezeichnet das Plündern oder Ausrauben nach einem militärischen Sieg. »Plünderten« ist gegenwärtig, präzise und nicht archaisch.
- source_word: מַחֲנֵיהֶם
  choice: deren Lager
  rationale: Die masoretische Form ist morphologisch pluralisch (»ihre Lager«). Das deutsche Kollektiv »Lager« kann jedoch ein oder mehrere feindliche Heerlager bezeichnen; »deren« macht eindeutig, dass die Lager den Philistern gehören. Die formale Numerusdifferenz wird in einer Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Die Israeliten« ist gegenüber dem im Deutschen unnatürlichen »die Söhne Israels« idiomatisch vorzuziehen. Der Satz bleibt knapp und folgt dem zügigen Erzählstil des hebräischen Textes.
