  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Bildsprache. Die schwer verständliche Orts- beziehungsweise Richtungsangabe wird im Haupttext lesbar wiedergegeben, während die genuine Unsicherheit in der Fußnote erhalten bleibt.
