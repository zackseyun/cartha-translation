  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: de
  text: Da erhoben sich die Männer von Israel und Juda, stießen einen Schlachtruf aus und verfolgten die Philister bis zum Eingang des Tals[a] und bis an die Tore von Ekron. Die erschlagenen Philister fielen auf dem Weg nach Schaarajim, bis nach Gat und bis nach Ekron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: „bis zu deinem Kommen [zum] Tal“. Die Wendung ist textlich und syntaktisch schwierig und wird häufig als „bis zum Eingang des Tals“ verstanden; manche deuten „Gaj“ als Ortsnamen.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da erhoben sich
  rationale: Das narrative Wayyiqtol von קום bezeichnet hier das entschlossene Aufstehen und unmittelbare Eingreifen nach Goliats Fall; „Da erhoben sich“ ist würdig und im modernen Deutschen verständlich.
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: die Männer Israels und Judas
  rationale: אַנְשֵׁי bedeutet wörtlich „Männer von“ und passt zum militärischen Zusammenhang; der Konstruktus bezieht sich auf Israel und Juda.
- source_word: וַיָּרִעוּ
  choice: stießen den Schlachtruf aus
  rationale: רוע bezeichnet in diesem Zusammenhang einen lauten Kampf- oder Kriegsschrei. Die ausdrückliche Wiedergabe bewahrt die militärische Nuance.
- source_word: וַיִּרְדְּפוּ
  choice: Sie verfolgten
  rationale: רדף bedeutet im militärischen Kontext gewöhnlich „verfolgen“.
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: bis zum Eingang des Tals
  rationale: Die schwierige Wendung wird idiomatisch als Angabe des Zugangs beziehungsweise Eingangs zum Tal verstanden. Die textliche und syntaktische Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: und bis an die Tore von Ekron
  rationale: Die räumliche Grenze wird wörtlich und natürlich wiedergegeben.
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: Die erschlagenen Philister lagen
  rationale: חַלְלֵי bezeichnet Erschlagene beziehungsweise tödlich Getroffene. Das deutsche „lagen“ gibt das Ergebnis von וַיִּפְּלוּ im Rückblick natürlich wieder, ohne sie lediglich als Verwundete darzustellen.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: auf dem Weg nach Schaarajim
  rationale: בְּדֶרֶךְ mit einem Ortsnamen bezeichnet natürlich den dorthin führenden Weg.
- source_word: שַׁעֲרַיִם
  choice: Schaarajim
  rationale: Der Ortsname wird nach geläufiger deutscher Bibelnamenkonvention transliteriert.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: bis nach Gat und bis nach Ekron
  rationale: Das wiederholte עַד wird beibehalten und unterstreicht die Ausdehnung der Verfolgung und Verluste.
theological_decisions: []
