id: 1SA.17.10
reference: 1 Samuel 17:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/פְּלִשְׁתִּ֔י אֲנִ֗י חֵרַ֛פְתִּי אֶת מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל הַ/יּ֣וֹם הַ/זֶּ֑ה תְּנוּ לִ֣/י אִ֔ישׁ וְ/נִֽלָּחֲמָ֖ה יָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: de
  text: 'Da sagte der Philister: »Ich habe heute[a] die Schlachtreihen Israels[b] verhöhnt.[c] Gebt mir einen Mann, und wir wollen miteinander kämpfen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »an diesem Tag«.
    reason: lexical_alternative
  - marker: b
    text: Auch »Kampflinien« oder, dem Sinn nach, »Heere Israels«.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann auch mit »geschmäht«, »verspottet« oder im Zusammenhang mit »herausgefordert« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: der Philister
  rationale: Der bestimmte Ausdruck bezeichnet Goliat nach seiner Volkszugehörigkeit. »Der Vorkämpfer der Philister« wäre aus dem Kontext ergänzt, steht aber nicht in diesem Wort.
- source_word: חֵרַפְתִּי
  choice: ich habe … verhöhnt
  rationale: Das Verb bezeichnet verächtliches Schmähen oder Verhöhnen. Im Zusammenhang ist damit zugleich eine offene militärische Herausforderung verbunden.
- source_word: מַעַרְכוֹת
  choice: die Schlachtreihen
  rationale: Der Plural bezeichnet geordnete militärische Aufstellungen oder Kampflinien. »Schlachtreihen« bewahrt dieses konkrete Bild besser als das weiter gefasste »Heer«.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Die wörtliche Wendung »an diesem Tag« wird im modernen Deutschen natürlich mit »heute« wiedergegeben.
- source_word: תְּנוּ לִי אִישׁ
  choice: Gebt mir einen Mann
  rationale: Die direkte Wiedergabe erhält den knappen, herausfordernden Ton der Aufforderung, einen Einzelkämpfer zu stellen.
- source_word: וְנִלָּחֲמָה
  choice: und wir wollen … kämpfen
  rationale: Die Kohortativform drückt hier den auffordernden Willen zum Kampf aus; »wir wollen kämpfen« gibt diesen Zug natürlicher wieder als ein bloßes Futur.
- source_word: יָחַד
  choice: miteinander
  rationale: Im Kontext des Zweikampfs bedeutet das Wort, dass die beiden gegeneinander in den Kampf treten. »Miteinander kämpfen« ist im Deutschen dafür idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und provokativ; »Schlachtreihen« bewahrt das militärische Bild, während »wir wollen … kämpfen« die auffordernde Kohortativform wiedergibt.
