- from: Als der Philister hinsah und David erblickte, verachtete er ihn; denn David war noch jung, von rötlicher Erscheinung[a] und schön anzusehen.
  to: Als der Philister hinsah und David erblickte, verachtete er ihn; denn David war jung, rötlich[a] und schön anzusehen.
  rationale: Die Revision streicht die geringfügige Zusatznuance „noch“ und ersetzt die stilistisch schwerfällige Wendung „von rötlicher Erscheinung“ durch „rötlich“. Dadurch bleibt die umstrittene beziehungsweise breit mögliche Referenz der rötlichen Färbung erhalten, während der Satz im modernen Standarddeutsch flüssiger wird.
