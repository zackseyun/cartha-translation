source:
  edition: WLC
  text: וַ/יַּבֵּ֧ט הַ/פְּלִשְׁתִּ֛י וַ/יִּרְאֶ֥ה אֶת דָּוִ֖ד וַ/יִּבְזֵ֑/הוּ כִּֽי הָיָ֣ה נַ֔עַר וְ/אַדְמֹנִ֖י עִם יְפֵ֥ה מַרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: de
  text: Als der Philister hinsah und David erblickte, verachtete er ihn; denn David war jung, rötlich[a] und schön anzusehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rothaarig“; das hebräische Adjektiv kann allgemein eine rötliche Färbung bezeichnen und muss sich nicht ausschließlich auf die Haarfarbe beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: hinsah
  rationale: נבט bezeichnet das gezielte Richten des Blicks. „hinsah“ gibt dies natürlich wieder und lässt zusammen mit dem folgenden „erblickte“ die hebräische Abfolge von Hinsehen und Sehen erkennen.
- source_word: הַפְּלִשְׁתִּי
  choice: der Philister
  rationale: Der hebräische Text verwendet hier schlicht die Volksbezeichnung. Obwohl aus dem Zusammenhang Goliat gemeint ist, wird keine zusätzliche Bezeichnung wie „Kämpfer“ eingefügt.
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: David erblickte
  rationale: ראה ist das gewöhnliche Verb für „sehen“. „erblickte“ ist in dieser Verbindung idiomatisch und bewahrt den erzählerischen Fortgang nach dem Hinsehen.
- source_word: וַיִּבְזֵהוּ
  choice: verachtete er ihn
  rationale: בזה bedeutet, jemanden geringzuschätzen oder zu verachten. Die Übersetzung gibt auch das hebräische Objektsuffix ausdrücklich wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Verachtung ein. „denn“ verbindet die Aussage im Deutschen flüssig mit dem vorausgehenden Hauptsatz.
- source_word: הָיָה נַעַר
  choice: David war noch jung
  rationale: נַעַר kann je nach Zusammenhang einen Jungen, Jugendlichen oder jungen Mann bezeichnen. „war noch jung“ bewahrt die Altersangabe, ohne David genauer als Kind oder Erwachsenen festzulegen. Die Wiederholung des Namens verhindert im Deutschen einen missverständlichen Pronomenbezug auf den Philister.
- source_word: אַדְמֹנִי
  choice: von rötlicher Erscheinung
  rationale: Das Adjektiv bezeichnet eine rötliche Färbung oder Erscheinung, lässt aber offen, ob vor allem Hautfarbe, Haarfarbe oder die gesamte äußere Färbung gemeint ist. Die Übersetzung wahrt diese Unbestimmtheit.
- source_word: עִם יְפֵה מַרְאֶה
  choice: und schön anzusehen
  rationale: Die Wendung bezeichnet ein ansprechendes oder schönes Äußeres. „schön anzusehen“ ist natürliches modernes Deutsch und bleibt nahe an מַרְאֶה, dem sichtbaren Erscheinungsbild.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Blickfolge bleibt erkennbar; unnötige kontextuelle Ergänzungen und eine zu genaue Festlegung von Davids Alter oder rötlicher Färbung werden vermieden.
