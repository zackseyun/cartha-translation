base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/016.yaml
  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: de
  text: Der Philister trat morgens und abends vor und bezog Stellung, vierzig Tage lang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Philister näherte sich morgens und abends und stellte sich auf, vierzig Tage lang.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: trat ... vor
  rationale: נגשׁ bedeutet »sich nähern« oder »herantreten«. Im militärischen Zusammenhang gibt »trat vor« Goliats wiederholtes Vortreten zwischen die Heere natürlich wieder.
- source_word: הַפְּלִשְׁתִּי
  choice: Der Philister
  rationale: Der hebräische Text nennt ihn hier schlicht »den Philister«. »Vorkämpfer« wäre aus dem Kontext ergänzt.
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: morgens und abends
  rationale: Die beiden adverbial gebrauchten Formen bezeichnen die wiederkehrenden Tageszeiten. Die deutsche Paarformel ist natürlich und bewahrt den täglichen Rhythmus.
- source_word: וַיִּתְיַצֵּב
  choice: bezog Stellung
  rationale: Der Hitpael von יצב bezeichnet das Sichhinstellen oder Sichaufstellen. »bezog Stellung« passt zur militärischen Szene und erhält den reflexiven Sinn.
- source_word: אַרְבָּעִים יוֹם
  choice: vierzig Tage lang
  rationale: Die Wendung bezeichnet die Dauer der wiederholten Handlung; »lang« macht diese Funktion im Deutschen eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Wiederholungsstruktur des Hebräischen bleibt erhalten; keine kontextuelle Ergänzung wie »Vorkämpfer«.
