  naturalness: Modernes Standarddeutsch und der scharfe Ton Eliabs sind gelungen. Die überarbeitete kausale Verknüpfung ist ebenso natürlich und folgt zugleich dem Satzbau und Gedankengang der Vorlage genauer.
