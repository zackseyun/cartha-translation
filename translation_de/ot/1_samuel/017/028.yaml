  to: 'Als Eliab, sein ältester Bruder, hörte, wie er mit den Männern redete, entbrannte sein Zorn gegen David. Er sagte: »Warum bist du überhaupt herabgekommen? Und bei wem hast du die paar Schafe dort in der Steppe zurückgelassen? Ich kenne deine Vermessenheit[a] und die Bosheit deines Herzens[b], denn du bist herabgekommen, um den Kampf zu sehen.«'
