  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: de
  text: 'Als Eliab, sein ältester Bruder, hörte, wie er mit den Männern redete, entbrannte sein Zorn gegen David. Er sagte: »Warum bist du überhaupt herabgekommen? Und bei wem hast du die paar Schafe dort in der Steppe zurückgelassen? Ich kenne deine Vermessenheit[a] und die Bosheit deines Herzens[b], denn du bist herabgekommen, um den Kampf zu sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deinen Hochmut; deine Frechheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: die Schlechtigkeit deines Herzens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַבְּרוֹ אֶל הָאֲנָשִׁים
  choice: hörte, wie er mit den Männern redete
  rationale: Die Infinitivkonstruktion mit ב bezeichnet hier die begleitende bzw. gleichzeitige Handlung. „Hörte, wie er … redete“ gibt dies im Deutschen natürlich wieder; הָאֲנָשִׁים bleibt allgemein „die Männer“ und wird nicht zu „Soldaten“ präzisiert.
- source_word: וַיִּחַר אַף אֱלִיאָב בְּדָוִד
  choice: entbrannte sein Zorn gegen David
  rationale: Die bildhafte hebräische Zorneswendung wird in einer geläufigen, würdevollen deutschen Form bewahrt.
- source_word: לָמָּה זֶּה יָרַדְתָּ
  choice: Warum bist du überhaupt herabgekommen?
  rationale: ירד wird als „herabkommen“ wiedergegeben. Das demonstrative זֶה verstärkt hier die vorwurfsvolle Frage; „überhaupt“ bildet diese pragmatische Kraft idiomatisch ab, ohne einen Ortsbezug hinzuzufügen.
- source_word: וְעַל מִי נָטַשְׁתָּ
  choice: Und bei wem hast du … zurückgelassen?
  rationale: Die Wendung fragt, in wessen Obhut David die Tiere gelassen hat. „Zurückgelassen“ wahrt den vorwurfsvollen Klang von נטשׁ, ohne ein völliges Im-Stich-Lassen zu behaupten.
- source_word: מְעַט הַצֹּאן הָהֵנָּה
  choice: die paar Schafe dort
  rationale: „Die paar Schafe“ gibt die geringe Zahl und Eliabs herablassenden Ton natürlich wieder; הָהֵנָּה wird als auf die Schafe bezogenes „dort“ ausgedrückt.
- source_word: בַּמִּדְבָּר
  choice: in der Steppe
  rationale: מִדְבָּר bezeichnet hier unbebautes, als Weideland nutzbares Gelände. „Steppe“ ist im Deutschen für den Hirtenkontext natürlicher und weniger missverständlich als „Wüste“.
- source_word: זְדֹנְךָ
  choice: deine Vermessenheit
  rationale: זָדוֹן bezeichnet anmaßende Überheblichkeit oder Frechheit. „Vermessenheit“ bewahrt den moralischen Vorwurf und die Bedeutungsbreite; Alternativen werden in einer Fußnote genannt.
- source_word: רֹעַ לְבָבֶךָ
  choice: die Bosheit deines Herzens
  rationale: Die Formulierung bewahrt sowohl die moralische Wertung רֹעַ als auch das Herz als Sitz der inneren Haltung.
- source_word: כִּי לְמַעַן רְאוֹת הַמִּלְחָמָה יָרָדְתָּ
  choice: Du bist doch nur herabgekommen, um den Kampf zu sehen!
  rationale: לְמַעַן mit Infinitiv bezeichnet den Zweck. „Doch nur“ macht den anklagenden Folgerungs- und Ausschließlichkeitswert der Äußerung im Deutschen hörbar, während הַמִּלְחָמָה im unmittelbaren Kontext als „der Kampf“ wiedergegeben wird.
