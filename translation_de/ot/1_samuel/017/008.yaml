base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: de
  text: 'Er stellte sich hin, rief den Schlachtreihen Israels zu und sagte zu ihnen: »Warum zieht ihr aus und stellt euch zur Schlacht auf? Bin ich nicht der Philister, und seid ihr nicht Sauls Sklaven[a]? Wählt euch einen Mann aus, und er soll zu mir herunterkommen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sauls Knechte“ beziehungsweise „Diener Sauls“. Das hebräische Wort kann Diener, Knechte oder Sklaven bezeichnen; hier hat es in Goliats Spott einen erniedrigenden Klang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Er stellte sich hin
  rationale: Die Form bezeichnet im Erzählzusammenhang das Einnehmen einer stehenden, konfrontativen Position. „Er stellte sich hin“ klingt im modernen Deutschen natürlicher als das missverständliche „Er stand auf“.
- source_word: וַיִּקְרָא אֶל
  choice: rief … zu
  rationale: קרא bezeichnet hier einen lauten Ruf an die gegnerischen Formationen; „zurufen“ gibt Adressierung und Lautstärke idiomatisch wieder.
- source_word: מַעַרְכוֹת יִשְׂרָאֵל
  choice: den Schlachtreihen Israels
  rationale: Das Substantiv meint geordnete militärische Formationen. „Schlachtreihen“ bewahrt dieses konkrete Bild.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: euch zur Schlacht aufzustellen
  rationale: ערך mit מלחמה bezeichnet das Ordnen beziehungsweise Aufstellen zum Kampf. Die reflexive deutsche Formulierung entspricht dem militärischen Zusammenhang.
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: Bin ich nicht der Philister
  rationale: Der bestimmte Artikel wird bewahrt. Goliat stellt sich als der repräsentative Kämpfer der Philister dar.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: Sauls Sklaven
  rationale: עֲבָדִים kann Diener, Knechte oder Sklaven bezeichnen. In Goliats höhnischer Gegenüberstellung bringt „Sklaven“ die erniedrigende Unterordnung deutlich zum Ausdruck; die breitere lexikalische Möglichkeit wird in einer Fußnote offengehalten.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: Wählt euch einen Mann aus
  rationale: Der Imperativ fordert die Auswahl eines einzelnen männlichen Kämpfers. „Einen Mann“ bewahrt Numerus und Geschlecht des hebräischen Ausdrucks.
- source_word: וְיֵרֵד אֵלָי
  choice: und er soll zu mir herunterkommen
  rationale: Die Form hat nach dem Imperativ auffordernden Sinn. „Soll“ gibt diesen Jussiv wieder, während „herunterkommen“ die im Verb ירד enthaltene Abwärtsbewegung erhält.
theological_decisions:
- issue: Sozialer Status in עֲבָדִים לְשָׁאוּל
  choice: Sauls Sklaven
  alternative: Sauls Knechte / Diener Sauls
  rationale: Der Kontext ist eine demütigende Kampfansage, doch das hebräische Wort legt nicht in jedem Zusammenhang eindeutig einen rechtlichen Sklavenstatus fest. Die Hauptfassung wahrt die Schärfe des Spotts, die Fußnote die lexikalische Spannweite.
- issue: Bestimmtheit von הַפְּלִשְׁתִּי
  choice: der Philister
  alternative: ein Philister
  rationale: Der hebräische Artikel ist ausdrücklich vorhanden. Die Übersetzung lässt die mögliche repräsentative beziehungsweise herausfordernde Selbstbezeichnung stehen, ohne sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Bildsprache. Die direkte Rede bleibt scharf und mündlich, ohne altertümelnde Syntax. „Schlachtreihen“, „zur Schlacht aufstellen“ und „herunterkommen“ bewahren die räumlichen und formationalen Einzelheiten des Hebräischen.
