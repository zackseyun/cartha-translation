  naturalness: Die Formulierung ist modernes, gut lesbares Standarddeutsch und wahrt einen würdigen Erzählton. „Das Haus seines Vaters“ ist als traditionelle, verständliche Bezeichnung des Familienverbands hier passend.
  terminology: „Israeliten“, „Israel“, „verhöhnen“ und „das Haus seines Vaters“ sind sachgerecht. Die wahrscheinliche Befreiung von Abgaben bzw. Dienstpflichten soll in der Fußnote, nicht in der Hauptübersetzung, erläutert werden.
