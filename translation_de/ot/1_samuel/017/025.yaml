  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: de
  text: 'Die Israeliten sagten: „Habt ihr diesen Mann gesehen, der da heraufkommt? Er kommt herauf, um Israel zu verhöhnen. Wer ihn niederschlägt, den wird der König überaus reich machen; er wird ihm seine Tochter geben und das Haus seines Vaters in Israel frei machen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Israel frei machen“. Gemeint ist wahrscheinlich die Befreiung von Steuern, Abgaben oder königlichen Dienstpflichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: Die Israeliten
  rationale: Der morphologische Singular wird im Zusammenhang kollektiv beziehungsweise generisch gebraucht; der deutsche Plural gibt die unter den Soldaten umlaufende Äußerung natürlich wieder.
- source_word: הַרְּאִיתֶם
  choice: Habt ihr ... gesehen
  rationale: Das Perfekt der zweiten Person maskulin Plural mit Fragepartikel wird als rhetorische Frage im unmittelbaren Gespräch wiedergegeben.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: diesen Mann ..., der da heraufkommt
  rationale: Das Partizip bezeichnet das gegenwärtige Heraufkommen; „da“ macht den hinweisenden Charakter von הַזֶּה im Deutschen hörbar.
- source_word: כִּי
  choice: Er
  rationale: כִּי leitet hier eine erläuternde, nachdrückliche Aussage ein. Im Deutschen genügt ein neuer Aussagesatz, ohne eine möglicherweise missverständliche kausale Verknüpfung einzuführen.
- source_word: לְחָרֵף
  choice: um ... zu verhöhnen
  rationale: חרף bezeichnet hier eine öffentliche, verächtliche Herausforderung. „Verhöhnen“ wahrt sowohl den Spott als auch die Ehrverletzung.
- source_word: יַכֶּנּוּ
  choice: ihn erschlägt
  rationale: נכה kann „schlagen“, „niederschlagen“ oder im Kontext „erschlagen“ bedeuten. Angesichts des Kampfes gegen Goliat bezeichnet es hier den tödlichen Sieg.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: den wird der König überaus reich machen
  rationale: Die Verbindung von kausativem Verb und stammverwandtem Substantiv wird in natürlichem Deutsch durch „überaus reich machen“ intensiviert.
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: er wird ihm seine Tochter geben
  rationale: Die Wendung bezeichnet die versprochene Tochter des Königs als Ehefrau, ohne das im Hebräischen nur implizite Heiraten unnötig auszuschreiben.
- source_word: בֵּית אָבִיו
  choice: das Haus seines Vaters
  rationale: Die wörtliche, im biblischen Deutsch verständliche Wendung bezeichnet den väterlichen Familien- und Haushaltsverband.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: in Israel von Abgaben und Diensten befreien
  rationale: חָפְשִׁי meint in diesem administrativen Zusammenhang wahrscheinlich die Befreiung von königlichen Lasten. Die Fußnote bewahrt die allgemeinere wörtliche Möglichkeit.
