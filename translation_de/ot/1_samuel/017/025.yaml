  register: Modernes, würdiges Standarddeutsch. Die Rede klingt wie eine unter den Soldaten weitergegebene Bekanntmachung. Hebräische Wiederholungen werden dort bewahrt, wo sie den Spott Goliats betonen, und dort idiomatisch verdichtet, wo eine wörtliche Wiedergabe im Deutschen schwerfällig wäre.
