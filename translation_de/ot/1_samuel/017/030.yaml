  text: וַ/יִּסֹּ֤ב מֵֽ/אֶצְל/וֹ֙ אֶל מ֣וּל אַחֵ֔ר וַ/יֹּ֖אמֶר כַּ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יְשִׁבֻ֤/הוּ הָ/עָם֙ דָּבָ֔ר כַּ/דָּבָ֖ר הָ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/030.yaml
  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: de
  text: Dann wandte er sich von ihm ab und einem anderen zu und sagte dasselbe. Das Volk antwortete ihm wie zuvor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Das Volk antwortete ihm ein Wort wie das erste Wort“, das heißt, es gab ihm dieselbe Antwort wie zuvor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: wandte er sich von ihm ab
  rationale: סבב beschreibt hier Davids körperliche Abwendung von Eliab; מֵאֶצְלוֹ bezeichnet die Bewegung von dessen Seite weg. Die Formulierung ist natürlich und bewahrt beide Nuancen.
- source_word: אֶל מוּל אַחֵר
  choice: und einem anderen zu
  rationale: Die Wendung bezeichnet die Hinwendung zu einer anderen Person. Im Deutschen bildet „sich … einem anderen zuwenden“ die räumliche Ausrichtung idiomatisch ab.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: und sagte dasselbe
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Äußerung“ bedeuten. Im Kontext wiederholt David seine vorherige Frage; „sagte dasselbe“ gibt dies knapp und verständlich wieder.
- source_word: וַיְשִׁבֻהוּ
  choice: antwortete ihm
  rationale: Die Hifil-Form von שׁוב bezeichnet hier das Erwidern beziehungsweise Zurückgeben einer Antwort.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם bedeutet grundsätzlich „Volk“ oder „Leute“. Die Übersetzung wahrt die breite Bezeichnung, ohne sie ausdrücklich auf Soldaten einzuengen.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: wie zuvor
  rationale: Die wörtliche Wendung „ein Wort wie das erste Wort“ besagt, dass die Antwort der vorherigen entsprach. „Wie zuvor“ ist eine natürliche, sinngenaue Wiedergabe.
