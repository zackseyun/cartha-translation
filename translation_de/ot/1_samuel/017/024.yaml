  text: And every man of Israel, when they saw the man, fled from before him and were very afraid.
translation:
  language: de
  text: Als alle Männer Israels den Mann sahen, flohen sie vor ihm und fürchteten sich sehr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: Als alle Männer Israels
  rationale: Der distributive Singular bezeichnet hier kollektiv die Männer Israels; der deutsche Plural entspricht auch den pluralischen Verben des hebräischen Satzes. Das einleitende וְ wird im fortlaufenden Erzählzusammenhang natürlich durch die temporale Konstruktion wiedergegeben.
- source_word: בִּרְאוֹתָם אֶת־הָאִישׁ
  choice: den Mann sahen
  rationale: Die Infinitivkonstruktion mit pluralischem Suffix bedeutet zeitlich „als sie den Mann sahen“. „Der Mann“ bewahrt die wiederholte Bezeichnung für Goliat im Kontext.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: flohen sie vor ihm
  rationale: נוס bezeichnet Flucht; מִפָּנָיו ist idiomatisch und präzise mit „vor ihm“ wiedergegeben.
- source_word: וַיִּירְאוּ מְאֹד
  choice: und fürchteten sich sehr
  rationale: Die Form von ירא bezeichnet starke Furcht; מְאֹד verstärkt sie mit „sehr“.
theological_decisions: []
