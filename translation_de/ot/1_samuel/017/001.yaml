id: 1SA.17.1
reference: 1 Samuel 17:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּאַסְפ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/מִּלְחָמָ֔ה וַ/יֵּאָ֣סְפ֔וּ שֹׂכֹ֖ה אֲשֶׁ֣ר לִ/יהוּדָ֑ה וַֽ/יַּחֲנ֛וּ בֵּין שׂוֹכֹ֥ה וּ/בֵין עֲזֵקָ֖ה בְּ/אֶ֥פֶס דַּמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: de
  text: Die Philister sammelten ihre Heere zum Kampf[a]. Sie versammelten sich bei Socho[b], das zu Juda gehörte, und schlugen zwischen Socho und Aseka bei Efes-Dammim ihr Lager auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Heerlager«. Das hebräische Wort kann sowohl militärische Lager als auch die dort versammelten Heere bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Socho war eine Stadt im Gebiet Judas.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: sammelten
  rationale: Die narrative Verbform von אָסַף bedeutet hier »sammeln« bzw. »zusammenziehen«. »Sammelten« gibt den Vorgang natürlich und ohne einen im Hebräischen nicht ausdrücklich vorhandenen Zeitmarker wieder.
- source_word: מַחֲנֵיהֶם
  choice: ihre Heere
  rationale: מַחֲנֶה kann sowohl ein Lager als auch die darin versammelte Streitmacht bezeichnen. Im Zusammenhang mit dem Kampf ist »Heere« im Deutschen verständlich und sachgerecht; die wörtlichere Möglichkeit »Heerlager« bleibt in der Fußnote sichtbar.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: מִלְחָמָה kann »Krieg« oder »Kampf« bedeuten. Hier geht es konkret um das Zusammenziehen der Truppen zur bevorstehenden Schlacht.
- source_word: וַיֵּאָסְפוּ
  choice: sie versammelten sich
  rationale: Die passive bzw. reflexive Form von אָסַף bezeichnet das Zusammenkommen an einem Ort. Die deutsche reflexive Wendung bildet dies klar ab.
- source_word: שֹׂכֹה
  choice: Socho
  rationale: Gebräuchliche deutsche Wiedergabe des judäischen Ortsnamens.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: das zu Juda gehörte
  rationale: Die Konstruktion mit לְ bezeichnet die territoriale Zugehörigkeit Sochos zu Juda.
- source_word: וַיַּחֲנוּ
  choice: schlugen ... ihr Lager auf
  rationale: חנה bedeutet »lagern« oder »sein Lager aufschlagen«. Die gewählte Wendung ist natürliches modernes Deutsch und bewahrt das konkrete Bild.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und
  rationale: Direkte und eindeutige Wiedergabe der räumlichen Beziehung.
- source_word: עֲזֵקָה
  choice: Aseka
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: בְּאֶפֶס דַּמִּים
  choice: bei Efes-Dammim
  rationale: Die Wortfolge wird als Ortsname verstanden. »Bei« bezeichnet den Ort des Lagers, ohne zu behaupten, es habe innerhalb einer Siedlung gelegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden aufeinanderfolgenden Formen von אָסַף werden mit »sammelten« und »versammelten sich« unterschieden. Die Ortsnamen folgen geläufigen deutschen Bibelformen; die Zugehörigkeit Sochos zu Juda bleibt ausdrücklich erhalten.
