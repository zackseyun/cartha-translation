base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: de
  text: Während er noch mit ihnen redete, siehe, da kam der Vorkämpfer[a] herauf, der Philister Goliat aus Gat, aus den Schlachtreihen der Philister[b]. Er sprach dieselben Worte, und David hörte es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „der Mann zwischen den beiden Seiten“; gemeint ist ein stellvertretender Kämpfer, der zum Einzelkampf zwischen die Heere tritt.'
    reason: lexical_alternative
  - marker: b
    text: Die Lesetradition (Qere) lautet „aus den Schlachtreihen der Philister“. Die Konsonantenschreibung (Ketiv) ist an dieser Stelle schwierig; auch „aus den Kampfaufstellungen der Philister“ wird übersetzt.
    reason: textual_variant
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: noch mit ihnen redete
  rationale: Die partizipiale Konstruktion bezeichnet eine gerade andauernde Handlung; „mit ihnen“ bewahrt den wechselseitigen Charakter des Gesprächs.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: „Siehe“ erhält das hebräische Aufmerksamkeitssignal und „da“ bindet es natürlich in die deutsche Erzählung ein.
- source_word: אִישׁ הַבֵּנַיִם
  choice: Vorkämpfer
  rationale: Der Ausdruck bezeichnet einen repräsentativen Einzelkämpfer zwischen den beiden Heeren. „Vorkämpfer“ ist im militärischen Zusammenhang präziser als das heute oft wertende „Champion“.
- source_word: עוֹלֶה
  choice: kam … herauf / hervortrat
  rationale: Das Partizip schildert Goliat beim Heraufkommen aus der philistäischen Schlachtreihe; die deutsche Formulierung gibt Bewegung und Herkunft verständlich wieder.
- source_word: גָּלְיָת הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת
  choice: Goliat, so hieß der Philister aus Gat
  rationale: Die hebräische Namensformel wird in natürlichem, würdigem Deutsch wiedergegeben, ohne Angaben auszulassen.
- source_word: ממערות [מִמַּעַרְכוֹת] פְּלִשְׁתִּים
  choice: aus den Schlachtreihen der Philister
  rationale: Die überlieferte Lesetradition weist auf die Aufstellungen beziehungsweise Schlachtreihen der Philister; die schwierige Textform wird in einer Fußnote kenntlich gemacht.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: Er sagte dieselben Worte
  rationale: Die Wendung verweist auf die zuvor berichtete Herausforderung Goliats; „dieselben Worte“ macht diesen Rückbezug im Deutschen deutlich.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: und David hörte es
  rationale: Das Verb bezeichnet schlicht das Hören; „es“ nimmt im Deutschen natürlich die unmittelbar zuvor genannten Worte auf.
