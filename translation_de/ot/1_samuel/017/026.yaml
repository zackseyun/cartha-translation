  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶֽל הָ/אֲנָשִׁ֞ים הָ/עֹמְדִ֣ים עִמּ/וֹ֮ לֵ/אמֹר֒ מַה יֵּעָשֶׂ֗ה לָ/אִישׁ֙ אֲשֶׁ֤ר יַכֶּה֙ אֶת הַ/פְּלִשְׁתִּ֣י הַלָּ֔ז וְ/הֵסִ֥יר חֶרְפָּ֖ה מֵ/עַ֣ל יִשְׂרָאֵ֑ל כִּ֣י מִ֗י הַ/פְּלִשְׁתִּ֤י הֶֽ/עָרֵל֙ הַ/זֶּ֔ה כִּ֣י חֵרֵ֔ף מַעַרְכ֖וֹת אֱלֹהִ֥ים חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: de
  text: 'David sagte zu den Männern, die bei ihm standen: »Was wird für den Mann getan, der diesen Philister erschlägt und die Schande von Israel wegnimmt? Denn wer ist dieser unbeschnittene Philister, der die Schlachtreihen des lebendigen Gottes verhöhnt hat?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: erschlägt
  rationale: Das Verb נכה bezeichnet hier im militärischen Zusammenhang das tödliche Niederschlagen des Philisters; »erschlägt« gibt dies natürlich und präzise wieder.
- source_word: חֶרְפָּה
  choice: Schande
  rationale: חֶרְפָּה bezeichnet Schmach oder entehrende Beschimpfung; »Schande« passt zur öffentlichen Demütigung Israels.
- source_word: מַעַרְכוֹת
  choice: Schlachtreihen
  rationale: Der Plural bezeichnet die geordneten Heeres- bzw. Kampfreihen Israels und bewahrt das konkrete militärische Bild.
- source_word: חֵרֵף
  choice: verhöhnt
  rationale: Das Verb trägt den Sinn von schmähen, verhöhnen oder herausfordern; »verhöhnt« bringt die öffentliche Geringschätzung treffend zum Ausdruck.
- source_word: אֱלֹהִים חַיִּים
  choice: des lebendigen Gottes
  rationale: Die traditionelle und natürliche deutsche Wiedergabe erhält den Gegensatz zwischen Israels lebendigem Gott und machtlosen Göttern.
theological_decisions:
- issue: Bedeutung der Bezeichnung »unbeschnitten«
  choice: unbeschnittener Philister
  alternative: gottloser Philister
  rationale: Die konkrete Bundes- und Volksbezeichnung des Hebräischen wird bewahrt und nicht durch eine deutende Umschreibung ersetzt.
- issue: Syntax von כִּי ... כִּי חֵרֵף
  choice: »Denn wer ist dieser …, dass er … verhöhnt?«
  alternative: »Denn wer ist dieser …, dieser da, der … verhöhnt hat?«
  rationale: Die deutsche Konstruktion gibt die empörte rhetorische Frage und den folgernden Sinn des zweiten כִּי idiomatisch wieder, ohne Davids Aussage theologisch auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt kraftvoll und verständlich; »Schlachtreihen« erhält das militärische Bild des Ausgangstextes.
