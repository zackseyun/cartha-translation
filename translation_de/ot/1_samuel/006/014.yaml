base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: de
  text: Der Wagen kam auf das Feld Josuas aus Bet-Schemesch und blieb dort stehen. Dort war ein großer Stein. Da spalteten sie das Holz des Wagens und brachten die Kühe Jahwe als Brandopfer dar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: der Wagen
  rationale: Der Ausdruck bezeichnet hier das Fahrzeug, auf dem die Lade befördert wurde; »Wagen« ist im Deutschen die natürliche Wiedergabe.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: das Feld Josuas aus Bet-Schemesch
  rationale: Die hebräische Fügung kennzeichnet Josua durch seine Zugehörigkeit zu Bet-Schemesch. Die deutsche Form ist klarer und natürlicher als ein künstliches Gentiliz.
- source_word: וַתַּעֲמֹד שָׁם
  choice: und blieb dort stehen
  rationale: עמד bedeutet wörtlich »stehen«; bei einem fahrenden Wagen bezeichnet es hier dessen Anhalten. »Blieb stehen« wahrt das Bild und ist idiomatisch.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: Dort lag ein großer Stein
  rationale: Der Nominalsatz stellt das Vorhandensein eines großen Steins an diesem Ort fest. »Lag« ist im Deutschen bei einem Stein natürlich, ohne zusätzliche Deutung einzuführen.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: Da spalteten sie das Holz des Wagens
  rationale: בקע bezeichnet das Spalten beziehungsweise Zerteilen; das Wagenholz wird als Brennmaterial vorbereitet.
- source_word: הַפָּרוֹת
  choice: die Kühe
  rationale: פרות bezeichnet weibliche Rinder. Da der Kontext säugende Tiere voraussetzt, ist »Kühe« genauer als »Färsen«.
- source_word: הֶעֱלוּ עֹלָה
  choice: brachten ... als Brandopfer dar
  rationale: Die feste Opferformulierung bezeichnet die vollständige Darbringung als Brandopfer; die gewählte Formulierung ist präzise und idiomatisch.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der offenbarte Eigenname Gottes wiedergegeben; »Jahwe« ist die gebräuchliche deutsche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Wiedergabe »Jahwe« erhält dessen Charakter als Eigenname, während »der HERR« die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Moderne, würdige Standardsprache mit flüssiger Erzählfolge. Die Wiederholung von שָׁם wird durch zwei kurze Sätze bewahrt, ohne im Deutschen schwerfällig zu wirken.
