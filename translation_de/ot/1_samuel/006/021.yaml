  source_fidelity: 'Der Text gibt die Abfolge und Aussage des Hebräischen zuverlässig wieder: menschliche Boten, die Bewohner von Kirjat-Jearim, die Rückgabe der Lade durch die Philister sowie die Imperative zum Herabkommen bzw. Hinaufbringen bleiben erhalten. „Kommt herab“ ist als perspektivische Wiedergabe von רְדוּ möglich; die Fußnote bewahrt die ebenso mögliche Lesart „Geht hinab“.'
