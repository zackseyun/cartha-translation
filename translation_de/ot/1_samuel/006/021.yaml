  terminology: „Kirjat-Jearim“, „Philister“, „Lade Jahwes“ und „Jahwe“ sind konsistent und sachgerecht. „Lade Jahwes“ folgt dem Wortlaut, ohne das im Vers nicht ausdrücklich vorhandene „Bundes-“ einzutragen. Die Wiedergabe des Gottesnamens stimmt mit der maßgeblichen englischen theologischen Entscheidung für Yahweh überein.
