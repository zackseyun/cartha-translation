source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: de
  text: 'Da schickten sie Boten zu den Einwohnern von Kirjat-Jearim und ließen ihnen sagen: »Die Philister haben die Lade Jahwes zurückgebracht. Kommt herab und bringt sie zu euch hinauf!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geht hinab und bringt sie zu euch hinauf!« Das Hebräische verwendet Richtungsverben („hinabgehen“ und „hinaufbringen“), die wahrscheinlich die Geländeverhältnisse zwischen Bet-Schemesch und Kirjat-Jearim widerspiegeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ מַלְאָכִים
  choice: Da schickten sie Boten
  rationale: Die Erzählform führt die Handlung weiter; „Da“ gibt den Zusammenhang im Deutschen natürlich wieder. מַלְאָכִים bezeichnet hier eindeutig menschliche Boten.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: die Einwohner von Kirjat-Jearim
  rationale: Die substantivierte Partizipialform bezeichnet die dort Wohnenden. Der Ortsname wird in einer geläufigen deutschen Transliteration wiedergegeben.
- source_word: לֵאמֹר
  choice: und ließen ihnen sagen
  rationale: Die deutsche Botenformel gibt die Einleitung der direkten Rede idiomatisch wieder, ohne den Inhalt zu verändern.
- source_word: הֵשִׁבוּ
  choice: haben … zurückgebracht
  rationale: Der Hifil von שׁוב bedeutet hier, etwas zurückzubringen. Das Perfekt bezeichnet die bereits vollzogene, für die Empfänger relevante Handlung.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die knappe deutsche Konstruktion entspricht der hebräischen Status-constructus-Verbindung; „Lade“ ist die etablierte Bezeichnung des heiligen Behältnisses.
- source_word: רְדוּ
  choice: Kommt herab
  rationale: Der Imperativ Plural von ירד bezeichnet eine Abwärtsbewegung. „Kommt“ entspricht der Perspektive der Sprecher, während die mögliche Wiedergabe „Geht“ in der Fußnote offengehalten wird.
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: bringt sie zu euch hinauf
  rationale: Der Hifil von עלה bewahrt ausdrücklich die Aufwärtsbewegung; אֲלֵיכֶם wird mit „zu euch“ wiedergegeben. Das feminine Pronomen „sie“ bezieht sich im Deutschen auf „die Lade“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen transparent wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  alternative: die Bundeslade Jahwes
  rationale: Im Vers steht lediglich „Lade Jahwes“, nicht die ausführlichere Bezeichnung „Bundeslade“. Die Übersetzung fügt daher keine hier unausgesprochene Bestimmung hinzu.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die topografischen Richtungsangaben bleiben trotz ihrer im Deutschen ungewohnten Verbindung erhalten; die Fußnote weist auf die mögliche alternative Perspektive des ersten Imperativs hin.
