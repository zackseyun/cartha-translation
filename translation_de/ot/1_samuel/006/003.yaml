source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: de
  text: 'Und sie sagten: »Wenn ihr die Lade des Gottes Israels fortschickt, dann schickt sie nicht leer fort. Ihr müsst ihm unbedingt ein Schuldopfer[a] darbringen. Dann werdet ihr geheilt werden, und ihr werdet erfahren, warum seine Hand[b] nicht von euch gewichen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Wiedergutmachungsopfer“.'
    reason: lexical_alternative
  - marker: b
    text: „Seine Hand“ ist ein hebräisches Bild für Gottes wirksame Macht, hier in Gericht und Bedrängnis.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: fortschickt / schickt ... fort
  rationale: שׁלח bezeichnet hier das Weg- beziehungsweise Zurücksenden der Lade aus dem Gewahrsam der Philister. „Fortschicken“ bewahrt die Wiederholung und klingt im Deutschen natürlich.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: die Lade des Gottes Israels
  rationale: Die Genitivverbindung wird unmittelbar wiedergegeben; die im Vers nicht enthaltene Bezeichnung „Bundeslade“ wird nicht ergänzt.
- source_word: רֵיקָם
  choice: leer
  rationale: „Leer“ entspricht dem hebräischen Adverb und lässt den Sinn zu, dass die Lade nicht ohne eine begleitende Wiedergutmachung zurückgesandt werden soll.
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: ihr müsst ... unbedingt darbringen
  rationale: Infinitivus absolutus und finites Verb verstärken die Aussage. „Müsst ... unbedingt“ gibt Nachdruck und Verpflichtung wieder; bei einem Opfer ist „darbringen“ im Deutschen sachgemäßer als ein wörtliches „zurückgeben“.
- source_word: לּוֹ
  choice: ihm
  rationale: Das maskuline Suffix bezieht sich im Zusammenhang am ehesten auf den Gott Israels, dem das Opfer gilt.
- source_word: אָשָׁם
  choice: Schuldopfer
  rationale: אָשָׁם bezeichnet ein Opfer, das Schuld und Wiedergutmachung betrifft. „Schuldopfer“ ist verständlich und in deutscher Bibelsprache etabliert; die reparative Nuance wird in einer Fußnote genannt.
- source_word: תֵּרָפְאוּ
  choice: ihr werdet geheilt werden
  rationale: Der Nifal von רפא bezeichnet hier das Befreitwerden von der auferlegten Plage und wird in seiner passiven Form bewahrt.
- source_word: וְנוֹדַע לָכֶם
  choice: ihr werdet erfahren
  rationale: Die hebräische unpersönlich-passive Wendung bedeutet, dass ihnen die Ursache erkennbar werden wird. „Ihr werdet erfahren“ ist im modernen Deutsch natürlicher als „es wird euch bekannt werden“.
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: warum seine Hand nicht von euch gewichen ist
  rationale: Das Bild der göttlichen Hand bleibt erhalten. Das Perfekt „ist ... gewichen“ gibt den bis dahin fortdauernden Zustand im Kontext wieder.
theological_decisions:
- issue: Bezugswort des Pronomens לּוֹ
  choice: „ihm“, bezogen auf den Gott Israels
  alternative: „ihr“, bezogen auf die Lade, sodass das Opfer mit ihr zurückgeschickt wird
  rationale: Der Ausdruck „Gott Israels“ bietet einen persönlichen maskulinen Bezug, und ein אָשָׁם wird Gott als Wiedergutmachungsopfer dargebracht. Die praktische Begleitung der Lade durch Opfergaben bleibt durch den Kontext dennoch erkennbar.
- issue: Bedeutung von „seine Hand“
  choice: Das hebräische Bild für Gottes richtende und bedrängende Macht wird wörtlich bewahrt.
  alternative: Deutende Wiedergaben wie „seine Strafe“ oder „seine Plage“
  rationale: Das Bild ist im Alten Testament theologisch bedeutsam und im Zusammenhang verständlich. Eine auflösende Übersetzung würde die Aussage unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; Wiederholungen und das Bild von Gottes Hand bleiben erhalten. Die Fußnotenmarker stehen bei den Ausdrücken, die sie tatsächlich erläutern.
