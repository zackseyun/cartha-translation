source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אַנְשֵׁ֣י בֵֽית שֶׁ֔מֶשׁ מִ֚י יוּכַ֣ל לַ/עֲמֹ֔ד לִ/פְנֵ֨י יְהוָ֧ה הָ/אֱלֹהִ֛ים הַ/קָּד֖וֹשׁ הַ/זֶּ֑ה וְ/אֶל מִ֖י יַעֲלֶ֥ה מֵ/עָלֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: de
  text: 'Da sagten die Männer von Bet-Schemesch: „Wer kann vor Jahwe, diesem heiligen Gott, bestehen? Und zu wem soll es von uns weg hinaufgehen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Subjekt bleibt im Hebräischen unausgesprochen. Wahrscheinlich ist die Lade Jahwes gemeint: „Und zu wem soll sie von uns weg hinaufgehen?“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das konsekutive Waw führt die Erzählung weiter; „Da sagten“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: die Männer von Bet-Schemesch
  rationale: אַנְשֵׁי bedeutet wörtlich „Männer von“. Die Wiedergabe bewahrt die maskuline Bezeichnung und verwendet die im Deutschen geläufige Form des Ortsnamens.
- source_word: מִי יוּכַל לַעֲמֹד לִפְנֵי
  choice: Wer kann vor … bestehen?
  rationale: „Vor jemandem bestehen“ gibt sowohl das Stehen vor Gottes Gegenwart als auch die im Zusammenhang hervorgehobene Unfähigkeit angesichts seiner Heiligkeit natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: diesem heiligen Gott
  rationale: Die Formulierung bewahrt Heiligkeitsattribut und Demonstrativpronomen und klingt zugleich idiomatisch deutsch.
- source_word: וְאֶל מִי יַעֲלֶה
  choice: Und zu wem soll es … hinaufgehen?
  rationale: עלה bedeutet „hinaufgehen“. Das unpersönliche „es“ lässt das im Hebräischen nicht ausdrücklich genannte Subjekt offen, ohne es im Deutschen eindeutig mit Jahwe gleichzusetzen.
- source_word: מֵעָלֵינוּ
  choice: von uns weg
  rationale: Die Wendung bezeichnet hier eine Bewegung aus ihrer Nähe fort; „von uns weg“ drückt dies im Deutschen klar und knapp aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als persönlichen Namen statt ihn durch einen Titel zu ersetzen.
- issue: Unausgesprochenes Subjekt von יַעֲלֶה
  choice: es … hinaufgehen
  alternative: er … hinaufgehen / sie, die Lade, … hinaufgehen
  rationale: Das hebräische Verb steht im maskulinen Singular, nennt aber kein Subjekt. Wahrscheinlich ist die Lade gemeint; eine ausdrückliche Nennung oder das deutsche feminine Pronomen „sie“ würde diese Deutung jedoch in den Haupttext eintragen. Das unpersönliche „es“ wahrt die Offenheit, während die Fußnote den wahrscheinlichen Bezug erklärt.
translation_notes:
  register: Moderne, würdige Standardsprache. „Bestehen“ trägt den feierlich-ernsten Sinn der Begegnung mit Gottes Heiligkeit, ohne altertümlich zu wirken. Der Ortsname folgt der geläufigen deutschen Schreibung „Bet-Schemesch“.
