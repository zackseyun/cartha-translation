base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: de
  text: Die Bewohner von Bet-Schemesch waren im Tal mit der Weizenernte beschäftigt. Sie blickten auf[a], sahen die Lade und freuten sich, sie zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie erhoben ihre Augen“; eine hebräische Redewendung für das Aufblicken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Die Bewohner von Bet-Schemesch
  rationale: Der Ortsname steht metonymisch für seine Bewohner, wie die folgenden pluralischen Verbformen zeigen. „Bewohner“ macht dies geschlechtsneutral und natürlich deutlich.
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: waren … bei der Weizenernte
  rationale: Das Partizip bezeichnet eine andauernde Hintergrundhandlung. Die deutsche Verlaufsumschreibung gibt diese Szenensetzung natürlich wieder.
- source_word: בָּעֵמֶק
  choice: im Tal
  rationale: עֵמֶק bezeichnet ein Tal oder eine breite, tiefer gelegene Ebene; „im Tal“ ist hier die klare und unmittelbare Wiedergabe.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: Sie blickten auf
  rationale: Die hebräische Wendung bedeutet idiomatisch, den Blick zu heben. „blickten auf“ ist modernes, natürliches Deutsch; die wörtliche Bildsprache wird in der Fußnote genannt.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: sahen die Lade
  rationale: Im Erzählzusammenhang ist die bereits eingeführte Lade Gottes gemeint. „die Lade“ wahrt die knappe Form des Hebräischen, ohne die Bezeichnung unnötig zu erweitern.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: freuten sich, sie zu sehen
  rationale: Die Infinitivkonstruktion nennt den Anlass ihrer Freude. Das im Hebräischen unausgesprochene Objekt wird im Deutschen als „sie“ aufgenommen und bezieht sich eindeutig auf die Lade.
