base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: de
  text: Und nun beschafft einen neuen Wagen und zwei säugende Kühe[a], die noch nie ein Joch getragen haben[b]. Spannt die Kühe vor den Wagen und bringt ihre Kälber zurück ins Haus, fort von ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zwei Milchkühe“ oder „zwei Kühe, die Milch geben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf die noch kein Joch gekommen ist“; gemeint sind Kühe, die noch nicht als Zugtiere verwendet worden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Kennzeichnet den Übergang zur nächsten Anweisung und bewahrt zugleich das verbindende וְ.
- source_word: קְחוּ וַעֲשׂוּ
  choice: nehmt … und macht alles bereit
  rationale: Gibt beide Imperative wieder. „Macht alles bereit“ ist im Deutschen natürlicher als das wörtliche, aber missverständliche „nehmt und macht“ und kann Wagen und Kühe zusammenfassen.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: einen einzigen neuen Wagen
  rationale: „Wagen“ gibt עֲגָלָה im Kontext wieder; „einen einzigen“ erhält die ausdrücklich genannte Zahl im Kontrast zu den zwei Kühen.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: zwei säugende Kühe
  rationale: עָלוֹת bezeichnet Kühe, die Milch geben beziehungsweise Kälber säugen. „Säugende Kühe“ macht den Bezug zu den später genannten Kälbern deutlich.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: die noch nie ein Joch getragen haben
  rationale: Gibt die hebräische Wendung idiomatisch wieder und bezeichnet Kühe, die bislang nicht als Zugtiere eingesetzt worden waren; die wörtlichere Form steht in der Fußnote.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: Spannt die Kühe vor den Wagen
  rationale: א־ס־ר meint hier das Befestigen der Zugtiere am Wagen. „Vor den Wagen spannen“ ist die natürliche deutsche Sachentsprechung.
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: ihre Kälber aber bringt von ihnen weg zurück ins Haus
  rationale: Die Kausativform von שׁוב wird mit „bringt … zurück“ wiedergegeben; בְּנֵיהֶם bezeichnet bei Kühen ihre Kälber. „Von ihnen weg“ bewahrt die ausdrücklich angeordnete Trennung.
