  terminology: »Lade Jahwes« gibt אַרוֹן יְהוָה traditionsbewusst und sachgerecht wieder; »Jahwe« entspricht der vorgesehenen Wiedergabe des Gottesnamens. »Wahrsager« ist eine verständliche Wiedergabe von קֹסְמִים und wertet die im Text genannte Funktion nicht zusätzlich aus.
