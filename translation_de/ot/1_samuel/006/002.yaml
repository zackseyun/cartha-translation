  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: de
  text: 'Da riefen die Philister die Priester und die Wahrsager und sagten: »Was sollen wir mit der Lade Jahwes tun? Sagt uns, womit[a] wir sie an ihren Ort senden sollen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit was« oder »wodurch«; gefragt ist nach dem Mittel beziehungsweise dem, was die Sendung begleiten soll.'
    reason: Die Formulierung בַּמֶּה lässt offen, ob vor allem die Art der Rücksendung, ein Transportmittel oder mitgesandte Beigaben gemeint sind.
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Da riefen ...
  rationale: Die Erzählform führt den nächsten Handlungsschritt ein. »Da riefen« gibt das Herbeirufen der religiösen Fachleute natürlich und knapp wieder.
- source_word: לַכֹּהֲנִים
  choice: die Priester
  rationale: Der hebräische Ausdruck ist bestimmt. Gemeint sind im Zusammenhang philistäische Kultbeamte; eine erklärende Ergänzung ist im Haupttext nicht nötig.
- source_word: וְלַקֹּסְמִים
  choice: und die Wahrsager
  rationale: קֹסְמִים bezeichnet Menschen, die durch mantische Praktiken verborgene Erkenntnis suchen. »Wahrsager« ist im modernen Deutsch verständlich und weniger fachsprachlich als »Divinatoren«.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן יְהוָה
  choice: Was sollen wir mit der Lade Jahwes tun?
  rationale: Die Formulierung gibt die beratende Frage idiomatisch wieder. לַאֲרוֹן wird in diesem Zusammenhang natürlich mit »mit der Lade« ausgedrückt.
- source_word: הוֹדִיעֻנוּ
  choice: Sagt uns
  rationale: Der Hifil-Imperativ von ידע bedeutet wörtlich »Lasst uns wissen«. »Sagt uns« ist eine natürliche und genaue deutsche Wiedergabe.
- source_word: בַּמֶּה
  choice: womit
  rationale: Die Präposition ב mit dem Fragewort fragt nach dem Mittel oder dem, was die Lade bei ihrer Rücksendung begleiten soll. »Womit« bewahrt diese Offenheit besser als das allgemeinere »wie«.
- source_word: נְשַׁלְּחֶנּוּ
  choice: wir sie ... senden sollen
  rationale: Das Suffix bezieht sich auf die Lade. »Senden sollen« entspricht dem beratenden Zusammenhang, ohne ein im Verb nicht ausdrücklich vorhandenes »zurück« einzufügen.
- source_word: לִמְקוֹמוֹ
  choice: an ihren Ort
  rationale: Die Lade ist im Deutschen feminin, daher »ihren«. Die Wiedergabe bleibt nahe am hebräischen »zu/an seinen Ort« und fügt nicht ausdrücklich »zurück« hinzu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה. »Jahwe« gibt ihn als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und beratend. »Lade« wird als etablierte biblische Bezeichnung beibehalten; »an ihren Ort senden« wahrt bewusst die leicht fremde, aber verständliche Form des Ausgangstextes.
