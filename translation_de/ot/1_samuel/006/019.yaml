base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: de
  text: Und er schlug unter den Männern von Bet-Schemesch einige, weil sie in die Lade Jahwes hineingeschaut hatten.[a] Er schlug unter dem Volk siebzig Mann, fünfzigtausend Mann.[b] Und das Volk trauerte, weil Jahwe dem Volk einen schweren Schlag versetzt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil sie die Lade Jahwes angesehen hatten“. Die hebräische Präposition kann allgemeiner verstanden werden; im Zusammenhang ist jedoch wahrscheinlich gemeint, dass sie hineingeschaut hatten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich lautet der schwierige hebräische Wortlaut: „siebzig Mann, fünfzigtausend Mann“. Möglich sind auch die Deutungen „siebzig von fünfzigtausend Mann“ oder „fünfzigtausendsiebzig Mann“; möglicherweise liegt ein Textproblem vor. Einige alte Textzeugen stützen eine wesentlich kleinere Zahl.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: er schlug
  rationale: Das Verb נכה bedeutet „schlagen“; im Zusammenhang ist der tödliche Ausgang klar. Die Wiederholung von „schlagen/Schlag“ bleibt dadurch erhalten.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: einige von den Männern aus Bet-Schemesch
  rationale: Die Präposition ב wird hier partitiv verstanden; „Männer“ gibt אַנְשֵׁי geschlechtsgenau wieder, während „aus“ die Ortszugehörigkeit natürlich ausdrückt.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: weil sie in die Lade Jahwes hineingeschaut hatten
  rationale: ראה mit ב kann „ansehen“ bedeuten; im erzählerischen Zusammenhang ist „hineinschauen“ wahrscheinlich, ohne dass die allgemeinere Deutung verschwiegen wird.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die traditionelle und verständliche deutsche Bezeichnung „Lade“ gibt die Konstruktverbindung knapp wieder; der Gottesname wird als Jahwe wiedergegeben.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: siebzig Mann, fünfzigtausend Mann
  rationale: Die schwierige Zahlenfolge des masoretischen Textes wird bewusst nicht geglättet oder eindeutig ausgelegt.
- source_word: וַיִּתְאַבְּלוּ
  choice: trauerte
  rationale: אבל bezeichnet Trauer oder Klage nach Tod und Unglück; „trauern“ ist im modernen Deutsch natürlich und präzise.
- source_word: מַכָּה גְדוֹלָה
  choice: einen schweren Schlag
  rationale: „Schlag“ bewahrt die Wortverbindung zum wiederholten Verb נכה; „schwer“ ist für die Wirkung eines Schlages idiomatischer als „groß“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ transliteriert, statt ihn durch einen Titel zu ersetzen.
- issue: 'Anlass des Gerichts: רָאוּ בַּאֲרוֹן'
  choice: in die Lade hineingeschaut
  alternative: die Lade angesehen
  rationale: „Hineingeschaut“ passt wahrscheinlich zum erzählerischen Verstoß; da die Präposition auch allgemeiner verstanden werden kann, wird die Alternative in einer Fußnote bewahrt.
- issue: Die schwierige Opferzahl
  choice: Die masoretische Folge „siebzig Mann, fünfzigtausend Mann“ im Haupttext bewahren
  alternative: „siebzig von fünfzigtausend Mann“, „fünfzigtausendsiebzig Mann“ oder eine kleinere Zahl nach manchen alten Textzeugen
  rationale: Der hebräische Wortlaut ist textlich beziehungsweise syntaktisch schwierig. Eine eindeutige Auflösung würde mehr festlegen, als die Überlieferung erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bet-Schemesch“ folgt einer geläufigen deutschen Transliteration. Die ungewöhnliche Zahlenfolge bleibt im Haupttext bewusst sperrig, damit die echte textliche und interpretative Unsicherheit sichtbar bleibt.
