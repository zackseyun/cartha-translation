    issue: „unter den fünf Herrschern“ gibt die Beziehung von Städten und den fünf סְרָנִים ungenau wieder.
    rationale: Das לְ markiert hier die Zuordnung zu den fünf philistäischen Oberherrschern, nicht ein bloßes Unterordnungsverhältnis im Sinn von „unter“. „Zu den fünf Fürsten gehörig“ macht die Beziehung deutlich.
  - severity: medium
    issue: Die Haupttextlesung „großer Stein“ weicht von der naheliegenden masoretischen Lesung als „großes Abel“/„Abel, der Große“ ab.
    rationale: Der Kontext und Vers 14 stützen die Steinlesung, doch die hebräische Überlieferung ist an dieser Stelle strittig. Die Fußnote soll die Ortsnamenlesung knapp und eindeutig als reale Alternative bewahren, ohne den masoretischen Wortlaut als eindeutig „großer Stein“ erscheinen zu lassen.
  - severity: low
    issue: „Jahwe“ entspricht nicht der für den POB-Audit vorgegebenen Form „Yahweh“.
    rationale: Die Form „Jahwe“ ist im Deutschen gebräuchlich, aber die projektweite Entscheidung zur sichtbaren Wiedergabe des Tetragramms soll hier konsistent umgesetzt werden.
