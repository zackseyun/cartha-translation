source:
  edition: WLC
  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: de
  text: und die goldenen Mäuse, entsprechend der Zahl aller Philisterstädte, die zu den fünf Fürsten gehörten, von der befestigten Stadt bis zum unbefestigten Dorf und bis zu dem großen Stein[a], auf dem sie die Lade Yahwehs abstellten. Er liegt bis heute auf dem Feld Josuas aus Bet-Schemesch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „bis zum großen Abel“; der masoretische Text kann hier als Ortsname verstanden werden. Die Lesung „großer Stein“ folgt dem Zusammenhang mit dem Stein, auf dem die Lade abgestellt wurde.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: die goldenen Mäuse
  rationale: עַכְבָּר kann Maus oder Ratte bezeichnen. „Mäuse“ entspricht der herkömmlichen Deutung der hier erwähnten Plagebilder; „goldenen“ gibt die hebräische Genitivverbindung im Deutschen natürlich wieder.
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: entsprechend der Zahl aller Philisterstädte
  rationale: מִסְפַּר bezeichnet hier die zahlenmäßige Entsprechung. Die Formulierung ist präzise und im Deutschen flüssiger als „gemäß der Zahl“.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: unter den fünf Herrschern
  rationale: סְרָנִים ist die besondere Bezeichnung für die führenden Herrscher der Philister. „Unter“ drückt die Zuordnung der Städte zu ihren Herrschaftsgebieten natürlich aus.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: von der befestigten Stadt bis zum unbefestigten Dorf
  rationale: Die Wendung umfasst das ganze Spektrum der Siedlungen und bewahrt den Gegensatz zwischen einem befestigten Ort und einem offenen, nicht ummauerten Dorf.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: und bis zu dem großen Stein[a]
  rationale: Der masoretische Text lautet formal „bis zum großen Abel“. Der unmittelbare Zusammenhang mit dem Ablegen der Lade und dem großen Stein aus Vers 14 spricht jedoch für die kontextuelle Lesart „großer Stein“, die mit einer Fußnote transparent gemacht wird.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: auf dem sie die Lade Jahwes abstellten
  rationale: הִנִּיחוּ bezeichnet das Nieder- oder Abstellen. „Abstellten“ passt natürlich zur erzählten Handlung und bewahrt den konkreten räumlichen Bezug.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Er liegt bis heute
  rationale: Die idiomatische Zeitangabe bezeichnet das Fortbestehen bis zur Abfassungszeit. Ein eigenes Prädikat macht den Bezug auf den Stein im Deutschen eindeutig und lesbar.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: auf dem Feld Josuas aus Bet-Schemesch
  rationale: בֵּית הַשִּׁמְשִׁי ist eine Herkunftsbezeichnung. „Josua aus Bet-Schemesch“ ist im modernen Deutschen natürlicher und verständlicher als ein eingedeutschtes Gentiliz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Textliche Mehrdeutigkeit bei אָבֵל הַגְּדוֹלָה
  choice: der große Stein im Haupttext, mit Kennzeichnung der masoretischen Lesart in der Fußnote
  alternative: das große Abel als Ortsname
  rationale: Der Zusammenhang verweist auf den großen Stein, auf dem die Lade abgestellt wurde; der überlieferte masoretische Wortlaut lässt sich dagegen als Ortsname „Abel“ verstehen. Die Fußnote bewahrt diese echte textliche Spannung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt als syntaktische Fortsetzung des vorhergehenden Verses bewusst mit „und“. Orts- und Personennamen folgen geläufigen deutschen Formen; der Gottesname wird als „Jahwe“ wiedergegeben. Die schwierige Textstelle wird im Haupttext kontextgerecht übersetzt und in der Fußnote quellentreu offengelegt.
