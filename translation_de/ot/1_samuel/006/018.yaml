  to: und die goldenen Mäuse, entsprechend der Zahl aller Philisterstädte, die zu den fünf Fürsten gehörten, von der befestigten Stadt bis zum unbefestigten Dorf und bis zu dem großen Stein[a], auf dem sie die Lade Yahwehs abstellten. Er liegt bis heute auf dem Feld Josuas aus Bet-Schemesch.
  rationale: Die Revision präzisiert die Zugehörigkeit der Städte zu den fünf philistäischen Fürsten, vereinheitlicht die Wiedergabe des Gottesnamens mit dem POB-Audit und formuliert die textkritische Alternative bei אָבֵל הַגְּדוֹלָה transparenter. Die kontextlich plausible Steinlesung bleibt im Haupttext, während die mögliche Ortsnamenlesung des masoretischen Textes ausdrücklich in der Fußnote erhalten bleibt.
