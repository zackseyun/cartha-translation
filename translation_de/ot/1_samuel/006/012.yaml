source:
  edition: WLC
  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: de
  text: Die Kühe gingen geradewegs den Weg nach Bet-Schemesch, auf einer einzigen Straße[a]. Sie gingen immer weiter und muhten dabei[b]; weder nach rechts noch nach links wichen sie ab. Die Fürsten[c] der Philister folgten ihnen bis an die Grenze von Bet-Schemesch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf einem einzigen Weg«. Das Hebräische betont, dass die Kühe auf einer festgelegten Route blieben.'
    reason: lexical_alternative
  - marker: b
    text: Das verwendete Wort bezeichnet den Laut von Rindern; die Formulierung beschreibt, dass die Kühe während des Weitergehens Laute von sich gaben.
    reason: cultural_note
  - marker: c
    text: 'Oder: »Herrscher«. Gemeint sind die anerkannten Herrscher der philistäischen Stadtstaaten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: gingen geradewegs
  rationale: Das Verb von ישר bezeichnet hier eine gerade, direkte Bewegung. »Geradewegs« gibt Richtung und Zielstrebigkeit natürlich wieder.
- source_word: הַפָּרוֹת
  choice: die Kühe
  rationale: Im Zusammenhang handelt es sich um säugende Kühe, die vor den Wagen gespannt wurden (Verse 7 und 10); »Kühe« ist daher genauer als »Färsen«.
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: auf der Straße nach Bet-Schemesch
  rationale: Die Wiederholung von דרך hebt den festgelegten Weg hervor. Die deutsche Formulierung gibt Ziel und Route idiomatisch wieder, ohne die hebräische Wiederholung unbeholfen nachzubilden.
- source_word: בִּמְסִלָּה אַחַת
  choice: auf einer einzigen Straße
  rationale: מְסִלָּה bezeichnet eine angelegte beziehungsweise erhöhte Straße; hier liegt der Nachdruck darauf, dass die Tiere auf genau einer Route blieben. »Straße« vermeidet die moderne Assoziation einer Schnellstraße.
- source_word: הָלְכוּ הָלוֹךְ
  choice: sie gingen immer weiter
  rationale: Die Verbindung aus finitem Verb und Infinitiv absolutus drückt fortgesetzte Bewegung aus. »Immer weiter« bewahrt diesen durativen Nachdruck.
- source_word: וְגָעוֹ
  choice: und brüllten dabei
  rationale: Das Verb bezeichnet den Laut von Rindern. »Brüllen« ist im heutigen Deutsch verständlich und würdig; »dabei« macht deutlich, dass die Kühe während des Gehens fortwährend Laute von sich gaben.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: weder nach rechts noch nach links wichen sie ab
  rationale: Die Formulierung bewahrt das hebräische Bild des Nichtabweichens von einer vorgegebenen Route.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: die Fürsten der Philister
  rationale: סְרָנִים ist der besondere Titel der anerkannten Herrscher der philistäischen Stadtstaaten. »Fürsten« ist eine natürliche, gehobene deutsche Wiedergabe.
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: folgten ihnen
  rationale: Das Partizip beschreibt die fortdauernde Begleitbewegung hinter den Kühen. Im Deutschen drückt »folgten ihnen« dies knapp und natürlich aus.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: bis an die Grenze von Bet-Schemesch
  rationale: גְּבוּל kann Grenze, Grenzgebiet oder Gebiet bedeuten; hier passt die räumliche Grenze des zu Bet-Schemesch gehörenden Bereichs.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Betonung der geradlinigen, ununterbrochenen Bewegung wird durch »geradewegs«, »einer einzigen Straße« und »immer weiter« bewahrt. Der Ortsname wird in der im Deutschen üblichen biblischen Form »Bet-Schemesch« wiedergegeben.
