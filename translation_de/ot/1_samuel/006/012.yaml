revisions:
- from: Die Kühe gingen geradewegs auf der Straße nach Bet-Schemesch und blieben auf einer einzigen Straße[a]. Sie gingen immer weiter und brüllten dabei[b]; weder nach rechts noch nach links wichen sie ab. Die Fürsten[c] der Philister folgten ihnen bis an die Grenze von Bet-Schemesch.
  to: Die Kühe gingen geradewegs den Weg nach Bet-Schemesch, auf einer einzigen Straße[a]. Sie gingen immer weiter und muhten dabei[b]; weder nach rechts noch nach links wichen sie ab. Die Fürsten[c] der Philister folgten ihnen bis an die Grenze von Bet-Schemesch.
  rationale: Die Revision gibt die zwei Wegbezeichnungen ohne die schwerfällige Wiederholung der Ausgangsfassung wieder und hält die Betonung eines einzigen, festgelegten Weges fest. »Muhten« ist eine natürliche, genaue Bezeichnung für den Laut von Kühen; die Fußnote wurde entsprechend vorsichtiger formuliert. Die Fußnotenanker stehen jeweils bei dem erläuterten Ausdruck.
