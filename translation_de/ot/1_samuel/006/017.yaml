  text: וְ/אֵ֨לֶּה֙ טְחֹרֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֨ר הֵשִׁ֧יבוּ פְלִשְׁתִּ֛ים אָשָׁ֖ם לַֽ/יהוָ֑ה לְ/אַשְׁדּ֨וֹד אֶחָ֜ד לְ/עַזָּ֤ה אֶחָד֙ לְ/אַשְׁקְל֣וֹן אֶחָ֔ד לְ/גַ֥ת אֶחָ֖ד לְ/עֶקְר֥וֹן אֶחָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: de
  text: 'Und das sind die goldenen Geschwülste, die die Philister Jahwe als Schuldopfer zurückgaben: eine für Aschdod[a], eine für Gaza, eine für Aschkelon, eine für Gat und eine für Ekron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „goldene Schwellungen“. Das hebräische Wort bezeichnet das körperliche Leiden, das diese Votivgaben darstellten; traditionell wird es genauer mit „Hämorrhoiden“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Das sind
  rationale: Die Wendung leitet die erläuternde Aufzählung ein; im Deutschen ist der unmittelbare Einstieg natürlich, während der Zusammenhang zum vorigen Vers erhalten bleibt.
- source_word: טְחֹרֵי הַזָּהָב
  choice: die goldenen Geschwülste
  rationale: טְחֹרִים bezeichnet hier das körperliche Leiden, das durch die Weihegaben nachgebildet wurde. „Geschwülste“ ist verständlich und legt sich weniger stark auf eine genaue medizinische Diagnose fest als „Hämorrhoiden“.
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: welche ... zurückgaben
  rationale: Der Hifil von שוב bezeichnet hier das Zurückgeben beziehungsweise Zurücksenden; „zurückgaben“ passt zur Wiedergutmachungsgabe.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Eingebürgerte deutsche Bezeichnung des Volkes.
- source_word: אָשָׁם
  choice: als Schuldopfer
  rationale: אָשָׁם bezeichnet ein Opfer, das Schuld und Wiedergutmachung betrifft; „Schuldopfer“ ist der etablierte und kontextgerechte deutsche Ausdruck.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: eine für Aschdod ... eine für Ekron
  rationale: Das wiederholte לְ mit אֶחָד ordnet jeder genannten Philisterstadt jeweils eine goldene Nachbildung zu; das feminine „eine“ bezieht sich im Deutschen auf „Geschwulst“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Eigennamen Gottes. „Jahwe“ bewahrt diesen Namen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von אָשָׁם
  choice: Schuldopfer
  alternative: Sühnegabe / Wiedergutmachungsgabe
  rationale: Der Begriff verbindet Schuld mit Wiedergutmachung. „Schuldopfer“ wahrt den Opfercharakter und ist im Deutschen als biblischer Fachausdruck verständlich, ohne die Funktion auf nur einen Aspekt zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geographischen Namen folgen den geläufigen deutschen Bibelformen. Die knappe, wiederholende Aufzählungsstruktur des Hebräischen bleibt erhalten.
