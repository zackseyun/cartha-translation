    issue: „Beulen“ für עפלים
    rationale: Die deutsche Bezeichnung ist relativ umgangssprachlich und semantisch breiter, oft auch für äußere Stoßverletzungen gebraucht. „Geschwülste“ bezeichnet krankhafte Schwellungen präziser und vermeidet zugleich die nicht gesicherte anatomische Festlegung auf Hämorrhoiden.
  - severity: low
    issue: Zusatz „dann“ und Formulierung „weniger schwer ... liegen“
    rationale: „Dann“ ist nicht eigens im Hebräischen ausgedrückt. Die idiomatischere Formulierung „seine Hand ... weniger schwer lasten lassen“ bewahrt die Metapher und die Bedeutung von יקל ohne diesen Zusatz.
