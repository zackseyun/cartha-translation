source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: de
  text: Fertigt also Abbilder eurer Geschwülste[a] und Abbilder eurer Mäuse an, die das Land verwüsten, und gebt dem Gott Israels die Ehre. Vielleicht lässt er seine Hand weniger schwer auf euch, euren Göttern und eurem Land lasten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eurer Hämorrhoiden“. Das hebräische Wort bezeichnet körperliche Schwellungen oder Geschwülste; die traditionelle genauere Wiedergabe ist möglich, aber nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Fertigt also … an
  rationale: Das Wayyiqtol führt die vorausgehende Anweisung folgernd fort und hat hier auffordernde Kraft. „Also“ gibt den Zusammenhang wieder; „anfertigen“ passt zu hergestellten Abbildern.
- source_word: צַלְמֵי
  choice: Abbilder von
  rationale: צֶלֶם bezeichnet eine bildliche Darstellung oder Nachbildung. „Abbilder“ macht deutlich, dass gegenständliche Nachbildungen der Plagen gemeint sind.
- source_word: עפלי־כם
  choice: euren Beulen
  rationale: Der Ausdruck bezeichnet krankhafte Schwellungen, ohne ihre genaue Art zweifelsfrei festzulegen. „Beulen“ bleibt anschaulich und weniger spezifisch als die traditionelle Deutung „Hämorrhoiden“.
- source_word: וְצַלְמֵי עַכְבְּרֵיכֶם
  choice: und Abbilder von euren Mäusen
  rationale: עַכְבָּר bezeichnet eine Maus beziehungsweise ein kleines Nagetier. „Mäuse“ entspricht der üblichen und kontextuell passenden Wiedergabe.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: die das Land verwüsten
  rationale: Das Partizip beschreibt fortdauernde zerstörerische Tätigkeit. Der maskuline Plural kann formal an mehrere vorausgehende Plurale anschließen; die unmittelbare Stellung legt den Bezug auf die Mäuse nahe, ohne zusätzliche Erklärung in den Text einzutragen.
- source_word: וּנְתַתֶּם לֵאלֹהֵי יִשְׂרָאֵל כָּבוֹד
  choice: und gebt dem Gott Israels die Ehre
  rationale: Die feste deutsche Wendung „jemandem die Ehre geben“ bewahrt den Sinn von כָּבוֹד als Anerkennung von Rang und Macht.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: אוּלַי drückt eine erhoffte, aber ungewisse Möglichkeit aus.
- source_word: יָקֵל אֶת יָדוֹ מֵעֲלֵיכֶם
  choice: lässt er seine Hand dann weniger schwer auf euch … liegen
  rationale: Die Formulierung gibt das Hiphil von קלל als Erleichterung wieder und bewahrt zugleich das hebräische Bild der belastend auf jemandem liegenden Hand.
- source_word: וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: euren Göttern und eurem Land
  rationale: Die Ergänzungen werden in die im Deutschen natürliche Reihung nach „auf“ einbezogen. Dabei bleibt erhalten, dass Gottes Hand nach Aussage der philistäischen Ratgeber auch auf ihren Göttern und ihrem Land lastet.
theological_decisions:
- issue: Genaue Art der mit עפלים bezeichneten Erkrankung
  choice: Beulen
  alternative: Hämorrhoiden; Geschwülste
  rationale: Der hebräische Ausdruck weist auf körperliche Schwellungen, legt aber deren genaue medizinische Art nicht sicher fest. Die Hauptübersetzung vermeidet daher eine unnötige anatomische Festlegung; die traditionelle Möglichkeit wird in der Fußnote bewahrt.
- issue: Bild von Gottes Hand
  choice: seine Hand … weniger schwer … liegen
  alternative: seine Macht abschwächen; seine Strafe von euch nehmen
  rationale: Die anthropomorphe Rede von Gottes Hand wird beibehalten, weil sie im Deutschen verständlich ist und die im Hebräischen ausgedrückte göttliche Wirksamkeit anschaulich wiedergibt. Zugleich wird יקל nicht als vollständiges Wegnehmen überinterpretiert.
- issue: Bezug des Partizips המשחיתים
  choice: Bezug auf die unmittelbar vorausgehenden Mäuse
  alternative: Bezug auf Beulen und Mäuse zusammen
  rationale: Genus und Numerus erlauben formal mehr als einen Bezug, doch Wortstellung und Sachzusammenhang legen die Mäuse als Verwüster des Landes nahe. Die Übersetzung folgt dieser wahrscheinlichsten syntaktischen Zuordnung, ohne die Aussage weiter auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich, bewahrt aber zentrale hebräische Bilder und vermeidet eine medizinische oder theologische Überpräzisierung.
