revisions:
- from: Fertigt also Abbilder von euren Beulen[a] und Abbilder von euren Mäusen an, die das Land verwüsten, und gebt dem Gott Israels die Ehre. Vielleicht lässt er seine Hand dann weniger schwer auf euch, euren Göttern und eurem Land liegen.
  to: Fertigt also Abbilder eurer Geschwülste[a] und Abbilder eurer Mäuse an, die das Land verwüsten, und gebt dem Gott Israels die Ehre. Vielleicht lässt er seine Hand weniger schwer auf euch, euren Göttern und eurem Land lasten.
  rationale: Die Revision ersetzt die umgangssprachlichere und weniger präzise Bezeichnung „Beulen“ durch „Geschwülste“, die die lexikalische Offenheit des Hebräischen besser abbildet. Außerdem wird die Aussage über die Hand Gottes geringfügig geglättet, ohne Bild, Modalität oder Umfang der hebräischen Aussage zu verändern.
