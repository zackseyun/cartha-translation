  text: וַ/יֹּאמְר֗וּ מָ֣ה הָ/אָשָׁם֮ אֲשֶׁ֣ר נָשִׁ֣יב ל/וֹ֒ וַ/יֹּאמְר֗וּ מִסְפַּר֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים חֲמִשָּׁה֙ עפלי זָהָ֔ב וַ/חֲמִשָּׁ֖ה עַכְבְּרֵ֣י זָהָ֑ב כִּֽי מַגֵּפָ֥ה אַחַ֛ת לְ/כֻלָּ֖/ם וּ/לְ/סַרְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: de
  text: 'Da fragten sie: „Was für ein Schuldopfer sollen wir ihm zurückgeben?“ Sie antworteten: „Entsprechend der Zahl der Herrscher der Philister: fünf goldene Geschwülste[a] und fünf goldene Mäuse. Denn eine Plage hat alle getroffen, auch eure Herrscher.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beulen“; möglicherweise sind genauer „Hämorrhoiden“ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: Schuldopfer
  rationale: Das kultische אָשָׁם bezeichnet hier eine Opfergabe, die Schuld sühnen beziehungsweise Wiedergutmachung leisten soll. „Schuldopfer“ ist im Deutschen verständlich und als biblischer Opferbegriff etabliert.
- source_word: נָשִׁיב לוֹ
  choice: sollen wir ihm zurückgeben
  rationale: Der Hifil von שוב bedeutet „zurückbringen/zurückgeben“. Das maskuline Singularpronomen wird personal mit „ihm“ wiedergegeben und bezieht sich im Kontext am ehesten auf den Gott Israels.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: entsprechend der Zahl der Herrscher der Philister
  rationale: Die knappe hebräische Fügung bezeichnet eine Entsprechung zwischen der Zahl der Gaben und der fünf philistäischen Herrscher. „Entsprechend der Zahl“ macht dies in natürlichem Deutsch deutlich.
- source_word: סַרְנֵי
  choice: Herrscher
  rationale: Der Ausdruck ist ein besonderer Titel für die führenden Machthaber der Philister. „Herrscher“ gibt ihre politische Autorität wieder, ohne feudale Vorstellungen von „Fürsten“ oder „Herren“ einzutragen.
- source_word: עפלי זָהָב
  choice: goldene Geschwülste
  rationale: Der Ausdruck bezeichnet krankhafte Schwellungen, ohne ihre genaue medizinische Art sicher festzulegen. „Geschwülste“ bewahrt diese Unbestimmtheit besser als die spezifischere Wiedergabe „Hämorrhoiden“.
- source_word: עַכְבְּרֵי זָהָב
  choice: goldene Mäuse
  rationale: עַכְבָּר bedeutet eindeutig „Maus“; die konkrete Bildsprache wird direkt bewahrt.
- source_word: מַגֵּפָה אַחַת
  choice: ein und dieselbe Plage
  rationale: Wörtlich steht „eine Plage“. Im Zusammenhang betont die Formulierung, dass alle gemeinsam von derselben Plage betroffen sind; die idiomatische deutsche Wendung gibt diesen Sinn klar wieder.
- source_word: לְכֻלָּם וּלְסַרְנֵיכֶם
  choice: hat sie alle und auch eure Herrscher getroffen
  rationale: Die Präposition לְ bezeichnet hier die Betroffenen der Plage. Die verbale Formulierung „hat … getroffen“ ist natürliches Deutsch und erhält die Einbeziehung sowohl der Allgemeinheit als auch ihrer Herrscher.
theological_decisions:
- issue: Bezug des Pronomens לוֹ
  choice: „ihm“, bezogen auf den Gott Israels
  alternative: „ihr“, bezogen auf die Bundeslade
  rationale: Das hebräische Pronomen ist maskulin singular, während „Lade“ im Hebräischen feminin ist. Zudem richtet sich das Wiedergutmachungsopfer theologisch an den Gott Israels; daher ist die personale Wiedergabe „ihm“ sowohl grammatisch als auch kontextuell vorzuziehen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede bleibt knapp und mündlich. „Schuldopfer“ bewahrt den kultischen Fachbegriff; „Geschwülste“ vermeidet eine medizinisch unsichere Präzisierung. Der Fußnotenmarker steht unmittelbar beim betreffenden Ausdruck.
