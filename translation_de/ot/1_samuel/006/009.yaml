source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: de
  text: 'Und gebt acht: Wenn es auf dem Weg zu seinem Gebiet hinauf nach Bet-Schemesch zieht, dann ist er es, der uns dieses große Unheil[a] zugefügt hat. Wenn aber nicht, werden wir wissen, dass nicht seine Hand uns getroffen hat; es ist uns durch Zufall[b] widerfahren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „dieses große Unglück“ oder „diese große Katastrophe“. Das hebräische Wort kann schweres Unheil oder eine Heimsuchung bezeichnen und meint nicht notwendig moralisches Böses.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „es war für uns ein Zufallsereignis“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Und gebt acht
  rationale: Der Imperativ Plural leitet die aufmerksame Beobachtung eines Prüfzeichens ein. „Gebt acht“ ist im Deutschen natürlicher als das wörtliche „seht“ und bewahrt den Aufforderungscharakter.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: auf dem Weg in sein Gebiet
  rationale: דֶּרֶךְ bezeichnet Weg oder Straße, גְּבוּל kann Grenze oder Gebiet bedeuten. Die Formulierung hält den Bezug des Suffixes bewusst offen und bezeichnet die Bewegung auf das zugehörige Gebiet zu.
- source_word: יַעֲלֶה
  choice: hinaufzieht
  rationale: עלה bedeutet „hinaufgehen/-ziehen“ und kann sowohl die geografische Aufwärtsbewegung als auch das Reisen zu einem Ziel ausdrücken.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Schemesch
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren, hebräisch orientierten Form wiedergegeben.
- source_word: הוּא עָשָׂה לָנוּ
  choice: dann ist er es, der uns … zugefügt hat
  rationale: Das selbstständige Pronomen הוּא ist betont. Die Spaltkonstruktion „ist er es, der“ bewahrt den Gegensatz zwischen seinem Handeln und einem Zufall.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: dieses große Unheil
  rationale: רָעָה kann hier schweres Übel, Schaden oder eine Katastrophe bezeichnen. „Unheil“ gibt die schwere Heimsuchung wieder, ohne den Ausdruck vorschnell als moralisches Böses zu verstehen.
- source_word: וְאִם לֹא
  choice: Wenn aber nicht
  rationale: Die Formulierung gibt den kontrastierenden zweiten Ausgang der Prüfung knapp und idiomatisch wieder.
- source_word: וְיָדַעְנוּ
  choice: werden wir wissen
  rationale: Die Verbfolge bezeichnet die Erkenntnis, die sich aus dem beobachteten Ergebnis ergeben wird.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: seine Hand uns getroffen hat
  rationale: Die Wendung von der „Hand“ bewahrt das Bild für wirksame Macht; „getroffen“ vermittelt in diesem Zusammenhang mehr als eine bloße Berührung, ohne das Bild durch „bestraft“ auszudeuten.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: es ist uns durch Zufall widerfahren
  rationale: מִקְרֶה bezeichnet ein zufälliges Ereignis. „Durch Zufall widerfahren“ ist würdig und bewahrt die Aussage der Sprecher, ohne sie als Erzählerurteil zu bestätigen.
theological_decisions:
- issue: Bedeutung von רָעָה bei zugeschriebenem göttlichem Handeln
  choice: dieses große Unheil
  alternative: dieses große Böse / dieses große Unglück / diese große Katastrophe
  rationale: Der Kontext spricht von einer schweren Heimsuchung. „Unheil“ wahrt deren Ernst, legt רָעָה aber nicht unnötig als moralisches Böses aus.
- issue: Göttliches Handeln oder Zufall
  choice: Die Alternative der Sprecher wird unverändert als Prüfannahme wiedergegeben.
  alternative: Den Zufall ausdrücklich verneinen oder als bloßen Schein kennzeichnen.
  rationale: Der Vers stellt die beiden Deutungsmöglichkeiten aus Sicht der Philister einander gegenüber. Die Übersetzung sollte diese erzählerische und theologische Spannung nicht vorzeitig auflösen.
- issue: Betonung des Handelnden in הוּא עָשָׂה
  choice: dann ist er es, der
  alternative: dann hat er
  rationale: Die betonte hebräische Pronomenform stellt den Handelnden ausdrücklich dem Zufall gegenüber; die deutsche Hervorhebung erhält diesen Kontrast.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebt acht“ spricht eine Mehrzahl an; „ist er es, der“ erhält die hebräische Hervorhebung. Das substantivisch neutrale „es“ vermeidet, den im Vers nicht ausdrücklich genannten Gegenstand grammatisch als Lade oder Wagen festzulegen. Die Fußnoten stehen jeweils unmittelbar bei der erläuterten Wendung.
