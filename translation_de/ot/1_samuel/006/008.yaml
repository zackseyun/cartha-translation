source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: de
  text: Nehmt dann die Lade Jahwes und stellt sie auf den Wagen. Legt die goldenen Gegenstände[a], die ihr ihm als Schuldopfer zurückgebt, in einen Kasten[b] neben die Lade. Dann schickt sie fort und lasst sie ziehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist weit gefasst und kann auch „goldene Geräte“, „goldene Stücke“ oder „goldene Gefäße“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in eine Truhe“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und sie wird gehen“. Im Zusammenhang bildet dies den letzten Schritt der Anweisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: אֲרוֹן bezeichnet hier die heilige Lade; die Verbindung mit dem Gottesnamen wird im Deutschen natürlich als „die Lade Jahwes“ wiedergegeben.
- source_word: הָעֲגָלָה
  choice: den Wagen
  rationale: עֲגָלָה bezeichnet einen Wagen oder Karren. „Wagen“ ist in diesem Zusammenhang klar, geläufig und würdig.
- source_word: כְּלֵי הַזָּהָב
  choice: die goldenen Gegenstände
  rationale: כְּלִי ist ein weiter Begriff für Gegenstand, Gerät oder Gefäß. „Gegenstände“ legt die konkrete Form der goldenen Stücke nicht unnötig fest.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: die ihr ihm … zurückgebt
  rationale: Der Hifil von שׁוב bedeutet hier „zurückbringen/zurückgeben“. Das Pronomen „ihm“ bezieht sich auf Jahwe.
- source_word: אָשָׁם
  choice: als Schuldopfer
  rationale: אָשָׁם ist ein kultischer Ausdruck für eine Gabe angesichts von Schuld; „Schuldopfer“ erhält diese Verbindung, auch im philistäischen Kontext.
- source_word: בָאַרְגַּז
  choice: in einen Kasten
  rationale: אַרְגָּז bezeichnet einen Kasten oder eine Truhe. „Kasten“ ist verständlich und vermeidet einen altertümlichen Klang.
- source_word: מִצִּדּוֹ
  choice: neben die Lade
  rationale: Die Form bedeutet wörtlich „an seiner Seite“. Die explizite Wiederaufnahme von „Lade“ verhindert im Deutschen ein unklares Pronomen.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: Dann schickt sie fort
  rationale: שׁלח bedeutet hier „fortschicken/ziehen lassen“. Das maskuline hebräische Pronomen nimmt am ehesten die Lade auf; im Deutschen ist sie grammatisch feminin.
- source_word: וְהָלָךְ
  choice: und lasst sie ziehen
  rationale: Formal heißt die Wendung „und sie wird gehen“. Im Ablauf der Anweisungen hat sie permissiv-resultativen Sinn; „lasst sie ziehen“ bewahrt diesen, ohne die Fortbewegung näher zu bestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration „Jahwe“ gibt den Eigennamen sichtbar wieder und vermeidet, ihn stillschweigend durch einen Titel zu ersetzen.
- issue: Kultischer Ausdruck אָשָׁם im philistäischen Zusammenhang
  choice: Schuldopfer
  alternative: Schuldgabe; Sühnegabe
  rationale: Der hebräische Erzähler verwendet einen kultisch geprägten Begriff. „Schuldopfer“ bewahrt diese theologische Verbindung, ohne die genaue Ritualform über den Text hinaus festzulegen.
- issue: Bezug des Pronomens in וְשִׁלַּחְתֶּם אֹתוֹ וְהָלָךְ
  choice: Bezug auf die Lade
  alternative: Bezug auf den Wagen beziehungsweise das gesamte Gespann
  rationale: Das maskuline Suffix und das maskuline Verb passen grammatisch zu אֲרוֹן „Lade“, während עֲגָלָה „Wagen/Karren“ im Hebräischen feminin ist. Sachlich bewegt sich die Lade natürlich auf dem Wagen; diese Spannung wird nicht durch eine zusätzliche Erklärung im Haupttext aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Imperative stehen entsprechend der hebräischen Pluralformen im Plural. Kurze Hauptsätze erhalten den anweisenden Ablauf des Originals; unnötig altertümliche Wörter wurden vermieden.
