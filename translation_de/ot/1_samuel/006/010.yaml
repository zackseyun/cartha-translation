  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֤וּ הָ/אֲנָשִׁים֙ כֵּ֔ן וַ/יִּקְח֗וּ שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת וַ/יַּאַסְר֖וּ/ם בָּ/עֲגָלָ֑ה וְ/אֶת בְּנֵי/הֶ֖ם כָּל֥וּ בַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: de
  text: 'Da machten es die Männer so: Sie nahmen zwei säugende Kühe[a], spannten sie vor den Wagen und sperrten ihre Kälber im Haus ein[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwei milchgebende Kühe“. Das Hebräische bezeichnet Kühe, die Milch gaben und Kälber hatten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hielten ihre Kälber im Haus zurück“. Wörtlich steht für „Kälber“: „ihre Söhne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: Da machten es die Männer so
  rationale: Die knappe hebräische Wendung besagt, dass die Männer die zuvor erteilte Anweisung ausführten. „Machten es … so“ ist im Deutschen natürlich und wahrt den erzählerischen Anschluss.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: אֲנָשִׁים bezeichnet hier die konkret handelnden Männer und wird daher nicht zu „Leute“ verallgemeinert.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: zwei säugende Kühe
  rationale: עָלוֹת bezeichnet hier Kühe, die Milch geben und Kälber säugen. „Säugende Kühe“ bringt die für das folgende Zeichen wichtige Bindung an ihre Kälber präzise zum Ausdruck.
- source_word: וַיַּאַסְרוּם בָּעֲגָלָה
  choice: spannten sie vor den Wagen
  rationale: אסר bedeutet grundsätzlich „binden“; bei Zugtieren und einem Wagen entspricht dem funktional und idiomatisch „vor den Wagen spannen“. עֲגָלָה wird als „Wagen“ wiedergegeben.
- source_word: וְאֶת בְּנֵיהֶם
  choice: ihre Kälber
  rationale: בָּנִים heißt wörtlich „Söhne“ beziehungsweise „Kinder“, bezeichnet mit Kühen als Bezug aber deren Nachwuchs, also Kälber.
- source_word: כָּלוּ בַבָּיִת
  choice: sperrten ... im Haus ein
  rationale: Das Verb bezeichnet hier das Zurückhalten oder Einschließen. „Im Haus“ bewahrt die konkrete Bezeichnung בַּבָּיִת, ohne sie interpretierend durch „Stall“ zu ersetzen.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die Satzfolge bleibt knapp und handlungsorientiert. „Haus“ wahrt die Ausdrucksweise des Hebräischen; „vor den Wagen spannen“ gibt die konkrete Handlung im heutigen Standarddeutsch idiomatisch wieder.
