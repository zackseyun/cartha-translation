  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: de
  text: Und die Leviten nahmen die Lade Jahwes[a] und den Kasten, der bei ihr war und in dem sich die Gegenstände aus Gold[b] befanden, herab und stellten sie auf den großen Stein[c]. Die Männer von Bet-Schemesch brachten an jenem Tag Jahwe Brandopfer dar und schlachteten Schlachtopfer[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell „der HERR“.
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann allgemein Geräte, Gefäße, Gegenstände oder andere Dinge aus Gold bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „an den großen Stein“. Die hebräische Präposition kann hier das Platzieren auf oder an dem Stein ausdrücken.'
    reason: source_ambiguity
  - marker: d
    text: 'Wörtlich mit verwandtem Verb und Substantiv: „sie schlachteten Schlachtopfer“; sinngemäß auch: „sie brachten Opfer dar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם הוֹרִידוּ
  choice: Und die Leviten nahmen … vom Wagen herab
  rationale: Der Hifil von ירד bezeichnet hier das Herunternehmen der Lade und des Kastens. „Vom Wagen“ ist aus dem unmittelbaren Erzählzusammenhang erschlossen und macht den deutschen Satz natürlich verständlich.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: אֲרוֹן bezeichnet hier die bekannte Bundeslade; der Eigenname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: הָאַרְגַּז
  choice: den Kasten
  rationale: Das Wort bezeichnet den separaten Behälter, der die Lade begleitete. „Kasten“ ist modern und unterscheidet ihn klar von der Lade.
- source_word: אֲשֶׁר אִתּוֹ
  choice: der bei ihr war
  rationale: Die schlichte räumliche beziehungsweise begleitende Beziehung des Hebräischen bleibt erhalten; das feminine Pronomen bezieht sich im Deutschen auf „Lade“.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: in dem sich die goldenen Gegenstände befanden
  rationale: כְּלִי ist ein weiter Begriff für Gerät, Gegenstand oder Gefäß. „Gegenstände“ vermeidet eine unbelegte nähere Bestimmung.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: und stellten sie auf den großen Stein
  rationale: Bei שׂים kann אֶל in diesem Zusammenhang das Platzieren auf beziehungsweise an dem Stein ausdrücken. Der Kontext stützt „auf“, doch die Präposition bleibt grundsätzlich mehrdeutig.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: Die Männer von Bet-Schemesch
  rationale: אַנְשֵׁי ist die maskuline Pluralverbindung von אִישׁ. „Männer“ bewahrt die konkrete Form, ohne sie zu verallgemeinern.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: brachten … Brandopfer dar
  rationale: Dies ist die geläufige deutsche Wiedergabe der kultischen Wendung für das Darbringen vollständig verbrannter Opfer.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: und schlachteten Schlachtopfer
  rationale: Die Wiedergabe erhält die figura etymologica des hebräischen Verbs und Objekts, bleibt aber im Deutschen verständlich.
- source_word: בַּיּוֹם הַהוּא לַיהוָה
  choice: an jenem Tag Jahwe
  rationale: Die Zeitangabe wird unmittelbar wiedergegeben; לְ kennzeichnet Jahwe als Empfänger der Opferhandlungen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Gottesnamen im deutschen Haupttext wieder; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Geschlechtsbezogene Wiedergabe von אַנְשֵׁי
  choice: Männer von Bet-Schemesch
  alternative: Bewohner von Bet-Schemesch
  rationale: Die grammatisch und lexikalisch maskuline Bezeichnung wird bewahrt. Der Text selbst zwingt nicht zu einer geschlechtsneutralen Ausweitung.
- issue: Art der zweiten Opfer
  choice: Schlachtopfer
  alternative: Opfer
  rationale: זְבָחִים bezeichnet geschlachtete Opfer und steht neben den Brandopfern. „Schlachtopfer“ bewahrt diese Unterscheidung und die Wortwiederholung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die kultischen Begriffe „Lade“, „Brandopfer“ und „Schlachtopfer“ sind traditionsnah, aber allgemein verständlich. Die hebräische Wiederholung bei זבח bleibt bewusst erhalten; echte lexikalische und präpositionale Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
