  text: וַ/יָּשִׂ֛מוּ אֶת אֲר֥וֹן יְהוָ֖ה אֶל הָ/עֲגָלָ֑ה וְ/אֵ֣ת הָ/אַרְגַּ֗ז וְ/אֵת֙ עַכְבְּרֵ֣י הַ/זָּהָ֔ב וְ/אֵ֖ת צַלְמֵ֥י טְחֹרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: de
  text: Dann stellten sie die Lade Jahwes auf den Wagen, dazu den Kasten, die goldenen Mäuse und die Abbilder ihrer Geschwülste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schwellungen“; möglicherweise „Hämorrhoiden“.'
    reason: lexikalische Alternative; die genaue medizinische Bedeutung von טְחֹרִים ist unsicher
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Dann stellten sie
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Dann“ gibt die zeitliche Abfolge wieder; „stellten“ passt natürlich zur Platzierung der Lade auf dem Wagen.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: אֲרוֹן bezeichnet hier den bekannten kultischen Gegenstand und wird angemessen mit „Lade“ wiedergegeben. Der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: אֶל הָעֲגָלָה
  choice: auf den Wagen
  rationale: Bei einem Wagen bezeichnet die Präposition hier die Platzierung auf seiner Ladefläche; „auf den Wagen“ ist im Deutschen idiomatisch.
- source_word: הָאַרְגַּז
  choice: den Kasten
  rationale: Das Wort bezeichnet den Behälter für die beigegebenen Opfergaben. „Kasten“ ist verständlich und unterscheidet ihn sprachlich von der Lade.
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: die goldenen Mäuse
  rationale: Die Konstruktverbindung bedeutet wörtlich „Mäuse aus Gold“. „Goldene Mäuse“ ist eine natürliche deutsche Wiedergabe.
- source_word: צַלְמֵי
  choice: die Abbilder
  rationale: צֶלֶם bezeichnet ein Bild oder eine gegenständliche Nachbildung. „Abbilder“ macht deutlich, dass es sich um angefertigte Darstellungen handelt.
- source_word: טְחֹרֵיהֶם
  choice: ihrer Geschwüre
  rationale: Der Ausdruck bezeichnet die körperliche Plage, ohne deren genaue medizinische Art zweifelsfrei festzulegen. „Geschwüre“ wahrt diese Offenheit besser als die engere Deutung „Hämorrhoiden“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Medizinische Bestimmung von טְחֹרֵיהֶם
  choice: Geschwüre
  alternative: Hämorrhoiden
  rationale: Die genaue Art der Erkrankung ist umstritten. Der Haupttext vermeidet deshalb eine medizinisch zu enge Festlegung; die mögliche engere Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die Aufzählung bleibt knapp und entspricht der hebräischen Struktur. Der Fußnotenmarker steht bei „Geschwüre“, da sich die lexikalische Anmerkung auf dieses Wort bezieht.
