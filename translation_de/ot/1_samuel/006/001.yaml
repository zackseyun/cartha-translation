  yaml_path: translation/ot/1_samuel/006/001.yaml
  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: de
  text: Die Lade Jahwes war sieben Monate lang im Gebiet der Philister.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Feld der Philister“; das hebräische Wort kann hier auch ihr Land oder Gebiet bezeichnen.'
