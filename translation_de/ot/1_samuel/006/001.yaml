lexical_decisions:
- source_word: וַיְהִי
  choice: war
  rationale: Die narrative Form von היה führt die Erzählung fort. Im Deutschen gibt die einfache Verbform den Zusammenhang natürlich wieder; ein zusätzliches „Und es geschah“ wäre hier unnötig schwerfällig.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die Constructusverbindung wird als Genitivverbindung wiedergegeben. „Lade“ ist im biblisch-kultischen Zusammenhang die etablierte deutsche Bezeichnung für אֲרוֹן.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: im Gebiet der Philister
  rationale: שָׂדֶה bedeutet wörtlich „Feld“, kann aber auch Land oder Gebiet bezeichnen. Hier ist die geografische Bedeutung im Deutschen am natürlichsten.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: sieben Monate lang
  rationale: Die Zeitangabe wird direkt wiedergegeben; „lang“ verdeutlicht idiomatisch die Dauer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen, ohne ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die geografische Bedeutung wird im Haupttext natürlich ausgedrückt; die wörtliche Form bleibt in der Fußnote sichtbar.
