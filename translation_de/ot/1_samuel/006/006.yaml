base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: de
  text: Warum verhärtet ihr euer Herz[a], wie Ägypten und der Pharao ihr Herz verhärteten? War es nicht so, dass sie sie ziehen ließen und diese fortgingen, als er hart mit ihnen verfuhr?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »macht ihr euer Herz schwer«, ebenso anschließend »Ägypten und der Pharao ihr Herz schwer machten«. »Das Herz schwer machen« bedeutet hier, es zu verhärten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: verhärtet / verhärteten
  rationale: Das Piel von כבד mit »Herz« bezeichnet idiomatisch das Verhärten beziehungsweise Unnachgiebigmachen des Herzens. »Verhärten« gibt den Sinn im Deutschen natürlich wieder; die wörtliche Bildsprache »schwer machen« wird in der Fußnote bewahrt.
- source_word: לְבַבְכֶם / לִבָּם
  choice: euer Herz / ihr Herz
  rationale: Der hebräische Singular bezeichnet jeweils das gemeinsame innere Wollen der angesprochenen Gruppe beziehungsweise Ägyptens und des Pharaos. Der Singular ist auch im Deutschen idiomatisch und bewahrt die Form des Ausgangstextes.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: Ägypten und der Pharao
  rationale: Der Ortsname »Ägypten« steht kollektiv für das Land beziehungsweise seine Menschen und wird entsprechend der hebräischen Ausdrucksweise beibehalten.
- source_word: הִתְעַלֵּל בָּהֶם
  choice: er hart mit ihnen verfuhr
  rationale: Das Hitpael von עלל bezeichnet hier ein hartes, strafendes Vorgehen. Die Formulierung bleibt natürlich, ohne die konkrete Art des Vorgehens über den Text hinaus festzulegen.
- source_word: וַיְשַׁלְּחוּם
  choice: ließen sie sie ziehen
  rationale: שלח kann »fortschicken« oder »freilassen« bedeuten. Im Exodusbezug bezeichnet es, dass Ägypten und der Pharao Israel ziehen ließen. Die beiden gleichlautenden Pronomen bewahren die Referenzspannung; eine Fußnote klärt sie.
- source_word: וַיֵּלֵכוּ
  choice: sie gingen fort
  rationale: Die schlichte Bewegungsangabe הלך wird knapp wiedergegeben. »Gingen fort« klingt im modernen Deutschen natürlicher als das isolierte »gingen«, ohne ein stärkeres Verb wie »zogen aus« einzutragen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von הִתְעַלֵּל
  choice: Das Subjekt bleibt als »er« unausgesprochen identifiziert.
  alternative: Ausdrücklich »Gott« oder unpersönlich »als es ihnen schlecht erging«.
  rationale: Der Exoduszusammenhang legt Gott als Handelnden nahe, doch der hebräische Satz nennt ihn nicht ausdrücklich. Das Pronomen »er« bewahrt diese formale Zurückhaltung und lässt den Bezug aus dem Kontext hervorgehen.
- issue: Referenten der Pronomen in der Schlussklausel
  choice: Die wechselnden Referenten werden im Haupttext nicht durch Substantive ersetzt, sondern in einer Fußnote erläutert.
  alternative: »Da ließen die Ägypter Israel ziehen, und die Israeliten gingen fort.«
  rationale: Die explizite Fassung wäre klarer, würde aber mehrere im Hebräischen nur pronominal bezeichnete Größen in den Haupttext eintragen. Die Fußnote ermöglicht Klarheit bei größerer Formtreue.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der rhetorische Nachdruck und die knappe Abfolge des Hebräischen bleiben erhalten. Die ungewöhnliche Pronomenfolge wird wegen ihrer Quellennähe beibehalten und durch eine Fußnote geklärt.
