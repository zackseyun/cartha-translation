  verdict: revise
  source_fidelity: 'Die Kernentsprechungen sind zutreffend: כבד mit »Herz« wird sinnvoll mit »verhärten« wiedergegeben; »Ägypten und der Pharao« bewahrt die kollektive Nennung; und »hart mit ihnen verfuhr« gibt הִתְעַלֵּל בָּהֶם zurückhaltend wieder, ohne das ungenannte Subjekt als Gott auszuschreiben. Die Schlussreferenz ist jedoch im deutschen Haupttext nicht hinreichend erkennbar: Nach »ließen sie sie ziehen« kann »sie gingen fort« syntaktisch weiterhin auf Ägypten und den Pharao bezogen werden, während וַיֵּלֵכוּ sich auf die Fortgeschickten, Israel, bezieht.'
  naturalness: 'Der erste Fragesatz ist natürlich. Die Konstruktion »War es nicht so: Als …« wirkt im modernen Standarddeutsch hingegen unnötig abgehackt und schwerfällig. Eine integrierte rhetorische Frage ist idiomatischer und lässt zugleich die zeitliche Nuance von כַּאֲשֶׁר als »als« stehen.'
  terminology: Die gewählten Schlüsselbegriffe sind angemessen und registergerecht. »Verhärten« ist für die hebräische Herz-Metaphorik etabliert; die Fußnote bewahrt die wörtliche Bildsprache. »Hart mit ihnen verfuhr« ist gegenüber einer expliziten Benennung Gottes oder einer detaillierteren Strafbeschreibung angemessen zurückhaltend.
  issues:
