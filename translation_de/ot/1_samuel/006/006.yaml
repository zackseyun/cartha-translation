    issue: Die letzte Pronominalreferenz bleibt im deutschen Text missverständlich.
    rationale: Das zweite »sie« in »ließen sie sie ziehen« bezeichnet Israel, und auch וַיֵּלֵכוּ hat Israel als Subjekt. Der anschließende deutsche Satz »sie gingen fort« kann jedoch ohne Weiteres Ägypten und den Pharao als Subjekt fortführen. »diese« stellt den beabsichtigten Bezug her, ohne Israel namentlich in den Haupttext einzutragen.
