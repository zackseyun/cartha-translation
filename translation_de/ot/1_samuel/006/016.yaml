  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: de
  text: Als die fünf Herrscher der Philister das gesehen hatten, kehrten sie noch am selben Tag nach Ekron zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
