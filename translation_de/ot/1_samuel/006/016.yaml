lexical_decisions:
- source_word: וַ/חֲמִשָּׁה סַרְנֵי פְלִשְׁתִּים
  choice: die fünf Herrscher der Philister
  rationale: סֶרֶן bezeichnet den Amtstitel der philistäischen Stadtherrscher. „Herrscher“ gibt ihre politische Autorität in modernem Deutsch klar wieder; „die fünf“ verweist passend auf die bereits bekannten Amtsträger.
- source_word: רָאוּ
  choice: das gesehen hatten
  rationale: Im Hebräischen steht „sahen“ ohne ausdrückliches Objekt. Das deutsche „das“ nimmt das unmittelbar zuvor geschilderte Geschehen auf. Das Plusquamperfekt fügt sich natürlich in den mit „als“ gebildeten Temporalsatz ein.
- source_word: וַ/יָּשֻׁבוּ
  choice: kehrten sie … zurück
  rationale: שוב bezeichnet hier in der fortlaufenden Erzählung die Rückkehr der Herrscher.
- source_word: עֶקְרוֹן
  choice: nach Ekron
  rationale: Bei einem Bewegungsverb wird das im Hebräischen ohne Präposition stehende Ziel im Deutschen idiomatisch mit „nach“ ausgedrückt.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: noch am selben Tag
  rationale: Wörtlich „an jenem Tag“. „Noch am selben Tag“ vermittelt im deutschen Erzählzusammenhang natürlich die zeitliche Unmittelbarkeit.
