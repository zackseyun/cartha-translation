source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: de
  text: 'Und der Mann sagte zu ihm: »Sie sollen doch heute zuerst das Fett in Rauch aufgehen lassen[a]; danach nimm dir, wonach deine Seele verlangt.« Doch er sagte zu ihm: »Nein, du musst es jetzt hergeben! Sonst nehme ich es mit Gewalt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie sollen das Fett heute gewiss in Rauch aufgehen lassen.“ Das Hebräische verwendet eine nachdrückliche Verbform; „zuerst“ ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der bestimmte maskuline Singular bezeichnet hier den Opfernden; „der Mann“ bewahrt Form und Erzählbezug.
- source_word: קַטֵּר יַקְטִירוּן
  choice: sie sollen doch … in Rauch aufgehen lassen
  rationale: Infinitivus absolutus mit Imperfekt verstärkt die Aussage. „doch“ gibt den nachdrücklichen Einspruch wieder; „in Rauch aufgehen lassen“ bezeichnet im Opferkontext präziser als das allgemeine „verbrennen“ das Verbrennen auf dem Altar.
- source_word: כַּיּוֹם
  choice: heute zuerst
  rationale: „Heute“ bildet den temporalen Ausdruck ab; „zuerst“ macht die im Zusammenhang geforderte Reihenfolge deutlich, bevor Fleisch genommen wird.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: Gemeint sind die Fettstücke des Opfers, die auf dem Altar verbrannt werden sollten.
- source_word: וְקַח לְךָ
  choice: danach nimm dir
  rationale: Der Imperativ gestattet die Entnahme erst nach dem Verbrennen des Fetts; „danach“ verdeutlicht diese kontextuell erkennbare Abfolge.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: wonach deine Seele verlangt
  rationale: Die hebräische Wendung wird anschaulich und verständlich bewahrt, ohne „Seele“ zu einer bloßen Appetitangabe zu verengen.
- source_word: וְאָמַר לוֹ
  choice: Doch er sagte zu ihm
  rationale: Die adversative Konjunktion macht den Widerspruch im Wortwechsel deutlich; die wiederholte Handlung ergibt sich aus dem Erzählzusammenhang.
- source_word: כִּי עַתָּה תִתֵּן
  choice: Nein, du musst es jetzt hergeben!
  rationale: „Nein“ ist im Hebräischen nicht ausdrücklich vorhanden, gibt aber die schroffe Zurückweisung idiomatisch wieder. „musst … hergeben“ bewahrt den fordernden Ton.
- source_word: וְאִם לֹא
  choice: Sonst
  rationale: Die knappe deutsche Bedingungsform gibt die drohende Alternative natürlich wieder.
- source_word: לָקַחְתִּי בְחָזְקָה
  choice: nehme ich es mit Gewalt
  rationale: Das Perfekt hat in der Drohung futurisch-entschlossene Kraft; „mit Gewalt“ gibt die erzwungene Wegnahme prägnant wieder.
theological_decisions:
- issue: Vom Einspruch vorausgesetzte Reihenfolge des Opferrituals
  choice: Das Fett wird zuerst auf dem Altar verbrannt; erst danach darf Fleisch genommen werden.
  alternative: Die hebräische Wortfolge ohne verdeutlichendes „zuerst/danach“ möglichst wörtlich wiedergeben.
  rationale: Der Gegensatz zwischen der ordnungsgemäßen Opferhandlung und dem gewaltsamen Anspruch des Dieners ist für den Vers entscheidend. Die Reihenfolge wird verständlich gemacht, ohne zusätzliche kultische Erläuterungen in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und konfrontativ. „Seele“ bewahrt die hebräische Bildsprache; „in Rauch aufgehen lassen“ hält den kultischen Bezug fest.
