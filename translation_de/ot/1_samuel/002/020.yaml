  text: וּ/בֵרַ֨ךְ עֵלִ֜י אֶת אֶלְקָנָ֣ה וְ/אֶת אִשְׁתּ֗/וֹ וְ/אָמַר֙ יָשֵׂם֩ יְהוָ֨ה לְ/ךָ֥ זֶ֨רַע֙ מִן הָ/אִשָּׁ֣ה הַ/זֹּ֔את תַּ֚חַת הַ/שְּׁאֵלָ֔ה אֲשֶׁ֥ר שָׁאַ֖ל לַֽ/יהוָ֑ה וְ/הָלְכ֖וּ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: de
  text: 'Und Eli segnete Elkana und seine Frau immer wieder und sagte: »Jahwe gebe dir Nachkommen von dieser Frau anstelle des Erbetenen, das er für Jahwe erbat[a].« Dann kehrten sie an seinen Ort zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise anders möglich: »anstelle der Bitte/Leihgabe, die er für Jahwe erbat«. Das Verb »erbat« steht im Hebräischen in der männlichen Einzahl; nach dem Erzählzusammenhang ist jedoch Hanna als diejenige gemeint, die das Kind von Jahwe erbat (1 Sam 1,20.27–28). Die mehrfach verwendete Wortwurzel »bitten/erbitten« spielt zugleich darauf an, dass Samuel erbeten und Jahwe überlassen wurde.'
    reason: Die hebräische Formulierung verbindet eine auffällige maskuline Verbform mit einem mehrdeutigen Wortspiel um Bitte, Leihgabe und das erbetene Kind.
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: segnete … immer wieder
  rationale: Das Perfekt steht im Zusammenhang der jährlich wiederkehrenden Besuche und bezeichnet hier am besten eine wiederholte Handlung.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: Elkana und seine Frau
  rationale: Der hebräische Text nennt ausdrücklich »seine Frau« und nicht ihren Namen.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: Jahwe gebe dir
  rationale: שׂים bedeutet grundsätzlich »setzen, bestimmen«, hat in diesem Segenswunsch mit זֶרַע aber den idiomatischen Sinn »geben, gewähren«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: זֶרַע
  choice: Nachkommen
  rationale: Das Wort ist ein kollektiver Singular und bezeichnet hier Kinder beziehungsweise Nachwuchs.
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: von dieser Frau
  rationale: Die Formulierung bleibt nah an der Herkunftsangabe des Hebräischen und ist im Deutschen verständlich.
- source_word: תַּחַת הַשְּׁאֵלָה
  choice: anstelle des Erbetenen
  rationale: תַּחַת bezeichnet Ersatz; הַשְּׁאֵלָה gehört zum wiederkehrenden Wortfeld »bitten/erbitten« und kann zugleich auf das erbetene und Jahwe überlassene Kind anspielen.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: das er für Jahwe erbat
  rationale: Die Verbform ist maskulin Singular und wird daher im Haupttext formal als »er« wiedergegeben. לַיהוָה kann im Kontext der Übergabe Samuels sinnvoll mit »für Jahwe« verstanden werden; die syntaktische und referenzielle Spannung wird in der Fußnote offengelegt.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: Dann gingen sie wieder an seinen Ort
  rationale: Das Verb ist pluralisch und bezieht sich auf das Paar; das Suffix an »Ort« ist singularisch. »Wieder« macht den wiederkehrenden Ablauf deutlich, ohne »Ort« vorschnell als »Zuhause« auszulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname entspricht dem hebräischen Text und vermeidet die Ersetzung durch einen Titel.
- issue: Subjekt und Sinn von אֲשֶׁר שָׁאַל לַיהוָה
  choice: »das er für Jahwe erbat« im Haupttext, mit offengelegter Mehrdeutigkeit
  alternative: »das sie von Jahwe erbeten hatte«
  rationale: Die überlieferte Verbform ist maskulin Singular, während der weitere Erzählzusammenhang Hanna als die Bittende nahelegt. Zudem kann לַיהוָה die Bestimmung für Jahwe ausdrücken. Die Übersetzung bewahrt deshalb die grammatische Spannung und dokumentiert die kontextuelle Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der iterative Charakter wird natürlich durch »immer wieder« und »wieder« ausgedrückt. Die ungewöhnliche Formulierung »an seinen Ort« bleibt bewusst quellentreu; die zentrale grammatische und lexikalische Mehrdeutigkeit wird nicht stillschweigend geglättet.
