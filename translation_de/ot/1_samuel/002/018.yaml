  text: וּ/שְׁמוּאֵ֕ל מְשָׁרֵ֖ת אֶת פְּנֵ֣י יְהוָ֑ה נַ֕עַר חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: de
  text: Samuel aber diente vor Jahwe[a]; er war ein Junge und trug ein leinenes Efod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dem Angesicht Jahwes“, das heißt in seiner Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: Samuel aber
  rationale: Das ו verbindet den Vers mit dem vorausgehenden Gegensatz zu Elis Söhnen. „Aber“ gibt diesen im Kontext erkennbaren Kontrast im Deutschen natürlich wieder, ohne ein zeitliches „nun“ einzuführen.
- source_word: מְשָׁרֵת
  choice: diente
  rationale: Das Partizip bezeichnet Samuels fortdauernden Dienst; das deutsche Präteritum ist im Erzählzusammenhang natürlich, während „diente“ den kultischen Bezug offenhält.
- source_word: אֶת פְּנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bedeutet wörtlich „vor dem Angesicht Jahwes“ und bezeichnet hier den Dienst in seiner Gegenwart. „Vor Jahwe“ bewahrt die hebräische Ausdrucksweise knapp und verständlich.
- source_word: נַעַר
  choice: noch ein Junge
  rationale: נַעַר kennzeichnet Samuel als Jungen beziehungsweise jungen Menschen. „Noch ein Junge“ bringt den prädikativen Begleitumstand im natürlichen Deutschen zum Ausdruck, ohne ein genaueres Alter festzulegen.
- source_word: חָגוּר
  choice: trug
  rationale: Das passive Partizip bedeutet wörtlich „gegürtet“. Bei einem Kleidungsstück gibt „trug“ die sichtbare Bekleidung idiomatisch wieder, ohne eine unklare deutsche Konstruktion zu erzeugen.
- source_word: אֵפוֹד
  choice: Efod
  rationale: Das Efod ist ein besonderes israelitisches Kultgewand ohne genaue deutsche Entsprechung; die eingebürgerte Transliteration vermeidet eine zu enge Deutung als Schurz oder Weste.
- source_word: בָּד
  choice: leinenes
  rationale: בָּד bezeichnet hier das Material Leinen. „Leinenes Efod“ gibt die Materialangabe direkt wieder; „feines Leinen“ wäre eine nicht ausdrücklich vorhandene Präzisierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, während „der HERR“ die traditionelle Lesersubstitution darstellt.
- issue: Bedeutung von Samuels Dienst vor Jahwe
  choice: diente vor Jahwe
  alternative: versah Priesterdienst vor Jahwe
  rationale: Der Text beschreibt einen kultischen Dienst, nennt Samuel hier aber nicht ausdrücklich Priester. Die allgemeinere Formulierung wahrt diese Spannung und vermeidet eine theologische Überbestimmung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei kurze Sätze vermeiden eine schwerfällige Apposition und bewahren zugleich Samuels Jugend als Begleitumstand. „Efod“ bleibt als kultischer Fachbegriff erhalten.
