  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: de
  text: 'Die Gewohnheit der Priester gegenüber dem Volk war folgende: Sooft jemand ein Schlachtopfer darbrachte, kam der Diener des Priesters, während das Fleisch gekocht wurde, mit einer dreizinkigen Gabel[a] in der Hand.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fleischhaken«; das hebräische Wort bezeichnet ein gabelähnliches Gerät, mit dem Fleisch aus dem Kochgefäß genommen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: Die Gewohnheit … war folgende
  rationale: מִשְׁפָּט kann Recht, Vorschrift, Anspruch oder übliche Praxis bezeichnen. Hier führt das Wort eine wiederkehrende Praxis der Priester ein; »Gewohnheit« gibt diesen erzählerischen Sinn natürlich wieder. Das vorangestellte וּ wird im Deutschen nicht eigens mit einem zeitlichen »nun« wiedergegeben.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: der Priester gegenüber dem Volk
  rationale: Die Wendung beschreibt, wie die Priester im Verhältnis zum Volk handelten. »Gegenüber dem Volk« bewahrt diesen relationalen Sinn, ohne eine feindselige Bedeutung in אֶת hineinzulesen.
- source_word: כָּל־אִישׁ זֹבֵחַ זֶבַח
  choice: Sooft jemand ein Schlachtopfer darbrachte
  rationale: Die Konstruktion beschreibt eine regelmäßig wiederkehrende Situation. »Sooft« bringt den distributiv-habituellen Sinn zur Geltung; »Schlachtopfer darbringen« ist im Deutschen eine natürliche und sachlich genaue Wiedergabe der figura etymologica זֹבֵחַ זֶבַח.
- source_word: נַעַר הַכֹּהֵן
  choice: der Diener des Priesters
  rationale: נַעַר kann einen jungen Mann, Diener oder Gehilfen bezeichnen. In diesem Zusammenhang steht seine Dienstfunktion für den Priester im Vordergrund.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: während das Fleisch gekocht wurde
  rationale: כְּ mit dem Infinitiv bezeichnet hier Gleichzeitigkeit. Die passive deutsche Form lässt wie der Kontext offen, wer das Fleisch kochte.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: eine dreizinkige Gabel
  rationale: Wörtlich ist von einem Gerät mit »drei Zähnen« die Rede. »Dreizinkige Gabel« bezeichnet das Gerät im heutigen Deutsch klar und anschaulich.
- source_word: בְּיָדוֹ
  choice: in der Hand
  rationale: Das Suffix bezieht sich auf den Diener des Priesters. Im Deutschen ist beim bereits genannten Handelnden »in der Hand« eindeutig und idiomatisch.
theological_decisions: []
