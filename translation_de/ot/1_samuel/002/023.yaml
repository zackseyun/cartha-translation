  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Warum tut ihr so etwas? Denn ich höre von all diesen Leuten Berichte über eure bösen Taten.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ich höre eure bösen Dinge/Angelegenheiten von all diesen Leuten.“ Gemeint sind im Zusammenhang Berichte über das böse Verhalten von Elis Söhnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Und er sagte zu ihnen
  rationale: Der Wayyiqtol führt die Erzählung weiter; die Wiedergabe bleibt nah am hebräischen Erzählfluss und bezieht sich im Kontext auf Elis Söhne.
- source_word: לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה
  choice: Warum tut ihr so etwas?
  rationale: Der Imperfekt bezeichnet hier das fortdauernde Verhalten, das Eli tadelt. „So etwas“ gibt die Wendung mit דְּבָרִים natürlich wieder, ohne sie unnötig zu verengen.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: Denn ich höre
  rationale: Die Partizipialkonstruktion bezeichnet das gegenwärtige beziehungsweise wiederholte Hören; „denn“ macht die begründende Funktion des Anschlusses im Deutschen deutlich.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: von euren bösen Taten
  rationale: דְּבָרִים kann „Worte“, „Angelegenheiten“ oder „Dinge“ bedeuten. Im Kontext sind Berichte über das böse Verhalten der Söhne gemeint; „Taten“ gibt diesen Sinn verständlich wieder.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: von diesem ganzen Volk
  rationale: מֵאֵת bezeichnet die Quelle des Gehörten. Der kollektive Singular הָעָם mit dem Demonstrativ אֵלֶּה wird im Deutschen idiomatisch als „diesem ganzen Volk“ wiedergegeben.
