  source_fidelity: Der Entwurf gibt den Tadel, das fortdauernde Hören und die im Kontext auf Fehlverhalten bezogenen „bösen“ dĕvarim sachgerecht wieder. „Dieses ganze Volk“ ist jedoch für כָּל־הָעָם אֵלֶּה weniger präzise und im Deutschen weniger idiomatisch als die pluralisch-demonstrative Wiedergabe „all diese Leute“.
  naturalness: „Warum tut ihr so etwas?“ ist natürliches modernes Standarddeutsch. Die Verbindung „ich höre von diesem ganzen Volk von ...“ ist wegen der doppelten Präposition und des kollektiven Singulars schwerfällig. „Ich höre von all diesen Leuten Berichte über ...“ ist klar und bewahrt sowohl die Quelle als auch den Inhalt des Gehörten.
  terminology: „Böse Taten“ ist kontextgemäß und nicht übermäßig interpretierend; die Fußnote wahrt die lexikalische Spannweite von דְּבָרִים. Keine theologisch oder namensbezogen problematische Terminologie liegt vor.
