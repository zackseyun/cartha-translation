base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: de
  text: 'Darum spricht Jahwe, der Gott Israels: »Ich habe ausdrücklich gesagt, dass dein Haus und das Haus deines Vaters für immer vor mir wandeln sollen. Doch nun spricht Jahwe: Das sei fern von mir! Denn die mich ehren, werde ich ehren; die mich aber verachten, werden gering geachtet werden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden entehrt“ oder „werden als unbedeutend behandelt“. Das hebräische Verb kann bedeuten, gering zu werden oder gering geachtet zu werden, und steht im Gegensatz zu „ehren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Partikel knapp und natürlich wieder und leitet das aufgrund der vorangehenden Anklage ergehende Urteil ein.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die feierliche göttliche Ausspruchsformel in verständlichem, würdigem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: אָמֹר אָמַרְתִּי
  choice: Ich habe ausdrücklich gesagt
  rationale: Das vorangestellte Infinitivus absolutus verstärkt die Aussage; „ausdrücklich“ bewahrt diese Betonung ohne eine schwerfällige Nachbildung.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: dein Haus und das Haus deines Vaters
  rationale: „Haus“ bewahrt den familiären und dynastischen Sinn sowie die Wiederholung des hebräischen Ausdrucks.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: sollten vor mir einhergehen
  rationale: Bewahrt das Bild eines fortdauernden Wandelns beziehungsweise Dienstes in Gottes Gegenwart, ohne den Ausdruck ausschließlich auf den Priesterdienst festzulegen.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Natürliche Wiedergabe der zeitlich unbegrenzten Formulierung; die im Vers folgende Spannung wird nicht vorweg abgeschwächt.
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Macht den scharfen Gegensatz zwischen der früheren Aussage und dem gegenwärtigen Urteil deutlich.
- source_word: חָלִילָה לִּי
  choice: Das sei fern von mir!
  rationale: Bewahrt die starke Zurückweisungsformel und ihren feierlichen Ton.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: die mich ehren, werde ich ehren
  rationale: Erhält die bewusste Wiederholung derselben hebräischen Wortwurzel כבד.
- source_word: וּבֹזַי
  choice: die mich aber verachten
  rationale: „Verachten“ gibt den Gedanken von Geringschätzung und Missachtung prägnant wieder.
- source_word: יֵקָלּוּ
  choice: werden wenig gelten
  rationale: Drückt das Leicht- beziehungsweise Geringwerden als Gegenstück zum Ehren aus, ohne die mögliche Nuance vorschnell auf eine einzige deutsche Deutung festzulegen.
theological_decisions:
- issue: Charakter der früheren Zusage an Elis Haus
  choice: Die frühere göttliche Aussage wird als wirkliche, nachdrücklich ausgesprochene Zusage wiedergegeben, der nun eine ausdrückliche Zurückweisung gegenübersteht.
  alternative: „Für immer“ von vornherein als bloße Übertreibung auffassen oder die Zurückweisung nur als begrenzte Einschränkung des Vorrechts formulieren.
  rationale: Der hebräische Text stellt die frühere Aussage und das jetzige „Das sei fern von mir“ bewusst gegeneinander. Die Übersetzung bewahrt diese theologische Spannung, ohne sie systematisch aufzulösen.
- issue: Vergeltung gegenüber denen, die Jahwe verachten
  choice: „werden wenig gelten“ bewahrt die Aussage, dass sie gering beziehungsweise von wenig Gewicht sein werden.
  alternative: 'Explizit formulieren: „Ich werde sie entehren“ oder „sie werden von mir verachtet werden“.'
  rationale: Das hebräische Verb nennt hier nicht ausdrücklich ein handelndes Subjekt. Die zurückhaltende Formulierung erhält diese Offenheit und zugleich den Gegensatz zwischen „ehren“ und „gering sein“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „vor mir einhergehen“ erhält das hebräische Bild und dessen kultisch-bundestheologische Offenheit; ansonsten bleibt der Satzbau klar und allgemein verständlich.
