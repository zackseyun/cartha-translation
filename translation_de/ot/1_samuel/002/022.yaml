base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: de
  text: Eli war sehr alt. Er hörte alles, was seine Söhne gegenüber ganz Israel taten, und dass sie mit den Frauen schliefen, die am Eingang des Zeltes der Begegnung Dienst taten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich am Eingang des Zeltes der Begegnung versammelten“. Das hebräische Partizip kann ein Sichversammeln oder einen organisierten Dienst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: war sehr alt
  rationale: Die prädikative Verbindung mit dem Intensivierer wird im Deutschen natürlich und bedeutungsgetreu mit „war sehr alt“ wiedergegeben.
- source_word: וְשָׁמַע
  choice: Er hörte von
  rationale: Das Qatal berichtet in der Erzählung, dass Eli von den Vorgängen erfuhr. „Von … hören“ ist bei Berichten über Handlungen im Deutschen idiomatisch.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: von allem, was … antaten
  rationale: Die Formulierung fasst das fortgesetzte Fehlverhalten der Söhne zusammen. „Antaten“ gibt zusammen mit לְ die Betroffenheit Israels natürlich wieder, ohne eine zusätzliche Art der Schädigung festzulegen.
- source_word: לְכָל יִשְׂרָאֵל
  choice: ganz Israel antaten
  rationale: Das ל bezeichnet hier die von ihrem Handeln betroffene Gemeinschaft. Die deutsche Verbindung „jemandem etwas antun“ wahrt diese Relation und den negativen Kontext.
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: dass sie mit den Frauen schliefen
  rationale: שׁכב mit einer Person bezeichnet euphemistisch sexuellen Verkehr. „Mit jemandem schlafen“ ist die entsprechende klare, aber nicht explizitere deutsche Wendung.
- source_word: הַצֹּבְאוֹת
  choice: die … Dienst taten
  rationale: Das Partizip von צבא kann organisierten Dienst bezeichnen. Im Heiligtumskontext ist „Dienst tun“ naheliegend; die mögliche Bedeutung „sich versammeln“ wird in der Fußnote erhalten.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: Die Wendung bezeichnet den Eingangsbereich des Heiligtums. „Zelt der Begegnung“ gibt den kultischen Ausdruck verständlich und würdig wieder.
theological_decisions:
- issue: Aufgabe der Frauen am Heiligtum
  choice: Frauen, die am Eingang des Zeltes der Begegnung Dienst taten
  alternative: Frauen, die sich am Eingang des Zeltes der Begegnung versammelten
  rationale: Das hebräische Partizip lässt organisierten Dienst, möglicherweise aber auch ein Sichversammeln zu. Der Haupttext wählt aufgrund des Heiligtumskontexts und der Parallele in Exodus 38,8 „Dienst taten“, ohne daraus ein bestimmtes kultisches Amt abzuleiten; die Alternative bleibt in der Fußnote sichtbar.
- issue: Explizitheit der sexuellen Verfehlung
  choice: mit den Frauen schliefen
  alternative: mit den Frauen Geschlechtsverkehr hatten
  rationale: Der hebräische Text verwendet eine geläufige euphemistische Formulierung. Die Übersetzung macht den sexuellen Sinn verständlich, ohne klinischer oder drastischer als die Vorlage zu werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der sexuelle Sachverhalt bleibt entsprechend dem hebräischen Euphemismus klar, aber zurückhaltend formuliert. Die syntaktisch schwere hebräische Satzkette ist zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
