source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: de
  text: Er richtet den Armen aus dem Staub auf, hebt den Bedürftigen vom Abfallhaufen empor, um sie mit Edlen sitzen zu lassen und ihnen einen Ehrenplatz[a] zum Erbe zu geben. Denn Jahwe gehören die Pfeiler der Erde[b], und auf sie hat er den Erdkreis gestellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Ehrenthron“; wörtlicher: „einen Thron der Herrlichkeit/Ehre“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Grundfesten der Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: richtet den Armen aus dem Staub auf
  rationale: Das Hifil-Partizip von קום bezeichnet hier das Aufrichten eines Erniedrigten. „Aus dem Staub“ bewahrt das konkrete poetische Bild; דל bezeichnet in diesem Zusammenhang einen sozial Schwachen oder Armen.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: hebt den Bedürftigen vom Abfallhaufen empor
  rationale: אשפת bezeichnet einen Abfall- oder Unrathaufen. „Abfallhaufen“ gibt das Bild der Erniedrigung verständlich wieder; אביון ist der Bedürftige, dem das Lebensnotwendige fehlt.
- source_word: לְהוֹשִׁיב עִם־נְדִיבִים
  choice: um sie bei Edlen sitzen zu lassen
  rationale: Der Infinitiv drückt Ziel oder Folge des Aufrichtens aus. נדיבים sind hochgestellte, vornehme Menschen; „Edle“ erhält den gesellschaftlichen Kontrast.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: und ihnen einen Ehrenplatz als Erbe zu geben
  rationale: כסא kann „Sitz“ oder „Thron“ bedeuten, כבוד Ehre oder Herrlichkeit. Das Hifil von נחל enthält den Gedanken des Erbens bzw. Zuteilens als Erbbesitz; die Formulierung bewahrt diesen Gedanken in natürlichem Deutsch.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Eigenname יהוה wird als „Jahwe“ wiedergegeben, sodass sein Charakter als Gottesname im Ausgangstext sichtbar bleibt.
- source_word: מְצֻקֵי אֶרֶץ
  choice: die Pfeiler der Erde
  rationale: Das seltene Wort bezeichnet tragende Stützen oder Grundfesten. „Pfeiler“ bewahrt das anschauliche kosmologische Bild und passt dazu, dass der Erdkreis auf sie gestellt wird.
- source_word: תֵּבֵל
  choice: der Erdkreis
  rationale: תבל bezeichnet die geordnete beziehungsweise bewohnte Welt. „Erdkreis“ ist in gehobener poetischer Sprache verständlich und erhält die kosmische Bildwelt.
theological_decisions:
- issue: Kosmologische Bildsprache in מְצֻקֵי אֶרֶץ
  choice: Das Bild wird mit „Pfeiler der Erde“ beibehalten.
  alternative: „Grundfesten der Erde“
  rationale: Der Text spricht poetisch von tragenden Strukturen der Welt und begründet damit Jahwes souveräne Macht. Eine abstrakte Umschreibung würde das konkrete Bild unnötig auflösen.
- issue: Bedeutungsumfang von כִסֵּא כָבוֹד
  choice: „Ehrenplatz“ im Haupttext
  alternative: „Thron der Herrlichkeit“ oder „Ehrenthron“
  rationale: Die Wendung kann einen königlichen Thron oder allgemeiner einen ehrenvollen Sitz bezeichnen. Da von Armen und Bedürftigen im Plural die Rede ist, vermeidet „Ehrenplatz“ eine nicht zwingende Festlegung auf königliche Herrschaft; die engere Alternative wird in der Fußnote genannt.
- issue: Bezug des pluralischen Suffixes in יַנְחִלֵם
  choice: Es wird mit „ihnen“ auf den Armen und den Bedürftigen bezogen.
  alternative: Eine kollektiv-singularische Wiedergabe
  rationale: Obwohl die beiden Bezeichnungen jeweils im Singular stehen, fasst das pluralische Suffix die genannten Gruppen beziehungsweise Gestalten gemeinsam auf.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallelen Bewegungsverben „aufrichten“ und „emporheben“ sowie die konkreten Bilder von Staub, Abfallhaufen und Weltpfeilern bleiben erhalten. „Edle“ und „Erdkreis“ geben dem Lobgesang einen leicht gehobenen, aber verständlichen Ton.
