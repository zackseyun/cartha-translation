    rationale: Die Präposition „bei“ kann bloße örtliche Nähe ausdrücken. „Mit Edlen“ gibt עִם unmittelbarer wieder und verdeutlicht die gesellschaftliche Gleichstellung.
  - severity: medium
    issue: „einen Ehrenplatz als Erbe zu geben“
    rationale: Die Wendung ist im Deutschen weniger idiomatisch und kann den Ehrenplatz als das Mittel des Gebens verstehen lassen. „Einen Ehrenplatz zum Erbe zu geben“ bildet die durch das Hifil von נחל ausgedrückte Zuteilung als Erbbesitz klarer ab.
