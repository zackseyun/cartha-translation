source:
  edition: WLC
  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: de
  text: Redet nicht immer weiter so hochmütig! Lasst keine Anmaßung aus eurem Mund kommen! Denn Jahwe ist ein Gott, der alles weiß, und von ihm werden Taten gewogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, enger nach dem Konsonantentext: „und Taten werden nicht gewogen“. Der Haupttext folgt der traditionellen Lesung, nach der Jahwe menschliche Taten beurteilt.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: Redet nicht immer weiter
  rationale: Die Verbindung von רבה mit einem folgenden finiten Verb verstärkt beziehungsweise verlängert die Handlung. „Nicht immer weiter reden“ gibt den fortgesetzten Charakter der Warnung in natürlichem Deutsch wieder.
- source_word: גְּבֹהָה גְבֹהָה
  choice: so hochmütig
  rationale: Die Wiederholung bezeichnet nachdrücklich überhebliches, hochfahrendes Reden. Das verstärkende „so“ wahrt die Emphase, ohne die hebräische Doppelung unnatürlich nachzubilden.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: Lasst keine Anmaßung aus eurem Mund kommen
  rationale: עָתָק bezeichnet hier anmaßende, freche oder vermessene Rede. Die Aufforderungsform führt das Verbot des vorigen Satzteils idiomatisch fort.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: Jahwe ist ein Gott des Wissens
  rationale: Der hebräische Ausdruck lautet wörtlich „ein Gott der Erkenntnisse“. „Gott des Wissens“ bewahrt die knappe nominale Form und deutet die Mehrzahl nicht unnötig aus.
- source_word: וְלֹא נִתְכְּנוּ עֲלִלוֹת
  choice: und von ihm werden Taten gewogen
  rationale: Die Wiedergabe folgt der traditionellen Lesung וְלוֹ und bewahrt mit „gewogen“ das Bild des Prüfens und Beurteilens. Das Passiv und „von ihm“ machen Jahwe als Handelnden deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich gebrauchte Bundesname erkennbar bleibt.
- issue: Textvariante וְלֹא / וְלוֹ נִתְכְּנוּ עֲלִלוֹת
  choice: und von ihm werden Taten gewogen
  alternative: und Taten werden nicht gewogen
  rationale: Der Haupttext folgt der überlieferten Lesung (Qere) וְלוֹ, nach der Gott menschliche Taten prüft. Die Konsonantenschreibung (Ketiv) וְלֹא ermöglicht die abweichende Aussage „Taten werden nicht gewogen“; diese echte textliche Spannung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallelen Verbote bleiben knapp und eindringlich; die Schlusszeile bewahrt das hebräische Bild des Wiegens.
