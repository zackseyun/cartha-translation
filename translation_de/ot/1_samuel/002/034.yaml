  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: de
  text: 'Und dies wird für dich das Zeichen sein, das über deine beiden Söhne, Hofni und Pinhas, kommen wird: An einem Tag werden sie beide sterben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאוֹת
  choice: das Zeichen
  rationale: אוֹת bezeichnet hier ein bestätigendes Zeichen für die angekündigte Gerichtsbotschaft; „Zeichen“ ist im Deutschen natürlich und wahrt den weiten Bedeutungsumfang.
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: das über … kommen wird
  rationale: Die Wendung beschreibt ein Ereignis beziehungsweise Gericht, das die Betroffenen trifft. „Über … kommen“ bewahrt das Bild des Hebräischen und ist im Deutschen verständlich.
- source_word: שְׁנֵי בָנֶיךָ
  choice: deine beiden Söhne
  rationale: Die Formulierung gibt die ausdrücklich genannte Zweizahl natürlich wieder.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: Hofni und Pinhas
  rationale: Das zweite אֶל erläutert appositionell, welche beiden Söhne gemeint sind; im Deutschen werden die Namen unmittelbar angefügt.
- source_word: בְּיוֹם אֶחָד
  choice: an ein und demselben Tag
  rationale: Wörtlich steht „an einem Tag“. Im Zusammenhang mit שְׁנֵיהֶם liegt der Nachdruck darauf, dass beide am selben Tag sterben; die deutsche Wendung macht diese Aussage klar, ohne darüber hinauszugehen.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: werden sie beide sterben
  rationale: Die Stellung und das Zahlwort betonen, dass der Tod beide Söhne einschließt; die deutsche Wortfolge gibt dies idiomatisch wieder.
theological_decisions:
- issue: Funktion des Zeichens
  choice: Ein bestätigendes Zeichen für das angekündigte Gericht über Elis Haus
  alternative: Ein bloßes Vorzeichen ohne bestätigende Funktion
  rationale: Im Zusammenhang bestätigt der Tod der beiden Söhne die zuvor verkündete Gerichtsbotschaft. Der Haupttext bleibt mit „Zeichen“ bewusst allgemein und legt die genaue Funktion nicht enger fest als der hebräische Ausdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namensformen „Hofni“ und „Pinhas“ entsprechen gebräuchlichen deutschen Bibeltranskriptionen. Keine Fußnoten nötig, da die idiomatische Wiedergabe den Sinn des hebräischen Textes klar ausdrückt.
