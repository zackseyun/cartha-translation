  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: de
  text: Jahwes Widersacher werden zerschmettert[a]; vom Himmel her lässt er es gegen sie donnern[b]. Jahwe wird die Enden der Erde richten; er wird seinem König Kraft geben und das Horn seines Gesalbten erhöhen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die traditionelle hebräische Lesung lautet „seine Widersacher“; der Konsonantentext kann als Singular „sein Widersacher“ gelesen werden.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „Im Himmel lässt er es gegen sie donnern.“ Die Übersetzung „vom Himmel her“ gibt die im Deutschen naheliegende Herkunft des Donnerns wieder.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „seines Messias“. Das hebräische Wort bedeutet „sein Gesalbter“ und bezeichnet im Zusammenhang mit „seinem König“ den von Jahwe gesalbten König; aus demselben Wort ist der Titel „Messias“ hervorgegangen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in einer im Deutschen etablierten Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יֵחַתּוּ
  choice: werden zerschmettert
  rationale: Das Nifal von חתת bezeichnet hier das vernichtende Zerbrechen in der Niederlage; „zerschmettert“ bewahrt die Kraft des Bildes.
- source_word: מריבו/ו עליו/ו
  choice: die mit Jahwe streiten
  rationale: Die Form ist textkritisch beziehungsweise durch Ketiv und Qere schwierig. Diese Wiedergabe folgt dem Sinn „die gegen ihn streiten“, macht den Bezug auf Jahwe deutlich und vermeidet eine unnötig starre Substantivierung.
- source_word: בַּשָּׁמַיִם יַרְעֵם
  choice: über ihnen lässt er es am Himmel donnern
  rationale: Bewahrt die lokale Bedeutung von ב („am/im Himmel“) und gibt zugleich die kausative beziehungsweise objektbezogene Form von רעם in natürlichem Deutsch wieder.
- source_word: יָדִין
  choice: richtet
  rationale: Bezeichnet hier Jahwes richterliches Handeln über die ganze Erde; das deutsche Präsens kann in poetisch-prophetischer Rede zukünftige Gewissheit ausdrücken.
- source_word: אַפְסֵי אָרֶץ
  choice: die Enden der Erde
  rationale: Bewahrt die geläufige hebräische Raumformel für die fernsten Bereiche und damit den universalen Umfang des Gerichts.
- source_word: וְיִתֶּן עֹז
  choice: Er gibt … Kraft
  rationale: עֹז bedeutet Kraft oder Macht; „Kraft geben“ ist klar, würdig und nah an der Bildwelt des Textes.
- source_word: לְמַלְכּוֹ
  choice: seinem König
  rationale: Bewahrt trotz der vorexilischen Erzählsituation ausdrücklich den königlichen Ausdruck des Hebräischen.
- source_word: וְיָרֵם קֶרֶן
  choice: erhöht das Horn
  rationale: Erhält die zentrale hebräische Metapher für gesteigerte Stärke, Würde und Siegesmacht, statt sie interpretierend aufzulösen.
- source_word: מְשִׁיחוֹ
  choice: seines Gesalbten
  rationale: Gibt die lexikalische Bedeutung unmittelbar wieder und lässt sowohl den königlichen Bezug als auch die weiterführende messianische Bedeutung offen.
theological_decisions:
- issue: Unmittelbarer königlicher und möglicher messianischer Bezug von מְשִׁיחוֹ
  choice: seines Gesalbten
  alternative: seines Messias
  rationale: „Gesalbter“ übersetzt das Wort im Kontext von „König“ direkt und bewahrt die genuine Spannung zwischen dem erwarteten beziehungsweise eingesetzten König und der späteren messianischen Titelbedeutung, ohne diese stillschweigend auf nur eine Ebene festzulegen.
- issue: Zeitwert der Verbformen im abschließenden poetisch-prophetischen Satz
  choice: deutsches Präsens
  alternative: deutsches Futur
  rationale: Die hebräischen Präformativkonjugationen können hier zukünftiges Handeln ausdrücken. Das deutsche prophetische Präsens klingt natürlich und stellt das angekündigte Handeln als gewiss dar; ein Futur ist ebenfalls möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. Der Parallelismus bleibt klar gegliedert; „Horn“ wird wegen seiner literarischen und theologischen Tragweite nicht paraphrasiert. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erklärten Formulierung.
