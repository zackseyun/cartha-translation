base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: de
  text: Denn Jahwe wandte sich Hanna zu[a]. Sie wurde schwanger und brachte drei Söhne und zwei Töchter zur Welt. Und der Junge Samuel wuchs bei Jahwe auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe kümmerte sich um Hanna“ oder „Jahwe nahm sich Hannas an“. Das hebräische Verb bezeichnet hier ein gnädiges Eingreifen zu ihren Gunsten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit Jahwe“. Im Zusammenhang ist wahrscheinlich gemeint, dass Samuel am Heiligtum in Jahwes Gegenwart aufwuchs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt hier eine Begründung beziehungsweise erklärende Fortsetzung zum vorherigen Vers ein.
- source_word: פָקַד
  choice: wandte sich … zu
  rationale: Das Verb bezeichnet hier Jahwes gnädiges Eingreifen zugunsten Hannas. Die Formulierung ist in modernem Deutsch natürlich und lässt die positive Bedeutung aus dem Zusammenhang hervorgehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: Sie wurde schwanger und brachte … zur Welt
  rationale: Die beiden aufeinanderfolgenden Verben für Empfängnis und Geburt werden klar und idiomatisch wiedergegeben.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: drei Söhne und zwei Töchter
  rationale: Direkte Wiedergabe der Zahlen und Verwandtschaftsbezeichnungen.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: der Junge Samuel
  rationale: Bewahrt die hebräische Apposition und bezeichnet Samuel seinem Alter entsprechend.
- source_word: וַיִּגְדַּל
  choice: wuchs … auf
  rationale: Im Zusammenhang geht es um Samuels Heranwachsen; „aufwachsen“ ist dafür im Deutschen idiomatisch.
- source_word: עִם יְהוָה
  choice: bei Jahwe
  rationale: Das hebräische עִם bedeutet wörtlich „mit“. „Bei Jahwe“ bewahrt die ungewöhnliche Näheformulierung und passt zugleich zum Heiligtumskontext, ohne ihn ausdrücklich in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עִם יְהוָה beim Heranwachsen Samuels
  choice: bei Jahwe
  alternative: vor Jahwe / in Jahwes Gegenwart
  rationale: Die Formulierung kann auf Samuels Aufwachsen am Heiligtum in Gottes Gegenwart weisen. „Bei Jahwe“ bleibt näher am wörtlichen „mit Jahwe“ und vermeidet es, die räumliche oder theologische Nuance abschließend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erzählerische Schlichtheit bleibt erhalten; schwer verständliche Hebraismen werden behutsam idiomatisch wiedergegeben, während die Mehrdeutigkeit von עִם יְהוָה durch Text und Fußnote gewahrt wird.
