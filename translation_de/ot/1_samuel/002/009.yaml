source:
  edition: WLC
  text: רַגְלֵ֤י חסיד/ו יִשְׁמֹ֔ר וּ/רְשָׁעִ֖ים בַּ/חֹ֣שֶׁךְ יִדָּ֑מּוּ כִּֽי לֹ֥א בְ/כֹ֖חַ יִגְבַּר אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: de
  text: Er behütet die Füße seiner Getreuen[a], doch die Frevler verstummen[b] in der Finsternis; denn nicht durch Kraft gewinnt ein Mann[c] die Oberhand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Textüberlieferung lässt auch die Einzahl „seines Getreuen“ zu; hier wird wegen der Lesetradition und des poetischen Gegensatzes zu den „Frevlern“ der kollektive Plural wiedergegeben.
    reason: textual_variant
  - marker: b
    text: 'Oder: „werden still“ beziehungsweise „werden zum Schweigen gebracht“; das hebräische Verb kann Schweigen oder Stillwerden bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: „Ein Mann“ gibt die hebräische maskuline Einzahl wieder, die hier sprichwortartig und repräsentativ gebraucht ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: die Füße
  rationale: Die konkrete Bildsprache des hebräischen Plurals bleibt erhalten; „Schritte“ wäre eine mögliche, aber weniger direkte idiomatische Wiedergabe.
- source_word: חסידו
  choice: seiner Getreuen
  rationale: „Getreue“ gibt die von חֶסֶד geprägte loyale Verbundenheit wieder, ohne die späteren kirchlichen Nebenbedeutungen von „Heilige“ einzutragen. Der Plural folgt der überlieferten Lesetradition und dem kollektiven Sinn im Parallelismus.
- source_word: יִשְׁמֹר
  choice: behütet
  rationale: „Behüten“ vermittelt sowohl Bewahrung als auch schützende Fürsorge und passt natürlich zum Bild der Füße.
- source_word: וּרְשָׁעִים
  choice: doch die Frevler
  rationale: Das verbindende ו markiert hier einen Gegensatz. „Frevler“ bezeichnet Menschen, die im Unrecht stehen, und wahrt den ethisch-religiösen Gehalt von רְשָׁעִים.
- source_word: בַּחֹשֶׁךְ
  choice: in der Finsternis
  rationale: Die Wiedergabe bewahrt das bestimmte, poetische Bild von Dunkelheit, Unheil und Gericht, ohne es auszudeuten.
- source_word: יִדָּמּוּ
  choice: verstummen
  rationale: Das Verb kann Schweigen oder Stillwerden bezeichnen. „Verstummen“ ist knapp und lässt offen, ob das erzwungene Schweigen bis zur Ausschaltung oder Vernichtung reicht.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ kennzeichnet den Satz natürlich als Begründung des vorangehenden Gegensatzes.
- source_word: לֹא בְכֹחַ
  choice: nicht durch Kraft
  rationale: Die Formulierung bleibt eng an der hebräischen Aussage und vermeidet den Zusatz „allein“, der nicht ausdrücklich im Text steht.
- source_word: יִגְבַּר
  choice: gewinnt … die Oberhand
  rationale: Die Wendung gibt den Erfolg beziehungsweise das Sich-Durchsetzen wieder, nicht bloß das Vorhandensein von Stärke.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die grammatisch männliche Einzahl wird bewahrt; im Zusammenhang hat sie sprichwortartig-repräsentative Geltung.
theological_decisions:
- issue: Zahl und Sinn von חסידו
  choice: 'kollektiver Plural: „seiner Getreuen“'
  alternative: 'Singular: „seines Getreuen“'
  rationale: Die masoretische Lesetradition, der poetische Gegensatz zu den pluralischen „Frevlern“ und alte Textzeugen stützen den kollektiven Plural. Die im Konsonantentext mögliche Einzahl bleibt in der Fußnote sichtbar.
- issue: Aussage von יִדָּמּוּ über das Gericht an den Frevlern
  choice: „verstummen“
  alternative: „werden still“, „werden zum Schweigen gebracht“ oder „werden vernichtet“
  rationale: Die Übersetzung bewahrt die Spannweite zwischen Schweigen, Stillwerden und endgültiger Ausschaltung, statt den Gerichtssinn auf eine einzige Deutung festzulegen.
- issue: Generische Reichweite von אִישׁ
  choice: „ein Mann“ mit repräsentativer Bedeutung
  alternative: „ein Mensch“ oder „jemand“
  rationale: Die Übersetzung wahrt die maskuline Einzahl des Ausgangstextes; eine Fußnote erläutert, dass der Grundsatz allgemein und sprichwortartig formuliert ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. „Behütet“, „Frevler“ und „Finsternis“ sind allgemein verständlich, zugleich gehoben genug für den Liedkontext. Die markierte Wortstellung im Begründungssatz bewahrt den Nachdruck auf „nicht durch Kraft“.
