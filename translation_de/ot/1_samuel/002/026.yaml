id: 1SA.2.26
reference: 1 Samuel 2:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/נַּ֣עַר שְׁמוּאֵ֔ל הֹלֵ֥ךְ וְ/גָדֵ֖ל וָ/ט֑וֹב גַּ֚ם עִם יְהוָ֔ה וְ/גַ֖ם עִם אֲנָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: de
  text: Der Junge Samuel wuchs immer weiter heran und gefiel sowohl Jahwe als auch den Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und wurde sowohl Jahwe als auch den Menschen immer wohlgefälliger“. Das Hebräische verbindet „immer weiter heranwachsen“ knapp mit „gut sein bei“ Jahwe und den Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Der Junge
  rationale: נַעַר bezeichnet hier den noch jungen Samuel. Das einleitende וְ wird nicht eigens wiedergegeben, da ein zusätzliches deutsches Bindewort für den natürlichen Erzählfluss nicht erforderlich ist.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Der Personenname wird in seiner gebräuchlichen deutschen Form wiedergegeben.
- source_word: הֹלֵךְ וְגָדֵל
  choice: wuchs immer weiter heran
  rationale: Die Verbindung mit הֹלֵךְ beschreibt einen fortschreitenden Vorgang. „Immer weiter“ gibt diese anhaltende Entwicklung in natürlichem Deutsch wieder.
- source_word: וָטוֹב ... עִם
  choice: und gefiel ...
  rationale: Das prädikative טוֹב mit עִם beschreibt, dass Samuel bei jemandem als gut beziehungsweise wohlgefällig galt. „Gefiel“ gibt diese relationale Bewertung knapp und verständlich wieder, ohne sie auf bloße menschliche Beliebtheit zu verengen.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: sowohl Jahwe als auch den Menschen
  rationale: Die wiederholte Konstruktion גַּם ... וְגַם bildet die ausgewogene Entsprechung „sowohl ... als auch“. אֲנָשִׁים wird hier kollektiv und idiomatisch mit „den Menschen“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von טוֹב עִם im Verhältnis zu Jahwe und Menschen
  choice: gefiel sowohl Jahwe als auch den Menschen
  alternative: war sowohl bei Jahwe als auch bei den Menschen gut angesehen
  rationale: „Gefiel“ lässt dieselbe Aussage auf Gottes und der Menschen Beurteilung bezogen stehen. Die Alternative klingt bei Jahwe stärker nach bloßem Ansehen und kann die theologische Aussage unnötig abschwächen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; die Übersetzung bewahrt ihn als Namen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Wohlgefällig“ bleibt wegen seines gehobenen, heute weniger geläufigen Klangs auf die Fußnote beschränkt.
