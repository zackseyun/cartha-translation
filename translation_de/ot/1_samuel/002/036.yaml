  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Die Übriggebliebenen aus Elis Haus demütigen sich vor einer nicht näher benannten männlichen Autorität und bitten um eine priesterliche Stellung, um Nahrung zu erhalten. »wegen« gibt die ziel- bzw. erbittende Funktion von לְ bei Silber und Brot jedoch weniger genau wieder als »um«. Die abschließende Formulierung sollte den finalen Infinitiv »zu essen« unmittelbarer abbilden.'
  naturalness: Das Deutsch ist insgesamt klar und würdig. »um ein kleines Silberstück und einen Laib Brot« ist in diesem Kontext idiomatischer als »wegen …«. »eine priesterliche Dienststelle« macht den gemeinten einzelnen Dienstposten deutlicher als »einen der priesterlichen Dienste«, ohne einen technischen Rang festzulegen.
  terminology: »Haus« bewahrt den Familien- bzw. Dynastiebezug. »sich vor ihm niederbeugen« lässt den Bezug von לוֹ offen. »kleines Silberstück« ist als nichttechnische Wiedergabe von אֲגוֹרָה angemessen; die Fußnote wahrt die Alternative »Silbermünze«. Für אַחַת הַכְּהֻנּוֹת ist »priesterliche Dienststelle« als funktionale, nicht konfessionell aufgeladene Wiedergabe geeignet.
