revisions:
- from: 'Und jeder, der von deinem Haus übrig bleibt, wird kommen und sich vor ihm niederbeugen wegen eines kleinen Silberstücks[a] und eines Laibes Brot. Er wird sagen: »Nimm mich doch in einen der priesterlichen Dienste auf[b], damit ich ein Stück Brot zu essen habe.«'
  to: 'Und jeder, der von deinem Haus übrig bleibt, wird kommen und sich vor ihm niederbeugen, um ein kleines Silberstück[a] und einen Laib Brot. Er wird sagen: »Nimm mich doch in eine priesterliche Dienststelle auf[b], damit ich einen Bissen Brot essen kann.«'
  rationale: Die Revision ersetzt die kausale Wendung »wegen« durch die zielgerichtete Bitte »um« und gibt den finalen Infinitiv unmittelbarer wieder. Die Bezeichnung der priesterlichen Funktion wird als einzelner Dienstposten formuliert. Die Offenheit des Pronomenbezugs sowie die lexikalischen Alternativen bleiben erhalten.
