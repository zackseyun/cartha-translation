base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: de
  text: 'Und jeder, der von deinem Haus übrig bleibt, wird kommen und sich vor ihm niederbeugen, um ein kleines Silberstück[a] und einen Laib Brot. Er wird sagen: »Nimm mich doch in eine priesterliche Dienststelle auf[b], damit ich einen Bissen Brot essen kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um eine kleine Silbermünze«; das hebräische Wort bezeichnet eine geringe Einheit Silber.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Nimm mich doch in eines der Priesterämter auf« beziehungsweise »zu einer der priesterlichen Aufgaben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר בְּבֵיתְךָ
  choice: der von deinem Haus übrig bleibt
  rationale: Die Formulierung bezeichnet die nach dem angekündigten Gericht verbleibenden Angehörigen von Elis Haus; »Haus« bewahrt den familiär-dynastischen Sinn.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: sich vor ihm niederbeugen
  rationale: Die Wiedergabe erhält sowohl die körperliche Geste als auch den Ausdruck demütiger Unterordnung und Bitte.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: wegen eines kleinen Silberstücks
  rationale: אֲגוֹרָה bezeichnet hier eine geringe Silbermenge beziehungsweise kleine Geldeinheit; »Silberstück« vermeidet eine zu genaue Bestimmung als geprägte Münze.
- source_word: וְכִכַּר לָחֶם
  choice: und eines Laibes Brot
  rationale: כִּכָּר bezeichnet in diesem Zusammenhang einen Brotlaib, wahrscheinlich von runder Form; die einfache deutsche Bezeichnung ist natürlich und sachgerecht.
- source_word: סְפָחֵנִי נָא
  choice: Nimm mich doch … auf
  rationale: ספח drückt das Angliedern oder Aufnehmen in einen Bereich aus; »nimm mich … auf« klingt im Deutschen natürlich und erhält zusammen mit »doch« den bittenden Ton von נָא.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: einen der priesterlichen Dienste
  rationale: Der ungewöhnliche Plural kann verschiedene priesterliche Dienststellungen oder Aufgaben bezeichnen; »Dienste« vermeidet die missverständliche Vorstellung mehrerer Priestertümer.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: damit ich ein Stück Brot zu essen habe
  rationale: פַּת ist ein Stück beziehungsweise Bissen Brot. Die Formulierung vermittelt die Bedürftigkeit natürlich, ohne den Ausdruck unnötig zu steigern.
theological_decisions:
- issue: Bezug des männlichen Singularpronomens לוֹ
  choice: »vor ihm« bleibt ohne nähere Identifizierung stehen
  alternative: das Pronomen ausdrücklich auf den jeweils amtierenden Priester oder die neue priesterliche Autorität beziehen
  rationale: Der Kontext zeigt eine Umkehrung, bei der Elis Nachkommen von einer anderen priesterlichen Autorität abhängig werden. Der Vers selbst benennt die Person jedoch nicht ausdrücklich; deshalb bleibt die grammatische Offenheit erhalten.
- issue: Bedeutung des Plurals הַכְּהֻנּוֹת
  choice: priesterliche Dienste
  alternative: Priesterämter oder priesterliche Aufgaben
  rationale: Die Wendung wird funktional wiedergegeben, ohne aus ihr mehrere theologisch getrennte Priestertümer abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist als eindringliche Bitte formuliert; die wirtschaftliche Not und die Umkehrung der Stellung von Elis Haus bleiben deutlich. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar bei der betreffenden Wendung.
