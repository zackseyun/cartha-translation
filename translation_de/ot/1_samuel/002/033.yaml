  terminology: „Haus“ und „Nachwuchs“ geben בַּיִת und מַרְבִּית kontextgerecht wieder. „Als Männer sterben“ bewahrt die knappe, semantisch schwierige Formulierung, ohne eine Todesart zu behaupten. Die Fußnote erläutert die wahrscheinliche Bedeutung „im Mannesalter“ zurückhaltend und passend.
