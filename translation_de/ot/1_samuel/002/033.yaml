source:
  edition: WLC
  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: de
  text: Doch nicht jeden Mann aus deiner Familie werde ich von der Nähe meines Altars wegtilgen, um deine Augen versagen und deine Seele vor Kummer vergehen zu lassen. Und der gesamte Nachwuchs deines Hauses wird als Männer sterben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »werden als Männer sterben«; wahrscheinlich ist gemeint: Sie werden im Mannesalter sterben, nicht erst in hohem Alter.'
    reason: Die ungewöhnliche hebräische Wendung אֲנָשִׁים lässt die genaue Bedeutung offen. Die Fußnote nennt die naheliegende Deutung, ohne einen im Text nicht genannten Tod durch das Schwert einzuführen.
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: Doch nicht jeden Mann aus deiner Familie werde ich von der Nähe meines Altars wegtilgen
  rationale: Die Verbindung aus אִישׁ, Negation und Verb besagt im Kontext, dass nicht ausnahmslos alle männlichen Angehörigen Elis beseitigt werden. „Aus deiner Familie“ macht den Bezug von לְךָ im Deutschen verständlich; „von der Nähe meines Altars“ gibt מֵעִם wieder und lässt offen, ob vor allem Priesterdienst oder räumliche Nähe gemeint ist.
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: um deine Augen versagen ... zu lassen
  rationale: Die Zweck- bzw. Folgeangabe und das hebräische Bild werden in natürlichem Deutsch bewahrt. Das Versagen der Augen bezeichnet ein Zermürben durch anhaltendes Leid, ohne das Bild auf eine einzelne Deutung festzulegen.
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: und deine Seele vor Kummer vergehen zu lassen
  rationale: Das seltene Verb bezeichnet schmerzliche Betrübnis oder inneres Dahinschwinden. „Seele“ bewahrt נֶפֶשׁ als Ausdruck des inneren Lebens; „vor Kummer vergehen“ ist verständlich und würdevoll.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: Und der gesamte Nachwuchs deines Hauses
  rationale: מַרְבִּית bezeichnet Vermehrung bzw. Zuwachs und meint hier die nachkommenden Angehörigen des Hauses. „Nachwuchs“ überträgt die Metapher natürlicher als das im Deutschen missverständliche „Vermehrung“.
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: wird als Männer sterben
  rationale: Die knappe und schwierige Formulierung lautet wörtlich „werden als Männer sterben“. Diese offene Wiedergabe vermeidet den im Hebräischen nicht ausdrücklich genannten Zusatz „durch das Schwert“; die wahrscheinliche zeitliche Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Art des Gerichts über Elis priesterliche Linie
  choice: Nicht alle männlichen Angehörigen werden vom Altar weggetilgt; die Verbleibenden erfahren fortdauerndes Leid.
  alternative: Elis Linie wird vollständig aus dem Priesterdienst entfernt; oder die Aussage betrifft lediglich körperliches Überleben in der Nähe des Altars.
  rationale: Die verneinte Aussage lässt einen Rest bestehen, während die folgenden Zweck- bzw. Folgeangaben dessen Fortleben als Teil des Gerichts darstellen. Die Übersetzung bewahrt diese Spannung, ohne sie dogmatisch aufzulösen.
- issue: Bedeutung von אֲנָשִׁים am Versende
  choice: Im Haupttext wörtlich-offen „als Männer“, mit Erklärung der wahrscheinlichen Bedeutung in der Fußnote.
  alternative: „im besten Mannesalter“, „als sterbliche Menschen“ oder „durch das Schwert von Männern“
  rationale: Der masoretische Text nennt weder ein Schwert noch ausdrücklich eine Todesursache. Wahrscheinlich ist ein Tod im Mannesalter statt in hohem Alter gemeint, doch die ungewöhnliche Wendung bleibt mehrdeutig und wird daher nicht stillschweigend vereindeutigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem gerichtlichen Ton des Hebräischen nahe, wird aber durch „aus deiner Familie“ und „Nachwuchs“ für heutige Leser verständlich. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten Schlussformulierung.
