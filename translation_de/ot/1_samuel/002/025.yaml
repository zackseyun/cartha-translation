source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: de
  text: Wenn ein Mann gegen einen anderen Mann sündigt, wird Gott über ihn richten[a]. Wenn aber ein Mann gegen Jahwe sündigt, wer wird für ihn Fürsprache einlegen?[b] Doch sie wollten nicht auf die Stimme ihres Vaters hören, denn Jahwe wollte sie töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden die Richter über ihn richten.“ Das hebräische אֱלֹהִים kann auch menschliche Richter bezeichnen; der Gegensatz zu „Jahwe“ spricht hier jedoch eher für „Gott“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wer wird für ihn beten?“ Das hebräische Verb kann sowohl Beten als auch vermittelndes Eintreten für jemanden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: sündigt
  rationale: חטא bezeichnet hier moralisch und theologisch gewichtige Schuld; „sündigt“ bewahrt diese Aussagekraft.
- source_word: אִישׁ לְאִישׁ
  choice: ein Mann gegen einen anderen Mann
  rationale: Die grammatisch maskuline Einzahl und der zwischenmenschliche Gegensatz werden unmittelbar wiedergegeben.
- source_word: וּפִלְלוֹ
  choice: wird Gott für ihn vermitteln
  rationale: Die Piel-Form von פלל hat hier einen richterlich-schlichtenden Sinn. „Vermitteln“ gibt diesen wieder, ohne vorschnell nur Verurteilung auszudrücken; die mögliche gerichtliche Wiedergabe steht in der Fußnote.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Kontrast zum Sündigen gegen Jahwe spricht dafür, אֱלֹהִים hier als Bezeichnung Gottes zu verstehen. Die mögliche Bedeutung „Richter“ bleibt in der Fußnote erhalten.
- source_word: לַיהוָה
  choice: gegen Jahwe
  rationale: Die Präposition bezeichnet den, gegen den sich die Sünde richtet; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: wer wird für ihn Fürsprache einlegen?
  rationale: Die Hitpael-Form von פלל kann Beten beziehungsweise Eintreten für jemanden bezeichnen. „Fürsprache einlegen“ passt zum Zusammenhang und bewahrt die Verbindung zum richterlich-vermittelnden Sinn im ersten Satz.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: Doch sie wollten nicht auf die Stimme ihres Vaters hören
  rationale: Die Formulierung bringt die beharrliche Weigerung zum Ausdruck und bewahrt zugleich das hebräische Bild von der Stimme des Vaters.
- source_word: כִּי חָפֵץ יְהוָה
  choice: denn Jahwe wollte
  rationale: חפץ bezeichnet Wollen oder Begehren. „Wollte“ lässt die starke Aussage über Gottes Absicht stehen, ohne sie als Freude am Tod zu deuten oder zu einer bloßen Vorherbestimmung umzuformulieren.
- source_word: לַהֲמִיתָם
  choice: sie töten
  rationale: Der kausative Infinitiv von מות besagt, dass Jahwe ihren Tod herbeiführen wollte; „sie töten“ gibt dies klar und knapp wieder.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים im ersten Satz
  choice: Gott
  alternative: die Richter
  rationale: Der Gegensatz zwischen einer Sünde gegen einen anderen Menschen und einer Sünde gegen Jahwe legt den göttlichen Bezug nahe. Da אֱלֹהִים jedoch auch menschliche Richter bezeichnen kann, wird diese echte Auslegungsmöglichkeit nicht verschwiegen.
- issue: Göttliche Absicht in כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: denn Jahwe wollte sie töten
  alternative: denn Jahwe hatte beschlossen, sie zu töten
  rationale: Die Übersetzung bewahrt die harte Aussage des hebräischen Textes und damit die Spannung zwischen der Weigerung der Söhne und Jahwes Gericht, ohne das Verhältnis von menschlicher Verantwortung und göttlichem Wollen erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „ein Mann … ein anderer Mann“ folgt der Form des Hebräischen. „Auf die Stimme ihres Vaters hören“ bewahrt die biblische Bildsprache, bleibt aber im heutigen Deutsch verständlich. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Wendungen.
