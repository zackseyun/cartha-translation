base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: de
  text: 'Noch bevor man das Fett verbrannte, kam der Diener des Priesters[a] und sagte zu dem Mann, der das Opfer darbrachte: »Gib Fleisch für den Priester zum Braten! Denn er nimmt von dir kein gekochtes Fleisch, sondern nur rohes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der junge Mann des Priesters« beziehungsweise »der Gehilfe des Priesters«. Das hebräische Wort נַעַר kann einen jungen Mann oder einen Diener bezeichnen; hier ist wohl ein Untergebener gemeint, der im Auftrag des Priesters handelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: Noch bevor
  rationale: גַּם verstärkt hier die zeitliche Angabe und hebt das besonders anstößige vorzeitige Handeln hervor; »Noch bevor« gibt dies im Deutschen natürlich wieder.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: man das Fett als Rauchopfer verbrannte
  rationale: Das Verb bezeichnet hier das kultische Verbrennen der Fettstücke, bei dem sie in Rauch aufgehen. »Als Rauchopfer verbrannte« macht den Opferzusammenhang deutlich, ohne eine zusätzliche Opferart einzuführen.
- source_word: נַעַר הַכֹּהֵן
  choice: der Diener des Priesters
  rationale: נַעַר kann einen jungen Mann, Diener oder Gehilfen bezeichnen. Im Zusammenhang handelt er als Untergebener des Priesters; die lexikalische Spannweite wird in der Fußnote bewahrt.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: zu dem Mann, der das Opfer darbrachte
  rationale: Die partizipiale Form bezeichnet den Opfernden. Die verbale Wiedergabe ist klares, natürliches Deutsch.
- source_word: תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן
  choice: Gib mir Fleisch, damit der Priester es braten kann!
  rationale: »Gib mir« macht den im Hebräischen durch die Sprechsituation implizierten Empfänger im Deutschen idiomatisch deutlich. Der Zwecksinn des Infinitivs und der Priester als Nutznießer bleiben erhalten.
- source_word: וְלֹא יִקַּח מִמְּךָ
  choice: Denn er nimmt von dir kein
  rationale: Das Imperfekt beschreibt hier die erklärte beziehungsweise übliche Weigerung des Priesters. Präsens passt zur direkten Rede und gibt den begründenden Zusammenhang natürlich wieder.
- source_word: בָשָׂר מְבֻשָּׁל
  choice: gekochtes Fleisch
  rationale: מְבֻשָּׁל bezeichnet durch Kochen zubereitetes Fleisch und steht im ausdrücklichen Gegensatz zu rohem Fleisch.
- source_word: כִּי אִם חָי
  choice: sondern nur rohes
  rationale: Die exceptive Wendung stellt dem gekochten Fleisch ausschließlich rohes gegenüber. Das Bezugswort »Fleisch« kann im Deutschen ohne Bedeutungsverlust ausgelassen werden.
