  text: קֶ֥שֶׁת גִּבֹּרִ֖ים חַתִּ֑ים וְ/נִכְשָׁלִ֖ים אָ֥זְרוּ חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: de
  text: Die Bogen der Starken sind zerbrochen[a], doch die Strauchelnden haben sich mit Kraft umgürtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zerschmettert“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sind mit Kraft umgürtet“.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: die Bogen
  rationale: Das singularische Kollektivwort steht bei einem pluralischen Genitivattribut und einem pluralischen Prädikat. Der deutsche Plural gibt den gemeinten kollektiven Sinn natürlich wieder.
- source_word: גִּבֹּרִים
  choice: der Starken
  rationale: Das Wort bezeichnet starke, mächtige oder kriegstüchtige Menschen. „Die Starken“ bewahrt die breite poetische Bedeutung, ohne sie ausschließlich auf Krieger einzuengen.
- source_word: חַתִּים
  choice: sind zerbrochen
  rationale: In Verbindung mit Bogen bezeichnet das Wort deren Zerbrechen, nicht die mögliche emotionale Bedeutung „bestürzt“. „Zerbrochen“ ist konkret, würdevoll und nah am Bild.
- source_word: נִכְשָׁלִים
  choice: die Strauchelnden
  rationale: Das Partizip bezeichnet Menschen, die straucheln oder wanken. Die substantivierte Form erhält das körperliche Bild und den poetischen Gegensatz zu den Starken.
- source_word: אָזְרוּ
  choice: haben sich … umgürtet
  rationale: Die aktive Verbform bedeutet „gürten/umgürten“. Im Deutschen gibt die reflexive Form die idiomatische Vorstellung wieder, sich Kraft wie einen Gürtel anzulegen, ohne das Bild zu verflachen.
- source_word: חָיִל
  choice: Kraft
  rationale: Das Wort kann Kraft, Macht, Tüchtigkeit oder Tapferkeit bezeichnen. „Kraft“ passt hier zum umfassenden Umkehrmotiv und beschränkt den Sinn nicht auf militärische Tapferkeit.
theological_decisions:
- issue: Poetisches Umkehrmotiv in Hannas Lied
  choice: Die konkreten Bilder von zerbrochenen Bogen, strauchelnden Menschen und dem Umgürten mit Kraft bleiben erhalten.
  alternative: Die Waffen der Krieger werden zerstört, aber die Schwachen werden stark.
  rationale: Die bildhafte Sprache stellt die Umkehr menschlicher Stärke und Schwäche dar. Eine abstrakte Wiedergabe würde die literarische und theologische Spannung vorschnell auslegen.
- issue: Agens beim Umgürten mit Kraft
  choice: 'Die aktive hebräische Form wird idiomatisch reflexiv wiedergegeben: „haben sich mit Kraft umgürtet“.'
  alternative: „sind mit Kraft umgürtet“
  rationale: Der Text nennt hier nicht ausdrücklich, wer die Kraft verleiht. Die aktive beziehungsweise reflexive Wiedergabe vermeidet es, ohne sprachliches Signal ein göttliches Passiv einzutragen; die passive Deutung bleibt als Fußnotenalternative sichtbar.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. „Strauchelnden“ und „umgürtet“ sind bildhaft, aber verständlich; die knappe Parallelstruktur des Hebräischen bleibt erhalten.
