  variant: modern standard German
source:
  edition: WLC
  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: de
  text: Nein, meine Söhne! Denn der Bericht, den ich höre, ist nicht gut. Ihr bringt Jahwes Volk dazu, sich zu versündigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einem anderen Verständnis des Hebräischen: „Denn der Bericht, den ich Jahwes Volk verbreiten höre, ist nicht gut.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  choice: Nein
  rationale: Die Negation steht hier als einleitender Ausruf scharfer Missbilligung und nicht als gewöhnliches Verbot. „Nein“ ist dafür im modernen Deutschen natürlich.
- source_word: בָּנָי
  choice: meine Söhne
  rationale: Eli spricht seine männlichen Söhne direkt an; die wörtliche Wiedergabe ist zugleich idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Elis Zurechtweisung ein.
- source_word: לֹא טוֹבָה
  choice: ist nicht gut
  rationale: Bewahrt die zurückhaltende hebräische Wertung, ohne sie verstärkend als „schlecht“ auszulegen.
- source_word: הַשְּׁמֻעָה
  choice: der Bericht
  rationale: Bezeichnet das, was über das Verhalten der Söhne zu Eli gelangt; „Bericht“ vermeidet die zusätzliche Unsicherheitsnuance von „Gerücht“.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: den ich höre
  rationale: Natürliche deutsche Wiedergabe des Relativsatzes; das Partizip kann fortgesetztes Hören andeuten, ohne dass dies ausdrücklich ergänzt werden muss.
- source_word: מַעֲבִרִים
  choice: ihr bringt … dazu, sich zu versündigen
  rationale: 'Die Hifil-Form von עבר ist syntaktisch und semantisch schwierig. Im Kontext ist eine kausative Deutung plausibel: Das Verhalten der Söhne bringt das Volk zur Übertretung. Die alternative Deutung als „verbreiten“ wird in der Fußnote bewahrt.'
- source_word: עַם יְהוָה
  choice: Jahwes Volk
  rationale: Gibt die hebräische Genitivverbindung knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Übersetzung bewahrt den im hebräischen Text ausdrücklich stehenden persönlichen Gottesnamen.
- issue: Deutung von מַעֲבִרִים עַם יְהוָה
  choice: Die Söhne bringen Jahwes Volk dazu, sich zu versündigen
  alternative: Jahwes Volk verbreitet den Bericht
  rationale: Die kausative Deutung passt zur Zurechtweisung der Söhne und zum erzählerischen Zusammenhang. Da die hebräische Konstruktion auch anders verstanden werden kann, bleibt die alternative syntaktisch-lexikalische Deutung in einer Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Ausruf „Nein, meine Söhne!“ bewahrt die väterliche und zugleich scharfe Zurechtweisung. Die schwierige Schlusskonstruktion wird im Haupttext verständlich formuliert, ohne ihre echte Mehrdeutigkeit zu verschweigen.
