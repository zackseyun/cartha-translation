id: 1SA.2.17
reference: 1 Samuel 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תְּהִ֨י חַטַּ֧את הַ/נְּעָרִ֛ים גְּדוֹלָ֥ה מְאֹ֖ד אֶת פְּנֵ֣י יְהוָ֑ה כִּ֤י נִֽאֲצוּ֙ הָֽ/אֲנָשִׁ֔ים אֵ֖ת מִנְחַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: de
  text: So war die Sünde der jungen Männer sehr groß vor Jahwe,[a] denn die Männer verachteten Jahwes Opfergabe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „vor dem Angesicht Jahwes“; gemeint sein kann „vor Jahwe“ oder „in Jahwes Gegenwart“.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Opfergabe“ kann allgemein eine Opfergabe und in bestimmten Zusammenhängen speziell ein Speisopfer bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: Sünde
  rationale: Das Substantiv bezeichnet hier das schuldhafte Handeln der Söhne Elis, nicht ein Sündopfer.
- source_word: הַנְּעָרִים
  choice: der jungen Männer
  rationale: נַעַר kann einen Jungen, jungen Mann oder Diener bezeichnen. Da Elis Söhne erwachsene Männer im Priesterdienst sind, trifft „junge Männer“ den Zusammenhang, ohne sie als Kinder darzustellen.
- source_word: גְּדוֹלָה מְאֹד
  choice: sehr groß
  rationale: Die Wendung verstärkt die Schwere der Sünde. „Sehr groß“ gibt die einfache und nachdrückliche Formulierung des Hebräischen wieder.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung enthält wörtlich „das Angesicht Jahwes“ und bezeichnet hier die Beurteilung beziehungsweise Gegenwart Jahwes. „Vor Jahwe“ bewahrt das hebräische Bild in geläufiger deutscher Form.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für die vorangehende Bewertung ein. „Denn“ verbindet die beiden Aussagen in natürlichem, würdigem Deutsch.
- source_word: נִאֲצוּ
  choice: verachteten
  rationale: Das Verb bezeichnet Geringschätzung oder Verachtung. „Verachteten“ ist direkt und entspricht der Verbindung mit der Opfergabe als Objekt.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Die gewöhnliche Bezeichnung für Männer beziehungsweise Menschen verweist hier auf die zuvor genannten jungen Männer zurück; die wörtliche Wiedergabe vermeidet eine zusätzliche Deutung.
- source_word: מִנְחַת יְהוָה
  choice: Jahwes Opfergabe
  rationale: מִנְחָה kann allgemein eine Gabe oder Opfergabe und in bestimmten Zusammenhängen besonders ein Speisopfer bezeichnen. Der weitere Erzählzusammenhang spricht dafür, die Bedeutung hier nicht auf ein Speisopfer einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ erhält den Charakter als persönlicher Bundesname, statt ihn durch einen Titel zu ersetzen.
- issue: Bezugspunkt und Gewicht der Sünde
  choice: „sehr groß vor Jahwe“
  alternative: „sehr schwer gegen Jahwe“
  rationale: Die Formulierung mit „vor“ bewahrt die hebräische Wendung vom Angesicht beziehungsweise von der Gegenwart Jahwes. Sie lässt offen, ob vor allem Gottes Urteil, seine Gegenwart oder zugleich die gegen ihn gerichtete Schuld hervorgehoben wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am Hebräischen, ohne im Deutschen unnatürlich zu wirken. Der Gottesname erscheint als „Jahwe“; fachsprachliche Opferterminologie wird im Haupttext vermieden und in der Fußnote erläutert.
