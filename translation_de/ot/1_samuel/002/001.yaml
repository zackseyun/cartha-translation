  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: de
  text: 'Da betete Hanna und sagte:


    »In Jahwe jubelt mein Herz;

    in Jahwe ist mein Horn hoch erhoben[a].

    Mein Mund öffnet sich weit gegen meine Feinde[b],

    denn ich freue mich über deine Rettung[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das »Horn« ist im Hebräischen ein Bild für Kraft, Würde oder erhöhtes Ansehen.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Ich rede kühn gegen meine Feinde« beziehungsweise »Ich triumphiere über meine Feinde«. Wörtlich heißt es: »Mein Mund öffnet sich weit gegen meine Feinde.«'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »dein Heil«. Das hebräische Wort kann sowohl umfassendes Heil als auch konkrete Rettung aus Not bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: betete
  rationale: Das Hitpael von פלל bedeutet gewöhnlich „beten“. Obwohl das Folgende poetisches Lob ist, bezeichnet der Erzählrahmen es ausdrücklich als Gebet.
- source_word: וַתֹּאמַר
  choice: sagte
  rationale: Das gewöhnliche Verb für „sagen“ wird beibehalten; der hebräische Text verwendet hier kein eigenes Verb für „singen“.
- source_word: עָלַץ לִבִּי
  choice: In Jahwe jubelt mein Herz
  rationale: עלץ bezeichnet überschwängliche Freude. „jubelt“ bewahrt die poetische Kraft, während „mein Herz“ die hebräische Ausdrucksweise erhält.
- source_word: בַּיהוָה
  choice: in Jahwe
  rationale: Die Präposition ב bezeichnet hier den Grund oder Bereich von Hannas Freude und Erhöhung. Die knappe Form „in Jahwe“ bewahrt zudem die Parallelität beider Verszeilen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רָמָה קַרְנִי
  choice: mein Horn ist hoch erhoben
  rationale: Das „Horn“ ist ein hebräisches Bild für Kraft, Würde und erhöhtes Ansehen. Das Bild bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: Mein Mund öffnet sich weit gegen meine Feinde
  rationale: Die körperhafte Metapher des weit geöffneten Mundes wird bewahrt. Sie drückt kühnes, triumphierendes Reden gegenüber den Feinden aus.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier den Grund für Hannas Jubel und ihr kühnes Reden ein; „denn“ passt natürlich zum gehobenen poetischen Zusammenhang.
- source_word: שָׂמַחְתִּי
  choice: ich freue mich
  rationale: Das Perfekt kann hier einen gegenwärtigen, aus dem erfahrenen Handeln Gottes hervorgegangenen Zustand bezeichnen.
- source_word: בִּישׁוּעָתֶךָ
  choice: über deine Rettung
  rationale: יְשׁוּעָה kann sowohl umfassendes Heil als auch konkrete Rettung aus Bedrängnis bezeichnen. „Rettung“ passt unmittelbar zu Hannas Lage, ohne den weiteren Bedeutungsraum auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Rettung
  alternative: Heil
  rationale: Im unmittelbaren Zusammenhang steht Gottes konkrete Befreiung im Vordergrund; zugleich wird in der Fußnote darauf hingewiesen, dass das Wort auch den umfassenderen Sinn „Heil“ tragen kann.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst bewahrter hebräischer Bildsprache. Die poetischen Parallelzeilen behalten zweimal „in Jahwe“ bei; diese leicht markierte Form spiegelt die Struktur und theologische Spannung des Ausgangstextes.
