source:
  edition: WLC
  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: de
  text: Jahwe macht arm[a] und macht reich; er erniedrigt und erhöht auch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lässt verarmen“. Das hebräische Verb kann auch den weiteren Sinn haben, jemanden seines Besitzes zu berauben oder einen Verlust herbeizuführen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hebt empor“ oder „richtet auf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: מוֹרִישׁ
  choice: macht arm
  rationale: Im Gegensatz zu „macht reich“ bezeichnet die Hifil-Form hier am wahrscheinlichsten das Verarmenlassen; die knappe Form bewahrt den poetischen Parallelismus.
- source_word: וּמַעֲשִׁיר
  choice: und macht reich
  rationale: Die kausative Bedeutung wird direkt wiedergegeben und bildet das sprachliche Gegenstück zu „macht arm“.
- source_word: מַשְׁפִּיל
  choice: er erniedrigt
  rationale: Das Verb bezeichnet das Herabsetzen oder Niedrigmachen und bewahrt den Gegensatz zum anschließenden Erhöhen.
- source_word: אַף
  choice: auch
  rationale: Die Partikel fügt die zweite Aussage verstärkend hinzu, ohne zwingend einen adversativen Gegensatz auszudrücken.
- source_word: מְרוֹמֵם
  choice: erhöht
  rationale: Die Wiedergabe erhält das räumliche Bild des Emporhebens und den Gegensatz zu „erniedrigt“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliche Verursachung von Armut und Reichtum
  choice: macht arm und macht reich
  alternative: lässt verarmen und bereichert
  rationale: Die kausativen Verbformen werden unverhüllt wiedergegeben. So bleibt die theologische Spannung der Aussage über Jahwes souveränes Handeln bestehen.
translation_notes:
  register: Knappe, poetische Standardsprache mit bewusst paralleler Satzstruktur. „Jahwe“ folgt der direkten Wiedergabe des Gottesnamens; „erniedrigt“ und „erhöht“ erhalten den vertikalen Gegensatz des Hebräischen.
