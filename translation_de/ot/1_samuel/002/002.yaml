id: 1SA.2.2
reference: 1 Samuel 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: de
  text: Keiner ist heilig wie Jahwe[a], denn keiner ist außer dir, und kein Fels ist wie unser Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; hier mit der im Deutschen üblichen Namensform „Jahwe“ wiedergegeben.'
    reason: Der Eigenname Gottes wird sichtbar gemacht; zugleich wird auf die hebräische Form hingewiesen.
lexical_decisions:
- source_word: אֵין
  choice: keiner / kein
  rationale: Die dreimalige Verneinung wird mit idiomatischen deutschen Existenz- und Vergleichsaussagen wiedergegeben; die Wiederholung bewahrt Nachdruck und Parallelismus.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: „Heilig“ ist die sachlich genaue und im Deutschen etablierte Wiedergabe für Gottes Einzigartigkeit und Abgesondertheit.
- source_word: כַּיהוָה
  choice: wie Jahwe
  rationale: Die Präposition כְּ bezeichnet den Vergleich; der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorausgehende Aussage; „denn“ gibt diese erklärende Funktion natürlich und poetisch wieder.
- source_word: בִּלְתֶּךָ
  choice: außer dir
  rationale: Die Form drückt Ausschluss aus und bewahrt zugleich die direkte Anrede in der zweiten Person.
- source_word: צוּר
  choice: Fels
  rationale: Die konkrete Metapher für Stärke, Beständigkeit und Schutz bleibt erhalten, statt sie deutend auf „Zuflucht“ zu verengen.
- source_word: כֵּאלֹהֵינוּ
  choice: wie unser Gott
  rationale: אֱלֹהִים bezeichnet hier trotz seiner morphologischen Form den Gott Israels im Singular; כְּ markiert erneut einen Vergleich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen; die Schreibweise ist im modernen Standarddeutsch etabliert.
- issue: Wechsel von der dritten zur zweiten Person
  choice: „wie Jahwe … außer dir“
  alternative: 'durchgehend dritte Person: „wie Jahwe … außer ihm“'
  rationale: Der unvermittelte Wechsel zur direkten Anrede steht im Hebräischen und wird bewahrt, statt ihn stilistisch anzugleichen.
translation_notes:
  register: Poetisch, knapp und würdig. Die dreifache Verneinung und der Parallelismus des Hebräischen bleiben hörbar; die Felsmetapher wird nicht aufgelöst.
