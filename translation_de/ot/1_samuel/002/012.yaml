  text: וּ/בְנֵ֥י עֵלִ֖י בְּנֵ֣י בְלִיָּ֑עַל לֹ֥א יָדְע֖וּ אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/012.yaml
  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: de
  text: Elis Söhne waren ruchlose Männer[a]; sie kannten den HERRN nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne der Nichtswürdigkeit“; traditionell: „Söhne Belials“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie erkannten den HERRN nicht an“ beziehungsweise „sie achteten den HERRN nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עֵלִי
  choice: Und Elis Söhne
  rationale: Das ו wird als schlichte Satzverknüpfung mit „Und“ wiedergegeben; בְנֵי עֵלִי ist die Genitivverbindung „Elis Söhne“.
- source_word: בְּנֵי בְלִיָּעַל
  choice: nichtsnutzige Männer
  rationale: Die wörtliche Wendung „Söhne der Nichtswürdigkeit“ bezeichnet moralisch verdorbene, niederträchtige Menschen. „Nichtsnutzige Männer“ gibt den idiomatischen Sinn verständlich wieder, ohne Belial als Eigennamen einzuführen.
- source_word: לֹא יָדְעוּ
  choice: sie kannten … nicht
  rationale: Das Verb יָדַע bedeutet grundlegend „kennen/wissen“ und kann hier auch fehlende Anerkennung oder Beziehung ausdrücken. Die direkte Wiedergabe bewahrt diese Bedeutungsweite.
- source_word: אֶת־יְהוָה
  choice: den HERRN
  rationale: אֶת markiert das direkte Objekt und bleibt unübersetzt; der Gottesname יהוה wird nach verbreiteter deutscher Bibelkonvention mit „der HERR“ wiedergegeben.
theological_decisions:
- issue: Ob בְּנֵי בְלִיָּעַל als gewöhnliche idiomatische Wendung oder als Bezug auf die Gestalt Belial zu verstehen ist
  choice: 'gewöhnliche idiomatische Wendung: „nichtsnutzige Männer“'
  alternative: „Söhne Belials“ oder wörtlich „Söhne der Nichtswürdigkeit“
  rationale: Im Kontext charakterisiert die Wendung die Männer als moralisch verdorben; ein Eigenname würde eine spätere Personifizierung in den Text eintragen.
- issue: Ob „sie kannten den HERRN nicht“ deutend entfaltet werden soll
  choice: Die Erkenntnissprache im Haupttext beibehalten
  alternative: „sie erkannten den HERRN nicht an“ oder „sie achteten den HERRN nicht“
  rationale: Das hebräische „kennen“ kann relationale und bundestheologische Bedeutung tragen. Die direkte Formulierung bewahrt die Spannung, statt sie auf eine einzelne Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nichtsnutzige Männer“ ist verständlich und bringt das moralische Urteil des hebräischen Idioms zum Ausdruck. Die traditionelle Schreibung „HERR“ kennzeichnet die Wiedergabe des Gottesnamens.
