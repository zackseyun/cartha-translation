source:
  edition: WLC
  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: de
  text: Du wirst die Bedrängnis der Wohnung sehen bei all dem Guten, das er Israel erweist,[a] und in deinem Haus wird es für alle Zeit keinen alten Mann geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Bedränger in der Wohnung“, „Bedrängnis am Heiligtum“ oder ähnlich; die hebräische Formulierung ist schwer verständlich.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: Du wirst … sehen
  rationale: Das Hifil von נבט bedeutet hier „hinblicken, ansehen, sehen“. „Sehen“ ist im Deutschen natürlich und lässt eine mögliche emotionale Färbung offen.
- source_word: צַר
  choice: die Bedrängnis
  rationale: צַר kann einen Bedränger/Gegner oder Bedrängnis/Not bezeichnen. Im schwierigen Ausdruck mit מָעוֹן bewahrt „Bedrängnis“ die sachliche Mehrdeutigkeit besser als die Festlegung auf eine Person.
- source_word: מָעוֹן
  choice: der Wohnung
  rationale: מָעוֹן bezeichnet eine Wohnung oder Wohnstätte und kann sich hier auf Gottes Heiligtum beziehen. „Wohnung“ erhält den lexikalischen Sinn, ohne die Deutung im Haupttext zu verengen.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: bei all dem Guten, das er Israel erweist
  rationale: Die Formulierung gibt den umfassenden Sinn wieder und belässt das grammatisch nicht ausdrücklich genannte Subjekt wie im Hebräischen implizit; im Zusammenhang ist am ehesten Gott gemeint.
- source_word: זָקֵן
  choice: einen alten Mann
  rationale: זָקֵן bezeichnet hier einen Mann, der ein hohes Alter erreicht, nicht einen Amtsträger oder Ältesten.
- source_word: בְּבֵיתְךָ
  choice: in deinem Haus
  rationale: „Haus“ bewahrt das hebräische Bild und bezeichnet im Zusammenhang Elis Familie beziehungsweise Nachkommenschaft.
- source_word: כָּל הַיָּמִים
  choice: solange die Welt besteht
  rationale: Die idiomatische Wendung bedeutet hier dauerhaft beziehungsweise für alle Zukunft. Die deutsche Formulierung ist würdig und verständlich, ohne das unnatürliche „alle Tage“ anzuhängen.
theological_decisions:
- issue: Deutung des schwierigen Ausdrucks צַר מָעוֹן
  choice: die Bedrängnis der Wohnung
  alternative: einen Bedränger in der Wohnung; Bedrängnis am Heiligtum
  rationale: Der masoretische Text ist an dieser Stelle schwer verständlich. Die gewählte formnahe Wiedergabe wahrt die echte Unsicherheit und legt weder zwingend einen persönlichen Gegner noch ausschließlich eine Notlage am Heiligtum fest.
- issue: Subjekt von יֵיטִיב
  choice: implizites „er“
  alternative: ausdrücklich „Gott“
  rationale: Im Hebräischen ist das Subjekt nicht ausdrücklich genannt. Der Kontext legt Gott nahe, doch die Übersetzung ergänzt seinen Namen nicht und bewahrt so die Form des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der schwierige Ausdruck bleibt im Haupttext bewusst formnah und wird in der Fußnote durch wichtige Alternativen erschlossen. „Haus“ behält den familiär-dynastischen Doppelsinn.
