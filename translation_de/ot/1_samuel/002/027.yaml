  text: וַ/יָּבֹ֥א אִישׁ אֱלֹהִ֖ים אֶל עֵלִ֑י וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/נִגְלֹ֤ה נִגְלֵ֨יתִי֙ אֶל בֵּ֣ית אָבִ֔י/ךָ בִּֽ/הְיוֹתָ֥/ם בְּ/מִצְרַ֖יִם לְ/בֵ֥ית פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: de
  text: 'Ein Mann Gottes kam zu Eli und sagte zu ihm: »So spricht der HERR: Habe ich mich dem Haus deines Vaters nicht offenbart, als sie in Ägypten zum Haus des Pharao gehörten?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als sie in Ägypten dem Haus des Pharaos unterstanden?«'
    reason: Die knappe hebräische Wendung לְבֵית פַּרְעֹה lässt eine Zuordnung zum Haushalt, Dienst oder Herrschaftsbereich des Pharaos zu.
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: Mann Gottes
  rationale: Die feste hebräische Bezeichnung für einen von Gott beauftragten Boten wird formal und im Deutschen geläufig wiedergegeben.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht der HERR
  rationale: Bewahrt die traditionelle Botenformel; der Gottesname JHWH wird entsprechend deutscher Bibelkonvention mit HERR wiedergegeben.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: Habe ich mich ... nicht deutlich offenbart
  rationale: Der Infinitivus absolutus verstärkt das finite Verb. Die rhetorische Frage wird im Deutschen natürlich als erwartete Zustimmung formuliert.
- source_word: לְבֵית פַּרְעֹה
  choice: zum Haus des Pharaos gehörten
  rationale: Die Präposition לְ kann hier Zugehörigkeit oder Zuordnung ausdrücken; diese Wiedergabe folgt dem syntaktischen Bezug auf die Vorfahren in Ägypten, ohne die Wendung räumlich zu verengen.
theological_decisions:
- issue: Bezug von »Haus deines Vaters«
  choice: Die kollektive Familien- bzw. Sippenbezeichnung bleibt erhalten.
  alternative: Explizit »deinen Vorfahren« oder »dem Haus Aarons« schreiben.
  rationale: Der hebräische Text nennt den konkreten Vorfahren an dieser Stelle nicht; eine ausdrückliche Identifizierung würde die Aussage stärker festlegen als der Vers selbst.
- issue: Art der Offenbarung
  choice: »mich ... offenbart«
  alternative: »mich ... gezeigt« oder »bin ich ... erschienen«
  rationale: Das Nifal von גלה bezeichnet hier göttliche Selbstoffenbarung; die reflexive Form bewahrt diesen theologischen Gehalt, ohne die Erscheinungsweise näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Botenformel bleibt traditionell geprägt; Satzbau und rhetorische Frage sind zugleich für heutige Leser natürlich formuliert.
