  rationale: Die einzige notwendige Änderung entfernt das interpretierende Adverb »deutlich«. Die rhetorische deutsche Frage bewahrt die emphatische, zustimmungsheischende Funktion der hebräischen Frage, ohne eine nicht genannte Qualität der Offenbarung einzutragen. Die Fußnote erhält die semantische Offenheit von לְבֵית פַּרְעֹה.
