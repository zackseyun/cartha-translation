source:
  edition: WLC
  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: de
  text: Sieh, es kommen Tage, da werde ich deine Kraft[a] und die Kraft deines Vaterhauses brechen, sodass es in deinem Haus keinen alten Mann mehr geben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deinen Arm … den Arm deines Vaterhauses«. Der Arm ist hier ein Bild für Kraft oder Macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Leitet eine feierliche prophetische Ankündigung ein und bewahrt den hinweisenden Charakter des hebräischen Ausdrucks in verständlichem, würdigem Deutsch.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Bewahrt die geläufige hebräische Ankündigungsformel und ihren auf ein bevorstehendes Gericht gerichteten Sinn.
- source_word: וְגָדַעְתִּי
  choice: da werde ich … brechen
  rationale: Das Verb bezeichnet das Abhauen oder Abschneiden. In Verbindung mit der bildlich gebrauchten »Kraft« gibt »brechen« die entschiedene Beseitigung von Macht und Lebenskraft natürlich wieder.
- source_word: זְרֹעֲךָ … זְרֹעַ בֵּית אָבִיךָ
  choice: deine Kraft … die Kraft deines Vaterhauses
  rationale: זְרוֹעַ bedeutet wörtlich »Arm«, bezeichnet hier aber bildlich Kraft oder Macht. »Kraft« vermittelt den gemeinten Sinn, während die Fußnote das hebräische Bild offenlegt.
- source_word: בֵּית אָבִיךָ
  choice: dein Vaterhaus
  rationale: Bezeichnet die väterliche Großfamilie beziehungsweise Abstammungslinie. »Vaterhaus« erhält den Verwandtschaftsbezug knapp und würdig.
- source_word: מִהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: sodass es in deinem Haus keinen alten Mann mehr geben wird
  rationale: Die Infinitivkonstruktion bezeichnet hier die Folge des angekündigten Gerichts. Die Formulierung bewahrt den Bezug auf einen Mann hohen Alters und deutet זָקֵן nicht als Amtsbezeichnung.
theological_decisions:
- issue: Bildliche Bedeutung von זְרוֹעַ im Gerichtswort
  choice: Im Haupttext mit »Kraft« wiedergegeben
  alternative: Wörtlich »Arm« beziehungsweise »den Arm … abhauen«
  rationale: Der Arm steht im Hebräischen häufig für Kraft oder Macht. Der Zusammenhang mit dem Ausbleiben alter Männer im Haus Elis spricht für den Verlust dauerhafter Stärke und Fortexistenz; die Übersetzung legt darüber hinaus keine bestimmte dogmatische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Formel. »Vaterhaus« hält den familiären und genealogischen Sinn knapp fest; die konkrete Aussage »kein alter Mann« bleibt gegenüber einer verallgemeinernden Umschreibung erhalten.
