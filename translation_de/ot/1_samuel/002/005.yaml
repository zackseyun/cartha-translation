  variant: modern standard German
source:
  edition: WLC
  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: de
  text: Die Satten haben sich für Brot verdingt, doch die Hungrigen hungern nicht mehr.[a] Sogar die Unfruchtbare hat sieben geboren,[b] doch die viele Söhne hatte, ist dahingewelkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Hungrigen haben aufgehört.“ Was aufgehört hat, bleibt im Hebräischen unausgesprochen; gemeint sein kann, dass sie nicht mehr hungern oder keinen Mangel mehr leiden.'
    reason: lexical_alternative
  - marker: b
    text: „Sieben“ kann eine konkrete Zahl sein und zugleich in der Dichtung Fülle oder Vollständigkeit ausdrücken.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: die Satten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die satt beziehungsweise wohlversorgt waren, und bildet den knappen poetischen Gegensatz zu den Hungrigen.
- source_word: בַּלֶּחֶם
  choice: für Brot
  rationale: Die konkrete Bedeutung „Brot“ bewahrt das Bild wirtschaftlicher Not; zugleich kann לֶחֶם allgemein Nahrung bezeichnen.
- source_word: נִשְׂכָּרוּ
  choice: haben sich verdingt
  rationale: Der Nifal bezeichnet hier das Eintreten in fremden Lohn- oder Dienst. „Sich verdingen“ gibt den reflexiv-passiven Zug knapp und treffend wieder.
- source_word: וּרְעֵבִים חָדֵלּוּ
  choice: doch die Hungrigen hungern nicht mehr
  rationale: חָדֵלּוּ bedeutet wörtlich „sie haben aufgehört“, lässt aber das Ergänzende unausgesprochen. Die Übersetzung ergänzt aus „die Hungrigen“ den naheliegenden Sinn, während die Fußnote die Ellipse und ihre Bedeutungsbreite offenlegt.
- source_word: עַד
  choice: sogar
  rationale: עַד markiert hier die äußerste Steigerung der Umkehrung („bis dahin, dass / sogar“) und nicht primär einen zeitlichen Endpunkt.
- source_word: עֲקָרָה
  choice: die Unfruchtbare
  rationale: Das feminine Adjektiv wird substantivisch gebraucht. „Die Unfruchtbare“ ist im Deutschen knapp, verständlich und dem poetischen Parallelismus angemessen.
- source_word: יָלְדָה שִׁבְעָה
  choice: hat sieben geboren
  rationale: Die knappe, objektlose Form des Hebräischen bleibt erhalten. Die Zahl sieben wird weder als ausschließlich wörtlich noch als ausschließlich symbolisch festgelegt.
- source_word: וְרַבַּת בָּנִים
  choice: doch die viele Söhne hatte
  rationale: בָּנִים bedeutet hier ausdrücklich „Söhne“. Die deutsche Relativkonstruktion gibt den idiomatischen hebräischen Ausdruck „die an Söhnen Reiche“ natürlich wieder.
- source_word: אֻמְלָלָה
  choice: ist dahingewelkt
  rationale: Das Verb bezeichnet Schwachwerden, Verkümmern oder Dahinsiechen. „Ist dahingewelkt“ erhält das poetische Bild des Niedergangs im Gegensatz zur neu gewonnenen Fruchtbarkeit.
theological_decisions:
- issue: Ob שִׁבְעָה („sieben“) ausschließlich wörtlich oder als Zahl der Fülle zu verstehen ist
  choice: Die Zahl „sieben“ bleibt im Haupttext unaufgelöst stehen.
  alternative: Die Zahl ausdrücklich als Bild vollkommener Fruchtbarkeit deuten.
  rationale: Der hebräische Text nennt die Zahl unmittelbar und lässt in der Dichtung sowohl eine konkrete als auch eine symbolische Resonanz zu.
- issue: Ob בָּנִים verallgemeinernd mit „Kinder“ wiederzugeben ist
  choice: „Söhne“
  alternative: „Kinder“
  rationale: Das hebräische Wort ist spezifisch maskulin. Der poetische Zusammenhang bietet keinen zwingenden Grund, diese Angabe zu verallgemeinern.
- issue: Wie die ausgelassene Ergänzung zu חָדֵלּוּ zu verstehen ist
  choice: Im Haupttext als Ende des Hungerns wiedergeben und die Ellipse anmerken.
  alternative: Als Ende des Mangels oder als absolutes „sie haben aufgehört“ wiedergeben.
  rationale: Der unmittelbare Ausdruck „die Hungrigen“ legt das Ende des Hungerns nahe; zugleich soll die nicht ausdrücklich genannte Ergänzung des Hebräischen nicht verschwiegen werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelstruktur. „Sich verdingen“ und „dahinwelken“ sind leicht gehoben, aber verständlich und bewahren die soziale beziehungsweise bildhafte Schärfe des hebräischen Verses.
