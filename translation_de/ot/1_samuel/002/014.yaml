base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: de
  text: Er stieß die Gabel in das Becken, den Topf, den Kessel oder die Kochpfanne[a]. Alles, was die Gabel heraufbrachte, nahm der Priester damit heraus. So verfuhren sie mit allen Israeliten, die dorthin nach Schilo kamen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Unterscheidung der vier hebräischen Bezeichnungen für Kochgefäße ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכָּה
  choice: Dann stieß er die Gabel hinein
  rationale: Das Hifil von נכה bezeichnet hier das Hineinstoßen des in Vers 13 genannten Geräts; der erzählerische Zusammenhang beschreibt eine wiederholte Praxis.
- source_word: בַכִּיּוֹר א֣וֹ בַדּוּד א֤וֹ בַקַּלַּחַת֙ א֣וֹ בַפָּרוּר
  choice: in das Becken, den Topf, den Kessel oder die Kochpfanne
  rationale: Die Reihe unterschiedlicher Gefäßbezeichnungen wird bewahrt, ohne bei den teils unsicheren Einzelbedeutungen eine übermäßige Präzision vorzutäuschen.
- source_word: הַמַּזְלֵג
  choice: die Gabel
  rationale: Das Wort bezeichnet hier ein Gerät zum Herausheben von Fleisch; Vers 13 bestimmt es genauer als dreizinkig. „Gabel“ ist im modernen Deutschen verständlich und sachgerecht.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: Alles, was die Gabel heraufbrachte
  rationale: 'Die Formulierung folgt dem Bild des Hebräischen: Was vom Gerät erfasst wurde, kam aus dem Kochgefäß herauf.'
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: nahm der Priester damit heraus
  rationale: בּוֹ wird instrumental auf die Gabel bezogen; „heraus“ verdeutlicht im Deutschen den durch den Kontext gegebenen Vorgang.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: mit allen Israeliten, die dorthin nach Schilo kamen
  rationale: Der kollektive Ausdruck „ganz Israel“ bezeichnet hier die einzelnen israelitischen Opfernden. Die Wiedergabe mit „allen Israeliten“ ist natürlich und erhält den umfassenden Sinn.
theological_decisions:
- issue: Numeruswechsel zwischen Einzelhandlung und Zusammenfassung
  choice: Singular „der Priester“ in der Handlung, Plural „sie“ in der Zusammenfassung
  alternative: Beide Aussagen an den Singular angleichen
  rationale: Der hebräische Text wechselt ausdrücklich vom Singular יִקַּח zum Plural יַעֲשׂוּ. Dieser Wechsel wird erhalten und nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Der Numeruswechsel des Hebräischen bleibt erhalten; die Gefäßreihe wird verständlich, aber angesichts lexikalischer Unsicherheit zurückhaltend wiedergegeben.
