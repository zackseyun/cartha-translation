  naturalness: Die Revision bildet die hebräische Frage als eine zusammenhängende Frage ab, bleibt trotz des absichtlichen Numeruswechsels verständlich und verwendet eine natürliche, würdige moderne Standardsprache. »Jeder Opfergabe Israels, meines Volkes« spiegelt die Apposition לְעַמִּי klarer als »meines Volkes Israel«.
  terminology: »Schlachtopfer« und »Speiseopfer« sind als kultische Begriffe angemessen. »Wohnstätte« wahrt die schwierige, wahrscheinlich auf das Heiligtum bezogene Bedeutung von מָעוֹן. »Beste Anteile« ist als kontextuelle Deutung von מֵרֵאשִׁית vertretbar, sofern die Fußnote die mögliche Bedeutung »erste Anteile« beibehält.
