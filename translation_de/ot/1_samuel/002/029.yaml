base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: de
  text: Warum tretet ihr mein Schlachtopfer und mein Speiseopfer mit Füßen[a], die ich für die Wohnstätte angeordnet habe[b], und du ehrst deine Söhne mehr als mich, indem ihr euch von den besten Anteilen[c] jeder Opfergabe Israels, meines Volkes, mästet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Warum tretet ihr gegen mein Schlachtopfer und mein Speiseopfer?“ Gemeint ist eine verächtliche Behandlung dessen, was Gott angeordnet hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch knapp und schwierig: „die ich für/in der Wohnstätte angeordnet habe“. Mit der „Wohnstätte“ ist wahrscheinlich das Heiligtum gemeint.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „indem ihr euch von den ersten Anteilen jeder Opfergabe Israels, meines Volkes, mästet“. Das hebräische Wort kann die ersten und damit auch die besten Anteile bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: tretet ihr nach
  rationale: Die Wendung bewahrt das anschauliche Bild des hebräischen Verbs und bringt zugleich die verächtliche Behandlung der Opfer zum Ausdruck.
- source_word: זִבְחִי
  choice: meinem Schlachtopfer
  rationale: „Schlachtopfer“ gibt den kultischen und vom Schlachten geprägten Sinn von זֶבַח präzise wieder.
- source_word: מִנְחָתִי / כָּל מִנְחַת יִשְׂרָאֵל
  choice: meinem Speiseopfer / aller Opfergaben … Israels
  rationale: Im ersten Paar ist „Speiseopfer“ als kultischer Fachausdruck passend; im Schluss kann מִנְחָה weiter gefasst sein, weshalb „Opfergaben“ den Zusammenhang der allgemeinen Missbräuche besser wiedergibt.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: die ich für die Wohnstätte angeordnet habe
  rationale: מָעוֹן bezeichnet wahrscheinlich die Wohnstätte beziehungsweise das Heiligtum. „Für“ wahrt die knappe, schwierige Fügung, ohne ein im Hebräischen nicht ausdrücklich vorhandenes Possessivpronomen einzutragen.
- source_word: וַתְּכַבֵּד … מִמֶּנִּי
  choice: ehrst du … mehr als mich
  rationale: Die komparative Gegenüberstellung ist im Deutschen natürlich und deutlich wiedergegeben.
- source_word: לְהַבְרִיאֲכֶם
  choice: indem ihr euch … mästet
  rationale: „Mästet“ erhält die körperliche und anklagende Bildhaftigkeit des Hifil-Infinitivs.
- source_word: מֵרֵאשִׁית
  choice: an den besten Teilen
  rationale: Im Opferkontext meint רֵאשִׁית wahrscheinlich die erstklassigen beziehungsweise bevorzugten Anteile; die wörtlichere Möglichkeit „ersten Teile“ bleibt in der Fußnote erhalten.
- source_word: לְעַמִּי
  choice: meines Volkes Israel
  rationale: Die Zugehörigkeit Israels zu Gott wird natürlich ausgedrückt; syntaktisch ist „mein Volk“ eine nähere Bestimmung zu Israel.
theological_decisions:
- issue: Wechsel vom Plural zum Singular in der Anklage
  choice: „tretet ihr“ und „indem ihr euch … mästet“, aber „ehrst du deine Söhne“
  alternative: Den ganzen Vers einheitlich an Eli im Singular oder an das Priesterhaus im Plural richten
  rationale: 'Der hebräische Numeruswechsel wird bewahrt: Die Anklage umfasst zunächst mehrere Personen und richtet sich dann persönlich auf Eli, bevor sie erneut die gemeinsame Bereicherung bezeichnet.'
- issue: Bedeutung von מָעוֹן
  choice: Wohnstätte als Bezeichnung des Heiligtums
  alternative: „in der Wohnstätte“ oder eine textkritisch geglättete Verbindung mit dem Folgenden
  rationale: Der überlieferte Text wird ohne Konjektur übersetzt; seine ungewöhnliche Kürze und die mögliche Präpositionsnuance werden in einer Fußnote kenntlich gemacht.
- issue: Art der Schuld Elis
  choice: Eli ehrt seine Söhne mehr als Gott und ist in die Bereicherung an den Opfergaben einbezogen
  alternative: Die Aussage ausschließlich auf die eigenhändigen Taten seiner Söhne beziehen
  rationale: Der Singular stellt Eli persönlich zur Rede, während der Plural seine Familie beziehungsweise das Priesterhaus in die Verachtung und Nutznießung einbezieht; weitergehende dogmatische Folgerungen werden nicht eingetragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die zwei deutschen Fragesätze machen den hebräischen Wechsel vom Plural zum Singular verständlich, ohne ihn einzuebnen. Kultische Begriffe bleiben präzise; die ungewöhnliche Wendung zur Wohnstätte und die Bedeutungsbreite von רֵאשִׁית werden offengelegt.
