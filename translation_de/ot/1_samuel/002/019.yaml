base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: de
  text: Seine Mutter fertigte ihm ein kleines Obergewand[a] an und brachte es ihm Jahr für Jahr[b] hinauf, wenn sie mit ihrem Mann hinaufging, um das jährliche Opfer darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen kleinen Mantel“ oder „ein kleines Gewand“. Das hebräische Wort bezeichnet ein Obergewand; seine genaue Form bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von Tagen zu Tagen“; eine hebräische Wendung für „Jahr für Jahr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: Obergewand
  rationale: מְעִיל bezeichnet ein über anderen Kleidern getragenes Gewand. „Obergewand“ ist im modernen Deutschen verständlich und lässt die genaue Form offen.
- source_word: קָטֹן
  choice: kleines
  rationale: Das Adjektiv beschreibt das für das Kind bestimmte Gewand als klein.
- source_word: תַּעֲשֶׂה
  choice: fertigte … an
  rationale: Der Imperfekt bezeichnet hier eine regelmäßig wiederholte Handlung in der Vergangenheit; zusammen mit „jedes Jahr“ gibt das Präteritum diese Gewohnheit natürlich wieder.
- source_word: וְהַעַלְתָה לּוֹ
  choice: und brachte es ihm hinauf
  rationale: Die Form bewahrt die Aufwärtsbewegung zum Heiligtum und bezeichnet zugleich das Bringen zu Samuel.
- source_word: מִיָּמִים יָמִימָה
  choice: jedes Jahr
  rationale: Die wörtlich auf „Tage“ bezogene hebräische Wendung bezeichnet ein jährlich wiederkehrendes Geschehen.
- source_word: בַּעֲלוֹתָהּ
  choice: wenn sie … hinaufzog
  rationale: Die temporale Konstruktion bezeichnet den Zeitpunkt ihrer wiederkehrenden Wallfahrt und bewahrt die Aufstiegssprache.
- source_word: אִישָׁהּ
  choice: ihrem Mann
  rationale: אִישׁ mit dem Possessivsuffix bezeichnet in diesem Beziehungskontext ihren Ehemann.
- source_word: לִזְבֹּחַ
  choice: um … darzubringen
  rationale: Im kultischen Zusammenhang gibt „darbringen“ den Zweck des Hinaufziehens idiomatisch wieder.
- source_word: זֶבַח הַיָּמִים
  choice: das jährliche Opfer
  rationale: Die Wendung meint das regelmäßig einmal im Jahr dargebrachte Opfer.
