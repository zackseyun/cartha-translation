  text: יְהוָ֖ה מֵמִ֣ית וּ/מְחַיֶּ֑ה מוֹרִ֥יד שְׁא֖וֹל וַ/יָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: de
  text: Jahwe tötet und macht lebendig; er führt ins Totenreich hinab[a] und führt herauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch Scheol: das Reich beziehungsweise der Aufenthaltsort der Toten; nicht ohne Weiteres mit »Hölle« gleichzusetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: מֵמִית
  choice: tötet
  rationale: Die Hifil-Form von מות bezeichnet hier das Verursachen des Todes. »Tötet« ist im Deutschen direkt, natürlich und wahrt die göttliche Handlungsmacht.
- source_word: וּמְחַיֶּה
  choice: und macht lebendig
  rationale: Die Form von חיה steht parallel zu »tötet« und wird kausativ wiedergegeben. »Macht lebendig« bleibt weiter gefasst als eine ausdrückliche Aussage über leibliche Auferstehung.
- source_word: מוֹרִיד
  choice: er führt ... hinab
  rationale: Die Hifil-Form von ירד ist kausativ. »Führt hinab« bewahrt diese Bedeutung und bildet mit »führt ... herauf« ein natürliches poetisches Gegensatzpaar.
- source_word: שְׁאוֹל
  choice: ins Totenreich
  rationale: »Totenreich« bezeichnet den Bereich der Toten, ohne den hebräischen Begriff vorschnell mit »Hölle« gleichzusetzen. Es ist für heutige deutschsprachige Leser verständlicher als eine bloße Transliteration.
- source_word: וַיָּעַל
  choice: und führt wieder herauf
  rationale: Die kausative Form von עלה entspricht dem vorhergehenden »führt hinab«. »Wieder« macht im Deutschen die Gegenbewegung idiomatisch deutlich, ohne sie ausdrücklich als leibliche Auferstehung festzulegen.
theological_decisions:
- issue: Ob der Vers ausdrücklich mit Auferstehungssprache wiederzugeben ist
  choice: Die weitere Formulierung »macht lebendig« und »führt wieder herauf«
  alternative: »erweckt von den Toten« oder eine andere ausdrückliche Aussage über leibliche Auferstehung
  rationale: Der Vers bezeugt Jahwes Macht über Tod und Totenreich, doch die hebräische poetische Sprache ist weiter gefasst. Eine ausdrückliche Auferstehungsformulierung würde die Aussage stärker festlegen, als es der Wortlaut verlangt.
translation_notes:
  register: Moderne, würdevolle und gut verständliche Standardsprache. Die knappe Parallelstruktur des hebräischen Gedichts wird bewahrt; »Jahwe« gibt den persönlichen Gottesnamen wieder.
