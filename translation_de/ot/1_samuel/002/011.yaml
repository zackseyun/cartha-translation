  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: de
  text: Dann ging Elkana nach Rama in sein Haus. Der Junge aber diente Jahwe vor dem Priester Eli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dem Angesicht des Priesters Eli“; auch möglich: „in der Gegenwart des Priesters Eli“. Die Wendung kann im Zusammenhang einen Dienst unter Elis Aufsicht nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Die Erzählform von הלך führt die Handlung mit „ging“ weiter. Eine Rückkehr ist aus dem Zusammenhang denkbar, wird vom Verb selbst aber nicht ausdrücklich bezeichnet.
- source_word: הָרָמָתָה
  choice: nach Rama
  rationale: Das Richtungs-He bezeichnet die Bewegung nach Rama; im Deutschen ist „nach Rama“ die natürliche Wiedergabe.
- source_word: עַל בֵּיתוֹ
  choice: zu seinem Haus
  rationale: עַל bezeichnet hier idiomatisch das Ziel der Bewegung, Elkanas eigenes Haus beziehungsweise Zuhause. „Auf sein Haus“ wäre im Deutschen irreführend.
- source_word: וְהַנַּעַר
  choice: Der Junge aber
  rationale: נַעַר kann einen Jungen oder jungen Mann bezeichnen. Im Erzählzusammenhang ist Samuel noch ein Junge. „Aber“ macht den im Hebräischen durch וְ angezeigten Szenenwechsel natürlich deutlich, ohne einen starken Gegensatz einzutragen.
- source_word: הָיָה מְשָׁרֵת
  choice: diente
  rationale: Die Verbindung aus היה und Partizip beschreibt einen andauernden Dienst. Das deutsche Präteritum „diente“ gibt dies im fortlaufenden Erzählstil natürlich wieder; „war dienend“ wäre unidiomatisch.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: Bei שׁרת bezeichnet אֶת denjenigen, dem gedient wird. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: vor dem Priester Eli
  rationale: Die Wendung mit פְּנֵי bezeichnet Elis Gegenwart beziehungsweise Aufsicht. „Vor dem Priester Eli“ bleibt nah an der räumlich-relationalen Ausdrucksweise und legt die genaue Beziehung nicht unnötig fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Samuels Dienst zu Eli
  choice: vor dem Priester Eli
  alternative: unter der Aufsicht des Priesters Eli
  rationale: Der Ausdruck אֶת־פְּנֵי kann Gegenwart und möglicherweise Aufsicht anzeigen. Die Hauptfassung bewahrt diese Offenheit; die stärker hierarchische Deutung wird nicht in den Text eingetragen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Zwei kurze Sätze bilden den Ortswechsel Elkanas und den fortdauernden Dienst Samuels klar ab. Der Name Jahwe bleibt sichtbar; die mehrdeutige Beziehung zu Eli wird weder rein räumlich noch ausschließlich hierarchisch festgelegt.
