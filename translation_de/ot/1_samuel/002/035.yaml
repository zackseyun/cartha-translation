  to: Und ich werde mir einen treuen Priester einsetzen, der tun wird, was in meinem Herzen und in meiner Seele ist. Ich werde ihm ein beständiges Haus[a] bauen, und er wird alle Tage vor meinem Gesalbten[b] wandeln.
