  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: de
  text: Und ich werde mir einen treuen Priester einsetzen, der tun wird, was in meinem Herzen und in meiner Seele ist. Ich werde ihm ein beständiges Haus[a] bauen, und er wird alle Tage vor meinem Gesalbten[b] wandeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit „Haus“ ist hier wahrscheinlich eine dauerhaft bestehende Familie beziehungsweise priesterliche Linie gemeint. Wörtlich: „ein treues Haus“.'
    reason: lexical_alternative
  - marker: b
    text: „Mein Gesalbter“ kann auch mit „mein Messias“ oder im Zusammenhang mit „mein König“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי
  choice: ich werde … einsetzen
  rationale: Das Hifil von קום bezeichnet hier, dass Gott jemanden in ein Amt einsetzt. „Einsetzen“ ist im Deutschen natürlicher als „erwecken“ und macht den Amtsbezug deutlich, ohne die Art der Einsetzung näher festzulegen.
- source_word: לִי
  choice: mir
  rationale: Der Dativ mit Suffix bezeichnet Gottes eigene Verfügung und Zugehörigkeit. Das knappe „mir“ gibt dies idiomatisch wieder.
- source_word: כֹּהֵן נֶאֱמָן
  choice: einen treuen Priester
  rationale: „Priester“ ist die reguläre Amtsbezeichnung; „treu“ bewahrt bei נֶאֱמָן sowohl Verlässlichkeit als auch die sittliche und auftragsbezogene Treue.
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה
  choice: der tun wird, was in meinem Herzen und in meiner Seele ist
  rationale: Die Formulierung erhält die beiden anthropomorphen Ausdrücke „Herz“ und „Seele“ sowie die bewusst umfassende Aussage über Gottes Willen und Verlangen.
- source_word: וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן
  choice: Ich werde ihm ein beständiges Haus bauen
  rationale: „Bauen“ erhält das Bild des hebräischen Verbs. Bei einem „Haus“ im Sinn einer Familie oder Amtslinie bezeichnet נֶאֱמָן hier vor allem deren gesicherten Fortbestand; „beständig“ ist im Deutschen verständlicher als das missverständliche „treues Haus“.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: er wird … vor … einhergehen
  rationale: Das Hitpael beschreibt fortgesetztes Gehen beziehungsweise Wirken. „Einhergehen vor“ bewahrt das hebräische Bild und lässt offen, ob besonders Lebensführung, Gegenwart oder Dienst gemeint ist.
- source_word: מְשִׁיחִי
  choice: meinem Gesalbten
  rationale: Die substantivierte Form bezeichnet den von Gott Gesalbten. „Mein Gesalbter“ bewahrt den Titel, ohne ihn im Haupttext vorschnell ausschließlich messianisch oder königlich festzulegen.
- source_word: כָּל הַיָּמִים
  choice: alle Tage
  rationale: Die Wendung wird bewusst nah am Hebräischen wiedergegeben und bezeichnet ununterbrochene Dauer.
theological_decisions:
- issue: Bezug von „meinem Gesalbten“
  choice: meinem Gesalbten
  alternative: meinem Messias; meinem König
  rationale: Im unmittelbaren geschichtlichen Zusammenhang kann מָשִׁיחַ den von Gott gesalbten Herrscher bezeichnen; zugleich besitzt das Wort eine mögliche weiterführende messianische Dimension. Der Haupttext hält diese Spannung offen.
- issue: Bedeutung von „Haus“
  choice: beständiges Haus mit erläuternder Fußnote
  alternative: treues Haus; dauerhaftes Geschlecht
  rationale: „Haus“ kann ein Hauswesen, eine Familie oder eine fortbestehende Amtslinie bezeichnen. Das Bild bleibt im Haupttext stehen, während die Fußnote die gemeinte soziale und dynastische Dimension erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder „Herz und Seele“, „Haus bauen“ und „vor jemandem einhergehen“ bleiben erhalten; erklärungsbedürftige Mehrdeutigkeiten werden in den Fußnoten offengelegt. Die Fußnotenmarker stehen jeweils bei der tatsächlich erläuterten Wendung.
