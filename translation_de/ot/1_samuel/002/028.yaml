  verdict: revise
  source_fidelity: 'Die rhetorische Frage und die Abfolge der priesterlichen Aufgaben sind zutreffend wiedergegeben. Bei לַעֲלוֹת עַל־מִזְבְּחִי sollte die Präposition עַל jedoch auch im Deutschen sichtbar bleiben: Der Priester steigt nach dem hebräischen Wortlaut „auf meinen Altar“ hinauf, nicht lediglich „zu meinem Altar“.'
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Standarddeutsch. Eine einheitliche Infinitivkonstruktion nach „erwählt“ ist syntaktisch flüssiger und bildet die hebräische Reihe von Zweckinfinitiven enger ab als der Wechsel zu finiten Verben nach „damit“.
  terminology: „Efod“ ist als etablierter kultischer Fachbegriff angemessen. „Feueropfer“ gibt אִשֵּׁי brauchbar und ohne Verengung auf Brandopfer wieder. Die Fußnote sollte mit „Opfergaben“ statt des allgemeineren „Gaben“ den kultischen Bezug ausdrücklich erhalten.
  issues:
  - severity: low
    issue: Die Ortspräposition bei לַעֲלוֹת עַל־מִזְבְּחִי ist abgeschwächt.
    rationale: „Zu meinem Altar hinaufsteigt“ gibt die Aufwärtsbewegung wieder, lässt aber עַל („auf“) aus. „Auf meinen Altar hinaufzusteigen“ bewahrt den Wortlaut, ohne die kultische Handlung weiter zu deuten.
  - severity: low
    issue: Die Satzkonstruktion wechselt unnötig von der Zweckkonstruktion zu finiten Verben.
    rationale: Die hebräischen Infinitive beschreiben parallel die Funktionen, zu denen die Erwählung erfolgte. Die deutsche Infinitivreihe macht diese Parallelität klarer und liest sich natürlich.
  - severity: low
    issue: Die Fußnote verwendet „Gaben“ ohne ausdrücklichen Opferbezug.
    rationale: Da אִשֵּׁי ein kultischer Opferterminus ist, verdeutlicht „Opfergaben“ den Bezug genauer, ohne eine bestimmte Opferart festzulegen.
  revised_text: Habe ich ihn nicht aus allen Stämmen Israels erwählt, um mir als Priester zu dienen, auf meinen Altar hinaufzusteigen, Räucherwerk zu verbrennen und vor mir das Efod zu tragen? Und ich gab dem Haus deines Vaters alle Feueropfer[a] der Israeliten.
  revised_footnotes:
