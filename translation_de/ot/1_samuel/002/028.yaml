- from: Habe ich ihn nicht aus allen Stämmen Israels erwählt, damit er mir als Priester dient, zu meinem Altar hinaufsteigt, Räucherwerk verbrennt und vor mir das Efod trägt? Und ich gab dem Haus deines Vaters alle Feueropfer[a] der Israeliten.
  to: Habe ich ihn nicht aus allen Stämmen Israels erwählt, um mir als Priester zu dienen, auf meinen Altar hinaufzusteigen, Räucherwerk zu verbrennen und vor mir das Efod zu tragen? Und ich gab dem Haus deines Vaters alle Feueropfer[a] der Israeliten.
  rationale: Die Revision stellt die präpositionale Aussage „auf meinen Altar“ wieder her, vereinheitlicht die Reihe der Zweckbestimmungen und präzisiert die Fußnote terminologisch. Sie bewahrt die offene Wiedergabe von נשא als „trägt“, die nationale Bezeichnung „Israeliten“ sowie den weiten Bedeutungsumfang von אִשֵּׁי.
