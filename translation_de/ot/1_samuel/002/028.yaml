source:
  edition: WLC
  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: de
  text: Habe ich ihn nicht aus allen Stämmen Israels erwählt, um mir als Priester zu dienen, auf meinen Altar hinaufzusteigen, Räucherwerk zu verbrennen und vor mir das Efod zu tragen? Und ich gab dem Haus deines Vaters alle Feueropfer[a] der Israeliten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: alle durch Feuer dargebrachten Opfergaben der Israeliten.'
    reason: Der hebräische kultische Ausdruck אִשֵּׁי umfasst Feuergaben allgemein und ist nicht auf eine einzelne Opferart beschränkt.
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: Habe ich ihn nicht … erwählt
  rationale: Die Konstruktion setzt die rhetorische Frage des vorangehenden Zusammenhangs fort. Im Deutschen gibt eine ausdrücklich formulierte Frage ihren Sinn natürlicher wieder als ein isolierter Infinitiv.
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: aus allen Stämmen Israels
  rationale: 'Bewahrt den partitiv-selektiven Sinn: Er wurde aus der Gesamtheit der Stämme ausgewählt.'
- source_word: לִי לְכֹהֵן
  choice: damit er mir als Priester dient
  rationale: Gibt sowohl die Zweckangabe als auch die auf Gott bezogene priesterliche Funktion idiomatisch wieder.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: zu meinem Altar hinaufsteigt
  rationale: Bewahrt die konkrete räumlich-kultische Bedeutung von עלה, ohne sie vorschnell als Darbringen eines Opfers auszulegen.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: Räucherwerk verbrennt
  rationale: Klare moderne Wiedergabe der kultischen Handlung; קְטֹרֶת bezeichnet hier Räucherwerk beziehungsweise Weihrauch.
- source_word: לָשֵׂאת אֵפוֹד לְפָנַי
  choice: vor mir das Efod trägt
  rationale: נשא bedeutet tragen; im priesterlichen Zusammenhang kann dabei auch das Tragen am Körper gemeint sein. Die Formulierung erhält diese leichte Offenheit.
- source_word: לְבֵית אָבִיךָ
  choice: dem Haus deines Vaters
  rationale: Bewahrt die biblische Bezeichnung für Elis väterliche beziehungsweise angestammte Priesterdynastie.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: alle Feueropfer der Israeliten
  rationale: אִשֵּׁי ist ein weiter kultischer Ausdruck für Feuergaben und darf nicht auf Ganzbrandopfer verengt werden. „der Israeliten“ gibt die feste Volksbezeichnung natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von אִשֵּׁי
  choice: Feueropfer
  alternative: alle durch Feuer dargebrachten Gaben
  rationale: Der Ausdruck bezeichnet Opfergaben, die auf dem Altar dem Feuer übergeben werden, nicht ausschließlich Brandopfer. Die Fußnote erläutert den wörtlicheren Sinn, ohne die Opferart dogmatisch zu verengen.
- issue: Funktion des Efods
  choice: das Efod trägt
  alternative: das Efod anlegt / bekleidet ist
  rationale: Das hebräische נשא erlaubt die konkrete Bedeutung „tragen“, während der priesterliche Kontext das Tragen als Kleidungsstück nahelegt. Die Hauptfassung bewahrt beide Aspekte, statt sich unnötig festzulegen.
- issue: בְּנֵי יִשְׂרָאֵל als nationale Bezeichnung
  choice: Israeliten
  alternative: Söhne Israels
  rationale: In dieser festen ethnischen Wendung bezeichnet der maskuline Plural das Bundesvolk insgesamt. „Israeliten“ ist im modernen Deutschen präzise und natürlich, ohne den Personenkreis einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Fachbegriffe bleiben erkennbar; „Efod“ wird als etablierte biblische Bezeichnung beibehalten. Die Satzstruktur folgt der rhetorischen Frage, bleibt aber für heutige Leser flüssig.
