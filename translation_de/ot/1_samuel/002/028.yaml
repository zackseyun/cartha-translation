    reason: Der hebräische kultische Ausdruck אִשֵּׁי umfasst Feuergaben allgemein und ist nicht auf eine einzelne Opferart beschränkt.
  revision_rationale: Die Revision stellt die präpositionale Aussage „auf meinen Altar“ wieder her, vereinheitlicht die Reihe der Zweckbestimmungen und präzisiert die Fußnote terminologisch. Sie bewahrt die offene Wiedergabe von נשא als „trägt“, die nationale Bezeichnung „Israeliten“ sowie den weiten Bedeutungsumfang von אִשֵּׁי.
