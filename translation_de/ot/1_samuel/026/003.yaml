source:
  edition: WLC
  text: וַ/יִּ֨חַן שָׁא֜וּל בְּ/גִבְעַ֣ת הַ/חֲכִילָ֗ה אֲשֶׁ֛ר עַל פְּנֵ֥י הַ/יְשִׁימֹ֖ן עַל הַ/דָּ֑רֶךְ וְ/דָוִד֙ יֹשֵׁ֣ב בַּ/מִּדְבָּ֔ר וַ/יַּ֕רְא כִּ֣י בָ֥א שָׁא֛וּל אַחֲרָ֖י/ו הַ/מִּדְבָּֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: de
  text: Saul lagerte auf dem Hügel von Hachila[a], der gegenüber von Jeschimon an der Straße liegt. David aber hielt sich in der Wüste auf und sah, dass Saul hinter ihm her in die Wüste gekommen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jeschimon“ kann auch allgemein „Ödland“ oder „Wüste“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: lagerte
  rationale: חנה bezeichnet hier das Aufschlagen eines Lagers; „lagerte“ ist im militärischen Erzählkontext natürlich und prägnant.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: auf dem Hügel von Hachila
  rationale: גִּבְעָה wird als „Hügel“ übersetzt, während חֲכִילָה als Ortsname transliteriert wird; „auf“ entspricht der topografischen Lage.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: der gegenüber von Jeschimon … liegt
  rationale: עַל־פְּנֵי kann eine Lage gegenüber bzw. mit Blick auf etwas bezeichnen. הַיְשִׁימֹן wird im Haupttext als geografische Bezeichnung verstanden, ohne die mögliche Gattungsbedeutung zu verschweigen.
- source_word: עַל הַדָּרֶךְ
  choice: an der Straße
  rationale: Die Präposition עַל bezeichnet hier plausibel die Lage an oder bei der Straße, nicht zwingend unmittelbar auf der Fahrbahn.
- source_word: יֹשֵׁב
  choice: hielt sich … auf
  rationale: Das Partizip von ישב beschreibt einen andauernden Aufenthalt; die deutsche Wendung ist idiomatisch und wahrt den durativen Sinn.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Wildnisgebiet; „Wüste“ ist hier verständlich und geografisch passend.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: und sah, dass Saul hinter ihm her … gekommen war
  rationale: Die Formulierung bewahrt das Wahrnehmungsverb ראה, das Bewegungsverb בוא und den Verfolgungssinn von אַחֲרָיו, ohne diesen durch einen technischeren Ausdruck zu verstärken.
- source_word: הַמִּדְבָּרָה
  choice: in die Wüste
  rationale: Das direktionale ה zeigt eine Bewegung zur beziehungsweise in die Wüste an; „in die“ gibt diese Richtung natürlich wieder.
theological_decisions: []
