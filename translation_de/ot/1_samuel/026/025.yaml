  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד בָּר֤וּךְ אַתָּה֙ בְּנִ֣/י דָוִ֔ד גַּ֚ם עָשֹׂ֣ה תַעֲשֶׂ֔ה וְ/גַ֖ם יָכֹ֣ל תּוּכָ֑ל וַ/יֵּ֤לֶךְ דָּוִד֙ לְ/דַרְכּ֔/וֹ וְ/שָׁא֖וּל שָׁ֥ב לִ/מְקוֹמֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: de
  text: 'Da sagte Saul zu David: „Gesegnet bist du, mein Sohn David! Du wirst gewiss handeln und wirst gewiss Erfolg haben.“ Dann zog David seines Weges, und Saul kehrte an seinen Ort zurück.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: Gesegnet bist du
  rationale: Die passive partizipiale Segensformel wird als Aussage wiedergegeben, nicht als bloßer Wunsch.
- source_word: בְּנִי דָוִד
  choice: mein Sohn David
  rationale: Bewahrt Sauls familiäre beziehungsweise patronale Anrede und die unmittelbare Apposition des Namens.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: Du wirst gewiss handeln
  rationale: Die Verbindung aus Infinitivus absolutus und Imperfekt verstärkt die Gewissheit. „Handeln“ bleibt näher am nicht näher bestimmten עשה, ohne „große Taten“ in den Text einzutragen.
- source_word: וְגַם יָכֹל תּוּכָל
  choice: und wirst gewiss Erfolg haben
  rationale: Die zweite emphatische Konstruktion bezeichnet wörtlich ein sicheres Können; im Zusammenhang ist erfolgreiches Durchsetzen gemeint. Die Formulierung bleibt natürlicher als „du wirst gewiss können“.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: Dann zog David seines Weges
  rationale: Gibt die hebräische Wendung für das Fortgehen knapp, idiomatisch und würdevoll wieder.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: und Saul kehrte an seinen Ort zurück
  rationale: Bewahrt die unbestimmte Ortsangabe; der Text sagt nicht ausdrücklich, dass Saul nach Hause zurückkehrte.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die doppelte verbale Verstärkung wird mit zweimaligem „gewiss“ hörbar gemacht. Die genuine Unbestimmtheit von עשה bleibt erhalten; die ergänzende Deutung „große Taten vollbringen“ wurde vermieden.
