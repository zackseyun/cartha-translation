  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל אַבְנֵ֜ר הֲ/לוֹא אִ֣ישׁ אַתָּ֗ה וּ/מִ֤י כָמ֨וֹ/ךָ֙ בְּ/יִשְׂרָאֵ֔ל וְ/לָ֨/מָּה֙ לֹ֣א שָׁמַ֔רְתָּ אֶל אֲדֹנֶ֖י/ךָ הַ/מֶּ֑לֶךְ כִּי בָא֙ אַחַ֣ד הָ/עָ֔ם לְ/הַשְׁחִ֖ית אֶת הַ/מֶּ֥לֶךְ אֲדֹנֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: de
  text: 'David sagte zu Abner: „Bist du nicht ein Mann? Und wer ist wie du in Israel?[a] Warum hast du dann nicht über deinen Herrn, den König, gewacht? Denn einer aus dem Volk[b] kam, um den König, deinen Herrn, zu vernichten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und wer ist dir gleich in Israel?“'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist eine einzelne Person aus dem Lager.
    reason: lexical_clarification
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: Bist du nicht ein Mann?
  rationale: Die rhetorische Frage wird ohne ergänzendes Adjektiv wiedergegeben. So bleibt Davids beschämender Unterton erhalten, ohne אִישׁ als „tapferer Mann“ überzuinterpretieren.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: Und wer ist wie du in Israel?
  rationale: Die Form des hebräischen Vergleichs wird bewahrt; zugleich ist die Frage im Deutschen verständlich und drückt Abners herausragende Stellung aus.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: Warum hast du dann nicht über … gewacht?
  rationale: שׁמר bezeichnet hier schützende Wachsamkeit. „Über jemanden wachen“ ist im militärischen Zusammenhang natürliches Deutsch; „dann“ gibt den folgernden Zusammenhang wieder.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: deinen Herrn, den König
  rationale: „Herr“ wahrt das Rangverhältnis zwischen Abner und Saul; die Apposition „den König“ macht die Identität klar und erhält die doppelte Bezeichnung.
- source_word: כִּי בָא אַחַד הָעָם
  choice: Denn einer aus dem Volk kam
  rationale: Die wörtliche Gruppenbezeichnung bleibt erhalten, ohne den Betreffenden unbelegt als Soldaten oder Mann zu bestimmen.
- source_word: לְהַשְׁחִית
  choice: um … zu vernichten
  rationale: Der Hifil von שׁחת bedeutet „vernichten, zugrunde richten“. Im Kontext schließt dies die beabsichtigte Tötung des Königs ein, ohne die breitere Wortbedeutung zu verengen.
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: den König, deinen Herrn
  rationale: Die gegenüber der ersten Nennung umgekehrte hebräische Reihenfolge und die nachdrückliche Wiederholung werden im Deutschen beibehalten.
