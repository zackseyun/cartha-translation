  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: de
  text: Bei Jahwe![a] Das sei mir fern, meine Hand gegen Jahwes Gesalbten[b] auszustrecken! Nun aber nimm bitte den Speer bei seinem Kopf und den Wasserkrug, und lass uns gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung drückt eine nachdrückliche, feierliche Zurückweisung aus. Der anschließende Ausdruck kann wörtlicher auch mit „von Jahwe her“ wiedergegeben werden; „bei Jahwe“ gibt seine mögliche schwurähnliche Kraft wieder.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Saul als der von Jahwe zum König Gesalbte. Das hebräische Wort ist mit „Messias“ verwandt, bezeichnet hier aber den gesalbten König.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Das sei mir fern
  rationale: Die feste hebräische Wendung drückt entschiedene Zurückweisung und Abscheu aus. Die deutsche Formulierung bewahrt ihre feierliche Kraft, ohne das stärker deutende „Gott bewahre“ einzutragen.
- source_word: מֵיְהוָה
  choice: bei Jahwe
  rationale: In Verbindung mit חָלִילָה kann die Präposition einen feierlichen, schwurähnlichen Anruf markieren. „Bei Jahwe“ gibt diese Kraft knapp und idiomatisch wieder; die grammatisch mögliche Lesart „von Jahwe her“ wird in der Fußnote offengehalten.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: Hand … zu legen
  rationale: Das hebräische Bild bezeichnet ein feindliches Vorgehen oder einen Angriff. „Hand an jemanden legen“ ist im Deutschen ein natürliches, bildnahes Idiom.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: an Jahwes Gesalbten
  rationale: מָשִׁיחַ bezeichnet hier Saul als den von Jahwe zum König Gesalbten. „Gesalbter“ bewahrt die Wortbedeutung und die Verbindung zum späteren Titel „Messias“, ohne Saul hier als den Messias zu bezeichnen.
- source_word: קַח נָא
  choice: nimm bitte
  rationale: נָא mildert beziehungsweise unterstreicht die Aufforderung; „bitte“ entspricht dem in natürlichem modernem Deutsch.
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  choice: den Speer bei seinem Kopf
  rationale: Die Wendung lokalisiert den Speer am Kopfende des schlafenden Saul. Die knappe Formulierung vermeidet, über den Text hinaus eine genaue Stellung des Speers festzulegen.
- source_word: צַפַּחַת הַמַּיִם
  choice: den Wasserkrug
  rationale: צַפַּחַת bezeichnet ein kleines Gefäß beziehungsweise einen Krug. „Wasserkrug“ ist klar, gegenwärtig und dem Gegenstand angemessen.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: und lass uns gehen
  rationale: Der Kohortativ der ersten Person Plural formuliert den gemeinsamen Aufbruch als Aufforderung. Im Gespräch mit Abischai ist „lass uns gehen“ die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen als solchen wieder und folgt der vorgegebenen Projektentscheidung, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מֵיְהוָה innerhalb der Zurückweisungsformel
  choice: bei Jahwe
  alternative: von Jahwe her / vor Jahwe
  rationale: Der Zusammenhang erlaubt eine schwurähnliche Anrufung Jahwes, während die Präposition formal auch anders bezogen werden kann. Die Hauptfassung bildet die wahrscheinlich idiomatische Aussage ab; die Fußnote erhält die sprachliche Mehrdeutigkeit.
- issue: Wiedergabe von מָשִׁיחַ im königlichen Erzählzusammenhang
  choice: Gesalbter
  alternative: Messias
  rationale: Gemeint ist Saul als gesalbter König. „Messias“ könnte im heutigen deutschen Sprachgebrauch fälschlich einen unmittelbaren Bezug auf den endzeitlichen Heilsträger nahelegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem hebräischem Bildgebrauch. Die Parenthese „bei Jahwe“ hält den feierlich-schwurähnlichen Ton fest; die Fußnote macht die syntaktische und semantische Spannung transparent.
