base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: de
  text: 'Da antwortete David und sagte zu Ahimelech, dem Hetiter, und zu Abischai, dem Sohn Zerujas und dem Bruder Joabs: »Wer wird mit mir zu Saul hinuntergehen, zum Lager[a]?« Abischai sagte: »Ich werde mit dir hinuntergehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: »zu Saul ins Lager«. Im Hebräischen steht sowohl vor »Saul« als auch vor »dem Lager« die Präposition »zu«.'
    reason: Die wörtlich bewahrte Wiederholung der Präposition ist im Deutschen ungewöhnlich und lässt sich idiomatischer als Ortsangabe verstehen.
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: Da antwortete David und sagte
  rationale: Die Wiedergabe bewahrt die hebräische Erzählformel mit beiden Verben. Obwohl »antwortete und sagte« im heutigen Deutsch leicht formelhaft klingt, bleibt sie verständlich und wahrt die Struktur des Ausgangstextes.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: Ahimelech, dem Hetiter
  rationale: Der Personenname wird transliteriert, die ethnische Bezeichnung als »Hetiter« wiedergegeben.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abischai, dem Sohn Zerujas und Bruder Joabs
  rationale: Die familiären Angaben werden als Apposition auf Abischai bezogen und in natürlichem, aber eng am Hebräischen orientiertem Deutsch formuliert.
- source_word: מִי יֵרֵד אִתִּי
  choice: Wer wird mit mir … hinuntergehen
  rationale: »Hinuntergehen« erhält die Richtungsangabe von ירד; die Wortstellung ist an natürliches deutsches Satzgefüge angepasst.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: zu Saul …, zum Lager
  rationale: Die zweimalige Präposition אֶל wird mit zweimaligem »zu« sichtbar gehalten. Die idiomatischere räumliche Deutung wird in der Fußnote genannt.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: Ich werde mit dir hinuntergehen
  rationale: Dasselbe Richtungsverb wie in Davids Frage wird beibehalten; das Futur gibt die erklärte Bereitschaft klar wieder.
