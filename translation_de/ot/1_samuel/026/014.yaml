base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: de
  text: 'Da rief David den Truppen und Abner, dem Sohn Ners, zu: »Willst du nicht antworten, Abner?« Abner antwortete: »Wer bist du, der du dem König zurufst?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: den Truppen
  rationale: Das Wort bedeutet grundsätzlich »Volk/Leute«, bezeichnet im militärischen Zusammenhang hier aber Sauls versammelte Männer; »Truppen« gibt den Kontext natürlich und präzise wieder.
- source_word: וַיִּקְרָא ... אֶל
  choice: rief ... zu
  rationale: Die Verbindung bezeichnet hier ein lautes Rufen an eine entfernte Gruppe bzw. Person; deutsches »jemandem zurufen« trifft die Situation.
- source_word: קָרָאתָ אֶל־הַמֶּלֶךְ
  choice: der du dem König zurufst
  rationale: Bewahrt die direkte Anrede und den Bezug des Rufens auf den König, ohne ein zusätzliches Motiv oder eine wertende Nuance einzutragen.
