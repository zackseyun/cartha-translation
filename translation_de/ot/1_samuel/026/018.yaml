source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֛ה אֲדֹנִ֥/י רֹדֵ֖ף אַחֲרֵ֣י עַבְדּ֑/וֹ כִּ֚י מֶ֣ה עָשִׂ֔יתִי וּ/מַה בְּ/יָדִ֖/י רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: de
  text: 'Und er sagte: »Warum verfolgt mein Herr seinen Knecht[a] so? Was habe ich denn getan, und was ist Böses in meiner Hand[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seinen Knecht«. Im Hebräischen steht trotz der direkten Anrede die dritte Person; manche Übersetzungen glätten zu »deinen Knecht«.'
    reason: alternative_reading
  - marker: b
    text: »In meiner Hand« ist eine hebräische Wendung für Schuld, böse Absicht oder die Macht, Schaden anzurichten.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Die Wayyiqtol-Form führt Davids Rede in der üblichen hebräischen Erzählfolge ein.
- source_word: לָמָּה זֶּה
  choice: Warum … so
  rationale: Die Verbindung fragt betont nach dem Grund für dieses Verhalten; »so« gibt זֶה im natürlichen Deutschen wieder.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: David redet Saul respektvoll als menschlichen Höhergestellten an; hier liegt keine Gottesbezeichnung vor.
- source_word: רֹדֵף אַחֲרֵי
  choice: verfolgt
  rationale: Das Partizip mit אַחֲרֵי bezeichnet eine fortdauernde Verfolgung. »Verfolgt« bewahrt den feindseligen Vorgang, ohne ihn weiter auszudeuten.
- source_word: עַבְדּוֹ
  choice: seinen Knecht
  rationale: Der masoretische Text hat ein Suffix der dritten Person Singular, wörtlich »seinen Knecht«. Die respektvolle Selbstbezeichnung wird beibehalten.
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Was habe ich denn getan
  rationale: כִּי leitet hier die begründende, rhetorische Nachfrage ein. Das deutsche Modalwort »denn« gibt diese Funktion idiomatisch wieder.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: und was ist Böses in meiner Hand
  rationale: Die konkrete hebräische Metapher bleibt erhalten; רָעָה wird mit dem inhaltlich starken »Böses« und nicht abgeschwächt wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Anrede und die respektvolle Selbstbezeichnung bleiben erkennbar; die hebräische Metapher »in meiner Hand« wird bewusst nicht aufgelöst.
