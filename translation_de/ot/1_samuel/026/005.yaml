  text: וַ/יָּ֣קָם דָּוִ֗ד וַ/יָּבֹא֮ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר חָנָה שָׁ֣ם שָׁאוּל֒ וַ/יַּ֣רְא דָּוִ֗ד אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר שָֽׁכַב שָׁ֣ם שָׁא֔וּל וְ/אַבְנֵ֥ר בֶּן נֵ֖ר שַׂר צְבָא֑/וֹ וְ/שָׁאוּל֙ שֹׁכֵ֣ב בַּ/מַּעְגָּ֔ל וְ/הָ/עָ֖ם חֹנִ֥ים סביבת/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: de
  text: Da machte David sich auf und kam zu der Stelle, an der Saul sein Lager aufgeschlagen hatte. David sah die Stelle, wo Saul lag, und auch Abner, den Sohn Ners, den Heerführer Sauls. Saul lag im Kreis des Lagers[a], und die Leute lagerten rings um ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Kreis“ oder „im Rund“. Gemeint ist wahrscheinlich eine kreisförmige Lageranordnung, möglicherweise deren innerer Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da machte David sich auf
  rationale: Die Wendung gibt den erzählerischen Fortgang und den Handlungsbeginn natürlich wieder; ein wörtliches „stand auf“ könnte hier unnötig auf die Körperhaltung verengen.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: kam zu der Stelle
  rationale: בוא mit אֶל bezeichnet die Bewegung auf einen bestimmten Ort zu; „Stelle“ passt zum unmittelbar folgenden Schlafplatz.
- source_word: חָנָה
  choice: sein Lager aufgeschlagen hatte
  rationale: Das deutsche Plusquamperfekt macht deutlich, dass Sauls Lagern dem Eintreffen Davids vorausging.
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: sah die Stelle
  rationale: Die einfache Wiedergabe bewahrt den visuellen Vorgang, ohne eine eingehendere Untersuchung in den Text hineinzulesen.
- source_word: שָׁכַב ... שֹׁכֵב
  choice: lag ... lag
  rationale: שכב bezeichnet hier Sauls liegende Haltung. Im Deutschen ist die Wiederholung natürlich; eine Übersetzung mit „schlief“ würde mehr behaupten, als das Verb ausdrücklich sagt.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: und auch Abner, den Sohn Ners, den Heerführer Sauls
  rationale: Das ergänzte „auch“ macht die lockere hebräische Koordination im Deutschen verständlich. „Heerführer Sauls“ gibt das Possessivsuffix eindeutig wieder, ohne Abner als mit Saul gemeinsam liegend darzustellen.
- source_word: בַּמַּעְגָּל
  choice: innerhalb des Lagerrunds
  rationale: „Lagerrund“ bewahrt das Bild einer kreisförmigen Lagerordnung, während „innerhalb“ die geschützte Position Sauls verständlich macht.
- source_word: חֹנִים סְבִיבֹתָיו
  choice: lagerten rings um ihn
  rationale: Die Formulierung gibt sowohl den andauernden Lagerzustand als auch die vollständige räumliche Umordnung um Saul wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Lagerrund“ hält das räumliche Bild des Hebräischen fest und wird durch die Fußnote erläutert. Die Männer werden nicht ausdrücklich als schlafend bezeichnet, da der hebräische Text nur sagt, dass sie rings um Saul lagerten.
