  to: 'Und nun höre doch mein Herr, der König, die Worte seines Dieners! Wenn der HERR dich gegen mich aufgestachelt hat, möge er eine Opfergabe annehmen[a]. Wenn es aber Menschen gewesen sind, dann sind sie verflucht vor dem HERRN! Denn sie haben mich heute vertrieben, sodass ich keinen Anteil mehr am Erbbesitz des HERRN habe[b]. Damit sagen sie: »Geh, diene anderen Göttern!«'
