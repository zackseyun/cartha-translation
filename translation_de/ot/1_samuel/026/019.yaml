  terminology: „der HERR“ ist als Wiedergabe des Tetragramms konsequent. „Opfergabe“, „verflucht“ und „Erbbesitz des HERRN“ bewahren den sachlichen und theologischen Wortlaut, ohne die im Hebräischen offene Reichweite des Erbbesitzes auf Land, Kult oder Gemeinschaft zu verengen.
