  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: de
  text: 'Und nun höre doch mein Herr, der König, die Worte seines Dieners! Wenn der HERR dich gegen mich aufgestachelt hat, möge er eine Opfergabe annehmen[a]. Wenn es aber Menschen gewesen sind, dann sind sie verflucht vor dem HERRN! Denn sie haben mich heute vertrieben, sodass ich keinen Anteil mehr am Erbbesitz des HERRN habe[b]. Damit sagen sie: »Geh, diene anderen Göttern!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »möge er eine Opfergabe riechen«. Das ist eine kultische Wendung dafür, dass Gott ein Opfer oder eine Gabe annimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sodass ich mich dem Erbbesitz des HERRN nicht mehr anschließen kann«. Der hebräische Ausdruck kann sowohl das Angeschlossensein als auch die Zugehörigkeit zu dem Land und Volk betonen, das dem HERRN gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss an das Vorhergehende als auch den Übergang zu Davids Bitte.
- source_word: יִשְׁמַע נָא
  choice: höre doch
  rationale: Der Jussiv mit נָא drückt eine ehrerbietige Bitte aus; »doch« vermittelt diese höfliche Dringlichkeit natürlich.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Gibt die höfische Anrede an Saul wieder, ohne einen göttlichen Titel anzudeuten.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: die Worte seines Dieners
  rationale: Erhält die demütige Selbstbezeichnung in der dritten Person, wie sie im Hebräischen steht.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: Wenn der HERR dich gegen mich aufgestachelt hat
  rationale: »Aufgestachelt« bewahrt den kausativen und potenziell starken Sinn von הסית, ohne die Aussage über göttliche und menschliche Verursachung auszulegen.
- source_word: יָרַח מִנְחָה
  choice: möge er den Duft einer Opfergabe annehmen
  rationale: Bewahrt das konkrete Geruchsbild des hebräischen Idioms und macht zugleich durch »annehmen« dessen kultische Bedeutung verständlich.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: Wenn es aber Menschen gewesen sind
  rationale: Der Ausdruck stellt menschliche Urheber dem HERRN gegenüber; die Ergänzung »gewesen sind« ergibt im Deutschen einen natürlichen Gegensatz.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: dann seien sie verflucht vor dem HERRN
  rationale: Die adjektivische Aussage kann im Kontext als Fluchausruf verstanden werden. Der Konjunktiv bildet diese pragmatische Kraft ab, während eine Fußnote wegen begrenzter Relevanz nicht nötig ist.
- source_word: גֵרְשׁוּנִי
  choice: sie haben mich heute vertrieben
  rationale: Drückt den gewaltsamen Ausschluss Davids aus Land und Gemeinschaft klar aus.
- source_word: מֵהִסְתַּפֵּחַ
  choice: sodass ich mich ... nicht mehr anschließen kann
  rationale: Gibt den reflexiven Hitpael-Sinn von ספח als Sich-Anschließen oder Zugeordnetwerden genauer wieder als eine bloße Besitzangabe.
- source_word: בְּנַחֲלַת יְהוָה
  choice: dem Erbbesitz des HERRN
  rationale: »Erbbesitz« wahrt die Bedeutung von נחלה und lässt sowohl Land als auch die dazugehörige Bundesgemeinschaft anklingen.
- source_word: לֵאמֹר
  choice: Damit sagen sie
  rationale: Macht deutlich, dass die Vertreibung in ihrer Wirkung einer Aufforderung zum Fremdgötterdienst gleichkommt, ohne zwingend wörtlich ausgesprochene Worte vorauszusetzen.
theological_decisions:
- issue: Der HERR als möglicher Urheber von Sauls Vorgehen gegen David
  choice: Die bedingte Aussage bleibt als mögliches göttliches Aufstacheln stehen.
  alternative: Die Formulierung als bloßes Zulassen oder als ausschließlich menschliche Verursachung erklären.
  rationale: Der hebräische Text entfaltet das Verhältnis von göttlicher Verursachung und menschlicher Verantwortung nicht; die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung des »Erbbesitzes des HERRN«
  choice: Die offene Bezeichnung »Erbbesitz des HERRN« bleibt erhalten und umfasst potenziell Land, Volk und kultische Zugehörigkeit.
  alternative: Den Ausdruck ausschließlich als Landbesitz oder ausschließlich als Zugang zum Heiligtum wiedergeben.
  rationale: Der Kontext verbindet territoriale Vertreibung mit religiöser Ausgrenzung; eine engere Festlegung würde die Mehrdimensionalität des Ausdrucks beschneiden.
- issue: Status des Dienstes an anderen Göttern
  choice: Die Vertreibung wird als faktische Aufforderung zum Dienst an anderen Göttern formuliert.
  alternative: Unterstellen, die Gegner hätten David ausdrücklich zum Götzendienst aufgefordert.
  rationale: לֵאמֹר kann die Bedeutung oder Konsequenz ihres Handelns einführen; die Übersetzung lässt offen, ob die Worte tatsächlich ausgesprochen wurden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit höfischer Anrede. Das konkrete Opferbild bleibt im Haupttext erhalten und wird in einer Fußnote erläutert. Der Gottesname יהוה wird der deutschen Bibelkonvention entsprechend als »der HERR« wiedergegeben. Die direkte Rede verwendet deutsche Anführungszeichen.
