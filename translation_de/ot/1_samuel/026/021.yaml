id: 1SA.26.21
reference: 1 Samuel 26:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: de
  text: 'Da sagte Saul: »Ich habe gesündigt. Komm zurück, mein Sohn David! Denn ich werde dir nichts Böses mehr antun, weil mein Leben[a] heute in deinen Augen kostbar war. Sieh, ich habe töricht gehandelt und bin sehr weit in die Irre gegangen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »meine Seele« oder »meine Person«. Das hebräische Wort נֶפֶשׁ bezeichnet hier im Zusammenhang Sauls Leben, das David verschont hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und habe mich sehr schwer geirrt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Ich habe gesündigt
  rationale: Das Qal-Perfekt in der 1. Person Singular bezeichnet Sauls unmittelbares Eingeständnis seiner Schuld; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: שׁוּב
  choice: Komm zurück
  rationale: Der Imperativ fordert David zur Rückkehr auf, ohne ein Ziel näher zu bestimmen. „Komm zurück“ ist im heutigen Deutsch natürlicher als das alleinstehende „Kehre zurück“.
- source_word: בְּנִי דָוִד
  choice: mein Sohn David
  rationale: Die direkte Anrede bewahrt sowohl Sauls Beziehungssprache als auch Davids Namen.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: ich werde dir nichts Böses mehr antun
  rationale: Das Hifil von רעע bedeutet hier, jemandem Böses beziehungsweise Schaden zuzufügen. Die Formulierung ist idiomatisch und erhält den moralischen Klang des Ausdrucks.
- source_word: תַּחַת אֲשֶׁר
  choice: weil
  rationale: Die Verbindung führt hier den Grund für Sauls Zusage ein.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: mein Leben war in deinen Augen kostbar
  rationale: נֶפֶשׁ bezeichnet im Erzählzusammenhang Sauls verschontes Leben beziehungsweise seine Person; die hebräische Wertungsmetapher „in deinen Augen kostbar“ bleibt erhalten.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: „Heute“ gibt die Zeitangabe im modernen Deutsch knapp und vollständig wieder.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf leitet Sauls abschließendes Eingeständnis ein; „Sieh“ ist würdevoll, verständlich und weniger altertümlich als „Siehe“.
- source_word: הִסְכַּ֛לְתִּי
  choice: ich habe töricht gehandelt
  rationale: Die Verbform bezeichnet törichtes Verhalten, nicht lediglich einen Mangel an Einsicht.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: bin sehr weit in die Irre gegangen
  rationale: שגה kann ein Irregehen oder schweres Fehlgehen ausdrücken; „sehr weit“ gibt die starke Intensivierung הרבה מאד wieder und bewahrt zugleich das Bild des Abirrens.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in Sauls Eingeständnis
  choice: Leben
  alternative: Seele; Person
  rationale: David hat Sauls physisches Leben verschont. Daher ist „Leben“ hier kontextgemäß, ohne eine weitergehende anthropologische Aussage über die Seele in den Vers hineinzulesen.
- issue: Stärke von Sauls Schuldbekenntnis
  choice: gesündigt; töricht gehandelt; sehr weit in die Irre gegangen
  alternative: einen Fehler gemacht
  rationale: Die abgestufte, nachdrückliche Selbstanklage des Hebräischen wird bewahrt und nicht zu einem bloßen Versehen abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter und gut verständlicher Rede. Die bildhafte Wendung vom Irregehen sowie die hebräische Ausdrucksweise „in deinen Augen kostbar“ bleiben erhalten; unnötig altertümliche Formen werden vermieden.
