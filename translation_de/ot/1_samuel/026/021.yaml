  source_fidelity: 'Der deutsche Text gibt die hebräischen Aussagen präzise wieder: Sauls Schuldbekenntnis, die Aufforderung zur Rückkehr, die Zusage, David nicht weiter Böses anzutun, sowie die Begründung mit Davids Verschonung von Sauls Leben. „Mein Leben“ ist für נֶפֶשׁ im narrativen Kontext treffend. „Bin sehr weit in die Irre gegangen“ bewahrt sowohl die Fehlgehensmetapher von שגה als auch die starke Intensivierung הַרְבֵּה מְאֹד.'
  naturalness: Modernes, verständliches und zugleich angemessen würdiges Standarddeutsch. Die direkte Rede ist flüssig; „Komm zurück“, „Sieh“ und „in deinen Augen kostbar“ sind in diesem erzählerisch-feierlichen Register natürlich.
  terminology: „Gesündigt“, „nichts Böses antun“, „kostbar“ und „töricht gehandelt“ sind quellentreu und theologisch nicht überdeutet. Die Fußnote zu נֶפֶשׁ erläutert den kontextuellen Lebensbezug sachgerecht, ohne anthropologische Lehren einzutragen. Beide Fußnotenanker stehen an den jeweiligen Übersetzungseinheiten.
