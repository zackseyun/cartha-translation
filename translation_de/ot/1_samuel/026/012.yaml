  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: de
  text: Da nahm David den Speer und den Wasserkrug vom Kopfende Sauls[a], und sie gingen fort. Niemand sah es, niemand wusste davon, und niemand wachte auf; denn sie schliefen alle, weil ein tiefer Schlaf von Jahwe[b] auf sie gefallen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung bezeichnet den Bereich bei Sauls Kopf; gemeint ist der Platz an seinem Kopfende, während er schlief.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „ein tiefer Schlaf Jahwes“. Die Verbindung kann ausdrücken, dass der tiefe Schlaf von Jahwe ausging oder durch ihn bewirkt wurde.'
    reason: source_ambiguity
lexical_decisions:
- source_word: הַחֲנִית
  choice: der Speer
  rationale: חֲנִית bezeichnet einen Speer oder eine Lanze; „Speer“ ist hier die geläufige und erzählerisch passende Bezeichnung.
- source_word: צַפַּחַת הַמַּיִם
  choice: der Wasserkrug
  rationale: צַפַּחַת bezeichnet ein kleines Gefäß, eine Flasche oder einen Krug. „Wasserkrug“ ist konkret, verständlich und im Zusammenhang natürlich.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: vom Kopfende Sauls
  rationale: Die hebräische Wendung bezeichnet den Platz im Bereich von Sauls Kopf, nicht seinen Kopf selbst. „Vom Kopfende Sauls“ wahrt diese räumliche Bedeutung knapp und natürlich.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: und sie gingen fort
  rationale: Der Plural bezieht sich auf David und Abischai; die Wendung beschreibt ihr Weggehen, ohne dass לָהֶם im Deutschen eigens wiedergegeben werden muss.
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: Niemand sah etwas, niemand bemerkte etwas, und niemand wachte auf
  rationale: Die dreifache hebräische Konstruktion אֵין mit Partizip wird als wiederholte Verneinung wiedergegeben. „Bemerkte“ trifft bei יֹדֵעַ im Kontext die fehlende Wahrnehmung besser als das isolierte „wusste“.
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: denn sie schliefen alle
  rationale: Die Formulierung bewahrt die begründende Funktion von כִּי und gibt den andauernden Zustand idiomatisch wieder.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: ein tiefer Schlaf von Jahwe
  rationale: תַּרְדֵּמָה ist ein tiefer, außergewöhnlicher Schlaf. Der Genitiv mit dem Gottesnamen kann Herkunft beziehungsweise Verursachung anzeigen; „von Jahwe“ bringt dies zum Ausdruck, ohne den hebräischen Satz zu einer ausdrücklich kausativen Formulierung umzubauen.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: auf sie gefallen war
  rationale: Die bildhafte hebräische Wendung lässt sich im Deutschen verständlich bewahren; das Plusquamperfekt verdeutlicht, dass der Schlaf bereits eingesetzt hatte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder; „der HERR“ wäre die traditionelle ersetzende Lesung, steht aber nicht als Titel im Konsonantentext.
- issue: Göttliche Beteiligung an תַּרְדֵּמַת יְהוָה
  choice: ein tiefer Schlaf von Jahwe
  alternative: Jahwe hatte sie in einen tiefen Schlaf fallen lassen
  rationale: Die gewählte Fassung wahrt die Genitivkonstruktion und ihre Aussage göttlicher Herkunft beziehungsweise Verursachung, ohne die grammatisch nicht ausdrücklich formulierte Kausativkonstruktion einzutragen.
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. Die dreifache Verneinung des Hebräischen bleibt als rhetorische Folge erhalten. „Jahwe“ wird in der im Deutschen üblichen Form des Gottesnamens geschrieben.
