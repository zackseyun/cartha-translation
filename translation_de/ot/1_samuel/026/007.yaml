  - severity: low
    issue: „neben seinem Kopf“ für מְרַאֲשֹׁתָיו
    rationale: Die hebräische idiomatische Pluralform meint die Stelle am Kopf bzw. das Kopfende. „Neben“ kann eine bloß seitliche Position nahelegen.
