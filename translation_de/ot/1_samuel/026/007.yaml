base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: de
  text: So kamen David und Abischai bei Nacht zur Truppe. Da lag Saul im Lager[a] und schlief; sein Speer steckte an seinem Kopfende im Boden. Abner und die Truppe lagen rings um ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Lagerkreis“. Das hebräische Wort bezeichnet hier wahrscheinlich die kreisförmige Anordnung des Lagers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: die Männer
  rationale: Im militärischen Zusammenhang bezeichnet עָם Sauls Truppe. „Die Männer“ klingt im Deutschen natürlich und lässt sich an beiden Stellen verwenden, ohne die Bedeutung auf ein stehendes Heer einzuengen.
- source_word: לַיְלָה
  choice: bei Nacht
  rationale: Der adverbiale Akkusativ bezeichnet den Zeitpunkt. „Bei Nacht“ ist knapp, würdig und idiomatisch.
- source_word: וְהִנֵּה
  choice: Da lag
  rationale: Das deutsche präsentative „Da“ vergegenwärtigt den überraschenden Anblick, ohne das im heutigen Deutsch auffällige „siehe“ zu erzwingen.
- source_word: שֹׁכֵב יָשֵׁן
  choice: lag … und schlief
  rationale: Die Formulierung bewahrt sowohl Sauls liegende Haltung als auch seinen Schlafzustand und klingt im Deutschen natürlich.
- source_word: בַּמַּעְגָּל
  choice: mitten im Lager
  rationale: מַעְגָּל bezeichnet hier wahrscheinlich den kreisförmig angeordneten beziehungsweise geschützten inneren Lagerbereich. „Mitten im Lager“ gibt die räumliche Funktion gut wieder; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: חֲנִיתוֹ
  choice: sein Speer
  rationale: „Speer“ ist die übliche und kontextgerechte deutsche Bezeichnung für Sauls Waffe.
- source_word: מְעוּכָה בָאָרֶץ
  choice: steckte … in der Erde
  rationale: Das Partizip beschreibt den in den Boden gedrückten beziehungsweise hineingestoßenen Speer. „Steckte in der Erde“ ist anschaulich und idiomatisch.
- source_word: מְרַאֲשֹׁתָיו
  choice: neben seinem Kopf
  rationale: Die hebräische Wendung bezeichnet den Platz am Kopf einer liegenden Person. „Neben seinem Kopf“ gibt die räumliche Lage im Deutschen klar wieder.
- source_word: סְבִיבֹתָיו
  choice: rings um ihn
  rationale: Die Wendung gibt die Anordnung Abners und der Truppe um Saul prägnant wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das präsentative וְהִנֵּה wird durch „Da“ in die deutsche Satzführung eingebunden. Die Wiederholung von הָעָם wird mit „die Männer“ bewahrt; das Semikolon gliedert die beobachtete Szene übersichtlich.
