- from: So kamen David und Abischai bei Nacht zu den Männern. Da lag Saul mitten im Lager[a] und schlief; sein Speer steckte neben seinem Kopf in der Erde. Abner und die Männer lagen rings um ihn.
  to: So kamen David und Abischai bei Nacht zur Truppe. Da lag Saul im Lager[a] und schlief; sein Speer steckte an seinem Kopfende im Boden. Abner und die Truppe lagen rings um ihn.
  rationale: Die Revision ersetzt die zu unspezifische Personenbezeichnung „Männer“ durch den militärisch und kollektiv passenden Ausdruck „Truppe“ und präzisiert die Lage des Speers mit „an seinem Kopfende“. Die Deutung des möglicherweise kreisförmigen Lagerbereichs bleibt, dem unsicheren Lexem entsprechend, in der Fußnote.
