  source_fidelity: 'Die Übersetzung gibt die hebräischen Kernelemente präzise wieder: יהוה als „Jahwe“, יָשִׁיב im vergeltenden Sinn als „wird … vergelten“, den allgemeinen maskulinen Singular לָאִישׁ als „jedem Mann“, sowie צדקה und אמונה als „Gerechtigkeit“ und „Treue“. „In meine Hand gegeben“ und „meine Hand gegen … auszustrecken“ bewahren die hebräischen Wendungen. Die deutsche Verknüpfung mit „denn“ und „ich aber“ macht den im Hebräischen eng verbundenen Gegensatz verständlich, ohne zusätzlichen Sachgehalt einzutragen.'
