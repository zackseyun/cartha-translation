  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: de
  text: Und Jahwe wird jedem Mann seine Gerechtigkeit und seine Treue vergelten,[a] denn Jahwe hat dich heute in meine Hand gegeben; ich aber war nicht bereit, meine Hand gegen den Gesalbten Jahwes auszustrecken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Jahwe wird jedem Mann seine Gerechtigkeit und seine Treue zurückgeben.“'
    reason: Das Verb kann wörtlicher als „zurückgeben“ verstanden werden; im Zusammenhang liegt der Sinn „vergelten“ nahe.
  - marker: b
    text: 'Das heißt: gegen den König, den Jahwe gesalbt hat.'
    reason: Die Anmerkung erläutert die königliche Bezeichnung „der Gesalbte Jahwes“ im historischen Zusammenhang.
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Die Konjunktion wird als schlichte Verknüpfung wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: יָשִׁיב
  choice: wird … vergelten
  rationale: Der Hifil von שוב bezeichnet hier das Zurückgeben im Sinn einer Vergeltung entsprechend dem Verhalten. „Vergelten“ ist im Deutschen idiomatisch, lässt aber die positive oder negative Art der Vergeltung vom Kontext bestimmen.
- source_word: לָאִישׁ
  choice: jedem Mann
  rationale: Der maskuline Singular hat hier allgemeinen, auf den Einzelnen bezogenen Sinn. Die Wiedergabe bewahrt die grammatische Form des Hebräischen.
- source_word: צִדְקָתוֹ
  choice: seine Gerechtigkeit
  rationale: צְדָקָה bezeichnet hier das rechte, integre Verhalten Davids. „Gerechtigkeit“ bewahrt den ethischen und theologischen Gehalt.
- source_word: וְאֶת אֱמֻנָתוֹ
  choice: und seine Treue
  rationale: אֱמוּנָה meint in diesem Zusammenhang Verlässlichkeit und loyale Treue, die sich im Handeln zeigt.
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: denn Jahwe hat dich heute in meine Hand gegeben
  rationale: Die Relativkonstruktion erläutert, worin sich Davids gerechtes und treues Verhalten erwies. Das im Deutschen erforderliche Possessivpronomen ergibt sich aus dem nachfolgenden Ich-Bezug.
- source_word: וְלֹא אָבִיתִי
  choice: ich aber war nicht bereit
  rationale: אבה bezeichnet Bereitschaft beziehungsweise deren Verweigerung. „War nicht bereit“ gibt die Nuance enger wieder als das stärkere „weigerte mich“; „aber“ verdeutlicht den Gegensatz zwischen Gelegenheit und Zurückhaltung.
- source_word: לִשְׁלֹחַ יָדִי
  choice: meine Hand … auszustrecken
  rationale: Die hebräische Wendung bezeichnet einen gewaltsamen Zugriff. Die bildhafte Form bleibt erhalten und ist im Deutschen verständlich.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: gegen den Gesalbten Jahwes
  rationale: מָשִׁיחַ bedeutet „Gesalbter“ und bezeichnet hier Saul als den von Jahwe zum König Gesalbten, ohne die spätere messianische Titelfunktion in den Vordergrund zu rücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen in einer im Deutschen etablierten Form wieder.
- issue: Allgemeiner maskuliner Singular אִישׁ
  choice: jedem Mann
  alternative: jedem Menschen
  rationale: Die Übersetzung bewahrt die maskuline Singularform und ihren repräsentativen Sinn, ohne die Aussage auf eine einzelne bekannte Person zu beschränken.
- issue: מְשִׁיחַ als Bezeichnung Sauls
  choice: der Gesalbte Jahwes
  alternative: der Messias Jahwes
  rationale: Im historischen Zusammenhang ist Saul als der von Jahwe gesalbte König gemeint. „Messias“ könnte hier eine spätere christologische Spezifizierung nahelegen, die der Vers nicht ausdrücklich setzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildsprache „in meine Hand geben“ und „die Hand gegen jemanden ausstrecken“ bleibt erhalten. Das Semikolon gliedert Gelegenheit und bewusste Zurückhaltung klar, ohne den Satzfluss unnötig zu vereinfachen.
