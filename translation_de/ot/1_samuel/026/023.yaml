  terminology: „Jahwe“, „Gerechtigkeit“, „Treue“ und „der Gesalbte Jahwes“ sind terminologisch konsistent und sachgerecht. Die Fußnote zu „dem Gesalbten Jahwes“ erläutert korrekt den Bezug auf den von Jahwe gesalbten König, ohne eine späteren messianischen Sinn hineinzulesen.
