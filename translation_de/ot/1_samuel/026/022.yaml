  text: וַ/יַּ֤עַן דָּוִד֙ וַ/יֹּ֔אמֶר הִנֵּ֖ה ה/חנית הַ/מֶּ֑לֶךְ וְ/יַעֲבֹ֛ר אֶחָ֥ד מֵֽ/הַ/נְּעָרִ֖ים וְ/יִקָּחֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: de
  text: 'David antwortete: „Hier ist der Speer des Königs. Einer von den jungen Männern[b] soll herüberkommen[a] und ihn nehmen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinübergehen“; das hebräische Verb bedeutet wörtlich „hinübergehen“ oder „überschreiten“.'
    reason: lexical_alternative
  - marker: b
    text: „Junge Männer“ kann auch mit „Diener“ oder „Begleiter“ wiedergegeben werden, da das hebräische Wort je nach Zusammenhang das Alter oder eine untergeordnete Stellung bezeichnen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: David antwortete
  rationale: Die hebräische Erzählformel verbindet „antworten“ und „sagen“. Im heutigen Deutschen gibt „antwortete“ die Einleitung der Erwiderung vollständig und ohne unnatürliche Doppelung wieder.
- source_word: הִנֵּה
  choice: Hier ist
  rationale: Die hinweisende Partikel lenkt die Aufmerksamkeit auf den vorhandenen Speer. „Hier ist“ bewahrt diese deiktische Funktion in natürlichem modernem Deutsch.
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: der Speer des Königs
  rationale: חֲנִית bezeichnet einen Speer oder eine Lanze; „Speer“ ist hier die geläufige, allgemein verständliche Bezeichnung. Der Genitiv gibt die Zugehörigkeit zum König klar wieder.
- source_word: וְיַעֲבֹר
  choice: soll herüberkommen
  rationale: עבר bedeutet grundsätzlich „hinübergehen/herüberkommen“. Die jussivische Verbform wird mit „soll“ wiedergegeben; aus Davids Blickrichtung ist „herüberkommen“ im Deutschen natürlich.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: Einer von den jungen Männern
  rationale: אֶחָד bezeichnet ausdrücklich „einen“ aus der Gruppe. נַעַר kann sowohl das Alter als auch eine untergeordnete Stellung bezeichnen; „junge Männer“ wahrt die naheliegende lexikalische Bedeutung, ohne den Status festzulegen.
- source_word: וְיִקָּחֶהָ
  choice: und ihn nehmen
  rationale: לקח bedeutet hier schlicht „nehmen“. Das feminine hebräische Suffix bezieht sich auf חֲנִית; im Deutschen richtet sich das Pronomen nach dem maskulinen Substantiv „Speer“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die redundante hebräische Redeeinleitung „antwortete und sagte“ ist idiomatisch zu „antwortete“ zusammengezogen. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
