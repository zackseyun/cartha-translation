  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: de
  text: 'Und David sagte: »So wahr Jahwe lebt: Jahwe wird ihn gewiss schlagen, oder sein Tag wird kommen und er wird sterben, oder er wird in den Kampf ziehen und umkommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Die geläufige deutsche Schwurformel gibt die feierliche und bekräftigende Kraft des hebräischen Ausdrucks natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי אִם
  choice: durch Doppelpunkt und »selbst« ausgedrückt
  rationale: Im Schwurzusammenhang leitet כִּי אִם eine nachdrücklich bekräftigte Aussage ein. Die deutsche Satzgestaltung und »selbst« vermitteln diese Funktion ohne ein schwerfälliges »gewiss«.
- source_word: יִגָּפֶנּוּ
  choice: wird ihn schlagen
  rationale: Die Wiedergabe lässt wie das Hebräische offen, auf welche Weise Jahwe Saul trifft; »töten« wäre eindeutiger als der Ausgangstext.
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  choice: sein Tag wird kommen und er wird sterben
  rationale: Die Formulierung bewahrt das Bild vom kommenden Tag und gibt וָמֵת als anschließendes Sterben wieder, ohne den Zeitpunkt näher zu bestimmen.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: wird in den Kampf ziehen
  rationale: Das wörtliche »hinabgehen« bezeichnet hier militärische Bewegung. »In den Kampf ziehen« ist im Deutschen idiomatisch und erhält den Sinn.
- source_word: וְנִסְפָּה
  choice: und umkommen
  rationale: »Umkommen« bewahrt gegenüber dem vorherigen »sterben« die eigene Wortwahl und passt zum Tod im Kampf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Art von Sauls Tod
  choice: drei offen formulierte Möglichkeiten
  alternative: Jahwe wird Saul unmittelbar töten
  rationale: David nennt ein göttliches Schlagen, das Kommen von Sauls Todestag und sein Umkommen im Kampf. Die Übersetzung legt nicht fest, wie diese Möglichkeiten zueinander stehen oder auf welche Weise Gottes Handeln erfolgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt feierlich, aber allgemein verständlich; die dreigliedrige Satzstruktur des Hebräischen wird bewahrt.
