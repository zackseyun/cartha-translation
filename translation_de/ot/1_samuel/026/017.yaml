  text: וַ/יַּכֵּ֤ר שָׁאוּל֙ אֶת ק֣וֹל דָּוִ֔ד וַ/יֹּ֕אמֶר הֲ/קוֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יֹּ֣אמֶר דָּוִ֔ד קוֹלִ֖/י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: de
  text: 'Da erkannte Saul Davids Stimme und sagte: »Ist das deine Stimme, mein Sohn David?« David sagte: »Es ist meine Stimme, mein Herr, der König.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: erkannte
  rationale: 'Das Verb נכר bezeichnet hier das Wiedererkennen anhand der Wahrnehmung: Saul erkennt Davids Stimme.'
- source_word: קוֹל
  choice: Stimme
  rationale: Im Dialog geht es eindeutig um die Stimme eines Sprechers, nicht allgemein um ein Geräusch.
- source_word: הֲקוֹלְךָ זֶה
  choice: Ist das deine Stimme?
  rationale: Die Frage wird im natürlichen modernen Deutsch mit dem im Gespräch üblichen Demonstrativpronomen »das« wiedergegeben.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die wörtliche Wiedergabe bewahrt die familiäre Anrede und ihre Spannung zu Sauls feindseligem Verhalten.
- source_word: קוֹלִי
  choice: Es ist meine Stimme
  rationale: Die hebräische Nominalantwort lautet wörtlich »meine Stimme«; die ergänzte Kopula ergibt einen klaren deutschen Satz und bewahrt den Bezug auf die Stimme.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: אֲדֹנִי ist hier eine ehrerbietige Anrede an einen Menschen. Die koordinierte deutsche Form gibt sowohl Davids Unterordnung als auch Sauls königlichen Rang natürlich wieder.
- source_word: דָּוִד / שָׁאוּל
  choice: David / Saul
  rationale: Die Personennamen folgen den etablierten deutschen Bibelnamensformen.
theological_decisions:
- issue: Die relationale Anrede בְּנִי in Sauls Rede
  choice: mein Sohn
  alternative: mein Kind
  rationale: Die maskuline und familiäre Anrede wird bewahrt, ebenso die erzählerische Spannung, dass Saul David trotz seiner Feindschaft so anspricht.
- issue: Davids Anrede אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  alternative: mein Herr, der König
  rationale: Die Stelle bezeichnet keinen göttlichen Titel, sondern Davids ehrerbietige Anrede an Saul; beide Elemente werden ohne theologisierende Erweiterung wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und bewahrt die Wiederholung von »Stimme«. »Antwortete« gibt das kontextuelle וַיֹּאמֶר idiomatisch wieder.
