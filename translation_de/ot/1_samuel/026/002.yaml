  text: וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּ֨רֶד֙ אֶל מִדְבַּר זִ֔יף וְ/אִתּ֛/וֹ שְׁלֹֽשֶׁת אֲלָפִ֥ים אִ֖ישׁ בְּחוּרֵ֣י יִשְׂרָאֵ֑ל לְ/בַקֵּ֥שׁ אֶת דָּוִ֖ד בְּ/מִדְבַּר זִֽיף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: de
  text: Da machte Saul sich auf und zog zur Wüste Sif hinab. Bei ihm waren dreitausend ausgewählte Männer Israels, um David in der Wüste Sif zu suchen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich auf
  rationale: Das Qal-Wayyiqtol von קום leitet hier eine entschlossene Handlung ein. „Machte sich auf“ bewahrt diese hebräische Erzählweise und klingt zugleich natürlich.
- source_word: וַיֵּרֶד
  choice: zog ... hinab
  rationale: ירד bezeichnet eine Abwärtsbewegung. „Hinabziehen“ erhält die Richtungsangabe und passt zum Aufbruch eines Königs mit einem größeren Aufgebot.
- source_word: מִדְבַּר זִיף
  choice: Wüste Sif
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Weide- oder Wildnisgebiet, nicht zwingend eine Sandwüste. „Wüste Sif“ ist die knappe, im Deutschen geläufige geografische Bezeichnung.
- source_word: וְאִתּוֹ
  choice: Bei ihm waren
  rationale: Die vorangestellte Begleitangabe wird als natürlicher deutscher Begleitsatz wiedergegeben und behält ihre Hervorhebung.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: dreitausend ... Männer
  rationale: Die wörtliche Bezeichnung „Männer“ bleibt erhalten; „Soldaten“ wäre im Zusammenhang naheliegend, steht aber nicht ausdrücklich im Ausgangstext.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: ausgewählte Männer Israels
  rationale: Die Wendung bezeichnet ausgesuchte, besonders geeignete Männer. „Ausgewählt“ gibt den Auswahlgedanken wieder, ohne die militärische Funktion stärker festzulegen als der Text.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: um David ... zu suchen
  rationale: בקש bedeutet hier im Verfolgungszusammenhang „suchen“. Die Infinitivkonstruktion bezeichnet Sauls Absicht.
- source_word: בְּמִדְבַּר זִיף
  choice: in der Wüste Sif
  rationale: Die Wiederholung der Ortsangabe im Hebräischen wird beibehalten und nicht stilistisch gekürzt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzfolge wahrt den entschlossenen Aufbruch, die hervorgehobene Begleitung und die im Hebräischen wiederholte Ortsangabe. Keine Fußnote ist nötig, da die syntaktische Umstellung „Bei ihm waren ...“ den hebräischen Begleitsatz eindeutig und natürlich wiedergibt.
