  terminology: „Abischai“, „Jahwe“ und „der Gesalbte Jahwes“ sind konsistent und terminologisch treffend. Die Fußnote erklärt die lexikalische Verbindung zu „Messias“, ohne eine spätere theologische Deutung in den historischen Bezug zu Saul einzutragen. Der Anker steht unmittelbar beim Ausdruck, auf den sich die Erläuterung bezieht.
