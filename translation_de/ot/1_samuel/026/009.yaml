  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des hebräischen Textes zuverlässig wieder: Davids Gegenrede an Abischai, das Verbot, Saul zu töten, die Begründung in Form einer rhetorischen Frage, die Wendung vom Ausstrecken der Hand gegen den Gesalbten Jahwes und die Schuldlosigkeit. „Töte ihn nicht“ ist im unmittelbaren Kontext des beabsichtigten tödlichen Speerstoßes eine sachgemäße Konkretisierung von אַל תַּשְׁחִיתֵהוּ, ohne den Sinn zu verändern.'
