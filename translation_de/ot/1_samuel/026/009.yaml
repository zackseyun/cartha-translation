  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל אֲבִישַׁ֖י אַל תַּשְׁחִיתֵ֑/הוּ כִּ֠י מִ֣י שָׁלַ֥ח יָד֛/וֹ בִּ/מְשִׁ֥יחַ יְהוָ֖ה וְ/נִקָּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: de
  text: 'Doch David sagte zu Abischai: „Töte ihn nicht! Denn wer könnte seine Hand gegen den Gesalbten Jahwes[a] ausstrecken und dabei schuldlos bleiben?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Gesalbter“ gehört zu derselben Wortfamilie wie „Messias“. Hier bezeichnet es Saul als den von Jahwe gesalbten König.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch David sagte
  rationale: Das Waw führt die Erzählung fort; „doch“ gibt hier zugleich den Gegensatz zu Abischais Vorhaben wieder.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Töte ihn nicht
  rationale: Das Hifil von שׁחת bedeutet allgemein „vernichten/zugrunde richten“. Da unmittelbar ein tödlicher Schlag gegen Saul vorgeschlagen wurde, gibt „töte ihn nicht“ die konkrete Bedeutung im Kontext natürlich und eindeutig wieder.
- source_word: שָׁלַח יָדוֹ
  choice: seine Hand … ausstrecken
  rationale: Die hebräische Wendung bezeichnet ein gewaltsames Vorgehen gegen jemanden. Die bildhafte Ausdrucksweise lässt sich im Deutschen verständlich bewahren.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: gegen den Gesalbten Jahwes
  rationale: מָשִׁיחַ bezeichnet hier Saul als den von Jahwe zum König Gesalbten. „Gesalbter“ bewahrt sowohl den historischen Sinn als auch die Wortverbindung zum späteren Titel „Messias“.
- source_word: וְנִקָּה
  choice: und dabei schuldlos bleiben
  rationale: נקה bezeichnet hier das Freisein von Schuld beziehungsweise Haftung. „Schuldlos bleiben“ wahrt den moralischen und rechtlichen Gehalt, ohne ihn auf bloße Straflosigkeit einzuengen.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחַ in Bezug auf Saul
  choice: der Gesalbte Jahwes
  alternative: der Messias Jahwes
  rationale: Im unmittelbaren historischen Zusammenhang ist Saul als der von Jahwe eingesetzte König gemeint. „Messias“ könnte an dieser Stelle fälschlich als unmittelbare endzeitliche oder christologische Bezeichnung verstanden werden; die lexikalische Verbindung wird stattdessen in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und das hebräische Hand-Bild bleiben erhalten; „töte ihn nicht“ verdeutlicht die im Kontext konkret gemeinte tödliche Handlung.
