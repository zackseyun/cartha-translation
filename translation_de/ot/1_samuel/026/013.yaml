  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר דָּוִד֙ הָ/עֵ֔בֶר וַ/יַּעֲמֹ֥ד עַל רֹאשׁ הָ/הָ֖ר מֵֽ/רָחֹ֑ק רַ֥ב הַ/מָּק֖וֹם בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: de
  text: Dann ging David auf die andere Seite hinüber und stellte sich in einiger Entfernung auf den Gipfel des Berges; zwischen ihnen lag ein großer Abstand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Groß war der Raum zwischen ihnen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: ging … hinüber
  rationale: Das Verb bezeichnet hier den Wechsel von einer Seite zur anderen; die deutsche Wendung bewahrt die Richtungsbedeutung und klingt natürlich.
- source_word: הָעֵבֶר
  choice: die andere Seite
  rationale: Der Ausdruck verweist auf die gegenüberliegende beziehungsweise jenseitige Seite und ist so im Deutschen klar verständlich.
- source_word: וַיַּעֲמֹד
  choice: stellte sich
  rationale: Im narrativen Zusammenhang bezeichnet das Verb nicht nur einen Zustand, sondern Davids bewusstes Einnehmen eines Standorts; „stellte sich“ gibt dies idiomatisch wieder.
- source_word: עַל רֹאשׁ הָהָר
  choice: auf den Gipfel des Berges
  rationale: רֹאשׁ bedeutet in topografischem Gebrauch „Gipfel“ oder „oberster Teil“; „Berg“ gibt הָהָר ohne unnötige Verkleinerung wieder.
- source_word: מֵרָחֹק
  choice: in einiger Entfernung
  rationale: Die Wendung drückt räumliche Distanz aus. „In einiger Entfernung“ ist in modernem Deutsch natürlich, ohne die Entfernung genauer festzulegen als der hebräische Text.
- source_word: רַב הַמָּקוֹם
  choice: lag ein großer Abstand
  rationale: Wörtlich heißt es etwa „groß war der Raum/Ort“. Im Kontext ist der große Zwischenraum gemeint; „lag ein großer Abstand“ macht dies verständlich und bewahrt das räumliche Bild.
- source_word: בֵּינֵיהֶם
  choice: zwischen ihnen
  rationale: Die Präpositionalform bezeichnet unmittelbar den Raum zwischen David und den anderen.
theological_decisions: []
