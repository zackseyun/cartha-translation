  text: וַ/יָּבֹ֤אוּ הַ/זִּפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֨וֹא דָוִ֤ד מִסְתַּתֵּר֙ בְּ/גִבְעַ֣ת הַ/חֲכִילָ֔ה עַ֖ל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: de
  text: 'Da kamen die Sifiter zu Saul nach Gibea und sagten: »Hält sich David nicht auf dem Hügel Hachila verborgen, der vor dem Ödland liegt?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der vor Jeschimon liegt“. Das hebräische Wort kann entweder „Ödland/Wüste“ bedeuten oder als Gebietsname Jeschimon verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da kamen“ gibt den Fortgang im Deutschen natürlich wieder und bewahrt das einfache Bewegungsverb.
- source_word: הַזִּפִים
  choice: die Sifiter
  rationale: Die Pluralform bezeichnet die Einwohner von Sif; „Sifiter“ ist eine knappe, gebräuchliche deutsche Einwohnerbezeichnung.
- source_word: הַגִּבְעָתָה
  choice: nach Gibea
  rationale: Das direktionale He bezeichnet eine Bewegung auf Gibea zu. „Zu Saul nach Gibea“ bewahrt sowohl das Ziel der Personen als auch das Ortsziel.
- source_word: לֵאמֹר
  choice: und sagten
  rationale: Der Infinitiv leitet die direkte Rede ein. Die koordinierte Form ist im modernen Deutschen natürlicher als „indem sie sagten“.
- source_word: הֲלוֹא
  choice: Hält sich ... nicht
  rationale: Die Partikel eröffnet eine rhetorische Frage, bei der Zustimmung erwartet wird; die deutsche Verneinungsfrage erhält diese Funktion.
- source_word: מִסְתַּתֵּר
  choice: hält sich ... verborgen
  rationale: Das Hitpael-Partizip beschreibt David als jemanden, der sich selbst verborgen hält. Die Formulierung gibt sowohl den reflexiven Sinn als auch den andauernden Zustand wieder.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: auf dem Hügel Hachila
  rationale: גִּבְעָה bezeichnet gewöhnlich einen Hügel; die Präposition wird in dieser topografischen Verbindung idiomatisch mit „auf“ wiedergegeben.
- source_word: עַל־פְּנֵי הַיְשִׁימֹן
  choice: der dem Ödland gegenüberliegt
  rationale: עַל־פְּנֵי kann in einer geografischen Angabe „vor“ oder „gegenüber“ bedeuten. „Gegenüberliegt“ vermeidet die nicht ausdrücklich genannte Festlegung auf eine Himmelsrichtung. הַיְשִׁימֹן wird im Haupttext als Gattungsbegriff verstanden; die mögliche Deutung als Gebietsname bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage und die geografisch-lexikalische Mehrdeutigkeit des hebräischen Ausdrucks werden bewahrt; eine Festlegung auf „östlich von“ wird vermieden.
