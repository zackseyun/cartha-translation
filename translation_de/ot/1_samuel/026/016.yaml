reference: 1 Samuel 26:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: de
  text: 'Was du da getan hast, ist nicht gut. So wahr Yahweh lebt: Ihr habt den Tod verdient,[a] weil ihr euren Herrn, den Gesalbten Yahwehs, nicht bewacht habt. Und nun sieh doch: Wo sind der Speer des Königs und der Wasserkrug, die an seinem Kopfende standen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr seid Söhne des Todes.“ Gemeint ist: Ihr habt den Tod verdient oder seid der Todesstrafe verfallen.'
    reason: Die Fußnote bewahrt die markante hebräische Ausdrucksweise und erläutert ihre idiomatische, rechtlich gefärbte Bedeutung.
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: Was du da getan hast, ist nicht gut
  rationale: Gibt die wertende Aussage und den Rückbezug auf Abners Tat natürlich wieder. Das demonstrative „da“ entspricht dem Hinweischarakter von הַזֶּה, ohne die Wendung durch „böse“ zu verschärfen.
- source_word: חַי יְהוָה
  choice: So wahr Yahweh lebt
  rationale: Die geläufige deutsche Schwurformel bewahrt die feierliche Bekräftigung und gibt den Gottesnamen als „Yahweh“ wieder.
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: Ihr habt den Tod verdient
  rationale: Die wörtliche Wendung „Söhne des Todes“ bezeichnet hier Menschen, die wegen ihres Versagens den Tod verdienen beziehungsweise dem Tod verfallen sind. Die idiomatische Wiedergabe ist im modernen Deutsch klar; die Fußnote bewahrt die hebräische Bildform.
- source_word: שְׁמַרְתֶּם עַל אֲדֹנֵיכֶם
  choice: ihr euren Herrn … nicht bewacht habt
  rationale: שׁמר על bezeichnet in diesem militärischen Zusammenhang schützendes Bewachen. „Herrn“ gibt Sauls Stellung gegenüber seinen Gefolgsleuten wieder; die Kleinschreibung im Satzzusammenhang verhindert eine Verwechslung mit einem Ersatznamen Gottes.
- source_word: מְשִׁיחַ יְהוָה
  choice: den Gesalbten Yahwehs
  rationale: Bewahrt den königlich-sakralen Titel Sauls, ohne ihn im unmittelbaren Kontext mit dem später als Eigenbezeichnung gebrauchten Titel „Messias“ gleichzusetzen.
- source_word: וְעַתָּה רְאֵה
  choice: Und nun sieh nach
  rationale: Der Singular richtet sich weiterhin an Abner. „Sieh nach“ leitet natürlich zur Frage nach den fehlenden Gegenständen über.
- source_word: חֲנִית הַמֶּלֶךְ וְאֶת צַפַּחַת הַמַּיִם
  choice: der Speer des Königs und der Wasserkrug
  rationale: „Speer“ ist die reguläre Bedeutung von חֲנִית; צַפַּחַת הַמַּיִם bezeichnet ein kleines Gefäß für Wasser, hier natürlich als „Wasserkrug“ wiedergegeben.
- source_word: אֲשֶׁר מראשתו
  choice: die an seinem Kopfende standen
  rationale: Der masoretische Text weist auf die Stelle bei Sauls Kopf. Der Plural „standen“ bezieht den Relativsatz entsprechend dem Kontext auf Speer und Wasserkrug; „Kopfende“ ist im Deutschen natürlicher als „bei seinem Kopf“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Eigenname wird als Eigenname wiedergegeben. „Yahweh“ folgt der im Projekt vorgegebenen Form und vermeidet, den Namen durch einen Titel zu ersetzen.
- issue: Bedeutung von מְשִׁיחַ יְהוָה im königlichen Kontext
  choice: der Gesalbte Yahwehs
  alternative: Yahwehs Messias; der von Yahweh Gesalbte
  rationale: „Gesalbter“ erhält die theologische Bedeutung von Sauls durch Salbung bestätigtem Königtum, ohne spätere messianische Aussagen in diesen Vers hineinzulesen.
- issue: Rechts- und Todesaussage בְנֵי מָוֶת אַתֶּם
  choice: Ihr habt den Tod verdient
  alternative: Ihr seid Söhne des Todes; Ihr seid des Todes
  rationale: Die Formulierung drückt im Kontext Davids Urteil über das schwere Versagen der königlichen Wache aus. Sie wird als Verdienstaussage wiedergegeben, nicht als Behauptung, ihr Tod sei unabwendbar.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der Wechsel vom Singular („du“) zum Plural („ihr“) des hebräischen Textes bleibt erhalten: David spricht zunächst Abner persönlich an und schließt dann die übrigen Wächter in den Vorwurf ein. Die Formulierung „an seinem Kopfende“ ist konkret und natürlich, ohne den Sinn unnötig auszudeuten.'
