source:
  edition: WLC
  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: de
  text: 'Und nun: Lass mein Blut nicht fern von Jahwes Gegenwart[a] zur Erde fallen! Denn der König von Israel ist ausgezogen, um einen einzigen Floh zu suchen, wie man in den Bergen einem Rebhuhn nachjagt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „fern vom Angesicht Jahwes“.'
    reason: Die hebräische Wendung verbindet eine räumliche Vorstellung mit dem idiomatischen Sinn „Gegenwart“.
lexical_decisions:
- source_word: דָּמִי
  choice: mein Blut
  rationale: Die konkrete Wendung bewahrt das Bild eines gewaltsamen Todes und den damit verbundenen Gedanken der Blutschuld; „mein Leben“ wäre glättender.
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: Lass ... nicht ... auf die Erde fallen
  rationale: Die Aufforderung ist im Deutschen natürlich formuliert und erhält zugleich das konkrete hebräische Bild des zur Erde fallenden Blutes.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: fern von Jahwes Gegenwart
  rationale: „Gegenwart“ gibt den idiomatischen Sinn von פְּנֵי wieder, während „fern von“ die räumliche Vorstellung und den möglichen Bezug auf Davids Entfernung vom Land und Heiligtum wahrt.
- source_word: יָצָא
  choice: ist ausgezogen
  rationale: Die Formulierung bezeichnet idiomatisch, dass der König zu einer Unternehmung oder Verfolgung aufgebrochen ist.
- source_word: לְבַקֵּשׁ
  choice: um ... zu suchen
  rationale: Die breite Grundbedeutung bleibt erhalten, ohne die Verfolgungsabsicht stärker auszudeuten, als es das Verb selbst verlangt.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: einen einzigen Floh
  rationale: „Einzigen“ erhält die Betonung durch אֶחָד und Davids selbsterniedrigenden Vergleich.
- source_word: הַקֹּרֵא
  choice: ein Rebhuhn
  rationale: Die traditionelle und lexikalisch übliche Bestimmung als Rebhuhn passt zum Jagdvergleich; die genaue Vogelart bleibt jedoch nicht völlig sicher.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: wie man in den Bergen ... jagt
  rationale: Die unpersönliche deutsche Form gibt den Vergleich natürlich wieder und bewahrt das Gebirge als Schauplatz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִנֶּגֶד פְּנֵי יְהוָה
  choice: fern von Jahwes Gegenwart
  alternative: fern vom Angesicht Jahwes
  rationale: Die Übersetzung wahrt die Vorstellung der Entfernung von Jahwe, ohne festzulegen, ob vor allem das Land, das Heiligtum oder allgemeiner Gottes Gegenwart gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte Appell „Lass“ entspricht dem hebräischen Verbotssatz; die konkreten Bilder von Blut, Erde, Floh und Rebhuhn bleiben erhalten.
