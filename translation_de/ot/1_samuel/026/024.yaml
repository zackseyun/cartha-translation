source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: de
  text: 'Und sieh: So wie dein Leben heute in meinen Augen kostbar war, so möge mein Leben in den Augen Jahwes kostbar sein, und er möge mich aus jeder Not retten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die Wendung lenkt nachdrücklich die Aufmerksamkeit auf das Folgende; „Und sieh“ ist modern und bewahrt diese Diskursfunktion.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: So wie ... so
  rationale: Die korrelative Form gibt den Vergleich zwischen Davids Handeln und seiner Bitte klar und natürlich wieder.
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  choice: dein Leben ... in meinen Augen kostbar war
  rationale: Wörtlich ist das Leben „groß“ in Davids Augen; idiomatisch bezeichnet dies seinen hohen Wert. Der Kontext ist die Schonung von Sauls Leben.
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: In beiden Vorkommen geht es angesichts von Verschonung und Rettung um das konkrete Leben, nicht spezifisch um eine immaterielle Seele.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: „Heute“ gibt die hervorgehobene Zeitangabe im modernen Deutschen knapp und natürlich wieder.
- source_word: תִּגְדַּל ... נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: so möge mein Leben in den Augen Jahwes kostbar sein
  rationale: Der Imperfekt wird im Zusammenhang als Wunsch verstanden. Die Wiederholung von „kostbar“ erhält die genaue Entsprechung zum ersten Vergleichsglied.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die geläufige deutsche Form.
- source_word: וְיַצִּלֵנִי
  choice: und er möge mich ... retten
  rationale: Die Hifilform von נצל bezeichnet das Herausreißen beziehungsweise Retten aus einer Bedrängnis; der Wunschcharakter wird beibehalten.
- source_word: מִכָּל צָרָה
  choice: aus jeder Not
  rationale: צָרָה umfasst Bedrängnis, Not und Unglück. „Jede Not“ ist im Deutschen idiomatisch und bewahrt den umfassenden Sinn von כָּל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ erhält den Charakter als Gottes Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Aussage über Gottes Rettung
  choice: 'Wunsch beziehungsweise Bitte: „möge ... und er möge“'
  alternative: 'Feststellung oder sichere Erwartung: „wird ... und wird“'
  rationale: Die hebräischen Imperfektformen lassen formal auch eine futurische Nuance zu. Im Kontext ist die parallele Wunschform jedoch naheliegend; sie vermeidet, Davids Aussage als uneingeschränkte Garantie zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wertungsidiomatik wird verständlich mit „kostbar“ wiedergegeben; die Vergleichsstruktur und der Gebets- beziehungsweise Wunschton bleiben erhalten.
