source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲבִישַׁי֙ אֶל דָּוִ֔ד סִגַּ֨ר אֱלֹהִ֥ים הַ/יּ֛וֹם אֶת אוֹיִבְ/ךָ֖ בְּ/יָדֶ֑/ךָ וְ/עַתָּה֩ אַכֶּ֨/נּוּ נָ֜א בַּ/חֲנִ֤ית וּ/בָ/אָ֨רֶץ֙ פַּ֣עַם אַחַ֔ת וְ/לֹ֥א אֶשְׁנֶ֖ה לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: de
  text: 'Da sagte Abischai zu David: »Heute hat Gott deinen Feind in deine Hand gegeben.[a] Nun lass mich ihn doch mit dem Speer in einem einzigen Stoß am Boden festspießen;[b] ich werde ihm keinen zweiten Stoß versetzen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Heute hat Gott deinen Feind deiner Gewalt ausgeliefert.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »ihn mit dem Speer und in die Erde, ein einziges Mal«. Gemeint ist offenbar, Saul mit einem einzigen Speerstoß am Boden festzuspießen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: hat … in deine Hand gegeben
  rationale: Das Verb bezeichnet hier die Auslieferung in die Gewalt eines anderen. Zusammen mit בְּיָדֶךָ bewahrt diese Wiedergabe das hebräische Bild und ist im Deutschen verständlich.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Form und der Zusammenhang beziehen sich auf Gott; die Aussage bleibt ausdrücklich Abischais Deutung der Lage.
- source_word: אוֹיִבְךָ
  choice: deinen Feind
  rationale: Direkte und kontextgerechte Wiedergabe des Substantivs mit Suffix der 2. Person Singular.
- source_word: אַכֶּנּוּ נָא
  choice: lass mich ihn doch
  rationale: Der Kohortativ mit נָא drückt Abischais Bitte beziehungsweise sein dringliches Angebot aus. „doch“ vermittelt dies natürlich, ohne unnötige Förmlichkeit.
- source_word: בַּחֲנִית וּבָאָרֶץ
  choice: mit dem Speer … am Boden festspießen
  rationale: Die ungewöhnlich knappe Verbindung lautet wörtlich etwa „mit dem Speer und in die Erde“. Im Zusammenhang bezeichnet sie das Durchbohren und Festheften am Boden.
- source_word: פַּעַם אַחַת
  choice: in einem einzigen Stoß
  rationale: Die Wendung betont, dass eine einzige Speerbewegung genügen soll; „Stoß“ passt zum genannten Speer.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: einen zweiten Stoß brauche ich nicht
  rationale: Das Verb bedeutet „wiederholen, ein zweites Mal tun“. Die deutsche Form macht die im Hebräischen ausgelassene Handlung verständlich und bewahrt Abischais selbstsichere Aussage.
theological_decisions:
- issue: Göttliches Handeln angesichts von Sauls Wehrlosigkeit
  choice: Heute hat Gott deinen Feind in deine Hand gegeben
  alternative: Heute hat Gott deinen Feind deiner Gewalt ausgeliefert
  rationale: Die Übersetzung gibt Abischais Behauptung göttlichen Handelns wieder, ohne seinen Tötungsvorschlag als von Gott gebilligt darzustellen. Die Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede klingt entschlossen und unmittelbar. Das traditionelle Bild „in deine Hand gegeben“ bleibt erhalten; die schwer verständliche räumliche Wendung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote transparent gemacht.
