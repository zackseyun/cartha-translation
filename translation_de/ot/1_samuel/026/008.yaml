  terminology: „Gott“, „deinen Feind“, „in deine Hand gegeben“ und „Speer“ sind angemessen. Die Fußnote erläutert die syntaktisch knappe und semantisch schwierige hebräische Wendung, ohne eine theologische Wertung hinzuzufügen.
