  text: Da schickte David Kundschafter aus und erfuhr, dass Saul tatsächlich gekommen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die letzte hebräische Wendung ist schwer zu deuten. Möglich ist auch: „und stellte mit Gewissheit fest, dass Saul gekommen war“; weniger wahrscheinlich ist eine örtliche Bedeutung wie „an einen bestimmten Ort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte … aus
  rationale: שׁלח bedeutet „senden, schicken“; zusammen mit „Kundschafter“ bezeichnet „ausschicken“ im Deutschen natürlich den Auftrag zur Erkundung.
- source_word: מְרַגְּלִים
  choice: Kundschafter
  rationale: Das Wort bezeichnet Männer, die ein Gebiet oder eine Lage auskundschaften. „Kundschafter“ passt zum militärischen Zusammenhang und ist weniger negativ gefärbt als „Spione“.
- source_word: וַיֵּדַע
  choice: erfuhr
  rationale: ידע bedeutet grundsätzlich „wissen, erkennen“. Nach dem Aussenden der Kundschafter bezeichnet es hier das Erlangen bestätigter Kenntnis.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was David erfuhr.
- source_word: בָא
  choice: gekommen war
  rationale: Die Perfektform stellt Sauls Kommen als bereits eingetretene Tatsache dar; das deutsche Plusquamperfekt gibt die Vorzeitigkeit gegenüber Davids Erkenntnis natürlich wieder.
- source_word: אֶל נָכוֹן
  choice: tatsächlich
  rationale: 'Die ungewöhnliche Wendung wird wahrscheinlich bestätigend verstanden: David stellte mit Gewissheit fest, dass Saul gekommen war. Die Fußnote bewahrt die textliche Schwierigkeit und die mögliche örtliche Deutung.'
- source_word: דָּוִד
  choice: David
  rationale: Eingebürgerte deutsche Namensform.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Eingebürgerte deutsche Namensform.
