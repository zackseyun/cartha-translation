lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: richtete
  rationale: Das Verb שׁפט bezeichnet hier Samuels fortdauerndes Wirken als Richter und Leiter Israels. „Richtete“ bewahrt den kennzeichnenden richterlichen Sinn, ohne die Regierungs- und Leitungsnuance auszuschließen.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Die direkte Objektmarkierung אֶת bleibt unübersetzt; der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: sein Leben lang
  rationale: Diese natürliche deutsche Wendung gibt das hebräische Zeitidiom „alle Tage seines Lebens“ vollständig und verständlich wieder.
