source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּרֹ֑ת וַ/יַּעַבְד֥וּ אֶת יְהוָ֖ה לְ/בַדּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: de
  text: Da entfernten die Israeliten die Baale und die Astarten und dienten allein Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und verehrten Jahwe allein“. Das hebräische Verb kann bei Gott als Objekt sowohl den Dienst als auch die gottesdienstliche Verehrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: entfernten
  rationale: Das Hifil von סור bezeichnet hier das Beseitigen beziehungsweise Wegschaffen der fremden Gottheiten; „entfernten“ ist klar und bewahrt die konkrete Handlung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ fungiert hier als Volksbezeichnung. „Die Israeliten“ ist im heutigen Deutsch natürlich, präzise und schließt das ganze Volk ein.
- source_word: הַבְּעָלִים
  choice: die Baale
  rationale: Der deutsche Plural „Baale“ bewahrt die hebräische Mehrzahl, ohne festzulegen, ob lokale Erscheinungsformen Baals oder deren Kultbilder gemeint sind.
- source_word: הָעַשְׁתָּרֹת
  choice: die Astarten
  rationale: Die Wiedergabe als „Astarten“ bewahrt den Eigennamen und die Pluralform der weiblichen kanaanäischen Gottheit, statt verallgemeinernd „Göttinnen“ zu sagen.
- source_word: וַיַּעַבְדוּ
  choice: dienten
  rationale: עבד kann bei Gott als Objekt sowohl dienen als auch verehren bedeuten. „Dienten“ ist die unmittelbarere Entsprechung und bewahrt den weiteren Sinn umfassender Bundestreue.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner gebräuchlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: '„Allein“ bringt die ausschließliche Hingabe prägnant zum Ausdruck: Ihr Dienst galt keinem anderen Gott.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen, statt ihn durch den traditionellen Ersatztitel zu ersetzen.
- issue: Bedeutungsumfang von עבד
  choice: dienten allein Jahwe
  alternative: verehrten allein Jahwe
  rationale: „Dienten“ erhält den umfassenden Gedanken der Loyalität und des Gehorsams; „verehrten“ ist im kultischen Zusammenhang ebenfalls möglich und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Israeliten“ ist als natürliche Volksbezeichnung gewählt; „Baale“ und „Astarten“ bewahren die konkreten pluralischen Kultnamen. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf dessen Verbalaussage er sich bezieht.
