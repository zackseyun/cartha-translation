  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: de
  text: 'Da sagten die Israeliten zu Samuel: „Hör nicht auf, für uns zu Jahwe, unserem Gott, zu schreien, damit er uns aus der Hand der Philister rettet.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wiedergabe „Söhne Israels“ wäre im heutigen Deutschen missverständlich, da die ganze Volksgemeinschaft gemeint ist. „Die Israeliten“ gibt die feste hebräische Volksbezeichnung natürlich und genau wieder.
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: Hör nicht auf, für uns … um Hilfe zu schreien
  rationale: 'Wörtlich lautet die ungewöhnliche Konstruktion etwa: „Sei nicht still von uns her/von uns weg, vom Schreien“. Im Zusammenhang ist Samuel aufgefordert, sein eindringliches Rufen zu Gott zugunsten Israels nicht einzustellen. Die deutsche Fassung gibt diesen Sinn idiomatisch wieder.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Die Possessivform bewahrt Israels gemeinschaftliche und bundesbezogene Anrede.
- source_word: וְיֹשִׁעֵנוּ
  choice: damit er uns … rettet
  rationale: Das mit וְ angeschlossene Verb drückt hier im Anschluss an die Aufforderung am natürlichsten den beabsichtigten Zweck beziehungsweise das erhoffte Ergebnis aus.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: aus der Hand der Philister
  rationale: Die Wiedergabe erhält das hebräische Bild der „Hand“ als Macht- und Herrschaftsbereich; im Deutschen ist die Wendung verständlich und würdevoll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ macht ihn als Namen sichtbar, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Verhältnis von Samuels Fürbitte zu Gottes Rettung
  choice: „damit er uns … rettet“ als erhoffter Zweck der Fürbitte
  alternative: „und er wird uns … retten“ als sichere Folge
  rationale: Die Verbform lässt Zweck beziehungsweise erwartetes Ergebnis erkennen, behauptet aber nicht unabhängig von Gottes Handeln einen mechanischen Erfolg der Fürbitte.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die sperrige hebräische Wendung mit חרשׁ und מן wird sinngenau und idiomatisch als „Hör nicht auf“ wiedergegeben; זעק behält durch „um Hilfe schreien“ seine Dringlichkeit. Das Bild „aus der Hand“ bleibt erhalten.
