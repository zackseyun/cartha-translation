source:
  edition: WLC
  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: de
  text: So wurden die Philister unterworfen und kamen nicht wieder in das Gebiet Israels. Und die Hand Jahwes war gegen die Philister, solange Samuel lebte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: wurden unterworfen
  rationale: Das Nifal von כנע bezeichnet hier, im militärisch-politischen Zusammenhang, das Unterworfen- beziehungsweise Niedergehaltenwerden nach einer Niederlage.
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: drangen nicht wieder … ein
  rationale: יסף mit עוד verneint eine erneute Handlung. Bei einem feindlichen Eindringen in ein Gebiet ist „eindringen“ im Deutschen natürlicher und kontextgemäß, ohne die Aussage unnötig auszuweiten.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: in das Gebiet Israels
  rationale: גְּבוּל kann Grenze oder Gebiet bezeichnen; hier geht es um das Betreten israelitischen Landes, daher ist „Gebiet“ sachlich und idiomatisch.
- source_word: וַתְּהִי יַד יְהוָה בַּפְּלִשְׁתִּים
  choice: die Hand Jahwes war gegen die Philister
  rationale: Die hebräische Metapher der „Hand“ bleibt erhalten; „gegen“ gibt in diesem Zusammenhang ihre feindliche, machtvolle Wirkung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: solange Samuel lebte
  rationale: Die deutsche Wendung gibt den zeitlichen Sinn von „alle Tage Samuels“ natürlich wieder; die mögliche erzählerische Reichweite wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Charakter als Eigenname.
- issue: Bedeutung der Hand-Jahwes-Metapher
  choice: gegen die Philister
  alternative: auf den Philistern
  rationale: Der unmittelbare militärische Kontext zeigt göttliche Machtausübung zum Nachteil der Philister. „Gegen“ macht diese Richtung deutlich, während „Hand“ als biblische Metapher erhalten bleibt.
- issue: Zeitliche Reichweite von כֹּל יְמֵי שְׁמוּאֵל
  choice: solange Samuel lebte
  alternative: während der ganzen Zeit Samuels
  rationale: Die idiomatische Wiedergabe versteht die Formulierung biografisch. Da sie auch allgemeiner auf Samuels Wirkungszeit bezogen werden kann, wird diese Ambiguität angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Metapher „Hand Jahwes“ bleibt erhalten; Satzbau und Zeitangabe werden für heutige Leser idiomatisch formuliert.
