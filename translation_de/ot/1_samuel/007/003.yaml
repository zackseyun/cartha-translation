source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: de
  text: 'Da sagte Samuel zum ganzen Haus Israel: „Wenn ihr mit eurem ganzen Herzen zu Jahwe zurückkehrt, dann entfernt die fremden Götter und die Astarten[a] aus eurer Mitte, richtet euer Herz auf Jahwe aus[b] und dient ihm allein. Und er wird euch aus der Hand der Philister[c] retten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch steht hier eine Mehrzahlform des Namens Astarte. Gemeint sind wahrscheinlich Erscheinungsformen, Kultbilder oder örtliche Ausprägungen dieser Göttin.
    reason: cultural_note
  - marker: b
    text: 'Oder: „bereitet euer Herz für Jahwe“.'
    reason: lexical_alternative
  - marker: c
    text: „Aus der Hand der Philister“ ist ein hebräisches Bild für die Befreiung aus ihrer Gewalt.
    reason: idiom_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte Samuel
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: zum ganzen Haus Israel
  rationale: Bewahrt das korporative Bild des hebräischen Ausdrucks, ohne es zu „ganz Israel“ einzuebnen.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: Wenn ihr mit eurem ganzen Herzen zu Jahwe zurückkehrt
  rationale: „Zurückkehrt“ bildet שׁוב und die partizipiale, auf Umkehr ausgerichtete Aussage ab; „mit eurem ganzen Herzen“ bewahrt den hebräischen Ausdruck für ungeteilte Hingabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder.
- source_word: הָסִירוּ אֶת אֱלֹהֵי הַנֵּכָר מִתּוֹכְכֶם וְהָעַשְׁתָּרֹת
  choice: dann entfernt die fremden Götter und die Astarten aus eurer Mitte
  rationale: „Entfernt“ ist ein klarer Imperativ; „aus eurer Mitte“ bezieht sich entsprechend der hebräischen Struktur auf beide Gruppen. Die Pluralform „Astarten“ bleibt als solche erhalten.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: richtet euer Herz auf Jahwe
  rationale: כּון mit „Herz“ bezeichnet hier ein festes Ausrichten oder Bereitmachen; die Formulierung ist natürlich und lässt die alternative Nuance „bereitet euer Herz“ offen.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: und dient ihm allein
  rationale: „Dienen“ bewahrt die Breite von עבד, die kultische Verehrung, Gehorsam und ausschließliche Loyalität umfasst.
- source_word: וְיַצֵּל אֶתְכֶם מִיַּד פְּלִשְׁתִּים
  choice: Dann wird er euch aus der Hand der Philister retten
  rationale: Das Hiphil von נצל bedeutet „retten/befreien“. „Aus der Hand“ bewahrt das konkrete hebräische Machtbild; „Dann“ verdeutlicht den erwarteten Folgezusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Bundes- und Eigenname.
- issue: Bedeutung der Rückkehr in שָׁבִים
  choice: zu Jahwe zurückkehrt
  alternative: euch Jahwe wieder zuwendet
  rationale: „Zurückkehrt“ wahrt das Grundbild der Umkehr und erneuerten Bundestreue, ohne eine spätere dogmatische Kategorie in den Text einzutragen.
- issue: Umfang von עבד
  choice: dient ihm allein
  alternative: betet ihn allein an
  rationale: „Dienen“ ist weiter als „anbeten“ und umfasst sowohl Gottesverehrung als auch Gehorsam und ausschließliche Zugehörigkeit.
- issue: Verhältnis zwischen den Aufforderungen und der Rettungszusage
  choice: Dann wird er euch ... retten
  alternative: und er wird euch ... retten
  rationale: Das hebräische וְיַצֵּל kann als anschließende Folge beziehungsweise Zusage verstanden werden. „Dann“ macht diesen Zusammenhang lesbar, ohne die Rettung als menschlichen Verdienst zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das korporative Bild „Haus Israel“, der Gottesname „Jahwe“ und die Machtmetapher „aus der Hand“ bleiben erhalten. Die Anrede wechselt nicht, und die Imperative sind klar und unmittelbar formuliert.
