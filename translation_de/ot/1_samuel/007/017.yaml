  terminology: „Rama“, „Altar“ und „Jahwe“ sind sachgerecht. „Jahwe einen Altar bauen“ ist eine im Deutschen mögliche Dativkonstruktion und gibt die Widmung mit לְ angemessen wieder, ohne eine unnötig engere Deutung einzutragen.
