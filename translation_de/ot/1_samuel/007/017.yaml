  text: וּ/תְשֻׁבָת֤/וֹ הָ/רָמָ֨תָ/ה֙ כִּֽי שָׁ֣ם בֵּית֔/וֹ וְ/שָׁ֖ם שָׁפָ֣ט אֶת יִשְׂרָאֵ֑ל וַ/יִּֽבֶן שָׁ֥ם מִזְבֵּ֖חַ לַֽ/יהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: de
  text: Dann kehrte er nach Rama zurück[a], denn dort war sein Haus, und dort richtete er Israel. Dort baute er Jahwe einen Altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und seine Rückkehr war nach Rama.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: Dann kehrte er zurück
  rationale: Das Substantiv תְּשׁוּבָה mit Suffix bedeutet wörtlich „seine Rückkehr“. Im Zusammenhang mit Samuels regelmäßigem Rundgang in Vers 16 gibt die verbale Formulierung den wiederkehrenden Vorgang natürlich wieder; „dann“ nimmt den erzählerischen Anschluss durch ו auf.
- source_word: הָרָמָתָה
  choice: nach Rama
  rationale: Das direktionale ה am Ortsnamen bezeichnet eine Bewegung auf Rama zu; im Deutschen ist „nach Rama“ die natürliche Entsprechung.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Samuels Rückkehr nach Rama ein.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: בַּיִת bezeichnet hier konkret Samuels Wohnhaus beziehungsweise Wohnsitz. „Haus“ wahrt die konkrete Ausdrucksweise des Hebräischen.
- source_word: וְשָׁם
  choice: und dort
  rationale: Die Wiederholung von שָׁם wird bewahrt, weil sie Rama als Mittelpunkt von Samuels Wirken hervorhebt.
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: richtete er Israel
  rationale: שׁפט bezeichnet Samuels umfassende Tätigkeit als Richter und Leiter Israels. „Israel richten“ ist prägnant und bewahrt den historischen Rollenbegriff.
- source_word: וַיִּבֶן שָׁם
  choice: Dort baute er
  rationale: Das Wayyiqtol führt die Erzählung fort. Eine zusätzliche Bedeutung wie „auch“ wird nicht eingefügt; die Voranstellung von „dort“ bewahrt die dritte Wiederaufnahme des Ortsadverbs.
- source_word: מִזְבֵּחַ
  choice: einen Altar
  rationale: Dies ist die übliche und sachlich genaue Wiedergabe von מִזְבֵּחַ.
- source_word: לַיהוָה
  choice: Jahwe einen Altar
  rationale: Die Präposition ל bezeichnet hier den Empfänger beziehungsweise die Widmung des Altars. Die deutsche Dativkonstruktion ist natürlich; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁפט
  choice: richtete Israel
  alternative: regierte Israel / sprach Israel Recht
  rationale: Das Verb umfasst in diesem Zusammenhang sowohl Rechtsprechung als auch Leitung. Die traditionelle Rollenbezeichnung „richten“ hält diesen Bedeutungsumfang offen, statt ihn auf Regierung oder gerichtliche Entscheidungen einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Ortsbetonung („dort“) und die knappe hebräische Satzführung bleiben erhalten. Das iterative Verständnis von Samuels Rückkehr ergibt sich aus dem vorausgehenden Rundgang; die Fußnote dokumentiert die nominale Form des Ausgangstextes.
