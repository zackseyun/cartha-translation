  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Elemente des Hebräischen zuverlässig wieder: die Rückkehr nach Rama, die Begründung mit Samuels Haus, das wiederholte „dort“, sein Richten Israels und den Altar für Jahwe. Die verbalisierte, durch „Dann“ angeschlossene Wiedergabe von וּתְשֻׁבָתוֹ ist im Kontext des regelmäßigen Rundgangs aus V. 16 angemessen; die Fußnote hält die nominale Form fest.'
