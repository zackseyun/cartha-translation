  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִן הַ/מִּצְפָּ֔ה וַֽ/יִּרְדְּפ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יַּכּ֕וּ/ם עַד מִ/תַּ֖חַת לְ/בֵ֥ית כָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: de
  text: Da zogen die Männer Israels von Mizpa aus, verfolgten die Philister und schlugen sie bis unterhalb von Bet-Kar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „bis unterhalb von Bet-Kar“, wahrscheinlich eine Stelle, die tiefer als Bet-Kar lag.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Da zogen … aus
  rationale: Das Qal-Narrativverb von יצא bezeichnet hier das Hinausziehen vom Versammlungsort; „zogen … aus“ ist im militärischen Zusammenhang natürlich und würdig.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Die konkrete maskuline Bezeichnung wird bewahrt, da im Kontext die zum Kampf ausziehenden Männer gemeint sind.
- source_word: מִן הַמִּצְפָּה
  choice: von Mizpa aus
  rationale: Der Ortsname wird in der im Deutschen verbreiteten Form „Mizpa“ wiedergegeben; „von … aus“ bezeichnet klar den Ausgangspunkt.
- source_word: וַיִּרְדְּפוּ
  choice: verfolgten
  rationale: רדף bezeichnet im militärischen Kontext die Verfolgung eines fliehenden Gegners.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Übliche deutsche Bezeichnung des Volkes.
- source_word: וַיַּכּוּם
  choice: schlugen sie
  rationale: נכה kann im Kampf schlagen, niederschlagen oder besiegen bedeuten. „Schlugen sie“ bewahrt die lexikalische Offenheit, ohne ausdrücklich zu behaupten, alle seien getötet worden.
- source_word: עַד מִתַּחַת
  choice: bis unterhalb von
  rationale: עַד bezeichnet die räumliche Grenze, מִתַּחַת eine tiefer gelegene Stelle in Bezug auf Bet-Kar.
- source_word: לְבֵית כָּר
  choice: Bet-Kar
  rationale: Der Ortsname wird transliteriert und nicht als „Haus der Weide“ gedeutet.
