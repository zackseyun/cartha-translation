  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: de
  text: Da nahm Samuel ein Milchlamm[a] und brachte es Yahweh als vollständiges Brandopfer dar. Samuel schrie zu Yahweh für Israel, und Yahweh antwortete ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bezeichnet ein junges Lamm, das noch von Milch lebt; auch: „ein säugendes Lamm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: ein einziges Milchlamm
  rationale: טְלֶה bezeichnet ein junges Schaf, חָלָב verweist auf Milch; „Milchlamm“ ist im Deutschen die knappe Bezeichnung für ein noch von Milch lebendes Lamm. אֶחָד wird mit „ein einziges“ wiedergegeben.
- source_word: וַיַּעֲלֵה
  choice: brachte es … dar
  rationale: Der Hifil von עלה ist hier der übliche Opferausdruck. „Darbringen“ gibt den kultischen Vorgang natürlich und präzise wieder.
- source_word: עוֹלָה כָּלִיל
  choice: vollständig als Brandopfer
  rationale: עוֹלָה bezeichnet das Brandopfer; כָּלִיל betont, dass es vollständig dargebracht beziehungsweise verbrannt wurde.
- source_word: לַיהוָה / אֶל־יְהוָה
  choice: Yahweh / zu Yahweh
  rationale: Der Gottesname יהוה wird als „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּזְעַק
  choice: schrie … zu
  rationale: זעק bezeichnet einen dringlichen Hilferuf. „Schrie zu“ bewahrt die Intensität stärker als das allgemeinere „betete“.
- source_word: בְּעַד יִשְׂרָאֵל
  choice: für Israel
  rationale: בְּעַד bezeichnet hier das Eintreten zugunsten Israels; „für Israel“ ist natürlich und lässt den Fürbittecharakter aus dem Zusammenhang hervorgehen.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: Yahweh erhörte ihn
  rationale: ענה bedeutet antworten; in Verbindung mit einem Hilferuf ist „erhören“ im Deutschen idiomatisch und schließt eine wirksame Antwort ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Transliteration bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art von Yahwehs Antwort
  choice: erhörte ihn
  alternative: antwortete ihm
  rationale: Im Kontext des dringlichen Hilferufs ist „erhörte ihn“ idiomatisch; es deutet die Antwort als Eingehen auf den Ruf, ohne den nachfolgenden Inhalt vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen; kultische Fachsprache wird verständlich wiedergegeben. „Milchlamm“ wird durch eine Fußnote erläutert.
