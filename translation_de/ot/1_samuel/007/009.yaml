    issue: „Yahweh erhörte ihn“ statt „Yahweh antwortete ihm“
    rationale: ענה bezeichnet hier „antworten“. Zwar kann „erhören“ im Kontext idiomatisch sein, doch es interpretiert die Art der Antwort günstiger und stärker als der hebräische Text es an dieser Stelle ausdrückt.
  - severity: low
    issue: „ein einziges Milchlamm“
    rationale: אֶחָד bedeutet hier regulär „ein/eines“. „Ein einziges“ kann im Deutschen eine exklusive oder betonte Einzigkeit ausdrücken, die der Text nicht eigens markiert.
  revised_text: Da nahm Samuel ein Milchlamm[a] und brachte es Yahweh als vollständiges Brandopfer dar. Samuel schrie zu Yahweh für Israel, und Yahweh antwortete ihm.
