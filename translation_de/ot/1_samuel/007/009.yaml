  to: Da nahm Samuel ein Milchlamm[a] und brachte es Yahweh als vollständiges Brandopfer dar. Samuel schrie zu Yahweh für Israel, und Yahweh antwortete ihm.
  rationale: Die Revision stellt bei Yahwehs Reaktion die ausdrückliche Bedeutung „antwortete ihm“ wieder her und vermeidet bei אֶחָד eine nicht erforderliche Betonung. Die Opferterminologie, der Gottesname und die erklärende Fußnote bleiben erhalten.
