  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: de
  text: Während Samuel das Brandopfer darbrachte, rückten die Philister zum Kampf gegen Israel heran. Doch Jahwe donnerte an jenem Tag mit gewaltigem Donner[a] gegen die Philister und versetzte sie in Verwirrung, sodass sie vor Israel geschlagen wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit großem Schall“. Möglich ist auch: „mit mächtigem Donner“ oder „mit gewaltigem Getöse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: darbrachte
  rationale: Das Hifil-Partizip bezeichnet hier das Darbringen des Opfers; die mit „während“ gebildete Konstruktion gibt den andauernden Hintergrund der Handlung natürlich wieder.
- source_word: הָעוֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist die übliche Bezeichnung für das vollständig verbrannte Opfer; „Brandopfer“ ist im Deutschen der etablierte und verständliche Ausdruck.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: rückten ... zum Kampf gegen Israel heran
  rationale: Die Formulierung bewahrt die Annäherungsbewegung von נגשׁ und gibt den feindlichen Sinn der Präposition ב im militärischen Zusammenhang idiomatisch mit „gegen“ wieder.
- source_word: וַיַּרְעֵם
  choice: ließ ... donnern
  rationale: Das Verb רעם bezeichnet Donnern. Die deutsche Wendung mit „ließ“ bringt die göttliche Verursachung beziehungsweise das von Jahwe ausgehende Donnern natürlich zum Ausdruck.
- source_word: בְּקוֹל גָּדוֹל
  choice: mit gewaltigem Donner
  rationale: Wörtlich steht „mit großer Stimme/großem Schall“. Im unmittelbaren Zusammenhang mit רעם bezeichnet die Wendung einen mächtigen Donnerschall; die Fußnote bewahrt die lexikalische Breite.
- source_word: וַיְהֻמֵּם
  choice: versetzte sie in Verwirrung
  rationale: Das kausative Verb beschreibt von Gott ausgelöste Verwirrung oder Panik im Kampf, ohne bereits die folgende Niederlage vorwegzunehmen.
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: sodass sie vor Israel geschlagen wurden
  rationale: Der Nifal von נגף bezeichnet im militärischen Kontext eine Niederlage. „Vor Israel geschlagen“ erhält die hebräische Wendung לִפְנֵי und ist zugleich verständliches, gehobenes Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Art des göttlichen Eingreifens
  choice: Jahwe ließ mit gewaltigem Donner über den Philistern donnern
  alternative: Jahwe erhob mit gewaltiger Stimme seine Stimme gegen die Philister
  rationale: רעם benennt Donnern, während קוֹל für Schall oder Stimme stehen kann. Im Zusammenhang wird Naturdonner am unmittelbarsten nahegelegt; die mögliche wörtlichere Wiedergabe von קוֹל bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau macht die Gleichzeitigkeit von Samuels Opferhandlung und dem Vorrücken der Philister deutlich. Militärische und kultische Fachbegriffe bleiben verständlich; die Fußnote wahrt die Bedeutungsbreite von קוֹל גָּדוֹל.
