source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: de
  text: Als die Philister hörten, dass sich die Israeliten in Mizpa versammelt hatten[a], zogen die Fürsten der Philister gegen Israel herauf. Als die Israeliten davon hörten, fürchteten sie sich vor den Philistern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach Mizpa“. Der hebräische Ortsname trägt eine Richtungsendung; der Zusammenhang zeigt jedoch, dass das Volk dort versammelt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: hörten / davon hörten
  rationale: שׁמע bezeichnet hier das Erfahren einer Nachricht. Die Wiederholung des Verbs bleibt im Deutschen erhalten; beim zweiten Vorkommen macht „davon“ den im Hebräischen unausgesprochenen Bezug auf den feindlichen Aufmarsch natürlich verständlich.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Bezeichnung bedeutet das Volk Israel. „Die Israeliten“ ist im modernen Deutschen natürlich, genau und schließt das ganze versammelte Volk ein.
- source_word: הִתְקַבְּצוּ
  choice: sich versammelt hatten
  rationale: Der Hitpael von קבץ bezeichnet das Zusammenkommen zu einer Versammlung. Das Plusquamperfekt verdeutlicht, dass die Versammlung der Nachricht und dem Aufmarsch vorausging.
- source_word: הַמִּצְפָּתָה
  choice: in Mizpa
  rationale: Die Form trägt eine Richtungsendung, doch der Zusammenhang beschreibt die Israeliten als bereits dort versammelt. „In Mizpa“ gibt den gemeinten Aufenthaltsort idiomatisch wieder; die formale Alternative wird in der Fußnote genannt.
- source_word: וַיַּעֲלוּ
  choice: zogen ... herauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung und wird in militärischen Erzählungen für das Heranziehen verwendet. „zogen ... herauf“ bewahrt sowohl die Bewegung als auch den militärischen Zusammenhang, ohne die Art des Angriffs auszuschmücken.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: die Fürsten der Philister
  rationale: סְרָנִים ist die besondere Bezeichnung für die anerkannten politischen und militärischen Machthaber der Philister. „Fürsten“ ist würdig und im Deutschen verständlicher als eine künstliche Transliteration.
- source_word: אֶל יִשְׂרָאֵל
  choice: gegen Israel
  rationale: אֶל bedeutet grundsätzlich „zu/auf ... zu“, bezeichnet hier aber im militärischen Kontext eindeutig eine feindliche Bewegung. „gegen Israel“ gibt diese Beziehung natürlich wieder.
- source_word: וַיִּרְאוּ מִפְּנֵי פְלִשְׁתִּים
  choice: fürchteten sie sich vor den Philistern
  rationale: Die Verbindung von ירא mit מִפְּנֵי drückt Furcht angesichts einer Person oder Gruppe aus. Die deutsche Wendung entspricht dem Sinn und bleibt nahe an der hebräischen Formulierung.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die Wiederholung von „hörten“ und die militärische Bewegungsrichtung des hebräischen Textes bleiben erhalten. „Israeliten“ wird als natürliche deutsche Wiedergabe der festen Wendung „Söhne Israels“ verwendet.
