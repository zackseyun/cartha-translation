base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: de
  text: Jahr für Jahr zog er umher und machte die Runde über Bethel, Gilgal und Mizpa; an all diesen Orten richtete er Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלַךְ
  choice: zog er umher
  rationale: Das Qatal bezeichnet zusammen mit der jährlichen Zeitangabe eine wiederkehrende Gewohnheit Samuels. Das deutsche Präteritum im Kontext von »Jahr für Jahr« gibt diesen iterativen Sinn natürlich wieder.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: Jahr für Jahr
  rationale: Die idiomatische Wendung bezeichnet eine regelmäßige jährliche Wiederholung und lässt sich im Deutschen knapp und rhythmisch entsprechend wiedergeben.
- source_word: וְסָבַב
  choice: machte seine Runde über
  rationale: סבב bezeichnet hier das regelmäßige Bereisen einer Route mit mehreren Stationen. »Seine Runde machen über« vermittelt den wiederkehrenden Rundweg, ohne mehr über dessen genaue Form zu behaupten.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Im modernen deutschen Bibelgebrauch übliche Form des Ortsnamens.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Im Deutschen übliche Umschrift des Ortsnamens.
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Die im deutschen Bibelgebrauch verbreitete Form des Ortsnamens.
- source_word: וְשָׁפַט
  choice: richtete er
  rationale: Das Verb שפט umfasst richterliche Rechtsprechung und kann im Kontext zugleich Samuels leitende Funktion anklingen lassen. »Richten« bewahrt diese semantische Breite.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Bezeichnet das Volk Israel als Gegenstand von Samuels richterlicher Tätigkeit.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: an all diesen Orten
  rationale: Obwohl אֵת gewöhnlich den bestimmten direkten Gegenstand markiert, wird die Wortgruppe hier am besten lokal auf Samuels richterliche Tätigkeit bezogen; »an all diesen Orten« ist dafür natürliches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Reisetätigkeit wird klar ausgedrückt; »richtete« bewahrt den traditionellen und zugleich breiten Sinn von שפט. Keine Fußnoten erforderlich, da die möglichen Varianten im Deutschen ohne sachlichen Verlust in der Hauptübersetzung aufgefangen werden.
