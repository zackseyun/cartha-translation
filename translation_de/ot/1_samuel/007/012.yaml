source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶ֣בֶן אַחַ֗ת וַ/יָּ֤שֶׂם בֵּֽין הַ/מִּצְפָּה֙ וּ/בֵ֣ין הַ/שֵּׁ֔ן וַ/יִּקְרָ֥א אֶת שְׁמָ֖/הּ אֶ֣בֶן הָעָ֑זֶר וַ/יֹּאמַ֕ר עַד הֵ֖נָּה עֲזָרָ֥/נוּ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: de
  text: 'Dann nahm Samuel einen Stein und stellte ihn zwischen Mizpa und Schen auf. Er gab ihm den Namen Eben-Eser[a], denn er sagte: »Bis hierher hat der HERR uns geholfen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eben-Eser bedeutet »Stein der Hilfe«.
    reason: Der hebräische Name ist sprechend und erklärt Samuels anschließende Aussage.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: einen Stein
  rationale: Im Deutschen ist die unmarkierte Wiedergabe natürlich; das Zahlwort אַחַת individualisiert den einzelnen Gedenkstein, ohne dass »einen einzigen Stein« gemeint sein muss.
- source_word: וַיָּשֶׂם
  choice: stellte ihn … auf
  rationale: Bei einem als Denkzeichen gesetzten Stein gibt »aufstellen« die konkrete Handlung natürlicher wieder als das allgemeinere »setzen«.
- source_word: אֶבֶן הָעָזֶר
  choice: Eben-Eser
  rationale: Der überlieferte Orts- bzw. Denkmalname wird transliteriert; seine hebräische Bedeutung wird in einer Fußnote erläutert.
- source_word: עַד הֵנָּה
  choice: Bis hierher
  rationale: 'Bewahrt die räumlich-zeitliche Offenheit des Hebräischen: Gemeint sein kann sowohl dieser Ort als auch dieser Punkt im bisherigen Geschehen.'
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im deutschen Bibelgebrauch vertraute Wiedergabe des Gottesnamens durch HERR in Kapitälchen wird beibehalten.
theological_decisions:
- issue: Reichweite von עַד הֵנָּה
  choice: Bis hierher hat der HERR uns geholfen.
  alternative: Bis zu diesem Zeitpunkt hat der HERR uns geholfen.
  rationale: »Bis hierher« erhält die bewusste Doppeldeutigkeit zwischen örtlichem und zeitlichem Bezug und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze sorgen für Klarheit; Eigennamen folgen einer gut lesbaren deutschen Transliteration. Die Formulierung bewahrt die Mehrdeutigkeit des hebräischen Ausdrucks עַד הֵנָּה.
