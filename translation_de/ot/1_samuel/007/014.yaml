source:
  edition: WLC
  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: de
  text: Die Städte, die die Philister Israel weggenommen hatten, fielen wieder an Israel, von Ekron bis Gat. Auch das Gebiet dieser Städte entriss Israel der Hand der Philister. Und zwischen Israel und den Amoritern[a] herrschte Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: den Kanaanitern. »Amoriter« kann hier als umfassendere Bezeichnung für die Völker des Landes verstanden sein.'
    reason: Bewahrt die mögliche weitere Bedeutung des Ethnonyms, ohne den Wortlaut des hebräischen Haupttextes zu ersetzen.
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: fielen wieder an Israel
  rationale: Das Verb שׁוב bezeichnet hier die Rückkehr der Städte unter israelitische Herrschaft. Die idiomatische deutsche Wendung vermeidet eine unnatürliche Personifizierung und wahrt den politischen Sinn.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: Die übliche Wiedergabe von עָרִים passt zum Zusammenhang befestigter Orte und territorialer Herrschaft.
- source_word: אֲשֶׁר לָקְחוּ פְלִשְׁתִּים מֵאֵת יִשְׂרָאֵל
  choice: die die Philister Israel weggenommen hatten
  rationale: Das Plusquamperfekt macht die Vorzeitigkeit gegenüber der Rückgewinnung deutlich; »weggenommen« gibt den Herrschaftswechsel natürlich wieder.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: von Ekron bis Gat
  rationale: Die knappe geografische Spannweite des Hebräischen wird unmittelbar wiedergegeben.
- source_word: וְאֶת גְּבוּלָן
  choice: auch das zu ihnen gehörende Gebiet
  rationale: גְּבוּל kann Grenze oder Gebiet bedeuten. Das feminine Pluralsuffix bezieht sich grammatisch am ehesten auf die Städte; die Formulierung macht diesen Bezug im Deutschen klar.
- source_word: הִצִּיל ... מִיַּד פְּלִשְׁתִּים
  choice: entriss ... der Hand der Philister
  rationale: הִצִּיל im Hifil bezeichnet das Entreißen oder Retten aus fremder Gewalt. Die Wendung bewahrt das konkrete hebräische Bild von der feindlichen Hand.
- source_word: וַיְהִי שָׁלוֹם
  choice: herrschte Frieden
  rationale: Eine natürliche deutsche Wiedergabe des Existenzsatzes, die einen Zustand friedlicher Beziehungen bezeichnet.
- source_word: הָאֱמֹרִי
  choice: den Amoritern
  rationale: Der masoretische Text nennt ausdrücklich den Amoriter, kollektiv gebraucht. Der Haupttext bewahrt daher das konkrete Ethnonym.
theological_decisions:
- issue: Bedeutungsumfang von הָאֱמֹרִי am Versende
  choice: den Amoritern
  alternative: den Kanaanitern
  rationale: Der hebräische Text nennt die Amoriter ausdrücklich. Da die Bezeichnung hier möglicherweise weiter gefasst ist und die kanaanitischen Bewohner des Landes insgesamt meint, wird diese Deutung in der Fußnote offengehalten, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist gut verständlich, behält aber mit »der Hand der Philister« ein tragfähiges hebräisches Bild bei. Der Bezug des femininen Pluralsuffixes in גְּבוּלָן auf die zuvor genannten Städte wird ausdrücklich verdeutlicht.
