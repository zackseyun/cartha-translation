  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: de
  text: 'Dann sagte Samuel: »Versammelt ganz Israel in Mizpa, und ich werde für euch zu Jahwe beten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Dann sagte« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Die im Deutschen übliche Namensform.
- source_word: קִבְצוּ
  choice: Versammelt
  rationale: Der Imperativ Plural bezeichnet hier das Zusammenrufen des Volkes; »versammelt« ist im Deutschen präzise und idiomatisch.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bewahrt den kollektiven Bezug auf das gesamte Volk ohne unnötige Ausweitung.
- source_word: הַמִּצְפָּתָה
  choice: in Mizpa
  rationale: Die Richtungsendung bezeichnet eine Bewegung nach Mizpa. Beim deutschen Verb »versammeln« drückt »in Mizpa« idiomatisch den Ziel- und Versammlungsort aus.
- source_word: וְאֶתְפַּלֵּל
  choice: und ich werde … beten
  rationale: Das Imperfekt der 1. Person Singular nach dem Imperativ bezeichnet Samuels beabsichtigte anschließende Handlung.
- source_word: בַּעַדְכֶם
  choice: für euch
  rationale: Gibt die fürbittende Bedeutung von בְּעַד in natürlichem, klarem Deutsch wieder.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל wird beim Verb »beten« natürlich mit »zu« wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«, wodurch der Eigenname erkennbar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den Charakter des offenbarten Eigennamens und folgt der vorliegenden aktualisierten Projektentscheidung, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und verbindlich; »Mizpa« folgt der etablierten deutschen Form des Ortsnamens.
