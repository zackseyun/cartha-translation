  terminology: „Lade Jahwes“, „Kirjat-Jearim“, „Abinadab“ und „Eleasar“ sind angemessen. Die Fußnoten sind korrekt an die jeweiligen Begriffe angeheftet; die alternative Ortsnamenlesung sollte als mögliche, nicht als notwendige Deutung gekennzeichnet bleiben.
