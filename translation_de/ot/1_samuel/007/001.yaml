  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: de
  text: Da kamen die Männer von Kirjat-Jearim und brachten die Lade Jahwes[a] hinauf. Sie brachten sie in das Haus Abinadabs auf dem Hügel[b]. Seinen Sohn Eleasar weihten sie dazu, die Lade Jahwes zu hüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text verwendet den Gottesnamen JHWH; hier mit „Jahwe“ wiedergegeben. Traditionell wird er mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder, falls das hebräische Wort als Ortsname verstanden wird: „in Gibea“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Der Qal-Wayyiqtol von בוא führt die Erzählung fort; „Da kamen“ gibt sowohl das Kommen als auch die narrative Abfolge natürlich wieder.
- source_word: אַנְשֵׁי קִרְיַת יְעָרִים
  choice: die Männer von Kirjat-Jearim
  rationale: אַנְשֵׁי bezeichnet hier ausdrücklich die Männer; der Ortsname wird in einer im Deutschen geläufigen Transliteration wiedergegeben.
- source_word: וַיַּעֲלוּ
  choice: holten ... hinauf
  rationale: Der Hifil von עלה bezeichnet das Hinaufbringen. „Holten ... hinauf“ passt zum vorangehenden Kommen der Männer und bewahrt die Richtungsangabe.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: „Lade“ ist die etablierte kultische Bezeichnung für אֲרוֹן; der Eigenname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֶל בֵּית אֲבִינָדָב
  choice: in das Haus Abinadabs
  rationale: אֶל bezeichnet bei diesem Bewegungsverb das Ziel; „in das Haus“ ist im Deutschen natürlich und lässt offen, ob das Gebäudeinnere oder der Hausbereich gemeint ist.
- source_word: בַּגִּבְעָה
  choice: auf dem Hügel
  rationale: Die Form mit Artikel lässt sich am unmittelbarsten als Gattungsbezeichnung „auf dem Hügel“ verstehen, nicht zwingend als Ortsname.
- source_word: וְאֶת אֶלְעָזָר בְּנוֹ
  choice: Seinen Sohn Eleasar aber
  rationale: Die vorangestellte Akkusativgruppe wird im Deutschen hervorgehoben wiedergegeben; „seinen“ bezieht sich im nächsten Kontext auf Abinadab. „Aber“ markiert den Themenwechsel, ohne einen starken Gegensatz zu behaupten.
- source_word: קִדְּשׁוּ
  choice: weihten sie dazu
  rationale: קדשׁ bezeichnet das Aussondern für eine heilige Aufgabe. „Weihten“ bewahrt den kultischen Gehalt und ist allgemein verständlich.
- source_word: לִשְׁמֹר
  choice: zu hüten
  rationale: שׁמר umfasst Bewachen und sorgsame Obhut. „Hüten“ bewahrt beide Aspekte besser als das im Deutschen missverständliche „halten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen יהוה. „Jahwe“ macht diesen Befund transparent; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
- issue: Deutung von בַּגִּבְעָה
  choice: auf dem Hügel
  alternative: in Gibea
  rationale: Der Artikel spricht zunächst für das gewöhnliche Substantiv „der Hügel“. Da eine Deutung als Ortsname möglich bleibt, wird sie als Alternative vermerkt.
- issue: Bezug des Suffixes in בְּנוֹ
  choice: Abinadabs Sohn
  alternative: Sohn einer nicht ausdrücklich wiederholten Bezugsperson
  rationale: Abinadab ist die nächstliegende männliche Bezugsperson. Der deutsche Text bewahrt mit „seinen Sohn“ die Form des Hebräischen, während der Kontext den Bezug erkennen lässt.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählbewegung. „Kirjat-Jearim“, „Eleasar“ und „Jahwe“ folgen gebräuchlichen deutschen Formen. Die beiden Sätze vermeiden eine schwerfällige Aneinanderreihung, ohne die Abfolge der hebräischen Verben einzuebnen.
