source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: de
  text: 'Da versammelten sie sich in Mizpa[a], schöpften Wasser und gossen es vor Jahwe aus.[b] An jenem Tag fasteten sie und sagten dort: »Wir haben gegen Jahwe gesündigt.« Und Samuel übte in Mizpa das Richteramt über die Israeliten[c] aus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Mizpa«. Die hebräische Form beim ersten Vorkommen enthält eine Richtungsendung.'
    reason: lexical_alternative
  - marker: b
    text: Das Ausgießen des Wassers vor Jahwe steht hier im Zusammenhang mit Fasten und Sündenbekenntnis; seine genaue symbolische Bedeutung erklärt der Text nicht.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »die Söhne Israels«; gemeint ist das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: sie versammelten sich
  rationale: Der Niphal bezeichnet hier das Zusammenkommen der Menschen, ohne einen äußeren Handelnden zu nennen. Die reflexive deutsche Form ist natürlich und quellennah.
- source_word: הַמִּצְפָּתָה / בַּמִּצְפָּה
  choice: in Mizpa
  rationale: Die erste Form trägt eine Richtungsendung und kann wörtlich „nach Mizpa“ heißen; im Zusammenhang mit „sich versammeln“ bezeichnet „in Mizpa“ idiomatisch Ziel und Ort. Die Schlussform bedeutet eindeutig „in/bei Mizpa“.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: schöpften Wasser
  rationale: שׁאב bezeichnet gewöhnlich das Schöpfen von Wasser; die direkte Wiedergabe ist im Deutschen geläufig.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: gossen es vor Jahwe aus
  rationale: Das Pronomen „es“ nimmt das zuvor genannte Wasser auf. לִפְנֵי wird mit „vor“ wiedergegeben und lässt sowohl räumliche als auch kultische Gegenwart anklingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: An jenem Tag fasteten sie
  rationale: Die Formulierung gibt Handlung und Zeitangabe direkt, klar und in natürlicher deutscher Wortstellung wieder.
- source_word: חָטָאנוּ לַיהוָה
  choice: Wir haben gegen Jahwe gesündigt
  rationale: Das Perfekt bringt die eingestandene Schuld mit ihrer gegenwärtigen Bedeutung zum Ausdruck; ל bezeichnet hier die Person, gegen die gesündigt wurde.
- source_word: וַיִּשְׁפֹּט
  choice: übte das Richteramt aus
  rationale: שׁפט kann Rechtsprechung, Leitung und die Tätigkeit eines Richters umfassen. „Das Richteramt ausüben“ bewahrt diese Rollenbezeichnung, ohne sie auf einen einzelnen Gerichtsentscheid zu verengen.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“; als kollektive Bezeichnung meint der Ausdruck hier das Volk Israel. „Die Israeliten“ ist präzise und in modernem Deutsch natürlich.
theological_decisions:
- issue: Bedeutung des Ausgießens von Wasser
  choice: Die Handlung wird im Haupttext wörtlich wiedergegeben, ohne ihre Symbolik festzulegen.
  alternative: Das Ausgießen ausdrücklich als Zeichen der Buße, Klage oder Selbsthingabe deuten.
  rationale: Der Vers verbindet die Handlung mit Fasten und Sündenbekenntnis, erklärt ihre genaue symbolische Bedeutung jedoch nicht. Die Übersetzung wahrt diese Offenheit.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den persönlichen Gottesnamen des hebräischen Textes; der traditionelle Ersatztitel bleibt als mögliche Übersetzungspraxis anerkannt.
- issue: Umfang von Samuels Tätigkeit als שׁפט
  choice: übte das Richteramt aus
  alternative: richtete / regierte / sprach Recht
  rationale: Die gewählte Formulierung hält offen, ob hier vor allem Rechtsprechung, Führung oder beides gemeint ist, und vermeidet eine unnötige Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, klare Sätze bewahren den erzählerischen Ablauf. „Jahwe“ gibt den Eigennamen wieder; „das Richteramt ausüben“ ist bewusst etwas formeller, damit die mögliche Breite von Samuels Aufgabe erhalten bleibt.
