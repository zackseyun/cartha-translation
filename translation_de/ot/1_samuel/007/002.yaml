revisions:
- from: Von dem Tag an, an dem die Lade in Kirjat-Jearim blieb, vergingen viele Tage, und es wurden zwanzig Jahre. Da trauerte das ganze Haus Israel Jahwe nach.[a]
  to: Von dem Tag an, an dem die Lade in Kirjat-Jearim blieb, vergingen viele Tage, nämlich zwanzig Jahre; und das ganze Haus Israel klagte zu Jahwe.[a]
  rationale: Die Revision ersetzt die im heutigen Deutsch missverständliche Wendung „Jahwe nachtrauern“ durch „klagte zu Jahwe“. Dies erhält sowohl das Verb der Klage als auch die auf Jahwe gerichtete Beziehung, ohne die umstrittene Wendung zu einer vollständigen Umkehr, zu bloßem Sehnen oder zu Trauer über einen Verlust festzulegen. Die Zeitangabe wird zugleich idiomatischer formuliert.
