source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/יּ֞וֹם שֶׁ֤בֶת הָֽ/אָרוֹן֙ בְּ/קִרְיַ֣ת יְעָרִ֔ים וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/יִּֽהְי֖וּ עֶשְׂרִ֣ים שָׁנָ֑ה וַ/יִּנָּה֛וּ כָּל בֵּ֥ית יִשְׂרָאֵ֖ל אַחֲרֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: de
  text: Von dem Tag an, an dem die Lade in Kirjat-Jearim blieb, vergingen viele Tage, nämlich zwanzig Jahre; und das ganze Haus Israel klagte zu Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sehnte sich nach Jahwe« oder »klagte Jahwe nach«. Im Hebräischen steht eine ungewöhnliche Verbindung, die Klage und eine Ausrichtung auf Jahwe ausdrücken kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁבֶת הָאָרוֹן
  choice: an dem die Lade … blieb
  rationale: Der Infinitiv von ישׁב bezeichnet hier den fortdauernden Aufenthalt der Lade. „Blieb“ ist im Deutschen natürlich und vermeidet das für einen Gegenstand unpassende „wohnte“.
- source_word: בְּקִרְיַת יְעָרִים
  choice: in Kirjat-Jearim
  rationale: Der Ortsname wird in einer im Deutschen üblichen Form transliteriert; בְּ bezeichnet hier schlicht den Ort.
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: vergingen viele Tage
  rationale: Die Wendung bedeutet wörtlich, dass die Tage zahlreich wurden, und bezeichnet idiomatisch das Verstreichen einer langen Zeit.
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: und es wurden zwanzig Jahre
  rationale: Die Formulierung bewahrt die eigene Zeitangabe des zweiten hebräischen Satzglieds, ohne sie als bloße Dauerangabe in den vorherigen Satz einzuebnen.
- source_word: וַיִּנָּהוּ … אַחֲרֵי
  choice: trauerte … nach
  rationale: „Nachtrauern“ verbindet im Deutschen Klage über einen empfundenen Verlust mit einem rückwärts- oder hinwendenden Verlangen und gibt damit die Spannung des seltenen Verbs נהה mit אַחֲרֵי knapp wieder.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Die Wendung erhält das kollektive Bild des hebräischen Textes und ist in gehobenem, aber verständlichem Deutsch geläufig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner etablierten deutschen Form wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von וַיִּנָּהוּ כָּל־בֵּית יִשְׂרָאֵל אַחֲרֵי יְהוָה
  choice: Das Haus Israel „trauerte Jahwe nach“
  alternative: Das Haus Israel „sehnte sich nach Jahwe“ oder „wandte sich klagend Jahwe zu“
  rationale: Das seltene Verb bezeichnet Klagen oder Trauern, während אַחֲרֵי eine Ausrichtung auf Jahwe ausdrücken kann. „Trauerte … nach“ lässt sowohl Verlustschmerz als auch Verlangen anklingen, ohne bereits eine vollständige Umkehrformel in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas formelle Wendung „Haus Israel“ bewahrt das kollektive Bild des Ausgangstextes; „trauerte … nach“ erhält bewusst dessen Bedeutungsbreite zwischen Klage und Sehnsucht.
