lexical_decisions:
- source_word: וְאֶת
  choice: '[Akkusativmarkierung, nicht eigenständig übersetzt]'
  rationale: Die Partikel kennzeichnet „eure Töchter“ als direktes Objekt von „wird er nehmen“; im Deutschen wird sie nicht durch ein eigenes Wort wiedergegeben.
- source_word: בְּנוֹתֵיכֶם
  choice: eure Töchter
  rationale: Der Konstruktus Plural von „Tochter“ mit Suffix der 2. Person maskulin Plural bezeichnet hier am natürlichsten die Töchter der Angesprochenen.
- source_word: יִקָּח
  choice: wird er nehmen
  rationale: Das Qal-Imperfekt hat in Samuels Warnung Zukunftsbedeutung. „Nehmen“ bewahrt den Zwangscharakter königlicher Inanspruchnahme.
- source_word: לְרַקָּחוֹת
  choice: damit sie Salbenmischerinnen werden
  rationale: Das feminine Pluralwort bezeichnet Frauen, die aromatische Mischungen wie Salben oder Duftstoffe herstellen. „Salbenmischerinnen“ gibt die Tätigkeit konkret wieder, ohne sie auf moderne Parfümherstellung zu verengen.
- source_word: וּלְטַבָּחוֹת
  choice: Köchinnen
  rationale: Das feminine Pluralwort bezeichnet Frauen, die Speisen zubereiten; „Köchinnen“ ist die natürliche moderne Berufsbezeichnung.
- source_word: וּלְאֹפוֹת
  choice: Bäckerinnen
  rationale: Die feminine substantivische Form bezeichnet Frauen, die backen; „Bäckerinnen“ ist im Deutschen prägnant und idiomatisch.
