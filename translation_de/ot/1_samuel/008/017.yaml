source:
  edition: WLC
  text: צֹאנְ/כֶ֖ם יַעְשֹׂ֑ר וְ/אַתֶּ֖ם תִּֽהְיוּ ל֥/וֹ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: de
  text: Von euren Schaf- und Ziegenherden wird er den Zehnten nehmen, und ihr werdet seine Sklaven[a] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener« beziehungsweise »Knechte«. Das hebräische Wort kann allgemein Menschen im Dienst bezeichnen; hier spricht der Zusammenhang königlicher Ausbeutung und des Verlusts der Freiheit für »Sklaven«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: von euren Schaf- und Ziegenherden
  rationale: צֹאן bezeichnet Kleinvieh, vor allem Schafe und Ziegen als Gesamtbestand. Die ausdrückliche Doppelnennung ist im Deutschen präziser als das möglicherweise zu weit gefasste „Herden“ und weniger eng als „Schafe“.
- source_word: יַעְשֹׂר
  choice: wird er den Zehnten nehmen
  rationale: Das Verb bezeichnet hier die Erhebung eines Zehntels. „Den Zehnten nehmen“ bewahrt den Bezug zum Zehntel und macht im Kontext königlicher Abgaben deutlich, dass es sich um eine auferlegte Entnahme handelt, nicht um eine freiwillige oder kultische Gabe.
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: und ihr werdet seine … sein
  rationale: Die einfache Konstruktion mit היה und לוֹ beschreibt den künftigen Zustand der Zugehörigkeit beziehungsweise Unterordnung. Die natürliche deutsche Fassung gibt dies ohne zusätzliche Deutung wieder.
- source_word: לַעֲבָדִים
  choice: Sklaven
  rationale: עֲבָדִים kann Diener oder Sklaven bezeichnen. In der abschließenden Zuspitzung der Warnung vor königlicher Ausbeutung und Freiheitsverlust bringt „Sklaven“ die erzwungene Unterordnung am deutlichsten zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von עֲבָדִים im Zusammenhang königlicher Unterwerfung
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Der Kontext steigert die Forderungen des Königs bis zur persönlichen Unterwerfung des Volkes. „Sklaven“ wahrt die Schärfe der Warnung, während die Fußnote die echte Bedeutungsbreite des hebräischen Ausdrucks offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schaf- und Ziegenherden“ verdeutlicht den Umfang von צֹאן; „den Zehnten nehmen“ vermeidet einen freiwillig-kultischen Klang. Die knappe Satzstruktur erhält die warnende Zuspitzung des Hebräischen.
