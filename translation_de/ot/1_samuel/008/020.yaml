  yaml_path: translation/ot/1_samuel/008/020.yaml
  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: de
  text: damit auch wir wie alle Völker seien[a] und unser König uns Recht spricht[b], vor uns herzieht und unsere Kriege führt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dann werden auch wir wie alle Völker sein.« Die hebräische Form kann wörtlicher als eine Abfolge in der Zukunft wiedergegeben werden; hier bezeichnet sie wahrscheinlich den Zweck des Wunsches nach einem König.'
    reason: lexical_alternative
  - marker: b
    text: »Recht sprechen« kann hier im weiteren Sinn auch »regieren« oder »herrschen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ
  choice: damit ... wir ... sind
  rationale: Die kontextuell an den vorausgehenden Wunsch nach einem König anschließende Form bezeichnet hier am natürlichsten Zweck oder Folge. Die Fußnote bewahrt die mögliche wörtlichere Zukunftsfolge.
- source_word: גַם אֲנַחְנוּ
  choice: auch wir
  rationale: Die Wortgruppe betont, dass Israel ebenfalls zu den anderen politisch verfassten Völkern gehören möchte.
- source_word: כְּכָל הַגּוֹיִם
  choice: wie alle anderen Völker
  rationale: גּוֹיִם meint hier die umliegenden Völker und nicht »Heiden« in einem späteren fachsprachlichen Sinn. »anderen« macht im Deutschen die Vergleichsgruppe natürlich verständlich, ohne die Spannung des Wunsches Israels aufzulösen.
- source_word: וּשְׁפָטָנוּ
  choice: uns Recht spricht
  rationale: שׁפט umfasst Rechtsprechung und leitende Herrschaft. »Recht sprechen« wahrt den Bezug zum Richteramt und ist hier idiomatischer als das missverständliche »uns richten«; die breitere Bedeutung wird in einer Fußnote genannt.
- source_word: מַלְכֵּנוּ
  choice: unser König
  rationale: Die Besitzform wird direkt wiedergegeben und hebt die von den Israeliten gewünschte monarchische Ordnung hervor.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: vor uns herzieht
  rationale: Die Formulierung bewahrt das hebräische Bild des Königs, der insbesondere als militärischer Anführer vor dem Volk auszieht, und klingt im Deutschen natürlich.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: unsere Kriege führt
  rationale: Die hebräische figura etymologica bezeichnet das Führen beziehungsweise Kämpfen der Kriege. »unsere Kriege führt« ist idiomatisch und passt zum militärischen Zusammenhang.
theological_decisions:
- issue: Wiedergabe von גּוֹיִם in Israels Wunsch nach einem Königtum
  choice: Völker
  alternative: Heiden
  rationale: Im Zusammenhang geht es um Israels politische und kulturelle Angleichung an die umliegenden Völker. »Völker« vermeidet eine spätere technische Bedeutung von »Heiden« und erhält die theologische Spannung des Vergleichs.
- issue: Bedeutungsumfang von שׁפט beim König
  choice: Recht sprechen
  alternative: regieren / herrschen
  rationale: Die konkrete richterliche Bedeutung und der Bezug zur bisherigen Richterführung bleiben im Haupttext sichtbar, während die ebenfalls mögliche umfassendere Regierungsfunktion nicht ausgeschlossen und in der Fußnote ausgewiesen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und das militärische Bild des Hebräischen bleiben erkennbar; missverständliches »uns richten« wird zugunsten von »uns Recht sprechen« vermieden.
