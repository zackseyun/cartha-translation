  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: de
  text: An jenem Tag werdet ihr wegen eures Königs, den ihr euch gewählt habt, schreien[a]; aber Jahwe wird euch an jenem Tag nicht antworten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: um Hilfe schreien.'
    reason: זעק bezeichnet einen dringlichen Notschrei und kann insbesondere einen Hilferuf meinen; die Fußnote bietet diese sinnvolle Kontextnuance, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: werdet ihr … um Hilfe schreien
  rationale: זעק bezeichnet einen dringlichen Schrei aus Not, häufig als Hilferuf. „Um Hilfe schreien“ gibt diesen Sinn im Deutschen natürlich und präzise wieder.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die übliche deutsche Wiedergabe der Zeitangabe; ihre Wiederholung bewahrt den feierlich-warnenden Nachdruck des Hebräischen.
- source_word: מִלִּפְנֵי
  choice: wegen
  rationale: Die Wendung bedeutet wörtlich etwa „von dem Angesicht/vor … weg“, bezeichnet hier aber den König als Anlass der Not und des Hilferufs. „Wegen“ ist im Deutschen knapp und sachgerecht.
- source_word: מַלְכְּכֶם
  choice: eures Königs
  rationale: Direkte Wiedergabe des Substantivs mit Possessivsuffix; der Genitiv wird durch „wegen“ verlangt.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: den ihr euch erwählt habt
  rationale: „Euch“ bewahrt die reflexive beziehungsweise interessenbezogene Nuance von לָכֶם und unterstreicht Israels eigene Verantwortung. Das Perfekt bezeichnet die vollzogene Wahl mit fortdauernder Folge.
- source_word: וְלֹא יַעֲנֶה
  choice: aber … wird … nicht antworten
  rationale: Das וְ erhält hier durch den Gegensatz zwischen Hilferuf und ausbleibender Antwort adversative Kraft; „aber“ macht diesen Kontrast natürlich deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Beim deutschen Verb „antworten“ steht die angesprochene Person idiomatisch im Dativ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Art des Schreiens in זעק
  choice: um Hilfe schreien
  alternative: aufschreien
  rationale: Das Verb bezeichnet im Kontext einen Notschrei, der eine Antwort erwartet. Die ausdrückliche Hilfekomponente ist lexikalisch gut begründet, ohne festzulegen, welche konkrete Hilfe erbeten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „an jenem Tag“ bleibt als rhetorischer Rahmen erhalten. „Erwählt“ wahrt den gehobenen biblischen Ton, ohne altertümlich zu wirken.
