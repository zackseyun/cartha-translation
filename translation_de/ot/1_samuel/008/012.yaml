source:
  edition: WLC
  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: de
  text: Er wird sich Befehlshaber über Tausend und Befehlshaber über Fünfzig einsetzen[a] und Leute dazu bestimmen, seinen Acker zu pflügen und seine Ernte einzubringen[b] sowie sein Kriegsgerät[c] und die Ausrüstung seiner Streitwagen anzufertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Anführer über Tausend und Anführer über Fünfzig«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »sein Pflügen zu pflügen und seine Ernte zu ernten«; die hebräische Formulierung hebt die Arbeit hervor, die für den König verrichtet wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »seine Kriegswaffen« beziehungsweise »seine militärische Ausrüstung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: Er wird sich … einsetzen
  rationale: Der Infinitiv mit וְ führt die Beschreibung aus dem vorhergehenden Vers fort. Für einen verständlichen deutschen Einzelvers wird er als finites Verb wiedergegeben; לוֹ bezeichnet den Nutzen beziehungsweise Dienst für den König.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: Befehlshaber über Tausend und Befehlshaber über Fünfzig
  rationale: שַׂר bezeichnet hier einen militärischen Amts- oder Befehlsträger. Die Zahlenangaben bleiben bewusst in ihrer hebräischen Form erhalten, ohne die genaue Organisation der Einheiten näher festzulegen.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: und Leute dazu bestimmen, seinen Acker zu pflügen
  rationale: Das Hebräische hat eine etymologische Wortverbindung, wörtlich etwa „sein Pflügen pflügen“. „Seinen Acker pflügen“ gibt die landwirtschaftliche Zwangsarbeit natürlich wieder; „Leute dazu bestimmen“ macht im Deutschen den vom Kontext getragenen Personenbezug verständlich.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: und seine Ernte einzubringen
  rationale: קצר mit קציר bezeichnet das Ernten der dem König gehörenden Ernte. „Einbringen“ ist im modernen Deutschen eine natürliche landwirtschaftliche Formulierung.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: seine Kriegswaffen anzufertigen
  rationale: כְּלִי kann Gerät, Ausrüstungsgegenstand oder Waffe bedeuten. Im Zusammenhang mit מִלְחָמָה ist „Kriegswaffen“ eine klare, dabei nicht ausschließlich technisch festgelegte Wiedergabe.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: und die Ausrüstung seiner Streitwagen
  rationale: רֶכֶב kann Streitwagen oder die Streitwagentruppe bezeichnen; כְּלֵי meint die zugehörigen Geräte beziehungsweise Ausrüstungsstücke. Die Formulierung bewahrt diese sachliche Breite weitgehend.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärischen Rangbezeichnungen bleiben verständlich, ohne moderne Dienstgrade in den antiken Text einzutragen. Die ergänzten „Leute“ ergeben sich aus dem fortlaufenden Zusammenhang und vermeiden im Deutschen eine missverständliche Reihung von Befehlshabern und Tätigkeiten.
