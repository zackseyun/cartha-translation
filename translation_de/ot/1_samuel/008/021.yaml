id: 1SA.8.21
reference: 1 Samuel 8:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע שְׁמוּאֵ֔ל אֵ֖ת כָּל דִּבְרֵ֣י הָ/עָ֑ם וַֽ/יְדַבְּרֵ֖/ם בְּ/אָזְנֵ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: de
  text: Samuel hörte alles, was das Volk sagte, und trug es Jahwe vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sprach sie in die Ohren Jahwes“; gemeint ist, dass Samuel die Worte in Jahwes Gegenwart und zu seinem Hören vorbrachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: שׁמע bezeichnet hier im fortlaufenden Erzählstil zunächst das Hören dessen, was das Volk sagte. „Hörte“ ist natürlich und weniger deutend als „hörte auf“.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: alles, was das Volk sagte
  rationale: Die dynamisch-formale Wiedergabe bewahrt die durch כָּל ausgedrückte Gesamtheit und klingt im modernen Deutschen natürlicher als „alle Worte des Volkes“.
- source_word: וַיְדַבְּרֵם
  choice: trug es vor
  rationale: Das Suffix verweist auf die Äußerungen des Volkes. Im Deutschen gibt „trug es vor“ den Sinn idiomatisch wieder, ohne die stärkere Nuance von „berichtete“ zwingend einzutragen.
- source_word: בְּאָזְנֵי
  choice: vor
  rationale: Die hebräische Wendung bedeutet wörtlich „in die Ohren von“ und bezeichnet hier das Sprechen in Jahwes Gegenwart bzw. zu seinem Hören. „Vor“ ist im Deutschen würdig und idiomatisch; die Bildsprache wird in der Fußnote offengelegt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Der Personenname wird gemäß der etablierten deutschen Namensform wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ erhält den Charakter als Eigenname; die traditionelle Titelwiedergabe „der HERR“ bleibt eine mögliche Übersetzungskonvention, wird hier aber nicht in den Haupttext gesetzt.
- issue: Art von Samuels Rede vor Jahwe
  choice: trug es Jahwe vor
  alternative: sagte es Jahwe / berichtete es Jahwe
  rationale: Der Text sagt, dass Samuel die Worte des Volkes in Jahwes Ohren sprach. „Trug es vor“ bewahrt die Vorstellung, dass er ihre Äußerungen vor Gott bringt, ohne genauer festzulegen, ob dies als Bericht oder Gebet zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sperrige hebräische Wortfolge wird idiomatisch wiedergegeben, während die Fußnote das Bild „in die Ohren“ transparent macht. Das neutrale „Volk“ und die Formulierung „trug es vor“ vermeiden unnötige konfessionelle oder interpretierende Zusätze.
