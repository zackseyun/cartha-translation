  text: כְּ/כָֽל הַ/מַּעֲשִׂ֣ים אֲשֶׁר עָשׂ֗וּ מִ/יּוֹם֩ הַעֲלֹתִ֨/י אֹתָ֤/ם מִ/מִּצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יַּ֣עַזְבֻ֔/נִי וַ/יַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים כֵּ֛ן הֵ֥מָּה עֹשִׂ֖ים גַּם לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: de
  text: Bei allem, was sie seit dem Tag getan haben, als ich sie aus Ägypten heraufführte, bis zum heutigen Tag[a], haben sie mich verlassen und anderen Göttern gedient[b]. Ebenso handeln sie auch an dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »bis zu diesem Tag«.'
    reason: lexical_alternative
  - marker: b
    text: »Anderen Göttern dienen« kann hier auch mit »andere Götter verehren« wiedergegeben werden; das hebräische Verb bedeutet wörtlich »dienen«.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: Ganz so, wie sie es mit all ihren Taten gehalten haben
  rationale: Die Formulierung gibt die vergleichende Kraft von כְּ und den Rückblick auf das gesamte bisherige Verhalten wieder, ohne das im Deutschen schwer verständliche Bild »gemäß all den Taten« nachzuahmen.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: von dem Tag an, als ich sie aus Ägypten heraufführte
  rationale: Der Hifil von עלה bezeichnet hier das Heraufführen Israels aus Ägypten; »heraufführte« bewahrt die traditionelle räumliche Bildsprache des hebräischen Exodusmotivs.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: bis auf diesen Tag
  rationale: Diese natürliche, gehobene deutsche Wendung bildet die ausdrücklich genannte Zeitgrenze ab.
- source_word: וַיַּעַזְבֻנִי
  choice: sie verließen mich
  rationale: »Verließen« gibt עזב direkt wieder und wahrt den Beziehungsbruch, ohne ihn durch zusätzliche Begriffe wie »rebellierten« auszudeuten.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: und dienten anderen Göttern
  rationale: »Dienten« entspricht der Grundbedeutung von עבד; im Zusammenhang mit Göttern schließt es kultische Verehrung ein, ohne die lexikalische Bildwelt aufzugeben.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: so machen sie es auch mit dir
  rationale: Die idiomatische deutsche Formulierung erhält die Analogie sowie גַּם »auch« und lässt wie das Hebräische offen, worin das Handeln gegenüber Samuel im Einzelnen besteht.
theological_decisions:
- issue: Verhältnis zwischen Israels Verhalten gegenüber dem HERRN und gegenüber Samuel
  choice: Die gegenwärtige Behandlung Samuels wird mit Israels fortdauerndem Verhalten gegenüber Gott verglichen.
  alternative: »Sie lehnen dich ebenso ab, wie sie mich abgelehnt haben« oder »sie rebellieren auch gegen dich«
  rationale: Der hebräische Text stellt eine Analogie her, benennt aber in diesem Vers weder »Ablehnung« noch »Rebellion« ausdrücklich für Samuel. Die offene Wendung »so machen sie es auch mit dir« bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rahmenkonstruktion »Ganz so, wie …, so …« macht den hebräischen Vergleich verständlich; Gedankenstriche kennzeichnen die inhaltliche Erläuterung durch die beiden finiten hebräischen Verben, ohne sie in abhängige Partizipien umzudeuten.
