id: 1SA.8.14
reference: 1 Samuel 8:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת שְׂ֠דֽוֹתֵי/כֶם וְ/אֶת כַּרְמֵי/כֶ֧ם וְ/זֵיתֵי/כֶ֛ם הַ/טּוֹבִ֖ים יִקָּ֑ח וְ/נָתַ֖ן לַ/עֲבָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: de
  text: Er wird eure Felder, eure Weinberge und eure besten Olivenhaine[a] nehmen und sie seinen Dienern[b] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Olivenbäume« beziehungsweise »Olivenpflanzungen«; das hebräische Wort bezeichnet hier wahrscheinlich Olivenbestände als landwirtschaftlichen Besitz.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sklaven«; das hebräische Wort kann je nach Zusammenhang Diener oder Sklaven bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: eure Felder
  rationale: שָׂדֶה bezeichnet gewöhnlich ein Feld oder bewirtschaftetes Land. »Felder« ist in dieser Aufzählung landwirtschaftlichen Eigentums direkt und natürlich.
- source_word: כַּרְמֵיכֶם
  choice: eure Weinberge
  rationale: כֶּרֶם bezeichnet üblicherweise einen Weinberg; die deutsche Entsprechung ist präzise und idiomatisch.
- source_word: זֵיתֵיכֶם
  choice: eure Olivenhaine
  rationale: זַיִת kann einzelne beziehungsweise kollektiv verstandene Olivenbäume oder eine Olivenpflanzung bezeichnen. Parallel zu Feldern und Weinbergen gibt »Olivenhaine« den landwirtschaftlichen Besitz natürlich wieder.
- source_word: הַטּוֹבִים
  choice: besten
  rationale: טוֹב bedeutet grundsätzlich »gut«; im Zusammenhang mit der königlichen Enteignung bezeichnet es naheliegend die besonders wertvollen oder ertragreichen Besitzungen.
- source_word: יִקָּח
  choice: wird … nehmen
  rationale: לָקַח ist das gewöhnliche Verb für »nehmen«. Die schlichte Wiedergabe bewahrt den Wortlaut, während der Zusammenhang den Zwang erkennen lässt.
- source_word: וְנָתַן
  choice: und … geben
  rationale: נָתַן bedeutet gewöhnlich »geben«. Das eingefügte Pronomen »sie« ist im Deutschen nötig, um den Bezug auf die zuvor genannten Besitzungen klar und flüssig auszudrücken.
- source_word: לַעֲבָדָיו
  choice: seinen Dienern
  rationale: עֶבֶד kann je nach Zusammenhang »Diener« oder »Sklave« bedeuten. Hier liegt wegen des königlichen Umfelds die Bezeichnung von Bediensteten, Gefolgsleuten oder Amtsträgern nahe, ohne dass der genaue Status festgelegt wird.
