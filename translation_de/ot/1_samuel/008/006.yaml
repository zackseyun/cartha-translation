source:
  edition: WLC
  text: וַ/יֵּ֤רַע הַ/דָּבָר֙ בְּ/עֵינֵ֣י שְׁמוּאֵ֔ל כַּ/אֲשֶׁ֣ר אָמְר֔וּ תְּנָ/ה לָּ֥/נוּ מֶ֖לֶךְ לְ/שָׁפְטֵ֑/נוּ וַ/יִּתְפַּלֵּ֥ל שְׁמוּאֵ֖ל אֶל יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: de
  text: 'Doch die Sache missfiel Samuel, als sie sagten: »Gib uns einen König, der über uns Recht spricht[a].« Da betete Samuel zu Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der uns regiert«. Das hebräische Verb kann sowohl Rechtsprechung als auch umfassenderes Regieren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע הַדָּבָר בְּעֵינֵי שְׁמוּאֵל
  choice: Doch Samuel missfiel es
  rationale: Die natürliche deutsche Wendung gibt Samuels starke negative Bewertung wieder. Das hebräische רעע bezeichnet die Sache als schlecht beziehungsweise verwerflich in seinen Augen, nicht bloß ein flüchtiges Gefühl.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: dass sie sagten
  rationale: Im Zusammenhang bezeichnet כַּאֲשֶׁר den Inhalt beziehungsweise Anlass von Samuels Missfallen. Die deutsche Konstruktion ist natürlich und lässt offen, ob vor allem ein zeitlicher oder begründender Bezug gemeint ist.
- source_word: תְּנָה לָּנוּ מֶלֶךְ
  choice: Gib uns einen König
  rationale: Bewahrt die direkte Forderung des hebräischen Imperativs und gibt מֶלֶךְ mit der üblichen Entsprechung wieder.
- source_word: לְשָׁפְטֵנוּ
  choice: der über uns Recht spricht
  rationale: Bewahrt den lexikalischen Bezug zum Richten und klingt im Deutschen bei einem König natürlicher als das missverständliche »uns richten«; der Ausdruck kann zugleich eine umfassendere Regierungsfunktion einschließen.
- source_word: וַיִּתְפַּלֵּל שְׁמוּאֵל
  choice: Da betete Samuel
  rationale: Das Hitpael von פלל bedeutet hier schlicht »beten«. »Da« führt die anschließende Reaktion natürlich fort.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Gibt die Präposition אֶל natürlich wieder und bewahrt den persönlichen Gottesnamen als Jahwe.
theological_decisions:
- issue: Stärke von Samuels negativer Bewertung
  choice: Samuel missfiel es
  alternative: Die Sache war böse in Samuels Augen
  rationale: Die gewählte Formulierung ist idiomatisches modernes Deutsch, während der Zusammenhang weiterhin eine klare negative Bewertung ausdrückt. Die wörtlichere Alternative könnte im Deutschen fälschlich wie eine ausdrückliche objektive Feststellung des Erzählers wirken.
- issue: Bedeutungsumfang von שׁפט
  choice: Recht sprechen
  alternative: regieren / herrschen
  rationale: Die Übersetzung erhält die Verbindung zum Richteramt in 1 Samuel, ohne auszuschließen, dass das Verb hier auch königliches Regieren umfasst.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird transparent wiedergegeben und nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und fordernd; die hebräische Rechts- und Regierungsterminologie wird ohne konfessionelle Zuspitzung wiedergegeben.
