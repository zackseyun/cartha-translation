  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל שְׁמַע֙ בְּ/ק֣וֹל הָ/עָ֔ם לְ/כֹ֥ל אֲשֶׁר יֹאמְר֖וּ אֵלֶ֑י/ךָ כִּ֣י לֹ֤א אֹֽתְ/ךָ֙ מָאָ֔סוּ כִּֽי אֹתִ֥/י מָאֲס֖וּ מִ/מְּלֹ֥ךְ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Samuel: „Hör auf die Stimme des Volkes in allem, was sie zu dir sagen; denn nicht dich haben sie verworfen, sondern mich haben sie als ihren König verworfen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שְׁמַע
  choice: Hör
  rationale: Der Imperativ fordert Samuel auf, die Bitte des Volkes ernst zu nehmen und ihr zu entsprechen; „Hör auf“ ist im Deutschen idiomatisch.
- source_word: בְּקוֹל הָעָם
  choice: auf die Stimme des Volkes
  rationale: Die hebräische Wendung wird bildnah und zugleich verständlich wiedergegeben.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: in allem, was sie zu dir sagen
  rationale: Die umfassende Geltung der Aufforderung bleibt erhalten.
- source_word: מָאַס
  choice: verwerfen
  rationale: „Verwerfen“ bezeichnet hier eine bewusste Zurückweisung und passt sowohl auf Samuel als auch auf Jahwe.
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: denn nicht dich haben sie verworfen, sondern mich haben sie verworfen
  rationale: Die betonte Gegenüberstellung des Hebräischen wird durch die wiederholte Verbform bewahrt.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: sodass ich nicht mehr König über sie sein soll
  rationale: Die Formulierung gibt die durch מִן bezeichnete Abweisung von Jahwes Königsherrschaft in natürlichem Deutsch wieder und erhält den persönlichen Königsbegriff.
theological_decisions:
- issue: Göttliches Königtum angesichts der Forderung Israels nach einem menschlichen König
  choice: Die Forderung des Volkes wird ausdrücklich als Zurückweisung von Jahwes eigener Königsherrschaft dargestellt.
  alternative: Die Zurückweisung beträfe lediglich Samuels Leitung.
  rationale: Der hebräische Text stellt Samuel und Jahwe ausdrücklich einander gegenüber und benennt Jahwes Königtum als die tiefer liegende Streitfrage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „verworfen“ erhält die rhetorische Betonung des Ausgangstextes; „Hör auf die Stimme“ bewahrt dessen Bildsprache.
