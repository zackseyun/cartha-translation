  source_fidelity: 'Die Übersetzung trifft die Anrede, den Imperativ, die umfassende Bezugnahme auf die Worte des Volkes und die emphatische Gegenüberstellung Samuel/Jahwe gut. Die Schlussformulierung „sodass ich nicht mehr König über sie sein soll“ verschiebt jedoch die Konstruktion מִמְּלֹךְ: Sie macht daraus eine Folge mit modalem „soll“ und fügt „nicht mehr“ ausdrücklich hinzu. Der hebräische Infinitiv bezeichnet, dass sie Jahwe in seiner Stellung bzw. Ausübung als König über sie verwerfen.'
  naturalness: „Hör auf die Stimme des Volkes“ ist verständlich und im würdevollen Bibelregister gut möglich. „Mich haben sie als ihren König verworfen“ ist im modernen Standarddeutsch idiomatisch und präzise.
