    issue: Die Wiedergabe des Schlusses als „sodass ich nicht mehr König über sie sein soll“ ist semantisch zu interpretierend.
    rationale: 'Das hebräische מִן mit Infinitiv beschreibt, wovon sie Jahwe ausschließen bzw. in welcher Eigenschaft sie ihn verwerfen: als über sie regierenden König. „Sodass“ und „sein soll“ setzen eine Folgerungs- und Sollensnuance; „nicht mehr“ wird im Text nicht ausdrücklich gesagt.'
  revised_text: 'Und Jahwe sagte zu Samuel: „Hör auf die Stimme des Volkes in allem, was sie zu dir sagen; denn nicht dich haben sie verworfen, sondern mich haben sie als ihren König verworfen.“'
