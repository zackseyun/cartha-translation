source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל שְׁמוּאֵל֙ שְׁמַ֣ע בְּ/קוֹלָ֔/ם וְ/הִמְלַכְתָּ֥ לָ/הֶ֖ם מֶ֑לֶךְ וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לְכ֖וּ אִ֥ישׁ לְ/עִירֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: de
  text: 'Und Yahweh sagte zu Samuel: „Hör auf ihre Stimme[a] und setze ihnen einen König ein.“ Dann sagte Samuel zu den Männern Israels: „Geht, jeder in seine Stadt[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung kann auch bedeuten: „Gehorche ihnen“ oder „Gib ihrer Forderung nach“.'
    reason: lexical_alternative
  - marker: b
    text: „Stadt“ kann hier auch eine kleinere Ortschaft bezeichnen; gemeint ist, dass jeder an seinen Wohnort zurückkehren soll.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שְׁמַע בְּקוֹלָם
  choice: Hör auf ihre Stimme
  rationale: 'Die Wiedergabe bewahrt die hebräische Wendung und lässt zugleich ihren kontextuellen Sinn erkennen: Samuel soll ihrer Forderung entsprechen.'
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: setze ihnen einen König ein
  rationale: Der Hifil von מלך bezeichnet hier das Einsetzen beziehungsweise Bestellen eines Königs; diese Formulierung ist im Deutschen natürlich und wahrt den kausativen Sinn.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Die ausdrücklich maskuline Form wird beibehalten; im Zusammenhang kann sie die versammelten Israeliten repräsentativ bezeichnen.
- source_word: לְכוּ
  choice: Geht
  rationale: Der schlichte Imperativ gibt die Aufforderung natürlich und genau wieder.
- source_word: אִישׁ לְעִירוֹ
  choice: jeder in seine Stadt
  rationale: אִישׁ ist distributiv gebraucht. Die deutsche Formulierung bewahrt den maskulinen Bezug, ohne das bereits genannte Substantiv „Männer“ unnötig zu wiederholen; עִיר kann Stadt oder Ortschaft bedeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Yahweh“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שְׁמַע בְּקוֹלָם
  choice: Hör auf ihre Stimme
  alternative: Gehorche ihnen; Gib ihrer Forderung nach
  rationale: Die hebräische Wendung kann sowohl das Hören als auch das Befolgen beziehungsweise Entsprechen ausdrücken. Die gewählte Form wahrt diese Spannung, während die Fußnote den Sinn erläutert.
- issue: Maskuline Sprache in אַנְשֵׁי יִשְׂרָאֵל und אִישׁ
  choice: die Männer Israels; jeder
  alternative: die Israeliten; alle; jeder Mensch
  rationale: Die Übersetzung erhält die ausdrücklich maskulinen Formen, ohne auszuschließen, dass die Versammelten repräsentativ für Israel stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während „setze … ein“ den königlichen Einsetzungsakt idiomatisch ausdrückt. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
