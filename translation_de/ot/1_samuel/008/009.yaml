  text: וְ/עַתָּ֖ה שְׁמַ֣ע בְּ/קוֹלָ֑/ם אַ֗ךְ כִּֽי הָעֵ֤ד תָּעִיד֙ בָּ/הֶ֔ם וְ/הִגַּדְתָּ֣ לָ/הֶ֔ם מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: de
  text: Und nun höre auf sie. Doch warne sie eindringlich und teile ihnen mit, wie der König, der über sie herrschen wird, mit ihnen verfahren wird[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Recht / die Rechtsordnung des Königs«. Das hebräische Wort kann hier auch die übliche Verfahrensweise oder Praxis des Königs bezeichnen; ebenso kommt der Sinn von Rechtsanspruch in Betracht.'
    reason: lexikalische Mehrdeutigkeit
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt die folgernde zeitliche Wendung knapp und natürlich wieder.
- source_word: שְׁמַע בְּקוֹלָם
  choice: höre auf ihre Stimme
  rationale: Bewahrt die hebräische Ausdrucksweise und lässt erkennen, dass Samuel ihrer Forderung entsprechen soll, ohne damit ihre Haltung gutzuheißen.
- source_word: אַךְ כִּי
  choice: Doch
  rationale: Kennzeichnet die starke Einschränkung des vorangehenden Auftrags in natürlichem Deutsch.
- source_word: הָעֵד תָּעִיד בָּהֶם
  choice: warne sie eindringlich
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aufforderung; das Hifil von עוּד bezeichnet hier eine nachdrückliche, förmliche Warnung.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: und sage ihnen
  rationale: Gibt das Hifil von נגד klar und direkt wieder.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: wie der König verfahren wird
  rationale: מִשְׁפָּט kann Recht, Rechtsanspruch, Ordnung oder übliche Verfahrensweise bezeichnen. Die verbale Formulierung ist im Deutschen verständlich und wahrt hier den beschreibenden Warncharakter, ohne die königlichen Maßnahmen stillschweigend zu legitimieren.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: der über sie herrschen wird
  rationale: Gibt das königliche Regieren von מלך idiomatisch wieder und vermeidet die schwerfällige Wiederholung von „König“ und „als König regieren“.
theological_decisions:
- issue: Ob מִשְׁפַּט הַמֶּלֶךְ als rechtmäßig gewährtes Königsrecht oder als Beschreibung königlicher Praxis zu verstehen ist
  choice: wie der König verfahren wird
  alternative: das Recht des Königs; die Art des Königs; die übliche Verfahrensweise des Königs
  rationale: Die folgenden Verse beschreiben belastende Eingriffe des Königs. Die gewählte Fassung hält offen, ob מִשְׁפָּט hier einen Rechtsanspruch, eine feststehende Ordnung oder die tatsächliche königliche Praxis meint, und vermeidet eine über den Text hinausgehende moralische Billigung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „höre auf ihre Stimme“ bewahrt bewusst den hebräischen Idiomcharakter; „wie der König verfahren wird“ vermittelt die Mehrdeutigkeit von מִשְׁפָּט lesbar, während die Fußnote die formelleren Alternativen nennt.
