revisions:
- from: Und nun höre auf ihre Stimme. Doch warne sie eindringlich und sage ihnen, wie der König[a] verfahren wird, der über sie herrschen wird.
  to: Und nun höre auf sie. Doch warne sie eindringlich und teile ihnen mit, wie der König, der über sie herrschen wird, mit ihnen verfahren wird[a].
  rationale: Die Revision ersetzt den im Deutschen weniger natürlichen Ausdruck „höre auf ihre Stimme“ durch das idiomatische „höre auf sie“. Sie stellt die relative Bestimmung beim König voran und setzt die Fußnotenmarkierung an die Wiedergabe von מִשְׁפַּט הַמֶּלֶךְ. „wie der König … mit ihnen verfahren wird“ wahrt den warnenden, beschreibenden Zusammenhang; die Fußnote bewahrt zugleich die lexikalische Offenheit zwischen königlicher Praxis, Ordnung und Rechtsanspruch.
