source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ הָ/עָ֔ם לִ/שְׁמֹ֖עַ בְּ/ק֣וֹל שְׁמוּאֵ֑ל וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י אִם מֶ֖לֶךְ יִֽהְיֶ֥ה עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: de
  text: 'Doch das Volk weigerte sich, auf Samuel zu hören[a], und sie sagten: »Nein! Vielmehr soll ein König über uns herrschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf die Stimme Samuels zu hören«. Die hebräische Wendung kann auch bedeuten, Samuel zu folgen oder ihm zu gehorchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: weigerte sich
  rationale: Das Verb מאן bezeichnet eine bewusste Weigerung oder mangelnde Bereitschaft. Die Formulierung gibt den aktiven Widerstand des Volkes natürlich wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עם bezeichnet hier kollektiv die Israeliten, die einen König verlangen. »Das Volk« ist im Deutschen die übliche und treffende Wiedergabe.
- source_word: לִשְׁמֹעַ בְּקוֹל שְׁמוּאֵל
  choice: auf Samuel zu hören
  rationale: Die hebräische Wendung שמע בקול kann sowohl das Hören als auch das Befolgen bzw. Gehorchen bezeichnen. »Auf Samuel hören« ist idiomatisches Deutsch und bewahrt beide Bedeutungsnuancen.
- source_word: וַיֹּאמְרוּ
  choice: und sie sagten
  rationale: אמר ist das gewöhnliche Verb des Sprechens; die Wiedergabe folgt schlicht der erzählerischen Abfolge.
- source_word: לֹא
  choice: Nein!
  rationale: Das allein stehende לֹא weist Samuels Mahnung entschieden zurück. Das Ausrufezeichen macht diese Nachdrücklichkeit im Deutschen sichtbar.
- source_word: כִּי אִם
  choice: Vielmehr
  rationale: Nach der ausdrücklichen Verneinung führt כִּי אִם den entschieden bevorzugten Gegensatz ein. »Vielmehr« bildet diese korrigierende Kontrastfunktion natürlich ab.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: soll ein König über uns herrschen
  rationale: Die Aussage bringt den festen Willen des Volkes zum Ausdruck. »Über uns herrschen« verdeutlicht die in עַל liegende königliche Oberhoheit, ohne den Sinn auf die bloße Existenz eines Königs zu verkürzen.
