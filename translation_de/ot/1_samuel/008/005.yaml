  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הִנֵּה֙ אַתָּ֣ה זָקַ֔נְתָּ וּ/בָנֶ֕י/ךָ לֹ֥א הָלְכ֖וּ בִּ/דְרָכֶ֑י/ךָ עַתָּ֗ה שִֽׂימָ/ה לָּ֥/נוּ מֶ֛לֶךְ לְ/שָׁפְטֵ֖/נוּ כְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: de
  text: 'Sie sagten zu ihm: „Sieh, du bist alt geworden, und deine Söhne sind nicht auf deinen Wegen gegangen. Setze nun für uns einen König ein, der uns Recht spricht[a], wie alle Völker.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der uns regiert“ oder „der über uns herrscht“. Das hebräische Verb für „Recht sprechen“ kann hier auch eine umfassendere Regierungsgewalt bezeichnen.'
    reason: Lexikalische Bedeutungsbreite von שׁפט im politischen Kontext.
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den hinweisenden und nachdrücklichen Charakter der hebräischen Aufforderung, ohne das heute altertümliche „Siehe“ zu verwenden.
- source_word: זָקַנְתָּ
  choice: du bist alt geworden
  rationale: Gibt sowohl den eingetretenen Vorgang als auch den daraus entstandenen gegenwärtigen Zustand wieder.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: sind nicht auf deinen Wegen gegangen
  rationale: Erhält das im Hebräischen geläufige ethische Bild vom Gehen auf bestimmten Wegen; es bleibt im Deutschen verständlich und würdevoll.
- source_word: שִׂימָה לָּנוּ
  choice: Setze nun für uns … ein
  rationale: „Einsetzen“ bezeichnet im politischen Zusammenhang natürlich die Bestellung eines Herrschers und entspricht der Aufforderung, einen König zu bestimmen.
- source_word: מֶלֶךְ
  choice: einen König
  rationale: Direkte und kontextgemäße Wiedergabe der Bezeichnung für einen monarchischen Herrscher.
- source_word: לְשָׁפְטֵנוּ
  choice: der uns Recht spricht
  rationale: Bewahrt den richterlichen Grundsinn von שׁפט, klingt im modernen Deutschen jedoch natürlicher und weniger missverständlich als „der uns richtet“. Die weiter reichende politische Bedeutung wird in der Fußnote genannt.
- source_word: כְּכָל הַגּוֹיִם
  choice: wie bei allen anderen Völkern
  rationale: Bezeichnet die umliegenden Völker und stellt Israels gewünschte politische Angleichung heraus. „Andere“ macht den im Vergleich vorausgesetzten Gegensatz im Deutschen natürlich deutlich.
theological_decisions:
- issue: Israels Wunsch nach einer Monarchie nach dem Vorbild der umliegenden Völker
  choice: wie bei allen anderen Völkern
  alternative: wie bei allen Heidenvölkern
  rationale: „Völker“ wahrt den politischen und heilsgeschichtlichen Kontrast, ohne die später stärker religiös geprägte Bezeichnung „Heiden“ in den Text einzutragen.
- issue: Umfang der Aufgabe des verlangten Königs
  choice: der uns Recht spricht
  alternative: der uns regiert
  rationale: Der Haupttext bewahrt den richterlichen Grundsinn des hebräischen Verbs, während die Fußnote offenhält, dass es hier auch umfassendere Regierungs- und Herrschaftsaufgaben einschließt.
translation_notes:
  register: Modernes Standarddeutsch in natürlicher, würdevoller Form. Das biblische Weg-Bild bleibt erhalten; altertümliche oder konfessionell geprägte Formulierungen werden vermieden.
