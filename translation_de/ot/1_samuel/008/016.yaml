  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: de
  text: Er wird eure Sklaven[a] und Sklavinnen, eure besten jungen Männer und eure Esel nehmen und sie für seine Arbeit einsetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener … Dienerinnen“. Die hebräischen Wörter können allgemein Bedienstete bezeichnen; im Zusammenhang der zwangsweisen königlichen Inanspruchnahme liegt jedoch „Sklaven“ beziehungsweise „Sklavinnen“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: eure Sklaven
  rationale: עֶבֶד kann einen Diener oder Sklaven bezeichnen. Im Zusammenhang der zwangsweisen königlichen Inanspruchnahme ist „Sklaven“ sachlich naheliegend; das Wort steht zudem parallel zum folgenden Ausdruck für Sklavinnen.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: Sklavinnen
  rationale: שִׁפְחָה bezeichnet eine weibliche Sklavin oder Dienerin. „Sklavinnen“ gibt den wahrscheinlich unfreien Status wieder und wahrt die Parallelität zum vorangehenden Ausdruck.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: eure besten jungen Männer
  rationale: בָּחוּר bezeichnet gewöhnlich einen jungen Mann in seiner Kraft; הַטּוֹבִים kennzeichnet sie als die besten beziehungsweise tüchtigsten.
- source_word: חֲמוֹרֵיכֶם
  choice: eure Esel
  rationale: Die gewöhnliche Bedeutung ist „Esel“.
- source_word: יִקָּח
  choice: wird … nehmen
  rationale: לקח bedeutet „nehmen“. Das deutsche Futur passt zur Abfolge angekündigter königlicher Maßnahmen.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: und sie für seine Arbeiten einsetzen
  rationale: Die knappe hebräische Wendung meint hier, dass der König die zuvor genannten Menschen und Tiere für seine eigenen Aufgaben beziehungsweise Arbeiten in Dienst stellt. „Einsetzen“ ist im Deutschen natürlich und umfasst Menschen wie Lasttiere.
