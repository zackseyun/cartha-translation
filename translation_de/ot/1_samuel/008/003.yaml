base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: de
  text: Doch seine Söhne folgten nicht seinen Wegen. Sie wandten sich unredlichem Gewinn zu[a], nahmen Bestechungsgelder an und beugten das Recht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ungerechtem Gewinn“ oder „Habgier“. Das hebräische Wort bezeichnet Gewinn, der auf unrechte oder ausbeuterische Weise erstrebt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie bogen das Recht.“ Gemeint ist, dass sie die Rechtsprechung verdrehten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכוֹ
  choice: gingen nicht seinen Weg
  rationale: Die Verbindung von הלך mit דרך beschreibt bildhaft die Lebensführung. „Seinen Weg gehen“ bewahrt dieses Bild und ist im Deutschen verständlich.
- source_word: וַיִּטּוּ
  choice: sie wandten sich … zu
  rationale: נטה bezeichnet hier das Abweichen von einem rechten Kurs und, zusammen mit אַחֲרֵי, die Hinwendung zu einem falschen Ziel.
- source_word: אַחֲרֵי הַבָּצַע
  choice: unredlichem Gewinn
  rationale: בצע meint in diesem Zusammenhang eigennützig oder auf unrechte Weise erstrebten Gewinn. „Unredlicher Gewinn“ gibt sowohl den materiellen als auch den moralisch verwerflichen Aspekt wieder.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: nahmen Bestechungsgelder an
  rationale: שֹׁחַד bezeichnet besonders im rechtlichen Zusammenhang eine Bestechungsgabe. Der deutsche Plural beschreibt die wiederholte Praxis natürlich.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: beugten das Recht
  rationale: Die feste deutsche Wendung gibt prägnant wieder, dass sie Rechtsprechung beziehungsweise gerechtes Urteil absichtlich verdrehten.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das hebräische maskuline Pluralwort bezeichnet hier konkret Samuels Söhne.
theological_decisions:
- issue: Moralisch-rechtliche Beurteilung der Söhne Samuels
  choice: Die Aussage wird als konkrete Anklage wegen richterlicher Korruption wiedergegeben.
  alternative: Allgemeiner formulieren, sie seien habgierig gewesen oder hätten ungerecht gehandelt.
  rationale: 'Der hebräische Text häuft rechtlich geprägte Ausdrücke: unrechter Gewinn, Bestechung und Beugung des Rechts. Diese forensische Schärfe soll nicht abgeschwächt werden.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wegmetapher des Hebräischen bleibt erhalten; die Wendungen „Bestechungsgelder annehmen“ und „das Recht beugen“ machen den gerichtlichen Kontext klar. Die Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Formulierung.
