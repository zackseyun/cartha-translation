base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/002.yaml
  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: de
  text: Sein erstgeborener Sohn hieß Joel, und sein zweiter hieß Abija; sie waren Richter in Beerscheba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: hieß
  rationale: Die hebräische Namensformel wird im modernen Deutschen natürlich mit „hieß“ wiedergegeben; damit bleibt ihre Aussage vollständig erhalten, ohne das schwerfällige „der Name war“ nachzuahmen.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: sein Erstgeborener
  rationale: „Erstgeborener“ gibt בְּכוֹר präzise wieder; das Possessivpronomen bezieht sich aus dem Kontext auf Samuel. Das ausdrücklich vorhandene בְּנוֹ ist im Deutschen durch die substantivierte Bezeichnung im Kontext hinreichend mitgemeint.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: מִשְׁנֵהוּ
  choice: sein zweiter Sohn
  rationale: Das Wort bezeichnet den Zweiten in der Reihenfolge. „Sohn“ wird zur natürlichen und eindeutigen deutschen Formulierung aus dem parallelen Satzglied ergänzt.
- source_word: אֲבִיָּה
  choice: Abija
  rationale: Die Form „Abija“ entspricht der im Deutschen üblichen biblischen Wiedergabe des hebräischen Namens.
- source_word: שֹׁפְטִים
  choice: sie waren Richter
  rationale: Das maskuline Pluralpartizip bezeichnet die fortdauernde Tätigkeit beziehungsweise Funktion der beiden Söhne.
- source_word: בִּבְאֵר שָׁבַע
  choice: in Beerscheba
  rationale: Natürliche deutsche Ortsangabe mit der etablierten deutschen Form des Ortsnamens.
