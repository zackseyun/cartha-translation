source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר זֶ֗ה יִֽהְיֶה֙ מִשְׁפַּ֣ט הַ/מֶּ֔לֶךְ אֲשֶׁ֥ר יִמְלֹ֖ךְ עֲלֵי/כֶ֑ם אֶת בְּנֵי/כֶ֣ם יִקָּ֗ח וְ/שָׂ֥ם ל/וֹ֙ בְּ/מֶרְכַּבְתּ֣/וֹ וּ/בְ/פָרָשָׁ֔י/ו וְ/רָצ֖וּ לִ/פְנֵ֥י מֶרְכַּבְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: de
  text: 'Er sagte: „So wird der König, der über euch herrschen wird, mit euch verfahren:[a] Eure Söhne wird er nehmen[b] und sie für sich in seinen Streitwagen und bei seinen Reitern einsetzen; sie werden vor seinem Streitwagen herlaufen.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Dies wird das Recht des Königs sein.“ Das hebräische Wort mischpat kann eine übliche Verfahrensweise, einen Rechtsanspruch oder eine rechtliche Ordnung bezeichnen. Hier kündigt Samuel an, wie ein König gegenüber dem Volk handeln wird.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht ausdrücklich „eure Söhne“; der Zusammenhang betrifft ihren Einsatz im königlichen Militär- und Hofdienst.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort für „Streitwagen“ steht sowohl hier als auch zuvor im Singular. Es kann den einzelnen Wagen des Königs oder kollektiv seine Streitwagen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: so wird … mit euch verfahren
  rationale: מִשְׁפַּט kann hier die übliche Verfahrensweise, einen Rechtsanspruch oder eine rechtliche Ordnung bezeichnen. Die verbale Wiedergabe beschreibt verständlich das angekündigte königliche Verhalten, ohne es als moralisch oder rechtlich legitim zu bestätigen.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: der König, der über euch herrschen wird
  rationale: Die Formulierung bewahrt sowohl den königlichen Sinn von מלך als auch die auf die Israeliten ausgeübte Herrschaft.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: Eure Söhne wird er nehmen
  rationale: בָּנִים bezeichnet hier ausdrücklich die Söhne; der militärische Zusammenhang bestätigt diese geschlechtsspezifische Bedeutung. Die Voranstellung entspricht der Hervorhebung im Hebräischen.
- source_word: וְשָׂם לוֹ
  choice: und sie … einsetzen
  rationale: שׂים mit לֹו bezeichnet hier die Einsetzung in den Dienst des Königs. „Einsetzen“ ist natürliches Deutsch und lässt den Zwang erkennen, ohne ihn zusätzlich auszudeuten.
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: für seine Streitwagen
  rationale: Das singularische מֶרְכָּבָה kann kollektiv den Streitwagenbereich bezeichnen. Der Plural ist im Deutschen für die Zuweisung mehrerer Söhne zu diesem königlichen Dienst natürlich.
- source_word: וּבְפָרָשָׁיו
  choice: und seine Reiter
  rationale: פָּרָשׁ bezeichnet einen Reiter beziehungsweise die Reiterei. „Für seine … Reiter einsetzen“ gibt die Eingliederung in diesen militärischen Verband idiomatisch wieder.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: sie werden vor seinem Streitwagen herlaufen
  rationale: Die Schlusswendung wird bewusst mit dem formalen Singular wiedergegeben und beschreibt königliche Läufer vor dem Wagen.
theological_decisions:
- issue: Ob מִשְׁפַּט ein legitimes Königsrecht oder das faktische Verhalten des Königs bezeichnet
  choice: Im Haupttext als angekündigte Verfahrensweise wiedergegeben
  alternative: „Dies wird das Recht des Königs sein“
  rationale: Der Zusammenhang ist eine Warnung vor den Forderungen des künftigen Königs. Die gewählte Fassung behauptet daher nicht, dass Gott diese Handlungen moralisch billigt, verschweigt aber die mögliche rechtliche Bedeutung des Wortes nicht; sie wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und eindringlich. „Streitwagen“ und „Reiter“ sind allgemein verständliche historische Militärbegriffe; „herlaufen“ vermittelt die Bewegung vor dem königlichen Wagen ohne unnötig technische Erläuterung.
