  yaml_path: translation/ot/1_samuel/008/010.yaml
  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: de
  text: Da teilte Samuel dem Volk alle Worte Jahwes mit, das ihn um einen König bat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das ihn um einen König gebeten hatte«. Das hebräische Partizip kann eine noch andauernde Handlung bezeichnen oder das Volk als diejenigen kennzeichnen, die ihn darum gebeten hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: teilte … mit
  rationale: Das Verb bedeutet grundlegend »sagen«. In Verbindung mit »alle Worte« gibt »teilte … mit« den Berichtsvorgang im heutigen Deutsch natürlich wieder, ohne den Inhalt abzuschwächen.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: alle Worte Jahwes
  rationale: Die relativ formale Wiedergabe bewahrt sowohl den Nachdruck auf der Gesamtheit der Botschaft als auch die biblische Ausdrucksweise »Worte Jahwes«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶל הָעָם
  choice: dem Volk
  rationale: Beim deutschen Verb »mitteilen« wird der Empfänger idiomatisch im Dativ ausgedrückt; der hebräische Text nennt schlicht »das Volk«.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: das von ihm einen König verlangte
  rationale: Das substantivierte Partizip bezeichnet das Volk als die Gruppe, die ihre Forderung an Samuel richtet. »Verlangte« passt zum Kontext einer nachdrücklichen Bitte, ohne die zeitliche Mehrdeutigkeit unnötig festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. Die Wiedergabe als »Jahwe« erhält den Eigennamen sichtbar, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Zeitlicher bzw. aspektueller Wert des Partizips הַשֹּׁאֲלִים
  choice: das … verlangte
  alternative: das … verlangt hatte
  rationale: Das hebräische Partizip kann eine fortdauernde Handlung oder eine durch die Bitte gekennzeichnete Gruppe bezeichnen. Die Hauptfassung bleibt zeitlich offen; die vorzeitige Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt wie der hebräische Text die vollständige göttliche Botschaft hervor; »Jahwe« bewahrt den persönlichen Gottesnamen.
