lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: versammelten sich
  rationale: Die Hitpael-Form von קבץ bezeichnet hier das Zusammenkommen als Gruppe. „Sich versammeln“ gibt dies im Deutschen natürlich und präzise wieder.
- source_word: כֹּל
  choice: alle
  rationale: „Alle“ gibt den umfassenden Bezug auf die Ältesten Israels direkt wieder.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: Ältesten Israels
  rationale: Dies ist die übliche Bezeichnung für die führenden Repräsentanten Israels und bewahrt den gesellschaftlich-politischen Sinn.
- source_word: וַיָּבֹאוּ אֶל
  choice: kamen zu
  rationale: בוא mit אֶל bezeichnet die Bewegung auf eine Person hin; „kamen zu“ folgt der hebräischen Erzählperspektive und klingt im Deutschen natürlich.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: הָרָמָתָה
  choice: nach Rama
  rationale: Das direktive He bezeichnet eine Bewegung auf Rama zu. „Nach Rama“ bildet diese Zielrichtung im Deutschen genauer und idiomatisch ab.
