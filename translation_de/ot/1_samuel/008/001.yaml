  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: de
  text: Als Samuel alt geworden war, setzte er seine Söhne als Richter für Israel ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte seine Söhne zu Richtern über Israel“. Das hebräische Verb bedeutet wörtlich „setzen“, und die Präposition vor „Israel“ kann hier sowohl im Sinn von „für“ als auch von „über“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählformel leitet hier einen zeitlichen Nebensatz ein. „Als“ gibt ihre Funktion in natürlichem modernem Deutsch wieder, ohne die Wendung unnötig wörtlich als „Und es geschah, als“ nachzubilden.
- source_word: זָקֵן
  choice: alt geworden war
  rationale: Das Verb bezeichnet das Altwerden und nicht nur einen statischen Alterszustand. Das deutsche Plusquamperfekt fügt sich natürlich in den mit „Als“ eingeleiteten zeitlichen Rahmen ein.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: וַיָּשֶׂם
  choice: setzte … ein
  rationale: Das Grundverb bedeutet „setzen/stellen“; zusammen mit der Amtsbezeichnung gibt „einsetzen“ die Übertragung einer Aufgabe oder eines Amtes idiomatisch wieder.
- source_word: אֶת בָּנָיו
  choice: seine Söhne
  rationale: Der hebräische Ausdruck bezeichnet ausdrücklich seine männlichen Nachkommen.
- source_word: שֹׁפְטִים
  choice: Richter
  rationale: Die Bezeichnung umfasst im Kontext eine richterliche und leitende Funktion. „Richter“ bewahrt den etablierten Ausdruck, ohne die Rolle einseitig auszuweiten.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Die Präposition לְ kann hier die Bezugsgruppe bezeichnen, für die das Richteramt ausgeübt wird. „Für Israel“ ist nah am Hebräischen und im Deutschen natürlich; eine Deutung als Autoritätsverhältnis bleibt in der Fußnote sichtbar.
