  yaml_path: translation/ot/1_samuel/008/015.yaml
  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: de
  text: Von eurem Saatgut und euren Weinbergen wird er den Zehnten nehmen und ihn seinen Hofbeamten[a] und seinen Dienern geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eunuchen“. Das hebräische Wort סָרִיסָיו kann sowohl Eunuchen als auch allgemeiner königliche Hofbeamte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: eurem Saatgut
  rationale: זֶרַע bedeutet wörtlich „Samen/Saatgut“ und kann im landwirtschaftlichen Zusammenhang auch das aus der Aussaat Gewonnene bezeichnen. „Saatgut“ bewahrt das konkrete Bild und ist im Deutschen natürlich verständlich.
- source_word: כַרְמֵיכֶם
  choice: euren Weinbergen
  rationale: כֶּרֶם bezeichnet gewöhnlich einen Weinberg. Die direkte Wiedergabe lässt wie im Hebräischen offen, ob die Abgabe vom Ertrag oder umfassender vom landwirtschaftlichen Besitz gedacht ist.
- source_word: יַעְשֹׂר
  choice: wird er den Zehnten nehmen
  rationale: Das Hifil von עשר bezeichnet hier das Erheben beziehungsweise Nehmen eines Zehntels. Diese Formulierung macht den zwangsweisen Charakter im Warnzusammenhang deutlich, ohne auf das religiös konnotierte Verb „verzehnten“ auszuweichen.
- source_word: וְנָתַן
  choice: und ihn ... geben
  rationale: Das waw mit Qatal setzt nach dem Imperfekt die zukünftige Handlungsfolge fort. Das Pronomen „ihn“ nimmt im Deutschen natürlich „den Zehnten“ wieder auf.
- source_word: לְסָרִיסָיו
  choice: seinen Hofbeamten
  rationale: סָרִיס kann sowohl einen Eunuchen als auch einen königlichen Hofbeamten bezeichnen. Im administrativen Zusammenhang gibt „Hofbeamte“ die Funktion treffend wieder; die engere Bedeutung bleibt in der Fußnote erhalten.
- source_word: וְלַעֲבָדָיו
  choice: seinen Dienern
  rationale: עֶבֶד kann je nach Zusammenhang „Diener“ oder „Sklave“ bedeuten. Hier bezeichnet es Personal des Königs; „Diener“ vermeidet eine nicht sicher festgelegte Aussage über dessen Rechtsstatus.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „Von eurem ...“ bildet die hervorgehobenen hebräischen Objekte ab. „Den Zehnten nehmen“ ist verständlicher als „verzehnten“ und bewahrt den warnenden Ton.
