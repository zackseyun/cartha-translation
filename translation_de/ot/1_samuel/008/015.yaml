  terminology: „Saatgut“, „Weinberge“, „Hofbeamte“ und „Diener“ sind sachgerecht. „Hofbeamte“ gibt die im Kontext naheliegende weitere Bedeutung von סָרִיסָיו wieder; die Fußnote bewahrt korrekt die mögliche Bedeutung „Eunuchen“. „Diener“ legt für עֲבָדָיו keinen nicht gesicherten Rechtsstatus fest.
