  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Hebräischen präzise wieder: Der König erhebt ein Zehntel von Saatgut und Weinbergen und verteilt es an sein Personal. „Den Zehnten nehmen“ trifft יַעֲשֹׂר im warnenden Kontext angemessen. Die Possessivbezüge („eurem“, „seinen“) sind klar erhalten.'
