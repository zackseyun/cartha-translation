  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: de
  text: Im sechsunddreißigsten Jahr der Regierungszeit Asas[a] zog Bascha, der König von Israel, gegen Juda herauf und baute Rama, um niemandem den Zugang zu Asa, dem König von Juda, oder den Weggang von ihm zu ermöglichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »im sechsunddreißigsten Jahr der Regierungszeit Asas«. Diese Angabe steht in chronologischer Spannung zu den Angaben über Bascha in 1. Könige. Manche rechnen hier vom Zeitpunkt der Reichsteilung an; andere vermuten eine textkritische Änderung zur Harmonisierung.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֵׁשׁ
  choice: Im sechsunddreißigsten Jahr
  rationale: Die mit ב eingeleitete Zeitangabe wird im Deutschen idiomatisch als „Im sechsunddreißigsten Jahr“ wiedergegeben.
- source_word: לְמַלְכוּת אָסָא
  choice: der Herrschaft Asas
  rationale: מַלְכוּת bezeichnet hier Asas königliche Herrschaft beziehungsweise Regierungszeit; „Herrschaft Asas“ bewahrt den Wortlaut und den zeitlichen Bezug.
- source_word: עָלָה ... עַל יְהוּדָה
  choice: zog ... gegen Juda herauf
  rationale: עלה mit עַל beschreibt im militärischen Zusammenhang das Hinaufziehen gegen ein Gebiet; die Formulierung wahrt sowohl Richtungsvorstellung als auch feindliche Absicht.
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: und baute Rama aus
  rationale: בנה bedeutet grundsätzlich „bauen“. „Rama ausbauen“ ist im Deutschen natürlich und lässt die kontextuell naheliegende Befestigung erkennen, ohne ausdrücklich „befestigen“ in den Text einzutragen.
- source_word: לְבִלְתִּי תֵּת
  choice: um zu verhindern
  rationale: Die Verbindung bezeichnet einen verneinten Zweck beziehungsweise die Verhinderung einer Handlung; „um zu verhindern“ ist klar und idiomatisch.
- source_word: יוֹצֵא וָבָא
  choice: hinaus- oder hineinging
  rationale: Das hebräische Wortpaar wird möglichst eng abgebildet. Die deutschen Richtungsadverbien beziehen die Bewegung auf Asa beziehungsweise seinen Herrschaftsbereich.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: zu Asa, dem König von Juda
  rationale: ל bezeichnet hier die Beziehung beziehungsweise Bewegungsrichtung zu Asa. Die Apposition wird im Deutschen mit Kommas gesetzt.
theological_decisions:
- issue: Chronologische Spannung zur Regierungszeit Baschas nach 1 Könige
  choice: Die masoretische Lesart „im sechsunddreißigsten Jahr der Herrschaft Asas“ bleibt im Haupttext stehen.
  alternative: Zählung ab der Reichsteilung; oder textkritische Änderung zum sechsundzwanzigsten Jahr Asas.
  rationale: Der hebräische Text nennt eindeutig das sechsunddreißigste Jahr von Asas Herrschaft. Die chronologische Schwierigkeit darf nicht stillschweigend harmonisiert oder durch eine Konjektur beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bascha“ und „Rama“ folgen den im Deutschen üblichen biblischen Namensformen. Die Formulierung bleibt nah am Hebräischen, ohne die chronologische Spannung oder die genaue Art des Bauens dogmatisch beziehungsweise historisch aufzulösen.
