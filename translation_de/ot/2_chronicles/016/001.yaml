- from: Im sechsunddreißigsten Jahr der Herrschaft Asas[a] zog Bascha, der König von Israel, gegen Juda herauf und baute Rama aus, um zu verhindern, dass jemand zu Asa, dem König von Juda, hinaus- oder hineinging.
  to: Im sechsunddreißigsten Jahr der Regierungszeit Asas[a] zog Bascha, der König von Israel, gegen Juda herauf und baute Rama, um niemandem den Zugang zu Asa, dem König von Juda, oder den Weggang von ihm zu ermöglichen.
  rationale: Die Revision beseitigt die im Deutschen unklare Richtungsbeziehung der Bewegungsformel und vermeidet mit „baute Rama“ die mögliche Zusatzbedeutung einer bloßen Stadterweiterung. Die Haupttextlesart und die Fußnote behalten die masoretische chronologische Angabe sowie die dokumentierte Spannung unverändert in der Sache bei.
