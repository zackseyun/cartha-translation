  source_fidelity: 'Die Zeitangabe, die militärische Bewegung, die Namen und die absichtliche Beibehaltung der chronologischen Spannung entsprechen dem masoretischen Text. Die Wendung „zu Asa … hinaus- oder hineinging“ bildet jedoch die hebräische Bewegungsformel im Deutschen nicht sinnvoll ab: Beide Richtungsadverbien werden dadurch fälschlich gleichermaßen auf „zu Asa“ bezogen. Der Zweck ist, den Verkehr bzw. Zugang und Weggang in Beziehung zu Asa zu unterbinden.'
  naturalness: Der Satz ist insgesamt würdevoll und modernes Standarddeutsch. „Rama ausbauen“ kann allerdings speziell eine Erweiterung nahelegen, die בנה nicht ausdrücklich sagt. „Rama bauen“ bleibt näher am einfachen Verb. Die überarbeitete Zweckformulierung ist idiomatisch und verständlich.
  terminology: „Bascha“, „Juda“, „Rama“ und „König von Juda“ sind angemessene deutsche biblische Namens- und Amtsformen. „Regierungszeit Asas“ ist für die zeitliche Bedeutung von מַלְכוּת besonders klar. Die Fußnote bewahrt die textliche Schwierigkeit, ohne eine Harmonisierung vorzuziehen.
  issues:
