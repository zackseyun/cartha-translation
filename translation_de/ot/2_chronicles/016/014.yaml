- from: Sie begruben ihn in seiner Grabstätte[a], die er sich in der Davidstadt ausgehauen hatte. Dann betteten sie ihn auf ein Lager[b], das mit Duftstoffen und verschiedenartigen, nach der Kunst der Salbenmischer zubereiteten Gewürzmischungen gefüllt worden war. Ihm zu Ehren veranstalteten sie einen überaus großen Brand[c].
  to: Sie begruben ihn in seiner Grabstätte[a], die er sich in der Davidstadt ausgehauen hatte. Dann betteten sie ihn auf ein Lager[b], das mit Duftstoffen und verschiedenen kunstvoll zubereiteten Mischungen gefüllt worden war. Ihm zu Ehren ließen sie ein sehr großes Feuer brennen[c].
  rationale: Die Überarbeitung ersetzt das im heutigen Deutsch missverständliche „Brand veranstalten“ durch eine natürliche Formulierung für einen bewusst ausgeführten Verbrennungsvorgang. Sie vermeidet außerdem die kulinarische Nebenbedeutung von „Gewürzmischungen“ und formuliert die historische Erklärung in der Fußnote mit der gebotenen textlichen Zurückhaltung. Satzfolge, Bestattungsbild, Ortsname und die im Hebräischen vorhandene Mehrzahl bei „Gräbern“ bleiben gewahrt.
