  source_fidelity: Die Grundstruktur und die wesentlichen Bezüge des Hebräischen sind zutreffend wiedergegeben. „Grabstätte“ mit Fußnote bewahrt den im Hebräischen stehenden Plural, ohne im deutschen Haupttext künstlich mehrere einzelne Gräber nahezulegen. Die Wiedergabe des Schlusses als „Brand“ ist jedoch im Deutschen missverständlich und klingt nach einem Schadenfeuer; zudem legt die Fußnote die Deutung gegen eine Einäscherung etwas zu bestimmt fest, obwohl der Gegenstand des Verbrennens im Text nicht genannt wird.
  naturalness: Der Text ist insgesamt gut verständliches modernes Standarddeutsch. „einen überaus großen Brand veranstalten“ ist allerdings keine natürliche Bezeichnung für einen Bestattungsbrauch. „ein sehr großes Feuer brennen“ gibt den Vorgang idiomatischer wieder, ohne den verbrannten Gegenstand festzulegen. „Gewürzmischungen“ ist für aromatische Salben bzw. Duftpräparate weniger präzise, weil es im heutigen Deutsch vor allem kulinarische Gewürze bezeichnet.
